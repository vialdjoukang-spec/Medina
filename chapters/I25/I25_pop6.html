
<!-- ===== FENÊTRES PARETO ===== -->
<template data-pop="pareto-i25-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="i25-1,i25-2"></p>
<ul><li>SCC (ESC 2019, 2024) : anomalies structurelles ou fonctionnelles des coronaires épicardiques ou de la microcirculation → déséquilibre apports-besoins transitoire et réversible.</li><li>Angor : constrictif rétrosternal + déclenché par l’effort ou l’émotion + soulagé en quelques minutes par le repos ou la trinitrine. 3/3 typique, 2/3 atypique, ≤ 1/3 non angineux ; la dyspnée est une catégorie propre.</li><li>Gravité : classe canadienne I–IV. Angor de repos récent, crescendo ou &gt; 20 min = SCA (chapitre I21).</li><li>ANOCA = angor, INOCA = ischémie, sans sténose obstructive (&lt; 50 % ou FFR &gt; 0,80) ; ≈ la moitié des coronarographies pour angor.</li><li>Suisse 2024 (OFS) : ≈ 20 000 décès cardiovasculaires sur ≈ 72 000 (26 %).</li><li>Pronostic : FEVG, étendue anatomique, étendue de l’ischémie, terrain.</li></ul></template>

<template data-pop="pareto-i25-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i25-3"></p>
<ul><li>Extraction d’O₂ déjà ≈ 70–75 % au repos → hausse des besoins = hausse du débit.</li><li>Besoins : fréquence, contractilité, tension pariétale. Apports : pression diastolique, durée de la diastole, résistances. Chaque anti-angineux agit sur un terme.</li><li>Sténose : réserve ↓ dès ≈ 50 % ; débit de repos ↓ au-delà de ≈ 85–90 % (Gould).</li><li>Le % visuel prédit mal l’effet hémodynamique → FFR.</li><li>Cascade : perfusion → métabolisme → diastole → cinétique → ECG → douleur ; l’imagerie de perfusion est la plus précoce ; ischémie silencieuse possible.</li><li>Trois mécanismes : sténose fixe, microcirculation, spasme.</li><li>Ischémie répétée → sidération, hibernation (récupérable), cicatrice (non) → cardiomyopathie ischémique.</li><li>Infarctus sur plaque souvent peu sténosante → prévention systémique ; ISCHEMIA : stratégie invasive = moins d’angor, pas moins de décès ni d’infarctus.</li></ul></template>

<template data-pop="pareto-i25-etio" data-title="Pareto — Étiologies et facteurs de risque">
<p class="ratio" data-cover="i25-4"></p>
<ul><li>Athérosclérose d’abord ; aussi spasme, microcirculation, pont myocardique, anomalies coronaires, radiothérapie, vascularites.</li><li>Ischémie sur coronaires saines : rétrécissement aortique, cardiomyopathie hypertrophique, tachyarythmie, anémie, thyrotoxicose.</li><li>Modèle ESC : cinq facteurs comptés (famille précoce, tabac actuel ou ancien, dyslipidémie, hypertension, diabète) → 0–1 / 2–3 / 4–5.</li><li>Modificateurs : lipoprotéine(a), hypercholestérolémie familiale, insuffisance rénale, inflammation chronique, grossesse compliquée.</li><li>Toujours ausculter : souffle aortique = angor possible sans coronaropathie.</li></ul></template>

<template data-pop="pareto-i25-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i25-5,i25-6"></p>
<ul><li>Sept questions : siège, type, irradiation, déclencheur, durée (2–10 min), soulagement, évolution.</li><li>Instabilité à chaque consultation → chapitre I21.</li><li>Angor nocturne ou matinal au repos → vasospasme ; angor prolongé après l’effort, peu sensible aux nitrés → microcirculation ; dyspnée d’effort → équivalent.</li><li>Examen souvent normal ; B4 pendant la crise, souffle d’insuffisance mitrale ischémique ; cherche une cause non coronaire (souffle aortique, cardiomyopathie hypertrophique, anémie, thyroïde), le terrain (pouls, index de pression systolique, xanthomes), le retentissement (insuffisance cardiaque).</li><li>Pression aux deux bras : asymétrie &gt; 15 mmHg = sténose sous-clavière (vol coronaire si greffon mammaire).</li></ul></template>

<template data-pop="pareto-i25-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i25-7"></p>
<ul><li>Quatre étapes : clinique (exclure un SCA) + ECG + biologie + échocardiographie → probabilité RF-CL ajustée → examen → risque.</li><li>≤ 5 % : différer ; &gt; 5–50 % : coroscanner (I) ; &gt; 15–85 % : imagerie de stress (I) ; &gt; 85 % ou haut risque : coronarographie + FFR/iFR.</li><li>Examen anatomique pour exclure, fonctionnel pour confirmer ; score calcique pour reclasser ; FFR-CT pour une sténose intermédiaire au scanner.</li><li>ECG d’effort : plus en première intention diagnostique.</li><li>Haut risque (tronc commun, tritronculaire, ischémie étendue) → coronarographie ; sinon traitement médical d’abord.</li><li>Ischémie silencieuse : diabétique, âgé, rénal ; pas de dépistage systématique chez le diabétique asymptomatique (DIAD, FACTOR-64) ; si démontrée, même conduite que l’angor.</li><li>Différentiels graves : SCA, dissection aortique, embolie pulmonaire, tamponnade.</li></ul></template>

<template data-pop="pareto-i25-antiang" data-title="Pareto — Traitement anti-angineux">
<p class="ratio" data-cover="i25-8,i25-9"></p>
<ul><li>Urgence : douleur de repos, ou non soulagée 5 min après la trinitrine, crescendo, syncope → 144.</li><li>Anti-angineux = symptômes ; aucun ne réduit la mortalité dans le SCC sans infarctus ni insuffisance cardiaque.</li><li>Tous : trinitrine sublinguale (I).</li><li>Première ligne (I) : bêtabloquant (fréquence 55–60) ou inhibiteur calcique, selon fréquence, pression, FEVG ; puis bêtabloquant + dihydropyridine.</li><li>Jamais bêtabloquant + vérapamil ; pas de vérapamil ni de diltiazem si FEVG réduite.</li><li>Deuxième ligne : nitrés de longue durée d’action, ranolazine, ivabradine (IIa ; ivabradine seulement si FEVG &lt; 40 %) ; trimétazidine, nicorandil (IIb).</li><li>Échec : vérifier observance et causes aggravantes → coronarographie pour revascularisation symptomatique (I). Réfractaire : réducteur du sinus coronaire (IIb).</li><li>Arrêt prématuré de la double antiagrégation = premier facteur de thrombose de stent.</li></ul></template>

<template data-pop="pareto-i25-prev" data-title="Pareto — Prévention des événements">
<p class="ratio" data-cover="i25-10"></p>
<ul><li>Mode de vie : tabac, 150–300 min/semaine, alimentation méditerranéenne ; réadaptation (I, ESC 2026).</li><li>Acide acétylsalicylique 75–100 mg (I) ou clopidogrel 75 mg (alternative, I).</li><li>Après angioplastie élective : acide acétylsalicylique + clopidogrel 6 mois (1–3 mois si risque hémorragique élevé).</li><li>Risque ischémique élevé sans risque hémorragique : + P2Y12 ou rivaroxaban 2,5 mg × 2 (IIa).</li><li>LDL &lt; 1,4 mmol/L et − 50 % : statine haute intensité → ézétimibe → anti-PCSK9 ; acide bempédoïque si intolérance ; lipoprotéine(a) une fois.</li><li>Colchicine 0,5 mg (IIa).</li><li>Diabète : iSGLT2 + agoniste du GLP-1 (I) ; obésité sans diabète : sémaglutide (IIa).</li><li>IEC si hypertension, diabète, rein, FEVG réduite. Bêtabloquant au long cours si FEVG &lt; 50 % (ICFEr, ESC 2026) ; après infarctus, bénéfice à 40–49 % (méta-analyse 2025) ; à ≥ 50 %, données divergentes (REDUCE-AMI et REBOOT négatifs, BETAMI-DANBLOCK positif surtout sur la récidive d’infarctus).</li><li>Protéine C réactive ultrasensible &gt; 2 mg/L = risque inflammatoire résiduel (ESC/EAS 2025).</li><li>PAS 120–129 mmHg ; vaccination antigrippale.</li></ul></template>

<template data-pop="pareto-i25-revasc" data-title="Pareto — Revascularisation">
<p class="ratio" data-cover="i25-11"></p>
<ul><li>Deux indications : symptômes réfractaires (I) ; pronostic (tronc commun, tritronculaire, interventriculaire antérieure proximale, FEVG ≤ 35 % pluritronculaire).</li><li>« Significative » = ≥ 90 % ou FFR ≤ 0,80 ou iFR ≤ 0,89 ou ischémie démontrée (FAME).</li><li>ISCHEMIA : pas de bénéfice pronostique d’une stratégie invasive systématique hors tronc commun et FEVG &lt; 35 %. ORBITA-2 : l’angioplastie réduit l’angor.</li><li>FEVG ≤ 35 % : pontage (STICHES) ; angioplastie sans bénéfice pronostique (REVIVED-BCIS2).</li><li>SYNTAX ≤ 22 / 23–32 / ≥ 33. Tronc commun : pontage préféré, angioplastie si faible complexité. Tritronculaire diabétique ou complexe : pontage (FREEDOM, SYNTAX).</li><li>Heart Team (I) ; imagerie endocoronaire pour les lésions complexes (I) ; voie radiale (I).</li></ul></template>

<template data-pop="pareto-i25-anoca" data-title="Pareto — Angor et ischémie sans sténose obstructive, vasospasme">
<p class="ratio" data-cover="i25-12"></p>
<ul><li>Toujours y penser devant un angor sans sténose ; nommer l’endotype (l’ancien « syndrome X » est abandonné). Angor de Prinzmetal = vasospasme épicardique.</li><li>Endotypes : microcirculation (réserve &lt; 2,0, IMR ≥ 25) ; spasme microvasculaire ; vasospasme épicardique ; mixte.</li><li>Tests invasifs : FFR → réserve coronaire et IMR → acétylcholine (2, 20, 100 µg à gauche).</li><li>Vasospasme : constriction ≥ 90 % + douleur + ECG. Spasme microvasculaire : douleur + ECG sans constriction ≥ 90 %.</li><li>CorMicA : traitement guidé = moins d’angor.</li><li>Spasme : inhibiteur calcique (I), nitré de longue durée d’action, arrêt du tabac ; pas de bêtabloquant non sélectif. Microcirculation : bêtabloquant, inhibiteur calcique, ranolazine, IEC, statine.</li></ul></template>

<template data-pop="pareto-i25-cmi" data-title="Pareto — Cardiomyopathie ischémique et anévrisme">
<p class="ratio" data-cover="i25-13"></p>
<ul><li>Cardiomyopathie ischémique = cicatrices + hibernation + remodelage ; première cause d’ICFEr.</li><li>ESC 2026 : ICFEr = FEVG &lt; 50 % → quatre classes, dont le bêtabloquant ; seuils des dispositifs et de STICH inchangés (≤ 35 %).</li><li>Traitement de l’insuffisance cardiaque (quatre classes) + Heart Team : pontage si FEVG ≤ 35 % pluritronculaire ; défibrillateur si FEVG ≤ 35 % après ≥ 3 mois de traitement (≥ 40 jours après infarctus, ≥ 90 jours après revascularisation).</li><li>Viabilité : informe, ne décide pas seule (STICH).</li><li>Anévrisme vrai : infarctus antérieur, collet large, paroi fibreuse, rupture rare ; ECG Q + ST persistant.</li><li>Complications : insuffisance cardiaque, thrombus (anticoagulation 3–6 mois), tachycardie ventriculaire.</li><li>Pseudo-anévrisme : collet étroit, rupture contenue → chirurgie.</li></ul></template>

<template data-pop="pareto-i25-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i25-14,i25-15"></p>
<ul><li>Lipides 4–6 semaines après chaque changement ; bilan annuel des symptômes, cibles, ECG ; imagerie si changement clinique, pas de stress systématique.</li><li>Réadaptation (ESC 2026, I) : après pontage, débuter dans les 28 jours, au plus tard 42 ; centre, domicile ou hybride.</li><li>Conduite : permis privé conservé après angioplastie élective ; directives suisses 2024.</li><li>Grossesse : pas de statine, d’IEC, d’ivabradine, de ranolazine ; penser à la dissection coronaire.</li><li>Rein (ESC/ERA 2026) : DFG + rapport albumine/créatinine chez tout patient cardiovasculaire ; iSGLT2, blocage du système rénine-angiotensine, finérénone, statine ; contraste ; colchicine et ranolazine contre-indiquées si insuffisance sévère.</li><li>Chirurgie non cardiaque : différer ≈ 6 mois après angioplastie élective ; garder l’acide acétylsalicylique.</li><li>Fibrillation auriculaire à distance d’une angioplastie : anticoagulant seul (AFIRE).</li><li>Nitrés ou nicorandil + inhibiteurs de la phosphodiestérase de type 5 : contre-indiqués.</li></ul></template>

<template data-pop="pareto-i25-bio" data-title="Pareto — Biologie">
<p class="ratio" data-cover="i25-e-2"></p>
<ul><li>Lipides (cible LDL &lt; 1,4 mmol/L et − 50 %), lipoprotéine(a) une fois, protéine C réactive ultrasensible (&gt; 2 mg/L = risque inflammatoire), HbA1c (&lt; 5,7 % normal ; 5,7–6,4 % prédiabète ; ≥ 6,5 % diabète), hémogramme, créatinine/DFG, K⁺, transaminases ; TSH si suspicion.</li><li>Troponine seulement si un SCA est suspecté ; élévation chronique stable ≠ infarctus.</li><li>NT-proBNP si dyspnée ou dysfonction suspectée.</li><li>LDL non traité &gt; 4,9 mmol/L : hypercholestérolémie familiale.</li></ul></template>

<template data-pop="pareto-i25-noninv" data-title="Pareto — Examens non invasifs">
<p class="ratio" data-cover="i25-e-3,i25-e-4,i25-e-5"></p>
<ul><li>ECG de repos souvent normal ; pendant une crise : sous-décalage (effort) ou sus-décalage (spasme).</li><li>ECG d’effort : ST horizontal ou descendant ≥ 1 mm à 60–80 ms ; ≥ 85 % de la fréquence maximale ; ininterprétable si bloc de branche gauche, stimulation, pré-excitation, digoxine ; Duke ≤ − 11 = haut risque.</li><li>Coroscanner : fréquence &lt; 65/min ; CAD-RADS 0–5 (4B = tronc ≥ 50 % ou tritronculaire ≥ 70 %) ; plaques à haut risque ; SCOT-HEART.</li><li>Score calcique 0 : maladie obstructive très improbable chez un patient à probabilité basse ; ne voit pas les plaques molles.</li><li>FFR-CT ≤ 0,80 à 1–2 cm en aval.</li><li>Haut risque : ischémie ≥ 10 % (scintigraphie, TEP) ; ≥ 3/16 segments (écho de stress) ; ≥ 2/16 (IRM de perfusion).</li><li>Vasodilatateurs : pas de caféine 12–24 h ; contre-indiqués si bronchospasme ou bloc de haut degré. Ischémie équilibrée tritronculaire : scintigraphie faussement rassurante.</li></ul></template>

<template data-pop="pareto-i25-inv" data-title="Pareto — Physiologie invasive">
<p class="ratio" data-cover="i25-e-6"></p>
<ul><li>Coronarographie radiale = gold standard anatomique, ne dit pas l’ischémie.</li><li>FFR = Pd/Pa en hyperhémie ; ≤ 0,80 significative (zone grise 0,75–0,80). iFR ≤ 0,89 sans adénosine.</li><li>Pièges : microcirculation altérée (FFR faussement normale), lésions en série, infarctus aigu.</li><li>IVUS ou OCT pour les lésions complexes (I).</li><li>ANOCA : réserve &lt; 2,0, IMR ≥ 25, acétylcholine (constriction ≥ 90 % = spasme épicardique).</li></ul></template>

<template data-pop="pareto-i25-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i25-e-1,i25-e-2,i25-e-3,i25-e-4,i25-e-5,i25-e-6"></p>
<ul><li>Trois questions : anatomie, ischémie, pronostic.</li><li>Tous : ECG, échocardiographie de repos, biologie.</li><li>Coroscanner = référence non invasive de l’anatomie (probabilité &gt; 5–50 %) ; imagerie de stress (&gt; 15–85 %) ; coronarographie + FFR/iFR = gold standard (très élevée, haut risque).</li><li>Seuils : FFR ≤ 0,80 ; iFR ≤ 0,89 ; FFR-CT ≤ 0,80 ; réserve &lt; 2,0 ; IMR ≥ 25 ; ischémie ≥ 10 %.</li><li>ECG d’effort : pronostic et tolérance ; Duke.</li><li>Troponine : seulement si un SCA est suspecté.</li></ul></template>

<template data-pop="pareto-i25-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i25-sa,i25-sh,i25-sp,i25-sb,i25-sg"></p>
<ul><li>Trois compartiments : épicardiques (conduction, visibles), pré-artérioles, artérioles (résistance, autorégulation, invisibles).</li><li>Ventricule gauche perfusé en diastole ; sous-endocarde vulnérable → sous-décalage du ST ; tachycardie = moins de perfusion.</li><li>Plaque : LDL retenu → macrophages spumeux → chape fibreuse ; stable (chape épaisse, angor) vs vulnérable (chape fine, SCA). Statines épaississent la chape.</li><li>Stent actif : antiprolifératif → moins de resténose, endothélialisation retardée → double antiagrégation.</li><li>Débit = pression / résistance ; Poiseuille : r⁴ ; ΔP = F × Q + S × Q².</li><li>Réserve coronaire 3–5 (intègre épicarde + microcirculation) ; FFR = Pd/Pa en hyperhémie (sténose seule).</li><li>Acétylcholine : dilate si endothélium sain (monoxyde d’azote), contracte si dysfonction → test de spasme. Nitrés = monoxyde d’azote exogène ; + inhibiteurs de la phosphodiestérase de type 5 = hypotension.</li><li>Ranolazine : courant sodique tardif ; trimétazidine : bêta-oxydation → glucose.</li><li>Génétique : hypercholestérolémie familiale, lipoprotéine(a) → dépistage familial ; CYP2C19 et clopidogrel.</li></ul></template>

<template data-pop="pareto-i25-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i25-p-1,i25-p-2,i25-p-3,i25-p-4,i25-p-5"></p>
<ul><li>Anti-angineux jugés sur les symptômes ; prévention jugée sur les cibles.</li><li>Bisoprolol 2,5 → 10 mg ; métoprolol succinate 47,5 → 190 mg ; amlodipine 5 → 10 mg ; diltiazem 180 → 360 mg ; isosorbide mononitrate avec intervalle libre ; ranolazine 375 → 750 mg × 2 ; ivabradine 5 → 7,5 mg × 2.</li><li>Acide acétylsalicylique 75–100 mg ; clopidogrel 75 mg (charge 600 mg) ; rivaroxaban 2,5 mg × 2 ; atorvastatine 40–80 mg ; rosuvastatine 20–40 mg ; ézétimibe 10 mg ; colchicine 0,5 mg.</li><li>Interactions : nitrés/nicorandil + inhibiteurs de la phosphodiestérase de type 5 ; bêtabloquant + vérapamil/diltiazem ; ivabradine + vérapamil/diltiazem/CYP3A4 ; colchicine + clarithromycine ; clopidogrel + oméprazole ; simvastatine + amlodipine/diltiazem/vérapamil/ranolazine.</li><li>Suisse : ranolazine autorisée (Ranexa) ; nicorandil en génériques ; trimétazidine non commercialisée. Rosuvastatine contre-indiquée si clairance &lt; 30 ; 40 mg si &lt; 60.</li><li>À éviter : nifédipine à libération immédiate, AINS, triptans, dipyridamole, ivabradine si FEVG &gt; 40 %, bêtabloquant non sélectif dans le spasme, vitamines et compléments (III).</li></ul></template>
