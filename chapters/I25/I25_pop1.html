
<!-- ===== FENÊTRES : notions physiopathologiques ===== -->
<template data-pop="i25-cfr" data-title="Réserve coronaire">
<div class="lab">Définition</div><p>Rapport entre le débit coronaire maximal (hyperhémie induite par l’adénosine ou l’effort) et le débit de repos. Chez le sujet sain, il atteint 3 à 5.</p>
<div class="lab">Seuil</div><p>Réserve &lt; 2,0 (thermodilution invasive, TEP) : anormale. Certains laboratoires retiennent &lt; 2,5 avec le Doppler.</p>
<div class="lab">Ce qui l’abaisse</div><p>Sténose épicardique ; dysfonction microvasculaire ; débit de repos élevé (tachycardie, anémie, hypertrophie ventriculaire gauche). Elle intègre donc les deux compartiments et ne dit pas lequel est atteint.</p>
<div class="lab">Exemple</div><p>Patiente de 58 ans, angor d’effort, coroscanner sans sténose, TEP : débit de repos 0,9 mL/min/g, débit de stress 1,6 mL/min/g, réserve 1,8. Sans sténose, cette réserve abaissée signe une dysfonction microvasculaire.</p></template>

<template data-pop="i25-endoth" data-title="Fonction endothéliale et vasomotricité coronaire">
<div class="lab">Rôle</div><p>L’endothélium produit du monoxyde d’azote, de la prostacycline et des facteurs hyperpolarisants qui dilatent le vaisseau et inhibent l’adhésion des plaquettes et des leucocytes. Il produit aussi de l’endothéline, vasoconstrictrice.</p>
<div class="lab">Dysfonction</div><p>Tabac, LDL élevé, hypertension, diabète, âge et inflammation réduisent la biodisponibilité du monoxyde d’azote. La balance penche vers la vasoconstriction, l’inflammation et la thrombose. C’est la première étape de l’athérosclérose.</p>
<div class="lab">Mesure</div><p>Réponse coronaire à l’acétylcholine en salle de cathétérisme ; dilatation de l’artère brachiale médiée par le flux (recherche).</p>
<div class="lab">Corrélation thérapeutique</div><p>Arrêt du tabac, statines, IEC et activité physique améliorent la fonction endothéliale.</p></template>

<template data-pop="i25-autoreg" data-title="Autorégulation coronaire">
<div class="lab">Principe</div><p>Les artérioles ajustent leur diamètre pour maintenir un débit adapté aux besoins, quelle que soit la pression de perfusion, dans une plage d’environ 60 à 140 mmHg chez le sujet sain.</p>
<div class="lab">Médiateurs</div><p>Métaboliques (adénosine issue de la dégradation de l’ATP, baisse de la pression partielle en oxygène, hausse du dioxyde de carbone et des ions hydrogène), myogéniques (réponse à l’étirement) et endothéliaux (monoxyde d’azote, cisaillement).</p>
<div class="lab">En aval d’une sténose</div><p>Les artérioles sont déjà dilatées au repos pour compenser la perte de charge. Leur réserve de dilatation est entamée : l’effort démasque l’ischémie.</p>
<div class="lab">Corrélation</div><p>Une hypotension (sur-traitement antihypertenseur, déshydratation) peut démasquer un angor chez un patient dont l’autorégulation est épuisée en aval d’une sténose.</p></template>

<template data-pop="i25-cascade" data-title="Cascade ischémique">
<div class="lab">Ordre</div><p>1. Hétérogénéité de perfusion. 2. Anomalies métaboliques (lactate, baisse de l’ATP). 3. Dysfonction diastolique (relaxation ralentie). 4. Dysfonction systolique segmentaire. 5. Modifications de l’ECG (ST). 6. Douleur.</p>
<div class="lab">Conséquences diagnostiques</div><p>Sensibilité décroissante : imagerie de perfusion &gt; échocardiographie de stress &gt; ECG d’effort &gt; symptômes. Une épreuve d’effort sans sous-décalage du ST n’exclut pas une ischémie visible en perfusion.</p>
<div class="lab">Conséquence clinique</div><p>L’ischémie silencieuse correspond à des épisodes qui n’atteignent pas le stade de la douleur, ou chez des patients dont la perception de la douleur est altérée (diabète avec neuropathie autonome, sujet âgé).</p>
<div class="lab">Limite</div><p>Séquence décrite expérimentalement et en clinique ; l’ordre des étapes intermédiaires varie selon les patients.</p></template>

<template data-pop="i25-poiseuille" data-title="Loi de Poiseuille et pertes de charge d’une sténose">
<div class="lab">Poiseuille</div><p>Dans un tube rigide en écoulement laminaire, la résistance R = 8 × η × L / (π × r⁴), où η est la viscosité, L la longueur et r le rayon. Diviser le rayon par deux multiplie la résistance par seize.</p>
<div class="lab">Équation de la sténose</div><p>Perte de charge ΔP = F × Q + S × Q², où Q est le débit. F représente les pertes visqueuses (longueur, rayon) ; S les pertes par séparation du flux à la sortie de la sténose, qui dépendent du rapport entre la surface normale et la surface sténosée.</p>
<div class="lab">Conséquence</div><p>Quand le débit double à l’effort, le terme S × Q² quadruple. Une sténose peu gênante au repos devient limitante à l’effort ; deux sténoses modérées en série s’additionnent.</p>
<div class="lab">Limite</div><p>Les coronaires ne sont ni rigides ni rectilignes ; le modèle reste qualitatif, mais il explique la supériorité de la mesure de pression sur l’estimation visuelle.</p></template>

<template data-pop="i25-collat" data-title="Collatérales coronaires">
<div class="lab">Définition</div><p>Anastomoses entre deux territoires coronaires, préexistantes chez la plupart des sujets sous forme de fins vaisseaux, qui s’élargissent lorsqu’une sténose sévère se constitue lentement (artériogenèse, stimulée par le gradient de pression et le cisaillement).</p>
<div class="lab">Conséquence clinique</div><p>Une occlusion chronique bien suppléée peut être peu symptomatique et sans nécrose. Mais les collatérales apportent rarement plus qu’un débit de repos : l’ischémie d’effort persiste souvent.</p>
<div class="lab">Occlusion totale chronique</div><p>Occlusion de plus de trois mois. Sa recanalisation percutanée se discute pour les symptômes lorsque l’ischémie du territoire est démontrée et le myocarde viable ; son bénéfice pronostique n’est pas établi.</p></template>

<template data-pop="i25-cmd" data-title="Dysfonction microvasculaire coronaire">
<div class="lab">Définition</div><p>Anomalie de structure ou de fonction des pré-artérioles et artérioles coronaires (moins de 500 µm), responsable d’une ischémie sans sténose épicardique.</p>
<div class="lab">Mécanismes</div><p>Vasodilatation insuffisante (dysfonction endothéliale et musculaire lisse, raréfaction capillaire, remodelage artériolaire) ; ou vasoconstriction excessive (spasme microvasculaire).</p>
<div class="lab">Terrain</div><p>Femme, hypertension, diabète, obésité, maladie rénale chronique, cardiomyopathie hypertrophique, rétrécissement aortique, maladies inflammatoires.</p>
<div class="lab">Diagnostic</div><p>Réserve coronaire &lt; 2,0 et/ou IMR ≥ 25 ; ou spasme microvasculaire à l’acétylcholine. Non invasif : TEP, IRM de perfusion quantitative, Doppler de l’interventriculaire antérieure.</p>
<div class="lab">Pronostic</div><p>Excès d’événements cardiovasculaires et d’hospitalisations ; qualité de vie altérée. La dysfonction microvasculaire est aussi un mécanisme proposé de l’ICFEp.</p></template>

<template data-pop="i25-vsa" data-title="Angor vasospastique ou angor de Prinzmetal (critères COVADIS)">
<div class="lab">Histoire</div><p>Décrit par Myron Prinzmetal en 1959 comme un angor « variant » : douleur de repos, cyclique, avec sus-décalage transitoire du ST, contrairement à l’angor d’effort. Le terme « angor de Prinzmetal » désigne aujourd’hui l’angor vasospastique épicardique.</p>
<div class="lab">Critères</div><p>(1) Angor sensible aux dérivés nitrés, avec au moins un des éléments suivants : survenue au repos, surtout entre la nuit et le petit matin ; variation diurne marquée de la tolérance à l’effort (moins bonne le matin) ; déclenchement par l’hyperventilation ; prévention par les inhibiteurs calciques mais non par les bêtabloquants. (2) Modifications ischémiques transitoires de l’ECG pendant la crise : sus- ou sous-décalage du ST ≥ 1 mm ou nouvelles ondes U négatives, dans au moins deux dérivations contiguës. (3) Spasme coronaire ≥ 90 %, spontané ou provoqué, avec douleur et modifications de l’ECG.</p>
<div class="lab">Diagnostic</div><p>Certain si (1) avec (2) ou (3) ; suspecté si (1) seul, ou si les examens sont non concluants.</p>
<div class="lab">Déclencheurs</div><p>Tabac, froid, hyperventilation, stress, cocaïne, amphétamines, triptans, dérivés de l’ergot, fluoropyrimidines (5-fluorouracile, capécitabine), sevrage alcoolique, hypomagnésémie.</p>
<div class="lab">Traitement</div><p>Inhibiteur calcique à dose suffisante (classe I), éventuellement deux inhibiteurs calciques de familles différentes ; dérivé nitré de longue durée d’action ; arrêt du tabac ; éviction des déclencheurs ; éviter les bêtabloquants non sélectifs.</p>
<div class="lab">Gravité</div><p>Un spasme prolongé peut causer un infarctus, un bloc auriculoventriculaire ou une arythmie ventriculaire. Après un arrêt cardiaque sur vasospasme, un défibrillateur se discute en plus du traitement médical.</p>
<div class="lab">Mémorisation</div><p>Aide pédagogique, non critère officiel : « nitrés, ECG, spasme » — un symptôme qui répond aux nitrés, une trace électrique, une image de spasme.</p></template>

<template data-pop="i25-endotypes" data-title="Endotypes de l’ANOCA et de l’INOCA">
<div class="lab">Définition</div><p>Un endotype est le mécanisme dominant d’une maladie chez un patient donné. Dans l’ANOCA et l’INOCA, il détermine le traitement.</p>
<div class="lab">Quatre endotypes</div><p>1. Dysfonction microvasculaire par vasodilatation insuffisante (réserve coronaire basse, IMR élevé). 2. Spasme microvasculaire. 3. Vasospasme épicardique. 4. Formes mixtes. Un bilan normal oriente vers une cause non coronaire (douleur œsophagienne, pariétale, hypersensibilité viscérale).</p>
<div class="lab">Preuve</div><p>Essai CorMicA (2018) : un traitement adapté à l’endotype identifié par les tests invasifs améliore l’angor et la qualité de vie.</p>
<div class="lab">Erreur fréquente</div><p>Conclure « coronaires normales, pas de problème cardiaque » après une coronarographie sans sténose chez un patient qui a un angor typique.</p></template>

<template data-pop="i25-pont" data-title="Pont myocardique">
<div class="lab">Définition</div><p>Segment d’une artère épicardique, le plus souvent l’interventriculaire antérieure moyenne, qui chemine dans le myocarde. Le muscle qui le recouvre le comprime en systole.</p>
<div class="lab">Fréquence et signification</div><p>Fréquent au coroscanner et à l’autopsie, le plus souvent asymptomatique. Il peut causer une ischémie lorsqu’il est long et profond, en cas de tachycardie (diastole raccourcie) ou d’hypertrophie ventriculaire gauche.</p>
<div class="lab">Traitement</div><p>Bêtabloquant ou inhibiteur calcique bradycardisant ; les dérivés nitrés peuvent aggraver la compression apparente et sont évités. Chirurgie (myotomie) exceptionnelle.</p></template>

<template data-pop="i25-equiv" data-title="Équivalents angineux">
<div class="lab">Définition</div><p>Symptômes d’ischémie myocardique autres que la douleur thoracique : dyspnée d’effort, fatigue d’effort inhabituelle, gêne épigastrique, douleur isolée de la mâchoire, du cou, du bras ou du dos, liée à l’effort.</p>
<div class="lab">Qui</div><p>Sujet âgé, diabétique, femme, insuffisant rénal.</p>
<div class="lab">Mécanisme de la dyspnée</div><p>L’ischémie altère d’abord la relaxation ventriculaire : la pression télédiastolique monte, transmise aux capillaires pulmonaires, avant l’apparition de la douleur.</p>
<div class="lab">Dans le modèle ESC 2024</div><p>La dyspnée est une catégorie de symptôme à part entière du modèle de probabilité, et non un « symptôme atypique ».</p>
<div class="lab">Piège</div><p>Une dyspnée d’effort a d’autres causes : insuffisance cardiaque, bronchopneumopathie, anémie, déconditionnement. L’échocardiographie de repos et, au besoin, l’épreuve d’effort cardiorespiratoire aident à trancher.</p></template>

<template data-pop="i25-ccs" data-title="Classification canadienne de l’angor">
<p>Proposée par la Société canadienne de cardiologie (1976).</p>
<p><b>Classe I</b> — L’activité ordinaire (marcher, monter les escaliers) ne provoque pas d’angor ; angor lors d’efforts intenses, rapides ou prolongés.<br><b>Classe II</b> — Limitation légère : angor en marchant vite ou en montée, en montant les escaliers rapidement, après un repas, au froid, au vent ou lors d’une émotion ; marche de plus de deux pâtés de maisons à plat et montée de plus d’un étage à allure normale possibles.<br><b>Classe III</b> — Limitation marquée : angor en marchant un à deux pâtés de maisons à plat ou en montant un étage à allure normale.<br><b>Classe IV</b> — Impossibilité de toute activité physique sans gêne ; l’angor peut survenir au repos.</p>
<div class="lab">Usage</div><p>Suivre l’évolution sous traitement, décider d’une escalade thérapeutique, documenter une indication symptomatique de revascularisation.</p>
<div class="lab">Piège</div><p>Un angor de repos récent classe le patient dans le syndrome coronarien aigu, et non en classe IV stable.</p></template>
