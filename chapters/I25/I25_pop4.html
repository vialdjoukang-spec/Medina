
<!-- ===== FENÊTRES : traitement, revascularisation, complications ===== -->
<template data-pop="i25-ldl" data-title="Cibles du LDL-cholestérol dans le syndrome coronarien chronique">
<div class="lab">Cible</div><p>Maladie coronaire athéroscléreuse documentée = très haut risque : LDL-cholestérol &lt; 1,4 mmol/L (55 mg/dL) <b>et</b> baisse ≥ 50 % par rapport à la valeur de départ (ESC/EAS 2019, confirmées en 2025 ; reprises par l’ESC 2024 en classe I et, pour la Suisse, par le GSLA).</p>
<div class="lab">Cible plus basse</div><p>Second événement vasculaire dans les deux ans malgré un traitement maximal : &lt; 1,0 mmol/L (40 mg/dL) à envisager.</p>
<div class="lab">Ordre de grandeur des baisses</div><p>Statine de haute intensité : environ − 50 %. Ajout d’ézétimibe : environ − 20 à 25 % supplémentaires. Ajout d’un inhibiteur de PCSK9 : environ − 50 à 60 % supplémentaires.</p>
<div class="lab">Exemple</div><p>LDL de départ 3,2 mmol/L. Cible : &lt; 1,4 mmol/L et ≤ 1,6 mmol/L (baisse de 50 %) ; la plus exigeante des deux s’applique, soit &lt; 1,4. Atorvastatine 80 mg : environ 1,6 mmol/L attendu → ajouter l’ézétimibe.</p>
<div class="lab">Calendrier</div><p>Contrôle 4 à 6 semaines après chaque modification, puis annuellement.</p></template>

<template data-pop="i25-hri" data-title="Risque ischémique élevé (ESC 2024)">
<div class="lab">Risque élevé</div><p>Maladie coronaire pluritronculaire ou diffuse, associée à au moins un des éléments suivants : diabète traité par médicament, infarctus récidivant, artériopathie périphérique, insuffisance rénale chronique avec DFG de 15 à 59 mL/min/1,73 m².</p>
<div class="lab">Risque modéré</div><p>Au moins un des éléments suivants : maladie pluritronculaire ou diffuse, diabète traité, infarctus récidivant, artériopathie périphérique, insuffisance cardiaque, insuffisance rénale chronique avec DFG de 15 à 59.</p>
<div class="lab">Conséquence</div><p>Sans risque hémorragique élevé : ajout au long cours d’un second antithrombotique (inhibiteur du P2Y12 ou rivaroxaban 2,5 mg × 2/jour) à envisager (IIa si risque élevé, IIb si modéré).</p>
<div class="lab">Toujours peser</div><p>Le risque hémorragique (critères ARC-HBR), l’âge, les interactions et la préférence du patient.</p></template>

<template data-pop="i25-syntax" data-title="Score SYNTAX">
<div class="lab">Principe</div><p>Score angiographique de complexité. Chaque lésion ≥ 50 % dans une artère de diamètre ≥ 1,5 mm reçoit des points selon le territoire qu’elle menace et ses caractéristiques : occlusion totale, bifurcation, trifurcation, calcifications sévères, longueur &gt; 20 mm, tortuosité, thrombus, maladie diffuse.</p>
<div class="lab">Catégories</div><p>≤ 22 : complexité faible. 23–32 : intermédiaire. ≥ 33 : élevée.</p>
<div class="lab">Origine</div><p>Essai SYNTAX (2009), qui comparait angioplastie et pontage dans le tronc commun et l’atteinte tritronculaire : dans l’atteinte tritronculaire, le bénéfice du pontage augmentait avec le score.</p>
<div class="lab">Évolutions</div><p>Le score SYNTAX II ajoute des variables cliniques (âge, clairance de la créatinine, FEVG, sexe, bronchopneumopathie chronique obstructive, artériopathie périphérique) pour prédire la mortalité selon chaque stratégie.</p>
<div class="lab">Limite</div><p>Variabilité entre observateurs ; ne tient pas compte de la signification fonctionnelle des lésions (d’où les scores fonctionnels calculés avec la FFR).</p></template>

<template data-pop="i25-heartteam" data-title="Heart Team">
<div class="lab">Composition</div><p>Cardiologue interventionnel, chirurgien cardiaque et cardiologue non interventionnel ; selon les cas, anesthésiste, spécialiste de l’imagerie, gériatre.</p>
<div class="lab">Quand (ESC 2024)</div><p>Recommandée (classe I) lorsque l’angioplastie et le pontage ont un niveau de recommandation comparable, et chez les patients complexes : tronc commun, atteinte pluritronculaire, diabète, FEVG réduite, comorbidités importantes.</p>
<div class="lab">Ce qu’elle intègre</div><p>Anatomie (SYNTAX), fonction ventriculaire, risque opératoire (STS, EuroSCORE II), fragilité, comorbidités, espérance de vie, préférences du patient informé.</p>
<div class="lab">Piège</div><p>Réaliser une angioplastie « ad hoc » pluritronculaire dans la foulée de la coronarographie diagnostique, sans discussion, lorsque le pontage était une option à discuter.</p></template>

<template data-pop="i25-stent" data-title="Thrombose et resténose de stent">
<div class="lab">Thrombose</div><p>Occlusion thrombotique du stent. Chronologie : aiguë (&lt; 24 heures), subaiguë (1 à 30 jours), tardive (1 mois à 1 an), très tardive (&gt; 1 an). Présentation : infarctus, souvent avec sus-décalage du ST, mortalité élevée.</p>
<div class="lab">Facteurs de thrombose</div><p>Arrêt prématuré de la double antiagrégation (premier facteur), sous-expansion ou malapposition du stent, dissection de bord, résistance au clopidogrel, cancer, SCA initial.</p>
<div class="lab">Resténose</div><p>Réduction progressive de la lumière par prolifération néo-intimale ou néo-athérosclérose. Rare avec les stents actifs modernes. Présentation : récidive progressive de l’angor, parfois SCA.</p>
<div class="lab">Conduite</div><p>Thrombose : urgence, angioplastie primaire. Resténose : imagerie endocoronaire pour comprendre le mécanisme, puis ballon actif ou nouveau stent actif.</p></template>

<template data-pop="i25-reducer" data-title="Réducteur du sinus coronaire">
<div class="lab">Principe</div><p>Dispositif métallique en forme de sablier implanté par voie veineuse dans le sinus coronaire. Le rétrécissement élève modérément la pression veineuse coronaire, ce qui redistribue le flux de l’épicarde vers le sous-endocarde ischémique.</p>
<div class="lab">Preuves</div><p>Essai COSIRA (2015) : amélioration de la classe d’angor par rapport à une procédure simulée. Essai ORBITA-COSMIC (2024) : moins d’épisodes d’angor, sans amélioration démontrée de la perfusion.</p>
<div class="lab">Place</div><p>Angor réfractaire malgré le traitement médical et sans option de revascularisation (classe IIb, ESC 2024), dans des centres expérimentés.</p></template>

<template data-pop="i25-pseudo" data-title="Pseudo-anévrisme ventriculaire">
<div class="lab">Définition</div><p>Rupture de la paroi libre du ventricule contenue par le péricarde adhérent ou un thrombus : la « paroi » de la poche ne contient pas de myocarde.</p>
<div class="lab">Distinguer de l’anévrisme vrai</div><p>Collet étroit (rapport entre le collet et le diamètre maximal de la poche &lt; 0,5), siège plus souvent inférieur ou postéro-latéral, paroi sans myocarde à l’IRM ; l’anévrisme vrai a un collet large et une paroi fibreuse myocardique.</p>
<div class="lab">Gravité</div><p>Risque élevé de rupture secondaire et de tamponnade : indication chirurgicale, souvent urgente.</p></template>

<template data-pop="i25-thrombus" data-title="Thrombus ventriculaire gauche sur anévrisme">
<div class="lab">Terrain</div><p>Anévrisme ou akinésie apicale étendue après un infarctus antérieur ; FEVG basse.</p>
<div class="lab">Diagnostic</div><p>Échocardiographie avec produit de contraste si l’apex est mal visualisé ; IRM avec rehaussement tardif, plus sensible.</p>
<div class="lab">Traitement</div><p>Anticoagulation orale (antivitamine K ou anticoagulant oral direct selon le contexte) habituellement pendant 3 à 6 mois, avec contrôle d’imagerie ; durée prolongée si le thrombus persiste. Un thrombus ancien, laminé et organisé dans un anévrisme a un risque embolique plus faible qu’un thrombus mobile et protrusif.</p>
<div class="lab">Chirurgie</div><p>Discutée si thrombus mobile récidivant malgré l’anticoagulation, surtout lors d’un pontage ou d’une anévrismectomie.</p></template>

<template data-pop="i25-mnemo-abcde" data-title="Aide-mémoire du traitement de l’angor, de A à E">
<p><i>Aide pédagogique, non critère officiel.</i></p>
<p><b>A</b> — Antiplaquettaire ; Anti-angineux (dont la trinitrine de crise).<br><b>B</b> — Bêtabloquant ; Baisse de la pression artérielle.<br><b>C</b> — Cholestérol (LDL &lt; 1,4 mmol/L) ; Cigarette (arrêt) ; Colchicine.<br><b>D</b> — Diabète (iSGLT2, agoniste du GLP-1) ; Diététique méditerranéenne.<br><b>E</b> — Éducation (plan d’action en cas de crise) ; Exercice et réadaptation.</p>
<div class="lab">Usage</div><p>Vérifier à chaque consultation qu’aucune lettre n’est oubliée. Les lettres A (anti-angineux) et B concernent surtout les symptômes ; les autres, surtout le pronostic.</p></template>
