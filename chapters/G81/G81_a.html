<template id="ch-G81"><div class="chap"><div class="chap-head"><div class="code">G 81 · Neurologie · Système nerveux et motricité</div><h1>Hémiparésie et hémiplégie</h1><span class="status">Cycle Betta 39 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de l’hémiparésie et de la spasticité</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g81-0">Question clinique</a></li><li><a href="#g81-1">Définition, codage et classification</a></li><li><a href="#g81-2">Fréquence et pronostic</a></li><li><a href="#g81-3">Physiopathologie</a></li><li><a href="#g81-4">Causes et facteurs de risque</a></li><li><a href="#g81-5">Anamnèse</a></li><li><a href="#g81-6">Examen clinique</a></li><li><a href="#g81-7">Démarche diagnostique et différentiel</a></li><li><a href="#g81-8">Urgences et complications</a></li><li><a href="#g81-9">Prise en charge hiérarchisée</a></li><li><a href="#g81-10">Suivi, pronostic et prévention</a></li><li><a href="#g81-11">Situations particulières</a></li><li><a href="#g81-12">Critères officiels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g81-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 71 ans pesant 62 kg arrive aux urgences à 8 h 55. À 7 h 10, son mari l’a vue en bonne santé ; à 8 h 20, elle a laissé tomber sa tasse de la main droite, puis sa jambe droite a commencé à « traîner ». Elle prend un anticoagulant oral direct pour une fibrillation atriale connue. Ces données pédagogiques servent à poser trois questions qui structurent tout le cours : s’agit-il d’un accident vasculaire cérébral (<button class="w" data-k="g81-horaire">AVC</button>) encore traitable, quelle est la part d’un simulateur, et que deviendra ce bras dans trois mois ?</p>
<p>La première question est urgente et se pose avant toute description fine du déficit. La <button class="w" data-k="g81-horaire">dernière heure vue en bonne santé (point de départ de toutes les fenêtres de traitement)</button> et la prise d’un <button class="w" data-k="g81-aod">anticoagulant oral direct (conséquence sur la thrombolyse)</button> décident de ce qui est possible. La deuxième question vient de la fréquence des <button class="w" data-k="g81-mimics">pseudo-AVC (imitateurs de l’AVC)</button>. La troisième est celle du syndrome séquellaire : une hémiparésie qui dure devient un trouble moteur durable, avec <button class="w" data-k="g81-lance">spasticité</button>, posture en flexion du membre supérieur, risque de chute et douleur.</p>
<p>Ce cours poursuit cinq objectifs : savoir <b>coder</b> et nommer l’hémiparésie (G81.0, G81.1, G81.9) ; comprendre pourquoi <b>la faiblesse précède la spasticité</b> ; reconnaître en urgence un AVC traitable et écarter un simulateur ; <b>mesurer</b> le déficit avec les échelles recommandées ; <b>traiter</b> la spasticité selon les informations professionnelles suisses et les recommandations européennes.</p>
<div class="key"><b>À retenir.</b> Une faiblesse d’un hémicorps est un AVC jusqu’à preuve du contraire. Le code G81 décrit un état du patient ; il ne nomme jamais la cause, qui se cherche à part.</div>
</section>

<section class="ilot" id="g81-1"><h2><span class="n">1</span>Définition, codage et classification</h2>
<p>Dans la classification statistique utilisée en Suisse, la <button class="w" data-k="g81-cim">CIM-10-GM 2024 (version et structure du bloc G80–G83)</button> regroupe l’hémiparésie et l’hémiplégie sous la catégorie <b>G81</b>, dans le bloc G80–G83 « paralysies cérébrales et autres syndromes paralytiques ». Le terme décrit l’atteinte motrice d’un hémicorps. Le dossier de recherche ne distingue pas hémiparésie et hémiplégie par un seuil de force musculaire : le code les réunit et c’est l’examen qui précise le degré.</p>
<table class="t"><thead><tr><th>Code</th><th>Libellé (traduit du libellé BfArM)</th><th>Situation typique</th></tr></thead><tbody><tr><td>G81.0</td><td>Hémiparésie et hémiplégie flasques</td><td>Phase initiale : les <button class="w" data-k="g81-signes-neg">signes négatifs (faiblesse, hypotonie)</button> dominent.</td></tr><tr><td>G81.1</td><td>Hémiparésie et hémiplégie spastiques</td><td>Phase plus tardive : les <button class="w" data-k="g81-signes-pos">signes positifs (spasticité, hyperréflexie)</button> s’installent.</td></tr><tr><td>G81.9</td><td>Hémiparésie et hémiplégie, sans précision</td><td>Le caractère flasque ou spastique n’est pas documenté.</td></tr></tbody></table>
<p>La correspondance entre ce tableau et la clinique est une lecture pédagogique : la classification n’impose pas de délai entre G81.0 et G81.1. Elle s’appuie sur la physiopathologie, car les signes négatifs « apparaissent en premier » et la spasticité « apparaît typiquement plus tard » (<button class="w" data-k="g81-smns">syndrome du motoneurone supérieur</button>). Un patient peut donc changer de sous-code au fil de l’évolution.</p>
<p>La <button class="w" data-k="g81-codage">règle d’usage du code (primaire ou supplémentaire)</button> est précise : G81 est un code primaire seulement si l’hémiparésie est sans précision, ancienne ou de longue date avec une cause non précisée ; sinon il sert de code supplémentaire pour signaler une hémiparésie de toute cause, par exemple après un AVC. La catégorie exclut la paralysie cérébrale congénitale et infantile (G80.-).</p>
<table class="t"><thead><tr><th>À ne pas confondre avec G81</th><th>Code</th><th>Critère de distinction</th></tr></thead><tbody><tr><td>Monoparésie d’un membre supérieur</td><td>G83.2</td><td>Un seul membre, pas l’hémicorps.</td></tr><tr><td>Monoparésie d’un membre inférieur</td><td>G83.1</td><td>Un seul membre, pas l’hémicorps.</td></tr><tr><td>Syndrome de verrouillage (locked-in)</td><td>G83.5</td><td>Entité distincte du bloc.</td></tr><tr><td>Parésie faciale centrale</td><td>G83.6</td><td>Exclut G51.0, la paralysie faciale périphérique.</td></tr><tr><td>Paralysie postcritique de Todd</td><td>G83.8</td><td>Déficit transitoire après une crise (voir <button class="w" data-k="g81-todd">paralysie de Todd</button>).</td></tr><tr><td>Paralysie cérébrale infantile</td><td>G80</td><td>Exclue de G81 ; la paraplégie spastique héréditaire (G11.4) est exclue de G80.</td></tr></tbody></table>
<div class="trap"><span class="k">Libellés et version</span> Les libellés ci-dessus traduisent le texte allemand du BfArM (« schlaffe », « spastische », « nicht näher bezeichnet »). Le dossier n’a pas pu lire la version française de l’Office fédéral de la statistique : le titre officiel de la leçon est « Hémiparésie et hémiplégie », mais les libellés des sous-codes doivent se vérifier contre cette version avant d’être cités à l’examen. La correspondance avec la CIM-11 n’est pas établie ici.</div>
<div class="key"><b>À retenir.</b> G81.0 = flasque, G81.1 = spastique, G81.9 = sans précision. Primaire seulement si la cause est inconnue ou ancienne ; sinon supplémentaire.</div>
<p class="src">Sources : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024 (version allemande), bloc G80–G83</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto et al., 2014</a>.</p>

<section class="ilot" id="g81-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p>Aucune source lue ne chiffre l’hémiparésie comme telle (lacune assumée). La cause dominante étant l’AVC, c’est l’épidémiologie de l’AVC qui fournit le repère suisse : à Genève en 2018-2019, l’<button class="w" data-k="g81-geneve">incidence annuelle du premier AVC (registre suisse, population standardisée)</button> était de <b>127,0 pour 100 000</b>, dont 107,3 pour l’AVC ischémique, 13,2 pour l’hémorragie intracérébrale et 6,0 pour l’hémorragie sous-arachnoïdienne. L’âge médian était de 75,8 ans. La létalité à 30 jours variait fortement avec le type : 32,5 % pour l’hémorragie intracérébrale, 17,2 % pour l’hémorragie sous-arachnoïdienne, 10,8 % pour l’AVC ischémique.</p>
<p>Ces chiffres dépendent de la définition retenue. La <button class="w" data-k="g81-cim11">définition de l’AVC ischémique de la CIM-11 (événements de moins de 24 heures avec ischémie prouvée à l’imagerie)</button> augmente de 18,3 % le nombre de cas par rapport à la CIM-10. Le patient qui retrouve une force normale en quelques heures n’est donc plus forcément classé « sans AVC » lorsque l’imagerie montre une lésion.</p>
<p>À distance, une complication est mesurée : la spasticité. Une <button class="w" data-k="g81-prevalence">méta-analyse sur la spasticité post-AVC (prévalence et facteurs de risque)</button> trouve une prévalence de 25,3 % après AVC, 26,7 % après un premier AVC et 39,5 % chez les patients avec parésie. La spasticité invalidante (<button class="w" data-k="g81-mas">échelle d’Ashworth modifiée</button> ≥ 3) touche 9,4 % des patients parétiques. L’analyse repose sur des études internationales et non sur une cohorte suisse.</p>
<div class="trap"><span class="k">Pronostic moteur</span> Le dossier ne contient aucun modèle de prédiction de la récupération motrice. Ce cours ne chiffre donc pas la probabilité de retrouver l’usage du bras ou la marche ; il ne cite que les facteurs associés à la spasticité.</div>
<div class="key"><b>À retenir.</b> Incidence du premier AVC à Genève : 127/100 000 par an. Spasticité après AVC : 25 % en moyenne, 39,5 % chez les parétiques, 9,4 % de spasticité invalidante chez eux.</div>
<p class="src">Sources : <a href="https://doi.org/10.1212/WNL.0000000000213353" target="_blank" rel="noopener">Dirren et al., Neurology 2025</a> ; <a href="https://doi.org/10.3389/fneur.2020.616097" target="_blank" rel="noopener">Zeng et al., Front Neurol 2021</a>.</p>
</section>

<section class="ilot" id="g81-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>L’hémiparésie est un déficit du <button class="w" data-k="g81-smns">syndrome du motoneurone supérieur (SMNS) : définition et composantes</button>. Pour en comprendre la chronologie, il faut d’abord décrire le tonus normal, puis ce qui change quand la voie descendante est lésée.</p>
<h3>3.1 Le tonus normal est biomécanique</h3>
<p>Chez le sujet sain, aucun réflexe d’étirement n’apparaît aux <button class="w" data-k="g81-vitesse">vitesses d’étirement cliniques (60 à 180 °/s)</button> ; il n’apparaît qu’au-delà d’environ 200 °/s. La résistance ressentie par le médecin qui mobilise un membre relâché est donc d’origine mécanique (muscle, tendon, tissu conjonctif) et non réflexe. Cette observation est le point de départ : en pathologie, l’activité électromyographique (<button class="w" data-k="g81-vitesse">EMG</button>) croît avec la vitesse d’étirement.</p>
<h3>3.2 D’abord les signes négatifs, ensuite les signes positifs</h3>
<p>Après la lésion, les <button class="w" data-k="g81-signes-neg">signes négatifs</button> apparaissent en premier : faiblesse, perte de dextérité, hypotonie, réflexes ostéotendineux diminués. Ils expliquent la forme flasque (G81.0). Les <button class="w" data-k="g81-signes-pos">signes positifs</button> viennent ensuite : spasticité, hyperréflexie, clonus, spasmes en flexion ou en extension, signe de Babinski, réaction de soutien positive, cocontraction, dystonie spastique et réactions associées. Le Babinski apparaît tôt ; la spasticité plus tard. Ce délai est un argument clinique : il invite à réexaminer le tonus au fil de l’évolution, sans attendre la plainte du patient (déduction pédagogique de la chronologie ; la source ne chiffre pas ces délais).</p>
<figure><svg viewBox="0 0 420 150" role="img" aria-label="Figure 1 — Chronologie du syndrome du motoneurone supérieur" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="12" width="120" height="52" rx="5"/><rect x="150" y="12" width="120" height="52" rx="5"/><rect x="292" y="12" width="120" height="52" rx="5"/><path d="M128 38h22m-5-4l5 4-5 4M270 38h22m-5-4l5 4-5 4"/></g><g fill="currentColor" text-anchor="middle"><text x="68" y="34">Lésion</text><text x="68" y="52">du neurone</text><text x="210" y="30">Signes négatifs</text><text x="210" y="48">faiblesse, hypotonie</text><text x="352" y="30">Signes positifs</text><text x="352" y="48">spasticité, clonus</text><text x="210" y="100">Babinski : précoce</text><text x="352" y="100">Spasticité : plus tardive</text><text x="210" y="130">G81.0 flasque</text><text x="352" y="130">G81.1 spastique</text></g></svg><figcaption>Figure 1 — Chronologie du syndrome du motoneurone supérieur (d’après Trompetto et al., 2014). Schéma didactique : les délais exacts ne sont pas chiffrés par la source.</figcaption></figure>
<h3>3.3 Pourquoi la spasticité apparaît : déséquilibre supraspinal et plasticité</h3>
<p>Le <button class="w" data-k="g81-supraspinal">contrôle supraspinal du tonus (voies inhibitrices et facilitatrices)</button> repose sur un équilibre. Le faisceau réticulospinal dorsal est inhibiteur ; les faisceaux réticulospinal médian et vestibulospinal sont facilitateurs. La spasticité résulte de la <b>prédominance de la facilitation</b> sur l’inhibition. Une lésion pyramidale pure ne suffit pas à la causer, ce qui explique que toutes les lésions motrices ne donnent pas la même clinique.</p>
<p>Au niveau de la moelle, les <button class="w" data-k="g81-spinal">mécanismes spinaux (inhibitions réduites, dépression post-activation)</button> amplifient le signal : les inhibitions post-synaptiques (Ib, Ia réciproque, récurrente) et présynaptique diminuent, et la dépression post-activation est réduite, surtout après immobilisation, en proportion de la sévérité de la spasticité post-AVC. Le délai entre la lésion et la spasticité plaide contre un simple phénomène de libération et suggère une <b>plasticité spinale et cérébrale</b>.</p>
<h3>3.4 La part non réflexe</h3>
<p>Tout l’excès de résistance n’est pas réflexe. L’<button class="w" data-k="g81-intrinseque">hypertonie non réflexe (intrinsèque)</button> naît de l’immobilisation en position courte : le muscle perd des sarcomères en série et le tissu conjonctif augmente, d’où une résistance <b>indépendante de la vitesse</b>. Séparer les deux composantes est difficile au lit du malade. La conséquence thérapeutique est directe : mobilisation, étirements et positionnement agissent sur la part intrinsèque, tandis que les médicaments agissent surtout sur la part réflexe.</p>
<h3>3.5 La posture hémiplégique</h3>
<p>La <button class="w" data-k="g81-posture">posture hémiplégique</button> associe un membre supérieur fléchi et en adduction à un membre inférieur en extension, avec une contribution de la dystonie spastique. La <button class="w" data-k="g81-cocontraction">cocontraction (perte de l’inhibition réciproque)</button> est décrite comme la forme d’hyperactivité la plus invalidante, parce que deux muscles antagonistes se contractent ensemble au lieu de se relayer. Enfin, <button class="w" data-k="g81-douleur">douleur et spasticité</button> s’entretiennent mutuellement.</p>
<div class="key"><b>À retenir.</b> Faiblesse d’abord, spasticité ensuite. La spasticité traduit un déséquilibre facilitation/inhibition, une plasticité de la moelle et une part mécanique du muscle qui se raccourcit.</div>
<p class="src">Source : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto et al., Biomed Res Int 2014 : physiopathologie de la spasticité</a>.</p>
<button class="pareto-btn ui" data-k="pareto-g81-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="g81-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Dans les sources lues, la cause traitée de l’hémiparésie est l’<b>AVC ischémique et hémorragique</b>. Le profil des causes change avec l’âge : chez les 18 à 55 ans du registre suisse (3 995 patients, 2014-2022), le <button class="w" data-k="g81-jeunes">foramen ovale perméable et la dissection artérielle cervicale (AVC du jeune adulte)</button> dominent chez les plus jeunes, tandis que l’athérosclérose des grosses artères et la maladie des petits vaisseaux augmentent avec l’âge.</p>
<table class="t"><thead><tr><th>Famille</th><th>Exemple documenté</th><th>Source</th></tr></thead><tbody><tr><td>AVC ischémique du sujet jeune</td><td>Foramen ovale perméable, dissection cervicale</td><td>Registre suisse (Schneider 2025)</td></tr><tr><td>AVC ischémique, adulte plus âgé</td><td>Athérosclérose des grosses artères, maladie des petits vaisseaux</td><td>Registre suisse (Schneider 2025)</td></tr><tr><td>AVC hémorragique</td><td>Hémorragie intracérébrale (13,2/100 000), hémorragie sous-arachnoïdienne (6,0)</td><td>Genève (Dirren 2025)</td></tr><tr><td>Déficit postcritique</td><td>Paralysie de Todd, de quelques minutes à plusieurs jours</td><td>Rapport de cas (Ali 2026)</td></tr></tbody></table>
<p>La <button class="w" data-k="g81-todd">paralysie postcritique de Todd (déficit transitoire après une crise)</button> est le seul mécanisme non vasculaire documenté. Elle survient surtout en cas de lésion cérébrale structurelle. Son niveau de preuve est faible (rapport de cas).</p>
<p>Il faut séparer <b>les causes de l’hémiparésie</b> des <b>facteurs de risque de la spasticité</b>. Après un AVC, une parésie modérée à sévère multiplie le risque de spasticité (rapport de cotes, <button class="w" data-k="g81-prevalence">OR</button> 6,57), l’AVC hémorragique l’augmente (OR 1,88) et un trouble sensitif s’y associe. Ces rapports de cotes décrivent des associations de population, pas des causes démontrées chez un patient.</p>
<div class="trap"><span class="k">Lacune de sources</span> Tumeur cérébrale, abcès, sclérose en plaques, hématome sous-dural, traumatisme et hypoglycémie sont des causes classiques d’un déficit focal, mais aucune source du dossier ne les documente. Ce cours ne les détaille pas ; elles sont signalées dans le différentiel comme absentes de la base de sources.</div>
<div class="key"><b>À retenir.</b> Cause documentée : l’AVC (jeune : foramen ovale perméable et dissection ; plus âgé : athérosclérose et petits vaisseaux). Cause non vasculaire documentée : la paralysie de Todd. Parésie sévère et AVC hémorragique : facteurs de risque de spasticité.</div>
<p class="src">Sources : <a href="https://doi.org/10.1177/23969873251317347" target="_blank" rel="noopener">Schneider et al., Eur Stroke J 2025</a> ; <a href="https://doi.org/10.3389/fneur.2020.616097" target="_blank" rel="noopener">Zeng et al., 2021</a> ; <a href="https://doi.org/10.7759/cureus.104991" target="_blank" rel="noopener">Ali et al., Cureus 2026</a>.</p>
<button class="pareto-btn ui" data-k="pareto-g81-causes">▲ Loi de Pareto — Causes</button>
</section>

<section class="ilot" id="g81-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire a deux temps. En urgence, il recueille des éléments qui décident d’un traitement. À distance, il décrit la gêne motrice et les complications.</p>
<h3>5.1 Antécédents et éléments décisifs en urgence</h3>
<p>Trois éléments conditionnent la suite : l’<button class="w" data-k="g81-horaire">heure de début ou dernière heure vu en bonne santé</button>, la prise d’un <button class="w" data-k="g81-aod">anticoagulant oral direct</button> (27 % des patients non thrombolysés dans la fenêtre à Zurich, avec une activité anti-Xa non testée chez la moitié d’entre eux) et les <button class="w" data-k="g81-atcd">antécédents pertinents (crise d’épilepsie, facteurs vasculaires)</button>. Une crise récente oriente vers une <button class="w" data-k="g81-todd">paralysie de Todd</button>, alors qu’une tension artérielle presque normale et des symptômes légers, chez une femme jeune sans facteur de risque vasculaire, orientent vers un <button class="w" data-k="g81-mimics">pseudo-AVC</button>.</p>
<h3>5.2 Symptômes</h3>
<p>Les <button class="w" data-k="g81-symptomes">symptômes de l’hémiparésie (aigus, puis séquellaires)</button> se décrivent en aigu par la faiblesse brutale ; à distance par la raideur, les spasmes, la douleur, la gêne à l’habillage, au maintien de l’équilibre et à la marche. Le dossier ne donne aucune fréquence de ces symptômes : ils ne sont donc pas classés par fréquence. Le <button class="w" data-k="g81-chute">risque de chute</button> est cité par les informations professionnelles suisses des traitements de la spasticité.</p>
<h3>5.3 Formes cliniques</h3>
<div class="two"><div class="card"><h4>Forme aiguë flasque</h4><p>Le patient est faible, hypotonique, avec des réflexes ostéotendineux diminués. Elle correspond au code G81.0 et à la phase où l’on recherche la cause et les traitements de reperfusion. Le tonus se surveille ensuite pour reconnaître la bascule vers la spasticité.</p>
</div><div class="card"><h4>Forme chronique spastique</h4><p>Le bras est fléchi et en adduction, la jambe en extension. Le patient décrit raideur, spasmes et douleur ; l’examen retrouve une résistance dépendante de la vitesse. Elle correspond à G81.1 et mobilise la rééducation et le traitement de la spasticité.</p>
</div></div><div class="two"><div class="card"><h4>Hémiparésie d’origine vasculaire</h4><p>Début brutal, déficit moteur parfois sévère, facteurs vasculaires ou, chez le jeune, une cause comme le foramen ovale perméable ou la dissection cervicale. La question centrale est le temps écoulé.</p>
</div><div class="card"><h4>Imitateur de l’AVC</h4><p>Les patients sont plus jeunes, plus souvent des femmes, avec moins de facteurs de risque vasculaire et des symptômes moins sévères. Les types les plus fréquents sont la vestibulopathie périphérique, le trouble toxique ou métabolique, la crise épileptique, le trouble fonctionnel et la migraine.</p>
</div></div>
<div class="quiz ui"><p><b>Cas.</b> Une femme de 34 ans, sans facteur de risque vasculaire, a un déficit moteur droit léger depuis 1 h 30. Elle a eu une crise tonico-clonique hier. Quelle hypothèse doit rester ouverte avant d’écarter un AVC ?</p><button data-ok="0">A. Une paralysie de Todd permet d’écarter l’AVC sans imagerie.</button><button data-ok="1">B. Une paralysie de Todd est possible, mais l’imagerie reste nécessaire pour ne pas manquer un AVC traitable.</button><button data-ok="0">C. L’âge jeune exclut un AVC.</button><p class="fb" hidden>La paralysie de Todd est un diagnostic d’exclusion : les sources lues la décrivent comme un imitateur et rappellent qu’un examen de perfusion peut même simuler une ischémie en postcritique. L’imagerie et l’évaluation par un médecin expérimenté restent la règle.</p></div>
<div class="trap"><span class="k">Piège</span> L’hémiparésie d’un patient qui semble « seulement faible » masque parfois un trouble de la déglutition : la dysphagie dépasse 50 % des AVC en phase aiguë. Un patient qui tousse en mangeant ou qui s’étouffe est un patient à dépister avant toute alimentation orale.</div>
<div class="key"><b>À retenir.</b> En urgence : heure de début, anticoagulant, crise récente. À distance : raideur, spasmes, douleur, chutes. Les caractéristiques du pseudo-AVC orientent mais n’excluent rien.</div>
<p class="src">Sources : <a href="https://doi.org/10.1016/j.ajem.2026.04.004" target="_blank" rel="noopener">Zehnder et al., Am J Emerg Med 2026</a> ; <a href="https://doi.org/10.1016/j.jocn.2021.09.025" target="_blank" rel="noopener">Pohl et al., J Clin Neurosci 2021</a> ; <a href="https://doi.org/10.1177/23969873211039721" target="_blank" rel="noopener">Dziewas et al., Eur Stroke J 2021</a>.</p>
</section>

<section class="ilot" id="g81-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit un ordre fixe : état général et vigilance, signes vitaux, puis signes ciblés. Dans les sources lues, la tension artérielle presque normale fait partie du profil des <button class="w" data-k="g81-mimics">pseudo-AVC</button>, mais elle ne permet pas à elle seule de les distinguer d’un AVC. Le dossier ne détaille ni l’anthropométrie ni les techniques générales d’examen neurologique : seuls les signes ci-dessous sont sourcés.</p>
<div class="two"><div class="card"><h4>Force et dextérité</h4><p>Un déficit discret du membre supérieur par lésion corticospinale se cherche avec des épreuves plus sensibles que la force brute. Dans une série de 17 AVC moteurs purs légers, la sensibilité était de 88 % pour le <button class="w" data-k="g81-thumb">thumb rolling test</button>, 65 % pour le forearm rolling, 65 % pour l’index finger rolling et 47 % pour l’<button class="w" data-k="g81-thumb">épreuve de pronation (pronator drift)</button>. Ces tests étaient plus souvent anormaux que les tests de force, de tonus ou de réflexes. Les segments distaux sont plus atteints que les proximaux.</p>
</div><div class="card"><h4>Tonus et réflexes</h4><p>On recherche une résistance dépendante de la vitesse (<button class="w" data-k="g81-lance">définition de Lance</button>), un phénomène de <button class="w" data-k="g81-couteau">couteau à cran d’arrêt</button>, un clonus, une hyperréflexie et un <button class="w" data-k="g81-babinski">signe de Babinski</button>. La cotation se fait avec l’<button class="w" data-k="g81-mas">échelle d’Ashworth modifiée</button> ; le seuil MAS ≥ 3 définit la spasticité invalidante.</p>
</div></div><div class="two"><div class="card"><h4>Simulateurs : deux aides cliniques</h4><p>Le <button class="w" data-k="g81-hints">test HINTS (vertige)</button> aide à reconnaître une vestibulopathie. Le <button class="w" data-k="g81-hoover">signe de Hoover</button> aide à reconnaître un trouble fonctionnel. Ces deux repères sont cités par la revue sur les pseudo-AVC ; leur technique n’est pas décrite dans le dossier.</p>
</div><div class="card"><h4>Posture et mobilité</h4><p>On observe la <button class="w" data-k="g81-posture">posture hémiplégique</button> au repos et à la marche, l’adduction de l’épaule, la flexion du coude, du poignet et des doigts, l’extension du membre inférieur. L’observation guide ensuite le choix des muscles à traiter.</p>
</div></div>
<p>Les <button class="w" data-k="g81-echelles">échelles de mesure recommandées (membre supérieur, marche, équilibre, indépendance)</button> permettent de suivre le patient. L’European Stroke Organisation (<button class="w" data-k="g81-echelles">ESO</button>) cite notamment le Fugl-Meyer pour le membre supérieur, le test de marche de 6 minutes et le Berg pour l’équilibre.</p>
<div class="quiz ui"><p><b>Question.</b> Dans la série de 17 AVC moteurs purs légers, quel test du membre supérieur était le plus sensible ?</p><button data-ok="1">A. Le thumb rolling test (88 %).</button><button data-ok="0">B. L’épreuve de pronation (47 %).</button><button data-ok="0">C. Les trois avaient la même sensibilité.</button><p class="fb" hidden>La sensibilité allait de 47 % (pronation) à 88 % (thumb rolling). Le petit effectif de la série impose la prudence, mais l’idée est claire : un déficit moteur discret échappe parfois à l’examen de force classique.</p></div>
<div class="trap"><span class="k">Piège</span> La spasticité est une composante du syndrome du motoneurone supérieur, pas le syndrome lui-même. Un patient très faible peut être peu spastique, et l’inverse est possible. Cotée seule, la spasticité ne mesure ni la force ni la fonction.</div>
<div class="key"><b>À retenir.</b> Les épreuves sensibles du membre supérieur (rolling) surpassent la force brute dans les déficits discrets. Le tonus se décrit par la vitesse d’étirement ; la gravité se cote par l’échelle d’Ashworth modifiée.</div>
<p class="src">Sources : <a href="https://doi.org/10.1017/s0317167100011173" target="_blank" rel="noopener">Nowak, Can J Neurol Sci 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098312/" target="_blank" rel="noopener">ESO, rééducation motrice 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p>
