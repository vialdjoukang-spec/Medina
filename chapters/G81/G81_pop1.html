<template data-pop="g81-cim" data-title="CIM-10-GM 2024 : bloc G80–G83">
<div class="lab">Définition</div><p>Dans la CIM-10-GM 2024 publiée par le BfArM, la catégorie G81 « Hemiparese und Hemiplegie » appartient au bloc G80–G83 : paralysies cérébrales et autres syndromes paralytiques. Elle comprend G81.0 (flasque), G81.1 (spastique) et G81.9 (sans précision), soit toutes les sous-catégories de la version 2024.</p>
<div class="lab">Application</div><p>Les voisins à distinguer sont G83.2 (monoparésie d’un membre supérieur), G83.1 (membre inférieur), G83.5 (syndrome de verrouillage), G83.6 (parésie faciale centrale, qui exclut G51.0, la paralysie faciale périphérique) et G83.8 (qui inclut la paralysie postcritique de Todd). G80 (paralysie cérébrale infantile) est exclue de G81 ; la paraplégie spastique héréditaire (G11.4) est exclue de G80.</p>
<div class="lab">Limite</div><p>Le texte lu est la version allemande du BfArM ; la version française de l’Office fédéral de la statistique n’a pas été lue. Les libellés français sont donc une traduction. La cartographie vers la CIM-11 n’est pas établie dans ce dossier.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G80–G83</a>.</p></template>
<template data-pop="g81-cim11" data-title="Définition de l’AVC ischémique en CIM-11">
<div class="lab">Définition</div><p>La CIM-11 inclut dans l’AVC ischémique les événements durant moins de 24 heures lorsque l’imagerie prouve une ischémie. La CIM-10 retenait surtout la durée des symptômes.</p>
<div class="lab">Chiffres</div><p>À Genève (2018-2019), cette définition augmente de 18,3 % le nombre de cas d’AVC ischémique par rapport à la définition de la CIM-10.</p>
<div class="lab">Conséquence</div><p>Un patient dont la faiblesse a régressé en quelques heures peut être classé comme AVC si l’imagerie révèle une lésion ischémique. Le raisonnement vaut pour l’épidémiologie ; il ne change pas la conduite devant une hémiparésie active.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/WNL.0000000000213353" target="_blank" rel="noopener">Dirren et al., Neurology 2025</a> (résumé seul lu).</p></template>
<template data-pop="g81-codage" data-title="Règle d’usage du code G81">
<div class="lab">Règle</div><p>G81 est un code <b>primaire</b> seulement si l’hémiparésie est sans précision, ancienne ou de longue date avec une cause non précisée. Dans les autres cas, G81 est un code <b>supplémentaire</b> qui signale une hémiparésie de toute cause, par exemple après un AVC.</p>
<div class="lab">Exemple</div><p>Un patient hospitalisé pour un AVC aigu est codé selon l’AVC ; G81 s’y ajoute pour décrire le déficit. Un patient vu des années plus tard, dont la cause n’est pas documentée, reçoit G81 en code primaire. Cet exemple applique la règle ; il ne provient pas d’un cas de la source.</p>
<div class="lab">Limite</div><p>La règle vient du texte allemand du BfArM ; les modalités de codage suisses (version OFS) n’ont pas été lues.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM 2024</a>.</p></template>
<template data-pop="g81-smns" data-title="Syndrome du motoneurone supérieur">
<div class="lab">Définition</div><p>Le syndrome du motoneurone supérieur (SMNS) associe des <b>signes négatifs</b> (faiblesse, perte de dextérité, hypotonie, réflexes ostéotendineux diminués) et des <b>signes positifs</b> (spasticité, hyperréflexie, clonus, spasmes, signe de Babinski, réaction de soutien positive, cocontraction, dystonie spastique, réactions associées).</p>
<div class="lab">Chronologie</div><p>Les signes négatifs apparaissent en premier. Le signe de Babinski apparaît tôt, la spasticité typiquement plus tard. Cette séquence justifie la distinction entre G81.0 (flasque) et G81.1 (spastique).</p>
<div class="lab">Point d’attention</div><p>La spasticité n’est qu’une composante du syndrome ; elle ne le résume pas.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto et al., Biomed Res Int 2014</a>.</p></template>
<template data-pop="g81-signes-neg" data-title="Signes négatifs du SMNS">
<div class="lab">Contenu</div><p>Faiblesse, perte de dextérité, hypotonie, réflexes ostéotendineux diminués. Ils apparaissent en premier après la lésion.</p>
<div class="lab">Lecture clinique</div><p>Ils traduisent la perte de la commande motrice. L’hypotonie et la diminution des réflexes rendent compte de la forme flasque (G81.0).</p>
<div class="lab">Limite</div><p>La source ne donne pas de délai chiffré entre la lésion et le passage à la forme spastique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-signes-pos" data-title="Signes positifs du SMNS">
<div class="lab">Contenu</div><p>Spasticité, hyperréflexie, clonus, spasmes en flexion ou en extension, signe de Babinski, réaction de soutien positive, cocontraction, dystonie spastique et réactions associées.</p>
<div class="lab">Chronologie</div><p>La spasticité apparaît typiquement plus tard ; le Babinski apparaît tôt. Le délai plaide contre une simple libération et suggère une plasticité spinale et cérébrale.</p>
<div class="lab">Retentissement</div><p>La cocontraction est décrite comme la forme d’hyperactivité la plus invalidante.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-lance" data-title="Spasticité : définition de Lance">
<div class="lab">Définition</div><p>La spasticité est un trouble moteur caractérisé par une augmentation, <b>dépendante de la vitesse</b>, des réflexes toniques d’étirement. Elle n’est qu’une composante du syndrome du motoneurone supérieur.</p>
<div class="lab">Application</div><p>Le médecin mobilise le membre à plusieurs vitesses. Une résistance qui croît avec la vitesse évoque la spasticité ; une résistance indépendante de la vitesse évoque plutôt une hypertonie intrinsèque.</p>
<div class="lab">Limite</div><p>La spasticité dépend aussi de la longueur musculaire. Composantes réflexe et non réflexe sont difficiles à séparer cliniquement.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-vitesse" data-title="Réflexe d’étirement et vitesse">
<div class="lab">Normal</div><p>Chez le sujet sain, aucun réflexe d’étirement n’apparaît aux vitesses cliniques (60 à 180 °/s). Il n’apparaît qu’au-delà d’environ 200 °/s. Le tonus normal est donc biomécanique.</p>
<div class="lab">Pathologique</div><p>En spasticité, l’activité électromyographique (EMG), enregistrée sur le muscle étiré, augmente avec la vitesse d’étirement.</p>
<div class="lab">Conséquence</div><p>La vitesse de la mobilisation compte à l’examen : une mobilisation lente peut ne pas déclencher la résistance spastique (déduction pédagogique).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-couteau" data-title="Phénomène du couteau à cran d’arrêt">
<div class="lab">Description</div><p>Forte résistance au début de l’étirement d’un muscle court, puis disparition brutale de cette résistance.</p>
<div class="lab">Signification</div><p>Il illustre la dépendance de la spasticité vis-à-vis de la longueur musculaire : au quadriceps, la spasticité est plus forte muscle court ; au triceps sural, plus forte muscle long.</p>
<div class="lab">Limite</div><p>Le dossier ne donne pas de valeur diagnostique chiffrée pour ce signe.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-supraspinal" data-title="Contrôle supraspinal du tonus">
<div class="lab">Voies</div><p>Le faisceau réticulospinal dorsal est inhibiteur. Le faisceau réticulospinal médian et le faisceau vestibulospinal sont facilitateurs.</p>
<div class="lab">Mécanisme</div><p>La spasticité résulte de la prédominance de la facilitation. Une lésion pyramidale pure ne suffit pas à causer une spasticité.</p>
<div class="lab">Lecture</div><p>Le déséquilibre explique pourquoi des lésions de siège différent donnent des tableaux différents. La source ne localise pas précisément, voie par voie, les lésions d’AVC en cause.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-spinal" data-title="Mécanismes spinaux de la spasticité">
<div class="lab">Inhibitions réduites</div><p>Les inhibitions post-synaptiques (Ib, Ia réciproque, récurrente) et l’inhibition présynaptique sont diminuées.</p>
<div class="lab">Dépression post-activation</div><p>Sa réduction, surtout par immobilisation, est corrélée à la sévérité de la spasticité après AVC. L’immobilisation est donc un facteur aggravant potentiel, ce qui justifie la mobilisation.</p>
<div class="lab">Plasticité</div><p>Le délai entre lésion et spasticité plaide contre un simple phénomène de libération et suggère une plasticité spinale et cérébrale.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-intrinseque" data-title="Hypertonie non réflexe (intrinsèque)">
<div class="lab">Mécanisme</div><p>Quand un muscle reste immobilisé en position courte, le nombre de sarcomères en série diminue et le tissu conjonctif augmente. La résistance qui en résulte est indépendante de la vitesse d’étirement.</p>
<div class="lab">Application</div><p>Cette composante répond à la mobilisation, aux étirements individualisés, au positionnement, aux attelles et aux plâtres, et à l’évitement des positions raccourcies prolongées.</p>
<div class="lab">Limite</div><p>La séparation clinique des composantes réflexe et non réflexe est difficile.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-posture" data-title="Posture hémiplégique">
<div class="lab">Description</div><p>Membre supérieur fléchi et en adduction ; membre inférieur en extension. La dystonie spastique y contribue.</p>
<div class="lab">Usage</div><p>L’observation de la posture guide le choix des muscles à traiter par toxine botulique A. Pour l’épaule, le consensus européen distingue deux schémas.</p>
<div class="lab">Limite</div><p>Le dossier ne décrit pas la posture de la main ni du pied en détail.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-cocontraction" data-title="Cocontraction">
<div class="lab">Définition</div><p>Contraction simultanée de muscles antagonistes, par perte de l’inhibition réciproque.</p>
<div class="lab">Gravité</div><p>Elle est décrite comme la forme d’hyperactivité la plus invalidante du syndrome du motoneurone supérieur.</p>
<div class="lab">Lecture</div><p>Lorsque l’agoniste et l’antagoniste se contractent ensemble, le mouvement volontaire se heurte à sa propre résistance (déduction pédagogique).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-douleur" data-title="Douleur et spasticité">
<div class="lab">Relation</div><p>Douleur et spasticité s’entretiennent mutuellement.</p>
<div class="lab">Conséquence</div><p>Traiter l’une peut soulager l’autre ; le maintien du mouvement prévient l’hypertonie intrinsèque.</p>
<div class="lab">Limite</div><p>La douleur d’épaule hémiplégique n’est pas couverte par les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-geneve" data-title="Étude de Genève 2018-2019">
<div class="lab">Chiffres</div><p>Incidence annuelle du premier AVC standardisée sur la population européenne : 127,0/100 000 (ischémique 107,3 ; hémorragie intracérébrale 13,2 ; hémorragie sous-arachnoïdienne 6,0). Âge médian : 75,8 ans. Létalité à 30 jours : hémorragie intracérébrale 32,5 %, hémorragie sous-arachnoïdienne 17,2 %, ischémique 10,8 %.</p>
<div class="lab">Source</div><p>Swiss Stroke Registry et dossiers hospitaliers du canton de Genève.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu. Ces chiffres décrivent l’AVC, non l’hémiparésie elle-même.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/WNL.0000000000213353" target="_blank" rel="noopener">Dirren et al., Neurology 2025;104(5):e213353</a>.</p></template>
<template data-pop="g81-prevalence" data-title="Spasticité post-AVC : prévalence et facteurs de risque">
<div class="lab">Prévalence</div><p>25,3 % après AVC ; 26,7 % après un premier AVC ; 39,5 % chez les patients avec parésie. La spasticité invalidante (échelle d’Ashworth modifiée ≥ 3) concerne 9,4 % des patients parétiques.</p>
<div class="lab">Facteurs de risque</div><p>Parésie modérée à sévère (rapport de cotes, OR, de 6,57) ; AVC hémorragique (OR 1,88) ; trouble sensitif. Un rapport de cotes de 6,57 signifie que les cotes de spasticité sont environ 6,6 fois plus élevées dans le groupe exposé que dans le groupe de comparaison ; ce n’est pas un risque absolu.</p>
<div class="lab">Limite</div><p>Résumé seul lu ; études internationales, équipe chinoise. Ni causalité ni valeur individuelle.</p>
<p class="src">Références : <a href="https://doi.org/10.3389/fneur.2020.616097" target="_blank" rel="noopener">Zeng et al., Front Neurol 2021;11:616097</a>.</p></template>
<template data-pop="g81-jeunes" data-title="AVC ischémique du jeune adulte en Suisse">
<div class="lab">Population</div><p>3 995 patients de 18 à 55 ans, Swiss Stroke Registry, 2014-2022.</p>
<div class="lab">Causes</div><p>Chez les plus jeunes, le foramen ovale perméable et la dissection artérielle cervicale dominent ; l’athérosclérose des grosses artères et la maladie des petits vaisseaux augmentent avec l’âge.</p>
<div class="lab">Limite</div><p>Résumé seul lu. Les proportions exactes ne sont pas reprises ici.</p>
<p class="src">Références : <a href="https://doi.org/10.1177/23969873251317347" target="_blank" rel="noopener">Schneider et al., Eur Stroke J 2025;10(3):882-891</a>.</p></template>
<template data-pop="g81-mimics" data-title="Pseudo-AVC (stroke mimics)">
<div class="lab">Fréquence</div><p>24,8 % des AVC ischémiques suspectés dans une revue de 61 études (62 664 participants). Les types les plus fréquents : vestibulopathie périphérique 23,2 %, trouble toxique ou métabolique 13,2 %, crise épileptique 13 %, trouble fonctionnel 9,7 %, migraine 7,76 %.</p>
<div class="lab">Profil</div><p>Patients plus jeunes, plus souvent des femmes, moins de facteurs de risque vasculaire, tension artérielle presque normale, symptômes moins sévères. Aides cliniques : HINTS pour le vertige et signe de Hoover pour le trouble fonctionnel.</p>
<div class="lab">Sécurité</div><p>Thrombolyse d’un pseudo-AVC : hémorragie intracérébrale 0,7 % contre 9,4 % chez les AVC ; décès 1,9 % contre 11,3 %. Une évaluation par un médecin expérimenté est recommandée.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jocn.2021.09.025" target="_blank" rel="noopener">Pohl et al., J Clin Neurosci 2021;93:174-182</a> (résumé seul lu).</p></template>
<template data-pop="g81-todd" data-title="Paralysie postcritique de Todd">
<div class="lab">Description</div><p>Déficit moteur transitoire après une crise, de quelques minutes à plusieurs jours, surtout en cas de lésion cérébrale structurelle. Elle est classée en G83.8.</p>
<div class="lab">Piège</div><p>Elle peut simuler un AVC aigu. Le scanner de perfusion peut suggérer à tort une ischémie chez un patient en postcritique.</p>
<div class="lab">Limite</div><p>La source est un rapport de cas : niveau de preuve très faible, description clinique sans recommandation.</p>
<p class="src">Références : <a href="https://doi.org/10.7759/cureus.104991" target="_blank" rel="noopener">Ali et al., Cureus 2026;18(3):e104991</a>.</p></template>
<template data-pop="g81-horaire" data-title="Heure de début et dernière heure vu en bonne santé">
<div class="lab">Principe</div><p>L’heure de début, ou la dernière heure à laquelle le patient a été vu en bonne santé, conditionne la thrombolyse : moins de 4,5 heures, avec des fenêtres étendues selon l’imagerie.</p>
<div class="lab">Application</div><p>Dans la vignette, 7 h 10 est la dernière heure vue en bonne santé et 8 h 55 l’heure d’arrivée : environ 1 h 45 se sont écoulées. Le calcul est pédagogique et ne remplace pas la décision de l’équipe.</p>
<div class="lab">Limite</div><p>Si l’heure exacte est inconnue, on retient la dernière heure vu en bonne santé ; le dossier ne détaille pas les règles en cas d’incertitude.</p>
<p class="src">Références : <a href="https://academic.oup.com/esj/article/6/1/I/8271518" target="_blank" rel="noopener">Berge et al., ESO 2021</a>.</p></template>
<template data-pop="g81-aod" data-title="Anticoagulants oraux directs et thrombolyse">
<div class="lab">Fréquence</div><p>À Zurich (2020-2022), l’anticoagulant oral direct était le motif de non-thrombolyse chez 27 % des patients arrivés dans la fenêtre sans être traités. L’activité anti-Xa n’avait pas été testée chez 50 % d’entre eux.</p>
<div class="lab">Lecture</div><p>Le test d’activité anti-Xa pourrait renseigner sur l’effet anticoagulant résiduel ; le dossier ne dit pas à partir de quel seuil il autoriserait la thrombolyse.</p>
<div class="lab">Limite</div><p>Série monocentrique ; résumé seul lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.ajem.2026.04.004" target="_blank" rel="noopener">Zehnder et al., Am J Emerg Med 2026;105:88-94</a>.</p></template>
<template data-pop="g81-atcd" data-title="Antécédents à rechercher">
<div class="lab">Contenu</div><p>Crise épileptique récente (paralysie de Todd), facteurs vasculaires, prise d’un anticoagulant oral direct, causes propres au sujet jeune (foramen ovale perméable, dissection cervicale).</p>
<div class="lab">Raison</div><p>Chacun oriente vers un diagnostic ou conditionne un traitement : crise vers Todd, anticoagulant vers la thrombolyse, antécédents du jeune vers le bilan étiologique.</p>
<div class="lab">Limite</div><p>Le dossier ne liste pas d’autres antécédents (tumeur, traumatisme) : lacune de sources.</p>
<p class="src">Références : <a href="https://doi.org/10.1177/23969873251317347" target="_blank" rel="noopener">Schneider 2025</a> ; <a href="https://doi.org/10.7759/cureus.104991" target="_blank" rel="noopener">Ali 2026</a>.</p></template>
<template data-pop="g81-symptomes" data-title="Symptômes de l’hémiparésie">
<div class="lab">Aigus</div><p>Faiblesse d’un hémicorps, perte de dextérité, hypotonie.</p>
<div class="lab">Séquellaires</div><p>Raideur, spasmes, posture en flexion du membre supérieur, risque de chute, douleur.</p>
<div class="lab">Limite</div><p>Aucune fréquence de ces symptômes n’est donnée par les sources lues ; ils ne sont pas classés par fréquence.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-thumb" data-title="Thumb rolling test et épreuve de pronation">
<div class="lab">Résultats</div><p>Dans une série de 17 AVC moteurs purs légers, sensibilité de 88 % pour le thumb rolling test, 65 % pour le forearm rolling, 65 % pour l’index finger rolling et 47 % pour l’épreuve de pronation (pronator drift). Ces tests sont plus souvent anormaux que les tests de force, de tonus ou de réflexes ; les segments distaux sont plus atteints que les proximaux.</p>
<div class="lab">Lecture</div><p>Un déficit discret du membre supérieur échappe à l’examen de force classique ; les épreuves de rolling sont plus sensibles.</p>
<div class="lab">Limite</div><p>Petit effectif (17 patients). La technique détaillée des tests n’est pas reprise dans le dossier.</p>
<p class="src">Références : <a href="https://doi.org/10.1017/s0317167100011173" target="_blank" rel="noopener">Nowak, Can J Neurol Sci 2011;38(1):129-32</a>.</p></template>
<template data-pop="g81-hoover" data-title="Signe de Hoover">
<div class="lab">Rôle</div><p>Aide clinique citée pour reconnaître un trouble fonctionnel parmi les pseudo-AVC.</p>
<div class="lab">Limite</div><p>La technique et les performances du signe ne sont pas décrites dans le dossier (résumé de la revue seul lu).</p>
<div class="lab">Prudence</div><p>Un signe positif oriente ; il n’exclut pas à lui seul un AVC, et l’évaluation par un médecin expérimenté reste recommandée.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jocn.2021.09.025" target="_blank" rel="noopener">Pohl et al., 2021</a>.</p></template>
<template data-pop="g81-hints" data-title="Test HINTS">
<div class="lab">Rôle</div><p>Aide clinique citée pour le vertige parmi les pseudo-AVC (vestibulopathie périphérique : type le plus fréquent, 23,2 %).</p>
<div class="lab">Limite</div><p>La technique et les performances du test ne sont pas décrites dans le dossier (résumé seul lu).</p>
<div class="lab">Prudence</div><p>Un test orientant ne dispense pas d’imagerie en cas de doute.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jocn.2021.09.025" target="_blank" rel="noopener">Pohl et al., 2021</a>.</p></template>
<template data-pop="g81-mas" data-title="Échelle d’Ashworth modifiée">
<div class="lab">Usage</div><p>Échelle de cotation de la spasticité (MAS). Dans la méta-analyse de référence, un score ≥ 3 définit la spasticité invalidante. L’information professionnelle de la tizanidine mentionne l’échelle d’Ashworth.</p>
<div class="lab">Chiffre</div><p>9,4 % des patients parétiques après AVC ont une spasticité invalidante.</p>
<div class="lab">Limite</div><p>Les définitions détaillées des échelles d’Ashworth et de Tardieu ne sont pas dans le dossier.</p>
<p class="src">Références : <a href="https://doi.org/10.3389/fneur.2020.616097" target="_blank" rel="noopener">Zeng et al., 2021</a>.</p></template>
<template data-pop="g81-babinski" data-title="Signe de Babinski">
<div class="lab">Place</div><p>Signe positif du syndrome du motoneurone supérieur ; il apparaît tôt, avant la spasticité.</p>
<div class="lab">Lecture</div><p>Sa présence précoce atteste une atteinte de la voie motrice avant que la spasticité n’apparaisse.</p>
<div class="lab">Limite</div><p>La technique et la valeur diagnostique ne sont pas décrites dans le dossier.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4229996/" target="_blank" rel="noopener">Trompetto 2014</a>.</p></template>
<template data-pop="g81-echelles" data-title="Échelles citées par l’ESO 2025">
<div class="lab">Liste</div><p>Membre supérieur : FMA-UE (Fugl-Meyer, membre supérieur), ARAT, WMFT, MAL. Marche : test de marche de 6 minutes, test de marche de 5 m, FAC, FGA, Rivermead. Équilibre : Berg, Timed Up and Go. Indépendance : mesure d’indépendance fonctionnelle, Barthel.</p>
<div class="lab">Usage</div><p>Ces échelles servent à mesurer l’effet de la rééducation. Le choix dépend du domaine suivi.</p>
<div class="lab">Limite</div><p>Le dossier ne donne ni leurs seuils ni leur interprétation chiffrée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098312/" target="_blank" rel="noopener">ESO, rééducation motrice, Eur Stroke J 2025;10(4):1160-1188</a>.</p></template>
<template data-pop="g81-chute" data-title="Risque de chute">
<div class="lab">Constat</div><p>Le risque de chute est cité explicitement dans les informations professionnelles de BOTOX® et du baclofène (Liorésal®).</p>
<div class="lab">Lecture</div><p>La spasticité peut aider au maintien debout et à la marche ; la réduire ou administrer un relaxant peut donc fragiliser l’équilibre.</p>
<div class="lab">Limite</div><p>Aucun chiffre de risque n’est donné dans les extraits lus.</p>
<p class="src">Références : information professionnelle suisse BOTOX®, mai 2025 ; Liorésal®, janvier 2025 (Swissmedic, via AIPS).</p></template>
