<template data-pop="g81-imagerie" data-title="Imagerie cérébrale de l’hémiparésie aiguë">
<div class="lab">Rôle</div><p>Devant une hémiparésie aiguë, l’imagerie par scanner ou IRM confirme l’AVC, en précise la nature et conditionne la reperfusion. Le scanner de perfusion et l’IRM de diffusion ou de perfusion aident aussi à reconnaître un pseudo-AVC.</p>
<div class="lab">Fenêtres</div><p>Moins de 4,5 h : thrombolyse. Entre 4,5 et 9 h : un scanner natif seul s’oppose à la thrombolyse, une discordance noyau/perfusion l’autorise. AVC du réveil : discordance entre diffusion et FLAIR.</p>
<div class="lab">Limite</div><p>Le scanner de perfusion peut simuler une ischémie chez un patient en postcritique ; le rôle de l’IRM dans le diagnostic différentiel des pseudo-AVC est à mieux évaluer. Aucune recommandation spécifique « pseudo-AVC » n’a été lue.</p>
<p class="src">Références : <a href="https://academic.oup.com/esj/article/6/1/I/8271518" target="_blank" rel="noopener">Berge et al., ESO 2021</a> ; <a href="https://doi.org/10.1016/j.jocn.2021.09.025" target="_blank" rel="noopener">Pohl 2021</a> ; <a href="https://doi.org/10.7759/cureus.104991" target="_blank" rel="noopener">Ali 2026</a>.</p></template>
<template data-pop="g81-thrombolyse" data-title="Thrombolyse : recommandations ESO 2021">
<div class="lab">Recommandations</div><p>Moins de 4,5 h : thrombolyse intraveineuse par altéplase (forte, haute qualité). Entre 4,5 et 9 h avec scanner natif seul : contre la thrombolyse. Entre 4,5 et 9 h avec discordance noyau/perfusion, sans thrombectomie prévue : altéplase. AVC du réveil avec discordance diffusion/FLAIR : altéplase (forte, haute qualité). Dose des essais : 0,9 mg/kg.</p>
<div class="lab">Application</div><p>Pour une patiente de 62 kg, 0,9 mg/kg donne environ 56 mg. Ce calcul illustre l’ordre de grandeur ; la dose réellement administrée se vérifie dans l’information professionnelle de l’altéplase, qui n’a pas été lue dans ce dossier.</p>
<div class="lab">Limite</div><p>Le texte a été lu sur 100 000 des 421 245 caractères. La ténectéplase n’est pas couverte. À Zurich, 51,5 % des AVC arrivés avant 4,5 h n’ont pas été thrombolysés (symptômes légers 41,8 %, anticoagulant oral direct 27 %, infarctus démarqué 8,3 %).</p>
<p class="src">Références : <a href="https://academic.oup.com/esj/article/6/1/I/8271518" target="_blank" rel="noopener">Berge et al., Eur Stroke J 2021;6(1)</a> ; <a href="https://doi.org/10.1016/j.ajem.2026.04.004" target="_blank" rel="noopener">Zehnder et al., 2026</a>.</p></template>
<template data-pop="g81-dysphagie" data-title="Dysphagie post-AVC">
<div class="lab">Fréquence</div><p>Plus de 50 % des patients en phase aiguë.</p>
<div class="lab">Recommandation</div><p>Dépistage chez tous les patients (qualité modérée), pour prévenir la pneumonie et la mortalité précoce. Les complications sont la pneumonie d’aspiration, la dénutrition et la déshydratation.</p>
<div class="lab">Limite</div><p>Seul le résumé de la recommandation de l’ESO et de l’ESSD (European Society for Swallowing Disorders) a été lu : la méthode de dépistage n’est pas détaillée.</p>
<p class="src">Références : <a href="https://doi.org/10.1177/23969873211039721" target="_blank" rel="noopener">Dziewas et al., Eur Stroke J 2021;6(3)</a>.</p></template>
<template data-pop="g81-mobilisation" data-title="Mobilisation précoce : guide suisse 2026">
<div class="lab">Contenu</div><p>Guide pratique et document de discussion de la Swiss Stroke Society (réseaux Stroke Therapy et Stroke Nursing), non contraignant, applicable dès janvier 2026 dans les centres et unités neurovasculaires suisses.</p>
<div class="lab">Preuves</div><p>Les preuves sont insuffisantes pour fixer la dose et l’intensité de la mobilisation précoce.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu (le site de la revue était indisponible) : les détails chiffrés ne sont pas repris.</p>
<p class="src">Références : <a href="https://doi.org/10.57187/4921" target="_blank" rel="noopener">Swiss Med Wkly 2026;156:4921</a>.</p></template>
<template data-pop="g81-intensite" data-title="Définition de la haute intensité">
<div class="lab">Définition</div><p>Selon l’ESO 2025, la haute intensité correspond à 60 à 84 % de la fréquence cardiaque de réserve, ou 77 à 93 % de la fréquence cardiaque maximale, ou 14 à 16 sur l’échelle de Borg cotée sur 20.</p>
<div class="lab">Application</div><p>L’entraînement à haute intensité de la marche est recommandé en phase chronique (plus de 6 mois), si l’état cardiovasculaire est stable : endurance, recommandation forte de qualité modérée ; vitesse de marche, recommandation faible de faible qualité.</p>
<div class="lab">Limite</div><p>Le résumé grand public de la recommandation dit « fortement recommandé » pour les deux ; l’abstract et la question PICO 3 distinguent fort pour l’endurance et faible pour la vitesse. La version précise est retenue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098312/" target="_blank" rel="noopener">ESO 2025</a>.</p></template>
<template data-pop="g81-bci" data-title="Interface cerveau-ordinateur">
<div class="lab">Résultat</div><p>Revue Cochrane 2026 (43 essais randomisés, 1 628 participants) : amélioration possible et légère de la fonction du membre supérieur par rapport à la thérapie conventionnelle (différence moyenne du Fugl-Meyer : 4,67), certitude faible. Aucun effet sur la spasticité.</p>
<div class="lab">Lecture</div><p>L’interface n’est pas une recommandation de pratique courante dans les sources lues.</p>
<div class="lab">Limite</div><p>Résumé seul lu ; certitude faible à très faible.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/14651858.CD015065.pub2" target="_blank" rel="noopener">Qin et al., Cochrane 2026</a>.</p></template>
<template data-pop="g81-botox" data-title="BOTOX® : toxine botulique A">
<div class="lab">Mécanisme</div><p>La toxine bloque la libération présynaptique d’acétylcholine en clivant la protéine SNAP-25 (protéine associée aux synaptosomes de 25 kDa). Le muscle injecté se relâche.</p>
<div class="lab">Information professionnelle suisse</div><p>Indication : traitement symptomatique de la spasticité focale des membres supérieurs et inférieurs de l’adulte (et dès 2 ans). Membre supérieur : biceps 50–200 U (≤ 4 sites), fléchisseur profond des doigts 7,5–30 U, fléchisseur superficiel 7,5–30 U, fléchisseur radial du carpe 15–60 U, fléchisseur ulnaire du carpe 10–40 U ; total ≤ 360 U dans les études, en général ≤ 6 U/kg. Membre inférieur : 300–400 U, maximum 400 U par séance. Effet en 2 semaines, maximum en 4–6 semaines.</p>
<div class="lab">Précautions et limites</div><p>Pas pour la cheville ou le pied après AVC sans gain attendu ; risque de chute ; prudence chez les âgés comorbides ; décès après commercialisation (parfois par pneumonie d’aspiration) et diffusion à distance. Dysport® et Xeomin ont aussi une indication de spasticité focale en Suisse ; leurs textes n’ont pas été lus.</p>
<p class="src">Références : information professionnelle suisse BOTOX®, mise à jour mai 2025 (Swissmedic, via AIPS).</p></template>
<template data-pop="g81-botox-epaule" data-title="Spasticité de l’épaule : consensus européen">
<div class="lab">Principe</div><p>Cinq experts européens font de la toxine botulique A une option de première ligne de la spasticité post-AVC et choisissent la cible selon la limitation fonctionnelle et les attentes du patient.</p>
<div class="lab">Schémas</div><p>Schéma A (adduction, élévation, flexion, rotation interne) : grand pectoral et grand rond, parfois subscapulaire. Schéma B (abduction ou adduction, extension, rotation interne) : deltoïde postérieur, grand rond, grand dorsal.</p>
<div class="lab">Limite</div><p>Consensus d’experts de 2022, résumé seul lu ; financement industriel possible non vérifié. L’information professionnelle suisse prime pour l’usage autorisé.</p>
<p class="src">Références : <a href="https://doi.org/10.3389/fneur.2022.1004629" target="_blank" rel="noopener">Front Neurol 2022;13:1004629</a>.</p></template>
<template data-pop="g81-immuno" data-title="Immunogénicité de la toxine botulique">
<div class="lab">Chiffres</div><p>Dans une revue de 1 234 patients (91 % après AVC), les anticorps neutralisants concernent environ 1 % des patients traités pour spasticité des membres. Pour expliquer une non-réponse secondaire, leur sensibilité est de 56 % et leur spécificité de 99,6 %.</p>
<div class="lab">Lecture</div><p>L’immunogénicité n’est pas la cause la plus fréquente de non-réponse. Un test positif est très évocateur ; un test négatif n’écarte pas l’explication, la sensibilité étant de 56 %.</p>
<div class="lab">Limite</div><p>Résumé seul lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.rehab.2019.03.004" target="_blank" rel="noopener">Mathevon et al., Ann Phys Rehabil Med 2019;62(4):241-251</a>.</p></template>
<template data-pop="g81-tizanidine" data-title="Tizanidine : information suisse">
<div class="lab">Indications et mécanisme</div><p>Spasmes douloureux ; spasticité de la sclérose en plaques, des lésions médullaires et des lésions cérébrales. Agoniste alpha-2 présynaptique : baisse de la libération d’acides aminés excitateurs (récepteurs NMDA), donc inhibition polysynaptique des interneurones spinaux.</p>
<div class="lab">Posologie et sécurité</div><p>Début ≤ 6 mg/j en 3 prises, + 2–4 mg une à deux fois par semaine ; optimum 12–24 mg/j ; maximum 36 mg/j. Contre-indiquée en cas d’insuffisance hépatique sévère et avec les inhibiteurs puissants du CYP1A2 (cytochrome P450, famille 1, sous-famille A, isoforme 2 : fluvoxamine, ciprofloxacine). Arrêt progressif (rebond hypertensif, tachycardie). Clairance de la créatinine &lt; 25 mL/min : exposition × 6, début à 2 mg une fois par jour.</p>
<div class="lab">Limite</div><p>Le texte lu est celui d’un générique (Tizanidine axapharm, janvier 2026) ; l’original n’a pas été lu.</p>
<p class="src">Références : information professionnelle suisse Tizanidine axapharm, janvier 2026 (Swissmedic, via AIPS).</p></template>
<template data-pop="g81-baclofene" data-title="Baclofène oral : Liorésal®">
<div class="lab">Indication suisse</div><p>Spasticité grave réversible de la sclérose en plaques ; spasticité médullaire (infectieuse, dégénérative, traumatique, néoplasique). Aucune indication cérébrale ou post-AVC : usage hors indication après AVC, avec mention d’une mauvaise tolérance « principalement à la suite d’un AVC ».</p>
<div class="lab">Mécanisme et posologie</div><p>Agoniste du récepteur GABA-B (acide gamma-aminobutyrique, type B) médullaire. Début 3 × 5 mg/j, + 5 mg par prise tous les 3 jours ; 30–80 mg/j ; 100–120 mg/j sous surveillance hospitalière. Arrêt progressif sur environ 3 semaines.</p>
<div class="lab">Prudences</div><p>Utilité possible de la spasticité pour la station debout (chute) ; rétention urinaire ; insuffisance rénale terminale ; suicidalité ; abus.</p>
<p class="src">Références : information professionnelle suisse Liorésal®, janvier 2025 (Swissmedic, via AIPS).</p></template>
<template data-pop="g81-intrathecal" data-title="Baclofène intrathécal">
<div class="lab">Statut dans le dossier</div><p>Liorésal intrathécal® figure dans la recherche AIPS (titre, titulaire, classe ATC, indication), mais son texte complet n’a pas été lu.</p>
<div class="lab">Conséquence</div><p>Ce cours ne donne ni indication précise, ni posologie, ni précautions de la forme intrathécale.</p>
<div class="lab">Suite</div><p>Il faut lire l’information professionnelle complète avant toute prescription.</p>
<p class="src">Références : fiches de recherche AIPS (Swissmedic, via AmiKo).</p></template>
<template data-pop="pareto-g81-definition" data-title="Pareto — Définition et codage">
<p class="ratio" data-cover="g81-0,g81-1"></p><ul><li>G81.0 flasque, G81.1 spastique, G81.9 sans précision.</li><li>Code primaire seulement si la cause est inconnue ou ancienne ; sinon supplémentaire.</li><li>Une faiblesse d’hémicorps récente est un AVC jusqu’à preuve du contraire.</li></ul></template>
<template data-pop="pareto-g81-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g81-3"></p><ul><li>Faiblesse d’abord, spasticité ensuite.</li><li>La spasticité résulte d’une prédominance de la facilitation supraspinale et d’une plasticité spinale.</li><li>La part intrinsèque du muscle répond à la mobilisation.</li></ul></template>
<template data-pop="pareto-g81-causes" data-title="Pareto — Causes">
<p class="ratio" data-cover="g81-4"></p><ul><li>Cause documentée : AVC ischémique ou hémorragique.</li><li>Jeune : foramen ovale perméable, dissection cervicale.</li><li>Parésie sévère et AVC hémorragique : facteurs de risque de spasticité.</li></ul></template>
<template data-pop="pareto-g81-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g81-5,g81-6"></p><ul><li>Heure de début, anticoagulant, crise récente.</li><li>Les épreuves de rolling sont plus sensibles que la force dans un déficit discret.</li><li>Spasticité invalidante : échelle d’Ashworth modifiée ≥ 3.</li></ul></template>
<template data-pop="pareto-g81-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="g81-7"></p><ul><li>L’imagerie tranche en aigu.</li><li>24,8 % des AVC suspectés sont des pseudo-AVC.</li><li>La paralysie de Todd peut simuler une ischémie en perfusion.</li></ul></template>
<template data-pop="pareto-g81-urgences" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="g81-8"></p><ul><li>AVC traitable, anticoagulant, dysphagie en premier.</li><li>Dysphagie dans plus de 50 % des AVC aigus.</li><li>Chute et douleur : complications séquellaires.</li></ul></template>
<template data-pop="pareto-g81-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g81-9"></p><ul><li>Altéplase avant 4,5 h ; fenêtres étendues selon l’imagerie.</li><li>Rééducation : 20 h supplémentaires au membre supérieur et à la marche.</li><li>Spasticité : mobilisation, puis toxine botulique A (focale) ou tizanidine ; baclofène oral hors indication après AVC.</li></ul></template>
<template data-pop="pareto-g81-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g81-e-1,g81-e-2,g81-e-3,g81-e-4"></p><ul><li>L’imagerie répond à l’urgence ; les échelles répondent au suivi.</li><li>Une échelle par domaine : membre supérieur, marche, équilibre, indépendance, spasticité.</li><li>Anticorps neutralisants : sensibilité 56 %, spécificité 99,6 %.</li></ul></template>
<template data-pop="pareto-g81-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g81-s-anat-cours"></p><ul><li>Voie réticulospinale dorsale inhibitrice ; voies médiane et vestibulospinale facilitatrices.</li><li>Les muscles cibles se choisissent d’après la posture.</li></ul></template>
<template data-pop="pareto-g81-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g81-s-histo-cours"></p><ul><li>Position courte prolongée : moins de sarcomères en série, plus de tissu conjonctif.</li><li>Résistance indépendante de la vitesse.</li></ul></template>
<template data-pop="pareto-g81-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g81-s-physio-cours"></p><ul><li>Spasticité dépendante de la vitesse et de la longueur musculaire.</li><li>Dépression post-activation réduite, corrélée à la sévérité.</li></ul></template>
<template data-pop="pareto-g81-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g81-s-bioch-cours"></p><ul><li>Toxine botulique : SNAP-25, acétylcholine.</li><li>Tizanidine : alpha-2. Baclofène : GABA-B.</li></ul></template>
<template data-pop="pareto-g81-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g81-p-1,g81-p-2,g81-p-3,g81-p-4"></p><ul><li>BOTOX® : membre supérieur ≤ 360 U, membre inférieur ≤ 400 U.</li><li>Tizanidine : maximum 36 mg/j ; baclofène : 30–80 mg/j.</li><li>Baclofène oral : hors indication après AVC.</li></ul></template>
