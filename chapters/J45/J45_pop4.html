
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j45-clin" data-title="Pareto — Définition, mécanismes et clinique">
<p class="ratio" data-cover="j45-0,j45-1,j45-2,j45-3,j45-4,j45-5,j45-6"></p>
<ul>
<li>Asthme = inflammation chronique + symptômes <b>variables</b> + limitation <b>variable</b> du débit expiratoire.</li>
<li>Contrôle (4 dernières semaines, 4 questions) ≠ sévérité (palier nécessaire pour contrôler) ≠ risque futur.</li>
<li>Un asthme léger peut faire une crise mortelle ; salbutamol seul = principal facteur évitable. Cartouches de secours : ≥ 3/an risque, ≥ 12/an risque de décès.</li>
<li>Chaîne : déclencheur → inflammation de type 2 (IL-4 IgE, IL-5 éosinophiles, IL-13 mucus et FeNO) → hyperréactivité → obstruction (spasme, œdème, mucus) → sibilants, distension, hypoxémie → remodelage si non traité.</li>
<li>Déclencheurs : virus, allergènes, effort, froid, tabac, bêtabloquants (collyres compris), aspirine dans la N-ERD.</li>
<li>Phénotype utile : type 2 élevé (éosinophiles, FeNO, IgE) versus faible.</li>
<li>Symptômes évocateurs : plusieurs, variables, nocturnes, déclenchés ; examen souvent normal hors crise.</li>
<li>Toujours faire démontrer la technique d’inhalation ; stridor inspiratoire → larynx.</li>
<li>Gravité : parole, conscience, saturation ; thorax silencieux = menace vitale ; intensité des sibilants ≠ gravité.</li></ul></template>
<template data-pop="pareto-j45-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j45-7"></p>
<ul>
<li>Diagnostic = symptômes variables <b>et</b> preuve objective, idéalement avant traitement.</li>
<li>Spirométrie : obstruction si VEMS/CVF &lt; limite inférieure de la normale ; réversibilité &gt; 12 % et &gt; 200 mL.</li>
<li>Autres preuves : débit de pointe variable &gt; 10 % (adulte) ; +12 % et +200 mL après 4 semaines ; effort −10 % et −200 mL ; provocation positive.</li>
<li>Spirométrie normale ou réversibilité absente n’excluent pas ; méthacholine négative chez un patient non traité exclut presque.</li>
<li>FeNO et éosinophiles soutiennent, ne suffisent pas.</li>
<li>Différentiels graves d’abord : embolie, insuffisance cardiaque, corps étranger ou tumeur, anaphylaxie ; puis BPCO, larynx, bronchectasies, ABPA et vascularite.</li></ul></template>
<template data-pop="pareto-j45-urg" data-title="Pareto — Exacerbation et état de mal">
<p class="ratio" data-cover="j45-8"></p>
<ul>
<li>Sévère : mots, penché en avant, fréquence respiratoire &gt; 30, fréquence cardiaque &gt; 120, saturation &lt; 90 %, débit de pointe ≤ 50 %.</li>
<li>Menace vitale : somnolence, confusion, thorax silencieux, épuisement → soins intensifs.</li>
<li>Salbutamol 4–10 bouffées avec chambre toutes les 20 minutes ; oxygène 93–95 % (enfant 94–98 %) ; prednisone 40–50 mg 5–7 jours dès la première heure ; ipratropium si sévère ; magnésium 2 g intraveineux si réfractaire.</li>
<li>Pas de sédatif, pas d’antibiotique systématique, pas d’aminophylline, radiographie seulement si doute.</li>
<li>PaCO₂ normale ou &gt; 42 mmHg en crise = épuisement.</li>
<li>Ventilé : fréquence basse, expiration longue, hypercapnie permissive ; hypotension → déconnecter, exclure un pneumothorax.</li>
<li>Sortie : débit de pointe &gt; 60–80 %, traitement de fond intensifié, plan écrit, contrôle en 2–7 jours.</li></ul></template>
<template data-pop="pareto-j45-tt" data-title="Pareto — Traitement de fond">
<p class="ratio" data-cover="j45-9,j45-10"></p>
<ul>
<li>Objectifs : contrôle des symptômes et réduction du risque ; rémission possible (GINA 2026).</li>
<li>Voie 1 préférée : budésonide-formotérol (ou béclométasone-formotérol) en secours à tous les paliers ; paliers 1–2 à la demande ; 3 MART faible dose ; 4 MART dose moyenne ; 5 ajout de tiotropium, phénotypage, biothérapie.</li>
<li>Jamais de BALA seul ; jamais de salbutamol seul chez l’adolescent et l’adulte.</li>
<li>Monter si non contrôlé après vérification technique et adhésion ; descendre après 3 mois de contrôle ; ne jamais arrêter complètement le corticostéroïde inhalé.</li>
<li>Enfant ≤ 5 ans : diagnostic possible ; corticostéroïde inhalé quotidien avec chambre et masque.</li>
<li>Asthme sévère : corriger d’abord (technique, adhésion, comorbidités, expositions), puis phénotyper ; anti-IgE, anti-IL-5, anti-IL-4Rα, anti-TSLP ; évaluer à 4 mois.</li>
<li>Éosinophiles &gt; 1 500/µL : chercher une granulomatose éosinophilique avec polyangéite avant biothérapie.</li></ul></template>
<template data-pop="pareto-j45-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="j45-11,j45-12,j45-13"></p>
<ul>
<li>Revoir 1–3 mois après modification, dans la semaine après une exacerbation ; une exacerbation avec corticostéroïde oral = revoir le traitement.</li>
<li>Risque : exacerbation dans l’année, intubation antérieure, VEMS &lt; 60 %, secours seul, tabac, éosinophiles ou FeNO élevés, grossesse, facteurs psychosociaux.</li>
<li>Grossesse : poursuivre le traitement (budésonide), saturation ≥ 95 % en crise, éviter le carboprost.</li>
<li>Sujet âgé : dispositif adapté ; bêtabloquant cardiosélectif possible si indispensable.</li>
<li>Asthme professionnel : débit de pointe travail/congé, déclaration à la Suva, éviction précoce.</li>
<li>Critères formels : symptômes variables + obstruction documentée (rapport &lt; limite inférieure de la normale) avec variabilité excessive par au moins un test.</li></ul></template>
<template data-pop="pareto-j45-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j45-e-1,j45-e-2,j45-e-3,j45-e-4,j45-e-5"></p>
<ul>
<li>Référence : spirométrie avec réversibilité ; qualité : 3 manœuvres, écart ≤ 150 mL ; suspendre les bronchodilatateurs avant.</li>
<li>Obstruction : rapport &lt; limite inférieure de la normale (z −1,645), pas 0,70 fixe ; courbe concave ; plateau = voies aériennes supérieures.</li>
<li>Débit de pointe : variabilité = (max − min) / moyenne ; &gt; 10 % adulte.</li>
<li>Méthacholine : sensible, sert à exclure ; mannitol et effort : spécifiques, servent à confirmer.</li>
<li>Éosinophiles ≥ 150 et ≥ 300/µL ; &gt; 1 500 : autre cause. FeNO &gt; 50 ppb adulte : type 2 corticosensible ; tabac l’abaisse.</li>
<li>Sensibilisation ≠ allergie. IgE totales : dose d’omalizumab, dépistage de l’ABPA.</li>
<li>Radiographie non systématique ; DLCO normale dans l’asthme, basse dans l’emphysème ; PaCO₂ normale en crise = gravité.</li></ul></template>
<template data-pop="pareto-j45-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j45-p-1,j45-p-2,j45-p-3,j45-p-4"></p>
<ul>
<li>Tout asthmatique reçoit un corticostéroïde inhalé ; BALA seulement en association fixe ; seul le formotérol sert de secours et de MART.</li>
<li>Doses faibles quotidiennes : budésonide 200–400 µg, béclométasone extrafine 100–200 µg, fluticasone propionate 100–250 µg.</li>
<li>Maximum : 12 inhalations de budésonide-formotérol 200/6 par jour ; 8 de béclométasone-formotérol 100/6.</li>
<li>Palier 5 : tiotropium 2 × 2,5 µg/jour ; biothérapies selon phénotype ; azithromycine ; corticostéroïde oral en dernier recours.</li>
<li>Interactions : inhibiteurs du CYP3A4 + fluticasone ou budésonide (Cushing) ; théophylline + fluvoxamine ou ciprofloxacine ; bêtabloquants non sélectifs ; hypokaliémie additive.</li>
<li>Montélukast : effets neuropsychiatriques. Corticostéroïde oral : toxicité cumulative dès 0,5–1 g.</li>
<li>À éviter : bêtabloquants non sélectifs et collyres, aspirine et anti-inflammatoires dans la N-ERD, sédatifs en crise, fénotérol.</li></ul></template>
