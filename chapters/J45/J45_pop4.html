
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j45-clin" data-title="Pareto — Définition, mécanismes et clinique">
<p class="ratio" data-cover="j45-0,j45-1,j45-2,j45-3,j45-4,j45-5,j45-6"></p>
<ul>
<li>L’asthme associe une inflammation chronique, des symptômes <b>variables</b> et une limitation <b>variable</b> du débit expiratoire.</li>
<li>Contrôle (4 dernières semaines, 4 questions) ≠ sévérité (palier nécessaire pour contrôler) ≠ risque futur.</li>
<li>Un asthme léger peut faire une crise mortelle ; salbutamol seul = principal facteur évitable. Cartouches de secours : ≥ 3/an risque, ≥ 12/an risque de décès.</li>
<li>Un déclencheur active l’inflammation de type 2 : l’IL-4 induit les IgE, l’IL-5 les éosinophiles et l’IL-13 le mucus et la FeNO. Cette inflammation crée l’hyperréactivité, puis l’obstruction par spasme, œdème et mucus, qui se traduit par des sibilants, une distension et une hypoxémie ; sans traitement, un remodelage s’installe.</li>
<li>Les déclencheurs sont les virus, les allergènes, l’effort, le froid, le tabac, les bêtabloquants, collyres compris, et l’aspirine dans la N-ERD.</li>
<li>Le phénotype utile sépare un asthme de type 2 élevé, avec éosinophiles, FeNO ou IgE augmentés, d’un asthme de type 2 faible.</li>
<li>Symptômes évocateurs : plusieurs, variables, nocturnes, déclenchés ; examen souvent normal hors crise.</li>
<li>Il faut toujours faire démontrer la technique d’inhalation ; un stridor inspiratoire oriente vers le larynx plutôt que vers les bronches.</li>
<li>La gravité se juge sur la parole, la conscience et la saturation ; un thorax silencieux signe une menace vitale, et l’intensité des sibilants ne reflète pas la gravité.</li></ul></template>
<template data-pop="pareto-j45-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j45-7"></p>
<ul>
<li>Diagnostic = symptômes variables <b>et</b> preuve objective, idéalement avant traitement.</li>
<li>La spirométrie montre une obstruction si le rapport VEMS/CVF est inférieur à la limite inférieure de la normale, et une réversibilité si le VEMS augmente de plus de 12 % et de plus de 200 mL.</li>
<li>D’autres preuves de variabilité sont acceptées : une variabilité du débit de pointe supérieure à 10 % chez l’adulte, un gain de 12 % et de 200 mL après 4 semaines de traitement, une chute de 10 % et de 200 mL à l’effort, ou un test de provocation positif.</li>
<li>Spirométrie normale ou réversibilité absente n’excluent pas ; méthacholine négative chez un patient non traité exclut presque.</li>
<li>FeNO et éosinophiles soutiennent, ne suffisent pas.</li>
<li>Il faut écarter d’abord les différentiels graves, à savoir l’embolie, l’insuffisance cardiaque, le corps étranger ou la tumeur et l’anaphylaxie ; viennent ensuite la BPCO, le larynx, les bronchectasies, l’ABPA et la vascularite.</li></ul></template>
<template data-pop="pareto-j45-urg" data-title="Pareto — Exacerbation et état de mal">
<p class="ratio" data-cover="j45-8"></p>
<ul>
<li>Crise sévère selon GINA 2026, dès un seul critère : incapacité de parler, de boire ou de s’allonger, fréquence respiratoire &gt; 30/min, saturation &lt; 92 %, thorax silencieux ou débit de pointe &lt; 50 %.</li>
<li>Menace vitale : somnolence, confusion, thorax silencieux, épuisement → soins intensifs.</li>
<li>En crise, le patient reçoit du salbutamol avec chambre : 4 bouffées si la crise est légère, 4 à 6 si elle est modérée et 6 à 10 si elle est sévère, répétées toutes les 20 à 30 minutes. L’oxygène vise une saturation de 92 à 95 %, et la prednisone, 40 à 50 mg pendant 5 à 7 jours, commence dès la première heure. L’ipratropium s’ajoute dès qu’une crise modérée répond mal, et d’emblée si la crise est sévère ; le magnésium, 2 g par voie intraveineuse, se discute si la crise reste réfractaire.</li>
<li>Pas de sédatif, pas d’antibiotique systématique, pas d’aminophylline, radiographie seulement si doute.</li>
<li>Une PaCO₂ normale ou élevée en crise signale l’épuisement.</li>
<li>Chez le patient ventilé, on choisit une fréquence basse et une expiration longue, en acceptant une hypercapnie, pour limiter la distension. En cas d’hypotension, on déconnecte le respirateur et on exclut un pneumothorax.</li>
<li>Sortie : critères de crise légère stables 1 à 2 heures après le dernier salbutamol, saturation ≥ 92 % à l’air, débit de pointe &gt; 70 % ; traitement de fond renforcé, plan écrit, contrôle en 2 à 7 jours.</li></ul></template>
<template data-pop="pareto-j45-tt" data-title="Pareto — Traitement de fond">
<p class="ratio" data-cover="j45-9,j45-10"></p>
<ul>
<li>Objectifs : contrôle des symptômes et réduction du risque futur ; rémission clinique possible chez certains patients sévères sous biothérapie (GINA 2026).</li>
<li>La voie 1 est préférée : le budésonide-formotérol, ou le béclométasone-formotérol, sert de secours à tous les paliers. Il se prend à la demande aux paliers 1 et 2, en MART à faible dose au palier 3 et à dose moyenne au palier 4 ; au palier 5, on ajoute le tiotropium, on phénotype et on discute une biothérapie.</li>
<li>Jamais de BALA seul ; jamais de salbutamol seul chez l’adolescent et l’adulte.</li>
<li>Monter si non contrôlé après vérification technique et adhésion ; descendre après 3 mois de contrôle ; ne jamais arrêter complètement le corticostéroïde inhalé.</li>
<li>Chez l’enfant de 5 ans au plus, le diagnostic reste possible, et le traitement de fond repose sur un corticostéroïde inhalé quotidien avec chambre et masque.</li>
<li>Asthme sévère : corriger d’abord (technique, adhésion, comorbidités, expositions), puis phénotyper ; anti-IgE, anti-IL-5, anti-IL-4Rα, anti-TSLP ; évaluer à 4 mois.</li>
<li>Si les éosinophiles dépassent 1 500/µL, il faut rechercher une granulomatose éosinophilique avec polyangéite avant toute biothérapie, car une biothérapie pourrait masquer cette vascularite.</li></ul></template>
<template data-pop="pareto-j45-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="j45-11,j45-12,j45-13"></p>
<ul>
<li>Le patient est revu 1 à 3 mois après une modification, dans les 2 à 7 jours après une exacerbation ; une exacerbation avec corticostéroïde oral = revoir le traitement.</li>
<li>Le risque d’exacerbation augmente après une exacerbation dans l’année, une intubation antérieure, un VEMS inférieur à 60 %, l’usage du seul secours, le tabac, des éosinophiles ou une FeNO élevés, la grossesse et des facteurs psychosociaux.</li>
<li>Grossesse : poursuivre le traitement (budésonide), saturation ≥ 95 % en crise, éviter le carboprost.</li>
<li>Chez le sujet âgé, on adapte le dispositif d’inhalation à ses capacités, et un bêtabloquant cardiosélectif reste possible s’il est indispensable.</li>
<li>Dans l’asthme professionnel, on compare le débit de pointe au travail et en congé, on déclare le cas à la Suva et on organise une éviction précoce, qui améliore le pronostic.</li>
<li>Les critères formels exigent des symptômes variables et une obstruction documentée, avec un rapport inférieur à la limite inférieure de la normale, ainsi qu’une variabilité excessive prouvée par au moins un test.</li></ul></template>
<template data-pop="pareto-j45-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j45-e-1,j45-e-2,j45-e-3,j45-e-4,j45-e-5"></p>
<ul>
<li>La spirométrie avec test de réversibilité est l’examen de référence ; sa qualité exige 3 manœuvres avec un écart d’au plus 150 mL, et les bronchodilatateurs doivent être suspendus avant.</li>
<li>L’obstruction se définit par un rapport inférieur à la limite inférieure de la normale, soit un z-score de −1,645, et non par le seuil fixe de 0,70 ; la courbe devient concave, alors qu’un plateau oriente vers les voies aériennes supérieures.</li>
<li>La variabilité du débit de pointe se calcule comme la différence entre le maximum et le minimum divisée par leur moyenne ; elle est excessive au-delà de 10 % chez l’adulte.</li>
<li>Méthacholine : sensible, sert à exclure ; mannitol et effort : spécifiques, servent à confirmer.</li>
<li>Des éosinophiles d’au moins 150 puis 300/µL guident les biothérapies, alors qu’une valeur supérieure à 1 500/µL fait chercher une autre cause. Une FeNO supérieure à 50 ppb chez l’adulte indique un asthme de type 2 corticosensible, sachant que le tabac l’abaisse.</li>
<li>Une sensibilisation ne signifie pas une allergie cliniquement active. Les IgE totales servent à calculer la dose d’omalizumab et à dépister l’ABPA.</li>
<li>La radiographie n’est pas systématique. La DLCO est normale dans l’asthme et basse dans l’emphysème, et une PaCO₂ normale pendant une crise signe une gravité, car elle devrait être basse sous l’effet de l’hyperventilation.</li></ul></template>
<template data-pop="pareto-j45-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j45-p-1,j45-p-2,j45-p-3,j45-p-4"></p>
<ul>
<li>Tout asthmatique reçoit un corticostéroïde inhalé ; BALA seulement en association fixe ; seul le formotérol sert de secours et de MART.</li>
<li>Les doses quotidiennes faibles sont de 200 à 400 µg de budésonide, de 100 à 200 µg de béclométasone extrafine et de 100 à 250 µg de fluticasone propionate.</li>
<li>Maximum : 12 inhalations de budésonide-formotérol 200/6 par jour ; 8 de béclométasone-formotérol 100/6.</li>
<li>Au palier 5, on ajoute le tiotropium à 2 × 2,5 µg par jour, puis une biothérapie selon le phénotype ou l’azithromycine ; le corticostéroïde oral n’intervient qu’en dernier recours.</li>
<li>Interactions : inhibiteurs du CYP3A4 + fluticasone ou budésonide (Cushing) ; théophylline + fluvoxamine ou ciprofloxacine ; bêtabloquants non sélectifs ; hypokaliémie additive.</li>
<li>Le montélukast expose à des effets neuropsychiatriques. Le corticostéroïde oral a une toxicité cumulative dès une dose totale de 0,5 à 1 g.</li>
<li>Il faut éviter les bêtabloquants non sélectifs, y compris en collyre, l’aspirine et les anti-inflammatoires dans la N-ERD, les sédatifs pendant une crise et le fénotérol.</li></ul></template>
