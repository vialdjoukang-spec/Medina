<section class="ilot" id="j45-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 27 ans consulte pour une toux sèche nocturne qui dure depuis deux mois. Elle décrit des épisodes de sifflement lorsqu’elle court par temps froid et une oppression thoracique au printemps. En revanche, entre ces épisodes, elle va bien. Elle utilise depuis un an un spray de salbutamol, prescrit lors d’un passage aux urgences, qu’elle achève en six semaines. Dès lors, la question qui structure tout le chapitre est la suivante : <b>cette patiente a-t-elle un asthme, comment le prouver objectivement, quel est son niveau de risque, et quel traitement anti-inflammatoire réduira ses crises et son risque de décès ?</b></p>
<p>Ainsi, le médecin assistant doit savoir reconnaître un tableau évocateur, démontrer une obstruction bronchique variable par la spirométrie ou le débit expiratoire de pointe, évaluer le contrôle des symptômes et le risque d’exacerbation, reconnaître une crise grave et la traiter, et construire un traitement de fond selon la stratégie de la Global Initiative for Asthma (GINA) 2026, qui sert de référence à la Société suisse de pneumologie et à la Ligue pulmonaire suisse.</p>
<div class="key"><b>Message fondateur.</b> L’asthme est une maladie <b>inflammatoire chronique</b>, et non une succession de crises isolées. Traiter seulement le bronchospasme par un bronchodilatateur, sans corticostéroïde inhalé, soulage les symptômes mais laisse progresser l’inflammation : c’est le principal facteur évitable d’exacerbation et de décès. C’est pourquoi GINA ne recommande plus aucun traitement par <button class="w" data-k="j45-d-saba">bronchodilatateur de courte durée seul (salbutamol, terbutaline)</button> chez l’adolescent et l’adulte.</div>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="j45-t2">inflammation de type 2 (lymphocytes Th2, éosinophiles, IgE)</button>, l’<button class="w" data-k="j45-hrb">hyperréactivité bronchique (réponse excessive à un stimulus)</button> et la <button class="w" data-k="j45-var">variabilité de l’obstruction (signature fonctionnelle de l’asthme)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="j45-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>GINA définit l’asthme comme une <b>maladie hétérogène, habituellement caractérisée par une inflammation chronique des voies aériennes</b>. Ainsi, deux éléments la signent : une histoire de symptômes respiratoires (sifflement, dyspnée, oppression thoracique, toux) qui <b>varient</b> dans le temps et en intensité, et une <b>limitation variable du débit expiratoire</b>. À cet égard, le mot essentiel est « variable » : la même patiente peut avoir une spirométrie normale un mardi et une obstruction marquée le samedi suivant.</p>
<p>Exemple : un homme de 35 ans a un volume expiratoire maximal par seconde (VEMS) de 3,1 L un matin sans symptôme, puis de 2,4 L trois jours plus tard, au cours d’un rhume. Cette variation de 700 mL, soit 23 %, n’existe pas chez un sujet sain et affirme la variabilité.</p>
<h3>1.1 Ce que l’asthme n’est pas</h3>
<p>La bronchopneumopathie chronique obstructive (BPCO) comporte aussi une obstruction, mais elle est <b>persistante</b> et peu réversible, liée au tabac ou à d’autres toxiques inhalés, et débute après 40 ans. Les deux maladies peuvent coexister ; on parle alors d’asthme et de BPCO associés, sans créer une maladie distincte. Enfin, la distinction est traitée au §7.</p>
<h3>1.2 Classification selon le contrôle (évaluation actuelle)</h3>
<p>Le <button class="w" data-k="j45-control">contrôle de l’asthme (quatre questions GINA, score ACT)</button> décrit ce que le patient vit pendant les quatre dernières semaines. C’est la première évaluation à chaque consultation, car elle oriente l’ajustement du traitement.</p>
<table class="t"><tr><th>Au cours des 4 dernières semaines, le patient a-t-il eu…</th><th>Oui / Non</th></tr>
<tr><td>des symptômes diurnes plus de deux fois par semaine ?</td><td rowspan="4">Aucun « oui » : <b>bien contrôlé</b><br>1 à 2 « oui » : <b>partiellement contrôlé</b><br>3 à 4 « oui » : <b>non contrôlé</b></td></tr>
<tr><td>un réveil nocturne dû à l’asthme ?</td></tr>
<tr><td>besoin d’un bronchodilatateur de courte durée de secours plus de deux fois par semaine ? (question réservée au patient dont le secours est un BACA, et non un corticostéroïde inhalé associé au formotérol ; les prises avant l’effort ne comptent pas)</td></tr>
<tr><td>une limitation de ses activités due à l’asthme ?</td></tr></table>
<h3>1.3 Classification selon la sévérité (évaluation rétrospective)</h3>
<p>La sévérité n’est <b>pas</b> l’intensité des symptômes au moment de la consultation. En effet, GINA la définit par le <b>niveau de traitement nécessaire</b> pour obtenir le contrôle, après quelques mois de traitement bien conduit.</p>
<div class="two">
<div class="card"><h4>Asthme léger</h4><p>Contrôlé par un traitement de palier 1 ou 2 : corticostéroïde inhalé et formotérol à la demande, ou corticostéroïde inhalé à faible dose quotidienne.</p></div>
<div class="card"><h4>Asthme modéré</h4><p>Contrôlé par un traitement de palier 3 : association corticostéroïde inhalé à faible dose et bêta-2 agoniste de longue durée d’action.</p></div>
<div class="card"><h4>Asthme sévère</h4><p>Il reste non contrôlé malgré une bonne adhésion à une association corticostéroïde inhalé à forte dose et bêta-2 agoniste de longue durée optimisée, avec prise en charge des facteurs contributifs, ou il exige cette forte dose pour rester contrôlé (GINA 2026).</p></div>
<div class="card"><h4>Asthme difficile à traiter</h4><p>Il reste non contrôlé malgré une association corticostéroïde inhalé à dose moyenne ou forte et bêta-2 agoniste de longue durée, ou malgré un corticostéroïde oral d’entretien. Il peut aussi exiger un traitement à forte dose pour rester contrôlé. En effet, souvent, une cause corrigeable explique la difficulté : mauvaise technique d’inhalation, adhésion insuffisante, tabagisme, comorbidité ou diagnostic erroné. Tout asthme sévère est donc d’abord traité comme un asthme difficile.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un patient peut avoir un asthme <b>léger</b> et faire une crise <b>grave</b>. GINA 2026 souligne que des patients aux symptômes rares ou légers peuvent faire des exacerbations sévères, voire mortelles, lorsqu’ils ne reçoivent qu’un bronchodilatateur de courte durée. La sévérité de fond ne protège pas contre une exacerbation sévère.</div>
<h3>1.4 Exacerbation et état de mal asthmatique</h3>
<p>Une <b>exacerbation</b> est une aggravation aiguë ou subaiguë des symptômes et de la fonction respiratoire par rapport à l’état habituel, qui impose une modification du traitement. À l’extrême, l’<b>état de mal asthmatique</b> désigne une crise sévère qui ne répond pas au traitement bronchodilatateur initial et menace le pronostic vital. Or, GINA 2026 insiste : <b>une seule exacerbation</b> ayant nécessité un recours aux urgences ou un corticostéroïde oral est un signal d’alarme qui impose de revoir le traitement de fond.</p>
<h3>1.5 Rémission clinique</h3>
<p>GINA 2026 décrit une <b>rémission clinique</b> chez certains patients atteints d’asthme sévère traités par biothérapie. Elle est plus probable lorsque les symptômes initiaux sont modérés, la fonction respiratoire meilleure, les comorbidités rares, l’asthme apparu tôt et le corticostéroïde oral d’entretien faible ou absent. De même, chez l’enfant, les sifflements d’âge préscolaire disparaissent souvent à l’âge scolaire ou à l’adolescence. Cette rémission n’est pas une guérison : l’asthme récidive souvent, surtout en présence d’allergie, d’antécédents familiaux ou d’une exposition au tabac.</p>
<div class="key"><b>À retenir.</b> L’asthme se définit par des symptômes variables et une obstruction variable démontrée. Le contrôle se mesure sur quatre semaines ; la sévérité se juge après plusieurs mois, selon le traitement nécessaire. Un asthme « léger » peut provoquer une crise mortelle s’il n’est traité que par bronchodilatateur.</div>
</section>

<section class="ilot" id="j45-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>En Suisse, selon la Ligue pulmonaire suisse, l’asthme touche environ <b>un enfant sur dix</b> et <b>un adulte sur quatorze</b>. C’est la maladie chronique la plus fréquente de l’enfant. En outre, avant la puberté, il prédomine chez le garçon ; après la puberté, chez la femme, et l’asthme débutant à l’âge adulte est majoritairement féminin, plus souvent non allergique et moins souvent en rémission.</p>
<p>La mortalité a nettement baissé depuis la diffusion des corticostéroïdes inhalés, mais elle n’est pas nulle. Pourtant, les décès sont en grande partie évitables : ils surviennent surtout chez des patients sans traitement anti-inflammatoire, grands consommateurs de bronchodilatateur de secours, ou après une exacerbation récente sous-estimée. À cet égard, la statistique suisse des causes de décès publiée en ligne regroupe les maladies de l’appareil respiratoire et ne donne pas de chiffre propre à l’asthme.</p>
<h3>2.1 Évolution naturelle</h3>
<p>Chez l’enfant, une partie des sifflements précoces, déclenchés par des virus, disparaît avant l’âge scolaire. De même, l’asthme allergique de l’enfant s’améliore souvent à l’adolescence, puis peut réapparaître à l’âge adulte. Au total, la Ligue pulmonaire suisse estime qu’environ un tiers des patients voient leur maladie s’améliorer nettement avec le temps.</p>
<p>Chez une partie des patients, l’inflammation non contrôlée entraîne un <button class="w" data-k="j45-remod">remodelage bronchique (épaississement et rigidité de la paroi)</button>. L’obstruction devient alors partiellement fixe, et le déclin annuel du VEMS s’accélère. C’est un argument fort pour traiter tôt par corticostéroïde inhalé.</p>
<div class="key"><b>Chiffre à connaître.</b> La consommation de bronchodilatateur de courte durée d’action est un marqueur de risque : à partir de <b>trois cartouches par an</b>, le risque d’exacerbation augmente ; au-delà de <b>douze cartouches par an</b>, le risque de décès augmente nettement (données citées par GINA). Une question simple à chaque consultation : « Combien de sprays de secours avez-vous achetés cette année ? »</div>
<div class="key"><b>À retenir.</b> L’asthme est fréquent en Suisse, surtout chez l’enfant. Ses décès sont en grande partie évitables : ils frappent surtout le patient sans corticostéroïde inhalé, grand consommateur de bronchodilatateur de secours. Le nombre de cartouches achetées par an mesure ce risque en une question.</div>
</section>

<section class="ilot" id="j45-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie se lit comme une chaîne. En effet, chaque maillon explique un symptôme ou un signe, et chaque traitement agit sur un maillon précis.</p>
<h3>3.1 État normal</h3>
<p>Chez le sujet sain, les bronches ont un calibre stable. En effet, l’épithélium forme une barrière, le muscle lisse bronchique a un tonus faible, et une inhalation de fumée ou d’air froid provoque au plus une légère toux. Or, la résistance à l’écoulement de l’air dépend du rayon de la bronche à la puissance quatre (loi de Poiseuille) : une réduction de moitié du rayon multiplie la résistance par seize. Cette relation explique pourquoi un faible épaississement de paroi produit une obstruction importante.</p>
<h3>3.2 Première charnière : sensibilisation et inflammation</h3>
<p>Chez le sujet prédisposé, un allergène (acariens, pollens, phanères de chat) ou une agression de l’épithélium (virus, pollution) déclenche la libération d’alarmines épithéliales. Celles-ci activent une <button class="w" data-k="j45-t2">inflammation de type 2 (Th2, ILC2, IL-4, IL-5, IL-13)</button>. Ensuite, l’IL-4 oriente les lymphocytes B vers la production d’IgE ; l’IL-5 recrute et fait survivre les éosinophiles ; l’IL-13 stimule la sécrétion de mucus et augmente la production de monoxyde d’azote par l’épithélium, que l’on mesure par la <button class="w" data-k="j45-feno">fraction expirée de monoxyde d’azote (FeNO)</button>.</p>
<h3>3.3 Deuxième charnière : hyperréactivité bronchique</h3>
<p>L’inflammation rend le muscle lisse et les terminaisons nerveuses hypersensibles. Il en résulte une <button class="w" data-k="j45-hrb">hyperréactivité bronchique (bronchoconstriction excessive à des stimuli banals)</button> : air froid, effort, fumée, rire, parfum. Exemple : la patiente de l’îlot 0 siffle en courant par temps froid, car l’hyperventilation d’air froid et sec refroidit et dessèche la muqueuse, ce qui libère des médiateurs par les mastocytes.</p>
<h3>3.4 Troisième charnière : obstruction variable</h3>
<p>Trois mécanismes rétrécissent la lumière bronchique : la contraction du muscle lisse (réversible en minutes par un bêta-2 agoniste), l’œdème de la muqueuse (réversible en jours par les corticostéroïdes) et les bouchons de mucus (lents à disparaître). Or, leur combinaison varie d’un jour à l’autre : c’est l’origine de la <button class="w" data-k="j45-var">variabilité de l’obstruction</button>.</p>
<h3>3.5 Quatrième charnière : manifestations</h3>
<p>L’air passe en turbulence dans des bronches rétrécies et produit des <button class="w" data-k="j45-sibil">sibilants (sifflements expiratoires)</button>. De plus, l’air ne sort pas complètement à l’expiration : le volume pulmonaire augmente (<b>distension dynamique</b>), les muscles respiratoires travaillent en position défavorable, et le patient ressent une dyspnée et une oppression. En outre, les zones mal ventilées restent perfusées : l’inégalité ventilation-perfusion provoque une hypoxémie. Au début de la crise, le patient hyperventile et sa PaCO₂ baisse. En revanche, une <b>PaCO₂ normale ou élevée</b> pendant une crise signe l’épuisement respiratoire.</p>
<h3>3.6 Cinquième charnière : remodelage</h3>
<p>Si l’inflammation persiste, la paroi se modifie durablement : fibrose sous-épithéliale, hypertrophie du muscle lisse, hyperplasie des cellules caliciformes et néovascularisation. Ainsi, l’obstruction devient partiellement irréversible. Ce <button class="w" data-k="j45-remod">remodelage bronchique</button> explique qu’un asthme ancien mal traité puisse ressembler à une BPCO.</p>

<div class="key"><b>Corrélation physiopathologie → traitement.</b> Le bêta-2 agoniste relâche le muscle lisse (effet en minutes) ; le corticostéroïde inhalé réduit l’inflammation, l’œdème et l’hyperréactivité (effet en jours à semaines) ; les biothérapies bloquent un médiateur précis de l’inflammation de type 2 (IgE, IL-5, IL-4 et IL-13, alarmine TSLP). Un traitement qui n’agit que sur le premier maillon laisse les suivants progresser.</div>
</section>

<section class="ilot" id="j45-4"><h2><span class="n">4</span>Facteurs de risque, déclencheurs et phénotypes</h2>
<p>Il faut distinguer trois notions. D’une part, les <b>facteurs de risque de développer un asthme</b> expliquent pourquoi une personne devient asthmatique. D’autre part, les <b>déclencheurs</b> expliquent pourquoi une crise survient aujourd’hui. Enfin, les <b>facteurs de risque d’exacerbation grave</b> identifient le patient qui risque de mourir de sa maladie ; ils sont traités au §11.</p>
<h3>4.1 Facteurs de risque de développer un asthme</h3>
<div class="two">
<div class="card"><h4>Facteurs de l’hôte</h4><p>L’<b>atopie</b> personnelle (dermatite atopique, rhinite allergique, allergie alimentaire) est le terrain le plus fréquent : la « marche atopique » mène souvent de l’eczéma du nourrisson à l’asthme. De même, des <b>antécédents familiaux</b> d’asthme ou d’allergie augmentent le risque. Enfin, la prématurité, le petit poids de naissance, l’obésité, surtout chez la femme, et le sexe masculin dans l’enfance s’y ajoutent.</p></div>
<div class="card"><h4>Facteurs d’environnement</h4><p>Le tabagisme maternel pendant la grossesse et le tabagisme passif lèsent les voies aériennes en développement. De même, les infections virales sévères précoces (virus respiratoire syncytial, rhinovirus), la pollution liée au trafic et les expositions professionnelles (§12.4) augmentent aussi le risque. À l’inverse, la vie en ferme traditionnelle dans l’enfance, bien étudiée en Suisse, est associée à moins d’asthme allergique.</p></div></div>
<h3>4.2 Déclencheurs de crise</h3>
<p>Parmi les déclencheurs, les plus fréquents sont les <b>infections virales</b> (rhinovirus en tête), les allergènes (acariens, pollens selon la saison, animaux, moisissures), l’effort, l’air froid, la fumée de tabac, la pollution, les émotions fortes et le rire, certains médicaments (bêtabloquants, y compris en collyre ; aspirine et anti-inflammatoires non stéroïdiens chez un sous-groupe), le reflux gastro-œsophagien et les variations hormonales (asthme prémenstruel).</p>
<div class="trap"><span class="k">Piège</span>Un collyre au timolol prescrit pour un glaucome peut déclencher une crise grave : le produit passe dans la circulation par le canal lacrymal et la muqueuse nasale, sans passage hépatique. L’anamnèse médicamenteuse demande donc systématiquement les collyres.</div>
<h3>4.3 Phénotypes</h3>
<p>Un phénotype regroupe des patients aux caractéristiques communes. Ainsi, son intérêt est pratique : il prédit la réponse à certains traitements.</p>
<table class="t"><tr><th>Phénotype</th><th>Caractéristiques</th><th>Conséquence pratique</th></tr>
<tr><td><b>Allergique</b></td><td>Début dans l’enfance, atopie, antécédents familiaux, éosinophilie et FeNO souvent élevés</td><td>Bonne réponse aux corticostéroïdes inhalés ; éviction allergénique ; immunothérapie allergénique possible ; anti-IgE si sévère</td></tr>
<tr><td><b>Éosinophilique de l’adulte</b></td><td>Début à l’âge adulte, souvent non allergique, polypose nasale fréquente, éosinophilie sanguine marquée</td><td>Souvent sévère ; bonne réponse aux anti-IL-5 et anti-IL-4/IL-13</td></tr>
<tr><td><b>Non allergique</b> (type 2 faible)</td><td>Neutrophiles ou peu de cellules inflammatoires, biomarqueurs bas</td><td>Réponse plus faible aux corticostéroïdes ; azithromycine ou anti-TSLP en cas de sévérité</td></tr>
<tr><td><b>Associé à l’obésité</b></td><td>Symptômes importants, peu d’inflammation de type 2</td><td>La perte de poids améliore le contrôle</td></tr>
<tr><td><b>Avec obstruction fixe</b></td><td>Asthme ancien, remodelage</td><td>Objectif réaliste : prévenir les exacerbations plutôt que normaliser le VEMS</td></tr>
<tr><td><b>Maladie respiratoire exacerbée par les anti-inflammatoires non stéroïdiens</b></td><td>Triade : asthme, polypose nasale, réaction à l’aspirine</td><td><button class="w" data-k="j45-nerd">N-ERD (mécanisme, conduite à tenir)</button></td></tr>
</table>
<p>À cet égard, la distinction <b>type 2 élevé / type 2 faible</b> est la plus utile en pratique. Elle repose sur trois biomarqueurs : <button class="w" data-k="j45-eos">éosinophiles sanguins (seuils 150 et 300/µL)</button>, FeNO et IgE spécifiques. Elle se mesure idéalement avant corticostéroïde oral et en répétant le dosage, car les corticostéroïdes abaissent les éosinophiles.</p>
<div class="key"><b>À retenir.</b> Les facteurs de risque expliquent pourquoi un patient devient asthmatique ; les déclencheurs, pourquoi la crise survient aujourd’hui. Le phénotype de type 2, repéré par les éosinophiles, la FeNO et les IgE, prédit la réponse aux corticostéroïdes inhalés et aux biothérapies.</div>
</section>

<section class="ilot" id="j45-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse est l’examen le plus rentable de l’asthme. Elle cherche quatre choses : un profil de symptômes variables, des déclencheurs, un terrain atopique, et des arguments contre l’asthme.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<div class="card"><h4>Personnels</h4><p>Le médecin recherche une <button class="w" data-k="j45-atopie">atopie (eczéma, rhinite, allergie alimentaire)</button>, des bronchiolites ou des sifflements dans l’enfance, une polypose nasale avec réaction à l’aspirine, un reflux gastro-œsophagien, une obésité, une anxiété ou une dépression. Il date les hospitalisations, les passages aux urgences, une éventuelle intubation et compte les cures de corticostéroïdes oraux de l’année : ces éléments mesurent le risque de crise grave.</p></div>
<div class="card"><h4>Familiaux, environnementaux, professionnels</h4><p>Il demande s’il existe un asthme ou une atopie chez les parents et dans la fratrie. Il quantifie le tabagisme actif et passif, le vapotage et le cannabis. Il décrit le logement : humidité, moisissures, animaux et literie. Il fait préciser la profession, les horaires et une éventuelle <b>amélioration pendant les vacances</b> : c’est la question clé de l’<button class="w" data-k="j45-pro">asthme professionnel (démarche Suva)</button>.</p></div></div>
<h3>5.2 Symptômes, par ordre de fréquence</h3>
<p><b>Dyspnée sifflante</b> — Le patient décrit un sifflement audible, surtout à l’expiration. Il est d’autant plus évocateur qu’il est récurrent, lié à des déclencheurs et réversible.</p>
<p><b>Toux</b> — Elle est sèche, nocturne ou présente au réveil, et l’effort, le rire ou l’air froid la déclenchent. Elle peut être le seul symptôme : c’est la <button class="w" data-k="j45-toux">toux équivalente d’asthme (forme monosymptomatique)</button>.</p>
<p><b>Oppression thoracique</b> — Le patient décrit une sensation de poids ou de serrement. Cependant, chez un patient à risque cardiovasculaire, elle impose d’exclure une origine coronarienne.</p>
<p><b>Enfin, dyspnée d’effort</b> — Elle est typiquement maximale <b>5 à 15 minutes après l’arrêt</b> de l’effort (bronchoconstriction induite par l’exercice), et non au pic de l’effort.</p>
<div class="key"><b>Profil qui augmente la probabilité d’asthme (GINA).</b> Plus d’un type de symptôme ; symptômes qui varient dans le temps et en intensité ; aggravation la nuit ou au réveil ; déclenchement par l’effort, le rire, les allergènes, l’air froid ; apparition ou aggravation lors des infections virales.<br><b>Profil qui diminue la probabilité.</b> Toux isolée sans autre symptôme ; expectoration chronique ; dyspnée avec vertiges, paresthésies des extrémités ; douleur thoracique ; dyspnée d’effort avec stridor inspiratoire.</div>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Adolescent ou adulte jeune atopique. Épisodes de sifflements, de toux nocturne et de dyspnée, déclenchés par les pollens au printemps ou les acariens en automne, et par les rhumes. Intervalle libre sans symptôme.</p></div>
<div class="card"><h4>Toux isolée</h4><p>Toux chronique sèche nocturne, spirométrie parfois normale. Dès lors, le diagnostic repose sur un test de provocation positif et sur la réponse au corticostéroïde inhalé.</p></div>
<div class="card"><h4>Asthme de l’adulte d’apparition tardive</h4><p>Femme de 50 ans, rhinosinusite avec polypes, perte de l’odorat, crises sévères, éosinophilie élevée. Cette forme est souvent sévère d’emblée.</p></div>
<div class="card"><h4>Asthme d’effort isolé</h4><p>Dyspnée et toux après l’effort seulement, fréquentes chez l’athlète d’endurance et de sports d’hiver. Diagnostic différentiel principal : <button class="w" data-k="j45-ilo">obstruction laryngée inductible (stridor inspiratoire)</button>.</p></div>
<div class="card"><h4>Asthme du sujet âgé</h4><p>En effet, dyspnée attribuée à l’âge ou au cœur ; perception des symptômes émoussée ; chevauchement avec la BPCO ou l’insuffisance cardiaque.</p></div>
<div class="card"><h4>Asthme professionnel</h4><p>Boulanger qui siffle au travail et va mieux le week-end. De plus, les symptômes rhinitiques précèdent souvent l’asthme de plusieurs mois.</p></div></div>
<h3>5.4 Évaluer le traitement actuel</h3>
<p>À chaque consultation, le médecin note le nom et le dispositif de chaque inhalateur, le nombre de prises réelles, <button class="w" data-k="j45-tech">technique d’inhalation (démonstration par le patient)</button>, nombre de cartouches de secours achetées, effets indésirables, existence d’un <button class="w" data-k="j45-plan">plan d’action écrit</button>. En effet, jusqu’à 80 % des patients commettent au moins une erreur de technique : le patient montre son geste, il ne se contente pas de le décrire.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Le médecin augmente la dose avant d’avoir vérifié la technique et l’adhésion. Un patient qui inspire trop vite dans un aérosol-doseur dépose l’essentiel du produit dans l’oropharynx ; doubler la dose double surtout les effets indésirables locaux.</div>
<div class="key"><b>À retenir.</b> L’anamnèse établit la variabilité des symptômes, leurs déclencheurs, le terrain atopique et les arguments contre l’asthme. Elle mesure aussi le risque : exacerbations, cures de corticostéroïdes, consommation de secours, technique et adhésion.</div>
</section>

<section class="ilot" id="j45-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>En dehors des crises, l’examen est souvent <b>normal</b>. Un examen normal n’exclut donc jamais l’asthme. En revanche, en crise, l’examen mesure la gravité et oriente l’urgence.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>La <b>capacité à parler</b> (phrases complètes, fragments de phrase ou incapacité) est le meilleur indicateur rapide de gravité. Ainsi, dans la crise sévère, le patient reste assis, penché en avant, bras en appui ; l’agitation précède la somnolence. Ensuite, le médecin mesure la <b>fréquence respiratoire</b>, le pouls, la <b>saturation pulsée en oxygène</b> et la température, qui signale une infection déclenchante. Enfin, le <button class="w" data-k="j45-pouls">pouls paradoxal (chute de la pression systolique à l’inspiration)</button> traduit une crise grave.</p></div>
<div class="card"><h4>Examen thoracique</h4><p>À l’<b>inspection</b>, la crise montre un tirage sus-claviculaire et intercostal, une contraction des sterno-cléido-mastoïdiens et un thorax distendu. De plus, la <b>percussion</b> est hypersonore. À l’auscultation, l’<b>auscultation</b> retrouve des <button class="w" data-k="j45-sibil">sibilants expiratoires diffus, bilatéraux</button> et une expiration prolongée. En revanche, un <button class="w" data-k="j45-silence">silence auscultatoire (thorax muet)</button> est un signe de menace vitale. Enfin, une asymétrie fait rechercher un pneumothorax, un corps étranger ou une atélectasie.</p></div>
<div class="card"><h4>Signes d’atopie et de comorbidités</h4><p>Un eczéma des plis de flexion, une muqueuse nasale pâle et œdémateuse, des polypes visibles à la rhinoscopie antérieure ou un pli de Dennie-Morgan sous la paupière inférieure chez l’enfant soutiennent un terrain atopique. Le médecin note aussi l’indice de masse corporelle et les signes de reflux.</p></div>
<div class="card"><h4>Signes qui orientent vers un autre diagnostic</h4><p>Un hippocratisme digital n’est jamais dû à l’asthme : il fait chercher des bronchectasies, une fibrose ou un cancer. De même, des crépitants fins orientent vers une fibrose ou une insuffisance cardiaque, un stridor inspiratoire vers le larynx ou la trachée, un sibilant unilatéral fixe vers un obstacle bronchique. Enfin, chez l’enfant, un retard de croissance fait rechercher une mucoviscidose.</p></div></div>
<div class="trap"><span class="k">Piège</span>L’intensité des sibilants ne mesure pas la gravité. Dans la crise la plus grave, le débit d’air devient si faible que les sibilants disparaissent. Un patient épuisé, peu sifflant et somnolent est plus grave qu’un patient agité et très sifflant.</div>
<div class="key"><b>À retenir.</b> Entre les crises, l’examen est souvent normal et n’exclut pas l’asthme. En crise, la parole, la conscience, la fréquence respiratoire et la saturation mesurent la gravité ; un thorax silencieux ou une somnolence annoncent l’épuisement.</div>
