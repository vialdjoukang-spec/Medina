<template data-pop="j45-d-icsf" data-title="Corticostéroïde inhalé et formotérol : AIR et MART">
<div class="lab">Mécanisme</div><p>Le formotérol est un bêta-2 agoniste de longue durée d’action dont l’effet débute en 1 à 3 minutes, comme le salbutamol. Associé au corticostéroïde dans le même dispositif, il apporte une dose anti-inflammatoire à chaque prise de secours.</p>
<div class="lab">Schémas</div><p><b>AIR</b> (anti-inflammatoire de secours) : prises à la demande seulement, paliers 1–2 ; ce schéma GINA n’est retenu par aucune information professionnelle suisse et reste prescrit hors indication autorisée. <b>MART</b> : entretien quotidien et prises à la demande avec le même inhalateur, paliers 3–5.</p>
<div class="lab">Preuves</div><p>SYGMA 1 et 2 (2018) et Novel START (2019) : dans l’asthme léger, réduction d’environ 60 % des exacerbations sévères par rapport au salbutamol seul, efficacité comparable au corticostéroïde quotidien sur les exacerbations. Dans l’asthme modéré à sévère, le MART réduit les exacerbations par rapport à une association fixe à dose égale ou supérieure avec secours par bronchodilatateur de courte durée.</p>
<div class="lab">Posologie</div><p>Budésonide-formotérol 100/6 ou 200/6 µg en MART (Symbicort Turbuhaler, dès 12 ans) : au plus 6 inhalations en une fois ; plus de 8 inhalations par jour ne sont généralement pas nécessaires ; 12 inhalations par jour au maximum, de façon transitoire (formotérol 72 µg). Béclométasone-formotérol 100/6 µg en MART (Foster, dès 18 ans) : 1 inhalation deux fois par jour et au plus 6 inhalations supplémentaires, soit 8 par jour.</p>
<div class="lab">Effets indésirables et surveillance</div><p>Ceux du corticostéroïde inhalé et des bêta-2 agonistes. Un besoin élevé et prolongé de prises à la demande signale une perte de contrôle et impose une consultation.</p></template>
<template data-pop="j45-d-ics" data-title="Corticostéroïdes inhalés">
<div class="lab">Mécanisme</div><p>Liaison au récepteur des glucocorticoïdes ; transrépression de NF-κB et AP-1 ; baisse des éosinophiles, mastocytes et lymphocytes Th2 ; réduction de l’œdème, de l’hyperréactivité et du risque d’exacerbation et de décès.</p>
<div class="lab">Délai</div><p>Amélioration des symptômes en quelques jours ; effet maximal sur la fonction et l’hyperréactivité en plusieurs semaines à mois.</p>
<div class="lab">Molécules</div><p>Budésonide et béclométasone : les plus étudiés, y compris pendant la grossesse. Ciclésonide : promédicament activé dans le poumon, peu d’effets oropharyngés. Fluticasone et mométasone : puissantes, sensibles aux inhibiteurs du CYP3A4.</p>
<div class="lab">Effets indésirables</div><p>Candidose buccale, dysphonie (prévention : chambre d’inhalation, rinçage). À forte dose prolongée : effets systémiques (os, œil, surrénale, croissance).</p>
<div class="lab">Associations fixes avec BALA</div><p>Salmétérol (délai 10–20 minutes, pas utilisable en secours), vilanterol (une prise par jour), indacatérol.</p></template>
<template data-pop="j45-d-saba" data-title="Bêta-2 agonistes de courte durée d’action">
<div class="lab">Molécules</div><p>Salbutamol (100 µg par bouffée), terbutaline. Début d’action en 1 à 5 minutes, durée 4 à 6 heures.</p>
<div class="lab">Place actuelle</div><p>Secours de la voie 2, toujours associé à un corticostéroïde inhalé ; prévention ponctuelle de l’asthme d’effort ; traitement de la crise. GINA ne recommande plus le bronchodilatateur de courte durée seul chez l’adolescent et l’adulte.</p>
<div class="lab">Pourquoi pas seul</div><p>Soulagement sans action sur l’inflammation ; l’usage régulier désensibilise les récepteurs et augmente l’hyperréactivité ; association épidémiologique forte avec les exacerbations et la mortalité.</p>
<div class="lab">Effets indésirables</div><p>Tremblement, tachycardie, palpitations, hypokaliémie, hyperglycémie, lactate élevé à forte dose.</p></template>
<template data-pop="j45-d-lama" data-title="Tiotropium (antimuscarinique de longue durée)">
<div class="lab">Mécanisme</div><p>Antagoniste des récepteurs muscariniques M3 à dissociation lente ; bronchodilatation durable, réduction du tonus vagal.</p>
<div class="lab">Preuves</div><p>Essais PrimoTinA-asthma : ajouté à une association corticostéroïde inhalé et BALA chez des asthmatiques non contrôlés, il améliore le VEMS et retarde la première exacerbation sévère.</p>
<div class="lab">Posologie</div><p>2,5 µg par bouffée en brumisateur : 2 bouffées (5 µg) une fois par jour, dose à ne pas dépasser. En Suisse, l’information professionnelle de Spiriva Respimat ne retient que la BPCO ; l’ajout dans l’asthme suit GINA hors indication autorisée.</p>
<div class="lab">Effets indésirables et prudence</div><p>Sécheresse buccale ; prudence en cas de glaucome à angle fermé et de rétention urinaire.</p></template>
<template data-pop="j45-d-ltra" data-title="Montélukast (antileucotriène)">
<div class="lab">Mécanisme</div><p>Antagoniste du récepteur CysLT1 des leucotriènes cystéinylés ; réduit bronchoconstriction et inflammation, moins efficacement qu’un corticostéroïde inhalé.</p>
<div class="lab">Place</div><p>Option secondaire : patient qui refuse ou ne peut pas utiliser un inhalateur, rhinite allergique associée, bronchoconstriction d’effort, N-ERD.</p>
<div class="lab">Sécurité</div><p>L’information professionnelle suisse signale des événements neuropsychiatriques rapportés après commercialisation chez l’enfant, l’adolescent et l’adulte : rêves anormaux, hallucinations, agitation, comportement agressif, dépression, idées et comportements suicidaires. Le médecin informe le patient et sa famille, et réévalue le traitement si ces symptômes apparaissent. Posologie suisse : 10 mg le soir dès 15 ans, 5 mg de 6 à 14 ans, 4 mg de 2 à 5 ans.</p></template>
<template data-pop="j45-d-ocs" data-title="Corticostéroïdes systémiques">
<div class="lab">Indications</div><p>Exacerbation modérée à sévère : cure courte. Entretien : seulement au palier 5, en dernier recours, à la dose minimale.</p>
<div class="lab">Posologie</div><p>Prednisone 40–50 mg par jour pendant 5 à 7 jours, sans décroissance pour une cure courte ; enfant 1–2 mg/kg par jour (maximum 40 mg) pendant 3 à 5 jours.</p>
<div class="lab">Toxicité cumulative</div><p>Diabète, ostéoporose, cataracte, hypertension, prise de poids, troubles de l’humeur et du sommeil, infections, insuffisance surrénalienne. Le risque augmente dès une dose cumulée de 0,5 à 1 g de prednisone au cours de la vie : la réduction des corticostéroïdes oraux est un objectif majeur des biothérapies.</p></template>
<template data-pop="j45-d-bio" data-title="Biothérapies de l’asthme sévère">
<div class="lab">Omalizumab (anti-IgE)</div><p>Sous-cutané toutes les 2 ou 4 semaines ; dose selon le poids et les IgE totales mesurées avant le traitement, au plus 375 mg toutes les 2 semaines. Indication suisse : asthme allergique persistant sévère dès 6 ans, avec sensibilisation à un pneumallergène perannuel, malgré un corticostéroïde inhalé à forte dose et un BALA ; efficacité réévaluée après 16 semaines. Réduit les exacerbations d’environ 25 à 50 %.</p>
<div class="lab">Mépolizumab, reslizumab (anti-IL-5) ; benralizumab (anti-récepteur de l’IL-5)</div><p>Mépolizumab 100 mg sous-cutané toutes les 4 semaines (dès 12 ans ; éosinophiles ≥ 150/µL à l’initiation ou ≥ 300/µL au cours des 12 derniers mois) ; reslizumab 3 mg/kg en perfusion intraveineuse toutes les 4 semaines (adulte ; éosinophiles ≥ 400/µL) ; benralizumab 30 mg sous-cutané toutes les 4 semaines pour les trois premières doses puis toutes les 8 semaines (dès 18 ans ; éosinophiles ≥ 300/µL ; réponse évaluée au plus tard après 5 administrations), avec une déplétion éosinophilique quasi complète par cytotoxicité cellulaire. Réduction des exacerbations d’environ 50 % et épargne en corticostéroïde oral.</p>
<div class="lab">Dupilumab (anti-récepteur alpha de l’IL-4)</div><p>Bloque IL-4 et IL-13. Indication suisse dès 6 ans : éosinophiles ≥ 150/µL et au moins une exacerbation sévère dans les 12 mois malgré un corticostéroïde inhalé et un bronchodilatateur de longue durée. Dès 12 ans : 400 mg puis 200 mg toutes les 2 semaines ; 600 mg puis 300 mg toutes les 2 semaines en cas de corticostéroïde oral, de dermatite atopique modérée à sévère ou de polypose naso-sinusienne. Efficace aussi sur la dermatite atopique et la polypose nasale. Éosinophilie transitoire ; conjonctivite.</p>
<div class="lab">Tézépélumab (anti-TSLP)</div><p>210 mg sous-cutané toutes les 4 semaines, chez l’adulte ayant eu au moins une exacerbation sévère dans les 12 mois malgré un corticostéroïde inhalé et un BALA (indication suisse) ; poursuite réévaluée au moins une fois par an. Réduit les exacerbations quel que soit le niveau d’éosinophiles, avec un effet plus grand si les biomarqueurs sont élevés.</p>
<div class="lab">Évaluation</div><p>Après 4 mois : exacerbations, contrôle, VEMS, dose de corticostéroïde oral. Absence de réponse : changer de cible.</p></template>
<template data-pop="j45-d-azi" data-title="Azithromycine au long cours">
<div class="lab">Preuve</div><p>Essai AMAZES (2017) : 500 mg trois fois par semaine pendant 48 semaines réduisent les exacerbations chez des asthmatiques non contrôlés, éosinophiliques ou non.</p>
<div class="lab">Précautions</div><p>Usage hors indication autorisée : l’information suisse de Zithromax ne mentionne pas l’asthme ; elle signale un allongement de l’intervalle QT pouvant entraîner des torsades de pointes. ECG avant, audiogramme selon le contexte, exclusion d’une infection à mycobactérie non tuberculeuse ; risque de résistance bactérienne.</p></template>
<template data-pop="j45-d-mg" data-title="Sulfate de magnésium">
<div class="lab">Mécanisme</div><p>Antagoniste physiologique du calcium : relâche le muscle lisse bronchique.</p>
<div class="lab">Indication et dose</div><p>Crise sévère ne répondant pas au traitement initial : 2 g par voie intraveineuse en 20 minutes chez l’adulte ; chez l’enfant, 40–50 mg/kg (maximum 2 g) en perfusion lente. La forme nébulisée n’est plus recommandée chez l’enfant (GINA 2025). L’information suisse du sulfate de magnésium Bichsel ne mentionne pas l’asthme : il s’agit d’un usage hors indication autorisée, réservé au milieu hospitalier.</p>
<div class="lab">Effets indésirables</div><p>Flush, hypotension, bradycardie ; surveiller la pression artérielle.</p></template>
<template data-pop="j45-d-theo" data-title="Théophylline">
<div class="lab">Place</div><p>Plus recommandée en routine : efficacité faible, marge thérapeutique étroite. L’aminophylline intraveineuse n’est pas recommandée dans la crise.</p>
<div class="lab">Toxicité</div><p>Nausées, tachycardie, arythmies, convulsions. Zone thérapeutique classique : 10–20 mg/L. Métabolisme par le CYP1A2 : fluvoxamine et ciprofloxacine augmentent fortement les taux ; le tabac les abaisse, son arrêt les augmente.</p></template>
<template data-pop="j45-suisse-indications" data-title="Indications suisses et schémas GINA : écarts">
<div class="lab">Principe</div><p>GINA 2026 fonde la stratégie thérapeutique ; l’information professionnelle approuvée par Swissmedic fixe les indications, les âges et les doses autorisés en Suisse. Pour l’examen fédéral et la prescription, la position suisse s’applique ; un schéma GINA non couvert par l’information suisse reste possible, mais hors indication autorisée, avec information du patient et vérification du remboursement.</p>
<div class="lab">Écarts retrouvés le 08.10.2026</div><ul>
<li><b>Budésonide-formotérol à la demande seul (paliers 1–2).</b> Symbicort Turbuhaler est indiqué lorsque le corticostéroïde inhalé seul ne suffit pas, en entretien régulier ou en MART ; DuoResp Spiromax précise qu’il n’est pas un traitement approprié de l’asthme léger. Aucune spécialité ne couvre le schéma à la demande sans entretien.</li>
<li><b>MART.</b> Symbicort est autorisé en MART dès 12 ans (Symbicort 100/6 dès 6 ans), Foster 100/6 seulement dès 18 ans.</li>
<li><b>Tiotropium en brumisateur.</b> Spiriva Respimat n’est indiqué que dans la BPCO.</li>
<li><b>Sulfate de magnésium intraveineux et azithromycine au long cours.</b> Leurs informations suisses ne mentionnent pas l’asthme.</li>
<li><b>Biothérapies.</b> Les seuils suisses diffèrent selon la molécule : mépolizumab ≥ 150/µL (ou ≥ 300/µL dans les 12 mois), benralizumab ≥ 300/µL dès 18 ans, reslizumab ≥ 400/µL, dupilumab ≥ 150/µL avec au moins une exacerbation sévère, tézépélumab chez l’adulte avec au moins une exacerbation sévère, omalizumab dès 6 ans pour l’asthme allergique.</li></ul>
<p class="src">Informations professionnelles suisses Symbicort® Turbuhaler®, DuoResp® Spiromax®, Foster® 100/6, Spiriva® Respimat®, Sulfate de magnésium «Bichsel», Zithromax®, Nucala®, Fasenra®, CINQAERO®, Dupixent®, TEZSPIRE®, Xolair®, Swissmedic (AIPS), consultées le 08.10.2026 ; GINA 2026.</p></template>
