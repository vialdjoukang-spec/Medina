<template data-pop="j45-spiro" data-title="Spirométrie">
<div class="lab">Mesures</div><p>Le VEMS est le volume expiré pendant la première seconde d’une expiration forcée, et la CVF est le volume total expiré. Le rapport VEMS/CVF sert donc de marqueur de l’obstruction, car l’obstruction freine surtout le début de l’expiration.</p>
<div class="lab">Qualité (ATS/ERS 2019)</div><p>Le technicien doit obtenir au moins trois manœuvres acceptables, avec une expiration poursuivie jusqu’au plateau de volume. La répétabilité exige un écart d’au plus 150 mL entre les deux meilleures CVF et entre les deux meilleurs VEMS.</p>
<div class="lab">Interprétation</div><p>L’obstruction se définit par un rapport inférieur à la limite inférieure de la normale, et le z-score du VEMS en grade la sévérité. Une CVF basse avec un rapport normal suggère en revanche une restriction, qu’il faut confirmer par la capacité pulmonaire totale.</p>
<div class="lab">Erreur fréquente</div><p>Utiliser le seuil fixe de 0,70 pour tous les âges : il classe à tort comme obstrués des sujets âgés sains et manque des obstructions chez le jeune.</p></template>
<template data-pop="j45-lln" data-title="Limite inférieure de la normale et z-score">
<div class="lab">Définition</div><p>La limite inférieure de la normale est la valeur en dessous de laquelle se trouvent les 5 % les plus bas d’une population saine de même âge, sexe et taille. Elle correspond à un z-score de −1,645.</p>
<div class="lab">Z-score</div><p>Nombre d’écarts-types qui séparent la valeur mesurée de la valeur prédite. Un z-score de −2 signifie que la mesure est deux écarts-types sous la moyenne attendue.</p>
<div class="lab">Exemple</div><p>Un homme de 75 ans a un rapport de 0,68. Sa limite inférieure de la normale est 0,64 : il n’est pas obstrué, bien que sous 0,70.</p></template>
<template data-pop="j45-dilat" data-title="Test de réversibilité">
<div class="lab">Protocole</div><p>Le technicien réalise une spirométrie de base, administre 400 µg de salbutamol, soit 4 bouffées de 100 µg avec chambre, puis répète la spirométrie après 15 minutes. Les bronchodilatateurs doivent être suspendus au préalable selon leur durée d’action, sinon ils masquent la réversibilité.</p>
<div class="lab">Positif (GINA)</div><p>Adulte : VEMS +12 % et +200 mL par rapport à la valeur initiale. Plus la réponse est grande (&gt; 400 mL), plus l’asthme est probable. Alternative ATS/ERS 2022 : +10 % de la valeur prédite.</p>
<div class="lab">Pièges</div><p>Négatif si la fonction est normale au moment du test ou sous traitement. Une réversibilité existe aussi dans la BPCO.</p></template>

<div class="lab">Technique</div><p>Le patient se tient debout, place le curseur à zéro, inspire au maximum, puis souffle de façon brève et explosive, la bouche serrée sur l’embout. On retient la meilleure de trois mesures, et l’on utilise toujours le même appareil, car les appareils diffèrent entre eux.</p>
<div class="lab">Calcul de la variabilité</div><p>Chaque jour, on calcule la différence entre la valeur la plus haute et la plus basse, divisée par leur moyenne et multipliée par 100 ; on fait ensuite la moyenne sur une à deux semaines. Une variabilité supérieure à 10 % chez l’adulte et à 13 % chez l’enfant est excessive.</p>
<div class="lab">Usages</div><p>Le débit de pointe sert au diagnostic si la spirométrie ne conclut pas et dans l’asthme professionnel. Il structure aussi le plan d’action, avec des seuils à 80 % et 60 % de la meilleure valeur personnelle, et il aide à juger la gravité d’une crise.</p>
<div class="lab">Limite</div><p>Dépend de l’effort et reflète surtout les grosses voies aériennes ; moins fiable que le VEMS.</p></template>
<template data-pop="j45-metha" data-title="Tests de provocation bronchique">
<div class="lab">Méthacholine (test direct)</div><p>Doses croissantes inhalées jusqu’à une chute du VEMS de 20 %. Résultat exprimé en dose provoquante (PD20). Selon ERS 2017 : &gt; 400 µg normal ; 100–400 µg hyperréactivité légère ; 25–100 µg modérée ; &lt; 25 µg marquée. Très sensible : sa force est l’exclusion.</p>
<div class="lab">Mannitol (test indirect)</div><p>Le patient inhale une poudre de mannitol à doses croissantes, et le test est positif si le VEMS chute d’au moins 15 %. Ce test est plus spécifique que la méthacholine, parce qu’il agit indirectement en libérant des médiateurs et reflète donc l’inflammation active.</p>
<div class="lab">Contre-indications</div><p>VEMS &lt; 60 % de la valeur prédite ou &lt; 1,5 L ; infarctus ou accident vasculaire cérébral &lt; 3 mois ; hypertension non contrôlée ; anévrisme. Suspendre les bronchodilatateurs et, pour les tests indirects, les corticostéroïdes inhalés si possible.</p></template>
