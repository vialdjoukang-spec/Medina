<template data-pop="g52-bulbe" data-title="Bulbe olfactif">
<div class="lab">Définition</div><p>Premier relais cérébral du nerf olfactif : les axones des neurones sensoriels de la fente olfactive y arrivent, puis l’information gagne les réseaux olfactifs primaire et secondaire (Consensus européen 2023).</p>
<div class="lab">Application</div><p>Sa mesure à l’IRM fait partie des indications de l’IRM de première intention. Hypoplasique ou absent dans le syndrome de Kallmann.</p>
<div class="lab">Limite</div><p>Les détails de l’organisation des réseaux olfactifs ne figurent pas dans les passages lus.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a></p></template>
<template data-pop="g52-sinusal" data-title="Rhinosinusite chronique et odorat">
<div class="lab">Mécanisme</div><p>Obstruction mécanique (œdème, sécrétions, polypes), dysfonction inflammatoire réversible des récepteurs, puis remodelage à long terme du neuroépithélium, du bulbe et des aires cérébrales (Consensus européen 2023).</p>
<div class="lab">Clinique</div><p>Perte progressive et fluctuante, rarement améliorée sans traitement, rarement accompagnée de parosmie. La dysfonction olfactive touche 84 % des patients (Consensus européen 2023).</p>
<div class="lab">Décision</div><p>Corticoïdes systémiques en cures courtes et/ou intranasaux selon les recommandations de la maladie ; biothérapies dans la forme avec polypes sévère ; chirurgie endoscopique sinusienne dans cette seule indication.</p>
<div class="lab">Limite</div><p>Avis d’experts (Delphi), niveau de preuve souvent faible.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a></p></template>
<template data-pop="g52-ptod" data-title="Dysfonction olfactive post-traumatique">
<div class="lab">Mécanisme</div><p>Cisaillement des filets olfactifs au moment du choc ; parfois œdème ou mécanismes centraux progressifs, d’où un début retardé (Consensus européen 2023).</p>
<div class="lab">Clinique</div><p>Début souvent brutal ; imagerie parfois normale ; fantosmie fréquente ; fluctuation rare.</p>
<div class="lab">Pronostic</div><p>Récupération moins fréquente que post-infectieuse : environ 30 % avec le temps, selon la gravité.</p>
<div class="lab">Décision</div><p>Entraînement olfactif recommandé (Delphi 98 %).</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a></p></template>
<template data-pop="g52-parkinson" data-title="Odorat et maladie de Parkinson">
<div class="lab">Mécanisme</div><p>Dépôts de corps de Lewy dans le bulbe et le tractus olfactifs (Consensus européen 2023).</p>
<div class="lab">Clinique</div><p>La dysfonction olfactive est plus fréquente que le tremblement de repos et précède les signes moteurs de plusieurs années ; le patient l’ignore souvent. Elle ne répond pas aux antiparkinsoniens.</p>
<div class="lab">Décision</div><p>Aucune amélioration n’est attendue. L’examen neurologique de base est indiqué si une cause neurologique est suspectée.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a></p></template>
<template data-pop="g52-kallmann" data-title="Anosmie congénitale et syndrome de Kallmann">
<div class="lab">Définition</div><p>Le syndrome de Kallmann associe un hypogonadisme hypogonadotrope à des bulbes et des sillons olfactifs hypoplasiques ou absents ; diagnostic typique entre 12 et 16 ans ; il touche surtout le sexe masculin (Consensus européen 2023 ; Bonilla Medrano 2026).</p>
<div class="lab">Application</div><p>L’anosmie isolée, non syndromique, sans cause génétique connue, est aujourd’hui la forme congénitale la plus fréquente. Le bilan comprend l’anamnèse ciblée, l’endoscopie, les tests psychophysiques, l’IRM des voies olfactives, puis le bilan endocrinien et génétique selon le contexte.</p>
<div class="lab">Décision</div><p>Aucun traitement curatif validé : éducation, prévention des risques domestiques et alimentaires (gaz, fumée, aliments avariés), orientation spécialisée des formes syndromiques.</p>
<div class="lab">Limite</div><p>Article de la Revue Médicale Suisse lu au résumé seulement.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a> ; <a href="https://doi.org/10.53738/REVMED.2026.22.977.49087" target="_blank" rel="noopener">Bonilla Medrano 2026</a></p></template>
<template data-pop="g52-endoscopie" data-title="Endoscopie nasale">
<div class="lab">Définition</div><p>Examen ORL de la cavité nasale avec inspection attentive de la fente olfactive (Consensus européen 2023, Delphi 98 %).</p>
<div class="lab">Application</div><p>Recommandée chez tout patient avec trouble olfactif ; elle objective polypes, œdème et sécrétions.</p>
<div class="lab">Limite</div><p>L’endoscopie ne remplace pas le test psychophysique ni l’IRM.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a> ; <a href="https://doi.org/10.53738/REVMED.2026.22.977.49087" target="_blank" rel="noopener">Bonilla Medrano 2026</a></p></template>
<template data-pop="g52-tdi" data-title="Tests psychophysiques : Sniffin’ Sticks et score TDI">
<div class="lab">Définition</div><p>Tests validés pour la population, explorant le seuil d’odeur, l’identification et/ou la discrimination ; idéalement deux ou trois composantes. Le score composite s’appelle TDI (Consensus européen 2023).</p>
<div class="lab">Application</div><p>Commencer si possible par un seuil monorhinal ; poursuivre en birhinal si l’asymétrie est faible (avec Sniffin’ Sticks : différence de seuil inférieure à 2,5 et d’identification inférieure à 3 points). Hyposmie : sous le 10<sup>e</sup> percentile des sujets jeunes sains ; anosmie : distribution des scores des anosmiques.</p>
<div class="lab">Limite</div><p>Le diagnostic ne se pose que par rapport aux normes du test utilisé. L’impression subjective du patient ne suffit pas.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a></p></template>
<template data-pop="g52-entrainement" data-title="Entraînement olfactif">
<div class="lab">Définition</div><p>Exposition répétée à des odeurs choisies. Le protocole princeps utilise quatre odeurs (rose, eucalyptus, citron, girofle) deux fois par jour, au moins trois mois (Consensus européen 2023).</p>
<div class="lab">Preuves</div><p>Amélioration significative à 12 semaines contre l’absence d’entraînement. Recommandé dans plusieurs étiologies, notamment post-infectieuse et post-traumatique (Delphi 98 %).</p>
<div class="lab">Limite</div><p>Consensus d’experts ; niveau de preuve souvent faible. Les modalités au-delà du protocole princeps ne sont pas précisées.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a></p></template>
<template data-pop="g52-irm" data-title="IRM dans les affections de G 52">
<div class="lab">Définition</div><p>Imagerie par résonance magnétique du cerveau, du bulbe, des voies olfactives ou des nerfs (Consensus européen 2023 ; Chen 2015).</p>
<div class="lab">Application</div><p>Première intention si cause intracrânienne suspectée ; recommandée en forme idiopathique ; peut montrer le conflit de la névralgie &#73;X (ICHD-3) ; IRM cervicale plus sensible que l’angiographie pour les paralysies de nerfs crâniens inférieurs sans ischémie (Gobert 1996).</p>
<div class="lab">Limite</div><p>Une IRM normale n’exclut pas une cause post-traumatique ; elle est nécessaire, mais non suffisante, pour affirmer une forme idiopathique.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a> ; <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a> ; <a href="https://doi.org/10.1007/s00701-014-2302-7" target="_blank" rel="noopener">Chen 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8669229/" target="_blank" rel="noopener">Gobert 1996</a></p></template>
<template data-pop="g52-carbamazepine" data-title="Carbamazépine (Tégrétol®), monographie">
<div class="lab">Mécanisme</div><p>Antiépileptique ; l’information professionnelle lue ne détaille pas le mécanisme d’action. Puissant inducteur du CYP3A4 (Tégrétol).</p>
<div class="lab">Indication et posologie</div><p>Névralgie essentielle du glosso-pharyngien : dose initiale 200 à 400 mg par jour (sujet âgé : 100 mg deux fois par jour), augmentation lente jusqu’à disparition de la douleur (habituellement 200 mg trois à quatre fois par jour), maximum 1200 mg par jour ; réduction au plus bas niveau efficace ; tentative d’arrêt progressif après rémission.</p>
<div class="lab">Contre-indications</div><p>Bloc auriculoventriculaire, dépression médullaire, porphyrie hépatique, hypersensibilité (y compris aux tricycliques), association aux inhibiteurs de la monoamine-oxydase (arrêt d’au moins deux semaines).</p>
<div class="lab">Surveillance</div><p>Dépistage de HLA-B*1502 avant traitement chez les patients d’origine à risque ; HLA-A*3101 aussi associé ; hémogramme avec plaquettes et réticulocytes et fer sérique avant traitement puis régulièrement ; contrôle du sodium (hyponatrémie par effet de type hormone antidiurétique, risque accru avec les diurétiques).</p>
<div class="lab">Limite</div><p>Information professionnelle à jour de juillet 2025. Les essais cliniques sur la névralgie &#73;X ne figurent pas dans le dossier.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Tégrétol</a></p></template>
<template data-pop="g52-hla" data-title="HLA-B*1502 et HLA-A*3101">
<div class="lab">Définition</div><p>Allèles du système HLA. HLA-B*1502 est fortement corrélé au syndrome de Stevens-Johnson et à la nécrolyse épidermique toxique sous carbamazépine chez les patients d’origine à risque (Chinois Han, Thaïlande, Philippines, Malaisie…) ; HLA-A*3101 est aussi associé (Tégrétol).</p>
<div class="lab">Application</div><p>Le dépistage se fait avant le premier comprimé.</p>
<div class="lab">Limite</div><p>L’information professionnelle ne chiffre pas ici la valeur prédictive du test ; elle recommande le dépistage dans les populations à risque.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Tégrétol</a></p></template>
<template data-pop="g52-oxcarbazepine" data-title="Oxcarbazépine (Trileptal®), monographie">
<div class="lab">Indication suisse</div><p>Épilepsie seule. La névralgie glossopharyngienne est donc hors indication suisse (Trileptal).</p>
<div class="lab">Sécurité</div><p>Hyponatrémie inférieure à 125 mmol/l chez 2,7 % des patients (Trileptal).</p>
<div class="lab">Place</div><p>La littérature neurochirurgicale la cite avec la carbamazépine en première ligne (Chen 2015).</p>
<div class="lab">Limite</div><p>Dose pour cette indication non lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00701-014-2302-7" target="_blank" rel="noopener">Chen 2015</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Trileptal</a></p></template>
<template data-pop="g52-arbitrage-oxc" data-title="Arbitrage : oxcarbazépine hors indication suisse">
<div class="lab">Conflit</div><p>Une revue (Chen 2015) cite la carbamazépine ou l’oxcarbazépine en première ligne. L’information professionnelle suisse du Trileptal limite l’indication à l’épilepsie.</p>
<div class="lab">Règle de choix</div><p>Pour la conduite en Suisse, l’information professionnelle prime : la carbamazépine est la seule à porter l’indication de névralgie glossopharyngienne. L’oxcarbazépine reste un choix hors indication, à documenter.</p>
<div class="lab">Accès au texte</div><p>Les deux informations professionnelles sont accessibles via la base Swissmedic (AIPS) ; le texte ancien d’un produit peut aussi y être consulté.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00701-014-2302-7" target="_blank" rel="noopener">Chen 2015</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Tégrétol</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Trileptal</a></p></template>
<template data-pop="g52-dmv" data-title="Options chirurgicales dans la névralgie &#73;X">
<div class="lab">Définition</div><p>Décompression microvasculaire (première option neurochirurgicale), radiochirurgie stéréotaxique (état général précaire), thermorhizotomie ou tractotomie-nucléotomie (alternatives exposant à un déficit) (Chen 2015).</p>
<div class="lab">Résultats</div><p>Méta-analyse de 792 cas : soulagement à long terme 96 % après section nerveuse, 82 % après radiochirurgie ; complications 26 % après décompression microvasculaire, 0 % après radiochirurgie (Lu 2018).</p>
<div class="lab">Limite</div><p>Études observationnelles hétérogènes, résumé seul ; auteurs australiens et américains : à lire comme des données et non comme une recommandation.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00701-014-2302-7" target="_blank" rel="noopener">Chen 2015</a> ; <a href="https://doi.org/10.1016/j.wneu.2018.09.042" target="_blank" rel="noopener">Lu 2018</a></p></template>
<template data-pop="g52-corticoides" data-title="Corticoïdes et odorat">
<div class="lab">Indication</div><p>Cure courte systémique et/ou intranasaux au long cours dans la rhinosinusite chronique et la rhinite allergique sévère, selon les recommandations de la maladie (Consensus européen 2023).</p>
<div class="lab">Autres causes</div><p>Preuves limitées ; si une voie topique est choisie, préférer un rinçage atteignant la fente olfactive plutôt qu’un spray.</p>
<div class="lab">Limite</div><p>Doses non relevées ; les effets indésirables sont à prendre en compte.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a></p></template>
<template data-pop="g52-dupilumab" data-title="Dupilumab dans la rhinosinusite avec polypes">
<div class="lab">Définition</div><p>Biothérapie citée parmi celles qui améliorent l’odorat dans la rhinosinusite chronique avec polypes sévère ; le dupilumab semble le plus efficace (Consensus européen 2023).</p>
<div class="lab">Application</div><p>Le consensus renvoie aux recommandations de la rhinosinusite pour les indications.</p>
<div class="lab">Limite</div><p>Information professionnelle suisse du dupilumab non lue ; aucune dose n’est donnée.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a></p></template>
<template data-pop="pareto-g52-definition" data-title="Pareto — Définition, classification et fréquence">
<p class="ratio" data-cover="g52-0,g52-1,g52-2"></p><ul><li>G 52 regroupe les nerfs I, &#73;X, X, &#88;II et les atteintes multiples.</li><li>L’optique, le vestibulocochléaire et les oculomoteurs sont exclus.</li><li>Dysfonction olfactive : environ 22 % ; tumeur : première cause des atteintes multiples.</li></ul></template>
<template data-pop="pareto-g52-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="g52-3,g52-4"></p><ul><li>Odorat : obstruction, cisaillement, dépôts de Lewy ; régénération possible.</li><li>&#73;X : conflit neurovasculaire.</li><li>Nerfs inférieurs : dissection (compression) ou tumeur.</li></ul></template>
<template data-pop="pareto-g52-clinique" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="g52-5,g52-6"></p><ul><li>Mode de début : brutal, fluctuant, insidieux.</li><li>Névralgie &#73;X : décharges déclenchées par la déglutition.</li><li>&#88;II : langue déviée ; chercher un Claude Bernard-Horner.</li></ul></template>
<template data-pop="pareto-g52-diagnostic" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="g52-7,g52-8"></p><ul><li>Du plus grave au plus bénin : dissection, tumeur, Guillain-Barré.</li><li>Syncope ou bradycardie : forme vagale.</li><li>Collet-Sicard : nutrition entérale chez 23,3 %.</li></ul></template>
<template data-pop="pareto-g52-prise" data-title="Pareto — Prise en charge, suivi et pronostic">
<p class="ratio" data-cover="g52-9,g52-10"></p><ul><li>Odorat : traiter la cause ; entraînement olfactif.</li><li>Névralgie &#73;X : carbamazépine, puis chirurgie.</li><li>Le pronostic dépend de la cause : tumeur 7,1 % de récupération dans Collet-Sicard.</li></ul></template>
<template data-pop="pareto-g52-situations" data-title="Pareto — Situations particulières, critères et paramètres">
<p class="ratio" data-cover="g52-11,g52-12"></p><ul><li>Enfant : test validé pour l’âge.</li><li>ICHD-3 : accès de quelques secondes à 2 minutes.</li><li>Carbamazépine : maximum 1200 mg par jour, HLA-B*1502 chez les patients à risque.</li></ul></template>
<template data-pop="pareto-g52-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g52-e-1,g52-e-2,g52-e-3,g52-e-4,g52-e-5"></p><ul><li>Test psychophysique pour mesurer l’odorat ; sous le 10e percentile : hyposmie.</li><li>TDM des sinus si inflammation ; IRM si cause intracrânienne.</li><li>Dissection : IRM et angiographie par résonance magnétique.</li></ul></template>
<template data-pop="pareto-g52-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g52-s-anat-cours"></p><ul><li>Nerf I : fente olfactive vers le bulbe.</li><li>Foramen jugulaire 44,4 %, espace rétrostylien 28,9 %.</li></ul></template>
<template data-pop="pareto-g52-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g52-s-histo-cours"></p><ul><li>Neuroépithélium régénérable.</li><li>Corps de Lewy dans le bulbe dans la maladie de Parkinson.</li><li>Hématome intramural dans la dissection.</li></ul></template>
<template data-pop="pareto-g52-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g52-s-physio-cours"></p><ul><li>Voies orthonasale et rétronasale.</li><li>Déglutition, toux, parole, bâillement : déclencheurs du &#73;X.</li></ul></template>
<template data-pop="pareto-g52-gen" data-title="Pareto — Génétique et biochimie">
<p class="ratio" data-cover="g52-s-gen-cours"></p><ul><li>Kallmann : hypogonadisme hypogonadotrope.</li><li>HLA-B*1502 : dépister avant la carbamazépine.</li><li>CYP3A4 : induction ; sodium : contrôle.</li></ul></template>
<template data-pop="pareto-g52-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g52-p-1,g52-p-2,g52-p-3"></p><ul><li>Carbamazépine : 200 à 400 mg par jour au départ, maximum 1200 mg.</li><li>Oxcarbazépine : hors indication suisse.</li><li>Pas d’association aux inhibiteurs de la monoamine-oxydase.</li></ul></template>
