<section class="ilot" id="g52-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Trois patients, trois nerfs, une même catégorie de la classification. Les valeurs ci-dessous sont <b>fictives</b> et pédagogiques ; elles servent à poser les questions auxquelles le cours répond.</p>
<p><b>Première vignette.</b> Un homme de 58 ans ne reconnaît plus l’odeur du café depuis plusieurs mois. Son nez est souvent bouché, la perte varie d’une semaine à l’autre, et il sent à peine le goût du vin. Le médecin doit se demander si le trouble est quantitatif ou qualitatif, s’il vient du nez ou du cerveau, et si le « goût » perdu n’est pas en réalité une <button class="w" data-k="g52-olfaction">perte de l’olfaction rétronasale</button> (Consensus européen 2023).</p>
<p><b>Deuxième vignette.</b> Une femme de 64 ans décrit, depuis trois semaines, des décharges fulgurantes de quelques secondes dans la gorge et vers l’oreille, déclenchées par la déglutition. Elle a failli perdre connaissance pendant l’une d’elles. Le tableau évoque une <button class="w" data-k="g52-ngp">névralgie glossopharyngienne</button> ; la syncope impose de penser à sa <button class="w" data-k="g52-vagoglosso">forme vagale</button> (ICHD-3).</p>
<p><b>Troisième vignette.</b> Un homme de 47 ans présente depuis deux jours une langue qui dévie vers un côté, une gêne à avaler, une voix modifiée et une douleur cervicale. Une paupière tombe légèrement de ce côté. La question n’est pas seulement « quel nerf ? » ; elle est « quelle lésion grave explique une atteinte des nerfs crâniens inférieurs, et que risque-t-on dans les heures qui suivent ? ». Une <button class="w" data-k="g52-dissection">dissection de l’artère carotide interne</button> en est une cause à ne pas manquer (Guillon 1998 ; Frisina 2026).</p>
<p>À la fin de ce cours, le lecteur sait délimiter la catégorie G 52 et ses sous-codes, nommer le nerf et le siège probable d’une lésion à partir de la clinique, énoncer le bilan qui répond à chaque question (tests olfactifs, imagerie par résonance magnétique, angiographie), traiter la névralgie glossopharyngienne avec la dose de carbamazépine de l’information professionnelle suisse, et reconnaître les situations où l’on ne doit pas attendre.</p>
<div class="key"><b>À retenir.</b> Une atteinte d’un nerf crânien isolé se classe ici ; la cause décide du traitement. L’odorat se mesure avant de se traiter, la névralgie se traite par un antiépileptique spécifique, et une paralysie des nerfs inférieurs avec douleur cervicale fait chercher une dissection carotidienne.</div>
</section>
<section class="ilot" id="g52-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La catégorie G 52 de la classification CIM-10-GM 2024 regroupe les affections des nerfs crâniens qui n’ont pas de catégorie propre : le nerf olfactif (I), le nerf glossopharyngien (&#73;X), le nerf vague (X) et le nerf hypoglosse (&#88;II), auxquels s’ajoutent les atteintes de plusieurs nerfs (BfArM 2024 ; OFS 2024). Le trijumeau (G 50) et le facial (G 51) ont leurs propres catégories ; la présente leçon ne les traite pas.</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Libellé (OFS 2024)</th><th>Nerf</th><th>Contenu de la leçon</th></tr></thead><tbody><tr><td>G 52.0</td><td>Affections du nerf olfactif</td><td>I</td><td><button class="w" data-k="g52-olfaction">Troubles de l’odorat</button></td></tr><tr><td>G 52.1</td><td>Affections du nerf glossopharyngien ; inclut la névralgie glossopharyngienne</td><td>&#73;X</td><td><button class="w" data-k="g52-ngp">Névralgie glossopharyngienne</button></td></tr><tr><td>G 52.2</td><td>Affections du nerf vagal</td><td>X</td><td>Aucune source spécifique lue (lacune)</td></tr><tr><td>G 52.3</td><td>Affections du nerf grand hypoglosse</td><td>&#88;II</td><td><button class="w" data-k="g52-xii">Paralysie du nerf hypoglosse</button></td></tr><tr><td>G 52.7</td><td>Affections de plusieurs nerfs crâniens ; inclut la polynévrite crânienne</td><td>Plusieurs</td><td><button class="w" data-k="g52-collet">Collet-Sicard</button>, <button class="w" data-k="g52-villaret">Villaret</button>, <button class="w" data-k="g52-keane">séries d’atteintes multiples</button></td></tr><tr><td>G 52.8 et G 52.9</td><td>Autres nerfs précisés ; sans précision</td><td>Résiduel</td><td>Catégories résiduelles, sans contenu spécifique</td></tr></tbody></table>
<p>Le tableau sert de plan : chaque ligne renvoie à un raisonnement clinique distinct, et la lecture montre que le code seul ne fait pas le diagnostic. Le <button class="w" data-k="g52-perimetre">périmètre exact de G 52</button> exclut le nerf optique (H46, H47.0), le nerf vestibulocochléaire (H93.3) et la paralysie oculomotrice des nerfs III, IV et VI (H49.0 à H49.2) (BfArM 2024).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Ranger une baisse de vision ou une diplopie sous G 52. Ces atteintes relèvent des catégories H citées ci-dessus ; G 52 ne couvre ni le nerf optique, ni le vestibulocochléaire, ni les nerfs oculomoteurs.</div>
<h3>1.1 Vocabulaire des troubles de l’odorat</h3>
<p>Le consensus européen de 2023 fixe une terminologie que l’examen fédéral attend. Il recommande aussi de classer ces troubles selon leur cause (Consensus européen 2023, Delphi 98 %).</p>
<table class="t"><thead><tr><th>Terme</th><th>Définition</th></tr></thead><tbody><tr><td>Normosmie</td><td>fonction olfactive quantitativement normale</td></tr><tr><td>Hyposmie</td><td>fonction quantitativement réduite</td></tr><tr><td>Anosmie</td><td>réduction telle que l’odorat n’est plus utile au quotidien</td></tr><tr><td>Anosmie spécifique</td><td>incapacité à sentir une odeur précise, les autres étant préservées</td></tr><tr><td>Hyperosmie</td><td>capacité accrue (au-delà du 90<sup>e</sup> percentile d’un test)</td></tr><tr><td>Parosmie</td><td>perception déformée en présence d’une odeur</td></tr><tr><td>Fantosmie</td><td>perception d’une odeur en l’absence de stimulus</td></tr><tr><td>Olfaction orthonasale</td><td>perception par les narines lors du reniflement</td></tr><tr><td>Olfaction rétronasale</td><td>perception par le nasopharynx lors de la déglutition ou de l’expiration</td></tr></tbody></table>
<p>Le terme « anosmie fonctionnelle » est abandonné par le consensus (Consensus européen 2023). La distinction entre les deux voies d’arrivée des odeurs importe en pratique : un patient qui dit « ne plus avoir de goût » peut avoir perdu l’olfaction rétronasale alors que le goût lui-même est intact.</p>
<h3>1.2 Classification des douleurs du nerf &#73;X</h3>
<p>L’ICHD-3 (classification internationale des céphalées, 3<sup>e</sup> édition) distingue deux entités, détaillées dans les <button class="w" data-k="g52-ichd">critères de la rubrique 13.2</button> : la névralgie glossopharyngienne (13.2.1), avec ses formes classique, secondaire et idiopathique, et la neuropathie glossopharyngienne douloureuse (13.2.2), dont la douleur est continue, brûlante ou constrictive (ICHD-3).</p>
<h3>1.3 Atteintes de plusieurs nerfs : deux syndromes à reconnaître</h3>
<p>Le <button class="w" data-k="g52-collet">syndrome de Collet-Sicard</button> désigne la paralysie unilatérale des nerfs &#73;X, X, &#88;I et &#88;II (Aguilera-Pena 2023 ; Beucler 2024). Le <button class="w" data-k="g52-villaret">syndrome de Villaret</button> y ajoute l’atteinte de la chaîne sympathique cervicale, c’est-à-dire un syndrome de Claude Bernard-Horner, et évoque un processus de l’espace rétrostylien (Choucha 2026). Les définitions sourcées des syndromes de Vernet et de Tapia n’ont pas été trouvées ; elles ne figurent donc pas dans cette leçon.</p>
<div class="trap"><span class="k">Piège</span> Les syndromes à noms propres se définissent par la combinaison des nerfs atteints, non par l’ordre d’apparition. Collet-Sicard réunit &#73;X, X, &#88;I et &#88;II ; si la chaîne sympathique est aussi touchée, le tableau devient celui de Villaret. Une <button class="w" data-k="g52-mnemo">aide mnémotechnique</button> facilite la retenue.</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS 2024</a> ; <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a> ; <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a> ; <a href="https://doi.org/10.1007/s10143-023-02145-7" target="_blank" rel="noopener">Aguilera-Pena 2023</a> ; <a href="https://doi.org/10.1055/s-0044-1787050" target="_blank" rel="noopener">Beucler 2024</a> ; <a href="https://doi.org/10.1055/s-0046-1817058" target="_blank" rel="noopener">Choucha 2026</a></p>
</section>
<section class="ilot" id="g52-2"><h2><span class="n">2</span>Fréquence et pronostic de population</h2>
<p>Aucune donnée suisse spécifique à G 52 n’a été trouvée dans les sources lues. Les chiffres suivants sont européens ou internationaux et décrivent des populations très différentes ; ils ne s’additionnent pas.</p>
<table class="t"><thead><tr><th>Question</th><th>Donnée</th><th>Source</th></tr></thead><tbody><tr><td>Dysfonction olfactive en population générale</td><td>environ 22 % (22,2 % ; intervalle de confiance à 95 % : 14,8 à 30,6 %) ; la prévalence augmente avec l’âge</td><td>Consensus européen 2023</td></tr><tr><td>Rhinite allergique</td><td>dysfonction olfactive dans 20 à 40 % des cas</td><td>Consensus européen 2023</td></tr><tr><td>Rhinosinusite chronique</td><td>dysfonction olfactive dans 84 % des cas</td><td>Consensus européen 2023</td></tr><tr><td>Névralgie glossopharyngienne</td><td>rare ; environ 1 % de l’incidence de la névralgie du trijumeau</td><td>Chen 2015</td></tr><tr><td>Atteintes de plusieurs nerfs crâniens (979 hospitalisés)</td><td>tumeur dans 305 cas, soit plus d’un quart</td><td><button class="w" data-k="g52-keane">Keane 2005</button></td></tr><tr><td>Collet-Sicard (135 patients)</td><td>67,7 % d’hommes ; cause tumorale 39,6 %, vasculaire 27,6 %</td><td>Aguilera-Pena 2023</td></tr></tbody></table>
<p>La lecture du tableau demande de la prudence. Le chiffre de 22 % vient d’une méta-analyse citée par un consensus d’experts ; la dysfonction idiopathique du sujet âgé y est associée au déclin cognitif et à une mortalité accrue (Consensus européen 2023). Les 84 % de la rhinosinusite chronique concordent avec le rang de la maladie nasosinusienne parmi les causes, l’âge exclu. La série de Keane est américaine, hospitalière et personnelle : elle décrit ce que l’on rencontre, elle ne fournit pas une incidence en population.</p>
<p>Les causes les plus fréquentes de perte d’odorat, l’âge exclu, sont la maladie nasosinusienne (surtout la rhinosinusite chronique de type 2 avec polypes), l’origine post-infectieuse, l’origine post-traumatique et les maladies neurologiques (Consensus européen 2023).</p>
<div class="trap"><span class="k">Piège</span> Ne confondez pas la plainte et la mesure. Le consensus recommande un questionnaire validé ou une échelle visuelle analogique, mais sans s’y fier isolément ; la fonction olfactive se mesure par un test psychophysique validé.</div>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a> ; <a href="https://doi.org/10.1007/s00701-014-2302-7" target="_blank" rel="noopener">Chen 2015</a> ; <a href="https://doi.org/10.1001/archneur.62.11.1714" target="_blank" rel="noopener">Keane 2005</a> ; <a href="https://doi.org/10.1007/s10143-023-02145-7" target="_blank" rel="noopener">Aguilera-Pena 2023</a></p>

<section class="ilot" id="g52-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Chaque nerf se lit du normal vers le pathologique : où siège le déficit, quelle structure le provoque, quelle manifestation en découle. Les trois nerfs de la leçon obéissent à trois logiques différentes.</p>
<h3>3.1 Le nerf olfactif : un neurone exposé qui sait se réparer</h3>
<p>Les neurones sensoriels olfactifs siègent dans le neuroépithélium de la fente olfactive. Activés par les odorants, ils transmettent par leurs axones, dont l’ensemble forme le nerf I, jusqu’au <button class="w" data-k="g52-bulbe">bulbe olfactif</button>, puis vers les réseaux olfactifs primaire et secondaire (Consensus européen 2023). Cette position exposée explique la fréquence des lésions ; elle s’accompagne d’une capacité de régénération à partir de cellules souches du neuroépithélium (Consensus européen 2023).</p>
<p>La suite dépend de la cause. Dans la <button class="w" data-k="g52-sinusal">rhinosinusite chronique</button>, l’œdème, les sécrétions et les polypes gênent mécaniquement l’arrivée des odorants ; l’inflammation altère de façon réversible les récepteurs, puis, à long terme, remodèle le neuroépithélium, le bulbe et les aires cérébrales. La perte est donc progressive et fluctuante, rarement améliorée sans traitement, et rarement accompagnée de parosmie (Consensus européen 2023).</p>
<p>Après un traumatisme, le début est souvent brutal parce que les filets olfactifs sont cisaillés ; il est parfois retardé, par œdème ou par des mécanismes centraux progressifs. L’imagerie peut être normale et la fantosmie est fréquente (<button class="w" data-k="g52-ptod">dysfonction post-traumatique</button>, Consensus européen 2023). Dans la <button class="w" data-k="g52-parkinson">maladie de Parkinson</button>, des dépôts de corps de Lewy touchent le bulbe et le tractus olfactifs ; la perte précède les signes moteurs de plusieurs années et ne répond pas aux antiparkinsoniens (Consensus européen 2023).</p>
<p>La forme congénitale la plus fréquente est aujourd’hui l’anosmie isolée, sans cause génétique connue. Le <button class="w" data-k="g52-kallmann">syndrome de Kallmann</button> associe un hypogonadisme hypogonadotrope à des bulbes et sillons olfactifs hypoplasiques ou absents (Consensus européen 2023 ; Bonilla Medrano 2026).</p>
<h3>3.2 Le glossopharyngien : un conflit à la racine</h3>
<p>La douleur de la névralgie siège dans la partie postérieure de la langue, la fosse amygdalienne, le pharynx, l’angle de la mandibule et l’oreille ; les rameaux auriculaire et pharyngé du nerf vague partagent ce territoire (ICHD-3). Dans la plupart des cas, un <button class="w" data-k="g52-conflit">conflit neurovasculaire</button> existe à la zone d’entrée radiculaire ou dans la citerne, sur le &#73;X et/ou le X (Chen 2015). Quand les accès s’accompagnent de toux, de raucité, de syncope ou de bradycardie, on parle de <button class="w" data-k="g52-vagoglosso">forme vagale</button> (ICHD-3).</p>
<h3>3.3 L’hypoglosse et les nerfs inférieurs : la paroi d’une artère</h3>
<p>Dans la paralysie du &#88;II par <button class="w" data-k="g52-dissection">dissection carotidienne</button>, le mécanisme est surtout compressif : la paroi artérielle, élargie par un hématome sous-adventitiel, comprime le nerf. Une part ischémique, par atteinte des vasa nervorum, n’est pas exclue (Frisina 2026). La même double hypothèse vaut pour les nerfs crâniens inférieurs (Gobert 1996).</p>
<figure><svg viewBox="0 0 640 200" role="img" aria-label="Figure 1 — Trois mécanismes" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="20" y="30" width="170" height="120" rx="8"/><rect x="235" y="30" width="170" height="120" rx="8"/><rect x="450" y="30" width="170" height="120" rx="8"/><path d="M105 150v25M320 150v25M535 150v25"/></g><g fill="currentColor"><text x="105" y="55" text-anchor="middle">Nerf I</text><text x="105" y="80" text-anchor="middle">fente olfactive</text><text x="105" y="105" text-anchor="middle">obstruction,</text><text x="105" y="125" text-anchor="middle">cisaillement</text><text x="320" y="55" text-anchor="middle">Nerf &#73;X</text><text x="320" y="80" text-anchor="middle">racine, citerne</text><text x="320" y="105" text-anchor="middle">conflit avec</text><text x="320" y="125" text-anchor="middle">un vaisseau</text><text x="535" y="55" text-anchor="middle">Nerfs &#73;X à &#88;II</text><text x="535" y="80" text-anchor="middle">espace rétrostylien</text><text x="535" y="105" text-anchor="middle">paroi artérielle</text><text x="535" y="125" text-anchor="middle">ou tumeur</text><text x="105" y="192" text-anchor="middle">perte d’odorat</text><text x="320" y="192" text-anchor="middle">décharges</text><text x="535" y="192" text-anchor="middle">dysphagie, langue</text></g></svg><figcaption>Figure 1 — Schéma didactique : siège et mécanisme principal pour chaque groupe de nerfs ; non calibré.</figcaption></figure>
<div class="key"><b>À retenir.</b> Le siège explique la clinique. Un nerf exposé dans la fente olfactive perd sa fonction par obstruction ou cisaillement, mais se régénère. Un nerf comprimé à sa racine déclenche des décharges. Une paroi artérielle ou une tumeur de l’espace rétrostylien paralyse plusieurs nerfs voisins.</div>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a> ; <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a> ; <a href="https://doi.org/10.1007/s00701-014-2302-7" target="_blank" rel="noopener">Chen 2015</a> ; <a href="https://doi.org/10.3390/neurolint18080150" target="_blank" rel="noopener">Frisina 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8669229/" target="_blank" rel="noopener">Gobert 1996</a> ; <a href="https://doi.org/10.53738/REVMED.2026.22.977.49087" target="_blank" rel="noopener">Bonilla Medrano 2026</a></p>
</section>
<section class="ilot" id="g52-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Le tableau classe les causes selon le nerf. Il indique aussi pourquoi la cause oriente le traitement.</p>
<table class="t"><thead><tr><th>Nerf ou situation</th><th>Causes citées</th><th>Source</th></tr></thead><tbody><tr><td>Olfactif</td><td>maladie nasosinusienne, post-infectieuse, post-traumatique, neurologique (dont Parkinson), congénitale (Kallmann ou anosmie isolée), toxiques</td><td>Consensus européen 2023</td></tr><tr><td>Glossopharyngien (secondaire)</td><td>traumatisme cervical, sclérose en plaques, tumeurs amygdaliennes ou régionales, tumeurs de l’angle pontocérébelleux, malformation d’Arnold-Chiari (rapports isolés)</td><td>ICHD-3</td></tr><tr><td>Hypoglosse isolé</td><td>tumeur (cause la plus fréquente), traumatisme, lésions vasculaires dont dissection carotidienne, infections, maladies auto-immunes ou démyélinisantes, idiopathique</td><td>Frisina 2026 ; Nigam 2025</td></tr><tr><td>Plusieurs nerfs</td><td>tumeur, vasculaire, traumatisme, infection, syndrome de Guillain-Barré ou de Fisher</td><td>Keane 2005</td></tr></tbody></table>
<p>Les agents toxiques qui altèrent l’odorat comprennent les acides, le benzène, le cadmium, le chlore, le formaldéhyde et le plomb (Consensus européen 2023). Le consensus consacre un tableau aux médicaments en cause ; il n’a pas été relevé dans le présent dossier, et aucune liste de médicaments n’est donc proposée ici.</p>
<p>Dans la série de 979 hospitalisés pour atteinte multiple, la tumeur est la cause la plus fréquente (305 cas), devant les causes vasculaires (128), les traumatismes (128), les infections (102) et les syndromes de Guillain-Barré et de Fisher (91). Les récidives sont rares (43 cas) et surviennent surtout chez les diabétiques (Keane 2005). Dans le syndrome de Collet-Sicard, la cause tumorale représente 39,6 % et la cause vasculaire 27,6 % ; le siège est le foramen jugulaire dans 44,4 % des cas et l’espace parapharyngé rétrostylien dans 28,9 % (Aguilera-Pena 2023).</p>
<div class="trap"><span class="k">Piège</span> Le déclin olfactif est physiologique chez le sujet âgé, mais la dysfonction idiopathique s’associe au déclin cognitif et à une mortalité accrue. La forme idiopathique reste un diagnostic d’exclusion : on cherche la cause avant de l’attribuer à l’âge.</div>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a> ; <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a> ; <a href="https://doi.org/10.1001/archneur.62.11.1714" target="_blank" rel="noopener">Keane 2005</a> ; <a href="https://doi.org/10.1007/s10143-023-02145-7" target="_blank" rel="noopener">Aguilera-Pena 2023</a> ; <a href="https://doi.org/10.3390/neurolint18080150" target="_blank" rel="noopener">Frisina 2026</a> ; <a href="https://doi.org/10.4103/neurol-india.Neurol-India-D-24-00670" target="_blank" rel="noopener">Nigam 2025</a></p>

<section class="ilot" id="g52-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse réalise le tri le plus rentable. Elle fixe le nerf, le mode de début et les signes d’alarme avant tout examen complémentaire. Le consensus européen demande une anamnèse complète chez tous les patients avec trouble olfactif (Consensus européen 2023, Delphi 100 %).</p>
<h3>5.1 Antécédents et contexte à rechercher</h3>
<ul><li><b>Odorat</b> : traumatisme crânien, infection récente, symptômes nasosinusiens, signes neurologiques, expositions toxiques (Consensus européen 2023).</li><li><b>Névralgie &#73;X</b> : sensations désagréables dans la gorge des semaines ou des mois avant les accès ; amaigrissement possible, les accès étant déclenchés par la déglutition (ICHD-3).</li><li><b>Hypoglosse ou nerfs inférieurs</b> : traumatisme cervical, céphalée ou douleur faciale récente, antécédent tumoral (Guillon 1998 ; Frisina 2026).</li></ul>
<h3>5.2 Le mode de début oriente la cause</h3>
<table class="t"><thead><tr><th>Mode de début</th><th>Orientation</th><th>Pourquoi</th></tr></thead><tbody><tr><td>Brutal après un traumatisme ou une infection</td><td>Post-traumatique ou post-infectieux</td><td>Cisaillement des filets olfactifs après un traumatisme</td></tr><tr><td>Progressif et fluctuant</td><td>Maladie nasosinusienne</td><td>L’œdème et les sécrétions varient</td></tr><tr><td>Insidieux, ignoré du patient</td><td>Maladie de Parkinson</td><td>Dépôts de corps de Lewy lents dans le bulbe</td></tr></tbody></table>
<p>La lecture de ce tableau repose sur le consensus européen. Il demande de rechercher la <button class="w" data-k="g52-parosmie">parosmie et la fantosmie</button> et leur cause (Consensus européen 2023 ; Macario 2022). Un questionnaire validé ou une échelle visuelle analogique complète la plainte, sans s’y substituer.</p>
<h3>5.3 Formes typique et atypiques</h3>
<div class="two"><div class="card"><h4>Névralgie &#73;X typique</h4><p>Douleur unilatérale brève, sévère, en décharge électrique, déclenchée par la déglutition, la toux, la parole ou le bâillement (ICHD-3).</p></div><div class="card"><h4>Névralgie &#73;X atypique ou vagale</h4><p>Accès associés à toux, raucité, syncope ou bradycardie ; le terme « névralgie vago-glossopharyngienne » est proposé en cas d’asystolie, de convulsions ou de syncope (ICHD-3).</p></div></div>
<div class="two"><div class="card"><h4>Hypoglosse par dissection</h4><p>Déviation et faiblesse de la langue, dysarthrie, dysphagie (81,8 % des cas rapportés) (Frisina 2026). Les signes locaux sont une céphalée ou douleur faciale, un syndrome de Claude Bernard-Horner et un acouphène pulsatile ; l’ischémie cérébrale ou rétinienne peut suivre quelques heures ou jours plus tard (Guillon 1998).</p></div><div class="card"><h4>Collet-Sicard</h4><p>Dysphagie et dysphonie au premier plan (Aguilera-Pena 2023).</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span> Chercher la cause de la perte d’odorat sans demander le mode de début. Le début brutal, fluctuant ou insidieux est l’indice le plus économique du siège de la lésion.</div>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a> ; <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a> ; <a href="https://doi.org/10.1007/s10143-023-02145-7" target="_blank" rel="noopener">Aguilera-Pena 2023</a> ; <a href="https://doi.org/10.3390/neurolint18080150" target="_blank" rel="noopener">Frisina 2026</a> ; <a href="https://doi.org/10.1016/s0022-510x(97)00287-6" target="_blank" rel="noopener">Guillon 1998</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.798.1837" target="_blank" rel="noopener">Macario 2022</a></p>
</section>
<section class="ilot" id="g52-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, puis examen ciblé du nerf suspect. Les signes sont présentés en deux colonnes, l’une pour l’odorat, l’autre pour les nerfs inférieurs.</p>
<div class="two"><div class="card"><h4>Odorat</h4><ul><li><b>Examen ORL complet</b> avec <button class="w" data-k="g52-endoscopie">endoscopie nasale</button> et inspection attentive de la fente olfactive (Consensus européen 2023, Delphi 98 %).</li><li><b>Examen neurologique de base</b> si une cause neurologique est suspectée ou si la forme paraît idiopathique (Consensus européen 2023).</li><li><b>Dépistage gustatif</b> dans tous les cas (sucré, salé, acide, amer) (Consensus européen 2023).</li></ul></div><div class="card"><h4>Névralgie &#73;X</h4><ul><li><b>Examen habituellement normal</b> entre les accès : un déficit sensitif léger n’invalide pas le diagnostic.</li><li><b>Déficit marqué ou réflexe nauséeux diminué ou absent</b> : bilan étiologique indispensable (ICHD-3).</li><li><b>Test à l’anesthésique local</b> sur l’amygdale et la paroi pharyngée : il peut prévenir les accès quelques heures (ICHD-3).</li></ul></div></div>
<div class="two"><div class="card"><h4>Hypoglosse</h4><ul><li><b>Déviation et faiblesse de la langue</b> (100 % dans la revue sur la dissection) (Frisina 2026).</li><li><b>Recherche d’un Claude Bernard-Horner</b> : il oriente vers une atteinte de la chaîne sympathique et donc vers Villaret (Choucha 2026).</li></ul></div><div class="card"><h4>Nerfs inférieurs</h4><ul><li><b>Voix et déglutition</b> : dysphonie et dysphagie sont les signes de Collet-Sicard (Aguilera-Pena 2023).</li><li><b>Autres nerfs crâniens</b> : environ 21 % des Collet-Sicard touchent aussi les nerfs VII et &#86;III (Aguilera-Pena 2023).</li></ul></div></div>
<p>Dans la revue sur l’hypoglosse isolé par dissection, l’absence de Claude Bernard-Horner et d’atteinte d’un autre nerf crânien à la présentation était un critère d’inclusion. Cette absence ne protège donc pas, en pratique, contre une dissection (Frisina 2026).</p>
<div class="trap"><span class="k">Piège</span> Un examen sensitif pharyngé normal n’exclut pas la névralgie &#73;X. Le diagnostic repose sur la description des accès ; l’examen sert à écarter une cause secondaire.</div>
