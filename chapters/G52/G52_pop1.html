<template data-pop="g52-olfaction" data-title="Troubles de l’odorat : définitions et voies">
<div class="lab">Définition</div><p>Le consensus européen de 2023 distingue la normosmie, l’hyposmie (réduction quantitative), l’anosmie (réduction telle que l’odorat n’est plus utile au quotidien), l’hyperosmie (au-delà du 90<sup>e</sup> percentile d’un test), la parosmie (perception déformée en présence d’une odeur) et la fantosmie (perception sans stimulus). L’olfaction orthonasale passe par les narines ; l’olfaction rétronasale passe par le nasopharynx lors de la déglutition ou de l’expiration (Consensus européen 2023).</p>
<div class="lab">Application</div><p>Le médecin demande si le patient perçoit encore les saveurs de base. Un patient qui dit « ne plus avoir de goût » a souvent perdu l’olfaction rétronasale, alors que le goût est intact. Le dépistage gustatif (sucré, salé, acide, amer) le vérifie chez tous les patients (Consensus européen 2023).</p>
<div class="lab">Limite</div><p>Le terme « anosmie fonctionnelle » est abandonné. Le classement recommandé suit l’étiologie, avec un accord Delphi de 98 %, ce qui reste un avis d’experts.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a></p></template>
<template data-pop="g52-perimetre" data-title="Périmètre de G 52 : ce qui en est exclu">
<div class="lab">Définition</div><p>G 52 regroupe les affections des nerfs I, &#73;X, X, &#88;II et de plusieurs nerfs crâniens, non classées ailleurs. Les exclusions sont le nerf optique (H46, H47.0), le nerf vestibulocochléaire (H93.3) et la paralysie oculomotrice des nerfs III, IV, VI (H49.0 à H49.2). Le trijumeau relève de G 50, le facial de G 51 (BfArM 2024).</p>
<div class="lab">Application</div><p>Une diplopie, une baisse visuelle ou un vertige ne se codent pas en G 52. Le code se choisit à partir du nerf touché, puis de la précision du tableau : G 52.7 pour plusieurs nerfs, G 52.8 pour un autre nerf précisé, G 52.9 sans précision.</p>
<div class="lab">Limite</div><p>Les libellés français proviennent du registre de l’Office fédéral de la statistique. Les libellés allemands de la CIM-10-GM ont été lus via un résumé d’outil, pas dans le document original.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS 2024</a></p></template>
<template data-pop="g52-ichd" data-title="ICHD-3, rubrique 13.2">
<div class="lab">Définition</div><p>Deux entités : la névralgie glossopharyngienne (13.2.1), qui est une douleur paroxystique, et la neuropathie glossopharyngienne douloureuse (13.2.2), qui est une douleur continue, brûlante ou constrictive, avec déficit sensitif possible et réflexe nauséeux diminué ou absent. La névralgie se subdivise en classique (conflit neurovasculaire démontré à l’IRM ou en chirurgie), secondaire (maladie sous-jacente démontrée) et idiopathique (ICHD-3).</p>
<div class="lab">Application</div><p>Devant des accès de quelques secondes à deux minutes, déclenchés par la déglutition, on retient la névralgie. Devant une douleur continue avec réflexe nauséeux diminué, on retient la neuropathie et l’on cherche une cause.</p>
<div class="lab">Limite</div><p>Les sous-rubriques 13.2.1.3 et 13.2.2.x n’ont pas été ouvertes pour ce cours. L’ICHD-3 est une classification, non une recommandation thérapeutique.</p>
<p class="src">Références : <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a></p></template>
<template data-pop="g52-ngp" data-title="Névralgie glossopharyngienne">
<div class="lab">Définition</div><p>Douleur paroxystique unilatérale, brève (quelques secondes à deux minutes), sévère, en décharge électrique, siégeant dans la partie postérieure de la langue, la fosse amygdalienne, le pharynx, l’angle de la mandibule et/ou l’oreille, déclenchée par la déglutition, la toux, la parole ou le bâillement (ICHD-3).</p>
<div class="lab">Mécanisme</div><p>Dans la plupart des cas, un conflit neurovasculaire existe à la zone d’entrée radiculaire ou dans la citerne, sur le &#73;X et/ou le X (Chen 2015). Le mécanisme précis du caractère paroxystique n’est pas détaillé dans les sources lues.</p>
<div class="lab">Fréquence</div><p>Rare : environ 1 % de l’incidence de la névralgie du trijumeau (Chen 2015).</p>
<div class="lab">Décision</div><p>Première ligne : carbamazépine ou oxcarbazépine (ICHD-3 ; Chen 2015). En cas d’échec : décompression microvasculaire, radiochirurgie ou rhizotomie selon l’état général.</p>
<div class="lab">Limite</div><p>Aucune recommandation suisse spécifique n’a été trouvée ; l’indication du Tégrétol® est explicite en Suisse pour cette névralgie.</p>
<p class="src">Références : <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a> ; <a href="https://doi.org/10.1007/s00701-014-2302-7" target="_blank" rel="noopener">Chen 2015</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Tégrétol</a></p></template>
<template data-pop="g52-conflit" data-title="Conflit neurovasculaire">
<div class="lab">Définition</div><p>Contact entre un vaisseau et le nerf à la zone d’entrée radiculaire ou dans la citerne, sur le &#73;X et/ou le X (Chen 2015).</p>
<div class="lab">Application</div><p>L’IRM haute résolution peut montrer le conflit ; sa démonstration, à l’IRM ou en chirurgie, définit la forme classique (ICHD-3). L’IRM de haute résolution est sensible et spécifique dans la plupart des centres (Chen 2015).</p>
<div class="lab">Décision</div><p>Un conflit démontré oriente vers la décompression microvasculaire en cas d’échec médical, qui est la première option neurochirurgicale (Chen 2015).</p>
<div class="lab">Limite</div><p>La méta-analyse de 792 cas rapporte 26 % de complications après décompression microvasculaire (Lu 2018 ; source observationnelle hétérogène, résumé seul).</p>
<p class="src">Références : <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a> ; <a href="https://doi.org/10.1007/s00701-014-2302-7" target="_blank" rel="noopener">Chen 2015</a> ; <a href="https://doi.org/10.1016/j.wneu.2018.09.042" target="_blank" rel="noopener">Lu 2018</a></p></template>
<template data-pop="g52-vagoglosso" data-title="Forme vagale et névralgie vago-glossopharyngienne">
<div class="lab">Définition</div><p>Les accès s’associent à toux, raucité, syncope et/ou bradycardie. Le terme « névralgie vago-glossopharyngienne » est proposé en cas d’asystolie, de convulsions ou de syncope (ICHD-3).</p>
<div class="lab">Application</div><p>Devant une syncope pendant l’accès, le médecin recherche une bradycardie ou une asystolie. Le traitement médical de première ligne reste la carbamazépine.</p>
<div class="lab">Limite</div><p>Le mécanisme précis de la syncope n’est pas détaillé dans les sources lues ; seule l’association clinique est établie.</p>
<p class="src">Références : <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a> ; <a href="https://doi.org/10.1007/s00701-014-2302-7" target="_blank" rel="noopener">Chen 2015</a></p></template>
<template data-pop="g52-npgd" data-title="Neuropathie glossopharyngienne douloureuse">
<div class="lab">Définition</div><p>Douleur continue, brûlante ou constrictive, avec déficit sensitif possible et réflexe nauséeux diminué ou absent (ICHD-3, 13.2.2).</p>
<div class="lab">Application</div><p>La clinique la distingue de la névralgie par le caractère continu de la douleur et par l’examen. Un déficit marqué ou un réflexe nauséeux diminué impose un bilan étiologique.</p>
<div class="lab">Limite</div><p>Les sous-types 13.2.2.x n’ont pas été ouverts.</p>
<p class="src">Références : <a href="https://ichd-3.org/13-painful-cranial-neuropathies-and-other-facial-pains/13-2-glossopharyngeal-neuralgia/" target="_blank" rel="noopener">ICHD-3</a></p></template>
<template data-pop="g52-xii" data-title="Paralysie du nerf hypoglosse">
<div class="lab">Définition</div><p>Atteinte du nerf &#88;II, qui se manifeste par une déviation et une faiblesse de la langue, avec dysarthrie et dysphagie (Frisina 2026).</p>
<div class="lab">Causes</div><p>Tumeur (cause la plus fréquente), traumatisme, lésions vasculaires dont la dissection carotidienne, infections, maladies auto-immunes ou démyélinisantes, idiopathique (Frisina 2026 ; Nigam 2025).</p>
<div class="lab">Décision</div><p>Imagerie du trajet nerveux et de la carotide, puis traitement de la cause. La forme idiopathique peut persister 6 à 8 mois malgré un bilan négatif (Nigam 2025).</p>
<div class="lab">Limite</div><p>Les séries sont des cas rapportés, avec biais de publication.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/neurolint18080150" target="_blank" rel="noopener">Frisina 2026</a> ; <a href="https://doi.org/10.4103/neurol-india.Neurol-India-D-24-00670" target="_blank" rel="noopener">Nigam 2025</a></p></template>
<template data-pop="g52-dissection" data-title="Dissection de l’artère carotide interne">
<div class="lab">Définition</div><p>Atteinte de la paroi artérielle par un hématome intramural, avec expansion sous-adventitielle. Dans une revue, l’hématome intramural est présent dans 96,2 %, la sténose dans 88,5 % et l’élargissement externe de l’artère dans 91,7 % (Frisina 2026).</p>
<div class="lab">Application</div><p>Les signes locaux sont une céphalée ou douleur faciale, un syndrome de Claude Bernard-Horner et un acouphène pulsatile ; l’ischémie cérébrale ou rétinienne peut suivre en quelques heures ou jours. L’IRM et l’angiographie par résonance magnétique sont le meilleur outil diagnostique (Guillon 1998).</p>
<div class="lab">Arbitrage</div><p>Voir la fenêtre « Arbitrage : traitement antithrombotique de la dissection ». Le pronostic est excellent avec signes locaux seuls ; décès ou séquelles majeures dans environ 15 % globalement (Guillon 1998).</p>
<div class="lab">Limite</div><p>Les atteintes de nerfs crâniens sont rares : 7 sur 52 dissections consécutives (Gobert 1996).</p>
<p class="src">Références : <a href="https://doi.org/10.3390/neurolint18080150" target="_blank" rel="noopener">Frisina 2026</a> ; <a href="https://doi.org/10.1016/s0022-510x(97)00287-6" target="_blank" rel="noopener">Guillon 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8669229/" target="_blank" rel="noopener">Gobert 1996</a></p></template>
<template data-pop="g52-collet" data-title="Syndrome de Collet-Sicard">
<div class="lab">Définition</div><p>Paralysie unilatérale des nerfs &#73;X, X, &#88;I et &#88;II (Aguilera-Pena 2023 ; Beucler 2024).</p>
<div class="lab">Épidémiologie</div><p>Série de 135 patients : 67,7 % d’hommes ; cause tumorale 39,6 %, vasculaire 27,6 % ; siège foramen jugulaire 44,4 %, espace parapharyngé rétrostylien 28,9 % (Aguilera-Pena 2023). Méta-analyse de 73 cas : âge moyen 53,7 ans, rapport hommes/femmes 1,8 (Beucler 2024).</p>
<div class="lab">Pronostic</div><p>71,2 % d’issue favorable ; récupération &#73;X 52,1 %, X et &#88;II 46,6 %, &#88;I 39,7 % ; cause tumorale 7,1 %, infection 60 %, vasculaire 52,4 %, traumatisme 41,7 % ; nutrition entérale temporaire 23,3 % (Beucler 2024).</p>
<div class="lab">Limite</div><p>Données de cas rapportés (biais de publication). Aucune donnée suisse.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s10143-023-02145-7" target="_blank" rel="noopener">Aguilera-Pena 2023</a> ; <a href="https://doi.org/10.1055/s-0044-1787050" target="_blank" rel="noopener">Beucler 2024</a></p></template>
<template data-pop="g52-villaret" data-title="Syndrome de Villaret">
<div class="lab">Définition</div><p>Atteinte des nerfs &#73;X à &#88;II avec atteinte de la chaîne sympathique cervicale (syndrome de Claude Bernard-Horner) ; évoque un processus de l’espace rétrostylien (Choucha 2026).</p>
<div class="lab">Application</div><p>IRM dans tous les cas rapportés. Traitement conservateur (corticoïdes ou antithrombotiques) dans 41,6 %, chirurgie dans 33,3 % ; récupération complète ou quasi complète dans 50 %, surtout pour les causes vasculaires ou inflammatoires.</p>
<div class="lab">Limite</div><p>Treize patients dans douze études : l’effectif est très petit.</p>
<p class="src">Références : <a href="https://doi.org/10.1055/s-0046-1817058" target="_blank" rel="noopener">Choucha 2026</a></p></template>
<template data-pop="g52-keane" data-title="Atteintes de plusieurs nerfs crâniens : série de Keane">
<div class="lab">Définition</div><p>Série de 979 patients hospitalisés. Nerfs les plus touchés : VI (565), VII (466), V (353), III (339). Sièges : sinus caverneux (252), tronc cérébral (217), nerfs isolés (182). Causes : tumeur (305), vasculaire (128), traumatisme (128), infection (102), Guillain-Barré et Fisher (91) (Keane 2005).</p>
<div class="lab">Application</div><p>La série oriente la hiérarchie des causes à rechercher : la tumeur d’abord. Elle sert de repère descriptif, non de recommandation.</p>
<div class="lab">Limite</div><p>Série personnelle américaine, résumé seul. Aucune donnée européenne comparable n’a été lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1001/archneur.62.11.1714" target="_blank" rel="noopener">Keane 2005</a></p></template>
<template data-pop="g52-gbs" data-title="Syndrome de Guillain-Barré et syndrome de Fisher">
<div class="lab">Définition</div><p>Syndromes qui peuvent comporter une atteinte des nerfs crâniens (EAN/PNS 2023).</p>
<div class="lab">Application</div><p>Diagnostic différentiel de G 52.7 : une atteinte de plusieurs nerfs crâniens fait évoquer ce syndrome parmi les causes possibles. Dans la série de Keane, 91 cas relevaient de Guillain-Barré ou de Fisher (Keane 2005).</p>
<div class="lab">Limite</div><p>La recommandation EAN/PNS n’a été lue qu’au résumé ; aucun traitement n’est détaillé ici.</p>
<p class="src">Références : <a href="https://doi.org/10.1001/archneur.62.11.1714" target="_blank" rel="noopener">Keane 2005</a> ; <a href="https://doi.org/10.1111/ene.16073" target="_blank" rel="noopener">EAN/PNS 2023</a></p></template>
<template data-pop="g52-arbitrage-dissection" data-title="Arbitrage : traitement antithrombotique de la dissection">
<div class="lab">Conflit</div><p>La seule source thérapeutique lue (Guillon 1998) préconise « héparine puis anticoagulant oral ». Elle date de 1998.</p>
<div class="lab">Règle de choix</div><p>La source primaire applicable la plus récente l’emporte. La recommandation européenne actuelle (ESO) n’a pas pu être lue ; la conduite de 1998 ne doit donc pas être reprise.</p>
<div class="lab">Conduite pour cette leçon</div><p>Aucun schéma antithrombotique n’est proposé. Le lecteur consulte la recommandation européenne en vigueur ; l’ancien texte reste accessible pour son contenu diagnostique (IRM et angiographie par résonance magnétique).</p>
<p class="src">Références : <a href="https://doi.org/10.1016/s0022-510x(97)00287-6" target="_blank" rel="noopener">Guillon 1998</a></p></template>
<template data-pop="g52-mnemo" data-title="Aide mnémotechnique (non critère officiel)">
<div class="lab">Mnémonique</div><p>Collet-Sicard : « les quatre derniers nerfs » ; Villaret : « les quatre derniers plus le sympathique ».</p>
<div class="lab">Contenu</div><p>Collet-Sicard réunit &#73;X, X, &#88;I et &#88;II. Villaret ajoute la chaîne sympathique cervicale (syndrome de Claude Bernard-Horner).</p>
<div class="lab">Statut</div><p>Aide pédagogique, non critère officiel.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s10143-023-02145-7" target="_blank" rel="noopener">Aguilera-Pena 2023</a> ; <a href="https://doi.org/10.1055/s-0046-1817058" target="_blank" rel="noopener">Choucha 2026</a></p></template>
<template data-pop="g52-parosmie" data-title="Parosmie et fantosmie">
<div class="lab">Définition</div><p>Parosmie : perception déformée en présence d’une odeur. Fantosmie : perception d’une odeur sans stimulus (Consensus européen 2023 ; Macario 2022).</p>
<div class="lab">Application</div><p>La recherche de la parosmie et de la fantosmie fait partie de l’anamnèse. Dans la rhinosinusite chronique, la parosmie est rare ; après un traumatisme, la fantosmie est fréquente (Consensus européen 2023).</p>
<div class="lab">Décision</div><p>Liées à une perte quantitative, elles se traitent comme celle-ci. Une fantosmie d’origine neurologique suspectée fait traiter la maladie sous-jacente avec avis spécialisé.</p>
<div class="lab">Limite</div><p>L’article de la Revue Médicale Suisse (Macario 2022) n’a été lu qu’au résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.4193/Rhin22.483" target="_blank" rel="noopener">Consensus européen 2023</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.798.1837" target="_blank" rel="noopener">Macario 2022</a></p></template>
