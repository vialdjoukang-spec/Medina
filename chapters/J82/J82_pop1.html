<template data-pop="j82-eosino" data-title="Le polynucléaire éosinophile et son compte sanguin"><p>L’éosinophile est un granulocyte de la lignée myéloïde produit dans la moelle osseuse. Moins de 1 % de la population totale circule ; dans le sang, il représente moins de 5 % des leucocytes, le reste résidant dans les tissus, surtout le tube digestif (Jackson, 2022). Une éosinophilie dépasse 0,5 G/L ; une hyperéosinophilie atteint 1,5 G/L (Valent, 2023).</p><p>Le compte chute au cours des infections bactériennes, car les éosinophiles s’accumulent au site inflammatoire et leur sortie médullaire est freinée (Jackson, 2022). Il chute aussi en quelques heures sous glucocorticoïde (Marchand et Cordier, 2006).</p><div class="key"><b>Conséquence.</b> L’hémogramme se prélève avant la corticothérapie ; un compte normal ne dispense pas du lavage lorsque la clinique est évocatrice.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9489126/" target="_blank" rel="noopener">Jackson et al., 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9797433/" target="_blank" rel="noopener">Valent et al., 2023</a>.</p></template>
<template data-pop="j82-negatif" data-title="Le « négatif photographique de l’œdème pulmonaire »"><p>Dans la PCE, les opacités alvéolaires prédominent à la périphérie du poumon. Sur la radiographie, cette distribution réalise le « négatif photographique » de l’œdème pulmonaire aigu : c’est l’image la plus évocatrice de la maladie.</p><p>Elle manque pourtant chez la majorité des patients et n’est pas spécifique : la pneumopathie organisée cryptogénique, la sarcoïdose et les pneumopathies médicamenteuses la reproduisent. Les opacités sont parfois migratrices ; la tomodensitométrie montre souvent un verre dépoli invisible à la radiographie (Marchand et Cordier, 2006).</p><div class="key"><b>Conséquence.</b> L’image oriente mais ne prouve rien ; la formule du lavage tranche.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a>.</p></template>
<template data-pop="j82-lba" data-title="Lavage broncho-alvéolaire : seuils d’éosinophilie"><p>Au cours d’une bronchoscopie, le lavage recueille les cellules alvéolaires et permet des cultures. Une éosinophilie alvéolaire supérieure à 25 % définit la pneumopathie à éosinophiles (Cottin et Cordier, 2005). Dans la PCE, elle varie de 12 à 95 %, avec une moyenne de 58 % ; une valeur d’au moins 40 % soutient le diagnostic en l’absence d’éosinophilie sanguine (Marchand et Cordier, 2006). Dans la PAE, la moyenne était de 54 % dans la série de Philit.</p><p>Le lavage sépare la PCE de la pneumopathie organisée cryptogénique : les éosinophiles dépassent les lymphocytes dans la première, l’inverse dans la seconde. Il dispense de biopsie dans la PAE (Philit, 2002).</p><div class="trap"><span class="k">Piège</span> L’éosinophilie sanguine peut manquer au début d’une PAE ou chez un patient déjà traité par glucocorticoïdes (Cottin et Cordier, 2005) ; le lavage devient alors l’examen décisif.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15932372/" target="_blank" rel="noopener">Cottin et Cordier, 2005</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12403693/" target="_blank" rel="noopener">Philit et al., 2002</a>.</p></template>
<template data-pop="j82-abpa" data-title="Aspergillose bronchopulmonaire allergique"><p>Le champignon <i>Aspergillus fumigatus</i> colonise les bronches d’un patient atteint d’asthme ou de mucoviscidose, plus rarement de bronchectasies ou de BPCO. La réponse immunitaire qu’il déclenche, et non une invasion tissulaire, produit l’éosinophilie, les bouchons muqueux et les bronchectasies (Agarwal, 2024). La maladie est considérée comme un endotype de l’asthme.</p><p>Le groupe de travail de 2024 recommande de rechercher une sensibilisation par IgE spécifiques d’<i>A. fumigatus</i> chez tout asthmatique adulte nouvellement diagnostiqué suivi en centre tertiaire : 25 % sont sensibilisés et environ 37 % des sensibilisés pourraient développer la maladie. La tomodensitométrie en coupes fines classe les patients en forme sérologique, avec bronchectasies, avec bouchons muqueux, avec mucus hyperdense ou avec fibrose pleuropulmonaire chronique. Le mucus hyperdense, plus dense que les muscles paravertébraux sans injection, est pathognomonique.</p><div class="key"><b>Conséquence.</b> Dépistée tôt, la maladie est traitée avant que les bronchectasies ne deviennent irréversibles. Le traitement repose sur la prednisolone ou l’itraconazole ; il est présenté dans l’îlot 9.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., recommandations révisées, Eur Respir J 2024</a>.</p></template>
<template data-pop="j82-gepa" data-title="Granulomatose éosinophilique avec polyangiéite : le versant pulmonaire"><p>La GEPA est une vascularite des petits vaisseaux associée aux ANCA. Elle évolue classiquement en trois phases : une phase « allergique » de plusieurs années, avec asthme et rhinosinusite ; une phase éosinophilique avec atteintes d’organes ; une phase de vascularite, avec mononévrite multiple et glomérulonéphrite. Ces phases se chevauchent souvent (Emmi, 2023).</p><p>L’asthme touche plus de 90 % des patients et la sphère oto-rhino-laryngée 60 à 80 %. Dans une série européenne de 157 patients, l’asthme précédait le diagnostic de 12 ans en moyenne et s’aggravait trois à six mois avant les manifestations systémiques ; une obstruction persistante existait chez 38 % au diagnostic et 46 % en fin de suivi (Cottin, 2016). Les infiltrats pulmonaires, présents chez 40 à 50 %, sont souvent multiples, migrateurs et corticosensibles (Emmi, 2023).</p><div class="key"><b>Conséquence.</b> Un asthme de l’adulte qui s’aggrave avec une éosinophilie impose de chercher nerfs, cœur, peau et rein. Le traitement est détaillé dans le cours M31 — Vascularites systémiques.</div><p class="src">Références : <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27587545/" target="_blank" rel="noopener">Cottin et al., Eur Respir J 2016</a>.</p></template>
<template data-pop="j82-she" data-title="Syndrome hyperéosinophilique"><p>Le SHE associe une hyperéosinophilie d’au moins 1,5 G/L, constatée à deux reprises à au moins deux semaines d’intervalle, et une atteinte d’organe attribuable aux éosinophiles, après exclusion des autres causes. Le groupe de travail de Valent distingue l’hyperéosinophilie familiale, de signification indéterminée, réactive (la plus fréquente : helminthes, maladies inflammatoires, lymphomes T, médicaments) et clonale, où les éosinophiles proviennent d’une hémopathie (Valent, 2023).</p><p>L’atteinte cardiaque, avec thrombus muraux et fibrose endocardique, conduit à une cardiomyopathie restrictive et domine le pronostic ; le poumon est atteint dans 40 % des cas, avec épanchement pleural dans la moitié (Marchand et Cordier, 2006). Une forme clonale avec gène de fusion FIP1L1-PDGFRA répond à l’imatinib, qui obtient une rémission complète chez presque tous les patients (Valent, 2023).</p><div class="key"><b>Conséquence.</b> Une hyperéosinophilie persistante sans cause réactive conduit à l’hématologue, à la recherche de FIP1L1-PDGFRA, à la troponine et à l’échocardiographie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9797433/" target="_blank" rel="noopener">Valent et al., 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a>.</p></template>
<template data-pop="j82-pae-def" data-title="Pneumopathie aiguë à éosinophiles"><p>La PAE est une insuffisance respiratoire fébrile avec opacités diffuses et éosinophilie pulmonaire. Dans la série française de 22 patients, l’âge moyen était de 29 ans ; 14 ont été ventilés et 8 répondaient aux critères du SDRA. Tous ont guéri, 6 sans glucocorticoïdes, et aucun n’a rechuté (Philit, 2002).</p><p>La durée des symptômes est habituellement inférieure à deux semaines ; l’atopie manque, l’épanchement pleural est fréquent et l’éosinophilie sanguine est inférieure à 0,5 G/L chez deux patients sur trois (Marchand et Cordier, 2006). Dans une série de 36 patients, 11 cas étaient liés au tabac : six premiers fumeurs et cinq reprises après abstinence ; ces formes étaient plus jeunes, plus graves et moins souvent éosinophiliques dans le sang (De Giacomi, 2017). Dans une série coréenne de 137 patients, 58 % se présentaient en insuffisance respiratoire aiguë et les symptômes majeurs disparaissaient en trois jours (Rhee, 2013).</p><div class="trap"><span class="k">Piège</span> La PAE est souvent prise pour une pneumonie infectieuse (Cottin, 2023). Une guérison spontanée ne remet pas le diagnostic en cause.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/12403693/" target="_blank" rel="noopener">Philit et al., 2002</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28286263/" target="_blank" rel="noopener">De Giacomi et al., 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22599359/" target="_blank" rel="noopener">Rhee et al., 137 PAE, Eur Respir J 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37055090/" target="_blank" rel="noopener">Cottin, 2023</a>.</p></template>
<template data-pop="j82-pae-duree" data-title="PAE : combien de temps donner le glucocorticoïde ?"><p>La PAE guérit vite et ne rechute pas : une corticothérapie longue n’apporte donc qu’une toxicité. Dans la série française de Philit, 16 patients sur 22 ont guéri sous glucocorticoïdes et 6 sans traitement, ce qui interdit de faire de la réponse au traitement un critère diagnostique (Philit, 2002).</p><p>La seule comparaison de durées retrouvée provient d’une série coréenne de 137 patients publiée dans l’European Respiratory Journal. Les données ont été recueillies prospectivement selon un protocole standardisé, puis analysées rétrospectivement. Sur 127 patients traités, 85 ont reçu deux semaines et 42 quatre semaines de glucocorticoïde. Après ajustement, la résolution de la dyspnée, des symptômes et des anomalies radiologiques ne différait pas ; les auteurs concluent qu’une durée de deux semaines suffit, même en cas d’insuffisance respiratoire (Rhee, 2013).</p><div class="trap"><span class="k">Limite</span> Ce travail n’est pas randomisé et porte sur une population asiatique, surtout liée au tabac. La dose initiale ne figure ni dans son résumé ni dans les autres sources lues ; elle relève de l’avis d’un centre de référence.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22599359/" target="_blank" rel="noopener">Rhee et al., Eur Respir J 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12403693/" target="_blank" rel="noopener">Philit et al., Am J Respir Crit Care Med 2002</a>.</p></template>
<template data-pop="j82-pce-def" data-title="Pneumopathie chronique à éosinophiles (maladie de Carrington)"><p>La PCE idiopathique associe des symptômes respiratoires et généraux subaigus ou chroniques, une éosinophilie alvéolaire ou sanguine et des opacités pulmonaires périphériques. Sa cause est inconnue ; elle n’a aucune atteinte extrathoracique (Marchand et Cordier, 2006).</p><p>Elle touche aussi les voies aériennes : une infiltration éosinophilique sous-muqueuse et un trouble obstructif, parfois sans asthme antérieur, ont été décrits (Marchand, 1998). Sur 53 patients, 41 étaient asthmatiques : l’asthme précédait la PCE chez 26, était contemporain chez 8 et apparaissait 17 mois en moyenne après chez 7 ; il s’aggravait souvent après la PCE (Marchand, 2003).</p><div class="key"><b>Conséquence.</b> La PCE se traite et se surveille comme une maladie chronique des alvéoles et des bronches.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9772920/" target="_blank" rel="noopener">Marchand et al., 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12882444/" target="_blank" rel="noopener">Marchand et al., 2003</a>.</p></template>
<template data-pop="j82-il5" data-title="L’interleukine 5 et son récepteur"><p>L’IL-5 est produite par les lymphocytes Th2, les cellules ILC2 et les mastocytes, en réponse aux allergènes inhalés, aux virus respiratoires et aux polluants. Elle se lie à un récepteur formé d’une chaîne alpha à haute affinité et d’une chaîne bêta commune, active la voie JAK-STAT et favorise la maturation des éosinophiles, leur sortie de la moelle et leur recrutement (Jackson, 2022). C’est aussi un facteur de survie des éosinophiles (Emmi, 2023).</p><div class="key"><b>Conséquence thérapeutique.</b> Le mépolizumab neutralise l’IL-5 ; le benralizumab se fixe sur la chaîne alpha du récepteur et entraîne la destruction des éosinophiles et des basophiles par les cellules NK (Fasenra®).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9489126/" target="_blank" rel="noopener">Jackson et al., 2022</a> ; <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a>.</p></template>
<template data-pop="j82-granules" data-title="Protéines granulaires de l’éosinophile"><p>La protéine basique majeure et la protéine cationique de l’éosinophile sont directement cytotoxiques pour les cellules épithéliales et endothéliales ; la peroxydase produit des espèces réactives de l’oxygène (Jackson, 2022). Associée à l’IL-1β ou au TGF-β, la protéine basique majeure augmente la libération par les fibroblastes de cytokines fibrogènes (Previtero, 2026).</p><p>Des dépôts extracellulaires étendus de ces protéines suffisent à définir une hyperéosinophilie tissulaire, même lorsque les éosinophiles intacts ont disparu (Valent, 2023).</p><div class="key"><b>Conséquence.</b> La lésion persiste là où les éosinophiles ont dégranulé ; une biopsie pauvre en cellules n’exclut pas leur rôle.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9489126/" target="_blank" rel="noopener">Jackson et al., 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13343205/" target="_blank" rel="noopener">Previtero et al., 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9797433/" target="_blank" rel="noopener">Valent et al., 2023</a>.</p></template>
<template data-pop="j82-fibrose" data-title="PCE fibrosante : un concept de 2026"><p>La PCE fibrosante désigne une PCE dont les lésions fibreuses (réticulations, bronchectasies de traction, distorsion architecturale, parfois rayon de miel) persistent après la résolution des opacités inflammatoires. Dans une cohorte de 62 patients de la Mayo Clinic, 37 % ont développé une fibrose, dans les deux ans chez environ 78 % d’entre eux ; 70 % des aspects n’étaient pas de type UIP. L’âge avancé et le sexe masculin prédisaient la fibrose ; l’asthme semblait protecteur (Previtero, 2026).</p><p>Avant de retenir ce diagnostic, le médecin exclut une pneumopathie d’hypersensibilité fibrosante, une granulomatose éosinophilique et une cause médicamenteuse. Les antifibrosants, efficaces dans les pneumopathies interstitielles fibrosantes progressives, ont rarement été étudiés dans les maladies éosinophiliques ; la revue propose de les envisager en cas de fibrose établie ou progressive.</p><div class="key"><b>Conséquence.</b> Des réticulations qui persistent après la résolution des opacités font évoquer une forme fibrosante, surtout chez l’homme âgé non asthmatique.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13343205/" target="_blank" rel="noopener">Previtero et al., Eur Respir Rev 2026</a>.</p></template>
<template data-pop="j82-medicaments" data-title="Médicaments responsables"><p>Les médicaments le plus souvent en cause sont les anti-inflammatoires non stéroïdiens, dont les salicylés des maladies inflammatoires de l’intestin comme la sulfasalazine, et des antibiotiques comme la minocycline et le cotrimoxazole (Marchand et Cordier, 2006). L’information professionnelle suisse de la daptomycine décrit une pneumopathie à éosinophiles débutant deux à quatre semaines après le début du traitement ; elle impose l’arrêt et demande d’éviter toute réexposition. Celle du dupilumab rapporte des pneumonies à éosinophiles et des vascularites de granulomatose éosinophilique. Les drogues illicites doivent être recherchées (Cottin, 2025).</p><div class="key"><b>Conséquence.</b> L’arrêt du médicament est le premier traitement ; la réexposition est évitée.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41110928/" target="_blank" rel="noopener">Cottin, 2025</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Cubicin® (11.2022) et Dupixent® (01.2025)</a>.</p></template>
<template data-pop="j82-tabac" data-title="Tabac et pneumopathie aiguë à éosinophiles"><p>Dans la série de la Mayo Clinic, 11 PAE sur 36 étaient liées au tabac : six chez des personnes qui fumaient pour la première fois, cinq chez d’anciens fumeurs qui avaient repris. L’âge médian était de 22 ans, contre 47,5 ans pour les formes médicamenteuses et 55 ans pour les formes idiopathiques. Ces formes étaient plus graves et moins souvent éosinophiliques dans le sang (De Giacomi, 2017). Dans la série de Rhee, la majorité des patients avaient modifié leur consommation 17 jours en médiane avant la maladie (Rhee, 2013). À l’inverse, moins de 10 % des patients atteints de PCE fument (Marchand et Cordier, 2006).</p><div class="key"><b>Conséquence.</b> L’interrogatoire date la première cigarette ou la reprise ; l’arrêt définitif fait partie du traitement (Cottin, 2025).</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28286263/" target="_blank" rel="noopener">De Giacomi et al., 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22599359/" target="_blank" rel="noopener">Rhee et al., 137 PAE, Eur Respir J 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41110928/" target="_blank" rel="noopener">Cottin, 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a>.</p></template>
<template data-pop="j82-parasites" data-title="Helminthes et éosinophilie pulmonaire"><p>Les infections parasitaires associées à une éosinophilie et à des infiltrats, souvent transitoires, sont dues à <i>Ascaris lumbricoides</i>, <i>Toxocara canis</i>, <i>Taenia saginata</i>, <i>Trichinella spiralis</i> et <i>Fasciola hepatica</i>. Après un séjour tropical s’y ajoutent <i>Strongyloides stercoralis</i>, les filaires <i>Wuchereria bancrofti</i> et <i>Brugia malayi</i> et les schistosomes (Marchand et Cordier, 2006). Chez les réfugiés, les requérants d’asile et les personnes venues de régions tropicales, l’équipe des Hôpitaux universitaires de Genève retrouve surtout strongyloïdose, ankylostomiase et schistosomiase (Cordaillat, 2025).</p><p>Une ascaridiose pulmonaire a été décrite en Autriche sans voyage récent : sérologie positive, selles négatives, guérison sous albendazole ou mébendazole (Hoenigl, 2010).</p><div class="key"><b>Conséquence.</b> Sérologies et trois examens de selles précèdent toute corticothérapie chez un patient exposé ; le traitement antiparasitaire fait disparaître l’éosinophilie dans la plupart des cas.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40313018/" target="_blank" rel="noopener">Cordaillat et al., 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20924692/" target="_blank" rel="noopener">Hoenigl et al., 2010</a>.</p></template>
<template data-pop="j82-montelukast" data-title="Montélukast et granulomatose éosinophilique : un débat"><p>L’association entre antagonistes des récepteurs des leucotriènes et granulomatose éosinophilique est connue depuis plusieurs années ; leur rôle pathogène direct reste discuté. Une observation bâloise décrit un asthmatique qui a développé, après deux expositions successives au montélukast, une obstruction sévère, une hyperéosinophilie, des infiltrats diffus et une myocardite ; la biopsie pulmonaire a confirmé la maladie, guérie sous méthylprednisolone et cyclophosphamide. La chronologie suggérait un rôle causal (Conen, 2004).</p><div class="key"><b>Lecture.</b> Une observation ne prouve pas la causalité. Elle invite à rechercher une éosinophilie et une atteinte systémique lorsque l’asthme d’un patient sous montélukast se complique.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/15340881/" target="_blank" rel="noopener">Conen et al., Swiss Med Wkly 2004</a>.</p></template>
<template data-pop="j82-asthme" data-title="L’asthme, terrain et signal d’alarme"><p>L’asthme accompagne la PCE chez un tiers à la moitié des patients, la granulomatose éosinophilique dans plus de 90 % des cas et la plupart des aspergilloses bronchopulmonaires allergiques, dont l’autre terrain principal est la mucoviscidose (Agarwal, 2024). Dans la granulomatose, il s’aggrave trois à six mois avant les manifestations systémiques, malgré les corticostéroïdes inhalés et oraux (Cottin, 2016). La bronchiolite oblitérante hyperéosinophilique, décrite à Lyon, se présente comme une obstruction sévère sans les caractères habituels de l’asthme, avec plus de 1 G/L éosinophiles ou plus de 25 % au lavage (Cordier, 2013).</p><div class="key"><b>Conséquence.</b> Un asthme qui s’aggrave chez l’adulte justifie un hémogramme, des IgE spécifiques d’<i>A. fumigatus</i> et un examen extrathoracique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27587545/" target="_blank" rel="noopener">Cottin et al., 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23258778/" target="_blank" rel="noopener">Cordier et al., Eur Respir J 2013</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., 2024</a>.</p></template>
<template data-pop="j82-voyage" data-title="Origine et séjours tropicaux"><p><i>Strongyloides stercoralis</i> infecte 6,9 % à plus de 30 % de la population des pays tropicaux et subtropicaux, soit environ 614 millions de personnes ; une transmission autochtone existe aussi au nord du bassin méditerranéen. L’algorithme genevois et bâlois situe le pays d’origine sur une carte de prévalence ; il classe à haut risque, quelle que soit son origine, tout patient ayant séjourné plus de quatre semaines consécutives dans un pays de forte endémie (Carnino, 2021). Chez un réfugié ou un requérant d’asile, une éosinophilie supérieure à 0,5 G/L traduit souvent une helminthiase, même sans symptôme (Cordaillat, 2025).</p><div class="key"><b>Conséquence.</b> La question « où êtes-vous né, où avez-vous vécu ? » précède toute prescription de glucocorticoïde.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8704417/" target="_blank" rel="noopener">Carnino et al., 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40313018/" target="_blank" rel="noopener">Cordaillat et al., 2025</a>.</p></template>
<template data-pop="j82-hypoxemie" data-title="Hypoxémie : mesurer la gravité"><p>Dans la PCE, les gaz du sang montrent habituellement une hypoxémie légère à modérée, et la ventilation mécanique est très rare (Marchand et Cordier, 2006). Dans la PAE, l’hypoxémie est profonde : rapport PaO₂/FiO₂ moyen de 156 dans la série de Philit, 14 patients ventilés sur 22, 8 SDRA.</p><div class="key"><b>Conséquence.</b> Une hypoxémie profonde chez un patient éosinophilique oriente vers une PAE et impose une surveillance où la ventilation est possible.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12403693/" target="_blank" rel="noopener">Philit et al., 2002</a>.</p></template>
<template data-pop="j82-neuro" data-title="Neuropathie de la granulomatose éosinophilique"><p>La neuropathie périphérique touche 50 à 70 % des patients. Elle prend la forme d’une mononévrite multiple, le plus souvent sensitive mais parfois motrice, avec une atteinte axonale à l’électroneuromyographie. Elle est plus fréquente chez les patients porteurs d’ANCA anti-MPO (Emmi, 2023).</p><div class="key"><b>Conséquence.</b> Une neuropathie périphérique fait partie des manifestations sévères qui orientent l’induction vers un immunosuppresseur, en plus des critères du score à cinq facteurs.</div><p class="src">Référence : <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a>.</p></template>
<template data-pop="j82-coeur" data-title="Le cœur, organe du pronostic"><p>Dans la granulomatose éosinophilique, myocardite et péricardite sont plus fréquentes chez les patients sans ANCA et s’associent à une survie moins bonne. Une échocardiographie et un ECG périodiques sont recommandés chez tous ; l’IRM cardiaque est réservée aux cardiomyopathies avérées (Emmi, 2023). Une atteinte cardiaque peut mimer un syndrome coronarien aigu : la formule leucocytaire révèle alors l’hyperéosinophilie (Rigamonti, 2012).</p><p>Dans le syndrome hyperéosinophilique, thrombus muraux et fibrose endocardique conduisent à une cardiomyopathie restrictive (Marchand et Cordier, 2006). Avant l’imatinib, l’information Glivec® recommande d’envisager troponine et échocardiographie.</p><div class="key"><b>Conséquence.</b> Troponine, ECG et échocardiographie font partie du bilan initial de toute éosinophilie pulmonaire avec signe systémique.</div><p class="src">Références : <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22430939/" target="_blank" rel="noopener">Rigamonti et al., Swiss Med Wkly 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a>.</p></template>
<template data-pop="j82-tdm" data-title="Tomodensitométrie : un aspect par entité"><p>La tomodensitométrie montre mieux que la radiographie la distribution des opacités (Jeong, 2007). PCE : condensations non systématisées à prédominance périphérique, parfois migratrices, avec verre dépoli et parfois adénopathies médiastinales. PAE : aspect d’œdème hydrostatique, épanchements fréquents. Syndrome de Löffler et syndrome hyperéosinophilique : nodules entourés d’un halo en verre dépoli. Aspergillose : bronchectasies proximales bilatérales, bouchons muqueux, mucus hyperdense en coupes fines de 1,25 à 1,5 mm (Agarwal, 2024). Granulomatose éosinophilique : condensations sous-pleurales, nodules centrolobulaires, épaississement des parois bronchiques et des septums.</p><div class="key"><b>Conséquence.</b> Une tomodensitométrie en coupes fines est demandée chez tout patient ; la distribution des lésions oriente vers l’entité avant même le lavage.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17495282/" target="_blank" rel="noopener">Jeong et al., 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., 2024</a>.</p></template>
<template data-pop="j82-serostrongy" data-title="Dépister la strongyloïdose"><p>Aucun examen n’est une référence absolue. La sérologie, sensible à 85 à 90 % selon le fabricant, est l’outil de dépistage ; sa spécificité baisse par réactions croisées avec d’autres helminthes, et sa sensibilité diminue sous immunosuppression. Les techniques de concentration dédiées, Baermann et culture sur gélose, atteignent chacune 60 % de sensibilité et 77 % combinées ; la PCR des selles serait plus sensible (Carnino, 2021).</p><p>L’algorithme des Hôpitaux universitaires de Genève et de l’Institut tropical et de santé publique suisse combine sérologie et examens directs chez l’immunodéprimé. Chez un migrant, trois examens de selles et une sérologie sont idéaux, mais une approche simplifiée est souvent nécessaire (Cordaillat, 2025).</p><div class="trap"><span class="k">Piège</span> Une sérologie négative isolée chez un patient déjà immunodéprimé reste douteuse.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8704417/" target="_blank" rel="noopener">Carnino et al., 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40313018/" target="_blank" rel="noopener">Cordaillat et al., 2025</a>.</p></template>
<template data-pop="j82-ige" data-title="IgE totales, IgE et IgG spécifiques d’Aspergillus"><p>Les IgE spécifiques d’<i>A. fumigatus</i>, au seuil de 0,35 kUA/L, dépistent la sensibilisation avec une sensibilité de 99 à 100 %, supérieure au test cutané (88 à 94 %). Les IgE totales sont plus sensibles au seuil de 500 UI/mL qu’au seuil historique de 1000 UI/mL (98 % contre 91 %). Les IgG spécifiques se mesurent par immunoessai ou test rapide ; leur seuil dépend de la population (Agarwal, 2024).</p><p>Pour le suivi, seules les IgE totales servent : une baisse d’au moins 20 % témoigne de la réponse, une hausse d’au moins 50 % accompagne l’exacerbation. Les IgE et IgG spécifiques ne mesurent pas la réponse. Dans la PCE, les IgE totales sont élevées chez environ la moitié des patients, reflet du terrain atopique (Marchand et Cordier, 2006).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a>.</p></template>
<template data-pop="j82-anca" data-title="ANCA dans la granulomatose éosinophilique"><p>L’immunofluorescence indirecte distingue un aspect cytoplasmique et un aspect périnucléaire ; la référence est l’immunoessai anti-PR3 et anti-MPO. Les ANCA sont présents chez 30 à 40 % des patients, surtout anti-MPO ; un aspect périnucléaire sans anti-MPO se voit aussi dans des maladies non vascularitiques, comme les maladies inflammatoires de l’intestin. Les ANCA sont habituellement absents des maladies éosinophiliques primitives (Emmi, 2023).</p><p>Les patients anti-MPO ont plus souvent glomérulonéphrite, neuropathie et purpura ; les patients sans ANCA, plus souvent cardiomyopathie et atteinte pulmonaire. Les rares formes anti-PR3 ressemblent davantage à la granulomatose avec polyangéite. Le statut ANCA ne dicte pas le choix du traitement.</p><div class="trap"><span class="k">Piège</span> Des ANCA négatifs n’excluent pas la maladie : ils manquent chez 60 à 70 % des patients.</div><p class="src">Référence : <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a>.</p></template>
<template data-pop="j82-pocr" data-title="Pneumopathie organisée cryptogénique : le principal diagnostic différentiel"><p>La pneumopathie organisée cryptogénique partage avec la PCE la présentation clinique et l’imagerie. Elle s’en distingue par l’absence d’éosinophilie sanguine et par un lavage où les lymphocytes dépassent les éosinophiles (Marchand et Cordier, 2006). Des foyers de pneumopathie organisée existent toutefois dans les biopsies de PCE. Après une radiothérapie mammaire, l’une ou l’autre peut apparaître ; la PCE survient surtout chez les patientes asthmatiques ou atopiques (Cottin, 2004).</p><div class="key"><b>Conséquence.</b> Devant des condensations périphériques corticosensibles, la formule du lavage nomme la maladie et prévoit le risque de rechute.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/14738224/" target="_blank" rel="noopener">Cottin et al., 2004</a>.</p></template>
<template data-pop="j82-ffs" data-title="Score à cinq facteurs"><p>Ce score pronostique, nommé Five Factor Score, prédit la mortalité de la granulomatose éosinophilique, de la périartérite noueuse, de la polyangéite microscopique et de la granulomatose avec polyangéite. Sa version originale retient cinq facteurs : créatinine supérieure à 1,58 mg/dL, protéinurie supérieure à 1 g par jour, cardiomyopathie, atteinte digestive et atteinte du système nerveux central. La version révisée ajoute l’âge de plus de 65 ans comme facteur défavorable et l’atteinte oto-rhino-laryngée comme facteur favorable, et retire l’atteinte du système nerveux central ; la plupart des études thérapeutiques utilisent la version originale (Emmi, 2023).</p><div class="key"><b>Conséquence.</b> Un facteur présent, ou une neuropathie périphérique, une hémorragie alvéolaire, une ischémie mésentérique ou digitale ou une atteinte oculaire, définit une forme sévère qui reçoit cyclophosphamide ou rituximab en plus du glucocorticoïde.</div><p class="src">Référence : <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a>.</p></template>
<template data-pop="j82-strongy" data-title="Hyperinfection à Strongyloides"><p><i>Strongyloides stercoralis</i> entretient chez l’homme une infection chronique silencieuse par auto-infection. Sous glucocorticoïdes, chimiothérapie, biothérapie ou infection par le HTLV-1, la reproduction larvaire s’amplifie : hyperinfection, puis dissémination, de mortalité élevée sans traitement. La plupart des formes graves sont rapportées dans les pays non endémiques, chez des personnes exposées autrefois (Carnino, 2021). L’information professionnelle de Solu-Medrol® décrit l’entérocolite grave et le sepsis à germes Gram négatif qui l’accompagnent souvent.</p><div class="key"><b>Conséquence.</b> Chez un patient à risque, l’ivermectine 200 µg/kg est donnée si un test est positif, ou empiriquement si l’urgence ne permet pas d’attendre les résultats.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8704417/" target="_blank" rel="noopener">Carnino et al., 2021</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Solu-Medrol® (08.2025)</a>.</p></template>
<template data-pop="j82-csi" data-title="Corticostéroïdes inhalés : utiles, mais pas seuls"><p>Dans la PCE, les corticostéroïdes inhalés ont été proposés pour prévenir les rechutes : les asthmatiques, traités plus souvent par voie inhalée au long cours (88 % contre 31 %), rechutaient moins (Marchand, 2003). Dans la granulomatose éosinophilique, l’association d’un corticostéroïde inhalé à forte dose et d’un bronchodilatateur de longue durée d’action contrôle l’asthme en complément du traitement systémique (Emmi, 2023). Dans l’aspergillose aiguë, en revanche, les fortes doses inhalées seules n’obtiennent ni contrôle immunologique ni baisse des exacerbations (Agarwal, 2024).</p><div class="trap"><span class="k">Piège</span> La fluticasone et le budésonide inhalés, associés à l’itraconazole, peuvent provoquer un syndrome de Cushing (Sporanox®).</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/12882444/" target="_blank" rel="noopener">Marchand et al., 2003</a> ; <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., 2024</a>.</p></template>
<template data-pop="j82-contentieux-duree" data-title="Contentieux : combien de temps traiter une PCE ?"><p><b>Position 1.</b> La revue de Marchand et Cordier (2006) indique qu’il n’existe pas de consensus et que la plupart des auteurs recommandent 0,5 à 1 mg/kg de prednisone, avec une décroissance progressive, pour une durée totale de 6 à 12 mois.</p><p><b>Position 2.</b> La série de 62 patients du même groupe (1998) observait qu’un traitement plus long ne protégeait pas des rechutes ; elle proposait de tenter le sevrage après 6 mois chez les patients sans asthme sévère, puisque les rechutes restent corticosensibles.</p><p><b>Arbitrage.</b> Aucune recommandation suisse ou européenne plus récente ne tranche. Les deux textes, compatibles, sont retenus : 6 mois au minimum, prolongation jusqu’à 12 mois si l’asthme est sévère ou si la décroissance échoue. Le texte de 2006 est le plus récent.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006 (texte en vigueur retenu)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9772920/" target="_blank" rel="noopener">Marchand et al., 1998</a>.</p></template>
<template data-pop="j82-contentieux-mepo" data-title="Contentieux : mépolizumab 100 ou 300 mg dans la granulomatose éosinophilique ?"><p><b>Position 1.</b> L’information professionnelle suisse de Nucala® (mise à jour 12.2025) fixe la dose à 300 mg sous-cutanés toutes les 4 semaines, dose de l’essai MIRRA ; elle précise qu’aucune étude de recherche de dose propre à la maladie n’a été menée.</p><p><b>Position 2.</b> La recommandation européenne d’Emmi (2023) rappelle que des cohortes rétrospectives ont trouvé 100 mg aussi efficaces, surtout sur les manifestations respiratoires, et propose d’envisager 100 mg dans les formes respiratoires limitées, avec augmentation à 300 mg si la réponse est insuffisante.</p><p><b>Arbitrage.</b> La source primaire applicable la plus récente est l’information professionnelle suisse : 300 mg reste la dose de référence. La dose de 100 mg est un choix hors posologie autorisée, réservé à un centre expérimenté et documenté dans le dossier.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Nucala®, Swissmedic (12.2025), texte en vigueur retenu</a> ; <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a>.</p></template>
<template data-pop="j82-efr" data-title="Épreuves fonctionnelles respiratoires"><p>Dans la PCE, le trouble est restrictif ou obstructif, l’obstruction prédominant chez les asthmatiques ; la spirométrie est normale chez jusqu’à un tiers des patients. La DLCO est souvent abaissée et le KCO l’est chez jusqu’à un quart (Marchand et Cordier, 2006). L’obstruction est fréquente dans l’aspergillose, la PCE, la granulomatose éosinophilique et la bronchiolite hyperéosinophilique (Cottin, 2023). Dans l’aspergillose, une variation du VEMS de 158 mL représente la plus petite différence cliniquement importante (Agarwal, 2024).</p><div class="key"><b>Conséquence.</b> Les épreuves fonctionnelles se répètent pendant le suivi : elles détectent l’asthme sévère et l’obstruction fixée qui compliquent ces maladies.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37055090/" target="_blank" rel="noopener">Cottin, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., 2024</a>.</p></template>
<template data-pop="j82-mandara" data-title="Essais MIRRA et MANDARA"><p><b>MIRRA (2017).</b> Chez 136 patients atteints de granulomatose éosinophilique récidivante ou réfractaire, sans atteinte menaçante, le mépolizumab 300 mg toutes les 4 semaines a permis au moins 24 semaines de rémission chez 28 % des patients contre 3 % sous placebo ; 56 % contre 82 % ont rechuté en un an (rapport de risques 0,32).</p><p><b>MANDARA (2024).</b> Chez 140 patients comparables, le benralizumab 30 mg toutes les 4 semaines a obtenu une rémission aux semaines 36 et 48 chez 59 % contre 56 % sous mépolizumab : il est non inférieur, non supérieur. Les glucocorticoïdes oraux ont été arrêtés chez 41 % contre 26 % ; des effets indésirables graves sont survenus chez 6 % contre 13 %.</p><div class="key"><b>Lecture.</b> Les deux anticorps sont des options équivalentes dans cette indication ; aucun n’a été étudié dans les formes menaçant un organe.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5548295/" target="_blank" rel="noopener">Wechsler et al., MIRRA, 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38393328/" target="_blank" rel="noopener">Wechsler et al., MANDARA, 2024</a>.</p></template>
<template data-pop="j82-dupilumab" data-title="Dupilumab et éosinophilie"><p>Le dupilumab bloque la voie de l’IL-4 et de l’IL-13. Son information professionnelle suisse rapporte des pneumonies à éosinophiles et des vascularites de granulomatose éosinophilique, surtout chez des patients asthmatiques ou atteints de polypose nasosinusienne, parfois en lien avec la réduction de la corticothérapie orale, ainsi que des hyperéosinophilies systémiques graves. Une hausse transitoire et sans conséquence des éosinophiles sanguins est habituelle ; une pneumonie à éosinophiles sous dupilumab paraît plutôt idiosyncrasique, et la prudence s’impose en cas d’hyperéosinophilie (Previtero, 2026).</p><div class="key"><b>Conséquence.</b> Sous dupilumab, une aggravation respiratoire, un purpura, une neuropathie ou un signe cardiaque font contrôler l’hémogramme et rechercher une vascularite.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Dupixent® (01.2025)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13343205/" target="_blank" rel="noopener">Previtero et al., 2026</a>.</p></template>
