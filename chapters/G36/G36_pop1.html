<template data-pop="g36-nmosd" data-title="NMOSD : définition et périmètre">
<div class="lab">Définition</div><p>« NMOSD » est un terme parapluie. Il couvre la neuromyélite optique avec anticorps anti-aquaporine 4, ses formes frustes et des syndromes apparentés sans ces anticorps. L’inflammation touche les nerfs optiques et la moelle, moins souvent le tronc cérébral.</p><div class="lab">Pourquoi une entité distincte</div><p>Les experts européens la considèrent comme une maladie propre : son immunopathogenèse (astrocytopathie), sa clinique, son traitement et son pronostic diffèrent de la sclérose en plaques. Cette distinction a une conséquence thérapeutique directe, puisque plusieurs traitements de la sclérose en plaques aggravent la NMOSD.</p><div class="lab">Limite</div><p>Les patients sans anticorps anti-aquaporine 4 qui remplissent les critères de la MOGAD ne doivent plus recevoir le diagnostic de NMOSD ; le terme « NMOSD séronégative » ne vaut qu’après exclusion des anticorps anti-MOG.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-mogad" data-title="MOGAD : définition et périmètre">
<div class="lab">Définition</div><p>La maladie associée aux anticorps dirigés contre la glycoprotéine oligodendrocytaire de la myéline est une entité distincte de la sclérose en plaques et de la NMOSD avec anticorps anti-aquaporine 4.</p><div class="lab">Présentations</div><p>Les phénotypes sont l’encéphalomyélite aiguë disséminée, la névrite optique et la myélite transverse ; l’encéphalite corticale et l’atteinte du tronc ou du cervelet sont moins fréquentes. L’œdème papillaire est typique. Environ la moitié des patients sont monophasiques ; la névrite optique récidive chez 30 à 50 % d’entre eux.</p><div class="lab">Limite</div><p>Aucun rattachement précis de la MOGAD à un code de la CIM-10-GM 2024 n’a été trouvé dans les sources lues (G36.8 ou G37.8). Le texte original des critères de 2023 n’a pas été lu ; ils l’ont été via une revue.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(22)00431-8" target="_blank" rel="noopener">Critères MOGAD 2023 (Banwell et al., Lancet Neurol 2023, résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10165591/" target="_blank" rel="noopener">Revue narrative sur la MOGAD (J Neurol 2023)</a>.</p></template>
<template data-pop="g36-hurst" data-title="Leucoencéphalite hémorragique aiguë (Hurst)">
<div class="lab">Définition</div><p>La leucoencéphalite hémorragique aiguë est la forme la plus sévère de l’encéphalomyélite aiguë disséminée. Elle est codée G36.1.</p><div class="lab">Histologie</div><p>On observe une démyélinisation périveineuse, une nécrose fibrinoïde, de petites hémorragies périvasculaires et un infiltrat à prédominance neutrophile. L’hypothèse principale est un mimétisme moléculaire à la suite d’une infection.</p><div class="lab">Clinique</div><p>Un prodrome viral des voies aériennes supérieures est présent chez environ un tiers des patients. Le début survient 2 jours à 2 semaines plus tard : céphalées, fièvre, photophobie, raideur de nuque, confusion puis coma en 4 à 10 jours. Un début subaigu de trois semaines ou plus n’existe que dans 6 % des cas.</p><div class="lab">Pronostic</div><p>La mortalité est d’environ 58 % et la survie médiane de 2 jours dans une revue de 152 cas ; les revues divergent (environ 50 ou 70 %). Un score de Glasgow inférieur à 12, une altération de la conscience et un signe de Babinski sont associés à un mauvais pronostic.</p><div class="lab">Limite</div><p>Les sources sont des revues narratives et systématiques, non européennes ; aucun essai contrôlé n’existe, aucune recommandation européenne n’a été lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9681543/" target="_blank" rel="noopener">Revue de la leucoencéphalite hémorragique aiguë (Alromaihi, Biomed Res Int 2022)</a> ; <a href="https://doi.org/10.3389/fnins.2025.1557046" target="_blank" rel="noopener">Leucoencéphalite hémorragique à début graduel (Sannes et al., Front Neurosci 2025, résumé)</a> ; <a href="https://doi.org/10.1007/s10072-024-07715-1" target="_blank" rel="noopener">Revue systématique de la leucoencéphalite hémorragique (Tan et al., Neurol Sci 2024, résumé)</a>.</p></template>
<template data-pop="g36-adem" data-title="Encéphalomyélite aiguë disséminée : rattachement et distinction">
<div class="lab">Rattachement</div><p>Dans la CIM-10-GM 2024, G37.8 inclut l’encéphalomyélite démyélinisante aiguë (ADEM) ; G04.0 désigne l’encéphalite aiguë disséminée, y compris post-vaccinale (avec le code du vaccin en complément) ; G04.8 l’encéphalomyélite postinfectieuse sans précision. Aucun de ces codes n’est G36.</p><div class="lab">Distinction avec la leucoencéphalite hémorragique</div><p>L’encéphalomyélite aiguë disséminée est plutôt pédiatrique, avec moins d’œdème et d’hémorragies et un liquide cérébro-spinal lymphocytaire. La leucoencéphalite hémorragique en est la forme la plus sévère.</p><div class="lab">Lien avec la MOGAD</div><p>L’encéphalomyélite aiguë disséminée est la présentation la plus fréquente de la MOGAD chez le jeune enfant, et des anticorps anti-MOG sont retrouvés chez jusqu’à la moitié des enfants qui en sont atteints.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g35-g37.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G35–G37 (BfArM)</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G00–G09 (BfArM)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10165591/" target="_blank" rel="noopener">Revue narrative sur la MOGAD (J Neurol 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9681543/" target="_blank" rel="noopener">Revue de la leucoencéphalite hémorragique aiguë (Alromaihi, Biomed Res Int 2022)</a>.</p></template>
<template data-pop="g36-aqp4" data-title="Aquaporine 4 : un canal astrocytaire">
<div class="lab">Normal</div><p>L’aquaporine 4 est un canal hydrique exprimé essentiellement par les astrocytes du système nerveux central.</p><div class="lab">Pathologique</div><p>Dans la NMOSD, les anticorps dirigés contre l’aquaporine 4 lèsent directement l’astrocyte, puis les oligodendrocytes et les neurones. La démyélinisation et la perte axonale sont secondaires : la NMOSD est une astrocytopathie.</p><div class="lab">Conséquence clinique</div><p>Les anticorps anti-aquaporine 4 sont le marqueur diagnostique. Ils se recherchent dans le sérum par un test cellulaire.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680676170011" target="_blank" rel="noopener">Information professionnelle suisse Enspryng®</a>.</p></template>
<template data-pop="g36-complement" data-title="Complément terminal et anti-C5">
<div class="lab">Mécanisme</div><p>Les anticorps anti-aquaporine 4 activent sans frein le complément terminal. L’inflammation dépend du complexe d’attaque membranaire et de C5a. Il en résulte la nécrose des astrocytes, une perméabilité accrue de la barrière hémato-encéphalique et des lésions gliales et neuronales voisines.</p><div class="lab">Traitement</div><p>L’éculizumab et le ravulizumab bloquent le composant C5. Les recommandations européennes leur attribuent la plus grande efficacité relative (++++).</p><div class="lab">Risque</div><p>Le blocage de C5 impose une vaccination antiméningococcique et fait de toute fièvre avec céphalées ou raideur de nuque une urgence. La vaccination peut elle-même suractiver le complément et déclencher une poussée.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680672780016" target="_blank" rel="noopener">Information professionnelle suisse Ultomiris®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680592820014" target="_blank" rel="noopener">Information professionnelle suisse Soliris®</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770020/" target="_blank" rel="noopener">NEMOS 2024, deuxième partie : traitement de la poussée et traitement de fond (Kümpfel et al., J Neurol 2024)</a>.</p></template>
<template data-pop="g36-il6" data-title="Interleukine 6 et satralizumab">
<div class="lab">Mécanisme</div><p>L’interleukine 6 est élevée dans le liquide cérébro-spinal et le sérum en phase active. Elle favorise la différenciation des lymphocytes B en plasmocytes, la production des auto-anticorps anti-aquaporine 4, l’activation des lymphocytes Th17 et la perméabilité de la barrière hémato-encéphalique.</p><div class="lab">Traitement</div><p>Le satralizumab bloque ce signal. Il est approuvé en Suisse pour l’adulte et l’adolescent.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680676170011" target="_blank" rel="noopener">Information professionnelle suisse Enspryng®</a>.</p></template>
<template data-pop="g36-autoimmunite" data-title="Auto-immunité associée à la NMOSD">
<div class="lab">Fréquence</div><p>Une maladie auto-immune coexiste chez 25 à 40 % des patients avec anticorps anti-aquaporine 4 : lupus érythémateux disséminé, syndrome de Sjögren, syndrome des antiphospholipides, syndrome de Sharp, myasthénie, maladie cœliaque, thyroïdite.</p><div class="lab">Conduite</div><p>Cette association n’exclut pas la NMOSD ; elle ne doit pas conduire à rattacher les lésions du système nerveux à la maladie auto-immune seule. Une néoplasie est rare, sans dépistage invasif systématique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-nevrite" data-title="Névrite optique">
<div class="lab">Signes</div><p>Vision floue, baisse d’acuité, douleur aux mouvements oculaires, déficit pupillaire afférent relatif, atteinte du champ visuel, désaturation des couleurs.</p><div class="lab">Orientation</div><p>Une perte visuelle sévère (inférieure à 20/200) est fréquente dans la NMOSD avec anticorps anti-aquaporine 4 et rare dans la sclérose en plaques. La névrite est bilatérale d’emblée chez environ 15 % des patients avec anticorps anti-aquaporine 4. L’œdème papillaire est typique de la MOGAD.</p><div class="lab">Erreur fréquente</div><p>Se fier à la douleur oculaire pour exclure la NMOSD : elle est commune à toutes les névrites.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10165591/" target="_blank" rel="noopener">Revue narrative sur la MOGAD (J Neurol 2023)</a>.</p></template>
<template data-pop="g36-myelite" data-title="Myélite transverse aiguë et lésion longitudinale étendue">
<div class="lab">Définition</div><p>La myélite transverse aiguë est le second syndrome cardinal de la NMOSD. Sa lésion typique est longitudinale étendue (LETM) : trois segments vertébraux contigus ou plus.</p><div class="lab">Application</div><p>Une lésion plus courte n’exclut pas le diagnostic : des lésions courtes existent dans 10 à 15 % des poussées de NMOSD et jusqu’à 50 % des MOGAD. À l’inverse, les lésions de la sclérose en plaques sont courtes et périphériques.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-area" data-title="Syndrome de l’area postrema">
<div class="lab">Définition</div><p>Hoquet, nausées et vomissements durant au moins 48 heures, ou moins longtemps si une lésion est visible à l’IRM.</p><div class="lab">Application</div><p>Ce syndrome fait partie des six caractéristiques cardinales de la NMOSD. Pour les critères de 2015, la lésion exigée est médullaire dorsale. Le hoquet persistant est évocateur et ne doit pas être attribué à une cause digestive sans examen neurologique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-diencephale" data-title="Atteinte diencéphalique">
<div class="lab">Signes</div><p>Hypersomnolence ou syndrome de sécrétion inappropriée d’hormone antidiurétique. Les symptômes extra-opticospinaux ne sont présents au début que chez environ 4 % des patients dans une cohorte allemande.</p><div class="lab">Application</div><p>La narcolepsie symptomatique ou le syndrome diencéphalique avec lésion typique compte parmi les six caractéristiques cardinales.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-crit2015" data-title="Critères de 2015 de la NMOSD : détail">
<div class="lab">Caractéristiques cardinales</div><p>(1) Névrite optique ; (2) myélite aiguë ; (3) syndrome de l’area postrema ; (4) autre syndrome aigu du tronc cérébral ; (5) narcolepsie symptomatique ou syndrome diencéphalique avec lésion typique à l’IRM ; (6) syndrome cérébral aigu avec lésion typique.</p><div class="lab">Avec anticorps anti-aquaporine 4</div><p>Au moins une caractéristique cardinale et exclusion des diagnostics alternatifs.</p><div class="lab">Sans anticorps ou statut inconnu</div><p>Au moins deux caractéristiques cardinales, avec dissémination spatiale, dont au moins une parmi névrite optique, myélite longitudinale étendue ou syndrome de l’area postrema. Exigences d’imagerie : névrite optique, IRM cérébrale normale ou non spécifique, ou lésion optique atteignant au moins la moitié du nerf ou le chiasma ; myélite, lésion de trois segments ou plus, ou atrophie focale de trois segments ou plus ; area postrema, lésion médullaire dorsale ; tronc cérébral, lésion périépendymaire.</p><div class="lab">Précision</div><p>Une poussée nouvelle est définie au-delà de 4 semaines après le début. Les critères de 2006 sont fortement déconseillés ; ceux de 1999 ne doivent pas être utilisés.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-mogad-criteres" data-title="Critères de 2023 de la MOGAD : détail">
<div class="lab">Obligatoire</div><p>(1) Événement démyélinisant cardinal (névrite optique, myélite, encéphalomyélite aiguë disséminée, syndrome cérébral, du tronc ou du cervelet, encéphalite corticale) ; (2) anticorps anti-MOG sériques en test cellulaire : positif franc à partir de 1:100 sans élément supplémentaire, positif faible de 1:10 à moins de 1:100 avec anticorps anti-aquaporine 4 négatifs et au moins un élément de soutien clinique ou d’imagerie ; (3) exclusion d’un meilleur diagnostic, notamment la sclérose en plaques.</p><div class="lab">Éléments de soutien</div><p>Névrite bilatérale simultanée, atteinte de plus de la moitié du nerf, œdème papillaire, rehaussement périneural ; myélite étendue, atteinte du cône, signe H ; lésions de la substance grise profonde, lésions floues multiples, lésion corticale.</p><div class="lab">Performance</div><p>Sensibilité de 100 % et spécificité de 55,5 % par rapport au jugement d’experts dans une cohorte de 27 patients ; concordance de 98 % dans une cohorte de 88 patients.</p><div class="lab">Limite</div><p>Texte original (Lancet Neurology, accès payant) non lu ; les critères sont reproduits à partir d’une revue et du résumé du panel. Les cohortes d’évaluation sont petites et rétrospectives.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(22)00431-8" target="_blank" rel="noopener">Critères MOGAD 2023 (Banwell et al., Lancet Neurol 2023, résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10165591/" target="_blank" rel="noopener">Revue narrative sur la MOGAD (J Neurol 2023)</a> ; <a href="https://doi.org/10.1016/j.msard.2023.105150" target="_blank" rel="noopener">Performance des critères MOGAD 2023 (Alaboudi et al., Mult Scler Relat Disord 2023)</a> ; <a href="https://doi.org/10.1007/s00415-024-12438-6" target="_blank" rel="noopener">Applicabilité des critères MOGAD 2023 (Rechtman et al., J Neurol 2024, résumé)</a>.</p></template>
<template data-pop="g36-drapeaux" data-title="Drapeaux rouges contre une NMOSD">
<div class="lab">Liste</div><p>Évolution progressive en dehors des poussées ; nadir en moins de 4 heures ou aggravation sur plus de 4 semaines ; myélite partielle sans lésion longitudinale étendue ; anticorps anti-aquaporine 4 retrouvés seulement dans le liquide cérébro-spinal ; double positivité anti-aquaporine 4 et anti-MOG ; bandes oligoclonales ou réaction MRZ positives ; lésions typiques de sclérose en plaques ; prise de contraste persistant au-delà de 3 mois ; rehaussement périvasculaire linéaire ; sarcoïdose, cancer ou infection chronique.</p><div class="lab">Application</div><p>Un drapeau rouge ne rend pas le diagnostic impossible ; il impose de confirmer les anticorps par une seconde méthode et d’écarter les diagnostics alternatifs.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-mnemo" data-title="Moyen mnémotechnique des six caractéristiques cardinales">
<p>Pour retenir les six caractéristiques cardinales : « <b>N</b>erf, <b>M</b>oelle, <b>A</b>rea, <b>T</b>ronc, <b>D</b>iencéphale, <b>C</b>erveau » — NMATDC.</p><p><i>Aide pédagogique, non critère officiel.</i></p>
</template>
<template data-pop="g36-epidemio" data-title="Données épidémiologiques et lacunes">
<p>Incidence de la NMOSD : 0,28 à 0,73 pour 100 000 personnes-années. Prévalence : 0,52 à 10 pour 100 000. Aucune donnée suisse n’a été lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="pareto-g36-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="g36-0,g36-1,g36-2,g36-3,g36-4,g36-5,g36-6"></p><ul><li>La NMOSD est une astrocytopathie dirigée contre l’aquaporine 4 ; la MOGAD cible la myéline ; la leucoencéphalite hémorragique est la forme la plus sévère de l’encéphalomyélite aiguë disséminée.</li><li>La NMOSD touche surtout la femme (jusqu’à 10 pour 1), vers 40 ans ; la MOGAD touche enfants et adultes sans prédominance de sexe.</li><li>Syndromes cardinaux : névrite optique, myélite longitudinale étendue de 3 segments ou plus, syndrome de l’area postrema, tronc, diencéphale, cerveau.</li><li>Prélever le sérum avant échanges plasmatiques, corticoïdes ou immunosuppression.</li><li>Perte visuelle sévère et atteinte bilatérale d’emblée évoquent la NMOSD ; œdème papillaire évoque la MOGAD.</li></ul></template>
<template data-pop="pareto-g36-prise" data-title="Pareto — Diagnostic, urgences et prise en charge"><p class="ratio" data-cover="g36-7,g36-8,g36-9,g36-10,g36-11,g36-12,g36-13"></p><ul><li>Poussée : méthylprednisolone intraveineuse 1000 mg par jour pendant 3 à 5 jours ; échanges plasmatiques précoces, jusqu’à 40 % de rémission complète dans les deux premiers jours contre 3,7 % après le septième.</li><li>Traitement de fond dès la première poussée en cas d’anticorps anti-aquaporine 4 : éculizumab, ravulizumab, inébilizumab, rituximab ou satralizumab.</li><li>Éviter interférons bêta, natalizumab, fingolimod, alemtuzumab, diméthylfumarate.</li><li>Anti-C5 : vaccination antiméningococcique au moins 2 semaines avant ; fièvre = urgence.</li><li>Leucoencéphalite hémorragique : pression intracrânienne d’abord ; mortalité d’environ 58 %.</li><li>Ne pas arrêter le traitement de fond chez le patient stable avec anticorps anti-aquaporine 4.</li></ul></template>
