<template data-pop="g36-serologie" data-title="Sérologie : technique et prélèvement">
<div class="lab">Méthode</div><p>Le test cellulaire (cell-based assay) utilise la protéine humaine entière, aquaporine 4 ou glycoprotéine de la myéline. La version sur cellules fixées est plus standardisée ; la version sur cellules vivantes est un peu plus sensible, surtout pour la MOG. Les immunohistochimie, dosage immuno-enzymatique, Western blot et radio-immunologie ne sont pas recommandés en routine.</p><div class="lab">Prélèvement</div><p>Le sérum est le prélèvement préféré. Les anticorps anti-aquaporine 4 retrouvés dans le liquide cérébro-spinal seul, ou des immunoglobulines M ou A seules, ne suffisent pas. Le prélèvement précède les échanges plasmatiques, l’immunoadsorption, les corticoïdes et l’immunosuppression (faux négatifs rares).</p><div class="lab">Interprétation</div><p>Un résultat positif se confirme par un test cellulaire méthodologiquement différent en cas de titre bas ou de drapeaux rouges. Un séronégatif suspect se reteste, idéalement sur cellules vivantes. Les titres anti-aquaporine 4 ne prédisent pas les poussées.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-irm-moelle" data-title="IRM médullaire">
<div class="lab">NMOSD</div><p>Lésion longitudinale étendue de 3 segments vertébraux contigus ou plus, centrale, avec liseré périphérique épargné ; « bright spotty lesions » en faveur de la NMOSD.</p><div class="lab">MOGAD</div><p>Lésions courtes jusqu’à 50 % des cas ; signe H ; atteinte du cône médullaire.</p><div class="lab">Sclérose en plaques</div><p>Lésions périphériques et courtes.</p><div class="lab">Piège</div><p>Une lésion courte n’exclut pas la NMOSD (10 à 15 % des poussées).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-irm-nerf" data-title="IRM du nerf optique">
<div class="lab">NMOSD</div><p>Atteinte postérieure, du chiasma et des bandelettes optiques ; atteinte longitudinale étendue.</p><div class="lab">MOGAD</div><p>Atteinte longitudinale étendue ; rehaussement périneural en faveur de la MOGAD.</p><div class="lab">Sclérose en plaques</div><p>Atteinte antérieure rétrobulbaire, chiasma épargné, sans atteinte longitudinale étendue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a>.</p></template>
<template data-pop="g36-lcs" data-title="Ponction lombaire : profil du liquide">
<div class="lab">Recommandation</div><p>La ponction lombaire est fortement recommandée, non obligatoire. Un liquide normal est possible, surtout dans la névrite optique.</p><div class="lab">Paramètres</div><p>Bandes oligoclonales : environ 25 % des NMOSD avec anticorps anti-aquaporine 4 à la première ponction, environ 35 % des séronégatifs, environ 10 % des MOGAD, plus de 95 % des cas de sclérose en plaques en Europe continentale. Cellules : 50/µl ou plus dans environ 15 % des cas avec anticorps anti-aquaporine 4 ; neutrophiles dans environ 50 %. Quotient d’albumine supérieur à 12×10⁻³ dans environ 30 % des poussées. Réaction MRZ positive dans environ 67 % des cas de sclérose en plaques, quasi absente en NMOSD et MOGAD.</p><div class="lab">Cohorte zurichoise</div><p>Sur 30 MOGAD et 189 sclérose en plaques rémittente : quotient d’albumine supérieur à 10×10⁻³ (rapport de vraisemblance positif de 12,6) et absence de bandes oligoclonales restreintes au liquide (14,3) orientent vers la MOGAD ; réaction MRZ positive chez 35,4 % des cas de sclérose en plaques et chez aucun MOGAD. Étude monocentrique rétrospective, résumé seul lu.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a> ; <a href="https://doi.org/10.3389/fimmu.2023.1237149" target="_blank" rel="noopener">Cohorte zurichoise, paramètres de base du LCS et réaction MRZ (Vlad et al., Front Immunol 2023, résumé)</a>.</p></template>
<template data-pop="g36-corticoides" data-title="Corticoïdes à forte dose : schéma et relais">
<div class="lab">Schéma</div><p>Méthylprednisolone par voie intraveineuse, 1000 mg par jour pendant 3 à 5 jours, puis relais oral (1 mg/kg par jour ou 20 à 30 mg par jour) avec décroissance jusqu’à 10 à 15 mg par jour en 2 à 3 semaines. Inhibiteur de la pompe à protons et thromboprophylaxie associés.</p><div class="lab">Poursuite</div><p>Des glucocorticoïdes oraux à faible dose peuvent être poursuivis jusqu’à 3 à 6 mois ; dose de long terme idéale inférieure ou égale à 7,5 mg par jour de prednisolone. Les corticoïdes seuls ne sont pas un traitement de fond de la NMOSD.</p><div class="lab">MOGAD</div><p>Méthylprednisolone 1 g par jour, le plus souvent pendant 5 jours, puis décroissance sur 1 à 2 mois.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770020/" target="_blank" rel="noopener">NEMOS 2024, deuxième partie : traitement de la poussée et traitement de fond (Kümpfel et al., J Neurol 2024)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10165591/" target="_blank" rel="noopener">Revue narrative sur la MOGAD (J Neurol 2023)</a>.</p></template>
<template data-pop="g36-aph" data-title="Échanges plasmatiques et immunoadsorption">
<div class="lab">Indication</div><p>Réponse insuffisante aux corticoïdes dans les premiers jours ; d’emblée en cas de myélite sévère ou de réponse antérieure à l’aphérèse ; en association aux corticoïdes pour les poussées sévères. Environ 5 séances quotidiennes ou un jour sur deux, jusqu’à 10.</p><div class="lab">Délai</div><p>Débutée dans les deux premiers jours, l’aphérèse donne jusqu’à 40 % de rémission complète, contre 3,7 % si elle commence à partir du septième jour.</p><div class="lab">Limite</div><p>Données issues d’un consensus Delphi européen ; l’hétérogénéité des études n’est pas détaillée dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770020/" target="_blank" rel="noopener">NEMOS 2024, deuxième partie : traitement de la poussée et traitement de fond (Kümpfel et al., J Neurol 2024)</a>.</p></template>
<template data-pop="g36-traitements-fond" data-title="Traitements de fond de la NMOSD : indications suisses et rang européen">
<div class="lab">Rang d’efficacité relative (recommandations européennes)</div><p>Éculizumab et ravulizumab : ++++. Inébilizumab, rituximab, satralizumab : +++. Tocilizumab : ++. Azathioprine, mycophénolate : +. Proposer un traitement de fond dès la première poussée ; corticoïdes seuls déconseillés ; glatiramère inefficace.</p><div class="lab">Approbation suisse</div><p>Les informations professionnelles suisses d’Enspryng®, Uplizna®, Ultomiris® et Soliris® sont détaillées dans les fenêtres correspondantes.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770020/" target="_blank" rel="noopener">NEMOS 2024, deuxième partie : traitement de la poussée et traitement de fond (Kümpfel et al., J Neurol 2024)</a>.</p></template>
<template data-pop="g36-solumedrol" data-title="Solu-Medrol® (méthylprednisolone)">
<div class="lab">Indication suisse</div><p>500 à 1000 mg par jour pendant 3 à 5 jours pour les poussées de sclérose en plaques. La NMOSD n’est pas une indication de l’information professionnelle : usage hors indication.</p><div class="lab">Limite</div><p>Les effets indésirables et contre-indications détaillés n’ont pas été extraits ; consulter la monographie.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680351120812" target="_blank" rel="noopener">Information professionnelle suisse Solu-Medrol®</a>.</p></template>
<template data-pop="g36-soliris" data-title="Soliris® (éculizumab)">
<div class="lab">Mécanisme</div><p>Anticorps dirigé contre le composant C5 du complément ; il bloque l’activation terminale.</p><div class="lab">Indication et posologie</div><p>NMOSD avec anticorps anti-aquaporine 4, récurrente, adulte : 900 mg par voie intraveineuse chaque semaine pendant 4 semaines, 1200 mg à la cinquième semaine, puis toutes les 2 semaines.</p><div class="lab">Preuves</div><p>Réduction relative du risque de première poussée de 94 % (hazard ratio 0,058) ; taux annualisé de poussées réduit de 95,5 %.</p><div class="lab">Sécurité</div><p>Vaccination antiméningococcique au moins 2 semaines avant ; sinon antibioprophylaxie jusqu’à 2 semaines après. Non établi avant 18 ans. Effet de l’arrêt non décrit : surveillance étroite des poussées.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680592820014" target="_blank" rel="noopener">Information professionnelle suisse Soliris®</a>.</p></template>
<template data-pop="g36-ultomiris" data-title="Ultomiris® (ravulizumab)">
<div class="lab">Mécanisme</div><p>Anticorps dirigé contre le composant C5 du complément.</p><div class="lab">Indication et posologie</div><p>NMOSD avec anticorps anti-aquaporine 4, adulte : dose de charge de 2400, 2700 ou 3000 mg selon le poids, puis entretien de 3000, 3300 ou 3600 mg toutes les 8 semaines.</p><div class="lab">Preuves</div><p>Aucune poussée confirmée chez 58 patients (suivi médian de 170 semaines). Le taux de poussées n’est pas chiffré au-delà de cette mention dans les sources lues.</p><div class="lab">Sécurité</div><p>Mêmes précautions antiméningococciques que l’éculizumab ; vaccination suractivant le complément, poussée possible. Non établi avant 18 ans.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680672780016" target="_blank" rel="noopener">Information professionnelle suisse Ultomiris®</a>.</p></template>
<template data-pop="g36-uplizna" data-title="Uplizna® (inébilizumab)">
<div class="lab">Mécanisme</div><p>Cible les lymphocytes B porteurs du marqueur CD19 ; le mécanisme détaillé n’a pas été extrait de l’information professionnelle.</p><div class="lab">Indication et posologie</div><p>NMOSD avec anticorps anti-aquaporine 4, adulte, en monothérapie : 300 mg par voie intraveineuse aux jours 1 et 15, puis tous les 6 mois, avec prémédication par corticoïde, antihistaminique et antipyrétique.</p><div class="lab">Preuves</div><p>Hazard ratio de 0,227 (réduction de 77,3 %) ; aucun bénéfice chez les séronégatifs.</p><div class="lab">Bilan préalable</div><p>Immunoglobulines, lymphocytes B, numération formule sanguine, hépatites B et C, tuberculose ; vaccins vivants au moins 4 semaines avant. Non établi avant 18 ans.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680693220010" target="_blank" rel="noopener">Information professionnelle suisse Uplizna®</a>.</p></template>
<template data-pop="g36-enspryng" data-title="Enspryng® (satralizumab)">
<div class="lab">Mécanisme</div><p>Agit sur la voie de l’interleukine 6, décrite dans le chapitre de physiologie.</p><div class="lab">Indication et posologie</div><p>NMOSD avec anticorps anti-aquaporine 4, adulte et adolescent, en monothérapie ou en association : 120 mg par voie sous-cutanée aux semaines 0, 2 et 4, puis toutes les 4 semaines.</p><div class="lab">Preuves</div><p>Risque de poussée réduit de 79 % chez les patients avec anticorps anti-aquaporine 4 (étude BN40898) ; taux annualisé de poussées réduit de 88 % et de 90 %.</p><div class="lab">Sécurité</div><p>Bilan préalable : hépatite B, tuberculose, transaminases, bilirubine, vaccins. Contre-indication : hépatite B active, tuberculose active ou latente non traitée. Arrêt définitif si les transaminases dépassent cinq fois la limite supérieure de la normale avec bilirubine élevée. Demi-vie d’environ 30 jours. Grossesse : aucune donnée, contraception jusqu’à 5 mois après la dernière dose, allaitement déconseillé.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680676170011" target="_blank" rel="noopener">Information professionnelle suisse Enspryng®</a>.</p></template>
<template data-pop="g36-horsindic" data-title="Rituximab, tocilizumab, azathioprine, mycophénolate : schémas hors indication">
<div class="lab">Rituximab</div><p>1000 mg aux jours 1 et 14, puis 500 à 1000 mg tous les 6 mois ; surveillance des lymphocytes marqués par CD19 et CD27 ; sérologie de l’hépatite B obligatoire.</p><div class="lab">Tocilizumab</div><p>6–8 mg/kg par voie intraveineuse toutes les 4 à 6 semaines.</p><div class="lab">Azathioprine</div><p>2,5–3 mg/kg par jour ; délai d’effet de 6 à 12 mois ; dosage de la thiopurine S-méthyltransférase.</p><div class="lab">Mycophénolate</div><p>1000–2000 mg par jour ; tératogène.</p><div class="lab">Limite</div><p>Les informations professionnelles suisses de ces quatre médicaments n’ont pas été lues pour la NMOSD ; les schémas viennent du consensus européen.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770020/" target="_blank" rel="noopener">NEMOS 2024, deuxième partie : traitement de la poussée et traitement de fond (Kümpfel et al., J Neurol 2024)</a>.</p></template>
<template data-pop="g36-eviter" data-title="Traitements de la sclérose en plaques à éviter">
<p>Interférons bêta, natalizumab, fingolimod, alemtuzumab et diméthylfumarate : poussées sévères rapportées dans la NMOSD. Le glatiramère est inefficace.</p><p>Conduite : rechercher les anticorps anti-aquaporine 4 et anti-MOG avant de débuter un traitement de la sclérose en plaques chez un patient présentant névrite optique ou myélite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770020/" target="_blank" rel="noopener">NEMOS 2024, deuxième partie : traitement de la poussée et traitement de fond (Kümpfel et al., J Neurol 2024)</a>.</p></template>
<template data-pop="pareto-g36-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="g36-e-1,g36-e-2,g36-e-3,g36-e-4,g36-e-5,g36-e-6"></p><ul><li>Test cellulaire sérique avant tout traitement ; confirmer un titre bas par une seconde méthode.</li><li>Titres anti-MOG : valeur prédictive positive de 100 % à 1:1000, 82 % à 1:100, 51 % à 1:20–1:40.</li><li>Bandes oligoclonales : 25 % NMOSD, 10 % MOGAD, plus de 95 % sclérose en plaques ; réaction MRZ quasi absente en NMOSD et MOGAD.</li><li>IRM : lésion médullaire de 3 segments ou plus et rehaussement épendymaire en trait de crayon : NMOSD ; signe H, cône, rehaussement périneural : MOGAD.</li><li>Épaisseur des fibres nerveuses rétiniennes : 55 à 83 µm après névrite de NMOSD.</li></ul></template>
<template data-pop="pareto-g36-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="g36-p-1,g36-p-2,g36-p-3,g36-p-4"></p><ul><li>Quatre médicaments de fond approuvés en Suisse : éculizumab, ravulizumab, inébilizumab, satralizumab (adulte, anticorps anti-aquaporine 4).</li><li>Anti-C5 : vaccination antiméningococcique d’abord ; fièvre = urgence.</li><li>Satralizumab : bilan hépatite B, tuberculose, transaminases ; contre-indication si hépatite B ou tuberculose active ou latente non traitée.</li><li>Rituximab, tocilizumab, azathioprine, mycophénolate : hors indication.</li><li>Éviter interférons bêta, natalizumab, fingolimod, alemtuzumab, diméthylfumarate.</li></ul></template>
<template data-pop="pareto-g36-s-anat" data-title="Pareto — Anatomie"><p class="ratio" data-cover="g36-s-anat-cours"></p><ul><li>Nerf optique postérieur, chiasma, bandelettes : NMOSD ; antérieur : sclérose en plaques.</li><li>Moelle : lésion centrale de 3 segments ou plus ; signe H et cône : MOGAD.</li><li>Area postrema : lésion médullaire dorsale ; tronc : lésion périépendymaire.</li></ul></template>
<template data-pop="pareto-g36-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="g36-s-physio-cours"></p><ul><li>Aquaporine 4 : canal astrocytaire.</li><li>Complément terminal (C5) : nécrose astrocytaire, ouverture de la barrière.</li><li>Interleukine 6 : anticorps, Th17, perméabilité.</li></ul></template>
<template data-pop="pareto-g36-s-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="g36-s-histo-cours"></p><ul><li>NMOSD : astrocyte lésé en premier.</li><li>Leucoencéphalite hémorragique : neutrophiles, hémorragies périvasculaires.</li><li>Encéphalomyélite aiguë disséminée : lymphocytes.</li></ul></template>
<template data-pop="pareto-g36-s-bioch" data-title="Pareto — Biochimie"><p class="ratio" data-cover="g36-s-bioch-cours"></p><ul><li>Quotient d’albumine supérieur à 12×10⁻³ dans environ 30 % des poussées.</li><li>Bandes oligoclonales rares ; réaction MRZ quasi absente.</li><li>Profil sans bandes oligoclonales avec quotient d’albumine élevé : MOGAD.</li></ul></template>
