<template id="ch-G36"><div class="chap"><div class="chap-head"><div class="code">G36 · Neurologie · CIM-10-GM 2024</div><h1>G36 — Autres affections démyélinisantes aiguës disséminées</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G36"><section class="ilot" id="g36-question"><h2>Une baisse visuelle, une faiblesse ou un coma imposent d’abord une décision clinique</h2><p>Une personne perd la vision en quelques jours, une autre devient paraplégique et une troisième s’enfonce rapidement dans le coma. Ces tableaux ne conduisent pas tous au même diagnostic ou au même traitement. Il faut localiser l’atteinte, mesurer sa gravité et rechercher les causes inflammatoires, infectieuses, vasculaires ou compressives. Une urgence peut précéder la confirmation sérologique.</p><p>G36 regroupe quatre sous-codes de la classification, sans être une maladie unique. La neuromyélite optique constitue le fil principal de la leçon ; la leucoencéphalite hémorragique de Hurst exige un raisonnement propre. La maladie associée aux anticorps anti-MOG est étudiée comme diagnostic distinct : sa présence ne fixe pas automatiquement le sous-code G36.8.</p><div class="key"><b>À retenir.</b> Évaluer vision, motricité, conscience et respiration ; prélever si possible avant traitement sans retarder une prise en charge nécessaire.</div><p>Sources : <button class="w" data-k="g36-r1">[1]</button> · <button class="w" data-k="g36-r2">[2]</button> · <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r13">[13]</button> · <button class="w" data-k="g36-r15">[15]</button></p></section><section class="ilot" id="g36-definition"><h2>Neuromyélite optique, MOGAD et Hurst ne sont pas interchangeables</h2><p>La NMOSD désigne les troubles du spectre de la neuromyélite optique. La forme associée aux IgG anti-aquaporine 4 est une astrocytopathie inflammatoire pouvant léser secondairement la myéline et les neurones. Une névrite optique ou une myélite peut être isolée au premier épisode ; il n’est pas nécessaire d’attendre leur association historique dite de Devic.</p><p>La MOGAD est une maladie associée aux anticorps anti-MOG, distincte de la sclérose en plaques et de la NMOSD AQP4 positive. Elle peut produire névrite, myélite, encéphalomyélite aiguë disséminée ou encéphalite corticale. Hurst est une affection fulminante avec inflammation, œdème et hémorragies, décrite dans une littérature surtout constituée de cas.</p><p><button class="w" data-k="g36-nmosd">NMOSD : syndrome, sérologie et alternatives</button></p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-codage"><h2>Les quatre sous-codes et les exclusions sont vérifiés dans la classification française</h2><p>G36 est intitulé « Autres affections démyélinisantes aiguës disséminées ». Il ne porte pas d’astérisque dans l’export français consulté. Les règles des codes de manifestation à étoile étudiées dans d’autres leçons ne lui sont pas transposées.</p><p>G36 exclut l’encéphalite et l’encéphalomyélite postinfectieuses sans précision, classées G04.8. G36.0 exclut la névrite optique sans précision H46. L’ADEM est incluse dans G37.8 ; le mot disséminée ne suffit donc pas à la classer G36. Les sous-codes .8 et .9 expriment respectivement une affection précisée ou sans précision ; ils n’autorisent pas une ordonnance commune.</p><table class="t"><thead><tr><th>Code</th><th>Libellé et portée</th><th>Conséquence clinique</th></tr></thead><tbody><tr><td>G36.0</td><td>Neuromyélite optique [Devic] ; inclusion de démyélinisation au cours de névrite optique.</td><td>Documenter le diagnostic moderne et la sérologie ; une névrite SAI ne suffit pas.</td></tr><tr><td>G36.1</td><td>Leucoencéphalite hémorragique aiguë et subaiguë [Hurst].</td><td>Urgence encéphalique, investigations et soins intensifs selon gravité.</td></tr><tr><td>G36.8</td><td>Autres affections démyélinisantes aiguës disséminées précisées.</td><td>Nommer l’entité documentée ; pas de rattachement automatique de toute MOGAD.</td></tr><tr><td>G36.9</td><td>Affection démyélinisante aiguë disséminée, sans précision.</td><td>Poursuivre la clarification et prendre en charge la gravité sans attendre un meilleur code.</td></tr></tbody></table><p><button class="w" data-k="g36-adem">ADEM et codes voisins : lire le libellé complet</button></p><p>Sources : <button class="w" data-k="g36-r1">[1]</button> · <button class="w" data-k="g36-r2">[2]</button></p></section><section class="ilot" id="g36-epidemiologie"><h2>La rareté et les populations des études limitent l’usage des chiffres</h2><p>Aucun taux suisse actuel de G36, ventilé de façon complète par âge et sexe, n’a été établi dans les sources réellement lues. Une publication bâloise et une revue romande documentent un contexte local ; elles ne mesurent pas une incidence nationale. NMOSD, MOGAD, Hurst et catégorie G36 ne sont pas des dénominateurs interchangeables.</p><p>NEMOS décrit une prédominance féminine dans la NMOSD AQP4 positive et une survenue fréquente à l’âge adulte, tout en rappelant les formes de l’enfant et de la personne âgée. La MOGAD touche les deux sexes de façon plus équilibrée et l’ADEM y est plus fréquente chez le jeune enfant. Ces tendances orientent l’attention sans exclure un diagnostic selon âge, sexe ou origine.</p><p><button class="w" data-k="g36-serie">Hurst : ce que permettent 43 cas publiés</button></p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-causes"><h2>Une cible immunologique ne dispense pas de rechercher une autre cause</h2><p>AQP4 est une protéine des astrocytes impliquée dans les échanges d’eau. Les IgG pathogènes et le complément peuvent provoquer une lésion astrocytaire avec atteinte secondaire des autres éléments du tissu nerveux. Dans la MOGAD, la cible appartient à la myéline oligodendrocytaire ; cette distinction contribue à séparer les maladies et leurs stratégies de prévention.</p><p>Des maladies auto-immunes associées ou des contextes infectieux sont recherchés. Une inflammation du cerveau ne devient pas automatiquement auto-immune : infection, vascularite, tumeur, sarcoïdose ou trouble métabolique restent possibles. Dans Hurst, un mécanisme immunitaire après un épisode infectieux est une hypothèse ; les données de cas ne permettent pas de désigner chaque agent ou vaccin comme cause certaine.</p><div class="key"><b>À retenir.</b> Nommer un anticorps ou un facteur temporel n’établit pas, à lui seul, la cause de tous les symptômes.</div><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-anamnese"><h2>Interroger la chronologie et les fonctions atteintes</h2><p>Préciser début, progression, épisodes antérieurs et récupération. Demander baisse visuelle, douleur aux mouvements oculaires, couleurs délavées, champ visuel manquant et atteinte d’un ou deux yeux. Rechercher faiblesse, paresthésies, niveau sensitif, rétention ou incontinence, constipation et troubles sexuels. L’absence d’un symptôme n’exclut pas une présentation incomplète.</p><p>Un hoquet, des vomissements ou des nausées persistants sans explication digestive peuvent traduire une atteinte de l’area postrema. Demander aussi diplopie, déglutition, respiration, somnolence, confusion, crises et fièvre. Noter médicaments immunosuppresseurs, infections, vaccinations, maladies auto-immunes et projet de grossesse. Les symptômes anciens et les traitements en cours modifient l’interprétation des tests.</p><p><button class="w" data-k="g36-mnemo">Six territoires : un aide-mémoire local</button></p><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r4">[4]</button> · <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-examen"><h2>Décrire les signes avant de les attribuer à une maladie</h2><p>Mesurer l’acuité avec correction dans chaque œil, puis comparer les couleurs, les champs et les réponses pupillaires. Un déficit afférent relatif se recherche par éclairage alterné si l’atteinte est asymétrique. Examiner le fond d’œil ou organiser l’évaluation ophtalmologique. Un œdème papillaire est plus fréquent dans la MOGAD, mais ne la prouve pas.</p><p>Évaluer force segmentaire, tonus, réflexes, réponse plantaire, sensibilité et niveau, coordination et marche si sûre. Examiner nerfs crâniens, parole, déglutition, conscience et respiration. Rechercher une rétention et les complications d’immobilité. Une faiblesse respiratoire ou une dégradation de conscience change immédiatement le niveau de soins ; l’examen ne doit pas attendre un résultat sérologique.</p><p><button class="w" data-k="g36-myelite">Myélite : localiser et mesurer la gravité</button></p><button class="pareto-btn ui" data-k="pareto-g36-clin">▲ Loi de Pareto — Localiser et hiérarchiser</button><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button> · <button class="w" data-k="g36-r13">[13]</button></p></section><section class="ilot" id="g36-diagnostic"><h2>Les critères IPND 2015 distinguent AQP4 positif et AQP4 négatif</h2><p>NEMOS 2023 recommande les critères IPND de 2015. Chez une personne AQP4-IgG positive, au moins une caractéristique cardinale et l’exclusion d’une meilleure explication sont requises. Pour un statut négatif ou inconnu, les conditions sont plus strictes : au moins deux caractéristiques cardinales avec dissémination spatiale, dont une névrite optique, une myélite ou un syndrome de l’area postrema, avec critères IRM propres et exclusion des alternatives.</p><p>Le statut inconnu ne dispense pas de rechercher rapidement les anticorps. Une double positivité AQP4/MOG est exceptionnelle et demande vérification méthodologique. Une personne AQP4 négative répondant aux critères MOGAD reçoit ce diagnostic distinct ; le mot séronégatif ne forme pas une catégorie thérapeutique uniforme.</p><div class="alert"><b>Critères formels.</b> <button class="w" data-k="g36-ipnd">Conditions IPND détaillées</button> AQP4 positif : syndrome cardinal + IgG AQP4 par méthode appropriée + absence de meilleure explication. AQP4 négatif/inconnu : au moins deux caractéristiques, conditions cliniques et IRM supplémentaires IPND, et alternatives exclues. Le tableau détaillé de la source reste nécessaire pour une décision réelle.</div><div class="key"><b>À retenir.</b> Un syndrome de l’area postrema sans lésion IRM demande des symptômes durant au moins 48 h dans les critères cités ; une lésion dorsale bulbaire compatible permet une durée plus courte. Ce repère diagnostique n’est jamais une consigne d’attendre 48 h pour soigner.</div><p>Sources : <button class="w" data-k="g36-r3">[3]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section><section class="ilot" id="g36-mogad-body"><h2>MOGAD : méthode, titre et éléments de soutien doivent rester liés</h2><p>Le consensus international de 2023 requiert A, un événement clinique démyélinisant cardinal ; B, une recherche MOG-IgG positive dans les conditions définies ; C, l’exclusion d’un meilleur diagnostic, notamment SEP. Les manifestations incluent névrite, myélite, ADEM, déficit cérébral mono ou polyfocal, atteinte du tronc ou du cervelet et encéphalite corticale souvent avec crises.</p><p>Un positif clair en sérum par CBA validé n’exige pas d’élément de soutien additionnel. Un faible positif, un résultat positif sans titre ou une positivité limitée au LCR dans les conditions du consensus demandent AQP4 négatif et au moins un élément clinique ou IRM de soutien. Le sérum reste le prélèvement recommandé ; sérum et LCR ne sont pas systématiquement testés ensemble.</p><p><button class="w" data-k="g36-mogad">Critères MOG 2023 : ne pas universaliser le seuil</button></p><div class="alert"><b>MOGAD : A + B + C.</b> La positivité seule ne suffit pas. Un faible titre dans une présentation typique de SEP demande une réévaluation ; le contexte détermine la valeur prédictive du test.</div><p>Sources : <button class="w" data-k="g36-r11">[11]</button> · <button class="w" data-k="g36-r12">[12]</button></p></section>
