<template data-pop="d77-exp-1" data-title="Comprendre — 1. Définition : manifestation, syndrome et cause"><p><b>Lecture expliquée.</b> D77* est une manifestation à relier à une maladie causale ; volume, fibrose et hypersplénisme ne sont pas synonymes.</p><p>D77* est une catégorie de manifestation : « Autres maladies du sang et des organes hématopoïétiques au cours de maladies classées ailleurs ». Son inclusion explicite dans la CIM-10-GM suisse 2024 est la <b>fibrose splénique due à la schistosomiase [bilharziose] (B65.-†)</b>. D77 n’a pas de sous-code décimal dans cette version. Le code de la maladie causale et celui de sa manifestation ne remplacent pas la démonstration clinique.</p><p>Cette monographie développe cette inclusion, sans prétendre que toute maladie classable en D77 soit une bilharziose. La <b>splénomégalie</b> décrit une augmentation de volume ; l’<b>hypersplénisme</b> décrit un retentissement hématologique associé à la rate ; la <b>fibrose</b> décrit une transformation tissulaire. Ces termes ne sont pas interchangeables. Une grande rate n’est pas automatiquement une rate non fonctionnelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-ASPLEN — Pages 1–2, information et prévention après splénectomie, 2024</a>.</p></template>
<template data-pop="pareto-d77-1" data-title="Essentiel — 1. Définition : manifestation, syndrome et cause"><p>D77* est une manifestation à relier à une maladie causale ; volume, fibrose et hypersplénisme ne sont pas synonymes.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a>.</p></template>
<template data-pop="d77-exp-2" data-title="Comprendre — 2. Épidémiologie : exposition et sélection des populations"><p><b>Lecture expliquée.</b> Documenter une exposition compatible ; aucune incidence suisse directe D77 n’est retenue.</p><p>L’exposition pertinente est un contact cutané avec de l’eau douce contaminée dans une région d’endémie : lieu de naissance, séjour, migration, activité professionnelle ou voyage. L’infection peut persister et les symptômes chroniques être discrets. Une brève exposition ne garantit pas l’absence d’infection ; l’absence d’éosinophilie ne suffit pas à l’écarter.</p><p>Les formes hépatospléniques sont surtout associées à <i>S. mansoni</i> et <i>S. japonicum</i>. <i>S. haematobium</i> oriente davantage vers une atteinte urogénitale. Cette orientation ne remplace pas l’identification ni l’étude d’une atteinte concomitante. Une hématurie terminale dans un récit d’exposition doit être explorée, sans la prendre pour une preuve d’hypertension portale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></template>
<template data-pop="pareto-d77-2" data-title="Essentiel — 2. Épidémiologie : exposition et sélection des populations"><p>Documenter une exposition compatible ; aucune incidence suisse directe D77 n’est retenue.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a>.</p></template>
<template data-pop="d77-exp-3" data-title="Comprendre — 3. Physiopathologie : œufs, tissu et circulation"><p><b>Lecture expliquée.</b> Les œufs et la réponse tissulaire contribuent à la fibrose périportale et à une hypertension présinusoïdale.</p><p>Les cercaires pénètrent la peau au contact de l’eau contaminée. Le cycle conduit à des vers adultes et à une production d’œufs ; une partie des œufs se retrouve dans les tissus. La réaction inflammatoire granulomateuse aux œufs contribue à la fibrose périportale. Il ne s’agit pas simplement d’un ver qui bouche directement la veine porte.</p><p>Cette image montre un œuf, sans démontrer sa viabilité, une fibrose splénique ou le degré d’hypertension portale. Source américaine utilisée uniquement pour la figure, sans recommandation clinique américaine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-TX — Revue HSS 2021 : traitements, bêtabloquants, chirurgie et TIPS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></template>
<template data-pop="pareto-d77-3" data-title="Essentiel — 3. Physiopathologie : œufs, tissu et circulation"><p>Les œufs et la réponse tissulaire contribuent à la fibrose périportale et à une hypertension présinusoïdale.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p></template>
<template data-pop="d77-exp-4" data-title="Comprendre — 4. Démarche clinique : gravité, cause puis retentissement"><p><b>Lecture expliquée.</b> Urgence d’abord, puis infection, organes et profil sanguin : chaque examen répond à une question.</p><p><b>Première étape : rechercher une urgence.</b> Hématémèse, méléna, malaise, altération de conscience ou signes circulatoires imposent une évaluation et une prise en charge urgentes. Une hémorragie peut être grave avec une fonction hépatique jusque-là conservée. Sous bêtabloquant, l’absence de tachycardie ne rassure pas à elle seule.</p><p><b>Deuxième étape : établir la plausibilité causale.</b> Documenter les expositions et les traitements antérieurs, puis choisir les examens parasitologiques selon l’espèce et le site suspectés. La sérologie complète l’enquête mais ne sépare pas de façon fiable infection ancienne et infection active.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680470250018" target="_blank" rel="noopener">FI-PROPRANOLOL — FI suisse de janvier 2023 : indication portale, doses et sécurité</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-TX — Consensus espagnol 2022 : traitement, tableau 3 et populations</a>.</p></template>
<template data-pop="pareto-d77-4" data-title="Essentiel — 4. Démarche clinique : gravité, cause puis retentissement"><p>Urgence d’abord, puis infection, organes et profil sanguin : chaque examen répond à une question.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a>.</p></template>
<template data-pop="d77-exp-5" data-title="Comprendre — 5. Anamnèse : relier chronologie et mécanismes"><p><b>Lecture expliquée.</b> Dates, lieux, eau douce, traitements, saignements et autres médicaments changent le raisonnement.</p><p>Préciser pays et dates de résidence ou de séjour, type d’eau, baignades et activités, épisodes de fièvre après exposition, diagnostics antérieurs, praziquantel reçu et éventuelles réexpositions. La forme aiguë peut associer fièvre, rash, toux ou dyspnée dans les semaines après l’exposition ; elle ne se gère pas comme une simple infection chronique stable.</p><p>Rechercher saignements digestifs et leur calendrier, fatigue, dyspnée, pesanteur de l’hypocondre gauche et augmentation du volume abdominal. Documenter diarrhée, sang dans les selles, hématurie terminale, symptômes urinaires et signes neurologiques. Une plainte oriente un compartiment ; elle ne suffit pas à identifier le mécanisme.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://base-donnees-publique.medicaments.gouv.fr/medicament/60996403/extrait" target="_blank" rel="noopener">EU-PRAZI-RCP — RCP français du 30 mai 2024, sections 4.1–4.6</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p></template>
<template data-pop="pareto-d77-5" data-title="Essentiel — 5. Anamnèse : relier chronologie et mécanismes"><p>Dates, lieux, eau douce, traitements, saignements et autres médicaments changent le raisonnement.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a>.</p></template>
<template data-pop="d77-exp-6" data-title="Comprendre — 6. Examen clinique : volume, saignement et état général"><p><b>Lecture expliquée.</b> Une fonction hépatique préservée et l’absence d’ascite n’excluent pas des varices graves.</p><p>Commencer par l’état général, la conscience, la pression, le pouls, la perfusion et les signes de saignement. La recherche d’une grosse rate vient après la sécurité immédiate. Décrire pâleur, lésions cutanées hémorragiques éventuelles, ictère, abdomen distendu et signes respiratoires ; aucun de ces signes isolés n’est spécifique de la bilharziose.</p><p>Palper prudemment le foie et la rate, décrire douleur, limites et consistance, rechercher ascite et circulation collatérale. L’examen clinique situe le problème mais l’échographie fournit une mesure et étudie les vaisseaux. Une rate non palpée n’exclut pas toute anomalie ; une rate palpable ne prouve pas une fibrose.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-LIMIT — Revue HSS 2021 : discussion, limites et conclusion</a>.</p></template>
<template data-pop="pareto-d77-6" data-title="Essentiel — 6. Examen clinique : volume, saignement et état général"><p>Une fonction hépatique préservée et l’absence d’ascite n’excluent pas des varices graves.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p></template>
<template data-pop="d77-exp-7" data-title="Comprendre — 7. Syndromes : séparer ce qui peut coexister"><p><b>Lecture expliquée.</b> Les regroupements cliniques orientent ; ils ne démontrent pas un mécanisme unique de cytopénie.</p><p>Ces profils sont des regroupements cliniques. Ils guident les investigations et l’urgence ; ils ne constituent pas des critères chiffrés validés pour attribuer D77. Une cytopénie profonde ou atypique doit faire rechercher d’autres mécanismes plutôt que de refermer le dossier sur la rate.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-CLIN — Consensus espagnol 2022 : cycle et présentation clinique</a> ; <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">CH-CHUV-FEVER — Page 3, conduite devant fièvre et plan antibiotique, 2024</a>.</p></template>
<template data-pop="pareto-d77-7" data-title="Essentiel — 7. Syndromes : séparer ce qui peut coexister"><p>Les regroupements cliniques orientent ; ils ne démontrent pas un mécanisme unique de cytopénie.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-MEC — Revue HSS 2021 : introduction, tableau 1 et mécanismes</a>.</p></template>
<template data-pop="d77-exp-8" data-title="Comprendre — 8. Diagnostic positif : croiser des preuves différentes"><p><b>Lecture expliquée.</b> Croiser preuve parasitaire et atteinte hépatoportale ; sérologie seule insuffisante pour l’activité.</p><p>La preuve de schistosomiase repose notamment sur la mise en évidence d’œufs dans les selles, les urines ou un tissu selon la situation. La sensibilité d’un prélèvement peut être faible ; une négativité n’éteint pas une forte suspicion. Les examens répétés, la sérologie et les techniques spécialisées sont choisis avec le laboratoire et le spécialiste.</p><p>La sérologie est utile dans l’enquête d’exposition et le dépistage ciblé, mais peut rester positive longtemps. Elle ne suffit pas à démontrer une infection active, la guérison ou une fibrose splénique. Une image d’œuf publiée pour apprendre sa morphologie n’est pas un résultat du patient.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-605/diagnostic-de-schistosomiase-urinaire-par-l-identification-de-miracidiums-de-schistosoma-haematobium" target="_blank" rel="noopener">CH-RMS-DX — Résumé, diagnostic et limites du cas urinaire, 2018</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993612/" target="_blank" rel="noopener">INT-HSS-DX — Revue HSS 2021 : résultats diagnostiques et tableaux 2–3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe D77, inclusion et usage astérisque</a>.</p></template>
<template data-pop="pareto-d77-8" data-title="Essentiel — 8. Diagnostic positif : croiser des preuves différentes"><p>Croiser preuve parasitaire et atteinte hépatoportale ; sérologie seule insuffisante pour l’activité.</p><div class="key"><b>À retenir.</b> Revenir au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">EU-DX — Consensus espagnol 2022 : diagnostic, tableau 2 et limites</a>.</p></template>
