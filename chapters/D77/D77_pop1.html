<template data-pop="d77-sources-guides" data-title="Sources du cours et règle de choix"><h3>Les sources lues</h3><p>Chaque affirmation de ce cours renvoie à une source réellement lue, datée du 15.10.2026. Le tableau les classe par rôle ; les limites indiquées sont celles du dossier de recherche.</p><table class="t"><tr><th>Source</th><th>Rôle dans le cours</th><th>Limite</th></tr><tr><td><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">BfArM CIM-10-GM 2024</a>, <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-b65-b83.htm" target="_blank" rel="noopener">BfArM B65.-</a>, <a href="https://bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html?nn=940248" target="_blank" rel="noopener">BfArM dague et astérisque</a>, <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS CIM-10-GM 2024</a></td><td>Codage D77*, B65.-†, D73.-</td><td>Version allemande ; intitulé français tiré de l’OFS ; règles suisses de codage non lues</td></tr><tr><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">consensus espagnol 2022</a></td><td>Clinique, diagnostic, praziquantel, suivi</td><td>Consensus espagnol d’experts ; accès au praziquantel propre à l’Espagne</td></tr><tr><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8726476/" target="_blank" rel="noopener">série européenne TIPS 2021</a></td><td>HSS en Europe, bêtabloquants, TIPS, chirurgie</td><td>Série rétrospective de 13 patients, sans témoin</td></tr><tr><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10176249/" target="_blank" rel="noopener">étude hématologique européenne 2023</a></td><td>Hémogramme des infectés</td><td>Rétrospectif, sans groupe témoin</td></tr><tr><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8298754/" target="_blank" rel="noopener">Suttorp 2021</a>, <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12865113/" target="_blank" rel="noopener">revue radiologique 2026</a></td><td>Splénomégalie, hypersplénisme, mécanismes</td><td>Revues narratives non spécifiques à la bilharziose</td></tr><tr><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">Baveno VII 2022</a></td><td>Hypertension portale, hémorragie variqueuse, PSVD</td><td>Aucune recommandation propre à la schistosomose</td></tr><tr><td><a href="https://pubmed.ncbi.nlm.nih.gov/28924741/" target="_blank" rel="noopener">Swiss TPH 2018</a></td><td>Données suisses</td><td>Résumé seul lu ; petit échantillon</td></tr><tr><td><a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Recommandations_pour_la_prevention_des_infections_apres_splenectomie_dans_le_service_de_chirurgie_viscerale_du_CHUV_TZ_19.09.2024.pdf" target="_blank" rel="noopener">protocole asplénie CHUV 2024</a></td><td>Prévention après splénectomie</td><td>Protocole hospitalier ; bulletins OFSP non relus</td></tr><tr><td><a href="https://amiko.oddb.org (GTIN 7680470250018)" target="_blank" rel="noopener">FI propranolol</a>, <a href="https://amiko.oddb.org (GTIN 7680576230013)" target="_blank" rel="noopener">FI carvédilol</a></td><td>Informations professionnelles suisses</td><td>Une seule spécialité consultée par substance</td></tr></table><h3>Règle de choix en cas de désaccord</h3><p>Lorsque deux sources divergent, la source primaire applicable la plus récente l’emporte, et le désaccord est présenté dans une fenêtre. Pour le dépistage, l’ECDC 2018, le consensus espagnol et le Swiss TPH donnent trois positions que le texte rapporte sans les fusionner. Aucune recommandation américaine ne fonde une conduite. Le présent cours est une revue par intelligence artificielle ; il n’a pas reçu de validation médicale humaine.</p></template>
<template data-pop="d77-codage" data-title="Dague et astérisque : D77* et B65.-†"><h3>Le principe</h3><p>Certaines maladies ont deux dimensions : une cause (l’étiologie) et une manifestation dans un organe. La CIM-10-GM les code toutes les deux. La <b>dague</b> (†) marque le code de l’étiologie, qui est le code primaire. L’<b>astérisque</b> (*) marque la manifestation, qui est le code secondaire et qui ne doit jamais être utilisé seul.</p><h3>Application</h3><p>D77* est une manifestation. Sa seule inclusion est la fibrose de la rate au cours de la schistosomiase, dont l’étiologie se code en B65.-† : B65.0 pour <i>S. haematobium</i>, B65.1 pour <i>S. mansoni</i>, B65.2 pour <i>S. japonicum</i>, B65.3 pour la dermatite cercarienne, B65.8 pour les autres espèces et B65.9 sans précision. Un dossier qui ne porterait que D77 serait donc incomplet.</p><h3>Pourquoi cette précision</h3><p>Sans la cause, la même rate fibreuse se coderait D73.8, qui inclut la fibrose de la rate sans cause classée ailleurs. Le choix du code traduit donc une connaissance clinique : savoir que la rate est fibrosée <i>à cause</i> d’une schistosomiase. Les règles suisses de codage de l’OFS n’ont pas été relues ; les règles citées sont celles du BfArM.</p></template>
<template data-pop="d77-hss" data-title="Schistosomose hépatosplénique"><h3>Définition</h3><p>La schistosomose (bilharziose) est une parasitose aiguë pouvant devenir chronique, due à un trématode du genre <i>Schistosoma</i>. La forme chronique grave, hépatosplénique, associe fibrose périportale, hypertension portale, varices œsophagiennes et splénomégalie avec hypersplénisme.</p><h3>Fréquence</h3><p>Elle touche 4 à 8 % des personnes infectées. Parmi les infections chroniques, 40 à 60 % sont asymptomatiques ou paucisymptomatiques, et 5 à 10 % évoluent vers des complications graves : la grande majorité des infectés ne présente donc jamais une forme hépatosplénique, mais les migrants ont plus souvent une maladie évoluée.</p><h3>Pourquoi la reconnaître</h3><p>La forme hépatosplénique tue par l’hémorragie variqueuse, alors que la fonction hépatique est encore conservée. La confondre avec une cirrhose conduit à chercher un facteur hépatique qui n’existe pas et à retarder la prévention du saignement.</p></template>
<template data-pop="d77-hypersplenisme" data-title="Hypersplénisme et splénomégalie"><h3>Structure et fonction</h3><p>La splénomégalie décrit le volume de la rate. L’hypersplénisme décrit son comportement : une ou plusieurs lignées sanguines baissent de façon significative, avec une splénomégalie et une augmentation compensatrice des précurseurs médullaires correspondants. La moelle fabrique donc davantage, mais le sang périphérique en reçoit moins.</p><h3>Pourquoi cette définition</h3><p>La condition médullaire distingue l’hypersplénisme d’une insuffisance de la moelle. Si les précurseurs étaient bas, on parlerait d’aplasie ou d’infiltration médullaire, pas de séquestration splénique. Aucun seuil chiffré propre de l’hypersplénisme (plaquettes, leucocytes) ne figure dans les sources lues, et aucune recommandation européenne lue ne fixe d’indication formelle de splénectomie pour hypersplénisme isolé.</p><h3>Conséquence pratique</h3><p>Dans la HSS, la thrombopénie est le signe biologique de l’hypersplénisme. Elle conditionne les gestes invasifs, la voie vaccinale (seuil de 20 G/L pour la voie intramusculaire) et le risque de thrombose après splénectomie lorsque les plaquettes remontent.</p></template>
<template data-pop="d77-hemogramme-etude" data-title="L’étude européenne sur l’hémogramme"><h3>Ce qu’elle montre</h3><p>Sept centres européens de médecine des voyages ont inclus 382 sujets porteurs d’œufs. Les adultes avaient une hémoglobine, un VGM, des plaquettes (225 contre 275 G/L) et des leucocytes (5,74 contre 7,25 G/L) plus bas que les références, et des éosinophiles plus élevés (0,47 contre 0,25 G/L). Les plaquettes étaient plus basses de 48 G/L chez les migrants que chez les voyageurs.</p><h3>Comment la lire</h3><p>Les moyennes cachent une grande hétérogénéité, car la plupart des infectés ont peu d’anomalies. Les auteurs concluent que l’hémogramme ne peut pas servir de marqueur diagnostique de substitution. Dans notre cas, 58 G/L de plaquettes et 3,1 G/L de leucocytes sont nettement inférieurs aux moyennes de l’étude et traduisent donc une maladie avancée plutôt qu’une infection récente.</p></template>
<template data-pop="d77-especes" data-title="Espèces, répartition et tropisme"><h3>Pourquoi l’espèce compte</h3><p>L’atteinte d’organe dépend de l’espèce : <i>S. haematobium</i> touche les voies urogénitales, alors que <i>S. mansoni</i> et <i>S. japonicum</i> produisent la maladie intestinale, l’inflammation hépatosplénique et la fibrose hépatique. L’espèce détermine aussi la dose de praziquantel (40 mg/kg ou 60 mg/kg).</p><h3>Répartition</h3><p><i>S. mansoni</i> est présent en Afrique subsaharienne, dans le bassin du Nil, au Brésil et aux Caraïbes ; <i>S. japonicum</i> en Chine (Yangtsé), aux Philippines et en Indonésie ; <i>S. mekongi</i> au Laos et au Cambodge ; <i>S. intercalatum</i> et <i>S. guineensis</i> en Afrique centrale. L’espèce se reconnaît à la morphologie de l’œuf dans les selles, l’urine ou un tissu. En cas de sérologie seule, l’espèce reste indéterminée et la dose retenue est celle de 40 mg/kg.</p></template>
<template data-pop="d77-phases" data-title="Phase aiguë et phase chronique"><h3>Phase aiguë : syndrome de Katayama</h3><p>Elle survient une à huit semaines (jusqu’à près de trois mois) après l’infection, avec fièvre, céphalées, arthromyalgies, douleur de l’hypocondre droit, diarrhée, toux sèche, urticaire, hépatosplénomégalie douloureuse et éosinophilie quasi constante, habituellement supérieure à 1000/µL. Les examens parasitologiques ne deviennent utiles que 30 à 50 jours après l’infection.</p><h3>Phase chronique</h3><p>Plus de trois mois après l’infection, c’est la forme le plus souvent diagnostiquée ; elle est asymptomatique ou paucisymptomatique dans 40 à 60 % des cas.</p><h3>Conséquence thérapeutique</h3><p>Le praziquantel seul est contre-indiqué en phase aiguë symptomatique, car il peut aggraver le tableau ; en revanche il est le traitement de la phase chronique.</p></template>
<template data-pop="d77-cycle" data-title="Cycle du parasite"><h3>Étapes</h3><table class="t"><tr><th>Étape</th><th>Lieu</th><th>Délai</th></tr><tr><td>Œufs dans l’eau douce</td><td>Urine (<i>S. haematobium</i>) ou selles (autres espèces)</td><td>—</td></tr><tr><td>Miracidiums pénètrent l’escargot</td><td>Hôte intermédiaire</td><td>4 à 6 semaines jusqu’aux cercaires</td></tr><tr><td>Cercaires pénètrent la peau</td><td>Humain, devenant schistosomules</td><td>—</td></tr><tr><td>Migration jusqu’au foie</td><td>Par le sang</td><td>Adultes en 2 à 4 semaines</td></tr><tr><td>Couples de vers dans les veinules mésentériques</td><td>Par la circulation porte (vésicales pour <i>S. haematobium</i>)</td><td>Ponte 1 à 3 mois après l’infection</td></tr></table><h3>Conséquence clinique</h3><p>Les adultes vivent en général cinq à sept ans, parfois trente. Un patient infecté jeune peut donc être encore porteur d’œufs des années après avoir quitté la zone d’endémie. L’exposition ancienne n’exclut pas une maladie active.</p></template>
<template data-pop="d77-fibrose" data-title="Fibrose périportale en tuyau de pipe (fibrose de Symmers)"><h3>Mécanisme</h3><p>Les œufs libérés dans le système porte sont piégés par des granulomes. La répétition de cette réaction produit une inflammation chronique, puis une fibrose qui engaine les branches portales. Cette image est la fibrose « en tuyau de pipe », dite fibrose de Symmers. Elle peut apparaître dès 6 ans.</p><h3>Pourquoi elle bloque la pression</h3><p>En épaississant la paroi autour des branches portales, la fibrose augmente la résistance au flux en amont des sinusoïdes. Le sang s’accumule dans la veine splénique et mésentérique, ce qui explique la splénomégalie, les collatérales portosystémiques et les varices. Le parenchyme n’étant pas touché primitivement, le foie continue de fonctionner.</p><h3>Réversibilité</h3><p>La régression de l’atteinte hépatique après praziquantel est souvent retardée et incomplète : la fibrose portale n’est que partiellement réversible.</p></template>
<template data-pop="d77-htp" data-title="Hypertension portale présinusoïdale"><h3>Définition et seuil</h3><p>L’hypertension portale est cliniquement significative à partir d’un gradient de pression veineuse hépatique (HVPG) de 10 mmHg. L’adjectif présinusoïdal indique que l’obstacle se situe avant les sinusoïdes hépatiques.</p><h3>Conséquences</h3><p>Une pression élevée dans le système porte entraîne splénomégalie, collatérales portosystémiques et varices œsophagiennes. Dans la HSS, elle s’accompagne d’une fonction hépatique conservée ; à l’inverse, dans la cirrhose, le parenchyme est atteint.</p><h3>Piège de mesure</h3><p>Dans une hépatopathie à composante présinusoïdale, le HVPG peut sous-estimer l’hypertension portale. Une valeur inférieure à 10 mmHg ne suffit donc pas à écarter des varices dans une HSS.</p></template>
<template data-pop="d77-cytopenies" data-title="Mécanismes des cytopénies de l’hypersplénisme"><h3>Trois explications proposées</h3><p>La revue radiologique de 2026 propose la rétention splénique des cellules par congestion ou hyperémie, la phagocytose accrue par des macrophages spléniques suractivés, et la modulation immunitaire avec suppression médullaire médiées par des cytokines. Ces mécanismes sont des hypothèses générales de la splénomégalie, non des mesures faites dans la bilharziose.</p><h3>Pourquoi les plaquettes baissent en premier</h3><p>Dans la série européenne, les plaquettes avant TIPS allaient de 20 à 144 G/L, et la thrombopénie est le signe biologique de l’hypersplénisme dans la HSS. Les sources lues n’expliquent pas pourquoi cette lignée domine ; l’affirmation reste descriptive.</p><h3>Après dérivation</h3><p>Après TIPS, la thrombopénie persiste (61 ± 34 G/L contre 72 ± 54 G/L avant) : la décompression du système porte ne corrige pas le défaut splénique.</p></template>
<template data-pop="d77-anemie" data-title="Anémie dans la schistosomose"><h3>Fréquence</h3><p>L’anémie est plus fréquente chez l’enfant. Dans l’étude européenne, l’hémoglobine des adultes infectés était inférieure aux références.</p><h3>Mécanismes</h3><p>La maladie intestinale chronique grave peut causer une hémorragie intestinale, une entéropathie exsudative et une anémie ferriprive. D’autres mécanismes sont avancés : perte sanguine directe lors de l’extrusion des œufs et consommation d’érythrocytes par les vers adultes. L’hémolyse intravasculaire chronique de l’hypersplénisme s’y ajoute.</p><h3>Conséquence</h3><p>Une ferritine basse oriente vers une carence en fer, qui se traite selon la leçon D50. L’anémie de la HSS est donc multifactorielle ; traiter le parasite seul ne la corrige pas toujours.</p></template>
<template data-pop="d77-salmonelle" data-title="Portage chronique de Salmonella"><h3>Le constat</h3><p>Les sujets infectés par <i>S. mansoni</i> et <i>S. haematobium</i> peuvent être porteurs chroniques de <i>Salmonella enterica</i>, avec des bactériémies récidivantes.</p><h3>Conséquence clinique</h3><p>Des bactériémies à <i>Salmonella</i> qui récidivent chez un patient venu d’une zone d’endémie doivent faire rechercher une schistosomose. Le mécanisme précis du portage n’est pas détaillé dans les sources lues.</p></template>
<template data-pop="d77-cirrhose" data-title="Distinguer HSS et cirrhose"><h3>Le critère</h3><p>Dans la cirrhose, la fonction hépatique est altérée ; dans la HSS, elle est préservée jusqu’aux stades avancés. Cette différence résulte du siège de la lésion : parenchyme dans la cirrhose, branches portales dans la HSS.</p><h3>Les autres nuances</h3><p>Un patient peut avoir les deux affections, notamment avec une hépatite virale associée : la co-infection VHB ou VHC dégrade le foie après TIPS. Le bilan associe donc sérologies des hépatites virales, tests hépatiques et échographie.</p><h3>Conséquence</h3><p>Une cirrhose décompensée est une réserve de l’indication du propranolol en Suisse (« sauf cirrhose décompensée ») : l’étiologie conditionne ainsi la prescription.</p></template>
<template data-pop="d77-psvd" data-title="Trouble vasculaire porto-sinusoïdal"><h3>Définition</h3><p>Le trouble vasculaire porto-sinusoïdal (PSVD) est une hypertension portale sans cirrhose. Son diagnostic exige l’exclusion de la cirrhose et des autres causes d’hypertension portale, dont la schistosomose. Il est à envisager devant des signes d’hypertension portale avec HVPG inférieur à 10 mmHg, élasticité inférieure à 10 kPa et surface hépatique lisse.</p><h3>Prise en charge</h3><p>Les données sont peu nombreuses ; la prise en charge suit les recommandations de la cirrhose, avec dépistage endoscopique des varices au diagnostic. Les critères non invasifs Baveno établis pour la cirrhose ne s’y appliquent pas.</p><h3>Limite</h3><p>Les recommandations EASL 2026 sur les maladies vasculaires du foie n’ont été lues qu’en résumé ; les repères cités viennent de Baveno VII.</p></template>
<template data-pop="d77-depistage" data-title="Dépistage : trois positions"><h3>Les positions</h3><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td>ECDC 2018</td><td>Probablement efficace et coût-efficace chez les migrants arrivés dans l’UE/EEE depuis moins de cinq ans, selon la charge de maladie du pays d’origine</td></tr><tr><td>Consensus espagnol 2022</td><td>Dépister toute personne à risque, quelle que soit la durée de séjour, et répéter après chaque séjour à risque</td></tr><tr><td>Swiss TPH 2018</td><td>Dépistage systématique des réfugiés venant de zones endémiques</td></tr></table><h3>Comment trancher</h3><p>Aucune recommandation d’une société savante suisse n’a été trouvée. La position européenne la plus récente lue est l’ECDC 2018 ; le consensus espagnol, de 2022, est plus large. Le choix dépend de l’ancienneté de l’exposition : un patient dont l’exposition remonte à plus de cinq ans reste candidat à un dépistage selon le consensus espagnol.</p></template>
