<section class="ilot" id="d77-0"><h2><span class="n">0</span>Question clinique</h2><p>Le cas de ce chapitre est un cas pédagogique fictif ; ses chiffres illustrent les ordres de grandeur des sources citées et ne proviennent d’aucun patient.</p><p>Un homme de 27 ans, originaire d’Érythrée et arrivé en Suisse depuis dix-huit mois, consulte pour une pesanteur de l’hypocondre gauche. Il rapporte un vomissement de sang isolé la semaine précédente. Son abdomen est mou, sans ascite ; la rate déborde largement sous le rebord costal. Les plaquettes mesurent 58 G/L et les leucocytes 3,1 G/L, deux valeurs nettement inférieures à celles des sujets infectés de l’<button class="w" data-k="d77-hemogramme-etude">étude européenne de référence</button>. La bilirubine et les transaminases sont normales, et il n’a jamais bu d’alcool. Aucune hépatite virale n’est connue.</p><p><b>La question est de savoir ce qui produit cette grosse rate et ce qu’il faut faire en premier.</b> Une rate volumineuse avec des cytopénies, des varices œsophagiennes et un foie qui fonctionne encore oriente vers une <button class="w" data-k="d77-hss">bilharziose hépatosplénique</button> plutôt que vers une cirrhose. Le raisonnement suit alors quatre temps. Il traite d’abord le risque hémorragique, car l’hémorragie variqueuse est la complication létale de la maladie. Il prouve ensuite le parasite par des œufs ou une sérologie. Il traite le ver par le <button class="w" data-k="d77-pzq">praziquantel</button> et prévient la récidive du saignement par un <button class="w" data-k="d77-bbns">bêtabloquant non sélectif</button>, une ligature ou, en cas d’échec, un <button class="w" data-k="d77-tips">shunt</button>. Il gère enfin la rate elle-même : l’<button class="w" data-k="d77-hypersplenisme">hypersplénisme</button> rend compte des cytopénies et la splénectomie expose à des infections fulminantes que seul un schéma vaccinal anticipe.</p><p>Le code D77 n’a pas de sens seul. Il décrit la <b>manifestation splénique</b> d’une maladie dont le code principal est ailleurs : la leçon porte donc autant sur le parasite et le foie que sur la rate. Le <button class="w" data-k="d77-codage">système dague-astérisque</button> explique pourquoi.</p><div class="key"><b>Point de départ.</b> Splénomégalie, thrombopénie, leucopénie et varices avec fonction hépatique conservée chez une personne venue d’une zone d’endémie : penser bilharziose hépatosplénique, traiter d’abord le risque hémorragique, puis prouver et traiter le parasite.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">consensus espagnol 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8726476/" target="_blank" rel="noopener">série européenne TIPS 2021</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">BfArM CIM-10-GM 2024</a>.</p></section>
<section class="ilot" id="d77-1"><h2><span class="n">1</span>Définitions et codage</h2><p>Trois notions s’emboîtent : la maladie parasitaire, sa forme chronique grave, et la conséquence splénique que le code D77 désigne. Les distinguer évite de confondre la rate qui grossit, la rate qui détruit trop de cellules et le parasite qui est la cause de l’ensemble.</p><h3>La schistosomose et sa forme hépatosplénique</h3><p>La <button class="w" data-k="d77-hss">schistosomose (bilharziose)</button> est une parasitose aiguë pouvant devenir chronique, due à un trématode du genre <i>Schistosoma</i>. Sa forme chronique grave, la <b>schistosomose hépatosplénique</b> (HSS), associe une fibrose périportale, une hypertension portale, des varices œsophagiennes et une splénomégalie avec hypersplénisme. Elle touche 4 à 8 % des personnes infectées.</p><h3>Splénomégalie et hypersplénisme : deux notions différentes</h3><p>La splénomégalie est une anomalie de structure : la rate est grosse. L’<button class="w" data-k="d77-hypersplenisme">hypersplénisme</button> est une anomalie de fonction : une ou plusieurs lignées sanguines (globules rouges, globules blancs, plaquettes) baissent de façon significative, avec une splénomégalie et une augmentation compensatrice des précurseurs médullaires correspondants. Une rate peut donc être grosse sans hypersplénisme ; le diagnostic d’hypersplénisme exige les trois éléments.</p><h3>Ce que code D77*</h3><p>La CIM-10-GM 2024 définit D77* comme « Autres maladies du sang et des organes hématopoïétiques au cours de maladies classées ailleurs ». Le code n’a aucune subdivision et une seule inclusion : la <b>fibrose de la rate au cours de la schistosomiase [bilharziose] (B65.-†)</b>. Le <button class="w" data-k="d77-codage">principe dague-astérisque</button> impose de coder d’abord l’étiologie avec la dague (†), puis la manifestation avec l’astérisque (*) ; l’astérisque ne s’emploie jamais seul.</p><table class="t"><tr><th>Code</th><th>Ce qu’il désigne</th><th>Quand l’utiliser</th></tr><tr><td>B65.- †</td><td>Schistosomiase : B65.0 <i>S. haematobium</i>, B65.1 <i>S. mansoni</i>, B65.2 <i>S. japonicum</i>, B65.3 dermatite cercarienne, B65.8 autres espèces, B65.9 sans précision</td><td>Toujours en premier : c’est l’étiologie</td></tr><tr><td>D77 *</td><td>Fibrose de la rate au cours de la schistosomiase</td><td>Seulement avec B65.-†, jamais seul</td></tr><tr><td>D73.8</td><td>Autres maladies de la rate, dont la fibrose de la rate sans cause classée ailleurs</td><td>Fibrose splénique sans cause identifiée</td></tr><tr><td>D73.1</td><td>Hypersplénisme</td><td>Hypersplénisme isolé, sans schistosomiase établie</td></tr><tr><td>D73.2</td><td>Splénomégalie congestive chronique</td><td>Rate congestive sans cause classée ailleurs</td></tr></table><p>Le tableau montre qu’un même organe, la rate fibreuse, reçoit un code différent selon que l’on connaît ou non la cause. La conséquence pédagogique est directe : D77 ne décrit pas une maladie hématologique autonome. Il rappelle que la rate d’un patient venu d’une zone d’endémie est d’abord celle d’une maladie parasitaire.</p><div class="key"><b>À retenir.</b> Splénomégalie (structure) et hypersplénisme (fonction) ne sont pas synonymes. D77* se code toujours après B65.-†.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">BfArM CIM-10-GM 2024</a> ; <a href="https://bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html?nn=940248" target="_blank" rel="noopener">BfArM dague et astérisque</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-b65-b83.htm" target="_blank" rel="noopener">BfArM B65.-</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8298754/" target="_blank" rel="noopener">Suttorp 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">consensus espagnol 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8726476/" target="_blank" rel="noopener">série européenne TIPS 2021</a>.</p></section>
<section class="ilot" id="d77-2"><h2><span class="n">2</span>Épidémiologie, de l’Afrique à la Suisse</h2><p>L’épidémiologie répond à une question de médecine de premier recours : devant quel patient faut-il penser à cette maladie ? La réponse tient dans l’origine géographique et dans l’ancienneté de l’exposition.</p><h3>Dans le monde</h3><p>Selon l’OMS (2019), 700 millions de personnes vivent en zone à risque et au moins 236 millions sont infectées. La maladie est endémique dans plus de 78 pays, et l’Afrique subsaharienne concentre la plus grande part de l’incidence et de la morbimortalité. La charge mondiale de 2019 s’élève à 11 500 décès et 1,64 million d’années de vie ajustées sur l’incapacité ; des données de 2003 estimaient jusqu’à 130 000 décès annuels en Afrique par hémorragie variqueuse. Ces chiffres expliquent la priorité donnée à la prévention du saignement dans la prise en charge.</p><h3>En Europe et en Suisse</h3><p>La séroprévalence est estimée à 18 % chez les migrants de pays endémiques et à 24 % chez les migrants subsahariens. Une transmission autochtone a été décrite en Corse (rivière Cavu, 2013) et à Almería. En Suisse, l’étude du Swiss TPH (Bâle) a porté sur 107 réfugiés érythréens asymptomatiques arrivés depuis moins de 24 mois : le test urinaire d’<button class="w" data-k="d77-cca">antigène cathodique circulant</button> (CCA) pour <i>S. mansoni</i> était positif chez 40,2 % d’entre eux et des œufs étaient retrouvés dans les selles chez 21,5 %. Les auteurs recommandent un dépistage systématique des réfugiés venant de zones endémiques. L’échantillon est petit et l’étude transversale : elle indique l’ordre de grandeur, non un taux national.</p><p>Une série européenne de HSS traitées par shunt (Allemagne et Italie, 2012–2020) donne le profil de ceux qui arrivent au stade grave : 13 patients, âge médian de 27 ans, 77 % d’hommes, majoritairement originaires d’Érythrée, de Guinée et de Sierra Leone. Le patient de notre cas correspond donc à un profil réel.</p><div class="key"><b>À retenir.</b> En Suisse, la bilharziose touche surtout des personnes venues d’Afrique subsaharienne ; dans l’étude du Swiss TPH, 40,2 % des réfugiés érythréens récents avaient un test CCA positif.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">consensus espagnol 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8726476/" target="_blank" rel="noopener">série européenne TIPS 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28924741/" target="_blank" rel="noopener">Swiss TPH 2018</a>.</p></section>
<section class="ilot" id="d77-3"><h2><span class="n">3</span>Du parasite à la rate fibreuse</h2><p>Comprendre pourquoi la rate devient fibreuse et hypersplénique revient à suivre une chaîne de causes : le ver pond, l’œuf provoque une inflammation, l’inflammation fibrose le foie, la fibrose bloque la veine porte, et la rate subit la pression. Chaque maillon explique un signe que le médecin trouvera à l’examen.</p><h3>Le cycle du parasite</h3><p>Les œufs gagnent l’eau douce par l’urine (<i>S. haematobium</i>) ou par les selles (les autres espèces) et libèrent des miracidiums qui pénètrent un escargot, hôte intermédiaire. Quatre à six semaines plus tard, l’escargot libère des cercaires. Elles traversent la peau humaine, deviennent des schistosomules, migrent par le sang jusqu’au foie, et y deviennent adultes en deux à quatre semaines. Les couples de vers gagnent ensuite, par la circulation porte, les veinules mésentériques (vésicales pour <i>S. haematobium</i>). La ponte débute un à trois mois après l’infection. Les adultes vivent en général cinq à sept ans, parfois jusqu’à trente ans, si bien qu’un patient peut pondre des œufs des années après avoir quitté la zone d’endémie. Le <button class="w" data-k="d77-cycle">cycle complet</button> est détaillé dans la fenêtre.</p><h3>L’œuf, et non le ver, fait la lésion</h3><p>Ce sont les <b>œufs</b> qui induisent principalement la réponse immunitaire et les lésions d’organe. Les œufs sécrètent des glycoprotéines antigéniques qui leur permettent de traverser la paroi ; ces antigènes induisent des granulomes qui piègent les œufs dans le tissu. Les œufs qui parviennent dans le système porte provoquent une inflammation chronique, puis une <button class="w" data-k="d77-fibrose">fibrose périportale</button> caractéristique, dite « en tuyau de pipe » (fibrose de Symmers).</p><h3>L’hypertension portale présinusoïdale</h3><p>La fibrose se développe autour des branches de la veine porte, en amont des sinusoïdes hépatiques : l’hypertension portale est dite <button class="w" data-k="d77-htp">présinusoïdale</button>. Elle entraîne une splénomégalie, des collatérales portosystémiques et des varices œsophagiennes. Le parenchyme hépatique n’est pas atteint primitivement, ce qui explique que la fonction hépatique reste habituellement stable jusqu’aux stades avancés, à l’inverse de la cirrhose. Ce point guide tout le diagnostic différentiel.</p><h3>La rate fibreuse et hypersplénique</h3><p>La cirrhose et la schistosomose sont les principales causes mondiales d’hypertension portale. La splénomégalie secondaire se caractérise par une pulpe rouge augmentée, une <b>fibrose consécutive</b> et une accumulation de macrophages chargés d’hémosidérine ; les nodules sidérotiques (corps de Gamna-Gandy) sont visibles en IRM sous forme de foyers ponctués en hyposignal T1 et T2. L’hypersplénisme est une manifestation fréquente de l’hypertension portale. Les mécanismes proposés des <button class="w" data-k="d77-cytopenies">cytopénies</button> sont la rétention splénique des cellules par congestion, la phagocytose accrue par des macrophages spléniques suractivés, ainsi que la modulation immunitaire et la suppression médullaire médiées par des cytokines. Dans la HSS, la thrombopénie est le signe biologique de l’hypersplénisme. L’hypersplénisme s’associe aussi à une hémolyse intravasculaire chronique qui peut activer les plaquettes et favoriser la thrombose.</p><div class="alert"><b>Limite de la source.</b> L’histologie propre de la fibrose splénique schistosomienne, distincte de la splénomégalie congestive générale, n’a été documentée dans aucune source lue. La description ci-dessus est celle de la splénomégalie d’hypertension portale ; elle s’applique à la bilharziose par la voie commune de l’hypertension portale, non par une démonstration spécifique.</div><h3>Autres conséquences hématologiques</h3><p>L’<button class="w" data-k="d77-anemie">anémie</button> est plus fréquente chez l’enfant. La maladie intestinale chronique grave peut causer une hémorragie intestinale, une entéropathie exsudative et une anémie ferriprive. D’autres mécanismes sont avancés pour la baisse d’hémoglobine : perte sanguine directe lors de l’extrusion des œufs et consommation d’érythrocytes par les vers adultes. Les sujets infectés par <i>S. mansoni</i> et <i>S. haematobium</i> peuvent enfin être porteurs chroniques de <button class="w" data-k="d77-salmonelle"><i>Salmonella enterica</i></button>, avec des bactériémies récidivantes.</p><table class="t"><tr><th>Maillon de la chaîne</th><th>Conséquence</th><th>Signe que le médecin retrouve</th></tr><tr><td>Œufs dans le système porte</td><td>Granulomes puis fibrose périportale</td><td>Échographie : fibrose périportale</td></tr><tr><td>Fibrose présinusoïdale</td><td>Hypertension portale, foie au parenchyme préservé</td><td>Varices, collatérales, bilan hépatique conservé</td></tr><tr><td>Congestion de la rate</td><td>Splénomégalie, fibrose de la pulpe rouge, hémosidérine</td><td>Grosse rate ; nodules sidérotiques en IRM</td></tr><tr><td>Rétention et phagocytose spléniques</td><td>Hypersplénisme</td><td>Thrombopénie, leucopénie, parfois anémie</td></tr></table><p>Le tableau relie chaque étape à son signe clinique ou paraclinique : lire la rate, c’est lire le point où la chaîne s’est bloquée.</p><div class="key"><b>À retenir.</b> L’œuf fait la lésion, la fibrose est présinusoïdale, le foie reste fonctionnel et la rate subit la congestion. D’où le trio splénomégalie, cytopénies et varices avec un bilan hépatique conservé.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">consensus espagnol 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8726476/" target="_blank" rel="noopener">série européenne TIPS 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10176249/" target="_blank" rel="noopener">étude hématologique européenne 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8298754/" target="_blank" rel="noopener">Suttorp 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12865113/" target="_blank" rel="noopener">revue radiologique 2026</a>.</p></section>
<section class="ilot" id="d77-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>La seule cause de la maladie est l’infection par un <i>Schistosoma</i> ; la question utile est de savoir qui est exposé et qui progresse vers la forme hépatosplénique.</p><h3>Exposition</h3><p>L’infection résulte du contact cutané avec de l’eau douce contenant des cercaires, lors d’une baignade ou d’un travail agricole en zone d’endémie. Une exposition prolongée et répétée caractérise les populations endémiques, mais une exposition brève de voyageur suffit à établir une infection chronique. Les migrants ont plus souvent une exposition ancienne et une maladie évoluée au stade hépatosplénique, ce qui explique que leurs plaquettes et leurs leucocytes soient plus bas que chez les voyageurs. Les <button class="w" data-k="d77-especes">espèces</button> responsables de la maladie hépatosplénique sont surtout <i>S. mansoni</i> et <i>S. japonicum</i>.</p><h3>Progression vers la forme hépatosplénique</h3><p>La charge parasitaire et ovulaire, des facteurs génétiques, l’infection dans l’enfance et l’immunomodulation T interviennent dans le passage à la HSS ; leur interaction reste mal comprise. Une fibrose périportale peut apparaître dès l’âge de 6 ans. Cette évolution lente justifie de ne pas attendre les symptômes : la plupart des infections chroniques sont asymptomatiques ou paucisymptomatiques (40 à 60 %), et 5 à 10 % évoluent vers des complications graves.</p><div class="trap"><span class="k">Piège</span> Une exposition brève ne protège pas : un voyageur peut développer une infection chronique. Inversement, l’absence de symptômes ne signifie pas absence de lésions, puisque la maladie est le plus souvent paucisymptomatique.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">consensus espagnol 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8726476/" target="_blank" rel="noopener">série européenne TIPS 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10176249/" target="_blank" rel="noopener">étude hématologique européenne 2023</a>.</p></section>
<section class="ilot" id="d77-5"><h2><span class="n">5</span>Interroger</h2><p>L’anamnèse cherche l’exposition et les conséquences de l’hypertension portale. Quelques questions ciblées suffisent à orienter le diagnostic.</p><ul><li><b>Géographie et eau.</b> Pays d’origine, de transit et de séjour ; contacts avec l’eau douce (rivières, lacs, bassins d’irrigation). C’est la question qui rend la maladie plausible.</li><li><b>Saignement digestif.</b> Hématémèse, méléna, rectorragie, qui signalent des varices œsophagiennes ou rectales.</li><li><b>Gêne splénique.</b> Pesanteur de l’hypocondre gauche ou de l’étage sus-mésocolique, due au volume de la rate.</li><li><b>Signes intestinaux et urinaires.</b> Diarrhée, douleurs coliques et hématurie terminale. Cette dernière est à rechercher activement, car les migrants la banalisent souvent.</li><li><b>Dyspnée.</b> Elle évoque une hypertension artérielle pulmonaire par embolisation d’œufs à travers les shunts porto-caves.</li></ul><p>Le patient de notre cas a rapporté un seul vomissement de sang : cette donnée suffit à classer la situation comme à risque hémorragique avant toute autre démarche.</p><div class="key"><b>À retenir.</b> Deux questions indispensables : où et quand a eu lieu le contact avec l’eau douce, et y a-t-il eu un saignement digestif.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">consensus espagnol 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28924741/" target="_blank" rel="noopener">Swiss TPH 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8726476/" target="_blank" rel="noopener">série européenne TIPS 2021</a>.</p></section>
<section class="ilot" id="d77-6"><h2><span class="n">6</span>Examiner</h2><p>L’examen cherche le volume de la rate, l’état du foie et les signes d’hypertension portale.</p><ul><li><b>Foie.</b> Une hépatomégalie nodulaire, ferme, est palpable et souvent associée à la splénomégalie.</li><li><b>Rate.</b> Dans la série européenne de HSS, la longueur splénique allait de 130 à 297 mm ; la palpation donne l’ordre de grandeur, l’échographie la mesure.</li><li><b>Hypertension portale.</b> Ascite et hématémèse sur varices, pouvant conduire rapidement au décès. Dans la série européenne, à prédominance <i>S. mansoni</i>, aucune ascite n’a été documentée, contrairement aux cohortes de <i>S. japonicum</i> ; les auteurs y voient un mécanisme légèrement différent. L’absence d’ascite n’exclut donc pas une hypertension portale sévère.</li></ul><div class="trap"><span class="k">Piège</span> Chercher des signes d’insuffisance hépatique (ictère, ascite) comme critère d’une maladie du foie grave est trompeur ici : la fonction hépatique reste conservée jusqu’aux stades avancés, alors que les varices peuvent déjà saigner.</div><div class="key"><b>À retenir.</b> Grosse rate, foie ferme, ascite inconstante : la clinique de la HSS ressemble à celle d’une hypertension portale sans insuffisance hépatique.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9249679/" target="_blank" rel="noopener">consensus espagnol 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8726476/" target="_blank" rel="noopener">série européenne TIPS 2021</a>.</p><button class="pareto-btn ui" data-k="pareto-d77-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
