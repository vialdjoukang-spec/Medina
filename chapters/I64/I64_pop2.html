<template data-pop="i64-mrs" data-title="mRS : handicap global, pas portrait complet"><p data-src="R3">La mRS va de 0, absence de symptôme, à 6, décès. Les niveaux intermédiaires décrivent symptômes sans handicap significatif, limitation avec autonomie, besoin d’aide avec marche possible, dépendance plus importante et dépendance sévère.</p>
<p data-src="R3">Établir le niveau antérieur et l’évolution, puis compléter par cognition, humeur, fatigue, communication et objectifs de vie. Une différence de score n’explique pas à elle seule ce que la personne peut reprendre au quotidien.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a>.</p></template>
<template data-pop="i64-alteplase" data-title="Altéplase : 70 kg n’est qu’un exemple de calcul"><p data-src="R1">Pour 70 kg : 0,9 mg/kg donne 63 mg ; 6,3 mg en bolus et 56,7 mg sur 60 minutes. À 1 mg/ml, les mêmes nombres correspondent aux volumes en ml. Le maximum total est 90 mg.</p>
<p data-src="R1">Vérifier éligibilité, poids, concentration et dispositif ; la dose d’AVC n’est pas celle d’un IAM ou d’une embolie pulmonaire. Ne pas mélanger avec héparine ou autres médicaments ; surveiller hémorragie et angio-œdème.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a>.</p></template>
<template data-pop="i64-tenecteplase" data-title="Metalyse : paliers suisses, pas dose coronarienne"><p data-src="R2,R9">La FI suisse du flacon 25 mg/5 000 U donne 15, 17,5, 20, 22,5 ou 25 mg selon les paliers de poids. À 5 mg/ml, les volumes sont 3, 3,5, 4, 4,5 ou 5 ml. Le bolus dure 5–10 secondes.</p>
<p data-src="R2,R9">L’ESO décrit 0,25 mg/kg, maximum 25 mg, et déconseille 0,4 mg/kg. Afficher cette différence protège d’une fusion involontaire des règles. La présentation IAM et les unités d’autres thrombolytiques ne sont pas substituables.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069183/">R9 — ESO, recommandation accélérée ténectéplase 2023</a>.</p></template>
<template data-pop="i64-praxbind" data-title="Praxbind : neutraliser le dabigatran"><p data-src="R15">5 g IV en deux flacons de 2,5 g ; perfusions successives de 5–10 minutes chacune ou bolus selon FI. Réservé aux conditions de réversion urgente du dabigatran, pas à tout saignement sous tout anticoagulant.</p>
<p data-src="R15">Surveiller clinique et coagulation, car une activité peut réapparaître. Une nouvelle dose exige les conditions précisées par la FI ; la dose quotidienne maximale n’est pas établie. La réversion ne supprime pas le risque thrombotique de la maladie initiale.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680658040011">R15 — FI suisse Praxbind, GTIN 7680658040011</a>.</p></template>
<template data-pop="i64-pcc" data-title="Beriplex : une table de produit, pas de classe entière"><p data-src="R16">L’INR initial détermine 25, 35 ou 50 UI FIX/kg pour les trois plages de la FI, avec maximum unique 5 000 UI. Débit maximal 3 UI/kg/min et 210 UI/min. Contrôler INR et saignement, sans répétition automatique.</p>
<p data-src="R16">Une vitamine K associée soutient la correction ultérieure. Les tables d’un autre concentré ne sont pas copiées. Vérifier hypersensibilité, HIT, risque thrombotique et coagulopathie de consommation ; documenter le produit plasmatique administré.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680006650015">R16 — FI suisse Beriplex P/N, GTIN 7680006650015</a>.</p></template>
<template data-pop="i64-pression" data-title="Pourquoi les cibles tensionnelles diffèrent"><p data-src="R7,R17">Avant IVT : sous 185/110 ; après : sous 180/105 pendant 24 heures selon ESO. Après thrombectomie réussie, éviter une cible intensive de PAS sous 140. Dans certaines HIC précoces petites/modérées, une cible sous 140 peut être discutée.</p>
<p data-src="R7,R17">La dose d’urapidil se titre à la situation et à la réponse ; le schéma général de FI n’est pas une consigne automatique d’AVC. Observer l’état neurologique et éviter les chutes brutales, particulièrement si la perfusion dépend des collatérales.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/">R7 — ESO : mise à jour 2025 de la pression artérielle, publiée en 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680660120015">R17 — FI suisse Urapidil Stragen IV, GTIN 7680660120015</a>.</p></template>
<template data-pop="i64-antiagregants" data-title="Prévention : ne pas effacer les écarts entre sources"><p data-src="R3,R18,R20">Aspirine Cardio indique 300 mg/j après AIT dans la FI relue ; le protocole bernois utilise notamment 100 mg/j en prévention secondaire. Clopidogrel Axapharm est à 75 mg/j et sa FI ne recommande pas les sept premiers jours après AVC.</p>
<p data-src="R3,R18,R20">La double antiagrégation précoce courte relève de critères de recommandations chez certains AVC mineurs/AIT à haut risque. Elle ne doit pas être présentée comme autorisée de façon identique par toutes les FI, ni prolongée automatiquement.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680659570012">R18 — FI suisse Clopidogrel Axapharm, GTIN 7680659570012</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680517950406">R20 — FI suisse Aspirine Cardio, GTIN 7680517950406</a>.</p></template>
<template data-pop="i64-autoregulation" data-title="Autorégulation et collatérales"><p data-src="R26,R7">Les vaisseaux modifient leur diamètre pour maintenir le débit malgré les variations de pression ; les collatérales redistribuent une partie du flux. Ces mécanismes ont des limites et varient selon l’individu et la maladie vasculaire.</p>
<p data-src="R26,R7">Une courbe physiologique n’est pas une ordonnance de PA dans l’AVC. Une baisse trop forte peut diminuer la perfusion d’une pénombre, tandis que certaines HIC bénéficient d’une stratégie de baisse contrôlée. Le type, le traitement et la surveillance déterminent la cible.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/introduction-a-la-physiopathologie-et-au-traitement-des-maladies-neurologiques/chapitre-27-regulation-de-la-circulation-cerebrale-et-ischemie-cerebrale">R26 — CEN, chapitre 27 : régulation de la circulation cérébrale et ischémie</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/">R7 — ESO : mise à jour 2025 de la pression artérielle, publiée en 2026</a>.</p></template>
<template data-pop="i64-energie" data-title="Excitotoxicité : un mécanisme, pas un traitement établi"><p data-src="R22,R26">La privation d’oxygène et de glucose réduit l’ATP, perturbe les transports et augmente le glutamate extracellulaire. L’activation NMDA et l’entrée calcique peuvent participer à des lésions retardées.</p>
<p data-src="R22,R26">Les modèles hippocampiques montrent une vulnérabilité cellulaire variable. La traduction thérapeutique humaine des antagonistes NMDA a déçu ; la plausibilité biologique ne dispense pas d’un essai clinique montrant un bénéfice utile.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.medecinesciences.org/articles/medsci/pdf/2008/03/medsci2008242p185.pdf">R22 — Benquet, Gee, Gerber : ischémie, NMDA et mort neuronale retardée, 2008</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/introduction-a-la-physiopathologie-et-au-traitement-des-maladies-neurologiques/chapitre-27-regulation-de-la-circulation-cerebrale-et-ischemie-cerebrale">R26 — CEN, chapitre 27 : régulation de la circulation cérébrale et ischémie</a>.</p></template>
<template data-pop="pareto-i64-definition" data-title="Loi de Pareto — Reconnaître avant de coder"><p data-src="R6,R14">Déficit soudain : suspecter un AVC et activer l’urgence. I64 décrit une nature non documentée, pas un infarctus de cause inconnue. L’imagerie précise le type ; le bilan explique ensuite la cause.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm">R14 — BfArM : CIM-10-GM 2024, I64</a>.</p></template>
<template data-pop="pareto-i64-mecanismes" data-title="Loi de Pareto — Le tissu commande la stratégie"><p data-src="R7,R22,R26">Ischémie : préserver une perfusion et reperfuser si indiqué. Hémorragie : limiter expansion et complications. La même baisse tensionnelle peut avoir des conséquences différentes ; le temps et la physiologie ne se séparent pas.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/">R7 — ESO : mise à jour 2025 de la pression artérielle, publiée en 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.medecinesciences.org/articles/medsci/pdf/2008/03/medsci2008242p185.pdf">R22 — Benquet, Gee, Gerber : ischémie, NMDA et mort neuronale retardée, 2008</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/introduction-a-la-physiopathologie-et-au-traitement-des-maladies-neurologiques/chapitre-27-regulation-de-la-circulation-cerebrale-et-ischemie-cerebrale">R26 — CEN, chapitre 27 : régulation de la circulation cérébrale et ischémie</a>.</p></template>
<template data-pop="pareto-i64-examen" data-title="Loi de Pareto — Décrire au-delà du score"><p data-src="R3,R6">Examiner langage, vision, attention, tronc et équilibre en plus de la force. Documenter l’état antérieur et le handicap réel. Un NIHSS bas ne garantit ni bénignité ni absence d’AVC.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
<template data-pop="pareto-i64-diagnostic" data-title="Loi de Pareto — Imagerie orientée vers une décision"><p data-src="R3,R6">Rechercher sang, lésion, artère occluse et tissu à risque. Un scanner normal précoce ne clôt pas l’enquête. Le bilan étiologique vient compléter la décision urgente, sans la retarder.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
<template data-pop="pareto-i64-urgence" data-title="Loi de Pareto — Gagner du temps utile"><p data-src="R3,R11,R13">144, préalerte, glycémie, dernier état normal et anticoagulants. Stabiliser et imager sans délai inutile. Pas de voie orale avant déglutition, pas d’antithrombotique avant typage.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://swissheart.ch/fr/maladies-et-urgences/maladies-de-c%C5%93ur-et-attaque-c%C3%A9r%C3%A9brale/avc">R11 — Fondation suisse de cardiologie : attaque cérébrale</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf">R13 — Société cérébrovasculaire suisse : phase préhospitalière, 2021</a>.</p></template>
<template data-pop="pareto-i64-reperfusion" data-title="Loi de Pareto — Sélectionner sans attendre"><p data-src="R1,R2,R9,R10">Fenêtre FI de 4,5 heures, produit exact et déficit pertinent. Si thrombectomie possible, organiser en parallèle. Les stratégies tardives exigent leurs propres critères ; elles ne rendent pas le délai indifférent.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069183/">R9 — ESO, recommandation accélérée ténectéplase 2023</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/">R10 — ESO, thrombolyse intraveineuse 2021</a>.</p></template>
<template data-pop="pareto-i64-hemorragie" data-title="Loi de Pareto — Réversion ciblée"><p data-src="R15,R16,R21">Identifier l’anticoagulant, réverser selon produit, surveiller PA et complications et discuter neurochirurgie. Une réduction d’expansion ne suffit pas à promettre un gain fonctionnel.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680658040011">R15 — FI suisse Praxbind, GTIN 7680658040011</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680006650015">R16 — FI suisse Beriplex P/N, GTIN 7680006650015</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://eso-stroke.org/wp-content/uploads/2025-ESO-ICH-guideline-ESOC.pdf">R21 — ESO–EANS 2025 : présentation officielle de la recommandation HIC</a>.</p></template>
<template data-pop="pareto-i64-suivi" data-title="Loi de Pareto — Cause et vie quotidienne"><p data-src="R3,R6">Prévention selon mécanisme, contrôle des facteurs et suivi de la tolérance. Réadaptation motrice, cognitive, langagière et sociale ; fatigue et humeur comptent même si la force s’améliore.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a>.</p></template>
<template data-pop="pareto-i64-pieges" data-title="Loi de Pareto — Garder les distinctions essentielles"><p data-src="R1,R2,R5,R14">Suspicion et confirmation ; nature et cause ; dose AVC et dose IAM ; FI et protocole ; hospitalisation et incidence. Ces distinctions préviennent des erreurs concrètes.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12161988/">R5 — Hänsel et collaborateurs, 2025 : épidémiologie AVC suisse de 2017</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm">R14 — BfArM : CIM-10-GM 2024, I64</a>.</p></template>
<template data-pop="pareto-i64-examens" data-title="Loi de Pareto — Une question clinique par examen"><p data-src="R3,R6,R10">Le scanner recherche le sang, l’angiographie une cible, la diffusion une lésion précoce et la perfusion une sélection particulière. Aucun examen isolé ne décrit toute la maladie.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf">R3 — Bern Stroke Guidelines, version 2026</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-28-item-340-accidents-vasculaires-cerebraux">R6 — Collège des enseignants de neurologie : chapitre 28, item 340, AVC</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/">R10 — ESO, thrombolyse intraveineuse 2021</a>.</p></template>
<template data-pop="pareto-i64-pharma" data-title="Loi de Pareto — Produit, indication, unité, surveillance"><p data-src="R1,R2,R15,R16">Vérifier le produit exact, sa concentration et ses unités. Séparer FI et recommandation. Prévoir hémostase, PA, fonction rénale et surveillance neurologique selon le médicament.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680483130277">R1 — FI suisse Actilyse, GTIN 7680483130277</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680699580019">R2 — FI suisse Metalyse 5000 U, GTIN 7680699580019</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680658040011">R15 — FI suisse Praxbind, GTIN 7680658040011</a> ; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680006650015">R16 — FI suisse Beriplex P/N, GTIN 7680006650015</a>.</p></template>
