lés et pièges</a></li></ol></nav><div class="chap-body"><section class="ilot" id="i64-0"><h2><span class="n">0</span>Reconnaître l’urgence</h2>
<p data-src="R3,R11,R13">Une faiblesse ou un trouble du langage apparaît brutalement : la première tâche est de reconnaître une <b>suspicion d’AVC</b>, de stabiliser les fonctions vitales et d’activer la filière. La nature ischémique ou hémorragique n’est pas décidée par l’intuition clinique. En Suisse, le patient ou son entourage appelle le <b>144</b>, y compris si les symptômes régressent. Le réseau organise le transport vers la structure adaptée ; chercher seul un hôpital ou attendre le médecin du lendemain fait perdre une possibilité thérapeutique.</p>
<p data-src="R1,R2,R3"><b>Vignette pédagogique fictive.</b> Une femme de 74 ans, autonome, présente une aphasie et une faiblesse droite. Son mari l’a vue normale à 07 h 30 ; la découverte a lieu à 08 h 10 et l’arrivée à 08 h 40. La référence de sécurité est le dernier état connu sans symptôme, 07 h 30, pas l’heure d’arrivée. À 08 h 40, 70 minutes se sont écoulées depuis cette référence. L’équipe vérifie les traitements, mesure la glycémie et réalise l’imagerie en urgence ; elle n’attend pas la fin de la fenêtre de 4,5 heures.</p>
<div class="key" data-src="R1,R2,R7"><b>Avant le typage : pas d’aspirine ni de thrombolytique sur la seule impression clinique.</b> Une baisse tensionnelle intensive indifférenciée peut aussi être nocive. L’hypoglycémie et les défaillances vitales se corrigent immédiatement ; cela ne dispense pas de rechercher un AVC persistant.</div>
<button class="w" data-k="i64-horloges">Dernier état normal, découverte, arrivée</button></section>
<section class="ilot" id="i64-1"><h2><span class="n">1</span>Définition et périmètre</h2>
<p data-src="R6,R14">Un accident vasculaire cérébral correspond à une atteinte neurologique d’origine vasculaire, généralement révélée par un déficit focal soudain, parfois par un trouble de vigilance. Il peut s’agir d’un infarctus, lié à une insuffisance de perfusion, ou d’une hémorragie. La distinction repose sur la confrontation clinique et radiologique. Une régression rapide évoque un accident ischémique transitoire, mais un déficit transitoire peut aussi laisser une lésion : la durée seule ne remplace pas l’imagerie.</p>
<p data-src="R14"><b>I64 est une catégorie de documentation</b> pour un AVC non désigné comme hémorragique ou par infarctus. Elle ne constitue pas une étiologie et ne doit pas transformer toute faiblesse non explorée en AVC confirmé. Elle peut rester dans un dossier insuffisamment documenté ; elle n’est donc pas obligatoirement limitée aux premières minutes. Dès que la nature est établie, on documente le diagnostic plus précis. Un infarctus de cause inconnue demeure un infarctus : « cryptogénique » n’est pas synonyme d’I64.</p>
<p data-src="R14">I64 ne comporte pas de sous-code dans la version consultée. La CIM-10-GM allemande 2024 exclut les séquelles d’un AVC non précisé vers I69.4. Cette référence explique le sens du code ; elle ne certifie pas les règles de facturation suisse 2026. La monographie traite surtout la décision clinique pendant l’incertitude, puis les deux principales branches de traitement. <button class="w" data-k="i64-cim">Code, diagnostic et cause</button>.</p>
<button class="pareto-btn ui" data-k="pareto-i64-definition">▲ Loi de Pareto — Reconnaître avant de coder</button></section>
<section class="ilot" id="i64-2"><h2><span class="n">2</span>Épidémiologie suisse : lire les dénominateurs</h2>
<p data-src="R5">L’étude suisse de Hänsel et collaborateurs, publiée en 2025, analyse des données de <b>2017</b> portant sur les codes I60 à I64. Elle rapporte 26 032 sorties hospitalières pour AVC et 2 816 décès, puis estime 26 879 événements ; le taux standardisé d’événements est de 325 pour 100 000 habitants. Les femmes représentent 45 % des sorties et 59 % des décès. Ces nombres concernent l’ensemble des AVC codés dans cette plage, pas uniquement I64.</p>
<p data-src="R5">Une sortie hospitalière n’est pas une personne nouvellement atteinte. Un même patient peut être réhospitalisé ; les bases hospitalière et des causes de décès ne peuvent pas être reliées individuellement. Les auteurs ne peuvent donc pas mesurer directement les premiers AVC, les récidives et une incidence vraie. Le taux standardisé ne doit pas être remplacé par un taux brut, ni les données 2017 être présentées comme une mesure 2026.</p>
<p data-src="R5,R11">Le recul de mortalité décrit entre périodes est compatible avec plusieurs évolutions : prévention, diagnostic, codage et organisation des soins. Il ne démontre pas à lui seul un effet causal des Stroke Units. Les chiffres arrondis de sensibilisation de la Fondation suisse de cardiologie ont une autre fonction et ne sont pas fusionnés avec cette analyse. <b>Aucune proportion suisse actuelle d’AVC restant I64 n’est établie par les sources relues.</b></p>
<div class="key" data-src="R5">Toujours conserver l’année, la population, le code inclus et le dénominateur. L’incertitude documentaire sur I64 ne justifie pas d’inventer une fréquence.</div>
<button class="w" data-k="i64-epidemio">Pourquoi hospitalisations et incidence diffèrent</button></section>
<section class="ilot" id="i64-3"><h2><span class="n">3</span>Physiopathologie : tissu, temps et pression</h2>
<p data-src="R6,R22">Le tissu nerveux dépend d’un apport continu de glucose et d’oxygène. Une occlusion artérielle réduit cet apport ; la sévérité de l’ischémie dépend aussi des collatérales, du territoire et de la durée. Le <b>cœur ischémique</b> correspond au tissu gravement lésé, tandis que la <b>pénombre</b> conserve une possibilité de récupération si la perfusion est restaurée assez vite. Ces compartiments évoluent ; deux patients au même délai peuvent avoir des volumes très différents.</p>
<p data-src="R22">Au niveau cellulaire, la diminution d’ATP perturbe les transports du glutamate. L’accumulation extracellulaire active notamment les récepteurs NMDA, avec entrée calcique et voies de dommage cellulaire. La revue mécanistique de Benquet et collaborateurs s’appuie surtout sur des modèles expérimentaux : elle explique une vulnérabilité sélective, mais ne fournit ni un chronomètre universel de mort neuronale ni une indication humaine d’antagoniste NMDA. La formule populaire « des millions de neurones par minute » ne doit pas être lue comme une mesure individuelle.</p>
<p data-src="R6,R7,R21">Dans l’hémorragie, la rupture vasculaire produit un hématome ; son expansion, l’œdème, l’effet de masse et une éventuelle extension ventriculaire peuvent aggraver rapidement le déficit. La prise en charge vise notamment une pression adaptée, la réversion d’une anticoagulation et l’évaluation neurochirurgicale. Diminuer un volume radiologique ne garantit pas automatiquement une amélioration fonctionnelle : les essais doivent examiner les deux résultats.</p>
<div class="key" data-src="R7">Le même geste peut avoir des effets différents selon le mécanisme. La pression élevée peut contribuer à l’expansion d’une HIC, mais soutient parfois une perfusion ischémique dépendante des collatérales. On ne « normalise » donc pas indistinctement la PA avant le diagnostic.</div>
<button class="w" data-k="i64-penombre">Mismatch : sélection tissulaire, pas certitude absolue</button><button class="pareto-btn ui" data-k="pareto-i64-mecanismes">▲ Loi de Pareto — Relier le mécanisme au traitement</button></section>
<section class="ilot" id="i64-4"><h2><span class="n">4</span>Causes et terrains</h2>
<table class="t"><thead><tr><th>Mécanisme ou terrain</th><th>Indices utiles</th><th>Conséquence du bilan</th></tr></thead><tbody><tr><td data-src="R3,R6">Athérosclérose des gros troncs</td><td data-src="R3,R6">Facteurs vasculaires, sténose cervicale ou intracrânienne, embolies artérielles.</td><td data-src="R3,R6">Imagerie des artères ; prévention vasculaire et discussion d’une lésion symptomatique.</td></tr><tr><td data-src="R3,R6">Cardioembolie</td><td data-src="R3,R6">Fibrillation atriale, valvulopathie, thrombus intracardiaque ; lésions de plusieurs territoires.</td><td data-src="R3,R6">ECG et monitorage, échographie ciblée ; prévention anticoagulante si indication établie.</td></tr><tr><td data-src="R3,R6">Maladie des petites artères</td><td data-src="R3,R6">HTA chronique ; syndrome lacunaire et petite lésion profonde compatibles.</td><td data-src="R3,R6">Ne pas attribuer la cause à la seule taille ; confronter au bilan artériel et cardiaque.</td></tr><tr><td data-src="R3,R6">Dissection</td><td data-src="R3,R6">Cervicalgie/céphalée, Horner, traumatisme parfois mineur ; peut survenir sans traumatisme rapporté.</td><td data-src="R3,R6">Imagerie cervicale adaptée, avis spécialisé.</td></tr><tr><td data-src="R3,R6">Hémorragie profonde</td><td data-src="R3,R6">Microangiopathie associée à l’HTA ; anticoagulation possible.</td><td data-src="R3,R6">Réversion si nécessaire, contrôle tensionnel et recherche d’autres causes selon contexte.</td></tr><tr><td data-src="R3,R6">Hémorragie lobaire ou sujet jeune</td><td data-src="R3,R6">Angiopathie amyloïde, malformation, tumeur ou autre cause selon âge et topographie.</td><td data-src="R3,R6">IRM et exploration vasculaire adaptées ; ne pas conclure à l’HTA parce que la PA est élevée.</td></tr><tr><td data-src="R3,R6">Causes moins fréquentes</td><td data-src="R3,R6">Endocardite, vascularite, antiphospholipides, maladie génétique, cancer ou trouble hématologique.</td><td data-src="R3,R6">Examens orientés par les indices ; pas de panel exhaustif systématique.</td></tr></tbody></table>
<p data-src="R6">Hypertension, tabagisme, diabète, dyslipidémie et antécédents vasculaires orientent la prévention. Leur absence n’exclut pas l’AVC, notamment chez une personne jeune. De même, une insuffisance rénale ou une maladie psychiatrique ne transforme pas automatiquement un déficit en simulateur. Une maladie préexistante et un AVC peuvent coexister.</p>
<button class="w" data-k="i64-etiologie">De la lésion à la cause</button></section>
<section class="ilot" id="i64-5"><h2><span class="n">5</span>Anamnèse : trois horloges et un témoin</h2>
<p data-src="R3,R13">Recueillir rapidement le récit du patient et d’un témoin, au téléphone si nécessaire. Distinguer le dernier état connu normal, la découverte du déficit et l’arrivée des secours. Préciser le caractère soudain, maximal d’emblée, progressif ou fluctuant ; noter un réveil avec symptômes et l’heure du coucher. Une heure incertaine se documente comme telle, sans la remplacer par l’heure la plus favorable au traitement.</p>
<table class="t"><thead><tr><th>À demander</th><th>Pourquoi cela change une décision</th></tr></thead><tbody><tr><td data-src="R1,R2,R3,R4">Déficit et retentissement</td><td data-src="R1,R2,R3,R4">Quels mots, quel bras, quelle vision, quelle marche ? Une aphasie peu cotée peut être très invalidante.</td></tr><tr><td data-src="R1,R2,R3,R4">Traitements et dernière prise</td><td data-src="R1,R2,R3,R4">AVK, anticoagulant direct, antiagrégant, insulinothérapie ; vérifier le nom, la dose, l’heure et la fonction rénale.</td></tr><tr><td data-src="R1,R2,R3,R4">Événements récents</td><td data-src="R1,R2,R3,R4">Saignement, chirurgie, traumatisme crânien, accouchement, ponction ou geste invasif : risque hémorragique et stratégie de reperfusion.</td></tr><tr><td data-src="R1,R2,R3,R4">État antérieur</td><td data-src="R1,R2,R3,R4">Autonomie réelle, handicap antérieur, cognition, lieu de vie, directives anticipées ; ne pas confondre âge et dépendance.</td></tr><tr><td data-src="R1,R2,R3,R4">Signes associés</td><td data-src="R1,R2,R3,R4">Céphalée brutale, douleur cervicale, crise, fièvre, douleur thoracique, chute, troubles visuels, dysphagie.</td></tr><tr><td data-src="R1,R2,R3,R4">Traitement anti-amyloïde</td><td data-src="R1,R2,R3,R4">Lecanemab/donanemab : possibilité d’ARIA et modification de la décision d’imagerie et de lyse.</td></tr></tbody></table>
<p data-src="R1,R2">La liste des contre-indications ne se reconstruit pas de mémoire pendant l’urgence : utiliser la fiche du produit choisi et le protocole validé du centre. L’anamnèse rapide se poursuit pendant la préparation de l’imagerie ; elle ne doit pas devenir une série d’étapes qui retarde inutilement la reperfusion.</p>
<button class="w" data-k="i64-anticoagulant">Un INR normal n’exclut pas tous les anticoagulants</button></section>
<section class="ilot" id="i64-6"><h2><span class="n">6</span>Examen clinique immédiat</h2>
<p data-src="R3,R6">Commencer par voies aériennes, respiration, circulation et vigilance, avec glycémie immédiate. Rechercher une asymétrie faciale, un déficit des bras et jambes, un trouble du langage, une déviation du regard, une perte de champ visuel, une asymétrie sensitive et une négligence. Explorer coordination et signes du tronc, notamment si vertige, diplopie, dysphagie ou déséquilibre sévère dominent. La marche n’est testée que si la sécurité le permet.</p>
<p data-src="R3">Le NIHSS structure l’examen : conscience et réponses, consignes, regard, champs visuels, face, motricité de chaque membre, ataxie, sensibilité, langage, dysarthrie et extinction. Décrire les déficits et le retentissement en plus du total. Une intubation, une barrière linguistique, une surdité ou une limitation articulaire modifie l’interprétation ; ne pas inventer un score normal lorsque l’item est non évaluable.</p>
<p data-src="R3,R6">Comparer les deux côtés, donner des consignes simples et vérifier la compréhension. Une aphasie n’est pas une confusion ; une dysarthrie altère l’articulation sans nécessairement altérer le langage. La négligence peut réduire la plainte du patient, tandis qu’un déficit visuel peut être méconnu. Un score bas n’exclut pas une atteinte postérieure ou un handicap majeur pour la personne.</p>
<div class="key" data-src="R3,R6"><b>La clinique localise ; elle ne prouve pas le type vasculaire.</b> Céphalée, vomissements et hypertension peuvent accompagner une hémorragie, mais ne remplacent pas le scanner ou l’IRM. L’aggravation se juge par rapport à un examen initial écrit.</div>
<button class="w" data-k="i64-nihss">Ce que mesure le NIHSS</button><button class="pareto-btn ui" data-k="pareto-i64-examen">▲ Loi de Pareto — Un examen rapide mais complet</button></section>
<section class="ilot" id="i64-7"><h2><span class="n">7</span>Syndromes et localisation</h2>
<table class="t"><thead><tr><th>Syndrome</th><th>Localisation évocatrice</th><th>Précaution</th></tr></thead><tbody><tr><td data-src="R6">Faiblesse et hypoesthésie brachiofaciales, aphasie ou négligence</td><td data-src="R6">Territoire superficiel de l’artère cérébrale moyenne.</td><td data-src="R6">Le langage dépend de l’hémisphère dominant ; ne pas assimiler tout trouble de parole à une aphasie.</td></tr><tr><td data-src="R6">Hémiparésie proportionnée face-bras-jambe</td><td data-src="R6">Voies profondes, notamment capsule interne.</td><td data-src="R6">Un syndrome pur évoque une lésion profonde mais n’en prouve pas la cause.</td></tr><tr><td data-src="R6">Déficit surtout crural, signes frontaux</td><td data-src="R6">Territoire cérébral antérieur.</td><td data-src="R6">Rechercher initiative, comportement et autres signes ; une faiblesse isolée de jambe a aussi des causes périphériques.</td></tr><tr><td data-src="R6">Hémianopsie homonyme, parfois troubles mnésiques ou sensitifs</td><td data-src="R6">Territoire cérébral postérieur ou voies visuelles.</td><td data-src="R6">Ne pas confondre perte monoculaire et perte d’un hémichamp des deux yeux.</td></tr><tr><td data-src="R6">Nerf crânien ipsilatéral et déficit du corps controlatéral</td><td data-src="R6">Syndrome alterne du tronc cérébral.</td><td data-src="R6">Les tableaux peuvent être incomplets ; une diplopie et une dysphagie aiguës sont des alertes.</td></tr><tr><td data-src="R6">Dysphagie/dysphonie, Horner, ataxie ipsilatérale et trouble thermoalgique croisé</td><td data-src="R6">Syndrome bulbaire latéral de Wallenberg.</td><td data-src="R6">L’absence de grande hémiparésie ne rassure pas sur la gravité de la déglutition.</td></tr><tr><td data-src="R6">Ataxie sévère, dysmétrie, vertige, impossibilité de tenir debout</td><td data-src="R6">Cervelet ou voies vestibulaires centrales.</td><td data-src="R6">Une atteinte volumineuse peut comprimer le tronc et provoquer une hydrocéphalie.</td></tr><tr><td data-src="R6">Tétraplégie et anarthrie avec conscience préservée</td><td data-src="R6">Locked-in possible par atteinte pontique.</td><td data-src="R6">Chercher une communication par mouvements oculaires verticaux ; ne pas conclure hâtivement au coma.</td></tr></tbody></table>
<p data-src="R6">La localisation est une hypothèse à tester par l’imagerie. Les territoires se chevauchent, les collatérales varient et plusieurs lésions peuvent coexister. Un syndrome lacunaire clinique ne signifie pas que toute exploration cardiaque ou artérielle devient inutile. <button class="w" data-k="i64-posterieur">Pourquoi FAST peut manquer une circulation postérieure</button>.</p>
<figure data-src="R23,R6"><img src="assets/img/i64/alpha/codex/Gray516.png" width="600" loading="lazy" alt="Planche humaine historique montrant les carotides internes, les artères cérébrales et le système vertébrobasilaire"><figcaption>Artères de la base du cerveau humain — Gray/Carter, Anatomy of the Human Body, 1918, figure 516. Une partie temporale et cérébelleuse est retirée dans la vue originale. Domaine public ; pixels originaux inchangés, repères français adjacents.</figcaption><table class="t"><thead><tr><th>Repère visible dans l’original</th><th>Lecture clinique</th></tr></thead><tbody><tr><td data-src="R23,R6">1 — Internal carotid</td><td data-src="R23,R6">La carotide interne alimente notamment les artères cérébrales antérieure et moyenne ; la branche ophtalmique explique le lien avec l’ischémie rétinienne.</td></tr><tr><td data-src="R23,R6">2 — Anterior communicating</td><td data-src="R23,R6">La communicante antérieure relie les deux côtés ; son existence anatomique ne garantit pas une compensation efficace.</td></tr><tr><td data-src="R23,R6">3 — Basilar / vertebral</td><td data-src="R23,R6">Les vertébrales rejoignent le tronc basilaire, au contact du tronc cérébral ; une atteinte postérieure peut produire diplopie, dysphagie ou syndrome alterne.</td></tr><tr><td data-src="R23,R6">4 — Posterior cerebral</td><td data-src="R23,R6">Les cérébrales postérieures participent aux territoires visuels et profonds. La planche de base ne montre pas toute la distribution corticale.</td></tr></tbody></table>
</figure></section>
