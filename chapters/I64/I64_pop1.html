<template data-pop="i64-cim" data-title="Code I64 : sens et usage">
<div class="lab">Définition</div><p>La classification allemande des diagnostics (CIM-10-GM 2024) intitule I64 « Schlaganfall, nicht als Blutung oder Infarkt bezeichnet » et y inclut « Zerebrovaskulärer Insult o.n.A. ». La catégorie est terminale : elle n’a pas de sous-code.</p>
<div class="lab">Usage</div><p>Le code s’emploie lorsque la nature de l’AVC n’est pas établie, par exemple lorsqu’aucune imagerie n’a été réalisée ou qu’elle n’a pas conclu. Dès que l’imagerie établit la nature, le diagnostic est recodé en I63 (infarctus) ou en I60, I61, I62 (hémorragies).</p>
<div class="lab">Exclusions</div><p>Le bloc I60–I69 exclut l’hémorragie intracrânienne traumatique (S06.-), la démence vasculaire (F01.-) et l’ischémie cérébrale transitoire (G45.-). Les séquelles d’un AVC non précisé se codent I69.4. Une hypertension associée se code en plus.</p>
<div class="lab">Limite</div><p>La version lue est la version allemande du BfArM, utilisée par l’Office fédéral de la statistique ; la publication française n’a pas été consultée.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc I60–I69 (BfArM)</a>.</p></template>
<template data-pop="i64-thrombolyse-resume" data-title="Thrombolyse : principe et condition">
<div class="lab">Définition</div><p>La thrombolyse par voie intraveineuse est le traitement médicamenteux de l’infarctus cérébral aigu, donné dans une fenêtre de 4,5 heures après le dernier moment connu sans symptôme en Suisse.</p>
<div class="lab">Condition</div><p>Les informations professionnelles suisses d’Actilyse et de Metalyse exigent d’exclure une hémorragie intracrânienne par une imagerie adéquate avant le traitement.</p>
<div class="lab">Conséquence</div><p>Tant que la nature de l’AVC est inconnue (code I64), la thrombolyse ne peut pas être donnée. L’imagerie précède donc le traitement spécifique.</p>
<p class="src">Références : <a href="https://www.swissmedic.ch/" target="_blank" rel="noopener">Information professionnelle suisse Actilyse®, Swissmedic, juin 2025</a> ; <a href="https://www.swissmedic.ch/" target="_blank" rel="noopener">Information professionnelle suisse Metalyse® 5000 U, Swissmedic, mai 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">ESO, thrombolyse intraveineuse, 2021</a>.</p></template>
<template data-pop="i64-dernier-moment" data-title="Dernier moment connu sans symptôme">
<div class="lab">Définition</div><p>C’est le dernier instant où le patient a été vu sans déficit. Les deux informations professionnelles suisses en font le point de départ de la fenêtre de 4,5 heures.</p>
<div class="lab">Application</div><p>Exemple fictif : vue normale à 07 h 30, arrivée à 08 h 40. La fenêtre court jusqu’à 12 h 00 ; il reste 3 h 20 à l’arrivée. L’heure d’arrivée ou de découverte ne définit pas le début.</p>
<div class="lab">Piège</div><p>Un patient trouvé avec un déficit au réveil n’a pas d’heure de début : le dernier moment sans symptôme précède le sommeil, et la décision repose alors sur l’imagerie.</p>
<p class="src">Références : <a href="https://www.swissmedic.ch/" target="_blank" rel="noopener">Information professionnelle suisse Actilyse®, Swissmedic, juin 2025</a> ; <a href="https://www.swissmedic.ch/" target="_blank" rel="noopener">Information professionnelle suisse Metalyse® 5000 U, Swissmedic, mai 2025</a>.</p></template>
<template data-pop="i64-temps" data-title="Time is brain : la quantification">
<div class="lab">Définition</div><p>Saver (2006) estime la perte moyenne dans un AVC ischémique typique d’un gros vaisseau supratentoriel : volume final moyen de 54 ml, constitution en environ 10 heures.</p>
<div class="lab">Valeurs</div><p>Par minute sans traitement : 1,9 million de neurones, 14 milliards de synapses, 12 kilomètres de fibres myélinisées. Par heure : 120 millions de neurones, soit 3,6 ans de vieillissement cérébral.</p>
<div class="lab">Limite</div><p>Estimation physiopathologique d’un auteur américain pour un cas typique ; elle n’est pas une recommandation et ne prédit pas l’évolution individuelle.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/16339467/" target="_blank" rel="noopener">Saver, Stroke 2006</a>.</p></template>
<template data-pop="i64-epidemio" data-title="Épidémiologie suisse : lecture et limites">
<div class="lab">Source</div><p>Hänsel et collaborateurs, International Journal of Epidemiology, 2025, sur les données de 2017 de l’Office fédéral de la statistique, pour les codes I60 à I64.</p>
<div class="lab">Interprétation</div><p>La hausse des sorties s’explique surtout par le codage depuis SwissDRG (2012), la connaissance des symptômes et l’accès au diagnostic ; une hausse réelle n’est pas exclue. La baisse de mortalité est attribuée aux Stroke Units certifiées, aux réseaux de télé-AVC et à la standardisation de la chaîne de soins.</p>
<div class="lab">Limite</div><p>Les bases hospitalière et des causes de décès ne peuvent pas être reliées : l’incidence vraie et la distinction premier AVC/récidive sont impossibles. La part d’I64 n’est pas isolée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12161988/" target="_blank" rel="noopener">Hänsel et al., Int J Epidemiol 2025</a>.</p></template>
<template data-pop="i64-penombre" data-title="Mismatch : lecture de la pénombre">
<div class="lab">Définition</div><p>Le mismatch est un décalage entre le cœur de l’infarctus et le tissu hypoperfusé (perfusion au scanner ou à l’IRM). Une discordance DWI-FLAIR à l’IRM est un autre mode de sélection.</p>
<div class="lab">Application</div><p>Il sélectionne la thrombolyse entre 4,5 et 9 heures et chez les patients se réveillant avec un déficit. Un scanner sans contraste seul ne suffit pas.</p>
<div class="lab">Limite</div><p>Aucune source primaire sur la physiopathologie de la pénombre n’a été lue : ce cours n’en enseigne que la traduction en imagerie.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">ESO, thrombolyse intraveineuse, 2021</a>.</p></template>
<template data-pop="i64-expansion" data-title="Expansion de l’hématome">
<div class="lab">Définition</div><p>L’expansion est l’augmentation du volume de l’hématome après le diagnostic initial.</p>
<div class="lab">Conséquence</div><p>Elle est associée à un pronostic fonctionnel plus mauvais et à la mort. Une baisse tensionnelle précoce (avant 6 heures) est associée à moins d’expansion (odds ratio 0,76, faible certitude).</p>
<div class="lab">Limite</div><p>L’acide tranexamique réduit l’expansion à 24 heures (odds ratio 0,82) sans effet démontré sur la mort ou la dépendance à 90 jours.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">ESO et EANS, hémorragie intracérébrale, 2025</a>.</p></template>
<template data-pop="i64-tension-nature" data-title="Pression artérielle selon la nature de l’AVC">
<div class="lab">Principe</div><p>Le même abaissement tensionnel n’a pas le même effet dans l’hémorragie et dans l’infarctus.</p>
<div class="lab">Preuves</div><p>INTERACT4 (préhospitalier, urapidil, cible 130–140 mmHg, 2303 patients) : odds ratio commun 1,00 ; bénéfice possible dans l’hémorragie, préjudice possible dans l’infarctus (odds ratio commun 1,30). RIGHT-2 (trinitrine transdermique) : expansion de l’hématome 46 % contre 27 %.</p>
<div class="lab">Conduite</div><p>Pas d’abaissement tensionnel de routine en préhospitalier devant un AVC suspecté (certitude modérée).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener">ESO, pression artérielle, mise à jour 2025</a>.</p></template>
<template data-pop="i64-simulateurs" data-title="Simulateurs d’AVC">
<div class="lab">Fréquence</div><p>À Essen, 2167 patients amenés par les secours (2017–2021) : 35,2 % de simulateurs, d’origine neurologique pour 51,6 % et non neurologique pour 48,4 %. Crises épileptiques : 23,2 % ; infections : 14,7 %.</p>
<div class="lab">Indices</div><p>L’insuffisance rénale ou hépatique chronique prédit un simulateur ; la fibrillation atriale et l’hypertension rendent un vrai AVC plus probable.</p>
<div class="lab">Sécurité</div><p>Chez 392 simulateurs thrombolysés, l’hémorragie symptomatique était de 0,5 % et l’œdème orolingual de 0,3 %.</p>
<div class="lab">Limite</div><p>Étude monocentrique pour la fréquence ; la revue de Buck (2021), non systématique, avance « près de la moitié des admissions » : on préfère le chiffre mesuré.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10672280/" target="_blank" rel="noopener">Kühne Escolà et al., J Clin Med 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25791717/" target="_blank" rel="noopener">Tsivgoulis et al., Stroke 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7939567/" target="_blank" rel="noopener">Buck et al., Ann Med 2021</a>.</p></template>
<template data-pop="i64-reveil" data-title="AVC du réveil ou d’heure inconnue">
<div class="lab">Principe</div><p>La thrombolyse reste possible, mais sa sélection repose sur l’imagerie.</p>
<div class="lab">Critères</div><p>Discordance DWI-FLAIR à l’IRM (recommandation forte, qualité élevée) ou mismatch de perfusion dans les 9 heures suivant le milieu du sommeil.</p>
<div class="lab">Piège</div><p>Ne pas conclure à une contre-indication parce que l’heure est inconnue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">ESO, thrombolyse intraveineuse, 2021</a>.</p></template>
<template data-pop="i64-nihss" data-title="NIHSS : sévérité">
<div class="lab">Définition</div><p>National Institutes of Health Stroke Scale, score de sévérité neurologique.</p>
<div class="lab">Usage</div><p>L’information professionnelle d’Actilyse cite un NIHSS supérieur à 25 comme exemple d’AVC sévère contre-indiquant l’altéplase. Les recommandations ESO–ESMINT pour la thrombectomie ne retiennent aucune limite supérieure. Pour l’occlusion basilaire, la thrombectomie est suggérée si NIHSS ≥ 10.</p>
<div class="lab">Limite</div><p>Le score mesure la gravité et non la nature de l’AVC.</p>
<p class="src">Références : <a href="https://www.swissmedic.ch/" target="_blank" rel="noopener">Information professionnelle suisse Actilyse®, Swissmedic, juin 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6533858/" target="_blank" rel="noopener">ESO–ESMINT, thrombectomie, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11347260/" target="_blank" rel="noopener">ESO–ESMINT, occlusion basilaire, 2024</a>.</p></template>
<template data-pop="i64-seuils-pa" data-title="Seuils tensionnels de la thrombolyse">
<div class="lab">Valeurs</div><p>Pression inférieure à 185/110 mmHg avant le bolus, puis inférieure à 180/105 mmHg pendant la thrombolyse ou la thrombectomie et pendant les 24 heures suivantes.</p>
<div class="lab">Après thrombectomie</div><p>Ne pas faire baisser la pression systolique sous 140 mmHg dans les 24 heures après une thrombectomie réussie (certitude élevée).</p>
<div class="lab">Glycémie</div><p>Glycémie supérieure à 22,2 mmol/l : thrombolyse suggérée (très basse qualité de preuve).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">ESO, thrombolyse intraveineuse, 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener">ESO, pression artérielle, mise à jour 2025</a>.</p></template>
<template data-pop="i64-scores" data-title="Scores de Guy’s, de Siriraj et d’Allen">
<div class="lab">Définition</div><p>Scores cliniques construits pour distinguer l’hémorragie de l’infarctus sans imagerie.</p>
<div class="lab">Performance</div><p>Glasgow, 1059 patients : Guy’s (13 variables) sensibilité 70 %, spécificité 64 % ; Siriraj (5 variables) 68 % et 64 % ; précision 64 % pour chacun. Inde, 91 patients : les scores d’Allen, de Siriraj et grec ne guident pas la prise en charge.</p>
<div class="lab">Conduite</div><p>Aucun ne suffit à exclure l’hémorragie avant un anticoagulant ou de l’aspirine.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/7934437/" target="_blank" rel="noopener">Weir et al., Lancet 1994</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15523162/" target="_blank" rel="noopener">Soman et al., Indian J Med Sci 2004</a>.</p></template>
