
<!-- ===== FENÊTRES I48 : monographies ===== -->
<template data-pop="i48-aod" data-title="Anticoagulants oraux directs (AOD)">
<div class="lab">Molécules et mécanisme</div><p>Inhibiteurs directs et réversibles d’une enzyme de la coagulation : facteur Xa (apixaban, rivaroxaban, édoxaban) ou thrombine (dabigatran, promédicament du dabigatran étexilate).</p>
<div class="lab">Preuves</div><p>Quatre essais contre la warfarine (RE-LY, ROCKET AF, ARISTOTLE, ENGAGE AF-TIMI 48) : efficacité au moins équivalente sur l’AVC et l’embolie, réduction d’environ moitié des hémorragies intracrâniennes, réduction modeste de la mortalité dans la méta-analyse. Certains augmentent les hémorragies digestives (dabigatran 150 mg, rivaroxaban, édoxaban 60 mg).</p>
<div class="lab">Place (ESC 2024)</div><p>Premier choix de l’anticoagulation de la FA (classe I, niveau A), sauf prothèse mécanique et rétrécissement mitral modéré à sévère.</p>
<div class="lab">Posologie</div><p>Doses standard et réduites selon des critères fixes (îlot 10 et onglet Pharmacologie). Pas de réduction « par prudence » : le sous-dosage augmente les AVC.</p>
<div class="lab">Effets indésirables</div><p>Hémorragies ; dyspepsie (dabigatran) ; rares réactions cutanées ou hépatiques.</p>
<div class="lab">Contre-indications</div><p>Hémorragie active, lésion à haut risque hémorragique, prothèse mécanique, rétrécissement mitral modéré à sévère, grossesse et allaitement, insuffisance hépatique sévère, clairance &lt; 15 mL/min (&lt; 30 pour le dabigatran), syndrome des antiphospholipides à haut risque.</p>
<div class="lab">Surveillance</div><p>Observance ; fonction rénale au moins annuellement, plus souvent si la clairance est basse ou chez le sujet âgé ; hémogramme ; interactions à chaque nouvelle prescription.</p></template>

<template data-pop="i48-avk" data-title="Antivitamines K">
<div class="lab">Molécules en Suisse</div><p>Phenprocoumone (demi-vie de plusieurs jours) et acénocoumarol (demi-vie courte). La warfarine n’est pas commercialisée en Suisse.</p>
<div class="lab">Mécanisme</div><p>Inhibition de la vitamine K époxyde réductase : baisse des facteurs II, VII, IX et X fonctionnels, et des protéines C et S.</p>
<div class="lab">Indications préférentielles</div><p>Prothèse valvulaire mécanique, rétrécissement mitral modéré à sévère, contre-indication aux AOD ; sujet âgé stable et polymédiqué déjà bien équilibré (le maintien peut être envisagé, essai FRAIL-AF).</p>
<div class="lab">Initiation</div><p>Dose adaptée selon l’INR, contrôles rapprochés au début ; chevauchement avec une héparine si un effet rapide est nécessaire.</p>
<div class="lab">Interactions</div><p>Nombreuses : amiodarone, antibiotiques (cotrimoxazole, macrolides, fluoroquinolones), antifongiques azolés, paracétamol à forte dose régulière ; alimentation riche en vitamine K ; alcool.</p>
<div class="lab">Effets indésirables</div><p>Hémorragies ; nécrose cutanée rare en début de traitement (déficit en protéine C) ; tératogénicité (embryopathie du premier trimestre).</p></template>

<template data-pop="i48-d-frein" data-title="Bêtabloquants et inhibiteurs calciques dans la FA">
<div class="lab">Bêtabloquants</div><p>Ralentissent le nœud auriculoventriculaire en bloquant les récepteurs β1 ; efficaces au repos et à l’effort. Première ligne quelle que soit la FEVG ; indispensables en cas de coronaropathie ou d’ICFEr. Précautions : asthme sévère, bradycardie, bloc auriculoventriculaire, insuffisance cardiaque décompensée avec bas débit. Le sotalol a en plus une activité de classe III.</p>
<div class="lab">Vérapamil et diltiazem</div><p>Bloquent les canaux calciques de type L du nœud. Efficaces, bien tolérés sur le plan respiratoire. Réservés à une FEVG &gt; 40 %. Interactions : vérapamil et dabigatran (dose réduite), digoxine (concentration augmentée), simvastatine ; inhibiteurs du CYP3A4.</p>
<div class="lab">Preuves</div><p>L’essai RACE II a comparé une cible de fréquence souple (&lt; 110/min au repos) à une cible stricte (&lt; 80/min) : pas de différence sur les événements. L’ESC 2024 retient la cible souple comme point de départ.</p>
<div class="lab">Surveillance</div><p>Fréquence au repos et à l’effort (Holter, test d’effort), pression artérielle, tolérance ; chercher des pauses chez le sujet âgé.</p></template>

<template data-pop="i48-d-flec" data-title="Flécaïnide et propafénone (classe Ic)">
<div class="lab">Mécanisme</div><p>Blocage du canal sodique rapide avec dissociation lente : ralentissement de la conduction auriculaire et ventriculaire, accentué à fréquence élevée (dépendance à l’usage). La propafénone a aussi une activité β-bloquante.</p>
<div class="lab">Preuves</div><p>Efficaces pour la cardioversion pharmacologique de la FA récente et pour le maintien du rythme sur cœur sain. L’essai CAST (1989) a montré une surmortalité sous flécaïnide et encaïnide après infarctus : d’où la contre-indication dans la coronaropathie.</p>
<div class="lab">Posologie</div><p>Flécaïnide 50–150 mg × 2/jour ; propafénone 150–300 mg × 3/jour ; en « pilule de poche » : flécaïnide 200–300 mg, propafénone 450–600 mg.</p>
<div class="lab">Effets indésirables</div><p>Flutter 1:1, élargissement du QRS, tachycardie ventriculaire proarythmique ; troubles visuels, vertiges ; goût métallique (propafénone).</p>
<div class="lab">Contre-indications</div><p>Coronaropathie, FEVG ≤ 40 %, hypertrophie ventriculaire importante, trouble de conduction sévère sans stimulateur, syndrome de Brugada.</p>
<div class="lab">Surveillance</div><p>ECG après initiation et après chaque augmentation ; ECG d’effort ; QRS élargi de plus de 25 % : réduire. Toujours associer un freinateur.</p></template>

<template data-pop="i48-d-amio" data-title="Amiodarone">
<div class="lab">Mécanisme</div><p>Antiarythmique à effets multiples : blocage potassique (classe III, effet principal), sodique, calcique et β-adrénergique. Pharmacocinétique très particulière : forte liposolubilité, demi-vie de plusieurs semaines, 37 % d’iode en masse.</p>
<div class="lab">Place</div><p>Antiarythmique le plus efficace pour maintenir le rythme sinusal et le seul utilisable si la FEVG est ≤ 40 %. Cardioversion pharmacologique en cas de cardiopathie significative. Dernier recours pour le contrôle de la fréquence.</p>
<div class="lab">Posologie</div><p>Intraveineux : 300 mg en 30–60 minutes, puis 900–1 200 mg sur 24 heures, par une veine de gros calibre (phlébite). Oral : 600 mg/jour en prises fractionnées pendant 4 semaines, puis 400 mg/jour pendant 4 semaines, puis 100–200 mg/jour (ESC 2020).</p>
<div class="lab">Effets indésirables</div><p>Thyroïde (hypo- et hyperthyroïdie) ; poumon (pneumopathie interstitielle, dose-dépendante) ; foie (cytolyse) ; peau (photosensibilité, coloration gris-bleu) ; œil (dépôts cornéens, rare neuropathie optique) ; neuropathie périphérique ; bradycardie ; allongement du QT, torsades rares.</p>
<div class="lab">Interactions</div><p>Augmente les concentrations de digoxine, des antivitamines K, du dabigatran, de la simvastatine ; association aux médicaments allongeant le QT à éviter.</p>
<div class="lab">Surveillance</div><p>TSH et tests hépatiques avant puis tous les six mois ; radiographie thoracique et épreuves fonctionnelles respiratoires de référence ; ECG ; examen ophtalmologique en cas de troubles visuels. Réévaluer régulièrement la nécessité du traitement.</p></template>

<template data-pop="i48-d-drone" data-title="Dronédarone">
<div class="lab">Mécanisme</div><p>Dérivé de l’amiodarone sans iode, à demi-vie plus courte : effets multicanaux, moins de toxicité thyroïdienne et pulmonaire.</p>
<div class="lab">Preuves</div><p>ATHENA : réduction des hospitalisations cardiovasculaires et des décès chez des patients en FA paroxystique ou persistante. PALLAS : surmortalité et excès d’AVC et d’insuffisance cardiaque dans la FA permanente. ANDROMEDA : surmortalité dans l’insuffisance cardiaque sévère récemment décompensée.</p>
<div class="lab">Posologie</div><p>400 mg × 2/jour, aux repas.</p>
<div class="lab">Contre-indications</div><p>FA permanente ; insuffisance cardiaque NYHA III–IV ou instable ; FEVG ≤ 40 % ; clairance &lt; 30 mL/min ; hépatopathie, toxicité hépatique ou pulmonaire antérieure sous amiodarone ; inhibiteurs puissants du CYP3A4 ; dabigatran ; QT long. L’information professionnelle est plus restrictive que l’ESC 2024 (antécédent d’insuffisance cardiaque ou de dysfonction systolique) : se référer à compendium.ch.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques (cas d’atteinte hépatique sévère), créatinine (hausse modérée par inhibition de la sécrétion tubulaire, sans baisse réelle de la filtration), ECG, digoxinémie si association.</p></template>

<template data-pop="i48-d-sotalol" data-title="Sotalol">
<div class="lab">Mécanisme</div><p>Bêtabloquant non sélectif doté d’une activité de classe III (blocage potassique), qui domine aux doses élevées.</p>
<div class="lab">Place</div><p>Maintien du rythme sinusal chez des patients sélectionnés, avec prudence (ESC 2024) en raison du risque proarythmique. Il n’est pas efficace pour la cardioversion.</p>
<div class="lab">Posologie</div><p>80–160 mg × 2/jour ; espacer les prises si la clairance est réduite (élimination rénale).</p>
<div class="lab">Effets indésirables</div><p>Allongement du QT et torsades de pointes, dose-dépendants, favorisés par l’hypokaliémie, l’insuffisance rénale, la bradycardie et le sexe féminin ; bradycardie ; bronchospasme.</p>
<div class="lab">Surveillance</div><p>Initiation sous surveillance ECG ; QTc &gt; 500 ms : arrêt ou réduction ; potassium, magnésium, créatinine.</p></template>

<template data-pop="i48-d-vernak" data-title="Vernakalant">
<div class="lab">Mécanisme</div><p>Blocage préférentiel de courants potassiques propres à l’oreillette et du courant sodique, avec une dépendance à la fréquence : action surtout auriculaire.</p>
<div class="lab">Place</div><p>Cardioversion pharmacologique rapide d’une FA récente (classe I, ESC 2024), avec une conversion souvent obtenue en une dizaine de minutes.</p>
<div class="lab">Posologie</div><p>3 mg/kg en 10 minutes ; deuxième perfusion de 2 mg/kg après 15 minutes si la FA persiste.</p>
<div class="lab">Contre-indications</div><p>Pression systolique &lt; 100 mmHg, syndrome coronarien de moins de 30 jours, insuffisance cardiaque NYHA III–IV, rétrécissement aortique sévère, QT long.</p>
<div class="lab">Effets indésirables</div><p>Dysgueusie, éternuements, paresthésies ; hypotension ; bradycardie. Surveillance tensionnelle et ECG pendant au moins deux heures.</p>
<div class="lab">Disponibilité</div><p>Selon l’information professionnelle suisse (compendium.ch) et la liste hospitalière.</p></template>

<!-- ===== FENÊTRES PARETO I48 ===== -->
<template data-pop="pareto-i48-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="i48-1,i48-2"></p>
<ul><li>FA : activation auriculaire désorganisée → RR irrégulièrement irréguliers, pas d’onde P. Le diagnostic repose sur un tracé ECG relu, à 12 dérivations ou à une ou plusieurs dérivations. Un ECG standard suffit si la FA occupe tout le tracé ; en ambulatoire, la durée minimale dépend du contexte et le repère de 30 secondes est un consensus.</li><li>Flutter : macroréentrée organisée ≈ 300/min ; typique = isthme cavotricuspide.</li><li>Types : première détection, paroxystique (≤ 7 j), persistante (&gt; 7 j), persistante de longue durée (≥ 12 mois), permanente (décision).</li><li>Type temporel ≠ critère d’anticoagulation.</li><li>Infraclinique = épisodes asymptomatiques détectés par un dispositif de surveillance continue, sans FA clinique documentée ; bénéfice de l’anticoagulation bien moindre.</li><li>Risque de FA au cours de la vie : 1 sur 3 à 5 après 55 ans ; Suisse (CoLaus) 0,9 %, 3,1 % après 80 ans, sous-estimé.</li><li>Complications : AVC (× 5), insuffisance cardiaque, déclin cognitif, mortalité.</li></ul></template>

<template data-pop="pareto-i48-physio" data-title="Pareto — Physiopathologie et étiologies">
<p class="ratio" data-cover="i48-3,i48-4"></p>
<ul><li>Déclencheurs (veines pulmonaires) + substrat (dilatation, fibrose) ; la FA remodèle l’oreillette → progression.</li><li>Longueur d’onde = vitesse × période réfractaire ; courte → FA.</li><li>Nœud auriculoventriculaire : filtre décrémentiel ; voie accessoire = pas de filtre → FA pré-excitée dangereuse.</li><li>Débit ↓ : perte de la systole auriculaire (grave si ventricule rigide), tachycardie ; cardiomyopathie rythmique réversible.</li><li>Thrombus dans l’auricule gauche (Virchow) ; sidération post-cardioversion → anticoagulation ≥ 4 semaines.</li><li>Flutter typique : anneau tricuspide, isthme, 2:1 → 150/min.</li><li>Causes : âge, hypertension, obésité, apnées, alcool, diabète, insuffisance cardiaque, valvulopathie mitrale, thyroïde, chirurgie, sepsis, sport d’endurance, ibrutinib.</li></ul></template>

<template data-pop="pareto-i48-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i48-5,i48-6"></p>
<ul><li>Dater le début (seuil de 24 h) ; calculer CHA₂DS₂-VA ; chercher les facteurs hémorragiques et les causes.</li><li>Un tiers asymptomatique ; syncope = pause, pré-excitation ou bradycardie.</li><li>Pouls irrégulier, déficit de pouls : compter à l’apex ; B1 variable ; pas d’onde a ni de B4.</li><li>Pression artérielle : mesures répétées.</li><li>Rechercher insuffisance cardiaque, rétrécissement mitral, hyperthyroïdie, embolie.</li></ul></template>

<template data-pop="pareto-i48-diag" data-title="Pareto — Diagnostic et dépistage">
<p class="ratio" data-cover="i48-7"></p>
<ul><li>FA : pas d’onde P, ondes f, RR irréguliers.</li><li>Flutter typique antihoraire : F en dents de scie négatives en II, III et aVF, positives V1 ; horaire : inverse ; atypique : autre circuit (cicatrices, oreillette gauche).</li><li>Tachycardie régulière à 150/min = flutter 2:1 jusqu’à preuve du contraire ; adénosine démasque.</li><li>Différentiels graves : FA pré-excitée, tachycardie ventriculaire.</li><li>Dépistage opportuniste ≥ 65 ans ; populationnel prolongé ≥ 75 ans ou ≥ 65 ans avec facteurs (IIa). Alerte de montre → ECG.</li><li>Infraclinique : NOAH-AFNET 6 négatif, ARTESiA positif au prix des saignements → AOD envisageable si risque élevé (IIb).</li></ul></template>

<template data-pop="pareto-i48-urg" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="i48-8"></p>
<ul><li>Instable (choc, œdème pulmonaire, ischémie, syncope) → cardioversion électrique synchronisée immédiate ; héparine sans retarder.</li><li>FA pré-excitée : QRS larges variables, irréguliers, &gt; 250/min → pas d’adénosine, bêtabloquant, vérapamil, diltiazem, digoxine ni amiodarone intraveineuse ; cardioversion ; puis ablation de la voie accessoire.</li><li>FA secondaire (sepsis, hypovolémie) : traiter la cause.</li><li>Complications : embolie (cérébrale, membre, mésentère), insuffisance cardiaque, pause post-conversion, hémorragie, flutter 1:1 sous classe Ic.</li></ul></template>

<template data-pop="pareto-i48-care" data-title="Pareto — Parcours et facteurs de risque">
<p class="ratio" data-cover="i48-9"></p>
<ul><li>AF-CARE : Comorbidités, Anticoagulation (éviter l’AVC), Réduire les symptômes (fréquence et rythme), Évaluer et réévaluer.</li><li>Perte de poids ≥ 10 % (I) ; alcool ≤ 3 verres standard/semaine (I) ; hypertension, diabète, insuffisance cardiaque (iSGLT2) (I) ; exercice (I) ; apnées : évaluation objective (IIb).</li><li>Chaque mesure cible le substrat.</li></ul></template>

<template data-pop="pareto-i48-anticoag" data-title="Pareto — Prévention thromboembolique">
<p class="ratio" data-cover="i48-10"></p>
<ul><li>CHA₂DS₂-VA (sans sexe) : ≥ 2 → anticoaguler (I) ; 1 → envisager (IIa). Cardiomyopathie hypertrophique et amylose : d’emblée.</li><li>Facteurs hémorragiques modifiables à corriger (I) ; score ≠ motif de refus (III). Chute ≠ contre-indication.</li><li>AOD &gt; antivitamine K (I A) ; antivitamine K si prothèse mécanique ou rétrécissement mitral modéré à sévère.</li><li>Doses : apixaban 2,5 × 2 si 2 critères sur 3 (≥ 80 ans, ≤ 60 kg, créatinine ≥ 133) ou clairance 15–29 ; rivaroxaban 15 si 15–49 ; édoxaban 30 si 15–50, ≤ 60 kg ou inhibiteur puissant de la glycoprotéine P ; dabigatran 110 × 2 si ≥ 80 ans ou vérapamil, contre-indiqué &lt; 30. Clairance de Cockcroft-Gault.</li><li>Pas d’antiplaquettaire à la place ou en plus sans indication coronaire ; après syndrome coronarien : trithérapie ≤ 1 semaine, puis AOD + clopidogrel ≤ 12 mois (6 mois si angioplastie programmée), puis AOD seul.</li><li>Fermeture de l’auricule : chirurgicale I (LAAOS III), percutanée IIb si contre-indication ; CHAMPION-AF 2026 : moins de saignements, plus d’AVC ischémiques.</li><li>AVC sous AOD : pas d’antiplaquettaire ajouté ; ELAN : reprise précoce sûre.</li></ul></template>

<template data-pop="pareto-i48-rate" data-title="Pareto — Contrôle de la fréquence">
<p class="ratio" data-cover="i48-11"></p>
<ul><li>Cible initiale &lt; 110/min au repos (RACE II), plus basse si symptômes.</li><li>FEVG &gt; 40 % : bêtabloquant, vérapamil/diltiazem ou digoxine. FEVG ≤ 40 % : bêtabloquant et/ou digoxine ; pas de vérapamil ni diltiazem.</li><li>Association si besoin ; amiodarone en dernier recours ; échec → ablation du nœud et stimulation (IIa).</li><li>FA rapide secondaire : traiter la cause.</li></ul></template>

<template data-pop="pareto-i48-rythme" data-title="Pareto — Contrôle du rythme">
<p class="ratio" data-cover="i48-12"></p>
<ul><li>Indiqué pour les symptômes (I) ; précoce chez des patients sélectionnés (IIa, EAST-AFNET 4).</li><li>Règle des 24 h (ESC 2024, ancien 48 h) : &gt; 24 h ou inconnue → 3 semaines d’anticoagulant ou ETO ; après : ≥ 4 semaines pour tous, puis selon le score. Attente-conversion spontanée = alternative (IIa).</li><li>Cardioversion médicamenteuse : cœur sain → flécaïnide, propafénone, vernakalant ; cardiopathie → amiodarone. Pilule de poche (IIa).</li><li>Maintien : cœur sain → Ic (+ freinateur), dronédarone ; coronaropathie/hypertrophie → dronédarone, amiodarone ; FEVG ≤ 40 % → amiodarone.</li><li>Ablation : paroxystique en première ligne (I) ; persistante après échec (I) ; FEVG ≤ 40 % (I si cardiomyopathie rythmique, IIa sinon). Anticoagulation ininterrompue, ≥ 2 mois après, puis selon score.</li><li>Flutter typique : ablation de l’isthme (succès &gt; 90 %) ; même anticoagulation que la FA.</li></ul></template>

<template data-pop="pareto-i48-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i48-13,i48-14"></p>
<ul><li>Bilan initial : ECG, échocardiographie, hémogramme, créatinine, ionogramme, TSH, foie, glycémie.</li><li>Réévaluation à 6 mois puis au moins annuelle ; créatinine tous les « clairance ÷ 10 » mois si &lt; 60 ; INR : temps en zone &gt; 70 % ; amiodarone : TSH et foie tous les 6 mois.</li><li>Postopératoire : anticoagulation au long cours à envisager si risque élevé (IIa).</li><li>Grossesse : cardioversion si instable ; β1-sélectif ; héparine de bas poids moléculaire ; pas d’AOD ; pas d’amiodarone.</li><li>Hyperthyroïdie : bêtabloquant, traiter la thyroïde, anticoaguler selon score, cardioversion après euthyroïdie.</li><li>Rein : Cockcroft-Gault ; &lt; 15 mL/min ou dialyse : pas d’AOD recommandé. Foie : Child-Pugh C = pas d’AOD ; rivaroxaban dès B.</li><li>Sujet âgé : l’âge et les chutes ne contre-indiquent pas.</li></ul></template>

<template data-pop="pareto-i48-ecg" data-title="Pareto — Électrocardiogramme">
<p class="ratio" data-cover="i48-e-2"></p>
<ul><li>La référence du diagnostic est un tracé ECG interprété par un médecin. Un ECG standard de 10 secondes documente la FA si elle occupe tout le tracé. Le repère ambulatoire de 30 secondes n’est pas un seuil universel ; la recommandation de dépistage de l’ESC 2024 ne fixe aucune durée.</li><li>FA : 350–600/min, ondes f, RR irréguliers ; flutter : 250–350/min, dents de scie, RR réguliers si conduction fixe.</li><li>Ashman = aberrance, pas extrasystole. FA lente et régulière = bloc complet (digoxine ?).</li><li>Associations : TSH basse (thyrotoxicose) ; digoxinémie ↑ et K⁺ ↓ (toxicité) ; K⁺ &lt; 3,5 → corriger avant antiarythmique.</li></ul></template>

<template data-pop="pareto-i48-imag" data-title="Pareto — Enregistrements et imagerie">
<p class="ratio" data-cover="i48-e-3,i48-e-4"></p>
<ul><li>Durée d’enregistrement adaptée à la fréquence des symptômes ; après AVC sans cause : ≥ 72 h de monitorage, puis moniteur implantable.</li><li>Épisodes détectés par dispositif : vérifier l’électrogramme.</li><li>ETT chez presque tous : valvulopathie (rétrécissement mitral → antivitamine K), FEVG (choix des médicaments), oreillette gauche (&gt; 34 mL/m² = dilatée). FEVG à remesurer après contrôle de fréquence.</li><li>ETO = référence du thrombus de l’auricule ; vitesse de vidange &lt; 20 cm/s = risque.</li><li>Scanner : anatomie avant ablation ou fermeture.</li></ul></template>

<template data-pop="pareto-i48-exam" data-title="Pareto — Biologie et synthèse des examens">
<p class="ratio" data-cover="i48-e-1,i48-e-5"></p>
<ul><li>Chez tous : TSH, créatinine + clairance de Cockcroft-Gault, hémogramme, ionogramme et magnésium, foie, glycémie ou HbA1c, coagulation de base.</li><li>Dose des AOD : Cockcroft-Gault en mL/min, pas CKD-EPI.</li><li>INR 2–3, temps en zone &gt; 70 %.</li><li>INR et temps de céphaline normaux n’excluent pas un AOD ; dosage spécifique si urgence.</li><li>NT-proBNP : seuils plus élevés en FA.</li></ul></template>

<template data-pop="pareto-i48-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i48-sa,i48-sh,i48-sp,i48-sb,i48-sg"></p>
<ul><li>Manchons des veines pulmonaires = déclencheurs → isolation. Auricule gauche = site du thrombus → ETO, fermeture. Isthme cavotricuspide = passage obligé du flutter → ablation. Œsophage et nerf phrénique = complications de l’ablation.</li><li>Fibrose et perte des connexines 40/43 → conduction lente → réentrée ; peptide natriurétique auriculaire → polyurie.</li><li>Réentrée : obstacle, bloc unidirectionnel, conduction lente ; longueur d’onde = vitesse × réfractaire. Classe III allonge ; Ic ralentit → flutter 1:1.</li><li>Nœud : décrémentiel + conduction cachée → RR irréguliers.</li><li>Facteur Xa (apixaban, rivaroxaban, édoxaban), thrombine (dabigatran), vitamine K époxyde réductase (antivitamines K) ; glycoprotéine P et CYP3A4 → interactions.</li><li>Génétique : <i>PITX2</i> (4q25), <i>TTN</i> dans la FA précoce ; <i>VKORC1</i>, <i>CYP2C9</i> → sensibilité aux antivitamines K.</li></ul></template>

<template data-pop="pareto-i48-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i48-p-1,i48-p-2,i48-p-3,i48-p-4,i48-p-5"></p>
<ul><li>Trois objectifs distincts : anticoagulant (AVC), freinateur (fréquence), antiarythmique (rythme).</li><li>AOD : apixaban 5 × 2, rivaroxaban 20 × 1 au repas, édoxaban 60 × 1, dabigatran 150 × 2 ; oubli : rattraper ≤ 6 h (2 prises) ou ≤ 12 h (1 prise) ; pas de relais par héparine.</li><li>Antidotes : idarucizumab (dabigatran), andexanet alfa (apixaban, rivaroxaban), concentré de complexe prothrombinique ; antivitamine K : vitamine K + concentré.</li><li>Pas d’AOD : prothèse mécanique, rétrécissement mitral modéré à sévère, grossesse.</li><li>Phase aiguë : métoprolol 2,5–5 mg, diltiazem 0,25 mg/kg (FEVG &gt; 40 %), digoxine 0,25–0,5 mg en bolus (charge totale 0,75–1,5 mg/24 h, bolus compris), amiodarone 300 mg (attention à la cardioversion non protégée).</li><li>Ic : pas de coronaropathie ni de FEVG ≤ 40 % (CAST), toujours avec freinateur. Dronédarone : pas en FA permanente ni NYHA III–IV. Sotalol : QT, rein. Amiodarone : thyroïde, poumon, foie.</li><li>Interactions : azolés, rifampicine, millepertuis ; dronédarone + dabigatran ; amiodarone + digoxine ou antivitamine K ; médicaments allongeant le QT.</li></ul></template>

<template data-pop="i48-d-dig" data-title="Digoxine dans la fibrillation auriculaire">
<div class="lab">Mécanisme</div><p>Inhibition de la Na⁺/K⁺-ATPase : effet inotrope positif modeste, et surtout augmentation du tonus vagal, qui ralentit la conduction dans le nœud auriculoventriculaire.</p>
<div class="lab">Place (ESC 2024)</div><p>Freinateur de première ligne quelle que soit la FEVG, seul ou associé à un bêtabloquant. Particulièrement utile en cas de FEVG altérée ou de pression artérielle basse. Moins efficace à l’effort, quand le tonus vagal s’efface.</p>
<div class="lab">Preuves</div><p>RATE-AF : chez des sujets âgés en FA permanente avec symptômes d’insuffisance cardiaque, qualité de vie comparable au bisoprolol à six mois, avec moins d’effets indésirables.</p>
<div class="lab">Posologie</div><p>Charge intraveineuse totale de 0,75 à 1,5 mg sur 24 heures, bolus initial de 0,25 à 0,5 mg compris, en doses fractionnées ; charge réduite en cas d’insuffisance rénale ou de faible poids ; entretien oral 0,0625 à 0,25 mg/jour selon l’âge, le poids et la fonction rénale. Concentration cible basse (&lt; 1,2 ng/mL selon l’ESC 2020 ; 0,5 à 0,9 ng/mL dans l’insuffisance cardiaque), prélevée au moins 6 heures après la prise.</p>
<div class="lab">Digitoxine</div><p>Digitoxine : glycoside à élimination surtout hépatique, utilisable en insuffisance rénale ; demi-vie d’environ 7 jours ; l’essai DIGIT-HF (2025) l’a évaluée dans l’ICFEr.</p>
<div class="lab">Toxicité</div><p>Favorisée par l’insuffisance rénale, l’hypokaliémie, l’hypomagnésémie, l’âge et les interactions (amiodarone, vérapamil, dronédarone, clarithromycine). Signes : nausées, troubles visuels, confusion ; arythmies (extrasystoles ventriculaires bigéminées, tachycardie atriale avec bloc, FA lente et régulière par bloc complet). Antidote : fragments d’anticorps antidigoxine.</p>
<div class="lab">Contre-indications</div><p>FA pré-excitée ; bloc auriculoventriculaire de haut degré non appareillé ; cardiomyopathie hypertrophique obstructive.</p></template>
