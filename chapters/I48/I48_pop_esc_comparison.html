<p>Une classification de l’insuffisance cardiaque décrit un phénotype. Le seuil utilisé pour choisir un médicament répond à une autre question : dans quelle population son bénéfice et sa sécurité sont-ils établis ?</p>
<table class="t"><tr><th>Référentiel</th><th>Différence à retenir</th></tr>
<tr><td>Insuffisance cardiaque, ESC 2021 ; classification utilisée dans l’ESC FA 2024</td><td>Fraction réduite ≤ 40 % ; légèrement réduite 41–49 % ; préservée ≥ 50 %.</td></tr>
<tr><td>Insuffisance cardiaque (ESC 2026)</td><td>Deux phénotypes : fraction réduite &lt; 50 % et préservée ≥ 50 %. L’ancienne catégorie 41–49 % rejoint le premier groupe.</td></tr>
<tr><td>Contrôle de la fréquence, ESC FA 2024</td><td>Le choix du vérapamil ou du diltiazem reste fondé sur le seuil &gt; 40 % ; leur effet inotrope négatif explique leur exclusion quand la fonction systolique est trop diminuée.</td></tr>
<tr><td>Contrôle du rythme, ESC FA 2024, figure 5</td><td>L’insuffisance cardiaque stable à 41–49 % suit la branche des cardiopathies : amiodarone ou dronédarone selon les indications et contre-indications ; la classe Ic en est écartée.</td></tr></table>
<div class="lab">Conséquence clinique</div><p>Une fraction d’éjection à 45 % change de nom dans la classification 2026. Ce changement ne transpose pas automatiquement au patient les indications médicamenteuses étudiées avec un seuil de 40 %. Le médecin vérifie le référentiel de la décision concernée, la stabilité clinique et les contre-indications propres à la molécule.</p>
