
<!-- ===== FENÊTRES I48 : clinique et diagnostic ===== -->
<template data-pop="i48-s-avc" data-title="Antécédent d’AVC, d’accident ischémique transitoire ou d’embolie">
<div class="lab">Comment le rechercher</div><p>« Avez-vous déjà eu une paralysie, un trouble de la parole ou une perte de vision brutale, même transitoire ? Une artère bouchée dans un membre ? » Demander les comptes rendus et l’imagerie. L’imagerie distingue d’abord un infarctus d’une hémorragie : une hémorragie intracérébrale antérieure change la balance de l’anticoagulation et peut faire discuter une fermeture de l’auricule gauche. Des infarctus dans plusieurs territoires artériels orientent vers une source cardio-embolique. Pour un AVC récent, la taille de l’infarctus fixe le moment du début de l’anticoagulation (essai ELAN).</p>
<div class="lab">Pourquoi</div><p>C’est le facteur de risque le plus lourd du score : 2 points à lui seul, parce qu’un premier accident thromboembolique annonce un risque de récidive très élevé. Il multiplie le risque d’AVC par environ 2,5, plus que tout autre item. Sans anticoagulation, des patients en FA ayant eu un accident ischémique transitoire ou un AVC mineur récidivaient à environ 12 % par an, contre 4 % par an sous antivitamine K. Un antécédent d’AVC chez un patient en FA justifie donc l’anticoagulation, quel que soit le reste du score.</p>
<div class="lab">Piège</div><p>Un épisode transitoire banalisé par le patient (« une faiblesse de la main pendant dix minutes ») compte autant qu’un AVC constitué. Le mécanisme est le même : un embole, souvent parti de l’auricule gauche, occlut une artère cérébrale ; dans l’accident transitoire, il se fragmente ou se lyse avant que le tissu ne se nécrose. La source embolique reste en place, si bien que le risque de récidive est du même ordre.</p></template>

<template data-pop="i48-atcd-thyr" data-title="Antécédents thyroïdiens et amiodarone">
<div class="lab">À demander</div><p>Hyperthyroïdie connue, nodule, goitre ; substitution par lévothyroxine et sa dose ; traitement par amiodarone actuel ou passé, car <button class="w" data-k="i48-thyr">l’iode et l’effet de la molécule</button> persistent des mois après l’arrêt ; <button class="w" data-k="i48-thyr">produits iodés récents</button> (produit de contraste).</p>
<div class="lab">Pourquoi</div><p>L’hyperthyroïdie, <button class="w" data-k="i48-thyr">même infraclinique, favorise la FA</button>. Une surcharge de lévothyroxine en est une cause iatrogène fréquente chez le sujet âgé, car les besoins en hormone diminuent avec l’âge : une dose fixée des années plus tôt devient excessive si elle n’est pas revue. L’excès d’hormone thyroïdienne agit alors sur l’oreillette comme une hyperthyroïdie spontanée. Une TSH basse sous substitution conduit à réduire la dose, puis à recontrôler la TSH après au moins 6 semaines, car la demi-vie de la lévothyroxine, d’environ 7 jours, impose ce délai pour atteindre un nouvel équilibre.</p></template>

<template data-pop="i48-s-palp" data-title="Palpitations irrégulières">
<div class="lab">Caractériser</div><p>Début brutal ou progressif ; régularité (faire tapoter le rythme par le patient) ; durée ; mode de fin ; facteurs déclenchants (alcool, repas copieux, effort, repos nocturne), dont l’alcool, qui raccourcit la période réfractaire auriculaire : en réduire la consommation diminue les récidives ; symptômes associés ; heure exacte du début de l’épisode actuel.</p>
<div class="lab">Physiopathologie</div><p>Le patient perçoit l’irrégularité et la <button class="w" data-k="i48-cycle-variable">variation de force des contractions</button>, surtout les battements qui suivent une pause.</p>
<div class="lab">Orientation</div><p>Irrégulières : FA, extrasystoles. Régulières, début et fin brutaux : tachycardie par réentrée ou flutter. Une réentrée parcourt un circuit fixe en un temps constant, d’où des intervalles réguliers ; une extrasystole bien placée l’amorce d’un coup, et un bloc dans le circuit l’arrête d’un coup. Dans la FA, au contraire, les influx atteignent le nœud de façon désordonnée, et la conduction cachée rend chaque intervalle différent. FA « vagale » : nocturne, post-prandiale, chez le sportif ; FA « adrénergique » : à l’effort ou au stress. Dans la forme vagale, l’acétylcholine ouvre un canal potassique auriculaire et raccourcit de façon inégale la période réfractaire, ce qui raccourcit la longueur d’onde et facilite la réentrée. Dans la forme adrénergique, les catécholamines augmentent le courant calcique et l’activité déclenchée des veines pulmonaires. Cette distinction, classique, reste schématique : un bêtabloquant prévient plutôt la forme adrénergique et peut favoriser la forme vagale.</p>
<div class="lab">Importance de l’heure de début</div><p>Elle décide de la possibilité d’une cardioversion précoce (seuil de 24 heures), car dès le début de l’accès l’auricule ne se vide plus et un thrombus peut s’y former : les complications emboliques des cardioversions augmentent déjà au-delà de 12 heures. Une durée incertaine est considérée comme longue, car un accès asymptomatique peut avoir commencé plusieurs jours avant les symptômes.</p>
<div class="lab">Pourquoi la nuit et au repos</div><p>Au repos, et davantage pendant le sommeil, le tonus vagal domine ; le ralentissement sinusal en témoigne. L’acétylcholine stimule les récepteurs muscariniques de type 2 des myocytes auriculaires et ouvre un canal potassique activé par l’acétylcholine. La sortie de potassium raccourcit le potentiel d’action, donc la période réfractaire. L’innervation vagale étant inégale, ce raccourcissement varie d’une région à l’autre : la période réfractaire devient hétérogène. La longueur d’onde diminue et des blocs unidirectionnels apparaissent ; une extrasystole, souvent issue des veines pulmonaires, trouve alors un substrat capable d’entretenir la FA. Les ventricules, pauvres en ce canal, restent peu touchés. Chez l’animal, la stimulation vagale rend la FA inductible et durable, et le blocage des récepteurs muscariniques supprime cet effet (Zipes et Jalife). Coumel décrivait sur Holter un ralentissement sinusal progressif dans les minutes qui précèdent l’accès, le plus souvent chez un homme d’âge moyen sans cardiopathie, volontiers après le dîner (Coumel 1996). Au réveil, le tonus sympathique remonte, la période réfractaire s’allonge et l’accès cède souvent seul.</p>
<div class="lab">Alcool et apnées</div><p>L’alcool du soir s’ajoute à cette prédominance vagale, mais son mécanisme arythmogène propre reste discuté. Le lien clinique est établi : la réduction à 3 verres standard ou moins par semaine (30 g d’alcool) est recommandée pour réduire les récidives (ESC 2024, tableau de recommandations 5, classe I, niveau B). Pendant une apnée obstructive, l’effort inspiratoire contre des voies fermées étire l’oreillette, l’hypoxémie s’installe et des décharges vagales puis sympathiques alternent (Linz 2018). Des accès nocturnes font donc quantifier l’alcool en verres par semaine et rechercher des apnées par un enregistrement du sommeil, les questionnaires seuls n’étant pas recommandés en FA (classe III, niveau B).</p>
<div class="lab">Une notion débattue</div><p>La FA « vagale » repose sur des observations cliniques et des modèles animaux, non sur des essais comparatifs. Coumel en déduisait que les bêtabloquants et la digoxine, qui accentuent la bradycardie et la prédominance vagale, pouvaient aggraver ces accès. Cette déduction n’a pas été validée par des essais randomisés, et l’ESC 2024 ne fonde pas le choix des médicaments sur le profil autonome des accès. Le profil nocturne sert surtout à rechercher les facteurs déclenchants.</p>
<div class="lab">Source complémentaire</div><p>Coumel, Autonomic influences in atrial tachyarrhythmias, J Cardiovasc Electrophysiol 1996;7:999-1007. Zipes et al., Cardiac Electrophysiology: From Cell to Bedside, 8e éd., chapitre sur le système nerveux autonome et la FA. Linz et al., JAMA Cardiol 2018;3:532-40. Van Gelder et al., ESC 2024 sur la FA, Eur Heart J 2024;45:3314-414, sections 5.5 et 5.7, tableau de recommandations 5.</p>
</template>

<template data-pop="i48-s-dysp" data-title="Dyspnée et intolérance à l’effort en FA">
<div class="lab">Mécanismes</div><p>Perte de la systole auriculaire ; raccourcissement de la diastole par la tachycardie ; élévation de la <button class="w" data-k="i48-kick">pression dans l’oreillette gauche</button> ; fréquence inadaptée à l’effort, trop rapide ou trop lente sous freinateur.</p>
<div class="lab">Caractériser</div><p>Seuil d’effort, orthopnée, œdèmes, prise de poids : ils orientent vers une insuffisance cardiaque associée. En décubitus, le sang des membres inférieurs revient vers le thorax ; un ventricule gauche défaillant ne peut pas éjecter ce volume supplémentaire, et la pression capillaire pulmonaire monte. La rétention de sodium et d’eau par le rein fait prendre du poids avant que les œdèmes ne deviennent visibles. Ces signes imposent une échocardiographie et un NT-proBNP, car le choix du freinateur dépend de la FEVG : le vérapamil et le diltiazem ne sont employés que si elle dépasse 40 %.</p>
<div class="lab">Piège</div><p>Une dyspnée persistante malgré une fréquence contrôlée doit faire chercher une ICFEp, une valvulopathie ou une cause respiratoire, et non augmenter indéfiniment les freinateurs. Le débit cardiaque est le produit de la fréquence et du volume d’éjection, et il augmente à l’effort surtout par l’accélération. Un excès de freinateur empêche cette accélération : le débit ne suit plus la demande, et la dyspnée d’effort s’aggrave. Le médecin vérifie donc la fréquence à l’effort (Holter, test d’effort) avant toute augmentation.</p></template>

<template data-pop="i48-s-synco" data-title="Syncope chez un patient en FA">
<p>La syncope n’est pas un symptôme habituel de la FA : elle signale un mécanisme dangereux. Une syncope exige une baisse globale de la perfusion cérébrale : un arrêt du flux cérébral de 6 à 8 secondes suffit. Dans une FA ordinaire, le nœud auriculoventriculaire filtre les influx auriculaires et laisse passer une fréquence compatible avec un débit suffisant. Une syncope signifie donc que ce filtre est contourné (voie accessoire), qu’il bloque trop (pause, bloc) ou qu’une autre cause s’y ajoute.</p>
<div class="lab">Causes à rechercher</div><p><b><button class="w" data-k="i48-brady-tachy">Pause à l’arrêt de l’accès</button></b> (syndrome bradycardie-tachycardie) ; <b><button class="w" data-k="i48-preexc">FA pré-excitée</button></b> très rapide ; <b>bloc auriculoventriculaire</b> ou bradycardie sous freinateurs, quand les médicaments s’ajoutent à une maladie du tissu de conduction ; <b>tachycardie ventriculaire</b> sur cardiopathie, car une cicatrice ou une FEVG basse fournit le substrat d’une réentrée ventriculaire ; hypotension orthostatique médicamenteuse, par vasodilatateurs ou diurétiques ; rétrécissement aortique serré, car l’orifice fixe empêche le débit d’augmenter, et la perte de la systole auriculaire réduit encore le remplissage d’un ventricule hypertrophié.</p>
<div class="lab">Conduite</div><p>ECG, à la recherche d’une pré-excitation, d’un bloc auriculoventriculaire ou de branche et d’un QT long ; monitorage, pour saisir la pause ou la tachycardie au moment du symptôme ; échocardiographie, pour chercher un rétrécissement aortique, une FEVG basse ou une cicatrice ; Holter si les symptômes sont fréquents, moniteur implantable s’ils sont rares, car il enregistre pendant plusieurs années. Le résultat oriente vers un stimulateur (pause), un défibrillateur implantable (tachycardie ventriculaire sur FEVG basse) ou une ablation (voie accessoire). Conduite automobile : syncope inexpliquée, 3 mois d’attente pour le conducteur privé ; conducteur professionnel inapte jusqu’au diagnostic et au traitement, 12 mois au minimum si la cause reste inconnue (SSC/SSML 2024). Le délai est plus long pour le conducteur professionnel, car il passe plus de temps au volant et un accident de poids lourd ou de bus a des conséquences plus graves. Une cause identifiée et traitée, par exemple une pause corrigée par un stimulateur, raccourcit le délai.</p></template>

<template data-pop="i48-e-pouls" data-title="Pouls irrégulier et déficit de pouls">
<div class="lab">Technique</div><p>Palper le pouls radial pendant au moins 30 secondes, puis compter simultanément la fréquence à l’auscultation cardiaque (apex) et au poignet, idéalement à deux examinateurs. En FA, chaque intervalle diffère : un comptage court multiplié par 4 amplifie l’erreur, alors que 30 secondes au moins donnent une moyenne fiable. Le déficit de pouls change d’un cycle à l’autre ; seul un comptage simultané au cœur et au poignet le mesure.</p>
<div class="lab">Interprétation</div><p>Un pouls « irrégulièrement irrégulier » évoque une FA. La différence entre fréquence apicale et radiale est le déficit de pouls : les battements survenant après une diastole courte n’ouvrent pas la valve aortique ou n’éjectent pas assez pour être palpés. Le pouls radial sous-estime donc la fréquence ventriculaire réelle : le contrôle de la fréquence (cible de repos inférieure à 110/min) se juge à l’auscultation de l’apex ou sur l’ECG, jamais au pouls ni sur un oxymètre.</p>
<div class="lab">Valeur</div><p>La palpation du pouls est un outil de dépistage opportuniste sensible, mais peu spécifique : des extrasystoles, une arythmie sinusale respiratoire ou un bloc du deuxième degré rendent aussi le pouls irrégulier. Dans une revue systématique, sa sensibilité était d’environ 94 % et sa spécificité d’environ 72 %. Le doigt perçoit une onde de pression, pas l’activité électrique : il ne peut pas montrer l’absence d’onde P. Toute irrégularité impose donc un ECG, seul examen qui fonde une anticoagulation.</p></template>

<template data-pop="i48-e-ta" data-title="Mesure de la pression artérielle en FA">
<div class="lab">Problème</div><p>La pression varie d’un battement à l’autre <button class="w" data-k="i48-cycle-variable">avec la durée du cycle précédent</button>. Les <button class="w" data-k="i48-e-ta">tensiomètres oscillométriques automatiques</button> peuvent afficher des valeurs erronées ou une erreur.</p>
<div class="lab">Technique</div><p>Répéter au moins trois mesures et en faire la moyenne, car la pression change d’un battement à l’autre ; méthode auscultatoire manuelle en cas de doute, en dégonflant lentement le brassard. En FA, les battements audibles sont espacés de façon irrégulière : si le brassard se dégonfle vite, sa pression baisse beaucoup entre deux bruits, ce qui fausse la lecture de la systolique et de la diastolique.</p>
<div class="lab">Importance</div><p>L’hypertension non contrôlée est à la fois un facteur de risque d’AVC (item H), un facteur de risque hémorragique et un moteur du substrat. La post-charge élevée épaissit et rigidifie le ventricule gauche ; l’oreillette gauche doit élever sa pression pour le remplir, se dilate et se fibrose, ce qui favorise la réentrée et la stase dans l’auricule. Les petites artères cérébrales lésées par l’hypertension saignent plus facilement sous anticoagulant. L’ESC 2024 vise une systolique de 120 à 129 mmHg si elle est tolérée, pour réduire les récidives, la progression de la FA et les événements cardiovasculaires (classe I).</p>
<div class="lab">Pourquoi l’appareil se trompe</div><p>Le tensiomètre oscillométrique n’écoute aucun bruit. Il dégonfle le brassard par paliers et enregistre l’amplitude des oscillations que chaque pulsation transmet au brassard. Cette amplitude est maximale quand la pression du brassard avoisine la pression artérielle moyenne. L’appareil calcule ensuite la systolique et la diastolique à partir de la forme de cette courbe, par un algorithme propre au fabricant. Les protocoles de validation de ces appareils excluent les patients en FA.</p><p>En FA, un cycle long remplit davantage le ventricule ; selon la loi de Frank-Starling, le volume d’éjection et la pulsation suivante augmentent. Un cycle court produit au contraire une pulsation faible. L’amplitude enregistrée à chaque palier dépend alors autant du cycle précédent que de la pression du brassard. La courbe devient irrégulière et l’algorithme surestime, sous-estime ou rejette la mesure.</p>
<div class="lab">Ampleur de l’erreur</div><p>Une méta-analyse de 13 études portant sur 14 appareils trouve, par rapport au sphygmomanomètre à mercure, des écarts moyens de −3,1 à +6,1 mmHg pour la systolique et de −4,6 à +9,0 mmHg pour la diastolique, très variables d’un appareil à l’autre (Clark 2019). L’erreur n’a donc pas de sens constant et aucune correction fixe n’est possible. Les appareils dotés d’un détecteur de FA ne mesurent pas la pression plus exactement. Or l’ESC 2024 vise, chez la plupart des patients traités, une systolique de 120 à 129 mmHg (section 5.1) : un écart de 6 à 9 mmHg suffit à classer à tort un patient comme contrôlé ou non contrôlé.</p>
<div class="lab">Pourquoi répéter, et quand ausculter</div><p>Chaque mesure échantillonne une suite aléatoire de cycles longs et courts ; son erreur change d’une mesure à l’autre. La moyenne de plusieurs mesures compense en partie ces erreurs et se rapproche de la pression moyenne réelle. La méthode auscultatoire repose sur un autre signal, les bruits de Korotkoff, que l’observateur perçoit battement par battement. Près de la systolique, seuls les battements les plus puissants franchissent le brassard : un dégonflage lent évite de manquer le premier bruit. L’auscultation sert donc de contrôle quand l’appareil affiche une erreur ou une valeur discordante avec la clinique (Stergiou 2021 ; Mancia 2023).</p>
<div class="lab">Source complémentaire</div><p>Clark et al., J Hum Hypertens 2019;33:352-64. Stergiou et al., recommandations 2021 de la Société européenne d’hypertension pour la mesure de la pression artérielle, J Hypertens 2021;39:1293-302. Mancia et al., recommandations 2023 de la Société européenne d’hypertension, J Hypertens 2023;41:1874-2071. Van Gelder et al., ESC 2024 sur la FA, Eur Heart J 2024;45:3314-414, section 5.1. Hall et al., Guyton and Hall Textbook of Medical Physiology, 14e éd., chapitres 9 et 15.</p>
</template>

<template data-pop="i48-e-b1" data-title="Intensité variable du premier bruit">
<div class="lab">Mécanisme</div><p>L’intensité de B1 dépend de la position des feuillets mitraux au début de la systole. Après une diastole courte, les feuillets sont encore ouverts et se ferment avec force (B1 intense) ; après une diastole longue, ils se sont rapprochés (B1 faible).</p>
<div class="lab">Valeur</div><p>Une variation aléatoire de B1, associée à un rythme irrégulier, oriente vers une FA. Un B1 variable avec un rythme régulier évoque une dissociation auriculoventriculaire : oreillettes et ventricules battent chacun à leur rythme, si bien que le délai entre contraction auriculaire et systole ventriculaire change à chaque cycle, comme la position des feuillets mitraux. Les deux causes à retenir sont le bloc auriculoventriculaire complet et la tachycardie ventriculaire, que ce signe aide à reconnaître devant une tachycardie régulière à QRS larges.</p>
<div class="lab">Corrélation</div><p>En FA, il n’y a pas de quatrième bruit, car B4 exige une contraction auriculaire.</p></template>

<template data-pop="i48-e-jug" data-title="Pouls jugulaire en FA et en flutter">
<div class="lab">Normal</div><p>L’onde a correspond à la contraction de l’oreillette droite, juste avant le pouls carotidien.</p>
<div class="lab">FA</div><p>Onde a absente, faute de contraction auriculaire ; le pouls veineux ne montre qu’une onde systolique. Cette onde v traduit le remplissage de l’oreillette droite pendant la systole ventriculaire, valve tricuspide fermée. Une onde v ample et pulsatile évoque une insuffisance tricuspide, fréquente quand une FA ancienne a dilaté l’anneau.</p>
<div class="lab">Flutter</div><p>Des oscillations rapides et régulières (ondes de flutter) sont parfois visibles au cou, à une fréquence <button class="w" data-k="i48-ecg-flutter">multiple de celle du pouls</button>.</p>
<div class="lab">Congestion</div><p>Une turgescence jugulaire élevée signe une insuffisance cardiaque associée ou une surcharge droite. La veine jugulaire interne droite, dans l’axe de la veine cave supérieure, transmet la pression de l’oreillette droite : la hauteur de sa colonne mesure cette pression. Elle monte avec la rétention hydrosodée, la défaillance du ventricule droit, l’insuffisance tricuspide ou la tamponnade. Elle impose une échocardiographie et la prudence avec le vérapamil et le diltiazem, inotropes négatifs.</p></template>

<template data-pop="i48-e-thyr" data-title="Signes cliniques d’hyperthyroïdie">
<div class="lab">Signes généraux</div><p><button class="w" data-k="i48-e-thyr">Amaigrissement malgré un appétit conservé</button>, thermophobie, sueurs, tremblement fin des extrémités, nervosité, diarrhée.</p>
<div class="lab">Signes locaux</div><p>Goitre diffus avec souffle (maladie de Basedow), nodule (adénome toxique), exophtalmie et signes oculaires (propres à la maladie de Basedow). Dans la maladie de Basedow, des anticorps stimulent le récepteur de la TSH sur toute la glande, qui grossit et devient hypervascularisée, d’où le souffle. Les fibroblastes de l’orbite portent aussi ce récepteur : stimulés, ils provoquent une inflammation et des dépôts qui repoussent l’œil en avant. Un adénome toxique, autonome et localisé, n’a ni anticorps ni atteinte oculaire.</p>
<div class="lab">Piège</div><p>Chez le sujet âgé, l’hyperthyroïdie est <button class="w" data-k="i48-e-thyr">souvent « apathique »</button> : la FA, l’amaigrissement et la fatigue peuvent être les seuls signes. La TSH est donc demandée chez tout patient en FA.</p>
<div class="lab">Pourquoi ces signes généraux</div><p>La T3 augmente l’activité de la pompe sodium-potassium et la consommation mitochondriale d’oxygène. L’énergie dépensée se dissipe en chaleur : la dépense dépasse les apports, et le patient maigrit malgré un appétit conservé. Pour évacuer cette chaleur, la peau se vasodilate et la sudation augmente ; le patient ressent une intolérance au chaud. Les hormones thyroïdiennes augmentent aussi la sensibilité des tissus aux catécholamines, alors que celles-ci circulent à des concentrations normales. La stimulation β-adrénergique amplifie le tremblement physiologique, d’où un tremblement fin des extrémités, et explique la nervosité et la tachycardie. Le bêtabloquant atténue rapidement ces signes sans corriger l’hypermétabolisme, ce qui confirme leur origine adrénergique. L’accélération du transit réduit la réabsorption d’eau colique : les selles sont plus fréquentes et plus molles (Klein et Danzi 2007).</p>
<div class="lab">Pourquoi la forme « apathique » du sujet âgé</div><p>Avec l’âge, la réponse β-adrénergique diminue : le tremblement, la nervosité et la tachycardie sinusale s’atténuent. Un bêtabloquant prescrit pour une autre raison masque en outre ces signes. L’oreillette âgée, souvent dilatée et fibrosée, répond plus volontiers par une FA ; ce dernier lien repose surtout sur des données d’observation. Il ne reste alors que l’amaigrissement, la fatigue et l’arythmie. L’examen clinique ne permet donc pas d’exclure une hyperthyroïdie chez le sujet âgé, et une FA avec amaigrissement inexpliqué fait doser la TSH avant de chercher un cancer.</p>
<div class="lab">Décision</div><p>L’ESC 2024 demande un dosage de la TSH devant toute FA nouvelle ou récidivante, même sans signe évocateur (section 9.10 ; tableau 8). Le risque de FA croît en effet dès que la TSH baisse, y compris dans l’hyperthyroïdie infraclinique, qui ne donne par définition aucun signe clinique.</p>
<div class="lab">Source complémentaire</div><p>Klein et al., Circulation 2007;116:1725-35. Ross et al., recommandations 2016 de l’American Thyroid Association sur l’hyperthyroïdie, Thyroid 2016;26:1343-421. Van Gelder et al., ESC 2024 sur la FA, Eur Heart J 2024;45:3314-414, section 9.10 et tableau 8.</p>
</template>

<template data-pop="i48-ecg-fa" data-title="ECG de la fibrillation auriculaire : lecture pas à pas">
<div class="lab">1. Régularité</div><p>Mesurer plusieurs intervalles RR : ils varient sans aucune périodicité. Attention, à fréquence élevée (&gt; 150/min), l’irrégularité paraît moins évidente : la mesurer au compas ou sur un long tracé. Plus les intervalles sont courts, plus leurs écarts absolus se réduisent, car les influx tombent sans cesse sur un nœud encore réfractaire. L’œil prend alors le tracé pour régulier, et l’on risque de conclure à tort à un flutter 2:1 ou à une autre tachycardie supraventriculaire.</p>
<div class="lab">2. Activité auriculaire</div><p>Aucune onde P reproductible. Ondes f en V1 et II : fines ou grossières, de morphologie et de cycle variables. V1 est proche de l’oreillette droite et II suit l’axe de l’activation auriculaire : le faible signal auriculaire y est le moins atténué. Les ondes sont parfois presque invisibles (FA ancienne, oreillette fibrosée), car la fibrose réduit la masse de myocarde qui se dépolarise et fragmente les fronts d’onde, dont les vecteurs s’annulent.</p>
<div class="lab">3. QRS</div><p>Fins en général. Larges : bloc de branche préexistant, aberrance (phénomène d’Ashman), pré-excitation (morphologies changeantes, fréquence très élevée). Dans le phénomène d’Ashman, la période réfractaire des branches s’allonge après un cycle long ; un QRS précoce qui suit ce cycle long trouve la branche droite, la plus lente à récupérer, encore réfractaire, et prend un aspect de bloc de branche droite. Il touche des complexes isolés ou de courtes salves après une séquence long-court ; il ne faut pas le prendre pour une tachycardie ventriculaire.</p>
<div class="lab">4. Fréquence ventriculaire</div><p>Compter les QRS sur 10 secondes et multiplier par 6. Les intervalles RR étant tous différents, la règle « 300 divisé par le nombre de grands carreaux » ne donne que la fréquence d’un seul battement ; le comptage sur le tracé entier en donne la moyenne. Cette moyenne se compare à la cible de repos, inférieure à 110/min. Lente sans traitement : trouble de conduction nodale, sujet âgé. Sans freinateur, un nœud sain laisse passer le plus souvent 100 à 160 influx par minute en FA ; une fréquence basse signifie que le nœud est malade, souvent par fibrose dégénérative. Un freinateur y provoque facilement pauses et bradycardies, et une cardioversion peut démasquer une dysfonction sinusale : on documente le rythme par Holter avant de traiter.</p>
<div class="lab">5. Diagnostic</div><p>Le médecin confirme le rythme sur un ECG à 12 dérivations ou sur un autre tracé ECG interprétable, à une ou plusieurs dérivations. Un ECG standard de 10 secondes documente la FA lorsque l’arythmie occupe tout le tracé. Pour un tracé ambulatoire, la durée minimale n’est pas établie et dépend du contexte ; le repère de 30 secondes ou plus est un consensus (ESC 2024). Une durée minimale écarte les faux diagnostics : quelques secondes de tracé peuvent montrer une salve d’extrasystoles auriculaires, une tachycardie atriale brève ou un artefact qui simule des ondes f. Or le diagnostic de FA engage le plus souvent une anticoagulation au long cours, avec son risque hémorragique.</p>
<div class="lab">Erreur fréquente</div><p>Confondre des ondes f grossières avec un flutter : dans la FA, leur cycle et leur morphologie varient ; dans le flutter, elles sont identiques et régulières.</p></template>

<template data-pop="i48-ecg-flutter" data-title="ECG du flutter typique et atypique">
<div class="lab">Flutter typique antihoraire (le plus fréquent)</div><p>Circuit autour de l’anneau tricuspide, montant le long du septum et descendant le long de la paroi latérale. Ondes F en dents de scie, sans ligne isoélectrique, <b>négatives en II, III et aVF</b>, <b>positives en V1</b>. Fréquence auriculaire 250–350/min. Dans une macroréentrée, une partie de l’oreillette se dépolarise à chaque instant : le tracé ne revient jamais à la ligne de base. Le front d’onde monte le long du septum en s’éloignant des dérivations inférieures, qui s’inscrivent négatives, puis redescend la paroi latérale vers l’avant, d’où l’onde positive en V1. La fréquence dépend de la longueur du circuit autour de l’anneau tricuspide et de la conduction lente dans l’isthme.</p>
<div class="lab">Flutter typique horaire</div><p>Même circuit, sens inverse : ondes F <b>positives</b> dans les dérivations inférieures, larges et <b>négatives en V1</b>. Également dépendant de l’isthme cavotricuspide : le circuit passe dans les deux sens par la même bande étroite de tissu, entre la veine cave inférieure et l’anneau tricuspide. Une même ligne d’ablation de cet isthme guérit donc les deux formes ; elle ne guérit pas un flutter atypique.</p>
<div class="lab">Flutter atypique</div><p>Circuit indépendant de l’isthme : autour de cicatrices de chirurgie cardiaque ou d’ablation, autour de l’anneau mitral, sur le toit de l’oreillette gauche. Morphologie des ondes variable, parfois avec une ligne isoélectrique entre elles, ce qui le rapproche d’une tachycardie atriale : quand le circuit passe par une zone étroite de conduction très lente, au bord d’une cicatrice, la petite masse activée ne produit presque aucun signal en surface. Son ablation exige une cartographie électroanatomique, car le circuit n’a pas de siège fixe : il faut le reconstruire en trois dimensions pour trouver l’isthme critique à interrompre.</p>
<div class="lab">Conduction auriculoventriculaire</div><p>2:1 le plus souvent (≈ 150/min) ; 4:1 sous freinateur (≈ 75/min) ; variable (RR irréguliers mais multiples d’un même cycle) ; 1:1 exceptionnel et dangereux (catécholamines, classe Ic, voie accessoire).</p>
<div class="lab">Pièges</div><p>Une onde F cachée dans le QRS ou l’onde T fait croire à une tachycardie sinusale. Retourner le tracé ou regarder V1 et les dérivations inférieures aide : dans le flutter antihoraire, les ondes F négatives en inférieur se confondent avec ST et T, et le tracé retourné les rend positives et visibles ; ces dérivations sont aussi celles où l’axe du circuit donne les ondes les plus amples. L’adénosine démasque les ondes F, car elle supprime pendant quelques secondes les QRS et les ondes T qui les cachaient.</p>
<div class="lab">Pourquoi des dents de scie</div><p>En rythme sinusal, l’activation des oreillettes dure moins de 120 ms, puis elles restent électriquement silencieuses jusqu’à l’onde P suivante : c’est la ligne isoélectrique. Dans le flutter, le front d’activation tourne sans arrêt autour de l’anneau tricuspide. À chaque instant, une partie de l’oreillette se dépolarise, et l’ECG enregistre une ondulation continue. Dans le sens antihoraire, l’activation remonte le septum interauriculaire et s’éloigne des dérivations inférieures, où les ondes F sont donc négatives. L’origine de la positivité en V1 reste discutée. Cette morphologie prédit un circuit dépendant de l’isthme cavotricuspide, donc une ablation de l’isthme efficace ; la prédiction est moins sûre après une chirurgie cardiaque ou une ablation de l’oreillette gauche.</p>
<div class="lab">Pourquoi une conduction 2:1 à 150/min</div><p>À 300/min, une onde F arrive toutes les 200 ms. Chez l’adulte, la période réfractaire du nœud auriculoventriculaire dépasse habituellement cette durée : une onde sur deux trouve le nœud réfractaire. La fréquence ventriculaire dépend alors du circuit, non de l’effort. L’onde bloquée tombe à mi-cycle, dans le QRS ou l’onde T, et devient invisible. En conduction variable, les RR ne prennent que quelques valeurs, proches de multiples du cycle du flutter ; ceux de la FA varient de façon continue. Au cou, les ondes de flutter battent de même à deux ou quatre fois la fréquence du pouls. Les catécholamines raccourcissent la période réfractaire nodale, la classe Ic allonge le cycle du flutter, une voie accessoire ne filtre pas : chacune permet une conduction 1:1, qui efface presque la diastole et effondre le débit.</p>
<div class="lab">Pourquoi la 2:1 résiste aux freinateurs</div><p>La fréquence ne baisse pas progressivement avec la dose. Schématiquement, tant que la période réfractaire nodale reste inférieure à deux cycles de flutter, soit environ 400 ms, la conduction reste 2:1 à 150/min. Au-delà, la fréquence chute d’un coup vers 100/min (3:1) ou 75/min (4:1). Le médecin augmente donc les doses sans effet visible, puis s’expose brusquement à une bradycardie ou à une hypotension. L’ESC 2024 constate que le contrôle de la fréquence est souvent difficile dans le flutter, même avec une association de freinateurs (section 9.14).</p>
<div class="lab">Ce qui change la décision</div><p>Une tachycardie régulière fixée vers 150/min, qui varie peu avec l’effort, est un flutter 2:1 jusqu’à preuve du contraire. Le médecin cherche les ondes F en V1 et dans les dérivations inférieures, puis les démasque par une manœuvre vagale ou par l’adénosine. Comme la fréquence se contrôle mal, il privilégie le contrôle du rythme : cardioversion, puis ablation de l’isthme pour le flutter typique, supérieure aux antiarythmiques dans de petits essais randomisés.</p>
<div class="lab">Source complémentaire</div><p>Saoudi et al., classification des flutters et tachycardies atriales, Eur Heart J 2001;22:1162-82 ; Brugada et al., ESC 2019 sur les tachycardies supraventriculaires, Eur Heart J 2020;41:655-720 ; Issa, Miller et Zipes, Clinical Arrhythmology and Electrophysiology, 3e éd., 2019 ; ESC 2024 (Van Gelder et al., Eur Heart J 2024;45:3314-414), section 9.14.</p>
</template>

<template data-pop="i48-adeno" data-title="Adénosine et manœuvres vagales comme outils diagnostiques">
<div class="lab">Principe</div><p>L’adénosine bloque transitoirement, pendant quelques secondes, la conduction du nœud auriculoventriculaire. Les manœuvres vagales (Valsalva modifiée, massage sinocarotidien après exclusion d’un souffle carotidien) ralentissent le nœud de façon plus modeste. Elles stimulent les barorécepteurs, et la décharge vagale libère de l’acétylcholine sur le nœud. Dans la manœuvre modifiée, le patient souffle contre une résistance de 40 mmHg pendant 15 secondes en position demi-assise, puis il est aussitôt allongé jambes levées : l’afflux veineux amplifie la remontée tensionnelle et donc le réflexe vagal. Dans un essai randomisé britannique, le retour en rythme sinusal des tachycardies supraventriculaires est passé d’environ 17 % à 43 %. Le massage peut détacher une plaque carotidienne, d’où l’auscultation préalable.</p>
<div class="lab">Lecture</div><p>Pendant le bloc, les ondes F du flutter ou les ondes P d’une tachycardie atriale apparaissent, car ces arythmies naissent dans l’oreillette et le nœud ne fait que les transmettre : on supprime les QRS sans arrêter l’arythmie. Une tachycardie par réentrée utilisant le nœud s’arrête, car le nœud fait partie de son circuit. Le test fait donc le diagnostic d’un flutter, mais il ne le traite pas.</p>
<div class="lab">Technique</div><p>6 mg en bolus intraveineux rapide, en 2 secondes, suivi d’un rinçage, puis 12 mg après 1 à 2 minutes si besoin, sous enregistrement ECG continu, défibrillateur à proximité. L’information professionnelle suisse Krenosin® ne recommande pas de dose supplémentaire.</p>
<div class="lab">Contre-indications et précautions</div><p>Selon l’information professionnelle suisse Krenosin® : asthme et bronchopneumopathie obstructive, QT long, hypotension sévère, insuffisance cardiaque décompensée, bloc auriculoventriculaire du deuxième ou du troisième degré et maladie du sinus sans stimulateur. S’y ajoutent la FA pré-excitée et la tachycardie irrégulière à QRS larges (ESC 2019). Prévenir le patient du malaise bref (bouffée de chaleur, oppression).</p>
<div class="lab">Mécanisme</div><p>L’adénosine se fixe sur les récepteurs A<sub>1</sub> des cellules nodales et sinusales. Elle ouvre le même canal potassique que l’acétylcholine, ce qui hyperpolarise ces cellules, et elle s’oppose à l’effet adrénergique sur le courant calcique dont dépend la conduction nodale. Le nœud auriculoventriculaire cesse alors de conduire pendant quelques secondes. Une réentrée qui passe par le nœud s’interrompt ; un circuit purement auriculaire, comme celui du flutter, continue et se découvre.</p>
<div class="lab">Pourquoi un bolus rapide</div><p>Les globules rouges et l’endothélium captent l’adénosine, puis la dégradent : sa demi-vie dans le sang est inférieure à 10 secondes. Injectée lentement ou dans une veine distale, elle disparaît avant d’atteindre le cœur. Le médecin injecte donc dans une veine proximale, rince aussitôt et enregistre l’ECG en continu. Si 6 puis 12 mg échouent, l’ESC 2019 admet jusqu’à 18 mg, dose que l’information professionnelle suisse ne prévoit pas. Le dipyridamole bloque la recapture de l’adénosine et peut en multiplier l’effet par quatre : l’information suisse demande de l’arrêter 24 heures avant ou de réduire nettement la dose. Un cœur transplanté depuis moins d’un an y est plus sensible, et l’ESC 2019 y réduit la dose initiale. La théophylline et la caféine bloquent ses récepteurs et diminuent son effet.</p>
<div class="lab">Effets indésirables expliqués</div><p>L’adénosine raccourcit la période réfractaire auriculaire et peut déclencher une FA. En présence d’une voie accessoire, cette FA atteint les ventricules sans filtre, et le blocage du nœud oriente encore davantage les influx vers la voie. Une asystolie de quelques secondes est possible. C’est pourquoi un défibrillateur reste à proximité et une tachycardie irrégulière à QRS larges exclut l’adénosine. Un bloc auriculoventriculaire de haut degré ou une dysfonction sinusale sans stimulateur l’excluent aussi, car le blocage risque de se prolonger. La bouffée de chaleur vient d’une vasodilatation par les récepteurs A<sub>2A</sub>. L’oppression thoracique résulte de la stimulation de fibres afférentes cardiaques et ne traduit pas une ischémie. Chez l’asthmatique, un bronchospasme peut survenir, par un mécanisme en partie lié aux mastocytes et encore incomplètement élucidé.</p>
<div class="lab">Source complémentaire</div><p>Lerman et Belardinelli, Circulation 1991;83:1499-509 ; Brugada et al., ESC 2019 sur les tachycardies supraventriculaires, Eur Heart J 2020;41:655-720 ; information professionnelle suisse Krenosin®, Swissmedic (AIPS), consultée le 08.10.2026.</p>
</template>

<template data-pop="i48-preexc" data-title="FA pré-excitée (syndrome de Wolff-Parkinson-White)">
<div class="lab">Mécanisme</div><p>Une voie accessoire auriculoventriculaire (faisceau de Kent) court-circuite le nœud. En FA, elle peut conduire à plus de 250/min, avec un risque de fibrillation ventriculaire et de mort subite.</p>
<div class="lab">ECG</div><p>Une tachycardie <b>irrégulière</b> à <b>QRS larges</b> et de morphologie variable fait suspecter une FA pré-excitée ; la morphologie change d’un battement à l’autre parce que la part du ventricule activée par la voie accessoire varie. Les intervalles RR les plus courts peuvent être &lt; 250 ms, signe d’une voie capable de conduire assez vite pour déclencher une fibrillation ventriculaire. Le diagnostic différentiel inclut une tachycardie ventriculaire polymorphe et une arythmie atriale avec conduction aberrante. En rythme sinusal, un PR court et une onde delta soutiennent une pré-excitation manifeste. La voie court-circuite le délai nodal, d’où un PR inférieur à 120 ms ; l’activation précoce progresse lentement de cellule à cellule dans le myocarde, hors du réseau de Purkinje, et produit le début empâté du QRS.</p>
<div class="lab">Contre-indiqués</div><p>Adénosine, bêtabloquants, vérapamil, diltiazem, digoxine ; amiodarone intraveineuse non recommandée (ESC 2019 sur les tachycardies supraventriculaires). Les quatre premiers ralentissent le nœud sans freiner la voie accessoire : ils suppriment la conduction cachée par laquelle les influx nodaux rendaient la voie en partie réfractaire, et davantage d’influx passent par la voie. Le vérapamil et le diltiazem abaissent aussi la pression, et la décharge sympathique réflexe accélère la conduction de la voie ; la digoxine raccourcit sa période réfractaire. L’ESC 2024 écarte l’amiodarone en raison de son action retardée.</p>
<div class="lab">Conduite</div><p>Instable : cardioversion électrique synchronisée immédiate (classe I). Stable : cardioversion électrique, ou ibutilide ou procaïnamide (classe IIa), ou flécaïnide ou propafénone (classe IIb), selon la disponibilité. Ces molécules sont permises parce qu’elles agissent sur le myocarde ordinaire, dont est faite la voie : elles ralentissent sa conduction ou allongent sa période réfractaire au lieu de bloquer d’abord le nœud. L’ESC 2024 cite l’ibutilide et la flécaïnide, et demande la prudence avec la propafénone, qui agit aussi sur le nœud. La disponibilité locale de ces médicaments doit être vérifiée. La cardioversion électrique reste une option chez le patient stable, notamment si aucun médicament adapté n’est disponible. Puis <b>ablation de la voie accessoire</b> (classe I), qui guérit la pré-excitation.</p>
<div class="lab">Piège</div><p>Une tachycardie irrégulière à QRS larges dont la morphologie varie d’un complexe à l’autre et dont la fréquence dépasse 200/min n’est pas « une FA avec bloc de branche » : elle évoque une FA pré-excitée.</p>
<div class="lab">Pourquoi la voie accessoire conduit si vite</div><p>Le nœud auriculoventriculaire dépend du courant calcique et ne récupère son excitabilité qu’après la fin de la repolarisation : un influx précoce y est ralenti ou bloqué. La voie accessoire est faite de myocarde ordinaire, qui dépend du courant sodique rapide et redevient excitable dès la fin de la repolarisation. Elle conduit chaque influx sans décrément, jusqu’à ce qu’un influx tombe dans sa période réfractaire. Sa période réfractaire antérograde fixe donc le plafond : à 200 ms, elle peut transmettre jusqu’à 300 influx par minute. De rares voies décrémentielles font exception.</p>
<div class="lab">Pourquoi les QRS changent de forme</div><p>L’influx passé par la voie active le ventricule de cellule à cellule, hors du réseau de His-Purkinje : le QRS débute par une onde delta et s’élargit. Le même influx peut aussi descendre par le nœud, qui active vite le reste du myocarde. Chaque QRS fusionne ces deux fronts, et la part pré-excitée change avec le délai nodal, variable à chaque battement en FA.</p>
<div class="lab">Dégénérescence en fibrillation ventriculaire</div><p>Le plus court RR pré-excité mesure la capacité maximale de la voie ; un RR inférieur ou égal à 250 ms désigne une voie dangereuse (ESC 2019 sur les tachycardies supraventriculaires). Chez les patients de Klein et al. qui avaient fait une fibrillation ventriculaire, ce RR valait en moyenne 180 ms, contre 240 ms chez les autres ; les voies multiples y étaient aussi plus fréquentes. À un intervalle aussi court, l’influx atteint le ventricule à la fin de l’onde T précédente. C’est la période vulnérable : certaines régions ont récupéré, d’autres sont encore réfractaires. L’influx bloqué dans ces dernières peut y revenir quand elles redeviennent excitables, et cette réentrée se fragmente en fibrillation ventriculaire. L’ischémie et la décharge de catécholamines dues à la fréquence extrême accentuent cette hétérogénéité. Dans le registre prospectif de Pappone et al., la fibrillation ventriculaire était liée à une période réfractaire antérograde courte de la voie et à une tachycardie réciproque dégénérant en FA, mais pas aux symptômes.</p>
<div class="lab">Pourquoi les freinateurs du nœud sont dangereux</div><p>En FA pré-excitée, les influx conduits par le nœud dépolarisent les ventricules et pénètrent la voie à rebours. Ils la laissent brièvement réfractaire et bloquent une partie des influx auriculaires : cette conduction cachée protège en partie les ventricules. Bloquer le nœud supprime cette protection et dirige davantage d’influx par la voie. D’autres mécanismes, en partie hypothétiques, s’y ajoutent. L’hypotension due au vérapamil ou au diltiazem déclenche une décharge sympathique réflexe, qui raccourcit la période réfractaire de la voie. La digoxine a accéléré la réponse ventriculaire chez certains patients, peut-être en raccourcissant directement cette période réfractaire (Sellers et al., 1977). Le propranolol, qui agit peu sur la voie, n’a pas ralenti la réponse ventriculaire (Morady et al., 1987).</p>
<div class="lab">Pourquoi l’amiodarone intraveineuse est à éviter</div><p>Les effets initiaux de l’amiodarone intraveineuse prédominent au nœud auriculoventriculaire, par ses actions antiadrénergique et calcique. Dans une petite étude électrophysiologique, son effet sur la réfractarité antérograde de la voie accessoire était moins marqué qu’après une charge orale ; les contributions de l’accumulation et des métabolites restaient incertaines (Wellens et al., 1984). L’amiodarone peut aussi provoquer une hypotension. Son action aiguë ne fournit donc pas une protection fiable contre la conduction très rapide par la voie ; l’ESC 2024 recommande de l’éviter dans la FA pré-excitée en raison de son action retardée (section 9.11 ; tableau 12, note a).</p>
<div class="lab">Pourquoi certains antiarythmiques conviennent</div><p>Ces médicaments agissent sur la voie elle-même. L’ibutilide allonge sa période réfractaire antérograde (Glatter et al., 2001). Le procaïnamide ralentit sa conduction et allonge sa réfractarité. La flécaïnide bloque le courant sodique dont la voie dépend, d’autant plus que la fréquence est rapide. Ces médicaments peuvent aussi interrompre la FA. La propafénone ralentit en plus le nœud par son effet bêtabloquant : l’ESC 2024 demande de l’employer avec prudence (section 9.11).</p>
<div class="lab">Pourquoi la cardioversion électrique est sûre</div><p>Le choc dépolarise en même temps tout le myocarde auriculaire excitable : les ondes de réentrée rencontrent un tissu réfractaire et s’éteignent. Il interrompt la FA elle-même, au lieu de modifier le passage des influx, et ne reporte donc pas la conduction sur la voie. La synchronisation sur l’onde R évite de délivrer le choc pendant la période vulnérable ventriculaire. Après l’épisode, la voie persiste, et une nouvelle FA reproduirait le même danger : son ablation rend au nœud son rôle de seul filtre.</p>
<div class="lab">Source complémentaire</div><p>Brugada et al. 2019 ESC Guidelines for the management of patients with supraventricular tachycardia. Eur Heart J 2020;41:655-720. ESC 2024, sections 7.2.2 et 9.11, tableau 12 (note a). Klein et al. N Engl J Med 1979;301:1080-5. Pappone et al. Circulation 2014;130:811-9. Sellers et al. Circulation 1977;56:260-7. Morady et al. Pacing Clin Electrophysiol 1987;10:492-6. Glatter et al. Circulation 2001;104:1933-9. <a href="https://pubmed.ncbi.nlm.nih.gov/6689635/" target="_blank" rel="noopener">Wellens et al., Circulation 1984;69:120–124</a>, étude électrophysiologique de 12 patients ; information professionnelle suisse Cordarone® (métabolite actif N-déséthylamiodarone, accumulation tissulaire), Swissmedic (AIPS), consultée le 08.10.2026. Issa et al. Clinical Arrhythmology and Electrophysiology, 3e éd., chapitre sur les voies accessoires.</p>
</template>

<template data-pop="i48-depist" data-title="Outils de dépistage de la FA">
<div class="lab">Palpation du pouls</div><p>Simple, sensible, peu spécifique, car des extrasystoles ou une arythmie sinusale rendent aussi le pouls irrégulier. Elle ne coûte rien et se répète à chaque consultation, d’où son rôle de point de départ du dépistage opportuniste ; toute irrégularité conduit à un ECG.</p>
<div class="lab">ECG à une dérivation</div><p>Les appareils portatifs et certaines montres produisent un véritable tracé ECG. Après une alerte de dépistage, l’ESC 2024 recommande qu’un médecin relise un tracé ECG, à 12 dérivations ou à une ou plusieurs dérivations, pour poser un diagnostic certain. Les algorithmes des appareils classent le rythme d’après l’irrégularité des intervalles et confondent la FA avec des extrasystoles fréquentes, une tachycardie atriale ou des artefacts. Le médecin vérifie l’absence d’onde P et la présence d’ondes f avant un diagnostic qui engage une anticoagulation. Le tableau de recommandations 31 ne précise pas de durée. Après une alerte de dépistage, le texte du § 10.2 mentionne toutefois un tracé à une dérivation ou continu de plus de 30 secondes, ou un ECG à 12 dérivations. Une alerte optique seule ne documente pas le rythme. Le repère de durée ne détermine pas seul le traitement : une fois la FA documentée, l’anticoagulation dépend du score CHA₂DS₂-VA, des facteurs hémorragiques corrigeables et du contexte. Une FA brève détectée par un dispositif implanté comporte un risque embolique plus faible, d’environ 1 % par an dans les essais ARTESiA et NOAH-AFNET 6, si bien que le bénéfice de l’anticoagulation y est moindre.</p>
<div class="lab">Photopléthysmographie</div><p>Capteur optique des montres et bagues connectées, qui analyse la régularité du pouls. Elle alerte, mais ne permet pas de poser le diagnostic : un ECG est nécessaire. Le capteur mesure les variations d’absorption de la lumière à chaque afflux de sang dans la peau ; il obtient l’intervalle entre les ondes de pouls, mais aucune information électrique. Il ne voit ni onde P ni onde f, et les mouvements du poignet créent des irrégularités artificielles.</p>
<div class="lab">Enregistrements prolongés</div><p>Patchs, Holter de plusieurs jours, enregistrements intermittents répétés : augmentent le rendement du dépistage populationnel, car une FA paroxystique ne se voit que pendant ses accès, et la probabilité d’en saisir un croît avec la durée d’enregistrement. Le bénéfice clinique reste modeste : dans un essai suédois chez des sujets de 75 ans, deux ECG à une dérivation par jour pendant 2 semaines n’ont réduit que légèrement le critère combiné de décès, d’AVC, d’embolie et d’hémorragie grave (rapport de risque 0,96).</p>
<div class="lab">Recommandations</div><p>Évaluation de routine du rythme dès 65 ans, lors de tout contact de soins (ESC 2024, classe I, niveau C) ; dépistage populationnel prolongé à envisager dès 75 ans, ou dès 65 ans avec d’autres facteurs du score (classe IIa, niveau B). Les seuils d’âge suivent le score : dès 65 ans, le patient a au moins 1 point et, dès 75 ans, au moins 2, si bien qu’une FA découverte change la décision d’anticoagulation. L’évaluation opportuniste ne coûte presque rien (classe I) ; le dépistage prolongé est plus lourd pour un bénéfice modeste (classe IIa). Toute FA dépistée entre dans le parcours AF-CARE.</p>
<div class="lab">Ce que mesure chaque outil</div><p>La photopléthysmographie d’une montre ou d’une bague éclaire la peau et recueille la lumière réfléchie. À chaque systole, l’onde de pouls augmente brièvement le volume de sang du derme, donc l’absorption de la lumière. L’algorithme en déduit l’intervalle entre deux pulsations et sa variabilité (Allen, 2007). Il mesure ainsi un phénomène circulatoire périphérique, jamais l’activité électrique des oreillettes. La palpation du pouls et les tensiomètres oscillométriques ont la même limite : l’ESC 2024 les range parmi les méthodes non diagnostiques, seulement évocatrices de FA (figure 15, tableau 15).</p>
<div class="lab">Pourquoi un pouls irrégulier n’est pas toujours une FA</div><p>Plusieurs rythmes non fibrillatoires rendent les pulsations irrégulières. Une extrasystole survient après une diastole raccourcie : le ventricule peu rempli éjecte un faible volume, parfois sans onde de pouls perceptible, puis une pause suit. L’arythmie sinusale respiratoire accélère le cœur à l’inspiration, par baisse du tonus vagal, et le ralentit à l’expiration. Un flutter à conduction variable donne des RR irréguliers alors que l’activité auriculaire reste organisée. Enfin, un mouvement du poignet modifie le contact optique et crée de fausses pulsations (Allen, 2007).</p>
<div class="lab">Ce que seul l’ECG démontre</div><p>L’ECG enregistre directement la dépolarisation des oreillettes. La FA s’y définit par l’absence d’ondes P distinctes et régulières et par des RR sans aucune périodicité, en l’absence de bloc auriculoventriculaire (ESC 2024, section 3.1). Le tracé distingue ainsi la FA des extrasystoles, où une onde P ou un QRS prématuré précède chaque pause, de l’arythmie sinusale, où une onde P sinusale précède chaque QRS, et du flutter, dont les ondes auriculaires sont régulières. L’ESC 2024 exige donc une confirmation par un ECG, à 12, plusieurs ou une dérivation, avant toute stratification du risque et tout traitement (tableau de recommandations 1, classe I, niveau A).</p>
<div class="lab">Ce qui change la décision</div><p>Les études comparant la photopléthysmographie d’un téléphone portable à un ECG de référence ont rapporté une sensibilité et une spécificité irréalistes, en raison de petits effectifs et d’un fort biais de sélection (ESC 2024, section 10.2). Or l’anticoagulant prévient un thrombus né de la stase dans une oreillette qui ne se contracte plus. Sans FA, ce mécanisme manque : un traitement prescrit à tort expose pendant des années au risque hémorragique, sans protection en retour. L’ESC 2024 justifie l’exigence d’un ECG par la nécessité d’éviter un diagnostic inapproprié de FA (section 3.2).</p>
<div class="lab">Source complémentaire</div><p>ESC 2024, sections 3.1 et 3.2 (tableau de recommandations 1), section 10.2 (figure 15, tableau 15, tableau de recommandations 31). Allen. Photoplethysmography and its application in clinical physiological measurement. Physiol Meas 2007;28:1-39. Guyton &amp; Hall, Textbook of Medical Physiology, 14e éd., chapitre sur les arythmies cardiaques (extrasystoles, arythmie sinusale).</p>
</template>

<template data-pop="i48-ic-flutter" data-title="Flutter 1:1 induit par les antiarythmiques de classe Ic">
<div class="lab">Mécanisme</div><p>La flécaïnide et la propafénone ralentissent la conduction dans l’oreillette. Une FA peut s’organiser en flutter, et ce flutter devient plus lent, par exemple 200/min au lieu de 300/min. Le nœud auriculoventriculaire, qui bloquait une onde sur deux à 300/min, peut alors toutes les conduire.</p>
<div class="lab">ECG</div><p>Tachycardie régulière à 200–250/min à QRS larges, car la classe Ic ralentit aussi la conduction ventriculaire à fréquence élevée. Elle peut être confondue avec une tachycardie ventriculaire.</p>
<div class="lab">Prévention</div><p>Associer systématiquement un bêtabloquant, du vérapamil ou du diltiazem à la classe Ic : le freinateur allonge la période réfractaire du nœud, si bien qu’un flutter ralenti continue d’être conduit en 2:1 et non en 1:1. Contrôler le QRS à l’effort, car la molécule se détache lentement du canal sodique et son blocage s’accumule quand la fréquence monte. Un élargissement du QRS de plus de 25 % impose l’arrêt ou la réduction de dose.</p>
<div class="lab">Pourquoi chaque onde passe</div><p>Le cycle d’une réentrée vaut la longueur du circuit divisée par la vitesse de conduction. Un flutter à 300/min a un cycle de 200 ms, plus court que la période réfractaire nodale : le nœud bloque une onde sur deux. La classe Ic ralentit la conduction dans le circuit. Le cycle s’allonge, par exemple à 300 ms (200/min), et dépasse alors la période réfractaire du nœud. À l’effort, les catécholamines raccourcissent encore cette période réfractaire, et chaque onde passe. La flécaïnide agit peu sur le nœud auriculoventriculaire et ne compense donc pas ce gain de conduction.</p>
<div class="lab">Pourquoi le QRS s’élargit</div><p>La classe Ic se détache lentement des canaux sodiques. Plus la fréquence est rapide, moins le canal a de temps pour se libérer entre deux battements, et plus la conduction ventriculaire ralentit : c’est la dépendance à l’usage, mesurée à l’effort sous <button class="w" data-k="i48-d-flec">flécaïnide</button>. À 200–250/min, l’élargissement devient majeur et le tracé imite une tachycardie ventriculaire.</p>
<div class="lab">Surveillance et décision</div><p>Le médecin mesure le QRS après l’initiation, après chaque augmentation de dose, puis à l’effort, car l’effort révèle un élargissement que le repos masque. Un QRS élargi de plus de 25 % par rapport au tracé initial, ou un bloc de branche nouveau, impose d’arrêter la perfusion (ESC 2024, tableau 13) ; sous traitement oral, le même seuil impose de réévaluer la dose. L’ESC 2024 recommande d’envisager un bêtabloquant, du diltiazem ou du vérapamil chez tout patient sous classe Ic (tableau de recommandations 18, classe IIa, niveau C). La classe Ic ne doit pas servir à convertir un flutter (tableau 13). Un flutter apparu sous classe Ic fait discuter l’ablation de l’isthme cavotricuspide, qui supprime ce circuit tout en laissant le médicament agir sur la FA.</p>
<div class="lab">Source complémentaire</div><p>ESC 2024 (Van Gelder et al., Eur Heart J 2024;45:3314-414), section 7.2.3, tableau 13 et tableau de recommandations 18 ; information professionnelle de Tambocor (réévaluation au-delà de 25 % d’allongement du QRS).</p>
</template>

<template data-pop="i48-afcare" data-title="Parcours AF-CARE (ESC 2024)">
<div class="lab">C — Comorbidités et facteurs de risque</div><p>Rechercher et traiter chez tous : hypertension, insuffisance cardiaque, diabète, obésité, apnées, alcool, sédentarité. Le « C » est placé en premier parce qu’il agit sur le substrat de la maladie. Ces facteurs élèvent la pression de l’oreillette gauche ou l’étirent (hypertension, insuffisance cardiaque, apnées), l’infiltrent ou l’enflamment (graisse épicardique de l’obésité) ou raccourcissent sa période réfractaire (alcool) ; l’oreillette se dilate et se fibrose, ce qui entretient la réentrée. Les traiter réduit les récidives : l’ESC 2024 recommande une perte de poids d’au moins 10 % chez le patient en surpoids et une consommation d’alcool limitée à 3 verres standard par semaine (classe I).</p>
<div class="lab">A — Éviter l’AVC et la thrombo-embolie</div><p>Score CHA₂DS₂-VA ; AOD de préférence, car ils protègent au moins aussi bien que la warfarine et réduisent de moitié les hémorragies intracrâniennes ; correction des facteurs de risque hémorragique (hypertension, alcool, anti-inflammatoires non stéroïdiens ou antiplaquettaires associés, INR instable) plutôt que renoncement à l’anticoagulation, car l’ESC 2024 déconseille d’utiliser un score hémorragique pour la refuser (classe III) ; dose correcte, car une réduction de dose injustifiée augmente le risque d’AVC sans diminuer les saignements.</p>
<div class="lab">R — Réduire les symptômes par le contrôle de la fréquence et du rythme</div><p>Contrôle de la fréquence chez presque tous, car même chez un patient que l’on veut garder en rythme sinusal, une récidive rapide reste possible et doit être freinée ; contrôle du rythme pour les symptômes, et précocement chez des patients sélectionnés. Dans l’essai EAST-AFNET 4, un contrôle du rythme commencé dans l’année du diagnostic chez des patients à risque cardiovasculaire a réduit les décès cardiovasculaires, les AVC et les hospitalisations pour insuffisance cardiaque ou syndrome coronarien aigu (ESC 2024, classe IIa). L’hypothèse est qu’une intervention précoce précède le remodelage qui fixe le substrat.</p>
<div class="lab">E — Évaluation et réévaluation dynamique</div><p>Bilan initial complet, puis réévaluation périodique : la FA, le terrain et les priorités changent. La FA tend à passer de la forme paroxystique à la forme persistante à mesure que le remodelage progresse ; le score CHA₂DS₂-VA augmente avec l’âge et les nouvelles comorbidités ; la fonction rénale baisse et modifie la dose des AOD ; la FEVG peut s’altérer ou se normaliser. Chaque réévaluation reprend donc le score, la clairance de la créatinine, l’hémoglobine, les symptômes et l’ECG.</p>
<div class="lab">Esprit</div><p>Décision partagée avec le patient, soins centrés sur la personne, équipe pluridisciplinaire. Il succède au parcours en trois points de l’ESC 2020 (anticoagulation, meilleur contrôle des symptômes, comorbidités).</p></template>

<template data-pop="i48-s-fatig" data-title="Fatigue et baisse de la tolérance à l’effort">
<div class="lab">Technique</div><p>Faire préciser le début (concomitant de l’arythmie ou non), le seuil d’effort, le retentissement quotidien (score EHRA) et l’évolution sous traitement. Chercher une dyspnée, des œdèmes, une somnolence diurne.</p>
<div class="lab">Mécanismes</div><p>Perte de la systole auriculaire, fréquence trop rapide à l’effort ou trop lente sous freinateur, <button class="w" data-k="i48-kick">irrégularité du remplissage</button>, insuffisance cardiaque associée.</p>
<div class="lab">Valeur</div><p>Symptôme plus fréquent que les palpitations selon l’ESC 2024, et souvent le seul chez le sujet âgé. Chez lui, le nœud conduit souvent moins vite, si bien que la FA est moins rapide et moins ressentie, et le ventricule plus rigide dépend davantage de la systole auriculaire : la première conséquence perçue est la baisse du débit. Une amélioration nette après cardioversion confirme a posteriori le lien avec l’arythmie et plaide pour un contrôle du rythme.</p>
<div class="lab">Piège</div><p>Attribuer à la FA une fatigue due au bêtabloquant (incompétence chronotrope : le cœur n’accélère plus assez à l’effort, et le débit ne suit pas la demande), à une anémie (le transport d’oxygène baisse et la fréquence s’accélère), une hypothyroïdie (l’iode de l’amiodarone peut freiner la synthèse des hormones thyroïdiennes), des apnées du sommeil (sommeil fragmenté par des micro-éveils) ou une dépression. Vérifier la fréquence à l’effort (Holter, test d’effort) avant d’augmenter les freinateurs.</p></template>

<template data-pop="i48-s-thorax" data-title="Gêne thoracique pendant une FA">
<div class="lab">Technique</div><p>Caractériser : oppressive, liée à la fréquence, cédant au ralentissement ; irradiation ; sueurs ; antécédents coronaires. ECG répété après contrôle de la fréquence.</p>
<div class="lab">Mécanisme</div><p>La tachycardie augmente la consommation d’oxygène et raccourcit la diastole, pendant laquelle le ventricule gauche est perfusé : ischémie fonctionnelle, surtout sur coronaropathie ou hypertrophie.</p>
<div class="lab">Valeur</div><p>Une douleur persistante après ralentissement, ou un sus-décalage du segment ST, impose de rechercher un syndrome coronarien aigu.</p>
<div class="lab">Piège</div><p>Un sous-décalage du segment ST et une élévation modeste et stable de la troponine sont fréquents en FA rapide : le sous-endocarde, le plus éloigné des artères épicardiques et le plus comprimé en systole, souffre le premier. Une élévation stable traduit une lésion myocardique par déséquilibre entre apport et besoin, et non une rupture de plaque ; on ne parle d’infarctus de type 2 que si la troponine varie et que des signes d’ischémie s’y ajoutent. Seule une cinétique de la troponine et l’évolution clinique distinguent cette ischémie fonctionnelle de l’infarctus de type 1 : le médecin ralentit la fréquence, puis répète l’ECG et la troponine.</p></template>

<template data-pop="i48-s-vertige" data-title="Vertiges et lipothymie en FA">
<div class="lab">Technique</div><p>Préciser le moment : au début d’un accès (chute du débit), à sa fin (pause), à l’orthostatisme (hypotension médicamenteuse) ou à l’effort.</p>
<div class="lab">Mécanismes</div><p>Baisse du débit par tachycardie ; <button class="w" data-k="i48-brady-tachy">pause sinusale à l’arrêt de l’accès</button> (syndrome bradycardie-tachycardie) ; bradycardie sous freinateurs ; hypotension orthostatique.</p>
<div class="lab">Valeur</div><p>Une lipothymie à l’arrêt des accès oriente vers une dysfonction sinusale ; la documenter par Holter ou moniteur implantable avant d’augmenter les freinateurs. Dans ce syndrome, le freinateur agit dans les deux sens : il ralentit les accès rapides, mais allonge les pauses et peut transformer une lipothymie en syncope. Une pause symptomatique documentée conduit à un stimulateur, qui permet ensuite de garder les freinateurs ; l’ablation de la FA, qui supprime les accès, supprime souvent aussi les pauses qui les suivent.</p>
<div class="lab">Piège</div><p>Un vertige rotatoire ou des signes neurologiques focaux évoquent un accident ischémique vertébrobasilaire, et non une cause hémodynamique. Une baisse du débit réduit la perfusion de tout le cerveau et donne une sensation de tête vide ou de voile noir, sans rotation ; un vertige rotatoire traduit au contraire une atteinte localisée des voies vestibulaires du tronc cérébral ou du cervelet. La FA expose justement aux emboles dans ce territoire : le patient relève d’une IRM cérébrale et d’un avis neurovasculaire en urgence.</p></template>

<template data-pop="i48-s-polyurie" data-title="Polyurie pendant l’accès">
<div class="lab">Technique</div><p>Demander si le patient urine abondamment pendant ou juste après ses palpitations.</p>
<div class="lab">Mécanisme</div><p>L’étirement et la fréquence élevée des oreillettes libèrent le peptide natriurétique auriculaire, qui augmente la natriurèse et la diurèse ; la sécrétion d’hormone antidiurétique diminue.</p>
<div class="lab">Valeur</div><p>Symptôme évocateur d’une tachycardie supraventriculaire paroxystique, en particulier des réentrées régulières, mais aussi présent dans la FA. Il est plus marqué dans la réentrée intranodale, car oreillettes et ventricules s’y contractent presque en même temps : les oreillettes se vident contre des valves fermées, et leur paroi s’étire davantage. Il aide à reconstituer la durée d’un accès.</p>
<div class="lab">Piège</div><p>Une polyurie permanente oriente vers un diabète, une hypercalcémie ou un diabète insipide, et non vers l’arythmie, car elle persiste en dehors des accès. Le diabète sucré, cause la plus fréquente, est aussi un facteur de risque de FA : la glycémie fait partie du bilan initial.</p></template>

<template data-pop="i48-e-bas-debit" data-title="Signes de bas débit">
<div class="lab">Technique</div><p>Palper les extrémités (froides, moites) ; chercher des marbrures sur les genoux ; mesurer le temps de recoloration cutanée (normal &lt; 3 secondes) ; évaluer la vigilance et la diurèse ; doser le lactate. Quand le débit baisse, le système sympathique contracte d’abord les vaisseaux de la peau et des reins pour préserver le cerveau et le cœur : la peau se recolore lentement et la diurèse diminue. Quand l’apport d’oxygène ne couvre plus les besoins, les cellules passent au métabolisme anaérobie et le lactate s’élève.</p>
<div class="lab">Valeur</div><p>Marbrures, confusion, oligurie et lactate élevé signent une hypoperfusion d’organes : la FA est instable et relève d’une cardioversion électrique immédiate si l’arythmie en est la cause. Le choc dépolarise d’un coup tout le myocarde auriculaire et interrompt les réentrées en un instant, alors que les antiarythmiques agissent en minutes ou en heures et que beaucoup d’entre eux abaissent la pression. Il est synchronisé sur l’onde R pour ne pas tomber dans la période vulnérable de l’onde T.</p>
<div class="lab">Piège</div><p>La pression artérielle peut rester normale grâce à la vasoconstriction malgré une hypoperfusion. Une FA rapide peut aussi apparaître pendant un choc septique ou hypovolémique : il faut traiter immédiatement la cause et apprécier le retentissement propre de l’arythmie. Si la FA provoque ou aggrave l’instabilité, une cardioversion électrique urgente reste indiquée en parallèle. Le sepsis, la stimulation adrénergique et les troubles électrolytiques favorisent les récidives précoces après le choc électrique. Une tachycardie peut compenser en partie la baisse du volume d’éjection ; le ralentissement doit tenir compte de la perfusion, car une réponse ventriculaire trop rapide ou irrégulière peut aussi diminuer le débit. Après traitement de la cause, un retour spontané en rythme sinusal dans les 48 heures a été rapporté chez jusqu’à 83 % des patients.</p>
<div class="lab">Pourquoi en premier</div><p>Ces trois signes renseignent en quelques secondes sur des organes dont la défaillance impose d’agir sans attendre. <b>La conscience reflète la perfusion cérébrale.</b> L’autorégulation maintient le débit cérébral tant que la pression artérielle moyenne reste entre 60 et 140 mmHg environ ; en dessous, le débit baisse avec la pression et la vigilance s’altère. <b>La perfusion cutanée reflète la vasoconstriction de défense.</b> Quand le débit cardiaque baisse, le baroréflexe active le sympathique, qui contracte les artérioles de la peau, de l’intestin et du rein ; le sang est redistribué vers le cerveau et le cœur. <b>La dyspnée de repos reflète la congestion pulmonaire.</b> En FA rapide, la diastole raccourcit et la contraction auriculaire disparaît : la pression de l’oreillette gauche monte et se transmet aux capillaires pulmonaires. L’œdème alvéolaire apparaît quand leur pression dépasse la pression oncotique du plasma, environ 28 mmHg (Guyton &amp; Hall). Ensemble, ces signes définissent l’instabilité hémodynamique au lit du patient ; ils recoupent les signes de gravité d’une tachyarythmie retenus par le Conseil européen de réanimation : choc, syncope, ischémie myocardique, insuffisance cardiaque sévère (Soar 2021).</p>
<div class="lab">Cause ou conséquence</div><p>Quand la FA cause l’instabilité, la cardioversion électrique immédiate est recommandée (ESC 2024, tableau de recommandations 15, classe I, niveau C) ; l’amiodarone n’est qu’une option de deuxième ligne, car son action est retardée (section 9.1). Quand la FA accompagne un sepsis, une hypovolémie ou un trouble électrolytique, le rythme sinusal revient spontanément chez jusqu’à 83 % des patients dans les 48 heures qui suivent le traitement de la cause (section 9.1). Un indice oriente : une fièvre, une perte de liquide ou une FA ancienne jusque-là bien tolérée font chercher une cause extracardiaque. Cet indice n’est pas un critère validé : en cas de doute chez un patient en choc, la cause et l’arythmie se traitent en parallèle.</p>
<div class="lab">Source complémentaire</div><p>Van Gelder et al., ESC 2024 sur la FA, Eur Heart J 2024;45:3314-414, section 9.1 et tableau de recommandations 15. Hall et al., Guyton and Hall Textbook of Medical Physiology, 14e éd., chapitres 18, 39 et 62. Soar et al., European Resuscitation Council Guidelines 2021 : Adult advanced life support, Resuscitation 2021;161:115-51.</p>
</template>

<template data-pop="i48-e-rm" data-title="Auscultation du rétrécissement mitral">
<div class="lab">Technique</div><p>Patient en décubitus latéral gauche, stéthoscope en cloche à la pointe, après un effort léger qui accentue le souffle ; ausculter en apnée expiratoire. Le décubitus latéral gauche et l’expiration rapprochent l’apex de la paroi. La cloche, appliquée légèrement, transmet les sons graves du roulement, que la membrane atténue. L’effort accélère le débit à travers l’orifice rétréci, ce qui augmente le gradient et l’intensité du roulement.</p>
<div class="lab">Signes</div><p><b>Éclat de B1</b> (valve encore souple) : la pression élevée de l’oreillette gauche garde les feuillets ouverts jusqu’à la fin de la diastole, et la systole les ferme de loin et avec force ; <b>claquement d’ouverture</b> mitrale, bref et sec, juste après B2 : les commissures soudées font de la valve un dôme qui se tend brusquement à l’ouverture ; <b>roulement diastolique</b> grave, décroissant : le sang franchit à grande vitesse un orifice étroit, et le bruit décroît avec le gradient. Une valve calcifiée perd l’éclat de B1 et le claquement. En rythme sinusal, un renforcement présystolique s’y ajoute ; il disparaît en FA, faute de contraction auriculaire.</p>
<div class="lab">Valeur</div><p>Plus l’intervalle entre B2 et le claquement d’ouverture est court, plus le rétrécissement est serré. Après B2, la pression ventriculaire gauche chute ; la valve s’ouvre quand elle passe sous la pression de l’oreillette gauche. Plus le rétrécissement est serré, plus cette pression auriculaire est haute, et plus l’ouverture survient tôt. En FA, l’intervalle varie avec le cycle précédent : c’est l’échocardiographie qui mesure la surface. Un rétrécissement mitral modéré à sévère impose un antivitamine K et contre-indique les AOD. L’oreillette gauche, dilatée et sous pression, y est le siège d’une stase permanente, et ces patients avaient été exclus des essais des AOD. Dans l’essai INVICTUS (4 531 patients avec cardiopathie rhumatismale et FA), l’antivitamine K a réduit les événements cardiovasculaires et les décès par rapport au rivaroxaban, sans plus de saignements.</p>
<div class="lab">Piège</div><p>En FA rapide, le roulement est bref et peu audible : réausculter après ralentissement. La tachycardie raccourcit surtout la diastole : le roulement dure moins longtemps, et l’oreillette a moins de temps pour se vider à travers l’orifice étroit. Le gradient et la pression de l’oreillette gauche montent alors, ce qui explique l’œdème pulmonaire fréquent quand une FA rapide survient sur un rétrécissement mitral ; le ralentissement améliore à la fois l’auscultation et l’hémodynamique. L’échocardiographie tranche.</p></template>

<template data-pop="i48-e-souffle" data-title="Souffle systolique chez un patient en FA">
<div class="lab">Technique</div><p>Localiser le foyer maximal, l’irradiation (aisselle ou carotides), la forme (holosystolique ou éjectionnel) et l’intensité (1 à 6 sur 6) ; noter la variation avec la durée du cycle précédent.</p>
<div class="lab">Valeur</div><p>Souffle holosystolique apexien irradiant vers l’aisselle : insuffisance mitrale, cause ou conséquence de la dilatation de l’oreillette. Cause : le volume régurgité à chaque systole surcharge l’oreillette gauche, qui se dilate et se fibrose. Conséquence : une FA prolongée dilate l’oreillette et l’anneau mitral, et des feuillets normaux ne se rejoignent plus ; c’est l’insuffisance mitrale fonctionnelle d’origine auriculaire, que le retour en rythme sinusal peut réduire. Souffle éjectionnel au foyer aortique irradiant aux carotides : rétrécissement aortique, qui tolère mal la <button class="w" data-k="i48-kick">perte de la systole auriculaire</button>.</p>
<div class="lab">Piège</div><p>En FA, le souffle du rétrécissement aortique <button class="w" data-k="i48-cycle-variable">augmente après un cycle long</button>, alors que celui de l’insuffisance mitrale varie peu : cette différence aide à les distinguer. L’échocardiographie reste indispensable.</p></template>

<template data-pop="i48-e-frott" data-title="Frottement péricardique">
<div class="lab">Technique</div><p>Patient assis penché en avant, en expiration, stéthoscope à membrane au bord gauche du sternum ; bruit superficiel, rugueux, à deux ou trois temps, variable d’un examen à l’autre. La position et l’expiration rapprochent le cœur de la paroi, et la membrane capte les sons aigus du frottement. Les trois temps correspondent aux trois mouvements rapides du cœur contre le péricarde : systole auriculaire, systole ventriculaire et remplissage rapide du début de la diastole. En FA, la composante auriculaire disparaît, et le frottement n’a plus que deux temps.</p>
<div class="lab">Valeur</div><p>Signe spécifique de péricardite, cause de FA, notamment après chirurgie cardiaque. Les oreillettes, à paroi mince, sont au contact direct du péricarde : l’inflammation gagne le myocarde sous-épicardique, rend la conduction hétérogène et favorise la réentrée. Après chirurgie cardiaque s’y ajoutent la décharge adrénergique et les variations de volume ; la FA postopératoire y touche 30 à 50 % des patients.</p>
<div class="lab">Piège</div><p>Sa disparition ne signifie pas guérison : un épanchement abondant peut l’abolir, car le liquide sépare les deux feuillets enflammés, qui ne frottent plus l’un contre l’autre. Chercher une tamponnade (turgescence jugulaire, pouls paradoxal) et faire une échocardiographie. L’épanchement sous tension fixe le volume total du cœur : à l’inspiration, le ventricule droit se remplit davantage, le septum bombe vers la gauche, et la pression systolique baisse de plus de 10 mmHg. En FA, la pression varie déjà d’un battement à l’autre ; le pouls paradoxal y est difficile à apprécier, et l’échocardiographie tranche.</p></template>
<template data-pop="i48-brady-tachy" data-title="Pause à l’arrêt d’un accès : syndrome bradycardie-tachycardie">
<div class="lab">Physiologie normale</div><p>Les cellules du nœud sinusal se dépolarisent spontanément pendant la diastole, grâce au courant pacemaker, et imposent leur rythme au cœur. Un foyer plus rapide qui les stimule les supprime temporairement : c’est la suppression par surcharge (« overdrive suppression »). Un nœud sain repart vite après l’arrêt de la stimulation. À l’étude électrophysiologique, le temps de récupération sinusale après stimulation rapide reste normalement inférieur à environ 1,5 seconde.</p>
<div class="lab">Mécanisme</div><p>Pendant un accès de FA, les influx auriculaires dépolarisent sans cesse les cellules sinusales. Le sodium entré à chaque dépolarisation stimule la pompe sodium-potassium, qui expulse trois ions sodium pour deux ions potassium et hyperpolarise la cellule. À l’arrêt de l’accès, la cellule part d’un potentiel plus négatif et met plus de temps à atteindre son seuil. Ce mécanisme a surtout été démontré sur les fibres de Purkinje ; dans le nœud sinusal, il s’associe à d’autres facteurs encore discutés. Chez l’animal, des accès répétés réduisent en outre l’expression des canaux du courant pacemaker dans le nœud sinusal. Un nœud déjà malade, par fibrose liée à l’âge ou par atteinte de l’oreillette, met alors plusieurs secondes à repartir. Le même tissu auriculaire malade favorise la FA et la dysfonction sinusale : le syndrome bradycardie-tachycardie est une forme de maladie du nœud sinusal.</p>
<div class="lab">Conséquence clinique</div><p>À la fin de l’accès, l’ECG montre une pause avant la première onde P sinusale. Si elle dure plusieurs secondes, le cerveau manque de débit : le patient décrit une lipothymie ou une syncope à la fin de ses palpitations. Les freinateurs dépriment aussi le nœud sinusal et allongent cette pause. Ralentir l’accès aggrave donc le risque de syncope à son arrêt.</p>
<div class="lab">Ce qui change la décision</div><p>Le médecin documente la pause par Holter ou moniteur implantable avant d’augmenter les freinateurs. Une pause symptomatique justifie un stimulateur, qui protège de la bradycardie et permet ensuite de poursuivre les freinateurs. L’ablation de la FA est l’alternative, car elle supprime les accès et les pauses qui les suivent : après ablation, la fonction sinusale s’est améliorée chez des patients qui avaient des pauses d’au moins 3 secondes. L’ESC 2024 propose de l’envisager pour soulager les symptômes et éviter le stimulateur (tableau de recommandations 19, classe IIa, niveau C). Une pause sans lien avec les accès relève du stimulateur, car l’ablation ne la corrigera pas.</p>
<div class="lab">Source</div><p>Guyton &amp; Hall, Textbook of Medical Physiology, 14e éd., chap. 10 ; Vassalle, Circ Res 1970;27:361-77 ; Yeh et al., Circulation 2009;119:1576-85 ; Hocini et al., Circulation 2003;108:1172-5 ; Glikson et al., ESC 2021 sur la stimulation, Eur Heart J 2021;42:3427-520 ; Braunwald’s Heart Disease, 12e éd., chapitre bradyarythmies ; ESC 2024 (Van Gelder et al., Eur Heart J 2024;45:3314-414), tableau de recommandations 19.</p></template>
<template data-pop="i48-cognition" data-title="FA, cerveau et déclin cognitif">
<div class="lab">Physiologie normale</div><p>Le cerveau reçoit environ 15 % du débit cardiaque de repos et ne dispose presque d’aucune réserve d’oxygène ni de glucose. L’autorégulation maintient son débit stable malgré les variations soutenues de la pression artérielle moyenne. En rythme sinusal, l’auricule gauche se vide à chaque battement, et des intervalles RR réguliers donnent des volumes d’éjection voisins.</p>
