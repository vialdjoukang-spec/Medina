<div class="lab">Mécanisme</div><p><b>Infarctus silencieux : mécanisme établi.</b> Un thrombus formé dans l’auricule peut se fragmenter. Un petit embole qui obstrue une branche corticale ou une artère perforante détruit un territoire sans déficit focal perceptible : l’infarctus n’est vu qu’à l’IRM. Ces infarctus s’additionnent, et le déficit cognitif apparaît quand la perte dépasse ce que le réseau peut compenser. La cohorte Swiss-AF a soumis 1 737 patients en FA, âgés de 73 ans en moyenne et anticoagulés à 90 %, à une IRM cérébrale et à un test cognitif. Parmi les 1 390 patients sans antécédent d’AVC ni d’accident ischémique transitoire, 15 % avaient un grand infarctus silencieux et 18 % un petit. Le score cognitif était plus bas en présence d’un grand infarctus, même silencieux (24,9 contre 25,8 points), et le volume de ces infarctus était le facteur le plus fortement associé à un score abaissé. L’étude, transversale, ne permet pas de dater ces lésions (Conen et coll., 2019).</p>
<p><b>Mécanismes débattus.</b> Chaque intervalle RR a une durée différente : le volume d’éjection varie d’un battement à l’autre, et l’autorégulation ne corrige pas chaque variation isolée. Un modèle informatique a simulé en FA des épisodes répétés d’hypoperfusion cérébrale, qui n’ont pas été démontrés chez le patient (Anselmino et coll., 2016). L’âge, l’hypertension artérielle et le diabète favorisent à la fois la FA et la maladie des petits vaisseaux cérébraux, visible sous forme de lésions de la substance blanche et de microsaignements. Une partie de l’association peut donc refléter cette cause commune. Le rôle d’une inflammation systémique reste hypothétique.</p>
<div class="lab">Conséquence clinique</div><p>La FA s’associe à un risque accru de troubles cognitifs (rapport de risques ajusté 1,39) et de démence (rapport de cotes 1,6). Après ajustement sur l’AVC, les comorbidités et l’anticoagulation, elle reste associée à la démence vasculaire (rapport de risques 1,68), mais non à la maladie d’Alzheimer (ESC 2024, section 3.5). Cette spécificité oriente vers une atteinte vasculaire plutôt que vers une neurodégénérescence. Le déclin peut s’installer sans AVC connu, et il compromet en retour la prise régulière de l’anticoagulant.</p>
<div class="lab">Ce qui change la décision</div><p>Chez des patients sélectionnés, l’ESC 2024 prévoit une imagerie cérébrale et une évaluation cognitive pour rechercher une maladie cérébrovasculaire et estimer le risque de démence (tableau 8). La cognition conditionne l’observance, et les troubles cognitifs figurent parmi les facteurs de risque hémorragique non modifiables (figure 10). La réponse n’est pas l’arrêt de l’anticoagulant, mais un suivi plus fréquent, une équipe pluridisciplinaire et une prise organisée avec un proche, un semainier ou des soins à domicile. L’anticoagulation se décide selon le score CHA₂DS₂-VA, et l’hypertension artérielle est traitée (tableau de recommandations 5, classe I, niveau B). La prévention de la démence par l’anticoagulation repose seulement sur des données observationnelles ; aucun essai randomisé ne l’a démontrée.</p>
<div class="lab">Source</div><p>ESC 2024 sur la FA (Van Gelder et coll., <i>Eur Heart J</i> 2024;45:3314-414) : section 3.5, tableau 8, figure 10, tableau de recommandations 5. Conen et coll., <i>J Am Coll Cardiol</i> 2019;73:989-99. Anselmino et coll., <i>Sci Rep</i> 2016;6:28635. Hall et al., <i>Guyton and Hall Textbook of Medical Physiology</i>, 14<sup>e</sup> éd., chapitre sur la circulation cérébrale.</p>
</template>
<template data-pop="i48-cycle-variable" data-title="Durée du cycle précédent et force du battement en FA">
<div class="lab">Physiologie normale</div><p>En rythme sinusal, les cycles ont presque tous la même durée. Le ventricule se remplit surtout pendant le premier tiers de la diastole, puis lentement, et la contraction auriculaire complète le remplissage. Chaque ventricule reçoit donc un volume semblable à chaque cycle. Selon la loi de Frank-Starling, il éjecte ce qu’il a reçu : plus il est rempli, plus ses sarcomères sont étirés et plus la contraction suivante est forte. La pression systolique et la force du pouls restent ainsi stables d’un battement à l’autre.</p>
<div class="lab">Mécanisme</div><p>En FA, chaque diastole a une durée différente, et la contraction auriculaire a disparu. Le volume de fin de diastole dépend donc presque entièrement de la durée du cycle précédent. <b>Après un cycle long</b>, le ventricule a achevé son remplissage rapide et éjecte un volume plus grand. La pression aortique a eu le temps de baisser : la valve aortique s’ouvre plus tôt, contre une post-charge plus faible. La contractilité varie aussi avec l’intervalle : une pause laisse le réticulum sarcoplasmique récupérer sa capacité de libérer le calcium, comme lors de la potentialisation post-extrasystolique. La part de cet effet, par rapport à la loi de Frank-Starling, reste discutée en FA ; la contractilité semble dépendre aussi de plusieurs cycles antérieurs. <b>Après un cycle court</b>, la diastole s’interrompt pendant le remplissage rapide, et la pression aortique est encore haute. Le volume éjecté baisse nettement ; la pression ventriculaire peut même ne pas atteindre la pression aortique, et la valve aortique reste fermée. L’effet est asymétrique : allonger une diastole ajoute peu de volume, la raccourcir en retire beaucoup.</p>
<div class="lab">Conséquence clinique</div><p>Le patient perçoit surtout le battement fort qui suit une pause, car ce battement éjecte le plus grand volume contre la pression aortique la plus basse. Les battements qui suivent un cycle court ne produisent parfois aucune onde radiale : c’est le déficit de pouls. La pression systolique est plus haute après un cycle long et plus basse après un cycle court ; une mesure isolée ne représente donc pas la pression moyenne. L’intensité du premier bruit varie aussi, pour une autre raison : la position des feuillets mitraux en début de systole. Le souffle du rétrécissement aortique augmente après un cycle long. L’orifice étant fixe, la vitesse du sang croît avec le débit, et le gradient transvalvulaire croît avec le carré de cette vitesse. Dans l’insuffisance mitrale, le surplus de volume part surtout vers l’aorte, dont la pression a baissé. Le gradient entre ventricule et oreillette gauches varie peu : le souffle change peu.</p>
<div class="lab">Ce qui change la décision</div><p>Le pouls radial ignore les battements inefficaces et sous-estime la fréquence ventriculaire. Le médecin compte donc la fréquence à l’apex ou sur l’ECG, car c’est elle qui guide le contrôle de la fréquence. Il répète les mesures de pression et en fait la moyenne avant de décider. À l’auscultation, il utilise les cycles longs que la FA offre spontanément. Un souffle systolique nettement renforcé après une pause évoque un souffle d’éjection, comme celui du rétrécissement aortique ; un souffle presque inchangé évoque une régurgitation mitrale. L’échocardiographie reste nécessaire pour confirmer et quantifier la valvulopathie.</p>
<div class="lab">Source</div><p>Guyton &amp; Hall, Textbook of Medical Physiology, 14e éd., chap. 9 (cycle cardiaque, phases du remplissage ventriculaire, loi de Frank-Starling). Braunwald’s Heart Disease, 12e éd., chapitre sur l’examen physique cardiovasculaire (auscultation dynamique, variation des souffles après une pause, potentialisation post-extrasystolique) et chapitres sur l’échocardiographie et le rétrécissement aortique (relation entre gradient et vitesse, équation de Bernoulli simplifiée). L’ESC 2024 ne traite pas ces mécanismes.</p>
</template>
