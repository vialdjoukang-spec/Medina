
<!-- ===== FENÊTRES I48 : clinique et diagnostic ===== -->
<template data-pop="i48-s-avc" data-title="Antécédent d’AVC, d’accident ischémique transitoire ou d’embolie">
<div class="lab">Comment le rechercher</div><p>« Avez-vous déjà eu une paralysie, un trouble de la parole ou une perte de vision brutale, même transitoire ? Une artère bouchée dans un membre ? » Demander les comptes rendus et l’imagerie.</p>
<div class="lab">Pourquoi</div><p>C’est le facteur de risque le plus lourd du score : 2 points à lui seul. Un antécédent d’AVC chez un patient en FA justifie l’anticoagulation, quel que soit le reste du score.</p>
<div class="lab">Piège</div><p>Un épisode transitoire banalisé par le patient (« une faiblesse de la main pendant dix minutes ») compte autant qu’un AVC constitué.</p></template>

<template data-pop="i48-atcd-thyr" data-title="Antécédents thyroïdiens et amiodarone">
<div class="lab">À demander</div><p>Hyperthyroïdie connue, nodule, goitre ; substitution par lévothyroxine et sa dose ; traitement par amiodarone actuel ou passé, car l’iode et l’effet de la molécule persistent des mois après l’arrêt ; produits iodés récents (produit de contraste).</p>
<div class="lab">Pourquoi</div><p>L’hyperthyroïdie, même infraclinique, favorise la FA. Une surcharge de lévothyroxine en est une cause iatrogène fréquente chez le sujet âgé.</p></template>

<template data-pop="i48-s-palp" data-title="Palpitations irrégulières">
<div class="lab">Caractériser</div><p>Début brutal ou progressif ; régularité (faire tapoter le rythme par le patient) ; durée ; mode de fin ; facteurs déclenchants (alcool, repas copieux, effort, repos nocturne) ; symptômes associés ; heure exacte du début de l’épisode actuel.</p>
<div class="lab">Physiopathologie</div><p>Le patient perçoit l’irrégularité et la variation de force des contractions, surtout les battements qui suivent une pause.</p>
<div class="lab">Orientation</div><p>Irrégulières : FA, extrasystoles. Régulières, début et fin brutaux : tachycardie par réentrée ou flutter. FA « vagale » : nocturne, post-prandiale, chez le sportif ; FA « adrénergique » : à l’effort ou au stress.</p>
<div class="lab">Importance de l’heure de début</div><p>Elle décide de la possibilité d’une cardioversion précoce (seuil de 24 heures). Une durée incertaine est considérée comme longue.</p></template>

<template data-pop="i48-s-dysp" data-title="Dyspnée et intolérance à l’effort en FA">
<div class="lab">Mécanismes</div><p>Perte de la systole auriculaire ; raccourcissement de la diastole par la tachycardie ; élévation de la pression dans l’oreillette gauche ; fréquence inadaptée à l’effort, trop rapide ou trop lente sous freinateur.</p>
<div class="lab">Caractériser</div><p>Seuil d’effort, orthopnée, œdèmes, prise de poids : ils orientent vers une insuffisance cardiaque associée.</p>
<div class="lab">Piège</div><p>Une dyspnée persistante malgré une fréquence contrôlée doit faire chercher une ICFEp, une valvulopathie ou une cause respiratoire, et non augmenter indéfiniment les freinateurs.</p></template>

<template data-pop="i48-s-synco" data-title="Syncope chez un patient en FA">
<p>La syncope n’est pas un symptôme habituel de la FA : elle signale un mécanisme dangereux.</p>
<div class="lab">Causes à rechercher</div><p><b>Pause à l’arrêt de l’accès</b> (syndrome bradycardie-tachycardie) ; <b>FA pré-excitée</b> très rapide ; <b>bloc auriculoventriculaire</b> ou bradycardie sous freinateurs ; <b>tachycardie ventriculaire</b> sur cardiopathie ; hypotension orthostatique médicamenteuse ; rétrécissement aortique serré.</p>
<div class="lab">Conduite</div><p>ECG, monitorage, échocardiographie ; Holter ou moniteur implantable. Conduite automobile : syncope inexpliquée, 3 mois d’attente pour le conducteur privé ; conducteur professionnel inapte jusqu’au diagnostic et au traitement, 12 mois au minimum si la cause reste inconnue (SSC/SSML 2024).</p></template>

<template data-pop="i48-e-pouls" data-title="Pouls irrégulier et déficit de pouls">
<div class="lab">Technique</div><p>Palper le pouls radial pendant au moins 30 secondes, puis compter simultanément la fréquence à l’auscultation cardiaque (apex) et au poignet, idéalement à deux examinateurs.</p>
<div class="lab">Interprétation</div><p>Un pouls « irrégulièrement irrégulier » évoque une FA. La différence entre fréquence apicale et radiale est le déficit de pouls : les battements survenant après une diastole courte n’ouvrent pas la valve aortique ou n’éjectent pas assez pour être palpés.</p>
<div class="lab">Valeur</div><p>La palpation du pouls est un outil de dépistage opportuniste sensible, mais peu spécifique (extrasystoles). Toute irrégularité impose un ECG.</p></template>

<template data-pop="i48-e-ta" data-title="Mesure de la pression artérielle en FA">
<div class="lab">Problème</div><p>La pression varie d’un battement à l’autre avec la durée du cycle précédent. Les tensiomètres oscillométriques automatiques peuvent afficher des valeurs erronées ou une erreur.</p>
<div class="lab">Technique</div><p>Répéter au moins trois mesures et en faire la moyenne ; méthode auscultatoire manuelle en cas de doute, en dégonflant lentement le brassard.</p>
<div class="lab">Importance</div><p>L’hypertension non contrôlée est à la fois un facteur de risque d’AVC (item H), un facteur de risque hémorragique et un moteur du substrat.</p></template>

<template data-pop="i48-e-b1" data-title="Intensité variable du premier bruit">
<div class="lab">Mécanisme</div><p>L’intensité de B1 dépend de la position des feuillets mitraux au début de la systole. Après une diastole courte, les feuillets sont encore ouverts et se ferment avec force (B1 intense) ; après une diastole longue, ils se sont rapprochés (B1 faible).</p>
<div class="lab">Valeur</div><p>Une variation aléatoire de B1, associée à un rythme irrégulier, oriente vers une FA. Un B1 variable avec un rythme régulier évoque une dissociation auriculoventriculaire.</p>
<div class="lab">Corrélation</div><p>En FA, il n’y a pas de quatrième bruit, car B4 exige une contraction auriculaire.</p></template>

<template data-pop="i48-e-jug" data-title="Pouls jugulaire en FA et en flutter">
<div class="lab">Normal</div><p>L’onde a correspond à la contraction de l’oreillette droite, juste avant le pouls carotidien.</p>
<div class="lab">FA</div><p>Onde a absente ; le pouls veineux ne montre qu’une onde systolique.</p>
<div class="lab">Flutter</div><p>Des oscillations rapides et régulières (ondes de flutter) sont parfois visibles au cou, à une fréquence multiple de celle du pouls.</p>
<div class="lab">Congestion</div><p>Une turgescence jugulaire élevée signe une insuffisance cardiaque associée ou une surcharge droite.</p></template>

<template data-pop="i48-e-thyr" data-title="Signes cliniques d’hyperthyroïdie">
<div class="lab">Signes généraux</div><p>Amaigrissement malgré un appétit conservé, thermophobie, sueurs, tremblement fin des extrémités, nervosité, diarrhée.</p>
<div class="lab">Signes locaux</div><p>Goitre diffus avec souffle (maladie de Basedow), nodule (adénome toxique), exophtalmie et signes oculaires (propres à la maladie de Basedow).</p>
<div class="lab">Piège</div><p>Chez le sujet âgé, l’hyperthyroïdie est souvent « apathique » : la FA, l’amaigrissement et la fatigue peuvent être les seuls signes. La TSH est donc demandée chez tout patient en FA.</p></template>

<template data-pop="i48-ecg-fa" data-title="ECG de la fibrillation auriculaire : lecture pas à pas">
<div class="lab">1. Régularité</div><p>Mesurer plusieurs intervalles RR : ils varient sans aucune périodicité. Attention, à fréquence élevée (&gt; 150/min), l’irrégularité paraît moins évidente : la mesurer au compas ou sur un long tracé.</p>
<div class="lab">2. Activité auriculaire</div><p>Aucune onde P reproductible. Ondes f en V1 et II : fines ou grossières, de morphologie et de cycle variables. Parfois presque invisibles (FA ancienne, oreillette fibrosée).</p>
<div class="lab">3. QRS</div><p>Fins en général. Larges : bloc de branche préexistant, aberrance (phénomène d’Ashman), pré-excitation (morphologies changeantes, fréquence très élevée).</p>
<div class="lab">4. Fréquence ventriculaire</div><p>Compter les QRS sur 10 secondes et multiplier par 6. Lente sans traitement : trouble de conduction nodale, sujet âgé.</p>
<div class="lab">5. Diagnostic</div><p>ECG à 12 dérivations ou tracé d’au moins 30 secondes, relu par un médecin (ESC 2024).</p>
<div class="lab">Erreur fréquente</div><p>Confondre des ondes f grossières avec un flutter : dans la FA, leur cycle et leur morphologie varient ; dans le flutter, elles sont identiques et régulières.</p></template>

<template data-pop="i48-ecg-flutter" data-title="ECG du flutter typique et atypique">
<div class="lab">Flutter typique antihoraire (le plus fréquent)</div><p>Circuit autour de l’anneau tricuspide, montant le long du septum et descendant le long de la paroi latérale. Ondes F en dents de scie, sans ligne isoélectrique, <b>négatives en II, III et aVF</b>, <b>positives en V1</b>. Fréquence auriculaire 250–350/min.</p>
<div class="lab">Flutter typique horaire</div><p>Même circuit, sens inverse : ondes F <b>positives</b> dans les dérivations inférieures, larges et <b>négatives en V1</b>. Également dépendant de l’isthme cavotricuspide.</p>
<div class="lab">Flutter atypique</div><p>Circuit indépendant de l’isthme : autour de cicatrices de chirurgie cardiaque ou d’ablation, autour de l’anneau mitral, sur le toit de l’oreillette gauche. Morphologie des ondes variable, parfois avec une ligne isoélectrique entre elles, ce qui le rapproche d’une tachycardie atriale. Son ablation exige une cartographie électroanatomique.</p>
<div class="lab">Conduction auriculoventriculaire</div><p>2:1 le plus souvent (≈ 150/min) ; 4:1 sous freinateur (≈ 75/min) ; variable (RR irréguliers mais multiples d’un même cycle) ; 1:1 exceptionnel et dangereux (catécholamines, classe Ic, voie accessoire).</p>
<div class="lab">Pièges</div><p>Une onde F cachée dans le QRS ou l’onde T fait croire à une tachycardie sinusale. Retourner le tracé ou regarder V1 et les dérivations inférieures aide ; l’adénosine démasque les ondes F.</p></template>

<template data-pop="i48-adeno" data-title="Adénosine et manœuvres vagales comme outils diagnostiques">
<div class="lab">Principe</div><p>L’adénosine bloque transitoirement, pendant quelques secondes, la conduction du nœud auriculoventriculaire. Les manœuvres vagales (Valsalva modifiée, massage sinocarotidien après exclusion d’un souffle carotidien) ralentissent le nœud de façon plus modeste.</p>
<div class="lab">Lecture</div><p>Pendant le bloc, les ondes F du flutter ou les ondes P d’une tachycardie atriale apparaissent. Une tachycardie par réentrée utilisant le nœud s’arrête.</p>
<div class="lab">Technique</div><p>6 mg en bolus intraveineux rapide suivi d’un rinçage, puis 12 mg si besoin, sous enregistrement ECG continu, défibrillateur à proximité.</p>
<div class="lab">Contre-indications et précautions</div><p>Asthme sévère ; FA pré-excitée ou tachycardie irrégulière à QRS larges ; bloc auriculoventriculaire. Prévenir le patient du malaise bref (bouffée de chaleur, oppression).</p></template>

<template data-pop="i48-preexc" data-title="FA pré-excitée (syndrome de Wolff-Parkinson-White)">
<div class="lab">Mécanisme</div><p>Une voie accessoire auriculoventriculaire (faisceau de Kent) court-circuite le nœud. En FA, elle peut conduire à plus de 250/min, avec un risque de fibrillation ventriculaire et de mort subite.</p>
<div class="lab">ECG</div><p>Tachycardie <b>irrégulière</b> à <b>QRS larges</b>, dont la morphologie varie d’un battement à l’autre (degré variable de pré-excitation) ; intervalles RR les plus courts parfois &lt; 250 ms. En rythme sinusal : PR court et onde delta.</p>
<div class="lab">Contre-indiqués</div><p>Adénosine, bêtabloquants, vérapamil, diltiazem, digoxine ; amiodarone intraveineuse non recommandée (ESC 2019 sur les tachycardies supraventriculaires).</p>
<div class="lab">Conduite</div><p>Instable : cardioversion électrique synchronisée immédiate (classe I). Stable : cardioversion électrique, ou ibutilide ou procaïnamide (classe IIa), ou flécaïnide ou propafénone (classe IIb), selon la disponibilité. En Suisse, l’ibutilide et le procaïnamide ne sont généralement pas disponibles (vérifier compendium.ch) : la cardioversion électrique est en pratique la conduite de choix, même chez le patient stable. Puis <b>ablation de la voie accessoire</b> (classe I), qui guérit la pré-excitation.</p>
<div class="lab">Piège</div><p>Une tachycardie à QRS larges irrégulière n’est pas « une FA avec bloc de branche » tant que la morphologie varie d’un complexe à l’autre et que la fréquence dépasse 200/min.</p></template>

<template data-pop="i48-depist" data-title="Outils de dépistage de la FA">
<div class="lab">Palpation du pouls</div><p>Simple, sensible, peu spécifique ; point de départ du dépistage opportuniste.</p>
<div class="lab">ECG à une dérivation</div><p>Appareils portatifs ou montres permettant un tracé de 30 secondes : diagnostic possible si le tracé est relu par un médecin et montre au moins 30 secondes de FA.</p>
<div class="lab">Photopléthysmographie</div><p>Capteur optique des montres et bagues connectées, qui analyse la régularité du pouls. Elle alerte, mais ne permet pas de poser le diagnostic : un ECG est nécessaire.</p>
<div class="lab">Enregistrements prolongés</div><p>Patchs, Holter de plusieurs jours, enregistrements intermittents répétés : augmentent le rendement du dépistage populationnel.</p>
<div class="lab">Recommandations</div><p>Dépistage opportuniste dès 65 ans ; dépistage populationnel prolongé à envisager dès 75 ans, ou 65 ans avec d’autres facteurs du score (ESC 2024, classe IIa). Toute FA dépistée entre dans le parcours AF-CARE.</p></template>

<template data-pop="i48-ic-flutter" data-title="Flutter 1:1 induit par les antiarythmiques de classe Ic">
<div class="lab">Mécanisme</div><p>La flécaïnide et la propafénone ralentissent la conduction dans l’oreillette. Une FA peut s’organiser en flutter, et ce flutter devient plus lent, par exemple 200/min au lieu de 300/min. Le nœud auriculoventriculaire, qui bloquait une onde sur deux à 300/min, peut alors toutes les conduire.</p>
<div class="lab">ECG</div><p>Tachycardie régulière à 200–250/min à QRS larges, car la classe Ic ralentit aussi la conduction ventriculaire à fréquence élevée. Elle peut être confondue avec une tachycardie ventriculaire.</p>
<div class="lab">Prévention</div><p>Associer systématiquement un bêtabloquant, du vérapamil ou du diltiazem à la classe Ic. Contrôler le QRS à l’effort.</p></template>

<template data-pop="i48-afcare" data-title="Parcours AF-CARE (ESC 2024)">
<div class="lab">C — Comorbidités et facteurs de risque</div><p>Rechercher et traiter chez tous : hypertension, insuffisance cardiaque, diabète, obésité, apnées, alcool, sédentarité. Le « C » est placé en premier parce qu’il agit sur le substrat de la maladie.</p>
<div class="lab">A — Éviter l’AVC et la thrombo-embolie</div><p>Score CHA₂DS₂-VA ; AOD de préférence ; correction des facteurs de risque hémorragique ; dose correcte.</p>
<div class="lab">R — Réduire les symptômes par le contrôle de la fréquence et du rythme</div><p>Contrôle de la fréquence chez presque tous ; contrôle du rythme pour les symptômes, et précocement chez des patients sélectionnés.</p>
<div class="lab">E — Évaluation et réévaluation dynamique</div><p>Bilan initial complet, puis réévaluation périodique : la FA, le terrain et les priorités changent.</p>
<div class="lab">Esprit</div><p>Décision partagée avec le patient, soins centrés sur la personne, équipe pluridisciplinaire. Il succède au parcours en trois points de l’ESC 2020 (anticoagulation, meilleur contrôle des symptômes, comorbidités).</p></template>

<template data-pop="i48-s-fatig" data-title="Fatigue et baisse de la tolérance à l’effort">
<div class="lab">Technique</div><p>Faire préciser le début (concomitant de l’arythmie ou non), le seuil d’effort, le retentissement quotidien (score EHRA) et l’évolution sous traitement. Chercher une dyspnée, des œdèmes, une somnolence diurne.</p>
<div class="lab">Mécanismes</div><p>Perte de la systole auriculaire, fréquence trop rapide à l’effort ou trop lente sous freinateur, irrégularité du remplissage, insuffisance cardiaque associée.</p>
<div class="lab">Valeur</div><p>Symptôme le plus fréquent après les palpitations, souvent le seul chez le sujet âgé. Une amélioration nette après cardioversion confirme a posteriori le lien avec l’arythmie et plaide pour un contrôle du rythme.</p>
<div class="lab">Piège</div><p>Attribuer à la FA une fatigue due au bêtabloquant (incompétence chronotrope), à une anémie, une hypothyroïdie (amiodarone), des apnées du sommeil ou une dépression. Vérifier la fréquence à l’effort (Holter, test d’effort) avant d’augmenter les freinateurs.</p></template>

<template data-pop="i48-s-thorax" data-title="Gêne thoracique pendant une FA">
<div class="lab">Technique</div><p>Caractériser : oppressive, liée à la fréquence, cédant au ralentissement ; irradiation ; sueurs ; antécédents coronaires. ECG répété après contrôle de la fréquence.</p>
<div class="lab">Mécanisme</div><p>La tachycardie augmente la consommation d’oxygène et raccourcit la diastole, pendant laquelle le ventricule gauche est perfusé : ischémie fonctionnelle, surtout sur coronaropathie ou hypertrophie.</p>
<div class="lab">Valeur</div><p>Une douleur persistante après ralentissement, ou un sus-décalage du segment ST, impose de rechercher un syndrome coronarien aigu.</p>
<div class="lab">Piège</div><p>Un sous-décalage du segment ST et une élévation modeste et stable de la troponine sont fréquents en FA rapide ; seule une cinétique de la troponine et l’évolution clinique distinguent l’ischémie fonctionnelle de l’infarctus.</p></template>

<template data-pop="i48-s-vertige" data-title="Vertiges et lipothymie en FA">
<div class="lab">Technique</div><p>Préciser le moment : au début d’un accès (chute du débit), à sa fin (pause), à l’orthostatisme (hypotension médicamenteuse) ou à l’effort.</p>
<div class="lab">Mécanismes</div><p>Baisse du débit par tachycardie ; pause sinusale à l’arrêt de l’accès (syndrome bradycardie-tachycardie) ; bradycardie sous freinateurs ; hypotension orthostatique.</p>
<div class="lab">Valeur</div><p>Une lipothymie à l’arrêt des accès oriente vers une dysfonction sinusale ; la documenter par Holter ou moniteur implantable avant d’augmenter les freinateurs.</p>
<div class="lab">Piège</div><p>Un vertige rotatoire ou des signes neurologiques focaux évoquent un accident ischémique vertébrobasilaire, et non une cause hémodynamique.</p></template>

<template data-pop="i48-s-polyurie" data-title="Polyurie pendant l’accès">
<div class="lab">Technique</div><p>Demander si le patient urine abondamment pendant ou juste après ses palpitations.</p>
<div class="lab">Mécanisme</div><p>L’étirement et la fréquence élevée des oreillettes libèrent le peptide natriurétique auriculaire, qui augmente la natriurèse et la diurèse ; la sécrétion d’hormone antidiurétique diminue.</p>
<div class="lab">Valeur</div><p>Symptôme évocateur d’une tachycardie supraventriculaire paroxystique, en particulier des réentrées régulières, mais aussi présent dans la FA. Il aide à reconstituer la durée d’un accès.</p>
<div class="lab">Piège</div><p>Une polyurie permanente oriente vers un diabète, une hypercalcémie ou un diabète insipide, et non vers l’arythmie.</p></template>

<template data-pop="i48-e-bas-debit" data-title="Signes de bas débit">
<div class="lab">Technique</div><p>Palper les extrémités (froides, moites) ; chercher des marbrures sur les genoux ; mesurer le temps de recoloration cutanée (normal &lt; 3 secondes) ; évaluer la vigilance et la diurèse ; doser le lactate.</p>
<div class="lab">Valeur</div><p>Marbrures, confusion, oligurie et lactate élevé signent une hypoperfusion d’organes : la FA est instable et relève d’une cardioversion électrique immédiate si l’arythmie en est la cause.</p>
<div class="lab">Piège</div><p>La pression artérielle peut rester normale grâce à la vasoconstriction malgré une hypoperfusion. À l’inverse, une FA rapide peut être la conséquence d’un choc septique ou hypovolémique : la cardioversion n’y corrige rien, il faut traiter la cause.</p></template>

<template data-pop="i48-e-rm" data-title="Auscultation du rétrécissement mitral">
<div class="lab">Technique</div><p>Patient en décubitus latéral gauche, stéthoscope en cloche à la pointe, après un effort léger qui accentue le souffle ; ausculter en apnée expiratoire.</p>
<div class="lab">Signes</div><p><b>Éclat de B1</b> (valve encore souple) ; <b>claquement d’ouverture</b> mitrale, bref et sec, juste après B2 ; <b>roulement diastolique</b> grave, décroissant. En rythme sinusal, un renforcement présystolique s’y ajoute ; il disparaît en FA, faute de contraction auriculaire.</p>
<div class="lab">Valeur</div><p>Plus l’intervalle entre B2 et le claquement d’ouverture est court, plus le rétrécissement est serré. Un rétrécissement mitral modéré à sévère impose un antivitamine K et contre-indique les AOD.</p>
<div class="lab">Piège</div><p>En FA rapide, le roulement est bref et peu audible : réausculter après ralentissement. L’échocardiographie tranche.</p></template>

<template data-pop="i48-e-souffle" data-title="Souffle systolique chez un patient en FA">
<div class="lab">Technique</div><p>Localiser le foyer maximal, l’irradiation (aisselle ou carotides), la forme (holosystolique ou éjectionnel) et l’intensité (1 à 6 sur 6) ; noter la variation avec la durée du cycle précédent.</p>
<div class="lab">Valeur</div><p>Souffle holosystolique apexien irradiant vers l’aisselle : insuffisance mitrale, cause ou conséquence de la dilatation de l’oreillette. Souffle éjectionnel au foyer aortique irradiant aux carotides : rétrécissement aortique, qui tolère mal la perte de la systole auriculaire.</p>
<div class="lab">Piège</div><p>En FA, le souffle du rétrécissement aortique augmente après un cycle long, alors que celui de l’insuffisance mitrale varie peu : cette différence aide à les distinguer. L’échocardiographie reste indispensable.</p></template>

<template data-pop="i48-e-frott" data-title="Frottement péricardique">
<div class="lab">Technique</div><p>Patient assis penché en avant, en expiration, stéthoscope à membrane au bord gauche du sternum ; bruit superficiel, rugueux, à deux ou trois temps, variable d’un examen à l’autre.</p>
<div class="lab">Valeur</div><p>Signe spécifique de péricardite, cause de FA, notamment après chirurgie cardiaque.</p>
<div class="lab">Piège</div><p>Sa disparition ne signifie pas guérison : un épanchement abondant peut l’abolir. Chercher une tamponnade (turgescence jugulaire, pouls paradoxal) et faire une échocardiographie.</p></template>
