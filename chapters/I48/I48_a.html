<section class="ilot" id="i48-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 71 ans, hypertendue et diabétique, consulte pour des palpitations irrégulières et un essoufflement apparus il y a deux jours. Son pouls est irrégulier à 128/min, sa pression artérielle à 138/84 mmHg. L’électrocardiogramme montre une tachycardie irrégulière à complexes fins, sans onde P. Quatre questions organisent tout le chapitre : <b>la patiente est-elle stable, quel est son risque d’accident vasculaire cérébral, faut-il ralentir le cœur ou rétablir le rythme sinusal, et quelles maladies associées entretiennent l’arythmie ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître une fibrillation et un flutter auriculaires sur l’électrocardiogramme, en classer la forme, en identifier l’urgence, décider d’une anticoagulation et en choisir la molécule et la dose. Il sait aussi conduire un contrôle de la fréquence ou du rythme, poser les indications de cardioversion et d’ablation, et traiter les facteurs de risque qui font progresser la maladie. Le référentiel est la recommandation de la Société européenne de cardiologie (ESC) de 2024, reprise par la Société suisse de cardiologie. Aucune nouvelle recommandation ESC sur la fibrillation auriculaire n’a paru en août 2026 : celle de 2024 reste en vigueur en septembre 2026.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i48-reentree">réentrée et la longueur d’onde (mécanisme des arythmies entretenues)</button>, la <button class="w" data-k="i48-noeudav">conduction décrémentielle du nœud auriculoventriculaire (filtre de la fréquence ventriculaire)</button> et la <button class="w" data-k="i48-virchow">triade de Virchow appliquée à l’auricule gauche (origine du thrombus)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i48-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La <b>fibrillation auriculaire</b> est une tachyarythmie supraventriculaire caractérisée par une activation électrique désorganisée des oreillettes. Les oreillettes ne se contractent plus de façon efficace. Le nœud auriculoventriculaire reçoit plusieurs centaines d’impulsions par minute et n’en transmet qu’une partie, de façon aléatoire : la réponse ventriculaire est donc <b>irrégulièrement irrégulière</b>.</p>
<p>Le diagnostic exige une documentation électrocardiographique relue par un médecin. Un ECG standard à 12 dérivations, habituellement enregistré sur 10 secondes, peut documenter une FA typique. Pour les enregistrements ambulatoires, l’ESC 2024 précise que la durée minimale dépend du contexte clinique. Le repère de 30 secondes repose sur un consensus et sur des données limitées. Un épisode de cette durée justifie une évaluation, mais ne décide pas seul une anticoagulation. Un pouls irrégulier ou une alerte optique de montre impose une confirmation ECG.</p>
<p>Le <b>flutter auriculaire</b> est une autre arythmie. C’est une <button class="w" data-k="i48-reentree">macroréentrée (circuit unique et stable)</button> qui active les oreillettes de façon organisée, à environ 250 à 350/min. Le flutter typique tourne autour de l’anneau tricuspide et passe par l’<b>isthme cavotricuspide</b>. Les deux arythmies coexistent souvent chez le même patient et partagent la même règle d’anticoagulation.</p>
<h3>1.1 Classification temporelle</h3>
<p>La classification repose sur la durée des épisodes et sur la stratégie choisie. Elle guide le traitement, mais ne prédit qu’imparfaitement le risque thromboembolique, qui dépend du terrain.</p>
<table class="t"><tr><th>Forme</th><th>Définition (ESC 2024)</th><th>Exemple</th></tr>
<tr><td>Diagnostiquée pour la première fois</td><td>Fibrillation auriculaire documentée pour la première fois, quelle que soit sa durée ou ses symptômes</td><td>Découverte d’une FA sur l’ECG préopératoire</td></tr>
<tr><td>Paroxystique</td><td>S’arrête spontanément ou après une intervention en 7 jours au maximum</td><td>Épisodes de quelques heures survenant la nuit après une consommation aiguë d’alcool</td></tr>
<tr><td>Persistante</td><td>Dure plus de 7 jours, y compris lorsqu’elle est interrompue par cardioversion après ce délai</td><td>FA installée depuis trois semaines avant la consultation</td></tr>
<tr><td>Persistante de longue durée</td><td>Dure au moins 12 mois lorsqu’une stratégie de contrôle du rythme est décidée</td><td>FA depuis 18 mois, patient candidat à une ablation</td></tr>
<tr><td>Permanente</td><td>Patient et médecin renoncent à tout nouvel essai de restauration du rythme sinusal</td><td>Homme de 88 ans, peu symptomatique, sous contrôle de fréquence</td></tr></table>
<div class="trap"><span class="k">Piège</span>« Permanente » n’est pas une propriété de l’arythmie, mais une décision thérapeutique partagée. Un patient en FA permanente qui devient très symptomatique peut être reclassé et bénéficier d’un contrôle du rythme. À l’inverse, le mot « paroxystique » ne signifie pas un risque d’AVC plus faible justifiant l’absence d’anticoagulation : la décision dépend du score <button class="w" data-k="i48-cha">CHA₂DS₂-VA (calcul et justification)</button>, et non du type temporel.</div>
<p>L’ESC 2024 insiste sur la notion de <button class="w" data-k="i48-types">trajectoire de la fibrillation auriculaire (progression d’une forme à l’autre)</button> : chez beaucoup de patients, la maladie progresse de la forme paroxystique vers la forme persistante, parce que l’oreillette se remodèle. Traiter tôt les facteurs de risque vise à freiner cette progression.</p>
<h3>1.2 Fibrillation clinique et fibrillation infraclinique détectée par un dispositif</h3>
<p>La <b>fibrillation auriculaire clinique</b> est documentée sur un ECG de surface, qu’elle soit symptomatique ou non. La <button class="w" data-k="i48-infraclin">fibrillation auriculaire infraclinique détectée par un dispositif (épisodes auriculaires rapides)</button> est enregistrée par un stimulateur, un défibrillateur ou un moniteur implantable, chez un patient sans FA clinique connue. Elle doit être vérifiée sur l’électrogramme intracardiaque, car le dispositif peut compter à tort du bruit ou des ondes lointaines. Cette distinction est importante : le bénéfice de l’anticoagulation est bien moindre dans la forme infraclinique.</p>
<h3>1.3 Sévérité des symptômes</h3>
<p>Le <button class="w" data-k="i48-ehra">score EHRA modifié (cinq degrés de retentissement des symptômes)</button> mesure l’impact de l’arythmie sur la vie quotidienne. Il sert à décider d’un contrôle du rythme et à évaluer son efficacité.</p>
</section>

<section class="ilot" id="i48-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La fibrillation auriculaire est l’arythmie soutenue la plus fréquente de l’adulte. L’étude <i>Global Burden of Disease</i> estimait à près de 60 millions le nombre de personnes atteintes dans le monde en 2019. L’ESC 2024 estime le risque de développer une FA au cours de la vie à environ une personne sur trois à cinq après 55 ans, et prévoit une forte augmentation de la prévalence au cours des prochaines décennies, portée par le vieillissement de la population.</p>
<p>En Suisse, l’étude lausannoise <button class="w" data-k="i48-colaus">CoLaus (cohorte populationnelle, ECG unique)</button> a trouvé une prévalence de 0,9 % chez 4 616 adultes de 45 à 86 ans examinés entre 2014 et 2017, et de 3,1 % après 80 ans (4,7 % en ajoutant le flutter). Ces chiffres sous-estiment la réalité : un ECG unique ne capte pas les formes paroxystiques. La cohorte nationale Swiss-AF, qui suit 2 415 patients en FA recrutés dans 14 centres, étudie surtout les conséquences cérébrales de l’arythmie.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Il n’existe pas de registre national suisse de la fibrillation auriculaire, et l’Office fédéral de la statistique ne publie pas de prévalence consolidée. Les données suisses citées proviennent de cohortes régionales ; les projections sont européennes (ESC 2024).</div>
<p>Le pronostic est dominé par quatre complications. Le <b>risque d’AVC ischémique</b> est multiplié par environ cinq ; les AVC liés à la FA sont plus graves et plus souvent mortels que les autres. L’<b>insuffisance cardiaque</b> est à la fois cause et conséquence de l’arythmie. La FA s’associe aussi à un <b>déclin cognitif</b>, en partie par des infarctus cérébraux silencieux, et à une <b>mortalité</b> accrue. L’anticoagulation réduit fortement le risque d’AVC ; elle n’efface pas les autres complications, d’où l’intérêt d’une prise en charge globale.</p>

</section>

<section class="ilot" id="i48-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La fibrillation auriculaire naît de la rencontre de deux éléments : un <b>déclencheur</b>, qui initie l’arythmie, et un <b>substrat</b>, qui lui permet de se maintenir. Le raisonnement suit la chaîne : <b>facteurs de risque → remodelage de l’oreillette → déclencheurs et réentrées → perte de la systole auriculaire et réponse ventriculaire rapide → symptômes, insuffisance cardiaque et thrombose.</b></p>
<h3>3.1 Les déclencheurs : les veines pulmonaires</h3>
<p>En 1998, l’équipe de Michel Haïssaguerre, à Bordeaux, a montré que la plupart des accès de FA paroxystique sont déclenchés par des extrasystoles nées dans les <button class="w" data-k="i48-vp">manchons myocardiques des veines pulmonaires (foyers déclencheurs)</button>. Ces prolongements de muscle auriculaire, orientés de façon hétérogène, ont une période réfractaire courte et une activité automatique propre. Cette découverte fonde l’<b>isolation électrique des veines pulmonaires</b>, geste central de l’ablation.</p>
<h3>3.2 Le substrat : le remodelage auriculaire</h3>
<p>Un foyer ectopique ne suffit pas : il faut une oreillette capable d’entretenir une activité désorganisée. Hypertension, âge, obésité, valvulopathie, insuffisance cardiaque et alcool dilatent l’oreillette et y induisent une fibrose. La fibrose ralentit et fragmente la conduction. Selon la notion de <button class="w" data-k="i48-reentree">longueur d’onde (vitesse de conduction × période réfractaire)</button>, une conduction lente et une période réfractaire courte permettent à de multiples fronts d’onde de coexister dans l’oreillette : c’est l’état fibrillatoire.</p>
<p>La FA modifie elle-même l’oreillette. Après quelques jours d’arythmie, la période réfractaire se raccourcit par surcharge calcique des myocytes ; après des semaines, la fibrose s’installe. Ce <button class="w" data-k="i48-remod">remodelage électrique et structural (« la FA engendre la FA »)</button> explique la progression de la forme paroxystique vers la forme persistante, et la moindre efficacité des traitements tardifs.</p>
<div class="key"><b>Corrélation physiopathologie → thérapeutique.</b> Chaque niveau de la chaîne a sa cible. Les facteurs de risque se traitent par la perte de poids, l’arrêt de l’alcool, le contrôle tensionnel et le traitement des apnées du sommeil : c’est le « C » du parcours AF-CARE. Les déclencheurs relèvent de l’isolation des veines pulmonaires. Le substrat répond aux antiarythmiques, qui allongent la période réfractaire ou ralentissent la conduction. La réponse ventriculaire est ralentie par les freinateurs du nœud auriculoventriculaire. Le risque de thrombose est prévenu par les anticoagulants.</div>
<h3>3.3 Conséquences hémodynamiques</h3>
<p>Deux mécanismes réduisent le débit. D’abord, la <button class="w" data-k="i48-kick">perte de la contraction auriculaire (contribution au remplissage ventriculaire)</button>, qui assure normalement une part du remplissage du ventricule gauche. Cette part est plus importante quand le ventricule est rigide (hypertrophie, sujet âgé, rétrécissement aortique). Ensuite, la tachycardie raccourcit la diastole et l’irrégularité fait varier le volume d’éjection d’un battement à l’autre. Un ventricule qui bat vite pendant des semaines peut se dilater et perdre sa fonction : c’est la <button class="w" data-k="i48-tachycm">cardiomyopathie rythmique (réversible après contrôle de fréquence)</button>.</p>
<h3>3.4 La réponse ventriculaire : rôle du nœud auriculoventriculaire</h3>
<p>Les oreillettes fibrillent à 350–600/min. Le nœud auriculoventriculaire ne transmet pas tout, grâce à sa <button class="w" data-k="i48-noeudav">conduction décrémentielle et à la conduction cachée (irrégularité des RR)</button>. La fréquence ventriculaire dépend donc du tonus sympathique et vagal. Elle augmente à l’effort, avec la fièvre, l’anémie ou l’hyperthyroïdie. En présence d’une <b>voie accessoire</b> (syndrome de Wolff-Parkinson-White), ce filtre est court-circuité : la fréquence ventriculaire peut dépasser 250/min et dégénérer en fibrillation ventriculaire.</p>
<h3>3.5 La thrombose dans l’auricule gauche</h3>
<p>Dans la FA non valvulaire, la grande majorité des thrombi se forment dans l’<b>auricule gauche</b>, un diverticule en cul-de-sac de l’oreillette gauche. Les trois éléments de la <button class="w" data-k="i48-virchow">triade de Virchow (stase, lésion endothéliale, hypercoagulabilité)</button> y sont réunis. Le risque persiste après le retour en rythme sinusal, car l’oreillette « sidérée » reste peu contractile pendant plusieurs semaines. C’est pourquoi l’anticoagulation est poursuivie au moins quatre semaines après une cardioversion.</p>
<h3>3.6 Le flutter typique</h3>
<p>Dans le flutter typique, l’influx tourne autour de l’anneau tricuspide, le plus souvent dans le sens antihoraire vu de l’apex. Il est guidé par des obstacles anatomiques : la crête terminale, la veine cave inférieure et l’anneau tricuspide. Il passe obligatoirement par l’isthme cavotricuspide, zone étroite entre la veine cave inférieure et l’anneau tricuspide. Une ligne d’ablation à travers cet isthme interrompt le circuit : le taux de succès est très élevé. Le nœud auriculoventriculaire conduit souvent un battement sur deux : une oreillette à 300/min donne une fréquence ventriculaire régulière de 150/min.</p>

<section class="ilot" id="i48-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>La FA est rarement « isolée ». Elle est l’expression électrique de maladies cardiaques ou extracardiaques qu’il faut chercher systématiquement, car leur traitement réduit les récidives. L’aide-mémoire <button class="w" data-k="i48-pirates">PIRATES (causes à passer en revue)</button> aide à ne rien oublier.</p>
<div class="two">
<div class="card"><h4>Terrain et facteurs de risque chroniques</h4><p>Âge (premier déterminant) ; hypertension artérielle (le facteur modifiable le plus fréquent) ; obésité ; diabète ; <button class="w" data-k="i48-saos">apnées obstructives du sommeil (dépistage et effet sur la FA)</button> ; consommation d’alcool, même modérée ; sédentarité, mais aussi sport d’endurance intensif pratiqué pendant des années ; tabac ; maladie rénale chronique.</p></div>
<div class="card"><h4>Cardiopathies</h4><p>Insuffisance cardiaque, quelle que soit la FEVG ; valvulopathies, surtout mitrales (le rétrécissement mitral rhumatismal dilate l’oreillette gauche) ; cardiopathie ischémique ; cardiomyopathie hypertrophique ; amylose cardiaque ; cardiopathies congénitales (communication interauriculaire) ; péricardite.</p></div>
<div class="card"><h4>Causes aiguës ou réversibles</h4><p>Chirurgie, cardiaque surtout ; sepsis, pneumonie ; embolie pulmonaire ; hyperthyroïdie ; intoxication alcoolique aiguë ; hypokaliémie ; myocardite.</p></div>
<div class="card"><h4>Médicaments et substances</h4><p>Hormones thyroïdiennes en excès ; sympathomimétiques et théophylline ; cocaïne et amphétamines ; ibrutinib, un inhibiteur de tyrosine kinase utilisé en hématologie, qui augmente aussi le risque hémorragique ; corticoïdes à forte dose.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Qualifier la FA d’un patient jeune d’« idiopathique » sans avoir cherché une hyperthyroïdie, une consommation d’alcool, des apnées du sommeil, une voie accessoire ou une cardiopathie à l’échocardiographie. Chez le sujet de moins de 60 ans, penser aussi à une origine génétique et au sport d’endurance intensif.</div>

<section class="ilot" id="i48-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse a quatre buts : caractériser les symptômes et leur retentissement, dater le début de l’épisode, calculer le risque thromboembolique et hémorragique, et identifier les facteurs de risque et les causes. Dater le début est décisif, car il conditionne la possibilité d’une cardioversion précoce.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li>Hypertension, diabète, insuffisance cardiaque, maladie vasculaire (éléments du score CHA₂DS₂-VA)</li><li><button class="w" data-k="i48-s-avc">AVC, accident ischémique transitoire, embolie artérielle (antécédent le plus lourd)</button></li><li>Saignement antérieur, anémie, insuffisance rénale ou hépatique</li><li>Valvulopathie, prothèse valvulaire mécanique</li></ul>
<ul><li><button class="w" data-k="i48-atcd-thyr">Dysthyroïdie, traitement par amiodarone ou hormones thyroïdiennes</button></li><li>Consommation d’alcool (en grammes par semaine), ronflement et somnolence diurne</li><li>Sport d’endurance, stimulants, drogues</li><li>Histoire familiale de FA précoce ou de mort subite</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i48-s-palp">Palpitations irrégulières (caractérisation)</button></li><li><button class="w" data-k="i48-s-fatig">Fatigue, baisse de la tolérance à l’effort (mécanismes, pièges)</button></li><li><button class="w" data-k="i48-s-dysp">Dyspnée d’effort (mécanismes en FA)</button></li><li><button class="w" data-k="i48-s-thorax">Gêne thoracique (ischémie fonctionnelle ou syndrome coronarien)</button>, anxiété</li></ul>
<ul><li><button class="w" data-k="i48-s-vertige">Vertiges, lipothymie (débit, pauses)</button></li><li><button class="w" data-k="i48-s-synco">Syncope (signal d’alarme : pause ou pré-excitation)</button></li><li><button class="w" data-k="i48-s-polyurie">Polyurie pendant l’accès (peptide natriurétique auriculaire)</button></li><li>Absence de symptôme : un patient sur trois environ</li></ul></div>
<p>Environ un tiers des patients ne ressent rien. L’absence de symptôme ne réduit pas le risque d’AVC ; elle retarde seulement le diagnostic. La découverte d’une FA lors d’un AVC est une situation fréquente.</p>
<h3>5.3 Présentations typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Homme de 58 ans, en surpoids, consommant 20 verres d’alcool par semaine. Accès de palpitations irrégulières de quelques heures, souvent nocturnes, résolutifs spontanément. ECG entre les accès normal ; Holter : FA paroxystique.</p></div>
<div class="card"><h4>Forme silencieuse révélée par un AVC</h4><p>Femme de 79 ans admise pour une aphasie brutale. ECG : FA à 88/min, méconnue. Elle ne s’était jamais plainte de palpitations. Le score CHA₂DS₂-VA passe à 5.</p></div>
<div class="card"><h4>Forme révélée par une insuffisance cardiaque</h4><p>Homme de 64 ans, dyspnée et œdèmes depuis deux mois. FA à 135/min, FEVG 30 %. Après contrôle du rythme, la FEVG remonte à 55 % en trois mois : cardiomyopathie rythmique.</p></div>
<div class="card"><h4>Forme trompeuse</h4><p>Femme de 35 ans, amaigrie, anxieuse, tremblante, FA à 140/min. TSH effondrée : maladie de Basedow. La FA est ici un signe de l’hyperthyroïdie, qu’il faut traiter en premier.</p></div></div>
</section>

<section class="ilot" id="i48-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général → signes vitaux → anthropométrie → signes ciblés. Il répond à trois questions : le patient est-il stable, a-t-il une cardiopathie ou une insuffisance cardiaque, et existe-t-il une cause décelable ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Conscience, perfusion cutanée, dyspnée au repos. <button class="w" data-k="i48-e-pouls">Pouls irrégulier et déficit de pouls (compter à l’apex)</button>. <button class="w" data-k="i48-e-ta">Pression artérielle en FA (mesures répétées)</button>. Fréquence respiratoire, saturation, température (sepsis). Poids, taille, indice de masse corporelle et tour de cou (apnées du sommeil).</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Signes de l’arythmie</b><ul><li><button class="w" data-k="i48-e-b1">Intensité variable du premier bruit (B1)</button></li><li>Absence de quatrième bruit</li><li><button class="w" data-k="i48-e-jug">Pouls jugulaire sans onde a ; ondes de flutter</button></li><li>Irrégularité persistante à l’effort</li></ul></div>
<div><b>Retentissement</b><ul><li><button class="w" data-k="e-crepitants">Crépitants (technique et valeur)</button>, turgescence jugulaire, œdèmes (insuffisance cardiaque)</li><li><button class="w" data-k="i48-e-bas-debit">Marbrures, extrémités froides, confusion (signes de bas débit)</button></li><li>Déficit neurologique focal (AVC embolique)</li><li>Ischémie aiguë d’un membre (embolie périphérique)</li></ul></div>
<div><b>Indices de cause</b><ul><li><button class="w" data-k="i48-e-rm">Roulement diastolique à la pointe (rétrécissement mitral)</button></li><li><button class="w" data-k="i48-e-souffle">Souffle systolique (insuffisance mitrale, rétrécissement aortique)</button></li><li><button class="w" data-k="i48-e-thyr">Signes d’hyperthyroïdie (goitre, tremblement, exophtalmie)</button></li><li><button class="w" data-k="i48-e-frott">Frottement péricardique (péricardite)</button></li></ul></div>
<div><b>Terrain hémorragique</b><ul><li>Pâleur, ecchymoses</li><li>Stigmates d’hépatopathie alcoolique</li><li>Hypertension non contrôlée</li><li>Toucher rectal si anémie inexpliquée</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Le pouls radial sous-estime la fréquence ventriculaire en FA rapide : les battements survenant après une diastole courte éjectent trop peu de sang pour être palpés. La fréquence se compte à l’auscultation cardiaque ou sur l’ECG. De même, les tensiomètres automatiques peuvent se tromper en FA : répéter la mesure et confirmer au besoin manuellement.</div>
