<template id="ch-G45"><div class="chap"><div class="chap-head"><div class="code">G45 · CIM-10-GM 2024 · Neurologie</div><h1>Accidents ischémiques cérébraux transitoires et syndromes apparentés</h1><span class="status">Sources consultées du 13 au 15 octobre 2026 · Revue par intelligence artificielle ; aucune validation médicale humaine revendiquée.</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><ol><li><a href="#g45-a01">Question clinique et priorités</a></li><li><a href="#g45-a02">Définition et cadre diagnostique</a></li><li><a href="#g45-a03">Épidémiologie et risque ultérieur</a></li><li><a href="#g45-a04">Territoires vasculaires et tableaux focaux</a></li><li><a href="#g45-a05">Amaurose fugace et plainte visuelle</a></li><li><a href="#g45-a06">Amnésie globale transitoire</a></li><li><a href="#g45-a07">Étiologies et diagnostics différentiels</a></li><li><a href="#g45-a08">Anamnèse et examen clinique</a></li><li><a href="#g45-a09">Parcours diagnostique et situations urgentes</a></li><li><a href="#g45-a10">Prévention et prise en charge étiologique</a></li><li><a href="#g45-a11">Suivi et situations particulières</a></li><li><a href="#g45-a12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g45-a01"><h2><span class="n">1</span> Question clinique et priorités</h2><h3 id="g45-a01-partie-1">1.1 Cas fil rouge</h3><p>Une patiente fictive de 68 ans laisse tomber sa tasse et ne parvient plus à nommer son mari. Celui-ci observe une faiblesse de la main droite. Vingt minutes plus tard, elle parle et bouge normalement. Cette récupération ne clôt pas l'évaluation : un <button class="w" data-k="g45-focal">déficit focal (explication)</button> soudain peut annoncer un infarctus évitable. Le témoin décrit les gestes impossibles, tandis que la patiente précise ce qu'elle ressentait. Leurs récits se complètent sans être forcés à coïncider.</p><h3 id="g45-a01-partie-2">1.2 Chronologie de l’épisode</h3><p>Le médecin consigne séparément la dernière heure où la patiente était normale, le début observé, l'heure de découverte et la récupération. Dans ce cas, le mari a vu le début à 09 h 10 et la récupération à 09 h 30. Si personne n'avait vu le début, la découverte ne deviendrait pas artificiellement l'heure de début. Les épisodes antérieurs et les récidives depuis ce matin sont recherchés, car la répétition peut changer l'orientation.</p><h3 id="g45-a01-partie-3">1.3 Questions de sécurité</h3><p>Un déficit persistant ou récidivant active immédiatement la filière suisse d'urgence, avec appel au 144. Après disparition complète des symptômes, les recommandations préhospitalières suisses de 2021 maintiennent l'orientation immédiate vers une unité AVC (Stroke Unit) ou un centre AVC (Stroke Center) ; le transport peut alors se faire sans signaux prioritaires. Le <button class="w" data-k="g45-parcours">parcours bernois (explication)</button> de 2026 oriente aussi immédiatement vers les urgences neurologiques les épisodes survenus dans les 48 heures ou fluctuants. Ce protocole institutionnel précise l'organisation locale ; il ne remplace pas les possibilités du réseau régional.</p><h3 id="g45-a01-partie-4">1.4 Compétences attendues</h3><p>Le raisonnement suit quatre étapes : identifier un événement compatible avec une ischémie, proposer son territoire, rechercher sa cause et commencer une prévention appropriée. Ainsi, une <button class="w" data-k="g45-examen">aphasie (langage et examen)</button> avec faiblesse droite oriente vers l'hémisphère dominant, mais ne prouve ni une sténose carotidienne ni une origine cardiaque. L'imagerie et les explorations étiologiques répondent à ces questions distinctes. La patiente comprend pourquoi des examens restent nécessaires alors qu'elle se sent rétablie.</p><h3 id="g45-a01-partie-5">1.5 Prérequis</h3><p>Un symptôme négatif correspond à une fonction perdue, comme une force ou une partie du champ visuel. Un symptôme positif ajoute une perception ou un mouvement, comme des scintillements ou des secousses. Cette distinction aide l'interrogatoire, sans constituer une règle absolue : une aura migraineuse peut associer phénomènes positifs et négatifs. Le territoire vasculaire est la région alimentée par une artère ; il fournit une hypothèse de localisation, que les résultats doivent ensuite confronter.</p><h3 id="g45-a01-partie-6">1.6 Retour final au cas</h3><p>La conclusion provisoire du cas est une suspicion d'accident ischémique transitoire, et non un diagnostic démontré par la seule récupération. Le médecin explique : « Les fonctions sont revenues, mais nous devons rechercher une lésion et une cause susceptible de provoquer une récidive. » La conclusion finale dépendra de l'imagerie, du rythme cardiaque et des artères. Toute nouvelle faiblesse, difficulté à parler ou perte visuelle déclenche un nouvel appel au 144, sans attendre le rendez-vous prévu.</p><p><button class="w" data-k="g45-focal">Déficit focal : définition et exemples</button> · <button class="w" data-k="g45-parcours">Parcours suisse : organisation et limites</button></p><div class="quiz ui" data-exercise="g45-a01"><p><b>Cas fictif — La faiblesse et le trouble de langage ont disparu en vingt minutes. Quelle priorité demeure ?</b></p><button data-ok="1">L’évaluation neurovasculaire reste immédiatement nécessaire.</button><button data-ok="0">La récupération suffit à rassurer sans autre bilan.</button><p class="fb" hidden>Une récupération complète ne supprime ni le risque précoce ni une cause traitable. Le récit daté et le témoin accompagnent l’orientation.</p></div><div class="key"><p><b>À retenir.</b> Un déficit focal soudain reste urgent après récupération. Le témoin, la fonction perdue et les heures fiables structurent le bilan.</p></div><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p><button class="pareto-btn ui" data-k="pareto-g45-a01">▲ Loi de Pareto — Question clinique et priorités</button></section><section class="ilot" id="g45-a02"><h2><span class="n">2</span> Définition et cadre diagnostique</h2><h3 id="g45-a02-partie-1">2.1 Définition clinique de l’accident ischémique transitoire</h3><p>L'European Stroke Organisation, dans sa recommandation de 2021 consacrée aux adultes, utilise une définition clinique pragmatique : des symptômes neurologiques transitoires, vraisemblablement dus à une ischémie cérébrale ou oculaire focale, durent moins de 24 heures. Cette définition rend comparables des études dont l'accès à l'imagerie diffère. Elle décrit une population de recherche et de prise en charge ; elle n'autorise jamais à attendre 24 heures devant un déficit encore présent.</p><h3 id="g45-a02-partie-2">2.2 Définition tissulaire</h3><p>Le réseau bernois 2026 emploie aussi une <button class="w" data-k="g45-definition">définition tissulaire (explication)</button> : le <button class="w" data-k="g45-focal">déficit focal (définition clinique)</button> est transitoire et aucune lésion ischémique n'apparaît en <button class="w" data-k="g45-diffusion">diffusion (principe et limites)</button>. Cette formulation exige une imagerie appropriée et son interprétation clinique. Une diffusion normale n'exclut pourtant pas tout événement ischémique : sensibilité, délai, taille et localisation limitent la détection. L'absence de lésion visible soutient le classement en accident transitoire plutôt qu'en infarctus ; elle ne prouve pas, isolément, que les symptômes étaient sans origine vasculaire.</p><h3 id="g45-a02-partie-3">2.3 Frontière avec l’infarctus cérébral</h3><p>Une lésion ischémique récente concordante avec les symptômes relève de l'infarctus cérébral, même après récupération complète. Inversement, un déficit encore présent doit être évalué comme un accident vasculaire cérébral aigu potentiellement traitable. La reperfusion thérapeutique, c'est-à-dire le rétablissement du flux dans une artère occluse, relève du chapitre sur l'infarctus cérébral. Ici, la <button class="w" data-k="g45-perfusion">perfusion cérébrale (grandeurs, unités et calcul)</button> sert seulement à comprendre pourquoi une baisse transitoire du débit peut produire un déficit réversible. La frontière sert surtout à éviter deux erreurs : appeler « transitoire » un déficit persistant et exclure l'infarctus parce que le patient a récupéré avant l'imagerie.</p><p>La classification allemande utilisée en Suisse traduit la même frontière : elle exclut des accidents transitoires l'infarctus corrélé confirmé par l'imagerie, qui relève de l'infarctus cérébral. Elle range parmi les formes non précisées le spasme des artères cérébrales et l'accident vasculaire cérébral menaçant. Un cinquième caractère y précise enfin la récupération complète : en moins d'une heure, entre 1 et 24 heures, ou selon une évolution non précisée. Le compte rendu qui mentionne une lésion concordante oriente donc aussi le codage, et non seulement le pronostic.</p><h3 id="g45-a02-partie-4">2.4 Cadre des syndromes apparentés</h3><p>Les présentations carotidiennes, vertébro-basilaires et rétiniennes relèvent d'une recherche ischémique adaptée au territoire. En revanche, l'<button class="w" data-k="g45-amnesie-criteres">amnésie globale transitoire (critères et exclusions)</button> possède des critères propres et un mécanisme encore incertain. Le regroupement administratif de ces syndromes n'impose aucune identité biologique. Une patiente qui répète ses questions sans <button class="w" data-k="g45-focal">déficit focal (définition clinique)</button> ne reçoit donc pas automatiquement la même conclusion ni la même prévention antithrombotique que la patiente aphasique du cas initial.</p><h3 id="g45-a02-partie-5">2.5 Durée des symptômes</h3><p>La durée décrit l'épisode ; elle ne mesure pas, à elle seule, sa gravité. Le dossier distingue une régression complète avant 1 heure, entre 1 et 24 heures, ou une durée insuffisamment documentée. Ces descriptions permettent le rapprochement avec les subdivisions du catalogue, sans changer les indications d'urgence. Une durée inconnue demeure inconnue ; elle ne devient ni « courte » ni rassurante. Les événements de quelques minutes peuvent révéler une cause embolique ou artérielle importante.</p><h3 id="g45-a02-partie-6">2.6 Limites diagnostiques</h3><p>Le <button class="w" data-k="g45-contentieux">choix entre définitions (explication)</button> est explicite : la formulation bernoise guide ici l'interprétation tissulaire, tandis que la définition clinique européenne explique les populations des essais. Le compte rendu précise « épisode focal transitoire compatible avec une ischémie », le résultat de la <button class="w" data-k="g45-diffusion">diffusion (principe et limites)</button> et le degré de certitude étiologique. Cette précision évite de transformer un examen normal en certitude diagnostique. Une conclusion incertaine appelle une réévaluation ciblée, et non une assurance non étayée.</p><p><button class="w" data-k="g45-definition">Définition tissulaire et limites de l’imagerie</button> · <button class="w" data-k="g45-contentieux">Contentieux entre définitions : passages et arbitrage</button></p><div class="quiz ui" data-exercise="g45-a02"><p><b>Cas fictif — Un déficit a duré dix minutes, puis la diffusion montre une lésion concordante. Que décrit le cadre tissulaire ?</b></p><button data-ok="0">Une durée inférieure à 24 heures prouve à elle seule un AIT tissulaire.</button><button data-ok="1">Une lésion concordante documente un infarctus malgré la récupération.</button><p class="fb" hidden>La définition tissulaire distingue lésion et récupération. La définition clinique des études doit être précisée séparément.</p></div><div class="key"><p><b>À retenir.</b> La récupération clinique et la lésion tissulaire sont deux dimensions différentes. Nommer la définition employée évite de mal appliquer les résultats des études.</p></div><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g40-g47.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM — ICD-10-GM 2024, catégorie G45 : inclusions, exclusions et cinquième caractère</a>.</p><button class="pareto-btn ui" data-k="pareto-g45-a02">▲ Loi de Pareto — Définition et cadre diagnostique</button></section><section class="ilot" id="g45-a03"><h2><span class="n">3</span> Épidémiologie et risque ultérieur</h2><h3 id="g45-a03-partie-1">3.1 Incidence et fréquence</h3><p>Les sources suisses retenues organisent surtout le diagnostic et le traitement ; elles ne fournissent pas ici une incidence nationale représentative des seuls accidents ischémiques transitoires.  Les statistiques de tous les accidents vasculaires cérébraux ne constituent pas un dénominateur interchangeable. De même, le nombre de passages aux urgences peut compter plusieurs consultations d'une même personne et des diagnostics finalement non ischémiques. Un chiffre de fréquence exige donc une population, une période et une définition.</p><h3 id="g45-a03-partie-2">3.2 Différences entre population générale, consultation spécialisée et hospitalisation</h3><p>Une cohorte de consultation neurovasculaire sélectionne des patients adressés pour des symptômes suspects. Une cohorte hospitalière sélectionne davantage de situations nécessitant une surveillance. Par conséquent, leurs taux d'événements ne décrivent pas automatiquement la population générale. La recommandation européenne chiffre cet écart : jusqu'à 60 % des personnes adressées pour suspicion d'accident ischémique transitoire présentent finalement un syndrome imitateur. Une statistique calculée sur toutes les suspicions mélange donc des patients dont le risque vasculaire diffère profondément. Le médecin précise toujours si un risque concerne une suspicion, un diagnostic retenu, un accident mineur ou une association de ces groupes.</p><h3 id="g45-a03-partie-3">3.3 Pronostic</h3><p>Dans l'étude britannique EXPRESS, telle qu'analysée par la recommandation européenne, le risque d'accident vasculaire cérébral à 90 jours était de 10,3 % dans la première période, puis de 2,1 % après accélération de l'évaluation et du traitement. Les effectifs étaient respectivement de 32 événements sur 310 patients et de 6 sur 281. Il s'agit d'une comparaison séquentielle observationnelle, non d'une randomisation. Ces résultats soutiennent l'organisation rapide des soins ; ils ne prédisent pas le risque individuel de la patiente du cas initial.</p><h3 id="g45-a03-partie-4">3.4 Facteurs pronostiques</h3><p>Le pronostic dépend notamment de la cause artérielle ou cardiaque, d'une lésion ischémique visible et de la répétition des épisodes. La recommandation européenne qualifie un accident transitoire de « haut risque » chez le patient vu tôt après l'épisode ou présentant d'autres éléments de risque précoce élevé : un score ABCD2 d'au moins 4, une faiblesse ou un trouble de la parole de plus de 5 minutes, des épisodes récidivants, ou une maladie significative d'une grosse artère homolatérale, comme une sténose carotidienne ou intracrânienne. Cette définition explique pourquoi un score bas ne suffit pas à rassurer. Chez une personne de 45 ans, normotendue et non diabétique, une aphasie isolée de 20 minutes ne donne que 2 points ; elle dépasse pourtant le seuil de 5 minutes. Les traitements déjà reçus et leur délai influencent également les taux observés. Ainsi, un résultat ancien obtenu avant les filières rapides ne doit pas être présenté comme le pronostic actuel de tous les patients traités.</p><h3 id="g45-a03-partie-5">3.5 Lecture d’une estimation</h3><p>Le <button class="w" data-k="g45-risque">risque absolu et le risque relatif (explication)</button> répondent à des questions différentes. Avec les proportions d'EXPRESS, la différence vaut environ 8,19 points de pourcentage lorsque l'on conserve les fractions exactes jusqu'au résultat final ; avec les valeurs déjà arrondies, 10,32 − 2,14 donnerait 8,18 ; le rapport brut des proportions vaut 2,14 ÷ 10,32 ≈ 0,21. Cette valeur est proche, mais distincte, du rapport de risques instantanés ajusté publié, qui vaut 0,20. Ce calcul descriptif ne corrige pas les différences entre périodes. L'intervalle de confiance du rapport de risques instantanés ajusté publié, 0,08 à 0,49, exprime l'incertitude statistique de ce modèle, non une fourchette personnalisée de probabilité pour une personne.</p><h3 id="g45-a03-partie-6">3.6 Annonce du risque au patient</h3><p>Une explication utile associe un risque précoce réel à une possibilité d'action : « Une récidive reste possible, surtout au début ; les examens et le traitement visent à la prévenir. » Le médecin évite d'annoncer un pourcentage individuel à partir du seul score ou d'une étude externe. Il explique aussi le bénéfice attendu de l'évaluation urgente et les signes qui doivent faire rappeler les secours. Cette communication transforme l'incertitude en consignes concrètes plutôt qu'en fausse précision.</p><p><button class="w" data-k="g45-risque">Incidence et risque absolu : dénominateurs</button> · <button class="w" data-k="g45-intervalle">Intervalles de confiance : lecture raisonnée</button></p><div class="quiz ui" data-exercise="g45-a03"><p><b>Cas fictif — EXPRESS compare 32/310 événements à 6/281 dans deux périodes successives. Quelle lecture est justifiée ?</b></p><button data-ok="1">L’étude montre une association entre organisation rapide et baisse observée du risque à 90 jours.</button><button data-ok="0">L’étude démontre par randomisation le risque individuel de chaque patient suisse.</button><p class="fb" hidden>Les dénominateurs et le temps sont connus, mais le schéma avant/après n’est pas une randomisation. La différence absolue vaut environ 8,2 points de pourcentage et la réduction relative brute environ 79 %.</p></div><div class="key"><p><b>À retenir.</b> Un risque exige un événement, un dénominateur et un horizon temporel. Une cohorte avant/après ne prédit pas la probabilité individuelle.</p></div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p><button class="pareto-btn ui" data-k="pareto-g45-a03">▲ Loi de Pareto — Épidémiologie et risque ultérieur</button></section><section class="ilot" id="g45-a04"><h2><span class="n">4</span> Territoires vasculaires et tableaux focaux</h2><h3 id="g45-a04-partie-1">4.1 Irrigation normale</h3><p>Les carotides internes alimentent principalement la circulation antérieure ; les artères vertébrales rejoignent l'artère basilaire et participent à la circulation postérieure. À la base du cerveau, les artères communicantes relient ces axes dans le polygone artériel. Ces connexions expliquent des possibilités de suppléance, mais leur présence et leur efficacité varient. La figure montre l'organisation normale ; les territoires fonctionnels sont ensuite confrontés à l'examen. Une image schématique ne permet pas de prédire à elle seule la <button class="w" data-k="g45-perfusion">perfusion (grandeurs et modèle)</button> d'un patient.</p><figure><a href="assets/img/cycle2/g45/g45-01.gif" target="_blank" rel="noopener" aria-label="Ouvrir la figure en taille complète"><img src="assets/img/cycle2/g45/g45-01.gif" alt="Vue latérale du cerveau montrant les territoires corticaux antérieur, moyen et postérieur en trois couleurs." width="820" loading="lazy"></a><figcaption><p>Territoires corticaux schématiques : le jaune désigne l’artère cérébrale antérieure, le rouge la moyenne et le bleu la postérieure. Cette vue latérale ne représente ni tous les territoires profonds ni les variations individuelles.</p><p><a href="assets/img/cycle2/g45/g45-01.gif" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></p><p class="src"><a href="https://commons.wikimedia.org/wiki/File:Cerebral_vascular_territories.jpg" target="_blank" rel="noopener">Source publiée</a> · Frank Gaillard (œuvre dérivée), d’après Patrick J. Lynch, illustrateur médical — double licence <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a> et <a href="https://www.gnu.org/licenses/fdl-1.3.html" target="_blank" rel="noopener">GFDL 1.3 ou ultérieure</a> ; original de Patrick J. Lynch sous <a href="https://creativecommons.org/licenses/by/2.5/" target="_blank" rel="noopener">CC BY 2.5</a>.</p></figcaption></figure><h3 id="g45-a04-partie-2">4.2 Syndrome carotidien hémisphérique</h3><p>Le syndrome carotidien hémisphérique associe, selon la région concernée, faiblesse ou trouble sensitif controlatéral, trouble du langage ou trouble attentionnel. Une <button class="w" data-k="g45-examen">aphasie (langage et examen)</button> désigne une perturbation du langage, tandis qu'une <button class="w" data-k="g45-examen">dysarthrie (articulation et examen)</button> concerne son articulation. Chez la patiente du cas initial, la faiblesse droite et la difficulté de dénomination orientent vers l'hémisphère dominant gauche. Cette concordance localise l'atteinte ; elle ne suffit pas à attribuer l'événement à une plaque carotidienne.</p><h3 id="g45-a04-partie-3">4.3 Syndrome vertébro-basilaire</h3><p>Le syndrome vertébro-basilaire peut comporter diplopie, trouble de l'équilibre ou de la coordination, <button class="w" data-k="g45-examen">dysarthrie (articulation et examen)</button>, troubles visuels ou signes du tronc cérébral. Le médecin recherche leur association et leur début soudain. Un vertige aigu prononcé accompagné d'une incapacité à marcher fait partie des présentations d'alarme du référentiel suisse préhospitalier. Cependant, un vertige isolé possède plusieurs causes : ce symptôme isolé ne prouve ni n'exclut une ischémie postérieure. L'examen et l'imagerie restent orientés par l'ensemble du tableau.</p><h3 id="g45-a04-partie-4">4.4 Atteintes de territoires multiples ou bilatéraux</h3><p>Des manifestations bilatérales ou dans plusieurs territoires conduisent à préciser chaque symptôme et son horaire. Des lésions récentes dispersées à l'imagerie peuvent renforcer une hypothèse embolique ; elles ne désignent pas automatiquement le cœur comme source. Le réseau bernois fait rechercher les causes cardiaques, aortiques et artérielles selon cette distribution. Une succession de déficits différents mérite donc un récit chronologique complet, plutôt que le regroupement vague de tous les épisodes sous le terme de malaise.</p><h3 id="g45-a04-partie-5">4.5 Tableaux atypiques</h3><p>Les symptômes isolés ou incomplets rendent la localisation moins certaine. Ainsi, une difficulté d'élocution peut relever du langage ou de l'articulation ; une « perte visuelle gauche » peut signifier l'œil gauche ou le demi-champ gauche des deux yeux. Le <button class="w" data-k="g45-positif">caractère positif ou négatif (explication)</button> et la progression des manifestations aident à comparer ischémie et aura. Aucune de ces caractéristiques isolées ne remplace l'évaluation spécialisée, notamment lors d'un premier épisode ou d'un tableau inhabituel.</p><h3 id="g45-a04-partie-6">4.6 Comparaison de vignettes</h3><p>Trois présentations types montrent la portée du raisonnement. Une faiblesse droite avec <button class="w" data-k="g45-examen">aphasie (langage et examen)</button> suggère une atteinte hémisphérique dominante ; une diplopie avec ataxie oriente vers la circulation postérieure ; une perte monoculaire impose d'évaluer la rétine et l'axe carotidien correspondant. Dans chaque cas, le médecin sépare localisation proposée, preuve tissulaire et cause. La récupération est documentée selon sa durée réelle, y compris lorsqu'elle reste imprécise. Ces descriptions couvrent les présentations et leurs variantes temporelles sans transformer la durée en score de sécurité.</p><div class="two"><div class="card"><h3>Présentation cohérente</h3><p>Une faiblesse d’un côté et un trouble du langage apparus ensemble orientent un réseau focal. Le début et la récupération sont documentés.</p></div><div class="card"><h3>Présentation moins spécifique</h3><p>Un vertige isolé ou une plainte visuelle imprécise exige des questions et un examen supplémentaires. La faible spécificité ne signifie pas l’absence de danger.</p></div></div><p><button class="w" data-k="g45-territoire">Localisation antérieure et postérieure</button> · <button class="w" data-k="g45-positif">Symptômes négatifs et positifs : limites de la distinction</button></p><div class="quiz ui" data-exercise="g45-a04"><p><b>Cas fictif — Une patiente décrit une perte de la moitié gauche de la scène dans chaque œil. Quelle précision importe ?</b></p><button data-ok="0">La plainte correspond nécessairement à une perte monoculaire gauche.</button><button data-ok="1">La plainte peut correspondre à une perte homonyme du champ, de localisation rétrochiasmatique.</button><p class="fb" hidden>Le champ visuel et l’œil ne sont pas des termes équivalents. L’interrogatoire précise ce que chaque œil percevait.</p></div><div class="key"><p><b>À retenir.</b> Les associations de signes orientent le territoire. Les symptômes positifs ou négatifs sont des indices, jamais une preuve isolée.</p></div><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a>.</p><button class="pareto-btn ui" data-k="pareto-g45-a04">▲ Loi de Pareto — Territoires vasculaires et tableaux focaux</button></section><section class="ilot" id="g45-a05"><h2><span class="n">5</span> Amaurose fugace et plainte visuelle</h2><h3 id="g45-a05-partie-1">5.1 Description d’un trouble visuel transitoire</h3><p>L'interrogatoire précise si la personne a perdu la vision d'un œil ou une partie du champ visuel des deux yeux. Le patient peut confondre ces expériences. Lorsqu'un phénomène persiste, couvrir alternativement chaque œil aide à le caractériser ; après récupération, le récit conserve cette incertitude. Le médecin note aussi le début, l'évolution, les phénomènes lumineux, la douleur, les épisodes antérieurs et la récupération. Une perte brutale ne reçoit pas automatiquement le diagnostic de migraine.</p><h3 id="g45-a05-partie-2">5.2 Bases anatomiques</h3><p>La rétine reçoit l'image et transmet l'information par le nerf optique. Au chiasma, une partie des fibres croise ; les voies postérieures relaient ensuite l'information vers les régions visuelles cérébrales. Ainsi, une atteinte préchiasmatique peut produire un déficit monoculaire, tandis qu'une atteinte postchiasmatique peut toucher un même demi-champ dans les deux yeux. La figure distingue ces trajets. Le côté du champ visuel perdu ne se confond donc pas avec le côté de l'œil atteint.</p><figure><a href="assets/img/cycle2/g45/g45-02.gif" target="_blank" rel="noopener" aria-label="Ouvrir la figure en taille complète"><img src="assets/img/cycle2/g45/g45-02.gif" alt="Trajet des fibres rétiniennes, du chiasma aux régions visuelles cérébrales." width="820" loading="lazy"></a><figcaption><p>Voies visuelles publiées : suivre les fibres de chaque rétine jusqu’aux relais et au cortex permet de distinguer une atteinte avant le chiasma d’une atteinte rétrochiasmatique. Le dessin n’est pas un test diagnostique.</p><p><a href="assets/img/cycle2/g45/g45-02.gif" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></p><p class="src"><a href="https://commons.wikimedia.org/wiki/File:Human_visual_pathway.svg" target="_blank" rel="noopener">Source publiée</a> · Miquel Perello Nieto — CC BY-SA 4.0 · <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener">Licence ou statut</a>.</p></figcaption></figure><h3 id="g45-a05-partie-3">5.3 Amaurose fugace</h3><p>L'<button class="w" data-k="g45-monoculaire">amaurose fugace (perte visuelle et localisation)</button> est une perte visuelle transitoire, classiquement monoculaire, compatible avec une ischémie rétinienne. Elle conduit à rechercher une cause vasculaire ou embolique, et non à rassurer sur la seule récupération. Le bilan relie l'examen ophtalmologique à l'exploration des vaisseaux et du cœur. Comme pour les présentations hémisphériques, une cause carotidienne doit être anatomiquement concordante avant d'être tenue pour responsable. Le caractère transitoire n'exclut ni une lésion ni une source embolique persistante.</p><h3 id="g45-a05-partie-4">5.4 Diagnostics différentiels visuels</h3><p>Les diagnostics concurrents incluent une aura migraineuse, une pathologie rétinienne, une neuropathie optique et certaines manifestations épileptiques. Dans la revue narrative publiée en 2021 dans le Deutsches Ärzteblatt par des équipes de Munich, de Berne et de Tübingen, l'aura typique progresse souvent et combine phénomènes lumineux et déficit ; le décollement rétinien peut associer éclairs, corps flottants et perte de champ. Une désaturation des couleurs peut orienter vers une atteinte du nerf optique. Ces indices guident l'examen ; ils ne justifient pas de retarder l'évaluation d'une perte aiguë persistante. Une céphalée nouvelle, une douleur du cuir chevelu ou de la mâchoire à la mastication, avec signes généraux, font également rechercher une artérite à cellules géantes ; le bilan inflammatoire et l'avis urgent sont alors orientés par cette hypothèse. Une perte visuelle persistante suit une filière urgente ophtalmologique et neurovasculaire.</p><h3 id="g45-a05-partie-5">5.5 Explorations</h3><p>L'ophtalmologiste examine l'acuité, le champ et le fond d'œil selon le tableau. Le <button class="w" data-k="g45-fond">fond d'œil (explication)</button> visualise des structures oculaires ; il ne remplace pas l'imagerie cérébrale et vasculaire lorsqu'une ischémie est suspectée. Inversement, une imagerie cérébrale normale n'exclut pas une maladie rétinienne. La question clinique accompagne donc chaque prescription : localiser la lésion oculaire, rechercher une lésion cérébrale ou identifier une source artérielle et cardiaque.</p><h3 id="g45-a05-partie-6">5.6 Parcours de soins</h3><p>La coordination neurologique et ophtalmologique évite une interruption du bilan entre deux spécialités. Le médecin explique la conclusion retenue et les incertitudes, puis vérifie que les explorations vasculaires et le suivi sont effectivement organisés. Une nouvelle perte visuelle brutale, une faiblesse ou un trouble de la parole impose un recours urgent au 144. La durée est conservée dans le dossier, qu'elle soit inférieure à 1 heure, comprise entre 1 et 24 heures ou impossible à établir précisément.</p><p>Le protocole bernois traite la perte visuelle monoculaire aiguë et indolore comme une urgence : « le temps, c'est la rétine ». Le médecin de premier recours adresse immédiatement la personne à un hôpital capable de thrombolyse et prévient l'ophtalmologie et la neurologie. Si la perte date de moins de 12 heures, le bilan d'accident vasculaire cérébral est lancé : angiographie par résonance ou par tomodensitométrie, biologie d'urgence avec vitesse de sédimentation, puis prévention secondaire. L'occlusion de l'artère centrale de la rétine ou d'une de ses branches est admise et traitée comme un infarctus cérébral, même au-delà de 4,5 heures. Devant une suspicion d'artérite à cellules géantes, aucune thrombolyse n'est réalisée ; si la vitesse de sédimentation est élevée, le protocole prévoit l'administration immédiate de 1 g de méthylprednisolone par voie intraveineuse.</p><p><button class="w" data-k="g45-monoculaire">Monoculaire ou binoculaire : interrogatoire</button> · <button class="w" data-k="g45-fond">Fond d’œil : signes et limites</button></p><div class="quiz ui" data-exercise="g45-a05"><p><b>Cas fictif — Une perte visuelle monoculaire persiste, avec nouvelle douleur à la mastication. Quelle conduite suit le raisonnement ?</b></p><button data-ok="1">Une évaluation urgente oculaire et vasculaire recherche notamment une artérite à cellules géantes.</button><button data-ok="0">Ces deux manifestations suffisent à retenir une aura migraineuse.</button><p class="fb" hidden>Le caractère persistant et les symptômes associés changent l’urgence et les hypothèses. Une imagerie cérébrale normale n’exclurait pas la maladie rétinienne.</p></div><div class="key"><p><b>À retenir.</b> La distinction entre œil et champ visuel guide la localisation. La perte persistante et les signes d’artérite nécessitent une évaluation urgente.</p></div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a>.</p><button class="pareto-btn ui" data-k="pareto-g45-a05">▲ Loi de Pareto — Amaurose fugace et plainte visuelle</button></section><section class="ilot" id="g45-a06"><h2><span class="n">6</span> Amnésie globale transitoire</h2><h3 id="g45-a06-partie-1">6.1 Amnésie globale transitoire</h3><p>L'<button class="w" data-k="g45-amnesie-criteres">amnésie globale transitoire (critères et exclusions)</button> se caractérise par une incapacité soudaine à mémoriser de nouvelles informations, souvent associée à une perte de souvenirs antérieurs. La recommandation conjointe allemande, autrichienne et suisse actualisée en 2022, publiée en 2023, décrit une résolution en moins de 24 heures. Sa validité annoncée allait jusqu'au 31 décembre 2025 ; ses propositions restent attribuées à cette version, faute de nouvelle édition confirmée. Un épisode rare de moins d'une heure peut rester compatible si le tableau est typique.</p><p>L'épisode dure en moyenne 6 à 8 heures. Il débute chez 75 % des patients entre 50 et 70 ans ; aucun cas n'a été décrit avant 30 ans, et le tableau reste rare avant 50 ans. Chez une personne plus jeune, la recommandation impose donc de rechercher rapidement une autre cause. Jusqu'à 85 % des épisodes suivent un événement pouvant être considéré comme déclenchant, par exemple un effort physique, un stress émotionnel ou une activité sexuelle ; ces circonstances orientent l'interrogatoire sans prouver le mécanisme. Une migraine figure plus souvent dans les antécédents, avec un rapport de cotes de 2,5.</p><h3 id="g45-a06-partie-2">6.2 Interrogatoire du témoin</h3><p>Le témoin décrit des questions répétées : la personne reçoit une réponse, puis la redemande parce qu'elle ne la retient pas. Elle reste éveillée, accessible et consciente de son identité. Le médecin documente le début, les circonstances et la récupération, sans supposer qu'un effort ou un stress antérieur démontre la cause. La présence d'une somnolence, d'une fièvre, d'un <button class="w" data-k="g45-focal">déficit focal (définition clinique)</button> ou d'un comportement profondément altéré fait rechercher immédiatement un autre diagnostic.</p><h3 id="g45-a06-partie-3">6.3 Fonctions mnésiques</h3><p>La mémoire antérograde permet de conserver une information nouvelle ; la mémoire rétrograde donne accès aux souvenirs antérieurs. Pendant l'épisode, l'identité personnelle et certaines activités acquises peuvent être préservées malgré l'amnésie. Cette dissociation explique qu'une personne puisse converser et répéter pourtant les mêmes questions. Après récupération, une lacune mnésique couvrant l'épisode peut persister. Le <button class="w" data-k="g45-memoire">réseau hippocampique (explication)</button> aide à comprendre cette présentation, sans réduire la mémoire à une structure unique.</p><h3 id="g45-a06-partie-4">6.4 Diagnostics différentiels d’une amnésie transitoire</h3><p>Les principaux diagnostics à exclure sont une ischémie touchant les structures mnésiques, une amnésie épileptique, un trouble métabolique, une intoxication ou un traumatisme. Des épisodes très fréquents ou des signes épileptiques orientent vers une amnésie épileptique transitoire. L'électroencéphalogramme peut aider, mais un enregistrement normal ne l'exclut pas. Une amnésie seulement rétrograde, des troubles de conscience ou une récupération incomplète au-delà de 24 heures ne correspondent pas au tableau typique et imposent un bilan rapide.</p><h3 id="g45-a06-partie-5">6.5 Examens</h3><p>L'imagerie par résonance peut montrer de petites lésions hippocampiques en <button class="w" data-k="g45-diffusion">diffusion (principe et limites)</button>, mieux détectées entre 24 et 72 heures selon la recommandation de 2023. Leur absence n'exclut pas l'<button class="w" data-k="g45-amnesie-criteres">amnésie globale transitoire (critères et exclusions)</button>. Ce délai de meilleure détection n'autorise pas à attendre devant une présentation atypique : l'imagerie urgente recherche alors un infarctus ou une autre cause traitable. Des lésions situées hors de l'hippocampe motivent un bilan vasculaire et cardiaque. Une surveillance hospitalière peut être retenue jusqu'à résolution, notamment sans entourage disponible.</p><h3 id="g45-a06-partie-6">6.6 Évolution et suivi</h3><p>Le pronostic est généralement favorable dans la population répondant aux critères stricts : la recommandation ne retrouve aucun argument en faveur de séquelles chroniques, qu'il s'agisse d'ischémie cérébrale ou de trouble mnésique durable. La recommandation rapporte une récidive chez 12 à 27 % des patients selon les études, avec des suivis hétérogènes ; ce n'est pas un risque annuel uniforme. Aucune prophylaxie spécifique suffisamment démontrée n'est proposée. Les facteurs vasculaires sont traités selon leurs indications propres. Ainsi, le diagnostic d'<button class="w" data-k="g45-amnesie-criteres">amnésie globale transitoire (critères et exclusions)</button> ne justifie pas à lui seul une bithérapie antiplaquettaire. Le patient reçoit une explication de l'épisode et des motifs de réévaluation.</p><p><button class="w" data-k="g45-memoire">Mémoire et amnésie : bases</button> · <button class="w" data-k="g45-amnesie-criteres">Amnésie transitoire : critères différentiels</button></p><div class="quiz ui" data-exercise="g45-a06"><p><b>Cas fictif — Des questions répétées s’accompagnent d’une somnolence et d’une faiblesse du bras. Peut-on retenir une amnésie globale typique ?</b></p><button data-ok="0">Une amnésie au premier plan suffit à retenir le tableau typique.</button><button data-ok="1">Ces signes imposent de rechercher en urgence une autre cause.</button><p class="fb" hidden>La vigilance préservée et l’absence de déficit focal font partie du tableau typique. Des signes discordants imposent un autre bilan.</p></div><div class="key"><p><b>À retenir.</b> Une amnésie typique isole principalement la mémoire avec vigilance et identité conservées. Les signes atypiques imposent un bilan urgent ; aucune prophylaxie antithrombotique propre n’est démontrée.</p></div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10631054/" target="_blank" rel="noopener" data-reference-source="1">Correction de la recommandation Transient Global Amnesia (2023), Correction du nom d’une auteure</a>.</p><button class="pareto-btn ui" data-k="pareto-g45-a06">▲ Loi de Pareto — Amnésie globale transitoire</button></section>
