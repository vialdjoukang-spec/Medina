<template data-pop="g45-energie" data-title="Énergie cellulaire : bases"><p>L’adénosine triphosphate fournit de l’énergie aux transports cellulaires, dont la pompe sodium-potassium. Ces transports maintiennent des différences de concentration qui rendent possibles la transmission et la recapture de neurotransmetteurs. Les astrocytes participent notamment à l’élimination du glutamate extracellulaire.</p><p>Une disponibilité énergétique insuffisante perturbe les gradients, la membrane et les transports. Le glutamate peut alors s’accumuler et participer à une entrée excessive de calcium et à des lésions. Le retour de la fonction ne prouve toutefois pas que toute cellule était intacte ou que la cause vasculaire a disparu. Les modèles cellulaires expliquent une vulnérabilité ; ils ne valident pas, à eux seuls, un médicament protecteur chez l’humain.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7884476/" target="_blank" rel="noopener" data-reference-source="1">Disruption of Glutamate Transport and Homeostasis by Acute Metabolic Stress (2021), Introduction ; transport du glutamate ; pompe sodium-potassium ; réponse au stress énergétique</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a>.</p></template>
<template data-pop="g45-plaquette" data-title="Plaquette et coagulation : lecture guidée de la figure"><h3>Molécule, enzyme et récepteur : trois objets différents</h3><p>Le <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15627" target="_blank" rel="noopener" data-reference-source="1">thromboxane A2</a> est une petite molécule lipidique, notée TBXA2 sur la figure. La plaquette le synthétise par une chaîne que le dessin représente dans sa partie inférieure : une phospholipase libère l’acide arachidonique des membranes ; la cyclo-oxygénase plaquettaire, notée PTGS1, le transforme en prostaglandines <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:27647" target="_blank" rel="noopener" data-reference-source="1">G2</a> et <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15554" target="_blank" rel="noopener" data-reference-source="1">H2</a> ; la thromboxane synthase, notée TBXAS1, produit enfin le <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15627" target="_blank" rel="noopener" data-reference-source="1">thromboxane A2</a>. Une fois libéré, celui-ci se fixe sur un récepteur distinct, noté TBXA2R, à la surface des plaquettes ; la figure représente par une boucle de rétroaction positive l’activation qui en résulte.</p><p>La fiche Aspirine Cardio précise que l’acide acétylsalicylique exerce son effet antithrombotique en inhibant la synthèse du <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15627" target="_blank" rel="noopener" data-reference-source="1">thromboxane A2</a> dans les plaquettes. L’aspirine bloque donc l’enzyme PTGS1, en amont ; elle ne bloque ni la synthase TBXAS1 ni le récepteur TBXA2R. Le clopidogrel agit ailleurs : son métabolite actif, formé dans le foie, bloque le récepteur de l’adénosine diphosphate noté P2RY12, que le texte du cours appelle P2Y12.</p><h3>Correspondance de chaque symbole</h3><p>Le tableau relie chaque symbole anglais du dessin à son nom officiel, vérifié auprès du comité international de nomenclature des gènes humains ou de la base de référence des molécules biologiques de l’Institut européen de bio-informatique. Le rôle indiqué est celui que montrent les flèches de la figure ; il ne constitue pas une indication thérapeutique.</p><table class="t"><thead><tr><th>Symbole du dessin</th><th>Nom vérifié</th><th>Nature</th><th>Rôle sur la figure</th></tr></thead><tbody><tr><td><a href="https://www.pharmgkb.org/pathway/PA154444041" target="_blank" rel="noopener" data-reference-source="1">Thienopyridine, P450 isoforms, active metabolite</a></td><td>Thiénopyridine, isoenzymes du cytochrome P450, métabolite actif</td><td>Médicament et transformation hépatique</td><td>Le clopidogrel est activé dans le foie, notamment par le CYP2C19, puis son métabolite bloque <a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:18124" target="_blank" rel="noopener" data-reference-source="1">P2RY12</a>.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:18124" target="_blank" rel="noopener" data-reference-source="1">P2RY12</a></td><td>Récepteur purinergique P2Y12</td><td>Récepteur de l’adénosine diphosphate</td><td>Cible du métabolite actif du clopidogrel.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:8539" target="_blank" rel="noopener" data-reference-source="1">P2RY1</a></td><td>Récepteur purinergique de la famille Y, sous-type 1</td><td>Second récepteur de l’adénosine diphosphate, couplé aux protéines G</td><td>Active aussi la plaquette ; le clopidogrel ne le vise pas.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:8533" target="_blank" rel="noopener" data-reference-source="1">P2RX1</a></td><td>Récepteur purinergique de la famille X, sous-type 1, canal ionique</td><td>Canal activé par l’adénosine triphosphate</td><td>Fait entrer le calcium dans la plaquette.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:3535" target="_blank" rel="noopener" data-reference-source="1">F2</a></td><td>Facteur II de la coagulation, thrombine</td><td>Enzyme de la coagulation</td><td>Active la plaquette par son récepteur.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:3537" target="_blank" rel="noopener" data-reference-source="1">F2R</a></td><td>Récepteur de la thrombine, appelé aussi récepteur activé par les protéases 1</td><td>Récepteur plaquettaire</td><td>Relie coagulation et activation plaquettaire.</td></tr><tr><td><a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15843" target="_blank" rel="noopener" data-reference-source="1">AA</a></td><td>Acide arachidonique</td><td>Acide gras membranaire</td><td>Substrat de la cyclo-oxygénase.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:9035" target="_blank" rel="noopener" data-reference-source="1">PLA2</a>, Phospholipase</td><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:9035" target="_blank" rel="noopener" data-reference-source="1">Phospholipase A2</a>, par exemple celle du groupe IV A</td><td>Enzyme</td><td>Libère l’acide arachidonique ; associée au calcium sur le dessin.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:9604" target="_blank" rel="noopener" data-reference-source="1">PTGS1</a></td><td>Prostaglandine-endoperoxyde synthase 1, ou cyclo-oxygénase 1</td><td>Enzyme</td><td>Cible irréversible de l’aspirine.</td></tr><tr><td><a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:27647" target="_blank" rel="noopener" data-reference-source="1">PGG2</a>, <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15554" target="_blank" rel="noopener" data-reference-source="1">PGH2</a></td><td>Prostaglandines <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:27647" target="_blank" rel="noopener" data-reference-source="1">G2</a> et <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15554" target="_blank" rel="noopener" data-reference-source="1">H2</a></td><td>Intermédiaires lipidiques</td><td>Précurseurs du <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15627" target="_blank" rel="noopener" data-reference-source="1">thromboxane A2</a>.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:11609" target="_blank" rel="noopener" data-reference-source="1">TBXAS1</a></td><td>Thromboxane A synthase 1</td><td>Enzyme</td><td>Transforme la <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15554" target="_blank" rel="noopener" data-reference-source="1">prostaglandine H2</a> en <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15627" target="_blank" rel="noopener" data-reference-source="1">thromboxane A2</a>.</td></tr><tr><td><a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15627" target="_blank" rel="noopener" data-reference-source="1">TBXA2</a></td><td><a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15627" target="_blank" rel="noopener" data-reference-source="1">Thromboxane A2</a></td><td>Molécule lipidique</td><td>Produit final de la voie que l’aspirine interrompt.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:11608" target="_blank" rel="noopener" data-reference-source="1">TBXA2R</a></td><td>Récepteur du <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15627" target="_blank" rel="noopener" data-reference-source="1">thromboxane A2</a></td><td>Récepteur plaquettaire</td><td>Reçoit le <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15627" target="_blank" rel="noopener" data-reference-source="1">thromboxane A2</a> ; boucle de rétroaction positive.</td></tr><tr><td><a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15555" target="_blank" rel="noopener" data-reference-source="1">PGD2</a>, <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15552" target="_blank" rel="noopener" data-reference-source="1">PGI2</a>, <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15551" target="_blank" rel="noopener" data-reference-source="1">PGE2</a></td><td><a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15555" target="_blank" rel="noopener" data-reference-source="1">Prostaglandine D2</a>, prostacycline et <a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15551" target="_blank" rel="noopener" data-reference-source="1">prostaglandine E2</a></td><td>Molécules lipidiques</td><td>Agissent sur les récepteurs des prostaglandines ; boucle de rétroaction négative.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:4392" target="_blank" rel="noopener" data-reference-source="1">GNAS</a></td><td>Locus complexe GNAS, sous-unité alpha stimulatrice d’une protéine G</td><td>Protéine de signalisation</td><td>Relie les récepteurs des prostaglandines à l’adénylate cyclase.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:234" target="_blank" rel="noopener" data-reference-source="1">ADCY3</a></td><td>Adénylate cyclase 3</td><td>Enzyme</td><td>Produit l’adénosine monophosphate cyclique à partir de l’adénosine triphosphate ; freinée par les protéines G activées.</td></tr><tr><td><a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:17489" target="_blank" rel="noopener" data-reference-source="1">cAMP</a></td><td>Adénosine monophosphate cyclique</td><td>Messager intracellulaire</td><td>Freine l’élévation du calcium, donc l’activation.</td></tr><tr><td><a href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:16595" target="_blank" rel="noopener" data-reference-source="1">IP3</a></td><td>Inositol 1,4,5-trisphosphate</td><td>Messager intracellulaire</td><td>Conduit à l’élévation du calcium dans la plaquette.</td></tr><tr><td><a href="https://www.genenames.org/data/gene-symbol-report/#!/hgnc_id/HGNC:12726" target="_blank" rel="noopener" data-reference-source="1">VWF</a>, Collagen, Glycoproteins</td><td>Facteur von Willebrand, collagène, glycoprotéines de membrane</td><td>Protéines d’adhésion</td><td>Fixent la plaquette au sous-endothélium.</td></tr><tr><td><a href="https://www.pharmgkb.org/pathway/PA154444041" target="_blank" rel="noopener" data-reference-source="1">Fibrinogen Receptor, Glycoprotein IIb/IIIa inhibitors</a></td><td>Récepteur du fibrinogène ; inhibiteurs de la glycoprotéine IIb/IIIa</td><td>Récepteur et classe médicamenteuse</td><td>Pont entre plaquettes ; classe étrangère à la prévention de l’AIT enseignée ici.</td></tr></tbody></table><p>La lecture utile pour la clinique tient en trois lignes du tableau : PTGS1 pour l’aspirine, P2RY12 pour le clopidogrel, et la thrombine pour le lien avec la coagulation. L’apixaban, absent du dessin, inhibe directement le facteur Xa, en amont de la thrombine. Bloquer deux étapes différentes peut accroître le risque hémorragique ; seule une preuve clinique justifie une association.</p><p class="src">Sources : <a href="https://www.pharmgkb.org/pathway/PA154444041" target="_blank" rel="noopener" data-reference-source="1">PharmGKB — Platelet Aggregation Inhibitor Pathway, figure publiée sous CC BY-SA 4.0</a> ; <a href="https://www.genenames.org/" target="_blank" rel="noopener" data-reference-source="1">Comité de nomenclature HGNC — fiches des symboles de la figure (consultées le 14.10.2026)</a> ; <a href="https://www.ebi.ac.uk/chebi/" target="_blank" rel="noopener" data-reference-source="1">EMBL-EBI ChEBI — entrées des métabolites de la figure (consultées le 14.10.2026)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (mars 2026), Propriétés/Effets : mécanisme</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (septembre 2022), Mises en garde et Interactions : CYP2C19</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (août 2026), Mécanisme d’action</a>.</p></template>
<template data-pop="g45-reseaux" data-title="Réseaux mnésiques : bases"><p>Le montage sépare deux systèmes. Les voies visuelles expliquent la latéralité d’une perte de champ ; les connexions hippocampiques aident à comprendre un trouble de formation des souvenirs. Leur voisinage dans une même figure ne démontre pas un mécanisme commun.</p><p>Dans le panneau hippocampique, les termes allemands désignent notamment cortex entorhinal, fibres moussues, collatérales de Schaffer, noyaux septaux et corps mamillaires. CA1 et CA3 sont des noms de régions de la corne d’Ammon ; la recommandation sur l’amnésie globale souligne la détection possible de foyers CA1. Une telle lésion ponctuelle doit être interprétée avec le tableau clinique ; d’autres lésions ou des signes atypiques modifient l’évaluation.</p><p>Correspondances littérales du panneau droit : Moosfasern = fibres moussues ; <a href="https://commons.wikimedia.org/wiki/File:Hippocampus_connections.svg" target="_blank" rel="noopener" data-reference-source="1">Schaffer-Kollaterale</a> = collatérale de Schaffer ; Septumkerne = noyaux septaux ; Corpora mamillaria = corps mamillaires ; Gyrus Cinguli = gyrus cingulaire ; Entorhinaler Cortex = cortex entorhinal ; Gyrus Dentatus = gyrus denté ; Tractus perforans = voie perforante ; Temporaler Cortex = cortex temporal ; Amygdala = amygdale. Les étiquettes désignent des structures et connexions ; elles ne codent pas un degré de gravité.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a>.</p></template>
<template data-pop="g45-genetique" data-title="Pertinence génétique : indications et limites"><p>Le bilan bernois réserve l’exploration des causes monogéniques à un contexte évocateur : histoire familiale, âge, manifestations associées ou distribution atypique des lésions. Il ne propose pas un test génétique de routine pour chaque épisode focal bref. Un résultat génétique requiert une interprétation spécialisée.</p><p>La pharmacogénétique pose une autre question. Le clopidogrel nécessite une activation métabolique impliquant le CYP2C19 ; certaines variations peuvent réduire la réponse pharmacologique. Sa fiche suisse indique qu’une charge de 600 mg suivie de 150 mg par jour augmente la réponse antiplaquettaire des métaboliseurs lents et invite à envisager des doses plus élevées ; elle précise aussitôt qu’aucune posologie appropriée n’a été établie sur des résultats cliniques. Un effet mesuré sur les plaquettes ne prouve pas automatiquement un bénéfice clinique d’une adaptation empirique.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-monographies" data-title="Monographies : mécanisme, essais et FI"><p>Choisir un produit signifie vérifier à la fois la cause à traiter et l’information professionnelle suisse du produit. Les antiagrégants répondent à certaines ischémies non cardioemboliques ; l’apixaban prévient l’embolie dans la fibrillation auriculaire non valvulaire ; l’atorvastatine cible notamment le risque athérosclérotique et lipidique.</p><p>Chaque monographie détaille la forme, le mécanisme, les essais, la dose, les adaptations et la sécurité. Les liens ci-dessous permettent de confronter la décision à la fiche exacte.</p><p><button class="w" data-k="g45-aspirine">Aspirine Cardio : fiche suisse et divergence de dose</button> · <button class="w" data-k="g45-plavix">Plavix : monothérapie et bithérapie précoce hors indication spécifique</button> · <button class="w" data-k="g45-eliquis">Eliquis : indication, dose et adaptations suisses</button> · <button class="w" data-k="g45-sortis">Sortis : efficacité, dose et sécurité musculaire</button></p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-doses" data-title="Doses et durée : tableau du produit exact"><p>Les doses suivantes concernent l’adulte et les produits suisses vérifiés. La prescription précise la stratégie et la durée, au lieu d’assimiler toute dose recommandée à une dose autorisée pour l’AIT.</p><table class="t"><thead><tr><th>Produit et voie orale</th><th>Fiche suisse</th><th>Place clinique et limite</th></tr></thead><tbody><tr><td>Aspirine Cardio, 100 ou 300 mg gastro-résistants</td><td>Après épisode transitoire : 300 mg par jour ou 100 mg trois fois par jour ; comprimé entier au moins 30 minutes avant le repas.</td><td>Berne 2026 : 100 mg par jour en prévention. L’écart de dose est explicite ; la forme gastro-résistante ne devient pas un produit injectable de charge.</td></tr><tr><td>Plavix, 75 ou 300 mg</td><td>75 mg une fois par jour dans ses indications ; début après AVC entre sept jours et six mois dans la population autorisée.</td><td>Berne : charge de clopidogrel de 600 mg puis 75 mg par jour avec aspirine durant trois semaines pour l’AIT à haut risque sélectionné ; usage précoce sans indication AIT spécifique dans la FI lue.</td></tr><tr><td>Eliquis, 2,5 ou 5 mg</td><td>Fibrillation auriculaire non valvulaire : 5 mg deux fois par jour ; 2,5 mg deux fois par jour si au moins deux critères définis.</td><td>Pas de charge de traitement veineux à transposer à cette indication ; durée selon persistance de l’indication et réévaluation.</td></tr><tr><td>Sortis, 10–80 mg</td><td>Début usuel 10 mg par jour, maximum 80 mg ; adaptation après au moins quatre semaines.</td><td>Berne utilise une stratégie intensive, notamment 80 mg, dans le contexte athérosclérotique approprié ; durée préventive réévaluée.</td></tr></tbody></table><p>Le tableau ne fixe pas une dose cible universelle d’anticoagulant ou d’antiagrégant. La monographie complète contient les exclusions et la surveillance qui conditionnent l’emploi.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-interactions" data-title="Interactions dangereuses : mécanisme et conduite"><div class="alert"><p>Associer automatiquement aspirine, clopidogrel et apixaban après un épisode transitoire augmente les effets sur l’hémostase sans fournir une justification étiologique. Toute association exige une indication, une durée et une surveillance explicites.</p></div><p>Avec Plavix, le prescripteur évite les inhibiteurs puissants ou modérés du CYP2C19, parmi lesquels la fiche cite l’oméprazole, l’ésoméprazole et deux antidépresseurs, la fluoxétine et la fluvoxamine, ainsi que le moclobémide ; elle recommande le pantoprazole si un inhibiteur de pompe à protons est nécessaire. Avec Aspirine Cardio, il vérifie les anti-inflammatoires et le méthotrexate ; une dose de méthotrexate d’au moins 15 mg par semaine constitue une contre-indication d’association dans sa fiche.</p><p>Avec Eliquis, les inhibiteurs puissants du CYP3A4 et de la glycoprotéine P appellent la prudence et une surveillance selon la fiche suisse. Avec Sortis, l’association au glécaprévir/pibrentasvir est contre-indiquée ; l’acide fusidique systémique impose l’arrêt de la statine jusqu’à 7 jours après la dernière dose d’acide fusidique ; la ciclosporine limite la dose d’atorvastatine à 10 mg par jour et le letermovir à 20 mg par jour. Avec Eliquis, l’ajout d’acide acétylsalicylique a presque doublé le risque d’hémorragie majeure, de 1,8 % à 3,4 % par an, dans les données de la fiche. Une décision de remplacement se fait avec le prescripteur, après vérification du produit ajouté.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-surveillance" data-title="Surveillance : paramètres et rythme"><p>Le suivi des antithrombotiques recherche saignement, anémie, nouveaux médicaments et changement de fonction rénale ou hépatique. La numération est contrôlée en présence de signes cliniques de saignement ou d’anomalie hématologique ; la fréquence des autres bilans dépend du terrain et de la fiche, sans calendrier identique imposé à tous.</p><p>Pour Sortis, les fonctions hépatiques sont vérifiées avant traitement puis régulièrement. Une élévation persistante supérieure à trois fois la limite supérieure de la normale demande réduction ou interruption ; la limite du laboratoire accompagne le résultat. Une douleur, une faiblesse ou des crampes musculaires conduisent à doser la créatine phosphokinase sans attendre le prochain contrôle programmé ; au-delà de cinq fois la limite supérieure de la normale, la fiche impose l’arrêt.</p><p>Le calcul du multiple suit trois étapes. D’abord, relever la limite supérieure imprimée sur le compte rendu, car elle varie selon le laboratoire et la méthode. Ensuite, multiplier cette limite par cinq. Enfin, comparer le résultat du patient à ce produit. Exemple fictif : si la limite d’un laboratoire était 200 U/L, cinq fois la limite correspondraient à 5 × 200 = 1 000 U/L ; un résultat de 1 200 U/L correspondrait à 1 200 ÷ 200 = 6 fois la limite et imposerait l’arrêt chez un patient symptomatique. Ces chiffres sont fictifs, choisis pour le calcul, et ne représentent aucun intervalle de référence réel. L’enzyme ne se dose pas après un effort intense, qui l’élève aussi. Les modifications lipidiques sont jugées après un délai adapté, avec ajustements espacés d’au moins quatre semaines selon la FI.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-aspirine" data-title="Aspirine Cardio : monographie suisse"><h3>Produit, mécanisme et place</h3><p>Aspirine Cardio de Bayer, autorisation suisse 51795, contient 100 ou 300 mg d’acide acétylsalicylique par comprimé gastro-résistant. La FI de mars 2026 décrit une inhibition irréversible de la cyclo-oxygénase plaquettaire, réduisant la synthèse du thromboxane. La prévention après accident transitoire est une indication de cette fiche. Les données d’efficacité et la durée sont lues dans ce cadre, sans en déduire une indication pour une amnésie globale transitoire typique.</p><h3>Dose, forme et divergence documentée</h3><p>La FI indique 300 mg par jour ou 100 mg trois fois par jour après un épisode transitoire. Berne 2026 utilise 100 mg par jour en prévention : cet écart entre produit et protocole doit être documenté dans le choix clinique. Le comprimé gastro-résistant est avalé entier au moins 30 minutes avant le repas, sans être coupé, mâché ou écrasé. Une dose de charge intraveineuse d’un protocole aigu ne peut pas être administrée avec cette forme ; aucun produit injectable n’est prescrit par cette monographie.</p><h3>Exclusions et situations particulières</h3><p>La fiche suisse de ce produit énumère onze contre-indications : hypersensibilité aux salicylés, à d’autres anti-inflammatoires ou à un excipient ; antécédent de bronchospasme, d’urticaire ou de réaction de type allergique après acide acétylsalicylique ou autre anti-inflammatoire non stéroïdien ; diathèse hémorragique ; ulcère gastrique ou duodénal actif ou hémorragie gastro-intestinale ; maladies inflammatoires de l’intestin, telles que la maladie de Crohn et la colite ulcéreuse ; troubles sévères de la fonction hépatique, cirrhose et ascite ; insuffisance rénale sévère, avec clairance de la créatinine inférieure à 30 mL/min ; insuffisance cardiaque sévère de classe NYHA III ou IV ; association au méthotrexate à 15 mg par semaine ou plus ; troisième trimestre de la grossesse ; douleurs postopératoires après pontage coronarien.</p><p>Deux de ces exclusions sont souvent oubliées. Les maladies inflammatoires de l’intestin s’ajoutent aux risques digestifs d’ulcération et d’hémorragie que la fiche décrit pour tous les anti-inflammatoires. L’insuffisance cardiaque sévère se comprend par les mises en garde de la même fiche : les anti-inflammatoires peuvent provoquer une rétention hydrique avec œdèmes ou hypertension, d’où la prudence dès qu’une altération cardiaque prédispose à cette rétention. Ces exclusions appartiennent à Aspirine Cardio et à ses dosages ; elles ne constituent pas une règle indifférenciée pour toute présentation d’acide acétylsalicylique. Pendant les deux premiers trimestres, la fiche n’admet l’emploi qu’en cas de nécessité absolue, à la dose la plus faible et pour la durée la plus courte.</p><h3>Interactions et surveillance</h3><p>Les anticoagulants et autres antiagrégants augmentent le risque de saignement. L’ibuprofène et le naproxène peuvent gêner l’effet plaquettaire et accroître le risque digestif. Le suivi recherche saignement, intolérance digestive, réactions allergiques et nouvelles associations, avec bilan adapté aux signes et au terrain. L’âge seul n’autorise pas à ignorer la fonction rénale ou les antécédents hémorragiques.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (mise à jour mars 2026, consultée le 14.10.2026), Posologie ; Contre-indications ; Mises en garde ; Interactions</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), page PDF 18 : prévention secondaire</a>.</p></template>
<template data-pop="g45-plavix" data-title="Plavix : monographie suisse et usage précoce"><h3>Produit et mécanisme</h3><p>Plavix de Sanofi, autorisation suisse 54509, existe en comprimés pelliculés de clopidogrel à 75 ou 300 mg. La FI de septembre 2022 décrit un promédicament dont le métabolite actif inhibe le récepteur plaquettaire P2Y12 ; le CYP2C19 participe à son activation. Chez les métaboliseurs lents du CYP2C19, la fiche indique qu’une charge de 600 mg suivie de 150 mg par jour augmente la réponse antiplaquettaire et invite à envisager des doses plus élevées, tout en précisant qu’aucune posologie appropriée n’a été établie sur des résultats cliniques.</p><h3>Essais, population et statut</h3><p>CAPRIE (1996) a comparé 75 mg de clopidogrel à 325 mg d’aspirine chez 19 185 patients avec infarctus myocardique récent, AVC ischémique entre une semaine et six mois ou artériopathie périphérique symptomatique. Le bénéfice global porte sur un critère vasculaire composite ; les sous-groupes ne permettent pas toutes les conclusions séparées. CHANCE (2013) et POINT (2018), analysés dans la recommandation ESO 2021, concernent une stratégie précoce après événement mineur ou transitoire à haut risque. Ils ne sont pas une autorisation suisse spécifique de bithérapie immédiate après AIT.</p><h3>Dose et durée selon la stratégie</h3><p>La dose usuelle autorisée dans les indications vasculaires est 75 mg par jour. La FI ne recommande pas le début dans les sept premiers jours après AVC ischémique, faute de données dans son cadre. À l’inverse, le protocole bernois 2026 utilise, pour l’AIT à haut risque sans sténose symptomatique, sélectionné dans les 24 heures, une charge de clopidogrel de 600 mg puis 75 mg par jour avec aspirine pendant trois semaines. Cette utilisation précoce hors indication AIT spécifique requiert une décision spécialisée et une justification ; l’association est ensuite suivie d’une monothérapie. La fiche elle-même avertit qu’après un AIT ou un AVC récents, l’association d’aspirine et de clopidogrel augmente les saignements majeurs et ne doit être utilisée qu’avec prudence hors des situations où son bénéfice est démontré. Il ne faut pas prolonger mécaniquement l’association.</p><h3>Sécurité et adaptations</h3><p>Une hémorragie active ou une insuffisance hépatique sévère sont des contre-indications. L’insuffisance rénale appelle la prudence ; l’âge ne suffit pas à modifier la dose, et l’emploi pédiatrique n’est pas établi. Les inhibiteurs puissants ou modérés du CYP2C19 peuvent réduire la formation du métabolite actif ; par précaution, la FI les déconseille et cite l’oméprazole, l’ésoméprazole, la fluvoxamine, la fluoxétine, le moclobémide, le voriconazole, le fluconazole, la ciprofloxacine, la cimétidine, la carbamazépine, l’oxcarbazépine et le chloramphénicol. Si un inhibiteur de la pompe à protons est nécessaire, elle recommande d’en choisir un qui inhibe peu cette enzyme, comme le pantoprazole. Les ISRS, qui agissent aussi sur l’activation plaquettaire, imposent la prudence en raison du risque de saignement. Avant une chirurgie programmée, la fiche prévoit l’arrêt 7 jours avant l’intervention si l’effet antiagrégant n’est pas souhaité. Toute suspicion de saignement conduit à un bilan approprié ; thrombopénie, hémolyse et signes neurologiques ou rénaux imposent une évaluation urgente. Pendant la grossesse, l’indication doit être indispensable ; il ne faut pas allaiter pendant le traitement.</p><p>Les personnes devant bénéficier d’une revascularisation carotidienne n’étaient pas incluses dans les populations principales de CHANCE et POINT analysées par l’ESO. Les sténoses symptomatiques et les gestes vasculaires suivent donc une stratégie spécialisée, sans appliquer automatiquement la durée générale de trois semaines.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-eliquis" data-title="Eliquis : monographie suisse"><h3>Produit et indication</h3><p>Eliquis de <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Bristol-Myers Squibb SA</a>, autorisation suisse 61549, contient 2,5 ou 5 mg d’apixaban par comprimé filmé. La FI d’août 2026 décrit une inhibition directe du facteur Xa et autorise la prévention de l’AVC et de l’embolie systémique chez l’adulte avec fibrillation auriculaire non valvulaire. Cette indication ne s’étend pas automatiquement à une ischémie de mécanisme indéterminé ou à une valve artificielle.</p><h3>Preuve clinique</h3><p>ARISTOTLE (2011) a comparé apixaban et warfarine chez 18 201 patients avec fibrillation auriculaire. La FI rapporte un taux annuel du critère AVC ou embolie systémique de 1,27 % contre 1,60 %, avec rapport des risques instantanés de 0,79 et intervalle à 95 % de 0,66–0,95. La FI attribue surtout la supériorité à la réduction des accidents vasculaires cérébraux hémorragiques et des infarctus avec transformation hémorragique ; les taux des seuls accidents ischémiques et embolies systémiques étaient similaires. Il ne faut donc pas présenter toute composante isolée comme également diminuée. Cette preuve ne valide pas l’anticoagulation de toute plainte neurologique transitoire.</p><h3>Dose suisse et adaptations</h3><p>Pour cette indication, la dose est 5 mg deux fois par jour. Elle devient 2,5 mg deux fois par jour si au moins deux critères sont présents : âge d’au moins 80 ans, poids d’au plus 60 kg, créatinine sérique d’au moins 133 µmol/L. La FI suisse ne remplace pas cette règle par une réduction automatique pour la seule clairance de 15–29 mL/min. En dessous de 15 mL/min ou en dialyse, l’utilisation n’est pas recommandée. Une insuffisance hépatique légère ou modérée appelle la prudence sans adaptation automatique ; Child-Pugh C ou maladie hépatique avec coagulopathie et risque hémorragique significatif constituent des contre-indications.</p><h3>Surveillance et interactions</h3><p>Une hémorragie active exclut le traitement. Les fonctions rénale et hépatique, le poids, l’observance et les nouveaux médicaments sont réévalués selon le contexte. Les inhibiteurs puissants du CYP3A4 et de la glycoprotéine P appellent prudence et surveillance clinique dans la FI suisse ; les inducteurs puissants peuvent réduire l’exposition. Une association à d’autres antithrombotiques ne se fait pas par défaut. La grossesse n’est pas une situation d’emploi recommandée ; la décision entre allaitement et traitement suit la FI. La durée dépend de l’indication persistante et de la réévaluation, sans charge de traitement veineux à transposer.</p><h3>Contre-indications et situations non recommandées</h3><p>La fiche distingue ses contre-indications formelles — hypersensibilité, saignement évolutif cliniquement significatif, maladie hépatique associée à une coagulopathie et à un risque hémorragique cliniquement significatif, insuffisance hépatique sévère Child-Pugh C — de situations où l’apixaban n’est « pas recommandé ». Le syndrome des antiphospholipides en fait partie : chez une personne qui a déjà présenté une thrombose et chez qui ce syndrome est diagnostiqué, les anticoagulants oraux directs, apixaban compris, ne sont pas recommandés. Le risque est le plus net en cas de triple positivité — anticoagulant lupique, anticorps anticardiolipine et anticorps anti-bêta-2-glycoprotéine I —, car les récidives thrombotiques pourraient y être plus fréquentes que sous antagoniste de la vitamine K. Le protocole bernois écarte lui aussi les anticoagulants oraux directs en présence de ce syndrome. Il s’agit d’une non-recommandation, non d’une contre-indication formelle ; elle impose néanmoins une autre stratégie, décidée avec un spécialiste. Les porteurs de valves cardiaques artificielles et les patients dialysés relèvent également des situations non recommandées.</p><div class="alert"><p><b>Hémorragie majeure sous Eliquis.</b> La fiche prévoit l’arrêt du traitement et, si nécessaire, des mesures appropriées. Sa rubrique Surdosage précise que l’hémorragie doit être examinée et qu’un traitement approprié doit être envisagé : hémostase chirurgicale, transfusion de plasma frais congelé ou antidote des inhibiteurs du facteur Xa tel que l’andexanet alfa. Des concentrés de complexe prothrombinique ou du facteur VII activé recombinant peuvent aussi être envisagés devant une hémorragie menaçant le pronostic vital, mais la fiche signale l’absence d’expérience clinique de contrôle des saignements avec ces produits chez les patients sous Eliquis. L’hémodialyse est peu susceptible d’être efficace. Le choix et la dose relèvent du protocole hospitalier et des spécialistes. L’ajout d’acide acétylsalicylique a fait passer le risque d’hémorragie majeure de 1,8 % à 3,4 % par an dans les données rapportées par la fiche, ce qui justifie de ne jamais l’associer par défaut.</p></div><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (mise à jour août 2026, consultée le 14.10.2026), Contre-indications ; Mises en garde : risque hémorragique, syndrome des antiphospholipides ; Interactions ; Surdosage</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), page PDF 19 : « Direct oral anticoagulants »</a>.</p></template>
<template data-pop="g45-sortis" data-title="Sortis : monographie suisse"><h3>Produit, mécanisme et place</h3><p>Sortis de Viatris, autorisation suisse 54085, contient 10, 20, 40 ou 80 mg d’atorvastatine par comprimé pelliculé. La FI d’avril 2025 décrit une inhibition compétitive de la HMG-CoA-réductase, qui diminue la synthèse hépatique du cholestérol et augmente les récepteurs captant les lipoprotéines de basse densité. La stratégie bernoise intensive s’inscrit notamment dans l’athérosclérose symptomatique ; elle n’est pas automatiquement nécessaire pour toute cause, telle qu’une dissection isolée.</p><h3>Essai et limites</h3><p>SPARCL (2006) a comparé 80 mg par jour au placebo chez 4 731 personnes ayant présenté un AVC ou un AIT dans les six mois, sans maladie coronaire connue. La FI rapporte une diminution du critère d’AVC mortel ou non et expose une augmentation des AVC hémorragiques dans une analyse post hoc. Le traitement doit donc être interprété dans sa population et son rapport bénéfice-risque. Le chapitre Propriétés/Effets décrivant un essai ne remplace pas la rubrique Indications du produit.</p><h3>Dose et adaptations</h3><p>La dose initiale usuelle est 10 mg une fois par jour, jusqu’à 80 mg au maximum. Les ajustements sont espacés d’au moins quatre semaines. La prise peut avoir lieu avec ou sans repas ; l’insuffisance rénale n’impose pas d’adaptation automatique. Le schéma bernois peut retenir d’emblée une stratégie intensive appropriée, notamment 80 mg. Sortis n’est pas autorisé chez l’enfant et l’adolescent dans la fiche consultée.</p><h3>Sécurité et suivi</h3><p>La fiche contre-indique Sortis en cas d’hypersensibilité, de pathologie active du foie, d’élévation durable et d’origine incertaine des transaminases au-delà de trois fois la normale, de cholestase, c’est-à-dire de trouble de l’écoulement de la bile, et de myopathie. Elle le contre-indique aussi pendant la grossesse et l’allaitement, ainsi qu’en association au glécaprévir/pibrentasvir, traitement antiviral de l’hépatite C : ces deux virostatiques inhibent les transporteurs hépatiques qui captent l’atorvastatine et augmentent donc son exposition. La fonction hépatique est contrôlée avant traitement puis régulièrement ; une élévation persistante supérieure à trois fois la normale conduit à réduire la dose ou à arrêter.</p><div class="alert"><p><b>Toxicité musculaire : quand arrêter.</b> La créatine phosphokinase est une enzyme musculaire dont l’élévation sanguine signale une atteinte des fibres. Sortis doit être interrompu immédiatement en cas de myopathie suspectée ou diagnostiquée, ou d’élévation significative de cette enzyme. Chez un patient qui a des douleurs, une faiblesse ou des crampes, la fiche demande de la doser et d’arrêter si elle dépasse cinq fois la limite supérieure de la normale ; l’arrêt s’envisage aussi lorsque les symptômes sont importants et permanents, même sous ce seuil. Une simple myalgie n’est donc pas une myopathie : elle impose une évaluation et un dosage, non un arrêt réflexe ni une attente du prochain contrôle. Une reprise, par la même statine ou une autre, peut s’envisager à dose minimale et sous surveillance accrue après disparition des symptômes et normalisation de l’enzyme.</p></div><p>La fiche précise encore trois points pratiques. Avant traitement, l’enzyme est dosée chez les personnes à risque de rhabdomyolyse, et le traitement n’est pas commencé si elle dépasse déjà cinq fois la normale. Une faiblesse proximale persistante avec enzyme élevée malgré l’arrêt évoque une myopathie nécrosante auto-immune, très rare. Enfin, l’aggravation d’une myasthénie impose l’arrêt. Côté interactions, l’acide fusidique systémique impose l’arrêt de Sortis pendant toute sa durée, avec reprise 7 jours après la dernière dose d’acide fusidique ; le gemfibrozil est à éviter ; la ciclosporine plafonne la dose à 10 mg et le letermovir à 20 mg par jour. La réponse lipidique, la tolérance et l’indication déterminent la poursuite. Le calcul du multiple de la limite figure dans la fenêtre <button class="w" data-k="g45-surveillance">surveillance (calcul du multiple de la limite)</button>.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (mise à jour avril 2025, consultée le 14.10.2026), Contre-indications ; Mises en garde : effets sur la musculature, tableau 1 ; Interactions</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), page PDF 21 : dyslipidémie</a>.</p></template>
<template data-pop="g45-calcul-lipides" data-title="Cible lipidique : calcul depuis les données"><p>Dans l’athérosclérose symptomatique, le protocole bernois recherche notamment un cholestérol lié aux lipoprotéines de basse densité inférieur à 1,4 mmol/L et une baisse d’au moins 50 % par rapport au départ. Ce sont des cibles de prévention, pas les limites de référence d’une population saine.</p><p>Exemple fictif : une concentration initiale de 3,0 mmol/L devient 1,3 mmol/L. La baisse absolue vaut 3,0 − 1,3 = 1,7 mmol/L. La baisse relative vaut (1,7 ÷ 3,0) × 100 = 56,7 %. Les deux objectifs sont donc atteints dans cet exemple. Si le résultat était 1,6 mmol/L, la baisse serait 46,7 % et aucun des deux objectifs ne serait atteint. Cette arithmétique ne décide pas à elle seule de la tolérance ou de la prochaine prescription.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-laboratoire" data-title="Paramètres biologiques : références suisses et calcul de limite"><p>Une valeur de laboratoire se lit avec le prélèvement, la méthode, les unités et la population. Le tableau CHUV daté du 9 juin 2026 conserve un état des intervalles au 16 octobre 2024. Il précise que seul le compte rendu individuel fait foi.</p><table class="t"><thead><tr><th>Paramètre</th><th>Population et matériel</th><th>Intervalle publié</th><th>Condition et portée</th></tr></thead><tbody><tr><td>Glucose veineux</td><td>Plus de 12 ans ; plasma</td><td>3,7–5,6 mmol/L</td><td>La méthode enzymatique est précisée. Le jeûne n’est pas spécifié dans cette table ; il faut le documenter. Cet intervalle n’est pas utilisé comme seuil diagnostique de diabète.</td></tr><tr><td>Glucose artériel ou capillaire</td><td>Plus de 12 ans ; plasma</td><td>3,6–5,8 mmol/L</td><td>Ces lignes ne sont pas une plage universelle de tout lecteur au point de soins.</td></tr><tr><td>Créatinine</td><td>Plus de 15 ans ; plasma</td><td>Femmes : 44–80 µmol/L ; hommes : 62–106 µmol/L</td><td>Le document utilise une méthode de Jaffé cinétique compensée. La concentration n’est pas la clairance ; le seuil posologique d’Eliquis répond à une autre question.</td></tr><tr><td>Alanine aminotransférase</td><td>Plus de 21 ans ; plasma</td><td>Femmes : 9–36 U/L ; hommes : 11–60 U/L</td><td>La méthode du tableau est réalisée à 37 °C avec pyridoxal phosphate. La limite réelle figurant sur le résultat sert au suivi du médicament.</td></tr></tbody></table><p>Un résultat de créatinine de 133 µmol/L ne constitue donc pas une définition universelle d’insuffisance rénale : c’est notamment un critère parmi trois de l’adaptation suisse d’Eliquis. Le médecin vérifie aussi l’évolution et le contexte.</p><p>Pour interpréter « trois fois la limite supérieure », il faut d’abord relever cette limite. Exemple fictif : un laboratoire indique 36 U/L ; trois fois cette valeur font 3 × 36 = 108 U/L. Un résultat de 120 U/L représente 120 ÷ 36 = 3,33 fois la limite. La FI Sortis lie la conduite à une élévation persistante et au contexte clinique ; un calcul isolé ne remplace pas cette appréciation. Si la limite était 60 U/L, le même résultat serait seulement deux fois la limite.</p><p class="src">Sources : <a href="https://www.chuv.ch/fileadmin/sites/dl/documents/DMLP-CCL-LCC-RE-33-0069-V3.pdf" target="_blank" rel="noopener" data-reference-source="1">CHUV — Analyses, intervalles de référence (Document version 2, 09.06.2026 ; état des valeurs au 16.10.2024 ; impression 07.09.2026), p. 1 : alanine aminotransférase ; p. 3 : créatinine ; p. 4 : glucose</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-a01" data-title="Loi de Pareto — Question clinique et priorités"><p class="ratio" data-cover="g45-a01"></p><ul><li>Un déficit focal soudain reste urgent après récupération.</li><li>Le témoin, la fonction perdue et les heures fiables structurent le bilan.</li></ul><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="pareto-g45-a02" data-title="Loi de Pareto — Définition et cadre diagnostique"><p class="ratio" data-cover="g45-a02"></p><ul><li>La récupération clinique et la lésion tissulaire sont deux dimensions différentes.</li><li>Nommer la définition employée évite de mal appliquer les résultats des études.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-a03" data-title="Loi de Pareto — Épidémiologie et risque ultérieur"><p class="ratio" data-cover="g45-a03"></p><ul><li>Un risque exige un événement, un dénominateur et un horizon temporel.</li><li>Une cohorte avant/après ne prédit pas la probabilité individuelle.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-a04" data-title="Loi de Pareto — Territoires vasculaires et tableaux focaux"><p class="ratio" data-cover="g45-a04"></p><ul><li>Les associations de signes orientent le territoire.</li><li>Les symptômes positifs ou négatifs sont des indices, jamais une preuve isolée.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a>.</p></template>
<template data-pop="pareto-g45-a05" data-title="Loi de Pareto — Amaurose fugace et plainte visuelle"><p class="ratio" data-cover="g45-a05"></p><ul><li>La distinction entre œil et champ visuel guide la localisation.</li><li>La perte persistante et les signes d’artérite nécessitent une évaluation urgente.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a>.</p></template>
<template data-pop="pareto-g45-a06" data-title="Loi de Pareto — Amnésie globale transitoire"><p class="ratio" data-cover="g45-a06"></p><ul><li>Une amnésie typique isole principalement la mémoire avec vigilance et identité conservées.</li><li>Les signes atypiques imposent un bilan urgent ; aucune prophylaxie antithrombotique propre n’est démontrée.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10631054/" target="_blank" rel="noopener" data-reference-source="1">Correction de la recommandation Transient Global Amnesia (2023), Correction du nom d’une auteure</a>.</p></template>
<template data-pop="pareto-g45-a07" data-title="Loi de Pareto — Étiologies et diagnostics différentiels"><p class="ratio" data-cover="g45-a07"></p><ul><li>Les causes dangereuses et traitables sont recherchées en priorité.</li><li>Une cause incertaine appelle une documentation et une réévaluation, non un traitement étiologique sans fondement.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-a08" data-title="Loi de Pareto — Anamnèse et examen clinique"><p class="ratio" data-cover="g45-a08"></p><ul><li>Le langage, l’articulation, la force, la vision et la coordination sont décrits séparément.</li><li>Dernière normalité, découverte, début observé et récupération ne sont pas interchangeables.</li></ul><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a>.</p></template>
<template data-pop="pareto-g45-a09" data-title="Loi de Pareto — Parcours diagnostique et situations urgentes"><p class="ratio" data-cover="g45-a09"></p><ul><li>Le score ne décide pas seul de l’orientation.</li><li>Lésion, sténose symptomatique, arythmie et conditions réelles de suivi modifient la décision.</li></ul><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="pareto-g45-a10" data-title="Loi de Pareto — Prévention et prise en charge étiologique"><p class="ratio" data-cover="g45-a10"></p><ul><li>La prévention dépend du mécanisme, du délai et du risque hémorragique.</li><li>Les recommandations et les doses autorisées du produit suisse doivent être confrontées explicitement.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-a11" data-title="Loi de Pareto — Suivi et situations particulières"><p class="ratio" data-cover="g45-a11"></p><ul><li>Un calendrier de suivi ne retarde jamais l’évaluation d’une récidive.</li><li>Le terrain et les nouveaux résultats peuvent modifier la stratégie.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-a12" data-title="Loi de Pareto — Critères formels et paramètres clés"><p class="ratio" data-cover="g45-a12"></p><ul><li>Les critères diagnostiques ne sont pas des scores thérapeutiques.</li><li>La conclusion conserve les faits, le cadre utilisé et les incertitudes.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-e01" data-title="Loi de Pareto — Imagerie cérébrale et vasculaire"><p class="ratio" data-cover="g45-e01"></p><ul><li>L’imagerie cérébrale et vasculaire répond à des questions complémentaires.</li><li>Une diffusion négative ne ferme pas le diagnostic d’ischémie transitoire.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="pareto-g45-e02" data-title="Loi de Pareto — Explorations cardiaques et étiologiques"><p class="ratio" data-cover="g45-e02"></p><ul><li>Le premier tracé peut manquer une arythmie intermittente.</li><li>Un examen se choisit pour une question et s’interprète dans sa population.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://www.chuv.ch/fileadmin/sites/dl/documents/DMLP-CCL-LCC-RE-33-0069-V3.pdf" target="_blank" rel="noopener" data-reference-source="1">CHUV — Analyses, intervalles de référence (Document version 2, 09.06.2026 ; état des valeurs au 16.10.2024 ; impression 07.09.2026), p. 1 : alanine aminotransférase ; p. 3 : créatinine ; p. 4 : glucose</a>.</p></template>
<template data-pop="pareto-g45-e03" data-title="Loi de Pareto — Synthèse d’interprétation et erreurs"><p class="ratio" data-cover="g45-e03"></p><ul><li>Un résultat négatif possède une portée limitée.</li><li>La concordance anatomique et temporelle précède l’attribution causale.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="pareto-g45-s01" data-title="Loi de Pareto — Anatomie et histologie vasculaires"><p class="ratio" data-cover="g45-s01"></p><ul><li>Paroi, lumière et anastomoses expliquent des mécanismes distincts.</li><li>L’anatomie schématique ne mesure pas la suppléance du patient.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a> ; <a href="https://histology.leeds.ac.uk/home/circulatory/circ_common_str/" target="_blank" rel="noopener" data-reference-source="1">University of Leeds — The Histology Guide, Common structure (Page non datée, consultée le 13 octobre 2026), Tunica intima, media et adventitia</a>.</p></template>
<template data-pop="pareto-g45-s02" data-title="Loi de Pareto — Physiologie de perfusion"><p class="ratio" data-cover="g45-s02"></p><ul><li>Débit, pression et résistance sont des grandeurs différentes.</li><li>Les modèles d’autorégulation n’établissent pas des cibles tensionnelles individuelles.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7884476/" target="_blank" rel="noopener" data-reference-source="1">Disruption of Glutamate Transport and Homeostasis by Acute Metabolic Stress (2021), Introduction ; transport du glutamate ; pompe sodium-potassium ; réponse au stress énergétique</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="pareto-g45-s03" data-title="Loi de Pareto — Biochimie et thrombose"><p class="ratio" data-cover="g45-s03"></p><ul><li>Le manque d’énergie perturbe les gradients et la transmission.</li><li>Plaquettes et coagulation offrent des cibles différentes dont l’association exige une preuve.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7884476/" target="_blank" rel="noopener" data-reference-source="1">Disruption of Glutamate Transport and Homeostasis by Acute Metabolic Stress (2021), Introduction ; transport du glutamate ; pompe sodium-potassium ; réponse au stress énergétique</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
