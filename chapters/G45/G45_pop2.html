<template data-pop="pareto-g45-s04" data-title="Loi de Pareto — Réseaux neurologiques et syndromes apparentés"><p class="ratio" data-cover="g45-s04"></p><ul><li>Les réseaux visuels et mnésiques doivent être distingués.</li><li>Une plausibilité génétique ou physiopathologique n’est pas une indication systématique.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-p01" data-title="Loi de Pareto — Classes thérapeutiques et produits suisses"><p class="ratio" data-cover="g45-p01"></p><ul><li>La prescription vérifie produit, forme, indication, dose et durée.</li><li>Les divergences entre fiche suisse et protocole sont documentées, notamment pour la bithérapie précoce.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-g45-p02" data-title="Loi de Pareto — Interactions et surveillance"><p class="ratio" data-cover="g45-p02"></p><ul><li>Les nouvelles associations peuvent accroître le saignement ou modifier l’exposition.</li><li>La surveillance suit les symptômes, les fonctions d’organe et la fiche du produit.</li></ul><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
