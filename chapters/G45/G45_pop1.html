<template data-pop="g45-focal" data-title="Déficit focal : définition et exemples"><p>Un déficit focal est une perte de fonction que l’on peut rattacher à une région ou à un réseau neurologique. Une faiblesse d’un côté, une perte d’une moitié du champ visuel ou un trouble du langage en sont des exemples. Une fatigue diffuse isolée ne permet pas la même localisation.</p><p>La précision vient de l’action devenue impossible : lever un bras, nommer un objet, voir une moitié de la scène. La soudaineté et la concordance anatomique rendent une origine vasculaire plausible, mais ne la démontrent pas seules. Après récupération, le témoin peut décrire la fonction perdue que l’examen ne retrouve plus.</p><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-parcours" data-title="Parcours suisse : organisation et limites"><p>En Suisse, un déficit focal soudain persistant ou récidivant appelle le 144. Après disparition complète des symptômes, les recommandations préhospitalières de 2021 maintiennent la conduite immédiate vers une unité AVC (Stroke Unit) ou un centre AVC (Stroke Center) ; les signaux prioritaires ne sont alors plus indispensables. Le réseau organise ensuite l’accès à une unité ou à un centre neurovasculaire ; ses contraintes géographiques influencent le transport.</p><p>À Berne, le protocole d’août 2026 distingue un épisode datant de 0–48 heures ou fluctuant, à évaluer immédiatement, un épisode de 2–7 jours, à adresser aux urgences dans les 12 heures, et un épisode de plus de 7 jours, à évaluer par le médecin dans les 24 heures. Ces catégories institutionnelles ne retardent jamais un déficit nouveau ou un signe d’alarme. Une consultation rapide exige aussi l’accès effectif aux examens et un suivi organisé.</p><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-definition" data-title="Définition tissulaire et limites de l’imagerie"><p>La définition tissulaire bernoise décrit une dysfonction focale transitoire sans lésion ischémique correspondante sur la diffusion. Si une lésion concordante existe, la récupération clinique n’efface pas l’infarctus. L’ancienne limite de 24 heures décrit le temps clinique, sans renseigner à elle seule sur le tissu.</p><p>L’imagerie possède néanmoins des limites de délai, de résolution et de localisation. Le médecin ne déduit donc pas d’une diffusion négative que le récit était nécessairement non vasculaire. Il rapproche symptômes, territoire, séquences et délai avant de conclure. Cette nuance évite de confondre une définition avec un test parfait.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-contentieux" data-title="Contentieux entre définitions : passages et arbitrage"><p>Le référentiel bernois de 2026 privilégie une définition tissulaire. La recommandation européenne de 2021 conserve pour ses questions une définition clinique pragmatique : symptômes focaux cérébraux ou oculaires durant moins de 24 heures, présumés ischémiques. Elle motive ce choix par l’accès inégal à l’imagerie et par les populations des études.</p><p>Ces textes répondent donc à des besoins différents. Dans le dossier individuel, écrire « déficit résolu en vingt minutes ; diffusion positive concordante » décrit les deux dimensions sans les opposer artificiellement. Pour appliquer un résultat d’essai, il faut reprendre la population effectivement incluse. Aucune de ces définitions n’autorise à attendre 24 heures avant l’orientation.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-risque" data-title="Incidence et risque absolu : dénominateurs"><p>Le risque absolu est la proportion de personnes qui présentent l’événement pendant une période définie. Dans EXPRESS, cohorte avant/après citée par l’ESO, 32 événements sur 310 patients représentent 32 ÷ 310 = 0,103226, soit 10,32 % à 90 jours ; 6 sur 281 représentent 6 ÷ 281 = 0,021352, soit 2,14 %.</p><p>La différence absolue se calcule sur les fractions exactes : 0,103226 − 0,021352 = 0,081874, soit 8,19 points de pourcentage. Soustraire les pourcentages déjà arrondis, 10,32 − 2,14, donnerait 8,18 : l’écart vient uniquement de l’arrondi intermédiaire. La réduction relative brute vaut 0,081874 ÷ 0,103226 = 0,793, soit environ 79 %, et le rapport brut des proportions vaut 0,021352 ÷ 0,103226 ≈ 0,21. Les deux groupes correspondent à des phases d’organisation différentes, sans répartition aléatoire ; ces calculs décrivent une association observée. Ils ne fournissent ni l’incidence suisse de l’AIT ni la probabilité personnelle de la patiente fictive.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-intervalle" data-title="Intervalles de confiance : lecture raisonnée"><p>Un intervalle de confiance exprime la précision d’une estimation sous les hypothèses de la méthode statistique. L’ESO rapporte pour EXPRESS un rapport de risques instantanés ajusté de 0,20, avec intervalle à 95 % de 0,08 à 0,49. Ce rapport compare l’évolution des événements au cours du suivi ; il ne se confond pas avec la simple division des proportions.</p><p>Les bornes 0,08 et 0,49 sont des valeurs du rapport de risques, non des probabilités individuelles : l’intervalle ne signifie pas que 95 % des patients auront un risque compris entre 8 % et 49 %. Il accompagne l’estimation comparative de l’étude. Une valeur favorable et un intervalle étroit ne corrigent pas automatiquement les limites d’un schéma avant/après. Toute lecture rigoureuse nomme l’événement, le temps, les groupes et le type d’estimation avant de commenter le chiffre.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-territoire" data-title="Localisation antérieure et postérieure"><p>Une faiblesse droite associée à une aphasie suggère un réseau hémisphérique gauche dominant, souvent dans la circulation antérieure. Une diplopie avec dysarthrie et ataxie oriente davantage vers des structures du tronc cérébral ou du cervelet. L’association de signes localise mieux qu’un symptôme isolé.</p><p>Le schéma cortical utilise le jaune pour le territoire antérieur, le rouge pour le moyen et le bleu pour le postérieur. Ses limites sont essentielles : la vue latérale ne montre pas tous les territoires profonds, la dominance varie et les anastomoses modifient les conséquences d’une occlusion. Une perte de connaissance isolée ne suffit pas à conclure à une ischémie vertébro-basilaire.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a>.</p></template>
<template data-pop="g45-positif" data-title="Symptômes négatifs et positifs : limites de la distinction"><p>Un symptôme négatif correspond à une fonction manquante, comme la perte visuelle ou la faiblesse. Un symptôme positif ajoute un phénomène, comme des scintillements, des fourmillements ou des secousses. L’ischémie produit souvent un déficit soudain ; l’aura migraineuse peut associer phénomènes positifs, progression graduelle et déficit secondaire.</p><p>Cette distinction est probabiliste. Une aura peut comporter une perte de champ, et une présentation vasculaire peut être inhabituelle. L’ordre d’apparition, la durée de chaque phénomène et la similitude avec les épisodes antérieurs complètent l’interrogatoire. Une manifestation nouvelle ou discordante requiert une réévaluation, même chez une personne migraineuse connue.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-monoculaire" data-title="Monoculaire ou binoculaire : interrogatoire"><p>La question « un œil ou les deux ? » peut être trompeuse : perdre la moitié gauche de la scène dans les deux yeux est parfois décrit comme une perte de l’œil gauche. Si l’épisode est en cours, la comparaison en couvrant successivement chaque œil aide à préciser cette différence. Après récupération, on demande ce qui restait visible et si le patient a réellement testé chaque œil.</p><p>Sur la figure, optic nerve désigne le nerf optique, optic chiasma le chiasma, lateral geniculate nucleus le corps géniculé latéral et primary visual cortex le cortex visuel primaire. Le trajet explique la différence entre atteinte monoculaire avant le chiasma et perte homonyme rétrochiasmatique. Il ne remplace pas l’examen ophtalmologique.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-fond" data-title="Fond d’œil : signes et limites"><p>L’examen ophtalmologique apprécie notamment l’acuité, le champ visuel et le fond d’œil. Dans une occlusion artérielle rétinienne, un embole visible ou un aspect rétinien ischémique peut orienter fortement ; l’absence de ce signe après un épisode bref n’exclut pas une ischémie transitoire.</p><p>Des éclairs, des corps flottants puis un voile font aussi envisager un décollement rétinien. Une baisse de vision avec douleur et désaturation des couleurs évoque d’autres mécanismes, dont une atteinte du nerf optique. Une céphalée récente avec douleur à la mastication fait rechercher une artérite à cellules géantes. La persistance de la perte visuelle justifie une évaluation urgente, sans attendre l’évolution spontanée.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a>.</p></template>
<template data-pop="g45-memoire" data-title="Mémoire et amnésie : bases"><p>La mémoire antérograde permet d’enregistrer de nouvelles informations ; la mémoire rétrograde concerne des informations antérieures à l’événement. Dans l’amnésie globale transitoire typique, l’incapacité à retenir une réponse explique les questions répétées. L’identité personnelle et la vigilance sont conservées.</p><p>Un patient qui ne trouve pas un mot peut présenter une aphasie plutôt qu’un trouble d’enregistrement. Un patient somnolent ne correspond pas au tableau typique de mémoire isolée. Le témoin et l’examen recherchent donc langage, attention, vigilance et autres fonctions. La recommandation conjointe publiée en 2023 décrit la participation des régions temporales médiales, sans établir un mécanisme causal unique pour chaque épisode.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="g45-amnesie-criteres" data-title="Amnésie transitoire : critères différentiels"><p>La recommandation publiée en 2023 décrit un début aigu, une amnésie antérograde marquée, des questions répétées, une identité et une vigilance préservées, l’absence d’autre déficit cognitif majeur ou focal, et une récupération avant 24 heures. Le tableau dure habituellement de 1 à 24 heures ; des épisodes plus courts existent, ce qui interdit d’utiliser une heure comme exclusion mécanique.</p><p>Une fièvre, une somnolence, une céphalée inhabituelle, un déficit focal ou une récupération incomplète exigent la recherche urgente d’une autre cause. Des récidives brèves et fréquentes orientent vers une amnésie épileptique ; un électroencéphalogramme normal ne l’élimine pas. La validité formelle annoncée de cette recommandation s’arrêtait fin 2025 : ces critères restent attribués à cette version.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="g45-imitateurs" data-title="Imitateurs : tableau discriminant"><p>Le tableau compare des éléments d’orientation. Aucun de ces éléments isolés ne dispense du bilan d’un premier déficit suspect.</p><table class="t"><thead><tr><th>Hypothèse</th><th>Éléments utiles</th><th>Limite</th></tr></thead><tbody><tr><td>Ischémie</td><td>Déficit focal soudain et territoire cohérent.</td><td>Une imagerie négative ne l’exclut pas.</td></tr><tr><td>Aura migraineuse</td><td>Progression graduelle, symptômes positifs puis parfois négatifs ; durée visuelle usuelle de 5–60 minutes.</td><td>Une migraine connue ne protège pas de l’ischémie.</td></tr><tr><td>Crise épileptique</td><td>Phénomène bref stéréotypé, secousses ou trouble de contact selon le réseau.</td><td>Un enregistrement intercritique normal n’exclut pas la cause.</td></tr><tr><td>Trouble métabolique</td><td>Glycémie anormale et contexte compatible.</td><td>Une anomalie peut coexister avec une lésion vasculaire.</td></tr></tbody></table><p>La priorité est d’identifier un diagnostic qui change la prise en charge immédiate, puis de vérifier la concordance de l’ensemble.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Visual Phenomena Associated With Migraine and Their Differential Diagnosis (2021), Interrogatoire ; phénomènes monoculaires/binoculaires ; différentiels ophtalmologiques et aura</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-incertaine" data-title="Étiologie incertaine : conduite et réévaluation"><p>Une cause reste incertaine lorsque le bilan n’a pas identifié de mécanisme suffisamment convaincant, ou lorsque plusieurs possibilités coexistent. Ce constat doit être distingué d’un bilan incomplet : une absence de fibrillation au premier tracé n’équivaut pas à une surveillance prolongée négative.</p><p>Le dossier conserve alors le syndrome, les examens réalisés, les questions encore ouvertes et la stratégie de réévaluation. Une plaque incidente n’est pas rendue responsable par défaut, et un anticoagulant n’est pas prescrit à toute suspicion embolique sans indication. La révision du diagnostic devient nécessaire si des symptômes récidivent, si le rythme documente une arythmie ou si une nouvelle donnée contredit la première hypothèse.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-examen" data-title="Examen neurologique focal : technique"><p>Le médecin compare les deux côtés lors du maintien des bras et des jambes, distingue faiblesse et douleur limitante, puis apprécie sensibilité et coordination. Il teste la dénomination, la compréhension et l’articulation séparément : l’aphasie concerne le langage, tandis que la dysarthrie concerne son exécution articulatoire.</p><p>Le champ visuel est évalué œil par œil et par confrontation, en tenant compte de la compréhension et de l’attention. Une extinction à la stimulation simultanée peut traduire un trouble attentionnel. Les signes retrouvés sont datés et comparés à l’état antérieur. Un examen normal après l’épisode n’efface pas un déficit observé auparavant ; la consignation du témoignage complète l’observation clinique.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-temps" data-title="Anamnèse temporelle : exemple commenté"><p>Exemple fictif : une personne est vue normale à 08 h 00, retrouvée avec une faiblesse à 09 h 00, puis normale à 09 h 20. Le début réel est inconnu entre 08 h 00 et 09 h 00 ; la découverte date de 09 h 00. Écrire « début à 09 h 00 » transformerait une découverte en observation.</p><p>Si un témoin voit au contraire le déficit apparaître à 09 h 10 puis disparaître à 09 h 30, la durée observée est 20 minutes. Les deux situations ne possèdent pas la même certitude temporelle. Il faut aussi relever les récidives et les intervalles de récupération, sans additionner des épisodes distincts pour créer artificiellement une durée continue.</p><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (2021), p. 322–324 : identification et urgence ; parcours préhospitaliers</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-score" data-title="Score de risque : variables, calcul, population et limites"><p>Le score ABCD2 additionne cinq domaines, de zéro à sept points. Il s’agit d’un outil pronostique, pas d’un critère diagnostique ni d’une autorisation de sortie.</p><table class="t"><thead><tr><th>Domaine</th><th>Attribution</th></tr></thead><tbody><tr><td>Âge</td><td>Au moins 60 ans : 1 point.</td></tr><tr><td>Pression initiale</td><td>Systolique au moins 140 ou diastolique au moins 90 mmHg : 1 point au total.</td></tr><tr><td>Clinique</td><td>Faiblesse unilatérale : 2 ; sinon trouble de parole sans faiblesse : 1.</td></tr><tr><td>Durée</td><td>Au moins 60 minutes : 2 ; de 10 à 59 minutes : 1 ; moins de 10 : 0.</td></tr><tr><td>Diabète</td><td>Présent : 1 point.</td></tr></tbody></table><p>Les alternatives d’un même domaine ne s’additionnent pas. Un score d’au moins 4 sélectionne certaines populations de bithérapie précoce ; le seuil strictement supérieur à 5 du parcours bernois concerne une branche d’hospitalisation. Leur objectif diffère. Une sténose symptomatique, une lésion ou une arythmie peuvent imposer l’hospitalisation indépendamment du total.</p><p>Le référentiel bernois associe trois strates de risque d'accident vasculaire cérébral à 2 jours : 0 à 3 points, risque faible d'environ 1 % ; 4 à 5 points, risque intermédiaire d'environ 4 % ; 6 à 7 points, risque élevé d'environ 8 %. Ces chiffres décrivent des populations de cohortes et non la probabilité individuelle du patient ; ils montrent surtout qu'un risque « faible » n'est pas nul. La patiente fictive de 5 points appartient ainsi à la strate intermédiaire, sans que ce rang suffise à décider sa sortie.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-orientation" data-title="Orientation : critères et exclusions"><p>Dans le parcours bernois, un score supérieur à 5, une sténose symptomatique, une lésion de diffusion, un déficit de perfusion, une anomalie biologique majeure ou une fibrillation nouvellement découverte constituent des arguments d’admission. La surveillance initiale est d’au moins 24 heures dans la branche hospitalière.</p><p>Une prise en charge ambulatoire structurée suppose l’accès rapide au même bilan pertinent, une stabilité clinique et un suivi réel. L’ESO ne démontre pas la supériorité universelle d’un lieu d’évaluation ; elle insiste sur la rapidité et déconseille l’emploi isolé d’un score. Les critères ne s’appliquent pas comme une liste permettant d’ignorer une nouvelle aggravation, une dissection ou une infection suspectée.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-antithrombotique" data-title="Choix antithrombotique : justification et limites"><p>Pour un accident transitoire non cardioembolique à haut risque, la recommandation européenne de 2021 soutient une double antiagrégation précoce courte chez les patients sélectionnés ; elle n’étend pas cette proposition aux diagnostics incertains ou à faible risque. L’imagerie et le risque de saignement participent à la sélection.</p><p>Dans sa branche sans sténose symptomatique, le protocole bernois 2026 retient trois semaines d’aspirine et de clopidogrel, puis une monothérapie, dans une population à risque et un délai appropriés. Une fibrillation auriculaire peut conduire à une anticoagulation selon son indication propre. Une association prolongée ou triple nécessite une autre justification explicite, telle qu’une situation interventionnelle particulière. Les doses et le statut suisse exact sont développés dans les monographies ; une recommandation ne modifie pas silencieusement l’autorisation d’un produit.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-carotide" data-title="Sténose carotidienne symptomatique : imputabilité, indication, chirurgie ou stent"><h3>Première question : la sténose est-elle responsable ?</h3><p>Le réseau bernois confie toujours ce jugement à un neurologue vasculaire et distingue deux degrés. La sténose est très probablement symptomatique lorsque l'angiographie par tomodensitométrie ou par résonance montre une rupture de plaque avec thrombus apposé. Elle est probablement symptomatique lorsque la carotide interne est rétrécie d'au moins 50 %, que la distribution des lésions en résonance est typique et qu'aucune autre cause n'apparaît après échocardiographie transthoracique ou transœsophagienne et au moins 24 heures d'enregistrement électrocardiographique. La recommandation européenne suggère en outre, sur une preuve de très faible certitude, de confirmer par angiographie en résonance ou en tomodensitométrie une sténose d'au moins 50 % découverte à l'échographie.</p><h3>Deuxième question : faut-il intervenir, et quand ?</h3><p>L'algorithme bernois de prévention secondaire applique ensuite une règle d'indication distincte. Au-delà de 50 % de sténose symptomatique, il prévoit une endartériectomie ou un stent. En dessous de 50 %, il ne discute un geste qu'au cas par cas, lorsque la rupture de plaque est démontrée à l'imagerie. Dans tous les cas, une statine à haute dose est prescrite. Le geste se fait en règle générale dans les quelques jours qui suivent les symptômes ; ce délai court est cohérent avec la recommandation européenne, qui range une sténose homolatérale significative parmi les marqueurs d'un risque précoce élevé. Si un thrombus apposé est visible et que la sténose dépasse 50 %, le protocole prévoit le geste dès que possible, précédé si nécessaire d'une héparinisation thérapeutique transitoire ; en dessous de 50 %, il prévoit héparine et statine, puis une résonance de contrôle après 2 à 3 jours.</p><p>La recommandation européenne de 2021 sur l'endartériectomie et le stent carotidien précise ces seuils. Elle recommande l'endartériectomie pour une sténose symptomatique de 70 à 99 % et la suggère pour une sténose de 50 à 69 %. Sur une preuve de certitude élevée, elle recommande un geste précoce, idéalement dans les deux semaines qui suivent le dernier événement rétinien ou cérébral. La pose d'un stent peut être envisagée, sur une preuve de faible certitude, avant 70 ans pour une sténose symptomatique de 50 à 99 %. Le délai bernois de « quelques jours » s'inscrit donc dans cette fenêtre européenne.</p><h3>Troisième question : chirurgie ou stent ?</h3><p>La décision revient à un colloque interdisciplinaire. Trois éléments se pèsent individuellement pour les deux techniques : le risque interventionnel attendu, l'accès technique et la préférence du patient. Les autres éléments orientent plus nettement, comme le montre le tableau bernois.</p><table class="t"><thead><tr><th>Situation</th><th>Orientation du protocole bernois</th></tr></thead><tbody><tr><td>Mauvaise observance médicamenteuse</td><td>En faveur de l'endartériectomie</td></tr><tr><td>État prothrombotique</td><td>En faveur de l'endartériectomie</td></tr><tr><td>Tendance hémorragique ou saignement antérieur sous antiagrégant</td><td>En faveur de l'endartériectomie</td></tr><tr><td>Thrombus apposé avec portion flottante</td><td>Endartériectomie de préférence ; stent possible en alternative</td></tr><tr><td>Insuffisance rénale sévère</td><td>En faveur de l'endartériectomie</td></tr><tr><td>Anticoagulation dont l'interruption comporte un faible risque</td><td>En faveur de l'endartériectomie</td></tr><tr><td>Resténose après endartériectomie ou stent</td><td>Indication absolue du stent</td></tr><tr><td>Sténose post-radique</td><td>Indication absolue du stent</td></tr><tr><td>Paralysie récurrentielle controlatérale</td><td>Indication absolue du stent</td></tr><tr><td>Occlusion de la carotide controlatérale</td><td>Stent de préférence ; endartériectomie également possible</td></tr><tr><td>Anticoagulation à très haut risque si elle est interrompue</td><td>Stent ; endartériectomie possible si ce risque n'est pas extrême</td></tr><tr><td>Valve cardiaque mécanique</td><td>En faveur du stent</td></tr></tbody></table><p>La lecture commence par les trois indications absolues du stent, puis par ce qui rend une double antiagrégation prolongée difficile : le même protocole prescrit après un stent électif une double antiagrégation d'au moins six mois, ce qui explique que la mauvaise observance et le risque hémorragique orientent vers la chirurgie. Les situations où l'anticoagulation ne peut pas être interrompue orientent, à l'inverse, vers le stent.</p><h3>Risques à expliquer</h3><p>Après endartériectomie comme après stent, le protocole décrit un syndrome d'hyperperfusion : céphalées, crises, déficits et risque d'hémorragie intracérébrale, typiquement entre 12 heures et 7 jours, au maximum 28 jours après le geste. Ses facteurs de risque sont une sténose serrée ou bilatérale, une hypertension périopératoire, une réserve réduite, un diabète, le sexe féminin et un âge supérieur à 75 ans ; c'est pourquoi la pression est en général maintenue au-dessous de 140/100 mmHg après le geste. Enfin, une sténose asymptomatique ne suit pas cette règle : le même référentiel n'envisage le traitement d'une sténose supérieure à 60 % découverte avec des lésions silencieuses qu'après pesée du rapport bénéfice-risque.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), page PDF 13 : « (A)symptomatic artery stenosis », « Arguments for and against » ; page PDF 18 : algorithme « Secondary prevention » ; page PDF 19 : « Covert cerebrovascular disease »</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), résumé relu le 14.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34414302/" target="_blank" rel="noopener" data-reference-source="1">Bonati et coll. — European Stroke Organisation guideline on endarterectomy and stenting for carotid artery stenosis, European Stroke Journal 2021;6(2):I–XLVII, résumé</a>.</p></template>
<template data-pop="g45-suivi" data-title="Suivi : calendrier justifié"><p>Le réseau bernois propose un contact téléphonique à 10–14 jours, une consultation à trois mois avec réévaluation et imagerie selon son parcours, puis un contrôle du risque à douze mois. Ces rendez-vous ne constituent pas un délai autorisé devant une récidive : un nouveau déficit déclenche immédiatement la filière d’urgence.</p><p>Le suivi vérifie le mécanisme finalement retenu, les résultats différés du rythme, la durée prévue de chaque médicament et ses effets indésirables. Il réévalue pression, lipides, tabagisme, activité et difficultés fonctionnelles. La conduite automobile requiert une appréciation individualisée ; les délais du tableau bernois sont présentés comme recommandations non contraignantes et ne sont pas une autorisation administrative.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-exceptions" data-title="Grossesse et comorbidités : exceptions"><p>La grossesse peut changer les examens et les traitements, sans diminuer l’urgence d’un déficit neurologique. La vérification porte sur la question clinique, la modalité d’imagerie et la fiche du produit effectivement envisagé. Les doses d’un adulte standard ne sont pas automatiquement adaptées à l’enfant.</p><p>Chez une personne âgée, il faut mesurer le poids et vérifier les organes d’élimination au lieu de diminuer toutes les doses par principe. Les seuils d’Eliquis sont propres à la prévention embolique de la fibrillation auriculaire non valvulaire ; ceux d’Aspirine Cardio ou de Sortis répondent à d’autres risques. La polymédication appelle une revue des interactions et une explication de ce qui doit conduire à consulter.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio — Bayer, autorisation 51795 (Mars 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix — Sanofi, autorisation 54509 (Septembre 2022), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis — Bristol-Myers Squibb, autorisation 61549 (Août 2026), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis — Viatris, autorisation 54085 (Avril 2025), Indications ; Posologie/Mode d’emploi ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Effets indésirables ; Propriétés/Effets</a>.</p></template>
<template data-pop="g45-criteres" data-title="Critères formels : texte applicable"><p>Le diagnostic repose sur un syndrome focal transitoire compatible et l’exclusion raisonnée des autres causes. La version bernoise 2026 précise l’absence de lésion correspondante en diffusion pour l’AIT tissulaire. La version européenne 2021 utilise une définition clinique de moins de 24 heures pour ses recommandations ; il faut nommer ce cadre lorsqu’on applique ses résultats.</p><p>Les critères d’amnésie globale transitoire forment un autre ensemble : mémoire principalement atteinte, identité et vigilance préservées, absence d’autre déficit focal et récupération complète. Un score ABCD2 n’établit aucun de ces diagnostics. Il mesure certains facteurs de risque après une suspicion d’épisode ischémique et ne couvre pas toutes les causes dangereuses.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="g45-synthese" data-title="Pareto du raisonnement neurologique"><p>Le raisonnement commence par une description datée de la fonction perdue. Il recherche ensuite une concordance anatomique et les signes imposant l’urgence, puis utilise l’imagerie et le bilan causal pour préciser le mécanisme. La prévention découle de ce mécanisme et du risque, avec vérification du produit suisse.</p><p>Dans la vignette initiale, une faiblesse droite et une aphasie observées pendant vingt minutes restent préoccupantes après récupération. Une diffusion négative ne met pas fin à l’évaluation ; une fibrillation découverte peut changer la stratégie ; une plainte amnésique isolée typique appelle un autre raisonnement. Une synthèse utile conserve ces distinctions au lieu de remplacer le diagnostic par un score ou par un seul examen.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a>.</p></template>
<template data-pop="g45-diffusion" data-title="Diffusion : principe et limites"><p>La diffusion en résonance magnétique renseigne sur le mouvement de l’eau dans les tissus. Une lésion aiguë peut apparaître brillante sur la séquence de diffusion et sombre sur la carte du coefficient apparent de diffusion. La concordance des deux évite de confondre une restriction avec d’autres causes d’hypersignal.</p><p>Dans la synthèse ESO, la proportion de diffusion positive parmi les AIT cliniquement probables est de 34,3 %, avec intervalle à 95 % de 30,5–38,4 %, dans des études fortement hétérogènes. Ce chiffre ne représente pas une sensibilité universelle. Une petite lésion, un territoire postérieur, le délai et la technique influencent la détection. En amnésie globale typique, les petits foyers hippocampiques sont davantage détectés à 24–72 heures, sans que ce délai autorise à différer une imagerie urgente devant une présentation atypique.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, sociétés allemande, autrichienne et suisse (Publication 2023 ; mise à jour octobre 2022 ; validité annoncée jusqu’au 31 décembre 2025), Recommandations principales ; diagnostic et différentiels ; IRM/EEG ; pronostic et traitement</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-vasculaire" data-title="Imagerie vasculaire : lecture et pièges"><p>L’angiographie par résonance magnétique et l’angiographie tomodensitométrique décrivent les artères et recherchent occlusion, sténose ou signes de dissection. L’échographie fournit d’autres informations, dont les vitesses, mais dépend de l’accès au vaisseau et de l’opérateur. La question clinique détermine la combinaison utile.</p><p>Une sténose doit être décrite avec son siège, son degré et la méthode utilisée. L’ESO suggère, sur une preuve de très faible certitude, une confirmation par angiographie en résonance ou en tomodensitométrie lorsqu’une échographie identifie une sténose d’au moins 50 % dans une situation où le résultat change la prise en charge. La présence d’une anomalie ne prouve pas son imputabilité : le territoire des symptômes et celui de la lésion doivent concorder.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-rythme" data-title="Surveillance du rythme : population et durée"><p>Un électrocardiogramme court peut montrer une fibrillation présente au moment du tracé. Il peut manquer une arythmie intermittente. Le bilan bernois standard mentionne au moins 72 heures d’enregistrement dans son parcours, tandis que le schéma spécifique de l’accident transitoire organise notamment trois périodes de sept jours de Holter.</p><p>Ces durées ne sont pas deux prescriptions à additionner automatiquement pour tout patient. Elles décrivent des modalités du réseau selon l’étape et le bilan déjà réalisé. Le spécialiste précise le dispositif, l’objectif, la durée et qui interprétera le résultat. Un enregistrement négatif réduit certaines possibilités observables pendant cette période ; il n’établit pas à lui seul l’absence définitive de fibrillation.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-performance" data-title="Performance diagnostique : sensibilité et spécificité"><p>La sensibilité est la proportion de résultats positifs parmi les personnes effectivement atteintes dans l’étude. La spécificité est la proportion de résultats négatifs parmi les personnes non atteintes. Ces deux fractions nécessitent une définition de référence de la maladie et une population étudiée ; elles ne sont pas les probabilités finales d’un patient particulier.</p><p>La valeur prédictive d’un résultat dépend aussi de la fréquence de la maladie dans la population examinée et du contexte clinique. L’ESO explique qu’un diagnostic d’AIT sans étalon parfait rend certaines évaluations délicates. Le pourcentage de lésions visibles parmi les cas cliniques ne doit donc pas être présenté comme une « sensibilité » sans vérifier la méthode. Aucun chiffre universel n’est attribué ici au premier tracé cardiaque ou à toute IRM.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-negatif" data-title="Résultat négatif : limites"><p>Un résultat négatif répond à une question limitée. Une tomodensitométrie sans hémorragie visible ne démontre pas que tout symptôme était ischémique ; une diffusion sans lésion ne démontre pas que tout symptôme était bénin. Un tracé sans fibrillation documente le rythme enregistré pendant cette durée.</p><p>Le raisonnement consiste à préciser quelle hypothèse le résultat affaiblit, laquelle il ne teste pas et si un complément est justifié. La cohérence entre récit, territoire et délai reste déterminante. L’incertitude résiduelle doit être visible dans la conclusion, notamment lorsque l’examen est très précoce, le phénomène intermittent ou la lésion attendue petite.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-calcul-score" data-title="Calcul d’un score : exemple intégral"><p>Exemple fictif complet : une personne de 68 ans a une pression initiale de 152/86 mmHg, une faiblesse unilatérale avec aphasie pendant 20 minutes, sans diabète connu. Les variables sont relevées avant le calcul.</p><p>L’âge apporte 1 point. La systolique franchit 140 mmHg : la pression apporte 1 point malgré une diastolique inférieure à 90. La faiblesse apporte 2 points ; l’aphasie n’ajoute pas un troisième point dans le même domaine. La durée de 20 minutes apporte 1 point. L’absence de diabète apporte 0. Ainsi, 1 + 1 + 2 + 1 + 0 = 5 points sur 7.</p><p>Le résultat franchit 4, seuil de certaines populations thérapeutiques étudiées, mais n’est pas supérieur à 5. Il ne suffit pourtant pas pour autoriser une sortie : l’imagerie, les artères, le rythme et les conditions de suivi restent nécessaires. Une valeur inconnue n’est pas remplacée silencieusement par zéro.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — European Stroke Organisation guidelines on management of transient ischaemic attack (2021), Résumé, tableau 1, définition ; PICO 1–7, 8.2 et 9 ; EXPRESS, diffusion et double antiagrégation</a>.</p></template>
<template data-pop="g45-polygone" data-title="Polygone artériel et variantes"><p>Une anastomose relie des voies artérielles. Sur le polygone publié en français, les communicantes antérieure et postérieures relient des segments des circulations carotidienne et vertébro-basilaire. Les symboles <a href="https://commons.wikimedia.org/wiki/File:Circle_of_Willis_fr.svg" target="_blank" rel="noopener" data-reference-source="1">A1/A2</a> et <a href="https://commons.wikimedia.org/wiki/File:Circle_of_Willis_fr.svg" target="_blank" rel="noopener" data-reference-source="1">P1/P2</a> du dessin identifient des segments des artères cérébrales antérieures et postérieures.</p><p>Une connexion visible sur le dessin ne garantit pas une suppléance suffisante chez le patient. Son calibre, les variantes, la pression et les autres artères influencent le débit disponible. Le rôle clinique de l’anatomie est donc de formuler une hypothèse de territoire et de suppléance, que les examens du patient viennent préciser. Le schéma n’est pas une angiographie individuelle.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a>.</p></template>
<template data-pop="g45-paroi" data-title="Paroi artérielle : normal et lésion"><p>La couche interne, ou intima, comprend l’endothélium et son support. La couche moyenne, ou média, comporte notamment des cellules musculaires lisses et des éléments élastiques. Le tissu externe, ou adventice, soutient le vaisseau. Leur composition varie avec la taille et le type de vaisseau.</p><p>Dans le dessin publié de plaque, normal artery signifie artère normale, artery wall paroi artérielle et narrowed artery artère rétrécie. L’athérosclérose y réduit la lumière ; une plaque compliquée peut aussi produire un embole. Le dessin enseigne cette relation anatomique sans mesurer une sténose et sans se présenter comme une coupe histologique. Les fonctions endothéliales et musculaires nécessitent une explication physiologique distincte.</p><p class="src">Sources : <a href="https://histology.leeds.ac.uk/home/circulatory/circ_common_str/" target="_blank" rel="noopener" data-reference-source="1">University of Leeds — The Histology Guide, Common structure (Page non datée, consultée le 13 octobre 2026), Tunica intima, media et adventitia</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-perfusion" data-title="Perfusion cérébrale : grandeurs, unités et calcul pas à pas"><h3>Ce que représente chaque grandeur</h3><p>Le débit sanguin cérébral est le volume de sang qui traverse le tissu par unité de temps. Rapporté à la masse de tissu, il s'exprime en mL/100 g/min, unité de l'axe vertical de la figure d'autorégulation. La pression de perfusion est une différence de pression entre l'entrée artérielle et la sortie du lit vasculaire ; elle s'exprime en mmHg. La résistance cérébrovasculaire résume, dans un modèle, l'opposition du réseau à l'écoulement ; elle dépend surtout du calibre des petites artères, que les cellules musculaires lisses font varier.</p><h3>Formule et unités</h3><p>La revue de Maier et collègues (2026) rappelle que le débit cérébral varie dans le même sens que la pression de perfusion et en sens inverse de la résistance cérébrovasculaire. Le modèle s'écrit donc : débit = pression de perfusion ÷ résistance. On en déduit que résistance = pression de perfusion ÷ débit. Si la pression est en mmHg et le débit en mL/100 g/min, la résistance s'exprime en mmHg par (mL/100 g/min). Cette unité composée n'a pas de nom propre ; elle garantit seulement la cohérence des calculs.</p><h3>Exemple fictif refaisable</h3><p>Les valeurs suivantes sont fictives et choisies pour la simplicité du calcul. Elles ne décrivent aucun patient, aucune norme et aucune cible.</p><table class="t"><thead><tr><th>Étape</th><th>Pression de perfusion (mmHg)</th><th>Résistance (mmHg par mL/100 g/min)</th><th>Débit calculé (mL/100 g/min)</th></tr></thead><tbody><tr><td>Situation de départ</td><td>80</td><td>2</td><td>80 ÷ 2 = 40</td></tr><tr><td>La résistance double, par rétrécissement non compensé</td><td>80</td><td>4</td><td>80 ÷ 4 = 20</td></tr><tr><td>La pression baisse d'un quart, résistance inchangée</td><td>60</td><td>2</td><td>60 ÷ 2 = 30</td></tr><tr><td>Vasodilatation compensatrice : la résistance passe à 1,5</td><td>60</td><td>1,5</td><td>60 ÷ 1,5 = 40</td></tr></tbody></table><p>La lecture se fait ligne par ligne. À pression constante, doubler la résistance divise le débit par deux. Une baisse de pression réduit aussi le débit, sauf si la résistance diminue dans la même proportion : c'est le principe de la compensation par vasodilatation que décrit l'autorégulation. Quand cette réserve est épuisée, toute baisse supplémentaire de pression ou toute obstruction réduit le débit, puis la fonction neuronale ; si le débit se rétablit à temps, le déficit peut régresser.</p><h3>Limites</h3><p>Au lit du patient, ni la résistance ni la pression de perfusion locale ne se mesurent directement. Les études physiologiques les estiment : Kho et collègues (2025) calculent par exemple une résistance relative en divisant la pression artérielle moyenne par la vitesse du flux mesurée au Doppler transcrânien, puis la rapportent à la valeur propre à chaque patient. Une pression brachiale isolée ne se convertit donc pas en débit cérébral individuel. Ce modèle explique pourquoi un rétrécissement ou une chute de pression peuvent produire un déficit transitoire ; il ne fixe ni seuil diagnostique de l'AIT ni cible tensionnelle.</p><p class="src">Sources : <a href="https://doi.org/10.1177/0271678X261447779" target="_blank" rel="noopener" data-reference-source="1">Maier et coll. — The role of sex as a biological variable in neurocritical care: Fundamentals of cerebrovascular physiology with clinical implications, Journal of Cerebral Blood Flow and Metabolism (13.05.2026, licence CC BY 4.0), section « cerebrovascular physiology »</a> ; <a href="https://doi.org/10.1016/j.bja.2024.12.037" target="_blank" rel="noopener" data-reference-source="1">Kho et coll. — Regulation of cerebrovascular resistance below the lower limit of cerebral autoregulation, British Journal of Anaesthesia (2025, licence CC BY 4.0), Méthodes</a>.</p></template>
<template data-pop="g45-autoregulation" data-title="Autorégulation : modèle et limites"><p>L’autorégulation décrit les réponses qui limitent certaines variations de débit lorsque la pression change. La réponse dépend notamment de la vitesse du changement, du tonus musculaire, de l’endothélium et d’autres régulateurs. Les gaz sanguins et l’activité neuronale interviennent simultanément.</p><p>La figure historique montre une région où le débit varie relativement peu malgré des pressions différentes. Les valeurs des axes ne sont pas des seuils validés pour chaque personne et ne deviennent pas des cibles de pression pendant une ischémie. La revue de 2021 discute précisément les limites du plateau classique. Elle ne justifie pas de renoncer systématiquement au traitement d’une hypertension chronique au motif d’une autorégulation supposée décalée.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8576366/" target="_blank" rel="noopener" data-reference-source="1">Claassen et coll. — Regulation of cerebral blood flow in humans: physiology and clinical implications of autoregulation (2021), Introduction et 1.3 ; régulation pression/débit, muscle vasculaire, endothélium ; limites des plateaux historiques</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (08/2026), p. 19–25, 34–35, 38–41, 50–53, 62–63</a>.</p></template>
<template data-pop="g45-sm-faiblesse" data-title="Faiblesse unilatérale : technique, mécanisme et valeur"><p><b>Définition.</b> Il s’agit d’une perte de force d’un côté du corps, touchant la face, le bras ou la jambe. Les directives suisses préhospitalières la placent en tête des déficits neurologiques aigus à rechercher.</p><p><b>Technique.</b> Le patient tend les bras à 45° s’il est couché, sinon à 90°, pendant 10 secondes ; il lève chaque jambe à 30° en décubitus pendant 5 secondes. Le normal est l’absence de chute après un fléchissement initial.</p><p><b>Mécanisme.</b> Privé d’énergie, le réseau moteur cesse de fonctionner d’emblée : le symptôme est négatif et brutal.</p><p><b>Valeur.</b> Dans la cohorte des urgences de Bâle, la parésie unilatérale rendait un imitateur moins probable (rapport de cotes 0,35 ; intervalle de confiance à 95 % 0,17–0,68). Le référentiel bernois considère un symptôme moteur comme d’abord ischémique. Une faiblesse de plus de cinq minutes définit un AIT à haut risque selon la recommandation européenne.</p><p><b>Piège.</b> Un membre paralysé ne permet pas de coter l’ataxie. Après récupération, une épreuve normale ne renseigne pas sur l’épisode.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), pages PDF 3, 10 et 32</a> ; <a href="https://doi.org/10.1159/000327034" target="_blank" rel="noopener" data-reference-source="1">Amort et coll. — Cerebrovasc Dis 2011;32:57–64, résumé</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — ESO guidelines on management of TIA, Eur Stroke J 2021, résumé</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Forum Médical Suisse 2021, tableau 1</a>.</p></template>
<template data-pop="g45-sm-parole" data-title="Trouble de la parole : aphasie ou dysarthrie"><p><b>Définition.</b> L’aphasie touche le langage : fluence ou compréhension. La dysarthrie touche l’articulation : le patient se fait comprendre difficilement, sans trouble du langage proportionné. L’échelle NIHSS cote les deux séparément.</p><p><b>Technique.</b> Le médecin évalue la fluence, la compréhension et l’exécution de deux ordres, puis l’articulation. Il reformule la plainte « je parlais mal » en question précise : trouver les mots, les comprendre ou les prononcer ?</p><p><b>Valeur.</b> Le score ABCD2 attribue 1 point à un trouble de la parole sans faiblesse. Dans la cohorte bâloise, l’aphasie et la dysarthrie n’amélioraient plus la distinction avec les imitateurs une fois la parésie, l’amnésie, la céphalée et la vision floue prises en compte. Un trouble de la parole de plus de cinq minutes définit un AIT à haut risque selon la recommandation européenne.</p><p><b>Piège.</b> Un trouble du langage isolé, sans précision, ne localise pas l’atteinte.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), pages PDF 10 et 32</a> ; <a href="https://doi.org/10.1159/000327034" target="_blank" rel="noopener" data-reference-source="1">Amort et coll. — Cerebrovasc Dis 2011, résumé</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370080/" target="_blank" rel="noopener" data-reference-source="1">Fonseca et coll. — Eur Stroke J 2021, résumé</a>.</p></template>
<template data-pop="g45-sm-sensitif" data-title="Trouble sensitif : négatif ou positif"><p><b>Définition.</b> Un trouble sensitif négatif est une perte de perception ; un trouble positif ajoute une sensation, comme des fourmillements ou des piqûres.</p><p><b>Mécanisme.</b> La panne énergétique supprime une fonction ; l’aura, phénomène qui se propage sur le cortex, ajoute des sensations qui s’étendent.</p><p><b>Valeur.</b> Le référentiel bernois classe un trouble purement négatif comme plutôt ischémique, et un trouble positif entre ischémie et aura. Dans la cohorte bâloise, la perte sensitive n’apportait pas de discrimination supplémentaire.</p><p><b>Piège.</b> Les critères repris par Eren et coll. citent les fourmillements et les piqûres parmi les symptômes irritatifs de l’aura ; un symptôme positif n’exclut pourtant pas l’ischémie.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), page PDF 10</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Dtsch Arztebl Int 2021, tableau 2</a> ; <a href="https://doi.org/10.1159/000327034" target="_blank" rel="noopener" data-reference-source="1">Amort et coll. — Cerebrovasc Dis 2011, résumé</a>.</p></template>
<template data-pop="g45-sm-vision" data-title="Perte visuelle : un œil ou une moitié du champ"><p><b>Technique.</b> Si le trouble est encore présent, chaque œil est couvert à tour de rôle. S’il persiste quel que soit l’œil couvert, il est binoculaire ; s’il disparaît quand l’œil atteint est fermé, il est monoculaire. Après récupération, le récit garde cette incertitude.</p><p><b>Mécanisme et orientation.</b> Un trouble monoculaire désigne d’abord l’œil ou le nerf optique. L’aura visuelle est binoculaire, même si le patient ne s’en rend souvent pas compte.</p><p><b>Valeur.</b> Les sources lues ne chiffrent pas la valeur de ces signes dans l’AIT. Devant une perte monoculaire aiguë, le référentiel bernois recherche une acuité souvent très basse, un déficit pupillaire afférent relatif, un embole ou une tache rouge cerise au fond d’œil.</p><p><b>Piège.</b> « Je ne voyais plus à gauche » peut désigner l’œil gauche ou la moitié gauche du champ des deux yeux.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Dtsch Arztebl Int 2021, phénomènes monoculaires et binoculaires</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), page PDF 27</a>.</p></template>
<template data-pop="g45-sm-vertige" data-title="Vertige et vision double : isolés ou associés"><p><b>Ce que disent les sources.</b> Les directives suisses préhospitalières comptent le vertige aigu prononcé avec incapacité à la marche et la vision double parmi les déficits neurologiques aigus qui déclenchent la filière de l’AVC.</p><p><b>Valeur.</b> Les critères repris par Eren et coll. ne retiennent un AIT comme très probable que si la vision double, le vertige, la syncope, l’amnésie ou un trouble de conscience ne surviennent pas de façon isolée.</p><p><b>Piège.</b> Un symptôme isolé n’exclut pas l’ischémie ; il réduit seulement la certitude. L’association avec d’autres signes et l’installation brutale orientent l’examen.</p><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Forum Médical Suisse 2021, p. 323 et tableau 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Dtsch Arztebl Int 2021, tableau 2</a>.</p></template>
<template data-pop="g45-sm-amnesie" data-title="Amnésie : questions répétées"><p><b>Définition.</b> L’amnésie globale transitoire associe une amnésie antérograde et rétrograde d’installation brutale, d’une à 24 heures, en moyenne 6 à 8 heures. Le patient pose des questions répétées, reste coopérant et sait nommer les objets.</p><p><b>Critères.</b> Durée d’au moins une heure et régression en 24 heures ; pas de déficit focal ni d’autre trouble cognitif ; pas de trouble de conscience ni de désorientation sur sa propre personne ; pas de traumatisme ni d’épilepsie connue.</p><p><b>Valeur.</b> Dans la cohorte bâloise, la perte de mémoire rendait un imitateur plus probable (rapport de cotes 9,17 ; 2,89–32,50).</p><p><b>Piège.</b> Une amnésie avec déficit focal, somnolence, fièvre ou vomissements sort du tableau typique ; la recommandation de 2023 impose alors d’exclure un infarctus par IRM. Une amnésie uniquement rétrograde ou des épisodes de plus de trois par an parlent aussi contre le diagnostic.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, Neurol Res Pract 2023, résumé, diagnostic et diagnostic différentiel</a> ; <a href="https://doi.org/10.1159/000327034" target="_blank" rel="noopener" data-reference-source="1">Amort et coll. — Cerebrovasc Dis 2011, résumé</a>.</p></template>
<template data-pop="g45-sm-cephalee" data-title="Céphalée et cervicalgie : deux sens opposés"><p><b>Premier sens.</b> Une céphalée qui accompagne les symptômes ou survient dans l’heure fait partie des éléments qui éloignent de l’AIT dans les critères repris par Eren et coll. Dans la cohorte bâloise, la céphalée rendait un imitateur plus probable (rapport de cotes 3,71 ; 1,07–12,78).</p><p><b>Second sens.</b> Une douleur de la tête, du cou, de la gorge ou de l’œil fait au contraire rechercher une dissection carotidienne ou vertébrale ; le référentiel bernois en fait un signe d’orientation immédiate. Selon la recommandation européenne, ces symptômes locaux proviennent en partie de la compression des structures voisines et précèdent souvent l’ischémie de quelques heures ou jours.</p><p><b>Piège.</b> Une céphalée n’autorise donc pas à conclure à une migraine : sa localisation et le contexte décident.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Dtsch Arztebl Int 2021, tableau 2</a> ; <a href="https://doi.org/10.1159/000327034" target="_blank" rel="noopener" data-reference-source="1">Amort et coll. — Cerebrovasc Dis 2011, résumé</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), pages PDF 10 et 11</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8564160/" target="_blank" rel="noopener" data-reference-source="1">Debette et coll. — Eur Stroke J 2021, introduction</a>.</p></template>
<template data-pop="g45-sm-marche" data-title="Marche des symptômes : installation brutale ou progressive"><p><b>Questions.</b> Le médecin demande comment chaque symptôme a commencé, s’ils sont apparus ensemble ou l’un après l’autre, et combien de temps chacun a duré.</p><p><b>Ischémie.</b> Les critères repris par Eren et coll. décrivent au moins un symptôme installé en moins d’une minute, sans extension progressive, et plusieurs symptômes simultanés.</p><p><b>Aura.</b> Un scotome paracentral ou des figures en zigzag gagnent la périphérie du champ ; chaque modalité dure en général de 5 à 60 minutes, et moins d’une heure dans les auras complexes.</p><p><b>Valeur.</b> Réunis avec les autres critères, ces éléments distinguent l’AIT de l’aura avec une sensibilité de 99 % et une spécificité de 95 % selon l’étude de 2018 citée par Eren et coll. ; la population de cette étude n’a pas été vérifiée.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Dtsch Arztebl Int 2021, aura migraineuse, section « Transient ischemic attack » et tableau 2</a>.</p></template>
<template data-pop="g45-sm-bras" data-title="Épreuve des bras tendus : technique et cotation"><p><b>Technique.</b> Le patient tend les bras à 45° s’il est couché, sinon à 90°, et les maintient 10 secondes. Pour les jambes, il les lève à 30° en décubitus pendant 5 secondes.</p><p><b>Normal.</b> Aucune chute pendant toute la durée, après un fléchissement initial possible.</p><p><b>Pathologique.</b> L’échelle NIHSS cote de 1 à 4 une chute vers une position intermédiaire, un effort contre la pesanteur insuffisant, l’absence d’effort contre la pesanteur, puis l’absence de mouvement.</p><p><b>Piège.</b> Un fléchissement initial isolé n’est pas un déficit ; la comparaison des deux côtés reste indispensable.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), page PDF 3 (score préhospitalier) et page PDF 32 (NIHSS)</a>.</p></template>
<template data-pop="g45-sm-pupille" data-title="Déficit pupillaire afférent relatif : rétine et nerf optique"><p><b>Contexte.</b> Le référentiel bernois recherche ce signe dans l’œil atteint devant une perte visuelle monoculaire aiguë suspecte d’occlusion d’une artère de la rétine, avec l’acuité, la périmétrie au doigt et le fond d’œil en myosis.</p><p><b>Lecture.</b> Le référentiel le range parmi les constatations de l’œil atteint. Il complète l’interrogatoire œil par œil, puisqu’un trouble monoculaire désigne d’abord l’œil ou le nerf optique selon Eren et coll.</p><p><b>Valeur.</b> Les sources lues ne chiffrent pas sa performance dans l’ischémie rétinienne.</p><p><b>Piège.</b> L’ophtalmologiste doit aussi exclure un décollement de rétine ou une hémorragie du vitré ; le référentiel bernois l’exige quand le patient arrive directement aux urgences.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), page PDF 27</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8762590/" target="_blank" rel="noopener" data-reference-source="1">Eren et coll. — Dtsch Arztebl Int 2021, phénomènes monoculaires</a>.</p></template>
<template data-pop="g45-sm-horner" data-title="Syndrome de Claude Bernard-Horner : indice de dissection"><p><b>Contexte.</b> Le référentiel bernois range ce syndrome, avec la douleur de la gorge, du cou ou de l’œil, un traumatisme et un acouphène, parmi les indices d’une dissection carotidienne ou vertébrale. Il en fait un signe d’alarme qui impose une orientation immédiate.</p><p><b>Mécanisme.</b> Selon la recommandation européenne, les symptômes locaux d’une dissection proviennent en partie de la compression des structures voisines. L’ischémie survient souvent quelques heures ou jours plus tard.</p><p><b>Limite.</b> Les sources lues ne détaillent ni les composantes du syndrome ni sa fréquence ; elles restent à documenter dans une source d’ophtalmologie ou de neurologie.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), pages PDF 10 et 11</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8564160/" target="_blank" rel="noopener" data-reference-source="1">Debette et coll. — Eur Stroke J 2021, introduction</a>.</p></template>
<template data-pop="g45-sm-temporale" data-title="Artère temporale : signes d’artérite à cellules géantes"><p><b>Signes.</b> Le référentiel bernois cite une douleur à la mastication ou au peignage, une artère temporale superficielle douloureuse, indurée ou sans pouls, et des signes généraux. L’artérite concerne les personnes de plus de 50 ans.</p><p><b>Conséquence.</b> Devant une occlusion d’une artère de la rétine, la suspicion d’artérite exclut la thrombolyse et oriente vers un traitement corticoïde immédiat si la vitesse de sédimentation est élevée ; l’échographie des artères temporales et, si nécessaire, une biopsie complètent le bilan.</p><p><b>Piège.</b> L’artérite ne se reconnaît pas sur le déficit visuel seul ; il faut la rechercher par l’interrogatoire et la palpation.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), pages PDF 14 et 27</a>.</p></template>
<template data-pop="g45-sm-souffle" data-title="Souffle cardiaque et lésions cutanées : chercher la source"><p><b>Signes.</b> Le référentiel bernois relie un souffle cardiaque et des lésions cutanées ou rétiniennes à une endocardite ou à une calcification valvulaire. Il cite aussi des lésions cutanées d’emboles septiques, des angiokératomes de la maladie de Fabry et un livedo racemosa du syndrome de Sneddon.</p><p><b>Conséquence.</b> Une fièvre impose une orientation immédiate. En cas d’endocardite infectieuse, le référentiel bernois n’administre ni antiplaquettaire, ni héparine, ni anticoagulant oral.</p><p><b>Limite.</b> Les sources lues ne chiffrent pas la valeur de ces signes.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (PDF du 10.08.2026), pages PDF 10, 11 et 18</a>.</p></template>
<template data-pop="g45-sm-cotes" data-title="Rapport de cotes : lecture"><p><b>Définition.</b> Le rapport de cotes compare la cote d’un événement, ici le diagnostic final d’imitateur, entre les patients qui présentent un symptôme et ceux qui ne le présentent pas.</p><p><b>Lecture.</b> Une valeur inférieure à 1 signifie que l’imitateur est moins fréquent avec le symptôme ; une valeur supérieure à 1 qu’il est plus fréquent. Si l’intervalle de confiance à 95 % contient 1, comme pour la vision floue (0,90–6,59), l’étude ne démontre pas d’association.</p><p><b>Limite.</b> Le rapport de cotes décrit la cohorte des urgences de Bâle ; il ne donne pas directement la probabilité qu’un patient donné ait un AIT.</p><p class="src">Sources : <a href="https://doi.org/10.1159/000327034" target="_blank" rel="noopener" data-reference-source="1">Amort et coll. — Cerebrovasc Dis 2011;32:57–64, résumé</a>.</p></template>
<template data-pop="g45-sm-trois-mots" data-title="Épreuve des trois mots : objectiver l’amnésie"><p><b>Technique.</b> La recommandation de 2023 cite l’épreuve des trois mots ou une liste de mots pour objectiver une perte sélective de la mémoire, avec l’exploration de la mémoire rétrograde.</p><p><b>Normal.</b> Le sujet restitue les mots appris.</p><p><b>Interprétation.</b> Pendant une amnésie globale transitoire, le patient reste coopérant et sait nommer les objets, mais ne retient pas l’information nouvelle et répète ses questions. S’il décrit avec précision le déroulement de l’épisode, le diagnostic devient peu probable.</p><p><b>Limite.</b> Les sources lues ne précisent ni la liste de mots ni le délai de rappel.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10116751/" target="_blank" rel="noopener" data-reference-source="1">Sander et coll. — Guideline Transient Global Amnesia, Neurol Res Pract 2023, conseils pratiques du diagnostic</a>.</p></template>
