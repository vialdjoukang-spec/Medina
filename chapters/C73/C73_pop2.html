<template data-pop="pareto-c73-1" data-title="Essentiel — Une masse du cou, plusieurs maladies possibles"><p>Une <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyréostimuline</a> normale n’exclut pas un cancer. Identifier le lignage, l’étendue et l’urgence avant de choisir le traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p class="ratio" data-cover="c73-1"></p></template>
<template data-pop="pareto-c73-2" data-title="Essentiel — Définition : code, lignage, grade et stade"><p>Un code de siège ne remplace ni le lignage ni le grade. <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> n’a pas de sous-code suisse dans le catalogue 2024 utilisé [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p class="ratio" data-cover="c73-2"></p></template>
<template data-pop="pareto-c73-3" data-title="Essentiel — Épidémiologie suisse : dater le numérateur et le dénominateur"><p>Les 843 cas par an sont une moyenne dérivée des données suisses 2018–2022. Incidence, mortalité et survie demandent des dénominateurs distincts [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Mortality/ONEC_Mortalit__Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Survival/ONEC_WebTableSurvival_1980-1986_2018-2022_FR.xlsx" target="_blank" rel="noopener">S13</a>].</p><p class="ratio" data-cover="c73-3"></p></template>
<template data-pop="pareto-c73-4" data-title="Essentiel — Du tissu normal à la maladie tumorale"><p>Comprendre la fonction normale explique pourquoi un marqueur ou le radioiode ne convient pas à tous les cancers thyroïdiens [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p class="ratio" data-cover="c73-4"></p></template>
<template data-pop="pareto-c73-5" data-title="Essentiel — Risques et génétique : distinguer tumeur et famille"><p>Germinal signifie potentiellement familial ; somatique décrit la tumeur. Un cancer médullaire impose de penser à <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> et aux risques endocriniens associés avant l’opération [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p class="ratio" data-cover="c73-5"></p></template>
<template data-pop="pareto-c73-6" data-title="Essentiel — Anamnèse : évolution, retentissement et projet de vie"><p>La chronologie, la voix, la respiration et les traitements antérieurs changent le raisonnement. Les inquiétudes de la personne font partie du bilan [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p class="ratio" data-cover="c73-6"></p></template>
<template data-pop="pareto-c73-7" data-title="Essentiel — Sémiologie clinique : décrire avant d’interpréter"><p>Un signe est un argument, pas une histologie. L’urgence respiratoire se décide sur le retentissement actuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p class="ratio" data-cover="c73-7"></p></template>
<template data-pop="pareto-c73-8" data-title="Essentiel — Diagnostic : articuler image, cellules et tissu"><p>Échographie, cytologie et histologie répondent à des questions distinctes. Adapter le prélèvement au diagnostic suspecté et à son usage clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p class="ratio" data-cover="c73-8"></p></template>
<template data-pop="pareto-c73-9" data-title="Essentiel — TNM9 : étendue anatomique et risque de récidive"><p>Toujours préciser édition, histotype et âge. <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">TNM</a>, risque de récidive et réponse au traitement ne sont pas des synonymes [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</p><p class="ratio" data-cover="c73-9"></p></template>
<template data-pop="pareto-c73-10" data-title="Essentiel — Diagnostic différentiel : chercher ce qui change la décision"><p>L’élément discriminant peut être tissulaire. Ne pas confondre apparence, siège et origine [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7395918/" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p class="ratio" data-cover="c73-10"></p></template>
<template data-pop="pareto-c73-11" data-title="Essentiel — Traitement : définir le but avant de choisir le moyen"><p>Ni chirurgie maximale, ni radioiode, ni traitement systémique ne sont automatiques. Le bénéfice attendu, la biologie et les risques guident une décision partagée [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>].</p><p class="ratio" data-cover="c73-11"></p></template>
<template data-pop="pareto-c73-12" data-title="Essentiel — Suivi et pronostic : surveiller la bonne maladie"><p>Suivi tumoral, suivi des effets indésirables et qualité de vie se complètent. Une survie de population n’est pas un pronostic individuel [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Survival/ONEC_WebTableSurvival_1980-1986_2018-2022_FR.xlsx" target="_blank" rel="noopener">S13</a>].</p><p class="ratio" data-cover="c73-12"></p></template>
<template data-pop="pareto-c73-13" data-title="Essentiel — Populations particulières et cadre suisse"><p>Vérifier population, produit, calendrier et financement. Une autorisation ou une recommandation étrangère n’accorde pas automatiquement le remboursement suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><p class="ratio" data-cover="c73-13"></p></template>
<template data-pop="pareto-c73-14" data-title="Essentiel — Critères formels et paramètres à garder ensemble"><p>Cancer thyroïdien : preuve tissulaire adaptée, classification explicite, urgence reconnue et traitement contextualisé. Les nombres restent liés à leur question [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</p><p class="ratio" data-cover="c73-14"></p></template>
<template data-pop="pareto-c73-e-1" data-title="Essentiel — Biologie : définir ce que le dosage peut montrer"><p>Le nom du dosage doit être suivi de la question qu’il résout. Fonction, marqueur tumoral et complication ne sont pas la même chose [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p class="ratio" data-cover="c73-e-1"></p></template>
<template data-pop="pareto-c73-e-2" data-title="Essentiel — Échographie, prélèvement et concordance"><p>La qualité et la concordance du prélèvement comptent. Seuils adultes et exceptions ne se transposent pas directement à l’enfant [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p><p class="ratio" data-cover="c73-e-2"></p></template>
<template data-pop="pareto-c73-e-3" data-title="Essentiel — Imagerie d’extension : une indication précise"><p>Un examen d’extension doit répondre à une question qui influence la conduite. Documenter aussi ses conséquences sur le calendrier nucléaire [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><p class="ratio" data-cover="c73-e-3"></p></template>
<template data-pop="pareto-c73-e-4" data-title="Essentiel — Quatre exercices de décision"><p>Comprendre pourquoi la réponse est correcte compte davantage que reconnaître une expression. Préserver âge, histotype, unités et population [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>].</p><p class="ratio" data-cover="c73-e-4"></p></template>
<template data-pop="pareto-c73-p-1" data-title="Essentiel — Lévothyroxine : substitution et suppression"><p>Microgramme, dose prescrite et objectif biologique sont distincts. La FI fournit une plage, la situation clinique détermine la dose [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p><p class="ratio" data-cover="c73-p-1"></p></template>
<template data-pop="pareto-c73-p-2" data-title="Essentiel — Iode131 : objectif, activité et radioprotection"><p>Le radioiode exige une indication, une activité individualisée, une préparation et des consignes écrites. La conversion d’unités ne remplace aucune de ces décisions [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/vsVYUlb8caju/V2_250624_Strahlenschutz_Wegleitung_Radionuklidtherapie_FR.pdf" target="_blank" rel="noopener">S21</a>].</p><p class="ratio" data-cover="c73-p-2"></p></template>
<template data-pop="pareto-c73-p-3" data-title="Essentiel — Thyrogen : une stimulation avec un calendrier propre"><p>Deux injections intramusculaires et des délais distincts : vérifier indication, voie et calendrier avant les calculs [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><p class="ratio" data-cover="c73-p-3"></p></template>
<template data-pop="pareto-c73-p-4" data-title="Essentiel — Lenvatinib : indication progressive et surveillance"><p>24 mg et ses paliers appartiennent à une indication précise. Hypertension, protéinurie, saignement et cicatrisation font partie du choix et du suivi [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>].</p><p class="ratio" data-cover="c73-p-4"></p></template>
<template data-pop="pareto-c73-p-5" data-title="Essentiel — Selpercatinib : RET, indication et interactions"><p>Un résultat <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> ne suffit pas : vérifier mutation ou fusion, âge, poids, indication, interactions et chirurgie prévue [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><p class="ratio" data-cover="c73-p-5"></p></template>
<template data-pop="pareto-c73-p-6" data-title="Essentiel — Dabrafénib et tramétinib : deux partenaires à surveiller"><p>Une association n’est pas un seul médicament : voies, fréquences, interactions et conduite devant la fièvre doivent rester explicites [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>].</p><p class="ratio" data-cover="c73-p-6"></p></template>
<template data-pop="pareto-c73-p-7" data-title="Essentiel — Prescription, autorisation et remboursement"><p>Vérifier la clinique, le libellé du produit et l’accès réel. Ne pas transformer une source étrangère ou une cible moléculaire en accord suisse automatique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680627810010" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680658830018" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">S28</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">S29</a>].</p><p class="ratio" data-cover="c73-p-7"></p></template>
<template data-pop="pareto-c73-p-8" data-title="Essentiel — Sorafénib : dose, peau, calcium et fonction thyroïdienne"><p>Vérifier les paliers propres au cancer différencié et surveiller peau, pression, calcium et fonction thyroïdienne [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>].</p><p class="ratio" data-cover="c73-p-8"></p></template>
<template data-pop="pareto-c73-p-9" data-title="Essentiel — Cabozantinib : produit et ligne thérapeutique"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">Cabometyx</a> : 60 mg en monothérapie dans une indication précise, paliers 40 puis 20 mg, repas et chirurgie avec délais propres au produit [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>].</p><p class="ratio" data-cover="c73-p-9"></p></template>
<template data-pop="pareto-c73-p-10" data-title="Essentiel — Vandétanib : indication RET et risque électrique cardiaque"><p>Le risque d’arythmie exige une sélection initiale, des contrôles et une lecture des contre-indications ; la dose rénale ne contourne pas une contre-indication [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</p><p class="ratio" data-cover="c73-p-10"></p></template>
