<template id="ch-C73"><div class="chap"><style>[data-c73-table="1"]{font-size:inherit!important;display:block;max-width:100%;overflow-x:auto}[data-c73-table="1"] th,[data-c73-table="1"] td{font-size:inherit!important;min-width:9em}[data-c73-frame]{position:relative;max-width:737px;margin:auto}[data-c73-frame] img,[data-c73-canvas] img{display:block;width:100%;height:auto}[data-c73-marker]{position:absolute;background:#123d4e;color:white;border:2px solid white;border-radius:50%;padding:1px 4px;font-weight:bold;font-size:12px;line-height:1.2}[data-c73-normal-pin="1"]{left:44%;top:16%}[data-c73-normal-pin="2"]{left:47%;top:24%}[data-c73-normal-pin="3"]{left:40%;top:50%}[data-c73-normal-pin="4"]{left:53%;top:84%}[data-c73-scroll]{overflow-x:auto;max-width:100%;border:1px solid currentColor}[data-c73-canvas]{position:relative;min-width:760px}[data-c73-path-pin="1"]{left:15%;top:24%}[data-c73-path-pin="2"]{left:49%;top:24%}[data-c73-path-pin="3"]{left:82%;top:24%}[data-c73-path-pin="4"]{left:49%;top:74%}</style><div class="chap-head"><div class="code"><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> · Tumeur maligne de la thyroïde · Endocrinologie et métabolisme</div><h1>Tumeur maligne de la thyroïde</h1><span class="status">Production Sol du 2 novembre 2026 · Sources datées suisses et européennes · Auto-relecture, sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#c73-1">Une masse du cou, plusieurs maladies possibles</a></li><li><a href="#c73-2">Définition : code, lignage, grade et stade</a></li><li><a href="#c73-3">Épidémiologie suisse : dater le numérateur et le dénominateur</a></li><li><a href="#c73-4">Du tissu normal à la maladie tumorale</a></li><li><a href="#c73-5">Risques et génétique : distinguer tumeur et famille</a></li><li><a href="#c73-6">Anamnèse : évolution, retentissement et projet de vie</a></li><li><a href="#c73-7">Sémiologie clinique : décrire avant d’interpréter</a></li><li><a href="#c73-8">Diagnostic : articuler image, cellules et tissu</a></li><li><a href="#c73-9">TNM 9 : étendue anatomique et risque de récidive</a></li><li><a href="#c73-10">Diagnostic différentiel : chercher ce qui change la décision</a></li><li><a href="#c73-11">Traitement : définir le but avant de choisir le moyen</a></li><li><a href="#c73-12">Suivi et pronostic : surveiller la bonne maladie</a></li><li><a href="#c73-13">Populations particulières et cadre suisse</a></li><li><a href="#c73-14">Critères formels et paramètres à garder ensemble</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="c73-1"><h2><span class="n">1</span>Une masse du cou, plusieurs maladies possibles</h2><p>Une personne fictive de quarante-huit ans consulte pour un nodule découvert à l’échographie. Sa <button class="w" data-k="c73-tsh">thyréostimuline</button> est dans l’intervalle du laboratoire. Elle demande si cela exclut un cancer. Non : le dosage renseigne sur le fonctionnement hormonal global, tandis que l’échographie, la cytologie et, selon le cas, l’histologie répondent à la question de la nature du tissu. Le bilan doit aussi rechercher une extension et une menace respiratoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p>« Cancer de la thyroïde » rassemble des tumeurs de lignages et de comportements différents. Une petite tumeur papillaire sélectionnée, un cancer médullaire héréditaire et un cancer anaplasique rapidement compressif n’ont ni le même bilan ni le même traitement. Une expression comme « bon cancer » peut banaliser l’expérience de la personne et masquer ces différences [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p>Pour l’examen fédéral, l’enjeu est de relier une anomalie histologique ou moléculaire à une décision expliquée. Les situations suisses <button class="w" data-k="c73-profiles">PROFILES</button> incluent l’histologie, la cytologie et les tests génétiques anormaux, ainsi que l’évaluation partagée des risques oncologiques. La correspondance pédagogique de ce cours n’est pas une correspondance officielle entre un code et une question d’examen [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S26</a>].</p><div class="key"><b>À retenir.</b> Une <button class="w" data-k="c73-tsh">thyréostimuline</button> normale n’exclut pas un cancer. Identifier le lignage, l’étendue et l’urgence avant de choisir le traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-1">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-2"><h2><span class="n">2</span>Définition : code, lignage, grade et stade</h2><p>Le catalogue suisse local <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM2024</a> donne <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> — Tumeur maligne de la thyroïde, sans subdivision. Le numéro <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">C73.9</a> présent sur une fiche anglaise de stadification ne crée pas un sous-code suisse. Le code de siège, le type histologique, le grade et le stade décrivent des dimensions différentes [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>].</p><table class="t" data-c73-table="1"><thead><tr><th>Groupe</th><th>Origine et repère</th><th>Conséquence du raisonnement</th></tr></thead><tbody><tr><td>Papillaire, folliculaire, oncocytaire</td><td>Lignage folliculaire ; différenciation variable.</td><td>Une capacité de fixer l’iode peut persister, mais ne se déduit pas du nom seul.</td></tr><tr><td>Différencié de haut grade et peu différencié</td><td>Deux catégories à distinguer dans la classification 2022.</td><td>Le grade et la nécrose ajoutent une information pronostique.</td></tr><tr><td>Médullaire</td><td>Cellules C, <button class="w" data-k="c73-calcitonin">calcitonine</button> ; recherche de prédisposition <button class="w" data-k="c73-ret">RET</button>.</td><td>Le suivi et les traitements diffèrent des formes folliculaires.</td></tr><tr><td>Anaplasique</td><td>Carcinome indifférencié, souvent rapidement invasif.</td><td>Évaluation urgente, preuve tissulaire et analyse moléculaire rapide.</td></tr></tbody></table><p>La terminologie actuelle remplace « Hürthle » par « oncocytaire » et distingue un sous-type histologique d’un variant génétique. Une néoplasie folliculaire non invasive à caractéristiques nucléaires de type papillaire, dite <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">NIFTP</a>, appartient aux néoplasies de faible risque de comportement incertain dans la classification 2022 : elle ne devient pas automatiquement un cancer <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a>. Son diagnostic exige l’étude du tissu et de l’absence d’invasion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p>« Microcarcinome papillaire » signifie une taille d’au plus 1 cm. Ce n’est plus un sous-type histologique autonome et cela ne garantit pas l’absence de caractéristiques agressives. La taille doit rester accompagnée du sous-type, de l’invasion et de l’évaluation ganglionnaire [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><div class="key"><b>À retenir.</b> Un code de siège ne remplace ni le lignage ni le grade. <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> n’a pas de sous-code suisse dans le catalogue 2024 utilisé [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-2">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-3"><h2><span class="n">3</span>Épidémiologie suisse : dater le numérateur et le dénominateur</h2><p>Les tableaux officiels de l’Organe national d’enregistrement du cancer rapportent, pour 2018–2022,1249 nouveaux cas chez les hommes et 2966 chez les femmes, soit 4215 cas <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> en cinq ans. Diviser par cinq donne une moyenne calculée d’environ 250 hommes et 593 femmes par an, soit 843 cas annuels. Ce ne sont pas des comptages de 2026 [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>].</p><p>Les taux standardisés selon l’âge, utilisant le standard européen 1976, sont de 4,90 chez les hommes et 12,02 chez les femmes pour 100000 personnes-années. Le taux brut répond à une autre question et dépend de la structure d’âge de la population. Un rapport entre nombres bruts ne remplace pas un rapport entre taux standardisés [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>].</p><p>Sur la même période, 274 décès ont été enregistrés, 116 chez les hommes et 158 chez les femmes. On ne peut pas diviser ces décès par les nouveaux cas de la période pour calculer la létalité : les personnes décédées ne sont pas nécessairement celles diagnostiquées pendant ces cinq années [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Mortality/ONEC_Mortalit__Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S12</a>].</p><p>La découverte d’une lésion dépend de l’intensité et des indications de l’imagerie. L’augmentation des diagnostics de petits cancers ne prouve pas une augmentation parallèle des maladies qui menacent la vie. Aucune prévalence suisse <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a> ni prévalence européenne contemporaine n’a été établie dans les lectures ciblées ; une fréquence européenne des nodules ne doit pas être utilisée comme fréquence de cancer [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>].</p><div class="key"><b>À retenir.</b> Les 843 cas par an sont une moyenne dérivée des données suisses 2018–2022. Incidence, mortalité et survie demandent des dénominateurs distincts [<a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Incidence/ONEC_Incidence_Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Mortality/ONEC_Mortalit__Web_1983-1987_2018-2022_FR.xlsx" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://www.nkrs.ch/upload/downloads/Berichte%20und%20Statistiken/Survival/ONEC_WebTableSurvival_1980-1986_2018-2022_FR.xlsx" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-3">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-4"><h2><span class="n">4</span>Du tissu normal à la maladie tumorale</h2><p>La glande normale comporte des follicules bordés de cellules qui fabriquent la <button class="w" data-k="c73-tg">thyroglobuline</button>, captent l’iodure et produisent les hormones thyroïdiennes. La colloïde est un compartiment extracellulaire de stockage. Les cellules C constituent un autre lignage fonctionnel et sécrètent la <button class="w" data-k="c73-calcitonin">calcitonine</button> ; celle-ci n’est pas une hormone précurseur de la thyroxine [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p><p>Une prolifération tumorale peut conserver certains caractères du tissu d’origine et en perdre d’autres. La <button class="w" data-k="c73-tg">thyroglobuline</button> est utile pour suivre une maladie différenciée dans un contexte approprié ; elle n’est pas un test de dépistage de tout nodule et ne constitue pas le marqueur du cancer médullaire. Une dédifférenciation peut réduire l’expression de la <button class="w" data-k="c73-tg">thyroglobuline</button> et la capacité de fixer l’iode [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p><p>Les modifications moléculaires participent à la signalisation de croissance. Une altération de <button class="w" data-k="c73-ret">RET</button> peut être une mutation dans un cancer médullaire ou une fusion dans un cancer papillaire : le nom du gène ne suffit pas à définir l’éligibilité au même médicament. Il faut préciser le type d’altération, le type tumoral, l’âge, les traitements antérieurs et le libellé suisse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="15" fill="currentColor" text-anchor="middle">Lignage et différenciation</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="15" fill="currentColor" text-anchor="middle">Marqueurs et fonction conservés ou perdus</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="15" fill="currentColor" text-anchor="middle">Examens et traitements adaptés</text></svg><figcaption>Schéma causal original Sol 2026, sans structure anatomique dessinée. Chaîne de raisonnement fondée sur les caractéristiques tissulaires ; une perte de différenciation n’est pas une étape obligatoire de tout cancer [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</figcaption></figure><div class="key"><b>À retenir.</b> Comprendre la fonction normale explique pourquoi un marqueur ou le radioiode ne convient pas à tous les cancers thyroïdiens [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9142814/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-4">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-5"><h2><span class="n">5</span>Risques et génétique : distinguer tumeur et famille</h2><p>Rechercher une irradiation cervicale pendant l’enfance, les antécédents familiaux de cancer thyroïdien et les manifestations d’un syndrome de prédisposition. Un facteur de risque renforce l’attention portée à une lésion ; il ne prouve pas que celle-ci est maligne. L’absence d’histoire familiale ne suffit pas non plus à exclure une prédisposition [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p><p>Tout cancer médullaire confirmé appelle une discussion de l’analyse germinale de <button class="w" data-k="c73-ret">RET</button> avec conseil génétique. Un variant trouvé dans le sang peut concerner les apparentés ; une altération somatique détectée uniquement dans la tumeur répond d’abord à une question tumorale. Ces deux analyses ne sont pas interchangeables [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p><p>La néoplasie endocrinienne multiple de type 2 peut associer cancer médullaire, phéochromocytome et, selon le sous-type, hyperparathyroïdie. Avant la chirurgie thyroïdienne, si un statut germinal négatif n’est pas établi, rechercher les tumeurs endocriniennes associées selon l’équipe experte. Un phéochromocytome présent doit être pris en charge et opéré avant le cancer médullaire pour éviter une crise liée à la sécrétion de catécholamines lors de l’intervention [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>Chez un porteur asymptomatique d’un variant germinal pathogène de <button class="w" data-k="c73-ret">RET</button>, une thyroïdectomie prophylactique doit être proposée en équipe spécialisée. Son calendrier dépend du variant, de l’âge et de la <button class="w" data-k="c73-calcitonin">calcitonine</button> interprétée selon les valeurs adaptées ; il ne s’agit pas d’un dépistage de tout enfant dans la population générale [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>D’autres prédispositions, notamment liées à <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">PTEN</a> ou <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">DICER1</a>, peuvent concerner des lésions du lignage folliculaire chez l’enfant. Le contexte clinique et familial guide l’orientation ; il ne justifie pas de proposer sans indication la même analyse génétique à tout adulte présentant un nodule [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p><div class="key"><b>À retenir.</b> Germinal signifie potentiellement familial ; somatique décrit la tumeur. Un cancer médullaire impose de penser à <button class="w" data-k="c73-ret">RET</button> et aux risques endocriniens associés avant l’opération [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-5">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-6"><h2><span class="n">6</span>Anamnèse : évolution, retentissement et projet de vie</h2><p>Préciser la date et les circonstances de découverte, la vitesse de croissance, une douleur ou un gonflement brutal, une modification de voix, une dysphagie, une dyspnée et une gêne en position couchée. Une croissance rapide n’établit pas à elle seule le diagnostic d’un cancer anaplasique : une hémorragie ou un lymphome peuvent aussi modifier rapidement le cou. Elle impose de réévaluer le délai et le niveau de soins [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p><p>Documenter les anciennes échographies et les prélèvements : quel nodule a été ponctionné, avec quelle catégorie cytologique, et existe-t-il une concordance avec l’image actuelle ? Une phrase ancienne « ponction bénigne » sans localisation précise ne rassure pas sur toutes les lésions futures [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p><p>Rechercher irradiation, chirurgie et traitements antérieurs, antécédents familiaux, symptômes endocriniens associés, grossesse, allaitement et projet de grossesse. Relever les médicaments, les compléments de biotine, les produits iodés et les injections récentes de contraste ; ils peuvent modifier les analyses ou la préparation d’une procédure nucléaire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p><p>Enfin, demander les attentes et les craintes : sécurité du suivi, cicatrice, voix, fertilité, travail, incertitude génétique ou accès à un traitement. Une décision partagée exige une explication des objectifs et des contraintes de chaque option. Les textes lus ne fournissent pas une fréquence universelle de chaque symptôme applicable à toutes les histologies [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S26</a>].</p><div class="key"><b>À retenir.</b> La chronologie, la voix, la respiration et les traitements antérieurs changent le raisonnement. Les inquiétudes de la personne font partie du bilan [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-6">Essentiel de cette partie</button></section>
<section class="ilot" id="c73-7"><h2><span class="n">7</span>Sémiologie clinique : décrire avant d’interpréter</h2><div data-semiology-clinical="C73"><p>La sémiologie clinique recherche une masse thyroïdienne, des adénopathies, une atteinte des structures voisines et une menace fonctionnelle. Elle relie chaque signe à un mécanisme possible sans lui attribuer une valeur diagnostique absolue [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>].</p></div><p>Observer l’état général, la respiration et la voix, puis inspecter le cou au repos et à la déglutition. Palper les lobes, l’isthme et les aires ganglionnaires cervicales ; décrire consistance, douleur, contours, mobilité et fixation. Une masse qui suit la déglutition est compatible avec une origine thyroïdienne mais ne prouve pas sa bénignité [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S22</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S26</a>].</p><p>Une dureté, une fixation, une adénopathie suspecte ou une dysphonie nouvelle renforcent la suspicion. Une paralysie d’une corde vocale peut résulter d’une atteinte du nerf laryngé récurrent mais nécessite une évaluation spécialisée ; la voix seule ne mesure pas la mobilité des cordes vocales. La normalité de la palpation n’exclut ni petite lésion ni extension profonde [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>Une masse cervicale ferme rapidement progressive, avec dysphagie, dysphonie ou dyspnée, fait évoquer notamment un cancer anaplasique et appelle un bilan immédiat. Stridor ou détresse respiratoire font prioriser l’évaluation et la protection des voies aériennes. Le bilan tumoral ambulatoire ne doit pas retarder les soins urgents [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><p>Aucune sensibilité ou spécificité universelle de cet examen n’a été établie dans les lectures. La profondeur, le volume, le type de lésion et l’expérience de l’examinateur modifient sa performance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p><div class="key"><b>À retenir.</b> Un signe est un argument, pas une histologie. L’urgence respiratoire se décide sur le retentissement actuel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-c73-7">Essentiel de cette partie</button></section>
