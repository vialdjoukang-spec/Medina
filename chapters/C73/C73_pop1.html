<template data-pop="c73-tsh" data-title="Thyréostimuline : fonction et objectif"><p>La <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyréostimuline</a> renseigne sur le rétrocontrôle hormonal, pas directement sur la nature d’un nodule. Une valeur normale n’exclut pas un cancer. Après une forme différenciée traitée, un objectif de suppression peut être discuté selon risque/réponse et risques cardiaques ou osseux ; ce n’est ni une norme de dépistage ni une dose fixe [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p></template>

<template data-pop="c73-tirads" data-title="Score échographique et taille"><p>Chez l’adulte, le guide <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">ETA</a> 2023 propose la ponction pour <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">EU-TIRADS</a> 3 au-delà de 20 mm, 4 au-delà de 15 mm et 5 au-delà de 10 mm. Un ganglion pathologique ou une extension suspectée peut modifier la décision. Ces seuils ne sont ni des stades ni des seuils pédiatriques automatiques [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S8</a>].</p></template>
<template data-pop="c73-cyto" data-title="Cellules, tissu et invasion"><p>La cytoponction étudie des cellules. Une néoplasie folliculaire ne prouve pas un carcinome ; l’invasion capsulaire ou vasculaire demande l’étude adéquate du tissu. Confronter la qualité du prélèvement, l’échographie et la catégorie de résultat. Les systèmes britanniques Thy et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">Bethesda</a> ne sont pas automatiquement superposables [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9633223/" target="_blank" rel="noopener">S25</a>].</p></template>
<template data-pop="c73-calcitonin" data-title="Calcitonine : question médullaire"><p>La <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">calcitonine</a> est un marqueur lié aux cellules C. Un résultat s’interprète avec méthode, unité et contexte, pas comme un seuil universel indépendant du laboratoire. Les guides ne soutiennent pas un même consensus de dosage systématique pour tout nodule. Une suspicion médullaire doit être coordonnée avec l’équipe experte avant la ponction, compte tenu de stratégies différentes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>].</p></template>
<template data-pop="c73-tg" data-title="Thyroglobuline et anticorps"><p>Le contexte tissulaire et thérapeutique compte : du tissu normal restant après hémi peut produire de la <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyroglobuline</a>. Après thyroïdectomie totale et radioiode, le marqueur répond à une autre question. Associer les anticorps anti-<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyroglobuline</a>, qui peuvent interférer, et interpréter avec méthode, stimulation et imagerie. Une hausse isolée n’impose pas automatiquement un traitement systémique [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng230/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p></template>
<template data-pop="c73-tnm" data-title="TNM neuvième édition : ce que le stade décrit"><p>La fiche européenne <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">NDRS</a> v 1.1 du 16 décembre 2025 fournit les groupes <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">UICC</a> <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">TNM</a> 9. Pour une forme différenciée avant 55 ans, absence de métastase distante correspond au stade un et présence au stade deux, quelle que soit l’atteinte ganglionnaire. Le risque de récidive demande d’autres données. Le livre n’a pas été lu et <a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">C73.9</a> de la fiche anglaise n’est pas ajouté comme sous-code suisse [<a data-reference-source="1" href="https://digital.nhs.uk/binaries/content/assets/website-assets/national-disease-registration-service/cancer-data-training-materials/staging-sheets/icd10-c73.9-thyroid-gland-data-sheet-v2025-1.1.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://doi.org/10.1002/ijc.70561" target="_blank" rel="noopener">S10</a>].</p></template>
<template data-pop="c73-ret" data-title="RET : mutation, fusion et contexte"><p>Une altération de <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> doit être caractérisée : mutation ou fusion, germinale ou somatique. Les mutations d’un cancer médullaire et les fusions d’un cancer papillaire ne désignent pas la même indication de selpercatinib. Un résultat tumoral ne prouve pas à lui seul une prédisposition familiale ; l’âge et les traitements antérieurs restent pertinents [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p><p>Un cancer médullaire confirmé conduit à discuter l’analyse germinale <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> et le conseil génétique, même sans histoire familiale. Si un statut germinal négatif n’est pas établi avant chirurgie, rechercher les atteintes endocriniennes associées. Un phéochromocytome présent est pris en charge avant l’intervention thyroïdienne pour éviter le danger des catécholamines ; ne pas assimiler toute altération somatique à une prédisposition familiale [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11467120/" target="_blank" rel="noopener">S6</a>].</p></template>



<template data-pop="c73-lt4" data-title="Euthyrox : dose et objectif"><table class="t" data-c73-table="1"><thead><tr><th>Question</th><th>Repère FI février 2023</th><th>Limite clinique</th></tr></thead><tbody><tr><td>Produit et voie</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">Euthyrox</a>, comprimés 25–200 microgrammes ; voie orale.</td><td>Vérifier présentation et prescription.</td></tr><tr><td>Après thyroïdectomie pour cancer</td><td>Plage 150–300 microgrammes par jour dans la FI.</td><td>Pas une dose initiale universelle ; objectif de <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">thyréostimuline</a> et risques individuels.</td></tr><tr><td>Prise</td><td>À jeun, au moins 30 minutes avant le petit déjeuner.</td><td>Régularité et interactions modifient l’exposition.</td></tr><tr><td>Absorption</td><td>Calcium, fer ou aluminium au moins 2 heures après ; résines 4–5 heures après.</td><td>Ne pas remplacer ces délais par une règle inventée commune à tous les médicaments.</td></tr><tr><td>Fonctions d’organes</td><td>Pharmacocinétique rénale/hépatique non étudiée.</td><td>Aucune adaptation numérique universelle déduite.</td></tr></tbody></table><p>FI suisse février 2023. Une plage d’autorisation n’est pas une première dose universelle. Microgramme et milligramme diffèrent d’un facteur mille. Adapter au besoin, au suivi et aux risques, sans dose rénale ou hépatique inventée [<a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S14</a>].</p></template>

<template data-pop="c73-rh" data-title="Thyrogen : voie et calendrier"><table class="t" data-c73-table="1"><thead><tr><th>Étape</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">Thyrogen</a> juin 2023</th><th>Point de sécurité</th></tr></thead><tbody><tr><td>Injection</td><td>0,9 mg par voie intramusculaire, puis 0,9 mg 24 heures après.</td><td>Voie exclusivement intramusculaire, pas intraveineuse.</td></tr><tr><td>Radioiode</td><td>24 heures après la seconde injection.</td><td>Planifier avec le service nucléaire.</td></tr><tr><td>Thyroglobuline stimulée</td><td>Prélèvement 72 heures après la seconde injection.</td><td>Anticorps et méthode restent pertinents.</td></tr><tr><td>Préablation</td><td>Avec 1,1–3,7 gigabecquerels après chirurgie quasi totale ou totale, sans métastase distante.</td><td>Ne pas élargir automatiquement à une maladie métastatique.</td></tr></tbody></table><p>FI juin 2023. Le contexte préablation est sans métastase distante. Risques de gonflement tumoral et cardiaques évalués ; population pédiatrique exceptionnelle et adaptation rénale non établie. Ne pas transformer un usage hors indication étranger en autorisation suisse [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680576870011" target="_blank" rel="noopener">S16</a>].</p></template>
<template data-pop="c73-lenv" data-title="Lenvima : dose différenciée et sécurité"><table class="t" data-c73-table="1"><thead><tr><th>Situation</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Lenvima</a> septembre 2025</th><th>Limite</th></tr></thead><tbody><tr><td>Indication thyroïdienne</td><td>Cancer différencié progressif, avancé ou métastatique, réfractaire au radioiode.</td><td>Pas tout cancer stable ayant reçu du radioiode.</td></tr><tr><td>Dose adulte</td><td>24 mg par voie orale une fois par jour, avec ou sans nourriture.</td><td>Deux capsules 10 mg et une 4 mg ; vérifier la prescription.</td></tr><tr><td>Paliers de réduction</td><td>20 mg, puis 14 mg, puis 10 mg par jour.</td><td>Ne pas sauter automatiquement au palier 14 mg.</td></tr><tr><td>Insuffisance rénale sévère</td><td>14 mg par jour dans le contexte différencié ; terminale non recommandée.</td><td>Ne pas transposer une dose d’un autre cancer.</td></tr><tr><td>Insuffisance hépatique</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child A</a>/B sans adaptation ; Child C14 mg par jour pour cette indication.</td><td>Doses d’autres indications différentes.</td></tr></tbody></table><p>FI septembre 2025. Pression, protéinurie, foie/rein, saignement et fistules sont surveillés ; chirurgie élective : interruption six jours avant puis appréciation de la cicatrisation. Dose et paliers d’un autre cancer ne sont pas transposés [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">S17</a>].</p></template>
<template data-pop="c73-sel" data-title="Retsevmo : indication et poids"><table class="t" data-c73-table="1"><thead><tr><th>Question</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">Retsevmo</a> décembre 2025</th><th>Précision</th></tr></thead><tbody><tr><td>Papillaire</td><td>Adulte, fusion <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a>, maladie avancée nécessitant un traitement systémique après progression sous traitement préalable incluant radioiode.</td><td>Ne pas élargir à toute histologie ou tout enfant.</td></tr><tr><td>Médullaire</td><td>Mutation <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a>, avancé, adulte et adolescent dès 12 ans.</td><td>Mutation et fusion ne sont pas synonymes.</td></tr><tr><td>Dose selon poids</td><td>Moins 50 kg : 120 mg deux fois par jour ; au moins 50 kg : 160 mg deux fois par jour.</td><td>Prises orales espacées d’environ 12 heures.</td></tr><tr><td>Foie sévèrement atteint</td><td>80 mg deux fois par jour.</td><td>Vérifier la définition et l’ensemble des ajustements de la FI.</td></tr><tr><td>Rein</td><td>Pas d’adaptation pour un débit de filtration glomérulaire estimé d’au moins 15 mL/min/1,73 m² ; stade terminal/dialyse sans données.</td><td>Ne pas inventer une dose de dialyse.</td></tr><tr><td>Médicaments de l’acidité gastrique</td><td>Inhibiteur de pompe : prendre avec nourriture ; antagoniste <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">H2</a> : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">Retsevmo</a> 2 heures avant.</td><td>Antiacide 2 heures avant ou après ; pas délai supplémentaire inventé.</td></tr></tbody></table><p>FI décembre 2025. Interactions avec <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">CYP3A</a> et médicaments modifiant l’acidité nécessitent leur propre lecture ; aucune réduction unique ne convient à toutes. Contrôler notamment foie, électrocardiogramme, électrolytes et pression. Pas dose de dialyse inventée [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680702140018" target="_blank" rel="noopener">S18</a>].</p></template>


<template data-pop="c73-profiles" data-title="PROFILES : raisonnement et communication"><p>Le référentiel 2017 inclut l’histologie, la cytologie et les tests moléculaires anormaux, ainsi que l’évaluation partagée des risques de maladies fréquentes, notamment oncologiques. La correspondance locale <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">C73</a>–situations 159/227 est pédagogique et non un tableau officiel <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c73-c75.htm" target="_blank" rel="noopener">CIM</a>–<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a>. Elle ne garantit pas une question d’examen [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S26</a>].</p></template>

<template data-pop="c73-sor" data-title="Nexavar : indication et paliers thyroïdiens"><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">Nexavar</a> novembre 2023</th><th>Limite</th></tr></thead><tbody><tr><td>Indication</td><td>Cancer différencié progressif, avancé ou métastatique, réfractaire au radioiode.</td><td>Pas un traitement de tout nodule ni de toute maladie stable.</td></tr><tr><td>Dose orale</td><td>400 mg deux fois par jour, soit 800 mg par jour.</td><td>À jeun ou avec un repas léger pauvre en graisses.</td></tr><tr><td>Réductions thyroïdiennes</td><td>600 mg par jour en deux prises, puis 400 mg par jour, puis 200 mg par jour.</td><td>Ne pas copier directement le palier d’un autre type de cancer.</td></tr><tr><td>Rein</td><td>Pas d’adaptation légère, modérée ou sévère selon la FI ; dialyse sans expérience.</td><td>Surveiller hydratation et électrolytes ; absence de réduction ne signifie pas absence de risque.</td></tr><tr><td>Foie et enfant</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child A</a>/B sans adaptation ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child C</a> sans expérience. Enfant et adolescent non prévus.</td><td>Aucune dose <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child C</a> ou pédiatrique inventée.</td></tr></tbody></table><p>FI suisse novembre 2023. Surveiller peau, pression, calcémie et fonction thyroïdienne. Les doses du cancer rénal ou hépatique ne remplacent pas les paliers thyroïdiens ; aucune dose de dialyse ou pédiatrique n’est déduite [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680575830016" target="_blank" rel="noopener">S30</a>].</p></template>
<template data-pop="c73-cabo" data-title="Cabometyx : produit et indication différenciée"><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">Cabometyx</a> décembre 2025</th><th>Précision</th></tr></thead><tbody><tr><td>Indication thyroïdienne</td><td>Adulte, cancer différencié avancé ou métastatique, réfractaire ou non éligible au radioiode, progression pendant ou après un traitement ciblant le facteur de croissance de l’endothélium vasculaire.</td><td>Cette FI n’est pas une autorisation de tout cabozantinib dans le médullaire.</td></tr><tr><td>Monothérapie orale</td><td>60 mg une fois par jour ; réductions 40 mg puis 20 mg par jour.</td><td>Ne pas copier la dose d’une association destinée au cancer rénal.</td></tr><tr><td>Repas</td><td>Ne rien manger pendant au moins 2 heures avant et 1 heure après.</td><td>Comprimés entiers.</td></tr><tr><td>Foie</td><td>Léger : pas d’ajustement ; modéré : aucune recommandation numérique possible ; sévère : non recommandé.</td><td>Ne pas inventer un palier <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680655120013" target="_blank" rel="noopener">Child B</a>.</td></tr><tr><td>Rein et enfant</td><td>Léger/modéré : prudence ; sévère : non recommandé. Utilisation pédiatrique non autorisée.</td><td>Pas dose enfant ni dose rénale sévère proposée.</td></tr></tbody></table><p>FI décembre 2025. Cette formulation ne devient pas une indication médullaire par analogie. Précautions de saignement, fistule et cicatrisation ; arrêt 28 jours avant chirurgie programmée si possible. Vérifier les interactions et la reprise après cicatrisation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" target="_blank" rel="noopener">S31</a>].</p></template>
<template data-pop="c73-van" data-title="Caprelsa : indication, rein et risque cardiaque"><table class="t" data-c73-table="1"><thead><tr><th>Élément</th><th>FI <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">Caprelsa</a> avril 2025</th><th>Point de sécurité</th></tr></thead><tbody><tr><td>Indication</td><td>Adulte, cancer médullaire agressif et symptomatique avec mutation <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a>, non opérable, avancé ou métastatique.</td><td>Pas indication suisse universelle de tout cancer médullaire.</td></tr><tr><td>Dose orale</td><td>300 mg une fois par jour, avec ou sans repas ; paliers 200 puis 100 mg.</td><td>Pas dose pédiatrique.</td></tr><tr><td>Clairance de la créatinine</td><td>De 30 mL/min inclus à moins de 50 mL/min : dose initiale 200 mg.</td><td>Clairance inférieure à 30 mL/min : contre-indication de la FI.</td></tr><tr><td>Foie</td><td>Déconseillé si bilirubine supérieure à 1,5 fois la limite normale.</td><td>Données insuffisantes, pas réduction inventée.</td></tr><tr><td>Électrocardiogramme et électrolytes</td><td>Avant traitement, puis 2–4 semaines, 8–12 semaines et tous les 3 mois.</td><td>Plus fréquent si besoin ; contrôler calcium, magnésium et potassium.</td></tr></tbody></table><p>FI avril 2025. Forme médullaire agressive symptomatique <a data-reference-source="1" href="https://www.leitlinienprogramm-onkologie.de/leitlinien/schilddruesenkarzinom/" target="_blank" rel="noopener">RET</a> mutée adulte ; pas indication pédiatrique. Rein sévère contre-indiqué malgré la formulation « déconseillé » dans une autre rubrique. Intervalle corrigé durablement supérieur à 480 millisecondes : pas d’instauration ; au moins 500 millisecondes : arrêt et réévaluation médicale [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680623410016" target="_blank" rel="noopener">S32</a>].</p></template>
