<template data-pop="pareto-k92-urgence" data-title="Loi de Pareto — Reconnaître et réanimer"><p class="ratio" data-cover="k92-1,k92-3,k92-5,k92-6,k92-7"></p><ul><li>Hématémèse et méléna : source haute le plus souvent ; hématochézie avec choc : exclure une source haute.</li><li>Hémoglobine initiale faussement rassurante ; fréquence cardiaque, pression et indice de choc jugent la perte.</li><li>Antithrombotiques, AINS et cirrhose : trois questions qui changent la conduite.</li><li>Transfusion restrictive : 70 g/L (80 g/L si maladie cardiovasculaire) ; 70 à 80 g/L dans l’hémorragie variqueuse.</li><li>Pas d’acide tranexamique ; pas de plasma frais congelé dans l’hémorragie variqueuse.</li></ul></template>
<template data-pop="pareto-k92-traitement" data-title="Loi de Pareto — Endoscopie, traitement et suivi"><p class="ratio" data-cover="k92-8,k92-9,k92-10,k92-11,k92-12,k92-13"></p><ul><li>Glasgow-Blatchford ≤ 1 : ambulatoire ; Oakland ≤ 8 : hémorragie basse mineure.</li><li>Non variqueuse : endoscopie ≤ 24 h ; Forrest Ia, Ib, IIa traités par deux méthodes ; IPP forte dose 72 h.</li><li>Variqueuse : vasoactif et ceftriaxone d’emblée, endoscopie ≤ 12 h, ligature, TIPS préemptif si haut risque.</li><li>Basse instable : angio-tomodensitométrie, puis gastroscopie si négative.</li><li>Aspirine de prévention secondaire maintenue ; anticoagulant repris vers 7 jours.</li><li>Helicobacter pylori recherché, traité et contrôlé après un ulcère.</li></ul></template>
<template data-pop="pareto-k92-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k92-e-1,k92-e-2,k92-e-3"></p><ul><li>Œsogastroduodénoscopie : gold standard de l’hémorragie haute.</li><li>Angio-tomodensitométrie : premier examen du patient instable avec hématochézie ; puis embolisation.</li><li>Hémoglobine initiale trompeuse ; urée élevée oriente vers une source haute.</li><li>Cirrhose : INR et plaquettes ne guident pas la transfusion.</li><li>Capsule du grêle précoce si les endoscopies sont négatives.</li></ul></template>
<template data-pop="pareto-k92-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k92-p-1,k92-p-2,k92-p-3"></p><ul><li>IPP 80 mg puis 8 mg/h pendant 72 h après hémostase (ESGE).</li><li>Terlipressine 1 à 2 mg toutes les 4 à 6 h, au plus 5 jours ; QT, natrémie, ischémie.</li><li>Octréotide 0,025 mg/h au plus 5 jours ; glycémie.</li><li>Ceftriaxone 1 g/24 h chez le cirrhotique qui saigne.</li><li>Érythromycine 250 mg avant l’endoscopie ; pas d’acide tranexamique.</li></ul></template>
<template data-pop="k92-haute-basse" data-title="Hémorragie haute ou basse"><p class="lab">Définition</p><p>La limite est l’angle duodéno-jéjunal. Une source en amont est haute ; une source en aval est basse.</p><p class="lab">Mécanisme</p><p>Le sang issu d’une source haute est digéré pendant son transit ; il devient noir. Un débit très élevé raccourcit le transit et donne du sang rouge.</p><p class="lab">Conséquence pratique</p><p>Une hématochézie avec choc impose d’exclure une source haute ; la BSG cite 11 à 15 % de sources hautes chez des patients initialement crus en hémorragie basse.</p><p class="src">Références : <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></template>
<template data-pop="k92-cirrhose-contexte" data-title="Le cirrhotique qui saigne"><p class="lab">Pourquoi la conduite change</p><p>L’hémorragie est le plus souvent liée à l’hypertension portale. Le traitement vise la pression portale : vasoactif, ligature, TIPS.</p><p class="lab">Mesures spécifiques</p><p>Antibioprophylaxie dès l’admission, transfusion vers 70 à 80 g/L, endoscopie dans les 12 heures, lactulose contre l’encéphalopathie.</p><p class="lab">Piège</p><p>Un cirrhotique peut aussi saigner d’un ulcère ; le traitement vasoactif est débuté sur la suspicion et adapté après l’endoscopie.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-ulcere-mecanisme" data-title="Ulcère : rupture de la barrière muqueuse"><p class="lab">Normal</p><p>Mucus, bicarbonates, renouvellement épithélial et flux sanguin protègent la muqueuse contre l’acide et la pepsine.</p><p class="lab">Perturbation</p><p>Helicobacter pylori et les AINS affaiblissent ces défenses ; l’agression acidopeptique creuse la paroi.</p><p class="lab">Conséquence</p><p>Quand l’ulcère érode une artère sous-muqueuse, le saignement peut être artériel et récidiver.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k92-ipp-caillot" data-title="Inhibition acide et stabilité du caillot"><p class="lab">Mécanisme</p><p>Un pH bas altère l’agrégation plaquettaire et favorise la dégradation du caillot par la pepsine. L’IPP bloque la pompe H⁺/K⁺-ATPase et élève le pH.</p><p class="lab">Preuve et place</p><p>L’ESGE recommande un IPP à forte dose pendant 72 heures après hémostase endoscopique ou devant un caillot adhérent non traité (recommandation forte, preuve de haute qualité). Avant l’endoscopie, il peut faire régresser les stigmates mais ne doit pas retarder le geste.</p><p class="lab">Limite</p><p>Dans l’hémorragie variqueuse, l’IPP débuté avant l’endoscopie est arrêté après le geste, sauf indication stricte (Baveno VII).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-varices" data-title="Varices œsophagiennes"><p class="lab">Définition</p><p>Veines sous-muqueuses dilatées de l’œsophage distal, collatérales entre le système porte et le système cave supérieur.</p><p class="lab">Mécanisme</p><p>L’hypertension portale cliniquement significative est définie par un gradient de pression veineuse hépatique supérieur à 10 mmHg ; elle ouvre ces collatérales.</p><p class="lab">Prévention primaire</p><p>L’ESGE 2022 recommande un bêtabloquant non sélectif, de préférence le carvédilol, chez le patient compensé avec hypertension portale cliniquement significative ; la ligature est l’alternative si le bêtabloquant est impossible.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2022_a-1939-4887.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie variqueuse œsogastrique, Endoscopy 2022;54:1094-1120</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-uree" data-title="Urée et hémorragie haute"><p class="lab">Mécanisme</p><p>Les protéines du sang sont digérées puis transformées en urée par le foie ; l’hypoperfusion rénale s’y ajoute.</p><p class="lab">Valeur</p><p>L’urée est une composante du score de Glasgow-Blatchford ; un rapport urée/créatinine élevé est cité par la BSG comme indice d’origine haute.</p><p class="lab">Piège</p><p>Une insuffisance rénale préexistante élève aussi l’urée : l’interprétation tient compte de la créatinine antérieure.</p><p class="src">Références : <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></template>
<template data-pop="k92-ains-aspirine" data-title="AINS et aspirine"><p class="lab">Mécanisme</p><p>L’inhibition de la cyclo-oxygénase réduit les prostaglandines muqueuses protectrices ; l’aspirine inhibe en outre l’agrégation plaquettaire de façon irréversible pour la durée de vie des plaquettes (5 à 7 jours).</p><p class="lab">Conséquence</p><p>Le risque d’ulcère et de saignement augmente ; l’association à un anticoagulant ou à un second antiagrégant l’accroît encore.</p><p class="lab">Conduite</p><p>Arrêter l’AINS ; garder l’aspirine de prévention secondaire ; associer un IPP si l’antithrombotique est poursuivi.</p><p class="src">Références : <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k92-hematemese" data-title="Hématémèse"><p class="lab">Définition</p><p>Vomissement de sang rouge ou de sang digéré (marc de café).</p><p class="lab">Valeur</p><p>Elle signe une source haute. Le sang rouge abondant suggère un saignement actif ; chez le cirrhotique, il fait évoquer des varices.</p><p class="lab">Piège</p><p>Une épistaxis déglutie ou une hémoptysie peuvent simuler une hématémèse ; le contexte et l’examen ORL ou pulmonaire tranchent.</p></template>
<template data-pop="k92-melena" data-title="Méléna"><p class="lab">Définition</p><p>Selles noires, goudronneuses et fétides.</p><p class="lab">Mécanisme</p><p>L’hème est oxydé et transformé pendant un transit de plusieurs heures.</p><p class="lab">Piège</p><p>Le fer oral et le bismuth noircissent les selles sans leur donner l’aspect goudronneux ni l’odeur du méléna ; le toucher rectal permet de juger.</p></template>
<template data-pop="k92-hemodynamique" data-title="Paramètres hémodynamiques et indice de choc"><p class="lab">Technique</p><p>Mesurer fréquence cardiaque et pression artérielle, répéter, calculer l’indice de choc (fréquence/pression systolique).</p><p class="lab">Valeur</p><p>Un indice > 1 après réanimation définit l’hémorragie basse instable (BSG) et prédit une extravasation à l’angiographie.</p><p class="lab">Piège</p><p>Bêtabloquants et stimulateurs cardiaques limitent la tachycardie ; l’indice doit alors être interprété avec prudence.</p><p class="src">Références : <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></template>
<template data-pop="k92-signes-cirrhose" data-title="Signes d’hépatopathie chronique"><p class="lab">Signes</p><p>Ascite, ictère, angiomes stellaires, érythrose palmaire, circulation veineuse collatérale abdominale, astérixis.</p><p class="lab">Conséquence</p><p>Leur présence fait traiter l’hémorragie comme variqueuse jusqu’à l’endoscopie : vasoactif et antibiotique sans attendre.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-toucher-rectal" data-title="Toucher rectal"><p class="lab">Technique</p><p>Examen du canal anal, recherche d’une masse, observation du doigtier : sang rouge, sang noir, selles normales.</p><p class="lab">Valeur</p><p>Il confirme un méléna ou une hématochézie et fait partie du score d’Oakland ; la BSG recommande aussi l’inspection de l’anus et du rectum chez tout patient.</p><p class="lab">Piège</p><p>Attribuer une hémorragie abondante à des hémorroïdes avant d’avoir exclu une autre cause.</p><p class="src">Références : <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></template>
<template data-pop="k92-transfusion" data-title="Transfusion restrictive"><p class="lab">Principe</p><p>Transfuser à un seuil bas évite l’excès de volume et, chez le cirrhotique, la hausse de la pression portale.</p><p class="lab">Seuils</p><p>ESGE 2021 : ≤ 70 g/L, cible 70 à 90 g/L sans maladie cardiovasculaire ; ≤ 80 g/L, cible ≥ 100 g/L avec maladie cardiovasculaire. Baveno VII : cible 70 à 80 g/L dans l’hémorragie variqueuse, en tenant compte de l’âge, du cœur et du saignement en cours.</p><p class="lab">Preuve</p><p>Dans les méta-analyses reprises par l’ESGE, la stratégie restrictive était associée à une mortalité plus basse (risque relatif 0,65).</p><p class="lab">Limite</p><p>Le choc hémorragique massif relève d’un protocole de transfusion massive, non de ces seuils.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-antithrombotiques" data-title="Antithrombotiques pendant et après l’hémorragie"><p class="lab">Aspirine</p><p>Prévention secondaire : maintenue ; reprise en 3 à 5 jours si arrêtée. Prévention primaire : interrompue, indication réévaluée.</p><p class="lab">Double antiagrégation</p><p>Aspirine maintenue ; second antiagrégant repris de préférence dans les 5 jours, avec avis cardiologique.</p><p class="lab">Anticoagulants</p><p>Antivitamine K suspendue, antagonisée par vitamine K et concentré de complexe prothrombinique en cas d’instabilité. Anticoagulant oral direct suspendu ; antidote (idarucizumab pour le dabigatran) en cas d’hémorragie menaçante. Reprise de préférence vers 7 jours selon le risque thromboembolique.</p><p class="lab">Haut risque thrombotique</p><p>Valve mécanique mitrale, fibrillation atriale avec valve ou sténose mitrale, thrombose veineuse de moins de 3 mois : la BSG propose une héparine de bas poids moléculaire vers 48 heures.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></template>
<template data-pop="k92-gbs" data-title="Score de Glasgow-Blatchford"><p class="lab">Composantes</p><p>Urée, hémoglobine (selon le sexe), pression systolique, fréquence cardiaque, méléna, syncope, hépatopathie, insuffisance cardiaque. Il n’exige pas d’endoscopie.</p><p class="lab">Valeur</p><p>Un score ≤ 1 identifie un très faible risque ; dans une cohorte internationale de 3012 patients, ce seuil prédisait la survie sans geste hospitalier avec une sensibilité de 98,6 % et une spécificité de 34,6 % (ESGE 2021).</p><p class="lab">Limite</p><p>Sa spécificité est faible : il sert à faire sortir les patients à très bas risque, non à prédire la mortalité.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://doi.org/10.1016/S0140-6736(00)02816-6" target="_blank" rel="noopener">Blatchford O. et al., Lancet 2000;356:1318-1321</a>.</p></template>
<template data-pop="k92-oakland" data-title="Score d’Oakland"><p class="lab">Composantes</p><p>Âge, sexe, hospitalisation antérieure pour hémorragie basse, toucher rectal, fréquence cardiaque, pression systolique, hémoglobine.</p><p class="lab">Valeur</p><p>Un score ≤ 8 points correspond à 95 % de probabilité de sortie sûre.</p><p class="lab">Limite</p><p>Validé au Royaume-Uni ; non testé dans d’autres populations au moment de la recommandation.</p><p class="src">Références : <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></template>
<template data-pop="k92-child" data-title="Child-Pugh et MELD"><p class="lab">Child-Pugh</p><p>Bilirubine, albumine, temps de prothrombine, ascite, encéphalopathie ; classes A, B et C.</p><p class="lab">Valeur dans l’hémorragie</p><p>La classe C, le MELD et l’échec de l’hémostase primaire prédisent la mortalité à six semaines (Baveno VII, énoncé 6.15) ; la classe de Child-Pugh définit l’indication du TIPS préemptif.</p><p class="lab">Limite</p><p>Au-delà de 14 points de Child-Pugh, ou avec un MELD > 30 et un lactate > 12 mmol/L, le TIPS peut être futile sauf transplantation proche (énoncé 6.31).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-erythromycine" data-title="Érythromycine avant l’endoscopie"><p class="lab">Mécanisme</p><p>Agoniste des récepteurs de la motiline, elle accélère la vidange gastrique et améliore la visibilité.</p><p class="lab">Indication</p><p>ESGE 2021 : patients sélectionnés avec saignement grave ou actif. Baveno VII : 250 mg intraveineux 30 à 120 minutes avant l’endoscopie, en l’absence d’allongement du QT.</p><p class="lab">Risques</p><p>Allongement du QT ; interaction avec la simvastatine (rhabdomyolyse). En Suisse, cet usage sort des indications anti-infectieuses de l’information professionnelle.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-forrest" data-title="Classification de Forrest"><p class="lab">Stades</p><p>Ia : saignement en jet. Ib : suintement. IIa : vaisseau visible non hémorragique. IIb : caillot adhérent. IIc : tache pigmentée plane. III : fond propre.</p><p class="lab">Conduite</p><p>Ia, Ib et IIa : hémostase endoscopique. IIb : retrait du caillot envisagé, puis traitement de la lésion sous-jacente. IIc et III : pas d’hémostase ; sortie accélérée possible dans certains contextes.</p><p class="lab">Méthode</p><p>Saignement actif : adrénaline plus seconde méthode (thermique de contact ou mécanique). Vaisseau visible : thermique, mécanique ou sclérosant, seul ou avec adrénaline.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k92-recidive" data-title="Récidive après hémostase"><p class="lab">Définition</p><p>Saignement survenant après une hémostase endoscopique initialement réussie (ESGE).</p><p class="lab">Conduite</p><p>Nouvelle endoscopie avec hémostase, éventuellement par clip monté sur capuchon ; en cas d’échec, embolisation artérielle ; chirurgie si l’embolisation n’est pas disponible ou échoue.</p><p class="lab">Piège</p><p>Une seconde endoscopie systématique sans signe de récidive n’est pas recommandée.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k92-vasoactifs" data-title="Médicaments vasoactifs"><p class="lab">Mécanisme</p><p>Ils réduisent le débit sanguin splanchnique et donc la pression portale.</p><p class="lab">Place</p><p>À débuter dès la suspicion d’hémorragie variqueuse et à poursuivre 2 à 5 jours (Baveno VII, énoncé 6.5, preuve A).</p><p class="lab">Choix en Suisse</p><p>Terlipressine (Glypressine®) ou octréotide (Sandostatine®), selon les informations professionnelles ; voir l’onglet Pharmacologie.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-antibioprophylaxie" data-title="Antibioprophylaxie du cirrhotique"><p class="lab">Pourquoi</p><p>Les infections bactériennes sont fréquentes chez le cirrhotique qui saigne et aggravent le pronostic ; l’antibioprophylaxie fait partie intégrante du traitement (énoncé 6.7, preuve A).</p><p class="lab">Schéma</p><p>Ceftriaxone 1 g/24 h intraveineux chez le patient avec cirrhose avancée, en accord avec l’écologie locale (énoncé 6.9).</p><p class="lab">Limite</p><p>Chez le Child-Pugh A, le risque est très faible ; l’abstention n’est pas encore validée (énoncé 6.8).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-ligature" data-title="Ligature élastique des varices"><p class="lab">Technique</p><p>Un anneau élastique est placé à la base de la varice aspirée dans un capuchon ; la varice thrombose puis s’élimine.</p><p class="lab">Place</p><p>Traitement endoscopique recommandé de l’hémorragie variqueuse œsophagienne aiguë (Baveno VII, preuve A) ; puis ligatures toutes les 1 à 4 semaines jusqu’à éradication (ESGE 2022).</p><p class="lab">Limite</p><p>Les varices gastriques isolées relèvent de la colle tissulaire.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2022_a-1939-4887.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie variqueuse œsogastrique, Endoscopy 2022;54:1094-1120</a>.</p></template>
<template data-pop="k92-tips" data-title="TIPS préemptif"><p class="lab">Principe</p><p>Une endoprothèse couverte placée par voie jugulaire relie une branche portale à une veine sus-hépatique et supprime la résistance intrahépatique.</p><p class="lab">Indication</p><p>Dans les 72 heures (idéalement < 24 h) : Child-Pugh C < 14, ou Child-Pugh B > 7 avec saignement actif, ou gradient > 20 mmHg (Baveno VII, énoncé 6.27). Ni l’insuffisance hépatique aiguë sur chronique, ni l’encéphalopathie, ni l’hyperbilirubinémie à l’admission ne sont des contre-indications (énoncé 6.28).</p><p class="lab">Sauvetage</p><p>En cas d’échec du traitement combiné, un TIPS couvert de sauvetage est la meilleure option (énoncé 6.30).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-angiotdm" data-title="Angio-tomodensitométrie"><p class="lab">Principe</p><p>Acquisition en phase artérielle qui montre une extravasation de produit de contraste.</p><p class="lab">Valeur</p><p>Sensibilité rapportée de 79 à 95 % et spécificité de 95 à 100 % ; elle explore tout le tube digestif sans préparation.</p><p class="lab">Conséquence</p><p>Positive : angiographie avec embolisation au plus vite. Négative chez un patient instable : endoscopie haute immédiate.</p><p class="src">Références : <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></template>
<template data-pop="k92-hp" data-title="Helicobacter pylori après un ulcère hémorragique"><p class="lab">Conduite</p><p>Recherche dès l’endoscopie initiale ; traitement s’il est présent ; nouveau test s’il est négatif dans l’épisode aigu ; documentation de l’éradication (ESGE 2021, recommandations fortes).</p><p class="lab">Pourquoi re-tester</p><p>Le saignement et l’IPP diminuent la sensibilité des tests pendant l’épisode aigu.</p><p class="lab">Lien</p><p>Le schéma d’éradication est traité dans le cours K25 — Ulcère de l’estomac.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k92-bio" data-title="Biologie initiale"><p class="lab">Contenu</p><p>Hémoglobine, plaquettes, urée, créatinine, ionogramme, groupe sanguin et recherche d’anticorps, temps de prothrombine et INR, tests hépatiques ; lactate en cas de choc.</p><p class="lab">Usage</p><p>Elle alimente les scores, prépare la transfusion et identifie la cirrhose.</p></template>
<template data-pop="k92-oeso" data-title="Œsogastroduodénoscopie"><p class="lab">Rôle</p><p>Gold standard : elle localise, classe (Forrest), traite et permet les biopsies.</p><p class="lab">Délai</p><p>Non variqueuse : ≤ 24 heures après réanimation ; variqueuse : ≤ 12 heures (Baveno VII).</p><p class="lab">Organisation</p><p>L’ESGE et Baveno VII recommandent un endoscopiste d’astreinte et une équipe disponible 24 heures sur 24.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></template>
<template data-pop="k92-capsule" data-title="Vidéocapsule du grêle"><p class="lab">Indication</p><p>Hémorragie manifeste avec endoscopies haute et basse de bonne qualité négatives.</p><p class="lab">Valeur</p><p>Rendement de 50 à 72 % ; jusqu’à 87 à 91,9 % dans les 48 heures ; sous 50 % au-delà de 3 jours.</p><p class="lab">Risque</p><p>Rétention de la capsule chez environ 2 % des patients explorés pour saignement du grêle.</p><p class="src">Références : <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></template>
<template data-pop="k92-d-ipp" data-title="Pantoprazole intraveineux"><p class="lab">Mécanisme</p><p>Inhibition irréversible de la pompe H⁺/K⁺-ATPase de la cellule pariétale.</p><p class="lab">Preuves</p><p>L’ESGE recommande le schéma forte dose après hémostase (recommandation forte, preuve de haute qualité).</p><p class="lab">Posologie</p><p>ESGE : 80 mg puis 8 mg/heure pendant 72 heures, ou bolus deux fois par jour. Information professionnelle suisse : 40 mg/jour pour l’ulcère ; 2 × 80 mg lorsqu’un contrôle rapide de la sécrétion acide est nécessaire.</p><p class="lab">Précautions</p><p>Risque de thrombophlébite en cas de perfusion prolongée par la même canule.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pantoprazol Nycomed® i.v., Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k92-d-terli" data-title="Terlipressine (Glypressine®)"><p class="lab">Mécanisme</p><p>Précurseur de la lysine-vasopressine ; vasoconstriction splanchnique par les récepteurs V1.</p><p class="lab">Indication suisse</p><p>Traitement aigu des varices œsophagiennes hémorragiques.</p><p class="lab">Posologie</p><p>Plus de 50 kg : 1 à 2 mg toutes les 4 à 6 heures ; maximum 12 mg/jour pendant 36 heures puis 6 mg/jour ; au plus 5 jours.</p><p class="lab">Contre-indications et surveillance</p><p>Insuffisance coronaire, ischémie dans les 3 derniers mois, grossesse. Surveillance de la pression, de l’ECG, de la saturation, de la natrémie et de la kaliémie ; risque de QT long et de nécrose cutanée.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Glypressine®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k92-d-octreo" data-title="Octréotide (Sandostatine®)"><p class="lab">Mécanisme</p><p>Analogue de la somatostatine ; réduction du débit splanchnique, mécanisme exact non établi selon l’information professionnelle.</p><p class="lab">Indication suisse</p><p>Traitement d’urgence des hémorragies de varices gastro-œsophagiennes du cirrhotique, en association à un traitement endoscopique.</p><p class="lab">Posologie</p><p>0,025 mg/heure en perfusion continue pendant au maximum 5 jours ; une perfusion de 0,050 mg/h pendant 5 jours a été bien tolérée.</p><p class="lab">Surveillance</p><p>Glycémie : risque de diabète ou de modification des besoins en insuline après une hémorragie variqueuse.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Sandostatine®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
