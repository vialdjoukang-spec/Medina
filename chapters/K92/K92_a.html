<section class="ilot" id="k92-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 68 ans arrive aux urgences après deux selles noires et un malaise en se levant. Or, il prend de l’aspirine depuis un infarctus. De son côté, une femme de 55 ans atteinte de cirrhose vomit du sang rouge. Pourtant, <b>dans les deux cas, la première question n’est pas « où saigne-t-il ? » mais « que reste-t-il de sa volémie ? ».</b> La localisation vient ensuite, et elle conditionne l’endoscopie, les médicaments et la reprise des antithrombotiques.</p><p>Pour y parvenir, le médecin doit savoir : reconnaître une hémorragie grave et réanimer ; distinguer une hémorragie haute d’une hémorragie basse ; reconnaître le contexte de cirrhose qui change tout le traitement ; stratifier le risque par un score validé ; choisir le délai de l’endoscopie ; gérer l’aspirine, les antiagrégants et les anticoagulants ; prévenir la récidive.</p><div class="key"><b>Point de départ.</b> Deux distinctions guident tout le cours : l’hémorragie est-elle <button class="w" data-k="k92-haute-basse">haute ou basse (le repère anatomique et ses limites)</button>, et le patient saigne-t-il dans le cadre d’une <button class="w" data-k="k92-cirrhose-contexte">cirrhose (pourquoi la conduite change)</button> ?</div></section>
<section class="ilot" id="k92-1"><h2><span class="n">1</span>Définitions et classification</h2><p>Avant de traiter, il faut nommer précisément ce que l’on observe. L’<b>hématémèse</b> est un vomissement de sang rouge ou de sang digéré, d’aspect « marc de café ». De même, le <b>méléna</b> est l’émission par l’anus de selles noires, goudronneuses et fétides : le sang a séjourné dans le tube digestif et l’hémoglobine a été dégradée. Enfin, l’<b><button class="w" data-k="k92-hematochezie">hématochézie</button></b> est l’émission de sang rouge ou foncé par l’anus, pur ou mêlé aux selles.</p><p>À partir de ces signes, la classification utile au lit du malade est anatomique et étiologique. Ainsi, une hémorragie est dite <b>haute</b> quand sa source se situe en amont de l’angle duodéno-jéjunal ; elle est <b>basse</b> en aval. Ensuite, parmi les hémorragies hautes, la distinction <b>variqueuse</b> ou <b>non variqueuse</b> est décisive, car l’hypertension portale impose des médicaments vasoactifs, une antibioprophylaxie et une <button class="w" data-k="k92-ligature">ligature</button>.</p><table class="t"><tr><th>Présentation</th><th>Source habituelle</th><th>Conséquence immédiate</th></tr><tr><td>Hématémèse, marc de café</td><td>Haute</td><td>Endoscopie haute après réanimation</td></tr><tr><td>Méléna</td><td>Haute le plus souvent ; parfois grêle ou côlon droit</td><td>Endoscopie haute en premier</td></tr><tr><td>Hématochézie avec choc</td><td>Basse, ou haute à débit massif</td><td>Angio-tomodensitométrie, puis endoscopie haute si elle est négative</td></tr><tr><td>Hématochézie sans retentissement</td><td>Basse (diverticules, lésions anorectales)</td><td>Toucher rectal, <button class="w" data-k="k92-oakland">score d’Oakland</button>, coloscopie</td></tr></table><p>Le tableau se lit par la colonne de droite : une hématochézie associée à un état de choc ne doit jamais être classée trop vite comme basse. En effet, la BSG rappelle que 11 à 15 % des hémorragies initialement crues basses ont finalement une source haute. Par exemple, exemple : un patient sous antiagrégant, en choc, avec du sang rouge par l’anus et un rapport urée/créatinine élevé, saigne probablement d’un ulcère duodénal.</p><div class="key"><b>À retenir.</b> La couleur des selles oriente sans localiser. Un état de choc avec hématochézie impose d’exclure une source haute.</div><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></section>
<section class="ilot" id="k92-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>Ces définitions posées, la fréquence des causes oriente la démarche. Les causes les plus fréquentes d’hémorragie digestive haute sont non variqueuses : ulcères gastriques et duodénaux, lésions érosives de l’œsophage, de l’estomac ou du duodénum, cancers, <button class="w" data-k="k92-mallory">syndrome de Mallory-Weiss</button>, <button class="w" data-k="k92-dieulafoy">lésion de Dieulafoy</button> ; une partie reste sans cause identifiée (ESGE 2021). Quant à elle, l’hémorragie basse a une incidence estimée de 33 à 87 pour 100 000 habitants ; sa cause la plus fréquente au Royaume-Uni est le <button class="w" data-k="k92-diverticule">saignement diverticulaire</button>, suivi des lésions anorectales bénignes (BSG 2019).</p><p>Cependant, la mortalité dépend surtout du terrain. Ainsi, dans l’audit britannique de l’hémorragie basse, la mortalité hospitalière était de 3,4 % ; elle atteignait 18 % quand le saignement survenait chez un patient déjà hospitalisé et 20 % au-delà de quatre culots transfusés. Autrement dit, elle était liée aux comorbidités davantage qu’à l’exsanguination. De même, chez le cirrhotique, la mortalité à six semaines est le critère de référence ; la classe C de <button class="w" data-k="k92-child">Child-Pugh</button>, le score MELD et l’échec de l’hémostase primaire la prédisent le mieux (<button class="w" data-k="k92-baveno">Baveno VII</button>, énoncé 6.15).</p><div class="trap"><span class="k">Lacune documentaire</span>Aucune série nationale suisse consolidée de l’incidence des hémorragies digestives n’a été retrouvée lors de la rédaction ; les chiffres cités sont européens et britanniques, datés et attribués.</div><div class="key"><b>À retenir.</b> Le pronostic dépend du terrain (âge, comorbidités, cirrhose) et de l’échec de l’hémostase, plus que du volume initial apparent.</div><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></section>
<section class="ilot" id="k92-3"><h2><span class="n">3</span>Physiopathologie : de la lésion au choc</h2><p>Pour comprendre ces chiffres, il faut suivre le saignement de la lésion jusqu’au choc. Normalement, la muqueuse gastroduodénale résiste à l’acide grâce au mucus, aux bicarbonates et à un flux sanguin muqueux abondant. Lorsque cette barrière cède, un <button class="w" data-k="k92-ulcere-mecanisme">ulcère (rupture de la barrière muqueuse)</button> creuse la paroi jusqu’à la sous-muqueuse : s’il ouvre une artère de la paroi, le saignement peut être artériel et abondant. De plus, le pH acide inhibe l’agrégation plaquettaire et favorise la lyse du caillot ; c’est la base de l’<button class="w" data-k="k92-ipp-caillot">inhibition acide à forte dose (stabiliser le caillot)</button>.</p><p>Le mécanisme est différent dans la cirrhose. Dans la cirrhose, la résistance intrahépatique et l’afflux splanchnique élèvent la pression portale. Dès lors, des <button class="w" data-k="k92-varices">varices œsophagiennes (collatérales portosystémiques)</button> se développent et peuvent se rompre. Or, la rupture est un problème de pression, non de coagulation : <button class="w" data-k="k92-baveno">Baveno VII</button> précise que le traitement doit abaisser la pression portale plutôt que corriger les tests de coagulation (énoncé 6.34).</p><p>Quelle que soit la cause, la perte sanguine réduit le retour veineux. Au début, la tachycardie et la vasoconstriction maintiennent d’abord la pression artérielle ; l’hypotension est un signe tardif. C’est pourquoi l’hémoglobine initiale peut rester normale parce que l’hémodilution n’a pas encore eu lieu. <button class="w" data-k="k92-uree">L’urée s’élève (digestion et réabsorption des protéines du sang)</button> dans les hémorragies hautes.</p><figure><img src="data:image/gif;base64,R0lGODdhWAKYAYYAAP///////v///f//+/7//v/+//7+//7+/v3+//79//7+/f3+/f39/f78/f79+/769Pz9/fz8/vz8/Pv8/fv8+vv7/Pr7/Pv7+Pr6+/v5+/v59fn6+vn5+fj4+Pf39/f29/X19vf18PXy8fnt3PHx8 <section class="ilot" id="k92-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2><p>De ces mécanismes découle la recherche de la cause. Le contexte oriente fortement la cause. C’est pourquoi le médecin recherche une prise d’<button class="w" data-k="k92-ains-aspirine">AINS ou d’aspirine (toxicité muqueuse)</button>, un traitement anticoagulant ou antiagrégant, une infection connue à <button class="w" data-k="k92-hp">Helicobacter pylori</button>, une cirrhose ou une consommation d’alcool, des vomissements répétés avant l’hématémèse, une chirurgie aortique ou une polypectomie récente.</p><table class="t"><tr><th>Situation</th><th>Cause à évoquer en premier</th><th>Indice qui la soutient</th></tr><tr><td>Prise d’AINS ou d’aspirine, épigastralgies</td><td>Ulcère gastroduodénal</td><td>Méléna, antécédent d’ulcère</td></tr><tr><td>Cirrhose, ascite, angiomes stellaires</td><td>Rupture de varices</td><td>Hématémèse abondante, encéphalopathie</td></tr><tr><td>Vomissements répétés puis sang rouge</td><td>Syndrome de Mallory-Weiss</td><td>Consommation d’alcool, effort de vomissement</td></tr><tr><td>Sujet âgé, <button class="w" data-k="k92-hematochezie">hématochézie</button> indolore</td><td><button class="w" data-k="k92-diverticule">Diverticule</button>, <button class="w" data-k="k92-angiodysplasie">angiodysplasie</button></td><td>Absence de douleur, épisodes antérieurs</td></tr><tr><td>Polypectomie récente</td><td>Saignement post-polypectomie</td><td>Délai de quelques jours, source connue</td></tr><tr><td>Prothèse aortique</td><td>Fistule aorto-digestive</td><td>Petit saignement « sentinelle » puis massif</td></tr></table><p>Toutefois, le tableau ne remplace pas l’endoscopie, mais il hiérarchise : un patient cirrhotique qui saigne est traité comme une hémorragie variqueuse jusqu’à preuve du contraire, même si un ulcère reste possible. Enfin, la <button class="w" data-k="k92-fistule">fistule aorto-digestive</button> est rare ; la BSG la cite comme une des exceptions où l’on peut aller directement au bloc.</p><div class="key"><b>À retenir.</b> Antithrombotiques, AINS et cirrhose sont les trois questions d’anamnèse qui changent immédiatement la conduite.</div><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></section>
<section class="ilot" id="k92-5"><h2><span class="n">5</span>Anamnèse</h2><p>La recherche de la cause commence par l’interrogatoire. L’anamnèse est brève chez un patient instable ; elle se complète après la réanimation. Ensuite, elle précise l’<button class="w" data-k="k92-hematemese">hématémèse (sang rouge ou marc de café)</button>, le <button class="w" data-k="k92-melena">méléna (sang digéré)</button> ou l’<button class="w" data-k="k92-hematochezie">hématochézie</button>, la date de début, un malaise ou une syncope, et les antécédents d’ulcère, de cirrhose ou de saignement.</p><p>Par ailleurs, la liste des médicaments est lue en détail : aspirine et sa raison (prévention primaire ou secondaire), second antiagrégant et date d’un éventuel stent coronaire, antivitamine K, anticoagulant oral direct et heure de la dernière prise, AINS, corticostéroïdes, inhibiteurs sélectifs de la recapture de la sérotonine. En effet, ces informations décident plus tard de la reprise des traitements.</p><div class="two"><div class="card"><b>Forme typique haute</b><p>Le patient sous aspirine ou AINS présente des épigastralgies, un méléna et un malaise orthostatique, car l’ulcère saigne dans l’estomac et la perte de volume fait chuter la pression en position debout.</p></div><div class="card"><b>Formes trompeuses</b><p>Une hématochézie massive peut venir d’une source haute, car un débit élevé accélère le transit. À l’inverse, un méléna peut venir du grêle ou du côlon droit. De plus, une syncope peut précéder tout signe digestif, et une anémie ferriprive peut révéler un saignement invisible.</p></div></div><div class="key"><b>À retenir.</b> L’indication de chaque antithrombotique et l’heure de la dernière prise sont notées dès l’admission.</div><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></section>
<section class="ilot" id="k92-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen physique prolonge l’interrogatoire. L’examen commence par l’état général et les <button class="w" data-k="k92-hemodynamique">paramètres hémodynamiques (fréquence cardiaque, pression, indice de choc)</button>. À cet égard, l’indice de choc est la fréquence cardiaque divisée par la pression artérielle systolique ; au-dessus de 1, la BSG classe l’hémorragie basse comme instable. Le médecin cherche ensuite les <button class="w" data-k="k92-signes-cirrhose">signes d’hépatopathie chronique (ascite, angiomes, ictère)</button> et pratique un <button class="w" data-k="k92-toucher-rectal">toucher rectal (voir la couleur des selles)</button>.</p><div class="two"><div class="card"><b>État général et vitaux</b><p>Le médecin recherche une pâleur, des sueurs, une confusion et un temps de recoloration allongé, car ils traduisent une hypoperfusion ; il mesure aussi la fréquence cardiaque, la pression artérielle couchée et la diurèse, qui suivent l’effet du remplissage.</p></div><div class="card"><b>Signes ciblés</b><p>Une ascite, une circulation veineuse collatérale ou un astérixis orientent vers une cirrhose, donc vers des varices. De plus, une douleur épigastrique évoque un ulcère, et une défense abdominale fait craindre une perforation associée.</p></div></div><div class="trap"><span class="k">Piège</span>Un bêtabloquant masque la tachycardie : l’indice de choc doit alors être interprété avec prudence, comme le précise la BSG.</div><div class="key"><b>À retenir.</b> Les signes vitaux répétés et le toucher rectal sont les deux gestes d’examen qui modifient le plus la décision initiale.</div><p class="src">Références : <a href="https://gut.bmj.com/content/68/5/776" target="_blank" rel="noopener">Oakland K. et al., BSG, hémorragie digestive basse aiguë, Gut 2019;68:776-789</a>.</p></section>
<section class="ilot" id="k92-7"><h2><span class="n">7</span>Urgence : réanimer avant de localiser</h2><div class="alert"><b>Gravité d’abord.</b> Ces premiers éléments recueillis, la réanimation passe avant toute localisation. Le médecin évalue immédiatement l’hémodynamique. Ainsi, en cas d’instabilité, il remplit d’abord par des cristalloïdes (ESGE 2021). En outre, la transfusion est <b>restrictive</b> : sans maladie cardiovasculaire, on transfuse sous 70 g/L et on vise 70 à 90 g/L ; en cas de maladie cardiovasculaire aiguë ou chronique, on transfuse sous 80 g/L et on vise au moins 100 g/L (ESGE 2021). En revanche, dans l’hémorragie variqueuse, <button class="w" data-k="k92-baveno">Baveno VII</button> vise 70 à 80 g/L, car une transfusion libérale augmente la pression portale. Enfin, le patient qui vomit du sang avec une conscience altérée est intubé avant l’endoscopie (Baveno VII, énoncé 6.3).</div><p>Sur le plan des preuves, la <button class="w" data-k="k92-transfusion">stratégie restrictive (pourquoi moins de sang protège)</button> est l’un des acquis majeurs : dans les essais repris par l’ESGE, elle réduisait la mortalité par rapport à une stratégie libérale. Parallèlement, les <button class="w" data-k="k92-antithrombotiques">antithrombotiques (arrêter, maintenir, antagoniser)</button> sont gérés dès l’admission : l’aspirine de prévention secondaire n’est pas interrompue ; l’antivitamine K est suspendue et, en cas d’instabilité, antagonisée par vitamine K à faible dose et concentré de complexe prothrombinique, sans retarder l’endoscopie.</p><p>À l’inverse, L’ESGE ne recommande ni l’<button class="w" data-k="k92-tranexamique">acide tranexamique</button> ni la transfusion systématique de plaquettes chez le patient sous antiagrégant. De même, Baveno VII déconseille le <button class="w" data-k="k92-pfc">plasma frais congelé</button> dans l’hémorragie variqueuse : il ne corrige pas l’hémostase et aggrave la surcharge volémique.</p><div class="key"><b>À retenir.</b> Pendant la première heure, le médecin remplit, transfuse peu, protège les voies aériennes et ne donne pas d’acide tranexamique.</div><button class="pareto-btn ui" data-k="pareto-k92-urgence">▲ Loi de Pareto — Reconnaître et réanimer</button><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII, J Hepatol 2022;76:959-974, énoncés 6.1 à 6.38</a>.</p></section>
