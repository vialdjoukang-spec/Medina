<p>Dans cette <b>vignette fictive</b>, un homme de 76 ans consulte pour un tremblement des mains au repos, un ralentissement des gestes et une marche moins ample. Ces troubles sont apparus en trois semaines. Le patient a reçu un antiémétique à base de métoclopramide pour des nausées persistantes ; sa liste de médicaments comprend aussi un anticalcique pris depuis des années. Aucune valeur chiffrée n’est utile ici : la vignette sert à poser la question de départ.</p>
<p>Devant un syndrome parkinsonien, la question pratique est : <b>s’agit-il d’une maladie de Parkinson ou d’un parkinsonisme secondaire, souvent réversible ou évitable ?</b> Cette question précède toute prescription de lévodopa. L’interrogatoire recherche d’abord une encéphalite ancienne, un traumatisme crânio-cérébral, un toxique et surtout un médicament antidopaminergique. Les neuroleptiques, mais aussi des antiémétiques courants, appartiennent à cette dernière catégorie <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger, Revue Médicale Suisse 2018)</a>.</p>
<p>Le cours répond à cinq objectifs. Reconnaître un parkinsonisme secondaire et ses principales causes ; distinguer le parkinsonisme médicamenteux de la maladie de Parkinson ; identifier le <button class="w" data-k="g21-delphi">syndrome malin des neuroleptiques (critères et urgence)</button> ; connaître les trois sous-types du <button class="w" data-k="g21-vasc">parkinsonisme vasculaire (recommandation de Rektor)</button> ; utiliser les médicaments suisses selon leur information professionnelle, y compris leurs limites d’indication.</p>
<div class="key"><b>À retenir.</b> Un syndrome parkinsonien n’est pas un diagnostic mais un tableau moteur. Avant de nommer une maladie de Parkinson, le médecin passe en revue les médicaments, les antécédents neurologiques et les signes qui sortent du cadre habituel.</div>
</section>

<section class="ilot" id="g21-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>Le <b>syndrome parkinsonien</b>, ou parkinsonisme moteur, associe une <button class="w" data-k="g21-mds">bradykinésie (définition et critères MDS)</button> à un tremblement de repos ou à une rigidité, selon les critères de la <a href="https://pubmed.ncbi.nlm.nih.gov/26474316/" target="_blank" rel="noopener">Movement Disorder Society (Postuma et collaborateurs, 2015)</a>. La bradykinésie de la maladie de Parkinson se reconnaît au <b>décrément</b> : lors de gestes répétés, la vitesse et l’amplitude diminuent progressivement. Ce décrément la distingue d’un ralentissement dépressif ou pyramidal <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger, 2018)</a>.</p>
<p>La <b>maladie de Parkinson</b> est une bradykinésie, classiquement asymétrique, avec rigidité ou tremblement de repos. L’asymétrie persiste même aux stades avancés. Son diagnostic définitif est anatomopathologique : perte des neurones dopaminergiques de la substance noire pars compacta et présence de corps de Lewy, agrégats d’alpha-synucléine <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger, 2018)</a>.</p>
<p>Un <b>parkinsonisme secondaire</b> est dû à une cause identifiable : médicament, toxique, lésion vasculaire ou encéphalite <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger, 2018)</a>. La CIM-10-GM 2024 le classe sous la catégorie G21 et réserve G20 au syndrome parkinsonien primaire <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM)</a>. Ce cours regroupe les causes en six familles, qui structurent la suite de la monographie.</p>
<table class="t"><thead><tr><th>Famille</th><th>Exemple central</th><th>Particularité clinique</th></tr></thead><tbody>
<tr><td>Médicamenteuse</td><td>Antipsychotique, métoclopramide</td><td>Cause secondaire la plus fréquente ; souvent réversible</td></tr>
<tr><td>Syndrome malin des neuroleptiques</td><td>Fièvre, rigidité, confusion</td><td>Urgence vitale</td></tr>
<tr><td>Toxique</td><td>Manganèse, monoxyde de carbone</td><td>Atteinte pallidale ; évolution parfois retardée</td></tr>
<tr><td>Post-encéphalitique</td><td>Encéphalite léthargique de 1917–1920</td><td>Modèle historique ; terme à ne pas étendre aux cas sporadiques</td></tr>
<tr><td>Vasculaire</td><td>Infarctus nigral ou petits vaisseaux</td><td>Trois sous-types ; mauvaise réponse à la lévodopa dans la forme insidieuse</td></tr>
<tr><td>Autres</td><td>Hydrocéphalie à pression normale, parkinsonisme fonctionnel</td><td>Catégories du registre genevois</td></tr></tbody></table>
<p>Ce tableau fixe l’ordre de lecture du cours. Chaque ligne reçoit plus loin sa physiopathologie, ses examens et sa conduite. La cause médicamenteuse est placée en tête parce qu’elle est à la fois la plus fréquente et la plus accessible à une action immédiate. Le rattachement de l’hydrocéphalie à pression normale à une catégorie précise de la CIM n’a pas été vérifié à la source ; le cours la traite comme un diagnostic différentiel et comme une cause relevée par le registre genevois.</p>
<div class="trap"><span class="k">Piège de libellé</span> Le libellé français officiel du code G21.4 parle de « maladie de Parkinson vasculaire », alors que le libellé allemand dit « syndrome ». Il ne s’agit pas d’une maladie de Parkinson : la lésion est vasculaire, le substrat nigrostrié est souvent préservé et la réponse à la lévodopa est inconstante <a href="https://pubmed.ncbi.nlm.nih.gov/29310988/" target="_blank" rel="noopener">(Rektor et collaborateurs, 2018)</a>.</div>
<div class="key"><b>À retenir.</b> Parkinsonisme est le nom d’un tableau moteur ; la maladie de Parkinson n’en est qu’une cause. Les parkinsonismes secondaires se classent par mécanisme, ce qui oriente la réversibilité.</div>

<section class="ilot" id="g21-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>L’étude populationnelle de l’<button class="w" data-k="g21-geneve">épidémiologie genevoise (2003–2012)</button> décrit 1235 patients vivants avec un syndrome parkinsonien. Parmi eux, 80 % ont un parkinsonisme dégénératif et 20 % un parkinsonisme non dégénératif. Dans ce second groupe, la cause médicamenteuse représente 43,4 % des cas, la cause vasculaire 37 %, l’hydrocéphalie à pression normale 5,1 % et le parkinsonisme psychiatrique ou fonctionnel 3,8 % <a href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">(Fleury et collaborateurs, 2018)</a>.</p>
<p>La lecture est la suivante : environ un syndrome parkinsonien sur cinq n’est pas dégénératif, et près de huit parkinsonismes non dégénératifs sur dix sont médicamenteux ou vasculaires. Cette répartition justifie de chercher ces deux causes systématiquement. Le chiffre de prévalence de la maladie de Parkinson, publié dans le résumé de l’étude (183 pour 100 000 habitants, incidence de 20 pour 100 000 par an), n’a pas pu être vérifié dans le texte intégral : l’unité figure mal dans le résumé consulté.</p>
<p>Le parkinsonisme médicamenteux est la deuxième cause de parkinsonisme après la maladie de Parkinson <a href="https://pubmed.ncbi.nlm.nih.gov/24935237/" target="_blank" rel="noopener">(Brigo et collaborateurs, 2014)</a> et l’un des troubles du mouvement iatrogènes les plus fréquents <a href="https://pubmed.ncbi.nlm.nih.gov/39419777/" target="_blank" rel="noopener">(revue 2024)</a>. Chez les personnes traitées par antipsychotiques, sa prévalence est estimée entre 20 et 35 % environ <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">(Ward et Citrome, 2018)</a>.</p>
<p>Pour le <b>syndrome malin des neuroleptiques</b>, la cohorte nationale finlandaise de patients atteints de schizophrénie (1972–2017) retient une incidence de 1,99 pour 10 000 personnes-années, une mortalité de 4,7 % à 30 jours et de 15,1 % à un an, et une récidive de 4,2 % après réintroduction d’un antipsychotique (délai médian de 795 jours) <a href="https://pubmed.ncbi.nlm.nih.gov/34013325/" target="_blank" rel="noopener">(Guinart et collaborateurs, 2021)</a>.</p>
<p>Pour le <b>parkinsonisme vasculaire</b>, la recommandation de Rektor cite 3 à 5 % des parkinsonismes dans une série autopsique, 3 % de parkinsonisme incident en 5,2 ans chez 503 patients avec maladie des petits vaisseaux, et, parmi 28 cas confirmés à Queen Square, seulement 6 diagnostiqués du vivant <a href="https://pubmed.ncbi.nlm.nih.gov/29310988/" target="_blank" rel="noopener">(Rektor et collaborateurs, 2018)</a>. Ce dernier chiffre souligne la difficulté diagnostique clinique.</p>
<div class="trap"><span class="k">Population des chiffres</span> Le chiffre genevois décrit des patients vivants dans un canton ; les chiffres finlandais ne concernent que des patients schizophrènes. Aucun taux suisse du syndrome malin n’a été retrouvé : il ne faut pas transposer le taux finlandais à une autre population.</div>
<div class="key"><b>À retenir.</b> Environ 20 % des syndromes parkinsoniens genevois sont non dégénératifs ; la cause médicamenteuse domine, devant la cause vasculaire.</div>
<button class="pareto-btn ui" data-k="pareto-g21-epidemio">▲ Loi de Pareto — Épidémiologie</button>
</section>

<section class="ilot" id="g21-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le mouvement volontaire dépend d’un équilibre dans le striatum entre la dopamine, libérée par les terminaisons nigrostriées, et l’acétylcholine, libérée par des neurones striataux. Quand la dopamine manque, l’équilibre bascule en faveur de l’excitation cholinergique ; c’est la base du traitement anticholinergique <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle Akineton®, rubrique Propriétés)</a>. Toute cause de parkinsonisme secondaire agit par l’un des trois mécanismes du tableau suivant : blocage des récepteurs, déplétion de la dopamine ou destruction des structures nigrostriées ou de leurs connexions.</p>
<table class="t"><thead><tr><th>Mécanisme</th><th>Situation</th><th>Imagerie du transporteur de la dopamine</th></tr></thead><tbody>
<tr><td>Blocage des récepteurs dopaminergiques striataux</td><td>Antipsychotiques, métoclopramide</td><td>Normale</td></tr>
<tr><td>Déplétion présynaptique de dopamine</td><td>Réserpine, tétrabénazine</td><td>Normale</td></tr>
<tr><td>Destruction nigrostriée focale</td><td>Infarctus ou hémorragie nigrale</td><td>Anormale, congruente à la lésion</td></tr>
<tr><td>Déconnexion de boucles sans lésion nigrale</td><td>Maladie des petits vaisseaux</td><td>Généralement préservée</td></tr></tbody></table>
<p>Ce tableau explique pourquoi l’<button class="w" data-k="g21-datscan">DaTSCAN (scintigraphie du transporteur de la dopamine)</button> sépare le parkinsonisme médicamenteux de la maladie de Parkinson. Les terminaisons présynaptiques sont intactes quand les récepteurs sont seulement bloqués ou que la dopamine est seulement déplétée, alors qu’elles sont détruites dans la maladie dégénérative <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(Fleury, diapositives HUG 2018)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/24935237/" target="_blank" rel="noopener">(Brigo et collaborateurs, 2014)</a>.</p>
<h3>3.1 Parkinsonisme médicamenteux</h3>
<p>Les antipsychotiques et d’autres <button class="w" data-k="g21-bloqueurs">bloqueurs des récepteurs dopaminergiques (mécanisme et classes)</button> provoquent le syndrome par un blocage pharmacologique des récepteurs striataux <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">(Ward et Citrome, 2018)</a>. La réserpine et la tétrabénazine épuisent la dopamine avant sa libération <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a>. La conséquence clinique est un tremblement, une akinésie et une rigidité indiscernables de ceux de la maladie de Parkinson à l’examen <a href="https://pubmed.ncbi.nlm.nih.gov/39419777/" target="_blank" rel="noopener">(revue 2024)</a>.</p>
<h3>3.2 Syndrome malin des neuroleptiques</h3>
<p>Le syndrome malin résulte d’un blocage dopaminergique central, notamment hypothalamique, qui perturbe la thermorégulation, et dans les noyaux gris, qui provoque la rigidité <a href="https://pubmed.ncbi.nlm.nih.gov/42659566/" target="_blank" rel="noopener">(Ivarola et collaborateurs, 2026)</a>. Un état analogue survient à l’<button class="w" data-k="g21-sevrage">arrêt brutal de la lévodopa (équivalent par sevrage)</button> <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle Madopar®)</a>. Cette symétrie confirme le mécanisme : le dénominateur commun est une chute brutale de la neurotransmission dopaminergique.</p>
<h3>3.3 Parkinsonisme vasculaire</h3>
<p>Le sous-type <b>aigu</b> résulte d’un infarctus ou d’une hémorragie dans la substance noire ou la voie nigrostriée, par exemple dans les branches paramédianes mésencéphaliques ou lenticulostriées. Il produit un hémiparkinsonisme controlatéral avec un DaTSCAN anormal congruent à la lésion. Le sous-type <b>insidieux</b> procède de lésions diffuses de la substance blanche liées aux petits vaisseaux, qui déconnectent les boucles cortico-striato-thalamo-corticales et les systèmes de la marche, sans déficit nigrostrié focal ; le DaTSCAN est généralement préservé et la réponse à la lévodopa est mauvaise. La perte dopaminergique nigrostriée liée à l’âge, de 7 à 8 % par décennie, abaisse le seuil d’expression clinique <a href="https://pubmed.ncbi.nlm.nih.gov/29310988/" target="_blank" rel="noopener">(Rektor et collaborateurs, 2018)</a>.</p>
<h3>3.4 Causes toxiques et post-infectieuses</h3>
<p>Le <button class="w" data-k="g21-mn">manganèse (dépôt pallidal, sources d’exposition)</button> se dépose dans le globus pallidus et atteint la substance blanche ; dans la cirrhose, un shunt porto-systémique favorise son accumulation <a href="https://pubmed.ncbi.nlm.nih.gov/23678867/" target="_blank" rel="noopener">(Stepens et collaborateurs, 2013)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/42174344/" target="_blank" rel="noopener">(revue 2026)</a>. Après une <button class="w" data-k="g21-co">intoxication au monoxyde de carbone (syndrome retardé)</button>, jusqu’à la moitié des survivants adultes développent un syndrome neuropsychiatrique retardé avec lenteur, parkinsonisme et troubles cognitifs <a href="https://pubmed.ncbi.nlm.nih.gov/38415575/" target="_blank" rel="noopener">(Gustavsen et collaborateurs, 2024)</a>. Le parkinsonisme <button class="w" data-k="g21-encephalite">post-encéphalitique (encéphalite léthargique)</button> reste un modèle historique <a href="https://pubmed.ncbi.nlm.nih.gov/38745394/" target="_blank" rel="noopener">(Brainin et collaborateurs, 2024)</a>.</p>
<div class="key"><b>À retenir.</b> Le mécanisme détermine l’imagerie du transporteur de la dopamine et la réversibilité : récepteurs bloqués ou dopamine déplétée donnent une imagerie normale ; destruction nigrostriée donne une imagerie anormale.</div>

<section class="ilot" id="g21-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Le <button class="w" data-k="g21-medic-liste">tableau des médicaments à risque (classes et noms)</button> constitue la première information à mémoriser. Il provient des diapositives des Hôpitaux universitaires de Genève, d’après Shin et Chung 2012 <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(Fleury, 2018)</a>. Les classes le plus souvent en cause sont les antipsychotiques typiques et atypiques, les déplétants dopaminergiques, les antiémétiques antidopaminergiques et deux inhibiteurs calciques, la flunarizine et la cinnarizine.</p>
<table class="t"><thead><tr><th>Fréquence du risque</th><th>Classe</th><th>Exemples cités</th></tr></thead><tbody>
<tr><td>Fréquent</td><td>Antipsychotiques typiques</td><td>Chlorpromazine, halopéridol, pimozide, sulpiride</td></tr>
<tr><td>Fréquent</td><td>Antipsychotiques atypiques</td><td>Rispéridone, olanzapine, aripiprazole, flupentixol, ziprasidone</td></tr>
<tr><td>Fréquent</td><td>Déplétants dopaminergiques</td><td>Réserpine, tétrabénazine</td></tr>
<tr><td>Fréquent</td><td>Antiémétiques</td><td>Métoclopramide, lévosulpiride, clébopride</td></tr>
<tr><td>Fréquent</td><td>Inhibiteurs calciques</td><td>Flunarizine, cinnarizine</td></tr>
<tr><td>Moins fréquent</td><td>Autres</td><td>Clozapine, quétiapine, lithium, inhibiteurs sélectifs de la recapture de la sérotonine, valproate, phénytoïne, dompéridone, itopride</td></tr></tbody></table>
<p>La ligne « moins fréquent » ne signifie pas absence de risque. Les informations professionnelles suisses confirment trois points : le métoclopramide est contre-indiqué dans la maladie de Parkinson et les troubles extrapyramidaux, dont il peut aggraver la maladie <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle Paspertin®)</a> ; la tétrabénazine provoque très fréquemment un parkinsonisme et est contre-indiquée en cas de syndrome parkinsonien <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle Xenazine®)</a> ; l’association du lithium à un neuroleptique peut donner un syndrome encéphalopathique avec manifestations extrapyramidales, qui imite un syndrome malin <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle Lithiofor®)</a>.</p>
<p>Les <b>facteurs de risque du parkinsonisme médicamenteux</b> sont l’âge avancé et le sexe féminin <a href="https://pubmed.ncbi.nlm.nih.gov/41487741/" target="_blank" rel="noopener">(De Faria Sousa et Espinosa, 2025)</a>. Dans la cohorte finlandaise, les <b>facteurs de risque du syndrome malin</b> sont l’augmentation du nombre d’antipsychotiques (rapport de cotes 5,0), le changement ou la réduction du traitement (2,43), une dose supérieure à deux doses quotidiennes définies (3,15), un co-traitement anticholinergique (2,26), le lithium (2,16), les benzodiazépines (2,02) et une maladie cardiovasculaire (1,73). Il n’y a pas de différence entre voie orale et forme à action prolongée, ni entre première et seconde génération d’antipsychotiques <a href="https://pubmed.ncbi.nlm.nih.gov/34013325/" target="_blank" rel="noopener">(Guinart et collaborateurs, 2021)</a>.</p>
<div class="trap"><span class="k">Neuroleptiques cachés</span> Les antiémétiques et les anticalciques ne sont pas perçus comme des neuroleptiques par le patient et figurent rarement dans sa liste spontanée. Le médecin les recherche explicitement, y compris les compléments alimentaires, dont ceux à base de <i>Rauwolfia</i> <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/41487741/" target="_blank" rel="noopener">(2025)</a>.</div>
<div class="key"><b>À retenir.</b> La liste complète des médicaments, avec dates d’introduction et de modification, est l’examen le plus rentable devant un parkinsonisme récent. Le facteur de risque du syndrome malin le plus fort est une augmentation rapide de l’exposition aux antipsychotiques.</div>

<section class="ilot" id="g21-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse poursuit un seul but : placer le début des troubles par rapport à l’exposition à une cause. Elle commence par la <b>liste exhaustive des médicaments</b>, y compris les « neuroleptiques cachés » et les compléments <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a> <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger, 2018)</a>. Elle précise ensuite la <button class="w" data-k="g21-chrono">chronologie (délai entre exposition et début)</button>.</p>
<p>Le parkinsonisme médicamenteux apparaît le plus souvent quelques heures à quelques semaines après l’introduction ou l’augmentation d’une dose <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">(Ward et Citrome, 2018)</a>. Un début aigu à subaigu sous bloqueur dopaminergique impose de le suspecter <a href="https://pubmed.ncbi.nlm.nih.gov/39419777/" target="_blank" rel="noopener">(revue 2024)</a>. Un début progressif, ou en marches d’escalier, sur terrain vasculaire, avec une atteinte des membres inférieurs, oriente vers une origine vasculaire <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a>.</p>
<table class="t"><thead><tr><th>Question posée</th><th>Cause évoquée</th><th>Justification</th></tr></thead><tbody>
<tr><td>Nouveau médicament ou changement de dose avant les troubles ?</td><td>Parkinsonisme médicamenteux</td><td>Délai typique de heures à semaines</td></tr>
<tr><td>Début brutal avec déficit focal, facteurs de risque vasculaires ?</td><td>Parkinsonisme vasculaire aigu</td><td>Lésion nigrostriée ou mésencéphalique</td></tr>
<tr><td>Début insidieux aux jambes, chutes, troubles urinaires ?</td><td>Parkinsonisme vasculaire insidieux</td><td>Déconnexion des boucles de la marche</td></tr>
<tr><td>Antécédent d’encéphalite ou de traumatisme crânio-cérébral ?</td><td>Post-encéphalitique ou post-traumatique</td><td>Lésion cérébrale ancienne</td></tr>
<tr><td>Soudure, drogue injectable, cirrhose ?</td><td>Manganèse</td><td>Exposition professionnelle, méthcathinone, shunt porto-systémique</td></tr>
<tr><td>Intoxication au monoxyde de carbone avec intervalle libre ?</td><td>Syndrome retardé</td><td>Symptômes après un intervalle libre</td></tr></tbody></table>
<p>Ce tableau s’utilise comme un entonnoir : chaque réponse positive réoriente le bilan. Il faut aussi demander si le patient a arrêté brutalement la lévodopa ou un agoniste dopaminergique, car ce sevrage peut déclencher un tableau de type syndrome malin <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle Madopar®)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/21733489/" target="_blank" rel="noopener">(Gurrera et collaborateurs, 2011)</a>.</p>
<div class="two"><div class="card"><h4>Forme habituelle</h4><p>Un tremblement, une lenteur et une raideur surviennent après un médicament, chez une personne âgée, de façon plutôt bilatérale. Les troubles régressent à l’arrêt du médicament, en général en 6 à 12 mois.</p></div><div class="card"><h4>Forme à ne pas manquer</h4><p>Une fièvre, une rigidité majeure et une confusion surviennent dans les jours qui suivent le début ou l’augmentation d’un neuroleptique. Il s’agit d’une urgence : l’anamnèse sert à décider de l’arrêt du médicament.</p></div></div>
<div class="key"><b>À retenir.</b> Plus le début est aigu et proche d’un médicament, plus une cause secondaire est probable ; un début insidieux asymétrique garde la maladie de Parkinson au premier plan.</div>
</section>

<section class="ilot" id="g21-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen commence par l’état général, la température et la pression artérielle, puis la recherche des quatre signes cardinaux. Dans le <b>parkinsonisme médicamenteux</b>, le tremblement, l’akinésie et la rigidité sont cliniquement indiscernables d’une maladie de Parkinson <a href="https://pubmed.ncbi.nlm.nih.gov/39419777/" target="_blank" rel="noopener">(revue 2024)</a>. Le parkinsonisme tend à être bilatéral et symétrique, alors que la maladie de Parkinson est asymétrique ; ce signe, tiré d’un extrait de moteur de recherche, reste à confirmer. Des dyskinésies bucco-faciales ou une akathisie orientent vers une origine médicamenteuse <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger, 2018)</a>.</p>
<p>Le <b>parkinsonisme vasculaire insidieux</b> touche surtout la moitié inférieure du corps. La marche se fait à petits pas, à base élargie, avec hésitation au démarrage et freezing ; la festination est rare, le ballant des bras est souvent conservé, la posture est plus droite, la rigidité des membres inférieurs « en tuyau de plomb ». Les signes pyramidaux, pseudo-bulbaires, les troubles urinaires par hyperactivité du détrusor et le déclin cognitif sont fréquents. Dans une série autopsique, la bradykinésie était présente dans 100 % des cas, la rigidité dans 96 %, les chutes dans 76 %, les signes pyramidaux dans 54 %, l’incontinence dans 50 % et la démence dans 39 %, sans hallucination visuelle. Un tremblement de repos classique de 4 à 5 hertz, une bonne réponse à la lévodopa et des hallucinations visuelles plaident contre cette cause <a href="https://pubmed.ncbi.nlm.nih.gov/29310988/" target="_blank" rel="noopener">(Rektor et collaborateurs, 2018)</a>.</p>
<p>Le <b>parkinsonisme vasculaire aigu</b> est un hémiparkinsonisme asymétrique contemporain de l’accident vasculaire cérébral, non progressif, qui répond aux dopaminergiques <a href="https://pubmed.ncbi.nlm.nih.gov/29310988/" target="_blank" rel="noopener">(Rektor et collaborateurs, 2018)</a>. L’<b>intoxication au manganèse par méthcathinone</b> donne un syndrome extrapyramidal distinctif et permanent, sans amélioration après l’arrêt malgré la baisse de la manganésémie <a href="https://pubmed.ncbi.nlm.nih.gov/23678867/" target="_blank" rel="noopener">(Stepens et collaborateurs, 2013)</a>.</p>
<p>Les <button class="w" data-k="g21-drapeaux">drapeaux rouges contre une maladie de Parkinson (liste et lecture)</button> aident à écarter un tableau dégénératif atypique ou secondaire : chutes précoces, dysautonomie précoce, syndrome cérébelleux, syndrome pyramidal, troubles oculomoteurs, troubles cognitifs précoces et parkinsonisme symétrique prédominant aux membres inférieurs <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, d’après MDS 2015)</a>.</p>
<p>Le <b>syndrome malin des neuroleptiques</b> associe hyperthermie, rigidité généralisée, altération de l’état mental et dysautonomie. La rigidité et l’élévation de la créatine kinase précèdent souvent la fièvre ; il existe aussi des formes sans hyperthermie <a href="https://pubmed.ncbi.nlm.nih.gov/21733489/" target="_blank" rel="noopener">(Gurrera et collaborateurs, 2011)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/42732346/" target="_blank" rel="noopener">(Cureus, 2026)</a> <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle Haldol®)</a>.</p>
<div class="trap"><span class="k">Piège</span> Chercher uniquement l’asymétrie ou le tremblement ne suffit pas à distinguer les causes. La <button class="w" data-k="g21-dyskinesie">dystonie aiguë, l’akathisie et la dyskinésie tardive (distinctions)</button> accompagnent souvent la prise de neuroleptiques et ne sont pas des parkinsonismes.</div>
<div class="key"><b>À retenir.</b> L’examen ne distingue pas à lui seul le parkinsonisme médicamenteux de la maladie de Parkinson ; il repère les signes qui orientent vers une cause vasculaire, toxique ou vers une urgence.</div>
