<template data-pop="g21-exp-1" data-title="Comprendre — 1. Définition : syndrome clinique, cause et code"><p><b>Lecture expliquée.</b> Décrire le syndrome, chercher sa cause puis choisir le code.</p><p>Un <button class="w" data-k="g21-syndrome">syndrome parkinsonien</button> associe une <button class="w" data-k="g21-bradykinesia">bradykinésie</button> à une rigidité et/ou un tremblement de repos. Le tremblement n’est donc pas obligatoire. Une lenteur liée à faiblesse, douleur ou trouble cognitif ne suffit pas à conclure. La bradykinésie se caractérise par des mouvements lents, avec recherche de réduction de vitesse ou d’amplitude lors de la répétition.</p><p>Le caractère secondaire repose sur une cause identifiable et une concordance clinique. Dans la nomenclature OFS 2024, G21 comprend aussi bien des formes chroniques que le <b>syndrome malin des neuroleptiques G21.0</b>. Il ne signifie pas seulement « maladie de Parkinson provoquée par un médicament ».</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a>.</p></template>
<template data-pop="pareto-g21-1" data-title="Essentiel — 1. Définition : syndrome clinique, cause et code"><p>Décrire le syndrome, chercher sa cause puis choisir le code.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a>.</p></template>
<template data-pop="g21-exp-2" data-title="Comprendre — 2. Épidémiologie : le bon sous-groupe et la bonne époque"><p><b>Lecture expliquée.</b> Les données genevoises historiques n’estiment pas une incidence suisse actuelle.</p><p>L’étude de Fleury et collègues, publiée en 2018, décrit le canton de Genève à partir de dossiers hospitaliers, de neurologues privés et d’EMS. Elle inclut des diagnostics établis entre2003 et 2012 et identifie1235 patients vivants avec parkinsonisme :80% de formes dégénératives et 20% de formes non dégénératives.</p><p><b>Parmi les formes non dégénératives</b>,43,4% sont médicamenteuses et 37% vasculaires dans le résumé primaire. Ces deux pourcentages ne portent ni sur toute la population genevoise ni sur l’ensemble des 1235 patients. Ils ne mesurent pas une incidence nationale actuelle d’un code G21.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">CH-GENEVA — Résumé primaire obtenu via EuropePMC, objectifs/méthodes/résultats</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a>.</p></template>
<template data-pop="pareto-g21-2" data-title="Essentiel — 2. Épidémiologie : le bon sous-groupe et la bonne époque"><p>Les données genevoises historiques n’estiment pas une incidence suisse actuelle.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">CH-GENEVA — Résumé primaire obtenu via EuropePMC, objectifs/méthodes/résultats</a>.</p></template>
<template data-pop="g21-exp-3" data-title="Comprendre — 3. Physiopathologie : blocage fonctionnel, lésion et réseau"><p><b>Lecture expliquée.</b> Blocage postsynaptique, perte présynaptique et lésion vasculaire sont des mécanismes différents.</p><p>Les noyaux gris participent à la régulation d’un <button class="w" data-k="g21-network">réseau moteur</button>. Striatum, pallidum, noyau sous-thalamique, substance noire, thalamus et cortex ont des rôles et des connexions distincts. La <button class="w" data-k="g21-dopamine">transmission dopaminergique</button> ne se résume pas à la force musculaire.</p><p>Anatomie normale de référence. La page de provenance n’a pas de description détaillée : les étiquettes originales et le livre humain sont conservés, sans orientation ou diagnostic inventés. Aucune lésion vasculaire ou perte neuronale n’est démontrée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a>.</p></template>
<template data-pop="pareto-g21-3" data-title="Essentiel — 3. Physiopathologie : blocage fonctionnel, lésion et réseau"><p>Blocage postsynaptique, perte présynaptique et lésion vasculaire sont des mécanismes différents.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a>.</p></template>
<template data-pop="g21-exp-4" data-title="Comprendre — 4. Démarche clinique : urgence, syndrome, étiologie puis plan"><p><b>Lecture expliquée.</b> Urgence d’abord, syndrome ensuite, puis exposition et concordance.</p><p>Une <button class="w" data-k="g21-redflags">alerte clinique</button> compte davantage qu’une étiquette ancienne. Le diagnostic d’une forme médicamenteuse n’impose pas d’attendre six mois avant d’aider le patient ; le suivi peut ensuite modifier l’hypothèse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a>.</p></template>
<template data-pop="pareto-g21-4" data-title="Essentiel — 4. Démarche clinique : urgence, syndrome, étiologie puis plan"><p>Urgence d’abord, syndrome ensuite, puis exposition et concordance.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a>.</p></template>
<template data-pop="g21-exp-5" data-title="Comprendre — 5. Anamnèse : une chronologie complète, y compris les omissions"><p><b>Lecture expliquée.</b> Rechercher aussi médicaments cachés, formes retard et prises omises.</p><p>L’<button class="w" data-k="g21-history">histoire médicamenteuse</button> doit reprendre noms, indications, doses, dates de début et de changement, associations, formes retard et dernière prise réelle. Demander aussi antiémétiques, prokinétiques, médicaments de vertige ou sommeil, et traitements reçus pendant une hospitalisation. Un médicament « caché » dans une autre indication peut agir sur le système dopaminergique.</p><p>La <button class="w" data-k="g21-drug-latency">relation temporelle</button> oriente sans prouver seule la causalité. Rechercher un ralentissement antérieur, une asymétrie déjà présente, une perte d’odorat ou d’autres signes pouvant évoquer une maladie sous-jacente. Persistance ou progression après retrait peut justifier de rouvrir le diagnostic ; elle ne démontre pas immédiatement une cause unique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a>.</p></template>
<template data-pop="pareto-g21-5" data-title="Essentiel — 5. Anamnèse : une chronologie complète, y compris les omissions"><p>Rechercher aussi médicaments cachés, formes retard et prises omises.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a>.</p></template>
<template data-pop="g21-exp-6" data-title="Comprendre — 6. Examen clinique : décrire trois signes différents"><p><b>Lecture expliquée.</b> Vitesse répétée, tonus passif et conditions du tremblement se testent séparément.</p><p>Pour la bradykinésie, observer ouverture-fermeture de main, opposition pouce-index, pronosupination et mouvements des pieds. Comparer côtés, vitesse et amplitude au fil de la répétition. Évaluer aussi lever de chaise, marche, demi-tour, ballant des bras et retentissement fonctionnel. L’<button class="w" data-k="g21-exam">examen moteur</button> se fait avec attention à douleur, force et compréhension.</p><p>La <button class="w" data-k="g21-rigidity">rigidité extrapyramidale</button> est une résistance au mouvement passif relativement indépendante de sa vitesse ; le patient doit être détendu. La roue dentée peut accompagner une résistance, mais un simple phénomène saccadé sans résistance ne suffit pas. Elle se distingue de l’hypertonie spastique et d’une contracture douloureuse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Sir_William_Richard_Gowers_Parkinson_Disease_sketch_1886.jpg" target="_blank" rel="noopener">IMG-GOWERS — Description,origine,licence et original</a>.</p></template>
<template data-pop="pareto-g21-6" data-title="Essentiel — 6. Examen clinique : décrire trois signes différents"><p>Vitesse répétée, tonus passif et conditions du tremblement se testent séparément.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a>.</p></template>
<template data-pop="g21-exp-7" data-title="Comprendre — 7. Syndromes : un regroupement qui guide la question"><p><b>Lecture expliquée.</b> Parkinsonisme, dyskinésie, dystonie et état malin ne sont pas synonymes.</p><p>Anatomie normale simplifiée, sans force ou réflexe mesuré. Une lenteur, une faiblesse pyramidale et une rigidité extrapyramidale ne sont pas synonymes ; la figure ne montre ni cause toxique, ni inflammation active.</p><p>Une <button class="w" data-k="g21-iatrogenic">cause iatrogène</button> peut produire plusieurs mouvements anormaux. Parkinsonisme, akathisie, dystonie aiguë et dyskinésie tardive ne sont pas des synonymes ; une même personne peut présenter plusieurs dimensions. Les traitements de l’une peuvent aggraver l’autre.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></template>
<template data-pop="pareto-g21-7" data-title="Essentiel — 7. Syndromes : un regroupement qui guide la question"><p>Parkinsonisme, dyskinésie, dystonie et état malin ne sont pas synonymes.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a>.</p></template>
<template data-pop="g21-exp-8" data-title="Comprendre — 8. Diagnostic positif : ce qui est établi et ce qui reste probable"><p><b>Lecture expliquée.</b> Ni symétrie obligatoire ni guérison à délai fixe pour prouver la cause médicamenteuse.</p><p><b>Le syndrome est clinique.</b> Objectiver bradykinésie et rigidité et/ou tremblement de repos, puis décrire retentissement. Les critères de maladie de Parkinson idiopathique et ceux d’une cause secondaire ne sont pas identiques. Une réponse à un traitement n’établit pas à elle seule toute l’étiologie.</p><p><b>Origine médicamenteuse.</b> L’exposition connue, l’absence de syndrome avant traitement et le début sous le médicament soutiennent l’hypothèse. L’amélioration après réduction ou retrait est utile, mais le suivi peut révéler une coexistence ou une maladie dévoilée. Ni symétrie obligatoire ni guérison complète à une date fixe ne doivent être exigées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a>.</p></template>
<template data-pop="pareto-g21-8" data-title="Essentiel — 8. Diagnostic positif : ce qui est établi et ce qui reste probable"><p>Ni symétrie obligatoire ni guérison à délai fixe pour prouver la cause médicamenteuse.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a>.</p></template>
<template data-pop="g21-exp-9" data-title="Comprendre — 9. Explorations : une cible clinique pour chaque examen"><p><b>Lecture expliquée.</b> Un examen doit répondre à une question ; aucun résultat isolé ne remplace la clinique.</p><p>La biologie recherche complications et autres causes, notamment si syndrome malin suspecté : <button class="w" data-k="g21-ck">CK et rhabdomyolyse</button>, fonction rénale, potassium et autres ions, paramètres de perfusion, bilan hépatique et explorations infectieuses selon tableau. Un résultat isolé ne confirme ni n’exclut un syndrome malin ; les intervalles du laboratoire suisse et les unités doivent être vérifiés.</p><p>L’<button class="w" data-k="g21-mri">IRM cérébrale</button> est utile au diagnostic différentiel d’un syndrome parkinsonien, avec question structurale et vasculaire. Une image ne mesure pas seule le retentissement ni la causalité. Une urgence vasculaire ou infectieuse suit son propre circuit.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-IMG — Synthèse recommandations d’imagerie et diagnostique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a>.</p></template>
<template data-pop="pareto-g21-9" data-title="Essentiel — 9. Explorations : une cible clinique pour chaque examen"><p>Un examen doit répondre à une question ; aucun résultat isolé ne remplace la clinique.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-IMG — Synthèse recommandations d’imagerie et diagnostique</a>.</p></template>
<template data-pop="g21-exp-10" data-title="Comprendre — 10. Arbre diagnostique et diagnostics différentiels"><p><b>Lecture expliquée.</b> Garder urgence infectieuse, vasculaire et autres diagnostics concurrents.</p><p>Parmi les urgences, différencier <button class="w" data-k="g21-nms">syndrome malin des neuroleptiques</button>, <button class="w" data-k="g21-catatonia">catatonie maligne</button> et <button class="w" data-k="g21-serotonin">toxicité sérotoninergique</button> peut être difficile. Le médicament, la chronologie et tout l’examen comptent ; un signe ou un dosage ne remplace pas l’enquête. Une infection du SNC ou un sepsis ne doivent pas être exclus par l’existence d’un neuroleptique dans le dossier.</p><p>Hors urgence, considérer maladie de Parkinson, autres maladies dégénératives, hydrocéphalie, trouble de marche frontal ou médullaire et maladies classées ailleurs. G21 n’est pas une catégorie qui absorbe tous ces diagnostics.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a>.</p></template>
<template data-pop="pareto-g21-10" data-title="Essentiel — 10. Arbre diagnostique et diagnostics différentiels"><p>Garder urgence infectieuse, vasculaire et autres diagnostics concurrents.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a>.</p></template>
<template data-pop="g21-exp-11" data-title="Comprendre — 11. Prise en charge : la cause avant la surenchère symptomatique"><p><b>Lecture expliquée.</b> Changer la cause avec le prescripteur, distinguer urgence et traitement chronique.</p><p><b>Parkinsonisme médicamenteux sans urgence.</b> <button class="w" data-k="g21-reduce">Réévaluer le médicament causal</button> : indication, dose minimale utile, réduction, retrait ou substitution coordonnés avec le prescripteur, particulièrement en psychiatrie. L’objectif inclut contrôle de la maladie traitée et fonction du patient ; il ne s’agit pas d’arrêter tous les traitements sans plan.</p><p>Un traitement symptomatique peut être discuté chez certains patients gênés. Les FI d’<button class="w" data-k="g21-akineton">Akineton</button> et de <button class="w" data-k="g21-amantadine">Symmetrel</button> précisent indications et risques ; l’autorisation ne signifie pas une preuve forte de bénéfice chez tous. Confusion, psychose, rétention urinaire, chutes et fonction rénale peuvent modifier le choix. <button class="w" data-k="g21-levodopa">Madopar</button> exclut le syndrome d’origine médicamenteuse dans sa FI suisse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-LIMIT — Discussion/conclusions et traitements</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-LIMIT — Discussion des études et options NMS</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-RESPONSE — DAT, tableau 2 et discussion</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a>.</p></template>
<template data-pop="pareto-g21-11" data-title="Essentiel — 11. Prise en charge : la cause avant la surenchère symptomatique"><p>Changer la cause avec le prescripteur, distinguer urgence et traitement chronique.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a>.</p></template>
<template data-pop="g21-exp-12" data-title="Comprendre — 12. Prévention, suivi et pronostic : vérifier la trajectoire"><p><b>Lecture expliquée.</b> Suivre fonction, tolérance et évolution ; organiser les transferts.</p><p>Le <button class="w" data-k="g21-follow">suivi</button> compare signes et fonction après toute adaptation : gestes utiles, marche, chutes, cognition, symptômes psychiatriques et tolérance. Une amélioration peut prendre des semaines ou mois ; persistance, progression ou réapparition réclame une nouvelle évaluation. Une récupération complète n’est pas garantie par la seule étiquette médicamenteuse.</p><p>Après syndrome malin, la reprise d’un antipsychotique se décide avec les équipes compétentes. BAP 2023 recommande d’attendre <b>au moins deux semaines après résolution</b>, puis faible dose, progression prudente et surveillance ; le support PHEL propose une fenêtre5–14 jours. Ces références ne deviennent pas un délai moyen ou un automatisme de reprise.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-LIMIT — Discussion/conclusions et traitements</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-RECHALL — Recommandation finale et discussion de réintroduction</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-RECHALL — Réintroduction antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a>.</p></template>
<template data-pop="pareto-g21-12" data-title="Essentiel — 12. Prévention, suivi et pronostic : vérifier la trajectoire"><p>Suivre fonction, tolérance et évolution ; organiser les transferts.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a>.</p></template>
<template data-pop="g21-exp-13" data-title="Comprendre — 13. Points clés : une décision qui reste vérifiable"><p><b>Lecture expliquée.</b> Code, mécanisme et choix du produit sont des décisions liées mais différentes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a>.</p></template>
<template data-pop="pareto-g21-13" data-title="Essentiel — 13. Points clés : une décision qui reste vérifiable"><p>Code, mécanisme et choix du produit sont des décisions liées mais différentes.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a>.</p></template>
<template data-pop="g21-exp-14" data-title="Comprendre — 14. Pièges : ne pas faire d’une ressemblance une équivalence"><p><b>Lecture expliquée.</b> Ne pas extrapoler une indication ou une dose d’un produit à toute rigidité.</p><p>Confondre lenteur et bradykinésie, posture et rigidité, symptôme médicamenteux et maladie dégénérative, ou image vasculaire et cause prouvée sont des raccourcis différents. La photo histologique d’un pigment ne mesure pas un récepteur dopaminergique et un dessin historique n’est pas un cas secondaire diagnostiqué.</p><p>Les erreurs de prescription comprennent donner100 mg d’amantadine deux fois/j à une personne âgée sans réévaluer son âge et son rein, assimiler125 mg de Madopar à 125 mg de lévodopa, casser une forme retard non divisible ou appliquer une dose Parkinson à un SMN. La fenêtre <button class="w" data-k="g21-calculation">calcul et formulation</button> explique les unités utiles.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires, marche/équilibre, SSP système nerveux</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, examen CK et CS</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Description,origine,licence et original</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Sir_William_Richard_Gowers_Parkinson_Disease_sketch_1886.jpg" target="_blank" rel="noopener">IMG-GOWERS — Description,origine,licence et original</a>.</p></template>
<template data-pop="pareto-g21-14" data-title="Essentiel — 14. Pièges : ne pas faire d’une ressemblance une équivalence"><p>Ne pas extrapoler une indication ou une dose d’un produit à toute rigidité.</p><div class="key"><b>À retenir.</b> Préciser syndrome, chronologie, mécanisme et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></template>
<template data-pop="g21-cas-1" data-title="Cas 1 — Un médicament derrière les vomissements"><p><b>Exercice fictif original.</b></p><p>Une personne devient lente et raide après introduction d’un antiémétique. Chercher antagonisme dopaminergique, autres expositions et signes antérieurs. Une asymétrie n’exclut pas le rôle du médicament.</p><p>Discuter retrait/substitution avec le prescripteur, surveiller autonomie et évolution ; ne pas ajouter automatiquement Madopar dont la FI exclut les formes médicamenteuses.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></template>
<template data-pop="g21-cas-2" data-title="Cas 2 — Rigidité et confusion après neuroleptique"><p><b>Exercice fictif original.</b></p><p>Un patient confus se rigidifie et présente une température anormale après modification d’un neuroleptique. Rechercher syndrome malin, diagnostics concurrents et complications.</p><p>Évaluation urgente, arrêt du produit causal et des anticholinergiques, support individualisé ; ne pas attendre une créatine kinase particulière pour appeler.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a>.</p></template>
<template data-pop="g21-cas-3" data-title="Cas 3 — Trouble de marche et hypersignaux"><p><b>Exercice fictif original.</b></p><p>Une personne âgée marche difficilement et son imagerie montre des lésions de substance blanche. Cela ne démontre pas seul une causalité vasculaire.</p><p>Décrire syndrome, chronologie et signes associés ; discuter profil insidieux, lésion stratégique ou forme mixte. La réponse à la lévodopa n’est pas uniforme.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-RESPONSE — DAT, tableau 2 et discussion</a>.</p></template>
<template data-pop="g21-cas-4" data-title="Cas 4 — Prises omises pendant un jeûne"><p><b>Exercice fictif original.</b></p><p>Un traitement dopaminergique habituel est omis pendant un jeûne hospitalier ; la personne développe rigidité, confusion et dysautonomie. Une décompensation de sevrage est possible.</p><p>Évaluation urgente et discussion de reprise avec voie/formulation adaptées ; ne pas coder automatiquement comme exposition neuroleptique ni arrêter tous les dopaminergiques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a>.</p></template>
