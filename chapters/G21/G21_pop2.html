<template data-pop="g21-metoclopramide" data-title="Métoclopramide (Paspertin®)">
<div class="lab">Mécanisme et place</div><p>Le métoclopramide est un antiémétique antidopaminergique. Il appartient aux « neuroleptiques cachés » : il peut provoquer ou aggraver un parkinsonisme <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Paspertin®)</a> <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a>.</p>
<div class="lab">Posologie</div><p>10 mg jusqu’à 3 fois par jour, au plus 30 mg ou 0,5 mg par kilogramme et par jour, pendant 5 jours au plus, en raison du risque de dyskinésies tardives irréversibles. La dose est réduite selon les fonctions rénale et hépatique <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Paspertin®, janvier 2020)</a>.</p>
<div class="lab">Contre-indications et surveillance</div><p>Contre-indiqué avant un an et dans la maladie de Parkinson et les troubles extrapyramidaux. En cas de symptômes extrapyramidaux, arrêt immédiat. Chez l’enfant et l’adulte jeune, les troubles extrapyramidaux sont plus fréquents, parfois dès une dose unique.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Paspertin®, mise à jour janvier 2020, version 104</a>.</p></template>
<template data-pop="g21-biperidene" data-title="Bipéridène (Akineton®)">
<div class="lab">Mécanisme</div><p>Anticholinergique : il corrige le déséquilibre créé au profit de l’excitation cholinergique quand la dopamine striatale manque <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Akineton®, rubrique Propriétés)</a>.</p>
<div class="lab">Indication et posologie</div><p>Syndrome parkinsonien dû aux neuroleptiques : 1 à 4 mg, 1 à 4 fois par jour par voie orale, en association au neuroleptique. Dystonie aiguë : 2,5 à 5 mg par voie intramusculaire ou intraveineuse lente, répétable après 30 minutes, 10 à 20 mg par jour au plus.</p>
<div class="lab">Contre-indications et précautions</div><p>Glaucome à angle étroit, sténoses digestives mécaniques, mégacôlon, iléus. Peut aggraver les dyskinésies tardives. L’information professionnelle d’Haldol® précise que les antiparkinsoniens anticholinergiques ne s’emploient qu’en cas de besoin, avec un risque de pression intra-oculaire <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Haldol®)</a>.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Akineton®, mai 2022</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Haldol®, novembre 2024</a>.</p></template>
<template data-pop="g21-levodopa" data-title="Lévodopa et bensérazide (Madopar®)">
<div class="lab">Indication</div><p>Madopar® est indiqué dans le syndrome parkinsonien sous toutes ses formes, sauf d’origine médicamenteuse. Les antagonistes des récepteurs dopaminergiques en atténuent l’effet <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Madopar®, juin 2023)</a>.</p>
<div class="lab">Place dans le parkinsonisme secondaire</div><p>La lévodopa peut être nécessaire si une maladie de Parkinson prodromique coexiste <a href="https://pubmed.ncbi.nlm.nih.gov/40518581/" target="_blank" rel="noopener">(Brain Nerve, 2025)</a>. Dans le sous-type vasculaire aigu, la réponse existe ; dans le sous-type insidieux avec DaTSCAN normal, elle est très improbable <a href="https://pubmed.ncbi.nlm.nih.gov/29310988/" target="_blank" rel="noopener">(Rektor et collaborateurs, 2018)</a>.</p>
<div class="lab">Mise en garde</div><p>Un arrêt brutal peut entraîner un tableau de type syndrome malin ; voir la fenêtre sur le sevrage.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Madopar®</a>.</p></template>
<template data-pop="g21-clozapine" data-title="Clozapine (Leponex®)">
<div class="lab">Indication</div><p>Psychose de la maladie de Parkinson après échec du traitement standard : 12,5 mg le soir, paliers de 12,5 mg, entretien de 25 à 37,5 mg par jour, maximum 100 mg par jour. Pas de parkinsonisme patent <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Leponex®, juin 2026)</a>.</p>
<div class="lab">Surveillance</div><p>La surveillance des neutrophiles est obligatoire.</p>
<div class="lab">Place</div><p>Avec la quétiapine, la clozapine est le seul neuroleptique admis chez le patient parkinsonien <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a>. Elle figure aussi dans la liste des médicaments moins fréquemment en cause de parkinsonisme.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Leponex®, juin 2026</a>.</p></template>
<template data-pop="g21-quetiapine" data-title="Quétiapine (Seroquel®)">
<div class="lab">Mises en garde</div><p>Les symptômes extrapyramidaux sont plus fréquents que sous placebo dans certaines études (8,9 % contre 3,8 % en dépression bipolaire). Un syndrome malin est décrit <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Seroquel®, juillet 2026)</a>.</p>
<div class="lab">Grossesse</div><p>Les nouveau-nés exposés aux neuroleptiques au troisième trimestre peuvent présenter des symptômes extrapyramidaux et de sevrage.</p>
<div class="lab">Place</div><p>Agent de moindre risque cité pour le patient parkinsonien <a href="https://pubmed.ncbi.nlm.nih.gov/39419777/" target="_blank" rel="noopener">(revue 2024)</a> <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a>.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Seroquel®, juillet 2026</a>.</p></template>
<template data-pop="g21-dantrolene" data-title="Dantrolène (Agilus®)">
<div class="lab">Indication suisse</div><p>L’information professionnelle d’Agilus® indique le dantrolène sodique par voie intraveineuse pour l’hyperthermie maligne : 2,5 mg par kilogramme, répétable toutes les 10 minutes, maximum 300 mg par administration selon le tableau de l’information <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Agilus®, mars 2024)</a>.</p>
<div class="lab">Usage dans le syndrome malin</div><p>Hors indication suisse. Dans la série d’Ulm (405 cas), le dantrolène n’est pas globalement supérieur aux soins de soutien, mais la mortalité est plus basse dans les formes sévères <a href="https://pubmed.ncbi.nlm.nih.gov/32659853/" target="_blank" rel="noopener">(Kuhlwilm et collaborateurs, 2020)</a>.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Agilus®</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32659853/" target="_blank" rel="noopener">Kuhlwilm et collaborateurs 2020</a>.</p></template>
<template data-pop="g21-lithium" data-title="Lithium (Lithiofor®) et neuroleptiques">
<div class="lab">Mise en garde</div><p>L’association du lithium à un neuroleptique peut provoquer un syndrome encéphalopathique avec manifestations extrapyramidales, qui imite un syndrome malin <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Lithiofor®, avril 2025)</a>.</p>
<div class="lab">Risque</div><p>Dans la cohorte finlandaise, le lithium accompagne un risque accru de syndrome malin (rapport de cotes 2,16) <a href="https://pubmed.ncbi.nlm.nih.gov/34013325/" target="_blank" rel="noopener">(Guinart et collaborateurs, 2021)</a>.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Lithiofor®</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34013325/" target="_blank" rel="noopener">Guinart et collaborateurs 2021</a>.</p></template>
<template data-pop="g21-mnemo" data-title="Cinq questions avant de poser une maladie de Parkinson (aide pédagogique)">
<div class="lab">Aide pédagogique, non critère officiel</div><ol><li>Quel médicament a été introduit ou augmenté avant les troubles ?</li><li>Le début est-il aigu, ou en marches d’escalier ?</li><li>Le parkinsonisme est-il symétrique ou prédominant aux jambes ?</li><li>Existe-t-il un antécédent d’encéphalite, de traumatisme ou d’exposition toxique ?</li><li>Un signe d’alarme (fièvre, rigidité, confusion) impose-t-il d’agir avant tout bilan ?</li></ol>
<p>Cette liste regroupe les questions du cours ; elle ne remplace ni les critères de la Movement Disorder Society ni l’examen.</p></template>
<template data-pop="pareto-g21-definition" data-title="Pareto — Définitions et classification">
<p class="ratio" data-cover="g21-0,g21-1"></p><ul><li>Un syndrome parkinsonien associe bradykinésie et tremblement de repos ou rigidité ; la maladie de Parkinson n’en est qu’une cause.</li><li>Les causes secondaires se classent en six familles : médicamenteuse, syndrome malin, toxique, post-encéphalitique, vasculaire, autres.</li><li>Le libellé « maladie de Parkinson vasculaire » du code G21.4 ne désigne pas une maladie de Parkinson.</li></ul></template>
<template data-pop="pareto-g21-epidemio" data-title="Pareto — Épidémiologie">
<p class="ratio" data-cover="g21-2"></p><ul><li>À Genève, 20 % des syndromes parkinsoniens sont non dégénératifs ; 43,4 % de ceux-ci sont médicamenteux, 37 % vasculaires.</li><li>Syndrome malin : incidence 1,99 pour 10 000 personnes-années, mortalité 4,7 % à 30 jours (cohorte finlandaise).</li><li>Les chiffres ne se transposent pas d’une population à l’autre.</li></ul></template>
<template data-pop="pareto-g21-meca" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g21-3"></p><ul><li>Blocage des récepteurs, déplétion présynaptique ou lésion nigrostriée : trois mécanismes.</li><li>L’imagerie du transporteur est normale si les terminaisons sont intactes, anormale si elles sont détruites.</li><li>Le syndrome malin et le sevrage de la lévodopa partagent une chute de la neurotransmission dopaminergique.</li></ul></template>
<template data-pop="pareto-g21-causes" data-title="Pareto — Causes et risque">
<p class="ratio" data-cover="g21-4"></p><ul><li>Antipsychotiques, métoclopramide, réserpine, tétrabénazine, flunarizine et cinnarizine sont les classes principales.</li><li>Âge avancé et sexe féminin augmentent le risque de parkinsonisme médicamenteux.</li><li>Le risque de syndrome malin augmente avec l’escalade rapide des antipsychotiques.</li></ul></template>
<template data-pop="pareto-g21-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g21-5,g21-6"></p><ul><li>Chronologie : heures à semaines après le médicament.</li><li>Le parkinsonisme médicamenteux imite la maladie de Parkinson ; le vasculaire atteint les jambes.</li><li>Fièvre, rigidité, confusion : syndrome malin jusqu’à preuve du contraire.</li></ul></template>
<template data-pop="pareto-g21-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g21-7"></p><ul><li>Syndrome, puis cause, puis imagerie du transporteur si le doute persiste.</li><li>Ne pas débuter la lévodopa avant d’avoir exclu une cause médicamenteuse.</li><li>Un médicament peut démasquer une maladie de Parkinson prodromique.</li></ul></template>
<template data-pop="pareto-g21-urgence" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g21-8"></p><ul><li>Syndrome malin : arrêter l’agent, soins intensifs, créatine kinase.</li><li>Dystonie aiguë : bipéridène 2,5 à 5 mg, maximum 10 à 20 mg par jour.</li><li>Le sevrage brutal de la lévodopa peut imiter un syndrome malin.</li></ul></template>
<template data-pop="pareto-g21-prise" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g21-9,g21-10,g21-11"></p><ul><li>Traitement du parkinsonisme médicamenteux : arrêt ou remplacement ; récupération en 6 à 12 mois.</li><li>Métoclopramide : au plus 30 mg par jour et 5 jours.</li><li>Dantrolène : hors indication suisse dans le syndrome malin.</li><li>Vasculaire, toxique, post-encéphalitique : peu de traitements validés.</li></ul></template>
<template data-pop="pareto-g21-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g21-12,g21-13"></p><ul><li>Réévaluer après l’arrêt ; une persistance oriente vers une maladie sous-jacente.</li><li>Personne âgée, enfant, parkinsonien et nouveau-né exposé sont les populations à risque.</li></ul></template>
<template data-pop="pareto-g21-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g21-e-1,g21-e-2,g21-e-3,g21-e-4"></p><ul><li>DaTSCAN normal : parkinsonisme médicamenteux ; anormal : perte présynaptique sans cause précisée.</li><li>IRM pour le vasculaire (critères STRIVE) et l’hydrocéphalie (index supérieur à 0,3, angle inférieur à 90 degrés).</li><li>Syndrome malin : créatine kinase d’au moins 4 fois la limite supérieure de la normale.</li></ul></template>
<template data-pop="pareto-g21-s-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g21-s-anat-cours"></p><ul><li>Quatre sites : récepteur, terminaison, substance noire, substance blanche.</li><li>Le site prédit l’imagerie et la réversibilité.</li></ul></template>
<template data-pop="pareto-g21-s-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g21-s-histo-cours"></p><ul><li>Maladie de Parkinson : perte neuronale et corps de Lewy.</li><li>Parkinsonisme médicamenteux : transporteur préservé.</li></ul></template>
<template data-pop="pareto-g21-s-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g21-s-physio-cours"></p><ul><li>La dopamine équilibre l’acétylcholine striatale.</li><li>Syndrome malin : hypothalamus et noyaux gris.</li></ul></template>
<template data-pop="pareto-g21-s-bioch" data-title="Pareto — Pharmacologie moléculaire">
<p class="ratio" data-cover="g21-s-bioch-cours"></p><ul><li>Cibles : récepteurs de type 2, transporteur vésiculaire, transporteur présynaptique.</li><li>Les antagonistes atténuent l’effet de la lévodopa.</li></ul></template>
<template data-pop="pareto-g21-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g21-p-1,g21-p-2,g21-p-3,g21-p-4,g21-p-5"></p><ul><li>Première ordonnance : retirer le médicament en cause.</li><li>Seuls la quétiapine et la clozapine sont admises chez le parkinsonien.</li><li>Lithium plus neuroleptique : tableau imitant le syndrome malin.</li></ul></template>
