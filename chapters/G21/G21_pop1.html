<template data-pop="g21-syndrome" data-title="Syndrome et cause ne sont pas synonymes"><p>Le syndrome parkinsonien réunit bradykinésie et rigidité et/ou tremblement de repos. Il décrit un ensemble de signes ; la maladie de Parkinson n’est qu’une des causes.</p><p>Une origine médicamenteuse, vasculaire ou postencéphalitique exige une concordance propre. La nomenclature inclut aussi G21.0, syndrome malin, dont le triage est urgent.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a>.</p></template>
<template data-pop="g21-bradykinesia" data-title="Bradykinésie : répétition et amplitude"><p>Observer gestes des doigts, main et pied répétés : vitesse, amplitude et évolution pendant la série. Comparer côtés et gestes fonctionnels ; douleur, faiblesse ou mauvaise compréhension peuvent ralentir autrement.</p><p>Le décrément est caractéristique de la maladie de Parkinson, mais son absence dans certaines formes atypiques ne règle pas tout le diagnostic. Une photographie ne mesure pas cette dynamique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a>.</p></template>
<template data-pop="g21-rigidity" data-title="Rigidité : mobilisation passive"><p>Patient détendu, mobiliser passivement l’articulation ; rechercher une résistance relativement indépendante de la vitesse. Une manœuvre de renforcement peut aider dans l’examen adapté.</p><p>La spasticité dépend davantage de la vitesse et s’accompagne d’autres signes pyramidaux. Une roue dentée sans résistance suffisante ne prouve pas seule une rigidité parkinsonienne.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a>.</p></template>
<template data-pop="g21-tremor" data-title="Repos, posture et action"><p>Décrire dans quelles conditions apparaît l’oscillation : membre soutenu au repos, posture maintenue ou action. Noter côté, distribution et retentissement.</p><p>Le tremblement de repos peut manquer. Asymétrie ou tremblement sous un médicament ne suffisent pas à exclure une cause médicamenteuse ; ils ne prouvent pas non plus une maladie de Parkinson idiopathique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a>.</p></template>
<template data-pop="g21-d2" data-title="D2 postsynaptique et terminaison présynaptique"><p>Un antagoniste peut diminuer la transmission au récepteur striatal sans détruire d’emblée la terminaison nigrostriatale. Ce mécanisme explique un parkinsonisme fonctionnellement induit.</p><p>Le transporteur de dopamine exploré par imagerie n’est pas le récepteur D2. Les deux questions ne sont pas interchangeables ; maladie dégénérative et exposition peuvent coexister.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a>.</p></template>
<template data-pop="g21-network" data-title="Boucles des noyaux gris"><p>Cortex, striatum, pallidum, noyau sous-thalamique, substance noire et thalamus forment des boucles. Le modèle direct/indirect aide à expliquer une modification de sortie motrice.</p><p>Il simplifie un réseau réel plus complexe. La planche normale localise des structures ; aucune flèche causale ni lésion de ce patient n’est déduite de ses couleurs.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Basal-ganglia-coronal-sections.png" target="_blank" rel="noopener">IMG-BASAL — Description,origine,licence et original</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray718.png" target="_blank" rel="noopener">IMG-STRIATUM — Description,origine,licence et original</a>.</p></template>
<template data-pop="g21-dopamine" data-title="Précurseur, récepteur et neurone"><p>La lévodopa fournit un précurseur capable de gagner le cerveau ; le bensérazide limite sa décarboxylation périphérique. Un agoniste agit sur des récepteurs ; un antagoniste peut s’y opposer.</p><p>Une cellule pigmentée en histologie ne donne ni taux de dopamine ni nombre de récepteurs occupés. Le mécanisme aide à choisir une question, sans imposer le même médicament à toutes les causes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MECH — Pathophysiology</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Neuromelanin_in_a_neuron_of_the_substantia_nigra.jpg" target="_blank" rel="noopener">IMG-HISTO — Description,origine,licence et original</a>.</p></template>
<template data-pop="g21-coding" data-title="OFS2024 : G21 et ses frontières"><p>Les sous-codes retenus sont.0,.1,.2,.3,.4,.8,.9. G21.0 est le syndrome malin ; G21.1 les autres formes médicamenteuses. Les causes externes peuvent nécessiter un code supplémentaire.</p><p>G20, G22* et G23 restent distincts. Un état malin après omission de lévodopa ne devient pas automatiquement G21.0 ; documenter mécanisme et diagnostic, puis coder.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G20, G22* et G23</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></template>
<template data-pop="g21-iatrogenic" data-title="Plusieurs mouvements anormaux sous médicament"><p>Parkinsonisme, akathisie, dystonie aiguë et dyskinésie tardive décrivent des phénomènes différents. Observer le mouvement, le contexte et la chronologie avant d’appliquer une étiquette.</p><p>Des signes peuvent coexister. Un anticholinergique utilisé pour certains symptômes peut aggraver une dyskinésie tardive ; en syndrome malin, il peut gêner la perte de chaleur.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a>.</p></template>
<template data-pop="g21-history" data-title="Inclure le médicament caché et la prise omise"><p>Noter noms, indication, forme retard, début, changement et dernière prise réelle. Inclure antiémétiques et traitements reçus ailleurs ; l’ordonnance électronique ne prouve pas la prise effective.</p><p>L’omission dopaminergique change le sens de la conduite par rapport au blocage par neuroleptique. La coordination avec prescripteur et pharmacie évite une suppression uniforme de tous les traitements.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-CLIN — Clinical characteristics</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></template>
<template data-pop="g21-drug-latency" data-title="Chronologie : argument, pas preuve isolée"><p>Début après introduction ou hausse d’un médicament soutient une hypothèse. Rechercher néanmoins signes préexistants, autres expositions, pathologies et évolution après changement.</p><p>Une amélioration peut prendre semaines ou mois ; persistance, progression ou récidive imposent réévaluation. Aucun délai fixe ne garantit guérison ou irréversibilité chez tout patient.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a>.</p></template>
<template data-pop="g21-exam" data-title="Examen moteur comparatif"><p>Tester gestes répétitifs, tonus passif, tremblement, lever de chaise, marche et demi-tour. Chercher force, réflexes, coordination, oculomotricité et cognition selon contexte.</p><p>Le retentissement sur déglutition, chutes et autonomie compte pour le plan de soins. L’examen est répété avec sécurité et ne retarde pas la stabilisation d’une personne instable.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires, marche/équilibre, SSP système nerveux</a>.</p></template>
<template data-pop="g21-redflags" data-title="Une alerte change le circuit"><p>Dégradation rapide, confusion nouvelle, température anormale, dysautonomie, trouble respiratoire ou déficit brutal demandent évaluation urgente.</p><p>Le syndrome malin n’est pas la seule urgence ; infection, accident vasculaire et défaillance métabolique restent à chercher. L’absence d’un signe classique ne suffit pas à rassurer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a>.</p></template>
<template data-pop="g21-nms" data-title="Syndrome malin : ensemble clinique"><p>Exposition à un antagoniste dopaminergique, altération mentale, rigidité, anomalies thermiques et autonomes orientent. Les présentations peuvent être hétérogènes, notamment sous antipsychotique atypique.</p><p>Pas de test spécifique unique. Arrêt causal et support urgent précèdent une éventuelle stratégie spécialisée ; preuves limitées pour les traitements pharmacologiques spécifiques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-LIMIT — Discussion des études et options NMS</a>.</p></template>
<template data-pop="g21-catatonia" data-title="Catatonie et syndrome malin"><p>Les tableaux peuvent partager rigidité, altération mentale et dysautonomie. La distinction avec catatonie maligne peut être difficile et nécessite toute l’histoire et l’examen.</p><p>Ne pas conclure sur une seule valeur de créatine kinase. L’équipe spécialisée choisit les explorations et une stratégie proportionnée à la gravité, en gardant les diagnostics concurrents.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a>.</p></template>
<template data-pop="g21-serotonin" data-title="Toxicité sérotoninergique : diagnostic concurrent"><p>Une exposition sérotoninergique et sa chronologie doivent être recherchées dans l’ordonnance complète. Un tableau fébrile et confus ne devient pas automatiquement un syndrome malin.</p><p>L’examen neuromusculaire et le contexte aident à distinguer les syndromes ; aucune opposition caricaturale d’un signe isolé ne remplace l’évaluation urgente.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a>.</p></template>
<template data-pop="g21-ck" data-title="Créatine kinase : muscle et complications"><p>La hausse peut accompagner une atteinte musculaire et une rhabdomyolyse ; surveiller fonction rénale, potassium et état clinique selon gravité. Les unités et références dépendent du laboratoire.</p><p>Le dosage n’est pas spécifique du syndrome malin. Sa valeur isolée, normale ou élevée, ne résout pas à elle seule le diagnostic ni la gravité globale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CLIN — Présentation séquentielle, diagnostic et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a>.</p></template>
<template data-pop="g21-dat" data-title="Transporteur présynaptique en imagerie"><p>Dans une forme surtout postsynaptique, le transporteur peut être préservé. Un déficit peut révéler une atteinte présynaptique, dégénérative ou parfois lésionnelle.</p><p>Le résultat n’identifie pas seul une maladie de Parkinson idiopathique et ne distingue pas parfaitement toutes les dégénérescences. Réserver à une incertitude clinique dont la résolution modifierait la conduite.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-IMG — Synthèse recommandations d’imagerie et diagnostique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a>.</p></template>
<template data-pop="g21-mri" data-title="IRM : une question structurale"><p>Rechercher lésions stratégiques, atteinte vasculaire et autres diagnostics différentiels avec séquences et protocole adaptés. Relier anatomie et temporalité au tableau clinique.</p><p>Des hypersignaux de substance blanche fréquents avec l’âge ne suffisent pas à attribuer les symptômes aux vaisseaux. Une image normale ne supprime pas tous les mécanismes médicamenteux.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-IMG — Synthèse recommandations d’imagerie et diagnostique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-TEST — Diagnosis and role of DAT imaging</a>.</p></template>
<template data-pop="g21-vascular" data-title="Vasculaire : trois profils à distinguer"><p>Le consensus distingue forme postAVC stratégique, forme insidieuse à prédominance marche/axe et forme mixte avec neurodégénérescence. Signes pyramidaux, cognitifs ou urinaires peuvent contribuer à la description.</p><p>Le lien clinique-radiologique reste parfois incertain. La réponse dopaminergique est variable ; aucune résistance obligatoire ni traitement antithrombotique automatique ne découle du seul code.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-CLASS — Résumé, prémabule et sous-types</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-MRI — Imagerie, pathologie et différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-RESPONSE — DAT, tableau 2 et discussion</a>.</p></template>
<template data-pop="g21-postenceph" data-title="Postencéphalitique ne signifie pas inflammation active"><p>Documenter l’affection antérieure, sa chronologie et le syndrome actuel. Une conséquence résiduelle n’est pas équivalente à une infection ou une auto-immunité persistante.</p><p>Une nouvelle altération neurologique exige son propre bilan. Le code G21.3 ne prescrit ni antibiotique, ni corticoïde, ni traitement immunitaire sans diagnostic causal.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — G21 et G21.0/.1/.2/.3/.4/.8/.9</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener">EU-DGN-DEF — Définitions p 24–25, syndromes secondaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-CLIN — Section Neuroleptic malignant syndrome</a>.</p></template>
<template data-pop="g21-withdrawal" data-title="Omission dopaminergique : risque de décompensation"><p>L’arrêt brutal de certains antiparkinsoniens peut produire dégradation, rigidité et état ressemblant au syndrome malin. Rechercher jeûne, dysphagie, oubli et interruption lors de transfert.</p><p>Une reprise adaptée se discute en urgence, avec formulation et voie possibles. Ne pas assimiler cette situation à une consigne d’arrêt de tous les médicaments dopaminergiques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a>.</p></template>
<template data-pop="g21-reduce" data-title="Retrait ou substitution : décision coordonnée"><p>Dans une forme médicamenteuse, réévaluer bénéfice et risque du produit responsable. Réduction ou remplacement peut être préférable à un empilement symptomatique.</p><p>Le changement antipsychotique ne s’improvise pas : risque de rechute, exposition retard et autres effets comptent. Fixer suivi clinique, autonomie et critères de réévaluation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a>.</p></template>
<template data-pop="g21-akineton" data-title="Bipéridène : deux contextes différents"><p>Akineton peut être indiqué dans les troubles extrapyramidaux médicamenteux ; sa tolérance cognitive et anticholinergique limite notamment l’usage chez la personne âgée.</p><p>Il n’est pas une réponse universelle à toute rigidité : BAP recommande arrêt des anticholinergiques en syndrome malin. Les formes immédiate et retard ont des plafonds différents.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a>.</p></template>
<template data-pop="g21-amantadine" data-title="Amantadine : dose et intervalle"><p>Symmetrel a une indication adulte comprenant des parkinsonismes médicamenteux. Réduction du produit causal d’abord si possible, puis titration selon FI et tolérance.</p><p>La clairance rénale et l’âge modifient fortement la prescription. Confusion, hallucinations ou myoclonies peuvent signaler accumulation ; ne pas traiter automatiquement cela en augmentant la dose.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a>.</p></template>
<template data-pop="g21-levodopa" data-title="Madopar : vérifier l’indication"><p>La FI exclut les syndromes d’origine médicamenteuse de son indication. Une forme vasculaire ou mixte peut faire l’objet d’une évaluation spécialisée, sans garantie de réponse.</p><p>LIQ 125 signifie100 mg de lévodopa avec 25 mg de bensérazide. Ce total commercial ne doit pas être compté comme125 mg de lévodopa ; formes retard et dispersible ne sont pas interchangeables au hasard.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5857227/" target="_blank" rel="noopener">INT-VASC-RESPONSE — DAT, tableau 2 et discussion</a>.</p></template>
<template data-pop="g21-bromocriptine" data-title="Bromocriptine : indication et interactions"><p>Parlodel est indiqué dans Parkinson idiopathique et postencéphalitique ; usage éventuel en syndrome malin est hospitalier hors indication et repose sur preuves limitées.</p><p>Les inhibiteurs puissants ou modérés du CYP3A4 sont contre-indiqués avec ce produit. La titration hebdomadaire de Parkinson ne doit pas être transférée comme protocole d’urgence.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-THERAPY — Recommandations NMS</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-LIMIT — Discussion des études et options NMS</a>.</p></template>
<template data-pop="g21-elderly" data-title="Âge, cognition et chutes"><p>L’âge ne suffit pas à décider le traitement, mais fragilité, cognition, rétention urinaire, hypotension et charge médicamenteuse modifient la balance. Évaluer marche et sécurité du domicile.</p><p>Symmetrel recommande au moins 65 ans sans pathologie rénale au maximum 100 mg/j ; l’insuffisance rénale ajoute une autre adaptation. Les anticholinergiques exposent particulièrement à confusion et troubles mnésiques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a>.</p></template>
<template data-pop="g21-renal" data-title="Ne pas confondre dose et intervalle"><p>La FI Symmetrel donne des intervalles pour 100 mg selon clairance et sa convention de surface corporelle. Vérifier la mesure utilisée et la tranche avec pharmacie.</p><p>À clairance 30 dans le tableau, 100 mg toutes les quarante-huit heures ne signifie pas automatiquement50 mg tous les jours. La forme disponible, les bornes du tableau et l’évolution rénale restent à contrôler.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a>.</p></template>
<template data-pop="g21-pregnancy" data-title="Grossesse et allaitement : produit par produit"><p>Amantadine et Madopar ont des contre-indications de grossesse dans leurs FI ; les consignes de contraception et d’allaitement sont propres à chaque produit.</p><p>Une grossesse sous traitement demande contact médical rapide. Le risque d’arrêt brutal impose d’organiser les modalités, sans conseil d’auto-arrêt ni prolongation automatique. Les indications endocrines de bromocriptine ont un autre cadre.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680318410383" target="_blank" rel="noopener">FI-SYM — Indication adulte, doses, âge/rein, précautions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses/formes, organes, sécurité, reproduction, interactions, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680390010204" target="_blank" rel="noopener">FI-PARL — Indications, syndrome parkinsonien, organes, contre-indications, interactions et reproduction</a>.</p></template>
<template data-pop="g21-rehab" data-title="Rééducation et autonomie"><p>Chutes, déglutition, communication, habillement et repas peuvent limiter la vie quotidienne. Mesurer le retentissement avec le patient et les aidants, organiser aides et intervenants selon besoin.</p><p>La réduction d’une exposition ne suffit pas toujours à restaurer immédiatement la fonction. Une stratégie de sécurité et de suivi accompagne le traitement causal, sans promettre une guérison à date fixe.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-SEMIO — Identifier un syndrome parkinsonien 1–3</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">CH-HUG-DIFF — Investiguer 1–3 et imagerie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a>.</p></template>
<template data-pop="g21-follow" data-title="Suivi : revoir aussi le diagnostic"><p>Documenter signes, autonomie, tolérance et évolution après changement médicamenteux. Une progression persistante peut révéler une maladie sous-jacente ou une autre cause.</p><p>Après syndrome malin, une réintroduction antipsychotique n’est pas un simple renouvellement : réévaluer indication, délai après résolution, faible dose et surveillance avec l’équipe.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-RECHALL — Recommandation finale et discussion de réintroduction</a> ; <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-RECHALL — Réintroduction antipsychotiques</a>.</p></template>
<template data-pop="g21-calculation" data-title="Calcul pédagogique : quantité de chaque principe"><p>Trois prises déjà prescrites d’un LIQ 125 apportent3 × 100 = 300 mg de lévodopa et 3 × 25 = 75 mg de bensérazide par jour.375 mg est la somme des deux principes, pas la dose de lévodopa.</p><p>La dispersion dans 25–50 mL d’eau n’est pas une solution à concentration fixe autorisant une fraction de verre. Le calcul vérifie une prescription préexistante ; il ne choisit ni indication, ni dose, ni forme.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a>.</p></template>
<template data-pop="g21-prevention" data-title="Prévenir l’exposition évitable et l’omission"><p>Conciliation médicamenteuse, indication claire et surveillance limitent les expositions mal reconnues. Lors d’hospitalisation, vérifier les horaires et la capacité de prise des antiparkinsoniens.</p><p>Après événement malin, documenter produit et circonstances, informer les équipes et discuter le signalement approprié. Ne pas confondre prévention et arrêt systématique de tout traitement psychiatrique ou dopaminergique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.phel.ch/upload/docs/application/pdf/2023-03/syndrome_nl_malin_aux_urgences_flb_23.02.2023.pdf" target="_blank" rel="noopener">CH-PHEL-CARE — Mesures immédiates et monitoring</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10101189/" target="_blank" rel="noopener">EU-BAP-RECHALL — Recommandation finale et discussion de réintroduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Formes, indication, posologie, organes, sécurité, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325428/" target="_blank" rel="noopener">INT-DIP-MGMT — Treatments and outcomes</a>.</p></template>
