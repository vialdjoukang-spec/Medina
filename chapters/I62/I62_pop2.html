<template data-pop="i62-dexa" data-title="Dexaméthasone : essais Dex-CSDH et DECSA">
<div class="lab">Mécanisme visé</div><p>La dexaméthasone cible l’inflammation locale de la membrane de l’hématome.</p>
<div class="lab">Preuves</div><p>Dex-CSDH (Royaume-Uni, 748 patients, 8 mg deux fois par jour, dégressif sur deux semaines, en plus de la prise en charge habituelle) : issue favorable à six mois 83,9 % contre 90,3 % sous placebo (−6,4 points), réopérations 1,7 % contre 7,1 %, plus d’effets indésirables. DECSA (essai néerlandais, 252 patients, arrêt précoce) : dexaméthasone seule contre trépanation, non-infériorité non démontrée (odds ratio 0,55), complications 59 % contre 32 %, chirurgie secondaire 55 % contre 6 %.</p>
<div class="lab">Calcul</div><p>83,9 − 90,3 = −6,4 points. La réduction de réopérations est de 5,4 points (7,1 − 1,7), mais elle s’obtient au prix d’une issue fonctionnelle moins favorable.</p>
<div class="lab">Effets indésirables, contre-indications, surveillance</div><p>Les effets indésirables sont plus fréquents que sous placebo ; l’information professionnelle de la dexaméthasone n’a pas été consultée, et les contre-indications ne sont donc pas détaillées ici.</p>
<div class="lab">Conclusion</div><p>La revue suisse de 2017, qui admettait les corticoïdes oraux chez le symptomatique non aggravé, précède ces essais, qui l’invalident pour la dexaméthasone.</p>
<p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa2020473" target="_blank" rel="noopener">Hutchinson et coll., dexaméthasone, New England Journal of Medicine, 2020</a> ; <a href="https://doi.org/10.1056/NEJMoa2216767" target="_blank" rel="noopener">Miah et coll., dexaméthasone contre chirurgie, New England Journal of Medicine, 2023</a> ; <a href="https://doi.org/10.57187/smw.2017.14398" target="_blank" rel="noopener">Soleman et coll., prise en charge conservatrice et pharmacologique, Swiss Medical Weekly, 2017</a></p></template>
<template data-pop="i62-atorva" data-title="Atorvastatine : essai ATOCH">
<div class="lab">Mécanisme visé</div><p>L’atorvastatine est étudiée comme anti-angiogénique.</p>
<div class="lab">Preuves</div><p>ATOCH (Chine, phase II, 200 patients) : 20 mg par jour pendant 8 semaines, réduction de volume supplémentaire de 12,55 mL, chirurgie 11,2 % contre 23,5 %. Un essai antérieur sur l’atorvastatine a été rétracté.</p>
<div class="lab">Calcul</div><p>23,5 − 11,2 = 12,3 points de chirurgie en moins dans l’essai chinois.</p>
<div class="lab">Limite</div><p>Données chinoises de phase II ; hypothèse à présenter comme telle, non comme conduite suisse. Effets indésirables et contre-indications non lus.</p>
<p class="src">Références : <a href="https://doi.org/10.1001/jamaneurol.2018.2030" target="_blank" rel="noopener">Jiang et coll., atorvastatine chez des patients chinois, JAMA Neurology, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5450087/" target="_blank" rel="noopener">Edlmann et coll., physiopathologie et pharmacothérapie, Journal of Neuroinflammation, 2017</a></p></template>
<template data-pop="i62-txa" data-title="Acide tranexamique : Cyklokapron et essai TORCH">
<div class="lab">Mécanisme visé</div><p>L’acide tranexamique est un antifibrinolytique ; il vise l’hyperfibrinolyse locale.</p>
<div class="lab">Preuves</div><p>Une série de 7 patients (usage hors indication) ; l’essai TORCH (essai néerlandais, 500 mg deux fois par jour pendant 28 jours, 140 patients prévus) est en protocole, et ses résultats n’ont pas été trouvés.</p>
<div class="lab">Information professionnelle suisse</div><p>L’information professionnelle de Cyklokapron (mise à jour juin 2026) ne mentionne pas l’hématome sous-dural chronique parmi les indications.</p>
<div class="lab">Limite</div><p>Effets indésirables, contre-indications et surveillance non détaillés dans les sources lues. Usage hors indication.</p>
<p class="src">Références : <a href="https://doi.org/10.1080/02688697.2021.1918328" target="_blank" rel="noopener">Lodewijkx et coll., acide tranexamique, British Journal of Neurosurgery, 2021</a> ; <a href="https://doi.org/10.1186/s13063-021-05907-0" target="_blank" rel="noopener">Immenga et coll., protocole de l’essai sur l’acide tranexamique, Trials, 2022</a> ; <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Cyklokapron, mise à jour juin 2026</a></p></template>
<template data-pop="i62-embol" data-title="Embolisation de l’artère méningée moyenne : essais et calcul">
<div class="lab">Essais</div><p>EMBOLISE (400 patients, embolisation associée à la chirurgie contre chirurgie) : réopération 4,1 % contre 11,3 % (risque relatif 0,36) ; accident vasculaire cérébral invalidant lié au geste chez 2 patients. MAGIC-MT (Chine, 722) : 6,7 % contre 9,9 %, non significatif ; événements indésirables graves 6,7 % contre 11,6 %. STEM (310) : échec composite 16 % contre 36 % (odds ratio 0,36).</p>
<div class="lab">Calcul</div><p>EMBOLISE : 11,3 − 4,1 = 7,2 points ; 1 ÷ 0,072 ≈ 14 patients embolisés pour éviter une réopération. 4,1 ÷ 11,3 = 0,36 (risque relatif).</p>
<div class="lab">Méta-analyse</div><p>Trois essais (1432 patients) : risque relatif global 0,50 (intervalle de confiance 0,23 à 1,06), non significatif ; avec chirurgie, 0,60 ; sans chirurgie, 0,36 (réduction de la progression) ; aucun effet sur l’état fonctionnel.</p>
<div class="lab">Limites</div><p>Critères composites ; financement industriel (Medtronic, Balt) ; un empyème sous-dural a été rapporté après embolisation, même avec imagerie stable. Aucune position suisse ou européenne trouvée.</p>
<p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa2313472" target="_blank" rel="noopener">Davies et coll., embolisation de l’artère méningée moyenne, New England Journal of Medicine, 2024</a> ; <a href="https://doi.org/10.1056/NEJMoa2401201" target="_blank" rel="noopener">Liu et coll., embolisation et hématome sous-dural non aigu, New England Journal of Medicine, 2024</a> ; <a href="https://doi.org/10.1056/NEJMoa2409845" target="_blank" rel="noopener">Fiorella et coll., embolisation de l’artère méningée moyenne, New England Journal of Medicine, 2025</a> ; <a href="https://doi.org/10.1007/s00701-025-06587-4" target="_blank" rel="noopener">Gillespie et coll., méta-analyse de trois essais d’embolisation, Acta Neurochirurgica, 2025</a> ; <a href="https://doi.org/10.3171/CASE26631" target="_blank" rel="noopener">Lear et coll., empyème sous-dural bilatéral après embolisation, Journal of Neurosurgery Case Lessons, 2026</a> ; <a href="https://doi.org/10.1016/j.neuchi.2026.101876" target="_blank" rel="noopener">Comby, Raymond et coll., critères composites dans les essais d’embolisation, Neurochirurgie, 2026</a></p></template>
<template data-pop="i62-pronostic" data-title="Survie à long terme après chirurgie">
<div class="lab">Cohorte suisse appariée (359 patients, environ dix ans)</div><p>Survie à 1 an 92,8 % contre 98,8 % ; à 5 ans 76,6 % contre 88,2 % ; à 10 ans 55,5 % contre 73,5 %. Déficits cognitifs et fonctionnels persistants.</p>
<div class="lab">Calcul</div><p>Les écarts sont de 6,0, 11,6 et 18,0 points à 1, 5 et 10 ans : la surmortalité s’accumule avec le temps.</p>
<div class="lab">Autres cohortes</div><p>Cohorte néerlandaise (1307) : hazard ratio de mortalité 1,34 par rapport à la population ; fragilité associée à la mortalité. Allemagne : survie moyenne 4,4 ans contre 6 ans attendus (hazard ratio 1,94).</p>
<p class="src">Références : <a href="https://doi.org/10.1001/jamaneurol.2026.0656" target="_blank" rel="noopener">Petutschnigg et coll., mortalité, cognition et qualité de vie à long terme, JAMA Neurology, 2026</a> ; <a href="https://doi.org/10.1007/s00701-022-05373-w" target="_blank" rel="noopener">Blaauw et coll., mortalité et fragilité, Acta Neurochirurgica, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9277133/" target="_blank" rel="noopener">Hamou et coll., hématome sous-dural chronique, Deutsches Ärzteblatt International, 2022</a></p></template>
<template data-pop="i62-calcul-ccp" data-title="Calcul de la dose du concentré prothrombinique">
<div class="lab">Règle</div><p>Beriplex P/N : 25 UI de facteur IX par kg pour un INR de 2,0 à 3,9 ; 35 pour 4,0 à 6,0 ; 50 au-delà de 6,0 ; maximum 5000 UI.</p>
<div class="lab">Exemple 1 (fictif)</div><p>Poids 70 kg, INR 4,5 : 35 × 70 = 2450 UI, inférieur à 5000.</p>
<div class="lab">Exemple 2 (fictif)</div><p>Poids 120 kg, INR 7 : 50 × 120 = 6000 UI, supérieur à 5000 ; la dose est plafonnée à 5000 UI.</p>
<div class="lab">Comparaison</div><p>La dose fixe du consensus européen (30 ou 50 UI/kg) donnerait 2100 ou 3500 UI à 70 kg.</p>
<p class="src">Références : <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Beriplex P/N 500/1000, mise à jour octobre 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">Steiner et coll., recommandation européenne sur l’hémorragie intracérébrale spontanée, 2025</a></p></template>
<template data-pop="i62-beriplex" data-title="Beriplex P/N : monographie">
<div class="lab">Mécanisme</div><p>Concentré de complexes prothrombiniques destiné à corriger l’INR d’une antivitamine K ; mécanisme détaillé non lu dans le dossier.</p>
<div class="lab">Preuves</div><p>La recommandation européenne retient un concentré avec vitamine K ; les données directes dans l’espace sous-dural manquent.</p>
<div class="lab">Posologie</div><p>25, 35 ou 50 UI de facteur IX par kg pour un INR de 2,0 à 3,9 ; 4,0 à 6,0 ; plus de 6,0 ; maximum 5000 UI. Correction en environ 30 minutes ; vitamine K associée.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Non détaillés dans les sources lues.</p>
<div class="lab">Surveillance</div><p>INR jusqu’à normalisation durable. Mise à jour de la monographie : octobre 2022.</p>
<p class="src">Références : <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Beriplex P/N 500/1000, mise à jour octobre 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">Steiner et coll., recommandation européenne sur l’hémorragie intracérébrale spontanée, 2025</a></p></template>
<template data-pop="i62-praxbind" data-title="Praxbind : monographie">
<div class="lab">Mécanisme</div><p>Antidote spécifique du dabigatran ; mécanisme détaillé non lu dans le dossier.</p>
<div class="lab">Preuves</div><p>REVERSE-AD : 503 patients, dont 53 avec hémorragie intracrânienne.</p>
<div class="lab">Posologie</div><p>5 g par voie intraveineuse (2 × 2,5 g) ; dose supplémentaire possible en cas de récidive hémorragique.</p>
<div class="lab">Surveillance</div><p>Contrôles à 12 et 24 heures. Le temps de thrombine dilué ou le temps d’écarine apprécie l’effet du dabigatran. Mise à jour : mars 2021.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Non détaillés dans les sources lues.</p>
<p class="src">Références : <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Praxbind, mise à jour mars 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">Steiner et coll., recommandation européenne sur l’hémorragie intracérébrale spontanée, 2025</a></p></template>
<template data-pop="i62-ondexxya" data-title="Ondexxya : monographie">
<div class="lab">Indication</div><p>Adultes sous apixaban ou rivaroxaban avec hémorragie incontrôlée ou menaçant le pronostic vital.</p>
<div class="lab">Preuves</div><p>ANNEXA-I (530 patients) : hémostase 67 % contre 53 %, mortalité à 30 jours inchangée, accident vasculaire cérébral ischémique 6,5 % contre 1,5 %.</p>
<div class="lab">Posologie</div><p>Faible dose : 400 mg puis 4 mg/min pendant 120 minutes ; dose élevée : 800 mg puis 8 mg/min pendant 120 minutes, selon la molécule, la dose et le délai (moins de 8 heures ou 8 heures et plus).</p>
<div class="lab">Effets indésirables</div><p>Événements thromboemboliques augmentés (odds ratio 1,92). Contre-indications non détaillées dans les sources lues.</p>
<div class="lab">Surveillance</div><p>Recherche des événements thromboemboliques. Mise à jour : avril 2025.</p>
<p class="src">Références : <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Ondexxya 200 mg, mise à jour avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">Steiner et coll., recommandation européenne sur l’hémorragie intracérébrale spontanée, 2025</a></p></template>
<template data-pop="i62-keppra" data-title="Keppra solution pour perfusion : monographie">
<div class="lab">Place</div><p>Le lévétiracétam est aussi efficace que la phénytoïne avec moins d’effets indésirables dans les hématomes sous-duraux ; aucun essai randomisé n’a testé la prophylaxie.</p>
<div class="lab">Posologie</div><p>Perfusion en 15 minutes ; passage entre voie orale et voie intraveineuse sans titration. La dose adulte détaillée n’a pas été lue.</p>
<div class="lab">Épidémiologie des crises</div><p>Crises précoces 5,3 %, tardives 10 %. Facteurs de risque : alcool (odds ratio 14,3), altération mentale (7,2), accident vasculaire cérébral antérieur (5,3), densité de l’hématome (3,8).</p>
<div class="lab">Effets indésirables, contre-indications, surveillance</div><p>Non détaillés dans les sources lues. Mise à jour de l’information professionnelle : mai 2025.</p>
<p class="src">Références : <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Keppra solution à diluer pour perfusion, mise à jour mai 2025</a> ; <a href="https://doi.org/10.1002/14651858.CD004893.pub3" target="_blank" rel="noopener">Ratilal et coll., anticonvulsivants, Cochrane Database of Systematic Reviews, 2013</a> ; <a href="https://doi.org/10.1016/j.seizure.2016.11.017" target="_blank" rel="noopener">Won et coll., crises épileptiques et hématomes sous-duraux, Seizure, 2017</a></p></template>
<template data-pop="i62-konakion" data-title="Vitamine K : ce qui a été lu">
<div class="lab">Rôle</div><p>La vitamine K par voie intraveineuse est associée au concentré de complexes prothrombiniques sous antivitamine K ; son effet s’installe en 4 à 6 heures, alors que le concentré corrige l’INR en 30 minutes.</p>
<div class="lab">Limite</div><p>Seule l’information pédagogique pédiatrique de Konakion MM (mise à jour janvier 2022) a été obtenue ; la posologie adulte n’a pas été lue. Aucune dose adulte n’est donc donnée ici.</p>
<p class="src">Références : <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Konakion MM pédiatrique, mise à jour janvier 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">Steiner et coll., recommandation européenne sur l’hémorragie intracérébrale spontanée, 2025</a> ; <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Beriplex P/N 500/1000, mise à jour octobre 2022</a></p></template>
<template data-pop="i62-mnemo" data-title="Trois questions avant de décider (aide pédagogique)">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Trois questions guident la première décision : le <b>délai</b> (aigu ou chronique), le <b>grade</b> (Markwalder) et le <b>médicament</b> (antithrombotique). L’enchaînement délai, grade, médicament rappelle l’ordre de l’entretien et de la décision.</p>
<div class="lab">Limite</div><p>Cet ordre est un moyen de mémoire ; il ne remplace ni les critères formels ni la décision neurochirurgicale.</p></template>
<template data-pop="pareto-i62-definition" data-title="Pareto — Définitions et fréquence">
<p class="ratio" data-cover="i62-0,i62-1,i62-2"></p><ul><li>Hématome sous-dural chronique : collection encapsulée sous-durale constituée en trois semaines ou plus ; le code non traumatique exige l’absence de signes traumatiques.</li><li>Markwalder (0 à 4) décide de la prise en charge ; Rankin modifié (0 à 6) mesure le résultat.</li><li>Suisse 2013 : 8,2 pour 100 000 opérés, âge médian 76 ans, 65,6 % d’hommes, maximum de 64,2 entre 80 et 89 ans.</li></ul></template>
<template data-pop="pareto-i62-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="i62-3"></p><ul><li>Membrane externe à capillaires perméables, angiogenèse, hyperfibrinolyse et inflammation forment un cercle auto-entretenu.</li><li>Chaque étape a motivé un essai : dexaméthasone, atorvastatine, acide tranexamique, embolisation.</li><li>Hypotension intracrânienne, anévrisme et drépanocytose sont des causes distinctes qui changent le traitement.</li></ul></template>
<template data-pop="pareto-i62-causes" data-title="Pareto — Causes et risque">
<p class="ratio" data-cover="i62-4"></p><ul><li>Chronique : âge, sexe masculin, antithrombotiques, chute ; chercher l’hypotension intracrânienne.</li><li>Aigu spontané : cause vasculaire ou tumorale dans 48 % ; imagerie vasculaire.</li><li>Extradural spontané : infection craniofaciale, malformation durale, drépanocytose.</li></ul></template>
<template data-pop="pareto-i62-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="i62-5,i62-6"></p><ul><li>Évolution lente avec céphalées, marche instable et troubles cognitifs ; antithrombotique à rechercher.</li><li>Le grade de Markwalder condense l’examen : 0 ou 1, surveillance possible ; symptomatique, évacuation habituelle.</li><li>Mauvais pronostic : âge, Glasgow bas, Rankin élevé à l’admission, déficits multiples.</li></ul></template>
<template data-pop="pareto-i62-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="i62-7"></p><ul><li>Scanner sans contraste en première ligne ; IRM pour les membranes.</li><li>Hématome aigu sans traumatisme : imagerie vasculaire pour exclure un anévrisme rompu.</li><li>Autres diagnostics : traumatique, empyème, hydrocéphalie à pression normale.</li></ul></template>
<template data-pop="pareto-i62-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="i62-8"></p><ul><li>Aigu spontané : chirurgie chez 60 %, mortalité de 10 à 30 %.</li><li>Antidote selon la molécule : concentré et vitamine K, idarucizumab, andexanet alfa ; pas de plaquettes sous antiagrégant.</li><li>Récidive 10 à 20 % ; complications thrombotiques si l’antithrombotique est interrompu.</li></ul></template>
<template data-pop="pareto-i62-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i62-9"></p><ul><li>Évacuer le patient symptomatique ; un drain sous-dural réduit la récidive (9,3 % contre 24 %).</li><li>Aspirine : l’interruption ne réduit pas la récidive de façon démontrée (SECA) ; reprise précoce discutée.</li><li>Dexaméthasone, atorvastatine, acide tranexamique, embolisation : aucun bénéfice fonctionnel démontré.</li></ul></template>
<template data-pop="pareto-i62-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i62-10,i62-11"></p><ul><li>Mortalité de 4 % à 15 semaines ; survie à dix ans de 55,5 % contre 73,5 %.</li><li>Hypotension intracrânienne : fuite fermée d’abord si asymptomatique et 10 mm ou moins, évacuation d’abord si symptomatique.</li><li>Drépanocytose : IRM si scanner normal ; évacuation urgente en cas d’effet de masse.</li></ul></template>
<template data-pop="pareto-i62-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="i62-e-1,i62-e-2,i62-e-3,i62-e-4,i62-e-5"></p><ul><li>Le scanner sans contraste est la première imagerie ; l’IRM voit toutes les membranes (le scanner 27 %).</li><li>L’INR guide le concentré (25, 35 ou 50 UI/kg, maximum 5000 UI) ; thrombine diluée pour le dabigatran, anti-Xa pour l’apixaban et le rivaroxaban.</li><li>Chaque configuration d’imagerie et de contexte oriente vers une entité différente.</li></ul></template>
<template data-pop="pareto-i62-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="i62-s-anat-cours"></p><ul><li>Les espaces extradural et sous-dural sont virtuels ; l’hémorragie les rend réels.</li><li>Veines pontantes et veines diploïques expliquent localisations et mécanismes.</li></ul></template>
<template data-pop="pareto-i62-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="i62-s-histo-cours"></p><ul><li>Membrane externe : capillaires sans péricytes, jonctions lâches, angiopoïétine 2 dominante.</li><li>La membrane persiste après l’évacuation et peut continuer à fuir.</li></ul></template>
<template data-pop="pareto-i62-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="i62-s-physio-cours"></p><ul><li>Fibrinolyse locale élevée : le caillot ne se stabilise pas.</li><li>Antithrombotiques et fuite de liquide cérébro-spinal modifient l’évolution.</li></ul></template>
<template data-pop="pareto-i62-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="i62-s-bioch-cours"></p><ul><li>Facteur de croissance de l’endothélium vasculaire près de 29 fois plus élevé dans le liquide que dans le sérum.</li><li>Un mécanisme plausible ne prouve pas un traitement : seul l’essai clinique tranche.</li></ul></template>
<template data-pop="pareto-i62-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i62-p-1,i62-p-2,i62-p-3,i62-p-4"></p><ul><li>Antidote selon la molécule ; calcul de dose avant prescription ; vérifier l’information professionnelle suisse.</li><li>Dexaméthasone, atorvastatine, acide tranexamique : doses d’essais, sans indication autorisée.</li><li>À éviter : plaquettes sous antiagrégant, dexaméthasone seule à la place de la chirurgie.</li></ul></template>
