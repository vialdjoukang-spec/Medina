<p>Dans cette <b>vignette fictive</b>, un homme de 79 ans prend de l’aspirine en prévention cardiovasculaire. Sa fille le conduit aux urgences : depuis trois semaines, il marche de façon instable et se plaint de céphalées ; depuis deux jours, il est somnolent et désorienté dans le temps. Une chute de plain-pied, sans perte de connaissance, remonte à six semaines. Le scanner cérébral sans produit de contraste montre une collection sous-durale hémisphérique, de densité mixte, qui refoule le cerveau. Ces données pédagogiques servent à poser les quatre décisions de ce cours.</p>
<p>La première décision est diagnostique : il faut reconnaître un <button class="w" data-k="i62-hsdc">hématome sous-dural chronique (définition et délai)</button> et ne pas le confondre avec un saignement aigu, qui obéit à d’autres urgences. La deuxième est thérapeutique : le patient est symptomatique et son <button class="w" data-k="i62-markwalder">score de Markwalder (grades 0 à 4)</button> est à 2, ce qui, selon la revue allemande de référence lue pour ce cours, oriente habituellement vers l’évacuation chirurgicale. La troisième concerne l’antithrombotique : faut-il interrompre l’aspirine ? La quatrième porte sur les traitements adjuvants : dexaméthasone, atorvastatine, acide tranexamique, embolisation de l’artère méningée moyenne.</p>
<p>Le même cours apprend aussi à raisonner devant une collection sous-durale ou extradurale <b>sans traumatisme</b>. Là, la question change : le médecin doit chercher la cause (anévrisme rompu, malformation vasculaire, trouble de la coagulation, hypotension intracrânienne, infection, drépanocytose), car la cause décide du traitement.</p>
<div class="key"><b>À retenir.</b> Trois questions précèdent toute décision : la collection est-elle chronique ou aiguë ? Le patient est-il symptomatique (grade de Markwalder) ? Prend-il un antithrombotique ? La recherche d’une cause s’impose dès qu’aucun traumatisme n’explique la collection.</div>
</section>

<section class="ilot" id="i62-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>L’<b>hématome sous-dural chronique</b>, abrégé HSDC, est une collection encapsulée de liquide et de produits de dégradation du sang dans l’espace sous-dural, entre la dure-mère et l’arachnoïde. Il peut être spontané ou faire suite à un traumatisme ; il se constitue en trois semaines ou plus. Cette définition combine donc un siège, une composition (un mélange de sang à différents stades de dégradation, et non du sang frais) et un délai. Le <button class="w" data-k="i62-hsdc">détail des définitions et des sources</button> est regroupé dans la fenêtre correspondante.</p>
<p>La classification de la Classification internationale des maladies, version allemande 2024, sépare les hématomes sous-duraux non traumatiques en formes aiguë, subaiguë, chronique et non précisée, puis range à part l’hématome extradural non traumatique et l’hémorragie intracrânienne non traumatique sans précision. Le critère « non traumatique » est essentiel : un hématome sous-dural qui résulte d’un traumatisme relève d’une autre rubrique, celle des lésions traumatiques. La rubrique sans précision n’est décrite par aucune des sources lues comme une entité clinique propre : elle sert à coder une hémorragie intracrânienne dont le compartiment n’est pas précisé, et la conduite suit celle du compartiment finalement identifié.</p>
<p>Le tableau suivant place les trois entités de ce cours côte à côte, avec leur poids dans la littérature lue. L’hématome sous-dural chronique concentre presque toutes les données d’essais ; les deux autres entités reposent sur des séries et des revues.</p>
<table class="t"><thead><tr><th>Entité</th><th>Définition abrégée</th><th>Données disponibles</th></tr></thead><tbody><tr><td>Hématome sous-dural chronique</td><td>Collection encapsulée sous-durale constituée en trois semaines ou plus</td><td>Cohortes suisses, essais randomisés (drainage, dexaméthasone, aspirine, embolisation)</td></tr><tr><td>Hématome sous-dural aigu spontané</td><td>Hématome sous-dural aigu sans traumatisme précipitant</td><td>Séries de centres ; 5,2 % des hématomes sous-duraux aigus d’une série tertiaire</td></tr><tr><td>Hématome extradural spontané</td><td>Collection entre la voûte et la dure-mère sans traumatisme</td><td>Revue systématique et cas ; drépanocytose, infections craniofaciales</td></tr></tbody></table>
<p>Deux classifications cliniques structurent la décision. La première est la <b>classification temporelle</b> : aigu, subaigu, chronique. Les trois grands essais d’embolisation regroupent les formes subaiguës et chroniques sous le terme d’hématome <b>non aigu</b> ; le lecteur doit donc retenir qu’un essai « sur l’hématome non aigu » et un essai « sur l’hématome chronique » portent sur des populations voisines, non strictement identiques. La seconde est l’échelle de Markwalder, qui grade l’état neurologique de 0 à 4 et sert de critère d’indication conservatrice et de critère secondaire d’essais.</p>
<table class="t"><thead><tr><th>Grade de Markwalder</th><th>État neurologique</th></tr></thead><tbody><tr><td>0</td><td>Neurologiquement intact</td></tr><tr><td>1</td><td>Vigilant et orienté ; déficit discret ou absent</td></tr><tr><td>2</td><td>Somnolent ou désorienté ; déficit variable</td></tr><tr><td>3</td><td>Stuporeux ; signes focaux sévères</td></tr><tr><td>4</td><td>Comateux ; réponses motrices absentes</td></tr></tbody></table>
<p>Cette échelle décrit l’état clinique au moment de la décision. Elle ne mesure pas le résultat final ; pour cela, les essais emploient l’<button class="w" data-k="i62-mrs">échelle de Rankin modifiée (de 0 à 6)</button>. Le grade de Markwalder répond donc à la question « que faire aujourd’hui ? », et le Rankin à la question « qu’est devenu le patient ? ».</p>
<p>L’imagerie fournit une classification morphologique. Dans une série comparant scanner et <button class="w" data-k="i62-imagerie">IRM (membranes, niveaux et épaisseur)</button>, les hématomes cloisonnés présentent une densité mixte dans 52 % des cas, un niveau liquide-liquide dans 25 % et des membranes intrahématiques dans 60 % ; l’IRM voit toutes ces membranes, le scanner seulement 27 %.</p>
<div class="trap"><span class="k">Piège</span> « Chronique » ne signifie pas « ancien » au sens d’un traumatisme lointain, et « non traumatique » ne signifie pas « sans chute dans l’histoire ». Beaucoup de patients ont chuté quelques semaines plus tôt sans que l’événement paraisse notable. Le code de la classification, non traumatique ou traumatique, est un acte de codage fondé sur le dossier ; la conduite clinique ne change pas selon le code, mais elle change selon la présence ou l’absence de signes traumatiques à l’imagerie, qui justifient une recherche étiologique.</div>
</section>

<section class="ilot" id="i62-2"><h2><span class="n">2</span>Fréquence en Suisse et en Europe</h2>
<p>La meilleure image suisse provient d’une enquête menée dans les quatorze centres de neurochirurgie du pays pour l’année 2013. Elle a recensé <b>663 patients opérés</b>, soit un taux d’admission de <b>8,2 pour 100 000 habitants</b> par an (10,8 chez les hommes, 5,5 chez les femmes). L’âge médian est de 76 ans, et 65,6 % des patients sont des hommes, soit un rapport femmes-hommes de 1 pour 1,9. Le taux atteint un maximum de 64,2 pour 100 000 entre 80 et 89 ans. Le texte précise que cette enquête compte les patients opérés : les patients traités sans opération en sont exclus, de sorte que l’incidence réelle de la maladie est plus élevée que le taux d’admission opératoire. Le détail est regroupé dans la <button class="w" data-k="i62-epi-suisse">fenêtre sur l’enquête suisse 2013</button>.</p>
<table class="t"><thead><tr><th>Tranche d’âge</th><th>Taux d’admission pour 100 000 par an (Suisse, 2013, patients opérés)</th></tr></thead><tbody><tr><td>60 à 69 ans</td><td>13,2</td></tr><tr><td>70 à 79 ans</td><td>36,1</td></tr><tr><td>80 à 89 ans</td><td>64,2</td></tr><tr><td>90 ans et plus</td><td>52,4 (hommes : 131,5)</td></tr></tbody></table>
<p>Le tableau montre une croissance rapide de 60 à 89 ans : le taux est multiplié par 2,7 entre la tranche 70-79 ans et la tranche 60-69 ans, puis par 1,8 entre 80-89 ans et 70-79 ans (36,1 ÷ 13,2 ≈ 2,7 ; 64,2 ÷ 36,1 ≈ 1,8). À partir de 90 ans, le taux global est plus bas, alors que celui des hommes de cette tranche reste très élevé ; les sources lues n’expliquent pas cet écart. Il peut refléter la décision de ne pas opérer des patients très âgés, ce qui est une hypothèse du cours et non un résultat de l’enquête.</p>
<p>Avant l’admission, les patients prenaient dans cette enquête un antivitamine K dans 21,8 % des cas, un anticoagulant oral direct dans 1,5 %, de l’aspirine dans 27,3 % et du clopidogrel dans 4,2 %. Ces pourcentages contiennent des incohérences internes dans l’article d’origine ; ils indiquent un ordre de grandeur (environ un patient sur deux sous antithrombotique), non une valeur à citer au dixième près.</p>
<p>Ailleurs en Europe, une population finlandaise suivie de 1990 à 2015 montre que l’incidence a doublé, de 8,2 à 17,6 pour 100 000 par an. Chez les 80 ans et plus, elle est passée de 46,9 à 129,5. Dans le même temps, l’âge médian est passé de 73 à 79 ans, et la part des patients sous antithrombotique de 27 % à 49 %. Un traumatisme était documenté chez 59 % des patients. Les auteurs de cette série décrivent donc une maladie qui progresse avec le vieillissement et avec la diffusion des antithrombotiques ; une telle association ne démontre pas à elle seule que l’un cause l’autre. Les revues citent des incidences de 1,72 à 20,6 pour 100 000 par an, avec une prédominance masculine, et une revue suisse prévoit un doublement de l’incidence d’ici 2030 du fait du vieillissement.</p>
<p>Deux autres chiffres complètent le tableau. Dans la cohorte d’hypotension intracrânienne spontanée de Freiburg et de Berne, 85 patients sur 272 (31 %) avaient un hématome sous-dural chronique, bilatéral dans 88 % des cas. Parmi les hématomes sous-duraux aigus d’un centre tertiaire, 23 sur 435 (5,2 %) étaient spontanés. Aucune des sources lues ne donne d’incidence propre à l’hématome extradural spontané : c’est une entité rare, décrite par séries et cas.</p>
<div class="key"><b>À retenir.</b> En Suisse, l’hématome sous-dural chronique opéré touche 8,2 personnes pour 100 000 par an, avec un maximum entre 80 et 89 ans (64,2 pour 100 000) et un âge médian de 76 ans. Les hommes sont environ deux fois plus nombreux. L’hématome aigu spontané et l’hématome extradural spontané sont rares et surtout documentés par des séries.</div>

<section class="ilot" id="i62-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Pour comprendre pourquoi un hématome chronique grossit au lieu de se résorber, il faut partir de l’état normal. L’<button class="w" data-k="i62-normal">espace sous-dural (anatomie normale)</button> est un espace virtuel entre l’arachnoïde et la dure-mère. La dure-mère est bordée de cellules de bordure durale, capables de phagocyter et de former un tissu fibro-cellulaire. Les veines pontantes relient le cerveau aux sinus de la dure-mère en traversant cet espace. Tant que l’espace reste virtuel, aucune collection ne s’y installe.</p>
<p>L’histoire de la maladie commence par un <button class="w" data-k="i62-declenchement">déclenchement discuté</button>. L’idée ancienne d’une simple déchirure de veine pontante est aujourd’hui discutée. Les symptômes apparaissent typiquement quatre à sept semaines après un traumatisme souvent minime, parfois absent, et seuls 8 hématomes aigus sur 38 (21 %) évoluent vers un hématome chronique. Une atteinte des cellules de bordure durale déclencherait un cycle inflammatoire. Le mécanisme qui suit explique le délai de plusieurs semaines : l’hématome ne grossit pas par le seul saignement initial, mais par des phénomènes locaux qui s’entretiennent.</p>
<p>Le moteur de la croissance est la <button class="w" data-k="i62-membrane">membrane externe (capillaires perméables)</button>. Ses capillaires sont très perméables : leur membrane basale est mince ou absente, ils n’ont ni cellules musculaires lisses ni péricytes, et leurs jonctions lâches laissent fuir hématies, leucocytes et plasma. L’angiopoïétine 2 y dépasse l’angiopoïétine 1, ce qui favorise des néovaisseaux fragiles. Un capillaire dépourvu de soutien laisse fuir plus facilement le sang : chaque fuite ajoute des hématies et du plasma à la cavité.</p>
<p>Trois mécanismes entretiennent cette fuite. D’abord, l’<button class="w" data-k="i62-vegf">angiogenèse (facteur de croissance de l’endothélium vasculaire)</button> : le liquide d’hématome contient environ 10 277 pg/mL de ce facteur, contre 355 pg/mL dans le sérum, soit plus de 28 fois plus (10 277 ÷ 355 ≈ 29) ; une expression élevée rend la récidive plus probable. Ensuite, l’<button class="w" data-k="i62-fibrinolyse">hyperfibrinolyse (dégradation du caillot)</button> : les produits de dégradation du fibrinogène sont élevés dans la cavité, et un taux élevé de plasminogène ou de l’activateur tissulaire du plasminogène à la chirurgie est associé à la récidive ; la revue estime la néo-hémorragie à environ 10 % par jour, sans préciser dans le résumé retenu la base de ce pourcentage. Enfin, l’<button class="w" data-k="i62-inflammation">inflammation locale (cytokines)</button> : l’interleukine 6, l’interleukine 8, la protéine chimioattractante des monocytes 1 et le facteur de nécrose tumorale alpha sont élevés ; l’interleukine 6 et l’interleukine 8 élevées sont associées à la récidive.</p>
<p>Ces trois mécanismes forment un cercle auto-entretenu, représenté par la figure 1 : l’inflammation produit des néovaisseaux fragiles, ceux-ci saignent par petites quantités, la fibrinolyse empêche le caillot de s’organiser, la collection grossit et entretient l’inflammation. La figure suppose que la croissance relance l’inflammation ; la revue décrit le cercle sans détailler chaque flèche.</p>
<figure><svg viewBox="0 0 640 340" role="img" aria-label="Figure 1 — Cercle auto-entretenu de l’hématome sous-dural chronique" font-size="13"><defs><marker id="i62-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="20" y="20" width="180" height="64" rx="6"/><rect x="230" y="20" width="180" height="64" rx="6"/><rect x="440" y="20" width="180" height="64" rx="6"/><rect x="440" y="236" width="180" height="64" rx="6"/><rect x="230" y="236" width="180" height="64" rx="6"/><rect x="20" y="236" width="180" height="64" rx="6"/><path d="M200 52H226" marker-end="url(#i62-ar)"/><path d="M410 52H436" marker-end="url(#i62-ar)"/><path d="M530 84V232" marker-end="url(#i62-ar)"/><path d="M440 268H414" marker-end="url(#i62-ar)"/><path d="M230 268H204" marker-end="url(#i62-ar)"/><path d="M110 236V210H320V88" marker-end="url(#i62-ar)" stroke-dasharray="5 4"/></g><g fill="currentColor" text-anchor="middle"><text x="110" y="46">1. Déclencheur</text><text x="110" y="66">cellules de bordure durale</text><text x="320" y="46">2. Inflammation locale</text><text x="320" y="66">cytokines élevées</text><text x="530" y="46">3. Néovaisseaux fragiles</text><text x="530" y="66">angiogenèse, perméabilité</text><text x="530" y="262">4. Microsaignements</text><text x="530" y="282">dans la cavité</text><text x="320" y="262">5. Hyperfibrinolyse</text><text x="320" y="282">le caillot ne se stabilise pas</text><text x="110" y="262">6. Croissance</text><text x="110" y="282">de la collection</text><text x="215" y="204" font-size="12">entretient l’inflammation (pointillés)</text></g></svg><figcaption>Figure 1 — Cercle auto-entretenu de l’hématome sous-dural chronique, d’après la revue de physiopathologie de 2017. Le trait pointillé indique le lien de la croissance vers l’inflammation ; il résume la notion de cercle auto-entretenu et ne chiffre aucune étape.</figcaption></figure>
<p>La conséquence thérapeutique de ce schéma est directe : chaque étape du cercle a inspiré un essai. L’inflammation est la cible de la dexaméthasone, l’angiogenèse celle de l’atorvastatine, la fibrinolyse celle de l’acide tranexamique, et la membrane externe celle de l’embolisation de l’artère méningée moyenne, qui vise à dévasculariser la membrane. Les résultats de ces essais, très inégaux, sont détaillés plus loin ; le mécanisme plausible n’a jamais suffi à prouver un bénéfice.</p>
<p>Trois situations s’écartent du schéma classique. Dans l’<button class="w" data-k="i62-his">hypotension intracrânienne spontanée (fuite de liquide cérébro-spinal)</button>, la fuite de liquide cérébro-spinal au niveau spinal est la cause de l’hématome sous-dural ; sa fermeture est donc un traitement causal, et la récidive à trois mois est quasi nulle. Dans l’<button class="w" data-k="i62-aigu-spontane">hématome sous-dural aigu spontané (causes vasculaires)</button>, le saignement provient de la rupture de vaisseaux corticaux ou d’un anévrisme, d’une angiopathie amyloïde, d’une malformation vasculaire, d’un saignement tumoral ou d’une anticoagulation ; une rupture d’anévrisme peut donner un hématome sous-dural sans hémorragie sous-arachnoïdienne. Enfin, l’<button class="w" data-k="i62-extradural">hématome extradural spontané (voûte et dure-mère)</button> survient par des mécanismes osseux ou vasculaires durables ; chez le patient drépanocytaire, un infarctus osseux de la voûte, l’expansion de la moelle hématopoïétique et la congestion des veines diploïques en sont les voies décrites.</p>
<div class="key"><b>À retenir.</b> Un hématome sous-dural chronique n’est pas un caillot immobile : c’est une cavité dont la membrane externe fuit, s’enflamme et empêche la coagulation. Cette cinétique explique le délai de plusieurs semaines, le risque de récidive après évacuation et les cibles des traitements adjuvants.</div>

<section class="ilot" id="i62-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les facteurs de risque de l’hématome chronique se lisent mieux en les rattachant au mécanisme du paragraphe précédent. L’âge avancé, le sexe masculin et les antithrombotiques sont les facteurs retenus par la revue allemande ; les anticoagulants et les antiagrégants augmentent le risque. Le traumatisme mineur est fréquent, mais cette même revue le juge insuffisant pour expliquer à lui seul l’accumulation chronique, ce qui concorde avec la place du cercle inflammatoire. Les sources lues ne détaillent pas pourquoi l’âge expose : le cours constate l’association sans la justifier davantage.</p>
<p>La chute de plain-pied est le mécanisme traumatique le plus rapporté : elle concerne 31 % des patients de moins de 60 ans et 54 % de ceux de 80 ans et plus dans la série finlandaise. La part liée à l’alcool a diminué (de 16 % à 7 %). Les antithrombotiques ont une double conséquence : ils augmentent la fréquence de la maladie et, après l’évacuation, ils posent la question de la reprise (voir la partie sur la prise en charge). Enfin, l’hypotension intracrânienne spontanée est une cause à ne pas manquer : dans la cohorte de Freiburg et Berne, le sexe masculin (odds ratio, ou rapport de cotes, 4) et l’âge supérieur à 70 ans (rapport de cotes 6) étaient associés à la survenue d’un hématome ; la prévalence atteignait 43 % en présence d’une fistule entre liquide cérébro-spinal et veine.</p>
<table class="t"><thead><tr><th>Entité</th><th>Causes et facteurs rapportés</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Hématome sous-dural chronique</td><td>Âge, sexe masculin, antithrombotiques, traumatisme mineur, chute, alcool ; hypotension intracrânienne spontanée</td><td>Interroger les antithrombotiques et les chutes ; chercher les signes d’hypotension intracrânienne, notamment si l’hématome est bilatéral</td></tr><tr><td>Hématome sous-dural aigu spontané</td><td>Vaisseau cortical, anévrisme rompu, angiopathie amyloïde, malformation, anticoagulation, tumeur ; idiopathique chez 12 patients sur 23</td><td>Imagerie vasculaire pour ne pas manquer un anévrisme rompu</td></tr><tr><td>Hématome extradural spontané</td><td>Infection craniofaciale (surtout adolescents de sexe masculin), malformation durale vasculaire, tumeur, trouble de la coagulation, métastase extradurale, drépanocytose</td><td>Traiter la cause (par exemple l’infection sinusienne) et évacuer si l’effet de masse l’exige</td></tr></tbody></table>
<p>Dans l’hématome sous-dural aigu spontané, une cause probable a été identifiée chez 11 patients sur 23 (48 %), surtout vasculaire ou néoplasique ; les 12 autres restaient idiopathiques. Cette proportion rappelle qu’une absence de cause à l’imagerie initiale n’exclut pas une cause : le chiffre justifie l’imagerie complémentaire (angioscanner, IRM, angiographie), pratiquée chez la plupart des patients de cette série.</p>
<div class="trap"><span class="k">Piège</span> La présence d’un antithrombotique n’explique pas à elle seule un hématome aigu spontané : elle peut masquer une cause vasculaire. Une anticoagulation figure parmi les causes possibles, mais elle ne dispense pas de l’imagerie vasculaire.</div>
<div class="key"><b>À retenir.</b> Chronique : âge, sexe masculin, antithrombotiques, chute ; penser à l’hypotension intracrânienne spontanée. Aigu spontané : chercher une cause vasculaire ou tumorale. Extradural spontané : infection craniofaciale, malformation durale, drépanocytose.</div>
<button class="pareto-btn ui" data-k="pareto-i62-causes">▲ Loi de Pareto — Causes et risque</button>
</section>
