<template data-pop="i62-hsdc" data-title="Hématome sous-dural chronique : définition et délai">
<div class="lab">Définition</div><p>L’hématome sous-dural chronique est une collection encapsulée de liquide et de produits de dégradation du sang dans l’espace sous-dural, entre la dure-mère et l’arachnoïde. Il peut être spontané ou post-traumatique et se constitue en trois semaines ou plus. Le mot « chronique » désigne donc un délai et une structure encapsulée, non un traumatisme ancien.</p>
<div class="lab">Terminologie des essais</div><p>Les trois grands essais d’embolisation parlent d’hématome sous-dural <b>non aigu</b> : ils regroupent les formes subaiguës et chroniques. Un résultat obtenu dans un essai « non aigu » s’applique donc à une population voisine, mais plus large, que l’hématome strictement chronique.</p>
<div class="lab">Limite</div><p>La classification de la Classification internationale des maladies sépare les formes non traumatiques aiguë, subaiguë et chronique. La revue allemande définit le seuil à trois semaines ; le guide britannique de 2024 n’a été lu qu’en résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1080/02688697.2024.2413445" target="_blank" rel="noopener">Stubbs et coll., recommandations britanniques sur l’hématome sous-dural chronique, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9277133/" target="_blank" rel="noopener">Hamou et coll., hématome sous-dural chronique, Deutsches Ärzteblatt International, 2022</a> ; <a href="https://doi.org/10.1056/NEJMoa2313472" target="_blank" rel="noopener">Davies et coll., embolisation de l’artère méningée moyenne, New England Journal of Medicine, 2024</a> ; <a href="https://doi.org/10.1056/NEJMoa2401201" target="_blank" rel="noopener">Liu et coll., embolisation et hématome sous-dural non aigu, New England Journal of Medicine, 2024</a></p></template>
<template data-pop="i62-markwalder" data-title="Échelle de Markwalder : grades 0 à 4">
<div class="lab">Définition</div><p>L’échelle de Markwalder grade l’état neurologique d’un patient atteint d’hématome sous-dural chronique de 0 (neurologiquement intact) à 4 (comateux, sans réponse motrice).</p>
<table class="t"><thead><tr><th>Grade</th><th>État neurologique</th></tr></thead><tbody><tr><td>0</td><td>Neurologiquement intact</td></tr><tr><td>1</td><td>Vigilant et orienté ; déficit discret ou absent</td></tr><tr><td>2</td><td>Somnolent ou désorienté ; déficit variable</td></tr><tr><td>3</td><td>Stuporeux ; signes focaux sévères</td></tr><tr><td>4</td><td>Comateux ; réponses motrices absentes</td></tr></tbody></table>
<div class="lab">Application</div><p>La revue suisse de 2017 admet l’attitude d’attente (« wait and watch ») aux grades 0 et 1. La revue allemande recommande habituellement l’opération pour un hématome symptomatique. Les deux textes ne se contredisent pas strictement : le grade 1 admet un déficit discret ou absent, et la décision se partage avec le neurochirurgien. Le grade sert aussi de critère secondaire dans des essais.</p>
<div class="lab">Limite</div><p>Le grade décrit l’état au moment de l’examen, non le pronostic à long terme. Aucun signe, selon la revue suisse, ne prédit la résorption spontanée d’un hématome.</p>
<p class="src">Références : <a href="https://doi.org/10.57187/smw.2017.14398" target="_blank" rel="noopener">Soleman et coll., prise en charge conservatrice et pharmacologique, Swiss Medical Weekly, 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9277133/" target="_blank" rel="noopener">Hamou et coll., hématome sous-dural chronique, Deutsches Ärzteblatt International, 2022</a> ; <a href="https://doi.org/10.1056/NEJMoa2216767" target="_blank" rel="noopener">Miah et coll., dexaméthasone contre chirurgie, New England Journal of Medicine, 2023</a> ; <a href="https://doi.org/10.1056/NEJMoa2409845" target="_blank" rel="noopener">Fiorella et coll., embolisation de l’artère méningée moyenne, New England Journal of Medicine, 2025</a></p></template>
<template data-pop="i62-mrs" data-title="Échelle de Rankin modifiée">
<div class="lab">Définition</div><p>L’échelle de Rankin modifiée, abrégée mRS, est une échelle de 0 à 6 qui mesure le handicap et la dépendance après une maladie neurologique. Elle sert de critère principal dans les essais Dex-CSDH et DECSA.</p>
<div class="lab">Application</div><p>Dans Dex-CSDH, la proportion de patients à l’issue favorable à six mois était de 83,9 % sous dexaméthasone contre 90,3 % sous placebo. Un critère de handicap mesure ce qui compte pour le patient, contrairement à un critère de procédure comme la réopération.</p>
<div class="lab">Limite</div><p>Les sources lues n’énumèrent pas chaque niveau de l’échelle ; la définition de « issue favorable » est celle de l’essai.</p>
<p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa2020473" target="_blank" rel="noopener">Hutchinson et coll., dexaméthasone, New England Journal of Medicine, 2020</a> ; <a href="https://doi.org/10.1056/NEJMoa2216767" target="_blank" rel="noopener">Miah et coll., dexaméthasone contre chirurgie, New England Journal of Medicine, 2023</a></p></template>
<template data-pop="i62-imagerie" data-title="Scanner et IRM des hématomes chroniques">
<div class="lab">Résultats d’une série suisse comparative</div><p>Dans les hématomes cloisonnés, la densité est mixte dans 52 % des cas, un niveau liquide-liquide est présent dans 25 % et des membranes intrahématiques dans 60 %. L’IRM visualise toutes les membranes ; le scanner n’en voit que 27 %. L’IRM mesure des épaisseurs plus grandes.</p>
<div class="lab">Application</div><p>Le scanner sans produit de contraste reste l’examen le plus courant. L’IRM est utile lorsque l’architecture membranaire compte ou que le scanner ne suffit pas. Comme les épaisseurs diffèrent selon la technique, un seuil établi sur l’une ne s’applique pas à l’autre.</p>
<div class="lab">Limite</div><p>La série est un résumé d’étude comparative ; elle ne fournit pas de valeur diagnostique (sensibilité, spécificité).</p>
<p class="src">Références : <a href="https://doi.org/10.4414/smw.2010.12867" target="_blank" rel="noopener">Senturk et coll., scanner et IRM des hématomes sous-duraux chroniques, Swiss Medical Weekly, 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9277133/" target="_blank" rel="noopener">Hamou et coll., hématome sous-dural chronique, Deutsches Ärzteblatt International, 2022</a></p></template>
<template data-pop="i62-epi-suisse" data-title="Enquête suisse 2013 sur l’hématome sous-dural chronique opéré">
<div class="lab">Méthode et résultats</div><p>Quatorze centres de neurochirurgie ont recensé 663 patients opérés en 2013. Le taux d’admission est de 8,2 pour 100 000 (hommes 10,8 ; femmes 5,5). L’âge médian est de 76 ans et 65,6 % des patients sont des hommes. La mortalité est de 4 % à 15 semaines. La récidive est de 20,1 % (104 sur 518), de médiane deux semaines. La trépanation représente 97,3 % des évacuations.</p>
<div class="lab">Calcul</div><p>104 ÷ 518 = 0,2008, soit 20,1 %. Le rapport hommes-femmes est de 10,8 ÷ 5,5 ≈ 2,0.</p>
<div class="lab">Limites</div><p>L’étude est rétrospective, exclut les patients non opérés et contient des incohérences internes de pourcentages (notamment sur les antithrombotiques). Les chiffres servent à situer un ordre de grandeur.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10540067/" target="_blank" rel="noopener">El Rahal et coll., hématome sous-dural chronique opéré en Suisse, Frontiers in Neurology, 2023</a> ; <a href="https://doi.org/10.3171/2018.12.JNS183035" target="_blank" rel="noopener">Rauhala et coll., incidence en Finlande de 1990 à 2015, Journal of Neurosurgery, 2020</a></p></template>
<template data-pop="i62-normal" data-title="Espace sous-dural : anatomie normale">
<div class="lab">Description</div><p>L’espace sous-dural se situe entre l’arachnoïde et la dure-mère. La dure-mère est bordée de cellules de bordure durale, capables de phagocytose et de former un tissu fibro-cellulaire. Les veines pontantes vont du cerveau aux sinus de la dure-mère en traversant cet espace.</p>
<div class="lab">Pourquoi le normal compte</div><p>Dans l’état normal, aucune collection ne s’y installe : l’espace est virtuel. L’hématome crée donc un espace nouveau, délimité par une membrane qui se développe.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5450087/" target="_blank" rel="noopener">Edlmann et coll., physiopathologie et pharmacothérapie, Journal of Neuroinflammation, 2017</a></p></template>
<template data-pop="i62-declenchement" data-title="Déclenchement de l’hématome chronique">
<div class="lab">Constat</div><p>La théorie d’une simple déchirure de veine pontante est discutée. Les symptômes apparaissent typiquement quatre à sept semaines après un traumatisme souvent absent ou minime. Seuls 8 hématomes aigus sur 38 (21 %) évoluent vers un hématome chronique.</p>
<div class="lab">Hypothèse</div><p>L’atteinte des cellules de bordure durale déclencherait un cycle inflammatoire, relayé par la membrane externe. Ce cycle explique le délai.</p>
<div class="lab">Calcul</div><p>8 ÷ 38 = 0,2105, soit 21 %. Quatre cinquièmes des hématomes aigus de cette série n’évoluent donc pas vers un hématome chronique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5450087/" target="_blank" rel="noopener">Edlmann et coll., physiopathologie et pharmacothérapie, Journal of Neuroinflammation, 2017</a></p></template>
<template data-pop="i62-membrane" data-title="Membrane externe : capillaires perméables">
<div class="lab">Structure</div><p>Les capillaires de la membrane externe sont très perméables : membrane basale mince ou absente, absence de cellules musculaires lisses et de péricytes, jonctions lâches qui laissent fuir hématies, leucocytes et plasma.</p>
<div class="lab">Conséquence</div><p>L’angiopoïétine 2 dépasse l’angiopoïétine 1, ce qui favorise des néovaisseaux fragiles. La fuite répétée alimente la cavité et explique la croissance lente.</p>
<div class="lab">Application</div><p>L’embolisation de l’artère méningée moyenne cherche à dévasculariser cette membrane.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5450087/" target="_blank" rel="noopener">Edlmann et coll., physiopathologie et pharmacothérapie, Journal of Neuroinflammation, 2017</a> ; <a href="https://doi.org/10.1007/s00701-025-06587-4" target="_blank" rel="noopener">Gillespie et coll., méta-analyse de trois essais d’embolisation, Acta Neurochirurgica, 2025</a></p></template>
<template data-pop="i62-vegf" data-title="Angiogenèse : facteur de croissance de l’endothélium vasculaire">
<div class="lab">Valeurs</div><p>Le liquide d’hématome contient environ 10 277 pg/mL de facteur de croissance de l’endothélium vasculaire, contre 355 pg/mL dans le sérum. Une expression élevée rend la récidive plus probable.</p>
<div class="lab">Calcul</div><p>10 277 ÷ 355 = 28,95, soit près de 29 fois la concentration sérique. L’excès local indique une production dans la cavité.</p>
<div class="lab">Limite</div><p>Une association avec la récidive ne prouve pas que le facteur la cause, et aucun seuil clinique n’est proposé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5450087/" target="_blank" rel="noopener">Edlmann et coll., physiopathologie et pharmacothérapie, Journal of Neuroinflammation, 2017</a></p></template>
<template data-pop="i62-fibrinolyse" data-title="Hyperfibrinolyse locale">
<div class="lab">Constat</div><p>Les produits de dégradation du fibrinogène sont élevés dans la cavité. Un taux élevé de plasminogène ou d’activateur tissulaire du plasminogène à la chirurgie est associé à la récidive. La néo-hémorragie est estimée à environ 10 % par jour.</p>
<div class="lab">Conséquence</div><p>La fibrinolyse empêche le caillot de s’organiser et le saignement de s’arrêter ; elle justifie l’essai d’antifibrinolytiques comme l’acide tranexamique.</p>
<div class="lab">Limite</div><p>Le résumé retenu ne précise pas la base du pourcentage de 10 % par jour.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5450087/" target="_blank" rel="noopener">Edlmann et coll., physiopathologie et pharmacothérapie, Journal of Neuroinflammation, 2017</a></p></template>
<template data-pop="i62-inflammation" data-title="Inflammation locale : cytokines">
<div class="lab">Constat</div><p>Dans le liquide d’hématome, l’interleukine 6, l’interleukine 8, la protéine chimioattractante des monocytes 1 et le facteur de nécrose tumorale alpha sont élevés. L’interleukine 6 et l’interleukine 8 élevées sont associées à la récidive.</p>
<div class="lab">Application</div><p>Cette inflammation justifie l’essai des corticoïdes. Dans Dex-CSDH, la dexaméthasone a réduit les réopérations (1,7 % contre 7,1 %) mais pas amélioré l’issue fonctionnelle.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5450087/" target="_blank" rel="noopener">Edlmann et coll., physiopathologie et pharmacothérapie, Journal of Neuroinflammation, 2017</a> ; <a href="https://doi.org/10.1056/NEJMoa2020473" target="_blank" rel="noopener">Hutchinson et coll., dexaméthasone, New England Journal of Medicine, 2020</a></p></template>
<template data-pop="i62-his" data-title="Hypotension intracrânienne spontanée et hématome sous-dural">
<div class="lab">Données</div><p>Dans la cohorte de Freiburg et Berne, 85 patients sur 272 (31 %) avaient un hématome sous-dural chronique, bilatéral dans 88 % des cas. La prévalence atteint 43 % en cas de fistule entre liquide cérébro-spinal et veine. Le sexe masculin (odds ratio 4) et l’âge supérieur à 70 ans (odds ratio 6) sont associés à l’hématome.</p>
<div class="lab">Conduite</div><p>La fermeture de la fuite spinale est un traitement causal ; aucune récidive n’a été observée à trois mois. Si le patient est asymptomatique et l’hématome mesure 10 mm ou moins, on ferme la fuite d’abord. Si le patient est symptomatique, l’évacuation immédiate précède la fermeture.</p>
<div class="lab">Calcul</div><p>85 ÷ 272 = 0,3125, soit 31 %.</p>
<div class="lab">Limite</div><p>La sémiologie détaillée de l’hypotension intracrânienne n’a pas été lue ; seul le résumé de la cohorte l’est.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.bas.2025.104320" target="_blank" rel="noopener">Overstijns, El Rahal et coll., hypotension intracrânienne spontanée, Brain and Spine, 2025</a></p></template>
<template data-pop="i62-aigu-spontane" data-title="Hématome sous-dural aigu spontané">
<div class="lab">Fréquence</div><p>Dans un centre tertiaire, 23 hématomes sous-duraux aigus sur 435 étaient spontanés, soit 5,2 % selon le résumé (23 ÷ 435 = 5,3 % au calcul : l’écart tient à l’arrondi de la source).</p>
<div class="lab">Causes</div><p>Une cause probable est identifiée chez 11 patients sur 23 (48 %) : rupture de vaisseaux corticaux ou d’anévrisme, angiopathie amyloïde, malformation vasculaire, saignement tumoral, anticoagulation. Douze restent idiopathiques. Un anévrisme rompu peut donner un hématome sous-dural sans hémorragie sous-arachnoïdienne.</p>
<div class="lab">Clinique et pronostic</div><p>La céphalée aiguë est présente dans 87 % des cas. L’épaisseur moyenne est de 12,0 mm et la déviation médiane de 5,5 mm. La chirurgie est nécessaire chez 60 % des patients, la bonne récupération fonctionnelle atteint 57 % et la mortalité est de 10 à 30 % selon les séries.</p>
<div class="lab">Application</div><p>Imagerie vasculaire chez la plupart des patients ; chirurgie très précoce dans la série à origine artérielle corticale.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.clineuro.2026.109370" target="_blank" rel="noopener">Gabay et coll., hématome sous-dural aigu spontané, Clinical Neurology and Neurosurgery, 2026</a> ; <a href="https://doi.org/10.1016/j.jstrokecerebrovasdis.2006.11.007" target="_blank" rel="noopener">Akioka et coll., hématome sous-dural aigu spontané, Journal of Stroke and Cerebrovascular Diseases, 2007</a> ; <a href="https://doi.org/10.1007/s10140-019-01691-2" target="_blank" rel="noopener">Caton et coll., hémorragie sous-durale non traumatique et anévrisme rompu, Emergency Radiology, 2019</a></p></template>
<template data-pop="i62-extradural" data-title="Hématome extradural spontané">
<div class="lab">Causes rapportées</div><p>Malformations vasculaires durales, tumeurs hémorragiques, troubles de la coagulation, infections craniofaciales (surtout chez l’adolescent de sexe masculin, région frontale près du foyer), métastases extradurales et drépanocytose. Un cas cryptogénique récidivant est décrit.</p>
<div class="lab">Drépanocytose</div><p>L’hématome survient souvent après une crise vaso-occlusive, par infarctus osseux de la voûte, expansion médullaire hématopoïétique et congestion des veines diploïques. La céphalée est unilatérale et sévère ; le scanner initial peut être normal, alors que l’IRM montre l’infarctus et l’hématome.</p>
<div class="lab">Conduite</div><p>Évacuation chirurgicale en urgence si effet de masse ; un cas s’est résorbé spontanément. En cas d’infection craniofaciale, la cause est traitée, notamment par endoscopie sinusienne précoce.</p>
<div class="lab">Limite</div><p>Entité rare : séries et cas seulement, sans incidence chiffrée.</p>
<p class="src">Références : <a href="https://doi.org/10.25259/SNI_1068_2022" target="_blank" rel="noopener">Scafa et coll., hématome extradural spontané et infections craniofaciales, Surgical Neurology International, 2023</a> ; <a href="https://doi.org/10.3389/fneur.2023.1123108" target="_blank" rel="noopener">Xu et coll., hématome extradural spontané récidivant cryptogénique, Frontiers in Neurology, 2023</a> ; <a href="https://doi.org/10.4103/1793-5482.144177" target="_blank" rel="noopener">Mishra et coll., hématome extradural et sous-galéal dans la drépanocytose, Asian Journal of Neurosurgery, 2017</a> ; <a href="https://doi.org/10.1177/0333102411414441" target="_blank" rel="noopener">Arends et coll., céphalée unilatérale sévère et infarctus osseux dans la drépanocytose, Cephalalgia, 2011</a></p></template>
<template data-pop="i62-atcd" data-title="Antécédents et expositions à rechercher">
<div class="lab">À rechercher</div><p>Antithrombotiques (antivitamine K, anticoagulants oraux directs, aspirine, clopidogrel), chutes, consommation d’alcool, drépanocytose, infection craniofaciale récente, symptômes orthostatiques évoquant une hypotension intracrânienne.</p>
<div class="lab">Pourquoi</div><p>Dans l’enquête suisse de 2013, 21,8 % des patients prenaient un antivitamine K, 1,5 % un anticoagulant oral direct, 27,3 % de l’aspirine et 4,2 % du clopidogrel (pourcentages à valeur indicative). En Finlande, les antithrombotiques sont passés de 27 % à 49 % entre 1990 et 2015. La part de l’alcool a baissé de 16 % à 7 %.</p>
<div class="lab">Limite</div><p>Un antithrombotique est un facteur associé, non une cause démontrée isolément.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10540067/" target="_blank" rel="noopener">El Rahal et coll., hématome sous-dural chronique opéré en Suisse, Frontiers in Neurology, 2023</a> ; <a href="https://doi.org/10.3171/2018.12.JNS183035" target="_blank" rel="noopener">Rauhala et coll., incidence en Finlande de 1990 à 2015, Journal of Neurosurgery, 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9277133/" target="_blank" rel="noopener">Hamou et coll., hématome sous-dural chronique, Deutsches Ärzteblatt International, 2022</a></p></template>
<template data-pop="i62-demence" data-title="Démence potentiellement curable">
<div class="lab">Constat</div><p>L’hématome sous-dural chronique, avec l’hydrocéphalie à pression normale, est l’une des rares causes traitables de démence. Il se manifeste par une évolution lente, avec céphalées, marche instable et troubles cognitifs.</p>
<div class="lab">Application</div><p>Chez tout patient âgé avec troubles cognitifs d’installation subaiguë, une imagerie cérébrale écarte ces deux diagnostics curables avant de conclure à une démence dégénérative.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9277133/" target="_blank" rel="noopener">Hamou et coll., hématome sous-dural chronique, Deutsches Ärzteblatt International, 2022</a></p></template>
<template data-pop="i62-conscience" data-title="Vigilance, Markwalder et score de Glasgow">
<div class="lab">Rôle</div><p>La vigilance et l’orientation fondent le grade de Markwalder. Le score de Glasgow, abrégé GCS, bas à l’admission est associé à un mauvais pronostic dans l’enquête suisse, de même que l’âge, l’échelle de Rankin élevée à l’admission et les déficits multiples.</p>
<div class="lab">Application</div><p>Noter le score de Glasgow et le grade de Markwalder à l’arrivée permet de comparer l’évolution et d’informer la famille. Ce sont des facteurs pronostiques, non des critères de renoncement.</p>
<div class="lab">Limite</div><p>Les sources lues ne donnent pas le détail du calcul du score de Glasgow.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10540067/" target="_blank" rel="noopener">El Rahal et coll., hématome sous-dural chronique opéré en Suisse, Frontiers in Neurology, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9277133/" target="_blank" rel="noopener">Hamou et coll., hématome sous-dural chronique, Deutsches Ärzteblatt International, 2022</a></p></template>
<template data-pop="i62-avk" data-title="Antivitamine K : concentré prothrombinique et vitamine K">
<div class="lab">Consensus européen</div><p>La recommandation européenne 2025 sur l’hémorragie intracérébrale retient un concentré de complexes prothrombiniques à dose fixe de 30 ou 50 UI/kg, avec de la vitamine K par voie intraveineuse immédiate, parfois répétée, puis une surveillance de l’INR jusqu’à une normalisation durable.</p>
<div class="lab">Monographie suisse</div><p>Beriplex P/N : 25, 35 ou 50 UI de facteur IX par kg pour un INR de 2,0 à 3,9 ; 4,0 à 6,0 ; plus de 6,0, sans dépasser 5000 UI. La correction survient en environ 30 minutes. La vitamine K est associée, son effet s’installant en 4 à 6 heures ; la répétition de la dose n’est pas étayée.</p>
<div class="lab">Arbitrage</div><p>Les deux repères diffèrent. La monographie suisse précise le produit disponible en Suisse ; le consensus européen est plus récent mais s’applique à l’hémorragie intracérébrale et son libellé exact n’a pu être lu. Le cours présente les deux et recommande de vérifier la monographie avant la prescription.</p>
<div class="lab">Limite</div><p>Application à l’espace sous-dural par extrapolation.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">Steiner et coll., recommandation européenne sur l’hémorragie intracérébrale spontanée, 2025</a> ; <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Beriplex P/N 500/1000, mise à jour octobre 2022</a></p></template>
<template data-pop="i62-idarucizumab" data-title="Dabigatran : idarucizumab">
<div class="lab">Dose</div><p>Praxbind : 5 g par voie intraveineuse (deux perfusions de 2,5 g). Une dose supplémentaire est possible en cas de récidive hémorragique. Des contrôles sont prévus à 12 et 24 heures.</p>
<div class="lab">Preuves</div><p>L’essai REVERSE-AD a inclus 503 patients, dont 53 avec hémorragie intracrânienne.</p>
<div class="lab">Limite</div><p>Application à l’hématome sous-dural par extrapolation ; information professionnelle mise à jour en mars 2021.</p>
<p class="src">Références : <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Praxbind, mise à jour mars 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">Steiner et coll., recommandation européenne sur l’hémorragie intracérébrale spontanée, 2025</a></p></template>
<template data-pop="i62-andexanet" data-title="Apixaban et rivaroxaban : andexanet alfa">
<div class="lab">Indication</div><p>Ondexxya est indiqué chez l’adulte sous apixaban ou rivaroxaban en cas d’hémorragie incontrôlée ou menaçant le pronostic vital.</p>
<div class="lab">Dose</div><p>Faible dose : bolus de 400 mg puis 4 mg/min pendant 120 minutes. Dose élevée : bolus de 800 mg puis 8 mg/min pendant 120 minutes. Le choix dépend de la molécule, de la dose prise et du délai (moins de 8 heures ou 8 heures et plus).</p>
<div class="lab">Preuves</div><p>ANNEXA-I (530 patients) : hémostase 67 % contre 53 %, mortalité à 30 jours inchangée, événements thromboemboliques augmentés (odds ratio 1,92), accident vasculaire cérébral ischémique 6,5 % contre 1,5 %. Un concentré de complexes prothrombiniques n’a pas de bénéfice clair dans les données observationnelles.</p>
<div class="lab">Calcul</div><p>L’écart d’hémostase est de 14 points (67 − 53). Le nombre de patients à traiter pour obtenir une hémostase supplémentaire est d’environ 7 (1 ÷ 0,14). L’écart d’accident vasculaire cérébral ischémique est de 5 points (6,5 − 1,5), soit un patient supplémentaire sur 20.</p>
<div class="lab">Limite</div><p>Information professionnelle mise à jour en avril 2025.</p>
<p class="src">Références : <a href="https://www.swissmedicinfo.ch" target="_blank" rel="noopener">Information professionnelle suisse Ondexxya 200 mg, mise à jour avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">Steiner et coll., recommandation européenne sur l’hémorragie intracérébrale spontanée, 2025</a></p></template>
<template data-pop="i62-plaquettes" data-title="Antiagrégants et transfusion plaquettaire">
<div class="lab">Constat</div><p>Dans l’hémorragie intracérébrale sous antiagrégant, la transfusion plaquettaire est défavorable (odds ratio de décès ou de dépendance 2,04). La recommandation européenne est faible contre.</p>
<div class="lab">Application</div><p>On ne transfuse pas systématiquement des plaquettes à un patient sous aspirine ou clopidogrel. Pour l’hématome sous-dural, l’application est une extrapolation.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener">Steiner et coll., recommandation européenne sur l’hémorragie intracérébrale spontanée, 2025</a></p></template>
<template data-pop="i62-iceni" data-title="Guide britannique ICENI 2024 : ce qui a été lu">
<div class="lab">Contenu connu</div><p>67 recommandations en huit thèmes : présentation et diagnostic, triage neurochirurgical et décision partagée, traitement non opératoire, période périopératoire dont l’anticoagulation, délai chirurgical, soins per- et postopératoires, rééducation et récupération. Les données d’essais sont surtout disponibles pour la technique chirurgicale et les corticoïdes.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu (texte intégral inaccessible) : les recommandations ne sont pas détaillées dans ce cours. Ce guide est britannique, non suisse ; aucune recommandation suisse ni européenne propre à cet hématome n’a été trouvée.</p>
<p class="src">Références : <a href="https://doi.org/10.1080/02688697.2024.2413445" target="_blank" rel="noopener">Stubbs et coll., recommandations britanniques sur l’hématome sous-dural chronique, 2024</a></p></template>
<template data-pop="i62-drain" data-title="Drains après trépanation : calcul des différences">
<div class="lab">Drain sous-dural contre aucun drain</div><p>Essai britannique (215 patients) : récidive 9,3 % contre 24 %, mortalité à six mois 8,6 % contre 18,1 %.</p>
<div class="lab">Calcul</div><p>24 − 9,3 = 14,7 points de récidive en moins ; 1 ÷ 0,147 ≈ 7 patients à drainer pour éviter une récidive. 18,1 − 8,6 = 9,5 points de mortalité en moins.</p>
<div class="lab">Drain sous-périosté contre sous-dural</div><p>Essai d’Aarau et de Bâle (220 patients) : récidive 8,33 % contre 12,00 %. La non-infériorité du drain sous-périosté n’est pas démontrée ; il y avait moins d’infections chirurgicales et de malpositions.</p>
<div class="lab">Limite</div><p>Enquête suisse 2013 : drain sous-dural 33,2 %, sous-galéal 57,2 % des patients ; la pratique ne suit donc pas partout l’essai.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(09)61115-6" target="_blank" rel="noopener">Santarius et coll., drainage après trépanation, The Lancet, 2009</a> ; <a href="https://edoc.unibas.ch/74417" target="_blank" rel="noopener">Soleman et coll., drain sous-périosté contre drain sous-dural, Neurosurgery, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10540067/" target="_blank" rel="noopener">El Rahal et coll., hématome sous-dural chronique opéré en Suisse, Frontiers in Neurology, 2023</a></p></template>
<template data-pop="i62-aspirine" data-title="Aspirine : essai SECA et reprise des antithrombotiques">
<div class="lab">Essai SECA</div><p>Six centres suisses, 155 patients : aspirine poursuivie ou placebo pendant 12 jours périopératoires. Réopération à six mois : 13,9 % contre 9,5 %. La différence de 4,4 points a un intervalle de confiance à 95 % de −7,2 à 15,9 et n’est pas significative.</p>
<div class="lab">Lecture</div><p>L’interruption de l’aspirine ne réduit pas la récidive de façon démontrée. L’intervalle large inclut aussi bien un bénéfice qu’un excès de risque : l’essai n’exclut pas une différence modeste.</p>
<div class="lab">Reprise</div><p>Cohorte de Stockholm (763 patients) : récidive à trois mois 11,0 % ou 12,0 % selon la présence d’antithrombotique ; reprise précoce (30 jours ou moins) : moins de thromboembolies (2,0 % contre 7,0 %) sans plus de récidive. Cohorte allemande (395) : complications thrombotiques 9,1 % sous antithrombotiques contre 1 % ; interruption prédictive (odds ratio 8,28) ; neuf études sur onze recommandent une reprise aussi précoce que possible.</p>
<div class="lab">Limite</div><p>Aucune donnée randomisée sur le moment de la reprise ; les cohortes sont observationnelles.</p>
<p class="src">Références : <a href="https://doi.org/10.1001/jamaneurol.2025.0850" target="_blank" rel="noopener">Kamenova et coll., poursuite ou interruption de l’aspirine, JAMA Neurology, 2025</a> ; <a href="https://doi.org/10.1007/s00701-017-3330-x" target="_blank" rel="noopener">Fornebo et coll., antithrombotiques, récidive et thromboembolies, Acta Neurochirurgica, 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9277133/" target="_blank" rel="noopener">Hamou et coll., hématome sous-dural chronique, Deutsches Ärzteblatt International, 2022</a></p></template>
