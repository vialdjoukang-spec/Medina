<div class="lab">Mycoplasma pneumoniae</div><p>Cette bactérie n'a pas de paroi, ce qui la rend insensible aux bêtalactamines. Elle touche surtout des patients plus jeunes et évolue par épidémies ; sa fréquence varie donc d'une année à l'autre. Elle peut donner des complications hors du poumon : atteintes neurologiques, anémie hémolytique, éruptions, myocardite ou péricardite. La SSI la traite par la doxycycline 100 mg toutes les 12 heures ou par l'azithromycine 500 mg par jour.</p>
<div class="lab">Chlamydia pneumoniae</div><p>Cette bactérie intracellulaire donne souvent une maladie peu sévère, aux symptômes non spécifiques, parfois avec des céphalées et des symptômes plus prolongés avant l'admission. Les macrolides la couvrent.</p>
<div class="lab">Coxiella burnetii</div><p>L'agent de la fièvre Q se transmet par des animaux de ferme ou des chattes qui mettent bas. La British Thoracic Society décrit une toux sèche et une fièvre élevée, plus souvent chez l'homme jeune. En cas de suspicion, la SSI propose une sérologie ou une amplification génique dans le sang, puis un traitement par la doxycycline.</p>
<div class="lab">Conséquence pratique</div><p>Ces trois agents ne répondent pas à l'amoxicilline. Un patient jeune qui ne s'améliore pas sous bêtalactamine doit faire penser à eux.</p>
</template>
<template data-pop="j18-pa-virus" data-title="Virus respiratoires">
<div class="lab">Fréquence</div><p>Dans les études britanniques réunies en 2009, un virus a été identifié chez 13,1 % des patients soignés en ville et 12,8 % des patients hospitalisés, le plus souvent le virus grippal. Une étude américaine de 2015, qui a recherché systématiquement les virus par amplification génique, en a trouvé chez 23 % des adultes hospitalisés, en tête le rhinovirus (9 %) et le virus grippal (6 %).</p>
<div class="lab">Présentation</div><p>Selon la SSI, la grippe peut se présenter avec des céphalées, des douleurs articulaires, des myalgies, un malaise et parfois des troubles digestifs, et la présentation peut être atypique chez le sujet âgé. Une amélioration suivie d'une nouvelle aggravation fait craindre une surinfection bactérienne ; la SSI cite la surinfection à <i>S. aureus</i>, qu'elle traite en ajoutant la clindamycine ou le linézolide jusqu'à l'exclusion d'une toxine de Panton et Valentine.</p>
<div class="lab">Tests</div><p>La SSI recommande une amplification génique de la grippe pendant la saison chez le patient hospitalisé. En ville, elle ne recommande un test que si un antiviral est envisagé, et elle déconseille les tests rapides antigéniques chez l'adulte, dont la valeur prédictive négative est insuffisante.</p>
<div class="lab">Traitement</div><p>La SSI donne l'oseltamivir 75 mg toutes les 12 heures au patient hospitalisé pendant la saison, jusqu'à ce que la grippe soit exclue. Elle déconseille l'antibiotique chez le patient ambulatoire atteint de grippe ou d'infection à SARS-CoV-2 lorsque la suspicion de surinfection est faible. Chez le patient hospitalisé, l'oseltamivir s'ajoute à l'antibiothérapie et ne la remplace pas (SSI).</p>
<div class="lab">Piège</div><p>Un virus détecté n'exclut pas une bactérie associée : dans l'étude américaine de 2015, 3 % des patients avaient à la fois un virus et une bactérie.</p>
</template>
<template data-pop="j18-pa-staph" data-title="Staphylococcus aureus">
<div class="lab">Fréquence et terrain</div><p><i>Staphylococcus aureus</i> reste rare en ville, où il représentait 0,8 % des agents identifiés dans les études britanniques, mais il atteint 8,7 % en soins intensifs. Il complique typiquement une grippe, comme le rappelle la SSI dans son traitement ciblé.</p>
<div class="lab">Formes graves</div><p>Certaines souches produisent la toxine de Panton et Valentine. Selon la British Thoracic Society, elles peuvent provoquer une pneumonie nécrosante avec une cavitation rapide et une défaillance de plusieurs organes, qui justifie une admission en soins intensifs. L'imagerie peut montrer des cavités, des pneumatocèles ou un pneumothorax.</p>
<div class="lab">Traitement</div><p>La SSI traite la souche sensible à la méticilline par la flucloxacilline 2 g toutes les 6 heures par voie intraveineuse, et la souche résistante par le linézolide 600 mg toutes les 12 heures ou par la vancomycine. En cas de suspicion de surinfection d'une grippe, elle ajoute la clindamycine ou le linézolide jusqu'à l'exclusion d'une production de la toxine.</p>
<div class="lab">Conséquence pratique</div><p>Une pneumonie grave qui suit une grippe, surtout avec des cavités, doit faire penser à <i>S. aureus</i> et faire appeler les soins intensifs.</p>
</template>
<template data-pop="j18-pa-resist" data-title="Facteurs de risque de germes résistants">
<div class="lab">Selon la SSI</div><p>Dans la pneumonie sévère, la SSI retient un traitement antibiotique dans les 90 jours précédents et l'hémodialyse. Elle recommande alors la pipéracilline-tazobactam 4,5 g toutes les 6 à 8 heures par voie intraveineuse, associée à un macrolide. Elle demande aussi d'évaluer individuellement le risque de germe nosocomial ou multirésistant après une hospitalisation dans les six mois précédents.</p>
<div class="lab">Selon les recommandations européennes de 2023</div><p>Elles classent les facteurs de risque de germes résistants en quatre groupes : l'exposition aux soins, la colonisation persistante (immunosuppression, maladie pulmonaire chronique, colonisation ou infection antérieure par un germe résistant), la pression de sélection d'un antibiotique et les facteurs qui modifient la physiologie de l'hôte (troubles cognitifs ou neurologiques, suppression de l'acidité gastrique). Elles suggèrent d'intégrer ces facteurs, au besoin dans un score, à l'épidémiologie locale et aux colonisations antérieures (recommandation conditionnelle, qualité de preuve modérée). Les scores disponibles sont très sensibles et peu spécifiques ; leur valeur prédictive négative, le plus souvent supérieure à 90 %, permet surtout d'épargner un spectre large aux patients à faible risque.</p>
<div class="lab">Autres terrains</div><p>Selon les recommandations européennes de 2011, <i>P. aeruginosa</i> est fréquent dans les bronchectasies, surtout lorsque la fonction pulmonaire est altérée ; elles demandent de traiter le patient à risque de pneumonie à <i>P. aeruginosa</i> par deux antibiotiques actifs sur ce germe, puis de passer à une monothérapie selon l'antibiogramme. La fiche SSI, plus récente, fait seulement envisager l'association à un aminoside, et sa position prime en Suisse. Chez l'alcoolique, la British Thoracic Society rapporte une fréquence possiblement accrue de l'aspiration, du pneumocoque, des bacilles à Gram négatif entériques, de <i>Legionella</i> et des anaérobies.</p>
<div class="lab">Piège</div><p>Les recommandations européennes de 2023 rappellent que la catégorie de « pneumonie associée aux soins » a été abandonnée comme critère de spectre élargi. La SSI inclut d'ailleurs les résidents des établissements de soins dans la pneumonie communautaire : ce seul séjour ne justifie pas un antibiotique à très large spectre.</p>
</template>
<template data-pop="j18-pa-tabac" data-title="Tabac et alcool">
<div class="lab">Pourquoi les rechercher</div><p>Le tabagisme actif ou passif est un facteur de risque indépendant de pneumonie communautaire selon la British Thoracic Society. Pour l'infection invasive à pneumocoque, le risque augmente avec le nombre de cigarettes par jour et de paquets-années, et il diminue avec le temps écoulé depuis l'arrêt. Le tabac altère la clairance mucociliaire.</p>
<div class="lab">L'alcool</div><p>L'alcool augmente le risque d'aspiration et affaiblit les défenses. Chez l'alcoolique, la British Thoracic Society rapporte une fréquence possiblement accrue de l'aspiration, du pneumocoque, y compris bactériémique, des bacilles à Gram négatif entériques, de <i>Legionella</i>, des agents atypiques et des anaérobies. La British Thoracic Society note que les patients alcooliques sont particulièrement exposés aux formes bactériémiques et mortelles de la pneumonie à <i>Klebsiella</i>.</p>
<div class="lab">Conséquence pratique</div><p>La British Thoracic Society recommande de proposer une aide à l'arrêt du tabac à tout patient fumeur atteint de pneumonie, et la SSI inscrit l'arrêt du tabac dans la prévention. Chez un fumeur ou un ancien fumeur de plus de 50 ans, la British Thoracic Society demande une radiographie de contrôle vers 6 semaines, parce que le risque de cancer bronchique est plus élevé. Chez le patient alcoolique, le médecin prévient le sevrage pendant l'hospitalisation.</p>
</template>
<template data-pop="j18-pa-pouls" data-title="Fréquence cardiaque">
<div class="lab">Technique</div><p>Le médecin compte le pouls radial pendant au moins trente secondes, et pendant une minute entière si le rythme est irrégulier. En cas de doute, il le compare au moniteur ou à l'ECG.</p>
<div class="lab">Valeur</div><p>Un pouls d'au moins 100 par minute fait partie des cinq signes de probabilité de pneumonie de la SSI. Dans l'étude européenne de soins primaires, une tachycardie supérieure à 100 par minute augmentait la probabilité de pneumonie (rapport de cotes ajusté de 2,3). Une fréquence cardiaque d'au plus 100 par minute est un des critères de stabilité avant le relais oral.</p>
<div class="lab">Piège</div><p>Un bêtabloquant peut masquer la tachycardie du sepsis. Une fibrillation auriculaire nouvelle peut révéler une complication cardiaque de la pneumonie.</p>
<div class="lab">Conséquence pratique</div><p>Une tachycardie qui persiste malgré la baisse de la fièvre fait chercher une hypovolémie, une arythmie, une embolie ou un sepsis mal contrôlé.</p>
</template>
<template data-pop="j18-pa-temp" data-title="Température">
<div class="lab">Technique</div><p>La SSI définit la fièvre utile au diagnostic par une mesure rectale ou auriculaire. Le médecin note la valeur maximale, la durée de la fièvre et la prise d'antipyrétiques, qui peut la masquer.</p>
<div class="lab">Seuils</div><p>Une fièvre mesurée d'au moins 38,5 °C pendant plus de trois jours est un signe de probabilité de pneumonie selon la SSI. Dans l'étude européenne de soins primaires, une température supérieure à 37,8 °C faisait partie du modèle diagnostique. Une température inférieure à 36 °C figure parmi les critères de surveillance intensifiée de la SSI, et une température d'au plus 37,8 °C est un critère de stabilité.</p>
<div class="lab">Piège</div><p>Dans une série suisse de patients hospitalisés, seuls 64 % avaient une fièvre supérieure à 38 °C. L'absence de fièvre n'exclut donc pas la pneumonie, surtout chez le sujet âgé, et une hypothermie signale une forme grave.</p>
<div class="lab">Conséquence pratique</div><p>Une fièvre qui persiste au-delà de 72 heures sous un antibiotique adapté fait chercher une complication, comme un épanchement pleural, ou un agent non couvert.</p>
</template>
<template data-pop="j18-pa-mental" data-title="État mental et test mental abrégé">
<div class="lab">Technique</div><p>La British Thoracic Society définit la confusion du CURB-65 par un test mental abrégé d'au plus 8 sur 10. Ce test compte un point par réponse juste à dix questions simples : l'âge, la date de naissance, l'heure, l'année, le nom de l'hôpital, la reconnaissance de deux personnes, le rappel d'une adresse, la date de la Première Guerre mondiale, le nom du monarque régnant, adapté au pays, et le compte à rebours de 20 à 1.</p>
<div class="lab">Valeur</div><p>Une confusion nouvelle donne un point dans le CRB-65 et le CURB-65 et figure parmi les critères de surveillance intensifiée de la SSI. Elle traduit l'hypoxémie, l'hypoperfusion cérébrale ou le sepsis.</p>
<div class="lab">Piège</div><p>Chez un patient déjà atteint de démence, seule une aggravation par rapport à l'état habituel compte ; le médecin interroge donc l'entourage. Une confusion attribuée par défaut à l'âge retarde le diagnostic.</p>
<div class="lab">Chez Madame R.</div><p>Un score de 6 sur 10 signe une confusion au sens du CURB-65 et place Madame R. d'emblée dans le groupe à risque.</p>
</template>
<template data-pop="j18-pa-murmure" data-title="Diminution du murmure vésiculaire">
<div class="lab">Technique</div><p>Le médecin ausculte symétriquement, en demandant au patient de respirer profondément par la bouche, et il compare l'intensité du bruit respiratoire des deux côtés au même niveau.</p>
<div class="lab">Mécanisme</div><p>Le murmure vésiculaire naît du passage de l'air dans les voies aériennes et les alvéoles. Il diminue lorsque moins d'air entre dans une région, par exemple lorsque l'exsudat comble les alvéoles et les petites bronches, ou lorsqu'un épanchement éloigne le poumon de la paroi.</p>
<div class="lab">Valeur</div><p>Dans l'étude européenne de soins primaires, la diminution du murmure vésiculaire faisait partie des six éléments du modèle qui prédisait la pneumonie, avec l'absence de rhinorrhée, l'essoufflement, les crépitants, la tachycardie et la fièvre.</p>
<div class="lab">Piège</div><p>Une obésité, un emphysème ou un pneumothorax diminuent aussi le murmure. Associée à une matité et à une abolition des vibrations vocales, la diminution du murmure oriente vers un épanchement plutôt que vers une consolidation.</p>
</template>
<template data-pop="j18-pa-crp" data-title="Protéine C réactive">
<div class="lab">Définition</div><p>La protéine C réactive est synthétisée par le foie sous l'effet de l'IL-6 au cours de l'inflammation. Sa concentration s'élève en quelques heures et reflète l'intensité de la réponse inflammatoire, sans désigner l'agent ni le foyer.</p>
<div class="lab">Mode d'emploi en ville</div><p>La SSI réserve le dosage à la toux aiguë avec au moins un signe de probabilité de pneumonie. Au-dessous de 50 mg/L, le médecin privilégie un traitement symptomatique ; de 50 à 100 mg/L, il décide avec le patient ; à partir de 100 mg/L, il envisage un antibiotique.</p>
<div class="lab">Valeur</div><p>Dans l'étude européenne de soins primaires de 2013, la proportion de pneumonies était de 3 % au-dessous de 20 mg/L, de 7 % entre 30 et 50 mg/L, de 15 % entre 50 et 100 mg/L et de 35 % au-dessus de 100 mg/L. Ajoutée aux signes cliniques, une valeur supérieure à 30 mg/L améliorait la classification des patients ; la procalcitonine n'apportait rien de plus.</p>
<div class="lab">Suivi</div><p>La SSI fait contrôler la protéine C réactive ou la procalcitonine après 3 à 4 jours. Selon la British Thoracic Society, une protéine C réactive qui ne baisse pas de 50 % s'associe à une mortalité plus élevée et à davantage de complications, comme l'empyème.</p>
<div class="lab">Piège</div><p>Une valeur basse au début de la maladie n'élimine pas une pneumonie, et une valeur élevée ne distingue pas sûrement un virus d'une bactérie. Chez le patient hospitalisé ou instable, ces seuils ne servent pas de veto.</p>
</template>
<template data-pop="j18-pa-pct" data-title="Procalcitonine">
<div class="lab">Définition</div><p>La procalcitonine est un précurseur de la calcitonine dont la concentration sanguine augmente surtout au cours des infections bactériennes, et beaucoup moins au cours des infections virales.</p>
<div class="lab">Seuil et usage en Suisse</div><p>La SSI retient un seuil de 0,25 µg/L. Au-dessous, elle admet de ne pas prescrire d'antibiotique au patient ambulatoire ; à partir de ce seuil, elle fait envisager un antibiotique. Elle précise qu'en juin 2025 le test au lit du patient ne figurait pas dans la liste des analyses du cabinet médical et n'était pas remboursé.</p>
<div class="lab">Preuves</div><p>Un essai randomisé suisse mené dans 60 cabinets chez 469 patients atteints de pneumonie clinique a réduit la probabilité d'une prescription d'antibiotique à 28 jours de 0,70 à 0,40 grâce à la procalcitonine, sans effet défavorable sur la sécurité selon les auteurs ; la non-infériorité n'a pas été démontrée pour la durée des activités restreintes. Dans l'étude européenne de soins primaires de 2013, la procalcitonine n'ajoutait aucune information utile aux signes cliniques et à la protéine C réactive.</p>
<div class="lab">Limite à l'hôpital</div><p>La SSI ne prévoit aucun seuil de procalcitonine pour renoncer à l'antibiotique chez le patient hospitalisé. Dans la forme sévère, les recommandations européennes de 2023 n'emploient la procalcitonine que pour raccourcir la durée du traitement, toujours avec l'évaluation clinique.</p>
<div class="lab">Conséquence pratique</div><p>La SSI admet, dans les centres expérimentés, de guider la durée du traitement par la procalcitonine.</p>
</template>
<template data-pop="j18-pa-rx" data-title="Radiographie thoracique">
<div class="lab">Indications</div><p>À l'hôpital, la SSI exige une imagerie chez tout patient suspect de pneumonie, et la British Thoracic Society demande une radiographie aussi tôt que possible pour confirmer ou écarter le diagnostic. En ville, le médecin la demande lorsque la pneumonie est suspectée, lorsque le diagnostic est douteux, lorsque l'évolution déçoit ou lorsque le patient est à risque d'un cancer bronchique.</p>
<div class="lab">Technique et lecture</div><p>La radiographie se fait de face et de profil. Le médecin cherche une opacité nouvelle, souvent systématisée à un lobe ou à un segment, parfois traversée d'un bronchogramme aérien. Il vérifie la qualité technique, compare l'image aux clichés antérieurs et cherche un épanchement, une cavité ou une atteinte de plusieurs lobes.</p>
<div class="lab">Limites</div><p>La fiche SSI des infections respiratoires aiguës rappelle que la radiographie reconnaît mal une consolidation, ce qui justifie de ne pas la demander de routine chez tout patient qui tousse. Une image initiale peut être normale chez un patient déshydraté ou vu très tôt. L'image guérit aussi plus lentement que le patient : l'opacité n'avait disparu que chez 51 % des patients à 2 semaines dans une étude citée par la British Thoracic Society.</p>
<div class="lab">Piège</div><p>Une opacité n'est pas toujours infectieuse : un œdème, un infarctus pulmonaire, une hémorragie alvéolaire ou un cancer en produisent aussi. L'onglet Examens complémentaires détaille la lecture de l'image.</p>
</template>
<template data-pop="j18-pa-echo" data-title="Échographie pulmonaire">
<div class="lab">Principe</div><p>Le poumon aéré réfléchit les ultrasons et ne montre que des artefacts. Une consolidation qui touche la plèvre laisse au contraire passer les ultrasons et apparaît comme un tissu plein, parfois traversé de bronches aérées. Un épanchement apparaît comme une zone liquidienne.</p>
<div class="lab">Place selon la SSI</div><p>La SSI en fait une alternative à la radiographie lorsque celle-ci n'est pas disponible et qu'un examinateur expérimenté est présent. Elle rappelle sa limite : l'échographie ne voit pas les pneumonies centrales, séparées de la paroi par du poumon aéré.</p>
<div class="lab">Preuves en médecine de famille</div><p>Dans l'essai suisse mené dans 60 cabinets, ajouter l'échographie pulmonaire à la procalcitonine n'a pas réduit davantage les prescriptions d'antibiotique. Les auteurs n'excluent pas un intérêt, parce que les intervalles de confiance étaient larges.</p>
<div class="lab">Conséquence pratique</div><p>L'échographie guide aussi la ponction d'un épanchement pleural et permet de le surveiller, comme la SSI le prévoit.</p>
</template>
<template data-pop="j18-pa-micro" data-title="Bilan microbiologique">
<div class="lab">En ville</div><p>La SSI ne recommande aucun test microbiologique chez le patient ambulatoire, sauf, rarement, l'antigène urinaire de <i>Legionella</i> en cas de suspicion épidémique ou d'échec d'une bêtalactamine. La British Thoracic Society ne demande aucun examen de routine chez le patient à faible gravité soigné à domicile.</p>
<div class="lab">À l'hôpital</div><p>La SSI prévoit deux paires d'hémocultures, les antigènes urinaires de <i>Legionella</i> et du pneumocoque, la coloration de Gram et la culture de l'expectoration si elle peut être traitée en moins de 4 heures, l'amplification génique de la grippe pendant la saison et la ponction d'un épanchement pleural si elle est possible. Elle discute l'amplification génique de <i>Mycoplasma</i>, la recherche de <i>Coxiella</i> et celle des mycobactéries selon la clinique et l'épidémiologie.</p>
<div class="lab">Rendement</div><p>La sensibilité des hémocultures ne dépasse pas 25 %, même dans la pneumonie à pneumocoque, et elle baisse après un antibiotique. Dans les séries britanniques, aucun agent n'était identifié chez 30,8 % des patients hospitalisés. L'antigène urinaire de <i>Legionella</i> ne reconnaît que <i>L. pneumophila</i>.</p>
<div class="lab">Piège</div><p>Une expectoration riche en cellules de la bouche reflète la flore de l'oropharynx et ne permet pas de conclure. Un résultat négatif n'exclut pas l'agent, et une culture positive se confronte à la qualité du prélèvement.</p>
</template>
<template data-pop="j18-pa-psi" data-title="Pneumonia Severity Index (PSI)">
<div class="lab">Définition</div><p>Le PSI, ou Pneumonia Severity Index, est un score pronostique américain publié en 1997. Il additionne des points attribués à 20 variables démographiques, cliniques, biologiques et radiologiques, et il répartit les patients en cinq classes selon le risque de décès à 30 jours. Il a été dérivé chez 14 199 patients hospitalisés et validé chez 38 039 autres.</p>
<div class="lab">Mortalité par classe</div><p>Dans l'étude originale, la mortalité était de 0,1 %, 0,6 %, 0,9 %, 9,3 % et 27 % pour les classes I à V.</p>
<div class="lab">Place en Europe et en Suisse</div><p>Les recommandations de l'ERS et de l'ESCMID (2011) rapportent que le CURB-65 et ses variantes, en particulier le CRB-65, prédisent le décès aussi bien que le PSI, chez les patients ambulatoires comme hospitalisés ; elles retiennent le CRB-65 comme outil de choix, parce qu'il se calcule sans biologie ni radiographie. La SSI utilise de même le CRB-65, complété par l'évaluation clinique.</p>
<div class="lab">Limites</div><p>Le PSI donne beaucoup de poids à l'âge et sous-estime la gravité chez le sujet jeune ; son calcul demande une grille ou un calculateur. Selon la British Thoracic Society, jusqu'à 40 % des patients hospitalisés étaient classés à faible risque dans une étude.</p>
</template>
<template data-pop="j18-pa-ep" data-title="Embolie pulmonaire">
<div class="lab">Pourquoi y penser</div><p>L'embolie pulmonaire peut imiter une pneumonie : elle donne une dyspnée, une douleur pleurétique, parfois une hémoptysie et de la fièvre, et un infarctus pulmonaire produit une opacité périphérique. Une embolie grave peut conduire au choc en quelques heures, d'où sa place en tête des diagnostics différentiels.</p>
<div class="lab">Indices</div><p>Une dyspnée ou une douleur brutale, des facteurs de risque thromboembolique comme une chirurgie récente, une immobilisation ou un cancer, un mollet gonflé et douloureux, une tachycardie disproportionnée par rapport à la fièvre ou une hypoxémie sans foyer auscultatoire orientent vers l'embolie.</p>
<div class="lab">Conduite</div><p>Le médecin estime la probabilité clinique, puis il demande les examens indiqués, le plus souvent une angiotomodensitométrie. La British Thoracic Society range l'embolie parmi les causes fréquentes d'une évolution décevante sous traitement de pneumonie. Le cours I26, consacré à l'embolie pulmonaire, détaille la démarche.</p>
<div class="lab">Piège</div><p>Une fièvre et une opacité ne suffisent pas à exclure une embolie, puisque l'infarctus pulmonaire en produit aussi.</p>
</template>
<template data-pop="j18-pa-oap" data-title="Œdème pulmonaire cardiogénique">
<div class="lab">Mécanisme</div><p>Lorsque le ventricule gauche défaille, la pression monte dans les capillaires pulmonaires, et du liquide passe dans l'interstitium puis dans les alvéoles. Cet œdème produit des crépitants, une hypoxémie et des opacités, comme une pneumonie.</p>
<div class="lab">Indices distinctifs</div><p>Une orthopnée, des crépitants bilatéraux, une turgescence jugulaire, des œdèmes des membres inférieurs et une cardiopathie connue orientent vers l'œdème cardiogénique. Les opacités sont en général bilatérales et prédominent autour des hiles et aux bases.</p>
<div class="lab">Conduite</div><p>Le médecin demande une échographie cardiaque et pulmonaire et un dosage des peptides natriurétiques, selon la question posée. Le cours I50, consacré à l'insuffisance cardiaque, détaille ces examens.</p>
<div class="lab">Piège</div><p>Les deux maladies coexistent souvent : une pneumonie peut décompenser une insuffisance cardiaque, et une méta-analyse de 2011 a relevé une insuffisance cardiaque chez 14,1 % des patients hospitalisés pour pneumonie.</p>
</template>
<template data-pop="j18-pa-cancer" data-title="Cancer bronchique et pneumonie">
<div class="lab">Pourquoi y penser</div><p>Une tumeur qui obstrue une bronche empêche l'évacuation des sécrétions en aval, ce qui favorise une pneumonie qui guérit mal ou récidive au même endroit. La British Thoracic Society rapporte une étude de 236 adultes soignés en ville pour une pneumonie, parmi lesquels 10 avaient un cancer bronchique, dont 6 des 36 fumeurs de plus de 60 ans (17 %).</p>
<div class="lab">Fréquence après une pneumonie</div><p>Selon la British Thoracic Society, une étude de 1011 patients hospitalisés pour pneumonie n'a trouvé un cancer bronchique sous-jacent que chez 13 d'entre eux (1,3 %) ; huit étaient visibles dès la radiographie d'admission, et les autres ont été découverts parce que la guérison clinique tardait.</p>
<div class="lab">Conduite</div><p>La British Thoracic Society demande une radiographie vers 6 semaines chez le patient dont les symptômes ou les signes persistent et chez celui dont le risque de cancer est plus élevé, notamment le fumeur et le patient de plus de 50 ans. Elle envisage une bronchoscopie lorsque les signes, les symptômes et l'image persistent vers 6 semaines après la fin du traitement.</p>
<div class="lab">Piège</div><p>Une pneumonie qui récidive dans le même lobe ne relève pas du hasard : elle impose de chercher un obstacle bronchique.</p>
</template>
<template data-pop="j18-pa-tb" data-title="Tuberculose">
<div class="lab">Pourquoi y penser</div><p>La tuberculose pulmonaire peut ressembler à une pneumonie bactérienne qui répond mal au traitement. Elle se reconnaît à des symptômes prolongés, à des sueurs nocturnes, à une perte de poids, parfois à une hémoptysie, et à des opacités souvent localisées aux sommets ou excavées.</p>
<div class="lab">Terrain</div><p>La SSI la fait rechercher devant des symptômes persistants. La British Thoracic Society range les mycobactéries parmi les agents inattendus d'un échec thérapeutique.</p>
<div class="lab">Conduite</div><p>En cas de suspicion, par exemple devant des symptômes persistants, la SSI demande de rechercher les mycobactéries par microscopie, culture et amplification génique. Le patient suspect est placé en isolement respiratoire en attendant les résultats.</p>
<div class="lab">Piège</div><p>Une pneumonie qui traîne ou récidive chez un patient à risque doit faire rechercher la tuberculose, parce qu'un retard diagnostique expose l'entourage.</p>
</template>
<template data-pop="j18-pa-mimes" data-title="Pneumopathies non infectieuses">
<div class="lab">Pourquoi y penser</div><p>Plusieurs maladies non infectieuses donnent de la fièvre et une opacité pulmonaire et résistent aux antibiotiques. La British Thoracic Society cite la pneumonie éosinophile, la pneumopathie organisée cryptogénique et l'hémorragie alvéolaire parmi les causes rares d'une évolution décevante.</p>
<div class="lab">Indices</div><p>Une éosinophilie sanguine oriente vers une pneumonie éosinophile. Une hémoptysie avec une anémie oriente vers une hémorragie alvéolaire. Des opacités qui changent de place et un échec de plusieurs antibiotiques orientent vers une pneumopathie organisée.</p>
<div class="lab">Conduite</div><p>Le médecin demande une tomodensitométrie et, souvent, une bronchoscopie avec un lavage bronchoalvéolaire. La SSI prévoit ces examens devant un échec thérapeutique, pour rechercher aussi des agents résistants ou rares.</p>
<div class="lab">Piège</div><p>Ajouter un antibiotique après l'autre retarde le diagnostic. Ces maladies se traitent souvent par corticostéroïdes, une fois l'infection exclue.</p>
</template>
<template data-pop="j18-pa-atsidsa" data-title="Critères de surveillance intensifiée de la SSI">
<div class="lab">Définition</div><p>La fiche SSI de la pneumonie communautaire énumère des critères qui imposent une surveillance accrue, parce qu'ils signalent une dysfonction d'organe associée au sepsis. Elle tient en outre pour sévère une pneumonie dont le CRB-65 dépasse 2 points.</p>
<div class="lab">Soins intensifs</div><p>Une insuffisance respiratoire qui exige une ventilation mécanique ou un choc septique qui exige des vasopresseurs relèvent des soins intensifs. Les recommandations européennes de 2023 définissent d'ailleurs la pneumonie sévère par l'admission en soins intensifs.</p>
<div class="lab">Les neuf critères de la SSI</div><p>Une fréquence respiratoire d'au moins 30 par minute ; une insuffisance respiratoire aiguë sévère, avec une PaO₂ d'au plus 55 mmHg, soit 7 kPa, en air ambiant ; des infiltrats multilobaires à la radiographie ; un trouble nouveau de l'état de conscience ; une hypotension qui exige un remplissage intensif ; une insuffisance rénale aiguë ; une leucopénie inférieure à 4 × 10⁹/L ; une thrombopénie inférieure à 100 × 10⁹/L ; une hypothermie inférieure à 36 °C. En cas de dysfonction d'organe, la SSI fait doser le lactate.</p>
<div class="lab">Origine et lecture européenne</div><p>Cette liste dérive des critères mineurs nord-américains de 2007, qui faisaient admettre en soins intensifs sur un critère majeur ou trois critères mineurs. La SSI remplace le rapport PaO₂ sur fraction inspirée d'oxygène par une PaO₂ en air ambiant et l'urémie par l'insuffisance rénale aiguë, et elle ne fixe pas de nombre minimal de critères. Les recommandations de l'ERS et de l'ESCMID (2011) préfèrent elles aussi les scores fondés sur ces critères mineurs, qui signalent un besoin de soins intensifiés plutôt qu'une admission automatique en soins intensifs.</p>
<div class="lab">Autres indications de soins intensifs</div><p>La British Thoracic Society ajoute une hypoxie qui persiste avec une PaO₂ inférieure à 8 kPa malgré l'oxygène maximal, une hypercapnie progressive, une acidose sévère avec un pH inférieur à 7,26, un choc ou une baisse de la vigilance.</p>
<div class="lab">Chez Madame R.</div><p>Elle remplit trois critères : la fréquence respiratoire, la confusion et l'insuffisance rénale aiguë ; son CRB-65 de 3 dépasse 2 points. Sa pneumonie est donc sévère selon la SSI, sans ventilation mécanique ni choc.</p>
</template>
<template data-pop="j18-pa-epanch" data-title="Épanchement parapneumonique et empyème">
<div class="lab">Fréquence</div><p>Selon la British Thoracic Society, un épanchement parapneumonique se développe chez 36 à 57 % des patients hospitalisés pour une pneumonie bactérienne. Il peut expliquer une fièvre qui persiste malgré un antibiotique adapté. L'empyème touchait 0,7 à 1,3 % des patients hospitalisés dans une étude canadienne.</p>
<div class="lab">Définitions</div><p>L'empyème se définit par un liquide trouble, du pus ou des germes visibles à la coloration de Gram ou en culture. L'épanchement compliqué se définit par un liquide clair dont le pH est inférieur à 7,2. Le pH se mesure sur un prélèvement recueilli à l'abri de l'air dans une seringue héparinée et analysé dans un appareil à gaz du sang.</p>
<div class="lab">Conduite</div><p>La British Thoracic Society recommande une ponction précoce chez tout patient qui a un épanchement parapneumonique, puis un drainage précoce et efficace en cas d'empyème ou de pH inférieur à 7,2. La SSI prévoit la ponction d'un épanchement si elle est possible, puis sa surveillance par échographie.</p>
<div class="lab">Piège</div><p>Changer d'antibiotique devant une fièvre persistante ne guérit pas un empyème, que seul le drainage traite. Un retard de drainage prolonge l'hospitalisation.</p>
</template>
<template data-pop="j18-pa-abces" data-title="Abcès pulmonaire">
<div class="lab">Définition et terrain</div><p>L'abcès est une cavité remplie de pus, creusée dans le parenchyme par une infection nécrosante. La British Thoracic Society le décrit comme une complication rare, surtout chez le patient affaibli ou alcoolique et après une aspiration.</p>
<div class="lab">Agents</div><p>Le médecin envisage des anaérobies, <i>S. aureus</i>, des bacilles à Gram négatif entériques et, en cas de mauvaise hygiène dentaire, <i>Streptococcus milleri</i>. Une cavité qui ne répond pas fait aussi rechercher une tuberculose (SSI : recherche de mycobactéries en cas de symptômes persistants).</p>
<div class="lab">Traitement</div><p>La plupart des patients répondent aux antibiotiques. La British Thoracic Society envisage un traitement prolongé, jusqu'à six semaines selon la réponse, et parfois un drainage chirurgical. Contrairement à la pneumonie d'aspiration simple, l'abcès fait choisir un antibiotique actif sur les agents attendus, anaérobies compris.</p>
<div class="lab">Piège</div><p>Une cavité n'est pas toujours un abcès bactérien : une tuberculose ou un cancer nécrosé en produisent aussi.</p>
</template>
<template data-pop="j18-pa-sdra" data-title="Syndrome de détresse respiratoire aiguë">
<div class="lab">Mécanisme</div><p>Au cours d'une pneumonie grave, l'inflammation peut léser la membrane alvéolocapillaire au-delà du foyer. Un liquide riche en protéines envahit alors les alvéoles des deux poumons ; cet œdème lésionnel n'est pas dû à une insuffisance cardiaque.</p>
<div class="lab">Définition de Berlin</div><p>La définition de Berlin, publiée en 2012, classe le syndrome selon le rapport entre la PaO₂ et la fraction inspirée d'oxygène : léger entre 200 et 300 mmHg, modéré entre 100 et 200 mmHg, sévère à 100 mmHg ou moins. La mortalité atteignait respectivement 27, 32 et 45 % dans les données de validation.</p>
<div class="lab">Conséquence pratique</div><p>Une hypoxémie qui s'aggrave malgré l'oxygène, avec des opacités qui deviennent bilatérales, impose l'appel des soins intensifs. Le cours J96, consacré à l'insuffisance respiratoire aiguë et chronique, détaille l'assistance ventilatoire de ces patients.</p>
</template>
<template data-pop="j18-pa-echec" data-title="Échec thérapeutique">
<div class="lab">Évolution attendue</div><p>Chez le patient hospitalisé, le pouls et la pression artérielle s'améliorent en 2 jours médians, la température, la fréquence respiratoire et la saturation en 3 jours médians. Une absence d'amélioration touche 6 à 24 % des patients selon la British Thoracic Society.</p>
<div class="lab">Définitions de la SSI</div><p>L'échec primaire prend trois formes. La pneumonie progressive s'aggrave, le plus souvent dans les 72 heures, avec une insuffisance respiratoire, d'autres dysfonctions d'organes ou un choc septique malgré un antibiotique initial adéquat. La pneumonie à réponse retardée n'atteint pas la stabilité après 72 heures de traitement, sans progresser. La pneumonie persistante garde un infiltrat incomplètement régressé plus de 30 jours après le début des symptômes. L'échec secondaire est une aggravation après une stabilisation initiale.</p>
<div class="lab">Facteurs de risque</div><p>La British Thoracic Society cite l'atteinte multilobaire, la cavitation, l'épanchement pleural, une hépatopathie, un cancer ou une maladie neurologique, l'aspiration, la légionellose, les bacilles à Gram négatif, la leucopénie, une gravité initiale élevée et un antibiotique inadapté.</p>
<div class="lab">Conduite</div><p>La SSI demande une nouvelle anamnèse et un nouvel examen, la vérification de la dose et de la molécule, un dosage de la protéine C réactive ou de la procalcitonine, la recherche de complications infectieuses et non infectieuses, une imagerie, des hémocultures et une culture d'expectoration ou un lavage bronchoalvéolaire. Elle change d'antibiotique seulement si le spectre était insuffisant, et elle traite une pneumonie progressive comme une forme sévère.</p>
</template>
<template data-pop="j18-pa-o2" data-title="Oxygénothérapie">
<div class="lab">Objectif</div><p>L'oxygène corrige l'hypoxémie liée au shunt et à l'inégalité entre ventilation et perfusion. La British Thoracic Society vise une PaO₂ d'au moins 8 kPa et une saturation de 94 à 98 % chez le patient sans risque d'hypercapnie ; chez ce patient, de fortes concentrations d'oxygène peuvent être données sans danger.</p>
<div class="lab">Patient à risque d'hypercapnie</div><p>Chez le patient atteint d'une bronchopneumopathie chronique obstructive modérée ou sévère, un excès d'oxygène peut réduire la commande ventilatoire et aggraver l'inégalité entre ventilation et perfusion. La British Thoracic Society commence alors par de faibles concentrations, de 24 à 28 %, guidées par la gazométrie, pour maintenir la saturation entre 88 et 92 % sans que le pH baisse au-dessous de 7,35.</p>
<div class="lab">Surveillance</div><p>Le médecin note la fraction d'oxygène inspirée à chaque mesure de saturation. Une PaCO₂ supérieure à 6 kPa avec un pH inférieur à 7,35 fait envisager une assistance ventilatoire, surtout si l'acidose persiste plus de 30 minutes malgré le traitement.</p>
<div class="lab">Piège</div><p>Une saturation normale sous oxygène ne signifie pas que le patient va bien : la fréquence respiratoire, l'état mental et, au besoin, la gazométrie montrent son effort et sa PaCO₂.</p>
</template>
<template data-pop="j18-pa-delai" data-title="Délai d'administration de l'antibiotique">
<div class="lab">Recommandations</div><p>La SSI demande de commencer le traitement rapidement après le diagnostic. La Surviving Sepsis Campaign de 2021 demande d'administrer l'antibiotique immédiatement, idéalement dans l'heure, en cas de choc septique possible ou de forte probabilité de sepsis. En cas de sepsis possible sans choc, elle propose une évaluation rapide et, si l'infection reste probable, un antibiotique dans les 3 heures. La British Thoracic Society fixe aux services l'objectif de confirmer le diagnostic par la radiographie et de donner l'antibiotique dans les 4 heures suivant l'arrivée à l'hôpital.</p>
<div class="lab">Données</div><p>Selon la British Thoracic Society, une étude rétrospective de patients de 65 ans et plus a associé un traitement dans les 8 heures à une réduction de 15 % de la mortalité à 30 jours. Aux États-Unis, l'objectif d'un antibiotique en moins de 4 heures pour toute pneumonie a toutefois réduit de 39 % la précision du diagnostic aux urgences, et la proportion de patients étiquetés « pneumonie » avec une radiographie normale est passée de 20,6 % à 28,3 %.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin traite sans délai le patient grave ou septique, au besoin sur un diagnostic présumé. Chez le patient stable, il prend le temps de confirmer le diagnostic, parce qu'un antibiotique donné à tort expose aux effets indésirables et aux résistances.</p>
</template>
<template data-pop="j18-pa-relais" data-title="Relais oral et désescalade">
<div class="lab">Quand</div><p>La SSI autorise le relais oral lorsque tous les critères de stabilité sont réunis : prise orale possible, état mental normal, systolique d'au moins 90 mmHg, fréquence cardiaque d'au plus 100 par minute, température d'au plus 37,8 °C, fréquence respiratoire d'au plus 24 par minute et saturation d'au moins 90 %, ou PaO₂ d'au moins 60 mmHg, ou saturation habituelle du patient.</p>
<div class="lab">Quelle molécule</div><p>Lorsque l'agent est connu, le médecin choisit le traitement ciblé de la SSI, par exemple l'amoxicilline 1 g toutes les 8 heures par voie orale pour le pneumocoque. Sans agent identifié, il poursuit en général la même famille par voie orale, par exemple l'amoxicilline associée à l'acide clavulanique à 1 g toutes les 8 heures.</p>
<div class="lab">Pourquoi désescalader</div><p>Un spectre plus étroit expose moins aux effets indésirables, dont l'infection à <i>Clostridioides difficile</i>, et sélectionne moins de résistances. Le macrolide s'arrête après 24 à 72 heures lorsque les agents atypiques ne sont pas retenus, sauf dans les cas où la SSI le prolonge.</p>
<div class="lab">Piège</div><p>La radiographie n'est un critère ni de relais ni d'arrêt, parce qu'elle guérit plus lentement que le patient.</p>
</template>
<template data-pop="j18-pa-duree" data-title="Durée du traitement">
<div class="lab">Règle générale</div><p>La SSI retient en principe 5 jours, et au moins 2 jours après l'obtention de la stabilité clinique ; en ville, elle arrête l'antibiotique 2 à 3 jours après la stabilisation. Dans la forme sévère, elle retient 5 à 7 jours, avec au moins 2 jours de stabilité. Elle admet un traitement plus court dans une forme légère ou modérée qui se stabilise rapidement.</p>
<div class="lab">Recommandations européennes</div><p>Dans la forme sévère, les recommandations européennes de 2023 suggèrent la procalcitonine pour raccourcir la durée du traitement (recommandation conditionnelle), en précisant qu'elle apporte peu lorsque la stabilité est atteinte et que la durée prévue est déjà de 5 à 7 jours.</p>
<div class="lab">Exceptions</div><p>La légionellose reçoit 7 à 10 jours, ou 10 à 14 jours chez l'immunodéprimé, selon le Kantonsspital Baden ; l'étude suisse multicentrique de 2025 juge 5 à 7 jours suffisants en s'appuyant sur la fiche SSI. Un abcès peut demander jusqu'à six semaines. Une bactériémie compliquée et un empyème ne suivent pas la règle des cinq jours.</p>
<div class="lab">Piège</div><p>Une toux résiduelle ou une opacité persistante ne prolongent pas l'antibiotique chez un patient stable.</p>
</template>
<template data-pop="j18-pa-cortico" data-title="Corticostéroïdes dans la pneumonie sévère : SSI et recommandations européennes">
<div class="lab">Rationnel</div><p>Dans la forme sévère, la réponse inflammatoire lèse le poumon et les autres organes. Les corticostéroïdes la freinent, au prix d'une hyperglycémie et d'un risque infectieux.</p>
<div class="lab">Essais</div><p>Dans CAPE COD (2023, 800 patients de soins intensifs, choc septique exclu), l'hydrocortisone 200 mg par jour a réduit la mortalité à 28 jours de 11,9 à 6,2 %, ainsi que les intubations et l'introduction de vasopresseurs, avec des besoins d'insuline plus élevés. Dans ESCAPe (2022, 586 patients), la méthylprednisolone n'a pas réduit significativement la mortalité à 60 jours (16 % contre 18 %). Dans REMAP-CAP (2025), l'hydrocortisone 50 mg toutes les 6 heures pendant 7 jours a été arrêtée pour futilité.</p>
<div class="lab">Indications en Suisse</div><p>La SSI tient les corticostéroïdes pour clairement indiqués dans la pneumonie sévère, définie par les soins intensifs ou une instabilité respiratoire ou cardiovasculaire, même sans choc. Elle donne par exemple l'hydrocortisone 200 mg par jour ou la prednisone 50 mg par jour pendant 4 à 8 jours selon l'évolution. Elle les fait éviter en cas de grippe, sauf autre indication.</p>
<div class="lab">Absence d'indication de routine</div><p>Dans la forme non sévère, aucun corticostéroïde systémique n'est indiqué, sauf une obstruction bronchique qui s'aggrave chez l'asthmatique ou chez le patient atteint de bronchopneumopathie chronique obstructive, pour 5 à 7 jours selon la SSI. La fiche SSI des infections respiratoires aiguës ne trouve aucune preuve en faveur des corticostéroïdes oraux dans ces infections chez le patient sans asthme.</p>
<div class="lab">Arbitrage : la source la plus récente</div><p>Les recommandations 2023 de l'ERS, de l'ESICM, de l'ESCMID et de l'Asociación Latinoamericana de Tórax ne suggèrent les corticostéroïdes qu'en présence d'un choc (recommandation conditionnelle, preuve de faible qualité), avec la méthylprednisolone 0,5 mg/kg toutes les 12 heures pendant 5 jours comme option raisonnable ; elles excluent les pneumonies virales, le diabète non contrôlé et la corticothérapie prescrite pour une autre raison. La fiche SSI de la pneumonie communautaire, validée le 09.09.2026, est la source primaire applicable la plus récente : elle les indique même sans choc et mentionne un bénéfice sur la mortalité d'environ 40 % selon les recommandations internationales qu'elle cite. En Suisse et pour l'examen fédéral, la position de la SSI prime ; le texte européen en vigueur reste celui d'Intensive Care Medicine 2023;49:615-632.</p>
<div class="lab">Surveillance</div><p>Le médecin surveille la glycémie, surtout chez le diabétique, et recherche une surinfection.</p>
</template>
<template data-pop="j18-pa-aspirine" data-title="Aspirine après une pneumonie">
<div class="lab">Proposition de la SSI</div><p>La SSI propose d'envisager l'acide acétylsalicylique, par exemple 300 mg par jour pendant un mois, chez le patient hospitalisé qui n'a pas d'indication préexistante mais qui présente des facteurs de risque cardiovasculaire, comme le tabagisme, l'hypertension artérielle ou le diabète.</p>
<div class="lab">Rationnel</div><p>Selon une méta-analyse de 2011, une complication cardiaque survient dans les 30 jours chez 17,7 % des patients hospitalisés, dont un syndrome coronarien aigu chez 5,3 %. L'aspirine vise à réduire ce risque coronarien pendant la période de vulnérabilité.</p>
<div class="lab">Précautions</div><p>La SSI formule une option, non une obligation. Le médecin pèse le risque hémorragique, notamment digestif, les interactions et les contre-indications avant de prescrire.</p>
<div class="lab">Chez Madame R.</div><p>Son diabète et son hypertension en font une candidate ; le médecin en discute avec elle à la sortie.</p>
</template>
<template data-pop="j18-pa-oselta" data-title="Oseltamivir">
<div class="lab">Indication</div><p>Pendant la saison grippale, la SSI ajoute l'oseltamivir 75 mg toutes les 12 heures par voie orale chez le patient hospitalisé pour pneumonie, jusqu'à ce que la grippe soit exclue. Les recommandations européennes de 2023 suggèrent l'oseltamivir dans la pneumonie sévère due à une grippe confirmée par amplification génique et, faute de ce test, de façon empirique pendant la saison grippale (recommandations conditionnelles, preuve de très faible qualité).</p>
<div class="lab">Mécanisme</div><p>L'oseltamivir inhibe la neuraminidase du virus grippal, l'enzyme qui libère les nouveaux virions de la cellule infectée ; il limite ainsi la propagation du virus dans les voies respiratoires.</p>
<div class="lab">Dose et durée</div><p>La SSI prescrit l'oseltamivir pendant 5 jours, comme l'information professionnelle suisse de Tamiflu, à 75 mg deux fois par jour chez l'adulte. Cette information professionnelle réduit la dose à 30 mg deux fois par jour entre 30 et 60 mL/min de clairance de la créatinine, et à 30 mg une fois par jour entre 10 et 30 mL/min. Les deux versions de la fiche SSI de la pneumonie communautaire divergent sur la durée maximale : la version allemande, validée le 26.08.2026, admet jusqu'à 10 jours en cas d'évolution sévère en soins intensifs ou d'immunosuppression sévère, alors que la version française, validée le 09.09.2026 et donc plus récente, ne mentionne pas cette prolongation. Le traitement standard reste de 5 jours.</p>
<div class="lab">Bénéfice</div><p>Chez le patient hospitalisé pour une grippe grave, la SSI juge l'effet sur la mortalité très incertain ; un traitement précoce peut raccourcir le séjour d'environ un jour. Chez le patient de soins intensifs, elle admet de le commencer plus de 48 heures après le début des symptômes.</p>
</template>
<template data-pop="j18-pa-mobil" data-title="Mobilisation précoce et prophylaxie thromboembolique">
<div class="lab">Mobilisation</div><p>Dans un essai randomisé de 458 patients cité par la British Thoracic Society, s'asseoir hors du lit au moins 20 minutes dans les premières 24 heures, puis bouger davantage chaque jour, a raccourci le séjour de 1,1 jour. La British Thoracic Society recommande donc cette mobilisation chez le patient hospitalisé pour une pneumonie non compliquée, et la SSI recommande de mobiliser tôt le patient stable.</p>
<div class="lab">Prophylaxie thromboembolique</div><p>La British Thoracic Society recommande d'envisager une héparine de bas poids moléculaire chez tout patient qui n'est pas complètement mobile, parce que l'infection et l'alitement augmentent le risque de thrombose veineuse.</p>
<div class="lab">Autres mesures</div><p>Elle ne recommande pas de désencombrement bronchique de routine dans la pneumonie non compliquée. Elle recommande un soutien nutritionnel en cas de maladie prolongée.</p>
</template>
<template data-pop="j18-pa-allergie" data-title="Allergie aux pénicillines">
<div class="lab">Pourquoi caractériser</div><p>Une étiquette d'allergie aux pénicillines peut priver le patient de la bêtalactamine recommandée et conduire à un antibiotique plus large ou plus toxique. La SSI distingue l'allergie grave, définie par une anaphylaxie ou par une intolérance aux pénicillines et aux céphalosporines, qui justifie une fluoroquinolone, de l'allergie aux pénicillines sans ces caractères, pour laquelle elle propose la ceftriaxone à l'hôpital.</p>
<div class="lab">Le score PEN-FAST</div><p>Ce score, publié en 2020, attribue 2 points à une réaction survenue il y a 5 ans ou moins, 2 points à une anaphylaxie, à un angio-œdème ou à une réaction cutanée sévère, et 1 point à une réaction qui a exigé un traitement. Au-dessous de 3 points, seuls 3,7 % des patients avaient un test d'allergie positif dans la cohorte de dérivation, soit une valeur prédictive négative de 96,3 %. Le cours T78, consacré à l'anaphylaxie et aux allergies, détaille la démarche allergologique.</p>
<div class="lab">Ceftriaxone et allergie</div><p>L'information professionnelle suisse de Rocephin contre-indique la ceftriaxone en cas d'hypersensibilité à la ceftriaxone ou aux céphalosporines, et elle demande la prudence après une réaction à une autre bêtalactamine. Le résumé européen harmonisé la contre-indique après une hypersensibilité grave, par exemple une anaphylaxie.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin demande quel médicament a été pris, quand, quelle réaction est survenue et comment elle a été traitée. Une simple intolérance digestive ne constitue pas une allergie.</p>
</template>
<template data-pop="j18-pa-stab" data-title="Critères de stabilité clinique">
<div class="lab">Liste</div><p>La SSI retient sept critères : une température d'au plus 37,8 °C, une fréquence cardiaque d'au plus 100 par minute, une fréquence respiratoire d'au plus 24 par minute, une systolique d'au moins 90 mmHg, une saturation d'au moins 90 % ou une PaO₂ d'au moins 60 mmHg en air ambiant, une prise orale possible et un état mental normal. La SSI accepte aussi la saturation habituelle du patient.</p>
<div class="lab">Origine</div><p>La cohorte de Halm et al. (JAMA 1998, 686 adultes) a mesuré le délai de stabilité avec des seuils voisins, dont une température d'au plus 37,2 °C : 3 jours médians selon la définition la plus souple, 7 jours selon la plus stricte.</p>
<div class="lab">Usage</div><p>Ces critères décident du relais oral, de la sortie et de la fin de l'antibiotique : la SSI arrête le traitement au moins 2 jours après la stabilité. Les recommandations de l'ERS et de l'ESCMID (2011) jugent aussi la réponse sur des critères cliniques simples, la température et les paramètres respiratoires et hémodynamiques, et appliquent les mêmes paramètres à la décision de sortie.</p>
<div class="lab">Piège</div><p>Un critère anormal qui correspond à l'état habituel du patient, comme une saturation basse chronique, ne retarde pas le relais.</p>
</template>
<template data-pop="j18-pa-sortie" data-title="Critères de sortie">
<div class="lab">Règle</div><p>La British Thoracic Society demande de réexaminer le patient dans les 24 heures qui précèdent la sortie prévue. Le patient peut sortir s'il ne présente pas plus d'un des éléments suivants, sauf si cet élément correspond à son état habituel : une température supérieure à 37,8 °C, une fréquence cardiaque supérieure à 100 par minute, une fréquence respiratoire supérieure à 24 par minute, une systolique inférieure à 90 mmHg, une saturation inférieure à 90 %, une incapacité à s'alimenter et un état mental anormal.</p>
<div class="lab">Données</div><p>Dans une cohorte de 680 patients, 46 % des patients sortis avec deux facteurs d'instabilité étaient décédés ou réhospitalisés dans les 30 jours, contre 11 % de ceux qui n'en avaient aucun. Dans une cohorte de 373 patients, une sortie avec au moins un facteur d'instabilité s'associait à une mortalité de 14,6 % contre 2,1 %.</p>
<div class="lab">Conséquence pratique</div><p>L'équipe hospitalière organise le suivi avec le patient et le médecin traitant ; la British Thoracic Society lui en attribue la responsabilité.</p>
</template>
<template data-pop="j18-pa-rxctrl" data-title="Radiographie de contrôle">
<div class="lab">Résolution attendue</div><p>Selon une étude citée par la British Thoracic Society, l'opacité avait complètement disparu chez 51 % des patients à 2 semaines, 64 % à 4 semaines et 73 % à 6 semaines. Chez les patients de plus de 70 ans, la résolution atteignait 35 %, 60 % et 84 % à 3, 6 et 12 semaines. Après une pneumonie à pneumocoque bactériémique, seuls 13 % des clichés étaient normaux à 2 semaines et 41 % à 4 semaines.</p>
<div class="lab">Indications</div><p>La British Thoracic Society demande une radiographie vers 6 semaines chez le patient dont les symptômes ou les signes persistent, ou dont le risque de cancer est plus élevé, notamment le fumeur et le patient de plus de 50 ans. Elle ne demande pas de radiographie avant la sortie chez le patient qui a bien récupéré.</p>
<div class="lab">Définition de la SSI</div><p>La SSI parle de pneumonie persistante lorsque l'infiltrat n'a pas complètement régressé plus de 30 jours après le début des symptômes.</p>
<div class="lab">Piège</div><p>Une opacité persistante chez un patient stable ne constitue pas un échec : elle impose seulement un contrôle ultérieur lorsque le terrain le justifie.</p>
</template>
<template data-pop="j18-pa-grippe" data-title="Vaccins contre la grippe et les autres virus respiratoires">
<div class="lab">Grippe</div><p>Le Plan de vaccination suisse 2026 recommande chaque année le vaccin contre la grippe à toutes les personnes de 65 ans et plus, de préférence entre la mi-octobre et le début de la vague grippale. Il préfère le vaccin à haute dose après 75 ans et entre 65 et 74 ans en présence d'un facteur de risque supplémentaire. Il le recommande aussi aux femmes enceintes et à celles qui ont accouché dans les quatre semaines précédentes, aux personnes atteintes d'une maladie chronique du cœur, des poumons, du foie ou des reins ou d'un trouble métabolique comme le diabète, aux personnes immunodéprimées ou aspléniques, aux résidents des établissements de soins, à leur entourage et aux professionnels de la santé.</p>
<div class="lab">COVID-19</div><p>Le Plan recommande la vaccination contre la COVID-19 en automne et en hiver, idéalement d'octobre à décembre, aux personnes à risque accru de complications. Il cite notamment les personnes de 16 ans et plus atteintes de certaines maladies, par exemple celles qui ont au moins deux facteurs de risque cardiovasculaire dont le diabète ou l'hypertension, les personnes de 16 ans et plus atteintes de trisomie 21 et les femmes enceintes au deuxième ou au troisième trimestre.</p>
<div class="lab">Virus respiratoire syncytial</div><p>L'OFSP recommande aussi la vaccination contre le VRS aux personnes à risque de 60 à 74 ans et à toutes les personnes de 75 ans et plus. Comme l'assurance obligatoire des soins ne la rembourse pas, cette recommandation est publiée séparément du Plan de vaccination 2026.</p>
<div class="lab">Conséquence pratique</div><p>Après une pneumonie, le médecin vérifie ces trois vaccinations en plus de celle contre le pneumocoque. La SSI recommande la vaccination contre la grippe après chaque pneumonie grippale.</p>
</template>
<template data-pop="j18-pa-grossesse" data-title="Pneumonie pendant la grossesse">
<div class="lab">Évaluation</div><p>La grossesse augmente la consommation d'oxygène et réduit le volume pulmonaire de fin d'expiration, ce qui diminue la réserve en oxygène. Le médecin évalue donc sans délai la saturation et la gravité, et il associe l'obstétricien à la décision.</p>
<div class="lab">Imagerie</div><p>L'imagerie nécessaire n'est jamais refusée à une femme enceinte gravement malade. Le médecin choisit l'examen après une discussion adaptée, par exemple une échographie pulmonaire lorsqu'elle suffit à répondre à la question.</p>
<div class="lab">Antibiotiques</div><p>Les informations professionnelles suisses admettent l'amoxicilline avec prudence, faute d'études contrôlées, et la co-amoxicilline seulement si elle est clairement nécessaire, en raison d'un excès d'entérocolites nécrosantes néonatales après une prophylaxie lors d'une rupture prématurée des membranes (1,5 % contre 0,5 %). La ceftriaxone exige une indication stricte, surtout au premier trimestre ; la clarithromycine n'est donnée qu'en cas de nécessité évidente et l'azithromycine qu'en cas de nécessité clinique. La lévofloxacine et la moxifloxacine sont contre-indiquées.</p>
<div class="lab">Vaccins et antiviraux</div><p>Le Plan de vaccination 2026 recommande la vaccination contre la grippe pendant la grossesse et celle contre la COVID-19 au deuxième ou au troisième trimestre. La SSI ne recommande pas le baloxavir pendant la grossesse, faute de données de sécurité.</p>
</template>
<template data-pop="j18-pa-age" data-title="Pneumonie du sujet âgé">
<div class="lab">Présentation</div><p>La British Thoracic Society note que les symptômes classiques sont moins fréquents chez le sujet âgé, que la confusion y est plus fréquente et que la fièvre manque plus souvent. Dans une cohorte de 1812 patients, 17 des 18 symptômes étudiés étaient moins souvent rapportés à mesure que l'âge augmentait, même après prise en compte des comorbidités et de la gravité.</p>
<div class="lab">Aspiration</div><p>Une aspiration a été retrouvée chez 71 % des sujets âgés atteints de pneumonie, contre 10 % des témoins, selon la British Thoracic Society. Elle est plus fréquente chez les résidents des établissements de soins, dont la mortalité hospitalière est aussi plus élevée.</p>
<div class="lab">Pièges</div><p>Une chute, une perte d'autonomie ou une anorexie peuvent être les seuls signes. Une confusion ne doit pas être attribuée par défaut à une démence. La guérison radiologique est plus lente, et la fatigue peut persister plusieurs semaines.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin mesure systématiquement les signes vitaux chez tout patient âgé qui décline brusquement, et il fixe avec le patient et ses proches l'objectif du traitement, comme le demande la SSI.</p>
</template>
<template data-pop="j18-pa-ems" data-title="Objectifs du traitement selon l'autonomie">
<div class="lab">Les groupes de la SSI</div><p>La SSI demande de fixer, au début puis en cours d'évolution, si le traitement vise la guérison ou le confort, selon l'autonomie, les comorbidités et le pronostic. Le groupe 1a réunit les patients autonomes, alités moins de la moitié de la journée : le traitement est curatif. Le groupe 1b réunit les patients qui ont acquis la pneumonie en établissement de soins ou qui sont peu autonomes, alités au moins la moitié de la journée : le traitement est curatif, mais l'escalade peut être limitée selon le CRB-65, l'oxygénation et les comorbidités instables. Le groupe 2 réunit les patients atteints d'une comorbidité sévère au pronostic défavorable : le traitement est palliatif.</p>
<div class="lab">Pourquoi</div><p>Une pneumonie peut survenir en fin de vie chez un patient très dépendant. Définir l'objectif évite à la fois l'acharnement et l'abandon d'un traitement utile.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin discute de l'objectif avec le patient, ses proches et ses directives anticipées, et il le note dans le dossier avant toute décision d'escalade, comme un transfert en soins intensifs.</p>
<div class="lab">Piège</div><p>Un traitement palliatif ne signifie pas l'absence de soins : l'oxygène, le traitement de la dyspnée et de la fièvre et, selon la situation, un antibiotique peuvent soulager le patient.</p>
</template>
<template data-pop="j18-pa-rein" data-title="Insuffisance rénale au cours de la pneumonie">
<div class="lab">Pourquoi</div><p>Le sepsis, la déshydratation et certains médicaments altèrent la fonction rénale au cours d'une pneumonie grave. Plusieurs antibiotiques s'éliminent par le rein et s'accumulent lorsque la clairance baisse. L'insuffisance rénale aiguë est d'ailleurs un critère de surveillance intensifiée de la SSI.</p>
<div class="lab">Calcul</div><p>La formule de Cockcroft-Gault estime la clairance de la créatinine : (140 − âge) × poids en kg × 1,23 chez l'homme, ou × 1,04 chez la femme, divisé par la créatinine en µmol/L. Chez Madame R., 71 ans, 68 kg et 128 µmol/L, elle donne environ 38 mL/min.</p>
<div class="lab">Seuils utiles</div><p>Au-dessous de 30 mL/min, le comprimé de co-amoxicilline à 1 g et le flacon à 2,2 g sont exclus, et la clarithromycine se donne à demi-dose. La lévofloxacine garde une première dose de 500 mg, puis diminue dès 50 mL/min. L'oseltamivir diminue dès 60 mL/min. La moxifloxacine n'exige aucune adaptation, et l'azithromycine n'en exige pas entre 10 et 80 mL/min.</p>
<div class="lab">Piège</div><p>La première dose d'un antibiotique reste la dose normale, comme la SSI le précise ; seules les doses suivantes s'adaptent à la fonction rénale. La metformine se suspend en cas d'infection grave ou d'hypoxie.</p>
</template>
<template data-pop="j18-pa-foie" data-title="Insuffisance hépatique au cours de la pneumonie">
<div class="lab">Contre-indications</div><p>Selon les informations professionnelles suisses, la co-amoxicilline est contre-indiquée après un ictère ou une atteinte hépatique survenus lors d'un traitement antérieur par l'association. La moxifloxacine est contre-indiquée en cas d'insuffisance hépatique sévère, de classe C de Child-Pugh, ou de transaminases supérieures à cinq fois la limite supérieure. La clarithromycine est contre-indiquée lorsque l'insuffisance hépatique sévère s'associe à une insuffisance rénale.</p>
<div class="lab">Précautions</div><p>L'azithromycine garde sa dose dans l'insuffisance hépatique légère à modérée, avec prudence, et s'arrête si une hépatite apparaît. Des nécroses hépatiques parfois mortelles ont été rapportées sous lévofloxacine, surtout au cours d'une maladie grave comme une septicémie. La ceftriaxone exige une surveillance clinique lorsque les insuffisances hépatique et rénale sont toutes deux sévères.</p>
<div class="lab">Le piège de l'acide clavulanique</div><p>L'acide clavulanique peut provoquer une hépatite cholestatique, parfois plusieurs semaines après l'arrêt du traitement. Une atteinte hépatique qui apparaît après la guérison doit donc faire penser à ce médicament.</p>
<div class="lab">Conséquence pratique</div><p>Chez le patient cirrhotique, le médecin vérifie l'absence d'antécédent d'ictère sous co-amoxicilline et évite la moxifloxacine en cas d'atteinte sévère.</p>
</template>
