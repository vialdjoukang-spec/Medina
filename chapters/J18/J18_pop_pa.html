<template data-pop="j18-pa-pre-anat" data-title="Prérequis : voies aériennes, lobes et plèvre">
<div class="lab">Ce qu'il faut savoir</div><p>La trachée se divise en deux bronches principales, puis en bronches lobaires et segmentaires, avant d'aboutir aux bronchioles et aux alvéoles. Le poumon droit compte trois lobes, supérieur, moyen et inférieur ; le poumon gauche en compte deux, et son lobe supérieur porte la lingula. La bronche principale droite est plus verticale que la gauche : une aspiration atteint donc souvent le poumon droit, selon la position du patient au moment où elle se produit.</p>
<div class="lab">La plèvre</div><p>La plèvre viscérale recouvre le poumon et ne transmet pas la douleur. La plèvre pariétale tapisse la paroi du thorax ; elle est innervée par les nerfs intercostaux et produit une douleur vive lorsqu'elle s'enflamme. Les deux feuillets glissent l'un sur l'autre grâce à une mince couche de liquide.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin ausculte les bases dans le dos, le lobe moyen et la lingula en avant et sur les côtés. Un foyer de la base droite correspond le plus souvent au lobe inférieur droit, comme chez Madame R. Une douleur qui augmente à l'inspiration signale une atteinte de la plèvre pariétale.</p>
</template>
<template data-pop="j18-pa-pre-gaz" data-title="Prérequis : pression partielle en oxygène et saturation">
<div class="lab">Définitions</div><p>La PaO₂ mesure l'oxygène dissous dans le plasma artériel ; elle se mesure par gazométrie. La saturation indique la proportion de l'hémoglobine qui transporte de l'oxygène : la SaO₂ se mesure dans le sang artériel, la SpO₂ au doigt par oxymétrie de pouls. L'hémoglobine transporte la quasi-totalité de l'oxygène du sang.</p>
<div class="lab">La courbe de dissociation</div><p>La relation entre la PaO₂ et la saturation dessine une courbe en S. Dans sa partie haute, la courbe est presque plate : une baisse modérée de la PaO₂ réduit peu la saturation. Au-dessous d'environ 60 mmHg, la courbe devient raide, et chaque baisse de pression fait chuter fortement la saturation. La SSI met ainsi en équivalence une saturation artérielle inférieure à 90 % et une PaO₂ inférieure à 60 mmHg, soit 8 kPa.</p>
<div class="lab">Conséquence pratique</div><p>Une saturation de 89 % signifie que le patient se trouve déjà sur la partie raide de la courbe : une aggravation minime de la maladie peut réduire fortement l'oxygène transporté. C'est pourquoi la SSI fait envisager l'hospitalisation, quel que soit le score de gravité, lorsque la saturation artérielle est inférieure à 90 %.</p>
<div class="lab">Piège</div><p>La saturation ne dit rien de la PaCO₂. Un patient épuisé peut garder une saturation acceptable sous oxygène alors que sa PaCO₂ monte ; seule la gazométrie le montre.</p>
</template>
<template data-pop="j18-pa-sepsis" data-title="Sepsis, qSOFA et choc septique">
<div class="lab">Définition</div><p>Selon le consensus Sepsis-3 de 2016, le sepsis est une dysfonction d'organe menaçant la vie, causée par une réponse dérégulée de l'hôte à une infection. Cliniquement, une hausse d'au moins 2 points du score SOFA l'objective ; elle s'accompagne d'une mortalité hospitalière supérieure à 10 %. Le choc septique est un sous-groupe du sepsis dont les anomalies circulatoires, cellulaires et métaboliques augmentent nettement la mortalité.</p>
<div class="lab">Reconnaître le choc septique</div><p>Le patient a besoin de vasopresseurs pour maintenir une PAM d'au moins 65 mmHg, et son lactate dépasse 2 mmol/L en l'absence d'hypovolémie. Cette association s'accompagne d'une mortalité hospitalière supérieure à 40 %.</p>
<div class="lab">Le qSOFA</div><p>Hors des soins intensifs, le qSOFA repère le patient infecté à risque d'évolution défavorable lorsqu'il réunit au moins deux critères : une fréquence respiratoire d'au moins 22 par minute, une altération de l'état mental et une pression systolique d'au plus 100 mmHg. La Surviving Sepsis Campaign de 2021 déconseille de l'utiliser comme seul outil de dépistage, parce qu'il est plus spécifique mais moins sensible que la présence de deux critères de SIRS.</p>
<div class="lab">Conséquence pratique</div><p>Devant une pneumonie avec une confusion, une hypotension, une hypoxémie ou une hausse de la créatinine, le médecin pense au sepsis. En cas de choc septique possible ou de forte probabilité de sepsis, la Surviving Sepsis Campaign demande l'antibiotique immédiatement, idéalement dans l'heure. Le cours A41, consacré au sepsis, détaille la réanimation.</p>
</template>
<template data-pop="j18-pa-typ" data-title="Agents dits atypiques">
<div class="lab">Définition</div><p>Les agents dits atypiques sont surtout <i>Mycoplasma pneumoniae</i>, <i>Chlamydia pneumoniae</i>, <i>Legionella</i> et <i>Coxiella burnetii</i>. Le mot ne décrit pas une présentation clinique. La British Thoracic Society a montré que la clinique ne prédit pas l'agent, et elle recommande d'abandonner l'expression « pneumonie atypique ».</p>
<div class="lab">Pourquoi les bêtalactamines échouent</div><p>Les bêtalactamines bloquent la synthèse de la paroi bactérienne. <i>Mycoplasma</i> n'a pas de paroi, et <i>Legionella</i>, <i>Chlamydia</i> et <i>Coxiella</i> se multiplient à l'intérieur des cellules, où ces antibiotiques n'agissent pas. Les macrolides, les tétracyclines et les fluoroquinolones atteignent en revanche ces agents.</p>
<div class="lab">Conséquence pratique</div><p>Une amoxicilline seule ne couvre pas ces agents. C'est pourquoi la SSI associe un macrolide à la bêtalactamine dans la forme sévère et le propose dans la forme modérée pendant 24 à 72 heures, tant que les agents atypiques ne sont pas écartés.</p>
<div class="lab">Piège</div><p>Un tableau « typique » n'exclut pas un agent atypique. Selon la British Thoracic Society, la douleur pleurétique est seulement moins fréquente avec ces agents.</p>
</template>
<template data-pop="j18-pa-inhal" data-title="Pneumopathie d'inhalation">
<div class="lab">Deux maladies différentes</div><p>L'inhalation de contenu gastrique acide peut provoquer rapidement une pneumonite chimique : l'acide lèse les alvéoles sans qu'une bactérie soit en cause. L'aspiration de sécrétions oropharyngées colonisées peut au contraire provoquer une pneumonie bactérienne. La British Thoracic Society note qu'en pratique ce lien de cause est rarement vérifié, et que le terme désigne souvent une pneumonie survenue chez un patient qui a des facteurs de risque d'aspiration.</p>
<div class="lab">Fréquence</div><p>Avec une définition large, jusqu'à 10 % des patients hospitalisés pour pneumonie communautaire sont classés comme atteints d'une pneumonie d'aspiration ; la British Thoracic Society tient ce chiffre pour une surestimation.</p>
<div class="lab">Traitement</div><p>La SSI propose l'amoxicilline associée à l'acide clavulanique, 2,2 g toutes les 8 heures par voie intraveineuse, ou la ceftriaxone 2 g par jour, avec ou sans clindamycine ou métronidazole. Dans la forme sévère, les recommandations européennes de 2023 conseillent le schéma standard plutôt qu'un traitement dirigé contre les anaérobies chez le patient qui a des facteurs de risque d'aspiration (déclaration de bonne pratique), sauf abcès pulmonaire ou empyème.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin cherche la cause de l'aspiration, comme une dysphagie après un accident vasculaire cérébral, un trouble de la conscience ou une sédation, car la corriger prévient la récidive. La SSI fixe la durée de l'antibiotique comme pour les autres pneumonies lorsque cette cause peut être levée.</p>
</template>
<template data-pop="j18-pa-epi" data-title="Données suisses sur les pneumonies hospitalisées">
<div class="lab">La source</div><p>L'analyse d'Albrich et al., publiée en 2019, a utilisé la statistique médicale des hôpitaux de l'Office fédéral de la statistique. Elle a inclus toutes les hospitalisations d'adultes de 16 ans et plus en Suisse de 2002 à 2015, soit 17 619 016 séjours. Elle a retenu les diagnostics de pneumonie codés J13, J15 et J18, en diagnostic principal ou secondaire.</p>
<div class="lab">Les résultats</div><p>Un diagnostic de pneumonie figurait dans 2,4 % des séjours, et un diagnostic de pneumonie à pneumocoque dans 0,12 %. L'incidence des hospitalisations avec pneumonie est passée de 376 à 457, puis à 536 pour 100 000 habitants et par an entre 2002–2006, 2007–2010 et 2011–2015 ; celle de la pneumonie à pneumocoque est passée de 18 à 26, puis à 27. L'âge d'au moins 65 ans multipliait par 2,98 la probabilité d'une hospitalisation avec pneumonie, et par 2,38 celle d'un décès hospitalier. L'insuffisance cardiaque, les maladies pulmonaires chroniques et l'immunodéficience conféraient les risques les plus élevés.</p>
<div class="lab">Les limites</div><p>Ces données ne concernent que les patients hospitalisés et dépendent de la qualité du codage. Les auteurs soulignent qu'aucune donnée contemporaine ne mesure l'incidence de la pneumonie à pneumocoque en Suisse.</p>
<div class="lab">Conséquence pratique</div><p>Les auteurs ont montré que les indications suisses de la vaccination pneumococcique étaient des facteurs de risque indépendants d'hospitalisation, et ils proposaient d'y ajouter l'âge. Depuis 2024, le Plan de vaccination recommande ce vaccin à toutes les personnes de 65 ans et plus.</p>
</template>
<template data-pop="j18-pa-mort" data-title="Mortalité et pronostic">
<div class="lab">Selon le lieu de soins</div><p>Les recommandations britanniques de 2009 donnent une mortalité inférieure à 1 % chez les patients soignés en ville, de 5,7 à 14 % chez les patients hospitalisés et de plus de 30 % chez ceux qui entrent en soins intensifs, dans les séries britanniques.</p>
<div class="lab">Selon les scores</div><p>Pour le CURB-65, la mortalité à 30 jours était de 0,7 % à 0 point, 2,1 % à 1 point, 9,2 % à 2 points, 14,5 % à 3 points, 40 % à 4 points et 57 % à 5 points. Pour le CRB-65, elle était de 1,2 % à 0 point, 5,3 % à 1 point, 12,2 % à 2 points et atteignait 33 % à 3 ou 4 points. Dans l'étude originale du PSI, elle était de 0,1 %, 0,6 %, 0,9 %, 9,3 % et 27 % pour les classes I à V.</p>
<div class="lab">À long terme</div><p>Une étude américaine citée par la British Thoracic Society a mesuré une mortalité de toutes causes de 8,7 % à 90 jours et de 39,1 % après 5,9 ans. L'âge, le niveau de formation, le sexe masculin et la vie en établissement de soins s'y associaient. D'autres séries rapportent 20,8 % à un an et 35,8 % à cinq ans.</p>
<div class="lab">Conséquence pratique</div><p>Ces chiffres justifient l'hospitalisation des patients dont le score est élevé et la prévention après l'épisode. Ils décrivent des groupes de patients et ne remplacent pas le jugement clinique devant un patient donné.</p>
</template>
<template data-pop="j18-pa-coeur" data-title="Complications cardiaques de la pneumonie">
<div class="lab">Fréquence</div><p>Une méta-analyse de 2011 a réuni des cohortes de patients hospitalisés pour pneumonie communautaire. Dans les 30 jours suivant le diagnostic, une complication cardiaque est survenue chez 17,7 % d'entre eux. L'insuffisance cardiaque touchait 14,1 % des patients, un syndrome coronarien aigu 5,3 % et une arythmie nouvelle 4,7 %. Ces fréquences étaient plus basses chez les patients peu graves et plus élevées chez les patients graves.</p>
<div class="lab">Mécanisme</div><p>La fièvre, la tachycardie et le sepsis augmentent les besoins du myocarde en oxygène, alors que l'hypoxémie et l'hypotension réduisent l'apport. L'inflammation systémique peut aussi déclencher un événement coronarien. Les auteurs soulignent que ces mécanismes restent à préciser par la recherche.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin recherche une douleur thoracique, une dyspnée disproportionnée, des œdèmes ou une arythmie pendant et après l'épisode, et il demande un ECG au moindre doute. La SSI propose d'envisager l'aspirine chez le patient hospitalisé qui a des facteurs de risque cardiovasculaire. Les auteurs de la méta-analyse soulignent enfin l'intérêt de la vaccination contre le pneumocoque et la grippe chez les personnes à risque.</p>
</template>
<template data-pop="j18-pa-mucocil" data-title="Clairance mucociliaire et toux">
<div class="lab">Fonctionnement normal</div><p>L'épithélium des voies aériennes porte des cils qui battent de façon coordonnée sous une couche de mucus. Le mucus piège les particules et les microbes inhalés, et les cils le font remonter vers le pharynx, où il est avalé ou expectoré. La toux complète ce dispositif en expulsant brutalement les sécrétions des grosses bronches.</p>
<div class="lab">Ce qui l'altère</div><p>Le tabac altère le fonctionnement des cils. Une infection virale récente lèse l'épithélium cilié. La sédation, l'alcool, les maladies neurologiques et la faiblesse musculaire réduisent l'efficacité de la toux.</p>
<div class="lab">Conséquence pratique</div><p>Chaque altération augmente la quantité de microbes qui atteint les alvéoles. C'est pourquoi l'arrêt du tabac, la correction des troubles de la déglutition et la prudence avec les sédatifs font partie de la prévention de la pneumonie.</p>
</template>

<div class="lab">L'agent</div><p><i>Streptococcus pneumoniae</i> est une bactérie à Gram positif, groupée en diplocoques et entourée d'une capsule polysaccharidique. La capsule la protège de la phagocytose. Ses nombreux types capsulaires expliquent que chaque vaccin n'en couvre qu'un nombre limité, indiqué par sa valence. La bactérie colonise l'oropharynx et atteint le poumon par microaspiration.</p>
<div class="lab">Fréquence</div><p>C'est l'agent identifié le plus souvent dans les séries européennes : 36 % des pneumonies soignées en ville et 39 % des pneumonies hospitalisées dans les études britanniques réunies en 2009. En Suisse, les hospitalisations avec une pneumonie à pneumocoque (J13) sont passées de 18 à 27 pour 100 000 habitants et par an entre 2002 et 2015.</p>
<div class="lab">Présentation</div><p>La British Thoracic Society l'associe à l'âge, aux comorbidités, à un début brutal, à une fièvre élevée et à une douleur pleurétique. Aucun de ces indices ne suffit à l'identifier.</p>
<div class="lab">Diagnostic et traitement</div><p>L'antigène urinaire et les hémocultures l'identifient ; la sensibilité des hémocultures ne dépasse pas 25 %. La SSI le traite de façon ciblée par l'amoxicilline 1 g toutes les 8 heures par voie orale ou par la pénicilline G 5 millions d'unités toutes les 6 heures par voie intraveineuse. Une bactériémie peut essaimer aux méninges, au cœur ou aux articulations.</p>
<div class="lab">Prévention</div><p>Le Plan de vaccination suisse 2026 recommande une dose unique de vaccin conjugué 20-valent ou 21-valent à partir de 65 ans et chez l'adulte à risque de 18 à 64 ans.</p>
</template>
<template data-pop="j18-pa-hflu" data-title="Haemophilus influenzae et Moraxella catarrhalis">
<div class="lab">Les agents</div><p><i>Haemophilus influenzae</i> est un petit bacille à Gram négatif, et <i>Moraxella catarrhalis</i> un diplocoque à Gram négatif. Tous deux colonisent les voies aériennes, surtout lorsqu'une maladie bronchique chronique altère l'épuration.</p>
<div class="lab">Terrain</div><p>La British Thoracic Society les juge peut-être plus fréquents chez le patient atteint de bronchopneumopathie chronique obstructive. Dans les études britanniques réunies en 2009, <i>H. influenzae</i> représentait 10,2 % des agents identifiés en ville et 5,2 % à l'hôpital.</p>
<div class="lab">Conséquence thérapeutique</div><p>Certaines souches produisent une bêtalactamase qui détruit l'amoxicilline. C'est une des raisons pour lesquelles la SSI donne l'amoxicilline associée à l'acide clavulanique au patient comorbide, notamment en cas de bronchopneumopathie chronique obstructive sévère. Lorsque l'antibiogramme montre que la souche est sensible, l'amoxicilline seule suffit.</p>

<div class="lab">L'agent</div><p><i>Legionella pneumophila</i> est un bacille à Gram négatif qui vit dans l'eau douce et se multiplie dans les réseaux d'eau chaude. L'homme se contamine en inhalant de l'eau pulvérisée, par exemple dans une douche, un bain à remous ou une tour de refroidissement. Dans le poumon, la bactérie se multiplie à l'intérieur des macrophages alvéolaires.</p>
<div class="lab">Épidémiologie suisse</div><p>La légionellose est à déclaration obligatoire en Suisse. Le taux de déclaration est passé de 1,1 à 5,6 cas pour 100 000 habitants entre 2000 et 2020, avec un maximum de 6,7 en 2018 et des pics estivaux. Au total, 89,9 % des cas déclarés ont été hospitalisés, et la létalité a diminué de 7,7 % à 3,6 %. Dans les séries britanniques, <i>Legionella</i> représentait 17,8 % des agents identifiés en soins intensifs.</p>
<div class="lab">Indices cliniques</div><p>Le score bâlois de Fiumefreddo et al. (2009) réunit six indices : une température supérieure à 39,4 °C, l'absence d'expectoration, une natrémie inférieure à 133 mmol/L, une LDH supérieure à 225 U/L, une protéine C réactive supérieure à 187 mg/L et des plaquettes inférieures à 171 × 10⁹/L. Avec 0 ou 1 point, 3 % des patients avaient une légionellose ; avec au moins 4 points, 66 % en avaient une. Une diarrhée, une confusion et une élévation des enzymes hépatiques ou de la créatine kinase orientent aussi vers la légionellose.</p>
<div class="lab">Diagnostic</div><p>L'antigène urinaire ne détecte que <i>L. pneumophila</i> et reconnaît surtout le sérogroupe 1. L'amplification génique sur un prélèvement respiratoire peut détecter toutes les espèces. Un antigène urinaire négatif n'exclut donc pas la maladie.</p>
<div class="lab">Traitement</div><p>La SSI traite la légionellose par la lévofloxacine 500 mg toutes les 12 heures ou la moxifloxacine 400 mg par jour, l'azithromycine 500 mg par jour étant l'alternative. La durée varie selon les recommandations : 7 à 10 jours, ou 10 à 14 jours chez l'immunodéprimé, selon le Kantonsspital Baden ; 5 à 7 jours selon l'étude suisse multicentrique de 2025, qui s'appuie sur la fiche SSI.</p>
<div class="lab">Piège</div><p>Une légionellose traitée par une bêtalactamine seule ne s'améliore pas, parce que l'antibiotique n'atteint pas la bactérie dans les macrophages. Un patient qui ne répond pas à une bêtalactamine justifie donc la recherche de l'antigène urinaire, même en ville.</p>
