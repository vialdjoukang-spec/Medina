<template data-pop="j18-cap" data-title="Pneumonie communautaire">
<div class="lab">Définition</div><p>La pneumonie communautaire est une infection aiguë du parenchyme pulmonaire acquise hors de l'hôpital ou présente dès l'admission. Selon la SSI, elle comprend aussi les pneumonies qui commencent au plus tard 48 heures après l'admission et celles des résidents des établissements de soins ; elle exclut les patients atteints d'une immunosuppression sévère.</p>
<div class="lab">Diagnostic</div><p>En pratique hospitalière, une opacité nouvelle à l'imagerie et un tableau clinique compatible étayent le diagnostic. En ville, un diagnostic clinique est admis faute d'image.</p>
<div class="lab">Pourquoi la catégorie compte</div><p>Les germes de la communauté diffèrent de ceux de l'hôpital et résistent moins souvent aux antibiotiques usuels, ce qui permet un traitement empirique étroit, comme l'amoxicilline en ville. Une hospitalisation dans les six mois précédents impose toutefois d'évaluer individuellement le risque de germe nosocomial ou multirésistant, comme le demande la SSI.</p>
<div class="lab">Piège</div><p>Les seuils temporels administratifs ne remplacent pas l'analyse de l'incubation et des expositions. Une pneumonie qui débute peu après la limite de 48 heures peut avoir été acquise avant l'admission lorsque l'exposition est antérieure.</p>
</template>
<template data-pop="j18-hap" data-title="Pneumonie nosocomiale">
<div class="lab">Définition</div><p>La pneumonie nosocomiale est une nouvelle infection du parenchyme pulmonaire qui survient au moins 48 heures après l'admission, alors qu'elle était absente et n'était pas en incubation à l'arrivée. La pneumonie liée à une ventilation invasive en forme une sous-catégorie distincte.</p>
<div class="lab">Pourquoi elle diffère</div><p>Le patient hospitalisé est exposé à une flore différente de celle de la communauté, qui résiste plus souvent aux antibiotiques. Les traitements de la pneumonie communautaire peuvent donc échouer.</p>
<div class="lab">Conduite</div><p>Le médecin prélève si possible un échantillon respiratoire et applique l'écologie et le protocole de son hôpital. Ce cours ne traite pas la pneumonie nosocomiale ; il la signale pour orienter le triage.</p>
</template>
<template data-pop="j18-macro" data-title="Macrophage alvéolaire">
<div class="lab">Définition</div><p>Le macrophage alvéolaire est une cellule immunitaire qui réside à la surface des alvéoles. Il phagocyte les microbes et les particules qui ont échappé à la clairance mucociliaire.</p>
<div class="lab">Rôle dans la pneumonie</div><p>Lorsque l'inoculum dépasse ses capacités, le macrophage reconnaît les motifs microbiens par ses récepteurs de type Toll et libère des cytokines, dont le TNF-α, l'IL-1 et l'interleukine 8. Ces médiateurs recrutent les polynucléaires neutrophiles et rendent les capillaires perméables. Sa réponse aide à contenir l'agent, mais l'exsudat qu'elle entraîne réduit la ventilation alvéolaire.</p>
<div class="lab">Conséquence pratique</div><p><i>Legionella</i> se multiplie à l'intérieur même des macrophages. C'est pourquoi elle exige un antibiotique qui pénètre dans les cellules, comme un macrolide ou une fluoroquinolone.</p>
</template>
<template data-pop="j18-exsudat" data-title="Exsudat alvéolaire et consolidation">
<div class="lab">Définition</div><p>L'exsudat est un liquide inflammatoire riche en protéines, en fibrine et en cellules, surtout des polynucléaires neutrophiles, qui remplit les alvéoles. On parle de consolidation lorsque cet exsudat remplace l'air d'un territoire pulmonaire.</p>
<div class="lab">Évolution</div><p>La pathologie classique décrit une congestion initiale, puis une hépatisation rouge, riche en globules rouges, puis une hépatisation grise, riche en fibrine et en neutrophiles, avant la résolution. Le poumon consolidé prend alors la consistance du foie, d'où le mot hépatisation.</p>
<div class="lab">Rapport avec les signes</div><p>Le territoire consolidé est moins ventilé et plus dense à l'imagerie. Le son s'y transmet mieux, ce qui renforce les vibrations vocales et produit un souffle tubaire si les bronches restent ouvertes. La réouverture de petites voies aériennes produit des crépitants.</p>
<div class="lab">Piège</div><p>Une matité peut aussi venir d'un épanchement pleural ; les vibrations vocales, diminuées dans l'épanchement et augmentées dans la consolidation, font la différence.</p>
</template>
<template data-pop="j18-shunt" data-title="Effet shunt intrapulmonaire">
<div class="lab">Définition</div><p>Une unité pulmonaire perfusée mais non ventilée, ou très peu ventilée, laisse passer un sang qui ne s'oxygène pas. Ce sang se mélange au sang oxygéné des autres régions et abaisse la saturation artérielle : c'est l'effet shunt.</p>
<div class="lab">Exemple chiffré</div><p>Si 30 % du débit sanguin traverse des alvéoles consolidées et que le sang veineux est saturé à 70 %, le sang artériel mélangé n'atteint qu'environ 90 %, alors que les régions saines saturent le sang à 98 %. Ce calcul simplifié néglige l'oxygène dissous.</p>
<div class="lab">Réponse à l'oxygène</div><p>L'oxygène corrige mal un shunt vrai, parce qu'il n'atteint pas le sang qui traverse les alvéoles pleines. Il améliore en revanche les régions mal ventilées mais non exclues, ce qui explique la réponse partielle observée dans la pneumonie.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin apporte de l'oxygène, traite l'infection et soutient la respiration selon la gravité. Une absence de réponse suffisante à l'oxygène signale un shunt étendu et appelle une évaluation urgente.</p>
</template>
<template data-pop="j18-a-poumon" data-title="Antécédents pulmonaires">
<div class="lab">Ce que le médecin demande</div><p>Le médecin demande si le patient a une bronchopneumopathie chronique obstructive, un asthme, des bronchectasies ou une chirurgie pulmonaire. Il demande aussi s'il reçoit de l'oxygène à domicile, s'il a été hospitalisé récemment et quel germe a déjà été isolé dans ses expectorations.</p>
<div class="lab">Pourquoi</div><p>Ces antécédents mesurent la réserve respiratoire, donc le besoin d'admission. Ils modifient aussi les germes probables : la SSI traite par l'amoxicilline associée à l'acide clavulanique le patient atteint de bronchopneumopathie chronique obstructive sévère ou de bronchectasies, et les recommandations européennes de 2011 rapportent la fréquence élevée de <i>P. aeruginosa</i> dans les bronchectasies, surtout lorsque la fonction pulmonaire est altérée. Une colonisation antérieure par un germe résistant figure parmi les facteurs de risque que les recommandations européennes de 2023 demandent d'intégrer au choix du spectre.</p>
<div class="lab">Piège</div><p>Une colonisation ancienne ne prouve pas l'agent de l'épisode présent. Chez le patient qui risque l'hypercapnie, la cible de saturation sous oxygène descend à 88–92 %.</p>
</template>
<template data-pop="j18-a-immune" data-title="Défenses immunitaires">
<div class="lab">Ce que le médecin demande</div><p>Le médecin recherche une asplénie, une greffe, une chimiothérapie, une infection par le VIH, une maladie hématologique, ainsi que la dose et la durée d'une corticothérapie.</p>
<div class="lab">La limite de la SSI</div><p>La SSI exclut de la pneumonie communautaire les patients atteints d'une immunosuppression sévère : neutropénie, corticothérapie d'au moins 20 mg d'équivalent prednisone par jour pendant au moins 4 semaines, transplantation d'organe solide ou de cellules souches hématopoïétiques, déficit immunitaire primaire ou congénital, hypogammaglobulinémie, infection par le VIH avec moins de 200 lymphocytes CD4 par microlitre, maladie hématologique active avec immunosuppression sévère.</p>
<div class="lab">Pourquoi</div><p>Chez ces patients, les agents en cause et leurs traitements diffèrent, et la SSI renvoie aux protocoles spécialisés. Leur seuil d'hospitalisation est plus bas, et ils relèvent d'indications vaccinales particulières. La SSI propose aussi un test de dépistage du VIH après deux pneumonies ou plus en douze mois, ou en l'absence d'un autre facteur de risque.</p>
<div class="lab">Piège</div><p>Une asplénie augmente le risque d'infection invasive à pneumocoque.</p>
</template>
<template data-pop="j18-a-vaccin" data-title="Vaccinations respiratoires">
<div class="lab">Ce que le médecin documente</div><p>Le médecin note le produit, la date et l'indication des vaccinations contre la grippe et le pneumocoque, ainsi que les autres vaccins recommandés selon l'âge et le risque. Une vaccination réduit le risque sans exclure la pneumonie.</p>
<div class="lab">Pneumocoque dès 65 ans</div><p>Le Plan de vaccination suisse 2026 de l'OFSP et de la Commission fédérale pour les vaccinations, publié le 23.02.2026 (version corrigée du 16.04.2026), et la prise de position de cette commission sur les valences, mise à jour le 23.02.2026, fixent les règles suivantes. Dès 65 ans, la personne non vaccinée, ou vaccinée par le vaccin 13-valent depuis au moins un an, reçoit une dose unique de vaccin conjugué 20-valent ou 21-valent. La personne vaccinée par un vaccin 15-valent depuis au moins un an reçoit une dose unique de vaccin 21-valent.</p>
<div class="lab">Pneumocoque chez la personne à risque</div><p>À partir de 2 ans, la personne à risque reçoit une dose unique de vaccin conjugué, sauf les schémas à plusieurs doses après une transplantation ou lors d'une infection par le VIH avec des lymphocytes CD4 inférieurs à 15 %. Chez l'adulte à risque de 18 à 64 ans, le vaccin est 20-valent ou 21-valent.</p>
<div class="lab">Grippe et autres vaccins</div><p>Le Plan recommande aussi la vaccination annuelle contre la grippe dès 65 ans et chez les personnes à risque, ainsi que la vaccination contre la COVID-19 chez les personnes à risque de complications. La SSI recommande de vacciner le patient à la sortie ou au contrôle ambulatoire.</p>
</template>
<template data-pop="j18-a-asp" data-title="Aspiration">
<div class="lab">Ce que le médecin demande</div><p>Le médecin recherche une dysphagie, un vomissement, une perte de conscience, une sédation ou une consommation d'alcool. Il précise le moment de l'épisode et la position du patient, qui déterminent la région pulmonaire atteinte.</p>
<div class="lab">Pourquoi la chronologie compte</div><p>Une pneumonite chimique peut survenir rapidement après l'inhalation de contenu gastrique, sans bactérie. Une infection bactérienne peut apparaître ensuite. Chez le sujet âgé atteint de pneumonie, une aspiration a été retrouvée dans 71 % des cas, contre 10 % chez des témoins, selon la British Thoracic Society.</p>
<div class="lab">Piège</div><p>Une aspiration n'impose pas une antibiothérapie anti-anaérobie prolongée. Dans la forme sévère, les recommandations européennes de 2023 conseillent le schéma standard plutôt qu'un traitement dirigé contre les anaérobies (déclaration de bonne pratique) ; un abcès pulmonaire ou un empyème changent la discussion.</p>
</template>
<template data-pop="j18-a-expo" data-title="Expositions infectieuses">
<div class="lab">Ce que le médecin demande</div><p>Le médecin demande s'il y a eu un contact avec des personnes malades, un voyage, un séjour à l'hôtel, des bains ou des douches alimentés par un réseau d'eau chaude, et des contacts professionnels ou avec des animaux. Il tient compte de la saison.</p>
<div class="lab">Ce que chaque exposition évoque</div><p>La SSI cite l'exposition dans un hôtel ou un spa parmi les prédicteurs de légionellose. Selon la British Thoracic Society, <i>Chlamydophila psittaci</i> s'acquiert auprès d'oiseaux et d'animaux, avec des épidémies chez les travailleurs de la volaille, mais seuls 20 % des cas britanniques rapportent un contact avec des oiseaux ; <i>Coxiella burnetii</i> provient surtout des moutons, avec un pic d'avril à juin, à la saison des agnelages, alors qu'une exposition professionnelle n'est retrouvée que dans 7,7 % des cas. Pendant la saison grippale, la SSI ajoute l'oseltamivir tant que la grippe n'est pas exclue et fait craindre une surinfection à <i>S. aureus</i>. La fiche SSI des infections respiratoires aiguës admet une recherche de <i>Bordetella pertussis</i> dans certaines situations épidémiques.</p>
<div class="lab">Limite</div><p>Ces indices orientent des tests ciblés, comme l'antigène urinaire de <i>Legionella</i>. Ils ne remplacent pas le bilan microbiologique chez le patient hospitalisé ou grave.</p>
</template>
<template data-pop="j18-a-drug" data-title="Médicaments, allergies et rein">
<div class="lab">Ce que le médecin précise</div><p>Le médecin précise l'antibiotique reçu récemment, sa date et son efficacité, la nature d'une éventuelle allergie, réaction immédiate ou simple effet digestif, les médicaments habituels et la fonction rénale.</p>
<div class="lab">Pourquoi</div><p>Un antibiotique reçu dans les 90 jours précédents est un facteur de risque de germe résistant selon la SSI dans la pneumonie sévère ; reprendre le même antibiotique expose aussi à un échec prévisible. La fonction rénale fixe la dose. Les médicaments habituels exposent à des interactions, comme celle de la clarithromycine avec l'amlodipine, ou à des contre-indications, comme la metformine pendant un sepsis.</p>
<div class="lab">Conséquence pratique</div><p>Une allergie bien caractérisée évite un accident, et une fausse allergie démasquée préserve les bêtalactamines, qui restent le traitement de référence lorsqu'aucune allergie grave n'existe.</p>
</template>
<template data-pop="j18-s-fievre" data-title="Fièvre et hypothermie">
<div class="lab">Caractérisation</div><p>Le médecin note la température maximale mesurée, la chronologie de la fièvre, les frissons et la prise d'antipyrétiques, qui peut la masquer. Un grand frisson inaugural est classique dans la pneumonie à pneumocoque.</p>
<div class="lab">Mécanisme</div><p>Les cytokines libérées par l'infection, comme l'IL-1 et l'IL-6, élèvent le point de consigne thermique de l'hypothalamus.</p>
<div class="lab">Valeur</div><p>La fièvre soutient l'hypothèse infectieuse sans la prouver. Une fièvre mesurée d'au moins 38,5 °C pendant plus de trois jours compte parmi les signes de probabilité de la SSI. Dans une série suisse de patients hospitalisés, seuls 64 % avaient une fièvre supérieure à 38 °C.</p>
<div class="lab">Piège</div><p>Une hypothermie, l'absence de fièvre ou une confusion peuvent accompagner une infection grave chez le sujet âgé ou immunodéprimé. Une température inférieure à 36 °C figure parmi les critères de surveillance intensifiée de la SSI.</p>
</template>
<template data-pop="j18-s-toux" data-title="Toux et expectorations">
<div class="lab">Caractérisation</div><p>Le médecin précise le début de la toux, son caractère nouveau, la quantité et l'aspect des expectorations et la présence de sang.</p>
<div class="lab">Mécanisme</div><p>La toux naît de l'irritation des récepteurs des voies aériennes par l'inflammation et les sécrétions. Une expectoration jaune ou verte doit sa couleur aux enzymes des polynucléaires neutrophiles ; des crachats couleur rouille contiennent des globules rouges altérés.</p>
<div class="lab">Valeur</div><p>Dans une série suisse de patients hospitalisés, la toux était présente chez environ 90 % d'entre eux. La couleur de l'expectoration n'identifie pas la bactérie. L'absence d'expectoration figure en revanche parmi les indices de la légionellose dans le score bâlois.</p>
<div class="lab">Piège</div><p>Un prélèvement valable est une expectoration profonde, non une simple salive. La SSI ne fait analyser l'expectoration que si elle peut être traitée en moins de 4 heures.</p>
</template>
<template data-pop="j18-s-dysp" data-title="Dyspnée">
<div class="lab">Caractérisation</div><p>Le médecin compare l'essoufflement à la capacité habituelle du patient, au repos et à l'effort, et il note la rapidité de l'aggravation et un éventuel besoin d'oxygène. Il mesure la saturation et la fréquence respiratoire, parce que la sensation du patient ne suffit pas à juger la gravité.</p>
<div class="lab">Mécanisme</div><p>L'hypoxémie, la rigidité du poumon consolidé et la fièvre augmentent la commande ventilatoire et le travail respiratoire, ce que le patient ressent comme une dyspnée.</p>
<div class="lab">Valeur</div><p>La dyspnée fait partie des signes de probabilité de la SSI. En soins primaires, l'essoufflement augmentait la probabilité de pneumonie (rapport de cotes ajusté de 1,4) ; dans une série suisse de patients hospitalisés, il était présent chez environ 90 % d'entre eux.</p>
<div class="lab">Piège</div><p>Une dyspnée brutale avec une douleur doit aussi faire chercher une embolie pulmonaire, un œdème aigu du poumon ou un pneumothorax.</p>
</template>
<template data-pop="j18-s-doul" data-title="Douleur thoracique pleurétique">
<div class="lab">Caractérisation</div><p>La douleur pleurétique augmente à l'inspiration profonde et à la toux, et elle est souvent latéralisée. Le patient limite son inspiration pour l'éviter.</p>
<div class="lab">Mécanisme</div><p>La plèvre pariétale, innervée par les nerfs intercostaux, est sensible à la douleur, alors que le parenchyme ne l'est pas. Lorsque l'inflammation atteint la surface du poumon, chaque mouvement respiratoire étire la plèvre enflammée.</p>
<div class="lab">Valeur</div><p>La British Thoracic Society l'associe au pneumocoque et la juge moins fréquente avec les agents atypiques. Le médecin vérifie la présence éventuelle d'un épanchement pleural.</p>
<div class="lab">Piège</div><p>Elle n'est pas spécifique : l'embolie pulmonaire et le pneumothorax sont des diagnostics différentiels urgents.</p>
</template>
<template data-pop="j18-s-conf" data-title="Confusion et chutes">
<div class="lab">Caractérisation</div><p>Le médecin vérifie avec l'entourage l'état mental antérieur, la chronologie de la confusion et les traitements sédatifs. Il la mesure par le test mental abrégé, dont un score d'au plus 8 sur 10 définit la confusion du CURB-65.</p>
<div class="lab">Mécanisme</div><p>Une confusion nouvelle peut traduire une hypoxémie, l'hypoperfusion cérébrale du sepsis, une déshydratation, une hyponatrémie ou un médicament.</p>
<div class="lab">Valeur</div><p>Elle compte un point dans le CRB-65 et le CURB-65, et elle figure parmi les critères de surveillance intensifiée de la SSI. Chez le sujet âgé, elle peut être le motif principal de consultation, avant la fièvre et la toux.</p>
<div class="lab">Piège</div><p>Le médecin ne l'attribue jamais par défaut à une démence. Une chute inexpliquée chez un sujet âgé impose aussi de mesurer les signes vitaux.</p>
</template>
<template data-pop="j18-s-hemo" data-title="Hémoptysie">
<div class="lab">Caractérisation</div><p>Le médecin quantifie le sang rejeté, recherche une détresse respiratoire et demande si le patient prend un anticoagulant.</p>
<div class="lab">Valeur</div><p>La SSI classe l'hémoptysie parmi les signaux d'alarme de l'infection respiratoire aiguë, qui font envisager un traitement hospitalier. Une petite strie de sang peut accompagner une pneumonie.</p>
<div class="lab">Piège</div><p>Une hémoptysie importante ou persistante impose de rechercher un cancer, une tuberculose, une embolie pulmonaire ou une hémorragie alvéolaire.</p>
</template>
<template data-pop="j18-v-fr" data-title="Fréquence respiratoire">
<div class="lab">Technique</div><p>Le médecin compte les mouvements respiratoires pendant une minute entière, au repos, si possible sans que le patient s'en aperçoive, parce que l'attention modifie le rythme.</p>
<div class="lab">Interprétation</div><p>Une fréquence de 12 à 20 par minute est un repère usuel chez l'adulte. À partir de 22 par minute, la fréquence devient un signe de probabilité de pneumonie selon la SSI et un critère du qSOFA. À partir de 30 par minute, elle devient un signal d'alarme de la SSI, un point du CRB-65 et un critère de surveillance intensifiée de la SSI. La stabilité exige une fréquence d'au plus 24 par minute.</p>
<div class="lab">Pourquoi elle compte</div><p>La fréquence respiratoire augmente tôt, parce que l'hypoxémie et l'acidose stimulent la ventilation. Elle signale donc la gravité avant la baisse de la saturation, surtout chez le patient sous oxygène.</p>
<div class="lab">Piège</div><p>Une valeur estimée ou recopiée masque une tachypnée réelle. Une fréquence qui baisse chez un patient épuisé, avec une PaCO₂ qui monte, peut précéder un arrêt respiratoire ; elle ne traduit pas une amélioration.</p>
</template>
<template data-pop="j18-v-spo" data-title="Saturation pulsée en oxygène">
<div class="lab">Technique</div><p>Le médecin attend un signal de pouls stable. Il note si la mesure est faite en air ambiant ou sous oxygène, avec le débit. Il vérifie la perfusion du doigt, l'absence de mouvement et de vernis, et la cohérence avec la clinique.</p>
<div class="lab">Interprétation</div><p>Une saturation inférieure à 92 % est un signal d'alarme de la SSI dans l'infection respiratoire aiguë. Une saturation artérielle inférieure à 90 % fait envisager l'hospitalisation quel que soit le score. La stabilité exige au moins 90 %, ou la valeur habituelle du patient.</p>
<div class="lab">Limites</div><p>Selon la British Thoracic Society, l'oxymétrie de pouls est en général simple et fiable. Une mauvaise perfusion périphérique peut toutefois fausser la mesure vers le bas, et une intoxication au monoxyde de carbone la fausse vers le haut.</p>
<div class="lab">Piège</div><p>Une saturation normale ne prouve pas l'absence d'infection. Sous oxygène, elle peut rester correcte alors que le patient s'épuise ; la fréquence respiratoire et, au besoin, la gazométrie le révèlent.</p>
</template>
<template data-pop="j18-v-ta" data-title="Pression artérielle et perfusion">
<div class="lab">Technique</div><p>Le médecin utilise un brassard adapté au bras du patient et répète la mesure si elle est anormale. Il examine aussi les extrémités, le temps de recoloration, l'état de conscience et la diurèse, qui renseignent sur la perfusion des organes.</p>
<div class="lab">Seuils</div><p>Une systolique inférieure à 90 mmHg est un signal d'alarme de la SSI. Une systolique inférieure à 90 mmHg ou une diastolique d'au plus 60 mmHg donnent un point du CRB-65. Une systolique d'au plus 100 mmHg est un critère du qSOFA. Une hypotension qui exige un remplissage vasculaire intensif figure parmi les critères de surveillance intensifiée de la SSI, et un besoin de vasopresseurs relève des soins intensifs.</p>
<div class="lab">Piège</div><p>Une pression encore normale n'exclut pas un sepsis précoce, surtout chez une personne habituellement hypertendue ou traitée par un antihypertenseur. Un lactate élevé ou des marbrures peuvent révéler une hypoperfusion avant l'hypotension.</p>
</template>
<template data-pop="j18-x-crep" data-title="Crépitants">
<div class="lab">Technique</div><p>Le médecin ausculte symétriquement les bases, les faces latérales et les sommets pendant plusieurs inspirations profondes. Il ausculte aussi le patient en décubitus latéral : dans une étude de 1999, les crépitants entendus dans cette position et les crépitants unilatéraux étaient les signes les plus utiles.</p>
<div class="lab">Mécanisme</div><p>Les crépitants naissent de la réouverture brutale, à l'inspiration, de petites voies aériennes et d'alvéoles partiellement remplies de liquide.</p>
<div class="lab">Valeur</div><p>Un foyer nouveau de crépitants fins, surtout unilatéral, soutient une atteinte locale. Dans l'étude européenne de soins primaires, les crépitants augmentaient nettement la probabilité de pneumonie (rapport de cotes ajusté de 3,5).</p>
<div class="lab">Piège</div><p>L'œdème pulmonaire et l'atélectasie en produisent aussi ; les crépitants de l'œdème sont en général bilatéraux. Leur absence n'exclut pas la pneumonie, et l'accord entre examinateurs reste moyen.</p>
</template>
<template data-pop="j18-x-mat" data-title="Percussion et vibrations vocales">
<div class="lab">Technique</div><p>Le médecin percute en comparant les deux côtés à la même hauteur. Il palpe les vibrations vocales avec le bord de la main pendant que le patient répète un mot, par exemple « trente-trois ».</p>
<div class="lab">Mécanisme</div><p>Un poumon plein de liquide sonne mat et transmet mieux les vibrations de la voix. Un épanchement pleural sonne aussi mat, mais il éloigne le poumon de la paroi et atténue les vibrations.</p>
<div class="lab">Interprétation</div><p>Une matité avec des vibrations augmentées suggère une consolidation. Une matité avec des vibrations diminuées évoque un épanchement pleural, qui impose une échographie et, chez le patient hospitalisé, une ponction.</p>
<div class="lab">Piège</div><p>L'épaisseur du thorax et une faible coopération du patient modifient ces signes.</p>
</template>
<template data-pop="j18-x-souffle" data-title="Souffle tubaire">
<div class="lab">Technique</div><p>Le médecin écoute les zones périphériques, normalement ventilées, et compare le bruit au son entendu au-dessus de la trachée.</p>
<div class="lab">Mécanisme</div><p>Normalement, le poumon aéré filtre le bruit trachéobronchique, et le médecin n'entend en périphérie qu'un murmure doux. Un parenchyme consolidé autour d'une bronche perméable transmet au contraire ce bruit sans le filtrer, d'où un souffle rude.</p>
<div class="lab">Valeur</div><p>Le souffle tubaire signale une consolidation. Dans une étude de 1999, le souffle bronchique figurait parmi les anomalies les plus souvent entendues, aussi bien chez les patients atteints de pneumonie que chez les autres.</p>
<div class="lab">Piège</div><p>Le souffle tubaire n'est pas constant et ne renseigne pas sur l'agent causal. Il disparaît lorsque la bronche est obstruée.</p>
</template>
<template data-pop="j18-curb" data-title="Scores CRB-65 et CURB-65">
<div class="lab">Les items</div><p>Le CRB-65 compte un point pour chacun des éléments suivants : une confusion nouvelle, définie par un test mental abrégé d'au plus 8 sur 10 ; une fréquence respiratoire d'au moins 30 par minute ; une pression systolique inférieure à 90 mmHg ou une diastolique d'au plus 60 mmHg ; un âge d'au moins 65 ans. Le CURB-65 ajoute une urée supérieure à 7 mmol/L.</p>
<div class="lab">Mortalité et conduite</div><p>Dans les cohortes de dérivation et de validation, la mortalité à 30 jours était de 0,7 %, 2,1 %, 9,2 %, 14,5 %, 40 % et 57 % pour un CURB-65 de 0 à 5. Pour le CRB-65, elle était de 1,2 %, 5,3 % et 12,2 % pour 0, 1 et 2 points, et atteignait 33 % à 3 ou 4 points. La British Thoracic Society traite à domicile un CRB-65 de 0, envisage l'hôpital pour 1 ou 2 points et hospitalise en urgence à partir de 3 points.</p>
<div class="lab">La lecture de la SSI</div><p>La SSI juge qu'un CRB-65 supérieur à 2 évoque une forme sévère. Elle fait envisager l'hospitalisation dès 1 point, sauf si l'âge est le seul critère, et quel que soit le score en cas d'hypoxémie, de comorbidité instable, de dysfonction d'organe, de complication ou de facteur social défavorable.</p>
<div class="lab">Piège</div><p>Le score oriente sans jamais décider seul : la saturation, le sepsis, les comorbidités, l'autonomie et l'entourage peuvent imposer l'admission malgré un score bas. Selon la British Thoracic Society, un patient jeune qui respire plus de 40 fois par minute peut justifier une surveillance hospitalière avec un score de 1.</p>
</template>
<template data-pop="j18-img" data-title="Condensation à l'imagerie"><p>Une condensation alvéolaire est une opacité homogène, souvent limitée à un lobe ou à un segment, dans laquelle l'exsudat a remplacé l'air. Lorsque les bronches restent aérées, elles se détachent en clair au sein du territoire opaque et dessinent un bronchogramme aérien, qui situe la lésion dans le parenchyme.</p><p>Le médecin juge d'abord la qualité du cliché, car une inspiration insuffisante, une rotation ou un cliché pris couché densifient les bases. Il compare ensuite l'image aux clichés antérieurs, puis il écarte les autres causes de densité : un œdème, une atélectasie, un infarctus pulmonaire ou un cancer.</p><p>L'échographie reconnaît les consolidations au contact de la plèvre, mais pas les pneumonies centrales ; la tomodensitométrie se réserve au doute diagnostique et aux complications.</p></template>
<template data-pop="j18-d-amox" data-title="Amoxicilline"><p><b>Mécanisme :</b> bêta-lactamine qui inhibe les protéines liant la pénicilline et la synthèse de la paroi bactérienne. <b>Place SSI :</b> pneumonie communautaire bactérienne ambulatoire sans comorbidité pertinente. <b>Posologie :</b> 1 g par voie orale toutes les 8 heures, soit 3 g par jour, maximum journalier retenu par la SSI dans cette indication, durée habituelle de 5 jours ; dose maximale de l'information professionnelle suisse d'Amoxicillin Sandoz : 4 à 6 g par jour en 3 ou 4 prises. <b>Rein :</b> aucune adaptation au-dessus de 30 mL/min de clairance de la créatinine ; de 10 à 30 mL/min, au plus 500 mg toutes les 12 heures ; au-dessous de 10 mL/min et en dialyse péritonéale, au plus 500 mg toutes les 24 heures ; en hémodialyse, même schéma, plus 1 g par voie parentérale ou 750 mg par voie orale après chaque séance (information professionnelle suisse d'Amoxicillin Sandoz). <b>Foie, grossesse, allaitement :</b> aucune adaptation hépatique prévue ; prudence pendant la grossesse ; allaitement à éviter. <b>Preuve :</b> dans l'essai CAP-START (2015), chez l'adulte hospitalisé hors soins intensifs, la stratégie par bêtalactamine seule n'a pas été inférieure aux stratégies avec macrolide ou fluoroquinolone pour la mortalité à 90 jours. <b>Risques :</b> vraie hypersensibilité, éruption, diarrhée, colite à <i>Clostridioides difficile</i>. <b>Contre-indications :</b> hypersensibilité aux pénicillines ou aux céphalosporines ; mononucléose infectieuse et leucémie lymphatique, qui exposent à un exanthème dans plus de 90 % des cas. <b>Suivi :</b> amélioration clinique en 48–72 heures, tolérance et fonction rénale.</p></template>
<template data-pop="j18-d-coamox" data-title="Amoxicilline et acide clavulanique"><p>Le clavulanate inhibe certaines bêta-lactamases et élargit le spectre de l'amoxicilline, notamment vers les souches d'<i>Haemophilus influenzae</i> productrices de bêta-lactamase. <b>Formes suisses :</b> comprimé à 1 g = 875 mg d'amoxicilline et 125 mg d'acide clavulanique (Augmentin 1 g et génériques) ; comprimé à 625 mg = 500 mg et 125 mg ; flacon intraveineux à 2,2 g = 2 000 mg et 200 mg ; flacon à 1,2 g = 1 000 mg et 200 mg. <b>Posologie :</b> en ville avec comorbidité pertinente, 1 g par voie orale toutes les 8 heures (SSI), qui est aussi la dose maximale de l'information professionnelle suisse d'Augmentin ; à l'hôpital, 2,2 g par voie intraveineuse toutes les 8 heures (SSI), dose usuelle et non maximale : les informations professionnelles suisses des formes intraveineuses (Co-Amoxicillin Labatec, Co-Amoxi-Mepha i.v.) admettent au plus six perfusions de 2,2 g par 24 heures, jamais plus souvent que toutes les 4 heures, soit 200 mg d'acide clavulanique par perfusion et 1 200 mg par 24 heures. <b>Rein :</b> comprimé à 1 g et flacon à 2,2 g exclus au-dessous de 30 mL/min de clairance ; de 10 à 30 mL/min, 625 mg toutes les 12 heures par voie orale ou 1,2 g puis 600 mg toutes les 12 heures par voie intraveineuse ; au-dessous de 10 mL/min, les mêmes doses toutes les 24 heures ; en hémodialyse, dose supplémentaire (informations professionnelles suisses). <b>Foie, grossesse, allaitement :</b> prudence en cas de trouble hépatique ; pendant la grossesse, seulement si elle est clairement nécessaire ; pas d'allaitement pendant le traitement. <b>Preuve :</b> la stratégie par bêtalactamine seule de l'essai CAP-START (2015) admettait cette association. <b>Risques :</b> diarrhée, hépatite cholestatique parfois retardée. <b>Contre-indications :</b> hypersensibilité aux pénicillines, aux céphalosporines ou à l'acide clavulanique, antécédent d'ictère ou d'atteinte hépatique imputé à l'association, mononucléose infectieuse, leucémie lymphatique.</p></template>
<template data-pop="j18-d-cef" data-title="Ceftriaxone"><p>Céphalosporine parentérale de troisième génération active sur de nombreux agents de pneumonie communautaire, mais insuffisante pour <i>Mycoplasma</i> et <i>Legionella</i>. <b>Posologie :</b> 2 g par voie intraveineuse une fois par jour dans l'alternative de la SSI hospitalière en cas d'allergie aux pénicillines ; 1 à 2 g une fois par jour selon l'information professionnelle, au plus 4 g par jour. <b>Rein :</b> aucune adaptation si la fonction hépatique est normale ; au-dessous de 10 mL/min de clairance et en dialyse, au plus 2 g par jour, sans dose supplémentaire après la séance (information professionnelle suisse de Rocephin). <b>Foie, grossesse, allaitement :</b> aucune adaptation hépatique si la fonction rénale est normale ; indication strictement posée pendant la grossesse, surtout au premier trimestre ; allaitement à éviter. <b>Preuve :</b> céphalosporine de troisième génération admise dans la stratégie par bêtalactamine seule de l'essai CAP-START (2015). <b>Risques :</b> pseudo-lithiase biliaire, colite à <i>Clostridioides difficile</i>, hypersensibilité. <b>Contre-indications :</b> hypersensibilité à la ceftriaxone ou à une autre céphalosporine selon l'information professionnelle suisse, qui demande la prudence après une hypersensibilité à une autre bêtalactamine ; le résumé européen harmonisé y ajoute l'hypersensibilité grave, par exemple une anaphylaxie, à une autre bêtalactamine. Voie intramusculaire, dont le solvant contient de la lidocaïne : hypersensibilité à la lidocaïne ou à un autre anesthésique local de type anilide, troubles de la conduction cardiaque, insuffisance cardiaque aiguë décompensée ; solution contenant de la lidocaïne jamais par voie intraveineuse. Nouveau-né : prématuré jusqu'à 41 semaines d'âge postmenstruel, hyperbilirubinémie (information professionnelle suisse de Rocephin, juin 2025). <b>Calcium :</b> ne pas mélanger la ceftriaxone à une solution contenant du calcium, ni l'administrer simultanément avec une perfusion calcique ; contre-indication formelle chez le nouveau-né de 28 jours ou moins qui a besoin, ou aura probablement besoin, d'une perfusion calcique. <b>Surveillance :</b> type réel d'allergie, tolérance biliaire, indication d'une couverture des agents atypiques.</p></template>
<template data-pop="j18-d-macro" data-title="Macrolides"><p>Ils se lient à la sous-unité ribosomique 50S et couvrent les agents atypiques (<i>Mycoplasma</i>, <i>Legionella</i>, <i>Chlamydia</i>). Leur ajout n'est pas automatique en ville. <b>Posologie :</b> clarithromycine 500 mg par voie orale ou intraveineuse toutes les 12 heures (SSI), au plus 1 g par jour, voie intraveineuse limitée à 5 jours (informations professionnelles suisses de Klacid et de Klacid i.v.) ; azithromycine 500 mg par voie orale une fois par jour (SSI), soit en ville 3 jours et 1,5 g au total selon l'information professionnelle suisse de Zithromax. <b>Durée à l'hôpital :</b> en association à la bêtalactamine, 24 à 72 heures dans la fiche SSI, plus longtemps en cas d'admission en soins intensifs, de légionellose suspectée ou prouvée, ou d'agent atypique identifié ; dans la forme sévère, le groupe de travail des recommandations 2023 de l'ERS, de l'ESICM, de l'ESCMID et de l'Asociación Latinoamericana de Tórax juge raisonnable une durée de 3 à 5 jours, notamment dans une stratégie de désescalade. <b>Rein :</b> clarithromycine, moitié de la dose au-dessous de 30 mL/min de clairance, durée totale de 14 jours au plus ; azithromycine, aucune adaptation pour un débit de filtration glomérulaire de 10 à 80 mL/min, emploi prudent au-dessous de 10 mL/min (informations professionnelles suisses). <b>Foie, grossesse, allaitement :</b> clarithromycine, prudence en insuffisance hépatique, seulement si elle est clairement nécessaire pendant la grossesse, pas d'allaitement jusqu'au lendemain de la dernière dose ; azithromycine, même dose avec prudence en insuffisance hépatique légère à modérée, seulement si elle est cliniquement nécessaire pendant la grossesse, allaitement à éviter. <b>Preuve :</b> l'essai suisse de Garin et al. (2014 ; 580 adultes immunocompétents de 6 hôpitaux suisses) n'a pas démontré la non-infériorité de la bêtalactamine seule face à l'association avec un macrolide pour la stabilité clinique au septième jour chez l'adulte hospitalisé de gravité modérée ; les patients infectés par un agent atypique se stabilisaient plus tard sous monothérapie. Les recommandations européennes et latino-américaines de 2023 déjà citées suggèrent d'ajouter un macrolide, plutôt qu'une fluoroquinolone, à la bêtalactamine dans la forme sévère. <b>Risques :</b> allongement du QT, torsades de pointes, troubles digestifs, sélection de résistances (pneumocoque résistant aux macrolides) ; la clarithromycine inhibe fortement le CYP3A4. <b>Contre-indications de la clarithromycine :</b> hypersensibilité connue aux macrolides ou à un excipient ; association à la simvastatine, à la lovastatine, aux alcaloïdes de l'ergot, à la colchicine, au ticagrélor, à la ranolazine, à l'ivabradine, au midazolam par voie orale, à la lomitapide, à la dompéridone, à la quétiapine ou au pimozide ; QT long ou antécédent de tachycardie ventriculaire ; hypokaliémie ou hypomagnésémie ; insuffisance hépatique sévère associée à une insuffisance rénale (information professionnelle suisse de Klacid). <b>Surveillance :</b> électrocardiogramme en présence d'un facteur de risque rythmique, kaliémie, liste complète des médicaments.</p></template>
<template data-pop="j18-d-fq" data-title="Fluoroquinolones respiratoires"><p>Elles inhibent les topoisomérases bactériennes (gyrase et topoisomérase IV). <b>Place :</b> alternative réservée, par exemple en cas d'allergie grave documentée aux bêtalactamines ou de légionellose ; Swissmedic a restreint le 29.01.2018 leur emploi dans les infections bactériennes non compliquées aux situations où les autres antibiotiques ne conviennent pas ou ont échoué, restriction rappelée le 04.02.2019 ; la fiche SSI les place en alternative lors d'une allergie aux pénicillines en ville, d'une allergie grave aux bêtalactamines à l'hôpital, et dans la légionellose. Le médecin ne les prescrit pas par routine lorsque l'amoxicilline répond à l'indication. <b>Posologie :</b> lévofloxacine 500 mg par voie orale ou intraveineuse une ou deux fois par jour pendant 7 à 14 jours, au plus 1 g par jour (légionellose : 500 mg deux fois par jour) ; moxifloxacine 400 mg une fois par jour par voie orale ou intraveineuse, dose à ne pas dépasser (informations professionnelles suisses de Tavanic et d'Avalox ; celle de Tavanic juge encore insuffisante l'expérience dans la pneumonie à <i>Legionella</i>). <b>Rein :</b> lévofloxacine, après une première dose de 500 mg, 250 mg de 20 à 50 mL/min et 125 mg de 10 à 19 mL/min à l'intervalle habituel, 125 mg toutes les 24 heures au-dessous de 10 mL/min, dialyse comprise (information professionnelle suisse de Tavanic) ; moxifloxacine sans adaptation, dialyse comprise (information professionnelle suisse d'Avalox). <b>Foie :</b> lévofloxacine sans adaptation ; moxifloxacine contre-indiquée en insuffisance hépatique sévère (Child-Pugh C) ou si les transaminases dépassent cinq fois la limite supérieure. <b>Preuve :</b> dans l'essai CAP-START (2015), la stratégie par fluoroquinolone seule n'a pas fait mieux que la bêtalactamine seule (mortalité à 90 jours de 8,8 % contre 9,0 %). <b>Risques :</b> tendinite et rupture tendineuse, surtout chez le sujet âgé, sous corticostéroïdes ou après transplantation ; neuropathie périphérique ; effets neuropsychiatriques ; allongement du QT ; dysglycémies ; anévrisme et dissection aortiques (mise en garde de Swissmedic du 04.02.2019) ; régurgitation valvulaire (communication publiée par Swissmedic le 18.02.2021). <b>Contre-indications :</b> hypersensibilité aux quinolones, âge inférieur à 18 ans, antécédent de tendinopathie sous fluoroquinolone, grossesse et allaitement ; lévofloxacine : épilepsie ; moxifloxacine : QT long, trouble électrolytique dont une hypokaliémie non corrigée, bradycardie significative, insuffisance cardiaque significative à fraction d'éjection réduite, arythmie symptomatique, association à d'autres médicaments qui allongent le QT, insuffisance hépatique sévère et, faute de données, neutropénie, infection par le VIH, autre immunodépression ou infection de prothèse (informations professionnelles suisses). <b>Interactions :</b> chélation par les antiacides, le fer, le calcium ou le zinc, à prendre à distance de la fluoroquinolone.</p></template>
<template data-pop="pareto-j18-clinique" data-title="Pareto — Clinique"><p class="ratio" data-cover="j18-0,j18-1,j18-2,j18-3,j18-4,j18-5,j18-6"></p><ul><li>La pneumonie est une infection aiguë du parenchyme pulmonaire : un exsudat remplit les alvéoles, alors que la bronchite n'enflamme que les voies aériennes. La question clinique a quatre parties : le médecin établit s'il s'agit d'une pneumonie, mesure sa gravité, choisit le lieu de soins et commence le traitement sans retard. Chez le patient hypoxémique ou confus, il donne l'oxygène et recherche un sepsis avant même la confirmation radiologique.</li><li>La SSI définit la pneumonie par un infiltrat nouveau à la radiographie, à l'échographie ou à la tomodensitométrie, associé à des symptômes d'infection respiratoire basse, sans autre explication. En soins primaires, les généralistes ne reconnaissaient cliniquement que 29 % des pneumonies radiologiques ; sans image, le diagnostic reste une probabilité. La British Thoracic Society admet en ville un diagnostic clinique lorsque quatre conditions sont réunies : des symptômes respiratoires bas, des signes focaux nouveaux, au moins un signe général et l'absence d'autre explication.</li><li>La pneumonie est communautaire lorsqu'elle est acquise hors de l'hôpital ou qu'elle débute au plus tard 48 heures après l'admission ; la SSI y inclut les résidents des établissements de soins et en exclut l'immunodépression sévère. La pneumonie nosocomiale débute au moins 48 heures après l'admission et relève d'une autre écologie bactérienne. Une hospitalisation dans les six mois précédents impose d'évaluer individuellement le risque de germe résistant.</li><li>Les mots « typique » et « atypique » ne prouvent pas l'agent, car la clinique ne le prédit pas. Le mot « atypique » garde un sens pharmacologique : ces agents, sans paroi accessible ou intracellulaires, échappent aux bêtalactamines et exigent un macrolide, une tétracycline ou une fluoroquinolone. L'inhalation de contenu gastrique peut causer une pneumonite chimique sans bactérie, qui se distingue d'une pneumonie bactérienne d'aspiration.</li><li>La classification pratique suit le lieu de soins : la mortalité reste inférieure à 1 % en ville, atteint 5,7 à 14 % à l'hôpital et dépasse 30 % en soins intensifs (British Thoracic Society 2009). Ce lieu découle de la gravité, du terrain et de l'entourage, jamais d'un score isolé.</li><li>Le cours traite la pneumonie communautaire bactérienne de l'adulte, due au pneumocoque, à <i>H. influenzae</i>, à une autre bactérie comme <i>Mycoplasma</i> ou à un agent inconnu ; la pneumonie à <i>Chlamydia pneumoniae</i> est abordée avec les agents atypiques. Les pneumonies virales relèvent du cours de la grippe, les pneumonies compliquant une autre maladie du cours de cette maladie, et les pneumonies nosocomiales et d'inhalation restent hors champ. Un infiltrat n'est pas toujours infectieux, car un œdème, un infarctus pulmonaire, une hémorragie alvéolaire ou un cancer produisent aussi une opacité.</li><li>En Suisse, 2,4 % des séjours hospitaliers de 2002 à 2015 comportaient un diagnostic de pneumonie, et l'incidence de ces hospitalisations est passée de 376 à 536 pour 100 000 habitants et par an. L'âge d'au moins 65 ans multipliait par 2,98 le risque d'hospitalisation et par 2,38 celui de décès hospitalier. Dans une série suisse de 2002, le patient hospitalisé avait en moyenne 70 ans, souvent plusieurs comorbidités, et la mortalité atteignait 8 %. La légionellose déclarée est passée de 1,1 à 5,6 cas pour 100 000 habitants entre 2000 et 2020, et elle culmine en été.</li><li>La pneumonie touche chaque année 5 à 11 adultes sur 1000, et 34 sur 1000 après 75 ans dans une étude finlandaise ; dans les études britanniques, 22 à 42 % des malades sont hospitalisés. Le risque persiste après la sortie : la mortalité atteint 8,7 % à 90 jours, et une complication cardiaque touche 17,7 % des patients hospitalisés dans les 30 jours.</li><li>Le poumon normal élimine les microbes par la clairance mucociliaire, la toux et les macrophages alvéolaires, et il oxygène le sang parce que la ventilation et la perfusion restent appariées. Une saturation de 90 % correspond à une PaO₂ d'environ 60 mmHg (8 kPa) ; au-dessous de ce point, la saturation chute vite.</li><li>Le microbe atteint l'alvéole surtout par microaspiration de sécrétions oropharyngées, plus rarement par aérosol ou par voie sanguine. Les macrophages libèrent des cytokines, les neutrophiles affluent et l'exsudat remplit les alvéoles : il explique les crépitants, la matité, les vibrations vocales augmentées, le souffle tubaire et l'opacité avec bronchogramme aérien.</li><li>L'alvéole remplie reste perfusée : cet effet shunt abaisse la saturation du sang artériel, et l'oxygène le corrige mal lorsqu'il est étendu. Dans l'exemple du cours, 30 % de sang shunté ramènent la saturation à environ 90 %, et l'oxygène ne la porte qu'à environ 91 %. Une PaCO₂ qui remonte chez un patient tachypnéique signale l'épuisement.</li><li>Les cytokines passées dans le sang causent la fièvre, la confusion et, si la réponse se dérègle, le sepsis avec hypotension, insuffisance rénale et hausse du lactate. La plèvre pariétale, seule innervée, explique la douleur pleurétique, et son inflammation produit l'épanchement parapneumonique.</li><li>Le pneumocoque est l'agent identifié le plus souvent en ville (36 %) et à l'hôpital (39 %) dans les séries britanniques ; <i>Legionella</i> (17,8 %) et <i>S. aureus</i> (8,7 %) pèsent en soins intensifs. Aucun agent n'est trouvé chez un tiers à la moitié des patients, et une étude américaine systématique n'en trouvait que chez 38 % d'entre eux, souvent des virus. Le traitement empirique couvre donc d'abord le pneumocoque, puis les agents des formes graves.</li><li>Aucun signe isolé n'identifie l'agent. Une diarrhée, une confusion, une hyponatrémie et des enzymes élevées évoquent <i>Legionella</i>, surtout en été ou après un séjour à l'hôtel. Le score bâlois compte une température supérieure à 39,4 °C, l'absence d'expectoration, un sodium inférieur à 133 mmol/L, une LDH supérieure à 225 U/L, une protéine C réactive supérieure à 187 mg/L et des plaquettes inférieures à 171 × 10⁹/L ; la proportion de légionelloses passait de 3 % à 0 ou 1 point à 66 % à partir de 4 points.</li><li>Les facteurs de risque affaiblissent les défenses, comme l'âge, l'insuffisance cardiaque, la maladie pulmonaire chronique, l'immunodéficience, le diabète et le tabac, ou augmentent l'aspiration, comme les troubles de la déglutition ou de la conscience, l'alcool et la sédation. La SSI demande de réévaluer après l'épisode les inhibiteurs de la pompe à protons, les opiacés et les antipsychotiques, et d'améliorer l'hygiène buccale.</li><li>Selon la SSI, un antibiotique dans les 90 jours précédents ou une hémodialyse exposent à un germe résistant dans la forme sévère et font choisir la pipéracilline-tazobactam associée à un macrolide. Le mot « aspiration » ne justifie pas à lui seul une couverture anaérobie, sauf en cas d'abcès ou d'empyème.</li><li>L'anamnèse recherche la maladie pulmonaire, l'immunodépression, les vaccinations, le tabac et l'alcool, la dysphagie, les voyages et l'eau pulvérisée, les antibiotiques récents, les allergies et la fonction rénale ; chaque réponse modifie la gravité, les germes ou la dose. Une allergie non caractérisée peut priver le patient du meilleur antibiotique.</li><li>La toux et la dyspnée sont présentes chez environ 90 % des patients hospitalisés, mais la fièvre manque chez un tiers d'entre eux, et les symptômes diminuent avec l'âge. Une confusion nouvelle, une chute ou un déclin brutal sans fièvre peuvent révéler la pneumonie chez le sujet âgé : une présentation atypique ou sans fièvre ne l'exclut pas. Une dyspnée ou une douleur brutales font chercher une embolie ou un pneumothorax, et une hémoptysie un cancer, une tuberculose ou une embolie.</li><li>L'examen mesure d'abord six paramètres : la fréquence respiratoire, qui se compte, la saturation en air ambiant, la pression artérielle, le pouls, la température et l'état mental. La SSI retient comme signes de probabilité une fréquence respiratoire d'au moins 22 par minute et un pouls d'au moins 100 par minute. Des signes vitaux normaux associés à un examen pulmonaire normal abaissent le rapport de vraisemblance négatif à 0,10.</li><li>Des crépitants unilatéraux augmentent fortement la probabilité de pneumonie, mais l'examen du thorax n'a qu'une sensibilité de 47 à 69 %. Une matité avec des vibrations augmentées signe une consolidation ; une matité avec des vibrations abolies signe un épanchement.</li><li>Selon la SSI, une fréquence respiratoire d'au moins 30 par minute, une saturation inférieure à 92 %, une systolique inférieure à 90 mmHg, une altération marquée de l'état général, une hémoptysie, un stridor, une maladie pulmonaire ou une immunodéficience sévères imposent une évaluation urgente et font envisager un traitement hospitalier. Une confusion, un choc ou une cyanose imposent un traitement immédiat. L'examen cherche aussi une insuffisance cardiaque, une thrombose veineuse ou une méningite.</li><li>Madame R., 71 ans, diabétique et hypertendue, a une fréquence respiratoire de 31 par minute, une saturation de 89 %, une confusion et une consolidation de la base droite : elle présente trois signaux d'alarme et doit être traitée à l'hôpital.</li></ul></template>
<template data-pop="pareto-j18-urgence" data-title="Pareto — Diagnostic, gravité, traitement et critères"><p class="ratio" data-cover="j18-7,j18-8,j18-9,j18-10,j18-11,j18-12"></p><ul><li>À l'hôpital, le diagnostic associe des signes d'infection respiratoire basse aiguë et une opacité nouvelle à l'imagerie qu'aucune autre cause n'explique. En ville, chez le patient stable, la radiographie n'est pas systématique, mais le médecin la recherche lorsque la pneumonie est suspectée.</li><li>La SSI retient cinq signes de probabilité : une fièvre d'au moins 38,5 °C pendant plus de trois jours, une dyspnée, une fréquence respiratoire d'au moins 22 par minute, un foyer auscultatoire et un pouls d'au moins 100 par minute. Un seul signe suffit pour doser un marqueur inflammatoire. Deux signes d'infection haute sans dyspnée, sans tachycardie et sans crépitants rendent l'antibiotique utile dans moins de 1 à 3 % des cas.</li><li>Chez le patient ambulatoire qui présente un signe de probabilité, une protéine C réactive inférieure à 50 mg/L fait privilégier un traitement symptomatique, une valeur de 50 à 100 mg/L fait décider avec le patient, et une valeur d'au moins 100 mg/L fait envisager un antibiotique. Une procalcitonine inférieure à 0,25 µg/L permet aussi de s'abstenir. Ces seuils n'ont aucune valeur de veto chez le patient hospitalisé ou instable.</li><li>L'échographie pulmonaire remplace la radiographie seulement entre des mains expérimentées, et la tomodensitométrie se réserve au doute diagnostique et aux complications. Une image initiale peut être normale chez le patient déshydraté ou vu très tôt.</li><li>Le CRB-65 compte un point pour la confusion, la fréquence respiratoire d'au moins 30 par minute, la systolique inférieure à 90 mmHg ou la diastolique d'au plus 60 mmHg et l'âge d'au moins 65 ans ; le CURB-65 ajoute l'urée supérieure à 7 mmol/L. La mortalité du CURB-65 passe de 0,7 % à 0 point à 2,1 % à 1 point, 9,2 % à 2, 14,5 % à 3, 40 % à 4 et 57 % à 5. Selon la British Thoracic Society, un CRB-65 de 0 permet la ville, un score de 1 à 2 fait discuter l'hôpital et un score de 3 à 4 impose une hospitalisation urgente.</li><li>La SSI fait envisager l'hospitalisation dès 1 point, sauf si l'âge est le seul critère, et quel que soit le score en cas de saturation artérielle inférieure à 90 % en air ambiant, de besoin d'oxygène, de comorbidité instable, de dysfonction d'organe, d'épanchement pleural ou de facteur social défavorable. Les recommandations de l'ERS et de l'ESCMID retiennent le CRB-65 comme outil de choix, aussi prédictif que le PSI, qui sous-estime la gravité chez le sujet jeune.</li><li>En ville, la SSI ne recommande aucun test microbiologique. À l'hôpital, elle prévoit deux paires d'hémocultures, les antigènes urinaires du pneumocoque et de <i>Legionella</i>, l'expectoration traitée en moins de 4 heures, la recherche de la grippe par amplification génique pendant la saison et la ponction d'un épanchement. Les hémocultures ont une sensibilité d'au plus 25 %, et leur prélèvement ne retarde jamais l'antibiotique du malade sévère.</li><li>L'algorithme suit un ordre fixe : les signaux d'alarme, puis les critères d'hospitalisation, puis la probabilité clinique et la protéine C réactive, puis la réévaluation. Une hypoxémie ou une confusion imposent des soins urgents sans attendre le nom du germe.</li><li>Les diagnostics différentiels se passent en revue du plus grave au moins grave : l'embolie pulmonaire, l'œdème cardiogénique, le sepsis d'une autre origine, l'exacerbation obstructive et le pneumothorax, puis, si les symptômes se prolongent, le cancer et la tuberculose, et enfin les pneumopathies non infectieuses.</li><li>Selon la SSI, un CRB-65 supérieur à 2 points évoque une forme sévère, et neuf critères imposent une surveillance intensifiée : une fréquence respiratoire d'au moins 30 par minute, une PaO₂ d'au plus 55 mmHg en air ambiant, des infiltrats multilobaires, un trouble nouveau de l'état de conscience, une hypotension qui exige un remplissage intensif, une insuffisance rénale aiguë, des leucocytes inférieurs à 4 × 10⁹/L, des plaquettes inférieures à 100 × 10⁹/L et une température inférieure à 36 °C. Les recommandations européennes et latino-américaines de 2023 définissent la forme sévère par l'admission en soins intensifs, et une ventilation mécanique ou des vasopresseurs l'imposent.</li><li>Le sepsis est une dysfonction d'organe causée par une réponse dérégulée à l'infection et objectivée par une hausse d'au moins 2 points du SOFA. Le choc septique exige des vasopresseurs pour maintenir une PAM d'au moins 65 mmHg, avec un lactate supérieur à 2 mmol/L. Le qSOFA ne suffit pas comme seul outil de dépistage, et la Surviving Sepsis Campaign demande l'antibiotique dans l'heure en cas de choc possible ou de sepsis probable.</li><li>Un épanchement parapneumonique touche 36 à 57 % des patients hospitalisés pour une pneumonie bactérienne ; le médecin le ponctionne, et un liquide trouble, purulent ou de pH inférieur à 7,2 impose un drainage. Un abcès peut exiger jusqu'à six semaines d'antibiotique, et le syndrome de détresse respiratoire aiguë se classe selon la définition de Berlin.</li><li>Une complication cardiaque touche 17,7 % des patients hospitalisés dans les 30 jours. Une bactériémie peut essaimer aux méninges, au cœur ou aux articulations, et <i>Legionella</i> donne une hyponatrémie, une insuffisance rénale et une rhabdomyolyse.</li><li>La température, la fréquence respiratoire et la saturation s'améliorent en 3 jours médians. L'absence de stabilité à 72 heures définit une réponse retardée, et un échec impose de revoir le diagnostic, le germe, la dose et les complications avant de changer d'antibiotique.</li><li>L'oxygène vise une saturation de 94 à 98 %, ou de 88 à 92 % en cas de risque d'hypercapnie. L'hydratation, l'héparine de bas poids moléculaire chez le patient qui n'est pas complètement mobile et la mobilisation précoce font partie du traitement.</li><li>En ville, le patient sans comorbidité reçoit l'amoxicilline 1 g toutes les 8 heures, et le patient comorbide la co-amoxicilline 1 g toutes les 8 heures si sa clairance dépasse 30 mL/min. À l'hôpital, le médecin donne la co-amoxicilline 2,2 g toutes les 8 heures par voie intraveineuse, ou la ceftriaxone 2 g par jour en cas d'allergie, avec un macrolide facultatif dans la forme modérée et obligatoire dans la forme sévère. La SSI limite le macrolide à 24 à 72 heures, sauf en soins intensifs, en cas de légionellose ou d'agent atypique ; les recommandations européennes et latino-américaines de 2023 jugent raisonnable une durée de 3 à 5 jours dans la forme sévère.</li><li>Dans la forme sévère, un antibiotique dans les 90 jours ou une hémodialyse font choisir la pipéracilline-tazobactam, et les fluoroquinolones restent réservées à l'allergie grave aux bêtalactamines. Pendant la saison grippale, l'oseltamivir se donne jusqu'à l'exclusion de la grippe, et un test viral positif n'écarte pas une co-infection bactérienne chez le malade grave.</li><li>Dès que l'agent est connu, le traitement ciblé réduit le spectre : l'amoxicilline ou la pénicilline G traitent le pneumocoque, une fluoroquinolone ou l'azithromycine <i>Legionella</i>, la doxycycline <i>Mycoplasma</i> et <i>Coxiella</i>, la flucloxacilline <i>S. aureus</i> sensible et le linézolide <i>S. aureus</i> résistant. Après une grippe, la clindamycine ou le linézolide freinent la toxine de Panton et Valentine.</li><li>La durée simple est de 5 jours, avec un arrêt au moins 2 à 3 jours après l'obtention de la stabilité ; la forme sévère exige 5 à 7 jours selon la SSI. Le Kantonsspital Baden traite la légionellose pendant 7 à 10 jours, alors qu'une étude suisse de 2025 juge 5 à 7 jours suffisants, et les complications allongent le traitement.</li><li>La stabilité exige une température d'au plus 37,8 °C, un pouls d'au plus 100 par minute, une fréquence respiratoire d'au plus 24 par minute, une systolique d'au moins 90 mmHg, une saturation d'au moins 90 %, une alimentation orale et un état mental habituels ; elle autorise le relais oral. Une protéine C réactive qui ne baisse pas de moitié au troisième ou au quatrième jour doit faire chercher une complication.</li><li>Le médecin ne donne jamais de corticostéroïdes en routine dans la forme non sévère, sauf en cas d'obstruction bronchique qui s'aggrave, et il les évite en cas de grippe. Dans la forme sévère, la SSI les juge indiqués même sans choc, par exemple l'hydrocortisone 200 mg par jour pendant 4 à 8 jours ; les recommandations européennes de 2023, plus anciennes, ne les suggèrent qu'en cas de choc. CAPE COD a réduit la mortalité à 28 jours de 11,9 à 6,2 %, alors qu'ESCAPe et REMAP-CAP n'ont pas démontré de bénéfice.</li><li>La SSI propose d'envisager l'aspirine 300 mg par jour pendant un mois chez le patient hospitalisé à risque cardiovasculaire. La metformine se suspend en cas d'infection grave, d'hypoxie sévère ou de déshydratation.</li><li>Le médecin réévalue le patient ambulatoire à 48–72 heures, le patient hospitalisé chaque jour et tout patient qui s'aggrave. Un patient ne sort pas avec plus d'un signe d'instabilité, car deux signes s'associaient à 46 % de décès ou de réhospitalisations à 30 jours.</li><li>L'opacité disparaît chez 73 % des patients en 6 semaines, plus lentement chez le sujet âgé, et l'image ne prolonge jamais l'antibiotique. La radiographie de contrôle n'est pas systématique : elle se réserve, vers 6 semaines, aux symptômes persistants, aux fumeurs et aux patients de plus de 50 ans.</li><li>Le Plan de vaccination suisse 2026 recommande une dose unique de vaccin conjugué 20-valent ou 21-valent contre le pneumocoque à toutes les personnes de 65 ans et plus et aux adultes à risque. Il recommande aussi le vaccin annuel contre la grippe dès 65 ans, à haute dose après 75 ans ou entre 65 et 74 ans en présence d'un facteur de risque, et le vaccin contre la COVID-19 en automne aux personnes à risque. La SSI vaccine dès la sortie ou au contrôle, fait arrêter le tabac et corriger les facteurs d'aspiration.</li><li>Pendant la grossesse, le médecin traite sans délai, de préférence par une bêtalactamine, et les fluoroquinolones sont contre-indiquées. Chez le sujet âgé et le résident d'établissement, la SSI fixe l'objectif curatif ou palliatif selon l'autonomie, dans les groupes 1a, 1b et 2.</li><li>Le médecin calcule la clairance de la créatinine par la formule de Cockcroft-Gault avant de prescrire. Au-dessous de 30 mL/min, les formes de co-amoxicilline à 1 g et à 2,2 g sont exclues et la clarithromycine se donne à demi-dose, alors que la moxifloxacine n'exige aucune adaptation ; la lévofloxacine se réduit dès 50 mL/min et l'oseltamivir dès 60 mL/min.</li><li>Un ictère antérieur sous co-amoxicilline contre-indique cette association, et la moxifloxacine est contre-indiquée en insuffisance hépatique de classe C de Child-Pugh. Une immunosuppression sévère, par exemple des lymphocytes CD4 inférieurs à 200 par microlitre ou une prednisone d'au moins 20 mg par jour pendant au moins 4 semaines, fait sortir le patient du cadre de la pneumonie communautaire.</li><li>Chez Madame R., un CURB-65 de 4, trois critères de surveillance intensifiée de la SSI et un sepsis sans choc ont justifié la co-amoxicilline intraveineuse, l'azithromycine plutôt que la clarithromycine à cause de l'amlodipine, l'oseltamivir réduit à 30 mg deux fois par jour pour une clairance de 38 mL/min, la suspension de la metformine et l'hydrocortisone. La stabilité obtenue au troisième jour a permis le relais oral, la sortie au cinquième jour et l'arrêt au septième.</li></ul></template>
<template data-pop="pareto-j18-examens" data-title="Pareto — Examens"><p class="ratio" data-cover="j18-e-1,j18-e-2,j18-e-3,j18-e-4,j18-e-5"></p><ul><li>L'oxygénation se mesure d'abord. La radiographie de face et de profil est l'examen de référence du diagnostic ; elle est exigée à l'hôpital et recherchée en ville lorsque la pneumonie est suspectée.</li><li>La radiographie se juge sur sa qualité, puis sur l'opacité, le bronchogramme aérien, l'épanchement et la cavité. Elle peut rester peu expressive chez le patient déshydraté ou vu très tôt, et l'opacité ne disparaît qu'à 73 % à 6 semaines.</li><li>Une saturation de 90 % correspond à une PaO₂ de 60 mmHg. Une PaCO₂ qui remonte chez un patient tachypnéique signale l'épuisement.</li><li>Les seuils biologiques de surveillance intensifiée de la SSI sont une PaO₂ d'au plus 55 mmHg, des leucocytes inférieurs à 4 × 10⁹/L et des plaquettes inférieures à 100 × 10⁹/L. Une hyponatrémie, une LDH et une protéine C réactive élevées et des plaquettes basses orientent vers <i>Legionella</i>.</li><li>En ville, la SSI ne recommande aucun test microbiologique. À l'hôpital, elle prévoit deux paires d'hémocultures, les antigènes urinaires du pneumocoque et de <i>Legionella</i>, l'expectoration traitée en moins de 4 heures, la grippe en saison et la ponction d'un épanchement. Un résultat négatif n'exclut jamais l'agent.</li><li>Un pH pleural inférieur à 7,2 impose un drainage.</li></ul></template>
<template data-pop="pareto-j18-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="j18-s-anatomie,j18-s-histologie,j18-s-physiologie,j18-s-microbiologie,j18-s-immunologie"></p><ul><li>La bronche droite, plus verticale, et la position du patient expliquent la topographie des aspirations, retrouvées chez 71 % des sujets âgés atteints de pneumonie. Seule la plèvre pariétale est douloureuse.</li><li>L'exsudat alvéolaire passe par l'hépatisation rouge puis grise ; il explique l'opacité, la matité, le souffle tubaire et les crépitants, et il se résorbe après la guérison clinique.</li><li>L'effet shunt explique l'hypoxémie et sa correction partielle par l'oxygène. Une saturation de 90 % correspond à une PaO₂ de 60 mmHg.</li><li>L'absence de paroi de <i>Mycoplasma</i> et la vie intracellulaire de <i>Legionella</i>, de <i>Chlamydia</i> et de <i>Coxiella</i> rendent les bêtalactamines inactives ; les bêtalactamases d'<i>H. influenzae</i> imposent l'acide clavulanique.</li><li>Les cytokines produisent l'exsudat, la fièvre et la protéine C réactive ; leur dérèglement définit le sepsis. La capsule du pneumocoque explique le risque de l'asplénie et le principe des vaccins conjugués.</li></ul></template>
<template data-pop="pareto-j18-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j18-p-1,j18-p-2,j18-p-3"></p><ul><li>Le médecin choisit l'antibiotique selon le lieu de soins, le terrain, une allergie caractérisée, la fonction rénale et les médicaments habituels, puis il réduit le spectre dès que l'agent est connu.</li><li>En ville, le patient sans comorbidité reçoit l'amoxicilline 1 g toutes les 8 heures ; le patient comorbide reçoit la co-amoxicilline 1 g (875/125 mg) toutes les 8 heures si sa clairance dépasse 30 mL/min.</li><li>À l'hôpital, la co-amoxicilline 2,2 g (2 000/200 mg) se donne toutes les 8 heures par voie intraveineuse, ou la ceftriaxone 2 g par jour en cas d'allergie sans anaphylaxie, avec la clarithromycine 500 mg toutes les 12 heures ou l'azithromycine 500 mg par jour.</li><li>Au-dessous de 30 mL/min, le comprimé de 1 g et le flacon de 2,2 g de co-amoxicilline sont exclus et la clarithromycine se donne à demi-dose ; la lévofloxacine diminue dès 50 mL/min après une première dose de 500 mg ; la moxifloxacine n'exige aucune adaptation.</li><li>La légionellose se traite par la lévofloxacine 500 mg deux fois par jour ou par l'azithromycine 500 mg par jour ; l'azithromycine orale au-delà de 3 jours sort de la posologie autorisée.</li><li>Swissmedic exclut depuis janvier 2018 les fluoroquinolones du traitement de première ligne des infections non compliquées. La clarithromycine inhibe fortement le CYP3A4 et allonge l'intervalle QT, comme l'azithromycine.</li><li>La ceftriaxone ne se mélange jamais à une solution calcique, et son solvant intramusculaire, qui contient de la lidocaïne, ne s'injecte jamais par voie intraveineuse.</li><li>Pendant la grossesse, les fluoroquinolones sont contre-indiquées, et la co-amoxicilline et la clarithromycine ne se donnent que si elles sont clairement nécessaires. La moxifloxacine est contre-indiquée en insuffisance hépatique de classe C de Child-Pugh.</li></ul></template>
