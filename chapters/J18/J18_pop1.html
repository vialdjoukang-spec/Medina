<template data-pop="j18-cap" data-title="Pneumonie communautaire"><p>Infection aiguë du parenchyme pulmonaire acquise hors d'un établissement de soins, ou présente dès l'admission. En pratique hospitalière, l'image d'une opacité nouvelle et le syndrome compatible étayent le diagnostic. Les seuils temporels administratifs ne remplacent pas l'analyse de l'incubation et des expositions.</p></template>
<template data-pop="j18-hap" data-title="Pneumonie nosocomiale"><p>Nouvelle infection du parenchyme pulmonaire survenant au moins 48 heures après l'hospitalisation, absente et non en incubation à l'arrivée. Risque de flore différente de la communauté ; prélever si possible et appliquer l'écologie et le protocole de l'hôpital. Une pneumonie liée à une ventilation invasive est une sous-catégorie distincte.</p></template>
<template data-pop="j18-macro" data-title="Macrophage alvéolaire"><p>Cellule immunitaire résidente qui phagocyte les microbes et déclenche le recrutement de neutrophiles. Dans une pneumonie, sa réponse aide à contenir l'agent, mais l'exsudat qu'elle entraîne peut réduire la ventilation alvéolaire.</p></template>
<template data-pop="j18-exsudat" data-title="Exsudat alvéolaire et consolidation"><p>Liquide inflammatoire, fibrine et cellules remplissent les alvéoles. Le territoire devient moins ventilé et plus dense à l'imagerie ; le son peut mieux se transmettre, d'où vibrations vocales renforcées ou souffle tubaire si les bronches restent ouvertes. Une matité peut également venir d'un épanchement pleural.</p></template>
<template data-pop="j18-shunt" data-title="Effet shunt intrapulmonaire"><p>Une unité pulmonaire perfusée mais non ou très peu ventilée laisse passer un sang insuffisamment oxygéné. La saturation baisse ; apporter de l'oxygène, traiter l'infection et soutenir la respiration selon gravité. Une absence de réponse suffisante à l'oxygène appelle une évaluation urgente.</p></template>
<template data-pop="j18-a-poumon" data-title="Antécédents pulmonaires"><p><b>Demander :</b> bronchopneumopathie, asthme, bronchectasies, chirurgie, oxygène, hospitalisation et germe antérieur. <b>Utilité :</b> estimer réserve respiratoire, risque de résistance et besoin d'admission. <b>Piège :</b> une colonisation ancienne ne prouve pas l'agent de l'épisode présent.</p></template>
<template data-pop="j18-a-immune" data-title="Défense immunitaire"><p><b>Demander :</b> asplénie, greffe, chimiothérapie, infection par le virus de l'immunodéficience humaine, doses et durée des corticostéroïdes. <b>Utilité :</b> agents opportunistes, seuil d'hospitalisation et vaccination. <b>Piège :</b> la fièvre et la radiographie peuvent être peu expressives sous immunosuppression.</p></template>
<template data-pop="j18-a-vaccin" data-title="Vaccinations respiratoires"><p><b>Documenter :</b> produit, date et indication des vaccinations grippe et pneumocoque, et autres vaccins selon l'âge et le risque. Une vaccination réduit le risque sans exclure la pneumonie. Plan de vaccination suisse 2026 de l'OFSP et de la Commission fédérale pour les vaccinations, publié le 23.02.2026 (version corrigée du 16.04.2026), et prise de position de cette commission sur les valences, mise à jour le 23.02.2026 : dès 65 ans, dose unique de vaccin conjugué 20-valent ou 21-valent chez la personne non vaccinée ou vaccinée par le vaccin 13-valent depuis au moins un an, dose unique de vaccin 21-valent après un vaccin 15-valent reçu depuis au moins un an ; personne à risque à partir de 2 ans : dose unique de vaccin conjugué, sauf schémas à plusieurs doses après une transplantation ou lors d'une infection par le VIH avec des lymphocytes CD4 inférieurs à 15 % (vaccin 20-valent ou 21-valent chez l'adulte à risque de 18 à 64 ans).</p></template>
<template data-pop="j18-a-asp" data-title="Aspiration"><p><b>Demander :</b> dysphagie, vomissement, perte de conscience, sédation, alcool, moment et position. Une pneumonite chimique peut survenir rapidement après l'aspiration ; l'infection bactérienne peut apparaître ensuite. Ne pas imposer à toute aspiration une antibiothérapie anaérobie prolongée.</p></template>
<template data-pop="j18-a-expo" data-title="Expositions infectieuses"><p><b>Demander :</b> contact avec personnes malades, saison, voyage, hôtel, bains ou systèmes d'eau chaude pour <i>Legionella</i>, contacts professionnels et animalier selon contexte. Ces indices orientent des tests ciblés ; ils ne remplacent pas une documentation microbiologique si la maladie est sévère.</p></template>
<template data-pop="j18-a-drug" data-title="Médicaments, allergies et rein"><p><b>Clarifier :</b> antibiotique reçu récemment, agent, date, efficacité, allergie immédiate versus effet digestif, et fonction rénale. <b>Conséquence :</b> éviter un échec prévisible, ajuster la dose et préserver les bêta-lactamines lorsqu'aucune vraie allergie grave n'existe.</p></template>
<template data-pop="j18-s-fievre" data-title="Fièvre et hypothermie"><p>Noter maximum mesuré, chronologie et antipyrétiques. La fièvre soutient l'hypothèse infectieuse sans en être une preuve ; hypothermie, absence de fièvre ou confusion peuvent accompagner une infection grave chez le sujet âgé ou immunodéprimé.</p></template>
<template data-pop="j18-s-toux" data-title="Toux et expectorations"><p>Préciser début, quantité, caractère nouveau et hémoptysie. Un crachat jaune ou vert reflète souvent des neutrophiles et n'identifie pas la bactérie ; un prélèvement valable est une expectoration profonde, non une simple salive.</p></template>
<template data-pop="j18-s-dysp" data-title="Dyspnée"><p>Comparer à la marche habituelle, au repos et à l'effort ; noter rapidité d'aggravation et besoin d'oxygène. Mesurer la saturation et la fréquence respiratoire. Une dyspnée brutale avec douleur doit aussi faire chercher embolie, œdème aigu ou pneumothorax.</p></template>
<template data-pop="j18-s-doul" data-title="Douleur thoracique pleurétique"><p>Douleur qui augmente avec la respiration ou la toux, souvent latéralisée si la plèvre pariétale est irritée. Vérifier la présence d'épanchement. Elle n'est pas spécifique : embolie pulmonaire et pneumothorax sont des alternatives urgentes.</p></template>
<template data-pop="j18-s-conf" data-title="Confusion et chutes"><p>Vérifier l'état mental antérieur avec l'entourage, la chronologie et les traitements sédatifs. La confusion nouvelle peut signaler hypoxémie, sepsis ou déshydratation ; chez le sujet âgé elle peut être le motif principal de consultation. Ne pas l'attribuer par défaut à la démence.</p></template>
<template data-pop="j18-s-hemo" data-title="Hémoptysie"><p>Quantifier le sang, rechercher détresse respiratoire et médicaments anticoagulants. Une petite strie peut accompagner une infection, mais une hémoptysie importante ou persistante impose de rechercher tumeur, embolie et autres causes.</p></template>
<template data-pop="j18-v-fr" data-title="Fréquence respiratoire"><p><b>Méthode :</b> compter pendant une minute entière au repos, si possible sans guider le rythme du patient. <b>Interprétation :</b> 12–20/min est un repère usuel chez l'adulte ; au moins 30/min signale une gravité dans les repères suisses et les scores. <b>Piège :</b> une valeur estimée ou copiée masque une tachypnée réelle.</p></template>
<template data-pop="j18-v-spo" data-title="Saturation périphérique en oxygène"><p><b>Méthode :</b> signal de pouls stable, documenter air ambiant ou débit d'oxygène, vérifier perfusion, mouvement, vernis et cohérence clinique. <b>Interprétation :</b> moins de 92 % est un signal d'alerte SSI dans l'infection respiratoire aiguë, la mesure étant documentée en air ambiant ou avec le débit d'oxygène. <b>Piège :</b> une saturation normale ne prouve pas l'absence d'infection ; la dysfonction liée à la ventilation nécessite parfois une gazométrie.</p></template>
<template data-pop="j18-v-ta" data-title="Pression artérielle et perfusion"><p><b>Méthode :</b> brassard adapté, répéter si mesure anormale ; examiner extrémités, recoloration, conscience, diurèse. <b>Seuil :</b> systolique &lt; 90 mmHg est un drapeau rouge SSI. <b>Piège :</b> une pression encore normale n'exclut pas un sepsis précoce, surtout chez une personne habituellement hypertendue.</p></template>
<template data-pop="j18-x-crep" data-title="Crépitants"><p><b>Technique :</b> écouter symétriquement bases, faces latérales et sommets durant plusieurs inspirations. <b>Valeur :</b> foyer nouveau de crépitants fins soutient une atteinte locale. <b>Piège :</b> œdème pulmonaire et atélectasie en produisent aussi ; leur absence n'exclut pas la pneumonie.</p></template>
<template data-pop="j18-x-mat" data-title="Percussion et vibrations vocales"><p><b>Technique :</b> comparer les deux côtés à la même hauteur ; palper les vibrations lors de la parole. <b>Interprétation :</b> matité avec vibrations augmentées suggère une consolidation ; matité avec vibrations diminuées évoque un épanchement pleural. <b>Piège :</b> épaisseur thoracique et faible coopération modifient le signe.</p></template>
<template data-pop="j18-x-souffle" data-title="Souffle tubaire"><p><b>Technique :</b> écouter les zones périphériques normalement ventilées, comparer au son trachéal. Un souffle bronchique périphérique peut traduire un parenchyme consolidé autour d'une bronche ouverte. <b>Piège :</b> il n'est pas constant et ne renseigne pas sur l'agent causal.</p></template>
<template data-pop="j18-curb" data-title="Scores CRB-65 et CURB-65"><p><b>CRB-65 :</b> confusion nouvelle ; fréquence respiratoire ≥ 30/min ; pression systolique &lt; 90 ou diastolique ≤ 60 mmHg ; âge ≥ 65 ans. Un point par item. <b>CURB-65 :</b> ajoute l'urée &gt; 7 mmol/L. Utiliser pour orienter, jamais comme seul critère : saturation, sepsis, comorbidités, autonomie et soutien social peuvent imposer l'admission malgré un score bas.</p></template>
<template data-pop="j18-img" data-title="Condensation à l'imagerie"><p>Opacité parenchymateuse nouvelle, parfois systématisée et accompagnée d'un bronchogramme aérien. Vérifier technique, comparaison aux clichés antérieurs et autres causes de densité : œdème, atélectasie, infarctus, cancer. L'échographie reconnaît des consolidations sous-pleurales ; le scanner se réserve à l'incertitude ou aux complications.</p></template>
<template data-pop="j18-d-amox" data-title="Amoxicilline"><p><b>Mécanisme :</b> bêta-lactamine qui inhibe les protéines liant la pénicilline et la synthèse de la paroi bactérienne. <b>Place SSI :</b> pneumonie communautaire bactérienne ambulatoire sans comorbidité pertinente. <b>Posologie :</b> 1 g par voie orale toutes les 8 heures, soit 3 g par jour, maximum journalier retenu par la SSI dans cette indication, durée habituelle de 5 jours ; dose maximale de l'information professionnelle suisse d'Amoxicillin Sandoz : 4 à 6 g par jour en 3 ou 4 prises. <b>Rein :</b> aucune adaptation au-dessus de 30 mL/min de clairance de la créatinine ; de 10 à 30 mL/min, au plus 500 mg toutes les 12 heures ; au-dessous de 10 mL/min et en dialyse péritonéale, au plus 500 mg toutes les 24 heures ; en hémodialyse, même schéma, plus 1 g par voie parentérale ou 750 mg par voie orale après chaque séance (information professionnelle suisse d'Amoxicillin Sandoz). <b>Foie, grossesse, allaitement :</b> aucune adaptation hépatique prévue ; prudence pendant la grossesse ; allaitement à éviter. <b>Preuve :</b> dans l'essai CAP-START (2015), chez l'adulte hospitalisé hors soins intensifs, la stratégie par bêtalactamine seule n'a pas été inférieure aux stratégies avec macrolide ou fluoroquinolone pour la mortalité à 90 jours. <b>Risques :</b> vraie hypersensibilité, éruption, diarrhée, colite à <i>Clostridioides difficile</i>. <b>Contre-indications :</b> hypersensibilité aux pénicillines ou aux céphalosporines ; mononucléose infectieuse et leucémie lymphatique, qui exposent à un exanthème dans plus de 90 % des cas. <b>Suivi :</b> amélioration clinique en 48–72 heures, tolérance et fonction rénale.</p></template>
<template data-pop="j18-d-coamox" data-title="Amoxicilline et acide clavulanique"><p>Le clavulanate inhibe certaines bêta-lactamases et élargit le spectre de l'amoxicilline, notamment vers les souches d'<i>Haemophilus influenzae</i> productrices de bêta-lactamase. <b>Formes suisses :</b> comprimé à 1 g = 875 mg d'amoxicilline et 125 mg d'acide clavulanique (Augmentin 1 g et génériques) ; comprimé à 625 mg = 500 mg et 125 mg ; flacon intraveineux à 2,2 g = 2 000 mg et 200 mg ; flacon à 1,2 g = 1 000 mg et 200 mg. <b>Posologie :</b> en ville avec comorbidité pertinente, 1 g par voie orale toutes les 8 heures (SSI), qui est aussi la dose maximale de l'information professionnelle suisse d'Augmentin ; à l'hôpital, 2,2 g par voie intraveineuse toutes les 8 heures (SSI), dose usuelle et non maximale : les informations professionnelles suisses des formes intraveineuses (Co-Amoxicillin Labatec, Co-Amoxi-Mepha i.v.) admettent au plus six perfusions de 2,2 g par 24 heures, jamais plus souvent que toutes les 4 heures, soit 200 mg d'acide clavulanique par perfusion et 1 200 mg par 24 heures. <b>Rein :</b> comprimé à 1 g et flacon à 2,2 g exclus au-dessous de 30 mL/min de clairance ; de 10 à 30 mL/min, 625 mg toutes les 12 heures par voie orale ou 1,2 g puis 600 mg toutes les 12 heures par voie intraveineuse ; au-dessous de 10 mL/min, les mêmes doses toutes les 24 heures ; en hémodialyse, dose supplémentaire (informations professionnelles suisses). <b>Foie, grossesse, allaitement :</b> prudence en cas de trouble hépatique ; pendant la grossesse, seulement si elle est clairement nécessaire ; pas d'allaitement pendant le traitement. <b>Preuve :</b> la stratégie par bêtalactamine seule de l'essai CAP-START (2015) admettait cette association. <b>Risques :</b> diarrhée, hépatite cholestatique parfois retardée. <b>Contre-indications :</b> hypersensibilité aux pénicillines, aux céphalosporines ou à l'acide clavulanique, antécédent d'ictère ou d'atteinte hépatique imputé à l'association, mononucléose infectieuse, leucémie lymphatique.</p></template>
<template data-pop="j18-d-cef" data-title="Ceftriaxone"><p>Céphalosporine parentérale de troisième génération active sur de nombreux agents de pneumonie communautaire, mais insuffisante pour <i>Mycoplasma</i> et <i>Legionella</i>. <b>Posologie :</b> 2 g par voie intraveineuse une fois par jour dans l'alternative de la SSI hospitalière en cas d'allergie aux pénicillines ; 1 à 2 g une fois par jour selon l'information professionnelle, au plus 4 g par jour. <b>Rein :</b> aucune adaptation si la fonction hépatique est normale ; au-dessous de 10 mL/min de clairance et en dialyse, au plus 2 g par jour, sans dose supplémentaire après la séance (information professionnelle suisse de Rocephin). <b>Foie, grossesse, allaitement :</b> aucune adaptation hépatique si la fonction rénale est normale ; indication strictement posée pendant la grossesse, surtout au premier trimestre ; allaitement à éviter. <b>Preuve :</b> céphalosporine de troisième génération admise dans la stratégie par bêtalactamine seule de l'essai CAP-START (2015). <b>Risques :</b> pseudo-lithiase biliaire, colite à <i>Clostridioides difficile</i>, hypersensibilité. <b>Contre-indications :</b> hypersensibilité à la ceftriaxone ou à une autre céphalosporine selon l'information professionnelle suisse, qui demande la prudence après une hypersensibilité à une autre bêtalactamine ; le résumé européen harmonisé y ajoute l'hypersensibilité grave, par exemple une anaphylaxie, à une autre bêtalactamine. Voie intramusculaire, dont le solvant contient de la lidocaïne : hypersensibilité à la lidocaïne ou à un autre anesthésique local de type anilide, troubles de la conduction cardiaque, insuffisance cardiaque aiguë décompensée ; solution contenant de la lidocaïne jamais par voie intraveineuse. Nouveau-né : prématuré jusqu'à 41 semaines d'âge postmenstruel, hyperbilirubinémie (information professionnelle suisse de Rocephin, juin 2025). <b>Calcium :</b> ne pas mélanger la ceftriaxone à une solution contenant du calcium, ni l'administrer simultanément avec une perfusion calcique ; contre-indication formelle chez le nouveau-né de 28 jours ou moins qui a besoin, ou aura probablement besoin, d'une perfusion calcique. <b>Surveillance :</b> type réel d'allergie, tolérance biliaire, indication d'une couverture des agents atypiques.</p></template>
<template data-pop="j18-d-macro" data-title="Macrolides"><p>Ils se lient à la sous-unité ribosomique 50S et couvrent les agents atypiques (<i>Mycoplasma</i>, <i>Legionella</i>, <i>Chlamydia</i>). Leur ajout n'est pas automatique en ville. <b>Posologie :</b> clarithromycine 500 mg par voie orale ou intraveineuse toutes les 12 heures (SSI), au plus 1 g par jour, voie intraveineuse limitée à 5 jours (informations professionnelles suisses de Klacid et de Klacid i.v.) ; azithromycine 500 mg par voie orale une fois par jour (SSI), soit en ville 3 jours et 1,5 g au total selon l'information professionnelle suisse de Zithromax. <b>Durée à l'hôpital :</b> en association à la bêtalactamine, 24 à 72 heures dans la fiche SSI, plus longtemps en cas d'admission en soins intensifs, de légionellose suspectée ou prouvée, ou d'agent atypique identifié ; dans la forme sévère, le groupe de travail des recommandations 2023 de l'ERS, de l'ESICM, de l'ESCMID et de l'Asociación Latinoamericana de Tórax juge raisonnable une durée de 3 à 5 jours, notamment dans une stratégie de désescalade. <b>Rein :</b> clarithromycine, moitié de la dose au-dessous de 30 mL/min de clairance, durée totale de 14 jours au plus ; azithromycine, aucune adaptation pour un débit de filtration glomérulaire de 10 à 80 mL/min, emploi prudent au-dessous de 10 mL/min (informations professionnelles suisses). <b>Foie, grossesse, allaitement :</b> clarithromycine, prudence en insuffisance hépatique, seulement si elle est clairement nécessaire pendant la grossesse, pas d'allaitement jusqu'au lendemain de la dernière dose ; azithromycine, même dose avec prudence en insuffisance hépatique légère à modérée, seulement si elle est cliniquement nécessaire pendant la grossesse, allaitement à éviter. <b>Preuve :</b> l'essai suisse de Garin et al. (2014 ; 580 adultes immunocompétents de 6 hôpitaux suisses) n'a pas démontré la non-infériorité de la bêtalactamine seule face à l'association avec un macrolide pour la stabilité clinique au septième jour chez l'adulte hospitalisé de gravité modérée ; les patients infectés par un agent atypique se stabilisaient plus tard sous monothérapie. Les recommandations européennes et latino-américaines de 2023 déjà citées suggèrent d'ajouter un macrolide, plutôt qu'une fluoroquinolone, à la bêtalactamine dans la forme sévère. <b>Risques :</b> allongement du QT, torsades de pointes, troubles digestifs, sélection de résistances (pneumocoque résistant aux macrolides) ; la clarithromycine inhibe fortement le CYP3A4. <b>Contre-indications de la clarithromycine :</b> hypersensibilité connue aux macrolides ou à un excipient ; association à la simvastatine, à la lovastatine, aux alcaloïdes de l'ergot, à la colchicine, au ticagrélor, à la ranolazine, à l'ivabradine, au midazolam par voie orale, à la lomitapide, à la dompéridone, à la quétiapine ou au pimozide ; QT long ou antécédent de tachycardie ventriculaire ; hypokaliémie ou hypomagnésémie ; insuffisance hépatique sévère associée à une insuffisance rénale (information professionnelle suisse de Klacid). <b>Surveillance :</b> électrocardiogramme en présence d'un facteur de risque rythmique, kaliémie, liste complète des médicaments.</p></template>
<template data-pop="j18-d-fq" data-title="Fluoroquinolones respiratoires"><p>Elles inhibent les topoisomérases bactériennes (gyrase et topoisomérase IV). <b>Place :</b> alternative réservée, par exemple en cas d'allergie grave documentée aux bêtalactamines ou de légionellose ; Swissmedic a restreint le 29.01.2018 leur emploi dans les infections bactériennes non compliquées aux situations où les autres antibiotiques ne conviennent pas ou ont échoué, restriction rappelée le 04.02.2019 ; la fiche SSI les place en alternative lors d'une allergie aux pénicillines en ville, d'une allergie grave aux bêtalactamines à l'hôpital, et dans la légionellose. Éviter leur prescription empirique routinière lorsque l'amoxicilline répond à l'indication. <b>Posologie :</b> lévofloxacine 500 mg par voie orale ou intraveineuse une ou deux fois par jour pendant 7 à 14 jours, au plus 1 g par jour (légionellose : 500 mg deux fois par jour) ; moxifloxacine 400 mg une fois par jour par voie orale ou intraveineuse, dose à ne pas dépasser (informations professionnelles suisses de Tavanic et d'Avalox ; celle de Tavanic juge encore insuffisante l'expérience dans la pneumonie à <i>Legionella</i>). <b>Rein :</b> lévofloxacine, après une première dose de 500 mg, 250 mg de 20 à 50 mL/min et 125 mg de 10 à 19 mL/min à l'intervalle habituel, 125 mg toutes les 24 heures au-dessous de 10 mL/min, dialyse comprise (information professionnelle suisse de Tavanic) ; moxifloxacine sans adaptation, dialyse comprise (information professionnelle suisse d'Avalox). <b>Foie :</b> lévofloxacine sans adaptation ; moxifloxacine contre-indiquée en insuffisance hépatique sévère (Child-Pugh C) ou si les transaminases dépassent cinq fois la limite supérieure. <b>Preuve :</b> dans l'essai CAP-START (2015), la stratégie par fluoroquinolone seule n'a pas fait mieux que la bêtalactamine seule (mortalité à 90 jours de 8,8 % contre 9,0 %). <b>Risques :</b> tendinite et rupture tendineuse, surtout chez le sujet âgé, sous corticostéroïdes ou après transplantation ; neuropathie périphérique ; effets neuropsychiatriques ; allongement du QT ; dysglycémies ; anévrisme et dissection aortiques (mise en garde de Swissmedic du 04.02.2019) ; régurgitation valvulaire (communication publiée par Swissmedic le 18.02.2021). <b>Contre-indications :</b> hypersensibilité aux quinolones, âge inférieur à 18 ans, antécédent de tendinopathie sous fluoroquinolone, grossesse et allaitement ; lévofloxacine : épilepsie ; moxifloxacine : QT long, trouble électrolytique dont une hypokaliémie non corrigée, bradycardie significative, insuffisance cardiaque significative à fraction d'éjection réduite, arythmie symptomatique, association à d'autres médicaments qui allongent le QT, insuffisance hépatique sévère et, faute de données, neutropénie, infection par le VIH, autre immunodépression ou infection de prothèse (informations professionnelles suisses). <b>Interactions :</b> chélation par les antiacides, le fer, le calcium ou le zinc, à prendre à distance de la fluoroquinolone.</p></template>
<template data-pop="pareto-j18-clinique" data-title="Pareto — Clinique"><p class="ratio" data-cover="j18-0,j18-1,j18-2,j18-3,j18-4,j18-5,j18-6"></p><ul><li>Question essentielle : infection parenchymateuse, gravité, lieu de soin.</li><li>Communautaire : début hors de l'hôpital ou dans les 48 premières heures ; nosocomiale : au moins 48 heures après l'admission, autre écologie bactérienne.</li><li>Périmètre : J13, J14, J15, J18 ; virales (J12) vers le cours J09 ; <i>Chlamydia</i> (J16.0) avec les agents atypiques ; autres agents précisés (J16.8) et J17 : cours de l'agent ou de la maladie sous-jacente ; nosocomiales et inhalation hors champ.</li><li>« Typique » ou « atypique » ne prouve pas l'agent ; un infiltrat n'est pas toujours infectieux.</li><li>Normal : alvéole aérée, ventilation et perfusion appariées ; pneumonie : exsudat, perfusion maintenue, effet shunt, hypoxémie.</li><li>Pneumocoque en tête ; <i>Legionella</i> évoquée par diarrhée, confusion et hyponatrémie.</li><li>Compter respiration, saturation en air ambiant, pression, état mental.</li><li>Urgence : fréquence respiratoire ≥ 30/min, saturation &lt; 92 %, systolique &lt; 90 mmHg, confusion ; la SSI ajoute altération marquée de l'état général, hémoptysie, stridor, maladie pulmonaire ou immunodéficience sévères.</li><li>Une présentation atypique ou sans fièvre n'exclut pas la pneumonie chez la personne âgée.</li></ul></template>
<template data-pop="pareto-j18-urgence" data-title="Pareto — Diagnostic, gravité, traitement et critères"><p class="ratio" data-cover="j18-7,j18-8,j18-9,j18-10,j18-11,j18-12"></p><ul><li>Diagnostic à l'hôpital : signes d'infection respiratoire basse aiguë et opacité nouvelle à l'imagerie, sans autre explication ; en ville stable, pas de radiographie systématique.</li><li>Toux aiguë ambulatoire avec signe de probabilité : protéine C réactive &lt; 50 mg/L, traitement symptomatique ; 50 à 100, décision partagée ; ≥ 100, antibiotique envisagé.</li><li>Différentiels urgents : embolie pulmonaire, œdème cardiogénique, pneumothorax ; symptômes prolongés : cancer, tuberculose.</li><li>Hypoxémie ou confusion : soins urgents, sans attendre le nom du germe.</li><li>CRB-65 : confusion, fréquence respiratoire ≥ 30/min, systolique &lt; 90 ou diastolique ≤ 60 mmHg, âge ≥ 65 ans ; 0 ville possible, 1 à 2 hôpital à discuter, 3 à 4 hôpital urgent ; CURB-65 ajoute l'urée &gt; 7 mmol/L ; SSI : hospitalisation à envisager dès 1 point (sauf âge seul) et, quel que soit le score, si saturation artérielle &lt; 90 % en air ambiant ou besoin d'oxygène.</li><li>Sévère (ATS/IDSA 2007, repris en 2019) : 1 critère majeur (ventilation invasive, vasopresseurs) ou ≥ 3 des 9 critères mineurs ; recommandations européennes et latino-américaines de 2023 : admission en soins intensifs.</li><li>Ville sans comorbidité : amoxicilline 1 g toutes les 8 heures ; avec comorbidité : co-amoxicilline 1 g toutes les 8 heures ; hôpital : co-amoxicilline 2,2 g toutes les 8 heures par voie intraveineuse (allergie : ceftriaxone 2 g par jour) ± macrolide, macrolide ajouté dans la forme sévère ; macrolide limité à 24 à 72 heures (SSI), sauf soins intensifs, légionellose ou agent atypique ; 3 à 5 jours jugés raisonnables dans la forme sévère par les recommandations européennes et latino-américaines de 2023.</li><li>Réévaluer cliniquement à 48–72 heures et à toute aggravation.</li><li>Durée simple de 5 jours, arrêt après 2 à 3 jours de stabilité ; forme sévère 5 à 7 jours (SSI) ; légionellose 7 à 10 jours ; complications : plus long.</li><li>Stabilité : température ≤ 37,8 °C, pouls ≤ 100/min, fréquence respiratoire ≤ 24/min, systolique ≥ 90 mmHg, saturation ≥ 90 %, alimentation et état mental habituels.</li><li>Corticostéroïdes : jamais en routine dans la forme non sévère, sauf obstruction bronchique qui s'aggrave ; forme sévère : indiqués selon la SSI, par exemple hydrocortisone 200 mg par jour pendant 4 à 8 jours (CAPE COD favorable, ESCAPe et REMAP-CAP sans bénéfice démontré).</li><li>Radiographie de contrôle non systématique ; vaccination pneumococcique notamment dès 65 ans.</li></ul></template>
<template data-pop="pareto-j18-examens" data-title="Pareto — Examens"><p class="ratio" data-cover="j18-e-1,j18-e-2,j18-e-3,j18-e-4,j18-e-5"></p><ul><li>Imagerie et signes fondent le diagnostic chez l'hospitalisé ; pas de radiographie automatique en ville stable ; aucun examen microbiologique n'est une référence universelle.</li><li>Radiographie : condensation avec bronchogramme aérien ; fausse opacité par inspiration insuffisante ou rotation ; image peu expressive très tôt ou chez le patient déshydraté.</li><li>Oxymétrie et gazométrie mesurent le retentissement, sans identifier le germe ; lactate si choc présumé.</li><li>Protéine C réactive élevée : inflammation, ni agent ni foyer ; sodium bas et créatinine élevée : penser légionellose si le tableau concorde.</li><li>Microbiologie : aucune en routine en ville ; à l'hôpital, selon la SSI, deux paires d'hémocultures, antigènes urinaires du pneumocoque et de <i>Legionella</i>, expectoration si elle est traitée en moins de 4 heures ; chez le malade sévère, hémocultures prélevées avant l'antibiotique si cela n'en retarde pas l'administration ; un résultat négatif n'exclut pas l'agent.</li><li>L'opacité régresse après la clinique : ne pas prolonger l'antibiotique pour l'image.</li></ul></template>
<template data-pop="pareto-j18-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="j18-s-anatomie,j18-s-histologie,j18-s-physiologie,j18-s-immunologie"></p><ul><li>Bronche principale droite plus verticale : aspiration souvent à droite, selon la position.</li><li>Pleurésie pariétale : douleur latéralisée à l'inspiration.</li><li>Pneumocyte I pour l'échange, pneumocyte II pour le surfactant et la réparation.</li><li>Alvéole remplie + perfusion maintenue = effet shunt, peu corrigé par l'oxygène seul.</li><li>Asplénie : risque de pneumocoque invasif ; bêtalactamines inactives sur les virus.</li><li>Barrière innée, neutrophiles, inflammation : relier clinique et imagerie.</li></ul></template>
<template data-pop="pareto-j18-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j18-p-1,j18-p-2,j18-p-3"></p><ul><li>Choix selon gravité, terrain, allergie caractérisée et fonction rénale.</li><li>Ville sans comorbidité : amoxicilline 1 g toutes les 8 heures ; avec comorbidité : co-amoxicilline 1 g (875/125 mg) toutes les 8 heures, si clairance &gt; 30 mL/min.</li><li>Hôpital : co-amoxicilline 2,2 g (2 000/200 mg) toutes les 8 heures par voie intraveineuse ; allergie : ceftriaxone 2 g par jour ; ± clarithromycine 500 mg toutes les 12 heures ou azithromycine 500 mg par jour.</li><li>Rein : amoxicilline au plus 500 mg deux fois par jour de 10 à 30 mL/min ; clarithromycine réduite de moitié au-dessous de 30 mL/min ; lévofloxacine réduite au-dessous de 50 mL/min ; moxifloxacine sans adaptation ; ceftriaxone au plus 2 g par jour au-dessous de 10 mL/min.</li><li>Légionellose : lévofloxacine 500 mg deux fois par jour ou azithromycine 500 mg par jour, 7 à 10 jours ; azithromycine orale au-delà de 3 jours hors posologie autorisée.</li><li>Fluoroquinolones réservées (Swissmedic, 29.01.2018) ; clarithromycine : CYP3A4 et QT.</li><li>Ceftriaxone : jamais mélangée à une solution calcique ; solvant intramusculaire contenant de la lidocaïne exclu en cas de trouble de la conduction cardiaque ou d'insuffisance cardiaque aiguë décompensée, et jamais injecté par voie intraveineuse.</li><li>Grossesse : fluoroquinolones contre-indiquées ; co-amoxicilline et clarithromycine seulement si clairement nécessaires ; ceftriaxone sur indication stricte. Foie : moxifloxacine contre-indiquée si Child-Pugh C ; clarithromycine contre-indiquée si insuffisance hépatique sévère avec atteinte rénale.</li><li>Réduire le spectre et arrêter au bon moment selon stabilité.</li></ul></template>
