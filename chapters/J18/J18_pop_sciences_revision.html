<template data-pop="j18-ventilation-perfusion" data-title="Shunt et espace mort : ce qui manque"><p>Le rapport ventilation-perfusion compare, région par région, l’air qui atteint les alvéoles au sang qui traverse leurs capillaires. Une région perfusée mais non ventilée réalise un shunt : son sang repart sans avoir été oxygéné. Une région ventilée mais mal perfusée réalise un espace mort : l’air y entre et en sort sans rencontrer de sang.</p><p>Dans une pneumonie consolidée, c’est l’air qui manque, et l’hypoxémie répond mal à l’oxygène lorsque le shunt est étendu. Dans une embolie pulmonaire, c’est le sang qui manque dans les territoires ventilés. Un même patient associe souvent des régions des deux types, si bien que la réponse à l’oxygène dépend de leur répartition.</p><div class="key"><b>À retenir.</b> Le médecin identifie d’abord ce qui manque, l’air ou le sang, puis il interprète la gazométrie et la tolérance respiratoire.</div></template>
