<section class="ilot" id="j18-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Confirmer une pneumonie ne suffit pas : il faut mesurer sa gravité, choisir le lieu de soins et commencer le traitement adapté.</p>
<p><b>Le cas fil rouge.</b> Madame R. a 71 ans. Elle a un diabète de type 2 traité par metformine et une hypertension artérielle traitée par amlodipine. Elle vit seule et reste autonome. Un soir de janvier, sa fille l'amène aux urgences, car sa mère a depuis trois jours de la fièvre, une toux nouvelle et une dyspnée.</p>
<p>À l'accueil, sa fréquence respiratoire est de 31 par minute, sa saturation en air ambiant de 89 % et sa pression artérielle de 104/66 mmHg. Elle paraît confuse : elle ne sait plus quel jour on est. Chacun de ces chiffres a une signification précise, que les sections 6 et 8 expliquent.</p>
<p><b>La question clinique.</b> Le médecin doit répondre sans tarder à une question en quatre parties : <b>une infection du parenchyme pulmonaire explique-t-elle le tableau, quelle est sa gravité, où faut-il soigner la patiente et quel traitement faut-il commencer sans retard ?</b> Ces quatre parties ne se traitent pas l'une après l'autre. Chez une patiente hypoxémique et confuse, le médecin donne de l'oxygène et recherche un sepsis avant même que l'imagerie ait confirmé la pneumonie. L'ordre du cours suit la logique de la compréhension ; l'ordre des gestes suit celle de l'urgence.</p>
<p>Le tableau suivant relie chaque partie de la question à ce que le médecin doit établir et aux sections qui l'enseignent.</p>
<table class="t"><tr><th>Question</th><th>Ce que le médecin doit établir</th><th>Sections</th></tr><tr><td>Est-ce une pneumonie ?</td><td>Il cherche un tableau d'infection respiratoire basse aiguë et, à l'hôpital, une opacité nouvelle qu'aucune autre cause n'explique.</td><td>1, 5, 6, 7 et 12</td></tr><tr><td>Quelle est sa gravité ?</td><td>Il mesure les signes vitaux, cherche les dysfonctions d'organes et calcule les scores CRB-65 ou CURB-65 et relève les critères de surveillance intensifiée de la SSI.</td><td>6, 7, 8 et 12</td></tr><tr><td>Où faut-il soigner ?</td><td>Il choisit entre le domicile, le service de médecine, les soins intermédiaires et les soins intensifs, selon la gravité, les comorbidités et l'entourage.</td><td>7, 8 et 11</td></tr><tr><td>Quel traitement faut-il commencer ?</td><td>Il donne l'oxygène, choisit l'antibiotique empirique adapté au lieu de soins et au terrain, puis fixe la réévaluation et la durée.</td><td>9, 10 et 11</td></tr></table>
<p>Ce tableau se lit de haut en bas comme un plan de travail. L'erreur fréquente consiste à s'arrêter à la première ligne : une pneumonie confirmée ne dit encore rien de sa gravité ni du lieu de soins. Chez Madame R., la deuxième ligne s'impose d'emblée, car sa fréquence respiratoire et sa confusion signalent déjà une forme potentiellement grave.</p>
<p><b>Les objectifs.</b> À la fin du chapitre, le médecin assistant maîtrise cinq compétences, qui correspondent aux décisions qu'il prendra au lit du malade.</p>
<ul><li>Il reconnaît une pneumonie communautaire probable et il distingue les maladies graves qui l'imitent, comme l'embolie pulmonaire et l'œdème pulmonaire cardiogénique.</li><li>Il mesure la gravité par les signes vitaux, les dysfonctions d'organes et les scores validés, et il en déduit le lieu de soins.</li><li>Il demande seulement les examens qui changent la conduite, en ville comme à l'hôpital.</li><li>Il prescrit l'antibiothérapie empirique recommandée en Suisse par la SSI, il l'adapte au terrain et il la réévalue à 48–72 heures.</li><li>Il fixe la durée du traitement sur des critères de stabilité et il organise la prévention après l'épisode.</li></ul>
<p><b>Les prérequis.</b> Trois notions rendent la suite compréhensible. La première est l'<button class="w" data-k="j18-pa-pre-anat">anatomie des voies aériennes, des lobes et de la plèvre (rappel)</button>, qui explique où se trouvent les signes. La deuxième est la <button class="w" data-k="j18-pa-pre-gaz">relation entre pression partielle en oxygène et saturation (rappel)</button>, qui explique pourquoi une saturation de 89 % est déjà un signal grave. La troisième est la <button class="w" data-k="j18-pa-sepsis">définition actuelle du sepsis (Sepsis-3, qSOFA et choc septique)</button>, car une pneumonie grave peut s'accompagner des dysfonctions d'organes qui définissent le sepsis.</p>
<p>Les pneumonies nosocomiales, les pneumonies d'inhalation et les pneumonies de l'immunodéprimé sévère sont signalées ici pour orienter le triage. Leur traitement relève d'autres protocoles, parce que leurs agents et leurs résistances diffèrent de ceux de la pneumonie communautaire.</p>
<div class="key"><b>À retenir.</b> La pneumonie est une infection aiguë du parenchyme pulmonaire. Le diagnostic associe des symptômes, des signes respiratoires, un contexte et, à l'hôpital, une opacité nouvelle à l'imagerie. Aucun test biologique isolé ne l'affirme ni ne l'exclut. Chez Madame R., la priorité initiale reste l'oxygénation et la recherche d'un sepsis.</div></section>
<section class="ilot" id="j18-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>Distinguer la pneumonie des autres infections respiratoires précède le choix du traitement. Le lieu d’acquisition, communautaire ou nosocomial, oriente les germes et les antibiotiques. Les qualificatifs « typique » et « atypique » trompent sur l'agent, mais ils gardent un sens pharmacologique précis.</p>
<h3>1.1 Ce qu'est une pneumonie</h3>
<p>Le poumon comprend deux compartiments. Les voies aériennes conduisent l'air, de la trachée jusqu'aux bronchioles terminales. Le parenchyme, formé des alvéoles et du tissu qui les entoure, assure les échanges gazeux. Une bronchite aiguë enflamme les voies aériennes, alors qu'une pneumonie remplit les alvéoles d'un exsudat inflammatoire. Cette différence explique que la pneumonie altère l'oxygénation et produise une opacité à l'imagerie, ce que la bronchite ne fait pas.</p>
<p>La Société suisse d'infectiologie (SSI) définit la pneumonie par deux éléments réunis. Le premier est un infiltrat pulmonaire nouveau, visible à la radiographie, à l'échographie ou à la tomodensitométrie. Le second est un tableau clinique d'infection respiratoire basse : fièvre, frissons, toux, expectoration, dyspnée, tachypnée ou douleur thoracique. La fiche précise que l'infiltrat ne doit pas avoir d'autre explication.</p>
<p>L'exigence d'une image s'explique par la faible fiabilité de la clinique seule. Dans une étude européenne de soins primaires portant sur 2810 adultes qui toussaient, 140 avaient une pneumonie visible à la radiographie. Les généralistes n'en avaient reconnu cliniquement que 29 % (van Vugt et al., European Respiratory Journal 2013). Sans image, le diagnostic reste donc une probabilité.</p>
<p>En médecine de premier recours, la radiographie n'est pas toujours disponible le jour même. La British Thoracic Society admet alors un diagnostic clinique lorsque quatre conditions sont réunies : des symptômes d'infection respiratoire basse, des signes focaux nouveaux à l'examen, au moins un signe général et l'absence d'autre explication. La protéine C réactive et l’évolution affinent ce diagnostic probabiliste (section 7).</p>
<div class="key"><b>À retenir.</b> Une pneumonie associe un infiltrat pulmonaire nouveau et des symptômes d'infection respiratoire basse, sans autre explication. En ville, un diagnostic clinique est admis faute d'image, mais il reste une probabilité que le médecin réévalue.</div>
<h3>1.2 Pneumonie communautaire ou nosocomiale</h3>
<p>Le lieu où l'infection a été acquise prédit les germes en cause. La <button class="w" data-k="j18-cap">pneumonie communautaire (définition et limites)</button> est acquise hors de l'hôpital ou commence au plus tard 48 heures après l'admission. La SSI y inclut les résidents des établissements de soins. Elle en exclut les patients atteints d'une <button class="w" data-k="j18-a-immune">immunodépression sévère (liste de la SSI et conduite)</button>, dont les agents et les traitements diffèrent.</p>
<p>La <button class="w" data-k="j18-hap">pneumonie nosocomiale (autre écologie bactérienne)</button> apparaît au moins 48 heures après l'admission et n'était pas en incubation à l'arrivée. Le délai de 48 heures sert à écarter une infection déjà en incubation à l'admission : une pneumonie qui débute plus tard a probablement été acquise à l'hôpital, où la flore et les résistances diffèrent. La pneumonie acquise sous ventilation mécanique invasive forme une catégorie distincte, avec ses propres protocoles.</p>
<p>Une hospitalisation récente brouille cette frontière. La SSI demande d'évaluer individuellement le risque de germe nosocomial ou multirésistant lorsque le patient a été hospitalisé dans les six mois précédents. Ces facteurs de risque de résistance sont détaillés en section 4.</p>
<div class="key"><b>À retenir.</b> La limite de 48 heures après l'admission sépare la pneumonie communautaire de la pneumonie nosocomiale. Elle compte parce que les germes, leurs résistances et donc les antibiotiques changent de part et d'autre.</div>
<h3>1.3 Les mots « typique », « atypique » et « aspiration »</h3>
<p>L'usage oppose une pneumonie « typique », fébrile, productive et lobaire, à une pneumonie « atypique », à toux sèche, à signes extrapulmonaires et à infiltrats diffus. La British Thoracic Society recommande depuis 2009 d'abandonner cette opposition, parce que la clinique ne prédit pas l'agent causal avec précision. Le pneumocoque peut donner des infiltrats diffus, et <i>Mycoplasma pneumoniae</i> peut produire une condensation lobaire.</p>
<p>La <button class="w" data-k="j18-pa-typ">notion d'agent « atypique » (sens exact et conséquence thérapeutique)</button> reste pourtant utile pour une autre raison. Ces agents n'ont pas de paroi accessible aux bêtalactamines ou vivent à l'intérieur des cellules. Une amoxicilline ne les atteint donc pas, alors qu'un macrolide, une tétracycline ou une fluoroquinolone les atteignent.</p>
<p>Le terme « pneumonie d'aspiration » pose un problème voisin. L'inhalation de contenu gastrique peut provoquer rapidement une pneumonite chimique, sans bactérie. Une pneumonie bactérienne peut aussi se développer chez un patient qui aspire des sécrétions oropharyngées colonisées. Ces deux situations n'ont pas la même indication antibiotique, comme l'explique la fenêtre sur la <button class="w" data-k="j18-pa-inhal">pneumopathie d'inhalation (pneumonite chimique ou pneumonie bactérienne)</button>.</p>
<div class="key"><b>À retenir.</b> Un profil clinique « typique » ou « atypique » ne désigne pas l'agent causal. Le mot « atypique » garde un sens pharmacologique : il désigne des agents que les bêtalactamines ne couvrent pas.</div>
<h3>1.4 Classer selon la gravité et le lieu de soins</h3>
<p>En pratique, le médecin classe d'abord la pneumonie selon le lieu où elle sera soignée, car ce lieu détermine les examens et l'antibiotique. Le tableau suivant présente cette classification pratique, avec la mortalité observée dans les séries britanniques réunies en 2009, qui justifie l'intensité de la conduite.</p>
<table class="t"><tr><th>Catégorie pratique</th><th>Conduite</th><th>Mortalité observée</th></tr><tr><td>Communautaire peu grave, soignée à domicile</td><td>Le diagnostic et le traitement sont le plus souvent ambulatoires. Le médecin vérifie que le retour à domicile est sûr et prévoit une réévaluation à 48–72 heures.</td><td>Elle reste inférieure à 1 % chez les patients britanniques soignés en ville.</td></tr><tr><td>Communautaire hospitalisée</td><td>Le médecin demande une imagerie, mesure l'oxygénation, recherche un sepsis et choisit l'antibiotique selon la gravité et le terrain.</td><td>Elle varie de 5,7 à 14 % dans les séries britanniques de patients hospitalisés.</td></tr><tr><td>Communautaire sévère</td><td>L'équipe de soins intensifs évalue le patient, soutient les organes défaillants et recherche l'agent et les complications.</td><td>Elle dépasse 30 % chez les patients britanniques admis en soins intensifs.</td></tr><tr><td>Nosocomiale ou acquise sous ventilation</td><td>Le médecin applique l'écologie et le protocole de son hôpital et obtient un prélèvement respiratoire.</td><td>Ce cours ne la traite pas ; ses germes résistent plus souvent aux traitements de la pneumonie communautaire.</td></tr></table>
<p>Ce tableau se lit de haut en bas comme une échelle de gravité croissante. L'erreur fréquente consiste à placer un patient dans une ligne sur la seule foi d'un score, sans tenir compte de l'oxygénation, des comorbidités et de l'entourage. Madame R. appartient au moins à la deuxième ligne, et sa confusion associée à sa tachypnée fait envisager la troisième ; la section 8 tranchera.</p>
<div class="key"><b>À retenir.</b> La catégorie pratique d'une pneumonie est d'abord un lieu de soins. Ce lieu découle de la gravité, du terrain et du contexte social, jamais d'un score isolé.</div>
<h3>1.5 Le périmètre de ce cours</h3>
<p>Le cours traite la pneumonie communautaire bactérienne de l'adulte, que l'agent soit le pneumocoque, <i>Haemophilus influenzae</i>, une autre bactérie comme <i>Mycoplasma pneumoniae</i>, ou qu'il reste inconnu. Les pneumonies virales sont abordées lorsqu'elles modifient la conduite, par exemple la grippe pendant la saison hivernale ; leur développement complet relève du cours consacré à la grippe.</p>
<p>La pneumonie à <i>Chlamydia pneumoniae</i> est abordée ici avec les agents atypiques couverts par les macrolides. Les pneumonies qui compliquent une autre maladie, comme la varicelle, la rougeole, l'aspergillose ou la toxoplasmose, relèvent du cours de cette maladie. Les pneumonies nosocomiales et les pneumonies d'inhalation sont hors du champ de ce cours ; elles ne sont évoquées que pour orienter le triage.</p>
<div class="trap"><span class="k">Piège</span>Un infiltrat radiologique n'est pas toujours infectieux. Un œdème pulmonaire, un infarctus pulmonaire compliquant une embolie, une hémorragie alvéolaire ou un cancer produisent aussi une opacité. C'est pourquoi la définition de la SSI exige un infiltrat qu'aucun autre diagnostic n'explique.</div>
<div class="key"><b>À retenir.</b> Le diagnostic de pneumonie communautaire exige un infiltrat nouveau, des symptômes compatibles et l'absence d'autre explication. Il se précise ensuite par le lieu d'acquisition, qui oriente les germes, et par le lieu de soins, qui découle de la gravité.</div></section>
<section class="ilot" id="j18-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La fréquence des pneumonies et leur gravité éclairent le poids de l’âge et des comorbidités dans les scores pronostiques. Les données suisses disponibles sont complétées par les données européennes lorsque les estimations nationales manquent.</p>
<h3>2.1 Les données suisses</h3>
<p>La Suisse ne dispose d'aucune estimation contemporaine de l'incidence des pneumonies soignées en ville. Les auteurs de l'analyse nationale publiée en 2019 le soulignent : aucune donnée récente ne mesure non plus l'incidence de la pneumonie à pneumocoque dans le pays. Les chiffres disponibles décrivent donc surtout les pneumonies hospitalisées, qui sont les plus graves, et la légionellose, qui est à déclaration obligatoire.</p>
<p>Le tableau suivant rassemble trois sources suisses. Avant d'appliquer un chiffre à un patient, le médecin vérifie toujours la population dont il provient.</p>
<table class="t"><tr><th>Source</th><th>Population</th><th>Résultat principal</th><th>Ce que le clinicien en retient</th></tr><tr><td><button class="w" data-k="j18-pa-epi">Albrich et al., Frontiers in Medicine 2019 (analyse nationale suisse)</button></td><td>Toutes les hospitalisations de Suisse de 2002 à 2015, soit 17 619 016 séjours de la statistique médicale de l'Office fédéral de la statistique.</td><td>Un diagnostic de pneumonie (J13, J15 ou J18) figurait dans 421 760 séjours, soit 2,4 %. L'incidence des hospitalisations avec ce diagnostic est passée de 376 à 457, puis à 536 pour 100 000 habitants et par an entre les périodes 2002–2006, 2007–2010 et 2011–2015. L'âge d'au moins 65 ans multipliait par 2,98 la probabilité d'une hospitalisation avec pneumonie et par 2,38 celle d'un décès hospitalier (rapports de cotes ajustés).</td><td>La pneumonie est une cause fréquente et croissante d'hospitalisation. L'âge pèse à lui seul, ce qui explique sa place dans les scores de gravité.</td></tr><tr><td>Garbino et al., International Journal of Infectious Diseases 2002</td><td>318 adultes hospitalisés pour pneumonie communautaire dans sept centres suisses, pendant deux hivers.</td><td>L'âge moyen était de 70,4 ans et la mortalité de 8 %. L'insuffisance cardiaque (23 %), la bronchopneumopathie chronique obstructive (20 %), l'insuffisance rénale (15 %) et le diabète (12 %) étaient les comorbidités les plus fréquentes, et 40 % des patients fumaient.</td><td>Le patient hospitalisé type est âgé et polymorbide, comme Madame R.</td></tr><tr><td>Fischer et al., International Journal of Hygiene and Environmental Health 2023</td><td>5980 cas de légionellose déclarés en Suisse de 2000 à 2020.</td><td>Le taux de déclaration est passé de 1,1 à 5,6 cas pour 100 000 habitants entre 2000 et 2020, avec un maximum de 6,7 en 2018. Au total, 89,9 % des cas déclarés ont été hospitalisés ; la létalité est passée de 7,7 % à 3,6 %.</td><td>La légionellose, en hausse, est un diagnostic suisse à évoquer, surtout en été, période où les cas culminent.</td></tr></table>
<p>L'erreur fréquente consiste à appliquer à toute pneumonie des chiffres issus de patients hospitalisés : ils surestiment la gravité des pneumonies vues au cabinet. L'analyse nationale a aussi montré que l'insuffisance cardiaque, les maladies pulmonaires chroniques et l'immunodéficience conféraient les risques d'hospitalisation les plus élevés. Pour Madame R., âgée de 71 ans, la première ligne signifie que son âge, à lui seul, augmente son risque d'hospitalisation et de décès.</p>
<div class="key"><b>À retenir.</b> En Suisse, environ un séjour hospitalier sur quarante comporte un diagnostic de pneumonie, et cette fréquence augmente. L'âge d'au moins 65 ans multiplie à peu près par trois le risque d'hospitalisation. La légionellose est en hausse et culmine en été.</div>
<h3>2.2 Les données européennes et internationales</h3>
<p>Les recommandations britanniques de 2009 résument les études de population britanniques, finlandaises et nord-américaines. Elles donnent l'ordre de grandeur qui manque en Suisse pour la médecine de premier recours.</p>
<p>La pneumonie communautaire touche chaque année 5 à 11 adultes sur 1000. Elle représente 5 à 12 % des infections respiratoires basses que les généralistes britanniques traitent par antibiotique. Sa fréquence dépend fortement de l'âge : dans une étude finlandaise, elle atteignait 6 pour 1000 entre 16 et 59 ans, et 34 pour 1000 après 75 ans. Dans les études britanniques, 22 à 42 % des adultes atteints sont hospitalisés, et 1,2 à 10 % des patients hospitalisés passent en soins intensifs.</p>
<p>Une étude américaine de population, publiée en 2015, précise la fréquence des formes hospitalisées. Elle a compté 24,8 hospitalisations pour 10 000 adultes et par an, 63,0 entre 65 et 79 ans et 164,3 après 80 ans (Jain et al., New England Journal of Medicine 2015). La courbe monte donc en flèche avec l'âge, comme dans les données suisses.</p>
<div class="key"><b>À retenir.</b> Chaque année, environ un adulte sur cent à deux cents fait une pneumonie, et la fréquence est multipliée plusieurs fois après 75 ans. Dans les études britanniques, un cinquième à deux cinquièmes des malades sont hospitalisés.</div>
<h3>2.3 Le pronostic</h3>
<p>Le pronostic dépend d'abord du lieu de soins, qui reflète la gravité. Selon les recommandations britanniques de 2009, la mortalité reste inférieure à 1 % chez les patients soignés en ville, varie de 5,7 à 14 % chez les patients hospitalisés et dépasse 30 % chez ceux qui entrent en soins intensifs. Le risque de décès augmente avec l'hypoxémie, la confusion, l'instabilité circulatoire, les défaillances d'organes et les comorbidités. Les scores de la section 7 transforment ces éléments en chiffres, comme le détaille la fenêtre sur la <button class="w" data-k="j18-pa-mort">mortalité selon le lieu de soins et les scores</button>.</p>
<p>Le pronostic ne s'arrête pas à la sortie de l'hôpital. Une étude américaine citée par ces recommandations a mesuré une mortalité de toutes causes de 8,7 % à 90 jours et de 39,1 % après 5,9 ans. D'autres séries rapportent 20,8 % à un an et 35,8 % à cinq ans. Cette mortalité tardive reflète en partie la fragilité des patients qui font une pneumonie.</p>
<p>Le cœur est l'organe le plus souvent touché à distance. Une méta-analyse de 2011 a relevé une complication cardiaque dans les 30 jours chez 17,7 % des patients hospitalisés pour pneumonie : insuffisance cardiaque, syndrome coronarien aigu ou arythmie. La fenêtre sur les <button class="w" data-k="j18-pa-coeur">complications cardiaques de la pneumonie (fréquence, mécanisme et prévention)</button> détaille ces chiffres.</p>
<p>La guérison clinique précède la guérison radiologique. Chez le sujet âgé, la fatigue peut persister plusieurs semaines après le contrôle de l'infection, sans signifier un échec. La prévention vaccinale et l'arrêt du tabac font partie de la prise en charge après l'épisode : les vaccins préviennent une partie des infections à pneumocoque et à virus grippal, et le tabac est un facteur de risque indépendant de pneumonie (British Thoracic Society 2009).</p>
<p>Madame R. appartient à la population hospitalisée, dont la mortalité varie de 5,7 à 14 % selon les séries britanniques. L’évaluation du risque (section 7) s’affine par le score CURB-65, à partir de ses propres paramètres.</p>
<div class="key"><b>À retenir.</b> La mortalité de la pneumonie passe de moins de 1 % en ville à plus de 30 % en soins intensifs. Le risque persiste après la sortie, et près d'un patient hospitalisé sur six fait une complication cardiaque dans le mois.</div></section>
<section class="ilot" id="j18-3"><h2><span class="n">3</span>Physiopathologie : de l'alvéole à l'hypoxémie</h2>
<p>Lorsque les défenses pulmonaires sont dépassées, l’infection perturbe les échanges gazeux et peut abaisser l’oxygénation du sang. Chaque étape de cette chaîne explique un signe clinique et justifie un geste thérapeutique.</p>
<h3>3.1 Le poumon normal se défend et échange les gaz</h3>
<p>Chaque jour, le poumon reçoit des particules et des microbes inhalés, ainsi que de petites quantités de sécrétions oropharyngées aspirées pendant le sommeil. Les alvéoles restent pourtant presque dépourvues de germes, parce que plusieurs défenses se relaient. La <button class="w" data-k="j18-pa-mucocil">clairance mucociliaire et la toux (première ligne de défense)</button> remontent le mucus et les particules vers le pharynx. Les <button class="w" data-k="j18-macro">macrophages alvéolaires (première réponse innée)</button> phagocytent les microbes qui atteignent les alvéoles. Le surfactant, sécrété par les pneumocytes de type II, empêche les alvéoles de se collaber et participe à la défense.</p>
<p>Les échanges gazeux exigent que l'air et le sang se rencontrent au même endroit. Chaque alvéole ventilée est entourée de capillaires perfusés, et la membrane qui les sépare est très fine. Le sang veineux qui traverse une alvéole ventilée en ressort presque saturé en oxygène. Chez l'adulte sain, la ventilation et la perfusion restent appariées d'une région à l'autre, de sorte que le sang artériel mélangé reste bien oxygéné.</p>
<p>Le lien entre la pression partielle en oxygène et la saturation n'est pas linéaire. La SSI met en équivalence une saturation artérielle de 90 % et une PaO₂ de 60 mmHg, soit 8 kPa. Au-dessous de ce point, la <button class="w" data-k="j18-pa-pre-gaz">courbe de dissociation de l'hémoglobine (rappel)</button> devient raide : une petite baisse de pression fait chuter fortement la saturation. C'est pourquoi une saturation de 89 %, comme celle de Madame R., signale une réserve déjà entamée.</p>
<div class="key"><b>À retenir.</b> Le poumon normal élimine les microbes par la clairance mucociliaire, la toux et les macrophages alvéolaires. Il oxygène le sang parce que la ventilation et la perfusion restent appariées.</div>
<h3>3.2 L'agent franchit les défenses</h3>
<p>Un microbe atteint les alvéoles par trois voies. La plus fréquente est la microaspiration de sécrétions oropharyngées colonisées, par exemple par le pneumocoque. La deuxième est l'inhalation d'aérosols infectieux : elle explique la transmission des virus respiratoires et la contamination par <i>Legionella</i> à partir d'eau chaude pulvérisée. La troisième, plus rare, est la dissémination par le sang à partir d'un foyer distant.</p>
<p>L'infection survient quand l'inoculum dépasse les défenses ou quand les défenses faiblissent. Le tabac altère la clairance mucociliaire. L'alcool, la sédation et les troubles de la déglutition augmentent l'aspiration. Une infection virale récente lèse l'épithélium respiratoire et favorise une surinfection bactérienne. Chaque facteur de risque de la section 4 correspond ainsi à une défense affaiblie ou à une exposition accrue.</p>
<div class="key"><b>À retenir.</b> Les facteurs de risque de pneumonie sont des défenses affaiblies ou des inoculums accrus. Cette lecture permet de relier chaque antécédent de l'anamnèse à un mécanisme.</div>
<h3>3.3 L'inflammation remplit les alvéoles</h3>
<p>Lorsque les macrophages reconnaissent des motifs microbiens par leurs récepteurs de type Toll (TLR), ils libèrent des cytokines, notamment le TNF-α, l'IL-1 et l'interleukine 8. Ces médiateurs attirent les polynucléaires neutrophiles et augmentent la perméabilité des capillaires. Du plasma, de la fibrine, des neutrophiles et parfois des globules rouges envahissent alors les alvéoles. Cet <button class="w" data-k="j18-exsudat">exsudat de consolidation (rapport avec les signes)</button> remplace l'air par un milieu liquide et cellulaire.</p>
<p>La consolidation change ce que le médecin entend et voit. Le parenchyme plein transmet mieux les vibrations de la voix et les bruits bronchiques : les vibrations vocales augmentent, et un souffle tubaire apparaît si la bronche reste ouverte. La réouverture inspiratoire de petites voies aériennes et d'alvéoles partiellement remplies produit des crépitants. À l'imagerie, la région consolidée devient opaque, et les bronches restées aérées y dessinent un bronchogramme aérien.</p>
<p>La figure 1 met en regard la chaîne normale et la chaîne pathologique. La rangée A montre les défenses et les échanges du poumon sain ; la rangée B montre, colonne par colonne, la perturbation correspondante.</p>

<p>La figure se lit colonne par colonne : chaque case de la rangée B est la défaillance de la case située au-dessus d'elle. La dernière colonne relie la lésion à ce que le médecin mesure au lit du malade, la saturation. L'erreur fréquente consiste à lire la rangée B seule : sans la rangée A, le lecteur ne voit pas quelle fonction a été perdue.</p>
<div class="key"><b>À retenir.</b> L'exsudat alvéolaire est la lésion élémentaire de la pneumonie. Il explique à la fois les crépitants, la matité, le souffle tubaire et l'opacité radiologique.</div>
<h3>3.4 L'effet shunt abaisse l'oxygène du sang</h3>
<p>Une alvéole remplie d'exsudat n'est plus ventilée, mais ses capillaires restent perfusés. Le sang veineux qui la traverse n'y rencontre pas d'air et repart aussi pauvre en oxygène qu'il est arrivé. Ce sang se mélange ensuite au sang oxygéné des régions saines : c'est l'<button class="w" data-k="j18-shunt">effet shunt intrapulmonaire (cause de l'hypoxémie)</button>.</p>
<p>Un calcul simplifié montre l'ampleur du phénomène ; il néglige l'oxygène dissous, qui compte peu. Supposons que 30 % du débit sanguin pulmonaire traverse des alvéoles consolidées et que le sang veineux arrive saturé à 70 %. Si le sang des régions saines ressort saturé à 98 %, le sang artériel mélangé atteint environ 0,7 × 98 + 0,3 × 70, soit 90 %. Sous oxygène, les régions saines passent au mieux à 100 %, et le mélange n'atteint qu'environ 91 %. L'oxygène corrige donc mal un shunt étendu, parce qu'il n'atteint pas le sang qui traverse les alvéoles pleines. La figure 2 représente ce calcul.</p>
<figure><svg viewBox="0 0 660 330" role="img" aria-label="Calcul simplifié de l'effet shunt : une unité ventilée recevant 70 % du débit sanguin et une unité consolidée recevant 30 % du débit, puis mélange du sang artériel en air ambiant et sous oxygène" font-family="Inter,sans-serif" font-size="12"><g fill="#222" font-weight="bold"><text x="20" y="20">A. Unité ventilée (70 % du débit)</text><text x="350" y="20">B. Unité consolidée (30 % du débit)</text></g><g fill="none" stroke="#222" stroke-width="1.5"><path d="M165 30v15M495 30v15"/><circle cx="165" cy="95" r="50"/><circle cx="495" cy="95" r="50"/><path d="M60 170H270M262 165l8 5-8 5M390 170H600M592 165l8 5-8 5"/><path d="M270 200L300 240M600 200L440 240"/><rect x="160" y="240" width="340" height="76" rx="8"/></g><g fill="#222"><circle cx="470" cy="75" r="4"/><circle cx="492" cy="66" r="4"/><circle cx="515" cy="74" r="4"/><circle cx="462" cy="100" r="4"/><circle cx="528" cy="100" r="4"/><circle cx="478" cy="122" r="4"/><circle cx="510" cy="124" r="4"/></g><g fill="#222" text-anchor="middle"><text x="165" y="99">air</text><text x="495" y="99">exsudat</text><text x="330" y="262">Sang artériel mélangé</text><text x="330" y="284">en air ambiant : 0,7 × 98 + 0,3 × 70 ≈ 90 %</text><text x="330" y="304">sous oxygène : 0,7 × 100 + 0,3 × 70 ≈ 91 %</text></g><g fill="#222"><text x="60" y="190">entrée 70 %</text><text x="270" y="190" text-anchor="end">sortie 98 %</text><text x="390" y="190">entrée 70 %</text><text x="600" y="190" text-anchor="end">sortie 70 %</text><text x="505" y="40">aucune ventilation</text></g></svg><figcaption>Figure 2 — Effet shunt, calcul simplifié qui néglige l'oxygène dissous : le sang qui traverse l'unité consolidée (B) garde sa saturation veineuse et abaisse la saturation du mélange ; l'oxygène n'améliore que l'unité ventilée (A), déjà presque saturée.</figcaption></figure>
<p>La figure se lit de haut en bas : chaque unité modifie ou non la saturation du sang qui la traverse, puis les deux sangs se mélangent dans le rectangle inférieur. L'erreur fréquente consiste à croire qu'un débit d'oxygène élevé corrige toute hypoxémie. Dans la réalité, beaucoup d'alvéoles atteintes restent mal ventilées sans être exclues, et l'oxygène améliore leur contribution : l'hypoxémie d'une pneumonie répond donc partiellement à l'oxygène. Une absence de réponse suffisante signale un shunt étendu et impose une évaluation urgente de l'assistance respiratoire.</p>
<p>L'hypoxémie stimule la ventilation. La fréquence respiratoire augmente, la PaCO₂ baisse d'abord et le patient ressent une dyspnée. Une PaCO₂ qui remonte chez un patient qui respire vite ne traduit pas une amélioration : elle signale un épuisement respiratoire.</p>
<div class="key"><b>À retenir.</b> L'hypoxémie de la pneumonie vient surtout du sang qui traverse des alvéoles pleines. L'oxygène la corrige mal quand ce shunt est étendu, et une PaCO₂ qui remonte chez un patient tachypnéique signale l'épuisement.</div>
<h3>3.5 L'inflammation déborde le poumon</h3>
<p>Les cytokines libérées dans le poumon passent dans la circulation. Elles provoquent la fièvre et les frissons, et elles peuvent altérer l'état mental, surtout chez le sujet âgé. Lorsque la réponse de l'hôte se dérègle, elle entraîne une vasodilatation, une fuite capillaire et une hypoperfusion des organes. Cette dysfonction d'organes causée par une réponse dérégulée à l'infection définit le <button class="w" data-k="j18-pa-sepsis">sepsis (définition Sepsis-3, qSOFA et choc septique)</button>.</p>
<p>Le sepsis explique la confusion, l'hypotension, la baisse de la diurèse, la hausse de la créatinine et celle du lactate. Le cœur subit aussi la maladie : la fièvre et la tachycardie augmentent ses besoins en oxygène, alors que l'hypoxémie réduit l'apport. Les <button class="w" data-k="j18-pa-coeur">complications cardiaques (insuffisance cardiaque, syndrome coronarien, arythmie)</button> touchent près d'un patient hospitalisé sur six.</p>
<p>La plèvre pariétale, innervée par les nerfs intercostaux, perçoit la douleur, alors que le parenchyme pulmonaire n'a pas d'innervation douloureuse. Lorsque l'inflammation atteint la surface du poumon, chaque inspiration étire la plèvre enflammée et provoque une <button class="w" data-k="j18-s-doul">douleur pleurétique (mécanisme et différentiel)</button>. L'inflammation pleurale peut aussi produire un épanchement parapneumonique, que la section 8 étudie.</p>
<div class="key"><b>À retenir.</b> La pneumonie suit une chaîne : défenses dépassées, exsudat alvéolaire, effet shunt, hypoxémie, puis réponse systémique qui peut aboutir au sepsis. Les crépitants, la matité et le souffle tubaire traduisent l'exsudat ; leur absence n'exclut pas la maladie chez une personne âgée ou déshydratée. Une saturation basse mesure le retentissement fonctionnel, mais elle ne désigne pas le germe.</div></section>
<section class="ilot" id="j18-4"><h2><span class="n">4</span>Agents et facteurs de risque</h2>
<p>Les agents probables et les caractéristiques du patient orientent l’antibiothérapie empirique (section 9). L’objectif est de couvrir les germes attendus sans élargir inutilement le spectre. Certains antécédents justifient la recherche d’un agent inhabituel.</p>
<h3>4.1 Les agents en cause</h3>
<p>Aucune étude ne donne « la » répartition des agents, parce qu'elle dépend du lieu de soins, de l'âge, de la saison et de l'intensité des examens. Le tableau suivant compare deux sources. Les trois premières colonnes chiffrées donnent la proportion de patients chez qui chaque agent a été identifié dans les études britanniques réunies par la British Thoracic Society en 2009 : patients soignés en ville (1 étude, 236 patients), à l'hôpital (5 études, 1137 patients) ou en soins intensifs (4 études, 185 patients). La dernière colonne reprend l'étude suisse de 2002 chez 318 patients hospitalisés. Chaque agent ouvre une fenêtre qui décrit sa biologie, sa présentation et son traitement.</p>
<table class="t"><tr><th>Agent</th><th>Ville</th><th>Hôpital</th><th>Soins intensifs</th><th>Suisse, hôpital (2002)</th></tr><tr><td><button class="w" data-k="j18-pa-pneumo"><i>Streptococcus pneumoniae</i> (pneumocoque)</button></td><td>36,0 %</td><td>39 %</td><td>21,6 %</td><td>12,6 %</td></tr><tr><td><button class="w" data-k="j18-pa-hflu"><i>Haemophilus influenzae</i> et <i>Moraxella catarrhalis</i></button></td><td>10,2 % (<i>H. influenzae</i>)</td><td>5,2 % et 1,9 %</td><td>3,8 % (<i>H. influenzae</i>)</td><td>6 % et 1,6 %</td></tr><tr><td><button class="w" data-k="j18-pa-legio"><i>Legionella</i> (légionellose)</button></td><td>0,4 %</td><td>3,6 %</td><td>17,8 %</td><td>4,4 %</td></tr><tr><td><button class="w" data-k="j18-pa-staph"><i>Staphylococcus aureus</i></button></td><td>0,8 %</td><td>1,9 %</td><td>8,7 %</td><td>1,6 %</td></tr><tr><td><button class="w" data-k="j18-pa-myco"><i>Mycoplasma pneumoniae</i>, <i>Chlamydia</i> et <i>Coxiella</i></button></td><td>1,3 % (<i>Mycoplasma</i>) ; 0 % (<i>Coxiella</i>)</td><td>10,8 % (<i>Mycoplasma</i>), 13,1 % (<i>Chlamydophila pneumoniae</i>) et 1,2 % (<i>Coxiella</i>)</td><td>2,7 % (<i>Mycoplasma</i>) ; 0 % (<i>Coxiella</i>)</td><td>7,5 % (<i>Mycoplasma</i>) et 5,3 % (<i>Chlamydia pneumoniae</i>)</td></tr><tr><td>Bacilles à Gram négatif entériques</td><td>1,3 %</td><td>1,0 %</td><td>1,6 %</td><td>non rapporté</td></tr><tr><td><button class="w" data-k="j18-pa-virus">Virus respiratoires</button></td><td>13,1 %, dont grippe 8,1 %</td><td>12,8 %, dont grippe 10,7 %</td><td>9,7 %, dont grippe 5,4 %</td><td>non rapporté</td></tr><tr><td>Infection mixte</td><td>11,0 %</td><td>14,2 %</td><td>6,0 %</td><td>non rapporté</td></tr><tr><td>Aucun agent identifié</td><td>45,3 %</td><td>30,8 %</td><td>32,4 %</td><td>environ 50 %</td></tr></table>
<p>Ce tableau se lit en deux temps. Le pneumocoque reste l'agent identifié le plus souvent en ville et à l'hôpital : c'est lui que l'antibiotique empirique doit couvrir en premier. <i>Legionella</i> et <i>S. aureus</i> pèsent beaucoup plus en soins intensifs, ce qui justifie un traitement plus large chez le patient grave. L'erreur fréquente consiste à oublier la dernière ligne : chez un tiers à la moitié des patients, aucun agent n'est identifié, et le traitement reste empirique jusqu'au bout. La série suisse illustre enfin que les proportions varient d'une étude à l'autre selon les méthodes employées.</p>
<p>Une étude américaine de 2015 a recherché systématiquement les agents par culture, sérologie, détection d'antigènes et amplification génique chez 2259 adultes hospitalisés (Jain et al.). Elle n'a trouvé un agent que chez 38 % des patients : un virus chez 23 %, une bactérie chez 11 %, les deux chez 3 %. Le rhinovirus (9 %), le virus grippal (6 %) et le pneumocoque (5 %) étaient les plus fréquents. Cette étude montre que les virus sont fréquents chez l'adulte hospitalisé. Elle ne permet pas pour autant de renoncer à l'antibiotique, car un virus détecté n'exclut pas une bactérie associée, comme le rappelle la section 9.</p>
<div class="key"><b>À retenir.</b> Le pneumocoque est l'agent identifié le plus souvent, mais aucun agent n'est trouvé chez un tiers à deux tiers des patients selon les études. Le traitement empirique couvre donc d'abord le pneumocoque, puis les agents des formes graves, <i>Legionella</i> et <i>S. aureus</i>.</div>
<h3>4.2 Les indices qui orientent vers un agent</h3>
<p>La British Thoracic Society a rassemblé les indices associés à chaque agent. Le pneumocoque est plus fréquent chez le patient âgé et comorbide, avec un début brutal, une fièvre élevée et une douleur pleurétique. <i>Legionella</i> touche plus souvent des patients plus jeunes et fumeurs, sans comorbidité, avec une diarrhée, des signes neurologiques, une atteinte de plusieurs organes et des enzymes hépatiques ou une créatine kinase élevées. <i>Mycoplasma pneumoniae</i> touche des patients plus jeunes, qui ont souvent déjà reçu un antibiotique. Ces associations restent statistiques : elles ne prédisent pas l'agent chez un patient donné.</p>
<p>Une équipe de Bâle a transformé ces indices en score pour la légionellose. Chez 450 patients admis aux urgences pour pneumonie, six éléments étaient associés à <i>Legionella</i> : une température supérieure à 39,4 °C, l'absence d'expectoration, une natrémie inférieure à 133 mmol/L, une lactate déshydrogénase (LDH) supérieure à 225 U/L, une protéine C réactive supérieure à 187 mg/L et des plaquettes inférieures à 171 × 10⁹/L (Fiumefreddo et al., BMC Pulmonary Medicine 2009). Parmi les patients qui totalisaient 0 ou 1 point, 3 % avaient une légionellose ; parmi ceux qui en totalisaient au moins 4, 66 % en avaient une. La fiche SSI reprend ces prédicteurs pour décider de prolonger le macrolide.</p>
<div class="key"><b>À retenir.</b> Aucun signe isolé n'identifie l'agent. Des combinaisons d'indices, comme le score bâlois de la légionellose, modifient seulement la probabilité, et donc la durée du macrolide.</div>
<h3>4.3 Les facteurs de risque du patient</h3>
<p>Les facteurs de risque se répartissent en deux groupes. Les uns affaiblissent les défenses générales ou locales ; les autres augmentent l'exposition ou l'inoculum. Les deux cartes suivantes les présentent avec leur mécanisme.</p>
<div class="two"><div class="card"><h4>Des défenses affaiblies</h4><p>L'âge élevé est le premier facteur : en Suisse, il multiplie à peu près par trois le risque d'hospitalisation pour pneumonie. L'insuffisance cardiaque, les maladies pulmonaires chroniques et l'immunodéficience confèrent les risques les plus élevés dans les données suisses. Dans la série suisse de 2002, l'insuffisance cardiaque, la bronchopneumopathie chronique obstructive, l'insuffisance rénale et le diabète étaient les comorbidités les plus fréquentes des patients hospitalisés. La British Thoracic Society associe l'alcoolisme à l'aspiration, aux infections à pneumocoque, y compris bactériémiques, et aux bacilles à Gram négatif entériques. Le tabagisme actif ou passif est un facteur de risque indépendant de pneumonie selon la British Thoracic Society.</p></div><div class="card"><h4>Une exposition ou une aspiration accrues</h4><p>Les troubles de la déglutition, les troubles de la conscience, l'alcool et la sédation augmentent l'aspiration de sécrétions oropharyngées. Chez le sujet âgé atteint de pneumonie, une aspiration a été retrouvée dans 71 % des cas, contre 10 % chez des témoins (British Thoracic Society 2009). La SSI demande de réévaluer après l'épisode les inhibiteurs de la pompe à protons, les opiacés et les antipsychotiques, et d'améliorer l'hygiène buccale. Le contact avec des malades, la vie en collectivité et l'exposition à de l'eau chaude pulvérisée exposent à des agents particuliers.</p></div></div>
<p>Madame R. a deux facteurs principaux, son âge et son diabète. L'anamnèse de la section 5 cherchera les autres, notamment un tabagisme ancien, un trouble de la déglutition ou une exposition particulière.</p>
<div class="key"><b>À retenir.</b> Chaque facteur de risque correspond à une défense affaiblie ou à une exposition accrue. Certains sont modifiables, comme le tabac, l'hygiène buccale ou les médicaments sédatifs, et la prévention de la section 10 s'y attaque.</div>
<h3>4.4 Les facteurs de risque de germes résistants</h3>
<p>La plupart des pneumonies communautaires sont dues à des germes sensibles aux antibiotiques usuels. Certains antécédents augmentent pourtant le risque d'un <i>Staphylococcus aureus</i> résistant à la méticilline, d'un <i>Pseudomonas aeruginosa</i> ou d'une entérobactérie résistante. La SSI retient deux facteurs dans la pneumonie sévère : un traitement antibiotique dans les 90 jours précédents et l'hémodialyse. Elle recommande alors la pipéracilline-tazobactam associée à un macrolide.</p>
<p>Les recommandations européennes de 2023 sur la pneumonie communautaire sévère (ERS, ESICM, ESCMID et Asociación Latinoamericana de Tórax) classent ces facteurs en quatre groupes : l'exposition aux soins, la colonisation persistante, par exemple lors d'une maladie pulmonaire chronique ou après l'isolement d'un germe résistant, la pression de sélection d'un antibiotique récent et les facteurs qui modifient la physiologie de l'hôte, comme les troubles neurologiques ou la suppression de l'acidité gastrique. Elles suggèrent d'intégrer ces facteurs, au besoin réunis dans un score, à l'épidémiologie locale et aux colonisations antérieures pour décider d'un spectre élargi (recommandation conditionnelle, qualité de preuve modérée). Les scores disponibles sont sensibles mais peu spécifiques : appliqués sans jugement, ils exposent au surtraitement. La fenêtre sur les <button class="w" data-k="j18-pa-resist">facteurs de risque de germes résistants (SSI et recommandations européennes)</button> détaille ces critères.</p>
<div class="trap"><span class="k">Piège</span>Le mot « aspiration » ne justifie pas à lui seul une couverture anaérobie supplémentaire. Dans la forme sévère, les recommandations européennes de 2023 conseillent, chez le patient qui a des facteurs de risque d'aspiration, le schéma standard de la pneumonie communautaire plutôt qu'un traitement dirigé contre les anaérobies (déclaration de bonne pratique), parce que les schémas usuels, comme l'amoxicilline associée à l'acide clavulanique, couvrent déjà une partie des anaérobies. Le schéma de la SSI pour la pneumonie d'aspiration repose d'ailleurs sur cette association, à 2,2 g toutes les 8 heures par voie intraveineuse. Un abcès pulmonaire ou un empyème changent en revanche la discussion (section 8).</div>
<div class="key"><b>À retenir.</b> Le pneumocoque domine, <i>Legionella</i> et <i>S. aureus</i> pèsent dans les formes graves, et aucun agent n'est trouvé chez une grande partie des patients. Les germes résistants restent l'exception, réservée à des antécédents précis. Madame R. n'a reçu aucun antibiotique récent et n'est pas dialysée : ses germes probables sont ceux de la communauté.</div></section>
<section class="ilot" id="j18-5"><h2><span class="n">5</span>Anamnèse : caractériser la maladie et le terrain</h2>
<p>L'anamnèse de la pneumonie poursuit trois buts. Elle rend le diagnostic plus ou moins probable, elle révèle le terrain qui modifie la gravité et l'antibiotique, et elle cherche les expositions qui orientent vers un agent particulier. Chaque réponse contribue à préciser ces décisions.</p>
<h3>5.1 Les antécédents qui changent la conduite</h3>
<p>Le médecin interroge d'abord le terrain, parce qu'il modifie à la fois le risque de forme grave et le choix de l'antibiotique. Les deux cartes suivantes regroupent les antécédents à rechercher ; chaque mot vert ouvre une fenêtre qui explique la question, sa raison et son piège.</p>
<div class="two"><div class="card"><h4>Le poumon, les défenses et les vaccins</h4><p>Le médecin demande s'il existe une <button class="w" data-k="j18-a-poumon">maladie pulmonaire ou une hospitalisation antérieure (terrain et résistances)</button>, car une bronchopneumopathie chronique obstructive réduit la réserve respiratoire et modifie les germes. Il recherche une <button class="w" data-k="j18-a-immune">immunodépression, une splénectomie ou une corticothérapie (liste de la SSI et conduite)</button>, qui expose à des agents opportunistes. Il vérifie les <button class="w" data-k="j18-a-vaccin">vaccinations contre la grippe et le pneumocoque (prévention et limites)</button>, qui orientent la prévention après l'épisode. Il précise enfin le <button class="w" data-k="j18-pa-tabac">tabagisme et la consommation d'alcool (risque et sevrage)</button>.</p></div><div class="card"><h4>L'exposition, la sécurité et les traitements</h4><p>Le médecin recherche une <button class="w" data-k="j18-a-asp">dysphagie, un trouble de la conscience ou une aspiration (contexte et chronologie)</button>, qui modifient les germes et le pronostic. Il demande s'il y a eu un <button class="w" data-k="j18-a-expo">voyage, une exposition à l'eau pulvérisée ou un entourage malade (agents à rechercher)</button>, car ces expositions orientent vers <i>Legionella</i> ou vers un virus. Il documente les <button class="w" data-k="j18-a-drug">antibiotiques récents, les allergies et la fonction rénale (choix et doses)</button>, qui déterminent la molécule, la dose et le risque de résistance.</p></div></div>
<div class="key"><b>À retenir.</b> Chaque antécédent se recherche pour une raison précise : il modifie la gravité, les germes probables ou la dose. Un antécédent mal documenté, comme une allergie non caractérisée, peut priver le patient du meilleur antibiotique.</div>
<h3>5.2 Les symptômes et leur valeur</h3>
<p>La SSI définit l'infection respiratoire aiguë comme une maladie des voies respiratoires qui dure 21 jours au plus. Elle se manifeste par une toux, un mal de gorge, de la fièvre, une expectoration, une dyspnée, des sibilances ou une gêne thoracique, sans autre cause. La pneumonie n'en représente qu'une petite partie : dans l'étude européenne de soins primaires déjà citée, 5 % des adultes qui toussaient avaient une pneumonie visible à la radiographie. Les symptômes servent donc surtout à repérer ces 5 %.</p>
<p>Le tableau suivant présente les symptômes à rechercher, avec leur fréquence dans une série suisse de patients hospitalisés ou leur valeur dans une étude européenne de soins primaires. Chaque symptôme ouvre une fenêtre qui détaille sa caractérisation.</p>
<table class="t"><tr><th>Symptôme</th><th>Donnée chiffrée</th><th>Ce qu'il apporte</th><th>Piège</th></tr><tr><td><button class="w" data-k="j18-s-toux">Toux et expectoration (apparition, couleur, limites)</button></td><td>Elle était présente chez environ 90 % des patients hospitalisés de la série suisse de 2002.</td><td>Une toux nouvelle est le symptôme d'appel le plus constant.</td><td>Une expectoration purulente ne prouve pas une infection bactérienne.</td></tr><tr><td><button class="w" data-k="j18-s-dysp">Dyspnée (intensité, progression, état de base)</button></td><td>Elle était présente chez environ 90 % des patients hospitalisés de la série suisse. En soins primaires, l'essoufflement augmentait la probabilité de pneumonie (rapport de cotes ajusté de 1,4).</td><td>Elle traduit le retentissement de la maladie sur les échanges gazeux.</td><td>Une dyspnée brutale doit faire chercher une embolie pulmonaire ou un pneumothorax.</td></tr><tr><td><button class="w" data-k="j18-s-fievre">Fièvre ou hypothermie (évolution et exceptions)</button></td><td>Une fièvre supérieure à 38 °C n'était présente que chez 64 % des patients hospitalisés de la série suisse.</td><td>Une fièvre mesurée d'au moins 38,5 °C pendant plus de trois jours compte parmi les signes de probabilité de la SSI.</td><td>Son absence n'exclut pas la pneumonie, surtout chez le sujet âgé.</td></tr><tr><td>Absence d'écoulement nasal</td><td>En soins primaires, l'absence de rhinorrhée augmentait la probabilité de pneumonie (rapport de cotes ajusté de 1,9).</td><td>Une rhinorrhée oriente plutôt vers une infection des voies respiratoires hautes.</td><td>Ce signe n'a de valeur qu'associé aux autres éléments du tableau.</td></tr><tr><td><button class="w" data-k="j18-s-doul">Douleur pleurétique (mécanisme et différentiel)</button></td><td>La British Thoracic Society l'associe au pneumocoque ; elle est moins fréquente avec les agents atypiques.</td><td>Elle signale que l'inflammation atteint la plèvre pariétale.</td><td>L'embolie pulmonaire et le pneumothorax produisent la même douleur.</td></tr><tr><td><button class="w" data-k="j18-s-conf">Confusion et chutes (présentation du sujet âgé)</button></td><td>Dans une cohorte de 1812 patients, 17 des 18 symptômes étudiés étaient moins souvent rapportés à mesure que l'âge augmentait (Metlay et al., 1997).</td><td>Une confusion nouvelle compte dans les scores CRB-65 et CURB-65.</td><td>Une confusion attribuée à tort à une démence retarde le diagnostic.</td></tr><tr><td><button class="w" data-k="j18-s-hemo">Hémoptysie (exclure une autre cause)</button></td><td>La SSI la classe parmi les signaux d'alarme de l'infection respiratoire aiguë.</td><td>Des stries de sang accompagnent parfois une pneumonie.</td><td>Une hémoptysie abondante ou persistante impose de chercher un cancer, une tuberculose ou une embolie.</td></tr></table>
<p>Ce tableau montre qu'aucun symptôme n'a de valeur isolée. La toux et la dyspnée sont presque constantes chez le patient hospitalisé, mais elles sont aussi fréquentes dans la bronchite. La fièvre manque chez plus d'un tiers des patients hospitalisés de la série suisse. L'erreur fréquente consiste donc à écarter une pneumonie parce que le patient n'a pas de fièvre. Madame R. illustre un autre piège : sa confusion n'est pas un simple trouble de l'âge, mais un symptôme de gravité.</p>
<div class="key"><b>À retenir.</b> La toux et la dyspnée sont presque constantes, la fièvre manque chez un tiers des patients hospitalisés, et les symptômes diminuent avec l'âge. Une confusion nouvelle, une hémoptysie ou une douleur brutale changent immédiatement la conduite.</div>
<h3>5.3 Les formes typiques et atypiques</h3>
<p>Une même maladie se présente de plusieurs façons selon le patient et l'agent. Les six cartes suivantes décrivent les présentations que le médecin doit reconnaître ; chacune indique ce qui la distingue et ce qu'elle impose.</p>
<div class="two"><div class="card"><h4>La présentation fréquente</h4><p>Le début est aigu. Le patient a de la fièvre, une toux, une dyspnée et une respiration rapide. Sa saturation baisse, et l'examen trouve un foyer de crépitants. Cette présentation rend la pneumonie probable, mais elle ne dit rien de sa gravité, qui se mesure à part.</p></div><div class="card"><h4>La présentation du sujet âgé</h4><p>Une confusion, une chute, une perte d'autonomie ou une anorexie peuvent précéder la fièvre et la toux. La British Thoracic Society note que la fièvre manque plus souvent chez le sujet âgé et que les signes non spécifiques, en particulier la confusion, y sont plus fréquents. Le médecin mesure donc les signes vitaux chez tout patient âgé qui décline brusquement.</p></div><div class="card"><h4>La présentation virale</h4><p>Le contexte est épidémique. Lors d'une grippe, des céphalées, des douleurs articulaires, des myalgies, un malaise général et parfois des troubles digestifs peuvent dominer. Une surinfection bactérienne peut suivre une amélioration initiale : une fièvre qui reprend après quelques jours doit la faire chercher.</p></div><div class="card"><h4>La présentation compliquée</h4><p>Une douleur thoracique persistante, une dyspnée qui progresse ou une fièvre qui persiste sous traitement signalent une complication. Le médecin cherche alors un épanchement pleural, un empyème ou un autre diagnostic, comme l'explique la section 8.</p></div><div class="card"><h4>La présentation évocatrice de légionellose</h4><p>Une fièvre élevée, une toux peu productive, une diarrhée, une confusion et une hyponatrémie orientent vers <i>Legionella</i>, surtout en été ou après un séjour à l'hôtel. Ces indices justifient la recherche de l'antigène urinaire et un antibiotique actif sur les germes intracellulaires.</p></div><div class="card"><h4>La présentation par aspiration</h4><p>Un patient qui a un trouble de la déglutition, un accident vasculaire cérébral ou un épisode de vomissement développe une pneumonie dans les régions pulmonaires déclives au moment de l'aspiration. Le médecin cherche la cause de l'aspiration, car la corriger prévient la récidive.</p></div></div>
<div class="key"><b>À retenir.</b> Une présentation typique ne suffit pas au diagnostic, et une présentation atypique ne l'exclut pas. Chez le sujet âgé, un déclin brutal sans fièvre impose de mesurer les signes vitaux.</div>
<h3>5.4 L'anamnèse de Madame R.</h3>
<p>La fille de Madame R. précise que sa mère se sent faible depuis quatre jours. La fièvre a commencé par un grand frisson. Une toux productive est ensuite apparue, avec des crachats couleur rouille. Depuis la veille, sa mère se plaint d'une douleur à droite du thorax qui augmente à l'inspiration. Elle mange et boit peu.</p>
<p>Les antécédents apportent des informations décisives. Madame R. a fumé pendant trente ans et a arrêté il y a douze ans. Elle n'a reçu aucun antibiotique et n'a pas été hospitalisée depuis un an. Elle n'a pas voyagé et n'a fréquenté ni bain à remous ni hôtel. Elle n'a pas d'allergie connue. Elle a reçu le vaccin contre la grippe l'automne précédent, mais jamais le vaccin contre le pneumocoque. Elle n'a pas de trouble connu de la déglutition.</p>
<p>Le médecin interprète ces réponses une à une. Le grand frisson, les crachats rouillés et la douleur pleurétique évoquent classiquement le pneumocoque, sans le prouver. L'absence d'antibiotique et d'hospitalisation récents rend peu probable un germe résistant. L'absence d'exposition à l'eau pulvérisée réduit la probabilité d'une légionellose sans la supprimer. La vaccination contre la grippe ne protège pas complètement, et la grippe reste à rechercher pendant la saison. L'absence d'allergie autorise enfin une bêtalactamine.</p>
<div class="key"><b>À retenir.</b> L'anamnèse de Madame R. rend la pneumonie très probable et oriente vers le pneumocoque, sans exclure la grippe ni <i>Legionella</i>. Elle ne révèle aucun facteur de risque de germe résistant.</div></section>
<section class="ilot" id="j18-6"><h2><span class="n">6</span>Examen clinique : mesurer et interpréter</h2>
<p>L'examen clinique de la pneumonie mesure d'abord la gravité, puis il cherche les signes du foyer. Cet ordre n'est pas arbitraire : les signes vitaux décident du lieu de soins, alors que les signes auscultatoires sont peu sensibles.</p>
<h3>6.1 L'état général et les signes vitaux</h3>
<p>Le médecin observe d'abord l'aspect général. Un patient qui ne peut pas finir ses phrases, qui utilise ses muscles respiratoires accessoires ou dont la peau est marbrée est grave avant toute mesure. Le médecin mesure ensuite six paramètres. Le tableau suivant donne pour chacun le repère usuel chez l'adulte, le seuil qui change la décision et la source de ce seuil.</p>
<table class="t"><tr><th>Paramètre</th><th>Repère usuel chez l'adulte</th><th>Seuil qui change la décision</th><th>Source du seuil</th></tr><tr><td><button class="w" data-k="j18-v-fr">Fréquence respiratoire (mesure complète, seuil et piège)</button></td><td>12 à 20 par minute</td><td>À partir de 22 par minute, elle devient un signe de probabilité de pneumonie ; à partir de 30 par minute, elle devient un signal d'alarme et un point du CRB-65.</td><td>SSI ; British Thoracic Society 2009</td></tr><tr><td><button class="w" data-k="j18-v-spo">Saturation pulsée en oxygène, en air ambiant (mesure et limites)</button></td><td>Sous oxygène, la cible est de 94 à 98 % chez le patient sans risque d'hypercapnie.</td><td>Au-dessous de 92 %, elle devient un signal d'alarme ; au-dessous de 90 %, l'hospitalisation est à envisager quel que soit le score.</td><td>SSI ; British Thoracic Society 2009 pour la cible</td></tr><tr><td><button class="w" data-k="j18-v-ta">Pression artérielle et perfusion (choc)</button></td><td>Elle varie d'un patient à l'autre ; le médecin la compare à la valeur habituelle.</td><td>Une systolique inférieure à 90 mmHg est un signal d'alarme ; une systolique inférieure à 90 mmHg ou une diastolique d'au plus 60 mmHg donne un point du CRB-65.</td><td>SSI ; Lim et al. 2003</td></tr><tr><td><button class="w" data-k="j18-pa-pouls">Fréquence cardiaque (tachycardie et stabilité)</button></td><td>60 à 100 par minute</td><td>À partir de 100 par minute, elle devient un signe de probabilité ; au-dessus de 100 par minute, elle empêche de considérer le patient comme stable.</td><td>SSI</td></tr><tr><td><button class="w" data-k="j18-pa-temp">Température (mesure, fièvre et hypothermie)</button></td><td>Environ 37 °C</td><td>Une fièvre d'au moins 38,5 °C pendant plus de trois jours est un signe de probabilité ; une température inférieure à 36 °C figure parmi les critères de surveillance intensifiée ; la stabilité exige 37,8 °C au plus.</td><td>SSI</td></tr><tr><td><button class="w" data-k="j18-pa-mental">État mental (confusion nouvelle et test mental abrégé)</button></td><td>Le patient est orienté et attentif.</td><td>Une confusion nouvelle donne un point du CRB-65 et figure parmi les critères de surveillance intensifiée.</td><td>British Thoracic Society 2009 ; SSI</td></tr></table>
<p>Ce tableau se lit ligne par ligne, en comparant chaque mesure à la troisième colonne. L'erreur fréquente consiste à ne pas compter la fréquence respiratoire, ou à l'estimer d'un coup d'œil : c'est pourtant le paramètre qui figure dans presque tous les scores. Une revue systématique de 2019 montre l'intérêt de ces mesures en ville (Marchello et al., Journal of the American Board of Family Medicine 2019). Des signes vitaux normaux, c'est-à-dire une température, une fréquence respiratoire et une fréquence cardiaque normales, rendent la pneumonie peu probable, avec un rapport de vraisemblance négatif de 0,24.</p>
<p>Associés à un examen pulmonaire normal, ces signes vitaux normaux abaissent le rapport de vraisemblance négatif à 0,10. Un tel rapport divise environ par dix la cote de la maladie : pour un risque initial de 4 %, la probabilité de pneumonie tombe à 0,4 %. Le médecin peut alors renoncer à l'imagerie chez un patient stable, en prévoyant une réévaluation.</p>
<div class="key"><b>À retenir.</b> Les signes vitaux décident de la gravité. Lorsqu'ils sont tous normaux et que l'examen pulmonaire l'est aussi, ils rendent la pneumonie très improbable. La fréquence respiratoire se compte ; elle ne s'estime pas.</div>
<h3>6.2 L'examen du thorax</h3>
<p>L'examen du thorax cherche les signes de la consolidation décrits à la section 3. Le médecin inspecte l'ampliation et le tirage, palpe les vibrations vocales, percute et ausculte, en comparant toujours les deux côtés au même niveau. Chaque signe a une technique, une valeur et un piège, que détaillent les fenêtres suivantes.</p>
<p>Les <button class="w" data-k="j18-x-crep">crépitants localisés (technique et limites)</button> sont le signe le plus utile : dans l'étude européenne de soins primaires, ils augmentaient nettement la probabilité de pneumonie (rapport de cotes ajusté de 3,5). La <button class="w" data-k="j18-pa-murmure">diminution localisée du murmure vésiculaire (valeur et causes)</button> faisait aussi partie du modèle diagnostique de cette étude. La <button class="w" data-k="j18-x-mat">matité et les vibrations vocales (consolidation ou épanchement)</button> distinguent une consolidation, où les vibrations augmentent, d'un épanchement, où elles diminuent. Le <button class="w" data-k="j18-x-souffle">souffle tubaire (transmission et faux positifs)</button> traduit une consolidation autour d'une bronche perméable.</p>
<p>La valeur globale de l'examen du thorax reste modeste. Dans une étude de 52 hommes examinés successivement par trois médecins qui ignoraient l'anamnèse et la radiographie, le diagnostic de pneumonie posé sur l'examen avait une sensibilité de 47 à 69 % et une spécificité de 58 à 75 % selon l'examinateur (Wipf et al., Archives of Internal Medicine 1999). Les signes les plus utiles étaient les crépitants unilatéraux et les crépitants entendus en décubitus latéral. L'accord entre examinateurs variait fortement d'un signe à l'autre ; il n'atteignait un coefficient kappa d'environ 0,5 que pour les crépitants en décubitus latéral et pour les sibilances.</p>
<div class="key"><b>À retenir.</b> Un foyer de crépitants unilatéraux augmente fortement la probabilité de pneumonie. Un examen du thorax normal ne suffit pas à l'exclure s'il ne s'accompagne pas de signes vitaux normaux.</div>
<h3>6.3 Les signes de gravité et les signes d'orientation</h3>
<p>L'examen se termine par une recherche systématique des signes qui imposent une action immédiate. La SSI les a réunis dans une liste que l'encadré suivant reprend.</p>
<div class="alert"><b>Urgence à l'examen.</b> Selon la SSI, une fréquence respiratoire d'au moins 30 par minute, une saturation inférieure à 92 %, une pression systolique inférieure à 90 mmHg, une altération marquée de l'état général, une hémoptysie ou un stridor imposent une évaluation urgente et font envisager un traitement hospitalier. La SSI ajoute à cette liste la maladie pulmonaire sévère et l'immunodéficience sévère. Une confusion, des signes de choc ou une cyanose imposent une évaluation et un traitement immédiats.</div>
<p>La British Thoracic Society juge la cyanose centrale peu fiable, à la fois comme signe et comme indicateur de l'hypoxie des tissus ; l'oxymétrie de pouls la remplace dans la plupart des situations. Le médecin cherche aussi les signes d'hypoperfusion, comme des extrémités froides, un temps de recoloration allongé ou des marbrures, ainsi que les signes de déshydratation.</p>
<p>L'examen cherche enfin les signes qui orientent vers un autre diagnostic ou vers une complication. Une turgescence jugulaire, des œdèmes et des crépitants bilatéraux font évoquer un œdème pulmonaire cardiogénique. Un mollet gonflé et douloureux fait évoquer une embolie pulmonaire. Une matité franche avec abolition du murmure et des vibrations signale un épanchement pleural. Une raideur de nuque ou un trouble neurologique focal fait chercher une méningite, que le pneumocoque peut provoquer lorsqu'il passe dans le sang.</p>
<div class="key"><b>À retenir.</b> Les signaux d'alarme de la SSI imposent une évaluation urgente, et la confusion, le choc ou la cyanose un traitement immédiat. L'examen cherche aussi les signes d'un autre diagnostic, parce qu'une insuffisance cardiaque ou une embolie peuvent imiter une pneumonie.</div>
<h3>6.4 L'examen de Madame R.</h3>
<p>Madame R. est somnolente et désorientée dans le temps. Elle obtient 6 sur 10 au test mental abrégé, ce qui correspond à une confusion au sens du CURB-65. Sa température est de 38,9 °C, sa fréquence cardiaque de 112 par minute, sa fréquence respiratoire de 31 par minute, sa pression artérielle de 104/66 mmHg et sa saturation en air ambiant de 89 %. Ses muqueuses sont sèches. Ses extrémités sont chaudes, sans marbrures.</p>
<p>À la base droite, le médecin trouve une matité, des vibrations vocales augmentées, des crépitants et un souffle tubaire. Il n'y a ni œdème des membres inférieurs, ni turgescence jugulaire, ni mollet douloureux, ni raideur de nuque. Le reste de l'examen est normal.</p>
<p>Le médecin lit ces données dans l'ordre de la section. La fréquence respiratoire au-dessus de 30 par minute, la saturation au-dessous de 92 % et la confusion sont trois signaux d'alarme de la SSI. Le foyer droit, avec une matité, des vibrations augmentées et un souffle tubaire, traduit une consolidation plutôt qu'un épanchement. L'absence de signe d'insuffisance cardiaque ou de thrombose rend moins probables les deux principaux diagnostics différentiels urgents, sans les exclure.</p>
<div class="key"><b>À retenir.</b> L'examen mesure d'abord la gravité par six signes vitaux, puis il cherche le foyer, dont la valeur reste modeste. Madame R. présente une consolidation de la base droite et trois signaux d'alarme : elle doit être évaluée et traitée à l'hôpital. Ces constatations orientent le diagnostic et les décisions (section 7).</div><button class="pareto-btn ui" data-k="pareto-j18-clinique">▲ Loi de Pareto — Clinique</button></section>
