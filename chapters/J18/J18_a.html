<div class="chap-head"><div class="code">J18 · couvre J13 à J15, J18 · CIM-10-GM 2024 · Poumon, plèvre et ventilation</div><h1>Pneumonies de l'adulte</h1><span class="status">Édition de travail du 26.09.2026 · fiches SSI validées les 26.08.2026 et 01.09.2026, informations professionnelles suisses, Plan de vaccination suisse 2026 et recommandations internationales relus en texte intégral le 26.09.2026, sauf les recommandations 2025 de l'ATS, lues dans leur communiqué officiel · essais lus en texte intégral ou, à défaut, dans leur résumé · validation clinique indépendante en attente</span></div>

<section class="ilot" id="j18-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 71 ans, diabétique, a depuis trois jours de la fièvre, une toux nouvelle et une dyspnée. Sa fréquence respiratoire est de 31 par minute, sa saturation en air ambiant de 89 %, sa pression artérielle de 104/66 mmHg et elle paraît confuse. La question est immédiate : <b>une infection du parenchyme pulmonaire explique-t-elle le tableau, quelle est sa gravité, où la soigner et quel traitement commencer sans retard ?</b></p><p>À la fin de ce chapitre, le médecin assistant reconnaît une pneumonie communautaire probable et ses alternatives dangereuses, documente la gravité, demande les examens qui changent la conduite, prescrit une antibiothérapie conforme au contexte suisse lorsqu'elle est indiquée et réévalue sa réponse. Les pneumonies nosocomiales, d'aspiration et de l'immunodéprimé sont signalées ici pour orienter le triage ; leurs traitements détaillés dépendent d'autres protocoles et profils microbiologiques.</p><div class="key"><b>Fil directeur.</b> La pneumonie est une atteinte infectieuse du parenchyme pulmonaire. Le raisonnement associe symptômes, signes respiratoires, contexte et, en milieu hospitalier, une opacité nouvelle compatible. Un test biologique isolé n'affirme ni n'exclut le diagnostic ; la priorité initiale demeure l'oxygénation et la recherche d'un sepsis.</div></section>
<section class="ilot" id="j18-1"><h2><span class="n">1</span>Définition et classifications</h2><p>La <button class="w" data-k="j18-cap">pneumonie acquise en communauté (définition et limites)</button> commence hors de l'hôpital ou peu après l'admission, chez une personne sans infection nosocomiale préexistante. Une <button class="w" data-k="j18-hap">pneumonie nosocomiale (autre écologie bactérienne)</button> apparaît au plus tôt 48 heures après l'admission et n'était pas en incubation au départ ; une infection liée à une ventilation invasive relève d'une catégorie spécifique. Cette distinction change l'évaluation du risque de résistance et le protocole antibiotique.</p><p>Le qualificatif « typique » désigne souvent une fièvre, des expectorations et une consolidation lobaire ; « atypique » peut décrire une toux sèche, un syndrome extrapulmonaire et des infiltrats non lobaires. <b>Aucun de ces profils ne prouve l'agent causal.</b> Le pneumocoque peut être diffus et <i>Mycoplasma</i> peut donner une condensation. L'aspiration chimique immédiate et la pneumonie bactérienne secondaire après aspiration n'ont pas les mêmes indications d'antibiotiques.</p><p><b>Périmètre de ce cours.</b> Le cours traite la pneumonie communautaire bactérienne de l'adulte, codée dans la CIM-10-GM 2024 en J13 (pneumocoque), J14 (<i>Haemophilus influenzae</i>), J15 (autres bactéries, dont <i>Mycoplasma pneumoniae</i>) et J18 (agent non précisé). Les pneumonies virales (J12) appartiennent au périmètre de ce cours selon le plan de production ; leur développement propre est programmé lors de la réécriture du chapitre, en lien avec le futur cours J09 consacré à la grippe et aux viroses respiratoires. La catégorie J16 (pneumonies dues à d'autres micro-organismes) n'a pas de développement propre : la pneumonie à <i>Chlamydia</i> (J16.0) est abordée ici avec les agents atypiques couverts par les macrolides ; les pneumonies dues à d'autres agents précisés (J16.8) relèvent du cours consacré à l'agent en cause. La catégorie J17 (pneumonies au cours de maladies classées ailleurs) regroupe des codes astérisque, qui s'ajoutent au code de la maladie sous-jacente : la pneumonie relève alors du cours de cette maladie, par exemple la varicelle, la rougeole, l'aspergillose ou la toxoplasmose. Les pneumonies nosocomiales et les pneumonies d'inhalation sont hors du champ de ce cours et ne sont évoquées que pour orienter le triage.</p><table class="t"><tr><th>Catégorie pratique</th><th>Conséquence clinique</th></tr><tr><td>Communautaire, peu grave</td><td>Diagnostic et traitement souvent ambulatoires ; rechercher les critères de retour sûr.</td></tr><tr><td>Communautaire, hospitalisée</td><td>Imagerie, oxygénation, risque de sepsis ; antibiotiques selon gravité et terrain.</td></tr><tr><td>Communautaire sévère</td><td>Équipe de soins intensifs, support d'organes ; rechercher l'agent et les complications.</td></tr><tr><td>Nosocomiale ou sous ventilation</td><td>Écologie et protocole locaux ; échantillon respiratoire et risques de résistance.</td></tr></table><div class="trap"><span class="k">Piège</span>Un infiltrat radiologique n'est pas automatiquement infectieux : œdème pulmonaire, embolie avec infarctus, hémorragie alvéolaire et cancer peuvent produire une opacité.</div></section>
<section class="ilot" id="j18-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>La pneumonie communautaire touche particulièrement les personnes âgées, les personnes ayant une maladie pulmonaire ou cardiaque et les personnes immunodéprimées. Sa fréquence et sa létalité varient fortement avec le seuil d'hospitalisation, l'âge, les saisons et la définition utilisée. Aucune estimation unique de l'incidence suisse n'est retenue ici faute de série nationale contemporaine, homogène et directement comparable pour la ville et l'hôpital.</p><p>Le risque de décès croît avec l'hypoxémie, la confusion, l'instabilité circulatoire, les défaillances d'organes et les comorbidités. La guérison clinique précède souvent la disparition de l'opacité radiologique ; chez le sujet âgé, l'asthénie peut persister après le contrôle de l'infection. La prévention vaccinale et l'arrêt du tabac font partie de la prise en charge après l'épisode.</p></section>
<section class="ilot" id="j18-3"><h2><span class="n">3</span>Physiopathologie : de l'alvéole à l'hypoxémie</h2><p><b>État normal.</b> L'épithélium nasal, le transport mucociliaire, le réflexe de toux et les macrophages alvéolaires limitent l'inoculum qui parvient aux alvéoles. La fine membrane alvéolocapillaire et le surfactant permettent les échanges gazeux pendant que le sang perfuse une unité ventilée.</p><p><b>Entrée et défense.</b> La microaspiration de sécrétions oropharyngées, l'inhalation d'aérosols ou la dissémination hématogène amènent un agent au poumon. Les <button class="w" data-k="j18-macro">macrophages alvéolaires (première réponse innée)</button> recrutent des neutrophiles et augmentent la perméabilité capillaire ; la présence de liquide et de cellules inflammatoires dans les alvéoles définit l'<button class="w" data-k="j18-exsudat">exsudat de consolidation (rapport avec les signes)</button>.</p><p><b>Conséquence fonctionnelle.</b> Les alvéoles remplies de liquide sont moins ventilées alors qu'elles restent perfusées. Le <button class="w" data-k="j18-shunt">shunt intrapulmonaire (cause de l'hypoxémie)</button> réduit la teneur artérielle en oxygène ; la fréquence respiratoire augmente pour compenser. L'inflammation systémique explique fièvre et parfois confusion, vasodilatation, hypotension et atteinte rénale dans le sepsis. La pleurésie adjacente cause une douleur à l'inspiration.</p><figure><svg viewBox="0 0 660 300" role="img" aria-label="Schéma comparant la défense et les échanges gazeux de l'alvéole normale, puis le mécanisme alvéolaire de la pneumonie aboutissant à l'hypoxémie" font-family="Inter,sans-serif" font-size="12"><g fill="#222" font-weight="bold"><text x="8" y="18">A. État normal</text><text x="8" y="136">B. Pneumonie</text></g><g fill="none" stroke="#222" stroke-width="1.4"><rect x="8" y="28" width="114" height="72" rx="8"/><rect x="143" y="28" width="114" height="72" rx="8"/><rect x="278" y="28" width="114" height="72" rx="8"/><rect x="413" y="28" width="114" height="72" rx="8"/><rect x="548" y="28" width="105" height="72" rx="8"/><path d="M122 64h18M257 64h18M392 64h18M527 64h18"/><rect x="8" y="146" width="114" height="72" rx="8"/><rect x="143" y="146" width="114" height="72" rx="8"/><rect x="278" y="146" width="114" height="72" rx="8"/><rect x="413" y="146" width="114" height="72" rx="8"/><rect x="548" y="146" width="105" height="72" rx="8"/><path d="M122 182h18M257 182h18M392 182h18M527 182h18"/></g><g fill="#222" text-anchor="middle"><text x="65" y="55">Épuration</text><text x="65" y="75">mucociliaire, toux</text><text x="200" y="55">Macrophages</text><text x="200" y="75">résidents</text><text x="335" y="55">Alvéole aérée,</text><text x="335" y="75">surfactant</text><text x="470" y="50">Ventilation</text><text x="470" y="66">et perfusion</text><text x="470" y="82">appariées</text><text x="600" y="55">Sang artériel</text><text x="600" y="75">bien oxygéné</text><text x="65" y="173">Microaspiration,</text><text x="65" y="193">aérosol, sang</text><text x="200" y="173">Macrophages</text><text x="200" y="193">et neutrophiles</text><text x="335" y="173">Exsudat</text><text x="335" y="193">intra-alvéolaire</text><text x="470" y="173">Ventilation</text><text x="470" y="193">locale réduite</text><text x="600" y="173">Hypoxémie</text><text x="600" y="193">et dyspnée</text><text x="330" y="256">Perfusion maintenue dans une zone peu ventilée : effet shunt.</text><text x="330" y="278">La consolidation transmet mieux les vibrations vocales et peut produire un souffle tubaire.</text></g></svg><figcaption>Figure 1 — Défenses et échanges gazeux de l'alvéole normale (A), puis réponse inflammatoire alvéolaire de la pneumonie et conséquence sur l'oxygénation (B), schéma pédagogique ; chaque colonne met en regard l'état normal et sa perturbation.</figcaption></figure><div class="key"><b>Corrélation clinique.</b> Les crépitants proviennent de la réouverture de petites voies aériennes et de l'atteinte alvéolaire ; la matité et le souffle tubaire orientent vers une consolidation, mais leur absence n'exclut pas une pneumonie chez une personne âgée ou déshydratée. Une saturation basse traduit le retentissement fonctionnel, sans indiquer à elle seule le germe.</div></section>
<section class="ilot" id="j18-4"><h2><span class="n">4</span>Agents et facteurs de risque</h2><p><b>Communauté.</b> Le pneumocoque reste un agent bactérien majeur. <i>Haemophilus influenzae</i> apparaît notamment en présence d'une maladie bronchique ; virus respiratoires (grippe, virus respiratoire syncytial, coronavirus) et agents dits atypiques (<i>Mycoplasma pneumoniae</i>, <i>Legionella</i>) dépendent de la saison et de l'exposition. La légionellose peut associer diarrhée, confusion et hyponatrémie : ces indices orientent, sans constituer une preuve.</p><div class="two"><div class="card"><h4>Facteurs du patient</h4><p>Âge élevé, bronchopneumopathie chronique, maladie cardiaque, diabète, insuffisance rénale, tabagisme, trouble de déglutition, alcool, asplénie, déficit immunitaire et immunosuppression médicamenteuse.</p></div><div class="card"><h4>Exposition et écologie</h4><p>Contact avec des virus respiratoires, vie en collectivité, aérosols d'eau contaminée pour <i>Legionella</i>, antibiotiques ou hospitalisation récents, antécédents de bactérie résistante documentée. Un facteur isolé ne justifie pas automatiquement un antibiotique de très large spectre.</p></div></div><div class="trap"><span class="k">Piège</span>Le terme « pneumonie d'aspiration » ne suffit pas à prescrire une couverture anaérobie systématique ; la présence d'un abcès, d'un empyème ou d'une maladie parodontale sévère change la discussion.</div></section>
<section class="ilot" id="j18-5"><h2><span class="n">5</span>Anamnèse : caractériser la maladie et le terrain</h2><h3>5.1 Antécédents ciblés</h3><div class="two"><div class="card"><h4>Poumon et défense</h4><p><button class="w" data-k="j18-a-poumon">Maladie pulmonaire et hospitalisations (terrain et résistances)</button><br><button class="w" data-k="j18-a-immune">Immunodépression, splénectomie, corticothérapie (agents particuliers)</button><br><button class="w" data-k="j18-a-vaccin">Vaccinations grippe et pneumocoque (prévention et limites)</button></p></div><div class="card"><h4>Exposition et sécurité</h4><p><button class="w" data-k="j18-a-asp">Dysphagie, troubles de conscience et aspiration (contexte et chronologie)</button><br><button class="w" data-k="j18-a-expo">Voyage, exposition hydrique et entourage malade (agents à rechercher)</button><br><button class="w" data-k="j18-a-drug">Antibiotiques récents, allergies et fonction rénale (choix et doses)</button></p></div></div><h3>5.2 Symptômes fonctionnels</h3><div class="two"><div class="card"><h4>Dominants</h4><p><button class="w" data-k="j18-s-fievre">Fièvre ou hypothermie (évolution et exceptions)</button> ; <button class="w" data-k="j18-s-toux">toux et expectoration (apparition, couleur, limites)</button> ; <button class="w" data-k="j18-s-dysp">dyspnée (intensité, progression, état de base)</button>.</p></div><div class="card"><h4>Associés et alarmes</h4><p><button class="w" data-k="j18-s-doul">Douleur pleurétique (différentiel urgent)</button> ; <button class="w" data-k="j18-s-conf">confusion et chutes (présentation du sujet âgé)</button> ; <button class="w" data-k="j18-s-hemo">hémoptysie (exclure une autre cause)</button>.</p></div></div><div class="two"><div class="card"><h4>Tableau fréquent</h4><p>Début aigu, fièvre, toux, tachypnée, baisse de la saturation et foyer de crépitants ou d'opacité.</p></div><div class="card"><h4>Tableau du sujet âgé</h4><p>Confusion, chute, perte d'autonomie ou anorexie peuvent précéder la fièvre et la toux ; mesurer systématiquement les constantes.</p></div><div class="card"><h4>Tableau viral</h4><p>Contexte épidémique, myalgies, atteinte diffuse ; une surinfection bactérienne peut suivre une amélioration initiale.</p></div><div class="card"><h4>Tableau compliqué</h4><p>Douleur thoracique persistante, dyspnée progressive, fièvre malgré traitement : chercher épanchement pleural, empyème ou diagnostic alternatif.</p></div></div></section>
<section class="ilot" id="j18-6"><h2><span class="n">6</span>Examen clinique : mesurer et interpréter</h2><div class="two"><div class="card"><h4>État général et signes vitaux</h4><p><button class="w" data-k="j18-v-fr">Fréquence respiratoire (mesure complète, seuil et piège)</button> ; <button class="w" data-k="j18-v-spo">saturation en air ambiant (mesure et limites)</button> ; <button class="w" data-k="j18-v-ta">pression artérielle et perfusion (choc)</button> ; température, pouls, état mental et capacité à boire. Rechercher un travail respiratoire excessif.</p></div><div class="card"><h4>Inspection, percussion, auscultation</h4><p><button class="w" data-k="j18-x-crep">Crépitants localisés (technique et limites)</button>, <button class="w" data-k="j18-x-mat">matité et vibrations vocales (consolidation ou épanchement)</button>, <button class="w" data-k="j18-x-souffle">souffle tubaire (transmission et faux positifs)</button>. Une auscultation normale ne permet pas d'écarter la maladie.</p></div></div><div class="alert"><b>Urgence à l'examen.</b> Une fréquence respiratoire d'au moins 30/min, une saturation inférieure à 92 %, une pression systolique inférieure à 90 mmHg, une altération marquée de l'état général, une hémoptysie ou un stridor exigent une évaluation urgente et font envisager un traitement hospitalier selon les repères suisses pour les infections respiratoires aiguës, qui y ajoutent la maladie pulmonaire sévère et l'immunodéficience sévère. Confusion, signes de choc ou cyanose imposent une évaluation et un traitement immédiats.</div><button class="pareto-btn ui" data-k="pareto-j18-clinique">▲ Loi de Pareto — Clinique</button></section>
