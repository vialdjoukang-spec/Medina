<template data-pop="c86-famille" data-title="Lymphomes T et NK matures : une famille de sept maladies">
<div class="lab">Définition</div><p>Les lymphomes T périphériques, ou PTCL, sont des lymphomes agressifs dont les cellules ont le phénotype de lymphocytes T post-thymiques matures ou de cellules NK. Ils peuvent être nodaux ou extranodaux. Le traitement systémique de première ligne a une intention curative.</p>
<div class="lab">Évolution naturelle</div><p>Sans traitement, la plupart des entités progressent rapidement. Les exceptions sont la papulose lymphomatoïde, le mycosis fongoïde, la leucémie à grands lymphocytes granuleux T et les formes indolentes. Cette distinction commande toute la leçon : on traite sans attendre les entités agressives, on surveille les entités indolentes.</p>
<div class="lab">Pourquoi un seul code pour sept maladies</div><p>La CIM-10-GM 2024 regroupe sous C86 les lymphomes T ou NK « spécifiés » qui ne trouvent pas place ailleurs. Le code C84.5 (autres lymphomes T/NK matures) exclut explicitement toutes les entités C86.0 à C86.6, et C86 exclut à son tour le lymphome anaplasique à grandes cellules systémique, ALK positif (C84.6) ou négatif (C84.7). Le regroupement est donc administratif. Sur le plan clinique, la survie spécifique à cinq ans va de 99 % (papulose lymphomatoïde) à moins de 20 % (lymphomes T gamma-delta et NK/T).</p>
<div class="lab">Limite</div><p>Les sources lues ne fournissent aucun chiffre suisse par sous-code. La seule source suisse sur le traitement est une revue de 2021 de la Schweizer Zeitschrift für Onkologie ; Onkopedia est une recommandation commune aux sociétés allemande, autrichienne et suisse.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc C81-C96</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">Mise à jour OMS-EORTC 2018 des lymphomes cutanés primitifs (Willemze et al.)</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a>.</p></template>
<template data-pop="c86-classif" data-title="Classifications actuelles et correspondances">
<div class="lab">Deux classifications superposables</div><p>La 5e édition de la classification de l’OMS et la classification consensuelle internationale ICC 2022 décrivent les mêmes entités pour l’essentiel. La CIM-10-GM 2024 reste le référentiel de codage ; son vocabulaire est plus ancien.</p>
<div class="lab">Correspondances</div><ul><li><b>C86.0</b> : lymphome extranodal NK/T. L’OMS 5e édition abandonne « type nasal », car des sites extranodaux autres que le nez sont touchés.</li><li><b>C86.1</b> : lymphome T hépatosplénique, environ 75 % TCR gamma-delta, 25 % alpha-bêta, 5 % à TCR silencieux. Dans une série récente, 49 % des patients ont moins de 60 ans : la maladie n’est donc pas nécessairement une maladie du sujet jeune.</li><li><b>C86.2</b> : lymphome T associé à une entéropathie (EATL), avec mutations JAK1/STAT3 et gains 9q34. Le lymphome T intestinal épithéliotrope monomorphe (MEITL) est une entité distincte, sans lien avec la maladie cœliaque, à mutations SETD2 et JAK3/STAT5B.</li><li><b>C86.3</b> : lymphome T sous-cutané de type panniculite, réservé au phénotype alpha-bêta depuis l’étude EORTC ; la forme gamma-delta est un lymphome T gamma-delta cutané primitif, de pronostic très différent.</li><li><b>C86.4</b> : néoplasme blastique à cellules dendritiques plasmacytoïdes, classé depuis l’OMS 2016 avec les néoplasmes myéloïdes et les leucémies aiguës ; le code reste un héritage nosologique.</li><li><b>C86.5</b> : lymphome T folliculaire helper nodal, type angio-immunoblastique, nouveau nom de l’AITL.</li><li><b>C86.6</b> : papulose lymphomatoïde et lymphome anaplasique à grandes cellules cutané primitif, inchangés.</li></ul>
<div class="lab">Limite</div><p>La classification ICC 2022 n’a pas été lue en texte intégral dans le dossier de recherche ; la correspondance repose sur l’OMS 5e édition et sur Onkopedia.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, 2022 (Alaggio et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://doi.org/10.1182/blood-2007-04-087288" target="_blank" rel="noopener">Willemze et al., SPTCL, Blood 2008</a> ; <a href="https://doi.org/10.1007/s00105-023-05192-9" target="_blank" rel="noopener">Nguyen et al., BPDCN, Die Dermatologie 2023</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc C81-C96</a>.</p></template>
<template data-pop="c86-enktl" data-title="Lymphome extranodal NK/T (C86.0)">
<div class="lab">Définition et épidémiologie</div><p>Lymphome à cellules NK/T, porteuses de l’EBV. Il prédomine en Asie et en Amérique du Sud, et les cas occidentaux sont de plus en plus rapportés. La forme nasale représente environ 80 % des cas, la forme non nasale 15 à 20 % (peau, tube digestif, testicule, glandes salivaires), la forme leucémique agressive moins de 5 %.</p>
<div class="lab">Mécanisme</div><p>L’EBV est présent dans pratiquement toutes les cellules tumorales en latence II, avec l’oncoprotéine LMP1. Les cellules expriment fortement la glycoprotéine P, d’où la résistance aux anthracyclines, et ont une faible activité d’asparagine synthétase, d’où la sensibilité à l’asparaginase (<button class="w" data-k="c86-pgp">glycoprotéine P et asparagine synthétase</button>).</p>
<div class="lab">Clinique</div><p>Obstruction nasale, épistaxis, destruction médiane du palais dur dans la forme nasale, avec atteinte de la cavité nasale, des sinus, du nasopharynx et de l’oropharynx.</p>
<div class="lab">Diagnostic</div><p>Critère OMS : EBV positif (EBER) <b>et</b> CD56 ou molécules cytotoxiques. Le CD3 de surface est négatif, le CD3ε cytoplasmique est positif et le récepteur T est en configuration germinale. L’ADN d’EBV se dose dans le plasma et non dans le sang total (<button class="w" data-k="c86-ebv">marqueur plasmatique</button>). L’IRM porte sur le massif facial, le SNC et les voies aérodigestives.</p>
<div class="lab">Pronostic</div><p>Les index PINK et PINK-E sont adaptés à l’ENKTL (<button class="w" data-k="c86-index">index pronostiques</button>). Dans les registres de lymphomes cutanés, la survie spécifique à cinq ans du lymphome NK/T cutané est de 16 %.</p>
<div class="lab">Traitement</div><p>Stades I–II : radiothérapie d’au moins 50 Gy avec chimiothérapie sans anthracycline, contenant de l’asparaginase (II, A). Stades III–IV : DDGP ou mSMILE si greffe possible, AspaMetDex ou P-GemOx sinon (III, B). Rechute : pembrolizumab ou nivolumab (III, B), non autorisés par l’EMA dans cette indication. Objectifs de fin de traitement : ADN d’EBV indétectable et Deauville ≤ 3 (<button class="w" data-k="c86-asp">schémas à asparaginase</button> ; <button class="w" data-k="c86-rt">radiothérapie</button>).</p>
<div class="lab">Statut suisse</div><p>L’Oncaspar (pégaspargase) n’est autorisé en Suisse que dans la leucémie lymphoblastique aiguë : son emploi dans l’ENKTL est hors étiquette.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">Tse et al., How we treat NK/T-cell lymphomas, 2022</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">Mise à jour OMS-EORTC 2018 des lymphomes cutanés primitifs (Willemze et al.)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Oncaspar, septembre 2025 (AIPS, GTIN 7680669340018)</a>.</p></template>
<template data-pop="c86-hstl" data-title="Lymphome T hépatosplénique (C86.1)">
<div class="lab">Définition</div><p>Lymphome T extranodal rare (moins de 1 % des lymphomes), composé le plus souvent de cellules à TCR gamma-delta (environ 75 %), parfois alpha-bêta (25 %) ou à TCR silencieux (5 %). C’est le seul lymphome T périphérique non leucémique avec une atteinte médullaire presque constante, typiquement intrasinusoïdale.</p>
<div class="lab">Contexte</div><p>Environ 30 % des cas surviennent sur immunosuppression chronique ; Onkopedia indique une immunosuppression préexistante, souvent iatrogène, dans environ 20 % des cas. Le risque est maximal chez l’homme de moins de 35 ans atteint de maladie de Crohn et traité depuis au moins deux ans par thiopurine et anti-TNF (<button class="w" data-k="c86-thiopurine">risque et prévention</button>). L’âge médian est de 40 à 60 ans.</p>
<div class="lab">Clinique et biologie</div><p>Dans la revue de cas de Carvão, la splénomégalie est présente chez 11 patients sur 11, l’hépatomégalie chez 7 sur 11, les symptômes généraux chez 73 % ; l’anémie touche 86 % des patients et la leucopénie 71 % ; une thrombopénie est notée. Il n’y a pas d’adénopathie chez le patient index. La dysmyélopoïèse médullaire peut simuler un syndrome myélodysplasique.</p>
<div class="lab">Cytogénétique</div><p>Isochromosome 7q, anomalies des chromosomes 8 et 13, dans un contexte de stimulation antigénique chronique.</p>
<div class="lab">Traitement</div><p>Un schéma plus intensif que le CHOP est recommandé (III, A), avec ICE préféré (IV, B) : dans une méta-analyse de 166 patients, la réponse globale atteint 82 % contre 52 % et la survie médiane 37 contre 18 mois pour les schémas non-CHOP. La consolidation par greffe, de préférence allogénique (III, A), donne dans les données de l’EBMT une survie sans progression à trois ans de 51 % et une survie de 55 %. La réponse est confirmée par biopsie médullaire et, si possible, hépatique (III, A) (<button class="w" data-k="c86-ice">ICE et greffe</button>).</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">Carvão et al., lymphome T hépatosplénique et thiopurines, 2019</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, 2022 (Alaggio et al.)</a>.</p></template>
<template data-pop="c86-eatl" data-title="Lymphome T associé à une entéropathie (C86.2) et MEITL">
<div class="lab">Définition</div><p>Lymphome T de l’intestin grêle lié à la maladie cœliaque. Dans 80 à 90 % des cas, il naît d’une maladie cœliaque réfractaire, avec un risque relatif accru de 10 à 20 fois. Il porte des mutations JAK1/STAT3 et des gains 9q34. Le MEITL est une entité distincte : il n’est pas lié à la maladie cœliaque et présente des mutations SETD2 et JAK3/STAT5B.</p>
<div class="lab">Voie de transformation</div><p>Maladie cœliaque, puis maladie cœliaque réfractaire de type II, puis lymphome (<button class="w" data-k="c86-rcd">de la maladie cœliaque au lymphome</button>).</p>
<div class="lab">Clinique</div><p>Risque de perforation intestinale, à évaluer par endoscopie ; une résection limitée peut être discutée. Le tableau clinique détaillé de l’EATL (perte de poids, douleurs, saignements) n’a pas été trouvé dans une source lue : il n’est pas décrit ici.</p>
<div class="lab">Diagnostic</div><p>Dans la maladie cœliaque réfractaire de type II, la vidéocapsule, l’entéroscopie, la TEP et l’entéro-IRM servent à exclure un EATL ou une jéjunite ulcéreuse (III, A).</p>
<div class="lab">Traitement</div><p>Patient apte : un cycle de CHOP ou CHOEP, puis trois cycles IVE alternant avec du méthotrexate à dose intermédiaire, puis autogreffe (III, B), avec une survie à cinq ans de 60 % (n = 26). Patient fragile : CHOP-like ou BV-CHP. La recherche d’un donneur commence dès le diagnostic.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6545713/" target="_blank" rel="noopener">ESsCD 2019, maladie cœliaque (Al-Toma et al.)</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, 2022 (Alaggio et al.)</a>.</p></template>
<template data-pop="c86-sptcl" data-title="Lymphome T sous-cutané de type panniculite (C86.3)">
<div class="lab">Définition</div><p>Lymphome cutané primitif des cellules T alpha-bêta, généralement confiné à l’hypoderme, présent sous forme de nodules et de plaques sous-cutanés. Sa fréquence est de 1 % des lymphomes cutanés dans les registres néerlandais et autrichien. La forme gamma-delta est un autre lymphome, avec atteinte (épi)dermique, ulcération et CD56 variable.</p>
<div class="lab">Pronostic</div><p>Dans l’étude EORTC de 83 cas, la survie globale à cinq ans est de 82 % pour la forme alpha-bêta : 91 % sans syndrome d’activation lymphohistiocytaire et 46 % avec. Ce syndrome complique 17 % des cas. La forme gamma-delta a une survie à cinq ans de 11 %.</p>
<div class="lab">Génétique</div><p>Des variants germinaux de perte de fonction de HAVCR2 (TIM-3) sont retrouvés dans environ 60 % des cas (<button class="w" data-k="c86-havcr2">HAVCR2 et TIM-3</button>).</p>
<div class="lab">Traitement</div><p>Chez les patients de forme alpha-bêta sans SLH, le pronostic est excellent et la polychimiothérapie de première intention doit être remise en question. Les patients atteints de SPTCL avec SLH et TIM-3 muté bénéficient d’une immunomodulation. Les schémas précis (corticoïdes, ciclosporine) n’ont pas été lus dans une recommandation européenne : ils ne sont pas détaillés ici, de même que la panniculite lupique, diagnostic différentiel classique non lu dans les sources.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1182/blood-2007-04-087288" target="_blank" rel="noopener">Willemze et al., SPTCL, Blood 2008</a> ; <a href="https://doi.org/10.1038/s41588-018-0251-4" target="_blank" rel="noopener">Gayden et al., Nature Genetics 2018</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">Moonla et al., Haematologica 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">Mise à jour OMS-EORTC 2018 des lymphomes cutanés primitifs (Willemze et al.)</a>.</p></template>
<template data-pop="c86-bpdcn" data-title="Néoplasme blastique à cellules dendritiques plasmacytoïdes (C86.4)">
<div class="lab">Définition</div><p>Néoplasme dérivé des précurseurs des cellules dendritiques plasmacytoïdes, classé depuis l’OMS 2016 avec les néoplasmes myéloïdes et les leucémies aiguës. Son intitulé CIM-10-GM, « lymphome blastique à cellules NK », est un héritage.</p>
<div class="lab">Épidémiologie</div><p>Environ 0,44 % des hémopathies malignes, rapport hommes/femmes d’environ 3 pour 1, surtout à la septième décennie avec des pics bimodaux au-delà de 60 ans et avant 20 ans.</p>
<div class="lab">Clinique</div><p>Plaques ou nodules érythémateux à violacés, jusqu’à 10 cm, du tronc, des membres ou du visage. Des cytopénies, surtout une thrombopénie, accompagnent l’atteinte médullaire. Les ganglions et le système nerveux central peuvent être touchés ; l’atteinte cutanée manque rarement.</p>
<div class="lab">Diagnostic</div><p>Phénotype CD123, CD4, CD56 et TCL1 positifs, marqueurs de lignée négatifs ; CD303, HLA-DR, CD7 et CD33 possibles. Cytométrie en flux et biopsie ostéomédullaire. Diagnostics différentiels : leucémie aiguë myéloïde, lymphomes cutanés non hodgkiniens.</p>
<div class="lab">Traitement et pronostic</div><p>Tagraxofusp en première ligne chez l’adulte (autorisé en Suisse), allogreffe en première rémission, autogreffe en l’absence de donneur ; venetoclax et inhibiteurs BET en investigation. La survie médiane est de 12 à 14 mois et de 23 mois avec allogreffe en première rémission (<button class="w" data-k="c86-tagra">monographie du tagraxofusp</button>).</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1007/s00105-023-05192-9" target="_blank" rel="noopener">Nguyen et al., BPDCN, Die Dermatologie 2023</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Elzonris, novembre 2022 (AIPS, GTIN 7680687970013)</a>.</p></template>
<template data-pop="c86-ntfh" data-title="Lymphome T folliculaire helper nodal, type angio-immunoblastique (C86.5)">
<div class="lab">Définition</div><p>Lymphome nodal dont la cellule tumorale est un lymphocyte T folliculaire helper. Il s’appelait lymphome angio-immunoblastique (AITL). Le diagnostic de phénotype TFH exige au moins deux marqueurs parmi CD10, BCL6, PD1, ICOS et CXCL13.</p>
<div class="lab">Mécanisme</div><p>Mutations acquises par étapes : TET2 et DNMT3A tôt dans la cellule souche hématopoïétique (hématopoïèse clonale), puis RHOA G17V (jusqu’à 80 %) et IDH2 R172 (environ un tiers) dans la cellule TFH tumorale (<button class="w" data-k="c86-tfh">mutations par étapes</button>).</p>
<div class="lab">Clinique</div><p>Hypergammaglobulinémie polyclonale, anémie hémolytique auto-immune à Coombs positif et proliférations B EBV positives. Évolution parfois indolente.</p>
<div class="lab">Traitement</div><p>CHOP ou CHOEP (II, B) ; trois à quatre cycles si forme limitée favorable (IV, B) ; ISRT de 30 à 40 Gy (IV, B) ; autogreffe chez les répondeurs à haut risque (III, B). En rechute : azacitidine orale (III, B), romidepsine avec une réponse globale inférieure à 40 %, ciclosporine et lénalidomide actifs. La recherche de donneur pour une allogreffe se fait à la rechute.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, 2022 (Alaggio et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a>.</p></template>
<template data-pop="c86-cd30" data-title="Proliférations lymphoïdes T cutanées CD30 positives (C86.6)">
<div class="lab">Définition</div><p>Deux entités du spectre CD30 positif : la <b>papulose lymphomatoïde (LyP)</b> et le <b>lymphome anaplasique à grandes cellules cutané primitif (pcALCL)</b>. La LyP représente 12 % et le pcALCL 8 % des lymphomes cutanés dans les registres néerlandais et autrichien ; ensemble, les proliférations CD30 positives forment le deuxième groupe de lymphomes T cutanés (environ 25 %).</p>
<div class="lab">Clinique</div><p>LyP : papules ou nodules papulonécrotiques récidivants et autorésolutifs, dont chaque lésion régresse en semaines à mois. pcALCL : nodule ou tumeur solitaire ou groupée, rarement multifocale, souvent ulcérée ; régression spontanée jusqu’à 44 % ; dissémination extracutanée dans 10 à 15 % des cas.</p>
<div class="lab">Génétique</div><p>Réarrangements DUSP22-IRF4 dans environ 25 % des pcALCL ; pas de translocation ALK dans la majorité des cas. Une expression d’ALK doit faire rechercher un lymphome systémique ALK positif.</p>
<div class="lab">Pronostic</div><p>Survie spécifique à cinq ans : LyP 99 %, pcALCL 95 % (OMS-EORTC) ou 76 à 96 % (consensus 2011). Un second lymphome (mycosis fongoïde, lymphome anaplasique, lymphome de Hodgkin) survient chez 4 à 25 % des patients atteints de LyP.</p>
<div class="lab">Traitement</div><p>Voir <button class="w" data-k="c86-lyp-trt">traitements de la LyP et du pcALCL</button>. Le critère formel du pcALCL est un CD30 sur au moins 75 % des cellules tumorales, en l’absence de LyP, de mycosis fongoïde et d’atteinte extracutanée (<button class="w" data-k="c86-diffdx">différentiels et types</button>).</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">Mise à jour OMS-EORTC 2018 des lymphomes cutanés primitifs (Willemze et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">Consensus EORTC, ISCL et USCLC 2011 (Kempf et al.)</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, 2022 (Alaggio et al.)</a>.</p></template>
<template data-pop="c86-ebv" data-title="Virus d’Epstein-Barr et ENKTL">
<div class="lab">Mécanisme</div><p>L’EBV est présent dans pratiquement toutes les cellules tumorales de l’ENKTL, en latence II, avec expression de l’oncoprotéine LMP1. Les cellules tumorales en apoptose libèrent de l’ADN viral dans le plasma.</p>
<div class="lab">Application</div><p>La recherche d’EBER sur la biopsie établit que le virus est dans la cellule tumorale ; le dosage d’ADN viral plasmatique mesure la masse tumorale, au diagnostic et pendant le traitement (II, A). L’objectif de fin de traitement est un ADN indétectable. La détection d’ADN d’EBV entre aussi dans l’index PINK-E.</p>
<div class="lab">Plasma et non sang total</div><p>Les sources précisent que le dosage porte sur le plasma et non sur le sang total. L’ADN viral du plasma provient des cellules tumorales en apoptose ; les sources lues ne détaillent pas d’autre raison analytique.</p>
<div class="lab">Limites</div><p>Une sérologie EBV positive ne fait pas le diagnostic. Dans le lymphome T folliculaire helper, des proliférations B EBV positives peuvent apparaître : l’EBV n’est donc pas spécifique de l’ENKTL.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">Tse et al., How we treat NK/T-cell lymphomas, 2022</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a>.</p></template>
<template data-pop="c86-pgp" data-title="Glycoprotéine P et asparagine synthétase : deux clés thérapeutiques de l’ENKTL">
<div class="lab">Résistance aux anthracyclines</div><p>Les cellules NK expriment fortement la glycoprotéine P, ce qui définit un phénotype de multirésistance. Les anthracyclines du CHOP sont donc inefficaces ; c’est la raison pour laquelle les recommandations réservent à l’ENKTL des chimiothérapies sans anthracycline.</p>
<div class="lab">Sensibilité à l’asparaginase</div><p>Les cellules à faible activité d’asparagine synthétase sont sensibles à l’asparaginase. Faute de pouvoir fabriquer elles-mêmes l’asparagine, elles dépendent de l’asparagine extérieure ; l’asparaginase la réduit. Cette dernière phrase est une explication pédagogique de la sensibilité décrite, non une citation.</p>
<div class="lab">Conséquence</div><p>Stades I–II : radiothérapie et chimiothérapie avec asparaginase. Stades III–IV : DDGP, mSMILE, AspaMetDex ou P-GemOx, selon l’éligibilité à la greffe. En Suisse, le pégaspargase n’est autorisé que dans la leucémie lymphoblastique aiguë.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">Tse et al., How we treat NK/T-cell lymphomas, 2022</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Oncaspar, septembre 2025 (AIPS, GTIN 7680669340018)</a>.</p></template>
<template data-pop="c86-havcr2" data-title="HAVCR2 (TIM-3), SPTCL et syndrome d’activation lymphohistiocytaire">
<div class="lab">Génétique</div><p>Des variants germinaux de perte de fonction de HAVCR2, le gène de TIM-3, sont retrouvés dans environ 60 % des SPTCL. Le variant p.Ile97Met prédomine chez les patients d’ascendance européenne et p.Tyr82Cys en Asie de l’Est.</p>
<div class="lab">Mécanisme</div><p>Le défaut d’expression de TIM-3 à la membrane entretient une activation immunitaire persistante, avec production accrue de TNF-α et d’interleukine 1β. Cette activation aboutit au syndrome d’activation lymphohistiocytaire.</p>
<div class="lab">Risque</div><p>Dans l’étude multicentrique et méta-analyse de Moonla (2023), le sexe masculin et les mutations de HAVCR2 augmentent le risque de SLH ; les odds ratios ajustés rapportés sont de 2,93, de 4,77 chez l’hétérozygote et de 8,48 chez l’homozygote. Le SLH du SPTCL est associé à l’âge inférieur à 18 ans et aux mutations de HAVCR2.</p>
<div class="lab">Conséquence thérapeutique</div><p>Les patients atteints de SPTCL avec SLH et TIM-3 muté bénéficient d’une immunomodulation.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1038/s41588-018-0251-4" target="_blank" rel="noopener">Gayden et al., Nature Genetics 2018</a> ; <a href="https://doi.org/10.3324/haematol.2022.282419" target="_blank" rel="noopener">Moonla et al., Haematologica 2023</a> ; <a href="https://doi.org/10.1182/blood-2007-04-087288" target="_blank" rel="noopener">Willemze et al., SPTCL, Blood 2008</a>.</p></template>
<template data-pop="c86-slh" data-title="Syndrome d’activation lymphohistiocytaire (SLH)">
<div class="lab">Définition et fréquence</div><p>Le SLH est un emballement immunitaire. Chez l’adulte, la cause la plus fréquente de SLH secondaire est un lymphome agressif, notamment le lymphome T gamma-delta cutané et le HSTL. Dans le SPTCL alpha-bêta, il complique 17 % des cas.</p>
<div class="lab">Pronostic</div><p>Dans le SPTCL, la survie à cinq ans passe de 91 % sans SLH à 46 % avec SLH : le pronostic est divisé par deux.</p>
<div class="lab">Conduite</div><p>Le traitement rapide du lymphome sous-jacent est la mesure documentée ; chez les patients SPTCL porteurs de TIM-3 muté, une immunomodulation est bénéfique.</p>
<div class="lab">Lacune</div><p>Les critères diagnostiques HLH-2004 n’ont pas été lus dans ce dossier. Aucun seuil biologique de diagnostic du SLH n’est donc donné dans ce cours, et le lecteur se reporte à la source primaire.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://doi.org/10.1182/blood-2007-04-087288" target="_blank" rel="noopener">Willemze et al., SPTCL, Blood 2008</a> ; <a href="https://doi.org/10.1038/s41588-018-0251-4" target="_blank" rel="noopener">Gayden et al., Nature Genetics 2018</a>.</p></template>
<template data-pop="c86-rcd" data-title="De la maladie cœliaque au lymphome : maladie cœliaque réfractaire de type II">
<div class="lab">Chaîne</div><p>Maladie cœliaque, puis maladie cœliaque réfractaire de type II, caractérisée par des lymphocytes intraépithéliaux aberrants supérieurs à 20 %, puis EATL. La jéjunite ulcéreuse est par définition une maladie cœliaque réfractaire de type II.</p>
<div class="lab">Critères</div><p>Villosités atrophiques persistant malgré un régime sans gluten strict de plus de 12 mois, et lymphocytes intraépithéliaux aberrants supérieurs à 20 % (ESsCD 2019).</p>
<div class="lab">Génétique</div><p>Les patients de type II sont plus souvent homozygotes HLA-DQ2 (44 à 60 %).</p>
<div class="lab">Conduite</div><p>Exclure un EATL par capsule et TEP (III, A) ; surveiller l’intestin grêle tous les 6 à 12 mois (IV, B). Le médecin exclut aussi la jéjunite ulcéreuse.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6545713/" target="_blank" rel="noopener">ESsCD 2019, maladie cœliaque (Al-Toma et al.)</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a>.</p></template>
<template data-pop="c86-tfh" data-title="Lymphocytes T folliculaires helper et mutations par étapes">
<div class="lab">Phénotype</div><p>Les lymphocytes TFH expriment CD10, BCL6, PD1, ICOS et CXCL13. Le phénotype TFH d’un lymphome est retenu si au moins deux de ces marqueurs sont positifs.</p>
<div class="lab">Mutations</div><p>Les mutations de TET2 et de DNMT3A surviennent tôt, dans la cellule souche hématopoïétique, et réalisent une hématopoïèse clonale. Les mutations RHOA G17V (jusqu’à 80 %) et IDH2 R172 (environ un tiers des cas) surviennent dans la cellule TFH tumorale.</p>
<div class="lab">Conséquences</div><p>Hypergammaglobulinémie polyclonale, anémie hémolytique à Coombs positif et proliférations B EBV positives.</p>
<div class="lab">Limite</div><p>Les sources lues ne relient pas chaque mutation à un médicament précis.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, 2022 (Alaggio et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a>.</p></template>
<template data-pop="c86-tcr" data-title="Récepteur T (TCR) et clonalité">
<div class="lab">Normal</div><p>Chaque lymphocyte T mature a un récepteur T réarrangé, propre à son clone. Une population tumorale dérive d’une cellule et porte donc le même réarrangement : elle est monoclonale. Les cellules NK n’ont pas de réarrangement du récepteur T.</p>
<div class="lab">Application</div><p>L’analyse de la clonalité du récepteur T aide à distinguer une prolifération réactive d’un lymphome (Zander 2021). Dans l’ENKTL, le récepteur reste en configuration germinale. Dans le HSTL, il est de type gamma-delta (environ 75 %), alpha-bêta (25 %) ou silencieux (5 %).</p>
<div class="lab">Limite</div><p>La clonalité seule ne fait pas le diagnostic : elle complète l’histologie et l’immunophénotype.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">Tse et al., How we treat NK/T-cell lymphomas, 2022</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, 2022 (Alaggio et al.)</a>.</p></template>
<template data-pop="c86-thiopurine" data-title="Thiopurine, anti-TNF et lymphome T hépatosplénique">
<div class="lab">Données</div><p>Dans la maladie de Crohn, le risque absolu de HSTL est estimé à 1 pour 7404 sous thiopurine seule et à 1 pour 3534 sous l’association thiopurine plus anti-TNF. Le risque est maximal chez l’homme de moins de 35 ans exposé à l’association depuis au moins deux ans.</p>
<div class="lab">Calcul</div><p>7404 ÷ 3534 ≈ 2,1 : l’association double à peu près le risque. 1 ÷ 3534 ≈ 0,028 %, soit environ 3 cas pour 10 000 patients exposés.</p>
<div class="lab">Prévention</div><p>Les recommandations citées limitent à deux ans l’association chez le jeune homme.</p>
<div class="lab">Interprétation</div><p>Ces chiffres décrivent un risque de population et non le destin d’un patient sous thiopurine.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6624667/" target="_blank" rel="noopener">Carvão et al., lymphome T hépatosplénique et thiopurines, 2019</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a>.</p></template>
