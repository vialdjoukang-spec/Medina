<template data-pop="c86-biopsie" data-title="Biopsie tissulaire et immunohistochimie">
<div class="lab">Recommandation</div><p>La biopsie chirurgicale, excisionnelle ou incisionnelle, est recommandée chaque fois que possible (II, A). Le diagnostic est posé ou confirmé par un hématopathologiste expérimenté.</p>
<div class="lab">Pourquoi un expert</div><p>La concordance entre la pathologie primaire et la pathologie de référence est souvent faible pour ces lymphomes. Une nouvelle histologie est donc demandée à la rechute (Onkopedia 2025).</p>
<div class="lab">Panel</div><p>Antigènes pan-T (CD2, CD3, CD5, CD7), CD4 et CD8, clonalité du récepteur T ; phénotype TFH si au moins deux marqueurs parmi CD10, BCL6, PD1, ICOS, CXCL13 ; CD30 toujours testé ; EBER pour l’ENKTL.</p>
<div class="lab">Lacune</div><p>Les sources lues ne comparent pas la biopsie à l’aiguille à la biopsie chirurgicale : aucune recommandation n’est donc donnée ici sur ce point.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a>.</p></template>
<template data-pop="c86-moelle" data-title="Biopsie ostéomédullaire">
<div class="lab">Recommandation</div><p>La biopsie ostéomédullaire est recommandée dans le bilan d’extension des lymphomes T périphériques (I, A).</p>
<div class="lab">Par entité</div><ul><li><b>HSTL</b> : seul lymphome T périphérique non leucémique avec atteinte médullaire presque constante, typiquement intrasinusoïdale ; la réponse au traitement est confirmée par biopsie médullaire et, si possible, hépatique (III, A).</li><li><b>BPDCN</b> : cytométrie en flux et biopsie ostéomédullaire.</li><li><b>LyP typique</b> : pas de biopsie médullaire. <b>pcALCL</b> : optionnelle si l’atteinte est purement cutanée.</li><li><b>Pronostic</b> : l’atteinte médullaire fait partie de l’index PIT.</li></ul>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://doi.org/10.1007/s00105-023-05192-9" target="_blank" rel="noopener">Nguyen et al., BPDCN, Die Dermatologie 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">Consensus EORTC, ISCL et USCLC 2011 (Kempf et al.)</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a>.</p></template>
<template data-pop="c86-bio" data-title="Bilan biologique initial">
<div class="lab">Contenu</div><p>Hémogramme, chimie, LDH, sérologies du VIH, de l’HTLV-1 et des hépatites B et C ; bilan cardiaque avant les anthracyclines (Zander 2021).</p>
<div class="lab">Rôle de chaque élément</div><p>La LDH figure dans l’index pronostique international et dans le PIT. Le bilan cardiaque précède les schémas à anthracycline. L’albumine est exigée avant tagraxofusp (au moins 3,2 g/dL). Pour les sérologies, les sources lues les énumèrent dans le bilan initial sans détailler la raison de chacune.</p>
<div class="lab">Valeurs normales</div><p>Les sources lues ne donnent aucun intervalle de référence : le laboratoire du patient fait foi.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Elzonris, novembre 2022 (AIPS, GTIN 7680687970013)</a>.</p></template>
<template data-pop="c86-tep" data-title="TEP-TDM : bilan d’extension et réponse">
<div class="lab">Place</div><p>La TEP-TDM est l’examen préféré au diagnostic et en fin de traitement (I, B). Dans l’ENKTL, l’objectif de fin de traitement est un score de Deauville inférieur ou égal à 3 (réponse métabolique complète). Pour décider d’une autogreffe, d’une allogreffe ou d’une radiothérapie, elle est réalisée 6 à 8 semaines après la fin du traitement.</p>
<div class="lab">Limite</div><p>Environ 10 % des lymphomes T périphériques sont peu ou pas avides de FDG : un examen négatif n’exclut pas la maladie. La stadification suit la classification de Lugano ; pour les lymphomes cutanés non mycosis fongoïde, c’est le TNM de l’ISCL et de l’EORTC.</p>
<div class="lab">Pas d’imagerie systématique</div><p>En rémission complète, l’imagerie systématique de surveillance n’est pas recommandée (III, D).</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">Tse et al., How we treat NK/T-cell lymphomas, 2022</a>.</p></template>
<template data-pop="c86-index" data-title="Index pronostiques : IPI, PIT, PINK">
<div class="lab">IPI et PIT</div><p>L’IPI compte cinq facteurs : âge supérieur à 60 ans, LDH élevée, ECOG de 2 à 4, stade III ou IV, plus d’un site extranodal. Le PIT retient l’âge, l’état général, la LDH et l’atteinte médullaire ; le mPIT ajoute le Ki-67. Pour les lymphomes T périphériques hors lymphome anaplasique ALK positif, la survie à cinq ans selon les quatre groupes du PIT est de 75 %, 30 %, 15 % et 0 % (du groupe le plus favorable au plus défavorable).</p>
<div class="lab">PINK et PINK-E (ENKTL)</div><p>PINK : âge supérieur à 60 ans, stade III ou IV, atteinte ganglionnaire à distance, sous-type non nasal. PINK-E ajoute un ADN d’EBV détectable.</p>
<div class="lab">Exemple fictif</div><p>Un patient de 65 ans, en stade IV, avec atteinte ganglionnaire à distance et lymphome nasal, cumule trois des quatre facteurs de PINK (âge, stade, atteinte à distance) ; s’il a un ADN d’EBV détectable, PINK-E ajoute un quatrième facteur. Les sources lues ne donnent pas ici les groupes de risque chiffrés : le score est utilisé comme décompte de facteurs.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">Tse et al., How we treat NK/T-cell lymphomas, 2022</a>.</p></template>
<template data-pop="c86-diffdx" data-title="Diagnostics différentiels cutanés et types de la papulose lymphomatoïde">
<div class="lab">Lymphome systémique ALK positif</div><p>Une expression d’ALK sur une lésion cutanée oriente vers un lymphome anaplasique systémique ALK positif avec atteinte cutanée secondaire (C84.6) : le pcALCL n’a pas de translocation ALK dans la majorité des cas.</p>
<div class="lab">Types de la LyP</div><ul><li><b>Type A</b> : peut simuler un lymphome de Hodgkin classique.</li><li><b>Type B</b> : peut simuler un mycosis fongoïde en plaques.</li><li><b>Type D</b> : peut simuler un lymphome cytotoxique CD8 positif épidermotrope.</li><li><b>Type E</b> : angiocentrique, peut simuler un lymphome extranodal NK/T.</li><li><b>Type C</b> : non détaillé dans les sources lues.</li></ul>
<div class="lab">Autres</div><p>La LyP simule aussi le pcALCL et le mycosis fongoïde tumoral. Le SPTCL se distingue du lymphome T gamma-delta cutané primitif par l’absence d’atteinte (épi)dermique et d’ulcération ; la panniculite lupique n’a pas été lue.</p>
<div class="lab">Principe</div><p>La régression spontanée de chaque lésion et la corrélation clinico-pathologique départagent ces entités.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">Mise à jour OMS-EORTC 2018 des lymphomes cutanés primitifs (Willemze et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">Consensus EORTC, ISCL et USCLC 2011 (Kempf et al.)</a> ; <a href="https://doi.org/10.1182/blood-2007-04-087288" target="_blank" rel="noopener">Willemze et al., SPTCL, Blood 2008</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc C81-C96</a>.</p></template>
<template data-pop="c86-stad-cutanee" data-title="Stadification des lymphomes cutanés non mycosis fongoïde">
<div class="lab">Règle</div><p>Les lymphomes cutanés primitifs autres que le mycosis fongoïde sont stadifiés par la classification TNM de l’ISCL et de l’EORTC.</p>
<div class="lab">Pourquoi pas Ann Arbor</div><p>La classification d’Ann Arbor classerait à tort une papulose lymphomatoïde diffuse au stade IV.</p>
<div class="lab">Bilan</div><p>LyP typique : imagerie optionnelle, pas de biopsie médullaire. pcALCL : TDM thoraco-abdomino-pelvienne injectée, éventuellement avec TEP ; moelle optionnelle si atteinte purement cutanée ; biopsie de tout ganglion de plus de 1,5 cm.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">Consensus EORTC, ISCL et USCLC 2011 (Kempf et al.)</a>.</p></template>
<template data-pop="c86-chop" data-title="CHOP, CHOEP et BV-CHP">
<div class="lab">Place</div><p>Pour le PTCL-NOS et le nTFHL-AI, le schéma standard est le CHOP ou le CHOEP (II, B), pour 6 à 8 cycles, suivi d’une autogreffe chez les répondeurs à haut risque (III, B). Dans l’ENKTL, l’anthracycline est inefficace ; dans le pcALCL limité à la peau, le CHOP n’est plus recommandé (rémission complète 85 %, rechute 71 %).</p>
<div class="lab">Preuve du BV-CHP</div><p>L’étude ECHELON-2 (plus de 450 patients, CD30 d’au moins 10 %) compare le BV-CHP au CHOP : rémission complète 68 % contre 56 % (différence de 12 points), survie sans progression médiane 48,8 contre 20,8 mois (différence de 28 mois), avec un bénéfice de survie globale. Le bénéfice porte surtout sur le lymphome anaplasique à grandes cellules.</p>
<div class="lab">Limite</div><p>Selon ESMO-EHA 2025, il n’y a pas d’amélioration démontrée dans le PTCL-NOS ni dans les lymphomes folliculaires helper, et pas d’autorisation européenne pour ces entités. Les doses des composants du CHOP ne figurent pas dans le dossier de sources lues.</p>
<div class="lab">Vincristine</div><p>Elle est retirée dans le BV-CHP, car sa neurotoxicité s’ajoute à celle du brentuximab védotine.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">Consensus EORTC, ISCL et USCLC 2011 (Kempf et al.)</a>.</p></template>
<template data-pop="c86-bv" data-title="Brentuximab védotine (Adcetris)">
<div class="lab">Mécanisme</div><p>Médicament dirigé contre CD30, d’où l’exigence d’un lymphome CD30 positif ; dans ECHELON-2, au moins 10 % des cellules tumorales.</p>
<div class="lab">Indications suisses (juin 2025)</div><p>En association avec la cyclophosphamide, la doxorubicine et la prednisone (CHP), dans le lymphome T périphérique CD30 positif non prétraité de l’adulte ; en monothérapie, dans le lymphome T cutané CD30 positif après traitement systémique. L’indication suisse est plus large que l’indication européenne, limitée au lymphome anaplasique selon Onkopedia.</p>
<div class="lab">Posologie</div><p>1,8 mg/kg par voie intraveineuse toutes les trois semaines, 6 à 8 cycles avec le CHP.</p>
<div class="lab">Preuves</div><p>ECHELON-2 : rémission complète 68 % contre 56 %, survie sans progression médiane 48,8 contre 20,8 mois, bénéfice de survie globale, surtout dans le lymphome anaplasique.</p>
<div class="lab">Effets indésirables</div><p>Leucoencéphalopathie multifocale progressive et neuropathie, décrites dans l’information professionnelle suisse.</p>
<div class="lab">Contre-indications et surveillance</div><p>Les contre-indications détaillées et le schéma de surveillance de l’information professionnelle ne sont pas reproduits dans le dossier lu ; le lecteur consulte l’information professionnelle complète.</p>
<div class="lab">Remboursement</div><p>En 2021, le BV-CHP nécessitait une garantie de prise en charge de l’assurance ; le statut 2026 n’a pas été vérifié.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Adcetris, juin 2025 (AIPS, GTIN 7680621320010)</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a>.</p></template>
<template data-pop="c86-asp" data-title="Pégaspargase (Oncaspar) et schémas à asparaginase de l’ENKTL">
<div class="lab">Mécanisme</div><p>Les cellules de l’ENKTL à faible activité d’asparagine synthétase sont sensibles à l’asparaginase.</p>
<div class="lab">Schémas</div><p>Stades III–IV : DDGP ou mSMILE si éligible à la greffe, AspaMetDex ou P-GemOx sinon (III, B). Avec SMILE, la réponse globale est de 81 % et la survie à cinq ans de 50 % ; DDGP contre SMILE : survie sans progression à un an de 86 % contre 38 %. En cas d’hypersensibilité à l’asparaginase d’E. coli : crisantaspase (III, A). Stades I–II : chimiothérapie avec L-asparaginase sans anthracycline, associée à la radiothérapie (II, A).</p>
<div class="lab">Statut suisse</div><p>L’information professionnelle d’Oncaspar (septembre 2025) n’autorise le pégaspargase que dans la leucémie lymphoblastique aiguë : son emploi dans l’ENKTL est hors étiquette (déduction à partir de l’indication autorisée). Les effets indésirables décrits comprennent la pancréatite et la thrombose.</p>
<div class="lab">Lacune</div><p>Les sources lues ne précisent pas quelle asparaginase est utilisée dans chaque schéma ; la posologie du pégaspargase n’est pas reprise ici.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">Tse et al., How we treat NK/T-cell lymphomas, 2022</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Oncaspar, septembre 2025 (AIPS, GTIN 7680669340018)</a>.</p></template>
<template data-pop="c86-rt" data-title="Radiothérapie dans les lymphomes T et NK">
<div class="lab">ENKTL</div><p>Stades I–II : au moins 50 Gy, combinés à une chimiothérapie sans anthracycline (II, A). Des doses inférieures à 50 Gy augmentent les rechutes locorégionales ; la radiothérapie seule n’est pas recommandée car elle expose aux rechutes systémiques. La radiothérapie en modulation d’intensité est supérieure dans une comparaison citée (survie sans progression à cinq ans 68,9 % contre 58,2 %). Avec DeVIC, 50 à 56 Gy donnent une rémission complète de 77 % et une survie à deux ans de 78 %.</p>
<div class="lab">nTFHL-AI</div><p>Forme limitée : ISRT de 30 à 40 Gy (IV, B).</p>
<div class="lab">pcALCL</div><p>Lésion solitaire ou groupée : excision ou radiothérapie, avec une rémission complète d’au moins 95 % et une rechute d’environ 40 %.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">Tse et al., How we treat NK/T-cell lymphomas, 2022</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">Consensus EORTC, ISCL et USCLC 2011 (Kempf et al.)</a>.</p></template>
<template data-pop="c86-tagra" data-title="Tagraxofusp (Elzonris)">
<div class="lab">Mécanisme</div><p>Protéine de fusion dirigée contre CD123, marqueur du BPDCN.</p>
<div class="lab">Indication suisse (novembre 2022)</div><p>BPDCN de l’adulte en première ligne.</p>
<div class="lab">Posologie</div><p>12 µg/kg en 15 minutes, du premier au cinquième jour d’un cycle de 21 jours. Le premier cycle est hospitalier. L’albumine doit être d’au moins 3,2 g/dL avant le traitement.</p>
<div class="lab">Preuves</div><p>RC/RCc chez 56,9 % de 65 patients non prétraités.</p>
<div class="lab">Effets indésirables</div><p>Syndrome de fuite capillaire chez 18 % des patients, médiane au 6e jour, fatal dans 1,3 % des cas.</p>
<div class="lab">Suite du traitement</div><p>Allogreffe en première rémission, autogreffe en l’absence de donneur ; venetoclax et inhibiteurs BET en investigation. Survie médiane 12 à 14 mois, 23 mois avec allogreffe en première rémission.</p>
<div class="lab">Lacune</div><p>Les contre-indications et la surveillance détaillée de l’information professionnelle ne sont pas reproduites dans le dossier.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Elzonris, novembre 2022 (AIPS, GTIN 7680687970013)</a> ; <a href="https://doi.org/10.1007/s00105-023-05192-9" target="_blank" rel="noopener">Nguyen et al., BPDCN, Die Dermatologie 2023</a>.</p></template>
<template data-pop="c86-ice" data-title="ICE et consolidation du lymphome T hépatosplénique">
<div class="lab">Schéma</div><p>Un régime plus intensif que le CHOP est recommandé (III, A) ; ICE est préféré (IV, B).</p>
<div class="lab">Preuve</div><p>Dans une méta-analyse de 166 patients, la réponse globale atteint 82 % avec les schémas non-CHOP contre 52 % (30 points d’écart), et la survie médiane 37 contre 18 mois (19 mois d’écart).</p>
<div class="lab">Consolidation</div><p>Greffe, de préférence allogénique (III, A). Les données de l’EBMT donnent une survie sans progression à trois ans de 51 % et une survie de 55 %. La recherche de donneur commence dès le diagnostic.</p>
<div class="lab">Contrôle de la réponse</div><p>Biopsie médullaire et, si possible, hépatique (III, A).</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a>.</p></template>
<template data-pop="c86-greffe" data-title="Autogreffe et allogreffe">
<div class="lab">Autogreffe</div><p>Consolidation chez les répondeurs à haut risque du PTCL-NOS et du nTFHL-AI (III, B) ; dans l’EATL après un cycle de CHOP ou CHOEP et trois cycles d’IVE alternant avec du méthotrexate (survie à cinq ans de 60 %, n = 26) ; dans le BPDCN en l’absence de donneur. Dans le PTCL, la survie à cinq ans est d’environ 50 % chez des patients sélectionnés.</p>
<div class="lab">Allogreffe</div><p>Réservée aux formes réfractaires ou en rechute. La recherche de donneur est immédiate dans le PTCL-NOS, à la rechute dans le nTFHL-AI, dès le diagnostic dans l’EATL et le HSTL. Dans le BPDCN, elle est proposée en première rémission (survie médiane 23 mois).</p>
<div class="lab">Décision</div><p>Une TEP 6 à 8 semaines après le traitement oriente vers l’autogreffe, l’allogreffe ou la radiothérapie.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a> ; <a href="https://doi.org/10.1007/s00105-023-05192-9" target="_blank" rel="noopener">Nguyen et al., BPDCN, Die Dermatologie 2023</a>.</p></template>
<template data-pop="c86-lyp-trt" data-title="Traitements de la papulose lymphomatoïde et du pcALCL">
<div class="lab">Papulose lymphomatoïde</div><p>Aucun traitement ne modifie l’évolution ni ne prévient un second lymphome : la surveillance est légitime. Méthotrexate à faible dose (5 à 30 mg par semaine) : rémission complète 34 %, rechute 63 %. PUVA : rémission complète 26 %, rechute 84 %. La polychimiothérapie est à éviter. Le suivi est à vie : un second lymphome survient chez 4 à 25 % des patients.</p>
<div class="lab">pcALCL</div><p>Lésion solitaire ou groupée : excision ou radiothérapie, rémission complète d’au moins 95 %, rechute d’environ 40 %. Atteinte multifocale : méthotrexate à faible dose. CHOP (rémission complète 85 %, rechute 71 %) : non recommandé pour une atteinte purement cutanée ; chimiothérapie systémique seulement en cas de dissémination extracutanée. Survie à cinq ans de 76 à 96 %.</p>
<div class="lab">Statut suisse</div><p>Le brentuximab védotine est autorisé en Suisse dans le lymphome T cutané CD30 positif après traitement systémique.</p>
<div class="lab">Limite</div><p>Le consensus de 2011 associe un consortium américain (USCLC) ; il est utilisé pour sa composante européenne (EORTC, auteur principal zurichois) et non comme recommandation américaine.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">Consensus EORTC, ISCL et USCLC 2011 (Kempf et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6473500/" target="_blank" rel="noopener">Mise à jour OMS-EORTC 2018 des lymphomes cutanés primitifs (Willemze et al.)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Adcetris, juin 2025 (AIPS, GTIN 7680621320010)</a>.</p></template>
<template data-pop="c86-rechute" data-title="Traitements de rechute">
<div class="lab">nTFHL-AI</div><p>Azacitidine orale (III, B) ; romidepsine avec une réponse globale inférieure à 40 % ; ciclosporine et lénalidomide actifs. La recherche d’un donneur est faite à la rechute.</p>
<div class="lab">ENKTL</div><p>Pembrolizumab ou nivolumab (III, B), non autorisés par l’EMA dans cette indication.</p>
<div class="lab">BPDCN</div><p>Venetoclax et inhibiteurs BET en investigation.</p>
<div class="lab">Principe</div><p>Une nouvelle histologie est demandée à la rechute (Onkopedia 2025).</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://doi.org/10.1007/s00105-023-05192-9" target="_blank" rel="noopener">Nguyen et al., BPDCN, Die Dermatologie 2023</a>.</p></template>
<template data-pop="c86-suivi" data-title="Calendrier de suivi">
<div class="lab">Lymphomes T périphériques</div><p>Examen clinique tous les trois mois la première année, puis tous les six mois pendant deux ans sans autogreffe ou quatre ans avec autogreffe (IV, C). Pas d’imagerie systématique en rémission complète (III, D). Arrêt possible après trois ou cinq ans.</p>
<div class="lab">Après traitement</div><p>TEP 6 à 8 semaines après la fin du traitement.</p>
<div class="lab">Situations particulières</div><p>Maladie cœliaque réfractaire de type II : surveillance de l’intestin grêle tous les 6 à 12 mois (IV, B). Papulose lymphomatoïde : suivi à vie. ENKTL : ADN d’EBV indétectable et Deauville ≤ 3 en fin de traitement.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3204726/" target="_blank" rel="noopener">Consensus EORTC, ISCL et USCLC 2011 (Kempf et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9164389/" target="_blank" rel="noopener">Tse et al., How we treat NK/T-cell lymphomas, 2022</a>.</p></template>
<template data-pop="c86-statut-ch" data-title="Statut suisse des médicaments et lacunes de remboursement">
<div class="lab">Tableau</div><table class="t"><thead><tr><th>Médicament</th><th>Statut</th></tr></thead><tbody><tr><td>Adcetris</td><td>Autorisé : BV avec CHP dans le lymphome T périphérique CD30 positif non prétraité ; lymphome T cutané CD30 positif après traitement systémique (juin 2025).</td></tr><tr><td>Elzonris</td><td>Autorisé : BPDCN de l’adulte en première ligne (novembre 2022).</td></tr><tr><td>Oncaspar</td><td>Autorisé uniquement dans la leucémie lymphoblastique aiguë (septembre 2025) ; emploi hors étiquette dans l’ENKTL.</td></tr><tr><td>Pembrolizumab, nivolumab</td><td>Non autorisés par l’EMA dans l’ENKTL en rechute ; statut suisse non lu.</td></tr><tr><td>Crisantaspase</td><td>Statut suisse non lu.</td></tr></tbody></table>
<div class="lab">Remboursement</div><p>En 2021, le BV-CHP était autorisé en Suisse mais nécessitait une garantie de prise en charge de l’assurance. Le statut 2026 n’a pas été vérifié, la liste des spécialités n’ayant pas été consultée.</p>

<template data-pop="c86-lacunes" data-title="Lacunes de la documentation">
<div class="lab">Liste</div><ol><li>Aucune recommandation suisse spécifique (SSH, Swiss Medical Forum) sur les lymphomes T périphériques ; seule source suisse : la revue SZO 2021.</li><li>Aucun chiffre suisse par sous-code C86.x.</li><li>Texte intégral de la recommandation ESMO 2018 sur les lymphomes cutanés inaccessible (accès refusé par le serveur, code 403) ; remplacé par l’OMS-EORTC 2018 et le consensus 2011.</li><li>Traitement précis du SPTCL, panniculite lupique, critères HLH-2004 non lus.</li><li>Tableau clinique détaillé de l’EATL non lu ; classification ICC 2022 non lue en texte intégral.</li><li>Statut de remboursement suisse 2026 du BV-CHP non vérifié.</li><li>Le consensus 2011 inclut un consortium américain, utilisé pour sa composante européenne.</li></ol>
<div class="lab">Autres limites</div><p>Aucune valeur de référence de laboratoire n’est donnée par les sources lues ; la grossesse n’est pas documentée. Audit différé : revue par intelligence artificielle, distincte d’une validation médicale humaine.</p>
<p class="src">Sources, consultées le 15 octobre 2026 : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/periphere-t-zell-lymphome/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphomes T périphériques (DGHO, OeGHO, SGMO, SSH), octobre 2025</a> ; <a href="https://doi.org/10.1002/hem3.70128" target="_blank" rel="noopener">ESMO-EHA 2025, lymphomes T et NK périphériques (d’Amore et al.)</a> ; <a href="https://www.rosenfluh.ch/media/onkologie/2021/04/Therapie-von-T-Zell-Lymphomen.pdf" target="_blank" rel="noopener">Zander et Renner, Schweizer Zeitschrift für Onkologie 2021</a>.</p></template>
<template data-pop="c86-mnemo" data-title="Moyen mnémotechnique : sous-code et siège">
<div class="lab">Principe</div><p>Aide pédagogique, non critère officiel. Elle associe l’ordre des sous-codes C86.0 à C86.6 à la partie du corps où se situe classiquement chaque maladie.</p>

<template data-pop="pareto-c86-definition" data-title="Pareto — Définition, classifications et épidémiologie">
<p class="ratio" data-cover="c86-1,c86-2"></p><ul><li>Le code C86 regroupe sept maladies distinctes, de la papulose lymphomatoïde (survie spécifique à cinq ans 99 %) aux lymphomes T gamma-delta et NK/T (moins de 20 %).</li><li>Les classifications actuelles sont l’OMS 5e édition et l’ICC 2022 ; le code C86.4 est un héritage nosologique, le lymphome anaplasique systémique relève de C84.6 ou C84.7.</li><li>Les lymphomes T représentent 10 à 15 % des lymphomes en Suisse ; aucun chiffre suisse par sous-code n’existe dans les sources lues.</li><li>Thiopurine plus anti-TNF : risque absolu 1/3534 contre 1/7404 sous thiopurine seule.</li></ul></template>
<template data-pop="pareto-c86-mecanismes" data-title="Pareto — Physiopathologie et facteurs de risque">
<p class="ratio" data-cover="c86-3,c86-4"></p><ul><li>ENKTL : EBV en latence II, glycoprotéine P (pas d’anthracycline), faible asparagine synthétase (asparaginase).</li><li>SPTCL : perte de fonction de HAVCR2 (TIM-3), activation immunitaire persistante, risque de SLH.</li><li>nTFHL-AI : TET2 et DNMT3A précoces dans la cellule souche, puis RHOA G17V et IDH2 R172.</li><li>EATL : maladie cœliaque réfractaire de type II ; HSTL : immunosuppression, homme de moins de 35 ans.</li></ul></template>
<template data-pop="pareto-c86-clinique" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="c86-5,c86-6"></p><ul><li>Le siège oriente : nez (ENKTL), rate et moelle sans adénopathie (HSTL), intestin (EATL), hypoderme (SPTCL), peau (BPDCN, LyP, pcALCL), ganglion (nTFHL-AI).</li><li>Une lésion cutanée qui disparaît seule évoque la papulose lymphomatoïde.</li><li>Symptômes B et infections sont communs ; l’absence d’adénopathie n’exclut pas un lymphome.</li></ul></template>
<template data-pop="pareto-c86-diagnostic" data-title="Pareto — Démarche diagnostique et urgences">
<p class="ratio" data-cover="c86-7,c86-8"></p><ul><li>Biopsie tissulaire lue par un expert, immunohistochimie (CD30 toujours, EBER dans l’ENKTL), puis TEP-TDM et biopsie médullaire.</li><li>Trois urgences : SLH, perforation intestinale (EATL), toxicités (fuite capillaire du tagraxofusp, 18 %).</li><li>Lymphomes cutanés : stadification TNM de l’ISCL et de l’EORTC, jamais Ann Arbor.</li></ul></template>
<template data-pop="pareto-c86-prise-en-charge" data-title="Pareto — Prise en charge, suivi et prévention">
<p class="ratio" data-cover="c86-9,c86-10"></p><ul><li>ENKTL : radiothérapie ≥ 50 Gy et chimiothérapie sans anthracycline avec asparaginase ; pégaspargase hors étiquette en Suisse.</li><li>HSTL : ICE puis greffe, de préférence allogénique ; BPDCN : tagraxofusp ; nTFHL-AI et PTCL-NOS : CHOP ou CHOEP.</li><li>LyP : surveillance à vie, pas de polychimiothérapie ; pcALCL cutané : excision ou radiothérapie, CHOP non recommandé.</li><li>Prévention du HSTL : limiter l’association thiopurine plus anti-TNF à deux ans.</li></ul></template>
<template data-pop="pareto-c86-criteres" data-title="Pareto — Situations particulières, critères et paramètres clés">
<p class="ratio" data-cover="c86-11,c86-12"></p><ul><li>ENKTL : EBER positif et CD56 ou molécules cytotoxiques ; nTFHL-AI : au moins deux marqueurs TFH ; pcALCL : CD30 ≥ 75 %.</li><li>Maladie cœliaque réfractaire de type II : régime strict de plus de 12 mois, villosités atrophiques, lymphocytes aberrants supérieurs à 20 %.</li><li>Brentuximab védotine 1,8 mg/kg toutes les trois semaines ; tagraxofusp 12 µg/kg du premier au cinquième jour d’un cycle de 21 jours.</li></ul></template>
<template data-pop="pareto-c86-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="c86-e-1,c86-e-2,c86-e-3,c86-e-4,c86-e-5"></p><ul><li>Gold standard : biopsie tissulaire lue par un hématopathologiste expérimenté ; le reste situe et mesure.</li><li>ADN d’EBV plasmatique (et non sang total) mesure la charge tumorale de l’ENKTL ; objectif indétectable.</li><li>CD30 : 10 % dans l’étude ECHELON-2, 75 % pour le diagnostic de pcALCL.</li><li>Environ 10 % des lymphomes T sont peu avides de FDG ; Deauville ≤ 3 en fin de traitement de l’ENKTL.</li></ul></template>
<template data-pop="pareto-c86-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="c86-s-anat-cours"></p><ul><li>Chaque sous-code a un siège de prédilection : nez, foie-rate-moelle, intestin grêle, hypoderme, peau, ganglion.</li><li>Le siège commande la biopsie et le bilan.</li></ul></template>
<template data-pop="pareto-c86-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="c86-s-histo-cours"></p><ul><li>Le lymphome garde les marqueurs de sa cellule d’origine : T (CD2, CD3, CD5, CD7), NK (CD56, granules), TFH (CD10, BCL6, PD1, ICOS, CXCL13).</li><li>Le phénotype ouvre l’accès au brentuximab (CD30) ou au tagraxofusp (CD123).</li></ul></template>
<template data-pop="pareto-c86-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="c86-s-physio-cours"></p><ul><li>ENKTL : EBV en latence II, apoptose, ADN plasmatique, glycoprotéine P.</li><li>SPTCL : absence de TIM-3, TNF-α et interleukine 1β accrus, SLH.</li></ul></template>
<template data-pop="pareto-c86-gen" data-title="Pareto — Génétique et biochimie">
<p class="ratio" data-cover="c86-s-gen-cours"></p><ul><li>nTFHL-AI : TET2, DNMT3A puis RHOA G17V, IDH2 R172 ; SPTCL : HAVCR2 ; pcALCL : DUSP22-IRF4 ; EATL : JAK1/STAT3.</li><li>Odds ratios ajustés de SLH : 4,77 chez l’hétérozygote HAVCR2, 8,48 chez l’homozygote.</li></ul></template>
<template data-pop="pareto-c86-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="c86-p-1,c86-p-2,c86-p-3,c86-p-4"></p><ul><li>Le médicament suit le phénotype : CD30 (brentuximab), CD123 (tagraxofusp), EBV (asparaginase, pas d’anthracycline).</li><li>Associations à éviter : brentuximab avec vincristine ; thiopurine plus anti-TNF prolongés chez le jeune homme.</li><li>Tagraxofusp : premier cycle hospitalier, albumine ≥ 3,2 g/dL, fuite capillaire 18 %.</li></ul></template>
