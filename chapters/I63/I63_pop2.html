<template data-pop="pareto-i63-path" data-title="Loi de Pareto — Pathologie et prise en charge"><p class="ratio" data-cover="i63-0,i63-1,i63-2,i63-3,i63-4,i63-5,i63-6,i63-7,i63-8,i63-9,i63-10,i63-11,i63-12"></p><ul><li>Un déficit focal aigu impose le 144, l’heure du dernier état normal, la <button class="w" data-k="i63-glucose">glycémie</button> et l’imagerie urgente ; une régression complète reste urgente.</li><li>Les signes désignent l’artère : aphasie ou négligence avec faiblesse face–bras dans le territoire sylvien, jambe dans l’antérieure, hémianopsie dans la postérieure, signes croisés et vertige dans le tronc et le cervelet ; un déficit « pur » évoque une lacune, mais un syndrome lacunaire n’est pas toujours une lacune.</li><li>Les imitateurs se rangent par gravité puis par fréquence : hémorragie, dissection aortique et endocardite d’abord ; hypoglycémie, crise, aura migraineuse et vertige périphérique ensuite. Un syndrome vestibulaire aigu continu avec nystagmus peut être évalué par HINTS par un examinateur formé, car le scanner manque la plupart des infarctus de la fosse postérieure.</li><li>L’imagerie distingue hémorragie, infarctus, artère occluse et tissu hypoperfusé. Le NIHSS mesure le déficit, sans remplacer son caractère invalidant.</li><li>La thrombolyse conforme aux produits enseignés concerne la fenêtre ≤4,5 heures ; la thrombectomie et les sélections tardives sont discutées au centre spécialisé. Une thrombolyse indiquée ne retarde pas le geste.</li><li>Les produits et les recommandations sont distingués lorsque les seuils, doses ou indications divergent. Après thrombolyse intraveineuse, la prévention cérébrale antiagrégante ou anticoagulante attend 24 heures et l’imagerie de contrôle ; l’exception de l’information professionnelle d’héparine sous-cutanée pour une autre indication relève du spécialiste.</li><li>Toute aggravation fait rechercher hémorragie, nouvelle ischémie, œdème ou autre cause ; un grand infarctus ou une atteinte cérébelleuse peut nécessiter un avis neurochirurgical.</li><li>La cause détermine antiagrégant, anticoagulation pour fibrillation atriale ou traitement artériel spécialisé. Une bithérapie courte ne devient pas un traitement permanent.</li><li>L’infarctus veineux nécessite une imagerie veineuse et une anticoagulation spécialisée ; une hémorragie de congestion peut modifier l’interprétation habituelle du saignement.</li><li>Les objectifs tensionnels et lipidiques au long cours, l’arrêt du tabac et la réadaptation complètent la prévention ; le rein, le foie et les situations particulières modifient le choix des produits.</li></ul><p class="src">Références : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 10–21, 24, 32, 34–43 et 51</a> ; <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener" data-reference-source="1">Weimar et coll. — New recommendations on cerebral venous and dural sinus thrombosis from the German consensus-based S2k guideline (2024 ; consensus révisé en octobre 2023), Definition, Diagnosis et Anticoagulation in the acute phase</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), AVC : indication, sécurité et surveillance</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), AVC : indication, sécurité et surveillance</a> ; <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), Recommandation 1</a> ; <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — 2025 update on blood pressure management in acute stroke (Publication mai 2026 ; DOI 10.1093/esj/aakag004), Tableau 11</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Résumé et recommandations</a>.</p></template>
<template data-pop="pareto-i63-exam" data-title="Loi de Pareto — Examens complémentaires"><p class="ratio" data-cover="i63-e-1,i63-e-2,i63-e-3,i63-e-4,i63-e-5"></p><ul><li>L’imagerie cérébrale urgente recherche sang et lésion ; l’angiographie identifie l’occlusion ; la perfusion ou diffusion/<button class="w" data-k="i63-imagerie">séquence FLAIR</button> répond à une sélection spécifique.</li><li>Le mismatch tardif de thrombolyse décrit dans l’Europe 2021 concerne une population et une méthode précises, sans autorisation information professionnelle automatique.</li><li><button class="w" data-k="i63-glucose">Glycémie</button>, <button class="w" data-k="i63-references-biologiques">plaquettes</button>, coagulation et fonction rénale répondent à la sécurité ; un <button class="w" data-k="i63-calcul-coagulation">rapport normalisé international</button> normal n’exclut pas un anticoagulant oral direct.</li><li>Le bilan causal associe artères et cœur ; une surveillance rythmique prolongée et les examens rares se sélectionnent sur des indices.</li><li>L’évaluation de déglutition guide la sécurité orale ; le temps de découverte et un faible score ne doivent pas fausser les décisions.</li></ul><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 10–14 et 19–23</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 3.1, 4.1 et 9.1</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Pharmacodynamique</a> ; <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — 2025 update on blood pressure management in acute stroke (Publication mai 2026 ; DOI 10.1093/esj/aakag004), Tableau 11</a>.</p></template>
<template data-pop="pareto-i63-science" data-title="Loi de Pareto — Sciences fondamentales"><p class="ratio" data-cover="i63-s-anat-1,i63-s-phys-1,i63-s-histo-1,i63-s-bioch-1,i63-s-gen-1"></p><ul><li>La carte vasculaire et les réseaux fonctionnels orientent les signes ; l’imagerie vérifie la localisation et l’artère.</li><li>Le déficit de perfusion compromet l’énergie et les gradients ioniques ; la dépolarisation et l’œdème n’autorisent pas une horloge individuelle de nécrose.</li><li>La pression aiguë doit préserver la perfusion sans accroître les complications ; les objectifs changent selon la reperfusion.</li><li>Thrombolyse, antiagrégation, inhibition du facteur Xa et réduction du cholestérol ciblent des mécanismes distincts.</li><li>Les profils familiaux, systémiques ou radiologiques motivent une recherche génétique ciblée, après le bilan usuel.</li></ul><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 20–21, 50 et 53–57</a> ; <a href="https://doi.org/10.1002/ana.25147" target="_blank" rel="noopener" data-reference-source="1">Dreier et coll. — Terminal spreading depolarization and electrical silence in death of human cerebral cortex (2018 ; DOI 10.1002/ana.25147), Introduction, discussion et limites</a> ; <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — 2025 update on blood pressure management in acute stroke (Publication mai 2026 ; DOI 10.1093/esj/aakag004), Tableau 11</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio 100/300 mg (Mars 2026), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Propriétés/Effets</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis 10/20/40/80 mg, atorvastatine (Avril 2025, version 106 F), Propriétés/Effets</a>.</p></template>
<template data-pop="pareto-i63-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="i63-p-1,i63-p-2,i63-p-3,i63-p-4,i63-p-5"></p><ul><li>Actilyse : 0,9 mg/kg, maximum 90 mg, 10 % en bolus puis 60 minutes de perfusion. Metalyse 5000 U : paliers de l’information professionnelle adultes, 15 à 25 mg, un bolus ; 60–&lt;70 kg reçoit 17,5 mg.</li><li>La fenêtre de l’information professionnelle est ≤4,5 heures ; les divergences de seuils et les utilisations tardives sont identifiées comme décisions spécialisées hors cadre du produit.</li><li>Après thrombolyse intraveineuse, la prévention cérébrale antithrombotique attend 24 heures et l’imagerie de contrôle ; l’information professionnelle conserve une exception d’héparine sous-cutanée pour une autre indication, sans anticoagulation thérapeutique de routine. L’angiœdème et l’hémorragie nécessitent une prise en charge urgente.</li><li>La bithérapie antiagrégante européenne concerne une population limitée et 21 jours ; son utilisation précoce diffère de l’information professionnelle Plavix. La dose bernoise d’aspirine diffère du schéma AIT Aspirine Cardio.</li><li>Eliquis pour fibrillation atriale : 5 mg deux fois/jour, 2,5 mg si au moins deux critères de l’information professionnelle ; sa dose et son début après infarctus sont distincts.</li><li>Clexane dans l’infarctus veineux relève du protocole spécialisé ; cause du saignement, rein, <button class="w" data-k="i63-references-biologiques">plaquettes</button> et divergence clinique/information professionnelle sont vérifiés avant le traitement.</li><li>La statine est adaptée à l’athérosclérose et au risque ; les interactions, le foie, le rein et la grossesse sont vérifiés produit par produit.</li></ul><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio 100/300 mg (Mars 2026), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis 10/20/40/80 mg, atorvastatine (Avril 2025, version 106 F), Indications, posologie, sécurité et interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane, énoxaparine en seringues préremplies (Février 2026), Indications, posologie, sécurité et interactions</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 32 et 34–40</a> ; <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener" data-reference-source="1">Weimar et coll. — New recommendations on cerebral venous and dural sinus thrombosis from the German consensus-based S2k guideline (2024 ; consensus révisé en octobre 2023), Anticoagulation in the acute phase</a> ; <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), Recommandation 1</a>.</p></template>
<template data-pop="i63-actilyse" data-title="Actilyse : information professionnelle suisse"><p><b>Produit et place.</b> Actilyse, altéplase 10/20/50 mg, autorisation suisse 48313, information professionnelle juin 2025, est indiqué pour l’accident vasculaire cérébral ischémique chez l’adulte et l’adolescent dès 16 ans, dans les 4,5 heures du dernier état sans symptômes, après exclusion de l’hémorragie. Les présentations d’altéplase destinées à d’autres usages ne sont pas substituées.</p><p><b>Mécanisme et preuve.</b> L’altéplase active le plasminogène en plasmine en présence de fibrine et favorise la dissolution du thrombus. Les recommandations suisses et européennes concluent à une diminution du handicap dans les populations sélectionnées ; le bénéfice diminue avec le délai. Le bénéfice ne signifie ni absence de risque d’hémorragie ni garantie de récupération individuelle.</p><p><b>Dose.</b> La dose totale est 0,9 mg/kg, maximum 90 mg, avec 10 % en bolus et le reste en perfusion sur 60 minutes. Pour 70 kg : 63 mg au total, 6,3 mg puis 56,7 mg. Le poids réel et la concentration préparée selon l’information professionnelle sont vérifiés ; une formule de dose ne dispense pas de la préparation aseptique du produit exact.</p><p><b>Contre-indications.</b> L’information professionnelle décrit notamment saignement important actif/récent, suspicion ou antécédent pertinent d’hémorragie intracrânienne, certaines lésions ou interventions intracrâniennes, trauma ou chirurgie récents, hypertension non contrôlée, diathèse hémorragique, endocardite, maladie hépatique sévère et autres lésions exposant au saignement. Pour l’accident vasculaire cérébral, elle contre-indique notamment <button class="w" data-k="i63-calcul-coagulation">rapport normalisé international</button> &gt;1,3 sous anticoagulation efficace, <button class="w" data-k="i63-references-biologiques">plaquettes</button> &lt;100 ×10⁹/L, un accident vasculaire cérébral sévère selon ses critères, un exemple de gravité NIHSS &gt;25, ainsi que certains déficits mineurs ou rapidement améliorés. L’information professionnelle cite un trauma crânien sévère dans les trois mois, une chirurgie importante ou un trauma dans les dix jours, et l’héparine dans les 48 heures avec temps de céphaline activée prolongé. Ces critères temporels restent ceux du produit. La liste complète de l’information professionnelle est vérifiée par le prescripteur ; cette fenêtre ne la remplace pas.</p><p>L’information professionnelle demande un prélèvement de coagulation au début de la thrombolyse. Si le temps de prothrombine dépasse 15 secondes ou si le temps de céphaline activée est prolongé, la perfusion est interrompue. Ce sont les critères de sécurité du produit, distincts d’un intervalle normal de laboratoire ; les valeurs dépendent aussi du système analytique et du contexte anticoagulant.</p><p><b>Divergences.</b> La recommandation européenne soutient le traitement d’un accident vasculaire cérébral mineur invalidant et certaines sélections tardives ; le protocole bernois utilise un seuil <button class="w" data-k="i63-calcul-coagulation">rapport normalisé international</button> &gt;1,7. Ces positions ne sont pas le libellé de l’information professionnelle. Un recours hors cadre du produit nécessite une décision spécialisée attribuée et documentée.</p><p><b>Surveillance.</b> La pression est &lt;185/110 mmHg avant et &lt;180/105 mmHg ensuite pendant 24 heures. La neurologie, la respiration et le saignement sont suivis ; les antiagrégants et l’héparine intraveineuse sont évités pendant les premières 24 heures. L’information professionnelle distingue une héparine sous-cutanée limitée rendue nécessaire par une autre indication, décision spécialisée qui ne signifie pas anticoagulation thérapeutique de routine. Une dégradation impose imagerie et avis urgent ; la perfusion encore active est arrêtée si une complication hémorragique l’exige.</p><p><b>Effets et populations.</b> Une hémorragie intracrânienne ou extracrânienne et un angiœdème peuvent survenir ; les inhibiteurs de l’enzyme de conversion augmentent le risque d’angiœdème. L’âge avancé, les antécédents et la grossesse/allaitement demandent une évaluation individualisée des données limitées. L’information professionnelle ne fournit pas une réduction rénale improvisée ; une atteinte hépatique sévère peut contre-indiquer le traitement.</p><p><b>Essai décrit dans l’information professionnelle.</b> L’étude européenne ECASS-III (2008) a randomisé 821 patients dans la fenêtre de 3–4,5 heures, après la sélection de l’étude. Le résultat Rankin 0–1 à 90 jours a été observé chez 52,4 % sous altéplase contre 45,2 % sous placebo ; les hémorragies symptomatiques selon la définition ECASS-III étaient de 2,4 % contre 0,2 %. La population sélectionnée, le moment de mesure et la définition du saignement sont nécessaires à l’interprétation.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Propriétés/Effets, efficacité clinique AVC, paragraphe ECASS-III</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), Bibliographie, référence 78 : année 2008</a>.</p><div class="key"><b>À retenir.</b> Avant administration, l’information professionnelle complète, l’imagerie et les contre-indications sont contrôlées avec le spécialiste.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Indications AVC ; Posologie AVC ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll. — Swiss guidelines for acute stroke revascularization (2021), p. 1–3 : bénéfice et délai</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 9.1 et 3.1 : écarts entre recommandation clinique et information professionnelle</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 11 : INR &gt;1,7</a>.</p><p><button class="w" data-k="i63-calcul-alteplase">Reprendre les bases du calcul de dose</button>.</p></template>
<template data-pop="i63-metalyse" data-title="Metalyse 5000 U : ténectéplase accident vasculaire cérébral"><p><b>Produit.</b> Metalyse 5000 U, 25 mg, autorisation 69958, information professionnelle mai 2025, est le produit destiné à l’infarctus cérébral présenté. Il est indiqué dès 18 ans, dans les 4,5 heures après la dernière heure sans déficit et après exclusion d’hémorragie. La présentation de l’infarctus myocardique n’est pas utilisée comme équivalent.</p><p><b>Mécanisme.</b> La ténectéplase est un activateur tissulaire du plasminogène modifié, avec spécificité pour la fibrine et propriétés permettant un bolus. Elle favorise la formation de plasmine dans le thrombus ; sa durée d’action et son risque de saignement excluent une dose supplémentaire improvisée.</p><p><b>Preuves réellement lues dans l’information professionnelle.</b> L’information professionnelle décrit l’essai AcT (2022) : 802 patients du groupe ténectéplase et 765 du groupe altéplase, avec résultat Rankin 0–1 à 90–120 jours chez 36,9 % contre 34,8 % et analyse de non-infériorité selon la marge prédéfinie de cinq points. Elle décrit aussi une étude de 101 patients par groupe avec occlusion de gros vaisseau avant thrombectomie, montrant une reperfusion précoce selon le critère étudié chez 22 % contre 10 %. Ce sont des populations et critères distincts ; les chiffres ne promettent pas une supériorité uniforme sur la mortalité.</p><p><b>Dose du produit.</b> Metalyse 5000 unités, 25 mg, donne une solution de 5 mg/mL après reconstitution. Le tableau présente les paliers du produit suisse pour un bolus intraveineux unique de 5 à 10 secondes.</p><table class="t"><thead><tr><th>Poids en kg</th><th>Dose en mg et unités du produit</th><th>Volume à 5 mg/mL</th></tr></thead><tbody><tr><td>&lt;60</td><td>15 mg ; 3000 unités</td><td>3 mL</td></tr><tr><td>≥60 et &lt;70</td><td>17,5 mg ; 3500 unités</td><td>3,5 mL</td></tr><tr><td>≥70 et &lt;80</td><td>20 mg ; 4000 unités</td><td>4 mL</td></tr><tr><td>≥80 et &lt;90</td><td>22,5 mg ; 4500 unités</td><td>4,5 mL</td></tr><tr><td>≥90</td><td>25 mg ; 5000 unités</td><td>5 mL</td></tr></tbody></table><p>La dose nominale continue de 0,25 mg/kg des études ne remplace pas ces paliers. Le document bernois imprimé donne 17 mg pour 3,5 mL ; à 5 mg/mL, ce volume contient 17,5 mg, concordant avec le produit suisse. <button class="w" data-k="i63-calcul-volume">Voir bases, unités, calcul et exemple</button>.</p><h3>Contre-indications propres au produit suisse</h3><p>La liste suivante restitue les domaines de contre-indication de l’information professionnelle Metalyse 5000 U lue. Une exclusion clinique différente doit être attribuée à son référentiel ; la liste d’Actilyse n’est pas interchangeable.</p><table class="t"><tr><th>Domaine</th><th>Contre-indications de Metalyse 5000 U, mai 2025</th></tr><tr><td>Hypersensibilité</td><td>Ténectéplase, gentamicine résiduelle ou composants.</td></tr><tr><td>Saignement et hémostase</td><td>Hémorragie sévère manifeste ou dans les six derniers mois ; anticoagulation orale efficace, notamment rapport normalisé international &gt;1,3 ; diathèse hémorragique.</td></tr><tr><td>Hémorragie intracrânienne</td><td>Antécédent connu, prouvé ou suspecté, y compris hémorragie méningée.</td></tr><tr><td>Déficit actuel</td><td>Accident vasculaire cérébral ischémique sans déficit invalidant.</td></tr><tr><td>Antécédents neurologiques</td><td>Affection du système nerveux central, notamment tumeur, anévrisme ou chirurgie intracérébrale/intrarachidienne.</td></tr><tr><td>Pression et traumatisme</td><td>Hypertension sévère non contrôlée ; traumatisme crânien récent.</td></tr><tr><td>Foie et tube digestif</td><td>Atteinte hépatique sévère, notamment défaillance, cirrhose, hypertension portale ou hépatite évolutive ; maladie ulcéreuse digestive évolutive.</td></tr><tr><td>Lésions à risque</td><td>Anévrisme artériel ou malformation artérioveineuse connus ; néoplasie avec risque hémorragique accru.</td></tr><tr><td>Inflammation/infection</td><td>Endocardite bactérienne, péricardite ou pancréatite aiguë.</td></tr><tr><td>Obstétrique et geste invasif</td><td>Accouchement ; ponction récente d’un vaisseau non compressible, notamment sous-clavier ou jugulaire.</td></tr></table><p>Une histoire d’allergie, un geste récent ou un déficit non invalidant changent donc l’éligibilité avant le bolus. La thrombopénie, la glycémie extrême et certaines autres situations relèvent de mises en garde spécifiques du produit, détaillées ci-dessous ; elles ne sont pas reclassées silencieusement en contre-indications absolues.</p><p><b>Sécurité.</b> Hémorragie, hypertension non contrôlée, diathèse ou lésions à risque, anticoagulation efficace avec <button class="w" data-k="i63-calcul-coagulation">rapport normalisé international</button> &gt;1,3, maladies hépatiques sévères, endocardite et autres contre-indications sont recherchées dans l’information professionnelle complète. La thrombopénie &lt;100 ×10⁹/L est décrite comme un risque nécessitant appréciation, à distinguer de la formulation Actilyse. La <button class="w" data-k="i63-glucose">glycémie</button> &lt;2,8 ou &gt;22,2 mmol/L est corrigée avant traitement.</p><p><b>Surveillance et effets.</b> Les objectifs tensionnels sont &lt;185/110 avant et &lt;180/105 après pendant 24 h. Hémorragie et angiœdème imposent une prise en charge urgente ; les inhibiteurs de l’enzyme de conversion peuvent accroître l’angiœdème. Un bolus déjà administré ne peut pas être « arrêté » comme une perfusion. Les antiagrégants et l’héparine intraveineuse sont évités pendant 24 heures ; l’information professionnelle conserve une exception d’héparine sous-cutanée limitée pour une autre indication. Cette exception nécessite le spécialiste et ne justifie pas une anticoagulation thérapeutique de routine. Les décisions de prévention cérébrale ensuite utilisent l’imagerie de contrôle.</p><p><b>Grossesse/allaitement.</b> Les données sont limitées ; l’usage est réservé à une nécessité claire après évaluation du risque. L’information professionnelle prévoit de jeter le lait pendant les 24 premières heures après traitement. Ce cadre ne permet pas une recommandation générale pour toute femme enceinte.</p><div class="key"><b>À retenir.</b> Le prescripteur vérifie l’indication, la présentation 5000 U, le palier de poids et l’information professionnelle complète.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Indications ; Posologie/tableau ; Contre-indications ; Mises en garde ; Grossesse/allaitement ; Propriétés/Effets et efficacité clinique AcT/EXTEND-IA TNK</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069183/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Expedited recommendation on tenecteplase (2023), Recommandations et bibliographie, référence 21 : dose nominale, sous-populations et année AcT 2022</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 12 : incohérence de dose</a>.</p><p><button class="w" data-k="i63-glucose">Lire normalité du glucose et limites des seuils de thrombolyse</button>.</p><p><button class="w" data-k="i63-calcul-effets">Lire les bases et limites des comparaisons chiffrées d’essais</button>.</p></template>
<template data-pop="i63-aspirine" data-title="Aspirine Cardio : cadre suisse et utilisation clinique"><p><b>Produit.</b> Aspirine Cardio 100/300 mg, autorisation 51795, information professionnelle mars 2026, est une préparation gastro-résistante. L’information professionnelle prescrit 300 mg/jour pour la prophylaxie des AIT, sous forme de 100 mg trois fois/jour ou 300 mg une fois/jour. Le régime bernois de prévention secondaire à 100 mg/jour est une recommandation clinique distincte ; l’information professionnelle ne le décrit pas comme indication générique de l’infarctus cérébral.</p><p><b>Mécanisme et preuve.</b> L’acide acétylsalicylique inhibe irréversiblement la production de thromboxane par inhibition de cyclooxygénase plaquettaire. La prévention non cardioembolique et la bithérapie courte sont enseignées selon les recommandations cliniques, avec population, durée et risque hémorragique précisés. Ce produit n’est pas un thrombolytique.</p><p><b>Administration.</b> Le comprimé est avalé avec de l’eau, au moins 30 minutes avant le repas, sans être coupé, mâché ou écrasé. La formulation gastro-résistante n’est pas transformée en charge rapide par broyage. Aucune dose injectable d’un autre produit n’est déduite de cette information professionnelle.</p><p><b>Contre-indications et précautions.</b> L’information professionnelle contre-indique notamment hypersensibilité aux salicylés/anti-inflammatoires avec certains antécédents bronchospastiques, diathèse hémorragique, ulcère ou saignement digestif pertinent, maladie de Crohn ou rectocolite hémorragique, atteintes rénales ou hépatiques sévères, insuffisance cardiaque sévère, méthotrexate ≥15 mg/semaine et troisième trimestre de grossesse. Une <button class="w" data-k="i63-references-biologiques">clairance</button> &lt;30 mL/min appartient au cadre d’insuffisance rénale sévère de cette information professionnelle.</p><p><b>Interactions et suivi.</b> Anticoagulants, clopidogrel, anti-inflammatoires et certains antidépresseurs augmentent le saignement. Ibuprofène, naproxène ou métamizole peuvent perturber l’effet antiagrégant ; le traitement concomitant est revu. Le médecin recherche saignement digestif ou autre, réaction allergique et détérioration rénale selon le contexte.</p><p><b>Grossesse/allaitement.</b> Aux premier et deuxième trimestres, l’usage nécessite une indication claire et une dose/durée minimales ; le troisième trimestre est contre-indiqué dans le produit présenté. L’allaitement nécessite une appréciation individuelle, avec restrictions pour une prise régulière élevée selon l’information professionnelle. Une indication obstétricale d’une autre dose ne s’invente pas à partir de la prophylaxie des AIT.</p><div class="key"><b>À retenir.</b> La dose clinique, la dose autorisée pour l’AIT et la forme galénique doivent être distinguées.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Aspirine Cardio 100/300 mg (Mars 2026), Indications ; Posologie/AIT et administration ; Contre-indications ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 34 : aspirine 100 mg/jour</a> ; <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), Recommandation 1 et preuve</a>.</p></template>
<template data-pop="i63-plavix" data-title="Plavix : clopidogrel et emploi précoce"><p><b>Produit et indication.</b> Plavix 75/300 mg, autorisation 54509, information professionnelle septembre 2022, indique 75 mg une fois/jour pour la prévention des événements athérothrombotiques après accident vasculaire cérébral récent entre sept jours et six mois. L’information professionnelle déconseille l’emploi pendant les sept premiers jours suivant l’accident vasculaire cérébral. Une utilisation aiguë selon le référentiel européen ou bernois constitue un cadre clinique distinct, à documenter.</p><p><b>Mécanisme.</b> Le clopidogrel nécessite une bioactivation enzymatique, notamment par <button class="w" data-k="i63-metabolisme">cytochrome de la famille 2, sous-famille C, membre 19</button>. Le métabolite actif inhibe irréversiblement la voie <button class="w" data-k="i63-plaquettes">adénosine diphosphate</button>–<button class="w" data-k="i63-plaquettes">P2Y12</button>, empêchant une partie de l’activation plaquettaire. La variabilité de bioactivation et les interactions peuvent modifier l’efficacité ; aucune adaptation empirique de dose selon une hypothèse génétique n’est enseignée.</p><p><b>Preuve et schémas précoces.</b> La recommandation européenne soutient 21 jours de bithérapie dans la population mineure non cardioembolique sélectionnée et suggère une charge de 300 mg si le patient n’est pas déjà traité. Le protocole bernois utilise 600 mg puis 75 mg/jour. Les doses de charge de syndromes coronariens de l’information professionnelle ne sont pas présentées comme une autorisation accident vasculaire cérébral précoce.</p><p><b>Risques et contre-indications.</b> Les lésions organiques susceptibles de saigner, dont ulcère actif ou hémorragie cérébrale aiguë, l’insuffisance hépatique sévère et les diathèses hémorragiques sont contre-indiquées. L’hypersensibilité au produit et les antécédents d’allergie aux thiénopyridines le sont également ; la recherche porte sur les molécules de cette famille, car des réactions croisées existent. La prudence s’applique au risque de saignement et aux atteintes rénales selon le contexte. Un purpura thrombotique thrombocytopénique ou une hémophilie acquise sont des effets rares graves décrits dans l’information professionnelle ; une anomalie inhabituelle de l’hématologie ou de la coagulation nécessite une évaluation urgente.</p><p><b>Interactions.</b> L’oméprazole et l’ésoméprazole sont évités avec le clopidogrel selon l’information professionnelle ; tous les protecteurs gastriques ne produisent pas la même interaction. Les anticoagulants, anti-inflammatoires et autres médicaments exposant au saignement demandent une revue. Les inducteurs enzymatiques pertinents peuvent également augmenter l’activation et le risque.</p><p><b>Grossesse/allaitement et suivi.</b> L’usage pendant la grossesse est réservé à une nécessité ; l’allaitement n’est pas recommandé pendant le traitement selon l’information professionnelle. Le patient reçoit une date de passage en monothérapie lorsqu’un schéma court est retenu ; saignement, tolérance et adhésion sont contrôlés.</p><p><b>Essai décrit dans l’information professionnelle.</b> L’essai clopidogrel–aspirine publié en 1996 a comparé clopidogrel 75 mg/jour et aspirine 325 mg/jour chez 19 185 patients avec infarctus myocardique récent, accident vasculaire cérébral récent ou artériopathie périphérique. Le critère composite vasculaire était réduit dans l’ensemble de la population ; le sous-groupe inclus pour accident vasculaire cérébral ne montrait pas une différence statistiquement démontrée. Ce résultat ne valide pas une charge dans les sept premiers jours après accident vasculaire cérébral.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Propriétés/Effets, efficacité clinique, CAPRIE et analyses de sous-groupes</a> ; <a href="https://europepmc.org/article/MED/8918275" target="_blank" rel="noopener" data-reference-source="1">CAPRIE Steering Committee — A randomised, blinded trial of clopidogrel versus aspirin, notice bibliographique Europe PMC (1996), Notice du rapport, pubYear et première publication</a>.</p><div class="key"><b>À retenir.</b> Le 75 mg quotidien autorisé et la charge aiguë hors cadre de l’information professionnelle sont deux informations différentes.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Plavix 75/300 mg, clopidogrel (Septembre 2022), Indications AVC ; Posologie ; Mises en garde/J7 ; Contre-indications ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll. — European Stroke Organisation expedited recommendation for short-term dual antiplatelet therapy (2021), Recommandation 1 et dose de charge</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 34 : charge et durée</a>.</p></template>
<template data-pop="i63-eliquis" data-title="Eliquis : apixaban pour fibrillation atriale"><p><b>Produit et place.</b> Eliquis 2,5/5 mg, autorisation 61549, information professionnelle août 2026, prévient accident vasculaire cérébral et embolie systémique dans la fibrillation atriale non valvulaire selon les conditions du produit. Il inhibe directement le facteur Xa sans cofacteur antithrombine, diminuant la génération de thrombine. Il n’est pas un traitement de reperfusion de l’occlusion cérébrale.</p><p>La dose de fibrillation atriale dépend des critères du produit et de la situation rénale. Les concentrations et clairances ne sont pas des bornes normales dans cette décision ; leurs références analytiques suisses sont expliquées dans la fenêtre dédiée.</p><table class="t"><thead><tr><th>Situation de la notice</th><th>Dose ou restriction</th><th>Limite</th></tr></thead><tbody><tr><td>Régime de fibrillation atriale non valvulaire</td><td>5 mg deux fois par jour.</td><td>Vérifier les critères et situations ci-dessous.</td></tr><tr><td>Au moins deux critères : âge ≥80 ans, masse ≤60 kg, créatinine sérique ≥133 µmol/L</td><td>2,5 mg deux fois par jour.</td><td>Un critère isolé ne remplace pas cette règle à deux critères.</td></tr><tr><td>Clairance de créatinine 15–29 mL/min</td><td>Pas de réduction automatique au seul motif de cette clairance dans la notice suisse.</td><td>Prudence, critères de dose et risques propres restent vérifiés.</td></tr><tr><td>Clairance &lt;15 mL/min ou dialyse</td><td>Utilisation non recommandée.</td><td>Ce régime n’est pas assimilé à une autorisation chez le dialysé.</td></tr></tbody></table><p>La dose initiale plus élevée de certaines thromboses veineuses ne définit pas celle de la fibrillation atriale. <button class="w" data-k="i63-references-biologiques">Relire les unités, méthodes et références suisses de créatinine et de clairance</button>.</p><p><b>Début après infarctus.</b> Le moment de début dépend de l’étendue, du risque hémorragique et de l’imagerie. Les délais précoces ou au sixième jour décrits dans le protocole bernois concernent des patients sélectionnés ; ils ne font pas partie d’une règle universelle autorisant tout traitement. Une embolie de source indéterminée n’est pas une indication empirique d’apixaban.</p><p><b>Contre-indications et populations.</b> Saignement actif, hypersensibilité et maladie hépatique sévère ou avec coagulopathie pertinente contre-indiquent le produit. L’information professionnelle ne recommande pas son emploi pour valves artificielles ni dans certains syndromes antiphospholipides. L’utilisation pendant la grossesse n’est pas recommandée ; pendant l’allaitement, il faut choisir l’interruption du traitement ou de l’allaitement selon le rapport bénéfice/risque.</p><p><b>Interactions.</b> Les inhibiteurs puissants de <button class="w" data-k="i63-metabolisme">cytochrome de la famille 3, sous-famille A, membre 4</button> et P-glycoprotéine, notamment certains azolés et ritonavir, peuvent augmenter l’exposition ; l’information professionnelle suisse demande prudence et surveillance adaptée. Les inducteurs puissants, notamment rifampicine, carbamazépine, phénytoïne, phénobarbital ou millepertuis, peuvent réduire l’exposition. Les associations avec antiagrégants ou anti-inflammatoires augmentent le saignement ; aucun ajout systématique d’aspirine n’est justifié par le seul antécédent d’accident vasculaire cérébral.</p><p><b>Surveillance et administration.</b> Hémogramme, fonction rénale/hépatique et signes de saignement sont contrôlés selon le contexte. Le <button class="w" data-k="i63-calcul-coagulation">rapport normalisé international</button> n’est pas une cible d’efficacité et sa normalité n’exclut pas l’effet. Un dosage anti-Xa calibré peut aider dans certaines urgences. L’information professionnelle permet un comprimé écrasé selon ses modalités, avec eau ou glucose à 5 % et administration immédiate ; une administration par sonde respecte la préparation décrite, distincte des comprimés gastro-résistants.</p><p><b>Essai décrit dans l’information professionnelle.</b> Un essai publié en 2011 a comparé l’apixaban à la warfarine chez 18 201 patients avec fibrillation atriale. Le taux annuel d’accident vasculaire cérébral ou embolie systémique était de 1,27 % contre 1,60 %. La supériorité du critère composite était surtout liée à la réduction des événements hémorragiques ; les taux concernant les seuls événements ischémiques et embolies systémiques étaient comparables selon l’information professionnelle. Cette preuve de prévention ne détermine pas à elle seule le jour de début après un infarctus aigu.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Propriétés/Effets, efficacité clinique, ARISTOTLE et tableau 2</a> ; <a href="https://europepmc.org/article/MED/21870978" target="_blank" rel="noopener" data-reference-source="1">Granger et coll. — Apixaban versus warfarin in patients with atrial fibrillation, notice bibliographique Europe PMC (2011), Notice du rapport, pubYear et première publication</a>.</p><div class="key"><b>À retenir.</b> La classe, l’indication, la dose et le début après infarctus sont quatre décisions séparées.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Eliquis 2,5/5 mg, apixaban (Août 2026, LLD V032), Indications ; Posologie FA et insuffisances ; Contre-indications ; Mises en garde ; Interactions ; Grossesse/allaitement ; Pharmacodynamique et administration</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 34–35 : début et associations</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Embolie de source indéterminée</a>.</p><p><button class="w" data-k="i63-calcul-effets">Lire les bases et limites des comparaisons chiffrées d’essais</button>.</p></template>
<template data-pop="i63-sortis" data-title="Sortis : atorvastatine et prévention"><p><b>Produit.</b> Sortis 10/20/40/80 mg, autorisation 54085, information professionnelle avril 2025, traite les dyslipidémies selon le cadre indiqué et prévient certains premiers événements cardiovasculaires chez les sujets à haut risque. La stratégie de prévention secondaire après accident vasculaire cérébral athéroscléreux est attribuée aux recommandations cliniques ; elle n’est pas présentée comme une formulation générique de l’information professionnelle.</p><p><b>Mécanisme.</b> L’inhibition compétitive de la réductase de la 3-hydroxy-3-méthylglutaryl-coenzyme A diminue la synthèse hépatique de cholestérol et augmente les récepteurs hépatiques des <button class="w" data-k="i63-lipides">lipoprotéines de basse densité</button>, ce qui augmente la captation des particules <button class="w" data-k="i63-lipides">lipoprotéines de basse densité</button>. La diminution lipidique contribue à la prévention athéroscléreuse ; elle ne dissout pas l’occlusion aiguë.</p><p><b>Dose.</b> La dose initiale habituelle de l’information professionnelle est 10 mg une fois/jour, adaptée individuellement, avec titration à intervalles d’au moins quatre semaines et maximum 80 mg/jour. Le protocole bernois cite 80 mg/jour dans certaines stratégies de forte intensité. La cible générale européenne après accident vasculaire cérébral est un cholestérol des <button class="w" data-k="i63-lipides">lipoprotéines de basse densité</button> &lt;1,8 mmol/L ; le protocole bernois vise &lt;1,4 mmol/L et une baisse ≥50 % dans l’athérosclérose symptomatique à très haut risque. Aucune adaptation rénale n’est requise par l’information professionnelle.</p><p><b>Contre-indications et surveillance.</b> Maladie hépatique active, <button class="w" data-k="i63-references-biologiques">transaminases</button> persistantes &gt;3 fois la limite supérieure de la normale, cholestase, myopathie, grossesse/allaitement et association glécaprévir/pibrentasvir sont contre-indiquées. Le médecin contrôle le foie et recherche douleurs ou faiblesse musculaires ; une élévation significative des créatine kinase ou suspicion de myopathie motive l’interruption selon l’information professionnelle. Le signal hémorragique post hoc de certaines sous-populations de l’étude SPARCL appelle une appréciation individualisée.</p><p><b>Interactions.</b> Macrolides, azolés, ciclosporine et certains traitements antiviraux peuvent augmenter l’exposition et le risque musculaire ; l’information professionnelle prévoit des doses limites ou une surveillance selon association. La ciclosporine impose de ne pas dépasser 10 mg/jour ; le létermovir seul limite à 20 mg/jour. L’acide fusidique systémique nécessite l’interruption de la statine selon l’information professionnelle, avec reprise possible sept jours après la dernière dose d’acide fusidique. Une consommation excessive de jus de pamplemousse peut augmenter l’exposition ; l’absence de symptômes n’annule pas une interaction.</p><p><b>Essai décrit dans l’information professionnelle.</b> L’étude SPARCL (2006) de réduction intensive du cholestérol après accident vasculaire cérébral a comparé atorvastatine 80 mg/jour et placebo chez 4 731 patients ayant eu un accident vasculaire cérébral ou AIT dans les six mois, sans cardiopathie coronarienne connue. L’information professionnelle rapporte une réduction du critère accident vasculaire cérébral mortel ou non, avec un signal hémorragique dans les analyses post hoc. La mortalité toutes causes rapportée par l’information professionnelle était de 9,1 % sous atorvastatine contre 8,9 % sous placebo ; le bilan individuel tient compte de cette distinction.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis 10/20/40/80 mg, atorvastatine (Avril 2025, version 106 F), Propriétés/Effets, étude Stroke Prevention by Aggressive Reduction in Cholesterol Levels</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Bibliographie, référence 66 : année 2006</a>.</p><div class="key"><b>À retenir.</b> Le bénéfice préventif exige une indication et une intensité tolérable ; les interactions et le foie peuvent imposer une autre stratégie.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sortis 10/20/40/80 mg, atorvastatine (Avril 2025, version 106 F), Indications ; Posologie ; Contre-indications ; Effets musculaires ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 40 : statine forte intensité et objectifs</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Pharmacological interventions for long-term secondary prevention (2022), Objectif LDL général</a>.</p><p><button class="w" data-k="i63-calcul-effets">Lire les bases et limites des comparaisons chiffrées d’essais</button>.</p><p><button class="w" data-k="i63-calcul-multiples">Calculer une variation relative et un multiple de limite</button>.</p></template>
<template data-pop="i63-clexane" data-title="Clexane : énoxaparine et infarctus veineux"><p><b>Produit et cadre.</b> Clexane en seringues préremplies contient de l’énoxaparine sodique ; autorisation 49456, information professionnelle suisse février 2026. Les seringues 20–100 mg ont des volumes correspondant à 100 mg/mL, mais certaines présentations plus dosées ont une concentration différente. Clexane multi comporte de l’alcool benzylique et n’est pas confondu avec une seringue préremplie. Les héparines de bas poids moléculaire ne sont pas interchangeables par simple équivalence de volume.</p><p><b>Mécanisme et preuve.</b> L’énoxaparine renforce l’inhibition de la coagulation par l’antithrombine, avec une activité contre le facteur Xa supérieure à celle contre la thrombine. Le traitement limite la propagation et la récidive thrombotique ; il n’est pas présenté comme une thrombolyse artérielle. Le protocole bernois décrit l’énoxaparine dans la thrombose veineuse cérébrale ; le consensus européen préfère souvent cette classe, tout en soulignant la faible certitude de sa comparaison avec l’héparine non fractionnée. Les essais de thrombose des membres inférieurs ou de syndrome coronarien décrits dans l’information professionnelle ne constituent pas une preuve spécifique d’infarctus veineux cérébral.</p><p><b>Dose attribuée.</b> Le protocole bernois propose 1 mg/kg par voie sous-cutanée deux fois par jour pour cette thrombose. L’information professionnelle décrit le même régime dans la thrombose veineuse profonde des indications autorisées ; le choix pour la circulation cérébrale reste une décision clinique spécialisée. L’information professionnelle prévoit 1 mg/kg une fois par jour pour le régime thérapeutique en insuffisance rénale sévère, <button class="w" data-k="i63-references-biologiques">clairance</button> &lt;30 mL/min. Le consensus conseille d’envisager une autre héparine dans cette situation ; la correction du tableau information professionnelle n’est donc pas une autorisation de prescrire ce schéma cérébral sans avis. Il n’y a ni bolus myocardique ni voie intramusculaire dans le régime présenté.</p><div class="alert"><b>Écart clinique/information professionnelle à documenter.</b> L’information professionnelle comporte des contre-indications générales d’accident vasculaire cérébral, avec son exception pour embolies systémiques, ainsi que d’hémorragie active importante et d’accident vasculaire cérébral hémorragique récent ; elle n’énonce pas une indication spécifique d’infarctus veineux cérébral. Le protocole bernois et le consensus recommandent au contraire une anticoagulation lorsqu’une hémorragie est due à la congestion veineuse. Ce désaccord ne se résout pas en supprimant l’information professionnelle : neurologue et spécialiste de l’hémostase attribuent le mécanisme, évaluent les risques et documentent le recours au cadre clinique distinct.</div><p><b>Sécurité et surveillance.</b> Hypersensibilité, endocardite bactérienne aiguë et antécédent de thrombopénie immunitaire induite par héparine dans les 100 jours ou anticorps circulants contre-indiquent le produit. Une numération plaquettaire est faite avant puis régulièrement ; une baisse significative confirmée de 30–50 % impose l’arrêt et un relais spécialisé non héparinique selon l’information professionnelle. Saignement, hémogramme, rein et interventions prévues sont revus. Le temps de céphaline activée ne mesure pas de manière fiable l’activité de l’énoxaparine ; une surveillance adaptée n’est pas remplacée par un temps de céphaline activée normal. Les autres médicaments affectant l’hémostase augmentent le risque et les gestes neuraxiaux imposent des délais propres au produit.</p><p><b>Grossesse, allaitement et foie.</b> Le consensus privilégie la classe des héparines de bas poids moléculaire dans la thrombose veineuse cérébrale de grossesse ou du postpartum, avec gestion multidisciplinaire. L’information professionnelle réserve l’usage à un besoin clinique réel et décrit des précautions obstétricales ; elle ne recommande pas l’allaitement par précaution avec données limitées. Le consensus considère cette classe compatible avec l’allaitement ; cette position clinique est distinguée de la restriction suisse du produit. L’insuffisance hépatique appelle la prudence ; le flacon multidose et son conservateur ajoutent des précautions propres.</p><div class="key"><b>À retenir.</b> Dans la thrombose veineuse cérébrale, produit, poids, rein, <button class="w" data-k="i63-references-biologiques">plaquettes</button>, cause du saignement et statut clinique/information professionnelle sont contrôlés avant la décision. Cette fenêtre ne prescrit pas l’énoxaparine à tout infarctus.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane, énoxaparine en seringues préremplies (Février 2026), Composition ; Forme pharmaceutique ; Indications ; Posologie et insuffisance rénale ; Contre-indications ; Précautions/TIH, tests de laboratoire et gestes neuraxiaux ; Interactions ; Grossesse/allaitement ; Propriétés/Effets</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 32 : énoxaparine thérapeutique et hémorragie de congestion</a> ; <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener" data-reference-source="1">Weimar et coll. — New recommendations on cerebral venous and dural sinus thrombosis from the German consensus-based S2k guideline (2024 ; consensus révisé en octobre 2023), Anticoagulation in the acute phase : choix, faible certitude et rein ; Contraception and Pregnancy issues : grossesse et allaitement</a>.</p><p><button class="w" data-k="i63-calcul-multiples">Calculer une variation relative et un multiple de limite</button>.</p></template>
<template data-pop="i63-metabolisme" data-title="Métabolisme et transport des médicaments"><p>Les cytochromes impliqués ici sont des enzymes de métabolisme. La famille, la sous-famille et le numéro identifient un membre ; les chiffres ne sont pas des mots à développer. Pour l’apixaban, la voie de la famille 3, sous-famille A, membre 4 et la glycoprotéine P, un transporteur, expliquent des interactions pouvant modifier l’exposition et le risque hémorragique. Pour le clopidogrel, la voie de la famille 2, sous-famille C, membre 19 participe à la formation du métabolite actif ; l’inhibition de cette voie peut réduire l’effet antiagrégant. Une enzyme impliquée dans un produit ne définit pas toutes les interactions d’un autre produit.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Eliquis, information professionnelle suisse août 2026, interactions et pharmacocinétique</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Plavix, information professionnelle suisse septembre 2022, interactions et mécanisme d’action</a>.</p></template><template data-pop="i63-plaquettes" data-title="Activation plaquettaire et récepteur purinergique"><p>L’<button class="w" data-k="i63-plaquettes">adénosine diphosphate</button> est un médiateur qui active les <button class="w" data-k="i63-references-biologiques">plaquettes</button>. Le récepteur appelé <button class="w" data-k="i63-plaquettes">P2Y12</button> est une cible de cette voie ; son nom est une nomenclature de récepteur, pas un acronyme à développer artificiellement. Le métabolite actif du clopidogrel inhibe cette voie de façon irréversible pour la plaquette exposée. L’acide acétylsalicylique agit sur une autre voie, celle du thromboxane. Les deux médicaments augmentent le risque hémorragique ; leur association nécessite une indication et une durée.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener" data-reference-source="1">Plavix, information professionnelle suisse septembre 2022, mécanisme d’action</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener" data-reference-source="1">Aspirine Cardio, information professionnelle suisse mars 2026, mécanisme d’action</a>.</p></template><template data-pop="i63-lipides" data-title="Cholestérol des lipoprotéines et prévention"><p>Les <button class="w" data-k="i63-lipides">lipoprotéines de basse densité</button> transportent le cholestérol. Leur cholestérol mesuré sert au suivi du risque athéroscléreux. L’atorvastatine réduit la synthèse hépatique du cholestérol en inhibant la réductase de la 3-hydroxy-3-méthylglutaryl-coenzyme A ; l’augmentation des récepteurs hépatiques favorise ensuite la captation des <button class="w" data-k="i63-lipides">lipoprotéines de basse densité</button>. Le nom de l’enzyme décrit sa cible biochimique, pas une dose.</p><p>La cible européenne de prévention après infarctus ou accident ischémique transitoire est inférieure à 1,8 mmol/L dans le référentiel 2022. Le réseau bernois 2026 propose moins de 1,4 mmol/L et au moins 50 % de réduction dans l’athérosclérose symptomatique. Ces objectifs thérapeutiques ne sont pas un intervalle physiologique de laboratoire.</p><button class="w" data-k="i63-calcul-reduction">Comprendre la réduction relative de 50 %</button><p class="src">Référence : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau bernois 08/2026, prévention lipidique</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Sortis, information professionnelle suisse avril 2025, mécanisme d’action</a>.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446324/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation, prévention secondaire 2022, PICO lipides</a>.</p></template><template data-pop="i63-calcul-alteplase" data-title="Altéplase : calcul de dose, bolus et perfusion"><p><b>Base.</b> Dans l’indication cérébrale de l’information professionnelle suisse Actilyse, la dose totale est 0,9 mg/kg, plafonnée à 90 mg. Le bolus représente 10 % de la dose totale retenue ; le reste passe en perfusion sur 60 minutes. La solution standard contient 1 mg/mL.</p><p><b>Unités.</b> Une masse en kg multipliée par mg/kg donne des mg. Des mg divisés par mg/mL donnent des mL. Les valeurs suivantes sont inventées pour apprendre le calcul ; elles ne sont pas une prescription.</p><table class="t"><thead><tr><th>Étape</th><th>Exemple fictif de 70 kg</th></tr></thead><tbody><tr><td>Dose avant plafond</td><td>70 kg × 0,9 mg/kg = 63 mg.</td></tr><tr><td>Dose retenue</td><td>La plus petite valeur entre 63 mg et 90 mg est 63 mg.</td></tr><tr><td>Bolus</td><td>63 mg × 0,10 = 6,3 mg, soit 6,3 mL à 1 mg/mL.</td></tr><tr><td>Perfusion</td><td>63 − 6,3 = 56,7 mg, soit 56,7 mL sur 60 minutes.</td></tr><tr><td>Contrôle</td><td>6,3 + 56,7 = 63 mg ; la dose totale est sous le plafond.</td></tr></tbody></table><p><b>Limites.</b> Le poids doit être établi et le produit exact contrôlé. Au-delà de 100 kg, le plafond reste 90 mg ; on calcule le bolus sur cette dose plafonnée. Une autre concentration exige un nouveau calcul de volume. Les arrondis et le dispositif sont vérifiés selon le protocole. Le régime de l’infarctus du myocarde ne s’applique pas ici.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Actilyse, information professionnelle suisse juin 2025, posologie cérébrale et concentration standard</a>.</p></template><template data-pop="i63-calcul-volume" data-title="Masse, concentration et volume : ne pas confondre les produits"><p><b>Base.</b> Le volume nécessaire est la dose en mg divisée par la concentration en mg/mL. La concentration dépend du produit et de sa reconstitution ; les unités d’activité d’un thrombolytique ne sont pas interchangeables avec celles d’un autre.</p><table class="t"><thead><tr><th>Produit exact</th><th>Concentration de la présentation enseignée</th><th>Exemple fictif et lecture</th></tr></thead><tbody><tr><td>Actilyse cérébral</td><td>1 mg/mL, solution standard.</td><td>63 mg ÷ 1 mg/mL = 63 mL au total ; répartition selon sa fenêtre de calcul.</td></tr><tr><td>Metalyse 5000 unités, 25 mg</td><td>5 mg/mL après reconstitution.</td><td>Pour 70 kg : palier 70 à moins de 80 kg = 20 mg ; 20 ÷ 5 = 4 mL. Le produit correspond à 4000 unités.</td></tr><tr><td>Clexane 40 mg en 0,4 mL</td><td>100 mg/mL.</td><td>40 ÷ 100 = 0,4 mL ; d’autres présentations sont à 150 mg/mL et ne donnent pas le même volume.</td></tr></tbody></table><p><b>Étapes et limite.</b> Identifier l’indication, sélectionner la dose du produit, lire sa concentration, effectuer la division, puis vérifier la présentation et l’administration. Les paliers de Metalyse ne se remplacent pas par un calcul continu de 0,25 mg/kg : pour l’exemple fictif de 70 kg, ce calcul donnerait 17,5 mg, alors que le palier suisse donne 20 mg. Une égalité arithmétique ne prouve pas une interchangeabilité réglementaire.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Metalyse 5000 unités, information professionnelle suisse mai 2025, tableau 1 et reconstitution</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Actilyse, juin 2025, concentration standard</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Clexane, février 2026, présentations</a>.</p><p>Pour comprendre le calcul pondéral d’énoxaparine du protocole veineux bernois, un exemple fictif de 70 kg avec le schéma 1 mg/kg donne 70×1=70 mg par injection ; à 100 mg/mL, 70÷100=0,7 mL. Deux injections quotidiennes représentent 140 mg au total. Il faut sélectionner le schéma, le rein et la présentation avant ce calcul ; le schéma change en insuffisance rénale sévère et les seringues ne sont pas toutes à 100 mg/mL. Cette arithmétique n’autorise pas à traiter une hémorragie ou un infarctus artériel avec ce régime.</p></template><template data-pop="i63-calcul-mismatch" data-title="Mismatch de perfusion : rapport, différence et limites"><p><b>Base.</b> Le logiciel estime le volume du noyau lésé et celui de la région critique hypoperfusée. Pour la population de thrombolyse tardive européenne 2021, le rapport est volume hypoperfusé ÷ volume du noyau ; la différence est volume hypoperfusé − volume du noyau. Les deux volumes s’expriment en mL : le rapport n’a pas d’unité, la différence reste en mL.</p><table class="t"><thead><tr><th>Étape</th><th>Exemple pédagogique fictif</th></tr></thead><tbody><tr><td>Entrées</td><td>Noyau = 40 mL ; hypoperfusion critique = 60 mL.</td></tr><tr><td>Rapport</td><td>60 ÷ 40 = 1,5 ; il dépasse 1,2.</td></tr><tr><td>Différence</td><td>60 − 40 = 20 mL ; elle dépasse 10 mL.</td></tr><tr><td>Volume du noyau</td><td>40 mL est inférieur à 70 mL.</td></tr><tr><td>Portée</td><td>Les trois critères de volumes sont remplis dans cet exemple ; cela ne suffit pas à décider un traitement.</td></tr></tbody></table><p><b>Interprétation et limites.</b> Le rapport et la différence répondent à deux questions distinctes : proportion et quantité de tissu. Les seuils sont des critères de sélection issus d’essais, sans intervalle normal physiologique. Cette recommandation vise une fenêtre de 4,5 à 9 heures et une thrombectomie non indiquée ou non prévue ; elle est hors fenêtre de l’information professionnelle suisse. Un noyau nul rend la division indéfinie : le logiciel et le protocole doivent gérer ce cas, sans inventer un rapport. Qualité d’acquisition, logiciel, territoire et autres critères restent déterminants.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation, thrombolyse 2021, PICO 3.1 et note définissant le mismatch</a>.</p><p class="src">Référence : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Recommandation suisse de revascularisation 2021, tableau 1 : critères de mismatch variables selon étude</a>.</p></template><template data-pop="i63-calcul-reduction" data-title="Réduction relative : valeur de départ, unité et exemple"><p><b>Base.</b> Une réduction relative se calcule par (valeur initiale − valeur finale) ÷ valeur initiale × 100. Les deux valeurs doivent utiliser la même unité et la valeur initiale doit être non nulle. Le résultat est un pourcentage ; la différence brute conserve l’unité d’origine.</p><table class="t"><thead><tr><th>Étape</th><th>Exemple fictif de cholestérol des lipoprotéines de basse densité</th></tr></thead><tbody><tr><td>Entrées</td><td>Valeur initiale 3,0 mmol/L ; valeur finale 1,3 mmol/L.</td></tr><tr><td>Différence</td><td>3,0 − 1,3 = 1,7 mmol/L.</td></tr><tr><td>Rapport</td><td>1,7 ÷ 3,0 = 0,5667.</td></tr><tr><td>Pourcentage</td><td>0,5667 × 100 ≈ 56,7 %.</td></tr><tr><td>Lecture</td><td>La réduction dépasse 50 % et la valeur finale est sous 1,4 mmol/L dans cet exemple.</td></tr></tbody></table><p><b>Limites.</b> La cible bernoise concerne notamment l’athérosclérose symptomatique et la tolérance du patient ; cette opération n’établit pas une indication ni la dose d’une statine. Pour une baisse de <button class="w" data-k="i63-references-biologiques">plaquettes</button>, la même opération décrit l’évolution mais ne remplace pas les critères de thrombopénie induite par l’héparine. Des exemples de pourcentages ne sont pas des observations de patients.</p><p class="src">Référence : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau bernois 08/2026, prévention lipidique</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Clexane, février 2026, surveillance et baisse des plaquettes</a>.</p><p data-extension="final-calculs">Pour la pression artérielle, le consensus européen publié en 2026 discute une baisse prudente strictement inférieure à 15 % sur 24 heures lorsque la pression dépasse 220/120 mmHg sans reperfusion. Exemple fictif : systolique initiale 240 mmHg ; 15 % représentent 240×0,15=36 mmHg ; 240−36=204 mmHg. Cet exemple calcule la borne de 15 %, que le consensus demande de ne pas atteindre. Il ne prescrit ni une cible automatique de 204 mmHg, ni un médicament. La surveillance, les autres urgences et les deux composantes tensionnelles restent déterminantes.</p><p class="src">Référence : <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">ESO, publication mai 2026, tableau 11, PICO 2 : consensus expert et baisse proportionnelle</a>.</p></template>
<template data-pop="i63-references-biologiques" data-title="Paramètres : références suisses et seuils de décision"><p>Les recommandations suisses de revascularisation définissent des seuils de sécurité, sans intervalle universel pour chaque analyse. La Société Suisse d’Endocrinologie et de Diabétologie fournit une classification du glucose à jeun pour le dépistage chez l’adulte asymptomatique. Pour les intervalles analytiques, le tableau donne des exemples du laboratoire suisse Analytica réellement consultés ; le compte rendu du laboratoire qui mesure le patient reste la référence applicable. Ces exemples ne valent pas pour chaque âge, chaque méthode ou la grossesse.</p><p>Chaque ligne précise le prélèvement, la population disponible et la différence entre référence biologique et décision thérapeutique.</p><table class="t"><thead><tr><th>Paramètre et conditions</th><th>Référence suisse consultée</th><th>Portée dans l’infarctus</th></tr></thead><tbody><tr><td>Glucose à jeun, sérum ; fiche du test oral, sans population d’âge explicitée</td><td>3,9–5,5 mmol/L, Analytica ; le sérum doit être rapidement séparé.</td><td>Exemple analytique à jeun ; une <button class="w" data-k="i63-glucose">glycémie</button> d’urgence non à jeun ne se compare pas automatiquement à cet intervalle.</td></tr><tr><td><button class="w" data-k="i63-references-biologiques">Plaquettes</button>, sang avec anticoagulant acide éthylènediaminetétraacétique ; méthode par impédance</td><td>18–64 ans : 150–370 ×10⁹/L ; dès 65 ans : 160–370 ×10⁹/L.</td><td>Les seuils de thrombolyse et la baisse sous héparine sont des décisions distinctes ; rechercher une pseudo-thrombopénie si le prélèvement l’évoque.</td></tr><tr><td><button class="w" data-k="i63-references-biologiques">Créatinine</button> sérique, photométrie ; catégories femmes et hommes du laboratoire</td><td>Femmes : 44–80 µmol/L ; hommes : 62–106 µmol/L.</td><td>L’âge, la masse musculaire, l’évolution et la méthode comptent ; 133 µmol/L est un critère de dose d’apixaban, pas une borne normale.</td></tr><tr><td><button class="w" data-k="i63-calcul-coagulation">Rapport normalisé international</button> de prothrombine, plasma citraté, méthode de coagulation</td><td>Le laboratoire présente une limite normale &lt;1,3, sans borne basse.</td><td>Il ne faut pas inventer un intervalle fermé. Les objectifs sous antagoniste de vitamine K dépendent de l’indication ; un résultat bas n’exclut pas l’apixaban.</td></tr><tr><td><button class="w" data-k="i63-references-biologiques">Clairance</button> de <button class="w" data-k="i63-references-biologiques">créatinine</button> calculée sur sérum et urine des 24 heures</td><td>70–150 mL/min dans cette fiche ; âge non précisé.</td><td>Cette <button class="w" data-k="i63-references-biologiques">clairance</button> mesurée ne se substitue pas à une estimation médicamenteuse validée ; mL/min et mL/min/1,73 m² sont différents.</td></tr><tr><td><button class="w" data-k="i63-references-biologiques">Créatine kinase</button> totale, sérum, photométrie ; adultes</td><td>Hommes : &lt;190 U/L ; femmes : &lt;170 U/L.</td><td>Limites de laboratoire ; l’effort et l’hémolyse modifient l’interprétation. Un multiple de limite sous statine utilise le laboratoire du patient.</td></tr><tr><td>Alanine aminotransférase, sérum, photométrie</td><td>Femmes : &lt;35 U/L ; hommes : &lt;50 U/L ; enfants : &lt;35 U/L dans la fiche.</td><td>Le seuil de sécurité d’une statine est un multiple de la limite supérieure de sa méthode, avec persistance et symptômes.</td></tr><tr><td>Cholestérol des lipoprotéines de basse densité, mmol/L</td><td>Les références citées donnent des cibles de prévention après événement, sans intervalle physiologique unique.</td><td>Les objectifs &lt;1,8 ou &lt;1,4 mmol/L sont thérapeutiques, selon référentiel et population.</td></tr><tr><td>Pression artérielle, mmHg ; contexte aigu</td><td>Les documents d’infarctus définissent des plafonds de traitement, pas une normalité individuelle universelle.</td><td>La phase, la reperfusion et la tolérance déterminent la cible ; une cible chronique ne se transpose pas à la phase aiguë.</td></tr><tr><td>Volumes de perfusion, mL ; rapport sans unité ; délai de transit en secondes</td><td>Critères de logiciel et d’essai, sans intervalle normal clinique universel dans les sources lues.</td><td>Une valeur seuil d’imagerie sélectionne une population ; elle ne prouve pas à elle seule la viabilité de chaque cellule.</td></tr><tr><td>Doses, masses, délais et scores</td><td>Une dose s’exprime selon le produit ; un délai selon son événement de départ ; un score selon sa grille.</td><td>Ce ne sont pas des analytes ayant un intervalle biologique normal. La valeur zéro d’un score ne supprime pas tout risque.</td></tr></tbody></table><p>Lire un résultat exige donc quatre informations : unité, prélèvement et méthode, population, puis objectif de la décision. Une limite inférieure ou supérieure publiée seule ne devient pas un intervalle universel. Les séries de résultats et les symptômes restent utiles même si une valeur se situe dans la référence.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Diabetes_Risk-Assessment_Grundversorgung_FR_2014_1_.pdf" target="_blank" rel="noopener" data-reference-source="1">SSED, dépistage du diabète, septembre 2014, p. 3 : classification et conditions</a>.</p><p class="src">Référence : <a href="https://lvz.analytica.ch/analysis/Glucose-Toleranztest_oraler_(oGTT)_mit_Insulin" target="_blank" rel="noopener" data-reference-source="1">Analytica, catalogue consulté le 11 octobre 2026 : Glucose, prélèvement, méthode et références</a>.</p><p class="src">Référence : <a href="https://lvz.analytica.ch/analysis/Kreatinin" target="_blank" rel="noopener" data-reference-source="1">Analytica, catalogue consulté le 11 octobre 2026 : Créatinine, prélèvement, méthode et références</a>.</p><p class="src">Référence : <a href="https://lvz.analytica.ch/analysis/QuickINR" target="_blank" rel="noopener" data-reference-source="1">Analytica, catalogue consulté le 11 octobre 2026 : Quick et rapport normalisé, prélèvement, méthode et références</a>.</p><p class="src">Référence : <a href="https://lvz.analytica.ch/analysis/Kreatinin-Clearance" target="_blank" rel="noopener" data-reference-source="1">Analytica, catalogue consulté le 11 octobre 2026 : Clairance, prélèvement, méthode et références</a>.</p><p class="src">Référence : <a href="https://lvz.analytica.ch/analysis/CK_Creatin-Kinase_gesamt" target="_blank" rel="noopener" data-reference-source="1">Analytica, catalogue consulté le 11 octobre 2026 : Créatine kinase, prélèvement, méthode et références</a>.</p><p class="src">Référence : <a href="https://lvz.analytica.ch/analysis/Alanin-Amino-Transferase_(ALAT)" target="_blank" rel="noopener" data-reference-source="1">Analytica, catalogue consulté le 11 octobre 2026 : Alanine aminotransférase, prélèvement, méthode et références</a>.</p><p class="src">Référence : <a href="https://lvz.analytica.ch/Thrombozyten" target="_blank" rel="noopener" data-reference-source="1">Analytica, plaquettes, références adultes par âge ; consulté le 11 octobre 2026</a>.</p><p class="src">Référence : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Société Cérébrovasculaire Suisse, revascularisation 2021 : seuils de sécurité distincts des intervalles analytiques</a>.</p></template><template data-pop="i63-glucose" data-title="Glucose et hémoglobine glyquée : normalité, diagnostic et urgence"><p>Le glucose est un substrat énergétique. La <button class="w" data-k="i63-glucose">glycémie</button> mesure sa concentration dans le sang ; l’<button class="w" data-k="i63-glucose">hémoglobine glyquée</button> décrit une exposition plus durable. Un déficit focal d’urgence peut être accompagné
