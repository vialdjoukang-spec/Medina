 d’une anomalie du glucose : l’équipe mesure, corrige selon le contexte et réévalue les signes sans abandonner l’imagerie nécessaire.</p><p>La classification suivante vient de la Société Suisse d’Endocrinologie et de Diabétologie, septembre 2014, pour le dépistage chez l’adulte asymptomatique ; elle décrit le glucose plasmatique à jeun. La source donne une limite supérieure de normalité, sans définir une borne basse physiologique.</p><table class="t"><thead><tr><th>Classe du document suisse</th><th>Glucose plasmatique veineux à jeun</th><th>Conséquence et limite</th></tr></thead><tbody><tr><td>Normal pour la classification du dépistage</td><td>&lt;5,6 mmol/L.</td><td>Cette ligne ne dit pas qu’une valeur très basse est sûre ; elle n’est pas un algorithme d’urgence.</td></tr><tr><td><button class="w" data-k="i63-glucose">Glycémie</button> à jeun anormale</td><td>≥5,6 et &lt;7,0 mmol/L.</td><td>Catégorie de prédiabète dans ce document ; bilan et contexte sont nécessaires.</td></tr><tr><td>Seuil du diabète</td><td>≥7,0 mmol/L.</td><td>Chez l’asymptomatique, confirmation par une autre mesure un autre jour, sauf signes clairs d’hyper<button class="w" data-k="i63-glucose">glycémie</button>.</td></tr></tbody></table><p>Pour une référence analytique fermée à jeun, le laboratoire Analytica indique 3,9–5,5 mmol/L dans sa fiche sérique du test oral. L’âge n’y est pas précisé. Une mesure capillaire, après repas, pendant un infarctus aigu, sous perfusion ou chez la femme enceinte nécessite ses propres conditions d’interprétation ; la grossesse n’est pas couverte par la grille ci-dessus.</p><p>Les bornes extrêmes de la thrombolyse ont une autre fonction.</p><table class="t"><thead><tr><th>Document et situation</th><th>Bornes de glucose</th><th>Lecture clinique</th></tr></thead><tbody><tr><td>Recommandation suisse 2021, tableau 8</td><td>&lt;2,7 ou &gt;22,2 mmol/L.</td><td>Contre-indication relative ; vérifier persistance du déficit après correction et attribution à l’infarctus.</td></tr><tr><td>Information professionnelle Metalyse 5000 unités, mai 2025</td><td>&lt;2,8 ou &gt;22,2 mmol/L.</td><td>Correction avant traitement selon le produit ; ce ne sont pas des limites normales.</td></tr></tbody></table><p>L’<button class="w" data-k="i63-glucose">hémoglobine glyquée</button> s’exprime en pourcentage ou en mmol/mol. La méthode doit être standardisée. Les catégories du dépistage SSED 2014 sont présentées séparément.</p><table class="t"><tr><th>Catégorie de dépistage SSED 2014</th><th>Hémoglobine glyquée</th><th>Portée</th></tr><tr><td>Normalité de cette classification</td><td>&lt;5,7 % ou &lt;39 mmol/mol</td><td>Repère de dépistage chez l’adulte asymptomatique.</td></tr><tr><td>Zone intermédiaire de risque</td><td>5,7 à &lt;6,5 % ; 39 à &lt;48 mmol/mol</td><td>La SSED recommande une seconde mesure par une autre méthode dans cette zone ; elle ne suffit pas à diagnostiquer le diabète.</td></tr><tr><td>Seuil du diabète</td><td>≥6,5 % ou ≥48 mmol/mol</td><td>Confirmation un autre jour chez l’asymptomatique, sauf signes clairs d’hyperglycémie.</td></tr></table><p>Une hémoglobine glyquée à 6,0 % appartient à la zone intermédiaire ; elle n’est ni une glycémie instantanée ni une cible d’urgence. Une hémoglobinopathie, une transfusion, un renouvellement accéléré des globules rouges, une insuffisance rénale ou hépatique sévère et certaines interférences limitent l’interprétation. Elle ne mesure pas la <button class="w" data-k="i63-glucose">glycémie</button> de l’instant et n’établit pas seule la cause du déficit focal.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Diabetes_Risk-Assessment_Grundversorgung_FR_2014_1_.pdf" target="_blank" rel="noopener" data-reference-source="1">SSED septembre 2014, p. 3, tableau 3 et limites de l’hémoglobine glyquée</a>.</p><p class="src">Référence : <a href="https://lvz.analytica.ch/analysis/Glucose-Toleranztest_oraler_(oGTT)_mit_Insulin" target="_blank" rel="noopener" data-reference-source="1">Analytica, glucose sérique à jeun 3,9–5,5 mmol/L, conditions de prélèvement ; consulté le 11 octobre 2026</a>.</p><p class="src">Référence : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Revascularisation suisse 2021, tableau 8 : seuil 2,7 mmol/L</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Metalyse, mai 2025, glucose et correction</a>.</p></template><template data-pop="i63-filiere-suisse" data-title="Filière suisse : triage, transfert et régions isolées"><p>La Société Cérébrovasculaire Suisse organise deux décisions : reconnaître un déficit focal aigu, puis choisir le lieu capable de fournir la reperfusion utile. Les signes visuels, le vertige brutal avec impossibilité de marcher, la face, les membres et le langage comptent. Au réveil, le début reste inconnu et la dernière heure normale est consignée. Un déficit disparu motive aussi une évaluation urgente.</p><p>Le tableau expose les choix d’organisation publiés en 2021 ; le réseau actualise les trajets selon ressources, météo et état du patient.</p><table class="t"><thead><tr><th>Situation</th><th>Organisation enseignée</th><th>Limite</th></tr></thead><tbody><tr><td>Suspicion récente, filière habituelle</td><td>Appeler le 144 ; orienter vers une unité ou un centre avec imagerie et thrombolyse disponibles en permanence.</td><td>Une instabilité cardiorespiratoire peut imposer l’établissement le plus proche.</td></tr><tr><td>Occlusion proximale probable et centre à moins de 20 minutes</td><td>Transport direct vers le centre envisagé par la recommandation.</td><td>Un score positif suggère l’occlusion ; il ne la démontre pas.</td></tr><tr><td>Unité plus proche et trajet unité–centre dépassant 20 minutes</td><td>Thrombolyse en unité puis transfert peut être pertinent.</td><td>Éviter les détours ; mesurer le temps passé en unité et prévenir le centre.</td></tr><tr><td>Thrombolyse puis transfert</td><td>Objectif du séjour en unité inférieur à 50 minutes, maximum 60 ; conserver si possible l’équipe de transport.</td><td>Imagerie transmise ; pas de répétition systématique au centre sans motif nouveau.</td></tr><tr><td>Ponction au centre après transfert</td><td>Objectif 30 minutes après arrivée, maximum 60 dans le modèle publié.</td><td>Indicateur de qualité organisationnel, pas délai acceptable à attendre.</td></tr><tr><td>Transport direct au centre</td><td>Objectif de ponction 60 minutes après arrivée, maximum 90 dans ce modèle.</td><td>Comparer les modèles sur le délai réel et les résultats du réseau.</td></tr><tr><td>Début entre 8 et 24 heures et score d’occlusion positif</td><td>La recommandation préhospitalière 2021 favorise le centre directement, avec signaux prioritaires.</td><td>Si score faible, ses modalités de transport diffèrent ; sans score, urgence vers l’unité la plus proche et transfert organisé.</td></tr><tr><td>Trajet terrestre estimé au-delà de 45–60 minutes</td><td>Un transport aérien peut être utile selon les conditions ; en hélicoptère, centre directement.</td><td>Le responsable adapte à la météo, au trafic, à l’atterrissage et aux moyens disponibles.</td></tr><tr><td>Hôpital isolé disposant d’une expertise spécifique</td><td>Expert accessible dans les 30 minutes, imagerie permanente, laboratoire et électrocardiogramme dans les 45 minutes, thrombolyse possible dans les 60 minutes.</td><td>Ces moyens ne remplacent pas le transfert ultérieur vers l’unité ou le centre spécialisé.</td></tr></tbody></table><p>Le préavis transmet identité, handicap préalable, heure certaine ou dernière heure normale, score utilisé, anticoagulants et antiagrégants avec noms et horaires utiles, éventuelles contraintes de résonance, proche joignable et heure d’arrivée. Avant imagerie, aucune prescription antithrombotique empirique ne découle du seul soupçon. Les fonctions vitales sont prises en charge selon protocole ; une baisse tensionnelle préhospitalière systématique n’est pas enseignée. Les modèles de spécialiste se déplaçant vers l’unité ou d’ambulance équipée pour thrombolyse étaient jugés peu adaptés à la Suisse en 2021 ; cette appréciation datée n’interdit pas une réévaluation future.</p><p class="src">Référence : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll., recommandations nationales préhospitalières 2021, p. 322–328, tableaux 1–4 et recommandations de triage</a>.</p><p>Dans l’organisation nationale de 2021, un détour de plus de 10 minutes ne doit pas être créé pour rejoindre une unité si le trajet direct au centre est déjà préférable. Ce repère se lit avec les temps centre–unité et avec l’état du patient ; il n’est pas une règle cartographique indépendante.</p><p class="src">Référence : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll., 2021, règles de triage, détour et trajet direct</a>.</p></template><template data-pop="i63-exceptions-suisses" data-title="Thrombolyse : exceptions suisses et limites actuelles"><p>Les tableaux nationaux suisses de 2021 classent des obstacles à la thrombolyse en contre-indications certaines, relatives et situations n’excluant pas à elles seules le traitement. Ce classement est clinique et daté. Les informations professionnelles actuelles de l’altéplase et de la ténectéplase peuvent être plus restrictives ; toute divergence se vérifie avec le produit et le spécialiste. Une liste nationale historique ne vaut pas autorisation générale.</p><p>Le tableau reformule les groupes pertinents des tableaux 7 à 9 ; les temps se mesurent depuis l’événement indiqué.</p><table class="t"><thead><tr><th>Classe suisse 2021</th><th>Critères regroupés et conditions</th><th>Conséquence</th></tr></thead><tbody><tr><td>Obstacle certain : intracrânien</td><td>Hémorragie aiguë ou subaiguë, suspicion de saignement méningé, source d’ancienne hémorragie méningée non traitée ou inconnue ; lésion vasculaire importante à risque, anévrisme géant &gt;25 mm ; tumeur intracrânienne maligne active.</td><td>Exclusion ou évaluation selon le classement source et le produit ; une imagerie est indispensable.</td></tr><tr><td>Obstacle certain : geste ou traumatisme</td><td>Geste intracrânien ou intrarachidien depuis moins de 14 jours, excepté ponction lombaire ; traumatisme crânien modéré à grave depuis moins de 6 semaines.</td><td>Le délai du produit actuel peut différer : il doit être explicitement vérifié.</td></tr><tr><td>Obstacle certain : anticoagulation</td><td><button class="w" data-k="i63-calcul-coagulation">Rapport normalisé international</button> &gt;1,7 ou temps de céphaline activée &gt;40 secondes dans ce document ; effet d’un anticoagulant récent évalué avec dosage adapté.</td><td>Le produit de thrombolyse peut utiliser &gt;1,3 ; un test standard n’exclut pas un anticoagulant direct.</td></tr><tr><td>Obstacle certain : autre cause ou infection</td><td>Déficit expliqué par un autre diagnostic sans indication ; endocardite, péricardite ou vascularite active du système nerveux central ; anévrisme aortique symptomatique.</td><td>Établir la cause et le risque avant traitement.</td></tr><tr><td>Obstacle relatif : autonomie et cerveau</td><td>Handicap préalable important, infarctus récent de moins de 6 semaines, antécédents hémorragiques contrôlés, anévrisme de 10–25 mm, petite malformation, dissection intracrânienne ou nombreux micro-saignements.</td><td>Balance individualisée ; ne pas confondre situation relative nationale et contre-indication du produit.</td></tr><tr><td>Obstacle relatif : clinique et biologie</td><td>Crise inaugurale ou glucose extrême si un infarctus reste établi ; <button class="w" data-k="i63-references-biologiques">plaquettes</button> &lt;100 ×10⁹/L ; pression au-dessus de 185/110 mmHg ; risque hémorragique sous antiagrégants puissants.</td><td>Corriger ce qui est corrigible, documenter la persistance du déficit et contrôler la notice du produit.</td></tr><tr><td>Obstacle relatif : gestes et grossesse</td><td>Chirurgie, saignement interne ou biopsie récents, notamment moins de 14 jours ; traumatisme extracrânien important depuis moins de 6 semaines ; grossesse.</td><td>Comparer au libellé actuel et aux possibilités de traitement alternatives.</td></tr><tr><td>N’exclut pas à soi seul dans ce classement</td><td>Mono-antiagrégation ou aspirine–clopidogrel ; anticoagulation sans activité pertinente démontrée ; antivitamine K avec rapport ≤1,7 dans le classement national.</td><td>Le cadre des produits suisses est plus restrictif pour certaines anticoagulations ; aucune permission automatique.</td></tr><tr><td>Autres situations non exclusives à elles seules dans le document</td><td>Source d’hémorragie méningée traitée, accident ischémique transitoire ancien, hygroma sans hématome sous-dural, peu de micro-saignements, petit anévrisme &lt;10 mm, tumeur bénigne ; cancer extracrânien après analyse du risque.</td><td>L’histoire exacte et l’imagerie déterminent le risque ; une étiquette isolée ne remplace pas l’évaluation.</td></tr><tr><td>Gestes et saignements contextualisés</td><td>Petit geste sur site compressible, ponction lombaire ou artérielle, angiographie ou intervention coronaire, ancien saignement contrôlé, menstruation.</td><td>Vérifier médicaments, hémostase, site et produit actuel.</td></tr></tbody></table><p>Pour les anticoagulants directs, le document national discute des dosages calibrés et de situations de réversion. Cela exige disponibilité, temps depuis la prise, fonction rénale et expertise ; un nombre imprimé ne suffit pas. Le cours n’en déduit pas une dose d’antidote sans l’information professionnelle suisse du produit correspondant. L’absence de résultat biologique ne doit pas retarder arbitrairement la filière lorsque le protocole n’exige pas ce résultat et que l’histoire ne suggère pas de trouble ; cette décision appartient à l’équipe.</p><button class="w" data-k="i63-references-biologiques">Distinguer normes, unités et seuils de coagulation</button><p class="src">Référence : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll., recommandation nationale 2021, tableaux 7–9 et discussion des anticoagulants</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Actilyse, juin 2025, contre-indications et mises en garde</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Metalyse, mai 2025, contre-indications et mises en garde</a>.</p><p>Les dosages de médicaments suivants sont des seuils de décision du tableau 7 suisse de 2021. Ils exigent une calibration adaptée ; le tableau ne définit pas un intervalle biologique normal applicable à tout appareil.</p><table class="t"><thead><tr><th>Exposition recherchée</th><th>Seuil national 2021, tableau 7</th><th>Limite</th></tr></thead><tbody><tr><td>Héparine à dose thérapeutique</td><td>Activité anti-facteur Xa &gt;0,2 U/mL.</td><td>Unités d’activité ; ne pas substituer un dosage d’anticoagulant direct en ng/mL.</td></tr><tr><td>Apixaban, rivaroxaban ou édoxaban</td><td>Concentration plasmatique calibrée &gt;100 ng/mL.</td><td>Seuil daté de protocole ; le résultat et le produit exact sont discutés.</td></tr><tr><td>Dabigatran</td><td>Temps de thrombine &gt;80 secondes ou concentration calibrée anti-facteur IIa &gt;100 ng/mL.</td><td>Un test standard normal ne remplace pas systématiquement un dosage spécifique. La réversion relève du spécialiste.</td></tr><tr><td>Micro-saignements</td><td>Risque accru quand leur nombre est supérieur à environ 10, ou avec sidérose superficielle étendue, tableau 8.</td><td>Imagerie et histoire hémorragique ; ce nombre n’est pas un seuil biologique normal.</td></tr><tr><td>Lésion vasculaire à risque</td><td>Malformation artérioveineuse ou fistule volumineuse, cavernome avec saignement antérieur non totalement traité, ou cavernomes multiples, tableau 7.</td><td>Le risque dépend de la lésion précise ; un nom générique ne suffit pas.</td></tr></tbody></table><p class="src">Référence : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll., 2021, tableaux 7 et 8 ; divergences actuelles vérifiées dans la notice du thrombolytique</a>.</p><p>Le tableau 9 national de 2021 mentionne une dernière prise d’anticoagulant direct depuis plus de 48 heures, ou plus de 24 heures si la fonction rénale est jugée normale, parmi les situations n’excluant pas à elles seules une thrombolyse. Il ne définit pas ici de seuil rénal universel ; la chronologie, le médicament et son activité mesurée restent nécessaires. Ces repères historiques ne remplacent pas la notice actuelle du thrombolytique, qui peut être plus restrictive.</p></template><template data-pop="i63-situations-particulieres" data-title="Situations particulières, surveillance et volonté du patient"><p>Un déficit faible au score peut être invalidant : activités, langage et profession sont pris en compte. Une occlusion proximale prouvée peut justifier une discussion de geste malgré un déficit peu coté ou fluctuant. La surveillance doit permettre une réévaluation rapide si le déficit s’aggrave. Le référentiel suisse 2021 ne pose pas de limite générale supérieure de score, alors que le produit Actilyse comporte une restriction de gravité : cette divergence reste documentée.</p><p>Le tableau rassemble les situations particulières de la recommandation nationale ; il ne prescrit ni anesthésique ni antihypertenseur.</p><table class="t"><thead><tr><th>Situation</th><th>Enseignement du document suisse 2021</th><th>Limite actuelle</th></tr></thead><tbody><tr><td>Thrombolyse et thrombectomie toutes deux indiquées</td><td>Commencer la thrombolyse sans attendre le geste ni une amélioration ; organiser simultanément le transfert.</td><td>Délais, imagerie, territoire et produits exacts restent vérifiés.</td></tr><tr><td>Anesthésie du geste</td><td>Anesthésie générale et sédation sont discutées selon conscience, coopération, agitation, ventilation et état cardiopulmonaire.</td><td>Pas de technique universellement imposée par cette recommandation ; décision de l’équipe.</td></tr><tr><td>Surveillance après reperfusion</td><td>Unité spécialisée, surveillance clinique et tensionnelle continue pendant au moins 24 heures ; imagerie et recherche d’une complication si aggravation.</td><td>Les notices actuelles prévoient d’éviter les antiagrégants et héparine intraveineuse pendant 24 heures ; le document national citait 12–24 heures.</td></tr><tr><td>Mobilisation et thrombose veineuse</td><td>Mobilisation adaptée et prévention de thrombose selon risque ; compression pneumatique dans les situations indiquées.</td><td>Une mobilisation très intensive immédiate n’est pas déduite ; distinguer prévention veineuse et prévention cérébrale.</td></tr><tr><td>Infarctus expansif hémisphérique ou cérébelleux</td><td>Discuter rapidement la décompression si menace ; la reperfusion préalable n’écarte pas automatiquement la chirurgie.</td><td>Hémostase et risque opératoire sont réévalués ; certaines personnes de plus de 60 ans peuvent être sélectionnées.</td></tr><tr><td>Consentement en urgence</td><td>Rechercher capacité, volonté exprimée et directives ; si incapacité et urgence, le document discute une volonté présumée et l’information des proches sans retard évitable.</td><td>Respecter un refus compétent connu ; documenter la décision et son contexte. Ce paragraphe n’est pas un avis juridique exhaustif.</td></tr></tbody></table><p>La sélection tardive antérieure ne se transpose pas automatiquement à l’artère basilaire : les critères d’imagerie et le bénéfice selon gravité sont propres au territoire. Les recommandations européennes 2024 sur la basilaire et 2026 sur la pression sont attribuées séparément. Les cibles de pression du texte suisse 2021 ne sont donc pas reproduites comme la règle actuelle unique.</p><p class="src">Référence : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll., revascularisation suisse 2021, sélection, anesthésie, surveillance, craniectomie et consentement</a>.</p><p class="src">Référence : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau bernois 08/2026, surveillance et infarctus expansifs</a>.</p></template><template data-pop="i63-calcul-coagulation" data-title="Rapport normalisé de coagulation : méthode et limites"><p>Le rapport normalisé international standardise un temps de prothrombine selon la sensibilité du système de mesure. Le laboratoire utilise son étalonnage ; la valeur n’a pas d’unité. La référence analytique suisse consultée donne une limite normale inférieure à 1,3, sans borne basse. La cible sous antagoniste de vitamine K dépend de l’indication.</p><p>Les produits de thrombolyse enseignés utilisent le seuil 1,3 sous anticoagulation efficace ; les protocoles cliniques suisses peuvent utiliser 1,7. Ces valeurs ne sont ni des doses ni une mesure fiable de tout anticoagulant direct. Eliquis précise que les variations de ce test sont faibles et variables : un résultat dans la référence ne prouve pas l’absence de médicament.</p><button class="w" data-k="i63-references-biologiques">Vérifier le prélèvement citraté et les références suisses</button><p class="src">Référence : <a href="https://lvz.analytica.ch/analysis/QuickINR" target="_blank" rel="noopener" data-reference-source="1">Analytica, Quick et rapport normalisé, prélèvement, référence et limites ; consulté le 11 octobre 2026</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Eliquis, août 2026, pharmacodynamie et tests de coagulation</a>.</p><p><b>Base du calcul.</b> Le temps de prothrombine du patient est divisé par le temps normal du système de mesure, puis ce rapport est élevé à la puissance de l’indice international de sensibilité du réactif. Les temps sont en secondes ; leur rapport et le résultat normalisé n’ont pas d’unité. L’indice dépend du couple appareil–réactif.</p><p>Exemple inventé pour l’apprentissage : temps patient 24 secondes, temps normal 12 secondes et indice de sensibilité 1. Le rapport vaut 24 ÷ 12 = 2 ; élevé à la puissance 1, le résultat reste 2. Avec un autre indice, le résultat change : on ne peut pas remplacer l’indice réel par 1. L’étalonnage relève du laboratoire ; le calcul illustratif ne remplace pas son résultat.</p><p>Le Centre Suisse de Contrôle de Qualité explique l’influence du remplissage du tube citraté, de la préparation, de l’appareil et du réactif. Une cible thérapeutique sous antagoniste de vitamine K n’est pas un intervalle normal hors traitement.</p><p class="src">Référence : <a href="https://www.cscq.ch/SiteCSCQ/FichierPDF_FR/FT-Temps-thromboplastine.pdf" target="_blank" rel="noopener" data-reference-source="1">CSCQ, Temps de thromboplastine en pourcentage et en rapport normalisé, juillet 2017, p. 2 : formule, étalonnage et erreurs ; principes analytiques, sans reprise des obligations légales datées</a>.</p><p>Pour le temps de céphaline activée, le protocole bernois 08/2026 donne une référence de 26–37 secondes dans son contexte institutionnel, sans en faire une normalité universelle. Une cible de 1,5–2,5 fois la valeur de départ sous héparine non fractionnée est un rapport thérapeutique distinct. Exemple fictif : départ 30 secondes, borne basse 1,5×30=45 secondes, borne haute 2,5×30=75 secondes ; l’équipe suit son étalonnage et ses tests, notamment si la valeur de départ est anormale. Cette cible ne s’applique pas à l’énoxaparine ni aux anticoagulants oraux directs.</p><p class="src">Référence : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau bernois 08/2026, p.32–33 : référence contextuelle, ratio de temps sous héparine non fractionnée et limites</a>.</p></template>
<template data-pop="i63-calcul-effets" data-title="Effets des essais : différence absolue et rapport"><p><b>Base.</b> Comparer deux proportions exige le même événement, la même période et des populations comparables. La différence absolue soustrait les deux pourcentages et s’exprime en points de pourcentage ; le rapport de risques divise deux risques et n’a pas d’unité.</p><p>Exemple fictif : 10 événements sur 100 personnes contre 7 sur 100 pendant la même période. Les risques sont 10 % et 7 % ; la réduction absolue est 10 − 7 = 3 points. Le rapport est 7 ÷ 10 = 0,70 ; la réduction relative vaut (1 − 0,70) × 100 = 30 %. Les trois nombres décrivent le même exemple avec trois unités ou sens différents.</p><p>Dans la synthèse européenne de bithérapie 2021, la réduction absolue d’infarctus à 90 jours est 2,6 points pour la population étudiée. L’inverse en proportion donne 1 ÷ 0,026 ≈ 38,46, soit environ 39 personnes à traiter pour éviter un événement sur ce suivi si l’effet de l’étude s’applique. Ce calcul pédagogique dérivé utilise l’effet moyen publié ; il n’est pas une garantie individuelle et ne compte pas les saignements. Le régime étudié est court, avec bénéfice surtout pendant les 21 premiers jours.</p><p>Un rapport des risques instantanés estimé par une analyse de survie tient compte du temps : il ne s’obtient pas nécessairement en divisant les pourcentages annuels arrondis. Ainsi, les taux de 1,27 % et 1,60 % par an de l’essai apixaban–warfarine décrivent un critère composite ; leur différence vaut 0,33 point par an. Elle ne démontre pas une réduction de 0,33 point des seuls infarctus ischémiques et ne fournit pas directement un nombre à traiter valable pour n’importe quelle durée. La notice attribue particulièrement la différence aux événements hémorragiques.</p><p><b>Limites.</b> Toujours lire le critère, l’intervalle d’incertitude, la durée, la population et le comparateur. Une étude de non-infériorité utilise une marge prédéfinie : elle ne prouve pas une supériorité uniforme.</p><p class="src">Références : <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener" data-reference-source="1">Dawson et coll., bithérapie 2021, PICO 1 et bénéfice temporel</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener" data-reference-source="1">Eliquis, août 2026, essai apixaban–warfarine, critère composite et taux annuels</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Metalyse, mai 2025, essai de non-infériorité</a>.</p></template>
<template data-pop="i63-calcul-multiples" data-title="Variations biologiques : pourcentage et multiple d’une limite"><p>Une baisse relative compare le résultat actuel à la valeur initiale du même paramètre. Un multiple de limite compare le résultat à la limite supérieure du laboratoire qui mesure le patient. Ces rapports n’ont pas d’unité si les deux valeurs sont exprimées dans la même unité.</p><table class="t"><thead><tr><th>Calcul</th><th>Étapes sur un exemple fictif</th><th>Interprétation</th></tr></thead><tbody><tr><td>Baisse des plaquettes</td><td>Valeur initiale 250 ×10⁹/L, valeur actuelle 150 ×10⁹/L. Différence : 250−150=100 ×10⁹/L. Rapport : 100/250=0,40. Pourcentage : 0,40×100=40 %.</td><td>L’information professionnelle Clexane demande une réaction à une baisse confirmée de 30–50 % ; rester près d’une borne analytique normale n’élimine pas ce signal.</td></tr><tr><td>Multiple de limite d’alanine aminotransférase</td><td>Exemple fictif : femme, même méthode sérique Analytica, limite supérieure 35 U/L ; résultat 140 U/L. Rapport : 140/35=4. Trois fois cette limite : 3×35=105 U/L.</td><td>Le résultat dépasse trois fois cette limite. La persistance, les symptômes et l’information professionnelle Sortis déterminent la conduite ; ce n’est pas une règle d’arrêt fondée sur une valeur isolée.</td></tr></tbody></table><p>Avant de calculer, vérifier que la série concerne le même analyte, des unités et méthodes comparables et un prélèvement fiable. Une pseudo-thrombopénie ou une variation de méthode peut fausser le rapport. Chaque exemple est pédagogique et ne décrit aucun patient réel.</p><button class="w" data-k="i63-references-biologiques">Vérifier les unités, les références suisses et leurs populations</button><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Clexane, février 2026, thrombocytopénie et baisse confirmée de 30–50 %</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener" data-reference-source="1">Sortis, avril 2025, transaminases persistantes au-delà de trois fois la normale</a>.</p><p class="src">Référence : <a href="https://lvz.analytica.ch/analysis/Alanin-Amino-Transferase_(ALAT)" target="_blank" rel="noopener" data-reference-source="1">Analytica, alanine aminotransférase sérique, photométrie, limites par catégorie</a>.</p></template>





<template data-pop="i63-calcul-volume-lesion" data-title="Volume de lésion : estimation depuis trois diamètres"><p>Le guide suisse 2021 propose une estimation lorsqu’aucun calcul automatique n’est disponible : volume ≈ (a × b × c) ÷2. Les lettres désignent les plus grands diamètres de la lésion dans trois plans. Chaque longueur doit utiliser la même unité ; des centimètres donnent des centimètres cubes, et 1 cm³ correspond à 1 mL.</p><table class="t"><tr><th>Étape</th><th>Exemple pédagogique fictif</th></tr><tr><td>Diamètres</td><td>a=4 cm ; b=3 cm ; c=2 cm.</td></tr><tr><td>Produit</td><td>4 ×3 ×2=24 cm³.</td></tr><tr><td>Estimation</td><td>24 ÷2=12 cm³, soit environ 12 mL.</td></tr><tr><td>Lecture</td><td>Le nombre estime un volume géométrique ; il ne décide pas à lui seul d’une reperfusion.</td></tr></table><p>La division par deux est l’approximation proposée par ce guide, et non une mesure biologique exacte. Les contours irréguliers, les différentes méthodes définissant noyau/pénombre et la qualité des images limitent le résultat ; le protocole du centre et la neuroradiologie gouvernent son emploi. Une valeur en millimètres ne s’introduit pas comme si elle était en centimètres.</p><p class="src">Source : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener">Michel et collègues, recommandations nationales suisses 2021, tableau 1, note sur l’absence de calcul automatique</a>.</p></template>
<template data-pop="i63-calcul-risque-ait" data-title="Score ABCD2 : calcul, seuil d’étude et limites"><p>ABCD2 est le nom d’un score associant Age, Blood pressure (pression), Clinical features (signes), Duration (durée) et Diabetes (diabète). Le chiffre 2 rappelle les deux dimensions commençant par D ; il ne signifie pas qu’il faut multiplier le total par deux. Le protocole bernois 2026 présente les points suivants.</p><table class="t"><tr><th>Composante</th><th>Critère</th><th>Points</th></tr><tr><td>Âge</td><td>≥60 ans</td><td>1 ; sinon 0</td></tr><tr><td>Pression mesurée</td><td>Systolique ≥140 mmHg ou diastolique ≥90 mmHg</td><td>1 ; sinon 0</td></tr><tr><td>Manifestation clinique</td><td>Faiblesse unilatérale, avec ou sans trouble de parole</td><td>2</td></tr><tr><td>Manifestation clinique alternative</td><td>Trouble de parole sans faiblesse</td><td>1 ; autre présentation 0</td></tr><tr><td>Durée</td><td>≥60 minutes</td><td>2</td></tr><tr><td>Durée alternative</td><td>10–59 minutes</td><td>1 ; &lt;10 minutes 0</td></tr><tr><td>Diabète</td><td>Diabète présent</td><td>1 ; sinon 0</td></tr></table><p>Une seule ligne clinique et une seule ligne de durée sont retenues ; on additionne ensuite les cinq composantes. Exemple fictif : 65 ans, 150/85 mmHg, faiblesse durant 20 minutes, sans diabète donnent 1+1+2+1+0=5 points. Les bornes de pression sont des critères du score, pas un intervalle de normalité.</p><p>Pour l’aspirine–clopidogrel, la recommandation européenne 2021 retient un AIT à risque défini par au moins quatre points, dans les 24 heures et après imagerie. Ce seuil de sélection ne diagnostique pas l’AIT et ne remplace pas l’évaluation d’une sténose, d’une cause cardioembolique ou d’un risque hémorragique. Un score bas ne justifie ni de retarder la filière urgente ni de négliger une présentation postérieure.</p><p>Le tableau bernois décrit séparément des groupes 0–3, 4–5 et 6–7 points associés aux risques historiques à deux jours de 1 %, 4 % et 8 %. Ces estimations dépendent de la population et de la prise en charge ; le seuil de quatre points d’une étude thérapeutique ne porte donc pas le même sens que la catégorie élevée de six à sept points.</p><table class="t"><tr><th>Groupe bernois</th><th>Risque historique à deux jours</th><th>Portée</th></tr><tr><td>0–3 points</td><td>Environ 1 %</td><td>Estimation pronostique, pas exclusion de l’urgence.</td></tr><tr><td>4–5 points</td><td>Environ 4 %</td><td>Groupe intermédiaire ; peut atteindre le critère européen de bithérapie.</td></tr><tr><td>6–7 points</td><td>Environ 8 %</td><td>Groupe élevé de cette stratification.</td></tr></table><p>Le médecin interprète le total avec le diagnostic et l’imagerie ; ces risques ne constituent pas des probabilités personnelles garanties.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener">Réseau bernois, août 2026, p.19, tableau ABCD2</a> ; <a href="https://doi.org/10.1177/23969873211000877" target="_blank" rel="noopener">European Stroke Organisation, 2021, recommandation 1 et populations CHANCE, POINT et FASTER</a>.</p></template>

<template data-pop="i63-calcul-aspects" data-title="ASPECTS : lecture du score tomographique"><p>ASPECTS signifie Alberta Stroke Program Early Computed Tomography Score. La méthode distingue dix régions du territoire de l’artère cérébrale moyenne : tête du noyau caudé, noyau lenticulaire, capsule interne, insula et six secteurs corticaux.</p><p>Le score commence à 10 ; chaque région avec signe ischémique précoce retire un point, sans compter deux fois la même région. Trois régions atteintes donnent donc 10−3=7 points. Le résultat est un décompte sans unité, et non un volume en mL.</p><table class="t"><tr><th>Résultat</th><th>Lecture de la méthode</th></tr><tr><td>10</td><td>Aucune anomalie précoce comptée.</td></tr><tr><td>1–9</td><td>Une ou plusieurs régions atteintes.</td></tr><tr><td>0</td><td>Les dix régions sont atteintes.</td></tr></table><p>L’absence de signe précoce n’exclut pas l’infarctus. L’expérience, la qualité des images et les variantes anatomiques modifient la lecture ; ce score ne se transpose pas à la circulation postérieure. Les décisions de reperfusion suivent leurs référentiels datés, pas ce total seul.</p><p class="src">Source de méthode : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7974585/" target="_blank" rel="noopener">Pexman et collègues, 2001, Methods et figure 1</a> ; les seuils de sélection clinique proviennent des références suisses 2021 et bernoises 2026.</p></template>
