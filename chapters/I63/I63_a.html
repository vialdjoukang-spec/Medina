<template id="ch-I63"><div class="chap"><div class="chap-head"><div class="code">I63 · CIM-10-GM 2024 · Neurologie · Maladies cérébrovasculaires</div><h1>Infarctus cérébral</h1><span class="status">Cycle 1 · rédaction Codex · sources consultées le 11.10.2026 · revue par intelligence artificielle ; aucune validation médicale humaine · aucune validation médicale humaine revendiquée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de l’infarctus cérébral</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#i63-0">Question clinique et objectifs</a></li><li><a href="#i63-1">Définition et classifications</a></li><li><a href="#i63-2">Épidémiologie suisse et pronostic</a></li><li><a href="#i63-3">Physiopathologie</a></li><li><a href="#i63-4">Étiologies et facteurs de risque</a></li><li><a href="#i63-5">Anamnèse</a></li><li><a href="#i63-6">Examen clinique</a></li><li><a href="#i63-7">Diagnostic et diagnostics différentiels</a></li><li><a href="#i63-8">Urgences et complications</a></li><li><a href="#i63-9">Reperfusion et soins aigus</a></li><li><a href="#i63-10">Prévention secondaire et suivi</a></li><li><a href="#i63-11">Situations particulières et résolution du cas</a></li><li><a href="#i63-12">Critères formels et paramètres décisionnels</a></li></ol></nav><div class="chap-body"><section class="ilot" id="i63-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 70 ans développe une faiblesse du bras droit et ne parvient plus à nommer les objets. Sa partenaire l’a vu parler normalement 90 minutes auparavant. Ce cas pédagogique fictif pose quatre questions : existe-t-il un accident vasculaire cérébral, une hémorragie ou une occlusion artérielle explique-t-elle les signes, une reperfusion reste-t-elle possible, et quelle cause devra être traitée pour prévenir une récidive ?</p><p>Le médecin assistant doit reconnaître un déficit neurologique focal aigu, faire activer la filière d’urgence suisse, documenter la dernière heure sans symptômes, lire l’imagerie cérébrale et vasculaire avec le spécialiste, puis distinguer les décisions de reperfusion des décisions de prévention secondaire. L’examen et les prélèvements se déroulent en parallèle ; leur réalisation ne doit pas retarder une reperfusion indiquée.</p><div class="key"><b>À retenir.</b> En Suisse, la suspicion d’accident vasculaire cérébral déclenche le numéro 144 et une orientation urgente vers une unité ou un centre spécialisé. La disparition des symptômes impose également une évaluation urgente.</div><p class="src">Références : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3 : reconnaissance, derniers symptômes absents, urgence et triage</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll. — Swiss guidelines for acute stroke revascularization (2021), p. 1–3 : traitement en Stroke Unit, bénéfice dépendant du délai</a>.</p></section>
<section class="ilot" id="i63-1"><h2><span class="n">1</span>Définition et classifications</h2><p>L’infarctus cérébral est une lésion ischémique du tissu cérébral, généralement liée à une interruption du flux dans une artère. L’accident vasculaire cérébral ischémique est sa présentation clinique aiguë. Le diagnostic associe un syndrome compatible à l’imagerie et à l’évolution ; un scanner initial sans hémorragie et sans lésion visible ne suffit pas à exclure l’ischémie.</p><p>L’<button class="w" data-k="i63-ait">accident ischémique transitoire (définition tissulaire et urgence)</button> désigne, dans le référentiel bernois 2026, un déficit focal transitoire sans lésion ischémique en diffusion. L’ancienne limite de 24 heures décrit une définition temporelle historique. Une lésion en diffusion compatible avec les symptômes classe l’événement comme infarctus, même si le déficit s’est résolu rapidement.</p><p>Le tableau distingue le territoire artériel, la localisation de la lésion et sa cause. Ces classifications se complètent ; aucune ne résume seule le handicap.</p><table class="t"><thead><tr><th>Classification</th><th>Ce qu’elle décrit</th><th>Conséquence</th></tr></thead><tbody><tr><td>Territoire antérieur ou postérieur</td><td>La circulation carotidienne ou vertébrobasilaire concernée.</td><td>Les symptômes orientent l’examen ; l’angiographie vérifie l’artère.</td></tr><tr><td>Infarctus cortical, profond ou du tronc cérébral/cérébelleux</td><td>La localisation de la lésion.</td><td>Une aphasie, une négligence ou une anomalie du champ visuel fait rechercher une atteinte des réseaux correspondants.</td></tr><tr><td><button class="w" data-k="i63-etiologie">Cause artérielle, cardiaque, petite artère ou autre (bilan et classification)</button></td><td>Le mécanisme et l’origine présumée.</td><td>Le traitement préventif dépend de cette attribution.</td></tr></tbody></table><p>Un infarctus peut aussi résulter d’une <button class="w" data-k="i63-veineux">thrombose veineuse cérébrale non pyogène (imagerie et stratégie distinctes)</button>. Le drainage veineux, le bilan et le traitement suivent alors un parcours spécialisé différent de la reperfusion artérielle décrite dans cette leçon. Cette variante n’est pas classée sur la seule distribution d’un territoire artériel.</p><div class="trap"><span class="k">Erreur fréquente</span> Une amélioration rapide ou un faible score neurologique ne suffit pas à qualifier l’événement de bénin. Une aphasie persistante peut être invalidante malgré un NIHSS peu élevé.</div><div class="key"><b>À retenir.</b> La définition tissulaire, la localisation anatomique, la gravité et la cause répondent à des questions différentes.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 10, 19–21, 32 et 53–57 : gravité invalidante, définition AIT, thrombose veineuse et territoires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 9.1 : AVC mineur invalidant</a> ; <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener" data-reference-source="1">Weimar et coll. — New recommendations on cerebral venous and dural sinus thrombosis from the German consensus-based S2k guideline (2024 ; consensus révisé en octobre 2023), Definition, Diagnosis et Therapy : thrombose veineuse cérébrale</a>.</p></section>
<section class="ilot" id="i63-2"><h2><span class="n">2</span>Épidémiologie suisse et pronostic</h2><p>L’étude nationale publiée en 2025 par Hänsel et collaborateurs analyse les statistiques suisses de 2017. Elle rapporte 26 032 sorties hospitalières associées à un accident vasculaire cérébral et une létalité globale estimée de 10,5 %. Ces valeurs concernent tous les accidents vasculaires cérébraux, ischémiques et hémorragiques ; plusieurs sorties peuvent correspondre à la même personne. Elles ne mesurent donc ni les seuls infarctus cérébraux ni leur incidence en 2026.</p><p>Entre 2004 et 2017, les événements et sorties enregistrés ont augmenté, tandis que la létalité globale a diminué, de 22,7 % à 10,5 %. L’étude est observationnelle : l’amélioration des soins, la reconnaissance des symptômes et les changements de codage peuvent contribuer à cette évolution. Elle ne démontre pas à elle seule l’effet causal d’un médicament.</p><p>Le pronostic individuel se juge sur l’autonomie antérieure, la gravité initiale, la localisation et l’étendue de l’ischémie, les possibilités de reperfusion et les complications. Le NIHSS décrit le déficit observé ; l’<button class="w" data-k="i63-rankin">échelle de Rankin modifiée (autonomie et résultats fonctionnels)</button> décrit le handicap. La fatigue, les troubles cognitifs, l’humeur et la participation sociale complètent l’évaluation après la sortie.</p><div class="trap"><span class="k">Erreur fréquente</span> Un pourcentage de mortalité portant sur tous les accidents vasculaires cérébraux ne doit pas être présenté comme le risque d’un patient ayant un petit infarctus reperfusé.</div><div class="key"><b>À retenir.</b> Le nombre de sorties, le nombre d’événements et le nombre de premières occurrences ne sont pas interchangeables.</div><p class="src">Références : <a href="https://doi.org/10.1093/ije/dyaf087" target="_blank" rel="noopener" data-reference-source="1">Hänsel et coll. — Current trends in stroke events, mortality, and case fatality in Switzerland (2025 ; données 2017 comparées à 2004), Résumé, Methods/Data sources, Results et Discussion : données 2017, sorties répétées, limites</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 51 et 61 : vie après AVC et Rankin modifié</a>.</p></section>
<section class="ilot" id="i63-3"><h2><span class="n">3</span>Physiopathologie</h2><p>Dans le tissu normalement perfusé, l’apport d’oxygène et de glucose permet de maintenir l’<button class="w" data-k="i63-energie">adénosine triphosphate</button> nécessaire aux pompes membranaires. Lorsque l’apport devient insuffisant, la <button class="w" data-k="i63-energie">pompe sodium–potassium dépendante d’adénosine triphosphate (gradients et dépolarisation)</button> ne compense plus les mouvements d’ions : sodium et calcium s’accumulent dans les cellules, tandis que le potassium quitte les cellules. Une dépolarisation importante et un œdème cytotoxique peuvent alors apparaître. Les perturbations électriques et ioniques précèdent ou accompagnent la lésion irréversible ; elles ne fournissent pas un délai universel de mort tissulaire.</p><p>Le <button class="w" data-k="i63-penombre">noyau et la pénombre ischémique (imagerie, viabilité et limites)</button> distinguent un tissu très lésé d’un tissu hypoperfusé encore susceptible de bénéficier d’une reperfusion. L’estimation dépend de la méthode d’imagerie. Les collatérales, la perfusion résiduelle et les conditions locales expliquent que deux patients examinés au même délai puissent avoir des volumes lésionnels différents.</p><figure><svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Figure 1 — Enchaînement cellulaire schématique. La succession n’est pas une horloge thérapeutique ; la réversibilité dépend du contexte et de la restauration du flux." font-family="sans-serif" font-size="18" text-anchor="middle" width="380" height="343" viewBox="0 0 380 343"><rect x="10" y="10" width="360" height="70" rx="9" fill="#f3f6f8" stroke="#64748b"></rect><text x="190" y="35" fill="#17324d">Perfusion normale → maintien de</text><text x="190" y="58" fill="#17324d">l’adénosine triphosphate</text><path d="M190 82v15m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"></path><rect x="10" y="102" width="360" height="47" rx="9" fill="#f3f6f8" stroke="#64748b"></rect><text x="190" y="127" fill="#17324d">Ischémie → déficit énergétique</text><path d="M190 151v15m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"></path><rect x="10" y="171" width="360" height="70" rx="9" fill="#f3f6f8" stroke="#64748b"></rect><text x="190" y="196" fill="#17324d">Pompes ioniques insuffisantes →</text><text x="190" y="219" fill="#17324d">dépolarisation</text><path d="M190 243v15m-5-5 5 5 5-5" fill="none" stroke="#64748b" stroke-width="2"></path><rect x="10" y="263" width="360" height="70" rx="9" fill="#f3f6f8" stroke="#64748b"></rect><text x="190" y="288" fill="#17324d">Persistance → atteinte cellulaire</text><text x="190" y="311" fill="#17324d">et œdème</text></svg><figcaption>Figure 1 — Enchaînement cellulaire schématique. La succession n’est pas une horloge thérapeutique ; la réversibilité dépend du contexte et de la restauration du flux.</figcaption></figure><p>L’autorégulation cérébrale devient moins efficace dans le tissu ischémique. Une baisse brusque de pression peut diminuer la perfusion encore utile, tandis qu’une pression excessive après reperfusion peut favoriser les complications hémorragiques. Cela explique les <button class="w" data-k="i63-pression">cibles de pression artérielle (phase aiguë, reperfusion et prévention)</button> distinctes selon la situation.</p><div class="key"><b>À retenir.</b> Science → examen → traitement : l’imagerie estime la lésion, la perfusion et l’occlusion ; ces informations permettent de sélectionner une reperfusion, sans déduire la viabilité du seul temps écoulé.</div><p class="src">Références : <a href="https://doi.org/10.1002/ana.25147" target="_blank" rel="noopener" data-reference-source="1">Dreier et coll. — Terminal spreading depolarization and electrical silence in death of human cerebral cortex (2018 ; DOI 10.1002/ana.25147), Introduction, discussion « Terminal SD » et limitations : ions, ATP, œdème et réversibilité ; observations terminales distinctes de l’AVC focal</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 3.1 et 4.1 : sélection par mismatch</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/en/Thrombolysis_Thrombectomy_Swiss_guidelines_EN_Michel_ClinTranslNeurosci2021.pdf" target="_blank" rel="noopener" data-reference-source="1">Michel et coll. — Swiss guidelines for acute stroke revascularization (2021), p. 2–3 et critères d’imagerie pour sélection tardive</a> ; <a href="https://doi.org/10.1093/esj/aakag004" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — 2025 update on blood pressure management in acute stroke (Publication mai 2026 ; DOI 10.1093/esj/aakag004), Physiopathologie et tableau 11, PICO 2–4</a>.</p></section>
<section class="ilot" id="i63-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2><p>Le bilan étiologique recherche une cause qui explique la distribution des lésions et modifie le traitement. Les grandes catégories utilisées par le réseau bernois sont l’athérosclérose des grosses artères, la cardioembolie, la maladie des petites artères, les autres causes déterminées et les causes indéterminées. Plusieurs mécanismes peuvent coexister ; une fibrillation atriale ne dispense pas de lire l’imagerie artérielle.</p><table class="t"><thead><tr><th>Cause</th><th>Indices à confronter</th><th>Décision qui dépend du résultat</th></tr></thead><tbody><tr><td><button class="w" data-k="i63-carotide">Athérosclérose carotidienne symptomatique (sténose et revascularisation)</button></td><td>La sténose se situe du côté et dans le territoire de l’infarctus.</td><td>Une discussion spécialisée évalue le traitement médical et une éventuelle revascularisation.</td></tr><tr><td><button class="w" data-k="i63-fibrillation">Fibrillation atriale ou autre source cardiaque (rythme et imagerie)</button></td><td>L’enregistrement rythmique et l’imagerie cardiaque recherchent une source embolique.</td><td>Une fibrillation atriale documentée peut conduire à une anticoagulation ; une embolie de cause inconnue ne suffit pas.</td></tr><tr><td>Maladie des petites artères</td><td>Une petite lésion profonde concorde avec un syndrome focal ; les autres causes pertinentes ont été recherchées.</td><td>Le contrôle des facteurs vasculaires et un antiagrégant sont distingués de l’anticoagulation pour fibrillation atriale.</td></tr><tr><td><button class="w" data-k="i63-dissection">Dissection cervicale (indices, imagerie et choix antithrombotique)</button></td><td>Une douleur cervicale, un traumatisme, un syndrome de Horner ou une atteinte chez un sujet jeune motivent une recherche ciblée.</td><td>L’angiographie et l’avis spécialisé précisent la cause et le traitement.</td></tr><tr><td>Endocardite, vascularite, état prothrombotique ou maladie monogénique</td><td>La fièvre, un souffle, les manifestations systémiques, le contexte obstétrical ou familial orientent les explorations.</td><td>Le traitement de la cause prime sur une prescription empirique uniforme.</td></tr></tbody></table><p>L’hypertension, le tabagisme, le diabète, la dyslipidémie et l’inactivité physique sont des facteurs de risque modifiables. L’âge et les antécédents vasculaires contribuent au risque, mais ne remplacent pas l’identification de la cause actuelle. Un foramen ovale perméable peut être retrouvé sans être causal ; son attribution nécessite un bilan excluant les mécanismes concurrents et une discussion spécialisée.</p><div class="trap"><span class="k">Erreur fréquente</span> La présence d’une anomalie fréquente ne prouve pas son rôle causal. Un foramen ovale perméable ou une sténose ne devient pas automatiquement la cause de tout infarctus.</div><div class="key"><b>À retenir.</b> L’étiologie associe concordance anatomique, preuve de la source et exclusion raisonnée des alternatives.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 20–25 : causes, bilan cardiaque, attribution PFO, sténose et dissection ; p. 38 : facteurs de risque</a>.</p></section>
<section class="ilot" id="i63-5"><h2><span class="n">5</span>Anamnèse</h2><p>La question temporelle initiale est : « Quand cette personne était-elle pour la dernière fois dans son état neurologique habituel ? » Cette heure, <button class="w" data-k="i63-heure">dernière heure sans déficit (symptômes observés et accident vasculaire cérébral au réveil)</button>, diffère de l’heure de découverte. Le témoin, son numéro de téléphone, la chronologie et l’autonomie antérieure sont documentés. Un accident vasculaire cérébral découvert au réveil ne débute pas, par convention, à l’heure du réveil.</p><p>L’anamnèse recherche les antécédents de <button class="w" data-k="i63-fibrillation">fibrillation atriale (source embolique et traitement)</button>, d’accident vasculaire cérébral, de <button class="w" data-k="i63-terrain">terrain vasculaire (hypertension, diabète, tabac et dyslipidémie)</button> et de maladie artérielle. Elle précise le nom exact des traitements antithrombotiques, la dernière prise, les gestes invasifs ou traumatismes récents et un éventuel saignement. Ces informations conditionnent la sécurité de la thrombolyse ; « sous anticoagulant » sans produit ni horaire n’est pas une histoire médicamenteuse suffisante.</p><p>La faiblesse d’un hémicorps, l’asymétrie faciale et le trouble du langage sont des présentations caractéristiques à rechercher en premier. Un déficit du champ visuel, une diplopie, un trouble soudain de l’équilibre ou un vertige aigu avec impossibilité de marcher peuvent aussi traduire un accident vasculaire cérébral, notamment postérieur. Les sources suisses consultées ne fournissent pas une fréquence nationale comparable de chaque symptôme : l’ordre présenté ici est clinique, sans pourcentage inventé.</p><div class="two"><div class="card"><h3>Présentation antérieure</h3><p>Une faiblesse du bras droit associée à une <button class="w" data-k="i63-aphasie">aphasie (langage, examen et localisation)</button> fait rechercher une atteinte du réseau du langage et de la commande motrice. L’installation soudaine et l’heure précise orientent la filière aiguë.</p></div><div class="card"><h3>Présentation postérieure</h3><p>Une diplopie, une <button class="w" data-k="i63-ataxie">ataxie (coordination, marche et pièges)</button> et un trouble de vigilance motivent une recherche urgente d’atteinte vertébrobasilaire. Un dépistage centré sur la face et le bras peut manquer cette présentation.</p></div></div><div class="key"><b>À retenir.</b> La disparition complète d’un déficit ne dispense pas de l’imagerie et du bilan urgent d’un événement ischémique transitoire.</div><p class="src">Références : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Recommandations suisses pour la prise en charge préhospitalière des AVC (2021), p. 1–3 : déficits moteurs/langage, vertige avec incapacité de marche, vision, urgence malgré régression</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 4, 19–21 : heure, médicaments, causes et indices anamnestiques</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Contre-indications et Mises en garde : histoire de saignement et anticoagulants</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Contre-indications et Mises en garde</a>.</p></section>
<section class="ilot" id="i63-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen commence par la vigilance, la liberté des voies aériennes, la respiration et la circulation. Le pouls, la pression artérielle, la saturation en oxygène, la température et la <button class="w" data-k="i63-glucose">glycémie</button> sont mesurés en parallèle. Le poids réel est nécessaire au calcul de l’altéplase et au choix du palier de ténectéplase ; son estimation approximative expose à une erreur de dose.</p><div class="two"><div class="card"><h3>Fonctions corticales et nerfs crâniens</h3><p>Le médecin évalue le regard, le champ visuel, la symétrie faciale, la compréhension, la dénomination et l’articulation. L’<button class="w" data-k="i63-aphasie">aphasie et la dysarthrie (différence et tests)</button> ne sont pas synonymes. La <button class="w" data-k="i63-negligence">négligence (attention spatiale et extinction)</button> peut expliquer une apparente méconnaissance d’un déficit.</p></div><div class="card"><h3>Motricité, sensibilité et coordination</h3><p>Les membres sont examinés séparément, en recherchant une chute lors du maintien, une asymétrie sensitive et une incoordination. Une faiblesse peut empêcher le test de coordination ; elle ne prouve pas une ataxie. La marche est évaluée seulement si la sécurité le permet.</p></div></div><p>Le <button class="w" data-k="i63-nihss">NIHSS (domaines, méthode et limites)</button> formalise plusieurs de ces observations et permet de suivre l’évolution. Il ne résume pas toutes les atteintes postérieures ni tout le handicap potentiel. Le caractère invalidant du déficit et la situation antérieure complètent le score. Une aggravation clinique impose une réévaluation immédiate ; elle ne doit pas attendre la mesure suivante prévue.</p><p>Une dysphagie, une baisse de vigilance ou des signes d’atteinte du tronc cérébral font évaluer la <button class="w" data-k="i63-deglutition">déglutition (sécurité et exploration spécialisée)</button> avant de choisir la voie orale. Le protocole bernois utilise une évaluation clinique structurée et, lorsque nécessaire, une endoscopie fonctionnelle. L’équipe adapte la nutrition et les médicaments à la capacité de déglutition.</p><div class="trap"><span class="k">Erreur fréquente</span> Un faible NIHSS ne signifie pas qu’une aphasie ou une hémianopsie soit sans conséquence fonctionnelle.</div><div class="key"><b>À retenir.</b> L’examen produit une localisation, une mesure répétable de gravité et des informations de sécurité ; il ne doit pas ralentir l’accès à l’imagerie.</div><p class="src">Références : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Jung, Meinel et coll. — Stroke Guidelines of the Bern Stroke Network (08/2026, remplace 01/2024), p. 4, 10, 14, 16, 53 et 62–63 : vitaux, examen, NIHSS, déglutition</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483130277" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Actilyse, altéplase 10/20/50 mg (Juin 2025), Posologie : poids corporel et dose</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699580019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Metalyse 5000 U, ténectéplase 25 mg (Mai 2025), Posologie : paliers de poids</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener" data-reference-source="1">European Stroke Organisation — Guidelines on intravenous thrombolysis (2021), PICO 9.1 : déficit invalidant</a>.</p></section>
