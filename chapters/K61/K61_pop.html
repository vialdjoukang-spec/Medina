<template data-pop="pareto-k61-clinique" data-title="Loi de Pareto — Abcès anal"><p class="ratio" data-cover="k61-1,k61-2,k61-3,k61-4,k61-5,k61-6,k61-7"></p><ul><li>Une douleur anale croissante avec tuméfaction chaude évoque un abcès.</li><li>Un examen externe normal n’exclut pas un abcès profond.</li><li>Le sepsis ou la suspicion de Fournier imposent une imagerie et une chirurgie immédiate.</li><li>On draine chirurgicalement, sans attendre l’effet d’un antibiotique.</li><li>On ne force jamais la recherche d’une fistule.</li><li>L’antibiotique n’est utile que dans des situations d’exception.</li><li>Environ la moitié des patients développent une fistule dans l’année.</li></ul></template>
<template data-pop="pareto-k61-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k61-e-1"></p><ul><li>L’inspection et la palpation suffisent le plus souvent.</li><li>Le toucher rectal cherche un abcès intersphinctérien ou haut.</li><li>L’IRM localise un abcès profond sans douleur.</li><li>Le prélèvement bactériologique est inutile dans l’abcès simple.</li></ul></template>
<template data-pop="pareto-k61-pharma" data-title="Loi de Pareto — Antibiotiques et soins"><p class="ratio" data-cover="k61-p-1,k61-p-2"></p><ul><li>L’antibiotique ne remplace jamais le drainage.</li><li>Il est réservé à l’immunosuppression, aux infections étendues et aux signes systémiques.</li><li>Sa durée est de 5 à 7 jours.</li><li>On douche la plaie et l’on évite les méchages répétés.</li></ul></template>
<template data-pop="k61-abs" data-title="Abcès anal"><p class="lab">Définition</p><p>C’est une collection de pus de la région anale ou rectale, née le plus souvent d’une glande anale infectée.</p><p class="lab">Signes</p><p>Le patient décrit une douleur qui augmente en quelques jours, avec une tuméfaction rouge, chaude et douloureuse.</p><p class="lab">Traitement</p><p>On le draine chirurgicalement en urgence, car un antibiotique seul ne vide pas la cavité.</p><figure><img src="data:image/gif;base64,R0lGODdhWAKfAoYAAP7yy/7rwf7mvf7ktP/esP3dsf7Zpf7Tov3Pnv7OlP3KkPrMnvrHjuvJs/PCl/TCjffDiPPAh+25lu66hu23f9TCzei2h+ayi+axe867xci0veOtieKsd+CnhtqlgdijcdecgdCZfdKcbMyZa8yUccmOcL+rs7OfpsKQaaaSl8GKbL+LYayKeLyEaLmEXbOCXZuDgLd8YrJ7XrB7XK96Wqp6Wql2Wal4UKd0VaxxWqdxVKJxUahpVZ9oUJB7fJpuToh1eIJvcphpT5doRYdoWJViT5JiQothRHlhW49cR49VSYVYQYBYP35VO31QO3dSO3VON2ZWWmdNQnBKNWJJPXNENWlEMWVDMF9CMl9AK1w6KVE/OlE4LE41KEYtITYkHAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWAKfAkAI/wA1CBxIUGCGDAYPHixIUKFDhA8jSpwYsUKFDBYzatzIsaNHjgctYswYkaAJEydOpEgBw4cPIC5XnjBh8KPNmx5LajiJUiWMIEGQRImCJIgPGDJTnmTItCnNnTt50pRKNaXVqylXamUJo2tXl2CBiH0ZBAjQs2XHgj2KdKvbt3DjyoXb1qvdu3i/uszbMuxatl/7gvXqUqzZs4ZhHkbLWCzjx0CRSB4quShkw5DPCh0aZYvnz6ClcB5NurTp06hRg17NGjQV1kO3xJadmulCiBRz39ZdkfdDnMCDAw+pUaHAnlxfwkR6QgNx4dBJPjSJ/OdkokC6plBK9SlD3A4Ldv8fzxPrVbd21ybGnLYwzL9358qfT58r37yAteL96/592LGKrZdYZompx96AQAm42GOVZeZgUJsN9VprW1CR2oUYlnadahR26KFoGZYmRVMN+WbiRSYqhGJuH01U3EjRDVcSSiu1dNhRKdAEY4zChXfcSSql8NJmRfmQVHdMIUkideSVZ15WW9n4mFrK+cfWXl5FWd+W9GnHFUv6eRnlfvwZaNhL/a1XpntkOabglA666RhkljFWVGV44jmahyGORuSdfuZJWYQZemhoaxb2OZpoUnjW0JIl7bbQQCk6tOKJKmLk4nM88uhjdWSVtZIJnHbaEUVRBelDUJQF0dZMTQ7/5N2SSzZpHnpSRtZggmcOdp9dNc4XJJfExsWXe4jNWRZifhVW5X8KzvlmY8pGu96DDN4pFKGmgdjnZHnmiVa44So6W2eiWUjFuoeuK4UUiWLoWoUTglapcbnR2iRVtDIUa0KmBlzcTkHCYFaR2zkn8KnGHQelwawS5ep2sPLb73G2ISQreVjJFGVhutaZVq+/FjvXeSbLdex7cp5plpUtxUyYcuqZCe2C0vJKoJkLYjuunuZqaNqdEIYbGVHgBn2hZ40e+lmf3nr <template data-pop="k61-glande" data-title="Glande anale"><p class="lab">Siège</p><p>Elle se trouve dans l’espace entre les deux sphincters, et son canal s’ouvre dans une crypte de la ligne pectinée.</p><p class="lab">Rôle dans la maladie</p><p>Si son canal s’obstrue, la sécrétion s’infecte ; c’est le point de départ de presque tous les abcès et de presque toutes les fistules.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-crypto" data-title="Infection cryptoglandulaire"><p class="lab">Définition</p><p>C’est l’infection d’une glande anale, qui s’ouvre dans une crypte du canal anal.</p><p class="lab">Pourquoi ce terme ?</p><p>Il distingue l’abcès lié au canal anal, qui peut donner une fistule, de l’abcès de la peau, qui n’en donne pas.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-acne" data-title="Acné inverse"><p class="lab">Nature</p><p>C’est une maladie inflammatoire chronique des follicules pileux des plis, qui donne des nodules et des abcès récidivants.</p><p class="lab">Pourquoi la distinguer ?</p><p>Ses abcès ne communiquent pas avec le canal anal ; ils relèvent donc d’une autre prise en charge, dermatologique et chirurgicale.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-fst" data-title="Fistule anale"><p class="lab">Définition</p><p>C’est un trajet infecté qui relie une crypte du canal anal à la peau.</p><p class="lab">Lien avec l’abcès</p><p>Environ la moitié des patients en développent une après un abcès, en général dans les 12 mois.</p><p class="lab">Traitement</p><p>Il est chirurgical ; il est détaillé dans le cours K60.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a> ; <a href="https://register.awmf.org/assets/guidelines/088-003l_S3_Kryptoglandulaere_Analfisteln_2026-06.pdf" target="_blank" rel="noopener">Jaschke et al., S3-Leitlinie Kryptoglanduläre Analfistel, version 3.1, 2026 (AWMF 088-003)</a>.</p></template>
<template data-pop="k61-pect" data-title="Ligne pectinée"><p class="lab">Définition</p><p>C’est la ligne festonnée du canal anal où s’ouvrent les cryptes et les glandes anales.</p><p class="lab">Intérêt</p><p>Elle marque l’origine des abcès cryptoglandulaires ; de plus, sous cette ligne, la muqueuse est sensible, ce qui explique la douleur intense.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-ischio" data-title="Abcès ischio-anal"><p class="lab">Mécanisme</p><p>Le pus a traversé le sphincter externe et occupe la graisse de la fosse ischio-anale.</p><p class="lab">Signes</p><p>La fesse est tuméfiée, rouge et chaude, parfois sur une large surface.</p><p class="lab">Pronostic</p><p>Il donne souvent une fistule, chez près de la moitié des patients dans une étude prospective.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-supra" data-title="Abcès supralévatorien"><p class="lab">Siège</p><p>Il se trouve au-dessus du muscle releveur de l’anus.</p><p class="lab">Signes</p><p>L’inspection est souvent normale ; le patient a une douleur pelvienne diffuse, de la fièvre et un malaise général, et le toucher rectal trouve une induration haute.</p><p class="lab">Conduite</p><p>On le localise par imagerie, puis on choisit la voie de drainage, parfois transrectale.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-mici" data-title="Maladie inflammatoire chronique de l’intestin"><p class="lab">Lien</p><p>La maladie de Crohn peut se révéler par un abcès ou une fistule anale.</p><p class="lab">Indices</p><p>On y pense devant des abcès récidivants, des fistules multiples, une diarrhée chronique ou un amaigrissement.</p><p class="lab">Pourquoi c’est important</p><p>La prise en charge est alors médicale et chirurgicale à la fois ; elle est décrite dans le cours K50.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-sepsis" data-title="Sepsis"><p class="lab">Définition</p><p>C’est une défaillance d’organe causée par une réponse déréglée de l’organisme à une infection.</p><p class="lab">Signes d’alerte</p><p>On s’inquiète devant une fièvre élevée, une hypotension, une tachycardie ou une confusion.</p><p class="lab">Conséquence</p><p>La S3 demande alors une imagerie avant l’opération, et l’on ajoute des antibiotiques au drainage.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-fournier" data-title="Gangrène de Fournier"><p class="lab">Définition</p><p>C’est une infection nécrosante des tissus mous du périnée et des organes génitaux.</p><p class="lab">Signes</p><p>On la suspecte devant une douleur disproportionnée, une peau violacée ou noire, des crépitations et un sepsis.</p><p class="lab">Conduite</p><p>On fait une imagerie si elle ne retarde pas le geste, on débute les antibiotiques et l’on excise chirurgicalement tous les tissus nécrosés en urgence.</p><figure><img src="data:image/gif;base64,R0lGODdhWALAAYYAAKm7t56tp6mkm42klqmalJeZiI+Yf4CZiKuMgJeOh42NhYuOdoSNcoSHdniLcah7dJt5epJ7f5F1b4KBen+BbIN0aneAZXd5bnR0a2Z7X2RxW5xnbZBmaZpYYJBXXohnbodkXohXYIdUU3poYHhgXndkTXNeR3lVWXNWP2pgTWlYQGhWPltpUFldS2FVPWZRQGZRMmBQO19QMldQO49HUH9HTXBHTGpJNGFLN2FENmFGKVpLOVpKMFdEOldEMFhHKlhBKIk5Q3w5QWo5PVc+L1Y4MVY6I4IrNXcrNGIrMXkfKWEfJ2gTHk9BME48LE45KUU/MUU3K0kyK0oxHkEwJjcwJkQqIkQkITomHzUlHy0kHjwdHC8dGD0TFycaGCIREgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWALAAUAI/wBbtGDBQqBAgggTKmShQcNChg0RNsxAsaHFiAkxPizYAkoVLVq8fBk50otJkyO1VKFCBcuWLVxiwnx5peYVKTZvFikipSeUHkBf2Bg6dEfQFymQvgh6ImmKEVAxYBhBIoWNIUOSJFnCdeuSJEOGNk1BNsWJE1d7hCU6NGtWrWHPniUBtSzdERguXKBKl8QJoECxYk2yc0iOwy8S20BK1qjHLCufOCFCxAeQHzJgxJDBo3PnH6B/AJlixMiUKVR6UpH8hAdmF7BdyJjtAgZnGSpWwOg8e4UKFbMzwxguA7TtH0ZAmz495QkQy6WNXHZd+rKO68KHa4dxXYeR7qZfSP+oUGHCBAUJCqg3wF69+/fw4xdIQD+9fPcK8uvfr36///8AAtjAgAQW2IB5CCao4IIT6HUBgg5GKOGEUlVo4YUYYthQhhhc5OGHHm5k0IgzlGgiFDO00NAMULTYYokjDiQRiBZRlAGNH1bk4Y0P1ejAjzZWRJBDM3wUkkhfnIQkSUlycdJLW3TxBZRU5pRTTzVJsRNPPWlZRA9s9fClYjaIWRhYg4Ul1FMV8IVWVlwt0cUVX61lw1lsXUWUYHa2ZecJJNwFlVxlChVoUyR88EEFH/g115tYIaEVEpKCpdVVcfllV1VImfBCEVaEOoUVWuKgQlJOOPFCXSnEEFQPMcT/sEMMK+DAm3CwBaeCCSrY5ptuwQVn3G+breACrb+ZoKwJJfD6W266rYACCjDktp0MOmy3XbYoyDBFEyOUZ54C/dGnnn3xEaCuuve1K18C+dUnb7zy1hfgvQqc9x+BDPbr74IONjjhwBfqxaGFEVaY8MEc4ohRjDGaqGILJf6U4kEQaSDjRhlzrBDGBfUY5MhBhkgxFCCBhFJJMSkpE5RdxBzzFlb2 <template data-pop="k61-drain" data-title="Drainage large"><p class="lab">Geste</p><p>On ouvre largement la cavité, on évacue le pus et l’on laisse la plaie ouverte.</p><p class="lab">Pourquoi large ?</p><p>Un drainage insuffisant est la principale cause de récidive ; de plus, la S3 recommande une reprise sous anesthésie si l’abcès est étendu.</p><p class="lab">Limite</p><p>On ne coupe pas le sphincter pour drainer, afin de préserver la continence.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-seton" data-title="Séton de drainage"><p class="lab">Principe</p><p>Un fil passé dans le trajet fistuleux maintient l’orifice ouvert, si bien que le pus s’écoule.</p><p class="lab">Indication</p><p>On le pose lorsqu’on découvre une fistule haute pendant le drainage, en attendant une cure secondaire.</p><p class="lab">Information</p><p>La S3 demande d’en parler au patient avant l’opération.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-douche" data-title="Douche de la plaie"><p class="lab">Geste</p><p>Le patient rince la plaie à l’eau du robinet, en particulier après chaque selle.</p><p class="lab">Pourquoi ?</p><p>Le rinçage empêche l’accumulation de pus et la fermeture trop rapide de l’orifice ; de plus, l’eau potable suffit, alors que les antiseptiques abîment les cellules qui cicatrisent.</p><figure><img src="data:image/gif;base64,R0lGODdhkAH0AYUAAPnXu/LGqe+9oOO7num1l+iukuKwkt2vkNOukt6midSlhtmdgtGcf8uhg8qZe8KcgbeahMmRdr+QdLOPfrWObbiHbbZ/ZqyBaaOIdqGBbaN8Z5d8ap92aKB2WZB1ZJttWZNtWo5sWoVrYIVpUotjUoBiU4VbS31ZSnZiVnRbTnVXSGlWSnFQR3BPO2ZOQVxNQ2dHOmU/NFlEOFg6Lk5AN0w7MUo3LkkzKj8yKkYsJTorJD8gGzEmHy4fGCoVDx0PCSwAAAAAkAH0AUAI/wBvyKgxY4YNFzN23Fh4Y0ePHTtyLMwRMQfFGjZ06LAx0AbGijlq5NAB0aJJjA1N7tBB0WKPHjp46HjZw8dLHz9+4NSJw4cPHjx0vgRKM2gPojKBatSYQ2YOHDNz+uRR0ybVmlh14PT5g6gPHTdEUiy5w0ZDiCJp3mhZ46VAGyMtxtSIVKMNGjRmXt15NGjOv1avHl06k+tPnzB5IJaqU/BNw0df/tABVUcNHJIH1oBYMMeMGzNkwCjoY63JHDJcwIARY0SMGSpayI7dQgVt2SdOyJYdw0TuE75NyDZhQgMJEx869O7QIfmFGCQ+aGhBonny69VNZG/RnLn0Fto7aP9g7h3Eh+riTXS4wF78BeMhQIwAT176BxAgZISWoX//jB6e3WBDRDOYtFYPNcxUgws2wKUDDR7JwNBCNFA4UoJMjcSSDVBRJZNbOLzQU1c96PQDTT7gYBROJdqkF1UnagUTZXQthQNcMpVlEYU3DGYDCjT0oKJNNb2glEwz1bSRRRGVpZFDPbzwQlsoPuTQDjKMpaFEa3nkUQ01SJmXhzHZZGaKWv00F10mfkXkiVIFxgMOmLVoGVUyzpnRDxG2ZdEPNawggwcIZJBCljKskNAMCM0Ag4ShTZRaDrapAMNuM8SA22waqOBbbbtp14Km0H1g6nHQXTDBBSSAd9556D3/d14HFXSnXgctXPeBCTF4V8EFzcVaK3neuWcdCRQAS+x6FFCgXrMkVMCffjGsVpCjCj3qqH5cooACRCs1BFYNE20GE0YNMrXWlRrdoBGdMSE5VGSLCUknh2vCKRRSL6W51JFy6oTRUDb+OyedCJdIGVQ0DfVVRlrtQANEJAkYEQ2ozZSDRyvt4BOT4WIkFg2XLRwvUDkdfLJgSvlUw04j/gTUVScC5ROLUxVVGA43dKiDhB4/hOdaL/C3AwwssJDQQo7C4IKl184A6qiZziecCie0OsMJF4AAnG8deK0dcC3oRhwJMyDwQW/amfoBB6YSK9yr51VQ3XMmDEvsB+xd//Dreu+x92vgfV+QLHMSsPdA38Z10GyyGvCt6WwtXDqqaqBVWxsLToO2nwwv/AygRRJipNkLFTrULkYz7TDzwjTQedVVN9Ygw4gxyr7RZGrG2ZWKHkX1lWIvQfUlZknJLmTsemk0WGEHy/6TDTKt8MIPObygoWU9WomgDBClZFa8OJBcA8mUCSiDDSWSKKeKs0t2ImI9uQgUDl0FpadGVtV81IlV4UFYehSTozwlB3j5yvkqNAOMMMkFMtCUpXYTG <template data-pop="k61-retention" data-title="Rétention urinaire postopératoire"><p class="lab">Mécanisme</p><p>La douleur anale inhibe par réflexe le relâchement du sphincter de la vessie, et l’excès de perfusion remplit vite la vessie.</p><p class="lab">Prévention</p><p>On assure une antalgie suffisante et l’on évite un excès de liquides intraveineux.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
<template data-pop="k61-eus" data-title="Échographie endoanale"><p class="lab">Principe</p><p>Une sonde placée dans le canal montre les sphincters, l’abcès et un éventuel trajet fistuleux.</p><p class="lab">Limite</p><p>Elle peut être trop douloureuse dans l’abcès aigu et demander une sédation.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a> ; <a href="https://register.awmf.org/assets/guidelines/088-003l_S3_Kryptoglandulaere_Analfisteln_2026-06.pdf" target="_blank" rel="noopener">Jaschke et al., S3-Leitlinie Kryptoglanduläre Analfistel, version 3.1, 2026 (AWMF 088-003)</a>.</p></template>
<template data-pop="k61-irm" data-title="IRM pelvienne"><p class="lab">Intérêt</p><p>Elle montre l’abcès, son extension et le trajet d’une fistule par rapport aux sphincters et au releveur.</p><p class="lab">Avantage</p><p>Elle ne fait pas mal et se réalise aussi en urgence ; elle aide donc à choisir la voie de drainage d’un abcès profond.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></template>
