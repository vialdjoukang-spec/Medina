<section class="ilot" id="k61-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 42 ans, diabétique et en surpoids, consulte pour une douleur anale qui augmente depuis trois jours ; elle est devenue lancinante, l’empêche de s’asseoir et l’a réveillé cette nuit. À l’inspection, la marge anale droite est rouge, chaude et tuméfiée. <b>La question est donc la suivante : s’agit-il d’un <button class="w" data-k="k61-abs">abcès anal</button>, et faut-il l’opérer tout de suite ou d’abord donner un antibiotique ?</b></p><p>Pour y répondre, le médecin doit d’abord comprendre d’où vient le pus : il naît le plus souvent d’une <button class="w" data-k="k61-glande">glande anale</button> infectée, située entre les deux sphincters. Ensuite, il doit situer l’abcès dans l’un des quatre espaces de la classification, car ce siège décide de la voie de drainage. De plus, il doit savoir que le traitement est chirurgical et urgent, et que l’antibiotique seul ne guérit pas l’abcès. Enfin, il doit prévoir la suite, car environ la moitié des patients développent ensuite une <button class="w" data-k="k61-fst">fistule anale</button>.</p><p><i>Pourquoi ce cas ?</i> En effet, cet homme réunit les trois facteurs de risque établis par la S3 2026 : le sexe masculin, l’obésité et un diabète mal équilibré. Ainsi, contrairement à un manuel figé qui énumère des formes anatomiques, ce cours relie chaque espace à un signe clinique et à un geste ; chaque mot vert ouvre la définition, le critère ou l’image qui justifie la décision.</p><div class="key"><b>Point de départ.</b> Douleur anale croissante sur quelques jours, tuméfaction rouge et chaude : penser abcès → situer l’espace → drainer chirurgicalement sans attendre → ménager le sphincter → surveiller l’apparition d’une fistule.</div></section>
<section class="ilot" id="k61-1"><h2><span class="n">1</span>Définitions et épidémiologie</h2><p>Selon la S3 2026, l’<button class="w" data-k="k61-abs">abcès anal</button> est une collection de pus de la région anale ou rectale qui naît, dans la grande majorité des cas, d’une infection des glandes du canal anal ; on parle donc d’infection <button class="w" data-k="k61-crypto">cryptoglandulaire</button>. Par ailleurs, la S3 distingue cet abcès des abcès cutanés superficiels, qui naissent d’un follicule pileux ou d’une <button class="w" data-k="k61-acne">acné inverse</button> sans lien avec le canal anal ; c’est pourquoi le terme ancien d’« abcès périanal » mélange souvent deux maladies différentes.</p><p>En outre, les études de population trouvent une incidence très variable, entre 9 et 60 cas pour 100 000 habitants par an ; l’âge moyen se situe entre 38 et 45 ans, et environ trois patients sur quatre ont entre 20 et 60 ans. De plus, les hommes sont atteints trois à quatre fois plus souvent que les femmes ; la S3 avance comme explication possible un nombre plus élevé de <button class="w" data-k="k61-glande">glandes anales</button> chez l’homme et des différences hormonales, sans preuve définitive. Enfin, les facteurs de risque établis sont le sexe masculin, l’obésité et un diabète mal équilibré, alors que le lien avec le tabac et l’alcool reste moins net.</p><p>Le code K61 se subdivise selon l’espace atteint, ce qui reprend en partie la classification anatomique décrite plus bas : abcès anal (K61.0), rectal (K61.1), ano-rectal (K61.2), ischio-rectal (K61.3) et intrasphinctérien (K61.4). Dès lors, le codage oblige déjà à se poser la question clinique essentielle, celle de l’espace infecté.</p><div class="key"><b>À retenir.</b> L’abcès anal est le plus souvent cryptoglandulaire. Il touche surtout l’homme jeune, trois à quatre fois plus souvent que la femme, entre 38 et 45 ans en moyenne ; le sexe masculin, l’obésité et le diabète mal équilibré sont les facteurs de risque établis.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></section>
<section class="ilot" id="k61-2"><h2><span class="n">2</span>Physiopathologie : de la glande à l’espace infecté</h2><p>Les <button class="w" data-k="k61-glande">glandes anales</button> siègent en règle dans l’espace intersphinctérien, c’est-à-dire entre le sphincter interne et le sphincter externe ; leur canal s’abouche dans une crypte de la <button class="w" data-k="k61-pect">ligne pectinée</button>. Ainsi, lorsque ce canal s’obstrue, la sécrétion stagne et s’infecte, le plus souvent par Escherichia coli ou par des Bacteroides, c’est-à-dire par des germes de la flore digestive. De plus, les glandes sont plus nombreuses en arrière ; une étude a d’ailleurs trouvé 65 % des trajets fistuleux dans le secteur postérieur.</p><p>Dès lors, l’abcès commence presque toujours dans l’espace intersphinctérien, puis le pus suit le chemin de moindre résistance. D’abord, il peut descendre vers la marge anale et former un abcès intersphinctérien superficiel. Ensuite, s’il traverse le sphincter externe, il gagne la graisse de la fosse ischio-anale et forme un <button class="w" data-k="k61-ischio">abcès ischio-anal</button>. Enfin, s’il monte entre les sphincters au-dessus du releveur, il forme un <button class="w" data-k="k61-supra">abcès supralévatorien</button>. C’est pourquoi la S3 retient quatre types : subanodermique, intersphinctérien, ischio-anal et supralévatorien.</p><figure><img src="data:image/gif;base64,R0lGODdhWALtAYYAAP/u1/7q0/7o0v7nzf/jzfvjzf7ixv/exfvexvvZxP/bu/vavP7VtvnVuf3QtvXPt//Op/vNqP7Gp/7Em/fFpv7Anv66n/66kPm8nPm4ju+5mfmvm/ivjPeug/6klPalkPSkfPucj/qVjPOceviUfPiMg/eJcuephOShe+aYeeSWa9KjgNGZeM2Uc9+LcteKY8iKZLeKcfaAcfJ4auh7a9iAZNl4ZMl8XehwY9xvYN1nWsxuXM1jVLqAYbl4W7lxWbhvTbpnV7dhVbRjSKVyWKRnS5FwW5VlSqJgR5BhRMhaSrhZTK5ZUK1ZQ6NZSJlYRZtYPLJRQ6JRQqZIOphQPZhDNZBXPo9SO49OOYlSOYhNN3lQPItDMHJCLX4xH1MnGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWALtAUAI/wAhCIQQoSADBwwSJlSgcKGChw0dIGSgYIF uge et luisante occupe le côté droit de l’anus et s’étend vers la fesse."><figcaption>Abcès de la marge anale : tuméfaction rouge, tendue et asymétrique. <small>Image : Dr. K.-H. Günther, Klinikum Main Spessart, Lohr am Main, Wikimedia Commons, licence CC BY 3.0 (<a href="https://commons.wikimedia.org/wiki/File:Perianalabszess_01.jpg" target="_blank" rel="noopener">source</a>), adaptée en GIF.</small></figcaption></figure><p><i>Que montre l’image ?</i> La tuméfaction est rouge, tendue et limitée à un côté ; ainsi, elle traduit une collection proche de la peau, typique d’un abcès subanodermique ou ischio-anal superficiel. Or, la peau reste fermée : le pus n’a pas d’issue, la pression monte et la douleur devient lancinante. C’est pourquoi l’ouverture chirurgicale soulage immédiatement, alors qu’un antibiotique ne peut pas pénétrer correctement une cavité close et mal vascularisée.</p><table class="t"><tr><th>Type d’abcès</th><th>Fréquence selon les séries</th><th>Ce qui le caractérise</th></tr><tr><td>Subanodermique</td><td>40 à 75 %</td><td>Il est superficiel, rouge et visible à l’inspection.</td></tr><tr><td>Intersphinctérien</td><td>13 à 55 %</td><td>Il est souvent invisible et ne se palpe qu’au toucher rectal.</td></tr><tr><td>Ischio-anal</td><td>5 à 42 %</td><td>Il a traversé le sphincter externe et occupe la graisse de la fesse.</td></tr><tr><td>Supralévatorien</td><td>2 à 8 %</td><td>Il siège au-dessus du releveur ; la douleur est pelvienne et diffuse, avec fièvre.</td></tr></table><p><i>Que montre le tableau ?</i> Les fréquences varient beaucoup d’une série à l’autre, car les auteurs n’utilisent pas tous la même classification ; cependant, les formes superficielles dominent toujours. En revanche, plus l’abcès est profond, moins il se voit ; c’est pourquoi un examen externe normal n’exclut pas un abcès intersphinctérien ou supralévatorien.</p><div class="key"><b>À retenir.</b> Glande anale obstruée → infection par la flore digestive dans l’espace intersphinctérien → extension vers la marge, la fosse ischio-anale ou au-dessus du releveur. Plus l’abcès est profond, moins il se voit, et plus il expose à une fistule.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></section>
<section class="ilot" id="k61-3"><h2><span class="n">3</span>Diagnostic clinique</h2><p>Selon la S3 2026, le diagnostic repose sur l’anamnèse, l’inspection et la palpation. En effet, le symptôme typique est une tuméfaction douloureuse de la région anale, qui augmente en quelques jours ; dans les formes subanodermiques et ischio-anales, on trouve en règle une rougeur et une chaleur locales, et la palpation montre une induration douloureuse. Par ailleurs, l’abcès intersphinctérien ne se sent souvent qu’au toucher rectal ou bidigital ; cependant, ce toucher doit rester bref, car il est très douloureux. De plus, l’anuscopie et la rectoscopie apportent peu et font mal ; c’est pourquoi on peut le plus souvent s’en passer.</p><p>En outre, l’anamnèse doit chercher des abcès antérieurs et la durée des symptômes, car une récidive oriente vers une fistule. Elle doit aussi chercher des signes de <button class="w" data-k="k61-mici">maladie inflammatoire chronique de l’intestin</button>, puisqu’un abcès peut révéler une maladie de Crohn. Enfin, l’<button class="w" data-k="k61-supra">abcès supralévatorien</button> trompe souvent : l’inspection est normale, la douleur est pelvienne, diffuse et progressive, et la fièvre ainsi que l’altération de l’état général sont plus fréquentes ; le toucher rectal trouve alors une induration haute, parfois fluctuante.</p><figure><img src="data:image/gif;base64,R0lGODdhkAH0AYUAAPfQtO/Ao/C6neO5m+uxluavkuCvkNaukOGnjN+giNmkh9idhNKkhtKcgcufg8OehdOWfsuUesCVf8KTc8WNdcKFcbuLcrqCbLWKc6uIdLGBaaSAbK16aat5XqB5ZJZ5Z6dxXZtwXI9wY5BuVZhnVIpnVI9hT4xZSIBmVX1fTn5aSXFZSXpRQnBQQGpPQGFNP2ZHOWI/MlhEN1c7LlA/Mkw5Lks1KkI0KUUuJDosIzooHjkjGi8jHCoeFiIYEg8NDCwAAAAAkAH0AUAI/wABCBxIsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatxoscYNjzU83riRo2TJHih5mCw5smXIFy8+erRRg0ZIGjlkyKihk8YNGzZ1ynghVAYNoj1frNg51CcOoDp31MzRsgfJHDxp7sQhE0cOHTue2qBa08bHkSZ58EBLsoeOjzZtklTLUmWNuj5S5tWhIwcPlCnV9vCRVy3hH4QT/1jMeLGPxpAjS55MubLlyIMfK36M2IdKqjl6qB39NyXovi1Z6uDRl2pqt6CpDkXLY8dIoDRsAIX51iMNGjtvBo25lmhMnjd+3+jrs AAmBUBEA0jajzjWMQVQIAINYEBAAAA7" width="400" height="500" loading="lazy" decoding="async" alt="Photographie de la région anale la veille d’une opération en urgence : la peau périanale est discrètement bombée et rosée d’un côté."><figcaption>Abcès anorectal la veille du drainage : les signes externes peuvent être discrets. <small>Image : Finger74, Wikimedia Commons, licence CC BY-SA 3.0 (<a href="https://commons.wikimedia.org/wiki/File:Anorectal_abscess.jpg" target="_blank" rel="noopener">source</a>), adaptée en GIF.</small></figcaption></figure><p><i>Que montre l’image ?</i> Ici, la rougeur est discrète et la tuméfaction peu visible ; pourtant, le patient a été opéré en urgence. Ainsi, l’intensité de la douleur et le toucher rectal comptent davantage que l’aspect de la peau, car un abcès plus profond soulève peu la peau. C’est pourquoi une douleur anale intense sans lésion visible impose de chercher un abcès intersphinctérien ou supralévatorien.</p><div class="trap"><span class="k">Piège</span>Une douleur anale intense avec une marge normale n’est pas forcément une fissure : si la douleur est continue, lancinante et non liée aux selles, ou s’il y a de la fièvre, il faut chercher un abcès profond par le toucher rectal, puis par l’imagerie si le doute persiste.</div><div class="key"><b>À retenir.</b> Le diagnostic est clinique : douleur croissante, tuméfaction rouge et chaude, induration douloureuse. L’abcès intersphinctérien ne se sent qu’au toucher rectal, et l’abcès supralévatorien se manifeste surtout par une douleur pelvienne diffuse et de la fièvre.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></section>
<section class="ilot" id="k61-4"><h2><span class="n">4</span>Gravité : sepsis et gangrène de Fournier</h2><p>La plupart des abcès restent localisés ; cependant, deux situations changent l’urgence. D’abord, un <button class="w" data-k="k61-sepsis">sepsis</button> avec fièvre élevée, hypotension ou confusion signifie que l’infection a franchi les défenses locales. Ensuite, la <button class="w" data-k="k61-fournier">gangrène de Fournier</button> est une infection nécrosante des tissus mous du périnée et des organes génitaux, qui s’étend rapidement le long des fascias. C’est pourquoi la S3 demande une imagerie en cas de sepsis sévère ou de suspicion de Fournier, afin de mesurer l’extension avant l’opération.</p><p>Par ailleurs, la S3 cite comme terrains d’abcès récidivants ou graves l’immunosuppression, le VIH, les hémopathies et les cancers ; en effet, une défense immunitaire affaiblie limite la formation d’une paroi autour du pus. Dès lors, chez ces patients, l’antibiothérapie s’ajoute au drainage, et la surveillance doit être plus étroite.</p><figure><img src="data:image/gif;base64,R0lGODdhWALAAYYAAKm7t56tp6mkm42klqmalJeZiI+Yf4CZiKuMgJeOh42NhYuOdoSNcoSHdniLcah7dJt5epJ7f5F1b4KBen+BbIN0aneAZXd5bnR0a2Z7X2RxW5xnbZBmaZpYYJBXXohnbodkXohXYIdUU3poYHhgXndkTXNeR3lVWXNWP2pgTWlYQGhWPltpUFldS2FVPWZRQGZRMmBQO19QMldQO49HUH9HTXBHTGpJNGFLN2FENmFGKVpLOVpKMFdEOldEMFhHKlhBKIk5Q3w5QWo5PVc+L1Y4MVY6I4IrNXcrNGIrMXkfKWEfJ2gTHk9BME48LE45KUU/MUU3K0kyK0oxHkEwJjcwJkQqIkQkITomHzUlHy0kHjwdHC8dGD0TFycaGCIREgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWALAAUAI/wBbtGDBQqBAgggTKmShQcNChg0RNsxAsaHFiAkxPizYAkoVLVq8fBk50otJkyO1VKFCBcuWLVxiwnx5peYVKTZvFikipSeUHkBf2Bg6dEfQFymQvgh6ImmKEVAxYBhBIoWNIUOSJFnCdeuSJEOGNk1BNsWJE1d7hCU6NGtWrWHPniUBtSzdERguXKBKl8QJoECxYk2yc0iOwy8S20BK1qjHLCufOCFCxAeQHzJgxJDBo3PnH6B/AJlixMiUKVR6UpH8hAdmF7BdyJjtAgZnGSpWwOg8e4UKFbMzwxguA7TtH0ZAmz495QkQy6WNXHZd+rKO68KHa4dxXYeR7qZfSP+oUGHCBAUJCqg3wF le négligée peut devenir une nécrose étendue. C’est pourquoi une douleur disproportionnée, des crépitations ou une peau violacée imposent une chirurgie immédiate.</p><div class="alert"><b>Gravité d’abord.</b> Fièvre élevée, hypotension, douleur disproportionnée, crépitations sous-cutanées ou peau violacée du périnée : suspecter un sepsis ou une gangrène de Fournier, faire une imagerie, débuter les antibiotiques et opérer en urgence.</div><div class="key"><b>À retenir.</b> Un sepsis ou une suspicion de gangrène de Fournier imposent une imagerie, des antibiotiques et une chirurgie immédiate ; l’immunosuppression favorise les formes graves et les récidives.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-005l_S3_Analabszess_2026-06.pdf" target="_blank" rel="noopener">Fritz S. et al., S3-Leitlinie Analabszess, version 3.0, mai 2026 (AWMF 088-005, DGAV/DGK avec Koloproktologie Schweiz)</a>.</p></section>
