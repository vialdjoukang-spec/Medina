
<!-- ===== FENÊTRES I49 : ECG, localisation, alerte, cardiomyopathie induite, traitement, examens ===== -->
<template data-pop="i49-ecg-esa" data-title="Lecture d’une extrasystole auriculaire">
<div class="lab">Onde P′</div><p>Prématurée, de morphologie différente de la P sinusale. Positive dans les dérivations inférieures si le foyer est haut (veines pulmonaires supérieures, crista terminalis haute) ; négative si le foyer est bas (ostium du sinus coronaire). Souvent cachée dans l’onde T précédente : comparer toutes les ondes T.</p>
<div class="lab">Trois issues</div><p><b>Conduite normalement</b> : QRS fin identique au QRS de base, PR parfois un peu allongé (nœud encore partiellement réfractaire). <b>Conduite avec aberration</b> : QRS large, le plus souvent en retard droit, car la branche droite récupère plus lentement. <b>Bloquée</b> : P′ non suivie de QRS, car le nœud est encore réfractaire ; elle produit une pause.</p>
<div class="lab">Pause</div><p>En règle non compensatrice.</p>
<div class="lab">Diagnostic différentiel</div><p>Arythmie sinusale (variation progressive et cyclique, P identiques) ; pacemaker migrant (plusieurs morphologies de P à fréquence lente) ; début d’une tachycardie atriale ou d’une fibrillation auriculaire (plusieurs ESA consécutives).</p></template>

<template data-pop="i49-ecg-esj" data-title="Extrasystole jonctionnelle : position de l’onde P rétrograde">
<div class="lab">Principe</div><p>Le foyer jonctionnel active les ventricules par les voies normales (QRS fin) et les oreillettes de bas en haut (P négative dans DII, DIII, aVF).</p>
<div class="lab">Trois positions</div><p>P rétrograde <b>avant</b> le QRS avec un PR court (&lt; 120 ms) : l’influx atteint les oreillettes avant les ventricules. P <b>cachée</b> dans le QRS : activation simultanée. P <b>après</b> le QRS, dans le segment ST : conduction rétrograde plus lente.</p>
<div class="lab">Piège</div><p>Une ESA basse (ostium du sinus coronaire) donne aussi une P négative dans les dérivations inférieures, mais avec un PR ≥ 120 ms. Une extrasystole jonctionnelle non propagée peut produire une fausse image de bloc.</p></template>

<template data-pop="i49-ecg-esv" data-title="Lecture d’une extrasystole ventriculaire">
<div class="lab">Critères</div><p>QRS prématuré, large (≥ 120 ms), de morphologie différente du QRS de base ; aucune P prématurée devant ; ST et T opposés à la déflexion principale ; pause compensatrice le plus souvent.</p>
<div class="lab">Ce qu’on mesure</div><p>Morphologie en V1 (retard gauche ou droit), axe dans les dérivations frontales, transition précordiale, durée du QRS extrasystolique, intervalle de couplage, nombre de morphologies.</p>
<div class="lab">Variantes</div><p><b>Interpolée</b> : pas de pause ; le PR suivant s’allonge (conduction cachée). <b>Complexe de fusion</b> : QRS intermédiaire entre le QRS sinusal et l’ESV, quand les deux fronts activent le ventricule en même temps ; il prouve l’origine ventriculaire. <b>ESV tardive</b> : survient après l’onde P sinusale ; le PR est plus court que normal.</p>
<div class="lab">Erreur fréquente</div><p>Mesurer la morphologie sur une seule dérivation. La localisation exige les 12 dérivations, au même instant.</p></template>

<template data-pop="i49-couplage" data-title="Intervalle de couplage">
<div class="lab">Définition</div><p>Temps entre le début du QRS qui précède et le début du QRS extrasystolique.</p>
<div class="lab">Fixe</div><p>Variation inférieure à environ 80 ms : réentrée ou activité déclenchée liée au battement précédent. C’est le cas de la plupart des ESV.</p>
<div class="lab">Variable</div><p>Parasystolie, automatisme indépendant.</p>
<div class="lab">Court</div><p>Moins de 300 ms environ : ESV de Purkinje qui peuvent déclencher une FV idiopathique ou des torsades à couplage court. Signe d’alerte chez un patient qui a une syncope.</p>
<div class="lab">Long</div><p>ESV tardives dans la diastole, souvent idiopathiques, parfois sensibles au ralentissement sinusal.</p></template>

<template data-pop="i49-cuspides" data-title="Cuspides aortiques et sommet du ventricule gauche">
<div class="lab">Cuspide coronaire gauche</div><p>Transition précoce (V1–V2), onde R ample dans les dérivations inférieures ; DI négatif ou isoélectrique ; aspect multiphasique en V1 (en « M » ou en « W ») fréquent. Proximité du tronc commun.</p>
<div class="lab">Cuspide coronaire droite</div><p>Transition en V2–V3 ; DI plutôt positif ; aspect de retard gauche proche de celui de l’infundibulum droit.</p>
<div class="lab">Jonction des cuspides droite et gauche</div><p>QRS négatif en V1 avec une encoche sur sa branche descendante ; transition en V3.</p>
<div class="lab">Sommet du ventricule gauche</div><p>Origine épicardique haute ; retard droit ou transition très précoce, DI négatif, critères épicardiques ; accès difficile (par le sinus coronaire ou la veine interventriculaire antérieure). Succès de l’ablation plus faible.</p>
<div class="lab">Critères indicatifs</div><p>Ces critères morphologiques ont une valeur probabiliste ; la cartographie tranche.</p></template>

<template data-pop="i49-fasc" data-title="ESV fasciculaires">
<div class="lab">Aspect</div><p>Retard droit en V1 et QRS relativement fin (120 à 140 ms), parce que l’ESV naît dans le réseau de Purkinje et l’emprunte aussitôt. Fascicule postérieur gauche : axe supérieur (gauche). Fascicule antérieur gauche : axe droit.</p>
<div class="lab">Profil</div><p>Homme jeune, cœur sain ; les tachycardies fasciculaires correspondantes répondent au vérapamil.</p>
<div class="lab">Traitement</div><p>Ablation par cathéter en première intention si symptomatiques (classe I, ESC 2022) ; vérapamil en alternative.</p>
<div class="lab">Piège</div><p>Un QRS de 125 ms avec un retard droit peut être pris pour une ESA aberrante : l’absence de P prématurée et l’axe tranchent.</p></template>

<template data-pop="i49-anneaux" data-title="Anneaux valvulaires et muscles papillaires">
<div class="lab">Anneau mitral</div><p>Retard droit, concordance positive de V1 à V6 (toutes les précordiales positives), onde S en DI si l’origine est latérale. Le plus souvent idiopathique ; associé parfois à un prolapsus.</p>
<div class="lab">Anneau tricuspide</div><p>Retard gauche, DI positif, transition tardive, axe variable selon la position autour de l’anneau.</p>
<div class="lab">Muscles papillaires</div><p>Retard droit, QRS plus large (souvent &gt; 150 ms), morphologie variable d’un battement à l’autre (sortie changeante) ; ablation plus difficile. Rechercher un prolapsus mitral arythmogène et une cicatrice.</p>
<div class="lab">Conséquence</div><p>Une ESV à retard droit est plus souvent associée à une cardiopathie qu’une ESV infundibulaire : l’IRM est recommandée si la présentation n’est pas typique d’une forme idiopathique (ESC 2022).</p></template>

<template data-pop="i49-epicard" data-title="Critères d’origine épicardique">
<div class="lab">Principe</div><p>Une ESV épicardique active d’abord l’épicarde, loin du réseau de Purkinje endocardique : le début du QRS est lent et empâté.</p>
<div class="lab">Critères publiés</div><p>Pseudo-onde delta ≥ 34 ms ; délai de déflexion intrinsécoïde en V1–V2 ≥ 85 ms ; durée RS ≥ 121 ms (Berruezo, 2004, décrits pour les tachycardies) ; indice de déflexion maximale ≥ 0,55 dans les précordiales (Daniels, 2006, pour les chambres de chasse).</p>
<div class="lab">Portée</div><p>Critères imparfaits, variables selon la région et la présence d’une cicatrice. Une origine épicardique augmente le risque de cardiomyopathie induite et la difficulté de l’ablation (accès percutané sous-xiphoïde ou par le système veineux coronaire).</p></template>

<template data-pop="i49-mnemo-mefiants" data-title="MÉFIANTS : signes d’alerte devant des extrasystoles">
<p><b>Aide pédagogique, non critère officiel.</b> Chaque lettre rappelle un signe qui impose de chercher une cardiopathie ou un trouble électrique primaire.</p>
<table class="t"><tr><th>Lettre</th><th>Signe</th><th>Pourquoi</th></tr>
<tr><td>M</td><td>Morphologie atypique : non infundibulaire, retard droit, plusieurs morphologies</td><td>Plus souvent liée à un substrat</td></tr>
<tr><td>É</td><td>Effort : ESV qui apparaissent, augmentent ou se compliquent à l’effort ; nombreuses en récupération</td><td>Ischémie, cardiomyopathie, TVPC</td></tr>
<tr><td>F</td><td>Famille : mort subite avant 50 ans, cardiomyopathie, canalopathie</td><td>Maladie héréditaire</td></tr>
<tr><td>I</td><td>Intervalle de couplage court, R sur T</td><td>Déclencheur de FV</td></tr>
<tr><td>A</td><td>Anomalie cardiaque : cardiopathie connue, ECG sinusal anormal, souffle, FEVG réduite</td><td>Substrat de TV et de mort subite</td></tr>
<tr><td>N</td><td>Nombre : charge ≥ 10 %</td><td>Cardiomyopathie induite</td></tr>
<tr><td>T</td><td>TVNS, doublets polymorphes, salves</td><td>Complexité, substrat</td></tr>
<tr><td>S</td><td>Syncope, surtout d’effort ou sans prodrome</td><td>Arythmie maligne possible</td></tr></table></template>

<template data-pop="i49-ecg-base" data-title="ECG de repos : anomalies qui changent tout">
<div class="lab">Onde Q de nécrose, bloc de branche gauche</div><p>Cardiopathie ischémique ou cardiomyopathie : échocardiographie, IRM, recherche d’ischémie.</p>
<div class="lab">T négatives de V1 à V3 (ou au-delà) après 14 ans, onde epsilon</div><p>Cardiomyopathie arythmogène du ventricule droit.</p>
<div class="lab">T négatives inférieures chez une femme avec un clic</div><p>Prolapsus mitral arythmogène.</p>
<div class="lab">QTc long ou court, aspect de Brugada, repolarisation précoce inféro-latérale</div><p>Canalopathie (chapitre I47).</p>
<div class="lab">Bloc auriculoventriculaire ou bloc de branche chez l’adulte jeune</div><p>Sarcoïdose, laminopathie (<i>LMNA</i>), myocardite.</p>
<div class="lab">Hypertrophie, bas voltage</div><p>Hypertension, cardiomyopathie hypertrophique, amylose.</p>
<div class="lab">Pré-excitation</div><p>Voie accessoire : les « palpitations » peuvent être des tachycardies réciproques.</p></template>

<template data-pop="i49-effort" data-title="ESV à l’épreuve d’effort">
<div class="lab">Suppression à l’effort</div><p>Les ESV disparaissent quand la fréquence sinusale dépasse leur fréquence : réponse fréquente sur cœur sain, plutôt rassurante, mais sans valeur absolue.</p>
<div class="lab">Apparition ou augmentation</div><p>Monomorphes, retard gauche, axe inférieur, sur cœur sain : ESV de la chambre de chasse, souvent sensibles aux catécholamines. Polymorphes, doublets, salves, retard droit, ou sur cardiopathie : ischémie, cardiomyopathie, myocardite.</p>
<div class="lab">Complexité croissante jusqu’à une TV bidirectionnelle</div><p>TVPC : arrêt de l’épreuve, génétique, bêtabloquant non sélectif (chapitre I47).</p>
<div class="lab">Récupération</div><p>Des ESV fréquentes pendant la récupération s’associent à une mortalité accrue, davantage que les ESV pendant l’effort (Frolkis et coll., 2003).</p>
<div class="lab">Sécurité</div><p>Défibrillateur disponible ; arrêt si TVNS polymorphe, TV soutenue, sous-décalage ischémique important ou chute tensionnelle.</p></template>

<template data-pop="i49-cmie-crit" data-title="Cardiomyopathie induite : facteurs de risque et critères">
<div class="lab">Facteurs de risque</div><p>Charge ≥ 10 % (seuil ESC 2022), risque surtout au-delà de 20 % ; dans une série, le seuil de 24 % séparait le mieux les patients avec et sans dysfonction (Baman et coll., 2010). QRS extrasystolique large (au-delà d’environ 150 ms) ; origine épicardique ou non infundibulaire ; ESV interpolées ; conduction rétrograde ; longue durée d’évolution ; absence de symptômes ; sexe masculin ; indice de masse corporelle élevé.</p>
<div class="lab">Critères de suspicion</div><p>FEVG &lt; 50 % sans autre cause (coronaires, valves, hypertension, toxiques, cardiomyopathie génétique évidente) ; charge ≥ 10 % ; ESV surtout monomorphes ; IRM sans cicatrice étendue.</p>
<div class="lab">Confirmation</div><p>Rétrospective : amélioration nette ou normalisation de la FEVG après suppression des ESV.</p>
<div class="lab">Piège</div><p>Une cardiomyopathie génétique peut produire des ESV nombreuses. Plusieurs morphologies, un rehaussement tardif ou une histoire familiale doivent faire douter du caractère « induit ».</p></template>

<template data-pop="i49-cmie-irm" data-title="IRM dans la cardiomyopathie induite">
<div class="lab">Question</div><p>Existe-t-il une cicatrice ou une infiltration qui expliquerait la dysfonction sans les ESV ?</p>
<div class="lab">Lecture</div><p>Absence de rehaussement tardif : argument en faveur d’une cardiomyopathie induite et d’une récupération après ablation. Rehaussement sous-endocardique systématisé : cicatrice ischémique. Rehaussement intramyocardique septal ou sous-épicardique : cardiomyopathie non ischémique, myocardite, sarcoïdose ; récupération moins probable et stratification propre.</p>
<div class="lab">Contrainte technique</div><p>Les ESV fréquentes dégradent la synchronisation de l’image ; des séquences adaptées aux arythmies sont utilisées.</p>
<div class="lab">Statut</div><p>Classe IIa en cas de suspicion de cardiomyopathie induite (ESC 2022).</p></template>

<template data-pop="i49-cmie-recup" data-title="Récupération de la FEVG après suppression des ESV">
<div class="lab">Délai</div><p>Après une ablation efficace, la FEVG remonte dans la plupart des cas en quelques mois, souvent entre trois et six mois ; une amélioration plus lente est possible si la dysfonction était ancienne.</p>
<div class="lab">Critère pratique</div><p>Normalisation de la FEVG ou gain absolu net (de l’ordre d’au moins 10 points) avec une réduction importante de la charge.</p>
<div class="lab">Échec de récupération</div><p>Cardiomyopathie sous-jacente, fibrose, ablation incomplète (autre foyer), charge persistante.</p>
<div class="lab">Suivi</div><p>Holter et échocardiographie à trois puis six mois ; une récidive des ESV peut refaire baisser la FEVG. Les indications de défibrillateur sont réévaluées après ce délai.</p></template>

<template data-pop="i49-crt" data-title="ESV et resynchronisation cardiaque">
<div class="lab">Problème</div><p>La resynchronisation n’agit que sur les battements stimulés par les deux sondes. Chaque ESV est un battement non resynchronisé ; au-delà de quelques pour cent, le bénéfice diminue nettement.</p>
<div class="lab">Mesure</div><p>L’interrogation du dispositif donne le pourcentage de stimulation biventriculaire ; l’objectif habituel est d’au moins 98 %.</p>
<div class="lab">Conduite (ESC 2022)</div><p>Chez le non-répondeur avec des ESV fréquentes, surtout monomorphes, qui limitent la stimulation biventriculaire malgré le traitement médicamenteux : ablation ou antiarythmique (classe IIa).</p></template>

<template data-pop="i49-ablation" data-title="Ablation des extrasystoles ventriculaires">
<div class="lab">Principe</div><p>Un cathéter est amené au foyer, repéré par cartographie d’activation (site le plus précoce) et par cartographie par stimulation ; un courant de radiofréquence y crée une lésion qui détruit le foyer.</p>
<div class="lab">Succès</div><p>Élevé dans la chambre de chasse droite (de l’ordre de 80 à 95 % selon les séries) ; plus faible pour les origines épicardiques, le sommet du ventricule gauche et les muscles papillaires.</p>
<div class="lab">Risques</div><p>Globalement faibles (de l’ordre de 1 à 3 % de complications significatives) : complications vasculaires, tamponnade (paroi libre fine de l’infundibulum droit), lésion coronaire (cuspides), bloc auriculoventriculaire (foyers para-hisiens).</p>
<div class="lab">Conditions de succès</div><p>ESV présentes le jour de l’intervention ; antiarythmiques suspendus selon le rythmologue ; sédation légère plutôt qu’anesthésie générale.</p>
<div class="lab">Indications (ESC 2022)</div><p>Classe I : ESV symptomatiques de la chambre de chasse droite ou des fascicules ; cardiomyopathie induite. Classe IIa : autres origines symptomatiques ; non-répondeur à la resynchronisation. Classe IIb : charge persistante supérieure à 20 % chez le patient asymptomatique.</p></template>

<template data-pop="i49-education" data-title="Entretien d’explication">
<div class="lab">Ce qu’il faut dire</div><p>« Ces battements sont des battements en avance. Le cœur se repose ensuite un peu plus longtemps, puis le battement suivant est plus fort : c’est lui que vous sentez. Votre cœur est normal à l’échographie ; ces battements ne l’abîment pas au nombre où vous les avez. »</p>
<div class="lab">Ce qu’il faut éviter</div><p>« Ce n’est rien » sans explication ni examen ; une interdiction systématique du café ou du sport ; un antiarythmique pour rassurer.</p>
<div class="lab">Ce qu’il faut prévoir</div><p>Les signes qui doivent faire reconsulter : syncope, palpitations rapides et durables, dyspnée ou baisse de la tolérance à l’effort, douleur thoracique.</p>
<div class="lab">Effet attendu</div><p>Chez beaucoup de patients, comprendre le mécanisme réduit la gêne et l’hypervigilance, sans changer le nombre d’extrasystoles.</p></template>

<template data-pop="i49-holter" data-title="Holter : lecture d’un compte rendu">
<div class="lab">Qualité</div><p>Durée analysable, artefacts, nombre de dérivations (au moins deux, idéalement trois ou douze pour la morphologie).</p>
<div class="lab">Rythme de base</div><p>Fréquences minimale, moyenne et maximale ; pauses ; troubles de conduction.</p>
<div class="lab">Extrasystoles</div><p>Nombre total et charge ; nombre de morphologies ; doublets, salves, TVNS ; distribution horaire (diurne, adrénergique ; nocturne, vagale) ; relation avec la fréquence sinusale.</p>
<div class="lab">Corrélation</div><p>Symptômes notés au journal et tracé correspondant : un symptôme pendant un rythme sinusal normal exclut une cause rythmique pour cet épisode.</p>
<div class="lab">Pièges</div><p>Artefacts de mouvement pris pour des TV ; ESV mal classées par l’algorithme (relire les tracés) ; charge variable d’un jour à l’autre.</p></template>

<template data-pop="i49-montre" data-title="Montres et smartphones">
<div class="lab">Photopléthysmographie</div><p>Capteur optique qui mesure le pouls au poignet. Il signale un rythme irrégulier, mais ne distingue pas une fibrillation auriculaire d’extrasystoles fréquentes : c’est un outil de repérage.</p>
<div class="lab">ECG à une dérivation</div><p>Enregistrement de 30 secondes par contact des doigts. Selon l’ESC 2024, un tracé d’au moins 30 secondes relu par un médecin suffit à poser le diagnostic de fibrillation auriculaire. Il permet de reconnaître des extrasystoles, mais pas de localiser une ESV.</p>
<div class="lab">Usage pratique</div><p>Demander au patient d’enregistrer pendant ses symptômes et d’apporter le tracé ; c’est souvent le moyen le plus simple d’obtenir la corrélation symptôme-rythme.</p>
<div class="lab">Limites</div><p>Faux positifs, artefacts, anxiété entretenue par les alertes répétées ; l’interprétation automatique ne remplace pas la lecture médicale.</p></template>

<template data-pop="i49-cartographie" data-title="Cartographie électroanatomique">
<div class="lab">Principe</div><p>Un système reconstruit la cavité en trois dimensions et y affiche, point par point, le moment d’activation local mesuré par le cathéter.</p>
<div class="lab">Cartographie d’activation</div><p>On cherche le site dont l’électrogramme bipolaire précède le plus le début du QRS extrasystolique (souvent de 25 à 40 ms dans les foyers idiopathiques) ; l’électrogramme unipolaire y montre un aspect QS.</p>
<div class="lab">Cartographie par stimulation</div><p>On stimule depuis le cathéter et on compare le QRS obtenu à celui de l’ESV sur les 12 dérivations ; une correspondance quasi parfaite (12 dérivations sur 12, ou score de corrélation élevé) localise la sortie du foyer.</p>
<div class="lab">Limite</div><p>Il faut des ESV pendant l’intervention ; en leur absence, on provoque le foyer par isoprénaline ou on recourt à la cartographie par stimulation seule, moins précise.</p></template>
