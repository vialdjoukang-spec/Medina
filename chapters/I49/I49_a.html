<section class="ilot" id="i49-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une étudiante de 23 ans consulte parce que son cœur « rate un battement » plusieurs fois par jour, surtout le soir au repos, puis « repart avec un grand coup ». Le même jour, un maçon de 58 ans, ancien fumeur, décrit des « ratés » qui apparaissent quand il monte les échafaudages. Plus tard, une infirmière de 29 ans raconte qu’en station debout son cœur s’emballe jusqu’à 130/min et qu’elle doit s’asseoir sous la douche.</p>
<p>Les trois patients disent « palpitations ». Leur pronostic n’a rien de commun. La question qui structure ce chapitre est donc : <b>derrière une palpitation ou une extrasystole, existe-t-il une cardiopathie, un risque de mort subite, une dysfonction ventriculaire en cours, ou un trouble de la régulation autonome ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait conduire la démarche diagnostique d’une palpitation, lire et localiser une extrasystole sur l’ECG, reconnaître les signes d’alerte, dépister et traiter une cardiomyopathie induite par les extrasystoles, reconnaître et traiter une fibrillation ventriculaire selon l’ERC 2025, interpréter un rythme d’échappement, poser le diagnostic d’un syndrome de tachycardie orthostatique posturale et conseiller le patient pour le sport et la conduite.</p>
<div class="key"><b>Prérequis.</b> Le <button class="w" data-k="i47-pa">potentiel d’action cardiaque (phases et courants)</button>, la <button class="w" data-k="i44-automat">hiérarchie des centres d’automatisme (sinus, jonction, ventricule)</button> et les <button class="w" data-k="i47-declench">post-dépolarisations (activité déclenchée)</button>. Les tachycardies soutenues relèvent du chapitre I47 ; les blocs et la stimulation, du chapitre I44 ; la fibrillation auriculaire, du chapitre I48.</div>
</section>

<section class="ilot" id="i49-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Une <b>extrasystole</b> est une dépolarisation <b>prématurée</b> née d’un foyer autre que le nœud sinusal, qui survient avant le battement sinusal attendu. Le mot « prématuré » est essentiel : un battement ectopique qui survient <i>après</i> une pause n’est pas une extrasystole, mais un <b>échappement</b>. Le premier est actif : un foyer se dépolarise avant le sinus. Le second est passif : un centre sous-jacent se dépolarise parce que le centre supérieur s’est tu. Confondre les deux conduit à supprimer un rythme de secours.</p>
<h3>1.1 Selon le siège</h3>
<div class="two">
<div class="card"><h4>Extrasystole auriculaire (ESA)</h4><p>Née dans le myocarde auriculaire, souvent près des veines pulmonaires ou de la crista terminalis. L’onde P est prématurée et de morphologie différente (notée P′), parce que l’activation des oreillettes part d’un autre point que le nœud sinusal. Elle est suivie en règle d’un QRS fin, car l’influx gagne ensuite les ventricules par le nœud auriculoventriculaire et le réseau de His-Purkinje, comme un battement sinusal.</p></div>
<div class="card"><h4>Extrasystole jonctionnelle</h4><p>Née dans la jonction auriculoventriculaire. QRS fin prématuré, sans onde P qui le précède normalement ; onde P rétrograde, négative dans DII, DIII et aVF, juste avant, dans ou juste après le QRS.</p></div>
<div class="card"><h4>Extrasystole ventriculaire (ESV)</h4><p>Née sous la bifurcation du faisceau de His. QRS prématuré, généralement large (≥ 120 ms), non précédé d’une P prématurée, avec une repolarisation de polarité opposée au QRS.</p></div>
<div class="card"><h4>Parasystolie</h4><p>Un foyer ectopique protégé de la décharge sinusale par un bloc d’entrée bat à son propre rythme. Les intervalles de couplage varient, mais les intervalles entre extrasystoles sont des multiples d’un même cycle. Voir la <button class="w" data-k="i49-parasyst">parasystolie (bloc d’entrée, critères ECG)</button>.</p></div></div>
<h3>1.2 Selon la répétition, la forme et le moment</h3>
<p>Le vocabulaire est standardisé et chaque terme a une conséquence. On parle de <b>bigéminisme</b> quand chaque battement sinusal est suivi d’une extrasystole, de <b>trigéminisme</b> quand l’extrasystole revient tous les trois battements, de <b>doublet</b> pour deux extrasystoles consécutives. À partir de <b>trois complexes ventriculaires consécutifs</b> à plus de 100/min, on parle de TV ; si elle cesse spontanément en moins de 30 secondes, elle est dite <button class="w" data-k="i47-tvns">tachycardie ventriculaire non soutenue (définition, signification selon le terrain)</button>. Le détail des termes figure dans la fiche <button class="w" data-k="i49-termino">vocabulaire des extrasystoles (monomorphe, interpolée, R sur T, charge)</button>.</p>
<p>La <b>charge extrasystolique</b> est le pourcentage de battements extrasystoliques sur l’ensemble des battements enregistrés en 24 heures. Exemple : 18 000 ESV sur 100 000 battements donnent une charge de 18 %. C’est la mesure qui décide de la surveillance de la fonction ventriculaire (îlot 10).</p>
<p>Le syndrome de tachycardie orthostatique posturale (POTS) et la tachycardie sinusale inappropriée ne sont pas des arythmies au sens strict, mais ils posent le même problème clinique que les extrasystoles : une palpitation à interpréter. Ils sont donc traités dans ce chapitre (îlot 14). Le syndrome de Brugada relève du chapitre I47, la maladie du sinus pour sa physiologie et sa stimulation du chapitre I44.</p>
<div class="trap"><span class="k">Piège</span>Appeler « extrasystole » tout complexe large isolé. Un QRS large après un cycle long suivi d’un cycle court, précédé d’une P prématurée, est une <button class="w" data-k="i47-aberr">aberration de conduction (phénomène d’Ashman, retard droit)</button> : c’est une ESA conduite avec un bloc de branche fonctionnel, et non une ESV.</div>
</section>

<section class="ilot" id="i49-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les extrasystoles sont l’arythmie la plus fréquente. Sur un ECG de 10 secondes, des ESV apparaissent chez environ 1 % des adultes en bonne santé ; sur un Holter de 24 à 48 heures, on en trouve chez une majorité d’adultes, et des ESA chez presque tous les sujets âgés. Leur fréquence augmente avec l’âge, l’hypertension, la cardiopathie et les troubles électrolytiques. Les chiffres et leurs sources sont regroupés dans la fiche <button class="w" data-k="i49-epi">épidémiologie des extrasystoles (ECG, Holter, âge)</button>.</p>
<p>Le pronostic dépend du <b>terrain</b>, beaucoup plus que du nombre d’extrasystoles. Sur cœur sain, des ESV isolées monomorphes ne réduisent pas l’espérance de vie. Chez 73 sujets asymptomatiques au bilan non invasif normal, porteurs d’ESV fréquentes et souvent complexes, la mortalité observée en 6,5 ans de suivi moyen est restée inférieure à celle attendue dans la population générale (Kennedy et al., 1985). L’absence de cardiopathie ou de canalopathie identifiée rend le risque généralement faible, mais n’exclut pas une TV idiopathique soutenue : certains foyers entretiennent une activité déclenchée ou une réentrée sans cicatrice apparente. Dans les grandes cohortes de population, une densité élevée d’ESV s’associe cependant à une baisse ultérieure de la FEVG, à l’insuffisance cardiaque et à la mortalité : elle est un <b>marqueur</b> de cardiopathie infraclinique, parfois une <b>cause</b> de dysfonction (<button class="w" data-k="i49-prono">données pronostiques des cohortes (ARIC, Cardiovascular Health Study)</button>).</p>
<p>Pour les ESA, l’<button class="w" data-k="i49-essa">activité ectopique supraventriculaire excessive (≥ 30 ESA par heure ou salves ≥ 20 battements)</button> prédit la fibrillation auriculaire et l’accident vasculaire cérébral. Elle justifie donc de rechercher une fibrillation auriculaire, non de traiter les ESA.</p>
<p>La <b>fibrillation ventriculaire</b> est le rythme initial d’une part importante des arrêts cardiaques extrahospitaliers et le mécanisme terminal de la plupart des morts subites d’origine cardiaque. Le <b>syndrome de tachycardie orthostatique posturale</b> touche surtout des femmes de 15 à 50 ans ; sa prévalence minimale est estimée à environ 170 pour 100 000 personnes (0,2 %).</p>
<div class="trap"><span class="k">Données suisses</span>Aucune donnée suisse consolidée ne décrit la prévalence des ESA, des palpitations en médecine de premier recours ou du syndrome de tachycardie orthostatique posturale. Pour les ESV, la donnée la plus proche vient d’une cohorte de population conduite par l’Hôpital universitaire de Bâle chez 2 048 adultes de 25 à 41 ans, recrutés au Liechtenstein : au moins une ESV était présente sur un Holter de 24 heures chez 69 % des participants ; la médiane était de 2 ESV par jour et le 95e percentile de 193 (von Rotz et al., 2017). Les chiffres cités sont européens et nord-américains ; les registres suisses d’arrêt cardiaque extrahospitalier ne distinguent pas publiquement le rythme initial de façon consolidée.</div>
<button class="pareto-btn ui" data-k="pareto-i49-def">▲ Loi de Pareto — Définitions, classifications, épidémiologie</button>
</section>

<section class="ilot" id="i49-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Comprendre une extrasystole, c’est répondre à quatre questions : pourquoi un foyer se dépolarise trop tôt, pourquoi la pause qui suit est plus ou moins longue, pourquoi le patient sent surtout le battement <i>suivant</i>, et comment des extrasystoles bénignes peuvent altérer un ventricule.</p>
<h3>3.1 Trois mécanismes de naissance</h3>
<div class="two">
<div class="card"><h4>Activité déclenchée</h4><p>Une <button class="w" data-k="i47-declench">post-dépolarisation tardive (surcharge calcique, catécholamines)</button> atteint le seuil après la repolarisation et produit un battement. C’est le mécanisme des ESV de la chambre de chasse et de l’intoxication digitalique. Il explique leur sensibilité aux bêtabloquants, au vérapamil et à l’adénosine.</p></div>
<div class="card"><h4>Automatisme anormal</h4><p>Des cellules normalement stables se dépolarisent spontanément sous l’effet de l’ischémie, de l’étirement ou des catécholamines. Voir l’<button class="w" data-k="i47-automat">automatisme anormal (indices ECG, exemples)</button>.</p></div>
<div class="card"><h4>Microréentrée</h4><p>Sur une cicatrice, un influx tourne dans un petit circuit et ressort une fois. L’intervalle de couplage est alors <b>fixe</b>, car il dépend du temps de parcours du circuit. Voir la <button class="w" data-k="i47-reentree">réentrée (trois conditions)</button>.</p></div>
<div class="card"><h4>Foyer protégé (parasystolie)</h4><p>Un foyer automatique entouré d’un bloc d’entrée n’est pas remis à zéro par le sinus. Les couplages varient ; les complexes de fusion sont fréquents.</p></div></div>
<h3>3.2 La pause et le « grand coup »</h3>
<p>Une ESV conduit rarement de façon rétrograde jusqu’au nœud sinusal. Le sinus continue donc de battre à son rythme ; son onde P tombe pendant l’ESV, trouve le nœud auriculoventriculaire réfractaire et n’est pas conduite. Le battement sinusal suivant arrive à l’heure. L’intervalle qui encadre l’ESV vaut exactement deux cycles sinusaux : c’est la <button class="w" data-k="i49-pause">pause compensatrice (mesure, exceptions)</button>. Une ESA, au contraire, pénètre le nœud sinusal et le remet à zéro : la pause est <b>non compensatrice</b>.</p>
<p>Pendant la pause, le ventricule se remplit plus longtemps et le réticulum sarcoplasmique accumule davantage de calcium. Le battement suivant est donc plus vigoureux : c’est la <button class="w" data-k="i49-potent">potentialisation post-extrasystolique (Frank-Starling et calcium)</button>. Le patient ne sent pas l’extrasystole, trop précoce pour éjecter beaucoup de sang ; il sent la <b>pause</b> (« le cœur s’arrête ») puis le <b>battement potentialisé</b> (« il repart avec un coup »).</p>
<div class="key"><b>Corrélation physiologie → clinique.</b> L’ESV très précoce remplit peu le ventricule : elle ne génère pas d’onde de pouls. Au pouls radial ou sur un saturomètre, un bigéminisme ventriculaire à 80/min peut apparaître comme une « bradycardie » à 40/min. C’est le <button class="w" data-k="i49-e-pouls">déficit de pouls (pouls radial et auscultation simultanés)</button>. Le diagnostic se fait sur l’ECG, jamais sur l’appareil automatique.</div>
<h3>3.3 Pourquoi des extrasystoles fréquentes altèrent le ventricule</h3>
<p>Une ESV active le ventricule à partir d’un point ectopique et se propage lentement de cellule à cellule, hors du réseau de Purkinje. La contraction est asynchrone, comme dans un bloc de branche gauche. Répétée des dizaines de milliers de fois par jour, cette activation anormale entraîne un <b>asynchronisme</b> mécanique, une anomalie du cycle du calcium, une consommation d’énergie inefficace et une activation neurohormonale. Le ventricule se dilate et la FEVG baisse. Il n’y a pas, au début, de fibrose : la dysfonction est <b>réversible</b> si l’on supprime les extrasystoles (<button class="w" data-k="i49-cmie-meca">mécanismes de la cardiomyopathie induite par les extrasystoles</button>).</p>
<h3>3.4 Du battement isolé à la fibrillation ventriculaire</h3>
<p>Une ESV qui tombe au sommet de l’onde T, pendant la <button class="w" data-k="i49-vulnerable">période vulnérable (R sur T, dispersion de la réfractarité)</button>, rencontre un myocarde en partie réfractaire et en partie réexcitable. L’influx se fragmente et peut initier une fibrillation ventriculaire. Ce danger augmente avec une ischémie aiguë, un QT long, une cicatrice ou une canalopathie ; leur absence apparente ne l’exclut pas. Chez le sujet sain, les ESV précoces restent en règle sans conséquence. L’exception est l’ESV à couplage très court née du réseau de Purkinje : elle peut déclencher une FV sur un cœur apparemment normal.</p>

<section class="ilot" id="i49-4"><h2><span class="n">4</span>Étiologies et facteurs favorisants</h2>
<p>Face à des extrasystoles, la question étiologique se pose en deux temps : existe-t-il une <b>cardiopathie</b> qui en fait un signe d’alerte, et existe-t-il un <b>facteur favorisant</b> que l’on peut corriger ?</p>
<div class="two">
<div class="card"><h4>Cardiopathies à rechercher</h4><p>Cardiopathie ischémique (cicatrice, ischémie aiguë) ; cardiomyopathies dilatée, hypertrophique et <button class="w" data-k="i42-arvc-tfc">cardiomyopathie arythmogène du ventricule droit (critères)</button> ; <button class="w" data-k="i42-sarcoid">sarcoïdose cardiaque</button> ; myocardite ; valvulopathies, en particulier le <button class="w" data-k="i49-pvm">prolapsus valvulaire mitral arythmogène (disjonction de l’anneau)</button> ; hypertension avec hypertrophie ; cardiopathie congénitale opérée. Toutes créent un substrat : une cicatrice ou une fibrose ralentit la conduction et permet des microréentrées, et l’étirement ou l’inflammation favorisent l’automatisme anormal. Le même substrat peut entretenir une TV soutenue, ce qui fait de ces ESV un signal d’alerte.</p></div>
<div class="card"><h4>Troubles électriques primaires</h4><p>Tachycardie ventriculaire polymorphe catécholergique ; QT long ; syndrome de Brugada ; fibrillation ventriculaire idiopathique déclenchée par des ESV courtes de Purkinje. Voir le chapitre I47.</p></div>
<div class="card"><h4>Facteurs métaboliques et toxiques</h4><p><button class="w" data-k="i47-k">Hypokaliémie (diurétiques, vomissements)</button>, <button class="w" data-k="i47-mg">hypomagnésémie</button>, hyperthyroïdie, anémie, fièvre, hypoxémie ; alcool ; cocaïne, amphétamines ; sympathomimétiques (décongestionnants, bêta-2 agonistes à forte dose) ; <button class="w" data-k="d-dig">intoxication digitalique (bigéminisme, tachycardie atriale avec bloc)</button> ; manque de sommeil ; apnées du sommeil.</p></div>
<div class="card"><h4>Extrasystoles idiopathiques</h4><p>Sans cardiopathie, le plus souvent issues des chambres de chasse. C’est la situation la plus fréquente chez l’adulte jeune.</p></div></div>
<p>Le rôle de la caféine est souvent surestimé. Dans les grandes cohortes, la consommation habituelle de café ne s’associe pas à davantage d’extrasystoles. Dans l’essai randomisé CRAVE (2023), les jours avec café comptaient davantage d’ESV (154 contre 102 par jour en moyenne, rapport de taux 1,51, soit environ 50 % de plus), sans effet significatif sur les ESA, critère principal de l’essai (58 contre 53 par jour) : l’effet existe, mais il reste modeste en valeur absolue, de l’ordre de 50 ESV de plus sur environ 100 000 battements quotidiens. On conseille donc de réduire le café si le patient observe lui-même un lien, sans interdiction systématique. La fiche <button class="w" data-k="i49-declench">facteurs favorisants (café, alcool, sommeil, médicaments)</button> détaille ces éléments.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Chercher les ESV sur l’ECG et oublier le ionogramme. Chez un patient âgé sous diurétique de l’anse, un bigéminisme récent impose <button class="w" data-k="i49-bilan-bio">un potassium, un magnésium</button> et, s’il prend de la digoxine, une digoxinémie, avant toute autre démarche.</div>
<button class="pareto-btn ui" data-k="pareto-i49-etio">▲ Loi de Pareto — Étiologies et facteurs favorisants</button>
</section>

<section class="ilot" id="i49-5"><h2><span class="n">5</span>Palpitations : l’anamnèse qui oriente</h2>
<p>Une palpitation est la <b>perception désagréable des battements cardiaques</b>. Ce n’est pas un diagnostic. La position de l’EHRA (2011) distingue quatre types de palpitations, qui orientent dès l’interrogatoire : <button class="w" data-k="i49-palp-types">types de palpitations selon l’EHRA (extrasystolique, tachycardique, anxieuse, pulsatile)</button>. Dans une cohorte prospective de 190 patients, l’anamnèse, l’examen, l’ECG ou une biologie simple ont suffi à établir environ 40 % des causes identifiées (Weber et Kapoor, 1996) ; dans les autres cas, la clé est souvent l’enregistrement du rythme pendant le symptôme.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i47-atcd-card">Cardiopathie connue (infarctus, cardiomyopathie, valvulopathie)</button></li><li><button class="w" data-k="i47-atcd-fam">Mort subite ou cardiomyopathie dans la famille (avant 50 ans)</button></li><li>Syncope, en particulier d’effort : l’effort libère des catécholamines, qui déclenchent les arythmies ventriculaires de l’ischémie, des cardiomyopathies et de la TVPC</li><li>Hypertension, apnées du sommeil</li></ul>
<ul><li><button class="w" data-k="i49-atcd-subst">Médicaments et substances (liste ciblée)</button></li><li><button class="w" data-k="i49-bilan-bio">Hyperthyroïdie, anémie</button>, grossesse</li><li><button class="w" data-k="i49-atcd-psy">Trouble anxieux ou panique : diagnostic à ne poser qu’après exclusion d’une arythmie</button></li><li>Infection virale récente, COVID-19, hypermobilité articulaire (orthostatisme)</li></ul></div>
<h3>5.2 Caractériser le symptôme</h3>
<div class="two">
<ul><li><button class="w" data-k="i49-s-rate">« Raté » suivi d’un coup fort (extrasystole)</button></li><li><button class="w" data-k="i47-s-palp">Palpitations rapides : début, fin, régularité</button></li><li><button class="w" data-k="i47-s-cou">Battements dans le cou (dissociation auriculoventriculaire)</button></li></ul>
<ul><li><button class="w" data-k="i49-s-effort">Palpitations à l’effort ou à la récupération</button></li><li><button class="w" data-k="i49-s-syncope">Palpitations suivies d’une syncope</button></li><li><button class="w" data-k="i49-s-ortho">Palpitations en station debout, soulagées par le décubitus</button></li></ul></div>
<p>Six questions structurent l’interrogatoire : comment cela commence et finit (brutal ou progressif), le rythme (régulier ou irrégulier, que le patient peut tapoter sur la table), la fréquence, les circonstances (repos, effort, position, repas, alcool), les symptômes associés (syncope, douleur, dyspnée) et la durée de l’histoire. Demander au patient de <b>tapoter le rythme</b> est l’une des manœuvres les plus rentables de l’anamnèse. Un rythme rapide et régulier, qui commence et finit brutalement, évoque une réentrée ; un rythme irrégulier sans retour à la régularité, une fibrillation auriculaire ; un rythme régulier interrompu par un battement prématuré suivi d’une pause, des extrasystoles.</p>
<h3>5.3 Présentations typiques et trompeuses</h3>
<div class="two">
<div class="card"><h4>Forme typique bénigne</h4><p>Femme de 35 ans, « ratés » isolés au repos, au coucher, après un repas ; disparaissent à la marche ; aucune syncope ; examen et ECG normaux hors extrasystoles. ESV de la chambre de chasse droite probables.</p></div>
<div class="card"><h4>Forme d’alerte</h4><p>Homme de 58 ans, ratés en salves à l’effort, dyspnée récente ; ancien fumeur. ESV d’effort sur cardiopathie ischémique jusqu’à preuve du contraire (îlot 9).</p></div>
<div class="card"><h4>Forme silencieuse</h4><p>Homme de 45 ans sans symptôme ; bigéminisme découvert à un bilan préopératoire ; essoufflement discret attribué au surpoids. Holter : charge de 26 %, FEVG 38 %. Cardiomyopathie induite par les extrasystoles (îlot 10). L’absence de symptôme retarde le diagnostic.</p></div>
<div class="card"><h4>Forme étiquetée « anxieuse »</h4><p>Femme de 27 ans, crises de palpitations rapides avec angoisse, étiquetées « attaques de panique » depuis trois ans. Les crises commencent et finissent brutalement, et une polyurie les suit. Dans la réentrée intranodale, oreillettes et ventricules se contractent presque en même temps : les oreillettes se contractent contre des valves auriculoventriculaires fermées, leur pression monte et elles libèrent le peptide natriurétique auriculaire (Abe et al., 1997) ; l’urodilatine, peptide natriurétique d’origine rénale, pourrait aussi intervenir (Kentsch et al., 1998). Tachycardie par réentrée intranodale (chapitre I47). L’angoisse accompagne l’arythmie ; elle ne l’explique pas.</p></div></div>
<h3>5.4 Diagnostic différentiel d’une palpitation, par gravité</h3>
<table class="t"><tr><th>Gravité</th><th>Diagnostic</th><th>Indice qui oriente</th><th>Premier examen</th></tr>
<tr><td>Menace vitale</td><td>Tachycardie ventriculaire, fibrillation auriculaire pré-excitée, TVPC, QT long</td><td>Syncope, effort, cardiopathie, mort subite familiale, ECG de base anormal</td><td>ECG immédiat, monitorage, avis cardiologique urgent</td></tr>
<tr><td>Menace fonctionnelle</td><td>ESV fréquentes avec cardiomyopathie induite ; fibrillation auriculaire ; flutter</td><td>Dyspnée, baisse de tolérance à l’effort, pouls irrégulier</td><td>ECG, Holter, échocardiographie</td></tr>
<tr><td>Gêne sans menace</td><td>ESA et ESV isolées sur cœur sain ; tachycardie par réentrée intranodale ou par voie accessoire cachée</td><td>« Raté puis coup » ; début et fin brutaux, rythme régulier</td><td>ECG pendant le symptôme, enregistreur adapté à la fréquence</td></tr>
<tr><td>Cause extracardiaque</td><td>Hyperthyroïdie, anémie, fièvre, hypovolémie, phéochromocytome, médicaments, substances</td><td>Contexte, examen clinique</td><td><button class="w" data-k="i49-bilan-bio">TSH, hémogramme, ionogramme</button> ; métanéphrines si poussées</td></tr>
<tr><td>Trouble de la régulation</td><td>POTS, tachycardie sinusale inappropriée, hypotension orthostatique</td><td>Lien avec la station debout ; fréquence de repos</td><td>Test d’orthostatisme actif, Holter</td></tr>
<tr><td>Diagnostic d’exclusion</td><td>Trouble anxieux, trouble panique</td><td>Début progressif, fréquence modérée, contexte émotionnel</td><td>Seulement après un ECG pendant le symptôme</td></tr></table>
<button class="pareto-btn ui" data-k="pareto-i49-anam">▲ Loi de Pareto — Palpitations et anamnèse</button>
</section>

<section class="ilot" id="i49-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen cherche trois choses : une <b>cardiopathie</b>, une <b>cause générale</b> et, si les symptômes sont posturaux, une <b>réponse orthostatique anormale</b>. Il se fait dans l’ordre : état général → signes vitaux complets → anthropométrie → signes ciblés.</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Pâleur, sueurs, tremblement, anxiété observable. Fréquence mesurée <b>au pouls et à l’auscultation</b> pendant une minute, régularité ; pression artérielle aux deux bras ; fréquence respiratoire ; saturation ; température. Poids, taille et indice de masse corporelle : l’obésité s’associe aux apnées du sommeil et à la fibrillation auriculaire, la maigreur récente à l’hyperthyroïdie et au déconditionnement. Chez tout patient dont les symptômes surviennent debout, on mesure la fréquence et la pression couché puis debout : <button class="w" data-k="i49-standing">test d’orthostatisme actif de 10 minutes (technique et lecture)</button>.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Rythme et pouls</b><ul><li><button class="w" data-k="i49-e-pouls">Pouls irrégulier et déficit de pouls</button></li><li><button class="w" data-k="i47-e-canon">Ondes a en canon au pouls jugulaire</button></li><li>Pouls qui s’accélère progressivement à l’orthostatisme</li></ul></div>
<div><b>Cardiopathie</b><ul><li><button class="w" data-k="i49-e-auscult">Auscultation : clic méso-systolique, souffle, galop</button></li><li>Signes d’insuffisance cardiaque (turgescence jugulaire, œdèmes, crépitants)</li><li>Choc de pointe dévié (dilatation)</li></ul></div>
<div><b>Cause générale</b><ul><li><button class="w" data-k="i48-e-thyr">Signes d’hyperthyroïdie</button></li><li>Pâleur conjonctivale (anémie)</li><li>Stigmates d’alcoolisme, de consommation de stimulants</li></ul></div>
<div><b>Terrain du syndrome orthostatique</b><ul><li><button class="w" data-k="i49-e-hypermob">Hypermobilité articulaire (score de Beighton)</button></li><li>Acrocyanose des membres inférieurs debout</li><li>Signes de déshydratation, de dénutrition</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Un examen normal n’exclut ni une cardiomyopathie débutante ni une canalopathie. Une canalopathie ne modifie que les canaux ioniques et ne laisse aucun signe physique ; une cardiomyopathie ne produit souffle, galop ou choc de pointe dévié qu’une fois la cavité dilatée, la paroi épaissie ou la fonction altérée. C’est l’ECG et, selon le contexte, l’échocardiographie qui cherchent la cardiopathie ; l’examen clinique oriente, il ne rassure pas à lui seul.</div>
<button class="pareto-btn ui" data-k="pareto-i49-clin">▲ Loi de Pareto — Examen clinique</button>
</section>

<section class="ilot" id="i49-7"><h2><span class="n">7</span>Lecture de l’ECG des extrasystoles</h2>
<p>La lecture suit toujours la même séquence de cinq questions : <b>prématuré ou tardif ? P prématurée devant ? QRS fin ou large ? pause compensatrice ou non ? une ou plusieurs morphologies ?</b> Chaque réponse restreint le diagnostic.</p>

<h3>7.1 Extrasystole auriculaire</h3>
<p>L’onde P′ arrive trop tôt et diffère de la P sinusale. Elle se cache souvent dans l’onde T précédente, qu’elle déforme : il faut comparer les ondes T entre elles. Plus l’ESA est précoce, plus sa conduction est difficile. Elle peut être conduite normalement, <b>conduite avec aberration</b> (QRS large, en retard droit le plus souvent) ou <b>bloquée</b> (P′ sans QRS). La fiche <button class="w" data-k="i49-ecg-esa">lecture d’une extrasystole auriculaire (conduite, aberrante, bloquée)</button> détaille ces trois issues.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Prendre un bigéminisme auriculaire bloqué pour une bradycardie sinusale ou un bloc de Mobitz II. L’onde P′ bloquée arrive en avance et déforme l’onde T. Voir les <button class="w" data-k="i44-pseudo">fausses pauses et faux blocs (chapitre I44)</button>.</div>
<h3>7.2 Extrasystole jonctionnelle</h3>
<p>QRS fin prématuré, identique au QRS sinusal, avec une onde P rétrograde négative dans les dérivations inférieures, située juste avant le QRS avec un PR court (&lt; 120 ms), cachée dans le QRS ou juste après lui (<button class="w" data-k="i49-ecg-esj">extrasystole jonctionnelle : position de l’onde P rétrograde</button>).</p>
<h3>7.3 Extrasystole ventriculaire</h3>
<p>Le QRS est prématuré et généralement large (≥ 120 ms, souvent 140 à 160 ms), sans P prématurée devant ; le segment ST et l’onde T ont une polarité opposée à la déflexion principale du QRS, et la pause est compensatrice. L’onde T est opposée parce que la repolarisation suit l’ordre, devenu lent, de l’activation : les régions dépolarisées les premières se repolarisent les premières. Cette anomalie de la repolarisation est secondaire ; elle ne signe pas une ischémie. On mesure ensuite trois paramètres : la <b>morphologie</b> (retard gauche ou retard droit en V1, axe), qui localise l’origine (îlot 8), l’<button class="w" data-k="i49-couplage">intervalle de couplage (fixe, variable, court)</button>, qui renseigne sur le mécanisme, et la <b>durée du QRS extrasystolique</b>, qui renseigne sur le myocarde traversé. Voir la <button class="w" data-k="i49-ecg-esv">fiche de lecture d’une ESV (morphologie, fusion, interpolation)</button>.</p>

<div class="key"><b>Corrélation électrophysiologie → ECG.</b> Le QRS de l’ESV est large parce que l’influx se propage de cellule à cellule dans le myocarde de travail, lentement, au lieu d’emprunter le réseau de Purkinje, rapide. Plus le QRS extrasystolique est large (au-delà d’environ 150 ms), plus le myocarde traversé est lent, malade, ou l’origine épicardique. C’est un indice de substrat et de risque de cardiomyopathie induite : chez 294 patients adressés pour ablation, la largeur du QRS extrasystolique s’associait à la cardiomyopathie indépendamment de la charge, et au-delà de 150 ms la cardiomyopathie apparaissait pour une charge plus faible (22 % contre 28 % ; Yokokawa et al., 2012). Une activation plus lente désynchronise probablement davantage la contraction.</div>

<section class="ilot" id="i49-8"><h2><span class="n">8</span>Localiser l’origine d’une extrasystole ventriculaire</h2>
<p>L’ECG à 12 dérivations d’une ESV permet de prédire son origine avant toute exploration et d’en tirer trois conséquences : la probabilité que l’ESV soit idiopathique, la chance de succès de l’ablation, et son risque (proximité d’une artère coronaire ou du faisceau de His). Les ESV idiopathiques naissent surtout dans les <b>chambres de chasse</b> (infundibulums) : environ deux tiers dans la chambre de chasse droite, le reste dans la chambre de chasse gauche, les cuspides aortiques et le sommet du ventricule gauche.</p>
<h3>8.1 Première étape : l’axe et l’aspect en V1</h3>
<p>Un <b>axe inférieur</b> (QRS positifs dans DII, DIII et aVF) signe une origine haute, donc infundibulaire, car l’activation descend vers la pointe. Un <b>retard gauche</b> (QRS négatif en V1) signe une origine droite ou septale ; un <b>retard droit</b> (QRS positif en V1) signe une origine ventriculaire gauche. V1 regarde le cœur par l’avant et la droite : l’activation qui part du ventricule droit ou du septum s’en éloigne pour gagner la masse du ventricule gauche, alors que l’activation qui part du ventricule gauche se dirige vers elle. L’association retard gauche et axe inférieur est la signature des chambres de chasse.</p>
<h3>8.2 Deuxième étape : la transition précordiale</h3>
<p>La transition est la première dérivation précordiale où l’onde R devient au moins égale à l’onde S. Elle départage infundibulum droit et gauche, car la chambre de chasse droite est antérieure et à gauche de la chambre de chasse gauche.</p>

<tr><td>En V4 ou plus tard</td><td>Chambre de chasse droite</td><td>DI négatif ou isoélectrique : paroi antérieure et gauche ; DI positif : partie postérieure. DI compare le bras gauche au bras droit : un foyer situé à gauche dans l’infundibulum envoie l’activation vers la droite, loin du pôle positif de DI.</td></tr>
<tr><td>En V3</td><td>Droite ou gauche</td><td>Transition de l’ESV plus tardive que celle du rythme sinusal : droite ; plus précoce : gauche ; rapport de transition mesuré dans la deuxième dérivation précordiale [R/(R+S) de l’ESV divisé par R/(R+S) du rythme sinusal] ≥ 0,60 : chambre de chasse gauche (Betensky, 2011)</td></tr>
<tr><td>En V1–V2 ou avant</td><td>Cuspides aortiques, continuité mitro-aortique, chambre de chasse gauche</td><td>Dans V1–V2, durée de l’onde R ≥ 50 % du QRS ou rapport R/S ≥ 30 % : cuspides (Ouyang, 2002) ; aspect qR en V1 : continuité mitro-aortique</td></tr></table>
<h3>8.3 Troisième étape : les autres origines</h3>
<p>Les origines non infundibulaires sont moins souvent idiopathiques et imposent une recherche plus poussée de cardiopathie. Elles sont décrites dans les fiches <button class="w" data-k="i49-cuspides">cuspides aortiques et sommet du ventricule gauche</button>, <button class="w" data-k="i49-fasc">ESV fasciculaires (retard droit, QRS relativement fin)</button>, <button class="w" data-k="i49-anneaux">anneaux mitral et tricuspide, muscles papillaires</button> et <button class="w" data-k="i49-epicard">critères d’origine épicardique</button>. Les morphologies des tachycardies idiopathiques correspondantes sont résumées dans la fiche <button class="w" data-k="i47-ecg-tvidio">TV idiopathiques (chapitre I47)</button>.</p>
<div class="key"><b>Corrélation anatomie → thérapeutique.</b> La cuspide coronaire gauche contient l’ostium du tronc commun. Avant d’ablater une ESV cuspidienne, l’opérateur visualise les coronaires (angiographie ou échographie intracardiaque) et maintient une distance de sécurité. De même, une ESV issue du septum para-hisien expose à un bloc auriculoventriculaire. Prédire l’origine sur l’ECG permet d’informer le patient du rapport bénéfice-risque avant l’intervention.</div>
<div class="trap"><span class="k">Piège</span>Retard gauche et axe inférieur ne suffisent pas à affirmer une ESV idiopathique. La <button class="w" data-k="i42-arvc-tfc">cardiomyopathie arythmogène du ventricule droit</button> produit des ESV de morphologie voisine. Des ondes T négatives de V1 à V3 en rythme sinusal, une onde epsilon, plusieurs morphologies d’ESV ou un axe supérieur imposent une IRM avant de conclure. Ces signes traduisent une maladie du ventricule droit lui-même : la fibrose et l’infiltration graisseuse retardent la fin de l’activation (onde epsilon), modifient la repolarisation, créent plusieurs sorties et peuvent siéger hors de l’infundibulum, au corps ou à la pointe du ventricule (axe supérieur).</div>
