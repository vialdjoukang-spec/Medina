
<!-- ===== FENÊTRES PARETO I49 ===== -->
<template data-pop="pareto-i49-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="i49-1,i49-2"></p>
<ul><li>Extrasystole = prématurée ; échappement = tardif, de secours, à ne jamais supprimer.</li><li>ESA : P′ prématurée différente ; jonctionnelle : QRS fin, P rétrograde ; ESV : QRS large sans P prématurée, T opposée.</li><li>Bigéminisme, trigéminisme, doublet ; ≥ 3 ESV consécutives = TVNS.</li><li>Charge = ESV / battements totaux en 24 h (%).</li><li>I49.0 FV et flutter ventriculaires ; I49.1–I49.4 extrasystoles ; I49.5 maladie du sinus.</li><li>QRS large après cycle long–court avec P′ = aberration (Ashman), pas ESV.</li><li>Pronostic : le terrain, pas le nombre. ESV fréquentes = marqueur et parfois cause de dysfonction.</li><li>ESA ≥ 30/h ou salve ≥ 20 = chercher une fibrillation auriculaire.</li><li>POTS : femme de 15–50 ans, prévalence ≈ 0,2 %.</li></ul></template>

<template data-pop="pareto-i49-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i49-3"></p>
<ul><li>Mécanismes : activité déclenchée (post-dépolarisation tardive, AMPc, calcium : chambre de chasse, digoxine), automatisme anormal, microréentrée (couplage fixe), parasystolie (couplage variable).</li><li>ESV : sinus non remis à zéro → pause compensatrice (2 × RR) ; ESA : remise à zéro → non compensatrice.</li><li>Le patient sent la pause puis le battement potentialisé (remplissage + calcium).</li><li>ESV précoce = pas d’onde de pouls → déficit de pouls, fausse bradycardie.</li><li>ESV fréquentes → asynchronisme, calcium, énergie → cardiomyopathie réversible (pas de fibrose initiale).</li><li>R sur T dangereux seulement sur substrat (ischémie, QT long, cicatrice).</li></ul></template>

<template data-pop="pareto-i49-etio" data-title="Pareto — Étiologies et facteurs favorisants">
<p class="ratio" data-cover="i49-4"></p>
<ul><li>Deux questions : cardiopathie ? facteur corrigeable ?</li><li>Cardiopathies : ischémique, dilatée, hypertrophique, arythmogène du ventricule droit, sarcoïdose, myocardite, prolapsus mitral arythmogène.</li><li>Troubles électriques : TVPC, QT long, Brugada, FV idiopathique.</li><li>Corrigeables : K⁺, magnésium, thyroïde, alcool, stimulants, sympathomimétiques, digoxine, sommeil, apnées.</li><li>Café : effet modeste (CRAVE) ; pas d’interdiction systématique.</li><li>Bigéminisme récent chez un âgé sous diurétique : ionogramme, magnésium, digoxinémie d’abord.</li></ul></template>

<template data-pop="pareto-i49-anam" data-title="Pareto — Palpitations et anamnèse">
<p class="ratio" data-cover="i49-5"></p>
<ul><li>EHRA 2011 : extrasystolique, tachycardique, anxieuse, pulsatile ; anamnèse + ECG = diagnostic chez ≈ la moitié.</li><li>Six questions : début/fin, régularité (faire tapoter), fréquence, circonstances, symptômes associés, durée d’évolution.</li><li>« Raté puis coup » = extrasystole ; brutal, rapide, régulier = réentrée ; debout = orthostatisme.</li><li>Alerte : effort, syncope, cardiopathie, mort subite familiale.</li><li>Anxiété : diagnostic après ECG pendant le symptôme ; tachycardies souvent étiquetées « panique ».</li><li>ESV asymptomatiques à forte charge : diagnostic tardif de cardiomyopathie induite.</li><li>Différentiel par gravité : menace vitale (TV, fibrillation auriculaire pré-excitée, TVPC, QT long) → menace fonctionnelle (cardiomyopathie induite, fibrillation auriculaire) → gêne bénigne (ESA, ESV, réentrée) → cause extracardiaque → trouble de la régulation (POTS, tachycardie sinusale inappropriée) → anxiété en dernier.</li></ul></template>

<template data-pop="pareto-i49-clin" data-title="Pareto — Examen clinique">
<p class="ratio" data-cover="i49-6"></p>
<ul><li>Pouls et auscultation simultanés une minute : déficit de pouls.</li><li>Appareils automatiques trompeurs : ECG obligatoire.</li><li>Cardiopathie : clic (prolapsus), souffle variable debout (cardiomyopathie obstructive), galop, insuffisance cardiaque.</li><li>Causes : thyroïde, anémie, stimulants.</li><li>Symptômes posturaux : test actif de 10 min ; hypermobilité (Beighton).</li><li>Examen normal ≠ cœur sain : ECG ± échocardiographie.</li></ul></template>

<template data-pop="pareto-i49-ecg" data-title="Pareto — Lecture de l’ECG">
<p class="ratio" data-cover="i49-7"></p>
<ul><li>Cinq questions : prématuré ? P′ ? QRS fin ou large ? pause ? morphologies ?</li><li>ESA : P′ dans l’onde T précédente ; conduite, aberrante (retard droit) ou bloquée (fausse pause, faux Mobitz II).</li><li>Jonctionnelle : QRS fin, P négative inférieure avant (PR &lt; 120 ms), dans ou après le QRS.</li><li>ESV : QRS ≥ 120 ms, T opposée, pause compensatrice ; noter morphologie, couplage, durée du QRS.</li><li>QRS extrasystolique ≥ 150 ms : myocarde lent, origine épicardique, risque de cardiomyopathie.</li><li>Doublet polymorphe : substrat ; ≥ 3 = TVNS.</li></ul></template>

<template data-pop="pareto-i49-loc" data-title="Pareto — Localisation de l’origine">
<p class="ratio" data-cover="i49-8"></p>
<ul><li>Retard gauche + axe inférieur = chambres de chasse (≈ deux tiers droite).</li><li>Transition ≥ V4 : droite ; V1–V2 : cuspides ou gauche ; V3 : comparer au sinusal (plus tardive que le sinusal = droite).</li><li>Cuspides : R large ≥ 50 % ou R/S ≥ 30 % dans V1–V2 ; qR en V1 = continuité mitro-aortique.</li><li>Infundibulum droit : DI négatif = antérieur ; DI positif = postérieur.</li><li>Retard droit + QRS 120–140 ms + axe supérieur = fascicule postérieur (vérapamil, ablation).</li><li>Cuspide gauche : tronc commun (angiographie avant ablation) ; para-hisien : bloc.</li><li>T négatives V1–V3, epsilon, plusieurs morphologies, axe supérieur : IRM (cardiomyopathie arythmogène).</li></ul></template>

<template data-pop="pareto-i49-alerte" data-title="Pareto — Signes d’alerte et stratification">
<p class="ratio" data-cover="i49-9"></p>
<ul><li>MÉFIANTS : Morphologie atypique, Effort, Famille, Intervalle de couplage court, Anomalie cardiaque, Nombre (≥ 10 %), TVNS/doublets, Syncope.</li><li>ESV fréquentes ou symptomatiques : ECG sinusal, échocardiographie, Holter ; IRM si atypique (IIa, ESC 2022).</li><li>Suppression à l’effort = plutôt bénin ; apparition, polymorphisme, doublets = substrat ; ESV de récupération = pronostic péjoratif.</li><li>Exception : chambre de chasse droite monomorphe augmentée à l’effort modéré.</li><li>Couplage &lt; 300 ms + syncope : FV idiopathique possible → centre de rythmologie.</li></ul></template>

<template data-pop="pareto-i49-cmie" data-title="Pareto — Cardiomyopathie induite">
<p class="ratio" data-cover="i49-10"></p>
<ul><li>FEVG réduite inexpliquée + charge ≥ 10 % → l’évoquer (IIa) ; risque surtout &gt; 20 %.</li><li>Facteurs : QRS large, épicardique, non infundibulaire, interpolée, asymptomatique, longue durée.</li><li>IRM (IIa) : pas de cicatrice = récupération probable.</li><li>Ablation (I) ; antiarythmique si impossible (IIa, amiodarone ; pas de classe Ic) ; traitement de l’insuffisance cardiaque en parallèle.</li><li>Pas de défibrillateur de prévention primaire avant réévaluation (3–6 mois).</li><li>Resynchronisation limitée par les ESV : ablation ou antiarythmique (IIa). Asymptomatique, FEVG normale, charge &gt; 20 % persistante : ablation envisageable (IIb).</li><li>FEVG mesurée sur battements sinusaux.</li></ul></template>

<template data-pop="pareto-i49-tt" data-title="Pareto — Traitement des extrasystoles">
<p class="ratio" data-cover="i49-11"></p>
<ul><li>Objectifs : écarter le risque, protéger la FEVG, soulager. Asymptomatique, cœur sain, charge faible : aucun traitement.</li><li>Expliquer le mécanisme ; corriger les facteurs.</li><li>ESC 2022 : chambre de chasse droite ou fascicules symptomatiques → ablation (I) ; autres origines → bêtabloquant ou vérapamil/diltiazem (I), ablation ou flécaïnide (IIa) ; amiodarone en première intention (III).</li><li>Flécaïnide seulement sur cœur structurellement sain (CAST).</li><li>Sur cardiopathie : traiter la cardiopathie ; ne pas « abolir » les ESV ; défibrillateur selon la cardiopathie, pas le nombre d’ESV.</li><li>ESA : facteurs, bêtabloquant si gêne ; activité excessive → chercher une fibrillation auriculaire.</li><li>Holter à ≈ 3 mois ; QRS sous flécaïnide.</li></ul></template>

<template data-pop="pareto-i49-fv" data-title="Pareto — Fibrillation et flutter ventriculaires">
<p class="ratio" data-cover="i49-12"></p>
<ul><li>FV = arrêt : 144, compressions 100–120/min, 5–6 cm, 30:2, défibrillateur.</li><li>FV : ondulations irrégulières ; flutter ventriculaire : sinusoïde régulière ≈ 300/min ; artefacts et FV fine à distinguer.</li><li>Choc non synchronisé biphasique ≥ 150 J, puis 2 min de compressions ; jusqu’à 3 chocs d’emblée si arrêt monitoré devant témoin.</li><li>Adrénaline 1 mg après le 3e choc puis toutes les 3–5 min ; amiodarone 300 mg (3e choc) puis 150 mg (5e) ; lidocaïne 100 puis 50 mg.</li><li>Réfractaire : vecteur antéropostérieur ; causes réversibles.</li><li>Après retour de la circulation : coronarographie si sus-décalage du ST, prévention de la fièvre, bilan étiologique ; défibrillateur si pas de cause réversible (I).</li><li>Causes : ischémie aiguë d’abord ; commotio cordis chez le jeune sportif.</li></ul></template>

<template data-pop="pareto-i49-echap" data-title="Pareto — Échappements et maladie du sinus">
<p class="ratio" data-cover="i49-13"></p>
<ul><li>Échappement jonctionnel 40–60/min QRS fin ; ventriculaire 20–40/min QRS large, instable.</li><li>Ne jamais supprimer un échappement (pas de lidocaïne, pas d’amiodarone) : traiter la cause, stimuler.</li><li>Rythme idioventriculaire accéléré 50–110/min : reperfusion, bénin, pas d’antiarythmique.</li><li>Rythme jonctionnel accéléré : digoxine, chirurgie, infarctus inférieur ; FA qui se régularise sous digoxine = intoxication.</li><li>Pacemaker migrant &lt; 100/min bénin ; &gt; 100/min = tachycardie atriale multifocale.</li><li>Maladie du sinus : palpitations puis syncope = pause de fin d’accès ; stimulation (I) pour permettre le traitement ; anticoagulation selon CHA₂DS₂-VA.</li></ul></template>

<template data-pop="pareto-i49-pots" data-title="Pareto — Syndrome de tachycardie orthostatique posturale">
<p class="ratio" data-cover="i49-14"></p>
<ul><li>Critères HRS 2015 : + ≥ 30/min en 10 min debout (≥ 40/min de 12 à 19 ans), pas d’hypotension orthostatique, symptômes chroniques (≥ 3 mois) sans autre cause.</li><li>Mécanismes : hypovolémie, neuropathie, hyperadrénergie, déconditionnement (« petit cœur ») ; la tachycardie compense.</li><li>Terrain : femme jeune, après infection virale ou COVID-19, hypermobilité.</li><li>Diagnostic : test actif de 10 min ; inclinaison si doute ; ECG, hémogramme, TSH ; diagnostic d’exclusion.</li><li>Traitement : éducation ; entraînement progressif débuté couché (IIa) ; eau 2–3 L et sel 10–12 g (IIb) ; compression ; médicaments IIb (propranolol faible dose, midodrine, fludrocortisone, pyridostigmine) ; ivabradine (essai randomisé).</li><li>Non : sérum physiologique au long cours, ablation du nœud sinusal (III).</li><li>Tachycardie sinusale inappropriée : repos &gt; 100/min, moyenne sur 24 heures &gt; 90/min, présente couché ; ivabradine seule ou avec un bêtabloquant (IIa, ESC 2019) ; pas d’ablation de routine.</li></ul></template>

<template data-pop="pareto-i49-suivi" data-title="Pareto — Suivi, sport et conduite">
<p class="ratio" data-cover="i49-15"></p>
<ul><li>Charge ≥ 10 % : échocardiographie et Holter périodiques. Après ablation : Holter à 3 mois ; échocardiographie à 3 et 6 mois si FEVG réduite.</li><li>Athlète : ≥ 2 ESV sur ECG de repos → Holter, échocardiographie, épreuve d’effort ; IRM si atypique ou complexe ; morphologie habituelle sans cardiopathie → tous les sports.</li><li>POTS : l’exercice est un traitement.</li><li>Conduite (SSC/SSML 2024) : ESV apte (deux groupes) ; TVNS asymptomatique : apte / évaluation individuelle ; TV idiopathique : 4 semaines après traitement efficace ; FV idiopathique : règles du défibrillateur / inapte.</li><li>Sinus : asymptomatique apte (second groupe si pauses &lt; 6 s) ; symptomatique : après stimulateur.</li><li>Syncope réflexe récidivante : 1 mois / évaluation individuelle ≥ 3 mois. POTS non mentionné : analogie avec la syncope réflexe.</li></ul></template>

<template data-pop="pareto-i49-part" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="i49-16"></p>
<ul><li>Grossesse : rassurer ; β1-sélectif (métoprolol, bisoprolol), pas d’aténolol ; ablation après l’accouchement ; arrêt : utérus à gauche, césarienne si pas de retour de circulation à 4 min.</li><li>Sujet âgé : ESV = cardiopathie plus probable ; électrolytes, digoxine.</li><li>Rein : flécaïnide réduite, sotalol évité. Foie : propafénone, propranolol, vérapamil, diltiazem réduits.</li><li>Enfant : ESV monomorphes souvent transitoires ; syncope d’effort = TVPC, QT long.</li><li>Psychiatrie : exclure une arythmie avant de conclure à l’anxiété ; psychotropes (tachycardie, QT, myocardite à la clozapine) ; flécaïnide et inhibiteurs du CYP2D6.</li><li>Cas type : charge 26 % + FEVG 38 % + IRM sans cicatrice → ablation, traitement de l’insuffisance cardiaque, pas de défibrillateur avant réévaluation.</li></ul></template>

<template data-pop="pareto-i49-ecgex" data-title="Pareto — ECG à 12 dérivations">
<p class="ratio" data-cover="i49-e-2"></p>
<ul><li>Normes : PR 120–200 ms ; QRS &lt; 110 ms ; QTc &lt; 450 (homme) / &lt; 460 ms (femme) ; axe −30° à +90°.</li><li>Tableau ESA / jonctionnelle / ESV : P′, QRS, T, pause, variante piège (bloquée, cachée, fusion).</li><li>ESA aberrante : P′ devant, rSR′ en V1 typique, cycle long–court ; ESV : pas de P, R monophasique ou qR en V1, pause compensatrice.</li><li>Rythme de base : Q, T négatives V1–V3, epsilon, QT, Brugada, pré-excitation, bloc, bas voltage.</li></ul></template>

<template data-pop="pareto-i49-holter" data-title="Pareto — Enregistrements ambulatoires">
<p class="ratio" data-cover="i49-e-3"></p>
<ul><li>Durée selon la fréquence des symptômes : quotidien → Holter ; hebdomadaire → patch, enregistreur d’événements ; rare et grave → moniteur implantable.</li><li>≈ 100 000 battements/24 h ; sujet sain &lt; 1 % d’ESV ; &gt; 500/24 h = critère mineur de cardiomyopathie arythmogène ; athlète ≥ 2 000/24 h = bilan poussé ; ≥ 10 % = risque de cardiomyopathie induite.</li><li>Polymorphisme, doublets, TVNS, dépendance à la fréquence : à relever.</li><li>ESA ≥ 30/h : fibrillation auriculaire à chercher.</li><li>Charge variable d’un jour à l’autre : enregistrer 7 jours si limite.</li><li>Montre : repérage ; ECG à une dérivation ≥ 30 s relu par un médecin.</li></ul></template>

<template data-pop="pareto-i49-imag" data-title="Pareto — Effort, orthostatisme et imagerie">
<p class="ratio" data-cover="i49-e-4,i49-e-5"></p>
<ul><li>Effort : suppression rassurante ; apparition, polymorphisme, doublets = substrat ; ESV de récupération = pronostic péjoratif ; TV bidirectionnelle = TVPC.</li><li>Test actif : 5 min couché, 10 min debout, mesures à 1, 3, 5, 10 min ; POTS ≥ + 30/min sans chute ; hypotension orthostatique ≥ 20/10 mmHg en 3 min.</li><li>Échocardiographie : FEVG sur battements sinusaux ; diamètre télédiastolique ≤ 58 / 52 mm ; strain ; prolapsus avec disjonction.</li><li>IRM : référence du substrat ; IIa si atypique ou cardiomyopathie induite suspectée.</li><li>Configurations : chambre de chasse bénigne, cardiomyopathie induite, cardiomyopathie arythmogène, prolapsus arythmogène, sarcoïdose, ischémie, digoxine, TVPC.</li></ul></template>

<template data-pop="pareto-i49-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i49-e-1,i49-e-2,i49-e-3,i49-e-4,i49-e-5,i49-e-6,i49-e-7"></p>
<ul><li>Références : ECG pendant le symptôme (palpitations) ; Holter (charge) ; IRM (substrat) ; test d’orthostatisme ou d’inclinaison (réponse orthostatique) ; cartographie (localisation).</li><li>Tous : ECG, K⁺, magnésium, TSH, hémogramme. ESV fréquentes, symptômes ou alerte : échocardiographie + Holter.</li><li>Charge ≥ 10 % : suivi de la FEVG ; &gt; 20 % : risque élevé.</li><li>IRM si atypique ou FEVG réduite.</li><li>Corriger le magnésium en même temps que le potassium ; digoxinémie si traitement.</li><li>Ablation : ESV nécessaires le jour de l’intervention ; activation la plus précoce et cartographie par stimulation.</li></ul></template>

<template data-pop="pareto-i49-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i49-sa,i49-sh,i49-sp,i49-sv,i49-sb"></p>
<ul><li>Infundibulum droit antérieur et à gauche de la racine aortique → transition tardive ; cuspide gauche postérieure → R précoce ; tronc commun sur la cuspide gauche ; continuité mitro-aortique.</li><li>Purkinje : conduction 2–4 m/s (myocarde ≈ 0,5) → ESV large hors Purkinje, fasciculaire plus fine ; propension aux post-dépolarisations.</li><li>Chambres de chasse issues du second champ cardiaque ; manchons myocardiques au-dessus des valves.</li><li>Conduction cachée dans la jonction → pause compensatrice ; interpolation si sinus lent.</li><li>Période vulnérable = dispersion de la réfractarité → R sur T, commotio cordis.</li><li>Orthostatisme : 500–1 000 mL dans les jambes → baroréflexe ; POTS = compensation excessive d’un volume d’éjection bas.</li><li>β1 → Gs → AMPc → protéine kinase A → canal L, réticulum chargé → libération spontanée (<i>RYR2</i>) → échangeur Na⁺/Ca²⁺ → post-dépolarisation tardive. Cibles : bêtabloquant, vérapamil, adénosine (Gi), flécaïnide. Digoxine → surcharge calcique.</li></ul></template>

<template data-pop="pareto-i49-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i49-p-1,i49-p-2,i49-p-3,i49-p-4,i49-p-5"></p>
<ul><li>Trois objectifs : confort, fonction ventriculaire, survie immédiate ; plus le POTS.</li><li>Doses : bisoprolol 1,25–10 mg ; métoprolol succinate 25–200 mg ; vérapamil 120–480 mg ; diltiazem 120–360 mg ; flécaïnide 50–150 mg × 2 ; propafénone 150–300 mg × 3.</li><li>Arrêt : adrénaline 1 mg ; amiodarone 300 puis 150 mg ; lidocaïne 100 puis 50 mg.</li><li>POTS : propranolol 10–20 mg ; midodrine 2,5–10 mg × 3 (pas avant le coucher) ; fludrocortisone 0,05–0,2 mg (K⁺) ; pyridostigmine 30–60 mg ; ivabradine 2,5–7,5 mg × 2 (contraception).</li><li>Interactions : vérapamil/diltiazem + bêtabloquant ; classe Ic + inhibiteurs du CYP2D6 (fluoxétine, paroxétine, bupropion) ; classe Ic sans freinateur si arythmie auriculaire ; amiodarone + digoxine, antivitamine K ; ivabradine + vérapamil, diltiazem, CYP3A4.</li><li>À éviter : classe Ic sur cardiopathie ou Brugada ; antiarythmique sur un échappement ; bêtabloquant à forte dose et diurétiques dans le POTS ; vérapamil intraveineux devant des QRS larges.</li></ul></template>
