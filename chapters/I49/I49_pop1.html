
<!-- ===== FENÊTRES I49 : définitions, épidémiologie, physiopathologie, anamnèse, examen ===== -->
<template data-pop="i49-termino" data-title="Vocabulaire des extrasystoles">
<div class="lab">Répétition</div><p><b>Isolée</b> : une extrasystole entourée de battements sinusaux. <b>Bigéminisme</b> : une extrasystole après chaque battement sinusal. <b>Trigéminisme</b> : une extrasystole tous les trois battements (deux sinusaux, une extrasystole). <b>Doublet</b> (couplet) : deux extrasystoles consécutives. <b>Salve</b> : trois ou plus ; à plus de 100/min, une salve ventriculaire est une TV, non soutenue si elle cesse spontanément en moins de 30 secondes.</p>
<div class="lab">Forme</div><p><b>Monomorphes</b> : une seule morphologie, évoquant une origine ou une sortie dominante ; cela ne prouve pas un foyer unique. <b>Polymorphes</b> (ou multiformes) : plusieurs morphologies, donc plusieurs foyers ou plusieurs sorties d’un circuit ; plus souvent associées à une cardiopathie.</p>
<div class="lab">Moment</div><p><b>Interpolée</b> : ESV glissée entre deux battements sinusaux sans pause, possible quand la fréquence sinusale est lente. <b>R sur T</b> : ESV dont le QRS tombe sur l’onde T précédente, pendant la période vulnérable.</p>
<div class="lab">Charge</div><p>Nombre d’extrasystoles divisé par le nombre total de battements sur la durée d’enregistrement, en pour cent. Exemple : 25 000 ESV sur 100 000 battements = 25 %.</p>
<div class="lab">Classification de Lown</div><p>Classement historique (1971) des ESV après infarctus selon leur nombre et leur complexité. Il n’a plus de valeur décisionnelle : c’est le substrat, et non le grade, qui fait le pronostic.</p>
<div class="lab">Pourquoi une ESV peut être interpolée</div><p>Après une ESV, le nœud auriculoventriculaire et les ventricules ont besoin d’un délai pour redevenir excitables. Quand le rythme sinusal est lent, l’onde P suivante arrive après ce délai et se conduit : l’ESV s’intercale sans pause. Le PR de ce battement s’allonge, car l’ESV a pénétré le nœud par voie rétrograde et l’a laissé partiellement réfractaire. Une ESV interpolée ajoute donc un battement au lieu d’en remplacer un.</p>
<div class="lab">Pourquoi les ESV polymorphes inquiètent</div><p>Des foyers ou des sorties multiples sont rares dans un myocarde sain ; ils sont fréquents quand une cicatrice ou une fibrose fragmente la conduction. Des ESV polymorphes font donc rechercher une cardiopathie, IRM comprise si l’échocardiographie est normale (classe IIa, <a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">ESC 2022</a>).</p>
<div class="lab">Pourquoi la classification de Lown a été abandonnée</div><p>Elle reposait sur l’idée que les ESV les plus complexes annoncent la FV et qu’il faut les supprimer. L’essai CAST a montré l’inverse : supprimer les ESV après un infarctus par la flécaïnide ou l’encaïnide a augmenté la mortalité arythmique. Le pronostic dépend du substrat, apprécié par la FEVG, la cicatrice et la cardiopathie, et non du grade des ESV.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/4104697/" target="_blank" rel="noopener">Lown et Wolf, Approaches to sudden death from coronary heart disease, Circulation 1971;44:130-142</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/1900101/" target="_blank" rel="noopener">Echt et al., Mortality and morbidity in patients receiving encainide, flecainide, or placebo, N Engl J Med 1991;324:781-788</a> ; <a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">Zeppenfeld et al., ESC 2022</a>, tableau 26 des recommandations.</p>
</template>

<template data-pop="i49-parasyst" data-title="Parasystolie">
<div class="lab">Mécanisme</div><p>Un foyer ectopique automatique est entouré d’une zone de <b>bloc d’entrée</b> : les dépolarisations sinusales ne l’atteignent pas et ne le remettent pas à zéro. Il décharge à son propre rythme, et ses influx sortent chaque fois que le myocarde environnant est excitable.</p>
<div class="lab">Critères ECG</div><p>1. Intervalles de couplage variables (plus de 80 ms de variation environ). 2. Intervalles entre ectopiques qui sont des multiples d’un même cycle de base. 3. Complexes de fusion, quand le foyer et le sinus activent le ventricule en même temps.</p>
<div class="lab">Portée clinique</div><p>Le plus souvent bénigne ; parfois observée sur cardiopathie ou avec la digoxine. Sa reconnaissance évite de prendre une variation du couplage pour un signe de gravité.</p></template>


<template data-pop="i49-epi" data-title="Épidémiologie des extrasystoles">
<div class="lab">ECG standard</div><p>Sur un ECG de 10 secondes, des ESV sont vues chez environ 1 % des adultes sans cardiopathie connue, davantage après 60 ans.</p>
<div class="lab">Holter</div><p>Sur 24 à 48 heures, des ESV sont trouvées chez une majorité d’adultes, le plus souvent en petit nombre. Des ESA sont présentes chez presque tous les sujets âgés.</p>
<div class="lab">Facteurs associés</div><p>Âge, sexe masculin, taille et masse corporelle, hypertension, cardiopathie ischémique, insuffisance cardiaque, hypokaliémie, sédentarité.</p>
<div class="lab">Palpitations</div><p>Motif fréquent de consultation en médecine de premier recours et deuxième motif d’avis cardiologique après la douleur thoracique. Dans les séries citées par l’<a href="https://doi.org/10.1093/europace/eur130" target="_blank" rel="noopener">EHRA (2011)</a>, environ 40 % des palpitations ont une cause cardiaque, le plus souvent rythmique, et environ 30 % une cause psychique, le reste se partageant entre causes systémiques, médicamenteuses et structurelles, avec environ 16 % sans cause trouvée.</p>
<div class="lab">Pourquoi ces facteurs s’associent aux ESV</div><p>Dans la cohorte conduite par l’Hôpital universitaire de Bâle (<a href="https://pubmed.ncbi.nlm.nih.gov/27798051/" target="_blank" rel="noopener">von Rotz et al., 2017</a>), la fréquence des ESV augmentait avec l’indice de Sokolow-Lyon, marqueur d’hypertrophie ventriculaire gauche, avec le NT-proBNP, libéré quand la paroi ventriculaire est étirée, avec le rapport entre tour de taille et tour de hanches, et avec la stature ; elle diminuait avec l’activité physique et avec l’hémoglobine. Ces associations suggèrent que l’hypertrophie et l’étirement des myocytes favorisent l’excitabilité ectopique. Elles ne prouvent pas une causalité : une cardiopathie débutante peut produire à la fois des ESV et ces marqueurs.</p>
<div class="lab">Pronostic des palpitations</div><p>Dans la cohorte prospective de 190 patients d’où viennent ces proportions (<a href="https://pubmed.ncbi.nlm.nih.gov/8629647/" target="_blank" rel="noopener">Weber et Kapoor, 1996</a>), la mortalité à un an était de 1,6 %, mais 75 % des patients avaient de nouveau des palpitations dans l’année : le pronostic vital est bon, alors que la gêne dure.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/27798051/" target="_blank" rel="noopener">von Rotz et al., Risk factors for premature ventricular contractions in young and healthy adults, Heart 2017;103:702-707</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8629647/" target="_blank" rel="noopener">Weber et Kapoor, Evaluation and outcomes of patients with palpitations, Am J Med 1996;100:138-148</a>.</p>
</template>

<template data-pop="i49-prono" data-title="Données pronostiques des cohortes">
<div class="lab">Cohortes de population</div><p>Dans l’étude ARIC, la présence d’ESV sur un ECG de 2 minutes s’associait à un risque accru de mort subite et de décès cardiovasculaire. Dans la Cardiovascular Health Study, une fréquence plus élevée d’ESV au Holter s’associait à une baisse de la FEVG sur cinq ans, à l’insuffisance cardiaque et à la mortalité.</p>
<div class="lab">Interprétation</div><p>Ces associations ne prouvent pas que les ESV tuent. Elles traduisent souvent une cardiopathie infraclinique (ischémie, hypertrophie, fibrose). Une partie du risque peut cependant être causale, par le mécanisme de la cardiomyopathie induite.</p>
<div class="lab">Conséquence pratique</div><p>Des ESV fréquentes justifient de chercher une cardiopathie et de surveiller la FEVG, même chez un patient asymptomatique ; elles ne justifient pas, en soi, un antiarythmique.</p>
<div class="lab">Ce que mesurent les cohortes</div><p>Dans ARIC, chez 14 574 adultes sans coronaropathie connue, des ESV sur un tracé de 2 minutes s’associaient à un risque ultérieur de mort subite environ deux fois plus élevé (rapport de risque 2,09), alors que des ESA seules ne s’y associaient pas (<a href="https://pubmed.ncbi.nlm.nih.gov/21211594/" target="_blank" rel="noopener">Cheriyath et al., 2011</a>). Dans la Cardiovascular Health Study, chez 1 139 participants à FEVG normale, le quart qui avait le plus d’ESV au Holter avait, par rapport au quart qui en avait le moins, une baisse de la FEVG à cinq ans plus fréquente (rapport de cotes 3,1), un risque d’insuffisance cardiaque accru de 48 % et un risque de décès accru de 31 %, sur un suivi médian de plus de 13 ans (<a href="https://pubmed.ncbi.nlm.nih.gov/26160626/" target="_blank" rel="noopener">Dukes et al., 2015</a>).</p>
<div class="lab">Ce qui plaide pour une part causale</div><p>Ces études restent des associations ajustées. L’argument causal vient d’ailleurs : la FEVG remonte quand on supprime des ESV fréquentes, et un modèle animal reproduit la dysfonction par des ESV seules.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/21211594/" target="_blank" rel="noopener">Cheriyath et al., Relation of atrial and/or ventricular premature complexes on a two-minute rhythm strip to the risk of sudden cardiac death (ARIC), Am J Cardiol 2011;107:151-155</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26160626/" target="_blank" rel="noopener">Dukes et al., Ventricular ectopy as a predictor of heart failure and death, J Am Coll Cardiol 2015;66:101-109</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21576277/" target="_blank" rel="noopener">Huizar et al., Circ Arrhythm Electrophysiol 2011;4:543-549</a>.</p>
</template>

<template data-pop="i49-essa" data-title="Activité ectopique supraventriculaire excessive">
<div class="lab">Définition</div><p>Au moins 30 ESA par heure en moyenne, ou salve d’au moins 20 battements supraventriculaires, sur un Holter (Copenhagen Holter Study, <a href="https://pubmed.ncbi.nlm.nih.gov/20404258/" target="_blank" rel="noopener">Binici et coll., 2010</a>).</p>
<div class="lab">Signification</div><p>Marqueur d’une cardiomyopathie auriculaire : risque accru de fibrillation auriculaire, d’accident vasculaire cérébral et de décès.</p>
<div class="lab">Conduite</div><p>Rechercher une fibrillation auriculaire par un monitorage plus long, contrôler la pression artérielle, le poids, les apnées du sommeil et l’alcool. Une anticoagulation n’est pas indiquée sur la seule activité ectopique ; elle se décide si une fibrillation auriculaire est documentée (chapitre I48).</p>
<div class="lab">Ce que montre l’étude de Copenhague</div><p>Chez 678 sujets de 55 à 75 ans sans maladie cardiovasculaire, suivis 6,3 ans en médiane après un Holter de 48 heures, 14,6 % avaient une activité ectopique excessive. Après ajustement sur les facteurs de risque, elle s’associait à davantage d’hospitalisations pour fibrillation auriculaire (rapport de risque 2,78), d’accidents vasculaires cérébraux (2,79) et de décès ou d’accidents vasculaires cérébraux (1,64).</p>
<div class="lab">Mécanismes discutés</div><p>Deux explications non exclusives sont avancées. Les ESA, en particulier celles des veines pulmonaires, peuvent déclencher la fibrillation auriculaire (<a href="https://pubmed.ncbi.nlm.nih.gov/9725923/" target="_blank" rel="noopener">Haïssaguerre et al., 1998</a>). Leur abondance peut aussi traduire une maladie du myocarde auriculaire, fibrose et dilatation, qui favorise à la fois la fibrillation et les thrombus ; une partie du risque d’accident vasculaire cérébral pourrait venir d’accès de fibrillation non détectés. Aucun essai n’a montré que supprimer les ESA protège : on ne les traite pas pour ce seul motif.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/20404258/" target="_blank" rel="noopener">Binici et al., Excessive supraventricular ectopic activity and increased risk of atrial fibrillation and stroke, Circulation 2010;121:1904-1911</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9725923/" target="_blank" rel="noopener">Haïssaguerre et al., Spontaneous initiation of atrial fibrillation by ectopic beats originating in the pulmonary veins, N Engl J Med 1998;339:659-666</a>.</p>
</template>

<template data-pop="i49-pause" data-title="Pause compensatrice">
<div class="lab">Définition</div><p>Intervalle entre le battement sinusal qui précède l’extrasystole et celui qui la suit, égal à deux cycles sinusaux (2 × RR).</p>
<div class="lab">Mesure</div><p>Mesurer un RR sinusal de base, puis l’intervalle qui encadre l’extrasystole ; comparer. Utiliser un compas ou un papier, sur plusieurs cycles, car l’arythmie sinusale respiratoire fausse la mesure.</p>
<div class="lab">Règle</div><p>ESV : pause compensatrice, car le nœud sinusal n’est pas remis à zéro. ESA : pause non compensatrice (moins de 2 × RR), car l’ESA pénètre et réinitialise le nœud sinusal.</p>
<div class="lab">Exceptions</div><p>ESV interpolée : aucune pause. ESV à conduction rétrograde jusqu’aux oreillettes : pause non compensatrice. ESA très précoce qui ne pénètre pas le nœud sinusal : pause parfois compensatrice. La pause oriente ; la morphologie et l’onde P tranchent.</p></template>

<template data-pop="i49-potent" data-title="Potentialisation post-extrasystolique">
<div class="lab">Observation</div><p>Le battement qui suit une extrasystole est plus puissant que les battements sinusaux habituels.</p>
<div class="lab">Mécanismes</div><p>1. Remplissage prolongé pendant la pause : volume télédiastolique accru (loi de Frank-Starling). 2. Surcharge calcique du réticulum sarcoplasmique pendant l’intervalle long : plus de calcium libéré au battement suivant. 3. Postcharge plus basse, car la pression aortique a baissé pendant la pause.</p>
<div class="lab">Corrélations cliniques</div><p>Sensation de « coup » dans la poitrine ou la gorge ; onde de pouls plus ample après le « trou » ; au cathétérisme, augmentation du gradient dans la cardiomyopathie hypertrophique obstructive (signe de Brockenbrough-Braunwald-Morrow) ; en échocardiographie de stress, la contractilité post-extrasystolique révèle un myocarde viable.</p></template>

<template data-pop="i49-cmie-meca" data-title="Mécanismes de la cardiomyopathie induite par les extrasystoles">
<div class="lab">Asynchronisme</div><p>Chaque ESV active le ventricule comme un bloc de branche : contraction segmentaire décalée, travail inefficace, insuffisance mitrale fonctionnelle.</p>
<div class="lab">Calcium et énergie</div><p>Anomalies du cycle du calcium intracellulaire, consommation d’oxygène accrue pour un travail utile réduit.</p>
<div class="lab">Hémodynamique</div><p>Battements extrasystoliques peu éjectants, variabilité du remplissage, activation neurohormonale.</p>
<div class="lab">Absence de fibrose initiale</div><p>Les modèles animaux d’ESV fréquentes provoquent une dysfonction réversible en quelques semaines, sans fibrose de remplacement notable. C’est la base de la réversibilité clinique.</p>
<div class="lab">Limite</div><p>Le poids relatif de ces mécanismes chez l’homme reste discuté ; l’association « charge élevée, dysfonction, récupération après suppression » reste l’argument principal.</p>
<div class="lab">Ce que montre le modèle animal</div><p>Chez le chien, un stimulateur programmé pour produire un bigéminisme ventriculaire, soit environ 50 % d’ESV, pendant 12 semaines a abaissé la FEVG à 40 %, contre 61 % chez les chiens témoins, et dilaté le ventricule gauche. La fonction s’est normalisée 2 à 4 semaines après l’arrêt des ESV. Les auteurs n’ont trouvé ni inflammation, ni fibrose, ni apoptose, ni anomalie mitochondriale (<a href="https://pubmed.ncbi.nlm.nih.gov/21576277/" target="_blank" rel="noopener">Huizar et al., 2011</a>). Une dysfonction sans perte de myocytes explique qu’elle puisse régresser après suppression des ESV.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/21576277/" target="_blank" rel="noopener">Huizar et al., Left ventricular systolic dysfunction induced by ventricular ectopy: a novel model for premature ventricular contraction-induced cardiomyopathy, Circ Arrhythm Electrophysiol 2011;4:543-549</a>.</p>
</template>

<template data-pop="i49-vulnerable" data-title="Période vulnérable et phénomène R sur T">
<div class="lab">Définition</div><p>Fenêtre de quelques dizaines de millisecondes proche du sommet de l’onde T, pendant laquelle les ventricules sont en partie repolarisés et en partie encore réfractaires.</p>
<div class="lab">Mécanisme</div><p>Un stimulus qui tombe dans cette fenêtre se propage seulement dans les zones excitables, se bloque devant les zones réfractaires et peut former des circuits de réentrée fonctionnels, donc une FV.</p>
<div class="lab">Facteurs qui l’élargissent</div><p>Ischémie aiguë, QT long, hypokaliémie, hypomagnésémie, catécholamines, cicatrice.</p>
<div class="lab">Applications</div><p>Synchronisation des chocs de cardioversion sur l’onde R ; mécanisme de la commotio cordis ; risque des ESV très précoces dans l’infarctus aigu.</p></template>

<template data-pop="i49-pvm" data-title="Prolapsus valvulaire mitral arythmogène">
<div class="lab">Profil</div><p>Femme jeune ou d’âge moyen, prolapsus des deux feuillets (valve de Barlow), disjonction de l’anneau mitral (l’insertion du feuillet postérieur est décalée vers l’oreillette), ESV fréquentes et complexes.</p>
<div class="lab">Signes d’alerte</div><p>Ondes T négatives dans les dérivations inférieures ; ESV à retard droit ou polymorphes (origine des piliers ou de l’anneau) ; TVNS ; syncope ; rehaussement tardif des muscles papillaires ou de la paroi inféro-latérale basale à l’IRM ; signe de « Pickelhaube » au Doppler tissulaire de l’anneau latéral.</p>
<div class="lab">Conduite</div><p>IRM cardiaque et Holter ; avis rythmologique. Défibrillateur en prévention secondaire après FV ou TV soutenue mal tolérée, sans cause réversible ; les indications en prévention primaire relèvent d’un consensus d’experts (<a href="https://doi.org/10.1093/europace/euac125" target="_blank" rel="noopener">EHRA 2022</a>) et d’une décision individuelle. La réparation valvulaire ne supprime pas toujours le risque rythmique.</p>
<div class="lab">Mécanisme</div><p>Dans une série de 43 sujets de 40 ans ou moins morts subitement avec un prolapsus mitral pour seule anomalie, l’autopsie montrait une fibrose des muscles papillaires chez tous et de la paroi inféro-basale du ventricule gauche chez 88 %. Cette distribution suggère un étirement mécanique répété par le feuillet qui prolabe ; la fibrose forme ensuite le substrat des ESV et des réentrées. Chez les patients vivants porteurs d’arythmies ventriculaires complexes, l’IRM trouvait un rehaussement tardif chez 93 %, contre 14 % des témoins (<a href="https://pubmed.ncbi.nlm.nih.gov/26160859/" target="_blank" rel="noopener">Basso et al., 2015</a>).</p>
<div class="lab">Pourquoi ces signes d’alerte</div><p>La fibrose inféro-basale modifie la repolarisation des dérivations inférieures, d’où les ondes T négatives, présentes chez 10 des 12 victimes dont l’ECG était disponible. Les ESV naissent des muscles papillaires ou de la paroi inféro-latérale du ventricule gauche, d’où leur aspect de retard droit.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/26160859/" target="_blank" rel="noopener">Basso et al., Arrhythmic mitral valve prolapse and sudden cardiac death, Circulation 2015;132:556-566</a>.</p>
</template>

<template data-pop="i49-declench" data-title="Facteurs favorisants des extrasystoles">
<div class="lab">Café</div><p>Pas d’association dans les cohortes pour la consommation habituelle. Essai CRAVE (2023) : un peu plus d’ESV les jours avec café, aucun effet sur les ESA. Réduire si le patient observe un lien.</p>
<div class="lab">Alcool</div><p>Favorise ESA, ESV et fibrillation auriculaire, surtout après une consommation aiguë importante (syndrome décrit en anglais sous le nom de <i>holiday heart syndrome</i>).</p>
<div class="lab">Sommeil et stress</div><p>Manque de sommeil, stress, déshydratation : augmentation du tonus adrénergique.</p>
<div class="lab">Substances et médicaments</div><p>Cocaïne, amphétamines, méthylphénidate ; décongestionnants (pseudoéphédrine) ; bêta-2 agonistes à forte dose ; hormones thyroïdiennes en excès ; théophylline ; certains antidépresseurs et antipsychotiques (tachycardie, QT) ; boissons énergisantes.</p>
<div class="lab">Situations</div><p>Hypokaliémie, hypomagnésémie, fièvre, anémie, hypoxémie, apnées du sommeil, digestion (réflexe vagal favorisant certaines ESA).</p>
<div class="lab">Pourquoi le café pèse peu</div><p>La caféine bloque les récepteurs de l’adénosine, qui freine l’adénylate cyclase des myocytes ; en levant ce frein, elle augmente probablement l’AMPc qui entretient l’activité déclenchée des foyers ventriculaires. L’effet mesuré reste faible. Dans la Cardiovascular Health Study, 1 388 participants de 72 ans en moyenne n’avaient pas plus d’ESA ni d’ESV au Holter selon leur consommation habituelle de café, de thé ou de chocolat (<a href="https://pubmed.ncbi.nlm.nih.gov/26813889/" target="_blank" rel="noopener">Dixit et al., 2016</a>). Dans l’essai CRAVE, les jours avec café comptaient aussi 36 minutes de sommeil en moins, autre facteur favorisant.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/10049999/" target="_blank" rel="noopener">Fredholm et al., Actions of caffeine in the brain with special reference to factors that contribute to its widespread use, Pharmacol Rev 1999;51:83-133</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26813889/" target="_blank" rel="noopener">Dixit et al., Consumption of caffeinated products and cardiac ectopy, J Am Heart Assoc 2016;5:e002503</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36947466/" target="_blank" rel="noopener">Marcus et al., N Engl J Med 2023;388:1092-1100</a>.</p>
</template>

<template data-pop="i49-palp-types" data-title="Types de palpitations selon l’EHRA (2011)">
<table class="t"><tr><th>Type</th><th>Description du patient</th><th>Début et rythme</th><th>Cause habituelle</th></tr>
<tr><td>Extrasystolique</td><td>« Le cœur saute un battement », « il s’arrête puis repart avec un coup »</td><td>Brutal, au repos ; rythme irrégulier entrecoupé de battements normaux</td><td>ESA, ESV</td></tr>
<tr><td>Tachycardique</td><td>« Le cœur bat très vite », « ailes qui battent » dans la poitrine</td><td>Brutal ; rapide, régulier ou irrégulier ; parfois à l’effort</td><td>Tachycardies supraventriculaires ou ventriculaires, fibrillation auriculaire</td></tr>
<tr><td>Anxieuse</td><td>Battements perçus au cours d’une angoisse, avec fourmillements, gorge serrée</td><td>Progressif ; régulier, peu rapide</td><td>Tachycardie sinusale d’anxiété</td></tr>
<tr><td>Pulsatile</td><td>Battements forts, réguliers, à fréquence normale</td><td>Progressif, persistant</td><td>Débit élevé (anémie, fièvre, hyperthyroïdie), insuffisance aortique, bradycardie</td></tr></table>
<div class="lab">Limite</div><p>Classification descriptive : une arythmie peut provoquer de l’anxiété, et l’anxiété peut accompagner une arythmie. Le type oriente les examens ; il ne remplace pas l’ECG pendant le symptôme.</p></template>

<template data-pop="i49-atcd-subst" data-title="Médicaments et substances à rechercher">
<div class="lab">Qui accélèrent ou déclenchent</div><p>Sympathomimétiques (décongestionnants, bêta-2 agonistes), hormones thyroïdiennes, stimulants (méthylphénidate, amphétamines, cocaïne, modafinil), théophylline, boissons énergisantes, compléments « minceur ».</p>
<div class="lab">Qui allongent le QT</div><p>Antiarythmiques (sotalol, amiodarone), macrolides, fluoroquinolones, antipsychotiques, citalopram et escitalopram, méthadone, ondansétron, dompéridone.</p>
<div class="lab">Qui abaissent le potassium ou le magnésium</div><p>Diurétiques de l’anse et thiazidiques, laxatifs, inhibiteurs de la pompe à protons au long cours (magnésium).</p>
<div class="lab">Qui aggravent l’intolérance orthostatique</div><p>Vasodilatateurs, diurétiques, alpha-bloquants, inhibiteurs de la recapture de la noradrénaline, tricycliques, opioïdes.</p>
<div class="lab">Question pratique</div><p>Demander aussi l’automédication et les produits achetés en ligne ; les patients les citent rarement spontanément.</p>
<div class="lab">Pourquoi ces substances</div><p>Les sympathomimétiques et les stimulants augmentent l’AMPc des myocytes : l’automatisme et les post-dépolarisations tardives augmentent. La plupart des médicaments qui allongent le QT bloquent le courant potassique rapide de repolarisation : la repolarisation s’allonge, des post-dépolarisations précoces apparaissent et peuvent amorcer des torsades de pointes. Les diurétiques font perdre potassium et magnésium. Les inhibiteurs de la recapture de la noradrénaline maintiennent ce médiateur dans la synapse et accélèrent le cœur, surtout debout.</p>
<div class="lab">Ce qui change la décision</div><p>Identifier la substance permet souvent de supprimer la cause plutôt que d’ajouter un antiarythmique : devant une arythmie attribuée à un médicament, l’<a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">ESC 2022</a> recommande de l’arrêter (classe I).</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">Zeppenfeld et al., ESC 2022</a>, section 6.1.1 et tableau 8 des recommandations ; <a href="https://doi.org/10.1016/j.hrthm.2015.03.029" target="_blank" rel="noopener">Sheldon et al., Heart Rhythm 2015;12:e41-e63</a>.</p>
</template>

<template data-pop="i49-atcd-psy" data-title="Anxiété, panique et arythmies">
<div class="lab">Chevauchement</div><p>Les palpitations sont un critère du trouble panique, et une tachycardie paroxystique provoque souvent de l’angoisse. Dans des séries de patients porteurs d’une tachycardie supraventriculaire, une majorité remplissait les critères du trouble panique avant le diagnostic rythmologique, qui avait été retardé de plusieurs années.</p>
<div class="lab">Indices d’une arythmie</div><p>Début et fin brutaux, fréquence très élevée (au-delà de 150/min), arrêt par une manœuvre vagale, polyurie après la crise, syncope, palpitations à l’effort.</p>
<div class="lab">Démarche</div><p>ECG pendant le symptôme avant d’attribuer les palpitations à l’anxiété. Un trouble anxieux ne protège pas d’une arythmie et peut coexister avec elle.</p>
<div class="lab">Psychotropes</div><p>Clozapine (tachycardie, myocardite), tricycliques et inhibiteurs de la recapture de la sérotonine et de la noradrénaline (tachycardie), stimulants ; antipsychotiques et citalopram (QT). ECG avant et après l’introduction si facteurs de risque.</p>
<div class="lab">Ce que montre la série de référence</div><p>Chez 107 patients porteurs d’une tachycardie supraventriculaire par réentrée, 67 % remplissaient les critères du trouble panique. L’arythmie était restée méconnue après le premier bilan chez 55 % d’entre eux, pendant 3,3 ans en médiane, et les médecins non psychiatres avaient attribué les symptômes à la panique, à l’anxiété ou au stress chez plus de la moitié de ces patients. Le Holter n’a capté la tachycardie que chez 9 % des patients qui en ont porté un, contre 47 % avec un enregistreur d’événements. Après un traitement guidé par l’exploration, le plus souvent une ablation, 86 % des patients n’avaient plus de symptômes (<a href="https://pubmed.ncbi.nlm.nih.gov/9066458/" target="_blank" rel="noopener">Lessmeier et al., 1997</a>).</p>
<div class="lab">Pourquoi les deux se ressemblent</div><p>Une tachycardie brutale réduit le remplissage et déclenche une décharge de catécholamines, qui produit sueurs, tremblement et angoisse. L’anxiété accélère au contraire le sinus progressivement.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/9066458/" target="_blank" rel="noopener">Lessmeier et al., Unrecognized paroxysmal supraventricular tachycardia: potential for misdiagnosis as panic disorder, Arch Intern Med 1997;157:537-543</a>.</p>
</template>

<template data-pop="i49-s-rate" data-title="Sensation de « raté » suivi d’un coup">
<div class="lab">Description</div><p>« Le cœur s’arrête un instant puis repart avec un grand coup », « un coup dans la gorge », « le cœur se retourne ».</p>
<div class="lab">Mécanisme</div><p>L’extrasystole, trop précoce, n’est pas perçue ; la pause l’est (« arrêt ») ; le battement potentialisé qui suit l’est aussi (« coup »).</p>
<div class="lab">Circonstances typiques</div><p>Au repos, le soir au coucher, en décubitus latéral gauche (le cœur est plus proche de la paroi), après un repas ; diminution fréquente à l’effort.</p>
<div class="lab">Valeur</div><p>Très évocateur d’extrasystoles, sans indiquer leur siège. La gêne n’est pas proportionnelle au nombre : certains patients sentent chaque extrasystole, d’autres aucune malgré une charge de 30 %.</p></template>

<template data-pop="i49-s-effort" data-title="Palpitations à l’effort ou à la récupération">
<div class="lab">Signification</div><p>Les palpitations d’effort sont un signe d’alerte. Elles évoquent une ischémie, une cardiomyopathie (arythmogène, hypertrophique), une TVPC, une myocardite, une fibrillation auriculaire adrénergique ou une tachycardie de la chambre de chasse.</p>
<div class="lab">Questions</div><p>À quel niveau d’effort ? Avec douleur, dyspnée ou malaise ? Arrêt de l’effort nécessaire ? Durée après l’arrêt ? Même sensation lors d’une émotion forte ?</p>
<div class="lab">Conduite</div><p>ECG, échocardiographie et épreuve d’effort ; suspension du sport intense jusqu’au bilan si syncope, douleur ou salves.</p></template>

<template data-pop="i49-s-syncope" data-title="Palpitations suivies d’une syncope">
<div class="lab">Deux mécanismes opposés</div><p>1. Tachycardie rapide mal tolérée (TV, fibrillation auriculaire pré-excitée, tachycardie supraventriculaire très rapide au début de l’accès). 2. Pause à l’arrêt d’un accès de fibrillation auriculaire chez un patient atteint de maladie du sinus.</p>
<div class="lab">Syncope sans palpitation</div><p>N’exclut pas une arythmie : le patient peut perdre connaissance avant de percevoir quoi que ce soit.</p>
<div class="lab">Conduite</div><p>Hospitalisation ou bilan rapide si cardiopathie, ECG anormal, syncope d’effort ou en décubitus, mort subite familiale (critères de haut risque de l’<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">ESC 2018</a>) ; monitorage ; échocardiographie ; moniteur implantable si les épisodes sont rares.</p></template>

<template data-pop="i49-s-ortho" data-title="Palpitations en station debout">
<div class="lab">Description</div><p>Accélération progressive quelques secondes à minutes après le lever, avec vertiges, vision trouble, faiblesse, fatigue, difficultés de concentration (« brouillard mental »), tremblement ; soulagement en s’asseyant ou en se couchant.</p>
<div class="lab">Aggravation</div><p>Chaleur (douche chaude), repas copieux, station debout immobile (file d’attente), matin, menstruations, déshydratation, après une maladie ou un alitement.</p>
<div class="lab">Orientation</div><p>POTS si la fréquence augmente d’au moins 30/min sans hypotension ; hypotension orthostatique si la pression chute ; syncope réflexe si les symptômes aboutissent à une perte de connaissance avec prodromes.</p></template>

<template data-pop="i49-standing" data-title="Test d’orthostatisme actif de 10 minutes">
<div class="lab">Préparation</div><p>Au calme, de préférence le matin, loin d’un repas ; suspendre si possible les médicaments qui modifient la fréquence ; pas d’excès de boisson juste avant.</p>
<div class="lab">Déroulement</div><p>Décubitus 5 minutes : fréquence et pression de référence. Lever sans aide, station debout immobile, dos au mur, sans croiser les jambes ni contracter les mollets. Mesures à 1, 3, 5 et 10 minutes ; noter les symptômes et la couleur des jambes.</p>
<div class="lab">Lecture</div><p>Gain de fréquence soutenu ≥ 30/min (≥ 40/min de 12 à 19 ans) sans baisse de la pression systolique ≥ 20 mmHg : réponse compatible avec un POTS. Baisse ≥ 20/10 mmHg dans les 3 minutes : hypotension orthostatique.</p>
<div class="lab">Pièges</div><p>Un seul test peut être faussement négatif (bonne hydratation, moment de la journée) : le répéter si la clinique est forte. Une fréquence de repos déjà &gt; 100/min oriente vers une tachycardie sinusale inappropriée ou une cause secondaire.</p>
<div class="lab">Pourquoi ces précautions</div><p>L’accélération orthostatique du POTS est plus forte le matin que le soir (<a href="https://doi.org/10.1016/j.hrthm.2015.03.029" target="_blank" rel="noopener">consensus HRS/EHRA 2015</a>) : un test matinal la révèle mieux. Les médicaments chronotropes la masquent, et une boisson abondante juste avant le test aussi, car l’eau a un effet presseur rapide. La contraction des mollets et le croisement des jambes chassent le sang veineux vers le cœur : ils corrigent artificiellement la baisse du retour veineux que le test doit mesurer. La durée de 10 minutes correspond à la fenêtre du critère diagnostique.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1016/j.hrthm.2015.03.029" target="_blank" rel="noopener">Sheldon et al., Heart Rhythm 2015;12:e41-e63</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11904109/" target="_blank" rel="noopener">Shannon et al., Water drinking as a treatment for orthostatic syndromes, Am J Med 2002;112:355-360</a>.</p>
</template>

<template data-pop="i49-e-pouls" data-title="Pouls irrégulier et déficit de pouls">
<div class="lab">Technique</div><p>Palper le pouls radial en auscultant simultanément le cœur pendant une minute ; ou compter le pouls pendant qu’un collègue compte à l’auscultation.</p>
<div class="lab">Déficit de pouls</div><p>Différence entre la fréquence cardiaque auscultée et la fréquence du pouls : les battements précoces remplissent peu le ventricule et ne génèrent pas d’onde perceptible.</p>
<div class="lab">Lecture</div><p>Irrégularités isolées sur un rythme régulier : extrasystoles. Irrégularité complète : fibrillation auriculaire. Pouls lent régulier avec un bigéminisme à l’ECG : déficit de pouls.</p>
<div class="lab">Piège</div><p>Saturomètres et tensiomètres automatiques comptent le pouls, non l’activité électrique : ils affichent une fausse bradycardie en bigéminisme ou une fausse fibrillation en présence d’extrasystoles. Toute anomalie impose un ECG.</p></template>

<template data-pop="i49-e-auscult" data-title="Auscultation d’un patient qui a des extrasystoles">
<div class="lab">Clic méso-systolique</div><p>Bruit sec en milieu de systole, suivi ou non d’un souffle télésystolique : prolapsus mitral. Il se rapproche du premier bruit en position debout (le ventricule se vide, le prolapsus survient plus tôt).</p>
<div class="lab">Souffle éjectionnel qui augmente debout ou au Valsalva</div><p>Cardiomyopathie hypertrophique obstructive.</p>
<div class="lab">Galop</div><p>Troisième bruit : dysfonction ventriculaire, à rechercher en cas de charge élevée.</p>
<div class="lab">Irrégularités</div><p>Un battement prématuré suivi d’une pause, avec un premier bruit d’intensité variable. Le premier bruit du battement extrasystolique est souvent plus faible (remplissage court), celui du battement suivant plus fort.</p>
<div class="lab">Pourquoi ces signes varient</div><p>Dans la cardiomyopathie hypertrophique obstructive, le souffle naît de l’obstacle à l’éjection sous la valve aortique. Debout ou pendant un effort de Valsalva, le retour veineux baisse et le ventricule gauche se remplit moins : la cavité se rétrécit, l’obstacle augmente et le souffle se renforce. Pour la même raison, l’<a href="https://doi.org/10.1093/eurheartj/ehad194" target="_blank" rel="noopener">ESC 2023</a> recommande de rechercher le gradient à l’échocardiographie pendant une manœuvre de Valsalva et en position debout. Le troisième bruit naît de la décélération brutale du remplissage rapide dans un ventricule dont la pression de remplissage est élevée : chez un patient à charge élevée, il fait suspecter une cardiomyopathie induite déjà installée.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehad194" target="_blank" rel="noopener">Arbelo et al., 2023</a> ESC Guidelines for the management of cardiomyopathies, Eur Heart J 2023;44:3503-3626 ; Hall, Guyton and Hall Textbook of Medical Physiology, 14e éd., Elsevier 2021.</p>
</template>

<template data-pop="i49-e-hypermob" data-title="Hypermobilité articulaire (score de Beighton)">
<div class="lab">Score sur 9 points</div><p>Dorsiflexion passive du cinquième doigt au-delà de 90° (1 point par côté) ; pouce ramené passivement contre l’avant-bras (1 par côté) ; hyperextension du coude au-delà de 10° (1 par côté) ; hyperextension du genou au-delà de 10° (1 par côté) ; paumes à plat sur le sol, genoux tendus (1).</p>
<div class="lab">Seuils</div><p>Un score ≥ 5 chez l’adulte (≥ 6 avant la puberté, ≥ 4 après 50 ans) définit une hypermobilité généralisée, l’un des critères du syndrome d’Ehlers-Danlos hypermobile (critères internationaux de 2017).</p>
<div class="lab">Lien avec le POTS</div><p>Association fréquente : la laxité du tissu conjonctif des parois veineuses favoriserait l’accumulation de sang dans les membres inférieurs debout. Ce lien reste une hypothèse.</p></template>
