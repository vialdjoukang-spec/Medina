
<!-- ===== FENÊTRES I49 : fibrillation ventriculaire, échappements, POTS, sport, grossesse ===== -->
<template data-pop="i49-fv-ecg" data-title="ECG de la FV et du flutter ventriculaire">
<div class="lab">Fibrillation ventriculaire</div><p>Ondulations irrégulières, sans QRS ni onde T identifiables, de fréquence supérieure à 300/min environ, de forme et d’amplitude variables. <b>À grandes mailles</b> au début ; <b>à petites mailles</b> quand l’arrêt se prolonge et que les réserves énergétiques du myocarde s’épuisent.</p>
<div class="lab">Flutter ventriculaire</div><p>Ondulation sinusoïdale régulière, monomorphe, d’environ 300/min (souvent entre 250 et 350/min), sans ligne isoélectrique et sans distinction entre QRS et onde T. Instable : il dégénère en FV.</p>
<div class="lab">Pièges</div><p><b>Artefacts</b> (tremblement, frissons, mouvement, électrode décollée) : regarder le patient, qui peut être conscient. <b>FV à petites mailles et asystolie</b> : vérifier les connexions, augmenter le gain, regarder deux dérivations ; si le doute FV fine/asystolie persiste chez un opérateur ALS, délivrer un choc puis reprendre immédiatement les compressions (ERC 2025). Si l’opérateur ne peut analyser rapidement le rythme, utiliser le mode automatisé. <b>TV rapide monomorphe</b> au-delà de 250/min : proche du flutter ventriculaire ; la conduite dépend du pouls.</p></template>

<template data-pop="i49-fv-meca" data-title="Mécanismes de la FV : déclencheur, substrat, modulateur">
<div class="lab">Déclencheur</div><p>Une ESV, souvent précoce, ou une TV qui dégénère ; parfois un choc thoracique pendant la période vulnérable.</p>
<div class="lab">Substrat</div><p>Ischémie aiguë (dispersion de la réfractarité, conduction lente) ; cicatrice ; hypertrophie ; fibrose ; canalopathie ; QT long.</p>
<div class="lab">Modulateurs</div><p>Catécholamines, hypokaliémie, hypomagnésémie, acidose, médicaments proarythmiques, hypothermie.</p>
<div class="lab">Entretien</div><p>Multiples ondes de réentrée qui se fragmentent et se recombinent sans cesse, et rotors (tourbillons d’activation) instables ; le réseau de Purkinje participe à l’entretien dans les premières minutes.</p>
<div class="lab">Corrélation thérapeutique</div><p>La défibrillation dépolarise en même temps une masse critique de myocarde et éteint toutes les ondes. Plus la FV dure, plus le myocarde s’épuise et moins le choc est efficace : les compressions prolongent la fenêtre dans laquelle le choc peut réussir.</p></template>

<template data-pop="i49-commotio" data-title="Commotio cordis">
<div class="lab">Définition</div><p>FV provoquée par un choc thoracique non pénétrant, sans lésion structurelle du cœur : balle, palet, coup de poing ou de pied sur la région précordiale.</p>
<div class="lab">Mécanisme</div><p>Le choc survient dans une fenêtre étroite avant le sommet de l’onde T (période vulnérable) ; l’étirement brutal active des canaux mécanosensibles et produit une dépolarisation qui déclenche la FV.</p>
<div class="lab">Terrain</div><p>Surtout l’adolescent et l’adulte jeune de sexe masculin, dont la paroi thoracique est souple ; sports de balle et arts martiaux.</p>
<div class="lab">Pronostic et prévention</div><p>La survie dépend de la rapidité des compressions et de la défibrillation. Des défibrillateurs automatisés externes accessibles sur les terrains de sport sont la mesure la plus efficace.</p>
<div class="lab">Ce que montre le modèle expérimental</div><p>Chez le porc, un projectile de la taille et du poids d’une balle de baseball, lancé à environ 48 km/h contre le thorax, a provoqué une FV dans 9 des 10 impacts survenus entre 30 et 15 ms avant le sommet de l’onde T, et aucune à un autre moment du cycle. Des balles plus souples réduisaient le risque (Link et al., 1998). Le moment de l’impact décide donc de l’arythmie : c’est l’argument principal en faveur du mécanisme de la période vulnérable.</p>
<div class="lab">Source complémentaire</div><p>Link et al., An experimental model of sudden death due to low-energy chest-wall impact (commotio cordis), N Engl J Med 1998;338:1805-1811.</p>
</template>

<template data-pop="i49-erc" data-title="Réanimation d’une FV ou d’une TV sans pouls (ERC 2025)">
<div class="lab">Réanimation de base</div><p>Reconnaître l’arrêt (inconscience, respiration absente ou anormale) ; alerter (144) ; compressions de 5 à 6 cm à 100–120/min, 30 compressions pour 2 insufflations ; défibrillateur automatisé externe dès qu’il est disponible.</p>
<div class="lab">Défibrillation</div><p>Choc biphasique d’au moins 150 J pour le premier choc (130–150 J pour les ondes biphasiques pulsées) ; augmenter l’énergie des chocs suivants si l’appareil le permet. Un choc unique, puis reprise immédiate des compressions pendant 2 minutes, sans contrôle du pouls. Pauses avant et après le choc aussi brèves que possible.</p>
<div class="lab">Chocs successifs</div><p>Jusqu’à trois chocs d’emblée si l’arrêt survient devant témoin, sous monitorage, avec un défibrillateur immédiatement disponible (salle de cathétérisme, soins intensifs). Ce groupe compte comme le premier choc de l’algorithme pour le calendrier de l’adrénaline et de l’amiodarone.</p>
<div class="lab">Médicaments</div><p>Adrénaline 1 mg par voie intraveineuse ou intraosseuse après le 3e choc, puis toutes les 3 à 5 minutes. Amiodarone 300 mg après le 3e choc, puis 150 mg après le 5e. Lidocaïne 100 mg après le 3e choc, puis 50 mg après le 5e, si l’amiodarone n’est pas disponible ou par choix local.</p>
<div class="lab">FV réfractaire</div><p>Vérifier la position des électrodes ; après trois chocs consécutifs inefficaces, envisager un changement de vecteur (position antéropostérieure) ; traiter les causes réversibles : hypoxie, hypovolémie, hypo- ou hyperkaliémie et autres troubles métaboliques, hypothermie ; thrombose coronaire ou pulmonaire, tamponnade, pneumothorax sous tension, toxiques. Réanimation extracorporelle chez des patients sélectionnés, dans les centres qui la pratiquent.</p>
<div class="lab">Voies aériennes</div><p>Ventilation au masque puis voie aérienne avancée par un opérateur entraîné, sans interrompre les compressions ; capnographie.</p>
<div class="lab">Pression de perfusion coronaire</div><p>Pendant les compressions, le myocarde n’est perfusé qu’en phase de relâchement, grâce à la différence entre la pression aortique diastolique et la pression de l’oreillette droite. Chez 100 patients en arrêt cardiaque, seuls ceux dont cette pression avait atteint au moins 15 mmHg ont retrouvé une circulation spontanée, sans que ce seuil la garantisse (Paradis et al., 1990). Des compressions efficaces et peu interrompues visent donc à maintenir cette pression.</p>
<div class="lab">Pourquoi ces médicaments, et ce qu’ils apportent</div><p>L’adrénaline contracte les artérioles par ses effets alpha-adrénergiques et élève la pression aortique diastolique, donc la perfusion coronaire ; ses effets bêta augmentent en revanche la consommation d’oxygène et l’excitabilité du myocarde. Dans un essai contre placebo chez 8 014 patients, elle a augmenté la survie à 30 jours (3,2 % contre 2,4 %) sans augmenter la survie avec un bon état neurologique, car davantage de survivants gardaient un handicap sévère (Perkins et al., 2018). L’amiodarone et la lidocaïne n’ont pas amélioré significativement la survie à la sortie de l’hôpital dans la FV réfractaire (24,4 % et 23,7 % contre 21,0 %) ; dans une analyse de sous-groupe, un bénéfice apparaissait dans les arrêts devant témoin (Kudenchuk et al., 2016). Ces médicaments visent à faciliter le succès du choc suivant et à prévenir la récidive ; aucun ne doit retarder un choc indiqué.</p>
<div class="lab">Pourquoi changer de vecteur</div><p>Un choc ne réussit que s’il dépolarise une masse critique de myocarde. Placer les électrodes en position antéropostérieure fait passer le courant par un autre trajet. Dans un essai de 405 patients en FV réfractaire, interrompu avant son terme, les survies à la sortie de l’hôpital observées étaient de 13,3 % dans le groupe standard, 21,7 % après changement de vecteur et 30,4 % avec deux défibrillateurs (Cheskes et al., 2022). L’ERC 2025 réserve toutefois la double défibrillation séquentielle au cadre de la recherche.</p>
<div class="lab">Source complémentaire</div><p>Paradis et al., Coronary perfusion pressure and the return of spontaneous circulation in human cardiopulmonary resuscitation, JAMA 1990;263:1106-1113 ; Perkins et al., A randomized trial of epinephrine in out-of-hospital cardiac arrest, N Engl J Med 2018;379:711-721 ; Kudenchuk et al., Amiodarone, lidocaine, or placebo in out-of-hospital cardiac arrest, N Engl J Med 2016;374:1711-1722 ; Cheskes et al., Defibrillation strategies for refractory ventricular fibrillation, N Engl J Med 2022;387:1947-1956 ; Brunton et al., Goodman and Gilman’s The Pharmacological Basis of Therapeutics, 13e éd., 2018.</p>
</template>

<template data-pop="i49-rosc" data-title="Soins après réanimation et bilan étiologique">
<div class="lab">Premières heures</div><p>ECG à 12 dérivations ; coronarographie urgente si sus-décalage du segment ST ; à discuter selon la probabilité d’occlusion coronaire sinon. Oxygène titré pour une SpO₂ de 94 à 98 % ; normocapnie ; pression artérielle moyenne supérieure à 65 mmHg environ ; glycémie contrôlée ; prévention active de la fièvre, avec une cible ≤ 37,5 °C pendant 36 à 72 heures chez le patient qui reste comateux (recommandations ERC-ESICM 2025).</p>
<div class="lab">Bilan étiologique</div><p>Ionogramme, troponine, échocardiographie, IRM cardiaque ; recherche toxicologique ; ECG répétés (QT, Brugada, repolarisation précoce) ; test aux bloqueurs sodiques et épreuve d’effort chez le jeune sans cause ; génétique selon l’orientation.</p>
<div class="lab">Pronostic neurologique</div><p>Évaluation multimodale, en règle au plus tôt 72 heures après le retour de la circulation, pour ne pas limiter les soins trop tôt.</p>
<div class="lab">Prévention secondaire</div><p>Défibrillateur si aucune cause aiguë réversible n’est identifiée (classe I, ESC 2022) ; information et réanimation apprises par les proches.</p>
<div class="lab">Pourquoi ces décisions</div><p>Chez les patients sélectionnés de COACT, sans sus-décalage du ST ni choc et après exclusion d’une cause non coronaire évidente, une coronarographie immédiate n’a pas fait mieux qu’une stratégie différée après récupération neurologique : survie à 90 jours de 64,5 % contre 67,2 % chez 552 patients (Lemkes et al., 2019). Une hypothermie à 33 °C n’a pas réduit la mortalité à 6 mois par rapport à une normothermie avec traitement précoce de la fièvre (50 % contre 48 %), et elle a causé plus d’arythmies mal tolérées (Dankiewicz et al., 2021) : la prévention active de la fièvre a remplacé l’hypothermie systématique. Chez les survivants d’une FV ou d’une TV soutenue, le défibrillateur a réduit la mortalité de 28 % par rapport à l’amiodarone, presque entièrement par une baisse de moitié des morts arythmiques (méta-analyse d’AVID, CASH et CIDS ; Connolly et al., 2000).</p>
<div class="lab">Source complémentaire</div><p>Lemkes et al., Coronary angiography after cardiac arrest without ST-segment elevation, N Engl J Med 2019;380:1397-1407 ; Dankiewicz et al., Hypothermia versus normothermia after out-of-hospital cardiac arrest, N Engl J Med 2021;384:2283-2294 ; Connolly et al., Meta-analysis of the implantable cardioverter defibrillator secondary prevention trials, Eur Heart J 2000;21:2071-2078.</p>
</template>

<template data-pop="i49-riva" data-title="Rythme idioventriculaire accéléré">
<div class="lab">ECG</div><p>Rythme ventriculaire régulier à QRS larges, entre environ 50 et 110/min, qui démarre et s’arrête progressivement, en compétition avec le sinus ; complexes de fusion et de capture fréquents à la transition.</p>
<div class="lab">Mécanisme</div><p>Automatisme anormal d’un foyer ventriculaire, qui prend le commandement quand sa fréquence dépasse celle du sinus.</p>
<div class="lab">Contextes</div><p>Reperfusion après un infarctus (angioplastie ou fibrinolyse), intoxication digitalique, cocaïne, cardiomyopathies, myocardite ; parfois chez le sujet sain ou l’athlète.</p>
<div class="lab">Conduite</div><p>Bénin et transitoire : surveillance. Aucun antiarythmique, qui pourrait supprimer un rythme utile. Si la perte de la systole auriculaire est mal tolérée, accélérer le sinus (atropine) suffit souvent.</p>
<div class="lab">Valeur de marqueur de reperfusion</div><p>Ce rythme était considéré comme un signe de reperfusion après fibrinolyse. Pendant l’angioplastie primaire de 503 patients, il est survenu chez 42 % d’entre eux, mais il ne signait pas une reperfusion réussie : les patients concernés avaient moins souvent un flux coronaire normal à l’admission, un territoire à risque plus étendu, une reperfusion microvasculaire plus lente et des infarctus plus grands, avec une mortalité semblable (Terkelsen et al., 2009).</p>
<div class="lab">Pourquoi accélérer le sinus suffit</div><p>Le foyer bat à peine plus vite que le sinus. Si l’atropine porte la fréquence sinusale au-dessus de la sienne, le sinus reprend le commandement, le foyer est remis à zéro à chaque battement, et la contraction des oreillettes contribue de nouveau au remplissage.</p>
<div class="lab">Source complémentaire</div><p>Terkelsen et al., Prevalence and significance of accelerated idioventricular rhythm in patients with ST-elevation myocardial infarction treated with primary percutaneous coronary intervention, Am J Cardiol 2009;104:1641-1646.</p>
</template>

<template data-pop="i49-rja" data-title="Rythme jonctionnel accéléré">
<div class="lab">ECG</div><p>QRS fins réguliers, environ 60 à 100/min (au-delà, on parle de tachycardie jonctionnelle), avec des ondes P rétrogrades ou dissociées.</p>
<div class="lab">Causes</div><p>Intoxication digitalique (en fibrillation auriculaire : rythme ventriculaire qui devient régulier), chirurgie cardiaque récente, infarctus inférieur, myocardite, hypokaliémie, catécholamines, isoprénaline.</p>
<div class="lab">Conduite</div><p>Traiter la cause : digoxinémie, potassium, arrêt du médicament. Une fibrillation auriculaire qui se régularise sous digoxine est une intoxication jusqu’à preuve du contraire.</p>
<div class="lab">Mécanisme</div><p>Le rythme jonctionnel accéléré traduit un automatisme accru ou une activité déclenchée du tissu jonctionnel, qui dépasse alors la fréquence sinusale. Une lésion locale l’explique après une chirurgie cardiaque, dans une myocardite ou dans un infarctus inférieur, car l’artère du nœud auriculoventriculaire naît le plus souvent de la coronaire droite. La digoxine y conduit par la surcharge calcique et les post-dépolarisations tardives ; son intoxication associe typiquement un automatisme accru et un ralentissement de la conduction (Ma et al., 2001).</p>
<div class="lab">Pourquoi une fibrillation auriculaire qui se régularise alerte</div><p>En fibrillation auriculaire, la réponse ventriculaire est irrégulière parce que le nœud ne transmet qu’une partie, aléatoire, des influx. Si la digoxine bloque complètement le nœud et qu’un foyer jonctionnel accéléré prend le relais, les QRS deviennent réguliers malgré la fibrillation persistante.</p>
<div class="lab">Source complémentaire</div><p>Ma et al., Electrocardiographic manifestations: digitalis toxicity, J Emerg Med 2001;20:145-152.</p>
</template>

<template data-pop="i49-pots-crit" data-title="Critères du syndrome de tachycardie orthostatique posturale">
<div class="lab">Critères (consensus HRS/EHRA 2015)</div><p>1. Augmentation soutenue de la fréquence cardiaque d’au moins 30/min dans les 10 minutes suivant le passage debout ou l’inclinaison (au moins 40/min entre 12 et 19 ans). 2. Absence d’hypotension orthostatique (baisse de la pression systolique de moins de 20 mmHg). 3. Symptômes fréquents d’intolérance orthostatique, aggravés debout et améliorés couché.</p>
<div class="lab">Chronicité</div><p>Le consensus HRS/EHRA 2015 demande de préciser la chronicité des symptômes sans fixer de durée minimale. À titre de comparaison seulement, une réunion d’experts américaine (NIH, 2019, publiée en 2021) propose au moins 3 mois ; aucune source suisse ou européenne ne fixe ce seuil (lacune nommée).</p>
<div class="lab">Exclusions</div><p>Autre cause de tachycardie orthostatique : déshydratation aiguë, saignement, alitement prolongé, médicament, hyperthyroïdie, anémie, phéochromocytome, insuffisance surrénalienne.</p>
<div class="lab">Remarque</div><p>Beaucoup de patients dépassent 120/min debout, mais aucun seuil absolu de fréquence n’est exigé. Le seuil de 30/min seul manque de spécificité chez l’adolescent, d’où le seuil de 40/min.</p></template>

<template data-pop="i49-pots-phys" data-title="Phénotypes du POTS">
<div class="lab">Neuropathique</div><p>Neuropathie des petites fibres sympathiques des membres inférieurs : vasoconstriction insuffisante, accumulation veineuse dans les jambes (acrocyanose debout), sudation distale réduite. Les tests de sudation et la biopsie cutanée peuvent la documenter.</p>
<div class="lab">Hyperadrénergique</div><p>Noradrénaline plasmatique debout élevée (≥ 600 pg/mL), hausse de la pression systolique debout (≥ 10 mmHg), tremblement, anxiété, sueurs, migraine. Rarement génétique (défaut du transporteur de la noradrénaline).</p>
<div class="lab">Hypovolémique</div><p>Volume plasmatique réduit, avec un système rénine-aldostérone paradoxalement peu activé ; répond bien à l’expansion volémique.</p>
<div class="lab">Déconditionnement</div><p>Ventricule gauche petit, volume d’éjection bas ; présent chez beaucoup de patients, cause ou conséquence de l’inactivité.</p>
<div class="lab">Portée</div><p>Ces phénotypes se chevauchent et ne sont pas des entités distinctes ; ils orientent le choix des traitements d’appoint.</p>
<div class="lab">Proportions et mécanismes</div><p>Selon le consensus HRS/EHRA 2015, le volume sanguin est réduit chez jusqu’à 70 % des patients ; la rénine et l’aldostérone restent basses alors qu’une hypovolémie devrait les stimuler, ce qui évoque un défaut de la régulation du volume. La neuropathie sudomotrice distale concerne jusqu’à 50 % des patients des centres tertiaires ; le sang stagne aussi dans le territoire splanchnique, et le débit cardiaque doit s’élever pour compenser. La forme hyperadrénergique concerne jusqu’à 50 % des patients, avec de fortes variations entre centres.</p>
<div class="lab">Anxiété</div><p>L’anxiété et la vigilance aux sensations corporelles sont plus fréquentes dans le POTS. Des études physiologiques et psychométriques ont toutefois montré que l’accélération orthostatique répond à une anomalie circulatoire et non à l’anxiété : celle-ci accompagne le syndrome sans l’expliquer.</p>
<div class="lab">Source complémentaire</div><p>Sheldon et al., 2015 Heart Rhythm Society expert consensus statement, Heart Rhythm 2015;12:e41-e63, section Physiology.</p>
</template>

<template data-pop="i49-pots-covid" data-title="POTS après une infection virale ou un COVID-19">
<div class="lab">Constat</div><p>Un POTS apparaît chez une partie des patients après une infection virale, en particulier après un COVID-19, dans le cadre d’un syndrome persistant après le COVID-19 (déclaration de l’American Autonomic Society, 2021). Des cas ont aussi été rapportés après une vaccination, bien plus rarement qu’après l’infection.</p>
<div class="lab">Hypothèses</div><p>Déconditionnement après la maladie, hypovolémie, réaction auto-immune contre des récepteurs adrénergiques ou muscariniques, neuropathie des petites fibres. Aucune n’est démontrée comme cause unique.</p>
<div class="lab">Conduite</div><p>Même démarche que pour tout POTS. Si un malaise post-effort (aggravation retardée et prolongée après un effort) est présent, on privilégie la gestion de l’activité et du repos pour éviter les exacerbations, sans augmentation programmée de l’exercice. Une reprise éventuelle est individualisée selon la tolérance et l’évolution, avec une équipe de réadaptation.</p></template>

<template data-pop="i49-pots-dd" data-title="Diagnostic différentiel du POTS">
<table class="t"><tr><th>Diagnostic</th><th>Élément distinctif</th></tr>
<tr><td>Tachycardie sinusale inappropriée</td><td>Fréquence de repos &gt; 100/min et moyenne sur 24 heures &gt; 90/min, même couché</td></tr>
<tr><td>Hypotension orthostatique</td><td>Chute de la pression ≥ 20/10 mmHg ; accélération faible si neurogène</td></tr>
<tr><td>Syncope réflexe</td><td>Épisodes avec prodromes et perte de connaissance, fréquence normale entre les épisodes</td></tr>
<tr><td>Hypovolémie aiguë, saignement, déshydratation</td><td>Contexte récent, anomalies biologiques ; corrigée par la réhydratation</td></tr>
<tr><td>Déconditionnement après alitement</td><td>Histoire d’immobilisation ; s’améliore avec la reprise progressive</td></tr>
<tr><td>Anémie, hyperthyroïdie</td><td>Hémogramme, TSH</td></tr>
<tr><td>Phéochromocytome</td><td>Poussées hypertensives, céphalées, sueurs ; métanéphrines</td></tr>
<tr><td>Médicaments</td><td>Inhibiteurs de la recapture de la sérotonine et de la noradrénaline, tricycliques, stimulants, vasodilatateurs, diurétiques</td></tr>
<tr><td>Trouble anxieux, trouble panique</td><td>Symptômes non liés à la position ; peut coexister</td></tr>
<tr><td>Trouble des conduites alimentaires</td><td>Amaigrissement, bradycardie de repos, hypovolémie</td></tr>
<tr><td>Tachycardie paroxystique (réentrée)</td><td>Début et fin brutaux, indépendants de la position</td></tr></table></template>

<template data-pop="i49-pots-tt" data-title="Mesures non médicamenteuses du POTS">
<div class="lab">Comprendre</div><p>Expliquer que la tachycardie compense un retour veineux insuffisant et que l’entraînement adapté fait partie des traitements non médicamenteux, après recherche d’un malaise post-effort ; il n’a pas démontré une supériorité universelle à long terme sur toutes les autres stratégies.</p>
<div class="lab">Volume</div><p>2 à 3 L de liquides par jour ; 10 à 12 g de sel par jour, par l’alimentation ou en comprimés, sauf hypertension, insuffisance cardiaque ou rénale. Boire environ 500 mL d’eau rapidement avant le lever ou avant une activité debout : l’effet presseur de l’eau dure environ une heure.</p>
<div class="lab">Retour veineux</div><p>Bas de compression remontant jusqu’à la taille ou ceinture abdominale ; manœuvres de contre-pression (croiser les jambes, contracter les fessiers, s’accroupir) dès les premiers symptômes ; surélever la tête du lit.</p>
<div class="lab">Entraînement</div><p>Programme de trois mois ou plus, débuté en position couchée ou assise (rameur, vélo couché, natation), 3 à 4 séances par semaine, puis intégration progressive d’exercices debout. La gêne orthostatique peut augmenter au début : adapter alors l’intensité. Une aggravation retardée et prolongée après l’effort impose une réévaluation et la gestion de l’activité et du repos, plutôt qu’une progression imposée.</p>
<div class="lab">Vie quotidienne</div><p>Repas fractionnés et moins riches en glucides rapides ; éviter la chaleur, l’alcool, la station debout immobile ; lever en deux temps ; sommeil régulier ; aménagements scolaires ou professionnels temporaires.</p>
<div class="lab">Pourquoi ces mesures</div><p>Boire rapidement un grand verre d’eau produit un effet presseur : chez 9 patients atteints d’intolérance orthostatique, 480 mL bus en moins de 5 minutes ont abaissé la fréquence debout de 123 à 108/min (Shannon et al., 2002). Les bas et la ceinture de compression réduisent la capacité des veines des jambes et de l’abdomen, où le sang stagne debout. Les manœuvres de contre-pression contractent les muscles, qui chassent ce sang vers le cœur. Le consensus HRS/EHRA 2015 retient ces mesures en premier, avant tout médicament.</p>
<div class="lab">Source complémentaire</div><p>Shannon et al., Water drinking as a treatment for orthostatic syndromes, Am J Med 2002;112:355-360 ; Sheldon et al., Heart Rhythm 2015;12:e41-e63, consensus de la Heart Rhythm Society rédigé avec l’European Heart Rhythm Association.</p>
</template>

<template data-pop="i49-sport" data-title="Sport et extrasystoles">
<div class="lab">Athlète : quand chercher plus loin</div><p>Deux ESV ou plus sur un ECG de repos de 10 secondes (critères internationaux de 2017) : Holter, échocardiographie et épreuve d’effort. IRM si la morphologie n’est pas celle d’une chambre de chasse ou d’un fascicule, si les ESV augmentent ou se compliquent à l’effort, ou si elles sont très nombreuses : dans une série d’athlètes, 2 000 ESV ou plus par 24 heures s’associaient à une anomalie cardiaque dans environ 30 % des cas (Biffi et coll., 2002).</p>
<div class="lab">Autorisation (ESC 2020)</div><p>ESV de morphologie habituelle (chambres de chasse, fascicules), sans cardiopathie, sans complexité à l’effort : tous les sports, y compris la compétition. ESV avec cardiopathie : selon la cardiopathie.</p>
<div class="lab">Situations particulières</div><p>Cardiomyopathie induite : pas de compétition tant que la FEVG n’a pas récupéré, attitude habituelle en l’absence de recommandation spécifique. Après ablation : reprise après contrôle rythmologique. POTS : l’activité physique adaptée est un traitement lorsque la tolérance le permet ; en présence de malaise post-effort, privilégier la gestion de l’activité et du repos. Survivant d’une FV porteur d’un défibrillateur : voir la <button class="w" data-k="i47-sport">fiche sport et tachycardies (chapitre I47)</button>.</p>
<div class="lab">Principe</div><p>Décision partagée et documentée ; réévaluation périodique chez l’athlète de compétition.</p></template>

<template data-pop="i49-grossesse" data-title="Grossesse : extrasystoles, POTS et réanimation">
<div class="lab">Extrasystoles</div><p>Fréquentes et en général bénignes. Échocardiographie si elles sont nombreuses, symptomatiques ou accompagnées d’un signe d’alerte. Traitement seulement si la gêne est importante : bêtabloquant β1-sélectif (métoprolol, bisoprolol), à la dose la plus faible ; éviter l’aténolol (retard de croissance) (ESC 2025, maladies cardiovasculaires et grossesse). Surveillance de la croissance fœtale sous bêtabloquant et du nouveau-né (bradycardie, hypoglycémie).</p>
<div class="lab">Ablation</div><p>Reportée après l’accouchement, sauf arythmie réfractaire et mal tolérée ; elle se fait alors sans rayons X, par cartographie électroanatomique, dans un centre expérimenté.</p>
<div class="lab">POTS</div><p>Évolution variable : amélioration fréquente au cours de la grossesse avec l’expansion volémique, aggravation chez d’autres, surtout au premier trimestre (nausées, vomissements). Les mesures non médicamenteuses restent la base ; les données sur la midodrine et la fludrocortisone sont limitées.</p>
<div class="lab">Arrêt cardiaque (ERC 2025)</div><p>Mêmes énergies de défibrillation et mêmes médicaments ; déplacement manuel de l’utérus vers la gauche à partir d’environ 20 semaines, car l’utérus gravide comprime en décubitus dorsal la veine cave inférieure et l’aorte, ce qui réduit le retour veineux et l’efficacité des compressions ; préparer immédiatement une hystérotomie de réanimation et la réaliser dès que possible sur le lieu de l’arrêt, par une équipe compétente, si elle est indiquée. L’ERC 2025 ne recommande pas d’attendre un seuil fixe de 4 minutes : vider l’utérus soulage la compression aortocave et facilite la réanimation maternelle.</p></template>
