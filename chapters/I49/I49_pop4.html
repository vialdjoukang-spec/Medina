
<!-- ===== FENÊTRES I49 : monographies ===== -->
<template data-pop="i49-d-bb" data-title="Bêtabloquants dans les extrasystoles">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs β1 : baisse de l’AMPc, de l’entrée de calcium et de la surcharge du réticulum sarcoplasmique ; réduction de l’activité déclenchée et de l’automatisme adrénergique ; ralentissement sinusal.</p>
<div class="lab">Preuves</div><p>Dans les ESV idiopathiques, les bêtabloquants réduisent surtout les symptômes ; leur effet sur la charge est modeste et inconstant, ce qui explique la place de l’ablation. Sur cardiopathie, ils réduisent les ESV et la mortalité lorsqu’ils sont indiqués pour la cardiopathie elle-même (infarctus, insuffisance cardiaque).</p>
<div class="lab">Place (ESC 2022)</div><p>Classe I pour les ESV idiopathiques symptomatiques d’origine autre que la chambre de chasse droite ou les fascicules ; option par décision partagée dans les autres cas.</p>
<div class="lab">Posologie</div><p>Bisoprolol 1,25–10 mg/jour ; métoprolol succinate 25–200 mg/jour ; propranolol 10–40 mg × 2–3/jour.</p>
<div class="lab">Effets indésirables</div><p>Fatigue, bradycardie, froideur des extrémités, troubles du sommeil ; aggravation possible des ESV qui dépendent de la bradycardie (ESV plus nombreuses la nuit).</p>
<div class="lab">Contre-indications</div><p>Bloc auriculoventriculaire de haut degré non appareillé, bradycardie symptomatique, asthme sévère non contrôlé (β1-sélectif avec prudence).</p></template>

<template data-pop="i49-d-cci" data-title="Vérapamil et diltiazem dans les extrasystoles">
<div class="lab">Mécanisme</div><p>Blocage du canal calcique de type L : moins d’entrée de calcium, donc moins de post-dépolarisations tardives ; ralentissement nodal. Particulièrement actifs sur les foyers de la chambre de chasse et sur les ESV fasciculaires, qui dépendent de tissus sensibles au calcium.</p>
<div class="lab">Preuves</div><p>Aucun grand essai randomisé dans les ESV idiopathiques : des études observationnelles et de petits essais montrent une réduction de la charge chez une minorité de patients, du même ordre que celle des bêtabloquants. La sensibilité des tachycardies fasciculaires au vérapamil est établie depuis les séries de Belhassen (1981).</p>
<div class="lab">Place (ESC 2022)</div><p>Classe I, avec les bêtabloquants, pour les ESV idiopathiques symptomatiques d’origine autre que la chambre de chasse droite ou les fascicules ; alternative dans les ESV fasciculaires.</p>
<div class="lab">Posologie</div><p>Vérapamil à libération prolongée 120–480 mg/jour ; diltiazem à libération prolongée 120–360 mg/jour.</p>
<div class="lab">Effets indésirables</div><p>Constipation (vérapamil), œdèmes des chevilles, bradycardie, bloc auriculoventriculaire, hypotension.</p>
<div class="lab">Contre-indications</div><p>FEVG réduite (effet inotrope négatif) ; bloc auriculoventriculaire de haut degré ; fibrillation auriculaire pré-excitée ; tachycardie à QRS larges de mécanisme inconnu (voie intraveineuse).</p>
<div class="lab">Interactions</div><p>Bêtabloquants (bradycardie, bloc) ; inhibiteurs du CYP3A4 ; le vérapamil augmente la digoxinémie et les concentrations de certaines statines.</p></template>

<template data-pop="i49-d-ic" data-title="Flécaïnide et propafénone dans les extrasystoles">
<div class="lab">Mécanisme</div><p>Blocage du canal sodique rapide à dissociation lente : ralentissement de la conduction, surtout à fréquence rapide ; la flécaïnide inhibe aussi le récepteur de la ryanodine et réduit les libérations spontanées de calcium. La propafénone a une activité bêtabloquante.</p>
<div class="lab">Preuves</div><p>Dans les ESV idiopathiques, la flécaïnide réduit la charge plus nettement que les bêtabloquants dans les études observationnelles et de petits essais. L’essai CAST (1989–1991) a montré une surmortalité sous flécaïnide et encaïnide chez des patients ayant fait un infarctus avec des ESV asymptomatiques.</p>
<div class="lab">Place (ESC 2022)</div><p>Classe IIa, au même titre que l’ablation, pour les ESV idiopathiques symptomatiques d’origine autre que la chambre de chasse droite ou les fascicules ; alternative quand l’ablation n’est pas possible ou souhaitée.</p>
<div class="lab">Conditions de sécurité</div><p>Cœur structurellement normal (échocardiographie, et IRM en cas de doute), pas de cardiopathie ischémique, FEVG normale, pas de trouble de conduction significatif, pas de syndrome de Brugada. Associer un freinateur nodal s’il existe aussi une arythmie auriculaire.</p>
<div class="lab">Posologie</div><p>Flécaïnide 50–150 mg × 2/jour ; propafénone 150–300 mg × 3/jour ; réduire la flécaïnide en insuffisance rénale.</p>
<div class="lab">Surveillance</div><p>ECG à une semaine et après chaque changement de dose ; élargissement du QRS de plus de 25 % : réduire ; épreuve d’effort pour détecter l’élargissement dépendant de la fréquence. Inhibiteurs du CYP2D6 : prudence.</p></template>

<template data-pop="i49-d-propra" data-title="Propranolol à faible dose dans le POTS">
<div class="lab">Mécanisme</div><p>Bêtabloquant non sélectif et lipophile : réduit la tachycardie orthostatique et les symptômes adrénergiques (tremblement, anxiété, palpitations).</p>
<div class="lab">Preuves</div><p>Dans un essai croisé (Raj et coll., 2009), 20 mg améliorait les symptômes mieux que 80 mg, qui réduisait davantage la fréquence mais était moins bien toléré. La tachycardie étant une compensation, la réduire trop aggrave la fatigue.</p>
<div class="lab">Place</div><p>Classe IIb (HRS 2015), surtout dans les formes à tachycardie marquée ou hyperadrénergiques.</p>
<div class="lab">Posologie</div><p>10 à 20 mg, une à deux fois par jour.</p>
<div class="lab">Effets indésirables et précautions</div><p>Fatigue, hypotension, bronchospasme (asthme : éviter), cauchemars ; prudence en cas de dépression sévère ou de trouble des conduites alimentaires avec bradycardie.</p></template>

<template data-pop="i49-d-iva" data-title="Ivabradine dans le POTS">
<div class="lab">Mécanisme</div><p>Blocage sélectif du courant If (canal HCN4) du nœud sinusal : baisse de la fréquence sinusale sans effet sur la pression artérielle ni sur la contractilité. C’est un avantage chez le patient dont la pression est basse et qui tolère mal les bêtabloquants.</p>
<div class="lab">Preuves</div><p>Petit essai randomisé contre placebo dans le POTS hyperadrénergique (Taub et coll., 2021) : baisse de la fréquence debout et amélioration de la qualité de vie. Utilisation hors indication en Suisse, où l’ivabradine est autorisée pour l’angor et l’insuffisance cardiaque.</p>
<div class="lab">Posologie</div><p>2,5 à 5 mg × 2/jour, jusqu’à 7,5 mg × 2/jour.</p>
<div class="lab">Effets indésirables</div><p>Phosphènes (perception lumineuse transitoire), bradycardie, fibrillation auriculaire.</p>
<div class="lab">Contre-indications et interactions</div><p>Grossesse et allaitement : contraception efficace chez la femme en âge de procréer, ce qui concerne la majorité des patientes atteintes de POTS. Vérapamil, diltiazem et inhibiteurs puissants du CYP3A4 : contre-indiqués.</p></template>

<template data-pop="i49-d-fludro" data-title="Fludrocortisone">
<div class="lab">Mécanisme</div><p>Minéralocorticoïde de synthèse : réabsorption rénale de sodium et d’eau, expansion du volume plasmatique, sensibilisation des vaisseaux aux catécholamines.</p>
<div class="lab">Preuves</div><p>Données limitées dans le POTS : études observationnelles et un essai pédiatrique de petite taille ; la preuve la plus solide concerne la syncope réflexe (essai POST 2, 2016, réduction non significative des récidives en analyse principale).</p>
<div class="lab">Place</div><p>Classe IIb dans le POTS (HRS 2015), surtout dans le profil hypovolémique, lorsque l’apport d’eau et de sel ne suffit pas. Hors indication officielle pour cette maladie.</p>
<div class="lab">Posologie</div><p>0,05 à 0,1 mg/jour, jusqu’à 0,2 mg/jour.</p>
<div class="lab">Effets indésirables</div><p>Hypokaliémie (contrôle du potassium à 1–2 semaines puis périodiquement), hypertension, œdèmes, céphalées, prise de poids.</p>
<div class="lab">Précautions</div><p>Insuffisance cardiaque, hypertension, insuffisance rénale ; association avec des médicaments allongeant le QT ou la digoxine (l’hypokaliémie potentialise leur toxicité).</p></template>

<template data-pop="i49-d-midodrine" data-title="Midodrine">
<div class="lab">Mécanisme</div><p>Promédicament transformé en désglymidodrine, agoniste des récepteurs α1 : vasoconstriction artérielle et veineuse, meilleur retour veineux. Il ne passe pas la barrière hémato-encéphalique.</p>
<div class="lab">Preuves</div><p>Dans le POTS, études aiguës contre placebo (Ross et coll., 2014) : baisse de la tachycardie orthostatique, surtout dans le phénotype à débit sanguin périphérique bas. Dans la syncope réflexe, l’essai POST 4 (2021) a réduit les récidives.</p>
<div class="lab">Place</div><p>Hypotension orthostatique (indication autorisée) ; POTS à vasoconstriction insuffisante (classe IIb, HRS 2015, hors indication). Il agit environ 4 heures : il se prend quand le patient doit être debout.</p>
<div class="lab">Posologie</div><p>2,5 mg × 3/jour (matin, midi, après-midi), jusqu’à 10 mg × 3/jour ; dernière prise au moins 4 heures avant le coucher.</p>
<div class="lab">Effets indésirables</div><p>Hypertension en décubitus (le patient ne s’allonge pas dans les heures qui suivent la prise), piloérection, fourmillements et prurit du cuir chevelu, rétention urinaire, bradycardie réflexe.</p>
<div class="lab">Contre-indications</div><p>Cardiopathie sévère, hypertension, rétention urinaire, phéochromocytome, thyrotoxicose, insuffisance rénale aiguë.</p></template>

<template data-pop="i49-d-pyrido" data-title="Pyridostigmine">
<div class="lab">Mécanisme</div><p>Inhibiteur de l’acétylcholinestérase : augmente l’acétylcholine dans les ganglions autonomes (transmission sympathique vers les vaisseaux) et aux terminaisons vagales (ralentissement cardiaque).</p>
<div class="lab">Preuves</div><p>Essai croisé aigu contre placebo (Raj et coll., 2005) : réduction modeste de la fréquence debout et des symptômes ; données au long cours observationnelles.</p>
<div class="lab">Place</div><p>POTS (classe IIb, HRS 2015, hors indication) ; intéressante en cas de constipation associée ; autorisée en Suisse pour la myasthénie.</p>
<div class="lab">Posologie</div><p>30 mg × 2/jour, jusqu’à 60 mg × 3/jour.</p>
<div class="lab">Effets indésirables</div><p>Crampes abdominales, diarrhée, nausées, hypersalivation, fasciculations, bradycardie.</p>
<div class="lab">Contre-indications</div><p>Obstruction digestive ou urinaire mécanique ; prudence dans l’asthme et avec les bêtabloquants (bradycardie).</p></template>
