
<!-- ===== FENÊTRES I49 : monographies ===== -->
<template data-pop="i49-d-bb" data-title="Bêtabloquants dans les extrasystoles">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs β1 : baisse de l’AMPc, de l’entrée de calcium et de la surcharge du réticulum sarcoplasmique ; réduction de l’activité déclenchée et de l’automatisme adrénergique ; ralentissement sinusal.</p>
<div class="lab">Preuves</div><p>Dans les ESV idiopathiques, les bêtabloquants réduisent surtout les symptômes ; leur effet sur la charge est modeste et inconstant, ce qui explique la place de l’ablation. Sur cardiopathie, ils réduisent les ESV et la mortalité lorsqu’ils sont indiqués pour la cardiopathie elle-même (infarctus, insuffisance cardiaque). Ce bénéfice de survie tient à leur action sur la cardiopathie ; il n’a pas été démontré comme une conséquence de la suppression des ESV, et l’essai CAST a même montré qu’on peut supprimer les ESV en augmentant la mortalité.</p>
<div class="lab">Place (<a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">ESC 2022</a>)</div><p>Classe I pour les ESV idiopathiques symptomatiques d’origine autre que la chambre de chasse droite ou les fascicules ; option par décision partagée dans les autres cas, où ils sont de classe IIa quand l’ablation n’est pas possible ou pas souhaitée. L’ESC 2022 les préfère quand la charge augmente avec la fréquence ou à l’effort, ou quand une activité déclenchée est suspectée, parce qu’ils abaissent l’AMPc dont dépend ce mécanisme.</p>
<div class="lab">Posologie</div><p>Selon les informations suisses : bisoprolol 5 à 10 mg par jour (1,25 mg au départ dans l’insuffisance cardiaque), sans indication rythmique en Suisse ; métoprolol succinate 100 à 200 mg une fois par jour dans les troubles du rythme ; propranolol 10 à 40 mg 3 à 4 fois par jour dans les troubles du rythme.</p>
<div class="lab">Effets indésirables</div><p>Fatigue, bradycardie, froideur des extrémités, troubles du sommeil ; aggravation possible des ESV qui dépendent de la bradycardie (ESV plus nombreuses la nuit).</p>
<div class="lab">Contre-indications</div><p>Bloc auriculoventriculaire de haut degré non appareillé, bradycardie symptomatique, asthme sévère non contrôlé (β1-sélectif avec prudence).</p></template>

<template data-pop="i49-d-cci" data-title="Vérapamil et diltiazem dans les extrasystoles">
<div class="lab">Mécanisme</div><p>Blocage du canal calcique de type L : moins d’entrée de calcium, donc moins de post-dépolarisations tardives ; ralentissement nodal. Particulièrement actifs sur les foyers de la chambre de chasse et sur les ESV fasciculaires, qui dépendent de tissus sensibles au calcium.</p>
<div class="lab">Preuves</div><p>Aucun grand essai randomisé dans les ESV idiopathiques : des études observationnelles et de petits essais montrent une réduction de la charge chez une minorité de patients, du même ordre que celle des bêtabloquants. La sensibilité des tachycardies fasciculaires au vérapamil est établie depuis les séries de <a href="https://pubmed.ncbi.nlm.nih.gov/7317238/" target="_blank" rel="noopener">Belhassen (1981)</a>.</p>
<div class="lab">Place (<a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">ESC 2022</a>)</div><p>Classe I, avec les bêtabloquants, pour les ESV idiopathiques symptomatiques d’origine autre que la chambre de chasse droite ou les fascicules ; alternative dans les ESV fasciculaires. Pour ces dernières, l’ESC 2022 en fait le médicament de premier choix lorsque l’ablation n’est pas retenue, en raison de leur sensibilité au vérapamil.</p>
<div class="lab">Posologie</div><p>Vérapamil 240 à 480 mg par jour, 480 mg au maximum en traitement continu ; diltiazem à libération prolongée 90 ou 120 mg deux fois par jour, 360 mg par jour au maximum, sans indication rythmique en Suisse (informations suisses Isoptin® et Dilzem®).</p>
<div class="lab">Effets indésirables</div><p>Constipation (vérapamil), œdèmes des chevilles, bradycardie, bloc auriculoventriculaire, hypotension.</p>
<div class="lab">Contre-indications</div><p>FEVG réduite (effet inotrope négatif) ; bloc auriculoventriculaire de haut degré ; fibrillation auriculaire pré-excitée ; tachycardie à QRS larges de mécanisme inconnu (voie intraveineuse). Dans la fibrillation auriculaire pré-excitée, freiner le nœud auriculoventriculaire laisse passer davantage d’influx par la voie accessoire, dont la période réfractaire est plus courte, ce qui expose à la FV.</p>
<div class="lab">Interactions</div><p>Bêtabloquants (bradycardie, bloc) ; inhibiteurs du CYP3A4 ; le vérapamil augmente la digoxinémie et les concentrations de certaines statines. Il élève la digoxinémie de 50 à 75 % pendant la première semaine et multiplie par 2,5 l’exposition à la simvastatine.</p></template>

<template data-pop="i49-d-ic" data-title="Flécaïnide (classe Ic) dans les extrasystoles">
<div class="lab">Mécanisme</div><p>Blocage du canal sodique rapide à dissociation lente : ralentissement de la conduction, surtout à fréquence rapide ; la flécaïnide réduit aussi les libérations spontanées de calcium, par un effet direct sur le récepteur de la ryanodine selon certains travaux, par le seul blocage sodique selon d’autres.</p>
<div class="lab">Preuves</div><p>Dans les ESV idiopathiques, la flécaïnide réduit la charge plus nettement que les bêtabloquants dans les études observationnelles et de petits essais. L’essai CAST (1989–1991) a montré une surmortalité sous flécaïnide et encaïnide chez des patients ayant fait un infarctus avec des ESV asymptomatiques. Les patients n’étaient inclus que si le médicament supprimait leurs ESV ; les morts rythmiques ont pourtant été près de trois fois plus nombreuses sous traitement (43 contre 16, après 10 mois en moyenne). Sur cœur malade, supprimer les ESV ne prouve donc aucun bénéfice.</p>
<div class="lab">Place (<a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">ESC 2022</a>)</div><p>Classe IIa, au même titre que l’ablation, pour les ESV idiopathiques symptomatiques d’origine autre que la chambre de chasse droite ou les fascicules ; alternative quand l’ablation n’est pas possible ou souhaitée. Dans la cardiomyopathie induite par les ESV, l’ESC 2022 l’admet aussi (classe IIa) chez des patients choisis, à dysfonction seulement modérée et surtout porteurs d’un défibrillateur, quand l’ablation n’est pas souhaitée, paraît risquée ou a échoué ; dans une série rétrospective de 20 patients traités par un antiarythmique de classe Ic (flécaïnide ou propafénone), souvent après une ablation infructueuse, la charge est passée de 36 % à 10 % et la FEVG de 37 % à 49 %, sans arythmie ventriculaire soutenue pendant 3,8 années de traitement en moyenne (Hyman et al., <i>Heart Rhythm</i> 2018;15:159-163).</p>
<div class="lab">Conditions de sécurité</div><p>Cœur structurellement normal (échocardiographie, et IRM en cas de doute), pas de cardiopathie ischémique, FEVG normale, pas de trouble de conduction significatif, pas de syndrome de Brugada. Chaque condition écarte un terrain où le ralentissement de conduction devient dangereux : la cicatrice favorise la réentrée, le trouble de conduction peut évoluer vers un bloc, et le blocage sodique accentue le Brugada. La flécaïnide est en outre inotrope négative et peut aggraver une insuffisance cardiaque, surtout si la FEVG est inférieure à 30 % ; l’exigence d’une FEVG normale ne souffre que l’exception de la cardiomyopathie induite à dysfonction modérée. Associer un freinateur nodal s’il existe aussi une arythmie auriculaire.</p>
<div class="lab">Posologie</div><p>Flécaïnide dans les arythmies ventriculaires : 100 mg deux fois par jour au départ, à l’hôpital, puis 100 à 150 mg deux fois par jour, 200 mg deux fois par jour au maximum ; 50 mg 2 à 3 fois par jour sous 60 kg ; demi-dose si la clairance est ≤ 35 mL/min/1,73 m², car la demi-vie peut alors atteindre environ 5 jours (information suisse Tambocor®). La propafénone n’a plus d’information professionnelle suisse en vigueur.</p>
<div class="lab">Surveillance</div><p>ECG une à deux semaines après le début et après chaque augmentation de dose (ESC 2022) ; élargissement du QRS de plus de 25 % : réduire ; épreuve d’effort sous ECG, exigée par l’information suisse une fois l’équilibre atteint (4 à 5 jours), au début et après chaque augmentation de dose, pour détecter l’élargissement dépendant de la fréquence ; concentration sérique ≤ 1 000 ng/mL. Inhibiteurs du CYP2D6 : prudence.</p></template>

<template data-pop="i49-d-propra" data-title="Propranolol à faible dose dans le POTS">
<div class="lab">Mécanisme</div><p>Bêtabloquant non sélectif et lipophile : réduit la tachycardie orthostatique et les symptômes adrénergiques (tremblement, anxiété, palpitations).</p>
<div class="lab">Preuves</div><p>Dans un essai croisé (<a href="https://pubmed.ncbi.nlm.nih.gov/19687359/" target="_blank" rel="noopener">Raj et coll., 2009</a>), 20 mg améliorait les symptômes mieux que 80 mg, qui réduisait davantage la fréquence mais était moins bien toléré. La tachycardie étant une compensation, la réduire trop aggrave la fatigue. Le propranolol à libération prolongée n’améliorait pas la qualité de vie.</p>
<div class="lab">Place</div><p>Classe IIb (<a href="https://doi.org/10.1016/j.hrthm.2015.03.029" target="_blank" rel="noopener">consensus HRS/EHRA 2015</a>), surtout dans les formes à tachycardie marquée ou hyperadrénergiques.</p>
<div class="lab">Posologie</div><p>10 à 20 mg, une à deux fois par jour.</p>
<div class="lab">Effets indésirables et précautions</div><p>Fatigue, hypotension, bronchospasme (asthme : éviter, car le propranolol bloque aussi les récepteurs β2 bronchiques), cauchemars ; prudence en cas de dépression sévère ou de trouble des conduites alimentaires avec bradycardie.</p></template>

<template data-pop="i49-d-iva" data-title="Ivabradine dans le POTS">
<div class="lab">Mécanisme</div><p>Blocage sélectif du courant If (canal HCN4) du nœud sinusal : baisse de la fréquence sinusale sans effet sur la pression artérielle ni sur la contractilité. C’est un avantage chez le patient dont la pression est basse et qui tolère mal les bêtabloquants.</p>
<div class="lab">Preuves</div><p>Petit essai randomisé contre placebo dans le POTS hyperadrénergique (<a href="https://pubmed.ncbi.nlm.nih.gov/33602468/" target="_blank" rel="noopener">Taub et coll., 2021</a>) : baisse de la fréquence debout et amélioration de la qualité de vie. L’essai portait sur 22 patients, traités un mois par chaque produit ; il ne renseigne pas sur l’effet à long terme. Utilisation hors indication en Suisse, où l’ivabradine est autorisée pour l’angor et l’insuffisance cardiaque.</p>
<div class="lab">Posologie</div><p>Selon l’information suisse (angor, insuffisance cardiaque) : 5 mg deux fois par jour au plus au départ avant 75 ans, 2,5 mg deux fois par jour dès 75 ans, 7,5 mg deux fois par jour au maximum ; dose réduite si la fréquence de repos descend sous 50/min.</p>
<div class="lab">Effets indésirables</div><p>Phosphènes (perception lumineuse transitoire), bradycardie, fibrillation auriculaire. Les phosphènes viennent du blocage d’un courant rétinien très proche du courant If, lors des changements brusques de luminosité ; ils disparaissent le plus souvent pendant le traitement.</p>
<div class="lab">Contre-indications et interactions</div><p>Grossesse et allaitement : contraception efficace chez la femme en âge de procréer, ce qui concerne la majorité des patientes atteintes de POTS. Les études animales ont montré des effets embryotoxiques et tératogènes. Vérapamil, diltiazem et inhibiteurs puissants du CYP3A4 : contre-indiqués.</p></template>

<template data-pop="i49-d-fludro" data-title="Fludrocortisone">
<div class="lab">Mécanisme</div><p>Minéralocorticoïde de synthèse : réabsorption rénale de sodium et d’eau, expansion du volume plasmatique, sensibilisation des vaisseaux aux catécholamines. Selon le <a href="https://doi.org/10.1016/j.hrthm.2015.03.029" target="_blank" rel="noopener">consensus HRS/EHRA 2015</a>, l’effet de rétention sodée pourrait ne durer qu’un à deux jours, et aucun grand essai randomisé n’a évalué la fludrocortisone dans le POTS.</p>
<div class="lab">Preuves</div><p>Données limitées dans le POTS : études observationnelles et un essai pédiatrique de petite taille ; la preuve la plus solide concerne la syncope réflexe (essai POST 2, 2016, réduction non significative des récidives en analyse principale).</p>
<div class="lab">Place</div><p>Classe IIb dans le POTS (consensus HRS/EHRA 2015), surtout dans le profil hypovolémique, lorsque l’apport d’eau et de sel ne suffit pas. Hors indication officielle pour cette maladie.</p>
<div class="lab">Posologie</div><p>0,05 à 0,1 mg par jour, jusqu’à 0,2 mg par jour ; l’information suisse (insuffisance surrénale) indique 0,1 mg par jour en règle, de 0,1 mg trois fois par semaine à 0,2 mg par jour, et pas plus de 0,05 mg par jour si une hypertension apparaît.</p>
<div class="lab">Effets indésirables</div><p>Hypokaliémie (contrôle du potassium à 1–2 semaines puis périodiquement), hypertension, œdèmes, céphalées, prise de poids. Le tube distal réabsorbe le sodium en excrétant du potassium, d’où l’hypokaliémie ; la rétention de sel et d’eau explique l’hypertension, les œdèmes et le gain de poids.</p>
<div class="lab">Précautions</div><p>Insuffisance cardiaque, hypertension, insuffisance rénale ; association avec des médicaments allongeant le QT ou la digoxine (l’hypokaliémie potentialise leur toxicité). L’expansion du volume plasmatique aggrave les trois premières situations.</p></template>

<template data-pop="i49-d-midodrine" data-title="Midodrine">
<div class="lab">Mécanisme</div><p>Promédicament transformé en désglymidodrine, agoniste des récepteurs α1 : vasoconstriction artérielle et veineuse, meilleur retour veineux. Il ne passe pas la barrière hémato-encéphalique.</p>
<div class="lab">Preuves</div><p>Dans le POTS, études aiguës contre placebo (<a href="https://pubmed.ncbi.nlm.nih.gov/23978222/" target="_blank" rel="noopener">Ross et coll., 2014</a>) : baisse de la tachycardie orthostatique, surtout dans le phénotype à débit sanguin périphérique bas. Dans la syncope réflexe, l’essai POST 4 (2021) a réduit les récidives.</p>
<div class="lab">Place</div><p>Hypotension orthostatique (indication autorisée) ; POTS à vasoconstriction insuffisante (classe IIb, <a href="https://doi.org/10.1016/j.hrthm.2015.03.029" target="_blank" rel="noopener">consensus HRS/EHRA 2015</a>, hors indication). Il agit environ 4 heures : il se prend quand le patient doit être debout.</p>
<div class="lab">Posologie</div><p>Selon l’information suisse (hypotension orthostatique) : 2,5 mg 2 à 3 fois par jour au départ, augmenté environ chaque semaine, 30 mg par jour au maximum en 3 prises ; dernière prise au moins 4 heures avant le coucher ; pression assise et couchée contrôlée au moins deux fois par semaine au début.</p>
<div class="lab">Effets indésirables</div><p>Hypertension en décubitus (le patient ne s’allonge pas dans les heures qui suivent la prise), piloérection, fourmillements et prurit du cuir chevelu, rétention urinaire, bradycardie réflexe. Ces effets viennent de la stimulation α1 des vaisseaux, des muscles arrecteurs des poils et du col vésical ; la bradycardie est la réponse des barorécepteurs à la hausse de pression.</p>
<div class="lab">Contre-indications</div><p>Cardiopathie sévère, hypertension, rétention urinaire, phéochromocytome, thyrotoxicose, insuffisance rénale aiguë. Dans le phéochromocytome et la thyrotoxicose, l’effet α1 s’ajoute à un excès adrénergique ; le rein élimine le métabolite actif, dont l’insuffisance rénale prolonge l’effet.</p></template>

<template data-pop="i49-d-pyrido" data-title="Pyridostigmine">
<div class="lab">Mécanisme</div><p>Inhibiteur de l’acétylcholinestérase : augmente l’acétylcholine dans les ganglions autonomes (transmission sympathique vers les vaisseaux) et aux terminaisons vagales (ralentissement cardiaque). Elle renforce surtout une transmission déjà sollicitée, c’est-à-dire debout ; dans l’hypotension orthostatique neurogène, elle améliorait la pression debout sans élever la pression couchée, à la différence de la midodrine.</p>
<div class="lab">Preuves</div><p>Essai croisé aigu contre placebo (<a href="https://pubmed.ncbi.nlm.nih.gov/15911704/" target="_blank" rel="noopener">Raj et coll., 2005</a>) : réduction modeste de la fréquence debout et des symptômes ; données au long cours observationnelles.</p>
<div class="lab">Place</div><p>POTS (classe IIb, <a href="https://doi.org/10.1016/j.hrthm.2015.03.029" target="_blank" rel="noopener">consensus HRS/EHRA 2015</a>, hors indication) ; intéressante en cas de constipation associée, car l’acétylcholine stimule la motricité intestinale ; autorisée en Suisse pour la myasthénie et l’atonie intestinale.</p>
<div class="lab">Posologie</div><p>L’essai de Raj et coll. (2005) a étudié une dose unique de 30 mg. Aucune recommandation européenne ni l’information suisse ne fixe de dose d’entretien dans le POTS ; l’information suisse indique, dans la myasthénie, 1 à 3 dragées de 60 mg 2 à 4 fois par jour, et rappelle que la pyridostigmine est éliminée surtout par le rein.</p>
<div class="lab">Effets indésirables</div><p>Crampes abdominales, diarrhée, nausées, hypersalivation, fasciculations, bradycardie.</p>
<div class="lab">Contre-indications</div><p>Obstruction digestive ou urinaire mécanique ; prudence dans l’asthme et avec les bêtabloquants (bradycardie). L’acétylcholine contracte les bronches et augmente leurs sécrétions ; associée au bêtabloquant, elle additionne deux freins du sinus.</p></template>
<template data-pop="i49-ch-flec" data-title="Flécaïnide et sotalol : écarts entre l’ESC 2022 et l’information suisse"><div class="lab">Règle</div><p>Pour l’examen fédéral et la prescription en Suisse, l’information professionnelle approuvée par Swissmedic fixe les indications, les contre-indications et les doses. Quand une recommandation européenne va plus loin, l’usage devient hors indication et relève d’une décision spécialisée documentée.</p>
<div class="lab">Flécaïnide et fonction ventriculaire</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">ESC 2022</a> admet la flécaïnide (classe IIa) dans une cardiomyopathie induite par les ESV, chez un patient choisi à dysfonction modérée, surtout s’il porte un défibrillateur. L’information suisse de Tambocor® la contre-indique en cas de baisse de la fonction ventriculaire gauche, d’infarctus présent ou ancien, de valvulopathie hémodynamiquement significative, de syndrome de Brugada et de troubles du rythme asymptomatiques ; elle la réserve, dans les arythmies ventriculaires, aux extrasystoles résistant aux autres antiarythmiques chez le patient sans cardiopathie, avec début du traitement à l’hôpital. La raison est la même dans les deux textes : la flécaïnide ralentit la conduction et déprime la contraction, ce qui devient dangereux sur un myocarde malade.</p>
<div class="lab">Flécaïnide et rein</div><p>L’ESC 2022 contre-indique la flécaïnide sous 35 mL/min/1,73 m². L’information suisse l’admet avec prudence à demi-dose (50 mg deux fois par jour ou 100 mg une fois par jour), car la demi-vie peut atteindre environ 5 jours : la dose n’est ajustée qu’après 7 jours, avec un dosage plasmatique hebdomadaire jusqu’à l’équilibre.</p>
<div class="lab">Sotalol et rein</div><p>L’ESC 2022 contre-indique le sotalol sous 30 mL/min. L’information suisse de Sotalol Mepha® réduit la dose de moitié de 30 à 60 mL/min et au quart de 10 à 30 mL/min, déconseille le traitement sous 10 mL/min et contre-indique le médicament dans l’insuffisance rénale grave ; elle demande de repenser le traitement si le QTc dépasse 500 ms. Le sotalol, non métabolisé, s’accumule quand la filtration baisse et allonge le QT.</p>
<div class="lab">Sources</div><p><a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">Recommandations ESC 2022 sur les arythmies ventriculaires</a>, tableau 8 et recommandations sur la cardiomyopathie induite ; informations professionnelles suisses <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=45711" target="_blank" rel="noopener">Tambocor®</a> et <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54553" target="_blank" rel="noopener">Sotalol Mepha®</a>, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
