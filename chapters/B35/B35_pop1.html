<p>Dermatophyte émergent, anciennement génotype VIII de <i>T. mentagrophytes</i> ; dermatophyties étendues, chroniques, souvent résistantes à la terbinafine. Zurich : 35 cas de 2014 à 2024 ; mutation de la squalène époxydase dans 80 % des isolats jusqu’en 2025 ; traitement plus long et souvent par itraconazole ; récidive chez un tiers des patients.</p><div class="src">Sources : <a href="https://doi.org/10.1111/ddg.70394" target="_blank" rel="noopener" data-reference-source="1">Lechner AH et al., émergence de <i>Trichophyton indotineae</i> en Suisse (2014–2025), J Dtsch Dermatol Ges 2026</a> ; <a href="https://doi.org/10.1111/jdv.70731" target="_blank" rel="noopener" data-reference-source="1">Gupta AK et al., recommandations de consensus Delphi sur <i>T. indotineae</i>, J Eur Acad Dermatol Venereol 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b35-pa-bordure" data-title="Bordure active">
<p>Bord de la lésion rouge, squameux, parfois vésiculeux, où le champignon progresse ; le centre s’éclaircit. C’est là qu’il faut gratter les squames pour l’examen direct.</p><div class="src">Source : <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>. Textes lus le 9 octobre 2026.</div>
</template>

<p>Plaques d’alopécie squameuses de l’enfant ; parfois kérion inflammatoire suppuré. Agents en Suisse : <i>M. canis</i> (zoophile) ; <i>T. violaceum</i> et <i>T. soudanense</i> (anthropophiles). Traitement toujours oral : terbinafine 4 semaines selon l’information suisse.</p><div class="src">Sources : <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a>. Textes lus le 9 octobre 2026.</div>

<template data-pop="b35-p-local" data-title="Antifongiques locaux">
<p>Terbinafine crème 1 à 2 fois par jour, en couche mince sur la lésion et sa périphérie après nettoyage et séchage ; azolés en crème en alternative. Indiqués pour les dermatophyties limitées de la peau et du pied.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=51307" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Lamisil® Crème, novembre 2023</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b35-p-terb" data-title="Terbinafine orale">
<p>250 mg une fois par jour ; uniquement si le traitement local ne suffit pas. Durée : peau glabre et plis 2 à 4 semaines ; pied 2 à 6 ; cuir chevelu 4 ; ongles 6 à 12. Contre-indiquée en cas de maladie hépatique ; transaminases avant, puis toutes les 4 à 6 semaines.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b35-p-itra" data-title="Itraconazole">
<p>Peau glabre : 100 mg par jour, 2 semaines ; pied : 100 mg par jour, 4 semaines ; ongles : traitement intermittent ou continu. <i>T. indotineae</i> : 100 à 200 mg par jour pendant 6 à 8 semaines ou plus. Contre-indications : insuffisance cardiaque, nombreuses associations avec des substrats du CYP3A4, grossesse.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49610" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sporanox®, novembre 2024</a> ; <a href="https://doi.org/10.1111/jdv.70731" target="_blank" rel="noopener" data-reference-source="1">Gupta AK et al., recommandations de consensus Delphi sur <i>T. indotineae</i>, J Eur Acad Dermatol Venereol 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b35-s-sqle" data-title="Squalène époxydase">
<p>Enzyme de la synthèse de l’ergostérol, cible de la terbinafine. Ses mutations élèvent fortement la concentration minimale inhibitrice de la terbinafine sans toucher l’itraconazole.</p><div class="src">Source : <a href="https://doi.org/10.1111/ddg.70394" target="_blank" rel="noopener" data-reference-source="1">Lechner AH et al., émergence de <i>Trichophyton indotineae</i> en Suisse (2014–2025), J Dtsch Dermatol Ges 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-b35-clinique" data-title="Loi de Pareto — Reconnaître une dermatophytie">
<p class="ratio" data-cover="b35-pa-1,b35-pa-3,b35-pa-4,b35-pa-5,b35-pa-6,b35-pa-7,b35-pa-8"></p><ul><li>La lésion typique est une plaque annulaire à bordure active.</li><li>Pied et ongle : <i>T. rubrum</i>.</li><li>Chez l’enfant au contact d’animaux, les espèces sont zoophiles.</li><li>On confirme le diagnostic si l’atteinte est atypique, étendue, unguéale ou du cuir chevelu.</li></ul>
</template>
<template data-pop="pareto-b35-traitement" data-title="Loi de Pareto — Traiter une dermatophytie">
<p class="ratio" data-cover="b35-pa-9,b35-pa-10,b35-pa-11"></p><ul><li>Une atteinte cutanée limitée se traite localement.</li><li>L’ongle, le cuir chevelu et les formes étendues se traitent par terbinafine orale.</li><li>Échec : <i>T. indotineae</i>, itraconazole.</li></ul>
</template>
<template data-pop="pareto-b35-examens" data-title="Loi de Pareto — Examens des dermatophyties">
<p class="ratio" data-cover="b35-e-1,b35-e-2"></p><ul><li>Le diagnostic repose sur l’examen direct et la culture.</li><li>PCR pour <i>T. indotineae</i>.</li><li>On dose les transaminases avant la terbinafine.</li></ul>
</template>
<template data-pop="pareto-b35-pharma" data-title="Loi de Pareto — Pharmacologie antifongique">
<p class="ratio" data-cover="b35-p-1,b35-p-2,b35-p-3"></p><ul><li>La terbinafine expose à une toxicité hépatique.</li><li>L’itraconazole expose à une insuffisance cardiaque, interagit par le CYP3A4 et doit être évité pendant la grossesse.</li></ul>
</template>
