<div class="chap-head"><div class="code">B35 — Dermatophytose · CIM-10-GM 2024 · I-03-Infectiologie</div><h1>Dermatophytoses</h1><span class="status">Version de travail · Sources lues le 9 octobre 2026 : études suisses de Lausanne (2020) et de Zurich (2026) ; revue systématique européenne (2025) et consensus Delphi (2026) sur <i>Trichophyton indotineae</i> ; informations professionnelles suisses (Swissmedic). Il n’existe ni directive de la Société suisse d’infectiologie ni recommandation européenne récente sur les dermatophyties de la peau glabre : le traitement s’appuie donc sur l’information professionnelle suisse. Relecture médicale humaine non encore effectuée.</span></div>

<section class="ilot" id="b35-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme L., 38 ans, consulte pour une plaque annulaire du bras, qui s’étend depuis un mois ; or, sa fille joue avec un cobaye récemment acquis. Ainsi, ce tableau évoque une <button class="w" data-k="b35-pa-def">dermatophytie</button> transmise par un animal. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, comment reconnaître les différentes formes ? Ensuite, quand confirmer le diagnostic avant de traiter ? Puis, quand un traitement oral est-il nécessaire ? Enfin, que faire devant une dermatophytie étendue qui résiste à la terbinafine ?</p>
<div class="key"><b>À retenir.</b> Le traitement est local pour la peau, oral pour les ongles et le cuir chevelu.</div></section>

<section class="ilot" id="b35-pa-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Pour répondre à ces questions, il faut d’abord définir la maladie. Les dermatophyties sont des mycoses superficielles dues à des champignons filamenteux kératinophiles, les <button class="w" data-k="b35-s-dermato">dermatophytes</button>, qui infectent la couche cornée, les ongles et les poils. Par ailleurs, elles se classent selon le site atteint, et selon le réservoir de l’agent. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</p>
<table class="t"><thead><tr><th>Site</th><th>Nom latin</th><th>Agent dominant en Suisse</th></tr></thead><tbody>
<tr><td>Peau glabre</td><td><i>Tinea corporis</i></td><td>Zoophiles chez l’enfant ; <i>T. rubrum</i> chez l’adulte</td></tr>
<tr><td>Plis inguinaux</td><td><i>Tinea cruris</i></td><td><i>T. rubrum</i></td></tr>
<tr><td>Pieds</td><td><i>Tinea pedis</i></td><td><i>T. rubrum</i>, <i>T. interdigitale</i></td></tr>
<tr><td>Ongles</td><td><i>Tinea unguium</i></td><td><i>T. rubrum</i>, <i>T. interdigitale</i></td></tr>
<tr><td>Cuir chevelu</td><td><i>Tinea capitis</i></td><td><i>M. canis</i>, <i>T. violaceum</i>, <i>T. soudanense</i></td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> La nomenclature latine désigne le siège, non l’agent ; or, l’agent dépend du réservoir. Ainsi, les espèces zoophiles, transmises par les animaux, dominent chez l’enfant, tandis que <i>T. rubrum</i>, anthropophile, domine sur les pieds et les ongles de l’adulte. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</div>
<p>Ainsi, le site oriente l’agent probable ; c’est pourquoi la classification topographique guide aussi le choix du traitement. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</p></section>

<section class="ilot" id="b35-pa-2"><h2><span class="n">2</span>Épidémiologie suisse</h2>
<p>Une fois la maladie classée, reste à en mesurer le poids en Suisse. Ainsi, l’étude du laboratoire de Lausanne porte sur 10 958 dermatophytes isolés de 2001 à 2018 : 99 % des onychomycoses et des pieds d’athlète étaient dus à <i>T. rubrum</i> et à <i>T. interdigitale</i>, dans un rapport de 3 pour 1. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</p>
<p>De plus, les espèces <button class="w" data-k="b35-pa-reservoir">zoophiles</button> — <i>T. mentagrophytes</i>, <i>T. benhamiae</i>, <i>M. canis</i> — prédominaient chez l’enfant et l’adulte jeune, avec pour réservoirs le chat et le chien, et le cobaye pour <i>T. benhamiae</i>. En outre, à Zurich, 35 cas de <button class="w" data-k="b35-pa-indo"><i>T. indotineae</i></button> ont été identifiés de 2014 à 2024, avec une nette hausse récente. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a> ; <a href="https://doi.org/10.1111/ddg.70394" target="_blank" rel="noopener" data-reference-source="1">Lechner AH et al., émergence de <i>Trichophyton indotineae</i> en Suisse (2014–2025), J Dtsch Dermatol Ges 2026</a>.</p>
<div class="key"><b>À retenir.</b> <i>T. rubrum</i> domine sur le pied et l’ongle, les espèces zoophiles touchent l’enfant au contact des animaux, et <i>T. indotineae</i> émerge.</div></section>

<section class="ilot" id="b35-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Ce tropisme tient à la biologie du champignon. En effet, les dermatophytes dégradent la kératine grâce à des protéases ; or, ils ne pénètrent pas au-delà de la couche cornée chez l’hôte immunocompétent. Ainsi, la réaction inflammatoire de l’hôte explique l’aspect typique : le champignon progresse en périphérie, tandis que le centre s’éclaircit, d’où la lésion annulaire. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</p>
<p>Par ailleurs, l’inflammation dépend du réservoir : les espèces zoophiles, mal adaptées à l’humain, donnent des lésions plus inflammatoires, tandis que les espèces anthropophiles comme <i>T. rubrum</i> donnent des lésions chroniques peu inflammatoires. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</p>
<div class="key"><b>Corrélation clinique.</b> Une plaque très inflammatoire chez un enfant doit faire chercher un animal de compagnie.</div></section>

<section class="ilot" id="b35-pa-4"><h2><span class="n">4</span>Dermatophytie de la peau glabre et des plis</h2>
<p>Ce mécanisme se traduit directement dans la clinique de la peau glabre. Ainsi, la <i>tinea corporis</i> forme une plaque arrondie, rouge, squameuse, à <button class="w" data-k="b35-pa-bordure">bordure active</button> et centre clair, souvent prurigineuse. De même, la <i>tinea cruris</i> atteint les plis inguinaux, avec une bordure nette, et s’associe souvent à un pied d’athlète. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a>.</p>

rmatophytie sur la peau" width="400" height="283" loading="lazy" decoding="async" style="max-width:100%;height:auto;border-radius:6px"><figcaption>Figure 1 — <i>Tinea corporis</i> : plaque arrondie à bordure rouge squameuse et centre plus clair, aspect typique d’une dermatophytie de la peau glabre. Photographie : Lucille K. Georg ; Centers for Disease Control and Prevention (États-Unis), <a href="https://commons.wikimedia.org/wiki/File:Ringworm_on_the_arm,_or_tinea_corporis_due_to_Trichophyton_mentagrophytes_PHIL_2938_lores.jpg" target="_blank" rel="noopener" data-reference-source="1">Wikimedia Commons</a>, licence domaine public ; réduite et convertie pour l’affichage.</figcaption></figure>
<div class="key"><b>Lecture et physiopathologie.</b> La plaque s’étend en anneau parce que le dermatophyte progresse vers la périphérie dans la couche cornée, qu’il digère grâce à ses kératinases ; au centre, la réponse inflammatoire contrôle l’infection, d’où l’éclaircissement. C’est pourquoi le prélèvement pour examen direct se fait sur la bordure active, où les filaments sont les plus nombreux. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</div>
<p>Par conséquent, l’aspect annulaire suggère fortement le diagnostic ; toutefois, il n’est pas spécifique, ce que l’îlot sur le diagnostic différentiel détaille.</p></section>

<section class="ilot" id="b35-pa-5"><h2><span class="n">5</span>Pied d’athlète</h2>
<p>Au pied, la forme la plus fréquente est interdigitale. En effet, le pied d’athlète donne une macération, des fissures et une desquamation entre les orteils, surtout le quatrième espace ; de plus, une forme plantaire hyperkératosique, dite « en mocassin », est plus chronique. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> La macération de l’espace interorteil offre chaleur et humidité, qui ramollissent la couche cornée et favorisent la croissance de <i>T. rubrum</i> et <i>T. interdigitale</i>, agents dominants en Suisse. Cette fissure est aussi une porte d’entrée bactérienne ; c’est pourquoi on la traite chez le patient qui fait des érysipèles. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</div>
<p>Or, ces fissures sont une porte d’entrée des streptocoques ; c’est pourquoi le traitement du pied d’athlète fait partie de la prévention de l’<a href="#/entry/A46">érysipèle</a>.</p></section>

<section class="ilot" id="b35-pa-6"><h2><span class="n">6</span>Onychomycose</h2>
<p>Le pied d’athlète non traité gagne volontiers les ongles. Ainsi, l’<button class="w" data-k="b35-pa-onycho">onychomycose</button> donne un ongle épaissi, jaunâtre, friable, décollé, en commençant le plus souvent par le bord libre. Cependant, d’autres affections, comme le psoriasis ou les traumatismes, donnent le même aspect ; c’est pourquoi un prélèvement mycologique doit précéder tout traitement oral. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a> ; <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> Le champignon envahit la tablette de l’ongle depuis le bord libre et la rend épaisse, jaunâtre et friable. Comme l’ongle pousse lentement et que la kératine est peu vascularisée, le traitement topique pénètre mal ; c’est pourquoi l’onychomycose exige un traitement oral de 6 à 12 semaines, après confirmation mycologique. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a>.</div>
<p>De plus, la guérison clinique est lente : selon l’information suisse, elle n’intervient souvent que quelques mois après la négativation mycologique, le temps que l’ongle sain repousse. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a>.</p></section>

<section class="ilot" id="b35-pa-7"><h2><span class="n">7</span>Teigne du cuir chevelu</h2>
<p>Chez l’enfant, la localisation la plus importante est le cuir chevelu. En effet, la <button class="w" data-k="b35-pa-capitis">teigne</button> donne des plaques d’alopécie squameuses, parfois inflammatoires et suppurées. Or, à Lausanne, <i>T. violaceum</i> et <i>T. soudanense</i>, anthropophiles et donc contagieux entre humains, sont surtout retrouvés chez des patients d’origine africaine ou méditerranéenne. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</p>
<p>Dès lors, la teigne impose un traitement oral : en effet, un antifongique local ne pénètre pas le follicule pileux. De plus, l’information suisse de la terbinafine prévoit 4 semaines dans la teigne. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a>.</p>
<div class="trap"><span class="k">Piège.</span> Une teigne inflammatoire suppurée (kérion) ressemble à un abcès : l’incision est inutile et le traitement est antifongique.</div></section>

<section class="ilot" id="b35-pa-8"><h2><span class="n">8</span>Diagnostic différentiel et pièges</h2>
<p>Avant de traiter, il faut écarter les affections qui imitent une dermatophytie.</p>
<table class="t"><thead><tr><th>Affection</th><th>Élément distinctif</th></tr></thead><tbody>
<tr><td>Eczéma nummulaire</td><td>Pas de centre clair, suintement</td></tr>
<tr><td>Psoriasis</td><td>Squames épaisses argentées, autres localisations</td></tr>
<tr><td>Intertrigo à <i>Candida</i></td><td>Rouge vif, lésions satellites pustuleuses (<a href="#/entry/B37">B37</a>)</td></tr>
<tr><td>Érythème migrant</td><td>Ni squame, ni prurit ; piqûre de tique (<a href="#/entry/A69">A69</a>)</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque affection imite la dermatophytie par un mécanisme différent : l’eczéma et le psoriasis sont inflammatoires sans champignon, et l’intertrigo candidosique est dû à une levure, d’où ses pustules satellites. Une corticothérapie locale appliquée à tort sur une dermatophytie la masque et l’étend ; c’est pourquoi on confirme en cas de doute. <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</div>
<p>Ainsi, aucun signe n’est absolument spécifique ; c’est pourquoi le consensus Delphi recommande l’examen direct et la culture devant une dermatophytie suspectée, en particulier si l’aspect est atypique ou étendu. <a href="https://doi.org/10.1111/jdv.70731" target="_blank" rel="noopener" data-reference-source="1">Gupta AK et al., recommandations de consensus Delphi sur <i>T. indotineae</i>, J Eur Acad Dermatol Venereol 2026</a>.</p>
<button class="pareto-btn ui" data-k="pareto-b35-clinique">▲ Loi de Pareto — Reconnaître une dermatophytie</button></section>

<section class="ilot" id="b35-pa-9"><h2><span class="n">9</span>Traitement local ou systémique</h2>
<p>Le diagnostic posé, le site décide de la voie. Ainsi, l’information suisse de la terbinafine orale précise qu’elle ne doit être utilisée que lorsque la mycose ne peut pas être traitée par voie topique. Par conséquent, une dermatophytie limitée de la peau ou du pied relève d’un <button class="w" data-k="b35-p-local">antifongique local</button>, comme la terbinafine en crème une à deux fois par jour. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=51307" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Lamisil® Crème, novembre 2023</a>.</p>
<p>En revanche, les formes étendues, les onychomycoses et la teigne nécessitent un traitement oral par <button class="w" data-k="b35-p-terb">terbinafine</button> 250 mg par jour, dont la durée dépend du site. Enfin, l’<button class="w" data-k="b35-p-itra">itraconazole</button> est l’alternative principale, avec davantage d’interactions. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49610" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sporanox®, novembre 2024</a>.</p>
<table class="t"><thead><tr><th>Site</th><th>Terbinafine orale 250 mg par jour (information suisse)</th></tr></thead><tbody>
<tr><td>Peau glabre, plis</td><td>2 à 4 semaines</td></tr><tr><td>Pied</td><td>2 à 6 semaines</td></tr><tr><td>Cuir chevelu</td><td>4 semaines</td></tr><tr><td>Ongles des mains / des pieds</td><td>6 semaines / 12 semaines dans la plupart des cas</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> La terbinafine s’accumule dans la kératine et y reste après l’arrêt ; c’est pourquoi des durées courtes suffisent pour la peau, alors que l’ongle, qui pousse lentement, exige 6 à 12 semaines. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a>.</div>
<button class="pareto-btn ui" data-k="pareto-b35-traitement">▲ Loi de Pareto — Traiter une dermatophytie</button></section>

<section class="ilot" id="b35-pa-10"><h2><span class="n">10</span>Trichophyton indotineae et résistance</h2>
<p>Ce schéma classique est cependant remis en cause par une espèce émergente. En effet, <i>T. indotineae</i> donne des dermatophyties étendues, chroniques, souvent résistantes à la terbinafine par mutation de la <button class="w" data-k="b35-s-sqle">squalène époxydase</button>. Ainsi, à Zurich, 80 % des isolats séquencés jusqu’en 2025 portaient une mutation ; de plus, ces infections ont exigé un traitement systémique nettement plus long, de 11,5 semaines contre 3,5, et souvent l’itraconazole. <a href="https://doi.org/10.1111/ddg.70394" target="_blank" rel="noopener" data-reference-source="1">Lechner AH et al., émergence de <i>Trichophyton indotineae</i> en Suisse (2014–2025), J Dtsch Dermatol Ges 2026</a>.</p>
<p>Dès lors, le consensus Delphi de 2026 recommande de suspecter <i>T. indotineae</i> devant une dermatophytie étendue ou résistante à la terbinafine, surtout après un séjour dans une région d’endémie ; de confirmer par PCR ou séquençage ; et de traiter par itraconazole 100 à 200 mg par jour pendant 6 à 8 semaines ou plus. Enfin, une revue européenne confirme que l’itraconazole est le traitement de deuxième ligne le plus utilisé. <a href="https://doi.org/10.1111/jdv.70731" target="_blank" rel="noopener" data-reference-source="1">Gupta AK et al., recommandations de consensus Delphi sur <i>T. indotineae</i>, J Eur Acad Dermatol Venereol 2026</a> ; <a href="https://doi.org/10.1111/jdv.20270" target="_blank" rel="noopener" data-reference-source="1">Ferreira CB, Lisboa C, revue systématique de <i>T. indotineae</i> résistant à la terbinafine en Europe, J Eur Acad Dermatol Venereol 2025;39:364-376</a>.</p>
<div class="key"><b>À retenir.</b> Devant une dermatophytie étendue rebelle à la terbinafine, il faut penser à <i>T. indotineae</i>, le confirmer et traiter par itraconazole.</div></section>

<section class="ilot" id="b35-pa-11"><h2><span class="n">11</span>Prévention des récidives</h2>
<p>Une fois l’infection traitée, reste à éviter qu’elle ne revienne. Ainsi, l’information suisse insiste sur une bonne hygiène corporelle et vestimentaire pour prévenir la réinfection par le linge, les chaussettes et les chaussures. De plus, le séchage des espaces interorteils et le traitement de l’animal source chez l’enfant complètent la prise en charge. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a> ; <a href="https://doi.org/10.3390/jof6020095" target="_blank" rel="noopener" data-reference-source="1">Bontems O et al., épidémiologie des dermatophyties en Suisse, Lausanne 2001–2018, J Fungi 2020;6:95</a>.</p>
<p>Par ailleurs, à Zurich, un tiers des patients infectés par <i>T. indotineae</i> ont récidivé ; toutefois, ces récidives ont généralement répondu à un nouveau traitement. <a href="https://doi.org/10.1111/ddg.70394" target="_blank" rel="noopener" data-reference-source="1">Lechner AH et al., émergence de <i>Trichophyton indotineae</i> en Suisse (2014–2025), J Dtsch Dermatol Ges 2026</a>.</p>
<p><b>Cas récapitulatif.</b> Pour conclure, Mme L. a une plaque unique : elle reçoit donc un antifongique local, et le cobaye est examiné par un vétérinaire, car <i>T. benhamiae</i> a pour réservoir le cobaye. En revanche, en cas d’extension ou d’échec, un prélèvement mycologique précéderait un traitement oral.</p></section>

<section class="ilot" id="b35-pa-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<p>En synthèse, les valeurs à retenir se résument ainsi.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Agents des pieds et ongles en Suisse</td><td>99 % <i>T. rubrum</i> et <i>T. interdigitale</i> (3 pour 1)</td></tr>
<tr><td>Terbinafine orale</td><td>250 mg par jour ; durée selon le site</td></tr>
<tr><td>Contrôle hépatique sous terbinafine</td><td>Transaminases avant, puis toutes les 4 à 6 semaines</td></tr>
<tr><td><i>T. indotineae</i> : mutation à Zurich</td><td>80 % des isolats jusqu’en 2025</td></tr>
<tr><td><i>T. indotineae</i> : traitement</td><td>Itraconazole 100 à 200 mg par jour, 6 à 8 semaines ou plus</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque paramètre traduit une décision : la prédominance de <i>T. rubrum</i> explique l’efficacité habituelle de la terbinafine, et le contrôle des transaminases prévient une hépatotoxicité rare mais grave. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57174" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Terbinafin-Mepha® comprimés, mai 2026</a>.</div>
