<template data-pop="g05-ganciclovir" data-title="Cymevene et Foscavir : indications distinctes">
<p data-src="R4">Cymevene IV : la dose d’induction usuelle de la FI, à fonction rénale normale, est 5 mg/kg toutes les 12 h pendant 14–21 jours, perfusée sur une heure. Les indications visent les infections graves à CMV mettant en jeu la vie ou la vision dans les terrains définis ; ce n’est pas un protocole d’encéphalite de toute cause. L’utilisation avant 18 ans n’est pas homologuée dans cette FI ; efficacité/sécurité ne sont pas établies pour toutes les situations congénitales ou immunocompétentes.</p>

<p data-src="R4">Ne pas commencer si neutrophiles&lt;500/µL, plaquettes&lt;25 000/µL ou hémoglobine&lt;8 g/dL. Surveiller hémogramme, rein et hydratation ; les associations myélotoxiques ou néphrotoxiques majorent le risque. L’association à imipénem/cilastatine a été liée à des convulsions. La rubrique contre-indications mentionne la grossesse ; la rubrique reproduction décrit l’exception d’un bénéfice maternel justifiant le risque : cette tension réglementaire impose un avis spécialisé, pas une formule rassurante. Allaitement à éviter ; contraception féminine pendant et 30 jours après, méthode barrière masculine pendant et 90 jours après selon FI.</p>
<p data-src="R31"><b>Foscavir n’est pas un équivalent de ganciclovir.</b> La FI suisse propose pour rétinite CMV du sida 60 mg/kg toutes les 8 h sur au moins 1 h, ou 90 mg/kg toutes les 12 h sur au moins 2 h, en induction de 2–3 semaines. Pour HSV <b>mucocutané</b> résistant, elle décrit 40 mg/kg toutes les 8 h. Les 60 mg/kg toutes les 8 h utilisés dans certaines recommandations neurologiques sont un contexte distinct, non une dose homologuée universelle du HSV.</p>
<p data-src="R31">Les tables rénales du foscarnet utilisent une clairance en<b>mL/min/kg</b>, différente du mL/min des tableaux précédents. En dessous de 0,4 mL/min/kg, la FI ne recommande pas le traitement ; l’hémodialyse n’a pas de régime recommandé dans cette FI. Utiliser sa table complète et l’avis pharmaceutique plutôt qu’une interpolation improvisée. Contrôler créatinine tous les deux jours pendant l’induction puis au moins hebdomadairement en entretien, et adapter à l’état clinique.</p>
<p data-src="R31">Hydrater selon la tolérance ; surveiller calcium ionisé, magnésium et autres ions ainsi que le risque QT. Une hypocalcémie ionisée est possible malgré un calcium total normal. Par voie périphérique, diluer la solution 24 mg/mL à 12 mg/mL ou moins selon FI. Ne pas mélanger ni administrer simultanément dans la même ligne avec ganciclovir, aciclovir, cotrimoxazole, vancomycine ou solutions contenant des cations divalents : une association thérapeutique n’autorise pas une association dans la tubulure. Grossesse et allaitement : ne pas administrer selon FI ; éviter une conception paternelle pendant six mois après traitement.</p>

<template data-pop="g05-amoxicilline" data-title="Amoxicilline, pénicillineG et ceftriaxone">
<p data-src="R5,R26"><b>Amoxicillin OrPha IV.</b> Pour une infection grave de l’adulte&gt;40 kg, la FI autorise 2 g en perfusion courte de 30 min,3–6 fois/jour, maximum 12 g/j. La SSI utilise 2 g toutes les 4 h pour la couverture de Listeria dans les situations de risque. Sa FI ne fixe pas toute la durée d’une neurolistériose ; sensibilité, foyer et évolution guident le spécialiste.</p>
<p data-src="R5">La table rénale générale de la FI prévoit, après charge 1 g,0,5–1 g toutes les 12 h pour clairance 10–30 mL/min et 0,5 g toutes les 24 h sous 10 mL/min ; une dose supplémentaire 1 g après hémodialyse est décrite. Ces règles générales ne doivent pas être appliquées mécaniquement à une infection du SNC sans vérifier exposition et gravité. Surveiller rein, cristallurie, hémogramme, foie et INR selon contexte ; interactions avec méthotrexate et anticoagulants à considérer. Contre-indications allergiques, mononucléose/leucémie lymphoïde et réactions cutanées graves sont à vérifier. Ne pas utiliser de lidocaïne en IV ni mélanger avec un aminoside. Pendant la grossesse, la FI demande de la prudence ; l’allaitement doit être interrompu pendant le traitement selon ce produit exact.</p>
<p data-src="R7,R9"><b>Penicilline Grünenthal.</b> La benzylpénicilline sodique est adaptée à la neurosyphilis selon le schéma causal, distinct des doses générales 20–60 MUI/j de la FI. Un million d’UI correspond ici à 599 mg de substance et 38,6 mg de sodium ;10 MUI apportent 386 mg de sodium. Au-delà de 2 MUI, injection IV lente, au maximum 0,5 MUI/min selon FI. Prendre en compte surcharge sodée, hypokaliémie, allergie, fonction rénale et neurotoxicité avec convulsions. Les interactions avec méthotrexate et probénécide demandent attention.</p>
<p data-src="R9">La FI permet l’emploi pendant la grossesse. Pendant l’allaitement, de petites quantités passent dans le lait, avec risque de sensibilisation ou troubles digestifs chez l’enfant à surveiller. Une réaction de Jarisch–Herxheimer précoce ne doit pas être confondue avec une réaction allergique immédiate ; l’évaluation clinique décide de la conduite.</p>
<p data-src="R16,R26,R7"><b>Ceftriaxon Labatec.</b> La SSI utilise 2 g IV toutes les 12 h dans la méningite bactérienne communautaire adulte ; la neurosyphilis relève du schéma 2 g/j pendant 14 jours de DGN 2026. Si clairance&lt;10 mL/min, la FI limite à 2 g/j ; même plafond chez le patient dialysé, sans supplément après dialyse. Une insuffisance rénale et hépatique grave associée impose une surveillance clinique renforcée. Une infection nécessitant une exposition élevée et ces limites rénales doit être discutée avec infectiologie/pharmacie.</p>
<p data-src="R16">Ne pas mélanger la ceftriaxone aux solutions contenant du calcium. Chez le nouveau-né, prématurité, hyperbilirubinémie et nécessité de calcium IV comportent des contre-indications spécifiques ; chez les patients plus âgés, une administration séquentielle peut être possible avec rinçage approprié selon FI. Rechercher allergie, hémolyse, réactions cutanées graves et neurotoxicité. Pendant la grossesse, indication stricte ; allaitement interrompu selon la FI relue.</p>

<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680688150018">R5 — Amoxicillin OrPha IV, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13499315/">R7 — German guideline on neurosyphilis 2026</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680562710024">R9 — Penicilline Grünenthal, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680598760031">R16 — Ceftriaxon Labatec IV/IM, FI suisse</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://ssi.guidelines.ch/guideline/2315/fr">R26 — SSI : méningite, version française</a>.</p></template>

<template data-pop="g05-pyrimethamine" data-title="Toxoplasmose : produits et calculs">
<p data-src="R10,R15"><b>Le rapport TMP/SMX est 1:5.</b> Une ampoule de Bactrim IV de 5 mL contient 80 mg de triméthoprime et 400 mg de sulfaméthoxazole. Le schéma HAS 15/75 mg/kg/j correspond à la dose <b>quotidienne totale</b>, divisée en trois administrations ; il ne faut pas donner 15 mg/kg de TMP à chaque prise. La toxoplasmose n’est pas nommée dans les indications de cette FI, et sa durée de six semaines ne doit pas être confondue avec les durées usuelles IV ou la pneumocystose homologuées.</p>
<p data-src="R15">Pour Bactrim IV, clairance&gt;30 mL/min : posologie habituelle ;15–30 : moitié de la posologie ;&lt;15 : contre-indication selon FI. L’hémodialyse a des indications spécifiques de dose après séance et de suivi des concentrations ; la dialyse péritonéale n’est pas recommandée. Surveiller kaliémie, créatinine et hémogramme, particulièrement avec autres médicaments hyperkaliémiants ou myélotoxiques. Dofétilide est contre-indiqué ; méthotrexate et phénytoïne exposent à des interactions importantes.</p>
<p data-src="R15">Le concentré doit être dilué, jamais injecté en bolus : une ampoule dans 125 mL de solution compatible est le schéma habituel ; perfusion 30–60 min, au maximum 90 min. Une restriction hydrique peut justifier la dilution spécifique d’une ampoule dans 75 mL prévue par FI, avec les solutés autorisés. Tenir compte des excipients éthanol et propylène glycol. Déficit G6PD, réactions cutanées graves et restrictions néonatales/grossesse sont à vérifier ; le troisième trimestre est contre-indiqué. Ne pas extrapoler une désensibilisation après une réaction cutanée grave. En début de grossesse, si le cotrimoxazole est indispensable sans alternative, la FI recommande une supplémentation en acide folique de 5 mg/j ; cela ne remplace pas le folinate requis avec pyriméthamine. Pendant l’allaitement, mettre en balance le bénéfice maternel et les risques pour le nourrisson, notamment ictère nucléaire et hypersensibilité, selon âge et terrain.</p>
<p data-src="R8,R10"><b>Daraprim.</b> La pyriméthamine inhibe la dihydrofolate-réductase ; sa longue demi-vie favorise une toxicité persistante. Toujours associer sulfamide et folinate dans le régime concerné. La FI demande une numération au moins hebdomadaire et pendant deux semaines après l’arrêt ; chez l’immunodéprimé, au moins deux fois par semaine. Le premier trimestre est contre-indiqué et l’allaitement doit être interrompu. Méthotrexate, triméthoprime, zidovudine et autres myélotoxiques peuvent majorer le risque.</p>
<table class="t"><thead><tr><th>Sulfadiazine exacte</th><th>Règle lue</th><th>Pourquoi ne pas fusionner</th></tr></thead><tbody><tr><td data-src="R10,R11,R12">Sulfadiazin-Heyl 500 mg, RCP allemand août 2020</td><td data-src="R10,R11,R12">Adulte 50 mg/kg/j, maximum 4 g/j, répartis en quatre prises.</td><td data-src="R10,R11,R12">Clairance&lt;25 mL/min contre-indiquée ; premier trimestre contre-indiqué ; hydratation et diurèse suffisantes.</td></tr><tr><td data-src="R10,R11,R12">ADIAZINE 500 mg, RCP français juillet 2018</td><td data-src="R10,R11,R12">Adulte 4–6 g/j en 4–6 prises ; association à pyriméthamine.</td><td data-src="R10,R11,R12">Réduction en insuffisance rénale modérée, atteinte sévère contre-indiquée ; grossesse appréciée selon nécessité maternelle.</td></tr><tr><td data-src="R10,R11,R12">HAS 2024, schéma clinique VIH</td><td data-src="R10,R11,R12">100 mg/kg/j, maximum 6 g/j.</td><td data-src="R10,R11,R12">Ce plafond n’est pas celui de tous les produits ; une substitution de marque/pays demande vérification.</td></tr></tbody></table>
<p data-src="R11,R12">Les sulfamides exposent à cristallurie, atteinte rénale, cytopénies et réactions cutanées graves ; déficit G6PD et antécédents d’allergie sont à rechercher. Hydratation, surveillance urinaire et alcalinisation selon protocole font partie du traitement. L’information de disponibilité suisse n’a pas été établie par les RCP étrangers : elle doit être confirmée avant prescription.</p>
<p data-src="R14"><b>Folinate.</b> L’absorption orale est saturable ; une capsule 15 mg ne permet pas de déduire un fractionnement donnant 25 mg. Demander une présentation appropriée. Le folinate peut diminuer l’effet de phénytoïne, phénobarbital et primidone ; surveiller les crises et les concentrations si indiqué. Il ne doit pas masquer une carence en vitamine B12. L’acide folique n’est pas un substitut automatique au folinate requis avec pyriméthamine.</p>

<template data-pop="g05-brivudine" data-title="Brivudine : délai après la dernière dose">
<div class="alert" data-src="R32"><b>Brivudine et fluoropyrimidines : interaction potentiellement mortelle.</b> Brivex est réservé au zona précoce de l’adulte immunocompétent. Son métabolite inhibe irréversiblement la DPD :5-FU, y compris topique, capécitabine, tégafur et flucytosine peuvent devenir gravement toxiques. Respecter au moins quatre semaines <b>après la fin</b> de brivudine avant une fluoropyrimidine ; rechercher aussi un traitement récent, en cours ou planifié avant de prescrire. Une prise accidentelle demande une évaluation hospitalière urgente et un avis toxicologique.</div>
<p data-src="R32">Brivex est contre-indiqué chez l’immunodéprimé, l’enfant/adolescent, pendant la grossesse et l’allaitement ; il n’est pas un traitement d’encéphalite. La formule «toxicité jusqu’à quatre semaines» est insuffisante : elle peut faire croire qu’une coadministration serait acceptable après un délai arbitraire depuis la première dose.</p>
<p data-src="R2,R30,R40,R42,R44,R46,R47">Les régimes des parasitoses rares, de la tuberculose et des immunothérapies sont laissés aux protocoles spécialisés cités et aux FI exactes à vérifier au moment de leur utilisation. La monographie expose leurs indications et limites, sans inventer de dose, d’autorisation suisse ou de disponibilité. Une aide mnémotechnique peut organiser la surveillance, mais ne remplace jamais poids, voie, fonction rénale, indication et produit.</p>

<template data-pop="g05-herxheimer" data-title="Jarisch–Herxheimer : ne pas confondre avec allergie"><p data-src="R7,R9">La réaction peut survenir tôt après le traitement de la syphilis, avec fièvre et aggravation inflammatoire transitoire. La recommandation neurosyphilis 2026 rapporte 1–2 % dans son contexte et un délai typique 12–24 h ; la FI décrit aussi des réactions plus précoces.</p>
<p data-src="R7,R9">Le traitement est symptomatique, sans interruption automatique de l’antibiotique ni corticoïdes systématiques. Une réaction avec signes d’anaphylaxie doit au contraire être évaluée comme urgence allergique ; la chronologie seule ne tranche pas.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13499315/">R7 — German guideline on neurosyphilis 2026</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680562710024">R9 — Penicilline Grünenthal, FI suisse exacte</a>.</p></template>
<template data-pop="g05-mnemo" data-title="Mémo de sécurité construit pour cette leçon"><p data-src="R3,R4,R15,R31"><b>Agent – Voie – Dose – Rein – Surveillance.</b> Ce mémo est une aide pédagogique de l’auteur, pas un score validé. Identifier l’agent ou la cible empirique ; vérifier le produit et la voie ; écriremg/kg/j oumg/kg/prise ; adapter à la fonction rénale ; planifier hémogramme, ions et autres contrôles.</p>
<p data-src="R3,R4,R15,R31">L’aciclovir et le foscarnet font surveiller particulièrement rein et neurologie/ions ; ganciclovir et pyriméthamine imposent l’hémogramme ; cotrimoxazole demande aussi kaliémie. Un mémo ne remplace pas la FI exacte.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680603250014">R3 — Aciclovir Labatec IV, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680491880133">R4 — Cymevene 500 mg IV, FI suisse exacte</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680378870561">R15 — Bactrim solution à diluer pour perfusion, FI suisse</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://amiko.oddb.org/fr/fi?gtin=7680523570131">R31 — Foscavir, FI suisse exacte</a>.</p></template>
<template data-pop="g05-lacunes" data-title="Limites réelles de cette version"><p data-src="R6,R13,R20,R40,R42,R44,R46,R47">Le codage est fondé sur CIM-10-GM 2024, sans certification suisse 2026. La cohorte danoise est lue au niveau du résumé ; elle ne fournit pas une incidence suisse. Le texte intégral RMS 2024 sur l’auto-immunité n’a pas été lu, seulement son résumé, complété par Graus/EAN/NEMOS/EULAR.</p>
<p data-src="R6,R13,R20,R40,R42,R44,R46,R47">Les produits étrangers de sulfadiazine ne prouvent pas une disponibilité suisse. Les infections rares et immunothérapies sont couvertes en diagnostic, principes de traitement et orientation, sans prétendre fournir chaque protocole posologique spécialisé. Les figures sont des planches anatomiques historiques humaines, non des images de maladie.</p>
<p data-src="R6,R13,R20,R40,R42,R44,R46,R47">Auto-relecture IA documentée, aucune validation médicale humaine ; les tests techniques ne certifient pas les indications thérapeutiques.</p>

<template data-pop="g05-myelite" data-title="Myélite : trois fonctions et une urgence à exclure"><p data-src="R17,R18,R36,R37">Moteur, sensibilité et autonomie doivent être examinés ensemble. Le niveau sensitif, la rétention urinaire et les signes pyramidaux orientent, mais une phase aiguë flasque/aréflexique est possible. Le niveau clinique ne fixe pas toujours la hauteur exacte de la lésion.</p>
<p data-src="R17,R18,R36,R37">IRM urgente pour écarter une compression ; début hyperaigu fait discuter infarctus. Ensuite rechercher infection, maladie démyélinisante, lupus, sarcoïdose ou tumeur selon le tableau. AQP4/MOG sériques par méthode cellulaire s’interprètent avec IRM et clinique.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.infectiologie.com/UserFiles/File/formation/desc/2025/seminaire-octobre-2025/vend-1010-them.-12/conf-2-myelites-c-henry.pdf">R17 — Orientation diagnostique devant une myélite, Carole Henry</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/">R18 — NEMOS : diagnostic et diagnostic différentiel des NMOSD, partie I</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal">R36 — Collège des enseignants de neurologie : syndrome pyramidal</a>; <a data-reference-source="1" target="_blank" rel="noopener" href="https://www.cen-neurologie.fr/premier-cycle/les-fondamentaux-de-la-pathologie-neurologique/la-semiologie-neurologique-et-ses-bases-anatomofonctionnelles/chapitre-15-syndromes-topographiques">R37 — CEN : syndromes topographiques médullaires</a>.</p></template>
<template data-pop="g05-toxo-prophylaxie" data-title="Prophylaxie primaire et secondaire : ne pas mélanger"><p data-src="R10">La HAS 2024 recommande la prophylaxie primaire si CD4&lt;200/µL ou&lt;15 %, avec arrêt envisageable après CD4&gt;100/µL et charge virale indétectable&gt;3 mois selon contexte.</p>
<p data-src="R10">Après une toxoplasmose cérébrale, la prophylaxie secondaire a un critère plus exigeant :CD4&gt;200/µL et suppression virale&gt;6 mois. TMP/SMX 160/800 mg une fois/jour est l’entretien proposé. Un régime pyriméthamine–clindamycine ne protège pas de la pneumocystose et demande une prévention complémentaire.</p>
<div class="lab">Sources relues</div><p><a data-reference-source="1" target="_blank" rel="noopener" href="https://www.has-sante.fr/upload/docs/application/pdf/2024-07/reco484_argumentaire_vih_complications_cd_20240627_pd_ap.pdf">R10 — HAS complications associées au VIH : argumentaire</a>.</p></template>
