<template data-pop="g05-codage" data-title="Codage astérisque et dague">
<div class="lab">Règle</div><p data-src="S1">Le code astérisque (G05.-\*) décrit la manifestation neurologique ; il ne s’emploie jamais seul. Le code † de la maladie causale (herpès B00.4†, zona B02.0†, varicelle B01.1†, syphilis A52.1†, toxoplasmose B58.2†, lupus M32.1†) désigne l’étiologie.</p><div class="lab">Application</div><p data-src="S1,S3">Si l’on dispose d’une maladie causale avec code †, on note les deux codes. L’encéphalite à tiques (A84, A84.1) et l’encéphalite virale sans précision (A86) n’ont pas de code † et ne reçoivent pas de G05.</p><div class="lab">Limite</div><p data-src="S1">Les séquelles (G09, un an ou plus) excluent les catégories astérisque. Le rattachement de l’encéphalite à EBV n’a pas pu être confirmé.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" data-reference-source="1" target="_blank" rel="noopener">ICD-10-GM 2024, bloc G00–G09 (G04 exclusions, G05.0*–G05.8*, G09), 2024</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" data-reference-source="1" target="_blank" rel="noopener">CIM-10-GM 2024 (fr), entrées G05, G05.0, G05.1, G05.2, G05.8 (registre nosology/fragments/S08.json), 2024</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a80-a89.htm" data-reference-source="1" target="_blank" rel="noopener">ICD-10-GM 2024, bloc A80–A89 (A84, A85.0†, A85.1†, A86, A87), 2024</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-criteres" data-title="Critères du consortium international">
<div class="lab">Critère majeur</div><p data-src="S4">Baisse de vigilance, modification de la personnalité ou manifestation psychiatrique de plus de 24 heures, sans autre cause ni diagnostic alternatif.</p><div class="lab">Critères mineurs</div><p data-src="S4">Fièvre ≥ 38 °C (dans les 72 heures avant ou après la présentation) ; crises épileptiques non expliquées par une épilepsie connue ; nouveaux signes focaux ; leucocytes du LCR ≥ 5/mm³ ; imagerie nouvelle évocatrice ; EEG anormal compatible sans autre cause.</p><div class="lab">Limite</div><p data-src="S4">Le nombre de critères mineurs requis pour « possible » ou « probable » n’a pas été lu ; il n’est pas donné.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-hsve" data-title="Encéphalite herpétique (HSV-1)">
<div class="lab">Tableau</div><p data-src="S4">Évolution biphasique : stade grippal (céphalées, forte fièvre), amélioration brève, puis troubles de la conscience, fièvre et signes focaux facultatifs. Non traitée, la létalité dépasse 70 % ; sous traitement, elle est de 20 à 30 %. Une cohorte française 2015–2022 rapporte une mortalité de 16,5 % (20,8 % aux soins intensifs) et une réhospitalisation de 10,1 % à 6 mois.</p><div class="lab">Piège</div><p data-src="S4">L’herpès labial récidivant n’augmente pas le risque. Un retard de plus de 24 heures du traitement est associé à une létalité accrue.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-antinmda" data-title="Encéphalite anti-NMDAR après HSV">
<div class="lab">Mécanisme</div><p data-src="S4">L’encéphalite herpétique peut déclencher une encéphalite à anticorps anti-récepteur NMDA des semaines à des mois plus tard.</p><div class="lab">Application</div><p data-src="S4">On l’évoque devant des symptômes nouveaux ou progressifs malgré l’aciclovir ; l’EEG peut montrer un « extreme delta brush ». L’immunothérapie est indiquée si l’auto-immunité est confirmée ou probable.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-vzv" data-title="VZV : varicelle et zona">
<div class="lab">Tableau</div><p data-src="S4">VZV est la deuxième cause infectieuse dans les pays industrialisés selon la ligne directrice et la première dans la cohorte danoise (32 %). L’encéphalite varicelleuse survient 4 à 8 jours après l’éruption (syndrome cérébelleux dans la moitié des cas) ; l’encéphalite zostérienne, de quelques jours à semaines après les vésicules.</p><div class="lab">Traitement</div><p data-src="S4">Aciclovir intraveineux à la même dose que pour HSV ; foscarnet en cas d’échec. La brivudine est absolument contre-indiquée avec le 5-fluorouracile, la capécitabine, le tégafur et la flucytosine.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a> ; <a href="https://doi.org/10.1016/j.cmi.2026.04.002" data-reference-source="1" target="_blank" rel="noopener">Infectious encephalitis among adults: a prospective and population-based cohort study (Duerlund L.S. et al., PMID 41974352), 2026</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-cmv" data-title="CMV et EBV chez l’immunodéprimé">
<div class="lab">Tableau</div><p data-src="S4">CMV : presque exclusivement chez l’immunodéprimé (sida : encéphalite, choriorétinite) ; le LCR est parfois à prédominance granulocytaire ; diagnostic par PCR. EBV : surtout chez le transplanté, avec fièvre, confusion, nausées, vomissements et trouble de la vigilance ; la PCR du LCR peut être faussement positive en cas de pléiocytose.</p><div class="lab">Limite</div><p data-src="S1">Le rattachement de l’encéphalite à EBV au code G05.1\* n’est pas confirmé.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" data-reference-source="1" target="_blank" rel="noopener">ICD-10-GM 2024, bloc G00–G09 (G04 exclusions, G05.0*–G05.8*, G09), 2024</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-pess" data-title="Panencéphalite sclérosante subaiguë">
<div class="lab">Tableau</div><p data-src="S4">Infection lente de la rougeole : incubation de mois à années, évolution progressive généralement mortelle ; chez l’enfant non ou tardivement vacciné, myoclonies, complexes de Radermecker à l’EEG, indice d’anticorps antirougeoleux > 1,5.</p><div class="lab">Limite</div><p data-src="S15">La fréquence suisse de la panencéphalite sclérosante subaiguë n’a pas été lue.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a> ; <a href="https://www.bag.admin.ch/fr/rougeole" data-reference-source="1" target="_blank" rel="noopener">Rougeole, page non datée (recommandation 2023 citée)</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-listeria" data-title="Neurolistériose">
<div class="lab">Terrain</div><p data-src="S7,S9">Sujets âgés, cancer, immunosuppression, femmes enceintes, nouveau-nés. En Suisse, jusqu’à 100 cas déclarés par an et létalité jusqu’à 20 %.</p><div class="lab">Diagnostic</div><p data-src="S7,S8">Les hémocultures sont indispensables : 35 des 252 neurolistérioses de MONALISA n’ont été identifiées que par l’hémoculture. Le tronc cérébral est atteint dans 17 %.</p><div class="lab">Traitement</div><p data-src="S7,S18">Ampicilline 6 × 2 g/jour ; alternatives triméthoprime-sulfaméthoxazole ou méropénème ; association possible avec fosfomycine ou rifampicine ; souvent 3 semaines ou plus. L’amoxicilline intraveineuse suisse cite Listeria monocytogenes dans son spectre, mais sa diffusion dans le LCR est faible sans inflammation méningée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" data-reference-source="1" target="_blank" rel="noopener">German guidelines on community-acquired acute bacterial meningitis in adults (DGN S2k, version abrégée anglaise ; DOI 10.1186/s42466-023-00264-6), 2023</a> ; <a href="https://doi.org/10.1016/S1473-3099(16)30521-7" data-reference-source="1" target="_blank" rel="noopener">Clinical features and prognostic factors of listeriosis: the MONALISA national prospective cohort study (Charlier C. et al., PMID 28139432), 2017</a> ; <a href="https://www.bag.admin.ch/fr/listeriose-2" data-reference-source="1" target="_blank" rel="noopener">Listériose, page non datée (rapport zoonoses 2025 lié)</a> ; <a href="https://amiko.oddb.org" data-reference-source="1" target="_blank" rel="noopener">Information professionnelle suisse Amoxicillin OrPha (poudre i.v.), mise à jour février 2026, v1.0</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-neurosyphilis" data-title="Neurosyphilis">
<div class="lab">Formes</div><p data-src="S10">La paralysie générale est une encéphalite chronique progressive. Des formes récentes simulent une encéphalite temporale herpétique ou limbique. La forme méningovasculaire est aujourd’hui l’une des plus fréquentes. Une épidémie européenne de syphilis précoce touche surtout les hommes ayant des rapports sexuels avec des hommes.</p><div class="lab">Critères</div><p data-src="S10">Probable : sérologie tréponémique sérique positive et deux critères parmi symptômes, pléiocytose, effet du traitement ; certaine si synthèse intrathécale d’anticorps antitréponème.</p><div class="lab">Limite</div><p data-src="S10">La validité formelle de la ligne directrice allemande 2020 est échue (30.04.2025) ; une mise à jour n’a pas été vérifiée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" data-reference-source="1" target="_blank" rel="noopener">German guidelines on the diagnosis and treatment of neurosyphilis (DGN S1 030/101, approuvée par la Société suisse de neurologie ; DOI 10.1186/s42466-020-00081-1), mai 2020, validité indiquée jusqu&#x27;au 30.04.2025</a> ; <a href="https://doi.org/10.1111/jdv.16946" data-reference-source="1" target="_blank" rel="noopener">2020 European guideline on the management of syphilis (Janier M. et al., PMID 33094521), 2020</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-toxo" data-title="Toxoplasmose cérébrale du patient VIH">
<div class="lab">Diagnostic</div><p data-src="S12">Présomptif : symptômes, IgG sériques, lésions focales typiques et réponse au traitement empirique. Définitif : mise en évidence tissulaire. PCR du LCR : spécifique (95–100 %), sensible à 50 %.</p><div class="lab">Prévention</div><p data-src="S12">Prophylaxie primaire par triméthoprime-sulfaméthoxazole si CD4 < 200/µL ou < 14 %.</p><p class="src">Références : <a href="https://www.eacsociety.org/media/guidelines-12.0.pdf" data-reference-source="1" target="_blank" rel="noopener">EACS Guidelines version 12.0 — Toxoplasma gondii Encephalitis, v12.0, octobre 2023</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-lupus" data-title="Lupus neuropsychiatrique (M32.1†)">
<div class="lab">Mécanismes</div><p data-src="S13">Processus inflammatoire ou mécanisme thrombotique par anticorps antiphospholipides ; cette distinction oriente le traitement.</p><div class="lab">Bilan</div><p data-src="S13">Même bilan qu’en dehors du lupus : exclure une autre cause ; ponction lombaire pour éliminer une infection ; IRM, EEG, tests neuropsychologiques. Facteurs de risque forts : antécédent de lupus neuropsychiatrique sévère et anticorps antiphospholipides.</p><p class="src">Références : <a href="https://doi.org/10.1136/ard.2010.130476" data-reference-source="1" target="_blank" rel="noopener">EULAR recommendations for the management of SLE with neuropsychiatric manifestations (Bertsias G.K. et al., PMID 20724309), 2010</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-irm" data-title="IRM : examen de choix">
<div class="lab">Application</div><p data-src="S4">L’IRM est l’examen de choix. Le scanner n’est qu’un substitut et reste souvent normal les 4 premiers jours de l’encéphalite herpétique. Une IRM normale rend cette encéphalite peu probable.</p><div class="lab">Topographie</div><p data-src="S4">Temporal médio-basal avec extension frontobasale et cingulaire pour HSV ; noyaux gris centraux asymétriques pour les arbovirus.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-lcr" data-title="LCR : cellules, protéines, lactate">
<div class="lab">Profil viral</div><p data-src="S4">Pléiocytose mixte les 4–48 premières heures (25 à 1000/µL), puis lymphocytaire ; protéines et lactate normaux ou peu élevés (lactate ≤ 4,0 mmol/L).</p><div class="lab">Profil bactérien</div><p data-src="S7">> 1000 cellules/µL à granulocytes, protéines > 100 mg/dL, glucose LCR/sérum abaissé, lactate > 3,5 mmol/L ; un tiers des méningites bactériennes ont moins de 1000 cellules/µL.</p><div class="lab">Limite</div><p data-src="S4">Les valeurs normales du LCR ne figurent pas dans le dossier de recherche.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" data-reference-source="1" target="_blank" rel="noopener">German guidelines on community-acquired acute bacterial meningitis in adults (DGN S2k, version abrégée anglaise ; DOI 10.1186/s42466-023-00264-6), 2023</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-pcr" data-title="PCR et recherche virale par paliers">
<div class="lab">Performance</div><p data-src="S4">Pour HSV, la PCR du LCR a une sensibilité de 95 à 100 % aux premiers jours ; elle peut se négativer ensuite. Le LCR est normal au début chez 5 % des patients.</p><div class="lab">Paliers</div><p data-src="S4">1 : HSV-1/2, VZV, CMV, VIH ; 2 : EBV, entérovirus ; 3 : encéphalite à tiques, adénovirus, HHV-6, grippe, rougeole, rubéole, JCV ; 4 : situations spéciales. Panels multiplex et NGS si l’étiologie reste inconnue.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-graus" data-title="Encéphalite auto-immune : critères de Graus 2016">
<div class="lab">Critères</div><p data-src="S4">Les trois critères suivants sont requis : (1) troubles de la mémoire à court terme, symptômes psychiatriques ou altération de la conscience d’installation subaiguë (moins de 3 mois) ; (2) au moins un parmi nouveaux signes focaux, pléiocytose > 5/mm³, crises inexpliquées, IRM évocatrice ; (3) exclusion raisonnable des autres causes.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-eeg" data-title="EEG dans l’encéphalite">
<div class="lab">Aspects</div><p data-src="S4">Ralentissement généralisé et décharges épileptiformes latéralisées périodiques (PLED) dans l’encéphalite herpétique ; complexes de Radermecker dans la panencéphalite sclérosante subaiguë ; « extreme delta brush » dans l’encéphalite anti-NMDAR.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-indice" data-title="Indice d’anticorps (formule de Reiber)">
<div class="lab">Formule</div><p data-src="S4">(Anticorps du LCR × IgG sérique) / (IgG du LCR × anticorps sérique). Un indice > 1,5 signe une synthèse intrathécale spécifique, après plus de 10 jours pour HSV, VZV, CMV et l’encéphalite à tiques.</p><div class="lab">Limite</div><p data-src="S4">L’indice est tardif : il ne sert pas à décider du traitement initial.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-fsme" data-title="Encéphalite à tiques">
<div class="lab">Santé publique</div><p data-src="S14">Maladie à déclaration obligatoire ; tous les cantons sauf le Tessin sont zones à risque ; vaccination recommandée dès 3 ans en zone à risque, discussion individuelle à 1–2 ans.</p><div class="lab">Codage</div><p data-src="S3">A84 / A84.1, sans code † ni G05.1\*.</p><div class="lab">Traitement</div><p data-src="S4">Immunisation passive non indiquée.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-a80-a89.htm" data-reference-source="1" target="_blank" rel="noopener">ICD-10-GM 2024, bloc A80–A89 (A84, A85.0†, A85.1†, A86, A87), 2024</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a> ; <a href="https://www.bag.admin.ch/de/zeckenuebertragene-krankheiten" data-reference-source="1" target="_blank" rel="noopener">Zeckenübertragene Krankheiten (FSME), page non datée</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-duree" data-title="Contentieux : durée de l’aciclovir dans l’encéphalite herpétique">
<div class="lab">Les deux textes</div><p data-src="S16">L’information professionnelle suisse (Aciclovir Labatec® intraveineux, mise à jour de décembre 2025) indique 10 jours chez l’enfant dès 3 mois et l’adulte.</p><p data-src="S4">La ligne directrice DGN/SNG (révisée le 9 janvier 2025) recommande au moins 14 jours.</p><div class="lab">Arbitrage</div><p data-src="S4,S16">Selon la règle de la source primaire la plus récente, l’information professionnelle de décembre 2025 l’emporte pour l’autorisation de mise sur le marché ; la ligne directrice reflète la pratique d’experts. Le médecin ne tranche pas sans connaître ces deux sources, et il documente son choix. Dans le cas d’une PCR négative avec suspicion persistante, la ligne directrice recommande au moins 10 jours.</p><div class="lab">Texte en vigueur</div><p data-src="S16">L’information professionnelle citée est la version actuellement consultable ; la ligne directrice reste valable jusqu’au 8 janvier 2030.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a> ; <a href="https://amiko.oddb.org" data-reference-source="1" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., mise à jour décembre 2025</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-dexa" data-title="Contentieux : dexaméthasone et Listeria">
<div class="lab">Recommandation</div><p data-src="S7">La ligne directrice germanophone (Allemagne, Autriche, Suisse) recommande la dexaméthasone 10 mg par voie intraveineuse 4 fois/jour en cas de suspicion de méningite bactérienne communautaire, poursuivie 4 jours si pneumocoque.</p><div class="lab">Donnée contraire</div><p data-src="S8">La cohorte MONALISA observe une mortalité plus élevée des neurolistérioses sous dexaméthasone adjuvante (odds ratio 4,58). Cette donnée est observationnelle.</p><div class="lab">Conclusion</div><p data-src="S7,S8">Les sources lues ne permettent pas de trancher au-delà de ce contraste ; le contentieux est signalé sans résolution.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" data-reference-source="1" target="_blank" rel="noopener">German guidelines on community-acquired acute bacterial meningitis in adults (DGN S2k, version abrégée anglaise ; DOI 10.1186/s42466-023-00264-6), 2023</a> ; <a href="https://doi.org/10.1016/S1473-3099(16)30521-7" data-reference-source="1" target="_blank" rel="noopener">Clinical features and prognostic factors of listeriosis: the MONALISA national prospective cohort study (Charlier C. et al., PMID 28139432), 2017</a>. Consultées le 15 octobre 2026.</p></template>
<template data-pop="g05-aciclovir" data-title="Aciclovir : monographie suisse">
<div class="lab">Indication et posologie</div><p data-src="S16,S4">Encéphalite herpétique : 10 mg/kg par voie intraveineuse toutes les 8 heures, hydratation, adaptation rénale ; durée : voir le contentieux. Nouveau-né : 14 à 21 jours selon l’information professionnelle.</p><div class="lab">Pharmacocinétique</div><p data-src="S16">Élimination rénale par filtration et sécrétion tubulaire ; intervalle de 12 h si clairance 25–50 mL/min, 24 h si 10–25, demi-dose/24 h si < 10 ou hémodialyse.</p><div class="lab">Effets indésirables</div><p data-src="S16">Insuffisance rénale aiguë très rare, réversible par réhydratation ; effets neurologiques très rares (confusion, hallucinations, convulsions, encéphalopathie, coma), surtout chez l’insuffisant rénal ou le sujet âgé.</p><div class="lab">Interactions</div><p data-src="S16">Prudence avec la ciclosporine et le tacrolimus.</p><div class="lab">Limite</div><p data-src="S16">Les données sur le mécanisme d’action et les essais ne sont pas reprises faute de source lue pour cette leçon.</p><p class="src">Références : <a href="https://amiko.oddb.org" data-reference-source="1" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., mise à jour décembre 2025</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Virale Meningoenzephalitis, S1-Leitlinie (Meyding-Lamadé U. et al.), AWMF 030/100, v7.0, révisée le 09.01.2025, valable jusqu&#x27;au 08.01.2030</a>. Consultées le 15 octobre 2026.</p></template>
