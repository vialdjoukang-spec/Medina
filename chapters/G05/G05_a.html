<section class="ilot" id="g05-0"><h2><span class="n">0</span>Question clinique</h2>
<p data-src="S4,S5">Dans cette <b>vignette fictive</b>, une femme de 62 ans, qui pèse 70 kg, consulte après trois jours de fièvre et de céphalées. Ce matin, elle est confuse et a présenté une crise convulsive. La température est de 38,9 °C. Le liquide cérébro-spinal (LCR) contient 140 cellules/µL, à prédominance lymphocytaire, des protéines modérément augmentées et un lactate à 2,8 mmol/L. La procalcitonine est à 0,2 ng/mL. L’IRM montre un hypersignal temporal médio-basal. Ces valeurs sont pédagogiques : elles servent à poser la question du jour.</p>
<p data-src="S4">Quel est le diagnostic le plus urgent à traiter ? Une encéphalite herpétique, car la fièvre, la confusion, la crise, la cellularité modérée du LCR et la localisation temporale médio-basale forment le tableau typique décrit par la ligne directrice allemande, autrichienne et suisse de 2025. La conduite ne dépend pas de la PCR du LCR : l’<button class="w" data-k="g05-aciclovir">aciclovir (monographie suisse)</button> par voie intraveineuse, 10 mg/kg toutes les 8 heures, soit 700 mg chez cette patiente, est débuté <b>dès la suspicion clinique</b>, sans attendre le résultat.</p>
<p data-src="S1,S4">La leçon répond ensuite à une seconde question, propre à la classification : que signifie le code <b>G05.-\</b>* ? C’est une catégorie astérisque. Elle décrit la <b>manifestation</b> encéphalitique ou myélitique d’une maladie dont le code primaire figure ailleurs (herpès, zona, syphilis, toxoplasmose, lupus). Pour l’examen fédéral, l’enjeu clinique reste l’<b>agent causal traitable</b>, que le <button class="w" data-k="g05-codage">codage astérisque (règles et pièges)</button> ne remplace pas.</p>
<div class="key" data-src="S4,S1"><b>À retenir.</b> Devant une encéphalite aiguë, on traite d’abord l’agent traitable le plus dangereux (HSV), on cherche ensuite la cause, et on code en dernier. Le code G05.-\* ne s’emploie jamais seul.</div>
</section>
<section class="ilot" id="g05-1"><h2><span class="n">1</span>Définition, codage et critères</h2>
<p data-src="S1,S2">La catégorie <b>G05</b> de la CIM-10-GM 2024 regroupe l’encéphalite, la myélite et l’encéphalomyélite *au cours d’affections classées ailleurs* ; elle inclut aussi la méningo-encéphalite et la méningomyélite. Le sens du symbole astérisque est précis : le code G05.-\* qualifie la localisation neurologique, tandis que le code † de la maladie causale désigne l’étiologie. Les deux codes se notent ensemble.</p>
<p data-src="S1,S2">Le tableau suivant présente les quatre sous-codes avec les codes primaires cités par le BfArM. Il sert à relier un diagnostic étiologique à son code de manifestation ; chaque ligne se lit comme « maladie causale → sous-code ».</p>
<table class="t"><thead><tr><th>Sous-code (OFS)</th><th>Intitulé</th><th>Codes primaires † cités</th></tr></thead><tbody><tr><td data-src="S1,S2">G05.0\*</td><td data-src="S1,S2">Au cours d’infections bactériennes classées ailleurs</td><td data-src="S1,S2">Listeria A32.1† ; méningocoque A39.8† ; syphilis congénitale A50.4† ; syphilis tardive A52.1† ; tuberculose A17.8†</td></tr><tr><td data-src="S1,S2">G05.1\*</td><td data-src="S1,S2">Au cours d’infections virales classées ailleurs</td><td data-src="S1,S2">Entérovirus A85.0† ; adénovirus A85.1† ; grippe J09†, J10.8†, J11.8† ; herpès simplex B00.4† ; rougeole B05.0† ; oreillons B26.2† ; rubéole B06.0† ; varicelle B01.1† ; zona B02.0† ; cytomégalovirus B25.88†</td></tr><tr><td data-src="S1,S2">G05.2\*</td><td data-src="S1,S2">Au cours d’autres maladies infectieuses et parasitaires classées ailleurs</td><td data-src="S1,S2">Trypanosomiase africaine B56.-† ; maladie de Chagas chronique B57.4† ; Naegleria B60.2† ; toxoplasmose B58.2† ; méningo-encéphalite à éosinophiles B83.2†</td></tr><tr><td data-src="S1,S2">G05.8\*</td><td data-src="S1,S2">Au cours d’autres maladies classées ailleurs</td><td data-src="S1,S2">Encéphalopathie du lupus érythémateux systémique M32.1†</td></tr></tbody></table>
<p data-src="S1,S3">La lecture de ce tableau appelle trois précisions. D’abord, l’<b>encéphalite à tiques</b> (A84, A84.1) ne porte ni code † ni lien vers G05.1\* : on la code directement en A84. Ensuite, l’encéphalite virale sans précision (A86) suit la même règle. Enfin, la catégorie <b>G09</b>, qui code les séquelles des affections inflammatoires de G00 à G08, exclut les catégories astérisque ; une séquelle est un état persistant un an ou plus après le début de la maladie causale.</p>
<div class="trap" data-src="S1,S3"><span class="k">Piège de codage</span> Coder une encéphalite à tiques en G05.1\* est une erreur : elle appartient à A84 et n’a pas de code †. De même, G04 exclut l’encéphalopathie alcoolique (G31.2), toxique (G92.-) ou sans précision (G93.4), la sclérose en plaques (G35.-), la myélite transverse aiguë (G37.3) et le syndrome de Foix-Alajouanine (G37.4).</div>
<h3>1.1 Critères cliniques de l’encéphalite</h3>
<p data-src="S4">La ligne directrice allemande de 2025, élaborée avec un représentant de la Société suisse de neurologie, reprend les <button class="w" data-k="g05-criteres">critères du consortium international de l’encéphalite (critère majeur et critères mineurs)</button>. Le <b>critère majeur</b> est une baisse de vigilance, une modification de la personnalité ou une manifestation psychiatrique durant plus de 24 heures, sans autre cause. Les <b>critères mineurs</b> sont : fièvre d’au moins 38 °C dans les 72 heures autour de la présentation, crises épileptiques non expliquées par une épilepsie connue, nouveaux signes focaux, leucocytes du LCR ≥ 5/mm³, imagerie nouvelle évocatrice, EEG anormal compatible sans autre cause.</p>
<p data-src="S4">Le dossier de recherche ne contient pas le nombre de critères mineurs requis pour une encéphalite « possible » ou « probable » ; ce nombre n’est donc pas donné ici, et le lecteur ne doit pas le déduire.</p>
<h3>1.2 Méningite virale, méningo-encéphalite, encéphalite</h3>
<p data-src="S4">La <b>méningite virale</b> associe céphalées, nausées, raideur de nuque, photophobie et phonophobie, <b>sans signe focal ni trouble de la conscience</b> ; le LCR contient moins de 1000 cellules/µL, avec protéines et lactate peu ou pas augmentés, et l’évolution est spontanément favorable en jours à semaines. L’<b>encéphalite</b> associe au contraire des troubles quantitatifs et qualitatifs de la conscience, souvent, mais pas obligatoirement, des signes focaux (parésies, aphasie, crises). Le méningisme peut manquer.</p>
<div class="key" data-src="S4"><b>À retenir.</b> La distinction repose sur le cerveau, non sur les méninges : c’est la conscience, la personnalité et les signes focaux qui orientent vers l’encéphalite, tandis que la raideur de nuque seule oriente vers la méningite.</div>
</section>
<section class="ilot" id="g05-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p data-src="S5">La meilleure donnée récente vient du <b>Danemark</b> : une cohorte prospective nationale d’adultes (2015–2023, critères du consortium) estime l’incidence des encéphalites infectieuses à <b>1,18/100 000 par an</b>, avec un âge médian de 70 ans. Les étiologies se répartissent ainsi : VZV 32 %, HSV-1 31 %, encéphalite à tiques 5 %, autres virus 8 %, cause <b>inconnue 24 %</b>. Presque une encéphalite sur quatre reste donc sans agent identifié, d’où l’intérêt d’un bilan étagé.</p>
<table class="t"><thead><tr><th>Paramètre (cohorte danoise)</th><th>Valeur</th></tr></thead><tbody><tr><td data-src="S5">Confusion</td><td data-src="S5">80 %</td></tr><tr><td data-src="S5">Céphalées</td><td data-src="S5">59 %</td></tr><tr><td data-src="S5">Changement de personnalité</td><td data-src="S5">42 %</td></tr><tr><td data-src="S5">Admission en soins intensifs</td><td data-src="S5">22 %</td></tr><tr><td data-src="S5">Mortalité à 30 jours</td><td data-src="S5">8 %</td></tr><tr><td data-src="S5">Mortalité à 6 mois</td><td data-src="S5">15 %</td></tr></tbody></table>
<p data-src="S5">Les facteurs associés à la mortalité à 6 mois sont l’immunodépression (risque relatif ajusté 2,91), l’encéphalite à HSV-1 (2,34) et un score de Glasgow inférieur à 12 (2,03). Ces rapports décrivent des associations pronostiques dans une cohorte ; ils n’établissent pas à eux seuls une causalité.</p>
<p data-src="S4">Pour l’encéphalite herpétique, la ligne directrice cite <b>1 à 3 cas par million</b> d’habitants, ce qui en fait l’encéphalite sporadique la plus fréquente d’Europe occidentale. Un tiers des cas survient avant 20 ans, la moitié après 50 ans, sans saisonnalité. Dans les zones tempérées, l’incidence globale des encéphalites virales est estimée à 3,5–7,5/100 000. Chez l’enfant et l’adulte jeune, les encéphalites auto-immunes (anti-NMDAR) représentent environ 20 à 30 % des cas.</p>
<p data-src="S9,S14,S15,S4,S8">En <b>Suisse</b>, trois repères viennent de l’OFSP. La listériose compte jusqu’à 100 cas déclarés par an, avec une létalité allant jusqu’à 20 % ; les groupes à risque sont les personnes immunodéprimées, les femmes enceintes, les nouveau-nés et les personnes âgées. L’encéphalite à tiques est à déclaration obligatoire et tous les cantons, sauf le Tessin, sont des zones à risque ; la ligne directrice allemande rapporte 245 cas suisses en 2023. La rougeole se complique d’une encéphalite chez environ 1 cas sur 1000. Dans la cohorte française MONALISA, 84 % des 252 neurolistérioses étaient des méningo-encéphalites, avec une atteinte du tronc cérébral dans 17 % des cas.</p>
<div class="trap" data-src="S4,S5"><span class="k">Limite des données</span> Aucune source suisse spécifique à l’encéphalite n’a été trouvée : les incidences citées sont danoises ou allemandes. La ligne directrice de 2025 déclare toutefois n’avoir « aucune particularité pour la Suisse ».</div>
<div class="key" data-src="S4,S5"><b>À retenir.</b> Les deux agents les plus fréquents de l’adulte sont HSV-1 et VZV ; tous deux sont traitables par l’aciclovir. L’encéphalite herpétique tue au moins 70 % des patients non traités et 20 à 30 % des patients traités.</div>

</section>
<section class="ilot" id="g05-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p data-src="S4">Une encéphalite résulte de deux familles de mécanismes qui peuvent se succéder chez le même patient. La première est la <b>lésion directe</b> : l’agent infecte le parenchyme et le détruit. La seconde est la <b>lésion immunitaire</b> : vascularites ou encéphalites auto-immunes, qui surviennent à côté ou à la suite de l’infection. Cette distinction explique pourquoi un patient peut aller mieux sous traitement antiviral puis s’aggraver.</p>
<h3>3.1 Le cas de HSV</h3>
<p data-src="S4">Chez l’adulte, HSV-1 provoque une encéphalite <b>nécrosante focale</b>, de topographie temporale médio-basale qui s’étend vers le frontobasal et le cingulaire. La conséquence clinique est double : les signes focaux (aphasie, crises) correspondent à cette localisation, et l’IRM montre l’atteinte avant que le scanner ne s’anormalise. HSV-2 donne chez l’adulte plutôt une méningite bénigne, mais chez le nouveau-né une encéphalite hémorragique nécrosante diffuse.</p>
<p data-src="S4">L’encéphalite herpétique peut ensuite déclencher une <button class="w" data-k="g05-antinmda">encéphalite à anticorps anti-récepteur NMDA (mécanisme et conduite)</button>, des semaines à des mois après l’infection. Il faut l’évoquer devant des symptômes nouveaux ou progressifs malgré l’aciclovir ; l’immunothérapie est indiquée si l’auto-immunité est confirmée ou probable. La ligne directrice rapporte aussi jusqu’à 25 % d’évolutions récurrentes après encéphalite herpétique, par réactivation virale ou par mécanisme immunitaire : le suivi doit donc chercher les deux.</p>
<h3>3.2 Autres topographies et terrains</h3>
<p data-src="S4">Les arbovirus (encéphalite à tiques, encéphalite japonaise) atteignent de façon asymétrique les noyaux gris centraux. La myélite transverse aiguë est plus souvent immuno-médiée que directement infectieuse (grippe, mycoplasme, adénovirus). Chez l’immunodéprimé, EBV et CMV encéphalitiques augmentent (sida, transplantation, chimiothérapie), et l’encéphalite zostérienne touche préférentiellement leucémies, lymphomes et autres immunodéficits. Les infections lentes (panencéphalite sclérosante subaiguë après rougeole, panencéphalite rubéoleuse progressive) ont une incubation de mois à années et une évolution progressive généralement mortelle.</p>
<p data-src="S13">Dans le lupus, les manifestations neuropsychiatriques relèvent soit d’un processus inflammatoire, soit d’un mécanisme thrombotique lié aux anticorps antiphospholipides. Cette distinction oriente le traitement : immunosuppression d’un côté, antiagrégant ou anticoagulant de l’autre.</p>
<div class="key" data-src="S4,S13"><b>À retenir.</b> Face à une aggravation tardive, le médecin se demande si l’agent persiste (réactivation) ou si le système immunitaire intervient à son tour (auto-immunité) : les deux hypothèses se traitent différemment.</div>
</section>

<p data-src="S1,S4">Le tableau suivant range les causes par sous-code, avec l’élément qui les évoque cliniquement. Il convient de le lire comme une aide à l’orientation : plusieurs agents donnent le même tableau d’encéphalite, et seul le bilan microbiologique tranche.</p>

e</button></td><td data-src="S1,S4,S7,S9,S10,S12,S13">Troubles cognitifs et psychiatriques ; formes simulant une encéphalite herpétique</td></tr><tr><td data-src="S1,S4,S7,S9,S10,S12,S13">G05.2\*</td><td data-src="S1,S4,S7,S9,S10,S12,S13"><button class="w" data-k="g05-toxo">Toxoplasmose cérébrale</button></td><td data-src="S1,S4,S7,S9,S10,S12,S13">Personne vivant avec le VIH, lésions focales</td></tr><tr><td data-src="S1,S4,S7,S9,S10,S12,S13">G05.8\*</td><td data-src="S1,S4,S7,S9,S10,S12,S13"><button class="w" data-k="g05-lupus">Lupus érythémateux systémique</button></td><td data-src="S1,S4,S7,S9,S10,S12,S13">Manifestation neuropsychiatrique ; anticorps antiphospholipides</td></tr></tbody></table>
<p data-src="S4">La ligne directrice précise le <b>contexte</b> qui doit faire élargir la recherche : immunosuppression (CMV, JCV, VZV, HHV-6, EBV, HSV, et entérovirus 71 sous anti-CD20), transfusion ou transplantation (VIH, CMV, parvovirus B19), voyage (rage, dengue ; virus Toscana en Italie ; virus du Nil occidental en Méditerranée ; encéphalite japonaise et Nipah en Asie du Sud-Est).</p>
<div class="trap" data-src="S1"><span class="k">Rattachement incertain</span> L’encéphalite à EBV n’apparaît pas parmi les inclusions du BfArM pour G05.1\* : son rattachement de codage n’a pas pu être confirmé. De même, trypanosomiase, maladie de Chagas, Naegleria et méningo-encéphalite à éosinophiles figurent ici pour le codage seulement, faute de source clinique lue.</div>
<div class="key" data-src="S4,S5"><b>À retenir.</b> Les facteurs de risque majeurs sont l’âge élevé (âge médian 70 ans dans la cohorte danoise), l’immunodépression et l’exposition (tique, voyage, aliments à risque, exposition sexuelle selon l’agent).</div>

<section class="ilot" id="g05-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-src="S4">L’interrogatoire cherche l’agent avant le laboratoire. La ligne directrice énumère les questions à poser ; elles se regroupent en quatre axes.</p>
<table class="t"><thead><tr><th>Axe</th><th>Question</th><th>Agent évoqué</th></tr></thead><tbody><tr><td data-src="S4,S9,S10">Contagion</td><td data-src="S4,S9,S10">Cas dans l’entourage (oreillons, varicelle, polio)</td><td data-src="S4,S9,S10">Virus correspondants</td></tr><tr><td data-src="S4,S9,S10">Exposition</td><td data-src="S4,S9,S10">Piqûre de tique ou d’insecte ; morsure animale ; voyage</td><td data-src="S4,S9,S10">Encéphalite à tiques ; arbovirus ; rage</td></tr><tr><td data-src="S4,S9,S10">Terrain</td><td data-src="S4,S9,S10">Groupe à risque VIH ; transfusion, transplantation ; immunosuppression</td><td data-src="S4,S9,S10">VIH, CMV, parvovirus B19, JCV, VZV, HHV-6, EBV, HSV</td></tr><tr><td data-src="S4,S9,S10">Habitudes</td><td data-src="S4,S9,S10">Lait cru, fromages, charcuterie, poisson, salades emballées ; exposition sexuelle ; vésicules cutanées</td><td data-src="S4,S9,S10">Listeria ; syphilis ; VZV</td></tr></tbody></table>
<p data-src="S4,S5">Les symptômes se classent par fréquence : confusion (80 %), céphalées (59 %), changement de personnalité (42 %) dans la cohorte danoise. Le méningisme peut manquer : l’absence de raideur de nuque n’exclut pas une encéphalite.</p>
<h3>5.1 Formes typique et atypiques</h3>
<div class="two"><div class="card"><h4>Forme typique : encéphalite herpétique</h4><p data-src="S4,S10">Un stade grippal (céphalées, forte fièvre) précède une brève amélioration, puis surviennent des troubles de la conscience, de la fièvre et, facultativement, des signes focaux. Ce schéma biphasique doit être recherché dans l’histoire.</p></div><div class="card"><h4>Forme atypique : varicelle ou zona</h4><p data-src="S4,S10">L’encéphalite varicelleuse survient 4 à 8 jours après l’éruption, avec un syndrome cérébelleux dans la moitié des cas ; l’encéphalite zostérienne suit de quelques jours à semaines les vésicules, le plus souvent céphaliques. Le tableau ressemble à l’encéphalite herpétique, en moins rapide et généralement moins sévère.</p></div><div class="card"><h4>Forme chronique : paralysie générale</h4><p data-src="S4,S10">La neurosyphilis tardive se manifeste par des troubles cognitifs et du jugement, des épisodes psychotiques, des troubles de la parole, des anomalies pupillaires, un tremblement lingual et facial, des crises, puis une démence sévère.</p></div><div class="card"><h4>Forme trompeuse : syphilis récente</h4><p data-src="S4,S10">Des formes récentes simulent une encéphalite temporale herpétique ou limbique. La neurosyphilis méningovasculaire est l’une des plus fréquentes aujourd’hui : il faut y penser devant un accident vasculaire du sujet jeune sans facteur de risque.</p></div></div>
<div class="key" data-src="S4,S10"><b>À retenir.</b> L’histoire biphasique oriente vers HSV, l’éruption récente vers VZV, l’exposition aux tiques vers l’encéphalite à tiques, et un tableau psychiatrique subaigu chez un patient exposé sexuellement vers la syphilis.</div>
</section>
<section class="ilot" id="g05-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-src="S4,S5">L’examen suit l’ordre état général, constantes, neurologie. Il cherche des arguments pour une encéphalite et des signes de gravité, sans retarder le traitement.</p>
<div class="two"><div class="card"><h4>État général et constantes</h4><p data-src="S4,S5,S10">La température compte pour le critère mineur (≥ 38 °C dans les 72 heures autour de la présentation). La vigilance se mesure par le score de Glasgow : une valeur inférieure à 12 est associée à une mortalité plus élevée à 6 mois dans la cohorte danoise.</p></div><div class="card"><h4>Conscience et comportement</h4><p data-src="S4,S5,S10">Une baisse de vigilance, une confusion ou un changement de personnalité de plus de 24 heures constitue le critère majeur de l’encéphalite. Une manifestation psychiatrique entre dans ce critère au même titre que le trouble de la vigilance.</p></div><div class="card"><h4>Signes focaux</h4><p data-src="S4,S5,S10">Parésies, aphasie et crises épileptiques orientent vers une atteinte parenchymateuse, notamment temporale dans l’encéphalite herpétique. Leur absence n’exclut pas le diagnostic, car ils sont facultatifs.</p></div><div class="card"><h4>Méninges</h4><p data-src="S4,S5,S10">Le méningisme peut manquer dans l’encéphalite. À l’inverse, sa présence avec fièvre impose de ne pas écarter une méningite bactérienne (voir démarche diagnostique).</p></div><div class="card"><h4>Peau et muqueuses</h4><p data-src="S4,S5,S10">Des vésicules cutanées orientent vers VZV ; une éruption récente de varicelle précède de 4 à 8 jours l’encéphalite varicelleuse.</p></div><div class="card"><h4>Examen neurologique ciblé</h4><p data-src="S4,S5,S10">Les pupilles, la parole, un tremblement lingual ou facial et le jugement sont recherchés en cas de suspicion de neurosyphilis ; le syndrome cérébelleux oriente vers la varicelle.</p></div></div>
<div class="trap" data-src="S4"><span class="k">Erreur fréquente</span> Attendre l’apparition d’une raideur de nuque ou de signes focaux pour traiter. La ligne directrice indique que ces signes peuvent manquer ; la décision d’administrer l’aciclovir repose sur la suspicion clinique.</div>
<div class="key" data-src="S4"><b>À retenir.</b> L’examen clinique n’exclut aucune étiologie ; il établit la gravité (conscience, crises, signes focaux) et la nécessité d’un traitement immédiat.</div>
