<template data-pop="a41-sirs" data-title="Critères de réponse inflammatoire systémique (SIRS)"><div class="lab">Définition</div><p>Les critères de réponse inflammatoire systémique proviennent des définitions de 1991. Ils sont au nombre de quatre. Le premier est une température supérieure à 38 °C ou inférieure à 36 °C ; le deuxième, une fréquence cardiaque supérieure à 90 par minute. Le troisième est une fréquence respiratoire supérieure à 20 par minute ou une PaCO₂ inférieure à 32 mmHg (4,3 kPa). Le quatrième est un nombre de leucocytes supérieur à 12 × 10⁹/L, inférieur à 4 × 10⁹/L, ou comportant plus de 10 % de formes immatures.</p><div class="lab">Mécanisme</div><p>Ces critères traduisent l’inflammation. La fièvre et la leucocytose reflètent l’action des cytokines ; la tachycardie et la polypnée reflètent l’adaptation circulatoire et respiratoire. Selon le groupe de travail Sepsis-3, ils peuvent refléter une réponse appropriée de l’hôte, souvent adaptée, et non une défaillance d’organe.</p><div class="lab">Valeur et limites</div><p>Ces critères se rencontrent chez de nombreux patients hospitalisés qui n’auront ni infection ni évolution défavorable. À l’inverse, dans les unités de soins intensifs australiennes et néo-zélandaises, un patient sur huit admis pour une infection avec défaillance nouvelle ne remplissait pas deux critères. Sepsis-3 les a donc retirés de la définition du sepsis. Ils restent plus sensibles, mais moins spécifiques, que le qSOFA pour repérer une défaillance d’origine infectieuse.</p><div class="lab">Place actuelle</div><p>La Surviving Sepsis Campaign 2026 accepte les critères de réponse inflammatoire comme outil de dépistage hospitalier, au même titre que les scores d’alerte précoce, et les préfère au qSOFA employé seul. Le groupe de travail Sepsis-3 rappelle qu’ils aident encore à reconnaître une infection.</p><div class="lab">Exemple</div><p>Mme R. remplit 3 critères sur 4 sans fièvre : fréquence cardiaque de 118 par minute, fréquence respiratoire de 28 par minute et leucocytes à 17,8 × 10⁹/L.</p></template>
<template data-pop="a41-news2" data-title="National Early Warning Score 2"><div class="lab">Définition</div><p>Le National Early Warning Score 2 est un score d’alerte précoce publié en 2017 par le Royal College of Physicians de Londres. Il additionne des points attribués à sept paramètres : fréquence respiratoire, SpO₂, oxygène ou air ambiant, pression systolique, pouls, conscience et température. Chaque paramètre rapporte de 0 à 3 points selon son écart à la normale.</p><div class="lab">Barème</div><p>Le barème suivant transforme l’écart de chaque constante en niveau d’alerte. Il utilise l’échelle habituelle de saturation.</p><table class="t"><tr><th>Paramètre</th><th>3 points</th><th>2 points</th><th>1 point</th><th>0 point</th></tr><tr><td>Fréquence respiratoire (par minute)</td><td>8 ou moins ; 25 ou plus</td><td>21 à 24</td><td>9 à 11</td><td>12 à 20</td></tr><tr><td>SpO₂ (échelle habituelle)</td><td>91 % ou moins</td><td>92 à 93 %</td><td>94 à 95 %</td><td>96 % ou plus</td></tr><tr><td>Oxygène</td><td>—</td><td>Oxygène administré</td><td>—</td><td>Air ambiant</td></tr><tr><td>Pression systolique (mmHg)</td><td>90 ou moins ; 220 ou plus</td><td>91 à 100</td><td>101 à 110</td><td>111 à 219</td></tr><tr><td>Pouls (par minute)</td><td>40 ou moins ; 131 ou plus</td><td>111 à 130</td><td>41 à 50 ; 91 à 110</td><td>51 à 90</td></tr><tr><td>Conscience</td><td>Confusion nouvelle, réponse à la voix ou à la douleur, absence de réponse</td><td>—</td><td>—</td><td>Éveil normal</td></tr><tr><td>Température (°C)</td><td>35,0 ou moins</td><td>39,1 ou plus</td><td>35,1 à 36,0 ; 38,1 à 39,0</td><td>36,1 à 38,0</td></tr></table><p>Le médecin lit chaque ligne, puis additionne les points. L’erreur fréquente consiste à négliger la ligne de l’oxygène, qui rapporte 2 points dès qu’un patient en reçoit. Une seconde échelle de saturation, non détaillée ici, s’applique aux patients dont la saturation cible prescrite est de 88 à 92 %.</p><div class="lab">Seuils de réponse</div><p>Un total de 0 à 4 correspond à un risque faible. Un score de 3 dans un seul paramètre impose une réponse urgente dans le service. Un total de 5 ou 6 constitue le seuil clé d’une réponse urgente, et un total de 7 ou plus impose une réponse d’urgence par une équipe compétente en soins critiques, avec une surveillance continue.</p><div class="lab">Place dans le sepsis</div><p>La Surviving Sepsis Campaign 2026 recommande (recommandation forte, certitude modérée) ce type de score, ou les critères de réponse inflammatoire, plutôt que le qSOFA employé seul pour dépister le sepsis à l’hôpital. Le score ne dit pas si une infection est la cause : il signale un patient qui se dégrade.</p><div class="lab">Exemple</div><p>Mme R. obtient 3 points pour la fréquence respiratoire, 2 pour la saturation, 3 pour la pression systolique, 2 pour le pouls et 3 pour la confusion nouvelle, soit 13 points. Elle relève donc d’une réponse d’urgence.</p><div class="lab">Piège</div><p>Un score bas n’exclut pas un sepsis débutant, et le score se recalcule à chaque mesure. Le jugement clinique garde la priorité sur le total.</p></template>
<template data-pop="a41-bacteriemie" data-title="Bactériémie : sens et limites"><div class="lab">Définition</div><p>La bactériémie désigne la présence de bactéries vivantes dans le sang, prouvée par une hémoculture. Elle peut être transitoire, comme après un brossage des dents, ou soutenue, comme dans une endocardite.</p><div class="lab">Relation avec le sepsis</div><p>La bactériémie et le sepsis sont deux notions distinctes. Une bactériémie peut rester sans défaillance d’organe, et un sepsis peut survenir sans bactériémie. Selon le groupe de travail Sepsis-3, une culture n’est positive que dans 30 à 40 % des sepsis.</p><div class="lab">Valeur des frissons</div><p>Des frissons avec tremblement de tout le corps augmentent nettement la probabilité de bactériémie. Dans une étude de 526 patients fébriles, leur risque relatif de bactériémie était de 12,1 par rapport à l’absence de frissons.</p><div class="lab">Pièges</div><p>Une hémoculture positive à un germe de la peau, comme un staphylocoque à coagulase négative, dans un seul flacon, évoque une contamination. Une bactériémie à <i>Staphylococcus aureus</i> n’est au contraire jamais tenue pour une contamination, et elle fait rechercher une endocardite.</p><div class="lab">Conséquence pratique</div><p>Une bactériémie identifie l’agent et guide la désescalade ; son absence ne retire pas le diagnostic de sepsis. Dans la population sélectionnée de BALANCE (2025), 7 jours étaient non inférieurs à 14 jours pour la mortalité à 90 jours. L’essai excluait <i>Staphylococcus aureus</i>, l’immunodépression sévère et les foyers nécessitant un traitement prolongé. Ces situations gardent une durée propre ; l’essai ne prouve pas que toute bactériémie relève de 7 jours.</p><div class="src"><b>Référence de la précision.</b> <a href="https://pubmed.ncbi.nlm.nih.gov/39565030/" target="_blank" rel="noopener">Daneman et coll., BALANCE, 2025</a>, résumé relu le 8 octobre 2026.</div></template>
<template data-pop="a41-postsepsis" data-title="Syndrome post-sepsis : séquelles et suivi"><div class="lab">Définition</div><p>Le syndrome post-sepsis regroupe les atteintes physiques, cognitives et psychiques qui persistent après un sepsis. Il s’accompagne d’un risque accru de réhospitalisation et de décès dans les mois qui suivent.</p><div class="lab">Mécanismes</div><p>La revue de Prescott et Angus (2018) cite trois mécanismes : l’aggravation accélérée des maladies chroniques préexistantes, les lésions d’organe résiduelles et une fonction immunitaire altérée.</p><div class="lab">Chiffres</div><p>Parmi les survivants, la moitié récupère, un tiers meurt dans l’année et un sixième garde des limitations sévères. Les patients acquièrent en moyenne une à deux limitations fonctionnelles nouvelles, comme l’incapacité de se laver ou de s’habiller seul. La prévalence d’une atteinte cognitive modérée à sévère passe de 6,1 % à 16,7 %. L’anxiété touche 32 % des survivants, la dépression 29 % et l’état de stress post-traumatique 44 %. Environ 40 % sont réhospitalisés dans les 90 jours. Le Swiss Sepsis Report 2025 rapporte une mortalité cumulative proche de 30 % un an après l’admission chez les patients d’au moins 65 ans. Ce total comprend les 22,3 % de décès hospitaliers ; il ne correspond pas à 30 % de décès supplémentaires après la sortie.</p><div class="lab">Recommandations</div><p>La Surviving Sepsis Campaign 2026 suggère d’offrir un suivi après une maladie critique, des services de santé mentale et, après une ventilation invasive de plus de 48 heures, une rééducation physique. Elle demande d’orienter vers un professionnel adapté tout survivant qui présente des symptômes de trouble psychique. Les preuves restent insuffisantes pour recommander une thérapie cognitive spécifique.</p><div class="lab">Conséquence pratique</div><p>Le médecin traitant recherche les problèmes nouveaux, révise les médicaments de fond et prévient les causes traitables de réhospitalisation : infection, insuffisance cardiaque, insuffisance rénale et inhalation. Chez un patient dont la santé déclinait déjà avant le sepsis, une approche centrée sur le soulagement des symptômes peut être la plus appropriée.</p><div class="src"><b>Référence de la précision.</b> Swiss Sepsis Report 2025, version 25.1, section 3.3.5 et figure 4 : mortalité cumulative, décès hospitaliers compris ; texte relu le 8 octobre 2026.</div></template>
<template data-pop="a41-pam" data-title="Pression artérielle moyenne : mesure et signification"><div class="lab">Définition</div><p>La pression artérielle moyenne est la pression moyenne qui règne dans les artères au cours d’un cycle cardiaque. Elle est plus proche de la pression diastolique que de la systolique, car la diastole dure plus longtemps que la systole.</p><div class="lab">Déterminants</div><p>La pression moyenne dépend du débit cardiaque et des résistances vasculaires systémiques. Dans le sepsis, la vasoplégie abaisse les résistances, et la pression chute malgré un débit parfois élevé. Le retour veineux dépend du gradient entre la pression systémique moyenne de remplissage et la pression auriculaire droite. La première dépend du volume sanguin contraint et du tonus veineux, plutôt que de la pression artérielle moyenne seule. La noradrénaline contracte aussi les veines : elle recrute une part du volume non contraint et peut augmenter ce gradient. Le remplissage corrige l’hypovolémie absolue et une part de la relative ; la noradrénaline restaure le tonus artériolaire et veineux.</p><p>Hamzaoui et coll. (2010) observaient une hausse de la précharge et du débit après noradrénaline chez 105 patients très hypotendus. La diminution de capacitance veineuse est un mécanisme proposé, et non une preuve isolée de gain de survie. Cette étude observationnelle ne permet pas de remplacer le remplissage nécessaire par un vasopresseur.</p><div class="lab">Mesure</div><p>Les tensiomètres automatiques oscillométriques mesurent directement la pression moyenne. Un cathéter artériel la mesure en continu. La Surviving Sepsis Campaign 2026 le conseille lorsque les doses de vasopresseur sont intermédiaires à élevées ou croissantes, lorsque plusieurs vasopresseurs sont nécessaires, lorsque les gaz du sang sont fréquents ou lorsque les mesures non invasives sont discordantes.</p><div class="lab">Cibles</div><p>La cible initiale est de 65 mmHg, dans une plage d’environ 5 mmHg (recommandation forte, certitude modérée). Dès 65 ans, une plage de 60 à 65 mmHg est suggérée (recommandation conditionnelle, certitude faible). L’essai SEPSISPAM n’a pas montré de bénéfice de mortalité d’une cible de 80 à 85 mmHg ; la fenêtre <button class="w" data-k="a41-norad">noradrénaline (mécanisme, posologie suisse, essais)</button> en donne les résultats.</p><div class="lab">Piège</div><p>Une pression moyenne à la cible ne garantit pas la perfusion de chaque organe. Dans une analyse de sous-groupe de SEPSISPAM (2014), les hypertendus chroniques sous cible haute recevaient moins d’épuration extrarénale. Aucun bénéfice de mortalité n’était démontré ; la cible haute augmentait la fibrillation atriale dans l’essai. Ce résultat de sous-groupe appelle une adaptation prudente, et non une cible haute systématique.</p><div class="lab">Exemple</div><p>Chez Mme R., la pression artérielle de 82/46 mmHg correspond à une pression moyenne de 58 mmHg, affichée par le moniteur. Sous noradrénaline, elle atteint 64 mmHg à la deuxième heure, dans la plage suggérée après 65 ans.</p><div class="src"><b>Référence de la précision.</b> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2945123/" target="_blank" rel="noopener">Hamzaoui et coll., 2010</a>, texte intégral relu le 8 octobre 2026 ; Surviving Sepsis Campaign 2021, section « Mean arterial pressure » ; Surviving Sepsis Campaign 2026, énoncés sur la pression moyenne ; <a href="https://pubmed.ncbi.nlm.nih.gov/24635770/" target="_blank" rel="noopener">Asfar et coll., SEPSISPAM, 2014</a>, résumé relu le 8 octobre 2026.</div><div class="lab" data-reference-scope="a41-pam">Texte de référence applicable</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, ESICM, <i>Intensive Care Medicine</i>, publiée le 23 mars 2026 : pression moyenne, énoncés 13–14.</a></li></ul></template>
<template data-pop="a41-cardiomyo" data-title="Cardiomyopathie septique"><div class="lab">Définition</div><p>La cardiomyopathie septique est une dysfonction du ventricule gauche, du ventricule droit ou des deux, induite par le sepsis et réversible. Elle survient sans obstruction des artères coronaires et régresse en général avec la guérison.</p><div class="lab">Mécanisme</div><p>Les cytokines, le monoxyde d’azote et l’atteinte mitochondriale réduisent la contractilité. Les récepteurs bêta-adrénergiques répondent moins aux catécholamines.</p><div class="lab">Reconnaissance</div><p>L’échographie cardiaque au lit révèle la dysfonction. Le médecin y pense devant une hypoperfusion qui persiste malgré une pression et une volémie adéquates, ou devant des extrémités froides avec une pression pulsée faible.</p><div class="lab">Traitement</div><p>La Surviving Sepsis Campaign 2026 suggère la noradrénaline ou l’adrénaline comme premier vasopresseur en cas de dysfonction cardiaque associée. Si l’hypoperfusion persiste malgré une volémie et une pression adéquates, elle suggère d’ajouter la dobutamine à la noradrénaline, ou d’employer l’adrénaline seule. L’inotrope s’ajoute au vasopresseur sans le remplacer. Elle suggère de ne pas employer le lévosimendan.</p><div class="lab">Piège</div><p>Une fraction d’éjection normale peut masquer une dysfonction lorsque les résistances vasculaires sont très basses. À l’inverse, un remplissage excessif aggrave un cœur défaillant.</p></template>
<template data-pop="a41-civd" data-title="Coagulation intravasculaire disséminée"><div class="lab">Définition</div><p>La coagulation intravasculaire disséminée est une activation diffuse de la coagulation dans les vaisseaux. Elle forme des microthrombi qui obstruent les petits vaisseaux, puis consomme les plaquettes et les facteurs, ce qui expose au saignement.</p><div class="lab">Mécanisme</div><p>Le facteur tissulaire exprimé par les monocytes et l’endothélium déclenche la coagulation. Les anticoagulants naturels, comme l’antithrombine et la protéine C, sont consommés, et la fibrinolyse est inhibée.</p><div class="lab">Reconnaissance</div><p>Une coagulation intravasculaire disséminée se suspecte devant une thrombopénie, des troubles de la coagulation et des signes hémorragiques ou ischémiques. Le bilan comprend les plaquettes, le temps de prothrombine, le fibrinogène et les D-dimères, interprétés selon leur évolution.</p><div class="lab">Valeur</div><p>La baisse des plaquettes entre dans le score SOFA : moins de 150 × 10⁹/L rapporte 1 point, et moins de 20 × 10⁹/L en rapporte 4.</p><div class="lab">Piège</div><p>Une thrombopénie n’est pas toujours une coagulation intravasculaire : une hémodilution, un médicament ou une thrombopénie induite par l’héparine peuvent la causer. Le médecin interprète la coagulation et le fibrinogène avec leur évolution, et non isolément.</p><div class="lab">Conséquence pratique</div><p>Le traitement de la cause, c’est-à-dire de l’infection et du foyer, reste la mesure principale. L’évaluation spécialisée guide le recours aux produits sanguins.</p></template>
<template data-pop="a41-bmr" data-title="Germes multirésistants, anaérobies et champignons : critères 2026"><div class="lab">Principe</div><p>La Surviving Sepsis Campaign 2026 fonde le spectre empirique sur les facteurs de risque individuels. Elle cherche à éviter à la fois le traitement inactif et l’exposition inutile à des molécules à large spectre.</p><div class="lab">Germes multirésistants</div><p>Elle suggère de couvrir un germe multirésistant précis lorsque le risque est élevé, et de ne pas le couvrir lorsque le risque est faible (recommandations conditionnelles, certitude très faible). Les facteurs de risque sont la colonisation par ce germe, une infection antérieure par ce germe, une antibiothérapie à large spectre prolongée et une hospitalisation prolongée dans une unité où ce germe est fréquent.</p><div class="lab">Anaérobies</div><p>Sans facteur de risque, elle suggère un traitement empirique sans couverture anaérobie ; avec un facteur de risque, elle suggère de l’inclure. Les facteurs de risque sont un foyer intra-abdominal ou gynéco-obstétrical profond, une infection nécrosante des tissus mous, un foyer de la tête et du cou, un abcès ou un empyème du système nerveux central. Lorsqu’une couverture des germes multirésistants est nécessaire, une molécule active aussi sur les anaérobies, comme la pipéracilline/tazobactam ou un carbapénème, peut convenir.</p><div class="lab">Champignons</div><p>Elle suggère de ne pas prescrire d’antifongique empirique (recommandation conditionnelle, certitude faible). Elle en discute l’emploi au cas par cas en présence de facteurs de risque : immunodépression, antibiothérapie prolongée, hospitalisation prolongée et foyer intra-abdominal. Elle suggère aussi de ne pas utiliser les biomarqueurs de <i>Candida</i> pour décider de débuter un antifongique.</p><div class="lab">Tests rapides</div><p>Elle suggère des tests diagnostiques rapides ciblant un agent, au cas par cas, selon la clinique, l’écologie locale, la saison et la disponibilité (recommandation conditionnelle, certitude faible).</p><div class="lab">Exemple</div><p>Mme R. n’a ni colonisation connue, ni antibiothérapie récente, ni hospitalisation récente, et son foyer est urinaire. Aucune couverture des germes multirésistants, des anaérobies ou des champignons n’est donc suggérée.</p></template>
<template data-pop="a41-cortico" data-title="Corticothérapie au long cours et dose de stress d’hydrocortisone"><div class="lab">Définition</div><p>La recommandation conjointe de la Société européenne d’endocrinologie et de l’Endocrine Society (2024) appelle corticothérapie au long cours une prise de plus de 3 à 4 semaines à une dose supérieure à l’équivalent physiologique. Cet équivalent correspond à 15 à 25 mg d’hydrocortisone, ou à 4 à 6 mg de prednisone ou de prednisolone, par jour.</p><div class="lab">Mécanisme</div><p>Les glucocorticoïdes administrés freinent la sécrétion hypothalamique et hypophysaire, donc celle de l’ACTH. Les surrénales, moins stimulées, produisent moins de cortisol. Lors d’un stress majeur comme un sepsis, le besoin en cortisol augmente brusquement ; la surrénale freinée ne peut pas y répondre, et une crise surrénalienne peut survenir.</p><div class="lab">Signes d’alerte</div><p>La crise surrénalienne associe une hypotension ou un choc, parfois des vomissements, une hyponatrémie et une hypoglycémie. Dans l’insuffisance induite par les glucocorticoïdes, l’aldostérone reste généralement sécrétée, car elle dépend surtout de la rénine et du potassium. L’hyperkaliémie n’est donc pas attendue ; son absence ne rassure pas. Sa présence fait rechercher notamment une insuffisance surrénalienne primaire ou une atteinte rénale. Elle ressemble au choc septique, avec lequel elle peut coexister chez le patient sous corticoïdes.</p><div class="lab">Dose de stress</div><p>Chez le patient sous glucocorticoïdes actuels ou récents dont le risque surrénalien n’a pas été écarté, une maladie sévère imposant l’hospitalisation, comme un sepsis, appelle une couverture de stress. La recommandation prévoit 100 mg d’hydrocortisone par voie intraveineuse ou intramusculaire immédiatement. Elle poursuit par 200 mg par 24 heures en perfusion continue, ou par 50 mg toutes les 6 heures si la perfusion continue n’est pas possible. La durée et la dose suivantes s’adaptent au stress, à l’état du patient et aux glucocorticoïdes déjà reçus. Sous au moins 200 mg d’hydrocortisone ou 50 mg de prednisone par jour, une augmentation est habituellement inutile. En cas de vomissements, de malabsorption ou d’impossibilité de prise orale, la voie parentérale reste nécessaire.</p><div class="lab">Recommandations associées</div><p>La recommandation demande une couverture de stress pour tout patient sous corticothérapie actuelle ou récente dont l’axe n’a pas été testé (bonne pratique clinique). Elle suggère d’évoquer une crise surrénalienne devant une instabilité hémodynamique, quels que soient le type, la voie et la dose du glucocorticoïde.</p><div class="lab">Piège</div><p>Cette indication ne dépend pas du seuil de noradrénaline de la Surviving Sepsis Campaign 2021, qui concerne la corticothérapie du choc septique. L’arrêt brutal de la prednisone pendant l’infection exposerait au contraire à la crise surrénalienne.</p><div class="lab">Exemple</div><p>Mme R. prend 7,5 mg de prednisone par jour depuis deux ans, au-delà de l’équivalent physiologique. Elle reçoit 100 mg d’hydrocortisone à la quarantième minute, puis 200 mg par 24 heures ; la dose est ensuite réduite jusqu’à sa prednisone habituelle, avec l’endocrinologue.</p><div class="src"><b>Référence de la précision.</b> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">Beuschlein et coll., ESE/Endocrine Society, 2024</a>, fonction minéralocorticoïde et dose de stress, texte intégral relu le 8 octobre 2026.</div></template>
<template data-pop="a41-asplenie" data-title="Asplénie et infections fulminantes"><div class="lab">Définition</div><p>L’asplénie désigne l’absence de rate, après une splénectomie, ou une rate qui ne fonctionne plus, comme dans certaines hémoglobinopathies.</p><div class="lab">Mécanisme</div><p>La rate filtre le sang et retire les bactéries encapsulées recouvertes d’anticorps. Sans rate, ces bactéries se multiplient dans le sang sans être éliminées.</p><div class="lab">Agents</div><p>Les agents principaux sont <i>Streptococcus pneumoniae</i>, <i>Neisseria meningitidis</i> et <i>Haemophilus influenzae</i>. Après une morsure de chien, <i>Capnocytophaga canimorsus</i> peut causer un sepsis fulminant.</p><div class="lab">Présentation</div><p>L’infection peut évoluer en quelques heures d’un état grippal vers un purpura extensif, une coagulation intravasculaire et un choc.</p><div class="lab">Conséquence pratique</div><p>Chez un patient asplénique fébrile, l’antibiotique s’administre sans délai, avant tout examen si l’état l’exige. La prévention repose sur les vaccinations prévues pour les groupes à risque par le Plan de vaccination suisse, qui cite l’asplénie et la dysfonction splénique, et sur l’éducation du patient.</p></template>
<template data-pop="a41-allergie" data-title="Allergie médicamenteuse : caractériser"><div class="lab">Pourquoi caractériser</div><p>Une allergie mal décrite peut priver le patient du meilleur antibiotique. Une étiquette « allergie à la pénicilline » peut conduire à choisir une molécule moins active ou à spectre plus large.</p><div class="lab">Questions</div><p>Le médecin demande la substance exacte, le délai entre la prise et la réaction, la nature de la manifestation, sa gravité, le traitement reçu et la tolérance ultérieure d’autres bêta-lactamines.</p><div class="lab">Types de réaction</div><p>Une réaction immédiate, survenue rapidement après la prise, avec urticaire, bronchospasme, hypotension ou œdème, évoque un mécanisme par IgE. Une éruption retardée de quelques jours, sans atteinte muqueuse ni organique, relève d’un autre mécanisme et comporte en général un risque moindre. Une atteinte cutanée sévère, comme un syndrome de Stevens-Johnson ou un DRESS, contre-indique définitivement la molécule en cause.</p><div class="lab">Conséquence pratique</div><p>Une allergie immédiate prouvée aux bêta-lactamines exige une stratégie alternative, qui tient compte du type exact de réaction. Une allergie douteuse se documente et se fait évaluer par l’allergologue après l’épisode aigu.</p><div class="lab">Piège</div><p>Des troubles digestifs ou une mycose après un antibiotique ne constituent pas une allergie. Les noter comme telle fausse les choix futurs.</p></template>
<template data-pop="a41-directives" data-title="Objectifs de soins et directives anticipées"><div class="lab">Définition</div><p>Les objectifs de soins décrivent ce que le patient souhaite et accepte : réanimation, soins intensifs, intubation, ou priorité au confort. Les directives anticipées les fixent par écrit, avant que la maladie n’empêche le patient de s’exprimer.</p><div class="lab">Recommandations</div><p>La Surviving Sepsis Campaign 2026 demande de discuter des objectifs de soins et du pronostic avec le patient ou ses proches (bonne pratique). Elle suggère de le faire tôt, dans les 72 heures (recommandation conditionnelle, certitude faible). Elle demande d’intégrer les principes des soins palliatifs lorsque c’est approprié, mais suggère de ne pas demander en routine une consultation formelle de soins palliatifs.</p><div class="lab">Essai limité dans le temps</div><p>Un essai limité dans le temps consiste à engager des traitements de soins intensifs pour une durée définie, puis à décider selon la réponse. Les preuves restent insuffisantes pour le recommander ou le déconseiller de façon formelle.</p><div class="lab">Conséquence pratique</div><p>La discussion n’attend pas l’aggravation. Chez Mme R., le souhait d’être réanimée si une chance raisonnable de guérison existe est noté dès l’admission.</p></template>
<template data-pop="a41-frissons" data-title="Frissons : degré et valeur pour la bactériémie"><div class="lab">Définition</div><p>Les frissons sont des contractions musculaires involontaires qui produisent de la chaleur et élèvent la température. Ils accompagnent la montée thermique, lorsque le cerveau a relevé le point de consigne de la température.</p><div class="lab">Gradation</div><p>Une étude de 526 patients fébriles aux urgences a distingué trois degrés. Les frissons légers correspondent à une sensation de froid qui fait mettre une veste. Les frissons modérés imposent une couverture épaisse. Les frissons intenses provoquent un tremblement de tout le corps, même sous une couverture épaisse.</p><div class="lab">Valeur</div><p>Dans cette étude, 7,6 % des patients avaient une bactériémie. Par rapport à l’absence de frissons, le risque relatif de bactériémie était de 12,1 pour les frissons intenses, de 4,1 pour les frissons modérés et de 1,8 pour les frissons légers. Les frissons intenses avaient une spécificité de 90,3 % et un rapport de vraisemblance positif de 4,65. L’absence de tout frisson avait un rapport de vraisemblance négatif de 0,24 : elle rendait la bactériémie moins probable, sans l’exclure.</p><div class="lab">Piège</div><p>Les frissons indiquent une probabilité de bactériémie, et non un sepsis, qui exige une défaillance d’organe. Leur absence n’exclut ni la bactériémie ni le sepsis, surtout chez le sujet âgé ou sous corticoïdes.</p><div class="lab">Conséquence pratique</div><p>Des frissons intenses justifient des hémocultures immédiates. Mme R. décrit ce degré de frissons la veille de son admission.</p></template>
<template data-pop="a41-fievre" data-title="Fièvre et hypothermie : mesure et interprétation"><div class="lab">Définition</div><p>La fièvre est une élévation de la température centrale par relèvement du point de consigne hypothalamique. L’hypothermie est une température centrale basse. Les critères de réponse inflammatoire retiennent une température supérieure à 38 °C ou inférieure à 36 °C.</p><div class="lab">Mécanisme</div><p>Des cytokines, comme l’IL-1, l’IL-6 et le TNF-α, induisent la synthèse de PGE₂ dans l’hypothalamus, qui relève le point de consigne. Chez le sujet âgé ou sous corticoïdes, cette réponse est atténuée, et la fièvre peut manquer.</p><div class="lab">Mesure</div><p>Le médecin mesure la température à un site fiable et note le site employé, car les valeurs varient d’un site à l’autre. Une température prise sur une peau froide sous-estime la température centrale.</p><div class="lab">Valeur et limites</div><p>Dans le National Early Warning Score 2, une température de 36,1 à 38,0 °C ne rapporte aucun point, et une température de 35,0 °C ou moins en rapporte 3. Une température normale n’exclut pas le sepsis : Mme R. n’a que 37,6 °C.</p><div class="lab">Traitement de la fièvre</div><p>La Surviving Sepsis Campaign 2026 suggère de ne pas employer d’antipyrétique, médicamenteux ou par refroidissement externe, dans le seul but d’améliorer le pronostic. L’antipyrétique reste permis pour soulager la douleur ou les symptômes, et pour les patients qui ont une autre indication de contrôle thermique.</p><div class="lab">Piège</div><p>Un antipyrétique pris avant l’arrivée peut masquer la fièvre. Le médecin demande donc les médicaments pris dans les heures précédentes.</p></template>
<template data-pop="a41-oligurie" data-title="Oligurie : définition et mesure"><div class="lab">Définition</div><p>L’oligurie est une diurèse insuffisante. Selon KDIGO, une diurèse inférieure à 0,5 mL/kg/h pendant 6 heures suffit à définir une atteinte rénale aiguë. Pour Mme R., qui pèse 60 kg, ce seuil correspond à 30 mL par heure.</p><div class="lab">Mécanisme</div><p>Le rein réduit sa production d’urine lorsque sa perfusion baisse, afin de conserver le volume sanguin. Dans le sepsis, l’inflammation et les microthrombi lèsent aussi le rein lui-même. Un obstacle sur les voies urinaires bloque enfin l’écoulement, quelle que soit la production.</p><div class="lab">Mesure</div><p>L’anamnèse estime la diurèse des dernières heures. En cas de choc, une sonde vésicale permet une mesure horaire.</p><div class="lab">Seuils</div><p>Selon KDIGO, une diurèse inférieure à 0,5 mL/kg/h pendant 6 à 12 heures correspond au stade 1, et pendant 12 heures ou plus au stade 2. Une diurèse inférieure à 0,3 mL/kg/h pendant 24 heures, ou une anurie de 12 heures, correspond au stade 3. Le score SOFA rénal retient une diurèse inférieure à 500 mL par jour (3 points) ou à 200 mL par jour (4 points).</p><div class="lab">Piège</div><p>Une oligurie impose de rechercher un globe vésical ou un obstacle avant d’ajouter du soluté. Chez Mme R., l’oligurie persiste tant que le rein droit obstrué n’est pas drainé.</p></template>
<template data-pop="a41-glasgow" data-title="Score de Glasgow"><div class="lab">Définition</div><p>Le score de Glasgow, décrit en 1974 par Teasdale et Jennett, évalue le niveau de conscience. Il additionne trois réponses : l’ouverture des yeux, cotée de 1 à 4, la réponse verbale, de 1 à 5, et la réponse motrice, de 1 à 6. Le total varie de 3 à 15.</p><div class="lab">Technique</div><p>Les yeux s’ouvrent spontanément, au son, à la pression, ou pas du tout. La réponse verbale est orientée, confuse, faite de mots, de sons, ou absente. La réponse motrice obéit aux ordres, localise, fléchit normalement, fléchit anormalement, étend, ou reste absente. Le médecin cote la meilleure réponse obtenue.</p><div class="lab">Valeur dans le sepsis</div><p>Un score inférieur à 15 correspond à l’altération mentale du qSOFA. Dans le score SOFA, un score de 13 ou 14 rapporte 1 point, de 10 à 12 rapporte 2 points, de 6 à 9 rapporte 3 points, et un score inférieur à 6 rapporte 4 points.</p><div class="lab">Piège</div><p>Une sédation, une aphasie ou une intubation faussent la cotation. Le médecin décrit alors chaque composante plutôt que le seul total.</p><div class="lab">Exemple</div><p>Mme R. ouvre les yeux spontanément, parle de façon confuse et obéit aux ordres : 4 + 4 + 6, soit 14 points.</p></template>
<template data-pop="a41-spo2" data-title="SpO₂ : principe et limites de l’oxymétrie"><div class="lab">Principe</div><p>L’oxymètre de pouls estime la saturation de l’hémoglobine en oxygène à partir de l’absorption de deux lumières, rouge et infrarouge, par le sang pulsé du doigt. La SpO₂ qu’il affiche approche la SaO₂ mesurée par la gazométrie.</p><div class="lab">Limites</div><p>La Surviving Sepsis Campaign 2026 rappelle que le rapport SpO₂/FiO₂ peut remplacer le rapport PaO₂/FiO₂, mais qu’il est moins précis en cas de choc, chez les personnes à la peau foncée, et lorsque la saturation est inférieure à 90 % ou supérieure à 97 %. En état de choc, la vasoconstriction périphérique réduit le signal pulsé.</p><div class="lab">Référence</div><p>La gazométrie artérielle est la référence pour l’oxygénation. Elle renseigne aussi le pH, la PaCO₂, le lactate et les bicarbonates, et la recommandation la préfère lorsqu’elle est disponible.</p><div class="lab">Repères</div><p>Dans le National Early Warning Score 2, une SpO₂ de 96 % ou plus ne rapporte aucun point sur l’échelle habituelle, et une SpO₂ de 91 % ou moins en rapporte 3.</p><div class="lab">Piège</div><p>Une saturation normale sous oxygène ne renseigne pas sur la valeur sans soutien. Le médecin note toujours le débit ou la fraction d’oxygène avec la saturation.</p></template>
<template data-pop="a41-fasciite" data-title="Infection nécrosante des tissus mous"><div class="lab">Définition</div><p>Une infection nécrosante des tissus mous détruit la peau, la graisse sous-cutanée, le fascia ou le muscle. Elle progresse vite et peut s’accompagner d’un choc toxique.</p><div class="lab">Agents</div><p>Elle est due à <i>Streptococcus pyogenes</i>, parfois associé à <i>Staphylococcus aureus</i>, ou à une flore mixte aérobie et anaérobie.</p><div class="lab">Signes</div><p>Une douleur disproportionnée par rapport à l’aspect de la peau est le signe d’alerte principal. Un œdème tendu, une progression rapide, des bulles, une nécrose, une crépitation et une anesthésie de la peau complètent le tableau.</p><div class="lab">Recommandations</div><p>La Surviving Sepsis Campaign 2026 range l’infection nécrosante parmi les facteurs de risque qui justifient une couverture anaérobie. Une suspicion forte d’infection nécrosante impose une exploration chirurgicale immédiate avec exérèse des tissus nécrosés. Le repère général de la Surviving Sepsis Campaign 2026, idéalement dans les six heures, n’est pas une cible d’attente pour cette infection.</p><div class="lab">Piège</div><p>Au début, la peau peut paraître presque normale. L’imagerie ne doit pas retarder la chirurgie lorsque la suspicion est forte.</p></template>
<template data-pop="a41-chocs" data-title="Autres états de choc : mécanismes et signes distinctifs"><div class="lab">Classification</div><p>Un choc est une défaillance circulatoire qui prive les tissus d’oxygène. On en distingue quatre mécanismes : hypovolémique, cardiogénique, obstructif et distributif. Le choc septique appartient au groupe distributif, comme l’anaphylaxie.</p><div class="lab">Signes distinctifs</div><p>Le tableau suivant résume les signes qui orientent. La première colonne nomme le type de choc, la deuxième son mécanisme, la troisième l’indice clinique qui le suggère.</p><table class="t"><tr><th>Type de choc</th><th>Mécanisme</th><th>Indice clinique</th></tr><tr><td>Hypovolémique</td><td>Volume sanguin insuffisant</td><td>Pertes visibles, veines jugulaires plates, extrémités froides</td></tr><tr><td>Cardiogénique</td><td>Défaillance de la pompe cardiaque</td><td>Crépitants, turgescence jugulaire, extrémités froides</td></tr><tr><td>Obstructif</td><td>Obstacle au remplissage ou à l’éjection du cœur</td><td>Turgescence jugulaire, dyspnée brutale, asymétrie auscultatoire</td></tr><tr><td>Distributif</td><td>Vasodilatation et fuite capillaire</td><td>Extrémités parfois chaudes au début, fièvre ou urticaire</td></tr></table><p>Le médecin lit d’abord la dernière colonne, car ces signes se voient au lit. L’erreur fréquente consiste à conclure au choc septique chez un patient fébrile sans exclure un choc associé.</p><div class="lab">Échographie au lit</div><p>L’échographie cardiaque et pulmonaire au lit distingue ces mécanismes : ventricules peu remplis, cœur défaillant, épanchement péricardique ou dilatation du ventricule droit. Le consensus de 2026 sur le choc septique réfractaire la retient lorsqu’un choc mixte est suspecté.</p><div class="lab">Piège</div><p>Les mécanismes se combinent. Un sepsis associe une part hypovolémique et parfois une part cardiogénique, et un patient septique peut aussi saigner.</p></template>
<template data-pop="a41-refractaire" data-title="Choc septique réfractaire : critères de 2026"><div class="lab">Définition</div><p>En 2026, un consensus Delphi conjoint de la Société européenne de médecine intensive et de la Society of Critical Care Medicine a proposé des critères cliniques du choc septique réfractaire. Le panel réunissait 56 experts, et 13 énoncés ont atteint le consensus au terme de cinq tours.</p><div class="lab">Critères</div><p>Le choc réfractaire se caractérise par un lactate qui reste élevé ou par un temps de recoloration capillaire qui reste allongé. Le patient ne répond plus au remplissage et reçoit une dose d’équivalent noradrénaline base supérieure à 0,5 µg/kg/min. Une échographie au lit est réalisée lorsqu’un choc mixte est suspecté.</p><div class="lab">Pourquoi ces critères</div><p>Les experts ont retenu à la fois des marqueurs de défaillance d’organe, de perfusion tissulaire, de réponse au remplissage et de dose de vasopresseur. C’est l’hypoperfusion qui persiste malgré une dose élevée qui définit le stade réfractaire, et non la dose seule.</p><div class="lab">Conséquence pratique</div><p>Le choc réfractaire impose de revoir le diagnostic : foyer non contrôlé, choc mixte, crise surrénalienne ou hypovolémie persistante. Il appelle les traitements de deuxième ligne : vasopressine, adrénaline, dobutamine si le cœur défaille, et hydrocortisone.</p><div class="lab">Exemple</div><p>Mme R. n’atteint pas ce stade : sa noradrénaline plafonne à 0,15 µg/kg/min et diminue après le drainage.</p><div class="lab" data-reference-scope="a41-refractaire">Texte de référence applicable</div><ul><li><a href="https://pubmed.ncbi.nlm.nih.gov/41874620/" target="_blank" rel="noopener" data-reference-source="1">Leone et coll., 2026 : consensus Delphi sur le choc réfractaire, résumé primaire (PMID 41874620).</a></li></ul></template>
<template data-pop="a41-sdra" data-title="Syndrome de détresse respiratoire aiguë et ventilation protectrice"><div class="lab">Définition</div><p>Le syndrome de détresse respiratoire aiguë est un œdème pulmonaire lésionnel, non cardiogénique. Il provoque une hypoxémie sévère avec des opacités pulmonaires bilatérales.</p><div class="lab">Mécanisme</div><p>L’inflammation lèse la membrane qui sépare les alvéoles des capillaires. Un liquide riche en protéines envahit les alvéoles, qui ne participent plus aux échanges gazeux. Le poumon devient rigide et hétérogène.</p><div class="lab">Ventilation protectrice</div><p>La Surviving Sepsis Campaign 2026 recommande un volume courant de 6 mL/kg de poids prédit à partir de la taille plutôt que plus de 10 mL/kg, et une pression de plateau limitée à 30 cm H₂O (recommandations fortes, certitude élevée). En cas d’atteinte modérée à sévère, elle suggère une pression expiratoire positive plus élevée, un décubitus ventral plus de 12 heures par jour et des bolus intermittents de curares plutôt qu’une perfusion continue. Elle recommande de ne pas employer de titration incrémentielle de la pression expiratoire positive.</p><div class="lab">Sans syndrome de détresse</div><p>Chez le patient septique en insuffisance respiratoire hypoxémique sans ce syndrome, elle suggère un volume courant de 6 à 8 mL/kg de poids idéal. Elle rappelle de dépister régulièrement le syndrome, souvent méconnu ou reconnu tard en pratique.</p><div class="lab">Dernier recours</div><p>Si la ventilation conventionnelle échoue, elle suggère une oxygénation extracorporelle par membrane veinoveineuse dans les centres expérimentés.</p><div class="lab">Piège</div><p>Un œdème pulmonaire après de grands volumes de soluté peut imiter le syndrome. L’échographie, la fonction cardiaque et le bilan hydrique aident à les distinguer.</p><div class="lab" data-reference-scope="a41-sdra">Texte de référence applicable</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, ESICM, <i>Intensive Care Medicine</i>, publiée le 23 mars 2026 : ventilation protectrice et décubitus ventral, énoncés 71, 73 et 76.</a></li></ul></template>
<template data-pop="a41-ira" data-title="Atteinte rénale aiguë : critères KDIGO"><div class="lab">Définition</div><p>Selon KDIGO, une atteinte rénale aiguë se définit par l’un des trois critères suivants. Le premier est une hausse de la créatinine d’au moins 26,5 µmol/L en 48 heures. Le deuxième est une créatinine d’au moins 1,5 fois la valeur de base, connue ou présumée, survenue dans les 7 jours précédents. Le troisième est une diurèse inférieure à 0,5 mL/kg/h pendant 6 heures.</p><div class="lab">Stades</div><p>Le stade 1 correspond à 1,5 à 1,9 fois la valeur de base, ou à une hausse d’au moins 26,5 µmol/L. Le stade 2 correspond à 2,0 à 2,9 fois la valeur de base. Le stade 3 correspond à 3 fois la valeur de base, à une créatinine d’au moins 353,6 µmol/L ou à la mise en route d’une épuration extrarénale.</p><div class="lab">Mécanisme dans le sepsis</div><p>Le rein septique souffre de la baisse de perfusion, de l’inflammation et des microthrombi. Un obstacle urinaire ou des médicaments néphrotoxiques peuvent s’y ajouter.</p><div class="lab">Recommandations</div><p>La Surviving Sepsis Campaign 2026 suggère de ne pas débuter d’épuration extrarénale sans indication formelle, et de choisir une technique continue ou intermittente lorsqu’elle est nécessaire. Elle suggère le bicarbonate lorsque le pH est de 7,2 ou moins et que l’atteinte rénale est de stade 2 ou 3.</p><div class="lab">Exemple</div><p>Chez Mme R., la créatinine passe de 78 à 186 µmol/L, soit 2,4 fois la valeur de base : l’atteinte est de stade 2. Elle culmine à 224 µmol/L sans indication d’épuration, puis redescend après le drainage.</p></template>
<template data-pop="a41-delai-atb" data-title="Délai de l’antibiotique : preuves et catégories de probabilité"><div class="lab">Recommandations 2026</div><p>La Surviving Sepsis Campaign 2026 classe les patients selon la probabilité d’infection et la présence d’un choc. Elle recommande l’antibiotique immédiatement, idéalement dans l’heure, pour un choc possible, probable ou certain, et pour un sepsis probable ou certain sans choc (recommandations fortes, certitude très faible). Pour un sepsis seulement possible sans choc, elle suggère une investigation rapide, puis l’antibiotique dans les trois heures si la suspicion persiste. Pour une infection peu probable sans choc, elle suggère de différer l’antibiotique en surveillant étroitement le patient.</p><div class="lab">Preuves</div><p>Dans une cohorte de 49 331 patients de 149 hôpitaux de l’État de New York, chaque heure écoulée avant l’antibiotique s’associait à une mortalité hospitalière ajustée plus élevée (rapport de cotes de 1,04 par heure). Le délai d’achèvement du premier remplissage n’avait pas cet effet (rapport de cotes de 1,01 par heure, non significatif). Ces preuves sont observationnelles, ce qui cadre avec une certitude jugée très faible.</p><div class="lab">Phase préhospitalière</div><p>Lorsque le délai prévu avant l’évaluation hospitalière dépasse 60 minutes, la recommandation suggère d’administrer l’antibiotique dans l’ambulance ou l’hélicoptère pour un sepsis probable ou certain avec hypotension. Elle exige alors un processus structuré de dépistage.</p><div class="lab">Piège</div><p>Les hémocultures ne doivent pas retarder l’antibiotique d’un patient en choc. Le délai de trois heures ne concerne que le sepsis seulement possible, sans choc.</p><div class="lab">Exemple</div><p>Mme R., en choc probable, reçoit l’antibiotique à la trentième minute, après des hémocultures prélevées à la quinzième minute.</p><div class="lab" data-reference-scope="a41-delai-atb">Texte de référence applicable</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, ESICM, <i>Intensive Care Medicine</i>, publiée le 23 mars 2026 : initiation de l’antibiotique, énoncés 16–20.</a></li></ul></template>
<template data-pop="a41-remplissage" data-title="Remplissage : solutés, volumes et réévaluation"><div class="lab">Pourquoi remplir</div><p>Le sepsis crée une hypovolémie absolue, par fuite capillaire et pertes, et relative, par dilatation veineuse. Le remplissage augmente le retour veineux et peut augmenter le débit cardiaque si le cœur répond encore à la précharge. Son excès aggrave les œdèmes ; dans l’étude SOAP, un bilan hydrique positif était associé au décès.</p><div class="lab">Choix du soluté : recommandations datées</div><p>La Surviving Sepsis Campaign 2026 recommande les cristalloïdes en première intention (recommandation forte, certitude modérée). Elle suggère les cristalloïdes équilibrés plutôt que le chlorure de sodium à 0,9 % (conditionnelle, certitude modérée). Le chlorure de sodium reste suggéré en cas de traumatisme crânien. Elle suggère les cristalloïdes seuls plutôt que l’ajout systématique d’albumine (conditionnelle, certitude modérée). Ses remarques réservent une place possible à l’albumine après de grands volumes ou chez le cirrhotique, et l’écartent après traumatisme crânien. Elle recommande de ne pas employer d’amidons (forte, certitude élevée) et suggère de ne pas employer de gélatines (conditionnelle, certitude modérée).</p><div class="lab">Pourquoi préférer un soluté équilibré</div><p>Le chlorure de sodium à 0,9 % apporte une charge en chlorure supérieure à celle des solutés équilibrés usuels. Cette charge peut induire une acidose métabolique hyperchlorémique ; les anions tampons des solutés équilibrés limitent cet effet. Les expériences rénales de Wilcox (1983) relient l’augmentation du chlorure à une vasoconstriction rénale et à une baisse de filtration. Ce mécanisme expérimental ne prouve pas à lui seul un bénéfice de survie chez le patient septique.</p><p>Chowdhury et coll. (2012) ont comparé 2 litres de chaque soluté chez 12 hommes sains, en essai croisé. Après le chlorure de sodium, la perfusion corticale rénale diminuait ; elle ne diminuait pas après Plasma-Lyte. Cette petite étude physiologique soutient le mécanisme rénal, mais ne mesure ni mortalité ni insuffisance rénale du sepsis. La Surviving Sepsis Campaign 2021 décrit ces risques physiologiques ; les grades ci-dessus viennent des énoncés officiels de 2026.</p><div class="lab">Ce que montrent les essais cliniques</div><p>Les essais suivants évaluent des adultes en soins intensifs, sans se limiter au sepsis. Leurs critères différents expliquent pourquoi un effet sur un critère rénal composite ne prouve pas un gain de survie.</p><table class="t"><tr><th>Essai et population</th><th>Comparaison</th><th>Résultat principal</th><th>Limite pour le sepsis</th></tr><tr><td>SMART, 2018 ; 15 802 adultes, cinq unités d’un centre</td><td>Cristalloïdes équilibrés contre chlorure de sodium à 0,9 %</td><td>Décès, nouvelle épuration ou dysfonction rénale persistante à 30 jours : 14,3 % contre 15,4 %</td><td>Randomisation par unité avec alternance des traitements ; critère composite, sans preuve isolée de gain de survie</td></tr><tr><td>BaSICS, 2021 ; 11 052 randomisés, 10 520 analysés, 75 unités</td><td>Soluté équilibré contre chlorure de sodium à 0,9 %</td><td>Mortalité à 90 jours : 26,4 % contre 27,2 % ; différence non significative</td><td>Population générale ; près de la moitié provenait d’une admission chirurgicale programmée</td></tr><tr><td>PLUS, 2022 ; 5 037 adultes, 53 unités</td><td>Plasma-Lyte 148 contre chlorure de sodium à 0,9 %</td><td>Mortalité à 90 jours : 21,8 % contre 22,0 % ; différence non significative</td><td>Aucun avantage démontré sur la mortalité ou la nouvelle épuration ; une faible différence reste possible</td></tr></table><p>SMART trouvait un effet modeste sur un critère composite, tandis que BaSICS et PLUS ne démontraient pas de gain de survie. Les populations, les volumes et les critères diffèrent ; ces essais ne prouvent pas que tous les solutés sont équivalents. Le mécanisme rénal et l’incertitude clinique rendent cohérente une suggestion, plutôt qu’une promesse de bénéfice majeur.</p><div class="lab">Pourquoi écarter les amidons</div><p>Les hydroxyéthylamidons sont des colloïdes synthétiques qui exposent à une toxicité rénale. Peron et coll. (2001) décrivaient des lésions tubulaires de type néphrose osmotique à la biopsie après leur administration. Ce cas ne prouve pas à lui seul leur rôle causal, car le patient recevait aussi de la ciclosporine néphrotoxique. La néphrotoxicité clinique est établie par les essais comparatifs, plutôt que par ce seul mécanisme histologique.</p><p>La preuve clinique vient notamment de 6S (2012), chez 798 patients analysés avec sepsis sévère. À 90 jours, la mortalité atteignait 51 % sous amidon contre 43 % sous Ringer acétate. Le recours à l’épuration rénale atteignait 22 % contre 16 %. Ce dommage mesuré justifie leur exclusion, contrairement à l’incertitude plus faible qui départage les deux types de cristalloïdes.</p><div class="lab">Pourquoi limiter l’albumine</div><p>L’albumine contribue à la pression oncotique plasmatique ; cela ne garantit pas un bénéfice lorsque la barrière capillaire fuit. SAFE (2004 ; 6 997 patients de soins intensifs) ne montrait pas de différence de mortalité à 28 jours avec l’albumine contre le chlorure de sodium. ALBIOS (2014 ; 1 818 patients avec sepsis sévère) testait l’albumine à 20 % ajoutée aux cristalloïdes. La pression moyenne augmentait et le bilan hydrique diminuait, mais la survie ne s’améliorait pas à 28 ou à 90 jours. Son coût et l’absence de gain global démontré expliquent que l’albumine ne soit pas ajoutée systématiquement.</p><div class="lab">Volume et réévaluation</div><p>La Surviving Sepsis Campaign 2026 suggère au moins 30 mL/kg dans les trois premières heures en cas d’hypoperfusion ou de choc. Le poids est réel, ou ajusté ou idéal si l’indice de masse corporelle dépasse 30 kg/m². Cette recommandation conditionnelle de faible certitude exige des réévaluations fréquentes ; elle ne dispense pas d’examiner le cœur et les poumons. Chaque bolus est suivi d’une évaluation de la perfusion, de l’auscultation et de l’oxygénation. Le lever passif de jambes avec mesure du volume d’éjection teste si le débit peut encore augmenter, sans apport supplémentaire.</p><div class="lab">Pourquoi abandonner les anciennes cibles fixes</div><p>ProCESS (2014), ARISE (2014) et ProMISe (2015) comparaient une réanimation précoce protocolisée aux soins usuels. Le protocole imposait notamment des cibles de pression veineuse centrale et de saturation veineuse centrale. Aucun de ces essais ne montrait de bénéfice de survie. Ils ne comparent pas directement chaque test dynamique, ni un volume universel de 30 mL/kg. La Surviving Sepsis Campaign 2026 suggère séparément les mesures dynamiques plutôt que l’examen ou les mesures statiques seuls.</p><div class="lab">Après les premiers apports</div><p>Dans CLOVERS (2023), 1 563 adultes restaient hypotendus après 1 à 3 litres. La stratégie restrictive privilégiait les vasopresseurs et ne modifiait pas la mortalité avant retour à domicile à 90 jours : 14,0 % contre 14,9 %. La Surviving Sepsis Campaign 2026 suggère donc une stratégie libérale ou restrictive selon le patient et les ressources après les premiers 30 mL/kg.</p><div class="lab">Piège</div><p>La poursuite des solutés jusqu’à normalisation du lactate conduit à la surcharge. Le médecin arrête les apports inutiles lorsque le débit ne répond plus ou que les poumons ne les tolèrent plus. Il recherche alors un autre mécanisme d’hypoperfusion et adapte les vasopresseurs.</p><div class="key"><b>À retenir.</b> Les solutés équilibrés limitent la charge en chlorure, mais leur bénéfice de survie reste incertain. Les amidons sont écartés pour leur dommage clinique ; l’albumine n’est pas systématique. La réponse au débit et la tolérance pulmonaire guident chaque nouvel apport.</div><div class="src"><b>Sources du raisonnement.</b> Énoncés officiels Surviving Sepsis Campaign 2026, publiés le 23 mars 2026, et Surviving Sepsis Campaign 2021, section « Fluid management ». Résumés primaires relus le 8 octobre 2026 : <a href="https://pubmed.ncbi.nlm.nih.gov/6826732/" target="_blank" rel="noopener">Wilcox, 1983</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22580944/" target="_blank" rel="noopener">Chowdhury, 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29485925/" target="_blank" rel="noopener">SMART, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34375394/" target="_blank" rel="noopener">BaSICS, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35041780/" target="_blank" rel="noopener">PLUS, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11393388/" target="_blank" rel="noopener">Peron et coll., 2001, cas de lésions tubulaires</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22738085/" target="_blank" rel="noopener">6S, 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15163774/" target="_blank" rel="noopener">SAFE, 2004</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24635772/" target="_blank" rel="noopener">ALBIOS, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24635773/" target="_blank" rel="noopener">ProCESS, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25272316/" target="_blank" rel="noopener">ARISE, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25776532/" target="_blank" rel="noopener">ProMISe, 2015</a>.</div><div class="lab" data-reference-scope="a41-remplissage">Texte de référence applicable</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, ESICM, <i>Intensive Care Medicine</i>, publiée le 23 mars 2026 : remplissage et solutés, énoncés 10–11 et 43–49.</a></li></ul></template>
<template data-pop="a41-lpj" data-title="Lever passif de jambes : technique et interprétation"><div class="lab">Principe</div><p>Le lever passif de jambes teste la réponse au remplissage sans perfuser de soluté. Il déplace vers le cœur le sang veineux des membres inférieurs et de l’abdomen, ce qui augmente transitoirement le retour veineux. Si le volume d’éjection augmente, le cœur répondrait à un remplissage réel.</p><div class="lab">Technique</div><p>Le test part de la position demi-assise à 45°. Le soignant bascule ensuite le lit pour abaisser le tronc et élever les jambes, puis le médecin mesure le débit cardiaque ou le volume d’éjection. L’effet maximal sur le débit survient en moins d’une minute ; dans les études, une hausse du débit cardiaque d’au moins 10 % définissait la réponse au remplissage.</p><div class="lab">Mesure</div><p>Le test exige une mesure directe du débit ou du volume d’éjection, par échocardiographie ou par un moniteur de débit. La Surviving Sepsis Campaign 2021 admet, lorsque ces mesures sont impossibles, une hausse de la pression pulsée de plus de 15 % pendant un lever de 60 à 90 secondes.</p><div class="lab">Recommandation</div><p>La Surviving Sepsis Campaign 2026 suggère de guider le remplissage par des mesures dynamiques plutôt que par l’examen physique ou des mesures statiques seules (recommandation conditionnelle, certitude faible).</p><div class="lab">Pièges</div><p>Une hypertension intra-abdominale peut rendre le test faussement négatif. La recommandation n’accepte la pression pulsée qu’à défaut d’une mesure du débit.</p></template>
<template data-pop="a41-oxygene" data-title="Oxygénation et ventilation : cibles et techniques"><div class="lab">Mesurer</div><p>La Surviving Sepsis Campaign 2026 suggère de mesurer l’oxygénation par la SpO₂ ou par la gazométrie artérielle, en même temps que l’examen clinique. La gazométrie reste la référence.</p><div class="lab">Cibles</div><p>Elle suggère une cible libérale ou conservatrice selon le patient et les ressources (recommandation conditionnelle, certitude faible). La plupart des essais comparaient une cible basse d’environ 90 à 93 % à une cible haute de 96 % ou plus. En pratique, les membres du panel visent une SpO₂ comprise entre 90 % et 96 %.</p><div class="lab">Techniques</div><p>En cas d’insuffisance respiratoire hypoxémique, avec un rapport PaO₂/FiO₂ inférieur à 200 ou un rapport SpO₂/FiO₂ inférieur à 235, elle suggère l’oxygénothérapie nasale à haut débit plutôt que l’oxygène conventionnel. Elle la préfère aussi à la ventilation non invasive en première intention, et à son alternance avec le haut débit. Elle suggère un essai de décubitus ventral chez le patient éveillé non intubé, sans sédation destinée à le faire tolérer.</p><div class="lab">Ventilation mécanique</div><p>En cas de syndrome de détresse respiratoire aiguë, la ventilation protectrice fait l’objet d’une recommandation forte : volume courant de 6 mL/kg de poids prédit à partir de la taille et pression de plateau d’au plus 30 cm H₂O. La fenêtre <button class="w" data-k="a41-sdra">syndrome de détresse respiratoire aiguë (mécanisme et ventilation protectrice)</button> la détaille.</p><div class="lab">Piège</div><p>Une saturation normale sous un fort débit d’oxygène peut masquer une défaillance respiratoire grave. Le médecin suit le rapport PaO₂/FiO₂ ou SpO₂/FiO₂, ainsi que la fréquence respiratoire.</p><div class="lab" data-reference-scope="a41-oxygene">Texte de référence applicable</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, ESICM, <i>Intensive Care Medicine</i>, publiée le 23 mars 2026 : oxygénation et haut débit, énoncés 66–68.</a></li></ul></template>
<template data-pop="a41-mesures" data-title="Mesures associées : glycémie, transfusion, prophylaxies, nutrition, rein"><div class="lab">Glycémie</div><p>La Surviving Sepsis Campaign 2026 recommande de débuter l’insuline à une glycémie de 10 mmol/L (180 mg/dL) ou plus (recommandation forte, certitude modérée). Le stress et l’hydrocortisone élèvent la glycémie. Après le début de l’insuline, la Surviving Sepsis Campaign 2021 propose habituellement une cible de 8 à 10 mmol/L. Les cibles plus basses augmentent les hypoglycémies sans bénéfice démontré sur la mortalité ; la surveillance suit le protocole d’insuline.</p><div class="lab">Transfusion</div><p>Elle recommande une stratégie transfusionnelle restrictive plutôt que libérale (recommandation forte, certitude modérée).</p><div class="lab">Prophylaxie thromboembolique</div><p>Elle recommande une prophylaxie médicamenteuse sauf contre-indication, par héparine de bas poids moléculaire plutôt que par héparine non fractionnée (recommandations fortes, certitude modérée). Elle suggère de ne pas y ajouter de compression mécanique.</p><div class="lab">Ulcère de stress</div><p>En présence de facteurs de risque d’hémorragie digestive, elle suggère un inhibiteur de la pompe à protons (recommandation conditionnelle, certitude modérée).</p><div class="lab">Nutrition et intestin</div><p>Elle suggère une nutrition entérale débutée dans les 72 heures, et suggère de ne pas employer de probiotiques. Chez le patient ventilé, dans une unité où la résistance aux antibiotiques est rare, elle suggère une décontamination digestive sélective.</p><div class="lab">Rein et acidose</div><p>Elle suggère de ne pas débuter d’épuration extrarénale sans indication formelle, et de ne pas donner de bicarbonate pour améliorer l’hémodynamique d’une acidose lactique. Elle suggère le bicarbonate si le pH est de 7,2 ou moins avec une atteinte rénale aiguë de stade 2 ou 3.</p><div class="lab">Traitements écartés</div><p>Elle suggère de ne pas employer la vitamine C intraveineuse, les immunoglobulines intraveineuses, les techniques de purification sanguine, dont l’hémoperfusion à la polymyxine B, ni la vitamine D pour traiter le sepsis.</p><div class="src"><b>Référence de la précision.</b> Surviving Sepsis Campaign 2026, énoncé « Insulin therapy », pour le seuil de début ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8486643/" target="_blank" rel="noopener">Surviving Sepsis Campaign 2021</a>, section « Glucose control », pour la cible après le début et le risque d’hypoglycémie. Sources relues le 8 octobre 2026.</div><div class="lab" data-reference-scope="a41-mesures">Texte de référence applicable</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, ESICM, <i>Intensive Care Medicine</i>, publiée le 23 mars 2026 : seuil de début de l’insuline, énoncé 92.</a></li></ul></template>
<template data-pop="a41-desescalade" data-title="Désescalade et durée : énoncés 2026 et essai BALANCE"><div class="lab">Principe</div><p>La désescalade consiste à arrêter les antibiotiques inutiles ou à réduire le spectre selon la microbiologie. Elle limite la toxicité, les colites à <i>Clostridioides difficile</i> et la sélection de résistances.</p><div class="lab">Recommandations 2026</div><p>La Surviving Sepsis Campaign 2026 recommande la désescalade lorsqu’un diagnostic microbiologique et un antibiogramme sont disponibles (recommandation forte, certitude très faible). Elle la suggère aussi lorsque les cultures définitives restent négatives. Elle demande d’arrêter les antibiotiques empiriques si une autre cause est démontrée ou fortement suspectée.</p><div class="lab">Durée</div><p>Après un contrôle adéquat du foyer, elle suggère une durée plus courte plutôt que plus longue (recommandation conditionnelle, certitude très faible). Lorsque la durée optimale est incertaine, elle suggère d’associer la procalcitonine à l’évaluation clinique pour décider de l’arrêt (recommandation conditionnelle, certitude faible).</p><div class="lab">Essai BALANCE</div><p>Chez 3 608 patients hospitalisés pour une bactériémie, dans 74 hôpitaux de 7 pays, 7 jours de traitement n’étaient pas inférieurs à 14 jours : la mortalité à 90 jours était de 14,5 % contre 16,1 %. L’origine était urinaire dans 42,2 % des cas. L’essai excluait l’immunodépression sévère, les foyers exigeant un traitement prolongé, les cultures isolées à germe possiblement contaminant et <i>Staphylococcus aureus</i>.</p><div class="lab">Piège</div><p>Une endocardite, une ostéomyélite ou un abcès non drainé exigent une durée plus longue. La procalcitonine aide à arrêter un antibiotique, et non à le débuter.</p><div class="lab" data-reference-scope="a41-desescalade">Texte de référence applicable</div><ul><li><a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, ESICM, <i>Intensive Care Medicine</i>, publiée le 23 mars 2026 : désescalade 36–37, durée 39 et procalcitonine 40.</a></li></ul></template>
<template data-pop="a41-sortie" data-title="Sortie et transition des soins : énoncés 2026"><div class="lab">Transitions</div><p>La Surviving Sepsis Campaign 2026 suggère un programme de transition lors du transfert des soins intensifs vers l’étage, et une transmission structurée des informations essentielles à chaque transition (recommandations conditionnelles, certitude très faible).</p><div class="lab">Médicaments</div><p>Elle demande une réconciliation médicamenteuse complète à chaque transition, y compris à la sortie des soins intensifs et de l’hôpital, et suggère qu’un pharmacien la conduise. Le médecin vérifie en particulier la reprise des traitements de fond suspendus et l’arrêt des médicaments de la phase aiguë.</p><div class="lab">Information</div><p>Elle demande d’informer le patient et sa famille, par écrit et oralement, du séjour, du sepsis, des traitements et des séquelles fréquentes. Elle suggère une éducation au sepsis avant la sortie et pendant le suivi. Elle demande d’associer le patient et sa famille à la préparation de la sortie.</p><div class="lab">Besoins sociaux</div><p>Elle demande de dépister les besoins économiques et sociaux, comme le logement, l’alimentation, le soutien financier et spirituel, puis d’orienter le patient vers les aides disponibles.</p><div class="lab">Suivi</div><p>Elle demande que le plan de sortie prévoie un suivi par des cliniciens capables de prendre en charge les séquelles nouvelles. Elle demande aussi de permettre au patient de rédiger des directives anticipées.</p></template>
<template data-pop="a41-vaccins" data-title="Vaccinations préventives : Plan de vaccination suisse 2026"><div class="lab">Grippe</div><p>Le Plan de vaccination suisse 2026 recommande une vaccination annuelle contre la grippe à toutes les personnes de 65 ans et plus, de préférence entre la mi-octobre et le début de la vague de grippe. Il privilégie le vaccin à dose élevée pour toutes les personnes de 75 ans et plus, ainsi que pour celles de 65 ans et plus qui présentent un facteur de risque supplémentaire.</p><div class="lab">Pneumocoque</div><p>Depuis 2024, le plan recommande une dose unique de vaccin conjugué contre les pneumocoques à toutes les personnes de 65 ans et plus. Dans l’essai CAPITA (2015), le vaccin conjugué <b>13-valent</b> a été étudié chez 84 496 adultes d’au moins 65 ans. L’analyse per protocole des premiers épisodes mesurait une efficacité de 75 % contre les infections invasives à sérotypes vaccinaux. Elle mesurait 45,6 % contre les pneumonies à ces mêmes sérotypes. L’essai ne démontrait pas d’effet sur les pneumonies communautaires toutes causes (5,1 % ; intervalle de confiance de −5,1 à 14,2 %). Ces résultats du PCV13 ne constituent pas une estimation directe de l’efficacité des autres valences.</p><div class="lab">Groupes à risque</div><p>Le plan définit en outre des groupes à risque, dont les personnes présentant une asplénie ou une dysfonction splénique et celles qui reçoivent un traitement immunosuppresseur. Ces personnes relèvent de schémas propres, décrits dans le plan.</p><div class="lab">Pourquoi</div><p>La grippe et le pneumocoque causent des pneumonies, et le poumon est le premier foyer du sepsis en soins intensifs. La vaccination vise donc aussi le sepsis d’origine respiratoire.</p><div class="lab">Exemple</div><p>Mme R., 71 ans et sous corticothérapie, relève du vaccin antigrippal à dose élevée et d’une dose de vaccin conjugué contre les pneumocoques, après sa guérison.</p><div class="src"><b>Référence de la précision.</b> Plan de vaccination suisse 2026 pour les indications ; <a href="https://pubmed.ncbi.nlm.nih.gov/25785969/" target="_blank" rel="noopener">Bonten et coll., CAPITA, 2015</a>, résumé relu le 8 octobre 2026 pour les résultats du seul PCV13.</div></template>
<template data-pop="a41-phoenix" data-title="Critères Phoenix du sepsis de l’enfant (2024)"><div class="lab">Définition</div><p>Les critères Phoenix, publiés en 2024 par un groupe international de 35 experts pédiatriques de six continents, dont le premier auteur exerce à l’Hôpital pédiatrique universitaire de Zurich (Schlapbach et coll., <i>JAMA</i> 2024), définissent le sepsis de l’enfant de moins de 18 ans. Le sepsis associe une infection suspectée et un score Phoenix d’au moins 2 points.</p><div class="lab">Contenu du score</div><p>Le score explore quatre fonctions : respiratoire, cardiovasculaire, coagulation et neurologique. Il a été dérivé de plus de 3 millions de dossiers électroniques provenant de dix sites de quatre continents, puis adopté par un consensus Delphi modifié.</p><div class="lab">Choc septique</div><p>Le choc septique de l’enfant associe un sepsis et au moins 1 point cardiovasculaire. Ce point traduit une hypotension sévère pour l’âge, un lactate supérieur à 5 mmol/L ou le besoin d’un médicament vasoactif.</p><div class="lab">Valeur</div><p>La mortalité hospitalière des enfants au score d’au moins 2 points atteignait 7,1 % dans les milieux à ressources élevées et 28,5 % dans les milieux à ressources limitées, plus de 8 fois celle des enfants infectés sans ces critères. Celle du choc septique atteignait 10,8 % et 33,5 %.</p><div class="lab">Piège</div><p>Les critères de l’adulte, dont le qSOFA et les seuils Sepsis-3, ne s’appliquent pas à l’enfant, dont les valeurs physiologiques varient avec l’âge. Les critères Phoenix succèdent aux critères pédiatriques de 2005, fondés sur la réponse inflammatoire.</p><div class="src">Sources : <a href="https://doi.org/10.1001/jama.2024.0179" target="_blank" rel="noopener">Schlapbach et coll., <i>JAMA</i> 2024, critères de consensus</a> ; <a href="https://doi.org/10.1001/jama.2024.0196" target="_blank" rel="noopener">Sanchez-Pinto et coll., <i>JAMA</i> 2024, dérivation et validation</a>. Résumés relus le 8 octobre 2026.</div></template>
<template data-pop="a41-grossesse" data-title="Sepsis maternel : définition et particularités"><div class="lab">Définition</div><p>Depuis 2017, l’Organisation mondiale de la santé définit le sepsis maternel comme une affection menaçant la vie, définie par une défaillance d’organe résultant d’une infection pendant la grossesse, l’accouchement, après un avortement ou dans le post-partum. Cette définition s’aligne sur Sepsis-3.</p><div class="lab">Particularités physiologiques</div><p>La grossesse augmente la fréquence cardiaque et le débit cardiaque, et abaisse la pression artérielle. Les seuils de l’adulte non enceinte se lisent donc avec prudence.</p><div class="lab">Foyers propres</div><p>Les foyers propres à la grossesse sont l’infection de l’utérus et du liquide amniotique, l’endométrite du post-partum, l’infection d’une plaie de césarienne et la pyélonéphrite, favorisée par la dilatation des voies urinaires.</p><div class="lab">Médicaments</div><p>Les informations professionnelles suisses restreignent plusieurs médicaments du choc : la noradrénaline ne s’emploie qu’en cas de nécessité absolue, et l’argipressine qu’en indication vitale. L’argipressine peut provoquer des contractions utérines et réduire la perfusion utérine.</p><div class="lab">Conséquence pratique</div><p>Le sepsis maternel impose une collaboration obstétricale urgente et l’évaluation du fœtus. Le traitement de la mère reste prioritaire, car il protège aussi l’enfant.</p></template>
