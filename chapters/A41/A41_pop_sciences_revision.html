<template data-pop="a41-science-reading" data-title="Lactate et pression : réévaluer la perfusion sans traiter un chiffre"><p>La pression décrit une dimension de la circulation. Le lactate résulte d’une production et d’une élimination. Leur normalisation ne garantit pas automatiquement la disparition de toutes les défaillances.</p><p>Le clinicien suit conscience, diurèse, peau, respiration et fonction cardiaque. Une perfusion qui reste insuffisante peut nécessiter une recherche de débit faible, de mauvaise distribution ou de persistance du foyer.</p><p>Un apport de liquide est réévalué selon sa réponse et sa tolérance. Une concentration de lactate encore élevée ne prescrit pas automatiquement un nouveau bolus, surtout si le poumon ou les tissus deviennent œdémateux.</p><p>La trajectoire clinique combine les mesures répétées avec le contrôle de la source. Les décisions s’adaptent à cette synthèse et à l’incertitude restante.</p><div class="key"><b>À retenir.</b> Le résultat répond à une question précise. Son interprétation exige les autres informations du patient.</div></template>
