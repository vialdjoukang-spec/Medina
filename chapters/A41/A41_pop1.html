<template data-pop="a41-perfusion" data-title="Perfusion tissulaire"><p>La perfusion assure l’apport d’oxygène et de nutriments aux tissus. Elle dépend du débit sanguin, de son homogénéité microvasculaire et de la capacité des cellules à extraire l’oxygène. La pression artérielle est un indicateur utile, sans refléter à elle seule la perfusion des organes.</p><p>Exemple : une pression moyenne revenue à 65 mmHg avec confusion persistante et oligurie appelle une nouvelle évaluation du débit, de la volémie, de l’oxygénation et des diagnostics concurrents.</p></template>
<template data-pop="a41-lactate" data-title="Lactate : production, clairance, limites"><p>Le lactate est produit lors de la glycolyse et éliminé en partie par le foie. Une concentration élevée peut témoigner d’une hypoperfusion, mais aussi d’une stimulation adrénergique ou d’une diminution de clairance ; aucune valeur seule ne diagnostique le sepsis.</p><p>Dans les critères de choc Sepsis-3, lactate &gt; 2 mmol/L doit être associé à un besoin de vasopresseur pour maintenir la pression moyenne ≥ 65 mmHg malgré remplissage adéquat. Dans le suivi, mesurer la tendance ; éviter une poursuite automatique des fluides jusqu’à normalisation.</p></template>
<template data-pop="a41-sofa" data-title="Score SOFA : six fonctions"><p>SOFA quantifie respiration (oxygénation), coagulation (plaquettes), foie (bilirubine), circulation (pression et vasopresseurs), système nerveux central (état de conscience) et rein (créatinine ou diurèse). Une augmentation aiguë d’au moins deux points attribuable à une infection représente opérationnellement la défaillance de Sepsis-3 ; le score de base est présumé nul en l’absence de dysfonction d’organe préexistante connue.</p><p>Comparer aux paramètres antérieurs, notamment chez une personne atteinte d’insuffisance rénale chronique. Une absence de tous les résultats requis ne justifie pas d’attendre avant de traiter une hypoperfusion menaçante.</p></template>
<template data-pop="a41-sepsis3" data-title="Sepsis-3 : définition consensuelle"><p>Le consensus international publié en 2016 par Singer et ses collaborateurs définit le sepsis par une défaillance d’organe menaçant la vie liée à une réponse dérégulée de l’hôte à une infection. Une augmentation aiguë du score SOFA ≥ 2 en est le critère opérationnel clinique.</p><p>Le choc septique exige en plus vasopresseur pour maintenir une pression moyenne ≥ 65 mmHg et lactate &gt; 2 mmol/L malgré remplissage adéquat, sans hypovolémie. La nouvelle défaillance est la distinction décisive avec une infection non compliquée.</p></template>
<template data-pop="a41-ssc" data-title="Surviving Sepsis Campaign 2026"><p>Recommandations internationales pour l’adulte publiées le 23 mars 2026 par la Surviving Sepsis Campaign, initiative conjointe de la Society of Critical Care Medicine et de la Société européenne de médecine intensive, dans <i>Critical Care Medicine</i> et <i>Intensive Care Medicine</i> : 129 énoncés, dont 46 nouveaux par rapport à l’édition de 2021. Elles couvrent reconnaissance, prélèvements, antibiothérapie selon probabilité, réanimation, contrôle du foyer, soutien d’organe et soins après sortie.</p><p>Elles suggèrent au moins 30 mL/kg de cristalloïde au cours des trois premières heures en cas d’hypoperfusion ou choc, avec réévaluation, plutôt qu’une perfusion irréfléchie ; elles recommandent noradrénaline en première intention et demandent d’anticiper les causes non infectieuses.</p></template>
<template data-pop="a41-swiss-report" data-title="Swiss Sepsis Report 2025"><p>Analyse nationale suisse des données de sorties hospitalières de 2019 à 2023 : environ 20 000 hospitalisations explicitement codées sepsis par année, dont 500 à 600 enfants ; environ 4 000 décès en milieu hospitalier dans ces séjours chaque année.</p><p>Une analyse « infection plus atteinte d’organe » estime potentiellement davantage de cas : le chiffre varie fortement selon codage et définition. Ces nombres sont des statistiques de séjours ; ils ne prouvent pas la part de décès directement causés par le sepsis chez chaque patient.</p></template>
<template data-pop="a41-endo" data-title="Endothélium et vasoplégie"><p>La réponse inflammatoire perturbe l’endothélium vasculaire, son glycocalyx et les interactions plaquettes–leucocytes. Vasodilatation, fuite capillaire et dérèglement microcirculatoire coexistent. La baisse de la résistance vasculaire et le déplacement du liquide hors des vaisseaux contribuent à l’hypotension.</p><p>La mesure clinique associe pression, temps de recoloration, état de conscience, diurèse et tolérance des fluides.</p></template>
<template data-pop="a41-atcd-immune" data-title="Interroger l’immunosuppression"><p>Rechercher médicament précis, dose et dernière administration : corticostéroïdes prolongés, cytotoxiques, traitements biologiques, transplantation, neutropénie connue ; préciser aussi infection par virus immunodéficitaire humain et asplénie si pertinentes. Cela modifie les agents possibles, la présentation fébrile et l’urgence des prélèvements.</p><p>Une prophylaxie anti-infectieuse antérieure et les vaccinations donnent un contexte, sans exclure une infection invasive.</p></template>
<template data-pop="a41-atcd-device" data-title="Dispositifs et interventions"><p>Demander date et type d’intervention, cathéter vasculaire ou urinaire, prothèse, drain, chirurgie ou injection récente ; inspecter le point d’entrée et demander les cultures anciennes. Retirer un dispositif ne se décide pas seulement sur la fièvre : peser sa probabilité comme source et la sécurité du geste.</p></template>
<template data-pop="a41-atcd-organ" data-title="Comparer la fonction antérieure"><p>Comparer créatinine, besoins en oxygène, cognition habituelle, pression et bilirubine aux valeurs antérieures. Un patient présentant une maladie rénale chronique peut avoir un score SOFA rénal initial élevé : seule l’augmentation aiguë attribuable à l’infection compte pour la définition opérationnelle.</p></template>
<template data-pop="a41-sympt-conf" data-title="Confusion : établir la nouveauté"><p>Préciser avec un proche le dernier état normal, le début et la fluctuation. Évaluer orientation, attention, glycémie, médicaments sédatifs, oxygénation et perfusion. Une confusion isolée ne désigne pas son étiologie ; une confusion nouvelle en contexte infectieux est une alerte de défaillance à explorer.</p></template>
<template data-pop="a41-sympt-dysp" data-title="Dyspnée : physiologie et gravité"><p>Décrire début, progression, douleur thoracique, expectoration, besoin actuel en oxygène et antécédents respiratoires. Compter la fréquence respiratoire au repos, observer tirage et saturation ; une hyperventilation peut accompagner acidose, hypoxémie ou douleur. La saturation sous oxygène ne renseigne pas sur la valeur sans soutien.</p></template>
<template data-pop="a41-sign-perfusion" data-title="Perfusion cutanée et marbrures"><p>Comprimer l’extrémité d’un doigt quelques secondes puis mesurer le temps de recoloration après relâchement, en tenant compte de température ambiante et du site choisi. Observer l’extension des marbrures aux genoux, la température des extrémités et leur évolution sous traitement. Une mesure isolée dépend du contexte ; la tendance et les autres organes importent.</p></template>
<template data-pop="a41-sign-rr" data-title="Fréquence respiratoire : mesurer"><p>Compter les mouvements respiratoires pendant une minute lorsque le patient est au repos. Une fréquence ≥ 22/min appartient aux critères du score qSOFA, mais n’identifie pas seule un sepsis ; hypoxémie, acidose et douleur peuvent aussi accélérer la respiration.</p></template>
<template data-pop="a41-sign-focal" data-title="Examen du foyer"><p>Examiner thorax et effort respiratoire, abdomen avec signes péritonéaux, régions lombaires, peau entière y compris sous les dispositifs, sites chirurgicaux et, selon la présentation, méninges et articulations. Un obstacle, une collection ou une infection nécrosante change le besoin de geste rapide.</p></template>
<template data-pop="a41-qsofa" data-title="qSOFA : usage et limite"><p>Score clinique rapide : fréquence respiratoire ≥ 22/min, pression systolique ≤ 100 mmHg, modification de l’état mental. Deux ou trois éléments identifient un risque accru chez une personne infectée, mais un résultat négatif ne permet pas d’exclure une défaillance d’organe.</p><p>La Surviving Sepsis Campaign 2026 recommande (recommandation forte, certitude modérée) d’utiliser à l’hôpital un score d’alerte précoce à plusieurs constantes (National Early Warning Score, première ou deuxième version, ou Modified Early Warning Score) ou les critères de réponse inflammatoire systémique plutôt que le score qSOFA comme outil unique de dépistage du sepsis.</p></template>
<template data-pop="a41-cultures" data-title="Hémocultures sans retard dangereux"><p>Prélever rapidement les hémocultures, idéalement avant les antibiotiques. Assurer antisepsie, identification des sites et horaire. Chez une personne instable, l’organisation des cultures ne doit pas repousser la première dose indispensable ; interpréter ensuite la concordance avec le foyer et la possibilité d’une contamination.</p></template>
<template data-pop="a41-source" data-title="Contrôle anatomique du foyer"><p>Drainage d’un abcès ou de voies urinaires obstruées, retrait d’un cathéter infecté ou chirurgie d’une infection nécrosante constituent des exemples distincts. La Surviving Sepsis Campaign 2026 suggère un contrôle précoce, idéalement dans les six heures suivant le diagnostic du sepsis ou du choc septique qui exige ce geste ; concilier avec stabilisation et sécurité technique.</p></template>
<template data-pop="a41-pkpd" data-title="Pharmacodynamie des bêta-lactamines"><p>Les bêta-lactamines inhibent des protéines liant la pénicilline, nécessaires à la synthèse de la paroi bactérienne. Leur effet dépend du temps pendant lequel la concentration libre reste au-dessus de la concentration minimale inhibitrice ; après une dose de charge initiale, la Surviving Sepsis Campaign 2026 recommande (recommandation forte, certitude modérée) une perfusion d’entretien prolongée plutôt qu’un bolus.</p><p>Adaptation rénale, sensibilité de l’agent et protocole de préparation de la pharmacie restent déterminants ; l’information professionnelle suisse de la pipéracilline/tazobactam prévoit une perfusion de 30 minutes, dont la perfusion prolongée s’écarte.</p></template>
