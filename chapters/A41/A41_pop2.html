<template data-pop="a41-norad" data-title="Noradrénaline : monographie"><p><b>Mécanisme.</b> Agonisme surtout alpha-adrénergique, vasoconstriction artériolaire et restauration de la pression de perfusion ; effet cardiaque selon la dose et le terrain. Premier vasopresseur recommandé dans le choc septique par la Surviving Sepsis Campaign 2026.</p><p><b>Posologie source suisse.</b> L’information professionnelle de Noradrenalin Sintetica, commune aux quatre concentrations, mentionne 8–12 µg/min au début pour un adulte de 70 kg puis titration en paliers de 0,05–0,1 µg/kg/min vers l’effet clinique (soit 3,5–7 µg/min pour 70 kg). La dose d’entretien moyenne est de 2–4 µg/min ; elle peut atteindre 30 µg/min en cas de choc réfractaire. Noradrenalin Sintetica est une solution prête à l’emploi, à ne pas diluer, disponible en plusieurs concentrations (0,06 ; 0,10 ; 0,12 et 0,20 mg/mL) : les doses en µg/min et en µg/kg/min ne dépendent pas de la concentration ; seul le débit en mL/h se calcule d’après la concentration inscrite sur la présentation utilisée. En cas de dysfonction ventriculaire gauche majeure avec hypotension aiguë, l’information professionnelle réserve la noradrénaline au choc cardiogénique avec hypotension réfractaire, en particulier sans élévation des résistances vasculaires systémiques, prévoit un début à 2–4 µg/min augmenté progressivement et juge peu probable le bénéfice d’une augmentation au-delà de 15 µg/min si la perfusion systémique ou une pression systolique supérieure à 90 mmHg ne sont pas obtenues. L’information suisse ne fixe pas d’autre plafond ; l’hypotension par hypovolémie est une contre-indication et la noradrénaline ne doit jamais être le seul traitement d’un patient hypovolémique. Aucune donnée ne guide une adaptation rénale ou hépatique ; pendant la grossesse, seulement en cas de nécessité absolue.</p><p><b>Effets et surveillance.</b> Tachyarythmie, hypertension, ischémie digitale ou viscérale, extravasation ; surveiller pression, perfusion des extrémités, rythme et site de perfusion. Une voie périphérique peut être utilisée temporairement sous surveillance pour ne pas différer le traitement, selon la Surviving Sepsis Campaign 2026.</p><p><b>Essais.</b> SEPSISPAM (2014 ; 776 patients en choc septique) : viser une pression artérielle moyenne de 80–85 mmHg plutôt que 65–70 mmHg n’a pas réduit la mortalité à 28 jours (36,6 % contre 34,0 %) et a augmenté la fibrillation atriale de novo (6,7 % contre 2,8 % ; chiffres absents du résumé, rapportés par Gupta et coll., <i>Critical Care</i> 2015) ; chez les patients hypertendus chroniques, la cible haute a réduit le recours à l’épuration extrarénale (résumé de l’essai) et le doublement de la créatinine (donnée absente du résumé, rapportée par Bellomo, Asfar et coll., <i>Annals of Intensive Care</i> 2017). Essai 65 (<i>JAMA</i> 2020 ; 2 600 patients d’au moins 65 ans en hypotension vasoplégique, 2 463 analysés) : une cible de 60–65 mmHg a réduit l’exposition aux vasopresseurs sans différence significative de mortalité à 90 jours (41,0 % contre 43,8 % sous soins usuels) ; la justification de la Surviving Sepsis Campaign 2026 s’appuie sur cet essai et sur une méta-analyse sur données individuelles pour suggérer une cible initiale de 60–65 mmHg dès 65 ans (certitude faible).</p></template>
<template data-pop="a41-vaso" data-title="Argipressine : monographie"><p><b>Mécanisme.</b> Agit notamment sur le récepteur V1a de la vasopressine, situé sur le muscle lisse vasculaire, et augmente le tonus indépendamment des récepteurs adrénergiques. La Surviving Sepsis Campaign 2026 suggère son ajout si la noradrénaline doit être augmentée (certitude modérée). La Surviving Sepsis Campaign 2021 suggérait déjà d’ajouter la vasopressine plutôt que d’augmenter la noradrénaline lorsque la pression artérielle moyenne reste insuffisante, et précisait qu’en pratique cet ajout intervient habituellement à une noradrénaline de 0,25–0,5 µg/kg/min (17,5–35 µg/min pour 70 kg). Le texte de 2026 ne fixe pas de seuil : 85,1 % des membres du panel ajoutent la vasopressine lorsque la noradrénaline augmente, à une dose médiane de noradrénaline de 0,3 µg/kg/min (intervalle interquartile 0,2–0,5).</p><p><b>Information suisse Empressin.</b> Uniquement en complément des catécholamines : début à 0,01 unité internationale/min, augmentation selon la réponse toutes les 15–20 minutes jusqu’à 0,03 unité internationale/min ; au-delà seulement en traitement d’urgence, en raison du risque de nécroses intestinales et cutanées ; jamais en bolus. Perfusion continue après dilution de 40 unités internationales dans du chlorure de sodium à 0,9 % jusqu’à 50 mL (0,8 unité internationale/mL). Surveiller natrémie (hyponatrémie), ischémie des extrémités et atteinte viscérale ; ne pas la substituer à la noradrénaline de première intention. Grossesse : contractions utérines, élévation de la pression intra-utérine et baisse de la perfusion utérine possibles ; indication vitale seulement. Aucune recommandation posologique en insuffisance rénale ou hépatique.</p><p><b>Essai.</b> VASST (2008 ; 778 patients en choc septique recevant au moins 5 µg/min de noradrénaline) : l’argipressine 0,01–0,03 unité internationale/min, comparée à un supplément de noradrénaline, tous deux ajoutés aux vasopresseurs en cours, n’a pas réduit la mortalité à 28 jours (35,4 % contre 39,3 % ; différence non significative). Dans la strate prédéfinie de choc moins sévère, la mortalité à 28 jours était plus basse sous argipressine (26,5 % contre 35,7 %), sans hétérogénéité significative entre les strates : ce signal ne suffit pas à conclure. Les ischémies digitales sont restées rares (2,0 % contre 0,5 %, différence non significative ; chiffres absents du résumé, rapportés par l’investigateur principal, Russell, <i>Critical Care</i> 2011).</p></template>
<template data-pop="a41-hydro" data-title="Hydrocortisone : rôle et limites"><p>Les glucocorticoïdes modulent l’inflammation et améliorent la réactivité vasculaire. La Surviving Sepsis Campaign 2026 <b>suggère</b> des corticostéroïdes par voie intraveineuse chez l’adulte avec choc septique, recommandation conditionnelle à faible certitude ; elle ne généralise pas cette indication au sepsis sans choc.</p><p>La Surviving Sepsis Campaign 2021 précisait un schéma usuel d’hydrocortisone à 200 mg/jour par voie intraveineuse (50 mg toutes les six heures ou perfusion continue). Elle suggérait de la débuter lorsque la noradrénaline ou l’adrénaline atteint au moins 0,25 µg/kg/min, au moins 4 heures après le début du vasopresseur. Le texte de 2026 ne reprend ni ce seuil ni ce délai : selon la méta-analyse qu’il cite, aucun bénéfice supplémentaire n’apparaît au-delà de 260 mg/jour d’hydrocortisone ou d’équivalent ; parmi les membres du panel qui emploient des corticostéroïdes, 90 % prescrivent 200 mg d’équivalent hydrocortisone par 24 heures, 86 % en administrations intermittentes plutôt qu’en perfusion continue ; le moment du début varie, selon la dose de noradrénaline (34 % à moins de 0,2 µg/kg/min, 38 % entre 0,2 et 0,3 µg/kg/min, 28 % au-delà) comme selon le délai (32 % dans les 2 heures suivant le début du vasopresseur, 34 % entre 2 et 4 heures, 33 % au-delà), et 63 % n’associent jamais de fludrocortisone. Les deux plus grands essais, ADRENAL et APROCCHSS, ont étudié une durée de 7 jours (au plus, dans ADRENAL). Le guide rapide officiel de 2026 mentionne l’hydrocortisone, avec ou sans fludrocortisone, lorsque le besoin en noradrénaline persiste. Surveiller glycémie et surinfection. Forme suisse : Solu-Cortef, succinate sodique d’hydrocortisone, 100 mg ou 250 mg de substance sèche avec 2 mL de solvant, pour la voie intraveineuse ; son information professionnelle juge controversé l’intérêt des corticostéroïdes dans le choc septique et n’en recommande pas l’emploi de routine. Pas d’adaptation rénale ; en insuffisance hépatique sévère, l’effet peut être accru.</p><p><b>Essais.</b> ADRENAL (2018 ; 3 800 patients ventilés en choc septique randomisés, 3 658 analysés) : hydrocortisone 200 mg/jour en perfusion continue pendant 7 jours au plus, sans réduction de la mortalité à 90 jours (27,9 % contre 28,8 % sous placebo), mais avec résolution plus rapide du choc (médiane 3 contre 4 jours) et premier épisode de ventilation plus court (médiane 6 contre 7 jours), sans différence du nombre de jours vivants sans ventilation. APROCCHSS (2018 ; 1 241 patients) : hydrocortisone 50 mg en bolus intraveineux toutes les 6 heures et fludrocortisone 50 µg par sonde nasogastrique une fois par jour pendant 7 jours, avec une mortalité à 90 jours réduite (43,0 % contre 49,1 % sous placebo ; risque relatif 0,88). Selon la justification de la Surviving Sepsis Campaign 2021, qui en tirait une recommandation conditionnelle, les corticostéroïdes accélèrent la résolution du choc et augmentent les jours sans vasopresseur, sans effet net sur la mortalité, au prix d’une faiblesse neuromusculaire plus fréquente (risque relatif 1,21) ; les essais diffèrent en outre par leurs critères d’inclusion, leur durée et l’ajout de fludrocortisone. La justification de 2026, fondée sur une méta-analyse de 45 essais (9 543 patients), retient une possible faible réduction de la mortalité à 28 jours (risque relatif 0,92 ; intervalle de confiance à 95 % 0,83–1,01 ; certitude faible), une résolution du choc à 7 jours plus fréquente (risque relatif 1,29 ; certitude élevée), davantage d’hyperglycémies (risque relatif 1,19) et d’hypernatrémies (risque relatif 1,64), et un effet incertain sur la faiblesse neuromusculaire (risque relatif 1,13 ; certitude très faible) ; les sous-groupes vont dans le même sens, sauf le sepsis sans choc.</p></template>
<template data-pop="a41-piptazo" data-title="Pipéracilline et tazobactam : monographie"><p><b>Mécanisme.</b> Pipéracilline inhibe la synthèse de paroi bactérienne ; tazobactam bloque certaines bêta-lactamases. Le spectre couvre de nombreux agents à Gram négatif et anaérobies, sans couvrir tous les mécanismes de résistance ; la microbiologie et le foyer décident.</p><p><b>Posologie selon l’information professionnelle suisse.</b> Forme Labatec 4 g/0,5 g en perfusion intraveineuse lente de 30 minutes ; chez l’adulte, 2–4 g de pipéracilline 3 à 4 fois par jour selon indication (habituellement 100–200 mg de pipéracilline/kg par jour), par exemple flacon de 4 g/0,5 g toutes les huit heures. Insuffisance rénale : aucun ajustement au-dessus de 40 mL/min de débit de filtration glomérulaire ; 4 g/0,5 g toutes les 8 heures de 20 à 40 mL/min ; toutes les 12 heures de 2 à 19 mL/min et en hémodialyse, où la dose quotidienne ne dépasse pas 8 g de pipéracilline et 1 g de tazobactam, avec 2 g/0,25 g après chaque séance. Aucun ajustement en insuffisance hépatique. Grossesse : seulement en cas de nécessité absolue ; ne pas allaiter. Dose de charge et modalités de perfusion prolongée, qui s’écartent de la perfusion de 30 minutes de l’information suisse, se décident avec pharmacie et infectiologie selon la sensibilité locale ; absence de durée universelle pour « le sepsis ».</p><p><b>Risque.</b> Hypersensibilité immédiate possible, diarrhée (colite pseudomembraneuse à évoquer) et dysfonction rénale ; l’association avec la vancomycine accroît l’incidence de l’insuffisance rénale aiguë ; de rares lymphohistiocytoses hémophagocytaires ont été décrites après plus de 10 jours de traitement. Documenter les traitements concomitants néphrotoxiques et désescalader après résultat. Une couverture empirique inappropriée d’une méningite par cette seule molécule serait une erreur.</p><p><b>Essais.</b> MERINO (2018 ; près de 380 patients en bactériémie à <i>Escherichia coli</i> ou <i>Klebsiella pneumoniae</i> résistants à la ceftriaxone ; pipéracilline/tazobactam 4 g/0,5 g toutes les 6 heures contre méropénem 1 g toutes les 8 heures) : la pipéracilline/tazobactam n’a pas démontré sa non-infériorité face au méropénem, avec une mortalité à 30 jours de 12,3 % contre 3,7 % ; elle ne convient pas au traitement définitif de ces bactériémies. BLING III (2024 ; 7 031 patients de soins intensifs en sepsis traités par pipéracilline/tazobactam ou méropénem) : la perfusion continue n’a pas réduit significativement la mortalité à 90 jours par rapport à la perfusion intermittente (24,9 % contre 26,8 %), mais a augmenté la guérison clinique (55,7 % contre 50,0 %) ; la Surviving Sepsis Campaign 2026 l’intègre à la méta-analyse de 18 essais (9 108 participants) sur laquelle repose sa recommandation forte de perfusion prolongée (certitude modérée selon l’énoncé).</p></template>
<template data-pop="pareto-a41-def" data-title="Pareto — Définitions, codage et épidémiologie"><p class="ratio" data-cover="a41-0,a41-1,a41-2"></p><ul><li>Le sepsis est une défaillance d’organe menaçant la vie, causée par une réponse dérégulée de l’hôte à une infection (Sepsis-3, 2016).</li><li>Son critère opérationnel est une hausse aiguë du score SOFA d’au moins 2 points attribuable à l’infection ; le score de base est présumé nul sans défaillance connue, et ce seuil correspond à une mortalité hospitalière d’environ 10 %.</li><li>Le score SOFA cote de 0 à 4 points six fonctions : respiration, coagulation, foie, circulation, système nerveux central et rein. La définition repose sur le score d’origine, bien qu’un SOFA-2 ait été publié en 2025.</li><li>Le choc septique exige un vasopresseur pour maintenir la pression artérielle moyenne à 65 mmHg ou plus et un lactate supérieur à 2 mmol/L, malgré un remplissage adéquat ; sa mortalité hospitalière dépasse 40 %.</li><li>Les deux critères du choc sont exigés ensemble, car leur association s’accompagnait d’une mortalité ajustée de 42,3 %, contre 25,7 % pour l’hyperlactatémie seule et 30,1 % pour l’hypotension sous vasopresseur sans hyperlactatémie.</li><li>Le choc septique est une catégorie de classement : une hypotension infectieuse se traite sans attendre le lactate.</li><li>Les critères de réponse inflammatoire ne définissent plus le sepsis, car ils manquent de spécificité et de sensibilité ; le terme « sepsis sévère » est redondant.</li><li>Une bactériémie n’est pas un sepsis ; une culture n’est positive que dans 30 à 40 % des sepsis, et des hémocultures négatives n’excluent pas le diagnostic.</li><li>Le qSOFA n’est pas un critère diagnostique, et la Surviving Sepsis Campaign 2026 recommande de ne pas l’employer comme unique outil de dépistage à l’hôpital.</li><li>La recommandation de référence est la Surviving Sepsis Campaign 2026, qui compte 129 énoncés, dont 46 nouveaux, chacun avec une force et un degré de certitude.</li><li>La catégorie A41 de la CIM-10-GM 2024 couvre les autres sepsis et les sepsis d’agent non précisé ; A40 correspond aux sepsis à streptocoques, R57.2 au choc septique en code complémentaire, et le choc toxique relève de la catégorie A48.</li><li>En 2017, le sepsis a représenté 48,9 millions de cas et 11,0 millions de décès dans le monde, soit 19,7 % de tous les décès.</li><li>En Suisse, environ 20 000 séjours sont codés sepsis chaque année, dont 500 à 600 séjours d’enfants, avec près de 4 000 décès intrahospitaliers ; en 2023, 70,2 % des séjours concernaient des personnes de 65 ans et plus, et 40,7 % passaient par les soins intensifs.</li><li>La mortalité intrahospitalière suisse atteignait 18,9 % en 2023, 32,6 % en cas de choc et 22,3 % après 65 ans. Il s’agit d’une mortalité toutes causes, mesurée sur des séjours, et le repérage par infection et défaillance trouve jusqu’à quatre fois plus de séjours que le codage explicite.</li><li>Près de 30 % des patients suisses de 65 ans et plus sont décédés dans l’année qui suit l’admission, et environ 40 % des survivants sont réhospitalisés dans les 90 jours : le suivi fait partie du traitement.</li></ul></template>
<template data-pop="pareto-a41-physio" data-title="Pareto — Physiopathologie, foyers et terrain"><p class="ratio" data-cover="a41-3,a41-4"></p><ul><li>La réponse normale reconnaît le microbe par des récepteurs comme les TLR, produit localement des cytokines comme le TNF-α, l’IL-1 et l’IL-6, contient l’infection au foyer, puis s’arrête grâce à des médiateurs comme l’IL-10.</li><li>Dans le sepsis, la réponse devient systémique et s’accompagne d’une immunodépression, qui expose aux infections secondaires.</li><li>L’hypotension naît de la vasoplégie, due à l’excès de monoxyde d’azote produit par la NO synthase inductible, à la moindre réponse aux catécholamines et à une sécrétion de vasopressine insuffisante.</li><li>La fuite capillaire, par dégradation du glycocalyx, et la dilatation veineuse créent une hypovolémie absolue et relative : le remplissage aide au début, puis son excès aggrave les œdèmes.</li><li>Une cardiomyopathie septique réversible peut réduire la contractilité ; le profil habituel associe un débit normal ou élevé et des résistances basses.</li><li>Le débit capillaire devient hétérogène, des microthrombi obstruent les capillaires et les mitochondries utilisent mal l’oxygène : un organe peut souffrir malgré une pression corrigée.</li><li>Le lactate s’élève par défaut d’apport d’oxygène, par respiration mitochondriale altérée, par glycolyse aérobie accélérée et par élimination hépatique réduite ; c’est un marqueur de gravité, et non un test diagnostique.</li><li>L’inflammation active la coagulation par le facteur tissulaire, consomme l’antithrombine, la protéine C et les plaquettes, et inhibe la fibrinolyse ; la forme extrême est la coagulation intravasculaire disséminée.</li><li>Chaque organe a son signe et sa variable du score SOFA : la confusion et le score de Glasgow, l’hypoxémie et le rapport PaO₂/FiO₂, l’hypotension et la dose de vasopresseur, l’oligurie et la créatinine, l’ictère tardif et la bilirubine, la thrombopénie et les plaquettes.</li><li>Le remplissage, la noradrénaline et le contrôle du foyer corrigent chacun une étape distincte, et aucun ne remplace les autres.</li><li>Le foyer est pulmonaire dans 68 % des sepsis de soins intensifs de l’étude SOAP et urinaire dans 42,2 % des bactériémies de l’essai BALANCE ; un premier foyer n’en exclut pas un second.</li><li>Les bactéries causent la majorité des sepsis ; chaque foyer oriente vers ses agents habituels, et les entérobactéries, <i>Escherichia coli</i> au premier rang, dominent le foyer urinaire.</li><li>L’âge, les comorbidités, la corticothérapie, la neutropénie, l’asplénie, le diabète, la cirrhose et les dispositifs augmentent le risque ou la gravité ; 70,2 % des séjours suisses concernent des personnes de 65 ans et plus.</li><li>Une corticothérapie au long cours atténue la fièvre et impose une dose de stress d’hydrocortisone.</li><li>La Surviving Sepsis Campaign 2026 suggère de couvrir un germe multirésistant seulement en cas de risque élevé, les anaérobies seulement en présence de facteurs de risque, et de ne pas prescrire d’antifongique empirique en routine.</li><li>Un foyer clos ou nécrosé impose un geste de contrôle, idéalement dans les six heures suivant le diagnostic du sepsis ou du choc septique qui l’impose.</li></ul></template>
<template data-pop="pareto-a41-diag" data-title="Pareto — Reconnaissance et diagnostic"><p class="ratio" data-cover="a41-5,a41-6,a41-7,a41-8"></p><ul><li>L’anamnèse établit l’infection et son foyer, date une défaillance nouvelle, repère ce qui modifie l’antibiotique et recueille les volontés du patient, en même temps que les premiers soins.</li><li>Les antécédents utiles sont l’immunosuppression, la corticothérapie au long cours, les dispositifs, l’asplénie, les infections et antibiotiques antérieurs, les fonctions d’organe de base et les allergies caractérisées ; les objectifs de soins se discutent tôt, idéalement dans les 72 heures.</li><li>Seule la comparaison avec l’état antérieur permet de dire qu’une confusion, une oligurie ou une créatinine élevée traduit une défaillance nouvelle.</li><li>Des frissons avec tremblement de tout le corps s’associent à un risque relatif de bactériémie de 12,1 ; la fièvre peut manquer chez le sujet âgé ou sous corticoïdes, et toute défaillance inexpliquée doit faire évoquer une infection.</li><li>Les formes atypiques comprennent la chute du sujet âgé, la neutropénie sans signe local, l’infection fulminante du splénectomisé, l’infection nécrosante à douleur disproportionnée et le choc toxique.</li><li>L’examen mesure la gravité avant de chercher le foyer : conscience par le score de Glasgow, fréquence respiratoire comptée sur une minute, pression artérielle moyenne, fréquence cardiaque, SpO₂, température et diurèse.</li><li>Dans le National Early Warning Score 2, une fréquence respiratoire de 12 à 20 par minute, une SpO₂ de 96 % ou plus, une pression systolique de 111 à 219 mmHg, un pouls de 51 à 90 par minute et une température de 36,1 à 38,0 °C valent 0 point ; un total de 7 ou plus impose une réponse d’urgence.</li><li>Le remplissage se calcule sur le poids réel, ou sur le poids ajusté ou idéal si l’indice de masse corporelle dépasse 30 kg/m².</li><li>Un temps de recoloration capillaire supérieur à 3 secondes, mesuré après 10 secondes de pression sur l’index, est anormal ; le score de marbrures va de 0 à 5, et un score élevé six heures après la réanimation s’associe à un risque de décès accru.</li><li>Une diurèse inférieure à 0,5 mL/kg/h pendant 6 heures définit une atteinte rénale aiguë selon KDIGO.</li><li>Le choc instable se reconnaît à l’examen, par une pression très basse, des marbrures, un teint cendré, une cyanose, une tachycardie et une confusion ; il autorise le vasopresseur en même temps que le remplissage.</li><li>Le diagnostic suit trois questions : infection probable, défaillance nouvelle avec une hausse du score SOFA d’au moins 2 points, choc défini par le vasopresseur et le lactate.</li><li>Le dépistage hospitalier repose sur un score d’alerte à plusieurs constantes ou sur les critères de réponse inflammatoire (recommandation forte) ; le qSOFA, construit pour prédire et non pour dépister, manque de sensibilité.</li><li>Le sepsis est un diagnostic clinique : les hémocultures, idéalement avant l’antibiotique (recommandation forte), le lactate et le bilan d’organe se demandent d’emblée, sans retarder le traitement, et la procalcitonine ne décide pas du début des antibiotiques.</li><li>Le différentiel se classe par gravité : chocs hémorragique, cardiogénique et obstructif, anaphylaxie et crise surrénalienne d’abord, puis inflammations non infectieuses, intoxications et décompensations chroniques ; un choc mixte reste possible.</li><li>Le sepsis et le choc septique sont des urgences : la réanimation commence immédiatement, et l’admission en soins intensifs, lorsqu’elle est nécessaire, est suggérée dans les 6 heures.</li><li>Une hypotension persistante, un choc instable, une défaillance respiratoire, un lactate élevé, un purpura extensif, une infection nécrosante ou un foyer obstrué imposent une action immédiate ; un lactate supérieur à 4 mmol/L sans hypotension s’accompagnait déjà d’une mortalité ajustée de 29,9 %.</li><li>Le choc réfractaire associe une hypoperfusion persistante, l’absence de réponse au remplissage et plus de 0,5 µg/kg/min d’équivalent noradrénaline (consensus de 2026).</li><li>Les défaillances à surveiller sont le syndrome de détresse respiratoire aiguë, l’atteinte rénale aiguë selon KDIGO, l’encéphalopathie, la coagulation intravasculaire disséminée, la cardiomyopathie septique et la cholestase.</li><li>Un bilan hydrique positif est associé au décès, et les solutés ne se poursuivent pas jusqu’à la normalisation du lactate.</li></ul></template>
<template data-pop="pareto-a41-trait" data-title="Pareto — Traitement et suivi"><p class="ratio" data-cover="a41-9,a41-10,a41-11,a41-12"></p><ul><li>Les cinq objectifs du traitement sont l’antibiotique précoce, le contrôle du foyer, la perfusion restaurée, le soutien des organes et la prévention des dommages du traitement.</li><li>Les hémocultures se prélèvent dès que possible, puis l’antibiotique s’administre immédiatement : dans l’heure en cas de choc possible, probable ou certain, ou de sepsis probable ou certain (recommandations fortes).</li><li>Si le sepsis est seulement possible sans choc, une investigation rapide précède l’antibiotique, donné dans les trois heures si la suspicion persiste ; si l’infection est peu probable sans choc, l’antibiotique peut être différé sous surveillance étroite.</li><li>Chaque heure de retard de l’antibiotique s’associait à un risque de décès accru, avec un rapport de cotes de 1,04 par heure.</li><li>Le spectre suit le foyer, le lieu d’acquisition, le risque de résistance, la fonction d’organe, les allergies et l’écologie locale ; après une dose de charge non réduite, la bêta-lactamine s’administre en perfusion prolongée (recommandation forte).</li><li>Le remplissage emploie un cristalloïde, de préférence équilibré, à raison d’au moins 30 mL/kg dans les trois premières heures en cas d’hypoperfusion (suggestion), avec une réévaluation fréquente ; les amidons et les gélatines sont écartés, et l’albumine est réservée à des situations choisies.</li><li>Après 30 mL/kg, une stratégie libérale ou restrictive se choisit selon le patient et les ressources ; dans l’essai CLOVERS, la mortalité n’a pas différé (14,0 % contre 14,9 %).</li><li>Les mesures dynamiques, comme le lever passif de jambes avec mesure du volume d’éjection, la décroissance du lactate et le temps de recoloration capillaire guident la suite du remplissage.</li><li>La noradrénaline est le vasopresseur de première intention (recommandation forte) ; elle peut débuter par voie périphérique, et en même temps que le remplissage si le choc est instable.</li><li>La pression artérielle moyenne vise 65 mmHg, dans une plage d’environ 5 mmHg, ou 60 à 65 mmHg dès 65 ans (suggestion).</li><li>Le foyer se contrôle idéalement dans les six heures, par le geste efficace le plus sûr, car un élargissement du spectre ne remplace pas un drainage.</li><li>Si le choc persiste, la vasopressine s’ajoute lorsque la noradrénaline augmente, en pratique à 0,25–0,5 µg/kg/min (Surviving Sepsis Campaign 2021) ; l’adrénaline suit si la pression reste insuffisante, et la dobutamine s’ajoute, ou l’adrénaline seule est employée, en cas de dysfonction cardiaque.</li><li>Les corticostéroïdes sont suggérés dans le choc septique seulement ; la Surviving Sepsis Campaign 2021 proposait l’hydrocortisone à 200 mg/jour lorsque la noradrénaline ou l’adrénaline atteint au moins 0,25 µg/kg/min, au moins 4 heures après le début du vasopresseur, seuil que le texte de 2026 ne fixe plus.</li><li>Une corticothérapie au long cours impose une dose de stress : 100 mg d’hydrocortisone par voie intraveineuse, puis 200 mg par 24 heures ou 50 mg toutes les 6 heures (recommandation conjointe de 2024).</li><li>La terlipressine, le lévosimendan et les bêtabloquants de courte durée d’action sont écartés, et les preuves manquent pour le bleu de méthylène.</li><li>Les recommandations fortes du soutien d’organe sont la ventilation protectrice du syndrome de détresse respiratoire aiguë (6 mL/kg et pression de plateau d’au plus 30 cm H₂O), l’insuline dès 10 mmol/L, la transfusion restrictive et la prophylaxie thromboembolique par héparine de bas poids moléculaire.</li><li>Les suggestions du soutien d’organe comprennent l’oxygénothérapie nasale à haut débit si le rapport PaO₂/FiO₂ est inférieur à 200, l’inhibiteur de la pompe à protons en cas de risque hémorragique, la nutrition entérale dans les 72 heures, l’abstention d’épuration extrarénale sans indication formelle et l’abstention d’antipyrétique dans le seul but pronostique.</li><li>La surveillance combine la pression, le temps de recoloration, le lactate, la diurèse, la conscience, les échanges gazeux, le bilan hydrique, la microbiologie et la glycémie ; un paramètre qui ne s’améliore pas impose d’en chercher la cause avant d’ajouter du soluté.</li><li>La désescalade est recommandée dès que l’agent et sa sensibilité sont connus ; une durée courte est suggérée après contrôle du foyer, et 7 jours n’étaient pas inférieurs à 14 jours dans les bactériémies de l’essai BALANCE (14,5 % contre 16,1 %).</li><li>La procalcitonine, associée à l’évaluation clinique, aide à décider de l’arrêt lorsque la durée est incertaine, et jamais du début.</li><li>Après la phase aiguë du choc, l’élimination active de liquide est suggérée, par diurétiques puis, s’ils ne suffisent pas, par ultrafiltration ou soustraction extracorporelle de liquide.</li><li>La sortie comporte une transmission structurée, une réconciliation médicamenteuse, une information écrite et orale et un dépistage des besoins sociaux ; le suivi recherche les séquelles cognitives, physiques et psychiques.</li><li>La prévention associe la vaccination annuelle contre la grippe et une dose de vaccin conjugué contre les pneumocoques dès 65 ans (Plan de vaccination suisse 2026), le traitement des obstacles, l’hygiène des dispositifs et l’usage raisonné des antibiotiques.</li><li>Le sepsis maternel est une défaillance d’organe due à une infection de la grossesse, de l’accouchement, d’un avortement ou du post-partum ; chez l’enfant s’appliquent les critères Phoenix, avec un score d’au moins 2 points pour le sepsis et au moins 1 point cardiovasculaire pour le choc.</li><li>Chez la personne âgée, la présentation peut être trompeuse et la cible de pression est de 60 à 65 mmHg ; en insuffisance rénale ou hépatique, seule la dose d’entretien s’adapte, et l’insuffisance cardiaque impose une réévaluation plus fréquente du remplissage.</li><li>Les critères formels sont une hausse du score SOFA d’au moins 2 points pour le sepsis et, pour le choc septique, un vasopresseur pour une pression artérielle moyenne d’au moins 65 mmHg avec un lactate supérieur à 2 mmol/L malgré un remplissage adéquat.</li></ul></template>
<template data-pop="pareto-a41-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="a41-e-1,a41-e-2,a41-e-3,a41-e-4,a41-e-5"></p><ul><li>Il n’existe aucun examen isolé de référence du syndrome : défaillance aiguë attribuable à une infection, évaluation SOFA et clinique.</li><li>Prélever le sang et la source, rechercher un obstacle ou abcès qui impose un geste.</li><li>Lactate &gt; 2 mmol/L entre dans le choc formel seulement avec les autres critères ; suivre tendance et perfusion.</li><li>Références : microbiologie d’un site pertinent pour l’agent ; gazométrie artérielle pour l’oxygénation et le pH.</li><li>Valeurs usuelles de l’adulte : lactate plasmatique 0,5–1,5 mmol/L, hyperlactatémie au-delà de 2,0 mmol/L (Centre hospitalier universitaire vaudois, 2022) ; plaquettes 150–450 × 10⁹/L (Hôpitaux universitaires de Genève, 2026) ; créatinine et bilirubine comparées à l’état antérieur.</li><li>Hémocultures idéalement avant l’antibiotique, sans retard dangereux ; une culture négative n’exclut pas le sepsis, une culture positive peut être une contamination.</li><li>Procalcitonine non ajoutée à l’évaluation clinique pour décider du début des antibiotiques (suggestion) ; sepsis possible sans choc : antibiotique dans les trois heures si la suspicion persiste.</li></ul></template>
<template data-pop="pareto-a41-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="a41-s-1,a41-s-2,a41-s-3,a41-s-4">Les parties reliées ci-dessous expliquent les mécanismes essentiels à cette synthèse.</p><ul><li>La source possède une anatomie. Sa maîtrise fait partie du traitement lorsque cette structure entretient l’infection.</li><li>La pression décrit la circulation générale. L’endothélium et les capillaires expliquent pourquoi les organes exigent une surveillance supplémentaire.</li><li>Un lactate élevé indique une question physiologique à résoudre. Sa cinétique contribue au suivi sans remplacer les observations du patient.</li><li>L’hôte contribue au sepsis. Comprendre une voie biologique aide à raisonner, mais son blocage n’est pas automatiquement bénéfique.</li></ul></template>
<template data-pop="pareto-a41-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="a41-p-1,a41-p-2,a41-p-3,a41-p-4"></p><ul><li>Antibiotique dirigé par foyer et risques individuels, puis désescalade ; pas de couverture systématique des multirésistants, des anaérobies ou des champignons.</li><li>Noradrénaline en premier (8–12 µg/min au début pour 70 kg, 2–4 µg/min en dysfonction ventriculaire gauche majeure avec hypotension aiguë, paliers de 0,05–0,1 µg/kg/min, entretien moyen 2–4 µg/min, jusqu’à 30 µg/min en choc réfractaire) ; argipressine 0,01 puis jusqu’à 0,03 unité internationale/min, ajoutée en pratique à 0,25–0,5 µg/kg/min de noradrénaline (Surviving Sepsis Campaign 2021) ; adrénaline 0,05–2 µg/kg/min si la pression reste insuffisante ; dobutamine 2,5–10 µg/kg/min, exceptionnellement jusqu’à 40, si dysfonction cardiaque.</li><li>Hydrocortisone suggérée dans le choc septique : 200 mg/jour, 50 mg toutes les 6 heures ou en continu, débutée si noradrénaline ou adrénaline ≥ 0,25 µg/kg/min au moins 4 heures après le début du vasopresseur (Surviving Sepsis Campaign 2021 ; seuil non repris en 2026) ; durée étudiée de 7 jours au plus dans ADRENAL et de 7 jours fixes dans APROCCHSS ; emploi de routine non recommandé par l’information suisse de Solu-Cortef.</li><li>Après dose de charge, perfusion prolongée de bêta-lactamine pour l’entretien selon la Surviving Sepsis Campaign 2026 ; pipéracilline/tazobactam 4 g/0,5 g en 30 minutes toutes les 8 heures (toutes les 12 heures sous 20 mL/min de filtration glomérulaire), pas en traitement définitif d’une bactériémie à entérobactérie résistante à la ceftriaxone.</li><li>Débit de noradrénaline en mL/h calculé d’après la concentration de la présentation, les doses en µg/min étant communes aux quatre concentrations ; adaptation rénale des antibiotiques ; allergie aux bêta-lactamines caractérisée ; argipressine pendant la grossesse : indication vitale seulement (contractions utérines).</li><li>À éviter : vitamine C intraveineuse, immunoglobulines, purification sanguine, terlipressine, bêtabloquants comme traitement du choc.</li></ul></template>
