<template data-pop="a41-norad" data-title="Noradrénaline : mécanisme, doses et unités"><p><b>Du fonctionnement normal au traitement.</b> Le muscle lisse artériolaire règle la résistance vasculaire. La noradrénaline stimule notamment ses récepteurs α₁, couplés à Gq/11 : la phospholipase C hydrolyse le phosphatidylinositol bisphosphate, libérant de l’inositol trisphosphate et du diacylglycérol. Le premier favorise la libération de calcium intracellulaire ; le calcium lié à la calmoduline active la kinase des chaînes légères de myosine, permettant la contraction. Le diacylglycérol et d’autres voies modulent aussi cette réponse. Dans la vasoplégie septique, cette stimulation augmente la résistance et la pression, sans corriger à elle seule la fuite capillaire ni garantir la perfusion microcirculatoire.</p><p>Le couplage α₁–Gq/11–phospholipase C est décrit par la revue de 1999 (identifiant PubMed 10443582) ; la phosphorylation de la myosine et le rôle du calcium ont été étudiés dans des artères de rat (identifiant PubMed 9581541). Ces observations expliquent une voie de contraction ; elles ne constituent pas un essai de bénéfice clinique du sepsis. La Surviving Sepsis Campaign 2026 recommande la noradrénaline comme premier vasopresseur.</p><p><b>Notice suisse et unités.</b> Noradrenalin Sintetica, Swissmedic 67023, octobre 2020, est prêt à l’emploi, sans dilution : 0,06 ; 0,10 ; 0,12 ou 0,20 mg/mL de noradrénaline <b>base</b>. La substance est fournie sous forme de tartrate ; toutes les doses et tous les calculs présentés ici portent sur la base. Une dose de sel ne se substitue pas numériquement à une dose de base ; la quantité active indiquée par le fabricant fait référence.</p><p>Pour 70 kg, la notice donne un début à 8–12 µg/min et une titration par paliers de 0,05–0,1 µg/kg/min de base. Elle indique un entretien moyen de 2–4 µg/min et mentionne 30 µg/min dans le choc réfractaire, mais ses tableaux de titration vont jusqu’à 1 µg/kg/min : <b>30 µg/min n’est donc pas un plafond universel</b>. À 70 kg, 1 µg/kg/min correspond à 70 µg/min ou 4,2 mg/h. La réponse clinique et les effets indésirables limitent l’escalade.</p><p><b>Calcul.</b> À 70 kg, 0,1 µg/kg/min donne 7 µg/min, puis 420 µg/h. Avec 0,10 mg/mL, soit 100 µg/mL, le débit est 4,2 mL/h ; avec 0,20 mg/mL, il est 2,1 mL/h. La dose reste identique, le volume change. Les doses de 2–4 µg/min décrites dans la notice pour certains chocs cardiogéniques ne sont pas une recommandation générale de début pour la cardiomyopathie septique.</p><p><b>Risques et surveillance.</b> La pression, le rythme, la perfusion cutanée et le point de perfusion sont surveillés. L’extravasation expose à la nécrose ; l’hypovolémie impose une correction concomitante adaptée. Une obstruction ou une défaillance cardiaque peut rendre une vasoconstriction supplémentaire nuisible. Les tricycliques et les inhibiteurs de la monoamine oxydase peuvent potentialiser l’effet. Pendant la grossesse, la vasoconstriction peut réduire la perfusion utéroplacentaire.</p><p><b>À retenir.</b> La dose est titrée en base ; un chiffre isolé de notice ne suffit pas à définir une dose maximale pour tous les patients.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=67023" target="_blank" rel="noopener">Noradrenalin Sintetica, octobre 2020</a> ; Surviving Sepsis Campaign 2026 ; <a href="https://pubmed.ncbi.nlm.nih.gov/10443582/" target="_blank" rel="noopener">α₁ et Gq/11, 1999</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9581541/" target="_blank" rel="noopener">myosine artérielle, 1997</a>. Consultées le 8 octobre 2026.</div><div class="src">Prise en charge actualisée : <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-53" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, recommandation 53 : noradrénaline de première intention</a>. Énoncés de la campagne conjointe ESICM, publiés le 23 mars 2026 dans <i>Intensive Care Medicine</i>, consultés le 8 octobre 2026. Les notices de présentation et d’administration citées ci-dessus conservent leur date et leur portée.</div></template>
<template data-pop="a41-vaso" data-title="Argipressine : voie vasculaire et sécurité"><p><b>Mécanisme.</b> La vasopressine endogène contribue au tonus vasculaire et à la réabsorption rénale d’eau. Sur le muscle lisse, le récepteur V1a est couplé à Gq : la voie phospholipase C–inositol trisphosphate libère du calcium et favorise la contraction, indépendamment des récepteurs adrénergiques. Le récepteur rénal de type 2 participe à l’effet antidiurétique. L’information professionnelle d’Empressin décrit la cascade phosphatidylinositol–calcium ; des expériences cellulaires confirment V1a–Gq–phospholipase C (identifiant PubMed 25697345, cellules dérivées du tissu adipeux humain). Ce modèle cellulaire ne mesure pas l’efficacité du choc septique.</p><p>Dans une petite étude humaine de 1997, la vasopressine était inappropriément basse chez certains patients en choc septique comparativement au choc cardiogénique (identifiant PubMed 9054839). Cette observation ne démontre pas une carence uniforme de tous les sepsis. L’ajout thérapeutique vise un effet vasopresseur complémentaire ; il n’est pas une substitution endocrine obligatoire.</p><p><b>Dose suisse.</b> Empressin, Swissmedic 66180, septembre 2025, s’emploie chez l’adulte pour l’hypotension réfractaire aux catécholamines après restauration volémique appropriée. Le début est 0,01 unité internationale/min, augmenté toutes les 15–20 minutes jusqu’à 0,03 unité/min. Des doses supérieures sont réservées à l’urgence en raison du risque d’ischémie ; aucun bolus n’est administré. La dilution de 40 unités dans un volume final de 50 mL de chlorure de sodium à 0,9 % donne 0,8 unité/mL : 0,03 unité/min correspond à 1,8 unité/h, soit 2,25 mL/h.</p><p><b>Place clinique et preuve.</b> La Surviving Sepsis Campaign 2026 suggère l’ajout lorsque les besoins de noradrénaline augmentent, avec une certitude modérée. Le repère de 0,25–0,5 µg/kg/min de noradrénaline <b>base</b> provient de la pratique décrite en 2021 et n’est pas un seuil obligatoire de 2026. Toute mention d’équivalent noradrénaline exige aussi la convention de base et ne se compare pas à une dose exprimée en sel. VASST (2008), décrit dans la notice suisse, a comparé l’argipressine à un supplément de noradrénaline chez 778 patients : la mortalité à 28 jours était 35,4 % contre 39,3 %, sans différence significative. Un sous-groupe ne suffit pas à garantir un gain de survie.</p><p><b>Risques.</b> L’ischémie myocardique, digestive ou digitale, la réduction du débit et les troubles du rythme sont recherchés. L’effet antidiurétique justifie le contrôle de la natrémie et du bilan hydrique, notamment devant une hyponatrémie. La grossesse ne permet l’emploi que pour une indication vitale, en raison des contractions utérines ; la notice ne fournit pas un schéma de réduction standard pour l’insuffisance rénale ou hépatique.</p><p><b>À retenir.</b> La vasopressine apporte une voie complémentaire, avec une dose et une surveillance distinctes de celles de la noradrénaline.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66180" target="_blank" rel="noopener">Empressin, septembre 2025</a> ; Surviving Sepsis Campaign 2021 et 2026 ; <a href="https://pubmed.ncbi.nlm.nih.gov/9054839/" target="_blank" rel="noopener">vasopressine dans le choc, 1997</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25697345/" target="_blank" rel="noopener">signalisation V1a, 2015</a>. Consultées le 8 octobre 2026.</div><div class="src">Prise en charge actualisée : <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-56" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, recommandation 56 : ajout de vasopressine lorsque les besoins de noradrénaline augmentent</a>. Énoncés de la campagne conjointe ESICM, publiés le 23 mars 2026 dans <i>Intensive Care Medicine</i>, consultés le 8 octobre 2026. La notice suisse et le repère de 2021 cités ci-dessus conservent leur date et leur portée.</div></template>
<template data-pop="a41-hydro" data-title="Hydrocortisone : mécanismes et distinction des sources"><p><b>Mécanisme.</b> L’hydrocortisone se lie au récepteur intracellulaire des glucocorticoïdes. Le complexe activé rejoint le noyau et modifie la transcription de gènes, notamment des voies de l’inflammation. Des expériences sur l’endothélium montrent une diminution de l’expression de molécules d’adhésion (identifiant PubMed 1279685). Dans des cellules musculaires lisses vasculaires de rat, la dexaméthasone réduit l’activation du facteur nucléaire kappa B, l’expression de iNOS et la production de monoxyde d’azote (identifiant PubMed 10218970).</p><p>Ces résultats expérimentaux expliquent des mécanismes possibles de réduction de la vasoplégie et de modulation de la réponse vasculaire. Ils ne démontrent pas que l’hydrocortisone bloque directement l’enzyme iNOS chez chaque patient, ni que toute vasoplégie est une insuffisance surrénalienne. Les effets minéralocorticoïdes participent aussi à la rétention hydrosodée et aux désordres électrolytiques.</p><p><b>Recommandation clinique.</b> La Surviving Sepsis Campaign 2026 suggère les corticostéroïdes intraveineux dans le choc septique, avec une certitude faible. Le régime usuel décrit en 2021 est l’hydrocortisone à 200 mg/jour, en 50 mg toutes les 6 heures ou en continu. Le texte de 2021 proposait une introduction avec noradrénaline <b>base</b> ou adrénaline ≥ 0,25 µg/kg/min au moins 4 heures après le début du vasopresseur ; ce repère n’est pas repris comme seuil obligatoire en 2026. Le risque, la trajectoire clinique et le besoin de vasopresseur orientent la décision.</p><p><b>Essais et durée.</b> La synthèse primaire des recommandations de 2021 décrit des populations et des régimes distincts : ADRENAL (2018) utilisait 200 mg/jour au plus 7 jours, ou jusqu’à sortie des soins intensifs ou décès ; APROCCHSS (2018) administrait l’hydrocortisone pendant 7 jours et associait la fludrocortisone. Les différences de population et de traitement empêchent d’attribuer à l’hydrocortisone seule tout résultat d’une combinaison. Ces durées étudiées ne constituent pas une durée obligatoire pour tous les patients.</p><p><b>Notice suisse.</b> Solu-Cortef, Swissmedic 23533, octobre 2025, fournit 100 ou 250 mg d’hydrocortisone sous forme de succinate sodique avec 2 mL de solvant. Son information professionnelle réserve certaines indications de choc à une insuffisance corticosurrénalienne avérée ou possible et ne recommande pas l’emploi de routine dans le choc septique. Le régime de 200 mg/jour ci-dessus est donc identifié comme recommandation du sepsis. La notice ne demande pas d’adaptation systématique rénale ; l’insuffisance hépatique sévère ou l’hypothyroïdie peuvent renforcer l’effet.</p><p><b>Risques et surveillance.</b> La glycémie, la natrémie, la kaliémie, le bilan hydrique, la force musculaire et les infections secondaires sont suivis. L’hyperglycémie, l’hypernatrémie, la rétention hydrosodée et la faiblesse musculaire limitent le bénéfice. Les contre-indications et précautions comprennent notamment les infections fongiques systémiques dans la notice ; la décision du choc infectieux impose un traitement anti-infectieux approprié et une appréciation clinique. Une corticothérapie préalable et le risque de suppression surrénalienne modifient l’arrêt et la couverture de stress.</p><p><b>À retenir.</b> Le mécanisme expérimental, la recommandation de société savante et le statut d’autorisation suisse répondent à trois questions différentes.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=23533" target="_blank" rel="noopener">Solu-Cortef, octobre 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8486643/" target="_blank" rel="noopener">Surviving Sepsis Campaign 2021, recommandation 58</a> ; Surviving Sepsis Campaign 2026, recommandation 79 ; <a href="https://pubmed.ncbi.nlm.nih.gov/1279685/" target="_blank" rel="noopener">récepteur et transcription, 1992</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10218970/" target="_blank" rel="noopener">dexaméthasone et iNOS, 1999</a>. Consultées le 8 octobre 2026.</div><div class="src">Prise en charge actualisée : <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-79" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, recommandation 79 : corticostéroïdes intraveineux dans le choc septique</a>. Énoncés de la campagne conjointe ESICM, publiés le 23 mars 2026 dans <i>Intensive Care Medicine</i>, consultés le 8 octobre 2026. Les notices de présentation et d’administration citées ci-dessus conservent leur date et leur portée.</div></template>
<template data-pop="a41-piptazo" data-title="Pipéracilline/tazobactam : action, préparation et perfusion"><p><b>Mécanisme.</b> Les PBP sont des enzymes impliquées dans l’assemblage de la paroi bactérienne. La pipéracilline se lie à ces protéines et bloque la transpeptidation finale du peptidoglycane ; la paroi du germe sensible se fragilise et l’activité devient bactéricide. Le tazobactam a peu d’action antibactérienne propre ; il inhibe de nombreuses bêta-lactamases de classe A, notamment certaines BLSE, et protège ainsi la pipéracilline de l’hydrolyse.</p><p>Cette protection est incomplète : la notice suisse décrit une activité variable contre des enzymes de classes A et D, une absence d’action contre la plupart des céphalosporinases de classe C et une inefficacité contre les métallo-bêta-lactamases de classe B. Une modification des PBP ou d’autres mécanismes de résistance peut rendre l’association inactive. Une sensibilité de laboratoire ne supprime pas toutes les limites cliniques.</p><p><b>Limite démontrée.</b> MERINO (2018, identifiant PubMed 30208454) a étudié le traitement définitif de bactériémies à Escherichia coli ou Klebsiella résistants à la ceftriaxone mais annoncés sensibles à pipéracilline/tazobactam. Dans l’analyse principale, la mortalité à 30 jours était 23/187 (12,3 %) sous pipéracilline/tazobactam contre 7/191 (3,7 %) sous méropénem ; la non-infériorité n’a pas été démontrée. Le résultat ne soutient pas l’association dans cette indication. Il ne compare pas toutes les infections sensibles ni tous les schémas empiriques ; une perfusion prolongée ne permet pas de supposer que cette limite disparaît.</p><p><b>Notice suisse.</b> Piperacillin/Tazobactam Labatec, Swissmedic 60142, mars 2026, fournit des flacons de 2 g/0,25 g et 4 g/0,5 g. La posologie usuelle de l’adulte est 2 g/0,25 g à 4 g/0,5 g trois fois par jour, avec trois à quatre administrations selon la gravité et le foyer, en perfusion de 30 minutes. Pour un débit de filtration de 20–40 mL/min, le tableau donne 4 g/0,5 g toutes les 8 heures ; inférieur à 20 mL/min, toutes les 12 heures. La dialyse possède un régime propre. Dans une insuffisance rénale aiguë changeante, la charge, la clairance, l’épuration et l’entretien se discutent séparément ; une réduction automatique de toute première dose peut compromettre l’exposition.</p><p><b>Préparation exacte.</b> Le flacon de 4 g/0,5 g se reconstitue dans 20 mL de solvant compatible. La solution peut ensuite se diluer dans un volume final, par exemple 50–150 mL, de chlorure de sodium à 0,9 % ou de glucose à 5 %. La limite de 50 mL par dose vise l’eau pour préparations injectables seulement. La compatibilité, la stabilité et les conditions microbiologiques du produit sont respectées ; le Ringer-lactate est incompatible dans la notice Labatec.</p><p><b>Exemple de perfusion prolongée.</b> La Surviving Sepsis Campaign 2026 recommande l’entretien prolongé après une charge. Le protocole primaire National Health Service Borders, révisé le 30 avril 2025, illustre une administration hors modalités autorisées : charge de 4 g/0,5 g en 30 minutes, immédiatement suivie de la première dose de 4 g/0,5 g sur 4 heures, puis toutes les 6–8 heures avec fonction rénale normale. Son volume final est 50–100 mL de chlorure de sodium à 0,9 % ou de glucose à 5 %. Il est proposé sur avis spécialisé à des patients de soins critiques sélectionnés, avec adaptation à la fonction rénale ; il exclut notamment certaines dialyses. Ces modalités institutionnelles ne sont pas présentées comme la notice suisse.</p><p><b>Raison et surveillance.</b> L’activité d’une bêta-lactamine dépend du temps pendant lequel sa concentration libre dépasse la CMI du germe. Allonger la perfusion peut prolonger ce temps, mais une charge est nécessaire pour éviter d’attendre des heures avant une exposition efficace. La fonction rénale, l’allergie, la numération, les électrolytes et l’état neurologique sont surveillés ; l’accumulation favorise notamment les convulsions. L’association avec vancomycine expose davantage à l’atteinte rénale. La gentamicine se donne séparément : le mélange peut l’inactiver.</p><p><b>À retenir.</b> Le mécanisme, la sensibilité, le foyer et l’exposition doivent concorder ; aucune prolongation de perfusion ne remplace un antibiotique réellement actif.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=60142" target="_blank" rel="noopener">Labatec, mars 2026</a>, rubriques Posologie, Propriétés et Manipulation ; <a href="https://pubmed.ncbi.nlm.nih.gov/30208454/" target="_blank" rel="noopener">MERINO, 2018</a> ; Surviving Sepsis Campaign 2026, recommandations 33–34 ; <a href="https://www.rightdecisions.scot.nhs.uk/antimicrobial-prescribing-nhs-borders/speciality-guidelines/intravenous-piperacillintazobactam-in-adults-in-critical-care-via-extended-infusion/" target="_blank" rel="noopener">National Health Service Borders, 30 avril 2025</a>. Consultées le 8 octobre 2026.</div></template>
<template data-pop="pareto-a41-def" data-title="Pareto — Définitions, codage et épidémiologie"><p class="ratio" data-cover="a41-0,a41-1,a41-2"></p><ul><li>Le sepsis est une défaillance d’organe menaçant la vie, causée par une réponse dérégulée de l’hôte à une infection (Sepsis-3, 2016).</li><li>Son critère opérationnel est une hausse aiguë du score SOFA d’au moins 2 points attribuable à l’infection ; le score de base est présumé nul sans défaillance connue, et ce seuil correspond à une mortalité hospitalière d’environ 10 %.</li><li>Le score SOFA cote de 0 à 4 points six fonctions : respiration, coagulation, foie, circulation, système nerveux central et rein. La définition repose sur le score d’origine, bien qu’un SOFA-2 ait été publié en 2025.</li><li>Le choc septique exige un vasopresseur pour maintenir la pression artérielle moyenne à 65 mmHg ou plus et un lactate supérieur à 2 mmol/L, malgré un remplissage adéquat ; sa mortalité hospitalière dépasse 40 %.</li><li>Les deux critères du choc sont exigés ensemble, car leur association s’accompagnait d’une mortalité ajustée de 42,3 %, contre 25,7 % pour l’hyperlactatémie seule et 30,1 % pour l’hypotension sous vasopresseur sans hyperlactatémie.</li><li>Le choc septique est une catégorie de classement : une hypotension infectieuse se traite sans attendre le lactate.</li><li>Les critères de réponse inflammatoire ne définissent plus le sepsis, car ils manquent de spécificité et de sensibilité ; le terme « sepsis sévère » est redondant.</li><li>Une bactériémie n’est pas un sepsis ; une culture n’est positive que dans 30 à 40 % des sepsis, et des hémocultures négatives n’excluent pas le diagnostic.</li><li>Le qSOFA n’est pas un critère diagnostique, et la Surviving Sepsis Campaign 2026 recommande de ne pas l’employer comme unique outil de dépistage à l’hôpital.</li><li>La recommandation de référence est la Surviving Sepsis Campaign 2026, qui compte 129 énoncés, dont 46 nouveaux, chacun avec une force et un degré de certitude.</li><li>La catégorie A41 de la CIM-10-GM 2024 couvre les autres sepsis et les sepsis d’agent non précisé ; A40 correspond aux sepsis à streptocoques, R57.2 au choc septique en code complémentaire, et le choc toxique relève de A48.3 ; un code d’agent peut être ajouté selon les règles de codage applicables, sans caractère universel obligatoire.</li><li>En 2017, le sepsis a représenté 48,9 millions de cas et 11,0 millions de décès dans le monde, soit 19,7 % de tous les décès.</li><li>En Suisse, environ 20 000 séjours sont codés sepsis chaque année, dont 500 à 600 séjours d’enfants, avec près de 4 000 décès intrahospitaliers ; en 2023, 70,2 % des séjours concernaient des personnes de 65 ans et plus, et 40,7 % passaient par les soins intensifs.</li><li>La mortalité intrahospitalière suisse atteignait 18,9 % en 2023, 32,6 % en cas de choc et 22,3 % après 65 ans. Il s’agit d’une mortalité toutes causes, mesurée sur des séjours, et le repérage par infection et défaillance trouve jusqu’à quatre fois plus de séjours que le codage explicite.</li><li>Près de 30 % des patients suisses de 65 ans et plus sont décédés dans l’année suivant l’admission : ce cumul comprend les 22,3 % de décès intrahospitaliers. Les quelque 40 % de réhospitalisations à 90 jours rapportés par la revue JAMA de 2018 proviennent de populations surtout nord-américaines et ne sont pas une estimation suisse. Le suivi fait partie du traitement.</li></ul></template>
<template data-pop="pareto-a41-physio" data-title="Pareto — Physiopathologie, foyers et terrain"><p class="ratio" data-cover="a41-3,a41-4"></p><ul><li>La réponse normale reconnaît le microbe par des récepteurs comme les TLR, produit localement des cytokines comme le TNF-α, l’IL-1 et l’IL-6, contient l’infection au foyer, puis s’arrête grâce à des médiateurs comme l’IL-10.</li><li>Dans le sepsis, la réponse devient systémique et peut s’associer à une diminution de fonctions immunitaires, qui expose aux infections secondaires.</li><li>L’hypotension naît de la vasoplégie, due à l’excès de monoxyde d’azote produit par sa synthase inductible, à la moindre réponse aux catécholamines et à une vasopressine insuffisante chez certains patients.</li><li>La fuite capillaire, par altération endothéliale dont la dégradation du glycocalyx, et la dilatation veineuse créent une hypovolémie absolue et relative : le remplissage aide au début, puis son excès aggrave les œdèmes.</li><li>Une cardiomyopathie septique réversible peut réduire la contractilité ; le profil habituel associe un débit normal ou élevé et des résistances basses.</li><li>Le débit capillaire devient hétérogène, des microthrombi peuvent obstruer les capillaires et les mitochondries peuvent utiliser moins efficacement l’oxygène : un organe peut souffrir malgré une pression corrigée.</li><li>Le lactate s’élève par défaut d’apport d’oxygène, par respiration mitochondriale altérée, par glycolyse aérobie accélérée et par élimination hépatique réduite ; c’est un marqueur de gravité, et non un test diagnostique.</li><li>L’inflammation active la coagulation par le facteur tissulaire, consomme l’antithrombine, la protéine C et les plaquettes, et inhibe la fibrinolyse ; la forme extrême est la coagulation intravasculaire disséminée.</li><li>Chaque organe a son signe et sa variable du score SOFA : la confusion et le score de Glasgow, l’hypoxémie et le rapport PaO₂/FiO₂, l’hypotension et la dose de vasopresseur, l’oligurie et la créatinine, l’ictère tardif et la bilirubine, la thrombopénie et les plaquettes.</li><li>Le remplissage corrige l’hypovolémie absolue et une part de l’hypovolémie relative ; la noradrénaline restaure le tonus artériolaire et veineux, dont la constriction peut augmenter la précharge. Le contrôle du foyer retire la source infectieuse ; aucun de ces traitements ne remplace les autres.</li><li>Le poumon était le foyer de 68 % des sepsis de soins intensifs de SOAP. Dans les bactériémies sélectionnées de BALANCE, l’origine urinaire représentait 42,2 %. L’essai excluait Staphylococcus aureus, l’immunodépression sévère et les foyers exigeant un traitement prolongé. Un premier foyer n’en exclut pas un second.</li><li>Les bactéries causent la majorité des sepsis ; chaque foyer oriente vers ses agents habituels, et les entérobactéries, <i>Escherichia coli</i> au premier rang, dominent le foyer urinaire.</li><li>L’âge, les comorbidités, la corticothérapie, la neutropénie, l’asplénie, le diabète, la cirrhose et les dispositifs augmentent le risque ou la gravité ; 70,2 % des séjours suisses concernent des personnes de 65 ans et plus.</li><li>Les glucocorticoïdes peuvent atténuer la fièvre. Une corticothérapie actuelle ou récente fait vérifier le risque surrénalien. S’il n’a pas été écarté, une couverture de stress s’adapte à la gravité et au traitement déjà reçu.</li><li>La Surviving Sepsis Campaign 2026 suggère de couvrir un germe multirésistant seulement en cas de risque élevé, les anaérobies seulement en présence de facteurs de risque, et de ne pas prescrire d’antifongique empirique en routine.</li><li>Un foyer clos ou nécrosé impose un geste de contrôle, idéalement dans les six heures suivant le diagnostic du sepsis ou du choc septique qui l’impose. Les urgences chirurgicales, dont les infections nécrosantes, n’attendent pas ce délai.</li></ul></template>
<template data-pop="pareto-a41-diag" data-title="Pareto — Reconnaissance et diagnostic"><p class="ratio" data-cover="a41-5,a41-6,a41-7,a41-8"></p><ul><li>L’anamnèse établit l’infection et son foyer, date une défaillance nouvelle, repère ce qui modifie l’antibiotique et recueille les volontés du patient, en même temps que les premiers soins.</li><li>Les antécédents utiles sont l’immunosuppression, la corticothérapie au long cours, les dispositifs, l’asplénie, les infections et antibiotiques antérieurs, les fonctions d’organe de base et les allergies caractérisées ; les objectifs de soins se discutent tôt, idéalement dans les 72 heures.</li><li>Seule la comparaison avec l’état antérieur permet de dire qu’une confusion, une oligurie ou une créatinine élevée traduit une défaillance nouvelle.</li><li>Chez 526 adultes fébriles aux urgences dans l’étude prospective observationnelle de Tokuda (2005), les frissons intenses avec tremblement de tout le corps s’associaient à un risque relatif ajusté de bactériémie de 12,1 par rapport à leur absence ; cette estimation ne concerne pas tous les sepsis ; la fièvre peut manquer chez le sujet âgé ou sous corticoïdes, et toute défaillance inexpliquée doit faire évoquer une infection.</li><li>Les formes atypiques comprennent la chute du sujet âgé, la neutropénie sans signe local, l’infection fulminante du splénectomisé, l’infection nécrosante à douleur disproportionnée et le choc toxique.</li><li>L’examen mesure la gravité avant de chercher le foyer : conscience par le score de Glasgow, fréquence respiratoire comptée sur une minute, pression artérielle moyenne, fréquence cardiaque, SpO₂, température et diurèse.</li><li>Dans le National Early Warning Score 2, une fréquence respiratoire de 12 à 20 par minute, une SpO₂ de 96 % ou plus, une pression systolique de 111 à 219 mmHg, un pouls de 51 à 90 par minute et une température de 36,1 à 38,0 °C valent 0 point ; un total de 7 ou plus impose une réponse d’urgence.</li><li>Le remplissage se calcule sur le poids réel, ou sur le poids ajusté ou idéal si l’indice de masse corporelle dépasse 30 kg/m².</li><li>Un temps de recoloration capillaire supérieur à 3 secondes, mesuré après 10 secondes de pression sur l’index, est anormal ; le score de marbrures va de 0 à 5, et un score élevé six heures après la réanimation s’associe à un risque de décès accru.</li><li>Une diurèse inférieure à 0,5 mL/kg/h pendant 6 heures définit une atteinte rénale aiguë selon KDIGO.</li><li>Le choc instable se reconnaît à l’examen, par une pression très basse, des marbrures, un teint cendré, une cyanose, une tachycardie et une confusion ; il peut justifier, au cas par cas, un vasopresseur en même temps que le remplissage.</li><li>Le diagnostic suit trois questions : infection probable, défaillance nouvelle avec une hausse du score SOFA d’au moins 2 points, choc défini par le vasopresseur et le lactate.</li><li>Le dépistage hospitalier repose sur un score d’alerte à plusieurs constantes ou sur les critères de réponse inflammatoire (recommandation forte) ; le qSOFA, construit pour prédire et non pour dépister, manque de sensibilité.</li><li>Le sepsis est un diagnostic clinique : les hémocultures, idéalement avant l’antibiotique (recommandation forte), le lactate et le bilan d’organe se demandent d’emblée, sans retarder le traitement, et la procalcitonine ne décide pas du début des antibiotiques.</li><li>Le différentiel se classe par gravité : chocs hémorragique, cardiogénique et obstructif, anaphylaxie et crise surrénalienne d’abord, puis inflammations non infectieuses, intoxications et décompensations chroniques ; un choc mixte reste possible.</li><li>Le sepsis et le choc septique sont des urgences : la réanimation commence immédiatement, et l’admission en soins intensifs, lorsqu’elle est nécessaire, est suggérée dans les 6 heures.</li><li>Une hypotension persistante, un choc instable, une défaillance respiratoire, un lactate élevé, un purpura extensif, une infection nécrosante ou un foyer obstrué imposent une action immédiate ; un lactate supérieur à 4 mmol/L sans hypotension s’accompagnait déjà d’une mortalité ajustée de 29,9 %.</li><li>Le choc réfractaire associe une hypoperfusion persistante, l’absence de réponse au remplissage et plus de 0,5 µg/kg/min d’équivalent noradrénaline base (consensus de 2026).</li><li>Les défaillances à surveiller sont le syndrome de détresse respiratoire aiguë, l’atteinte rénale aiguë selon KDIGO, l’encéphalopathie, la coagulation intravasculaire disséminée, la cardiomyopathie septique et la cholestase.</li><li>Un bilan hydrique positif est associé au décès, et les solutés ne se poursuivent pas jusqu’à la normalisation du lactate.</li></ul></template>
<template data-pop="pareto-a41-trait" data-title="Pareto — Traitement et suivi"><p class="ratio" data-cover="a41-9,a41-10,a41-11,a41-12"></p><ul><li>Les cinq objectifs du traitement sont l’antibiotique précoce, le contrôle du foyer, la perfusion restaurée, le soutien des organes et la prévention des dommages du traitement.</li><li>Les hémocultures se prélèvent dès que possible, puis l’antibiotique s’administre immédiatement : dans l’heure en cas de choc possible, probable ou certain, ou de sepsis probable ou certain (recommandations fortes).</li><li>Si le sepsis est seulement possible sans choc, une investigation rapide précède l’antibiotique, donné dans les trois heures si la suspicion persiste ; si l’infection est peu probable sans choc, l’antibiotique peut être différé sous surveillance étroite.</li><li>Chaque heure de retard de l’antibiotique s’associait à un risque de décès accru, avec un rapport de cotes de 1,04 par heure.</li><li>Le spectre suit le foyer, le lieu d’acquisition, le risque de résistance, la fonction d’organe, les allergies et l’écologie locale ; après une dose de charge adaptée au patient et distincte de l’entretien, la bêta-lactamine s’administre en perfusion prolongée (recommandation forte).</li><li>Le remplissage emploie un cristalloïde, de préférence équilibré, à raison d’au moins 30 mL/kg dans les trois premières heures en cas d’hypoperfusion (suggestion), avec une réévaluation fréquente ; les amidons et les gélatines sont écartés, et l’albumine est réservée à des situations choisies.</li><li>Après 30 mL/kg, une stratégie libérale ou restrictive se choisit selon le patient et les ressources ; dans l’essai CLOVERS, la mortalité n’a pas différé (14,0 % contre 14,9 %).</li><li>Les mesures dynamiques, comme le lever passif de jambes avec mesure du volume d’éjection, la décroissance du lactate et le temps de recoloration capillaire guident la suite du remplissage. ProCESS, ARISE et ProMISe n’ont pas montré de gain de survie avec l’ancien protocole de cibles centrales ; ils ne testent pas directement chaque mesure dynamique.</li><li>La noradrénaline est le vasopresseur de première intention (recommandation forte) ; SOAP II montrait davantage d’arythmies sous dopamine, sans gain global de survie démontré ; elle peut débuter par voie périphérique, et en même temps que le remplissage si le choc est instable.</li><li>La pression artérielle moyenne vise 65 mmHg, dans une plage d’environ 5 mmHg, ou 60 à 65 mmHg dès 65 ans (suggestion).</li><li>Une pression dans la plage cible ne garantit pas la perfusion ; les signes persistants guident la réévaluation. Le foyer se contrôle idéalement dans les six heures, par le geste efficace le plus sûr, car un élargissement du spectre ne remplace pas un drainage.</li><li>Si le choc persiste, la vasopressine s’ajoute lorsque la noradrénaline augmente, en pratique à 0,25–0,5 µg/kg/min de noradrénaline base (Surviving Sepsis Campaign 2021) ; l’adrénaline suit si la pression reste insuffisante, et la dobutamine s’ajoute, ou l’adrénaline seule est employée, en cas de dysfonction cardiaque avec hypoperfusion persistante malgré un volume et une pression adéquats.</li><li>Les corticostéroïdes sont suggérés dans le choc septique seulement ; la Surviving Sepsis Campaign 2021 proposait l’hydrocortisone à 200 mg/jour lorsque la noradrénaline base ou l’adrénaline atteint au moins 0,25 µg/kg/min, au moins 4 heures après le début du vasopresseur, seuil que le texte de 2026 ne fixe plus.</li><li>Si une corticothérapie actuelle ou récente laisse un risque surrénalien non écarté, une couverture de stress s’adapte à la gravité et au traitement déjà reçu ; pour une crise ou un stress majeur justifiant la voie parentérale, le schéma de 2024 est 100 mg d’hydrocortisone par voie intraveineuse, puis 200 mg par 24 heures ou 50 mg toutes les 6 heures.</li><li>La terlipressine, le lévosimendan et les bêtabloquants de courte durée d’action sont écartés, et les preuves manquent pour le bleu de méthylène.</li><li>Les recommandations fortes du soutien d’organe sont la ventilation protectrice du syndrome de détresse respiratoire aiguë (6 mL/kg et pression de plateau d’au plus 30 cm H₂O), l’insuline dès 10 mmol/L, avec une cible usuelle de 8 à 10 mmol/L après son début selon la Surviving Sepsis Campaign 2021, la transfusion restrictive et la prophylaxie thromboembolique par héparine de bas poids moléculaire.</li><li>Les suggestions du soutien d’organe comprennent l’oxygénothérapie nasale à haut débit si le rapport PaO₂/FiO₂ est inférieur à 200, l’inhibiteur de la pompe à protons en cas de risque hémorragique, la nutrition entérale dans les 72 heures, l’abstention d’épuration extrarénale sans indication formelle et l’abstention d’antipyrétique dans le seul but pronostique.</li><li>La surveillance combine la pression, le temps de recoloration, le lactate, la diurèse, la conscience, les échanges gazeux, le bilan hydrique, la microbiologie et la glycémie ; un paramètre qui ne s’améliore pas impose d’en chercher la cause avant d’ajouter du soluté.</li><li>La désescalade est recommandée dès que l’agent et sa sensibilité sont connus ; une durée courte est suggérée après contrôle du foyer, et 7 jours n’étaient pas inférieurs à 14 jours dans les bactériémies sélectionnées de BALANCE (14,5 % contre 16,1 %) ; l’essai excluait notamment Staphylococcus aureus, l’immunodépression sévère, les foyers exigeant un traitement prolongé et les contaminants possibles.</li><li>La procalcitonine, associée à l’évaluation clinique, aide à décider de l’arrêt lorsque la durée est incertaine, et jamais du début.</li><li>Une fois terminée la phase aiguë du choc, sans besoin persistant de remplissage ni vasopresseurs croissants ou encore élevés, l’élimination active de liquide est suggérée, par diurétiques puis, s’ils ne suffisent pas, par ultrafiltration ou soustraction extracorporelle de liquide.</li><li>La sortie comporte une transmission structurée, une réconciliation médicamenteuse, une information écrite et orale et un dépistage des besoins sociaux ; le suivi recherche les séquelles cognitives, physiques et psychiques.</li><li>La prévention associe la vaccination annuelle contre la grippe et une dose de vaccin conjugué contre les pneumocoques dès 65 ans (Plan de vaccination suisse 2026), le traitement des obstacles, l’hygiène des dispositifs et l’usage raisonné des antibiotiques.</li><li>Le sepsis maternel est une défaillance d’organe due à une infection de la grossesse, de l’accouchement, d’un avortement ou du post-partum ; chez l’enfant s’appliquent les critères Phoenix, avec un score d’au moins 2 points pour le sepsis et au moins 1 point cardiovasculaire pour le choc.</li><li>Chez la personne âgée, la présentation peut être trompeuse et la cible de pression est de 60 à 65 mmHg ; en insuffisance rénale ou hépatique, la charge et l’entretien se discutent séparément selon le médicament et la situation, et l’insuffisance cardiaque impose une réévaluation plus fréquente du remplissage.</li><li>Sepsis-3 définit le sepsis comme une dysfonction d’organe menaçant la vie, causée par une réponse dérégulée de l’hôte à une infection. Une hausse aiguë du score SOFA d’au moins 2 points attribuable à l’infection est son critère opérationnel. Le choc exige en plus un vasopresseur pour une pression moyenne d’au moins 65 mmHg et un lactate supérieur à 2 mmol/L malgré un remplissage adéquat.</li></ul></template>
<template data-pop="pareto-a41-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="a41-e-1,a41-e-2,a41-e-3,a41-e-4,a41-e-5"></p><ul>
<li>Il n’existe aucun examen isolé de référence du syndrome : le diagnostic relie une infection à une défaillance aiguë attribuable, avec la clinique et le score SOFA. Une microbiologie pertinente identifie l’agent ; une gazométrie artérielle est la référence pour l’oxygénation et le pH.</li>
<li>Le médecin obtient au moins deux paires d’hémocultures sans retard dangereux. Avec les flacons adultes du Centre hospitalier universitaire vaudois, chaque flacon reçoit 8–10 mL, sans dépasser 10 mL. Les prélèvements précèdent idéalement l’antibiotique, sans retarder un traitement urgent ; une culture négative n’exclut pas le sepsis et une culture positive peut être une contamination.</li>
<li>Le lactate supérieur à 2 mmol/L entre dans la définition formelle du choc seulement avec les autres critères. Un lactate élevé n’impose pas un nouveau bolus. La Surviving Sepsis Campaign 2026 suggère des mesures successives, avec une certitude faible ; le remplissage est individualisé. Les intervalles de référence du laboratoire et l’état antérieur guident la lecture des autres résultats.</li>
<li>Une procalcitonine ou une CRP isolée ne confirme ni n’exclut le sepsis. La Surviving Sepsis Campaign 2026 suggère la procalcitonine avec l’évaluation clinique pour aider à l’arrêt, après contrôle du foyer et si la durée reste incertaine ; la recommandation est conditionnelle, avec une certitude faible. La procalcitonine ne s’ajoute pas à la clinique pour décider à elle seule du début des antibiotiques.</li>
<li>Le pH, la PaCO₂ et le bicarbonate se lisent ensemble. Dans l’acidose métabolique, la PaCO₂ attendue vaut environ 1,5 × bicarbonate + 8 ± 2 mmHg. Un pH proche de 7,40 peut masquer un trouble mixte ; la concentration du bicarbonate s’exprime en mmol/L pour ce calcul.</li>
<li>L’imagerie recherche un geste anatomique utile. Le contrôle du foyer précoce, idéalement dans les six heures lorsqu’il est indiqué, est une recommandation conditionnelle de certitude très faible. Les prélèvements et l’imagerie suivent le foyer, l’obstacle ou l’abcès suspecté.</li>
</ul></template>
<template data-pop="pareto-a41-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="a41-s-1,a41-s-2,a41-s-3,a41-s-4"></p><ul>
<li>La relation PAM ≈ DC × RVS + PVC relie pression moyenne, débit cardiaque, résistances et pression veineuse centrale, avec des unités compatibles. Une pression corrigée ne démontre pas que la perfusion de chaque organe est restaurée.</li>
<li>Le contenu artériel en oxygène vaut environ CaO₂ = 1,34 × Hb × SaO₂ + 0,003 × PaO₂, en mL/dL, avec Hb en g/dL, SaO₂ en fraction et PaO₂ en mmHg. Pour un débit en L/min, DO₂ = 10 × DC × CaO₂. À 5 L/min, saturation 0,98 et PaO₂ de 90 mmHg, passer de Hb 140 à 80 g/L réduit cet apport d’environ 933 à 539 mL/min. Cet exercice ne définit pas un seuil transfusionnel.</li>
<li>Le monoxyde d’azote active la guanylate cyclase soluble ; des canaux potassiques peuvent favoriser l’hyperpolarisation et la relaxation vasculaire. Leur contribution varie selon les modèles. Une hausse de pression après inhibition expérimentale ne démontre pas une meilleure perfusion ou survie.</li>
<li>Le facteur tissulaire favorise la génération de thrombine puis de fibrine. La protéine C activée, avec la protéine S, freine les facteurs Va et VIIIa ; l’altération de ces freins et de l’antithrombine peut favoriser les microthrombi. Les observations pédiatriques et d’endotoxémie expérimentale ne prouvent pas une indication thérapeutique chez tous les adultes.</li>
<li>Un lactate élevé peut traduire production accrue, utilisation modifiée ou les deux. La lactate-déshydrogénase régénère le cofacteur oxydé de la glycolyse ; la pyruvate déshydrogénase oriente le pyruvate vers l’oxydation, avec des résultats humains et animaux hétérogènes. Une baisse en série ne mesure pas directement la clairance et n’impose pas le remplissage jusqu’à normalisation.</li>
<li>Des biopsies musculaires montrent une association entre activité du complexe I, ATP et gravité dans des patients sélectionnés. Des tissus postmortem montrent une baisse du HLA-DR sur certaines cellules présentatrices, mais un marquage augmenté sur l’endothélium sinusoïdal splénique. Ces résultats ne définissent ni une trajectoire uniforme ni un seuil prescrivant une immunothérapie.</li>
</ul></template>
<template data-pop="pareto-a41-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="a41-p-1,a41-p-2,a41-p-3,a41-p-4"></p><ul>
<li>Le spectre suit le foyer, l’écologie, les cultures antérieures et les risques individuels ; les couvertures des multirésistants, des anaérobies et des champignons ne sont pas systématiques. Le contrôle anatomique du foyer accompagne l’antibiotique.</li>
<li>La noradrénaline est le premier vasopresseur. La notice suisse indique 8–12 µg/min pour 70 kg, puis des paliers de 0,05–0,1 µg/kg/min de base ; 30 µg/min n’est pas un plafond universel, puisque les tableaux vont jusqu’à 1 µg/kg/min. Le débit dépend de la concentration réellement administrée et tous les seuils de noradrénaline sont exprimés en base.</li>
<li>L’argipressine commence à 0,01 unité internationale/min, puis atteint au plus 0,03 selon la notice, hors urgence ; les besoins croissants de noradrénaline justifient son ajout suggéré en 2026. Le repère de 0,25–0,5 µg/kg/min de base vient de la pratique 2021. Si la pression reste insuffisante, l’adrénaline peut être ajoutée ; la dose étrangère de 0,05–2 µg/kg/min ne vaut pas autorisation suisse universelle.</li>
<li>La dobutamine, usuellement 2,5–10 µg/kg/min selon la notice suisse, complète la noradrénaline en cas de dysfonction cardiaque avec hypoperfusion persistante malgré volume et pression adéquats ; l’adrénaline seule est une autre option. Le rythme, la pression et le bénéfice de débit sont contrôlés.</li>
<li>L’hydrocortisone est suggérée dans le choc septique en 2026 ; 200 mg/jour, en 50 mg toutes les 6 heures ou en continu, est le régime décrit en 2021. Le repère de catécholamine de 2021 n’est pas repris comme seuil obligatoire en 2026. Solu-Cortef ne recommande pas l’emploi de routine dans sa notice suisse ; la glycémie, la natrémie, la kaliémie, les infections et la faiblesse musculaire sont surveillées.</li>
<li>La bêta-lactamine s’administre en entretien prolongé après une charge selon la recommandation forte de 2026. Pour pipéracilline/tazobactam, la notice Labatec décrit 30 minutes ; le protocole National Health Service Borders 2025 illustre séparément une charge de 4 g/0,5 g en 30 minutes puis chaque dose sur 4 heures, toutes les 6–8 heures si la fonction rénale est normale, avec avis spécialisé et exclusions. L’entretien suit la clairance et le protocole ; la limite de 50 mL de la notice concerne uniquement l’eau injectable.</li>
<li>Les PBP, les bêta-lactamases et leurs résistances déterminent l’activité ; MERINO ne soutient pas pipéracilline/tazobactam comme traitement définitif d’une bactériémie à Escherichia coli ou Klebsiella résistants à la ceftriaxone. Un carbapénème peut être nécessaire selon le risque de BLSE.</li>
<li>La vancomycine se réserve à une indication à Gram positif, notamment un risque justifié de SARM : charge suisse de 25–30 mg/kg chez le patient gravement malade, puis entretien individualisé par fonction rénale et concentrations sériques. Pour le SARM invasif, le consensus 2020 vise une AUC de 400–600 mg·h/L sous CMI de 1 mg/L. La gentamicine conventionnelle suisse est 3 mg/kg/jour en trois doses, jusqu’à 5 mg/kg/jour dans une infection vitale ; le régime européen urinaire de 6–7 mg/kg en dose quotidienne est distinct et exige son propre suivi.</li>
<li>Les vasopresseurs exposent à l’ischémie et aux arythmies ; l’argipressine peut favoriser l’hyponatrémie. Vancomycine, pipéracilline/tazobactam et aminosides associés accroissent les risques rénaux ; l’aminoside expose aussi à l’ototoxicité et ne se mélange pas à une bêta-lactamine.</li>
<li>En 2026, les suggestions défavorables concernent notamment terlipressine, lévosimendan, bêtabloquants comme traitement du choc, vitamine C intraveineuse, immunoglobulines, purification sanguine dont polymyxine B, vitamine D pour le sepsis, probiotiques et XueBiJing hors juridiction d’autorisation. Le bicarbonate n’est pas destiné à corriger l’hémodynamique de l’acidémie lactique ; l’exception suggérée associe pH ≤ 7,2 et insuffisance rénale aiguë de stade 2 ou 3 de la classification Acute Kidney Injury Network.</li>
<li>La réévaluation retire les couvertures inutiles et adapte la durée au foyer, au pathogène et au contrôle de source. La procalcitonine associée à la clinique peut aider à arrêter lorsque la durée reste incertaine ; elle ne déclenche pas seule le traitement.</li></ul></template>

<template data-pop="a41-vanco" data-title="Vancomycine : charge, exposition et toxicité"><p><b>Mécanisme et place.</b> La vancomycine inhibe la synthèse de la paroi des bactéries à Gram positif sensibles. Elle couvre notamment le SARM et ne remplace pas une couverture des bacilles à Gram négatif. L’information professionnelle suisse prévoit le traitement initial lorsqu’un germe résistant à la méticilline est suspecté, puis l’adaptation aux résultats de sensibilité.</p><p><b>Dose suisse.</b> Vancomycin Labatec i.v., Swissmedic 59766, mars 2026, fournit 500 mg ou 1 g de poudre. Chez le patient gravement malade, la charge est 25–30 mg/kg ; l’entretien usuel dès 12 ans est 15–20 mg/kg toutes les 8–12 heures, sans dépasser 2 g par dose d’entretien. Les doses suivantes suivent les concentrations et la fonction rénale ; la notice ne réduit pas la charge du patient très gravement malade pour la seule insuffisance rénale. L’obésité, une clairance changeante et l’épuration extrarénale exigent un calcul individualisé.</p><p><b>Administration.</b> La durée est d’au moins une heure et le débit ne dépasse pas 10 mg/min : la durée la plus longue est retenue. Pour 1 g, la limite de débit implique donc au moins 100 minutes. La notice prévoit au moins 100 mL pour 500 mg et 200 mL pour 1 g ; une restriction hydrique autorise des concentrations plus élevées avec davantage de réactions de perfusion, sans dépasser 10 mg/mL. La vancomycine orale n’assure pas le traitement systémique du sepsis.</p><p><b>Suivi et preuve.</b> La notice suisse retient comme paramètre prédictif le rapport entre l’aire sous la courbe et la CMI, avec une valeur cible de 400 établie in vitro, chez l’animal et de façon limitée chez l’homme. En pratique, elle guide la dose par les creux sériques : 10 à 20 mg/L selon le site et la sensibilité, 15 à 20 mg/L lorsque la CMI atteint 1 mg/L. Ces creux élevés majorent le risque rénal, en particulier avec pipéracilline/tazobactam.</p><p><b>Risques.</b> La fonction rénale, les concentrations, la tolérance de perfusion et les réactions cutanées sont surveillées. Une perfusion rapide peut provoquer rougeur et hypotension ; l’exposition excessive favorise l’atteinte rénale. Pipéracilline/tazobactam ou un aminoside associé augmente les risques. Une hypersensibilité connue au produit est une contre-indication ; les réactions cutanées graves imposent l’arrêt.</p><p><b>À retenir.</b> La charge est suivie d’un entretien individualisé ; un intervalle fixe sans suivi ne convient pas à une fonction rénale instable.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59766" target="_blank" rel="noopener">Vancomycin Labatec, mars 2026</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="a41-genta" data-title="Gentamicine : régimes et surveillance distincts"><p><b>Mécanisme et place.</b> La gentamicine est un aminoside bactéricide qui perturbe la synthèse protéique bactérienne. La notice suisse la réserve aux infections sévères sensibles lorsque des substances moins toxiques ne sont pas efficaces et recommande un avis spécialisé. Pour le sepsis, elle s’associe à un antibiotique approprié ; elle ne constitue pas une couverture complémentaire systématique de tous les patients.</p><p><b>Notice suisse.</b> Gentamicine Nardia, Swissmedic 70800, août 2024, fournit 80 mg/2 mL. Avec fonction rénale normale, le régime conventionnel adulte est 3 mg/kg/jour en trois doses toutes les 8 heures ; une infection menaçant la vie peut justifier jusqu’à 5 mg/kg/jour en trois ou quatre doses, puis retour à 3 mg/kg/jour dès que l’état le permet. La fonction rénale et les concentrations sériques déterminent l’ajustement et les intervalles.</p><p><b>Régime distinct.</b> Les recommandations européennes d’urologie 2026 proposent 6–7 mg/kg en une administration quotidienne dans certaines infections urinaires. Ce régime étendu ne provient pas de la notice Nardia et n’est pas un remplacement automatique du régime conventionnel. Le poids de calcul, la clairance, le moment des prélèvements et les cibles doivent suivre le protocole spécialisé choisi.</p><p><b>Surveillance.</b> Dans le régime conventionnel, la notice indique de ne pas dépasser des pics de 10–12 mg/L et une concentration résiduelle de 2 mg/L. Ces limites ne se transfèrent pas telles quelles à une dose unique étendue. La créatinine, la diurèse, les concentrations et les symptômes auditifs ou vestibulaires sont surveillés ; la toxicité auditive peut être irréversible. L’hypovolémie et les autres substances néphrotoxiques ou ototoxiques augmentent le risque.</p><p><b>Précautions et interactions.</b> La myasthénie est une contre-indication de la notice. L’association à des curares peut accentuer le bloc neuromusculaire ; vancomycine, autres aminosides et diurétiques de l’anse augmentent les risques de toxicité. La gentamicine ne se mélange pas à une bêta-lactamine dans la même solution. Pendant la grossesse, la notice réserve l’emploi aux indications vitales sans alternative en raison des risques fœtaux auditifs et rénaux.</p><p><b>À retenir.</b> Le choix du régime inclut son suivi : mélanger la dose d’un protocole et les seuils d’un autre crée une prescription incohérente.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=70800" target="_blank" rel="noopener">Gentamicine Nardia, août 2024</a> ; <a href="https://uroweb.org/guidelines/urological-infections/chapter/the-guideline" target="_blank" rel="noopener">recommandations européennes d’urologie 2026, tableaux d’antibiothérapie parentérale</a>. Consultées le 8 octobre 2026.</div></template>

<template data-pop="a41-dobutamine" data-title="Dobutamine : inotropie et limites"><p><b>Mécanisme.</b> La dobutamine exerce surtout un agonisme β₁ cardiaque, qui augmente la contractilité et le volume d’éjection. Ses effets β₂ et α plus faibles peuvent modifier les résistances ; une augmentation du débit ne garantit pas une augmentation de pression. Une tachycardie accroît aussi la demande myocardique en oxygène.</p><p><b>Place.</b> La Surviving Sepsis Campaign 2026 suggère de l’ajouter à la noradrénaline lorsque persiste une hypoperfusion avec dysfonction cardiaque malgré un volume et une pression adéquats (certitude très faible). Elle complète le vasopresseur si celui-ci reste nécessaire. Dobutrex possède une indication suisse comprenant le sepsis avec besoin de soutien inotrope : cet emploi ne doit pas être présenté globalement comme hors indication.</p><p><b>Dose suisse.</b> Dobutrex, Swissmedic 45687, juin 2023, contient 250 mg/50 mL, soit 5 mg/mL. La dose usuelle est 2,5–10 µg/kg/min ; des doses jusqu’à 40 µg/kg/min sont exceptionnellement nécessaires. La préparation pour perfusion doit suivre la dilution de la notice et le débit se calcule d’après la concentration réellement administrée.</p><p><b>Contre-indications et suivi.</b> L’hypovolémie non corrigée, les tachyarythmies réfractaires et un obstacle mécanique au remplissage ou à l’éjection sont des contre-indications. Dobutrex contient des sulfites et ne s’utilise pas en cas d’asthme ou d’hypersensibilité aux sulfites selon la notice. Le rythme, la pression, le débit et la perfusion sont surveillés ; une tachyarythmie, une hypotension ou l’absence de bénéfice conduit à réévaluer. Les bêtabloquants peuvent réduire l’effet inotrope ; la compatibilité de voie avec l’hydrocortisone succinate doit être vérifiée.</p><p><b>À retenir.</b> L’objectif est la correction d’une hypoperfusion par amélioration du débit, avec une tolérance mesurée.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=45687" target="_blank" rel="noopener">Dobutrex, juin 2023</a> ; Surviving Sepsis Campaign 2026, recommandations 60–61. Consultées le 8 octobre 2026.</div><div class="src">Prise en charge actualisée : <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-60" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, recommandation 60 : conditions de l’inotropie</a> ; <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-61" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, recommandation 61 : dobutamine ajoutée ou adrénaline seule</a>. Énoncés de la campagne conjointe ESICM, publiés le 23 mars 2026 dans <i>Intensive Care Medicine</i>, consultés le 8 octobre 2026. Les notices de présentation et d’administration citées ci-dessus conservent leur date et leur portée.</div></template>

<template data-pop="a41-adrenaline" data-title="Adrénaline : place et origine de la posologie"><p><b>Mécanisme et place.</b> L’adrénaline associe des effets adrénergiques vasculaires et cardiaques. Elle peut améliorer la pression et le débit, mais expose aux tachyarythmies et peut augmenter le lactate par stimulation métabolique. La Surviving Sepsis Campaign 2026 suggère son ajout si la pression reste insuffisante malgré noradrénaline et vasopressine ; en cas de dysfonction cardiaque avec hypoperfusion persistante, elle peut remplacer l’association noradrénaline–dobutamine. La certitude de ces recommandations est très faible.</p><p><b>Statut suisse et posologie.</b> Adrénaline Aguettant à 0,1 mg/mL est autorisée en Suisse pour la réanimation cardiopulmonaire et l’anaphylaxie aiguë de l’adulte ; Adrenalin Sintetica, Adrenalin Amino et Adrénaline Bichsel visent l’anaphylaxie, l’asthme ou la réanimation. Aucune de ces informations professionnelles ne fixe de posologie de perfusion pour le choc septique : c’est une lacune nommée, et le débit suit le protocole écrit de l’unité de soins intensifs. La notice suisse précise le mécanisme dose-dépendant : à faible dose, l’effet bêta augmente la contractilité et abaisse la résistance périphérique ; au-delà d’environ 5 µg/min, la stimulation alpha croissante élève la résistance vasculaire systémique.</p><p>La posologie de perfusion du choc septique doit donc être rattachée à un protocole institutionnel explicite. Les solutions de concentrations différentes ne sont jamais substituées sans recalcul du débit.</p><p><b>Surveillance.</b> La pression, le rythme, la perfusion et le point de perfusion sont suivis. Le lactate s’interprète avec les autres signes de perfusion, car sa hausse ne prouve pas à elle seule une aggravation du choc. Les médicaments potentialisant les catécholamines et le terrain cardiaque modifient le risque.</p><p><b>À retenir.</b> La place recommandée dans le sepsis et le statut d’une présentation nationale doivent être décrits séparément.</p><div class="src">Sources : Surviving Sepsis Campaign 2026, recommandations 57–61 ; Information professionnelle suisse Adrénaline Aguettant® 0,1 mg/mL (juin 2023), Adrenalin Sintetica®, Adrenalin Amino® et Adrénaline Bichsel®, Swissmedic (AIPS), consultées le 8 octobre 2026.</div><div class="src">Prise en charge actualisée : <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-58" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, recommandation 58 : vasopresseur si dysfonction cardiaque</a> ; <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-60" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, recommandation 60 : conditions de l’inotropie</a> ; <a href="https://www.sccm.org/clinical-resources/guidelines/guidelines/surviving-sepsis-campaign-international-guidelines-for-management-of-sepsis-and-septic-shock-2026#RecomGroup-61" target="_blank" rel="noopener" data-reference-source="1">Surviving Sepsis Campaign 2026, recommandation 61 : dobutamine ajoutée ou adrénaline seule</a>. Énoncés de la campagne conjointe ESICM, publiés le 23 mars 2026 dans <i>Intensive Care Medicine</i>, consultés le 8 octobre 2026. Les notices de présentation et d’administration citées ci-dessus conservent leur date et leur portée.</div></template>
