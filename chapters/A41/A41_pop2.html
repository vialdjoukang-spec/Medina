<template data-pop="a41-norad" data-title="Noradrénaline : monographie"><p><b>Mécanisme.</b> Agonisme surtout alpha-adrénergique, vasoconstriction artériolaire et restauration de la pression de perfusion ; effet cardiaque selon la dose et le terrain. Premier vasopresseur recommandé dans le choc septique par la Surviving Sepsis Campaign 2026.</p><p><b>Posologie source suisse.</b> Pour Noradrénaline Sintetica solution de perfusion 0,20 mg/mL, l’information professionnelle mentionne 8–12 µg/min au début pour un adulte de 70 kg puis titration en paliers de 0,05–0,1 µg/kg/min vers l’effet clinique (soit 3,5–7 µg/min pour 70 kg). Noradrénaline Sintetica est une solution prête à l’emploi, à ne pas diluer, disponible en plusieurs concentrations (0,06 ; 0,10 ; 0,12 et 0,20 mg/mL) : le débit en mL/h se calcule d’après la concentration inscrite sur la présentation utilisée. Pas de plafond généralisable sans contexte ; la monothérapie sous hypovolémie est contre-indiquée dans la présentation citée.</p><p><b>Effets et surveillance.</b> Tachyarythmie, hypertension, ischémie digitale ou viscérale, extravasation ; surveiller pression, perfusion des extrémités, rythme et site de perfusion. Une voie périphérique peut être utilisée temporairement sous surveillance pour ne pas différer le traitement, selon la Surviving Sepsis Campaign 2026.</p><p><b>Essais.</b> SEPSISPAM (2014 ; 776 patients en choc septique) : viser une pression artérielle moyenne de 80–85 mmHg plutôt que 65–70 mmHg n’a pas réduit la mortalité à 28 jours (36,6 % contre 34,0 %) et a augmenté la fibrillation atriale de novo (6,7 % contre 2,8 %) ; chez les patients hypertendus chroniques, la cible haute a réduit le doublement de la créatinine et le recours à l’épuration extrarénale. Essai 65 (<i>JAMA</i> 2020 ; patients d’au moins 65 ans en hypotension vasoplégique) : une cible de 60–65 mmHg a réduit l’exposition aux vasopresseurs sans différence significative de mortalité à 90 jours (41,0 % contre 43,8 %) ; il fonde la cible conditionnelle de 60–65 mmHg dès 65 ans.</p></template>
<template data-pop="a41-vaso" data-title="Argipressine : monographie"><p><b>Mécanisme.</b> Agit notamment sur le récepteur V1a de la vasopressine, situé sur le muscle lisse vasculaire, et augmente le tonus indépendamment des récepteurs adrénergiques. La Surviving Sepsis Campaign 2026 suggère son ajout si la noradrénaline doit être augmentée. La Surviving Sepsis Campaign 2021 suggérait déjà d’ajouter la vasopressine plutôt que d’augmenter la noradrénaline lorsque la pression artérielle moyenne reste insuffisante, et précisait qu’en pratique cet ajout intervient habituellement à une noradrénaline de 0,25–0,5 µg/kg/min (17,5–35 µg/min pour 70 kg).</p><p><b>Information suisse Empressin.</b> Début à 0,01 unité internationale/min, augmentation toutes les 15–20 minutes jusqu’à 0,03 unité internationale/min ; au-delà seulement dans un cadre d’urgence spécialisé. Perfusion continue après dilution de 40 unités internationales dans du chlorure de sodium à 0,9 % jusqu’à 50 mL (0,8 unité internationale/mL). Surveiller natrémie (hyponatrémie), ischémie des extrémités et atteinte viscérale ; ne pas la substituer à la noradrénaline de première intention. Grossesse : contractions utérines, élévation de la pression intra-utérine et baisse de la perfusion utérine possibles.</p><p><b>Essai.</b> VASST (2008 ; 778 patients en choc septique recevant au moins 5 µg/min de noradrénaline) : l’argipressine 0,01–0,03 unité internationale/min, comparée à un supplément de noradrénaline, tous deux ajoutés aux vasopresseurs en cours, n’a pas réduit la mortalité à 28 jours (35,4 % contre 39,3 % ; différence non significative). Le signal favorable observé dans la strate de choc moins sévère reste exploratoire ; les ischémies digitales sont restées rares (2,0 % contre 0,5 %, différence non significative).</p></template>
<template data-pop="a41-hydro" data-title="Hydrocortisone : rôle et limites"><p>Les glucocorticoïdes modulent l’inflammation et améliorent la réactivité vasculaire. La Surviving Sepsis Campaign 2026 <b>suggère</b> des corticostéroïdes par voie intraveineuse chez l’adulte avec choc septique, recommandation conditionnelle à faible certitude ; elle ne généralise pas cette indication au sepsis sans choc.</p><p>La Surviving Sepsis Campaign 2021 précisait un schéma usuel d’hydrocortisone à 200 mg/jour par voie intraveineuse (50 mg toutes les six heures ou perfusion continue). Elle suggérait de la débuter lorsque la noradrénaline ou l’adrénaline atteint au moins 0,25 µg/kg/min, au moins 4 heures après le début du vasopresseur. Les deux essais principaux, ADRENAL et APROCCHSS, ont étudié une durée de 7 jours. Surveiller glycémie et surinfection. Forme suisse : Solu-Cortef, hydrogénosuccinate sodique d’hydrocortisone, 100 mg de substance sèche avec 2 mL de solvant, pour la voie intraveineuse.</p><p><b>Essais.</b> ADRENAL (2018 ; 3 800 patients ventilés en choc septique) : hydrocortisone 200 mg/jour en perfusion continue pendant 7 jours, sans réduction de la mortalité à 90 jours (27,9 % contre 28,8 %), mais avec résolution plus rapide du choc (médiane 3 contre 4 jours) et ventilation plus courte. APROCCHSS (2018 ; 1 241 patients) : hydrocortisone 50 mg par voie intraveineuse toutes les 6 heures et fludrocortisone 50 µg par voie entérale une fois par jour pendant 7 jours, avec une mortalité à 90 jours réduite (43,0 % contre 49,1 %). Les différences de population, de gravité et l’ajout de fludrocortisone expliquent le caractère conditionnel de la recommandation.</p></template>
<template data-pop="a41-piptazo" data-title="Pipéracilline et tazobactam : monographie"><p><b>Mécanisme.</b> Pipéracilline inhibe la synthèse de paroi bactérienne ; tazobactam bloque certaines bêta-lactamases. Le spectre couvre de nombreux agents à Gram négatif et anaérobies, sans couvrir tous les mécanismes de résistance ; la microbiologie et le foyer décident.</p><p><b>Posologie selon l’information professionnelle suisse.</b> Forme Labatec 4 g/0,5 g en perfusion ; chez l’adulte, 2–4 g de pipéracilline 3 à 4 fois par jour selon indication, par exemple flacon de 4 g/0,5 g toutes les huit heures. Dose de charge, modalités de perfusion prolongée, adaptation de l’entretien selon filtration et sensibilité locale se décident avec pharmacie et infectiologie ; absence de durée universelle pour « le sepsis ».</p><p><b>Risque.</b> Hypersensibilité immédiate possible, diarrhée et dysfonction rénale ; documenter les traitements concomitants néphrotoxiques et désescalader après résultat. Une couverture empirique inappropriée d’une méningite par cette seule molécule serait une erreur.</p><p><b>Essais.</b> MERINO (2018 ; près de 380 patients en bactériémie à <i>Escherichia coli</i> ou <i>Klebsiella pneumoniae</i> résistants à la ceftriaxone) : la pipéracilline/tazobactam n’a pas démontré sa non-infériorité face au méropénem, avec une mortalité à 30 jours de 12,3 % contre 3,7 % ; elle ne convient pas au traitement définitif de ces bactériémies. BLING III (2024 ; 7 031 patients de soins intensifs en sepsis traités par pipéracilline/tazobactam ou méropénem) : la perfusion continue n’a pas réduit significativement la mortalité à 90 jours par rapport à la perfusion intermittente (24,9 % contre 26,8 %), mais a augmenté la guérison clinique (55,7 % contre 50,0 %) ; la recommandation de perfusion prolongée de la Surviving Sepsis Campaign 2026 repose sur l’ensemble des essais randomisés, dont celui-ci.</p></template>
<template data-pop="pareto-a41-def" data-title="Pareto — Définitions et codage"><p class="ratio" data-cover="a41-0,a41-1,a41-2"></p><ul><li>Sepsis : infection et nouvelle défaillance d’organe ; variation SOFA ≥ 2 en est le critère opérationnel.</li><li>Choc : vasopresseur pour pression moyenne ≥ 65 mmHg et lactate &gt; 2 mmol/L malgré remplissage adéquat.</li><li>A41 (CIM-10-GM 2024) ne recouvre ni A40 (sepsis à streptocoques) ni le code complémentaire R57.2 du choc septique ; le choc toxique relève de A48 ; R57.0 et R57.1 relèvent d’autres cours.</li><li>« Sepsis sévère » est redondant ; qSOFA n’est jamais l’outil unique de dépistage.</li><li>En Suisse, environ 20 000 séjours explicitement codés par an et près de 4 000 décès intrahospitaliers dans ces séjours (rapport 2025) : statistiques de séjours, non mortalité attribuable ; le codage sous-estime l’ensemble.</li></ul></template>
<template data-pop="pareto-a41-physio" data-title="Pareto — Physiopathologie"><p class="ratio" data-cover="a41-3,a41-4"></p><ul><li>Infection, réponse dérégulée, endothélium et microcirculation altérés, nouvelle défaillance d’organe.</li><li>Rééquilibrer perfusion sans aggraver la surcharge ; traiter l’agent et contrôler le foyer si nécessaire.</li><li>Le lactate est un indicateur physiologique contextualisé, jamais un test diagnostique isolé.</li><li>Remplissage, noradrénaline et contrôle du foyer : mécanismes distincts, aucun ne remplace les autres.</li><li>Contrôle du foyer idéalement dans les six heures ; couverture des multirésistants et anaérobies selon risques individuels, foyer et écologie locale.</li></ul></template>
<template data-pop="pareto-a41-diag" data-title="Pareto — Reconnaissance"><p class="ratio" data-cover="a41-5,a41-6,a41-7,a41-8"></p><ul><li>Défaillance nouvelle : hausse aiguë du score SOFA ≥ 2 points par rapport à l’état antérieur ; comparer cognition, respiration, circulation, rein, foie et coagulation.</li><li>Rechercher gravité et foyer simultanément ; pas de fièvre obligatoire ; interroger immunosuppression, dispositifs, antibiotiques récents et fonctions antérieures.</li><li>qSOFA : fréquence respiratoire ≥ 22/min, pression systolique ≤ 100 mmHg, altération mentale ; deux éléments signalent un risque accru, un résultat négatif n’exclut pas le sepsis.</li><li>Procalcitonine non utilisée pour décider du début des antibiotiques ; traiter sans attendre la confirmation chez un patient instable.</li><li>Hypotension, confusion, hypoxémie, marbrures ou oligurie : réanimation et traitement simultanés ; la perfusion se réévalue même quand la pression se corrige.</li></ul></template>
<template data-pop="pareto-a41-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="a41-9,a41-10,a41-11,a41-12"></p><ul><li>Hémocultures dès que possible, puis antibiotique immédiatement : dans l’heure en cas de choc ou de sepsis probable/certain.</li><li>Si seulement possible sans choc : investigation rapide, antibiotique dans les trois heures si suspicion persistante.</li><li>Cristalloïde de préférence équilibré, au moins 30 mL/kg dans les trois premières heures (suggestion ; poids ajusté ou idéal si indice de masse corporelle &gt; 30 kg/m²), avec réévaluation fréquente ; noradrénaline en première ligne, sans attendre la fin du remplissage si le choc est instable.</li><li>Pression artérielle moyenne cible 65 mmHg ; 60–65 mmHg dès 65 ans (suggestion).</li><li>Contrôle du foyer idéalement dans les six heures ; perfusion prolongée de bêta-lactamine après la dose de charge.</li><li>Choc persistant : vasopressine plutôt qu’escalade de noradrénaline, en pratique à 0,25–0,5 µg/kg/min ; adrénaline si la pression reste insuffisante ; dobutamine ou adrénaline seule si dysfonction cardiaque ; corticostéroïdes suggérés dans le choc septique seulement, hydrocortisone si noradrénaline ou adrénaline ≥ 0,25 µg/kg/min au moins 4 heures après le début du vasopresseur (seuils : Surviving Sepsis Campaign 2021).</li><li>Critères formels : SOFA ≥ 2 points ; choc septique = vasopresseur pour pression artérielle moyenne ≥ 65 mmHg et lactate &gt; 2 mmol/L malgré remplissage adéquat.</li><li>Réévaluer et désescalader, puis organiser suivi des séquelles.</li></ul></template>
<template data-pop="pareto-a41-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="a41-e-1,a41-e-2,a41-e-3,a41-e-4,a41-e-5"></p><ul><li>Il n’existe aucun examen isolé de référence du syndrome : défaillance aiguë attribuable à une infection, évaluation SOFA et clinique.</li><li>Prélever le sang et la source, rechercher un obstacle ou abcès qui impose un geste.</li><li>Lactate &gt; 2 mmol/L entre dans le choc formel seulement avec les autres critères ; suivre tendance et perfusion.</li><li>Références : microbiologie d’un site pertinent pour l’agent ; gazométrie artérielle pour l’oxygénation et le pH.</li><li>Valeurs normales de l’adulte : lactate de repos 0,5–2,0 mmol/L ; plaquettes 150–400 × 10⁹/L ; créatinine et bilirubine comparées à l’état antérieur.</li><li>Hémocultures idéalement avant l’antibiotique, sans retard dangereux ; une culture négative n’exclut pas le sepsis, une culture positive peut être une contamination.</li><li>Procalcitonine non recommandée pour décider du début des antibiotiques ; sepsis possible sans choc : antibiotique dans les trois heures si la suspicion persiste.</li></ul></template>
<template data-pop="pareto-a41-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="a41-s-1,a41-s-2,a41-s-3,a41-s-4"></p><ul><li>Une barrière rompue ou un foyer enclavé favorise l’infection ; un geste peut être nécessaire.</li><li>Inflammation et fuite endothéliale perturbent la microcirculation même si la pression est corrigée.</li><li>Le lactate traduit production et clairance ; la recherche d’une infection demeure clinique.</li><li>Pression artérielle moyenne : débit cardiaque et résistance vasculaire ; la noradrénaline restaure surtout le tonus artériolaire.</li><li>Inflammation et immunodépression coexistent : aucun test immunologique unique ne diagnostique le sepsis.</li></ul></template>
<template data-pop="pareto-a41-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="a41-p-1,a41-p-2,a41-p-3,a41-p-4"></p><ul><li>Antibiotique dirigé par foyer et risques individuels, puis désescalade ; pas de couverture systématique des multirésistants, des anaérobies ou des champignons.</li><li>Noradrénaline en premier (paliers de 0,05–0,1 µg/kg/min) ; argipressine 0,01 puis jusqu’à 0,03 unité internationale/min, ajoutée en pratique à 0,25–0,5 µg/kg/min de noradrénaline (Surviving Sepsis Campaign 2021) ; adrénaline 0,05–2 µg/kg/min si la pression reste insuffisante ; dobutamine 2,5–10 µg/kg/min, exceptionnellement jusqu’à 40, si dysfonction cardiaque.</li><li>Hydrocortisone suggérée dans le choc septique : 200 mg/jour, 50 mg toutes les 6 heures ou en continu, débutée si noradrénaline ou adrénaline ≥ 0,25 µg/kg/min au moins 4 heures après le début du vasopresseur (Surviving Sepsis Campaign 2021) ; durée étudiée de 7 jours (ADRENAL, APROCCHSS).</li><li>Après dose de charge, perfusion prolongée de bêta-lactamine pour l’entretien selon la Surviving Sepsis Campaign 2026 ; pipéracilline/tazobactam 4 g/0,5 g toutes les 8 heures, pas en traitement définitif d’une bactériémie à entérobactérie résistante à la ceftriaxone.</li><li>Débit de noradrénaline calculé d’après la concentration de la présentation ; adaptation rénale des antibiotiques ; allergie aux bêta-lactamines caractérisée ; contractions utérines possibles sous argipressine pendant la grossesse.</li><li>À éviter : vitamine C intraveineuse, immunoglobulines, purification sanguine, terlipressine, bêtabloquants comme traitement du choc.</li></ul></template>
