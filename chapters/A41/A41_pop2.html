<template data-pop="a41-norad" data-title="Noradrénaline : monographie"><p><b>Mécanisme.</b> Agonisme surtout alpha-adrénergique, vasoconstriction artériolaire et restauration de la pression de perfusion ; effet cardiaque selon la dose et le terrain. Premier vasopresseur recommandé dans le choc septique par la SSC 2026.</p><p><b>Posologie source suisse.</b> Pour Noradrénaline Sintetica solution de perfusion 0,20 mg/mL, l’information professionnelle mentionne 8–12 µg/min au début pour un adulte de 70 kg puis titration en paliers de 0,05–0,1 µg/kg/min vers l’effet clinique (soit 3,5–7 µg/min pour 70 kg). La concentration varie entre présentations ; vérifier dilution, pompe, voie d’accès et protocole local. Pas de plafond généralisable sans contexte ; la monothérapie sous hypovolémie est contre-indiquée dans la présentation citée.</p><p><b>Effets et surveillance.</b> Tachyarythmie, hypertension, ischémie digitale ou viscérale, extravasation ; surveiller pression, perfusion des extrémités, rythme et site de perfusion. Une voie périphérique peut être utilisée temporairement sous surveillance pour ne pas différer le traitement, selon SSC 2026.</p></template>
<template data-pop="a41-vaso" data-title="Argipressine : monographie"><p><b>Mécanisme.</b> Agit notamment sur le récepteur vasculaire V1 et augmente le tonus indépendamment des récepteurs adrénergiques. La SSC 2026 suggère son ajout si la noradrénaline doit être augmentée.</p><p><b>Information suisse Empressin.</b> Début à 0,01 unité internationale/min, augmentation toutes les 15–20 minutes jusqu’à 0,03 unité internationale/min ; au-delà seulement dans un cadre d’urgence spécialisé. Perfusion continue après préparation selon le produit. Vérifier indications, hyponatrémie, ischémie des extrémités et atteinte viscérale ; ne pas la substituer à la noradrénaline de première intention.</p></template>
<template data-pop="a41-hydro" data-title="Hydrocortisone : rôle et limites"><p>Les glucocorticoïdes modulent l’inflammation et améliorent la réactivité vasculaire. La SSC 2026 <b>suggère</b> des corticostéroïdes par voie intraveineuse chez l’adulte avec choc septique, recommandation conditionnelle à faible certitude ; elle ne généralise pas cette indication au sepsis sans choc.</p><p>La SSC 2021 précisait un schéma usuel d’hydrocortisone à 200 mg/jour par voie intraveineuse (50 mg toutes les six heures ou perfusion continue). Il s’agit ici d’une dose attribuée à ce texte de 2021 ; le document résumé de 2026 ne fixe pas dans son tableau une durée uniforme. Surveiller glycémie et surinfection ; vérifier la présentation suisse.</p></template>
<template data-pop="a41-piptazo" data-title="Pipéracilline et tazobactam : monographie"><p><b>Mécanisme.</b> Pipéracilline inhibe la synthèse de paroi bactérienne ; tazobactam bloque certaines bêta-lactamases. Le spectre couvre de nombreux agents à Gram négatif et anaérobies, sans couvrir tous les mécanismes de résistance ; la microbiologie et le foyer décident.</p><p><b>Posologie illustrative suisse.</b> Forme Labatec 4 g/0,5 g en perfusion ; chez l’adulte, 2–4 g de pipéracilline 3 à 4 fois par jour selon indication, par exemple flacon de 4 g/0,5 g toutes les huit heures. Dose de charge, modalités de perfusion prolongée, adaptation de l’entretien selon filtration et sensibilité locale se décident avec pharmacie et infectiologie ; absence de durée universelle pour « le sepsis ».</p><p><b>Risque.</b> Hypersensibilité immédiate possible, diarrhée et dysfonction rénale ; documenter les traitements concomitants néphrotoxiques et désescalader après résultat. Une couverture empirique inappropriée d’une méningite par cette seule molécule serait une erreur.</p></template>
<template data-pop="pareto-a41-def" data-title="Pareto — Définitions et codage"><p class="ratio" data-cover="a41-0,a41-1,a41-2"></p><ul><li>Sepsis : infection et nouvelle défaillance d’organe ; variation SOFA ≥ 2 en est le critère opérationnel.</li><li>Choc : vasopresseur pour pression moyenne ≥ 65 mmHg et lactate &gt; 2 mmol/L malgré remplissage adéquat.</li><li>A41 ne recouvre pas à lui seul le sepsis streptococcique A40 ou le code additionnel de choc R57.2.</li><li>En Suisse, environ 20 000 séjours explicitement codés par an dans le rapport 2025 ; le codage sous-estime l’ensemble.</li></ul></template>
<template data-pop="pareto-a41-physio" data-title="Pareto — Physiopathologie"><p class="ratio" data-cover="a41-3,a41-4"></p><ul><li>Infection, réponse dérégulée, endothélium et microcirculation altérés, nouvelle défaillance d’organe.</li><li>Rééquilibrer perfusion sans aggraver la surcharge ; traiter l’agent et contrôler le foyer si nécessaire.</li><li>Le lactate est un indicateur physiologique contextualisé, jamais un test diagnostique isolé.</li></ul></template>
<template data-pop="pareto-a41-diag" data-title="Pareto — Reconnaissance"><p class="ratio" data-cover="a41-5,a41-6,a41-7,a41-8"></p><ul><li>Comparer cognition, respiration, circulation, rein, foie et coagulation aux valeurs antérieures.</li><li>Rechercher gravité et foyer simultanément ; pas de fièvre obligatoire.</li><li>qSOFA isolé négatif ne permet pas d’exclure ; traiter sans attendre la confirmation chez un patient instable.</li></ul></template>
<template data-pop="pareto-a41-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="a41-9,a41-10,a41-11,a41-12"></p><ul><li>Hémocultures dès que possible, puis antibiotique immédiatement : dans l’heure en cas de choc ou de sepsis probable/certain.</li><li>Si seulement possible sans choc : investigation rapide, antibiotique dans les trois heures si suspicion persistante.</li><li>Cristalloïdes avec réévaluation fréquente ; noradrénaline en première ligne ; contrôler rapidement un foyer nécessitant un geste.</li><li>Réévaluer et désescalader, puis organiser suivi des séquelles.</li></ul></template>
<template data-pop="pareto-a41-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="a41-e-1,a41-e-2,a41-e-3,a41-e-4,a41-e-5"></p><ul><li>Il n’existe aucun examen isolé de référence du syndrome : défaillance aiguë attribuable à une infection, évaluation SOFA et clinique.</li><li>Prélever le sang et la source, rechercher un obstacle ou abcès qui impose un geste.</li><li>Lactate > 2 mmol/L entre dans le choc formel seulement avec les autres critères ; suivre tendance et perfusion.</li></ul></template>
<template data-pop="pareto-a41-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="a41-3,a41-e-3"></p><ul><li>Une barrière rompue ou un foyer enclavé favorise l’infection ; un geste peut être nécessaire.</li><li>Inflammation et fuite endothéliale perturbent la microcirculation même si la pression est corrigée.</li><li>Le lactate traduit production et clairance ; la recherche d’une infection demeure clinique.</li></ul></template>
<template data-pop="pareto-a41-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="a41-p-1,a41-p-2,a41-p-3,a41-p-4"></p><ul><li>Antibiotique dirigé par foyer et risques individuels, puis désescalade.</li><li>Noradrénaline en premier, vasopressine si escalade, hydrocortisone suggérée en choc.</li><li>Après dose de charge, perfusion prolongée de bêta-lactamine pour l’entretien selon SSC 2026.</li><li>Vérifier concentration, fonction rénale, allergies, écologie locale et source suisse avant prescription.</li></ul></template>
