<div class="chap-head"><div class="code">A41 · Autres sepsis · CIM-10-GM 2024 · Microorganismes, hôte et sites infectieux</div><h1>Sepsis et choc septique de l’adulte</h1><span class="status">Édition clinique du 26 septembre 2026 · Sepsis-3 (2016) · Surviving Sepsis Campaign (2026) · revue humaine indépendante requise</span></div>

<section class="ilot" id="a41-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une patiente de 71 ans, traitée par immunosuppresseur, consulte pour frissons et brûlures mictionnelles. Elle devient confuse ; sa pression artérielle est de 82/46 mmHg et sa fréquence respiratoire de 28 par minute. La question est immédiate : <b>s’agit-il d’une infection accompagnée d’une nouvelle défaillance d’organe, et comment traiter tout en identifiant le foyer ?</b></p><p>À l’issue du cours, identifier la défaillance d’organe, distinguer infection, sepsis et choc septique ; prélever sans retarder un traitement urgent ; choisir les premières mesures de réanimation, la recherche du foyer et la réévaluation des antibiotiques. Les médicaments et gestes spécialisés s’inscrivent dans la prise en charge hospitalière et les protocoles locaux.</p><div class="key"><b>Prérequis.</b> Comprendre la <button class="w" data-k="a41-perfusion">perfusion tissulaire (débit et extraction)</button>, le <button class="w" data-k="a41-lactate">lactate (production et élimination)</button> et le <button class="w" data-k="a41-sofa">score de défaillance d’organe (six fonctions)</button>.</div></section>
<section class="ilot" id="a41-1"><h2><span class="n">1</span>Définition, gravité et périmètre de codage</h2><p>Selon le consensus <button class="w" data-k="a41-sepsis3">Sepsis-3 (définition et critères de 2016)</button>, le sepsis est une <b>défaillance d’organe menaçant la vie</b> due à une réponse dérégulée à une infection. Une augmentation aiguë d’au moins <b>2 points</b> du score <button class="w" data-k="a41-sofa">SOFA (six défaillances d’organe)</button> représente opérationnellement cette atteinte. L’infection peut être présumée à la présentation ; la décision thérapeutique précède souvent la confirmation microbiologique. Une bactériémie isolée n’est pas synonyme de sepsis ; inversement des hémocultures négatives n’excluent pas le sepsis.</p><p>Le <b>choc septique</b> est le sous-ensemble avec vasopresseur nécessaire pour maintenir la pression artérielle moyenne au moins à <b>65 mmHg</b> <em>et</em> lactate sanguin <b>&gt; 2 mmol/L</b>, <em>malgré une réanimation volémique adéquate et en l’absence d’hypovolémie</em>. Il faut distinguer ce critère formel d’une hypotension infectieuse qui exige déjà un traitement sans attendre le résultat du lactate. La recommandation de prise en charge est celle de la <button class="w" data-k="a41-ssc">Surviving Sepsis Campaign 2026 (adultes hospitalisés)</button>.</p><div class="trap"><span class="k">Piège</span>Fièvre et tachycardie ne constituent pas le diagnostic. « Sepsis sévère » est un terme redondant selon Sepsis-3. Le score rapide qSOFA peut signaler un risque, mais la recommandation de 2026 déconseille son emploi comme <b>unique</b> outil de dépistage à l’hôpital.</div><p>La catégorie <b>A41</b> désigne dans la CIM-10-GM 2024 les « autres sepsis » et les sepsis d’agent non précisé. Le cours traite <em>cliniquement</em> le syndrome général ; son périmètre de codage se limite à la catégorie A41, et sa seule existence ne permet pas de revendiquer un autre code. La catégorie <b>A40</b> (sepsis à streptocoques) et le code complémentaire <b>R57.2</b> (choc septique, ajouté au code du sepsis lorsque le choc est documenté) ne sont pas développés dans ce cours. Le syndrome de choc toxique, y compris d’origine streptococcique, n’appartient pas à A40 : la classification le range dans la catégorie A48 (autres maladies bactériennes, non classées ailleurs), avec un code complémentaire désignant l’agent. Les codes <b>R57.0</b> (choc cardiogénique) et <b>R57.1</b> (choc hypovolémique) relèvent d’autres cours. Les sepsis à agent spécifique ou associés à la grossesse, au nouveau-né et aux actes relèvent de règles propres. Ne coder qu’après documentation de la cause et selon les règles suisses en vigueur.</p></section>
<section class="ilot" id="a41-2"><h2><span class="n">2</span>Épidémiologie et pronostic en Suisse</h2><p>Le <button class="w" data-k="a41-swiss-report">Swiss Sepsis Report 2025 (données hospitalières 2019–2023)</button> dénombre chaque année environ <b>20 000 séjours hospitaliers explicitement codés sepsis</b> en Suisse, comprenant 500 à 600 séjours d’enfants, et près de <b>4 000 décès intrahospitaliers</b> chez les patients concernés. Il s’agit de séjours et de décès durant une hospitalisation avec code sepsis, et non d’une mesure directe de toutes les infections ni d’une mortalité attribuable prouvée au sepsis.</p><p>Un repérage plus large par infection accompagnée de défaillance d’organe donne un nombre pouvant atteindre quatre fois celui du codage explicite : l’écart dépend des définitions et de la qualité des données. Chez un survivant, rechercher les limitations cognitives, physiques et psychiques et programmer une transition de soins individualisée.</p><div class="trap"><span class="k">Erreur fréquente</span>Transformer « 20 000 séjours codés » en « 20 000 nouveaux cas prouvés » ou « 4 000 décès causés exclusivement par le sepsis » efface les limites méthodologiques du rapport.</div><button class="pareto-btn ui" data-k="pareto-a41-def">▲ Loi de Pareto — Définitions et codage</button></section>
<section class="ilot" id="a41-3"><h2><span class="n">3</span>Physiopathologie : de l’infection à la défaillance</h2><p>À l’état normal, l’endothélium règle le tonus vasculaire et la perméabilité capillaire ; les macrophages reconnaissent les agents infectieux et déclenchent une réponse immunitaire localisée. Une infection invasive ou une réponse de l’hôte mal régulée active fortement les cellules immunitaires, l’endothélium et la coagulation. Il en résulte <button class="w" data-k="a41-endo">vasoplégie et fuite endothéliale (hypotension et œdèmes)</button>, microthrombi et perturbation de l’utilisation cellulaire de l’oxygène.</p><p>La pression de perfusion baisse ; la peau peut devenir marbrée, l’encéphale confus et le rein oligurique. Une élévation du <button class="w" data-k="a41-lactate">lactate (mécanismes et limites)</button> suggère un déséquilibre physiologique, mais peut aussi refléter une stimulation adrénergique ou une réduction de la clairance hépatique. Le lactate seul n’identifie ni l’agent ni le mécanisme de choc. L’excès de solutés après la phase initiale accentue parfois l’œdème pulmonaire et tissulaire.</p><figure><svg viewBox="0 0 600 150" role="img" aria-label="Chaîne physiopathologique du sepsis"><g fill="none" stroke="#222" stroke-width="1.5"><rect x="10" y="38" width="130" height="54" rx="5"/><rect x="165" y="38" width="125" height="54" rx="5"/><rect x="315" y="38" width="122" height="54" rx="5"/><rect x="462" y="38" width="128" height="54" rx="5"/><path d="M140 65h25m125 0h25m122 0h25"/></g><g fill="#222" font-family="Georgia,serif" text-anchor="middle" font-size="13"><text x="75" y="60">Infection</text><text x="75" y="78">suspectée</text><text x="228" y="57">Réponse</text><text x="228" y="75">dérégulée</text><text x="376" y="57">Microcirculation</text><text x="376" y="75">altérée</text><text x="526" y="57">Défaillance</text><text x="526" y="75">d’organe</text><text x="300" y="128">Traiter le foyer, restaurer la perfusion, soutenir les organes</text></g></svg><figcaption>Figure 1 — Enchaînement clinique schématique ; une seule anomalie biologique ne suffit pas à diagnostiquer le syndrome.</figcaption></figure><div class="key"><b>Corrélation mécanisme → traitement.</b> Le remplissage corrige une composante d’hypovolémie relative ; la noradrénaline restaure le tonus vasculaire ; le contrôle du foyer supprime une source persistante d’inflammation. Aucune de ces mesures ne remplace les autres.</div></section>
<section class="ilot" id="a41-4"><h2><span class="n">4</span>Sources, agents et facteurs de risque</h2><p>Le foyer guide les prélèvements, l’antibiothérapie et le contrôle anatomique : poumon, voies urinaires, abdomen et voies biliaires, peau ou tissus mous, cathéter ou dispositif, système nerveux central. La présence d’un foyer ne dispense pas de vérifier les autres si l’évolution est discordante.</p><div class="two"><div class="card"><h4>Terrain et acquisition</h4><p>Documenter âge, fragilité, immunodépression, asplénie, grossesse, diabète, atteinte rénale ou hépatique, exposition à des soins récents et dispositif invasif. L’antibiothérapie récente et une colonisation connue modifient la probabilité de résistance.</p></div><div class="card"><h4>Signes de contrôle du foyer</h4><p>Une obstruction urinaire infectée peut nécessiter un drainage ; un abcès une évacuation ; un cathéter infecté un retrait raisonné ; une infection nécrosante une exploration chirurgicale immédiate. La Surviving Sepsis Campaign 2026 suggère le contrôle du foyer idéalement dans les six heures après identification d’une indication.</p></div></div><div class="trap"><span class="k">Piège</span>La couverture de bactéries multirésistantes et d’anaérobies n’est pas universelle : la Surviving Sepsis Campaign 2026 recommande de la relier aux risques individuels, au foyer et à l’écologie locale.</div><button class="pareto-btn ui" data-k="pareto-a41-physio">▲ Loi de Pareto — Physiopathologie</button></section>
<section class="ilot" id="a41-5"><h2><span class="n">5</span>Anamnèse orientée vers le foyer et la nouvelle défaillance</h2><h3>5.1 Antécédents pertinents et médicaments</h3><div class="two"><div class="card"><h4>Immunité, portes d’entrée et antécédents infectieux</h4><ul><li><button class="w" data-k="a41-atcd-immune">Immunosuppression (traitements, durée, neutropénie)</button></li><li><button class="w" data-k="a41-atcd-device">Dispositif ou intervention récente (porte d’entrée)</button></li><li>Infection ou colonisation antérieure documentée, antibiotiques récents.</li></ul></div><div class="card"><h4>Fonctions d’organe, allergies et expositions</h4><ul><li><button class="w" data-k="a41-atcd-organ">Fonction rénale, hépatique et cardiaque antérieure (comparaison)</button></li><li>Allergies médicamenteuses : substance, délai, manifestation et gravité.</li><li>Vaccinations, splénectomie et exposition de voyage selon le contexte.</li></ul></div></div><h3>5.2 Symptômes de la maladie actuelle</h3><p>Décrire le début des symptômes, la source plausible et sa chronologie ; interroger successivement les voies respiratoires, urinaires, digestives, la peau et les dispositifs. Rechercher explicitement <button class="w" data-k="a41-sympt-conf">confusion nouvelle (début et état antérieur)</button>, <button class="w" data-k="a41-sympt-dysp">dyspnée (hypoxémie et travail respiratoire)</button>, faiblesse intense, oligurie, marbrures rapportées ou malaise. Frissons et fièvre peuvent manquer chez une personne âgée ou immunodéprimée.</p><div class="two"><div class="card"><h4>Présentation typique</h4><p>Dysurie et frissons suivis d’une hypotension, d’une confusion et d’une augmentation aiguë de la créatinine : rechercher une infection urinaire haute et une éventuelle obstruction.</p></div><div class="card"><h4>Présentation trompeuse</h4><p>Chute et confusion sans fièvre chez une personne âgée ; aucun foyer évident à l’arrivée. La recherche clinique et les prélèvements n’attendent pas une température élevée.</p></div></div></section>
<section class="ilot" id="a41-6"><h2><span class="n">6</span>Examen clinique : perfusion, organes, foyer</h2><p>Observer immédiatement conscience, détresse respiratoire, coloration cutanée et température périphérique ; mesurer à plusieurs reprises pression artérielle, fréquence cardiaque, fréquence respiratoire, saturation et température. Documenter poids réel et estimation prudente du poids de référence, bilan hydrique et diurèse. L’objectif est de reconnaître la défaillance, puis de trouver le foyer en parallèle du traitement.</p><div class="two"><div class="card"><h4>Signes fonctionnels à explorer</h4><ul><li><button class="w" data-k="a41-sympt-conf">Confusion (état antérieur et glycémie)</button>.</li><li><button class="w" data-k="a41-sympt-dysp">Dyspnée (apparition, saturation, effort respiratoire)</button>.</li><li>Oligurie : comparer à la diurèse habituelle et mesurer.</li><li>Douleur localisée : thorax, flanc, abdomen, tête ou membre.</li></ul></div><div class="card"><h4>Signes physiques ciblés</h4><ul><li><button class="w" data-k="a41-sign-perfusion">Recoloration capillaire et marbrures (technique et limites)</button>.</li><li><button class="w" data-k="a41-sign-rr">Fréquence respiratoire (comptage complet)</button> et utilisation des muscles accessoires.</li><li><button class="w" data-k="a41-sign-focal">Inspection ciblée (foyer et drainage)</button>.</li><li>Examen cardio-pulmonaire avant et après les solutés ; signes d’œdème pulmonaire.</li></ul></div></div><div class="alert"><b>Évaluation initiale urgente.</b> Hypotension soutenue, trouble de conscience, hypoxémie, marbrures extensives, travail respiratoire majeur ou oligurie : appel de l’équipe de réanimation et traitement simultané du choc et de la cause.</div></section>
