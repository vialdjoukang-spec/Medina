<template data-pop="r27-labo" data-title="Bilan biologique : quoi doser, comment lire">
<div class="lab">Application</div><p>Si l’IRM ne conclut pas : bilan de routine, vitamines B1, B12 et E, holotranscobalamine, acide méthylmalonique, transferrine désialylée (CDT), sérologies de l’infection par le virus de l’immunodéficience humaine et de la syphilis, fonction thyroïdienne, anticorps antithyroïdiens, anticorps antineuronaux dont l’anti-GAD. Au premier recours : TSH, vitamine B12 et folates avec homocystéine, sérologie cœliaque.</p>
<div class="lab">Interprétation</div><p>Alpha-fœtoprotéine augmentée : ataxie-télangiectasie, ataxie avec apraxie oculomotrice de type 2. Albumine diminuée : type 1. Cholestérol diminué : abêtalipoprotéinémie, type 1. Cholestanol augmenté : xanthomatose cérébrotendineuse. Transferrine désialylée augmentée : dégénérescence alcoolique. Holotranscobalamine diminuée avec acide méthylmalonique augmenté : carence en B12. Lactate augmenté : maladies mitochondriales. Acide phytanique augmenté : Refsum. Oxystérols augmentés : Niemann-Pick de type C. Vitamine E diminuée : abêtalipoprotéinémie, déficit en vitamine E.</p>
<div class="lab">Piège</div><p>La vitamine E se dose ajustée aux lipides : la valeur libre est trompeuse.</p>
<div class="lab">Limite</div><p>Les valeurs normales chiffrées des vitamines et marqueurs n’ont pas été trouvées dans les sources lues (lacune assumée).</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a>.</p></template>
<template data-pop="r27-genetique" data-title="Stratégie génétique et conseil">
<div class="lab">Application</div><p>On teste d’abord les expansions répétées les plus fréquentes, puis un panel de séquençage de l’ataxie (standard minimal) ; l’exome ou le génome sont plus rentables. Si le résultat est négatif, la réanalyse se fait tous les deux ans. Le génome détecte en principe les expansions, mais sa certification manque encore.</p>
<div class="lab">Principe</div><p>La recherche d’une cause acquise ne peut être omise qu’en présence d’une preuve indiscutable de cause génétique. Une consanguinité ou un frère ou une sœur atteint(e) sans parent atteint rend une forme récessive très probable.</p>
<div class="lab">Piège</div><p>L’anamnèse familiale négative n’exclut pas une cause génétique ; une absence de mutation ne l’exclut pas non plus (33 à 92 % des familles dominantes restent sans diagnostic).</p>
<div class="lab">Conseil</div><p>Le conseil génétique précède le test et en examine les implications pour la famille et la reproduction. Un test prédictif est possible si une ataxie spinocérébelleuse familiale est connue.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a> ; <a href="https://doi.org/10.1159/000358801" data-reference-source="1" target="_blank" rel="noopener">Ruano et al., Neuroepidemiology 2014 (résumé)</a>.</p></template>
<template data-pop="r27-wernicke" data-title="Encéphalopathie de Wernicke : critères et thiamine">
<div class="lab">Définition</div><p>Critères de l’EFNS (2010) : au moins deux des quatre signes suivants : carence alimentaire, signes oculaires, dysfonction cérébelleuse, altération mentale ou trouble mnésique léger.</p>
<div class="lab">Application</div><p>Dosage de la thiamine, puis thiamine 200 mg 3 fois par jour, de préférence par voie intraveineuse, avant tout glucide. La thiamine parentérale est donnée à tout sujet à risque aux urgences. Le suivi de la thiamine se prolonge au moins six mois après une chirurgie bariatrique.</p>
<div class="lab">Piège</div><p>L’information professionnelle suisse de Benerva® (avril 2019) mentionne jusqu’à 200 mg/jour par voie parentérale (intramusculaire ou intraveineuse lente) dans l’encéphalopathie de Wernicke, avec voie intraveineuse réservée au patient hospitalisé en raison de réactions anaphylactoïdes. La recommandation spécialisée est plus élevée que le maximum de la fiche suisse : les deux sont présentées, sans trancher au-delà du dossier.</p>
<div class="lab">Limite</div><p>Seul le résumé de l’EFNS a été lu (le texte intégral a été refusé, code d’erreur 403) ; recommandation ancienne.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03153.x" data-reference-source="1" target="_blank" rel="noopener">EFNS 2010, encéphalopathie de Wernicke (résumé)</a> ; Information professionnelle Swissmedic Benerva® (AIPS, via tools/swissmedic_fi.py), mise à jour avril 2019.</p></template>
<template data-pop="r27-enfant" data-title="Ataxie aiguë de l’enfant">
<div class="lab">Définition</div><p>Étude multicentrique italienne de 509 enfants de 1 à 18 ans dans 11 urgences pédiatriques : l’ataxie aiguë représente 0,021 % des consultations, l’âge moyen est de 5,8 ans. Causes : post-infectieuse 33,6 %, tumeurs cérébrales 11,2 %, migraine et apparentés 9 %.</p>
<div class="lab">Application</div><p>Signes d’alerte : signes méningés, signes focaux, hyporéflexie, ophtalmoplégie, durée croissante (rapport de cotes de 3 à 7,7 selon le signe ; +51 % par jour de durée) : imagerie et avis spécialisé. Un antécédent de varicelle est associé à un moindre risque de pathologie urgente (rapport de cotes 0,1). L’ataxie cérébelleuse post-infectieuse est de bon pronostic. L’opsoclonus-myoclonus de l’enfant est souvent paranéoplasique (neuroblastome).</p>
<div class="lab">Limite</div><p>Étude rétrospective lue au résumé ; la ligne directrice ne traite que l’adulte ; l’ataxie chronique de l’enfant n’est pas couverte.</p>
<p class="src">Références : <a href="https://doi.org/10.1136/archdischild-2018-315487" data-reference-source="1" target="_blank" rel="noopener">Garone et al., Arch Dis Child 2019 (résumé)</a> ; <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a>.</p></template>
<template data-pop="r27-rehab" data-title="Rééducation de l’ataxie">
<div class="lab">Application</div><p>Physiothérapie de coordination, ergothérapie, logopédie, exercices quotidiens à domicile et séjours de neuroréhabilitation. Un entraînement intensif de quatre semaines a donné un bénéfice d’au moins un an chez 16 patients. Les « exergames » (jeux vidéo thérapeutiques) et les moyens auxiliaires (déambulateur, fauteuil roulant) complètent le plan.</p>
<div class="lab">Limite</div><p>Preuves modérées dans deux revues systématiques (ligne directrice) ; aucun médicament n’améliore l’ataxie indépendamment de la cause.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a>.</p></template>
<template data-pop="r27-gluten" data-title="Ataxie au gluten">
<div class="lab">Application</div><p>Examens : IgA anti-transglutaminase tissulaire (anti-gliadine déamidée si déficit en IgA), anti-gliadine, anti-transglutaminase de type 6, biopsie duodénale. La moitié seulement des ataxies au gluten s’accompagnent d’une entéropathie. Traitement : régime sans gluten ; anticorps tous les 6 mois ; stabilisation parfois après un an.</p>
<div class="lab">Limite</div><p>Elle représente 25 % des cas sporadiques dans la série de Sheffield, une proportion nettement plus faible ailleurs.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a>.</p></template>
<template data-pop="r27-rares" data-title="Causes métaboliques rares et traitables">
<div class="lab">Application</div><p>Déficit en vitamine E (AVED) : vitamine E 800 à 2000 mg/jour. Abêtalipoprotéinémie : régime pauvre en graisses, vitamine E 50 mg/kg/jour, vitamine A. Maladie de Refsum : régime pauvre en acide phytanique, lipaphérèse. Xanthomatose cérébrotendineuse : acide chénodésoxycholique 3 × 250 mg/jour. Niemann-Pick de type C : miglustat 3 × 200 mg/jour. Ataxie liée à COQ8A : coenzyme Q10 20 à 30 mg/kg/jour. Ataxie liée à POLG : éviter le valproate et le propofol.</p>
<div class="lab">Limite</div><p>Doses de la ligne directrice (§6.6) ; non vérifiées dans les informations professionnelles suisses.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a>.</p></template>
<template data-pop="r27-thiamine" data-title="Thiamine (Benerva®) : monographie">
<div class="lab">Posologie</div><p>Information professionnelle suisse (avril 2019), adulte et adolescent dès 12 ans : 100 mg/jour par voie orale si la carence est modérée ; 200 à 300 mg/jour si elle est sévère ; par voie parentérale jusqu’à 200 mg/jour (intramusculaire ou intraveineuse lente) dans l’encéphalopathie de Wernicke. Dégénérescence alcoolique (ligne directrice) : 3 × 100 mg par voie intraveineuse au moins une semaine, puis par voie orale.</p>
<div class="lab">Précautions</div><p>La voie intraveineuse est réservée au patient hospitalisé (réactions anaphylactoïdes). Benerva® n’a pas été étudié chez l’enfant.</p>
<div class="lab">Preuves</div><p>EFNS 2010 pour l’encéphalopathie de Wernicke (lu au résumé) ; ligne directrice 2024 pour la dégénérescence alcoolique.</p>
<div class="lab">Limite</div><p>Mécanisme d’action, contre-indications et interactions détaillés non repris dans le dossier de recherche.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03153.x" data-reference-source="1" target="_blank" rel="noopener">EFNS 2010, encéphalopathie de Wernicke (résumé)</a> ; <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; Information professionnelle Swissmedic Benerva® (AIPS, via tools/swissmedic_fi.py), mise à jour avril 2019.</p></template>
<template data-pop="r27-b12" data-title="Hydroxocobalamine (Vitarubine® Dépôt) : monographie">
<div class="lab">Posologie</div><p>1000 µg par voie intramusculaire 2 à 3 fois par semaine en phase aiguë, puis 1000 µg tous les 2 à 3 mois (information professionnelle, juillet 2025).</p>
<div class="lab">Application</div><p>La carence en B12 se reconnaît par une holotranscobalamine basse et un acide méthylmalonique élevé. Un trouble de la marche présent depuis plus de deux ans n’est pas toujours réversible.</p>
<div class="lab">Limite</div><p>Effets indésirables et contre-indications non repris dans le dossier.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; Information professionnelle Swissmedic Vitarubine® Dépôt (AIPS, via tools/swissmedic_fi.py), mise à jour juillet 2025.</p></template>
<template data-pop="r27-skyclarys" data-title="Omavéloxolone (Skyclarys®) : monographie">
<div class="lab">Statut</div><p>Autorisée par Swissmedic le 24 septembre 2024, médicament orphelin, procédure de l’article 13 de la loi sur les produits thérapeutiques, dès 16 ans (information professionnelle de mars 2026).</p>
<div class="lab">Posologie</div><p>150 mg (3 gélules) une fois par jour. Avec un inhibiteur puissant de CYP3A4 : à éviter, sinon 50 mg ; inhibiteur modéré : 100 mg ; inducteurs : à éviter ; pamplemousse à éviter. Child-Pugh B : 100 mg ; Child-Pugh C : à éviter.</p>
<div class="lab">Preuves</div><p>Étude 1 : mFARS −2,41 (intervalle de confiance à 95 % −4,32 à −0,51) à 48 semaines contre placebo.</p>
<div class="lab">Surveillance</div><p>ALAT, ASAT, bilirubine, BNP et lipides avant et pendant le traitement ; transaminases mensuelles pendant 3 mois ; arrêt si supérieures à 5 fois la limite supérieure de la norme, ou à 3 fois avec signe d’atteinte hépatique.</p>
<div class="lab">Effets indésirables</div><p>Fréquents : augmentation de l’ALAT et céphalées (37,3 %), perte de poids (34 %), nausées (33,3 %). Grossesse contre-indiquée ; contraception jusqu’à 28 jours après l’arrêt. Peut altérer l’aptitude à la conduite (fatigue).</p>
<div class="lab">Limite</div><p>Le mécanisme d’action n’est pas repris dans le dossier. Le remboursement n’a pas été vérifié.</p>
<p class="src">Références : <a href="https://www.swissmedic.ch/swissmedic/en/home/about-us/publications/public-summary-swiss-par/public-summary-swiss-par-skyclarys.html" data-reference-source="1" target="_blank" rel="noopener">Swissmedic, Summary report Skyclarys®, 2024</a> ; Information professionnelle Swissmedic Skyclarys® (AIPS, via tools/swissmedic_fi.py), mise à jour mars 2026.</p></template>
<template data-pop="r27-acetazolamide" data-title="Acétazolamide (Diamox®) : monographie">
<div class="lab">Statut</div><p>L’information professionnelle suisse (juillet 2026) ne contient pas l’ataxie épisodique parmi ses indications : l’usage est hors étiquette. La ligne directrice la recommande en premier choix dans l’ataxie épisodique de type 2.</p>
<div class="lab">Posologie</div><p>Ligne directrice : 125 mg/jour puis 500 à 1000 mg/jour, avec du potassium.</p>
<div class="lab">Contre-indications</div><p>Hyponatrémie, hypokaliémie, atteinte rénale ou hépatique grave, insuffisance surrénalienne, acidose hyperchlorémique, allergie aux sulfamides. Grossesse à éviter, surtout au premier trimestre.</p>
<div class="lab">Surveillance</div><p>Hémogramme et électrolytes ; syndrome de Stevens-Johnson et nécrolyse épidermique toxique possibles ; lithiase rénale et paresthésies : hydratation et échographie urinaire annuelle.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a> ; Information professionnelle Swissmedic Diamox® (AIPS, via tools/swissmedic_fi.py), mise à jour juillet 2026.</p></template>
<template data-pop="r27-fampridine" data-title="Fampridine (Fampyra®) et 4-aminopyridine">
<div class="lab">Statut</div><p>L’information professionnelle suisse (mars 2025) autorise la fampridine à libération prolongée pour améliorer la marche dans la sclérose en plaques (EDSS 4,0 à 7,0), à 10 mg 2 fois par jour. L’ataxie n’est pas une indication suisse.</p>
<div class="lab">Posologie</div><p>La ligne directrice donne 3 × 5 mg/jour de 4-aminopyridine dans l’ataxie épisodique de type 2 (alternative) et en essai dans le type 27B, après exclusion d’une arythmie et d’une hyperexcitabilité à l’électroencéphalogramme. Cette posologie n’est pas celle de Fampyra®.</p>
<div class="lab">Contre-indications</div><p>Épilepsie ; clairance de la créatinine inférieure à 50 mL/min ; inhibiteurs de OCT2 (cimétidine). Risque de crises dose-dépendant ; grossesse à éviter.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; Information professionnelle Swissmedic Fampyra® (AIPS, via tools/swissmedic_fi.py), mise à jour mars 2025.</p></template>
<template data-pop="r27-phenytoine" data-title="Phénytoïne (Phenhydan®) : cause d’ataxie">
<div class="lab">Posologie</div><p>Concentrations thérapeutiques usuelles : 10 à 20 µg/ml (information professionnelle, juin 2024).</p>
<div class="lab">Effets indésirables</div><p>Diplopie, nystagmus, ataxie et dysarthrie dose-dépendants, surtout au-delà de 20 µg/ml. Atrophie cérébelleuse irréversible possible au long cours au-delà de 25 µg/ml.</p>
<div class="lab">Conduite</div><p>Réduire la dose. Les porteurs de CYP2C9*2 ou *3 sont à risque.</p>
<p class="src">Références : Information professionnelle Swissmedic Phenhydan® (AIPS, via tools/swissmedic_fi.py), mise à jour juin 2024.</p></template>
<template data-pop="r27-lithium" data-title="Lithium (Quilonorm® retard) : cause d’ataxie">
<div class="lab">Posologie</div><p>Lithiémie d’entretien 0,5 à 1,0 mmol/L (information professionnelle, mars 2025).</p>
<div class="lab">Toxicité</div><p>Prévisible dès 1,5 mmol/L. Ataxie, tremblement, dysarthrie et nystagmus sont des signes d’intoxication : arrêt immédiat.</p>
<div class="lab">Grossesse et rein</div><p>Risque d’anomalie d’Ebstein, à éviter. Risque d’accumulation en cas d’atteinte rénale (non détaillé dans le dossier).</p>
<p class="src">Références : Information professionnelle Swissmedic Quilonorm® retard (AIPS, via tools/swissmedic_fi.py), mise à jour mars 2025.</p></template>
<template data-pop="pareto-r27-def" data-title="Pareto — Définitions et classifications">
<p class="ratio" data-cover="r27-0,r27-1"></p><ul><li>R27 est un code de symptôme ; on recode dès que la cause est connue (R26.0, G11.-, G23.3, G31.2).</li><li>Trois entrées : cervelet, proprioception, vestibule ; CANVAS les combine.</li><li>Classer par cause (acquise, génétique, dégénérative sporadique), tempo et âge de début.</li><li>Mesurer : SARA ; trier aux urgences : GTI 2 ou 3.</li></ul></template>
<template data-pop="pareto-r27-meca" data-title="Pareto — Fréquence et physiopathologie">
<p class="ratio" data-cover="r27-2,r27-3"></p><ul><li>Aucune donnée suisse ; prévalence européenne des ataxies 10 à 20 pour 100 000.</li><li>Cervelet atteint : décharges désynchronisées, coactivation accrue, oscillation, chutes.</li><li>Territoires : PICA médiale vertige et ataxie du tronc, AICA signes latéro-pontiques, artère supérieure dysarthrie.</li></ul></template>
<template data-pop="pareto-r27-clin" data-title="Pareto — Causes, anamnèse et examen">
<p class="ratio" data-cover="r27-4,r27-5,r27-6"></p><ul><li>Chercher d’abord médicaments, alcool, carences, immunité et cancer.</li><li>Âge de début et vitesse de progression orientent le plus.</li><li>Signes cérébelleux, réflexes, indices (apraxie oculomotrice, dysautonomie, paralysie du regard).</li><li>Pas de nystagmus n’exclut pas un accident vasculaire.</li></ul></template>
<template data-pop="pareto-r27-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="r27-7"></p><ul><li>Ordre : urgence, IRM, biologie, génétique, recodage.</li><li>Différentiels de la plus grave à la plus lente : accident vasculaire, Wernicke, paranéoplasique, Creutzfeldt-Jakob, Miller Fisher.</li><li>IRM ou liquide normaux n’excluent pas une ataxie immune.</li></ul></template>
<template data-pop="pareto-r27-urg" data-title="Pareto — Urgences et pronostic">
<p class="ratio" data-cover="r27-8"></p><ul><li>Ataxie aiguë avec vertige : IRM en diffusion.</li><li>Progression en semaines à mois : anticorps et tumeur.</li><li>Wernicke : thiamine avant glucose.</li><li>Phénytoïne au-delà de 20 µg/ml, lithium dès 1,5 mmol/L : réduire ou arrêter.</li></ul></template>
<template data-pop="pareto-r27-pec" data-title="Pareto — Prise en charge et suivi">
<p class="ratio" data-cover="r27-9,r27-10"></p><ul><li>Aucun médicament n’améliore l’ataxie sans traiter la cause.</li><li>Rééducation comme traitement de base ; causes traitables en priorité.</li><li>Suivi tous les 6 à 12 mois ; réanalyse génétique tous les deux ans ; conseil génétique avant test.</li></ul></template>
<template data-pop="pareto-r27-crit" data-title="Pareto — Spécificités, critères et paramètres">
<p class="ratio" data-cover="r27-11,r27-12,r27-13"></p><ul><li>Wernicke (EFNS) : 2 signes sur 4.</li><li>MSA-C : début après 30 ans, dysautonomie, syndrome cérébelleux.</li><li>FXTAS : 55 à 200 CGG de FMR1, tremblement d’action, IRM typique.</li><li>Pas de donnée suisse d’épidémiologie, de remboursement ni de conduite propres à l’ataxie.</li></ul></template>
<template data-pop="pareto-r27-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="r27-e-1,r27-e-2,r27-e-3,r27-e-4,r27-e-5,r27-e-6"></p><ul><li>L’IRM d’abord, puis la biologie ciblée, puis la génétique.</li><li>Alpha-fœtoprotéine augmentée : ataxie-télangiectasie ou type 2 des apraxies oculomotrices.</li><li>Vitamine E ajustée aux lipides.</li><li>HINTS seulement avec nystagmus ; GTI 3 spécifique à 99,1 %.</li></ul></template>
<template data-pop="pareto-r27-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="r27-s-anat-cours"></p><ul><li>Trois entrées de l’équilibre.</li><li>Vermis : contrôle postural.</li><li>Territoires artériels cérébelleux.</li></ul></template>
<template data-pop="pareto-r27-physio" data-title="Pareto — Physiologie">
