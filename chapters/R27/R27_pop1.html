<template data-pop="r27-guideline" data-title="Ligne directrice sur les ataxies de l’adulte">
<div class="lab">Définition</div><p>La ligne directrice AWMF 030/031, version 7.0, de niveau S1 (consensus d’experts), a été rédigée par la Société allemande de neurologie (DGN) avec la Société autrichienne de neurologie (ÖGN) et la Société suisse de neurologie (SNG). Elle a été révisée le 30 octobre 2023, publiée en février 2024 et reste valable jusqu’au 29 octobre 2028. Elle traite l’ataxie de l’adulte.</p>
<div class="lab">Application</div><p>Le cours en tire l’ordre des recherches (IRM, biologie, génétique), les listes de causes, les traitements des causes rares et les critères de la MSA-C, de la FXTAS et de la SAOA.</p>
<div class="lab">Limite</div><p>Un consensus d’experts n’a pas de niveau de preuve. Les doses citées sont à recouper avec l’information professionnelle suisse. La ligne directrice ne traite ni l’enfant ni l’ataxie aiguë d’origine vasculaire.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a>.</p></template>
<template data-pop="r27-ssp" data-title="Situations de départ PROFILES">
<div class="lab">Définition</div><p>Les situations de départ (SSP) de PROFILES 2017 sont les points d’entrée cliniques de l’examen fédéral. La situation 98 s’intitule « abnormal involuntary movements, tremor, tic, lack of coordination ». Le registre du dépôt rattache R27 aux situations 96 (équilibre, chutes), 97 (démarche), 98 et 103 (parésie).</p>
<div class="lab">Application</div><p>Les situations 99 (troubles de la parole) et 100 (vertige) sont voisines : un patient ataxique les présente souvent aussi. Devant l’une d’elles, la démarche du cours (siège, tempo, cause acquise traitable) s’applique.</p>
<div class="lab">Limite</div><p>Les libellés sont lus dans le registre du dépôt, en anglais ; l’objectif d’apprentissage détaillé n’a pas été relu.</p>
<p class="src">Références : <a href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" data-reference-source="1" target="_blank" rel="noopener">PROFILES 2017, situations de départ</a>.</p></template>
<template data-pop="r27-ataxie" data-title="Ataxie : définition et vocabulaire">
<div class="lab">Définition</div><p>Une ataxie est un défaut de coordination des mouvements et de l’équilibre. Le patient décrit une maladresse, une instabilité, une incoordination et une parole empâtée ; l’oscillopsie est rare. Au sens strict de la ligne directrice, les « ataxies » sont les maladies non focales du cervelet et de ses connexions dont le symptôme cardinal est une ataxie progressive ou épisodique.</p>
<div class="lab">Application</div><p>Une ataxie tardive peut venir d’une atteinte cérébelleuse, proprioceptive ou vestibulaire. Le mot « déséquilibre » désigne toute perturbation aiguë de la station, de la marche ou de la stabilité posturale.</p>
<div class="lab">Piège</div><p>Une maladie focale du cervelet (tumeur, abcès, infarctus, hémorragie, sclérose en plaques) se distingue le plus souvent par la clinique, mais seule l’IRM le confirme avec certitude.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a> ; <a href="https://doi.org/10.1038/s41588-019-0372-4" data-reference-source="1" target="_blank" rel="noopener">Cortese et al., Nat Genet 2019 (résumé)</a>.</p></template>
<template data-pop="r27-pract" data-title="Recommandations britanniques de Practical Neurology">
<div class="lab">Définition</div><p>Cette revue de 2019 (de Silva et collègues) s’appuie sur les recommandations d’Ataxia UK de 2016. Elle détaille la présentation clinique, l’âge de début, la vitesse de progression, l’échelle SARA, les indices d’IRM et le bilan.</p>
<div class="lab">Application</div><p>Le cours en retient les signes cérébelleux, les réflexes, les indices d’orientation, la mise en garde sur l’alcool, la vitamine E ajustée aux lipides, le suivi tous les 6 à 12 mois et la prise en charge palliative.</p>
<div class="lab">Limite</div><p>Recommandations britanniques, donc européennes mais non suisses. Certaines puces de la liste de signes sont tronquées dans la version PubMed Central.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a>.</p></template>
<template data-pop="r27-canvas" data-title="CANVAS : ataxie cérébelleuse, neuropathie, aréflexie vestibulaire">
<div class="lab">Définition</div><p>Le CANVAS associe une ataxie cérébelleuse, une neuropathie sensitive et une aréflexie vestibulaire. Il est lié à une expansion biallélique d’une répétition intronique du gène RFC1, qui est une cause fréquente d’ataxie tardive. Environ 0,7 % des Européens sont porteurs de l’expansion.</p>
<div class="lab">Application</div><p>L’aréflexie vestibulaire se reconnaît par un test d’impulsion céphalique pathologique, confirmé par le test vidéo et l’épreuve calorique ; la neuropathie par la neurographie. Une toux chronique à l’anamnèse est un indice d’ataxie liée à RFC1.</p>
<div class="lab">Limite</div><p>Le dossier ne contient que le résumé de l’article fondateur de Cortese (2019).</p>
<p class="src">Références : <a href="https://doi.org/10.1038/s41588-019-0372-4" data-reference-source="1" target="_blank" rel="noopener">Cortese et al., Nat Genet 2019 (résumé)</a> ; <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a>.</p></template>
<template data-pop="r27-irm" data-title="IRM cérébrale : pourquoi en premier, quels indices">
<div class="lab">Mécanisme</div><p>L’IRM visualise le cervelet, le tronc et la moelle cervicale haute. Elle est la seule à distinguer avec certitude une lésion focale d’une maladie non focale et, dans certaines formes, elle pose directement le diagnostic, comme dans la sidérose superficielle (hémosidérine en séquence T2* ou en écho de gradient).</p>
<div class="lab">Application</div><p>Elle est indispensable chez presque tous les patients ; le scanner n’est utilisé qu’en cas de contre-indication. Les principaux indices sont rassemblés dans le tableau de l’onglet « Examens complémentaires » (îlot e-2).</p>
<div class="lab">Piège</div><p>Une IRM normale n’exclut pas une ataxie immune ni une dégénérescence paranéoplasique.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a>.</p></template>
<template data-pop="r27-cim" data-title="Codage : R27, R26.0, G11.-, R42 et recodage">
<div class="lab">Définition</div><p>La catégorie R27 comprend R27.0 (ataxie, sans précision) et R27.8 (troubles de la coordination, autres et non précisés). Le BfArM exclut R26.0 (démarche ataxique), G11.- (ataxie héréditaire) et R42 (vertige sans précision). Aucune note de bloc n’existe.</p>
<div class="lab">Application</div><p>Dès que la cause est connue, on recode : ataxie héréditaire en G11.-, MSA-C en G23.3, dégénérescence alcoolique en G31.2 (mots-clés de la ligne directrice). L’ataxie limitée à la marche se code R26.0.</p>
<div class="lab">Limite</div><p>La page du BfArM est en allemand et a été lue par extraction automatique ; les libellés français viennent du registre du dépôt. La répartition de R27.0 et R27.8 du cours est pédagogique.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-r25-r29.htm" data-reference-source="1" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc R25–R29</a>.</p></template>
<template data-pop="r27-msa" data-title="Atrophie multisystématisée de type cérébelleux (MSA-C)">
<div class="lab">Définition</div><p>La MSA-C est une maladie dégénérative sporadique. Le diagnostic clinique « probable » (critères de 2022) demande un début après 30 ans, une dysautonomie (résidu post-mictionnel supérieur à 100 mL, urgenturie inexpliquée ou chute tensionnelle d’au moins 20/10 mmHg dans les 10 minutes de l’orthostatisme), un syndrome cérébelleux et au moins un critère de soutien. Le diagnostic « clinique établi » demande deux critères de soutien et un signe d’IRM, avec des critères dysautonomiques plus stricts.</p>
<div class="lab">Application</div><p>Les réflexes sont conservés, voire vifs. L’IRM peut montrer le signe « hot cross bun » et une atrophie du pont et des pédoncules cérébelleux moyens. L’évolution est plus rapide que celle des autres ataxies dégénératives. Le bilan comprend le test de Schellong, la table basculante et l’urodynamique.</p>
<div class="lab">Limite</div><p>La liste détaillée des critères de soutien n’est pas reproduite dans le dossier.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a>.</p></template>
<template data-pop="r27-acd" data-title="Dégénérescence cérébelleuse alcoolique (ACD)">
<div class="lab">Mécanisme</div><p>Elle résulte d’une carence en thiamine et de la toxicité de l’alcool et de ses métabolites. La transferrine désialylée (CDT) est augmentée. La neurographie peut montrer une neuropathie associée.</p>
<div class="lab">Application</div><p>Le traitement associe l’abstinence, la prise en charge de la dépendance et la thiamine : 3 × 100 mg par voie intraveineuse pendant au moins une semaine, puis 3 × 100 mg/jour par voie orale (la voie orale seule est possible dans l’ataxie chronique). Après abstinence, l’ataxie se stabilise ou s’améliore ; si l’alcool continue, elle s’aggrave par poussées.</p>
<div class="lab">Piège</div><p>L’alcool est souvent invoqué à tort comme seule cause. Un bilan complémentaire révèle souvent une autre explication.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a>.</p></template>
<template data-pop="r27-immune" data-title="Ataxies immunes">
<div class="lab">Définition</div><p>Les ataxies immunes regroupent les ataxies des maladies systémiques (maladie cœliaque, maladie de Behçet, lupus, syndrome de Sjögren), celles qui accompagnent des anticorps antineuronaux (anti-Yo, anti-Hu, anti-Ri, anti-GAD, anti-Caspr2, anti-IgLON5, anti-GQ1b) et des formes lentement progressives. Les inhibiteurs de points de contrôle immunitaire peuvent aussi en provoquer.</p>
<div class="lab">Application</div><p>Une hémiataxie sans lésion visible à l’IRM ou une ataxie épisodique de l’adulte sans antécédent familial doit faire penser à un anticorps antineuronal. L’anti-GAD touche les femmes quatre fois plus que les hommes ; les titres élevés sont significatifs et la synthèse intrathécale aide. L’anti-GQ1b est associé au syndrome de Miller Fisher (ophtalmoplégie, aréflexie, ataxie). L’opsoclonus (saccades chaotiques multidirectionnelles sans intervalle intersaccadique) définit le syndrome opsoclonus-myoclonus-ataxie. Les troubles du sommeil avec stridor évoquent l’anti-IgLON5, la diarrhée chronique l’anti-DPPX.</p>
<div class="lab">Piège</div><p>Le liquide céphalo-rachidien ou l’IRM normaux n’excluent pas une ataxie immune. Le traitement (corticoïdes, immunoglobulines, plasmaphérèse, immunosuppresseurs dont le rituximab pour l’anti-GAD) répond mieux s’il est précoce.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a>.</p></template>
<template data-pop="r27-pcd" data-title="Dégénérescence cérébelleuse paranéoplasique (PCD)">
<div class="lab">Définition</div><p>Ataxie rapidement progressive, en semaines à mois, associée à un cancer et à des anticorps antineuronaux. Son incidence est de 0,22 pour 100 000 personnes-années au Frioul (Italie).</p>
<div class="lab">Application</div><p>Elle impose la recherche d’anticorps dans le sérum et le liquide céphalo-rachidien, puis d’une tumeur (scanner thoraco-abdominal, examen gynécologique et mammographie, examen urologique), puis une tomographie par émission de positons au fluorodésoxyglucose si ces examens sont négatifs. La recherche est répétée tous les 4 à 6 mois pendant deux ans si l’anticorps est à haut risque. Elle peut simuler un accident vasculaire : 8,3 % des cas, avec une IRM normale dans 75 % des cas.</p>
<div class="lab">Limite</div><p>L’amélioration après traitement du cancer est rare, sauf dans le lymphome de Hodgkin et le cancer pulmonaire à petites cellules. La série de Vogrig n’est lue qu’au résumé.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://doi.org/10.1007/s12311-019-01075-9" data-reference-source="1" target="_blank" rel="noopener">Vogrig et al., Cerebellum 2019 (résumé)</a>.</p></template>
<template data-pop="r27-friedreich" data-title="Ataxie de Friedreich">
<div class="lab">Mécanisme</div><p>Elle résulte d’une expansion GAA biallélique dans l’intron 1 du gène FXN. L’ataxie est surtout afférente, avec neuropathie sensitive et atteinte pyramidale.</p>
<div class="lab">Application</div><p>Fréquence : 1 pour 20 000 à 50 000 chez les Caucasiens. Les réflexes sont diminués ou abolis. L’IRM montre une atrophie de la moelle cervicale haute. Il faut rechercher une cardiomyopathie (40 à 50 %), un diabète (10 à 20 %, rapidement insulinorequérant) et une scoliose par l’électrocardiogramme, l’échocardiographie et l’HbA1c. En Suisse, l’omavéloxolone (Skyclarys®) est autorisée depuis le 24 septembre 2024.</p>
<div class="lab">Limite</div><p>La fréquence suisse n’est pas documentée.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a>.</p></template>
<template data-pop="r27-sca" data-title="Ataxies spinocérébelleuses dominantes">
<div class="lab">Définition</div><p>Maladies génétiques dominantes. Les plus fréquentes en Europe centrale sont les types 1, 2, 3, 6 et 27B ; le type 3 est le plus fréquent dans les revues de prévalence, suivi des types 2 et 6. Début le plus souvent entre 30 et 40 ans, après 50 ans pour les types 6 et 27B.</p>
<div class="lab">Application</div><p>Indices : saccades lentes et réflexes diminués (type 2) ; baisse visuelle (type 7) ; chorée et troubles cognitifs (type 17) ; tremblement d’action (type 12) ; nystagmus vers le bas (type 27B, essai de 4-aminopyridine). Les formes à expansion CAG traduite progressent nettement et l’espérance de vie est souvent réduite. Un test prédictif est possible si la forme familiale est connue.</p>
<div class="lab">Piège</div><p>Plus de 10 % des ataxies sporadiques de l’adulte portent une mutation malgré une anamnèse familiale négative.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a> ; <a href="https://doi.org/10.1159/000358801" data-reference-source="1" target="_blank" rel="noopener">Ruano et al., Neuroepidemiology 2014 (résumé)</a>.</p></template>
<template data-pop="r27-ea" data-title="Ataxies épisodiques (types 1 et 2)">
<div class="lab">Mécanisme</div><p>Des variantes de protéines synaptiques qui maintiennent le potentiel de membrane ou déclenchent le potentiel d’action. Le type 1 touche le canal potassique (gène KCNA1) ; le type 2 le canal calcique (gène CACNA1A).</p>
<div class="lab">Application</div><p>Type 1 : épisodes de secondes à minutes, déclenchés par un sursaut, un mouvement brusque ou l’effort ; myokymies entre les crises ; traitement par la carbamazépine. Type 2 : épisodes de 15 minutes à plusieurs jours, déclenchés par le stress, l’alcool, le café ou l’effort, avec vertige, oscillopsie, nausées et migraine fréquente ; acétazolamide en premier choix.</p>
<div class="lab">Limite</div><p>L’acétazolamide n’a pas cette indication en Suisse (usage hors étiquette).</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a>.</p></template>
<template data-pop="r27-fxtas" data-title="FXTAS : syndrome tremblement-ataxie lié à l’X fragile">
<div class="lab">Définition</div><p>Le FXTAS survient chez des porteurs d’une prémutation FMR1 (55 à 200 répétitions CGG). Il débute en moyenne vers 60 ans et touche surtout des hommes.</p>
<div class="lab">Application</div><p>Le tableau associe ataxie progressive et tremblement d’action, avec un signe du pédoncule cérébelleux moyen à l’IRM. L’anamnèse cherche un petit-fils ou un neveu avec un retard mental. Le conseil génétique de la famille est urgent.</p>
<div class="lab">Limite</div><p>Le dossier ne décrit pas l’imagerie typique au-delà du signe du pédoncule cérébelleux moyen.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a>.</p></template>
<template data-pop="r27-saoa" data-title="Ataxie sporadique de l’adulte (SAOA)">
<div class="lab">Définition</div><p>Ataxie sporadique de l’adulte, sans critère de MSA-C, après exclusion soigneuse des causes acquises et génétiques (liquide céphalo-rachidien, séquençage).</p>
<div class="lab">Application</div><p>Son pronostic est nettement meilleur que celui de la MSA-C. C’est un diagnostic d’exclusion.</p>
<div class="lab">Piège</div><p>Il est posé trop tôt si les causes acquises n’ont pas toutes été cherchées.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-031l_S1_Ataxien-des-Erwachsenenalters_2024-02.pdf" data-reference-source="1" target="_blank" rel="noopener">Ligne directrice AWMF 030/031, Ataxien des Erwachsenenalters, 2024</a>.</p></template>
<template data-pop="r27-sara" data-title="SARA : Scale for the Assessment and Rating of Ataxia">
<div class="lab">Définition</div><p>Échelle clinique à 8 items : marche (0 à 8), station (0 à 6), position assise (0 à 4), parole (0 à 6), poursuite du doigt, doigt-nez, mouvements alternatifs rapides et talon-genou (0 à 4 chacun, moyenne des deux côtés).</p>
<div class="lab">Application</div><p>Passation en 14,2 ± 7,5 minutes ; fiabilité inter-évaluateurs 0,98 ; test-retest 0,90 ; corrélation avec l’indice de Barthel de −0,80. Elle sert à suivre la sévérité d’un patient connu.</p>
<div class="lab">Limite</div><p>L’article fondateur n’est lu qu’au résumé ; les items viennent du tableau 1 de Practical Neurology.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/01.wnl.0000219042.60538.92" data-reference-source="1" target="_blank" rel="noopener">Schmitz-Hübsch et al., Neurology 2006 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a>.</p></template>
<template data-pop="r27-gti" data-title="Instabilité tronculaire graduée (GTI)">
<div class="lab">Définition</div><p>Grade 2 : marche autonome impossible. Grade 3 : station ou position assise impossible sans aide.</p>
<div class="lab">Application</div><p>Pour un accident vasculaire, le grade 3 a une spécificité de 99,1 % et une sensibilité de 44 % ; les grades 2 ou 3 ont une spécificité de 82,7 % et une sensibilité de 70,8 %. La GTI confirme mais n’exclut pas.</p>
<div class="lab">Limite</div><p>Chiffres cités par les auteurs d’après des méta-analyses antérieures.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13240050/" data-reference-source="1" target="_blank" rel="noopener">Schmidt et al., Eur J Neurol 2026</a>.</p></template>
<template data-pop="r27-cervelet" data-title="Physiologie cérébelleuse de la marche (consensus 2023)">
<div class="lab">Mécanisme</div><p>Le vermis est essentiel au contrôle postural. Le cervelet transforme l’information sensorielle en commandes motrices synchronisées. Chez le patient cérébelleux, la synchronisation des décharges musculaires est altérée, les synergies de la locomotion sont désorganisées, les décharges sont prolongées, la coactivation augmente et l’oscillation du corps croît.</p>
<div class="lab">Application</div><p>L’ataxie de la station et de la marche est souvent le premier déficit et expose aux chutes. La marche en tandem est altérée dès les stades précoces.</p>
<div class="lab">Limite</div><p>Seul le résumé du consensus a été lu : la physiologie détaillée (voies, organisation corticale) manque.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s12311-022-01373-9" data-reference-source="1" target="_blank" rel="noopener">Cabaraux et al., Cerebellum 2023 (résumé)</a>.</p></template>
<template data-pop="r27-mnemo" data-title="Aide pédagogique : les trois entrées de l’équilibre">
<div class="lab">Aide pédagogique, non critère officiel</div><p>« CPV » : Cervelet (il coordonne), Proprioception (elle informe sur la position du corps), Vestibule (il informe sur la position de la tête). Devant une ataxie, on passe en revue ces trois lettres ; si les trois sont atteintes, on pense au CANVAS.</p>
<div class="lab">Limite</div><p>Cette aide ne remplace aucune classification de la ligne directrice.</p>
<p class="src">Références : .</p></template>
<template data-pop="r27-pica" data-title="Territoires cérébelleux : PICA, AICA et artère cérébelleuse supérieure">
<div class="lab">Définition</div><p>L’artère cérébelleuse postéro-inférieure (PICA) médiale donne un vertige aigu et une ataxie du tronc ; sa branche latérale une instabilité, une ataxie des membres et une dysmétrie sans dysarthrie. L’artère cérébelleuse antéro-inférieure (AICA) donne une ataxie des membres et du tronc avec signes latéro-pontiques. L’artère cérébelleuse supérieure donne une dysarthrie, une instabilité ou un vertige, une ataxie des membres et une dysmétrie.</p>
<div class="lab">Application</div><p>Une instabilité isolée n’exclut pas un infarctus. Dans les infarctus sans nystagmus, la proportion est de 9 % pour l’AICA, 40 % pour la PICA, 57 % pour l’artère supérieure et 62 % pour l’artère cérébrale postérieure.</p>
<div class="lab">Limite</div><p>Série lausannoise de 34 patients consécutifs (1993), infarctus non expansifs, lue au résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/ana.410330507" data-reference-source="1" target="_blank" rel="noopener">Barth et al., Ann Neurol 1993 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13240050/" data-reference-source="1" target="_blank" rel="noopener">Schmidt et al., Eur J Neurol 2026</a>.</p></template>
<template data-pop="r27-tandem" data-title="Marche en tandem">
<div class="lab">Application</div><p>Le patient marche en plaçant un pied devant l’autre. Cette marche est altérée dès les stades précoces de l’ataxie et reste utile au stade pré-ataxique.</p>
<div class="lab">Limite</div><p>La sensibilité et la spécificité de la marche en tandem et du signe de Romberg n’ont pas été trouvées.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s12311-022-01373-9" data-reference-source="1" target="_blank" rel="noopener">Cabaraux et al., Cerebellum 2023 (résumé)</a>.</p></template>
<template data-pop="r27-reflexes" data-title="Réflexes et orientation étiologique">
<div class="lab">Application</div><p>Diminués ou abolis dans l’ataxie de Friedreich, l’ataxie avec déficit en vitamine E, l’ataxie avec apraxie oculomotrice de type 2 et le type 2 des ataxies spinocérébelleuses. Conservés, voire vifs, dans la plupart des ataxies spinocérébelleuses dominantes et dans la MSA-C.</p>
<div class="lab">Piège</div><p>Les réflexes orientent mais ne tranchent pas : ils s’interprètent avec les autres signes et l’IRM.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6585307/" data-reference-source="1" target="_blank" rel="noopener">de Silva et al., Pract Neurol 2019</a>.</p></template>
<template data-pop="r27-hints" data-title="HINTS et syndrome de déséquilibre aigu">
<div class="lab">Définition</div><p>HINTS (Head Impulse, Nystagmus, Test of Skew) est un examen oculomoteur en trois temps pour un syndrome vestibulaire aigu. Sa sensibilité est de 95,3 % et sa spécificité de 92,6 % en présence d’un nystagmus.</p>
<div class="lab">Application</div><p>Près de 50 % des syndromes vestibulaires aigus centraux n’ont pas de nystagmus : c’est le syndrome de déséquilibre aigu. L’examen décisif devient la marche et la station (GTI).</p>
<div class="lab">Limite</div><p>Chiffres cités par les auteurs de la revue européenne de 2026 d’après des méta-analyses antérieures ; 40 études, 11 731 patients des urgences.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13240050/" data-reference-source="1" target="_blank" rel="noopener">Schmidt et al., Eur J Neurol 2026</a>.</p></template>
