<p>Dans cette <b>vignette fictive</b>, un homme de 40 ans est paraplégique depuis huit ans à la suite d’un accident. Son niveau neurologique se situe au 6e segment thoracique et son examen est classé AIS A. Il consulte pour une céphalée pulsatile violente avec vision floue. Sa pression artérielle de base est de 105 mmHg en systolique ; elle atteint aujourd’hui 170 mmHg. La vessie est palpable. Ces valeurs sont pédagogiques ; elles servent à poser la question du cours : que signifie « paraplégie » pour un médecin qui n’est pas spécialiste, comment la classer sans ambiguïté, et quelles urgences et quelles complications de longue durée faut-il savoir reconnaître ?</p>
<p>La hausse de <button class="w" data-k="g82-calcul-da">65 mmHg (calcul détaillé)</button> dépasse largement les 20 mmHg qui définissent la <button class="w" data-k="g82-da">dysréflexie autonome</button> ; la lésion se situe au 6e segment thoracique ou au-dessus, niveau où cette complication est attendue. Une vessie distendue en est un déclencheur classique. Le cas oblige à raisonner dans un ordre précis : reconnaître l’urgence, identifier le déclencheur sous la lésion, puis chercher la cause du déséquilibre vésical. Le cours ne détaille pas le traitement médicamenteux de l’épisode, car aucune recommandation européenne ou suisse sur ce point n’a été lue (voir <button class="w" data-k="g82-lacunes">les limites du dossier</button>).</p>
<div class="key"><b>À retenir.</b> Une lésion médullaire se décrit par un <b>niveau</b>, une <b>complétude</b> et un <b>grade</b>, mesurés par un examen standardisé. Ces trois informations commandent le pronostic, les complications attendues et le codage.</div>
</section>

<section class="ilot" id="g82-1"><h2><span class="n">1</span>Définition, périmètre et codage</h2>
<p>Le code <button class="w" data-k="g82-codage">G82 (catégorie CIM-10-GM 2024, notes d’usage et exclusions)</button> regroupe la paraparésie, la paraplégie, la tétraparésie et la tétraplégie. Le préfixe « para » désigne les deux jambes, « tétra » les quatre membres ; « parésie » indique une force diminuée, « plégie » une force abolie. Le code sert aux paralysies dues à une lésion médullaire ou à une affection cérébrale, lorsqu’aucun autre code ne convient. Il peut aussi être ajouté en codage multiple pour signaler l’état, quelle qu’en soit la cause (BfArM, CIM-10-GM 2024).</p>
<p>La CIM-10-GM exclut la paralysie médullaire traumatique <b>aiguë</b> ; celle-ci se code en S14, S24 ou S34 selon la région. Elle exclut aussi la paralysie cérébrale infantile, codée G80. Cette frontière explique un point souvent mal compris : le même patient paraplégique après un accident reçoit un code S pour la phase aiguë, puis G82 pour l’état chronique ou en code supplémentaire.</p>
<table class="t"><thead><tr><th>Sous-catégorie</th><th>Signification</th></tr></thead><tbody><tr><td>G82.0</td><td>Paraparésie et paraplégie flasques</td></tr><tr><td>G82.1</td><td>Paraparésie et paraplégie spastiques</td></tr><tr><td>G82.2</td><td>Paraparésie et paraplégie, sans précision (paralysie des deux jambes sans précision)</td></tr><tr><td>G82.3</td><td>Tétraparésie et tétraplégie flasques</td></tr><tr><td>G82.4</td><td>Tétraparésie et tétraplégie spastiques</td></tr><tr><td>G82.5</td><td>Tétraparésie et tétraplégie, sans précision (quadriplégie sans précision)</td></tr></tbody></table>
<p>Le tableau se lit en deux axes : le nombre de membres atteints (deux ou quatre) et le tonus (flasque ou spastique). Un cinquième caractère précise l’évolution et la complétude pour G82.0 à G82.5 : 0 pour une forme aiguë complète non traumatique, 1 pour une forme aiguë incomplète non traumatique, 2 pour une forme chronique complète, 3 pour une forme chronique incomplète, 9 pour une forme non précisée, y compris d’origine cérébrale. Un code supplémentaire, marqué du point d’exclamation, note le <button class="w" data-k="g82-niveau-fonctionnel">niveau fonctionnel (tableau G82.6-! et différence avec le niveau de l’examen standardisé)</button> ; le code Z99.1 note une dépendance de longue durée à la ventilation.</p>
<div class="trap"><span class="k">Piège de vocabulaire</span> Le « niveau fonctionnel » de la CIM-10-GM est le segment moteur intact le plus bas. Le « niveau neurologique » de l’examen standardisé (section suivante) combine sensibilité et motricité des deux côtés. Les deux notions ne sont pas équivalentes ; le codage utilise la première, la classification clinique la seconde.</div>
<p>Le syndrome de la queue de cheval relève d’un autre code, G83.4 (G83.40 complet, G83.41 incomplet, G83.49 sans précision), complété par un code G95.8 pour la vessie neurogène. Cette distinction compte dès la clinique : une atteinte des racines de la queue de cheval donne une paralysie périphérique, flasque, alors qu’une lésion de la moelle elle-même peut devenir spastique (voir la section suivante).</p>
<button class="pareto-btn ui" data-k="pareto-g82-definition">▲ Loi de Pareto — Définition et codage</button>
</section>

<section class="ilot" id="g82-2"><h2><span class="n">2</span>Classer la lésion : l’examen standardisé</h2>
<p>La classification de référence est celle des <button class="w" data-k="g82-isncsci">ISNCSCI, révision 2019 (déroulement de l’examen, muscles clés, cotations)</button>. Elle repose sur un principe simple : mesurer, côté par côté, ce qui fonctionne encore sous la lésion. Deux définitions encadrent le vocabulaire. La <b>tétraplégie</b> est une atteinte motrice ou sensitive des segments cervicaux de la moelle, par lésion d’éléments nerveux dans le canal vertébral ; elle exclut le plexus brachial et les nerfs périphériques. La <b>paraplégie</b> est une atteinte des segments thoraciques, lombaires ou sacrés, sans segment cervical, avec une fonction préservée des membres supérieurs ; elle exclut le plexus lombosacré et les nerfs périphériques.</p>
<p>L’examen coche trois ensembles de données. La force de dix muscles clés de chaque côté est cotée de 0 à 5. La sensibilité au tact léger et à la piqûre est cotée de 0 à 2 en 28 points clés par côté. Enfin, la présence d’une fonction au niveau des segments sacrés les plus bas (tact ou piqûre aux 4e et 5e segments sacrés, pression anale profonde, contraction anale volontaire) est recherchée : c’est l’<button class="w" data-k="g82-sacre">épargne sacrée (toucher rectal indispensable)</button>. À partir de ces données, on établit le <button class="w" data-k="g82-nli">niveau neurologique lésionnel (règle de détermination et exemple chiffré)</button>, le plus rostral des quatre niveaux sensitifs et moteurs droit et gauche. La logique est prudente : la lésion est située au plus haut des quatre niveaux, car c’est à ce niveau que la moelle cesse de fonctionner normalement d’un côté au moins pour une modalité.</p>
<p>La complétude et le grade se déduisent ensuite de l’épargne sacrée. Une lésion est <b>complète</b> lorsqu’aucune épargne sacrée n’existe. Le <button class="w" data-k="g82-ais">grade AIS (A à E)</button> classe la gravité :</p>
<table class="t"><thead><tr><th>Grade</th><th>Désignation</th><th>Critère</th></tr></thead><tbody><tr><td>A</td><td>Complet</td><td>Aucune fonction sensitive ni motrice aux 4e et 5e segments sacrés</td></tr><tr><td>B</td><td>Sensitif incomplet</td><td>Sensibilité sacrée présente, sans motricité, et sans fonction motrice au-delà de trois niveaux sous le niveau moteur</td></tr><tr><td>C</td><td>Moteur incomplet</td><td>Motricité préservée ; moins de la moitié des muscles clés sous le niveau neurologique lésionnel cotés 3 ou plus</td></tr><tr><td>D</td><td>Moteur incomplet</td><td>Motricité préservée ; au moins la moitié des muscles clés sous ce niveau cotés 3 ou plus</td></tr><tr><td>E</td><td>Normal</td><td>Fonctions normales chez un patient ayant eu des déficits antérieurs</td></tr></tbody></table>
<p>Le grade E ne s’applique qu’à un patient qui a eu un déficit ; sans lésion médullaire, aucun grade AIS ne s’attribue. Le seuil des « 3 » n’est pas arbitraire : une force cotée 3 permet de vaincre la pesanteur, donc de faire un mouvement utile contre le poids du segment. La <button class="w" data-k="g82-zpp">zone de préservation partielle</button> complète la description des lésions où la fonction s’arrête de façon incomplète sous le niveau.</p>
<p>Enfin, certains tableaux cliniques se reconnaissent à leur profil et se décrivent hors grade : les <button class="w" data-k="g82-syndromes">syndromes médullaires cliniques (centromédullaire, Brown-Séquard, antérieur, du cône, de la queue de cheval)</button>.</p>
<div class="key"><b>À retenir.</b> Sans toucher rectal, la lésion ne peut pas être déclarée complète ou incomplète : la distinction AIS A / AIS B repose sur l’épargne sacrée, et celle-ci ne se vérifie qu’aux 4e et 5e segments sacrés.</div>
<button class="pareto-btn ui" data-k="pareto-g82-isncsci">▲ Loi de Pareto — Classification ISNCSCI</button>
</section>

<section class="ilot" id="g82-3"><h2><span class="n">3</span>Fréquence en Suisse</h2>
<p>En Suisse, l’<button class="w" data-k="g82-incidence">incidence des lésions médullaires traumatiques (chiffres hospitaliers et sous-couverture)</button> s’établit entre 19,9 et 49,7 par million d’habitants et par an selon les critères retenus, d’après les données hospitalières 2012–2013 de l’Office fédéral de la statistique. Elle est plus élevée chez l’homme, aux âges élevés et pour la paraplégie. L’écart entre les 621 cas administratifs et les 213 cas de la cohorte SwiSCI montre que les centres spécialisés ne voient pas tous les patients, surtout les personnes âgées et les lésions moins sévères. Les chiffres de la cohorte spécialisée ne représentent donc pas la totalité des cas.</p>
<p>Le <button class="w" data-k="g82-profil">profil des nouveaux patients en réadaptation spécialisée (âge, sexe, niveau, complétude)</button> reste utile à connaître : âge médian de 53,5 ans, 69,6 % d’hommes, 53,3 % de paraplégies et 53,7 % de lésions motrices incomplètes, pour un séjour médian de 5,2 mois dans un premier échantillon ; 77,7 % d’hommes, 73,7 % de causes traumatiques et 59,8 % de paraplégies dans un autre.</p>
<p>Les lésions non traumatiques ne sont pas rares. La <button class="w" data-k="g82-nontrauma">myélopathie cervicale dégénérative</button> est présentée comme la cause la plus fréquente de lésion médullaire non traumatique de l’adulte, avec un diagnostic tardif : dans une cohorte britannique, l’adressage survenait à 6,4 mois, l’IRM à 12,5 mois et l’avis chirurgical à 15,8 mois après le début des symptômes. La prévalence des lésions traumatiques dans les pays développés est estimée entre 280 et 906 par million.</p>
<button class="pareto-btn ui" data-k="pareto-g82-epidemio">▲ Loi de Pareto — Fréquence</button>
</section>

<section class="ilot" id="g82-4"><h2><span class="n">4</span>Pronostic vital et morbidité à long terme</h2>
<p>La lésion médullaire est une maladie de toute la vie. En Suisse, la <button class="w" data-k="g82-mortalite">mortalité après lésion traumatique (rapport standardisé, espérance de vie, causes)</button> atteint 2,32 fois celle de la population générale (rapport standardisé de mortalité SMR 2,32 ; intervalle de confiance à 95 % 2,10–2,56). La tétraplégie s’associe à davantage de décès respiratoires, cardiovasculaires, infectieux et accidentels. Les rapports standardisés sont particulièrement élevés pour les infections urinaires et les septicémies, ce qui rappelle que la vessie neurogène est une cause directe de décès évitable.</p>
<p>Après une lésion non traumatique, la mortalité est 1,6 fois celle de la population générale ; les causes sont cardiovasculaires (39,8 %), néoplasiques (22 %) et infectieuses (9,9 %). L’étiologie modifie la survie : le risque de décès est environ dix fois supérieur après une cause maligne qu’après une cause traumatique, 2,6 fois après une cause infectieuse et 2,5 fois après une cause vasculaire (rapports de risque instantané). Un chiffre agrège donc des histoires très différentes.</p>
<p>Le fardeau de la maladie dépasse la mortalité. Un tiers des patients sont à haut risque cardiométabolique à la sortie de réadaptation et le syndrome cardiométabolique touche environ 40 % d’entre eux ; hypertension, diabète et obésité sont plus fréquents après une lésion non traumatique (<button class="w" data-k="g82-cardiometa">risque cardiométabolique : chiffres et interprétation</button>). Une aide à domicile professionnelle est utilisée par 22 % des personnes, à raison d’une médiane de 6 heures par semaine, plus souvent quand l’indépendance fonctionnelle est faible. Les troubles du sommeil concernent 58,8 % des patients, dont 69,4 % ne sont pas traités. Chez l’homme âgé, le risque de cancer de vessie est multiplié par 16 à 28, et le passage à une sonde à demeure est fréquent.</p>
<p>Un dernier chiffre porte sur le suivi : les patients <button class="w" data-k="g82-perdus">perdus de vue des centres spécialisés (association avec la mortalité)</button> ont un risque de décès multiplié par 3,62 après lésion traumatique. Cette association ne prouve pas à elle seule que l’abandon cause le décès, mais elle justifie de maintenir le lien avec le centre.</p>
<div class="trap"><span class="k">Piège d’interprétation</span> Les mortalités standardisées comparent les patients à la population générale suisse ; elles ne disent pas ce que ferait un patient donné. Les rapports de risque selon l’étiologie sont des associations observées, non des effets démontrés de la cause seule.</div>
<button class="pareto-btn ui" data-k="pareto-g82-pronostic">▲ Loi de Pareto — Pronostic et morbidité</button>
</section>

<section class="ilot" id="g82-5"><h2><span class="n">5</span>Physiopathologie</h2>
<p>Le traumatisme médullaire se déroule en deux temps : une <button class="w" data-k="g82-lesion2">lésion primaire, puis une lésion secondaire (tissu nerveux, ischémie, décompression)</button>. La lésion primaire est mécanique et instantanée. La lésion secondaire s’installe ensuite dans les heures et les jours qui suivent et reste accessible au traitement. C’est la raison d’être de deux gestes de la phase aiguë : la décompression précoce, qui vise à limiter l’atteinte secondaire du tissu nerveux (démontrée dans des données précliniques), et le maintien de la perfusion. Augmenter la <button class="w" data-k="g82-pam">pression artérielle moyenne pour la perfusion médullaire</button> vise à améliorer l’oxygénation de la moelle lésée et à limiter la lésion ischémique secondaire.</p>
<p>Une lésion cervicale peut s’accompagner d’un <button class="w" data-k="g82-choc">choc neurogène (définition et limites des données)</button> : la perte brutale du tonus sympathique provoque une vasodilatation, une hypotension et une bradycardie. L’hypotension compromet la perfusion de la moelle, d’où le lien avec l’objectif de pression artérielle. Cette description provient d’une étude observationnelle, de niveau de preuve faible ; ni seuils ni traitement n’ont été lus.</p>
<p>Plus tard, la <button class="w" data-k="g82-vessie">vessie neurogène selon le niveau de la lésion</button> domine l’évolution. Si la lésion se situe entre le pont et le sacrum, le détrusor devient hyperactif et se contracte contre un sphincter qui ne se relâche pas au bon moment (dyssynergie vésico-sphinctérienne) ; le résidu post-mictionnel est souvent augmenté. Si la lésion atteint le segment sacré ou en dessous, le détrusor est hypo- ou acontractile et le résidu est augmenté. L’hyperactivité et la dyssynergie atteignent jusqu’à 95 % des cas, l’hypoactivité jusqu’à 83 %, selon le niveau. Le danger principal est le haut appareil urinaire : des pressions vésicales élevées et prolongées menacent les reins.</p>
<p>La <button class="w" data-k="g82-da">dysréflexie autonome</button> est une réponse autonome brutale et exagérée à un stimulus, en général lorsque la lésion se situe au 6e segment thoracique ou au-dessus. Elle se définit par une hausse de la pression systolique de plus de 20 mmHg par rapport à la valeur de base et se manifeste par une céphalée sévère, une vision floue, de l’anxiété, des variations de la fréquence cardiaque, de la sudation, une piloérection, un érythème au-dessus de la lésion, et une pâleur avec peau froide en dessous. Un <button class="w" data-k="g82-da-neuro">mécanisme neuronal spinal</button> la sous-tend : une architecture de neurones de la moelle se réorganise après la lésion et produit l’épisode.</p>
<p>La <button class="w" data-k="g82-spasticite">spasticité</button> n’est pas qu’un handicap. Le tonus résiduel et des spasmes occasionnels peuvent soutenir la posture et la circulation, et contribuer à prévenir la thrombose. Une réduction trop poussée de la spasticité expose donc à des chutes : le traitement vise un compromis, non la suppression.</p>

<section class="ilot" id="g82-6"><h2><span class="n">6</span>Causes</h2>
<p>Les causes se rangent selon le codage. Les lésions <b>traumatiques aiguës</b> se codent S14, S24 ou S34, et G82 sert ensuite à l’état chronique ou en code supplémentaire. Les lésions <b>non traumatiques</b> comprennent les causes dégénératives (la <button class="w" data-k="g82-nontrauma">myélopathie cervicale dégénérative</button>), malignes, infectieuses et vasculaires, qui forment les quatre groupes étiologiques retenus par la cohorte SwiSCI. Chez l’enfant, le dysraphisme spinal (spina bifida) en est une cause. Enfin, le cinquième caractère 9 couvre les paralysies d’origine cérébrale.</p>
<p>Cette liste n’est pas un différentiel complet. Plusieurs causes non traumatiques fréquentes en pratique n’ont pas été documentées dans le dossier de ce cours (voir la section 8).</p>
<div class="trap"><span class="k">Piège de lecture</span> Une classification par étiologie, comme celle de SwiSCI, ne remplace pas le diagnostic étiologique d’un patient : elle sert à comparer des cohortes. L’origine d’une paraplégie se démontre cliniquement et par imagerie, cas par cas.</div>
</section>
