<template data-pop="r47-aura" data-title="Aura migraineuse du langage (classification internationale des céphalées)">
<div class="lab">Critères de la migraine avec aura (1.2)</div><ul><li>Au moins deux crises.</li><li>Symptôme entièrement réversible, ici un symptôme du langage.</li><li>Au moins trois des six caractéristiques : extension progressive en au moins 5 minutes, succession de symptômes, durée de 5 à 60 minutes, caractère unilatéral, caractère positif, céphalée dans les 60 minutes.</li><li>Non mieux expliqué par un autre diagnostic.</li></ul>
<div class="lab">Application</div><p>Les patients qui ont des auras du langage ont presque toujours aussi des auras visuelles. L’aphasie est toujours considérée comme unilatérale. Les critères exigent un symptôme entièrement réversible, non mieux expliqué par un autre diagnostic : un déficit qui persiste n’est donc pas une aura.</p>
<div class="lab">Limite</div><p>Seule la page des critères a été lue. L’aura du langage est un diagnostic d’exclusion qui s’applique après avoir écarté une cause vasculaire.</p>
<p class="src">Références : <a href="https://ichd-3.org/1-migraine/1-2-migraine-with-aura/" target="_blank" rel="noopener">International Headache Society, ICHD-3, 1.2 Migraine with aura</a>.</p></template>
<template data-pop="r47-ait-dysarthrie" data-title="Dysarthrie transitoire isolée et risque d’accident vasculaire cérébral">
<div class="lab">Résultat</div><p>Dans l’étude d’Oxford (2878 patients), la dysarthrie isolée transitoire, classée parmi les accidents ischémiques transitoires « non consensuels », avait un risque d’accident vasculaire cérébral à 90 jours de 10,6 %, équivalent à celui de l’accident ischémique transitoire classique (11,6 %). Selon le résumé, le risque à 7 jours était de 2,9 % après la consultation et de 5,0 % lorsque la consultation avait lieu le jour même de l’événement.</p>
<div class="lab">Conséquence</div><p>Un symptôme isolé et transitoire ne justifie pas de banaliser : il se traite comme un accident ischémique transitoire.</p>
<div class="lab">Limite</div><p>Le résumé seul a été lu ; la formulation du risque à 7 jours est à confronter au texte intégral.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(20)31961-9" target="_blank" rel="noopener">Tuna, Rothwell, Lancet 2021;397:902–12</a>.</p></template>
<template data-pop="r47-simulateurs" data-title="Simulateurs d’accident vasculaire cérébral : alcool et crises">
<div class="lab">Alcool</div><p>Dans une série de 974 suspicions d’accident vasculaire cérébral de moins de 6 heures (La Haye), 1 % étaient une intoxication alcoolique seule et 5 % des accidents vasculaires cérébraux réels avaient aussi consommé de l’alcool. La moitié des intoxications prises pour un accident vasculaire cérébral niaient ou minimisaient leur consommation. L’intoxication simule surtout un accident vasculaire cérébral postérieur (dysarthrie, troubles de la marche, nystagmus).</p>
<div class="lab">Crises et autres causes</div><p>Dans une série d’Essen (2167 accidents vasculaires cérébraux suspectés), les crises épileptiques représentaient 23,2 % des simulateurs. Une insuffisance rénale ou hépatique chronique prédisait un simulateur.</p>
<div class="lab">Conséquence</div><p>L’alcoolémie ne remplace pas l’imagerie. La conclusion « ivresse » ne se pose pas sans examen.</p>
<div class="lab">Limite</div><p>Les résumés seuls ont été lus ; les deux séries sont monocentriques.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jstrokecerebrovasdis.2019.104424" target="_blank" rel="noopener">Hassing et al., J Stroke Cerebrovasc Dis 2019;28:104424</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10672280/" target="_blank" rel="noopener">Kühne Escolà et al., J Clin Med 2023;12:7067</a>.</p></template>
<template data-pop="r47-examen-lit" data-title="Examen du langage au lit en cinq temps">
<div class="lab">Technique</div><ol><li>Discours spontané : fluence, débit, initiation, erreurs, pauses, prosodie.</li><li>Dénomination d’objets : noter les circonlocutions.</li><li>Répétition de phrases grammaticalement complexes.</li><li>Compréhension : désigner des objets, ordres simples puis complexes, questions oui ou non.</li><li>Lecture et écriture : écriture spontanée, lecture à voix haute, compréhension écrite, dictée.</li></ol>
<div class="lab">Interprétation</div><p>Les temps 1 à 4 donnent le syndrome (tableau de la partie 2). Le temps 5 sépare l’aphasie de la dysarthrie, car la lecture et l’écriture sont altérées dans l’aphasie, intactes dans la dysarthrie.</p>
<div class="lab">Pièges</div><p>Une surdité ou un trouble visuel peut simuler une aphasie. Une dysarthrie sévère peut gêner l’évaluation. Une aphasie de Wernicke peut passer pour un délire.</p>
<p class="src">Références : <a href="https://www.msdmanuals.com/fr/professional/neurologie/fonction-et-dysfonctionnement-des-lobes-cérébraux/aphasie" target="_blank" rel="noopener">Manuel MSD, Aphasie, 2025</a>.</p></template>
<template data-pop="r47-last" data-title="Language Screening Test (validation française)">
<div class="lab">Construction</div><p>Le Language Screening Test (LAST) compte cinq sous-tests et 15 items ; il se passe en environ 2 minutes, sans logopédiste. Il a été validé sur 300 patients de stroke unit et 104 patients stabilisés au Centre hospitalier universitaire de Bicêtre.</p>
<div class="lab">Performance</div><p>Sensibilité 0,98 et spécificité 1 par rapport au Boston Diagnostic Aphasia Examination, test comparateur utilisé pour la validation. Les échelles globales d’accident vasculaire cérébral ne détectent pas l’aphasie de manière fiable.</p>
<div class="lab">Limite</div><p>Le résumé seul a été lu ; le seuil pathologique n’a pas été retrouvé.</p>
<p class="src">Références : <a href="https://doi.org/10.1161/STROKEAHA.110.609503" target="_blank" rel="noopener">Flamand-Roze et al., Stroke 2011;42:1224–9</a>.</p></template>
<template data-pop="r47-last-de" data-title="Language Screening Test (validation suisse en allemand)">
<div class="lab">Étude</div><p>101 patients germanophones après un accident vasculaire cérébral, recrutés à Lucerne, Bienne, Berne et Fribourg. L’outil comprend la dénomination, la répétition, le langage automatique et la compréhension, avec deux versions parallèles (coefficient de corrélation intraclasse 0,91), une cohérence interne de 0,74 et une corrélation de 0,74 avec le Token Test court.</p>
<div class="lab">Limite</div><p>Le résumé seul a été lu ; aucun seuil diagnostique n’y est publié.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000445778" target="_blank" rel="noopener">Koenig-Bruhin et al., Cerebrovasc Dis Extra 2016;6:27–31</a>.</p></template>
<template data-pop="r47-alteplase" data-title="Altéplase (Actilyse®) : information professionnelle suisse">
<div class="lab">Source et date</div><p>Information professionnelle suisse Actilyse® (altéplase), Boehringer Ingelheim (Suisse), mise à jour de juin 2025, lue le 15 octobre 2026 dans la base de l’information professionnelle (sections indications, posologie, contre-indications spécifiques à l’accident vasculaire cérébral, mises en garde).</p>
<div class="lab">Indication et dose</div><p>Accident vasculaire cérébral ischémique aigu, chez l’adulte et dès 16 ans : 0,9 mg/kg, maximum 90 mg, dont 10 % en bolus puis le reste en 60 minutes, le plus tôt possible et au plus tard 4,5 heures après le début des symptômes, après exclusion d’une hémorragie.</p>
<div class="lab">Contre-indications spécifiques</div><p>Symptômes mineurs ou rapidement améliorés ; accident vasculaire cérébral sévère (par exemple NIHSS supérieur à 25) ; plaquettes inférieures à 100 000/mm³. Au-delà de 80 ans, le bénéfice net est positif, mais les hémorragies sont plus fréquentes.</p>
<div class="lab">Limite</div><p>La liste complète des contre-indications, les interactions et la surveillance n’ont pas été reprises ici : elles relèvent de l’information professionnelle intégrale et de la leçon sur l’accident vasculaire cérébral.</p>
<p class="src">Références : information professionnelle suisse Actilyse® (Swissmedic), juin 2025, numéro d’identification de produit 7680483130277.</p></template>
<template data-pop="r47-calcul-alteplase" data-title="Calcul de dose pour un patient de 70 kg">
<div class="lab">Dose totale</div><p>0,9 mg/kg × 70 kg = 63 mg. Ce résultat est inférieur au maximum de 90 mg.</p>
<div class="lab">Répartition</div><p>Bolus : 10 % de 63 mg = 6,3 mg. Perfusion en 60 minutes : 63 − 6,3 = 56,7 mg.</p>
<div class="lab">Plafond</div><p>Au-delà de 100 kg, 0,9 mg/kg dépasserait 90 mg : la dose est alors plafonnée à 90 mg (0,9 × 100 = 90).</p>
<div class="lab">Limite</div><p>Calcul illustratif à partir des chiffres de l’information professionnelle ; il ne remplace pas la vérification de la dose par le médecin.</p></template>
<template data-pop="r47-eso-thrombolyse" data-title="Recommandation européenne 2021 : accident vasculaire cérébral mineur invalidant">
<div class="lab">Recommandation</div><p>Pour un accident vasculaire cérébral mineur invalidant, la thrombolyse intraveineuse est recommandée (recommandation forte). Pour un accident vasculaire cérébral mineur non invalidant, elle n’est pas recommandée (recommandation faible).</p>
<div class="lab">Application</div><p>Une aphasie, même légère, qui gêne la communication du patient relève du caractère invalidant.</p>
<div class="lab">Limite</div><p>Seule la section sur l’accident vasculaire cérébral mineur a été reprise du dossier de la leçon I64 ; les autres questions de la recommandation n’ont pas été lues. L’information professionnelle suisse cite les symptômes mineurs ou rapidement améliorés parmi les contre-indications ; le cours déclare cette divergence sans la trancher.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">Berge et al., Eur Stroke J 2021;6</a>.</p></template>
<template data-pop="r47-eso-aphasie" data-title="European Stroke Organisation 2025 : rééducation de l’aphasie">
<div class="lab">Recommandations</div><ul><li>Dose totale d’au moins 20 heures (recommandation forte, qualité faible).</li><li>Intensité d’au moins 3 heures par semaine (faible).</li><li>Fréquence d’au moins 4 jours par semaine (faible).</li><li>Présentiel ou numérique (faible) ; augmentation numérique d’une thérapie en présentiel.</li><li>Individuelle ou en groupe (faible) ; le groupe en complément si l’accès individuel est limité (consensus).</li><li>Thérapie adaptée à la personne (faible, qualité très faible).</li><li>Stimulation transcrânienne à courant continu seulement dans des essais ; en clinique, logopédie seule (consensus) ; stimulation magnétique transcrânienne non évaluée.</li></ul>
<div class="lab">Délai de début</div><p>Aucun délai n’est fixé ; l’intervention précoce est associée à de plus grands gains.</p>
<div class="lab">Limite</div><p>Le texte a été lu jusqu’à 200 000 caractères : les questions 8 et suivantes et les 13 000 derniers caractères n’ont pas été lus. La recommandation ne traite ni du délai de début ni des médicaments. Elle met à jour la revue Cochrane de 2016.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098336/" target="_blank" rel="noopener">Brady et al., Eur Stroke J 2025;10(4):1189–1220</a>.</p></template>
<template data-pop="r47-cochrane" data-title="Revue Cochrane 2016 : logopédie de l’aphasie après accident vasculaire cérébral">
<div class="lab">Série</div><p>57 essais randomisés, 3002 participants.</p>
<div class="lab">Résultats</div><p>La logopédie améliore la communication fonctionnelle (différence moyenne standardisée 0,28 ; intervalle de confiance à 95 % : 0,06–0,49), la lecture, l’écriture et l’expression, par rapport à l’absence de thérapie. Il n’y a pas de différence par rapport au soutien social, mais ce dernier entraîne plus d’abandons. Les thérapies de haute intensité ou de forte dose sont meilleures, au prix de davantage d’abandons.</p>
<div class="lab">Limite</div><p>Le résumé seul a été lu. La revue est mise à jour par la recommandation européenne de 2025.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/14651858.revue Cochrane 2016.pub4" target="_blank" rel="noopener">Brady et al., Cochrane Database Syst Rev 2016;(6)</a>.</p></template>
<template data-pop="r47-rehab-suisse" data-title="Approche par phase de la rééducation (revue suisse 2013)">
<div class="lab">Phase aiguë</div><p>Deux premières semaines : stimulation et activation des fonctions langagières de l’hémisphère droit par la mélodie, le rythme et les gestes.</p>
<div class="lab">Dès la troisième semaine</div><p>Exercices spécifiques : répétition, amorçage phonémique. Une dose de 8 heures ou plus par semaine est plus efficace que 2 heures.</p>
<div class="lab">Méthodes nommées</div><p>CIAT, efficace surtout par son intensité. MIT, efficace par la parole rythmée. La revue lue emploie ces deux sigles sans en détailler le protocole, et le dossier n’en donne pas davantage. Les proches, l’entraînement autonome et les groupes complètent la prise en charge.</p>
<div class="lab">Limite</div><p>Revue narrative d’une logopédiste, datée de 2013. Les recommandations européennes de 2025 sont plus récentes pour la dose.</p>
<p class="src">Références : <a href="https://rosenfluh.ch/psychiatrie-neurologie-2013-05/sprachstoerungen-nach-schlaganfall" target="_blank" rel="noopener">Leisi, Schweizer Zeitschrift für Psychiatrie &amp; Neurologie 2013</a>.</p></template>
<template data-pop="r47-degam" data-title="Fréquences de séances rapportées d’après la ligne directrice allemande">
<div class="lab">Valeurs rapportées</div><p>1 à 2 fois par jour en phase aiguë, au moins 3 fois par semaine en phase post-aiguë, 1 à 3 fois par semaine en phase tardive ou chronique ; en intensif, ambulatoire ou hospitalier, pendant 6 à 8 semaines à raison de 1 à 2 fois par jour.</p>
<div class="lab">Limite</div><p>Ces valeurs sont rapportées de seconde main par un article de logopédistes (2021) qui cite la ligne directrice allemande « Schlaganfall » 2020, non lue directement. Elles ne sont pas une recommandation suisse et sont présentées à titre de comparaison avec les repères de 2025.</p>
<p class="src">Références : <a href="https://www.dbl-ev.de/wp-content/uploads/2025/03/21_05_38-43_Aichert_Update_Sprechapraxietherapie.pdf" target="_blank" rel="noopener">Aichert, forum:logopädie 2021;35(5):38–43</a>.</p></template>
<template data-pop="r47-stroke-unit" data-title="Stroke units suisses : critères de 2012">
<div class="lab">Critères pertinents</div><p>Selon les critères de 2012 de la société suisse de l’accident vasculaire cérébral, une stroke unit assure la logopédie dans la journée ouvrable et l’évaluation de la déglutition 24 heures sur 24.</p>
<div class="lab">Limite</div><p>Les critères plus récents de 2021 n’ont pas été lus. La source est un résumé publié en 2013, repris du dossier de la leçon I64.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3808045/" target="_blank" rel="noopener">Matis et al., J Neurosci Rural Pract 2013</a>.</p></template>
<template data-pop="r47-conduite" data-title="Aptitude à la conduite après un accident vasculaire cérébral">
<div class="lab">Ce que disent les sources</div><p>L’aphasie fait partie des troubles neuropsychologiques à évaluer après un accident vasculaire cérébral. Selon un diaporama du Réseau hospitalier neuchâtelois (2021), il n’existe pas de recommandations suisses spécifiques ; une tâche de reconnaissance associative de panneaux a été développée dans ce réseau.</p>
<div class="lab">Limite</div><p>Un diaporama de formation n’est pas une recommandation. Les textes réglementaires et le guide d’aptitude à la conduite n’ont pas pu être lus.</p>
<p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/nlg/documents/AVC_patient_jeune_Defis_SoA2021_SRenaud2.pdf" target="_blank" rel="noopener">Renaud, diaporama, Service de neurologie, Réseau hospitalier neuchâtelois, 2021</a>.</p></template>
<template data-pop="r47-profiles" data-title="PROFILES : situations de départ 19 et 99">
<div class="lab">Rattachement</div><p>PROFILES 2017 définit la situation de départ 99, « troubles de la parole ou du langage », et la situation 19, « altération de la voix (enrouement, aphonie, dysphonie) ». Le cours se rattache à la première pour R47 ; la seconde concerne la voix (R49).</p>
<div class="lab">Limite</div><p>Ce rattachement est pédagogique : il ne s’appuie pas sur une table officielle de correspondance, et la brochure n’a pas été relue en texte intégral.</p>
<p class="src">Références : PROFILES 2017, situations 19 et 99 ; <a href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener">brochure PROFILES 2017</a>.</p></template>
<template data-pop="r47-mnemo" data-title="Moyen mnémotechnique : les quatre questions du profil aphasique">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Quatre questions, dans l’ordre où le patient parle : la <b>F</b>luence (le discours est-il aisé ?), la <b>C</b>ompréhension (comprend-il ?), la <b>R</b>épétition (répète-t-il une phrase ?), la <b>D</b>énomination (nomme-t-il un objet ?). Retenir « F, C, R, D » aide à ne pas oublier une des quatre étapes.</p>
<div class="lab">Limite</div><p>Cette règle d’aide-mémoire n’est pas dans les sources ; elle ne remplace pas le tableau des syndromes.</p></template>
<template data-pop="r47-corticoides" data-title="Corticoïdes et œdème vasogénique">
<div class="lab">Ce que dit la source</div><p>Le manuel MSD signale qu’une aphasie due à une tumeur cérébrale avec œdème vasogénique peut répondre aux corticoïdes.</p>
<div class="lab">Limite</div><p>Le manuel est nord-américain : il n’est pas utilisé pour fonder une conduite. Aucune posologie ni indication n’est reprise ici ; la décision relève du traitement de la tumeur et d’une information professionnelle suisse qui n’a pas été lue dans le cadre de cette leçon.</p>
<p class="src">Références : <a href="https://www.msdmanuals.com/fr/professional/neurologie/fonction-et-dysfonctionnement-des-lobes-cérébraux/aphasie" target="_blank" rel="noopener">Manuel MSD, Aphasie, 2025</a>.</p></template>
<template data-pop="pareto-r47-bases" data-title="Pareto — Bases du cours">
<p class="ratio" data-cover="r47-0,r47-1,r47-2,r47-3,r47-4,r47-5"></p><ul><li>R47 est un code de symptôme : dès que la cause est connue, on quitte R47 (accident vasculaire cérébral, G31.0).</li><li>Aphasie = trouble du langage ; dysarthrie = trouble de l’exécution motrice, langage intact.</li><li>Quatre critères au lit : fluence, compréhension, répétition, dénomination ; classification fiable après environ quatre semaines.</li><li>Bâle-Ville : 30 % des premiers infarctus avec aphasie ; l’âge est le facteur de risque principal (+ 4 % par année).</li><li>Le langage est à gauche chez plus de 90 % des personnes ; la dysarthrie vasculaire suit le faisceau pyramidal.</li></ul></template>
<template data-pop="pareto-r47-clinique" data-title="Pareto — Clinique, urgences et prise en charge">
<p class="ratio" data-cover="r47-6,r47-7,r47-8,r47-9,r47-10,r47-11"></p><ul><li>Début brutal : accident vasculaire cérébral jusqu’à preuve du contraire ; thrombolyse dans les 4,5 heures, après exclusion d’une hémorragie.</li><li>Une aphasie invalidante, même légère, justifie d’envisager la thrombolyse.</li><li>Une dysarthrie isolée transitoire a le même risque d’accident vasculaire cérébral à 90 jours qu’un accident ischémique transitoire classique (10,6 % contre 11,6 %).</li><li>La logopédie est le traitement : au moins 20 heures, 3 heures par semaine, 4 jours par semaine (European Stroke Organisation 2025). Aucun médicament ne traite le langage.</li><li>La gravité initiale prédit la récupération, surtout acquise en 3 mois.</li></ul></template>
<template data-pop="pareto-r47-pec" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="r47-12,r47-13"></p><ul><li>Dépister le langage dès la phase aiguë (Language Screening Test), puis suivre avec l’Aphasia Rapid Test.</li><li>Chercher une source cardiaque après un infarctus avec aphasie (rapport de cotes 1,85).</li><li>Aucune donnée lue sur la grossesse : lacune déclarée.</li></ul></template>
<template data-pop="pareto-r47-synthese" data-title="Pareto — Critères et paramètres">
<p class="ratio" data-cover="r47-14,r47-15"></p><ul><li>Pièges d’examen : Wernicke prise pour un délire, dysarthrie confondue avec aphasie, thrombolyse refusée pour une aphasie « légère », R47 codé malgré une cause connue.</li><li>Critères de l’aphasie primaire progressive : déficit langagier isolé, trois variantes.</li><li>Chiffres à connaître : 30 % ; 43 pour 100 000 ; 4,5 heures ; 0,9 mg/kg ; 20 heures.</li></ul></template>
<template data-pop="pareto-r47-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="r47-e-1,r47-e-2,r47-e-3,r47-e-4,r47-e-5"></p><ul><li>Aucun examen unique : le dépistage détecte, l’imagerie localise, le bilan logopédique décrit.</li><li>Language Screening Test : environ 2 minutes ; sensibilité 0,98, spécificité 1 ; Aphasia Rapid Test au huitième jour : inférieur à 12 bon pronostic, supérieur à 21 mauvais.</li><li>L’alcoolémie ne remplace pas l’imagerie : 5 % des accidents vasculaires cérébraux réels avaient aussi bu.</li></ul></template>
<template data-pop="pareto-r47-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="r47-s-anat-cours"></p><ul><li>Aires de Broca et de Wernicke, lobule pariétal inférieur et région périsylvienne : hémisphère gauche chez plus de 90 % des personnes.</li><li>La commande de la parole suit le faisceau pyramidal et le cervelet.</li></ul></template>
<template data-pop="pareto-r47-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="r47-s-physio-cours"></p><ul><li>Quatre étages moteurs : respiration, larynx, flux d’air, articulation ; le langage est un niveau supérieur.</li><li>Langage stable chez 95 % des patients en 2, 6 ou 10 semaines selon la sévérité.</li></ul></template>
<template data-pop="pareto-r47-neuro" data-title="Pareto — Neuropathologie">
<p class="ratio" data-cover="r47-s-neuro-cours"></p><ul><li>Début brutal : cause vasculaire ; début progressif : tumeur ou dégénérescence.</li><li>Trois variantes de l’aphasie primaire progressive, codées G31.0.</li></ul></template>
<template data-pop="pareto-r47-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="r47-p-1,r47-p-2,r47-p-3"></p><ul><li>Aucun médicament ne traite le langage ; la logopédie est le traitement.</li><li>Altéplase : 0,9 mg/kg, maximum 90 mg, dans les 4,5 heures, dès 16 ans.</li><li>Divergence déclarée entre l’information professionnelle (symptômes mineurs) et la recommandation européenne (accident vasculaire cérébral mineur invalidant).</li></ul></template>
