<p>Dans cette <b>vignette fictive</b>, un homme de 68 ans est amené aux urgences par son épouse. Pendant le repas, il a cessé de trouver ses mots ; quelques minutes plus tard, ses phrases sont devenues incompréhensibles. Il n’a pas de fièvre, aucune notion de chute n’est rapportée, et l’heure à laquelle il allait bien pour la dernière fois est connue. Ces éléments permettent de poser les trois questions que ce cours apprend à ordonner.</p>
<p>La première question concerne le temps. Un trouble du langage d’installation brutale est un signe focal, c’est-à-dire le signe d’une lésion localisée du cerveau. Il évoque d’abord un accident vasculaire cérébral, car la thrombolyse intraveineuse n’est possible que dans les <b>4,5 heures</b> qui suivent le dernier moment où le patient était sans symptôme <button class="w" data-k="r47-alteplase">(information professionnelle de l’altéplase)</button>. La deuxième question distingue le niveau atteint : le <b>langage</b> (aphasie), l’<b>exécution motrice de la parole</b> (dysarthrie) ou la <b>voix</b> (catégorie voisine R49). La troisième question cherche la cause, puisque le code R47 est un code de symptôme, utilisé tant que la cause n’est pas établie.</p>
<p>Ce cours est organisé autour de ces trois questions. Il traite l’aphasie, la dysarthrie et l’apraxie de la parole, le dépistage au lit, la rééducation par la logopédie, le pronostic et les objectifs de l’examen fédéral qui s’y rattachent <button class="w" data-k="r47-profiles">(situations de départ 19 et 99 de PROFILES)</button>.</p>
<div class="key"><b>À retenir.</b> Devant un trouble acquis de la parole ou du langage, le médecin cherche d’abord l’accident vasculaire cérébral et son heure de début, puis il nomme le niveau atteint (langage, parole, voix), enfin il cherche la cause qui permettra de quitter le code de symptôme.</div>
</section>

<section class="ilot" id="r47-1"><h2><span class="n">1</span>Définitions et périmètre</h2>
<p>L’<b>aphasie</b> est un trouble acquis du langage dû à une atteinte du système nerveux central. Elle touche la compréhension, l’expression, la lecture et l’écriture, et chaque niveau de traitement du langage : la syntaxe, le lexique, la sémantique et la phonologie. Les <button class="w" data-k="r47-aphasie-def">trois définitions des sources (clinique, neurologique, anatomique)</button> se recoupent : une lésion des aires du langage, ou des faisceaux de substance blanche qui les relient, altère la production ou la compréhension des mots.</p>
<p>La <b>dysarthrie</b> est d’une autre nature. C’est un trouble moteur de la parole : la respiration, la fonction du larynx, la direction du flux d’air et l’articulation sont atteintes, d’où une parole dont la qualité et l’intelligibilité sont altérées <button class="w" data-k="r47-dysarthrie-def">(chaîne motrice de la parole)</button>. Le langage lui-même, c’est-à-dire le choix et la compréhension des mots, reste intact. L’<b>apraxie de la parole</b> est un symptôme rare, signe d’appui de la variante non fluente de l’aphasie primaire progressive <button class="w" data-k="r47-apraxie">(définition et limites)</button>.</p>
<p>La classification de référence est la <button class="w" data-k="r47-cim">CIM-10-GM</button> 2024, dans laquelle R47 appartient au bloc « Symptômes relatifs au langage et à la voix » (R47–R49). Le tableau résume les codes couverts par ce cours.</p>
<table class="t"><thead><tr><th>Code</th><th>Libellé (Office fédéral de la statistique)</th><th>Exclusions notées par l’institut allemand</th><th>Contenu du cours</th></tr></thead><tbody>
<tr><td>R47</td><td>Troubles du langage, non classés ailleurs</td><td>Autisme (F84.0–F84.1), bredouillement (F98.6), bégaiement (F98.5), troubles spécifiques du développement de la parole et du langage (F80.-)</td><td>Démarche devant un trouble acquis de la parole ou du langage</td></tr>
<tr><td>R47.0</td><td>Dysphasie et aphasie</td><td>Aphasie progressive isolée (G31.0)</td><td>Syndromes, dépistage, causes, rééducation</td></tr>
<tr><td>R47.1</td><td>Dysarthrie et anarthrie</td><td>Aucune</td><td>Types, topographie, causes</td></tr>
<tr><td>R47.8</td><td>Troubles du langage, autres et non précisés</td><td>Aucune</td><td>Apraxie de la parole et tableaux inclassables</td></tr></tbody></table>
<p>Ce tableau appelle trois remarques. Premièrement, le mot « dysphasie » du libellé ne désigne pas ici le trouble du développement de l’enfant : celui-ci est codé F80.- et exclu de R47. Deuxièmement, une aphasie progressive isolée est exclue de R47.0 et codée G31.0. Troisièmement, les codes voisins ne se confondent pas avec R47 : R48 regroupe la dyslexie et l’alexie (R48.0), l’agnosie (R48.1), l’apraxie (R48.2) et d’autres troubles de la fonction symbolique (R48.8, qui inclut l’agraphie et l’acalculie) ; R49 regroupe les troubles de la voix (dysphonie et enrouement R49.0, aphonie R49.1, hyper- et hyponasalité R49.2), à l’exclusion du trouble psychogène de la voix (F44.4).</p>
<div class="trap"><span class="k">Piège</span> Un code R décrit un symptôme. Dès que la cause est établie (infarctus, tumeur, aphasie primaire progressive), c’est la catégorie de la maladie qui s’applique. Coder R47 alors que la cause est connue est une erreur de codage et de raisonnement.</div>
<p>L’aphasie vasculaire évolue en <button class="w" data-k="r47-phases">trois phases (aiguë, post-aiguë, chronique)</button> : aiguë pendant les quatre à six premières semaines, post-aiguë dès environ quatre semaines, chronique dès environ un an. La phase aiguë de l’aphasie n’est pas la phase médicale aiguë de l’accident vasculaire cérébral.</p>
</section>

<section class="ilot" id="r47-2"><h2><span class="n">2</span>Classifications</h2>
<h3>2.1 Les syndromes aphasiques</h3>
<p>Quatre questions au lit définissent un syndrome aphasique : la <b>fluence</b> (le discours est-il facile et abondant ou laborieux ?), la <b>compréhension</b>, la <b>répétition</b> et la <b>dénomination</b>. Le tableau classe les sept syndromes en combinant ces quatre critères avec le siège habituel de la lésion, dans l’hémisphère gauche <button class="w" data-k="r47-syndromes">(lecture du tableau et limites de la classification)</button>.</p>
<table class="t"><thead><tr><th>Syndrome</th><th>Fluence</th><th>Compréhension</th><th>Répétition</th><th>Dénomination</th><th>Lésion typique</th></tr></thead><tbody>
<tr><td>Anomique (amnésique)</td><td>Fluente</td><td>Bonne</td><td>Normale</td><td>Altérée</td><td>Souvent petite, dans n’importe quelle aire du langage</td></tr>
<tr><td>Broca</td><td>Non fluente, avec effort</td><td>Relativement bonne</td><td>Altérée</td><td>Altérée</td><td>Grande lésion frontale ou fronto-pariétale incluant l’aire de Broca</td></tr>
<tr><td>Conduction</td><td>Fluente</td><td>Bonne</td><td>Altérée (paraphasies)</td><td>Altérée</td><td>Sous-corticale, sous le gyrus temporal supérieur ou le lobule pariétal inférieur</td></tr>
<tr><td>Globale</td><td>Non fluente</td><td>Mauvaise</td><td>Altérée</td><td>Très altérée</td><td>Grande lésion fronto-temporo-pariétale incluant les aires de Broca et de Wernicke</td></tr>
<tr><td>Transcorticale motrice</td><td>Non fluente</td><td>Relativement bonne</td><td>Normale</td><td>Altérée</td><td>Frontale, épargnant les aires de Broca et de Wernicke</td></tr>
<tr><td>Transcorticale sensorielle</td><td>Fluente</td><td>Mauvaise</td><td>Normale</td><td>Altérée</td><td>Temporo-pariétale, épargnant les aires de Broca et de Wernicke</td></tr>
<tr><td>Wernicke</td><td>Fluente, souvent vide de sens</td><td>Mauvaise</td><td>Altérée</td><td>Altérée</td><td>Temporo-pariétale étendue incluant l’aire de Wernicke</td></tr></tbody></table>
<p>Le tableau se lit en deux temps. Le premier critère à observer est la fluence : elle sépare les aphasies <b>non fluentes</b> (Broca, transcorticale motrice, globale, transcorticale mixte) des aphasies <b>fluentes</b> (anomique, conduction, Wernicke, transcorticale sensorielle, sous-corticale). Le deuxième critère est la répétition. Elle est normale dans les deux formes transcorticales, dont la lésion épargne les aires de Broca et de Wernicke, et altérée dans les formes qui touchent ces aires ou leurs connexions. Les <button class="w" data-k="r47-huber">symptômes directeurs des syndromes standard</button> complètent la lecture : automatismes verbaux dans l’aphasie globale, agrammatisme et apraxie de la parole dans l’aphasie de Broca, jargon et paragrammatisme dans l’aphasie de Wernicke, manque du mot dans l’aphasie amnésique.</p>
<div class="trap"><span class="k">Piège</span> Aucune classification n’est parfaite. Décrire précisément les déficits observés est souvent plus exact que d’imposer un nom de syndrome, et la classification n’est fiable qu’après environ quatre semaines, parce que les tableaux aigus changent vite. Nommer un syndrome dès le premier jour expose à une erreur.</div>
<h3>2.2 L’aphasie primaire progressive</h3>
<p>L’aphasie primaire progressive est une aphasie d’origine dégénérative, codée G31.0 et non R47.0. Un consensus international distingue <button class="w" data-k="r47-app">trois variantes (non fluente et agrammatique, sémantique, logopénique)</button>, dont les critères sont détaillés dans la dernière partie du cours. La maladie d’Alzheimer explique environ 30 % des aphasies dégénératives primaires, et certaines de ses formes ont une présentation langagière <button class="w" data-k="r47-alzheimer">(aphasies de la maladie d’Alzheimer)</button>.</p>
<h3>2.3 Les six types de dysarthrie</h3>
<p>La dysarthrie se classe selon la structure nerveuse atteinte. Cette classification est utile parce que chaque type a des traits sonores distincts, qui aident à situer la lésion <button class="w" data-k="r47-dysarthries">(structure atteinte et limites des sources)</button>.</p>
<table class="t"><thead><tr><th>Type</th><th>Structure atteinte</th></tr></thead><tbody>
<tr><td>Flasque</td><td>Motoneurone périphérique</td></tr>
<tr><td>Spastique</td><td>Motoneurone central (voies issues du cortex moteur)</td></tr>
<tr><td>Ataxique</td><td>Cervelet</td></tr>
<tr><td>Hypokinétique</td><td>Système extrapyramidal</td></tr>
<tr><td>Hyperkinétique</td><td>Système extrapyramidal</td></tr>
<tr><td>Mixte</td><td>Au moins deux systèmes, avec des traits d’au moins deux groupes</td></tr></tbody></table>
<h3>2.4 La sévérité</h3>
<p>Deux échelles mesurent la sévérité d’une aphasie vasculaire. L’<b>Aphasia Rapid Test</b> est une échelle de 26 points, réalisable en moins de trois minutes au lit du patient. L’<b>Aphasia Handicap Score</b>, gradué de 0 à 5 sur le modèle de l’échelle de Rankin, mesure le handicap dû à l’aphasie <button class="w" data-k="r47-art">(construction, seuils et usage)</button>.</p>
</section>

<section class="ilot" id="r47-3"><h2><span class="n">3</span>Fréquence</h2>
<p>La donnée suisse de référence vient de la population de Bâle-Ville. Sur une année, dans une population de 188 015 habitants, 269 premiers infarctus cérébraux ont été recensés ; 80 s’accompagnaient d’une aphasie, soit <b>30 %</b> (intervalle de confiance à 95 % : 24–36 %). L’incidence de l’aphasie attribuable à un premier infarctus est de <b>43 pour 100 000 habitants par an</b> (intervalle de confiance à 95 % : 33–52) <button class="w" data-k="r47-bale">(méthode et limites de l’étude)</button>. Le <button class="w" data-k="r47-calcul-bale">calcul de ces deux chiffres</button> montre qu’ils sont cohérents entre eux.</p>
<p>Le risque d’aphasie augmente de 4 % par année d’âge (3 % après ajustement sur la fibrillation atriale). Le sexe n’influence ni l’incidence, ni la sévérité, ni la fluence.</p>
<table class="t"><thead><tr><th>Population</th><th>Donnée</th><th>Remarque</th></tr></thead><tbody>
<tr><td>Bâle-Ville, premiers infarctus, 1 an</td><td>30 % d’aphasie ; 43 pour 100 000 par an</td><td>Étude de population, infarctus uniquement</td></tr>
<tr><td>Suisse, 2013 (revue de formation continue)</td><td>Environ 15 000 accidents vasculaires cérébraux par an ; aphasie chez environ 30 % des patients, modérée à sévère dans plus de la moitié des cas</td><td>L’accident vasculaire cérébral cause 80 % des aphasies</td></tr>
<tr><td>Suisse, 2017 (statistique hospitalière)</td><td>26 032 sorties d’hôpital pour accident vasculaire cérébral (I60–I64) ; 26 879 événements estimés</td><td>Ne donne pas l’incidence vraie</td></tr>
<tr><td>Suisse, grand public</td><td>Environ 5 000 nouveaux cas d’aphasie par an</td><td>Chiffre d’un reportage cité par le CHUV, méthode non précisée</td></tr>
<tr><td>Copenhague, 881 accidents vasculaires cérébraux aigus consécutifs</td><td>38 % d’aphasie à l’admission ; 18 % à la sortie</td><td>Données de 1995 <button class="w" data-k="r47-copenhague">(étude et lecture)</button></td></tr>
<tr><td>Europe et monde</td><td>Environ un tiers des personnes après un accident vasculaire cérébral ; plus de 4 millions de personnes avec une aphasie post-accident vasculaire cérébral en 2019 dans le monde</td><td>Synthèses de l’European Stroke Organisation et de la Cochrane</td></tr></tbody></table>
<p>Ces chiffres concordent : environ un tiers des personnes touchées par un accident vasculaire cérébral présentent une aphasie à la phase aiguë, et la proportion diminue d’environ moitié à la sortie de l’hôpital, ce qui reflète la récupération rapide des premières semaines. La fréquence de la <b>dysarthrie</b> en population n’a pas été retrouvée dans les sources lues : cette donnée est une lacune de ce cours.</p>
<div class="key"><b>À retenir.</b> En Suisse, environ 30 % des premiers infarctus cérébraux s’accompagnent d’une aphasie, l’âge est le facteur de risque principal (+ 4 % par année), et le sexe n’intervient pas.</div>
</section>
<section class="ilot" id="r47-4"><h2><span class="n">4</span>Du normal au pathologique</h2>
<h3>4.1 Le réseau normal du langage</h3>
<p>Chez le droitier et chez environ deux tiers des gauchers, le langage dépend surtout de l’hémisphère gauche ; le réseau du langage est situé à gauche chez plus de 90 % des personnes <button class="w" data-k="r47-lateralisation">(latéralisation et aires du langage)</button>. Il comprend la partie postéro-supérieure du lobe temporal (aire de Wernicke), le lobule pariétal inférieur adjacent, la partie postéro-inférieure du lobe frontal en avant du cortex moteur (aire de Broca) et leurs connexions sous-corticales. La région périsylvienne, insula comprise, appartient au territoire de l’artère cérébrale moyenne. Les noyaux gris centraux et le thalamus de l’hémisphère dominant y participent probablement.</p>
<p>La <b>prosodie</b>, c’est-à-dire la mélodie et l’intonation de la parole, dépend des deux hémisphères. Elle peut donc être altérée par une lésion de l’hémisphère non dominant seul.</p>
<h3>4.2 Pourquoi une lésion produit un profil précis</h3>
<p>Toute lésion du réseau perturbe le langage, et le profil observé (fluence, compréhension, répétition) reflète le site lésé, comme le montre le tableau de la partie 2. Une grande lésion qui détruit à la fois les aires de Broca et de Wernicke supprime l’expression et la compréhension : c’est l’aphasie globale. Une petite lésion isolée perturbe surtout l’accès au mot : c’est l’aphasie anomique. La région périsylvienne appartient au territoire de l’artère cérébrale moyenne : cette localisation anatomique explique qu’un accident vasculaire cérébral de ce territoire atteigne facilement les aires du langage, et elle s’accorde avec le fait que l’accident vasculaire cérébral est la cause d’environ 80 % des aphasies.</p>
<h3>4.3 La dysarthrie : l’exécution est atteinte, le langage est intact</h3>
<p>Dans la dysarthrie, la lésion touche la commande motrice de la parole. Dans une série d’infarctus à dysarthrie aiguë, toutes les lésions extracérébelleuses responsables siégeaient sur le trajet du faisceau pyramidal : cortex moteur inférieur (5,9 %), centre semi-ovale (23,5 %), capsule interne (8,8 %), pédoncule cérébral (1,5 %), base du pont (30,9 %) et jonction pontomédullaire (1,5 %). Des signes pyramidaux accompagnaient la dysarthrie dans 90,7 % des cas <button class="w" data-k="r47-dysarthrie-topo">(topographie, étiologie et syndromes lacunaires)</button>. Les infarctus cérébelleux isolés responsables siégeaient dans le territoire de l’artère cérébelleuse supérieure, dans la région paravermienne rostrale. La conséquence clinique est directe : une dysarthrie d’origine vasculaire s’accompagne presque toujours d’autres signes moteurs, que l’examen doit chercher.</p>
<h3>4.4 La récupération</h3>
<p>La gravité initiale et la taille de la lésion (ou l’étendue de l’hypoperfusion) sont les plus forts prédicteurs négatifs de la rémission spontanée. En phase chronique, le potentiel d’apprentissage est associé à l’intégrité de l’hippocampe et de la substance blanche voisine. Chez les patients dont l’aphasie est initialement sévère, un infarctus d’au moins 50 mL, ou une atteinte d’au moins 20 % de la jonction temporo-pariétale gauche, annonce un mauvais pronostic à trois mois <button class="w" data-k="r47-recuperation">(courbe de rémission et prédicteurs)</button>.</p>
<div class="key"><b>Science → clinique.</b> Le profil de l’aphasie localise la lésion dans l’hémisphère gauche ; la dysarthrie vasculaire suit le faisceau pyramidal. La taille de la lésion et la gravité initiale, plus que l’âge ou le sexe, prédisent la récupération.</div>
</section>

<section class="ilot" id="r47-5"><h2><span class="n">5</span>Causes et facteurs de risque</h2>
<p>L’accident vasculaire cérébral, ischémique ou hémorragique, explique environ 80 % des aphasies. Les autres causes sont lésionnelles, inflammatoires ou dégénératives. Le tableau rassemble les causes retrouvées dans les sources et l’élément qui les distingue.</p>
<table class="t"><thead><tr><th>Cause</th><th>Élément à retenir</th></tr></thead><tbody>
<tr><td>Accident vasculaire cérébral ischémique ou hémorragique</td><td>Environ 80 % des aphasies</td></tr>
<tr><td>Cardio-embolie</td><td>Plus fréquente chez les patients aphasiques après un premier infarctus (rapport de cotes 1,85 ; intervalle de confiance à 95 % : 1,07–3,20)</td></tr>
<tr><td>Traumatisme crânien</td><td>Cause d’aphasie acquise</td></tr>
<tr><td>Tumeur cérébrale</td><td>Cause d’aphasie ; un œdème vasogénique peut répondre aux corticoïdes <button class="w" data-k="r47-corticoides">(principe et limite)</button></td></tr>
<tr><td>Encéphalite, maladie inflammatoire du système nerveux central</td><td>Cause d’aphasie ; bilan étiologique spécifique</td></tr>
<tr><td>Neurodégénérescence</td><td>Aphasie primaire progressive (G31.0) et maladie d’Alzheimer à présentation langagière</td></tr>
<tr><td>Migraine avec aura</td><td>Aura du langage, entièrement réversible <button class="w" data-k="r47-aura">(critères de l’International Headache Society)</button></td></tr>
<tr><td>Dysarthrie vasculaire</td><td>Maladie des petits vaisseaux 52,9 % ; cardio-embolie 11,8 % ; maladie des gros vaisseaux 4,4 %</td></tr>
<tr><td>Dysarthrie dégénérative</td><td>Fréquente dans les maladies neurologiques progressives</td></tr>
<tr><td>Intoxication alcoolique</td><td>Dysarthrie, troubles de la marche, nystagmus ; simule un accident vasculaire cérébral postérieur</td></tr></tbody></table>
<p>Le <b>facteur de risque principal</b> de l’aphasie après un infarctus est l’âge, avec une augmentation de 4 % par année. La cardio-embolie, plus fréquente chez les patients aphasiques, incite à rechercher une source cardiaque d’emblée (partie 12). Les sources lues constatent cette association sans en détailler le mécanisme ; le cours ne la présente donc pas comme une relation causale démontrée.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Retenir l’accident vasculaire cérébral comme cause unique. Un début progressif sur des semaines ou des mois évoque une tumeur ou une aphasie primaire progressive ; une aphasie fluente avec confusion apparente peut être une aphasie de Wernicke prise pour un délire.</div>
<button class="pareto-btn ui" data-k="pareto-r47-bases">▲ Loi de Pareto — Bases du cours</button>
</section>

<section class="ilot" id="r47-6"><h2><span class="n">6</span>Anamnèse et symptômes</h2>
<p>L’interrogatoire porte sur quatre éléments : le mode d’installation, l’heure de début, les antécédents de migraine, la consommation d’alcool. Chacun a une conséquence décisionnelle précise.</p>
<div class="two"><div class="card"><h4>Mode d’installation</h4><p>Un début brutal oriente vers une cause vasculaire. Un début progressif, avec un déficit langagier isolé et prédominant et des activités quotidiennes préservées en dehors du langage, évoque une aphasie primaire progressive.</p></div>
<div class="card"><h4>Heure de début</h4><p>Il faut obtenir l’heure du début ou, à défaut, le dernier moment connu sans symptôme. Ce moment est le point de départ de la fenêtre de thrombolyse de 4,5 heures.</p></div>
<div class="card"><h4>Aura migraineuse</h4><p>Un symptôme du langage réversible de 5 à 60 minutes, qui s’étend progressivement en au moins 5 minutes, avec une céphalée dans les 60 minutes. Les patients qui ont des auras du langage ont presque toujours aussi des auras visuelles.</p></div>
<div class="card"><h4>Alcool</h4><p>La moitié des intoxications alcooliques prises pour un accident vasculaire cérébral niaient ou minimisaient leur consommation. L’interrogatoire seul ne suffit donc pas à écarter l’alcool.</p></div></div>
<p>Les <b>symptômes</b> de l’aphasie sont : le manque du mot, les paraphasies (substitution d’un mot ou d’un son par un autre), le jargon, le trouble de la compréhension, puis les troubles de l’écrit : alexie (perte de la lecture), agraphie (perte de l’écriture) et acalculie (perte du calcul). Ces trois derniers sont fréquents et souvent sous-diagnostiqués. Les patients aphasiques consultent plus tôt que les patients non aphasiques. Les fréquences relatives de ces symptômes n’ont pas été retrouvées dans les sources lues : elles constituent une lacune de ce cours.</p>
<p>Le <b>retentissement</b> est considérable : pronostic fonctionnel, psychosocial, économique et de bien-être moins bon, et dépression plus fréquente. Ce retentissement motive l’implication des proches et le recours aux associations de patients (parties 10 et 14).</p>
</section>

<section class="ilot" id="r47-7"><h2><span class="n">7</span>Examen clinique</h2>
<p>L’examen du langage s’insère dans l’examen neurologique du patient. Le langage s’examine au lit en <button class="w" data-k="r47-examen-lit">cinq temps (technique, signification, pièges)</button> ; chacun teste une fonction différente.</p>
<div class="two"><div class="card"><h4>1. Discours spontané</h4><p>On observe la fluence, le débit, l’initiation, les erreurs, les pauses et la prosodie. Ce temps distingue une aphasie fluente d’une aphasie non fluente.</p></div>
<div class="card"><h4>2. Dénomination d’objets</h4><p>On demande de nommer des objets et on note les circonlocutions, c’est-à-dire les détours qui remplacent le mot manquant.</p></div>
<div class="card"><h4>3. Répétition</h4><p>On fait répéter des phrases grammaticalement complexes. La répétition est altérée dans les syndromes de Broca, de conduction, de Wernicke et global ; elle est normale dans le syndrome anomique et dans les deux syndromes transcorticaux.</p></div>
<div class="card"><h4>4. Compréhension</h4><p>On demande de désigner des objets, d’exécuter des ordres simples puis complexes, de répondre à des questions par oui ou non. Une compréhension mauvaise oriente vers les aphasies de Wernicke, globale ou transcorticale sensorielle.</p></div>
<div class="card"><h4>5. Lecture et écriture</h4><p>On teste l’écriture spontanée, la lecture à voix haute, la compréhension écrite et la dictée. Une dysarthrie isolée laisse ces fonctions intactes, ce qui la distingue de l’aphasie.</p></div></div>
<p>La <b>déglutition</b> est évaluée lors du premier bilan de tout accident vasculaire cérébral, car la dysphagie touche plus de 50 % des patients. Une dysarthrie d’origine vasculaire s’accompagne de signes pyramidaux dans 90,7 % des cas ; son tableau le plus fréquent est le syndrome lacunaire classique (52,9 %). Les associations les plus courantes sont la dysarthrie avec main malhabile (11,7 %) et la dysarthrie avec parésie faciale et linguale centrale (10,3 %) ; la dysarthrie isolée est rare (2,9 %). Chaque <button class="w" data-k="r47-dysarthries">type de dysarthrie</button> a des traits sonores propres qui aident à situer la lésion.</p>
<div class="trap"><span class="k">Piège</span> La surdité et les troubles visuels peuvent simuler une aphasie. Avant de conclure à un trouble du langage, il faut tester l’audition et la vue. Les échelles globales d’accident vasculaire cérébral détectent mal l’aphasie : un examen du langage est nécessaire en plus.</div>
<p>La sensibilité et la spécificité des signes isolés de l’examen n’ont pas été retrouvées dans les sources lues. Le cours ne prête donc pas de valeur diagnostique chiffrée à un signe pris seul.</p>
</section>
