<div class="chap-body">
<section class="ilot" id="e25-1"><h2><span class="n">1</span>Une urgence peut précéder le résultat du dépistage</h2><p>Un garçon fictif de onze jours boit moins, vomit et perd du poids. Il paraît somnolent, sa perfusion est mauvaise et la glycémie est basse. Ses organes génitaux externes d’apparence habituelle n’excluent pas une hyperplasie congénitale des surrénales. Une crise surrénalienne avec perte de sel est une hypothèse urgente, même si le dépistage n’est pas encore disponible [<a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>La priorité est d’évaluer conscience, respiration, circulation, glycémie et électrolytes, d’appeler une équipe pédiatrique urgente et d’administrer le remplacement parentéral approprié sans attendre une confirmation génétique. Les prélèvements hormonaux sont faits avant si cela n’occasionne aucun retard dangereux. Le bilan recherche aussi sepsis et autres causes de choc [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Le cours relie les situations <button class="w" data-k="e25-profiles">PROFILES</button> d’organes génitaux atypiques, de pression anormale et de croissance/puberté inhabituelles au raisonnement. Cette correspondance est pédagogique ; les exercices ne sont pas des questions officielles [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
<div class="key"><b>À retenir.</b> Un garçon peut présenter une perte de sel sans signe génital visible. L’urgence clinique précède la confirmation étiologique [<a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-2"><h2><span class="n">2</span>Définition et formes cliniques</h2><p>La catégorie E25 regroupe les anomalies génito-surrénaliennes. Son noyau clinique est l’hyperplasie congénitale des surrénales liée à un déficit enzymatique de la stéroïdogenèse. Le déficit en 21-hydroxylase, dû à des variants de <button class="w" data-k="e25-genes">CYP21A2</button>, représente plus de 90 % des formes dans les séries de référence ; ce pourcentage ne décrit pas une fréquence suisse de toute la catégorie [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>La forme classique comprend une forme avec perte de sel et une forme virilisante simple. Toutes deux peuvent manquer de cortisol ; le déficit minéralocorticoïde et son expression clinique varient. La forme non classique possède une activité résiduelle plus importante : elle peut être asymptomatique ou se révéler par pubarche prématurée, hirsutisme, acné, troubles des règles ou difficulté à concevoir. Une révélation tardive ne signifie pas une maladie acquise [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>].</p>
<p>Les autres déficits ne reproduisent pas tous ce profil. Un déficit en 11β-hydroxylase associe volontiers excès androgénique et hypertension ; un déficit en 17α-hydroxylase/17,20-lyase peut associer hypertension et déficit en stéroïdes sexuels. Les anomalies du transport du cholestérol, de sa transformation initiale ou d’autres enzymes exigent un profil spécialisé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> Classique ne signifie pas toujours perte de sel ; non classique reste congénital. Le mécanisme enzymatique guide les signes et le traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-3"><h2><span class="n">3</span>Épidémiologie : conserver chaque dénominateur</h2><p>Le programme suisse de dépistage indique environ un syndrome adrénogénital pour 9000 nouveau-nés. C’est un chiffre d’information du dépistage, pas une mesure actuelle de toutes les anomalies E25, ni de la forme non classique souvent non repérée à la naissance [<a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>].</p>
<p>Une étude suisse publiée en 2025 a recherché rétrospectivement les variations du développement sexuel chez les personnes nées de 2000 à 2019, avec dix hôpitaux pédiatriques et huit endocrinologues privés. Parmi 561 patients identifiés, 118 étaient 46,<button class="w" data-k="e25-chromosomes">XX</button> ; la fréquence rapportée de l’hyperplasie congénitale 46,<button class="w" data-k="e25-chromosomes">XX</button> était d’une pour 7500 filles nouveau-nées. Son dénominateur est celui des filles et son mode de recrutement celui d’une cohorte clinique. On ne la compare donc pas directement au chiffre tous nouveau-nés du dépistage [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12210017/" target="_blank" rel="noopener">S7</a>].</p>
<p>Les recommandations européennes de génétique 2020 rapportent environ une forme classique pour 16 000 naissances dans de nombreuses populations, avec variations entre programmes. La revue systématique 2017 estimait 4,2 % de formes non classiques parmi des femmes sélectionnées pour excès androgénique, avec intervalle de confiance 3,2–5,4 %. Ce chiffre ne s’applique ni à toutes les femmes ni à tous les nouveau-nés suisses [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>Aucune incidence suisse contemporaine de l’ensemble E25 et de chacune de ses formes rares n’est établie dans les lectures. Les chiffres gardent leur population, leur date et leur méthode.</p>
<div class="key"><b>À retenir.</b> 1/9000 nouveau-nés, 1/7500 filles et 4,2 % de femmes hyperandrogéniques décrivent trois populations différentes [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12210017/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-4"><h2><span class="n">4</span>Du fonctionnement normal aux symptômes</h2><p>Le cortex surrénalien transforme le cholestérol en stéroïdes. La zone glomérulée produit l’aldostérone, sous contrôle surtout du système rénine–angiotensine et du potassium ; la zone fasciculée produit le cortisol et la zone réticulée des androgènes. La médulla interne produit des catécholamines. Une maladie corticale ne constitue donc pas une destruction primaire obligatoire de toutes les fonctions médullaires [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<p>Le cortisol freine l’axe hypothalamo-hypophysaire. Quand sa synthèse est insuffisante, l’hormone corticotrope augmente et stimule le cortex. Dans le déficit en 21-hydroxylase, la 17-hydroxyprogestérone s’accumule et les flux stéroïdiens favorisent les androgènes ; l’hyperplasie est une conséquence de la stimulation et ne suffit pas à préciser le déficit [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p>Le cortisol participe à la réponse au stress, au maintien du glucose et à la réponse vasculaire. Son déficit expose à l’hypoglycémie, à l’asthénie et au collapsus. L’aldostérone favorise la rétention rénale de sodium et l’excrétion de potassium : son insuffisance provoque pertes hydrosodées, hypovolémie, rénine élevée et hyperkaliémie. L’excès d’androgènes explique virilisation fœtale 46,<button class="w" data-k="e25-chromosomes">XX</button>, maturation osseuse accélérée et pubarche précoce [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Ces associations ne sont pas des lois universelles de E25 : l’accumulation de désoxycorticostérone dans certains déficits exerce au contraire un effet minéralocorticoïde et peut élever la pression. La biochimie précède donc l’attribution d’une perte de sel à toute forme rare [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/30817301/" target="_blank" rel="noopener">S11</a>].</p>
<div class="key"><b>À retenir.</b> Le déficit en cortisol explique la vulnérabilité au stress ; le profil minéralocorticoïde distingue perte de sel et hypertension [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-5"><h2><span class="n">5</span>Étiologies et diagnostics voisins</h2><table class="t" data-e25-table="1"><thead><tr><th>Hypothèse</th><th>Indices discriminants</th><th>Suite utile</th></tr></thead><tbody><tr><td>Déficit en 21-hydroxylase</td><td>17-hydroxyprogestérone et précurseurs, hyperandrogénie ± perte de sel</td><td>Profil stéroïdien puis <button class="w" data-k="e25-genes">CYP21A2</button> spécialisé.</td></tr><tr><td>Déficit en 11β-hydroxylase</td><td>Hyperandrogénie, hypertension possible, 11-désoxycortisol</td><td>Profil incluant désoxycorticostérone ; <button class="w" data-k="e25-genes">CYP11B1</button>.</td></tr><tr><td>Déficit en 17α-hydroxylase/17,20-lyase</td><td>Déficit sexuel et hypertension/hypokaliémie possibles</td><td>Profil spécialisé ; <button class="w" data-k="e25-genes">CYP17A1</button>.</td></tr><tr><td>Autres déficits : <button class="w" data-k="e25-genes">HSD3B2</button>, <button class="w" data-k="e25-genes">POR</button>, <button class="w" data-k="e25-genes">StAR</button>, <button class="w" data-k="e25-genes">CYP11A1</button></td><td>Perte de sel ou variations du développement, profils variables ; signes squelettiques possibles avec <button class="w" data-k="e25-genes">POR</button></td><td>Pas de diagnostic sur un dosage isolé ; centre spécialisé.</td></tr><tr><td>Ovaires polykystiques ou autre cause ovarienne</td><td>Hirsutisme/troubles des règles sans preuve du déficit congénital</td><td>Exclure les causes pertinentes selon chronologie et profil.</td></tr><tr><td>Tumeur surrénale/ovarienne, exposition androgénique</td><td>Installation rapide, progression marquée, exposition ou masse</td><td>Bilan orienté ; aucune attribution automatique à <button class="w" data-k="e25-nosologie">E25.8</button>.</td></tr></tbody></table>
<p>Une virilisation rapide, une hypertension sévère ou une discordance entre signes et dosage demandent de réexaminer l’hypothèse. Les infections, maladies rénales, anomalies digestives ou autres causes d’hypoglycémie restent des différentiels d’un nourrisson en mauvais état. Le sepsis et la crise surrénalienne peuvent nécessiter une prise en charge simultanée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="key"><b>À retenir.</b> L’hypertension avec excès androgénique fait chercher une autre voie que la seule 21-hydroxylase. Les tumeurs et les ovaires polykystiques gardent leur diagnostic propre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-6"><h2><span class="n">6</span>Anamnèse et communication</h2><p>Chez le nourrisson, préciser alimentation, vomissements, poids de naissance et évolution pondérale, urines, fièvre, état général, dépistage et traitements reçus. Chercher un antécédent familial de déficit enzymatique, de consanguinité ou de décès néonatal inexpliqué avec tact. Un dépistage négatif ou en attente ne clôt pas l’enquête si le tableau est grave [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Chez l’enfant, documenter courbe de croissance, âge de pubarche, progression, développement pubertaire et âge osseux antérieur. Chez l’adulte, préciser chronologie de l’hirsutisme/acné, cycles, désir de grossesse, fertilité et changements rapides. Les signes n’ont pas la même signification selon leur vitesse d’apparition [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>].</p>
<p>Pour toute personne traitée, relever le produit exact, dose, horaires, prise réelle, vomissements, maladies récentes, interventions, médicaments inducteurs/inhibiteurs et accès au traitement. Demander si le patient possède une carte, un plan de maladie et un kit injectable utilisable, et s’il sait qui appeler [<a data-reference-source="1" href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Aborder intimité, image corporelle, sexualité et difficultés familiales sans présumer identité de genre ou orientation. Expliquer le but de tout examen génital ; respecter consentement, confidentialité et possibilité d’accompagnement. Les comportements ou attirances ne sont pas des symptômes à corriger [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> La chronologie, la croissance et l’accès réel au remplacement sont aussi importants que l’étiquette génétique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e25-7"><h2><span class="n">7</span>Examen clinique et sémiologie</h2><p data-semiology-clinical="E25">La sémiologie relie chaque signe à une hypothèse et à une action. Mesurer constantes, perfusion, hydratation, conscience, poids et croissance ; examiner la pression avec une technique et des références adaptées à l’âge. L’hyperpigmentation peut orienter vers une stimulation corticotrope primaire sans être constante ni spécifique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Un nourrisson peut présenter seulement mauvaise alimentation, vomissements, perte pondérale et somnolence avant le choc. Un enfant peut grandir vite initialement, mais perdre du potentiel de taille par maturation osseuse accélérée. À l’inverse, ralentissement statural avec prise pondérale sous traitement évoque notamment un excès glucocorticoïde [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>L’examen des organes génitaux, s’il est indiqué, est expliqué et limité aux besoins cliniques. L’aspect externe seul ne détermine ni les chromosomes, ni les organes internes, ni l’identité future. Les examens répétés et photographies sans nécessité peuvent nuire. L’examen testiculaire ne suffit pas à exclure de petites inclusions surrénaliennes ; une échographie a sa place selon le suivi spécialisé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p>Les neuf volets de <button class="w" data-k="e25-semio">sémiologie : normal, signes et limites</button> détaillent cette démarche. Aucune performance diagnostique chiffrée du seul examen clinique n’est inventée.</p>
<div class="key"><b>À retenir.</b> Une anatomie externe apparemment habituelle ne rassure pas sur le cortisol. La croissance rapide et la petite taille finale peuvent relever du même excès androgénique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e25-7">Essentiel de cette partie</button></section>
