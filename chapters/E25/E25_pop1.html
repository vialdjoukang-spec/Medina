<template data-pop="e25-nosologie" data-title="Libellés de la catégorie E25 (CIM-10-GM 2024)">
<div class="lab">Libellés suisses</div><p>E25 Anomalies génito-surrénaliennes. E25.0 Anomalies génito-surrénaliennes congénitales liées à un déficit enzymatique ; E25.00 Déficit en 21-hydroxylase [SAG de type 3], forme classique ; E25.01 Déficit en 21-hydroxylase [SAG de type 3], forme tardive ; E25.08 Autres anomalies adrénogénitales congénitales liées à un déficit enzymatique ; E25.09 sans précision ; E25.8 Autres anomalies génito-surrénaliennes ; E25.9 Anomalie génito-surrénalienne, sans précision.</p>
<div class="lab">Inclusions de l’OMS</div><p>La version OMS 2019 inclut dans E25 les syndromes adrénogénitaux virilisants ou féminisants, <b>acquis</b> ou dus à une hyperplasie surrénale par déficit enzymatique congénital. Chez la fille : pseudohermaphrodisme surrénalien, pseudopuberté précoce hétérosexuelle ; chez le garçon : pseudopuberté précoce isosexuelle, macrogénitosomie précoce. E25.0 inclut l’hyperplasie congénitale des surrénales, le déficit en 21-hydroxylase et l’hyperplasie congénitale avec perte de sel ; E25.8 inclut l’anomalie adrénogénitale idiopathique.</p>
<div class="lab">Limite</div><p>Les libellés suisses ne donnent que les titres ; les inclusions viennent de la version OMS, qui n’est pas la version suisse GM. Cette leçon se concentre sur l’hyperplasie congénitale des surrénales, parce que les sources lues documentent surtout elle.</p>
<p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024, catégorie E25</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E25" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E25</a>.</p></template>
<template data-pop="e25-hcs" data-title="Hyperplasie congénitale des surrénales">
<div class="lab">Définition</div><p>Groupe de maladies autosomiques récessives de la biosynthèse du cortisol. La baisse d’activité d’une enzyme nécessaire au cortisol entraîne une stimulation chronique du cortex surrénalien et l’accumulation des précurseurs en amont du bloc.</p>
<div class="lab">Fréquence des formes</div><p>Le déficit en 21-hydroxylase, par mutations de CYP21A2, représente 90 à 99 % des cas (revue 2022) ; la brochure européenne de patients indique environ 90 %.</p>
<div class="lab">Application</div><p>Le terme HCS recouvre donc plusieurs maladies. Quand la leçon dit « HCS » sans précision, elle parle du déficit en 21-hydroxylase.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">Brochure AGS pour les parents, 4e édition 2023</a>.</p></template>
<template data-pop="e25-formes" data-title="Formes du déficit en 21-hydroxylase">
<div class="lab">Classique avec perte de sel</div><p>Activité enzymatique nulle ou minime ; déficit en cortisol et en aldostérone ; crises de perte de sel potentiellement mortelles chez le nourrisson non traité.</p>
<div class="lab">Classique virilisante simple</div><p>Activité résiduelle d’environ 1 à 5 %. Les sources lues décrivent la virilisation sans crise de perte de sel.</p>
<div class="lab">Non classique (tardive)</div><p>Activité résiduelle d’environ 20 à 50 % ; cortisol et aldostérone basaux habituellement normaux ; jusqu’à 30 % des patients ont une réponse sous-optimale du cortisol à l’ACTH.</p>
<div class="lab">Proportions</div><p>Dans la forme classique, la perte de sel représente 75 à 90 % des cas et la forme virilisante simple 0 à 25 % (brochure de patients, ordre de grandeur).</p>
<div class="lab">Mnémotechnique</div><p>« Plus l’activité résiduelle est basse, plus la présentation est précoce » : aide pédagogique, non critère officiel.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">Brochure AGS pour les parents, 4e édition 2023</a>.</p></template>
<template data-pop="e25-genotype" data-title="Groupes génotypiques de CYP21A2">
<div class="lab">Les quatre groupes</div><p>Groupe 0 : variants nuls (délétions, grandes conversions, non-sens, décalage du cadre de lecture) → perte de sel. Groupe A : variant d’épissage de l’intron 2 (c.293-13A/C&gt;G), 20 à 25 % des allèles → perte de sel ou forme virilisante simple. Groupe B : p.Ile172Asn, activité inférieure à 5 % → virilisante simple. Groupe C : p.Val281Leu, p.Pro30Leu, activité de 20 à 50 % → non classique.</p>
<div class="lab">Concordance</div><p>96 % des sujets avec deux allèles du groupe 0 ont une perte de sel ; 97 % des porteurs d’au moins un allèle C ont une forme non classique. Environ 65 à 75 % des patients sont hétérozygotes composites.</p>
<div class="lab">Interprétation prudente</div><p>Le phénotype semble suivre l’allèle le moins sévère ; cette règle est déduite des groupes et non énoncée comme telle par la source.</p>
<div class="lab">Score de Prader</div><p>Le score de Prader médian chez les filles est de 4, 4, 3 et 0 pour les groupes 0, A, B et C. La définition des stades n’a pas été lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-prader" data-title="Score de Prader (lacune)">
<div class="lab">Ce que les sources disent</div><p>Le score de Prader médian chez les filles porteuses de la forme classique est de 4, 4, 3 et 0 selon les groupes génotypiques 0, A, B et C : plus le score est élevé, plus la virilisation est marquée.</p>
<div class="lab">Lacune</div><p>La définition des stades de Prader n’a pas été lue dans les sources de cette leçon. Elle n’est donc pas reproduite : le lecteur doit consulter une source primaire avant d’utiliser la classification.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-acquis" data-title="Formes acquises de l’E25 (lacune)">
<div class="lab">Ce que dit la classification</div><p>La version OMS de l’E25 inclut des syndromes adrénogénitaux <b>acquis</b>, et le code E25.8 inclut l’anomalie adrénogénitale idiopathique ; un code de cause externe s’y ajoute si l’origine est médicamenteuse.</p>
<div class="lab">Lacune</div><p>Les tumeurs surrénaliennes virilisantes et les autres causes acquises ne sont pas documentées par une source lue. La leçon n’en décrit donc ni la présentation ni le bilan.</p>
<p class="src">Références : <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E25" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E25</a>.</p></template>
<template data-pop="e25-incidence" data-title="Incidence en Suisse">
<div class="lab">Chiffre</div><p>Le programme de dépistage néonatal suisse annonce environ 1 nouveau-né sur 9000 pour le syndrome adrénogénital, parmi quelque 87 000 naissances par an.</p>
<div class="lab">Niveau de preuve</div><p>Ce chiffre figure dans un dépliant destiné aux parents ; il ne remplace pas une publication épidémiologique. Les données internationales du dépistage sont de 1/14 000 à 1/18 000 (Suède : 1/14 260).</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://kinderklinik.insel.ch/fileadmin/Kinderklinik/Dokumente/PDFs/Neo/Elterninfo/Screening-Flyer2022_Web7_de.pdf" target="_blank" rel="noopener">Neugeborenen-Screening Schweiz, dépliant 2022</a>.</p></template>
<template data-pop="e25-dsd" data-title="Étude suisse sur les différences du développement sexuel">
<div class="lab">Résultats</div><p>Étude rétrospective 2000–2019 dans 10 hôpitaux pédiatriques et 8 cabinets : 1 fille sur 7500 a une HCS 46,XX. L’excès d’androgènes explique 84 % des différences du développement sexuel 46,XX ; le développement gonadique atypique en représente 7 % et les autres causes 9 %.</p>
<div class="lab">Limite</div><p>Seul l’abrégé a été lu. La prévalence est proche de celle du dépistage, ce qui suggère que le recensement est presque complet.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/jendso/bvaf099" target="_blank" rel="noopener">Journal of the Endocrine Society 2025, différences du développement sexuel en Suisse (abrégé)</a>.</p></template>
<template data-pop="e25-axe" data-title="ACTH et rétrocontrôle">
<div class="lab">Mécanisme</div><p>La sécrétion de cortisol est régulée surtout par l’ACTH, hormone de l’hypophyse. Quand le cortisol est suffisant, il freine la sécrétion d’ACTH ; quand il manque, ce frein disparaît.</p>
<div class="lab">Conséquence dans l’HCS</div><p>Le cortisol reste bas, l’ACTH reste élevée, et la surrénale grossit. Cette stimulation continue entretient la dérivation des précurseurs vers les androgènes.</p>
<div class="lab">Application thérapeutique</div><p>Un glucocorticoïde de remplacement apporte le cortisol manquant et freine l’ACTH ; le dosage de l’ACTH n’est cependant pas utile au suivi.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-cyp21" data-title="CYP21A2 et son pseudogène">
<div class="lab">Rôle de l’enzyme</div><p>La 21-hydroxylase convertit la progestérone en 11-désoxycorticostérone (zone glomérulée) et la 17-hydroxyprogestérone en 11-désoxycortisol.</p>
<div class="lab">Le gène</div><p>CYP21A2 est situé en 6p21.3, dans la région HLA de classe III ; un pseudogène non fonctionnel, CYP21A1P, se trouve à proximité. La plupart des mutations proviennent de conversions géniques depuis ce pseudogène.</p>
<div class="lab">Limite</div><p>L’ordre exact des gènes sur le chromosome n’est pas détaillé dans les sources lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-backdoor" data-title="Voie alternative (« backdoor »)">
<div class="lab">Principe</div><p>La dihydrotestostérone peut aussi naître d’une voie dite alternative qui contourne les intermédiaires classiques. Elle contribue à l’excès d’androgènes quand les précurseurs s’accumulent.</p>
<div class="lab">Limite</div><p>Les sources lues mentionnent l’existence de cette voie sans en détailler les étapes ; cette leçon ne les décrit pas.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-perte-sel" data-title="Mécanisme de la perte de sel">
<div class="lab">Cause</div><p>Le déficit en aldostérone fait perdre du sodium et de l’eau par le rein.</p>
<div class="lab">Conséquence</div><p>La pression artérielle chute, le potassium s’accumule (hyperkaliémie) et peut provoquer des arythmies, voire un arrêt cardiaque. La rénine est élevée. La crise associe hyponatrémie, hyperkaliémie, acidose et choc.</p>
<div class="lab">Application</div><p>Le traitement associe un glucocorticoïde d’urgence, des liquides par voie intraveineuse, puis un minéralocorticoïde et du chlorure de sodium au long cours.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">Brochure AGS pour les parents, 4e édition 2023</a>.</p></template>
<template data-pop="e25-croissance" data-title="Androgènes, croissance et taille finale">
<div class="lab">Mécanisme</div><p>L’excès d’androgènes accélère la croissance somatique et la maturation du squelette, ce qui réduit la taille adulte finale.</p>
<div class="lab">Chiffres</div><p>Chez l’adulte classique (plus de 1000 patients), la taille finale est inférieure d’environ 1,03 écart-type (environ 7 cm) à la taille cible parentale.</p>
<div class="lab">Application</div><p>L’âge osseux annuel dès 2 ans et la courbe de croissance servent à juger l’équilibre du traitement.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-autres-deficits" data-title="Autres déficits enzymatiques (E25.08)">
<div class="lab">3β-hydroxystéroïde déshydrogénase de type 2</div><p>Rapport 17-OH-prégnénolone sur 17-hydroxyprogestérone (Δ5/Δ4) supérieur à 8 écarts-types ; anomalies du développement sexuel dans les deux sexes.</p>
<div class="lab">17α-hydroxylase</div><p>Rare sauf au Brésil et en Chine ; phénotype féminin chez le 46,XY et infantilisme sexuel.</p>
<div class="lab">POR</div><p>Électrolytes et minéralocorticoïdes normaux, cortisol presque normal mais mauvaise réponse à l’ACTH ; anomalies génitales et squelettiques variables (syndrome d’Antley-Bixler).</p>
<div class="lab">StAR et CYP11A1</div><p>Production stéroïdienne presque nulle ; fœtus 46,XY de phénotype féminin ; surrénales très volumineuses dans l’HCS lipoïde, pas dans le déficit en CYP11A1.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-11bohd" data-title="Déficit en 11β-hydroxylase">
<div class="lab">Mécanisme</div><p>Déficit en cortisol, virilisation féminine et excès de désoxycorticostérone, qui cause une <b>hypertension minéralocorticoïde</b>.</p>
<div class="lab">Fréquence</div><p>Deuxième cause d’HCS (5 à 8 %), incidence d’environ 1 sur 100 000, non incluse dans le dépistage néonatal.</p>
<div class="lab">Présentation</div><p>Hypertension, grande taille, pseudopuberté précoce, âge osseux très avancé, TART dès l’enfance. La 17-hydroxyprogestérone peut être élevée chez le nouveau-né, d’où une confusion avec le déficit en 21-hydroxylase.</p>
<div class="lab">Application</div><p>Un enfant virilisé et hypertendu ne s’explique pas par le seul déficit en 21-hydroxylase.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://doi.org/10.1515/jpem-2018-0298" target="_blank" rel="noopener">Journal of Pediatric Endocrinology and Metabolism 2019, déficit en 11β-hydroxylase (abrégé)</a>.</p></template>
<template data-pop="e25-cah-x" data-title="Syndrome CAH-X">
<div class="lab">Définition</div><p>Délétion contiguë qui emporte CYP21A2 et le gène TNXB voisin.</p>
<div class="lab">Signes associés</div><p>Hypermobilité articulaire, arthralgies, subluxations, hernies et anomalies cardiaques, en plus de l’HCS.</p>
<div class="lab">Application</div><p>Chez un patient avec HCS et hypermobilité, ce syndrome est une hypothèse à discuter avec l’équipe de génétique.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-ambigu" data-title="Organes génitaux externes atypiques du nouveau-né 46,XX">
<div class="lab">Fait</div><p>L’HCS est la première cause d’organes génitaux atypiques chez le nouveau-né 46,XX.</p>
<div class="lab">Démarche</div><p>On cherche une HCS par le dosage de 17-hydroxyprogestérone, car une forme classique avec perte de sel menace la vie dès les premières semaines. Le score de Prader décrit la virilisation (<button class="w" data-k="e25-prader">lacune</button>).</p>
<div class="lab">Limite</div><p>Le détail de la prise en charge d’un nouveau-né aux organes génitaux atypiques (information des parents, assignation) n’a pas été lu dans les sources ; il relève d’une équipe spécialisée.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://doi.org/10.1016/S0140-6736(22)01330-7" target="_blank" rel="noopener">Auer et al., The Lancet 2023 (abrégé)</a>.</p></template>
<template data-pop="e25-crise-j" data-title="Chronologie de la crise de perte de sel">
<div class="lab">Garçon</div><p>Organes génitaux normaux ; sans dépistage, la crise survient le plus souvent entre <b>10 jours et 3 semaines</b> de vie.</p>
<div class="lab">Filles et garçons peu virilisés</div><p>Les garçons virilisants simples et les filles peu virilisées sont diagnostiqués plus tard dans l’enfance.</p>
<div class="lab">Application</div><p>Le dépistage néonatal suisse (J3–J4) vise à identifier la maladie avant la première crise.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">Brochure AGS pour les parents, 4e édition 2023</a>.</p></template>
<template data-pop="e25-pubarche" data-title="Pubarche précoce et forme non classique">
<div class="lab">Présentation</div><p>Pubarche précoce, accélération de croissance et âge osseux avancé.</p>
<div class="lab">Piège</div><p>Une puberté précoce centrale peut compliquer un contrôle prolongé insuffisant de la forme classique ; à distinguer de la forme non classique de l’enfant.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://doi.org/10.1093/humupd/dmx014" target="_blank" rel="noopener">Carmina et al., Human Reproduction Update 2017 (abrégé)</a>.</p></template>
<template data-pop="e25-nc-clin" data-title="Forme non classique : présentation">
<div class="lab">Signes</div><p>Hirsutisme, acné, tableau de type SOPK, oligo-ovulation et problèmes de fertilité chez l’adolescente et l’adulte. L’homme consulte rarement, et la plupart des cas masculins ne sont jamais diagnostiqués.</p>
<div class="lab">Limite</div><p>Les troubles menstruels et les TART sont prédits par les androgènes 11-oxygénés (revue 2022).</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://doi.org/10.1093/humupd/dmx014" target="_blank" rel="noopener">Carmina et al., Human Reproduction Update 2017 (abrégé)</a> ; <a href="https://doi.org/10.1530/EJE-18-0712" target="_blank" rel="noopener">European Journal of Endocrinology 2019, forme non classique (abrégé)</a>.</p></template>
<template data-pop="e25-tart" data-title="Tumeurs surrénaliennes testiculaires (TART)">
<div class="lab">Fréquence</div><p>Chez l’homme classique, la prévalence va de 14 à 86 % selon les séries ; en moyenne 25 % des adolescents et 46 % des hommes. Elles sont souvent bilatérales.</p>
<div class="lab">Surveillance</div><p>Échographie scrotale tous les 2 à 5 ans chez l’homme classique ; non systématique dans la forme non classique.</p>
<div class="lab">Limite</div><p>Les sources lues ne précisent pas le traitement des TART.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-depistage" data-title="Dépistage néonatal suisse">
<div class="lab">Protocole</div><p>Prélèvement au talon le 3e ou le 4e jour de vie, sur papier filtre, envoyé au laboratoire de dépistage de Zurich. Le syndrome adrénogénital figure parmi les maladies dépistées ; les frais sont couverts par l’assurance de base.</p>
<div class="lab">Limite</div><p>Le dépliant parle du 3e ou du 4e jour, la page d’accueil du 4e jour : une légère divergence que le lecteur doit vérifier auprès du programme. La date d’introduction du dépistage de l’AGS en Suisse n’a pas été lue.</p>
<div class="lab">Application</div><p>Un dépistage positif impose la confirmation hormonale et le génotypage ; il ne remplace pas la recherche clinique de signes de crise.</p>
<p class="src">Références : <a href="https://kinderklinik.insel.ch/fileadmin/Kinderklinik/Dokumente/PDFs/Neo/Elterninfo/Screening-Flyer2022_Web7_de.pdf" target="_blank" rel="noopener">Neugeborenen-Screening Schweiz, dépliant 2022</a> ; <a href="https://www.neoscreening.ch" target="_blank" rel="noopener">Neugeborenen-Screening Schweiz, page d’accueil</a>.</p></template>
<template data-pop="e25-17ohp" data-title="Interpréter la 17-hydroxyprogestérone">
<div class="lab">Physiologie</div><p>La 17-hydroxyprogestérone est physiologiquement haute après la naissance ; l’exactitude du test est mauvaise les deux premiers jours.</p>
<div class="lab">Méthode</div><p>Le dépistage utilise un immunoessai sur sang séché. Le second niveau par spectrométrie de masse améliore la valeur prédictive positive (67 à 71 %).</p>
<div class="lab">Limite</div><p>Des valeurs normales par âge en nmol/l ne figurent pas dans les sources lues ; le laboratoire fournit ses intervalles.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-vpp" data-title="Valeur prédictive positive et second niveau">
<div class="lab">Chiffres</div><p>Valeur prédictive positive suédoise du dépistage de premier niveau : 25 % chez le nouveau-né à terme contre 1,4 % chez le prématuré. Avec un second niveau par spectrométrie de masse (21-désoxycortisol, rapports stéroïdiens), elle atteint 67 à 71 %.</p>
<div class="lab">Application</div><p>Un dépistage positif chez un prématuré a donc plus souvent un faux résultat qu’un vrai positif.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-test-acth" data-title="Test à l’ACTH (cosyntropine)">
<div class="lab">Place</div><p>Étalon-or de la forme non classique ; le diagnostic définitif retient une 17-hydroxyprogestérone ≥ 10 ng/ml (30 nmol/l), basale ou après stimulation. Le génotypage est recommandé.</p>
<div class="lab">Lacune</div><p>La dose du test (250 µg) et le moment (phase folliculaire matinale) n’ont pas été lus dans une source de cette leçon.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/humupd/dmx014" target="_blank" rel="noopener">Carmina et al., Human Reproduction Update 2017 (abrégé)</a> ; <a href="https://doi.org/10.1530/EJE-18-0712" target="_blank" rel="noopener">European Journal of Endocrinology 2019, forme non classique (abrégé)</a>.</p></template>
<template data-pop="e25-seuils-nc" data-title="Seuils de 17-hydroxyprogestérone de la forme non classique">
<div class="lab">Dépistage</div><p>17-hydroxyprogestérone basale ≥ 2 ng/ml (6 nmol/l) en l’absence de seuil local.</p>
<div class="lab">Diagnostic</div><p>17-hydroxyprogestérone ≥ 10 ng/ml (30 nmol/l), basale ou après cosyntropine. Génotypage de CYP21A2 pour la confirmation et le conseil génétique.</p>
<div class="lab">Piège</div><p>Ces seuils sont ceux d’une revue systématique ; les laboratoires locaux peuvent avoir leurs propres seuils.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/humupd/dmx014" target="_blank" rel="noopener">Carmina et al., Human Reproduction Update 2017 (abrégé)</a>.</p></template>
<template data-pop="e25-diff-sopk" data-title="Différentiel avec le SOPK">
<div class="lab">Fréquence</div><p>La forme non classique est trouvée chez 4,2 % (IC 95 % 3,2 à 5,4) des femmes qui consultent pour hyperandrogénie.</p>
<div class="lab">Biologie</div><p>Les androgènes 11-oxygénés sont environ deux fois plus élevés dans la forme non classique que dans le SOPK, mais ne suffisent pas seuls au diagnostic.</p>
<div class="lab">Application</div><p>Chez toute femme hyperandrogène, la 17-hydroxyprogestérone basale permet de ne pas manquer la forme non classique.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://doi.org/10.1093/humupd/dmx014" target="_blank" rel="noopener">Carmina et al., Human Reproduction Update 2017 (abrégé)</a>.</p></template>
<template data-pop="e25-biomarqueurs" data-title="Biomarqueurs stéroïdiens">
<div class="lab">21-désoxycortisol</div><p>S’accumule dans le déficit en 21-hydroxylase ; utilisé au second niveau du dépistage.</p>
<div class="lab">Androgènes 11-oxygénés</div><p>Mieux corrélés à la taille surrénalienne que l’androstènedione ou la 17-hydroxyprogestérone ; prédictifs de troubles menstruels et de TART.</p>
<div class="lab">Rapports</div><p>Rapport Δ5/Δ4 pour le déficit en 3β-HSD2 ; 11-désoxycortisol pour le déficit en 11β-hydroxylase, parfois dosé rétrospectivement sur la carte de dépistage.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://doi.org/10.1515/jpem-2018-0298" target="_blank" rel="noopener">Journal of Pediatric Endocrinology and Metabolism 2019, déficit en 11β-hydroxylase (abrégé)</a>.</p></template>
<template data-pop="e25-crise" data-title="Crise surrénalienne ou de perte de sel">
<div class="lab">Reconnaissance</div><p>Hyponatrémie, hyperkaliémie, acidose et choc chez un patient connu ou suspect d’HCS.</p>
<div class="lab">Traitement</div><p>Hydrocortisone 100 mg en bolus, puis liquides par voie intraveineuse et glucose si hypoglycémie. L’information professionnelle de Solu-Cortef indique l’hydrocortisone dans l’insuffisance corticosurrénalienne aiguë et l’HCS : jusqu’à 100 mg IV en 30 secondes ou plus ; chez l’enfant, ne pas descendre sous 25 mg/jour.</p>
<div class="lab">Fréquence</div><p>4,9 à 6,5 crises pour 100 années-patients dans les études allemandes, 2,6 pour 100 dans l’étude multicentrique ; 42 % des décès d’une cohorte suédoise.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; Information professionnelle suisse Solu-Cortef, octobre 2025.</p></template>
<template data-pop="e25-stress" data-title="Règles de stress (revue 2022, brochure, informations suisses)">
<div class="lab">Revue 2022</div><p>Enfant fébrile au-dessus de 39 °C : 3 fois la dose en 4 prises ; maladie mineure (au-dessus de 38 °C) : 2 à 3 fois. Adulte : maladie majeure 20 mg 3 fois par jour par voie orale, mineure 10 mg 3 fois par jour ; chirurgie majeure 50 à 100 mg IV puis 100 à 200 mg par 24 heures.</p>
<div class="lab">Brochure européenne</div><p>Au-dessus de 38,5 °C : ×2 ; au-dessus de 39 °C : ×3 ; au-dessus de 40 °C : ×5. En cas de vomissements : répéter la prise, suppositoire ou injection d’urgence de 100 mg de prednisone ou de prednisolone, consultation.</p>
<div class="lab">Informations suisses</div><p>Doubler, voire tripler la dose en maladie intercurrente ; passer en parentéral si le stress est intense (Alkindi, Galepharm) ; schémas périopératoires de 100 mg IV puis 100 mg toutes les 6 heures (Solu-Cortef).</p>
<div class="lab">Limite</div><p>Les schémas diffèrent ; voir l’<button class="w" data-k="e25-arbitrage-stress">arbitrage</button>.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">Brochure AGS pour les parents, 4e édition 2023</a> ; Information professionnelle suisse Alkindi, février 2025 ; Information professionnelle suisse Hydrocortisone Galepharm, août 2025 ; Information professionnelle suisse Solu-Cortef, octobre 2025.</p></template>
<template data-pop="e25-arbitrage-stress" data-title="Arbitrage entre schémas de stress">
<div class="lab">Divergence</div><p>La revue de 2022 propose pour la chirurgie majeure 50 à 100 mg IV puis 100 à 200 mg par 24 heures ; l’information professionnelle de Solu-Cortef (octobre 2025) propose 100 mg IV puis 100 mg toutes les 6 heures. La brochure européenne gradue le doublement ou le triplement par la température.</p>
<div class="lab">Arbitrage</div><p>Selon la règle du projet, la source primaire applicable la plus récente l’emporte : pour un produit suisse, l’information professionnelle actuelle. La revue de 2022 reste un repère de pratique internationale. Le lecteur applique le protocole de son institution.</p>
<div class="lab">Limite</div><p>Aucune recommandation de la Société suisse d’endocrinologie et de diabétologie spécifique à l’HCS n’a été lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">Brochure AGS pour les parents, 4e édition 2023</a> ; Information professionnelle suisse Solu-Cortef, octobre 2025.</p></template>
<template data-pop="e25-carte" data-title="Carte d’urgence et trousse">
<div class="lab">Contenu</div><p>Chaque patient dispose d’une carte d’urgence européenne et d’une trousse contenant une ampoule d’hydrocortisone.</p>
<div class="lab">Limite</div><p>Source : brochure de patients, non recommandation professionnelle ; contexte allemand.</p>
<p class="src">Références : <a href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">Brochure AGS pour les parents, 4e édition 2023</a>.</p></template>
<template data-pop="e25-gc-long" data-title="Sous- et surtraitement">
<div class="lab">Sous-traitement</div><p>ACTH et androgènes restent élevés : virilisation, avance osseuse, risque de crise en cas de stress.</p>
<div class="lab">Surtraitement</div><p>Obésité, insulinorésistance, hypertension, ostéoporose et fractures ; chez l’enfant, prise de poids excessive et ralentissement de la croissance.</p>
<div class="lab">Application</div><p>La dose minimale efficace, contrôlée par la clinique et les cibles biologiques, est l’objectif.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://doi.org/10.1530/EJE-18-0712" target="_blank" rel="noopener">European Journal of Endocrinology 2019, forme non classique (abrégé)</a> ; Information professionnelle suisse Alkindi, février 2025.</p></template>
<template data-pop="e25-prenatal" data-title="Traitement prénatal par dexaméthasone">
<div class="lab">Principe</div><p>Dexaméthasone prénatale 20 µg/kg/j (maximum 1,5 mg/j) avant 6–7 semaines d’aménorrhée. Elle reste <b>controversée et expérimentale</b>.</p>
<div class="lab">Chiffres</div><p>Environ 8 grossesses sont traitées pour chaque fille atteinte qui en bénéficie ; le sexage fœtal par ADN libre est possible dès 6–9 semaines ; le diagnostic préimplantatoire est disponible.</p>
<div class="lab">Limite</div><p>Aucune recommandation suisse n’a été lue sur ce point.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-chir" data-title="Chirurgie génitale et cadre légal">
<div class="lab">Fait</div><p>La chirurgie génitale n’est plus considérée comme une urgence ; son moment reste controversé (revue 2022).</p>
<div class="lab">Cadre légal</div><p>La brochure rapporte, pour l’Allemagne, un encadrement des interventions d’assignation sexuelle sur enfants non capables de discernement depuis le 22 mai 2021 ; cette législation n’est pas suisse.</p>
<div class="lab">Lacune</div><p>Le cadre légal suisse n’a pas été lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">Brochure AGS pour les parents, 4e édition 2023</a>.</p></template>
<template data-pop="e25-suivi-cibles" data-title="Cibles de suivi">
<div class="lab">Cibles</div><p>17-hydroxyprogestérone matinale de 100 à 1200 ng/dl (3 à 36 nmol/l) ; androstènedione, testostérone, rapport androstènedione/testostérone.</p>
<div class="lab">Examens périodiques</div><p>Rénine, tension et électrolytes pour la fludrocortisone ; âge osseux annuel dès 2 ans ; densité osseuse tous les 3 à 5 ans si fortes doses ; échographie scrotale tous les 2 à 5 ans chez l’homme classique. Le dosage de l’ACTH est inutile.</p>
<div class="lab">Fréquence</div><p>Tous les 3 mois avant 18 mois, ensuite tous les 4 à 6 mois.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-fertilite" data-title="Fertilité">
<div class="lab">Hommes</div><p>Taux d’enfants de 0,07 contre 0,34 chez les témoins (Finlande).</p>
<div class="lab">Femmes</div><p>25,4 % ont accouché contre 45,8 % des témoins (Suède).</p>
<div class="lab">Limite</div><p>Données nordiques ; l’extrapolation à la Suisse n’est pas démontrée.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-mnemo" data-title="Repère mnémotechnique (aide pédagogique, non critère officiel)">
<div class="lab">Repère</div><p>« Un blocage, trois conséquences » : cortisol et aldostérone en moins, androgènes en plus. Le traitement suit : cortisol, parfois aldostérone, et surveillance des androgènes.</p>
<div class="lab">Mention</div><p>Ceci est une aide pédagogique, non un critère officiel.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
