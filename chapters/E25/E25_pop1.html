<template data-pop="e25-semio" data-title="Sémiologie structurée E25"><p>Le volet Sciences s’ouvre sur la sémiologie : fonction normale, signes, mécanismes, examen, interprétation, différentiels, urgence, limites et sources. Un signe choisit une action, il ne remplace pas la confirmation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</template>
<template data-pop="e25-alkindi" data-title="Hydrocortisone en granulés — FI suisse février 2025"><div class="lab">Produit et indication</div><p>Alkindi contient l’hydrocortisone en granulés dans des capsules à ouvrir de 0,5, 1, 2 ou 5 mg. La FI couvre la substitution de l’insuffisance corticosurrénale de la naissance à moins de dix-huit ans. Le récepteur glucocorticoïde médie les effets de remplacement et le rétrocontrôle ; un minéralocorticoïde peut rester nécessaire [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Dose, voie et durée</div><p>La FI donne habituellement 8–10 mg/m²/j pour l’insuffisance et 10–15 mg/m²/j pour l’hyperplasie, répartis en trois ou quatre prises. La réponse individuelle, la croissance et les résultats guident l’adaptation ; ce repère n’est pas un maximum universel. La substitution d’une forme classique est prolongée, avec réévaluations, et ne s’interrompt pas par défaut [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Manipulation</div><p>Ouvrir la capsule ; ne pas avaler son enveloppe, ni mâcher les granulés. Administrer directement sur la langue, à la cuillère ou sur un aliment mou froid/à température ambiante, consommé dans les cinq minutes, puis boire pour avaler tous les granulés. Ne pas les mélanger à un liquide et ne pas administrer par sonde nasogastrique, qui pourrait s’obstruer. Des résidus dans les selles ne prouvent pas un échec et ne justifient pas une dose supplémentaire [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Maladie et changement de préparation</div><p>La FI décrit doublement ou triplement transitoire dans un stress léger selon le plan ; maladie sévère, vomissements ou impossibilité d’absorber exigent le relais parentéral sans retard et une évaluation urgente. Ce schéma ne se cumule pas automatiquement avec le total de maladie proposé par consensus de la société britannique d’endocrinologie et diabétologie pédiatriques. Après passage d’une préparation composée aux granulés, la précision peut changer ; une insuffisance dans la première semaine est possible et le suivi est renforcé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="lab">Contre-indications, risques et interactions</div><p>Hypersensibilité, dysphagie et prématuré ne pouvant s’alimenter par voie orale contre-indiquent cette préparation. Prise pondérale avec ralentissement statural, hypertension, troubles osseux ou visuels peuvent signaler une surexposition. Le sous-remplacement expose à la crise. Les doses substitutives ne constituent pas une immunosuppression interdisant à elles seules les vaccins vivants [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<p>Inducteurs du <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">CYP3A4</a>, notamment rifampicine et carbamazépine, peuvent réduire l’effet et provoquer une insuffisance ; inhibiteurs tels que certains azolés ou ritonavir peuvent augmenter l’exposition. Surveillance et adaptation sont nécessaires. Aucun ajustement rénal ou hépatique forfaitaire non documenté n’est inventé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Grossesse et allaitement</div><p>La substitution hydrocortisonée peut être utilisée si nécessaire avec surveillance ; ces données ne rendent pas ce produit pédiatrique automatiquement indiqué chez toute adulte. Les conditions d’une autre formulation et celles de la fludrocortisone restent distinctes [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e25-galepharm" data-title="Hydrocortisone comprimé — FI suisse août 2025"><div class="lab">Produit et rôle</div><p>Hydrocortisone Galepharm est un comprimé de 10 mg sécable. Il remplace le cortisol et peut freiner l’excès de stimulation corticotrope. La FI cite une dose usuelle de 10–30 mg/j pour le syndrome adrénogénital ; la substitution d’une insuffisance chronique est décrite à 10–20 mg/j, avec complément minéralocorticoïde/sel si nécessaire. Ces contextes ne se remplacent pas par une dose anti-inflammatoire générique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
<div class="lab">Schéma et individualisation</div><p>Voie orale au cours des repas ; la FI répartit le total en une ou plusieurs prises, jusqu’à trois ou quatre selon l’indication. La répartition et la dose sont personnalisées selon besoins, symptômes et contrôle biologique. Aucun maximum spécifique E25 universel n’est établi à partir d’une simple fourchette. La durée de substitution classique est prolongée et l’arrêt intempestif expose à la crise. Les données Swisspeddose ajoutées après la FI par l’outil sont une source distincte ; elles ne sont pas attribuées au texte réglementaire [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
<div class="lab">Adaptations et précautions</div><p>La FI ne demande pas d’adaptation rénale systématique ; insuffisance hépatique sévère ou hypothyroïdie peuvent ralentir le métabolisme et demander réduction. L’état clinique et le suivi gardent priorité. Fièvre importante, intervention, traumatisme et vomissements appellent un plan de stress avec relais parentéral si l’absorption manque [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Les précautions générales des corticostéroïdes dépendent de dose et durée : infections, troubles métaboliques, pression, os, yeux et effets psychiques méritent surveillance. L’hypersensibilité au produit doit être vérifiée ; on ne transpose pas une contre-indication destinée à une forte dose immunosuppressive à l’abandon d’un remplacement vital [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
<div class="lab">Interactions et populations</div><p>Inducteurs/inhibiteurs enzymatiques et traitements modifiant glucose, potassium ou coagulation peuvent demander adaptation ; la liste réelle des médicaments est revue. La grossesse exige une indication et un suivi ; à doses pharmacologiques/élevées, la FI demande d’interrompre l’allaitement. La substitution et les préparations ont des limites propres, à distinguer des recommandations générales [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
</template>
<template data-pop="e25-solucortef" data-title="Hydrocortisone injectable — FI suisse octobre 2025"><div class="lab">Rôle et produit</div><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">Solu-Cortef</a> est une préparation injectable de succinate sodique d’hydrocortisone. Les ampoules à deux compartiments contiennent 100 mg ou 250 mg de poudre, chacun avec 2 ml de solvant ; ils ne délivrent donc pas la même concentration après reconstitution. La FI indique notamment le choc par insuffisance corticosurrénale. En urgence la FI préfère la voie intraveineuse ; la voie intramusculaire peut être utilisée selon les conditions. Le dispositif, la concentration reconstituée et la dose à prélever sont vérifiés avant usage. La reconstitution est aseptique ; le produit est à usage unique, à utiliser de préférence immédiatement et au plus tard dans les quatre heures à 15–25 °C selon la FI. Les restes sont éliminés. Une voie intrathécale mentionnée pour d’autres indications n’est jamais une voie de traitement de la crise E25 [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<div class="lab">Doses : ne pas confondre les sources</div><p>La FI décrit des doses initiales individualisées jusqu’à 100 mg intraveineuse en au moins trente secondes, puis selon l’état et des intervalles pouvant être de deux, quatre ou six heures. Des doses d’au moins 500 mg doivent être injectées en au moins dix minutes. Ces indications générales ne fixent pas un bolus de 100 mg pour tout nouveau-né ; le repère consensus de la société britannique d’endocrinologie et diabétologie pédiatriques pédiatrique par âge ou poids est cité séparément [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p>Les schémas périopératoires de la FI peuvent différer des consensus spécialisés. Le cours ne compose pas un protocole en mélangeant leurs doses. L’anesthésiste et l’endocrinologue choisissent le schéma adapté, avec suite, surveillance et transition orale. Le bolus initial ne remplace pas la poursuite du traitement, les fluides, la correction du glucose et la recherche du facteur déclenchant [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<div class="lab">Contre-indications et précautions</div><p>La FI liste hypersensibilité, voie épidurale et certaines limites de voies ; l’intramusculaire est contre-indiquée en cas de purpura thrombopénique idiopathique. Les vaccins vivants sont contre-indiqués aux doses immunosuppressives. Les voies, la situation vitale et la substitution sont examinées avec précision, sans utiliser une précaution générale pour laisser une crise sans traitement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p>Effets possibles : hyperglycémie, rétention hydrosodée, troubles du potassium, infections, effets psychiques, osseux ou oculaires selon dose/durée. Interactions et compatibilités doivent être vérifiées. La fonction rénale ne demande pas d’ajustement systématique ; une atteinte hépatique sévère ou hypothyroïdie peut réduire le métabolisme. La grossesse et le nouveau-né demandent une évaluation propre [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p>Le traitement d’urgence est bref dans cette forme, puis relayé selon récupération et maladie de fond. Une forme classique reste dépendante d’un remplacement durable ; la fin de l’injection n’est pas la fin de toute substitution [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
</template>
<template data-pop="e25-florinef" data-title="Fludrocortisone 0,1 mg — FI suisse mars 2026"><table class="t" data-e25-table="1"><thead><tr><th>Population</th><th>Dose orale de la FI</th><th>Interprétation</th></tr></thead><tbody><tr><td>Adulte</td><td>0,1 mg trois fois/semaine à 0,2 mg/j ; usuelle 0,1 mg/j</td><td>Ajuster à pression, électrolytes et clinique.</td></tr><tr><td>12–18 ans</td><td>Dose adulte</td><td>Pas confusion avec hydrocortisone.</td></tr><tr><td>0–12 ans</td><td>2–5 µg/kg/j</td><td>Divergence avec certains repères néonataux spécialisés.</td></tr><tr><td>Hypertension transitoire sous traitement</td><td>La FI cite réduction à maximum 0,05 mg/j</td><td>Réévaluation clinique ; ne pas appliquer comme règle isolée à toute hypertension.</td></tr></tbody></table>
<div class="lab">Rôle et divergence explicite</div><p>Florinef est une fludrocortisone orale de 0,1 mg indiquée notamment dans l’insuffisance primaire marquée et le syndrome adrénogénital avec perte de sel. Elle favorise rétention sodée et excrétion potassique, mais ne remplace pas seule le cortisol [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<p>La revue spécialisée cite souvent 100–200 µg/j chez le nourrisson, parfois davantage en résistance rénale néonatale ; cela peut être très différent de 2–5 µg/kg/j. Les chiffres gardent leurs sources et populations. Le cours ne fabrique ni moyenne ni schéma par défaut : prescription, formulation, justification et surveillance doivent être vérifiées par le centre et la pharmacie. Les besoins peuvent diminuer avec la maturation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<div class="lab">Surveillance et sécurité</div><p>Contrôler pression, poids, œdèmes, sodium, potassium et rénine selon les conditions de mesure. Rétention hydrosodée, hypertension, hypokaliémie et alcalose sont des risques. L’apport sodé et le médicament se règlent ensemble ; aucun mélange oral de sel pour nourrisson n’est improvisé. Les données rénales/hépatiques sont insuffisantes pour une recommandation formelle, ce qui ne signifie pas absence de risque [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<p>Les contre-indications comprennent hypersensibilité, mycose systémique, ulcère gastro-intestinal aigu, herpès oculaire, zona/varicelle, hypertension sévère et artériosclérose cérébrale avancée. Interactions favorisant perte de potassium ou effets digitaliques et traitements métaboliques imposent revue pharmaceutique. Le bénéfice et les risques du remplacement nécessaire sont individualisés [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
<div class="lab">Maladie, grossesse et conservation</div><p>consensus de la société britannique d’endocrinologie et diabétologie pédiatriques ne demande pas de multiplier automatiquement la dose en maladie ou crise ; l’adaptation glucocorticoïde et les soins hospitaliers sont distincts. Reprendre l’oral quand possible selon le plan [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>]. La FI demande une nécessité démontrée en grossesse, surveillance du nouveau-né pour insuffisance et absence d’allaitement pendant le traitement. Conserver au réfrigérateur entre 2 et 8 °C. La durée est celle du besoin, avec réévaluation ; le produit n’agit pas comme une injection de secours immédiate [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e25-synacthen" data-title="Tétracosactide immédiat — FI suisse juin 2023"><div class="lab">Produit et question diagnostique</div><p>Synacthen immédiat contient 0,25 mg de tétracosactide dans 1 ml ; la forme dépôt est différente. Son activité corticotrope stimule la surrénale. Dans ce cours, il sert au test diagnostique et non au remplacement d’une hormone manquante [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<div class="lab">Test de la FI et limites</div><p>Chez l’adulte, 0,25 mg intramusculaire ou intraveineuse ; dosage du cortisol immédiatement avant et exactement trente minutes après. La FI cite une augmentation d’au moins 200 nmol/L ou un taux au-dessus de 500 nmol/L, avec unités et formulations historiques. L’augmentation et le taux final ne sont pas deux grandeurs identiques, et la méthode analytique actuelle doit guider l’interprétation. La FI ne fournit pas une posologie pédiatrique étudiée ; aucun schéma adulte n’est étendu automatiquement à tout enfant [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p>Pour une hyperplasie, la réponse des précurseurs, notamment de la 17-hydroxyprogestérone, est une autre question que le seul cortisol. Les seuils historiques non classiques viennent d’autres études et doivent être contextualisés. Œstrogènes, protéines de liaison, maladie hépatique, syndrome néphrotique ou maladie critique peuvent modifier le cortisol total ; l’expert choisit l’interprétation ou une autre exploration [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<div class="lab">Contre-indications et surveillance</div><p>Une hypersensibilité préalable aux préparations corticotropes contre-indique l’usage. Réaction anaphylactique, notamment chez les personnes avec terrain allergique/asthmatique, exige interrogatoire, disponibilité de réanimation et surveillance pendant trente minutes. La contre-indication du syndrome adrénogénital dans les indications thérapeutiques ne signifie pas interdiction de son exploration diagnostique ; les sections sont distinguées explicitement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p>La dose est celle d’un examen ponctuel, pas d’une substitution quotidienne. Le test ne doit jamais retarder le traitement d’une crise ni être proposé à domicile comme secours. Conditions de grossesse, autres contre-indications et médicaments modifiant le test sont revus par l’équipe avant programmation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
</template>

<template data-pop="e25-genes" data-title="Gènes et protéines de la stéroïdogenèse"><table class="t" data-e25-table="1"><thead><tr><th>Symbole</th><th>Sens dans ce cours</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP21A2</a></td><td>Gène de la 21-hydroxylase.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP21A1P</a></td><td>Pseudogène proche, conversions et difficultés analytiques.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP11B1</a></td><td>Gène de la 11β-hydroxylase.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP17A1</a></td><td>Gène de l’enzyme 17α-hydroxylase et 17,20-lyase.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">HSD3B2</a></td><td>Gène de la 3β-hydroxystéroïde déshydrogénase de type 2.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">POR</a></td><td>Oxydoréductase du cytochrome <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">P450</a> ; perturbations combinées, sans électrolytes obligatoirement normaux.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">StAR</a></td><td>Protéine régulatrice aiguë de la stéroïdogenèse : transfert du cholestérol.</td></tr><tr><td><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP11A1</a></td><td>Clivage de la chaîne latérale du cholestérol, étape initiale.</td></tr></tbody></table><p>Les symboles des cytochromes décrivent une nomenclature. Le test distingue copie active, pseudogène et nombre de copies ; le génotype oriente sans remplacer la clinique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p></template>
<template data-pop="e25-chromosomes" data-title="Constitution chromosomique et respect"><p>46,<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">XX</a> décrit quarante-six chromosomes dont deux X ; 46,<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">XY</a> comporte un X et un Y. Chromosomes, organes, fonctions hormonales et identité sont des dimensions distinctes. L’excès androgénique peut modifier les organes externes en 46,<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">XX</a> ; leur apparence ne détermine pas l’identité future [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p></template>
<template data-pop="e25-nosologie" data-title="Classification suisse"><table class="t" data-e25-table="1"><thead><tr><th>Code</th><th>Libellé OFS 2024</th></tr></thead><tbody><tr><td>E25</td><td>Anomalies génito-surrénaliennes</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.0</a></td><td>Anomalies génito-surrénaliennes congénitales liées à un déficit enzymatique</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.00</a></td><td>Déficit en 21-hydroxylase [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">SAG</a> de type 3], forme classique</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.01</a></td><td>Déficit en 21-hydroxylase [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">SAG</a> de type 3], forme tardive</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.08</a></td><td>Autres anomalies adrénogénitales congénitales liées à un déficit enzymatique</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.09</a></td><td>Anomalie adrénogénitale congénitale liée à un déficit enzymatique, sans précision</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.8</a></td><td>Autres anomalies génito-surrénaliennes</td></tr><tr><td><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.9</a></td><td>Anomalie génito-surrénalienne, sans précision</td></tr></tbody></table><p><a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">SAG</a> signifie syndrome adrénogénital dans le libellé. Le code suit le diagnostic ; aucune tumeur ou hyperandrogénie n’est automatiquement <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">E25.8</a>. Aucun remboursement 2026 n’est certifié [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>].</p></template>
<template data-pop="e25-profiles" data-title="Cadre suisse de formation"><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">PROFILES</a> signifie Principal Relevant Objectives and Framework for Integrated Learning and Education in Switzerland. Les situations de départ concernent notamment organes génitaux externes atypiques, pression anormale et croissance/puberté. Le lien avec E25 est pédagogique, sans question officielle ni correspondance officielle avec la classification des maladies [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p></template>
<template data-pop="e25-corticotrope" data-title="Hormone corticotrope"><p>L’hormone adrénocorticotrope hypophysaire stimule le cortex, notamment le cortisol, qui exerce un rétrocontrôle. Un signal accru ne répare pas un bloc enzymatique. L’aldostérone dépend surtout de rénine–angiotensine et potassium. Le signal seul n’est pas une cible de titration [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p></template>
<template data-pop="e25-crf" data-title="Récepteur du signal hypothalamique"><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">CRF1</a> est le récepteur de type 1 du facteur de libération de la corticotropine. Son antagonisme peut réduire stimulation corticotrope et androgènes. Les essais ne remplacent pas le cortisol nécessaire et ne prouvent pas une autorisation suisse actuelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11309900/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38828945/" target="_blank" rel="noopener">S13</a>].</p></template>
<template data-pop="e25-metabolisme" data-title="Métabolisme de l’hydrocortisone"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">CYP3A4</a> est une enzyme de la famille des cytochromes <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">P450</a> participant au métabolisme de l’hydrocortisone. Inducteurs et inhibiteurs peuvent changer son exposition ; le produit et le contexte guident l’adaptation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>].</p></template>
