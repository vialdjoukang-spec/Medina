<template data-pop="pareto-e25-1" data-title="Essentiel — Une urgence peut précéder le résultat du dépistage"><p>Un garçon peut présenter une perte de sel sans signe génital visible. L’urgence clinique précède la confirmation étiologique [<a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-1"></p>
</template>
<template data-pop="pareto-e25-2" data-title="Essentiel — Définition et formes cliniques"><p>Classique ne signifie pas toujours perte de sel ; non classique reste congénital. Le mécanisme enzymatique guide les signes et le traitement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-2"></p>
</template>
<template data-pop="pareto-e25-3" data-title="Essentiel — Épidémiologie : conserver chaque dénominateur"><p>1/9000 nouveau-nés, 1/7500 filles et 4,2 % de femmes hyperandrogéniques décrivent trois populations différentes [<a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12210017/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.neoscreening.ch/fr/maladies/" target="_blank" rel="noopener">S9</a>].</p>
<p class="ratio" data-cover="e25-3"></p>
</template>
<template data-pop="pareto-e25-4" data-title="Essentiel — Du fonctionnement normal aux symptômes"><p>Le déficit en cortisol explique la vulnérabilité au stress ; le profil minéralocorticoïde distingue perte de sel et hypertension [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-4"></p>
</template>
<template data-pop="pareto-e25-5" data-title="Essentiel — Étiologies et diagnostics voisins"><p>L’hypertension avec excès androgénique fait chercher une autre voie que la seule 21-hydroxylase. Les tumeurs et les ovaires polykystiques gardent leur diagnostic propre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-5"></p>
</template>
<template data-pop="pareto-e25-6" data-title="Essentiel — Anamnèse et communication"><p>La chronologie, la croissance et l’accès réel au remplacement sont aussi importants que l’étiquette génétique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-6"></p>
</template>
<template data-pop="pareto-e25-7" data-title="Essentiel — Examen clinique et sémiologie"><p>Une anatomie externe apparemment habituelle ne rassure pas sur le cortisol. La croissance rapide et la petite taille finale peuvent relever du même excès androgénique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-7"></p>
</template>
<template data-pop="pareto-e25-8" data-title="Essentiel — Diagnostic positif et séquence d’exploration"><p>Dépister, confirmer le déficit et évaluer la réserve cortisolaire sont des questions distinctes ; le seuil garde sa méthode [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p class="ratio" data-cover="e25-8"></p>
</template>
<template data-pop="pareto-e25-9" data-title="Essentiel — Drapeaux rouges et crise surrénalienne"><p>La dose de crise dépend de l’âge/poids et du contexte. Après l’injection de secours, l’évaluation urgente et la surveillance restent indispensables [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-9"></p>
</template>
<template data-pop="pareto-e25-10" data-title="Essentiel — Prise en charge : remplacer sans surtraiter"><p>Le remplacement classique est indispensable ; le traitement non classique dépend des conséquences. La dose se juge avec la croissance et la clinique, jamais un marqueur seul [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-10"></p>
</template>
<template data-pop="pareto-e25-11" data-title="Essentiel — Complications, pronostic et suivi"><p>Suivre croissance, pression, hormones contextualisées et vécu. Un dépistage réussi n’annule pas le risque de crise ni les besoins à l’âge adulte [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-11"></p>
</template>
<template data-pop="pareto-e25-12" data-title="Essentiel — Maladie intercurrente, grossesse et transition"><p>Le plan de stress s’écrit avant la maladie et ne cumule pas aveuglément des schémas. La transition doit conserver un accès continu au traitement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-12"></p>
</template>
<template data-pop="pareto-e25-13" data-title="Essentiel — Tous les sous-codes et contexte suisse"><p>Le code suit le diagnostic documenté. Aucun statut de remboursement ou de traitement génital individuel n’est déduit du seul libellé [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>].</p>
<p class="ratio" data-cover="e25-13"></p>
</template>
<template data-pop="pareto-e25-14" data-title="Essentiel — Critères, paramètres et pièges fédéraux"><p>Le bon chiffre répond à une question, une méthode, un âge et une voie. Les unités et la population font partie de la réponse [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-14"></p>
</template>
<template data-pop="pareto-e25-e-1" data-title="Essentiel — Du dépistage au diagnostic"><p>Un dépistage positif appelle une confirmation contextualisée ; un tableau grave appelle un traitement immédiat même avec dépistage négatif ou en attente [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-e-1"></p>
</template>
<template data-pop="pareto-e25-e-2" data-title="Essentiel — Profil hormonal et test dynamique"><p>La stimulation peut explorer la réserve en cortisol ou les précurseurs d’un bloc enzymatique ; les critères de ces deux questions ne s’échangent pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p class="ratio" data-cover="e25-e-2"></p>
</template>
<template data-pop="pareto-e25-e-3" data-title="Essentiel — Génétique, os et échographie"><p>Un résultat génétique exige sa méthode et sa phase familiale ; une image exige sa question clinique. Aucun examen ne remplace le suivi longitudinal [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e25-e-3"></p>
</template>
<template data-pop="pareto-e25-e-4" data-title="Essentiel — Quatre exercices de raisonnement"><p>Les exercices sont originaux : urgence, seuil contextualisé, profil hypertensif et dépistage du prématuré [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/28582566/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-e-4"></p>
</template>
<template data-pop="pareto-e25-s-anat-cours" data-title="Essentiel — Anatomie normale puis portée clinique"><p>Cortex et médulla ont des fonctions distinctes ; l’anatomie normale explique les voies sans confirmer le déficit d’un patient [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<p class="ratio" data-cover="e25-s-anat-cours"></p>
</template>
<template data-pop="pareto-e25-s-histo-cours" data-title="Essentiel — Histologie : lire la zone avant de nommer la maladie"><p>La coupe normale illustre les territoires ; elle ne montre ni un variant <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">CYP21A2</a> ni une hyperplasie pathologique individuelle [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S19</a>].</p>
<p class="ratio" data-cover="e25-s-histo-cours"></p>
</template>
<template data-pop="pareto-e25-s-physio-cours" data-title="Essentiel — Physiologie : trois régulations et un équilibre thérapeutique"><p>Le traitement remplace un besoin et module un signal ; ces deux effets ne justifient pas une suppression hormonale maximale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e25-s-physio-cours"></p>
</template>
<template data-pop="pareto-e25-s-bioch-cours" data-title="Essentiel — Biochimie : le précurseur indique la voie, pas tout le diagnostic"><p>Un bloc modifie un réseau de stéroïdes. Le profil, la méthode et le contexte empêchent d’étiqueter une enzyme sur un seul chiffre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8755999/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e25-s-bioch-cours"></p>
</template>
<template data-pop="pareto-e25-s-gene-cours" data-title="Essentiel — Génétique et immunologie : une maladie récessive, pas une auto-immunité"><p>Le pseudogène et le nombre de copies compliquent le test. Génotype, phénotype et risque familial se discutent ensemble ; récessif ne signifie pas auto-immun [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7609334/" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e25-s-gene-cours"></p>
</template>
<template data-pop="pareto-e25-p-1" data-title="Essentiel — Choisir la fonction avant le produit"><p>Entretien, maladie orale et crise sont trois contextes. Un produit exact, une voie, une unité et une population accompagnent chaque dose [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-p-1"></p>
</template>
<template data-pop="pareto-e25-p-2" data-title="Essentiel — Hydrocortisone orale : deux formulations suisses"><p>Les granulés pédiatriques et le comprimé de 10 mg ont des contraintes différentes ; le changement de produit mérite une surveillance [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680682260010" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S15</a>].</p>
<p class="ratio" data-cover="e25-p-2"></p>
</template>
<template data-pop="pareto-e25-p-3" data-title="Essentiel — Injectable et minéralocorticoïde"><p>L’injection urgente ne remplace pas la surveillance ; le minéralocorticoïde ne remplace pas le cortisol et ne se triple pas automatiquement [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e25-p-3"></p>
</template>
<template data-pop="pareto-e25-p-4" data-title="Essentiel — Test diagnostique et traitements émergents"><p>Le tétracosactide est diagnostique ici. Les résultats du crinecerfont gardent leur durée, leur critère et leur statut d’essai, sans ordonnance suisse inventée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11309900/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/38828945/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680317230012" target="_blank" rel="noopener">S18</a>].</p>
<p class="ratio" data-cover="e25-p-4"></p>
</template>
