<template data-pop="e25-d-hydrocortisone" data-title="Hydrocortisone (Alkindi, Galepharm, Solu-Cortef)">
<div class="lab">Mécanisme</div><p>Glucocorticoïde de remplacement : il apporte le cortisol que la surrénale ne fabrique plus et, en rétablissant le rétrocontrôle, freine l’ACTH et la production d’androgènes.</p>
<div class="lab">Preuves</div><p>Traitement de fond de la forme classique dans la revue de 2022. Les informations professionnelles suisses d’Alkindi (granulés de 0,5, 1, 2 et 5 mg, patients de moins de 18 ans, Swissmedic, février 2025), d’Hydrocortisone Galepharm (août 2025) et de Solu-Cortef (octobre 2025) indiquent l’hydrocortisone dans l’hyperplasie surrénale congénitale.</p>
<div class="lab">Posologie</div><p>Enfant : 10 à 15 mg/m² par jour en 3 à 4 prises (revue 2022 et Alkindi). Adulte : 15 à 25 mg/j en 2 à 3 prises ; Galepharm : 10 à 30 mg/j. Urgence : 100 mg en bolus ; Solu-Cortef : jusqu’à 100 mg IV en 30 secondes ou plus, enfants au minimum 25 mg/jour. Périopératoire : 100 mg IV puis 100 mg/6 h. Hydrocortisone à libération modifiée (Plenadren, Chronocort) : citée par la revue de 2022 ; son statut suisse n’a pas été vérifié.</p>
<div class="lab">Effets indésirables</div><p>Surdosage chez l’enfant : prise de poids excessive et ralentissement de croissance (Alkindi). Au long cours : obésité, insulinorésistance, hypertension, ostéoporose, fractures.</p>
<div class="lab">Contre-indications et surveillance</div><p>Les contre-indications des informations professionnelles n’ont pas été relevées dans cette leçon (lacune) ; le prescripteur les consulte. Surveillance : nourrissons revus au moins tous les 3 à 4 mois (Alkindi), puis selon les cibles de suivi.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; Information professionnelle suisse Alkindi, février 2025 ; Information professionnelle suisse Hydrocortisone Galepharm, août 2025 ; Information professionnelle suisse Solu-Cortef, octobre 2025.</p></template>
<template data-pop="e25-d-fludro" data-title="Fludrocortisone (Florinef)">
<div class="lab">Mécanisme</div><p>Minéralocorticoïde qui remplace l’aldostérone et corrige la perte de sodium.</p>
<div class="lab">Preuves</div><p>Tous les nourrissons classiques reçoivent glucocorticoïde et minéralocorticoïde au moins la première année (revue 2022).</p>
<div class="lab">Posologie</div><p>Revue 2022 : 0,05 à 0,2 mg/j, nouveau-nés souvent 0,1 à 0,2 mg/j. Florinef (mars 2026) : adulte 0,1 mg/j (0,1 mg 3 fois par semaine à 0,2 mg/j) ; enfant 2 à 5 µg/kg/j ; ne pas dépasser 0,05 mg/j en cas d’hypertension transitoire.</p>
<div class="lab">Surveillance</div><p>Électrolytes, tension et rénine. Pas de fludrocortisone dans la forme non classique.</p>
<div class="lab">Limite</div><p>Contre-indications et effets indésirables détaillés de Florinef non relevés (lacune).</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://doi.org/10.1530/EJE-18-0712" target="_blank" rel="noopener">European Journal of Endocrinology 2019, forme non classique (abrégé)</a> ; Information professionnelle suisse Florinef, mars 2026.</p></template>
<template data-pop="e25-d-nacl" data-title="Chlorure de sodium chez le nourrisson">
<div class="lab">Mécanisme</div><p>Apport de sodium qui compense la perte rénale de sel.</p>
<div class="lab">Posologie</div><p>1 à 2 g/j (4 à 8 mEq/kg/j) chez le nourrisson (revue 2022).</p>
<div class="lab">Limite</div><p>Source unique ; les modalités pratiques d’administration n’ont pas été lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-d-prednisolone" data-title="Prednisolone et méthylprednisolone">
<div class="lab">Place</div><p>Alternatives de l’adulte classique, en 2 prises.</p>
<div class="lab">Posologie</div><p>Prednisolone 4 à 6 mg ou méthylprednisolone 4 à 6 mg en 2 prises (revue 2022).</p>
<div class="lab">Grossesse</div><p>La prednisolone et la prednisone sont poursuivies pendant la grossesse.</p>
<div class="lab">Urgence</div><p>En cas de vomissements : suppositoire ou injection d’urgence de 100 mg de prednisone ou de prednisolone (brochure de patients).</p>
<div class="lab">Limite</div><p>Informations professionnelles suisses de ces produits non lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://endo-ern.eu/wp-content/uploads/2023/04/Adrenogenitales-Syndrom-AGS-Updated.pdf" target="_blank" rel="noopener">Brochure AGS pour les parents, 4e édition 2023</a>.</p></template>
<template data-pop="e25-d-dexa" data-title="Dexaméthasone">
<div class="lab">Place</div><p>À éviter si possible chez l’adulte (0,25 à 0,5 mg/j) et en grossesse, car elle traverse le placenta.</p>
<div class="lab">Usage particulier</div><p>Traitement prénatal expérimental : 20 µg/kg/j, maximum 1,5 mg/j, avant 6–7 semaines d’aménorrhée ; controversé.</p>
<div class="lab">Limite</div><p>Raisons de la préférence pour d’autres glucocorticoïdes chez l’adulte non détaillées dans les sources lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a>.</p></template>
<template data-pop="e25-d-crinecerfont" data-title="Crinécerfont (antagoniste du récepteur CRF1)">
<div class="lab">Mécanisme</div><p>Antagoniste du récepteur CRF1 : il vise à réduire la stimulation de l’ACTH et donc la production d’androgènes, ce qui permet de réduire la dose de glucocorticoïdes.</p>
<div class="lab">Preuves</div><p>Essai de phase 3 chez l’adulte (n = 182, 24 semaines) : dose de glucocorticoïdes −27,3 % contre −10,3 % sous placebo ; dose physiologique atteinte chez 63 % contre 18 %. Essai chez l’enfant (n = 103) : androstènedione −197 contre +71 ng/dl à 4 semaines ; dose de glucocorticoïdes −18,0 % contre +5,6 % à 28 semaines.</p>
<div class="lab">Limites</div><p>Il s’agit de données d’essai industriel multinational, non de recommandations. Le statut d’autorisation suisse ou européen n’a pas été vérifié : le produit ne doit pas être présenté comme disponible en Suisse. Seuls les abrégés ont été lus.</p>
<p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa2404656" target="_blank" rel="noopener">NEJM 2024, crinécerfont chez l’adulte (abrégé)</a> ; <a href="https://doi.org/10.1056/NEJMoa2404655" target="_blank" rel="noopener">NEJM 2024, crinécerfont chez l’enfant (abrégé)</a>.</p></template>
<template data-pop="e25-d-antiandrogenes" data-title="Traitements de la forme non classique">
<div class="lab">Principe</div><p>Traitement individualisé, réservé à l’hyperandrogénie symptomatique. Pas de fludrocortisone.</p>
<div class="lab">Moyens</div><p>Contraceptifs oraux à progestatif antiandrogène (cyprotérone, chlormadinone, diénogest, drospirénone), éventuellement éflornithine. Glucocorticoïdes en cas de croissance accélérée ou de désir de grossesse.</p>
<div class="lab">Dangers</div><p>Spironolactone, flutamide et finastéride sont tératogènes. Tout glucocorticoïde impose des doses de stress. Les glucocorticoïdes en grossesse sont possiblement bénéfiques en raison du risque accru de fausse couche.</p>
<div class="lab">Limite</div><p>Doses de ces produits non lues dans les sources de cette leçon.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab016" target="_blank" rel="noopener">Claahsen-van der Grinten et al., Endocrine Reviews 2022</a> ; <a href="https://doi.org/10.1093/humupd/dmx014" target="_blank" rel="noopener">Carmina et al., Human Reproduction Update 2017 (abrégé)</a> ; <a href="https://doi.org/10.1530/EJE-18-0712" target="_blank" rel="noopener">European Journal of Endocrinology 2019, forme non classique (abrégé)</a>.</p></template>
<template data-pop="pareto-e25-definition" data-title="Pareto — Définition et classifications">
<p class="ratio" data-cover="e25-1"></p>
<ul><li>E25 : HCS, surtout déficit en 21-hydroxylase (CYP21A2), autosomique récessif.</li><li>E25.00 classique, E25.01 tardive, E25.08 autres déficits.</li><li>Trois formes : perte de sel, virilisante simple (1–5 %), non classique (20–50 %).</li><li>Le phénotype suit l’allèle le moins sévère (groupes 0, A, B, C).</li></ul></template>
<template data-pop="pareto-e25-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="e25-2,e25-3"></p>
<ul><li>Bloc en 21 : cortisol et aldostérone ↓, 17-OHP et androgènes ↑, ACTH ↑.</li><li>Perte de sel : hyponatrémie, hyperkaliémie, acidose, choc.</li><li>Androgènes : virilisation 46,XX, avance osseuse, taille finale −7 cm.</li><li>Incidence classique 1/14 000–18 000 ; Suisse ≈ 1/9000.</li></ul></template>
<template data-pop="pareto-e25-causes" data-title="Pareto — Étiologies">
<p class="ratio" data-cover="e25-4"></p>
<ul><li>CYP21A2 en 6p21.3 ; conversions géniques depuis CYP21A1P.</li><li>Autres déficits (E25.08) : 11β (hypertension), 3β-HSD2, 17α, POR, StAR, CYP11A1.</li><li>Formes acquises : lacune documentaire.</li></ul></template>
<template data-pop="pareto-e25-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="e25-5,e25-6"></p>
<ul><li>Fille 46,XX : organes génitaux virilisés ; garçon : crise à 10 j–3 sem.</li><li>Enfant : pubarche précoce, âge osseux avancé.</li><li>Adulte : hirsutisme, tableau de type SOPK ; homme : TART.</li><li>Examen : tension, courbe de croissance, organes génitaux, testicules.</li></ul></template>
<template data-pop="pareto-e25-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="e25-7"></p>
<ul><li>Dépistage suisse : 17-OHP sang séché J3–J4.</li><li>Faux positifs chez le prématuré : second niveau ou génotype.</li><li>Forme non classique : 17-OHP ≥ 6 nmol/l (dépistage), ≥ 30 nmol/l (diagnostic).</li><li>Confirmer par CYP21A2 ; exclure autres déficits et SOPK.</li></ul></template>
<template data-pop="pareto-e25-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="e25-8"></p>
<ul><li>Crise : hydrocortisone 100 mg bolus, liquides IV, glucose.</li><li>Prévention : règles de stress, carte, trousse.</li><li>Complications : TART, taille, fertilité, effets des glucocorticoïdes.</li></ul></template>
<template data-pop="pareto-e25-traitement" data-title="Pareto — Traitement">
<p class="ratio" data-cover="e25-9"></p>
<ul><li>Enfant : hydrocortisone 10–15 mg/m²/j en 3–4 prises.</li><li>Nourrisson classique : + fludrocortisone 0,05–0,2 mg/j, NaCl 1–2 g/j.</li><li>Adulte : hydrocortisone 15–25 mg/j ou prednisolone 4–6 mg.</li><li>Éviter la dexaméthasone ; crinécerfont non établi en Suisse.</li></ul></template>
<template data-pop="pareto-e25-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e25-e-1,e25-e-2,e25-e-3,e25-e-4"></p>
<ul><li>17-OHP : examen central ; étalon-or non classique = test à l’ACTH.</li><li>Génotype CYP21A2 : confirmation et conseil génétique.</li><li>Configurations : perte de sel, virilisante, non classique, 11β (hypertension), 3β-HSD2, POR.</li></ul></template>
<template data-pop="pareto-e25-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="e25-s-anat-cours"></p>
<ul><li>Cortex : trois familles d’hormones ; hyperplasie sous ACTH.</li><li>Organes cibles : organes génitaux, squelette, testicules (TART).</li></ul></template>
<template data-pop="pareto-e25-physiol" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e25-s-physio-cours"></p>
<ul><li>Rétrocontrôle : cortisol freine l’ACTH.</li><li>HCS : frein levé, hyperplasie, androgènes.</li><li>Perte de sel vs hypertension minéralocorticoïde.</li></ul></template>
<template data-pop="pareto-e25-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="e25-s-bioch-cours"></p>
<ul><li>21-hydroxylase : progestérone → DOC, 17-OHP → 11-désoxycortisol.</li><li>Dosage selon le bloc : 17-OHP, 11-désoxycortisol, Δ5/Δ4.</li></ul></template>
<template data-pop="pareto-e25-genet" data-title="Pareto — Génétique">
<p class="ratio" data-cover="e25-s-genet-cours"></p>
<ul><li>Autosomique récessif ; CYP21A2 / pseudogène CYP21A1P.</li><li>Groupes 0, A, B, C : 96 % et 97 % de concordance.</li><li>CAH-X : délétion contiguë de TNXB.</li></ul></template>
<template data-pop="pareto-e25-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e25-p-1,e25-p-2,e25-p-3,e25-p-4"></p>
<ul><li>Glucocorticoïde (hydrocortisone) ± fludrocortisone + NaCl.</li><li>Doses distinctes par population ; sources suisses prioritaires.</li><li>Dangers : stress, dexaméthasone en grossesse, antiandrogènes tératogènes.</li></ul></template>
