<section class="ilot" id="j44-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>La bronchopneumopathie chronique obstructive (BPCO) pose d’abord deux difficultés : un diagnostic souvent tardif et une décision thérapeutique à ajuster. Ainsi, un même patient, suivi d’un bout à l’autre, montre comment ces deux difficultés se résolvent.</p>
<h3>0.1 Le cas fil rouge : Monsieur B.</h3>
<p>Ce patient réunit les éléments que le médecin de premier recours rencontre le plus souvent : un tabagisme ancien, une exposition professionnelle et des « bronchites » répétées jamais explorées.</p>
<p>Monsieur B. a 64 ans. Il a travaillé 42 ans comme maçon et il est retraité depuis deux ans. Il fume un paquet de cigarettes par jour depuis l’âge de 19 ans, soit 45 paquets-années. Il consulte parce qu’il doit s’arrêter après environ 100 mètres de marche à plat pour reprendre son souffle. Cette gêne s’est installée lentement en trois ans ; il l’attribuait à l’âge et au manque d’exercice.</p>
<p>Il tousse et crache chaque matin depuis plus de dix ans, ce qu’il appelle sa « toux du fumeur ». Cet hiver, son médecin lui a prescrit deux fois un antibiotique et de la prednisone pour une « bronchite ». Il n’a jamais eu de spirométrie. De plus, son épouse remarque qu’il a renoncé à monter au jardin et qu’il dort mal.</p>
<p>Trois éléments de cette histoire orientent déjà le médecin. Le premier est le tabagisme de plus de 40 paquets-années. À cet égard, dans une étude de 309 patients recrutés dans 25 centres de 14 pays, ce tabagisme avait un <button class="w" data-k="j44-pa-rv">rapport de vraisemblance positif (définition et calcul)</button> de 8,3 pour une obstruction bronchique (JAMA, 2000). Autrement dit, il multiplie par 8,3 la cote de la maladie avant tout examen. Le deuxième est la dyspnée d’effort chronique, que GOLD 2026 désigne comme le symptôme le plus caractéristique de la BPCO. Le troisième tient aux deux épisodes traités par antibiotique ou corticostéroïde oral : chacun correspond, par définition, à une exacerbation modérée, et ce fait pèsera sur le choix du traitement (section 1).</p>
<div class="key"><b>À retenir.</b> Un fumeur de plus de 40 paquets-années qui s’essouffle à l’effort et tousse chaque matin a une forte probabilité d’obstruction bronchique. Cette probabilité justifie une spirométrie, mais elle ne remplace pas la mesure.</div>
<h3>0.2 La question qui structure le chapitre</h3>
<p>Une bonne question clinique fixe l’ordre des décisions. Celle de Monsieur B. comporte quatre temps : confirmer, mesurer, prévoir et traiter.</p>
<p><b>Ce patient a-t-il une BPCO ? Si oui, quelle est sa gêne, quel est son risque d’exacerbation, et quelles mesures prolongeront sa vie et amélioreront son souffle ?</b> Or, un traitement choisi avant la confirmation spirométrique reposerait sur une supposition : une insuffisance cardiaque, un asthme ou un cancer bronchique peuvent produire les mêmes plaintes.</p>
<div class="key"><b>À retenir.</b> Le médecin confirme d’abord l’obstruction, puis il mesure la gêne et le risque d’exacerbation, et seulement ensuite il choisit le traitement.</div>
<h3>0.3 Objectifs</h3>
<p>Chaque objectif décrit un geste ou une décision attendus du médecin assistant.</p>
<ul>
<li>Le médecin assistant confirme ou écarte le diagnostic par une spirométrie après bronchodilatateur, et il sait interpréter un rapport proche du seuil de 0,70.</li>
<li>Il classe ensuite le patient selon GOLD 2026, car chaque étage oriente une décision : le grade de l’obstruction mesure la gravité fonctionnelle, le groupe A, B ou E choisit le traitement initial, et les éosinophiles sanguins prédisent le bénéfice d’un corticostéroïde inhalé.</li>
<li>Il reconnaît une exacerbation, il en évalue la gravité et il prescrit l’oxygène, les bronchodilatateurs, le corticostéroïde, l’antibiotique et la ventilation selon leurs indications.</li>
<li>Il construit un traitement de fond et il l’ajuste selon le problème dominant, la dyspnée ou les exacerbations.</li>
<li>Il pose les indications de l’oxygénothérapie de longue durée, de la ventilation à domicile, des traitements interventionnels et des soins palliatifs.</li>
<li>Il recherche les comorbidités qui changent le pronostic, et il applique la prévention : arrêt du tabac, vaccinations et réhabilitation.</li>
</ul>
<div class="key"><b>Prérequis.</b> Trois notions de base rendent le chapitre lisible. La <button class="w" data-k="j45-spiro">spirométrie (principe, VEMS, CVF et courbes)</button> mesure l’obstruction. L’<button class="w" data-k="j44-emph">emphysème (définition, types et conséquences)</button> décrit la destruction des parois alvéolaires. La <button class="w" data-k="j44-disten">distension pulmonaire (piégeage de l’air au repos et à l’effort)</button> explique la dyspnée. L’onglet des sciences fondamentales développe chacune d’elles.</div>
<div class="key"><b>À retenir.</b> Monsieur B. revient à chaque étape, jusqu’au cas récapitulatif de la section 12. La définition et la classification de la BPCO fondent les décisions suivantes (section 1).</div>
</section>

<section class="ilot" id="j44-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>Parler de BPCO exige de démontrer une obstruction mesurée : la définition est fonctionnelle. En revanche, les classifications qui guident le traitement séparent la sévérité de l’obstruction, la gêne du patient et son risque d’exacerbation, parce que ces trois dimensions ne varient pas ensemble.</p>
<h3>1.1 La définition de GOLD 2026</h3>
<p>La Global Initiative for Chronic Obstructive Lung Disease (GOLD) publie chaque année la stratégie internationale de référence. Or, sa définition contient trois éléments, et chacun a une conséquence pratique.</p>
<p>Selon GOLD 2026, la BPCO est une affection pulmonaire <b>hétérogène</b>. Elle se caractérise par des <b>symptômes respiratoires chroniques</b> : dyspnée, toux, expectoration ou exacerbations. Ces symptômes proviennent d’anomalies des voies aériennes (bronchite, bronchiolite) ou des alvéoles (emphysème). Ces anomalies entraînent une <b>obstruction bronchique persistante, souvent progressive</b>.</p>
<p>Le mot « hétérogène » signifie que plusieurs causes et plusieurs lésions aboutissent au même tableau (section 4). Concrètement, le mot « persistante » impose de mesurer l’obstruction <b>après</b> un bronchodilatateur : on ne retient que la part qui ne se corrige pas. De même, le mot « souvent » rappelle qu’une BPCO ne s’aggrave pas chez tous les patients. Le diagnostic exige donc une preuve spirométrique : un rapport VEMS/CVF <b>inférieur à 0,70 après bronchodilatateur</b>.</p>
<p>Le VEMS est le volume expiré pendant la première seconde d’une expiration forcée. En effet, la CVF est le volume total expiré. Ainsi, chez le sujet sain, l’essentiel du volume sort pendant la première seconde. Par ailleurs, le rapport est élevé chez l’adulte jeune et diminue physiologiquement avec l’âge, au point de passer sous 0,70 chez certains sujets âgés sains (section 7). À l’inverse, dans la BPCO, l’air sort lentement : le VEMS baisse davantage que la CVF, et le rapport chute.</p>
<p>Voici l’exemple de Monsieur B. De fait, après 400 µg de salbutamol, son VEMS vaut 1,45 L et sa CVF 2,79 L. Dès lors, le rapport vaut 1,45 divisé par 2,79, soit 0,52. L’obstruction persiste après bronchodilatation : le critère spirométrique est rempli.</p>
<div class="key"><b>À retenir.</b> Une BPCO associe des symptômes ou une exposition à une obstruction persistante, mesurée par un rapport VEMS/CVF inférieur à 0,70 après bronchodilatateur. Sans spirométrie, le diagnostic reste une hypothèse.</div>
<h3>1.2 Bronchite chronique, emphysème et BPCO : trois définitions de nature différente</h3>
<p>Ces trois termes sont souvent employés l’un pour l’autre, ce qui produit des erreurs de diagnostic. Ils ne reposent pas sur le même type de preuve.</p>
<p>Le tableau suivant compare les trois notions.</p>
<table class="t"><tr><th>Notion</th><th>Nature de la définition</th><th>Critère</th><th>Ce qu’elle n’implique pas</th></tr>
<tr><td><button class="w" data-k="j44-pa-bchron">Bronchite chronique (définition, fréquence et portée)</button></td><td>Clinique</td><td>Toux productive au moins trois mois par an, pendant deux années consécutives, sans autre cause</td><td>Une obstruction</td></tr>
<tr><td><button class="w" data-k="j44-emph">Emphysème (lésion et types)</button></td><td>Anatomique (tomodensitométrie, histologie)</td><td>Élargissement permanent des espaces aériens distaux, avec destruction de leurs parois</td><td>Une obstruction</td></tr>
<tr><td>BPCO</td><td>Fonctionnelle</td><td>Symptômes ou exposition, et VEMS/CVF inférieur à 0,70 après bronchodilatateur</td><td>Une bronchite chronique ou un emphysème visibles</td></tr></table>
<p>La lecture du tableau se fait par la dernière colonne. Par exemple, un fumeur qui tousse et crache depuis deux hivers a une bronchite chronique ; il n’a une BPCO que si la spirométrie montre l’obstruction. En effet, selon GOLD 2026, la bronchite chronique n’est présente que chez 27 à 35 % des patients atteints de BPCO dans les grandes études d’observation. À l’inverse, un emphysème découvert sur une tomodensitométrie ne suffit pas au diagnostic. À cet égard, l’erreur fréquente consiste à écrire « BPCO » dans un dossier sur la seule foi d’une toux chronique.</p>
<div class="key"><b>À retenir.</b> La bronchite chronique est un diagnostic clinique, l’emphysème un diagnostic anatomique et la BPCO un diagnostic fonctionnel. Seule la spirométrie transforme une suspicion en BPCO.</div>
<h3>1.3 Sévérité de l’obstruction : grades GOLD 1 à 4</h3>
<p>Une fois l’obstruction démontrée, le VEMS après bronchodilatateur mesure sa sévérité. Ensuite, on l’exprime en pourcentage de la valeur prédite pour l’âge, le sexe et la taille.</p>
<p>Le tableau suivant donne les quatre grades.</p>
<table class="t"><tr><th>Grade</th><th>VEMS après bronchodilatateur (% de la valeur prédite)</th></tr>
<tr><td>GOLD 1 — léger</td><td>≥ 80 %</td></tr><tr><td>GOLD 2 — modéré</td><td>50–79 %</td></tr><tr><td>GOLD 3 — sévère</td><td>30–49 %</td></tr><tr><td>GOLD 4 — très sévère</td><td>&lt; 30 %</td></tr></table>
<p>Le grade s’applique seulement si le rapport est déjà inférieur à 0,70. Un VEMS à 85 % avec un rapport de 0,65 correspond donc à une BPCO de grade 1. Par exemple, Monsieur B. a un VEMS à 45 % de la valeur prédite : il est en grade 3. En somme, le grade renseigne sur le pronostic à l’échelle d’une population. En revanche, GOLD l’a retiré du choix du traitement initial, car il prédit mal l’évolution d’un patient donné.</p>
<div class="key"><b>À retenir.</b> Le grade GOLD mesure la sévérité de l’obstruction par le VEMS après bronchodilatateur. Il éclaire le pronostic, mais il ne choisit pas seul le traitement.</div>
<h3>1.4 Évaluation combinée : groupes A, B et E</h3>
<p>Le traitement initial dépend de deux questions : le patient est-il gêné, et a-t-il déjà eu des exacerbations ? C’est pourquoi GOLD répond par un outil d’évaluation en trois groupes, A, B et E, conçu pour le patient qui ne reçoit encore aucun traitement de fond.</p>
<p>La gêne se mesure par l’<button class="w" data-k="j44-mmrc">échelle de dyspnée mMRC (cinq degrés et usage)</button> ou par le <button class="w" data-k="j44-cat">questionnaire CAT, désormais CAAT (huit items et seuils)</button>. Ainsi, le seuil de 10 au CAT équivaut à un score de 25 au questionnaire respiratoire de St George. Ce niveau correspond à la sévérité des patients recrutés dans les essais qui fondent les recommandations. De même, le seuil de 2 à l’échelle mMRC sépare « peu » de « plus » essoufflé. Cette échelle ne mesure toutefois que la dyspnée : GOLD recommande de regarder aussi les autres symptômes.</p>
<p>Le tableau suivant résume l’attribution du groupe.</p>
<table class="t"><tr><th>Groupe</th><th>Exacerbations de l’année précédente</th><th>Symptômes</th></tr>
<tr><td><b>E</b></td><td>Au moins une exacerbation modérée ou sévère</td><td>Quel que soit leur niveau</td></tr>
<tr><td><b>B</b></td><td>Aucune</td><td>mMRC ≥ 2 ou CAT ≥ 10</td></tr>
<tr><td><b>A</b></td><td>Aucune</td><td>mMRC 0–1 et CAT &lt; 10</td></tr></table>
<p>La lecture commence par la ligne E : l’histoire d’exacerbation l’emporte sur les symptômes. Concrètement, une exacerbation est modérée lorsqu’elle a été traitée par corticostéroïde systémique ou antibiotique ; elle est sévère lorsqu’elle a conduit à l’hospitalisation. Dès lors, GOLD 2026 place le patient dans le groupe E dès <b>une seule</b> exacerbation modérée ou sévère. En effet, des études d’observation montrent qu’un seul épisode, survenu avant tout traitement de fond, augmente déjà le risque des suivants. Ainsi, Monsieur B. a eu deux épisodes traités par antibiotique et prednisone : il appartient au groupe E. En revanche, ses symptômes, mesurés à la section 5, n’interviennent plus dans l’attribution du groupe, mais ils serviront au suivi.</p>
<div class="trap"><span class="k">Piège</span>Beaucoup de questions d’examen et d’articles antérieurs à novembre 2025 emploient l’ancien seuil du groupe E : au moins deux exacerbations modérées, ou une hospitalisation. Le candidat connaît les deux seuils et sait que GOLD 2026 retient désormais une seule exacerbation modérée ou sévère.</div>
<div class="key"><b>À retenir.</b> Le groupe E se définit par au moins une exacerbation modérée ou sévère dans l’année. Sans exacerbation, le patient est en B si mMRC ≥ 2 ou CAT ≥ 10, et en A sinon. Le groupe guide le traitement initial, non le suivi.</div>
<h3>1.5 Activité de la maladie, pré-BPCO, PRISm et BPCO du sujet jeune</h3>
<p>GOLD a introduit récemment des notions qui décrivent ce qui se passe avant la BPCO ou à côté d’elle. Elles aident à reconnaître les patients à risque et à fixer un objectif de traitement.</p>
<p>L’<button class="w" data-k="j44-pa-activite">activité de la maladie (indicateurs et objectif de GOLD 2026)</button> désigne les processus qui font progresser la BPCO et qu’un traitement peut freiner. De fait, ses indicateurs mesurables sont les exacerbations, l’aggravation chronique des symptômes et la progression : déclin du VEMS plus rapide que la perte due à l’âge, ou progression radiologique de l’emphysème. De plus, parmi les biomarqueurs, les éosinophiles sanguins signalent l’inflammation de type 2. Dès lors, l’objectif devient un état de faible activité : aucune exacerbation, aucune aggravation des symptômes et aucune perte accélérée de la fonction.</p>
<p>La <button class="w" data-k="j44-pa-precopd">pré-BPCO et la BPCO du sujet jeune (définitions de GOLD 2026)</button> désignent deux situations distinctes. Ainsi, la pré-BPCO désigne, à tout âge, des symptômes respiratoires ou des anomalies de structure ou de fonction sans obstruction. Ces anomalies peuvent être un emphysème, un VEMS bas, une distension, une diffusion abaissée ou un déclin rapide du VEMS. De même, la BPCO du sujet jeune concerne les patients de 20 à 50 ans. Enfin, la <button class="w" data-k="j44-prism">PRISm (rapport conservé, spirométrie altérée)</button> désigne un rapport ≥ 0,70 avec un VEMS inférieur à 80 %. Ce n’est pas une BPCO, mais un état à risque qui mérite une surveillance.</p>
<p>Enfin, GOLD propose une <button class="w" data-k="j44-pa-etiotypes">taxonomie par étiotypes (causes de la BPCO)</button>. Elle distingue les formes génétiques et celles d’un développement pulmonaire anormal. Elle ajoute les formes environnementales liées au tabac ou à la pollution, les formes post-infectieuses, la BPCO associée à l’asthme et la forme de cause inconnue.</p>
<div class="key"><b>À retenir.</b> L’objectif du traitement n’est plus seulement de soulager, mais d’obtenir une faible activité de la maladie. Un rapport normal avec un VEMS bas (PRISm) ou des symptômes sans obstruction (pré-BPCO) ne sont pas des BPCO, mais ils signalent un risque.</div>
<div class="key"><b>À retenir.</b> Monsieur B. a une BPCO de grade GOLD 3, groupe E. Le grade dit la sévérité de l’obstruction, le groupe dit le traitement de départ. La fréquence et le pronostic de la maladie s’apprécient à l’échelle suisse et mondiale (section 2).</div>
</section>

<section class="ilot" id="j44-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La fréquence de la BPCO se mesure en Suisse et dans le monde par des méthodes différentes : un diagnostic déclaré, une obstruction mesurée et une estimation ne donnent pas les mêmes chiffres. Or, la survie d’un patient dépend de quelques déterminants, et quelques interventions seulement ont prouvé un effet sur elle.</p>
<h3>2.1 Fréquence en Suisse et dans le monde</h3>
<p>La fréquence d’une maladie dépend de la méthode qui la mesure. En effet, pour la BPCO, l’écart entre maladie déclarée et maladie mesurée est considérable.</p>
<p>Le tableau suivant compare quatre sources.</p>
<table class="t"><tr><th>Source</th><th>Population et méthode</th><th>Valeur</th><th>Ce que le chiffre mesure</th></tr>
<tr><td>Enquête suisse sur la santé 2022 (Observatoire suisse de la santé)</td><td>Personnes de 15 ans et plus, environ 22 000 réponses ; diagnostic médical déclaré</td><td>2,0 %</td><td>La maladie connue du patient</td></tr>
<tr><td>Ligue pulmonaire suisse (2023), reprise par l’Office fédéral de la santé publique</td><td>Estimation</td><td>Environ 400 000 personnes</td><td>Une estimation des malades, diagnostiqués ou non</td></tr>
<tr><td><button class="w" data-k="j44-pa-sapaldia">Cohorte suisse SAPALDIA (méthode et résultats)</button> (2010)</td><td>6 126 adultes ; spirométrie ; seuil de la limite inférieure de la normale</td><td>2,5 % entre 30 et 39 ans ; 8,0 % à partir de 70 ans</td><td>L’obstruction mesurée</td></tr>
<tr><td>Revue mondiale (Lancet Respiratory Medicine, 2022)</td><td>Adultes de 30 à 79 ans ; seuil fixe de 0,70 ; modélisation</td><td>10,3 %, soit 391,9 millions de personnes en 2019</td><td>L’obstruction mesurée et extrapolée</td></tr></table>
<p>La lecture du tableau montre que le diagnostic déclaré reste bien au-dessous des prévalences mesurées par spirométrie. Cet écart ne signifie pas que les sources se contredisent : elles ne comptent pas la même chose. Le seuil choisi modifie aussi le résultat : la même revue mondiale trouve 7,6 % avec la limite inférieure de la normale. À cet égard, l’erreur fréquente consiste à citer « 2 % de BPCO en Suisse » comme une prévalence réelle.</p>
<p>L’enquête suisse apporte deux informations utiles au clinicien. Concrètement, la bronchite chronique, la BPCO et l’emphysème déclarés touchent autant les femmes que les hommes et augmentent avec l’âge. Ils suivent aussi un gradient social marqué. Ils touchent 5,1 % des personnes sans formation postobligatoire, 2,6 % des titulaires d’un diplôme du degré secondaire II et 1,1 % des diplômés du degré tertiaire. Par ailleurs, en 2022, 23,9 % des personnes de 15 ans et plus fumaient en Suisse, dont 16,1 % chaque jour.</p>
<p>Dans le monde, l’Organisation mondiale de la santé classe la BPCO au troisième rang des causes de décès (aide-mémoire du 10 juin 2026). Ainsi, la maladie a causé 3,4 millions de décès en 2023, soit environ 6 % de tous les décès. De même, en Suisse, la statistique des causes de décès publiée en ligne pour 2024 n’isole pas la BPCO. Elle compte 4 563 décès pour l’ensemble des maladies de l’appareil respiratoire, soit 2 305 hommes et 2 258 femmes. La mortalité propre à la BPCO en Suisse reste donc une lacune des sources consultées.</p>
<div class="key"><b>À retenir.</b> Environ 2 % des personnes de 15 ans et plus se savent atteintes en Suisse, alors que l’obstruction mesurée touche 8 % des plus de 70 ans. La BPCO est la troisième cause de décès dans le monde.</div>
<h3>2.2 Une maladie largement méconnue</h3>
<p>Le sous-diagnostic est la caractéristique épidémiologique la plus importante pour le médecin de premier recours. Il explique pourquoi la recherche active de cas fait partie de la prise en charge (section 7).</p>
<p>Une analyse internationale d’enquêtes en population a étudié 30 874 adultes de 40 ans et plus, dans 44 sites de 27 pays (Chest, 2015). De fait, chez les personnes dont la spirométrie montrait une obstruction, définie par un rapport après bronchodilatateur inférieur à la limite inférieure de la normale, 81 % n’avaient jamais reçu de diagnostic. Toutefois, selon les sites, cette proportion variait de 50 à 98 %.</p>
<p>Le mécanisme de ce sous-diagnostic est simple. En effet, la dyspnée s’installe lentement, et le patient réduit ses efforts sans s’en rendre compte. De plus, la toux est banalisée comme une conséquence normale du tabac. La spirométrie, enfin, n’est demandée que si le médecin pense à la maladie. Monsieur B. illustre ce parcours : dix ans de toux, trois ans de dyspnée et deux exacerbations avant sa première spirométrie.</p>
<div class="key"><b>À retenir.</b> Environ quatre BPCO mesurées sur cinq ne sont pas diagnostiquées. Le médecin propose donc une spirométrie à tout sujet exposé qui présente des symptômes respiratoires.</div>
<h3>2.3 Ce qui détermine le pronostic</h3>
<p>Le pronostic d’un patient ne se résume pas au VEMS. Ainsi, plusieurs dimensions indépendantes pèsent sur la survie, et un bon indice les combine.</p>
<p>Le VEMS, la dyspnée, la capacité d’effort et l’état nutritionnel prédisent chacun la mortalité. À cet égard, l’<button class="w" data-k="j44-bode">indice BODE (quatre composantes, barème et valeur pronostique)</button> les réunit sur une échelle de 0 à 10. Concrètement, dans sa cohorte de validation de 625 patients, chaque point supplémentaire augmentait le risque de décès de toutes causes (rapport de risques 1,34) et de décès respiratoire (1,62). De plus, l’indice prédisait mieux le décès que le VEMS seul (New England Journal of Medicine, 2004). Enfin, dans cette cohorte, 61 % des décès étaient dus à l’insuffisance respiratoire, 14 % à l’infarctus du myocarde et 12 % au cancer bronchique.</p>
<p>Voici le calcul pour Monsieur B. Ainsi, son VEMS à 45 % vaut 2 points, sa dyspnée de degré 3 à l’échelle mMRC vaut 2 points, et son indice de masse corporelle de 23,7 kg/m² vaut 0 point. Il parcourt 320 mètres au <button class="w" data-k="j44-pa-marche6">test de marche de 6 minutes (technique et interprétation)</button>, ce qui vaut 1 point. Son indice BODE est donc de 5 sur 10.</p>
<p>Les exacerbations assombrissent le pronostic. De fait, après une hospitalisation pour exacerbation, la mortalité à cinq ans avoisine 50 % selon GOLD 2026 ; les taux publiés varient de 23 à 80 % selon les séries. Par ailleurs, les principales causes de décès sont l’insuffisance respiratoire, les maladies cardiovasculaires et le cancer bronchique. De plus, un indice de masse corporelle inférieur à 21 kg/m², une distension marquée et une dyspnée élevée à l’échelle mMRC sont aussi associés à une mortalité accrue.</p>
<div class="key"><b>À retenir.</b> Le pronostic dépend de l’obstruction, de la dyspnée, de l’effort, de la nutrition, des exacerbations et des comorbidités. L’indice BODE combine les quatre premiers éléments ; une hospitalisation pour exacerbation marque un tournant.</div>
<h3>2.4 Les interventions qui modifient la survie</h3>
<p>Beaucoup de traitements améliorent le souffle ou réduisent les exacerbations sans allonger la vie. Dès lors, le médecin doit savoir lesquels ont démontré un effet sur la survie, et dans quelle population.</p>
<p>Le tableau suivant rassemble ces interventions.</p>
<table class="t"><tr><th>Intervention</th><th>Population</th><th>Résultat démontré</th><th>Portée</th></tr>
<tr><td>Arrêt du tabac</td><td>Tout fumeur</td><td>Survie améliorée</td><td>Effet le plus général ; aucune population exclue</td></tr>
<tr><td><button class="w" data-k="j44-pa-old">Oxygénothérapie de longue durée (critères et essais)</button></td><td>Hypoxémie sévère au repos (PaO₂ ≤ 55 mmHg)</td><td>Survie améliorée (essais NOTT, 1980, et Medical Research Council, 1981)</td><td>Aucun bénéfice démontré dans la désaturation modérée (essai LOTT, 2016)</td></tr>
<tr><td>Trithérapie inhalée fixe</td><td>Patients symptomatiques ayant eu des exacerbations fréquentes ou sévères</td><td>Mortalité toutes causes réduite par rapport à la double bronchodilatation (essais IMPACT et ETHOS)</td><td>Populations enrichies : CAT ≥ 10 et au moins deux exacerbations modérées ou une hospitalisation ; dans ETHOS, effet limité à la dose de 320 µg de budésonide</td></tr>
<tr><td><button class="w" data-k="j44-pa-vnidom">Ventilation non invasive à domicile (essais et indications)</button></td><td>Hypercapnie stable marquée</td><td>Mortalité à un an réduite quand les réglages visent une forte baisse de la PaCO₂ (Lancet Respiratory Medicine, 2014)</td><td>L’essai HOT-HMV a prolongé le délai jusqu’à réadmission ou décès, sans preuve isolée sur la mortalité</td></tr>
<tr><td><button class="w" data-k="j44-pa-reduc">Réduction de volume et transplantation (sélection et résultats)</button></td><td>Emphysème sévère très sélectionné</td><td>Survie améliorée après chirurgie de réduction de volume dans l’emphysème des lobes supérieurs avec faible capacité d’effort ; après transplantation, bénéfice de survie à deux ans estimé chez 40 % des patients</td><td>Mortalité accrue par la chirurgie dans d’autres sous-groupes ; estimation de la transplantation fondée sur des données d’observation</td></tr></table>
<p>La lecture du tableau se fait colonne par colonne. La troisième colonne ne s’applique qu’à la population de la deuxième : l’oxygène qui sauve l’hypoxémique sévère n’apporte rien au patient modérément désaturé. En revanche, la réhabilitation n’y figure pas : elle améliore nettement la dyspnée, l’effort et la qualité de vie, mais GOLD 2026 juge encore peu concluantes les données de mortalité. Enfin, les essais d’une association corticostéroïde inhalé et bêta-2 agoniste contre placebo, ainsi que l’essai UPLIFT avec le tiotropium, n’ont pas montré de réduction de la mortalité.</p>
<div class="key"><b>À retenir.</b> L’arrêt du tabac et l’oxygène chez l’hypoxémique sévère allongent la survie. La trithérapie, la ventilation à domicile et la réduction de volume le font dans des populations précises. Pour Monsieur B., fumeur actif, l’arrêt du tabac est la première mesure vitale.</div>
<div class="key"><b>À retenir.</b> La BPCO est fréquente, sous-diagnostiquée et mortelle ; son pronostic se mesure par plusieurs dimensions. Les mécanismes reliant le tabac à l’obstruction, à la dyspnée et à l’insuffisance respiratoire sont détaillés en section 3.</div>
</section>

<section class="ilot" id="j44-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Dans la BPCO, l’air sort mal et le patient peut s’essouffler à l’effort. Ainsi, les troubles des échanges peuvent entraîner une hypoxémie ou une hypercapnie. Ces phénomènes s’expliquent à partir du poumon normal : l’agression et l’inflammation produisent des conséquences qui s’étendent jusqu’au cœur droit et aux muscles. Dès lors, chaque mécanisme justifie un examen ou un traitement décrit plus loin.</p>
<h3>3.1 Le poumon normal : pourquoi l’air sort vite et complètement</h3>
<p>Comprendre l’obstruction suppose de savoir ce qui la prévient chez le sujet sain. En effet, deux forces maintiennent les petites bronches ouvertes pendant l’expiration.</p>
<p>Les bronchioles de moins de 2 mm n’ont pas de cartilage. Elles restent ouvertes grâce aux parois des alvéoles voisines, qui s’insèrent sur leur surface et les tirent vers l’extérieur : ce sont les attaches alvéolaires. La deuxième force est la rétraction élastique du poumon, due surtout à l’élastine. Concrètement, pendant l’expiration forcée, cette rétraction pousse l’air hors des alvéoles et maintient le calibre bronchique. Chez l’adulte sain, l’essentiel de la capacité vitale sort donc en une seconde.</p>
<p>Deux autres fonctions normales comptent pour la suite. Par ailleurs, l’épithélium cilié et le mucus évacuent en permanence les particules inhalées. Enfin, une artériole pulmonaire se contracte lorsque l’alvéole qu’elle irrigue manque d’oxygène : cette vasoconstriction hypoxique détourne le sang vers les zones bien ventilées et préserve l’oxygénation.</p>


<p>Dans la bronchiole saine, les attaches alvéolaires tendues tirent la paroi vers l’extérieur : la lumière reste donc large, même quand la pression autour de la bronchiole augmente pendant l’expiration. Dans la BPCO, en revanche, trois lésions s’additionnent : la paroi épaissie et le mucus réduisent la lumière, et la destruction des attaches supprime la traction qui la maintenait ouverte. L’erreur fréquente consiste ainsi à ne voir dans la BPCO qu’un rétrécissement des bronches, alors que la perte de soutien compte autant.</p>
<div class="key"><b>À retenir.</b> Chez le sujet sain, les attaches alvéolaires et la rétraction élastique gardent les petites bronches ouvertes. La BPCO attaque ces deux soutiens en même temps qu’elle épaissit la paroi bronchique.</div>
<h3>3.2 L’agression inhalée et l’inflammation</h3>
<p>La BPCO commence par une réponse inflammatoire à une agression répétée. Cette réponse existe chez tout fumeur, mais elle est amplifiée et prolongée chez les sujets qui développent la maladie.</p>
<p>La fumée de tabac et les particules inhalées activent les macrophages alvéolaires et les cellules épithéliales. Ces cellules libèrent des médiateurs qui attirent d’autres cellules : la <button class="w" data-k="j44-inflam">CXCL8 et les autres médiateurs (inflammation neutrophilique de la BPCO)</button>, le LTB₄ et le TNF-α. Les neutrophiles et les lymphocytes T CD8 affluent alors dans les voies aériennes et le parenchyme. De plus, une étude de pièces opératoires a porté sur 159 patients (New England Journal of Medicine, 2004). En outre, la progression de la maladie s’y accompagnait d’un épaississement de la paroi des petites bronches et d’exsudats muqueux dans leur lumière. Enfin, l’infiltration par des neutrophiles, des macrophages et des lymphocytes CD4, CD8 et B augmentait aussi, jusqu’à former des follicules lymphoïdes.</p>
<p>Le stress oxydant entretient ce processus. Ainsi, les oxydants proviennent de la fumée elle-même et des cellules inflammatoires activées. Ils réduisent l’activité de l’histone désacétylase 2, une enzyme par laquelle les corticostéroïdes éteignent l’inflammation : c’est une raison de la faible réponse aux corticostéroïdes. En outre, selon GOLD 2026, l’inflammation peut persister après l’arrêt du tabac, par des mécanismes encore mal compris.</p>
<p>Une minorité de patients présente une inflammation différente, riche en éosinophiles et en cellules lymphoïdes innées de type 2, proche de celle de l’asthme. Ces patients répondent mieux aux corticostéroïdes inhalés et aux biothérapies. C’est pourquoi les éosinophiles sanguins guident ces traitements (section 9).</p>
<div class="key"><b>À retenir.</b> L’inflammation de la BPCO est surtout neutrophilique et relativement résistante aux corticostéroïdes. Un sous-groupe à éosinophiles fait exception, et la numération des éosinophiles le repère.</div>
<h3>3.3 Protéases, antiprotéases et emphysème</h3>
<p>L’emphysème résulte d’un déséquilibre entre les enzymes qui dégradent le tissu pulmonaire et celles qui les inhibent. Ce déséquilibre explique aussi le rôle du déficit génétique en alpha-1 antitrypsine.</p>
<p>Les neutrophiles libèrent l’élastase, et les macrophages libèrent des métalloprotéases, dont la MMP-12. Ces enzymes détruisent l’élastine des parois alvéolaires. Or, l’<button class="w" data-k="j44-aat">alpha-1 antitrypsine (rôle, dosage et interprétation)</button>, synthétisée par le foie, est le principal inhibiteur de l’élastase dans le poumon. De plus, la fumée de tabac oxyde un acide aminé de son site actif et l’inactive : le fumeur crée ainsi un déficit fonctionnel, même avec des gènes normaux. De même, le déficit génétique produit le même effet dès le plus jeune âge, et le tabac l’aggrave.</p>
<p>La destruction des parois produit l’<button class="w" data-k="j44-emph">emphysème (définition, types et conséquences)</button>. Elle a trois conséquences. De fait, la surface d’échange diminue, ce qui abaisse la diffusion du monoxyde de carbone. De plus, la rétraction élastique baisse, ce qui ralentit l’expiration. Enfin, la perte des attaches alvéolaires laisse les bronchioles se fermer pendant l’expiration.</p>
<div class="key"><b>À retenir.</b> L’emphysème naît d’un excès de protéases sur les antiprotéases. Le tabac inactive l’alpha-1 antitrypsine, et le déficit génétique la supprime : les deux mécanismes s’additionnent chez le fumeur déficitaire.</div>
<h3>3.4 Les petites voies aériennes, premier site de l’obstruction</h3>
<p>L’obstruction de la BPCO siège surtout dans les bronches de moins de 2 mm. Cette localisation explique pourquoi la maladie reste longtemps silencieuse.</p>
<p>Une étude a comparé des poumons de patients transplantés et des poumons de donneurs par tomodensitométrie et microtomodensitométrie (New England Journal of Medicine, 2011). Au stade GOLD 4, le nombre de bronchioles terminales était réduit de 72 à 89 %, et leur section totale de 81 à 99,7 %. Ainsi, le rétrécissement et la disparition des bronchioles précédaient la destruction emphysémateuse. Les <button class="w" data-k="j44-pa-petitesva">petites voies aériennes (zone silencieuse et mesure)</button> sont donc atteintes tôt.</p>
<p>La maladie reste pourtant longtemps silencieuse. Or, les petites bronches sont très nombreuses et leur section totale est immense : leur part dans la résistance totale est faible chez le sujet sain. Il faut en perdre beaucoup avant que le VEMS baisse et que la dyspnée apparaisse. De plus, le mucus aggrave l’obstruction. En effet, selon GOLD 2026, un mucus produit dans les grosses bronches provoque la toux et l’expectoration, alors qu’un mucus qui obstrue les petites bronches provoque surtout de la dyspnée, avec peu de toux. Concrètement, les <button class="w" data-k="j44-pa-mucus">bouchons muqueux (mécanisme et portée pronostique)</button> visibles au scanner sont associés à une obstruction plus sévère et à une mortalité accrue.</p>
<div class="key"><b>À retenir.</b> Les petites voies aériennes sont le premier site de l’obstruction. Leur perte précède l’emphysème et passe longtemps inaperçue, ce qui explique le diagnostic tardif.</div>
<h3>3.5 Distension et dyspnée</h3>
<p>La dyspnée de la BPCO ne s’explique pas seulement par un débit expiratoire bas. Elle vient surtout de l’air qui reste piégé dans le thorax, au repos puis à l’effort.</p>
<p>Chez le sujet sain, la fin de l’expiration survient à un volume d’équilibre : la rétraction du poumon vers l’intérieur y compense celle du thorax vers l’extérieur. Or, dans la BPCO, deux phénomènes élèvent ce volume. Ainsi, la perte de rétraction élastique de l’emphysème déplace l’équilibre vers un volume plus haut : c’est la <button class="w" data-k="j44-disten">distension statique et dynamique (mécanisme et mesure)</button>. Ensuite, l’expiration est si lente que l’inspiration suivante commence avant que le poumon soit vidé. À l’effort, la fréquence respiratoire augmente, le temps expiratoire raccourcit et le volume de fin d’expiration monte encore : c’est la distension dynamique.</p>


<p>À l’effort, le contraste est net. Chez le sujet sain, en effet, les muscles expiratoires abaissent le volume de fin d’expiration, si bien que le volume courant s’élargit largement sans approcher la capacité pulmonaire totale. De fait, Dans la BPCO, au contraire, le volume de fin d’expiration monte à l’effort, et le volume courant ne peut plus s’élargir que vers le haut, là où il reste peu de place. Le patient respire alors près de la capacité pulmonaire totale, là où le poumon est le plus rigide ; par conséquent, chaque inspiration exige un effort croissant pour un gain de volume minime, et cette dissociation entre l’effort et le résultat est vécue comme une soif d’air.</p>
<p>Trois autres conséquences aggravent la situation. Ainsi, le diaphragme aplati travaille sur une longueur défavorable et produit moins de force. De plus, la pression positive qui persiste dans les alvéoles en fin d’expiration, appelée pression expiratoire positive intrinsèque, doit être vaincue avant que l’air entre : elle augmente le travail inspiratoire. Enfin, selon GOLD 2026, la distension est associée à la dyspnée, à l’intolérance à l’effort, aux hospitalisations, à l’insuffisance respiratoire et à la mortalité ; elle existe déjà dans les obstructions légères.</p>
<p>Monsieur B. s’arrête après 100 mètres pour cette raison. Par exemple, en marchant, sa fréquence respiratoire augmente et son volume de fin d’expiration monte ; quand le volume courant atteint son plafond, il doit s’arrêter pour vider ses poumons. C’est aussi pourquoi un bronchodilatateur améliore sa dyspnée davantage que son VEMS : en accélérant la vidange, il abaisse le volume de fin d’expiration et rend de la place au volume courant.</p>
<div class="key"><b>À retenir.</b> La distension dynamique est le mécanisme principal de la dyspnée d’effort. Elle explique la respiration à lèvres pincées, l’arrêt après une courte distance et le bénéfice des bronchodilatateurs sur le souffle.</div>
<h3>3.6 Échanges gazeux : l’hypoxémie, puis l’hypercapnie</h3>
<p>Les lésions des bronches, des alvéoles et des vaisseaux désorganisent la rencontre de l’air et du sang. L’oxygène baisse d’abord ; le dioxyde de carbone monte plus tard et plus rarement.</p>
<p>Selon GOLD 2026, le mécanisme principal est l’<button class="w" data-k="j44-pa-vq">inégalité des rapports ventilation-perfusion (hypoxémie, hypercapnie et oxygène)</button>. D’une part, certaines zones restent perfusées mais mal ventilées : le sang y passe sans s’oxygéner, ce qui produit l’hypoxémie. D’autre part, d’autres zones, emphysémateuses, restent ventilées mais mal perfusées : cette ventilation est gaspillée. La destruction des capillaires abaisse aussi la diffusion du monoxyde de carbone.</p>
<p>L’hypercapnie apparaît lorsque la ventilation utile ne suffit plus à éliminer le dioxyde de carbone produit. Plusieurs facteurs y conduisent : la ventilation gaspillée augmente, la respiration devient rapide et superficielle, et les muscles respiratoires se fatiguent. Enfin, plus rarement, une diminution de la commande respiratoire, due par exemple aux sédatifs ou aux hypnotiques, provoque une insuffisance respiratoire hypercapnique. Lorsque l’hypercapnie s’installe lentement, le rein retient des bicarbonates et le pH se normalise : c’est l’acidose respiratoire compensée.</p>
<p>Ce mécanisme explique le danger de l’oxygène à haut débit. En effet, chez l’hypercapnique, l’oxygène lève la vasoconstriction hypoxique : le sang revient vers des zones mal ventilées, et la ventilation gaspillée augmente. L’oxygène réduit aussi la capacité de l’hémoglobine à transporter le dioxyde de carbone (effet Haldane). Dès lors, la PaCO₂ monte, et la conscience peut baisser. C’est la raison de la cible de saturation de 88 à 92 % en exacerbation (section 8).</p>
<div class="key"><b>À retenir.</b> Les inégalités ventilation-perfusion causent l’hypoxémie ; l’hypercapnie traduit une ventilation utile insuffisante. Chez l’hypercapnique, un excès d’oxygène élève encore la PaCO₂.</div>
<h3>3.7 Circulation pulmonaire et cœur droit</h3>
<p>Le cœur droit subit les conséquences vasculaires de la maladie. Or, leur reconnaissance change le pronostic et la prise en charge.</p>
<p>Selon GOLD 2026, les artères pulmonaires se remodèlent dès les stades légers : l’intima et le muscle lisse s’épaississent. Ensuite, plus tard, deux mécanismes élèvent la pression pulmonaire : la vasoconstriction hypoxique devenue permanente et la perte du lit capillaire détruit par l’emphysème. Concrètement, l’<button class="w" data-k="j44-pa-htp">hypertension pulmonaire et le cœur pulmonaire chronique (définition, fréquence et conduite)</button> se définissent par une pression artérielle pulmonaire moyenne supérieure à 20 mmHg au cathétérisme droit. En effet, une élévation légère concerne 25 à 30 % des patients, et une hypertension pulmonaire sévère environ 5 %. Dès lors, le ventricule droit s’hypertrophie, puis il défaille : ce sont les œdèmes et la turgescence jugulaire du cœur pulmonaire chronique.</p>
<p>L’hypoxémie chronique stimule aussi la production d’érythropoïétine par le rein. Il en résulte une polyglobulie secondaire, que GOLD 2026 retrouve chez 6 à 10,2 % des patients suivis en consultation. Cette polyglobulie s’associe à l’hypertension pulmonaire, à la maladie thromboembolique veineuse et à une mortalité accrue ; l’oxygénothérapie de longue durée est associée à un risque plus faible de polyglobulie.</p>
<div class="key"><b>À retenir.</b> L’hypoxie chronique contracte les artérioles pulmonaires et stimule l’érythropoïèse. L’oxygène corrige ces deux mécanismes, ce qui explique son indication en cas d’hypertension pulmonaire ou de polyglobulie (section 10).</div>
<h3>3.8 Effets systémiques et exacerbations</h3>
<p>La BPCO ne se limite pas au poumon. Elle retentit sur les muscles, la nutrition et le cœur, et elle connaît des aggravations aiguës qui partagent ses mécanismes.</p>
<p>Selon GOLD 2026, des médiateurs inflammatoires circulants contribuent à la fonte musculaire et à la cachexie. Par ailleurs, la <button class="w" data-k="j44-pa-systemique">dysfonction des muscles squelettiques (mécanismes et réversibilité)</button> associe une perte de fibres et un fonctionnement anormal des fibres restantes. Elle provient de l’inactivité, d’une alimentation insuffisante, de l’inflammation et de l’hypoxie. Elle limite l’effort indépendamment du poumon, et la réhabilitation peut la corriger.</p>
<p>Lors d’une exacerbation, une infection, le plus souvent virale, ou une pollution augmente l’inflammation des voies aériennes et de l’organisme. Ainsi, la production de mucus s’accroît, le piégeage et la distension s’aggravent, et le débit expiratoire chute : la dyspnée augmente brutalement. Les inégalités ventilation-perfusion s’aggravent aussi, ce qui peut produire une hypoxémie avec ou sans hypercapnie. Enfin, la prise en charge de cette situation est détaillée en section 8.</p>


<p>Aucune étape de cette chaîne n’est isolée. De fait, une inflammation plus intense accélère les lésions, une distension plus forte aggrave les échanges gazeux et la dyspnée, et l’hypoxémie retentit sur le cœur droit. C’est pourquoi le traitement agit à plusieurs niveaux, comme le montre le tableau de corrélation qui suit.</p>
<div class="key"><b>Corrélation physiopathologie → traitement.</b> L’arrêt du tabac supprime l’agression initiale. Les bronchodilatateurs de longue durée accélèrent la vidange des poumons et réduisent la distension, ce qui explique un gain de dyspnée supérieur au gain de VEMS. Les corticostéroïdes inhalés agissent surtout chez les patients à inflammation éosinophilique. L’oxygène corrige l’hypoxémie et freine l’hypertension pulmonaire. La réhabilitation corrige une partie de la dysfonction musculaire.</div>
<div class="key"><b>À retenir.</b> La BPCO associe une inflammation surtout neutrophilique, une perte précoce des petites voies aériennes, un emphysème, une distension et des troubles des échanges gazeux. Les causes de ce processus se recherchent chez chaque patient (section 4).</div>
</section>

<section class="ilot" id="j44-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Le tabac domine les causes de la BPCO, mais il n’explique ni toutes les BPCO ni la vulnérabilité de certains fumeurs. Le médecin recherche donc aussi les expositions professionnelles, le développement pulmonaire de l’enfance et le déficit en alpha-1 antitrypsine, parce que chacun change la conduite à tenir.</p>
<h3>4.1 Le tabac, cause principale</h3>
<p>Le tabagisme est la cause la plus fréquente de BPCO dans les pays à revenu élevé. En effet, sa quantification fait partie de l’anamnèse de base.</p>
<p>Selon l’Organisation mondiale de la santé, le tabac explique plus de 70 % des cas de BPCO dans les pays à revenu élevé (aide-mémoire du 10 juin 2026). Ainsi, dans la revue mondiale de 2022, le tabagisme actuel multipliait la cote de BPCO par 3,2, et le fait d’avoir fumé à un moment de la vie la multipliait par 2,3. De plus, le risque croît avec la dose cumulée, exprimée en <button class="w" data-k="j44-a-tabac">paquets-années (calcul et questions à poser)</button>. Concrètement, on la calcule en multipliant le nombre de paquets de 20 cigarettes fumés par jour par le nombre d’années de tabagisme.</p>
<p>Tous les fumeurs ne développent cependant pas une BPCO. Par ailleurs, la vulnérabilité dépend du capital pulmonaire de départ, des gènes et des autres expositions. De même, GOLD 2026 range dans la même catégorie causale le tabagisme actif, le tabagisme passif, l’exposition au tabac pendant la vie fœtale, le vapotage et le cannabis. Le tabagisme maternel pendant la grossesse compte ainsi parmi les causes d’une fonction pulmonaire basse à l’âge adulte.</p>
<p>L’arrêt du tabac modifie l’évolution. Concrètement, selon GOLD 2026, chez des fumeurs de 36 à 43 ans qui produisaient du mucus de façon chronique, la production est revenue au niveau des non-fumeurs après l’arrêt. De même, en Suisse, 23,9 % des personnes de 15 ans et plus fumaient en 2022 : la prévention garde donc une portée considérable.</p>
<div class="key"><b>À retenir.</b> Le tabac cause la majorité des BPCO des pays riches, avec un effet proportionnel aux paquets-années. Il n’en explique pas toutes, et tous les fumeurs ne deviennent pas malades.</div>
<h3>4.2 Expositions professionnelles et environnementales</h3>
<p>Une part importante des BPCO provient d’expositions autres que le tabac. En effet, leur recherche a des conséquences médicales et médico-légales.</p>
<p>La déclaration officielle de l’American Thoracic Society et de l’European Respiratory Society (2019) s’appuie sur 26 études. Elle estime que 14 % des BPCO sont attribuables aux expositions professionnelles (intervalle de confiance à 95 % : 10 à 18 %). Ainsi, chez les personnes n’ayant jamais fumé, cette fraction atteint 31 % (18 à 43 %), à partir de six études. Les <button class="w" data-k="j44-a-metier">expositions professionnelles (reconstituer la chronologie)</button> les plus fréquentes sont les poussières minérales, dont la silice des chantiers et des mines. Viennent ensuite les vapeurs, les gaz et les fumées, ainsi que les poussières agricoles. Enfin, dans la revue mondiale de 2022, l’exposition professionnelle aux poussières ou aux fumées multipliait la cote de BPCO par 1,4.</p>
<p>La combustion de biomasse à l’intérieur des habitations, pour cuisiner ou se chauffer, est une cause majeure dans les pays à revenu faible, surtout chez les femmes. De même, la même revue chiffre à 1,4 son effet sur la cote de BPCO. GOLD 2026 range enfin la pollution de l’air ambiant et les fumées d’incendie parmi les causes environnementales.</p>
<div class="key"><b>À retenir.</b> Environ une BPCO sur sept est attribuable au travail, et près d’une sur trois chez les personnes n’ayant jamais fumé. Le médecin reconstitue donc toujours le parcours professionnel.</div>
<h3>4.3 Croissance pulmonaire et trajectoires de la fonction respiratoire</h3>
<p>La fonction respiratoire d’un adulte dépend de ce qu’il a atteint à la fin de sa croissance autant que de la vitesse de son déclin. Cette notion récente explique les BPCO sans déclin accéléré.</p>
<p>Selon GOLD 2026, les poumons grandissent jusqu’à 20 à 25 ans, un peu plus tôt chez la femme. La fonction atteint alors un pic, se maintient sur un court plateau, puis décline lentement avec le vieillissement. Or, la grossesse, la naissance, l’enfance et l’adolescence peuvent modifier cette trajectoire : prématurité, petit poids de naissance, tabagisme maternel, tabagisme passif et infections respiratoires sévères de l’enfance réduisent le pic atteint.</p>
<p>Trois trajectoires de la fonction respiratoire au cours de la vie doivent être distinguées : une trajectoire normale, une trajectoire dont le pic est bas mais le déclin normal, et une trajectoire au pic normal mais au déclin accéléré.</p>

<p>Ces trajectoires se distinguent par le moment où elles franchissent le seuil d’obstruction mesurable. La trajectoire normale ne le franchit jamais ; en revanche, celle du déclin accéléré le franchit vers 70 ans, parce qu’un déclin rapide épuise un capital normal : c’est le modèle historique du fumeur sensible. La trajectoire au pic bas le franchit aussi, alors que son déclin est normal, car elle partait trop bas. Selon GOLD 2026, trois cohortes longitudinales ont d’ailleurs montré qu’environ la moitié des BPCO suit le modèle du déclin accéléré, et l’autre moitié celui d’une croissance pulmonaire insuffisante.</p>
<div class="key"><b>À retenir.</b> Une BPCO peut naître d’un pic de fonction trop bas autant que d’un déclin trop rapide. Les antécédents de la grossesse et de l’enfance font donc partie de l’anamnèse de l’adulte.</div>
<h3>4.4 Facteurs de l’hôte : gènes, asthme, infections, sexe et conditions sociales</h3>
<p>À exposition égale, certains individus sont plus vulnérables. En effet, le médecin recherche ces facteurs parce que plusieurs d’entre eux se dépistent ou se traitent.</p>
<p>Le <button class="w" data-k="j44-pa-daat">déficit en alpha-1 antitrypsine (qui tester, pourquoi et que faire)</button> est le facteur génétique le mieux établi. De fait, selon GOLD 2026, une revue de 20 études européennes a trouvé le génotype PiZZ chez 0,12 % des patients atteints de BPCO (0,08 à 0,24 %). Il produit un emphysème précoce, souvent avant 45 ans, prédominant aux bases, et il est fortement aggravé par le tabac. De même, selon des études de fratries citées par GOLD 2026, les porteurs hétérozygotes PiMZ n’ont pas de risque accru s’ils ne fument pas. En outre, s’ils fument, leur fonction respiratoire est plus basse que celle de leurs frères et sœurs de génotype normal.</p>
<p>L’asthme est un facteur de risque puissant. Ainsi, dans la cohorte suisse SAPALDIA, un asthme multipliait la cote d’obstruction par 6,7, contre 1,8 pour le tabagisme. De même, selon GOLD 2026, les patients asthmatiques ont un risque élevé de BPCO, même après prise en compte du tabac. Les infections comptent aussi : une infection respiratoire sévère de l’enfance, une tuberculose ou une infection par le VIH augmentent le risque de BPCO.</p>
<p>Dans les pays à revenu élevé, la prévalence de la BPCO est désormais presque égale chez l’homme et chez la femme. Par ailleurs, certaines études suggèrent que la femme est plus vulnérable à dose de tabac égale. Enfin, la pauvreté est constamment associée à l’obstruction, et l’enquête suisse montre un gradient net selon le niveau de formation (section 2).</p>
<div class="trap"><span class="k">Piège</span>Une BPCO chez un non-fumeur, chez un patient de moins de 45 ans ou avec un emphysème des bases fait penser au déficit en alpha-1 antitrypsine. GOLD 2026 recommande pourtant de le rechercher <b>chez tout patient atteint de BPCO</b>, car des diagnostics tardifs concernent aussi des patients âgés porteurs d’un emphysème des sommets.</div>
<div class="key"><b>À retenir.</b> Le déficit en alpha-1 antitrypsine, l’asthme, les infections de l’enfance et la pauvreté rendent le poumon vulnérable. Le dosage de l’alpha-1 antitrypsine se fait une fois chez tout patient.</div>
<h3>4.5 Les facteurs de risque de Monsieur B.</h3>
<p>Chez un même patient, ces facteurs s’additionnent et orientent les questions de l’anamnèse.</p>
<p>Monsieur B. cumule deux expositions majeures. Concrètement, ses 45 paquets-années suffisent à expliquer une BPCO. De plus, ses 42 ans de chantier l’ont exposé à des poussières minérales, dont la silice, qui ajoutent une part professionnelle au risque. Enfin, le médecin demande s’il est né prématurément, s’il a eu des pneumonies dans l’enfance et si sa mère fumait, pour situer son capital pulmonaire de départ. Il prescrit un dosage de l’alpha-1 antitrypsine, comme chez tout patient. Il documente enfin l’exposition professionnelle dans le dossier, avec les dates et les postes occupés.</p>
<div class="key"><b>À retenir.</b> Chez Monsieur B., le tabac et la profession s’additionnent. L’anamnèse relie ces facteurs aux symptômes et à leurs caractéristiques (section 5).</div>
</section>

<section class="ilot" id="j44-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse traduit les facteurs de risque et les mécanismes en questions. Elle poursuit trois buts : estimer la probabilité de BPCO, mesurer la gêne et le risque d’exacerbation, et repérer ce qui imite ou aggrave la maladie. Ainsi, pour chaque antécédent et chaque symptôme, la question à poser et l’interprétation de la réponse sont précisées.</p>
<h3>5.1 Les antécédents à rechercher, et pourquoi</h3>
<p>Un antécédent n’est utile que s’il change une probabilité ou une décision. En effet, certains antécédents expliquent la maladie ; d’autres l’imitent ou l’aggravent.</p>
<div class="two"><div class="card"><h4>Expositions et terrain respiratoire</h4><p><button class="w" data-k="j44-a-tabac">Tabac, cannabis et produits inhalés (quantifier l’exposition)</button> : le médecin calcule les paquets-années, car le risque croît avec la dose cumulée.</p><p><button class="w" data-k="j44-a-metier">Poussières, fumées et profession (reconstituer la chronologie)</button> : il fait décrire chaque poste, car environ une BPCO sur sept est d’origine professionnelle.</p><p><button class="w" data-k="j44-a-enfance">Enfance, asthme et infections (situer le capital pulmonaire)</button> : une prématurité, un asthme, une tuberculose ou une infection par le VIH modifient le risque et parfois le traitement.</p><p><button class="w" data-k="j44-a-famille">Emphysème familial et maladie du foie (penser à l’alpha-1 antitrypsine)</button> : une histoire familiale fait rechercher un déficit génétique et justifie un dépistage des apparentés.</p><p><button class="w" data-k="j44-a-exa">Exacerbations et hospitalisations (dater et qualifier)</button> : une seule exacerbation modérée ou sévère dans l’année place le patient dans le groupe E.</p></div><div class="card"><h4>Comorbidités qui imitent ou aggravent</h4><p><button class="w" data-k="j44-a-cardio">Maladie cardiaque et œdèmes (distinguer les dyspnées)</button> : une insuffisance cardiaque touche 20 à 30 % des patients atteints de BPCO et produit les mêmes plaintes.</p><p><button class="w" data-k="j44-a-sommeil">Ronflement, somnolence et apnées (chercher une autre cause d’hypercapnie)</button> : l’association à une apnée du sommeil aggrave l’hypoxémie nocturne et le pronostic.</p><p><button class="w" data-k="j44-a-psy">Anxiété, dépression et sédatifs (mesurer l’impact et la sécurité)</button> : ces troubles sont fréquents, augmentent les exacerbations et se traitent.</p><p><button class="w" data-k="j44-a-metab">Diabète, os et nutrition (repérer les comorbidités métaboliques)</button> : ces maladies pèsent sur le pronostic et interfèrent avec les corticostéroïdes.</p></div></div>
<p>GOLD 2026 ajoute trois points à cette liste. Ensuite, le médecin fait décrire l’évolution des symptômes. En effet, la plupart des patients remarquent pendant des années un essoufflement croissant et des « rhumes d’hiver » plus fréquents ou plus longs avant de consulter. Il relève les médicaments, car un inhibiteur de l’enzyme de conversion peut expliquer une toux chronique. Il mesure enfin l’impact sur la vie quotidienne, le travail, la famille et la sexualité, ainsi que le soutien social disponible.</p>
<div class="key"><b>À retenir.</b> Les antécédents décisifs sont le tabac chiffré, la profession, l’enfance, l’histoire familiale et les exacerbations de l’année. Les comorbidités cardiaques, du sommeil et de l’humeur sont recherchées dès la première consultation.</div>
<h3>5.2 Les symptômes : fréquence, mécanisme et signaux d’alarme</h3>
<p>Les symptômes de la BPCO sont peu spécifiques, mais leur fréquence, leur mécanisme et leurs signaux d’alarme orientent l’examen. À cet égard, GOLD 2026 en donne les proportions principales.</p>
<p>Le tableau suivant classe les symptômes du plus caractéristique au plus tardif.</p>
<table class="t"><tr><th>Symptôme</th><th>Fréquence (source)</th><th>Mécanisme</th><th>Signal d’alarme</th></tr>
<tr><td><button class="w" data-k="j44-s-dysp">Dyspnée (caractérisation)</button></td><td>Symptôme le plus caractéristique ; modérée à sévère chez plus de 40 % des patients suivis en soins primaires (GOLD 2026)</td><td>Distension dynamique, troubles des échanges gazeux, dysfonction musculaire, anxiété</td><td>Aggravation brutale, orthopnée, dyspnée de repos</td></tr>
<tr><td><button class="w" data-k="j44-s-toux">Toux chronique (caractérisation)</button></td><td>Souvent le premier symptôme ; toux avec expectoration chez jusqu’à 30 % des patients (GOLD 2026)</td><td>Irritation et mucus des grosses bronches</td><td>Hémoptysie, changement de caractère, syncope de toux</td></tr>
<tr><td><button class="w" data-k="j44-s-crachats">Expectoration (interprétation)</button></td><td>Bronchite chronique chez 27 à 35 % des patients (GOLD 2026)</td><td>Hypersécrétion des glandes et des cellules caliciformes</td><td>Purulence nouvelle ; volume très abondant (bronchectasies)</td></tr>
<tr><td><button class="w" data-k="j44-s-siffle">Sifflements et oppression (interprétation)</button></td><td>Fréquents et variables d’un jour à l’autre ; GOLD 2026 ne les chiffre pas</td><td>Obstruction variable ; contraction isométrique des muscles intercostaux</td><td>Variabilité marquée (asthme) ; douleur thoracique vraie (syndrome coronarien)</td></tr>
<tr><td><button class="w" data-k="j44-s-poids">Fatigue et amaigrissement (interprétation)</button></td><td>Fatigue parmi les symptômes les plus fréquents ; perte de poids et d’appétit fréquentes aux stades sévères (GOLD 2026)</td><td>Déconditionnement, inflammation systémique, dénutrition</td><td>Amaigrissement nouveau : cancer bronchique, tuberculose</td></tr>
<tr><td>Œdèmes des chevilles</td><td>Stade avancé</td><td>Cœur pulmonaire chronique (section 3)</td><td>Orthopnée associée : insuffisance cardiaque gauche</td></tr></table>
<p>La lecture du tableau commence par la dernière colonne : un signal d’alarme passe avant la probabilité de BPCO. Un fumeur qui perd 6 kg en trois mois fait d’abord rechercher un cancer bronchique, même si sa BPCO est connue. En effet, selon GOLD 2026, la perte de poids et la fonte musculaire ont une valeur pronostique et peuvent aussi révéler une tuberculose ou un cancer : elles sont toujours explorées. Or, l’erreur fréquente consiste à attribuer toute dyspnée nouvelle à la BPCO connue ; une orthopnée ou une aggravation rapide font chercher une cause cardiaque.</p>
<p>Deux particularités de l’expectoration méritent l’attention. En effet, beaucoup de patients avalent leurs crachats, ce qui sous-estime le symptôme. De plus, une purulence traduit une augmentation des médiateurs inflammatoires ; son association avec une infection bactérienne existe, mais elle reste faible. La toux, enfin, peut provoquer des syncopes et des fractures de côtes, parfois indolores, chez les patients très obstrués.</p>
<div class="key"><b>À retenir.</b> La dyspnée d’effort est le symptôme cardinal ; la toux en est souvent le premier signe. Un amaigrissement, une hémoptysie ou une orthopnée font chercher une autre maladie.</div>
<h3>5.3 La mesure de la gêne : échelle mMRC et questionnaire CAT</h3>
<p>La gêne ressentie ne se déduit pas du VEMS. Pour cela, deux instruments la mesurent en quelques minutes, et le résultat guide le traitement initial et le suivi.</p>
<p>L’<button class="w" data-k="j44-mmrc">échelle mMRC (cinq degrés)</button> ne mesure que la dyspnée, de 0 (essoufflé seulement à l’effort intense) à 4 (trop essoufflé pour sortir de chez soi). Elle est simple et prédit la mortalité. De même, le <button class="w" data-k="j44-cat">questionnaire CAT (huit items, seuils et différence minimale)</button> mesure l’impact global : toux, expectoration, oppression, essoufflement en montée, activités domestiques, confiance pour sortir, sommeil et énergie. De fait, chaque item vaut de 0 à 5, soit un total de 0 à 40. Enfin, une variation de 2 points est la plus petite différence cliniquement importante.</p>
<p>Monsieur B. s’arrête après environ 100 mètres à plat : il est au degré 3 de l’échelle mMRC. Ainsi, Son CAT vaut 22, avec des scores élevés pour l’essoufflement en montée, les activités domestiques et le sommeil. Ces deux mesures serviront de référence pour juger l’effet du traitement.</p>
<div class="key"><b>À retenir.</b> L’échelle mMRC mesure la dyspnée, le CAT l’impact global. Un degré mMRC ≥ 2 ou un CAT ≥ 10 définit un patient symptomatique ; le médecin note les deux à chaque consultation.</div>
<h3>5.4 Formes typiques et atypiques</h3>
<p>La BPCO se présente sous plusieurs visages. Concrètement, reconnaître une forme atypique évite de passer à côté du diagnostic ou d’une cause particulière.</p>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Le patient est un fumeur de plus de 40 ans. Ainsi, sa dyspnée d’effort progresse depuis des années, il tousse et crache le matin, et ses exacerbations surviennent en hiver.</p></div>
<div class="card"><h4>Forme à emphysème prédominant</h4><p>Le patient est souvent maigre et très essoufflé, mais il tousse peu. De plus, son thorax est distendu, il respire lèvres pincées, et la diffusion du monoxyde de carbone est très abaissée.</p></div>
<div class="card"><h4>Forme à bronchite chronique prédominante</h4><p>La toux et l’expectoration sont abondantes, les exacerbations fréquentes. En revanche, l’hypoxémie et les œdèmes apparaissent plus tôt, et le patient est souvent en surpoids.</p></div>
<div class="card"><h4>Forme révélée par une exacerbation</h4><p>Le patient consulte pour une « bronchite » grave sans avoir jamais eu de spirométrie. Ensuite, le médecin mesure la fonction à distance, en état stable, car une spirométrie faite pendant l’épisode surestimerait l’obstruction.</p></div>
<div class="card"><h4>Forme du non-fumeur ou du sujet jeune</h4><p>Une BPCO avant 50 ans ou sans tabagisme fait rechercher un déficit en alpha-1 antitrypsine, une exposition professionnelle, un asthme ancien ou un pic de fonction bas. À cet égard, dans la cohorte suisse SAPALDIA, 29,3 % des sujets obstrués n’avaient jamais fumé.</p></div>
<div class="card"><h4>Forme associée à l’asthme ou masquée par une comorbidité</h4><p>Des symptômes très variables, nocturnes ou allergiques font penser à un asthme associé, qui impose un corticostéroïde inhalé. À l’inverse, une insuffisance cardiaque peut attirer toute l’attention et laisser la BPCO méconnue.</p></div></div>
<div class="key"><b>À retenir.</b> Une BPCO peut toucher un non-fumeur, un adulte jeune ou un patient dont une autre maladie masque les symptômes. Une exacerbation inaugurale impose une spirométrie à distance.</div>
<h3>5.5 L’anamnèse de Monsieur B.</h3>
<p>L’anamnèse se transforme ici en hypothèses hiérarchisées.</p>
<p>Monsieur B. confirme 45 paquets-années et 42 ans de chantier, dont vingt ans sans masque. Il n’a pas eu d’asthme dans l’enfance et ne connaît pas de maladie pulmonaire dans sa famille. Il n’a ni orthopnée ni œdèmes, et il ne prend aucun inhibiteur de l’enzyme de conversion. Son poids est stable. Il ronfle, mais sa femme n’a jamais remarqué de pauses respiratoires. Il se dit découragé depuis qu’il ne peut plus jardiner.</p>
<p>Le médecin retient trois conclusions. De fait, la probabilité de BPCO est très élevée ; aucun signal d’alarme n’oriente vers un cancer ou une insuffisance cardiaque ; le découragement mérite un dépistage de la dépression (section 11). Toutefois, la spirométrie reste l’examen décisif.</p>
<div class="key"><b>À retenir.</b> Chez Monsieur B., l’anamnèse rend la BPCO très probable et ne révèle aucun signal d’alarme. L’examen clinique apporte des observations complémentaires, avec des limites diagnostiques (section 6).</div>
</section>

<section class="ilot" id="j44-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen du patient atteint de BPCO va de l’état général aux signes ciblés. Certes, selon GOLD 2026, l’examen physique n’est presque jamais diagnostique : les signes d’obstruction apparaissent tard, et leur sensibilité comme leur spécificité sont faibles. L’examen garde pourtant trois fonctions essentielles : mesurer la gravité, chercher un autre diagnostic et repérer les complications.</p>
<h3>6.1 État général, signes vitaux et mesures</h3>
<p>Les signes vitaux mesurent la gravité avant toute interprétation. Ils se relèvent au repos, puis parfois à l’effort.</p>
<p>La <button class="w" data-k="j44-p-freq">fréquence respiratoire et la capacité à parler (technique et gravité)</button> se mesurent sur une minute, sans que le patient le sache. Ainsi, la <button class="w" data-k="j44-p-spo">saturation pulsée en oxygène (technique, limites et suite)</button> se mesure au repos. En effet, une valeur ≤ 92 % impose une gazométrie artérielle, car l’oxymètre ne renseigne ni sur la PaCO₂ ni sur le pH. De plus, la fréquence cardiaque, la pression artérielle et la température complètent le relevé. Enfin, une désaturation à l’effort se recherche au <button class="w" data-k="j44-pa-marche6">test de marche de 6 minutes (technique et interprétation)</button>.</p>
<p>Le poids et la taille donnent l’indice de masse corporelle. Concrètement, selon GOLD 2026, un indice inférieur à 21 kg/m² est associé à une mortalité accrue, et un indice supérieur à 30 kg/m² au syndrome métabolique et aux apnées du sommeil. De même, l’indice BODE attribue 1 point à un indice ≤ 21 kg/m². En revanche, la cyanose est un signe tardif et peu fiable de l’hypoxémie ; son absence n’exclut rien.</p>
<div class="key"><b>À retenir.</b> La fréquence respiratoire, la parole, la saturation et l’indice de masse corporelle mesurent la gravité. Une saturation ≤ 92 % impose des gaz du sang.</div>
<h3>6.2 Ce que valent l’anamnèse et l’examen pour prédire une obstruction</h3>
<p>Le médecin a besoin de savoir quel poids accorder à chaque élément clinique avant la spirométrie. À cet égard, deux études en donnent une mesure chiffrée.</p>
<p>Le tableau suivant présente ces éléments.</p>
<table class="t"><tr><th>Élément clinique</th><th>Rapport de vraisemblance</th><th>Étude</th></tr>
<tr><td>Tabagisme de plus de 40 paquets-années</td><td>8,3</td><td>309 patients, 25 centres (JAMA, 2000)</td></tr>
<tr><td>Antécédent déclaré de maladie obstructive chronique</td><td>7,3</td><td>Même étude</td></tr>
<tr><td><button class="w" data-k="j44-pa-larynx">Hauteur laryngée maximale ≤ 4 cm (technique)</button></td><td>2,8</td><td>Même étude</td></tr>
<tr><td>Âge d’au moins 45 ans</td><td>1,3</td><td>Même étude</td></tr>
<tr><td>Sibilants</td><td>2,7, non retenu en analyse multivariée</td><td>Même étude</td></tr>
<tr><td>Les quatre premiers éléments réunis</td><td>220</td><td>Même étude</td></tr>
<tr><td>Aucun des quatre premiers éléments</td><td>0,13</td><td>Même étude</td></tr>
<tr><td><button class="w" data-k="j44-hoover">Signe de Hoover (technique et valeur)</button></td><td>4,16 (sensibilité 58 %, spécificité 86 %)</td><td>172 patients de consultation pneumologique (Chest, 2002)</td></tr></table>
<p>La lecture du tableau montre que l’anamnèse pèse plus lourd que l’auscultation. Ainsi, un rapport supérieur à 1 augmente la probabilité ; inférieur à 1, il la diminue. En revanche, les sibilants n’ajoutent pas d’information indépendante une fois le tabac, l’âge et l’anamnèse connus. À l’inverse, l’absence des quatre éléments rend l’obstruction peu probable, sans l’exclure. De fait, Monsieur B. réunit trois éléments : plus de 40 paquets-années, plus de 45 ans et, comme on le verra, une hauteur laryngée de 3 cm. Dès lors, sa probabilité d’obstruction est très élevée avant la spirométrie.</p>
<div class="key"><b>À retenir.</b> Le tabac chiffré, l’âge et une hauteur laryngée basse prédisent mieux l’obstruction que les sibilants. Le signe de Hoover est spécifique mais peu sensible.</div>
<h3>6.3 Signes de distension et d’obstruction</h3>
<p>La distension déforme le thorax et modifie l’action du diaphragme. En effet, l’obstruction ralentit l’expiration. Dès lors, les signes suivants se recherchent dans l’ordre de l’examen : inspection, percussion, auscultation.</p>
<div class="two">
<div class="card"><h4>Inspection</h4><p>Le thorax est distendu, en tonneau, et la <button class="w" data-k="j44-pa-larynx">hauteur laryngée (distance entre le sommet du cartilage thyroïde et la fourchette sternale)</button> se réduit. Ainsi, le <button class="w" data-k="j44-hoover">signe de Hoover (rétraction inspiratoire des côtes inférieures)</button> traduit un diaphragme aplati. De plus, le patient utilise ses <button class="w" data-k="j44-p-tirage">muscles accessoires et présente parfois un tirage (signes d’épuisement)</button>. Il se penche en avant, bras en appui, et pratique souvent une <button class="w" data-k="j44-levres">respiration à lèvres pincées (mécanisme et enseignement)</button>.</p></div>
<div class="card"><h4>Percussion et auscultation</h4><p>La percussion est hypersonore et la matité cardiaque diminue, parce que le poumon distendu s’interpose devant le cœur. À l’auscultation, l’<button class="w" data-k="j44-p-expir">expiration prolongée et le murmure vésiculaire diminué (technique et pièges)</button> traduisent l’obstruction et la distension. De plus, des sibilants et des ronchi peuvent s’entendre. Enfin, les bruits du cœur sont assourdis, pour la même raison que la matité diminuée.</p></div></div>
<div class="key"><b>À retenir.</b> Le thorax distendu, la hauteur laryngée réduite, le signe de Hoover, l’hypersonorité et le murmure diminué traduisent une distension avancée. Leur absence n’exclut pas une BPCO débutante.</div>
<h3>6.4 Signes de retentissement et de gravité</h3>
<p>Le retentissement sur le cœur droit et sur les gaz du sang signale une maladie évoluée ou une décompensation. Ces signes changent la conduite immédiate.</p>
<div class="two">
<div class="card"><h4>Cœur droit</h4><p>La <button class="w" data-k="j44-p-coeur">turgescence jugulaire, le reflux hépato-jugulaire et les œdèmes (retentissement cardiaque droit)</button> évoquent un cœur pulmonaire chronique. Par ailleurs, un éclat du deuxième bruit au foyer pulmonaire traduit l’hypertension pulmonaire. Ces signes ne sont pas spécifiques : une insuffisance cardiaque gauche associée doit être recherchée.</p></div>
<div class="card"><h4>Hypercapnie et épuisement</h4><p>Des céphalées matinales, une somnolence, un <button class="w" data-k="j44-p-conscience">astérixis et une altération de la conscience (hypercapnie suspectée)</button> et des extrémités chaudes traduisent l’hypercapnie. De même, une respiration paradoxale, des sueurs ou une baisse de vigilance chez un patient très dyspnéique annoncent un épuisement respiratoire.</p></div></div>
<div class="alert"><b>Signes de gravité immédiate.</b> Une confusion, une somnolence, une respiration paradoxale, une incapacité à parler ou une instabilité hémodynamique chez un patient BPCO imposent une gazométrie artérielle immédiate et une évaluation hospitalière (section 8).</div>
<div class="key"><b>À retenir.</b> Les signes de cœur droit et d’hypercapnie marquent une maladie évoluée ou décompensée. La somnolence d’un patient dyspnéique est un signe d’épuisement, non d’amélioration.</div>
<h3>6.5 Signes qui orientent vers un autre diagnostic</h3>
<p>Certains signes n’appartiennent pas à la BPCO. En effet, leur présence impose de chercher une autre maladie, associée ou alternative.</p>
<p>L’<button class="w" data-k="j44-p-hippo">hippocratisme digital (technique et diagnostics à chercher)</button> n’est pas expliqué par la BPCO. Concrètement, chez un fumeur, il fait rechercher un cancer bronchique, des bronchectasies ou une fibrose pulmonaire. De même, des crépitants aux bases orientent vers une insuffisance cardiaque ou une fibrose. De plus, une asymétrie auscultatoire nouvelle fait rechercher un pneumothorax, un épanchement pleural ou une obstruction localisée par une tumeur. Enfin, un stridor ou un wheezing fixe localisé évoque une obstruction des grosses voies aériennes.</p>
<div class="trap"><span class="k">Piège</span>L’hippocratisme digital n’appartient <b>pas</b> à la BPCO. Le considérer comme un signe de la maladie retarde le diagnostic d’un cancer bronchique.</div>
<div class="key"><b>À retenir.</b> L’hippocratisme digital, des crépitants, une asymétrie ou un stridor ne s’expliquent pas par la BPCO et imposent une recherche ciblée.</div>
<h3>6.6 L’examen de Monsieur B.</h3>
<p>Chaque constatation reçoit sa signification, et l’examen montre aussi ses limites.</p>
<p>Monsieur B. pèse 70 kg pour 1,72 m, soit un indice de masse corporelle de 23,7 kg/m². Au repos, sa fréquence respiratoire est de 20 par minute et sa saturation de 93 % à l’air ambiant ; il parle sans pause. De plus, sa hauteur laryngée mesure 3 cm. En outre, le thorax est distendu, la percussion hypersonore et le murmure diminué, avec une expiration prolongée. En revanche, le signe de Hoover est absent. Il n’a ni hippocratisme, ni œdèmes, ni turgescence jugulaire.</p>
<p>Le médecin en conclut que la distension est déjà présente et qu’aucun signe n’oriente vers un autre diagnostic. Ainsi, la saturation de 93 % ne justifie pas de gazométrie. En revanche, l’absence du signe de Hoover ne rassure pas : sa sensibilité n’est que de 58 %. Seule la spirométrie confirmera l’obstruction.</p>
<div class="key"><b>À retenir.</b> L’examen de Monsieur B. montre une distension sans signe de gravité ni d’autre maladie. La confirmation et la caractérisation de la BPCO reposent sur une démarche diagnostique structurée (section 7).</div>
<button class="pareto-btn ui" data-k="pareto-j44-clin">▲ Loi de Pareto — Définition, mécanismes et clinique</button>
</section>

<section class="ilot" id="j44-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>La démarche diagnostique suit trois temps : suspecter, confirmer, caractériser. De fait, la confirmation repose sur la spirométrie après bronchodilatateur ; la caractérisation rassemble les mesures qui choisiront le traitement. Les diagnostics différentiels se hiérarchisent ensuite selon la gravité d’une erreur.</p>
<h3>7.1 La recherche active de cas</h3>
<p>La BPCO est largement sous-diagnostiquée (section 2). La question n’est donc pas de savoir s’il faut chercher, mais chez qui.</p>
<p>GOLD 2026 distingue le dépistage et la recherche de cas. En effet, le dépistage teste des personnes asymptomatiques de la population générale. Il est coûteux et son rendement est faible : GOLD ne le recommande pas chez les personnes sans exposition significative au tabac ou à un autre facteur de risque. En revanche, la recherche active de cas cible au contraire les personnes symptomatiques ou exposées. À cet égard, GOLD cite comme exemples une dyspnée inexpliquée, plus de 20 paquets-années, des infections respiratoires basses répétées ou des événements de la petite enfance. Enfin, un essai randomisé récent a montré qu’associer une recherche active par téléphone à une prise en charge structurée réduisait le recours aux soins et améliorait la qualité de vie.</p>
<p>Le débit expiratoire de pointe ne suffit pas. Ainsi, selon GOLD 2026, sa sensibilité est bonne, mais sa spécificité est trop faible pour qu’il serve seul au diagnostic. Par ailleurs, des questionnaires et des micro-spiromètres de poche aident à sélectionner les patients, mais la confirmation exige une vraie spirométrie.</p>
<div class="key"><b>À retenir.</b> Le médecin propose une spirométrie à toute personne exposée qui présente des symptômes respiratoires ou des infections basses répétées. Il ne dépiste pas les personnes asymptomatiques non exposées.</div>
<h3>7.2 La confirmation par la spirométrie après bronchodilatateur</h3>
<p>La spirométrie est le seul examen qui pose le diagnostic. Or, sa qualité et ses conditions de réalisation déterminent la validité du résultat.</p>
<p>La <button class="w" data-k="j45-spiro">spirométrie (principe, manœuvre et courbes)</button> se fait en état stable, à distance d’une exacerbation. Elle est mesurée avant puis après un <button class="w" data-k="j44-pa-bd">test de bronchodilatation (doses, délai et but)</button> : 400 µg de salbutamol, 160 µg d’ipratropium, ou les deux. Concrètement, le VEMS se mesure 10 à 15 minutes après le bêta-2 agoniste, ou 30 à 45 minutes après l’antimuscarinique ou l’association. En effet, le but n’est pas de distinguer l’asthme de la BPCO, mais de mesurer la part persistante de l’obstruction. Par ailleurs, la technique doit être contrôlée. À cet égard, selon GOLD 2026, le VEMS et la CVF retenus sont les plus grandes valeurs de trois courbes techniquement satisfaisantes ; ces courbes ne diffèrent pas entre elles de plus de 5 % ou de 150 mL.</p>
<p>Chez une personne dont les symptômes et les expositions évoquent la BPCO, un rapport VEMS/CVF <b>inférieur à 0,70</b> confirme l’obstruction selon GOLD. Ainsi, la déclaration commune de GOLD et de la Global Lung Function Initiative (GLI), publiée le <b>13 mars 2026</b>, conserve ce seuil fixe dans ce contexte clinique. De même, l’European Respiratory Society (ERS) et l’American Thoracic Society (ATS) préfèrent la <button class="w" data-k="j45-lln">limite inférieure de la normale (définition et z-score)</button> pour l’interprétation fonctionnelle. Cette limite reste utile pour rechercher une obstruction dans une population plus large, en particulier chez le sujet jeune.</p>
<p>Le choix du seuil a des conséquences prévisibles. Le rapport VEMS/CVF diminue physiologiquement avec l’âge ; le seuil fixe tend donc à surdiagnostiquer l’obstruction chez le sujet âgé et à la sous-diagnostiquer chez le sujet jeune. Lorsque le rapport initial se situe entre 0,60 et 0,80, GOLD recommande de répéter la mesure lors d’une autre visite, car la variabilité biologique peut faire changer le résultat de catégorie. À l’inverse, un VEMS, une CVF et un rapport normaux sur une spirométrie techniquement acceptable, même avant bronchodilatateur, permettent d’exclure la BPCO. Si la suspicion clinique reste très forte, la mesure après bronchodilatateur peut exceptionnellement démasquer une obstruction en augmentant la CVF (déclaration GOLD/GLI).</p>
<p>Voici les résultats de Monsieur B., en état stable, six semaines après sa dernière exacerbation. De fait, avant bronchodilatateur, son VEMS vaut 1,38 L et sa CVF 2,70 L. Ensuite, après 400 µg de salbutamol, le VEMS vaut 1,45 L et la CVF 2,79 L, soit un rapport de 0,52 et un VEMS à 45 % de la valeur prédite. L’obstruction persiste : il s’agit d’une BPCO de grade 3.</p>
<div class="key"><b>À retenir.</b> Le diagnostic exige un rapport VEMS/CVF inférieur à 0,70 après bronchodilatateur, dans un contexte clinique évocateur. Entre 0,60 et 0,80, le médecin répète la mesure ; une spirométrie normale exclut la BPCO.</div>
<h3>7.3 L’algorithme diagnostique</h3>
