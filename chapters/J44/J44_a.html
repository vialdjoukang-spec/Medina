<section class="ilot" id="j44-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 64 ans, maçon retraité, fumeur de 45 paquets-années, consulte pour un essoufflement qui l’oblige à s’arrêter après 100 mètres de marche à plat. Il tousse et crache chaque matin depuis des années. Cet hiver, il a reçu deux fois des antibiotiques et de la prednisone pour une « bronchite ». La question qui structure le chapitre est la suivante : <b>ce patient a-t-il une bronchopneumopathie chronique obstructive (BPCO), quel est son niveau de gêne et de risque d’exacerbation, et quelles mesures prolongeront sa vie et amélioreront son souffle ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait confirmer le diagnostic par la spirométrie, classer le patient selon la stratégie de la Global Initiative for Chronic Obstructive Lung Disease (GOLD) 2026, reconnaître et traiter une exacerbation, poser les indications de l’oxygénothérapie et de la ventilation, et construire un traitement de fond. L’arrêt du tabac et l’oxygène chez l’hypoxémique sévère disposent de preuves historiques de bénéfice sur la survie ; d’autres interventions ont montré un bénéfice dans des populations sélectionnées, à examiner selon leurs critères d’inclusion et leur critère de jugement.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="j45-spiro">spirométrie (VEMS, CVF et leur rapport)</button>, la <button class="w" data-k="j44-emph">notion d’emphysème (destruction des parois alvéolaires)</button> et la <button class="w" data-k="j44-disten">distension pulmonaire (piégeage de l’air)</button>. Ces notions sont reprises dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="j44-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>GOLD 2026 définit la BPCO comme une affection pulmonaire hétérogène caractérisée par des <b>symptômes respiratoires chroniques</b> (dyspnée, toux, expectoration, exacerbations) dus à des anomalies des voies aériennes (bronchite, bronchiolite) et/ou des alvéoles (emphysème), responsables d’une <b>obstruction bronchique persistante, souvent progressive</b>. Le diagnostic exige une preuve spirométrique : rapport VEMS/CVF <b>&lt; 0,70 après bronchodilatateur</b>.</p>
<p>Exemple : après 400 µg de salbutamol, un patient a un VEMS de 1,6 L et une CVF de 2,9 L. Le rapport vaut 0,55 : l’obstruction persiste après bronchodilatation, le critère spirométrique est rempli.</p>
<h3>1.1 Deux notions à ne pas confondre</h3>
<p>La <b>bronchite chronique</b> est une définition clinique : toux productive au moins trois mois par an pendant deux années consécutives. Elle peut exister sans obstruction. L’<button class="w" data-k="j44-emph">emphysème</button> est une définition anatomique : élargissement permanent des espaces aériens distaux avec destruction de leurs parois. Il se voit à la tomodensitométrie. La BPCO est une définition <b>fonctionnelle</b> : elle exige l’obstruction.</p>
<h3>1.2 Sévérité de l’obstruction : grades GOLD 1 à 4</h3>
<table class="t"><tr><th>Grade</th><th>VEMS après bronchodilatateur (% de la valeur prédite)</th></tr>
<tr><td>GOLD 1 — léger</td><td>≥ 80 %</td></tr><tr><td>GOLD 2 — modéré</td><td>50–79 %</td></tr><tr><td>GOLD 3 — sévère</td><td>30–49 %</td></tr><tr><td>GOLD 4 — très sévère</td><td>&lt; 30 %</td></tr></table>
<h3>1.3 Évaluation combinée : groupes A, B et E</h3>
<p>Le grade spirométrique ne décide pas du traitement. Le traitement dépend des <b>symptômes</b> et des <b>exacerbations</b>.</p>
<div class="two">
<div class="card"><h4>Groupe E — exacerbations</h4><p>GOLD 2026 a <b>abaissé le seuil</b> : au moins une exacerbation modérée ou sévère au cours de l’année précédente place le patient dans le groupe E (auparavant : au moins deux modérées ou une hospitalisation). Ce changement repose sur des études observationnelles montrant qu’une seule exacerbation modérée ou sévère, survenue avant tout traitement de fond, augmente le risque des suivantes. Pour ce classement, l’exacerbation modérée est celle qui a été traitée par corticostéroïde systémique et/ou antibiotique ; la sévère a conduit à l’hospitalisation.</p></div>
<div class="card"><h4>Groupes A et B — sans exacerbation</h4><p><b>A</b> : peu symptomatique, <button class="w" data-k="j44-mmrc">échelle de dyspnée mMRC</button> 0–1 et <button class="w" data-k="j44-cat">score CAT</button> &lt; 10. <b>B</b> : symptomatique, mMRC ≥ 2 ou CAT ≥ 10.</p></div></div>
<div class="trap"><span class="k">Piège</span>Beaucoup de QCM et d’articles antérieurs à novembre 2025 utilisent l’ancien seuil du groupe E. Pour l’examen, connaître les deux et savoir que GOLD 2026 retient désormais une seule exacerbation modérée ou sévère.</div>
<h3>1.4 Activité de la maladie et formes limites</h3>
<p>GOLD 2026 introduit la notion d’<b>activité de la maladie</b>. Ses indicateurs mesurables sont les exacerbations, l’aggravation chronique des symptômes et la progression de la maladie (déclin du VEMS supérieur à la perte attendue avec l’âge, progression radiologique de l’emphysème) ; parmi les biomarqueurs, les éosinophiles sanguins signalent l’inflammation de type 2. L’objectif devient un état de faible activité : aucune exacerbation, aucune aggravation des symptômes et aucune perte accélérée de la fonction pulmonaire. La <button class="w" data-k="j44-prism">PRISm (rapport conservé, spirométrie altérée)</button> désigne un rapport ≥ 0,70 avec un VEMS &lt; 80 % : ce n’est pas une BPCO, mais un état à risque à surveiller.</p>
<h3>1.5 Codage</h3>
<p>J43 : emphysème. J44.0 : BPCO avec infection aiguë des voies respiratoires inférieures. J44.1 : BPCO avec exacerbation aiguë, sans précision. J44.8 et J44.9 : autres formes précisées et forme sans précision. La version allemande précise le VEMS par un cinquième caractère : 0 pour un VEMS inférieur à 35 % de la valeur prédite, 1 de 35 à moins de 50 %, 2 de 50 à moins de 70 %, 3 à partir de 70 %, 9 si non précisé.</p>
</section>

<section class="ilot" id="j44-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La Ligue pulmonaire suisse estime qu’environ <b>400 000 personnes</b> vivent avec une BPCO en Suisse (estimation reprise par l’Office fédéral de la santé publique). Une autre mesure, l’Enquête suisse sur la santé 2022, rapporte <b>2,0 % des personnes de 15 ans ou plus</b> déclarant un diagnostic médical de bronchite chronique, de BPCO symptomatique ou d’emphysème : les définitions et les méthodes diffèrent ; ces deux chiffres ne sont pas interchangeables. La BPCO reste largement méconnue : dans une analyse internationale d’enquêtes en population (Lamprecht et al., Chest 2015), chez 30 874 adultes de 40 ans et plus de 44 sites dans 27 pays, 81 % des BPCO définies par la spirométrie (rapport VEMS/CVF après bronchodilatateur inférieur à la limite inférieure de la normale) n’avaient jamais été diagnostiquées (50 à 98 % selon les sites). Dans le monde, elle figure parmi les principales causes de décès selon l’Organisation mondiale de la santé. En Suisse, 23,9 % des personnes de 15 ans ou plus fumaient en 2022, dont 16,1 % quotidiennement (Enquête suisse sur la santé de l’Office fédéral de la statistique, indicateur de l’Office fédéral de la santé publique et de l’Observatoire suisse de la santé).</p>
<p>Le pronostic dépend de l’obstruction, de la dyspnée, de la capacité d’effort, de la nutrition, des exacerbations et des comorbidités. L’<button class="w" data-k="j44-bode">indice BODE (quatre composantes)</button> intègre ces éléments et prédit la mortalité mieux que le VEMS seul. Une hospitalisation pour exacerbation marque un risque accru de réadmission et de décès ; l’estimation individuelle dépend de l’âge, de la gravité et des comorbidités.</p>
<div class="key"><b>Ne pas confondre les critères de jugement.</b> L’arrêt du tabac et l’oxygénothérapie de longue durée chez l’hypoxémique sévère ont montré un bénéfice de survie dans leurs populations respectives. La trithérapie inhalée et la réhabilitation ont également des données pronostiques dans des groupes sélectionnés ; pour la réhabilitation, GOLD 2026 juge ces résultats encore peu concluants, en raison de l’hétérogénéité des programmes et des populations. L’essai HOT-HMV a démontré une amélioration du délai jusqu’à <b>réadmission ou décès</b> ; il n’a pas établi un bénéfice significatif sur la mortalité prise isolément.</div>
</section>

<section class="ilot" id="j44-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 Agression et inflammation</h3>
<p>La fumée de tabac et les particules inhalées activent les macrophages et les cellules épithéliales. Ils recrutent des <b>neutrophiles</b> et des lymphocytes T CD8 par des chimiokines comme la <button class="w" data-k="j44-inflam">CXCL8 (inflammation neutrophilique de la BPCO)</button>. Contrairement à l’asthme, l’inflammation est surtout neutrophilique et répond peu aux corticostéroïdes, sauf chez les patients à éosinophiles élevés.</p>
<h3>3.2 Déséquilibre protéases-antiprotéases</h3>
<p>Neutrophiles et macrophages libèrent l’élastase et des métalloprotéases qui détruisent l’élastine des parois alvéolaires. L’<button class="w" data-k="j44-aat">alpha-1 antitrypsine (principal inhibiteur de l’élastase)</button> protège normalement le poumon. Son déficit génétique, ou son inactivation par l’oxydation liée au tabac, laisse la destruction progresser : c’est l’<button class="w" data-k="j44-emph">emphysème</button>.</p>
<h3>3.3 Deux lésions, une obstruction</h3>
<p><b>Petites voies aériennes</b> : inflammation, fibrose péribronchiolaire, bouchons muqueux et disparition de bronchioles réduisent leur calibre. <b>Parenchyme</b> : la destruction des parois alvéolaires supprime la traction élastique qui maintenait les bronchioles ouvertes ; à l’expiration, elles se collabent. Dans les deux cas, l’air sort lentement et incomplètement.</p>
<h3>3.4 Distension, dyspnée et gaz du sang</h3>
<p>L’air piégé augmente le volume résiduel : c’est la <button class="w" data-k="j44-disten">distension statique et dynamique</button>. Les coupoles s’aplatissent, les muscles inspiratoires travaillent sur une longueur défavorable, et l’effort aggrave la distension car le temps expiratoire raccourcit : c’est la cause principale de la dyspnée d’effort. Les inégalités ventilation-perfusion provoquent une hypoxémie ; au stade avancé, la ventilation alvéolaire devient insuffisante et la PaCO₂ monte (<b>hypercapnie</b>). L’hypoxie alvéolaire chronique contracte les artérioles pulmonaires : <b>hypertension pulmonaire</b> puis insuffisance ventriculaire droite (cœur pulmonaire chronique).</p>

<div class="key"><b>Corrélation physiopathologie → traitement.</b> Les bronchodilatateurs de longue durée réduisent la distension (le patient respire à un volume plus bas), ce qui explique le gain de dyspnée supérieur au gain de VEMS. Les corticostéroïdes inhalés n’agissent que chez les patients à inflammation éosinophilique. L’oxygène corrige l’hypoxémie et freine l’hypertension pulmonaire.</div>
</section>

<section class="ilot" id="j44-4"><h2><span class="n">4</span>Facteurs de risque</h2>
<div class="two">
<div class="card"><h4>Expositions</h4><p><b>Tabac</b> : cause principale en Suisse ; le risque croît avec les paquets-années (nombre de paquets par jour × années). Cannabis et vapotage : données encore limitées. <b>Professions</b> : poussières minérales (silice des maçons et mineurs), vapeurs, fumées, agriculture ; la déclaration officielle de l’American Thoracic Society et de l’European Respiratory Society (2019) estime, à partir de 26 études, à 14 % (intervalle de confiance à 95 % : 10–18 %) la fraction des BPCO attribuable aux expositions professionnelles, et à 31 % (18–43 %) chez les non-fumeurs, avec des variations selon la population et les méthodes d’estimation. <b>Combustion de biomasse</b> à l’intérieur, surtout chez les femmes des pays à revenu faible. Pollution atmosphérique.</p></div>
<div class="card"><h4>Hôte et développement</h4><p><b>Déficit en alpha-1 antitrypsine</b> : emphysème précoce (avant 45 ans), à prédominance basale. Croissance pulmonaire insuffisante : prématurité, infections respiratoires sévères de l’enfance, tabagisme maternel ; ces patients n’atteignent jamais un VEMS maximal normal. Asthme ancien. Âge.</p></div></div>
<div class="trap"><span class="k">Piège</span>Une BPCO chez un non-fumeur, chez un sujet de moins de 45 ans, ou avec un emphysème des bases impose le dosage de l’alpha-1 antitrypsine. GOLD 2026 recommande de rechercher ce déficit <b>chez tout patient atteint de BPCO</b> ; les diagnostics tardifs concernent aussi des patients plus âgés, porteurs d’un emphysème centrolobulaire des sommets.</div>
</section>

<section class="ilot" id="j44-5"><h2><span class="n">5</span>Anamnèse</h2>
<h3>5.1 Antécédents pertinents : questions à poser</h3>
<div class="two"><div class="card"><h4>Terrain et maladie respiratoire</h4><p><button class="w" data-k="j44-a-tabac">Tabac, cannabis et produits inhalés (quantifier l’exposition)</button><br><button class="w" data-k="j44-a-enfance">Asthme, prématurité et infections de l’enfance (reconstituer la trajectoire respiratoire)</button><br><button class="w" data-k="j44-a-famille">Emphysème familial et maladie du foie (chercher un déficit en alpha-1 antitrypsine)</button><br><button class="w" data-k="j44-a-exa">Exacerbations, hospitalisations et ventilation (dater et qualifier)</button></p></div><div class="card"><h4>Expositions et comorbidités</h4><p><button class="w" data-k="j44-a-metier">Poussières, fumées et profession (chronologie et protection)</button><br><button class="w" data-k="j44-a-cardio">Maladie cardiaque et œdèmes (différencier les dyspnées)</button><br><button class="w" data-k="j44-a-sommeil">Somnolence et apnées du sommeil (chercher une autre cause d’hypercapnie)</button><br><button class="w" data-k="j44-a-psy">Anxiété, dépression et traitements sédatifs (impact et sécurité)</button><br><button class="w" data-k="j44-a-metab">Diabète, syndrome métabolique et ostéoporose (relever dès l’anamnèse ; pèsent sur le pronostic)</button></p></div></div>
<h3>5.2 Signes fonctionnels, par fréquence clinique habituelle</h3>
<div class="two"><div class="card"><h4>Dyspnée et toux</h4><p><button class="w" data-k="j44-s-dysp">Dyspnée (installation, terrain, distance et retentissement)</button> : habituellement progressive, persistante et d’effort, aggravée au fil des années ; le patient de l’îlot 0, qui s’arrête après environ 100 mètres, est au degré 3 de l’échelle <button class="w" data-k="j44-mmrc">mMRC</button>.<br><button class="w" data-k="j44-s-toux">Toux chronique (horaire, durée et signaux d’alarme)</button> : souvent le premier symptôme, matinale, volontiers banalisée comme « toux du fumeur ».</p></div><div class="card"><h4>Expectoration et signes associés</h4><p><button class="w" data-k="j44-s-crachats">Expectoration (volume, aspect et changement récent)</button> : habituellement muqueuse ; une augmentation et une purulence nouvelles font discuter une exacerbation ; une expectoration purulente abondante au long cours oriente vers des bronchectasies.<br><button class="w" data-k="j44-s-siffle">Sifflements et oppression (variabilité et diagnostics associés)</button> : moins spécifiques, variables d’un jour à l’autre.<br><button class="w" data-k="j44-s-poids">Fatigue et perte pondérale (caractériser et exclure une autre cause)</button> : au stade avancé, dénutrition avec perte de poids et de masse musculaire, anxiété et dépression ; un amaigrissement fait toujours rechercher un cancer bronchique ou une autre maladie.</p></div></div>
<p>L’impact global se mesure par le <button class="w" data-k="j44-cat">questionnaire CAT</button>, huit items de 0 à 5.</p>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Fumeur de plus de 40 ans, dyspnée d’effort progressive, toux et expectoration matinales, exacerbations hivernales.</p></div>
<div class="card"><h4>Forme emphysémateuse</h4><p>Patient maigre, dyspnée importante, peu de toux, thorax distendu, respiration lèvres pincées, diffusion du monoxyde de carbone très abaissée.</p></div>
<div class="card"><h4>Forme bronchitique</h4><p>Toux et expectoration abondantes, exacerbations fréquentes, hypoxémie et œdèmes plus précoces, souvent en surpoids.</p></div>
<div class="card"><h4>Forme révélée par une exacerbation</h4><p>Première consultation pour une « bronchite » grave chez un fumeur jamais testé ; la spirométrie se fait à distance, en état stable.</p></div></div>
</section>

<section class="ilot" id="j44-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen est souvent normal au début. Au stade évolué, il montre la distension et le retentissement.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Fréquence respiratoire, saturation pulsée en oxygène au repos et à l’effort, indice de masse corporelle (≤ 21 kg/m² : facteur pronostique défavorable, 1 point de l’indice BODE), cyanose, capacité à parler.</p></div>
<div class="card"><h4>Signes de distension</h4><p>Thorax en tonneau, diminution de la distance entre le cartilage cricoïde et le sternum, <button class="w" data-k="j44-hoover">signe de Hoover (rétraction inspiratoire des côtes inférieures)</button>, hypersonorité, murmure vésiculaire diminué, bruits du cœur assourdis.</p></div>
<div class="card"><h4>Signes d’obstruction et de travail respiratoire</h4><p>Expiration prolongée, surtout lors d’une expiration forcée, sibilants, <button class="w" data-k="j44-levres">respiration à lèvres pincées</button>, utilisation des muscles accessoires, position du « tripode » (penché en avant, bras en appui).</p></div>
<div class="card"><h4>Signes de cœur pulmonaire et d’hypercapnie</h4><p>Turgescence jugulaire, reflux hépato-jugulaire, œdèmes des membres inférieurs, éclat de B2 au foyer pulmonaire. Hypercapnie : céphalées matinales, somnolence, astérixis, vasodilatation cutanée.</p></div></div>
<div class="trap"><span class="k">Piège</span>L’hippocratisme digital n’appartient <b>pas</b> à la BPCO. Chez un fumeur, il doit faire chercher un cancer bronchique, des bronchectasies ou une fibrose pulmonaire.</div>
<h3>6.1 Signes physiques : examen en deux colonnes</h3>
<div class="two"><div class="card"><h4>Ventilation et inspection</h4><p><button class="w" data-k="j44-p-freq">Fréquence respiratoire et capacité à parler (mesurer la gravité)</button><br><button class="w" data-k="j44-p-expir">Expiration prolongée et murmure diminué (observer, ausculter)</button><br><button class="w" data-k="j44-p-tirage">Muscles accessoires et tirage (rechercher l’épuisement)</button><br><button class="w" data-k="j44-hoover">Signe de Hoover (reconnaître la distension)</button></p></div><div class="card"><h4>Retentissement et diagnostic différentiel</h4><p><button class="w" data-k="j44-p-spo">Saturation et oxygénation (mesurer sans confondre les gaz)</button><br><button class="w" data-k="j44-p-coeur">Jugulaires et œdèmes (chercher le cœur droit)</button><br><button class="w" data-k="j44-p-conscience">Conscience et astérixis (suspecter l’hypercapnie)</button><br><button class="w" data-k="j44-p-hippo">Hippocratisme digital (ouvrir le diagnostic différentiel)</button></p></div></div>
<button class="pareto-btn ui" data-k="pareto-j44-clin">▲ Loi de Pareto — Définition, mécanismes et clinique</button>
</section>

<section class="ilot" id="j44-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>Trois étapes : suspecter (symptômes et exposition), confirmer (spirométrie après bronchodilatateur), caractériser (grade, groupe, éosinophiles, comorbidités, alpha-1 antitrypsine).</p>
<h3>7.1 Qui tester ?</h3>
<p>GOLD recommande la recherche active de cas : spirométrie chez tout sujet exposé (tabac, profession) présentant une dyspnée, une toux chronique, une expectoration ou des infections respiratoires basses répétées. GOLD ne recommande pas le dépistage spirométrique des personnes asymptomatiques sans exposition significative au tabac ou à un autre facteur de risque.</p>
<h3>7.2 Confirmer</h3>
<p>La spirométrie se fait en état stable, <b>après</b> bronchodilatateur (400 µg de salbutamol, ou 160 µg d’ipratropium, ou les deux), avec contrôle de qualité. Chez une personne dont les symptômes et les expositions évoquent la BPCO, un rapport VEMS/CVF <b>&lt; 0,70</b> confirme l’obstruction selon GOLD. La déclaration commune <b>GOLD/GLI publiée le 13 mars 2026</b> conserve ce seuil fixe dans ce contexte clinique ; la <button class="w" data-k="j45-lln">limite inférieure de la normale</button>, que l’ERS et l’ATS préfèrent pour l’interprétation fonctionnelle, reste utile pour rechercher une obstruction dans une population plus large, en particulier chez le sujet jeune. Le seuil fixe, qui ignore la baisse physiologique du rapport VEMS/CVF avec l’âge, tend à surdiagnostiquer l’obstruction chez le sujet âgé et à la sous-diagnostiquer chez le sujet jeune. Près du seuil (rapport initial entre 0,60 et 0,80), répéter la mesure lors d’une autre visite, car la variabilité biologique peut faire changer le rapport de catégorie, et confronter le résultat à l’histoire clinique. À l’inverse, un VEMS, une CVF et un rapport normaux sur une spirométrie techniquement acceptable, même avant bronchodilatateur, permettent d’exclure la BPCO ; si la suspicion clinique reste très forte, la spirométrie après bronchodilatateur peut exceptionnellement démasquer une obstruction par l’augmentation de la CVF (déclaration GOLD/GLI).</p>
<h3>7.3 Caractériser</h3>
<p>Grade GOLD (VEMS), groupe A/B/E (mMRC ou CAT, exacerbations), <button class="w" data-k="j44-eos">éosinophiles sanguins (guide des corticostéroïdes inhalés)</button>, oxymétrie, et gazométrie artérielle si la saturation pulsée est ≤ 92 % (GOLD 2026), alpha-1 antitrypsine, imagerie (radiographie, tomodensitométrie selon le contexte), recherche des comorbidités.</p>
<h3>7.4 Diagnostics différentiels, par gravité</h3>
<table class="t"><tr><th>Diagnostic</th><th>Argument distinctif</th></tr>
<tr><td><b>Insuffisance cardiaque</b></td><td>Crépitants bilatéraux, orthopnée, peptides natriurétiques élevés, échocardiographie ; obstruction absente ou réversible sous diurétique</td></tr>
<tr><td><b>Cancer bronchique</b></td><td>Altération de l’état général, hémoptysie, hippocratisme, opacité ; toujours y penser chez le fumeur</td></tr>
<tr><td><b>Tuberculose</b></td><td>Fièvre, sueurs, amaigrissement, infiltrats apicaux, provenance d’une zone d’endémie</td></tr>
<tr><td><b>Asthme</b></td><td>Début jeune, atopie, variabilité, réversibilité importante, normalisation du rapport ; <button class="w" data-k="j44-asthme">distinction asthme et BPCO</button></td></tr>
<tr><td><b>Bronchectasies</b></td><td>Expectoration purulente abondante, infections répétées, dilatations bronchiques à la tomodensitométrie</td></tr>
<tr><td><b>Bronchiolite oblitérante</b></td><td>Enfant ou adulte jeune non-fumeur ; après greffe pulmonaire ou de moelle osseuse ; zones hypodenses en expiration à la tomodensitométrie (GOLD 2026) ; antécédent de polyarthrite rhumatoïde ou d’inhalation aiguë de fumées toxiques (GOLD 2022)</td></tr></table>
