<p>L’algorithme suivant enchaîne les étapes, de la suspicion à la caractérisation.</p><div class="key"><b>Algorithme diagnostique de la BPCO (GOLD 2026 ; déclaration GOLD/GLI du 13 mars 2026)</b><ol><li>Le médecin suspecte une BPCO devant des symptômes respiratoires chroniques, des infections basses répétées ou une exposition au tabac ou à un toxique professionnel, car ces situations reflètent l’agression chronique des petites voies aériennes.</li><li>Spirométrie de qualité, en état stable, avant puis après bronchodilatateur.</li><li>La spirométrie donne trois résultats. Une spirométrie normale exclut la BPCO. Un rapport VEMS/CVF &lt; 0,70 après bronchodilatateur confirme la BPCO si le contexte est évocateur ; le médecin répète toutefois la mesure si le rapport se situe entre 0,60 et 0,80, car la variabilité de la mesure peut faire franchir le seuil. Enfin, un rapport ≥ 0,70 avec un VEMS &lt; 80 % définit la PRISm : ce n’est pas une BPCO, mais elle justifie une surveillance et la recherche d’une restriction.</li><li>Le médecin caractérise ensuite la maladie, car chaque mesure guide une décision. Le VEMS fixe le grade GOLD 1 à 4, et l’échelle mMRC ou le CAT, avec le nombre d’exacerbations, attribue le groupe A, B ou E. Les éosinophiles sanguins orientent le corticostéroïde inhalé. La saturation dépiste l’hypoxémie, et des gaz du sang sont prélevés si elle est ≤ 92 %. Le dosage de l’alpha-1-antitrypsine recherche un déficit héréditaire, tandis que la radiographie, l’électrocardiogramme et le bilan des comorbidités écartent ce qui imite ou aggrave la maladie ; la tomodensitométrie se réserve à une indication précise.</li><li>Le résultat se confronte toujours au contexte clinique ; chez le sujet jeune, la limite inférieure de la normale aide à reconnaître une obstruction.</li></ol></div>

<p>La lecture de l’algorithme commence au deuxième cadre : aucune branche ne s’ouvre sans spirométrie de qualité. Ainsi, la branche de gauche exclut la BPCO et oriente vers une autre cause des symptômes ; une pré-BPCO reste possible si l’imagerie ou la diffusion montrent des anomalies. En revanche, la branche de droite décrit la PRISm, qui n’est pas une BPCO mais un état à risque. De plus, une capacité pulmonaire totale au-dessous de la limite inférieure de la normale y ferait reconnaître une restriction. À cet égard, l’erreur fréquente consiste à traiter comme une BPCO un patient de la branche de droite.</p>
<div class="key"><b>À retenir.</b> La spirométrie après bronchodilatateur sépare trois situations : la BPCO, la spirométrie normale et la PRISm. Seule la première ouvre la caractérisation du patient.</div>
<h3>7.4 La caractérisation du patient</h3>
<p>Une fois l’obstruction confirmée, plusieurs mesures complètent le tableau. En effet, chacune répond à une question thérapeutique précise.</p>
<p>Le tableau suivant les présente dans l’ordre de la consultation.</p>
<table class="t"><tr><th>Mesure</th><th>Question posée</th><th>Seuil ou résultat décisif</th></tr>
<tr><td>VEMS après bronchodilatateur</td><td>Quelle est la sévérité de l’obstruction ?</td><td>Grades GOLD 1 à 4 (≥ 80, 50–79, 30–49, &lt; 30 %)</td></tr>
<tr><td>mMRC ou CAT, exacerbations de l’année</td><td>Quel traitement initial ?</td><td>Groupe E dès une exacerbation modérée ou sévère ; sinon B si mMRC ≥ 2 ou CAT ≥ 10</td></tr>
<tr><td><button class="w" data-k="j44-eos">Éosinophiles sanguins (interprétation et seuils)</button></td><td>Un corticostéroïde inhalé sera-t-il utile ?</td><td>&lt; 100/µL : bénéfice faible ; ≥ 300/µL : bénéfice net</td></tr>
<tr><td>Saturation pulsée, puis gaz du sang</td><td>Y a-t-il une insuffisance respiratoire ?</td><td>Gazométrie si saturation ≤ 92 %</td></tr>
<tr><td>Alpha-1 antitrypsine</td><td>Y a-t-il un déficit génétique ?</td><td>Dosage une fois chez tout patient ; &lt; 20 % de la normale : déficit homozygote très probable</td></tr>
<tr><td>Radiographie thoracique</td><td>Une autre maladie explique-t-elle les symptômes ?</td><td>Elle ne pose pas le diagnostic ; elle écarte une autre cause</td></tr>
<tr><td>Tomodensitométrie thoracique</td><td>Emphysème, bronchectasies, cancer, candidat à une réduction de volume ?</td><td>Exacerbations persistantes, symptômes disproportionnés, VEMS de 15 à 45 % avec distension, critères de dépistage du cancer</td></tr>
<tr><td>Électrocardiogramme ; peptides natriurétiques et échocardiographie si doute</td><td>Une maladie cardiaque coexiste-t-elle ?</td><td>Électrocardiogramme au diagnostic ; peptides élevés : échocardiographie</td></tr>
<tr><td>Diffusion du monoxyde de carbone et volumes pulmonaires</td><td>Pourquoi la dyspnée dépasse-t-elle l’obstruction ?</td><td>Diffusion inférieure à 60 % de la valeur prédite : symptômes et mortalité accrus</td></tr></table>
<p>La lecture du tableau suit la dernière colonne. Concrètement, les trois premières lignes choisissent le traitement ; les suivantes cherchent une complication, une cause génétique ou une autre maladie. En revanche, la tomodensitométrie n’est pas systématique : GOLD 2026 la propose dans quatre situations précises. De plus, la diffusion du monoxyde de carbone se mesure lorsque la dyspnée paraît disproportionnée à l’obstruction, car une valeur basse signale un emphysème ou une atteinte vasculaire. Enfin, l’onglet des examens complémentaires détaille l’interprétation de chaque mesure.</p>
<p>Chez Monsieur B., les éosinophiles valent 340/µL, la saturation 93 % et l’alpha-1 antitrypsine 1,32 g/L, une valeur normale. Ainsi, la radiographie montre une distension sans opacité suspecte, et l’électrocardiogramme est normal. Il est donc en grade 3, groupe E, avec des éosinophiles élevés.</p>
<div class="key"><b>À retenir.</b> Le grade, le groupe et les éosinophiles choisissent le traitement. La saturation, l’alpha-1 antitrypsine, l’imagerie et l’électrocardiogramme cherchent une complication, une cause ou une autre maladie.</div>
<h3>7.5 Diagnostics différentiels, par ordre de gravité</h3>
<p>Plusieurs maladies produisent une dyspnée chronique, une toux ou une obstruction. Ensuite, le médecin les classe selon la gravité d’une erreur, puis cherche l’argument qui les distingue.</p>
<p>Le tableau suivant range les diagnostics du plus grave au moins urgent. En effet, les éléments d’orientation reprennent la figure 2.3 de GOLD 2026 ; la ligne du cancer bronchique s’appuie sur les signaux d’alarme que GOLD 2026 décrit dans la présentation clinique.</p>
<table class="t"><tr><th>Diagnostic (gravité décroissante)</th><th>Argument d’orientation</th><th>Examen qui tranche</th></tr>
<tr><td><b>Cancer bronchique</b></td><td>Amaigrissement, hémoptysie, hippocratisme, toux qui change de caractère</td><td>Radiographie, puis tomodensitométrie</td></tr>
<tr><td><b><button class="w" data-k="j44-pa-icdiff">Insuffisance cardiaque (distinguer du cœur et du poumon)</button></b></td><td>Orthopnée, crépitants, cardiomégalie et œdème pulmonaire à la radiographie ; la fonction respiratoire montre plutôt une restriction qu’une obstruction</td><td>Peptides natriurétiques, puis échocardiographie</td></tr>
<tr><td><b>Tuberculose</b></td><td>Tout âge ; fièvre, sueurs, amaigrissement ; infiltrat à la radiographie ; séjour dans une région de forte prévalence</td><td>Confirmation microbiologique</td></tr>
<tr><td><b>Bronchectasies</b></td><td>Expectoration purulente abondante, infections bactériennes répétées</td><td>Tomodensitométrie : dilatation des bronches</td></tr>
<tr><td><b>Asthme</b></td><td>Obstruction variable, symptômes nocturnes ou matinaux, allergie, rhinite ou eczéma, début dans l’enfance, histoire familiale</td><td>Variabilité et normalisation de la fonction ; <button class="w" data-k="j44-asthme">distinction entre asthme et BPCO</button></td></tr>
<tr><td><b>Bronchiolite oblitérante</b></td><td>Enfant ; après greffe pulmonaire ou de moelle osseuse ; antécédent de polyarthrite rhumatoïde ou d’inhalation aiguë de fumées toxiques (GOLD 2022)</td><td>Tomodensitométrie en expiration : zones hypodenses</td></tr>
<tr><td><b>Panbronchiolite diffuse</b></td><td>Surtout chez des patients d’origine asiatique, masculins et non fumeurs ; sinusite chronique presque constante</td><td>Tomodensitométrie : micronodules centrolobulaires diffus et distension</td></tr></table>
<p>La lecture du tableau commence par la première ligne, parce qu’un cancer méconnu a les conséquences les plus graves. De fait, un fumeur atteint de BPCO reste exposé au cancer bronchique : la découverte d’une BPCO ne clôt jamais la recherche d’un cancer. L’insuffisance cardiaque vient ensuite ; elle coexiste souvent avec la BPCO, et les deux diagnostics ne s’excluent pas. Enfin, l’asthme pose le problème le plus fréquent en pratique : il peut coexister avec la BPCO, et sa présence impose un corticostéroïde inhalé. Enfin, une toux chronique peut provenir d’une cause extrathoracique : rhinite allergique, écoulement nasal postérieur, reflux gastro-œsophagien ou inhibiteur de l’enzyme de conversion.</p>
<div class="key"><b>À retenir.</b> Le cancer bronchique, l’insuffisance cardiaque et la tuberculose sont les trois diagnostics à ne pas manquer. L’asthme et la BPCO peuvent coexister ; l’asthme impose alors un corticostéroïde inhalé.</div>
<h3>7.6 Entraînement</h3>
<p>Deux situations fréquentes mettent ces seuils à l’épreuve.</p>
<div class="quiz ui"><p>Un fumeur de 58 ans, symptomatique, a un rapport VEMS/CVF après bronchodilatateur de 0,69. Que fait le médecin ?</p><button data-ok="1">Il répète la spirométrie lors d’une autre visite avant de conclure.</button><button data-ok="0">Il écarte la BPCO, car le rapport est trop proche du seuil.</button><button data-ok="0">Il commence une trithérapie inhalée sans autre mesure.</button><p class="fb" hidden>Le rapport se situe entre 0,60 et 0,80 : GOLD recommande de répéter la mesure lors d’une autre visite, car la variabilité biologique peut faire changer le résultat de catégorie. Écarter la BPCO serait prématuré, et une trithérapie ne s’envisage qu’après caractérisation complète.</p></div>
<div class="quiz ui"><p>Une patiente de 67 ans atteinte de BPCO connue, stable, a une saturation pulsée de 91 % à l’air ambiant. Quelle est la conduite ?</p><button data-ok="1">Le médecin mesure les gaz du sang artériel.</button><button data-ok="0">Le médecin prescrit d’emblée de l’oxygène à domicile.</button><button data-ok="0">Le médecin ne fait rien, car la saturation dépasse 88 %.</button><p class="fb" hidden>Une saturation ≤ 92 % impose une gazométrie, parce que l’oxymètre corrèle imparfaitement avec la PaO₂ et ne renseigne ni sur la PaCO₂ ni sur le pH. L’indication d’oxygène de longue durée repose sur la PaO₂ mesurée en état stable, confirmée à deux reprises sur trois semaines (section 10).</p></div>
<div class="key"><b>À retenir.</b> Monsieur B. a une BPCO confirmée, de grade 3, groupe E, avec 340 éosinophiles/µL et sans autre maladie décelée. L’exacerbation, urgence la plus fréquente de la maladie (section 8), se distingue du traitement de fond (section 9).</div>

</section>
