<template data-pop="j44-emph" data-title="Emphysème">
<div class="lab">Définition</div><p>L’emphysème est un élargissement permanent des espaces aériens situés au-delà de la bronchiole terminale, avec destruction de leurs parois, sans fibrose évidente. C’est une définition anatomique : elle se constate au scanner ou au microscope, et non à la spirométrie.</p>
<div class="lab">Mécanisme</div><p>L’élastase des neutrophiles et les métalloprotéases des macrophages détruisent l’élastine des parois alvéolaires. L’alpha-1 antitrypsine les inhibe normalement ; le tabac l’inactive par oxydation, et le déficit génétique la supprime.</p>
<div class="lab">Types</div><p>L’emphysème centrolobulaire détruit le centre de l’acinus et prédomine aux sommets chez le fumeur. L’emphysème panlobulaire détruit l’acinus entier et prédomine aux bases dans le déficit en alpha-1 antitrypsine. L’emphysème paraseptal forme des bulles sous la plèvre, qui exposent au pneumothorax.</p>
<div class="lab">Conséquences</div><p>La perte de surface d’échange abaisse la diffusion du monoxyde de carbone. La perte de rétraction élastique ralentit l’expiration et augmente le volume de repos. La perte des attaches alvéolaires laisse les bronchioles se fermer à l’expiration. Selon GOLD 2026, une diffusion inférieure à 60 % de la valeur prédite s’associe à plus de symptômes, à une moindre capacité d’effort et à une mortalité accrue.</p>
<div class="lab">Mesure</div><p>Le scanner quantifie l’emphysème par la proportion de poumon de densité très basse, inférieure ou égale à −950 unités Hounsfield. Cette mesure est associée aux symptômes, aux exacerbations, au risque de cancer bronchique, à la progression et au décès.</p>
<div class="lab">Piège</div><p>Un emphysème vu au scanner sans obstruction n’est pas une BPCO ; il correspond à une pré-BPCO et impose l’arrêt du tabac et une surveillance.</p></template>
<template data-pop="j44-disten" data-title="Distension pulmonaire">
<div class="lab">Définition</div><p>Selon GOLD 2026, il y a distension lorsque le volume de gaz contenu dans les poumons en fin d’expiration spontanée dépasse la normale. Elle résulte de la perte de rétraction élastique et de la limitation du débit expiratoire.</p>
<div class="lab">Statique et dynamique</div><p>Le piégeage, c’est-à-dire l’augmentation du volume résiduel, apparaît tôt ; la capacité pulmonaire totale augmente ensuite quand l’obstruction s’aggrave : c’est la distension statique. À l’effort, le temps expiratoire raccourcit, le poumon ne se vide pas et le volume de fin d’expiration monte : c’est la distension dynamique, qui réduit la capacité inspiratoire.</p>
<div class="lab">Conséquences</div><p>Le diaphragme aplati produit moins de force, et la pression positive intrinsèque de fin d’expiration alourdit chaque inspiration. Selon GOLD 2026, la distension contribue à la dyspnée, à l’intolérance à l’effort, aux hospitalisations, à l’insuffisance respiratoire et à la mortalité, et elle existe déjà dans les obstructions légères.</p>
<div class="lab">Mesure</div><p>La pléthysmographie corporelle est la mesure de référence ; la dilution de gaz sous-estime les zones mal ventilées. La capacité inspiratoire mesurée au repos et à l’effort renseigne indirectement sur le volume de fin d’expiration. La radiographie montre des coupoles aplaties et un espace clair rétrosternal élargi.</p>
<div class="lab">Conséquence pratique</div><p>Les bronchodilatateurs de longue durée, la respiration à lèvres pincées, la réhabilitation et, chez certains patients, la réduction de volume diminuent la distension, et donc la dyspnée.</p></template>
<template data-pop="j44-mmrc" data-title="Échelle de dyspnée mMRC">
<div class="lab">Les cinq degrés</div><p>Au degré 0, le patient n’est essoufflé qu’à l’effort intense. Au degré 1, il l’est en marchant vite à plat ou en montant une légère pente. Au degré 2, il marche plus lentement que les personnes de son âge à plat, ou doit s’arrêter pour respirer à son propre rythme. Au degré 3, il s’arrête après environ 100 mètres ou quelques minutes de marche à plat. Au degré 4, il est trop essoufflé pour quitter la maison, ou s’essouffle en s’habillant.</p>
<div class="lab">Usage</div><p>Un degré ≥ 2 sépare les patients plus essoufflés et contribue au classement dans le groupe B. Dans l’indice BODE, les degrés 0 et 1 valent 0 point, le degré 2 un point, le degré 3 deux points et le degré 4 trois points.</p>
<div class="lab">Valeur</div><p>Selon GOLD 2026, le degré mMRC se corrèle bien aux mesures plus complètes de l’état de santé, prédit la mortalité et s’associe à une plus forte consommation de soins.</p>
<div class="lab">Limite</div><p>L’échelle ne mesure que la dyspnée. GOLD recommande donc aussi une mesure globale des symptômes, comme le CAT.</p>
<div class="lab">Exemple</div><p>Monsieur B., qui s’arrête après 100 mètres à plat, est au degré 3.</p></template>
<template data-pop="j44-cat" data-title="Questionnaire CAT, désormais CAAT">
<div class="lab">Contenu</div><p>Le questionnaire comprend huit items cotés de 0 à 5 : toux, expectoration, oppression thoracique, essoufflement en montée, limitation des activités domestiques, confiance pour sortir, sommeil et énergie. Le score total va de 0 à 40. Des traductions validées existent dans de nombreuses langues.</p>
<div class="lab">Seuils</div><p>Un score inférieur à 10 traduit un impact faible ; un score ≥ 10 définit un patient symptomatique. Selon GOLD 2026, ce seuil équivaut à un score de 25 au questionnaire respiratoire de St George, niveau qui correspond aux patients des essais thérapeutiques. La plus petite différence cliniquement importante est de 2 points (Kon et al., 2014).</p>
<div class="lab">Nom</div><p>Pour en étendre l’usage aux autres maladies chroniques des voies aériennes, le questionnaire a été renommé Chronic Airways Assessment Test (CAAT). Le renommage est signalé dès le rapport GOLD 2025, et le nom CAAT est employé dans tout le rapport GOLD 2026, qui précise que les deux questionnaires sont équivalents et leurs scores interchangeables.</p>
<div class="lab">Usage</div><p>Le CAT sert au classement initial et au suivi. Le médecin compare les scores successifs du même patient plutôt que de s’en tenir au seuil.</p>
<div class="lab">Exemple</div><p>Le CAT de Monsieur B. passe de 22 au diagnostic à 17 trois mois après la sortie : l’amélioration dépasse la différence minimale de 2 points.</p></template>
<template data-pop="j44-prism" data-title="PRISm">
<div class="lab">Définition</div><p>La PRISm, pour rapport conservé avec spirométrie altérée, désigne un rapport VEMS/CVF ≥ 0,70 après bronchodilatateur avec un VEMS inférieur à 80 % de la valeur prédite. Ce n’est pas une BPCO, puisque le rapport n’est pas abaissé.</p>
<div class="lab">Fréquence et associations</div><p>Selon GOLD 2026, la PRISm touche 7,1 à 11 % de la population dans les études en population. Elle est plus fréquente chez les fumeurs et les anciens fumeurs, et elle s’associe à l’obésité, à un indice de masse corporelle bas, au sexe féminin et à la multimorbidité.</p>
<div class="lab">Pronostic</div><p>La PRISm augmente le risque de symptômes, de maladie cardiopulmonaire, d’hospitalisation et de décès toutes causes et cardiovasculaire. Elle n’est pas stable : environ 20 à 30 % des personnes évoluent vers une obstruction, d’autres retrouvent une spirométrie normale.</p>
<div class="lab">Piège</div><p>Une CVF basse peut aussi traduire une restriction. Une capacité pulmonaire totale au-dessous de la limite inférieure de la normale fait alors reconnaître une maladie restrictive.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin supprime les expositions, traite les facteurs de risque cardiovasculaire et répète la spirométrie ; aucun traitement inhalé n’a démontré de bénéfice dans cette situation.</p></template>
<template data-pop="j44-bode" data-title="Indice BODE">
<div class="lab">Composantes et barème</div><p>L’indice réunit l’indice de masse corporelle (B), l’obstruction (O), la dyspnée (D) et la capacité d’effort (E), sur une échelle de 0 à 10. Selon le barème reproduit par De Torres et al. (2007), un indice de masse corporelle supérieur à 21 kg/m² vaut 0 point et ≤ 21 vaut 1 point. Un VEMS ≥ 65 % vaut 0 point, de 50 à 64 % 1 point, de 36 à 49 % 2 points et ≤ 35 % 3 points. Les degrés mMRC 0 et 1 valent 0 point, le degré 2 un point, le degré 3 deux points et le degré 4 trois points. Une distance de marche de 6 minutes ≥ 350 m vaut 0 point, de 250 à 349 m 1 point, de 150 à 249 m 2 points et ≤ 149 m 3 points.</p>
<div class="lab">Valeur</div><p>L’indice a été construit sur 207 patients, puis validé sur 625 (New England Journal of Medicine, 2004). Chaque point supplémentaire augmentait le risque de décès toutes causes (rapport de risques 1,34) et de décès respiratoire (1,62). L’indice prédisait mieux le décès que le VEMS seul (statistique C de 0,74 contre 0,65). Dans la cohorte de validation, 61 % des décès étaient dus à l’insuffisance respiratoire, 14 % à l’infarctus et 12 % au cancer bronchique.</p>
<div class="lab">Usage</div><p>Selon GOLD 2026, l’indice BODE prédit la survie mieux que chacune de ses composantes. Il s’évalue lors du suivi après une exacerbation, et une baisse de l’indice après une réduction de volume chirurgicale prédit une meilleure survie.</p>
<div class="lab">Exemple</div><p>Monsieur B. a un VEMS à 45 % (2 points) et un degré mMRC 3 (2 points). Son indice de masse corporelle de 23,7 kg/m² vaut 0 point et sa distance de marche de 320 m 1 point : son indice vaut 5.</p></template>
<template data-pop="j44-inflam" data-title="Inflammation de la BPCO">
<div class="lab">Cellules</div><p>Les macrophages, les neutrophiles et les lymphocytes T CD8 dominent l’inflammation de la BPCO. Selon une étude de 159 pièces opératoires, les lymphocytes CD4 et B et des follicules lymphoïdes s’y ajoutent à mesure que la maladie progresse (New England Journal of Medicine, 2004).</p>
<div class="lab">Médiateurs</div><p>Les cellules épithéliales et les macrophages libèrent des chimiokines, comme la CXCL8, qui attirent les neutrophiles. Le LTB₄ entretient ce recrutement, et le TNF-α amplifie l’inflammation. Des facteurs de croissance induisent le remodelage des parois.</p>
<div class="lab">Stress oxydant</div><p>Selon GOLD 2026, les marqueurs du stress oxydant augmentent dans l’air expiré, l’expectoration et le sang, et encore davantage pendant les exacerbations. Les oxydants réduisent l’activité de l’histone désacétylase 2, par laquelle les corticostéroïdes éteignent l’inflammation : c’est une raison de la résistance relative aux corticostéroïdes.</p>
<div class="lab">Sous-groupe éosinophilique</div><p>Certains patients ont une inflammation riche en éosinophiles et en cellules lymphoïdes innées de type 2, proche de celle de l’asthme. Ils répondent mieux aux corticostéroïdes inhalés et aux biothérapies qui ciblent l’IL-4, l’IL-13 ou l’IL-5.</p>
<div class="lab">Conséquence pratique</div><p>L’inflammation peut persister après l’arrêt du tabac. Les éosinophiles sanguins repèrent les patients qui tireront bénéfice d’un corticostéroïde inhalé.</p></template>
<template data-pop="j44-aat" data-title="Alpha-1 antitrypsine">
<div class="lab">Rôle</div><p>Inhibiteur de protéases synthétisé par le foie ; protège l’élastine alvéolaire contre l’élastase des neutrophiles.</p>
<div class="lab">Dosage</div><p>Chez tout patient atteint de BPCO (GOLD 2026). Intervalle de référence propre à la méthode et au laboratoire : chez l’adulte porteur de deux allèles normaux, limite inférieure vers 1,0 g/L et limite supérieure de 1,9 à 2,7 g/L selon les séries (Merdek et al., Respiratory Research 2026) ; une concentration inférieure à 20 % de la normale évoque fortement un déficit homozygote (GOLD 2026) ; déficit sévère au-dessous du seuil protecteur classique de 11 µmol/L, soit 0,5 g/L (Ferrarotti et al., Breathe 2018). Protéine de phase aiguë : un taux normal pendant une inflammation peut masquer un déficit modéré.</p>
<div class="lab">Confirmation</div><p>Phénotype ou génotype (allèles S, Z) ; dépistage familial.</p></template>
<template data-pop="j44-hoover" data-title="Signe de Hoover">
<div class="lab">Définition</div><p>Le signe de Hoover est une rétraction paradoxale des rebords costaux latéraux vers l’intérieur pendant l’inspiration, alors qu’ils s’écartent normalement.</p>
<div class="lab">Mécanisme</div><p>La distension aplatit le diaphragme et fait disparaître sa zone d’apposition contre la paroi. Ses fibres, devenues horizontales, tirent alors leurs insertions costales vers l’intérieur au lieu de les soulever.</p>
<div class="lab">Technique</div><p>Le médecin observe ou palpe les rebords costaux latéraux pendant une inspiration calme, patient au repos, et compare les deux côtés.</p>
<div class="lab">Valeur</div><p>Une étude a porté sur 172 patients d’une consultation de pneumologie, dont 37 % étaient obstrués (Chest, 2002). Le signe avait une sensibilité de 58 % et une spécificité de 86 %, soit un rapport de vraisemblance positif de 4,16, supérieur à celui des autres signes. L’accord entre observateurs était bon (kappa 0,74).</p>
<div class="lab">Piège</div><p>Sa sensibilité faible fait qu’un signe absent ne rassure pas : il manque chez près de la moitié des patients obstrués.</p></template>
<template data-pop="j44-levres" data-title="Respiration à lèvres pincées">
<div class="lab">Description</div><p>Le patient expire lentement à travers les lèvres presque fermées. Il adopte souvent cette respiration de lui-même lorsque l’obstruction est sévère.</p>
<div class="lab">Mécanisme</div><p>Le frein placé aux lèvres crée une pression positive dans les voies aériennes pendant l’expiration. Cette pression s’oppose au collapsus des bronchioles privées de leurs attaches, allonge l’expiration et ralentit la fréquence respiratoire. Le poumon se vide mieux, et la distension diminue.</p>
<div class="lab">Enseignement</div><p>La technique s’enseigne en réhabilitation et fait partie de l’éducation aux techniques respiratoires, qui aident à contrôler la dyspnée au quotidien.</p>
<div class="lab">Signification clinique</div><p>Une respiration à lèvres pincées spontanée signale une obstruction importante et une distension.</p></template>
<template data-pop="j44-asthme" data-title="Distinction entre asthme et BPCO">
<div class="lab">Principe</div><p>Selon GOLD 2026, l’asthme et la BPCO sont deux maladies différentes, qui peuvent partager des caractères, comme une éosinophilie ou une certaine réversibilité, et qui peuvent coexister. GOLD n’emploie plus le terme de chevauchement.</p>
<div class="lab">Tableau comparatif</div><p>Le tableau suivant compare les deux maladies sur six critères.</p>
<table class="t"><tr><th>Critère</th><th>Asthme</th><th>BPCO</th></tr>
<tr><td>Début</td><td>Souvent dans l’enfance</td><td>Après 40 ans</td></tr><tr><td>Exposition</td><td>Allergènes, virus</td><td>Tabac, poussières</td></tr>
<tr><td>Symptômes</td><td>Variables, nocturnes ou matinaux</td><td>Progressifs, persistants</td></tr><tr><td>Obstruction</td><td>Variable, souvent normalisée</td><td>Persistante après bronchodilatateur</td></tr>
<tr><td>Diffusion du monoxyde de carbone</td><td>Normale</td><td>Basse en cas d’emphysème</td></tr><tr><td>Traitement pivot</td><td>Corticostéroïde inhalé</td><td>Bronchodilatateurs de longue durée</td></tr></table>
<p>La lecture du tableau se fait ligne par ligne, mais aucun critère isolé ne tranche. Selon GOLD 2026, ni la réponse au bronchodilatateur ni les éosinophiles sanguins ne distinguent l’asthme, la BPCO ou leur association.</p>
<div class="lab">Coexistence</div><p>Une obstruction persistante après bronchodilatateur existe chez 5 à 21 % des asthmatiques. L’association évoque une histoire familiale d’asthme, un asthme ou une bronchite dans l’enfance, des sifflements et des manifestations atopiques ; elle s’accompagne de plus de symptômes, d’exacerbations et d’hospitalisations.</p>
<div class="lab">Conséquence pratique</div><p>Si un asthme coexiste, le traitement suit d’abord les recommandations de l’asthme, et le corticostéroïde inhalé devient obligatoire.</p></template>
<template data-pop="j44-eos" data-title="Éosinophiles sanguins dans la BPCO">
<p>&lt; 100/µL : bénéfice faible du corticostéroïde inhalé, risque de pneumonie. 100–300/µL : bénéfice intermédiaire. ≥ 300/µL : bénéfice net ; candidat à la trithérapie et, si exacerbations persistantes, aux biothérapies. Mesurer en état stable ; l’éosinophilie ne sert pas au diagnostic.</p></template>
<template data-pop="j44-gaz" data-title="Gaz du sang dans la BPCO">
<div class="lab">Compensation</div><p>Acidose respiratoire aiguë : HCO₃⁻ +1 mmol/L par 10 mmHg de PaCO₂. Chronique : +3,5 à 4 mmol/L par 10 mmHg.</p>
<div class="lab">Décisions</div><p>pH ≤ 7,35 et PaCO₂ ≥ 45 mmHg (6 kPa) en exacerbation : indication de VNI selon GOLD 2026, en l’absence de contre-indication ; la British Thoracic Society la débute si l’acidose persiste ou apparaît malgré le traitement médical optimal. pH &lt; 7,25 : seuil au-dessous duquel la British Thoracic Society propose d’envisager la ventilation invasive ; un essai de VNI reste possible en milieu surveillé, intubation prête. PaO₂ ≤ 55 mmHg en état stable, confirmée à deux reprises sur trois semaines : oxygénothérapie de longue durée.</p>
<div class="lab">Piège</div><p>Des bicarbonates élevés au repos signalent une hypercapnie chronique : dans ce cas, prudence avec l’oxygène.</p></template>
<template data-pop="j44-vni" data-title="Ventilation non invasive">
<div class="lab">Principe</div><p>La ventilation non invasive délivre une pression positive par un masque, sans intubation. L’aide inspiratoire soulage les muscles respiratoires fatigués et augmente le volume courant ; la pression expiratoire compense la pression positive intrinsèque de fin d’expiration. La PaCO₂ baisse et le pH remonte.</p>
<div class="lab">Indications</div><p>Selon GOLD 2026, la VNI est indiquée dès qu’une des trois situations suivantes est présente. La première est une acidose respiratoire (pH ≤ 7,35 et PaCO₂ ≥ 45 mmHg). La deuxième est une dyspnée sévère avec des signes de fatigue des muscles respiratoires, comme le recours aux muscles accessoires, la respiration abdominale paradoxale ou le tirage intercostal. La troisième est une hypoxémie persistante malgré l’oxygène. Le mode et le lieu de soins dépendent de la tolérance et de la gravité.</p>
<div class="lab">Efficacité</div><p>La VNI réussit dans 80 à 85 % des cas dans les essais. Elle réduit l’intubation, la mortalité, les pneumonies acquises sous ventilation et la durée d’hospitalisation (niveau de preuve A).</p>
<div class="lab">Contre-indications et facteurs défavorables</div><p>Selon la British Thoracic Society (2016), les contre-indications absolues sont rares. Une déformation ou une brûlure faciale sévère et une obstruction fixe des voies aériennes supérieures rendent la VNI impossible ; un pneumothorax aigu doit être drainé avant. Un arrêt ou un quasi-arrêt respiratoire, un coma, des vomissements, des sécrétions abondantes, une arythmie ou une instabilité hémodynamique sont des facteurs défavorables. Ils imposent une surveillance en soins intensifs et une décision rapide d’intubation, sans interdire par eux-mêmes un essai.</p>
<div class="lab">Surveillance</div><p>La gazométrie se contrôle avant et après le début. Une amélioration du pH et de la fréquence respiratoire en 1 à 2 heures prédit le succès ; leur aggravation fait revoir la stratégie, jusqu’à l’intubation. Selon GOLD 2026, la VNI peut s’arrêter sans sevrage lorsque le patient tolère au moins 4 heures de respiration spontanée.</p></template>
<template data-pop="j44-rehab" data-title="Réhabilitation respiratoire">
<div class="lab">Contenu</div><p>La réhabilitation est un programme structuré qui associe l’entraînement à l’endurance et en force, l’éducation, le conseil nutritionnel et le soutien psychologique.</p>
<div class="lab">Pourquoi elle agit</div><p>L’entraînement corrige la dysfonction des muscles squelettiques, qui limite l’effort indépendamment du poumon, et abaisse la ventilation nécessaire pour un même effort. L’éducation enseigne les techniques respiratoires et la gestion de la dyspnée. Selon GOLD 2026, la réhabilitation peut aussi réduire l’anxiété.</p>
<div class="lab">Durée et résultats</div><p>Selon GOLD 2026, la réhabilitation améliore la capacité d’effort, les symptômes et la qualité de vie à tous les grades de sévérité. Le bénéfice optimal s’obtient en général en 6 à 8 semaines, et un prolongement à 12 semaines n’apporte pas de bénéfice supplémentaire.</p>
<div class="lab">Après une exacerbation</div><p>Commencée pendant l’hospitalisation ou dans les 4 semaines après une exacerbation, la réhabilitation a été étudiée dans une méta-analyse de 13 essais randomisés (2018). Elle y était associée à moins de réadmissions (risque relatif 0,47) et à une mortalité à court terme plus basse (0,58 ; intervalle de confiance à 95 % : 0,35 à 0,98). GOLD 2026 juge toutefois peu concluantes les données de mortalité, en raison de l’hétérogénéité des programmes. Un essai de 2014 débutait la réhabilitation dès l’hospitalisation. Il n’a pas réduit les réadmissions à un an et a observé une mortalité plus élevée à un an dans le groupe traité. En pratique, la réhabilitation s’organise donc dans les 4 semaines suivant la sortie.</p>
<div class="lab">En Suisse</div><p>La Société suisse de pneumologie accrédite quarante programmes ambulatoires et dix programmes hospitaliers (registres de juin et juillet 2026). Le calendrier dépend de la stabilité du patient et de l’accès à un programme reconnu.</p></template>
