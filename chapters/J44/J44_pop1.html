<template data-pop="j44-emph" data-title="Emphysème">
<div class="lab">Définition</div><p>Élargissement permanent des espaces aériens distaux à la bronchiole terminale, avec destruction de leurs parois, sans fibrose évidente.</p>
<div class="lab">Conséquences</div><p>Perte de surface d’échange (DLCO basse), perte de rétraction élastique (collapsus expiratoire des bronchioles), distension.</p>
<div class="lab">Types</div><p>Centrolobulaire (fumeur, sommets), panlobulaire (déficit en alpha-1 antitrypsine, bases), paraseptal (bulles sous-pleurales).</p></template>
<template data-pop="j44-disten" data-title="Distension pulmonaire">
<div class="lab">Statique</div><p>Augmentation du volume résiduel et de la capacité pulmonaire totale par perte de rétraction élastique et piégeage.</p>
<div class="lab">Dynamique</div><p>À l’effort, le temps expiratoire raccourcit : le volume de fin d’expiration monte, la capacité inspiratoire baisse. Principale cause de la dyspnée d’effort.</p>
<div class="lab">Mesure</div><p>Pléthysmographie (VR/CPT), capacité inspiratoire ; signes radiologiques et cliniques.</p></template>
<template data-pop="j44-mmrc" data-title="Échelle de dyspnée mMRC">
<p><b>0</b> : dyspnée seulement à l’effort intense. <b>1</b> : en marchant vite à plat ou en montant une légère pente. <b>2</b> : marche plus lentement que les sujets de son âge à plat, ou doit s’arrêter à son propre rythme. <b>3</b> : s’arrête après environ 100 mètres ou quelques minutes à plat. <b>4</b> : trop essoufflé pour quitter la maison, ou en s’habillant.</p>
<div class="lab">Usage</div><p>mMRC ≥ 2 = patient symptomatique (groupe B ou E).</p></template>
<template data-pop="j44-cat" data-title="Évaluation symptomatique : CAT, désormais CAAT">
<p>Huit items cotés de 0 à 5 (toux, expectoration, oppression, essoufflement en montée, activités domestiques, confiance pour sortir, sommeil, énergie) ; score de 0 à 40.</p>
<div class="lab">Seuils et nom</div><p>&lt; 10 : impact faible ; ≥ 10 : patient symptomatique (seuil équivalent à un score de 25 au questionnaire de St George, selon GOLD 2026). Différence minimale cliniquement importante : 2 points (Kon et al., 2014). Pour en étendre l’usage aux autres maladies chroniques des voies aériennes, le questionnaire a été renommé Chronic Airways Assessment Test (CAAT) ; le renommage est signalé dès le rapport GOLD 2025 et le nom CAAT est employé dans tout le rapport GOLD 2026, qui précise que les deux questionnaires sont équivalents et leurs scores interchangeables.</p></template>
<template data-pop="j44-prism" data-title="PRISm">
<p>Preserved Ratio Impaired Spirometry : rapport VEMS/CVF ≥ 0,70 avec VEMS &lt; 80 % de la valeur prédite. Associé à l’obésité, au tabac, aux maladies cardiovasculaires et à une mortalité accrue ; une partie évolue vers la BPCO. Ce n’est pas une BPCO : surveiller et traiter les facteurs de risque.</p></template>
<template data-pop="j44-bode" data-title="Indice BODE">
<p>Body mass index (indice de masse corporelle ≤ 21 kg/m² : 1 point ; &gt; 21 : 0), Obstruction (VEMS : 0 à 3 points), Dyspnée (mMRC : 0 à 3), Exercise (distance au test de marche de 6 minutes : 0 à 3). Score de 0 à 10. Dans la cohorte de validation (625 patients), chaque point supplémentaire augmentait le risque de décès toutes causes (rapport de risques 1,34) et de décès respiratoire (1,62) ; l’indice prédisait mieux le décès que le VEMS seul (statistique C 0,74 contre 0,65 ; Celli et al., 2004).</p></template>
<template data-pop="j44-inflam" data-title="Inflammation de la BPCO">
<p>Macrophages, neutrophiles et lymphocytes T CD8 dominent. Chimiokines (CXCL8), LTB₄ et TNF-α entretiennent le recrutement. Résistance relative aux corticostéroïdes (baisse de l’histone désacétylase 2). Sous-groupe éosinophilique corticosensible.</p></template>
<template data-pop="j44-aat" data-title="Alpha-1 antitrypsine">
<div class="lab">Rôle</div><p>Inhibiteur de protéases synthétisé par le foie ; protège l’élastine alvéolaire contre l’élastase des neutrophiles.</p>
<div class="lab">Dosage</div><p>Chez tout patient atteint de BPCO (GOLD 2026). Intervalle de référence propre à la méthode et au laboratoire : chez l’adulte porteur de deux allèles normaux, limite inférieure vers 1,0 g/L et limite supérieure de 1,9 à 2,7 g/L selon les séries (Merdek et al., Respiratory Research 2026) ; une concentration inférieure à 20 % de la normale évoque fortement un déficit homozygote (GOLD 2026) ; déficit sévère au-dessous du seuil protecteur classique de 11 µmol/L, soit 0,5 g/L (Ferrarotti et al., Breathe 2018). Protéine de phase aiguë : un taux normal pendant une inflammation peut masquer un déficit modéré.</p>
<div class="lab">Confirmation</div><p>Phénotype ou génotype (allèles S, Z) ; dépistage familial.</p></template>
<template data-pop="j44-hoover" data-title="Signe de Hoover">
<p>Rétraction paradoxale des côtes inférieures vers l’intérieur à l’inspiration. Le diaphragme aplati par la distension tire sur ses insertions costales au lieu de les soulever. Spécifique d’une distension sévère.</p></template>
<template data-pop="j44-levres" data-title="Respiration à lèvres pincées">
<p>Expiration freinée par les lèvres : elle crée une pression positive qui maintient les bronchioles ouvertes, ralentit la fréquence et réduit la distension. Le patient l’adopte souvent spontanément ; elle s’enseigne en réhabilitation.</p></template>
<template data-pop="j44-asthme" data-title="Distinguer asthme et BPCO">
<table class="t"><tr><th></th><th>Asthme</th><th>BPCO</th></tr>
<tr><td>Début</td><td>Souvent jeune</td><td>&gt; 40 ans</td></tr><tr><td>Exposition</td><td>Allergènes, virus</td><td>Tabac, poussières</td></tr>
<tr><td>Symptômes</td><td>Variables, nocturnes</td><td>Progressifs, persistants</td></tr><tr><td>Obstruction</td><td>Variable, souvent normalisée</td><td>Persistante après bronchodilatateur</td></tr>
<tr><td>DLCO</td><td>Normale</td><td>Basse si emphysème</td></tr><tr><td>Traitement pivot</td><td>Corticostéroïde inhalé</td><td>Bronchodilatateurs de longue durée</td></tr></table>
<p>Les deux coexistent : traiter alors l’asthme (corticostéroïde inhalé obligatoire) et la BPCO (bronchodilatateurs).</p></template>
<template data-pop="j44-eos" data-title="Éosinophiles sanguins dans la BPCO">
<p>&lt; 100/µL : bénéfice faible du corticostéroïde inhalé, risque de pneumonie. 100–300/µL : bénéfice intermédiaire. ≥ 300/µL : bénéfice net ; candidat à la trithérapie et, si exacerbations persistantes, aux biothérapies. Mesurer en état stable ; l’éosinophilie ne sert pas au diagnostic.</p></template>
<template data-pop="j44-gaz" data-title="Gaz du sang dans la BPCO">
<div class="lab">Compensation</div><p>Acidose respiratoire aiguë : HCO₃⁻ +1 mmol/L par 10 mmHg de PaCO₂. Chronique : +3,5 à 4 mmol/L par 10 mmHg.</p>
<div class="lab">Décisions</div><p>pH ≤ 7,35 et PaCO₂ ≥ 45 mmHg (6 kPa) en exacerbation : indication de VNI selon GOLD 2026, en l’absence de contre-indication ; la British Thoracic Society la débute si l’acidose persiste ou apparaît malgré le traitement médical optimal. pH &lt; 7,25 : seuil au-dessous duquel la British Thoracic Society propose d’envisager la ventilation invasive ; un essai de VNI reste possible en milieu surveillé, intubation prête. PaO₂ ≤ 55 mmHg en état stable, confirmée à deux reprises sur trois semaines : oxygénothérapie de longue durée.</p>
<div class="lab">Piège</div><p>Des bicarbonates élevés au repos signalent une hypercapnie chronique : dans ce cas, prudence avec l’oxygène.</p></template>
<template data-pop="j44-vni" data-title="Ventilation non invasive">
<div class="lab">Indications</div><p>Selon GOLD 2026, au moins l’une des suivantes : acidose respiratoire (pH ≤ 7,35, PaCO₂ ≥ 45 mmHg) ; dyspnée sévère avec signes de fatigue des muscles respiratoires (muscles accessoires, respiration abdominale paradoxale, tirage intercostal) ; hypoxémie persistante malgré l’oxygène. Choix du mode de ventilation et du lieu de soins selon la tolérance et la gravité.</p>
<div class="lab">Contre-indications et facteurs défavorables</div><p>Selon la British Thoracic Society (2016), les contre-indications absolues sont rares : déformation ou brûlure faciale sévère et obstruction fixe des voies aériennes supérieures rendent la VNI impossible ; un pneumothorax aigu doit être drainé avant. Arrêt ou quasi-arrêt respiratoire, coma, vomissements, sécrétions abondantes, arythmie ou instabilité hémodynamique sont des facteurs défavorables : ils imposent une surveillance en soins intensifs et une décision rapide d’intubation, sans interdire par eux-mêmes un essai.</p>
<div class="lab">Suivi</div><p>Gazométrie avant et après le début de la VNI ; une amélioration du pH et de la fréquence respiratoire en 1 à 2 heures prédit le succès ; leur aggravation impose de revoir la stratégie, jusqu’à l’intubation (British Thoracic Society 2016).</p></template>
<template data-pop="j44-rehab" data-title="Réhabilitation respiratoire">
<p>Programme structuré d’entraînement à l’endurance et en force, d’éducation, de nutrition et de soutien psychologique. Selon GOLD 2026, les bénéfices optimaux sont obtenus en général en 6 à 8 semaines. Un prolongement à 12 semaines n’apporte pas de bénéfice supplémentaire. La réhabilitation améliore la dyspnée, l’effort et la qualité de vie ; commencée pendant l’hospitalisation ou dans les 4 semaines après une exacerbation, elle est associée, dans une méta-analyse de 13 essais randomisés (2018), à moins de réadmissions (risque relatif 0,47) et à une diminution de la mortalité à court terme (0,58, intervalle de confiance à 95 % 0,35–0,98). GOLD 2026 qualifie toutefois de peu concluantes les données de mortalité des essais récents, en raison de l’hétérogénéité des programmes. Un essai de 2014 qui débutait la réhabilitation dès l’hospitalisation n’a toutefois pas réduit les réadmissions à un an et a observé une mortalité plus élevée à un an dans le groupe traité : en pratique, l’organiser dans les 4 semaines suivant la sortie (îlot 8). Le calendrier et les modalités dépendent de la stabilité et de l’accès à un programme reconnu : en Suisse, la Société suisse de pneumologie accrédite quarante programmes ambulatoires et dix programmes hospitaliers (registres de juin et juillet 2026).</p></template>
