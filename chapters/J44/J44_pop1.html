<template data-pop="j44-emph" data-title="Emphysème">
<div class="lab">Définition</div><p>Élargissement permanent des espaces aériens distaux à la bronchiole terminale, avec destruction de leurs parois, sans fibrose évidente.</p>
<div class="lab">Conséquences</div><p>Perte de surface d’échange (DLCO basse), perte de rétraction élastique (collapsus expiratoire des bronchioles), distension.</p>
<div class="lab">Types</div><p>Centrolobulaire (fumeur, sommets), panlobulaire (déficit en alpha-1 antitrypsine, bases), paraseptal (bulles sous-pleurales).</p></template>
<template data-pop="j44-disten" data-title="Distension pulmonaire">
<div class="lab">Statique</div><p>Augmentation du volume résiduel et de la capacité pulmonaire totale par perte de rétraction élastique et piégeage.</p>
<div class="lab">Dynamique</div><p>À l’effort, le temps expiratoire raccourcit : le volume de fin d’expiration monte, la capacité inspiratoire baisse. Principale cause de la dyspnée d’effort.</p>
<div class="lab">Mesure</div><p>Pléthysmographie (VR/CPT), capacité inspiratoire ; signes radiologiques et cliniques.</p></template>
<template data-pop="j44-mmrc" data-title="Échelle de dyspnée mMRC">
<p><b>0</b> : dyspnée seulement à l’effort intense. <b>1</b> : en marchant vite à plat ou en montant une légère pente. <b>2</b> : marche plus lentement que les sujets de son âge à plat, ou doit s’arrêter à son propre rythme. <b>3</b> : s’arrête après environ 100 mètres ou quelques minutes à plat. <b>4</b> : trop essoufflé pour quitter la maison, ou en s’habillant.</p>
<div class="lab">Usage</div><p>mMRC ≥ 2 = patient symptomatique (groupe B ou E).</p></template>
<template data-pop="j44-cat" data-title="COPD Assessment Test (CAT)">
<p>Huit items cotés de 0 à 5 (toux, expectoration, oppression, essoufflement en montée, activités domestiques, confiance pour sortir, sommeil, énergie) ; score de 0 à 40.</p>
<div class="lab">Seuils</div><p>&lt; 10 : impact faible ; ≥ 10 : patient symptomatique. Différence cliniquement significative : 2 points.</p></template>
<template data-pop="j44-prism" data-title="PRISm">
<p>Preserved Ratio Impaired Spirometry : rapport VEMS/CVF ≥ 0,70 avec VEMS &lt; 80 % de la valeur prédite. Associé à l’obésité, au tabac, aux maladies cardiovasculaires et à une mortalité accrue ; une partie évolue vers la BPCO. Ce n’est pas une BPCO : surveiller et traiter les facteurs de risque.</p></template>
<template data-pop="j44-bode" data-title="Indice BODE">
<p>Body mass index (indice de masse corporelle ≤ 21 kg/m² : 1 point), Obstruction (VEMS : 0 à 3 points), Dyspnée (mMRC : 0 à 3), Exercise (distance au test de marche de 6 minutes : 0 à 3). Score de 0 à 10 ; plus il est élevé, plus la mortalité à 4 ans est élevée. Il prédit mieux que le VEMS seul.</p></template>
<template data-pop="j44-inflam" data-title="Inflammation de la BPCO">
<p>Macrophages, neutrophiles et lymphocytes T CD8 dominent. Chimiokines (CXCL8), LTB₄ et TNF-α entretiennent le recrutement. Résistance relative aux corticostéroïdes (baisse de l’histone désacétylase 2). Sous-groupe éosinophilique corticosensible.</p></template>
<template data-pop="j44-aat" data-title="Alpha-1 antitrypsine">
<div class="lab">Rôle</div><p>Inhibiteur de protéases synthétisé par le foie ; protège l’élastine alvéolaire contre l’élastase des neutrophiles.</p>
<div class="lab">Dosage</div><p>Une fois chez tout patient atteint de BPCO. Normale environ 1,0–2,0 g/L ; déficit sévère &lt; 0,5 g/L (11 µmol/L). Protéine de phase aiguë : un taux normal pendant une inflammation peut masquer un déficit modéré.</p>
<div class="lab">Confirmation</div><p>Phénotype ou génotype (allèles S, Z) ; dépistage familial.</p></template>
<template data-pop="j44-hoover" data-title="Signe de Hoover">
<p>Rétraction paradoxale des côtes inférieures vers l’intérieur à l’inspiration. Le diaphragme aplati par la distension tire sur ses insertions costales au lieu de les soulever. Spécifique d’une distension sévère.</p></template>
<template data-pop="j44-levres" data-title="Respiration à lèvres pincées">
<p>Expiration freinée par les lèvres : elle crée une pression positive qui maintient les bronchioles ouvertes, ralentit la fréquence et réduit la distension. Le patient l’adopte souvent spontanément ; elle s’enseigne en réhabilitation.</p></template>
<template data-pop="j44-asthme" data-title="Distinguer asthme et BPCO">
<table class="t"><tr><th></th><th>Asthme</th><th>BPCO</th></tr>
<tr><td>Début</td><td>Souvent jeune</td><td>&gt; 40 ans</td></tr><tr><td>Exposition</td><td>Allergènes, virus</td><td>Tabac, poussières</td></tr>
<tr><td>Symptômes</td><td>Variables, nocturnes</td><td>Progressifs, persistants</td></tr><tr><td>Obstruction</td><td>Variable, souvent normalisée</td><td>Persistante après bronchodilatateur</td></tr>
<tr><td>DLCO</td><td>Normale</td><td>Basse si emphysème</td></tr><tr><td>Traitement pivot</td><td>Corticostéroïde inhalé</td><td>Bronchodilatateurs de longue durée</td></tr></table>
<p>Les deux coexistent : traiter alors l’asthme (corticostéroïde inhalé obligatoire) et la BPCO (bronchodilatateurs).</p></template>
<template data-pop="j44-eos" data-title="Éosinophiles sanguins dans la BPCO">
<p>&lt; 100/µL : bénéfice faible du corticostéroïde inhalé, risque de pneumonie. 100–300/µL : bénéfice intermédiaire. ≥ 300/µL : bénéfice net ; candidat à la trithérapie et, si exacerbations persistantes, aux biothérapies. Mesurer en état stable ; l’éosinophilie ne sert pas au diagnostic.</p></template>
<template data-pop="j44-gaz" data-title="Gaz du sang dans la BPCO">
<div class="lab">Compensation</div><p>Acidose respiratoire aiguë : HCO₃⁻ +1 mmol/L par 10 mmHg de PaCO₂. Chronique : +3,5 à 4 mmol/L par 10 mmHg.</p>
<div class="lab">Décisions</div><p>pH &lt; 7,35 et PaCO₂ ≥ 45 mmHg (6 kPa) en exacerbation : VNI. pH &lt; 7,25 : VNI en milieu surveillé, intubation prête. PaO₂ ≤ 55 mmHg en état stable : oxygénothérapie de longue durée.</p>
<div class="lab">Piège</div><p>Des bicarbonates élevés au repos signalent une hypercapnie chronique : dans ce cas, prudence avec l’oxygène.</p></template>
<template data-pop="j44-vni" data-title="Ventilation non invasive">
<div class="lab">Indications</div><p>Acidose respiratoire (pH &lt; 7,35, PaCO₂ ≥ 45 mmHg) ; dyspnée sévère avec épuisement ; hypoxémie persistante malgré l’oxygène.</p>
<div class="lab">Contre-indications</div><p>Arrêt respiratoire, instabilité hémodynamique, troubles de conscience sans protection des voies aériennes, vomissements, traumatisme facial, pneumothorax non drainé.</p>
<div class="lab">Suivi</div><p>Gazométrie à 1–2 heures ; absence d’amélioration du pH : discuter l’intubation.</p></template>
<template data-pop="j44-rehab" data-title="Réhabilitation respiratoire">
<p>Programme de 6 à 12 semaines : entraînement à l’endurance et en force, éducation, nutrition, soutien psychologique. Améliore la dyspnée, l’effort et la qualité de vie ; débutée dans les 4 semaines après une hospitalisation, elle réduit réadmissions et mortalité. En Suisse, programmes ambulatoires et hospitaliers reconnus par la Société suisse de pneumologie.</p></template>
