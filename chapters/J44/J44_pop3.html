<template data-pop="j44-a-tabac" data-title="Anamnèse des expositions inhalées"><div class="lab">Questions</div><p>Le médecin demande si le patient fume ou a fumé, combien de cigarettes par jour, depuis quel âge et, s’il a arrêté, depuis quand. Il recherche aussi le tabagisme passif, le cannabis, la cigarette électronique et la combustion de bois ou de charbon à l’intérieur pour cuisiner ou se chauffer.</p><div class="lab">Calcul</div><p>Les paquets-années se calculent ainsi : nombre de cigarettes fumées par jour divisé par 20, multiplié par le nombre d’années de tabagisme. Un patient qui fume 30 cigarettes par jour depuis 20 ans totalise 1,5 × 20, soit 30 paquets-années.</p><div class="lab">Interprétation</div><p>Le risque croît avec la dose cumulée. Dans une étude de 309 patients (JAMA, 2000), plus de 40 paquets-années avaient un rapport de vraisemblance de 8,3 pour une obstruction. GOLD 2026 cite plus de 20 paquets-années parmi les critères de recherche active de cas qui conduisent à une spirométrie. L’heure de la première cigarette après le réveil renseigne aussi sur la dépendance : moins de 30 minutes signale une forte dépendance.</p><div class="lab">Piège</div><p>Une exposition rend la BPCO plus probable sans la démontrer. À l’inverse, un non-fumeur peut avoir une BPCO : dans la cohorte suisse SAPALDIA, 29,3 % des sujets obstrués n’avaient jamais fumé. Le médecin explore alors la profession, l’enfance et le déficit en alpha-1 antitrypsine.</p></template>
<template data-pop="j44-a-enfance" data-title="Enfance, asthme et infections"><div class="lab">Questions</div><p>GOLD 2026 recommande de rechercher les événements précoces : prématurité, petit poids de naissance, tabagisme maternel pendant la grossesse et tabagisme passif pendant l’enfance. Le médecin demande aussi les infections respiratoires sévères de l’enfance, l’asthme, l’allergie, la sinusite ou les polypes nasaux, une tuberculose ancienne et une infection par le VIH.</p><div class="lab">Portée</div><p>Ces événements réduisent le pic de fonction atteint vers 20 à 25 ans : une obstruction peut alors apparaître à l’âge adulte sans déclin accéléré. L’asthme est un facteur puissant : dans la cohorte suisse SAPALDIA, il multipliait la cote d’obstruction par 6,7. La tuberculose et le VIH augmentent aussi le risque de BPCO.</p><div class="lab">Piège</div><p>Des symptômes variables depuis l’enfance font rechercher un asthme associé, qui impose un corticostéroïde inhalé. À l’inverse, selon GOLD 2026, un CSI, surtout à forte dose, peut favoriser une tuberculose chez un patient à risque. Le médecin exclut donc une tuberculose active avant de le prescrire à un patient qui vit dans une région d’endémie, porte des séquelles radiologiques de tuberculose ou est immunodéprimé.</p><div class="lab">Conséquence pratique</div><p>Un antécédent précoce explique une BPCO sans tabagisme important et oriente le traitement.</p></template>
<template data-pop="j44-a-famille" data-title="Antécédents familiaux et alpha-1 antitrypsine"><div class="lab">Questions</div><p>Le médecin demande s’il existe dans la famille une BPCO ou une autre maladie respiratoire chronique, un emphysème avant 50 ans, une BPCO chez un non-fumeur, une transplantation pulmonaire ou une maladie du foie inexpliquée. Il demande aussi si un apparenté a déjà eu un dosage ou un génotypage de l’alpha-1 antitrypsine.</p><div class="lab">Pourquoi</div><p>Le déficit en alpha-1 antitrypsine se transmet selon un mode codominant. Une histoire familiale évocatrice augmente la probabilité d’un déficit et justifie de tester les apparentés.</p><div class="lab">Suite</div><p>GOLD 2026 recommande de doser l’alpha-1 antitrypsine une fois chez tout patient atteint de BPCO, même sans histoire familiale. Une concentration inférieure à 20 % de la normale évoque fortement un déficit homozygote. Le diagnostic se confirme par le phénotype ou le génotype, puis le patient et sa famille sont adressés à un centre spécialisé.</p><div class="lab">Piège</div><p>L’absence d’histoire familiale n’exclut rien : un déficit peut être découvert chez le premier membre testé d’une famille.</p></template>
<template data-pop="j44-a-exa" data-title="Anamnèse des exacerbations"><div class="lab">Questions</div><p>Sur les douze derniers mois, le médecin fait dater chaque aggravation qui a nécessité une consultation, un corticostéroïde oral, un antibiotique, une visite aux urgences ou une hospitalisation. Il note la gazométrie, une éventuelle ventilation et le délai de récupération. Il demande si l’épisode était en réalité une pneumonie, une embolie ou une insuffisance cardiaque.</p><div class="lab">Pourquoi</div><p>Selon GOLD 2026, le meilleur prédicteur des exacerbations futures est le nombre d’exacerbations de l’année précédente. Une seule exacerbation modérée ou sévère augmente déjà le risque, et le risque est plus grand après deux épisodes ou plus.</p><div class="lab">Décision</div><p>Une exacerbation modérée, traitée par corticostéroïde systémique ou antibiotique, ou sévère, conduisant à l’hospitalisation, place le patient non traité dans le groupe E. Chez le patient déjà traité, une seule exacerbation fait réexaminer le traitement, la technique d’inhalation et l’adhésion.</p><div class="lab">Piège</div><p>Selon GOLD 2026, beaucoup de patients ne reconnaissent pas leurs épisodes comme des exacerbations et parlent de rhume ou de bronchite. Le médecin demande donc les prescriptions d’antibiotiques et de prednisone, plutôt que le mot « exacerbation ».</p></template>
<template data-pop="j44-a-metier" data-title="Exposition professionnelle"><div class="lab">Questions</div><p>Le médecin reconstitue chaque poste occupé, ses dates, les poussières, les vapeurs, les gaz ou les fumées respirés, la ventilation des locaux et les protections réellement portées. Il recherche un lien temporel entre l’exposition et les symptômes.</p><div class="lab">Portée</div><p>La déclaration de l’American Thoracic Society et de l’European Respiratory Society (2019) attribue 14 % des BPCO aux expositions professionnelles, et 31 % chez les personnes n’ayant jamais fumé. Les poussières minérales, dont la silice des chantiers et des mines, les vapeurs, les gaz et les fumées, ainsi que les poussières agricoles, sont les expositions les plus souvent en cause.</p><div class="lab">Piège</div><p>Un tabagisme n’exclut pas une contribution professionnelle : les deux risques s’additionnent. À l’inverse, une exposition ne dispense jamais de confirmer l’obstruction par la spirométrie.</p><div class="lab">Conséquence pratique</div><p>Le médecin documente l’exposition dans le dossier et conseille la protection respiratoire si l’exposition se poursuit.</p></template>
<template data-pop="j44-a-cardio" data-title="Comorbidités cardiovasculaires à l’anamnèse"><div class="lab">Questions</div><p>Le médecin recherche une orthopnée, une dyspnée nocturne, des œdèmes, des palpitations, une douleur thoracique, un infarctus ou une insuffisance cardiaque connus, et il relève les traitements. Il suit l’évolution parallèle des symptômes respiratoires et du poids.</p><div class="lab">Pourquoi</div><p>Selon GOLD 2026, l’hypertension artérielle touche près de 50 % des patients atteints de BPCO, l’insuffisance cardiaque 20 à 30 % et la maladie coronarienne 10 à 20 %. Ces maladies produisent les mêmes plaintes et restent souvent méconnues.</p><div class="lab">Décision</div><p>Une aggravation rapide, une orthopnée ou des œdèmes nouveaux conduisent à rechercher une cause cardiaque, par les peptides natriurétiques puis l’échocardiographie. GOLD recommande un électrocardiogramme au diagnostic de BPCO et lors d’un changement inexpliqué des symptômes.</p><div class="lab">Piège</div><p>Une BPCO connue n’explique pas automatiquement chaque dyspnée. Un inhibiteur de l’enzyme de conversion peut aussi expliquer une toux chronique.</p></template>
<template data-pop="j44-a-sommeil" data-title="Sommeil et hypoventilation"><div class="lab">Questions</div><p>Le médecin interroge sur les ronflements, les pauses respiratoires observées par le conjoint, la somnolence diurne, les céphalées matinales et la prise de poids. Il relève les sédatifs, l’alcool et une éventuelle ventilation nocturne.</p><div class="lab">Pourquoi</div><p>Selon GOLD 2026, l’apnée obstructive du sommeil coexiste souvent avec la BPCO, surtout chez l’homme obèse et chez la femme ménopausée obèse. L’association produit plus de désaturations nocturnes, plus d’hypercapnie, plus d’arythmies et plus d’hypertension pulmonaire, et son pronostic est plus sombre que celui de chaque maladie seule.</p><div class="lab">Décision</div><p>Une obésité, un ronflement, une somnolence diurne ou une hypertension artérielle justifient une étude du sommeil. La pression positive continue améliore alors la qualité de vie et diminue le risque de décès.</p><div class="lab">Piège</div><p>Une hypercapnie disproportionnée à l’obstruction fait rechercher une apnée du sommeil ou un syndrome d’hypoventilation lié à l’obésité. L’oxymètre ne mesure pas le dioxyde de carbone.</p></template>
<template data-pop="j44-a-psy" data-title="Humeur, anxiété et traitements sédatifs"><div class="lab">Pourquoi</div><p>Selon GOLD 2026, l’anxiété et la dépression sont fréquentes et sous-diagnostiquées dans la BPCO. Elles s’associent à un état de santé plus mauvais, à davantage d’exacerbations, d’hospitalisations en urgence et de réadmissions, et à une mortalité accrue. Le risque de suicide est deux fois plus élevé que chez les personnes sans BPCO. Les personnes atteintes d’une maladie psychiatrique sévère reçoivent en outre moins souvent des soins somatiques conformes aux recommandations.</p><div class="lab">Dépistage</div><p>GOLD propose deux questionnaires de deux questions. Le Patient Health Questionnaire-2 demande la fréquence de l’humeur dépressive et de la perte d’intérêt au cours des deux dernières semaines, chacune cotée de 0 à 3. Dans l’étude de validation, un score de 3 ou plus avait une sensibilité de 83 % et une spécificité de 92 % pour une dépression majeure (Medical Care, 2003). Le Generalized Anxiety Disorder-2 reprend les deux questions centrales d’un questionnaire d’anxiété à sept questions, avec le même seuil.</p><div class="lab">Traitement</div><p>La réhabilitation, associée à une thérapie cognitivo-comportementale, réduit l’anxiété et la dépression. Les antidépresseurs se manient avec prudence, et une dépression sévère ou des idées suicidaires imposent une orientation spécialisée rapide.</p><div class="lab">Sédatifs</div><p>Les benzodiazépines n’ont pas d’effet démontré sur la dyspnée et exposent l’hypercapnique à une dépression respiratoire. Le médecin relève leur dose et leur rythme de prise.</p></template>
<template data-pop="j44-a-metab" data-title="Comorbidités métaboliques et osseuses"><div class="lab">Questions</div><p>Le médecin recherche un diabète et son traitement, une obésité abdominale, une hypertension artérielle et une dyslipidémie. Pour l’os, il demande les fractures survenues après un traumatisme mineur, une perte de taille, les cures répétées ou prolongées de corticostéroïdes systémiques et une densitométrie antérieure.</p><div class="lab">Fréquences</div><p>Selon GOLD 2026, un diabète de type 2 touche environ 20 % des patients atteints de BPCO. L’ostéoporose touche jusqu’à 30 % des femmes et 18 % des hommes, souvent sans diagnostic. Un indice de masse corporelle inférieur à 21 ou supérieur à 30 kg/m² aggrave le pronostic.</p><div class="lab">Pourquoi</div><p>Les corticostéroïdes systémiques des exacerbations déséquilibrent la glycémie et fragilisent l’os. GOLD décrit aussi une perte tissulaire multiple, associant emphysème, maigreur, ostéoporose et sarcopénie, qui s’accompagne de plus d’exacerbations et de décès.</p><div class="lab">Conduite</div><p>Le médecin demande une hémoglobine glyquée et une glycémie à jeun si elles datent de plus d’un an, et une densitométrie en cas de facteur de risque. Il limite les cures de corticostéroïdes au strict nécessaire. Ces maladies se traitent selon leurs recommandations habituelles.</p></template>

<template data-pop="j44-s-dysp" data-title="Caractérisation de la dyspnée"><div class="lab">Méthode</div><p>Le médecin compare les distances et les tâches possibles aujourd’hui, il y a six mois et avant la maladie. Il précise la pente, la vitesse, les pauses et les activités domestiques abandonnées. Il cote l’échelle mMRC ou le CAT, et il note la date pour suivre l’évolution.</p><div class="lab">Ce que ressent le patient</div><p>Selon GOLD 2026, les patients décrivent un effort accru pour respirer, une lourdeur thoracique, une soif d’air ou un halètement. La dyspnée comporte une composante sensorielle et une composante émotionnelle, et les mots varient selon les personnes et les cultures.</p><div class="lab">Mécanismes et fréquence</div><p>La dyspnée provient de la distension, des troubles des échanges gazeux, de la dysfonction musculaire, de la détresse psychologique, d’une respiration dysfonctionnelle et des comorbidités cardiovasculaires. Plus de 40 % des patients suivis en soins primaires rapportent une dyspnée modérée à sévère.</p><div class="lab">Discriminants</div><p>Une progression lente à l’effort est compatible avec la BPCO. Une aggravation brutale fait chercher une embolie, un pneumothorax, une décompensation cardiaque ou une exacerbation. Une orthopnée oriente vers une cause cardiaque.</p><div class="lab">Piège</div><p>Certains patients réduisent leurs activités pour ne pas s’essouffler et déclarent peu de gêne malgré une obstruction sévère. Un test de marche révèle alors leur limitation réelle.</p></template>
<template data-pop="j44-s-toux" data-title="Caractérisation de la toux"><div class="lab">Méthode</div><p>Le médecin note la durée, le rythme matinal ou nocturne, les facteurs déclenchants, l’efficacité de la toux et tout changement récent. Il recherche une hémoptysie, une fièvre, un amaigrissement et une exposition professionnelle.</p><div class="lab">Dans la BPCO</div><p>Selon GOLD 2026, la toux chronique est souvent le premier symptôme, et le patient la banalise comme une conséquence du tabac. D’abord intermittente, elle devient quotidienne, productive ou non. Une obstruction importante peut toutefois se développer sans toux. Chez le patient très obstrué, des quintes prolongées peuvent provoquer une syncope ou des fractures de côtes, parfois indolores.</p><div class="lab">Autres causes</div><p>La figure 2.2 de GOLD 2026 rappelle les autres causes de toux chronique. Dans le thorax, ce sont l’asthme, le cancer bronchique, la tuberculose, les bronchectasies, l’insuffisance cardiaque gauche, les pneumopathies interstitielles, la mucoviscidose et la toux idiopathique. Hors du thorax, ce sont la rhinite allergique, l’écoulement nasal postérieur, le reflux gastro-œsophagien et les inhibiteurs de l’enzyme de conversion.</p><div class="lab">Piège</div><p>La toux d’un fumeur n’est jamais « normale ». Une hémoptysie ou un changement persistant du caractère de la toux impose de rechercher un cancer bronchique.</p></template>
<template data-pop="j44-s-crachats" data-title="Interprétation de l’expectoration"><div class="lab">Méthode</div><p>Le médecin fait estimer la quantité quotidienne, l’aspect habituel, l’apparition d’une purulence et l’aggravation concomitante de la dyspnée. Il recherche une odeur fétide, du sang et une expectoration très abondante.</p><div class="lab">Dans la BPCO</div><p>Selon GOLD 2026, le patient expectore habituellement de petites quantités de crachats visqueux. L’évaluation est difficile, car beaucoup de patients avalent leurs crachats, et l’expectoration varie avec des poussées et des rémissions. La bronchite chronique concerne 27 à 35 % des patients atteints de BPCO.</p><div class="lab">Purulence</div><p>La purulence traduit une augmentation des médiateurs inflammatoires. Son association avec une infection bactérienne existe mais reste faible ; elle a toutefois une sensibilité de 94,4 % et une spécificité de 52 % pour une charge bactérienne élevée. En exacerbation, une purulence nouvelle associée à un autre symptôme fait partie des indications de l’antibiotique.</p><div class="lab">Piège</div><p>Une expectoration purulente et très abondante au long cours, avec des infections répétées, oriente vers des bronchectasies, que la tomodensitométrie confirme.</p></template>
<template data-pop="j44-s-siffle" data-title="Sifflements et oppression thoracique"><div class="lab">Méthode</div><p>Le médecin fait préciser si le sifflement survient à l’inspiration ou à l’expiration, s’il varie selon le moment de la journée et s’il disparaît spontanément ou sous bronchodilatateur. Il recherche une douleur thoracique véritable et l’effort qui la déclenche.</p><div class="lab">Dans la BPCO</div><p>Selon GOLD 2026, les sifflements et l’oppression varient d’un jour à l’autre et au cours d’une même journée. L’oppression suit souvent l’effort, est mal localisée, de caractère musculaire, et pourrait venir de la contraction isométrique des muscles intercostaux.</p><div class="lab">Valeur</div><p>L’absence de sifflements n’exclut pas une BPCO, et leur présence ne confirme pas un asthme. Dans une étude de 309 patients (JAMA, 2000), les sibilants avaient un rapport de vraisemblance de 2,7, mais ils n’apportaient pas d’information indépendante une fois l’âge, le tabac et l’anamnèse connus.</p><div class="lab">Piège</div><p>Des symptômes très variables avec des périodes sans gêne font rechercher un asthme associé. Une oppression récente chez un patient à risque cardiovasculaire impose d’écarter un syndrome coronarien.</p></template>
<template data-pop="j44-s-poids" data-title="Fatigue et amaigrissement"><div class="lab">Fatigue</div><p>Selon GOLD 2026, la fatigue est l’un des symptômes les plus fréquents et les plus pénibles de la BPCO. Les patients la décrivent comme une lassitude générale ou une impression d’être vidés de leur énergie ; elle limite les activités quotidiennes et la qualité de vie. L’éducation, la réhabilitation, le soutien nutritionnel et les interventions corps-esprit l’améliorent.</p><div class="lab">Amaigrissement</div><p>La perte de poids, la fonte musculaire et l’anorexie sont fréquentes aux stades sévères et très sévères. Elles ont une valeur pronostique, mais elles peuvent aussi révéler une tuberculose ou un cancer bronchique : GOLD demande de toujours les explorer.</p><div class="lab">Méthode</div><p>Le médecin mesure et date la perte de poids, compare l’appétit, examine la masse musculaire et recherche une fièvre, des sueurs nocturnes, des crachats sanglants et des symptômes dépressifs.</p><div class="lab">Piège</div><p>La fatigue d’une dépression ou d’une anémie ressemble à celle de la BPCO. Selon GOLD 2026, une anémie touche 7,5 à 34 % des patients : le médecin demande une hémoglobine.</p></template>

<template data-pop="j44-p-freq" data-title="Fréquence respiratoire et parole"><div class="lab">Technique</div><p>Le médecin compte les mouvements thoraco-abdominaux sur une minute complète, au repos, sans prévenir le patient, car l’attention modifie la respiration. Il observe si le patient finit ses phrases sans reprendre son souffle et s’il paraît fournir un effort.</p><div class="lab">Valeur</div><p>Dans la classification de Rome, une fréquence respiratoire de 24 par minute ou plus est l’un des cinq critères d’une exacerbation modérée. À l’hôpital, GOLD 2026 retient une fréquence supérieure à 24 par minute parmi les signes d’insuffisance respiratoire.</p><div class="lab">Alerte</div><p>Une fréquence qui augmente rapidement, une parole hachée ou un épuisement clinique exigent une évaluation urgente et des gaz du sang.</p><div class="lab">Piège</div><p>Un chiffre isolé ne remplace pas l’ensemble des signes de gravité. Une fréquence qui baisse chez un patient épuisé et somnolent annonce une défaillance, non une amélioration.</p></template>
<template data-pop="j44-p-expir" data-title="Expiration et auscultation"><div class="lab">Technique</div><p>Le médecin observe la durée de l’expiration au repos. Il ausculte systématiquement les deux hémithorax, compare l’entrée d’air et recherche des sibilants, des ronchi, des crépitants ou une asymétrie.</p><div class="lab">Signification</div><p>Une expiration prolongée traduit l’obstruction. Un murmure vésiculaire diminué traduit la distension et l’emphysème, qui réduisent la transmission des bruits respiratoires.</p><div class="lab">Valeur</div><p>Selon GOLD 2026, les signes physiques d’obstruction n’apparaissent qu’après une altération importante de la fonction, et leur sensibilité comme leur spécificité sont faibles. Les sibilants n’ajoutent pas d’information indépendante une fois l’âge, le tabac et l’anamnèse connus.</p><div class="lab">Piège</div><p>Ces signes ne remplacent pas la spirométrie. Une asymétrie nouvelle fait rechercher un pneumothorax, un épanchement pleural ou une obstruction localisée par une tumeur.</p></template>
<template data-pop="j44-p-tirage" data-title="Muscles accessoires et épuisement"><div class="lab">Technique</div><p>Le médecin observe les muscles du cou, les creux sus-sternaux, les espaces intercostaux et le mouvement de l’abdomen. Il note la posture spontanée, souvent penchée en avant, bras en appui, et la coordination entre le thorax et l’abdomen.</p><div class="lab">Mécanisme</div><p>Quand le diaphragme aplati ne suffit plus, les muscles accessoires prennent le relais. Une respiration abdominale paradoxale, où l’abdomen rentre à l’inspiration, signale un diaphragme épuisé.</p><div class="lab">Valeur</div><p>Selon GOLD 2026, une dyspnée sévère avec des signes de fatigue des muscles respiratoires, comme le recours aux muscles accessoires, la respiration abdominale paradoxale et le tirage intercostal, est une indication de VNI.</p><div class="lab">Alerte</div><p>Le tirage, une respiration paradoxale, des sueurs, une baisse de vigilance ou un effort qui diminue chez un patient auparavant très dyspnéique annoncent une défaillance ventilatoire imminente.</p></template>
<template data-pop="j44-p-spo" data-title="Saturation pulsée et gaz du sang"><div class="lab">Technique</div><p>Le médecin mesure la saturation au repos, vérifie la qualité du signal et relève le débit d’oxygène au même moment. Selon GOLD 2026, l’oxymètre est moins précis chez les personnes à peau foncée.</p><div class="lab">Seuil</div><p>GOLD 2026 demande une gazométrie artérielle si la saturation est ≤ 92 %, car la corrélation entre la saturation pulsée et la PaO₂ est imparfaite. L’oxymétrie évalue aussi tout patient qui présente des signes d’insuffisance respiratoire ou cardiaque droite.</p><div class="lab">En exacerbation</div><p>Sous oxygène, la cible de 88 à 92 % évite l’hyperoxie chez l’hypercapnique. La gazométrie précise le pH et la PaCO₂, qui décident de la VNI.</p><div class="lab">Piège</div><p>Une saturation normale n’exclut pas une hypercapnie, car l’oxymètre ne mesure ni la PaCO₂ ni le pH. Des bicarbonates élevés sur une gazométrie révèlent parfois une hypercapnie chronique méconnue.</p></template>
<template data-pop="j44-p-coeur" data-title="Retentissement cardiaque droit"><div class="lab">Technique</div><p>Le médecin recherche une turgescence jugulaire, un reflux hépato-jugulaire, des œdèmes déclives et une hépatomégalie. Il relève le poids et son évolution récente, et il examine aussi les signes d’insuffisance cardiaque gauche.</p><div class="lab">Interprétation</div><p>Selon GOLD 2026, des œdèmes des chevilles peuvent traduire un cœur pulmonaire chronique, conséquence de l’hypertension pulmonaire. Ces signes ne sont cependant pas spécifiques.</p><div class="lab">Piège</div><p>Une prise de poids rapide, une orthopnée ou des crépitants orientent vers une insuffisance cardiaque gauche associée, présente chez 20 à 30 % des patients atteints de BPCO.</p><div class="lab">Conséquence pratique</div><p>Le médecin demande une échocardiographie et un dosage des peptides natriurétiques. Une hypoxémie associée fait discuter l’oxygène de longue durée.</p></template>
<template data-pop="j44-p-conscience" data-title="Conscience et astérixis"><div class="lab">Technique</div><p>Le médecin évalue l’attention, l’orientation et la somnolence, et il recherche des céphalées matinales et la prise de sédatifs. Pour l’astérixis, il demande au patient d’étendre les bras, de relever les poignets et d’écarter les doigts : de brèves pertes de posture peuvent apparaître.</p><div class="lab">Mécanisme</div><p>Le dioxyde de carbone dilate les vaisseaux cérébraux, ce qui explique les céphalées, puis il déprime la vigilance lorsque sa pression monte vite.</p><div class="lab">Valeur</div><p>Selon GOLD 2026, une altération aiguë de l’état mental, comme une confusion, une léthargie ou un coma, fait partie des critères d’admission en soins intensifs.</p><div class="lab">Piège</div><p>L’astérixis n’est pas spécifique de l’hypercapnie : une encéphalopathie hépatique ou métabolique peut le produire. Une somnolence nouvelle avec une détresse respiratoire impose une gazométrie et une prise en charge urgente.</p></template>
<template data-pop="j44-p-hippo" data-title="Hippocratisme digital"><div class="lab">Technique</div><p>Le médecin observe la convexité de l’ongle et la souplesse du lit unguéal. Il accole les faces dorsales de deux doigts homologues : la disparition de la petite fenêtre en losange normalement visible entre les ongles, appelée fenêtre de Schamroth, signe l’hippocratisme.</p><div class="lab">Interprétation</div><p>Ce signe n’est pas expliqué par la BPCO. Chez un fumeur, il fait rechercher un cancer bronchique, des bronchectasies ou une fibrose pulmonaire.</p><div class="lab">Piège</div><p>L’absence d’hippocratisme n’exclut aucun de ces diagnostics. Le considérer comme un signe de BPCO retarde le diagnostic d’un cancer.</p><div class="lab">Conséquence pratique</div><p>Un hippocratisme chez un patient BPCO impose une imagerie thoracique, habituellement une tomodensitométrie.</p></template>
