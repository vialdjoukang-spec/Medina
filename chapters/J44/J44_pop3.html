<template data-pop="j44-a-tabac" data-title="Interroger les expositions inhalées"><div class="lab">Questions</div><p>« Avez-vous fumé ? Combien de cigarettes par jour, pendant combien d’années, et quand avez-vous arrêté ? » Rechercher aussi tabagisme passif, cannabis, cigarette électronique et chauffage au combustible à l’intérieur. Calculer les paquets-années : (cigarettes par jour ÷ 20) × années de tabagisme.</p><div class="lab">Interprétation</div><p>Une exposition augmente la probabilité de BPCO sans poser le diagnostic. Un patient non fumeur peut également avoir une BPCO : explorer la profession, le développement pulmonaire et le déficit en alpha-1 antitrypsine.</p></template>
<template data-pop="j44-a-enfance" data-title="Antécédents respiratoires de l’enfance"><div class="lab">Questions</div><p>Rechercher prématurité, exposition prénatale au tabac, infections basses sévères, sifflements, asthme antérieur et traitements reçus. Demander si l’essoufflement a débuté dès l’enfance ou seulement à l’âge adulte.</p><div class="lab">Portée</div><p>Une fonction respiratoire maximale initialement faible peut aboutir à une obstruction à l’âge adulte sans déclin accéléré. Des symptômes variables depuis l’enfance font aussi rechercher un asthme associé : la prise en charge change alors.</p></template>
<template data-pop="j44-a-famille" data-title="Antécédents familiaux et alpha-1 antitrypsine"><div class="lab">Questions</div><p>Demander emphysème avant la cinquantaine, BPCO chez un non-fumeur, transplantation pulmonaire, cirrhose inexpliquée, maladie hépatique du nourrisson et résultats de dosage ou de génotypage chez les apparentés.</p><div class="lab">Suite</div><p>Le dosage de l’alpha-1 antitrypsine est recommandé une fois chez les personnes atteintes de BPCO, même sans histoire familiale. Une concentration basse impose une confirmation phénotypique ou génétique et un conseil familial.</p></template>
<template data-pop="j44-a-exa" data-title="Reconstituer les exacerbations"><div class="lab">Questions</div><p>Sur douze mois, faire dater chaque aggravation ayant nécessité une consultation, des corticostéroïdes, un antibiotique, une visite aux urgences ou une hospitalisation. Noter la gazométrie, la ventilation et la récupération. Demander si l’épisode était une pneumonie, une embolie ou une insuffisance cardiaque.</p><div class="lab">Décision</div><p>GOLD 2026 considère qu’une exacerbation modérée ou sévère antérieure suffit à placer le patient nouvellement évalué dans le groupe E. Chez le patient déjà traité, une seule exacerbation modérée invite à réexaminer le traitement et sa technique.</p></template>
<template data-pop="j44-a-metier" data-title="Exposition professionnelle"><div class="lab">Questions</div><p>Reconstituer chaque poste, ses dates, les poussières ou fumées respirées, la ventilation, les protections réelles et le lien temporel avec les symptômes. Maçonnerie, mines, métallurgie, agriculture et combustion exposent à des agents différents.</p><div class="lab">Piège</div><p>La présence d’un tabagisme n’exclut pas une contribution professionnelle ; inversement, une exposition ne dispense pas de confirmer l’obstruction par spirométrie.</p></template>
<template data-pop="j44-a-cardio" data-title="Comorbidités cardiovasculaires"><div class="lab">Questions</div><p>Rechercher orthopnée, dyspnée nocturne, œdèmes, palpitations, douleur thoracique, infarctus, insuffisance cardiaque et traitements. Examiner l’évolution en parallèle des symptômes respiratoires et du poids.</p><div class="lab">Décision</div><p>Une aggravation rapide, une orthopnée ou des œdèmes nouveaux conduisent à rechercher une cause cardiaque concomitante. Une BPCO connue n’explique pas automatiquement chaque dyspnée.</p></template>
<template data-pop="j44-a-sommeil" data-title="Sommeil et hypoventilation"><div class="lab">Questions</div><p>Interroger ronflements, pauses respiratoires observées, somnolence diurne, céphalées matinales et prise de poids. Relever les sédatifs, l’alcool et la ventilation nocturne éventuelle.</p><div class="lab">Piège</div><p>Une hypercapnie disproportionnée à l’obstruction impose d’envisager une apnée du sommeil ou un syndrome d’hypoventilation lié à l’obésité. L’oxymétrie seule ne mesure pas le dioxyde de carbone.</p></template>
<template data-pop="j44-a-psy" data-title="Humeur, anxiété et traitements sédatifs"><div class="lab">Questions</div><p>Demander perte d’intérêt, humeur, évitement de l’effort, attaques de panique et retentissement fonctionnel. Noter alcool, benzodiazépines, opioïdes et hypnotiques, en précisant dose et rythme de prise.</p><div class="lab">Portée</div><p>L’anxiété majore la perception de dyspnée sans exclure une aggravation organique. Les médicaments sédatifs augmentent le risque chez un patient hypercapnique ; une modification de traitement demande une appréciation individuelle.</p></template>
<template data-pop="j44-a-metab" data-title="Comorbidités métaboliques et osseuses"><div class="lab">Questions</div><p>Rechercher un diabète et son traitement, une obésité abdominale, une hypertension artérielle et une dyslipidémie. Pour l’os : fractures survenues après un traumatisme mineur, perte de taille, cures répétées ou prolongées de corticostéroïdes systémiques, densitométrie antérieure.</p><div class="lab">Portée</div><p>Ces comorbidités sont fréquentes dans la BPCO et pèsent sur le pronostic. Elles se traitent selon leurs recommandations habituelles ; la BPCO ne modifie pas ces traitements. Corticostéroïdes systémiques, dénutrition et inactivité exposent à l’ostéoporose : discuter une densitométrie (îlot 11).</p></template>

<template data-pop="j44-s-dysp" data-title="Caractériser la dyspnée"><div class="lab">Méthode</div><p>Comparer les distances et tâches possibles aujourd’hui, il y a six mois et avant la maladie ; préciser pente, vitesse, pauses et activités domestiques. Coter l’échelle mMRC ou le questionnaire CAT, en notant leur date.</p><div class="lab">Discriminants</div><p>Progression lente à l’effort : compatible avec la BPCO. Rupture aiguë : examiner embolie, pneumothorax, décompensation cardiaque et exacerbation. Orthopnée : chercher particulièrement une cause cardiaque.</p></template>
<template data-pop="j44-s-toux" data-title="Caractériser la toux"><div class="lab">Méthode</div><p>Noter durée, rythme matinal ou nocturne, facteurs déclenchants, efficacité de la toux et changement récent. Chercher hémoptysie, fièvre, amaigrissement et exposition professionnelle.</p><div class="lab">Piège</div><p>Une toux chez le fumeur ne doit jamais être tenue pour « normale ». Une hémoptysie ou une modification persistante du caractère de la toux appelle une évaluation d’une autre cause, notamment tumorale.</p></template>
<template data-pop="j44-s-crachats" data-title="Interpréter l’expectoration"><div class="lab">Méthode</div><p>Faire estimer la quantité quotidienne, l’aspect habituel, l’apparition de purulence et l’augmentation concomitante de dyspnée. Rechercher odeur fétide, sang et expectoration très abondante.</p><div class="lab">Discriminants</div><p>Un changement aigu vers la purulence peut soutenir l’indication antibiotique dans une exacerbation. Une purulence chronique abondante et des infections répétées orientent vers des bronchectasies, sans les démontrer à elle seule.</p></template>
<template data-pop="j44-s-siffle" data-title="Sifflement et oppression"><div class="lab">Méthode</div><p>Faire préciser si le bruit survient à l’inspiration ou à l’expiration, s’il varie selon le moment de la journée et s’il disparaît spontanément ou sous bronchodilatateur. Rechercher douleur thoracique véritable et effort déclenchant.</p><div class="lab">Piège</div><p>Un sifflement variable avec périodes asymptomatiques fait rechercher un asthme associé. Une oppression récente chez un patient à risque cardiovasculaire nécessite d’écarter un syndrome coronarien.</p></template>
<template data-pop="j44-s-poids" data-title="Fatigue et amaigrissement"><div class="lab">Méthode</div><p>Mesurer et dater la perte de poids, comparer l’appétit, examiner la masse musculaire et rechercher fièvre, sueurs nocturnes, sang dans les crachats et symptômes dépressifs.</p><div class="lab">Piège</div><p>La dénutrition est fréquente dans la BPCO avancée, mais un amaigrissement nouveau ne se résume pas à la maladie respiratoire : cancer, infection, trouble métabolique et état dépressif sont à considérer.</p></template>

<template data-pop="j44-p-freq" data-title="Fréquence respiratoire et parole"><div class="lab">Technique</div><p>Compter les mouvements thoraco-abdominaux sur une minute au repos, sans demander au patient de modifier sa respiration. Observer s’il peut finir une phrase sans reprise d’air et apprécier l’effort respiratoire.</p><div class="lab">Interprétation</div><p>Une fréquence rapidement croissante, une parole interrompue ou un épuisement clinique exigent une évaluation urgente. Le chiffre isolé ne remplace pas l’ensemble des signes de gravité.</p></template>
<template data-pop="j44-p-expir" data-title="Expiration et auscultation"><div class="lab">Technique</div><p>Observer le temps expiratoire au repos ; ausculter systématiquement les deux hémithorax, comparer l’entrée d’air et rechercher sibilants, râles ou asymétrie.</p><div class="lab">Piège</div><p>Une expiration prolongée et un murmure diminué soutiennent l’obstruction et la distension, mais ne remplacent pas la spirométrie. Une asymétrie nouvelle doit faire rechercher pneumothorax, épanchement ou obstruction localisée.</p></template>
<template data-pop="j44-p-tirage" data-title="Muscles accessoires et épuisement"><div class="lab">Technique</div><p>Observer cou, creux sus-sternaux, espaces intercostaux et mouvement abdominal, en notant la posture spontanée et la coordination thoraco-abdominale.</p><div class="lab">Alerte</div><p>Le tirage, une respiration paradoxale, la sueur, la baisse de vigilance ou la diminution de l’effort chez un patient auparavant très dyspnéique suggèrent une défaillance ventilatoire imminente.</p></template>
<template data-pop="j44-p-spo" data-title="Saturation et gaz du sang"><div class="lab">Technique</div><p>Mesurer la saturation au repos, vérifier la qualité du signal et relever le débit d’oxygène au même instant. Un résultat bas ou une altération de la conscience justifie une gazométrie si elle modifiera la prise en charge.</p><div class="lab">Piège</div><p>Une saturation normale n’exclut pas une hypercapnie. Chez le patient en exacerbation recevant de l’oxygène, la cible de 88–92 % évite l’hyperoxie ; la gazométrie précise pH et pression de dioxyde de carbone.</p></template>
<template data-pop="j44-p-coeur" data-title="Retentissement cardiaque droit"><div class="lab">Technique</div><p>Rechercher turgescence jugulaire, reflux hépato-jugulaire, œdèmes déclives et hépatomégalie ; relever poids et évolution récente. Examiner également les causes cardiaques gauches.</p><div class="lab">Interprétation</div><p>Ces signes peuvent accompagner une hypertension pulmonaire et un cœur pulmonaire chronique ; ils ne sont pas spécifiques. Une prise de poids rapide et l’orthopnée orientent vers une décompensation cardiaque associée.</p></template>
<template data-pop="j44-p-conscience" data-title="Conscience et astérixis"><div class="lab">Technique</div><p>Évaluer attention, orientation, somnolence, céphalées matinales et médicaments sédatifs. Pour l’astérixis, demander d’étendre les bras, dorsifléchir les poignets et écarter les doigts : de brèves pertes de posture peuvent apparaître.</p><div class="lab">Piège</div><p>L’astérixis n’est pas spécifique de l’hypercapnie ; une encéphalopathie hépatique ou métabolique est également possible. Une somnolence nouvelle avec détresse respiratoire requiert une gazométrie et une prise en charge urgente.</p></template>
<template data-pop="j44-p-hippo" data-title="Hippocratisme digital"><div class="lab">Technique</div><p>Observer la convexité de l’ongle, la souplesse du lit unguéal et la disparition de la fenêtre de Schamroth lorsque les faces dorsales des deux doigts correspondants sont accolées.</p><div class="lab">Interprétation</div><p>Ce signe n’est pas expliqué par la BPCO isolée. Chez un fumeur, rechercher notamment cancer bronchique, bronchectasies et fibrose pulmonaire. Son absence ne permet d’exclure aucun de ces diagnostics.</p></template>
