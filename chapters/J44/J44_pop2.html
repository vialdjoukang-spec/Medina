<template data-pop="j44-d-lama" data-title="Antimuscariniques de longue durée">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs muscariniques M3 du muscle lisse ; réduction du tonus vagal ; bronchodilatation de 24 heures (tiotropium, uméclidinium, glycopyrronium) ou 12 heures (aclidinium).</p>
<div class="lab">Preuves</div><p>UPLIFT (2008, tiotropium contre placebo, 5 993 patients, 4 ans) : moins d’exacerbations, amélioration de la fonction et de la qualité de vie, pas d’effet sur le déclin du VEMS. POET-COPD (2011, 7 376 exacerbateurs, un an) : le tiotropium a retardé la première exacerbation modérée ou sévère par rapport au salmétérol (réduction du risque de 17 %).</p>
<div class="lab">Effets indésirables</div><p>Sécheresse buccale, rétention urinaire, glaucome à angle fermé (éviter la projection oculaire).</p></template>
<template data-pop="j44-d-laba" data-title="Bêta-2 agonistes de longue durée et double bronchodilatation">
<div class="lab">Mécanisme</div><p>Récepteur bêta-2, protéine Gs, AMPc : relâchement du muscle lisse ; 12 heures (formotérol, salmétérol) ou 24 heures (indacatérol, olodatérol, vilanterol).</p>
<div class="lab">Preuves</div><p>L’association AMLA + BALA améliore davantage la fonction et la dyspnée que chaque composant ; FLAME (2016, 3 362 patients ayant eu au moins une exacerbation dans l’année) : glycopyrronium-indacatérol supérieur à salmétérol-fluticasone sur les exacerbations (toutes exacerbations : − 11 % ; modérées ou sévères : − 17 %), avec moins de pneumonies (3,2 % contre 4,8 %).</p>
<div class="lab">Effets indésirables</div><p>Tremblement, tachycardie, hypokaliémie.</p></template>
<template data-pop="j44-d-triple" data-title="Trithérapie inhalée">
<div class="lab">Preuves</div><p>IMPACT (2018, 10 355 patients symptomatiques ayant eu des exacerbations ; fluticasone furoate-uméclidinium-vilanterol) : 25 % d’exacerbations modérées ou sévères en moins qu’avec uméclidinium-vilanterol, et, dans l’analyse finale de la mortalité (2020), rapport de risques de décès de 0,72 (intervalle de confiance à 95 % 0,53–0,99). ETHOS (2020, 8 509 patients atteints de BPCO modérée à très sévère avec au moins une exacerbation dans l’année ; budésonide-glycopyrronium-formotérol) : 24 % d’exacerbations en moins qu’avec glycopyrronium-formotérol ; réduction de la mortalité toutes causes (0,51 ; 0,33–0,80) seulement avec la dose de 320 µg de budésonide deux fois par jour, qui correspond à la posologie autorisée en Suisse. Pneumonies plus fréquentes sous corticostéroïde inhalé dans les deux essais.</p>
<div class="lab">Choix</div><p>Stratégie GOLD : éosinophiles ≥ 100/µL chez l’exacerbateur ; option initiale si ≥ 300/µL dans le groupe E. En Suisse, Trelegy Ellipta, Trixeo Aerosphere et Trimbow sont indiqués après une réponse insuffisante à CSI + BALA ou BALA + AMLA (Trelegy et Trimbow : avec au moins une exacerbation dans les 12 derniers mois) ; la limitation de remboursement de Trelegy exige en outre une réponse insuffisante après au moins trois mois de double traitement optimisé, dans l’une de deux situations : BPCO modérée après au moins une exacerbation, sous BALA + AMLA avec éosinophiles sanguins ≥ 100/µL ; ou BPCO modérée à sévère après au moins deux exacerbations modérées ou une exacerbation ayant entraîné une hospitalisation, sous CSI + BALA ou sous BALA + AMLA (dans ce dernier cas avec éosinophiles ≥ 100/µL). Elle admet aussi le patient déjà traité par ces trois classes en plusieurs inhalateurs. Consulter l’information professionnelle et le Compendium.</p>
<div class="lab">Risque</div><p>Pneumonies liées au corticostéroïde inhalé.</p></template>
<template data-pop="j44-d-sama" data-title="Bronchodilatateurs de courte durée">
<p>Salbutamol en aérosol-doseur, 100 µg par bouffée : 1 à 2 bouffées lors d’un bronchospasme aigu ; un besoin de plus de 2 bouffées 8 fois par jour doit être signalé au médecin (information suisse de Ventolin). Ipratropium : en Suisse, seulement en solution pour nébuliseur (Atrovent 250 µg/2 mL : 250 à 500 µg 3 à 4 fois par jour dans les obstructions sévères, au plus 2 mg par jour chez l’adulte) ou associé au salbutamol (nébulisation) ou au fénotérol (aérosol-doseur). L’association d’un BACA et d’un antimuscarinique de courte durée est plus efficace que chacun seul (GOLD 2026). En exacerbation hypercapnique, nébuliser avec de l’air et non de l’oxygène, et poursuivre l’oxygène par lunettes.</p>
<div class="lab">Contre-indications (information suisse)</div><p><b>Ventolin</b> (janvier 2026) : hypersensibilité à l’un des composants ; administration simultanée de bêtabloquants non sélectifs (par exemple le propranolol) ; les formes non parentérales ne doivent pas servir à prévenir un travail prématuré non compliqué ou une menace d’avortement ; Ventolin Diskus, poudre contenant du lactose : allergie sévère aux protéines du lait. <b>Atrovent</b> (octobre 2024) : hypersensibilité connue à l’atropine ou aux substances atropiniques, dont l’ipratropium, ou à l’un des composants de la préparation. L’hypersensibilité à l’atropine ou à ses dérivés contre-indique aussi le tiotropium (Spiriva, Spiriva Respimat).</p></template>
<template data-pop="j44-d-roflu" data-title="Roflumilast">
<div class="lab">Mécanisme</div><p>Inhibiteur de la phosphodiestérase 4 : augmente l’AMPc des cellules inflammatoires, réduit l’inflammation neutrophilique.</p>
<div class="lab">Indication</div><p>Information suisse : traitement concomitant au long cours de la BPCO sévère (VEMS après bronchodilatateur &lt; 50 %) chez l’adulte ayant des exacerbations fréquentes malgré des bronchodilatateurs inhalés de longue durée. GOLD 2026 le réserve au patient qui a une bronchite chronique et un antécédent d’exacerbation hospitalisée ou sévère ; le bénéfice est plus grand après une hospitalisation.</p>
<div class="lab">Effets indésirables</div><p>Diarrhée, nausées, perte de poids, insomnie, anxiété, dépression et idées suicidaires.</p>
<div class="lab">Contre-indications et précautions</div><p>Information suisse (janvier 2022) : contre-indiqué en cas d’hypersensibilité et d’insuffisance hépatique modérée à sévère (Child-Pugh B ou C) ; ne pas l’administrer pendant la grossesse ni l’allaitement, contraception fiable chez la femme en âge de procréer. Non recommandé en cas d’antécédent de comportement suicidaire lié à une dépression ou d’insuffisance cardiaque de classe NYHA 3 ou 4 ; ne pas le commencer en cas de maladie immunologique ou infectieuse sévère, de cancer ou de traitement immunosuppresseur. Surveiller le poids (arrêt si perte inexpliquée ou importante) et l’humeur ; carte patient à remettre.</p></template>
<template data-pop="j44-d-azi" data-title="Azithromycine au long cours dans la BPCO">
<p>Essai d’Albert (2011, 1 142 patients) : 250 mg par jour pendant un an réduisent les exacerbations (1,48 contre 1,83 par patient-année) ; baisse de l’audition plus fréquente (25 % contre 20 %). Analyse de sous-groupes (2014) : aucune réduction chez les fumeurs actifs, bénéfice plus net chez les patients âgés et de grade GOLD moins sévère ; GOLD 2026 le propose donc au non-fumeur. Aucune donnée au-delà d’un an. Précautions : ECG (QT), audition, exclusion d’une mycobactérie non tuberculeuse, résistances bactériennes.</p></template>
<template data-pop="j44-d-bio" data-title="Biothérapies dans la BPCO">
<p><b>Dupilumab</b> (anticorps contre la sous-unité alpha du récepteur de l’IL-4, qui bloque la signalisation de l’IL-4 et de l’IL-13 ; 300 mg par voie sous-cutanée toutes les deux semaines) : BOREAS (2023, 939 patients) et NOTUS (2024, 935 patients), VEMS après bronchodilatateur de 30 à 70 %, bronchite chronique, éosinophiles ≥ 300/µL, exacerbations sous trithérapie : exacerbations modérées ou sévères réduites de 30 % et de 34 % (rapports de taux 0,70 et 0,66), gain de VEMS de 83 et 62 mL. <b>Mépolizumab</b> (anti-IL-5 ; 100 mg par voie sous-cutanée toutes les 4 semaines) : MATINEE (2025, 804 patients), éosinophiles ≥ 300/µL à la sélection et ≥ 150/µL dans l’année précédente, sous trithérapie : exacerbations réduites de 21 % (rapport de taux 0,79), sans gain significatif de VEMS ni de qualité de vie. Introduits dans GOLD 2026. <b>Indications suisses</b> : le dupilumab est indiqué en traitement de fond additionnel chez l’adulte atteint de BPCO avec un taux élevé d’éosinophiles sanguins, non contrôlée par l’association CSI + BALA + AMLA ou par l’association BALA + AMLA seule si les CSI ne sont pas adaptés (information suisse de Dupixent, janvier 2025) ; le mépolizumab est indiqué en traitement complémentaire chez l’adulte atteint de BPCO avec un taux élevé d’éosinophiles sanguins, insuffisamment contrôlée par l’association CSI + BALA + AMLA ou, si un AMLA ou un BALA n’est pas indiqué, par l’association CSI + BALA ou CSI + AMLA (information suisse de Nucala, décembre 2025). Remboursement et prescription spécialisée selon la liste des spécialités.</p></template>
<template data-pop="j44-d-tabac" data-title="Sevrage tabagique">
<p><b>Substituts nicotiniques</b> : patch associé à une forme rapide (gomme, spray), doses adaptées à la dépendance. <b>Varénicline</b> : agoniste partiel des récepteurs nicotiniques, le plus efficace en monothérapie (abstinence plus fréquente qu’avec le placebo, le timbre nicotinique ou le bupropion dans EAGLES) ; nausées, rêves anormaux ; EAGLES (2016, 8 144 fumeurs avec ou sans trouble psychiatrique) n’a pas montré d’augmentation significative des événements neuropsychiatriques modérés ou sévères par rapport au placebo ou au timbre. Spécialités autorisées en Suisse depuis 2025. <b>Bupropion</b> : abaisse le seuil épileptogène. Toujours associer un accompagnement comportemental ; en Suisse, ligne stop-tabac et consultations spécialisées.</p></template>
<template data-pop="pareto-j44-clin" data-title="Pareto — Définition, mécanismes et clinique">
<p class="ratio" data-cover="j44-0,j44-1,j44-2,j44-3,j44-4,j44-5,j44-6"></p>
<ul><li>BPCO = symptômes chroniques + obstruction <b>persistante</b> : VEMS/CVF &lt; 0,70 après bronchodilatateur.</li>
<li>Grade GOLD par le VEMS (≥ 80, 50–79, 30–49, &lt; 30 %) ; traitement par groupe A (peu symptomatique), B (mMRC ≥ 2 ou CAT ≥ 10), E (<b>≥ 1 exacerbation modérée ou sévère</b>, GOLD 2026).</li>
<li>Mécanismes : inflammation neutrophilique, protéolyse (déficit fonctionnel ou génétique en alpha-1 antitrypsine), bronchiolite + emphysème, distension dynamique = cause de la dyspnée, hypoxie → hypertension pulmonaire.</li>
<li>Tabac (paquets-années), professions ; alpha-1 antitrypsine dosée une fois chez tous.</li>
<li>Symptômes : dyspnée (mMRC), toux, expectoration ; amaigrissement = chercher un cancer.</li>
<li>Examen : distension, Hoover, lèvres pincées, cœur pulmonaire ; hippocratisme = autre diagnostic.</li>
<li>Pronostic : arrêt du tabac et oxygène chez l’hypoxémique sévère réduisent la mortalité ; d’autres traitements apportent un bénéfice dans des populations sélectionnées, selon le critère étudié.</li></ul></template>
<template data-pop="pareto-j44-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j44-7"></p>
<ul><li>Recherche active de cas chez l’exposé symptomatique ; pas de dépistage de masse.</li>
<li>Spirométrie de qualité, en état stable, après bronchodilatateur (400 µg de salbutamol) : rapport &lt; 0,70 dans un contexte évocateur de BPCO (accord GOLD/GLI 2026) ; la limite inférieure de la normale aide dans une population plus large.</li>
<li>Caractériser : grade, groupe, éosinophiles, gaz du sang si saturation ≤ 92 %, alpha-1 antitrypsine, comorbidités.</li>
<li>Différentiels : insuffisance cardiaque, cancer, tuberculose, asthme, bronchectasies.</li></ul></template>
<template data-pop="pareto-j44-exa" data-title="Pareto — Exacerbation">
<p class="ratio" data-cover="j44-8"></p>
<ul><li>Aggravation &lt; 14 jours ; sévérité au lit du patient selon la classification de Rome (GOLD 2026) ; classification selon le traitement pour les essais et le groupe E.</li>
<li>Éliminer embolie, pneumonie, insuffisance cardiaque, pneumothorax.</li>
<li>Bronchodilatateurs courts ; oxygène cible <b>88–92 %</b> ; prednisone <b>40 mg × 5 jours</b> ; antibiotique si expectoration purulente avec un autre symptôme, culture positive antérieure ou ventilation (5 jours).</li>
<li><b>VNI si acidose respiratoire (pH ≤ 7,35 et PaCO₂ ≥ 45 mmHg)</b>, surtout si elle persiste après le traitement médical initial ; soins intensifs si échec.</li>
<li>Sortie : réévaluer le fond, réhabilitation dans les 4 semaines, contrôle rapproché.</li></ul></template>
<template data-pop="pareto-j44-tt" data-title="Pareto — Traitement de fond">
<p class="ratio" data-cover="j44-9"></p>
<ul><li>Pour tous : arrêt du tabac, vaccinations, activité, réhabilitation dès le groupe B, éducation.</li>
<li>A : un bronchodilatateur de longue durée. B : AMLA + BALA. E : AMLA + BALA ; trithérapie d’emblée si éosinophiles ≥ 300/µL (option GOLD ; vérifier l’indication et la limitation suisses de la spécialité).</li>
<li>Ne pas initier CSI + BALA seuls dans une BPCO isolée ; discuter au cas par cas la poursuite d'une association préexistante efficace et traiter tout asthme associé par un corticostéroïde inhalé.</li>
<li>Exacerbations sous AMLA + BALA : CSI si éosinophiles ≥ 100 ; sinon roflumilast (VEMS &lt; 50 %, bronchite chronique, exacerbation hospitalisée) ou azithromycine (non-fumeur). Sous trithérapie avec éosinophiles ≥ 300 : dupilumab ou mépolizumab.</li>
<li>Retrait du CSI si pneumonie sévère ou répétée, absence de réponse ou indication initiale inappropriée ; plus risqué si éosinophiles ≥ 300.</li></ul></template>
<template data-pop="pareto-j44-crit" data-title="Pareto — Stade avancé, suivi et critères">
<p class="ratio" data-cover="j44-10,j44-11,j44-12,j44-13"></p>
<ul><li>Oxygène plus de 15 h/jour si PaO₂ ≤ 55 mmHg (ou 55–60 avec hypertension pulmonaire, œdèmes d’insuffisance cardiaque ou hématocrite &gt; 55 %), confirmée à deux reprises sur trois semaines.</li>
<li>Après une exacerbation ventilée : réévaluer l’hypercapnie à 2–4 semaines ; si PaCO₂ &gt; 53 mmHg persiste, la VNI à domicile ajoutée à l’oxygène a retardé la réadmission ou le décès dans HOT-HMV, sans preuve isolée sur la mortalité ; GOLD 2026 retient ce seuil (niveau de preuve B).</li>
<li>Valves ou chirurgie de réduction de volume : emphysème supérieur hétérogène ; transplantation chez les sélectionnés.</li>
<li>Dyspnée réfractaire : opioïdes à faible dose ; directives anticipées.</li>
<li>Comorbidités : cœur (bêtabloquant cardiosélectif permis), cancer, ostéoporose, dépression, dénutrition, apnées.</li>
<li>Critères formels : symptômes ou exposition + VEMS/CVF &lt; 0,70 après bronchodilatateur.</li></ul></template>
<template data-pop="pareto-j44-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j44-e-1,j44-e-2,j44-e-3,j44-e-4,j44-e-5"></p>
<ul><li>Référence : spirométrie après bronchodilatateur ; courbe concave.</li>
<li>Distension : volumes pulmonaires à comparer aux limites de référence ; volume résiduel augmenté ; CVF basse ≠ restriction sans capacité pulmonaire totale ; diffusion du monoxyde de carbone souvent abaissée dans l’emphysème.</li>
<li>Gaz du sang : compensation aiguë +1, chronique +3,5 à 4 mmol/L par 10 mmHg de PaCO₂ ; acidose aiguë sur chronique = VNI.</li>
<li>Tomodensitométrie : type d’emphysème, bronchectasies, cancer, sélection interventionnelle.</li>
<li>Éosinophiles, alpha-1 antitrypsine (déficit sévère au-dessous du seuil protecteur de 0,5 g/L, soit 11 µmol/L ; Ferrarotti, Breathe 2018), polyglobulie.</li></ul></template>
<template data-pop="pareto-j44-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j44-p-1,j44-p-2,j44-p-3"></p>
<ul><li>Piliers : AMLA et BALA de longue durée, en association fixe ; trithérapie chez l’exacerbateur éosinophilique (IMPACT, ETHOS).</li>
<li>Roflumilast (VEMS &lt; 50 %, bronchite chronique ; attention humeur et poids) ; azithromycine (QT).</li>
<li>Biothérapies : dupilumab, mépolizumab si éosinophiles ≥ 300/µL sous trithérapie.</li>
<li>Dangers : oxygène non contrôlé et sédatifs chez l’hypercapnique ; CSI et pneumonie.</li>
<li>Jamais de corticostéroïde oral en entretien.</li></ul></template>
