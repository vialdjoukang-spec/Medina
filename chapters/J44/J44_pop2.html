<template data-pop="j44-d-lama" data-title="Antimuscariniques de longue durée">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs muscariniques M3 du muscle lisse ; réduction du tonus vagal ; bronchodilatation de 24 heures (tiotropium, uméclidinium, glycopyrronium) ou 12 heures (aclidinium).</p>
<div class="lab">Preuves</div><p>UPLIFT (2008, tiotropium contre placebo, 5 993 patients, 4 ans) : moins d’exacerbations, amélioration de la fonction et de la qualité de vie, pas d’effet sur le déclin du VEMS. POET-COPD (2011, 7 376 exacerbateurs, un an) : le tiotropium a retardé la première exacerbation modérée ou sévère par rapport au salmétérol (réduction du risque de 17 %).</p>
<div class="lab">Effets indésirables</div><p>Sécheresse buccale, rétention urinaire, glaucome à angle fermé (éviter la projection oculaire).</p></template>
<template data-pop="j44-d-laba" data-title="Bêta-2 agonistes de longue durée et double bronchodilatation">
<div class="lab">Mécanisme</div><p>Récepteur bêta-2, protéine Gs, AMPc : relâchement du muscle lisse ; 12 heures (formotérol, salmétérol) ou 24 heures (indacatérol, olodatérol, vilanterol).</p>
<div class="lab">Preuves</div><p>L’association AMLA + BALA améliore davantage la fonction et la dyspnée que chaque composant ; FLAME (2016, 3 362 patients ayant eu au moins une exacerbation dans l’année) : glycopyrronium-indacatérol supérieur à salmétérol-fluticasone sur les exacerbations (toutes exacerbations : − 11 % ; modérées ou sévères : − 17 %), avec moins de pneumonies (3,2 % contre 4,8 %).</p>
<div class="lab">Effets indésirables</div><p>Tremblement, tachycardie, hypokaliémie.</p></template>
<template data-pop="j44-d-triple" data-title="Trithérapie inhalée">
<div class="lab">Preuves</div><p>IMPACT (2018, 10 355 patients symptomatiques ayant eu des exacerbations ; fluticasone furoate-uméclidinium-vilanterol) : 25 % d’exacerbations modérées ou sévères en moins qu’avec uméclidinium-vilanterol, et, dans l’analyse finale de la mortalité (2020), rapport de risques de décès de 0,72 (intervalle de confiance à 95 % 0,53–0,99). ETHOS (2020, 8 509 patients atteints de BPCO modérée à très sévère avec au moins une exacerbation dans l’année ; budésonide-glycopyrronium-formotérol) : 24 % d’exacerbations en moins qu’avec glycopyrronium-formotérol ; réduction de la mortalité toutes causes (0,51 ; 0,33–0,80) seulement avec la dose de 320 µg de budésonide deux fois par jour, qui correspond à la posologie autorisée en Suisse. Pneumonies plus fréquentes sous corticostéroïde inhalé dans les deux essais.</p>
<div class="lab">Choix</div><p>Stratégie GOLD : éosinophiles ≥ 100/µL chez l’exacerbateur ; option initiale si ≥ 300/µL dans le groupe E. En Suisse, Trelegy Ellipta, Trixeo Aerosphere et Trimbow sont indiqués après une réponse insuffisante à CSI + BALA ou BALA + AMLA (Trelegy et Trimbow : avec au moins une exacerbation dans les 12 derniers mois) ; la limitation de remboursement de Trelegy exige en outre une réponse insuffisante après au moins trois mois de double traitement optimisé, dans l’une de deux situations : BPCO modérée après au moins une exacerbation, sous BALA + AMLA avec éosinophiles sanguins ≥ 100/µL ; ou BPCO modérée à sévère après au moins deux exacerbations modérées ou une exacerbation ayant entraîné une hospitalisation, sous CSI + BALA ou sous BALA + AMLA (dans ce dernier cas avec éosinophiles ≥ 100/µL). Elle admet aussi le patient déjà traité par ces trois classes en plusieurs inhalateurs. L’information professionnelle et le Compendium se consultent.</p>
<div class="lab">Risque</div><p>Pneumonies liées au corticostéroïde inhalé.</p></template>
<template data-pop="j44-d-sama" data-title="Bronchodilatateurs de courte durée">
<p>Salbutamol en aérosol-doseur, 100 µg par bouffée : 1 à 2 bouffées lors d’un bronchospasme aigu ; un besoin de plus de 2 bouffées 8 fois par jour doit être signalé au médecin (information suisse de Ventolin). Ipratropium : en Suisse, seulement en solution pour nébuliseur (Atrovent 250 µg/2 mL : 250 à 500 µg 3 à 4 fois par jour dans les obstructions sévères, au plus 2 mg par jour chez l’adulte) ou associé au salbutamol (nébulisation) ou au fénotérol (aérosol-doseur). L’association d’un BACA et d’un antimuscarinique de courte durée est plus efficace que chacun seul (GOLD 2026). En exacerbation hypercapnique, nébuliser avec de l’air et non de l’oxygène, et poursuivre l’oxygène par lunettes.</p>
<div class="lab">Contre-indications (information suisse)</div><p><b>Ventolin</b> (janvier 2026) : hypersensibilité à l’un des composants ; administration simultanée de bêtabloquants non sélectifs (par exemple le propranolol) ; les formes non parentérales ne doivent pas servir à empêcher des contractions précoces sans complication ou une menace d’avortement ; Ventolin Diskus, poudre contenant du lactose : allergie sévère aux protéines du lait. <b>Atrovent</b> (octobre 2024) : hypersensibilité connue à l’atropine ou aux substances atropiniques, dont l’ipratropium, ou à l’un des composants de la préparation. L’hypersensibilité à l’atropine ou à ses dérivés contre-indique aussi le tiotropium (Spiriva, Spiriva Respimat).</p></template>
<template data-pop="j44-d-roflu" data-title="Roflumilast">
<div class="lab">Mécanisme</div><p>Inhibiteur de la phosphodiestérase 4 : augmente l’AMPc des cellules inflammatoires, réduit l’inflammation neutrophilique.</p>
<div class="lab">Indication</div><p>Information suisse : traitement concomitant au long cours de la BPCO sévère (VEMS après bronchodilatateur &lt; 50 %) chez l’adulte ayant des exacerbations fréquentes malgré des bronchodilatateurs inhalés de longue durée. GOLD 2026 le réserve au patient qui a une bronchite chronique et un antécédent d’exacerbation hospitalisée ou sévère ; le bénéfice est plus grand après une hospitalisation.</p>
<div class="lab">Effets indésirables</div><p>Diarrhée, nausées, perte de poids, insomnie, anxiété, dépression et idées suicidaires.</p>
<div class="lab">Contre-indications et précautions</div><p>Information suisse (janvier 2022) : contre-indiqué en cas d’hypersensibilité et d’insuffisance hépatique modérée à sévère (Child-Pugh B ou C) ; ne pas l’administrer pendant la grossesse ni l’allaitement, contraception fiable chez la femme en âge de procréer. Non recommandé en cas d’antécédent de comportement suicidaire lié à une dépression ou d’insuffisance cardiaque de classe NYHA 3 ou 4 ; ne pas le commencer en cas de maladie immunologique ou infectieuse sévère, de cancer ou de traitement immunosuppresseur. Le poids (arrêt si perte inexpliquée ou importante) et l’humeur se surveillent ; carte patient à remettre.</p></template>
<template data-pop="j44-d-azi" data-title="Azithromycine au long cours dans la BPCO">
<p>Essai d’Albert (2011, 1 142 patients) : 250 mg par jour pendant un an réduisent les exacerbations (1,48 contre 1,83 par patient-année) ; baisse de l’audition plus fréquente (25 % contre 20 %). Analyse de sous-groupes (2014) : aucune réduction chez les fumeurs actifs, bénéfice plus net chez les patients âgés et de grade GOLD moins sévère ; GOLD 2026 le propose donc au non-fumeur. Aucune donnée au-delà d’un an. Précautions : ECG (QT), audition, exclusion d’une mycobactérie non tuberculeuse, résistances bactériennes.</p></template>
<template data-pop="j44-d-bio" data-title="Biothérapies dans la BPCO">
<p><b>Dupilumab</b> (anticorps contre la sous-unité alpha du récepteur de l’IL-4, qui bloque la signalisation de l’IL-4 et de l’IL-13 ; 300 mg par voie sous-cutanée toutes les deux semaines) : BOREAS (2023, 939 patients) et NOTUS (2024, 935 patients), VEMS après bronchodilatateur de 30 à 70 %, bronchite chronique, éosinophiles ≥ 300/µL, exacerbations sous trithérapie : exacerbations modérées ou sévères réduites de 30 % et de 34 % (rapports de taux 0,70 et 0,66), gain de VEMS de 83 et 62 mL. <b>Mépolizumab</b> (anti-IL-5 ; 100 mg par voie sous-cutanée toutes les 4 semaines) : MATINEE (2025, 804 patients), éosinophiles ≥ 300/µL à la sélection et ≥ 150/µL dans l’année précédente, sous trithérapie : exacerbations réduites de 21 % (rapport de taux 0,79), sans gain significatif de VEMS ni de qualité de vie. Introduits dans GOLD 2026. <b>Indications suisses</b> : le dupilumab est indiqué en traitement de fond additionnel chez l’adulte atteint de BPCO avec un taux élevé d’éosinophiles sanguins, non contrôlée par l’association CSI + BALA + AMLA ou par l’association BALA + AMLA seule si les CSI ne sont pas adaptés (information suisse de Dupixent, janvier 2025) ; le mépolizumab est indiqué en traitement complémentaire chez l’adulte atteint de BPCO avec un taux élevé d’éosinophiles sanguins, insuffisamment contrôlée par l’association CSI + BALA + AMLA ou, si un AMLA ou un BALA n’est pas indiqué, par l’association CSI + BALA ou CSI + AMLA (information suisse de Nucala, décembre 2025). Remboursement et prescription spécialisée selon la liste des spécialités.</p></template>
<template data-pop="j44-d-tabac" data-title="Sevrage tabagique">
<p><b>Substituts nicotiniques</b> : patch associé à une forme rapide (gomme, spray), doses adaptées à la dépendance. <b>Varénicline</b> : agoniste partiel des récepteurs nicotiniques, le plus efficace en monothérapie (abstinence plus fréquente qu’avec le placebo, le timbre nicotinique ou le bupropion dans EAGLES) ; nausées, rêves anormaux ; EAGLES (2016, 8 144 fumeurs avec ou sans trouble psychiatrique) n’a pas montré d’augmentation significative des événements neuropsychiatriques modérés ou sévères par rapport au placebo ou au timbre. Spécialités autorisées en Suisse depuis 2025. <b>Bupropion</b> : abaisse le seuil épileptogène. Toujours associer un accompagnement comportemental ; en Suisse, ligne stop-tabac et consultations spécialisées.</p></template>
<template data-pop="pareto-j44-clin" data-title="Pareto — Définition, mécanismes et clinique">
<p class="ratio" data-cover="j44-0,j44-1,j44-2,j44-3,j44-4,j44-5,j44-6"></p>
<ul><li>La BPCO associe des symptômes respiratoires chroniques ou une exposition à une obstruction persistante : le rapport VEMS/CVF est inférieur à 0,70 après bronchodilatateur. Sans spirométrie, le diagnostic reste une hypothèse.</li>
<li>La bronchite chronique est une définition clinique, l’emphysème une définition anatomique et la BPCO une définition fonctionnelle ; la bronchite chronique ne concerne que 27 à 35 % des patients atteints de BPCO.</li>
<li>Le VEMS après bronchodilatateur fixe le grade GOLD : 1 si ≥ 80 %, 2 de 50 à 79 %, 3 de 30 à 49 %, 4 au-dessous de 30 %. Le grade éclaire le pronostic, mais il ne choisit pas le traitement initial.</li>
<li>Le patient non traité est en groupe E dès une exacerbation modérée, traitée par corticostéroïde systémique ou antibiotique, ou sévère, hospitalisée. Sans exacerbation, il est en groupe B si l’échelle mMRC est ≥ 2 ou le CAT ≥ 10, et en groupe A sinon. L’ancien seuil du groupe E exigeait deux exacerbations modérées ou une hospitalisation.</li>
<li>GOLD 2026 vise une faible activité de la maladie : aucune exacerbation, aucune aggravation des symptômes, aucune perte accélérée de la fonction. La PRISm (rapport ≥ 0,70 et VEMS inférieur à 80 %) et la pré-BPCO ne sont pas des BPCO, mais des états à risque.</li>
<li>En Suisse, 2,0 % des personnes de 15 ans et plus déclarent une BPCO diagnostiquée, alors que l’obstruction mesurée atteint 8,0 % après 70 ans dans la cohorte SAPALDIA. Dans le monde, la BPCO touche 10,3 % des 30 à 79 ans et reste la troisième cause de décès, avec 3,4 millions de décès en 2023.</li>
<li>Environ 81 % des BPCO mesurées n’ont jamais été diagnostiquées : le médecin propose une spirométrie à toute personne exposée et symptomatique.</li>
<li>L’indice BODE combine l’indice de masse corporelle, l’obstruction, la dyspnée et la distance de marche ; chaque point augmente le risque de décès (rapport de risques 1,34). Après une hospitalisation pour exacerbation, la mortalité à cinq ans avoisine 50 %.</li>
<li>L’arrêt du tabac et l’oxygène chez l’hypoxémique sévère allongent la survie. La trithérapie chez l’exacerbateur, la ventilation à domicile réglée pour abaisser fortement la PaCO₂ et la réduction de volume sélectionnée le font dans des populations précises ; les données de mortalité de la réhabilitation restent peu concluantes.</li>
<li>Chez le sujet sain, les attaches alvéolaires et la rétraction élastique gardent ouvertes les bronchioles de moins de 2 mm. Dans la BPCO, une inflammation surtout neutrophilique, relativement résistante aux corticostéroïdes, épaissit leurs parois, et les protéases détruisent l’élastine ; un sous-groupe à éosinophiles répond mieux aux corticostéroïdes inhalés.</li>
<li>Le tabac inactive l’alpha-1 antitrypsine, principal inhibiteur de l’élastase, et le déficit génétique la supprime. La perte des petites voies aériennes précède l’emphysème et reste longtemps silencieuse.</li>
<li>La distension dynamique est le mécanisme principal de la dyspnée d’effort. Les bronchodilatateurs réduisent la distension, ce qui explique un gain de dyspnée supérieur au gain de VEMS.</li>
<li>Les inégalités ventilation-perfusion causent l’hypoxémie ; l’hypercapnie traduit une ventilation utile insuffisante. Chez l’hypercapnique, un excès d’oxygène élève la PaCO₂, d’où la cible de 88 à 92 % en exacerbation.</li>
<li>L’hypoxie chronique conduit à l’hypertension pulmonaire, légère chez 25 à 30 % des patients et sévère chez environ 5 %, puis au cœur pulmonaire chronique et à la polyglobulie. La dysfonction musculaire limite l’effort et se corrige par la réhabilitation.</li>
<li>Le tabac explique plus de 70 % des BPCO des pays à revenu élevé ; le risque croît avec les paquets-années. Le travail en explique 14 %, et 31 % chez les personnes n’ayant jamais fumé.</li>
<li>Environ la moitié des BPCO provient d’un pic de fonction trop bas, par prématurité, tabagisme maternel ou infections de l’enfance, et l’autre moitié d’un déclin accéléré. L’asthme, la tuberculose, le VIH et la pauvreté augmentent aussi le risque.</li>
<li>Le médecin dose une fois l’alpha-1 antitrypsine chez tout patient atteint de BPCO, même âgé et porteur d’un emphysème des sommets.</li>
<li>L’anamnèse chiffre le tabac, reconstitue la profession, l’enfance, l’histoire familiale et les exacerbations de l’année, et recherche l’insuffisance cardiaque, présente chez 20 à 30 % des patients, l’apnée du sommeil et la dépression.</li>
<li>La dyspnée d’effort est le symptôme le plus caractéristique, modérée à sévère chez plus de 40 % des patients de soins primaires. La toux en est souvent le premier signe, et la toux productive concerne jusqu’à 30 % des patients. Un amaigrissement, une hémoptysie ou une orthopnée font chercher une autre maladie.</li>
<li>L’échelle mMRC mesure la dyspnée, le CAT l’impact global, avec une différence minimale de 2 points. Une BPCO peut toucher un non-fumeur ou un adulte jeune ; une exacerbation inaugurale impose une spirométrie à distance.</li>
<li>L’examen n’est presque jamais diagnostique. Plus de 40 paquets-années (rapport de vraisemblance 8,3), une hauteur laryngée ≤ 4 cm (2,8) et un âge d’au moins 45 ans prédisent mieux l’obstruction que les sibilants. Le signe de Hoover est spécifique (86 %) mais peu sensible (58 %).</li>
<li>Une saturation ≤ 92 % impose des gaz du sang, et un indice de masse corporelle inférieur à 21 kg/m² aggrave le pronostic. La somnolence d’un patient dyspnéique signale un épuisement, et un hippocratisme digital impose de chercher une autre maladie, en premier lieu un cancer bronchique.</li></ul></template>
<template data-pop="pareto-j44-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j44-7"></p>
<ul><li>Le médecin recherche activement la BPCO chez les personnes exposées ou symptomatiques, par exemple en cas de dyspnée inexpliquée, de plus de 20 paquets-années ou d’infections basses répétées ; il ne dépiste pas les personnes asymptomatiques non exposées, et le débit de pointe ne suffit pas.</li>
<li>La spirométrie se fait en état stable, après 400 µg de salbutamol (mesure à 10–15 minutes) ou 160 µg d’ipratropium (mesure à 30–45 minutes) ; trois courbes satisfaisantes ne diffèrent pas de plus de 5 % ou de 150 mL.</li>
<li>Un rapport inférieur à 0,70 après bronchodilatateur confirme l’obstruction dans un contexte évocateur, selon la déclaration GOLD/GLI du 13 mars 2026. Le seuil fixe surdiagnostique le sujet âgé ; la limite inférieure de la normale aide chez le sujet jeune ; entre 0,60 et 0,80, la mesure se répète ; une spirométrie normale exclut la BPCO.</li>
<li>La spirométrie sépare trois situations : la BPCO, la spirométrie normale et la PRISm, qui n’est pas une BPCO.</li>
<li>La caractérisation associe le grade, le groupe, les éosinophiles (inférieurs à 100 ou ≥ 300/µL), la saturation, avec des gaz du sang si elle est ≤ 92 %, et un dosage unique de l’alpha-1 antitrypsine. Elle comprend aussi une radiographie pour écarter une autre cause, un électrocardiogramme et, si la dyspnée paraît disproportionnée, la diffusion du monoxyde de carbone ; la tomodensitométrie répond à quatre indications précises.</li>
<li>Les diagnostics à ne pas manquer sont le cancer bronchique, l’insuffisance cardiaque, que des peptides natriurétiques normaux rendent improbable, et la tuberculose. Viennent ensuite les bronchectasies, l’asthme, qui peut coexister et impose alors un corticostéroïde inhalé, la bronchiolite oblitérante et la panbronchiolite diffuse.</li></ul></template>
<template data-pop="pareto-j44-exa" data-title="Pareto — Exacerbation">
<p class="ratio" data-cover="j44-8"></p>
<ul><li>L’exacerbation est une aggravation aiguë de moins de 14 jours, le plus souvent déclenchée par un virus. Les symptômes durent 7 à 10 jours, et 20 % des patients n’ont pas récupéré à 8 semaines.</li>
<li>Selon la classification de Rome, trois critères sur cinq font une forme modérée : dyspnée ≥ 5 sur 10, fréquence respiratoire ≥ 24/min, fréquence cardiaque ≥ 95/min, saturation inférieure à 92 % ou baisse de plus de 3 %, CRP ≥ 10 mg/L. Une PaO₂ ≤ 60 mmHg ou une acidose hypercapnique font une forme sévère ; la classification selon le traitement sert aux essais et au groupe E.</li>
<li>Le médecin écarte une pneumonie, une insuffisance cardiaque, un syndrome coronarien, une arythmie, une embolie pulmonaire, présente chez jusqu’à 5,9 % des patients hospitalisés, et un pneumothorax, par une radiographie, un électrocardiogramme et une biologie.</li>
<li>Plus de 80 % des exacerbations se traitent à domicile. L’hospitalisation s’impose devant des signes d’insuffisance respiratoire, un échec du traitement initial, une comorbidité sérieuse ou un soutien insuffisant ; les soins intensifs, devant des gaz qui s’aggravent malgré la ventilation, une confusion, une léthargie, un coma ou une instabilité hémodynamique.</li>
<li>Le traitement associe un BACA avec ou sans antimuscarinique de courte durée, nébulisé à l’air chez l’hypercapnique, et 40 mg de prednisone pendant 5 jours, sans méthylxanthine. Un antibiotique est prescrit pendant 5 jours en cas d’expectoration purulente associée à un autre symptôme, de culture positive antérieure ou de ventilation ; l’hospitalisé reçoit une prévention thromboembolique.</li>
<li>L’oxygène vise 88 à 92 %, avec des gaz du sang contrôlés 30 à 60 minutes plus tard ; le haut débit nasal est le premier support de l’hypoxémie sans acidose.</li>
<li>Un pH ≤ 7,35 avec une PaCO₂ ≥ 45 mmHg indique la VNI, qui réussit dans 80 à 85 % des cas et se juge à 1–2 heures. La British Thoracic Society propose d’envisager l’intubation au-dessous d’un pH de 7,25, et aucun patient n’est refusé en soins intensifs par simple pessimisme.</li>
<li>Avant la sortie, le médecin ajuste le traitement de fond, avec une trithérapie si les éosinophiles sont élevés, vérifie la technique d’inhalation et prescrit une réhabilitation dans les 4 semaines. Il recherche une carence sévère en vitamine D et prévoit des consultations avant 4 semaines puis à 12–16 semaines, avec une spirométrie.</li></ul></template>
<template data-pop="pareto-j44-tt" data-title="Pareto — Traitement de fond">
<p class="ratio" data-cover="j44-9"></p>
<ul><li>Le traitement vise à soulager les symptômes et à réduire le risque futur ; GOLD 2026 ajoute l’objectif d’une faible activité de la maladie.</li>
<li>L’arrêt du tabac est la première prescription. Un conseil bref répété, associé à un traitement médicamenteux, porte l’abstinence à un an à 12,3 %, et la cigarette électronique n’a pas de preuve d’efficacité ni de sécurité.</li>
<li>Le patient reçoit chaque année le vaccin contre la grippe et, selon le stade, les vaccins contre la COVID-19, les pneumocoques et le zona. Contre le virus respiratoire syncytial, une dose est prévue dès 75 ans, de 65 à 74 ans en cas de GOLD 2, de 18 à 64 ans en cas de GOLD 3, et dès GOLD 1 si les exacerbations sont fréquentes.</li>
<li>La réhabilitation de 6 à 8 semaines s’adresse aux groupes B et E ; un plan d’action écrit, l’activité physique et la correction de la dénutrition complètent le traitement.</li>
<li>Plus des deux tiers des patients commettent une erreur d’inhalation. Le médecin choisit le dispositif avec le patient, fait démontrer la technique à chaque visite et ne change pas un dispositif efficace sans raison.</li>
<li>Le groupe A reçoit un bronchodilatateur, le groupe B une association AMLA + BALA, et le groupe E une association AMLA + BALA ; GOLD permet une trithérapie d’emblée si les éosinophiles sont ≥ 300/µL. En Suisse, la trithérapie fixe n’est indiquée qu’après une double association insuffisante, et sa limitation de remboursement doit être vérifiée.</li>
<li>L’association CSI + BALA n’est pas un traitement initial de la BPCO isolée, mais un asthme associé impose un CSI ; tout patient dispose d’un bronchodilatateur de courte durée.</li>
<li>Au suivi, le médecin vérifie d’abord la technique et l’adhésion. Une dyspnée persistante appelle la double bronchodilatation, un changement de dispositif, la réhabilitation et la recherche d’une autre cause.</li>
<li>Des exacerbations sous AMLA + BALA appellent un CSI si les éosinophiles sont ≥ 100/µL. Au-dessous, le médecin choisit le roflumilast, si le VEMS est inférieur à 50 % avec une bronchite chronique et une exacerbation hospitalisée, ou l’azithromycine chez le patient qui ne fume plus. Sous trithérapie, avec au moins 300 éosinophiles/µL, le dupilumab (bronchite chronique) ou le mépolizumab deviennent possibles.</li>
<li>Le CSI ne se retire qu’en cas d’indication inappropriée, d’absence de réponse, d’effets indésirables importants ou de pneumonie sévère ou répétée ; le retrait est plus risqué si les éosinophiles sont ≥ 300/µL.</li></ul></template>
<template data-pop="pareto-j44-crit" data-title="Pareto — Stade avancé, suivi et critères">
<p class="ratio" data-cover="j44-10,j44-11,j44-12,j44-13"></p>
<ul><li>L’oxygène de longue durée se prescrit plus de 15 heures par jour si la PaO₂ est ≤ 55 mmHg, ou de 55 à 60 mmHg avec hypertension pulmonaire, œdèmes ou hématocrite supérieur à 55 %, confirmée à deux reprises sur trois semaines en état stable. Il allonge la survie, mais n’apporte rien dans la désaturation modérée (LOTT).</li>
<li>Une PaCO₂ supérieure à 53 mmHg qui persiste 2 à 4 semaines après une exacerbation acidosique fait discuter la VNI à domicile. L’essai HOT-HMV a retardé la réadmission ou le décès, et un essai de 2014 a réduit la mortalité quand la ventilation abaissait fortement la PaCO₂.</li>
<li>Les valves endobronchiques s’adressent à un VEMS de 15 à 45 % avec distension et scissures intactes, au prix de 26,6 % de pneumothorax. La chirurgie de réduction de volume aide l’emphysème des lobes supérieurs avec une faible capacité d’effort, mais augmente la mortalité si le VEMS est ≤ 20 % avec un emphysème homogène ou une diffusion ≤ 20 %.</li>
<li>Le traitement substitutif en alpha-1 antitrypsine se discute chez le patient PiZZ qui ne fume pas, avec un VEMS de 35 à 60 %.</li>
<li>La dyspnée réfractaire se traite par des mesures combinées ; l’effet des opioïdes varie, et les benzodiazépines n’ont pas de bénéfice démontré. Les directives anticipées se discutent tôt, souvent après une première hospitalisation.</li>
<li>Chaque consultation mesure les symptômes et les exacerbations, contrôle la technique, l’adhésion et le tabagisme ; la spirométrie se répète au moins une fois par an, sans interrompre le traitement.</li>
<li>L’hypertension touche près de 50 % des patients, l’insuffisance cardiaque 20 à 30 % et la maladie coronarienne 10 à 20 %. Ces maladies se traitent selon leurs recommandations, bêtabloquant β1-sélectif compris, et le cancer bronchique se dépiste par tomodensitométrie annuelle à faible dose selon les critères de la population générale.</li>
<li>L’anxiété et la dépression se dépistent par deux questionnaires de deux questions, avec un seuil de 3. Le médecin recherche aussi les troubles cognitifs, qui touchent 32 % des patients, le diabète, l’ostéoporose, l’anémie, l’insuffisance rénale par le débit de filtration glomérulaire estimé, le reflux et l’apnée du sommeil, que la pression positive continue améliore.</li>
<li>Chez le sujet âgé, le seuil fixe surestime l’obstruction et le dispositif se choisit selon la force et la cognition. Le roflumilast est exclu pendant la grossesse et contre-indiqué dans l’insuffisance hépatique modérée ou sévère ; le tiotropium demande de la prudence si la clairance est ≤ 50 mL/min.</li>
<li>Avant une chirurgie, le patient arrête de fumer au moins 4 semaines, idéalement 8, et l’intervention est reportée en cas d’exacerbation.</li>
<li>Pour l’avion, une saturation supérieure à 95 % au repos et supérieure à 84 % au test de marche permet de voyager sans autre évaluation selon GOLD 2026. Selon la British Thoracic Society, une saturation de 92 à 95 % avec désaturation d’effort au-dessous de 84 % justifie 2 L/min d’oxygène en vol.</li>
<li>Le diagnostic formel exige des symptômes, des infections répétées ou une exposition, et un rapport VEMS/CVF inférieur à 0,70 après bronchodilatateur, mesuré en état stable ; une spirométrie normale exclut la BPCO. Le médecin recherche un asthme ou des bronchectasies associés et exclut les autres causes d’obstruction.</li>
<li>Les paramètres clés sont l’exacerbation unique du groupe E, les seuils d’éosinophiles de 100 et 300/µL, le pH ≤ 7,35 avec une PaCO₂ ≥ 45 mmHg pour la VNI, la PaO₂ ≤ 55 mmHg pour l’oxygène et la cible de saturation de 88 à 92 %.</li></ul></template>
<template data-pop="pareto-j44-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j44-e-1,j44-e-2,j44-e-3,j44-e-4,j44-e-5"></p>
<ul><li>Référence : spirométrie après bronchodilatateur ; courbe concave.</li>
<li>Distension : volumes pulmonaires à comparer aux limites de référence ; volume résiduel augmenté ; CVF basse ≠ restriction sans capacité pulmonaire totale ; diffusion du monoxyde de carbone souvent abaissée dans l’emphysème.</li>
<li>Gaz du sang : compensation aiguë +1, chronique +3,5 à 4 mmol/L par 10 mmHg de PaCO₂ ; acidose aiguë sur chronique = VNI.</li>
<li>Tomodensitométrie : type d’emphysème, bronchectasies, cancer, sélection interventionnelle.</li>
<li>Éosinophiles, alpha-1 antitrypsine (déficit sévère au-dessous du seuil protecteur de 0,5 g/L, soit 11 µmol/L ; Ferrarotti, Breathe 2018), polyglobulie.</li></ul></template>
<template data-pop="pareto-j44-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j44-p-1,j44-p-2,j44-p-3"></p>
<ul><li>Piliers : AMLA et BALA de longue durée, en association fixe ; trithérapie chez l’exacerbateur éosinophilique (IMPACT, ETHOS).</li>
<li>Roflumilast (VEMS &lt; 50 %, bronchite chronique ; attention humeur et poids) ; azithromycine (QT).</li>
<li>Biothérapies : dupilumab, mépolizumab si éosinophiles ≥ 300/µL sous trithérapie.</li>
<li>Dangers : oxygène non contrôlé et sédatifs chez l’hypercapnique ; CSI et pneumonie.</li>
<li>Jamais de corticostéroïde oral en entretien.</li></ul></template>
