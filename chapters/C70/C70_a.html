<h1>C70 — Tumeur maligne des méninges</h1>
<span class="status">Revue IA de l’auteur · Aucune validation médicale humaine attestée</span></div>
<div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div>
<div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="C70">
<section class="ilot" id="c70-0"><h2>Reconnaître une tumeur méningée, puis établir sa nature</h2>
<p>Une céphalée progressive, une première crise épileptique ou une faiblesse qui s’aggrave justifient la recherche d’une lésion intracrânienne. Une masse accolée à la dure-mère peut être un méningiome, mais cet aspect ne prouve ni son type exact ni son grade. La question clinique est double : existe-t-il une compression urgente, et quel diagnostic tissulaire déterminera le traitement ?</p>
<p>Cette leçon porte sur la <b>tumeur maligne des méninges</b>, principalement le méningiome de grade 3. Elle distingue aussi les tumeurs fibreuses solitaires malignes et les tumeurs mélanocytaires primitives, qui exigent d’autres analyses. La métastase durale ou leptoméningée est un diagnostic différentiel. Le raisonnement part des symptômes, de la localisation et de l’évolution ; le code administratif vient après la conclusion clinique.</p>
<div class="key"><b>À retenir.</b> Le danger immédiat dépend de l’effet de masse et du déficit ; le diagnostic définitif et le grade reposent sur le tissu et, lorsque indiqué, sur la biologie moléculaire.</div>
<p>Sources : <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r16">[réf.16]</button> · <button class="w" data-k="c70-r20">[réf.20]</button> · <button class="w" data-k="c70-r21">[réf.21]</button> · <button class="w" data-k="c70-r26">[réf.26]</button></p>
</section>
<section class="ilot" id="c70-1"><h2>Définition et classification du méningiome</h2>
<p>Le méningiome se développe à partir de cellules arachnoïdiennes des méninges. Il est habituellement extra-axial : il se trouve en dehors du parenchyme nerveux, qu’il peut comprimer. La plupart des méningiomes sont bénins ; une tumeur peut pourtant entraîner un handicap par sa seule localisation. Le grade 3 correspond à un comportement particulièrement agressif, avec croissance rapide, récidive précoce et possibilité de métastases systémiques.</p>
<table class="t"><thead><tr><th>Niveau</th><th>Ce qui le définit</th><th>Conséquence</th></tr></thead><tbody><tr><td>Grade 1</td><td>Absence de critères de grade supérieur dans une analyse adaptée</td><td>Souvent croissance lente ; surveillance possible dans certaines formes asymptomatiques.</td></tr><tr><td>Grade 2</td><td>Critères d’atypie, activité mitotique accrue ou invasion cérébrale selon OMS 2021</td><td>Risque de récidive supérieur ; traitement et surveillance renforcés.</td></tr><tr><td>Grade 3</td><td>Anaplasie franche, activité mitotique ≥12,5/mm², promoteur de TERT oncogène ou délétion homozygote CDKN2A/B</td><td>Résection maximale sûre puis radiothérapie fractionnée.</td></tr></tbody></table>
<p>Les aspects papillaire et rhabdoïde ne suffisent plus, à eux seuls, à attribuer un grade 3 dans la classification OMS 2021. Le diagnostic intègre les critères histologiques et moléculaires. Une morphologie peu atypique peut donc masquer un grade 3 moléculaire.</p>
<p><button class="w" data-k="c70-grading">OMS 2021 et cIMPACT-NOW 8 : distinguer les règles</button></p>
<div class="key"><b>À retenir.</b> Le grade biologique, le type tumoral et l’étendue de résection sont trois informations différentes. Aucun symptôme ni signe d’imagerie ne remplace leur analyse.</div>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button></p>
</section>
<section class="ilot" id="c70-2"><h2>Fréquence : préciser ce que les chiffres mesurent</h2>
<p>L’Inselspital rapporte que les méningiomes sont surtout diagnostiqués après 50 ans et répartit les grades approximativement en 70–80 % de grade 1, 15–25 % de grade 2 et 1–3 % de grade 3. Ces proportions de centre concernent l’ensemble des méningiomes ; elles ne constituent pas une incidence nationale de C70. Le CHUV souligne la fréquence supérieure chez les femmes et les personnes âgées, tous grades confondus.</p>
<p>Une étude du registre de Zurich publiée en 2025 décrit les tumeurs primitives du cerveau et du système nerveux central chez les personnes d’au moins 15 ans entre 1980 et 2021. Elle confirme une hausse des diagnostics bénins ou de comportement incertain et une incidence globale maligne plutôt stable. Son regroupement englobe plusieurs topographies et histologies : ses taux ne doivent pas être présentés comme ceux du méningiome malin.</p>
<p><b>Limite documentaire :</b> les sources consultées ne donnent pas d’incidence nationale suisse récente propre à C70 ou au grade 3 selon OMS 2021. Les fréquences de chaque symptôme, les sensibilités d’examen et un pronostic chiffré contemporain propre au grade 3 ne sont pas établis ici. Cette incertitude ne diminue pas l’urgence d’un déficit progressif.</p>
<div class="key"><b>À retenir.</b> Le grade 3 est rare parmi les méningiomes. Les chiffres de toutes les tumeurs du système nerveux central ne mesurent pas sa fréquence.</div>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r2">[réf.2]</button> · <button class="w" data-k="c70-r10">[réf.10]</button></p>
</section>
<section class="ilot" id="c70-3"><h2>Du tissu normal aux symptômes</h2>
<p>Les enveloppes méningées protègent le cerveau et la moelle. Une masse qui se développe à leur contact déplace d’abord les structures voisines ; ses conséquences varient selon la localisation et la réserve fonctionnelle. L’œdème vasogénique péritumoral ajoute du volume et peut aggraver un déficit sans que la masse tumorale elle-même ait augmenté dans les mêmes proportions.</p>
<table class="t"><thead><tr><th>Perturbation</th><th>Conséquence</th><th>Décision</th></tr></thead><tbody><tr><td>Compression du cortex ou des voies nerveuses</td><td>Parésie, trouble du langage, déficit sensitif ou visuel selon le territoire</td><td>Localiser cliniquement, puis confronter à l’imagerie.</td></tr><tr><td>Atteinte d’une région corticale</td><td>Crise épileptique pouvant révéler la lésion</td><td>Rechercher la lésion et traiter l’épilepsie lorsqu’elle est constituée.</td></tr><tr><td>Expansion et œdème</td><td>Céphalée, vomissements, signes d’hypertension intracrânienne</td><td>Évaluer rapidement la vigilance, les pupilles et l’imagerie.</td></tr><tr><td>Obstacle à l’écoulement du liquide cérébrospinal</td><td>Hydrocéphalie et risque d’engagement</td><td>Avis neurochirurgical urgent ; pas de ponction lombaire si hydrocéphalie obstructive.</td></tr><tr><td>Compression médullaire</td><td>Syndrome lésionnel et sous-lésionnel, troubles de la marche</td><td>Imagerie et prise en charge spécialisée urgentes.</td></tr></tbody></table>
<p>Les altérations moléculaires expliquent le comportement biologique, sans fournir une carte des symptômes. La perte de NF2 affecte la merline et la régulation de croissance ; TERT et la délétion homozygote de CDKN2A/B identifient un haut risque. Elles orientent le grade et le pronostic, tandis que l’examen clinique localise les conséquences de la tumeur.</p>

</section>
<section class="ilot" id="c70-4"><h2>Causes et facteurs de risque</h2>
<p>Une irradiation ionisante antérieure de la tête et une prédisposition génétique, notamment la schwannomatose liée à NF2, augmentent le risque de méningiome. Un antécédent de radiothérapie, des tumeurs multiples, un début jeune ou une histoire familiale doivent être signalés. Ces éléments augmentent un risque général ; ils ne permettent pas de prédire le grade d’une tumeur individuelle.</p>
<p>La revue du traitement hormonal fait partie de l’anamnèse. La FI suisse d’Androcur-50 rapporte des méningiomes après une utilisation prolongée de cyprotérone à des doses ≥25 mg/j, avec un risque croissant selon l’exposition cumulée. Une présence ou un antécédent de méningiome constitue une contre-indication ; au diagnostic, le traitement doit être arrêté définitivement sous coordination du prescripteur.</p>
<p><button class="w" data-k="c70-hormones">Signal hormonal : attribuer le texte à sa juridiction</button></p>
<div class="key"><b>À retenir.</b> Une association hormonale ne démontre pas un grade malin. Consigner le nom du produit, la dose, la durée et l’exposition passée.</div>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button> · <button class="w" data-k="c70-r15">[réf.15]</button> · <button class="w" data-k="c70-r25">[réf.25]</button></p>
</section>
<section class="ilot" id="c70-5"><h2>Anamnèse : caractériser l’évolution</h2>
<p>Demander au patient et à ses proches ce qui a changé, depuis quand et à quelle vitesse. Une aggravation progressive, une récidive après traitement ou une croissance rapide sur des images comparatives modifient le niveau de suspicion. Rechercher des crises focales, leur généralisation éventuelle, les troubles visuels, l’odorat, le langage, l’audition, la marche et les changements cognitifs ou comportementaux.</p>
<table class="t"><thead><tr><th>Question ciblée</th><th>Ce qu’elle apporte</th></tr></thead><tbody><tr><td>Céphalée nouvelle, aggravation matinale, vomissements ?</td><td>Recherche d’un syndrome d’hypertension intracrânienne ; la céphalée seule reste peu spécifique.</td></tr><tr><td>Faiblesse, trouble du langage, de la sensibilité ou de la vision ?</td><td>Localisation probable de la structure atteinte et retentissement fonctionnel.</td></tr><tr><td>Douleur rachidienne ou radiculaire, gêne à la marche, trouble urinaire ?</td><td>Recherche d’une compression médullaire ou d’une atteinte méningée diffuse.</td></tr><tr><td>Oubli, ralentissement, changement de comportement selon l’entourage ?</td><td>Une plainte cognitive peut être minimisée par le patient ; elle influe sur la décision thérapeutique.</td></tr><tr><td>Cancer connu, irradiation, chirurgie et histologie antérieures ?</td><td>Métastase, récidive et tumeur radio-induite ne suivent pas le même raisonnement.</td></tr><tr><td>Progestatif, antiépileptique, corticoïde ou autre traitement ?</td><td>Repérage des facteurs de risque, des effets indésirables et des interactions.</td></tr></tbody></table>
<p>Documenter l’autonomie, les activités quotidiennes et les objectifs du patient. Les difficultés de mémoire, d’attention et des fonctions exécutives peuvent précéder ou suivre le traitement. Une amélioration du volume tumoral ne garantit pas une récupération cognitive complète.</p>
<p>Sources : <button class="w" data-k="c70-r1">[réf.1]</button> · <button class="w" data-k="c70-r2">[réf.2]</button> · <button class="w" data-k="c70-r3">[réf.3]</button> · <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r18">[réf.18]</button> · <button class="w" data-k="c70-r19">[réf.19]</button></p>
</section>
<section class="ilot" id="c70-6"><h2>Examen clinique : localiser et mesurer le retentissement</h2>
<p>L’examen neurologique explore la vigilance, la cognition et le langage, puis la vision, l’audition, les mouvements, les réflexes, la sensibilité, l’équilibre et la coordination. Le CHUV place cette étape avant l’imagerie : chaque anomalie suggère la région à examiner, sans identifier à elle seule la nature tumorale.</p>
<p>Comparer les deux côtés, relever les capacités présentes et les difficultés concrètes, puis conserver une description reproductible pour le suivi. Rechercher une anomalie pupillaire, un œdème papillaire et une baisse de vigilance lorsqu’une hypertension intracrânienne est possible. Un trouble visuel évolutif impose une documentation adaptée et une confrontation à la localisation.</p>
<p>Dans la forme rachidienne, chercher une douleur radiculaire au niveau de la lésion, un niveau sensitif et des signes moteurs ou sensitifs sous-jacents. Une compression aiguë peut commencer par une paralysie flasque ; l’absence initiale d’hypertonie ne rassure pas. Les troubles sphinctériens peuvent être tardifs : attendre leur apparition expose à retarder le diagnostic.</p>
<div class="key"><b>À retenir.</b> L’examen normal n’exclut pas une tumeur méningée. Un examen anormal localise un retentissement ; le tissu détermine le type et le grade.</div>
