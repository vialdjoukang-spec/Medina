<template data-pop="c70-r14" data-title="FI suisse Lévétiracétam Sandoz oral, avril 2023, autorisation 62088"><h3>Référence 14. FI suisse Lévétiracétam Sandoz oral, avril 2023, autorisation 62088</h3><p>Chez l’adulte âgé d’au moins 18 ans et de plus de 40 kg : dose initiale de 500 mg deux fois/j, alternative de 250 mg deux fois/j selon tolérance ; maximum de 1500 mg deux fois/j. Le tableau rénal a sa population distincte ≥16 ans et&gt;50 kg. Surveillance comportement, peau et grossesse.</p><p><b>Passage :</b> Indications ; posologies adultes ; tableau rénal et formule ; hépatique ; comportement, somnolence, grossesse ; élimination. <b>Population :</b> Épilepsie focale : monothérapie dès16 ans. Schéma initial présenté pour adulte ≥18 ans et&gt;40 kg ; tableau rénal pour adulte/adolescent ≥16 ans et&gt;50 kg.. <b>Limites :</b> FI orale, pas charge IV d’état de mal ; appendice SwissPedDose séparé exclu. Limites pondérales varient selon tableau et sont conservées. Pas prophylaxie tumorale automatique.</p><p>Source consultée le 2026-11-02 ; lecture ciblée des passages indiqués.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=62088" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic/AIPS via AmiKo, Sandoz</a></p></template>
