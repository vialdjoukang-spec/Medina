<template data-pop="c70-grading" data-title="OMS 2021 et cIMPACT-NOW 8 : distinguer les règles"><h3>OMS 2021 et cIMPACT-NOW 8 : distinguer les règles</h3>
<p>Les mutations oncogènes du promoteur de TERT et la délétion homozygote de CDKN2A/B sont des critères officiels de grade 3 dans OMS 2021. Une délétion hémizygote de CDKN2A/B ne suffit pas.</p>
<p>cIMPACT-NOW update 8, publié en 2024 avec collection 2025, apporte une guidance intérimaire non officielle OMS. Il propose notamment un grade au moins 2 pour certaines tumeurs avec perte de 1p associée à une perte de 22q et/ou une altération oncogène de NF2. Sa proposition concernant l’invasion cérébrale isolée et les marqueurs moléculaires n’efface pas la règle OMS 2021. Le rapport anatomopathologique doit préciser le référentiel utilisé.</p>
<p>Ces propositions reposent principalement sur les méningiomes sporadiques adultes ; elles ne s’extrapolent pas directement à l’enfant, aux tumeurs radio-induites ou associées à une schwannomatose liée à NF2.</p>
<p>Sources : <button class="w" data-k="c70-r7">[réf.7]</button> · <button class="w" data-k="c70-r8">[réf.8]</button></p>
</template>
<template data-pop="pareto-c70-mecanisme" data-title="Mécanismes"><h3>Mécanismes</h3>
<p>Compression et œdème produisent les déficits ; obstruction du liquide produit l’hydrocéphalie ; les marqueurs moléculaires établissent un risque biologique sans localiser les signes.</p>
</template>
<template data-pop="c70-hormones" data-title="Signal hormonal : attribuer le texte à sa juridiction"><h3>Signal hormonal : attribuer le texte à sa juridiction</h3>
<p>La FI suisse Androcur-50, juin 2022, constitue la référence locale pour ce produit. Les associations concernent les méningiomes en général, sans preuve propre au grade 3.</p>
<p>Le PRAC de l’EMA a adopté en juillet 2026 une recommandation de modification du libellé pour désogestrel/étonogestrel. Une étude cas-témoins de méningiomes intracrâniens opérés rapporte un odds ratio de 1,3 après un usage actuel ≥1 an de désogestrel 75 µg et de 2,1 à partir de 7 ans. Un odds ratio ne mesure pas une incidence annuelle. Ce texte européen ne prouve pas sa transposition dans chaque FI suisse ; vérifier le produit exact et organiser une alternative contraceptive avec le prescripteur.</p>
<p>Sources : <button class="w" data-k="c70-r15">[réf.15]</button> · <button class="w" data-k="c70-r25">[réf.25]</button></p>
</template>
<template data-pop="pareto-c70-clinique" data-title="Anamnèse et examen"><h3>Anamnèse et examen</h3>
<p>Préciser le temps, localiser le déficit et rechercher une urgence. Interroger les proches sur cognition et comportement ; ne pas attendre les troubles sphinctériens devant une compression possible.</p>
</template>
<template data-pop="c70-radiotherapie" data-title="Irradiation : recommandation et pratiques suisses"><h3>Irradiation : recommandation et pratiques suisses</h3>
<p>L’EANO 2021 recommande une irradiation fractionnée après résection du grade 3. L’enquête de dix centres suisses publiée en 2022, avec arbres de décision validés en 2020, trouve un accord de tous les centres pour l’indication postopératoire du grade III. Un schéma de 60 Gy en 30 fractions de 2 Gy y est fréquent. Il s’agit de pratiques déclarées, pas d’un essai comparatif ni d’une directive nationale actuelle.</p>
<p>Le plan individuel dépend du résidu, de la localisation, des organes à risque et d’une irradiation antérieure. Les doses ne se déduisent pas du code C70. Une ligne de l’enquête associe 59,4 Gy et 30×1,8 Gy de manière incohérente ; elle n’est pas reprise comme consigne.</p>
<p>Au PSI, les méningiomes atypiques ou malins peuvent être évalués pour protonthérapie, notamment lorsque des doses élevées doivent épargner des structures sensibles. La protonthérapie n’est pas automatiquement supérieure pour chaque patient ; la sélection et la prise en charge suivent le processus du centre.</p>
<p>Sources : <button class="w" data-k="c70-r5">[réf.5]</button> · <button class="w" data-k="c70-r6">[réf.6]</button> · <button class="w" data-k="c70-r7">[réf.7]</button></p>
</template>
<template data-pop="pareto-c70-traitement" data-title="Traitement"><h3>Traitement</h3>
<p>Grade 3 : résection maximale sûre et irradiation fractionnée. À la récidive, réévaluer les possibilités locales ; recours moléculaires et radioligands restent expérimentaux.</p>
</template>
<template data-pop="pareto-c70-federal" data-title="Raisonnement fédéral"><h3>Raisonnement fédéral</h3>
<p>D’abord reconnaître une urgence et localiser ; ensuite distinguer méningiome, métastase et autres tumeurs méningées ; enfin obtenir le diagnostic intégré et proposer le contrôle local en centre expert.</p>
</template>
<template data-pop="c70-mitoses" data-title="Compter les mitoses : surface et calcul"><h3>Compter les mitoses : surface et calcul</h3>
<p>Le comptage s’effectue dans la région la plus proliférative sur des coupes de bonne qualité. Dix champs de 0,16 mm² représentent 1,6 mm². Avec 20 mitoses dans cette surface :20÷ 1,6=12,5 mitoses/mm², seuil de grade 3. Quatre mitoses sur 1,6 mm² correspondent à 2,5/mm², seuil mitotique du grade 2.</p>
<p>La surface réelle d’un champ dépend du microscope ; les appareils récents peuvent avoir des champs de 0,23–0,24 mm². Le nombre de champs doit être ajusté. Une extrapolation à partir d’une surface inférieure à 1,6 mm² ne convient pas pour attribuer le grade.</p>
<p>Sources : <button class="w" data-k="c70-r8">[réf.8]</button></p>
</template>
<template data-pop="c70-dexamethasone" data-title="Dexaméthasone Galepharm comprimés : indication, dose et surveillance"><h3>Dexaméthasone Galepharm comprimés : indication, dose et surveillance</h3>
<p>FI suisse, janvier 2022 : comprimés sécables à 1 mg ou 4 mg de dexaméthasone. L’œdème cérébral lié à une tumeur est une indication. Après amélioration d’un tableau sévère traité initialement par voie intraveineuse, la FI décrit un relais oral de 4–16 mg/j ; dans des tableaux plus légers,2–8 mg/j peuvent suffire. La dose est adaptée à l’état et à sa réponse ; elle peut être fractionnée en 2–4 prises pour l’œdème.</p>
<p>Prendre après les repas avec du liquide, sans croquer. Réduire progressivement dès que possible. Il n’existe pas de durée universelle pour tout méningiome ; une durée ou un maximum issus d’une autre indication ne doivent pas être importés. Le schéma de diminution est prescrit selon la durée, la dose et le contrôle clinique.</p>
<p>Surveiller notamment glycémie, pression artérielle, signes infectieux, état psychique, potassium et effets musculaires selon terrain et durée. Risques de mycose ou infection latente, diabète mal équilibré, ulcère, ostéoporose ou maladie psychiatrique appellent une évaluation spécifique. Les inhibiteurs ou inducteurs du CYP3A4 et les anti-inflammatoires non stéroïdiens peuvent modifier le risque ; vérifier l’ensemble de la prescription.</p>
<p>Sources : <button class="w" data-k="c70-r12">[réf.12]</button></p>
</template>
<template data-pop="c70-dexa-iv" data-title="Galepharm Amp : vérifier la prescription et le relais"><h3>Galepharm Amp : vérifier la prescription et le relais</h3>
<p>Une ampoule Galepharm Amp 4 mg/1 ml contient 4 mg de phosphate correspondant à 3,32 mg de dexaméthasone ; celle de 8 mg/2 ml correspond à 6,64 mg de base. Ne pas convertir silencieusement vers les comprimés.</p>
<p>FI suisse, juin 2022. Pour les œdèmes subaigus ou chroniques, notamment tumoraux, la rubrique posologie décrit 8–12 mg IV initialement puis 4 mg IV ou IM toutes les 6 heures. Ces valeurs sont rapportées telles qu’elles apparaissent dans la FI du produit phosphaté. La prescription doit préciser produit, forme, unité et quantité ; le relais oral demande une vérification de l’expression phosphate/base par l’équipe et la pharmacie.</p>
<p>La dose élevée décrite dans la FI pour d’autres œdèmes cérébraux aigus n’est pas transposée ici au méningiome. L’administration parentérale est réservée aux situations où elle est nécessaire. L’effet maximal peut demander 1–2 heures ; une situation vitale nécessite des mesures immédiates complémentaires. Dès contrôle de la phase aiguë, réduire et organiser le relais selon évolution.</p>
<p>Aucune conversion silencieuse en nombre de comprimés ou d’ampoules n’est fournie. L’absence d’un schéma universel de durée reflète la nécessité d’une prescription individualisée, et non une invitation à poursuivre sans réévaluation.</p>
<p>Sources : <button class="w" data-k="c70-r13">[réf.13]</button> · <button class="w" data-k="c70-r12">[réf.12]</button></p>
</template>
<template data-pop="c70-levetiracetam" data-title="Lévétiracétam Sandoz oral : produit exact et limites"><h3>Lévétiracétam Sandoz oral : produit exact et limites</h3>
<p>FI suisse, avril 2023, autorisation 62088 : comprimés 250/500/1000 mg et solution 100 mg/ml. Monothérapie des crises focales avec ou sans généralisation secondaire à partir de 16 ans ; les indications en association et limites d’âge sont distinctes. Le schéma adulte n’est pas transposé automatiquement à l’enfant.</p>
<p>Chez l’adulte âgé d’au moins 18 ans et pesant plus de 40 kg, la dose initiale décrite est 500 mg deux fois par jour. Une dose initiale de 250 mg deux fois par jour peut être choisie selon tolérance/efficacité, puis augmentée à 500 mg deux fois par jour après deux semaines. Maximum décrit 1500 mg deux fois par jour ; paliers de 250 ou 500 mg deux fois par jour toutes les 2–4 semaines selon réponse. Il s’agit d’un traitement oral d’entretien, pas d’un traitement d’urgence d’un état de mal.</p>
<p>Les risques fréquents incluent somnolence, fatigue et étourdissements ; surveiller les modifications de comportement, l’agressivité, la dépression et les idées suicidaires. La conduite et les machines demandent une évaluation individuelle, surtout au début et après augmentation. Ne pas arrêter soudainement. Grossesse : conseil spécialisé, surveillance et réévaluation, sans arrêt brutal.</p>
<p>Sources : <button class="w" data-k="c70-r14">[réf.14]</button></p>
</template>
<template data-pop="c70-clairance" data-title="Méthode de clairance dans la FI"><h3>Méthode de clairance dans la FI</h3>
<p>La FI estime la clairance en ml/min par la formule :[(140−âge en années)×poids en kg]/[72×créatinine sérique en mg/dl], avec un facteur 0,85 pour la femme. Puis clairance indexée=clairance absolue÷surface corporelle en m²×1,73. Les unités doivent être respectées ; une créatinine en µmol/l ne peut pas être insérée telle quelle dans cette formule. La méthode ne remplace pas un avis adapté aux situations où l’estimation est peu fiable.</p>
<p>Sources : <button class="w" data-k="c70-r14">[réf.14]</button></p>
</template>
<template data-pop="pareto-c70-pharmaco" data-title="Pharmacologie"><h3>Pharmacologie</h3>
<p>Vérifier l’objectif, le produit, la forme et la fonction rénale. Éviter prophylaxie primaire systématique et équivalence implicite phosphate/base ; aucun traitement systémique du méningiome n’est présenté comme standard.</p>
</template>
