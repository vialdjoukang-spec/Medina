<template data-pop="e41-remplissage" data-title="Pourquoi remplir prudemment l’enfant malnutri"><h3>Les faits</h3><p>Les remplissages agressifs sont nocifs chez l’enfant atteint de malnutrition aiguë sévère. Les données reposent sur deux petits essais seulement (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). La revue de l’OMS de 2016 prévoit, en cas de choc, du Ringer lactate ou de la solution de Darrow demi-concentrée avec glucose à 5 %, avec une surveillance toutes les 5 à 10 minutes pour dépister une surcharge (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><h3>Raisonnement</h3><p>Le débit cardiaque est réduit et le myocarde aminci (îlot 5) : un grand volume rapide expose à l’insuffisance cardiaque. La filtration prérénale est diminuée par la déshydratation, ce qui est aussi un argument pour réhydrater lentement. Ces deux liens sont un raisonnement du cours.</p><h3>Transfusion</h3><p>Une transfusion de 10 ml/kg est prévue en l’absence d’amélioration après 1 heure ou en cas d’anémie sévère, et jamais au-delà de 24 heures (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><h3>Limite</h3><p>Les volumes de choc ne sont pas dans les sources lues. La ligne directrice de 2023 n’a pas été lue : elle prévaut sur cette revue de 2016 si elle diffère.</p></template>
<template data-pop="e41-glucose-conduite" data-title="Hypoglycémie de l’enfant : le choix de la voie"><h3>Deux situations</h3><table class="t"><tr><th>État de l’enfant</th><th>Conduite selon la revue de l’OMS 2016</th></tr><tr><td>Conscient</td><td>50 ml de glucose à 10 % par la bouche ou par sonde, puis F-75 toutes les 30 minutes pendant 2 heures</td></tr><tr><td>Inconscient, léthargique ou convulsant</td><td>Glucose à 10 % par voie intraveineuse, 5 ml/kg, puis 50 ml de glucose à 10 % par voie orale ou par sonde</td></tr></table><p>Source : <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>.</p><h3>Raisonnement</h3><p>La voie dépend de la capacité à avaler en sécurité. Chez l’enfant inconscient, une prise orale expose à l’inhalation (raisonnement du cours) ; la voie intraveineuse corrige vite la glycémie, et le relais oral et le F-75 maintiennent l’apport.</p><h3>Calcul</h3><p>5 ml/kg de glucose à 10 % représentent 0,5 g/kg de glucose (calcul du cours). Pour un enfant de 8 kg : 40 ml, soit 4 g de glucose.</p><h3>Limite</h3><p>Le seuil de glycémie qui définit l’hypoglycémie dans la ligne directrice de l’OMS n’a pas été lu.</p></template>
<template data-pop="e41-resomal" data-title="ReSoMal : la solution de réhydratation spéciale"><h3>Définition</h3><p>ReSoMal (solution de réhydratation pour la malnutrition) est une solution de réhydratation orale adaptée à l’enfant malnutri. Elle est utilisée en cas de déshydratation légère à modérée ; en cas de choléra suspecté, on utilise la solution de réhydratation orale standard à basse osmolarité (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><h3>Schéma</h3><p>5 ml/kg toutes les 30 minutes pendant 2 heures (soit 20 ml/kg), puis 5 à 10 ml/kg/heure en alternance avec le F-75 jusqu’à 10 heures (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Exemple chiffré</h3><p>Un enfant de 8 kg reçoit 40 ml toutes les 30 minutes pendant 2 heures, soit 160 ml au total (calcul du cours).</p><h3>Limite</h3><p>La composition exacte de la solution (en particulier la teneur en sodium) n’est pas décrite dans les sources lues. Aucune information professionnelle suisse n’est disponible pour ce produit dans le dossier.</p></template>
<template data-pop="e41-antibiotiques" data-title="Antibiotiques : schéma de l’OMS contre information professionnelle suisse"><h3>Le désaccord</h3><table class="t"><tr><th>Source</th><th>Date</th><th>Dose d’amoxicilline orale chez l’enfant</th></tr><tr><td>Schéma décrit par Dipasquale (forme non compliquée)</td><td>2020</td><td>15 mg/kg toutes les 8 heures pendant 5 jours, soit 45 mg/kg/jour</td></tr><tr><td>Information professionnelle suisse, enfant de 40 kg ou moins</td><td>Août 2024</td><td>50 à 100 mg/kg/jour en 3 ou 4 prises, dose unitaire maximale 50 mg/kg</td></tr></table><p>Sources : <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">Amoxicilline Spirig HC® 2024</a>.</p><h3>Arbitrage selon la règle du cours</h3><p>La source primaire applicable la plus récente l’emporte. Pour un prescripteur suisse, l’information professionnelle d’août 2024 est le texte autorisé en vigueur ; elle ne mentionne pas la malnutrition comme indication, l’usage reste donc à motiver. Le schéma de l’OMS (45 mg/kg/jour) est inférieur à l’intervalle suisse. La ligne directrice de l’OMS de 2023, plus récente que la revue de 2016, n’a pas été lue : elle pourrait trancher et reste à consulter.</p><h3>Efficacité</h3><p>Au Malawi, l’amoxicilline est associée à une mortalité réduite de 36 % et le cefdinir de 44 % par rapport au placebo ; au Niger, la mortalité n’est pas modifiée, mais la guérison est plus rapide (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Ces essais ont eu lieu en Afrique subsaharienne : leur transposition à la Suisse n’est pas démontrée.</p><h3>Forme compliquée</h3><p>Ampicilline par voie intraveineuse ou intramusculaire, puis amoxicilline avec gentamicine ; ceftriaxone si l’amélioration manque à 48 heures (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Les informations professionnelles de ces produits n’ont pas été lues.</p></template>
<template data-pop="e41-micro" data-title="Micronutriments et report du fer"><h3>Ce qui est recommandé</h3><p>Vitamine A, zinc en cas de diarrhée, cuivre, acide folique, magnésium et potassium sont donnés pendant au moins 2 semaines. Le fer est différé (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>). Chez l’adulte, le consensus suisse prévoit aussi l’absence de fer la première semaine, des multivitamines pendant 10 jours (vitamines à 200 %, oligoéléments à 100 % des apports recommandés) (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber 2019</a>).</p><h3>Pourquoi différer le fer</h3><p>Les sources lues donnent la règle sans en détailler la raison. Les sources lues ne donnent pas la raison de ce report ; le cours ne la spécule pas.</p><h3>Piège</h3><p>Prescrire du fer devant une anémie découverte au bilan d’admission : la règle impose d’attendre.</p></template>
<template data-pop="e41-f75" data-title="F-75 : composition, volumes, calcul"><h3>Composition</h3><p>Le F-75 contient 75 kcal et 0,9 g de protéines pour 100 ml (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Calculs</h3><table class="t"><tr><th>Grandeur</th><th>Calcul</th><th>Résultat</th></tr><tr><td>Énergie à 130 ml/kg/jour</td><td>0,75 kcal/ml × 130 ml/kg</td><td>97,5 kcal/kg/jour</td></tr><tr><td>Protéines à 130 ml/kg/jour</td><td>0,9 g/100 ml × 130 ml/kg</td><td>1,17 g/kg/jour</td></tr><tr><td>Jours 1 et 2</td><td>12 repas × 11 ml/kg</td><td>132 ml/kg</td></tr><tr><td>Jours 3 à 5</td><td>8 repas × 16 ml/kg</td><td>128 ml/kg</td></tr><tr><td>Jours 6 et 7</td><td>6 repas × 22 ml/kg</td><td>132 ml/kg</td></tr></table><p>Les totaux de repas sont un calcul du cours à partir des volumes de la source. Pour un enfant de 8 kg : 130 ml/kg font 1040 ml/jour, soit environ 780 kcal/jour.</p><h3>Limite</h3><p>Aucune information professionnelle suisse n’existe dans le dossier pour ce produit. Le moment précis de passage au F-100 (conditions cliniques) n’est pas détaillé dans les sources lues.</p></template>
<template data-pop="e41-f100-rutf" data-title="F-100 et aliment prêt à l’emploi : conditions d’usage"><h3>Composition et doses</h3><p>Le F-100 contient 100 kcal et 2,9 g de protéines pour 100 ml. Le rattrapage se fait à 130 à 200 ml/kg/jour, soit 130 à 200 kcal/kg/jour et 3,8 à 5,8 g de protéines/kg/jour (calcul du cours). L’aliment thérapeutique prêt à l’emploi, utilisé dans la communauté, est donné à 175 kcal/kg/jour (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Restrictions</h3><p>Le F-100 n’est jamais donné non dilué au nourrisson de moins de 6 mois ; le lait maternel est préféré avant les aliments thérapeutiques (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><h3>Objectif et limite</h3><p>L’objectif est un gain de plus de 10 g/kg/jour. Les modalités du test d’appétit et les critères de passage à l’aliment prêt à l’emploi appartiennent à la ligne directrice de 2023, non lue : ils sont à vérifier.</p></template>
<template data-pop="e41-preuve-oms" data-title="Niveau de preuve des recommandations de l’OMS"><h3>Ce que montre la revue</h3><p>Sur 33 recommandations de l’OMS analysées, 16 (48,5 %) reposent sur l’avis d’experts seul (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><h3>Interprétation</h3><p>Cela ne rend pas ces recommandations fausses : le texte indique l’absence d’essai contrôlé. Cela signifie qu’une partie des doses et des rythmes (volumes de F-75, intervalle des repas) n’a pas été comparée à d’autres schémas. Le lecteur doit donc les traiter comme des recommandations établies par consensus.</p><h3>Limite</h3><p>La répartition entre recommandations fondées sur des essais et recommandations d’experts pour la version 2023 n’est pas connue : le texte intégral n’a pas été lu.</p></template>
<template data-pop="e41-effort" data-title="Essai EFFORT : ce qu’il démontre et ses limites"><h3>Population et intervention</h3><p>EFFORT est un essai mené dans 8 hôpitaux suisses chez 2088 patients à risque nutritionnel. Un groupe recevait un soutien nutritionnel individualisé débuté dans les 48 heures ; il était comparé à un groupe sans ce soutien individualisé (<a href="https://doi.org/10.1016/S0140-6736(18)32776-4" target="_blank" rel="noopener">EFFORT 2019</a>).</p><h3>Résultats</h3><table class="t"><tr><th>Critère</th><th>Soutien individualisé</th><th>Comparaison</th><th>Rapport de cotes</th></tr><tr><td>Événement défavorable à 30 jours</td><td>23 %</td><td>27 %</td><td>0,79</td></tr><tr><td>Mortalité à 30 jours</td><td>7 %</td><td>10 %</td><td>0,65</td></tr></table><p>Les objectifs caloriques ont été atteints chez 79 % des patients et les objectifs protéiques chez 76 %. Les effets indésirables étaient équivalents entre les groupes (<a href="https://doi.org/10.1016/S0140-6736(18)32776-4" target="_blank" rel="noopener">EFFORT 2019</a>).</p><h3>Limites</h3><p>Les patients inclus avaient un risque nutritionnel au sens du NRS 2002 ; ils n’étaient pas tous au stade du marasme. L’analyse secondaire montre que les patients positifs selon le consensus GLIM ont davantage d’événements défavorables (27,9 % contre 19,0 %, rapport de cotes 1,53) (<a href="https://doi.org/10.1016/j.clnu.2022.02.009" target="_blank" rel="noopener">Kaegi 2022</a>). Ces résultats ne démontrent pas l’efficacité d’une dose précise, mais d’une stratégie individualisée.</p></template>
<template data-pop="e41-renutrition" data-title="Syndrome de renutrition : définition et mécanisme"><h3>Définition</h3><p>Le syndrome de renutrition est une réponse physiologique exagérée à la réintroduction du glucose après un jeûne prolongé (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber 2019</a>).</p><h3>Chaîne causale</h3><ol><li>Le glucose élève l’insuline.</li><li>L’insuline fait entrer glucose, eau, phosphate, potassium et magnésium dans la cellule : leur concentration sanguine chute.</li><li>Le métabolisme glucidique consomme la thiamine : acidose lactique, béribéri.</li><li>Le rein retient le sodium et l’eau.</li></ol><p>Source : <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber 2019</a>. Chez l’enfant, les signes sont des sueurs, une faiblesse musculaire, une tachycardie et une insuffisance cardiaque (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Fréquence</h3><p>Dans une étude ougandaise, 76 % des enfants ont une hypophosphatémie au deuxième jour, associée à la mortalité (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><h3>Limite</h3><p>Une association avec la mortalité n’établit pas que l’hypophosphatémie soit seule en cause.</p></template>
<template data-pop="e41-renutrition-dx" data-title="Diagnostic probable de syndrome de renutrition"><h3>Critères du consensus</h3><p>Le diagnostic est probable si le phosphate baisse de plus de 30 % sous la limite inférieure ou tombe sous 0,6 mmol/L, ou si deux des trois ions (phosphate, magnésium, potassium) baissent dans les 72 heures, sans autre cause (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber 2019</a>).</p><h3>Formulation</h3><p>La formulation « baisse de plus de 30 % sous la limite inférieure » est reprise telle que le dossier la rapporte. Son sens exact (baisse relative par rapport à la valeur initiale ou écart sous la limite inférieure) doit être vérifié dans le tableau d’origine avant usage de codage.</p><h3>Phase vulnérable</h3><p>Jusqu’à 10 jours, surtout les 72 premières heures. Le phosphate normal de l’adulte est de 0,7 à 1,4 mmol/L (<a href="https://amiko.oddb.org/fr/fi?gtin=7680527800012" target="_blank" rel="noopener">Glycophos® 2024</a>).</p><div class="trap"><span class="k">Piège</span> Attribuer une hypophosphatémie à la renutrition sans chercher une autre cause : le critère exige l’absence d’autre explication.</div></template>
<template data-pop="e41-corrections" data-title="Corrections ioniques : pourquoi des paliers"><h3>Les paliers</h3><p>Le consensus fixe des doses croissantes à mesure que la concentration baisse : potassium de 3,1 à 3,5 mmol/L, 20 mmol de chlorure de potassium ; de 2,5 à 3,0, 20 à 40 mmol par voie intraveineuse sur 4 à 8 heures ; moins de 2,5, 40 mmol. Magnésium de 0,5 à 0,7 mmol/L, 10 à 15 mmol par voie orale ; moins de 0,5, 20 à 24 mmol de sulfate de magnésium par voie intraveineuse. Phosphate de 0,61 à 0,8 mmol/L, 0,3 mmol/kg/jour ; 0,6 mmol/L ou moins, 0,6 mmol/kg/jour par voie intraveineuse sur 8 à 12 heures, au maximum 50 mmol/24 heures (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber 2019</a>).</p><h3>Raisonnement</h3><p>Plus la concentration est basse, plus le risque d’arythmie et de faiblesse est élevé : la dose et la voie deviennent plus énergiques. Une perfusion lente (4 à 12 heures) évite un pic de concentration (raisonnement du cours).</p><h3>Prudence</h3><p>L’insuffisance rénale réduit l’élimination du potassium, du magnésium et du phosphate : la dose se discute alors avec le néphrologue. Aucun schéma pédiatrique n’est décrit dans les sources lues.</p></template>
<template data-pop="e41-age" data-title="Seuil d’indice de masse corporelle relevé après 70 ans"><h3>Le seuil</h3><p>Le critère de phénotype est un indice de masse corporelle inférieur à 20 kg/m² avant 70 ans et inférieur à 22 kg/m² à partir de 70 ans (<a href="https://doi.org/10.3390/nu16234099" target="_blank" rel="noopener">Nutrients 2024</a>).</p><h3>Raisonnement</h3><p>Un seuil plus élevé chez la personne âgée détecte plus tôt la malnutrition. Les sources lues n’expliquent pas la raison de ce choix : on peut penser que la perte de taille et de masse maigre avec l’âge modifie la signification d’un même indice (raisonnement du cours, non sourcé).</p><h3>Prévalence</h3><p>Le risque nutritionnel augmente avec l’âge : 28 % des admissions de médecine interne après 85 ans ont un score NRS 2002 d’au moins 3 (<a href="https://doi.org/10.1016/j.clnu.2009.06.005" target="_blank" rel="noopener">Imoberdorf 2010</a>).</p></template>
<template data-pop="e41-sequelles" data-title="Séquelles du marasme : ce que rapportent les sources"><h3>Liste</h3><p>Masse maigre réduite, retard statural, force de préhension et tolérance à l’effort moindres, retard de développement, troubles du comportement, moins bonne scolarité (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Une atteinte cérébrale possiblement irréversible est évoquée après 3 à 4 ans (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Interprétation</h3><p>Ces séquelles découlent de l’atteinte des tissus qui se construisent pendant l’enfance (muscle, os, cerveau) lorsque l’énergie manque. L’ordre de grandeur de leur fréquence n’est pas donné dans les sources lues.</p><h3>Conséquence</h3><p>Le suivi ne s’arrête pas à la sortie : la stimulation psychosociale et le suivi du développement font partie de la prise en charge (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p></template>
<template data-pop="e41-d-benerva" data-title="Thiamine : Benerva®"><h3>Mécanisme et indications</h3><p>La thiamine (vitamine B1) est consommée par le métabolisme des glucides : l’information professionnelle indique qu’environ 0,4 mg de thiamine sont nécessaires pour 4200 kJ (environ 1000 kcal) issus des glucides (<a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva® 2019</a>). Les indications libellées sont le béribéri, l’encéphalopathie de Wernicke et la cardiomyopathie alcoolique. Le syndrome de renutrition n’est pas une indication libellée : son usage préventif relève du consensus suisse (<button class="w" data-k="e41-thiamine-contentieux">arbitrage</button>).</p><h3>Présentations et posologie</h3><p>Comprimés à 100 et 300 mg ; ampoules à 100 mg/ml. En cas d’hypovitaminose grave, 200 à 300 mg/jour par voie orale. Dans les formes sévères, la voie parentérale (intramusculaire ou intraveineuse lente) atteint jusqu’à 200 mg/jour (<a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva® 2019</a>).</p><h3>Sécurité</h3><p>La voie intraveineuse est réservée à l’hôpital à cause du risque de réactions anaphylactoïdes (<a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva® 2019</a>). Les contre-indications, interactions et effets indésirables détaillés n’ont pas été relus dans le dossier de ce cours ; ils sont à lire dans l’information professionnelle (avril 2019).</p><h3>Surveillance et preuve</h3><p>Aucun essai sur la prévention du syndrome de renutrition n’est repris dans le dossier : la dose de 200 à 300 mg avant la renutrition est celle du consensus de Reber (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber 2019</a>), qui précise une prise au moins 30 minutes avant de renourrir, puis pendant 3 jours.</p></template>
<template data-pop="e41-d-glycophos" data-title="Glycérophosphate de sodium : Glycophos®"><h3>Composition et rôle</h3><p>20 ml apportent 20 mmol de phosphate et 40 mmol de sodium. Le produit est un additif de perfusion de nutrition parentérale (<a href="https://amiko.oddb.org/fr/fi?gtin=7680527800012" target="_blank" rel="noopener">Glycophos® 2024</a>). Il apporte du phosphate par voie intraveineuse quand la voie orale est insuffisante ou impossible (indication fonctionnelle du cours).</p><h3>Posologie</h3><p>Adultes : 10 à 20 mmol/jour. Enfants et nouveau-nés : 1,0 à 1,5 mmol/kg/jour. Le produit n’est jamais administré non dilué (<a href="https://amiko.oddb.org/fr/fi?gtin=7680527800012" target="_blank" rel="noopener">Glycophos® 2024</a>).</p><h3>Contre-indications</h3><p>Insuffisance rénale sévère, choc, hypernatrémie, hyperphosphatémie, déshydratation (<a href="https://amiko.oddb.org/fr/fi?gtin=7680527800012" target="_blank" rel="noopener">Glycophos® 2024</a>).</p><h3>Surveillance</h3><p>Phosphate et sodium sanguins. Le phosphate normal de l’adulte est de 0,7 à 1,4 mmol/L. Les doses du consensus de Reber pour la renutrition (0,3 à 0,6 mmol/kg/jour) dépassent la dose libellée de l’adulte : cet écart est discuté dans la fenêtre du <button class="w" data-k="e41-glycophos-calcul">calcul du cours</button>.</p></template>
<template data-pop="e41-d-amoxicilline" data-title="Amoxicilline : information professionnelle suisse"><h3>Produit lu</h3><p>Amoxicilline Spirig HC® 200 mg/4 ml, poudre pour suspension, mise à jour d’août 2024 (<a href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">Amoxicilline Spirig HC® 2024</a>).</p><h3>Posologie pour l’enfant de 40 kg ou moins</h3><p>50 à 100 mg/kg/jour en 3 ou 4 prises, avec une dose unitaire maximale de 50 mg/kg. La malnutrition n’est pas une indication libellée.</p><h3>Place dans le marasme</h3><p>Une antibiothérapie empirique est recommandée par l’OMS pour tous les enfants atteints de malnutrition aiguë sévère. La dose du schéma de l’OMS (15 mg/kg toutes les 8 heures, soit 45 mg/kg/jour) et celle de l’information professionnelle diffèrent : voir la fenêtre <button class="w" data-k="e41-antibiotiques">antibiotiques</button>.</p><h3>Limite</h3><p>Les contre-indications, interactions et effets indésirables de l’amoxicilline n’ont pas été repris dans le dossier de ce cours. Ils sont à lire dans l’information professionnelle avant prescription.</p></template>
<template data-pop="e41-thiamine-contentieux" data-title="Contentieux : thiamine, consensus suisse ou information professionnelle"><h3>Les deux textes</h3><table class="t"><tr><th>Source</th><th>Date</th><th>Dose</th><th>Remarque</th></tr><tr><td>Consensus suisse sur la renutrition</td><td>2019</td><td>200 à 300 mg au moins 30 minutes avant la renutrition, puis pendant 3 jours</td><td>La voie n’est pas précisée dans le dossier</td></tr><tr><td>Information professionnelle Benerva®</td><td>Avril 2019</td><td>200 à 300 mg/jour par voie orale en hypovitaminose grave ; jusqu’à 200 mg/jour par voie parentérale dans les formes sévères</td><td>La renutrition n’est pas une indication libellée</td></tr></table><p>Sources : <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber 2019</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva® 2019</a>.</p><h3>Arbitrage</h3><p>La règle du cours retient la source primaire applicable la plus récente. Les deux textes datent de 2019. Pour la question précise de la prévention de la renutrition, seul le consensus la traite : il est retenu comme source de la dose. L’information professionnelle encadre les voies et les limites : si une dose de 300 mg était donnée par voie parentérale, elle dépasserait le maximum de 200 mg/jour libellé. Cette lecture est un raisonnement du cours ; la voie du consensus doit être vérifiée dans le texte d’origine.</p><h3>Texte alternatif</h3><p>Le lecteur peut appliquer la posologie de l’information professionnelle (200 à 300 mg/jour par voie orale) en la signalant comme hors libellé pour la prévention de la renutrition.</p></template>
<template data-pop="e41-glycophos-calcul" data-title="Calcul du cours : phosphate et sodium apportés par le Glycophos®"><h3>Données</h3><p>20 ml contiennent 20 mmol de phosphate et 40 mmol de sodium : un millilitre apporte 1 mmol de phosphate et 2 mmol de sodium (<a href="https://amiko.oddb.org/fr/fi?gtin=7680527800012" target="_blank" rel="noopener">Glycophos® 2024</a>). Le consensus de Reber limite le sodium à moins de 1 mmol/kg/jour les premiers jours (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber 2019</a>).</p><h3>Exemple pour 70 kg</h3><table class="t"><tr><th>Palier de phosphate</th><th>Phosphate</th><th>Volume de Glycophos®</th><th>Sodium apporté</th><th>Limite de sodium</th></tr><tr><td>0,3 mmol/kg/jour</td><td>21 mmol</td><td>21 ml</td><td>42 mmol</td><td>70 mmol</td></tr><tr><td>0,6 mmol/kg/jour</td><td>42 mmol</td><td>42 ml</td><td>84 mmol</td><td>70 mmol</td></tr></table><h3>Lecture</h3><p>Au palier le plus élevé, le sodium apporté par ce seul produit dépasse la limite recommandée pour les premiers jours. Le prescripteur doit donc compter le sodium du phosphate dans le bilan sodé, ou répartir l’apport sur plusieurs jours dans la limite du maximum de 50 mmol/24 heures. De plus, les doses de 21 et 42 mmol dépassent la dose libellée de l’adulte (10 à 20 mmol/jour) : le choix doit être motivé et surveillé.</p><h3>Limite</h3><p>Ce calcul est un raisonnement du cours. Les sources lues ne décrivent pas de produit alternatif ni de schéma d’adaptation.</p></template>
<template data-pop="pareto-e41-bases" data-title="Pareto — Définition, mesure et mécanismes"><p class="ratio" data-cover="e41-0,e41-1,e41-2,e41-3,e41-4,e41-5,e41-6"></p><ul><li>Le marasme est une malnutrition aiguë sévère <b>sans œdème</b>, par apport énergétique insuffisant prolongé ; le mot décrit un dépérissement (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</li><li>Enfant de 6 à 59 mois : poids pour la taille inférieur à −3 écarts-types ou périmètre brachial inférieur à 115 mm, sans œdème (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</li><li>Adulte : au moins un critère de phénotype et un critère d’étiologie après dépistage positif (<a href="https://doi.org/10.1016/j.clnu.2018.08.002" target="_blank" rel="noopener">GLIM 2019</a>). Une mesure unique reste présomptive (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>).</li><li>Le risque relatif de décès toutes causes est de 11,6 pour un poids pour la taille inférieur à −3 (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>) ; en Suisse, 18,2 % des admissions de médecine interne ont un NRS 2002 d’au moins 3 (<a href="https://doi.org/10.1016/j.clnu.2009.06.005" target="_blank" rel="noopener">Imoberdorf 2010</a>).</li><li>L’organisme jeûne, épuise le glycogène, consomme le muscle, puis s’adapte : croissance arrêtée, métabolisme de base abaissé, T3, insuline et IGF-1 en baisse, cortisol en hausse.</li><li>Conséquences : hypoglycémie, cœur réduit, ventilation limitée, atrophie villositaire avec diarrhée osmotique, filtration prérénale abaissée, immunité effondrée avec infections pauci-symptomatiques.</li><li>E40 (œdème) et E42 (signes simultanés) ne se codent pas E41.</li></ul></template>
<template data-pop="pareto-e41-clin" data-title="Pareto — Causes, examen, diagnostic et urgences"><p class="ratio" data-cover="e41-7,e41-8,e41-9,e41-10,e41-11"></p><ul><li>Deux critères d’étiologie : apport ou assimilation réduits ; inflammation ou charge de maladie (<a href="https://doi.org/10.1016/j.clnu.2018.08.002" target="_blank" rel="noopener">GLIM 2019</a>).</li><li>Interrogatoire : apports réels, cinétique de la perte de poids (plus de 5 % en 6 mois ou 10 % au-delà), maladie associée, durée du jeûne et alcool.</li><li>Examen : enfant émacié, léthargique, bradycarde, hypotendu, hypotherme ; peau lâche, faciès vieilli, fonte musculaire de I à IV, <b>absence d’œdème</b> ; poids et taille toujours reportés sur courbe.</li><li>Diagnostic de l’enfant : anthropométrique. L’œdème est le premier tri : absent, E41 ; présent, E40 ou E42.</li><li>Quatre urgences vitales : hypoglycémie, hypothermie, déshydratation avec choc, infection invasive ; le remplissage agressif est nocif.</li><li>Les seuils chiffrés d’hypoglycémie et d’hypothermie de l’OMS n’ont pas été lus.</li></ul></template>
<template data-pop="pareto-e41-trait" data-title="Pareto — Traitement de l’enfant, de l’adulte et renutrition"><p class="ratio" data-cover="e41-12,e41-13,e41-14,e41-15"></p><ul><li>Plus de 90 % des formes sont non compliquées et se traitent en ambulatoire avec un aliment prêt à l’emploi.</li><li>Ordre : glucose (50 ml à 10 %, ou 5 ml/kg par voie intraveineuse si léthargique), réhydratation prudente par ReSoMal, antibiotiques empiriques, micronutriments sans fer, F-75 à 130 ml/kg/jour.</li><li>Rattrapage : F-100 ou aliment prêt à l’emploi, gain visé supérieur à 10 g/kg/jour ; sortie sur poids pour la taille ≥ −2 ou périmètre brachial ≥ 125 mm.</li><li>Adulte suisse : NRS 2002 ≥ 3 à l’admission, soutien individualisé en moins de 48 heures ; dans EFFORT, mortalité à 30 jours de 7 % contre 10 % (<a href="https://doi.org/10.1016/S0140-6736(18)32776-4" target="_blank" rel="noopener">EFFORT 2019</a>).</li><li>Renutrition : le glucose élève l’insuline, qui fait entrer phosphate, potassium, magnésium et eau dans les cellules ; la thiamine est consommée.</li><li>Prévention : thiamine 200 à 300 mg avant, début à 5–15 kcal/kg/jour, besoins complets en 5 à 10 jours, ions dosés, 72 heures de surveillance (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber 2019</a>).</li></ul></template>
<template data-pop="pareto-e41-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="e41-16,e41-17,e41-18"></p><ul><li>La létalité de la forme compliquée va de 12 % à plus de 20 % ; 25 % des enfants sortis au Malawi meurent dans les 12 mois.</li><li>Séquelles : masse maigre et taille réduites, retard de développement, scolarité moins bonne ; atteinte cérébrale possiblement irréversible après 3 à 4 ans.</li><li>Adulte : la malnutrition est associée au décès hospitalier, aux soins intensifs et aux longs séjours.</li><li>Nourrisson de moins de 6 mois : poids pour la longueur &lt; −3 ; soutien à l’allaitement.</li><li>VIH : mortalité multipliée par 3. Alcoolisme, oncologie, hémodialyse : haut risque de renutrition.</li><li>Critères formels : CIM-10-GM sans œdème ; enfant OMS ; adulte GLIM. Paramètres : poids pour la taille &lt; −3, périmètre brachial &lt; 115 mm, F-75 97,5 kcal/kg/jour, thiamine 200–300 mg, phosphate &lt; 0,6 mmol/L.</li></ul></template>
<template data-pop="pareto-e41-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e41-e-1,e41-e-2,e41-e-3,e41-e-4,e41-e-5"></p><ul><li>Le standard de référence de l’enfant est l’anthropométrie : poids pour la taille et périmètre brachial reportés sur courbe.</li><li>Adulte : NRS 2002 à l’admission, puis critère de phénotype et d’étiologie du consensus GLIM.</li><li>Glycémie à l’arrivée ; phosphate, potassium, magnésium avant et pendant la renutrition ; phosphate normal de l’adulte 0,7–1,4 mmol/L.</li><li>Électrocardiogramme seulement si risque très élevé, ou potassium &lt; 2,5, phosphate &lt; 0,32, magnésium &lt; 0,5 mmol/L.</li><li>Albumine, préalbumine : en série, jamais pour poser le diagnostic.</li><li>Recherche d’infection d’emblée ; VIH et tuberculose selon le contexte.</li></ul></template>
<template data-pop="pareto-e41-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e41-p-1,e41-p-2,e41-p-3,e41-p-4,e41-p-5"></p><ul><li>Pas de médicament du marasme : thiamine, ions, glucose, réhydratation, antibiotiques, micronutriments sans fer.</li><li>Thiamine : 200–300 mg avant la renutrition (consensus) ; Benerva® limite la voie parentérale à 200 mg/jour.</li><li>Glycophos® : 20 mmol de phosphate et 40 mmol de sodium pour 20 ml ; jamais non dilué ; contre-indiqué en insuffisance rénale sévère, choc, hypernatrémie, hyperphosphatémie, déshydratation.</li><li>Amoxicilline : schéma OMS 45 mg/kg/jour contre 50–100 mg/kg/jour dans l’information professionnelle suisse.</li><li>À éviter : remplissage rapide, glucose avant thiamine, fer précoce, F-100 non dilué, phosphate non dilué, apport initial élevé.</li></ul></template>
<template data-pop="pareto-e41-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e41-s-physio-body"></p><ul><li>Jeûne court : acides gras, cétones, acides aminés du muscle ; jeûne prolongé : protéolyse massive.</li><li>Adaptation : T3, insuline, IGF-1, leptine en baisse ; hormone de croissance et cortisol en hausse ; métabolisme de base abaissé.</li><li>L’économie masque la gravité : l’enfant calme peut être très malade.</li><li>L’organisme adapté tolère mal un apport ou un remplissage brutal.</li></ul></template>
<template data-pop="pareto-e41-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e41-s-bioc-body"></p><ul><li>Ordre des substrats : glycogène, néoglucogenèse musculaire, lipolyse et cétones.</li><li>L’insuline fait entrer glucose, eau, phosphate, potassium, magnésium dans la cellule.</li><li>La thiamine est consommée par le métabolisme glucidique : 0,4 mg pour environ 4200 kJ.</li><li>Thiamine avant glucose ; ions dosés et corrigés par paliers.</li></ul></template>
<template data-pop="pareto-e41-s-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="e41-s-histo-body"></p><ul><li>Intestin : atrophie villositaire, hypoplasie des cryptes, perméabilité altérée, pullulation bactérienne.</li><li>Pancréas atrophique ; stéatose fréquente ; myofibrilles cardiaques amincies.</li><li>Conséquences : malabsorption, diarrhée osmotique, repas petits et fréquents.</li></ul></template>
<template data-pop="pareto-e41-s-immuno" data-title="Pareto — Immunologie"><p class="ratio" data-cover="e41-s-immuno-body"></p><ul><li>Thymus atrophique, lymphocytes CD4 réduits, phagocytose altérée, IgA sécrétoires et complément abaissés.</li><li>Infections graves et pauci-symptomatiques ; risque relatif de décès de 9,6 à 12,3 pour pneumonie, diarrhée, rougeole.</li><li>Antibiothérapie empirique pour tous les enfants ; recherche d’infection sans attendre la fièvre.</li></ul></template>
