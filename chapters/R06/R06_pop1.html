<template data-pop="r06-definition" data-title="Définition de la dyspnée"><p class="lab">Définition</p><p>La dyspnée est l’expérience subjective d’un inconfort respiratoire, faite de sensations qualitativement distinctes et d’intensité variable (American Thoracic Society, 1999). Dyspnée, gêne respiratoire et essoufflement sont des synonymes dans l’usage de l’ESMO. L’ERS et l’ESICM la décrivent comme la perception désagréable et angoissante de sa respiration.</p><p class="lab">Conséquence</p><p>Comme la douleur, elle est multidimensionnelle : sensorielle, émotionnelle, cognitive, comportementale, culturelle. Seul le patient peut la percevoir et la rapporter. Les signes de détresse respiratoire peuvent en être déconnectés : un patient calme peut souffrir, un patient polypnéique peut ne pas se plaindre.</p><div class="key"><b>Limite.</b> Aucune mesure physiologique ne remplace l’auto-évaluation ; chez le patient qui ne peut pas s’exprimer, les paramètres vitaux servent de substitut imparfait.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7733213/" target="_blank" rel="noopener">ESMO 2020</a> ; <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, introduction</a>.</p></template>
<template data-pop="r06-gravite" data-title="Signes de gravité, du téléphone au lit du malade"><p class="lab">Au téléphone</p><p>La SFMU recommande de rechercher, auprès du patient ou d’un témoin, une fréquence respiratoire supérieure à 25 par minute, un balancement thoraco-abdominal, l’incapacité à finir ses phrases, une cyanose des extrémités, des sueurs et des troubles de la conscience. L’incapacité à compter jusqu’à 20 en une seule respiration (score de Roth) en est une approximation. Ces signes justifient l’envoi d’une équipe médicalisée.</p><p class="lab">Au lit du malade</p><p>Une fréquence respiratoire supérieure à 25 par minute s’associe à un risque accru d’intubation, d’admission en réanimation et de décès (grade 2+). Les troubles de la conscience, la respiration abdominale paradoxale et le recours aux muscles inspiratoires accessoires s’associent à une mortalité accrue (avis d’experts).</p><div class="key"><b>Conséquence pratique.</b> Un seul de ces signes impose une surveillance continue et un avis spécialisé.</div><p class="src">Référence : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, recommandations 1.1.1, 1.3.1 et 1.3.2</a>.</p></template>
<template data-pop="r06-detresse" data-title="Détresse respiratoire et insuffisance respiratoire aiguë"><p class="lab">Détresse respiratoire</p><p>C’est l’ensemble des signes cliniques qui traduisent l’inadéquation entre la charge imposée à l’appareil respiratoire et sa capacité à y faire face. Elle associe des conséquences directes sur l’hématose (cyanose), des signes de lutte et des signes d’épuisement. Une obstruction laryngée produit une détresse bruyante sans forcément d’hypoxémie ni d’hypercapnie.</p><p class="lab">Insuffisance respiratoire aiguë</p><p>Sa définition est gazométrique : PaO₂ inférieure à 60 mmHg ou SpO₂ inférieure à 90 % à l’air ambiant, ou rapport PaO₂/FiO₂ inférieur à 300 mmHg sous oxygène. Le type I est hypoxémique sans hypercapnie ; le type II associe une acidose et une PaCO₂ supérieure à 45 mmHg (J96).</p><div class="key"><b>Limite.</b> Cette définition inclut des hypoxémies sans atteinte pulmonaire, par shunt droit-gauche intracardiaque ou malformation artério-veineuse.</div><p class="src">Référence : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, définitions</a>.</p></template>
<template data-pop="r06-chronique" data-title="Syndrome de dyspnée chronique"><p class="lab">Définition</p><p>Un consensus international publié par l’European Respiratory Journal en 2017 définit le syndrome de dyspnée chronique comme une dyspnée qui persiste malgré le traitement optimal de la physiopathologie sous-jacente et qui entraîne un handicap. Aucune durée minimale n’est exigée.</p><p class="lab">Méthode</p><p>Le texte repose sur une méthode Delphi : 17 entretiens, puis trois tours d’enquête auprès de 34, 25 et 31 experts, avec un seuil d’accord fixé à 70 %. Les auteurs ont aussi discuté les équivalents français et allemands des termes.</p><p class="lab">Conséquence</p><p>Nommer le syndrome vise à combattre le nihilisme thérapeutique : la dyspnée réfractaire devient une cible de soins à part entière, avec ses propres traitements.</p><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/28546269/" target="_blank" rel="noopener">Johnson et al., Eur Respir J 2017 (résumé)</a>.</p></template>
<template data-pop="r06-orthopnee" data-title="Orthopnée et dyspnée paroxystique nocturne"><p class="lab">Définition</p><p>L’orthopnée est une dyspnée qui apparaît ou s’aggrave en décubitus et oblige le patient à dormir surélevé. La dyspnée paroxystique nocturne le réveille quelques heures après le coucher.</p><p class="lab">Valeur</p><p>Les deux symptômes figurent parmi les signes d’insuffisance cardiaque recherchés à l’anamnèse (I50). L’orthopnée n’est pourtant pas spécifique : dans la BPCO avancée, le décubitus augmente brutalement la charge élastique des muscles inspiratoires, la commande neurale et la dissociation neuromécanique. Dans une étude de 16 patients, l’orthopnée s’associait à ces modifications.</p><div class="trap"><span class="k">Piège</span> Une orthopnée chez un patient atteint de BPCO sévère ne suffit pas à affirmer une insuffisance cardiaque : le peptide natriurétique et l’échographie tranchent.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12171858/" target="_blank" rel="noopener">Nic Aodha Bhuí et al., 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32972985/" target="_blank" rel="noopener">Elbehairy et al., 2021</a>.</p></template>
<template data-pop="r06-platypnee" data-title="Platypnée-orthodéoxie"><p class="lab">Définition</p><p>La platypnée est une dyspnée qui apparaît en position assise ou debout et cède en décubitus ; l’orthodéoxie est la désaturation artérielle qui l’accompagne dans les mêmes conditions.</p><p class="lab">Mécanisme</p><p>Le sang veineux désoxygéné se mêle au sang artériel par un shunt intracardiaque ou extracardiaque. Le foramen ovale perméable et la communication interauriculaire en sont les causes principales.</p><p class="lab">Examen</p><p>L’échocardiographie transthoracique avec test aux microbulles est l’examen initial de choix. Plusieurs causes peuvent coexister, d’où la relecture attentive de l’imagerie.</p><p class="src">Références : <a href="https://doi.org/10.53738/REVMED.2023.19.840.1619" target="_blank" rel="noopener">Guglielmo et al., Revue médicale suisse 2023 (résumé)</a> ; <a href="https://doi.org/10.53738/REVMED.2025.21.914.46583" target="_blank" rel="noopener">Aubagnac et al., Revue médicale suisse 2025 (résumé)</a>.</p></template>
<template data-pop="r06-stridor" data-title="Stridor : siège et causes"><p class="lab">Définition</p><p>Bruit respiratoire aigu et anormal, généralement inspiratoire, dû au passage turbulent de l’air dans le larynx ou la trachée.</p><p class="lab">Siège</p><p>Inspiratoire, il désigne la glotte ou l’étage sus-jacent. Biphasique, parfois accompagné d’un sifflement, il désigne l’étage sous-glottique. L’atteinte trachéo-bronchique donne un stridor rauque aux deux temps, parfois avec une toux aboyante.</p><p class="lab">Causes de l’adulte</p><p>Infections (épiglottite, abcès), corps étranger, angio-œdème, inhalation de fumées ou de caustiques, traumatisme, lésion après intubation, compression des nerfs récurrents, goitre ou tumeur, obstruction laryngée fonctionnelle, trachéomalacie.</p><div class="key"><b>Conséquence pratique.</b> Le stridor est le principal signe clinique de l’obstruction haute et le révélateur de sa gravité.</div><p class="src">Référence : <a href="https://www.revmed.ch/view/539746/4352258/RMS_482_1486.pdf" target="_blank" rel="noopener">Lavanchy et al., Revue médicale suisse 2015, tableau 2</a>.</p></template>
<template data-pop="r06-cheyne" data-title="Respiration de Cheyne-Stokes"><p class="lab">Définition</p><p>Au moins trois apnées ou hypopnées centrales consécutives, séparées par une variation croissante puis décroissante de l’amplitude, sur des cycles d’au moins 40 secondes, typiquement 45 à 90 secondes, avec au moins cinq événements centraux par heure sur au moins deux heures d’enregistrement. L’ERS recommande d’appeler ce tracé « respiration périodique ».</p><p class="lab">Contexte</p><p>L’insuffisance cardiaque chronique en est la cause la plus fréquente. La classification internationale des troubles du sommeil distingue six types d’apnée centrale, dont la forme liée à l’altitude et la forme médicamenteuse. Les patients insuffisants cardiaques rapportent rarement une somnolence, qu’ils attribuent à leur cardiopathie.</p><p class="lab">Examen</p><p>La polysomnographie complète est l’examen de référence ; elle distingue l’apnée centrale de l’apnée obstructive.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10966472/" target="_blank" rel="noopener">Randerath et al., Eur Respir Rev 2024</a>.</p></template>
<template data-pop="r06-hyperventilation" data-title="Hyperventilation et respiration dysfonctionnelle"><p class="lab">Définition</p><p>L’hyperventilation est une ventilation alvéolaire supérieure à celle qu’exige l’homéostasie des gaz du sang : la PaCO₂ baisse et une alcalose respiratoire apparaît. Elle ne se confond pas avec la tachypnée.</p><p class="lab">Formes</p><p>Aiguë et épisodique, comme dans l’attaque de panique ; chronique, avec une PaCO₂ basse en permanence et peu de symptômes ; liée à l’effort ou à sa récupération. Son mécanisme est discuté : anxiété, ou réglage abaissé de la sensibilité au CO₂.</p><p class="lab">Respiration dysfonctionnelle</p><p>Elle regroupe plusieurs schémas anormaux : respiration thoracique dominante, expiration abdominale forcée, asynchronie thoraco-abdominale. Le syndrome d’hyperventilation, qui touche l’enfant comme l’adulte avec une prédominance féminine, en est la forme la plus connue.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5343732/" target="_blank" rel="noopener">Robson, 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10567073/" target="_blank" rel="noopener">Ludlow et al., 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19127893/" target="_blank" rel="noopener">Sauty, Revue médicale suisse 2008 (résumé)</a>.</p></template>
<template data-pop="r06-kussmaul" data-title="Respiration de Kussmaul"><p class="lab">Mécanisme</p><p>L’acidose métabolique stimule la ventilation, qui augmente de façon disproportionnée par rapport à la production de CO₂ : c’est aussi ce qui définit le point de compensation respiratoire à l’épreuve d’effort. La respiration devient ample et profonde.</p><p class="lab">Examen</p><p>La gazométrie artérielle affirme l’origine extrapulmonaire de la dyspnée en montrant l’acidose métabolique ; elle peut aussi révéler une cause rare comme une méthémoglobinémie.</p><div class="trap"><span class="k">Piège</span> Prendre une respiration de Kussmaul pour une crise d’angoisse ou une maladie pulmonaire retarde le traitement de l’acidose.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., 2025</a>.</p></template>
<template data-pop="r06-hoquet" data-title="Hoquet : mécanisme et causes"><p class="lab">Définition</p><p>Le hoquet, ou singultus, est une contraction myoclonique, spontanée et involontaire, du diaphragme et des muscles intercostaux, suivie d’une fermeture brusque de la glotte qui produit le bruit caractéristique. Il est le plus souvent transitoire ; il devient chronique au-delà de 48 heures.</p><p class="lab">Causes</p><p>Le reflux gastro-œsophagien est la cause la plus fréquente du hoquet chronique. Les autres causes sont neurologiques, notamment une atteinte du centre supraspinal du hoquet ou une maladie de Parkinson, tumorales, digestives, cardiovasculaires ou infectieuses. Des médicaments peuvent le provoquer : l’information professionnelle du midazolam le mentionne parmi les effets indésirables.</p><div class="key"><b>Conséquence pratique.</b> Un hoquet chronique peut être le seul symptôme d’une maladie grave : il impose un bilan étiologique.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13340612/" target="_blank" rel="noopener">Alshargi et al., 2026</a> ; <a href="https://doi.org/10.53738/REVMED.2024.20.874.991" target="_blank" rel="noopener">Canonica et al., Revue médicale suisse 2024 (résumé)</a>.</p></template>
<template data-pop="r06-cohorte-suisse" data-title="Dyspnée aiguë aux urgences en Suisse"><p class="lab">Étude</p><p>Analyse secondaire d’une étude prospective menée aux urgences de deux hôpitaux universitaires suisses. Parmi 1144 patients admis pour dyspnée aiguë (âge médian 74 ans, 42 % de femmes), 52 % avaient une insuffisance cardiaque aiguë.</p><p class="lab">Résultats</p><p>Sept pour cent sont décédés dans les 90 jours et 28 % dans les 720 jours. La qualité de vie autoévaluée par un questionnaire générique à cinq dimensions prédisait la mortalité (rapport de risque ajusté de 7,8 à 90 jours) aussi bien que le NT-proBNP (aires sous la courbe de 0,68 et 0,69).</p><div class="key"><b>Conséquence pratique.</b> Ce que le patient dit de son état de santé a une valeur pronostique comparable à celle d’un biomarqueur.</div><p class="src">Référence : <a href="https://doi.org/10.57187/s.3785" target="_blank" rel="noopener">Belkin et al., Swiss Medical Weekly 2025 (résumé)</a>.</p></template>
<template data-pop="r06-decharge" data-title="Décharge corollaire"><p class="lab">Définition</p><p>Copie de la commande motrice respiratoire, émise par les centres bulbo-pontiques et le cortex, et transmise au cortex somatosensoriel.</p><p class="lab">Rôle</p><p>Le cerveau compare l’intensité de la commande envoyée à l’information mécanique et chimique reçue en retour. Une commande élevée pour une ventilation obtenue faible est perçue comme un effort respiratoire excessif. Chez le volontaire sain paralysé, une stimulation chimique intense provoque une gêne respiratoire sévère sans aucune activité musculaire.</p><div class="key"><b>Conséquence.</b> La faiblesse des muscles respiratoires accroît la commande nécessaire pour un même volume, donc la dyspnée ; l’entraînement des muscles inspiratoires la réduit.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6979461/" target="_blank" rel="noopener">O’Donnell et al., 2020</a>.</p></template>
<template data-pop="r06-afferences" data-title="Afférences chimiques et mécaniques"><p class="lab">Chémorécepteurs</p><p>Une hypoxémie critique, inférieure à 60 mmHg, stimule les chémorécepteurs périphériques et centraux et augmente la commande neurale. Le CO₂ et les ions hydrogène agissent dans le même sens. Une chémosensibilité accrue, révélée par une PaCO₂ de repos basse, accélère la montée de la commande à l’effort.</p><p class="lab">Mécanorécepteurs</p><p>Les récepteurs pulmonaires à l’étirement, les récepteurs des voies aériennes et ceux de la paroi renseignent sur le volume et le mouvement. Dans un pneumothorax, la dyspnée résulte notamment de leur stimulation.</p><div class="key"><b>Conséquence.</b> Une même plainte peut naître d’un stimulus chimique, mécanique ou des deux ; l’oxygène n’agit que sur la part liée à l’hypoxémie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6979461/" target="_blank" rel="noopener">O’Donnell et al., 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5343732/" target="_blank" rel="noopener">Robson, 2017</a>.</p></template>
<template data-pop="r06-dissociation" data-title="Dissociation neuromécanique"><p class="lab">Définition</p><p>Rupture de l’harmonie entre la commande neurale inspiratoire et la réponse dynamique du système respiratoire. La commande se mesure par l’électromyographie du diaphragme recueillie par cathéter œsophagien.</p><p class="lab">Indicateurs</p><p>L’intensité de la dyspnée à l’effort suit plusieurs rapports : ventilation sur ventilation maximale, effort œsophagien sur effort maximal, volume courant sur capacité inspiratoire, activité diaphragmatique sur activité maximale. Tous traduisent l’approche d’une limite.</p><p class="lab">Conséquence thérapeutique</p><p>Bronchodilatateurs, réentraînement, oxygène d’effort, entraînement des muscles inspiratoires et opioïdes réduisent tous cette dissociation ; c’est leur voie finale commune.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6979461/" target="_blank" rel="noopener">O’Donnell et al., 2020, tableau 1</a>.</p></template>
<template data-pop="r06-limbique" data-title="Composante affective de la dyspnée"><p class="lab">Mécanisme</p><p>Lorsque le stimulus chimique et la réponse mécanique sont dissociés expérimentalement, l’imagerie fonctionnelle montre l’activation de régions limbiques et paralimbiques ; le désagrément est traité notamment dans l’insula antérieure et l’amygdale. L’activation sympathique associée produit anxiété, panique et détresse.</p><p class="lab">Conséquence clinique</p><p>La dyspnée diffère de la douleur par sa dimension terrifiante : elle évoque une menace vitale et la peur de mourir. Les épisodes sévères, en particulier sous ventilation mécanique, activent des régions impliquées dans le stress post-traumatique.</p><div class="key"><b>Conséquence pratique.</b> L’explication, la présence et la maîtrise de l’épisode font partie du traitement, au même titre que les médicaments.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6979461/" target="_blank" rel="noopener">O’Donnell et al., 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., 2025</a>.</p></template>
<template data-pop="r06-spirale" data-title="Spirale de la dyspnée"><p class="lab">Mécanisme</p><p>Pour éviter la dyspnée d’effort, beaucoup de patients adoptent un mode de vie sédentaire. Il s’ensuit un déconditionnement musculaire étendu, un isolement social et des conséquences psychologiques, qui abaissent encore le seuil d’apparition de la dyspnée.</p><p class="lab">Conséquence</p><p>Le patient finit par ne plus s’essouffler parce qu’il ne fait plus rien : sa dyspnée devient « invisible » à l’interrogatoire.</p><div class="key"><b>Conséquence thérapeutique.</b> La réhabilitation et le réentraînement brisent le cercle ; l’ESMO recommande d’y adresser les patients atteints de cancer qui ont une maladie pulmonaire ou cardiaque associée.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6979461/" target="_blank" rel="noopener">O’Donnell et al., 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7733213/" target="_blank" rel="noopener">ESMO 2020</a>.</p></template>
<template data-pop="r06-oli" data-title="Obstruction laryngée induite"><p class="lab">Définition</p><p>Rétrécissement inapproprié, transitoire et réversible du larynx, au niveau glottique ou supraglottique, en réponse à un déclencheur externe (déclaration ERS et Société européenne de laryngologie, 2017). Les termes anciens sont « dysfonction des cordes vocales » ou « mouvement paradoxal des cordes vocales ».</p><p class="lab">Clinique</p><p>Le début est brutal, surtout inspiratoire, avec gorge serrée, oppression, toux et dysphonie. Parfums, irritants, changements de température, effort ou parole le déclenchent. Elle est plus fréquente chez la femme et touche 19 à 50 % des asthmatiques. Elle est souvent prise pour un asthme ou une réaction allergique.</p><p class="lab">Diagnostic et traitement</p><p>La laryngoscopie avec provocation est la référence. La logopédie, par une thérapie de contrôle laryngé, est le traitement le plus efficace ; la toxine botulinique est décrite dans les formes sévères.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28889105/" target="_blank" rel="noopener">Halvorsen et al., 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10567073/" target="_blank" rel="noopener">Ludlow et al., 2023</a> ; <a href="https://www.revmed.ch/view/539746/4352258/RMS_482_1486.pdf" target="_blank" rel="noopener">Lavanchy et al., 2015</a>.</p></template>
<template data-pop="r06-multimorbidite" data-title="Dyspnée multimorbide"><p class="lab">Données</p><p>Dans une série de 250 patients atteints de dyspnée chronique inexpliquée, la spirométrie et l’échocardiographie ont identifié une maladie pulmonaire ou cardiaque chez 83 % d’entre eux ; près de 40 % avaient une dyspnée de cause à la fois cardiaque et pulmonaire. Chez 129 patients âgés suivis en médecine de premier recours, les épreuves fonctionnelles, la biologie, l’échocardiographie et l’ECG ont fourni un diagnostic dans 63 % des cas.</p><p class="lab">Mécanisme</p><p>La BPCO, les pneumopathies interstitielles et les cardiopathies partagent les mêmes facteurs de risque : tabac, inflammation systémique, vieillissement.</p><div class="trap"><span class="k">Erreur fréquente</span> Le clinicien attribue toute la dyspnée à la première cause trouvée et ne cherche pas la seconde.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., 2025</a>.</p></template>
<template data-pop="r06-angor" data-title="La dyspnée, équivalent angineux"><p class="lab">Définition</p><p>La dyspnée d’effort peut traduire une ischémie myocardique chez un patient qui n’a pas de douleur thoracique typique. Cette présentation atypique est plus fréquente chez la femme, le sujet âgé et le diabétique.</p><p class="lab">Conséquence</p><p>La recherche d’une coronaropathie fait partie du bilan d’une dyspnée d’effort inexpliquée. L’ESC recommande en 2024 la coronarographie par scanner comme examen de première intention des symptômes évocateurs d’angor, y compris la dyspnée d’effort.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12171858/" target="_blank" rel="noopener">Nic Aodha Bhuí et al., Breathe (ERS) 2025, citant l’ESC 2024 sur les syndromes coronariens chroniques</a>.</p></template>
<template data-pop="r06-mmrc" data-title="Échelle de dyspnée mMRC"><p class="lab">Les cinq degrés (version française de la HAS)</p><p>Degré 0 : dyspnée pour des efforts soutenus, comme monter deux étages. Degré 1 : dyspnée lors de la marche rapide ou en pente. Degré 2 : dyspnée à la marche sur terrain plat en suivant une personne de son âge. Degré 3 : dyspnée obligeant à s’arrêter après quelques minutes ou une centaine de mètres sur terrain plat. Degré 4 : dyspnée au moindre effort.</p><p class="lab">Valeur</p><p>Chez 100 patients atteints de BPCO, le degré de l’échelle d’origine s’associait à la distance de marche, à la qualité de vie, à l’humeur et à l’autonomie, mais pas au VEMS. La différence minimale cliniquement importante est de 0,5 point.</p><div class="key"><b>Limite.</b> Le sédentaire sous-estime sa dyspnée ; le sportif garde un bon degré malgré une perte réelle.</div><p class="src">Références : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2020-01/app_323_guide_bpco_actu_2019_vf.pdf" target="_blank" rel="noopener">HAS, guide du parcours BPCO, 2019, tableau 4</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10377201/" target="_blank" rel="noopener">Bestall et al., 1999</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10567073/" target="_blank" rel="noopener">Ludlow et al., 2023</a>.</p></template>
<template data-pop="r06-echelles" data-title="Échelles d’intensité et questionnaires"><p class="lab">Intensité</p><p>L’échelle numérique de 0 (aucune dyspnée) à 10 (pire dyspnée imaginable) et l’échelle de Borg modifiée de 0 à 10 sont rapides et économisent la parole du patient. Aux urgences, la SFMU suggère leur usage. Combinée aux paramètres vitaux, l’autoévaluation de 0 à 10 prédisait l’admission en soins intensifs ou le décès avec une aire sous la courbe de 0,72.</p><p class="lab">Dimensions</p><p>Les outils explorent trois domaines : l’expérience sensorielle, la détresse affective et le retentissement. Une revue de 35 outils n’en a trouvé aucun qui reflète à lui seul toutes les conséquences de la dyspnée ; le questionnaire Dyspnoea-12, à douze questions, sépare les dimensions physique et affective.</p><div class="key"><b>Conséquence.</b> Le médecin choisit une échelle d’intensité et une échelle de retentissement, et note le cadre temporel de la mesure.</div><p class="src">Références : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, recommandation 2.2.3</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., 2025</a>.</p></template>
<template data-pop="r06-fr" data-title="Fréquence respiratoire"><p class="lab">Normal</p><p>Au repos, l’adulte respire 8 à 14 fois par minute, avec un volume courant d’environ 500 mL.</p><p class="lab">Technique</p><p>La SFMU recommande de compter la fréquence sur au moins 30 secondes, dès l’admission et pendant toute la prise en charge. Dans une étude de 78 infirmières, la mesure était exacte chez 75,7 % d’entre elles sur 30 secondes, contre 52,6 % sur 12 secondes.</p><p class="lab">Valeur</p><p>Au-delà de 25 par minute, le risque d’intubation, d’admission en réanimation et de décès hospitalier augmente.</p><div class="trap"><span class="k">Piège</span> Une fréquence élevée ne signifie pas une hyperventilation : un volume courant faible peut maintenir une PaCO₂ normale.</div><p class="src">Références : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5343732/" target="_blank" rel="noopener">Robson, 2017</a>.</p></template>
<template data-pop="r06-spo2" data-title="SpO₂ : valeur et limites"><p class="lab">Seuils</p><p>Une SpO₂ supérieure à 96 % à l’air ambiant rend peu probable une PaO₂ inférieure à 60 mmHg ; chez le patient atteint de BPCO, une SpO₂ supérieure à 92 % a la même valeur. Une SpO₂ inférieure à 92 % avait une sensibilité de 100 % et une spécificité de 86 % pour une PaO₂ inférieure à 60 mmHg.</p><p class="lab">Usage</p><p>La SFMU recommande probablement la SpO₂ seule pour apprécier l’oxygénation (grade 2+).</p><div class="key"><b>Limite.</b> La SpO₂ ne renseigne pas sur le CO₂. Lorsqu’elle est douteuse ou non mesurable, la gazométrie artérielle s’impose.</div><p class="src">Référence : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, recommandation 3.2.2 et argumentaire</a>.</p></template>
<template data-pop="r06-lutte" data-title="Signes de lutte"><p class="lab">Description</p><p>Ils traduisent les moyens mis en œuvre pour compenser une charge accrue : polypnée, recours excessif aux muscles inspiratoires extra-diaphragmatiques, tirage (dépression sus-claviculaire, sus-sternale, sous-xiphoïdienne ou intercostale), battement des ailes du nez, respiration abdominale paradoxale à l’inspiration et signe de Campbell.</p><p class="lab">Valeur</p><p>Ils précèdent l’épuisement. Leur présence avec une fréquence supérieure à 25 par minute impose une surveillance continue.</p><div class="key"><b>Piège.</b> Dans l’obstruction haute, le tirage accompagne un temps inspiratoire allongé et un stridor.</div><p class="src">Références : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, définitions</a> ; <a href="https://www.revmed.ch/view/539746/4352258/RMS_482_1486.pdf" target="_blank" rel="noopener">Lavanchy et al., 2015</a>.</p></template>
<template data-pop="r06-epuisement" data-title="Signes d’épuisement"><p class="lab">Description</p><p>L’impossibilité de finir ses phrases, le balancement thoraco-abdominal, la bradypnée et les signes d’hypercapnie annoncent la défaillance : obnubilation, ralentissement idéo-moteur, sueurs, céphalées, rougeur cutanée par vasodilatation. Le coma hypercapnique puis l’arrêt respiratoire suivent.</p><p class="lab">Conséquence pratique</p><p>Une bradypnée chez un patient qui luttait n’est pas une amélioration : elle annonce l’arrêt. Ces signes imposent un support ventilatoire ou une décision de limitation documentée.</p><p class="src">Références : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, définitions</a> ; <a href="https://www.revmed.ch/view/539746/4352258/RMS_482_1486.pdf" target="_blank" rel="noopener">Lavanchy et al., 2015</a>.</p></template>
<template data-pop="r06-auscultation" data-title="Auscultation et percussion"><p class="lab">Bruits</p><p>Les sibilants traduisent le passage de l’air dans de petites voies rétrécies ; les ronchi, une obstruction de grosses voies. Les crépitants naissent de l’ouverture brutale de petites voies aériennes : grossiers dans la pneumonie ou les bronchectasies, fins dans l’œdème pulmonaire ou la fibrose. Le stridor, aigu et inspiratoire, signe une obstruction haute.</p><p class="lab">Percussion</p><p>Une matité évoque un épanchement pleural ou une pneumonie lobaire ; un tympanisme, un pneumothorax.</p><p class="lab">Cœur</p><p>Un souffle, un galop ou un frottement orientent vers une valvulopathie, une insuffisance cardiaque ou une péricardite.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., 2025</a>.</p></template>
<template data-pop="r06-gazo" data-title="Gazométrie : quand et laquelle"><p class="lab">Gazométrie veineuse</p><p>Elle n’est pas recommandée pour apprécier l’oxygénation (grade 1−). Elle peut évaluer la capnie : une PvCO₂ inférieure à 45 mmHg rend peu probable une PaCO₂ supérieure à 50 mmHg.</p><p class="lab">Gazométrie artérielle</p><p>Elle reste la mesure de référence dans les situations complexes (grade 2+). Elle n’est pas systématique ; elle se discute en cas de détresse pour confirmer l’indication d’un support ventilatoire, lorsque la SpO₂ est douteuse, ou pour quantifier une hypercapnie lorsque la PvCO₂ est élevée.</p><p class="lab">Index ROX</p><p>Rapport de la SpO₂ sur la FiO₂, divisé par la fréquence respiratoire ; il se calcule sans gazométrie. Sous oxygénothérapie nasale à haut débit, des valeurs répétées d’au moins 4,88 s’associent à un faible risque d’intubation, des valeurs inférieures à 2,85 à un risque important.</p><p class="src">Référence : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, recommandations 3.2 et 3.3</a>.</p></template>
<template data-pop="r06-np" data-title="Peptides natriurétiques"><p class="lab">Physiologie</p><p>Le BNP et son fragment N-terminal (NT-proBNP) sont sécrétés par les myocytes ventriculaires en réponse à l’étirement.</p><p class="lab">Seuils d’exclusion</p><p>Un BNP inférieur à 100 pg/mL ou un NT-proBNP inférieur à 300 à 500 pg/mL rend l’insuffisance cardiaque aiguë peu probable ; la valeur prédictive négative est alors proche de 90 %. La SFMU recommande probablement ce dosage pour éliminer le diagnostic, sauf chez le patient obèse, et toujours avec la clinique (grade 2+).</p><div class="trap"><span class="k">Piège</span> Une valeur élevée n’est pas spécifique : une embolie pulmonaire massive ou une hypertension pulmonaire avancée l’élèvent aussi. Les seuils de la dyspnée chronique sont traités dans le cours I50.</div><p class="src">Références : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, recommandation 3.5.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., 2025</a>.</p></template>
<template data-pop="r06-echo" data-title="Échographie cardio-pulmonaire"><p class="lab">Performance</p><p>L’échographie pulmonaire surpasse la radiographie pour l’œdème pulmonaire, la pneumonie et les épanchements liquidiens ou gazeux. Pour la pneumonie communautaire, une méta-analyse rapporte une aire sous la courbe de 0,93 ; une pneumonie centrale sans atteinte périphérique peut lui échapper.</p><p class="lab">Profils</p><p>Le profil B bilatéral s’associe à l’œdème pulmonaire (rapport de cotes 7,4) ; son absence le rend peu probable (rapport de cotes 0,16). Pour le pneumothorax, le point poumon a une spécificité de 100 % mais une sensibilité de 60 %.</p><p class="lab">Limites</p><p>L’échographie cardio-pulmonaire est médiocre pour l’embolie pulmonaire. Dans une étude de 1005 patients, elle a modifié l’orientation cardiaque ou non cardiaque chez 19 % d’entre eux.</p><p class="src">Référence : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, recommandation 3.6.1 et argumentaire</a>.</p></template>
<template data-pop="r06-ep" data-title="Suspicion d’embolie pulmonaire devant une dyspnée"><p class="lab">Démarche</p><p>Chez un patient dont la suspicion est très faible, la règle PERC permet d’exclure l’embolie sans examen (grade 1+) ; dans deux études européennes, le taux de faux négatifs était de 1,2 % et de 0,1 %. Au-delà, la SFMU privilégie deux démarches récentes qui adaptent le seuil des D-dimères à la probabilité clinique, car elles réduisent le nombre d’examens sans perte de sécurité (grade 2+).</p><p class="lab">Règle de sécurité</p><p>Quelle que soit la stratégie choisie, elle est suivie jusqu’au bout.</p><div class="key"><b>Renvoi.</b> Les scores, les seuils et l’imagerie sont détaillés dans le cours I26 — Embolie pulmonaire.</div><p class="src">Référence : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, recommandation 3.1</a>.</p></template>
<template data-pop="r06-niveaux" data-title="Démarche en trois niveaux de la dyspnée chronique"><p class="lab">Niveau 1 : anamnèse et examen</p><p>Début, description, déclencheurs, signes associés, retentissement, antécédents, expositions, facteurs psychosociaux. Dans une série de 85 patients, ces seuls éléments ont permis le diagnostic dans 66 % des cas.</p><p class="lab">Niveau 2 : examens au repos</p><p>Spirométrie, volumes, DLCO, imagerie thoracique, hémogramme, peptide natriurétique, D-dimères selon le contexte, ECG, échocardiographie.</p><p class="lab">Niveau 3 : examens d’effort</p><p>Test de marche de six minutes, épreuve d’effort cardiorespiratoire, scanner dynamique en expiration. Un algorithme incluant ces examens a atteint un diagnostic chez 99 % des patients.</p><div class="key"><b>Conséquence.</b> Chaque niveau n’est franchi que si le précédent n’explique pas le symptôme.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., Breathe (ERS) 2025, figure 1</a>.</p></template>
<template data-pop="r06-tm6" data-title="Test de marche de six minutes"><p class="lab">Technique</p><p>Le patient marche le plus loin possible pendant six minutes ; le soignant enregistre la distance, la SpO₂, la fréquence cardiaque, la dyspnée et le schéma respiratoire.</p><p class="lab">Interprétation</p><p>Une chute de SpO₂ de plus de 3 % est traditionnellement considérée comme significative et impose d’en rechercher la cause. Le test est reproductible et sert au suivi, à l’indication d’un oxygène de déambulation et à la réhabilitation.</p><div class="key"><b>Limite.</b> Il ne dit pas pourquoi le patient s’arrête : il complète l’épreuve d’effort cardiorespiratoire sans la remplacer.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5343732/" target="_blank" rel="noopener">Robson, 2017</a>.</p></template>
<template data-pop="r06-cpet" data-title="Épreuve d’effort cardiorespiratoire"><p class="lab">Mesures</p><p>Ventilation minute, fréquence cardiaque, consommation d’oxygène, production de CO₂, puis rapport d’échange respiratoire, pouls d’oxygène, équivalents ventilatoires, seuil anaérobie et point de compensation respiratoire. L’ERS a standardisé le protocole chez le patient atteint de maladie pulmonaire chronique.</p><p class="lab">Valeurs normales</p><p>Le sujet sain atteint au moins 80 % de sa consommation maximale d’oxygène prédite et 80 % de sa fréquence cardiaque maximale théorique (220 moins l’âge). Il n’atteint pas 80 % de sa ventilation maximale volontaire, estimée par le VEMS multiplié par 35 : il garde une réserve ventilatoire.</p><p class="lab">Rendement</p><p>Dans une série de 72 patients inexpliqués, l’ajout d’examens d’effort a porté le rendement diagnostique de 7 % à 81 %.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., 2025</a>.</p></template>
<template data-pop="r06-obstruction" data-title="Obstruction aiguë des voies aériennes supérieures"><p class="lab">Algorithme</p><p>Évaluation primaire des signes de gravité ; oxygène par lunette ou masque ; adrénaline en aérosol ; clémastine et méthylprednisolone par voie intraveineuse ; icatibant à considérer ; traitement étiologique. Sans amélioration, la perméabilité des voies aériennes est assurée par un anesthésiste expérimenté et un spécialiste ORL : intubation, coniotomie d’urgence.</p><p class="lab">Gestes</p><p>Devant un corps étranger, la manœuvre de Heimlich est tentée d’abord, puis la laryngoscopie avec pince de Magill. Les dispositifs supraglottiques sont probablement inefficaces en cas d’obstacle sous-glottique.</p><div class="key"><b>Usage hors indication.</b> L’adrénaline en aérosol n’a pas été vérifiée dans une information professionnelle suisse pour cette voie ; sa dose est celle des protocoles locaux.</div><p class="src">Référence : <a href="https://www.revmed.ch/view/539746/4352258/RMS_482_1486.pdf" target="_blank" rel="noopener">Lavanchy et al., Revue médicale suisse 2015, figure 1 et tableau 3</a>.</p></template>

épaissie et arrondie (flèche), que l’on appelle le « signe du pouce ». En effet, l’infection bactérienne gonfle l’épiglotte et les replis ary-épiglottiques, qui rétrécissent l’orifice laryngé juste au-dessus des cordes vocales ; l’air turbulent qui franchit ce passage étroit produit le stridor inspiratoire, et la douleur explique la dysphagie et l’hypersalivation. Cependant, ce cliché ne doit jamais retarder la sécurisation des voies aériennes, car l’allonger ou l’examiner à l’abaisse-langue peut déclencher une obstruction complète. Source : <a href="https://commons.wikimedia.org/wiki/File:Epiglottitis.jpg" target="_blank" rel="noopener" data-reference-source="1">Med Chaos, Wikimedia Commons</a> ; <a href="http://creativecommons.org/publicdomain/zero/1.0/deed.en" target="_blank" rel="noopener" data-reference-source="1">licence CC0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Épidémiologie</p><p>Rare, environ un cas par million d’habitants et par an, elle touche surtout l’homme, vers 50 ans en moyenne. Elle a presque disparu chez l’enfant grâce à la vaccination.</p><p class="lab">Clinique</p><p>Fièvre élevée, dyspnée inspiratoire avec stridor, dysphagie, odynophagie, voix éteinte et hypersalivation. Le tableau peut s’installer moins brutalement que chez l’enfant.</p><p class="lab">Conduite</p><p>Une céphalosporine de troisième génération ou l’amoxicilline avec acide clavulanique est administrée immédiatement, sans attendre les prélèvements. Le patient est hospitalisé ; intubation et coniotomie doivent être possibles à tout moment. La mortalité rapportée atteint 7 %.</p><p class="src">Référence : <a href="https://www.revmed.ch/view/539746/4352258/RMS_482_1486.pdf" target="_blank" rel="noopener">Lavanchy et al., 2015</a>.</p></template>

t:auto" alt="Photographie d’un angio-œdème du visage prédominant sur la lèvre supérieure"><figcaption>Cette photographie montre un angio-œdème du visage, surtout marqué à la lèvre supérieure, chez un patient dont le déficit acquis en inhibiteur de la C1-estérase était lié à un lymphome B. Le gonflement est profond, ferme et non prurigineux, parce que le liquide s’accumule dans le derme profond et le tissu sous-cutané sous l’effet de la bradykinine, qui augmente la perméabilité des capillaires. Or, le même œdème peut toucher la langue et le larynx : c’est pourquoi une dyspnée, une voix modifiée ou un stridor imposent une prise en charge des voies aériennes sans délai. Source : <a href="https://commons.wikimedia.org/wiki/File:Angioedema_of_the_face.jpg" target="_blank" rel="noopener" data-reference-source="1">Boussetta N1*, Ghedira H2, Hamdi MS1, Ariba BY1, Metoui L1, Ghasallah I1, Zriba S2, Louzir B1, Msaddak F2, Ajili F1 and, Wikimedia Commons</a> ; <a href="https://creativecommons.org/licenses/by/4.0" target="_blank" rel="noopener" data-reference-source="1">licence CC BY 4.0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Deux mécanismes</p><p>Avec urticaire, l’angio-œdème est histaminique : il relève de l’adrénaline, d’un antihistaminique et d’un corticoïde. Sans urticaire, il est souvent bradykinique : inhibiteur de l’enzyme de conversion, plus rarement sartan, angio-œdème héréditaire ou déficit acquis en inhibiteur de la C1-estérase. Antihistaminiques et adrénaline y sont inefficaces ; l’icatibant, antagoniste du récepteur B2 de la bradykinine, est reconnu dans les formes sévères.</p><p class="lab">Données</p><p>L’angio-œdème touche 0,1 à 0,6 % des patients sous inhibiteur de l’enzyme de conversion, surtout en début de traitement. La thrombolyse d’un AVC ischémique augmente encore la bradykinine chez ces patients.</p><p class="src">Référence : <a href="https://www.revmed.ch/view/539746/4352258/RMS_482_1486.pdf" target="_blank" rel="noopener">Lavanchy et al., 2015</a>.</p></template>
<template data-pop="r06-fumees" data-title="Syndrome d’inhalation de fumées"><p class="lab">Suspicion</p><p>Brûlures de la face ou de la bouche, suie inhalée, vibrisses brûlées, voix rauque, dyspnée.</p><p class="lab">Conduite</p><p>Une intubation préventive et une bronchoscopie sont généralement justifiées, car un œdème laryngé massif peut rendre toute intubation ultérieure impossible. La gazométrie recherche systématiquement une intoxication au monoxyde de carbone ; l’oxygène est donné à haute concentration. Une défaillance neurologique ou hémodynamique avec un lactate d’au moins 5 mmol/L fait suspecter une intoxication au cyanure et administrer l’hydroxocobalamine.</p><p class="src">Référence : <a href="https://www.revmed.ch/view/539746/4352258/RMS_482_1486.pdf" target="_blank" rel="noopener">Lavanchy et al., 2015</a>.</p></template>
