<template data-pop="r06-ventilateur" data-title="Ventilateur à main dirigé vers le visage"><p class="lab">Preuve</p><p>Dans un essai croisé de 50 patients atteints de maladie avancée, cinq minutes de ventilateur dirigé vers le visage ont réduit la dyspnée sur une échelle visuelle analogique, alors que le même ventilateur dirigé vers la jambe ne l’a pas fait. Une revue de dix études portant sur 344 patients trouve un bénéfice dans six d’entre elles.</p><p class="lab">Mécanisme</p><p>L’ESMO retient comme plausibles le refroidissement de récepteurs nasaux, qui modère les signaux adressés aux centres respiratoires, et le gain d’autonomie face aux épisodes imprévus.</p><p class="lab">Place</p><p>L’ESMO le recommande seul chez le patient sans hypoxémie ou en complément de l’oxygène (II, B) ; l’ERS le suggère sur des preuves de très faible certitude. Bon marché et sans risque, il s’utilise quelle que soit la saturation.</p><div class="trap"><span class="k">Piège</span> Un ventilateur de pièce expose à un risque infectieux : en fin de vie, la directive bernoise de 2023 le réserve à la chambre individuelle, avec les règles d’hygiène de l’institution.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20471544/" target="_blank" rel="noopener">Galbraith et al., 2010 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7733213/" target="_blank" rel="noopener">ESMO 2020</a>.</p></template>
<template data-pop="r06-techniques" data-title="Techniques respiratoires"><p class="lab">Contenu</p><p>Respiration à lèvres pincées, respiration diaphragmatique, respiration issue du yoga, positions de soulagement, fractionnement des activités. Elles sont enseignées par un physiothérapeute.</p><p class="lab">Preuve</p><p>Une revue systématique préparatoire à la recommandation ERS de 2024 conclut que les techniques respiratoires réduisent la dyspnée dans plusieurs maladies respiratoires, avec un effet modeste et une certitude faible ; la respiration à lèvres pincées, la respiration diaphragmatique et la respiration du yoga sont les plus prometteuses.</p><p class="lab">Conséquence</p><p>Le patient devient acteur de son traitement : il gagne un sentiment de contrôle sur un symptôme qui l’effraie.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11522974/" target="_blank" rel="noopener">Holland et Lewis, Eur Respir Rev 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7733213/" target="_blank" rel="noopener">ESMO 2020</a>.</p></template>
<template data-pop="r06-oxygene" data-title="Oxygène et dyspnée"><p class="lab">Preuves</p><p>Chez 239 patients atteints de maladie limitant l’espérance de vie, avec une PaO₂ supérieure à 7,3 kPa, l’oxygène par lunette nasale n’a pas mieux soulagé la dyspnée que l’air ambiant administré de la même manière. Une méta-analyse de 2025 montre un bénéfice pendant l’effort en laboratoire, mais aucun effet démontré sur la dyspnée de la vie quotidienne ni sur la qualité de vie.</p><p class="lab">Recommandations</p><p>L’ERS 2024 suggère indifféremment d’administrer ou non l’oxygène dans ce but (recommandation conditionnelle). L’ESMO 2020 ne le recommande pas lorsque la SpO₂ de repos atteint 90 % (II, D). La recommandation Bigorio de 2003 jugeait l’oxygène parfois efficace même sans hypoxémie ; les textes plus récents l’emportent.</p><div class="key"><b>Conséquence pratique.</b> L’oxygène traite l’hypoxémie. En fin de vie, il assèche les muqueuses et donne soif ; la directive bernoise de 2023 recommande la retenue.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2962424/" target="_blank" rel="noopener">Abernethy et al., Lancet 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11880903/" target="_blank" rel="noopener">Ahmadi et al., Eur Respir Rev 2025</a> ; <a href="https://www.palliative.ch/public/dokumente/was_wir_tun/angebote/bigorio_best_practice/BIGORIO_2003_-_Recommandations_sur_la_dyspnee.pdf" target="_blank" rel="noopener">Bigorio 2003, texte en vigueur sur palliative.ch</a>.</p></template>
<template data-pop="r06-contentieux-opioides" data-title="Contentieux : les opioïdes contre la dyspnée"><p class="lab">Ce que disent les textes</p><p><b>palliative.ch, Bigorio 2003</b> : la morphine est le premier choix, à faible dose, avec des réserves. <b>ESMO 2020</b>, chez le patient atteint de cancer : morphine orale régulière à faible dose en première intention pharmacologique de la dyspnée chronique sévère, 10 à 30 mg par 24 heures (II, B). <b>ERS 2024</b>, dans les maladies respiratoires graves, surtout la BPCO : ne pas utiliser les opioïdes (recommandation conditionnelle, très faible certitude).</p><p class="lab">Les données qui ont changé la conduite</p><p>La méta-analyse de 2024 (17 essais) montre un effet pendant l’effort en laboratoire, mais aucun effet sur la dyspnée quotidienne, la toux ou la qualité de vie, avec davantage de nausées, de constipation et de somnolence. Dans l’essai BEAMS, 8 ou 16 mg par jour de morphine à libération prolongée n’ont pas réduit la pire dyspnée chez 160 patients atteints de BPCO. L’essai MORDYC a amélioré l’état de santé, et la pire dyspnée seulement aux degrés 3 et 4 de l’échelle mMRC.</p><p class="lab">Arbitrage</p><p>La source primaire applicable la plus récente l’emporte. Dans une maladie respiratoire grave non cancéreuse, c’est l’ERS 2024 : pas d’opioïde systématique ; un essai individuel reste une décision partagée et documentée. Chez le patient atteint de cancer, l’ESMO 2020 reste le texte européen le plus récent. Dans les derniers jours de vie, aucun essai ne répond ; la pratique suisse de palliative.ch s’applique. Dans tous les cas, l’usage est hors indication en Suisse.</p><p class="src">Textes en vigueur : <a href="https://pubmed.ncbi.nlm.nih.gov/38719772/" target="_blank" rel="noopener">ERS 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7733213/" target="_blank" rel="noopener">ESMO 2020</a> ; <a href="https://www.palliative.ch/public/dokumente/was_wir_tun/angebote/bigorio_best_practice/BIGORIO_2003_-_Recommandations_sur_la_dyspnee.pdf" target="_blank" rel="noopener">Bigorio 2003</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11462312/" target="_blank" rel="noopener">Smallwood et al., 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9682426/" target="_blank" rel="noopener">Ekström et al., essai BEAMS, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7432282/" target="_blank" rel="noopener">Verberkt et al., essai MORDYC, 2020</a>.</p></template>
<template data-pop="r06-contentieux-asv" data-title="Contentieux : servo-ventilation et apnée centrale de l’insuffisance cardiaque"><p class="lab">L’essai SERVE-HF (2015)</p><p>Chez 1325 patients ayant une fraction d’éjection ventriculaire gauche d’au plus 45 % et une apnée du sommeil à prédominance centrale, la servo-ventilation auto-adaptative n’a pas réduit le critère principal (54,1 % contre 50,8 %). La mortalité totale (rapport de risque 1,28) et cardiovasculaire (1,34) ont augmenté. Une revue ERS de 2024 en déduit une contre-indication lorsque la fraction d’éjection est inférieure à 45 %.</p><p class="lab">La déclaration ERS et Société européenne de recherche sur le sommeil (2025)</p><p>Les appareils actuels n’auraient pas d’effet négatif sur les critères cardiovasculaires majeurs et amélioreraient la qualité de vie. Les experts les utilisent après optimisation du traitement de la cardiopathie et échec d’une pression positive continue, dans l’insuffisance cardiaque à fraction d’éjection préservée et, en centre expert seulement, entre 30 et 45 %. En cas d’insuffisance systolique sévère, elle n’est envisagée que dans une démarche palliative.</p><p class="lab">Arbitrage</p><p>La déclaration de 2025 est la plus récente ; elle décrit une pratique d’experts, non une recommandation formelle. La position de la recommandation ESC sur l’insuffisance cardiaque n’a pas été relue pour ce cours.</p><p class="src">Textes : <a href="https://pubmed.ncbi.nlm.nih.gov/26323938/" target="_blank" rel="noopener">Cowie et al., SERVE-HF, 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10966472/" target="_blank" rel="noopener">Randerath et al., 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40571320/" target="_blank" rel="noopener">Randerath et al., déclaration 2025 (résumé)</a>.</p></template>
<template data-pop="r06-altitude" data-title="Respiration périodique d’altitude"><p class="lab">Mécanisme</p><p>L’hypoxie hypobare stimule les chémorécepteurs périphériques ; l’hyperventilation qui en résulte abaisse le CO₂ sous le seuil d’apnée. Le gain de boucle augmente, mais le temps circulatoire reste normal : les apnées et les cycles sont plus courts que dans l’insuffisance cardiaque.</p><p class="lab">Fréquence</p><p>Elle survient fréquemment au-dessus de 2500 m et touche toutes les personnes à 6850 m.</p><div class="key"><b>Conséquence.</b> Une respiration périodique nocturne chez un randonneur en cabane d’altitude n’a pas la même signification que chez un insuffisant cardiaque en plaine.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10966472/" target="_blank" rel="noopener">Randerath et al., 2024</a>.</p></template>
<template data-pop="r06-nijmegen" data-title="Questionnaire de Nijmegen"><p class="lab">Contenu</p><p>Seize symptômes associés à l’hyperventilation, cotés de 0 à 4 selon leur fréquence, soit un total sur 64. Un score supérieur à 23 est considéré comme positif.</p><p class="lab">Usage</p><p>Conçu pour repérer les patients qui bénéficieraient d’une rééducation respiratoire, il est rapide. Ses auteurs ne l’ont jamais présenté comme un test diagnostique isolé : il s’associe à la mesure du CO₂ de fin d’expiration.</p><div class="trap"><span class="k">Piège</span> Beaucoup d’asthmatiques ont un score élevé, peut-être par mauvais contrôle de leur asthme. Le questionnaire n’est validé que pour le syndrome d’hyperventilation, pas pour toutes les formes de respiration dysfonctionnelle.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5343732/" target="_blank" rel="noopener">Robson, 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10567073/" target="_blank" rel="noopener">Ludlow et al., 2023, tableau 2</a>.</p></template>
<template data-pop="r06-provocation" data-title="Test de provocation d’hyperventilation"><p class="lab">Technique</p><p>Après une spirométrie, le patient respire trois minutes au repos, hyperventile volontairement trois minutes, puis récupère trois minutes, sous capnographie. L’hyperventilation vise un CO₂ de fin d’expiration proche de 2,65 kPa, ou une baisse de 50 % de la valeur de repos, pendant au moins 90 secondes. Le capnographe est préféré à la mesure transcutanée, plus lente.</p><p class="lab">Interprétation</p><p>Le test est négatif si le CO₂ de repos est normal et y revient pendant la récupération. Une récupération lente traduit une hyperventilation aiguë. Un CO₂ de fin d’expiration de repos inférieur à 4,0 kPa traduit une hyperventilation chronique.</p><div class="key"><b>Limites.</b> Le test manque de spécificité ; l’appréhension peut le fausser ; en cas d’obstruction bronchique, le CO₂ de fin d’expiration sous-estime la PaCO₂. L’épreuve d’effort cardiorespiratoire en est l’alternative.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5343732/" target="_blank" rel="noopener">Robson, Breathe (ERS) 2017</a>.</p></template>
<template data-pop="r06-reeducation" data-title="Rééducation de la respiration dysfonctionnelle"><p class="lab">Contenu</p><p>Explication de la physiopathologie et réassurance ; observation de son propre schéma respiratoire ; rééducation par respiration nasale, diaphragmatique et à lèvres pincées ; volume courant adapté ; gestion du stress et des tensions ; posture ; respiration coordonnée au mouvement et à la parole.</p><p class="lab">Organisation</p><p>Le physiothérapeute conduit la rééducation au sein d’une équipe qui associe pneumologue, logopédiste et psychologue. Le traitement des maladies nasales et du reflux, qui aggravent les symptômes, fait partie de la prise en charge.</p><p class="lab">Résultat</p><p>Un traitement spécialisé permet, dans la plupart des cas, un bon contrôle de la ventilation et la disparition des symptômes.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10567073/" target="_blank" rel="noopener">Ludlow et al., 2023, tableau 3</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19127893/" target="_blank" rel="noopener">Sauty, 2008 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32558453/" target="_blank" rel="noopener">Du Pasquier et al., 2020 (résumé)</a>.</p></template>
<template data-pop="r06-hoquet-tt" data-title="Traitement du hoquet persistant"><p class="lab">Démarche</p><p>Le hoquet aigu cède souvent à des manœuvres physiques. Le hoquet persistant se traite d’abord par sa cause ; un essai empirique de traitement antireflux est raisonnable.</p><p class="lab">Médicaments</p><p>Une revue systématique zurichoise de 15 études et 341 patients ne trouve aucun essai de puissance suffisante. Le baclofène et le métoclopramide sont soutenus par de petits essais contre placebo ; la gabapentine et la chlorpromazine, par des données d’observation. Le baclofène et la gabapentine, mieux tolérés au long cours, sont proposés en première intention ; le métoclopramide et la chlorpromazine en réserve. Une revue de 2026 rapporte des résolutions avec la chlorpromazine, l’halopéridol et l’olanzapine, sans essai randomisé.</p><div class="key"><b>Statut suisse.</b> Aucun de ces médicaments n’est autorisé en Suisse pour le hoquet ; aucune information professionnelle suisse de la chlorpromazine n’a été trouvée sur AmiKo au 09.10.2026.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26307025/" target="_blank" rel="noopener">Steger et al., 2015 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13340612/" target="_blank" rel="noopener">Alshargi et al., 2026</a>.</p></template>
<template data-pop="r06-crise" data-title="Crise dyspnéique de fin de vie"><p class="lab">Conduite (directive bernoise de 2023)</p><p>Morphine 2,5 à 5 mg par voie sous-cutanée, ou 2,5 mg par voie intraveineuse, répétable toutes les 30 minutes ; chez le patient déjà traité, 10 à 16 % de la dose journalière. Si l’angoisse domine, midazolam 0,5 à 1 mg sous-cutané ou intraveineux, répétable toutes les 20 minutes, toujours avec la morphine. Lorsque la dyspnée est très intense d’emblée, une perfusion continue de 10 à 15 mg de morphine par jour est proposée.</p><p class="lab">Anticipation</p><p>Bigorio prescrit systématiquement une réserve, donnée lors d’une crise ou 45 minutes à 1 heure avant un geste qui aggrave la dyspnée, comme la toilette. Le Centre hospitalier universitaire vaudois propose, en cas de dyspnée asphyxiante, la morphine sous-cutanée toutes les 20 minutes si nécessaire.</p><div class="key"><b>Statut.</b> Ces usages sont hors indication suisse. Si tout échoue, la sédation palliative se discute selon la recommandation Bigorio dédiée ; l’ESMO l’admet aussi dans les derniers jours (IV, C).</div><p class="src">Références : <a href="https://www.spitalfmi.ch/fileadmin/images/Fachbereiche/Palliative_Care/Empfehlungen_f%C3%BCr_Fachpersonen/Palliative_Care_Dyspnoe_2023.pdf" target="_blank" rel="noopener">directive 2023</a> ; <a href="https://www.palliative.ch/public/dokumente/was_wir_tun/angebote/bigorio_best_practice/BIGORIO_2003_-_Recommandations_sur_la_dyspnee.pdf" target="_blank" rel="noopener">Bigorio 2003</a> ; <a href="https://www.chuv.ch/fileadmin/sites/spl/documents/palliative_flash_11_opioides_et_dyspnee.pdf" target="_blank" rel="noopener">Palliative Flash n° 11, 2008</a>.</p></template>

" width="340" height="305" loading="lazy" decoding="async" style="max-width:100%;height:auto" alt="Radiographie thoracique d’œdème pulmonaire avec lignes de Kerley B"><figcaption>Cette radiographie montre une surcharge pulmonaire d’origine cardiaque, avec de fines lignes horizontales aux bases (lignes de Kerley B). Ces lignes correspondent aux septums interlobulaires épaissis par le liquide, car une pression capillaire pulmonaire élevée chasse l’eau vers l’interstitium avant de remplir les alvéoles. Elle illustre donc le principal diagnostic différentiel des râles agoniques : des crépitants fins et une orthopnée orientent vers un œdème pulmonaire qui peut être traité, alors que les râles agoniques naissent des sécrétions que le mourant ne peut plus évacuer. Source : <a href="https://commons.wikimedia.org/wiki/File:Chest_radiograph_of_a_lung_with_Kerley_B_lines.jpg" target="_blank" rel="noopener" data-reference-source="1">Mikael Häggström, Wikimedia Commons</a> ; <a href="http://creativecommons.org/publicdomain/zero/1.0/deed.en" target="_blank" rel="noopener" data-reference-source="1">licence CC0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Définition</p><p>Respiration bruyante due aux turbulences de l’air dans les sécrétions accumulées dans l’oropharynx et les bronches d’un patient mourant qui ne peut plus tousser ni avaler. Leur incidence est de 40 à 90 % ; les tumeurs pulmonaires ou cérébrales y exposent.</p><p class="lab">Mesures (Bigorio)</p><p>Expliquer la cause aux proches, que le bruit angoisse ; installer le patient sur le côté ou assis ; éviter l’aspiration ; limiter l’hydratation au nécessaire, par exemple 500 mL par 24 heures ; soigner la bouche. Un anticholinergique par voie sous-cutanée, glycopyrronium ou butylscopolamine, est efficace dans environ 80 % des cas.</p><div class="key"><b>Limite.</b> Ces doses proviennent de Bigorio 2003 ; elles n’ont pas été revérifiées dans une information professionnelle suisse pour ce cours.</div><p class="src">Référence : <a href="https://www.palliative.ch/public/dokumente/was_wir_tun/angebote/bigorio_best_practice/BIGORIO_2003_-_Recommandations_sur_la_dyspnee.pdf" target="_blank" rel="noopener">Bigorio 2003, thème spécial</a>.</p></template>
<template data-pop="r06-d-morphine" data-title="Morphine"><p class="lab">Statut suisse</p><p>Sevredol® (comprimés) et Morphini HCl Streuli® (solution injectable et gouttes orales, 10 ou 20 mg/mL, 20 gouttes par mL) sont autorisés pour les douleurs moyennes à fortes. La dyspnée est hors indication.</p><p class="lab">Mécanisme</p><p>Agoniste des récepteurs µ ; dans la dyspnée, il modifierait le traitement central des signaux afférents ; dans l’œdème pulmonaire, il réduirait aussi la précharge.</p><p class="lab">Posologie</p><p>Pour la douleur, Sevredol® débute à 10 mg toutes les 4 heures. Pour la dyspnée : ESMO 10 à 30 mg par 24 heures ; Bigorio 5 mg toutes les 4 heures dans la version française, 2,5 mg dans la version allemande, 2,5 à 3 mg chez le sujet très âgé ; voie sous-cutanée à 50 % de la dose orale.</p><p class="lab">Contre-indications et risques</p><p>Sevredol® : dépression respiratoire sévère avec hypoxie ou hypercapnie, BPCO ou asthme sévères, iléus. Morphini HCl Streuli® : prudence extrême en cas de maladie obstructive. Effets : constipation, nausées, somnolence, dépression respiratoire, apnée centrale du sommeil.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Sevredol® (05.2024) et Morphini HCl Streuli® (01.2026), consultées le 09.10.2026</a> ; <a href="https://www.chuv.ch/fileadmin/sites/spl/documents/palliative_flash_11_opioides_et_dyspnee.pdf" target="_blank" rel="noopener">Palliative Flash n° 11</a>.</p></template>
<template data-pop="r06-d-hydromorphone" data-title="Hydromorphone"><p class="lab">Statut suisse</p><p>Palladon® et Palladon® Retard sont autorisés pour les douleurs ; la dyspnée est hors indication.</p><p class="lab">Mécanisme</p><p>Dérivé semi-synthétique de la morphine, agoniste pur à affinité prépondérante pour les récepteurs µ.</p><p class="lab">Posologie</p><p>Pour la douleur, chez le patient naïf : 1,3 ou 2,6 mg toutes les 4 heures, ou 4 mg de la forme retard toutes les 12 heures. 1,3 mg d’hydromorphone orale correspond à environ 10 mg de sulfate de morphine oral. La dose est réduite lorsque la clairance de la créatinine est inférieure à 30 mL/min.</p><p class="lab">Place et risques</p><p>Bigorio et le Centre hospitalier universitaire vaudois en font l’alternative à la morphine en cas d’effets indésirables. Contre-indications identiques à celles de Sevredol® ; constipation (25 %) et nausées (24 %) très fréquentes.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Palladon®, mise à jour 04.2026, consultée le 09.10.2026</a>.</p></template>
<template data-pop="r06-d-lorazepam" data-title="Lorazépam"><p class="lab">Statut suisse</p><p>Temesta® et Temesta Expidet® (lyophilisat oral) sont autorisés dans les états où l’anxiété joue un rôle majeur. La dyspnée n’est pas une indication ; l’anxiété qui l’accompagne peut l’être.</p><p class="lab">Posologie</p><p>Bigorio : 0,5 à 1 mg toutes les 8 heures par voie sublinguale, à titrer, lorsque la dyspnée exprime une panique ou coexiste avec l’angoisse. Dose initiale réduite d’environ 50 % chez le sujet âgé ou affaibli.</p><p class="lab">Contre-indications</p><p>Myasthénie, insuffisance respiratoire sévère, apnée du sommeil, insuffisance rénale ou hépatique grave, intoxication aiguë par des dépresseurs centraux.</p><div class="trap"><span class="k">Piège</span> En présence d’un délirium, Bigorio préfère un neuroleptique à une benzodiazépine.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Temesta®, mise à jour 11.2022, consultée le 09.10.2026</a>.</p></template>
<template data-pop="r06-d-midazolam" data-title="Midazolam"><p class="lab">Statut suisse</p><p>Dormicum® injectable est autorisé pour la sédation vigile, la prémédication, l’anesthésie et la sédation prolongée en soins intensifs. La voie sous-cutanée et l’usage contre la dyspnée sont hors indication.</p><p class="lab">Mécanisme</p><p>Benzodiazépine d’action rapide et brève ; renforcement de la transmission inhibitrice du GABA ; effets hypnotique, sédatif, anxiolytique, anticonvulsivant et myorelaxant.</p><p class="lab">Risques</p><p>Dépression respiratoire, apnée, arrêt respiratoire ou cardiaque, surtout après 60 ans, en cas de maladie respiratoire ou d’insuffisance cardiaque, et lors d’une injection rapide ou à forte dose. Le hoquet figure parmi ses effets indésirables.</p><p class="lab">Usage palliatif</p><p>Crise dyspnéique avec angoisse : 0,5 à 1 mg, toujours avec la morphine (directive bernoise de 2023).</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Dormicum®, mise à jour 04.2026, consultée le 09.10.2026</a>.</p></template>
<template data-pop="r06-d-baclofene" data-title="Baclofène"><p class="lab">Statut suisse</p><p>Liorésal® est autorisé pour la spasticité grave ; le hoquet est hors indication.</p><p class="lab">Posologie de référence</p><p>Pour la spasticité, 5 mg trois fois par jour, puis augmentation de 5 mg par prise tous les trois jours. Aucune posologie suisse n’existe pour le hoquet.</p><p class="lab">Risques</p><p>Élimination rénale sous forme inchangée : prudence chez l’insuffisant rénal. Faiblesse, chutes, confusion. Après plus de deux à trois mois, l’arrêt se fait par paliers sur environ trois semaines, car un arrêt brusque peut provoquer anxiété, confusion, hallucinations, convulsions ou hyperthermie.</p><p class="lab">Place</p><p>Première intention du hoquet persistant selon la revue de Steger, avec la gabapentine.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Liorésal®, mise à jour 01.2025, consultée le 09.10.2026</a>.</p></template>
<template data-pop="r06-d-gabapentine" data-title="Gabapentine"><p class="lab">Statut suisse</p><p>Neurontin® est autorisé dans l’épilepsie focale et les douleurs neuropathiques de l’adulte ; le hoquet est hors indication.</p><p class="lab">Adaptation rénale</p><p>Dose journalière en trois prises : 600 à 1200 mg pour une clairance de 50 à 79 mL/min ; 300 à 900 mg de 30 à 49 ; 150 à 600 mg de 15 à 29 ; 150 à 300 mg en dessous de 15 mL/min.</p><p class="lab">Risques</p><p>Somnolence ; dépression respiratoire de fréquence inconnue, à considérer chez le patient qui reçoit aussi un opioïde.</p><p class="lab">Place</p><p>Première intention du hoquet persistant selon la revue de Steger, avec le baclofène.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Neurontin®, mise à jour 04.2025, consultée le 09.10.2026</a>.</p></template>
<template data-pop="r06-d-metoclopramide" data-title="Métoclopramide"><p class="lab">Statut suisse</p><p>Paspertin® est autorisé contre les nausées et vomissements ; le hoquet est hors indication.</p><p class="lab">Posologie</p><p>10 mg jusqu’à trois fois par jour, au plus 30 mg par jour ou 0,5 mg/kg, pendant au plus cinq jours. Dose réduite de 50 % si la clairance de la créatinine est de 15 à 60 mL/min, de 75 % en dessous de 15 mL/min.</p><p class="lab">Risque</p><p>Au-delà de cinq jours, le risque de dyskinésies tardives potentiellement irréversibles augmente.</p><p class="lab">Place</p><p>Réserve dans le hoquet persistant ; un petit essai contre placebo le soutient.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Paspertin®, mise à jour 01.2020, consultée le 09.10.2026</a>.</p></template>
<template data-pop="pareto-r06-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="r06-0,r06-1,r06-2,r06-3,r06-4,r06-5,r06-6"></p><ul><li>La dyspnée est un vécu rapporté par le patient ; la détresse se voit, l’insuffisance respiratoire se mesure.</li><li>Aiguë en minutes ou heures, chronique en mois ; syndrome chronique si elle persiste malgré le traitement optimal et handicape.</li><li>Stridor : voies hautes ; sifflement : bronches ; Cheyne-Stokes : contrôle instable ; Kussmaul : acidose ; hoquet : myoclonie et fermeture glottique.</li><li>Elle naît d’un désaccord entre commande et ventilation obtenue, amplifié par l’émotion.</li><li>Cinq urgences d’abord : pneumothorax, embolie, insuffisance cardiaque aiguë, asthme grave, obstruction haute ; 40 % des dyspnées chroniques sont multimorbides.</li><li>Interroger sur les activités abandonnées ; quantifier par l’échelle mMRC et une échelle de 0 à 10.</li><li>Fréquence respiratoire supérieure à 25 sur 30 secondes, SpO₂, vigilance et épuisement mesurent la gravité.</li></ul></template>
<template data-pop="pareto-r06-diag" data-title="Pareto — Diagnostic, urgences et traitement"><p class="ratio" data-cover="r06-7,r06-8,r06-9"></p><ul><li>Aigu : SpO₂, peptide natriurétique bas pour exclure, échographie, ECG, démarche validée de l’embolie.</li><li>Chronique : anamnèse, puis examens au repos, puis examens d’effort.</li><li>Gravité : patient assis, oxygène, surveillance continue, avis de réanimation.</li><li>Stridor : calme, oxygène, adrénaline en aérosol, méthylprednisolone, anesthésiste et ORL.</li><li>Traiter la cause ; ventilateur, techniques respiratoires, réentraînement ; oxygène seulement si hypoxémie.</li><li>Opioïdes : oui dans le cancer (ESMO), non systématiques dans les maladies respiratoires (ERS 2024), hors indication en Suisse.</li></ul></template>
<template data-pop="pareto-r06-tt" data-title="Pareto — Anomalies respiratoires et fin de vie"><p class="ratio" data-cover="r06-10,r06-11,r06-12"></p><ul><li>Stridor inspiratoire : glotte ou au-dessus ; biphasique : sous-glottique.</li><li>Obstruction laryngée induite : imite l’asthme, laryngoscopie avec provocation, logopédie.</li><li>Cheyne-Stokes : CO₂ sous le seuil d’apnée et temps circulatoire long ; d’abord optimiser le traitement cardiaque.</li><li>Hyperventilation : PaCO₂ basse, diagnostic d’exclusion, Nijmegen et capnographie, rééducation.</li><li>Hoquet de plus de 48 heures : bilan étiologique, antireflux, puis baclofène ou gabapentine hors indication.</li><li>Fin de vie : mesures générales, opioïde et midazolam titrés avec réserves, explication aux proches.</li></ul></template>
<template data-pop="pareto-r06-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="r06-13,r06-14"></p><ul><li>Suivi avec la même échelle ; différence importante de 0,5 point sur l’échelle mMRC.</li><li>Sujet âgé, insuffisant rénal, BPCO sévère : doses réduites, décision documentée.</li><li>Insuffisance respiratoire aiguë : PaO₂ inférieure à 60 mmHg ou SpO₂ inférieure à 90 % à l’air.</li><li>Seuils : SpO₂ supérieure à 96 %, PvCO₂ inférieure à 45 mmHg, NT-proBNP inférieur à 300 à 500 pg/mL.</li></ul></template>
<template data-pop="pareto-r06-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="r06-e-1,r06-e-2,r06-e-3"></p><ul><li>Le symptôme se mesure par le patient ; chaque étage a son examen de référence.</li><li>Gazométrie veineuse pour le CO₂, artérielle en situation complexe.</li><li>Peptide natriurétique : exclusion, non affirmation.</li><li>Profil B bilatéral : œdème ; échographie médiocre pour l’embolie.</li><li>Test de marche : chute de plus de 3 % significative ; épreuve d’effort si tout est normal au repos.</li></ul></template>
<template data-pop="pareto-r06-pharm" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="r06-p-1,r06-p-2,r06-p-3,r06-p-4"></p><ul><li>Aucun médicament autorisé en Suisse pour la dyspnée ni le hoquet : usage hors indication documenté.</li><li>Morphine : 10 à 30 mg par 24 heures dans le cancer ; 2,5 à 5 mg toutes les 4 heures selon Bigorio ; réserve de 10 %.</li><li>Sevredol® et Palladon® contre-indiqués dans la BPCO ou l’asthme sévères.</li><li>Opioïde plus benzodiazépine : sédation, dépression respiratoire, surveillance étroite.</li><li>Pas de morphine nébulisée, pas de benzodiazépine en première intention, pas d’oxygène sans hypoxémie.</li></ul></template>
