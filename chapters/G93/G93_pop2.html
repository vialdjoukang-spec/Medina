<template data-pop="g93-mannitol" data-title="Mannitol 20 % : monographie">
<div class="lab">Mécanisme</div><p>Le mannitol est filtré par le rein et non réabsorbé : il provoque une diurèse osmotique, avec abaissement de la pression intraoculaire et diminution de l’œdème cérébral. Le transfert d’eau qu’il entraîne peut abaisser la natrémie.</p>
<div class="lab">Preuves</div><p>L’osmothérapie (mannitol ou sérum salé hypertonique) abaisse la pression intracrânienne, mais son effet sur le pronostic reste incertain selon la revue de 2019.</p>
<div class="lab">Posologie</div><p>Hypertension intracrânienne : 1 à 2 g/kg en 30 à 60 minutes (par exemple 500 mL de Mannitol 20 % en 1 heure) ; au maximum 500 mL en 24 heures en contexte d’oligurie ; voie intraveineuse seule. Indications incluant l’hypertension intracrânienne et l’osmothérapie avec prévention d’un œdème cérébral.</p>
<div class="lab">Contre-indications</div><p>Insuffisance cardiaque, congestion ou œdème pulmonaire, déshydratation importante, hémorragie cérébrale (sauf craniotomie), anurie ne répondant pas à une dose-test, hyperosmolarité plasmatique préexistante, troubles de la barrière hémato-méningée.</p>
<div class="lab">Surveillance</div><p>Pression veineuse centrale, fonction rénale, électrolytes et trou osmotique. Le produit peut masquer une hypovolémie ; le risque d’insuffisance rénale augmente en cas de néphropathie ou de médicaments néphrotoxiques.</p>
<p class="src">Références : information professionnelle suisse Mannitol 20 % B. Braun, Swissmedic, novembre 2025 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6309515/" target="_blank" rel="noopener">Jha et al., 2019</a>.</p></template>

<template data-pop="g93-acetazolamide" data-title="Acétazolamide (Diamox®) : monographie">
<div class="lab">Place</div><p>Traitement de première ligne de l’hypertension intracrânienne idiopathique selon la recommandation européenne 2018. L’information professionnelle suisse ne nomme pas cette maladie ; parmi les indications figure « œdèmes cérébraux ». L’usage dans l’HII est donc appuyé sur la recommandation, non sur le libellé suisse.</p>
<div class="lab">Preuves</div><p>Seul médicament évalué dans des essais randomisés ; la revue Cochrane 2015 conclut à un bénéfice modeste avec des preuves insuffisantes. L’essai IIHTT a montré un bénéfice sur le champ visuel en cas de perte visuelle légère. Aucun effet sur le score de retentissement de la céphalée.</p>
<div class="lab">Posologie</div><p>Comprimés de 250 mg. La dose de l’HII n’a pas été extraite de l’information professionnelle. Repères de la littérature : plus de 40 % des patients de l’essai IIHTT à 4 g/jour, dose souvent mal tolérée ; 48 % d’arrêts à 1500 mg dans des études antérieures.</p>
<div class="lab">Effets indésirables</div><p>Paresthésies, dysgueusie, vomissements, diarrhée, malaise, fatigue, dépression. Mises en garde de l’information professionnelle : réactions cutanées graves (syndrome de Stevens-Johnson, nécrolyse épidermique toxique, pustulose exanthématique aiguë généralisée), agranulocytose, anémie aplasique, hyponatrémie, hypokaliémie, acidose métabolique, lithiase rénale, œdème pulmonaire non cardiogénique, idées suicidaires, épanchement choroïdien.</p>
<div class="lab">Contre-indications</div><p>Hyponatrémie, hypokaliémie, insuffisance rénale ou hépatique grave (dont cirrhose), insuffisance surrénalienne, acidose hyperchlorémique, hypersensibilité aux sulfamides.</p>
<div class="lab">Grossesse et surveillance</div><p>À ne pas utiliser, surtout au premier trimestre, sauf nécessité absolue ; passage dans le lait maternel. Formule sanguine et électrolytes contrôlés avant et pendant le traitement.</p>
<p class="src">Références : information professionnelle suisse Diamox®, Swissmedic, juillet 2026 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6755569/" target="_blank" rel="noopener">Fédération européenne des céphalées, 2018</a>.</p></template>

<template data-pop="g93-topiramate" data-title="Topiramate et autres traitements de l’hypertension idiopathique">
<div class="lab">Topiramate</div><p>Une étude ouverte (40 patients) l’a comparé à l’acétazolamide avec équivalence. Il favorise la perte de poids. Il est contre-indiqué pendant la grossesse. Il peut aussi servir à la prophylaxie de la céphalée, avec le candésartan et la toxine onabotulinique.</p>
<div class="lab">Autres moyens</div><p>Le furosémide, le bumétanide et l’amiloride reposent sur des données animales ou des séries minimes ; l’octréotide sur une étude ouverte de 26 patients. Ils ne constituent pas des traitements établis.</p>
<div class="lab">Limite</div><p>L’information professionnelle suisse du topiramate n’a pas été lue ; l’hypertension idiopathique n’est pas dans son libellé selon ce dossier. Aucune dose n’est donnée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6755569/" target="_blank" rel="noopener">Fédération européenne des céphalées, 2018</a>.</p></template>

<template data-pop="g93-antiepileptiques" data-title="Lévétiracétam et valproate de sodium après arrêt cardiaque">
<div class="lab">Indication</div><p>Traitement des convulsions après un arrêt cardiaque, en première ligne avec des sédatifs, après diagnostic et suivi par électroencéphalogramme. Il n’existe pas de prophylaxie systématique.</p>
<div class="lab">Limite</div><p>La recommandation 2021 ne donne pas de posologie ; ce cours n’en propose aucune. Les mises en garde propres à chaque produit sont à lire dans son information professionnelle.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993077/" target="_blank" rel="noopener">ERC et ESICM 2021</a>.</p></template>

<template data-pop="g93-aspirine" data-title="Aspirine® : restriction liée au syndrome de Reye">
<div class="lab">Mécanisme du risque</div><p>Le syndrome de Reye est une encéphalopathie potentiellement mortelle, dont les principaux symptômes sont de forts vomissements et des troubles de la conscience et de la fonction hépatique. Le lien causal avec l’aspirine est jugé insuffisamment établi dans une revue de 2007 ; la restriction suisse reste une règle de prudence.</p>
<div class="lab">Règle</div><p>Chez les adolescents dès 12 ans avec fièvre ou infection virale, l’aspirine n’est utilisée que sur prescription et en deuxième intention. Les comprimés à croquer et le granulé ne sont pas indiqués avant 12 ans. Le syndrome de Reye figure parmi les effets indésirables très rares.</p>
<p class="src">Références : information professionnelle suisse Aspirine®, Swissmedic, septembre 2024 ; <a href="https://doi.org/10.2165/00148581-200709030-00008" target="_blank" rel="noopener">Schrör, 2007</a>.</p></template>

<template data-pop="g93-glibenclamide" data-title="Glibenclamide : piste expérimentale">
<div class="lab">Mécanisme</div><p>Le glibenclamide inhibe le canal SUR1, composante du canal SUR1-TRPM4 impliqué dans l’œdème.</p>
<div class="lab">Preuves</div><p>Dans un essai de 66 sujets après traumatisme, l’expansion des contusions a été réduite sans changement du devenir ; dans un essai de phase II d’accident vasculaire, la déviation de la ligne médiane était moindre.</p>
<div class="lab">Limite</div><p>Il ne doit pas être présenté comme un traitement établi.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6309515/" target="_blank" rel="noopener">Jha et al., 2019</a>.</p></template>

<template data-pop="g93-mnemo" data-title="Quatre verbes pour le bilan de l’hypertension idiopathique (aide pédagogique, non critère officiel)">
<p>Pour retenir l’ordre du bilan, on peut enchaîner quatre verbes : <b>voir</b> (fond d’œil dilaté et périmétrie), <b>imager</b> (imagerie par résonance puis veinographie), <b>mesurer</b> (pression d’ouverture dans les conditions standard) et <b>chercher</b> (cause secondaire, médicaments compris).</p>
<p>Cette suite est une aide pédagogique et non un critère officiel : elle résume les étapes de la recommandation européenne 2018.</p></template>

<template data-pop="pareto-g93-socle" data-title="Pareto — Socle, fréquence et clinique de l’hypertension idiopathique">
<p class="ratio" data-cover="g93-0,g93-1,g93-2,g93-3,g93-4,g93-5"></p><ul><li>G93 est une catégorie de rattachement : l’entité clinique précède le code.</li><li>Le crâne est rigide : tout volume ajouté épuise la compliance puis fait monter la pression.</li><li>L’œdème cytotoxique, ionique, vasogénique et osmotique n’ont pas les mêmes mécanismes.</li><li>L’hypertension idiopathique touche des femmes obèses ; le fond d’œil dilaté vient d’abord.</li><li>Il faut exclure une cause secondaire, en particulier médicamenteuse.</li></ul></template>

<template data-pop="pareto-g93-hii" data-title="Pareto — Hypertension idiopathique : diagnostic et traitement">
<p class="ratio" data-cover="g93-6,g93-7"></p><ul><li>Diagnostic : imagerie par résonance, veinographie et pression d’ouverture standardisée.</li><li>Seuils : 25 cm d’eau chez l’adulte, 28 chez l’enfant, zone grise 25 à 30.</li><li>Perte de poids en premier ; acétazolamide en première ligne médicamenteuse.</li><li>Chirurgie seulement si la vision baisse vite ; pas de dérivation pour une céphalée isolée.</li></ul></template>

<template data-pop="pareto-g93-autres" data-title="Pareto — Lésion anoxique, fatigue chronique, Reye et kystes">
<p class="ratio" data-cover="g93-8,g93-9,g93-10,g93-11,g93-12,g93-13,g93-14,g93-15"></p><ul><li>Après arrêt cardiaque : saturation 94 à 98 %, normocapnie, pression artérielle moyenne d’au moins 65 mmHg, pas de fièvre.</li><li>Pronostic : exclure les confondants, 72 heures, réponse motrice de 3 ou moins, au moins deux prédicteurs.</li><li>Encéphalomyélite myalgique : malaise post-effort obligatoire, gestion de l’énergie.</li><li>Reye : mortalité de 30 à 40 % ; aspirine restreinte dès 12 ans en cas d’infection virale.</li><li>Kyste arachnoïdien : le plus souvent fortuit, sans symptôme attribuable.</li></ul></template>

<template data-pop="pareto-g93-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g93-e-1,g93-e-2,g93-e-3,g93-e-4"></p><ul><li>Gold standard de la pression : ponction lombaire dans les conditions standard.</li><li>Veinographie toujours : elle exclut la thrombose veineuse.</li><li>Pronostic post-arrêt : aucun examen unique, algorithme combiné.</li><li>Pas de biomarqueur dans l’encéphalomyélite myalgique.</li></ul></template>

<template data-pop="pareto-g93-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g93-s-anat-cours"></p><ul><li>Trois contenus dans une boîte rigide.</li><li>Signes d’imagerie autour du nerf optique et de la selle turcique ; la sténose des sinus transverses ne tranche pas.</li></ul></template>

<template data-pop="pareto-g93-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g93-s-physio-cours"></p><ul><li>La compliance s’épuise puis la pression monte brutalement.</li><li>Hypocapnie et hypercapnie modifient le débit cérébral : viser la normocapnie.</li></ul></template>

<template data-pop="pareto-g93-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g93-s-bioch-cours"></p><ul><li>Énergie cellulaire, pompes et canaux (NKCC1, SUR1-TRPM4, aquaporine-4) gouvernent l’œdème cytotoxique.</li><li>Le mannitol agit par principe osmotique ; le glibenclamide reste expérimental.</li></ul></template>

<template data-pop="pareto-g93-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g93-p-1,g93-p-2,g93-p-3,g93-p-4,g93-p-5"></p><ul><li>Pas de médicament unique pour G93 : le choix suit l’entité.</li><li>Mannitol : 1 à 2 g/kg en 30 à 60 minutes, avec de nombreuses contre-indications.</li><li>Acétazolamide : première ligne de l’hypertension idiopathique, hors libellé suisse ; contrôler électrolytes et formule sanguine.</li><li>Aspirine : restriction chez l’adolescent fébrile viral.</li><li>Les doses non sourcées ne sont pas écrites.</li></ul></template>
