g93-16">Critères officiels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g93-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Le code G93 réunit des affections du cerveau qui n’ont pas d’autre case dans la classification. Pour l’examen fédéral, quatre situations portent l’essentiel : une pression intracrânienne élevée sans cause (<button class="w" data-k="g93-friedman">HII</button>), une lésion cérébrale après arrêt cardiaque, un œdème ou une compression avec risque d’engagement, et la fatigue chronique avec malaise après l’effort. Le fil conducteur est unique : un cerveau enfermé dans un volume rigide tolère mal tout gonflement ou toute privation d’oxygène, et chaque décision cherche à protéger la perfusion cérébrale et, dans l’<button class="w" data-k="g93-friedman">HII</button>, la vision.</p>
<p>Deux <b>vignettes fictives</b> servent de repères tout au long du cours ; leurs valeurs sont pédagogiques et ne proviennent d’aucune étude.</p>
<div class="two"><div class="card"><h4>Vignette 1 : une céphalée avec œdème papillaire</h4><p>Une femme de 28 ans, d’indice de masse corporelle à 38 kg/m², consulte pour des céphalées quasi quotidiennes depuis trois mois. Elle décrit des obscurcissements visuels de quelques secondes et un bruit pulsatile dans l’oreille. Le fond d’œil dilaté montre un œdème papillaire bilatéral ; la périmétrie révèle un élargissement de la tache aveugle. Il faut décider quel examen exclut une cause secondaire, comment mesurer la pression et quel traitement protège la vision.</p></div><div class="card"><h4>Vignette 2 : un coma après arrêt cardiaque</h4><p>Un homme de 58 ans retrouve une circulation spontanée après un arrêt cardiaque en dehors de l’hôpital. Il reste comateux sous ventilation. Il faut fixer les objectifs de réanimation des premières heures, puis décider à partir de quel moment et avec quels examens un pronostic neurologique peut être posé, sans le confondre avec la décision de limiter les soins.</p></div></div>
<div class="key"><b>À retenir.</b> G93 est une catégorie de rattachement. Le médecin choisit d’abord l’entité clinique, puis le code ; il n’invente pas un diagnostic parce qu’un code existe.</div>
</section>

<section class="ilot" id="g93-1"><h2><span class="n">1</span>Définition et périmètre</h2>
<p>Dans la classification allemande de la CIM-10-GM 2024, G93 s’intitule « Autres affections du cerveau ». La catégorie sert lorsqu’aucun code étiologique plus précis n’existe. Le <button class="w" data-k="g93-cim">périmètre de chaque sous-catégorie (inclusions et exclusions)</button> évite deux erreurs fréquentes : coder en G93 un œdème d’origine traumatique, qui relève de S06, et y classer une encéphalopathie hypertensive, qui relève de I67.4.</p>
<p>Le cours suit un plan monographique. Chaque entité reçoit sa définition, son mécanisme, sa clinique, son diagnostic et sa conduite, dans l’ordre suivant :</p>
<ul><li>le socle commun de la pression intracrânienne et de l’œdème, qui explique les entités G93.5 et G93.6 ;</li><li>l’hypertension intracrânienne idiopathique, G93.2, entité la plus développée parce qu’elle menace la vision et qu’un traitement efficace existe ;</li><li>la lésion cérébrale anoxique, G93.1, et les troubles chroniques de la conscience, G93.80 ;</li><li>l’encéphalomyélite myalgique et le syndrome de fatigue chronique, G93.3 ;</li><li>le syndrome de Reye, G93.7, les kystes cérébraux, G93.0, et les encéphalopathies sans précision.</li></ul>
<div class="trap"><span class="k">Piège</span> Le libellé officiel suisse de G93.2 est « hypertension intracrânienne idiopathique ». L’ancien terme « bénigne » est trompeur : la maladie peut faire perdre la vue. Le terme « pseudotumeur cérébrale » désigne aujourd’hui toute hypertension intracrânienne chronique, primaire ou secondaire (<button class="w" data-k="g93-friedman">définition et nomenclature</button>).</div>
</section>

<section class="ilot" id="g93-2"><h2><span class="n">2</span>Fréquence</h2>
<p>Les données de fréquence proviennent de sources hétérogènes et, pour certaines entités, de cohortes non suisses. Le tableau les rassemble avec leur limite, afin que le lecteur ne transforme pas une estimation en chiffre de référence. Les sources retenues ne contiennent aucune donnée suisse de fréquence pour ces entités ; cette lacune est nommée ici plutôt que comblée.</p>
<table class="t"><thead><tr><th>Entité</th><th>Donnée</th><th>Source et limite</th></tr></thead><tbody>
<tr><td>Hypertension intracrânienne idiopathique</td><td>0,5 à 2 pour 100 000 dans la population générale ; plus de 90 à 95 % des patients sont obèses ; survenue décrite après une prise de 5 à 15 % du poids</td><td>Fédération européenne des céphalées, 2018 ; probablement sous-diagnostiquée</td></tr>
<tr><td>Hypertension intracrânienne après traumatisme crânio-cérébral</td><td>Pression supérieure à 20–22 mmHg chez 45 à 80 % des patients ; association dose-dépendante avec le pronostic</td><td>Revue de physiopathologie 2019 ; population traumatique seulement</td></tr>
<tr><td>Œdème cérébral après traumatisme</td><td>Présent chez plus de 60 % des patients avec lésion expansive et chez environ 15 % de ceux dont le scanner initial est normal</td><td>Même revue ; ne se transpose pas à l’œdème d’un accident vasculaire</td></tr>
<tr><td>Encéphalomyélite myalgique / syndrome de fatigue chronique</td><td>Prévalence 0,1 à 0,7 % ; au moins deux tiers de femmes ; environ 3 millions de cas en Europe</td><td>Consensus européen EUROMENE 2021 ; estimations par extrapolation</td></tr>
<tr><td>Kyste arachnoïdien</td><td>2,3 % (29 sur 1235) chez des Suédois de 70 ans et plus, au scanner, sans différence de sexe</td><td>Étude de population 2016 ; âge élevé seulement</td></tr>
<tr><td>Syndrome de Reye</td><td>Maladie extrêmement rare, létale dans 30 à 40 % des cas</td><td>Revue 2007 ; aucune incidence suisse lue</td></tr>
</tbody></table>
<p>La lecture clinique du tableau est la suivante. Une maladie rare comme l’<button class="w" data-k="g93-friedman">HII</button> est reconnue parce qu’un profil est évocateur (femme obèse en âge de procréer), non parce qu’elle est fréquente. À l’inverse, le kyste arachnoïdien est fréquent et le plus souvent sans conséquence : l’erreur consiste ici à lui attribuer des symptômes qu’il ne cause pas (<button class="w" data-k="g93-kyste">kystes arachnoïdiens (prévalence et attitude)</button>).</p>
</section>

<section class="ilot" id="g93-3"><h2><span class="n">3</span>Socle commun : pression intracrânienne, œdème, engagement</h2>
<p>Le crâne adulte est une boîte rigide. La <button class="w" data-k="g93-monro">doctrine de Monro-Kellie (volumes sanguin, cérébral et du liquide cérébrospinal)</button> énonce que la pression intracrânienne dépend de la somme des volumes de sang, de tissu cérébral et de <button class="w" data-k="g93-monro">liquide cérébrospinal</button>. Tant que l’un de ces volumes diminue lorsqu’un autre augmente, la pression reste stable : on parle de compliance. Quand cette réserve est épuisée, le moindre volume supplémentaire fait monter la pression de façon abrupte. L’indice pression-volume normal est d’environ 20 à 25 mL.</p>
<figure><svg viewBox="0 0 640 230" role="img" aria-label="Figure 1 — Compartiments intracrâniens et loi de Monro-Kellie"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="40" y="30" width="250" height="170" rx="60"/><path d="M165 30v170" stroke-dasharray="4 4"/><path d="M80 115h170" stroke-dasharray="2 5"/></g><g fill="currentColor" font-size="14"><text x="100" y="75">Tissu cérébral</text><text x="95" y="150">Sang</text><text x="190" y="150">Liquide</text><text x="190" y="168">cérébrospinal</text><text x="330" y="70" font-size="15" font-weight="bold">Volume total constant</text><text x="330" y="100">Si un compartiment augmente,</text><text x="330" y="122">les autres cèdent ou la pression monte.</text><text x="330" y="160">1 : œdème ou hématome</text><text x="330" y="182">2 : épuisement de la compliance</text><text x="330" y="204">3 : baisse de la perfusion cérébrale</text></g></svg><figcaption>Figure 1 — Schéma didactique de la doctrine de Monro-Kellie, d’après la revue de physiopathologie de l’œdème cérébral 2019. Les proportions des compartiments ne sont pas à l’échelle et le dessin ne chiffre aucune pression.</figcaption></figure>
<p>La conséquence se lit en chaîne. Une pression intracrânienne élevée réduit la pression de perfusion cérébrale, donc le débit sanguin cérébral ; l’ischémie qui en résulte peut devenir irréversible, entraîner un engagement et la mort. Pour cette raison, les recommandations du traumatisme crânio-cérébral fixent un seuil de traitement de la pression intracrânienne à 20 à 22 mmHg.</p>
<h3>Les types d’œdème cérébral</h3>
<p>Le mot « œdème » recouvre des mécanismes différents qui n’appellent pas le même geste. Le tableau les oppose ; la <button class="w" data-k="g93-oedeme">fenêtre sur l’œdème cérébral (acteurs moléculaires et chronologie)</button> détaille les canaux en cause.</p>
<table class="t"><thead><tr><th>Type</th><th>Mécanisme</th><th>Chronologie</th><th>Conséquence pratique</th></tr></thead><tbody>
<tr><td>Cytotoxique</td><td>Défaillance des pompes ou ouverture de canaux : l’eau entre dans les cellules</td><td>Dès environ 1 heure après un traumatisme</td><td>Redistribue l’eau sans augmenter l’eau cérébrale totale</td></tr>
<tr><td>Ionique</td><td>Flux net d’eau du capillaire vers l’interstitium par transport ionique de l’endothélium</td><td>Précoce</td><td>La barrière hémato-encéphalique reste intacte</td></tr>
<tr><td>Vasogénique</td><td>Rupture de la barrière : l’eau et les protéines passent dans l’interstitium</td><td>Pic de 6 à 24 heures ; persistance de 3 à 4 jours</td><td>Fuite de protéines, visible à l’imagerie</td></tr>
<tr><td>Osmotique / contusionnel</td><td>Le noyau nécrotique d’une contusion, hyperosmolaire, attire l’eau</td><td>Évolutif</td><td>Favorise l’hémorragie secondaire progressive</td></tr>
</tbody></table>
<p>Ces mécanismes forment un continuum : un œdème cytotoxique précoce peut évoluer vers un œdème vasogénique, puis vers une hémorragie secondaire. Cette succession justifie de répéter l’évaluation clinique et l’imagerie plutôt que de supposer qu’un seul mécanisme persiste.</p>
<h3>Compression et engagement</h3>
<p>La CIM-10-GM range sous G93.5 la hernie (engagement) et la compression du cerveau, y compris du tronc cérébral. L’atteinte du tronc cérébral explique la gravité de ces situations ; le syndrome de Reye est lui-même mortel par atteinte du tronc cérébral. Les sources retenues pour ce cours ne décrivent pas les types cliniques d’engagement ni leurs signes précis : le lecteur ne trouvera donc pas ici de description détaillée de ces tableaux, et doit les rechercher dans un traité de neurologie ou de neurochirurgie.</p>
<div class="trap"><span class="k">Piège</span> L’imagerie qui montre un œdème ne dit pas son type. La diffusion (coefficient de diffusion apparent) distingue les composantes cellulaire et vasogénique ; la déviation de la ligne médiane mesure l’effet de masse. Chacune répond à une question différente (<button class="w" data-k="g93-oedeme">imagerie de l’œdème</button>).</div>
<div class="key"><b>À retenir.</b> Monro-Kellie explique pourquoi un gonflement cérébral devient dangereux ; la classification de l’œdème explique pourquoi les traitements n’agissent pas tous.</div>
</section>

<section class="ilot" id="g93-4"><h2><span class="n">4</span>Hypertension intracrânienne idiopathique : mécanismes et causes</h2>
<p>L’<button class="w" data-k="g93-friedman">HII</button> est une élévation de la pression intracrânienne sans cause identifiable. Son étiologie reste largement inconnue, et c’est la raison pour laquelle les traitements médicamenteux visent la sécrétion de liquide cérébrospinal par les plexus choroïdes. Deux pistes sont discutées : des peptides intestinaux comme le GLP-1 et l’activité locale du cortisol par l’enzyme 11β-hydroxystéroïde déshydrogénase de type 1. Une sténose des sinus veineux transverses est fréquente, mais elle est peut-être la conséquence de l’hypertension plutôt que sa cause ; ce point est débattu.</p>
<p>Le terrain explique l’orientation du diagnostic. La maladie touche surtout des femmes obèses en âge de procréer, et plus de 90 à 95 % des patients sont obèses. Une prise de 5 à 15 % du poids a été décrite avant la survenue. La conséquence thérapeutique directe est que la perte de poids est le seul traitement modificateur de la maladie établi (<button class="w" data-k="g93-poids">perte de poids et chirurgie bariatrique</button>).</p>
<h3>Exclure d’abord une cause secondaire</h3>
<p>Le diagnostic d’HII est un diagnostic d’exclusion. Une hypertension intracrânienne chronique peut être secondaire à une obstruction veineuse, à un médicament ou à une autre maladie ; la <button class="w" data-k="g93-secondaires">liste des causes secondaires (obstruction veineuse, médicaments, maladies)</button> doit être parcourue systématiquement. Trois familles dominent :</p>
<ul><li>l’obstruction veineuse (thrombophilie, otite ou mastoïdite, hypertension pulmonaire, syndrome cave supérieur, tumeur compressive, entre autres), dont le mécanisme commun est un drainage veineux cérébral entravé ;</li><li>les médicaments, dont les fluoroquinolones, les tétracyclines, la vitamine A et les rétinoïdes, le lithium, l’amiodarone, la ciclosporine et le sevrage de corticoïdes ;</li><li>des maladies systémiques, dont l’apnée du sommeil, l’insuffisance rénale, l’anémie ferriprive sévère, la maladie d’Addison et l’hypoparathyroïdie.</li></ul>
<div class="trap"><span class="k">Piège</span> Arrêter un médicament inducteur est un geste thérapeutique en soi : une HII qui s’aggrave chez une patiente sous tétracycline ou rétinoïde n’est pas idiopathique, elle est secondaire.</div>
</section>

<section class="ilot" id="g93-5"><h2><span class="n">5</span>Hypertension intracrânienne idiopathique : anamnèse et examen</h2>
<p>La maladie se reconnaît à une combinaison de symptômes de pression et de symptômes visuels. Le tableau classe les symptômes par fréquence connue ; il indique aussi ce que chacun signifie.</p>
<table class="t"><thead><tr><th>Symptôme ou signe</th><th>Fréquence ou valeur</th><th>Lecture</th></tr></thead><tbody>
<tr><td>Céphalée</td><td>Jusqu’à 90 % ; frontale ou rétro-orbitaire, de pression ou « explosive », souvent migraineuse</td><td>Non spécifique : elle ressemble à la migraine</td></tr>
<tr><td>Abus médicamenteux associé</td><td>37 % des patients</td><td>Entretient la céphalée ; à rechercher</td></tr>
<tr><td>Obscurcissements visuels transitoires, flou, diplopie</td><td>Fréquence non chiffrée dans les sources</td><td>La diplopie évoque une paralysie du sixième nerf crânien, uni- ou bilatérale</td></tr>
<tr><td>Acouphène pulsatile</td><td>Fréquent</td><td>Symptôme de soutien</td></tr>
<tr><td>Troubles olfactifs</td><td>Jusqu’à 80 %</td><td>Sans utilité pour le diagnostic</td></tr>
<tr><td>Œdème papillaire</td><td>Signe cardinal ; bilatéral, asymétrique dans environ 4 % des cas</td><td>Impose l’exclusion d’une cause secondaire et un suivi visuel</td></tr>
</tbody></table>
<div class="two"><div class="card"><h4>Anamnèse</h4><p>Le médecin reconstitue la chronologie du poids, interroge sur chaque médicament de la <button class="w" data-k="g93-secondaires">liste des inducteurs</button> et sur les prises d’antalgiques (plus du tiers des patients en abusent). Il demande si les obscurcissements visuels surviennent au changement de position et s’il existe une diplopie ou un bruit pulsatile.</p></div><div class="card"><h4>Examen</h4><p>L’examen comprend l’acuité visuelle, les pupilles, la mobilité oculaire (paralysie du sixième nerf), le fond d’œil dilaté et la périmétrie. Le <button class="w" data-k="g93-papille">fond d’œil et la périmétrie (déficits typiques et pièges)</button> font la différence entre un œdème réel et un pseudo-œdème papillaire.</p></div></div>
<div class="trap"><span class="k">Piège</span> L’erreur diagnostique atteint environ 40 % des cas, surtout par un examen ophtalmologique incorrect. Un œdème papillaire doit être confirmé par un fond d’œil dilaté et une périmétrie formelle avant d’engager le bilan et le traitement.</div>
<div class="key"><b>À retenir.</b> Chez une femme obèse avec céphalée et symptômes visuels, le fond d’œil dilaté vient avant l’imagerie. Il décide de l’urgence.</div>

</section>
