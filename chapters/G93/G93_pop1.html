<template data-pop="g93-cim" data-title="Périmètre de G93 : inclusions et exclusions">
<div class="lab">Principe</div><p>G93 regroupe, dans la CIM-10-GM 2024, des affections du cerveau sans code étiologique plus précis. Le choix du code suit donc le diagnostic établi : le code ne le crée pas.</p>
<div class="lab">Sous-catégories</div>
<p>G93.0 couvre les kystes cérébraux (kyste porencéphalique et kyste arachnoïdien) ; les kystes cérébraux congénitaux (Q04.6) et les kystes périventriculaires acquis du nouveau-né (P91.1) en sont exclus. G93.1 est la lésion cérébrale anoxique non classée ailleurs ; sont exclues les complications d’avortement, de grossesse extra-utérine ou de môle (O00–O07, O08.8), de chirurgie et de soins (T80–T88), de grossesse, de travail et de post-partum (O29.2, O74.3, O89.2) et l’asphyxie néonatale (P21.9). G93.2 est l’hypertension intracrânienne bénigne (pseudotumor cerebri), dont le libellé suisse est « hypertension intracrânienne idiopathique » ; l’encéphalopathie hypertensive (I67.4) est exclue. G93.3 inclut le syndrome de fatigue chronique, avec dysfonction immunitaire, l’encéphalomyélite myalgique et le syndrome de fatigue post-viral. G93.4 est l’encéphalopathie sans précision, qui exclut l’encéphalopathie alcoolique (G31.2) et toxique (G92). G93.5 est la compression du cerveau, avec hernie (engagement) ; la compression traumatique diffuse (S06.28) et circonscrite (S06.38) en sont exclues. G93.6 est l’œdème cérébral ; l’œdème par traumatisme obstétrical (P11.0) et traumatique (S06.1) sont exclus. G93.7 est le syndrome de Reye. G93.8 regroupe les autres affections précisées, dont G93.80 (syndrome apallique) et G93.88 (autres, dont l’encéphalopathie post-radique). G93.9 est l’affection du cerveau sans précision.</p>
<div class="lab">Application</div><p>Un œdème d’origine traumatique ne reçoit pas G93.6 mais un code S06. Pour G93.7 et G93.8, un code supplémentaire du chapitre des causes externes est ajouté si la cause est connue.</p>
<div class="lab">Limite</div><p>La classification allemande est une version de langue allemande ; les libellés français suisses proviennent du catalogue de l’Office fédéral de la statistique. La cartographie vers la CIM-11 n’est pas établie dans ce cours.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G90–G99, Institut fédéral allemand des médicaments</a>.</p></template>

<template data-pop="g93-monro" data-title="Doctrine de Monro-Kellie et compliance">
<div class="lab">Définition</div><p>La pression intracrânienne résulte de la somme des volumes de sang, de tissu cérébral et de liquide cérébrospinal dans une boîte crânienne rigide. Le liquide cérébrospinal est le liquide qui baigne le cerveau et circule dans les espaces qui l’entourent.</p>
<div class="lab">Raisonnement</div><p>Comme le contenant ne peut pas s’agrandir, l’augmentation d’un volume (œdème, hématome) doit être compensée par la diminution d’un autre. Cette capacité de compensation est la compliance ; l’indice pression-volume normal est d’environ 20 à 25 mL. Quand elle est épuisée, la pression augmente fortement.</p>
<div class="lab">Conséquence clinique</div><p>Une pression élevée diminue la pression de perfusion cérébrale et le débit sanguin cérébral. La lésion qui en découle peut devenir irréversible, entraîner un engagement et le décès. Dans le traumatisme crânio-cérébral, une pression supérieure à 20–22 mmHg survient chez 45 à 80 % des patients, avec une association dose-dépendante avec le pronostic.</p>
<div class="lab">Limite</div><p>Les seuils chiffrés viennent d’une revue consacrée au traumatisme crânio-cérébral ; ils ne se transposent pas sans réserve aux autres causes.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6309515/" target="_blank" rel="noopener">Jha, Kochanek et Simard, 2019, œdème cérébral</a>.</p></template>

<template data-pop="g93-oedeme" data-title="Œdème cérébral : types, acteurs moléculaires, imagerie">
<div class="lab">Types</div><p>L’œdème cytotoxique correspond à une entrée d’eau dans les cellules par défaillance des pompes ou activation de canaux ; il redistribue l’eau sans augmenter l’eau cérébrale totale et apparaît dès environ 1 heure après un traumatisme. L’œdème ionique résulte d’un flux net d’eau du capillaire vers l’interstitium par transport ionique de l’endothélium, sans rupture de la barrière hémato-encéphalique. L’œdème vasogénique suit la rupture de la barrière : l’eau et les protéines passent dans l’interstitium, avec un pic de 6 à 24 heures, une perméabilité maximale les premières heures, une persistance de 3 à 4 jours et un second pic possible vers le cinquième jour. L’œdème osmotique (contusionnel) naît du noyau nécrotique hyperosmolaire d’une contusion, qui attire l’eau.</p>
<div class="lab">Acteurs moléculaires</div><p>Le transporteur NKCC1, activé par le potassium extracellulaire, est surexprimé dès 1 heure. Le canal SUR1-TRPM4 n’est pas exprimé normalement et s’ouvre lorsque l’énergie cellulaire s’épuise. L’aquaporine-4 permet l’entrée d’eau dans l’œdème cytotoxique et sa clairance dans l’œdème vasogénique. Les métalloprotéinases matricielles 2 et 9, le facteur de croissance de l’endothélium vasculaire A et des cytokines participent aussi à la maladie.</p>
<div class="lab">Imagerie</div><p>La diffusion (coefficient de diffusion apparent) distingue les composantes cellulaire et vasogénique. La déviation de la ligne médiane sert de mesure de l’œdème dans les essais d’accident vasculaire.</p>
<div class="lab">Limite</div><p>Ces données proviennent d’une revue sur le traumatisme crânio-cérébral. Les traitements de l’œdème sont décrits dans la pharmacologie : l’osmothérapie baisse la pression avec un effet incertain sur le pronostic, la craniectomie décompressive réduit la pression et la mortalité sans bénéfice fonctionnel établi, l’hypothermie baisse la pression avec un bénéfice clinique incertain.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6309515/" target="_blank" rel="noopener">Jha, Kochanek et Simard, 2019</a>.</p></template>

<template data-pop="g93-friedman" data-title="Hypertension intracrânienne idiopathique : définition et critères diagnostiques">
<div class="lab">Définition</div><p>L’hypertension intracrânienne idiopathique (HII) est une élévation de la pression intracrânienne sans cause identifiable. Le terme « pseudotumor cerebri » est devenu un terme parapluie pour toute hypertension intracrânienne chronique, primaire (HII) ou secondaire.</p>
<div class="lab">Critères</div><p>La Fédération européenne des céphalées (2018) retient le syndrome défini par les critères de Friedman 2013, y compris une version sans œdème papillaire. La pression d’ouverture normale est de 25 cm d’eau ou moins chez l’adulte et de 28 cm d’eau ou moins chez l’enfant, avec une zone grise de 25 à 30. Sans œdème papillaire, l’HII est certaine en cas de paralysie du sixième nerf uni- ou bilatérale, et possible sans paralysie si au moins trois des quatre signes d’imagerie suivants existent : selle turcique vide, aplatissement postérieur du globe, élargissement de l’espace périoptique, sténose des sinus transverses.</p>
<div class="lab">Céphalée attribuée</div><p>La classification internationale des céphalées (troisième édition) exige une céphalée nouvelle ou nettement aggravée, une HII diagnostiquée avec pression du liquide supérieure à 250 mm (280 mm chez l’enfant obèse), un lien temporel ou un acouphène pulsatile ou un œdème papillaire, et l’absence de meilleure explication. Elle a retiré l’exigence d’amélioration après baisse de pression : environ deux tiers des patients gardent des céphalées malgré une pression normalisée.</p>
<div class="lab">Limite</div><p>La figure des critères de Friedman n’a pas été lue : les seuils ci-dessus sont ceux que cite la recommandation européenne.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6755569/" target="_blank" rel="noopener">Hoffmann et al., Fédération européenne des céphalées, 2018</a>.</p></template>

<template data-pop="g93-pression" data-title="Mesure de la pression d’ouverture">
<div class="lab">Technique</div><p>La ponction lombaire est obligatoire. La pression est mesurée en décubitus latéral, jambes étendues, sans sédation.</p>
<div class="lab">Interprétation</div><p>Normale jusqu’à 25 cm d’eau chez l’adulte et 28 cm d’eau chez l’enfant ; zone grise de 25 à 30 cm d’eau. La pression peut être intermittente : devant une mesure normale et une clinique évocatrice, on répète la mesure ou on la surveille.</p>
<div class="lab">Pièges</div><p>Une mesure hors des conditions standard n’est pas comparable aux seuils. La ponction lombaire thérapeutique répétée au long cours n’est pas recommandée : l’effet est bref (environ un point sur dix sur la céphalée) et la céphalée s’aggrave la semaine suivante chez 64 % des patients.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6755569/" target="_blank" rel="noopener">Fédération européenne des céphalées, 2018</a>.</p></template>

<template data-pop="g93-papille" data-title="Fond d’œil, périmétrie et tomographie en cohérence optique">
<div class="lab">Examen</div><p>L’ophtalmologie comprend l’acuité, les pupilles, une périmétrie formelle et un fond d’œil dilaté. Il faut exclure un pseudo-œdème papillaire. L’erreur diagnostique atteint environ 40 %, surtout par un examen ophtalmologique incorrect.</p>
<div class="lab">Déficits typiques</div><p>Élargissement de la tache aveugle, rétrécissement périphérique, ressaut nasal inférieur et déficit arciforme partiel. Un œdème papillaire de haut grade et une baisse d’acuité initiale prédisent une perte de champ visuel.</p>
<div class="lab">Tomographie en cohérence optique</div><p>Elle quantifie l’œdème papillaire et suit son évolution. L’épaisseur de la couche de fibres nerveuses rétiniennes seule ne distingue pas la résolution de l’œdème d’une atrophie optique.</p>
<div class="lab">Imagerie</div><p>L’imagerie par résonance est l’examen de référence pour exclure une cause secondaire. Les signes de soutien sont la selle vide, l’aplatissement du globe, l’élargissement de la gaine du nerf optique et la tortuosité du nerf. Aucun n’est pathognomonique, et les ventricules ont une taille normale.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6755569/" target="_blank" rel="noopener">Fédération européenne des céphalées, 2018</a>. La classification de Frisén n’a pas été lue.</p></template>

<template data-pop="g93-secondaires" data-title="Causes secondaires d’hypertension intracrânienne">
<div class="lab">Obstruction veineuse</div><p>Thrombophilie, lupus, otite ou mastoïdite, infection du système nerveux central, hypertension pulmonaire, bronchopneumopathie chronique obstructive, syndrome cave supérieur, fistule artérioveineuse, tumeur glomique et tumeur compressive.</p>
<div class="lab">Médicaments</div><p>Fluoroquinolones, tétracyclines, vitamine A et rétinoïdes, stéroïdes anabolisants, sevrage de corticoïdes, hormone de croissance, lithium, acide nalidixique, contraceptifs oraux, implant de lévonorgestrel, amiodarone, ciclosporine et cytarabine.</p>
<div class="lab">Autres maladies</div><p>Infection par le virus de l’immunodéficience humaine, syphilis, borréliose, varicelle, maladie d’Addison, hypoparathyroïdie, apnées du sommeil, urémie, anémie ferriprive sévère, insuffisance rénale, syndromes de Turner et de Down.</p>
<div class="lab">Application</div><p>Chaque cause oriente le traitement : arrêter le médicament, traiter la thrombose, corriger la maladie systémique. Le diagnostic d’HII n’est retenu qu’après cette exclusion.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6755569/" target="_blank" rel="noopener">Fédération européenne des céphalées, 2018, tableau des causes secondaires</a>.</p></template>

<template data-pop="g93-poids" data-title="Perte de poids dans l’hypertension intracrânienne idiopathique">
<div class="lab">Principe</div><p>La perte de poids est le seul traitement modificateur de la maladie établi. Elle doit être abordée avec tact avec chaque patient.</p>
<div class="lab">Données chiffrées</div><p>La chirurgie bariatrique a donné une perte de 27,2 à 27,8 kg à 24 mois et la plus forte baisse de pression (11,9 cm d’eau). Une intervention multicomposante associée à l’acétazolamide a baissé la pression de 11,2 cm d’eau à six mois. La baisse de pression est fortement corrélée à la perte de poids. La recommandation britannique 2023 (méthode SIGN) propose la chirurgie bariatrique si l’indice de masse corporelle atteint 35 kg/m² ou plus (grade A) et une intervention multicomposante de mode de vie en dessous de 35 (grade B). Dans une revue systématique, la mortalité de la chirurgie bariatrique était de 0,05 à 0,14 %, la résolution de l’œdème papillaire de 100 % et l’amélioration des céphalées de 90 %.</p>
<div class="lab">Limite</div><p>Ces recommandations sont britanniques et le résumé seul a été lu pour la revue de 2023.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/WNL.0000000000207866" target="_blank" rel="noopener">Abbott et al., Neurology 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6755569/" target="_blank" rel="noopener">Fédération européenne des céphalées, 2018</a>.</p></template>

<template data-pop="g93-chirurgie" data-title="Chirurgie de l’hypertension intracrânienne idiopathique">
<div class="lab">Indication</div><p>La chirurgie est réservée à la baisse visuelle rapide. La dérivation n’est pas indiquée pour une céphalée isolée.</p>
<div class="lab">Techniques et révisions</div><p>La dérivation ventriculo-péritonéale est préférée à la dérivation lombo-péritonéale (1,8 contre 4,3 révisions par patient) ; 51 % des patients ont une révision, 30 % plusieurs. La fenestration de la gaine du nerf optique est révisée dans 26 % des cas. Le stenting des sinus veineux est débattu : resténose adjacente, un tiers des patients retraités, et rarement perforation, hématome sous-dural ou décès.</p>
<div class="lab">Limite</div><p>Après dérivation, la céphalée persiste chez 68 % des patients à six mois et 79 % à deux ans : la dérivation protège la vision, non la céphalée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6755569/" target="_blank" rel="noopener">Fédération européenne des céphalées, 2018</a>.</p></template>

<template data-pop="g93-postarret" data-title="Soins post-arrêt cardiaque : recommandations ERC-ESICM">
<div class="lab">Syndrome post-arrêt cardiaque</div><p>Il comprend la lésion cérébrale hypoxique-ischémique, la dysfonction myocardique, la réponse systémique d’ischémie-reperfusion et la pathologie déclenchante. Les facteurs aggravants sont l’hypotension, l’hypoxémie, l’hyperoxémie, la fièvre, l’hypo- et l’hyperglycémie et les convulsions.</p>
<div class="lab">Objectifs</div><p>Saturation de 94 à 98 % (pression partielle d’oxygène de 10 à 13 kPa, soit 75 à 100 mmHg). Normocapnie, PaCO₂ de 4,5 à 6,0 kPa (35 à 45 mmHg). Pression artérielle moyenne d’au moins 65 mmHg, avec une diurèse supérieure à 0,5 mL/kg/h et un lactate normal ou décroissant. Température cible constante entre 32 et 36 °C pendant au moins 24 heures ; fièvre (plus de 37,7 °C) évitée pendant au moins 72 heures chez le patient resté comateux ; pas de solutés froids préhospitaliers. Convulsions : électroencéphalogramme, lévétiracétam ou valproate en première ligne, pas de prophylaxie systématique.</p>
<div class="lab">Limite</div><p>Ce sont les valeurs de la version 2021. La version 2025 (Intensive Care Medicine 2025) existe ; seul son résumé a été lu, de sorte que d’éventuelles modifications chiffrées ne figurent pas ici.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993077/" target="_blank" rel="noopener">Nolan, Sandroni et al., ERC et ESICM 2021</a> ; <a href="https://doi.org/10.1007/s00134-025-08117-3" target="_blank" rel="noopener">version 2025</a>.</p></template>

<template data-pop="g93-pronostic" data-title="Pronostic neurologique après arrêt cardiaque : algorithme multimodal">
<div class="lab">Condition d’entrée</div><p>Patient comateux avec réponse motrice de 3 ou moins à 72 heures ou plus du retour à la circulation spontanée, après exclusion des facteurs confondants (sédation résiduelle, curarisation, hypothermie, hypotension sévère, hypoglycémie, sepsis, troubles métaboliques ou respiratoires).</p>
<div class="lab">Prédicteurs</div><p>Un pronostic défavorable est probable si deux prédicteurs ou plus sont présents : absence des réflexes pupillaires et cornéens à 72 heures ou plus ; absence bilatérale de l’onde N20 des potentiels évoqués somesthésiques à 24 heures ou plus ; électroencéphalogramme hautement malin au-delà de 24 heures (fond supprimé avec ou sans décharges périodiques, ou suppression-bouffées) ; énolase neuronale spécifique supérieure à 60 µg/L à 48 et/ou 72 heures ; état de mal myoclonique avant 72 heures ; lésion anoxique diffuse et étendue à l’imagerie (perte du rapport substance grise / blanche, restriction de diffusion étendue).</p>
<div class="lab">Limites</div><p>Aucun prédicteur n’est exact à 100 %. La prophétie autoréalisatrice est un risque : une limitation prématurée confirme le pronostic. Le syndrome de Lance-Adams désigne des myoclonies généralisées avec décharges épileptiformes chez des patients qui se réveillent. La décision de limitation thérapeutique est discutée séparément et intègre l’âge, les comorbidités, les fonctions d’organes et les volontés du patient.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7993077/" target="_blank" rel="noopener">ERC et ESICM 2021, pronostic</a>.</p></template>

<template data-pop="g93-conscience" data-title="Évaluation des troubles de la conscience">
<div class="lab">Recommandations</div><p>L’Académie européenne de neurologie (2020) recommande un examen neurologique complet, la recherche de mouvements oculaires volontaires au miroir, la répétition des évaluations cliniques en phase subaiguë et chronique avec l’échelle de récupération du coma révisée, et la préférence du score FOUR au score de Glasgow en phase aiguë. Un électroencéphalogramme standard est proposé, avec recherche de sommeil paradoxal et lent. Chez les patients sans réponse à la commande, la tomographie par émission de positons, l’imagerie par résonance fonctionnelle de repos ou active et l’électroencéphalogramme quantitatif à haute densité sont proposés si possible.</p>
<div class="lab">Classement</div><p>L’état de conscience est classé selon le niveau le plus élevé révélé par l’une de ces approches.</p>
<div class="lab">Limite</div><p>Seul le résumé de la recommandation a été lu. Les définitions des états de conscience et les taux d’erreur diagnostique ne figurent pas dans ce cours.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/ene.14151" target="_blank" rel="noopener">Kondziella et al., Académie européenne de neurologie, 2020</a>.</p></template>

<template data-pop="g93-emsfc" data-title="Encéphalomyélite myalgique : critères et diagnostic clinique">
<div class="lab">Critères</div><p>Chez l’adulte, le consensus européen EUROMENE 2021 retient les critères de l’Institute of Medicine 2015 (durée d’au moins six mois), adaptés aux soins primaires, et les critères canadiens de consensus pour la confirmation, les sous-groupes et la recherche. Les critères de Fukuda (1994) peuvent dépister, mais le malaise post-effort est exigé pour le diagnostic clinique. Les critères canadiens associent une fatigue pathologique, un malaise post-effort, des troubles du sommeil, une douleur, des symptômes cognitifs et au moins deux catégories parmi autonome, neuroendocrine et immunitaire. Chez l’enfant : critères de Rowe 2017 ; critères canadiens utilisables après trois mois.</p>
<div class="lab">Bilan</div><p>Formule sanguine, ferritine, enzymes hépatiques, fonction rénale, thyréostimuline, protéine C-réactive ultrasensible ou vitesse de sédimentation, électrolytes (sodium, potassium, calcium, phosphate), créatine kinase, glycémie à jeun ou hémoglobine glyquée ; sérologies (virus d’Epstein-Barr, hépatites B et C, virus de l’immunodéficience humaine, borréliose) et tests spécialisés selon la clinique.</p>
<div class="lab">Organisation</div><p>Les soins primaires font le diagnostic initial et le suivi ; le spécialiste confirme, notamment pour les jeunes, les formes sévères ou en aggravation. Le consensus estime à 2–4 le nombre de médecins spécialisés par million d’habitants.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8161074/" target="_blank" rel="noopener">Nacul et al., EUROMENE 2021</a>.</p></template>

<template data-pop="g93-pacing" data-title="Gestion de l’énergie (pacing)">
<div class="lab">Principe</div><p>La gestion de l’énergie est centrale dans la prise en charge. La règle pratique est de limiter la durée et l’intensité de l’activité à environ deux tiers de celles qui ont déclenché les symptômes.</p>
<div class="lab">Autres mesures</div><p>Traitement des symptômes prioritaires (douleur, sommeil, intolérance orthostatique : bas de contention, apport de liquides et de sel ; doses initiales plus faibles par sensibilité). La thérapie cognitivo-comportementale peut soutenir sans guérir, avec des preuves limitées. Les régimes d’exclusion ne sont pas recommandés en général.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8161074/" target="_blank" rel="noopener">EUROMENE 2021</a>.</p></template>

<template data-pop="g93-reye" data-title="Syndrome de Reye et aspirine">
<div class="lab">Caractéristiques</div><p>Maladie extrêmement rare, avec 30 à 40 % de décès par atteinte du tronc cérébral ; elle suit une infection virale avec un intervalle libre de 3 à 5 jours et traduit un trouble généralisé du métabolisme mitochondrial avec défaillance hépatique. Plusieurs maladies héréditaires du métabolisme et des toxiques donnent un tableau semblable.</p>
<div class="lab">Débat</div><p>L’auteur d’une revue de 2007 juge la causalité de l’aspirine insuffisamment établie. Cette position se présente comme un débat, non comme un consensus.</p>
<div class="lab">Position suisse</div><p>L’information professionnelle de l’Aspirine® limite l’emploi chez l’adolescent dès 12 ans avec fièvre ou infection virale (sur prescription, en deuxième intention), exclut les formes à croquer et en granulé avant 12 ans et cite le syndrome de Reye parmi les effets indésirables très rares.</p>
<p class="src">Références : <a href="https://doi.org/10.2165/00148581-200709030-00008" target="_blank" rel="noopener">Schrör, Paediatric Drugs 2007</a> ; information professionnelle Aspirine®, Swissmedic, septembre 2024.</p></template>

<template data-pop="g93-kyste" data-title="Kystes arachnoïdiens : prévalence et attitude">
<div class="lab">Données</div><p>Dans une population suédoise de 70 ans et plus, 2,3 % des personnes (29 sur 1235) avaient un kyste arachnoïdien au scanner, sans différence de sexe. Elles n’avaient pas plus de céphalées, de vertiges, de troubles cognitifs, de dépression ou d’épilepsie, ni une mortalité plus élevée.</p>
<div class="lab">Conséquence</div><p>La découverte est généralement fortuite et asymptomatique. Avant d’attribuer un symptôme à un kyste, un autre diagnostic est cherché ; l’attitude thérapeutique est restrictive.</p>
<div class="lab">Limite</div><p>L’étude concerne des sujets âgés d’une même population : elle ne s’applique pas telle quelle à l’enfant. Les kystes porencéphaliques ne sont pas décrits cliniquement ici.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00415-016-8035-1" target="_blank" rel="noopener">Rabiei et al., Journal of Neurology 2016</a>.</p></template>
