<template data-pop="n03-exp-9" data-title="9. Explorations : choisir les examens qui changent une décision"><p>Le bilan commence par les valeurs antérieures, la mesure de pression, la créatinine et le débit estimé, l’albuminurie/protéinurie et le sédiment. La numération, les électrolytes, l’albumine et les autres paramètres sont adaptés au retentissement. En maladie rénale plus avancée, rechercher notamment anémie, troubles du potassium, acidose et troubles minéraux ; une anomalie n’est pas automatiquement d’origine rénale.</p><p>L’immunologie répond à des hypothèses : complément, autoanticorps ou recherche de composant monoclonal selon présentation et tissu. Devant un pattern membranoprolifératif, rechercher infection, maladie auto-immune, immunoglobuline monoclonale ou dysrégulation du complément selon le profil d’immunofluorescence. Un C3 normal ne ferme pas toutes ces hypothèses, et un C3 bas ne donne pas une étiologie unique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a>.</p></template>
<template data-pop="pareto-n03-9" data-title="Raisonnement essentiel — 9. Explorations : choisir les examens qui changent une décision"><p>Un examen est utile lorsqu’il répond à une question et peut modifier une décision.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a>.</p></template>
<template data-pop="n03-exp-10" data-title="10. Arbre diagnostique et diagnostics différentiels"><p>Une hypertension de longue durée et un diabète peuvent coexister avec une glomérulopathie. Une hématurie glomérulaire, une maladie systémique ou une évolution inhabituelle empêchent d’attribuer tout le tableau à ces seuls antécédents. Une maladie du collagène IV peut produire une sclérose secondaire ; un pattern membranoprolifératif peut masquer plusieurs causes. Le diagnostic différentiel porte donc à la fois sur le compartiment, le mécanisme et la temporalité.</p><p>La baisse aiguë de fonction peut également venir d’une déplétion, d’un obstacle ou d’un médicament. La reconnaître ne dispense pas de suivre la maladie chronique, mais évite de confondre un événement potentiellement réversible et une perte rénale inexorable. Les données de la biopsie restent interprétées dans cette histoire complète.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-10" data-title="Raisonnement essentiel — 10. Arbre diagnostique et diagnostics différentiels"><p>La discordance entre diagnostic ancien et évolution nouvelle rouvre les hypothèses.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a>.</p></template>
<template data-pop="n03-exp-11" data-title="11. Prise en charge : protéger le rein et traiter la cause"><p><b>Organiser le niveau de soins.</b> Le syndrome glomérulaire chronique nécessite une évaluation néphrologique pour préciser cause, activité et risque. Une complication aiguë change le délai. Les examens de cause ne doivent pas retarder la stabilisation d’une surcharge respiratoire, d’une hypertension avec atteinte d’organe ou d’un trouble métabolique menaçant. Une dialyse ne se décide pas sur le code N03 ni sur un chiffre isolé de créatinine.</p><p><b>Réduire les facteurs de progression.</b> Le Pocketguide suisse 2025 retient une alimentation adaptée, moins de 5 g de sel par jour, une activité physique visant environ 150 minutes par semaine selon les capacités, l’arrêt du tabac et la gestion du poids. L’apport protéique de 0,8 g/kg/j concerne surtout les adultes avec maladie rénale chronique ; chez l’enfant, la croissance interdit une transposition automatique, et la fragilité peut nécessiter d’autres objectifs nutritionnels. Un diététicien aide à adapter potassium, énergie et protéines aux résultats.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI-COSAAR — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-11" data-title="Raisonnement essentiel — 11. Prise en charge : protéger le rein et traiter la cause"><p>Associer protection rénale et traitement de cause ; respecter cible suisse, FI et sécurité de chaque produit.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a>.</p></template>
<template data-pop="n03-exp-12" data-title="12. Prévention, suivi et pronostic : suivre plus qu’un résultat"><p>Le suivi mesure au moins pression, filtration et albuminurie/protéinurie, ainsi que symptômes, poids, tolérance et événements intercurrents. KDIGO propose au minimum une évaluation annuelle de filtration et d’albuminurie dans la maladie rénale chronique, et plus souvent lorsque le risque ou une décision thérapeutique le justifie. Ce minimum ne décrit pas le contrôle après modification d’un médicament ni celui d’une maladie glomérulaire active.</p><p>Un changement de débit supérieur à 20 % sur un contrôle, une diminution supérieure à 30 % après un traitement modifiant l’hémodynamique, ou un doublement du rapport albumine/créatinine dépasse les variations attendues et appelle une évaluation. Ce sont des signaux pour vérifier prélèvement, médicaments, volume, obstacle et activité de maladie, pas une preuve automatique de progression irréversible. Une baisse plus modeste peut aussi être pertinente si la clinique est inquiétante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-REF — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a>.</p></template>
<template data-pop="pareto-n03-12" data-title="Raisonnement essentiel — 12. Prévention, suivi et pronostic : suivre plus qu’un résultat"><p>Le suivi associe fonction, protéines et clinique ; les seuils de variation déclenchent une évaluation sans prouver l’irréversibilité.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a>.</p></template>
<template data-pop="n03-exp-13" data-title="13. Points clés et entraînement clinique"><p>Les cas et quiz sont des exercices originaux fictifs. Leur lien pédagogique avec PROFILES 2017 concerne notamment les marqueurs de fonction rénale SSP161, le sédiment SSP164, la protéinurie SSP173, l’histologie/génétique SSP159 et l’hématurie SSP64. Ils ne sont ni des questions fédérales reproduites ni une correspondance officielle CIM–PROFILES. Les exigences MEBEKO lues portent sur l’examen 2026.</p><p><button class="w" data-k="n03-cas-1">Cas clinique 1 — analyser la décision</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CH-PROFILES — pp.29,32 :SSP64,159,161,164,173</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">CH-MEBEKO — Introduction et§2.1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DRUG — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n03-13" data-title="Raisonnement essentiel — 13. Points clés et entraînement clinique"><p>Les tâches cliniques organisent l’entraînement ; les casMEDINA restent des exercices originaux.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CH-PROFILES — pp.29,32 :SSP64,159,161,164,173</a>.</p></template>

t/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">FI-LASIX-PO — Posologie, contre-indications et précautions</a>.</p></template>
<template data-pop="pareto-n03-14" data-title="Raisonnement essentiel — 14. Pièges : les mots qui ferment trop tôt le raisonnement"><p>Ne pas confondre chronique et stable, pattern et cause, risque et indication immédiate de dialyse.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-KRT — §5.3–5.5 pp.S166–168, table 41</a>.</p></template>
<template data-pop="n03-calcul-ratio" data-title="Rapport urinaire : le litre s’annule, pas l’analyte"><p>Données fictives du même prélèvement : albumine 60 mg/L, créatinine 1g/L. Le rapport albumine/créatinine est 60 ÷ 1 = 60 mg/g. Les litres s’annulent. Il s’agit d’albuminurieA2 selon les bornes du référentiel ; il ne s’agit pas d’une excrétion de 60g/j.</p><p>Si les protéines totales sont à 1,2g/L avec la même créatinine, le rapport protéines/créatinine est 1,2g/g. Les deux résultats ne sont pas interchangeables : le premier quantifie l’albumine, le second toutes les protéines mesurées.</p><p>Le calcul ne prouve pas la chronicité. Vérifier conditions, répétition, contexte et évolution. Un seuil de traitement donné en protéines totales ne se lit pas avec un rapport d’albumine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a>.</p></template>
<template data-pop="n03-calcul-variation" data-title="Variation relative : préciser le sens, la base et le délai"><p>Débit fictif passant de 68à 51 mL/min/1,73 m² : baisse absolue 68−51 = 17 ; baisse relative 17 ÷ 68 × 100 = 25 %. Elle dépasse le repère de 20 % qui appelle une évaluation selonKDIGO. Cela ne suffit pas à établir une progression irréversible.</p><p>Créatinine fictive passant de 100à 140 µmol/L après modification d’un IEC : hausse relative(140−100) ÷ 100 × 100 = 40 %. Si elle survient dans les quatre semaines, elle dépasse le repère de 30 % discuté pour la sécurité de l’IEC/ARA. Il faut chercher état volémique, médicaments, potassium et autres causes selon la clinique.</p><p>Ces exemples sont indépendants. Une hausse de créatinine de 30 % n’est pas mathématiquement la même chose qu’une baisse de débit de 30 %. Ne pas interchanger les deux seuils ni ignorer une aggravation clinique qui reste sous une borne.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-RISK — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a>.</p></template>
<template data-pop="n03-cas-1" data-title="Cas 1 — Une fonction normale n’efface pas le dommage"><p><b>Exercice fictif original.</b></p><p>Une personne a un débit estimé à 95 mL/min/1,73 m² mais une albuminurie pathologique et un sédiment glomérulaire documentés depuis six mois. Une filtration conservée n’exclut pas une maladie rénale chronique : les marqueurs persistants apportent une autre voie diagnostique.</p><p>Il faut rechercher la cause et le risque. À l’inverse, un débit de 75 isolé sans marqueur de dommage ne suffit pas à définir uneMRC. Le chiffre de filtration se lit avec l’ensemble du dossier.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-DEF — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-DEF — p.1, définition et figures 1–2</a>.</p></template>
<template data-pop="n03-cas-2" data-title="Cas 2 — Ancien ne signifie pas inactif"><p><b>Exercice fictif original.</b></p><p>Une personne suivie depuis plusieurs années développe une hausse rapide de créatinine, de nouveaux œdèmes et un purpura. Le caractère ancien de la maladie ne justifie pas d’attendre le bilan annuel. Évaluer gravité et causes réversibles, rechercher une maladie active et organiser rapidement le bilan spécialisé.</p><p>Une biopsie peut être discutée si elle doit changer le plan. L’alternative n’est pas entre corticoïde systématique et absence d’action ; la décision dépend de la cause, de l’activité et du retentissement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–172, tableau 1 et causes</a>.</p></template>
<template data-pop="n03-cas-3" data-title="Cas 3 — Un pattern n’est pas une cause"><p><b>Exercice fictif original.</b></p><p>Le compte rendu décrit une lésion membranoproliférative. Le résultat oriente la recherche d’infection, de maladie auto-immune, d’immunoglobuline monoclonale ou de complément selon l’immunofluorescence. La lésion ne constitue pas à elle seule une étiologie.</p><p>La clinique, la biologie et le tissu se complètent. Une prescription immunosuppressive universelle risquerait de traiter des mécanismes différents de manière identique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">INT-GN-MPGN — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="n03-cas-4" data-title="Cas 4 — Une recommandation de classe ne modifie pas uneFI"><p><b>Exercice fictif original.</b></p><p>Chez un adulte ayant un débit estimé à 22 mL/min/1,73 m², une recommandation générale évoque un inhibiteurSGLT2 dès 20. La FIForxiga consultée ne recommande pas son introduction sous 25. On ne transforme donc pas le seuil de classe en autorisation de débuter ce produit à 22.</p><p>Discuter les options avec le prescripteur en tenant compte du produit exact, de l’indication et des autres traitements. Une poursuite après introduction antérieure n’est pas la même décision qu’un début.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-SGN-PEC — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">INT-CKD-TX — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></template>
