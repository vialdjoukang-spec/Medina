<template data-pop="c77-echo" data-title="Échographie : critères de malignité">
<div class="lab">Critères</div><p>Grand axe augmenté, rapport longueur/largeur abaissé (ganglion arrondi, index de Solbiati), structure hétérogène, hile non visible, adhérence, hypervascularisation. Précision de 97 % dans une série.</p>
<div class="lab">Application</div><p>L’échographie est le premier examen ; elle guide le prélèvement et se complète par scanner injecté ou IRM.</p>
<div class="lab">Limite</div><p>Série unique ; les valeurs distinctes de sensibilité et de spécificité ne figurent pas dans le dossier.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-tep" data-title="TEP-CT : rendement et limites">
<div class="lab">Indications</div><p>Le TEP-CT est recommandé pour le CUP cervical (avant la panendoscopie) et pour la lésion unique ou oligométastatique.</p>
<div class="lab">Rendement</div><p>Le TEP-CT détecte le primitif dans 36 % des CUP cervicaux d’une série ; dans une autre série portant sur l’ensemble des CUP, il modifie le traitement chez 45,8 % des patients. Une méta-analyse rapporte 37 à 38 % de détection pour les CUP ganglionnaires et péritonéaux.</p>
<div class="lab">Limite</div><p>Captation possible environ 3 semaines après un vaccin à ARN messager contre la COVID-19. Le remboursement du TEP-CT selon l’OPAS n’a pas été vérifié pour ce cours.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-fna" data-title="Cytoponction (FNA)">
<div class="lab">Atouts</div><p>La méthode est simple et peu coûteuse. L’immunocytologie et la cytométrie en flux améliorent le rendement. Le typage retrouve le site primitif dans 75 % des métastases.</p>
<div class="lab">Limites</div><p>La sensibilité est de 56 %, la valeur prédictive négative de 72 %, et le rendement est faible dans les lymphomes T et de Hodgkin.</p>
<div class="lab">Application</div><p>Dans le cou, la cytoponction précède toute exérèse. Un résultat négatif n’exclut pas la malignité.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-cnb" data-title="Biopsie au trocart (CNB)">
<div class="lab">Atouts</div><p>Le calibre est de 16 à 18 G. L’architecture est conservée et la biologie moléculaire est possible. La précision est de 95 % (7093 biopsies) ; la sensibilité est de 92 %, contre 74 % pour la cytoponction dans le lymphome cervical.</p>
<div class="lab">Limite</div><p>On a rapporté 17 % de diagnostics erronés par rapport à la biopsie ouverte dans les lymphoproliférations.</p>
<div class="lab">Application</div><p>C’est la méthode de choix dans le cou pour typer la tumeur sans l’essaimage de l’exérèse.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-exerese" data-title="Biopsie-exérèse">
<div class="lab">Indication</div><p>Elle constitue la référence en cas de lymphome suspecté ou d’échec des autres méthodes, hors de la tête et du cou.</p>
<div class="lab">Limites</div><p>Le geste se pratique en bloc opératoire sous anesthésie ; dans le cou, il expose à un essaimage de 7 %.</p>
<div class="lab">Application</div><p>Devant des adénopathies multiples, on biopsie le plus gros ganglion hors de l’aine ; le rendement décroît du sus-claviculaire au cervical, à l’épitrochléen puis à l’inguinal.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-ihc" data-title="Immunohistochimie : algorithme de typage">
<div class="lab">Étape 1</div><p>Pan-cytokératine AE1/AE3 : carcinome. CD45 : hémopathie (CD3, CD20, CD79a, CD30). SOX10, S100, Melan-A, HMB45 : mélanome. SALL4, OCT3/4 : tumeur germinale. Synaptophysine, INSM1 : neuroendocrine.</p>
<div class="lab">Étape 2</div><p>CK7 positive et CK20 négative : poumon (TTF1), sein (GATA3, ER, PR, HER2), voies müllériennes (PAX8, WT1), thyroïde (TTF1, thyroglobuline). CK7 négative et CK20 positive : côlon-rectum (CDX2, SATB2), Merkel. CK7 et CK20 positives : vessie (GATA3, p63). CK7 et CK20 négatives : foie (arginase-1), rein (PAX8, PAX2, CD10), prostate (NKX3.1, PSMA, PSA).</p>
<div class="lab">Compléments</div><p>PD-L1 et protéines MMR font partie du bilan.</p>
<div class="lab">Limite</div><p>L’orientation est probabiliste ; elle se confirme par la clinique et l’imagerie.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-ngs" data-title="Séquençage de nouvelle génération (NGS)">
<div class="lab">Définition</div><p>Le NGS est une technique qui recherche en une seule analyse plusieurs altérations génétiques de la tumeur.</p>
<div class="lab">Place</div><p>L’ESMO propose le NGS en routine. Le résultat alimente le comité moléculaire pour une thérapie ciblée. Le bénéfice du profil d’expression génique n’est pas démontré.</p>
<div class="lab">Limite</div><p>Le texte intégral ESMO 2023 n’a pas été lu ; le contenu est repris d’Onkopedia 2025 et de Swiss Medical Weekly 2024.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-immuno" data-title="Immunothérapie et inhibiteurs de point de contrôle">
<div class="lab">Indications citées</div><p>Après radiochimiothérapie d’un CUP thoracique, un inhibiteur de point de contrôle est proposé si PD-L1 ≥ 1 %. Dans les formes défavorables, l’immunothérapie se discute si le statut est MSI/dMMR ou si la charge mutationnelle (TMB) est élevée.</p>
<div class="lab">Limite</div><p>L’information professionnelle suisse de l’atézolizumab n’a pas été lue : aucune dose ni contre-indication n’est donnée ici.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-favorable" data-title="Sous-groupes favorables et défavorables">
<div class="lab">Répartition</div><p>Environ 15 à 25 % des CUP sont localisés au diagnostic ; 70 à 85 % des patients n’appartiennent à aucun sous-groupe favorable.</p>
<div class="lab">Sous-groupes favorables</div><p>Cervical tête-et-cou-like, sus-claviculaire niveau IV, axillaire féminin sein-like, inguinal isolé, médiastinal ou thoracique, oligométastatique, côlon-like, rein-like.</p>
<div class="lab">Application</div><p>Le sous-groupe détermine l’intention curative ou palliative.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://doi.org/10.1007/s00117-023-01126-7" target="_blank" rel="noopener">Bochtler 2023, nouvelles lignes directrices ESMO (résumé)</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-cervical-trt" data-title="CUP cervical tête-et-cou-like : schéma par stade N">
<div class="lab">N1</div><p>Le traitement est un évidement fonctionnel avec ou sans radiothérapie, ou une radiothérapie définitive.</p>
<div class="lab">N2</div><p>Sans facteur de risque supplémentaire, le traitement associe un évidement fonctionnel suivi d’une radiothérapie uni- ou bilatérale, ou repose sur une radiothérapie définitive.</p>
<div class="lab">N3 ou facteurs de risque</div><p>N3 : plus de 6 cm. Les facteurs de risque sont l’atteinte d’au moins deux ganglions, l’extension extracapsulaire, une résection R1 ou une marge inférieure à 5 mm. Le traitement comprend un évidement uni- ou bilatéral si indiqué, puis une radiochimiothérapie postopératoire bilatérale ; une radiochimiothérapie néoadjuvante avant l’évidement est une alternative. La ligne directrice n’impose pas de schéma de chimiothérapie pour ce stade.</p>
<div class="lab">Limite</div><p>Les doses de radiothérapie ne sont pas dans les sources lues.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-axillaire-trt" data-title="CUP axillaire et inguinal">
<div class="lab">Axillaire chez la femme</div><p>On réalise une exérèse avec ou sans curage des niveaux I–II ; la mastectomie n’est pas nécessaire. L’adénocarcinome est traité comme un cancer du sein N+ (traitement néoadjuvant ou adjuvant, radiothérapie mammaire homolatérale). Pour l’épidermoïde, on réalise un curage et une radiothérapie.</p>
<div class="lab">Inguinal isolé</div><p>On réalise une exérèse puis une radiothérapie incluant le drainage iliaque, avec ou sans fluoropyrimidine. Après lymphadénectomie radicale d’un épidermoïde inguinal ou axillaire, la survie à 5 ans est de 65 % (CUP) contre 49 % (primitif connu), différence non significative.</p>
<div class="lab">Limite</div><p>Les doses ne sont pas données dans les sources lues.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-defavorable" data-title="Formes défavorables : doublets de platine">
<div class="lab">Traitement</div><p>Le traitement repose sur un doublet à base de platine : carboplatine-paclitaxel ou cisplatine-gemcitabine. Le NGS et la thérapie ciblée relèvent du comité moléculaire ; l’immunothérapie se discute si le statut est MSI/dMMR ou si la TMB est élevée. Les soins palliatifs seuls sont une option si l’espérance de vie est inférieure à 4 mois.</p>
<div class="lab">Limite</div><p>Les informations professionnelles suisses du cisplatine et de la gemcitabine n’ont pas été lues : leurs doses ne sont pas données.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-pronostic" data-title="Pronostic par sous-groupe">
<div class="lab">CUP global</div><p>La survie médiane est de 6 à 10 mois dans les études et d’environ 3 mois dans les registres ; la survie à 5 ans est de 5 à 15 %. Pour le carcinome épidermoïde, elle dépasse 30 % à 5 ans. Les facteurs pronostiques sont l’état général, la protéine C réactive, les neutrophiles, l’albuminémie, la LDH, les comorbidités, le nombre de métastases et les métastases hépatiques ; ils ne prédisent pas la survie individuelle.</p>
<div class="lab">CUP cervical</div><p>La survie à 5 ans est de 61 % en N1, de 51 % en N2 et de 26 % en N3. L’extension extracapsulaire abaisse la survie à 5 ans de 82 % à 57 %. La survie médiane est de 45 mois dans une série de 365 patients.</p>
<div class="lab">CUP axillaire sein-like</div><p>La survie à 5 ans est de 50 à 88 %.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-suivi" data-title="Suivi du CUP">
<div class="lab">Principe</div><p>Il n’existe aucune recommandation de suivi fondée sur des preuves. Le suivi est structuré si l’intention est curative et orienté sur les symptômes si elle est palliative (Onkopedia 2025).</p>
<div class="lab">Limite</div><p>Aucun calendrier chiffré n’est donné dans les sources lues.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-carboplatine" data-title="Carboplatine (information professionnelle suisse)">
<div class="lab">Indications suisses</div><p>Le carboplatine est indiqué, en monothérapie ou en association, dans le carcinome ovarien, le carcinome bronchique à petites cellules, les tumeurs ORL (la monothérapie y est associée à une radiothérapie) et le cancer du col de l’utérus ; dans le cancer de la vessie, il n’est indiqué qu’en association. Le CUP n’est pas une indication enregistrée.</p>
<div class="lab">Posologie</div><p>La posologie est de 400 mg/m² ou calculée par la formule de Calvert (AUC × [DFG + 25]), qui n’est pas applicable si la clairance est inférieure à 60 mL/min ; la dose est alors adaptée à la clairance. Le traitement n’est répété qu’après 4 semaines au moins, avec des neutrophiles d’au moins 2000/mm³ et des plaquettes d’au moins 100 000/mm³.</p>
<div class="lab">Effets indésirables</div><p>La myélosuppression est dose-limitante (nadir médian à 21 jours en monothérapie, à 15 jours en association) ; l’anémie touche 71 % des patients et la thrombopénie 25 %. Une ototoxicité est fréquente.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité au carboplatine ou à un autre dérivé du platine, insuffisance rénale grave, insuffisance hépatique grave, myélosuppression grave, saignements tumoraux, troubles auditifs majeurs, grossesse, allaitement.</p>
<div class="lab">Interactions</div><p>Prudence avec les aminosides et les diurétiques de l’anse (néphrotoxicité et ototoxicité cumulées) ; myélotoxicité accrue avec les autres myélosuppresseurs ; vaccins vivants à éviter.</p>
<div class="lab">Mécanisme</div><p>Le carboplatine forme des ponts entre les brins de l’ADN ; son action est en principe indépendante de la phase du cycle cellulaire.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse du carboplatine (Sandoz), AIPS/AmiKo, GTIN 7680548290014, mise à jour de février 2026</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-paclitaxel" data-title="Paclitaxel (information professionnelle suisse)">
<div class="lab">Indications suisses</div><p>Le paclitaxel est indiqué dans les cancers de l’ovaire, bronchique non à petites cellules et du sein. Le CUP n’est pas une indication enregistrée.</p>
<div class="lab">Prémédication</div><p>La prémédication associe un corticoïde, un anti-H1 et un anti-H2, car l’hypersensibilité peut être grave.</p>
<div class="lab">Adaptation</div><p>Si une neutropénie inférieure à 500/mm³ ou une neuropathie sévère survient sous traitement, la dose des cycles suivants est réduite de 20 %. Avant chaque cycle, les neutrophiles doivent atteindre 1500/mm³ et les plaquettes 100 000/mm³.</p>
<div class="lab">Posologie</div><p>175 mg/m² en perfusion de 3 heures toutes les 3 semaines dans les indications enregistrées ; dose ajustée en cas d’insuffisance hépatique, administration non recommandée si elle est sévère.</p>
<div class="lab">Contre-indications</div><p>Antécédent d’hypersensibilité sévère au paclitaxel ou à un excipient (ricinoléate de macrogolglycérol), neutrophiles inférieurs à 1500/mm³, grossesse et allaitement.</p>
<div class="lab">Interactions</div><p>Métabolisme en partie par le CYP2C8 et le CYP3A4 : prudence avec leurs inhibiteurs et leurs inducteurs. Avec le cisplatine, le paclitaxel est toujours administré en premier.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse du paclitaxel (Accord), AIPS/AmiKo, GTIN 7680668530014, mise à jour de novembre 2023</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-calvert" data-title="Formule de Calvert">
<div class="lab">Formule</div><p>Dose (mg) = AUC × (DFG + 25). L’AUC est l’aire sous la courbe cible ; le DFG est le débit de filtration glomérulaire.</p>
<div class="lab">Exemple chiffré</div><p>AUC de 2 et DFG de 80 mL/min : 2 × (80 + 25) = 210 mg. Exemple pédagogique fictif.</p>
<div class="lab">Limite</div><p>Non applicable si la clairance est inférieure à 60 mL/min (information professionnelle suisse).</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse du carboplatine (Sandoz), AIPS/AmiKo, GTIN 7680548290014</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="pareto-c77-definition" data-title="Pareto — Définition et périmètre">
<p class="ratio" data-cover="c77-0,c77-1"></p><ul><li>C77 est l’atteinte ganglionnaire secondaire ou non précisée ; les lymphomes primitifs (C81–C86, C96) en sont exclus.</li><li>Un CUP exige une malignité prouvée et un bilan de base puis étendu complet.</li><li>Lorsque le primitif est connu, la métastase relève du stade N de ce cancer.</li></ul></template>
<template data-pop="pareto-c77-epidemio" data-title="Pareto — Fréquence et pronostic">
<p class="ratio" data-cover="c77-2"></p><ul><li>Les sources lues ne contiennent aucune donnée suisse sur le CUP ou sur C77.</li><li>Un siège sus-claviculaire comporte un risque de malignité de 34 à 86 %. Le CUP représente 1 à 3 % des cancers.</li><li>Les sous-groupes favorables changent le pronostic, mais 70 à 85 % des patients n’en relèvent pas.</li></ul></template>
<template data-pop="pareto-c77-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="c77-3"></p><ul><li>Les lymphatiques initiaux sont perméables ; VEGF-C et VEGF-D agissent sur VEGFR-3, et CCL21 attire les cellules portant CCR7.</li><li>Dans des modèles animaux, le ganglion sentinelle se prépare, puis sa colonisation induit une tolérance immunitaire.</li><li>Le siège oriente vers le primitif sans l’établir.</li></ul></template>
<template data-pop="pareto-c77-causes" data-title="Pareto — Causes et topographie">
<p class="ratio" data-cover="c77-4"></p><ul><li>Les causes se répartissent en trois familles : réactive, hématologique et métastatique.</li><li>Le siège (cervical, sus-claviculaire, axillaire, inguinal) oriente vers le primitif.</li><li>La hernie, le tissu mammaire accessoire et le vaccin simulent une atteinte tumorale.</li></ul></template>
<template data-pop="pareto-c77-clinique" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="c77-5,c77-6"></p><ul><li>Une persistance de plus de 2 semaines ou un signe d’alarme justifie un bilan.</li><li>L’examen ORL est complet ; on examine aussi le testicule chez l’homme et le sein chez la femme.</li><li>La fosse sus-claviculaire gauche se palpe systématiquement.</li></ul></template>
<template data-pop="pareto-c77-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="c77-7,c77-8"></p><ul><li>La séquence va de la suspicion à la recherche du primitif, en passant par l’imagerie, le tissu et l’immunohistochimie.</li><li>Dans le cou, la cytoponction ou le trocart précèdent l’exérèse.</li><li>Il ne faut pas manquer les entités traitables.</li><li>Le bilan du CUP exige une histologie et non une cytologie seule.</li></ul></template>
<template data-pop="pareto-c77-prise" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="c77-9"></p><ul><li>Le traitement suit le sous-groupe favorable ou défavorable.</li><li>Le traitement du CUP cervical dépend du stade N1, N2 ou N3 ; celui du CUP axillaire féminin est celui d’un cancer du sein N+.</li><li>Une forme défavorable relève d’un doublet de platine et du NGS ; les soins palliatifs seuls sont envisagés si l’espérance de vie est inférieure à 4 mois.</li></ul></template>
<template data-pop="pareto-c77-suivi" data-title="Pareto — Suivi et pronostic">
<p class="ratio" data-cover="c77-10"></p><ul><li>La survie à 5 ans du CUP cervical est de 61 %, 51 % et 26 % selon le stade N.</li><li>Aucun suivi n’est fondé sur des preuves.</li><li>Le suivi est structuré si l’intention est curative et symptomatique si elle est palliative.</li></ul></template>
<template data-pop="pareto-c77-particulieres" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="c77-11"></p><ul><li>Chez le sujet âgé, plus de 50 % des adénopathies cervicales inexpliquées correspondent à un lymphome ou à une métastase.</li><li>Le carboplatine et le paclitaxel sont contre-indiqués pendant la grossesse et l’allaitement ; la formule de Calvert n’est pas applicable si la clairance est inférieure à 60 mL/min.</li><li>Une adénopathie axillaire unilatérale et non suspecte est considérée comme bénigne dans les 12 semaines suivant un vaccin à ARN messager.</li><li>Le cancer confirmé est déclaré au registre cantonal des tumeurs dans les quatre semaines.</li></ul></template>
<template data-pop="pareto-c77-imagerie" data-title="Pareto — Imagerie">
<p class="ratio" data-cover="c77-e-2"></p><ul><li>L’échographie vient en premier ; l’IRM est préférée pour le nasopharynx.</li><li>Le TEP-CT détecte le primitif dans 36 à 38 % des cas.</li><li>Dans le CUP cervical, le TEP-CT précède la panendoscopie.</li></ul></template>
<template data-pop="pareto-c77-prelevement" data-title="Pareto — Prélèvement">
<p class="ratio" data-cover="c77-e-3"></p><ul><li>La cytoponction a une sensibilité de 56 % et une valeur prédictive négative de 72 %.</li><li>Le trocart a une précision de 95 %.</li><li>L’exérèse est la référence hors du cou ; dans le cou, elle expose à un essaimage de 7 %.</li></ul></template>
<template data-pop="pareto-c77-ihc" data-title="Pareto — Immunohistochimie et biologie moléculaire">
<p class="ratio" data-cover="c77-e-4"></p><ul><li>L’immunohistochimie classe d’abord la lignée, puis oriente vers l’organe grâce à CK7 et CK20.</li><li>Le HPV et l’EBV orientent l’origine d’un CUP cervical.</li><li>Le NGS est proposé en routine ; PD-L1 et les protéines MMR font partie du bilan.</li></ul></template>
<template data-pop="pareto-c77-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="c77-s-anat-cours"></p><ul><li>Le territoire de drainage oriente vers le primitif.</li><li>Un ganglion sus-claviculaire évoque le poumon, le sein et l’œsophage ; à gauche, il évoque l’abdomen et le pelvis.</li></ul></template>
<template data-pop="pareto-c77-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="c77-s-histo-cours"></p><ul><li>Les lymphatiques initiaux n’ont pas de valves et possèdent une membrane basale discontinue.</li><li>Le trocart préserve l’architecture.</li></ul></template>
<template data-pop="pareto-c77-physio-sci" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="c77-s-physio-cours"></p><ul><li>VEGF-C et VEGF-D agissent sur VEGFR-3 ; CCL21 attire les cellules portant CCR7.</li><li>Dans un modèle murin, le ganglion colonisé induit une tolérance immunitaire.</li></ul></template>
<template data-pop="pareto-c77-bioch" data-title="Pareto — Biochimie et biologie moléculaire">
<p class="ratio" data-cover="c77-s-bioch-cours"></p><ul><li>CK7 et CK20 définissent quatre quadrants.</li><li>Le profil est probabiliste ; il se confirme par un facteur de transcription spécifique et par la clinique.</li></ul></template>
<template data-pop="pareto-c77-strategie" data-title="Pareto — Stratégie pharmacologique">
<p class="ratio" data-cover="c77-p-1"></p><ul><li>Le CUP n’est pas une indication enregistrée du carboplatine.</li><li>Les formes défavorables relèvent d’un doublet carboplatine-paclitaxel ou cisplatine-gemcitabine.</li></ul></template>
<template data-pop="pareto-c77-carbo" data-title="Pareto — Carboplatine">
<p class="ratio" data-cover="c77-p-2"></p><ul><li>La formule de Calvert s’écrit AUC × (DFG + 25) ; elle n’est pas applicable si la clairance est inférieure à 60 mL/min.</li><li>Le nadir médian survient à 21 jours en monothérapie et à 15 jours en association ; l’anémie touche 71 % des patients et la thrombopénie 25 %.</li></ul></template>
<template data-pop="pareto-c77-paclitaxel" data-title="Pareto — Paclitaxel">
<p class="ratio" data-cover="c77-p-3"></p><ul><li>La prémédication associe un corticoïde, un anti-H1 et un anti-H2.</li><li>Le paclitaxel est contre-indiqué si les neutrophiles sont inférieurs à 1500/mm³.</li></ul></template>
<template data-pop="pareto-c77-ci" data-title="Pareto — Contre-indications et surveillance">
<p class="ratio" data-cover="c77-p-4"></p><ul><li>Le carboplatine est contre-indiqué en cas d’hypersensibilité au platine, d’insuffisance rénale ou hépatique grave, de myélosuppression grave, de saignements tumoraux, de troubles auditifs majeurs, de grossesse et d’allaitement.</li><li>Le paclitaxel est contre-indiqué en cas d’hypersensibilité sévère, de neutrophiles inférieurs à 1500/mm³, de grossesse et d’allaitement.</li><li>Avant chaque cure, le médecin contrôle l’hémogramme et recherche un aminoside, un diurétique de l’anse, un vaccin vivant ou un modulateur du CYP2C8 ou du CYP3A4.</li></ul></template>
<template data-pop="c77-sm-taille" data-title="Taille du ganglion : normal et pathologique">
<div class="lab">Normal</div><p>Chez le sujet sain, des ganglions de moins de 1 cm sont fréquemment palpables au cou, à l’aisselle et à l’aine (Swiss Medical Weekly 2010). Des ganglions inguinaux infracentimétriques sont fréquents et physiologiques ; de petits ganglions axillaires s’observent chez le travailleur manuel (Collège de médecine interne 2013).</p>
<div class="lab">Seuil</div><p>Chez l’adulte, un ganglion devient anormal au-delà de 1 cm de petit axe. Le ganglion jugulo-digastrique reste normal jusqu’à 1,5 cm ; le ganglion épitrochléen est anormal au-delà de 5 mm. Dans le contexte d’un cancer anal, un ganglion de 5 mm est déjà considéré comme anormal (Swiss Medical Weekly 2024).</p>
<div class="lab">Technique</div><p>La taille se mesure et s’exprime en centimètres ; le siège et la taille se reportent sur un schéma daté, qui permet de juger l’évolution (cours universitaire francophone 2011).</p>
<div class="lab">Valeur</div><p>Dans une série citée par la revue suisse de 2010, la malignité passe de 8 % pour une surface de 1 à 2,25 cm² à 38 % au-delà de 2,25 cm².</p>
<div class="lab">Piège</div><p>Un ganglion épitrochléen ou poplité est toujours pathologique, même petit (Collège de médecine interne 2013). À l’inverse, un ganglion inguinal de 1 cm est souvent réactif.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a> ; <a href="https://smw.ch/index.php/smw/article/download/1079/1076" target="_blank" rel="noopener">Richner et Laifer, Swiss Medical Weekly 2010;140:98–104</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/semiologie/enseignement/esemio5/site/html/cours.pdf" target="_blank" rel="noopener">Pavic et Gérome, Sémiologie hématologique, 2013</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/hematologie/enseignement/hematologie_291/site/html/cours.pdf" target="_blank" rel="noopener">Item 291, adénopathie superficielle</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sm-consistance" data-title="Consistance du ganglion">
<div class="lab">Définition</div><p>La consistance se décrit en trois degrés : molle et fluctuante, ferme et élastique, ou dure, ligneuse, rocailleuse (cours universitaire francophone 2011).</p>
<div class="lab">Mécanisme</div><p>Un ganglion mou et fluctuant traduit une suppuration. Un ganglion dur traduit un envahissement : des cellules malignes non lymphoïdes ont colonisé le ganglion, sans réaction inflammatoire (cours universitaire francophone 2011 ; Collège de médecine interne 2013).</p>
<div class="lab">Valeur</div><p>La dureté est en faveur d’un cancer, la mollesse en faveur d’une infection (Swiss Medical Weekly 2010). Aucune source lue ne chiffre la sensibilité ni la spécificité de la consistance.</p>
<div class="lab">Piège</div><p>Il n’existe aucun signe sémiologique formel de bénignité d’une adénopathie (cours universitaire francophone 2011). Un ganglion ferme et élastique reste ambigu.</p>
<p class="src">Références : <a href="https://archives.uness.fr/sites/campus-unf3s-2014/hematologie/enseignement/hematologie_291/site/html/cours.pdf" target="_blank" rel="noopener">Item 291, adénopathie superficielle</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/semiologie/enseignement/esemio5/site/html/cours.pdf" target="_blank" rel="noopener">Pavic et Gérome, Sémiologie hématologique, 2013</a> ; <a href="https://smw.ch/index.php/smw/article/download/1079/1076" target="_blank" rel="noopener">Richner et Laifer, Swiss Medical Weekly 2010</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sm-douleur" data-title="Douleur et sensibilité du ganglion">
<div class="lab">Définition</div><p>Le caractère douloureux se précise : spontané, provoqué par la palpation ou par certaines circonstances, comme la douleur à l’ingestion d’alcool de certains lymphomes de Hodgkin (cours universitaire francophone 2011).</p>
<div class="lab">Mécanisme</div><p>Le ganglion réagit aux antigènes qu’il filtre : une infection du territoire drainé provoque une réaction lymphocytaire et macrophagique, et l’adénopathie devient inflammatoire (cours universitaire francophone 2011). Les sources lues ne détaillent pas la voie de la douleur elle-même.</p>
<div class="lab">Valeur</div><p>Un ganglion mou et sensible est en faveur d’une infection (Swiss Medical Weekly 2010) ; des ganglions mobiles, douloureux et petits sont plus volontiers infectieux (Collège de médecine interne 2013). Aucune valeur chiffrée n’est donnée.</p>
<div class="lab">Piège</div><p>L’absence de douleur ne signe pas le cancer : la tuberculose ganglionnaire donne une adénopathie « froide », sans signe inflammatoire (cours universitaire francophone 2011).</p>
<p class="src">Références : <a href="https://archives.uness.fr/sites/campus-unf3s-2014/hematologie/enseignement/hematologie_291/site/html/cours.pdf" target="_blank" rel="noopener">Item 291, adénopathie superficielle</a> ; <a href="https://smw.ch/index.php/smw/article/download/1079/1076" target="_blank" rel="noopener">Richner et Laifer, Swiss Medical Weekly 2010</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/semiologie/enseignement/esemio5/site/html/cours.pdf" target="_blank" rel="noopener">Pavic et Gérome, Sémiologie hématologique, 2013</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sm-fixite" data-title="Mobilité et adhérence aux plans voisins">
<div class="lab">Technique</div><p>On recherche l’adhérence éventuelle du ganglion aux plans superficiels, c’est-à-dire à la peau, et aux plans profonds (cours universitaire francophone 2011).</p>
<div class="lab">Valeur</div><p>Une fixation au tissu sous-cutané entre dans la définition de l’adénopathie (Swiss Medical Weekly 2024). Une mobilité réduite fait suspecter la malignité d’une adénopathie cervicale (Swiss Medical Weekly 2024), et la fixation au plan sous-jacent est suspecte de cancer (Swiss Medical Weekly 2010). Aucune valeur chiffrée n’est donnée.</p>
<div class="lab">Mécanisme</div><p>Les sources lues décrivent la fixité comme un signe sans en détailler le support histologique. L’extension extracapsulaire, documentée à l’histologie et de valeur pronostique dans le CUP cervical, n’y est pas reliée explicitement à la fixité palpée : cette lacune est déclarée.</p>
<div class="lab">Piège</div><p>L’hidradénite axillaire est adhérente à la peau, mais sensible et superficielle : ce n’est pas une adénopathie (cours universitaire francophone 2011).</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024</a> ; <a href="https://smw.ch/index.php/smw/article/download/1079/1076" target="_blank" rel="noopener">Richner et Laifer, Swiss Medical Weekly 2010</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/hematologie/enseignement/hematologie_291/site/html/cours.pdf" target="_blank" rel="noopener">Item 291, adénopathie superficielle</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sm-peau" data-title="Peau en regard du ganglion">
<div class="lab">Normal et pathologique</div><p>La peau en regard peut être normale, rouge, inflammatoire, ulcérée ou fistulisée (cours universitaire francophone 2011).</p>
<div class="lab">Mécanisme</div><p>Une suppuration du ganglion peut se fistuliser à la peau, comme dans la maladie des griffes du chat ou la tuberculose, qui évolue vers l’« écrouelle » (cours universitaire francophone 2011).</p>
<div class="lab">Valeur</div><p>Une ulcération cutanée figure parmi les signes qui font suspecter la malignité d’une adénopathie cervicale (Swiss Medical Weekly 2024). Aucune valeur chiffrée n’est donnée.</p>
<div class="lab">Piège</div><p>Une fistule n’est pas propre à l’infection : dans le cas clinique de la revue suisse de 2024, une masse inguinale abcédée et fistulisée était une métastase d’un carcinome épidermoïde du pénis.</p>
<p class="src">Références : <a href="https://archives.uness.fr/sites/campus-unf3s-2014/hematologie/enseignement/hematologie_291/site/html/cours.pdf" target="_blank" rel="noopener">Item 291, adénopathie superficielle</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sm-siege" data-title="Siège de l’adénopathie et territoire de drainage">
<div class="lab">Principe</div><p>Chaque aire draine un territoire : le cou draine la face, le cuir chevelu et la sphère ORL ; l’aisselle le membre supérieur, la paroi thoracique et le sein ; l’aine les membres inférieurs, les organes génitaux externes et la marge anale ; le creux sus-claviculaire le médiastin et, à gauche, les viscères sous-diaphragmatiques (Collège de médecine interne 2013).</p>
<div class="lab">Valeur</div><p>Un ganglion sus-claviculaire a un risque de malignité de 34 à 86 %, surtout après 40 ans (Swiss Medical Weekly 2024). À droite, il oriente vers le poumon, l’œsophage ou le médiastin ; à gauche, vers l’estomac, la vésicule, le pancréas, le rein, les testicules, les ovaires ou la prostate (Swiss Medical Weekly 2010).</p>
<div class="lab">Piège</div><p>Pour un ganglion sus-claviculaire, l’examen du territoire est le plus souvent négatif, car les organes drainés sont intrathoraciques ou intra-abdominaux (Collège de médecine interne 2013) : l’imagerie prend le relais.</p>
<p class="src">Références : <a href="https://archives.uness.fr/sites/campus-unf3s-2014/semiologie/enseignement/esemio5/site/html/cours.pdf" target="_blank" rel="noopener">Pavic et Gérome, Sémiologie hématologique, 2013</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024</a> ; <a href="https://smw.ch/index.php/smw/article/download/1079/1076" target="_blank" rel="noopener">Richner et Laifer, Swiss Medical Weekly 2010</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sm-duree" data-title="Durée de l’adénopathie">
<div class="lab">Seuil</div><p>Toute adénopathie persistant plus de 2 semaines est suspecte et justifie un bilan (Swiss Medical Weekly 2024).</p>
<div class="lab">Mécanisme</div><p>Une réaction à une stimulation antigénique filtrée par le ganglion est réversible ; un envahissement par des cellules malignes persiste (cours universitaire francophone 2011). La durée sépare donc, en probabilité, la réaction transitoire de l’atteinte tumorale.</p>
<div class="lab">Divergence</div><p>La figure des drapeaux rouges de la même revue indique plus de 4 semaines ; pour le cou, la revue mentionne un examen au-delà de 2 semaines à 1 mois (Swiss Medical Weekly 2024). La revue de 2010 juge sûre une observation de 3 à 4 semaines chez un patient stable sans suspicion de cancer, sauf pour un ganglion sus- ou infraclaviculaire (Swiss Medical Weekly 2010).</p>
<div class="lab">Piège</div><p>Le délai ne s’applique pas à un ganglion qui porte déjà un signe d’alarme : celui-ci déclenche le bilan sans attente.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024</a> ; <a href="https://smw.ch/index.php/smw/article/download/1079/1076" target="_blank" rel="noopener">Richner et Laifer, Swiss Medical Weekly 2010</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/hematologie/enseignement/hematologie_291/site/html/cours.pdf" target="_blank" rel="noopener">Item 291, adénopathie superficielle</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sm-generaux" data-title="Signes généraux : fièvre, sueurs nocturnes, amaigrissement">
<div class="lab">Recherche</div><p>L’interrogatoire cherche la fièvre, les sueurs nocturnes et la perte de poids comme indices d’une maladie systémique (Swiss Medical Weekly 2010), ainsi que l’asthénie, l’anorexie et le prurit (Collège de médecine interne 2013).</p>
<div class="lab">Valeur</div><p>Les symptômes B figurent parmi les drapeaux rouges de malignité de la revue suisse de 2024, avec l’hépatomégalie et la splénomégalie. Aucune valeur chiffrée n’est donnée.</p>
<div class="lab">Piège</div><p>Ces signes n’orientent ni vers un organe ni vers une nature précise : une infection générale, un lymphome ou un cancer avancé peuvent les produire (Swiss Medical Weekly 2010 ; Swiss Medical Weekly 2024).</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/1079/1076" target="_blank" rel="noopener">Richner et Laifer, Swiss Medical Weekly 2010</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024 (figure 1)</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/semiologie/enseignement/esemio5/site/html/cours.pdf" target="_blank" rel="noopener">Pavic et Gérome, Sémiologie hématologique, 2013</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sm-orl" data-title="Signes ORL associés à une adénopathie cervicale">
<div class="lab">Signes</div><p>Odynophagie, dysphagie, baisse d’audition récente et modification de la voix font suspecter la malignité d’une adénopathie cervicale, comme l’âge supérieur à 40 ans avec consommation d’alcool ou de tabac (Swiss Medical Weekly 2024).</p>
<div class="lab">Mécanisme</div><p>Les ganglions cervicaux drainent toute la sphère ORL (Collège de médecine interne 2013) : un symptôme de la sphère ORL désigne le territoire où peut siéger le primitif.</p>
<div class="lab">Examen</div><p>Un examen complet du cuir chevelu, de la peau, des cavités oropharyngée, nasopharyngée et nasale, du larynx, une otoscopie et la palpation des glandes salivaires, de la thyroïde et des nerfs crâniens sont requis (Swiss Medical Weekly 2024).</p>
<div class="lab">Limite</div><p>La revue ne relie pas chaque symptôme à un siège précis, et aucune valeur chiffrée n’est donnée.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/semiologie/enseignement/esemio5/site/html/cours.pdf" target="_blank" rel="noopener">Pavic et Gérome, Sémiologie hématologique, 2013</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sm-rate" data-title="Rate et foie dans l’examen d’une adénopathie">
<div class="lab">Normal</div><p>La rate normale mesure 12 × 7 cm et n’est normalement pas palpable ; une splénomégalie est toujours pathologique chez l’adulte (Collège de médecine interne 2013).</p>
<div class="lab">Technique</div><p>En décubitus dorsal, jambes fléchies, paroi détendue, la main à plat déprime doucement la paroi. En décubitus latéral droit, bras gauche derrière la tête, la palpation commence bas, dans la fosse iliaque droite, puis remonte vers le rebord costal ; une inspiration profonde fait buter le pôle inférieur d’une rate hypertrophiée contre les doigts. Le bord antéro-interne crénelé est caractéristique (Collège de médecine interne 2013).</p>
<div class="lab">Valeur</div><p>La recherche d’une splénomégalie, d’une hépatomégalie et d’une hypertrophie amygdalienne accompagne l’examen de toute polyadénopathie (cours universitaire francophone 2011). Leur présence fait partie des drapeaux rouges de la revue suisse de 2024.</p>
<div class="lab">Piège</div><p>Une splénomégalie a quatre familles de causes : stimulation immunitaire intense, majoration de la fonction macrophagique, hypertension portale et tumeurs de la rate, dont le lymphome et la métastase d’une tumeur solide (Collège de médecine interne 2013). Elle ne tranche donc pas la nature de l’adénopathie.</p>
<p class="src">Références : <a href="https://archives.uness.fr/sites/campus-unf3s-2014/semiologie/enseignement/esemio5/site/html/cours.pdf" target="_blank" rel="noopener">Pavic et Gérome, Sémiologie hématologique, 2013</a> ; <a href="https://archives.uness.fr/sites/campus-unf3s-2014/hematologie/enseignement/hematologie_291/site/html/cours.pdf" target="_blank" rel="noopener">Item 291, adénopathie superficielle</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024</a>. Consultation du 15.10.2026. Revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="pareto-c77-immuno" data-title="Pareto — Immunologie">
<p class="ratio" data-cover="c77-s-immuno-cours"></p><ul><li>Le ganglion est un organe lymphoïde secondaire ; il grossit d’abord par réaction à un antigène.</li><li>Le ganglion de drainage tumoral devient immunosuppresseur avant l’invasion.</li><li>Dans le CUP, MSI/dMMR et charge mutationnelle élevée prédisent la sensibilité aux inhibiteurs de points de contrôle.</li></ul></template>
<template data-pop="c77-imm-msi" data-title="Instabilité microsatellitaire et inhibiteurs de points de contrôle dans le CUP">
<p>Le déficit des enzymes de réparation des mésappariements (dMMR) se traduit par une instabilité microsatellitaire de haut niveau (MSI) et par une charge de mutations somatiques très élevée, quel que soit le primitif. Ces tumeurs ont de très bonnes chances de répondre aux inhibiteurs de points de contrôle immunitaire.</p>
<p>Dans le CUP, MSI/dMMR et une charge mutationnelle d’au moins 10 mutations par mégabase sont des marqueurs de sensibilité bien établis ; l’expression de PD-L1 joue un rôle secondaire, sans seuil défini. Dans l’étude CUPISCO, avec un seuil de 16 mutations par mégabase, une monothérapie par anti-PD-L1 en première ligne donnait une survie sans progression à 2 ans d’environ 30 % et une survie globale à 2 ans de 65 %. Dans de petites études de phase II sans sélection sur ces marqueurs, la monothérapie par anti-PD-1 donnait une réponse objective d’environ 20 %, une survie sans progression de 4 mois et une survie globale de 11 à 14 mois.</p>
