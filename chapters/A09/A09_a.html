<section class="ilot" id="a09-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. K., 34 ans, consulte au deuxième jour d’une diarrhée aqueuse, six selles par jour, avec nausées et crampes, sans sang ni fièvre. Or, deux collègues présentent les mêmes symptômes depuis un repas commun. Ainsi, ce tableau aigu, non compliqué, évoque une <button class="w" data-k="a09-pa-def">gastro-entérite infectieuse aiguë</button>. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, quels patients justifient un examen des selles ? Ensuite, qui hospitaliser ? Puis, quand un antibiotique est-il indiqué, et lequel ? Enfin, quelles règles d’hygiène et de déclaration s’appliquent ?</p>
<div class="key"><b>À retenir.</b> Selon la SSI : ne tester que si le résultat change la conduite, et ne traiter par antibiotique que si un test a été fait, hors exceptions.</div></section>

<section class="ilot" id="a09-pa-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Pour répondre à ces questions, il faut d’abord définir la maladie. La gastro-entérite infectieuse est une maladie passagère du tube digestif due à des virus, des bactéries, des parasites ou à des toxines bactériennes ; son symptôme principal est l’émission de selles molles ou aqueuses, habituellement trois fois ou plus par 24 heures. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a>.</p>
<p>Par ailleurs, la SSI en propose une <button class="w" data-k="a09-pa-classif">classification</button> fondée sur la durée et la gravité : diarrhée aiguë (moins de 14 jours), persistante (plus de 14 jours), chronique (plus de 30 jours), ainsi que dysenterie, diarrhée sévère et diarrhée du voyageur. En effet, chacune de ces catégories modifie la conduite. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, classification</a>.</p>
<div class="key"><b>À retenir.</b> La diarrhée est aiguë si elle dure moins de 14 jours et persistante au-delà ; la dysenterie désigne des selles glairo-sanglantes.</div></section>

<section class="ilot" id="a09-pa-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Une fois la maladie définie, reste à en mesurer le poids en Suisse. Or, la plupart des gastro-entérites ne sont jamais documentées ; c’est pourquoi les données suisses portent sur les agents à déclaration obligatoire. Ainsi, la campylobactériose est de loin la zoonose la plus déclarée chez l’être humain : 8280 cas confirmés en 2024, soit 92 cas pour 100 000 habitants, contre 6762 en 2023. <a href="https://www.blv.admin.ch/dam/blv/fr/dokumente/tiere/publikationen-und-forschung/statistik-und-berichte/zoonosenbericht_2024.pdf.download.pdf/Zoonosenbericht_CH_2024_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la sécurité alimentaire et des affaires vétérinaires et OFSP, Rapport sur la surveillance des zoonoses et des foyers de toxi-infection alimentaire, données 2024</a>.</p>
<p>De plus, ces chiffres sous-estiment la réalité, car beaucoup de malades ne consultent pas et les selles ne sont pas toujours analysées. Enfin, la transmission est surtout alimentaire, en particulier par la volaille insuffisamment cuite et les contaminations croisées en cuisine. <a href="https://www.blv.admin.ch/dam/blv/fr/dokumente/tiere/publikationen-und-forschung/statistik-und-berichte/zoonosenbericht_2024.pdf.download.pdf/Zoonosenbericht_CH_2024_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la sécurité alimentaire et des affaires vétérinaires et OFSP, Rapport sur la surveillance des zoonoses et des foyers de toxi-infection alimentaire, données 2024</a> ; <a href="https://www.bag.admin.ch/fr/campylobacteriose-fr" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Campylobactériose »</a>.</p>
<div class="key"><b>À retenir.</b> En Suisse, <i>Campylobacter</i> est la première cause bactérienne déclarée de diarrhée.</div></section>

<section class="ilot" id="a09-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Ces agents provoquent la diarrhée par des mécanismes différents, qui expliquent la clinique. En effet, une toxine préformée dans l’aliment agit en quelques heures et donne surtout des vomissements, avec une durée inférieure à 12 heures ; c’est le cas de <i>Staphylococcus aureus</i>, de <i>Bacillus cereus</i> et de <i>Clostridium perfringens</i>. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, agents pathogènes</a>.</p>
<p>À l’inverse, les germes invasifs — <i>Campylobacter</i>, salmonelles, shigelles — envahissent la muqueuse colique ; par conséquent, ils donnent fièvre, douleurs et parfois du sang dans les selles, c’est-à-dire une <button class="w" data-k="a09-pa-dysenterie">dysenterie</button>. Enfin, les virus comme le norovirus agissent surtout sur l’intestin grêle et donnent une diarrhée aqueuse avec vomissements. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a>.</p>
<div class="key"><b>Corrélation clinique.</b> Une incubation de quelques heures avec vomissements au premier plan évoque une toxine ; une fièvre avec du sang évoque un germe invasif.</div></section>

<section class="ilot" id="a09-pa-4"><h2><span class="n">4</span>Agents pathogènes et transmission</h2>
<p>Ce mécanisme permet de classer les <button class="w" data-k="a09-pa-agents">agents</button> rencontrés. Ainsi, la SSI cite les virus (rotavirus, norovirus, adénovirus), les bactéries (<i>Campylobacter</i>, salmonelles non typhiques, shigelles, <i>E. coli</i> pathogènes, <i>Clostridioides difficile</i>) et les parasites comme <i>Giardia intestinalis</i>. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, agents pathogènes</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> Le norovirus est une petite particule sans enveloppe ; il résiste donc à de nombreux désinfectants et persiste sur les surfaces, et quelques particules suffisent à infecter. Il détruit transitoirement les entérocytes de l’intestin grêle, ce qui réduit l’absorption de l’eau et provoque vomissements et diarrhée aqueuse sans sang. C’est pourquoi il cause des épidémies brèves dans les collectivités et pourquoi l’hygiène des mains et des surfaces prime. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a>.</div>
<p>Par ailleurs, <i>C. difficile</i> relève d’une démarche propre, développée dans le cours <a href="#/entry/A04">A04</a>. De plus, une anamnèse de voyage oriente vers d’autres agents ; elle fait l’objet d’une directive distincte. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, diagnostic</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, pathogènes</a>.</p></section>

<section class="ilot" id="a09-pa-5"><h2><span class="n">5</span>Anamnèse et examen</h2>
<p>Connaissant les agents, l’anamnèse les recherche de façon ordonnée, puis l’examen évalue la gravité.</p>
<div class="two"><div class="card"><b>Anamnèse</b><p>Début, nombre de selles, sang ou glaires ; fièvre ; vomissements ; repas suspect et cas groupés ; voyage récent ; antibiotiques ou hospitalisation récents ; immunosuppression ; métier dans l’alimentation ou les soins.</p></div>
<div class="card"><b>Examen</b><p>Signes de <button class="w" data-k="a09-pa-deshyd">déshydratation</button> et de choc ; température ; douleurs et sensibilité abdominales ; état de conscience. Ce sont ces éléments qui décident de l’hospitalisation. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, complications et hospitalisation</a>.</p></div></div>
<p>Ainsi, l’anamnèse oriente l’étiologie, tandis que l’examen mesure le retentissement ; c’est pourquoi les deux sont nécessaires avant toute décision d’examen ou de traitement.</p></section>

<section class="ilot" id="a09-pa-6"><h2><span class="n">6</span>Quand faire un examen des selles</h2>
<p>Au terme de cette évaluation, la plupart des patients n’ont besoin d’aucun examen. En effet, la plupart des épisodes, même bactériens, guérissent spontanément ; c’est pourquoi la SSI restreint l’<button class="w" data-k="a09-e-indic">examen microbiologique des selles</button>, avec hémocultures si nécessaire, à des situations précises. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, diagnostic</a>.</p>
<table class="t"><thead><tr><th>Recommandé (SSI)</th><th>À envisager (SSI)</th></tr></thead><tbody>
<tr><td>Diarrhée sanglante ; immunosuppression ; antibiotiques ou hospitalisation récents ; fièvre supérieure à 38,3 °C pendant 72 heures ou plus ; fortes douleurs abdominales ; sepsis</td><td>Diarrhée de 7 jours ou plus ; âge de 65 ans ou plus avec comorbidités ; raisons épidémiologiques</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Ce tableau traduit le principe de la SSI : on ne teste que si le résultat change la conduite. Le sang, l’immunosuppression, une antibiothérapie ou une hospitalisation récentes signalent un germe invasif, une infection opportuniste ou <i>C. difficile</i>, dont la prise en charge diffère ; en revanche, une diarrhée aqueuse brève chez l’adulte sain guérit seule. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a>.</div>
<p>Le tableau montre ainsi que la gravité et le terrain, non le seul nombre de selles, déclenchent l’examen. Par ailleurs, en cas d’antibiothérapie ou d’hospitalisation récente, la recherche porte sur <i>C. difficile</i> selon la démarche du cours <a href="#/entry/A04">A04</a>. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, diagnostic</a>.</p>
<div class="key"><b>À retenir.</b> M. K. n’a ni sang, ni fièvre, ni terrain à risque : aucun examen n’est indiqué.</div>
<button class="pareto-btn ui" data-k="pareto-a09-clinique">▲ Loi de Pareto — Évaluer une diarrhée aiguë</button></section>

<section class="ilot" id="a09-pa-7"><h2><span class="n">7</span>Complications et hospitalisation</h2>
<div class="alert"><b>Hospitaliser selon la SSI.</b> Vomissements avec incapacité de garder les liquides ; signes de choc ou de déshydratation majeure. À discuter : âge avancé, fièvre, diarrhée sanglante, douleurs et sensibilité abdominales, incontinence, contexte psychosocial, comorbidités ou médicaments aggravant la déshydratation et l’insuffisance rénale, immunosuppression. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, complications et hospitalisation</a>.</div>
<p>Parmi les <button class="w" data-k="a09-pa-compl">complications</button>, la déshydratation est la plus fréquente, en particulier aux âges extrêmes et chez les patients porteurs de comorbidités. En outre, certaines sont propres à un agent : le <button class="w" data-k="a09-pa-shu">syndrome hémolytique et urémique</button> après <i>E. coli</i> producteur de shigatoxine ou <i>Shigella dysenteriae</i>, l’arthrite réactive ou le syndrome de Guillain-Barré après <i>Campylobacter</i>, salmonelles, <i>Yersinia</i> ou shigelles. Enfin, un syndrome de l’intestin irritable post-infectieux passager survient dans 7 à 10 % des cas. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, complications</a>.</p>
<div class="trap"><span class="k">Piège.</span> Chez un patient sous diurétique, inhibiteur de l’enzyme de conversion ou anti-inflammatoire, une diarrhée banale peut provoquer une insuffisance rénale aiguë : suspendre ces traitements se discute.</div></section>

<section class="ilot" id="a09-pa-8"><h2><span class="n">8</span>Traitement de soutien</h2>
<p>En l’absence de critère d’hospitalisation, le traitement est d’abord symptomatique. Ainsi, chez l’adulte en bonne santé, la SSI conseille l’hydratation orale — eau, jus, soupes ou boissons isotoniques — et réserve les <button class="w" data-k="a09-p-sro">solutions de réhydratation orale</button> aux adultes à risque d’évolution défavorable ; en effet, chez l’adulte sain, ces solutions ne raccourcissent pas la maladie. De plus, l’alimentation suit l’appétit, en petits repas légers. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement de soutien</a>.</p>
<p>Quant aux médicaments, ils ne sont habituellement pas nécessaires. Cependant, le <button class="w" data-k="a09-p-lop">lopéramide</button> peut aider dans la diarrhée légère à modérée pour poursuivre des activités planifiées ; en revanche, il est contre-indiqué en cas de sang ou de glaires, de fièvre élevée, d’infection à <i>E. coli</i> producteur de shigatoxine ou de shigellose. Enfin, les antiémétiques ne servent qu’en cas de vomissements profus. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement de soutien</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=40363" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Imodium®, décembre 2025</a>.</p>
<div class="key"><b>À retenir.</b> Le patient boit et mange selon son appétit ; le lopéramide n’est permis qu’en l’absence de sang et de fièvre.</div></section>

<section class="ilot" id="a09-pa-9"><h2><span class="n">9</span>Antibiothérapie : indications strictes</h2>
<p>Le traitement de soutien suffit dans la grande majorité des cas ; l’antibiotique reste donc une exception. Ainsi, la SSI recommande une <button class="w" data-k="a09-p-azi">azithromycine 500 mg par voie orale une fois par jour pendant 3 jours</button> en empirique seulement en cas de dysenterie, de douleurs modérées à sévères avec fièvre supérieure à 38,3 °C, de signes de sepsis ou d’infection extra-intestinale, ou d’immunosuppression. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement empirique</a> ; <a href="https://doi.org/10.53738/revmed.2025.21.913.47031" target="_blank" rel="noopener" data-reference-source="1">« Diarrhée aiguë : approche rationnelle pour maîtriser le traitement antibiotique », Rev Med Suisse 2025;21:724-729 (référence citée par la SSI)</a>.</p>
<p>Par ailleurs, un <button class="w" data-k="a09-p-cible">traitement ciblé</button> n’est justifié que si l’examen était indiqué et que les symptômes ne s’améliorent pas spontanément à réception du résultat ; il se discute en particulier après 7 jours de diarrhée ou chez la personne de 65 ans ou plus avec comorbidités. En effet, une antibiothérapie inutile expose aux effets indésirables, à <i>C. difficile</i> et aux résistances. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement ciblé</a>.</p>
<div class="trap"><span class="k">Erreur fréquente.</span> Prescrire une quinolone pour une diarrhée aqueuse non compliquée : ni indiquée, ni efficace contre une cause virale, et les résistances de <i>Campylobacter</i> aux quinolones augmentent en Suisse. <a href="https://www.blv.admin.ch/dam/blv/fr/dokumente/tiere/publikationen-und-forschung/statistik-und-berichte/zoonosenbericht_2024.pdf.download.pdf/Zoonosenbericht_CH_2024_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la sécurité alimentaire et des affaires vétérinaires et OFSP, Rapport sur la surveillance des zoonoses et des foyers de toxi-infection alimentaire, données 2024</a>.</div>
<button class="pareto-btn ui" data-k="pareto-a09-traitement">▲ Loi de Pareto — Traiter une diarrhée aiguë</button></section>

<section class="ilot" id="a09-pa-10"><h2><span class="n">10</span>Diarrhée du voyageur</h2>
<p>Ces principes s’appliquent aussi au retour de voyage, avec quelques particularités. En effet, 80 à 90 % des diarrhées du voyageur sont bactériennes, 5 à 10 % virales et 5 à 10 % dues à des protozoaires ; or, ces derniers ont une incubation d’une à deux semaines et peuvent persister des semaines sans traitement. <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, pathogènes</a>.</p>
<p>Dès lors, la SSI recommande l’antibiotique toujours en cas de dysenterie, et en cas de <button class="w" data-k="a09-pa-severe">diarrhée sévère</button> ; en revanche, elle le déconseille dans la diarrhée modérée. Le premier choix est l’azithromycine 500 mg une fois par jour pendant 3 jours ou 1 g en dose unique ; les quinolones ne sont qu’un second choix, car les résistances sont élevées. Enfin, la <button class="w" data-k="a09-pa-giardia">giardiase</button> est toujours traitée, par ornidazole 500 mg deux fois par jour pendant 5 jours. <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, thérapie</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> Le trophozoïte de <i>Giardia</i> adhère à la muqueuse du grêle par son disque ventral, sans l’envahir ; il altère la bordure en brosse et gêne l’absorption des graisses et des sucres. C’est pourquoi la giardiase donne une diarrhée persistante, des ballonnements et parfois une perte de poids, sans fièvre ni sang, et pourquoi on la recherche devant une diarrhée de plus de 14 jours. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a>.</div>
<p>De plus, une diarrhée de 14 jours ou plus, sévère, ou résistante au traitement empirique impose un diagnostic microbiologique incluant la recherche de parasites. <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, diagnostic</a>.</p></section>

<section class="ilot" id="a09-pa-11"><h2><span class="n">11</span>Hygiène, déclaration et travail</h2>
<p>Une fois le patient traité, il reste à protéger son entourage. Ainsi, la SSI demande d’informer le patient des <button class="w" data-k="a09-pa-hyg">mesures d’hygiène</button> : lavage soigneux des mains au savon, serviettes personnelles ou à usage unique, nettoyage quotidien des toilettes et des poignées. De plus, certains agents sont à déclaration obligatoire auprès de l’OFSP. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, prévention et déclaration</a>.</p>
<p>Par ailleurs, pour certains métiers, notamment dans l’alimentation, un certificat d’arrêt de travail jusqu’à au moins 48 heures après la fin des symptômes doit être établi ; toutefois, les règles de reprise relèvent des autorités cantonales, et il n’existe en principe pas d’interdiction légale de travailler. Enfin, après une cryptosporidiose, la piscine est à éviter pendant deux semaines. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, prévention et déclaration</a>.</p>
<p><b>Cas récapitulatif.</b> Pour conclure, M. K. n’a aucun critère d’examen ni d’antibiotique. Par conséquent, il boit, mange selon l’appétit, peut prendre du lopéramide en l’absence de fièvre et de sang, et applique les mesures d’hygiène ; en outre, s’il travaille en cuisine, il reçoit un arrêt de travail jusqu’à 48 heures après la fin des symptômes.</p></section>

<p>En synthèse, les valeurs à retenir se résument ainsi.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur (SSI 2026)</th></tr></thead><tbody>
<tr><td>Diarrhée</td><td>Selles molles ou aqueuses, 3 fois ou plus par 24 heures</td></tr>
<tr><td>Aiguë / persistante / chronique</td><td>Moins de 14 jours / plus de 14 jours / plus de 30 jours</td></tr>
<tr><td>Seuil de fièvre</td><td>Plus de 38,3 °C</td></tr>
<tr><td>Antibiotique empirique</td><td>Azithromycine 500 mg une fois par jour, 3 jours</td></tr>
<tr><td>Arrêt de travail, métiers de l’alimentation</td><td>Au moins 48 heures après la fin des symptômes</td></tr>
<tr><td>Campylobactériose déclarée en 2024</td><td>8280 cas, 92 pour 100 000 habitants</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque valeur oriente une décision : le seuil de 14 jours distingue l’infection aiguë, surtout virale ou bactérienne, de la diarrhée persistante, où l’on recherche un parasite ; le seuil de fièvre de 38,3 °C signale un germe invasif ; enfin, l’éviction de 48 heures dans les métiers de l’alimentation couvre la période d’excrétion maximale. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a>.</div>
