<template data-pop="a09-pa-def" data-title="Gastro-entérite infectieuse (SSI)">
<p>Maladie passagère du tube digestif due à des virus, des bactéries, des parasites ou à des toxines bactériennes. Symptôme principal : selles molles ou aqueuses, habituellement 3 fois ou plus par 24 heures ; parfois nausées, vomissements soudains, sang ou glaires, fièvre, malaise.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-pa-classif" data-title="Classification (SSI)">
<table class="t"><tbody><tr><td>Aiguë</td><td>3 selles molles ou plus par 24 heures, moins de 14 jours</td></tr><tr><td>Persistante</td><td>Début aigu, plus de 14 jours</td></tr><tr><td>Chronique</td><td>Plus de 30 jours, hors de la directive</td></tr><tr><td>Sévère</td><td>Subjectivement inquiétante, activités planifiées impossibles</td></tr><tr><td>Dysenterie</td><td>Selles glairo-sanglantes, avec ou sans fièvre ou ténesme</td></tr><tr><td>Du voyageur</td><td>Pendant ou peu après un séjour en zone (sub)tropicale à ressources limitées</td></tr></tbody></table><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-pa-dysenterie" data-title="Dysenterie">
<p>Gastro-entérite infectieuse aiguë avec selles glaireuses et sanglantes, avec ou sans fièvre ou ténesme ; elle signe en général un germe invasif. Elle justifie un examen des selles et une azithromycine empirique, et contre-indique le lopéramide.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition, diagnostic, traitement</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=40363" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Imodium®, décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-pa-agents" data-title="Agents de la gastro-entérite (SSI)">
<div class="lab">Virus</div><p>Rotavirus, norovirus, adénovirus.</p><div class="lab">Bactéries</div><p><i>Campylobacter</i>, salmonelles non typhiques, shigelles, <i>E. coli</i> entéropathogènes, entéroagrégatifs, entérotoxinogènes et entéro-invasifs, <i>C. difficile</i>.</p><div class="lab">Toxines préformées</div><p><i>S. aureus</i>, <i>B. cereus</i>, <i>C. perfringens</i> : début en quelques heures, durée inférieure à 12 heures.</p><div class="lab">Parasites</div><p><i>Giardia intestinalis</i>, <i>Cryptosporidium</i>, <i>Entamoeba histolytica</i>.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, agents pathogènes</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, pathogènes</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-pa-deshyd" data-title="Signes de déshydratation">
<p>Soif, sécheresse des muqueuses, baisse de la diurèse, tachycardie, hypotension orthostatique, troubles de la conscience aux stades avancés. Les signes de choc ou une déshydratation majeure imposent l’hospitalisation selon la SSI.</p><p>Cette liste de signes cliniques est une synthèse didactique ; la SSI ne donne pas de score.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, complications et hospitalisation</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-e-indic" data-title="Indications de l’examen des selles (SSI)">
<div class="lab">Recommandé</div><ul><li>Diarrhée sanglante.</li><li>Immunosuppression : chimiothérapie, greffe d’organe, VIH avec moins de 200 lymphocytes CD4 par microlitre.</li><li>Antibiotiques ou hospitalisation récents (<i>C. difficile</i>).</li><li>Fièvre supérieure à 38,3 °C pendant 72 heures ou plus.</li><li>Fortes douleurs abdominales ; sepsis.</li></ul><div class="lab">À envisager</div><ul><li>Diarrhée de 7 jours ou plus.</li><li>65 ans ou plus avec comorbidités.</li><li>Raisons épidémiologiques, épidémie.</li></ul><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, diagnostic</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-pa-compl" data-title="Complications (SSI)">
<ul><li>Déshydratation et troubles électrolytiques.</li><li>Syndrome hémolytique et urémique.</li><li>Arthrite réactive, syndrome de Guillain-Barré.</li><li>Infections systémiques à salmonelles (endovasculaires, abcès, ostéomyélite) ou à <i>Campylobacter</i> (endovasculaires).</li><li>Mégacôlon toxique.</li><li>Syndrome de l’intestin irritable post-infectieux passager : 7 à 10 %.</li></ul><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, complications</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-pa-shu" data-title="Syndrome hémolytique et urémique">
<p>Association d’anémie hémolytique, de thrombopénie et d’insuffisance rénale aiguë, compliquant surtout les infections à <i>E. coli</i> producteur de shigatoxine (notamment O157) et à <i>Shigella dysenteriae</i>. C’est pourquoi la SSI contre-indique le lopéramide dans ces infections.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, complications, traitement de soutien</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-p-sro" data-title="Solutions de réhydratation orale">
<p>Boissons standardisées associant glucose et électrolytes. Chez l’adulte en bonne santé, pas d’avantage sur la durée de la maladie ni sur le nombre de selles ; à envisager chez l’adulte à risque d’évolution défavorable. Au retour de voyage, la SSI propose aussi le thé sucré et les biscuits salés.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement de soutien</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, thérapie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-p-lop" data-title="Lopéramide">
<p>Opioïde périphérique ralentissant le transit. Adulte : 4 mg, puis 2 mg après chaque selle liquide, maximum 16 mg par jour ; arrêt dès des selles normales ou sans selle pendant plus de 12 heures. Contre-indications : sang ou glaires, fièvre élevée, germes invasifs, <i>E. coli</i> producteur de shigatoxine, shigellose, colite pseudomembraneuse, enfant de moins de 6 ans.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=40363" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Imodium®, décembre 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement de soutien</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-p-azi" data-title="Azithromycine">
<div class="lab">Indications empiriques (SSI)</div><ul><li>Dysenterie.</li><li>Douleurs modérées à sévères avec fièvre supérieure à 38,3 °C.</li><li>Sepsis ou infection extra-intestinale.</li><li>Immunosuppression.</li></ul><div class="lab">Dose</div><p>500 mg une fois par jour pendant 3 jours ; au retour de voyage, 1 g en dose unique possible.</p><div class="lab">Précautions</div><p>Allongement de l’intervalle QT ; effets digestifs ; résistances en augmentation.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement empirique</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, thérapie</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=51352" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zithromax®, mars 2023</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-p-cible" data-title="Traitement antibiotique ciblé">
<p>Justifié si l’examen des selles était indiqué et en l’absence de résolution ou d’amélioration spontanée à réception du résultat ; à envisager surtout après 7 jours de diarrhée ou chez la personne de 65 ans ou plus avec comorbidités. Le choix suit le germe et l’antibiogramme, selon la référence suisse citée par la SSI.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement ciblé</a> ; <a href="https://doi.org/10.53738/revmed.2025.21.913.47031" target="_blank" rel="noopener" data-reference-source="1">« Diarrhée aiguë : approche rationnelle pour maîtriser le traitement antibiotique », Rev Med Suisse 2025;21:724-729 (référence citée par la SSI)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-pa-severe" data-title="Diarrhée sévère et modérée (SSI)">
<p>Sévère : subjectivement inquiétante, les activités planifiées ne sont pas réalisables ; antibiotique recommandé au retour de voyage. Modérée : inquiétante mais gênant seulement les activités ; antibiotique déconseillé. Dysenterie : antibiotique toujours.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, définition</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, thérapie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-pa-giardia" data-title="Giardiase et ornidazole">
<p><i>Giardia intestinalis</i> : protozoaire, incubation d’une à deux semaines ou plus ; flatulences nauséabondes ; peut persister des semaines. Toujours traiter : ornidazole 500 mg deux fois par jour pendant 5 jours ; alternative métronidazole 500 mg trois fois par jour pendant 7 jours. Ornidazole contre-indiqué en cas d’affection du système nerveux central ou d’anomalie de la formule sanguine.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, pathogènes et thérapie</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44231" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Tiberal®, novembre 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-pa-hyg" data-title="Mesures d’hygiène (SSI)">
<ul><li>Lavage soigneux des mains à l’eau chaude et au savon.</li><li>Serviettes personnelles ou à usage unique.</li><li>Nettoyage quotidien des toilettes et des poignées de porte.</li><li>Isolement à l’hôpital et en établissement médico-social selon l’agent.</li><li>Cryptosporidiose : pas de piscine pendant 2 semaines après le dernier épisode.</li></ul><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, prévention et déclaration</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a09-e-pcr" data-title="PCR multiplex des selles">
<p>Avantages : résultat rapide, plusieurs agents (bactéries, virus, parasites) en un seul test, haute sensibilité. Inconvénients : coût (environ 350 francs avec les protozoaires selon la SSI), absence d’antibiogramme, détection de germes souvent non pertinents.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, diagnostic</a> ; <a href="https://ssi.guidelines.ch/guideline/6492/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Diarrhée du voyageur », validée le 19 juin 2026, diagnostic</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-a09-clinique" data-title="Loi de Pareto — Évaluer une diarrhée aiguë">
<p class="ratio" data-cover="a09-pa-1,a09-pa-3,a09-pa-5,a09-pa-6,a09-pa-7"></p><ul><li>Moins de 14 jours, souvent auto-limitante.</li><li>Examen des selles : sang, fièvre persistante, immunosuppression, antibiotiques récents, sepsis.</li><li>Hospitaliser : incapacité de boire, choc, déshydratation majeure.</li></ul>
</template>
<template data-pop="pareto-a09-traitement" data-title="Loi de Pareto — Traiter une diarrhée aiguë">
<p class="ratio" data-cover="a09-pa-8,a09-pa-9,a09-pa-10"></p><ul><li>Boire et manger selon l’appétit.</li><li>Lopéramide sans sang ni fièvre.</li><li>Azithromycine 500 mg pendant 3 jours seulement selon indications strictes.</li><li>Giardiase : toujours traiter.</li></ul>
</template>
<template data-pop="pareto-a09-examens" data-title="Loi de Pareto — Examens de la diarrhée aiguë">
<p class="ratio" data-cover="a09-e-1,a09-e-2"></p><ul><li>Pas d’examen si non compliquée.</li><li>PCR multiplex privilégiée, à interpréter avec la clinique.</li><li>Culture si antibiogramme nécessaire.</li></ul>
</template>
<template data-pop="pareto-a09-pharma" data-title="Loi de Pareto — Pharmacologie de la diarrhée aiguë">
<p class="ratio" data-cover="a09-p-1,a09-p-2,a09-p-3"></p><ul><li>Azithromycine en empirique ; quinolones en second choix.</li><li>Lopéramide : contre-indications à connaître.</li><li>Ornidazole pour la giardiase.</li></ul>
</template>
