<template data-pop="g24-def" data-title="Définition 2025 de la dystonie">
<div class="lab">Définition</div><p data-evidence="G24-C0366">Trouble du mouvement caractérisé par des mouvements anormaux, des postures anormales, ou les deux, soutenus ou intermittents, à motif répétitif, parfois trémulants ou saccadés, souvent déclenchés ou aggravés par l’action volontaire et associés à un débordement.</p>
<div class="lab">Changements depuis 2013</div><p data-evidence="G24-C0367">Le consensus de 2013 parlait de contractions musculaires ; l’expression a été supprimée, car elle pouvait faire penser à une atteinte neuromusculaire. Le caractère saccadé a été ajouté.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0368">Les critères de classification s’appliquent à un diagnostic déjà posé ; des critères diagnostiques spécifiques restent nécessaires.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a> ; <a href="https://doi.org/10.1002/mds.25475" target="_blank" rel="noopener">Albanese et collaborateurs, consensus de classification, Movement Disorders 2013</a>.</p></template>
<template data-pop="g24-geste" data-title="Geste antagoniste">
<div class="lab">Définition</div><p data-evidence="G24-C0369">Manœuvre volontaire qui améliore temporairement la posture dystonique. En anglais, on le nomme « sensory trick ».</p>
<div class="lab">Application</div><p data-evidence="G24-C0370">Dans la vignette fictive, un doigt posé sur le menton redresse la tête. Le médecin note quel geste agit, sur quel segment et pendant combien de temps.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0371">L’effet est temporaire et son mécanisme n’est pas établi dans les sources lues ; il ne remplace pas un traitement.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a>.</p></template>
<template data-pop="g24-axes" data-title="Deux axes de classification">
<div class="lab">Principe</div><p data-evidence="G24-C0372">L’axe I décrit les caractéristiques cliniques ; l’axe II décrit l’étiologie et la pathogenèse. Les séparer évite d’attribuer une cause à un tableau clinique qui n’en prouve aucune.</p>
<div class="lab">Orientation</div><p data-evidence="G24-C0373">L’axe I oriente déjà : une forme focale suggère souvent une dystonie idiopathique, une forme généralisée plutôt une dystonie génétique. L’axe II se complète par les examens.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a>.</p></template>
<template data-pop="g24-medic" data-title="Dystonie médicamenteuse">
<div class="lab">Tableaux</div><p data-evidence="G24-C0374">Trois tableaux existent : la dystonie aiguë (antipsychotiques, métoclopramide), la crise oculogyre et la dyskinésie tardive. Ils se rangent dans G24.0 ; un code supplémentaire du chapitre des causes externes précise la substance.</p>
<div class="lab">Mécanisme</div><p data-evidence="G24-C0375">Les médicaments qui agissent sur le système dopaminergique induisent des dystonies, un des arguments en faveur du rôle des noyaux gris centraux.</p>
<div class="lab">Application</div><p data-evidence="G24-C0376">L’anamnèse médicamenteuse est systématique. Devant une dystonie aiguë, on arrête le produit en cause et on traite les symptômes.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G20–G26</a> ; <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Haldol®, mise à jour novembre 2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Paspertin®, mise à jour janvier 2020</a>.</p></template>
<template data-pop="g24-gch1" data-title="Dystonie dopa-sensible">
<div class="lab">Mécanisme</div><p data-evidence="G24-C0377">Un déficit autosomique dominant de synthèse de la tétrahydrobioptérine, cofacteur de la synthèse de dopamine, entraîne un déficit dopaminergique. Il se lie au gène GCH1. Les formes liées à TH et SPR sont récessives et s’accompagnent de signes associés chez l’enfant.</p>
<div class="lab">Clinique</div><p data-evidence="G24-C0378">Les fluctuations diurnes sont typiques. La réponse à la lévodopa est spectaculaire à de faibles doses : les patients de Segawa répondent à moins de 3 × 100 mg par jour.</p>
<div class="lab">Application</div><p data-evidence="G24-C0379">Seule forme avec un traitement causal : lévodopa avec un inhibiteur de la dopa-décarboxylase, à vie, avec une fenêtre thérapeutique étroite et des signes résiduels possibles.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a>.</p></template>
<template data-pop="g24-wilson" data-title="Maladie de Wilson dans le bilan">
<div class="lab">Rôle dans le cours</div><p data-evidence="G24-C0380">La ligne directrice allemande la range parmi les causes à rechercher, en la qualifiant de dystonie complexe, terme déconseillé depuis 2025. Chez l’adulte de moins de 50 ans, elle impose une lampe à fente, une céruléoplasmine et un dosage du cuivre sérique et urinaire.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0381">La description clinique primaire de la maladie n’a pas été lue pour ce cours : le texte n’en dit rien de plus que son rôle de cause à rechercher.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a>.</p></template>
<template data-pop="g24-scp" data-title="Stimulation cérébrale profonde">
<div class="lab">Données</div><p data-evidence="G24-C0382">Deux essais contrôlés rapportent une amélioration d’environ 50 % sur l’échelle BFMDRS à 6 à 12 mois dans les dystonies généralisées ou segmentaires sévères idiopathiques, maintenue à 3 ans puis jusqu’à 8 à 16 ans. Les troubles de la parole touchent environ 5 % des patients. Dans la dystonie cervicale, la réduction atteint 40 % sur l’échelle TWSTRS à 3 mois chez 62 patients.</p>
<div class="lab">Application</div><p data-evidence="G24-C0383">Le meilleur bénéfice est observé chez le sujet jeune, avec dystonie mobile et évolution courte ; on l’envisage tôt, avant les séquelles orthopédiques. Dans les formes secondaires, les résultats sont variables : 21 % pour la paralysie cérébrale, 25 % pour les NBIA, 41 % pour la forme tardive.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0384">La source est une ligne directrice expirée, en révision. La panne d’une batterie de stimulateur peut déclencher une crise dystonique.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a>.</p></template>
<template data-pop="g24-terminologie" data-title="Termes du consensus 2025">
<div class="lab">Principe</div><p data-evidence="G24-C0385">Le consensus recommande de décrire séparément le tremblement et la dystonie, au lieu de parler de « tremblement dystonique », dont les emplois sont incohérents. De même, « muscles dystoniques » est déconseillé, car l’expression suggère une physiopathologie neuromusculaire.</p>
<div class="lab">Application</div><p data-evidence="G24-C0386">Un patient qui tremble de la tête et dont le cou est tordu reçoit deux descriptions : un tremblement et une dystonie cervicale. En cas de doute, l’analyse cinématique ou physiologique aide à trancher.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a> ; <a href="https://doi.org/10.1212/WNL.0000000000210209" target="_blank" rel="noopener">Shaikh et collaborateurs, Challenges in Describing Tremor and Dystonia, Neurology 2024</a>.</p></template>
<template data-pop="g24-distribution" data-title="Distribution : exemples">
<div class="lab">Définitions</div><p data-evidence="G24-C0387">Une région : focale. Deux ou trois régions contiguës : segmentaire. Deux ou trois régions non contiguës : multifocale. Un membre supérieur et un membre inférieur du même côté : hémidystonie. Au-delà : généralisée, par exemple le tronc et deux autres régions, ou trois à quatre membres sans le tronc.</p>
<div class="lab">Exemples</div><p data-evidence="G24-C0388">Les deux bras forment une forme bi-brachiale, donc multifocale. Les deux jambes forment une forme bi-crurale, également multifocale. La dystonie cervicale reste focale même si les épaules sont atteintes.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a>.</p></template>
<template data-pop="g24-dyt" data-title="Nomenclature génétique DYT">
<div class="lab">Principe</div><p data-evidence="G24-C0389">Le préfixe DYT est suivi du gène, selon une task force de la Movement Disorder Society. L’ancien symbole numérique figure dans la dernière colonne, car les anciens manuels l’emploient encore.</p>
<table class="t"><thead><tr><th>Forme</th><th>Phénotype</th><th>Transmission</th><th>Ancien symbole</th></tr></thead><tbody><tr><td data-evidence="G24-C0390">DYT-TOR1A</td><td data-evidence="G24-C0391">Dystonie généralisée à début précoce</td><td data-evidence="G24-C0392">Autosomique dominante</td><td data-evidence="G24-C0393">DYT1</td></tr><tr><td data-evidence="G24-C0394">DYT-THAP1</td><td data-evidence="G24-C0395">Segmentaire ou généralisée de l’adolescent ou de l’adulte jeune, dysphonie fréquente</td><td data-evidence="G24-C0396">Autosomique dominante</td><td data-evidence="G24-C0397">DYT6</td></tr><tr><td data-evidence="G24-C0398">DYT-ANO3</td><td data-evidence="G24-C0399">Cervicale ou segmentaire avec tremblement</td><td data-evidence="G24-C0400">Autosomique dominante</td><td data-evidence="G24-C0401">DYT24</td></tr><tr><td data-evidence="G24-C0402">DYT-GNAL</td><td data-evidence="G24-C0403">Crânio-cervicale de l’adulte</td><td data-evidence="G24-C0404">Autosomique dominante</td><td data-evidence="G24-C0405">DYT25</td></tr><tr><td data-evidence="G24-C0406">DYT-KMT2B</td><td data-evidence="G24-C0407">Début aux membres inférieurs dans l’enfance, généralisation, dysmorphie, déficit cognitif léger</td><td data-evidence="G24-C0408">Autosomique dominante</td><td data-evidence="G24-C0409">DYT28</td></tr><tr><td data-evidence="G24-C0410">DYT/PARK-GCH1</td><td data-evidence="G24-C0411">Dystonie dopa-sensible (Segawa)</td><td data-evidence="G24-C0412">Autosomique dominante</td><td data-evidence="G24-C0413">DYT5a</td></tr><tr><td data-evidence="G24-C0414">DYT/PARK-TH, -SPR</td><td data-evidence="G24-C0415">Dopa-sensibles de l’enfant avec signes associés</td><td data-evidence="G24-C0416">Autosomique récessive</td><td data-evidence="G24-C0417">DYT5b</td></tr><tr><td data-evidence="G24-C0418">DYT/PARK-ATP1A3</td><td data-evidence="G24-C0419">Dystonie-parkinsonisme à début rapide</td><td data-evidence="G24-C0420">Autosomique dominante</td><td data-evidence="G24-C0421">DYT12</td></tr><tr><td data-evidence="G24-C0422">DYT/MYOC-SGCE</td><td data-evidence="G24-C0423">Myoclonus-dystonie</td><td data-evidence="G24-C0424">Autosomique dominante</td><td data-evidence="G24-C0425">DYT11</td></tr></tbody></table>
<p data-evidence="G24-C0426">Le tableau montre que le phénotype oriente le gène : début précoce généralisé évoque TOR1A, atteinte crânio-cervicale de l’adulte évoque GNAL, début rapide avec parkinsonisme évoque ATP1A3.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a>.</p></template>
<template data-pop="g24-fonctionnelle" data-title="Dystonie fonctionnelle">
<div class="lab">Place dans la classification</div><p data-evidence="G24-C0427">Le consensus 2025 la range parmi les imitateurs de la dystonie, alors que la ligne directrice de 2021 la nommait « psychogène » parmi les causes acquises.</p>
<div class="lab">Clinique</div><p data-evidence="G24-C0428">Début brutal, distractibilité, suppressibilité et autres signes fonctionnels ; souvent dans un phénotype fonctionnel mixte. Une dystonie fixée à début aigu ou subaigu est souvent, mais pas toujours, fonctionnelle.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0429">Les critères diagnostiques de la dystonie fonctionnelle n’ont pas été lus pour ce cours.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a>.</p></template>
<template data-pop="g24-reseau" data-title="Réseau moteur et dystonie">
<div class="lab">Hypothèse</div><p data-evidence="G24-C0430">Trouble central d’un réseau reliant les noyaux gris centraux, le cervelet et le cortex. Aucun trouble biochimique commun n’est démontré.</p>
<div class="lab">Arguments</div><p data-evidence="G24-C0431">Lésions des noyaux gris centraux dans les formes secondaires, dystonies induites par des médicaments dopaminergiques, captation métabolique modifiée en TEP malgré une IRM normale.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0432">La physiopathologie détaillée (perte d’inhibition, plasticité, intégration sensorimotrice) n’a été lue qu’en résumé.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a> ; <a href="https://doi.org/10.1038/s41572-018-0023-6" target="_blank" rel="noopener">Balint et collaborateurs, Dystonia, Nature Reviews Disease Primers 2018</a>.</p></template>
<template data-pop="g24-prevalence" data-title="Études de prévalence de la dystonie">
<div class="lab">Études</div><p data-evidence="G24-C0433">L’étude européenne ESEMED (huit pays, 1996 et 1997, cliniques spécialisées) donne 152 par million pour la dystonie primaire. La méta-analyse de 16 études donne 16,43 pour 100 000. La Société suisse de la dystonie avance environ 12 000 personnes en Suisse, sans méthode publiée.</p>
<div class="lab">Limites</div><p data-evidence="G24-C0434">Toutes les sources reconnaissent une sous-estimation. Les données européennes sont anciennes, les études sont surtout hospitalières, et les deux articles ne sont lus qu’en résumé. Aucune épidémiologie suisse publiée n’a été trouvée.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s004150070094" target="_blank" rel="noopener">ESEMED, prévalence de la dystonie primaire dans huit pays européens, Journal of Neurology 2000</a> ; <a href="https://doi.org/10.1002/mds.25244" target="_blank" rel="noopener">Steeves et collaborateurs, méta-analyse de prévalence de la dystonie primaire, Movement Disorders 2012</a> ; <a href="https://www.dystonie.ch/" target="_blank" rel="noopener">Société suisse de la dystonie, page d’information</a>.</p></template>
<template data-pop="g24-toxine-meca" data-title="Mécanisme de la toxine botulique">
<div class="lab">Mécanisme</div><p data-evidence="G24-C0435">La chaîne lourde se lie aux terminaisons nerveuses et la toxine est internalisée par la protéine SV2. La chaîne légère de BoNT-A clive SNAP-25 et bloque la libération d’acétylcholine ; une faiblesse musculaire apparaît en quelques jours.</p>
<div class="lab">Récupération</div><p data-evidence="G24-C0436">Un bourgeonnement collatéral de l’axone se forme, puis la jonction est restituée en quelques semaines : ce phénomène explique le délai d’action et l’atténuation de l’effet.</p>
<div class="lab">Application</div><p data-evidence="G24-C0437">Latence, pic et durée fixent le calendrier : environ une semaine, quatre semaines et 10 à 12 semaines dans la dystonie cervicale.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a>.</p></template>
<template data-pop="g24-colcap" data-title="Concept Col-Cap">
<div class="lab">Principe</div><p data-evidence="G24-C0438">Il sépare la tête (caput, articulations de l’occiput à C2) du rachis cervical (collis) selon l’inclinaison, la rotation, la flexion et l’extension, soit huit motifs de base. Plus de 60 % des patients associent plusieurs motifs, parfois avec une translation.</p>
<div class="lab">Application</div><p data-evidence="G24-C0439">Les muscles clés sont le splénius de la tête et du cou, le semi-épineux, l’oblique inférieur de la tête, l’élévateur de la scapula, le sterno-cléido-mastoïdien et le scalène moyen. Décrire le motif permet de choisir les muscles à injecter.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0440">Le guide Dystonia 3×3 est un consensus d’experts non validé prospectivement, destiné à la formation.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/toxins18090378" target="_blank" rel="noopener">Dystonia 3×3, guide de formation à la toxine botulique dans la dystonie cervicale, 2026</a>.</p></template>
<template data-pop="g24-meige" data-title="Syndrome de Meige">
<div class="lab">Définition</div><p data-evidence="G24-C0441">Dystonie segmentaire crânienne associant l’atteinte de la face supérieure (blépharospasme) et inférieure (bouche, mâchoire).</p>
<div class="lab">Traitement</div><p data-evidence="G24-C0442">La toxine est le traitement du blépharospasme ; la stimulation cérébrale profonde est une option si un syndrome de Meige est présent. L’information suisse d’Akineton® cite le syndrome de Meige parmi ses indications.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Akineton®, mise à jour mai 2022</a>.</p></template>
<template data-pop="g24-laryngee" data-title="Dystonie laryngée">
<div class="lab">Formes</div><p data-evidence="G24-C0443">Le type adducteur donne une voix forcée et étranglée ; le type abducteur une voix soufflée.</p>
<div class="lab">Traitement</div><p data-evidence="G24-C0444">Pour le type adducteur, la toxine améliore la voix chez 70 à 95 % des patients pendant 12 à 16 semaines, l’injection étant guidée par EMG ou laryngoscopie. Pour le type abducteur, les preuves sont insuffisantes.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0445">Le rattachement exact au code de la CIM-10-GM n’a pas été vérifié dans l’index alphabétique.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a>.</p></template>
<template data-pop="g24-oculogyre" data-title="Crise oculogyre">
<div class="lab">Définition</div><p data-evidence="G24-C0446">Dystonie aiguë avec déviation tonique et conjuguée des yeux vers le haut.</p>
<div class="lab">Facteurs de risque</div><p data-evidence="G24-C0447">Âge jeune, sexe masculin, forte dose, voie parentérale, neuroleptique de haute puissance, arrêt brusque d’un anticholinergique, antécédents familiaux de dystonie.</p>
<div class="lab">Conduite</div><p data-evidence="G24-C0448">Arrêter le produit en cause ; le traitement repose surtout sur les anticholinergiques selon une revue non européenne. La dose vient de l’information suisse du bipéridène.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Akineton®, mise à jour mai 2022</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Paspertin®, mise à jour janvier 2020</a> ; <a href="https://doi.org/10.1177/0253717620942096" target="_blank" rel="noopener">Mahal et collaborateurs, Spotlight on Oculogyric Crisis, Indian Journal of Psychological Medicine 2021</a>.</p></template>
<template data-pop="g24-tardive" data-title="Dyskinésie et dystonie tardives">
<div class="lab">Définition</div><p data-evidence="G24-C0449">Mouvements rythmiques involontaires de la langue, du visage, de la bouche ou de la mâchoire sous traitement antipsychotique prolongé ou après son arrêt ; parfois irréversibles ; classés dans G24.0.</p>
<div class="lab">Piège</div><p data-evidence="G24-C0450">La reprise, l’augmentation ou le changement d’antipsychotique peuvent masquer les mouvements sans les guérir.</p>
<div class="lab">Traitement</div><p data-evidence="G24-C0451">La clozapine ou l’olanzapine peuvent être envisagées ; la stimulation cérébrale profonde donne en moyenne 41 % d’amélioration.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Haldol®, mise à jour novembre 2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Paspertin®, mise à jour janvier 2020</a>.</p></template>
<template data-pop="g24-differentiel" data-title="Imitateurs de la dystonie">
<div class="lab">Principe</div><p data-evidence="G24-C0452">Le terme « imitateurs » est préféré à « pseudodystonie ». La dystonie fonctionnelle en fait partie.</p>
<div class="lab">Séparer</div><p data-evidence="G24-C0453">Une myoclonie est brusque ; une dystonie saccadée lui ressemble et l’électrophysiologie peut aider. Un tremblement est oscillant ; on le décrit séparément. Une contracture est une pathologie des tissus mous.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mds.30220" target="_blank" rel="noopener">Albanese et collaborateurs, Definition and Classification of Dystonia, Movement Disorders 2025</a> ; <a href="https://doi.org/10.1212/WNL.0000000000210209" target="_blank" rel="noopener">Shaikh et collaborateurs, Challenges in Describing Tremor and Dystonia, Neurology 2024</a>.</p></template>
<template data-pop="g24-cim" data-title="Codage CIM-10-GM de la dystonie">
<div class="lab">Catégorie</div><p data-evidence="G24-C0454">G24 Dystonie inclut la dyskinésie et exclut la paralysie cérébrale athétosique, classée sous G80.3. Les huit sous-catégories vont de G24.0 (dystonie médicamenteuse) à G24.9 (dystonie, sans précision), avec le torticolis spasmodique en G24.3 et le blépharospasme en G24.5.</p>
<div class="lab">Précisions</div><p data-evidence="G24-C0455">Le torticolis sans précision est classé M43.6 et exclu de G24.3. Pour G24.0, un code supplémentaire du chapitre 20 de la classification précise la substance. G24.4 inclut la dyskinésie orofaciale.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0456">L’index alphabétique n’a pas été consulté : le rattachement du syndrome de Meige, de la dystonie laryngée, de la crampe de l’écrivain et de la dystonie tardive est à confirmer par le codeur.</p>
