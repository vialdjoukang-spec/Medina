ft:65%; top:35%}[data-g24-figure="neck"] [data-g24-mark="4"]{left:33%; top:81%}[data-g24-figure="basal"] [data-g24-mark="1"]{left:35%; top:55%}[data-g24-figure="basal"] [data-g24-mark="2"]{left:19%; top:62%}[data-g24-figure="basal"] [data-g24-mark="3"]{left:67%; top:62%}[data-g24-figure="basal"] [data-g24-mark="4"]{left:77%; top:66%}[data-g24-figure="motor"] [data-g24-mark="1"]{left:64%; top:13%}[data-g24-figure="motor"] [data-g24-mark="2"]{left:54%; top:25%}[data-g24-figure="motor"] [data-g24-mark="3"]{left:40%; top:61%}[data-g24-figure="histo"] [data-g24-mark="1"]{left:43%; top:32%}[data-g24-figure="histo"] [data-g24-mark="2"]{left:54%; top:51%}[data-g24-figure="histo"] [data-g24-mark="3"]{left:91%; top:95%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#g24-1">Définition</a></li><li><a href="#g24-2">Épidémiologie</a></li><li><a href="#g24-3">Physiopathologie</a></li><li><a href="#g24-4">Démarche clinique</a></li><li><a href="#g24-5">Anamnèse</a></li><li><a href="#g24-6">Examen clinique</a></li><li><a href="#g24-7">Syndromes</a></li><li><a href="#g24-8">Diagnostic positif</a></li><li><a href="#g24-9">Explorations</a></li><li><a href="#g24-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#g24-11">Prise en charge</a></li><li><a href="#g24-12">Prévention, suivi et pronostic</a></li><li><a href="#g24-13">Points clés</a></li><li><a href="#g24-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="G24"><section class="ilot" id="g24-question" ><h2>Même posture, même cause et même traitement ?</h2><p><b>Vignettes fictives.</b> Une personne ne peut plus écrire sans que sa main prenne une position inhabituelle. Une autre tourne involontairement la tête et l’améliore brièvement en touchant son menton. Un patient présente une posture cervicale et une difficulté à parler après un antiémétique. Un enfant marche moins bien en fin de journée. Ces situations appellent une description précise et une recherche de cause, pas le même traitement automatique.</p><p>L’enjeu est de reconnaître le phénomène, rechercher une urgence respiratoire ou systémique, décrire les deux axes et ne pas manquer une cause traitable. Les médicaments symptomatiques, les injections et les traitements causaux ont des indications et des limites différentes.</p><div class="key"><b>À retenir.</b> Décrire le mouvement, établir le contexte et choisir la décision qui change les soins.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires et situations urgentes</a>.</p></section>
<section class="ilot" id="g24-1" ><h2>1. Définition : un trouble du mouvement, puis une étiologie et un code</h2><p>Selon le consensus international 2025, la <button class="w" data-k="g24-definition">dystonie</button> se manifeste par des mouvements ou postures anormaux, soutenus ou intermittents, souvent organisés en un <button class="w" data-k="g24-pattern">motif répétitif</button>. Ils peuvent être tremblants ou saccadés, être déclenchés ou aggravés par l’action et s’accompagner d’un débordement. La torsion est fréquente, mais n’est pas indispensable : les spasmes palpébraux ou laryngés en font partie.</p><p>Ce n’est ni le nom d’une maladie musculaire unique ni une preuve d’étiologie génétique. Une contraction involontaire produit la posture ; la localisation du mécanisme peut être un réseau nerveux. Une rétraction mécanique, une spasticité ou un autre mouvement anormal peuvent lui ressembler.</p><table class="t"><thead><tr><th>OFS 2024</th><th>Libellé ou portée</th></tr></thead><tbody><tr><td>G24.0</td><td>Dystonie médicamenteuse ; inclusion dyskinésie tardive, médicament à identifier par code supplémentaire au besoin</td></tr><tr><td>G24.1</td><td>Dystonie idiopathique familiale ; inclusion idiopathique sans autre indication</td></tr><tr><td>G24.2</td><td>Dystonie idiopathique non familiale</td></tr><tr><td>G24.3</td><td>Torticolis spasmodique</td></tr><tr><td>G24.4</td><td>Dystonie bucco-faciale idiopathique</td></tr><tr><td>G24.5</td><td>Blépharospasme</td></tr><tr><td>G24.8 / G24.9</td><td>Autres dystonies / dystonie sans précision</td></tr></tbody></table><p>La <button class="w" data-k="g24-classification">classification clinique</button> ne remplace pas la nomenclature. G24 exclut la paralysie cérébrale athétosique vers G80.3, qui inclut la paralysie cérébrale dystonique. G24.3 exclut le torticolis sans précision M43.6. Aucun sous-code.6 ou.7 n’est inventé ; un signe de dystonie ne suffit pas seul à choisir le code final.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G24 exclusion G80.3, G24.3 exclusion M43.6</a>.</p><p><button class="w" data-k="g24-exp-1">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-1">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-2" ><h2>2. Épidémiologie : distinguer une estimation générale et une enquête historique</h2><p>L’étude ESDE publiée en 2000 a recherché les cas de dystonie primaire identifiés par des neurologues d’adultes spécialisés dans huit pays européens. Pour1996–1997, la prévalence brute annuelle de période était de 152par million, soit 15,2pour100000 ; les auteurs la considèrent sous-estimée en raison de cas non repérés. Le résumé primaire, et non l’article intégral sous abonnement, a été lu.</p><p>La page d’information USZ mise à jour en février 2026 donne un ordre de grandeur général de 40pour100000. Elle n’expose pas une enquête suisse récente de code G24. Ces valeurs ont des populations, des méthodes et des époques différentes : elles ne forment pas deux mesures interchangeables d’une incidence nationale.</p><p>Une dystonie peut débuter à tout âge. Les formes précoces ou étendues orientent davantage vers certaines causes génétiques ou métaboliques ; les formes focales tardives sont souvent idiopathiques. Il s’agit d’orientations, pas d’exclusions. L’âge du début moteur, la famille et les signes associés comptent davantage qu’une moyenne isolée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/11127535/" target="_blank" rel="noopener">EU-ESDE — Résumé primaire viaEuropePMC</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-EPI — Fréquence, âge, évolution et métadonnées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a>.</p><p><button class="w" data-k="g24-exp-2">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-2">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-3" ><h2>3. Physiopathologie : une commande en réseau et un effecteur périphérique</h2><p>Le contrôle d’un geste associe cortex, noyaux gris, thalamus et autres voies sensorimotrices. Les mécanismes de dystonie sont hétérogènes ; une IRM normale n’exclut pas le phénomène. Une dystonie ne suppose donc pas une lésion visible du pallidum ni une destruction dopaminergique universelle.</p><p>Au muscle normal, l’acétylcholine libérée par le motoneurone déclenche une activité électrique, la mobilisation du calcium puis la contraction. Une toxine botuliqueA peut diminuer cette transmission périphérique par clivage de SNAP-25. Elle réduit un effet moteur local sans démontrer ni corriger automatiquement la cause centrale.</p><figure data-g24-figure="neck"><div data-g24-frame="tall"><img src="assets/img/g24/alpha/codex/neck.png" alt="Coupe historique humaine du cou au niveau C6, muscles cervicaux, artère carotide, veines et œsophage étiquetés" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span><span data-g24-mark="4" aria-hidden="true">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Sterno-cléido-mastoïdien, nommé sur l’original : muscle cervical à distinguer des structures voisines.</li><li>Artère carotide commune : structure vasculaire, pas une cible musculaire.</li><li>Œsophage, voisin des muscles cervicaux : repère pour comprendre le risque de dysphagie, sans prédire sa survenue.</li><li>Trapèze, nommé sur la coupe : un muscle parmi plusieurs pouvant participer à une posture.</li></ol><p>Anatomie humaine normale de référence ; la coupe n’identifie pas le muscle responsable chez un patient. Aucun trajet d’aiguille ni plan d’injection n’est dessiné ; l’injection exige anatomie individuelle, formation et guidage adaptés.</p><p data-g24-credit>Gray/Carter, Anatomy of the Human Body, édition 1918, planche 384 · <a href="https://commons.wikimedia.org/wiki/File:Gray384.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Dans certaines formes <button class="w" data-k="g24-dopa">dopa-sensibles</button>, un trouble de synthèse de neurotransmetteur est traitable. <button class="w" data-k="g24-gch1">voie du cofacteur et de la dopamine</button> illustrent un mécanisme différent d’une lésion acquise ; la tyrosinehydroxylase utilise BH4 pour former L-DOPA. Ce raisonnement n’autorise pas la même dose ni le même produit chez tout enfant dystonique.</p><p>Une cause métabolique telle que Wilson, une exposition médicamenteuse, une lésion ou un mécanisme immunitaire demandent leur propre démarche. L’hypothèse mécanistique ne suffit pas à prescrire chélateur, immunothérapie ou stimulation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/10-3-muscle-fiber-contraction-and-relaxation" target="_blank" rel="noopener">NORMAL-MUSCLE — Début chapitre 10.3, transmission et contraction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">BOT-MECH — Mécanisme d’action</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P30793.txt" target="_blank" rel="noopener">NORMAL-GCH1 — Entrée humaine, voie enzymatique et lienDRD</a> ; <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/P07101.txt" target="_blank" rel="noopener">NORMAL-TH — Fonction/catalyse humaine</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray384.png" target="_blank" rel="noopener">IMG-NECK — Provenance, description, droits et pixels originaux</a>.</p><p><button class="w" data-k="g24-exp-3">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-3">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-4" ><h2>4. Démarche clinique : trier avant de classer</h2><ol><li><b>Évaluer la sécurité.</b> Difficulté à respirer ou déglutir, altération de conscience, fièvre avec aggravation rapide, contractions diffuses épuisantes ou défaillance générale demandent un circuit urgent.</li><li><b>Reconnaître le phénomène.</b> Décrire mouvement, posture, tâche et variations ; chercher les ressemblances avec un autre trouble moteur ou une cause mécanique.</li><li><b>Décrire l’axeI.</b> Début, famille, régions, temporalité, phénoménologie et signes associés.</li><li><b>Orienter l’axeII.</b> Expositions, causes traitables, imagerie et investigations adaptées, avec expertise si nécessaire.</li><li><b>Fixer un plan mesurable.</b> Cause, symptômes, autonomie, douleur, tolérance et suivi.</li></ol><p>Une <button class="w" data-k="g24-acute">dystonie aiguë médicamenteuse</button> et une <button class="w" data-k="g24-storm">crise dystonique sévère</button> ne se confondent pas avec une dystonie focale stable. Après une injection de toxine, une faiblesse, dysphagie ou dyspnée nouvelle peut aussi signaler une diffusion et nécessite une évaluation immédiate.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a>.</p><p><button class="w" data-k="g24-exp-4">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-4">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-5" ><h2>5. Anamnèse : le début moteur, la tâche et les expositions réelles</h2><p>L’<button class="w" data-k="g24-history">histoire chronologique</button> précise première région atteinte, âge du début moteur, installation aiguë/subaiguë/progressive et évolution. Rechercher variations diurnes, effet du sommeil, activités déclenchantes et <button class="w" data-k="g24-task">spécificité d’une tâche</button>. Une douleur ou une gêne peut précéder le diagnostic, mais ne date pas nécessairement le début du phénomène moteur.</p><p>Noter antécédents familiaux et signes pouvant passer inaperçus chez les proches. Une histoire négative ne supprime pas une cause génétique : expression variable, cas sporadique ou variant de novo peuvent expliquer ce constat. Le conseil génétique ne repose pas seulement sur un ancien numéroDYT.</p><p>L’<button class="w" data-k="g24-drug">exposition médicamenteuse</button> inclut neuroleptiques, antiémétiques et modifications récentes, avec dose, durée, forme et dernière prise réelle. Le métoclopramide peut provoquer une dystonie aiguë même après une prise ; sa FI distingue aussi dyskinésie tardive et syndrome malin. Demander traitements reçus ailleurs, automédication, toxiques et événements neurologiques.</p><p>Évaluer déglutition, voix, vision, marche, écriture, repas, sommeil, douleur, travail et vécu psychologique. Une anxiété n’établit pas une cause fonctionnelle ; elle peut être une conséquence ou une comorbidité.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-CLIN — Formes, symptômes, examen</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a>.</p><p><button class="w" data-k="g24-exp-5">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-5">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-6" ><h2>6. Examen clinique : observer le motif dans plusieurs conditions</h2><p>L’<button class="w" data-k="g24-exam">examen du mouvement</button> commence au repos puis pendant posture et action. Observer la tâche concernée si elle est possible et sûre : écriture, geste instrumental, parole ou marche. Comparer régions, côté, amplitude, rythme et direction ; rechercher répétition du même motif plutôt que tout appeler spasme.</p><p>Un <button class="w" data-k="g24-geste">geste atténuateur</button> peut réduire brièvement la posture sans force mécanique importante ; il soutient la description sans être obligatoire ni absolument spécifique. Chercher <button class="w" data-k="g24-overflow">débordement</button> vers une région voisine et <button class="w" data-k="g24-mirror">dystonie en miroir</button> lors d’une tâche controlatérale. Ce dernier phénomène diffère d’un simple mouvement en miroir.</p><figure data-g24-figure="clinical"><div data-g24-frame="wide"><img src="assets/img/g24/alpha/codex/dystonia.jpg" alt="Photographie réelle d’une personne décrite par l’auteur avec dystonie médicamenteuse, tête tournée et positions des bras et mains visibles" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Position de la tête sur la photographie : description statique, pas identification du médicament.</li><li>Membre supérieur relevé : la posture s’interprète avec l’examen et la chronologie.</li><li>Position de la main et des doigts : une image ne teste ni la tâche, ni la répétition, ni un geste atténuateur.</li></ol><p>L’auteur décrit une dystonie médicamenteuse ; agent exact, dose, chronologie et génotype ne sont pas précisés. Ne pas transformer ce cas en forme universelle, en preuve de crampe de l’écrivain ou en diagnostic génétique. Consentement de publication déclaré par l’auteur, sans identité inférée.</p><p data-g24-credit>James Heilman, MD, photographie humaine publiée en 2010 ; consentement verbal et écrit de publication et de licence déclaré sur la page de provenance · <a href="https://commons.wikimedia.org/wiki/File:Dystonia2010.JPG" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Mobiliser passivement pour distinguer posture soutenue et <button class="w" data-k="g24-fixed">posture fixée</button>, tout en respectant douleur et sécurité. Examiner force, tonus, réflexes, coordination, nerfs crâniens, cognition et signes systémiques. Documenter ce qui est constaté et ce qui reste incertain ; un enregistrement audiovisuel exige consentement dans le parcours réel.</p><p>Pour une forme cervicale, décrire tête, cou et épaules au lieu d’imaginer un seul muscle responsable à partir de la direction visible. L’anatomie et, si indiqués, les examens de guidage complètent l’examen avant traitement spécialisé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires et situations urgentes</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Dystonia2010.JPG" target="_blank" rel="noopener">IMG-CLINICAL — Provenance, description, droits et pixels originaux</a>.</p><p><button class="w" data-k="g24-exp-6">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-6">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-7" ><h2>7. Syndromes : distribution, temporalité et signes associés</h2><p>La <button class="w" data-k="g24-distribution">distribution2025</button> utilise sept régions de référence : face supérieure, face inférieure, cou avec épaules, larynx, membres supérieurs, tronc et membres inférieurs. Focale : une région. Segmentaire : deux ou trois régions contiguës, hors hémidystonie. Multifocale : deux ou trois régions non contiguës, dont deux bras ou deux jambes.</p><p>Hémidystonie : membre supérieur et inférieur d’un même côté, avec ou sans autres régions. Généralisée : distribution dépassant les schémas segmentaire/multifocal sans être hémidystonie. Les exemples du consensus comprennent <b>tronc avec deux autres régions</b>, ou <b>trois/quatre membres sans tronc</b>. Une règle mécanique « plus de trois régions » serait incorrecte. La convention de dystonie cervicale focale malgré épaules est conservée.</p><p>La forme <button class="w" data-k="g24-combined">isolée ou combinée</button> se définit selon les autres manifestations pertinentes : myoclonies distinctes, parkinsonisme, signes pyramidaux, atteinte cognitive/développementale ou systémique. Un mouvement dystonique tremblant n’est pas automatiquement un tremblement indépendant. Douleur ou trouble anxieux seuls ne changent pas une forme isolée en combinée.</p><figure data-g24-figure="motor"><div data-g24-frame="tall"><img src="assets/img/g24/alpha/codex/motor.png" alt="Schéma historique humain de la voie corticospinale, capsule interne et décussation des pyramides, comparaison avec la régulation des noyaux gris" loading="lazy"><span data-g24-mark="1" aria-hidden="true">1</span><span data-g24-mark="2" aria-hidden="true">2</span><span data-g24-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Aire motrice corticale : commande volontaire dans le schéma.</li><li>Capsule interne : passage de fibres, distinct des noyaux striataux voisins.</li><li>Décussation des pyramides : repère de voie corticospinale, pas de la boucle dopaminergique.</li></ol><p>Voie corticospinale humaine normale simplifiée ; dystonie, faiblesse pyramidale et spasticité ne sont pas des synonymes. Cette figure ne démontre pas une inflammation ou une cause acquise chez le patient.</p><p data-g24-credit>Gray 1918, planche 764, trajet moteur humain modifié d’après Poirier · <a href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Enfin, distinguer aiguë médicamenteuse, <button class="w" data-k="g24-tardive">forme tardive</button>, spécifique d’une tâche, fluctuante et paroxystique. Le même code peut englober des mécanismes et des conduites différents ; décrire avant de traiter.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DISTR — Distribution corporelle</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS1 — Table 2, âge et histoire familiale</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener">IMG-MOTOR — Provenance, description, droits et pixels originaux</a>.</p><p><button class="w" data-k="g24-exp-7">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-7">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-8" ><h2>8. Diagnostic positif : clinique, avec un niveau de certitude explicite</h2><p>Le diagnostic de dystonie s’appuie sur un motif moteur compatible, observé dans ses conditions de survenue et relié à l’histoire. Geste atténuateur, action, débordement ou répétition aident ; aucun n’est exigé dans toutes les formes. Un blépharospasme peut être fait de spasmes brefs et une dystonie laryngée ne présente pas nécessairement une torsion visible.</p><p>La <button class="w" data-k="g24-etiology">cause étiologique</button> vient ensuite. Une exposition pertinente, une maladie documentée, une lésion concordante ou un résultat génétique interprété peuvent soutenir l’étiologie. Ni imagerie normale, ni simple variant de signification incertaine, ni âge adulte ne démontrent une origine unique. Les qualificatifs idiopathique, génétique, acquis et combiné ont des sens distincts.</p><p>Le consensus 2025 range la dystonie fonctionnelle parmi les ressemblances diagnostiques. Cela n’autorise pas à conclure sur le stress, le sexe, une douleur importante ou un examen complémentaire normal. Une expertise clinique adaptée recherche les arguments positifs et les diagnostics concurrents.</p><p>L’hypothèse, ses éléments et ses limites sont expliqués au patient. Le code est choisi après cette caractérisation et peut nécessiter les catégories d’une maladie causale plutôt qu’un G24 automatique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G24 exclusion G80.3, G24.3 exclusion M43.6</a>.</p><p><button class="w" data-k="g24-exp-8">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-8">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-9" ><h2>9. Explorations : adaptées au syndrome et aux causes traitables</h2><p>L’<button class="w" data-k="g24-imaging">IRM cérébrale</button> recherche une cause structurale selon âge, début et signes associés. Une forme focale idiopathique peut avoir une imagerie sans anomalie détectable. Le circuit pédiatrique ERN comporte une IRM puis un bilan orienté ; la version documentaire2026 reprend une branche issue de 2015, distincte de la révision adulte.</p><p>La <button class="w" data-k="g24-genetics">génétique</button> se choisit avec phénotype, âge, famille et conseil adapté. Un panel ou séquençage n’est pas un diagnostic à interpréter sans contexte. Avant stimulation dans une dystonie monogénique suspectée, la revue européenne 2026 soutient une place systématique de l’évaluation génétique dans un bilan multidisciplinaire.</p><p>Rechercher une <button class="w" data-k="g24-wilson">maladie de Wilson</button> quand le tableau le justifie, notamment chez un sujet jeune ou avec signes hépatiques/neuropsychiatriques. Céruloplasmine, cuivre urinaire, examen ophtalmologique et génétique s’intègrent à une démarche de centre ; un seul résultat ne suffit pas. Le bilan métabolique pédiatrique et l’essai de dopa-sensibilité relèvent d’un protocole spécialisé.</p><p>Électromyographie et échographie peuvent aider à distinguer certains phénomènes ou guider un traitement, mais ne prouvent pas seules l’étiologie centrale. En crise sévère, rechercher complications et causes déclenchantes sans attendre un bilan génétique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-DX — p 695–696 diagnostic, passages ciblés réouverts</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-AXIS2 — Table 3, étiologie et pathogenèse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a>.</p><p><button class="w" data-k="g24-exp-9">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-9">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-10" ><h2>10. Arbre diagnostique et diagnostics différentiels</h2><ol><li><b>Urgence ?</b> Protéger les fonctions vitales et faire évaluer un <button class="w" data-k="g24-airway">trouble respiratoire ou de déglutition</button>, une crise diffuse ou une complication de toxine.</li><li><b>Phénomène dystonique ?</b> Décrire motif, action, repos, mobilité passive et signes accompagnateurs ; envisager mimics mécaniques, autre trouble moteur ou fonctionnel.</li><li><b>Exposition ou cause acquise ?</b> Reconstituer ordonnance et chronologie, événements neurologiques et signes systémiques.</li><li><b>Cause traitable ou génétique ?</b> Choisir investigations adaptées à âge, famille et phénotype, sans panel ou médicament identique pour tous.</li><li><b>Plan et suivi ?</b> Séparer traitement causal, symptomatique, retentissement et codage.</li></ol><p>Spasticité, faiblesse pyramidale, tremblement indépendant, myoclonies, tics, rétraction et torticolis non dystonique se discutent selon examen. Une crise oculogyre après médicament et un blépharospasme chronique ne sont pas la même situation. Un état rigide confus/fébrile impose aussi de rechercher syndrome malin et autres défaillances.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-ADULT — p 6 arbre adulte, texte et rendu réellement vus</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/02/Revised-flowchart-for-dystonias_final.pdf" target="_blank" rel="noopener">EU-ERN-CHILD — p 9 arbre enfant/adolescent, réellement vu</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — G24 exclusion G80.3, G24.3 exclusion M43.6</a>.</p><p><button class="w" data-k="g24-exp-10">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-10">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-11" ><h2>11. Prise en charge : cause, symptômes et fonction</h2><p><b>Cause acquise.</b> Revoir le produit responsable avec l’équipe et traiter une maladie identifiée. En dystonie aiguë médicamenteuse, le <button class="w" data-k="g24-akineton">bipéridène</button> peut relever de la FI suisse dans un cadre évalué et surveillé ; il ne constitue pas une réponse universelle à toute dyskinésie tardive, qu’il peut aggraver.</p><p><b>Forme focale gênante.</b> Les injections de <button class="w" data-k="g24-toxin">toxine botulique</button> sont une option majeure, avec sélection des muscles, indication et compétences adaptées. Les <button class="w" data-k="g24-units">unités propres au produit</button> et les intervalles ne se convertissent pas mécaniquement. La <button class="w" data-k="g24-dilution">concentration après reconstitution</button> permet seulement de vérifier un volume après choix clinique, pas d’inventer une dose.</p><p><b>Forme étendue ou réfractaire.</b> Les options orales et la <button class="w" data-k="g24-dbs">stimulation cérébrale profonde</button> se discutent en équipe spécialisée. La cause génétique, la durée, les déformations et les objectifs fonctionnels influencent la décision ; aucun pourcentage unique ne garantit le résultat.</p><p><b>Cause traitable.</b> Dopa-sensibilité et Wilson demandent leurs propres traitements. L’essai pédiatrique de lévodopa mentionné dans le parcours européen ne rend pas Madopar conforme à sa FI suisse chez les moins de 25 ans : produit, statut hors indication et protocole sont vérifiés par le spécialiste.</p><p><b>Fonction.</b> Rééducation, adaptations de tâche, déglutition/voix, prise en charge de douleur, aide au travail et soutien psychosocial complètent le traitement. Les techniques non invasives du schéma ERN n’ont pas toutes une efficacité validée et ne deviennent pas une offre standard obligatoire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-LIMIT — Limites et conclusion ciblées</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a> ; <a data-reference-source="1" href="https://www.usz.ch/fachbereich/neurologie/angebot/dystonie/" target="_blank" rel="noopener">CH-USZ-TX — Toxine, oral, stimulation et mesures associées</a>.</p><p><button class="w" data-k="g24-exp-11">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-11">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-12" ><h2>12. Prévention, suivi et pronostic : mesurer ce qui compte</h2><p>Une <button class="w" data-k="g24-prevention">prévention</button> universelle de toutes les dystonies n’est pas disponible. Il reste utile de reconnaître les expositions évitables, les effets précoces et les indications inadaptées, puis de documenter clairement l’événement et son relais. Les limites de durée de la FI du métoclopramide concernent ce produit et ses indications, pas tous les traitements neurologiques.</p><p>Le <button class="w" data-k="g24-follow">suivi</button> décrit douleur, autonomie, tâches, voix/déglutition, participation sociale, effets indésirables et évolution de distribution. Des <button class="w" data-k="g24-scales">échelles adaptées</button> comme TWSTRS/Tsui cervicales ou Fahn-Marsden dans des formes généralisées aident à comparer ; elles ne remplacent pas le récit et les objectifs du patient.</p><p>Après toxine, mesurer réponse maximale, durée et tolérance. Une moindre efficacité n’est pas automatiquement due à des <button class="w" data-k="g24-antibodies">anticorps neutralisants</button> : revoir diagnostic, muscles, dose, technique et intervalle. Rechercher diffusion en cas de faiblesse, dysphagie ou dyspnée nouvelle.</p><p>Pour <button class="w" data-k="g24-child">l’enfant</button>, suivre développement et étiologie avec neuropédiatrie. Pendant <button class="w" data-k="g24-pregnancy">grossesse et allaitement</button>, vérifier chaque produit et une maladie causale éventuelle : la décision concernant une toxine diffère de la continuité d’un traitement anti-cuivre de Wilson. La trajectoire reste variable ; ni rémission définitive ni progression à date fixe n’est promise.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.usz.ch/krankheit/dystonie/" target="_blank" rel="noopener">CH-USZ-EPI — Fréquence, âge, évolution et métadonnées</a> ; <a data-reference-source="1" href="https://www.hug.ch/neurologie/unite-troubles-mouvement" target="_blank" rel="noopener">CH-HUG — Mission, démarche clinique et suivi</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/06/Final-Clinical-Scale-Dystonia_2025-fr.pdf" target="_blank" rel="noopener">EU-ERN-SCALES — p 6 échelles recommandées</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2026/07/final_efficacy-of-DBS-in-dystonia_en.pdf" target="_blank" rel="noopener">EU-DBS-COUNSEL — Résumé, discussion et recommandations ciblées</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener">EU-EASL-SYM — p 708 texte et page réellement vus</a>.</p><p><button class="w" data-k="g24-exp-12">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-12">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-13" ><h2>13. Points clés</h2><ul><li>Le motif moteur et ses conditions de survenue sont le point de départ ; une image seule ne teste pas le mouvement.</li><li>Classification2025 sur deux axes, avec distribution révisée et signes associés décrits séparément.</li><li>Exposition récente, cause traitable et urgence respiratoire ou systémique restent prioritaires.</li><li>Formes focales, étendues, tardives et combinées ne partagent pas toutes le même traitement.</li><li>FI suisses : BOTOX mai 2025, Xeomin mars 2026, Dysport mai 2026, Akineton mai 2022 ; Madopar juin 2023 pour sa limite d’indication/âge, Paspertin janvier 2020 comme médicament causal.</li><li>Doses et unités des toxines ne sont pas interchangeables ; le volume suit la concentration d’un produit identifié.</li><li>Cas et quiz de ce cours sont fictifs originaux, sans statut de questions fédérales officielles.</li></ul><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DEF — Définition et méthode</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DISTR — Distribution corporelle</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680523770487" target="_blank" rel="noopener">FI-MAD — Indications et contre-indications âge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680327350380" target="_blank" rel="noopener">FI-PAS — Précautions neurologiques, effets indésirables et version</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction et CK/CS</a>.</p><p><button class="w" data-k="g24-exp-13">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-13">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-14" ><h2>14. Pièges qui changent la conduite</h2><ul><li>Appeler dystonie toute posture ou tout tremblement, ou exiger une torsion visible dans chaque forme.</li><li>Considérer douleur ou anxiété comme preuve de forme combinée ou fonctionnelle.</li><li>Imposer le tronc dans toute forme généralisée, ou appliquer uniquement « plus de trois régions ».</li><li>Confondre inclusion de dyskinésie tardive dans G24.0 et indication automatique d’anticholinergique.</li><li>Transférer un nombre d’unités, un plafond ou un intervalle d’une toxine à une autre ou d’un autre pays à la FI suisse.</li><li>Présenter l’inscription AWMFseptembre 2026 comme une guideline achevée, ou le schéma source2018 actualisé en 2025 comme de nouveaux essais.</li><li>Déduire un mécanisme moléculaire ou un traitement d’une image isolée.</li><li>Confondre auto-relecture IA, contrôle ciblé de structure et validation médicale humaine.</li></ul><div class="trap"><b>Piège.</b> L’étiquette aide à organiser le raisonnement ; elle ne remplace pas la cause, la formulation, la population ou l’urgence.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-PHENO — Table 1 et caractéristiques associées</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DISTR — Distribution corporelle</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G24 et G24.0/.1/.2/.3/.4/.5/.8/.9</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680524330017" target="_blank" rel="noopener">FI-BOTOX — Indication/doses neuro, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">FI-XEOMIN — Doses blépharospasme/cervicale, CI/précautions/interactions/reproduction</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a> ; <a data-reference-source="1" href="https://www.awmf.org/aktuelles/awmf-aktuell/dystonie-1" target="_blank" rel="noopener">EU-AWMF-STATUS — Annonce primaire</a> ; <a data-reference-source="1" href="https://www.ern-rnd.eu/wp-content/uploads/2025/08/Final-treatment-algorithm-dystonia_2025_en.pdf" target="_blank" rel="noopener">EU-ERN-TX — p 1,3–6 et algorithme p 6 réellement vu</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Dystonia2010.JPG" target="_blank" rel="noopener">IMG-CLINICAL — Provenance, description, droits et pixels originaux</a>.</p><p><button class="w" data-k="g24-exp-14">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-g24-14">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="g24-entrainement" ><h2>S’entraîner : quatre décisions et quatre cas</h2><div class="quiz ui"><p>Dans le consensus 2025, tronc et deux autres régions peuvent-ils relever d’une forme généralisée ?</p><button data-ok="1">Oui, c’est un des exemples, hors schéma d’hémidystonie.</button><button data-ok="0">Non, il faut toujours plus de trois régions.</button><p class="fb" hidden>La définition révisée dépasse les schémas segmentaire/multifocal sans être hémidystonie.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12273609/" target="_blank" rel="noopener">INT-MDS-DISTR — Distribution corporelle</a>.</p><div class="quiz ui"><p>Une difficulté nouvelle à avaler après toxine demande-t-elle une évaluation immédiate ?</p><button data-ok="1">Oui, une complication avec risque respiratoire ou d’aspiration est possible.</button><button data-ok="0">Non, attendre seulement la prochaine séance.</button><p class="fb" hidden>Informer patient et entourage des signes de diffusion à signaler immédiatement.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680620800025" target="_blank" rel="noopener">BOT-IMMUNO — Anticorps, diffusion et interactions</a>.</p><div class="quiz ui"><p>Peut-on convertir directement les unités de Dysport en unités de Xeomin ?</p><button data-ok="1">Non, les unités et les limites restent propres à chaque produit.</button><button data-ok="0">Oui, toute toxine de même type utilise les mêmes unités.</button><p class="fb" hidden>La concentration permet un volume pour le produit identifié, sans créer d’équivalence de puissance.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550570029" target="_blank" rel="noopener">FI-DYSPORT — Doses dystoniques, sécurité/reproduction, dilution et mécanisme</a>.</p><div class="quiz ui"><p>L’inclusion de dyskinésie tardive sous G24.0 justifie-t-elle toujours du bipéridène ?</p><button data-ok="1">Non, ce médicament peut aggraver une dyskinésie tardive.</button><button data-ok="0">Oui, le code suffit à choisir le traitement.</button><p class="fb" hidden>Le phénomène clinique et le contexte déterminent la conduite, indépendamment d’une inclusion de nomenclature.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680240360220" target="_blank" rel="noopener">FI-AKI — Indications, doses orales/injectables, populations et sécurité</a>.</p><p><button class="w" data-k="g24-cas-1">Cas 1</button> <button class="w" data-k="g24-cas-2">Cas 2</button> <button class="w" data-k="g24-cas-3">Cas 3</button> <button class="w" data-k="g24-cas-4">Cas 4</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Examen neurologique, mouvements involontaires et situations urgentes</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction et CK/CS</a>.</p></section>
