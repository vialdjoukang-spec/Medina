<template data-pop="j93-pression-pleurale" data-title="Le couplage pleural et sa rupture"><p class="lab">Fonction normale</p><p>La plèvre viscérale reste au contact de la plèvre pariétale ; le poumon suit ainsi les mouvements de la paroi thoracique.</p><p class="lab">Rupture</p><p>Une brèche de la plèvre viscérale laisse fuir l’air du poumon. La pression devient positive dans l’espace pleural, et le poumon s’éloigne de la paroi. La fuite se tarit souvent rapidement, mais la réexpansion demande du temps.</p><p class="lab">Conséquence clinique</p><p>Une fuite tarie autorise une surveillance ou une aspiration ; une fuite persistante expose à la tension et impose une intervention.</p><p class="src">Références : <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-retraction" data-title="Le poumon s’éloigne de la paroi"><p class="lab">Mécanisme</p><p>Dès que l’air sépare les feuillets, le poumon s’écarte de la paroi thoracique ; l’air pleural doit ensuite être résorbé ou évacué pour que le poumon se réexpande.</p><p class="lab">Exception</p><p>Un poumon adhérent à la paroi, fréquent dans les formes secondaires, ne s’écarte pas partout. Le pneumothorax devient alors localisé, et un drain posé à l’aveugle peut perforer le poumon fixé.</p><div class="key"><b>Conséquence.</b> Devant une forme secondaire, le scanner repère les zones adhérentes et guide le site du drainage, éventuellement sous échographie.</div><p class="src">Références : <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025, figure 1</a>.</p></template>
<template data-pop="j93-tension-mecanisme" data-title="Pneumothorax sous tension : la chaîne hémodynamique"><p class="lab">Mécanisme</p><p>L’air accumulé sous pression déplace le médiastin et entrave le retour veineux ; il altère aussi les échanges gazeux. La SPLF le qualifie de tamponnade gazeuse. La ventilation en pression positive peut convertir un pneumothorax simple en tension.</p><p class="lab">Fréquence</p><p>Dans les traumatismes graves pris en charge en préhospitalier, la prévalence du pneumothorax sous tension avoisine 0,5 % ; 13 % de ces patients font un arrêt cardiaque. Dans le pneumothorax primaire, détresse respiratoire et instabilité hémodynamique sont rares.</p><p class="lab">Conduite</p><p>La décompression immédiate évacue l’air sous pression et rompt la chaîne.</p><div class="key"><b>À retenir.</b> La tension est une cause réversible d’arrêt cardiaque ; elle doit être exclue dans tout arrêt cardiaque traumatique.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">ERC 2025</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="j93-blebs" data-title="Primaire ne veut pas dire poumon normal"><p class="lab">Constat</p><p>La BTS 2023 rappelle que la majorité des patients atteints de pneumothorax primaire présentent au scanner des modifications de type emphysémateux. Bense les a retrouvées chez plus de 80 % des non-fumeurs atteints, et chez aucun volontaire sain.</p><p class="lab">Mécanismes</p><p>La rupture de blebs ou de bulles sous-pleuraux est le mécanisme classique. Une porosité diffuse de la plèvre viscérale peut aussi laisser fuir l’air sans bulle rompue.</p><p class="lab">Conséquence pratique</p><p>« Primaire » désigne l’absence de maladie pulmonaire suspectée. Le terme prédit une conduite moins invasive, non l’absence de récidive : les anomalies au scanner multiplient la récidive par 2,5.</p><div class="key"><b>Limite.</b> L’ERS 2015 juge le rôle de la rupture des bulles incertain ; tout traitement d’une récidive comporte donc une pleurodèse.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1183/09031936.00219214" target="_blank" rel="noopener">ERS 2015</a>.</p></template>
<template data-pop="j93-traumatique" data-title="Pneumothorax traumatique"><p class="lab">Définition</p><p>Le pneumothorax traumatique résulte d’un traumatisme thoracique pénétrant ou fermé. Son incidence annuelle est estimée à 81 pour 100 000 personnes ; une atteinte thoracique concerne environ un patient polytraumatisé sur cinq.</p><p class="lab">Spécificités</p><p>Le diagnostic repose souvent sur le scanner du traumatisé, et la ventilation en pression positive, fréquemment nécessaire, expose à la tension. La BTS 2023 le traite comme une entité distincte, hors de son algorithme, et signale des essais en cours sur la surveillance seule.</p><div class="key"><b>Renvoi.</b> La prise en charge détaillée du traumatisme thoracique relève des cours de traumatologie.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, pneumothorax iatrogène et traumatique</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025, épidémiologie</a>.</p></template>
<template data-pop="j93-iatrogene" data-title="Pneumothorax iatrogène"><p class="lab">Gestes en cause</p><p>La biopsie pulmonaire transthoracique et la pose d’un cathéter veineux sous-clavier ou jugulaire en sont les causes les plus fréquentes ; l’implantation d’un stimulateur cardiaque en fait partie. Leur incidence croît avec le nombre de gestes invasifs.</p><p class="lab">Évolution</p><p>Selon la BTS 2023, ces pneumothorax se résolvent en général plus facilement et peuvent ne nécessiter aucune intervention.</p><p class="lab">Dépistage</p><p>L’échographie en temps réel après une ponction pleurale révèle immédiatement un pneumothorax iatrogène ou l’écarte.</p><div class="key"><b>Exception.</b> Sous ventilation en pression positive, un pneumothorax iatrogène peut évoluer vers la tension.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">ERC 2025</a>.</p></template>
<template data-pop="j93-tabac" data-title="Tabac : premier facteur modifiable"><p class="lab">Données</p><p>Dans une étude suédoise de 138 patients, le tabagisme multipliait le risque d’un premier pneumothorax spontané par environ 9 chez la femme et 22 chez l’homme, avec une relation dose-effet. Le risque sur la vie d’un gros fumeur était estimé à 12 %, contre 1 pour 1 000 chez le non-fumeur. L’association au cannabis accroît encore le risque.</p><p class="lab">Mécanisme</p><p>Les pièces opératoires montrent une inflammation et une atteinte des petites voies aériennes, avec surexpression de métalloprotéinases matricielles qui pourraient léser la barrière alvéolaire.</p><p class="lab">Conséquence</p><p>Dans la méta-analyse de Walker, l’arrêt du tabac divisait environ par quatre le risque de récidive (rapport des cotes 0,26). La SPLF recommande d’offrir une aide au sevrage du tabac et de toute substance fumée.</p><div class="key"><b>Limite.</b> Ces données sont observationnelles : l’association est forte et cohérente, sans essai randomisé du sevrage.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.92.6.1009" target="_blank" rel="noopener">Bense et al., 1987</a> ; <a href="https://doi.org/10.1183/13993003.00864-2018" target="_blank" rel="noopener">Walker et al., 2018</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-secondaire" data-title="Pneumothorax secondaire : la réserve fait la gravité"><p class="lab">Définition</p><p>Le pneumothorax secondaire survient sur une maladie pulmonaire établie. La BTS 2023 y rattache le patient de plus de 50 ans ayant des antécédents tabagiques.</p><p class="lab">Gravité</p><p>Il compromet davantage la physiologie et expose plus souvent à une fuite persistante que la forme primaire ; l’instabilité hémodynamique y est plus fréquente.</p><p class="lab">Conduite</p><p>Le patient est hospitalisé ; un drain est posé si le geste est sûr. L’ERS 2024 ne peut se prononcer, faute de preuves, ni sur l’aspiration ni sur la surveillance seule dans cette forme ; elle déconseille les dispositifs ambulatoires de 8 French (recommandation conditionnelle). Une pleurodèse au talc peut être proposée dès le premier épisode lorsqu’une récidive serait dangereuse, par exemple dans une BPCO sévère.</p><div class="key"><b>Piège.</b> Juger un pneumothorax secondaire sur sa taille radiologique sous-estime sa gravité ; la clinique prime.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023 et annexe 1</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-oxygene" data-title="Oxygène : indications, cibles et contentieux"><p class="lab">Mécanisme</p><p>L’oxygène inhalé abaisse la pression partielle d’azote dans les alvéoles par rapport à la cavité pleurale, ce qui favorise le passage de l’azote pleural vers le sang. La BTS 2017 rapporte une résorption jusqu’à quatre fois plus rapide sous oxygène à haute concentration ; chez le lapin, l’oxygène devient toxique pour le poumon au-delà de 60 %.</p><p class="lab">Texte britannique (BTS 2017)</p><p>La saturation visée est de 94 à 98 % chez le patient sans risque d’hypercapnie. Chez le patient hospitalisé pour surveillance sans drainage, la BTS recommande un oxygène à haute concentration, 15 L/min au masque à réserve, sauf risque d’hypercapnie (grade D). Après aspiration ou drainage réussis, l’oxygène n’est plus nécessaire sans autre pathologie.</p><p class="lab">Texte retenu (SPLF 2023)</p><p>Plus récente, la SPLF recommande de ne pas administrer systématiquement d’oxygène dans le pneumothorax primaire (recommandation forte, niveau de preuve modéré) : les données sont de faible qualité, et l’oxygène impose hospitalisation, coût et inconfort.</p><div class="key"><b>Application.</b> L’oxygène traite l’hypoxémie, avec une cible de 88 à 92 % en cas de risque d’hypercapnie ; il n’est pas systématique dans le pneumothorax primaire bien toléré.</div><p class="src">Références : <a href="https://doi.org/10.1136/thoraxjnl-2016-209729" target="_blank" rel="noopener">O’Driscoll et al., BTS oxygène 2017, recommandations sur le pneumothorax</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023, oxygénothérapie</a>.</p></template>
<template data-pop="j93-mucoviscidose" data-title="Pneumothorax et mucoviscidose"><p class="lab">Fréquence et pronostic</p><p>Le pneumothorax atteint 0,64 % des patients par an et 3,4 % au cours de la maladie, surtout chez les patients âgés à l’atteinte avancée. La BTS 2023 cite une survie médiane de 30 mois et des pneumothorax controlatéraux jusqu’à 40 %.</p><p class="lab">Particularités</p><p>Un petit pneumothorax asymptomatique peut être surveillé ou aspiré ; un grand impose un drain. Le poumon collabé, rigide et encombré, se réexpand lentement et exige une antibiothérapie adaptée. Le drain seul laisse 50 % de récidives.</p><p class="lab">Prévention</p><p>La pleurectomie partielle est en général le traitement de choix des récidives ; la pleurodèse chimique est l’alternative chez le patient inopérable.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, mucoviscidose</a>.</p></template>
<template data-pop="j93-genetique" data-title="Causes familiales du pneumothorax"><p class="lab">Indices</p><p>Un antécédent familial, des récidives, une forme bilatérale ou des kystes au scanner orientent vers une cause héréditaire.</p><p class="lab">Entités et conduite</p><p>Les syndromes de Birt-Hogg-Dubé, de Marfan et d’Ehlers-Danlos vasculaire, la sclérose tubéreuse avec lymphangioléiomyomatose, le déficit en alpha-1 antitrypsine et la mucoviscidose figurent parmi les causes. Leurs gènes et leurs conséquences sont détaillés dans l’onglet Sciences, discipline Génétique. La BTS 2023 recommande un scanner et l’avis d’un centre spécialisé.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-catamenial" data-title="Pneumothorax cataménial"><p class="lab">Reconnaître</p><p>La BTS 2023 décrit l’association de douleur thoracique, de dyspnée et d’hémoptysie dans les 72 heures qui précèdent ou suivent les règles, chez une femme jeune. Le pneumothorax est habituellement droit et récidive au rythme du cycle ; une endométriose pelvienne est connue.</p><p class="lab">Fréquence</p><p>Chez les femmes opérées d’un pneumothorax récidivant, ce diagnostic est retenu dans jusqu’à 25 % des cas : la forme est probablement sous-diagnostiquée.</p><p class="lab">Mécanismes</p><p>La théorie la plus admise invoque le passage de l’air de l’abdomen et des voies génitales vers la plèvre par des fenestrations diaphragmatiques ; des dépôts endométriaux de la plèvre viscérale pourraient aussi l’éroder.</p><p class="lab">Traitement</p><p>La prise en charge est pluridisciplinaire : vidéothoracoscopie et traitement hormonal, la mise au repos ovarien étant souvent proposée après l’intervention.</p><div class="key"><b>Piège.</b> Une femme qui récidive doit toujours être interrogée sur la chronologie de ses règles.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, pneumothorax cataménial</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-douleur-pleurale" data-title="La douleur thoracique du pneumothorax"><p class="lab">Présentation</p><p>Le pneumothorax se présente typiquement par une douleur thoracique associée à une dyspnée. Dans la forme cataméniale, la douleur survient dans les 72 heures qui entourent les règles.</p><p class="lab">Signe de mauvaise tolérance</p><p>Selon la SPLF, une douleur que les antalgiques non opioïdes ne soulagent pas fait partie des signes de mauvaise tolérance qui guident la conduite, au même titre qu’une dyspnée de repos.</p><div class="key"><b>Conséquence.</b> Une douleur mal contrôlée fait sortir de la surveillance simple et impose une analgésie multimodale.</div><p class="src">Références : <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-dyspnee" data-title="La dyspnée dépend du terrain"><p class="lab">Symptôme principal</p><p>La SPLF fait de la dyspnée le symptôme principal du pneumothorax primaire ; un grand pneumothorax peut rendre le patient dyspnéique et hypoxémique.</p><p class="lab">Interprétation</p><p>Une dyspnée de repos signale une mauvaise tolérance. Un petit pneumothorax primaire ne peut, à lui seul, provoquer une détresse respiratoire : une détresse fait donc chercher une forme secondaire ou une tension.</p><div class="key"><b>Conséquence.</b> Une dyspnée significative fait sortir de la surveillance simple ; chez un patient pulmonaire, la forme est d’emblée à haut risque.</div><p class="src">Références : <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2016-209729" target="_blank" rel="noopener">BTS oxygène 2017</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-murmure" data-title="Murmure vésiculaire aboli d’un côté"><p class="lab">Valeur</p><p>L’abolition unilatérale du murmure vésiculaire fait partie des signes évocateurs de pneumothorax que l’ERC 2025 retient pour reconnaître une tension, avec la détresse respiratoire, l’hypoxie, l’emphysème sous-cutané, la déviation trachéale et la turgescence jugulaire.</p><p class="lab">Limite</p><p>L’examen ne suffit pas au diagnostic positif chez le patient stable : l’imagerie le confirme.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">ERC 2025</a>.</p></template>
<template data-pop="j93-emphyseme-sc" data-title="Emphysème sous-cutané"><p class="lab">Signification</p><p>L’emphysème sous-cutané traduit le passage d’air dans les parties molles. L’ERC 2025 le compte parmi les signes évocateurs d’un pneumothorax chez le patient instable.</p><p class="lab">Conséquences</p><p>Il gêne l’échographie, dont il limite la performance. Sa gestion sous drain relève de la déclaration de la BTS sur les gestes pleuraux, à laquelle renvoie la BTS 2023.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">ERC 2025</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-signes-tension" data-title="Signes de tension"><p class="lab">Tableau</p><p>L’ERC 2025 associe un retentissement hémodynamique, hypotension ou arrêt cardiaque, à des signes de pneumothorax : détresse respiratoire préalable, hypoxie, abolition unilatérale du murmure, emphysème sous-cutané, déplacement médiastinal avec déviation trachéale et turgescence jugulaire.</p><p class="lab">Limite</p><p>La présentation n’est pas toujours classique. Le diagnostic repose sur l’examen clinique ou l’échographie au lit.</p><div class="key"><b>Conséquence.</b> Devant une suspicion de tension avec arrêt cardiaque ou hypotension sévère, la décompression est immédiate, sans attendre un signe tardif.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">ERC 2025</a>.</p></template>
<template data-pop="j93-exsufflation" data-title="Décompression d’un pneumothorax sous tension"><p class="lab">Pneumothorax primaire sous tension (SPLF 2023)</p><p>La SPLF recommande une décompression thoracique d’urgence, par voie antérieure au deuxième espace intercostal sur la ligne médioclaviculaire, ou par voie axillaire au quatrième espace intercostal sur la ligne axillaire moyenne, avec un nécessaire de thoracentèse ou tout dispositif d’aspiration disponible (recommandation forte, faible niveau de preuve).</p><p class="lab">Arrêt cardiaque ou hypotension sévère (ERC 2025)</p><p>L’ERC recommande une décompression immédiate par thoracostomie ouverte. Dans l’arrêt cardiaque traumatique, il prescrit des thoracostomies bilatérales au quatrième espace intercostal sur la ligne axillaire moyenne, extensibles en thoracotomie bilatérale. L’aiguille n’est retenue que si l’intervenant n’est pas formé à la thoracostomie ou ne dispose pas des instruments.</p><div class="key"><b>À retenir.</b> Le geste précède la radiographie ; un drain thoracique suit toujours la décompression.</div><p class="src">Références : <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023, pneumothorax sous tension</a> ; <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">Lott et al., ERC 2025, Resuscitation 2025;215:110753</a>.</p></template>
<template data-pop="j93-fuite-persistante" data-title="Fuite aérienne persistante"><p class="lab">Définition</p><p>La fuite est dite persistante lorsqu’elle se prolonge au-delà de 2 à 3 jours ; elle est plus fréquente dans la forme secondaire. La BTS range parmi les indications d’un avis chirurgical la fuite qui persiste malgré 5 à 7 jours de drainage.</p><p class="lab">Options</p><p>La chirurgie est la solution optimale chez le patient opérable. Sinon, l’ERS 2024 propose une pleurodèse au sang autologue au patient atteint d’une forme secondaire et inapte à la chirurgie (recommandation conditionnelle). Le médecin instille par le drain 50 à 100 mL de sang frais non hépariné ; il ne clampe pas le drain, car le clampage d’un drain qui bulle expose à la tension, et maintient la tubulure en boucle surélevée pendant au moins 2 heures. Les valves endobronchiques hâtent parfois l’arrêt de la fuite, mais seuls 20 % environ des patients en tirent un bénéfice net ; l’ERS 2024 ne peut ni les recommander ni les déconseiller.</p><div class="key"><b>Limite.</b> Aucune donnée ne fixe le moment optimal de la chirurgie, ni ne démontre le bénéfice d’une aspiration continue. La BTS 2010 proposait un avis chirurgical à 3 à 5 jours ; la BTS 2023 individualise la décision.</div><p class="src">Références : <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025, fuite persistante</a> ; <a href="https://doi.org/10.1183/13993003.00797-2023" target="_blank" rel="noopener">ERS, EACTS et ESTS 2024</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, question clinique 3</a>.</p></template>
<template data-pop="j93-oedeme-reexpansion" data-title="Œdème de réexpansion"><p class="lab">Définition</p><p>L’œdème de réexpansion associe une hypoxémie et de nouveaux infiltrats alvéolaires diffus après une réexpansion pulmonaire rapide, en général dans l’heure qui suit une ponction pleurale.</p><p class="lab">Fréquence</p><p>Les plus grandes séries rapportent une forme symptomatique chez moins de 1 % des patients ponctionnés ; l’agence britannique de sécurité des patients a recensé 16 incidents en trois ans, dont deux décès. La complication est aussi décrite après drainage d’un pneumothorax.</p><p class="lab">Particularité du pneumothorax</p><p>Limiter la vitesse de réexpansion y est plus difficile, car clamper un drain qui bulle expose à la tension.</p><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/document-library/clinical-statements/pleural-procedures/bts-clinical-statement-on-pleural-procedures/" target="_blank" rel="noopener">Déclaration BTS sur les gestes pleuraux 2023</a>.</p></template>
<template data-pop="j93-bts-ers" data-title="Quelle recommandation retenir ?"><p class="lab">Source retenue</p><p>La <b>recommandation conjointe ERS, EACTS et ESTS de 2024</b> est la source primaire européenne la plus récente ; elle applique la méthode GRADE. Elle recommande de façon conditionnelle la surveillance du pneumothorax primaire peu symptomatique et stable, et de façon forte l’aspiration à l’aiguille plutôt que le drain comme premier geste du primaire. Elle propose aussi le dispositif ambulatoire, la chirurgie précoce chez le patient qui privilégie la prévention de la récidive et le sang autologue dans la fuite persistante de la forme secondaire. Elle demande enfin de ne pas voler tant que le pneumothorax n’est pas traité, puis d’attendre au moins 7 jours après la résolution radiologique, et décourage définitivement la plongée sauf pleurectomie chirurgicale.</p><p class="lab">Textes contemporains</p><p>La <b>BTS 2023</b> fonde la décision sur les symptômes, les caractéristiques à haut risque et la sécurité du geste ; elle place aspiration et drain au même rang. La <b>SPLF 2023</b>, de langue française, recommande l’aspiration ou le drain pour le grand pneumothorax primaire, la prise en charge ambulatoire dans une filière organisée et la surveillance du petit pneumothorax bien toléré. La <b>déclaration ERS 2015</b>, dirigée par le pneumologue valaisan Tschopp, affirmait déjà que les symptômes, plutôt que la taille, guident la conduite.</p><p class="lab">Relation entre les sources</p><p>Les trois textes récents convergent sur la place de la surveillance et de la prise en charge ambulatoire. Ils divergent sur le rang de l’aspiration, que seule l’ERS 2024 préfère explicitement au drain. Aucune société suisse n’a publié de recommandation propre au pneumothorax : la pratique suisse suit ces textes européens.</p><div class="key"><b>Application en Suisse.</b> Surveillance et dispositif ambulatoire supposent une filière de suivi locale ; à défaut, l’aspiration reste le premier geste du patient symptomatique sans caractéristique à haut risque.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00797-2023" target="_blank" rel="noopener">Walker et al., ERS, EACTS et ESTS 2024, Eur Respir J 2024;63:2300797</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1183/09031936.00219214" target="_blank" rel="noopener">ERS 2015, résumé</a>.</p></template>
