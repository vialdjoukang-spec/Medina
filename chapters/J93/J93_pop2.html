<template data-pop="j93-radio" data-title="Radiographie thoracique : lire un pneumothorax"><p class="lab">Technique et signe cardinal</p><p>Le cliché de face est pris debout, en inspiration : l’air monte à l’apex et le long de la paroi latérale, où une fine ligne pleurale viscérale le sépare du poumon. Le médiastin reste en place, sauf dans la tension, où il est refoulé vers le côté sain.</p><p class="lab">Pièges</p><p>Un pli cutané, le bord de l’omoplate ou la paroi d’une bulle simulent une ligne pleurale. En décubitus, le signe du sillon profond peut être le seul indice, et la sensibilité de la radiographie tombe à 50,2 %.</p><div class="key"><b>À retenir.</b> Un cliché couché normal n’exclut pas un pneumothorax ; l’échographie ou le scanner complètent.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.11-0131" target="_blank" rel="noopener">Alrajhi et al., Chest 2012</a>.</p></template>
<template data-pop="j93-taille" data-title="Mesurer la taille d’un pneumothorax"><p class="lab">Pourquoi mesurer</p><p>La BTS 2023 mesure pour juger de la sécurité d’un geste : au moins 2 cm, latéral ou apical, en radiographie, ou un espace accessible au scanner.</p><p class="lab">Méthodes</p><p>La BTS 2010 qualifiait de grand un pneumothorax d’au moins 2 cm au niveau du hile, ce qui correspond à environ 50 % du volume de l’hémithorax. L’ACCP mesurait la distance entre l’apex pulmonaire et la coupole thoracique, avec un seuil de 3 cm. La formule de Collins estime le volume, en pourcentage, à 4,2 + 4,7 × (A + B + C) : A est la distance apicale, B et C les distances latérales aux moitiés supérieure et inférieure du poumon, en centimètres.</p><p class="lab">Limites</p><p>Ces méthodes se contredisent souvent sur un même cliché, car une mesure bidimensionnelle estime mal un volume, surtout cloisonné.</p><div class="key"><b>À retenir.</b> La mesure sert la sécurité du geste ; elle ne remplace pas les symptômes dans la décision.</div><p class="src">Références : <a href="https://doi.org/10.2214/ajr.165.5.7572489" target="_blank" rel="noopener">Collins et al., 1995</a> ; <a href="https://brit-thoracic.org.uk/document-library/guidelines/pleural-disease/bts-guideline-for-pleural-disease-appendix-1-clinical-pathwaysdecision-trees" target="_blank" rel="noopener">BTS 2023, annexe 1</a> ; <a href="https://doi.org/10.1136/thx.2010.136986" target="_blank" rel="noopener">BTS 2010</a>.</p></template>
<template data-pop="j93-echo" data-title="Échographie pleurale du pneumothorax"><p class="lab">Technique</p><p>Le patient est couché ; la sonde explore d’abord les espaces intercostaux antérieurs, où l’air se collecte, puis progresse latéralement.</p><p class="lab">Signes normaux</p><p>Le glissement pleural, les lignes B, artefacts verticaux nés de la plèvre viscérale, et le pouls pulmonaire transmis par le cœur prouvent le contact des deux feuillets. En mode temps-mouvement, le poumon normal donne un aspect granuleux sous la ligne pleurale.</p><p class="lab">Signes du pneumothorax</p><p>Glissement, lignes B et pouls pulmonaire disparaissent ; seules persistent les lignes A horizontales, et des lignes parallèles remplacent l’aspect granuleux en mode temps-mouvement. Le point poumon, où le glissement réapparaît, affirme le diagnostic.</p><p class="lab">Limites</p><p>Le glissement disparaît aussi en cas d’adhérences pleurales, d’apnée, d’intubation sélective ou d’emphysème bulleux ; l’emphysème sous-cutané gêne l’examen.</p><div class="key"><b>Valeur.</b> Sensibilité de 90,9 % et spécificité de 98,2 % dans la méta-analyse d’Alrajhi, chez des patients surtout traumatisés et couchés ; la performance dépend de l’opérateur.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.11-0131" target="_blank" rel="noopener">Alrajhi et al., 2012</a> ; <a href="https://doi.org/10.1007/s001340000627" target="_blank" rel="noopener">Lichtenstein et al., 2000</a>.</p></template>
<template data-pop="j93-tdm" data-title="Scanner thoracique : l’examen de référence"><p class="lab">Indications</p><p>Il répond au doute radiologique, à la forme secondaire complexe, à la suspicion de bulle géante, au geste jugé dangereux sur la radiographie, à la récidive, à la suspicion familiale et au bilan préopératoire.</p><p class="lab">Limites</p><p>Il irradie et impose un transport : il n’a pas sa place chez le patient instable ni chez le jeune patient typique et stable.</p><div class="key"><b>À retenir.</b> Le scanner répond aux questions que la radiographie laisse ouvertes ; il ne remplace pas la décision clinique.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-bulle-geante" data-title="Bulle géante ou pneumothorax ?"><p class="lab">Le problème</p><p>Chez un patient emphysémateux, une grande bulle apicale crée une hyperclarté sans trame qui imite un pneumothorax.</p><p class="lab">Indices</p><p>La paroi d’une bulle est concave vers la paroi thoracique ; une ligne pleurale vraie lui est parallèle et convexe vers elle. De fins septa traversent souvent la bulle, et la trame reste visible à ses bords.</p><p class="lab">Conséquence</p><p>Un drain introduit dans une bulle crée une fistule bronchopleurale difficile à tarir. En cas de doute, le scanner précède tout geste.</p><div class="key"><b>Erreur fréquente.</b> Drainer, sur une seule radiographie, un patient atteint de BPCO sévère sans ligne pleurale nette.</div></template>
<template data-pop="j93-conservateur" data-title="Traitement conservateur : surveiller sans geste"><p class="lab">Principe</p><p>La brèche se ferme souvent spontanément ; l’air se résorbe ensuite lentement. Surveiller évite les complications d’un geste et semble réduire la récidive : 111 pour 1 000 contre 179 pour 1 000 après drain dans la méta-analyse de la BTS 2023, avec un niveau de preuve très faible.</p><p class="lab">Indication selon la BTS 2023</p><p>Elle peut être envisagée chez l’adulte atteint d’un pneumothorax primaire asymptomatique ou peu symptomatique, c’est-à-dire sans douleur ni dyspnée importantes ni retentissement physiologique, quelle que soit la taille.</p><p class="lab">Organisation</p><p>Le patient est revu en ambulatoire tous les 2 à 4 jours, muni de consignes écrites de retour immédiat. Un pneumothorax secondaire surveillé l’est à l’hôpital. Une aggravation des symptômes ou un agrandissement font poser un drain.</p><div class="key"><b>Données.</b> Dans l’essai de Brown, 15,4 % des patients surveillés ont finalement eu besoin d’un geste.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1056/NEJMoa1910775" target="_blank" rel="noopener">Brown et al., 2020</a>.</p></template>
<template data-pop="j93-valve-ambulatoire" data-title="Dispositif ambulatoire à valve unidirectionnelle"><p class="lab">Principe</p><p>Un petit cathéter pleural muni d’une valve unidirectionnelle, ou un drain relié à une valve de Heimlich, laisse sortir l’air sans le laisser entrer. Le patient rentre à domicile avec le dispositif.</p><p class="lab">Indication selon la BTS 2023</p><p>Il est à envisager pour le traitement initial du pneumothorax primaire chez l’adulte bien entouré, dans un centre disposant de l’expertise et du suivi nécessaires.</p><p class="lab">Suivi</p><p>Le patient est revu tous les 2 à 3 jours, et le dispositif retiré à la résolution. Un agrandissement ou des symptômes croissants conduisent à poser un drain et à hospitaliser.</p><div class="key"><b>Limite.</b> L’essai de Hallifax montre une hospitalisation plus courte au prix d’effets indésirables plus fréquents : fuites, déplacements et dysfonctions du dispositif.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-aspiration" data-title="Aspiration à l’aiguille"><p class="lab">Technique</p><p>Sous anesthésie locale, un cathéter est introduit dans l’espace pleural au bord supérieur de la côte, puis l’air est aspiré à la seringue par un robinet à trois voies. La BTS 2010 conseillait de s’arrêter au-delà de 2,5 L, volume qui suggère une fuite persistante.</p><p class="lab">Résultat</p><p>Le succès se juge sur l’amélioration des symptômes et une amélioration radiologique durable. Dans l’essai de Marx, l’aspiration échouait à 24 heures chez 29 % des patients contre 18 % sous drain, mais elle était moins douloureuse.</p><p class="lab">Place</p><p>La BTS 2023 la propose, au même titre que le drain, au patient symptomatique qui ne relève ni de la surveillance ni du dispositif ambulatoire. Elle raccourcit l’hospitalisation, mais impose plus souvent un second geste.</p><div class="key"><b>Limite.</b> Le patient de 50 ans ou plus fumeur répond moins bien à l’aspiration ; c’est pourquoi la BTS 2023 le classe avec les formes secondaires.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.202110-2409OC" target="_blank" rel="noopener">Marx et al., 2023</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-drain" data-title="Drain thoracique"><p class="lab">Matériel</p><p>Un drain de petit calibre, posé par technique de Seldinger dans le triangle de sécurité, suffit à la plupart des pneumothorax. Il est relié à une valve sous eau, qui laisse sortir l’air sans le laisser entrer.</p><p class="lab">Surveillance</p><p>Le patient est réévalué chaque jour : bullage, oscillation du liquide avec la respiration, radiographie. Un bullage persistant signale une fuite active ; l’absence d’oscillation évoque un drain bouché ou coudé, ou un poumon réexpandu.</p><p class="lab">Retrait</p><p>Le drain est retiré lorsque le bullage a cessé et que le poumon est réexpandu. Aucune donnée ne démontre le bénéfice d’une aspiration continue.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-brown2020" data-title="Essai de Brown, New England Journal of Medicine 2020"><p class="lab">Question</p><p>La surveillance est-elle une alternative acceptable à l’intervention dans le pneumothorax spontané primaire modéré à grand, non compliqué ?</p><p class="lab">Méthode</p><p>Essai ouvert, multicentrique, de non-infériorité, conduit dans des centres australiens et néo-zélandais chez 316 patients de 14 à 50 ans présentant un premier pneumothorax primaire unilatéral modéré à grand. Le critère principal était la réexpansion à 8 semaines.</p><p class="lab">Résultats</p><p>La réexpansion à 8 semaines atteignait 98,5 % sous intervention et 94,4 % sous surveillance, différence compatible avec la non-infériorité. Sous surveillance, 15,4 % des patients ont eu besoin d’un geste. Les récidives à 12 mois touchaient 16,8 % des patients traités et 8,8 % des patients surveillés ; les événements indésirables graves étaient moins fréquents sous surveillance.</p><div class="key"><b>Limite.</b> Le résultat principal perdait sa robustesse lorsque les données manquantes étaient comptées comme des échecs ; les auteurs parlent de preuve modeste. Les patients très symptomatiques étaient exclus.</div><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1910775" target="_blank" rel="noopener">Brown et al., N Engl J Med 2020;382:405-415</a>.</p></template>
<template data-pop="j93-hallifax2020" data-title="Essai de Hallifax, Lancet 2020"><p class="lab">Question</p><p>Un dispositif ambulatoire réduit-il l’hospitalisation du pneumothorax primaire symptomatique par rapport à la prise en charge standard ?</p><p class="lab">Méthode</p><p>Essai ouvert randomisé, conduit dans 24 hôpitaux britanniques chez 236 adultes de 16 à 55 ans, comparant le dispositif ambulatoire à l’aspiration ou au drain conventionnels.</p><p class="lab">Résultats</p><p>Sur 30 jours, la durée médiane d’hospitalisation était de 0 jour sous dispositif ambulatoire contre 4 jours sous traitement standard. Les effets indésirables touchaient 55 % du groupe ambulatoire contre 39 % ; les 14 événements graves sont tous survenus dans le groupe ambulatoire, notamment par agrandissement du pneumothorax ou dysfonction du dispositif.</p><div class="key"><b>Conséquence.</b> Le dispositif ambulatoire convient au patient qui privilégie l’absence d’hospitalisation, dans une filière organisée.</div><p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(20)31043-6" target="_blank" rel="noopener">Hallifax et al., Lancet 2020</a>.</p></template>
<template data-pop="j93-marx2023" data-title="Essai de Marx, 2023 : aspiration ou drain"><p class="lab">Question</p><p>L’aspiration simple est-elle non inférieure au drain pour le pneumothorax primaire complet ?</p><p class="lab">Méthode</p><p>Essai randomisé ouvert, conduit dans 31 hôpitaux français chez 402 adultes de 18 à 50 ans présentant un décollement complet du poumon. Le critère principal était la réexpansion pulmonaire 24 heures après le geste.</p><p class="lab">Résultats</p><p>L’échec touchait 29 % des patients aspirés et 18 % des patients drainés : la non-infériorité n’est pas démontrée. L’aspiration provoquait moins de douleur et moins de plicatures du matériel. La récidive à un an était de 20 % contre 27 %, sans différence significative.</p><div class="key"><b>Conséquence.</b> L’aspiration est moins efficace au premier essai mais mieux tolérée ; le choix se discute avec le patient selon sa priorité.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.202110-2409OC" target="_blank" rel="noopener">Marx et al., Am J Respir Crit Care Med 2023;207:1475-1485</a>.</p></template>
<template data-pop="j93-analgesie" data-title="Analgésie : pourquoi elle précède le geste"><p class="lab">Mécanisme</p><p>La douleur pleurale bride l’inspiration profonde et la toux ; elle favorise l’hypoventilation et l’encombrement, surtout dans les formes secondaires.</p><p class="lab">Conduite</p><p>Le paracétamol traite la douleur légère à modérée ; un anti-inflammatoire non stéroïdien ou un opioïde le complètent selon l’intensité et les contre-indications. La BTS 2023 exige une analgésie adéquate avant et après une pleurodèse chimique, très douloureuse.</p><p class="lab">Précautions</p><p>Les opioïdes dépriment la ventilation : chez le patient atteint de BPCO hypercapnique, ils se titrent prudemment et ne s’associent pas aux benzodiazépines.</p><div class="key"><b>À retenir.</b> Un patient soulagé respire mieux, tolère le geste et coopère à la surveillance.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-chirurgie" data-title="Chirurgie du pneumothorax"><p class="lab">Techniques</p><p>La vidéothoracoscopie introduit une caméra et des instruments par de petites incisions. Le chirurgien résèque les blebs ou les bulles à l’agrafeuse et réalise une pleurodèse par abrasion pleurale, pleurectomie partielle ou poudrage de talc. La thoracotomie ouvre la paroi.</p><p class="lab">Résultats</p><p>Dans les méta-analyses de la BTS 2023, la chirurgie abaisse la récidive à 54 pour 1 000 contre 298 pour 1 000 après drain seul. Une autre méta-analyse, qui compare les deux abords chirurgicaux, retrouve 31 récidives pour 1 000 après vidéothoracoscopie contre 15 pour 1 000 après thoracotomie ; la vidéothoracoscopie raccourcit en revanche l’hospitalisation d’environ 3,7 jours et réduit la douleur et les complications.</p><p class="lab">Choix</p><p>La vidéothoracoscopie est l’abord habituel. La thoracotomie se discute lorsque le risque de récidive doit être le plus bas possible, par exemple pour certaines professions. Résection et pleurodèse obtiennent des résultats comparables et sont souvent associées.</p><div class="key"><b>Limite.</b> Le patient pèse le bénéfice sur la récidive contre le risque de douleur chronique et de paresthésies.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, questions cliniques 1, 4 et 5</a>.</p></template>
<template data-pop="j93-pleurodese" data-title="Pleurodèse au talc"><p class="lab">Mécanisme</p><p>Le talc agresse le mésothélium et déclenche une inflammation, un dépôt de fibrine puis une prolifération fibroblastique. Les deux feuillets fusionnent : sans espace pleural, l’air ne peut plus s’accumuler.</p><p class="lab">Modalités et preuves</p><p>Le talc est soit poudré pendant une thoracoscopie, soit instillé en suspension par le drain sur un poumon réexpandu. Dans un essai randomisé suisse de 108 patients, le talcage thoracoscopique sous anesthésie locale a réduit le recours à un second geste, 1 patient sur 61 contre 10 sur 47 après drainage seul, et la récidive à 5 ans, 5 % contre 34 %, au prix d’une douleur plus forte les 3 premiers jours.</p><p class="lab">Précautions</p><p>La BTS recommande un talc calibré, car un talc non calibré, riche en petites particules, a été associé à des syndromes de détresse respiratoire aiguë. Douleur et fièvre transitoires sont attendues ; l’analgésie se planifie.</p><div class="key"><b>Limite.</b> Une pleurodèse complique une chirurgie thoracique ultérieure ; elle se discute avant tout projet de transplantation.</div><p class="src">Références : <a href="https://doi.org/10.1183/09031936.02.00278202" target="_blank" rel="noopener">Tschopp et al., Eur Respir J 2002</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-avion" data-title="Avion après un pneumothorax"><p class="lab">Mécanisme</p><p>La cabine des avions de ligne est pressurisée à une altitude d’environ 2 400 m. Selon la loi de Boyle, un volume d’air piégé y augmente d’environ 30 %, ce qui peut transformer un pneumothorax résiduel en pneumothorax compressif loin de tout secours.</p><p class="lab">Règle de la BTS</p><p>Un patient porteur d’un pneumothorax persistant ne prend pas de vol commercial avant la résolution radiologique complète. Une fois la résolution confirmée, il peut voler 7 jours après la radiographie qui la démontre ; ce délai vise à exclure une récidive précoce.</p><div class="key"><b>Limite.</b> Le risque de récidive reste élevé pendant la première année ; un patient qui doit voler souvent ou loin peut discuter une prévention chirurgicale.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, qui renvoie à la déclaration BTS sur le voyage aérien 2022</a>.</p></template>
<template data-pop="j93-plongee" data-title="Plongée sous-marine après un pneumothorax"><p class="lab">Mécanisme</p><p>À 10 m de profondeur, la pression ambiante double. Pendant la remontée, l’air piégé double de volume entre 10 m et la surface ; un pneumothorax sous tension peut survenir sous l’eau, hors de tout secours.</p><p class="lab">Règle de la BTS</p><p>La plongée avec bouteilles est déconseillée définitivement après un pneumothorax, sauf prévention définitive très sûre, telle une pleurectomie chirurgicale.</p><div class="key"><b>Conséquence.</b> Un plongeur professionnel ou passionné doit recevoir cette information dès le premier épisode, car elle peut orienter vers la chirurgie.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-grossesse" data-title="Pneumothorax et grossesse"><p class="lab">Mécanisme</p><p>La grossesse augmente la consommation d’oxygène et accélère la respiration. Pendant le travail, la consommation d’oxygène peut croître de 50 % et les efforts expulsifs répétés élèvent la pression intrathoracique.</p><p class="lab">Conduite</p><p>Un pneumothorax de moins de 2 cm, sans dyspnée maternelle ni souffrance fœtale, peut être surveillé ; sinon, une aspiration ou un drain s’imposent. Pneumologue, obstétricien et chirurgien thoracique coopèrent étroitement.</p><p class="lab">Accouchement</p><p>Pour éviter les efforts expulsifs, la BTS 2023 évoque un accouchement assisté programmé à terme ou près du terme, sous anesthésie péridurale. Si une césarienne s’impose, la rachianesthésie est préférée à l’anesthésie générale.</p><div class="key"><b>Limite.</b> Les données sur la récidive lors des grossesses suivantes sont insuffisantes pour une recommandation ferme.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, grossesse</a>.</p></template>
<template data-pop="j93-ventile" data-title="Pneumothorax sous ventilation mécanique"><p class="lab">Mécanisme</p><p>La pression positive pousse l’air dans la brèche à chaque insufflation ; la fuite s’entretient et la tension s’installe vite.</p><p class="lab">Signes</p><p>En ventilation volumétrique, les pressions de crête et de plateau s’élèvent ; en ventilation en pression, le volume courant chute. Une désaturation brutale, une hypotension et une asymétrie auscultatoire complètent le tableau ; l’échographie au lit montre l’abolition du glissement.</p><p class="lab">Conduite</p><p>La décompression puis le drainage sont la règle. La pression expiratoire positive et les volumes sont réévalués pour limiter la fuite.</p><div class="key"><b>Piège.</b> Une intubation sélective abolit aussi le glissement pleural du côté non ventilé ; la position de la sonde se vérifie.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">ERC 2025</a>.</p></template>
<template data-pop="j93-gaz" data-title="Gaz du sang artériel"><p class="lab">Valeurs normales</p><p>Chez l’adulte jeune en air ambiant, la PaO₂ se situe entre 10,5 et 13,5 kPa, la PaCO₂ entre 4,7 et 6,0 kPa, et le pH entre 7,35 et 7,45.</p><p class="lab">Interprétation</p><p>Le pneumothorax provoque une hypoxémie par effet shunt. Chez le sujet jeune, l’hyperventilation abaisse la PaCO₂ ; chez un patient atteint de BPCO, une PaCO₂ normale ou élevée signale une réserve ventilatoire épuisée.</p><p class="lab">Indication</p><p>Les gaz du sang sont inutiles chez le jeune patient stable dont la saturation est normale. Ils guident l’oxygène et la surveillance dans les formes secondaires.</p><div class="key"><b>À retenir.</b> Dans un pneumothorax secondaire, une hypercapnie signe une forme à haut risque.</div></template>
<template data-pop="j93-lidocaine" data-title="Lidocaïne : dose et toxicité"><p class="lab">Mécanisme</p><p>La lidocaïne bloque les canaux sodiques voltage-dépendants des fibres nerveuses et interrompt la conduction de la douleur dans la zone infiltrée.</p><p class="lab">Dose</p><p>Avant le talc, la déclaration de la BTS sur les gestes pleuraux prévoit une instillation pleurale de 3 mg/kg, sans dépasser 250 mg. L’infiltration pariétale s’y ajoute : la dose cumulée reste dans la limite d’environ 3 mg/kg et dans celle de l’information professionnelle du produit utilisé.</p><p class="lab">Toxicité</p><p>Les premiers signes sont des paresthésies péribuccales, un goût métallique, des acouphènes et une agitation ; viennent ensuite des convulsions, une dépression respiratoire et des troubles du rythme. Le médecin arrête l’injection, assure la ventilation, traite les convulsions et administre une émulsion lipidique dans les formes graves.</p><div class="key"><b>Prévention.</b> La dose se calcule au poids, et l’aspiration avant chaque injection écarte une injection intravasculaire.</div><p class="src">Références : <a href="https://brit-thoracic.org.uk/document-library/clinical-statements/pleural-procedures/online-appendix-12-pleural-procedures-intrapleural-treatment" target="_blank" rel="noopener">BTS, gestes pleuraux 2023, annexe 12</a>.</p></template>
<template data-pop="pareto-j93-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j93-0,j93-1,j93-2,j93-3,j93-4,j93-5,j93-6"></p><ul><li>Le pneumothorax est de l’air dans la cavité pleurale ; spontané primaire sans maladie pulmonaire connue, secondaire sur poumon malade ou après 50 ans chez le fumeur.</li><li>La pression pleurale négative maintient le poumon contre la paroi ; une brèche la supprime et le poumon se rétracte.</li><li>Un mécanisme valvulaire rend la pression positive : la tension comprime les veines caves et provoque un choc obstructif.</li><li>Le tabac multiplie le risque et la récidive ; un patient sur trois récidive après un premier épisode primaire.</li><li>Douleur latérale brutale, dyspnée selon la réserve ; murmure aboli et tympanisme.</li></ul></template>
<template data-pop="pareto-j93-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j93-7"></p><ul><li>Radiographie debout chez le patient stable, échographie au lit, scanner en cas de doute.</li><li>La taille juge la sécurité du geste : au moins 2 cm, latéral ou apical.</li><li>Une bulle géante simule un pneumothorax ; le scanner précède le drain.</li></ul></template>
<template data-pop="pareto-j93-tt" data-title="Pareto — Urgences et prise en charge"><p class="ratio" data-cover="j93-8,j93-9"></p><ul><li>La tension se diagnostique cliniquement, se décomprime avant la radiographie, puis se draine.</li><li>BTS 2023 : symptômes, haut risque, sécurité du geste, puis choix partagé.</li><li>Peu symptomatique : surveillance quelle que soit la taille ; symptomatique sans haut risque : valve ambulatoire, aspiration ou drain ; haut risque : drain et hospitalisation.</li><li>Un drain qui bulle ne se clampe jamais.</li></ul></template>
<template data-pop="pareto-j93-suivi" data-title="Pareto — Récidive, suivi et critères"><p class="ratio" data-cover="j93-10,j93-11,j93-12,j93-13"></p><ul><li>Avis chirurgical après un deuxième épisode homolatéral, un premier épisode controlatéral ou sous tension, une fuite persistante de 5 à 7 jours ou pour une profession à risque.</li><li>Arrêt du tabac, contrôle à 2 à 4 semaines, avion 7 jours après la résolution, plongée proscrite sans chirurgie définitive.</li><li>Le pneumothorax secondaire, même petit, se traite à l’hôpital.</li><li>Le diagnostic exige la preuve de l’air pleural ; la tension est un diagnostic clinique.</li></ul></template>
<template data-pop="pareto-j93-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j93-e-1,j93-e-2,j93-e-3"></p><ul><li>Scanner : référence ; radiographie : première intention chez le patient stable.</li><li>Ligne pleurale sans trame au-delà ; en décubitus, signe du sillon profond.</li><li>Échographie : glissement absent évocateur, point poumon spécifique.</li></ul></template>
<template data-pop="pareto-j93-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j93-p-1,j93-p-2,j93-p-3"></p><ul><li>Oxygène titré : 94 à 98 %, ou 88 à 92 % en cas de risque hypercapnique.</li><li>Lidocaïne : 3 mg/kg, au plus 250 mg avant le talc, dose cumulée ; talc calibré 4 à 5 g.</li><li>Pas de pression positive sur un pneumothorax non drainé sans surveillance étroite.</li></ul></template>
