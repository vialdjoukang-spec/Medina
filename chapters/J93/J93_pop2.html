retenir.</b> Un cliché couché normal n’exclut pas un pneumothorax ; l’échographie ou le scanner complètent.</div><p class="src">Références : <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1378/chest.11-0131" target="_blank" rel="noopener">Alrajhi et al., Chest 2012</a>.</p></template>
<template data-pop="j93-taille" data-title="Mesurer la taille d’un pneumothorax"><p class="lab">Définitions</p><p>Les définitions d’un grand pneumothorax varient selon les sociétés. Les anciennes recommandations internationales retenaient plus de 2 cm au niveau du hile ou plus de 3 cm à l’apex. La SPLF 2023 qualifie de grand le pneumothorax primaire qui dessine un liseré sur toute la ligne axillaire, avec au moins 2 cm au niveau du hile.</p><p class="lab">Usage selon la BTS 2023</p><p>La taille ne commande plus l’indication d’un geste, mais sa sécurité : un décollement d’au moins 2 cm, latéral ou apical, en radiographie, ou un espace accessible au scanner avec guidage radiologique, permet en général l’aspiration ou le drain.</p><p class="lab">Formule de Collins</p><p>Établie sur 20 pneumothorax mesurés au scanner hélicoïdal, elle estime le volume en pourcentage à 4,2 + 4,7 × (A + B + C), A, B et C étant trois distances interpleurales mesurées en centimètres sur un cliché de face debout en inspiration.</p><div class="key"><b>À retenir.</b> La mesure définit un grand pneumothorax et juge la sécurité du geste ; elle ne remplace pas les symptômes dans la décision.</div><p class="src">Références : <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://brit-thoracic.org.uk/document-library/guidelines/pleural-disease/bts-guideline-for-pleural-disease-appendix-1-clinical-pathwaysdecision-trees" target="_blank" rel="noopener">BTS 2023, annexe 1</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.2214/ajr.165.5.7572489" target="_blank" rel="noopener">Collins et al., 1995</a>.</p></template>
<template data-pop="j93-echo" data-title="Échographie pleurale du pneumothorax"><p class="lab">Signes</p><p>Le glissement pleural et les lignes B prouvent le contact des feuillets ; leur disparition, avec des lignes horizontales exclusives, évoque un pneumothorax. Le point poumon, apparition fugace d’un aspect pulmonaire normal à la place du pneumothorax en un point de la paroi, l’affirme : spécificité de 100 %, sensibilité de 66 % (75 % dans les pneumothorax invisibles en radiographie).</p><p class="lab">Performance</p><p>Dans la méta-analyse d’Alrajhi, l’échographie atteint une sensibilité de 90,9 % et une spécificité de 98,2 %, supérieures à la radiographie couchée. Elle sert aussi à rechercher un pneumothorax résiduel après drainage.</p><p class="lab">Limites</p><p>L’inexpérience de l’opérateur, un pneumothorax petit ou localisé, une pleurodèse antérieure, un emphysème sous-cutané ou un pansement réduisent sa performance. Dans la BPCO, l’absence de glissement peut tenir à l’hyperinflation ou à une bulle. La SPLF déconseille d’y fonder seule le diagnostic ou la mesure d’un pneumothorax primaire sans signe de gravité.</p><p class="src">Références : <a href="https://doi.org/10.1007/s001340000627" target="_blank" rel="noopener">Lichtenstein et al., 2000</a> ; <a href="https://doi.org/10.1378/chest.11-0131" target="_blank" rel="noopener">Alrajhi et al., 2012</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="j93-tdm" data-title="Scanner thoracique"><p class="lab">Ce qu’il apporte</p><p>Le scanner est plus précis que la radiographie et l’échographie. Il précise la présence, la taille et la localisation de l’air, détaille la maladie pulmonaire sous-jacente et repère un pneumomédiastin ou des zones de poumon adhérentes qui modifient le site du drain.</p><p class="lab">Indications</p><p>La SPLF le recommande, à faible dose, en cas de doute diagnostique persistant, mais non en première intention en raison de son coût, de son irradiation et de son accès. Après l’épisode, elle le réserve aux formes bilatérales ou récidivantes et au contexte évocateur d’une maladie sous-jacente ; la BTS l’impose en cas de suspicion familiale.</p><p class="src">Références : <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-bulle-geante" data-title="Bulle ou poumon adhérent : le piège du drain"><p class="lab">Le problème</p><p>Une bulle peut simuler un pneumothorax sur la radiographie. Dans une forme secondaire, un poumon adhérent à la paroi peut être perforé par un drain posé à l’aveugle.</p><p class="lab">Conduite</p><p>Devant le doute, surtout si un geste est envisagé, le scanner tranche. Il guide ensuite le site du drainage, éventuellement sous échographie.</p><div class="key"><b>Erreur fréquente.</b> Drainer sur une seule radiographie un patient atteint de BPCO sévère sans ligne pleurale nette.</div><p class="src">Références : <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025, diagnostic et figure 1</a>.</p></template>
<template data-pop="j93-conservateur" data-title="Traitement conservateur : surveiller sans geste"><p class="lab">Indication</p><p>L’ERS 2024 et la BTS 2023 proposent la surveillance du pneumothorax primaire asymptomatique ou peu symptomatique, sans douleur ni dyspnée importantes ni retentissement physiologique, quelle que soit sa taille. Elle n’est pas recommandée dans la forme secondaire.</p><p class="lab">Organisation</p><p>Le patient est observé 4 heures, doit pouvoir marcher sans gêne et bénéficie d’un suivi précoce. La SPLF exige une stabilité clinique et radiologique à 4 heures, une filière ambulatoire organisée, une consultation avec échographie ou radiographie à 24 à 72 heures, un entourage pendant les premières 24 à 48 heures et un accès à un hôpital en moins d’une heure.</p><p class="lab">Données</p><p>Dans la méta-analyse de la BTS 2023, la récidive était de 111 pour 1 000 sous surveillance contre 179 pour 1 000 après drain, avec un niveau de preuve très faible. Dans l’essai de Brown, 15,4 % des patients surveillés ont eu besoin d’un geste.</p><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00797-2023" target="_blank" rel="noopener">ERS, EACTS et ESTS 2024</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1056/NEJMoa1910775" target="_blank" rel="noopener">Brown et al., 2020</a>.</p></template>
<template data-pop="j93-valve-ambulatoire" data-title="Dispositif ambulatoire à valve unidirectionnelle"><p class="lab">Principe</p><p>Un dispositif muni d’une valve unidirectionnelle, ou une valve de Heimlich reliée à un drain, laisse sortir l’air sans le laisser entrer ; le patient rentre à domicile.</p><p class="lab">Indication</p><p>La BTS 2023 et l’ERS 2024 le proposent pour le pneumothorax primaire chez l’adulte bien entouré, dans un centre disposant de l’expertise et du suivi. La SPLF admet l’aspiration ou un mini-drain avec valve en ambulatoire si le patient est stable après évacuation de l’air, dans une filière organisée, avec contrôle à 24 à 72 heures. Le dispositif n’est pas validé dans la forme secondaire, en raison d’un risque de préjudice.</p><p class="lab">Suivi</p><p>La BTS prévoit un contrôle tous les 2 à 3 jours et le retrait à la résolution ; un agrandissement ou des symptômes croissants font poser un drain et hospitaliser.</p><div class="key"><b>Limite.</b> L’essai de Hallifax montre une hospitalisation plus courte au prix d’effets indésirables plus fréquents.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023 et annexe 1</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-aspiration" data-title="Aspiration à l’aiguille"><p class="lab">Place</p><p>L’ERS 2024 recommande fortement l’aspiration à l’aiguille plutôt que le drain comme premier geste du pneumothorax primaire symptomatique. La BTS 2023 place aspiration et drain au même rang lorsque surveillance et dispositif ambulatoire ne conviennent pas. Aucune recommandation ne l’étend à la forme secondaire, faute de preuves concluantes.</p><p class="lab">Technique</p><p>La SPLF recommande une anesthésie locale de la paroi avant le geste et suggère un repérage échographique du site.</p><p class="lab">Résultat</p><p>Mieux tolérée et moins douloureuse que le drain, l’aspiration raccourcit l’hospitalisation de 2,55 jours dans la méta-analyse de la BTS, mais impose plus souvent un second geste : 626 pour 1 000 contre 240 pour 1 000. Dans l’essai de Marx, elle échouait à 24 heures chez 29 % des patients contre 18 % sous drain. La récidive à un an ne diffère pas.</p><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00797-2023" target="_blank" rel="noopener">ERS, EACTS et ESTS 2024</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, tableau 4</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1164/rccm.202110-2409OC" target="_blank" rel="noopener">Marx et al., 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-drain" data-title="Drain thoracique"><p class="lab">Matériel et pose</p><p>Un drain de petit calibre, 14 French au plus, suffit à la plupart des pneumothorax ; il est non inférieur aux gros drains et provoque moins de complications. La BTS juge adaptés les drains posés par technique de Seldinger jusqu’à 12 French. Le site est repéré par échographie.</p><p class="lab">Aspiration</p><p>La SPLF recommande de commencer par un drainage passif, valve unidirectionnelle ou écoulement libre, et de n’appliquer une aspiration de −5 à −20 cm d’eau qu’en l’absence de réexpansion. La BTS déconseille l’aspiration systématique.</p><p class="lab">Retrait</p><p>Le drainage se poursuit jusqu’à la réexpansion complète et l’arrêt du bullage. Sous aspiration, la SPLF propose 6 à 8 heures d’écoulement libre avant le retrait. L’échographie détecte un pneumothorax résiduel.</p><div class="trap"><span class="k">Piège</span>Le clampage d’un drain qui bulle est à éviter, sauf supervision pleurale spécialisée.</div><p class="src">Références : <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023, drainage</a> ; <a href="https://www.brit-thoracic.org.uk/document-library/clinical-statements/pleural-procedures/bts-clinical-statement-on-pleural-procedures/" target="_blank" rel="noopener">Déclaration BTS sur les gestes pleuraux 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-brown2020" data-title="Essai de Brown, New England Journal of Medicine 2020"><p class="lab">Question</p><p>La surveillance est-elle une alternative acceptable à l’intervention dans le pneumothorax spontané primaire modéré à grand, non compliqué ?</p><p class="lab">Méthode</p><p>Essai ouvert, multicentrique, de non-infériorité, conduit dans des centres australiens et néo-zélandais chez 316 patients de 14 à 50 ans présentant un premier pneumothorax primaire unilatéral modéré à grand. Le critère principal était la réexpansion à 8 semaines.</p><p class="lab">Résultats</p><p>La réexpansion atteignait 98,5 % sous intervention et 94,4 % sous surveillance, différence compatible avec la non-infériorité. Sous surveillance, 15,4 % des patients ont eu besoin d’un geste. Les récidives à 12 mois touchaient 16,8 % des patients traités et 8,8 % des patients surveillés ; les événements indésirables graves étaient moins fréquents sous surveillance.</p><div class="key"><b>Limite.</b> Le résultat perdait sa robustesse lorsque les données manquantes étaient comptées comme des échecs ; les auteurs parlent de preuve modeste. Les patients étaient peu symptomatiques, et les récidives inférieures aux données épidémiologiques.</div><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1910775" target="_blank" rel="noopener">Brown et al., N Engl J Med 2020;382:405-415</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-hallifax2020" data-title="Essai de Hallifax, Lancet 2020"><p class="lab">Question</p><p>Un dispositif ambulatoire réduit-il l’hospitalisation du pneumothorax primaire symptomatique par rapport à la prise en charge standard ?</p><p class="lab">Méthode</p><p>Essai ouvert randomisé, conduit dans 24 hôpitaux britanniques chez 236 adultes de 16 à 55 ans, comparant le dispositif ambulatoire à l’aspiration ou au drain conventionnels.</p><p class="lab">Résultats</p><p>Sur 30 jours, la durée médiane d’hospitalisation était de 0 jour sous dispositif ambulatoire contre 4 jours sous traitement standard. Les effets indésirables touchaient 55 % du groupe ambulatoire contre 39 % ; les 14 événements graves sont tous survenus dans le groupe ambulatoire, dont 8 liés au dispositif : agrandissement du pneumothorax, œdème pulmonaire asymptomatique, dysfonction, fuite ou déplacement.</p><div class="key"><b>Conséquence.</b> Le dispositif convient au patient qui privilégie l’absence d’hospitalisation, dans une filière organisée.</div><p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(20)31043-6" target="_blank" rel="noopener">Hallifax et al., Lancet 2020</a>.</p></template>
<template data-pop="j93-marx2023" data-title="Essai de Marx, 2023 : aspiration ou drain"><p class="lab">Question</p><p>L’aspiration simple est-elle non inférieure au drain pour le pneumothorax primaire complet ?</p><p class="lab">Méthode</p><p>Essai randomisé ouvert, conduit dans 31 hôpitaux français chez 402 adultes de 18 à 50 ans présentant un décollement complet du poumon. Le critère principal était la réexpansion pulmonaire 24 heures après le geste.</p><p class="lab">Résultats</p><p>L’échec touchait 29 % des patients aspirés et 18 % des patients drainés. L’aspiration provoquait moins de douleur et moins de plicatures du matériel. La récidive à un an était de 20 % contre 27 %, sans différence significative.</p><div class="key"><b>Conséquence.</b> L’aspiration est moins efficace au premier essai mais mieux tolérée ; le choix se discute avec le patient selon sa priorité.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.202110-2409OC" target="_blank" rel="noopener">Marx et al., Am J Respir Crit Care Med 2023;207:1475-1485</a>.</p></template>
<template data-pop="j93-analgesie" data-title="Analgésie : anesthésie locale et antalgie multimodale"><p class="lab">Recommandations</p><p>La SPLF recommande une anesthésie locale de la paroi avant toute aspiration ou tout drainage, puis une analgésie multimodale, que le patient soit surveillé, aspiré ou drainé. Le retrait d’un drain de gros calibre, 16 French ou plus, associe l’application de froid. Après chirurgie, elle préfère une analgésie locorégionale périphérique à la péridurale et propose quelques jours d’anti-inflammatoires non stéroïdiens pour épargner la morphine. La BTS 2023 exige une analgésie adéquate avant et après une pleurodèse chimique.</p><p class="lab">Précautions</p><p>L’information professionnelle suisse de la morphine demande une prudence extrême en cas de dépression respiratoire ou de maladie obstructive des voies aériennes et réserve l’association aux benzodiazépines aux patients sans alternative.</p><p class="src">Références : <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023, analgésie</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; information professionnelle suisse de Morphini HCl Streuli, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>
<template data-pop="j93-chirurgie" data-title="Chirurgie du pneumothorax"><p class="lab">Techniques</p><p>La chirurgie associe la résection des blebs ou des bulles, à l’agrafeuse, et une pleurodèse chirurgicale par abrasion pleurale, pleurectomie partielle ou poudrage de talc. La SPLF recommande une technique mini-invasive et préfère une pleurodèse mécanique ou chimique à la pleurectomie ; l’abrasion est la technique la plus employée.</p><p class="lab">Résultats</p><p>Dans les méta-analyses de la BTS 2023, la chirurgie abaisse la récidive à 54 pour 1 000 contre 298 pour 1 000 après drain seul. Une autre méta-analyse, comparant les abords, retrouve 31 récidives pour 1 000 après vidéothoracoscopie contre 15 pour 1 000 après thoracotomie ; la vidéothoracoscopie raccourcit l’hospitalisation d’environ 3,7 jours et réduit douleur et complications. L’ERS 2024 ne peut trancher, faute de preuves concluantes, entre résection seule et résection associée à une pleurodèse.</p><p class="lab">Choix</p><p>La vidéothoracoscopie est l’abord habituel ; la thoracotomie se discute lorsque le risque de récidive doit être le plus bas possible, pour certaines professions.</p><div class="key"><b>Limite.</b> Le patient pèse le bénéfice sur la récidive contre le risque de douleur chronique et de paresthésies.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, questions cliniques 1, 4 et 5</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023, chirurgie</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-pleurodese" data-title="Pleurodèse au talc"><p class="lab">Mécanisme</p><p>La pleurodèse chimique instille dans l’espace pleural un agent irritant qui déclenche une réponse inflammatoire et des adhérences entre les deux feuillets. Le talc est l’agent le plus employé en Europe.</p><p class="lab">Modalités et preuves</p><p>Le talc est instillé en suspension par le drain ou poudré pendant une thoracoscopie, ce qui couvre mieux l’apex mais expose à davantage de complications. Dans un essai randomisé suisse de 108 patients, le talcage thoracoscopique sous anesthésie locale a réduit le recours à un second geste, 1 patient sur 61 contre 10 sur 47 après drainage seul, et la récidive à 5 ans, 5 % contre 34 %, au prix d’une douleur plus forte les 3 premiers jours. Le poudrage chirurgical évite la récidive dans plus de 90 % des cas.</p><p class="lab">Précautions</p><p>L’ERS 2015 juge le poudrage sûr à condition de disposer d’un talc calibré. L’incidence des cancers pleuraux ou pulmonaires après talc est comparable à celle de la population générale. Douleur et fièvre sont attendues ; l’analgésie se planifie avant et après.</p><div class="key"><b>Limite.</b> Une pleurodèse limite une chirurgie thoracique ultérieure ; elle se discute avant tout projet de transplantation.</div><p class="src">Références : <a href="https://doi.org/10.1183/09031936.02.00278202" target="_blank" rel="noopener">Tschopp et al., Eur Respir J 2002</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1183/09031936.00219214" target="_blank" rel="noopener">ERS 2015</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></template>
<template data-pop="j93-avion" data-title="Avion après un pneumothorax : délais et contentieux"><p class="lab">Principe</p><p>Le volume d’un gaz piégé augmente quand la pression ambiante baisse, comme dans une cabine d’avion. Tous les référentiels contre-indiquent donc le vol tant qu’un pneumothorax persiste.</p><p class="lab">Texte retenu (ERS, EACTS et ESTS 2024)</p><p>La recommandation européenne, la plus récente, demande de ne pas voler avec un pneumothorax non traité. Après la résolution radiologique, elle fixe un délai d’au moins 7 jours avant le vol, en raison du risque de récidive précoce ou d’échec du traitement (recommandations conditionnelles). La BTS 2023 retient le même délai, compté à partir de la radiographie qui démontre la résolution.</p><p class="lab">Texte contemporain (SPLF 2023)</p><p>La SPLF propose d’attendre au moins 2 semaines après la résolution d’un pneumothorax primaire (avis d’experts) ; elle rappelle que les recommandations antérieures variaient de 7 jours à 3 semaines. Elle propose une pleurodèse dès le premier épisode chez le personnel navigant.</p><div class="key"><b>Application.</b> Le patient attend au moins 7 jours après la radiographie qui démontre la résolution. Un patient qui doit voler souvent peut discuter une prévention chirurgicale.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00797-2023" target="_blank" rel="noopener">Walker et al., ERS, EACTS et ESTS 2024, voyage aérien</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, vol</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023, voyage aérien</a>.</p></template>
<template data-pop="j93-plongee" data-title="Plongée sous-marine : contentieux sur la pleurodèse"><p class="lab">Texte retenu (ERS, EACTS et ESTS 2024)</p><p>La recommandation européenne, la plus récente, reprend la position britannique : la plongée avec bouteilles est découragée définitivement après un pneumothorax, sauf stratégie de prévention définitive, telle une pleurectomie chirurgicale. La BTS 2023 formule la même règle.</p><p class="lab">Texte contemporain (SPLF 2023)</p><p>La SPLF propose de contre-indiquer fermement la plongée après un pneumothorax primaire, même après pleurodèse, en raison du risque de barotraumatisme mortel (avis d’experts).</p><div class="key"><b>Conséquence.</b> Un plongeur reçoit cette information dès le premier épisode. Seule une pleurectomie chirurgicale peut faire discuter, au cas par cas et avec un médecin de plongée, la reprise de l’activité.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00797-2023" target="_blank" rel="noopener">Walker et al., ERS, EACTS et ESTS 2024</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="j93-grossesse" data-title="Pneumothorax et grossesse"><p class="lab">Mécanisme</p><p>La grossesse augmente la consommation maternelle d’oxygène et accélère la respiration. Pendant le travail, la consommation d’oxygène peut croître de 50 %, et les efforts de Valsalva répétés élèvent la pression intrathoracique et peuvent agrandir le pneumothorax.</p><p class="lab">Conduite</p><p>Un pneumothorax de moins de 2 cm, sans dyspnée maternelle ni souffrance fœtale, peut être surveillé ; sinon, une aspiration ou un drain s’imposent. Pneumologue, obstétricien et chirurgien thoracique coopèrent étroitement.</p><p class="lab">Accouchement</p><p>L’accouchement spontané et la césarienne s’associent à un risque accru de récidive. La BTS 2023 évoque un accouchement assisté programmé à terme ou près du terme, sous péridurale ; si une césarienne s’impose, la rachianesthésie est préférée à l’anesthésie générale. La SPLF place la chirurgie après la naissance.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, grossesse</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="j93-ventile" data-title="Pneumothorax sous ventilation mécanique"><p class="lab">Mécanisme</p><p>La ventilation en pression positive peut convertir un pneumothorax simple en pneumothorax sous tension ; des pressions d’insufflation élevées, par exemple dans l’asthme aigu grave, y exposent aussi.</p><p class="lab">Conduite (ERC 2025)</p><p>Chez le patient ventilé qui se dégrade, le médecin vérifie la position et la perméabilité de la sonde, porte l’oxygène inspiré à 100 % et supprime la pression expiratoire positive. Une tension suspectée impose une décompression d’urgence.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">ERC 2025</a>.</p></template>
<template data-pop="j93-gaz" data-title="Gaz du sang artériel"><p class="lab">Indication</p><p>Les gaz du sang guident l’oxygénothérapie du patient à risque d’hypercapnie, chez qui la BTS vise une saturation de 88 à 92 % en attendant leur résultat. Ils mesurent le retentissement d’une forme secondaire.</p><p class="lab">Limite</p><p>Ils ne sont pas nécessaires chez le jeune patient stable dont la saturation est normale.</p><p class="src">Références : <a href="https://doi.org/10.1136/thoraxjnl-2016-209729" target="_blank" rel="noopener">BTS oxygène 2017</a>.</p></template>
<template data-pop="j93-lidocaine" data-title="Lidocaïne : doses suisses et britanniques, toxicité"><p class="lab">Texte retenu (information professionnelle suisse)</p><p>L’information professionnelle de Lidocaine Aguettant, approuvée par Swissmedic, indique la lidocaïne pour l’infiltration et les blocs nerveux périphériques. La dose totale habituelle est de 3 à 5 mg/kg ; la dose totale maximale recommandée ne dépasse pas, en général, 200 mg chez l’adulte pour l’infiltration.</p><p class="lab">Texte britannique (BTS 2023)</p><p>La déclaration sur les gestes pleuraux admet jusqu’à 3 mg/kg (au plus 250 mg) et reconnaît l’absence de consensus sur la dose maximale. Avant le talc, elle prévoit une instillation pleurale de 3 mg/kg, au plus 250 mg, usage hors de l’indication suisse.</p><p class="lab">Toxicité</p><p>Elle dépend de la concentration plasmatique. Les premiers signes sont des étourdissements, une agitation, une paresthésie des lèvres, un engourdissement de la langue et des acouphènes ; viennent ensuite tremblements, convulsions, dépression respiratoire et troubles du rythme. L’injection est arrêtée, l’oxygénation et la circulation sont assurées, un anticonvulsivant est donné si besoin et une émulsion lipidique intraveineuse est envisagée.</p><div class="key"><b>Application.</b> La dose cumulée, infiltration et instillation comprises, se calcule au poids et respecte la limite suisse.</div><p class="src">Références : information professionnelle suisse de Lidocaine Aguettant 10 mg/ml et 20 mg/ml, Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://www.brit-thoracic.org.uk/document-library/clinical-statements/pleural-procedures/bts-clinical-statement-on-pleural-procedures/" target="_blank" rel="noopener">déclaration BTS sur les gestes pleuraux 2023</a> ; <a href="https://brit-thoracic.org.uk/document-library/clinical-statements/pleural-procedures/online-appendix-12-pleural-procedures-intrapleural-treatment" target="_blank" rel="noopener">annexe 12</a>.</p></template>
<template data-pop="pareto-j93-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j93-0,j93-1,j93-2,j93-3,j93-4,j93-5,j93-6"></p><ul><li>Le pneumothorax est de l’air entre les plèvres ; spontané primaire sans maladie pulmonaire suspectée, secondaire sur poumon malade ou après 50 ans chez le fumeur.</li><li>Une brèche viscérale laisse fuir l’air ; une fuite persistante expose à la tension, qui entrave le retour veineux.</li><li>Le tabac multiplie le risque par 9 à 22 ; près d’un patient sur trois récidive après un premier épisode primaire.</li><li>Douleur thoracique et dyspnée ; une détresse fait chercher une forme secondaire ou une tension.</li></ul></template>
<template data-pop="pareto-j93-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j93-7"></p><ul><li>Radiographie de face en inspiration ; scanner en cas de doute ; échographie au lit.</li><li>Selon la SPLF, un pneumothorax est grand si le liseré est axillaire complet et mesure au moins 2 cm au hile ; selon la BTS, un geste est sûr si l’on mesure au moins 2 cm, parce qu’une lame d’air plus fine expose à ponctionner le poumon.</li><li>Bulle, hernie gastrique et pli cutané simulent un pneumothorax.</li></ul></template>
<template data-pop="pareto-j93-tt" data-title="Pareto — Urgences et prise en charge"><p class="ratio" data-cover="j93-8,j93-9"></p><ul><li>La tension se diagnostique cliniquement ou par échographie et se décomprime immédiatement, puis se draine.</li><li>Un pneumothorax primaire peu symptomatique se surveille quelle que soit sa taille, car l’air pleural se résorbe spontanément. S’il est symptomatique, le médecin pratique une aspiration, que l’ERS 2024 préfère au drain, ou pose un dispositif ambulatoire.</li><li>Un pneumothorax à haut risque justifie un drain de petit calibre et une hospitalisation.</li><li>Pas d’oxygène systématique dans le primaire ; un drain qui bulle ne se clampe pas.</li></ul></template>
<template data-pop="pareto-j93-suivi" data-title="Pareto — Récidive, suivi et critères"><p class="ratio" data-cover="j93-10,j93-11,j93-12,j93-13"></p><ul><li>Pleurodèse ou chirurgie après un deuxième épisode, un premier épisode controlatéral, bilatéral ou sous tension, une fuite persistante ou une profession à risque.</li><li>Arrêt du tabac, suivi pneumologique, avion au plus tôt 7 jours après la résolution radiologique, plongée déconseillée définitivement.</li><li>Le pneumothorax secondaire, même petit, se traite à l’hôpital.</li><li>Le diagnostic exige la preuve de l’air pleural ; la tension est un diagnostic clinique.</li></ul></template>
<template data-pop="pareto-j93-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j93-e-1,j93-e-2,j93-e-3"></p><ul><li>Radiographie en inspiration en première intention ; scanner à faible dose si doute persistant.</li><li>Ligne pleurale déplacée sans trame ; en décubitus, signe du sillon profond.</li><li>À l’échographie, l’absence de glissement pleural est évocatrice, et le point poumon est spécifique, parce qu’il marque la limite où le poumon recommence à toucher la paroi.</li></ul></template>
<template data-pop="pareto-j93-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j93-p-1,j93-p-2,j93-p-3"></p><ul><li>L’oxygène est titré sur l’hypoxémie, avec une cible de 94 à 98 %, ou de 88 à 92 % en cas de risque hypercapnique.</li><li>Le paracétamol se donne au plus à 4 g par jour, et au plus à 2 g en cas d’hépatopathie chronique.</li><li>La lidocaïne se donne au plus à 200 mg en dose cumulée selon l’information suisse, et le talc calibré se dose à 4 à 5 g.</li></ul></template>
