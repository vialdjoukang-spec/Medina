<h1>Pneumothorax</h1><span class="status">Adulte · pneumothorax spontanés primaire, secondaire et sous tension · rédaction du 08.10.2026 · référentiels BTS 2023 et ERS 2015</span></div>

<section class="ilot" id="j93-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un étudiant de 22 ans, grand, mince et fumeur, ressent au repos une douleur thoracique droite en coup de poignard, puis un essoufflement modéré. Il parle sans peine ; sa saturation pulsée atteint 97 % en air ambiant. La radiographie montre un décollement apical de 3 cm. <b>Cette taille impressionne ; elle ne décide pourtant plus, à elle seule, du traitement.</b> Les symptômes, la stabilité physiologique, le terrain pulmonaire et la priorité du patient orientent désormais le choix.</p><p>Souvent bénin chez le sujet jeune, le pneumothorax devient mortel lorsqu’il comprime le médiastin ou frappe un poumon déjà malade. Le médecin doit donc reconnaître en quelques minutes la forme sous tension, distinguer la forme primaire de la forme secondaire, choisir entre surveillance, aspiration, valve ambulatoire et drain, puis prévenir la récidive.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="j93-pression-pleurale">La pression pleurale négative (pourquoi l’air entre et le poumon se rétracte)</button> ; <button class="w" data-k="j93-tension-mecanisme">le mécanisme valvulaire du pneumothorax sous tension (pourquoi il tue)</button>.</div></section>
<section class="ilot" id="j93-1"><h2><span class="n">1</span>Définition, classification et codage</h2><p>Le <b>pneumothorax</b> désigne la présence d’air dans la cavité pleurale, espace virtuel compris entre la plèvre viscérale, qui revêt le poumon, et la plèvre pariétale, qui tapisse la paroi. Il est <b>spontané</b> lorsqu’il survient sans traumatisme ni geste médical. Le pneumothorax spontané <b>primaire</b> atteint un sujet sans maladie pulmonaire connue ; le <b>secondaire</b> complique une maladie pulmonaire établie, le plus souvent une BPCO. La BTS 2023 range aussi parmi les secondaires tout patient de 50 ans ou plus ayant un tabagisme significatif, car ce groupe répond moins bien à l’aspiration.</p><p>« Primaire » ne signifie pas « poumon normal » : la plupart de ces patients présentent au scanner des <button class="w" data-k="j93-blebs">lésions apicales de type emphysémateux (blebs, bulles et porosité pleurale)</button>. La distinction traduit une différence de pronostic et de conduite, non l’absence de lésion. Le <b>pneumothorax sous tension</b> est un mode évolutif : la pression intrapleurale devient positive pendant tout le cycle respiratoire et entrave le retour veineux.</p><table class="t"><tr><th>Code et intitulé</th><th>Situation couverte</th></tr><tr><td><b>J93.0 — Pneumothorax spontané avec pression positive</b></td><td>Pneumothorax spontané sous tension ; urgence vitale</td></tr><tr><td><b>J93.1 — Autres pneumothorax spontanés</b></td><td>Pneumothorax spontané primaire ou secondaire sans tension</td></tr><tr><td><b>J93.8 — Autres pneumothorax</b></td><td>Autre pneumothorax précisé, non classé en J93.0 ou J93.1</td></tr><tr><td><b>J93.9 — Pneumothorax, sans précision</b></td><td>Mécanisme non documenté, à préciser dès que possible</td></tr></table><p>Ce tableau se lit avec ses exclusions. Le <b>pneumothorax traumatique</b> relève de S27.0, l’iatrogène de J95.80, la forme congénitale ou périnatale de P25.1, celui d’une tuberculose active de A15–A16 et le pyopneumothorax de J86. Leurs principes restent accessibles : <button class="w" data-k="j93-traumatique">pneumothorax traumatique (spécificités et renvoi)</button> ; <button class="w" data-k="j93-iatrogene">pneumothorax iatrogène (gestes en cause et évolution)</button>.</p><div class="key"><b>À retenir.</b> Le codage suit le mécanisme : spontané, traumatique ou iatrogène. Le caractère primaire ou secondaire, puis l’existence d’une tension, gouvernent ensuite toute la conduite.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j90-j94.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc J90–J94</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">Roberts et al., recommandation BTS 2023, Thorax</a>.</p></section>
<section class="ilot" id="j93-2"><h2><span class="n">2</span>Épidémiologie et récidive</h2><p>Dans la cohorte d’Olmsted County, l’incidence ajustée du pneumothorax spontané primaire atteignait 7,4 pour 100 000 hommes et 1,2 pour 100 000 femmes par an ; celle du secondaire, 6,3 et 2,0. Une série suédoise rapporte 18 et 6 pour 100 000. Les admissions hospitalières britanniques sont passées de 9,1 à 14,1 pour 100 000 habitants en cinquante ans. Aucune donnée d’incidence nationale suisse n’a été publiée ; les chiffres européens servent donc de repère.</p><p>La forme primaire culmine entre 15 et 34 ans, chez des hommes grands et minces ; la forme secondaire frappe plutôt après 50 ans, sur une BPCO. <b>La récidive pèse le plus sur le suivi</b> : une méta-analyse de 13 548 patients retrouve, après un premier pneumothorax primaire, 29 % de récidive à un an et 32 % au total. Après un premier épisode secondaire, la BTS cite 13 à 39 %.</p><p>Deux facteurs modulent ce risque. Le sexe féminin triple la probabilité de récidive (rapport des cotes 3,03), peut-être en partie par des formes cataméniales méconnues. L’arrêt du tabac la divise environ par quatre (rapport des cotes 0,26) : <button class="w" data-k="j93-tabac">le tabac est le premier facteur modifiable (relation dose-effet et mécanisme)</button>.</p><div class="key"><b>À retenir.</b> Un patient sur trois récidive après un premier pneumothorax primaire, surtout dans l’année. Le sevrage tabagique est la mesure préventive la plus simple et l’une des plus efficaces.</div><p class="src">Références : <a href="https://doi.org/10.1164/arrd.1979.120.6.1379" target="_blank" rel="noopener">Melton et al., Am Rev Respir Dis 1979</a> ; <a href="https://doi.org/10.1378/chest.92.6.1009" target="_blank" rel="noopener">Bense et al., Chest 1987</a> ; <a href="https://doi.org/10.1183/13993003.00864-2018" target="_blank" rel="noopener">Walker et al., méta-analyse, Eur Respir J 2018</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></section>
<section class="ilot" id="j93-3"><h2><span class="n">3</span>Du vide pleural au collapsus</h2><p>À l’état normal, le poumon tend à se rétracter vers le hile tandis que la cage thoracique tend à s’expandre. Ces forces opposées créent une <button class="w" data-k="j93-pression-pleurale">pression pleurale négative d’environ −5 cm d’eau en fin d’expiration (origine et valeur)</button>. Quelques millilitres de liquide pleural couplent les deux feuillets : le poumon suit la paroi parce qu’aucun gaz ne s’interpose.</p><p>Dès qu’une brèche met une alvéole, ou l’extérieur, en communication avec la cavité pleurale, l’air s’y engouffre selon le gradient de pression. Le couplage cède et <button class="w" data-k="j93-retraction">la rétraction élastique du poumon (pourquoi il s’affaisse vers le hile)</button> l’emporte, jusqu’à l’égalisation des pressions ou la fermeture de la brèche. Le poumon collabé reste perfusé sans être ventilé : cet <b>effet shunt</b> explique l’hypoxémie, que la vasoconstriction pulmonaire hypoxique atténue chez le sujet jeune.</p><p>Dans la forme primaire, la fuite naît le plus souvent d’une zone apicale fragilisée, où la contrainte mécanique est maximale. Dans la forme secondaire, <button class="w" data-k="j93-secondaire">un poumon malade tolère mal la perte de volume (réserve et gravité)</button> : un petit décollement peut suffire à provoquer une insuffisance respiratoire. Lorsque la brèche se comporte en valve unidirectionnelle, l’air entre à chaque inspiration sans ressortir et la pression devient positive : c’est le <button class="w" data-k="j93-tension-mecanisme">pneumothorax sous tension (chaîne hémodynamique)</button>.</p><div class="key"><b>Conséquence pratique.</b> L’air pleural se résorbe lentement, de l’ordre de 1,25 à 2,2 % du volume de l’hémithorax par jour. <button class="w" data-k="j93-oxygene">L’oxygène accélère cette résorption (gradient d’azote)</button>, mais la guérison exige d’abord que la brèche se ferme.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, définitions</a> ; <a href="https://doi.org/10.1183/09031936.00219214" target="_blank" rel="noopener">Tschopp et al., ERS 2015</a> ; <a href="https://doi.org/10.1136/thx.2010.136986" target="_blank" rel="noopener">BTS 2010, résorption</a>.</p></section>
<section class="ilot" id="j93-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2><p>Le pneumothorax primaire associe un terrain morphologique, une exposition et parfois une prédisposition génétique. Le <b>tabac</b> multiplie le risque d’un premier épisode par 22 environ chez l’homme et par 9 chez la femme, avec une relation dose-effet nette ; le cannabis fumé y contribue aussi. La grande taille et la minceur accroissent la contrainte apicale. La plupart des épisodes surviennent au repos : l’effort n’en est pas la cause habituelle.</p><p>Le pneumothorax secondaire révèle ou complique une maladie du parenchyme. Le tableau classe ses causes selon le mécanisme de la fuite, qui prédit la gravité et la conduite.</p><table class="t"><tr><th>Groupe</th><th>Exemples</th><th>Mécanisme de la fuite</th></tr><tr><td>Maladies des voies aériennes</td><td>BPCO avec emphysème, asthme sévère, <button class="w" data-k="j93-mucoviscidose">mucoviscidose (fréquence et pronostic)</button></td><td>Rupture de bulles ; hyperinflation et piégeage aérien</td></tr><tr><td>Infections</td><td>Pneumocystose chez la personne vivant avec le VIH, tuberculose, pneumonie nécrosante</td><td>Nécrose du parenchyme sous-pleural</td></tr><tr><td>Maladies kystiques et interstitielles</td><td>Lymphangioléiomyomatose, histiocytose langerhansienne, fibrose pulmonaire</td><td>Kystes sous-pleuraux ; parenchyme rigide</td></tr><tr><td>Maladies génétiques</td><td><button class="w" data-k="j93-genetique">Syndromes de Birt-Hogg-Dubé, de Marfan et d’Ehlers-Danlos, sclérose tubéreuse (gènes et indices)</button></td><td>Kystes ou fragilité du tissu conjonctif</td></tr><tr><td>Néoplasies</td><td>Cancer bronchique, métastases de sarcome</td><td>Nécrose tumorale sous-pleurale</td></tr><tr><td>Endométriose thoracique</td><td><button class="w" data-k="j93-catamenial">Pneumothorax cataménial (rythme et mécanismes)</button></td><td>Fenestrations diaphragmatiques ; dépôts pleuraux</td></tr></table><p>Le tableau se lit à partir du patient : une femme qui récidive autour de ses règles oriente vers l’endométriose ; des kystes pulmonaires et une histoire familiale, vers une cause génétique. Environ 10 % des patients rapportent un antécédent familial, ce qui justifie un scanner et un avis spécialisé.</p><div class="key"><b>À retenir.</b> Chez un fumeur jeune et mince, le pneumothorax primaire domine. Une récidive cataméniale, des kystes ou une histoire familiale imposent de rechercher une cause sous-jacente.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.92.6.1009" target="_blank" rel="noopener">Bense et al., Chest 1987</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, pneumothorax familial et cataménial</a>.</p></section>
<section class="ilot" id="j93-5"><h2><span class="n">5</span>Anamnèse</h2><p>Le maître symptôme est une <button class="w" data-k="j93-douleur-pleurale">douleur thoracique latérale brutale, majorée à l’inspiration (innervation de la plèvre pariétale)</button>. Elle survient typiquement au repos et s’atténue souvent en quelques heures, si bien que certains patients ne consultent qu’après plusieurs jours. La <button class="w" data-k="j93-dyspnee">dyspnée (déterminants et signification)</button> dépend moins de la taille que de la réserve respiratoire : un sujet jeune tolère un poumon largement collabé, un patient atteint de BPCO non.</p><p>L’interrogatoire recherche ensuite ce qui modifie la conduite : maladie pulmonaire connue, tabac et cannabis, épisodes antérieurs homolatéraux ou controlatéraux, rythme cataménial, antécédents familiaux, profession exposée (pilote, plongeur) et projet de voyage aérien. Une toux, une fièvre ou une hémoptysie orientent vers une cause secondaire.</p><div class="two"><div class="card"><h4>Forme typique</h4><p>Un homme jeune décrit une douleur unilatérale soudaine, puis une gêne respiratoire modérée. Il est stable et ses constantes sont proches de la normale.</p></div><div class="card"><h4>Formes atypiques</h4><p>Un patient atteint de BPCO présente une dyspnée disproportionnée sans douleur nette. Une femme jeune récidive dans les 72 heures qui entourent ses règles. Un patient ventilé se désature brutalement, avec des pressions d’insufflation élevées.</p></div></div><div class="key"><b>À retenir.</b> L’anamnèse mesure la tolérance, le terrain et le risque de récidive. Une dyspnée disproportionnée chez un patient pulmonaire signale une forme secondaire grave.</div></section>
<section class="ilot" id="j93-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen commence par la gravité : fréquence respiratoire, saturation pulsée, fréquence cardiaque, tension artérielle, capacité à parler et vigilance. Une tachycardie marquée, une hypotension ou une désaturation importante orientent vers une tension ou une forme secondaire décompensée. Un petit pneumothorax peut rester cliniquement muet.</p><div class="two"><div class="card"><h4>Signes du côté atteint</h4><p>L’hémithorax se soulève moins. Le <button class="w" data-k="j93-murmure">murmure vésiculaire est diminué ou aboli (mécanisme acoustique)</button>. La percussion révèle un <button class="w" data-k="j93-tympanisme">tympanisme (air sous la paroi)</button> et les vibrations vocales sont abolies.</p></div><div class="card"><h4>Signes d’alarme</h4><p>Un <button class="w" data-k="j93-emphyseme-sc">emphysème sous-cutané (crépitation neigeuse)</button>, une turgescence jugulaire, une hypotension ou une <button class="w" data-k="j93-signes-tension">déviation trachéale controlatérale (signe tardif de tension)</button> imposent une réévaluation immédiate.</p></div></div><p>Le triplet diminution du murmure, tympanisme et abolition des vibrations distingue le pneumothorax de l’épanchement liquidien, qui donne une matité. Chez le patient emphysémateux, l’hyperinflation bilatérale rend ces signes peu discriminants.</p><div class="key"><b>À retenir.</b> L’examen sert d’abord à repérer la tension. Le diagnostic positif repose ensuite sur l’imagerie, car les petits pneumothorax n’ont souvent aucun signe physique.</div><p class="src">Références : <a href="https://doi.org/10.1183/09031936.00219214" target="_blank" rel="noopener">Tschopp et al., ERS 2015</a>.</p><button class="pareto-btn ui" data-k="pareto-j93-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
