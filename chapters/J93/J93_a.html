<h1>Pneumothorax</h1><span class="status">Adulte · pneumothorax spontanés primaire, secondaire et sous tension · rédaction du 08.10.2026 · référentiels ERS 2024, BTS 2023 et SPLF 2023</span></div>

<section class="ilot" id="j93-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un étudiant de 22 ans, fumeur, ressent une douleur thoracique droite puis un essoufflement modéré. Il parle sans peine ; sa saturation pulsée atteint 97 % en air ambiant. Aux urgences, la radiographie montre un liseré d’air sur toute la hauteur de la paroi axillaire. <b>Ce pneumothorax est grand ; sa taille ne décide pourtant plus, à elle seule, du traitement.</b> Or, les recommandations européennes récentes fondent le choix sur les symptômes, la stabilité, le terrain pulmonaire et la priorité du patient.</p><p>Souvent bénin chez le sujet sain, le pneumothorax devient mortel lorsqu’il entrave le retour veineux ou frappe un poumon déjà malade. Le médecin doit donc reconnaître en quelques minutes la forme sous tension, distinguer forme primaire et forme secondaire, choisir entre surveillance, aspiration, dispositif ambulatoire et drain, puis prévenir la récidive.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="j93-pression-pleurale">Le couplage pleural (pourquoi le poumon se détache de la paroi)</button> ; <button class="w" data-k="j93-tension-mecanisme">le pneumothorax sous tension (pourquoi il tue)</button>.</div></section>
<section class="ilot" id="j93-1"><h2><span class="n">1</span>Définition et classification</h2><p>Le <b>pneumothorax</b> désigne l’accumulation d’air entre la plèvre pariétale et la plèvre viscérale. Il est <b>spontané</b> lorsqu’il survient sans traumatisme ni geste médical. Ainsi, le pneumothorax spontané <b>primaire</b> atteint un sujet sans maladie pulmonaire suspectée ; le <b>secondaire</b> complique une maladie pulmonaire établie. La BTS 2023 range aussi parmi les secondaires le patient de plus de 50 ans ayant des antécédents tabagiques, car ce groupe semble répondre différemment à l’aspiration.</p><p>« Primaire » ne signifie pas « poumon normal » : la majorité de ces patients présentent au scanner des <button class="w" data-k="j93-blebs">modifications de type emphysémateux (blebs, bulles et porosité pleurale)</button>. Néanmoins, la distinction reflète une différence de conduite et de pronostic, non l’absence de lésion. Enfin, le <b>pneumothorax sous tension</b> se définit cliniquement par une détresse respiratoire ou une instabilité hémodynamique.</p><p>Deux formes non spontanées obéissent à d’autres règles : <button class="w" data-k="j93-traumatique">le pneumothorax traumatique (spécificités)</button> et <button class="w" data-k="j93-iatrogene">le pneumothorax iatrogène (gestes en cause et évolution)</button>. C’est pourquoi la BTS 2023 les exclut de son algorithme.</p><div class="key"><b>À retenir.</b> Le mécanisme sépare d’abord les formes spontanée, traumatique et iatrogène. Le caractère primaire ou secondaire, puis l’existence d’une tension, gouvernent ensuite toute la conduite.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">Roberts et al., recommandation BTS 2023, Thorax</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">Jouneau et al., recommandations SPLF 2023, Ann Intensive Care</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Harnedy et al., revue de la Société européenne de pneumologie, Breathe 2025</a>.</p></section>
<section class="ilot" id="j93-2"><h2><span class="n">2</span>Épidémiologie et récidive</h2><p>Dans la cohorte nord-américaine d’Olmsted County (1950–1974), l’incidence ajustée du pneumothorax spontané primaire atteignait 7,4 pour 100 000 hommes et 1,2 pour 100 000 femmes par an ; celle du secondaire, 6,3 et 2,0. De même, dans le comté de Stockholm, l’incidence d’un premier épisode était de 18 pour 100 000 hommes et de 6 pour 100 000 femmes. Par ailleurs, les admissions hospitalières britanniques sont passées de 9,1 à 14,1 pour 100 000 habitants en cinquante ans. En revanche, aucune étude suisse ne publie l’incidence du pneumothorax : les cohortes suédoise, britannique et nord-américaine servent de repère.</p><p>La distribution des âges est bimodale, avec un premier pic entre 15 et 34 ans et une incidence croissante après 60 ans ; le secondaire survient plus tard dans la vie. Par ailleurs, <b>la récidive pèse le plus sur le suivi</b> : une méta-analyse de 13 548 patients retrouve, après un premier pneumothorax primaire, 29 % de récidive à un an et 32 % au total. De même, après un premier épisode secondaire, la BTS cite 13 à 39 %.</p><p>Le sexe féminin triple la probabilité de récidive (rapport des cotes 3,03) ; l’arrêt du tabac la divise environ par quatre (rapport des cotes 0,26). De plus, un âge jeune, un faible indice de masse corporelle, une grande taille et des anomalies pulmonaires au scanner l’augmentent aussi. <button class="w" data-k="j93-tabac">Enfin, le tabac est le premier facteur modifiable (relation dose-effet)</button>.</p><div class="key"><b>À retenir.</b> Près d’un patient sur trois récidive après un premier pneumothorax primaire, surtout dans l’année. Le sevrage tabagique est la mesure préventive la plus simple et l’une des plus efficaces.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/517861/" target="_blank" rel="noopener">Melton et al., Am Rev Respir Dis 1979</a> ; <a href="https://doi.org/10.1378/chest.92.6.1009" target="_blank" rel="noopener">Bense et al., Chest 1987</a> ; <a href="https://doi.org/10.1183/13993003.00864-2018" target="_blank" rel="noopener">Walker et al., méta-analyse, Eur Respir J 2018</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p></section>
<section class="ilot" id="j93-3"><h2><span class="n">3</span>Physiopathologie</h2><p>À l’état normal, la plèvre viscérale reste au contact de la plèvre pariétale : <button class="w" data-k="j93-pression-pleurale">le couplage pleural (fonction et rupture)</button> fait suivre au poumon les mouvements de la paroi. En effet, une brèche de la plèvre viscérale laisse fuir l’air du poumon vers la cavité pleurale ; la pression pleurale s’élève et <button class="w" data-k="j93-retraction">le poumon s’éloigne de la paroi (rétraction)</button>. Souvent, la fuite se tarit vite, mais la réexpansion du poumon demande du temps.</p><p>Une fuite qui persiste expose au <button class="w" data-k="j93-tension-mecanisme">pneumothorax sous tension (chaîne hémodynamique)</button> : l’air accumulé déplace le médiastin, entrave le retour veineux et altère les échanges gazeux. De plus, la ventilation en pression positive peut convertir un pneumothorax simple en pneumothorax sous tension.</p><p>La gravité dépend du terrain. Concrètement, selon la SPLF, un petit pneumothorax primaire ne peut, à lui seul, provoquer une détresse respiratoire ou hémodynamique ; une telle détresse fait chercher une autre explication, notamment une forme secondaire. <button class="w" data-k="j93-secondaire">À l’inverse, un poumon malade tolère mal la perte de volume (réserve et gravité)</button>.</p><div class="key"><b>Conséquence pratique.</b> Une fuite tarie autorise la surveillance, car l’air se résorbe peu à peu ; une fuite persistante impose d’évacuer l’air. <button class="w" data-k="j93-oxygene">L’oxygène à haute concentration peut accélérer la résorption (gradient d’azote et limites)</button>.</div><p class="src">Références : <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a> ; <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">Lott et al., ERC 2025</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a>.</p></section>
<section class="ilot" id="j93-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2><p>Le pneumothorax primaire naît le plus souvent de lésions sous-pleurales de type emphysémateux ou d’une porosité de la plèvre viscérale. Or, le <b>tabac</b> multiplie le risque d’un premier épisode par 22 environ chez l’homme et par 9 chez la femme, avec une relation dose-effet ; l’association au cannabis l’accroît encore. Par ailleurs, les variations de pression atmosphérique sont un autre facteur de risque ; le rôle d’un effort de Valsalva reste en revanche non démontré.</p><p>Le pneumothorax secondaire révèle ou complique une maladie du parenchyme. Ainsi, le tableau retient les causes que détaillent les sources européennes et britanniques lues.</p><table class="t"><tr><th>Groupe</th><th>Exemples</th><th>Indice d’orientation</th></tr><tr><td>Maladies des voies aériennes</td><td>BPCO, emphysème, asthme ; <button class="w" data-k="j93-mucoviscidose">mucoviscidose (fréquence et pronostic)</button></td><td>Décompensation pour un petit décollement</td></tr><tr><td>Maladies kystiques diffuses et causes familiales</td><td><button class="w" data-k="j93-genetique">Syndrome de Birt-Hogg-Dubé, sclérose tubéreuse et lymphangioléiomyomatose, syndromes de Marfan et d’Ehlers-Danlos (orientation)</button></td><td>Kystes au scanner ; antécédent familial</td></tr><tr><td>Endométriose thoracique</td><td><button class="w" data-k="j93-catamenial">Pneumothorax cataménial (rythme et mécanismes)</button></td><td>Récidive autour des règles, côté droit</td></tr><tr><td>Pneumopathie de la COVID-19</td><td>Formes condensantes étendues</td><td>Kystes dans les condensations ; ventilation mécanique</td></tr></table><p>Le tableau se lit à partir du patient : une femme qui récidive autour de ses règles oriente vers l’endométriose ; des kystes pulmonaires ou une histoire familiale, vers une maladie kystique diffuse, en cause dans jusqu’à 10 % des pneumothorax primaires apparents. À cet égard, selon la SPLF 2023, la BPCO, l’emphysème et l’asthme sont les maladies chroniques le plus souvent associées à un premier épisode secondaire : un pneumothorax chez un patient dyspnéique chronique se présume secondaire.</p><div class="key"><b>À retenir.</b> Chez un fumeur jeune, le pneumothorax primaire domine. Une récidive cataméniale, des kystes ou une histoire familiale imposent de rechercher une cause sous-jacente par le scanner.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.92.6.1009" target="_blank" rel="noopener">Bense et al., Chest 1987</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023, sevrage tabagique</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025, étiologie</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, pneumothorax familial et cataménial</a>.</p></section>
<section class="ilot" id="j93-5"><h2><span class="n">5</span>Anamnèse</h2><p>Le pneumothorax se présente typiquement par une <button class="w" data-k="j93-douleur-pleurale">douleur thoracique (caractère et pièges)</button> et une <button class="w" data-k="j93-dyspnee">dyspnée (signification et signes de mauvaise tolérance)</button> ; la SPLF fait de la dyspnée le symptôme principal. En revanche, une dyspnée de repos ou une douleur que les antalgiques non opioïdes ne soulagent pas traduisent une mauvaise tolérance.</p><p>L’interrogatoire recherche ensuite ce qui modifie la décision : maladie pulmonaire connue, tabac et autres substances fumées, épisodes antérieurs homolatéraux ou controlatéraux, rythme cataménial, antécédents familiaux, profession exposée (pilote, plongeur), projet de voyage aérien et entourage disponible à domicile.</p><div class="two"><div class="card"><h4>Forme typique</h4><p>Un adulte jeune décrit une douleur thoracique unilatérale puis une gêne respiratoire. Il reste stable, et ses constantes sont proches de la normale.</p></div><div class="card"><h4>Formes atypiques</h4><p>Un patient atteint de BPCO sévère décompense pour un petit décollement. Par ailleurs, une femme jeune présente douleur, dyspnée et parfois hémoptysie dans les 72 heures qui entourent ses règles. Enfin, un patient ventilé devient brutalement instable.</p></div></div><div class="key"><b>À retenir.</b> L’anamnèse mesure la tolérance, le terrain et le risque de récidive. Une détresse chez un patient porteur d’un petit pneumothorax signale une forme secondaire ou une tension.</div><p class="src">Références : <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025, diagnostic</a> ; <a href="https://doi.org/10.1186/s13613-023-01181-2" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></section>
<section class="ilot" id="j93-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen commence par la gravité : fréquence respiratoire, saturation pulsée, fréquence cardiaque, tension artérielle, capacité à parler et vigilance. De fait, une instabilité hémodynamique, plus fréquente dans la forme secondaire que dans la forme primaire, fait penser d’emblée à une tension.</p><div class="two"><div class="card"><h4>Signes évocateurs</h4><p>Le <button class="w" data-k="j93-murmure">murmure vésiculaire est aboli d’un côté (valeur et pièges)</button>. De plus, un <button class="w" data-k="j93-emphyseme-sc">emphysème sous-cutané (origine et conduite)</button> signale une fuite d’air dans les parties molles.</p></div><div class="card"><h4>Signes de tension</h4><p>En outre, une hypotension, une turgescence jugulaire, une hypoxémie et une <button class="w" data-k="j93-signes-tension">déviation trachéale avec déplacement médiastinal (signes et limites)</button> imposent une décompression sans délai.</p></div></div><p>Toutefois, l’examen ne suffit pas au diagnostic positif : chez le patient stable, celui-ci exige l’imagerie. Il garde en revanche toute sa valeur pour reconnaître la tension, dont la présentation n’est pas toujours classique.</p><div class="key"><b>À retenir.</b> L’examen sert d’abord à repérer la tension. Chez le patient stable, l’imagerie confirme le diagnostic.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.resuscitation.2025.110753" target="_blank" rel="noopener">ERC 2025, pneumothorax sous tension</a> ; <a href="https://doi.org/10.1183/20734735.0250-2024" target="_blank" rel="noopener">Breathe 2025</a>.</p><button class="pareto-btn ui" data-k="pareto-j93-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
