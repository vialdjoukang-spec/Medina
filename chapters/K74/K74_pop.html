<template data-pop="pareto-k74-clinique" data-title="Loi de Pareto — Fibrose et cirrhose"><p class="ratio" data-cover="k74-1,k74-5,k74-6,k74-7,k74-8,k74-9"></p><ul><li>FIB-4 < 1,30 : faible risque ; ≥ 1,30 : élastographie.</li><li>Élastographie < 10 kPa : pas de cACLD ; > 15 kPa : cACLD probable.</li><li>Hypertension portale exclue : ≤ 15 kPa et plaquettes ≥ 150 G/l.</li><li>Hypertension portale affirmée : ≥ 25 kPa.</li><li>Supprimer la cause : abstinence, antiviraux.</li><li>Hypertension portale significative : carvédilol, sans endoscopie de dépistage.</li></ul></template>
<template data-pop="pareto-k74-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k74-e-1,k74-e-2"></p><ul><li>FIB-4 < 1,30 : faible risque.</li><li>Élastographie < 8 kPa en premier recours : faible risque.</li><li>≥ 10 kPa : confirmer à jeun ou par FIB-4 ≥ 2,67.</li><li>≥ 25 kPa : hypertension portale significative.</li><li>Inflammation : élastographie surestimée.</li></ul></template>
<template data-pop="pareto-k74-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k74-p-1,k74-p-2,k74-p-3"></p><ul><li>Pas de bêtabloquant sans hypertension portale significative.</li><li>Carvédilol préféré (Baveno VII), hors indication en Suisse.</li><li>Ascite sévère : propranolol ≤ 80 mg/j.</li><li>Simvastatine ≤ 20 mg/j en Child B ou C.</li><li>Suspendre le bêtabloquant si sepsis, hémorragie ou insuffisance rénale aiguë.</li></ul></template>
<template data-pop="k74-fib4" data-title="Score FIB-4"><p class="lab">Variables</p><p>Âge, ASAT, ALAT, plaquettes.</p><p class="lab">Seuils</p><p>< 1,30 : faible risque de fibrose avancée (EASL 2021) ; ≥ 2,67 : confirme une élastographie ≥ 10 kPa (Baveno VII, 2.11).</p><p class="lab">Limite</p><p>Ne pas l’utiliser seul comme unique critère de décision (EASL 2021).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2021/06/EASL-Clinical-Practice-Guidelines-on-non-invasive-tests-for-evaluation-of-liver-disease-severity-and-prognosis-%E2%80%93-2021-update.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on non-invasive tests for evaluation of liver disease severity and prognosis — 2021 update, J Hepatol 2021;75:659-689</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-elasto" data-title="Élastographie impulsionnelle"><p class="lab">Principe</p><p>Mesure de la vitesse d’une onde de cisaillement dans le foie, convertie en dureté (kPa).</p><p class="lab">Seuils</p><p>8 kPa : premier recours ; 10 et 15 kPa : cACLD ; 25 kPa : hypertension portale significative.</p><p class="lab">Pièges</p><p>Repas, inflammation, cholestase, congestion.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2021/06/EASL-Clinical-Practice-Guidelines-on-non-invasive-tests-for-evaluation-of-liver-disease-severity-and-prognosis-%E2%80%93-2021-update.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on non-invasive tests for evaluation of liver disease severity and prognosis — 2021 update, J Hepatol 2021;75:659-689</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-cacld" data-title="Maladie hépatique chronique avancée compensée (cACLD)"><p class="lab">Définition</p><p>Spectre fibrose sévère-cirrhose chez un patient compensé, à risque d’hypertension portale significative.</p><p class="lab">Critères (Baveno VII)</p><p>< 10 kPa : exclue ; 10-15 kPa : suggestive ; > 15 kPa : fortement suggestive.</p><p class="lab">Conduite</p><p>Adresse au spécialiste (énoncé 2.6).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-csph" data-title="Hypertension portale cliniquement significative"><p class="lab">Définition</p><p>Gradient de pression porto-hépatique ≥ 10 mmHg.</p><p class="lab">Non invasif</p><p>Exclue : ≤ 15 kPa et plaquettes ≥ 150 G/l ; affirmée : ≥ 25 kPa.</p><p class="lab">Conséquence</p><p>Risque accru de décompensation ; indication d’un bêtabloquant non sélectif.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-decompensation" data-title="Décompensation de la cirrhose"><p class="lab">Événements (Baveno VII, 5.4)</p><p>Ascite manifeste (ou hydrothorax avec gradient albumine > 1,1 g/dl), encéphalopathie manifeste (West Haven ≥ II), hémorragie variqueuse.</p><p class="lab">Précipitants</p><p>Infection, hépatite surajoutée, médicament, carcinome, chirurgie majeure.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-hvpg" data-title="Gradient de pression porto-hépatique"><p class="lab">Mesure</p><p>Différence entre pression veineuse sus-hépatique bloquée et libre, par cathétérisme.</p><p class="lab">Seuils</p><p>> 5 mmHg : hypertension portale sinusoïdale ; ≥ 10 mmHg : cliniquement significative.</p><p class="lab">Limite</p><p>Sous-estime la pression dans la cholangite biliaire primitive (composante présinusoïdale).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-angiome" data-title="Angiome stellaire"><p class="lab">Aspect</p><p>Artériole centrale avec ramifications radiaires, qui blanchit à la pression.</p><p class="lab">Signification</p><p>Signe d’insuffisance hépatocellulaire chronique.</p></template>
<template data-pop="k74-regle5" data-title="Règle des 5 (Baveno VII, 2.9)"><p class="lab">Seuils</p><p>10, 15, 20 et 25 kPa.</p><p class="lab">Signification</p><p>Risques relatifs croissants de décompensation et de décès hépatique, quelle que soit la cause.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-anticipate" data-title="Modèle ANTICIPATE"><p class="lab">Variables</p><p>Élastographie et plaquettes.</p><p class="lab">Exemples (Baveno VII, 2.17)</p><p>20-25 kPa et plaquettes < 150 G/l, ou 15-20 kPa et plaquettes < 110 G/l : risque d’hypertension portale significative ≥ 60 %.</p><p class="lab">Domaine</p><p>Causes virales, alcooliques et métaboliques non obèses.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-bbns" data-title="Bêtabloquants non sélectifs"><p class="lab">Molécules</p><p>Propranolol, nadolol, carvédilol.</p><p class="lab">Indication</p><p>Prévention de la décompensation si hypertension portale significative (Baveno VII, 5.14).</p><p class="lab">Non indiqués</p><p>Sans hypertension portale significative (5.20).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-d-carvedilol" data-title="Carvédilol"><p class="lab">Place (Baveno VII, 5.15)</p><p>Préféré en cirrhose compensée : baisse plus forte du gradient, meilleure tolérance, bénéfice de survie.</p><p class="lab">Statut suisse</p><p>Autorisé dans l’hypertension artérielle, l’angor et l’insuffisance cardiaque ; contre-indiqué si insuffisance hépatique manifeste ; exposition × 6,8 dans la cirrhose.</p><p class="lab">Ascite réfractaire</p><p>Non recommandé (EASL 2018).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a> ; <a href="https://doi.org/10.1016/j.jhep.2018.03.024" target="_blank" rel="noopener">EASL Clinical Practice Guidelines for the management of patients with decompensated cirrhosis, J Hepatol 2018;69:406-460</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Carvédilol Sandoz®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k74-endoscopie" data-title="Endoscopie de dépistage des varices"><p class="lab">Indication (Baveno VII, 2.19)</p><p>Patient ne pouvant recevoir de bêtabloquant, avec élastographie ≥ 20 kPa ou plaquettes ≤ 150 G/l.</p><p class="lab">Sinon</p><p>Élastographie et plaquettes chaque année (2.20).</p><p class="lab">Sous bêtabloquant</p><p>Non nécessaire (5.17).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-statines" data-title="Statines dans la cirrhose"><p class="lab">Indication</p><p>Indication reconnue : à encourager (Baveno VII, 4.1).</p><p class="lab">Child-Pugh B ou C</p><p>Simvastatine au plus 20 mg/j, surveillance musculaire et hépatique (4.2).</p><p class="lab">Child-Pugh C</p><p>Bénéfice non démontré, usage restrictif.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
<template data-pop="k74-child" data-title="Score de Child-Pugh"><p class="lab">Critères (1, 2 ou 3 points)</p><p>Bilirubine < 2, 2-3, > 3 mg/dl ; albumine > 35, 28-35, < 28 g/l ; INR < 1,7, 1,7-2,3, > 2,3 ; ascite absente, légère, modérée à importante ; encéphalopathie absente, grade 1-2, grade 3-4.</p><p class="lab">Classes</p><p>A : 5-6 ; B : 7-9 ; C : 10-15.</p><p class="lab">Note</p><p>Version usuelle avec INR ; le score original utilisait l’allongement du temps de prothrombine.</p><p class="src">Références : <a href="https://doi.org/10.1002/bjs.1800600817" target="_blank" rel="noopener">Pugh R. N. H. et al., Transection of the oesophagus for bleeding oesophageal varices, Br J Surg 1973;60:646-649 (score de Child-Pugh)</a>.</p></template>
<template data-pop="k74-meld" data-title="Score MELD"><p class="lab">Variables</p><p>Bilirubine, INR, créatinine ; variantes avec sodium (MELD-Na).</p><p class="lab">Usage</p><p>Score pronostique le plus utilisé ; priorisation de la transplantation (EASL 2018).</p><p class="src">Références : <a href="https://doi.org/10.1016/j.jhep.2018.03.024" target="_blank" rel="noopener">EASL Clinical Practice Guidelines for the management of patients with decompensated cirrhosis, J Hepatol 2018;69:406-460</a>.</p></template>
<template data-pop="k74-biopsie" data-title="Biopsie hépatique"><p class="lab">Place</p><p>Démarche individualisée en centre de référence (Baveno VII, 2.7).</p><p class="lab">Indications</p><p>Cause incertaine, discordance des tests non invasifs.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></template>
