<section class="ilot" id="k74-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 61 ans, diabétique de type 2 et en surpoids, boit environ trois verres de vin par jour. Son médecin de famille note des transaminases discrètement élevées et des plaquettes à 138 G/l. Or, il ne se plaint de rien. <b>La question est donc de savoir s’il a une fibrose avancée, voire une cirrhose silencieuse, et si une hypertension portale menace déjà de le décompenser.</b></p><p>Pour répondre à cette question, le médecin doit savoir : calculer le <button class="w" data-k="k74-fib4">score FIB-4</button> et interpréter une <button class="w" data-k="k74-elasto">élastographie impulsionnelle</button> ; reconnaître une <button class="w" data-k="k74-cacld">maladie hépatique chronique avancée compensée</button> ; identifier l’<button class="w" data-k="k74-csph">hypertension portale cliniquement significative</button> sans geste invasif ; supprimer la cause ; enfin, prévenir la <button class="w" data-k="k74-decompensation">décompensation</button> par un <button class="w" data-k="k74-bbns">bêtabloquant</button> non sélectif quand il est indiqué.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="k74-fib4">FIB-4</button> puis <button class="w" data-k="k74-elasto">élastographie</button> pour dépister ; <button class="w" data-k="k74-csph">hypertension portale cliniquement significative</button> pour décider du traitement préventif.</div></section>
<section class="ilot" id="k74-1"><h2><span class="n">1</span>Définition et stades</h2><p>La fibrose est l’accumulation de matrice extracellulaire dans le foie au cours d’une agression chronique ; la cirrhose en est le stade ultime, où des septa fibreux entourent des nodules de régénération. Cependant, la fibrose sévère et la cirrhose forment un continuum chez le patient asymptomatique, et les distinguer cliniquement est souvent impossible. C’est pourquoi Baveno VII retient le terme de <button class="w" data-k="k74-cacld">maladie hépatique chronique avancée compensée</button> (cACLD), défini de façon pragmatique par l’<button class="w" data-k="k74-elasto">élastographie</button> ; de plus, « cACLD » et « cirrhose compensée » sont tous deux acceptés.</p><p>À partir de cette définition, l’évolution se découpe en stades. Ainsi, la cirrhose compensée se définit par l’absence de complication présente ou passée ; elle comporte deux stades, selon l’absence ou la présence d’une hypertension portale cliniquement significative (Baveno VII, 5.1-5.2). En revanche, la <button class="w" data-k="k74-decompensation">décompensation</button> est marquée par une ascite manifeste, une encéphalopathie hépatique manifeste ou une hémorragie variqueuse ; or, ce passage augmente nettement le risque de décès.</p><table class="t"><tr><th>Stade</th><th>Critère</th><th>Enjeu</th></tr><tr><td>Fibrose non avancée</td><td>Élastographie < 8 kPa ou FIB-4 < 1,3</td><td>Traiter la cause, retester</td></tr><tr><td>cACLD sans <button class="w" data-k="k74-csph">hypertension portale significative</button></td><td>Élastographie ≥ 10 kPa ; ≤ 15 kPa avec plaquettes ≥ 150 G/l</td><td>Traiter la cause, surveiller</td></tr><tr><td>cACLD avec hypertension portale significative</td><td>Élastographie ≥ 25 kPa, ou <button class="w" data-k="k74-hvpg">gradient porto-hépatique</button> ≥ 10 mmHg</td><td>Prévenir la décompensation (<button class="w" data-k="k74-bbns">bêtabloquant</button>)</td></tr><tr><td>Cirrhose décompensée</td><td>Ascite, encéphalopathie, hémorragie variqueuse</td><td>Traiter la complication, discuter la transplantation</td></tr></table><figure><img src="data:image/gif;base64,R0lGODdhWALdAYYAAPzFuvunmvqVh/qRdfmGcO+eku6FcbWRkS2Gq/R8ael7aux0ZvN3Wel2WOxvVdt0Yy54mSF5nxp3nRpwle1qWeRpWe1oSuVnSudfTeZdP91nWN1kSdxeTNxaStxbPdNeS7ZgUzBkeSVkfh9pih5kgR5ddhVpjBRjgxRffRZadRBbduJVPdxUPt5OPd1NMdhSPNdLNNBTQdBMPdFPMtBKMNBIL9dEL9FELctEMstDJtA9KMk9J8s4I8oyHsJHM61HOLo8KcI3IrI2JL4wHawvH68pGaYhFCVSYhVSaRBUbhBSZhBOYzVETA9GWHUpICsiJwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWALdAUAI/wBNCBwocILBgwgNSljIsKGEhBATMowQweHEihYzaqSI8SLHjhIoNoyI0ATJkiYVVoT4sSVHBBAoIphJE4JNmy4Xnhxh4sQJFChICOVpcITRo0YJjjBY8GDIjzSjSqX5kqpMqxEgTJ16lavIhwg/gp3QlGnKggTTKtRp8OOEoweXnjSb9uxXhmR7CiURdK9QnyhOGBUhIoSIEnwDp0WRIgUSJElSRG4sWUkSJZiXaG7SRLPnz56VaMZMegnn06hTqz4NenVr1JtZm15Nu7bt27hz666dty7BtRqdalzIsSFG4cOHu2xJfCOCqlujS58uFarXCDNbTuC4PavNrd9r3v+8GaK8+fLj06uHYN4mUrnYr1d/Tr2+/fvFxxZN6lMwz/4A/gTUgAQCFtgJJvDUU4D9EajCgwcyKKF/IxRm3gEYZlhAAAB06OGHABSQYYbnhcDEESimeMRjSJDGYossktZYEpdhRuNlN+aIBGifZWZZjjSSJuSQRI4WpGhLlMbja53NNttuUC6ZWmxTxkalamX19ttBvpVE11ogZZTfRl1lt1x8ZuqHl0oRAPfUcvfFedOIdBZgp50B5KkniHz26eefgH64Z6CE6jkooR7eSWd4M9lE5wEhiphhetZNhVNMbaaVlG+cLkggCg+qwFiopJaqwpFIpBgCCBjeeWcArsb/uiGIespq660ZggACE7ym+JhmOy4RI5FA0vhgjUr2SFqxQtL4mJBLRiutk5tJC9u0oCXr2a/ZQlbsjY5hOxdJWU4wnERjhYQXcWOyK1NH7XaE3FcR6dcdR+mFAEGdiPZ5aKGw3inAwAUYMPDABiSs8MIKK+CwAgkr8MADDVTcgMMPaPDBxh9o4PEGG2zscQUka8yxyBpMnPEHurbcccoqxyzzwgLgeavNAg9ggMQPONwAyBo0YMAAA+cZ66MYwjTepgKNQMJPFHK5YH8J7nfU0wH6hdTTQZVwBBO6PpCwzjRvmKeHsNaK59kdGs22oIYabSvCEU/cMgjlqVjC3iVQ/2ZqEqUaS2qOyya5LGREQqvskC+2uKwS3n4reaiUUda3ZC2OluSzkDfOuY05Vj6j5I8RJCFQPg0kYacDKRjRQOMmtKWWdSFoOoWDtZch2oYWIIDOClhc8cMYy2zyyTHE4MMPPviQfPPQJx+DDNJPL0PzPzAvPcoceMzBB9J3wMILOOBA/cYcfF/99Ml30EH11wMBRPMyvNABB+7nPz30MgS9wP8NqIDH/reACuAvBh/oXgUasACHEfB/FNA <section class="ilot" id="k74-2"><h2><span class="n">2</span>Étiologies et facteurs aggravants</h2><p>Après la définition, la cause oriente toute la suite. Ainsi, les causes principales sont la consommation d’alcool, les hépatites virales chroniques B et C et la maladie stéatosique métabolique ; plus rarement, il s’agit d’une cholangite biliaire primitive, d’une hépatite auto-immune ou d’une maladie génétique. De plus, Baveno VII souligne que le surpoids, l’obésité, le diabète et l’alcool font progresser la maladie même après la suppression de la cause principale (énoncé 3.3).</p><p>Par ailleurs, une agression surajoutée peut précipiter la <button class="w" data-k="k74-decompensation">décompensation</button> : hépatite alcoolique aiguë, hépatite virale aiguë A ou E, poussée d’hépatite B ou atteinte médicamenteuse (énoncé 5.12). En outre, les infections bactériennes sont fréquentes chez le patient avec <button class="w" data-k="k74-csph">hypertension portale significative</button> et peuvent déclencher une décompensation (énoncé 5.10).</p><div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée nationale suisse de prévalence de la cirrhose n’a été retrouvée lors de la rédaction ; aucun chiffre n’est donc avancé.</div><div class="key"><b>À retenir.</b> L’alcool, les virus B et C et la maladie métabolique en sont les causes. Les cofacteurs (obésité, diabète, alcool) se traitent même après la suppression de la cause, car ils entretiennent la fibrose. Une agression surajoutée ou une infection précipitent la décompensation.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a>.</p></section>
<section class="ilot" id="k74-3"><h2><span class="n">3</span>Physiopathologie : de la fibrose à l’hypertension portale</h2><p>Pour comprendre la gravité, il faut suivre la conséquence hémodynamique de la fibrose. Normalement, le sang portal traverse les sinusoïdes avec une faible résistance. Or, la fibrose et les nodules augmentent cette résistance ; dès lors, la pression portale s’élève. Ainsi, un <button class="w" data-k="k74-hvpg">gradient de pression porto-hépatique</button> supérieur à 5 mmHg définit l’hypertension portale sinusoïdale, et un gradient d’au moins 10 mmHg définit l’hypertension portale cliniquement significative (Baveno VII, 1.9-1.10).</p><p>Ensuite, une vasodilatation splanchnique augmente le débit portal, ce qui entretient l’hypertension. Par conséquent, des collatérales porto-systémiques s’ouvrent, dont les varices œsophagiennes ; de plus, l’hypertension portale favorise l’ascite et l’encéphalopathie. Enfin, la réduction de la masse hépatique fonctionnelle altère la synthèse (albumine, facteurs de coagulation) et l’excrétion de la bilirubine.</p><figure><img src="data:image/gif;base64,R0lGODdh4AFnAYUAAObi5ePe4tzf4OjU4tfU2M3Q0+zB2tPD0+GxzcS7zq+1y+ajxeOUus6lwc6bus6RsrejvriTsaSbt46Ytt6Grs+Gq9x3os93oMaDp8V0nLeFprd7nrZxl6N8nYV8nctjj7tii7BiibdRfLQ6a6BZf4Naf5I+Z4okUQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA4AFnAUAI/wBFULjwgUKGAQQGCACQEIAAAQEiSnz4MMCACBxAfPgwQgSIgSdOjBjZ8YIFkSJHcAw5wsLJkSxJnrDAsSVHES9fUhgpYkTImx0/4BQh0oKIDwwuiBTRE4MBAxyEhqiwAYEBBw0eOEDAwIKJEwJ9ZmDg8QLODyc2njwqkuPKDzR9+qTAgCcFECZAMA2hl6RQE3FPZOiQQMCBAogFEFBMIEEErFi1IkDQ4EACCRoeDEDg4MGGEA4MQPAgocFWAw0iRCCx4YHQkRt7emywoELeCyZwZliwgYSDDQ0wnLhQgQSGECQYZAhBOasGyhEacFhOggPlDiUcYKjAQQOEDiY2UP/F8Jt1iBAcSDwmYYIE+gwgSFQ/nyHDdL4genPAoOGxBg0HNABBBB1oUMEF7IlQAQMUtHecR6A10BsJFXB3wQUbbKABBjSJYJ978LW33wMNlEibA7/pJcIFH7oX3gL4VVcfcrs5gJ0G953HwXsc7GhCCPB9YBZy1e1XIXwDcbABBg+QUEIDGlTXwACIVWllASI1uOKCJjTgkEMVSSRmABQ9BAAAltGGQAfy9QRWT24RBRNKKck0p09t <section class="ilot" id="k74-4"><h2><span class="n">4</span>Présentation clinique</h2><p>La démarche commence donc par la recherche d’une maladie souvent muette. En effet, la cirrhose compensée est fréquemment asymptomatique ; elle est alors découverte devant des transaminases anormales, une thrombopénie, une imagerie évocatrice ou une <button class="w" data-k="k74-elasto">élastographie</button> élevée. Cependant, l’examen peut montrer des signes d’insuffisance hépatocellulaire, comme des <button class="w" data-k="k74-angiome">angiomes stellaires</button> ou une érythrose palmaire, et des signes d’hypertension portale, comme une splénomégalie ou une circulation veineuse collatérale abdominale.</p><p>À l’inverse, la <button class="w" data-k="k74-decompensation">décompensation</button> est bruyante : ascite, encéphalopathie, hémorragie digestive, ictère. Par conséquent, l’examen recherche aussi les facteurs de décompensation, notamment une infection, une hépatite alcoolique surajoutée ou une prise médicamenteuse.</p><figure><img src="data:image/gif;base64,R0lGODdhPwEZAoYAAP///////f//+f7///7//Pz//vr//v/+///9///99/z+/f379trq6rnO1rKyqsenfLymiMaidLyigMSec8CddMSeZ8KbZb2ferycd72cbsCWb7yWbb+WX72SXrmcdrmZcbiYb7iUcbmTZrmSXbWXcbWVbrSSaLKSbKiTd7yNareNY7iNWLaMWLONZ7SMXLSLVriHariAaLOIVrODVq6MZ66IWa6CXK2BTqiHYKh/U6KBW5OBa7d4Yq54WLRxXa1vWaV5T6VxTpt5Vpx3TZxwSJNxT4hvV6hmU5pkQ4hoTYtkQHxjTpZXQW9VQ0QuKgYDAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAPwEZAkAI/wADBABAEMCAAQUSKkwIQKDDhxADHJhIsaJFgQQyatzIsaNHjQkPihw5oKDJggdNVhRo8QBBkjBJnmw4cGbBiiNtAmjJ0yXKkjptRpw5MmTMlDZ7VkTAFEFFkyOVSp06MehMozQJLCAQIAECBQQPYMwYEaLGsWQhtmRqsSmCs2XNKgBqku1EkQAUgK1qEGFCA0cPcpT4tC9eugfsXnwrNkBaAmCJzpWZ12BkBQUQagacubPfuRRfRiaIcQDbnTsTU3R8NqMCrqw3FoD8mnBit24pNu35da3T3IlREpyb9OTDAgYMOFjuoIHz59ChM59Ovbr16ihQ7NjOvbt37su17/8w0qSJEyfl0y8x0n1JkyXbs29nH1/8ePfp879fwr8/f <section class="ilot" id="k74-5"><h2><span class="n">5</span>Dépistage de la fibrose avancée en médecine de premier recours</h2><p>Au terme de l’examen, la question est de savoir qui adresser au spécialiste. Ainsi, chez un patient qui a des cofacteurs métaboliques ou une consommation d’alcool, l’EASL 2021 propose de calculer d’abord le <button class="w" data-k="k74-fib4">FIB-4</button>, à partir de l’âge, de l’ASAT, de l’ALAT et des plaquettes. En effet, un FIB-4 inférieur à 1,30 définit un faible risque : le patient reste en premier recours, modifie son mode de vie et sera retesté dans 1 à 3 ans.</p><p>En revanche, un FIB-4 d’au moins 1,30 conduit à une <button class="w" data-k="k74-elasto">élastographie impulsionnelle</button> ou à un test sérique breveté. Par conséquent, une élasticité inférieure à 8 kPa confirme le faible risque, alors qu’une valeur d’au moins 8 kPa justifie l’adresse au spécialiste. De plus, chez le patient atteint de maladie alcoolique, une élastographie inférieure à 8 kPa exclut la fibrose avancée, et une valeur d’au moins 12 à 15 kPa la confirme, après avoir écarté les causes de faux positifs (EASL 2021, recommandations fortes).</p><div class="quiz ui"><p>Le patient du début a un FIB-4 à 2,1. Que faire ?</p><button data-ok="0">Rassurer et retester dans 3 ans</button><button data-ok="1">Élastographie impulsionnelle</button><button data-ok="0">Biopsie hépatique d’emblée</button><p class="fb" hidden>Un FIB-4 ≥ 1,30 n’exclut pas la fibrose avancée ; l’élastographie impulsionnelle est l’étape suivante, et une valeur ≥ 8 kPa conduit au spécialiste (EASL 2021).</p></div><div class="key"><b>À retenir.</b> Un FIB-4 < 1,30 signale un faible risque, et l’on refait le test à 1-3 ans. Un FIB-4 ≥ 1,30 impose une élastographie : sous 8 kPa, le risque est faible, alors qu’à partir de 8 kPa, le patient est adressé au spécialiste.</div><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2021/06/EASL-Clinical-Practice-Guidelines-on-non-invasive-tests-for-evaluation-of-liver-disease-severity-and-prognosis-%E2%80%93-2021-update.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on non-invasive tests for evaluation of liver disease severity and prognosis — 2021 update, J Hepatol 2021;75:659-689</a>.</p></section>
<section class="ilot" id="k74-6"><h2><span class="n">6</span>Reconnaître la cACLD et évaluer le pronostic</h2><p>Chez le spécialiste, l’<button class="w" data-k="k74-elasto">élastographie</button> classe ensuite la maladie. Ainsi, selon Baveno VII, une valeur inférieure à 10 kPa, en l’absence d’autre signe clinique ou d’imagerie, exclut la <button class="w" data-k="k74-cacld">cACLD</button> ; entre 10 et 15 kPa, elle la suggère ; au-delà de 15 kPa, elle la suggère fortement (énoncé 2.4). De plus, un patient en dessous de 10 kPa a un risque de <button class="w" data-k="k74-decompensation">décompensation</button> ou de décès hépatique à 3 ans négligeable, inférieur ou égal à 1 % (énoncé 2.5).</p><p>Cependant, l’élastographie peut donner des faux positifs. C’est pourquoi une première valeur d’au moins 10 kPa doit être répétée à jeun ou complétée par un marqueur sérique, par exemple un <button class="w" data-k="k74-fib4">FIB-4</button> d’au moins 2,67 (énoncé 2.11). Par ailleurs, la <button class="w" data-k="k74-regle5">règle des 5</button> (10, 15, 20, 25 kPa) signale des risques relatifs croissants de décompensation et de décès, quelle que soit la cause (énoncé 2.9). Enfin, l’élastographie peut être répétée tous les 12 mois pour suivre l’évolution (énoncé 2.12).</p><figure><img src="data:image/gif;base64,R0lGODdhWAKQAYUAAODi4tfY2c/R0c7Cs8bHyL7Cxsu7q8S5rMSvm7m6vba2t7mvo7O5v7O0trGztrKysrKyr7Cxs7CxsK+vsrCtqquxt6utr6upqKarsJ6msbiZfKGblpOXoZORjZSGfoaFhJB3cn+Bhnx4dFOBuG1qbTdmol5TVEhKVTZKcDY1OiUoMRJAdBcZHw4NEgkLDwICAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWAKQAUAI/wAfCBxIUGCDgggJSljIMKHDhA0iSpxIsaLFixgzapT4IKKCjwlCJihAkoAAAiYFqFypMoDLlzADsJxpEiVJkiELMNjJs6fPnwwcBK1A1IFRB0STKl3KlCmGpkQxPH0KtarVq1izat3KtavXr2CTSh1LtqzZs2jTqjWbIQOGtnDbrp1bVi7buHjz6t3Lly+HvxwwIrz4sPDAjYgTK/b4sfHHxYsFMmRIYbLlywstaJagufMFC587a45wVAED0yNRqkY5s6UAl69hxj6ZcvXN2zgTAN3Nu/dOoj7DCh9OvLjx41jpKl/OfLldtHKfS+1Lvbpewx0jYi988CHk7+AlOv8eT768go0KMau3vJm96PfwJ8CfT1/0hPv481vIT/T+/glF phie d’un examen d’élastographie impulsionnelle : une soignante gantée applique la sonde sur le flanc droit d’un patient allongé, devant l’écran de l’appareil."><figcaption>Réalisation d’une élastographie impulsionnelle du foie : la sonde est posée dans un espace intercostal droit, et l’appareil mesure la vitesse de propagation d’une onde de cisaillement, convertie en élasticité (kPa). <small>Image : Goleisureintl, Wikimedia Commons, licence CC BY 4.0 (<a href="https://commons.wikimedia.org/wiki/File:Liver_Transient_Elastography_(FibroScan)_result_showing_Liver_Stiffness_Measurement_(LSM)_and_Controlled_Attenuation_Parameter_(CAP).jpg" target="_blank" rel="noopener">source</a>), adaptée en GIF.</small></figcaption></figure><div class="key"><b>À retenir.</b> Sous 10 kPa, la cACLD est exclue et le risque à 3 ans est ≤ 1 % ; entre 10 et 15 kPa, elle est suggérée, et au-delà de 15 kPa, fortement suggérée. Une valeur ≥ 10 kPa se confirme à jeun ou par un FIB-4 ≥ 2,67, et la règle des 5 gradue le risque.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">de Franchis R. et al., Baveno VII — Renewing consensus in portal hypertension, J Hepatol 2022;76:959-974</a> ; <a href="https://easl.eu/wp-content/uploads/2021/06/EASL-Clinical-Practice-Guidelines-on-non-invasive-tests-for-evaluation-of-liver-disease-severity-and-prognosis-%E2%80%93-2021-update.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on non-invasive tests for evaluation of liver disease severity and prognosis — 2021 update, J Hepatol 2021;75:659-689</a>.</p></section>
