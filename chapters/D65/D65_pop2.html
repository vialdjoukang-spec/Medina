<template data-pop="d65-tih" data-title="TIH : une complication qui garde son diagnostic propre"><p>La thrombopénie induite par l’héparine est une complication à considérer devant une chute des plaquettes dans un contexte d’exposition. Le tableau ne doit pas être automatiquement attribué à la <button class="w" data-k="d65-classification">CIVD</button>. La <button class="w" data-k="d65-fi">FI</button> contre-indique l’héparine en présence d’une <button class="w" data-k="d65-tih">TIH</button> actuelle ou antérieure. Le diagnostic et la conduite nécessitent une évaluation spécialisée ; les anciennes formulations de tests ou de réexposition ne sont pas recopiées comme protocole actuel.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></template>
<template data-pop="d65-sofa" data-title="SOFA dans le SIC : seulement quatre domaines retenus"><p>La composante <button class="w" data-k="d65-sofa">SOFA</button> du score <button class="w" data-k="d65-sic">SIC</button> rassemble les domaines respiratoire, cardiovasculaire, hépatique et rénal. Une somme de 0 vaut 0 point dans cette composante, 1 vaut 1 point et≥2 vaut 2 points. Il faut d’abord attribuer correctement les domaines selon leurs définitions cliniques complètes. Cette fenêtre ne prétend pas remplacer toute l’évaluation <button class="w" data-k="d65-sofa">SOFA</button> et ne permet pas d’inventer des données manquantes.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></template>
<template data-pop="d65-net" data-title="NETs : un lien entre immunité et coagulation"><p>Les réseaux extracellulaires des neutrophiles contiennent notamment de l’ADN et des protéines. La revue 2025 décrit leurs interactions avec l’endothélium et la coagulation, ainsi que le rôle des histones dans plusieurs étapes d’activation. Ce mécanisme aide à comprendre la diffusion du processus inflammatoire. Il ne signifie pas qu’un dosage de <button class="w" data-k="d65-net">NETs</button> soit un examen de routine universel ni qu’une cible biologique valide à elle seule un médicament.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></template>
<template data-pop="d65-tfpi" data-title="TFPI : un frein de la voie du facteur tissulaire"><p>Le <button class="w" data-k="d65-tfpi">TFPI</button> est l’inhibiteur de la voie du facteur tissulaire. Il participe au contrôle de l’initiation de la coagulation, en complément des autres mécanismes anticoagulants. Dans un processus inflammatoire diffus, ces freins et leur environnement endothélial peuvent être perturbés. Connaître ce mécanisme ne constitue pas une indication thérapeutique indépendante.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></template>
<template data-pop="d65-transfusion" data-title="Transfusion : identité, surveillance et réaction"><p>Vérifier la personne, le produit et la concordance des informations selon la procédure locale. Surveiller l’administration et relier tout symptôme à sa chronologie. Une réaction suspectée impose l’arrêt, l’alerte et la conservation des éléments nécessaires à l’enquête selon le centre. La traçabilité et l’hémovigilance ne sont pas remplacées par une amélioration du chiffre d’hémoglobine ou de plaquettes.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S716] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></template>
<template data-pop="d65-taco-trali" data-title="Dyspnée après transfusion : plusieurs mécanismes"><p>Le <button class="w" data-k="d65-taco-trali">TACO</button> correspond à une surcharge circulatoire associée à la transfusion. Le <button class="w" data-k="d65-taco-trali">TRALI</button> correspond à une atteinte pulmonaire aiguë associée à la transfusion, avec une logique différente de la surcharge. Les définitions et l’enquête Swissmedic 2024 sont datées et contextualisées. Une détresse respiratoire chez un patient atteint de <button class="w" data-k="d65-classification">CIVD</button> ne peut pas être attribuée automatiquement à l’un de ces mécanismes ; elle exige une évaluation urgente.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S716] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S715] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></template>
<template data-pop="d65-rein" data-title="Une table rénale ne supprime pas une contre-indication"><p>La <button class="w" data-k="d65-fi">FI</button> du <button class="w" data-k="d65-txa">TXA</button> contre-indique l’insuffisance rénale grave et présente par ailleurs un tableau d’adaptation. Cette tension ne doit pas être résolue en fabriquant une ordonnance simplifiée pour une personne sévèrement insuffisante rénale. L’indication, les contre-indications et l’expertise clinique restent prioritaires ; l’évolution des organes fait partie du suivi de la <button class="w" data-k="d65-classification">CIVD</button>.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></template>
<template data-pop="d65-apl" data-title="Leucémie promyélocytaire : une urgence distincte"><p>La leucémie aiguë promyélocytaire peut s’accompagner d’une coagulopathie sévère et nécessite une prise en charge hématologique urgente. Le texte Onkopedia consulté décrit une surveillance rapprochée, avec des objectifs de fibrinogène 100–150 mg/dL et de plaquettes 30–50 G/L dans ce contexte. Il ne démontre pas un bénéfice des anticoagulants ou antifibrinolytiques prophylactiques. Ces nombres et cette conduite ne s’appliquent pas à toute <button class="w" data-k="d65-classification">CIVD</button>.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S712] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></template>
<template data-pop="d65-causes" data-title="Une même étiquette, des causes différentes"><p>Sepsis, traumatisme, complications obstétricales et cancers peuvent déclencher une activation systémique de coagulation. Le contexte influence la fibrinolyse, le risque hémorragique et la conduite. L’absence de chiffre national suisse D65 dans ce dossier est une lacune explicite ; elle n’est pas remplacée par un pourcentage de réanimation ou une série tumorale étrangère.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://www.revmed.ch/view/430207/3709751/RMS_607_1021.pdf" target="_blank" rel="noopener">[S711] Anémies hémolytiques et cancers</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></template>
<template data-pop="d65-profiles" data-title="Cadre suisse de formation et limites de l’exercice"><p>Les documents <button class="w" data-k="d65-profiles">PROFILES</button> et les exigences suisses de l’examen structurent le raisonnement clinique et les compétences attendues. Reconnaître une urgence, interpréter des examens et justifier une décision sont les objectifs pédagogiques ici. Les cas sont fictifs et ne prédisent pas les questions de l’examen. Le cours ne revendique ni note médicale certifiée ni validation humaine indépendante.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S720] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S721] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S722] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></div></template>

<template data-pop="pareto-d65-cours" data-title="Loi de Pareto — Monographie"><p>Repères à replacer dans leur contexte, avec les limites du cours.</p><ul><li>Cause compatible et syndrome dynamique.</li><li>Thrombose et saignement peuvent coexister.</li><li>Score contextualisé ; urgence traitée sans attendre.</li><li>Produit choisi selon indication et risque.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a>.</p></div></template>
<template data-pop="pareto-d65-examens" data-title="Loi de Pareto — Examens"><p>Repères à replacer dans leur contexte, avec les limites du cours.</p><ul><li>Plaquettes, <button class="w" data-k="d65-pt-inr">PT</button> en secondes, fibrinogène et D-dimères.</li><li>Méthode, unité, référence et heure documentées.</li><li>Frottis et organes pour questions distinctes.</li><li>Réévaluer après traitement sans confondre chiffre et guérison.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-hemostase/analyses-routine" target="_blank" rel="noopener">[S705] Laboratoire d’hémostase : analyses de routine</a>.</p></div></template>
<template data-pop="pareto-d65-pharma" data-title="Loi de Pareto — Pharmacologie"><p>Repères à replacer dans leur contexte, avec les limites du cours.</p><ul><li>Fibrinogène : déficit et cible contextualisés.</li><li><button class="w" data-k="d65-heparine">HNF</button> : pas de traitement universel de <button class="w" data-k="d65-classification">CIVD</button>.</li><li>Antithrombine : indication héréditaire conservée.</li><li><button class="w" data-k="d65-txa">TXA</button> : majorité des <button class="w" data-k="d65-classification">CIVD</button> exclue, exception spécialisée.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680502030014" target="_blank" rel="noopener">[S707] Haemocomplettan P 1 g/2 g</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680462400506" target="_blank" rel="noopener">[S709] Héparine Bichsel 417/1000/5000 UI/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680469280019" target="_blank" rel="noopener">[S708] Kybernin P 500/1000</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S710] Tranexamic Acid Leman, solution injectable 100 mg/mL</a>.</p></div></template>
<template data-pop="pareto-d65-semio" data-title="Loi de Pareto — Sémiologie"><p>Repères à replacer dans leur contexte, avec les limites du cours.</p><ul><li>Chercher saignement et souffrance d’organe.</li><li>Relier signe, mécanisme, examen et décision.</li><li>Conserver les diagnostics associés possibles.</li><li>Les urgences ne dépendent pas d’un total de points.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://doi.org/10.1016/j.jtha.2025.03.038" target="_blank" rel="noopener">[S703] Updated definition and scoring of disseminated intravascular coagulation in 2025</a>.</p></div></template>
<template data-pop="pareto-d65-anat" data-title="Loi de Pareto — Anatomie"><p>Repères à replacer dans leur contexte, avec les limites du cours.</p><ul><li>Circulation sanguine et tissus ont des fonctions distinctes.</li><li>L’endothélium participe à la régulation.</li><li>Microcirculation et organes expliquent la surveillance.</li><li>Une image du sang ne montre pas une atteinte d’organe.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://wellcomecollection.org/works/uuk6yhjd" target="_blank" rel="noopener">[S725] SEM of platelets and red blood corpuscle</a>.</p></div></template>
<template data-pop="pareto-d65-histo" data-title="Loi de Pareto — Histologie"><p>Repères à replacer dans leur contexte, avec les limites du cours.</p><ul><li>Le frottis décrit une morphologie.</li><li>Schizocytes ne signifie pas diagnostic unique.</li><li>Numération et photographie ne sont pas interchangeables.</li><li>Décrire seulement ce qui est effectivement visible.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12143096/" target="_blank" rel="noopener">[S704] Disseminated intravascular coagulation : pathophysiology, diagnosis and management</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S719] Human blood smear — Кров людини</a>.</p></div></template>
