<section class="ilot" id="k50-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 24 ans, fumeur, souffre depuis quatre mois de diarrhée sans sang, de douleurs de la fosse iliaque droite et d’un amaigrissement de 6 kg. Or, sa CRP est à 38 mg/l et sa <button class="w" data-k="k50-calpro">calprotectine fécale</button> très élevée. <b>La question est donc de savoir s’il a une maladie de Crohn, quelle en est l’étendue et le phénotype, et quel traitement proposer d’emblée.</b></p><p>Pour y répondre, le médecin doit savoir : confirmer le diagnostic par l’<button class="w" data-k="k50-ileocolo">iléocoloscopie avec biopsies</button> et l’imagerie du grêle ; classer la maladie selon la <button class="w" data-k="k50-montreal">classification de Montréal</button> ; choisir entre <button class="w" data-k="k50-d-budesonide">budésonide</button>, <button class="w" data-k="k50-cs">corticoïdes systémiques</button> et traitements avancés ; enfin, suivre une stratégie <button class="w" data-k="k50-t2t">« treat-to-target »</button> fondée sur des marqueurs objectifs.</p><div class="key"><b>Point de départ.</b> Diarrhée chronique, douleur de la fosse iliaque droite, amaigrissement et calprotectine élevée chez un jeune : penser maladie de Crohn.</div></section>
<section class="ilot" id="k50-1"><h2><span class="n">1</span>Définition</h2><p>La maladie de Crohn est une maladie inflammatoire chronique de l’intestin, qui évolue par poussées et rémissions. Ainsi, elle peut toucher tout le tube digestif, de la bouche à l’anus, avec une prédilection pour l’iléon terminal et le côlon. De plus, l’inflammation est <button class="w" data-k="k50-transmurale">transmurale</button> et segmentaire, avec des intervalles de muqueuse saine ; c’est pourquoi elle se complique de sténoses, de fistules et d’abcès.</p><p>Par opposition, la rectocolite hémorragique (K51) est limitée à la muqueuse du côlon et s’étend de façon continue depuis le rectum. Par conséquent, la CIM-10-GM classe la maladie de Crohn selon la localisation : intestin grêle (K50.0), gros intestin (K50.1), atteinte combinée (K50.8) et forme non précisée (K50.9).</p><table class="t"><tr><th>Caractère</th><th>Maladie de Crohn</th><th>Rectocolite hémorragique</th></tr><tr><td>Localisation</td><td>Tout le tube digestif, surtout iléon terminal</td><td>Rectum et côlon</td></tr><tr><td>Distribution</td><td>Segmentaire, discontinue</td><td>Continue depuis le rectum</td></tr><tr><td>Profondeur</td><td>Transmurale</td><td>Muqueuse</td></tr><tr><td>Granulomes</td><td>Possibles (non nécrosants)</td><td>Absents</td></tr><tr><td>Atteinte périanale</td><td>Fréquente (fistules, abcès)</td><td>Rare</td></tr></table><p>Le tableau se lit ligne par ligne : en effet, chaque critère oriente, mais aucun ne suffit seul, si bien que le diagnostic repose sur leur ensemble.</p><div class="key"><b>À retenir.</b> Inflammation chronique, transmurale, segmentaire, de la bouche à l’anus ; sténoses, fistules, abcès ; <button class="w" data-k="k50-granulome">granulome</button>s non nécrosants possibles.</div><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a> ; <a href="https://doi.org/10.1136/gut.2005.082909" target="_blank" rel="noopener">Satsangi J. et al., The Montreal classification of inflammatory bowel disease, Gut 2006;55:749-753</a>.</p></section>
<section class="ilot" id="k50-2"><h2><span class="n">2</span>Épidémiologie et facteurs de risque</h2><p>Après la définition, il faut situer le patient. Ainsi, la maladie débute le plus souvent chez l’adolescent et l’adulte jeune, mais elle peut apparaître à tout âge, y compris après 60 ans. De plus, elle résulte de l’interaction entre une susceptibilité génétique, un microbiote intestinal altéré et des facteurs d’environnement. Parmi ces derniers, le tabagisme est un facteur de risque reconnu, qui aggrave aussi l’évolution ; c’est pourquoi l’arrêt du tabac fait partie du traitement.</p><p>Par ailleurs, une maladie de Crohn colique étendue et ancienne augmente le risque de cancer colorectal, et une atteinte du grêle expose au cancer du grêle. En outre, la maladie s’accompagne volontiers de <button class="w" data-k="k50-mei">manifestations extra-intestinales</button>, articulaires, cutanées, oculaires ou hépatobiliaires.</p><div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée suisse d’incidence vérifiée n’a été retrouvée dans les sources lues ; aucun chiffre n’est donc avancé.</div><div class="key"><b>À retenir.</b> Adulte jeune surtout ; gènes, microbiote, environnement ; tabac : risque et aggravation ; manifestations extra-intestinales fréquentes.</div><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></section>
<section class="ilot" id="k50-3"><h2><span class="n">3</span>Physiopathologie</h2><p>Pour comprendre les traitements, il faut suivre la cascade immunitaire. D’abord, une barrière épithéliale défaillante laisse passer des antigènes bactériens ; or, chez le sujet prédisposé, l’immunité innée, par exemple par les variants du gène <button class="w" data-k="k50-nod2">NOD2</button>, répond de façon inadaptée. Ensuite, les lymphocytes T auxiliaires de type 1 et 17 s’activent sous l’effet des interleukines 12 et 23, et produisent du <button class="w" data-k="k50-tnf">TNF-α</button> et d’autres cytokines.</p><p>Par conséquent, chaque cible thérapeutique correspond à un maillon de cette cascade. Ainsi, les anti-TNF neutralisent le TNF-α ; l’<button class="w" data-k="k50-d-ustekinumab">ustékinumab</button> bloque la sous-unité p40 commune aux interleukines 12 et 23, et le <button class="w" data-k="k50-d-risankizumab">risankizumab</button> la sous-unité p19 de l’interleukine 23 ; le <button class="w" data-k="k50-d-vedolizumab">védolizumab</button> empêche l’intégrine α4β7 de guider les lymphocytes vers l’intestin ; enfin, l’<button class="w" data-k="k50-d-upadacitinib">upadacitinib</button> inhibe la signalisation intracellulaire par JAK-1.</p><div class="key"><b>À retenir.</b> Barrière défaillante + immunité innée inadaptée (NOD2) → lymphocytes Th1/Th17, IL-12/23, TNF-α → inflammation <button class="w" data-k="k50-transmurale">transmurale</button> ; chaque biothérapie cible un maillon.</div><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></section>
<section class="ilot" id="k50-4"><h2><span class="n">4</span>Présentation clinique</h2><p>La présentation dépend donc de la localisation et du phénotype. Ainsi, l’atteinte iléale typique associe une diarrhée chronique, des douleurs de la fosse iliaque droite, parfois une masse, un amaigrissement et une fièvre ; à l’inverse, l’atteinte colique peut donner une diarrhée sanglante qui imite la rectocolite. De plus, la <button class="w" data-k="k50-perianal">maladie périanale</button> se manifeste par des fissures, des fistules ou des abcès, parfois révélateurs.</p><p>Par ailleurs, l’évolution <button class="w" data-k="k50-transmurale">transmurale</button> explique les complications. En effet, une sténose provoque des douleurs postprandiales et un syndrome occlusif, alors qu’une fistule peut relier l’intestin à la peau, à la vessie ou à un autre segment digestif. Enfin, l’examen recherche une dénutrition, une anémie et des <button class="w" data-k="k50-mei">manifestations extra-intestinales</button>.</p><figure><img src="data:image/gif;base64,R0lGODdhtQF2AYUAAPr09Pv15fns3fbYtPvDoPq1mfG6mOC6oPeslvekkvWnhvWfh+qnj+mlfOGledKkffiZh+6ZhvaXfeyXfPWRfPSMd+qQeuqLdOGWguCUc+CMeeCKb9aWcNaKdM6Pbr2PdeqFcN2Fb+Z9adx8Z9SEc9SCadN7a9N4Ysp/cMl+Y8h2acl1YMB8ZsBzY7l3Zah5aMptXbxtXrFtYLBrV7tmV6plVq9gUq9WS5xkV5pVTI5YTnxUS4BCPmowMjYaIBQCESwAAAAAtQF2AUAI/wB78ODRQwdBgj0SChSIcKHChxAHSpyYo2JFHDx07Bgg4AEOHDpkzKghQwaOFzhcuJihksUHFi4+fEDhoYOHmxw4YGDAAINPDBEi/OQpFOiCoBF4MkCAgIEBAwWiMlV64ABHAQGwdvxwwECCBBAgUKhAVoJZChYoSBBLoW2FCxXUWrhgYS0ECRTCir2QN2wECxYiLBicYIHeu3kjTJgQNi5gpGEnLGAq9avlo4fv2oXwl65etBYmIA0KYYHlwqZPg0Wt4CtTBAYIDJhNm8CDqxwHEDCgVHBhpF95tmb6dTCECRc2bPAswcKGECDSor0Agi7g68lDaA9RYrt3EyZOmP8oUYJEhxMrVown34EEefYaSIBXYYKEfRQqWqhAgX8//hYABthCSTIIOKAMNdiQgw01NCiDSi4gWMNHFOJgkQ4Y+rARAAf44ENDCIXIEEQPTWTiQDncYFFFOwggQFUwWvXBCw8IMMALL8hk4wsHvPhAVQ/w5NMDRAap1JFIJsnTVLsZYJWLWAUQAABUVkklVlQeQOMBCBQnAVlxhdWWmHhVAAJZY4HZ1lmZ6UVaWGC1CRgFb6IVFGBw0UkaUnNVoNdXfvXpFgiEimDoCCPkZQGhFkCQQJdvlmbaAhIkIJtuEag5JgQMRNAmW21RcM <section class="ilot" id="k50-5"><h2><span class="n">5</span>Démarche diagnostique</h2><p>Devant ce tableau, le diagnostic repose sur un faisceau d’arguments cliniques, biologiques, endoscopiques, histologiques et radiologiques. D’abord, la biologie mesure l’inflammation (CRP) et les carences, et la <button class="w" data-k="k50-calpro">calprotectine fécale</button> distingue une inflammation intestinale d’un trouble fonctionnel. De plus, une infection doit être exclue par des coprocultures et la recherche de Clostridioides difficile.</p><p>Ensuite, l’<button class="w" data-k="k50-ileocolo">iléocoloscopie</button> est l’examen central : en effet, elle visualise l’iléon terminal et le côlon et permet des biopsies étagées, au moins deux par segment, dans l’iléon et dans cinq sites coliques dont le rectum (ECCO-ESGAR 2019). Par ailleurs, l’atteinte du grêle et les complications pénétrantes sont évaluées par l’<button class="w" data-k="k50-ire">entéro-IRM</button> ou par l’échographie intestinale, qui évitent l’irradiation. Enfin, une gastroscopie est discutée en cas de symptômes digestifs hauts.</p><figure><img src="data:image/gif;base64,R0lGODdhzAExAoUAANTU1Kenp5KRkYODg3p4eXFxcWpqamRkZGJfYFtbW1ZWVlFSUk5OTktLS09EREREREBAQDw8PDk5OTc2NjMzMzAxMC0tLSkpKScmJyMkI0cbGx4eHhwcHBoZGhgZGRYXFhQUFBESEg8PDw0NDQoKCggHBwUGBgQEBAICAgMBAgEBAQEBAAABAgIAAgAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAzAExAkAI/wBfCBxIsKDBgwgTKlxoUIWKFw4dMpyoEEWJESJAfOCwIYPHDBs4iPQAomTJDx46cPR4oeUFCzBjVqhAoeYECThz4ozAs2eEnBOCBq1ZcyaFmUhpEk3K1ObOCBCiRoXqsyfOoRVgtvwIcoNXr1zDis3AwcOHDyBCjCBR4gQKFA8Tqnhrom4JEhhNhhCxtoSJtxQhEjQRwgOGmxUyfCjxAm7DuIEjS55MubLly5gPzn174m5byJklQrQ4IoTGlBxFqlYdsmMGDDCZIiVKIahOnVWt4s7987ZvCUKD5+ztO7ht4Dd/K7+dW6rUB9CjN5hOnToD6tGnAs96AQPIDh3Q7v/t69fEifPnUUiOiDcDBAUIChxoQOGDicYvTHggCWIEXMegZSbggJNFJBqBCCZoEAokkHDCX3I1dlFGp+23mmthYYBBSzFZMJtTEvTkHATRQVddA9dh98CIUkHVolXE3SZciCxCAKOIJNYYI0812shjVA9Ux8ACRC6ggAIJJKmkkkcqsEADEEhAwQVkfcAXW3W5FeBAnKHnmGCBWSQCBu8ZQMA  du côlon</button><button data-ok="0">Calprotectine fécale seule</button><p class="fb" hidden>La calprotectine oriente, l’imagerie précise l’étendue, mais l’iléocoloscopie avec biopsies étagées est l’examen diagnostique de référence (ECCO-ESGAR 2019).</p></div><div class="key"><b>À retenir.</b> CRP, calprotectine, coprocultures et C. difficile ; iléocoloscopie avec biopsies étagées ; entéro-IRM ou échographie pour le grêle et les complications.</div><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a>.</p></section>
<section class="ilot" id="k50-6"><h2><span class="n">6</span>Classer la maladie : Montréal</h2><p>Le diagnostic posé, la maladie est classée, car le phénotype guide le pronostic et le traitement. Ainsi, la <button class="w" data-k="k50-montreal">classification de Montréal</button> décrit l’âge au diagnostic (A), la localisation (L) et le comportement (B), avec le suffixe « p » pour une atteinte périanale. Or, le comportement évolue avec le temps : une maladie initialement inflammatoire peut devenir sténosante ou pénétrante.</p><table class="t"><tr><th>Axe</th><th>Catégories</th></tr><tr><td>Âge (A)</td><td>A1 : ≤ 16 ans ; A2 : 17-40 ans ; A3 : > 40 ans</td></tr><tr><td>Localisation (L)</td><td>L1 : iléale ; L2 : colique ; L3 : iléocolique ; L4 : tractus digestif haut (ajouté à L1-L3)</td></tr><tr><td>Comportement (B)</td><td>B1 : ni sténosant ni pénétrant ; B2 : sténosant ; B3 : pénétrant ; p : atteinte périanale</td></tr></table><p>Par exemple, le patient du début, âgé de 24 ans, avec une atteinte de l’iléon terminal sans sténose, est classé A2 L1 B1 ; en revanche, l’apparition d’une fistule le ferait passer en B3.</p><div class="key"><b>À retenir.</b> Montréal : âge A1-A3, localisation L1-L4, comportement B1-B3, suffixe p ; le comportement évolue vers la sténose ou la pénétration.</div><p class="src">Références : <a href="https://doi.org/10.1136/gut.2005.082909" target="_blank" rel="noopener">Satsangi J. et al., The Montreal classification of inflammatory bowel disease, Gut 2006;55:749-753</a>.</p></section>
