<template data-pop="pareto-k50-clinique" data-title="Loi de Pareto — Maladie de Crohn"><p class="ratio" data-cover="k50-1,k50-5,k50-6,k50-7,k50-8,k50-9,k50-10"></p><ul><li>Transmurale, segmentaire, de la bouche à l’anus.</li><li>Iléocoloscopie avec biopsies étagées ; entéro-IRM.</li><li>Montréal : A, L, B, p.</li><li>« Treat-to-target » : calprotectine et CRP.</li><li>Légère iléale : budésonide ; pas de 5-ASA.</li><li>Modérée à sévère : biothérapie ou upadacitinib ; corticoïdes en induction seulement.</li><li>Abcès drainé avant immunosuppression.</li></ul></template>
<template data-pop="pareto-k50-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k50-e-1,k50-e-2"></p><ul><li>Calprotectine : inflammation ou trouble fonctionnel.</li><li>Iléocoloscopie : ≥ 2 biopsies par segment, iléon et 5 sites coliques.</li><li>Entéro-IRM : grêle, sténoses, fistules.</li><li>Granulome non nécrosant : évocateur, inconstant.</li></ul></template>
<template data-pop="pareto-k50-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k50-p-1,k50-p-2,k50-p-3"></p><ul><li>Pas de 5-ASA dans la maladie de Crohn.</li><li>Corticoïdes : induction, jamais entretien.</li><li>Infliximab + thiopurine ≥ 6-12 mois.</li><li>Tuberculose et hépatite B dépistées avant biothérapie.</li><li>TPMT/NUDT15 avant azathioprine.</li></ul></template>
<template data-pop="k50-calpro" data-title="Calprotectine fécale"><p class="lab">Nature</p><p>Protéine des polynucléaires neutrophiles, dosée dans les selles.</p><p class="lab">Usage</p><p>Distinguer inflammation intestinale et trouble fonctionnel ; suivre la réponse (« treat-to-target »).</p><p class="lab">Limite</p><p>Élevée aussi dans les infections, les AINS, les néoplasies.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-ileocolo" data-title="Iléocoloscopie avec biopsies"><p class="lab">Technique</p><p>Exploration du côlon et de l’iléon terminal.</p><p class="lab">Biopsies (ECCO-ESGAR 2019)</p><p>Au moins 2 par segment, dans l’iléon et 5 sites coliques dont le rectum.</p><p class="lab">Signes</p><p>Ulcères aphtoïdes ou profonds, discontinus ; aspect pavimenteux ; sténoses.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a>.</p></template>
<template data-pop="k50-ire" data-title="Entéro-IRM"><p class="lab">Usage</p><p>Étendue de l’atteinte du grêle, sténoses, fistules, abcès.</p><p class="lab">Avantage</p><p>Pas d’irradiation chez des patients jeunes, souvent réexaminés.</p><p class="lab">Alternative</p><p>Échographie intestinale.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a>.</p></template>
<template data-pop="k50-montreal" data-title="Classification de Montréal"><p class="lab">Âge</p><p>A1 ≤ 16 ans ; A2 17-40 ans ; A3 > 40 ans.</p><p class="lab">Localisation</p><p>L1 iléale ; L2 colique ; L3 iléocolique ; L4 haute.</p><p class="lab">Comportement</p><p>B1 inflammatoire ; B2 sténosant ; B3 pénétrant ; p : périanal.</p><p class="src">Références : <a href="https://doi.org/10.1136/gut.2005.082909" target="_blank" rel="noopener">Satsangi J. et al., The Montreal classification of inflammatory bowel disease, Gut 2006;55:749-753</a>.</p></template>
<template data-pop="k50-transmurale" data-title="Inflammation transmurale"><p class="lab">Définition</p><p>Atteinte de toute l’épaisseur de la paroi, de la muqueuse à la séreuse.</p><p class="lab">Conséquences</p><p>Sténoses, fistules, abcès.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a>.</p></template>
<template data-pop="k50-mei" data-title="Manifestations extra-intestinales"><p class="lab">Exemples</p><p>Arthrites périphériques et axiales, érythème noueux, pyoderma gangrenosum, uvéite, épisclérite, cholangite sclérosante primitive.</p><p class="lab">Portée</p><p>Influencent le choix du traitement (ECCO 2024).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-perianal" data-title="Maladie périanale"><p class="lab">Lésions</p><p>Fissures, fistules, abcès, sténose anale.</p><p class="lab">Classification</p><p>Suffixe « p » de Montréal.</p><p class="lab">Traitement</p><p>Drainage (séton) et anti-TNF.</p><p class="src">Références : <a href="https://doi.org/10.1136/gut.2005.082909" target="_blank" rel="noopener">Satsangi J. et al., The Montreal classification of inflammatory bowel disease, Gut 2006;55:749-753</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-nod2" data-title="Gène NOD2"><p class="lab">Rôle</p><p>Récepteur intracellulaire de fragments bactériens (immunité innée).</p><p class="lab">Lien</p><p>Variants associés à la maladie de Crohn iléale.</p></template>
<template data-pop="k50-tnf" data-title="TNF-α"><p class="lab">Nature</p><p>Cytokine pro-inflammatoire majeure.</p><p class="lab">Cible</p><p>Infliximab, adalimumab, certolizumab.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-t2t" data-title="Stratégie « treat-to-target »"><p class="lab">Principe</p><p>Fixer une cible objective, la mesurer régulièrement et ajuster le traitement si elle n’est pas atteinte.</p><p class="lab">Cibles</p><p>Normalisation de la calprotectine ou de la CRP, cicatrisation endoscopique (STRIDE-II).</p><p class="lab">Niveau</p><p>Recommandée par l’ECCO 2024 (consensus 97 %).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a> ; <a href="https://doi.org/10.1053/j.gastro.2020.12.031" target="_blank" rel="noopener">Turner D. et al., STRIDE-II, Gastroenterology 2021;160:1570-1583</a>.</p></template>
<template data-pop="k50-mdt" data-title="Équipe multidisciplinaire"><p class="lab">Membres</p><p>Gastroentérologue, chirurgien, radiologue, pathologiste, infirmière spécialisée, diététicien, psychologue.</p><p class="lab">Niveau</p><p>Recommandée par l’ECCO 2024 (consensus 97 %).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-5asa" data-title="5-ASA (mésalazine)"><p class="lab">ECCO 2024</p><p>Non recommandé pour l’induction (recommandation forte) ni pour l’entretien (recommandation forte).</p><p class="lab">Remarque</p><p>Efficace dans la rectocolite hémorragique, pas dans la maladie de Crohn.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-nee" data-title="Nutrition entérale exclusive"><p class="lab">Place</p><p>Induction chez le patient motivé, avec soutien diététique, qui veut éviter les corticoïdes (recommandation faible).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-cs" data-title="Corticoïdes systémiques"><p class="lab">Place</p><p>Induction de la forme modérée à sévère (recommandation faible).</p><p class="lab">Jamais</p><p>En entretien.</p><p class="lab">Risques</p><p>Infections, ostéoporose, diabète, dépendance aux corticoïdes.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-thiopurines" data-title="Thiopurines"><p class="lab">Molécules</p><p>Azathioprine, 6-mercaptopurine.</p><p class="lab">Place</p><p>Entretien (recommandation faible) ; pas d’induction (recommandation forte contre) ; association à l’infliximab ≥ 6-12 mois.</p><p class="lab">Avant</p><p>TPMT ou NUDT15.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Imurek®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k50-tpmt" data-title="Thiopurine méthyltransférase (TPMT)"><p class="lab">Rôle</p><p>Enzyme qui inactive une partie des thiopurines.</p><p class="lab">Déficit</p><p>Aplasie médullaire rapide sous azathioprine (FI Imurek®).</p><p class="lab">Conduite</p><p>Activité ou génotype avant traitement ; NUDT15 aussi.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Imurek®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k50-granulome" data-title="Granulome épithélioïde non nécrosant"><p class="lab">Aspect</p><p>Amas d’histiocytes épithélioïdes sans nécrose caséeuse.</p><p class="lab">Valeur</p><p>Évocateur, inconstant ; éliminer tuberculose et autres granulomatoses.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a>.</p></template>
<template data-pop="k50-resection" data-title="Iléocæcectomie"><p class="lab">Indication</p><p>Maladie iléale limitée, sténose fibreuse, échec médical ; à discuter tôt en équipe.</p><p class="lab">Suite</p><p>Prévention et contrôle endoscopique de la récidive postopératoire.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-budesonide" data-title="Budésonide (Entocort CIR®)"><p class="lab">Indication suisse</p><p>Induction et maintien de la rémission des poussées légères à modérées avec atteinte de l’iléon terminal et du côlon proximal.</p><p class="lab">Dose</p><p>9 mg/j 8 semaines ; entretien 6 mg/j ; réduction progressive.</p><p class="lab">ECCO 2024</p><p>Recommandation forte pour l’induction iléale ou du côlon ascendant.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Entocort CIR®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-infliximab" data-title="Infliximab (Remicade®)"><p class="lab">Indication suisse</p><p>Maladie de Crohn active modérée à sévère après échec du traitement conventionnel ; forme fistulisante sévère.</p><p class="lab">Schéma</p><p>5 mg/kg IV semaines 0, 2, 6, puis toutes les 8 semaines.</p><p class="lab">Contre-indications</p><p>Tuberculose ou infection sévère, insuffisance cardiaque NYHA III-IV.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Remicade®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-ustekinumab" data-title="Ustékinumab"><p class="lab">Cible</p><p>Sous-unité p40 des interleukines 12 et 23.</p><p class="lab">Schéma (ECCO 2024)</p><p>≈ 6 mg/kg IV, puis 90 mg SC toutes les 8 semaines.</p><p class="lab">Place</p><p>Induction et entretien (recommandation forte).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-risankizumab" data-title="Risankizumab"><p class="lab">Cible</p><p>Sous-unité p19 de l’interleukine 23.</p><p class="lab">Induction (ECCO 2024)</p><p>600 mg IV semaines 0, 4, 8.</p><p class="lab">Place</p><p>Induction et entretien (recommandation forte).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-vedolizumab" data-title="Védolizumab"><p class="lab">Cible</p><p>Intégrine α4β7, migration intestinale des lymphocytes.</p><p class="lab">Schéma</p><p>300 mg IV semaines 0, 2, 6, puis toutes les 8 semaines (ou 108 mg SC toutes les 2 semaines).</p><p class="lab">Place</p><p>Induction et entretien (recommandation forte).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-upadacitinib" data-title="Upadacitinib"><p class="lab">Cible</p><p>Janus kinase 1 (inhibiteur oral).</p><p class="lab">Induction (ECCO 2024)</p><p>45 mg/j pendant 12 semaines.</p><p class="lab">Place</p><p>Induction et entretien (recommandation forte).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
