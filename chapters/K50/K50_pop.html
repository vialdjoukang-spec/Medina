<template data-pop="pareto-k50-clinique" data-title="Loi de Pareto — Maladie de Crohn"><p class="ratio" data-cover="k50-1,k50-5,k50-6,k50-7,k50-8,k50-9,k50-10"></p><ul><li>Transmurale, segmentaire, de la bouche à l’anus.</li><li>Iléocoloscopie avec biopsies étagées ; entéro-IRM.</li><li>Montréal : A, L, B, p.</li><li>La stratégie « treat-to-target » vise la normalisation de la calprotectine et de la CRP.</li><li>La forme légère iléale reçoit du budésonide, mais pas de 5-ASA.</li><li>La forme modérée à sévère reçoit une biothérapie ou de l’upadacitinib, et les corticoïdes ne servent qu’à l’induction.</li><li>Abcès drainé avant immunosuppression.</li></ul></template>
<template data-pop="pareto-k50-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k50-e-1,k50-e-2"></p><ul><li>La calprotectine distingue une inflammation d’un trouble fonctionnel.</li><li>L’iléocoloscopie prélève ≥ 2 biopsies par segment, dans l’iléon et dans 5 sites coliques.</li><li>Entéro-IRM : grêle, sténoses, fistules.</li><li>Granulome non nécrosant : évocateur, inconstant.</li></ul></template>
<template data-pop="pareto-k50-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k50-p-1,k50-p-2,k50-p-3"></p><ul><li>On ne donne pas de 5-ASA dans la maladie de Crohn.</li><li>Les corticoïdes servent à l’induction, jamais à l’entretien.</li><li>Infliximab + thiopurine ≥ 6-12 mois.</li><li>On dépiste la tuberculose et l’hépatite B avant une biothérapie.</li><li>On teste la TPMT et NUDT15 avant l’azathioprine.</li></ul></template>
<template data-pop="k50-calpro" data-title="Calprotectine fécale"><p class="lab">Nature</p><p>Protéine des polynucléaires neutrophiles, dosée dans les selles.</p><p class="lab">Usage</p><p>Distinguer inflammation intestinale et trouble fonctionnel ; suivre la réponse (« treat-to-target »).</p><p class="lab">Limite</p><p>Elle s’élève aussi dans les infections, sous AINS et dans les néoplasies ; elle n’est donc pas spécifique.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-ileocolo" data-title="Iléocoloscopie avec biopsies"><p class="lab">Technique</p><p>Exploration du côlon et de l’iléon terminal.</p><p class="lab">Biopsies (ECCO-ESGAR 2019)</p><p>On prélève au moins 2 biopsies par segment, dans l’iléon et dans 5 sites coliques dont le rectum.</p><p class="lab">Signes</p><p>Elle montre des ulcères aphtoïdes ou profonds et discontinus, un aspect pavimenteux et des sténoses.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhtQF2AYUAAPr09Pv15fns3fbYtPvDoPq1mfG6mOC6oPeslvekkvWnhvWfh+qnj+mlfOGledKkffiZh+6ZhvaXfeyXfPWRfPSMd+qQeuqLdOGWguCUc+CMeeCKb9aWcNaKdM6Pbr2PdeqFcN2Fb+Z9adx8Z9SEc9SCadN7a9N4Ysp/cMl+Y8h2acl1YMB8ZsBzY7l3Zah5aMptXbxtXrFtYLBrV7tmV6plVq9gUq9WS5xkV5pVTI5YTnxUS4BCPmowMjYaIBQCESwAAAAAtQF2AUAI/wB78ODRQwdBgj0SChSIcKHChxAHSpyYo2JFHDx07Bgg4AEOHDpkzKghQwaOFzhcuJihksUHFi4+fEDhoYOHmxw4YGDAAINPDBEi/OQpFOiCoBF4MkCAgIEBAwWiMlV64ABHAQGwdvxwwECCBBAgUKhAVoJZChYoSBBLoW2FCxXUWrhgYS0ECRTCir2QN2wECxYiLBicYIHeu3kjTJgQNi5gpGEnLGAq9avlo4fv2oXwl65etBYmIA0KYYHlwqZPg0Wt4CtTBAYIDJhNm8CDqxwHEDCgVHBhpF95tmb6dTCECRc2bPAswcKGECDSor0Agi7g68lDaA9RYrt3EyZOmP8oUYJEhxMrVown34EEefYaSIBXYYKEfRQqWqhAgX8//hYABthCSTIIOKAMNdiQgw01NCiDSi4gWMNHFOJgkQ4Y+rARAAf44ENDCIXIEEQPTWTiQDncYFFFOwggQFUwWvXBCw8IMMALL8hk4wsHvPhAVQ/w5NMDRAap1JFIJsnTVLsZYJWLWAUQAABUVkklVlQeQOMBCBQnAVlxhdWWmHhVAAJZY4HZ1lmZ6UVaWGC1CRgFb6IVFGBw0UkaUnNVoNdXfvXpFgiEimDoCCPkZQGhFkCQQJdvlmbaAhIkIJtuEag5JgQMRNAmW21RcMF2dIm2FGUEEFAAcURdN1dyF9D/FeurdMl1wQghWBfYX4Bp8JwGFmigQQjygTdeCMN+Vx8JwrZnXgfQ2kcCCtJWy9+zGrTHX38q7Nfttt3mJ2AMJTXYoIILmqtuDStilNBADJ1o0InwjjgRhjysuOK5DDboQg0zsMTCtCjMWOTBPw1JZE4Z+HTkTkkh2dSpE59aQJMGcCSllVNaWeWUU3ZU1aoJeNqYmYaKQGgFIpwAg6FgommXW3H1JelRvmUWKVuCjiUBebGqHEJadlkwwgkjVCfCCCLEtZZZpSWAltNmSTDBZm4CVppiR6X2KGxIMQYBWREUhliaX4pQwgYZcECjxlJKqd <template data-pop="k50-montreal" data-title="Classification de Montréal"><p class="lab">Âge</p><p>A1 ≤ 16 ans ; A2 17-40 ans ; A3 > 40 ans.</p><p class="lab">Localisation</p><p>L1 désigne l’atteinte iléale, L2 colique, L3 iléocolique et L4 haute.</p><p class="lab">Comportement</p><p>B1 désigne la forme inflammatoire, B2 sténosante et B3 pénétrante ; le suffixe p signale une atteinte périanale.</p><p class="src">Références : <a href="https://doi.org/10.1136/gut.2005.082909" target="_blank" rel="noopener">Satsangi J. et al., The Montreal classification of inflammatory bowel disease, Gut 2006;55:749-753</a>.</p></template>
<template data-pop="k50-transmurale" data-title="Inflammation transmurale"><p class="lab">Définition</p><p>L’inflammation touche toute l’épaisseur de la paroi, de la muqueuse à la séreuse.</p><p class="lab">Conséquences</p><p>C’est pourquoi elle provoque des sténoses, des fistules et des abcès.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a>.</p></template>
<template data-pop="k50-mei" data-title="Manifestations extra-intestinales"><p class="lab">Exemples</p><p>Les arthrites périphériques et axiales, l’érythème noueux, le pyoderma gangrenosum, l’uvéite, l’épisclérite et la cholangite sclérosante primitive en sont des exemples.</p><p class="lab">Portée</p><p>Elles influencent le choix du traitement (ECCO 2024).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-perianal" data-title="Maladie périanale"><p class="lab">Lésions</p><p>Elle comprend des fissures, des fistules, des abcès et une sténose anale.</p><p class="lab">Classification</p><p>Le suffixe « p » de Montréal la signale.</p><p class="lab">Traitement</p><p>On draine par un séton et l’on donne un anti-TNF, car le drainage seul ne ferme pas la fistule.</p><p class="src">Références : <a href="https://doi.org/10.1136/gut.2005.082909" target="_blank" rel="noopener">Satsangi J. et al., The Montreal classification of inflammatory bowel disease, Gut 2006;55:749-753</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-nod2" data-title="Gène NOD2"><p class="lab">Rôle</p><p>Ce récepteur intracellulaire reconnaît des fragments bactériens et participe à l’immunité innée.</p><p class="lab">Lien</p><p>Variants associés à la maladie de Crohn iléale.</p></template>
<template data-pop="k50-tnf" data-title="TNF-α"><p class="lab">Nature</p><p>Cytokine pro-inflammatoire majeure.</p><p class="lab">Cible</p><p>Infliximab, adalimumab, certolizumab.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-t2t" data-title="Stratégie « treat-to-target »"><p class="lab">Principe</p><p>Fixer une cible objective, la mesurer régulièrement et ajuster le traitement si elle n’est pas atteinte.</p><p class="lab">Cibles</p><p>On vise la normalisation de la calprotectine ou de la CRP et la cicatrisation endoscopique (STRIDE-II).</p><p class="lab">Niveau</p><p>Recommandée par l’ECCO 2024 (consensus 97 %).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a> ; <a href="https://doi.org/10.1053/j.gastro.2020.12.031" target="_blank" rel="noopener">Turner D. et al., STRIDE-II, Gastroenterology 2021;160:1570-1583</a>.</p></template>
<template data-pop="k50-mdt" data-title="Équipe multidisciplinaire"><p class="lab">Membres</p><p>Gastroentérologue, chirurgien, radiologue, pathologiste, infirmière spécialisée, diététicien, psychologue.</p><p class="lab">Niveau</p><p>Recommandée par l’ECCO 2024 (consensus 97 %).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-5asa" data-title="5-ASA (mésalazine)"><p class="lab">ECCO 2024</p><p>Non recommandé pour l’induction (recommandation forte) ni pour l’entretien (recommandation forte).</p><p class="lab">Remarque</p><p>La mésalazine est efficace dans la rectocolite hémorragique, mais pas dans la maladie de Crohn.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-nee" data-title="Nutrition entérale exclusive"><p class="lab">Place</p><p>Induction chez le patient motivé, avec soutien diététique, qui veut éviter les corticoïdes (recommandation faible).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-cs" data-title="Corticoïdes systémiques"><p class="lab">Place</p><p>Ils induisent la rémission de la forme modérée à sévère (recommandation faible).</p><p class="lab">Jamais</p><p>En entretien.</p><p class="lab">Risques</p><p>Infections, ostéoporose, diabète, dépendance aux corticoïdes.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-thiopurines" data-title="Thiopurines"><p class="lab">Molécules</p><p>Ce sont l’azathioprine et la 6-mercaptopurine.</p><p class="lab">Place</p><p>Elles servent à l’entretien (recommandation faible), mais pas à l’induction (recommandation forte contre), car elles agissent en plusieurs mois ; associées à l’infliximab, elles se donnent pendant ≥ 6-12 mois.</p><p class="lab">Avant</p><p>On teste la TPMT ou NUDT15 avant de les prescrire.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Imurek®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k50-tpmt" data-title="Thiopurine méthyltransférase (TPMT)"><p class="lab">Rôle</p><p>Enzyme qui inactive une partie des thiopurines.</p><p class="lab">Déficit</p><p>Un déficit expose à une aplasie médullaire rapide sous azathioprine (FI Imurek®).</p><p class="lab">Conduite</p><p>On mesure l’activité ou le génotype avant le traitement, ainsi que NUDT15.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Imurek®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k50-granulome" data-title="Granulome épithélioïde non nécrosant"><p class="lab">Aspect</p><p>C’est un amas d’histiocytes épithélioïdes sans nécrose caséeuse.</p><p class="lab">Valeur</p><p>Évocateur, inconstant ; éliminer tuberculose et autres granulomatoses.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjy113" target="_blank" rel="noopener">Maaser C. et al., ECCO-ESGAR Guideline for Diagnostic Assessment in IBD Part 1, J Crohns Colitis 2019;13:144-164</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhzAGcAYUAAPrf5fnT4/3K5/LK2vy/6/q+2u6+1/qz5fey1fiq2+6x1e6o1OOtz/ig3uyg2/KgzemfyvCW2e2WyO2Mz+GfzOGWyuGNydSWxdGJwuuAzN9/xtV/y9R+ud9yxNFyv9djvcZ6vMZsurVwssJft61erclRs7ZQsKhPqrVDq6JCp6g2opdEoIdDlow0mYknk20dgwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAzAGcAUAI/wBRlPhQAsWHBg08jAhh4cGBAgIUcJCQAMIDDiM8TJhQgYIBAwoYYPDgIUMHDxYwYAgRQqMGDg0JYGDxwsWKFCtatEjBUwWKDhxWhBjh4kSCAxmSSlhK4sSEDSFEUCBwgYAAESJAZEBRFAIBEi9YpCAhAgMBEDVTZBhhgm0KnS1utjBxIkVGkiM4ODAwgAIHDRleZoiQ1OSHDhMaVKig0kECqwIEEODAIUTTmylOrHDhgkODwxM8kPCwwYGDqRI3aJzA2cSLFw4aTCDg4PWKAwEC9F3ZwYIEBAUO0GzxWsQDCZqJFx/w0YCIF8RXkAihgYTeyyISqnDR4gSHCo4TUP+AAGHF6xMRaG9ecWLDgRA7V5iIEAHDBQwgIlgAAcECCRMfmNRBRhZQUEAABgiAAAIQIHDBfyOwFUIDIJR1wQUD6JYhBieYMAFwBxjAAAQSUDbQBBGcIIICCpDXYAEIJBDBBjTSGOEHGkjwwAMI7FiiBh10YFJBQ5nQ1gZKabBRQwcsCCOPCzJYwQcqHNZBCq+x4IAAj8G4wI4i6PQCCQ5UAAIIGDgQUowJPGDRA4aZkIKcOrmAwp13MgQeig0cQIBiS1lgwQIFDGDoAAxU0EAELFFmAUYDdUBQhCSwtcJNJJxZo0I8BSiBTCdgsAACCzgAgkZNcfWTBumhRcIB5FX/MEJgJyTHAglTMXDBc2GtAIIFE2gwAk+Z8dTWjQMRVEKkkmaQAAKRXQDCCS68cIIHGiDAlwEAACACCRmgGEEHKpggpAnVvuDeCa+1EMJiNJGwAQkkNOCABfcpUAAFIJCwmQjCsaDcC+NVYJWuAkgrLU0vVPhavVi2kBcHBSggQl0eSGBBjhIMqMLHKnRXQW73YUBBAgnMCwIBDNPE2Qpq6oqBoIxGGFgKGi0FQZsXWISABPFSgMEBFLyGJgUU2CjCVSsYeACsFo0gJgvcMsdAAikpQAABAGzgAgu+hlDXCAQwwJ4IF3wUgAAWkDTBAR05AIEIK7Ag8E4pcMZTC3qb/7DTBubNaQJLOBEnca3+QsdWyCqUsJAEDWwQnQMH4HchBLKOsEFGE3CQNowNZEDRgjuOgFmdtm1gQeMDomDCnQOh4IG9IZjAAaEIKLBABR584Lvvyy4b4IBtncC3CyQIWldOzPP <template data-pop="k50-resection" data-title="Iléocæcectomie"><p class="lab">Indication</p><p>On la propose dans une maladie iléale limitée, une sténose fibreuse ou un échec médical, et on la discute tôt en équipe.</p><p class="lab">Suite</p><p>On prévient ensuite la récidive postopératoire et on la contrôle par endoscopie.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-budesonide" data-title="Budésonide (Entocort CIR®)"><p class="lab">Indication suisse</p><p>Induction et maintien de la rémission des poussées légères à modérées avec atteinte de l’iléon terminal et du côlon proximal.</p><p class="lab">Dose</p><p>On donne 9 mg/j pendant 8 semaines, puis 6 mg/j en entretien, avec une réduction progressive.</p><p class="lab">ECCO 2024</p><p>L’ECCO le recommande fortement pour induire la rémission d’une atteinte iléale ou du côlon ascendant, car il agit localement à cet endroit.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Entocort CIR®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-infliximab" data-title="Infliximab (Remicade®)"><p class="lab">Indication suisse</p><p>Il est autorisé dans la maladie de Crohn active modérée à sévère après échec du traitement conventionnel et dans la forme fistulisante sévère.</p><p class="lab">Schéma</p><p>On perfuse 5 mg/kg IV aux semaines 0, 2 et 6, puis toutes les 8 semaines.</p><p class="lab">Contre-indications</p><p>Tuberculose ou infection sévère, insuffisance cardiaque NYHA III-IV.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Remicade®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-ustekinumab" data-title="Ustékinumab"><p class="lab">Cible</p><p>Sous-unité p40 des interleukines 12 et 23.</p><p class="lab">Schéma (ECCO 2024)</p><p>≈ 6 mg/kg IV, puis 90 mg SC toutes les 8 semaines.</p><p class="lab">Place</p><p>Il sert à l’induction et à l’entretien (recommandation forte).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-risankizumab" data-title="Risankizumab"><p class="lab">Cible</p><p>Il cible la sous-unité p19 de l’interleukine 23.</p><p class="lab">Induction (ECCO 2024)</p><p>600 mg IV semaines 0, 4, 8.</p><p class="lab">Place</p><p>Il sert à l’induction et à l’entretien (recommandation forte).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-vedolizumab" data-title="Védolizumab"><p class="lab">Cible</p><p>Il cible l’intégrine α4β7 et bloque ainsi la migration intestinale des lymphocytes.</p><p class="lab">Schéma</p><p>On perfuse 300 mg IV aux semaines 0, 2 et 6, puis toutes les 8 semaines (ou 108 mg SC toutes les 2 semaines).</p><p class="lab">Place</p><p>Il sert à l’induction et à l’entretien (recommandation forte).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
<template data-pop="k50-d-upadacitinib" data-title="Upadacitinib"><p class="lab">Cible</p><p>Janus kinase 1 (inhibiteur oral).</p><p class="lab">Induction (ECCO 2024)</p><p>On donne 45 mg/j pendant 12 semaines.</p><p class="lab">Place</p><p>Il sert à l’induction et à l’entretien (recommandation forte).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjae091" target="_blank" rel="noopener">Gordon H. et al., ECCO Guidelines on Therapeutics in Crohn’s Disease: Medical Treatment, J Crohns Colitis 2024;18:1531-1555</a>.</p></template>
