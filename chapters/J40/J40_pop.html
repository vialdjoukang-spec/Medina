<template data-pop="j40-bronche-alveole" data-title="Bronche et alvéole : deux fonctions"><p class="lab">Fonction et cible</p><p>Les bronches conduisent l’air et évacuent les sécrétions. Les alvéoles échangent les gaz avec le sang.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une inflammation bronchique stimule les afférences de la toux et augmente les sécrétions. Un remplissage alvéolaire diminue la ventilation de territoires encore perfusés et peut réduire l’oxygénation.</p><p class="lab">Conséquence clinique</p><p>Une toux avec ronchi peut être bronchique ; hypoxémie, foyer ou douleur pleurale font rechercher une atteinte associée.</p><div class="key"><b>Limite.</b> Une bronchite et une pneumonie peuvent coexister. La localisation proposée doit rester cohérente avec toute la présentation.</div></template>
<template data-pop="j40-chronique-bpco" data-title="Bronchite chronique et BPCO : deux dimensions"><p class="lab">Fonction et cible</p><p>La bronchite chronique est un syndrome défini par une toux productive durable. La BPCO associe un contexte clinique compatible à une obstruction persistante documentée.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypersécrétion peut survenir avant ou sans limitation spirométrique du débit. À l’inverse, une destruction alvéolaire et une atteinte des petites voies peuvent provoquer une BPCO avec peu de mucus.</p><p class="lab">Conséquence clinique</p><p>Le médecin mesure la fonction, recherche d’autres causes et réduit les expositions. Le seul caractère productif de la toux ne justifie pas un traitement de BPCO.</p><div class="key"><b>Limite.</b> Le VEMS/CVF post-bronchodilatateur &lt; 0,70 est requis par GOLD pour confirmer la BPCO dans le contexte approprié ; qualité et limites d’âge comptent.</div><p class="src">Références : <a href="https://goldcopd.org/wp-content/uploads/2026/01/GOLD-Pocket-Guide-2026-v1.1-20Nov2025_WMV2.pdf" target="_blank" rel="noopener">GOLD 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7052787/" target="_blank" rel="noopener">Balte P. P., … Oelsner E. C., JAMA Intern Med 2020</a>.</p></template>
<template data-pop="j40-toux-postinfectieuse" data-title="Pourquoi la toux peut persister après l’infection"><p class="lab">Fonction et cible</p><p>Une muqueuse intacte filtre les particules et répond aux stimuli avec un seuil de toux adapté.</p><p class="lab">Mécanisme de l’affirmation</p><p>Après l’agression, l’épithélium et le transport mucociliaire récupèrent progressivement. Les afférences restent parfois sensibilisées ; un stimulus faible peut déclencher la toux sans multiplication infectieuse persistante.</p><p class="lab">Conséquence clinique</p><p>Une amélioration lente reste compatible avec la convalescence. L’explication de ce délai évite d’assimiler toute toux résiduelle à une bactérie ou à un échec antibiotique.</p><div class="key"><b>Limite.</b> Une aggravation, une dyspnée, une hémoptysie ou une absence d’amélioration après trois à quatre semaines imposent de reprendre l’évaluation.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120/resources/visual-summary-pdf-6664861405" target="_blank" rel="noopener">NICE NG120, évolution</a>.</p></template>
<template data-pop="j40-toux" data-title="La toux : protection et coût mécanique"><p class="lab">Fonction et cible</p><p>Le réflexe coordonne une inspiration, une compression glottique et une expiration rapide pour déplacer les sécrétions.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le mucus ou les médiateurs inflammatoires stimulent les terminaisons sensitives ; les afférences vagales activent la commande centrale et les muscles respiratoires.</p><p class="lab">Conséquence clinique</p><p>La toux nettoie les voies aériennes. Sa répétition peut provoquer une douleur musculaire ou rétrosternale et perturber le sommeil.</p><div class="key"><b>Limite.</b> Une douleur pleurale, brutale ou associée à une dyspnée ne doit pas être attribuée sans évaluation à l’effort de toux.</div></template>
<template data-pop="j40-mucus" data-title="Mucus, eau et cils : pourquoi la clairance ralentit"><p class="lab">Fonction et cible</p><p>Une couche de mucus mobile piège les particules ; les cils la transportent vers le pharynx.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’hypersécrétion et une hydratation de surface insuffisante augmentent la concentration des mucines. La couche devient plus adhérente et peut comprimer l’espace nécessaire au mouvement ciliaire.</p><p class="lab">Conséquence clinique</p><p>Les sécrétions retenues entretiennent la toux. Retirer l’irritant traite une cause ; modifier la viscosité seule ne restaure pas toute la défense.</p><div class="key"><b>Limite.</b> Ce modèle n’impose ni dosage de mucines ni mucolytique systématique. L’intérêt d’un traitement se juge sur un bénéfice clinique.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5706541/" target="_blank" rel="noopener">Kesimer et al., 2017</a>.</p></template>
<template data-pop="j40-crachats-verts" data-title="Pourquoi les crachats verts ne prouvent pas une bactérie"><p class="lab">Fonction et cible</p><p>Les neutrophiles participent à une réponse inflammatoire et à l’élimination de débris.</p><p class="lab">Mécanisme de l’affirmation</p><p>Leurs enzymes, notamment la myéloperoxydase, contribuent à une teinte jaune ou verte. Leur recrutement peut suivre une infection virale aussi bien que bactérienne.</p><p class="lab">Conséquence clinique</p><p>La couleur n’est pas une justification suffisante d’antibiotique dans une toux aiguë simple chez une personne sans maladie pulmonaire chronique.</p><div class="key"><b>Limite.</b> La couleur se lit avec terrain et gravité ; ne pas extrapoler cette règle à toutes les exacerbations de BPCO.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/19242860/" target="_blank" rel="noopener">Altiner et al., étude 2009</a>.</p></template>
<template data-pop="j40-tabac" data-title="Arrêt du tabac : retirer une agression bronchique"><p class="lab">Fonction et cible</p><p>L’épithélium et les cils défendent la surface bronchique contre les particules inhalées.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fumée apporte oxydants et irritants, stimule l’inflammation et les sécrétions et altère la clairance. Chaque nouvelle exposition entretient ces stimuli.</p><p class="lab">Conséquence clinique</p><p>L’arrêt diminue l’agression répétée et s’intègre au traitement d’une bronchite chronique. Une aide concrète au sevrage est proposée et les obstacles sont évalués.</p><div class="key"><b>Limite.</b> L’arrêt ne garantit pas la disparition immédiate de la toux ni la réversibilité d’une obstruction déjà constituée. Une cause associée reste possible.</div><p class="src">Références : <a href="https://goldcopd.org/wp-content/uploads/2026/01/GOLD-Pocket-Guide-2026-v1.1-20Nov2025_WMV2.pdf" target="_blank" rel="noopener">GOLD 2026, expositions et prévention</a>.</p></template>
<template data-pop="j40-terrain" data-title="Pourquoi le terrain change le seuil d’alerte"><p class="lab">Fonction et cible</p><p>Les réserves ventilatoires, circulatoires et immunitaires permettent de faire face à une augmentation de demande.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une maladie chronique réduit certaines réserves. Une immunodépression peut diminuer les signes inflammatoires tout en augmentant le risque d’infection grave ; la fragilité réduit la capacité de compensation.</p><p class="lab">Conséquence clinique</p><p>L’examen et la réévaluation sont adaptés au risque. Une fièvre modeste ou absente ne suffit pas à rassurer.</p><div class="key"><b>Limite.</b> Le terrain seul ne prouve pas une cause bactérienne ; il modifie l’évaluation et la balance des options.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120/resources/visual-summary-pdf-6664861405" target="_blank" rel="noopener">NICE NG120, risque de complications</a>.</p></template>

repose cependant sur la PCR d’un frottis nasopharyngé, et non sur cette coloration, parce que la bactérie est fragile et difficile à cultiver. Source : <a href="https://commons.wikimedia.org/wiki/File:Bordetella_pertussis.jpg" target="_blank" rel="noopener" data-reference-source="1">CDC Public Health Image Library, Wikimedia Commons</a> ; <a href="https://commons.wikimedia.org/wiki/Help:Public_domain" target="_blank" rel="noopener" data-reference-source="1">licence Public domain</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Fonction et cible</p><p>Le contrôle d’une infection dépend de la cause, du moment de la maladie et du risque pour les contacts. Les nourrissons de moins de 6 mois ont le risque de complications le plus élevé.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’infection à <i>Bordetella pertussis</i> produit une toux prolongée, par quintes, souvent sans fièvre. Un antibiotique débuté à la phase catarrhale peut réduire la durée et l’intensité des symptômes ; après l’apparition des quintes, il n’améliore plus la clinique, mais il élimine la bactérie du nasopharynx et interrompt la transmission. Cinq jours après le début du traitement, la contagiosité est très faible.</p><p class="lab">Diagnostic</p><p>L’OFSP recommande la PCR sur un prélèvement nasopharyngé profond jusqu’à 3 semaines après le début de la toux ; au-delà, il recommande la sérologie, qui dose les anticorps IgG contre la toxine pertussique. Ce changement s’explique par le fait que la sensibilité de la PCR diminue à mesure que la toux dure, parce que la bactérie disparaît des voies aériennes alors que la toux, entretenue par les lésions de l’épithélium, persiste.</p><p class="lab">Traitement selon l’OFSP</p><p>Les macrolides sont efficaces, alors que les pénicillines sont inefficaces. L’adulte reçoit de l’azithromycine à 500 mg le premier jour, puis à 250 mg par jour du 2e au 5e jour, ou de la clarithromycine à 1 g par jour en deux prises pendant 7 jours ; en cas d’intolérance aux macrolides, il reçoit du triméthoprime-sulfaméthoxazole à 320/1 600 mg par jour en deux prises pendant 14 jours. Une chimioprophylaxie post-exposition suit les mêmes schémas chez les contacts étroits à risque, c’est-à-dire les nourrissons de moins de 6 mois, les membres de leur famille et le personnel en contact professionnel avec eux, car le nourrisson non encore protégé par la vaccination fait les formes les plus graves.</p><p class="lab">Écart avec l’information professionnelle suisse</p><p>L’information suisse de Zithromax ne mentionne pas la coqueluche ; elle prévoit 500 mg par jour pendant 3 jours dans ses indications respiratoires, soit la même dose totale de 1,5 g que le schéma de l’OFSP. Pour l’examen fédéral, le schéma de l’OFSP s’applique.</p><div class="key"><b>Limite.</b> Une absence de reprise inspiratoire typique ne suffit pas à exclure la coqueluche. Les décisions dépendent de l’âge, du délai et des contacts ; les cas confirmés et les foyers exposant des nourrissons se déclarent au médecin cantonal.</div><p class="src">Références : <a href="https://www.infovac.ch/docs/public/bordetella/3-empfehlungen-praevention-keuchhusten-2017.pdf" target="_blank" rel="noopener">OFSP et Commission fédérale pour les vaccinations, recommandations pour la prévention de la coqueluche, 2017</a> ; Informations professionnelles suisses Zithromax® et Klacid®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
<template data-pop="j40-toux-medicamenteuse" data-title="Inhibiteur de l’enzyme de conversion et toux"><p class="lab">Fonction et cible</p><p>L’enzyme de conversion participe à la dégradation de la bradykinine et de la substance P, en plus de son rôle dans le système rénine-angiotensine.</p><p class="lab">Mécanisme de l’affirmation</p><p>Son inhibition peut augmenter des médiateurs qui sensibilisent les terminaisons respiratoires et déclencher une toux, souvent sèche.</p><p class="lab">Conséquence clinique</p><p>Le médecin identifie la molécule et la chronologie. Une substitution adaptée à l’indication cardiovasculaire se discute avec le prescripteur.</p><div class="key"><b>Limite.</b> Le délai d’apparition est variable ; la toux ne doit pas masquer une autre cause. Une modification médicamenteuse se juge avec l’indication initiale.</div></template>
<template data-pop="j40-constantes" data-title="Tachypnée et tachycardie : demande, compensation et limites"><p class="lab">Fonction et cible</p><p>Le débit cardiaque et la ventilation contribuent à apporter l’oxygène et à éliminer le dioxyde de carbone.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre augmente la demande métabolique ; l’hypoxémie, la douleur, la déshydratation ou une réserve réduite peuvent déclencher une accélération compensatoire.</p><p class="lab">Conséquence clinique</p><p>Mesurer les constantes aide à repérer une forme qui demande une recherche de gravité ou d’alternative à la bronchite simple.</p><div class="key"><b>Limite.</b> Ces anomalies sont non spécifiques. Leur absence ne garantit pas une présentation bénigne chez un patient fragile.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">ERS/ESCMID 2011, signes faisant suspecter une pneumonie</a>.</p></template>
<template data-pop="j40-ronchi" data-title="Ronchi : pourquoi réausculter après la toux"><p class="lab">Fonction et cible</p><p>L’air traverse normalement des voies aériennes dont la lumière est libre et la surface humide.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des sécrétions mobiles peuvent faire vibrer la colonne d’air et la paroi, créant des sons graves. Leur mobilisation par la toux modifie parfois le bruit.</p><p class="lab">Conséquence clinique</p><p>Une variation du bruit après la toux soutient une composante sécrétoire bronchique. Le médecin examine cependant l’ensemble des champs pulmonaires et tient compte du contexte, car un foyer localisé ou un sibilant fixe orienterait vers une autre cause.</p><div class="key"><b>Limite.</b> Un ronchus ne distingue pas un agent viral d’un agent bactérien et n’exclut pas une pneumonie associée.</div><p class="src">Référence du mécanisme : <a href="https://publications.ersnet.org/highwire/markup/item_fulltext/528904" target="_blank" rel="noopener">Groupe de travail ERS, nomenclature des bruits respiratoires</a>.</p></template>
<template data-pop="j40-sifflement" data-title="Sifflement : une lumière réduite, plusieurs causes"><p class="lab">Fonction et cible</p><p>Le débit d’air dépend du diamètre des voies et de la pression motrice.</p><p class="lab">Mécanisme de l’affirmation</p><p>Contraction du muscle lisse, œdème et mucus peuvent réduire la lumière et produire un flux turbulent avec vibration sonore. Le même bruit peut avoir plusieurs mécanismes.</p><p class="lab">Conséquence clinique</p><p>Selon l’histoire, le médecin recherche un asthme, une BPCO ou une autre obstruction ; un bronchospasme peut justifier un bronchodilatateur.</p><div class="key"><b>Limite.</b> Un sifflement isolé ne confirme pas une maladie chronique. Un obstacle localisé ou une détresse avec peu de bruit demande une attention spécifique.</div></template>

DrI0EoFkDDIWGkIqTNdIrSk5H02Dr9tGLpQdCKQwyMzHUeuaQ+hZK8GqFkpt5v5hLDHVw5pyOP7DodqpDu6VmXiZX11D/PjETxqVUaSbP+SlGhnHeSih7dnbafnKTHvORVilDCyQmq6j//onTs2CIx5CWag2PePJMXqiIrizEd4DWX9ESNQ/2xAhAAVdmdRPlbKYw0kqobp/Tr+Kpd8Mnr4rQx4LiHgWKBvO4xN7rZcLmn9/tVxez/g6vqRbn6C665vXcsiJzB2PoVGMeWDfpGket8eQ4HlGwIx62FbdjrFZL53Tj43mGhNgKXsuJYEDEXbjF7PlEykRKppJehJZ4PVNgPQPrcgI0T4NuaDP0r+riKHfyLjuVwPyWopOx2Zrtvea0U1umwagdHJNTBz+6m87tAQv0yQYQkyr1LLelqMr2kvYztZZt0PkttzvnOSPsZO3IAhhAIrkXV9iKBCBEvgRGTE0AxzGY/9W8Rq8X1OvuszrhcybzMVHO5XygKmTT76g6MJy2JfVOaaENui2CV6FQ+0Nitnrz7uWdItXEkXYv6dxqKIGO9rLecsTqa95uaAeLqn8H0GtqUqoWL7UyTiVr7cFSzFuHFeO2hUWMSGcBfJmsycDvBYd/Dlsxj8mkIeVUa8uGo3ULa6DkdnEOr9/aFVMXpyhuLKknIQXKrSyP/Nrq+J86dKer+6iacDkVdFw2sM55sbU/zhfbqal7MRR63oBe6N8m7xLHd0+7WPWGLe1YDbVxCuopxVcQopcIRwaACWFQAE1JeBGtFaeB0FCmmKi5hAUPq9r3/B395raH8Sw78S+PqlGTtkRlOjlHsu5wqi21z75A95aGVvUEO/S//elPvvxV7big3fIdAfnzynhDUuhs+7e+Qrqz/hFi5lq1jpv+YHoQXh17/cu1HEADjE9f6EZBBAQAOw==" width="340" height="270" loading="lazy" decoding="async" style="max-width:100%;height:auto" alt="Radiographie thoracique d’une pneumonie lobaire du lobe moyen droit"><figcaption>Cette radiographie montre une opacité dense du lobe moyen droit chez un homme de 67 ans atteint de pneumonie lobaire. L’opacité apparaît parce que l’exsudat inflammatoire remplit les alvéoles et remplace l’air, alors que les bronches restent aérées. Elle illustre donc ce qui sépare une pneumonie d’une bronchite aiguë : la bronchite touche les bronches sans opacité parenchymateuse, tandis qu’un foyer, une hypoxémie ou des signes focaux justifient l’imagerie et le traitement antibiotique. Source : <a href="https://commons.wikimedia.org/wiki/File:X-ray_of_lobar_pneumonia.jpg" target="_blank" rel="noopener" data-reference-source="1">Mikael Häggström, M.D. Author info - Reusing images- Conflicts of interest: None Mikael Häggström, M.D.Consent note: Wri, Wikimedia Commons</a> ; <a href="http://creativecommons.org/publicdomain/zero/1.0/deed.en" target="_blank" rel="noopener" data-reference-source="1">licence CC0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Fonction et cible</p><p>Les unités alvéolaires doivent recevoir de l’air et du sang pour permettre les échanges.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un exsudat alvéolaire réduit la ventilation de territoires encore perfusés ; une inflammation pleurale peut provoquer une douleur à l’inspiration. Les signes focaux orientent vers une atteinte localisée.</p><p class="lab">Conséquence clinique</p><p>Dyspnée, hypoxémie, douleur pleurale ou foyer auscultatoire justifient une recherche de pneumonie et une imagerie selon l’évaluation.</p><p class="lab">Critères européens</p><p>Selon ERS/ESCMID, un seul des signes suivants fait suspecter une pneumonie : signes thoraciques focaux nouveaux, dyspnée, tachypnée, fréquence cardiaque supérieure à 100/min, fièvre de plus de 4 jours. Une CRP inférieure à 20 mg/L après plus de 24 heures de symptômes rend la pneumonie très improbable ; en cas de doute persistant, une radiographie thoracique tranche.</p><div class="key"><b>Limite.</b> L’absence de ces signes rend une pneumonie moins probable chez l’adulte sain, sans exclusion absolue. Âge et immunodépression peuvent modifier les signes.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead M. et al., ERS/ESCMID, Clin Microbiol Infect 2011</a>.</p></template>
<template data-pop="j40-embolie" data-title="Embolie pulmonaire : ventilation sans perfusion suffisante"><p class="lab">Fonction et cible</p><p>L’échange gazeux demande une concordance entre ventilation et perfusion.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un thrombus réduit le débit pulmonaire de territoires ventilés. L’espace mort et la charge du ventricule droit peuvent augmenter, produisant dyspnée, douleur ou instabilité selon l’étendue et la réserve.</p><p class="lab">Conséquence clinique</p><p>Une présentation soudaine ou des facteurs thrombotiques font engager la démarche spécifique ; une toux n’exclut pas cette cause.</p><div class="key"><b>Limite.</b> Ni une saturation normale ni une auscultation peu bruyante n’excluent l’embolie. La probabilité clinique détermine les examens.</div></template>
<template data-pop="j40-asthme" data-title="Asthme et bronchite éosinophilique : rechercher la bonne cible"><p class="lab">Fonction et cible</p><p>Le muscle bronchique règle le calibre ; la muqueuse reçoit plusieurs formes d’inflammation.</p><p class="lab">Mécanisme de l’affirmation</p><p>Dans l’asthme, l’inflammation et l’hyperréactivité peuvent entraîner une obstruction variable. Une bronchite éosinophilique peut provoquer une toux sans obstruction variable démontrée.</p><p class="lab">Conséquence clinique</p><p>Une toux nocturne ou variable appelle une recherche ciblée. Un traitement anti-inflammatoire est choisi après identification d’une indication, pas pour toute toux postinfectieuse.</p><div class="key"><b>Limite.</b> Les symptômes seuls ne distinguent pas toujours ces entités ; les examens fonctionnels et, selon le contexte, les investigations spécialisées sont nécessaires.</div></template>

lass="lab">Mécanisme de l’affirmation</p><p>La dilatation et le dommage pariétal perturbent la clairance ; les sécrétions retenues favorisent des infections et une inflammation qui peuvent entretenir le dommage.</p><p class="lab">Conséquence clinique</p><p>Des expectorations abondantes, des infections répétées ou une hémoptysie justifient cette recherche ; la tomodensitométrie peut documenter la structure.</p><div class="key"><b>Limite.</b> Un symptôme isolé ne suffit pas à confirmer le diagnostic. La cause et le microbiote sont évalués dans la démarche spécifique.</div></template>
<template data-pop="j40-alarme-chronique" data-title="Toux chronique et signes d’alarme"><p class="lab">Fonction et cible</p><p>Une toux persistante peut être sécrétoire, sensorielle, médicamenteuse ou liée à une lésion.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une obstruction locale, une destruction tissulaire ou une infection chronique peut provoquer hémoptysie, symptômes prolongés et altération générale.</p><p class="lab">Conséquence clinique</p><p>Perte de poids, hémoptysie ou tableau inexpliqué conduisent à rechercher notamment cancer et tuberculose selon l’exposition et le terrain.</p><div class="key"><b>Limite.</b> Ces signes sont des indices, pas une preuve d’une maladie donnée. Ne pas prolonger une étiquette de bronchite sans examen approprié.</div></template>
<template data-pop="j40-urgence" data-title="Pourquoi détresse, confusion et instabilité sont urgentes"><p class="lab">Fonction et cible</p><p>Une ventilation, une oxygénation et une perfusion suffisantes maintiennent les fonctions des organes.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un trouble sévère des échanges, une rétention de dioxyde de carbone ou une perfusion insuffisante peut altérer la cognition et épuiser les muscles respiratoires. Une hémoptysie importante peut aussi menacer la perméabilité des voies aériennes.</p><p class="lab">Conséquence clinique</p><p>Les fonctions menacées sont évaluées et traitées immédiatement ; la cause est recherchée ensuite. Une insuffisance respiratoire ne se gère pas comme une bronchite ambulatoire simple.</p><div class="key"><b>Limite.</b> Les mécanismes peuvent se combiner ; ne pas attendre tous les signes pour reconnaître une urgence.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120/resources/visual-summary-pdf-6664861405" target="_blank" rel="noopener">NICE NG120, orientation</a>.</p></template>
<template data-pop="j40-pas-antibiotique" data-title="Pourquoi un antibiotique n’est pas systématique"><p class="lab">Fonction et cible</p><p>Un antibactérien agit sur une cible bactérienne : paroi, synthèse protéique ou autre fonction selon la classe.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une infection virale n’offre pas cette cible. Dans une bronchite aiguë simple, le bénéfice attendu sur la toux est faible ; l’exposition garde ses risques digestifs, allergiques et de sélection de résistance.</p><p class="lab">Conséquence clinique</p><p>Le médecin explique son choix, propose un soulagement adapté et précise quand reconsulter. Une surveillance accompagnée est une décision de traitement.</p><div class="key"><b>Limite.</b> Une forme sévère, un terrain à risque ou une requalification diagnostique peut modifier l’indication.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120/resources/visual-summary-pdf-6664861405" target="_blank" rel="noopener">NICE NG120, stratégie antibiotique</a>.</p></template>
<template data-pop="j40-antibiotique-exception" data-title="Antibiothérapie : indication avant le schéma"><p class="lab">Fonction et cible</p><p>Un antibiotique n’est utile que si son bénéfice attendu dépasse ses risques dans la situation retenue.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une infection bactérienne sensible peut fournir une cible ; l’amoxicilline inhibe la construction du peptidoglycane et fragilise la paroi. Elle n’agit pas sur un virus et ne couvre pas toutes les causes de toux.</p><p class="lab">Conséquence clinique</p><p>Chez un adulte très altéré sur le plan général après évaluation clinique, NICE recommande une antibiothérapie immédiate. Chez un adulte à risque élevé de complications sans cette gravité, une prescription immédiate ou différée peut être envisagée selon le tableau. Exemple parmi ses alternatives : amoxicilline 500 mg trois fois par jour pendant cinq jours, dose comprise dans la posologie suisse de 375 à 750 mg trois à quatre fois par jour ; au plus 500 mg toutes les 12 heures si la clairance de la créatinine est de 10 à 30 mL/min.</p><div class="key"><b>Limite.</b> NICE est un référentiel européen ; la dose et l’adaptation rénale suivent l’information professionnelle suisse. Le diagnostic et l’absence d’allergie sont vérifiés. Pneumonie et coqueluche suivent leur propre stratégie.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120/chapter/recommendations" target="_blank" rel="noopener">NICE NG120, indications et tableau adulte</a> ; Information professionnelle suisse Amoxicilline Sandoz®, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>
<template data-pop="j40-paracetamol" data-title="Paracétamol : soulagement et marge de sécurité"><p class="lab">Fonction et cible</p><p>Le paracétamol soulage douleur et fièvre par des effets principalement centraux ; il n’élimine pas la cause bronchique.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une petite fraction est transformée en métabolite réactif, normalement neutralisé par le glutathion. En surdosage ou lorsque les réserves sont diminuées, ce métabolite peut léser les hépatocytes.</p><p class="lab">Conséquence clinique</p><p>L’adulte ou l’adolescent de plus de 40 kg reçoit 500 à 1 000 mg par prise, au plus quatre fois par jour et à 4 à 8 heures d’intervalle. Le plafond est de 4 g par 24 heures, toutes prises confondues ; il est abaissé à 3 g en cas de maladie hépatique, d’alcoolisme chronique, de dénutrition ou de déshydratation, parce que ces situations épuisent le glutathion qui neutralise le métabolite toxique du paracétamol. La plus faible dose utile est donnée sur la durée la plus brève.</p><div class="key"><b>Limite.</b> La dose s’adapte aux facteurs de risque et au produit ; les préparations combinées s’additionnent. Un surdosage suspect exige une évaluation urgente même sans symptôme précoce.</div><p class="src">Références : Information professionnelle suisse Paracétamol Sandoz® eco, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>
<template data-pop="j40-salbutamol" data-title="Salbutamol : détendre un muscle, pas traiter une toux"><p class="lab">Fonction et cible</p><p>Le muscle lisse bronchique règle une partie du calibre des voies aériennes.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le récepteur bêta-2 active une protéine G stimulatrice, puis l’adénylate cyclase. L’AMPc formé active la protéine kinase A, qui active la phosphatase et inhibe la kinase des chaînes légères de myosine, tandis que le calcium est séquestré dans les réserves intracellulaires ; le muscle se relâche. Cet effet améliore un bronchospasme ; il ne cible ni la réplication virale ni la réparation épithéliale.</p><p class="lab">Conséquence clinique</p><p>Si l’indication est retenue, le patient dès 12 ans prend une à deux bouffées d’aérosol-doseur à 100 µg pour un bronchospasme aigu, selon l’information suisse ; un besoin de plus de 2 bouffées 8 fois par jour impose un avis médical, car il signale une obstruction insuffisamment contrôlée. Le médecin contrôle la technique d’inhalation et la réponse.</p><div class="key"><b>Limite.</b> Pas de routine dans la bronchite aiguë sans maladie des voies aériennes. Palpitations, tremblements et baisse de kaliémie peuvent accompagner l’effet systémique ; un besoin croissant exige réévaluation.</div><p class="src">Références : Information professionnelle suisse Ventolin®, Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://www.nice.org.uk/guidance/ng120/resources/visual-summary-pdf-6664861405" target="_blank" rel="noopener">NICE NG120, bronchodilatateurs</a>.</p><p class="src">Référence du mécanisme : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3190895/" target="_blank" rel="noopener">Barnes P. J., Biochemical basis of asthma therapy, J Biol Chem 2011</a>.</p></template>
<template data-pop="j40-corticoides" data-title="Corticostéroïde : une cible pertinente doit être démontrée"><p class="lab">Fonction et cible</p><p>Le récepteur glucocorticoïde modifie la transcription de nombreux gènes, avec des effets anti-inflammatoires et métaboliques.</p><p class="lab">Mécanisme de l’affirmation</p><p>Diminuer des médiateurs peut aider une inflammation asthmatique. Mais une toux aiguë sans maladie obstructive ne présente pas automatiquement cette cible utile ; l’essai de prednisolone cité n’a pas réduit la durée ou la gravité des symptômes dans la population étudiée.</p><p class="lab">Conséquence clinique</p><p>Le médicament est réservé à une indication reconnue, par exemple une exacerbation d’asthme selon son protocole.</p><div class="key"><b>Limite.</b> L’essai concernait des adultes non asthmatiques sans maladie pulmonaire chronique ne nécessitant pas d’antibiotique immédiat. Hyperglycémie, troubles du sommeil et effets sur la défense infectieuse restent possibles.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28829884/" target="_blank" rel="noopener">Hay et al., essai randomisé 2017</a>.</p></template>
<template data-pop="j40-mucolytique" data-title="Mucolytique : propriétés du mucus et bénéfice clinique"><p class="lab">Fonction et cible</p><p>La clairance dépend de la concentration des mucines, de l’hydratation, des cils et du débit de toux.</p><p class="lab">Mécanisme de l’affirmation</p><p>Certains mucolytiques modifient les liaisons ou la structure des sécrétions ; ils ne restaurent pas à eux seuls la barrière ou le mouvement ciliaire.</p><p class="lab">Conséquence clinique</p><p>NICE ne recommande pas de mucolytique pour une toux aiguë associée à une bronchite. Une éventuelle indication chronique est évaluée dans la maladie correspondante.</p><div class="key"><b>Limite.</b> Une plausibilité biologique ne garantit pas un bénéfice sur la toux, les exacerbations ou la qualité de vie.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120/resources/visual-summary-pdf-6664861405" target="_blank" rel="noopener">NICE NG120, mucolytiques</a>.</p></template>
<template data-pop="j40-antitussif" data-title="Antitussif : soulager sans perdre la protection"><p class="lab">Fonction et cible</p><p>La toux permet de déplacer les sécrétions et participe à la protection des voies aériennes.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un médicament qui réduit la commande de la toux peut diminuer une gêne, mais aussi limiter l’évacuation. Un produit sédatif peut réduire vigilance et ventilation, surtout avec alcool, opioïdes ou autres sédatifs.</p><p class="lab">Conséquence clinique</p><p>La décision pèse les sécrétions, le terrain et le bénéfice attendu. Les médicaments contenant de la codéine n’ont pas de bénéfice démontré suffisant pour la toux aiguë selon NICE.</p><div class="key"><b>Limite.</b> Une toux productive abondante ou une réserve respiratoire faible demande une prudence particulière. Aucune prescription universelle ne découle du symptôme.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120/chapter/recommendations" target="_blank" rel="noopener">NICE NG120, auto-soins et antitussifs</a>.</p></template>
<template data-pop="j40-anemie" data-title="Anémie : pourquoi la saturation peut rester normale"><p class="lab">Fonction et cible</p><p>L’oxygène sanguin est transporté surtout par l’hémoglobine ; la saturation décrit la proportion de sites occupés.</p><p class="lab">Mécanisme de l’affirmation</p><p>Si la quantité d’hémoglobine diminue, il y a moins de sites disponibles même lorsque leur proportion oxygénée reste normale. Le contenu artériel en oxygène baisse ; le cœur et la ventilation peuvent augmenter leur travail pour préserver l’apport tissulaire.</p><p class="lab">Conséquence clinique</p><p>Une anémie peut accroître fatigue, dyspnée et difficulté de compensation dans une maladie cardiorespiratoire. Une SpO₂ normale ne l’exclut pas.</p><div class="key"><b>Limite.</b> La formule sanguine n’est pas un examen automatique de bronchite simple. Elle se demande selon les symptômes, le terrain et la question clinique ; la cause d’une anémie découverte est traitée.</div><p class="src">Référence du mécanisme : <a href="https://pubmed.ncbi.nlm.nih.gov/9438742/" target="_blank" rel="noopener">Weiskopf et al., réponse humaine à une anémie aiguë, 1998</a>.</p></template>
<template data-pop="j40-sodium" data-title="Sodium : concentration, eau et cerveau"><p class="lab">Fonction et cible</p><p>La natrémie reflète surtout le rapport entre solutés et eau extracellulaire, pas seulement la quantité de sel consommée.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une rétention d’eau peut abaisser la concentration ; des pertes et une correction inadéquate peuvent aussi la modifier. En cas d’hyponatrémie hypotonique importante ou rapide, la baisse de tonicité extracellulaire fait entrer l’eau dans les cellules cérébrales, avec risque neurologique. Une natrémie basse associée à une hyperglycémie ou une pseudo-hyponatrémie exige une autre interprétation.</p><p class="lab">Conséquence clinique</p><p>Confusion, pertes hydriques, comorbidités ou traitements peuvent justifier le dosage dans une forme sévère ; une anomalie demande une analyse de sa cause et de sa vitesse.</p><div class="key"><b>Limite.</b> Ni une hyponatrémie ni une natrémie normale ne définissent une bronchite. Pas de dosage systématique dans une forme simple et pas de correction rapide empirique.</div><p class="src">Référence du mécanisme : <a href="https://www.ese-hormones.org/publications/directory/ese-clinical-guideline-for-the-management-of-hyponatraemia/" target="_blank" rel="noopener">Société européenne d’endocrinologie, guideline hyponatrémie</a>.</p></template>
<template data-pop="j40-potassium" data-title="Potassium : excitabilité et effet bêta-2"><p class="lab">Fonction et cible</p><p>Le gradient de potassium entre cellules et milieu extracellulaire participe au potentiel membranaire des muscles et du cœur.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une baisse de la kaliémie perturbe la repolarisation et peut favoriser faiblesse ou arythmie. Les agonistes bêta-2 stimulent notamment le transfert cellulaire via la pompe sodium-potassium, abaissant la concentration extracellulaire sans nécessaire perte totale équivalente.</p><p class="lab">Conséquence clinique</p><p>La surveillance dépend des doses de bronchodilatateur, les diurétiques, les pertes et le risque cardiaque. Une faiblesse ou une arythmie appelle une évaluation adaptée.</p><div class="key"><b>Limite.</b> La kaliémie n’est pas prescrite systématiquement pour une bronchite simple. Une hausse du potassium a également des risques électriques et s’interprète avec rein et prélèvement.</div><p class="src">Références : <a href="https://doi.org/10.1111/j.1365-2265.1984.tb03436.x" target="_blank" rel="noopener">Struthers A. D., Reid J. L., l’adrénaline provoque une hypokaliémie par stimulation bêta-2, Clin Endocrinol 1984 (résumé)</a> ; Information professionnelle suisse Ventolin®, Swissmedic (AIPS), consultée le 08.10.2026 (hypokaliémie, aggravée par diurétiques, méthylxanthines, corticostéroïdes et digitaliques).</p></template>
<template data-pop="j40-spirometrie" data-title="Spirométrie : démontrer une obstruction de qualité"><p class="lab">Fonction et cible</p><p>Le VEMS mesure le volume expiré durant la première seconde ; la CVF est le volume expiré lors d’une manœuvre forcée complète.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une limitation du débit peut réduire le VEMS relativement à la CVF. La mesure après bronchodilatateur recherche une obstruction persistante et limite certaines confusions avec un rétrécissement réversible.</p><p class="lab">Conséquence clinique</p><p>Un VEMS/CVF post-bronchodilatateur &lt; 0,70 est requis par GOLD pour la BPCO dans un contexte compatible. La qualité est vérifiée et une valeur limite ou discordante est répétée.</p><div class="key"><b>Limite.</b> Le rapport fixe a des limites d’âge ; la mesure ne diagnostique pas l’hypersécrétion. Un épisode aigu peut perturber l’état habituel et justifier une confirmation ultérieure.</div><p class="src">Références : <a href="https://publications.ersnet.org/content/erj/65/2/2401603" target="_blank" rel="noopener">GOLD Science Committee, spirométrie</a> ; <a href="https://goldcopd.org/wp-content/uploads/2026/01/GOLD-Pocket-Guide-2026-v1.1-20Nov2025_WMV2.pdf" target="_blank" rel="noopener">GOLD 2026</a>.</p></template>
<template data-pop="j40-sp02" data-title="SpO₂ : proportion oxygénée et limites"><p class="lab">Fonction et cible</p><p>Le saturomètre estime la proportion d’hémoglobine oxygénée à partir de l’absorption lumineuse pulsatile.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une atteinte des échanges peut abaisser cette proportion. Une mauvaise perfusion, un mouvement ou des conditions de lecture peuvent altérer l’estimation ; des biais de mesure peuvent aussi retarder la détection d’une hypoxémie.</p><p class="lab">Conséquence clinique</p><p>La valeur se compare à la clinique, au débit d’oxygène et aux valeurs habituelles. Une valeur discordante ou une gravité clinique impose une confirmation, par exemple par gaz du sang.</p><div class="key"><b>Limite.</b> Ne mesure ni la quantité d’hémoglobine ni la pression de dioxyde de carbone. Une valeur normale ne prouve pas une ventilation ou un transport d’oxygène normaux.</div></template>
<template data-pop="j40-crp" data-title="CRP : réponse inflammatoire, pas identité de l’agent"><p class="lab">Fonction et cible</p><p>Le foie produit la CRP en réponse à des médiateurs inflammatoires, notamment l’interleukine 6.</p><p class="lab">Mécanisme de l’affirmation</p><p>Sa concentration augmente lors de nombreux stimuli infectieux et non infectieux ; son délai varie avec la cinétique de la réponse.</p><p class="lab">Conséquence clinique</p><p>Un résultat peut contribuer à une décision incertaine selon un protocole et le contexte, mais ne remplace pas l’histoire, les constantes et l’examen.</p><div class="key"><b>Limite.</b> Une valeur basse précoce ne clôt pas un tableau inquiétant. Ni un chiffre élevé ni un chiffre bas ne justifie seul la prescription ou l’exclusion d’un antibiotique.</div><p class="src">Référence du mécanisme : <a href="https://pubmed.ncbi.nlm.nih.gov/2454206/" target="_blank" rel="noopener">Castell et al., hépatocytes humains et interleukine 6, 1988</a>.</p></template>
<template data-pop="j40-micro-prelevement" data-title="Prélèvement ciblé : un résultat doit servir"><p class="lab">Fonction et cible</p><p>Le diagnostic microbiologique recherche un agent par culture, détection d’antigène ou de matériel génétique selon le test.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le site, le délai, la qualité et un éventuel traitement influencent la détection. Un agent détecté peut représenter une infection ou un portage ; un agent absent du prélèvement peut rester présent ailleurs.</p><p class="lab">Conséquence clinique</p><p>Le test se justifie si une stratégie antivirale, une prise en charge de coqueluche ou la prévention des contacts en dépend.</p><div class="key"><b>Limite.</b> Pas de prélèvement universel pour une bronchite simple. La concordance entre agent, temporalité et tableau détermine l’interprétation.</div></template>
<template data-pop="j40-biologie-severe" data-title="Biologie ciblée : expliquer chaque demande"><p class="lab">Fonction et cible</p><p>La réserve physiologique et l’élimination des médicaments dépendent de plusieurs organes.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’hémoglobine renseigne le transport d’oxygène ; la créatinine aide à évaluer la fonction rénale et certaines doses ; sodium et potassium renseignent des équilibres hydriques et électriques qui peuvent aggraver une situation sévère.</p><p class="lab">Conséquence clinique</p><p>Chaque dosage part d’une question : anémie suspectée, déshydratation, médicament à adapter ou risque d’arythmie. Son résultat sert une décision explicite.</p><div class="key"><b>Limite.</b> Ces examens ne confirment pas une bronchite et n’y sont pas systématiques. Les fenêtres Anémie, Sodium et Potassium décrivent les mécanismes particuliers.</div></template>
<template data-pop="pareto-j40-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j40-0,j40-1,j40-2,j40-3,j40-4,j40-5,j40-6"></p><ul><li>La bronchite aiguë simple est souvent virale ; une toux résiduelle peut refléter une muqueuse encore sensibilisée.</li><li>L’expectoration verte reflète une réponse inflammatoire et ne justifie pas seule un antibiotique.</li><li>La bronchite chronique décrit une toux productive durable ; l’obstruction de BPCO doit être mesurée.</li><li>Temporalité, terrain, trajectoire et constantes guident le raisonnement ; un foyer ou une dyspnée importante impose de chercher une autre atteinte.</li></ul></template>
<template data-pop="pareto-j40-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j40-7"></p><ul><li>Le diagnostic exclut une alternative mieux explicative, notamment pneumonie, asthme, embolie ou maladie structurale selon le tableau.</li><li>Le diagnostic de la forme aiguë est clinique. La forme chronique demande en revanche une durée documentée et la recherche d’autres causes, parce qu’une toux productive prolongée peut révéler une BPCO, des bronchiectasies ou un cancer.</li><li>Un seul signe de pneumonie (signes focaux nouveaux, dyspnée, tachypnée, fréquence cardiaque &gt; 100/min, fièvre &gt; 4 jours) impose de la rechercher.</li></ul></template>
<template data-pop="pareto-j40-tt" data-title="Pareto — Urgences et prise en charge"><p class="ratio" data-cover="j40-8,j40-9"></p><ul><li>Détresse, confusion, instabilité ou hémoptysie importante exigent une évaluation immédiate.</li><li>Dans une forme aiguë simple, le médecin explique, soulage et prévoit la réévaluation ; un médicament doit avoir une cible.</li><li>Antibiotique, bronchodilatateur et corticostéroïde ne sont pas automatiques. Une maladie associée ou une forme sévère change la décision.</li></ul></template>
<template data-pop="pareto-j40-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="j40-10,j40-11,j40-12"></p><ul><li>Une aggravation change la stratégie sans attendre la fin du délai habituel de toux.</li><li>Le syndrome chronique classique exige une toux productive au moins trois mois par an pendant deux années consécutives, après exclusion d’autres causes.</li><li>La BPCO requiert une obstruction post-bronchodilatateur documentée dans un contexte compatible ; le suivi tient compte de la qualité et des valeurs limites.</li></ul></template>
<template data-pop="pareto-j40-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j40-e-1,j40-e-2"></p><ul><li>Chaque examen répond à une question qui change la décision ; aucun bilan universel ne confirme une bronchite simple.</li><li>La saturation ne mesure ni l’hémoglobine totale ni la ventilation ; une valeur normale ne résume pas la réserve respiratoire.</li><li>Spirométrie et imagerie examinent respectivement fonction et structure. La CRP reste un marqueur inflammatoire non spécifique.</li></ul></template>
<template data-pop="pareto-j40-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j40-p-1,j40-p-2,j40-p-3"></p><ul><li>Le paracétamol soulage fièvre ou douleur ; toutes les prises s’additionnent et le plafond s’abaisse selon les risques.</li><li>Le salbutamol traite un bronchospasme : la technique, la réponse et les effets cardiaques ou potassiques comptent.</li><li>Une indication antibiotique est évaluée avant le schéma. Les traitements d’une pneumonie, d’une coqueluche ou d’une BPCO suivent leur référentiel propre.</li></ul></template>
