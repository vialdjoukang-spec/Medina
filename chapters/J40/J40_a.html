<h1>Bronchite</h1><span class="status">Adulte · formes aiguës et chroniques · rédaction du 07.10.2026 · référentiels NICE NG120 et GOLD 2026</span></div>

<section class="ilot" id="j40-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un adulte consulte pour une toux apparue après un rhume. De plus, les crachats sont devenus verts. De son côté, un autre décrit une toux productive depuis plusieurs hivers. <b>Dans les deux cas, la durée, la gravité et la fonction respiratoire orientent davantage que la couleur des sécrétions.</b> La première décision consiste à reconnaître une atteinte bronchique compatible avec une évolution simple, puis à rechercher ce qui impose un autre diagnostic ou une prise en charge urgente.</p><p>Formes aiguës et chroniques partagent une même démarche. Le médecin distingue d’abord une bronchite d’une pneumonie. Il documente ensuite un éventuel syndrome bronchitique chronique et mesure une obstruction associée. Il choisit enfin les seuls examens qui changent la décision et justifie chaque médicament par une cible précise, ou l’écarte faute d’indication.</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="j40-bronche-alveole">Bronche et alvéole (localiser l’atteinte)</button> ; <button class="w" data-justification="1" data-k="j40-chronique-bpco">bronchite chronique et BPCO (distinguer les diagnostics)</button>.</div></section>
<section class="ilot" id="j40-1"><h2><span class="n">1</span>Une bronchite, plusieurs temporalités</h2><p>La <b>bronchite aiguë</b> associe une toux récente à une inflammation des voies aériennes conductrices, souvent au décours d’une infection virale. En outre, une expectoration, une gêne rétrosternale ou des ronchi peuvent l’accompagner. Ces signes ne démontrent ni infection bactérienne ni atteinte alvéolaire. À l’inverse, la <b>bronchite chronique</b> est un syndrome de toux productive durable, classiquement présent la plupart des jours pendant au moins trois mois par an, deux années consécutives, après exclusion d’autres causes.</p><table class="t"><tr><th>Forme</th><th>Définition opérationnelle</th><th>Conséquence pour la démarche</th></tr><tr><td><b>Bronchite aiguë</b></td><td>Maladie aiguë avec toux, chez un patient sans maladie pulmonaire chronique ; les infections des voies respiratoires basses durent au plus 21 jours (ERS/ESCMID).</td><td>Le médecin recherche une pneumonie ou une autre alternative ; la couleur des crachats ne désigne pas l’agent.</td></tr><tr><td><b>Bronchite chronique</b></td><td>Toux et expectoration au moins trois mois par an, deux années consécutives, en l’absence d’une autre affection qui les explique (définition classique reprise par GOLD 2026).</td><td>Une spirométrie recherche une obstruction ; les autres causes de toux productive sont écartées.</td></tr><tr><td><b>Durée non encore documentée</b></td><td>Toux bronchique dont l’histoire ne permet pas encore de trancher entre forme aiguë et forme chronique.</td><td>La durée, les épisodes antérieurs et l’expectoration entre les infections sont précisés avant de conclure.</td></tr></table><p>L’expectoration chronique peut être muqueuse ou mucopurulente ; ce caractère décrit les sécrétions, il ne prouve ni une infection bactérienne ni une obstruction. <button class="w" data-justification="1" data-k="j40-chronique-bpco">Par ailleurs, une bronchite chronique peut exister sans BPCO (pourquoi la spirométrie compte)</button> ; inversement, une BPCO peut exister sans expectoration chronique. À cet égard, GOLD 2026 rappelle que la clause d’exclusion des autres causes est souvent négligée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead M. et al., ERS/ESCMID, prise en charge des infections des voies respiratoires basses de l’adulte, Clin Microbiol Infect 2011</a> ; <a href="https://goldcopd.org/wp-content/uploads/2026/01/GOLD-REPORT-2026-v1.3-8Dec2025_WMV2.pdf" target="_blank" rel="noopener">GOLD 2026, rapport complet, bronchite chronique, p. 14</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7052787/" target="_blank" rel="noopener">Balte P. P., … Oelsner E. C., JAMA Intern Med 2020</a>.</p></section>
<section class="ilot" id="j40-2"><h2><span class="n">2</span>Évolution et risque</h2><p>La bronchite aiguë simple est généralement autolimitée. Certes, une toux peut persister trois à quatre semaines : la disparition du virus et le retour à une sensibilité bronchique normale ne sont pas simultanés. <button class="w" data-justification="1" data-k="j40-toux-postinfectieuse">De même, une toux résiduelle ne signifie pas un échec antibiotique (mécanisme et limites)</button>. En revanche, une aggravation, une dyspnée nouvelle ou une altération importante de l’état général impose une réévaluation sans attendre ce délai.</p><p>La bronchite chronique sans obstruction mérite un suivi : elle peut s’accompagner d’événements respiratoires et d’une dégradation fonctionnelle. En effet, le risque individuel dépend des expositions, des comorbidités et de l’évolution mesurée. Ainsi, dans une cohorte poolée de 22 325 adultes sans obstruction initiale, les fumeurs ou anciens fumeurs atteints de bronchite chronique non obstructive perdaient 4,1 mL de VEMS de plus par an et avaient un risque d’hospitalisation ou de décès d’origine respiratoire chronique multiplié par 2,2. De même, en Suisse, la cohorte SAPALDIA a identifié la bronchite chronique, avec l’âge et le tabac, parmi les déterminants de l’apparition d’une obstruction en onze ans. Le syndrome chronique est donc un signal d’alerte fonctionnel, même lorsque la spirométrie initiale est normale.</p><div class="key"><b>À retenir.</b> Une durée encore compatible avec la convalescence rassure seulement si la trajectoire clinique et l’examen le permettent.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120/chapter/recommendations" target="_blank" rel="noopener">NICE NG120, Cough (acute): antimicrobial prescribing, 2019, évolution et réévaluation</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7052787/" target="_blank" rel="noopener">Balte P. P., … Oelsner E. C., JAMA Intern Med 2020;180:676-686</a> ; <a href="https://doi.org/10.1136/thx.2009.115063" target="_blank" rel="noopener">Probst Hensch N. M. et al., cohorte suisse SAPALDIA, Thorax 2010;65:150-156</a>.</p></section>
<section class="ilot" id="j40-3"><h2><span class="n">3</span>Du stimulus bronchique à la toux</h2><p>L’épithélium bronchique constitue une barrière et transporte les sécrétions vers le pharynx. Or, un virus ou un irritant lèse cette interface ; les médiateurs inflammatoires sensibilisent les afférences de la toux. Le mucus, les débris et l’œdème stimulent ensuite le réflexe. <button class="w" data-justification="1" data-k="j40-toux">Concrètement, la toux expulse les sécrétions (arc réflexe et coût mécanique)</button>, tandis qu’une muqueuse sensibilisée peut continuer à déclencher une toux sèche après l’épisode initial.</p><p>Une exposition répétée à la fumée favorise l’inflammation, l’hypersécrétion et l’altération de la clairance. <button class="w" data-justification="1" data-k="j40-mucus">Or, un mucus trop concentré est plus difficile à transporter (mucines, eau et cils)</button>. Cette rétention entretient les symptômes. Enfin, un rétrécissement bronchique ou une atteinte des petites voies aériennes peut s’y ajouter, mais l’expectoration seule ne démontre pas une obstruction persistante.</p><p><button class="w" data-justification="1" data-k="j40-crachats-verts">Des crachats verts reflètent surtout une réponse neutrophilique (pourquoi ils ne suffisent pas à prescrire)</button>. Une inflammation virale peut aussi recruter des neutrophiles. Dès lors, la couleur doit être interprétée avec le terrain, la gravité et le diagnostic envisagé.</p><div class="key"><b>Conséquence thérapeutique.</b> Un bronchodilatateur agit sur le muscle bronchique ; un antibiotique sur une bactérie sensible. Aucun des deux ne répare automatiquement une muqueuse lésée par un virus.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5706541/" target="_blank" rel="noopener">Kesimer et al., mucines bronchiques, 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19242860/" target="_blank" rel="noopener">Altiner et al., expectoration colorée, 2009</a>.</p></section>
<section class="ilot" id="j40-4"><h2><span class="n">4</span>Expositions et vulnérabilité</h2><p>L’anamnèse des expositions recherche le tabac actif et passif, les poussières ou fumées professionnelles et les irritants domestiques. À cet égard, en Suisse, les agriculteurs déclarent deux fois plus souvent une bronchite chronique que la population générale ; plus de quatre heures par jour dans des bâtiments d’élevage doublent ce risque (Danuser et al., 2001). <button class="w" data-justification="1" data-k="j40-tabac">Ainsi, l’arrêt du tabac réduit une agression bronchique répétée (effet attendu et limites)</button>. À l’inverse, une exposition continue entretient la production de mucus et freine la récupération de la barrière ; elle favorise aussi des maladies que le terme « bronchite » ne doit pas masquer.</p><p>Une maladie cardiorespiratoire, une immunodépression ou une grande fragilité réduisent les réserves ou modifient la réponse à l’infection. <button class="w" data-justification="1" data-k="j40-terrain">Ces terrains abaissent le seuil de réévaluation (pourquoi une présentation modeste peut être trompeuse)</button>. Enfin, la grossesse et l’âge pédiatrique nécessitent une évaluation et des choix médicamenteux propres ; les posologies de ce cours concernent l’adulte.</p><div class="key"><b>À retenir.</b> Le terrain modifie le risque et la stratégie d’examens ; il ne transforme pas à lui seul une infection virale en infection bactérienne.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajim.1032" target="_blank" rel="noopener">Danuser B. et al., symptômes respiratoires des agriculteurs suisses, Am J Ind Med 2001;39:410-418</a> ; <a href="https://www.nice.org.uk/guidance/ng120/chapter/recommendations" target="_blank" rel="noopener">NICE NG120, 2019, risque de complications</a>.</p></section>
<section class="ilot" id="j40-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>L’interrogatoire précise le début, la durée, les épisodes antérieurs et l’existence d’une expectoration entre les infections. Il établit ensuite ce qui a changé : dyspnée, fièvre persistante, douleur thoracique, tolérance de l’effort et autonomie. De fait, une rhinorrhée initiale oriente vers une infection respiratoire ; elle n’exclut pas une complication secondaire.</p><p>Des quintes avec vomissement post-tussif ou un contact compatible font rechercher une <button class="w" data-justification="1" data-k="j40-coqueluche">coqueluche (pourquoi le traitement et la prévention diffèrent)</button>. De même, une toux nocturne variable avec sifflements suggère un asthme ; des expectorations abondantes répétées orientent vers des bronchiectasies. Enfin, l’hémoptysie, la perte de poids et les sueurs nocturnes sont recherchées activement : ces éléments élargissent le diagnostic vers un cancer ou une tuberculose selon le contexte.</p><p>La liste des médicaments est revue. <button class="w" data-justification="1" data-k="j40-toux-medicamenteuse">En effet, un inhibiteur de l’enzyme de conversion peut provoquer une toux (bradykinine et démarche)</button>. Toutefois, le lien temporel aide, mais une cause médicamenteuse supposée ne dispense pas d’évaluer les signes d’alarme.</p><div class="key"><b>À retenir.</b> Le récit doit établir une temporalité et une trajectoire, puis identifier les symptômes qui changent la décision.</div></section>
<section class="ilot" id="j40-6"><h2><span class="n">6</span>Examiner pour décider</h2><p>L’examen commence par la température, la fréquence respiratoire, la fréquence cardiaque et, si les symptômes ou le terrain le justifient, la saturation pulsée. Il apprécie ensuite l’effort respiratoire, la capacité à parler et l’état mental. <button class="w" data-justification="1" data-k="j40-constantes">Ainsi, tachypnée et tachycardie signalent une demande accrue ou une réserve réduite (mécanismes et limites)</button>. Elles ne désignent pas, à elles seules, un agent infectieux.</p><p>À l’auscultation, des <button class="w" data-justification="1" data-k="j40-ronchi">ronchi qui changent après la toux (sécrétions dans les bronches)</button> sont compatibles avec une bronchite ; des <button class="w" data-justification="1" data-k="j40-sifflement">sifflements (rétrécissement et diagnostics possibles)</button> demandent une recherche d’obstruction. En revanche, un foyer de crépitants, une diminution localisée du murmure ou des signes de condensation renforcent la suspicion de pneumonie ou d’une autre atteinte localisée.</p><p>Les recommandations ERS/ESCMID font suspecter une pneumonie devant un seul des signes suivants : signes thoraciques focaux nouveaux, dyspnée, tachypnée, fréquence cardiaque supérieure à 100/min ou fièvre de plus de 4 jours. À l’inverse, une CRP inférieure à 20 mg/L après plus de 24 heures de symptômes rend la pneumonie très improbable ; un doute persistant conduit à une radiographie thoracique. <button class="w" data-justification="1" data-k="j40-pneumonie">Ces repères ne constituent pas une exclusion absolue (terrain et imagerie)</button>, notamment chez la personne âgée ou immunodéprimée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead M. et al., ERS/ESCMID, infections des voies respiratoires basses de l’adulte, 2011</a>.</p><button class="pareto-btn ui" data-k="pareto-j40-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
