<section class="ilot" id="i83-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme R., 61 ans, patiente fictive dont le cas suit tout le cours, est aide-soignante dans un établissement médico-social, où elle travaille debout huit heures par jour. Elle a eu trois grossesses, sa mère a été opérée de varices et son IMC atteint 31 kg/m². Son hypertension artérielle est traitée depuis un an par amlodipine 10 mg par jour. Elle ne fume pas et n’a jamais eu de thrombose veineuse profonde.</p>
<p>Depuis dix ans, ses jambes sont lourdes le soir et ses chevilles gonflent en fin de journée, davantage à gauche. Depuis six mois, une tache brune qui démange est apparue au-dessus de la malléole interne gauche. Il y a deux ans, un cordon rouge et douloureux est apparu sur une varice de la jambe gauche ; un médecin l’a traité par une pommade, sans échographie.</p>
<p><b>Mme R. a-t-elle une maladie veineuse chronique, et à quel stade ? Son œdème est-il seulement veineux ? Quel examen faut-il demander ? Faut-il traiter son reflux, et par quelle technique ? Que rembourse l’assurance obligatoire des soins ?</b> La tache brune a une valeur particulière : elle montre que l’hypertension veineuse atteint déjà la peau, ce qui fait passer la maladie d’un problème de confort à une indication de traitement.</p>
<p>Le médecin assistant doit décrire un membre selon la classification CEAP, distinguer varices, insuffisance veineuse chronique et syndrome post-thrombotique, et prescrire puis lire l’écho-Doppler. Il reconnaît un œdème d’une autre cause et les complications qui exigent une orientation urgente. Il pose l’indication de la compression et du traitement du reflux selon les règles suisses de remboursement.</p>
<div class="key"><b>Prérequis.</b> Une valvule veineuse continente laisse monter le sang vers le cœur et se ferme lorsqu’il redescend. La contraction du mollet fournit l’énergie du retour veineux. Ces deux éléments expliquent la <button class="w" data-k="i83-pav">pression veineuse ambulatoire (pourquoi la marche abaisse la pression du pied)</button>, notion dont dérivent presque tous les signes du cours.</div>
</section>

<section class="ilot" id="i83-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La <b>maladie veineuse chronique</b> désigne toute anomalie morphologique ou fonctionnelle durable du système veineux qui se manifeste par des symptômes ou des signes justifiant une évaluation ou des soins. Cette définition provient d’un consensus transatlantique de terminologie ; la Société européenne de chirurgie vasculaire (ESVS) l’a reprise en 2022. Le terme d’<b>insuffisance veineuse chronique</b> est réservé aux formes avancées, avec œdème, altérations cutanées ou ulcère, soit les classes C&#8288;3 à C&#8288;6. La distinction a une portée pratique : une varice isolée gêne, alors qu’une peau qui s’altère annonce l’ulcère.</p>
<p>Trois calibres de veines dilatées doivent être distingués. Les <b>télangiectasies</b> sont des veinules intradermiques dilatées de moins de 1 mm. Les <b>veines réticulaires</b> sont des veines sous-dermiques bleutées, habituellement de 1 mm à moins de 3 mm. Les <b>varices</b> sont des veines sous-cutanées dilatées de 3 mm ou plus, mesurées en position debout ; elles sont habituellement tortueuses, mais un tronc saphène rectiligne dont le reflux est démontré est aussi classé varice. Ces définitions sont celles de la révision de la CEAP de 2004 (Eklöf et al.), que la révision de 2020 (Lurie et al.) a conservées sans changement ; l’ESVS 2022 cite les mêmes calibres (§ 4.5). Les varices s’examinent debout, car la colonne de sang distend alors la veine incompétente ; chez le patient couché, la même varice peut disparaître.</p>
<p>Selon sa cause, la maladie est <b>primitive</b> lorsque la paroi et les valvules s’altèrent sans maladie sous-jacente identifiée. Elle est <b>secondaire</b> lorsqu’une maladie connue l’explique, et <b>congénitale</b> lorsqu’une malformation existe dès la naissance. Dans le réseau profond, la cause secondaire la plus fréquente est la thrombose veineuse profonde. Le <b>syndrome post-thrombotique</b> réunit alors les symptômes et les signes d’hypertension veineuse qui suivent la thrombose : les valvules ont été détruites pendant la recanalisation, ou la veine reste en partie obstruée.</p>

<h3>1.1 Classification CEAP 2020</h3>
<p>La classification CEAP décrit un membre à un moment donné selon quatre domaines : clinique (C), étiologique (E), anatomique (A) et physiopathologique (P). Sa révision de 2020 a ajouté la corona phlebectatica (C&#8288;4c), les récidives (C&#8288;2r et C&#8288;6r) et la distinction entre causes secondaires intraveineuses (Esi) et extraveineuses (Ese). L’ESVS la recommande pour l’audit et la recherche (recommandation 1, classe I, niveau C). La question posée au membre est la suivante : quels signes veineux sont présents, et que traduit chacun d’eux dans la paroi ou dans la peau ?</p>
<table class="t"><tr><th>Classe</th><th>Signe clinique</th><th>Ce que le signe traduit</th></tr>
<tr><td>C&#8288;0</td><td>Aucun signe visible ni palpable</td><td>Des symptômes peuvent exister seuls (C&#8288;0s) ; leur origine veineuse reste alors à prouver.</td></tr>
<tr><td>C&#8288;1</td><td>Télangiectasies ou veines réticulaires</td><td>De petites veines sont dilatées, en général sans retentissement sur la peau.</td></tr>
<tr><td>C&#8288;2 (C&#8288;2r si récidive)</td><td>Varices</td><td>Un tronc saphène ou une collatérale reflue le plus souvent.</td></tr>
<tr><td>C&#8288;3</td><td>Œdème</td><td>La filtration capillaire dépasse les capacités du drainage lymphatique ; la classe ne précise pas la cause de l’œdème.</td></tr>
<tr><td>C&#8288;4a</td><td>Pigmentation ou eczéma</td><td>Le fer des hématies extravasées et l’inflammation atteignent le derme.</td></tr>
<tr><td>C&#8288;4b</td><td>Lipodermatosclérose ou atrophie blanche</td><td>Le derme et l’hypoderme deviennent fibreux, ou la peau perd ses capillaires.</td></tr>
<tr><td>C&#8288;4c</td><td>Corona phlebectatica</td><td>Un éventail de petites veines intradermiques dilatées entoure la cheville.</td></tr>
<tr><td>C&#8288;5</td><td>Ulcère cicatrisé</td><td>La peau a déjà cédé une fois et peut céder de nouveau.</td></tr>
<tr><td>C&#8288;6 (C&#8288;6r si récidive)</td><td>Ulcère veineux actif</td><td>La perte de substance de toute l’épaisseur de la peau, entretenue par la maladie veineuse, ne cicatrise pas spontanément.</td></tr></table>
<p>Les classes vont de C&#8288;0 à C&#8288;6, de la veine dilatée à l’ulcère. Cet ordre n’est pas une échelle de gravité : un ulcère peut exister sans toutes les classes inférieures, et la révision de 2020 confie la mesure de la gravité au VCSS révisé. La <b>notation élémentaire</b> retient la seule classe la plus élevée du membre ; la <b>notation complète</b> énumère toutes les classes présentes, séparées par des virgules. Les deux ajoutent l’indice s (symptomatique) ou a (asymptomatique). À l’intérieur de C&#8288;4, la révision de 2004 présentait C&#8288;4b comme plus grave que C&#8288;4a. La révision de 2020 a ajouté C&#8288;4c parce que la corona phlebectatica s’associe à un risque d’ulcère 5,3 fois plus élevé, du même ordre que celui des autres altérations de C&#8288;4. L’ESVS 2022 constate qu’aucune donnée solide n’indique quels membres de classe C&#8288;4 progressent le plus vers l’ulcère (§ 9.1) : aucune hiérarchie entre a, b et c n’est donc retenue ici. Les domaines E, A et P disent ensuite pourquoi, où et comment la veine est malade : cause primitive (Ep), secondaire intraveineuse (Esi) ou extraveineuse (Ese) ; atteinte superficielle (As), profonde (Ad) ou perforante (Ap) ; reflux (Pr) ou obstruction (Po). La classe C&#8288;3 note un œdème sans en préciser la cause, limite que la révision de 2020 reconnaît. L’erreur fréquente consiste à attribuer au reflux un œdème médicamenteux ou cardiaque sans l’avoir recherché : l’ESVS demande d’écarter une cause non veineuse avant tout geste (recommandation 16, classe IIa, niveau C). Lorsqu’une insuffisance cardiaque élève la pression veineuse, la CEAP 2020 la note comme cause secondaire extraveineuse (Ese). Le membre gauche de Mme R. porte des varices (C&#8288;2), un œdème (C&#8288;3), une pigmentation avec eczéma (C&#8288;4a) et une corona phlebectatica (C&#8288;4c) : il présente donc des altérations cutanées de classe C&#8288;4, sous les formes a et c. Sa classe clinique s’écrit C&#8288;4 en notation élémentaire et C&#8288;2,3,4a,c en notation complète. Les domaines A et P exigent l’écho-Doppler (îlot 7) ; la notation est détaillée dans la fenêtre <button class="w" data-k="i83-ceap">classification CEAP 2020 (notation d’un membre)</button>.</p>

<h3>1.2 Mesurer la gravité et l’évolution</h3>
<p>La CEAP est catégorielle et ne mesure pas l’évolution. Un membre classé C&#8288;4a le reste après un traitement réussi, car la pigmentation persiste. Le <b>VCSS révisé</b>, score de dix items cotés de 0 à 3, et, après une thrombose, l’<b>échelle de Villalta</b> chiffrent la gravité ; l’ESVS les propose pour l’audit et la recherche (recommandation 2, classe IIa, niveau C), et ils servent aussi à suivre un patient. Le VCSS révisé du membre gauche de Mme R. vaut 8 points : douleur quotidienne qui gêne sans empêcher ses activités 2, varices de jambe et de cuisse 3, œdème limité à la cheville 1, pigmentation et inflammation périmalléolaires 1 chacune. Les items et les seuils sont expliqués dans la fenêtre <button class="w" data-k="i83-vcss">VCSS révisé et échelle de Villalta (mesurer la gravité)</button>.</p>

<p>Un piège de terminologie concerne l’« inflammation » des varices. L’eczéma veineux sus-malléolaire est une <b>dermite de stase</b>, inflammation chronique de la peau due à l’hypertension veineuse ; ce n’est pas une thrombose veineuse superficielle. Dans une thrombophlébite sur varice, la paroi veineuse s’enflamme au contact d’un caillot, sans infection ; elle relève d’une autre conduite, exposée dans le cours I80 — Thrombose veineuse profonde et thromboses veineuses (C-01-Cardiologie). L’eczéma sus-malléolaire de Mme R. est une dermite de stase.</p>
<div class="key"><b>À retenir.</b> La maladie veineuse chronique couvre tout le spectre, de la jambe lourde sans signe à l’ulcère ; l’insuffisance veineuse chronique commence à l’œdème (C&#8288;3). La CEAP décrit un membre par sa classe clinique la plus élevée (notation élémentaire) ou par toutes ses classes présentes (notation complète), puis par sa cause, sa localisation et son mécanisme ; le VCSS révisé mesure l’évolution. L’eczéma veineux est une dermite de stase et non une thrombophlébite. Reste à savoir combien de personnes se trouvent à chaque stade et à quelle vitesse elles en changent.</div>
</section>

<section class="ilot" id="i83-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2>
<p>La maladie veineuse chronique est l’une des affections les plus fréquentes de l’adulte, mais ses chiffres varient selon la définition et la méthode. Une revue systématique de 2021 a regroupé 19 études pour estimer la prévalence de chaque classe clinique (Salim et al.). Ses valeurs ne sont pas ajustées et l’hétérogénéité entre études est forte : elles donnent un ordre de grandeur de la proportion d’adultes à chaque stade.</p>
<table class="t"><tr><th>Classe clinique</th><th>C&#8288;0s</th><th>C&#8288;1</th><th>C&#8288;2</th><th>C&#8288;3</th><th>C&#8288;4</th><th>C&#8288;5</th><th>C&#8288;6</th></tr>
<tr><td>Prévalence groupée</td><td>9 %</td><td>26 %</td><td>19 %</td><td>8 %</td><td>4 %</td><td>1 %</td><td>0,42 %</td></tr></table>
<p>La prévalence diminue à mesure que la classe s’aggrave : la plupart des personnes atteintes ont des signes mineurs, et l’ulcère actif reste rare. En Europe, la prévalence groupée des varices (C&#8288;2) atteint 21 % selon l’ESVS. Le chiffre de C&#8288;0s doit être lu avec prudence, car il provient surtout d’une enquête menée en consultation de médecine de famille, sans écho-Doppler. Une femme de 50 ans qui se plaint de jambes lourdes sans aucun signe n’a donc pas forcément une maladie veineuse : d’autres causes doivent être cherchées.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée épidémiologique nationale suisse vérifiée n’a été trouvée, et aucune recommandation suisse propre à la maladie veineuse chronique n’a été identifiée. Les chiffres du cours sont européens ou mondiaux ; ils s’appliquent à la Suisse par analogie, sans mesure directe.</div>
<h3>2.1 Histoire naturelle</h3>
<p>L’Edinburgh Vein Study a suivi 880 adultes pendant 13 ans, avec examen clinique et écho-Doppler des réseaux profond et superficiel. Chaque année, 0,9 % des sujets développaient un reflux. La maladie a progressé chez 57,8 % des participants, soit 4,3 % par an, et un tiers des porteurs de varices non compliquées ont développé des altérations cutanées. La progression était plus fréquente en cas de surpoids ou d’antécédent de thrombose veineuse profonde ; elle n’était associée ni au sexe ni à l’âge. Ainsi, Mme R., en surpoids et porteuse de varices depuis des années, appartient au groupe dont la peau s’altère avec le temps.</p>
<p>Le reflux précède souvent la varice visible. Dans l’étude de Bochum, un reflux sans varice découvert chez de jeunes sujets exposait à un risque de 30 % de varices tronculaires dans les quatre ans. Le reflux est donc la lésion initiale, et la varice sa conséquence. Ce constat justifie que l’examen de référence porte sur le reflux et non sur l’aspect des veines.</p>
<h3>2.2 Association ou causalité</h3>
<p>Le sexe féminin (rapport de cotes 2,26), l’âge, l’obésité, la station debout prolongée, les antécédents familiaux et les grossesses sont associés à la maladie veineuse chronique. Ces données sont transversales : elles montrent une association, sans démontrer que chaque facteur cause la maladie. Les mécanismes plausibles et le niveau de preuve de chaque facteur sont discutés à l’îlot 4 et dans la fenêtre <button class="w" data-k="i83-fdr-hered">hérédité, âge, sexe et grossesses (association ou cause)</button>.</p>
<div class="trap"><span class="k">Erreur fréquente</span>L’erreur consiste à affirmer que les varices causent la thrombose veineuse profonde. Selon l’ESVS, les varices sont un facteur de risque mineur de thrombose profonde. Une étude de population n’a pas pu établir si ce lien est causal ou s’il traduit des facteurs de risque communs, comme l’âge et l’obésité. La thrombose veineuse superficielle sur varice est différente : le thrombus né dans la varice peut s’étendre au réseau profond (îlot 8).</div>
<div class="key"><b>À retenir.</b> Environ un adulte sur cinq a des varices, mais moins de 1 % a un ulcère actif. La maladie progresse lentement et souvent : un tiers des varices non compliquées s’accompagnent d’altérations cutanées après 13 ans. Le reflux précède la varice. Les facteurs de risque connus sont surtout des associations. Le passage du reflux à l’atteinte de la peau s’explique par la pression veineuse ambulatoire.</div>
</section>

<section class="ilot" id="i83-3"><h2><span class="n">3</span>Physiopathologie : de la valvule à l’ulcère</h2>
<p>Chez une personne debout et immobile, la pression dans une veine du dos du pied égale le poids de la colonne de sang qui la sépare de l’oreillette droite, soit 80 à 90 mmHg. Lorsque la personne marche, chaque contraction du mollet chasse le sang des veines profondes vers le haut. Les valvules empêchent ensuite le sang de redescendre, et la pression du pied tombe à 20 à 30 mmHg : c’est la <button class="w" data-k="i83-pav">pression veineuse ambulatoire (mesure et signification)</button>. Le retour veineux normal repose donc sur deux conditions : une pompe musculaire active et des valvules continentes.</p>
<h3>3.1 Paroi, valvules et reflux</h3>
<p>Dans la maladie primitive, la paroi et les valvules des veines superficielles s’altèrent en premier. L’ESVS attribue l’origine de ces changements à une inflammation dans laquelle l’endothélium joue un rôle central. La paroi perd de l’élastine et du collagène organisé, se fibrose et se dilate ; les feuillets valvulaires ne se rejoignent plus et la valvule devient incompétente. L’atteinte peut progresser de façon ascendante, des collatérales vers le tronc puis la jonction, ou descendante, de la jonction vers le tronc puis les collatérales. Le sang reflue alors vers le bas à chaque relâchement du mollet.</p>
<p>Le reflux a une conséquence hémodynamique précise. La veine se remplit plus vite par le haut, se vide moins bien, et la pression du pied ne baisse plus suffisamment pendant la marche : la pression veineuse ambulatoire reste élevée. Le flux des veines perforantes, qui va normalement du réseau superficiel vers le profond, augmente aussi ; la perforante se dilate et peut devenir incompétente à son tour. Une pression veineuse ambulatoire plus élevée s’associe à une classe clinique plus grave, surtout en cas de reflux.</p>
<h3>3.2 Réseau profond et causes extraveineuses</h3>
<p>Dans le réseau profond, la vidange est compromise par une obstruction, un reflux ou les deux, le plus souvent après une thrombose. Si le thrombus se recanalise, les valvules prises dans le caillot sont détruites et un reflux profond apparaît. Si la recanalisation est insuffisante, la lumière reste rétrécie et le sang ne sort plus du membre. Lorsque reflux et obstruction coexistent, l’évolution clinique peut être plus sévère. D’autres causes élèvent la pression veineuse sans lésion de la veine elle-même ; elles sont décrites à l’îlot 4.</p>
<h3>3.3 Microcirculation et peau</h3>
<p>La peau souffre par un mécanisme distinct : l’hypertension veineuse se transmet aux capillaires et aux veinules. Les valvules des petites veines cutanées deviennent incompétentes, et les capillaires s’allongent, se dilatent et deviennent tortueux. L’endothélium dysfonctionnel laisse fuir du liquide, libère des médiateurs inflammatoires et attire des leucocytes dans le derme. Il en résulte un œdème, des manchons de fibrine, puis une inflammation chronique avec fibrose, pigmentation et calcification, jusqu’à l’ulcère. Les étapes et les hypothèses encore discutées figurent dans la fenêtre <button class="w" data-k="i83-microcirc">microcirculation et inflammation (de l’hypertension veineuse à la dermite)</button>.</p>

<p>La figure se lit de haut en bas, puis de gauche à droite. La différence décisive se situe à la deuxième case : chez le sujet normal, la marche fait chuter la pression du pied ; chez le malade, elle la laisse élevée. Tout ce qui suit, de l’œdème à l’ulcère, découle de cette pression maintenue. Chez Mme R., la grande saphène reflue, la pression de sa cheville gauche reste élevée chaque fois qu’elle marche ou se tient debout, et sa peau sus-malléolaire en porte déjà les marques. Les traitements agissent sur deux cases de la figure : la compression et la marche rétablissent la baisse de pression, et la suppression du reflux corrige le défaut valvulaire.</p>
<div class="key"><b>À retenir.</b> La maladie veineuse chronique est une maladie de la pression veineuse ambulatoire : le reflux ou l’obstruction empêche la marche d’abaisser la pression du pied. Cette pression maintenue atteint les capillaires, déclenche une inflammation chronique et explique l’œdème, la pigmentation, la fibrose et l’ulcère. Reflux et obstruction ont des causes différentes, qui orientent le bilan et le traitement.</div>
</section>

<section class="ilot" id="i83-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Retrouver la cause d’une maladie veineuse chronique change la conduite. Une varice primitive se traite en supprimant le reflux superficiel. Un syndrome post-thrombotique ou une compression iliaque exige d’abord une évaluation du réseau profond. Un œdème d’origine cardiaque ou médicamenteuse ne relève pas d’un geste veineux. Le médecin classe donc chaque membre selon le domaine E de la CEAP avant de discuter un traitement.</p>
<h3>4.1 Causes</h3>
<p>Les <b>causes primitives (Ep)</b> sont de loin les plus fréquentes : la paroi et les valvules superficielles s’altèrent sans maladie sous-jacente identifiée, sur un terrain souvent familial. Les <b>causes secondaires intraveineuses (Esi)</b> sont dominées par la thrombose veineuse profonde, qui détruit les valvules ou laisse une obstruction. Les <b>causes secondaires extraveineuses (Ese)</b> élèvent la pression veineuse sans lésion de la veine elle-même. Il s’agit d’une compression iliaque, comme dans le syndrome de May-Thurner, d’une masse abdominale, d’une insuffisance cardiaque droite, d’une ankylose de cheville qui désactive la pompe du mollet, de l’immobilité et de l’obésité. Les <b>causes congénitales (Ec)</b> sont rares : le syndrome de Klippel-Trénaunay associe une malformation capillaire cutanée, des varices atypiques souvent latérales et une hypertrophie du membre.</p>
<h3>4.2 Facteurs de risque : mécanisme et force de la preuve</h3>
<p>Un facteur de risque n’a pas la même valeur selon qu’il est associé à la maladie ou qu’il la cause. La question pratique est la suivante : la correction du facteur modifie-t-elle l’évolution ? Le tableau confronte, pour chaque facteur, le mécanisme proposé et le niveau de preuve disponible.</p>
<table class="t"><tr><th>Facteur</th><th>Mécanisme proposé</th><th>Force de la preuve</th></tr>
<tr><td>Antécédents familiaux</td><td>Fragilité héréditaire de la paroi et des valvules ; de nombreux variants génétiques à petit effet</td><td>Association constante ; architecture génétique polygénique</td></tr>
<tr><td>Sexe féminin, grossesses</td><td>Hormones qui relâchent la paroi veineuse, hausse du volume sanguin, compression des veines iliaques par l’utérus</td><td>Association (rapport de cotes 2,26 pour le sexe) ; mécanismes plausibles, non démontrés chez l’humain</td></tr>
<tr><td>Âge</td><td>Usure de la paroi et des valvules, sédentarité</td><td>Association ; l’âge n’accélérait pas la progression dans l’Edinburgh Vein Study</td></tr>
<tr><td>Obésité</td><td>Pression intra-abdominale accrue, pompe du mollet moins utilisée</td><td>Association ; mécanisme hémodynamique bien décrit ; après chirurgie bariatrique, les lésions cutanées régressent (séries observationnelles)</td></tr>
<tr><td>Station debout prolongée</td><td>Pression hydrostatique maximale sans activation de la pompe du mollet</td><td>Association ; mécanisme physiologique établi</td></tr>
<tr><td>Grande taille</td><td>Colonne hydrostatique plus haute ; voies du développement vasculaire et squelettique</td><td>Lien probablement causal selon une étude de randomisation mendélienne</td></tr>
<tr><td>Thrombose veineuse profonde antérieure</td><td>Destruction valvulaire, obstruction résiduelle</td><td>Cause démontrée du syndrome post-thrombotique</td></tr></table>
<p>La dernière colonne se lit en premier. Seule la thrombose profonde est une cause établie ; les autres facteurs sont surtout des associations, dont certaines reposent sur un mécanisme physiologique solide. L’erreur fréquente consiste à promettre qu’un changement de profession ou une perte de poids empêchera les varices de progresser : aucune étude ne le démontre, et le bénéfice observé de la perte de poids porte sur la peau du patient obèse. Mme R. cumule plusieurs facteurs : sexe féminin, trois grossesses, mère opérée, IMC à 31 kg/m² et station debout professionnelle. Aucun ne se supprime totalement, mais son poids et son activité restent modifiables. Les mécanismes sont détaillés dans les fenêtres <button class="w" data-k="i83-fdr-hered">hérédité, âge, sexe et grossesses (association ou cause)</button> et <button class="w" data-k="i83-fdr-obesite">obésité et station debout prolongée (mécanisme et décision)</button>.</p>
<div class="key"><b>À retenir.</b> La plupart des varices sont primitives. Une cause secondaire, post-thrombotique ou compressive, oriente vers le réseau profond et vers une autre stratégie. Parmi les facteurs de risque, seule la thrombose antérieure est une cause démontrée ; l’obésité et la station debout ont un mécanisme hémodynamique clair et restent les seuls leviers modifiables. L’anamnèse recherche donc systématiquement ces causes et ces facteurs.</div>
</section>

<section class="ilot" id="i83-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse poursuit trois buts : rattacher les plaintes à une origine veineuse, repérer une cause secondaire et rechercher ce qui contre-indiquerait un traitement. Les symptômes veineux sont peu spécifiques ; la recherche des antécédents pèse donc autant que la description des plaintes.</p>
<h3>5.1 Antécédents</h3>
<p>Un antécédent de <b>thrombose veineuse profonde</b>, avec sa date, son siège et son traitement, oriente vers un syndrome post-thrombotique et vers une atteinte profonde. Une <b>thrombose veineuse superficielle</b> sur varice signale une maladie évolutive ; Mme R. en a eu une il y a deux ans, traitée sans échographie, alors que <button class="w" data-k="i83-tvs">la thrombose veineuse superficielle (bilan et décision)</button> impose une échographie de tout le membre. Les <b>grossesses</b> et les <b>antécédents familiaux</b> précisent le terrain. Une <b>chirurgie veineuse ou une sclérothérapie antérieure</b> fait évoquer une récidive (C&#8288;2r), dont le mécanisme diffère selon la technique.</p>
<p>Les <b>médicaments</b> sont passés en revue, car plusieurs provoquent un œdème des chevilles sans lien avec les veines ; l’amlodipine, que prend Mme R. à pleine dose, en est l’exemple le plus fréquent (fenêtre <button class="w" data-k="i83-x-oedeme">œdème veineux et autres œdèmes des jambes</button>). Le médecin recherche aussi un tabagisme, un diabète, une claudication artérielle ou une insuffisance cardiaque, parce qu’une artériopathie ou une insuffisance cardiaque sévère peut interdire la compression. Il note les allergies, notamment aux topiques et aux matériaux de contention, ainsi que la profession, la mobilité et l’usage d’un anticoagulant.</p>
<h3>5.2 Symptômes</h3>
<p>Les symptômes veineux sont variables et leur intensité ne reflète pas la gravité de l’hypertension veineuse. Ils peuvent exister sans aucun signe (C&#8288;0s) et manquer chez un patient porteur de varices étendues. Faute de fréquences vérifiées, ils sont rangés ci-dessous par valeur diagnostique, des plus évocateurs aux moins spécifiques.</p>
<table class="t"><tr><th>Symptôme</th><th>Caractères qui évoquent une origine veineuse</th><th>Valeur</th></tr>
<tr><td>Lourdeur, sensation de gonflement</td><td>Augmente le soir, à la chaleur et en station debout ; diminue à la marche et jambes surélevées</td><td>Évocateurs ; leur intensité croît avec la classe clinique</td></tr>
<tr><td>Douleur, brûlure, pesanteur</td><td>Aggravées par la station debout ou assise prolongée</td><td>Évocatrices si l’horaire est vespéral</td></tr>
<tr><td>Prurit</td><td>Localisé sur un trajet variqueux ou au-dessus de la cheville</td><td>Évocateur ; annonce parfois la dermite de stase</td></tr>
<tr><td>Fatigue des jambes, crampes nocturnes, jambes sans repos</td><td>Peu de caractères propres</td><td>Peu spécifiques ; d’autres causes sont fréquentes</td></tr>
<tr><td>Claudication veineuse</td><td>Douleur en éclatement de toute la jambe qui croît à la marche ; soulagée par le repos jambe surélevée</td><td>Rare ; évoque une obstruction ilio-fémorale ou cave</td></tr></table>
<p>La première colonne ne suffit pas : ce sont l’horaire et les facteurs de soulagement qui orientent vers une cause veineuse. Une lourdeur vespérale soulagée par la marche suit la physiologie de la pression veineuse ambulatoire ; une crampe isolée ne la suit pas. Mme R. décrit une lourdeur du soir depuis dix ans et un prurit sus-malléolaire, deux plaintes évocatrices. La caractérisation de chaque plainte figure dans la fenêtre <button class="w" data-k="i83-s-lourdeur">lourdeur, douleur, crampes, prurit (valeur des symptômes veineux)</button>, et la douleur d’effort dans la fenêtre <button class="w" data-k="i83-s-claud">claudication veineuse (penser à l’obstruction proximale)</button>.</p>
<h3>5.3 Formes typique et atypiques</h3>
<p>La topographie des varices et le contexte orientent vers la source du reflux. Les quatre présentations suivantes n’ont pas la même conduite diagnostique.</p>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Une femme d’âge moyen a des varices de la face interne de cuisse et de jambe, une lourdeur vespérale et un antécédent familial. La présentation évoque un reflux primitif de la grande saphène, comme chez Mme R. L’écho-Doppler confirme la source et prépare le traitement.</p></div>
<div class="card"><h4>Varices de la face postérieure de cuisse ou vulvaires</h4><p>Des varices partent du pli fessier, du périnée ou de la vulve, parfois après plusieurs grossesses. Leur trajet ne suit aucun tronc saphène, ce qui évoque une origine pelvienne. L’écho-Doppler cherche alors les points de fuite pelviens (îlot 12).</p></div>
<div class="card"><h4>Varices latérales dès l’enfance</h4><p>Des varices de la face externe du membre accompagnent une tache vasculaire cutanée ou une hypertrophie du membre. Ce tableau évoque une malformation congénitale, comme le syndrome de Klippel-Trénaunay. Une imagerie spécialisée précède toute intervention.</p></div>
<div class="card"><h4>Œdème unilatéral sans varice</h4><p>Un membre entier gonfle, avec une claudication veineuse ou des veines dilatées au-dessus du pubis. Ce tableau évoque une obstruction proximale, post-thrombotique ou compressive. L’examen du réseau iliaque et cave s’impose avant tout geste superficiel.</p></div></div>
<div class="key"><b>À retenir.</b> L’anamnèse recherche une thrombose antérieure, un médicament œdématogène, une artériopathie ou une insuffisance cardiaque, puis caractérise les symptômes par leur horaire et leurs facteurs de soulagement. Une topographie atypique oriente vers une origine pelvienne, congénitale ou proximale. Mme R. a un profil typique, mais son amlodipine et son ancienne thrombose superficielle doivent être prises en compte. L’examen debout confirme ou corrige ensuite ces hypothèses.</div>
</section>

<section class="ilot" id="i83-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Les veines incompétentes ne se remplissent que sous l’effet de la pesanteur. L’examen veineux se fait donc debout, sur un membre entièrement découvert, après quelques minutes d’orthostatisme et sous un bon éclairage. Il commence pourtant par une évaluation générale, car l’état du patient, ses artères et ses articulations conditionnent le diagnostic et la faisabilité des traitements.</p>
<div class="two">
<div class="card"><h4>État général, constantes et mesures</h4><p>Le médecin mesure le poids et la taille et calcule l’IMC, parce que l’obésité aggrave l’hypertension veineuse et rend les ponctions veineuses plus difficiles. Il mesure la pression artérielle, puisque l’antihypertenseur peut être en cause dans l’œdème. Il observe la marche et la mobilité de la cheville : une cheville enraidie ne fait plus fonctionner la pompe du mollet. Chez le sujet âgé, il vérifie que le patient pourra enfiler un bas de compression.</p></div>
<div class="card"><h4>Inspection debout</h4><p>Une varice de la face interne de cuisse et de jambe suit le territoire de la grande saphène ; une varice de la face postérieure du mollet suit la petite saphène. Une varice de la face antérieure et externe de la cuisse évoque la saphène accessoire antérieure. Le médecin recherche des cicatrices d’intervention antérieure, des veines dilatées au-dessus du pubis ou sur l’abdomen, qui signalent une obstruction iliaque ou cave, et des varices vulvaires. La technique est décrite dans la fenêtre <button class="w" data-k="i83-x-debout">examen veineux debout (technique et signes)</button>.</p></div>
<div class="card"><h4>Peau de la jambe et de la cheville</h4><p>Le médecin cote la classe clinique d’après la peau : pigmentation brune ou eczéma (C&#8288;4a), induration ou zones blanches cicatricielles (C&#8288;4b), éventail de veinules autour de la malléole (C&#8288;4c), cicatrice d’ulcère (C&#8288;5) ou ulcère ouvert (C&#8288;6). Les altérations siègent surtout au-dessus de la malléole interne, là où la pression veineuse est la plus forte et où débouchent des perforantes. Des photographies datées permettent de comparer l’évolution. Chaque signe est expliqué dans la fenêtre <button class="w" data-k="i83-x-peau">signes cutanés de l’insuffisance veineuse chronique</button>.</p></div>
<div class="card"><h4>Palpation et mesures</h4><p>Le médecin presse la face interne du tibia pendant quelques secondes : une empreinte persistante signe un œdème prenant le godet. Il palpe une induration, puis les pouls pédieux et tibiaux postérieurs ; des pouls perçus n’excluent pas une artériopathie, que l’index de pression précise. Il mesure les circonférences de cheville et de mollet des deux côtés, ce qui objective l’œdème et son évolution. Les caractères de l’œdème veineux sont détaillés dans la fenêtre <button class="w" data-k="i83-x-oedeme">œdème veineux et autres œdèmes des jambes</button>.</p></div></div>
<p>L’examen recherche enfin une autre cause des plaintes : une artériopathie, une arthrose du genou ou de la hanche, un kyste poplité, une maladie rhumatologique ou une atteinte neurologique, comme une radiculopathie ou une neuropathie. Les tests au garrot de Trendelenburg et de Perthes et le Doppler continu de poche ne localisent plus le reflux : ils ne montrent pas la veine, et l’écho-Doppler les a remplacés. Le Doppler de poche sert seulement à mesurer la pression de cheville.</p>
<p>Chez Mme R., debout, des varices de plus de 5 mm occupent la face interne de la cuisse et de la jambe gauches, dans le territoire de la grande saphène. La cheville gauche présente un œdème qui prend le godet, avec une circonférence de 26 cm contre 24 cm à droite. Une pigmentation brune et un eczéma recouvrent la région sus-malléolaire interne gauche, et une corona phlebectatica entoure la malléole interne. Il n’y a ni induration ni ulcère, et les pouls pédieux et tibiaux postérieurs sont perçus. Le membre droit ne porte que quelques veines réticulaires.</p>
<div class="trap"><span class="k">Piège</span>Examiner les varices sur un patient couché. Les veines incompétentes se vident en décubitus, et le médecin sous-estime alors l’étendue de la maladie ou méconnaît une varice de la face postérieure du mollet. L’inspection et la palpation des trajets se font toujours debout ; seules la palpation des pouls et l’examen général se font couché.</div>
<div class="key"><b>À retenir.</b> L’examen veineux se fait debout ; il établit la classe clinique d’après la peau, oriente vers le territoire en cause et objective l’œdème par la mesure des circonférences. Il recherche des collatérales sus-pubiennes, une artériopathie et une autre cause des plaintes. Les tests au garrot et le Doppler de poche ne localisent plus le reflux. L’écho-Doppler doit ensuite confirmer le reflux, et les maladies qui imitent l’insuffisance veineuse doivent être éliminées.</div>
</section>

<section class="ilot" id="i83-7"><h2><span class="n">7</span>Démarche diagnostique et diagnostics différentiels</h2>
<p>Le diagnostic de maladie veineuse chronique est clinique, mais la décision thérapeutique exige de connaître la source, l’étendue et le mécanisme de l’atteinte. Un tronc qui reflue ne se voit pas : seule l’imagerie le montre. L’ESVS recommande donc un <b>écho-Doppler veineux complet du membre inférieur</b> comme examen de première intention, pour le diagnostic et pour la planification du traitement (recommandation 3, classe I, niveau B). C’est l’examen de référence du cours.</p>
<h3>7.1 Algorithme</h3>
<p>Après l’anamnèse et l’examen debout, le médecin demande un écho-Doppler complet dès que la maladie veineuse est suspectée ou évidente. L’examen vérifie la perméabilité du réseau profond, puis recherche un reflux debout, provoqué par une manœuvre de Valsalva ou par la compression puis le relâchement du mollet. Un reflux superficiel est retenu au-delà de 0,5 s ; un reflux des veines fémorale commune, fémorale et poplitée, au-delà de 1 s. L’examen se termine par une cartographie dessinée du membre, indispensable avant tout traitement. Les autres examens ne répondent chacun qu’à une question précise.</p>
<table class="t"><tr><th>Question</th><th>Examen</th><th>Statut selon l’ESVS 2022</th></tr>
<tr><td>Existe-t-il un reflux ou une obstruction, et où ?</td><td>Écho-Doppler veineux complet du membre, debout</td><td>Examen de première intention (recommandation 3, classe I, niveau B)</td></tr>
<tr><td>Une obstruction au-dessus de l’aine est-elle suspectée ?</td><td>Échographie des veines abdominales et pelviennes</td><td>À envisager dès le bilan initial (recommandation 4, classe IIa, niveau C)</td></tr>
<tr><td>Une intervention sur une obstruction sus-inguinale est-elle envisagée ?</td><td>Imagerie veineuse en coupe par IRM ou par TDM</td><td>Recommandée en plus de l’écho-Doppler (recommandation 5, classe I, niveau C)</td></tr>
<tr><td>L’imagerie en coupe est-elle insuffisante ?</td><td>Phlébographie ou échographie endovasculaire</td><td>Envisageable chez des patients choisis (recommandation 6, classe IIb, niveau B)</td></tr>
<tr><td>Existe-t-il une artériopathie qui limite la compression ?</td><td>Pression de cheville et index de pression systolique cheville-bras</td><td>Mesurés avant la compression ; évaluation artérielle objective de tout ulcère (recommandation 68, classe I, niveau C)</td></tr></table>
<p>Seule la première ligne concerne tous les patients. Les lignes suivantes répondent à un indice précis : un œdème unilatéral étendu, des collatérales abdominales, une absence de modulation respiratoire du flux fémoral ou des séquelles de thrombose à l’écho-Doppler. L’erreur fréquente consiste à demander une imagerie en coupe pour une varice primitive typique ; elle n’ajoute rien et expose à l’irradiation ou au produit de contraste. Les seuils de reflux sont expliqués dans la fenêtre <button class="w" data-k="i83-duplex-reflux">seuils de reflux et manœuvres de provocation</button>, l’évaluation artérielle dans la fenêtre <button class="w" data-k="i83-ips">index de pression systolique cheville-bras et pression d’orteil</button>.</p>
<h3>7.2 Résultat chez Mme R.</h3>
<p>L’écho-Doppler debout du membre gauche montre des veines profondes perméables et compressibles, sans reflux ni séquelle post-thrombotique. La jonction saphéno-fémorale et la grande saphène refluent jusqu’à mi-jambe pendant 2,8 s, bien au-delà du seuil de 0,5 s. Le diamètre de la grande saphène mesure 7,5 mm à 15 cm de la jonction, et une collatérale variqueuse de jambe est alimentée par ce tronc. Une perforante jambière de 4 mm, située sous la zone pigmentée, présente un flux sortant de 0,6 s : elle dépasse les seuils habituels de diamètre et de durée. La petite saphène est continente. L’ancienne thrombose superficielle a laissé une collatérale partiellement recanalisée, sans extension.</p>
<p>Le membre gauche se décrit donc ainsi : <b>C&#8288;2,3,4a,c (s), Ep, As,p, Pr</b>. Les classes cliniques présentes sont les varices, l’œdème, la pigmentation avec eczéma et la corona phlebectatica, chez une patiente symptomatique. La cause est primitive, car le réseau profond est sain. L’atteinte est superficielle et perforante, et son mécanisme est un reflux, situé sur la grande saphène au-dessus et au-dessous du genou, sur une collatérale de jambe et sur une perforante jambière. Les altérations cutanées de classe C&#8288;4 placent Mme R. parmi les indications de traitement interventionnel, que discute l’îlot 10.</p>
<h3>7.3 Diagnostics différentiels</h3>
<p>Plusieurs maladies imitent l’œdème, la dermite ou l’ulcère veineux, et certaines menacent le membre ou la vie. Elles sont rangées par gravité décroissante, car le médecin élimine d’abord celles qu’il ne doit pas manquer.</p>
<table class="t"><tr><th>Diagnostic</th><th>Indices qui le distinguent</th><th>Conduite</th></tr>
<tr><td>Thrombose veineuse profonde</td><td>Œdème unilatéral récent, douleur du mollet, contexte à risque</td><td>Écho-Doppler sans délai ; prise en charge selon le cours I80 — Thrombose veineuse profonde et thromboses veineuses (C-01-Cardiologie)</td></tr>
<tr><td>Artériopathie, ulcère artériel</td><td>Douleur de décubitus soulagée jambe pendante, pouls absents, ulcère distal et creusant</td><td>Index de pression avant toute compression ; cours I70 — Athérosclérose périphérique, artériopathie des membres inférieurs et ischémie aiguë (C-01-Cardiologie)</td></tr>
<tr><td>Dermohypodermite bactérienne (érysipèle)</td><td>Placard rouge, chaud et douloureux d’apparition aiguë, fièvre, en général unilatéral</td><td>Antibiotique ; la dermite de stase, elle, est chronique, prurigineuse et sans fièvre</td></tr>
<tr><td>Insuffisance cardiaque, rénale ou hépatique</td><td>Œdème bilatéral et symétrique, dyspnée, turgescence jugulaire, protéinurie ou ascite</td><td>Bilan de l’organe en cause ; cours I50 — Insuffisance cardiaque (C-01-Cardiologie)</td></tr>
<tr><td>Œdème médicamenteux</td><td>Œdème bilatéral des chevilles apparu sous antagoniste calcique dihydropyridinique</td><td>Discussion du changement de traitement avec le prescripteur</td></tr>
<tr><td>Lymphœdème, lipœdème</td><td>Signe de Stemmer, atteinte du dos du pied ; ou dépôt graisseux symétrique qui épargne le pied</td><td>Cours I89 — Autres atteintes non infectieuses des vaisseaux et des ganglions lymphatiques (C-01-Cardiologie)</td></tr>
<tr><td>Ulcère d’autre cause</td><td>Siège atypique, bords irréguliers ou bourgeonnants, absence de cicatrisation malgré un traitement bien conduit</td><td>Biopsie à la recherche d’une vascularite, d’un pyoderma gangrenosum ou d’un carcinome</td></tr></table>
<p>La lecture commence par les deux premières lignes, qui conditionnent la sécurité : une thrombose profonde méconnue s’étend, et une compression posée sur une artériopathie sévère peut nécroser la peau. L’erreur fréquente consiste à traiter par antibiotique une dermite de stase ou une lipodermatosclérose aiguë, prises pour un érysipèle : leur caractère bilatéral, chronique et apyrétique les en distingue. Chez Mme R., l’œdème des deux chevilles sous amlodipine 10 mg par jour fait évoquer un œdème médicamenteux surajouté à l’œdème veineux gauche ; cette hypothèse n’exclut pas la maladie veineuse, démontrée par l’écho-Doppler.</p>
<div class="quiz ui"><p><b>Cas de Mme R.</b> L’eczéma sus-malléolaire gauche de Mme R. accompagne des varices de la grande saphène, un œdème de cheville et une corona phlebectatica. Quelle proposition décrit correctement son membre gauche ?</p>
<button data-ok="0">Classe C&#8288;3 seulement, car l’œdème domine le tableau</button>
<button data-ok="1">Classes C&#8288;2, C&#8288;3, C&#8288;4a et C&#8288;4c ; l’eczéma est une dermite de stase</button>
<button data-ok="0">Thrombophlébite superficielle, car l’eczéma traduit une inflammation de la veine</button>
<p class="fb" hidden>La notation complète énumère toutes les classes présentes, C&#8288;2,3,4a,c ; la notation élémentaire ne retiendrait que la plus élevée, C&#8288;4. L’eczéma et la pigmentation définissent C&#8288;4a, et la corona phlebectatica C&#8288;4c ; ces deux sous-classes de C&#8288;4 ne se hiérarchisent pas entre elles. Coter seulement C&#8288;3 omettrait les altérations cutanées, qui fondent l’indication de traitement ; de plus, une partie de cet œdème peut venir de l’amlodipine. L’eczéma sus-malléolaire est une dermite de stase, inflammation chronique de la peau ; une thrombophlébite superficielle est l’inflammation d’une veine thrombosée, qui n’est pas en cours chez Mme R.</p></div>
<div class="key"><b>À retenir.</b> L’écho-Doppler complet, réalisé debout, est l’examen de référence : il confirme le reflux, en donne la source et l’étendue, et aboutit à une cartographie. L’imagerie sus-inguinale répond à un indice précis, et l’évaluation artérielle précède la compression. Le diagnostic différentiel élimine d’abord la thrombose profonde et l’artériopathie, puis les œdèmes d’organe et médicamenteux. Mme R. a une maladie veineuse primitive avec altérations cutanées de classe C&#8288;4 (C&#8288;4a et C&#8288;4c) par reflux de la grande saphène, avec un probable œdème médicamenteux surajouté ; les complications aiguës et la conduite thérapeutique suivent.</div>
