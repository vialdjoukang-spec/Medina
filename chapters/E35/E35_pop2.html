<template data-pop="e35-hydrocortisone" data-title="Hydrocortisone — Solu-Cortef®">
<div class="lab">Mécanisme</div><p>L’hydrocortisone est le glucocorticoïde de substitution ; à forte dose, elle assure aussi l’effet minéralocorticoïde, ce qui suffit en urgence [Flück 2023].</p><div class="lab">Indication et posologie</div><p>Crise de l’adulte : 100 mg par voie intraveineuse ou intramusculaire, puis 200 mg par 24 heures [ESE 2024]. L’information professionnelle suisse mentionne l’insuffisance corticosurrénalienne aiguë et les états de choc réfractaires en cas d’insuffisance préexistante ou présumée ; dose initiale jusqu’à 100 mg par voie intraveineuse en 30 secondes au minimum ; doses suivantes toutes les 2, 4 ou 6 heures selon la réponse [Solu-Cortef®]. Enfant : 25, 50 ou 100 mg selon l’âge [Flück 2023].</p><div class="lab">Chirurgie et stress</div><p>Petite intervention : 200 mg par voie intraveineuse ; intervention moyenne : 100 mg puis 100 mg toutes les 6 heures pendant 24 heures ; chirurgie majeure : 100 mg puis toutes les 6 heures pendant au moins 72 heures [Solu-Cortef®].</p><div class="lab">Limites</div><p>L’information professionnelle ne formule pas les doses de crise comme un protocole [Solu-Cortef®]. Dans la maladie d’Addison, un minéralocorticoïde doit être ajouté [Solu-Cortef®]. Les effets indésirables sont décrits dans la notice et ne sont pas repris ici.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://academic.oup.com/ejendo/article/190/5/G25/7663654" target="_blank" rel="noopener">ESE/Endocrine Society 2024, Eur J Endocrinol 190(5)</a> ; Information professionnelle suisse Solu-Cortef® (consulté via AIPS, 15.10.2026), consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-fludro" data-title="Fludrocortisone — Florinef®">
<div class="lab">Mécanisme</div><p>Minéralocorticoïde de substitution dans l’insuffisance primaire, dont l’effet est environ cent fois celui de l’hydrocortisone [Florinef®].</p><div class="lab">Posologie</div><p>Adulte : 0,1 mg trois fois par semaine à 0,2 mg par jour, norme 0,1 mg par jour, associée à 10 à 37,5 mg de cortisone par jour ou équivalent ; ne pas dépasser 0,05 mg par jour en cas d’hypertension liée au traitement ; enfant 2 à 5 µg/kg par jour [Florinef®]. Selon la revue pédiatrique suisse, 50 à 200 µg par jour en une à deux prises, doses élevées surtout la première année [Flück 2023].</p><div class="lab">Précaution</div><p>Non indiquée dans l’insuffisance induite par les glucocorticoïdes [ESE 2024].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://academic.oup.com/ejendo/article/190/5/G25/7663654" target="_blank" rel="noopener">ESE/Endocrine Society 2024, Eur J Endocrinol 190(5)</a> ; Information professionnelle suisse Florinef® (consulté via AIPS, 15.10.2026), consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-ceftriaxone" data-title="Ceftriaxone — Rocephin®">
<div class="lab">Posologie</div><p>Adulte : 1 à 2 g par jour, jusqu’à 4 g par jour en infection sévère ; méningite de l’enfant : 100 mg/kg (maximum 4 g) en une prise par jour [Rocephin®].</p><div class="lab">Durée</div><p>Quatre jours est la durée associée aux meilleurs résultats pour <i>Neisseria meningitidis</i> dans la méningite de l’enfant [Rocephin®]. Durée adulte et prise en charge du sepsis méningococcique : non lues (la recommandation européenne de 2016 n’a pu être consultée).</p><div class="lab">Contre-indications</div><p>Prématuré jusqu’à 41 semaines post-menstruelles ; nouveau-né recevant du calcium par voie intraveineuse [Rocephin®].</p>
<p class="src">Références : Information professionnelle suisse Rocephin® (consulté via AIPS, 15.10.2026), consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-rifampicine" data-title="Rifampicine — Rimactan®">
<div class="lab">Mécanisme de l’interaction</div><p>Inducteur puissant du cytochrome P450 hépatique ; le métabolisme des substrats endogènes, dont les hormones surrénaliennes et les thyroxines, peut augmenter ; l’efficacité des corticostéroïdes est réduite [Rimactan® ; Guide suisse de la tuberculose].</p><div class="lab">Conséquences</div><p>Un patient tuberculeux sous hydrocortisone peut voir son insuffisance démasquée ; la contraception hormonale est inefficace pendant le traitement et un mois après [Guide suisse de la tuberculose].</p><div class="lab">Limite</div><p>L’information professionnelle ne donne pas de dose d’ajustement de l’hydrocortisone [Rimactan®].</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Tuberculose en Suisse, guide OFSP/Ligue pulmonaire</a> ; Information professionnelle suisse Rimactan® (consulté via AIPS, 15.10.2026), consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-antitb" data-title="Schéma antituberculeux standard">
<div class="lab">Schéma</div><p>Isoniazide, rifampicine, pyrazinamide et éthambutol pendant deux mois, puis isoniazide et rifampicine pendant quatre mois, pour toutes les formes sauf exceptions [Guide suisse de la tuberculose].</p><div class="lab">Exceptions</div><p>Méningite : 12 mois au total avec corticoïdes ; péricardite et tuberculose grave septique : corticoïdes les premières semaines ; <i>Mycobacterium bovis</i> : 9 mois [Guide suisse de la tuberculose]. Abcès thyroïdien : au moins 6 mois [Abcès thyroïdien tuberculeux, revue].</p><div class="lab">Déclaration</div><p>Tout cas traité est déclaré immédiatement au médecin cantonal [Guide suisse de la tuberculose].</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Tuberculose en Suisse, guide OFSP/Ligue pulmonaire</a> ; <a href="https://doi.org/10.3390/tropicalmed11030081" target="_blank" rel="noopener">Abcès thyroïdien tuberculeux, revue systématique (Trop Med Infect Dis 11)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-pep" data-title="Prophylaxie postexpositionnelle du méningocoque">
<div class="lab">Indication</div><p>Contacts étroits depuis 7 jours avant le début de la maladie jusqu’à 24 heures après le début du traitement du cas ; prophylaxie idéalement dans les 24 heures, au maximum 10 jours après l’exposition [OFSP 2025].</p><div class="lab">Posologie</div><p>Ciprofloxacine 20 mg/kg par voie orale, dose unique (maximum 500 mg) dès la naissance, sauf en grossesse ; rifampicine 10 mg/kg (maximum 600 mg) toutes les 12 heures pendant 2 jours (5 mg/kg avant 1 mois) ; ceftriaxone 125 mg par voie intramusculaire (≤ 12 ans) ou 250 mg (grossesse, > 12 ans) ; éradication de 90 à 95 % [OFSP 2025].</p><div class="lab">Allaitement</div><p>Toutes les options sont possibles [OFSP 2025].</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP 2025, contacts de méningococcie invasive (Bulletin de l’OFSP 4/2025)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-carte" data-title="Carte d’urgence et règles de stress">
<div class="lab">Principe</div><p>Tout patient (ou ses parents) porte une carte d’urgence et est formé à adapter le traitement ; une carte européenne standardisée existe, accompagnée d’hydrocortisone injectable [Flück 2023 ; ESE 2024 ; Husebye 2021].</p><div class="lab">Règles chez l’enfant</div><p>Fièvre de 38 à 39 °C : doubler l’hydrocortisone orale ; 39 °C ou plus : la tripler ; prise orale impossible : médecin ou conduite d’urgence ; retour à la dose habituelle dès la guérison (2 à 3 jours en général) [Flück 2023].</p><div class="lab">Règles chez l’adulte</div><p>Stress mineur : 40 mg par jour (20-10-10 mg) pendant 2 à 5 jours ; vomissements ou diarrhée persistants hors de l’hôpital : 100 mg par voie intramusculaire, répétable après 6 heures ; hospitalisation : 100 mg puis 200 mg par 24 heures [ESE 2024].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://academic.oup.com/ejendo/article/190/5/G25/7663654" target="_blank" rel="noopener">ESE/Endocrine Society 2024, Eur J Endocrinol 190(5)</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)00136-7" target="_blank" rel="noopener">Husebye, insuffisance surrénalienne (Lancet 397)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="pareto-e35-def" data-title="Pareto — Définition et fréquence">
<p class="ratio" data-cover="e35-0,e35-1,e35-2"></p><ul><li>E35 est une catégorie astérisque : elle se code avec un code dague (A18.7†, A18.8†, A39.1†) et ne s’emploie jamais seule [BfArM].</li><li>La crise surrénalienne est un diagnostic clinique : hypotension ou choc plus un signe parmi quatre [ESE 2024].</li><li>En Suisse : environ 48 méningococcies invasives par an, létalité 5 à 15 % [OFSP 2025].</li><li>Syndrome de Waterhouse-Friderichsen : mortalité 55 à 60 % [Święch 2025].</li></ul></template>
<template data-pop="pareto-e35-meca" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="e35-3"></p><ul><li>Le cortex produit cortisol et aldostérone ; sa destruction les supprime ensemble dans l’atteinte primaire [Flück 2023].</li><li>Une seule veine drainant 50 à 60 branches explique la vulnérabilité à l’hémorragie [Święch 2025].</li><li>L’hormone adrénocorticotrope élevée stimule l’hormone mélanotrope et brunit la peau [Flück 2023].</li></ul></template>
<template data-pop="pareto-e35-causes" data-title="Pareto — Causes et risque">
<p class="ratio" data-cover="e35-4"></p><ul><li>L’infection n’est qu’une famille de causes ; la plus fréquente de l’adulte reste l’adrénalite auto-immune [Flück 2023].</li><li>Tuberculose et histoplasmose sont les agents infectieux les plus fréquents de la surrénale [Wannachalee].</li><li>Hémorragie : traumatisme (≈ 80 %), anticoagulants, syndrome des antiphospholipides [Święch 2025].</li></ul></template>
<template data-pop="pareto-e35-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="e35-5,e35-6"></p><ul><li>Signes chroniques non spécifiques : fatigue, perte de poids, hypotension orthostatique ; en primaire, appétit pour le sel et hyperpigmentation [Husebye 2021].</li><li>La crise associe hypotension ou choc à nausées, vomissements, fièvre ou trouble de la conscience [ESE 2024].</li><li>Syndrome de Waterhouse-Friderichsen : purpura pétéchial et choc [Rijal].</li></ul></template>
<template data-pop="pareto-e35-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="e35-7"></p><ul><li>Reconnaître la crise, traiter, prélever si possible, puis établir l’insuffisance et la cause [ESE 2024].</li><li>Cortisol à 8 h < 140 nmol/L : suspect ; hormone adrénocorticotrope > 2 fois la limite supérieure : primaire [Flück 2023].</li><li>Biopsie et culture : preuve de l’étiologie infectieuse [Wannachalee].</li></ul></template>
<template data-pop="pareto-e35-urgences" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="e35-8"></p><ul><li>Crise : hydrocortisone 100 mg, puis 200 mg par 24 heures, remplissage, sans attendre le laboratoire [ESE 2024].</li><li>Waterhouse-Friderichsen : hospitalisation immédiate, déclaration en 24 heures [OFSP 2025].</li></ul></template>
<template data-pop="pareto-e35-trt" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="e35-9"></p><ul><li>Traiter la crise, l’agent infectieux et substituer en chronique (glucocorticoïde et fludrocortisone) [Flück 2023 ; Florinef®].</li><li>Rifampicine : inducteur enzymatique qui réduit l’efficacité des corticostéroïdes [Rimactan®].</li><li>Cartes d’urgence et règles de stress pour prévenir la crise [Flück 2023 ; ESE 2024].</li></ul></template>
<template data-pop="pareto-e35-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e35-e-1,e35-e-2,e35-e-3,e35-e-4"></p><ul><li>Le diagnostic de crise est clinique ; le laboratoire confirme après coup [ESE 2024].</li><li>Test à l’hormone adrénocorticotrope : pic attendu supérieur à 400–500 nmol/L [Flück 2023].</li><li>Scanner : lésions bilatérales hypodenses ; biopsie : référence étiologique [Wannachalee].</li></ul></template>
<template data-pop="pareto-e35-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="e35-s-anat-cours"></p><ul><li>Trois artères, plexus sous-capsulaire, une veine [Święch 2025].</li></ul></template>
<template data-pop="pareto-e35-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="e35-s-histo-cours"></p><ul><li>Granulomes et nécrose dans les infections ; hémorragie dans le syndrome de Waterhouse-Friderichsen [Wannachalee ; Waterhouse-Friderichsen, revue médico-légale].</li></ul></template>
<template data-pop="pareto-e35-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e35-s-physio-cours"></p><ul><li>Cortisol bas : hormone adrénocorticotrope haute, pigmentation (atteinte primaire) [Flück 2023].</li></ul></template>
<template data-pop="pareto-e35-micro" data-title="Pareto — Microbiologie">
<p class="ratio" data-cover="e35-s-micro-cours"></p><ul><li><i>Mycobacterium tuberculosis</i>, <i>Histoplasma capsulatum</i>, <i>Neisseria meningitidis</i> [Wannachalee ; OFSP 2025].</li></ul></template>
<template data-pop="pareto-e35-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e35-p-1,e35-p-2,e35-p-3,e35-p-4"></p><ul><li>Hydrocortisone en crise ; fludrocortisone en chronique primaire [ESE 2024 ; Florinef®].</li><li>Ceftriaxone pour le méningocoque ; schéma standard pour la tuberculose [Rocephin® ; Guide suisse de la tuberculose].</li><li>Rifampicine : interactions avec les corticostéroïdes et la contraception [Guide suisse de la tuberculose ; Rimactan®].</li></ul></template>
