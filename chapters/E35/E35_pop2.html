<template data-pop="pareto-e35-1" data-title="Essentiel — Deux mécanismes à traiter ensemble"><p>L’infection et la défaillance endocrine peuvent coexister. Traiter l’une n’autorise pas à attendre pour l’autre [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p class="ratio" data-cover="e35-1"></p>
</template>
<template data-pop="pareto-e35-2" data-title="Essentiel — Définition et double codage"><p>L’astérisque documente une manifestation ; il ne remplace jamais la cause. Le libellé ne prescrit pas le traitement [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>].</p>
<p class="ratio" data-cover="e35-2"></p>
</template>
<template data-pop="pareto-e35-3" data-title="Essentiel — Épidémiologie : ne pas mesurer la mauvaise maladie"><p>L’incidence de l’infection causale n’est pas celle de sa complication endocrine. Chaque chiffre garde sa période et son dénominateur [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e35-3"></p>
</template>
<template data-pop="pareto-e35-4" data-title="Essentiel — Du fonctionnement normal à la défaillance"><p>L’organe, le niveau de l’atteinte et la réserve expliquent le tableau. Cortex, médulla et thyroïde ne sont pas interchangeables [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
<p class="ratio" data-cover="e35-4"></p>
</template>
<template data-pop="pareto-e35-5" data-title="Essentiel — Mécanismes, causes et diagnostics voisins"><p>Distinguer cause glandulaire, déclencheur d’une crise et diagnostic voisin. Le déclencheur n’est pas toujours l’étiologie du déficit [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-5"></p>
</template>
<template data-pop="pareto-e35-6" data-title="Essentiel — Anamnèse : chronologie, traitements et absorption"><p>Le traitement reçu, celui réellement absorbé et son calendrier font partie du diagnostic. Une infection peut révéler un déficit préexistant [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-6"></p>
</template>
<template data-pop="pareto-e35-7" data-title="Essentiel — Examen clinique et sémiologie"><p>La gravité précède l’étiquette. Ni absence de pigmentation ni ionogramme normal ne permettent d’attendre devant une crise plausible [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-7"></p>
</template>
<template data-pop="pareto-e35-8" data-title="Essentiel — Urgence : agir sans attendre la preuve"><p>Prélèvements si possibles, traitement sans délai indu. Le protocole adulte n’est pas une prescription universelle pédiatrique [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-8"></p>
</template>
<template data-pop="pareto-e35-9" data-title="Essentiel — Diagnostic : confirmer la fonction et la cause"><p>La fonction endocrine et l’étiologie sont deux preuves complémentaires. Image, histologie et microbiologie ne se remplacent pas [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e35-9"></p>
</template>
<template data-pop="pareto-e35-10" data-title="Essentiel — Prise en charge selon la situation"><p>Traiter la cause et remplacer ce qui manque, avec un niveau de soins adapté. Une guérison microbiologique ne garantit pas la récupération glandulaire [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<p class="ratio" data-cover="e35-10"></p>
</template>
<template data-pop="pareto-e35-11" data-title="Essentiel — Contacts, prophylaxie et santé publique suisse"><p>Prophylaxie d’un contact sain et traitement d’un cas malade ont des objectifs et des doses différents [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e35-11"></p>
</template>
<template data-pop="pareto-e35-12" data-title="Essentiel — Suivi, pronostic et prévention des crises"><p>Suivre l’infection, la lésion et la réserve hormonale séparément. Le plan d’urgence doit pouvoir être appliqué au moment utile [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-12"></p>
</template>
<template data-pop="pareto-e35-13" data-title="Essentiel — Populations particulières et choix du produit"><p>La population et la formulation font partie de chaque prescription. L’urgence vitale et les précautions du suivi ne sont pas opposées [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-13"></p>
</template>
<template data-pop="pareto-e35-14" data-title="Essentiel — Critères et pièges de raisonnement"><p>Une donnée n’a de sens qu’avec sa méthode, sa population et sa question. Expliquer l’incertitude prépare une meilleure décision [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-14"></p>
</template>
<template data-pop="pareto-e35-e-1" data-title="Essentiel — Choisir l’examen qui change la décision"><p>La question précède le test. La réanimation et le traitement causal ne sont pas suspendus pour obtenir une valeur parfaite [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p class="ratio" data-cover="e35-e-1"></p>
</template>
<template data-pop="pareto-e35-e-2" data-title="Essentiel — Cortisol et ionogramme : contexte et méthode"><p>Le résultat doit garder son heure, sa méthode et l’exposition médicamenteuse. Aucun seuil stable ne neutralise un tableau de crise [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p class="ratio" data-cover="e35-e-2"></p>
</template>
<template data-pop="pareto-e35-e-3" data-title="Essentiel — Imagerie, tissus et microbiologie"><p>Le prélèvement doit prouver ce que l’on cherche. La morphologie, l’espèce et la sensibilité thérapeutique sont trois informations différentes [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e35-e-3"></p>
</template>
<template data-pop="pareto-e35-e-4" data-title="Essentiel — Quatre exercices de raisonnement"><p>Urgence, population, fonction et statut d’un produit sont quatre questions qui ne se remplacent pas [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e35-e-4"></p>
</template>
<template data-pop="pareto-e35-s-anat-cours" data-title="Essentiel — Anatomie : un organe, deux compartiments"><p>Topographie, vascularisation et compartiments expliquent les questions de l’examen. La planche normale ne démontre pas la maladie du patient [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p class="ratio" data-cover="e35-s-anat-cours"></p>
</template>
<template data-pop="pareto-e35-s-histo-cours" data-title="Essentiel — Histologie : du compartiment normal à la lésion"><p>L’architecture, le site prélevé et la preuve microbiologique se complètent. Une image normale pédagogique ne classifie pas une lésion réelle [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p class="ratio" data-cover="e35-s-histo-cours"></p>
</template>
<template data-pop="pareto-e35-s-physio-cours" data-title="Essentiel — Physiologie : réserve et réponse au stress"><p>Le besoin augmente pendant le stress, mais les hormones n’ont pas toutes la même régulation ni le même ajustement [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>].</p>
<p class="ratio" data-cover="e35-s-physio-cours"></p>
</template>
<template data-pop="pareto-e35-s-bioch-cours" data-title="Essentiel — Biochimie : mesurer le bon signal"><p>Résultat hormonal, exposition au médicament et preuve du germe ont des objets différents ; l’un ne remplace pas les autres [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-s-bioch-cours"></p>
</template>
<template data-pop="pareto-e35-s-gene-cours" data-title="Essentiel — Génétique et immunologie : hôte, pathogène et terrain"><p>Hôte, agent et médicament influencent le tableau par des mécanismes différents ; une infection révélatrice n’est pas forcément la cause initiale du déficit [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>].</p>
<p class="ratio" data-cover="e35-s-gene-cours"></p>
</template>
<template data-pop="pareto-e35-p-1" data-title="Essentiel — Hydrocortisone d’urgence : voie et population"><p>Dose initiale, voie, concentration et population sont vérifiées ensemble. Pas de 100 mg uniforme chez le nouveau-né [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p class="ratio" data-cover="e35-p-1"></p>
</template>
<template data-pop="pareto-e35-p-2" data-title="Essentiel — Relais oral et déficit minéralocorticoïde"><p>Le relais et les deux remplacements sont individualisés. Le contrôle de l’infection ne permet pas d’arrêter automatiquement les hormones [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<p class="ratio" data-cover="e35-p-2"></p>
</template>
<template data-pop="pareto-e35-p-3" data-title="Essentiel — Ceftriaxone : malade et contact sain"><p>Deux doses très différentes peuvent avoir le même nom de produit : toujours préciser si l’on traite une infection ou un contact sain [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</p>
<p class="ratio" data-cover="e35-p-3"></p>
</template>
<template data-pop="pareto-e35-p-4" data-title="Essentiel — Rifampicine : prophylaxie, tuberculose et interactions"><p>Même molécule, deux indications et deux durées différentes. L’interaction peut révéler ou aggraver une insuffisance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p class="ratio" data-cover="e35-p-4"></p>
</template>
<template data-pop="pareto-e35-p-5" data-title="Essentiel — Ciprofloxacine : divergence entre protocole et FI"><p>Une directive et une FI répondent à des questions différentes. Les désaccords doivent rester explicites, surtout en pédiatrie et allaitement [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p class="ratio" data-cover="e35-p-5"></p>
</template>
<template data-pop="pareto-e35-p-6" data-title="Essentiel — Coordonner les traitements et le suivi"><p>La sécurité repose aussi sur une coordination compréhensible et un plan appliqué, pas seulement sur une dose exacte sur papier [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>].</p>
<p class="ratio" data-cover="e35-p-6"></p>
</template>
