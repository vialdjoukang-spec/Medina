<template data-pop="e35-dague" data-title="Double codage dague-astérisque">
<div class="lab">Principe</div><p>Le code dague (†) classe la maladie par son étiologie et peut être utilisé seul. Le code astérisque (*) désigne la manifestation dans un organe et ne s’emploie jamais seul : il vient toujours en complément d’un code dague [BfArM].</p><div class="lab">Application à la catégorie</div><p>E35.1* (surrénale) se code avec A18.7† (tuberculose surrénalienne) ou A39.1† (syndrome de Waterhouse-Friderichsen méningococcique) ; E35.0* (thyroïde) avec A18.8† (tuberculose thyroïdienne) [BfArM 2024]. Le code d’origine infectieuse décrit la maladie, le code d’organe décrit ce qu’elle fait à la glande.</p><div class="lab">Limite</div><p>E35.8* ne porte aucun exemple dans la version 2024 ; la source consultée est la version allemande de la classification, la pratique suisse du double codage n’ayant pas été vérifiée [BfArM 2024 ; BfArM].</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc E20–E35 (BfArM)</a> ; <a href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">CIM-10-GM, structure dague-astérisque (BfArM)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-is-def" data-title="Insuffisance surrénalienne : niveaux primaire, secondaire, tertiaire">
<div class="lab">Définition</div><p>L’insuffisance surrénalienne est une sécrétion insuffisante de glucocorticoïdes et, selon le niveau, de minéralocorticoïdes. Elle est primaire (cortex), secondaire (hypophyse, déficit en hormone adrénocorticotrope) ou tertiaire (hypothalamus, déficit en corticolibérine) [Flück 2023 ; Husebye 2021].</p><div class="lab">Pourquoi le niveau compte</div><p>L’aldostérone dépend du système rénine-angiotensine et du sodium et du potassium ; seule l’atteinte primaire est donc associée à un déficit minéralocorticoïde [Flück 2023]. Les formes infectieuses (tuberculose, hémorragie) détruisent le cortex et sont primaires.</p><div class="lab">Piège</div><p>Les signes sont non spécifiques ; le diagnostic est souvent retardé [Flück 2023 ; Husebye 2021].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)00136-7" target="_blank" rel="noopener">Husebye, insuffisance surrénalienne (Lancet 397)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-crise" data-title="Crise surrénalienne : définition et conduite">
<div class="lab">Définition</div><p>La crise surrénalienne (insuffisance surrénalienne aiguë) est une urgence vitale. Son diagnostic est clinique : hypotension ou choc hypovolémique, plus au moins un signe parmi nausées ou vomissements, fatigue sévère, fièvre et altération de la conscience [ESE 2024].</p><div class="lab">Conduite</div><p>L’hydrocortisone est donnée immédiatement, sans attendre le laboratoire ni l’imagerie : 100 mg par voie intraveineuse ou intramusculaire chez l’adulte, puis 200 mg par 24 heures ; remplissage rapide par chlorure de sodium à 0,9 % [ESE 2024]. Chez l’enfant, 25, 50 ou 100 mg selon l’âge [Flück 2023].</p><div class="lab">Pourquoi traiter avant de prouver</div><p>Le dosage du cortisol confirme l’insuffisance mais n’est pas nécessaire pour décider de la dose de crise ; le diagnostic peut toujours être complété après le traitement [Flück 2023 ; ESE 2024]. Cet argument est celui des sources lues ; il n’a pas été chiffré en bénéfice absolu.</p><div class="lab">Aide pédagogique, non critère officiel</div><p>Mémoire de l’ordre : prélever si possible, traiter tout de suite, chercher la cause ensuite.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://academic.oup.com/ejendo/article/190/5/G25/7663654" target="_blank" rel="noopener">ESE/Endocrine Society 2024, Eur J Endocrinol 190(5)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-swf" data-title="Syndrome de Waterhouse-Friderichsen">
<div class="lab">Définition</div><p>État septique fulminant avec hémorragie surrénalienne bilatérale et dégradation clinique rapide ; classiquement méningococcique, avec des cas mortels dus à d’autres agents [Waterhouse-Friderichsen, revue médico-légale ; Rijal]. Seul le syndrome méningococcique est explicitement rattaché à A39.1† et E35.1* [BfArM 2024].</p><div class="lab">Tableau</div><p>Début aigu : choc, purpura pétéchial, douleur abdominale, céphalées, fatigue, vomissements ; pronostic sombre malgré le traitement [Rijal]. La mortalité associée à l’hémorragie surrénalienne du syndrome est de 55 à 60 % [Święch 2025].</p><div class="lab">Mécanisme</div><p>Voir la physiopathologie : stase de l’unique veine surrénalienne sous l’effet des catécholamines, nécrose ischémique et hémorragie à la reperfusion, avec lésions de coagulation intravasculaire disséminée [Święch 2025 ; Waterhouse-Friderichsen, revue médico-légale].</p><div class="lab">Limite des sources</div><p>Aucune source suisse sur le syndrome lui-même ; revues américaine et médico-légale italienne utilisées à titre descriptif [Waterhouse-Friderichsen, revue médico-légale ; Rijal].</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc E20–E35 (BfArM)</a> ; <a href="https://doi.org/10.1007/s00414-026-03978-9" target="_blank" rel="noopener">Syndrome de Waterhouse-Friderichsen mortel à l’autopsie (Int J Legal Med)</a> ; <a href="https://doi.org/10.1016/bs.vh.2023.06.001" target="_blank" rel="noopener">Rijal, syndrome de Waterhouse-Friderichsen (Vitam Horm 124)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-tb-thyro" data-title="Tuberculose thyroïdienne">
<div class="lab">Définition</div><p>Forme rare de tuberculose extrapulmonaire, primaire ou secondaire ; environ 0,1 à 0,4 % des maladies thyroïdiennes dans une série chinoise (estimation) [Tuberculose thyroïdienne, série ; Cas de tuberculose thyroïdienne].</p><div class="lab">Présentation</div><p>Tuméfaction cervicale ou nodule suspect (TI-RADS 4) ; la cytologie peut évoquer un néoplasme et le diagnostic est souvent fait sur pièce opératoire [Tuberculose thyroïdienne, série ; Cas de tuberculose thyroïdienne ; Cas de néoplasme folliculaire apparent]. Un abcès thyroïdien tuberculeux conserve l’euthyroïdie et guérit dans 92 % des cas publiés ; une hypothyroïdie est exceptionnelle [Abcès thyroïdien tuberculeux, revue ; Gaur].</p><div class="lab">Piège</div><p>Prendre un granulome pour un carcinome papillaire ou un néoplasme folliculaire ; les données reposent sur des cas cliniques et une revue de 33 patients, avec biais de publication [Cas de tuberculose thyroïdienne ; Cas de néoplasme folliculaire apparent ; Abcès thyroïdien tuberculeux, revue].</p>
<p class="src">Références : <a href="https://doi.org/10.3389/fsurg.2026.1889766" target="_blank" rel="noopener">Tuberculose thyroïdienne et lymphadénite (Front Surg)</a> ; <a href="https://doi.org/10.2147/IMCRJ.S553344" target="_blank" rel="noopener">Tuberculose thyroïdienne prise pour un carcinome papillaire (Int Med Case Rep J 18)</a> ; <a href="https://doi.org/10.7759/cureus.100321" target="_blank" rel="noopener">Tuberculose thyroïdienne et néoplasme folliculaire (Cureus 17)</a> ; <a href="https://doi.org/10.3390/tropicalmed11030081" target="_blank" rel="noopener">Abcès thyroïdien tuberculeux, revue systématique (Trop Med Infect Dis 11)</a> ; <a href="https://doi.org/10.1016/j.diagmicrobio.2026.117408" target="_blank" rel="noopener">Tuberculose thyroïdienne de l’enfant (Diagn Microbiol Infect Dis 115)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-axe" data-title="Axe hypothalamo-hypophyso-surrénalien">
<div class="lab">Principe</div><p>L’hormone de libération de la corticotrophine stimule l’hormone adrénocorticotrope, qui stimule le cortisol, lequel freine les deux étages supérieurs [Flück 2023].</p><div class="lab">Conséquence</div><p>Si le cortex est détruit, le rétrocontrôle disparaît : l’hormone adrénocorticotrope augmente. Si l’hypophyse est atteinte, elle diminue. Cette différence fonde le dosage de l’hormone adrénocorticotrope [Flück 2023].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-minero" data-title="Déficit minéralocorticoïde">
<div class="lab">Mécanisme</div><p>L’aldostérone est régulée par le système rénine-angiotensine et par le sodium et le potassium ; la destruction du cortex la supprime, d’où hyponatrémie, hyperkaliémie et rénine élevée [Flück 2023].</p><div class="lab">Preuve</div><p>Rénine élevée avec aldostérone basse prouve le déficit [Flück 2023].</p><div class="lab">Traitement</div><p>Fludrocortisone en substitution chronique ; en urgence, l’hydrocortisone à forte dose couvre l’effet minéralocorticoïde [Flück 2023 ; Florinef®].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; Information professionnelle suisse Florinef® (consulté via AIPS, 15.10.2026), consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-barrage" data-title="Barrage vasculaire de la surrénale">
<div class="lab">Anatomie</div><p>Trois artères aboutissent à 50 à 60 petites branches formant un plexus sous-capsulaire ; une seule veine drainante : le barrage vasculaire [Święch 2025].</p><div class="lab">Conséquence</div><p>La stase veineuse favorise l’hémorragie ; le cortex est particulièrement exposé à cause du plexus sous-capsulaire [Święch 2025].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-hemorragie" data-title="Hémorragie à la reperfusion">
<div class="lab">Mécanisme</div><p>La paroi de la veine surrénalienne est riche en cellules musculaires lisses longitudinales sensibles aux catécholamines. Leur contraction augmente la résistance veineuse et provoque une stase ; les artérioles subissent une nécrose ischémique, puis saignent lors de la reperfusion. Les catécholamines favorisent aussi l’agrégation plaquettaire et la thrombose de la veine [Święch 2025].</p><div class="lab">Limite</div><p>Mécanisme issu d’une revue structurée à orientation chirurgicale, à biais modéré [Święch 2025].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-granulome" data-title="Inflammation granulomateuse">
<div class="lab">Définition</div><p>Dans la tuberculose et l’histoplasmose, les surrénales présentent une inflammation granulomateuse avec nécrose et destruction de la glande ; la phase tardive montre atrophie et calcifications [Wannachalee].</p><div class="lab">Lecture clinique</div><p>Le déficit hormonal peut être précédé de symptômes systémiques ; la surveillance hormonale longitudinale est nécessaire si la réserve est conservée au départ [Wannachalee].</p>
<p class="src">Références : <a href="https://doi.org/10.1111/cen.70222" target="_blank" rel="noopener">Wannachalee, infections surrénaliennes (Clin Endocrinol)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-msh" data-title="Hormone mélanotrope et pigmentation">
<div class="lab">Mécanisme</div><p>L’excès d’hormone adrénocorticotrope stimule parallèlement l’hormone mélanotrope, ce qui provoque après un certain temps une coloration bronzée de la peau et des plis [Flück 2023].</p><div class="lab">Valeur diagnostique</div><p>Le signe distingue l’insuffisance primaire de la secondaire [Flück 2023].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-chronique" data-title="Symptômes de l’insuffisance chronique">
<div class="lab">Signes cardinaux</div><p>Perte de poids involontaire, anorexie, hypotension orthostatique, fatigue profonde, douleurs musculaires et abdominales, hyponatrémie ; en primaire, hyperpigmentation et appétit pour le sel [Husebye 2021]. Chez l’enfant : baisse de concentration et de performance, faiblesse, anémie, lignes cutanées brunes, cicatrices pigmentées [Flück 2023].</p><div class="lab">Piège</div><p>Signes non spécifiques ; retard diagnostique supérieur à six mois chez la moitié des patients (donnée descriptive d’une revue américaine) [Murray].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://doi.org/10.1016/j.amjmed.2026.07.022" target="_blank" rel="noopener">Murray, infections des surrénales (Am J Med)</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)00136-7" target="_blank" rel="noopener">Husebye, insuffisance surrénalienne (Lancet 397)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-sel" data-title="Appétit pour le sel">
<div class="lab">Observation</div><p>L’appétit pour le sel fait partie des signes de l’insuffisance primaire [Husebye 2021]. Il s’associe à l’hyponatrémie du déficit minéralocorticoïde [Flück 2023].</p><div class="lab">Raisonnement</div><p>La relation causale entre perte de sodium et appétit pour le sel n’est pas détaillée dans les sources lues ; elle est proposée comme explication plausible, non comme fait démontré ici.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)00136-7" target="_blank" rel="noopener">Husebye, insuffisance surrénalienne (Lancet 397)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-pigment" data-title="Hyperpigmentation : où et quand">
<div class="lab">Description</div><p>Teint anormalement brun, plis cutanés et cicatrices pigmentés, lignes brunes chez l’enfant [Flück 2023].</p><div class="lab">Pourquoi</div><p>Excès d’hormone adrénocorticotrope puis activation de l’hormone mélanotrope, sur la durée [Flück 2023].</p><div class="lab">Limite</div><p>Absente dans les formes aiguës et secondaires.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-crise-clin" data-title="Signes cliniques de la crise">
<div class="lab">Tableau</div><p>Nausées, vomissements, douleurs abdominales, collapsus, hypoglycémie, troubles électrolytiques, déshydratation, fièvre, troubles de la vigilance, troubles du rythme [Flück 2023]. Survient chez environ la moitié des patients après le diagnostic [Husebye 2021].</p><div class="lab">Enfant</div><p>Les infections sévères et gastro-entérites déclenchent la crise [Flück 2023].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)00136-7" target="_blank" rel="noopener">Husebye, insuffisance surrénalienne (Lancet 397)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-vitaux" data-title="Signes vitaux et orthostatisme">
<div class="lab">Technique</div><p>Pression artérielle couchée puis debout, fréquence cardiaque, température. L’hypotension orthostatique fait partie du tableau chronique [Husebye 2021] ; l’hypotension ou le choc hypovolémique, avec fièvre éventuelle, fait partie de la définition de la crise [ESE 2024].</p><div class="lab">Piège</div><p>Les seuils chiffrés d’hypotension orthostatique n’ont pas été lus dans le dossier ; le cours n’en donne pas.</p>
<p class="src">Références : <a href="https://academic.oup.com/ejendo/article/190/5/G25/7663654" target="_blank" rel="noopener">ESE/Endocrine Society 2024, Eur J Endocrinol 190(5)</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)00136-7" target="_blank" rel="noopener">Husebye, insuffisance surrénalienne (Lancet 397)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-cortisol" data-title="Cortisol sérique du matin">
<div class="lab">Valeur</div><p>Un cortisol à jeun à 8 h inférieur à 140 nmol/L est suspect et doit être exploré, en état de santé [Flück 2023].</p><div class="lab">Conditions</div><p>Les normes sont propres à chaque immunodosage ; en situation de stress, des valeurs nettement plus élevées sont attendues [Flück 2023]. Après une corticothérapie, un cortisol matinal supérieur à 300 nmol/L indique un axe récupéré [ESE 2024].</p><div class="lab">Erreur fréquente</div><p>Juger un chiffre isolé sans tenir compte du contexte et de la technique de dosage.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://academic.oup.com/ejendo/article/190/5/G25/7663654" target="_blank" rel="noopener">ESE/Endocrine Society 2024, Eur J Endocrinol 190(5)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-acth-test" data-title="Test à l’hormone adrénocorticotrope">
<div class="lab">Technique</div><p>Bolus intraveineux d’environ 250 µg/1,73 m² (maximum 250 µg) ; cortisol à 30 ou 60 minutes ; réponse attendue supérieure à 400–500 nmol/L [Flück 2023].</p><div class="lab">Interprétation</div><p>Le guide 2024 retient un pic inférieur à 500 nmol/L comme indicatif d’insuffisance, selon le dosage [ESE 2024].</p><div class="lab">Limite</div><p>Seuils propres à chaque immunodosage ; ce test se pratique hors urgence.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://academic.oup.com/ejendo/article/190/5/G25/7663654" target="_blank" rel="noopener">ESE/Endocrine Society 2024, Eur J Endocrinol 190(5)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-acth-dosage" data-title="Hormone adrénocorticotrope plasmatique">
<div class="lab">Lecture</div><p>Supérieure à 2 fois la limite supérieure : insuffisance primaire ; élevée avec cortisol bas-normal : insuffisance primaire infraclinique ; basse avec cortisol bas : insuffisance secondaire [Flück 2023].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-renine" data-title="Rénine, aldostérone et électrolytes">
<div class="lab">Lecture</div><p>Hyponatrémie et hyperkaliémie orientent ; rénine élevée avec aldostérone basse prouve le déficit minéralocorticoïde ; ces dosages se font toujours dans l’insuffisance primaire [Flück 2023].</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-tdm" data-title="Scanner des surrénales">
<div class="lab">Aspect</div><p>Infection : lésions bilatérales hypodenses à nécrose centrale, rehaussement périphérique en anneau, calcifications ; phase tardive : atrophie avec calcifications [Wannachalee]. Hémorragie aiguë ou subaiguë : 50 à 90 unités Hounsfield [Święch 2025].</p><div class="lab">Piège</div><p>Un lymphome primaire donne aussi des masses bilatérales [Ma].</p>
<p class="src">Références : <a href="https://doi.org/10.1111/cen.70222" target="_blank" rel="noopener">Wannachalee, infections surrénaliennes (Clin Endocrinol)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a> ; <a href="https://doi.org/10.1007/s12020-026-04823-0" target="_blank" rel="noopener">Lymphome surrénalien primaire (Endocrine 91)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-biopsie" data-title="Biopsie surrénalienne ou thyroïdienne">
<div class="lab">Rôle</div><p>L’histologie avec culture est l’outil définitif de l’étiologie infectieuse surrénalienne [Wannachalee]. Pour la thyroïde, granulomes épithélioïdes et nécrose caséeuse, avec amplification [Tuberculose thyroïdienne, série ; Cas de néoplasme folliculaire apparent ; Gaur].</p>
<p class="src">Références : <a href="https://doi.org/10.1111/cen.70222" target="_blank" rel="noopener">Wannachalee, infections surrénaliennes (Clin Endocrinol)</a> ; <a href="https://doi.org/10.3389/fsurg.2026.1889766" target="_blank" rel="noopener">Tuberculose thyroïdienne et lymphadénite (Front Surg)</a> ; <a href="https://doi.org/10.7759/cureus.100321" target="_blank" rel="noopener">Tuberculose thyroïdienne et néoplasme folliculaire (Cureus 17)</a> ; <a href="https://doi.org/10.1016/j.diagmicrobio.2026.117408" target="_blank" rel="noopener">Tuberculose thyroïdienne de l’enfant (Diagn Microbiol Infect Dis 115)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-hemorr-img" data-title="Imagerie de l’hémorragie surrénalienne">
<div class="lab">Échographie</div><p>Hématome d’abord échogène, puis mixte, puis anéchogène en une à deux semaines [Święch 2025].</p><div class="lab">Scanner et IRM</div><p>Scanner : 50 à 90 unités Hounsfield en phase aiguë ou subaiguë, puis pseudo-kyste calcifié ; résolution complète en général en un an. Imagerie par résonance magnétique : datation par les produits de dégradation de l’hémoglobine [Święch 2025].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-metanephrines" data-title="Recherche d’un phéochromocytome ou d’un corticosurrénalome">
<div class="lab">Indication</div><p>Toute hémorragie dans une masse surrénalienne impose de chercher un phéochromocytome et un corticosurrénalome : métanéphrines, test à 1 mg de dexaméthasone, rapport aldostérone/rénine en cas d’hypertension ou d’hypokaliémie [Święch 2025].</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a>, consultés le 15 octobre 2026.</p></template>
<template data-pop="e35-mnemo" data-title="Aide mnémotechnique de la crise">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Trois verbes dans l’ordre : <b>traiter</b> (hydrocortisone, remplissage), <b>chercher</b> (cause infectieuse, hémorragie), <b>protéger</b> (contacts, carte d’urgence). Ce moyen mnémotechnique résume la conduite ; il n’est pas un critère diagnostique.</p>
<p class="src">Références : <a href="https://academic.oup.com/ejendo/article/190/5/G25/7663654" target="_blank" rel="noopener">ESE/Endocrine Society 2024, Eur J Endocrinol 190(5)</a>, consultés le 15 octobre 2026.</p></template>
