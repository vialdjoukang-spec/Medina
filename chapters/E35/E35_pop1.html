<template data-pop="e35-hydrocortisone" data-title="Hydrocortisone : produit et options pédiatriques"><table class="t" data-e35-table="1"><thead><tr><th>Population / source</th><th>Repère de protocole</th><th>Produit et limite</th></tr></thead><tbody><tr><td>Adulte, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">NICE</a> 2024/<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">ESE</a> 2024</td><td>100 mg intraveineux ou intramusculaire immédiatement ; puis 200 mg/24 h en perfusion ou 50 mg toutes les 6 h selon protocole.</td><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">Solu-Cortef</a> FI octobre 2025 : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> préférée en urgence ; 100 mg en au moins 30 secondes.</td></tr><tr><td>Enfant, option âge <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a> 2023</td><td>Moins 1 an 25 mg ; 1–5 ans 50 mg ;dès 6 ans 100 mg, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IM</a>/<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>.</td><td>Option d’âge, pas addition à la dose au poids.</td></tr><tr><td>Enfant, option poids <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a> 2023</td><td>Après 28 jours corrigés : 2 mg/kg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>, maximum 100 mg ; avant 28 jours corrigés : 4 mg/kg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>.</td><td>Fréquence et diminution ensuite selon état et protocole pédiatrique ; ne pas recopier le bolus adulte.</td></tr><tr><td>FI suisse générale pédiatrique</td><td>Adaptation à l’état/réponse ; mention de minimum 25 mg/j.</td><td>Ce minimum journalier n’est pas un bolus universel ; protocole pédiatrique et produit confrontés par l’équipe.</td></tr></tbody></table>
<p>Le tableau 3 <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">BSPED</a> 2023 propose une option d’âge ou de poids : ne pas additionner. Enfant après 28 jours corrigés : 2 mg/kg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> initial, max 100 mg, puis selon état ; nouveau-né avant 28 jours corrigés : 4 mg/kg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>. Lorsqu’il est stable et s’améliore, le protocole décrit 1 mg/kg max 50 toutes les six heures chez enfant, 2 mg/kg chez nouveau-né, puis relais oral de maladie si toléré. Cette conduite est distincte de la FI générale et du tableau suisse 2023, dont les bornes diffèrent [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
<p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">Act-O-Vial</a> 100 mg et 250 mg ont chacun 2 ml de solvant : ne pas supposer la même concentration. Injection <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> 100 mg en au moins 30 secondes ; intrathécal n’est pas voie de crise. La mention FI minimum 25 mg/j pédiatrique n’est pas un bolus 25 mg universel et ne constitue pas un protocole néonatal complet [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</p>
</template>
<template data-pop="e35-galepharm" data-title="Remplacement oral : produit suisse daté"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">Hydrocortisone Galepharm</a> 10 mg, FI août 2025 : insuffisance surrénale chronique 10–20 mg/j, parfois davantage, doses et prises adaptées. La plage hyperplasie congénitale 10–30 mg/j n’est pas celle de toute E35. Le guide britannique utilise une autre plage habituelle 15–25 mg/j ; ne pas l’étiqueter comme dose de la FI suisse ni créer une moyenne [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>].</p>
<p>Vomissements ou mauvaise absorption et crise imposent un autre parcours, souvent parentéral. L’arrêt du remplacement vital n’est pas une mesure de gestion d’une interaction ; la dose est réévaluée avec le prescripteur [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579700018" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e35-fludrocortisone" data-title="Déficit minéralocorticoïde et dose"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">Florinef</a> comprimé 0,1 mg, FI mars 2026 : adulte 0,1 mg trois fois par semaine à 0,2 mg/j, dose habituelle 0,1 mg/j ; 12–18 ans comme adulte ; 0–12 ans 2–5µg/kg/j. Surveiller pression, poids, électrolytes et rénine ; pas adaptation chiffrée validée pour tout rein/foie. Le stress ne conduit pas à tripler automatiquement ce médicament [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
<p>La FI demande de ne pas allaiter et réserve grossesse à nécessité ; le suivi spécialisé maintient une stratégie de remplacement indispensable et adaptée. Les protocoles étrangers, la FI et l’âge ne sont pas fusionnés [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680310950184" target="_blank" rel="noopener">S18</a>].</p>
</template>
<template data-pop="e35-ceftriaxone" data-title="Ceftriaxone : voie, âge et indication"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">Rocephin</a> FI juin 2025 : préparations intraveineuses distinctes de la forme intramusculaire avec lidocaïne ; solution lidocaïnée jamais <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a>. Adulte 1–2 g/j, jusqu’à 4 g/j en sévère ; addendum suisse 2017 méningite 2 ×2 g, protocole hospitalier à contextualiser. Enfant méningite 100 mg/kg/j max 4 g ; le nouveau-né jusqu’à 14 jours garde un maximum 50 mg/kg/j ; de 15 jours à 12 ans, la plage usuelle est 20–80 mg/kg/j hors schéma spécifique, avec dose adulte si poids≥50 kg [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>].</p>
<p>Prématuré jusqu’à 41 semaines postmenstruelles contre-indiqué ; nouveau-né≤28 jours avec besoin actuel/probable de calcium <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> contre-indiqué ; hyperbilirubinémie néonatale ne pas traiter. Prophylaxie <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 125/250 mg <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IM</a> unique chez contact n’est jamais la dose d’un malade invasif [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>].</p>
</template>
<template data-pop="e35-rifampicine" data-title="Rifampicine : indication et induction"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">Rimactan</a> gélules 150/300 mg, FI octobre 2023. Prophylaxie méningocoque : 600 mg toutes les douze heures deux jours chez adulte/ado>12 ans et>60 kg ; 10 mg/kg par prise sans dépasser dose adulte dès un mois chez les groupes de poids/âge précisés ; avant un mois 5 mg/kg. <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> présente aussi une option au poids 10 mg/kg max 600 dès un mois ; pas élargissement arbitraire des bornes strictes du libellé [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p>Pas traitement d’une méningite manifeste ni monothérapie de tuberculose. Clairance<25ml/min ou foie sévère : contre-indications FI. Induction du métabolisme et interactions nombreuses ; hydrocortisone peut demander adaptation à début/arrêt, sans facteur unique ni arrêt d’un remplacement vital [S6, S16, S20].</p>
</template>
<template data-pop="e35-ciprofloxacine" data-title="Prophylaxie : directive et autorisation du produit"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">Ciproxine</a> orale FI août 2025 : adulte 500 mgdoseunique pour prévention invasive à méningocoque. La directive <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 2025 prévoit 20 mg/kgdoseunique en pédiatrie, max 500 dès un mois, mais la FI réserve les indications avant fin de croissance et ne fournit pas une autorisation générale de ce schéma. Le produit Ciproxin <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">HC</a> est otique et ne s’utilise pas ici [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
<p>La FI interdit grossesse/allaitement hors cas particulier ; l’<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> permet toutes les molécules citées pendant allaitement et choisit ceftriaxone en grossesse. Cette divergence reste explicite pour le prescripteur. Tizanidine/agomélatine contre-indiquées, risques tendineux majorés par corticoïdes, cations diminuant absorption ; ne pas interrompre un remplacement vital pour régler le choix d’une prophylaxie [<a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680477950447" target="_blank" rel="noopener">S21</a>].</p>
</template>


<template data-pop="e35-contacts" data-title="Contact étroit : définition et délai"><p><a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> 20 janvier 2025 : contacts étroits de sept jours avant signes à 24 heures après traitement spécifique ; foyer et contact intense avec sécrétions, situations de petite enfance selon critères. Simple proximité ou même classe scolaire n’est pas toujours une indication. Prophylaxie idéalement 24 heures et début au plus dix jours après exposition ; personne symptomatique évaluée comme possible cas, pas seulement prophylaxie [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
</template>
<template data-pop="e35-profiles" data-title="Objectifs suisses de formation"><p><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a> 2017 : décompensation, choc/hypotension sévère, méningisme, altération de conscience et douleur abdominale ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">SSP</a> 88 purpura et 214 pressions extrêmes complètent le raisonnement. Rapprochement pédagogique, pas correspondance officielle E35 ni question d’examen garantie [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
</template>
<template data-pop="e35-semio" data-title="Sémiologie et niveau de soins"><p>L’examen recherche d’abord la gravité : circulation, conscience, glucose, respiration, purpura et absorption des médicaments. Ni pigmentation absente ni potassium normal ne suffisent à exclure une atteinte aiguë. Les neuf sections de sémiologie scientifique lient mécanisme, examen, interprétation, différentiels, urgence et limites [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
</template>
<template data-pop="e35-routes" data-title="Voies parentérales et produit exact"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IM</a> signifie intramusculaire ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">IV</a> intraveineux. Ces voies ne rendent pas les doses ou préparations équivalentes. Pour la crise, hydrocortisone parentérale selon population et formulation ; pour <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">Rocephin</a> intramusculaire, le solvant peut contenir lidocaïne et cette solution ne doit jamais être injectée dans une veine. Le produit exact, sa voie et ses contre-indications sont vérifiés [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680446250011" target="_blank" rel="noopener">S19</a>].</p>
</template>
<template data-pop="e35-waterhouse" data-title="Syndrome septique et hémorragie surrénalienne"><p><a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">Waterhouse-Friderichsen</a> désigne un tableau septique fulminant avec hémorragie surrénalienne bilatérale, classiquement méningococcique mais décrit avec d’autres agents. Les soins infectieux, circulatoires et endocriniens nécessaires se font en parallèle. Seul le contexte méningococcique justifie l’exemple <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A39.1</a>†/<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.1</a>* ; une série de décès à autopsie ne donne pas une létalité de tous les patients [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
</template>
