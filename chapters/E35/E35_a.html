<template id="ch-E35"><div class="chap"><style>[data-e35-table="1"]{font-size:inherit!important;display:block;max-width:100%;overflow-x:auto}[data-e35-table="1"] th,[data-e35-table="1"] td{font-size:inherit!important;min-width:9em}[data-e35-frame]{position:relative}[data-e35-frame] img{display:block;max-width:100%;height:auto}[data-e35-marker]{position:absolute;background:#123d4e;color:white;border:2px solid white;border-radius:50%;padding:1px 4px;font-weight:bold;font-size:clamp(8px,1vw,12px);line-height:1.2}[data-e35-pin="1"]{left:9%;top:40%}[data-e35-pin="2"]{left:14%;top:57%}[data-e35-pin="3"]{left:39%;top:30%}[data-e35-pin="4"]{left:56%;top:58%}</style><div class="chap-head"><div class="code">E35* · <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.0</a>*, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.1</a>*, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.8</a>* · Endocrinologie et métabolisme</div><h1>Anomalies endocriniennes au cours de maladies classées ailleurs</h1><span class="status">Relecture Sol du 2 novembre 2026 · Sources suisses et européennes · Auto-relecture, sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e35-1">Deux mécanismes à traiter ensemble</a></li><li><a href="#e35-2">Définition et double codage</a></li><li><a href="#e35-3">Épidémiologie : ne pas mesurer la mauvaise maladie</a></li><li><a href="#e35-4">Du fonctionnement normal à la défaillance</a></li><li><a href="#e35-5">Mécanismes, causes et diagnostics voisins</a></li><li><a href="#e35-6">Anamnèse : chronologie, traitements et absorption</a></li><li><a href="#e35-7">Examen clinique et sémiologie</a></li><li><a href="#e35-8">Urgence : agir sans attendre la preuve</a></li><li><a href="#e35-9">Diagnostic : confirmer la fonction et la cause</a></li><li><a href="#e35-10">Prise en charge selon la situation</a></li><li><a href="#e35-11">Contacts, prophylaxie et santé publique suisse</a></li><li><a href="#e35-12">Suivi, pronostic et prévention des crises</a></li><li><a href="#e35-13">Populations particulières et choix du produit</a></li><li><a href="#e35-14">Critères et pièges de raisonnement</a></li></ol></nav>
<div class="chap-body">
<section class="ilot" id="e35-1"><h2><span class="n">1</span>Deux mécanismes à traiter ensemble</h2><p>Un homme fictif de vingt ans présente fièvre, vomissements, purpura et choc. Une femme fictive de quarante-deux ans, traitée pour une tuberculose surrénalienne, devient très faible et hypotendue après une gastroentérite. Les causes immédiates diffèrent, mais le raisonnement est commun : reconnaître la défaillance, traiter l’infection ou le déclencheur, et ne pas retarder une substitution parentérale si une crise surrénalienne est suspectée [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</p>
<p>Dans le premier cas, l’hémorragie surrénalienne septique peut accompagner une infection fulminante. Dans le second, la glande déjà lésée peut ne plus répondre au stress, et les vomissements compromettent la prise orale. L’antibiothérapie, le soutien circulatoire et le remplacement hormonal nécessaire s’organisent en parallèle ; attendre le résultat d’un test hormonal ou d’une imagerie ne doit pas retarder les premières mesures [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p>La formation suisse <button class="w" data-k="e35-profiles">PROFILES</button> demande de reconnaître choc, hypotension sévère, méningisme, altération de conscience et douleur abdominale, puis d’initier les soins et de transmettre les informations utiles. Ce rapprochement avec E35 est pédagogique, sans correspondance officielle entre code et question fédérale. Les vignettes sont originales [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
<div class="key"><b>À retenir.</b> L’infection et la défaillance endocrine peuvent coexister. Traiter l’une n’autorise pas à attendre pour l’autre [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-2"><h2><span class="n">2</span>Définition et double codage</h2><p>E35 désigne des anomalies endocriniennes au cours de maladies classées ailleurs. Les subdivisions portent un astérisque : elles décrivent une manifestation d’organe et ne s’utilisent pas seules. Le code étiologique primaire classe la maladie causale ; le code de manifestation ajoute la conséquence endocrine lorsqu’il est approprié [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>].</p>
<table class="t" data-e35-table="1"><thead><tr><th>Manifestation locale suisse 2024</th><th>Exemple expressément nommé dans les notes allemandes</th><th>Portée</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.0</a>* : thyroïde</td><td>Tuberculose thyroïdienne, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A18.8</a>†</td><td>Cause et atteinte glandulaire sont documentées ensemble.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.1</a>* : surrénale</td><td>Addison tuberculeux, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A18.7</a>† ; <button class="w" data-k="e35-waterhouse">Waterhouse-Friderichsen</button> méningococcique, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A39.1</a>†</td><td>Un syndrome septique dû à un autre germe ne reçoit pas automatiquement <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">A39.1</a>†.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E35.8</a>* : autres glandes</td><td>Aucune entité particulière nommée dans cette rubrique 2024</td><td>Absence d’exemple n’est pas preuve de rubrique vide ; vérifier diagnostic et index de codage.</td></tr></tbody></table>
<p>Les inclusions infectieuses nommées servent de modèles cliniques à la leçon ; elles ne démontrent pas que toute E35 serait exclusivement infectieuse. À l’inverse, toute insuffisance surrénalienne, thyroïdite ou maladie intercurrente ne reçoit pas E35. Une insuffisance auto-immune, génétique ou médicamenteuse garde son diagnostic et sa classification propres [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>].</p>
<p>La classification suisse locale est celle de 2024, confrontée aux notes allemandes et au principe dague-astérisque. Ces références ne sont ni un certificat de codage individuel 2026 ni une règle de remboursement. Le diagnostic médical précède le choix des codes [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> L’astérisque documente une manifestation ; il ne remplace jamais la cause. Le libellé ne prescrit pas le traitement [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-3"><h2><span class="n">3</span>Épidémiologie : ne pas mesurer la mauvaise maladie</h2><p>Aucune incidence suisse de l’ensemble des manifestations E35, de la tuberculose surrénalienne ou de la tuberculose thyroïdienne n’est établie dans les lectures ciblées. Les données disponibles concernent surtout la maladie causale, des populations spécialisées ou des cas publiés [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
<p>Le guide suisse de la tuberculose <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">V1.2024</a> rapporte 365 cas en 2022, soit 4,16 pour 100000 habitants. Il indique une atteinte pulmonaire dans 94% des cas de 2020 ; cela ne signifie pas que 6% seulement auraient une atteinte extrapulmonaire, car les localisations peuvent coexister. Ces chiffres ne donnent pas la part endocrine ni une incidence 2026 [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>].</p>
<p>Le document <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP</a> du 20 janvier 2025 décrit environ 48 infections invasives à méningocoque par an en moyenne décennale, incidence 0,6 pour 100000, et une létalité de 5–15%. Ces données concernent toutes les infections invasives de cette population, pas spécifiquement le syndrome de <button class="w" data-k="e35-waterhouse">Waterhouse-Friderichsen</button>. Une synthèse médico-légale de 86 décès sélectionnés ne peut pas fournir une létalité de tous les patients atteints [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
<p>En Suède, 29 des 1743 patients avec traumatisme abdominal grave avaient une lésion surrénalienne dans une série 2013–2018. Cette fréquence de 1,7% ne décrit pas les infections surrénaliennes. Une revue de tuberculose thyroïdienne avec abcès réunissait 33 cas publiés dans 22 études ; elle ne permet pas de calculer un risque populationnel. La sélection et les examens incomplets limitent toute extrapolation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> L’incidence de l’infection causale n’est pas celle de sa complication endocrine. Chaque chiffre garde sa période et son dénominateur [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-4"><h2><span class="n">4</span>Du fonctionnement normal à la défaillance</h2><p>Le cortex surrénalien produit des stéroïdes ; la médulla produit des catécholamines. Le cortisol participe à la réponse métabolique et circulatoire au stress. L’aldostérone contribue à la conservation du sodium et à l’excrétion du potassium ; sa régulation dépend surtout du système rénine-angiotensine et du potassium, et ne se réduit pas à l’axe corticotrope [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>].</p>
<p>Une destruction corticale bilatérale peut diminuer cortisol et aldostérone. L’atteinte centrale ou la suppression par des glucocorticoïdes réduit surtout le signal corticotrope et conserve généralement la régulation minéralocorticoïde. Cela explique pourquoi une même hyponatrémie ne prouve pas un même mécanisme et pourquoi la fludrocortisone n’est pas ajoutée à tous les déficits [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>].</p>
<p>Infection granulomateuse, nécrose, infarctus ou hémorragie peuvent détruire du tissu. Une glande touchée à l’imagerie ne signifie pas automatiquement perte complète de réserve ; l’étendue et l’évolution comptent. Une hémorragie unilatérale ne produit habituellement pas le même risque qu’une atteinte bilatérale, sans exclure une lésion controlatérale moins visible [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9307021/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<p>La thyroïde normale est organisée en follicules autour d’un colloïde. Une infection peut produire masse, collection ou granulomes tout en conservant une sécrétion hormonale suffisante. Fonction normale et absence d’infection ne sont donc pas synonymes [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Maladie causale et tissu atteint</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Réserve hormonale et réponse au stress</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Signes, examens puis soins parallèles</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. La lésion et la fonction s’évaluent ensemble ; aucune perte de réserve chiffrée universelle n’est déduite du dessin [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> L’organe, le niveau de l’atteinte et la réserve expliquent le tableau. Cortex, médulla et thyroïde ne sont pas interchangeables [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-6-the-adrenal-glands" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S25</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-5"><h2><span class="n">5</span>Mécanismes, causes et diagnostics voisins</h2><table class="t" data-e35-table="1"><thead><tr><th>Profil</th><th>Causes ou contexte</th><th>Question utile</th></tr></thead><tbody><tr><td>Atteinte surrénalienne infectieuse chronique</td><td>Tuberculose ; autres agents selon terrain et exposition, notamment certaines mycoses.</td><td>Réserve hormonale, microbiologie, autres localisations et résistances.</td></tr><tr><td>Atteinte hémorragique aiguë</td><td>Sepsis, trouble de coagulation/anticoagulants, traumatisme, contexte tumoral ou obstétrical.</td><td>Stabilité, caractère bilatéral, saignement persistant, cause sous-jacente.</td></tr><tr><td>Tuberculose thyroïdienne</td><td>Masse ou collection, parfois avec adénopathie, fonction souvent conservée.</td><td>Prélèvement pertinent et confirmation microbiologique, pas image spécifique.</td></tr><tr><td>Déficit sans infection glandulaire</td><td>Auto-immunité, anomalie congénitale, atteinte centrale, exposition aux glucocorticoïdes.</td><td>Ne pas attribuer automatiquement E35 ni perdre la cause réelle.</td></tr></tbody></table>
<p>Le syndrome de <button class="w" data-k="e35-waterhouse">Waterhouse-Friderichsen</button> associe un tableau septique fulminant et une hémorragie surrénalienne bilatérale. Le méningocoque est classique, mais d’autres agents sont décrits. Une série d’autopsies de décès ne remplace pas un test clinique prospectif, et le code méningococcique reste lié à cette étiologie [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42665693/" target="_blank" rel="noopener">S15</a>].</p>
<p>Le terrain oriente la recherche : traitement immunosuppresseur, exposition tuberculeuse, maladie ou voyage, hémopathie, anticoagulation et antécédent de crise. Une insuffisance congénitale peut être révélée par une infection sans que l’infection ait détruit la glande ; ce sont deux mécanismes différents [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/42852841/" target="_blank" rel="noopener">S14</a>].</p>
<div class="key"><b>À retenir.</b> Distinguer cause glandulaire, déclencheur d’une crise et diagnostic voisin. Le déclencheur n’est pas toujours l’étiologie du déficit [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-6"><h2><span class="n">6</span>Anamnèse : chronologie, traitements et absorption</h2><p>Préciser fatigue, amaigrissement, appétit, envies de sel, vertiges au lever, douleurs abdominales, vomissements et évolution. Dater fièvre, céphalée, purpura, exposition et symptômes cervicaux. La progression lente d’une insuffisance n’a pas le même calendrier qu’une hémorragie septique ou qu’une malabsorption aiguë d’un traitement habituel [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>].</p>
<p>Demander une insuffisance connue, une carte et un kit d’urgence, la dernière prise réellement absorbée et les adaptations prévues en cas de maladie. Rechercher toutes les voies de glucocorticoïdes, une diminution ou un arrêt récent, ainsi que les traitements oncologiques ou autres causes susceptibles d’altérer les axes endocriniens. La voie non orale n’exclut pas une suppression de l’axe [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10646833/" target="_blank" rel="noopener">S7</a>].</p>
<p>La rifampicine peut accélérer le métabolisme de l’hydrocortisone. Vérifier son début ou son arrêt, l’observance, les médicaments associés et les symptômes de sous- ou sur-remplacement. Une augmentation chiffrée identique chez tous n’est pas déduite du seul nom de l’antibiotique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680342790123" target="_blank" rel="noopener">S20</a>].</p>
<p>Pour une tuberculose suspectée, rechercher contacts, localisations antérieures, traitements et résistances connus, sans inférer une cause sur le pays de naissance seul. Une absence d’exposition identifiée, de signes généraux ou de lésion pulmonaire n’exclut pas une atteinte thyroïdienne. Un nodule suspect garde aussi ses diagnostics tumoraux [<a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>].</p>
<div class="key"><b>À retenir.</b> Le traitement reçu, celui réellement absorbé et son calendrier font partie du diagnostic. Une infection peut révéler un déficit préexistant [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680235330016" target="_blank" rel="noopener">S16</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e35-7"><h2><span class="n">7</span>Examen clinique et sémiologie</h2><div data-semiology-clinical="E35"><p>Commencer par vigilance, respiration, perfusion, pression artérielle, fréquence cardiaque, température et signes de déshydratation. Un choc ou une détérioration rapide commande le niveau de soins. Rechercher purpura et signes méningés selon contexte, mais leur absence ne rassure pas à elle seule, notamment chez le petit enfant [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener">S22</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
<p>Dans une forme chronique, décrire amaigrissement, hypotension orthostatique et hyperpigmentation des plis, cicatrices ou muqueuses. La pigmentation traduit une stimulation corticotrope prolongée ; elle peut manquer dans une atteinte primaire très aiguë et n’est pas attendue de la même façon dans un déficit central. Un potassium normal n’exclut pas une crise [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</p>
<p>Examiner abdomen et flancs si douleur, et rechercher une masse cervicale, sa sensibilité, les adénopathies, la voix, la déglutition et la respiration. L’examen ne distingue pas à lui seul tuberculose, collection pyogène, inflammation et tumeur thyroïdienne. Une fonction hormonale encore normale ne remplace pas la caractérisation d’une masse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13030784/" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12577612/" target="_blank" rel="noopener">S13</a>].</p>
<p><button class="w" data-k="e35-semio">La sémiologie clinique</button> est reliée aux neuf volets du premier sous-onglet scientifique : normal, signes, mécanismes, examen, interprétation, différentiels, urgence, limites et sources. Aucun score E35 clinique unique n’est proposé [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11180513/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S24</a>].</p>
</div><div class="key"><b>À retenir.</b> La gravité précède l’étiquette. Ni absence de pigmentation ni ionogramme normal ne permettent d’attendre devant une crise plausible [<a data-reference-source="1" href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng243/chapter/Recommendations" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9999363/" target="_blank" rel="noopener">S10</a>].</div><button class="pareto-btn ui" data-k="pareto-e35-7">Essentiel de cette partie</button></section>
