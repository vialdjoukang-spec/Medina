<template data-pop="e32-thymus-normal" data-title="Thymus normal : poids et dimensions selon l’âge">

<div class="lab">Définition</div><p>Le thymus est un organe lymphoïde primaire du médiastin antérieur qui subit une involution graisseuse progressive avec l’âge (Varma et coll., 2021). Sa taille se juge selon l’âge.</p>
<div class="lab">Poids moyens (série autopsique)</div>
<table class="t"><tr><th>Âge</th><th>Poids moyen</th></tr><tr><td>Nouveau-né à terme</td><td>14,7 g</td></tr><tr><td>Moins de 1 an</td><td>18,9 g</td></tr><tr><td>1–6 ans</td><td>23,7 g</td></tr><tr><td>6–11 ans</td><td>29,2 g</td></tr><tr><td>11–16 ans</td><td>32,1 g (maximum)</td></tr><tr><td>16–21 ans</td><td>22,5 g</td></tr><tr><td>26–31 ans</td><td>16,3 g</td></tr><tr><td>46–56 ans</td><td>15,6 g</td></tr><tr><td>Plus de 66 ans</td><td>10,5 g</td></tr></table>
<div class="lab">Conséquence</div><p>Les écarts-types vont de 7 à 12 g : un poids se juge selon l’âge, jamais en valeur absolue (Porubsky, 2025). Le diamètre transverse radiologique est de 34,2 ± 10,5 mm la première année et de 18,8 ± 9,0 mm entre 11 et 14 ans ; le diamètre antéro-postérieur ne varie pas avec l’âge (Porubsky, 2025).</p>
</template>
<template data-pop="e32-involution" data-title="Involution graisseuse du thymus">

<div class="lab">Définition</div><p>L’involution est le remplacement progressif du tissu lymphoïde par de la graisse, de l’enfance à l’âge adulte (Varma et coll., 2021).</p>
<div class="lab">Conséquence en imagerie</div><p>Chez l’adulte, le thymus est partiellement graisseux ; l’hyperplasie conserve de la graisse microscopique intercalée entre les cellules, ce qui la distingue d’un tissu cancéreux (Priola et coll., 2016). Chez le jeune, du tissu thymique physiologique est fréquent, si bien que les séquences en phase et en opposition de phase deviennent non utilisables (NVALT, 2024, imagerie).</p>
<div class="lab">Limite</div><p>Le dossier ne décrit pas le mécanisme cellulaire de l’involution.</p>
</template>
<template data-pop="e32-embryo" data-title="Embryologie du thymus">

<p>Le thymus naît de la troisième poche pharyngienne vers la sixième semaine, descend et fusionne sur la ligne médiane environ deux semaines plus tard ; du tissu ectopique peut siéger de l’os hyoïde au diaphragme (Cooley-Rieders et Van Haren, 2022).</p>
</template>
<template data-pop="e32-cim" data-title="Périmètre de la rubrique des maladies du thymus">

<p>Dans la CIM-10-GM 2024, la rubrique « maladies du thymus » comprend l’hyperplasie persistante (qui inclut l’hypertrophie du thymus), l’abcès, les autres maladies du thymus et la maladie sans précision (BfArM, CIM-10-GM 2024). Les aplasies et hypoplasies avec déficit immunitaire (syndrome de DiGeorge) et la myasthénie grave sont exclues. Les thymomes et carcinomes thymiques relèvent du chapitre des tumeurs ; leurs codes exacts n’ont pas été relus. Le rattachement des kystes thymiques non tumoraux à la rubrique des autres maladies du thymus est présumé et non vérifié dans l’index alphabétique (BfArM, CIM-10-GM 2024). Conséquence pédagogique : cette leçon traite des élargissements non tumoraux du médiastin antérieur.</p>
</template>
<template data-pop="e32-rebond" data-title="Hyperplasie thymique de rebond">

<div class="lab">Définition</div><p>Élargissement modéré (en général moins de 100 g) avec architecture normale et involution absente ou minime, chez l’enfant ou l’adulte jeune après un stress (Porubsky, 2025).</p>
<div class="lab">Causes</div><p>Chimiothérapie, radiothérapie, arrêt d’une immunosuppression ou de corticoïdes, guérison d’une infection, certaines endocrinopathies (Porubsky, 2025). Un cas adulte est survenu après une corticothérapie pour cryoglobulinémie mixte (Priola et coll., 2015).</p>
<div class="lab">Fréquence</div><p>44 % à 67,7 % des lymphomes pédiatriques après chimiothérapie (Franke et coll., 2023 ; Chen et coll., 2016).</p>
<div class="lab">Conséquence</div><p>Pas de surveillance thymique spécifique ; suivre la maladie déclenchante ; régression spontanée chez environ la moitié en quelques années (Porubsky, 2025). Elle peut capter intensément le fluorodésoxyglucose et simuler une rechute (Priola et Priola, 2014).</p>
</template>
<template data-pop="e32-htv" data-title="Hyperplasie thymique vraie">

<div class="lab">Définition</div><p>Thymus de poids supérieur à la limite pour l’âge, architecture normale conservée, sans follicules ; plus de 100 g possible ; très rare chez l’adulte (Porubsky, 2025).</p>
<div class="lab">Contexte</div><p>Nourrisson, enfant ; idiopathique ou secondaire à une endocrinopathie (acromégalie, hypopituitarisme, Basedow, Addison) ; expansion thymocytaire polyclonale (Porubsky, 2025).</p>
<div class="lab">Risque</div><p>Elle peut saigner de façon aiguë et menaçante (Porubsky, 2025).</p>
<div class="lab">Conséquence</div><p>Exérèse en cas de masse symptomatique ou de doute ; aucun suivi après exérèse complète (Porubsky, 2025 ; Linegar et coll., 1993).</p>
</template>
<template data-pop="e32-htf" data-title="Hyperplasie thymique folliculaire">

<div class="lab">Définition</div><p>Follicules lymphoïdes à centres germinatifs dans plus du tiers des lobules ; thymus souvent non élargi (Porubsky, 2025).</p>
<div class="lab">Mécanisme</div><p>Processus immunitaire avec centres germinatifs (CD20, CD23, CD10, Bcl6 positifs ; Bcl2 négatif), lié à la myasthénie à début précoce avec anticorps anti-récepteur de l’acétylcholine (Porubsky, 2025).</p>
<div class="lab">Piège</div><p>La biopsie expose à une erreur d’échantillonnage ; des follicules isolés existent chez le sujet sain (Porubsky, 2025). Le diagnostic différentiel inclut le thymome micronodulaire à stroma lymphoïde et la maladie de Castleman (Porubsky, 2025).</p>
<div class="lab">Conséquence</div><p>Thymectomie standard dans la myasthénie, idéalement précoce ; environ la moitié des patients s’améliorent, la rémission complète est rare (Porubsky, 2025).</p>
</template>
<template data-pop="e32-lesa" data-title="Hyperplasie lymphoépithéliale de type sialadénite">

<div class="lab">Définition</div><p>Prolifération épithélio-lymphoïde avec kystes et architecture distordue, chez l’adulte (âge moyen de 52 ans dans une série de 36 cas) (Porubsky, 2025).</p>
<div class="lab">Risque</div><p>33 % d’une maladie auto-immune non myasthénique ; 14 % d’un lymphome, surtout de type MALT (Porubsky, 2025).</p>
<div class="lab">Conséquence</div><p>Biopsie seulement si atypie ou différentiel radiologique ; bilan initial hématologique, rhumatologique et biologique, puis suivi annuel ; pas de recommandation standardisée (Porubsky, 2025).</p>
</template>
<template data-pop="e32-massive" data-title="Hyperplasie thymique massive">

<p>Forme extrêmement rare de l’hyperplasie vraie, surtout chez le nourrisson et l’enfant ; selon une série de 4 cas et 30 cas publiés, aucun moyen préopératoire fiable ne la distingue d’une tumeur du médiastin antérieur ; l’exérèse est proposée pour l’histologie et la décompression (Linegar et coll., 1993). Un cas adulte de 2141 g a été publié chez un homme de 30 ans (Zou et coll., 2018). Ces séries anciennes ou isolées sont descriptives.</p>
</template>
<template data-pop="e32-kyste" data-title="Kyste thymique">

<div class="lab">Fréquence</div><p>1 % à 4 % des masses médiastinales ; 0,01 % des examens dans un dépistage du cancer pulmonaire par scanner (Cooley-Rieders et Van Haren, 2022).</p>
<div class="lab">Types</div><p>Congénital (souvent uniloculaire) ou acquis et inflammatoire (souvent multiloculaire) ; les kystes multiloculaires peuvent accompagner des néoplasies (carcinome thymique, lymphomes, histiocytose langerhansienne, thymome, séminome, tératome) (Cooley-Rieders et Van Haren, 2022).</p>
<div class="lab">Conduite</div><p>Symptomatique : résection (complications de 1,1 % à 6,5 %), thoracoscopie préférée. Asymptomatique : surveillance par imagerie, IRM ou résection ; aucun seuil de taille. Risque de malignité inférieur à 1 %. Presque tous les kystes néoplasiques sont multiloculaires, mais seule la moitié apparaît multiloculaire au scanner (Cooley-Rieders et Van Haren, 2022). Un kyste simple n’appelle aucun suivi (NVALT, 2024, imagerie).</p>
</template>
<template data-pop="e32-abces" data-title="Abcès thymique">

<div class="lab">Définition</div><p>Infection bactérienne du thymus, rapportée par des cas isolés (Atlas et DeLaet, 2012 ; Vyas et coll., 2011 ; Nah et coll., 2008 ; Rubinstien et Slavin, 1993).</p>
<div class="lab">Germes et tableau</div><p><i>Staphylococcus aureus</i> sensible ou résistant à la méticilline, avec bactériémie ; fièvre chez l’enfant, douleur rétrosternale aiguë mimant une cause coronarienne chez le sujet âgé (Atlas et DeLaet, 2012 ; Vyas et coll., 2011 ; Rubinstien et Slavin, 1993). Extension à l’articulation manubrio-sternale décrite (Rubinstien et Slavin, 1993) ; un abcès « idiopathique » rompu dans la plèvre a été décrit avec un CA-125 très élevé (Nah et coll., 2008).</p>
<div class="lab">Conduite</div><p>Antibiothérapie (ceftriaxone dans un cas pédiatrique), résection complète dans l’abcès rompu ; aucun protocole standardisé ni recommandation européenne (Vyas et coll., 2011 ; Nah et coll., 2008).</p>
</template>
<template data-pop="e32-basedow" data-title="Thymus et maladie de Basedow">

<div class="lab">Fréquence</div><p>107 cas d’élargissement thymique publiés jusqu’en 2014, dont 4 seulement avec cancer thymique ; la majorité étaient des hyperplasies (Dalla Costa et coll., 2014).</p>
<div class="lab">Mécanismes proposés</div><p>Expansion du cortex liée à l’hyperthyroïdie et hyperplasie lymphoïde liée à l’auto-immunité ; le thymus a régressé avec la rémission malgré des anticorps anti-récepteur de la TSH persistants, argument contre un mécanisme purement médié par ces anticorps (Dalla Costa et coll., 2014).</p>
<div class="lab">Conduite</div><p>Approche conservatrice : traiter l’hyperthyroïdie, recontrôler l’imagerie en euthyroïdie ; régression totale décrite sous antithyroïdien (Dalla Costa et coll., 2014 ; Pla Peris et coll., 2023).</p>
</template>
<template data-pop="e32-endocrinopathies" data-title="Endocrinopathies associées à l’hyperplasie vraie">

<p>L’hyperplasie vraie secondaire est décrite dans l’acromégalie, l’hypopituitarisme, la maladie de Basedow et la maladie d’Addison. La pathogénie est inconnue et l’expansion thymocytaire est polyclonale (Porubsky, 2025). Un carcinoïde atypique médiastinal a, dans un cas isolé, causé un syndrome de Cushing ectopique : cette tumeur relève du diagnostic différentiel (Nga et coll., 2023).</p>
</template>
<template data-pop="e32-chimio-peds" data-title="Chimiothérapie pédiatrique et rebond">

<p>Le rebond concerne 44 % à 67,7 % des lymphomes pédiatriques (Franke et coll., 2023). Dans une série taïwanaise, 21 enfants sur 31 (67,7 %) en rémission complète d’un lymphome en ont présenté un (Chen et coll., 2016). Dans l’essai européen EuroNet-PHL-C1 (lymphome de Hodgkin pédiatrique), 133 des 291 patients ont présenté une masse thymique nouvelle ou croissante (Franke et coll., 2023). Le rebond est associé à moins de rechutes dans la série taïwanaise (p = 0,001), sans causalité établie (Chen et coll., 2016).</p>
</template>
<template data-pop="e32-hemorragie" data-title="Hémorragie aiguë d’une hyperplasie vraie">

<p>L’hyperplasie thymique vraie peut saigner de façon aiguë et menaçante (Porubsky, 2025). Le dossier ne donne ni fréquence ni protocole. La conduite relève de l’évaluation clinique et chirurgicale de la situation.</p>
</template>
<template data-pop="e32-compression" data-title="Compression médiastinale">

<div class="lab">Définition</div><p>Compression de la veine cave supérieure, du cœur droit ou des voies aériennes par un kyste ou une hyperplasie massive (Cooley-Rieders et Van Haren, 2022 ; Linegar et coll., 1993).</p>
<div class="lab">Signes</div><p>Douleur thoracique, dysphonie, dyspnée, toux ; plus rarement arythmies, syndrome de Claude Bernard-Horner, paralysie récurrentielle (décrits pour les kystes) (Cooley-Rieders et Van Haren, 2022).</p>
<div class="lab">Conséquence</div><p>Une masse symptomatique justifie l’exérèse ; la thoracoscopie est préférée pour les kystes (Cooley-Rieders et Van Haren, 2022 ; Linegar et coll., 1993).</p>
</template>
<template data-pop="e32-thymome" data-title="Thymome et carcinome thymique">

<p>Les tumeurs épithéliales thymiques relèvent d’un chapitre tumoral. Le thymome de type B1 a une capsule fibreuse et des îlots médullaires sans corpuscules de Hassall (Porubsky, 2025). Devant une masse solide rehaussée, les recommandations néerlandaises proposent le scanner avec contraste, le dosage des anticorps anti-récepteur de l’acétylcholine chez tous, pas de biopsie si la tumeur est résécable, et un colloque multidisciplinaire (NVALT, 2024, imagerie ; NVALT, 2024, biologie ; NVALT, 2024, biopsie). Les recommandations européennes de 2015 de la société d’oncologie médicale n’ont pas été lues.</p>
</template>
<template data-pop="e32-lymphome" data-title="Lymphomes du médiastin antérieur">

<p>Le lymphome T lymphoblastique est une prolifération clonale avec réarrangement du récepteur des lymphocytes T et LMO2 ; le lymphome de Hodgkin pédiatrique est la maladie dans laquelle le rebond a été étudié dans l’essai européen EuroNet-PHL-C1 ; le lymphome MALT thymique complique 14 % des hyperplasies lymphoépithéliales de la série (Porubsky, 2025 ; Franke et coll., 2023). Les signes B, les adénopathies et les autres masses en croissance orientent vers le lymphome (Porubsky, 2025 ; Franke et coll., 2023).</p>
</template>
<template data-pop="e32-castleman" data-title="Maladie de Castleman et thymome micronodulaire">

<p>La maladie de Castleman et le thymome micronodulaire à stroma lymphoïde sont cités au diagnostic différentiel de l’hyperplasie folliculaire (Porubsky, 2025). Le dossier ne les décrit pas davantage.</p>
</template>
<template data-pop="e32-thyroide-ectopique" data-title="Tissu thyroïdien ectopique">

<p>Un tissu thyroïdien dans le médiastin antérieur peut simuler une masse thymique ; devant cette possibilité au scanner, les recommandations néerlandaises proposent une scintigraphie thyroïdienne à l’iode 123 (NVALT, 2024, imagerie).</p>
</template>
<template data-pop="e32-myasthenie" data-title="Myasthénie grave et thymus">

<p>La myasthénie grave est exclue de la rubrique des maladies du thymus et relève de sa propre rubrique (BfArM, CIM-10-GM 2024). Le lien avec ce chapitre est l’hyperplasie folliculaire, liée à la myasthénie à début précoce avec anticorps anti-récepteur de l’acétylcholine (Porubsky, 2025). Les indications précises de thymectomie n’ont pas été lues (guide européen ou allemand) : seule la proposition de thymectomie standard, idéalement précoce, est rapportée (Porubsky, 2025).</p>
</template>
<template data-pop="e32-digeorge" data-title="Syndrome de DiGeorge">

<p>L’aplasie ou l’hypoplasie thymique avec déficit immunitaire (syndrome de DiGeorge) est exclue de la rubrique des maladies du thymus et relève d’une autre rubrique (BfArM, CIM-10-GM 2024). Le dossier ne le décrit pas davantage.</p>
</template>
<template data-pop="e32-cortico" data-title="Corticothérapie et rebond">

<p>Un cas adulte d’hyperplasie de rebond est survenu après une corticothérapie pour cryoglobulinémie mixte ; la chute de signal en opposition de phase était absente et la séquence de diffusion a aidé au diagnostic (Priola et coll., 2015). L’arrêt des corticoïdes figure parmi les causes de rebond (Porubsky, 2025).</p>
</template>
