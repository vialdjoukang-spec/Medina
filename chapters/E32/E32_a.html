<section class="ilot" id="e32-0"><h2><span class="n">0</span>Question clinique</h2>

<p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p>
<p>Un garçon de 11 ans a terminé il y a huit mois le traitement d’un lymphome de Hodgkin. Le scanner de contrôle montre que le <button class="w" data-k="e32-thymus-normal">thymus</button> a grossi par rapport à l’examen de fin de traitement, sans autre masse. La famille craint une rechute, le chirurgien envisage une biopsie. <b>La question décisive est de savoir si cet élargissement est une repousse bénigne du tissu thymique ou une tumeur.</b> Le même problème se pose chez une femme de 27 ans atteinte d’une maladie de Basedow, chez qui un scanner thoracique réalisé pour une toux découvre un thymus élargi.</p>
<p>Le thymus est un organe lymphoïde primaire du médiastin antérieur. Il est volumineux chez l’enfant et subit ensuite une involution graisseuse progressive (Varma et coll., 2021). Un élargissement thymique est donc souvent un phénomène réversible : la chimiothérapie, la radiothérapie, l’arrêt d’un traitement immunosuppresseur, la guérison d’une infection ou certaines maladies endocriniennes sont suivis d’une repousse du tissu (Porubsky, 2025). Les <button class="w" data-k="e32-cim">maladies du thymus de ce chapitre</button> sont les hyperplasies, les kystes non tumoraux et l’abcès ; la myasthénie et les tumeurs thymiques ne sont abordées que comme diagnostics différentiels ou associations. Les conséquences pratiques sont opposées : méconnaître une hyperplasie expose à une chirurgie inutile, méconnaître une tumeur expose à un retard thérapeutique (Porubsky, 2025 ; Dalla Costa et coll., 2014).</p>
<div class="key"><b>Point de départ.</b> L’outil qui tranche entre hyperplasie et tumeur est l’<button class="w" data-k="e32-irm-cs">imagerie par résonance magnétique à déplacement chimique</button> : elle démontre de la graisse microscopique intercalée dans un thymus hyperplasique, absente d’une tumeur (Priola et coll., 2014 ; Inaoka et coll., 2007 ; Priola et coll., 2016). Le <button class="w" data-k="e32-euronet">raisonnement après chimiothérapie d’un lymphome</button> repose sur une autre règle : un thymus qui grossit seul est probablement un rebond.</div>
<p>Le chapitre suit l’ordre d’une consultation : comprendre le thymus normal et ses hyperplasies (îlots 1 à 4), interroger et examiner (îlots 5 et 6), établir le diagnostic et reconnaître les urgences (îlots 7 et 8), traiter et surveiller (îlots 9 à 11), puis fixer les critères et les paramètres à retenir (îlot 12). Les sources suisses n’existent pas pour ce sujet ; la <button class="w" data-k="e32-sources-guides">hiérarchie des sources</button> explique ce qui les remplace.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">Porubsky, 2025</a> ; <a href="https://richtlijnendatabase.nl/richtlijn/epitheliale_thymustumoren/diagnostiek_epitheliae_thymustumoren/beeldvormende_diagnostiek_voor_pati_nten_met_een_verdenking_op_een_thymustumor.html" target="_blank" rel="noopener">NVALT, 2024, imagerie</a></p>

<section class="ilot" id="e32-1"><h2><span class="n">1</span>Définitions et classification</h2>

<p>Une hyperplasie thymique est une augmentation de volume ou de poids du thymus par prolifération de ses constituants normaux. Le terme « tumeur » désigne au contraire une prolifération clonale qui détruit ou remplace l’architecture. La classification de (Porubsky, 2025) distingue quatre entités, qui diffèrent par l’architecture, le contexte et le lien avec l’auto-immunité.</p>
<table class="t"><tr><th>Entité</th><th>Définition</th><th>Âge et contexte</th><th>Lien auto-immun</th></tr><tr><td><button class="w" data-k="e32-htv">Hyperplasie thymique vraie</button></td><td>Poids supérieur à la limite pour l’âge, architecture normale conservée, sans follicules</td><td>Nourrisson, enfant ; plus de 100 g possible ; très rare chez l’adulte</td><td>Non</td></tr><tr><td><button class="w" data-k="e32-rebond">Hyperplasie de rebond</button></td><td>Architecture normale, involution absente ou minime ; élargissement modéré, en général moins de 100 g</td><td>Enfant, adulte jeune, après un stress</td><td>Non</td></tr><tr><td><button class="w" data-k="e32-htf">Hyperplasie folliculaire</button></td><td>Follicules lymphoïdes à centres germinatifs dans plus du tiers des lobules ; thymus souvent non élargi</td><td>Myasthénie à début précoce avec anticorps anti-récepteur de l’acétylcholine</td><td>Oui</td></tr><tr><td><button class="w" data-k="e32-lesa">Hyperplasie lymphoépithéliale de type sialadénite</button></td><td>Prolifération épithélio-lymphoïde, kystes, architecture distordue</td><td>Adulte (âge moyen de 52 ans dans une série de 36 cas)</td><td>33 % de maladie auto-immune non myasthénique ; 14 % de lymphome, surtout de type MALT</td></tr></table>
<p>Le tableau se lit en deux temps. Les deux premières lignes décrivent des thymus dont l’architecture reste normale : ils ne sont pas auto-immuns et leur seul problème est leur volume. Les deux dernières décrivent des thymus dont l’architecture est modifiée par un processus immunitaire : le suivi de ces patients porte sur l’auto-immunité et le risque de lymphome (Porubsky, 2025). La distinction décide donc du bilan, et pas seulement du vocabulaire.</p>
<p>Trois autres entités complètent le périmètre. La forme <button class="w" data-k="e32-massive">massive</button> de l’hyperplasie vraie est extrêmement rare et touche surtout le nourrisson et l’enfant (Linegar et coll., 1993). Le <button class="w" data-k="e32-kyste">kyste thymique</button> est congénital (souvent uniloculaire) ou acquis et inflammatoire (souvent multiloculaire) (Cooley-Rieders et Van Haren, 2022). L’<button class="w" data-k="e32-abces">abcès du thymus</button> est une infection bactérienne du thymus, connue par des cas isolés (Atlas et DeLaet, 2012 ; Vyas et coll., 2011 ; Nah et coll., 2008 ; Rubinstien et Slavin, 1993). Les autres atteintes qui touchent le thymus relèvent d’autres chapitres : le <button class="w" data-k="e32-digeorge">syndrome de DiGeorge</button> avec déficit immunitaire et la <button class="w" data-k="e32-myasthenie">myasthénie grave</button> sont expressément exclus de la rubrique (BfArM, CIM-10-GM 2024).</p>
<div class="trap"><span class="k">Piège</span> Un élargissement du thymus n’est pas synonyme d’hyperplasie. Une hyperplasie folliculaire peut exister dans un thymus de taille normale, et une tumeur peut exister dans un thymus de volume modeste. La taille ne classe pas ; l’architecture, le contexte et la graisse microscopique classent (Porubsky, 2025 ; Priola et coll., 2014).</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">Porubsky, 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">Cooley-Rieders et Van Haren, 2022</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024</a></p>

</section>
<section class="ilot" id="e32-2"><h2><span class="n">2</span>Épidémiologie</h2>

<p>Aucune incidence populationnelle des maladies du thymus n’a été trouvée, ni en Suisse ni en Europe. Les chiffres disponibles décrivent des contextes précis, et leur lecture suppose de connaître la population dont ils proviennent.</p>
<table class="t"><tr><th>Contexte</th><th>Donnée</th><th>Source</th></tr><tr><td>Lymphome pédiatrique traité par chimiothérapie</td><td>Hyperplasie de rebond chez 44 % à 67,7 % des enfants</td><td>(Franke et coll., 2023 ; Chen et coll., 2016)</td></tr><tr><td>Lymphome de Hodgkin pédiatrique, essai européen</td><td>133 des 291 patients ont présenté une masse thymique nouvelle ou croissante après chimiothérapie</td><td>(Franke et coll., 2023)</td></tr><tr><td>Maladie de Basedow, élargissement thymique publié jusqu’en 2014</td><td>107 cas, dont 4 seulement avec cancer thymique ; la majorité étaient des hyperplasies</td><td>(Dalla Costa et coll., 2014)</td></tr><tr><td>Kystes thymiques</td><td>1 % à 4 % des masses médiastinales ; 0,01 % des examens dans un dépistage du cancer pulmonaire par scanner, où toute masse médiastinale atteignait 0,77 %</td><td>(Cooley-Rieders et Van Haren, 2022)</td></tr><tr><td>Abcès thymique</td><td>Cas isolés rapportés chez l’enfant et chez le sujet âgé</td><td>(Atlas et DeLaet, 2012 ; Vyas et coll., 2011 ; Nah et coll., 2008 ; Rubinstien et Slavin, 1993)</td></tr></table>
<p>Ce tableau appelle trois commentaires. D’abord, le rebond pédiatrique est un événement fréquent après chimiothérapie : un thymus qui grossit chez un enfant guéri d’un lymphome est plus souvent un rebond qu’une rechute. Ensuite, la population de la maladie de Basedow est sélectionnée par la publication : les 107 cas sont des cas rapportés, non une cohorte, et ils ne permettent pas de calculer une fréquence ; leur enseignement est qualitatif (la plupart des thymus élargis de Basedow sont des hyperplasies). Enfin, le kyste thymique est rare : sa fréquence dans un dépistage par scanner du poumon, 0,01 % des examens, montre qu’il est exceptionnel de le découvrir sans symptôme dans une population non sélectionnée.</p>
<div class="key"><b>Lacune.</b> L’incidence des maladies du thymus n’est documentée ni pour la Suisse ni pour l’Europe. Les pourcentages ci-dessus ne se transposent pas à la population générale.</div>
<p class="src">Références : <a href="https://doi.org/10.1002/pbc.30421" target="_blank" rel="noopener">Franke et coll., 2023</a> ; <a href="https://doi.org/10.1007/s40618-014-0157-7" target="_blank" rel="noopener">Dalla Costa et coll., 2014</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">Cooley-Rieders et Van Haren, 2022</a></p>

</section>
<section class="ilot" id="e32-3"><h2><span class="n">3</span>Physiopathologie : du thymus normal à l’hyperplasie</h2>

<h3>Le thymus normal et son involution</h3>
<p>Le thymus naît de la <button class="w" data-k="e32-embryo">troisième poche pharyngienne</button> vers la sixième semaine de gestation, descend dans le thorax et fusionne sur la ligne médiane environ deux semaines plus tard ; du tissu thymique ectopique peut donc se trouver de l’os hyoïde au diaphragme (Cooley-Rieders et Van Haren, 2022). Son poids varie fortement avec l’âge : 14,7 g chez le nouveau-né à terme, maximum de 32,1 g entre 11 et 16 ans, 10,5 g après 66 ans (Porubsky, 2025). Les écarts-types sont larges, de 7 à 12 g : un poids se juge donc <b>selon l’âge</b>, jamais en valeur absolue. Le <button class="w" data-k="e32-thymus-normal">tableau des poids par âge</button> et la <button class="w" data-k="e32-involution">description de l’involution</button> détaillent ces repères.</p>
<p>L’involution est graisseuse : le tissu lymphoïde est progressivement remplacé par de la graisse (Varma et coll., 2021). Cette donnée explique la méthode d’imagerie centrale du chapitre. Un thymus hyperplasique de l’adulte conserve de la graisse microscopique intercalée entre les cellules, alors qu’une tumeur ne contient pas cette graisse : la mise en évidence de cette graisse distingue les deux (Priola et coll., 2014 ; Inaoka et coll., 2007 ; Priola et coll., 2016). Chez le jeune, du tissu thymique physiologique est fréquent, si bien que les séquences d’imagerie en phase et en opposition de phase deviennent « non utilisables » selon les recommandations néerlandaises (NVALT, 2024, imagerie), et que les rapports de signal se chevauchent chez l’adulte jeune (Priola et coll., 2014).</p>
<h3>Quatre mécanismes d’élargissement</h3>
<div class="two"><div class="card"><b>Le rebond</b><p>La chimiothérapie, la radiothérapie, l’arrêt d’une immunosuppression, la guérison d’une infection ou certaines endocrinopathies déclenchent une repousse thymique. L’architecture reste normale (Porubsky, 2025). Un cas adulte est survenu après une corticothérapie pour une cryoglobulinémie mixte (Priola et coll., 2015).</p></div><div class="card"><b>L’hyperplasie vraie secondaire</b><p>Elle est décrite dans l’acromégalie, l’hypopituitarisme, la maladie de Basedow et la maladie d’Addison. La pathogénie est inconnue ; l’expansion thymocytaire est polyclonale (Porubsky, 2025). Polyclonale signifie que de nombreux clones cellulaires prolifèrent, ce qui oppose cette hyperplasie à un lymphome clonal.</p></div></div><div class="two"><div class="card"><b>L’hyperplasie folliculaire</b><p>Processus immunitaire avec formation de centres germinatifs (CD20, CD23, CD10 et Bcl6 positifs, Bcl2 négatif). Elle est liée à la myasthénie à début précoce avec anticorps anti-récepteur de l’acétylcholine ; elle est rare avec les anticorps anti-titine, anti-RyR ou anti-MuSK (Porubsky, 2025).</p></div><div class="card"><b>Les kystes et l’abcès</b><p>Le kyste est congénital ou acquis ; les kystes acquis suivent des états inflammatoires (lupus, syndrome de Sjögren, infection par le VIH, chirurgie antérieure, maladie à IgG4, infection bactérienne) (Cooley-Rieders et Van Haren, 2022). L’abcès est une infection bactérienne, à <i>Staphylococcus aureus</i> sensible ou résistant à la méticilline dans les cas documentés (Atlas et DeLaet, 2012 ; Vyas et coll., 2011 ; Rubinstien et Slavin, 1993).</p></div></div>
<h3>Le cas de la maladie de Basedow</h3>
<p>Deux mécanismes sont proposés : une expansion du cortex thymique liée à l’hyperthyroïdie, et une hyperplasie lymphoïde liée à l’auto-immunité (Dalla Costa et coll., 2014). Dans le cas rapporté par Dalla Costa, le thymus a régressé avec la rémission alors que les <button class="w" data-k="e32-basedow">anticorps anti-récepteur de la TSH</button> persistaient : cet argument s’oppose à un mécanisme purement médié par ces anticorps (Dalla Costa et coll., 2014). Le mécanisme est donc hormonal et immunologique à la fois, comme le résume (Haider et coll., 2017). La conséquence clinique est la régression parallèle de l’hyperthyroïdie et du thymus sous traitement antithyroïdien (Dalla Costa et coll., 2014 ; Pla Peris et coll., 2023).</p>
<div class="trap"><span class="k">Piège</span> Le dossier ne documente pas pourquoi la chimiothérapie est suivie d’un rebond ni par quelle voie cellulaire le tissu repousse : seul l’enchaînement « agression, puis repousse à architecture normale » est établi (Porubsky, 2025). Un cours ne doit pas inventer un mécanisme absent des sources.</div>
<div class="key"><b>À retenir.</b> Le thymus normal change de poids avec l’âge ; une hyperplasie conserve l’architecture normale ou une architecture immunitaire (follicules), tandis qu’une tumeur la détruit. Le contexte (chimiothérapie, Basedow, myasthénie) oriente avant toute imagerie.</div>

<section class="ilot" id="e32-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>

<p>Les causes se regroupent par type d’hyperplasie, ce qui permet de passer du contexte du patient à l’entité probable.</p>
<table class="t"><tr><th>Type</th><th>Causes identifiées</th><th>Source</th></tr><tr><td>Rebond</td><td>Chimiothérapie, radiothérapie, arrêt d’immunosuppresseurs ou de <button class="w" data-k="e32-cortico">corticoïdes</button>, convalescence infectieuse</td><td>(Porubsky, 2025 ; Priola et coll., 2015)</td></tr><tr><td>Vraie</td><td>Idiopathique chez l’enfant ; secondaire à une endocrinopathie (<button class="w" data-k="e32-endocrinopathies">Basedow, acromégalie, hypopituitarisme, maladie d’Addison</button>)</td><td>(Porubsky, 2025 ; Dalla Costa et coll., 2014)</td></tr><tr><td>Folliculaire</td><td>Myasthénie avec anticorps anti-récepteur de l’acétylcholine (relève de la rubrique de la myasthénie) ; autres auto-immunités possibles ; sujets asymptomatiques</td><td>(Porubsky, 2025)</td></tr><tr><td>Lymphoépithéliale</td><td>Maladies auto-immunes systémiques (lupus érythémateux disséminé, polyarthrite rhumatoïde, sclérodermie, syndrome de Sjögren, érythroblastopénie, Basedow), lymphome de type MALT</td><td>(Porubsky, 2025)</td></tr><tr><td>Kyste</td><td>Congénital, ou acquis : lupus, Sjögren, VIH, chirurgie antérieure, maladie à IgG4, infection bactérienne ; kystes multiloculaires parfois associés à une tumeur</td><td>(Cooley-Rieders et Van Haren, 2022)</td></tr><tr><td>Abcès</td><td>Bactériémie à <i>Staphylococcus aureus</i> dans les cas documentés ; abcès « idiopathique » rompu dans la plèvre décrit une fois</td><td>(Atlas et DeLaet, 2012 ; Vyas et coll., 2011 ; Nah et coll., 2008 ; Rubinstien et Slavin, 1993)</td></tr></table>
<p>Ce qui frappe dans ce tableau est que la plupart des causes sont des événements médicaux traités ou des maladies déjà connues. La <button class="w" data-k="e32-chimio-peds">chimiothérapie pédiatrique</button> est le contexte le plus documenté. L’élargissement est donc fréquemment attendu et prévisible lorsque l’anamnèse est complète. Les facteurs de risque d’un abcès ne sont pas documentés au-delà de la bactériémie : le dossier ne contient pas de série qui les identifie.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Interpréter un élargissement thymique chez un patient suivi pour lymphome comme une rechute sans chercher d’autre site de croissance. Dans l’essai européen, 64 rebonds sur 64 étaient une croissance thymique isolée, alors que 33 rechutes sur 34 s’accompagnaient d’autres masses en croissance : un thymus qui grossit seul est probablement un rebond (Franke et coll., 2023).</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12784861/" target="_blank" rel="noopener">Porubsky, 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9792833/" target="_blank" rel="noopener">Cooley-Rieders et Van Haren, 2022</a></p>

</section>
<section class="ilot" id="e32-5"><h2><span class="n">5</span>Anamnèse</h2>

<p>L’interrogatoire recherche d’abord le contexte déclencheur, car il oriente le diagnostic plus sûrement que le symptôme : une chimiothérapie ou une corticothérapie récente, un lymphome traité, une maladie de Basedow, des symptômes de myasthénie, une maladie auto-immune systémique (Porubsky, 2025 ; Dalla Costa et coll., 2014 ; Franke et coll., 2023).</p>
<h3>Antécédents à rechercher</h3>
<ul><li><b>Cancérologie</b> : lymphome (surtout pédiatrique) traité, date de fin de la chimiothérapie, <button class="w" data-k="e32-rebond">rebond</button> attendu (Franke et coll., 2023).</li><li><b>Endocrinologie</b> : maladie de Basedow, acromégalie, hypopituitarisme, maladie d’Addison (Porubsky, 2025 ; Dalla Costa et coll., 2014).</li><li><b>Immunologie</b> : lupus, syndrome de Sjögren, polyarthrite rhumatoïde, sclérodermie, infection par le VIH, <button class="w" data-k="e32-myasthenie">myasthénie</button> (Porubsky, 2025 ; Cooley-Rieders et Van Haren, 2022).</li><li><b>Chirurgie thoracique antérieure</b> ou infection bactérienne récente (Cooley-Rieders et Van Haren, 2022 ; Atlas et DeLaet, 2012).</li></ul>
<h3>Symptômes</h3>
<p>Le plus souvent, aucun symptôme n’existe : l’élargissement est découvert sur un scanner ou une tomographie par émission de positons demandés pour une autre raison (Porubsky, 2025 ; Cooley-Rieders et Van Haren, 2022). Lorsque des symptômes existent, ils traduisent la <b>compression</b> ou l’infection.</p>
<table class="t"><tr><th>Symptôme</th><th>Mécanisme</th><th>Source</th></tr><tr><td>Douleur thoracique, dyspnée, toux</td><td><button class="w" data-k="e32-compression">Compression des voies aériennes ou des structures médiastinales</button></td><td>(Cooley-Rieders et Van Haren, 2022)</td></tr><tr><td>Dysphonie, syndrome de Claude Bernard-Horner, paralysie récurrentielle</td><td>Atteinte des nerfs voisins (décrite pour les kystes)</td><td>(Cooley-Rieders et Van Haren, 2022)</td></tr><tr><td>Syndrome cave supérieur, compression du cœur droit, arythmies</td><td>Compression vasculaire ou cardiaque (décrite pour les kystes)</td><td>(Cooley-Rieders et Van Haren, 2022)</td></tr><tr><td>Douleur brutale et menaçante</td><td><button class="w" data-k="e32-hemorragie">Hémorragie aiguë</button> d’une hyperplasie vraie</td><td>(Porubsky, 2025)</td></tr><tr><td>Fièvre de l’enfant ; douleur rétrosternale aiguë du sujet âgé, pouvant mimer une cause coronarienne</td><td><button class="w" data-k="e32-abces">Abcès</button> avec bactériémie</td><td>(Vyas et coll., 2011 ; Rubinstien et Slavin, 1993)</td></tr><tr><td>Signes B, adénopathies, symptômes médiastinaux nouveaux</td><td>Évoquent un lymphome ; surveillance de la forme lymphoépithéliale</td><td>(Porubsky, 2025)</td></tr></table>
<p>La logique de ce tableau est de relier chaque symptôme à son mécanisme, car c’est le mécanisme qui commande l’urgence. Une douleur thoracique d’un sujet âgé fébrile impose de penser à un abcès parce que son tableau peut mimer une cause coronarienne : le diagnostic d’abcès ne devient possible que si l’on y pense (Rubinstien et Slavin, 1993). Les symptômes de compression, en revanche, sont rapportés pour les kystes ; leur fréquence dans les hyperplasies n’est pas documentée par les sources lues.</p>
<div class="two"><div class="card"><b>Forme typique</b><p>Patient asymptomatique, élargissement découvert au scanner après chimiothérapie, au cours d’un Basedow ou chez un adulte jeune (Porubsky, 2025 ; Dalla Costa et coll., 2014).</p></div><div class="card"><b>Formes atypiques</b><p>Douleur thoracique aiguë fébrile (abcès), symptômes compressifs (kyste, hyperplasie massive), signes B ou adénopathies (lymphome) (Porubsky, 2025 ; Cooley-Rieders et Van Haren, 2022 ; Rubinstien et Slavin, 1993).</p></div></div>

</section>
<section class="ilot" id="e32-6"><h2><span class="n">6</span>Examen clinique</h2>

<p>L’examen est le plus souvent normal, puisque la découverte est fortuite (Porubsky, 2025 ; Cooley-Rieders et Van Haren, 2022). Il sert surtout à rechercher la maladie qui explique l’élargissement ou le diagnostic différentiel. L’ordre suit la règle habituelle : état général, signes vitaux, puis signes ciblés.</p>
<div class="two"><div class="card"><b>État général et signes vitaux</b><ul><li><b>Fièvre</b> : évoque l’abcès, surtout avec douleur rétrosternale (Vyas et coll., 2011 ; Rubinstien et Slavin, 1993).</li><li><b>Dyspnée, stridor, toux</b> : compression des voies aériennes (Cooley-Rieders et Van Haren, 2022).</li></ul></div><div class="card"><b>Signes ciblés</b><ul><li><b>Hyperthyroïdie et goitre</b> : maladie de Basedow, cause de <button class="w" data-k="e32-basedow">thymus élargi</button> (Dalla Costa et coll., 2014).</li><li><b>Fatigabilité musculaire</b> : <button class="w" data-k="e32-myasthenie">myasthénie</button> (NVALT, 2024, imagerie).</li><li><b>Gonflement du visage, circulation collatérale, syndrome de Claude Bernard-Horner, voix modifiée</b> : <button class="w" data-k="e32-compression">compression médiastinale</button> (Cooley-Rieders et Van Haren, 2022).</li><li><b>Adénopathies périphériques</b> : lymphome (Porubsky, 2025).</li></ul></div></div>
<p>Chaque signe répond à une question précise. La présence de signes d’hyperthyroïdie permet de rattacher l’élargissement à un Basedow connu ou inconnu, ce qui change la conduite (traiter la thyroïde et recontrôler l’imagerie en euthyroïdie (Dalla Costa et coll., 2014 ; Pla Peris et coll., 2023)). La fatigabilité musculaire fait rechercher une myasthénie et des anticorps spécifiques (NVALT, 2024, imagerie ; NVALT, 2024, biologie). Les adénopathies périphériques font penser à un lymphome, situation où l’hyperplasie ne peut plus être retenue sans exploration complémentaire (Porubsky, 2025).</p>
<div class="trap"><span class="k">Piège</span> Un examen normal n’exclut ni une hyperplasie ni une tumeur : la majorité des élargissements thymiques sont asymptomatiques (Porubsky, 2025 ; Cooley-Rieders et Van Haren, 2022). L’absence de signe ne dispense pas de l’imagerie quand le contexte l’impose.</div>
<div class="key"><b>À retenir.</b> L’examen cherche trois choses : une maladie endocrinienne ou auto-immune explicative, des signes de compression, et des signes en faveur d’un lymphome ou d’une infection.</div>
