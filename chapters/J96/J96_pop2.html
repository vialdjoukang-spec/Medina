<template data-pop="j96-gaz-prelevement" data-title="Prélever une gazométrie artérielle"><p class="lab">Technique</p><p>Le médecin ponctionne l’artère radiale avec une seringue héparinée, après une anesthésie locale ; l’artère fémorale ou humérale sert en second recours.</p><p class="lab">Erreurs pré-analytiques</p><p>Une bulle d’air élève la PaO₂ et abaisse la PaCO₂ ; un délai d’analyse prolongé laisse les leucocytes consommer l’oxygène ; un excès d’héparine dilue l’échantillon. La FiO₂, le dispositif et l’heure du dernier changement d’oxygène sont notés.</p><p class="lab">Alternative</p><p>La gazométrie capillaire artérialisée au lobe de l’oreille, moins douloureuse, suit le pH et la PaCO₂ mais sous-estime la PaO₂.</p><div class="key"><b>Limite.</b> La valeur du test d’Allen pour prévenir une ischémie de la main reste discutée ; les complications graves sont rares.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, section 7</a>.</p></template>
<template data-pop="j96-gaz-veineux" data-title="Gazométrie veineuse"><p class="lab">Ce qu’elle apporte</p><p>Le pH veineux est proche du pH artériel, un peu plus bas. La PvCO₂ dépasse en moyenne la PaCO₂ de quelques mmHg, avec une large variation individuelle.</p><p class="lab">Usage</p><p>Une PvCO₂ normale rend une hypercapnie artérielle peu probable et sert de dépistage ; une PvCO₂ élevée doit être confirmée sur sang artériel avant toute décision de ventilation.</p><div class="key"><b>Limite.</b> La gazométrie veineuse ne renseigne pas sur l’oxygénation artérielle et ne permet ni le gradient ni le rapport PaO₂/FiO₂.</div></template>

s pleines de liquide ne s’oxygène plus : il en résulte un shunt, que l’oxygène seul corrige mal, d’où le recours à la pression expiratoire positive. Source : <a href="https://commons.wikimedia.org/wiki/File:ARDSSevere.png" target="_blank" rel="noopener" data-reference-source="1">James Heilman, MD, Wikimedia Commons</a> ; <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener" data-reference-source="1">licence CC BY-SA 4.0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Poumon blanc</p><p>Des opacités alvéolaires localisées évoquent une pneumonie ou une atélectasie ; bilatérales, un œdème cardiogénique, un SDRA ou une hémorragie alvéolaire.</p><p class="lab">Poumon clair</p><p>Une hypoxémie avec radiographie normale oriente vers une embolie pulmonaire, une obstruction bronchique, une hypoventilation ou un shunt intracardiaque. Le cliché montre aussi un pneumothorax, un épanchement, une distension, une coupole surélevée ou une cardiomégalie.</p><div class="key"><b>Limite.</b> Le cliché au lit, de face et en décubitus, manque de sensibilité pour le pneumothorax et l’épanchement ; l’échographie et la tomodensitométrie le complètent.</div></template>
<template data-pop="j96-pression-muscles" data-title="Mesurer la force de la pompe"><p class="lab">PImax et SNIP</p><p>La PImax mesure la pression négative maximale produite à la bouche contre une valve fermée ; la SNIP la mesure dans une narine pendant un reniflement maximal. En l’absence de limites inférieures de la normale bien établies, une PImax d’au moins 80 cm H₂O chez l’homme et 70 cm H₂O chez la femme, ou une SNIP d’au moins 70 et 60 cm H₂O respectivement, excluent en règle une faiblesse inspiratoire cliniquement significative ; une maladie obstructive ou restrictive peut toutefois abaisser ces valeurs.</p><p class="lab">Capacité vitale assis et couché</p><p>En décubitus, le contenu abdominal repousse un diaphragme faible : une chute nette de la capacité vitale couchée oriente vers une faiblesse diaphragmatique.</p><p class="lab">Seuils décisionnels</p><p>Dans les maladies neuromusculaires, la Société suisse de pneumologie retient une capacité vitale inférieure à 50 % de la valeur prédite ou une PImax ou SNIP inférieure à 40 cm H₂O pour indiquer la ventilation à domicile.</p><div class="key"><b>Limite.</b> Ces tests dépendent de l’effort et de la technique ; plusieurs mesures concordantes sont nécessaires.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.01214-2018" target="_blank" rel="noopener">Laveneziana et al., ERS, tests des muscles respiratoires, Eur Respir J 2019</a> ; <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-polygraphie" data-title="Explorer la respiration nocturne"><p>L’oxymétrie nocturne dépiste les désaturations ; la polygraphie enregistre aussi débits et efforts ; la polysomnographie ajoute le sommeil ; la capnographie transcutanée suit le dioxyde de carbone toute la nuit. Les critères d’hypoventilation nocturne retenus par la Société suisse de pneumologie (2020) figurent dans l’onglet Examens.</p><p>Ces examens sont indiqués dans les maladies neuromusculaires et de la paroi, l’obésité avec suspicion d’hypoventilation, la BPCO avec apnées associées, les céphalées matinales et l’hypercapnie inexpliquée.</p><div class="key"><b>Limite.</b> L’oxymétrie seule ne distingue pas une apnée obstructive d’une hypoventilation : le dioxyde de carbone doit être mesuré.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-peau-pigmentee" data-title="Oxymétrie et peau fortement pigmentée"><p class="lab">Constat</p><p>Dans l’étude de Sjoding, chez des adultes hospitalisés dont la SpO₂ était de 92 à 96 %, une SaO₂ inférieure à 88 % était retrouvée dans 11,7 % des mesures chez les patients noirs contre 3,6 % chez les patients blancs ; dans la cohorte multicentrique, 17,0 % contre 6,2 %.</p><p class="lab">Mécanisme</p><p>La mélanine absorbe une partie de la lumière émise, et les algorithmes ont surtout été étalonnés chez des volontaires à peau claire : la saturation est surestimée.</p><div class="key"><b>Conséquence.</b> Chez un patient à peau fortement pigmentée, une SpO₂ limite ne rassure pas ; une gazométrie artérielle précède toute réduction de l’oxygène.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMc2029240" target="_blank" rel="noopener">Sjoding et al., New England Journal of Medicine 2020</a>.</p></template>
<template data-pop="j96-capnographie" data-title="Capnographie et EtCO₂"><p>Un capteur infrarouge mesure le dioxyde de carbone expiré ; la valeur de fin d’expiration, EtCO₂, reflète le gaz alvéolaire et reste un peu inférieure à la PaCO₂ chez le sujet sain. L’écart se creuse avec l’espace mort : BPCO, embolie pulmonaire, bas débit cardiaque. La capnographie confirme l’intubation, surveille la sédation et détecte une apnée ; la Société suisse de pneumologie la juge peu fiable pour suivre l’hypoventilation de l’adulte.</p><div class="key"><b>Limite.</b> Une EtCO₂ normale n’exclut pas une hypercapnie chez le patient obstructif.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-transcutane" data-title="Capnographie transcutanée"><p>Une électrode chauffée dilate les capillaires cutanés ; le dioxyde de carbone diffuse à travers la peau et donne la PtcCO₂. Ce suivi continu et non invasif sert au diagnostic de l’hypoventilation du sommeil, au réglage de la ventilation à domicile et au sevrage d’une ventilation non invasive.</p><div class="key"><b>Limite.</b> La mesure suit la PaCO₂ avec quelques minutes de retard et peut dériver : elle indique une tendance, à confronter à une gazométrie.</div><p class="src">Références : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-o2-medicament" data-title="L’oxygène comme médicament"><p class="lab">Statut</p><p>En Suisse, l’oxygène médicinal est un médicament autorisé par Swissmedic : Conoxia®, par exemple, est un oxygène d’une pureté d’au moins 99,5 %, enregistré sous les numéros 59115 et 59116 (spécification Linde Gas Schweiz, 2024). Aucune information professionnelle de l’oxygène médicinal n’est publiée dans la base AIPS de Swissmedic au 08.10.2026 : les règles d’emploi ci-dessous suivent la BTS 2017.</p><p class="lab">Indication</p><p>L’oxygène est indiqué dans l’hypoxémie, non dans la dyspnée : il n’a pas montré de bénéfice sur la dyspnée du patient non hypoxémique.</p><p class="lab">Dose et surveillance</p><p>La dose est la FiO₂, ou le débit associé au dispositif, qui atteint la cible prescrite. La surveillance associe SpO₂, fréquence respiratoire, vigilance et, chez le patient à risque, gazométrie ; toute modification est tracée.</p><div class="key"><b>Limite.</b> L’oxygène traite l’hypoxémie, jamais sa cause : un besoin croissant signale une aggravation à rechercher.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017</a>.</p></template>
<template data-pop="j96-toxicite-o2" data-title="Toxicité de l’oxygène"><p class="lab">Atélectasies de résorption</p><p>Une FiO₂ élevée remplace l’azote alvéolaire ; l’oxygène, absorbé rapidement, laisse se collaber les alvéoles mal ventilées.</p><p class="lab">Radicaux libres</p><p>Une hyperoxie prolongée accroît la production d’espèces réactives de l’oxygène, qui lèsent l’épithélium alvéolaire.</p><p class="lab">Effets circulatoires</p><p>L’hyperoxie contracte les artères coronaires et cérébrales et peut diminuer le débit cardiaque : elle n’apporte rien au patient non hypoxémique atteint d’infarctus ou d’accident vasculaire cérébral.</p><div class="key"><b>Limite.</b> La part de chacun de ces effets reste incertaine hors des situations extrêmes ; la surmortalité globale de l’hyperoxie est, elle, démontrée.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, sections 4.3 et 6.3</a> ; <a href="https://doi.org/10.1016/S0140-6736(18)30479-3" target="_blank" rel="noopener">IOTA 2018</a>.</p></template>
<template data-pop="j96-bleomycine" data-title="Bléomycine et paraquat"><p class="lab">Mécanisme</p><p>La bléomycine et le paraquat produisent des radicaux libres dans le poumon ; l’oxygène fournit le substrat de cette production et aggrave les lésions alvéolaires.</p><p class="lab">Conduite</p><p>La BTS vise une saturation de 85 à 88 % : l’oxygène n’est donné qu’au-dessous de 85 % et réduit au-delà de 88 %.</p><div class="key"><b>Piège.</b> L’antécédent de bléomycine se recherche avant une anesthésie ou une oxygénothérapie, car le risque persiste après le traitement.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, recommandation F16</a>.</p></template>
<template data-pop="j96-morphine-vni" data-title="Morphine sous ventilation non invasive"><p class="lab">Indication</p><p>La morphine se discute chez le patient agité, en détresse ou tachypnéique sous ventilation non invasive, lorsque l’angoisse et la dyspnée compromettent la tolérance du masque.</p><p class="lab">Posologie de référence</p><p>La BTS et l’Intensive Care Society proposent, en bonne pratique, 2,5 à 5 mg de morphine par voie intraveineuse, avec ou sans benzodiazépine. L’information suisse prévoit 2,5 à 15 mg par voie intraveineuse, dilués et injectés en 4 à 5 minutes ; elle demande la plus grande prudence, et une administration en cas de nécessité absolue seulement, en présence d’une dépression respiratoire, d’une maladie obstructive des voies respiratoires ou d’une dyspnée, et une surveillance attentive en cas de cœur pulmonaire.</p><p class="lab">Mécanisme</p><p>La morphine diminue la perception de la dyspnée et la fréquence respiratoire ; l’expiration s’allonge, ce qui peut réduire la distension.</p><div class="key"><b>Risque.</b> Elle déprime la commande ventilatoire, effet majoré par les benzodiazépines : elle n’est donnée que sous surveillance étroite, là où l’intubation est possible, sauf objectif palliatif.</div><p class="src">Références : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a> ; information professionnelle suisse Morphin HCl Sintetica®, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>
<template data-pop="j96-acetazolamide" data-title="Acétazolamide : indication suisse et preuves"><p class="lab">Mécanisme</p><p>L’acétazolamide inhibe l’anhydrase carbonique : il accroît l’excrétion rénale de bicarbonates, abaisse le pH et stimule ainsi la commande ventilatoire.</p><p class="lab">Information suisse</p><p>L’information professionnelle suisse de Diamox® mentionne l’insuffisance respiratoire associée à une acidose respiratoire, à raison de 500 à 750 mg par jour en traitement au long cours chez l’adulte. Elle le contre-indique en cas d’hyponatrémie, d’hypokaliémie, d’affection rénale ou hépatique grave, d’insuffisance surrénalienne et d’acidose hyperchlorémique. Elle avertit qu’il peut aggraver une acidose préexistante chez le patient cardiaque ou pulmonaire et demande une prudence particulière en cas d’obstruction pulmonaire ou d’emphysème.</p><p class="lab">Preuves</p><p>L’essai français DIABOLO (JAMA 2016) a inclus 380 patients atteints de BPCO, ventilés par voie invasive et porteurs d’une alcalose métabolique. L’acétazolamide intraveineux a abaissé davantage les bicarbonates, mais n’a réduit significativement ni la durée de ventilation (−16 heures, non significatif) ni la PaCO₂. La BTS et l’Intensive Care Society déconseillent donc l’usage de routine des inhibiteurs de l’anhydrase carbonique.</p><div class="key"><b>Écart et conduite.</b> L’autorisation suisse rend la prescription possible ; elle ne démontre pas un bénéfice. Chez le patient hypercapnique aigu, l’acétazolamide ne se donne pas de routine ; s’il se discute, c’est dans les limites de l’information suisse, avec une surveillance de la kaliémie, de la natrémie et du pH, car l’acidose induite s’ajoute à l’acidose respiratoire d’un patient incapable d’augmenter sa ventilation.</div><p class="src">Références : information professionnelle suisse Diamox®, Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://doi.org/10.1001/jama.2016.0019" target="_blank" rel="noopener">Faisy et al., essai DIABOLO, JAMA 2016</a> (résumé) ; <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016, recommandation 16</a>.</p></template>
<template data-pop="pareto-j96-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j96-e-1,j96-e-2,j96-e-3,j96-e-4"></p><ul><li>Gazométrie artérielle avec FiO₂ : examen de référence ; PvCO₂ normale : hypercapnie peu probable.</li><li>Lecture : conditions, pH, PaCO₂, bicarbonates (+ 1 aigu, + 3,5 à 4 chronique par 10 mmHg), gradient, troubles associés.</li><li>La SpO₂ trompe (perfusion, COHb, MetHb, peau pigmentée) ; l’EtCO₂ sous-estime la PaCO₂ ; la PtcCO₂ suit une tendance.</li><li>Pompe : capacité vitale couchée, PImax, capnographie nocturne (PtcCO₂ ≥ 55 mmHg plus de 10 minutes).</li></ul></template>
<template data-pop="pareto-j96-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j96-p-1,j96-p-2,j96-p-3,j96-p-4"></p><ul><li>Oxygène : médicament titré vers une cible ; FiO₂ connue seulement sous Venturi ou haut débit ; masque simple jamais &lt; 5 L/min.</li><li>Excès : hypercapnie chez le patient à risque, surmortalité ailleurs (IOTA, RR 1,21) ; bléomycine ou paraquat : 85–88 %.</li><li>Morphine 2,5 à 5 mg par voie intraveineuse sous surveillance pour tolérer la ventilation non invasive ; pas d’inhibiteur de l’anhydrase carbonique en routine ; traiter la cause.</li></ul></template>
