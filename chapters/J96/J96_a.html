<section class="ilot" id="j96-0"><h2><span class="n">0</span>Question clinique</h2><p>Une femme de 34 ans, sans antécédent, arrive aux urgences avec une pneumonie lobaire. Elle respire 32 fois par minute ; sa SpO₂ vaut 86 % à l’air ambiant. La gazométrie artérielle montre une PaO₂ de 52 mmHg (6,9 kPa), une PaCO₂ de 30 mmHg (4,0 kPa) et un pH de 7,49. Dans le box voisin, un homme de 71 ans atteint d’une BPCO sévère a reçu 15 L/min d’oxygène au masque pendant son transport. Il est somnolent : PaCO₂ 82 mmHg (10,9 kPa), pH 7,24, bicarbonates 34 mmol/L.</p><p>Tous deux présentent une insuffisance respiratoire aiguë ; leur mécanisme, leur cible d’oxygène et leur support ventilatoire diffèrent pourtant du tout au tout. Trois questions guident la décision : <b>quelle fonction a cédé, depuis quand, et quel support rétablit l’échange gazeux sans nuire ?</b></p><div class="key"><b>Point de départ.</b> Deux systèmes en série assurent la respiration : <button class="w" data-k="j96-echangeur-pompe">l’échangeur et la pompe (deux défaillances, deux types)</button>. Leur interaction se lit dans <button class="w" data-k="j96-equation-alveolaire">l’équation des gaz alvéolaires (calcul et usage clinique)</button>.</div></section>
<section class="ilot" id="j96-1"><h2><span class="n">1</span>Définitions et classifications</h2><p>L’insuffisance respiratoire est l’incapacité du système respiratoire à assurer des échanges gazeux adaptés aux besoins de l’organisme. Son diagnostic est gazométrique, sur un prélèvement artériel au repos et à l’air ambiant : une <b>PaO₂ inférieure à 60 mmHg (8 kPa)</b> définit l’hypoxémie, une <b>PaCO₂ supérieure à 45 mmHg (6 kPa)</b> l’hypercapnie. Le seuil de 60 mmHg correspond au coude de la courbe de dissociation de l’hémoglobine, où la saturation vaut encore environ 90 % ; au-dessous, chaque millimètre de mercure perdu retire beaucoup plus d’oxygène au sang.</p><p>Le <b>type 1, hypoxémique</b>, associe une hypoxémie à une PaCO₂ normale ou basse : l’échangeur est atteint, mais la pompe ventile assez, souvent trop. Le <b>type 2, hypercapnique</b>, traduit une ventilation alvéolaire insuffisante pour éliminer le dioxyde de carbone produit ; une hypoxémie l’accompagne souvent.</p><p>La temporalité se lit sur le pH et les bicarbonates. Dans l’hypercapnie <b>aiguë</b>, le rein n’a pas eu le temps de retenir des bicarbonates et le pH chute. Dans l’hypercapnie <b>chronique</b>, cette rétention ramène le pH près de la normale. L’<b>acutisation</b> associe des bicarbonates déjà élevés à une nouvelle chute du pH au-dessous de 7,35 : c’est le cas du second patient. <button class="w" data-k="j96-compensation">La compensation rénale demande plusieurs jours (valeurs attendues)</button>.</p><p>Type et temporalité se combinent : une hypercapnie aiguë peut survenir sur des poumons sains, après un surdosage d’opioïdes, ou s’ajouter à une hypercapnie chronique, comme chez le second patient. Une SpO₂ isolée ne permet de classer ni le type ni la temporalité, car elle ne mesure ni la PaCO₂ ni le pH : seule une gazométrie interprétée y parvient. Le syndrome de détresse respiratoire aiguë, forme lésionnelle particulière de l’insuffisance hypoxémique, fait l’objet d’un cours distinct.</p><div class="key"><b>À retenir.</b> PaO₂ &lt; 60 mmHg ou PaCO₂ &gt; 45 mmHg affirment l’insuffisance respiratoire. La PaCO₂ fixe le type, le pH et les bicarbonates la temporalité.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, définitions et valeurs normales</a>.</p></section>
<section class="ilot" id="j96-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>L’insuffisance respiratoire aiguë est fréquente et grave, mais sa fréquence dépend de la définition retenue. L’étude prospective ARF a recensé, pendant huit semaines de 1997, toutes les admissions en soins intensifs de Suède, du Danemark et d’Islande ; elle définissait l’insuffisance aiguë par une intubation avec ventilation mécanique d’au moins 24 heures. Son incidence atteignait <b>77,6 pour 100 000 adultes par an</b>, et la mortalité à 90 jours <b>41,0 %</b>. Ce chiffre ne compte que les patients intubés : il sous-estime donc l’ensemble des insuffisances aiguës, dont beaucoup sont traitées par oxygène, haut débit nasal ou ventilation non invasive. Aucune étude suisse ne publie l’incidence de l’insuffisance respiratoire aiguë.</p><p>L’insuffisance chronique hypercapnique se mesure en Suisse par le recours à la ventilation à domicile. Dans les cantons de Genève et de Vaud, le nombre de patients sous ventilation non invasive à domicile est passé de 15 à <b>38 pour 100 000 habitants</b> entre 2000 et 2018, valeur proche de celles de la Norvège (47), de la Suède (33) et de la Finlande (39,5). Entre 2016 et 2019, 3 498 patients ont débuté une ventilation à domicile en Suisse, dont 1,4 % par trachéotomie. Le syndrome obésité-hypoventilation, la BPCO et les maladies neuromusculaires et de la paroi thoracique en sont les indications les plus fréquentes, chez des patients de plus en plus âgés et obèses.</p><p>Le pronostic dépend moins de l’insuffisance elle-même que de sa cause et de la qualité du support. Trois traitements ont réduit la mortalité dans des essais : l’oxygène titré dans l’exacerbation de BPCO (îlot 9), la ventilation non invasive dans l’acidose hypercapnique de la BPCO (îlot 11) et l’oxygénothérapie de longue durée dans la BPCO hypoxémique sévère (îlot 13).</p><div class="key"><b>À retenir.</b> Définie par la ventilation invasive, l’insuffisance aiguë touche environ 78 adultes sur 100 000 par an et tue 41 % d’entre eux à 90 jours. En Suisse romande, 38 habitants sur 100 000 vivent sous ventilation non invasive à domicile.</div><p class="src">Références : <a href="https://doi.org/10.1164/ajrccm.159.6.9808136" target="_blank" rel="noopener">Luhr et al., étude ARF, 1999</a> (résumé) ; <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Janssens et al., Société suisse de pneumologie, Respiration 2020</a>, introduction et section 7.4.1.</p></section>
<section class="ilot" id="j96-3"><h2><span class="n">3</span>L’échangeur et la pompe</h2><p>Chez l’adulte jeune, au niveau de la mer, la PaO₂ normale se situe entre 90 et 110 mmHg (12 à 14,6 kPa) et la saturation entre 96 et 98 % ; la limite inférieure de la saturation descend vers 94 % après 70 ans. La PaCO₂ normale va de 34 à 46 mmHg (4,6 à 6,1 kPa), le pH de 7,35 à 7,45, les bicarbonates de 22 à 26 mmol/L.</p><p><b>L’oxygène dépend surtout de l’échangeur.</b> La PaO₂ résulte de la pression alvéolaire en oxygène (PAO₂), environ 100 mmHg à l’air ambiant, diminuée de la perte entre l’alvéole et l’artère : le <button class="w" data-k="j96-gradient">gradient alvéolo-artériel (valeur normale selon l’âge)</button>, de 5 à 15 mmHg chez l’adulte jeune. Un gradient élevé désigne l’échangeur ; une PaO₂ basse avec un gradient normal désigne une baisse de la PAO₂, par hypoventilation ou par altitude.</p><p><b>Le dioxyde de carbone dépend surtout de la pompe.</b> La PaCO₂ est proportionnelle à la production de dioxyde de carbone et inversement proportionnelle à la ventilation alvéolaire : si celle-ci diminue de moitié, la PaCO₂ double. La pompe réunit la commande bulbaire, la moelle, les nerfs phréniques, la jonction neuromusculaire, les muscles respiratoires, la paroi thoracique et les voies aériennes.</p><p>Or la ventilation alvéolaire n’est pas la ventilation totale, car environ 150 mL de chaque inspiration restent dans l’espace mort anatomique. Respirer 12 fois 500 mL ou 24 fois 250 mL déplace 6 L/min dans les deux cas ; les alvéoles reçoivent pourtant 4,2 L/min dans le premier, 2,4 L/min seulement dans le second. <b>La respiration rapide et superficielle du patient qui s’épuise fait donc monter la PaCO₂ malgré une fréquence élevée.</b></p><div class="key"><b>À retenir.</b> L’échangeur règle surtout l’oxygène, la pompe surtout le dioxyde de carbone. Le gradient alvéolo-artériel sépare les deux défaillances.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, sections 3 à 5</a>.</p></section>
<section class="ilot" id="j96-4"><h2><span class="n">4</span>Les cinq mécanismes de l’hypoxémie</h2><p>Une PaO₂ basse résulte de cinq mécanismes, souvent associés. Deux questions les distinguent au lit du patient : le gradient alvéolo-artériel est-il élevé, et la PaO₂ remonte-t-elle franchement sous oxygène ?</p><table class="t"><tr><th>Mécanisme</th><th>Gradient</th><th>Réponse à l’oxygène</th><th>Exemple</th></tr><tr><td><button class="w" data-k="j96-altitude">Baisse de la pression inspirée d’oxygène</button></td><td>Normal</td><td>Complète</td><td>Séjour à 3 500 m</td></tr><tr><td>Hypoventilation alvéolaire</td><td>Normal</td><td>Complète ; la PaCO₂ reste élevée</td><td>Surdosage d’opioïdes</td></tr><tr><td><button class="w" data-k="j96-va-q">Inadéquation ventilation/perfusion</button></td><td>Élevé</td><td>Bonne</td><td>BPCO, asthme, embolie pulmonaire</td></tr><tr><td><button class="w" data-k="j96-shunt">Shunt vrai</button></td><td>Élevé</td><td>Faible, d’autant plus que le shunt est large</td><td>Pneumonie lobaire, SDRA, atélectasie</td></tr><tr><td><button class="w" data-k="j96-diffusion">Trouble de la diffusion</button></td><td>Élevé, surtout à l’effort</td><td>Bonne</td><td>Fibrose pulmonaire</td></tr></table><p>La lecture commence par le gradient. Normal, il désigne la pompe ou l’altitude, et la PaCO₂ tranche : elle monte dans l’hypoventilation, baisse en altitude. Élevé, il désigne l’échangeur, et la réponse à l’oxygène sépare le shunt, qui résiste, des autres mécanismes. Chez la patiente atteinte de pneumonie, le gradient atteint environ 60 mmHg ; un fort débit d’oxygène ne la corrigera que partiellement, car ses alvéoles condensées ne reçoivent plus d’air.</p><p>Une désaturation du sang veineux mélangé aggrave chacun de ces mécanismes. Lorsque le débit cardiaque chute, le sang revient plus désaturé, et la fraction qui traverse un shunt abaisse davantage la PaO₂ : un état de choc creuse ainsi l’hypoxémie sans modification pulmonaire.</p><div class="key"><b>À retenir.</b> Gradient normal : pompe ou altitude. Gradient élevé et bonne réponse à l’oxygène : inadéquation ventilation/perfusion ou diffusion. Gradient élevé et réponse faible : shunt.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, section 5</a>.</p></section>
<section class="ilot" id="j96-5"><h2><span class="n">5</span>Hypercapnie et acutisation</h2><p>La pompe ventilatoire tient tant que trois termes restent en équilibre : la <b>commande</b> centrale, la <b>capacité</b> des muscles respiratoires et la <b>charge</b> qu’ils doivent vaincre. <button class="w" data-k="j96-charge-capacite">L’hypercapnie apparaît quand la charge dépasse la capacité ou quand la commande faiblit (balance et exemples)</button>. Le patient défend d’abord sa PaCO₂ au prix d’un travail accru, puis la laisse monter : ses muscles sont épargnés, mais le sang s’acidifie.</p><p>La charge croît avec l’obstruction bronchique (charge résistive), avec une paroi rigide, une obésité ou une distension abdominale (charge élastique), et avec la distension dynamique de la BPCO, où <button class="w" data-k="j96-pepi">la pression expiratoire positive intrinsèque impose une charge à seuil (mécanisme)</button>. La capacité diminue avec une maladie neuromusculaire, une hypokaliémie, une hypophosphatémie, une dénutrition ou un diaphragme aplati par la distension. La commande faiblit sous sédatifs et opioïdes ou après une lésion du tronc cérébral. Un espace mort accru agit dans le même sens, car l’air qui ventile des territoires non perfusés n’élimine aucun dioxyde de carbone.</p><p>L’hypercapnie chronique débute souvent la nuit : pendant le sommeil paradoxal, l’atonie des muscles accessoires laisse le diaphragme seul. <button class="w" data-k="j96-sommeil">L’hypoventilation du sommeil précède l’hypercapnie diurne (pourquoi la chercher)</button>. Le rein retient ensuite des bicarbonates, qui compensent l’acidose mais émoussent la réponse ventilatoire au dioxyde de carbone.</p><p>L’<b>acutisation</b> survient lorsqu’un facteur déclenchant rompt cet équilibre : infection, insuffisance cardiaque, embolie pulmonaire, pneumothorax, sédatif, opioïde, chirurgie thoracique ou abdominale, ou <b>oxygène administré sans cible</b>, comme chez le second patient.</p><div class="key"><b>À retenir.</b> L’hypercapnie traduit un déséquilibre entre commande, capacité et charge. Elle naît la nuit, se compense par le rein, puis décompense sur un facteur déclenchant qu’il faut toujours identifier.</div><p class="src">Références : Davidson et al., BTS et Intensive Care Society, Thorax 2016 ; Janssens et al., Société suisse de pneumologie, Respiration 2020.</p></section>
<section class="ilot" id="j96-6"><h2><span class="n">6</span>Causes et terrains</h2><p>Affirmer l’insuffisance respiratoire impose d’en chercher aussitôt la cause, car le traitement étiologique conditionne le pronostic. Le tableau suit le trajet de la commande nerveuse, du tronc cérébral à l’alvéole.</p><table class="t"><tr><th>Niveau atteint</th><th>Causes principales</th><th>Type habituel</th></tr><tr><td>Commande centrale</td><td>Opioïdes, benzodiazépines, alcool, accident vasculaire ou tumeur du tronc cérébral</td><td>2</td></tr><tr><td>Moelle et nerfs</td><td>Lésion médullaire cervicale haute, syndrome de Guillain-Barré, sclérose latérale amyotrophique, paralysie phrénique</td><td>2</td></tr><tr><td>Jonction et muscles</td><td>Crise myasthénique, botulisme, myopathies, hypokaliémie ou hypophosphatémie sévères</td><td>2</td></tr><tr><td>Paroi et plèvre</td><td>Cyphoscoliose, <button class="w" data-k="j96-soh">syndrome obésité-hypoventilation (définition et prise en charge)</button>, volet costal, épanchement massif, pneumothorax</td><td>2, parfois 1</td></tr><tr><td>Voies aériennes</td><td>Exacerbation de BPCO, asthme aigu grave, obstruction laryngée ou trachéale</td><td>2 ou mixte</td></tr><tr><td>Alvéoles et interstitium</td><td>Pneumonie, œdème pulmonaire cardiogénique, SDRA, hémorragie alvéolaire, pneumopathie interstitielle</td><td>1</td></tr><tr><td>Vaisseaux pulmonaires</td><td>Embolie pulmonaire, hypertension pulmonaire, shunt intracardiaque</td><td>1</td></tr></table><p>Plus l’atteinte est proximale, plus l’insuffisance est hypercapnique. Une hypoxémie avec poumon radiologiquement clair évoque une embolie pulmonaire, une obstruction bronchique, une hypoventilation ou un shunt intracardiaque. Les mécanismes se combinent volontiers : une pneumonie chez un patient atteint de BPCO associe shunt, inadéquation ventilation/perfusion et charge accrue. Les causes fréquentes ont leur cours propre : <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>, <a href="#/entry/J44">J44 — Bronchopneumopathie chronique obstructive</a>, <a href="#/entry/J45">J45 — Asthme</a> et <a href="#/entry/I26">I26 — Embolie pulmonaire aiguë</a>. Avec la BPCO, l’obésité sévère, les déformations thoraciques et les <button class="w" data-k="j96-neuromusculaire">maladies neuromusculaires, dont l’insuffisance se masque (pièges)</button>, dominent les insuffisances chroniques hypercapniques.</p><div class="key"><b>À retenir.</b> Une atteinte proximale de la pompe donne une hypercapnie ; une atteinte alvéolaire ou vasculaire, une hypoxémie. Chaque épisode a une cause et souvent un facteur déclenchant.</div><p class="src">Références : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Janssens et al., Société suisse de pneumologie, Respiration 2020</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society, Thorax 2016</a>.</p><button class="pareto-btn ui" data-k="pareto-j96-meca">▲ Loi de Pareto — Définitions, physiologie et mécanismes</button></section>
<section class="ilot" id="j96-7"><h2><span class="n">7</span>Clinique et signes de gravité</h2><p>L’examen recherche les effets de l’hypoxémie, ceux de l’hypercapnie et, surtout, l’état de la pompe. Ce dernier décide de l’urgence : un patient qui s’épuise peut cesser de respirer en quelques minutes, avec une SpO₂ encore acceptable sous oxygène.</p><div class="two"><div class="card"><h4>Effets de l’hypoxémie</h4><p>Dyspnée, tachypnée et tachycardie traduisent la réponse des chémorécepteurs et du système sympathique ; l’agitation puis la confusion signalent la souffrance cérébrale. La <button class="w" data-k="j96-cyanose">cyanose (seuil, pièges de l’anémie et de la polyglobulie)</button> apparaît tard et manque chez l’anémique.</p></div><div class="card"><h4>Effets de l’hypercapnie</h4><p>Le dioxyde de carbone dilate les vaisseaux cérébraux et cutanés : céphalées, sueurs, peau chaude et pouls bondissant en témoignent. L’acidose du liquide céphalorachidien altère ensuite la vigilance. <button class="w" data-k="j96-signes-hypercapnie">Astérixis et somnolence (lecture clinique de l’hypercapnie)</button> imposent une PaCO₂ sans délai.</p></div></div><p><b>Signes de lutte.</b> Une fréquence respiratoire supérieure à 30 par minute, le <button class="w" data-k="j96-tirage">tirage et la mise en jeu des muscles accessoires (ce qu’ils mesurent)</button>, une parole hachée et l’orthopnée signalent une charge proche de la capacité.</p><p><b>Signes d’épuisement.</b> Une <button class="w" data-k="j96-respiration-paradoxale">respiration abdominale paradoxale (diaphragme défaillant)</button>, une bradypnée succédant à la tachypnée, des pauses et une baisse de vigilance annoncent l’arrêt respiratoire. Une fréquence qui ralentit ne rassure que si la PaCO₂ et la vigilance s’améliorent.</p><p><b>Signes de chronicité.</b> Œdèmes des membres inférieurs, turgescence jugulaire et éclat du deuxième bruit pulmonaire évoquent un <button class="w" data-k="j96-coeur-pulmonaire">cœur pulmonaire chronique (mécanisme)</button>. Polyglobulie, céphalées matinales et somnolence diurne orientent vers une hypoventilation nocturne.</p><div class="key"><b>À retenir.</b> La gravité se juge sur la pompe : fréquence, signes de lutte, respiration paradoxale, vigilance. Une SpO₂ normale sous oxygène ne prouve ni une ventilation suffisante ni l’absence d’épuisement.</div><p class="src">Références : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society, Thorax 2016</a> ; <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017</a>.</p></section>
<section class="ilot" id="j96-8"><h2><span class="n">8</span>Démarche diagnostique</h2><p>La démarche suit un ordre fixe : stabiliser, mesurer, classer, expliquer. Le médecin assure les voies aériennes, la respiration et la circulation, administre l’oxygène selon une cible, puis prélève.</p><p><b>Mesurer.</b> La SpO₂ dépiste ; la gazométrie artérielle confirme. La BTS la demande chez tout patient gravement malade, chez tout patient dont la saturation baisse ou dont le besoin en oxygène augmente, et chez tout patient à risque d’hypercapnie. La FiO₂ et le dispositif figurent sur la demande, faute de quoi la PaO₂ est ininterprétable. La lecture en six étapes figure dans l’onglet Examens.</p><p><b>Classer.</b> La PaCO₂ fixe le type, le pH et les bicarbonates la temporalité, le gradient localise la défaillance. Sous oxygène, le rapport PaO₂/FiO₂ chiffre l’hypoxémie : de 400 à 500 mmHg chez le sujet sain, il tombe au-dessous de 300 mmHg dans une insuffisance hypoxémique franche. Un <button class="w" data-k="j96-lactate">lactate élevé (hypoxie tissulaire ou choc associé)</button> signale que l’apport d’oxygène aux tissus ne suffit plus.</p><p><b>Expliquer.</b> La radiographie thoracique et l’<button class="w" data-k="j96-echographie">échographie pulmonaire au lit (profils et limites)</button> orientent vers la cause ; électrocardiogramme, NT-proBNP, CRP, D-dimères selon la probabilité clinique, angio-TDM et échocardiographie complètent selon l’hypothèse.</p><p>Les profils gazométriques types sont détaillés dans l’onglet Examens. L’erreur fréquente consiste à attribuer toute hypercapnie à une BPCO : chez un patient obèse et somnolent, sans obstruction connue, la même gazométrie évoque d’abord un syndrome obésité-hypoventilation ou un toxique.</p><div class="key"><b>À retenir.</b> La gazométrie, avec sa FiO₂, affirme et classe ; le gradient localise ; l’imagerie et le contexte désignent la cause.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, recommandations sur la gazométrie</a> ; <a href="https://doi.org/10.1056/NEJMoa1503326" target="_blank" rel="noopener">Frat et al., essai FLORALI 2015</a>.</p><button class="pareto-btn ui" data-k="pareto-j96-clin">▲ Loi de Pareto — Clinique et démarche diagnostique</button></section>
