<template data-pop="j96-echangeur-pompe" data-title="L’échangeur et la pompe : deux défaillances"><p>L’<b>échangeur</b>, fait des alvéoles et des capillaires, oxygène le sang. La <b>pompe</b>, de la commande bulbaire aux voies aériennes en passant par les nerfs, les muscles et la paroi, renouvelle l’air alvéolaire et élimine le dioxyde de carbone.</p><p>Quand l’échangeur cède, la PaO₂ baisse et la pompe intacte hyperventile : c’est le type 1, qui répond à l’oxygène et au haut débit. Quand la pompe cède, la PaCO₂ monte : c’est le type 2, qui exige une aide ventilatoire, car l’oxygène n’abaisse pas la PaCO₂.</p><div class="key"><b>Piège.</b> L’apparition d’une hypercapnie au cours d’un type 1 signe l’épuisement de la pompe.</div></template>
<template data-pop="j96-equation-alveolaire" data-title="L’équation des gaz alvéolaires"><p>PAO₂ = FiO₂ × (pression barométrique − 47) − PaCO₂/0,8, où 47 mmHg est la pression de vapeur d’eau à 37 °C et 0,8 le quotient respiratoire. Au niveau de la mer, à l’air ambiant : 0,21 × 713 − 40/0,8 ≈ 100 mmHg. Si la PaCO₂ monte à 80 mmHg, la PAO₂ tombe vers 50 mmHg sans aucune lésion pulmonaire.</p><p>La PAO₂ diminuée de la PaO₂ donne le gradient alvéolo-artériel ; l’équation explique aussi l’hypoxémie de rebond.</p><div class="key"><b>Limite.</b> Le calcul exige une FiO₂ connue : air ambiant, masque Venturi ou haut débit, non lunettes ni masque simple.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, section 5</a>.</p></template>
<template data-pop="j96-compensation" data-title="Compensation rénale de l’hypercapnie"><p class="lab">Mécanisme</p><p>Le tamponnement cellulaire immédiat élève peu les bicarbonates ; le rein augmente ensuite leur réabsorption et l’excrétion d’ions H⁺ en trois à cinq jours.</p><p class="lab">Valeurs attendues</p><p>En aigu, les bicarbonates montent d’environ 1 mmol/L et le pH baisse d’environ 0,08 par 10 mmHg de PaCO₂. En chronique, les bicarbonates montent de 3,5 à 4 mmol/L par 10 mmHg selon les auteurs, et le pH reste proche de la normale.</p><p class="lab">Conséquence clinique</p><p>Des bicarbonates situés entre les deux valeurs attendues signent une acutisation ; des bicarbonates hors de l’intervalle signalent un trouble métabolique associé.</p><div class="key"><b>Limite.</b> Une alcalose métabolique due aux diurétiques, aux corticostéroïdes ou aux vomissements élève aussi les bicarbonates et simule une chronicité ; l’anamnèse tranche.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMra1003327" target="_blank" rel="noopener">Berend et al., approche physiologique des troubles acido-basiques, New England Journal of Medicine 2014</a>.</p></template>
<template data-pop="j96-gradient" data-title="Gradient alvéolo-artériel"><p class="lab">Définition</p><p>Le gradient est la différence entre la PAO₂ calculée et la PaO₂ mesurée : il chiffre l’oxygène perdu entre l’alvéole et l’artère.</p><p class="lab">Valeur normale</p><p>À l’air ambiant, il vaut 5 à 15 mmHg chez l’adulte jeune et augmente avec l’âge.</p><p class="lab">Usage</p><p>Un gradient normal avec une PaO₂ basse oriente vers une hypoventilation ; un gradient élevé oriente vers l’échangeur.</p><div class="key"><b>Piège.</b> Le gradient normal augmente avec la FiO₂ : sous fort débit d’oxygène, 100 mmHg peuvent être physiologiques. Il s’interprète donc surtout à l’air ambiant.</div></template>
<template data-pop="j96-altitude" data-title="Baisse de la pression inspirée d’oxygène"><p class="lab">Mécanisme</p><p>En altitude, la fraction d’oxygène reste de 21 %, mais la pression barométrique baisse. À 3 500 m, elle avoisine 490 mmHg : la pression inspirée d’oxygène tombe d’environ 150 à environ 93 mmHg.</p><p class="lab">Lecture gazométrique</p><p>La PaO₂ baisse, le gradient reste normal et l’hyperventilation réflexe abaisse la PaCO₂ ; l’oxygène corrige complètement l’hypoxémie.</p><div class="key"><b>Conséquence.</b> Un patient atteint d’insuffisance respiratoire chronique peut décompenser en montagne ou en avion, dont la cabine est pressurisée à une altitude équivalente pouvant atteindre 2 438 m, plafond fixé par les autorités européennes et nord-américaines de l’aviation ; une évaluation avant le vol se discute.</div><p class="src">Référence : Coker et al., déclaration clinique de la BTS sur le voyage aérien, Thorax 2022;77:329–350.</p></template>
<template data-pop="j96-va-q" data-title="Inadéquation ventilation/perfusion"><p class="lab">Mécanisme</p><p>Des unités alvéolaires reçoivent moins d’air que de sang. Leur sang ressort partiellement désaturé, et les unités bien ventilées, déjà saturées, ne peuvent le compenser. C’est le mécanisme d’hypoxémie le plus fréquent : BPCO, asthme, embolie pulmonaire, pneumopathies interstitielles.</p><p class="lab">Réponse à l’oxygène</p><p>Elle est bonne, car même une unité mal ventilée reçoit un air enrichi qui élève sa PAO₂ ; un faible débit suffit souvent.</p><div class="key"><b>Limite.</b> La vasoconstriction hypoxique limite naturellement cette inadéquation ; un oxygène excessif la lève et peut faire monter la PaCO₂ chez le patient à risque.</div></template>
<template data-pop="j96-shunt" data-title="Shunt vrai"><p class="lab">Définition</p><p>Le shunt est la fraction du débit cardiaque qui traverse le poumon sans contact avec un air ventilé : alvéoles condensées, œdémateuses ou collabées, ou communication droite-gauche intracardiaque ou vasculaire.</p><p class="lab">Mécanisme</p><p>Le sang shunté garde la composition veineuse et dilue le sang oxygéné. Augmenter la FiO₂ n’améliore que des unités déjà saturées : un large shunt résiste à l’oxygène pur.</p><p class="lab">Conséquence thérapeutique</p><p>Le traitement ré-aère les alvéoles par pression positive, traite la cause et, dans une atteinte unilatérale, place le poumon sain en position déclive.</p><div class="key"><b>Piège.</b> Une hypoxémie réfractaire avec poumon clair évoque un shunt intracardiaque ou des malformations artérioveineuses pulmonaires, que l’échocardiographie de contraste recherche.</div></template>
<template data-pop="j96-diffusion" data-title="Trouble de la diffusion"><p class="lab">Mécanisme</p><p>Au repos, le globule rouge séjourne environ 0,75 seconde dans le capillaire, et l’équilibre gazeux est atteint en un tiers de ce temps. Une membrane épaissie ou une surface réduite ralentit cet équilibre ; à l’effort, le transit raccourcit et la saturation chute.</p><p class="lab">Examen</p><p>La DLCO quantifie le trouble ; le test de marche de six minutes révèle la désaturation d’effort de la fibrose pulmonaire.</p><div class="key"><b>Limite.</b> Un trouble de diffusion pur explique rarement à lui seul une hypoxémie de repos importante ; une inadéquation ventilation/perfusion s’y associe.</div></template>
<template data-pop="j96-charge-capacite" data-title="Commande, capacité et charge"><p>La ventilation se maintient tant que la commande et la capacité musculaire suffisent à vaincre la charge. Quand la charge dépasse la capacité, le muscle se fatigue ; la commande réduit alors le volume courant, et la PaCO₂ monte.</p><p>Le traitement réduit la charge (bronchodilatateurs, pression expiratoire, drainage d’un épanchement), supplée la capacité (aide inspiratoire de la ventilation non invasive) et corrige le potassium et le phosphate.</p><div class="key"><b>Piège.</b> La respiration rapide et superficielle protège le muscle mais accroît la part de l’espace mort : elle annonce l’épuisement.</div></template>
<template data-pop="j96-pepi" data-title="Pression expiratoire positive intrinsèque"><p class="lab">Mécanisme</p><p>Dans la BPCO, l’expiration est lente et l’inspiration suivante commence avant la fin de la vidange. Il persiste en fin d’expiration une pression alvéolaire positive, par exemple 6 cm H₂O, que les muscles doivent annuler avant que l’air n’entre : c’est une charge à seuil, épuisante.</p><p class="lab">Conséquence thérapeutique</p><p>L’EPAP de la ventilation non invasive compense une partie de cette pression et réduit l’effort de déclenchement. Les valeurs rapportées dans la BPCO sévère stable sont de 4 à 6 cm H₂O, davantage en cas de distension marquée.</p><div class="key"><b>Limite.</b> Une EPAP excessive aggrave la distension ; elle se règle au-dessous de la pression intrinsèque estimée.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-sommeil" data-title="Hypoventilation du sommeil"><p>Le sommeil diminue la commande ventilatoire ; pendant le sommeil paradoxal, l’atonie des muscles accessoires laisse le diaphragme seul. Céphalées matinales, sommeil non réparateur, somnolence diurne et orthopnée en témoignent. Dans les déformations thoraciques, l’hypoventilation nocturne précède l’hypercapnie diurne et en prédit la survenue ; la capnographie transcutanée nocturne l’objective (critères dans l’onglet Examens).</p><div class="key"><b>Indice.</b> Une élévation inexpliquée des bicarbonates chez un patient neuromusculaire évoque une hypoventilation nocturne compensée.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-soh" data-title="Syndrome obésité-hypoventilation"><p>Le syndrome associe une obésité (indice de masse corporelle ≥ 30 kg/m²) à une hypercapnie diurne (PaCO₂ ≥ 45 mmHg) qu’aucune autre maladie n’explique ; des apnées obstructives du sommeil l’accompagnent dans environ 90 % des cas. La masse thoracique et abdominale accroît la charge élastique, les apnées fragmentent la ventilation nocturne et la réponse au dioxyde de carbone s’émousse.</p><p>En décompensation, la ventilation non invasive exige souvent des pressions élevées (IPAP &gt; 30, EPAP &gt; 8 cm H₂O). Une étude du sommeil suit dans les trois mois ; en cas d’apnées sévères, un essai de pression positive continue est approprié. La perte de poids complète le traitement.</p><div class="key"><b>Piège.</b> L’hypercapnie d’un patient obèse sans obstruction ne doit pas être étiquetée BPCO.</div><p class="src">Références : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-neuromusculaire" data-title="Maladies neuromusculaires : une insuffisance masquée"><p>La faiblesse musculaire empêche les signes habituels de lutte : ni tachypnée franche, ni tirage marqué ; la dyspnée et l’hypercapnie diurne surviennent tard. Le médecin recherche une orthopnée, une respiration paradoxale en décubitus, une toux inefficace, des troubles de la déglutition, des céphalées matinales et une perte de poids. La surveillance associe capacité vitale assis et couché, PImax ou SNIP, gazométrie et capnographie nocturne ; la ventilation commence si possible avant l’hypercapnie diurne.</p><div class="key"><b>Limite.</b> La dégradation peut être brutale ; la BTS conseille alors les soins intermédiaires ou intensifs, où l’intubation reste possible.</div><p class="src">Références : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-cyanose" data-title="Cyanose : seuil et pièges"><p>La cyanose dépend de la quantité absolue d’hémoglobine désaturée, non de la saturation. Un anémique peut donc être profondément hypoxémique sans cyanose, alors qu’un polyglobulique se cyanose tôt. Une méthémoglobinémie donne une teinte ardoisée avec une PaO₂ normale. La cyanose centrale (lèvres, langue) traduit une hypoxémie ; la cyanose périphérique, plutôt un bas débit ou le froid.</p><div class="key"><b>Limite.</b> Ce signe dépend de l’éclairage et de la pigmentation cutanée ; son absence ne rassure jamais.</div></template>
<template data-pop="j96-signes-hypercapnie" data-title="Lire l’hypercapnie au lit du patient"><p>L’astérixis, perte brève et répétée du tonus postural des mains tendues, traduit l’encéphalopathie hypercapnique ; il suit les céphalées, les sueurs et la somnolence. La vitesse d’installation compte davantage que la valeur absolue : un patient chronique reste éveillé à 65 mmHg, alors qu’une hausse aiguë à 70 mmHg peut entraîner un coma.</p><div class="key"><b>Limite.</b> L’astérixis existe aussi dans l’encéphalopathie hépatique ou urémique ; la gazométrie tranche.</div></template>
<template data-pop="j96-tirage" data-title="Tirage et muscles accessoires"><p>Contre une charge élevée, le patient recrute scalènes et sternocléidomastoïdiens ; la dépression intrathoracique accrue creuse les espaces intercostaux et les creux sus-claviculaires. Ces signes mesurent cliniquement le travail respiratoire et imposent une gazométrie et l’anticipation d’un support.</p><div class="key"><b>Piège.</b> Ils manquent chez le patient neuromusculaire ou épuisé, dont les muscles ne peuvent plus produire cet effort.</div></template>
<template data-pop="j96-respiration-paradoxale" data-title="Respiration abdominale paradoxale"><p>Normalement, le diaphragme descend à l’inspiration et l’abdomen se soulève avec le thorax. Lorsque le diaphragme est fatigué ou paralysé, la dépression créée par les muscles accessoires l’aspire vers le haut : l’abdomen se creuse pendant que le thorax s’élève. Dans une détresse aiguë, ce signe annonce l’arrêt respiratoire et impose une décision de support immédiate.</p><div class="key"><b>Limite.</b> En décubitus, il révèle aussi une paralysie diaphragmatique bilatérale chronique, avec orthopnée.</div></template>
<template data-pop="j96-coeur-pulmonaire" data-title="Cœur pulmonaire chronique"><p class="lab">Mécanisme</p><p>L’hypoxie alvéolaire chronique contracte puis remodèle les artérioles pulmonaires. La pression artérielle pulmonaire monte ; le ventricule droit s’hypertrophie, se dilate, puis défaille.</p><p class="lab">Signes et examen</p><p>Œdèmes des membres inférieurs, turgescence jugulaire, reflux hépatojugulaire et éclat du deuxième bruit au foyer pulmonaire en témoignent. L’échocardiographie estime la pression pulmonaire et la fonction ventriculaire droite.</p><p class="lab">Conséquence thérapeutique</p><p>Corriger durablement l’hypoxémie limite la vasoconstriction : c’est pourquoi un cœur pulmonaire relève le seuil de l’oxygénothérapie de longue durée à une PaO₂ inférieure à 60 mmHg.</p><div class="key"><b>Limite.</b> D’autres causes d’hypertension pulmonaire, thromboemboliques ou cardiaques gauches, coexistent parfois et relèvent d’un bilan spécialisé.</div></template>
<template data-pop="j96-lactate" data-title="Lactate et hypoxie tissulaire"><p class="lab">Mécanisme</p><p>Lorsque l’apport d’oxygène ne couvre plus les besoins, la cellule recourt à la glycolyse anaérobie et libère du lactate ; la valeur normale est inférieure à 2 mmol/L.</p><p class="lab">Interprétation</p><p>Chez un patient hypoxémique, un lactate élevé signale une hypoxie tissulaire, aggravée par une anémie ou un bas débit, ou un choc associé ; il oriente vers la réanimation et la recherche d’un sepsis.</p><div class="key"><b>Piège.</b> Les nébulisations répétées de salbutamol, la metformine et l’insuffisance hépatique élèvent aussi le lactate sans hypoxie tissulaire.</div></template>
<template data-pop="j96-echographie" data-title="Échographie pulmonaire au lit"><p class="lab">Principe</p><p>Le poumon aéré ne transmet pas les ultrasons ; ses artefacts changent quand l’eau, l’air ou le tissu modifient la surface pleurale.</p><p class="lab">Profils</p><p>Des lignes B nombreuses et bilatérales évoquent un syndrome interstitiel, notamment un œdème cardiogénique ; une consolidation, une pneumonie ; l’absence de glissement pleural avec point poumon, un pneumothorax. Un profil normal chez un patient hypoxémique porteur d’une thrombose veineuse profonde oriente vers une embolie pulmonaire.</p><div class="key"><b>Limite.</b> L’examen dépend de l’opérateur et ne remplace ni l’angio-TDM pour l’embolie ni la gazométrie pour la gravité.</div><p class="src">Référence : <a href="https://doi.org/10.1378/chest.07-2800" target="_blank" rel="noopener">Lichtenstein et Mezière, Chest 2008</a>.</p></template>
<template data-pop="j96-cibles" data-title="Cibles de saturation : texte retenu et contentieux"><p class="lab">Texte retenu</p><p>La BTS 2017, texte primaire en vigueur, retient 94 à 98 % pour la plupart des patients aigus et 88 à 92 % pour les patients à risque d’hypercapnie ; GOLD 2026 retient aussi 88 à 92 % dans l’exacerbation de BPCO. Aucune société suisse ne fixe de cibles propres.</p><p class="lab">Justification</p><p>La limite de 94 % ménage une marge pour l’erreur de l’oxymètre. La méta-analyse IOTA (25 essais, 16 037 adultes) a montré qu’une stratégie libérale augmente la mortalité hospitalière (risque relatif 1,21, certitude élevée), avec un effet défavorable possible au-delà de 94 à 96 %.</p><p class="lab">Contentieux</p><p>Certains auteurs proposent un plafond plus bas, autour de 96 %, chez le patient non hypercapnique ; cette proposition reste compatible avec la fourchette de la BTS.</p><div class="key"><b>Limite.</b> Soins palliatifs, intoxication au monoxyde de carbone et arrêt cardiaque suivent leurs propres règles.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017</a> ; <a href="https://doi.org/10.1016/S0140-6736(18)30479-3" target="_blank" rel="noopener">IOTA, Lancet 2018</a>.</p></template>
<template data-pop="j96-dispositifs" data-title="Dispositifs d’oxygène et pièges"><p>Dans le masque Venturi, un jet d’oxygène à travers un orifice calibré entraîne une quantité fixe d’air : la FiO₂ est fixe (24, 28, 35, 40 ou 60 % selon la valve), et augmenter le débit au-dessus du minimum suit seulement mieux un patient tachypnéique. Sous lunettes ou masque simple, la FiO₂ dépend de la ventilation du patient ; un masque simple au-dessous de 5 L/min fait réinhaler le dioxyde de carbone. Le masque à réservoir, à 15 L/min, est réservé au patient critique.</p><div class="key"><b>Conduite.</b> Une fois le patient stabilisé, la BTS conseille de passer du Venturi aux lunettes, plus confortables pour manger et parler.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, section 10</a>.</p></template>
<template data-pop="j96-rebond" data-title="Hypoxémie de rebond"><p class="lab">Mécanisme</p><p>Un patient devenu hypercapnique sous oxygène garde une PaCO₂ élevée plusieurs minutes après l’arrêt. Avec une PaCO₂ de 80 mmHg à l’air ambiant, la PAO₂ tombe vers 50 mmHg : la saturation chute au-dessous de sa valeur initiale.</p><p class="lab">Conduite</p><p>La BTS réduit l’oxygène au plus faible niveau qui maintient 88 à 92 %, par Venturi à 24 ou 28 % ou lunettes à 1 à 2 L/min, puis contrôle la gazométrie.</p><div class="key"><b>Erreur fréquente.</b> Retirer le masque d’un patient somnolent et hypercapnique : le danger est l’excès d’oxygène, non l’oxygène lui-même.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017</a>.</p></template>
<template data-pop="j96-austin" data-title="Essai d’Austin (2010)"><p class="lab">Plan</p><p>Cet essai randomisé en grappes, mené par le service ambulancier de Hobart, en Tasmanie, a comparé chez 405 patients en exacerbation présumée de BPCO un oxygène à haut débit et un oxygène titré vers 88–92 %.</p><p class="lab">Résultats</p><p>La mortalité était de 9 % sous haut débit contre 4 % sous oxygène titré (risque relatif 0,42) ; chez les 214 patients dont la BPCO était confirmée, de 9 % contre 2 % (risque relatif 0,22). L’acidose respiratoire et l’hypercapnie étaient moins fréquentes sous oxygène titré.</p><div class="key"><b>Limite.</b> L’essai était monocentrique, préhospitalier, d’effectif modeste, avec une adhésion imparfaite au protocole ; il fonde pourtant la cible de 88–92 % reprise par la BTS et GOLD.</div><p class="src">Référence : <a href="https://doi.org/10.1136/bmj.c5462" target="_blank" rel="noopener">Austin et al., British Medical Journal 2010</a>.</p></template>
<template data-pop="j96-haut-debit" data-title="Oxygène nasal à haut débit : mécanismes"><p class="lab">Lavage de l’espace mort</p><p>Le débit chasse le gaz expiré du nasopharynx ; chaque inspiration contient moins de dioxyde de carbone, ce qui améliore la ventilation alvéolaire à ventilation totale égale.</p><p class="lab">Pression positive et humidification</p><p>Bouche fermée, une pression expiratoire modeste se crée et croît avec le débit. Le gaz chauffé et humidifié préserve la clairance mucociliaire et le confort.</p><div class="key"><b>Limite.</b> Cette pression n’est ni réglée ni garantie : le haut débit ne remplace pas la ventilation non invasive dans l’acidose hypercapnique de la BPCO.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.01574-2021" target="_blank" rel="noopener">ERS 2022</a> ; <a href="https://doi.org/10.1056/NEJMoa1503326" target="_blank" rel="noopener">FLORALI 2015</a>.</p></template>
<template data-pop="j96-contentieux-hypoxemique" data-title="Hypoxémie aiguë : haut débit, ventilation non invasive ou pression positive continue"><p class="lab">Textes en présence</p><p>L’ERS/ATS 2017 ne formule aucune recommandation sur la ventilation non invasive dans l’insuffisance hypoxémique de novo, faute de preuves suffisantes, mais recommande fortement la pression positive dans l’œdème pulmonaire cardiogénique. L’ERS 2022, texte primaire plus récent, suggère le haut débit plutôt que l’oxygène standard et plutôt que la ventilation non invasive dans l’insuffisance hypoxémique aiguë (recommandations conditionnelles).</p><p class="lab">Choix retenu</p><p>Dans l’insuffisance hypoxémique non cardiogénique, le haut débit est le support de première intention, selon le texte le plus récent. Dans l’œdème pulmonaire cardiogénique, la pression positive reste la règle : l’ERS 2022 ne traite pas cette indication et ne contredit donc pas la recommandation forte de 2017.</p><p class="lab">Niveau de preuve et limites</p><p>Dans FLORALI (310 patients hypoxémiques non hypercapniques), le taux d’intubation n’a pas différé significativement (38 % sous haut débit, 47 % sous oxygène standard, 50 % sous ventilation non invasive), mais la mortalité à 90 jours était plus faible sous haut débit. Dans la COVID-19, l’essai britannique RECOVERY-RS (JAMA 2022, 1 273 patients) a réduit avec la pression positive continue le critère combinant intubation et décès à 30 jours (36,3 % contre 44,4 % sous oxygène standard), sans bénéfice du haut débit (44,3 % contre 45,1 %) ; ce résultat concerne une population particulière.</p><div class="key"><b>Conséquence.</b> Quel que soit le support, l’intubation ne doit pas être retardée : fréquence respiratoire, signes de lutte et indice ROX guident la réévaluation.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.01574-2021" target="_blank" rel="noopener">ERS 2022</a> ; <a href="https://doi.org/10.1183/13993003.02426-2016" target="_blank" rel="noopener">ERS/ATS 2017</a> ; <a href="https://doi.org/10.1001/jama.2022.0028" target="_blank" rel="noopener">Perkins et al., RECOVERY-RS, JAMA 2022</a>.</p></template>
<template data-pop="j96-rox" data-title="Indice ROX"><p class="lab">Calcul</p><p>ROX = (SpO₂/FiO₂) / fréquence respiratoire. Avec une SpO₂ de 92 %, une FiO₂ de 0,5 et une fréquence de 28 : (92/0,5)/28 ≈ 6,6.</p><p class="lab">Seuils validés</p><p>Chez des patients atteints de pneumonie sous haut débit, un indice ≥ 4,88 à 2, 6 ou 12 heures s’associait à un moindre risque d’intubation ; des valeurs inférieures à 2,85, 3,47 et 3,85 à 2, 6 et 12 heures prédisaient l’échec.</p><div class="key"><b>Limite.</b> Validé dans la pneumonie, l’indice n’est pas un critère d’intubation isolé : un indice bas ou stagnant impose une réévaluation en réanimation, la clinique restant prioritaire.</div><p class="src">Référence : <a href="https://doi.org/10.1164/rccm.201803-0589OC" target="_blank" rel="noopener">Roca et al., American Journal of Respiratory and Critical Care Medicine 2019</a>.</p></template>

mportante empêche le ventilateur de délivrer les pressions réglées. Source : <a href="https://commons.wikimedia.org/wiki/File:BIPAP.JPG" target="_blank" rel="noopener" data-reference-source="1">James Heilman, MD, Wikimedia Commons</a> ; <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener" data-reference-source="1">licence CC BY-SA 4.0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p>Le ventilateur alterne l’IPAP à l’inspiration et l’EPAP à l’expiration. Leur différence, l’aide inspiratoire, augmente le volume courant et donc la ventilation alvéolaire. L’EPAP évacue le dioxyde de carbone par la fuite intentionnelle du masque, compense la pression expiratoire positive intrinsèque, maintient ouvertes les voies aériennes supérieures et recrute des alvéoles.</p><p>La pression positive continue n’applique qu’un niveau, sans aide inspiratoire : elle traite l’œdème pulmonaire cardiogénique et les apnées obstructives, non l’hypoventilation.</p><div class="key"><b>Pratique.</b> En aigu, le masque bucco-nasal est le plus utilisé ; une fréquence de sécurité protège le patient qui fait des pauses.</div></template>
<template data-pop="j96-vni-indications" data-title="Indications de la ventilation non invasive (ERS/ATS 2017)"><p class="lab">Dans la BPCO</p><p>La ventilation non invasive s’envisage lorsque pH ≤ 7,35, PaCO₂ &gt; 45 mmHg et fréquence respiratoire supérieure à 20–24 par minute persistent malgré le traitement standard. Aucun pH plancher n’interdit l’essai, mais plus le pH est bas, plus l’échec est probable et plus la surveillance doit être étroite.</p><p class="lab">Indications conditionnelles</p><p>Immunodépression (ventilation précoce), insuffisance postopératoire, traumatisme thoracique lorsque la douleur est contrôlée, palliation de la dyspnée en fin de vie, prévention de l’échec d’extubation chez le patient à haut risque.</p><div class="key"><b>Contre.</b> Dans l’insuffisance après extubation déjà installée, la ventilation non invasive retarde l’intubation sans bénéfice ; dans l’hypercapnie sans acidose, elle n’a pas montré d’effet.</div><p class="src">Référence : <a href="https://doi.org/10.1183/13993003.02426-2016" target="_blank" rel="noopener">Rochwerg et al., ERS/ATS 2017</a>.</p></template>
<template data-pop="j96-vni-reglages" data-title="Régler une ventilation non invasive"><p class="lab">Pressions</p><p>L’IPAP initiale de 15 cm H₂O monte en 10 à 30 minutes vers 20 à 30 cm H₂O, d’autant plus vite que l’acidose est sévère et le patient corpulent. L’EPAP, d’au moins 3 cm H₂O, s’élève en cas d’obésité, d’apnées obstructives ou d’hypoxémie persistante. L’oxygène, ajouté près du masque, vise 88–92 % ; les réglages ventilatoires sont optimisés avant d’augmenter la FiO₂.</p><p class="lab">Échecs techniques</p><p>Fuite excessive, aide insuffisante et asynchronie sont les causes les plus fréquentes ; un thorax qui se soulève peu signale une IPAP insuffisante.</p><p class="lab">Durée</p><p>La ventilation est maximale pendant les 24 premières heures, puis réduite le jour sur 2 à 3 jours, quand le pH et la PaCO₂ se normalisent.</p><div class="key"><b>Limite.</b> Une hypoxémie sévère sous ventilation non invasive impose un ventilateur capable de délivrer une FiO₂ précise et élevée.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-vni-echec" data-title="Échec et contre-indications de la ventilation non invasive"><p class="lab">Prédicteurs</p><p>Une amélioration du pH et de la fréquence respiratoire en une à deux heures, avec moins d’agitation, prédit le succès. Dans la BPCO, un pH qui reste inférieur à 7,25 sous ventilation optimisée, avec une fréquence respiratoire élevée ou une confusion nouvelle, fait envisager l’intubation. Dans l’insuffisance hypoxémique, un score HACOR supérieur à 5 après une heure prédit l’échec.</p><p class="lab">Contre-indications</p><p>Elles sont rarement absolues : masque impossible à rendre étanche (traumatisme ou brûlure faciale), obstruction fixe des voies aériennes supérieures, vomissements incoercibles, pneumothorax non drainé. Un pH inférieur à 7,15, ou à 7,25 avec un autre signe défavorable, un score de Glasgow inférieur à 8, une agitation ou des sécrétions abondantes n’interdisent pas l’essai, mais imposent les soins intermédiaires ou intensifs et une décision précoce sur l’intubation.</p><div class="key"><b>Danger.</b> Prolonger une ventilation non invasive inefficace retarde l’intubation et augmente la mortalité ; le médecin vérifie masque, fuites et synchronisation, puis décide sans attendre.</div><p class="src">Références : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a> ; <a href="https://doi.org/10.1007/s00134-016-4601-3" target="_blank" rel="noopener">Duan et al., score HACOR, Intensive Care Medicine 2017</a>.</p></template>
<template data-pop="j96-intubation" data-title="Intuber un patient hypoxémique"><p class="lab">Risque</p><p>Le patient hypoxémique désature en quelques secondes pendant l’apnée. L’induction supprime le tonus sympathique et la pression positive réduit le retour veineux : le collapsus est fréquent.</p><p class="lab">Préparation et induction</p><p>L’équipe préoxygène par haut débit nasal ou ventilation non invasive. Un opérateur expérimenté intube, matériel de voie aérienne difficile, remplissage et vasopresseur prêts ; l’hypnotique est choisi pour sa tolérance hémodynamique.</p><p class="lab">Après l’intubation</p><p>La sédation est titrée vers un niveau de vigilance défini, et un mode assisté est repris dès que possible. Chez l’obstructif, le ventilateur impose une fréquence basse et une expiration longue ; dans le SDRA, la ventilation protectrice emploie de petits volumes.</p><div class="key"><b>Limite.</b> Molécules, doses et réglages relèvent des protocoles d’anesthésie et de réanimation et de l’information professionnelle suisse.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-hypercapnie-permissive" data-title="Hypercapnie permissive"><p class="lab">Principe</p><p>Chez le patient très obstructif ventilé, normaliser la PaCO₂ imposerait des volumes et des fréquences élevés, donc distension dynamique, barotraumatisme et collapsus.</p><p class="lab">Recommandation</p><p>La BTS accepte un pH de 7,20 à 7,25 pour éviter des pressions élevées, avec une fréquence de 10 à 15 par minute et un rapport inspiration/expiration d’au moins 1/3.</p><div class="key"><b>Limite.</b> L’hypercapnie dilate les vaisseaux cérébraux : elle est à éviter en cas d’hypertension intracrânienne.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016, recommandations 14 et 15</a>.</p></template>
<template data-pop="j96-palliatif" data-title="Insuffisance respiratoire en soins palliatifs"><p class="lab">Objectif</p><p>Les soins visent à soulager la dyspnée et à préserver la communication, selon les volontés exprimées ou les directives anticipées.</p><p class="lab">Moyens</p><p>L’oxygène soulage la dyspnée du patient hypoxémique, non celle du patient normoxémique ; un ventilateur à main dirigé vers le visage peut aider. Les opioïdes à faible dose diminuent la perception de la dyspnée. L’ERS/ATS suggère d’offrir la ventilation non invasive pour soulager la dyspnée en fin de vie.</p><div class="key"><b>Limite.</b> Lorsque le confort devient l’unique objectif, les cibles de saturation et la surveillance perdent leur pertinence ; la BTS le prévoit explicitement.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017</a> ; <a href="https://doi.org/10.1183/13993003.02426-2016" target="_blank" rel="noopener">ERS/ATS 2017</a>.</p></template>
<template data-pop="j96-old" data-title="Oxygénothérapie de longue durée : critères et preuves"><p class="lab">Critères</p><p>L’indication suppose une maladie chronique stable, un traitement optimisé et une PaO₂ de repos ≤ 55 mmHg (7,3 kPa), ou ≤ 60 mmHg (8 kPa) avec signes d’hypertension pulmonaire ou hématocrite ≥ 55 % (pratique suisse, Revue médicale suisse 2023 ; seuils identiques dans GOLD 2026). La mesure, artérielle et non oxymétrique, est répétée : deux fois en trois semaines selon GOLD.</p><p class="lab">Preuves</p><p>Essai du Medical Research Council (1981) : 87 patients, oxygène au moins 15 heures par jour ; 19 décès sur 42 sous oxygène contre 30 sur 45 sans oxygène en cinq ans. Essai NOTT (1980) : 203 patients ; mortalité à 24 mois de 22,4 % sous oxygène continu (17,7 heures par jour en moyenne) contre 40,8 % sous oxygène nocturne de 12 heures. Essai LOTT (2016) : aucun bénéfice dans la désaturation modérée.</p><p class="lab">Durée quotidienne</p><p>GOLD retient au moins 15 heures, chiffre de l’essai du Medical Research Council. Plus la durée est longue, plus elle se rapproche de l’oxygène continu de NOTT.</p><div class="key"><b>Limite.</b> L’oxygène de déambulation ne se justifie que s’il améliore réellement l’effort ; une désaturation isolée du sommeil fait d’abord rechercher apnées ou hypoventilation.</div><p class="src">Références : <a href="https://goldcopd.org/wp-content/uploads/2026/01/GOLD-Pocket-Guide-2026-v1.1-20Nov2025_WMV2.pdf" target="_blank" rel="noopener">GOLD 2026</a> ; <a href="https://doi.org/10.1055/s-0034-1377329" target="_blank" rel="noopener">Société allemande de pneumologie, prise de position 2014</a> ; <a href="https://doi.org/10.53738/REVMED.2023.19.850.2153" target="_blank" rel="noopener">Brügger et al., Oxygénothérapie à domicile, Revue médicale suisse 2023</a> (résumé).</p></template>
<template data-pop="j96-suisse-prescription" data-title="Prescrire l’oxygène à domicile en Suisse"><p class="lab">Cadre</p><p>L’oxygénothérapie à domicile est remboursée par l’assurance obligatoire des soins selon la liste des moyens et appareils (annexe 2 de l’OPAS, sous-chapitre 14.10). Le patient s’approvisionne auprès d’un prestataire de soins ou directement auprès du fournisseur.</p><p class="lab">Qui prescrit au-delà de trois mois</p><p>Depuis le 01.07.2025, la poursuite du traitement au-delà de trois mois ne peut plus être établie par un spécialiste en médecine interne générale ou en pédiatrie. L’OFSP justifie ce choix par les risques d’hypercapnie et d’hyperoxie : le diagnostic et la surveillance reposent sur la gazométrie, réalisée dans les hôpitaux et par les pneumologues. Une exception subsiste pour certaines situations palliatives de fin de vie, lorsque le risque de complication est jugé acceptable.</p><p class="lab">Choix du dispositif</p><p>Le dispositif retenu est celui qui couvre le besoin en oxygène du patient et respecte sa mobilité.</p><div class="key"><b>Limite.</b> Les positions et conditions de la liste changent régulièrement ; la version en vigueur fait foi.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/1NSmcyGdCEpe/Commentaires%20des%20modifications%20de%20l'annexe%202%20de%20l'OPAS%20pour%20le%2001.07.2025.pdf" target="_blank" rel="noopener">OFSP, commentaire des modifications de la liste des moyens et appareils au 01.07.2025</a> ; <a href="https://doi.org/10.53738/REVMED.2023.19.850.2153" target="_blank" rel="noopener">Brügger et al., Oxygénothérapie à domicile, Revue médicale suisse 2023</a> (résumé).</p></template>
<template data-pop="j96-vni-domicile-bpco" data-title="Ventilation à domicile après une exacerbation de BPCO"><p class="lab">Pourquoi attendre</p><p>Beaucoup de patients hypercapniques à la sortie normalisent leur PaCO₂ en quelques semaines. L’essai RESCUE (2014), qui débutait la ventilation 48 heures après l’épisode chez 201 patients, n’a montré aucun bénéfice à un an : la PaCO₂ baissait aussi dans le groupe témoin.</p><p class="lab">Ce qui marche</p><p>L’essai HOT-HMV (116 patients, PaCO₂ &gt; 53 mmHg persistante 2 à 4 semaines après une exacerbation acidosique) a réduit d’environ moitié le risque de réadmission ou de décès à 12 mois (rapport de risques 0,49 ; six patients à traiter). Un essai germano-autrichien de 2014 chez 195 patients stables avec PaCO₂ ≥ 7 kPa a réduit la mortalité à un an de 33 % à 12 %.</p><p class="lab">Seuils discordants</p><p>Société suisse de pneumologie 2020 : PaCO₂ &gt; 7 kPa (52,5 mmHg). Groupe de travail de l’ERS : 6,7 kPa (50 mmHg). HOT-HMV : 53 mmHg. GOLD 2026 évoque une hypercapnie diurne marquée après une hospitalisation récente. Le texte retenu en Suisse est celui de la Société suisse de pneumologie.</p><div class="key"><b>Limite.</b> Ces recommandations sont conditionnelles ; une obésité ou des apnées associées modifient la stratégie.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Janssens et al., Société suisse de pneumologie, Respiration 2020</a>.</p></template>
<template data-pop="j96-grossesse" data-title="Insuffisance respiratoire et grossesse"><p class="lab">Physiologie</p><p>La progestérone stimule la commande ventilatoire : la PaCO₂ normale de la femme enceinte avoisine 30 mmHg, avec des bicarbonates abaissés et un pH légèrement alcalin.</p><p class="lab">Piège</p><p>Une PaCO₂ de 40 mmHg, normale hors grossesse, traduit une hypoventilation relative et peut annoncer l’épuisement.</p><p class="lab">Conduite</p><p>La cible reste de 94 à 98 % ; la mère non hypoxémique ne reçoit pas d’oxygène, qui n’a aucun bénéfice démontré pour le fœtus dans ce cas. En fin de grossesse, le décubitus latéral gauche améliore le retour veineux ; l’équipe obstétricale est associée d’emblée.</p><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, recommandations sur la grossesse</a>.</p></template>
<template data-pop="j96-cooxymetrie" data-title="Co-oxymétrie"><p class="lab">Principe</p><p>L’analyseur de gaz du sang mesure l’absorption de nombreuses longueurs d’onde et distingue oxyhémoglobine, désoxyhémoglobine, COHb et MetHb.</p><p class="lab">Indications</p><p>Suspicion d’intoxication au monoxyde de carbone (incendie, chauffage défectueux), méthémoglobinémie médicamenteuse ou toxique, discordance entre la SpO₂ et la clinique.</p><p class="lab">Conséquence thérapeutique</p><p>Dans l’intoxication au monoxyde de carbone, l’oxygène à la concentration la plus élevée possible accélère l’élimination de la COHb ; la SpO₂ ne sert pas à le titrer.</p><div class="key"><b>Piège.</b> La PaO₂ reste normale dans l’intoxication au monoxyde de carbone, malgré l’hypoxie tissulaire.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017</a>.</p></template>
<template data-pop="j96-naloxone" data-title="Naloxone"><p class="lab">Mécanisme</p><p>Antagoniste compétitif des récepteurs opioïdes, la naloxone déplace l’opioïde et restaure la commande ventilatoire. Par voie intraveineuse, son effet s’installe en général en deux minutes.</p><p class="lab">Posologie suisse</p><p>Dans le surdosage connu ou suspecté de l’adulte, l’information suisse prévoit 0,4 à 2 mg par voie intraveineuse, intramusculaire ou sous-cutanée, répétés toutes les 2 à 3 minutes si la ventilation ne s’améliore pas. Après une anesthésie, 0,1 à 0,2 mg par voie intraveineuse suffisent généralement, complétés par 0,1 mg toutes les 2 à 3 minutes. Si 10 mg restent sans effet, la dépression respiratoire n’est pas due à un opioïde, sauf buprénorphine.</p><p class="lab">Surveillance</p><p>La durée de l’effet antagoniste dépend de la dose, habituellement de 1 à 4 heures, et la demi-vie plasmatique est d’environ 1 à 1,5 heure. Certains opioïdes agissent plus longtemps : la dépression respiratoire peut réapparaître, ce qui impose une surveillance étroite et parfois une perfusion.</p><div class="key"><b>Risque.</b> Chez le patient dépendant, la naloxone déclenche un sevrage ; l’objectif est une ventilation suffisante, non un réveil complet.</div><p class="src">Référence : information professionnelle suisse Naloxon OrPha®, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>
<template data-pop="pareto-j96-meca" data-title="Pareto — Définitions, physiologie et mécanismes"><p class="ratio" data-cover="j96-0,j96-1,j96-2,j96-3,j96-4,j96-5,j96-6"></p><ul><li>PaO₂ &lt; 60 mmHg (8 kPa) ou PaCO₂ &gt; 45 mmHg (6 kPa) au repos ; 60 mmHg est le coude de la courbe de dissociation.</li><li>Type 1 : l’échangeur a cédé, PaCO₂ normale ou basse. Type 2 : la pompe ne ventile plus assez.</li><li>Aigu : pH bas, bicarbonates peu élevés ; chronique : bicarbonates élevés, pH presque normal ; acutisation : bicarbonates élevés et pH &lt; 7,35.</li><li>Insuffisance aiguë définie par la ventilation invasive : 77,6 pour 100 000 adultes par an, mortalité à 90 jours 41 % ; ventilation non invasive à domicile : 38 pour 100 000 habitants en Suisse romande (2018).</li><li>Gradient normal : hypoventilation ou altitude. Gradient élevé : inadéquation ventilation/perfusion ou diffusion, qui répondent à l’oxygène, ou shunt, qui y résiste.</li><li>Hypercapnie : déséquilibre commande, capacité, charge ; début nocturne ; décompensation sur infection, insuffisance cardiaque, embolie, sédatif ou oxygène sans cible.</li></ul></template>
<template data-pop="pareto-j96-clin" data-title="Pareto — Clinique et démarche diagnostique"><p class="ratio" data-cover="j96-7,j96-8"></p><ul><li>Gravité : fréquence &gt; 30, tirage, respiration paradoxale, bradypnée secondaire, baisse de vigilance.</li><li>Hypercapnie : céphalées, sueurs, somnolence, astérixis ; cyanose tardive, absente chez l’anémique.</li><li>Gazométrie avec FiO₂ notée chez tout patient grave, désaturant ou à risque d’hypercapnie ; rapport PaO₂/FiO₂ &lt; 300 mmHg, lactate.</li><li>Hypercapnie sans maladie bronchique : toxique, atteinte neuromusculaire, obésité-hypoventilation.</li></ul></template>
<template data-pop="pareto-j96-tt" data-title="Pareto — Urgence, oxygène et supports ventilatoires"><p class="ratio" data-cover="j96-9,j96-10,j96-11,j96-12"></p><ul><li>Cible 94–98 %, ou 88–92 % en cas de risque d’hypercapnie (Venturi 24–28 %), gazométrie à 30–60 minutes, jamais d’arrêt brutal.</li><li>Hypoxémie aiguë non hypercapnique : haut débit nasal ; indice ROX &lt; 3,47 à 6 heures prédictif d’échec.</li><li>Ventilation non invasive : BPCO avec pH ≤ 7,35 et œdème cardiogénique ; IPAP 15 puis 20–30 cm H₂O ; jugée à une ou deux heures.</li><li>Intubation : arrêt imminent, échec du support, pH &lt; 7,15 persistant, Glasgow &lt; 8 ; chez l’obstructif, fréquence 10–15, expiration longue, pH 7,20–7,25 toléré.</li></ul></template>
<template data-pop="pareto-j96-crit" data-title="Pareto — Chronicité, suivi et critères"><p class="ratio" data-cover="j96-13,j96-14,j96-15"></p><ul><li>Oxygène de longue durée : PaO₂ ≤ 55 mmHg, ou ≤ 60 mmHg avec signes d’hypertension pulmonaire ou hématocrite ≥ 55 %, mesures répétées, au moins 15 heures par jour ; au-delà de trois mois, prescription par un pneumologue.</li><li>Ventilation à domicile : BPCO avec PaCO₂ &gt; 7 kPa persistante ; obésité-hypoventilation après étude du sommeil ; neuromusculaire dès les symptômes avec capacité vitale &lt; 50 %.</li><li>Gazométrie 2 à 4 semaines après une exacerbation hypercapnique ; grossesse : PaCO₂ normale ≈ 30 mmHg ; monoxyde de carbone : SpO₂ faussement normale.</li></ul></template>
