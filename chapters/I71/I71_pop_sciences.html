<template data-pop="i71-paroi" data-title="Dissection : malperfusion dynamique ou statique"><p>La malperfusion correspond à un apport sanguin insuffisant dans un territoire. Une dissection peut la provoquer par compression du vrai chenal. Le rapport des pressions entre les chenaux fait varier cet obstacle : le mécanisme est dynamique.</p><p>La dissection peut aussi pénétrer une branche et y produire une sténose ou une thrombose plus fixe. Le mécanisme est alors statique. Ces deux mécanismes peuvent coexister. L’équipe confronte l’imagerie aux signes de souffrance de l’organe.</p><div class="key"><b>À retenir.</b> Un rein peu perfusé ou un intestin ischémique peut rendre une dissection descendante compliquée. La classification par segment ne suffit pas.</div>
<div class="lab">Fréquence et gravité</div><p>Environ 30 % des dissections de type A se compliquent d’une malperfusion. La mortalité opératoire croît avec le nombre d’organes touchés, et la malperfusion mésentérique tue 65 à 95 % des patients.</p>
<div class="lab">Ce qui change la décision</div><p>Dans le type A, la réparation centrale de l’aorte rétablit le plus souvent le flux du vrai chenal : la chirurgie aortique immédiate est recommandée (classe I). Une obstruction dynamique répond en principe à la fermeture de la porte d’entrée, qui décomprime le faux chenal ; une obstruction statique peut exiger un geste sur la branche, par stent ou pontage (classe IIa).</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, section 9.3.1.4.2, tableau de recommandations 48 et figure 34.</p>
</template>
<template data-pop="i71-laplace" data-title="Laplace : tension et contrainte pariétale"><p>Pour un cylindre à paroi mince, T = P × r décrit une tension par unité de longueur. La contrainte moyenne vaut σ = P × r / e. La pression transmurale, le rayon et l’épaisseur doivent être exprimés dans des unités cohérentes.</p><p>Un rayon doublé et une épaisseur divisée par deux multiplient la contrainte par quatre si la pression reste constante. Une aorte réelle ne constitue pas un cylindre homogène. La géométrie, la qualité de la matrice et les sollicitations pulsées limitent la portée du modèle.</p><div class="trap"><b>Piège.</b> La formule n’attribue pas un risque de rupture individuel et ne détermine pas un seuil opératoire.</div></template>
<template data-pop="i71-genetique-interpretation" data-title="Aortopathie : interpréter un résultat génétique"><p>Un variant pathogène ou probablement pathogène, interprété par une équipe spécialisée, peut préciser le diagnostic. Il peut permettre un test ciblé chez les apparentés. Un variant de signification incertaine ne remplit pas la même fonction.</p><p>Un panel négatif peut laisser une aortopathie familiale sans cause moléculaire identifiée. L’imagerie des apparentés reste alors discutée selon l’histoire familiale. Le résultat doit toujours être relié au phénotype et aux mesures aortiques.</p><div class="key"><b>À retenir.</b> Le test recherche une cause héréditaire. L’imagerie recherche son expression anatomique. Aucun de ces examens ne remplace l’autre.</div>
<div class="lab">Ce qui change la décision</div><p>Lorsqu’un variant pathogène est trouvé, l’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> recommande de tester les apparentés à risque quel que soit leur âge (classe I). Sans variant identifié, l’imagerie des apparentés au premier degré devrait commencer à 25 ans, ou 10 ans avant l’âge du plus jeune cas, puis être répétée tous les 5 ans jusqu’à 60 ans (classe IIa). Le test du patient se réévalue après 3 à 5 ans, car la liste des gènes connus s’allonge.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, section 10.1, tableau de recommandations 56 et figure 39.</p>
</template>
<template data-pop="pareto-i71-sciences" data-title="Pareto — Sciences fondamentales de l’aorte"><p class="ratio" data-cover="i71-sa,i71-sh,i71-sp,i71-sg"></p><p>La racine soutient la valve et donne les coronaires. Les branches aortiques expliquent les déficits neurologiques, rénaux, digestifs et périphériques. Le type A implique l’aorte ascendante ; le type B l’épargne. Les complications doivent être recherchées dans les deux situations.</p><p>L’anévrisme dilate l’aorte. La dissection sépare la paroi et forme un faux chenal. La rupture permet une extravasation. Une malperfusion peut résulter d’un mécanisme dynamique, statique ou mixte.</p><p>Dans le modèle cylindrique, T = P × r et σ = P × r / e. Cette distinction explique les effets du rayon et de l’épaisseur sans calculer le risque individuel. Les aortopathies héréditaires concernent la matrice, la signalisation ou la contraction. Un test négatif n’exclut pas toute maladie familiale.</p></template>
