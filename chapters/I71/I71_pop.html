<template data-pop="i71-paroi" data-title="Paroi aortique"><p>Intima (endothélium), média (lames élastiques et cellules musculaires lisses : résistance et élasticité), adventice (collagène, <i>vasa vasorum</i>, nerfs). L’anévrisme vrai touche les trois tuniques ; la dissection clive la média ; le faux anévrisme n’a plus de paroi artérielle.</p></template>
<template data-pop="i71-laplace" data-title="Loi de Laplace"><p>Tension pariétale ∝ pression × rayon / épaisseur. Plus l’aorte est large et sa paroi mince, plus la tension est forte à pression égale : la dilatation entretient la dilatation, et la baisse de la pression réduit la tension.</p></template>
<template data-pop="i71-diam" data-title="Diamètres aortiques normaux"><p>Racine aortique ≈ 30–36 mm, aorte ascendante ≈ 30–35 mm (varient avec l’âge, le sexe et la surface corporelle), aorte thoracique descendante ≈ 20–30 mm, aorte abdominale sous-rénale ≈ 15–20 mm (&lt; 25 mm). Anévrisme abdominal : ≥ 30 mm.</p></template>
<template data-pop="i71-addrs" data-title="Score ADD-RS"><p>Un point par catégorie présente (0 à 3). <b>Terrain</b> : syndrome de Marfan ou autre maladie du tissu conjonctif, antécédent familial de maladie aortique, valvulopathie aortique connue, chirurgie ou manipulation aortique récente, anévrisme thoracique connu. <b>Douleur</b> : brutale, intense, déchirante. <b>Examen</b> : déficit de pouls ou asymétrie tensionnelle, déficit neurologique focal avec douleur, nouveau souffle d’insuffisance aortique avec douleur, hypotension ou choc. Score 0–1 + D-dimères &lt; 500 ng/mL : exclusion ; score ≥ 2 : angioscanner.</p></template>
<template data-pop="i71-gen" data-title="Aortopathies héréditaires"><p>Marfan (FBN1), Loeys-Dietz (voie du TGF-β), Ehlers-Danlos vasculaire (COL3A1), anévrismes thoraciques familiaux (ACTA2, MYH11), syndrome de Turner, bicuspidie aortique (aortopathie associée). À évoquer devant toute dissection ou anévrisme thoracique avant 60 ans ou avec antécédent familial : consultation génétique, dépistage des apparentés.</p></template>
<template data-pop="pareto-i71-clin" data-title="Pareto — Anévrismes et dissections"><p class="ratio" data-cover="i71-0,i71-1,i71-2,i71-3,i71-4,i71-5,i71-6,i71-7"></p><ul>
<li>Anévrisme : dilatation permanente ≥ 50 % (aorte abdominale ≥ 30 mm). Dissection : déchirure intimale, faux chenal ; syndrome aortique aigu = dissection, hématome intramural, ulcère pénétrant.</li>
<li>Stanford A (aorte ascendante) = chirurgie urgente (mortalité +1–2 %/heure) ; B = médical, endoprothèse si compliquée.</li>
<li>Anévrisme abdominal : tabac, homme &gt; 65 ans, famille ; diabète protecteur ; rupture mortelle à 80–90 %.</li>
<li>Dépistage ESC 2024 : hommes fumeurs ≥ 65 ans, hommes ≥ 75 ans, femmes ≥ 75 ans fumeuses ou hypertendues, apparentés ≥ 50 ans.</li>
<li>Surveillance 30–39 mm : 3 ans ; 40–49 : annuelle. Réparation ≥ 55 mm (homme), ≥ 50 mm (femme), croissance ≥ 10 mm/an, symptômes ; sacciforme ≥ 45 mm.</li>
<li>Aorte ascendante : ≥ 55 mm ; Marfan ≥ 50 (≥ 45 avec risque) ; bicuspidie ≥ 55 (≥ 50 avec risque).</li>
<li>Dissection : douleur brutale maximale d’emblée, migratrice ; asymétrie &gt; 20 mmHg, insuffisance aortique, tamponnade, malperfusion ; pas d’anticoagulation avant exclusion ; ADD-RS + D-dimères.</li></ul></template>
<template data-pop="pareto-i71-crit" data-title="Pareto — Urgences, suivi et critères"><p class="ratio" data-cover="i71-8,i71-9,i71-10,i71-11,i71-12"></p><ul>
<li>Rupture : douleur lombaire ou abdominale, masse pulsatile, choc ; hypotension permissive, chirurgie immédiate.</li>
<li>Dissection : morphine, bêtabloquant intraveineux (fréquence &lt; 60), puis vasodilatateur (systolique &lt; 120).</li>
<li>Anévrisme poplité bilatéral dans 50 %, associé à l’aorte ; complication : ischémie aiguë. Dissection cervicale : Horner, douleur, accident vasculaire du sujet jeune.</li>
<li>Traitement médical : tabac, pression &lt; 130/80, statine ; aucun médicament ne freine l’anévrisme abdominal ; Marfan : bêtabloquant ou losartan.</li>
<li>Suivi à vie après endoprothèse ; recherche génétique si &lt; 60 ans.</li></ul></template>
<template data-pop="pareto-i71-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i71-e-1,i71-e-2,i71-e-3"></p><ul>
<li>Échographie : dépistage et surveillance de l’aorte abdominale.</li>
<li>Angioscanner synchronisé : référence du syndrome aortique aigu ; échocardiographie transœsophagienne si instable.</li>
<li>Radiographie normale n’exclut pas ; D-dimères pour exclure si faible probabilité ; troponine possible dans la dissection.</li>
<li>Génétique : FBN1, voie du TGF-β, COL3A1, ACTA2.</li></ul></template>
<template data-pop="pareto-i71-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i71-p-1,i71-p-2"></p><ul>
<li>Esmolol ou labétalol d’abord, puis nicardipine ou urapidil ; diltiazem si bêtabloquant impossible.</li>
<li>Jamais d’antithrombotique avant exclusion de la dissection ; pas de remplissage massif dans la rupture.</li>
<li>Éviter les fluoroquinolones chez le porteur d’anévrisme ; céliprolol dans l’Ehlers-Danlos vasculaire.</li></ul></template>
