<template data-pop="i71-paroi-anatomie" data-title="Paroi aortique"><p>La paroi aortique superpose trois tuniques. L’<b>intima</b>, tapissée par l’endothélium, est au contact du sang. La <b>média</b>, faite de lames élastiques et de cellules musculaires lisses, assure à la fois la résistance à la pression et l’élasticité qui amortit chaque éjection. L’<b>adventice</b>, riche en collagène, porte les <i>vasa vasorum</i> et les nerfs.</p><p>Chaque lésion aortique se définit par la tunique qu’elle atteint. L’anévrisme vrai dilate les trois tuniques ensemble ; la dissection clive la média et ouvre un faux chenal entre ses couches ; l’hématome intramural naît d’un saignement dans la média ; le faux anévrisme, enfin, n’a plus de paroi artérielle, et seuls les tissus voisins contiennent le sang.</p><div class="key"><b>À retenir.</b> La média porte la résistance de l’aorte : les maladies qui l’affaiblissent, dégénératives ou héréditaires, préparent à la fois l’anévrisme et la dissection.</div></template>
<template data-pop="i71-diam" data-title="Diamètres aortiques normaux"><p>Racine aortique ≈ 30–36 mm, aorte ascendante ≈ 30–35 mm (varient avec l’âge, le sexe et la surface corporelle), aorte thoracique descendante ≈ 20–30 mm, aorte abdominale sous-rénale ≈ 15–20 mm (&lt; 25 mm). Anévrisme abdominal : ≥ 30 mm.</p>
<div class="lab">Pourquoi indexer</div><p>Le diamètre normal augmente avec l’âge, le gabarit et chez l’homme : à 50 ans, 40 mm d’aorte ascendante correspondent à la limite supérieure de la normale chez un patient de grand gabarit, mais à une dilatation nette chez une petite femme. Le score z exprime l’écart au diamètre attendu en écarts-types ; une dilatation correspond à un score z supérieur à 2, et l’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> recommande de l’utiliser aux extrêmes d’âge et de gabarit.</p>
<div class="lab">Limites de l’indexation</div><p>Rapporter le diamètre à la surface corporelle sous-estime la dilatation chez le patient en surpoids ; le rapport à la taille gagne donc du terrain. L’indexation aide surtout chez les petits gabarits : dans la population générale, elle ne prédit pas mieux le risque que le diamètre absolu.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, sections 5.4, 9.2.1.1 et 10.2.</p>
</template>
<template data-pop="i71-addrs" data-title="Score ADD-RS"><p>Un point par catégorie présente (0 à 3). <b>Terrain</b> : syndrome de Marfan ou autre maladie du tissu conjonctif, antécédent familial de maladie aortique, valvulopathie aortique connue, chirurgie ou manipulation aortique récente, anévrisme thoracique connu. <b>Douleur</b> : brutale, intense, déchirante. <b>Examen</b> : déficit de pouls ou asymétrie tensionnelle, déficit neurologique focal avec douleur, nouveau souffle d’insuffisance aortique avec douleur, hypotension ou choc. Score 0–1 + D-dimères &lt; 500 ng/mL : exclusion ; score ≥ 2 : angioscanner.</p>
<div class="lab">Pourquoi ces trois catégories</div><p>Chaque catégorie traduit un mécanisme : le terrain signale une média fragile, la douleur brutale traduit la déchirure, et les signes d’examen montrent l’extension aux branches, à la valve ou au péricarde.</p>
<div class="lab">Pourquoi les D-dimères</div><p>Le sang du faux chenal, au contact de la média, active la coagulation puis la fibrinolyse : des fragments de fibrine circulent. Dans l’étude ADvISED, des D-dimères supérieurs à 500 ng/mL avaient une sensibilité de 96,7 % mais une spécificité de 64 %, car ils s’élèvent aussi dans l’embolie pulmonaire ou les infections : ils servent à exclure, non à confirmer.</p>
<div class="lab">Ce qui change la décision</div><p>Avec un score de 0 ou 1 et des D-dimères inférieurs à 500 ng/mL, seuls 0,3 % des patients ainsi exclus avaient en réalité un syndrome aortique aigu, et la moitié des patients ont été dispensés d’imagerie. Avec un score de 2 ou plus, la probabilité est trop élevée pour qu’un test négatif suffise : sur les 8 patients de l’étude atteints malgré des D-dimères normaux, 5 avaient un score de 2 ou plus. L’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> recommande cet algorithme (classe I), avec l’électrocardiogramme, la radiographie thoracique et l’échocardiographie ciblée.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/29030346/" target="_blank" rel="noopener">Nazerian et al., Circulation 2018</a> (étude ADvISED) ; <a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, section 9.3.1.3, tableau de recommandations 44 et figure 30.</p>
</template>
<template data-pop="i71-gen" data-title="Aortopathies héréditaires"><p>Marfan (FBN1), Loeys-Dietz (voie du TGF-β), Ehlers-Danlos vasculaire (COL3A1), anévrismes thoraciques familiaux (ACTA2, MYH11), syndrome de Turner, bicuspidie aortique (aortopathie associée). À évoquer devant toute dissection ou anévrisme thoracique avant 60 ans ou avec antécédent familial : consultation génétique, dépistage des apparentés.</p>
<div class="lab">Pourquoi le seuil dépend du gène</div><p>Le gène indique la nature de la faiblesse pariétale, donc le diamètre auquel la paroi cède. Dans le Loeys-Dietz, dissections et ruptures surviennent à des diamètres plus faibles que dans le Marfan : le remplacement de la racine se discute au-delà de 45 mm (classe IIa), voire dès 40 mm selon le gène et les signes de haut risque (classe IIb). Avec ACTA2, une dissection peut survenir sous 45 mm. Dans l’Ehlers-Danlos vasculaire, aucun seuil n’est établi, et les gestes sont réservés au risque vital, tant les tissus sont fragiles.</p>
<div class="lab">Pourquoi l’enquête familiale</div><p>La transmission est le plus souvent autosomique dominante : chaque enfant d’un porteur a un risque sur deux d’hériter du variant. L’expression varie au sein d’une même famille, et une génération peut sembler épargnée. C’est pourquoi l’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> recommande de reconstituer l’histoire familiale sur au moins trois générations : dissections, morts subites inexpliquées, anévrismes périphériques ou intracrâniens (classe I).</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, section 10.1, tableaux de recommandations 56, 62 et 66, figure 42.</p>
</template>
<template data-pop="pareto-i71-clin" data-title="Pareto — Anévrismes et dissections"><p class="ratio" data-cover="i71-0,i71-1,i71-2,i71-3,i71-4,i71-5,i71-6,i71-7"></p><ul>
<li>Anévrisme : dilatation permanente ≥ 50 % (aorte abdominale ≥ 30 mm). Dissection : déchirure intimale, faux chenal ; syndrome aortique aigu = dissection, hématome intramural, ulcère pénétrant.</li>
<li>Stanford A (aorte ascendante) = chirurgie urgente (mortalité historique estimée à 1–2 % par heure sans chirurgie) ; B = médical, endoprothèse si compliquée.</li>
<li>Anévrisme abdominal : tabac, homme &gt; 65 ans, famille ; diabète associé à un risque moindre (association, non protection démontrée) ; rupture le plus souvent mortelle, et environ un tiers de décès après réparation en urgence.</li>
<li>Dépistage <a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> : hommes fumeurs ≥ 65 ans et apparentés ≥ 50 ans (classe I) ; hommes ≥ 75 ans, femmes ≥ 75 ans fumeuses ou hypertendues (classe IIb).</li>
<li>Surveillance 25–29 mm : 4 ans ; 30–39 mm : 3 ans ; 40–49 : annuelle ; au-delà : 6 mois. Réparation ≥ 55 mm (homme), ≥ 50 mm (femme), symptômes ; à discuter si croissance ≥ 10 mm/an ou sacciforme ≥ 45 mm.</li>
<li>Aorte ascendante : ≥ 55 mm, &gt; 52 mm si risque opératoire faible ; Marfan ≥ 50 (≥ 45 avec risque) ; bicuspidie ≥ 55 (≥ 50 pour le phénotype de racine ou avec risque).</li>
<li>Dissection : douleur brutale maximale d’emblée, migratrice ; asymétrie &gt; 20 mmHg, insuffisance aortique, tamponnade, malperfusion ; pas d’anticoagulation avant exclusion ; ADD-RS + D-dimères.</li></ul></template>
<template data-pop="pareto-i71-crit" data-title="Pareto — Urgences, suivi et critères"><p class="ratio" data-cover="i71-8,i71-9,i71-10,i71-11,i71-12"></p><ul>
<li>Rupture : douleur lombaire ou abdominale, masse pulsatile, choc ; hypotension permissive, chirurgie immédiate.</li>
<li>Dissection : morphine, bêtabloquant intraveineux (fréquence &lt; 60), puis vasodilatateur (systolique &lt; 120).</li>
<li>Anévrisme poplité : fréquent chez le porteur d’anévrisme aortique, d’où l’écho-Doppler fémoro-poplité (classe IIa) ; complication : ischémie aiguë par thrombose ou embolie ; aucun seuil européen de réparation. Dissection cervicale : Horner, douleur, accident vasculaire du sujet jeune.</li>
<li>Traitement médical : tabac, pression &lt; 130/80, statine ; aucun médicament n’a freiné l’anévrisme abdominal dans un essai randomisé ; Marfan : bêtabloquant ou losartan.</li>
<li>Suivi à vie après endoprothèse ; recherche génétique si &lt; 60 ans.</li></ul></template>
<template data-pop="pareto-i71-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i71-e-1,i71-e-2,i71-e-3"></p><ul>
<li>Échographie : dépistage et surveillance de l’aorte abdominale.</li>
<li>Angioscanner synchronisé : référence du syndrome aortique aigu ; échocardiographie transœsophagienne si instable.</li>
<li>Radiographie normale n’exclut pas ; D-dimères pour exclure si faible probabilité ; troponine possible dans la dissection.</li>
<li>Génétique : FBN1, voie du TGF-β, COL3A1, ACTA2.</li></ul></template>
<template data-pop="pareto-i71-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i71-p-1,i71-p-2"></p><ul>
<li>Labétalol (50 mg intraveineux, 200 mg au plus) ou esmolol d’abord, puis nicardipine (3 à 15 mg/h) ou urapidil ; inhibiteur calcique non dihydropyridinique intraveineux si bêtabloquant impossible, sans forme intraveineuse autorisée en Suisse.</li>
<li>Jamais d’antithrombotique avant exclusion de la dissection ; pas de remplissage massif dans la rupture.</li>
<li>Éviter les fluoroquinolones chez le porteur d’anévrisme s’il existe une alternative aussi efficace ; céliprolol dans l’Ehlers-Danlos vasculaire.</li></ul></template>
<template data-pop="i71-anti-impulsion" data-title="Dissection aiguë : pourquoi ralentir le cœur avant de baisser la pression">
<div class="lab">Physiologie normale</div><p>À chaque systole, l’éjection du ventricule gauche met l’aorte en charge. La sollicitation de la paroi dépend du niveau de pression, du rayon de l’aorte, de la vitesse de montée de la pression (dP/dt), qui suit la contractilité, et du nombre de cycles par minute.</p>
<div class="lab">Mécanisme</div><p>Dans une dissection, chaque onde systolique pousse du sang dans le faux chenal et peut prolonger le décollement de la média. Le bêtabloquant diminue la fréquence et la contractilité, donc le nombre de mises en charge et leur brutalité ; la baisse de la pression systolique réduit ensuite la contrainte pariétale. Un vasodilatateur seul fait baisser la pression, ce que perçoivent les barorécepteurs : la réponse sympathique accélère le cœur et renforce sa contraction, ce qui annule une partie du bénéfice.</p>
<div class="lab">Ce qui change la décision</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> recommande un traitement immédiat visant une pression systolique inférieure à 120 mmHg et une fréquence d’au plus 60/min (classe I, niveau B). Le bêtabloquant intraveineux vient d’abord ; un vasodilatateur ne s’ajoute que si la cible tensionnelle n’est pas atteinte. Une ligne artérielle et une surveillance en soins intensifs sont recommandées, car ces médicaments se titrent minute par minute. Le relais oral se fait après 24 heures si le transit digestif est conservé.</p>
<div class="lab">Limites</div><p>Ces cibles reposent sur des études observationnelles, où un contrôle strict de la fréquence s’associait à moins de complications, et non sur un essai randomisé. Le but reste la pression la plus basse qui maintient la perfusion des organes. Ce traitement stabilise le patient, mais il ne remplace ni la chirurgie d’un type A ni l’endoprothèse d’un type B compliqué.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, section 9.3.1.4.1, tableau de recommandations 45 et figure 31 ; <a href="https://pubmed.ncbi.nlm.nih.gov/18824750/" target="_blank" rel="noopener">Kodama et al., Circulation 2008</a>.</p></template>
<template data-pop="i71-antithrombotiques" data-title="Dissection et antithrombotiques : pourquoi les éviter">
<div class="lab">Physiologie normale</div><p>Une brèche vasculaire se ferme par l’agrégation des plaquettes puis par la formation de fibrine. Dans une dissection, cette hémostase limite le saignement à travers la paroi externe du faux chenal, faite seulement de la partie externe de la média et de l’adventice.</p>
<div class="lab">Mécanisme</div><p>Une héparine, une double antiagrégation ou une thrombolyse empêchent ou dissolvent le caillot. Le sang continue alors de traverser une paroi mince sous pression systémique, ce qui favorise l’extension de la dissection et sa rupture dans le péricarde, le médiastin ou la plèvre. Ces traitements augmentent aussi le saignement de la chirurgie urgente.</p>
<div class="lab">Conséquence clinique</div><p>Le piège naît de la ressemblance : une dissection de type A qui atteint l’ostium coronaire droit donne un sus-décalage inférieur, et la troponine peut s’élever. Dans un registre nordique de 1 141 patients opérés d’une dissection de type A, 10 % avaient reçu une double antiagrégation avant la chirurgie : le saignement majeur passait de 39 à 51 %, sans hausse significative de la mortalité à 30 jours ; le saignement majeur était toutefois lui-même associé à une mortalité plus élevée (rapport de cotes ajusté de 2,4).</p>
<div class="lab">Ce qui change la décision</div><p>Une double antiagrégation déjà donnée ne doit pas retarder la chirurgie d’un type A : attendre l’élimination du médicament exposerait à la rupture, dont le risque croît d’heure en heure.</p>
<div class="lab">Limites</div><p>Le risque de rupture sous antithrombotique est déduit de la physiopathologie ; les données cliniques mesurent surtout le saignement opératoire.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, section 9.3.1 ; <a href="https://pubmed.ncbi.nlm.nih.gov/30657880/" target="_blank" rel="noopener">Hansson et al., European Journal of Cardio-thoracic Surgery 2019</a> (registre nordique des dissections de type A).</p></template>
<template data-pop="i71-aortopathie-traitement" data-title="Aortopathies héréditaires : bêtabloquant, sartan et céliprolol">
<div class="lab">Mécanisme dans le Marfan</div><p>Le déficit en fibrilline-1 fragilise la média de la racine. Dans un modèle murin, la dilatation s’accompagnait d’une signalisation excessive du facteur de croissance transformant bêta, et le losartan, antagoniste du récepteur de type 1 de l’angiotensine II, la prévenait. Le bêtabloquant agit autrement : il réduit la fréquence et la pente de montée de la pression, donc la contrainte répétée sur la racine.</p>
<div class="lab">Bénéfice démontré</div><p>Chez l’enfant et l’adulte jeune, l’aténolol et le losartan n’ont pas différé dans leur effet sur la dilatation de la racine. Une méta-analyse sur données individuelles de sept essais (1 442 patients) montre que le sartan réduit d’environ moitié la progression annuelle du score z de la racine, y compris sous bêtabloquant ; l’effet du bêtabloquant est voisin. Le critère principal était la vitesse de dilatation : l’effet sur les dissections n’est pas établi.</p>
<div class="lab">Ce qui change la décision</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> recommande un bêtabloquant ou un sartan à la dose maximale tolérée (classe I) et propose l’association (classe IIa). Les inhibiteurs calciques sont à éviter si possible, car ils ont été associés à un risque aortique accru chez la souris et dans des études cas-témoins. Pendant la grossesse, le bêtabloquant est recommandé et les sartans sont contre-indiqués (classe III) en raison de leur fœtotoxicité.</p>
<div class="lab">Ehlers-Danlos vasculaire</div><p>Le collagène de type III anormal ôte leur résistance aux artères de moyen calibre. Le céliprolol bloque les récepteurs β1 et stimule partiellement les récepteurs β2. Dans l’essai ouvert BBEST, chez 53 patients, les ruptures ou dissections artérielles sont passées de 50 % à 20 % (rapport de risque 0,36), et l’essai a été arrêté tôt pour bénéfice. Le mécanisme de cet effet n’est pas établi et l’essai reste petit : l’ESC 2024 le recommande en classe IIa.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, sections 10.1.2 et 10.1.3, tableaux de recommandations 59, 61 et 63 ; <a href="https://pubmed.ncbi.nlm.nih.gov/16601194/" target="_blank" rel="noopener">Habashi et al., Science 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25405392/" target="_blank" rel="noopener">Lacro et al., New England Journal of Medicine 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36049495/" target="_blank" rel="noopener">Pitcher et al., Lancet 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20825986/" target="_blank" rel="noopener">Ong et al., Lancet 2010</a>.</p></template>
<template data-pop="i71-depistage" data-title="Dépistage de l’anévrisme abdominal : pourquoi une seule échographie">
<div class="lab">Principe</div><p>Un dépistage réduit la mortalité si la maladie est fréquente dans la population visée, longtemps silencieuse, facile à mesurer, et si un traitement précoce change son évolution. L’anévrisme de l’aorte abdominale remplit ces conditions : il reste longtemps asymptomatique, grossit d’environ 3 mm par an, et sa rupture est le plus souvent mortelle, alors qu’une réparation programmée a une mortalité de quelques pourcents.</p>
<div class="lab">Pourquoi l’échographie, et pourquoi une fois</div><p>L’échographie mesure l’aorte sans irradiation ni produit de contraste, avec une sensibilité et une spécificité supérieures à 97 %. Une aorte de moins de 25 mm a un faible risque de devenir un grand anévrisme dans les dix ans : à 65 ans, un examen normal suffit donc le plus souvent. Chez un apparenté examiné jeune, l’examen se répète, car la maladie apparaît plus tard.</p>
<div class="lab">Bénéfice démontré</div><p>Dans l’essai MASS, l’invitation des hommes de 65 à 74 ans a réduit de 42 % la mortalité liée à l’anévrisme, et de 53 % chez ceux qui se sont présentés. Le bénéfice passe par la réparation programmée : la mortalité à 30 jours y était de 6 %, contre 37 % après chirurgie d’urgence. Il faut aujourd’hui dépister environ 667 hommes pour éviter un décès prématuré lié à l’anévrisme.</p>
<div class="lab">Pourquoi ces populations</div><p>Le bénéfice dépend de la prévalence : il est démontré chez l’homme fumeur ou ancien fumeur de 65 ans ou plus. Il n’a pas été retrouvé chez les femmes de 65 à 74 ans fumeuses ou coronariennes, où la prévalence reste basse. Après 75 ans, presque toutes les femmes victimes de rupture étaient fumeuses ou hypertendues, ce qui justifie de ne cibler qu’elles. Les apparentés au premier degré, surtout les frères et sœurs, ont un risque environ doublé selon une étude de population. Chez l’artériopathe symptomatique, l’incidence cumulée d’anévrisme atteint 12 %.</p>
<div class="lab">Limites</div><p>Le dépistage double environ le nombre de réparations programmées, avec leur morbidité ; une méta-analyse n’a pas montré d’altération notable de la qualité de vie sous surveillance. Avec la baisse de la prévalence, son bénéfice absolu diminue, et l’<a href="https://doi.org/10.1016/j.ejvs.2023.11.002" target="_blank" rel="noopener">ESVS 2024</a> recommande d’adapter les programmes aux conditions locales.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, section 6.2.1 et tableau de recommandations 6 ; <a href="https://pubmed.ncbi.nlm.nih.gov/12443589/" target="_blank" rel="noopener">Ashton et al., Lancet 2002</a> (essai MASS) ; <a href="https://doi.org/10.1016/j.ejvs.2023.11.002" target="_blank" rel="noopener">ESVS 2024 (Wanhainen et al.)</a>, sections 3.2 et 3.3.</p></template>
<template data-pop="i71-endofuites" data-title="Endofuites : pourquoi surveiller une endoprothèse à vie">
<div class="lab">Principe</div><p>L’endoprothèse ne retire pas l’anévrisme. Ancrée dans l’aorte saine au-dessus et dans les iliaques en dessous, elle exclut le sac de la circulation : privé de pression, le sac thrombose et se rétracte habituellement.</p>
<div class="lab">Mécanisme</div><p>Une endofuite est un flux persistant entre la prothèse et la paroi du sac. Le type I naît d’un défaut d’étanchéité à l’ancrage proximal (Ia) ou distal (Ib) ; le type II, d’un reflux par des branches de l’aorte ; le type III, d’un défaut ou d’une séparation des modules ; le type IV, de la porosité du tissu prothétique. Le type V, ou endotension, fait grossir le sac sans fuite visible.</p>
<div class="lab">Conséquence clinique</div><p>Les types I et III remettent le sac sous pression systémique : il regrossit et peut rompre. Le type II, présent chez environ un quart des patients, se tarit spontanément dans environ la moitié des cas et expose peu à la rupture tant que le sac ne grossit pas. Les endofuites sont la complication la plus fréquente, jusqu’à un tiers des procédures ; l’anticoagulation au long cours favorise celles de type II et s’associe à davantage de réinterventions.</p>
<div class="lab">Ce qui change la décision</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> recommande de réintervenir en cas d’endofuite de type I ou III (classe I). Pour un type II ou V, une embolisation ou une réintervention se discute si le sac a grossi d’au moins 10 mm (classe IIa) ; le type IV, rare avec les prothèses modernes, ne demande pas de geste. La surveillance associe angioscanner et échographie Doppler à 1 et 12 mois, puis une échographie annuelle et un angioscanner ou une IRM tous les 5 ans si tout reste normal (classe I).</p>
<div class="lab">Pourquoi à vie</div><p>Dans les essais, l’avantage de survie de l’endoprothèse s’efface après environ 8 ans, avec davantage de ruptures tardives. La plupart des échecs apparaissent toutefois tôt : chez un patient à faible risque, sans endofuite et dont le sac s’est rétracté d’au moins 10 mm, l’<a href="https://doi.org/10.1016/j.ejvs.2023.11.002" target="_blank" rel="noopener">ESVS 2024</a> admet de ne refaire l’imagerie que cinq ans après l’intervention, puis tous les cinq ans.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, sections 9.2.6 et 9.2.7, tableaux de recommandations 42 et 43, figure 27 ; <a href="https://doi.org/10.1016/j.ejvs.2023.11.002" target="_blank" rel="noopener">ESVS 2024 (Wanhainen et al.)</a>, sections 7.2.6 et 7.4.</p></template>
<template data-pop="i71-seuils-thorax" data-title="Aorte thoracique : ce qui fixe le seuil chirurgical">
<div class="lab">Principe</div><p>Une chirurgie préventive se discute en comparant le risque de dissection ou de rupture pendant la surveillance au risque immédiat de l’opération, en tenant compte de l’espérance de vie et des complications de chaque stratégie. Un taux annuel et un risque opératoire ponctuel ne se comparent pas seuls. Le diamètre reste le premier déterminant de ces complications, car la contrainte pariétale croît avec le rayon d’une paroi dont la média est déjà dégénérée.</p>
<div class="lab">Aorte ascendante</div><p>À 57,5 mm, les taux annuels rapportés de rupture, de dissection et de décès atteignent 3,6 %, 3,7 % et 10,8 %. Le risque de complication dépasse 1 % par an entre 50 et 54 mm, avec un point critique vers 52 à 53 mm, alors que les centres expérimentés rapportent moins de 1 % de mortalité pour la chirurgie programmée. C’est pourquoi l’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> garde 55 mm (classe I) et propose d’envisager la chirurgie au-delà de 52 mm pour l’aorte tubulaire quand le risque opératoire est inférieur à 3 % (classe IIa).</p>
<div class="lab">Ce qui abaisse le seuil</div><p>Une croissance d’au moins 3 mm par an signale une paroi qui cède. Le phénotype de racine progresse plus vite et dissèque plus souvent. Une aorte ascendante de 13 cm ou plus multiplie par près de cinq le risque annuel par rapport à moins de 9 cm. Chez un patient de moins de 1,69 m, un même diamètre représente une dilatation relative plus forte. Ces facteurs, comme les autres facteurs de risque du tableau, font envisager la chirurgie dès 50 mm (classe IIb).</p>
<div class="lab">Limites</div><p>La plupart des dissections de type A surviennent sous 55 mm : plus de 60 % des patients sans Marfan ni bicuspidie avaient une aorte non dilatée avant la dissection, et le diamètre mesuré avant la dissection est 25 à 30 % plus petit que celui mesuré après. Un seuil de diamètre ne protège donc qu’une partie des patients.</p>
<div class="lab">Aorte descendante</div><p>À 60 mm, un anévrisme de l’aorte descendante rompt dans environ 10 % des cas par an, d’où une réparation dès 55 mm (classe I). L’endoprothèse est préférée si l’anatomie le permet, avec une mortalité d’environ 6 % et une ischémie médullaire d’environ 3 %, contre environ 10 % et 11 à 15 % en chirurgie ouverte hors centres expérimentés ; dans les maladies héréditaires, la chirurgie ouverte est préférée.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, sections 9.2.2 et 9.2.5, tableaux de recommandations 38 et 40, figure 23.</p></template>
<template data-pop="i71-poplite" data-title="Anévrisme poplité : dépistage et décision de réparation">
<div class="lab">Position européenne</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> recommande de rechercher un anévrisme fémoro-poplité par écho-Doppler chez le porteur d’anévrisme aortique (classe IIa), car ces anévrismes sont fréquents dans cette population et leurs diamètres suivent ceux des artères iliaques et fémorales. Elle reconnaît la thrombose d’anévrisme comme une cause d’ischémie aiguë de membre, mais ne fixe pas de diamètre de réparation de l’anévrisme poplité asymptomatique. Aucune recommandation suisse ne fixe non plus ce seuil : la décision se prend en centre vasculaire, au cas par cas.</p>
<div class="lab">Mécanisme</div><p>Le danger tient moins à la rupture qu’au thrombus mural. Celui-ci embolise vers les artères de jambe, appauvrit le lit d’aval et rend la revascularisation plus difficile lorsque l’anévrisme finit par thromboser.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, sections 6.1.1 et 8.1.3, tableau de recommandations 5.</p></template>
<template data-pop="i71-ccb-ch" data-title="Contrôle de la fréquence sans bêtabloquant : situation suisse">
<div class="lab">Recommandation européenne</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> propose un inhibiteur calcique non dihydropyridinique intraveineux lorsque le bêtabloquant est contre-indiqué dans un syndrome aortique aigu (classe IIa).</p>
<div class="lab">Écart suisse</div><p>Dans la base AIPS de Swissmedic consultée le 08.10.2026, le diltiazem (Dilzem) et le vérapamil (Isoptin) ne disposent que de formes orales. Aucune forme intraveineuse n’a d’information professionnelle suisse. L’application de la recommandation européenne relève donc d’une importation ou d’une préparation hospitalière, sous la responsabilité de l’équipe de soins intensifs ; le cours ne donne pas de posologie intraveineuse faute de texte suisse.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024 (Mazzolai et al.)</a>, section 9.3.1.4.1 ; informations professionnelles suisses <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=46269" target="_blank" rel="noopener">Dilzem®</a> et <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=40783" target="_blank" rel="noopener">Isoptin®</a>, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
