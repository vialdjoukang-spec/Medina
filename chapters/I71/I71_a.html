<section class="ilot" id="i71-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 68 ans, hypertendu, fumeur de 40 paquets-années, arrive aux urgences pour une douleur thoracique <b>brutale, déchirante</b>, maximale d’emblée, irradiant entre les omoplates puis vers les lombes. Sa pression artérielle est de 178/96 mmHg au bras droit et de 142/80 mmHg au bras gauche. L’électrocardiogramme ne montre pas de sus-décalage. La question qui structure le chapitre est la suivante : <b>s’agit-il d’une dissection aortique, comment la confirmer en quelques minutes, pourquoi ne faut-il surtout pas lui donner un traitement anticoagulant de syndrome coronarien, et quelle décision — chirurgie immédiate ou traitement médical — dépend de la localisation de la déchirure ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait distinguer anévrisme, dissection, hématome intramural et ulcère pénétrant ; dépister l’anévrisme de l’aorte abdominale chez les bonnes personnes ; appliquer les seuils de surveillance et d’intervention de l’ESC 2024 ; reconnaître un syndrome aortique aigu et sa classification de Stanford ; conduire la baisse tensionnelle et de la fréquence cardiaque ; et reconnaître les formes génétiques qui imposent un dépistage familial.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i71-paroi-anatomie">paroi aortique et ses trois tuniques</button>, la <button class="w" data-k="i71-laplace">loi de Laplace (tension pariétale)</button> et les <button class="w" data-k="i71-diam">diamètres aortiques normaux</button>.</div>
</section>
<section class="ilot" id="i71-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Un <b>anévrisme</b> est une dilatation <b>permanente et localisée</b> d’une artère, d’au moins <b>50 %</b> de son diamètre normal attendu, touchant les trois tuniques. Pour l’aorte abdominale, on retient en pratique un diamètre ≥ 30 mm. Ce seuil fixe dépasse habituellement de plus de deux écarts-types le diamètre moyen de l’homme, ce qui dispense de calculer un diamètre attendu ; il est peut-être trop élevé chez la femme et dans certaines populations asiatiques, dont l’aorte est plus petite. Un <b>faux anévrisme</b> (pseudo-anévrisme) est une rupture de la paroi contenue par les tissus voisins, sans les trois tuniques (après ponction artérielle, traumatisme, infection). Sa poche n’a ni lames élastiques ni cellules musculaires et ne résiste pas à la pression artérielle : un faux anévrisme aortique se répare donc en principe quelle que soit sa taille, pour prévenir sa rupture. Une <b>ectasie</b> est une dilatation inférieure à 50 %.</p>
<p>La <b>dissection</b> est une déchirure de l’intima qui laisse le sang pénétrer dans la média et la cliver en créant un <b>faux chenal</b> parallèle au vrai. Elle appartient au <b>syndrome aortique aigu</b>, qui regroupe aussi l’<b>hématome intramural</b> (saignement dans la média sans porte d’entrée intimale visible) et l’<b>ulcère aortique pénétrant</b> (ulcération d’une plaque athéroscléreuse creusant la média). L’hématome intramural naît d’un saignement des <i>vasa vasorum</i> dans la média, avec ou sans petite rupture intimale. L’ulcère pénétrant traverse la limitante élastique interne ; il siège surtout sur l’aorte thoracique descendante du fumeur âgé et s’associe souvent à un hématome intramural.</p>
<div class="two">
<div class="card"><h4>Forme de l’anévrisme</h4><p><b>Fusiforme</b> : dilatation circonférentielle, la plus fréquente. <b>Sacciforme</b> : poche latérale, rupture plus précoce ; l’ESC 2024 propose d’intervenir sur un anévrisme sacciforme de l’aorte abdominale dès 45 mm. Cette forme traduit souvent une destruction localisée de la paroi (infection, ulcère pénétrant, traumatisme), et une infection doit toujours être exclue. Son évolution naturelle est mal connue : le seuil de 45 mm n’est qu’une recommandation de classe IIb.</p></div>
<div class="card"><h4>Classification de Stanford des dissections</h4><p><b>Type A</b> : l’aorte ascendante est atteinte, quelle que soit la porte d’entrée → <b>chirurgie en urgence</b>. <b>Type B</b> : l’aorte ascendante est épargnée → traitement médical, ou endoprothèse en cas de complication. L’aorte ascendante est en partie intrapéricardique et porte la valve aortique et les ostia coronaires : le type A tue par tamponnade, fuite aortique aiguë ou occlusion coronaire, avec une mortalité très élevée sans chirurgie. L’estimation de 50 % en 48 heures vient de séries historiques ; les risques observés varient selon la population et le point de départ du suivi. Le type B épargne ces structures ; l’intervention n’y devient urgente qu’en cas de complication. La classification de DeBakey (I, II, III) décrit l’extension ; la classification TEM (type, porte d’entrée, malperfusion) la complète. Elle ajoute la porte d’entrée, que le traitement cherche à fermer, et la malperfusion, qui aggrave le pronostic : deux informations que le seul type A ou B ne donne pas.</p></div></div>
<p><b>Temporalité des dissections</b> : hyperaiguë (&lt; 24 heures), aiguë (1 à 14 jours), subaiguë (15 à 90 jours), chronique (&gt; 90 jours). Ces phases ont une portée pratique : le risque de complication est maximal au début, puis la paroi disséquée se modifie. Une endoprothèse posée en phase subaiguë peut encore faire remodeler l’aorte, alors qu’en phase chronique ce remodelage devient limité.</p>
</section>
<section class="ilot" id="i71-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Dans les études européennes de dépistage, l’anévrisme de l’aorte abdominale touche <b>1,3 à 3,3 %</b> des hommes de plus de 65 ans, prévalence en baisse ; il est environ quatre fois plus fréquent chez l’homme que chez la femme (ESC 2024). Aucune donnée suisse de prévalence n’a été trouvée dans les sources lues : c’est une lacune nommée. Les anévrismes de l’aorte, toutes localisations confondues, ont causé environ 172 000 décès dans le monde en 2019. Le <b>risque de rupture</b> croît avec le diamètre, car la contrainte pariétale augmente avec le rayon d’une paroi déjà dégradée : chez l’homme, il reste de 0,3 à 0,8 % par an sous 55 mm. Dans un registre prospectif récent de grands anévrismes non opérés, le risque cumulé de rupture à 3 ans atteignait 6 % entre 61 et 70 mm et 18 % au-delà de 70 mm. La rupture est mortelle dans <b>80 à 90 %</b> des cas au total, la moitié des patients décédant avant l’hôpital. L’aorte saigne sous pression systémique dans le rétropéritoine ou le péritoine ; seul un hématome temporairement contenu par le rétropéritoine laisse le temps d’atteindre le bloc, et la réparation en urgence tue encore environ un tiers des patients à 30 jours.</p>
<p>La dissection aortique aiguë classique a une incidence de <b>2,6 à 3,5 pour 100 000 personnes par an</b>, pic entre 60 et 70 ans, deux tiers d’hommes. Les estimations historiques de mortalité du type A sans chirurgie atteignaient <b>1 à 2 % par heure</b>. Une analyse IRAD publiée en 2022 rapporte 23,7 % de décès dans les 48 heures suivant l’arrivée à l’hôpital chez les patients traités médicalement, avec un risque moyen d’environ 0,5 % par heure ; ce chiffre de cohorte ne prédit pas le risque individuel et ne diminue pas l’urgence chirurgicale ; opérée, la mortalité périopératoire reste de 17 à 25 %. Ce risque tient aux complications déjà présentes à l’arrivée : choc par tamponnade, atteinte coronaire, malperfusion digestive, rénale ou cérébrale, et coma prédisent la mortalité opératoire. Le type B non compliqué a une mortalité hospitalière d’environ 10 %. Le type B compliqué (rupture, malperfusion, expansion rapide, douleur ou hypertension réfractaires) approche 50 % sous traitement conservateur : cette différence réserve l’intervention urgente aux formes compliquées.</p>
</section>
<section class="ilot" id="i71-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Anévrisme de l’aorte abdominale</b> : maladie dégénérative inflammatoire de la paroi, et non simple conséquence de l’athérosclérose. La lésion siège dans la média et l’adventice, alors que l’athérome est intimal ; et le diabète, facteur majeur d’athérosclérose, s’associe à moins d’anévrismes, et non à davantage. Macrophages et lymphocytes infiltrent la média et l’adventice ; les métalloprotéases matricielles (surtout MMP-9) détruisent l’élastine ; les cellules musculaires lisses meurent par apoptose. La paroi perd sa résistance, se dilate, et la dilatation augmente la tension pariétale (<button class="w" data-k="i71-laplace">loi de Laplace</button>), qui accélère la dilatation : un cercle vicieux.</p>
<p><b>Anévrisme de l’aorte thoracique ascendante</b> : surtout lié à une <b>dégénérescence de la média</b> (perte de fibres élastiques, accumulation de protéoglycanes), fréquente dans les maladies héréditaires (Marfan, Loeys-Dietz) et la bicuspidie aortique, ou à l’hypertension. <b>Dissection</b> : une média fragilisée, soumise à une contrainte hémodynamique (hypertension, pic tensionnel lors d’un effort violent, cocaïne), se déchire. Le sang progresse dans le faux chenal, surtout vers l’aval, et peut occlure les branches (malperfusion), rompre dans le péricarde (tamponnade) ou vers l’extérieur, désinsérer la valve aortique (insuffisance aortique) ou comprimer les coronaires.</p>

<div class="key"><b>Corrélation physiopathologie → clinique et traitement.</b> La loi de Laplace explique pourquoi la contrainte pariétale augmente avec le diamètre et la pression, et pourquoi le contrôle tensionnel est central. Elle ne suffit pas à expliquer que le risque de rupture croisse plus vite que le diamètre : la paroi dilatée est aussi amincie et dégradée, ce qui réduit sa résistance. Dans la dissection, la baisse de la <b>pente de montée de la pression</b> (dP/dt) par bêtabloquant <button class="w" data-k="i71-anti-impulsion">réduit la propagation du faux chenal</button> : on baisse d’abord la fréquence cardiaque, puis la pression.</div>
</section>
<section class="ilot" id="i71-4"><h2><span class="n">4</span>Facteurs de risque et causes</h2>
<table class="t"><tr><th>Atteinte</th><th>Facteurs et causes</th></tr>
<tr><td>Anévrisme de l’aorte abdominale</td><td><b>Tabac</b> (principal facteur modifiable, multiplie le risque par 3 à 5 et accélère la croissance ; l’association croît avec la durée du tabagisme et décroît après l’arrêt, ce qui plaide pour un lien causal ; le tabagisme actif double aussi le risque de rupture), âge &gt; 65 ans, sexe masculin, antécédent familial au premier degré (risque × 2), athérosclérose, hypertension. Le <b>diabète est associé à un risque moindre</b> (incidence abaissée d’environ 25 % selon l’ESC 2024) et à une croissance plus lente. C’est une association constante, non un effet protecteur démontré : la glycation des protéines de la matrice, qui la renforce, une moindre activité des métalloprotéases et l’effet de la metformine sont des hypothèses encore discutées.</td></tr>
<tr><td>Aorte thoracique ascendante</td><td>Hypertension (principal facteur de risque, présente chez environ 80 % des patients ; une cause génétique intervient dans environ 20 % des cas) ; <b>bicuspidie aortique</b>, qui s’accompagne d’une aortopathie propre, de forte héritabilité ; maladies héréditaires : <button class="w" data-k="i71-gen">syndrome de Marfan, Loeys-Dietz, Ehlers-Danlos vasculaire, anévrismes familiaux</button> ; syndrome de Turner ; aortites (artérite à cellules géantes, Takayasu, syphilis) ; grossesse chez les patientes à risque.</td></tr>
<tr><td>Dissection aiguë</td><td>Hypertension (≈ 70 %), anévrisme préexistant, maladies héréditaires (patients jeunes), bicuspidie, <b>cocaïne et amphétamines</b>, effort violent (haltérophilie), iatrogénie (chirurgie cardiaque, cathétérisme), grossesse au troisième trimestre (50 % des dissections de la grossesse) et post-partum (33 %), fluoroquinolones (signal épidémiologique d’augmentation modeste du risque).</td></tr></table>
</section>
<section class="ilot" id="i71-5"><h2><span class="n">5</span>Anévrisme de l’aorte abdominale</h2>
<h3>5.1 Clinique</h3>
<p>Le plus souvent <b>asymptomatique</b>, découvert par hasard (échographie, tomodensitométrie) ou par dépistage. À la palpation, une masse pulsatile et <b>expansive</b> (les doigts posés de part et d’autre s’écartent) peut être perçue chez le sujet mince, avec une faible sensibilité : 29 % pour un anévrisme de 30 à 39 mm, 50 % de 40 à 49 mm et 76 % à partir de 50 mm, moins encore chez le patient obèse. Une palpation normale n’exclut donc pas l’anévrisme ; seule l’imagerie le mesure. Signes d’alarme : douleur abdominale ou lombaire nouvelle chez un patient porteur d’anévrisme (fissuration imminente), ischémie aiguë d’un orteil (embolie à partir du thrombus mural : « orteil bleu »). La douleur peut traduire une expansion rapide ou une rupture contenue : elle impose une imagerie urgente. Beaucoup d’anévrismes abdominaux sont tapissés d’un thrombus feuilleté, dont des fragments peuvent migrer vers les artères digitales.</p>
<h3>5.2 Dépistage (ESC 2024)</h3>
<p><button class="w" data-k="i71-depistage">Échographie abdominale unique</button> chez : les <b>hommes de 65 ans ou plus ayant fumé</b> ; <b>tous les hommes de 75 ans ou plus</b> ; les <b>femmes de 75 ans ou plus fumeuses et/ou hypertendues</b> ; les <b>apparentés au premier degré de 50 ans ou plus</b> d’un patient porteur d’anévrisme (sauf cause acquise évidente) ; les patients atteints d’artériopathie des membres inférieurs. La force de ces indications diffère : le dépistage est recommandé chez l’homme fumeur ou ancien fumeur de 65 ans ou plus et chez les apparentés (classe I) ; il devrait être envisagé chez l’artériopathe, et lors d’une échocardiographie chez l’homme de 65 ans ou plus et la femme de 75 ans ou plus (classe IIa) ; il peut seulement être envisagé chez tout homme de 75 ans ou plus et chez la femme de 75 ans ou plus fumeuse ou hypertendue (classe IIb). Le dépistage des hommes de 65 ans réduit la mortalité liée à l’anévrisme d’environ 40 à 50 % (essai MASS). Aucun programme suisse organisé de dépistage ni position suisse propre n’a été trouvé dans les sources lues : c’est une lacune nommée, et la conduite suit l’ESC 2024.</p>
<h3>5.3 Surveillance et seuils d’intervention</h3>
<table class="t"><tr><th>Diamètre (échographie)</th><th>Surveillance (ESC 2024)</th></tr>
<tr><td>25–29 mm (ectasie)</td><td>Contrôle tous les 4 ans si l’espérance de vie dépasse 2 ans : ce diamètre sous-anévrismal peut devenir un anévrisme justifiant une réparation</td></tr>
<tr><td>30–39 mm</td><td>Tous les 3 ans</td></tr>
<tr><td>40–49 mm (40–44 mm chez la femme)</td><td>Chaque année</td></tr>
<tr><td>≥ 50 mm chez l’homme (≥ 45 mm chez la femme)</td><td>Tous les 6 mois (classe I) ; imagerie en coupes et avis vasculaire. Ces intervalles tiennent compte d’une croissance moyenne d’environ 3 mm par an et maintiennent sous 1 % le risque de rupture entre deux contrôles.</td></tr></table>
<div class="alert"><b>Indications de réparation</b> : diamètre ≥ <b>55 mm chez l’homme</b>, ≥ <b>50 mm chez la femme</b> ; croissance rapide (≥ 10 mm par an ou ≥ 5 mm en 6 mois ; indication plus faible, de classe IIb, car le lien entre croissance rapide et rupture repose sur des observations limitées ; une croissance apparente peut aussi venir d’une erreur de mesure, et la première étape consiste à remesurer) ; anévrisme <b>symptomatique</b> ou <b>rompu</b> à tout diamètre ; anévrisme sacciforme ≥ 45 mm (à considérer). Les essais UKSAT et ADAM n’ont montré aucun bénéfice à réparer un anévrisme asymptomatique plus petit. Dans ADAM, un anévrisme de 40 à 54 mm surveillé se rompait dans environ 0,6 % des cas par an, moins que la mortalité opératoire de la réparation précoce (2,7 % dans ADAM, 5,8 % dans UKSAT). Le seuil est plus bas chez la femme, car à diamètre égal son risque de rupture est environ quatre fois plus élevé.</div>
<p><b>Techniques</b> : chirurgie ouverte (prothèse) ou <b>endoprothèse</b> par voie fémorale (EVAR). Les essais EVAR-1, DREAM et OVER : mortalité précoce plus faible avec l’endoprothèse (0,5 à 1,7 % contre 3,0 à 4,7 %), car elle évite la laparotomie et le clampage aortique ; cet avantage disparaît à moyen terme ; <button class="w" data-k="i71-endofuites">réinterventions plus fréquentes après endoprothèse</button> (endofuites) : <b>surveillance à vie</b> de l’endoprothèse par imagerie. Le choix dépend de l’anatomie (collet), de l’âge et des comorbidités, en décision partagée.</p>
</section>
<section class="ilot" id="i71-6"><h2><span class="n">6</span>Anévrisme de l’aorte thoracique</h2>
<p>Souvent asymptomatique, découvert à l’échocardiographie (racine, aorte ascendante) ou à la tomodensitométrie. Symptômes par compression (raucité par atteinte du nerf laryngé récurrent gauche, qui passe sous la crosse aortique ; dysphagie par compression de l’œsophage ; toux par compression de la trachée ou d’une bronche) ou <b>insuffisance aortique</b> par dilatation de l’anneau : en s’élargissant, la racine et la jonction sino-tubulaire écartent les commissures, et des sigmoïdes normales ne se rejoignent plus en diastole. Les diamètres se mesurent de manière standardisée (de bord interne à bord interne en fin de diastole à la tomodensitométrie synchronisée à l’électrocardiogramme ; méthode précisée dans le compte rendu), avec indexation à la taille ou à la surface corporelle. La fin de diastole est choisie parce que l’aorte s’élargit d’environ 2 mm en systole et que les artefacts de mouvement y sont moindres ; la mesure de bord interne à bord interne concorde le mieux avec la mesure échocardiographique sur laquelle reposent les seuils opératoires.</p>
<table class="t"><tr><th>Situation</th><th>Seuil d’intervention (ESC 2024)</th></tr>
<tr><td><button class="w" data-k="i71-seuils-thorax">Aorte ascendante, cas général</button> (valve tricuspide)</td><td><b>≥ 55 mm</b> (classe I) ; aorte ascendante tubulaire &gt; 52 mm à considérer (classe IIa) si le risque opératoire est faible, inférieur à 3 % ; ≥ 50 mm envisageable (classe IIb) en présence d’un facteur de risque : croissance ≥ 3 mm par an, phénotype de racine, taille &lt; 1,69 m, aorte ascendante de plus de 11 cm, âge &lt; 50 ans, hypertension résistante, coarctation ou désir de grossesse</td></tr>
<tr><td>Syndrome de Marfan</td><td>≥ 50 mm (classe I) ; ≥ 45 mm en présence de facteurs de risque (antécédent familial de dissection sous 50 mm, croissance ≥ 3 mm par an, hypertension résistante : classe IIa) ou de désir de grossesse (classe I au-delà de 45 mm). Le déficit en fibrilline-1 fragilise la média de la racine, ce qui justifie un seuil plus bas que dans la population générale.</td></tr>
<tr><td>Loeys-Dietz, Ehlers-Danlos vasculaire, autres formes héréditaires</td><td><button class="w" data-k="i71-gen">Seuils propres au syndrome et au gène</button> : souvent 40–45 mm pour certaines formes de Loeys-Dietz ; aucun seuil de diamètre standard établi dans l’Ehlers-Danlos vasculaire, où la décision est individualisée en centre expert.</td></tr>
<tr><td>Bicuspidie aortique</td><td>≥ 55 mm (classe I) ; ≥ 50 mm pour le phénotype de racine (classe I), qui grossit plus vite et dissèque plus souvent ; &gt; 52 mm pour le phénotype ascendant si le risque opératoire est faible, ou ≥ 50 mm avec facteurs de risque (classe IIa) ; ≥ 45 mm si chirurgie valvulaire programmée</td></tr>
<tr><td>Aorte thoracique descendante</td><td>≥ 55 mm, <button class="w" data-k="i71-seuils-thorax">par endoprothèse (TEVAR) si l’anatomie le permet</button> ; plus tôt chez la femme, en cas de maladie héréditaire ou de croissance rapide</td></tr></table>
</section>
<section class="ilot" id="i71-7"><h2><span class="n">7</span>Syndrome aortique aigu : dissection et apparentés</h2>
<h3>7.1 Clinique</h3>
<p>Douleur <b>brutale</b>, <b>maximale d’emblée</b> (le décollement pariétal peut mettre rapidement la paroi en tension ; cette chronologie oriente vers une dissection, mais un syndrome coronarien peut lui aussi débuter brutalement), décrite comme déchirante ou lancinante, thoracique antérieure (type A) ou interscapulaire et lombaire (type B), parfois <b>migratrice</b> en suivant la progression de la dissection. Signes associés, qui traduisent l’extension :</p>
<table class="t"><tr><th>Signe</th><th>Mécanisme</th></tr>
<tr><td><b>Asymétrie tensionnelle &gt; 20 mmHg</b> entre les bras, déficit d’un pouls</td><td>Atteinte des troncs supra-aortiques : le voile ou le faux chenal comprime l’origine du tronc brachiocéphalique ou de la sous-clavière gauche. Un déficit de pouls n’est présent que chez environ 15 % des patients : son absence n’exclut rien.</td></tr>
<tr><td>Souffle diastolique d’insuffisance aortique</td><td>Décollement des commissures par la dissection de la racine (type A) : privées de leur suspension, les sigmoïdes prolabent en diastole. Dans le registre IRAD, ce souffle n’était entendu que chez environ un tiers des patients, types A et B confondus.</td></tr>
<tr><td>Hypotension, tamponnade (turgescence jugulaire, pouls paradoxal)</td><td>Rupture dans le péricarde : première cause de décès du type A. La partie proximale de l’aorte est intrapéricardique : le sang remplit un péricarde peu extensible et empêche le remplissage du cœur. La ponction n’est qu’un geste de sauvetage avant le bloc : dans une série, trois des quatre patients drainés sont morts dans les 40 minutes, peut-être parce que la remontée de pression a relancé le saignement.</td></tr>
<tr><td>Déficit neurologique (hémiplégie, syncope), paraplégie</td><td>Carotides (accident vasculaire cérébral) ; artères médullaires : les artères intercostales et lombaires naissent de l’aorte descendante, et leur occlusion par le faux chenal prive la moelle de sang (paraplégie)</td></tr>
<tr><td>Syndrome coronarien (surtout inférieur)</td><td>Extension à l’ostium coronaire droit, le plus souvent atteint, d’où un tableau d’infarctus inférieur ; l’électrocardiogramme ne distingue pas cette cause d’un infarctus athéroscléreux</td></tr>
<tr><td>Douleur abdominale, élévation des lactates, oligurie, ischémie de membre</td><td><button class="w" data-k="i71-paroi">Malperfusion mésentérique, rénale, iliaque</button></td></tr></table>
<div class="trap"><span class="k">Piège</span>Environ 5 à 10 % des dissections sont <b>indolores</b> (syncope, accident vasculaire cérébral, insuffisance cardiaque). Et une dissection de type A peut donner un sus-décalage du segment ST inférieur : administrer une double antiagrégation, une héparine ou une thrombolyse pour un « infarctus » qui est une dissection <button class="w" data-k="i71-antithrombotiques">peut être mortel</button>. Devant une douleur thoracique avec asymétrie tensionnelle, élargissement médiastinal ou souffle d’insuffisance aortique, <b>exclure la dissection avant toute anticoagulation</b>.</div>
<h3>7.2 Probabilité clinique : score ADD-RS</h3>
<p>Le <button class="w" data-k="i71-addrs">score de risque de dissection aortique (ADD-RS)</button> compte un point par catégorie présente : terrain à risque, caractéristiques de la douleur, signes d’examen. Score 0–1 et <b>D-dimères &lt; 500 ng/mL</b> : dissection très improbable (valeur prédictive négative ≈ 99,7 % dans l’étude ADvISED) ; score ≥ 2 : imagerie directement.</p>
<h3>7.3 Stratégie</h3>
<p><b>Type A</b> (aorte ascendante) : <b>chirurgie cardiaque en urgence</b> (remplacement de l’aorte ascendante ± crosse, gestion de la valve). Le remplacement ferme le plus souvent la porte d’entrée et supprime le segment qui menace le péricarde, la valve et les coronaires ; la valve, en général normale, est le plus souvent conservée par resuspension. L’âge seul ne contre-indique pas l’opération. <b>Type B non compliqué</b> : traitement médical en soins intensifs (baisse de la fréquence et de la pression), puis discussion d’une endoprothèse préventive en phase subaiguë si critères de risque. Fermer la porte d’entrée fait thromboser le faux chenal et remodeler l’aorte : dans le suivi à 5 ans d’un essai randomisé, l’endoprothèse ajoutée au traitement médical a réduit la mortalité aortique (6,9 % contre 19,3 %) et la progression (27 % contre 46 %). L’ESC 2024 la propose (classe IIa) entre 14 et 90 jours, période où elle semble plus sûre. <b>Type B compliqué</b> (rupture, malperfusion, douleur ou hypertension réfractaires, expansion rapide) : <b>endoprothèse thoracique (TEVAR)</b> en urgence. L’endoprothèse ferme la porte d’entrée, ce qui décomprime le faux chenal et rouvre le vrai chenal ; elle est recommandée en première ligne (classe I), car la chirurgie ouverte des formes compliquées atteignait 25 à 50 % de mortalité ; les maladies héréditaires de l’aorte font exception. L’hématome intramural et l’ulcère pénétrant se traitent comme une dissection de même localisation. L’hématome intramural a un pronostic comparable : il évolue vers une dissection dans 12 % des cas et vers un anévrisme dans 30 %. L’ESC 2024 admet toutefois une surveillance rapprochée d’un hématome de type A non compliqué, sans signe d’imagerie à haut risque, chez un patient à risque opératoire accru (classe IIb).</p>
<div class="quiz ui"><p>Le patient de l’îlot 0 : angioscanner montrant un flap intimal de l’aorte ascendante à l’aorte abdominale. Décision ?</p><button data-ok="1">Type A de Stanford : chirurgie cardiaque en urgence ; en attendant, bêtabloquant intraveineux puis vasodilatateur, antalgie</button><button data-ok="0">Type B : traitement médical seul</button><button data-ok="0">Héparine et double antiagrégation</button><p class="fb" hidden>L’aorte ascendante est atteinte : type A, quelle que soit l’extension distale. Le risque de décès reste élevé et imprévisible sans chirurgie : une estimation horaire de cohorte ne justifie jamais d’attendre. Les antithrombotiques sont contre-indiqués.</p></div>
