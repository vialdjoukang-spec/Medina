<template data-pop="g90-codage" data-title="CIM-10-GM 2024 : sous-codes et pièges de codage">
<div class="lab">Sous-codes couverts</div>
<p>Le chapitre G90 de la CIM-10-GM 2024 comprend : G90.0- neuropathie autonome périphérique idiopathique (dont G90.00 syndrome du sinus carotidien) ; G90.1 dysautonomie familiale (Riley-Day) ; G90.2 syndrome de Claude Bernard-Horner ; G90.4- dysréflexie autonome (G90.40 crises hypertensives, G90.41 crises de transpiration) ; G90.5- syndrome douloureux régional complexe de type I (atrophie osseuse de Sudeck, dystrophie sympathique réflexe) ; G90.6- type II (causalgie) ; G90.7- autre type et type non précisé ; G90.8- autres affections (G90.80 syndrome de tachycardie posturale) ; G90.9 sans précision <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM), bloc G90–G99</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024 en français (OFS)</a>.</p>
<div class="lab">Pièges de codage</div>
<p>Il n’existe pas de code G90.3 en CIM-10-GM 2024 : l’atrophie multisystématisée se code G23.2 (type parkinsonien) et G23.3 (type cérébelleux), et l’hypotension orthostatique neurogène (Shy-Drager) se code G23.8. Le code I95.1 (hypotension orthostatique, y compris la dysrégulation orthostatique) exclut l’hypotension orthostatique neurogène (G23.8) et le syndrome de tachycardie posturale (G90.80). Le code I95.2 désigne l’hypotension d’origine médicamenteuse. La dysfonction autonome due à l’alcool se code G31.2 <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM), bloc G90–G99</a>.</p>
<div class="lab">Limite</div>
<p>Le rattachement d’une neuropathie autonome idiopathique ou d’une ganglionopathie auto-immune à G90.0- ou à G90.8- n’est pas confirmé par une note de codage lue.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM), bloc G90–G99</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024 en français (OFS)</a></p>
</template>

<template data-pop="g90-criteres-ho" data-title="Hypotension orthostatique : critères ESC 2018 et formes">
<div class="lab">Définition</div>
<p>La baisse est progressive et soutenue : pression systolique d’au moins 20 mmHg ou diastolique d’au moins 10 mmHg par rapport à la valeur de base, ou pression systolique inférieure à 90 mmHg. Le seuil de 90 mmHg est nouveau par rapport au consensus de 2011 et particulièrement utile lorsque la pression systolique couchée est inférieure à 110 mmHg. Les chutes diastoliques isolées sont très rares <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<div class="lab">Trois formes</div>
<p>La forme initiale survient dans les premières secondes et exige une mesure continue battement par battement. La forme classique survient dans les trois premières minutes. La forme retardée survient plus tard et se reproduit au test d’inclinaison <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a> ; <a href="https://doi.org/10.1016/j.autneu.2021.102792" target="_blank" rel="noopener">Recommandations sur le test d’inclinaison (Thijs 2021)</a>.</p>
<div class="lab">Application</div>
<p>Mesurer couché au moins 5 minutes, puis debout. La technique influence le résultat : un brassard automatique est désavantagé <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a> ; <a href="https://doi.org/10.1016/j.autneu.2021.102792" target="_blank" rel="noopener">Recommandations sur le test d’inclinaison (Thijs 2021)</a></p>
</template>

<template data-pop="g90-ho" data-title="Hypotension orthostatique : pourquoi la pression baisse au lever">
<div class="lab">Mécanisme</div>
<p>Au lever, la pression diminue si le réflexe de régulation ne corrige pas la baisse. Deux grandes familles existent : la cause non neurogène (médicamenteuse, hypovolémique), où l’accélération cardiaque est conservée ou exagérée, et la cause neurogène, où l’accélération est émoussée (10 battements par minute ou moins) <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<div class="lab">Conséquence</div>
<p>La distinction détermine la conduite : retirer le médicament ou corriger le volume dans le premier cas ; chercher la maladie autonome dans le second (dysautonomie primaire, atrophie multisystématisée, maladie de Parkinson, diabète, amylose, lésion médullaire).</p>
<div class="lab">Piège</div>
<p>Une accélération exagérée peut aussi traduire une anémie ou une hypovolémie <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></p>
</template>

<template data-pop="g90-hon" data-title="Hypotension orthostatique neurogène (consensus AAS/EFAS 2018)">
<div class="lab">Définition</div>
<p>Chute soutenue de la pression systolique d’au moins 20 mmHg (30 mmHg en cas d’hypertension de décubitus) ou diastolique d’au moins 10 mmHg dans les 3 minutes suivant le lever ou une inclinaison d’au moins 60° <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<div class="lab">Raison du seuil de 30 mmHg</div>
<p>Explication du cours : en cas d’hypertension de décubitus, la valeur de base est plus élevée, donc un seuil de chute plus grand est retenu.</p>
<div class="lab">Accélération cardiaque</div>
<p>Dans l’hypotension orthostatique neurogène, l’accélération est émoussée ou absente, habituellement de 10 battements par minute ou moins ; elle peut être exagérée en cas d’anémie ou d’hypovolémie <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a> ; <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></p>
</template>

<template data-pop="g90-hdn" data-title="Hypertension de décubitus neurogène">
<div class="lab">Définition et grades</div>
<p>Chez un patient dont l’hypotension orthostatique neurogène est prouvée, pression systolique d’au moins 140 mmHg et/ou diastolique d’au moins 90 mmHg après au moins 5 minutes de repos couché. Légère : 140–159/90–99 ; modérée : 160–179/100–109 ; sévère : au moins 180/110 mmHg <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<div class="lab">Hypertension nocturne</div>
<p>Perte de la baisse nocturne d’au moins 10 % : profils reduced-dipping, non-dipping, rising <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<div class="lab">Mécanisme et conséquence</div>
<p>La pression élevée couché provoque la natriurèse de pression nocturne : nycturie, perte volémique nocturne et aggravation de l’hypotension au réveil. Les urgences hypertensives (AVC, œdème aigu du poumon, infarctus du myocarde) sont possibles, surtout sous traitement anti-hypotenseur <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<div class="lab">Dépistage</div>
<p>À l’annonce de l’hypotension orthostatique neurogène, puis périodiquement, surtout après introduction ou augmentation d’un anti-hypotenseur <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a></p>
</template>

<template data-pop="g90-sinus" data-title="Hypersensibilité et syndrome du sinus carotidien">
<div class="lab">Définitions</div>
<p>Hypersensibilité sinocarotidienne : pause ventriculaire supérieure à 3 secondes et/ou chute de pression systolique supérieure à 50 mmHg au massage. Syndrome du sinus carotidien (G90.00) : reproduction des symptômes spontanés au massage chez un patient ayant une syncope d’origine inconnue compatible avec un mécanisme réflexe ; l’asystolie dépasse typiquement 6 secondes <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<div class="lab">Fréquence</div>
<p>Hypersensibilité fréquente chez l’homme âgé sans syncope (jusqu’à 40 %), exceptionnelle avant 40 ans <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<div class="lab">Traitement</div>
<p>Stimulation double chambre à considérer (classe IIa, rétrogradée depuis la classe I) dans la forme cardio-inhibitrice dominante ; deux essais randomisés montrent moins de récidives <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></p>
</template>

<template data-pop="g90-horner" data-title="Syndrome de Claude Bernard-Horner : triade et fréquences">
<div class="lab">Triade</div>
<p>Ptosis, myosis, anhidrose, par atteinte de la voie oculosympathique. Dans une série de 450 patients : myosis 98 %, ptosis 88 %, anhidrose 4 % <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<div class="lab">Signes associés</div>
<p>Ptosis inversé de la paupière inférieure (faux énophtalmos), anisocorie maximale dans l’obscurité, retard de dilatation (environ 5 secondes), hétérochromie irienne dans les formes congénitales <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<div class="lab">Piège</div>
<p>L’anhidrose est rare dans la série (4 %) : son absence n’exclut pas le diagnostic. Le Horner douloureux impose une imagerie vasculaire urgente.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a></p>
</template>

<template data-pop="g90-muller" data-title="Le muscle de Müller et le ptosis du Horner">
<div class="lab">Anatomie fonctionnelle</div>
<p>Le muscle de Müller, innervé par le sympathique, ne relève la paupière que de 2 à 3 mm <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<div class="lab">Conséquence clinique</div>
<p>Sa dénervation provoque un ptosis discret ; la paupière inférieure, elle, est légèrement remontée (ptosis inversé).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a></p>
</template>

<template data-pop="g90-da" data-title="Dysréflexie autonome : définition et fréquence">
<div class="lab">Définition</div>
<p>Hypertension épisodique avec bradycardie réflexe (baroréflexe), déclenchée par des réflexes sympathiques non modulés sous une lésion médullaire, typiquement au niveau ou au-dessus du 6e segment thoracique <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a>.</p>
<div class="lab">Seuils</div>
<p>Les seuils de définition varient selon les études : hausse de la pression systolique de 20 à 40 mmHg au-dessus de la base chez l’adulte, de 15 à 20 mmHg chez l’enfant <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a>.</p>
<div class="lab">Fréquence</div>
<p>48 à 91 % des lésions au niveau ou au-dessus du 6e segment thoracique selon la complétude, le délai et les critères ; début habituel 3 à 6 mois après la lésion ; 5,7 % seulement dans le premier mois. La distension vésicale est en cause dans environ 85 % des cas <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40937783/" target="_blank" rel="noopener">Dysréflexie autonome (Krivoborodov, résumé)</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40937783/" target="_blank" rel="noopener">Dysréflexie autonome (Krivoborodov, résumé)</a></p>
</template>

<template data-pop="g90-da-urgence" data-title="Dysréflexie autonome : conduite lue et limites">
<div class="lab">Conduite décrite</div>
<p>Mesurer la pression toutes les 2 à 5 minutes, asseoir le patient, supprimer le déclencheur (vider la vessie, soins intestinaux, recherche d’escarre, vêtement serré, lésion cutanée). Si nécessaire, nitrate (pâte de nitroglycérine à 2 % au-dessus du niveau lésionnel, retirée dès l’effet). La nifédipine est largement utilisée mais expose à une hypotension sévère de rebond <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a>.</p>
<div class="lab">Limites</div>
<p>La source est une revue américaine qui cite les recommandations du Veterans Affairs. Aucune recommandation suisse ou européenne n’a été lue sur la conduite aiguë. L’information professionnelle suisse de la nifédipine et de la nitroglycérine n’a pas été lue pour cette indication : leur usage est probablement hors étiquette, sans vérification. Le protocole du centre spécialisé prévaut.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a> ; <a href="https://doi.org/10.1007/s11255-026-05236-8" target="_blank" rel="noopener">Sondage intermittent, directive allemande 3.0 (résumé)</a></p>
</template>

<template data-pop="g90-budapest" data-title="Syndrome douloureux régional complexe : critères de Budapest">
<div class="lab">Critères (tous requis)</div>
<p>Douleur persistante disproportionnée à l’événement initial ; au moins un symptôme dans au moins 3 des 4 catégories (sensitive, vasomotrice, sudomotrice et œdème, motrice et trophique) ; au moins un signe observé à l’examen dans au moins 2 catégories ; aucun autre diagnostic n’explique mieux le tableau. Sensibilité 0,99, spécificité 0,68 <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6593444/" target="_blank" rel="noopener">Standards de la European Pain Federation sur le SDRC</a>.</p>
<div class="lab">Types et usage</div>
<p>Le type I n’a pas de lésion nerveuse, le type II a une lésion nerveuse majeure ; la distinction a peu de pertinence pour le traitement <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6593444/" target="_blank" rel="noopener">Standards de la European Pain Federation sur le SDRC</a>. Le consensus de Valence, révision récente des critères, n’a pas été lu <a href="https://www.revmed.ch/revue-medicale-suisse/2026/revue-medicale-suisse-967/" target="_blank" rel="noopener">Revue médicale suisse 2026, vadémécum du SDRC (résumé)</a>.</p>
<div class="lab">Piège</div>
<p>Avec une spécificité de 0,68, les critères surdiagnostiquent si l’exclusion des autres diagnostics est négligée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6593444/" target="_blank" rel="noopener">Standards de la European Pain Federation sur le SDRC</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2026/revue-medicale-suisse-967/" target="_blank" rel="noopener">Revue médicale suisse 2026, vadémécum du SDRC (résumé)</a></p>
</template>

<template data-pop="g90-pots" data-title="Syndrome de tachycardie posturale">
<div class="lab">Définition et fréquence</div>
<p>Accélération cardiaque excessive au lever avec intolérance orthostatique. Début à 15–45 ans, environ 80 % de femmes, prévalence de 0,2 à 1,0 % dans les pays développés <a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a>.</p>
<div class="lab">Diagnostic</div>
<p>Le test d’inclinaison avec mesure battement par battement est l’étalon ; chez l’adolescent, un test de Schellong suffit. Les seuils chiffrés de fréquence cardiaque et de durée n’ont pas été lus et ne sont pas donnés ici <a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.778.741" target="_blank" rel="noopener">Revue médicale suisse 2022, tachycardie posturale de l’adolescent (résumé)</a>.</p>
<div class="lab">Évolution</div>
<p>Environ 50 % de guérison spontanée en 1 à 3 ans <a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a>.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.778.741" target="_blank" rel="noopener">Revue médicale suisse 2022, tachycardie posturale de l’adolescent (résumé)</a></p>
</template>

<template data-pop="g90-fd" data-title="Dysautonomie familiale (Riley-Day)">
<div class="lab">Définition</div>
<p>Neuropathie sensitive et autonome héréditaire de type 3, autosomique récessive <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a>.</p>
<div class="lab">Clinique</div>
<p>Perte sensitive profonde dès la naissance, variabilité tensionnelle excessive, dysphagie neurogène avec pneumopathies d’inhalation, crises autonomes hyperadrénergiques, cécité progressive, ataxie proprioceptive, morts subites nocturnes. Le baroréflexe défaillant explique l’instabilité tensionnelle <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a>.</p>
<div class="lab">Prise en charge</div>
<p>Traitement symptomatique et préventif ; thérapies modificatrices en préparation. La source est une revue descriptive, non normative <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a>.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a></p>
</template>

<template data-pop="g90-elp1" data-title="Le gène ELP1">
<div class="lab">Mécanisme</div>
<p>La mutation fondatrice provoque le saut de l’exon 20 et la perte de la protéine Elongator-1, indispensable au développement et à la survie neuronale <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a>.</p>
<div class="lab">Fréquence</div>
<p>Portée par une personne sur 30 chez les Juifs ashkénazes d’ascendance européenne ; 99,5 % des patients sont homozygotes <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a>.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a></p>
</template>

<template data-pop="g90-cgrp" data-title="CGRP et inflammation neurogène">
<div class="lab">Rôle</div>
<p>Le CGRP est un neuropeptide des fibres afférentes C. Dans la dysréflexie autonome, ces fibres bourgeonnent sous la lésion médullaire sous l’influence du facteur de croissance nerveuse <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a>. Dans le syndrome douloureux régional complexe, l’inflammation neurogène fait intervenir la substance P et le CGRP <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a></p>
</template>

<template data-pop="g90-baroreflexe" data-title="Baroréflexe">
<div class="lab">Arc</div>
<p>Les afférences passent par les nerfs crâniens IX et X ; le baroréflexe maintient la pression au lever. Son échec explique l’instabilité tensionnelle de la dysautonomie familiale <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a>. Dans l’hypotension orthostatique neurogène, l’atteinte peut être afférente, centrale ou efférente <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a></p>
</template>

<template data-pop="g90-natriurese" data-title="Natriurèse de pression nocturne">
<div class="lab">Mécanisme et conséquence</div>
<p>Quand la pression couchée est élevée, le rein élimine du sodium et de l’eau : la nuit, la nycturie fait perdre du volume, ce qui aggrave l’hypotension orthostatique le matin <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<div class="lab">Décision</div>
<p>Incliner le lit entier d’environ 12° ou plus et éviter le décubitus diurne <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a></p>
</template>

<template data-pop="g90-ganglionopathie" data-title="Ganglionopathie autonome auto-immune">
<div class="lab">Mécanisme</div>
<p>Anticorps dirigés contre le récepteur nicotinique ganglionnaire de l’acétylcholine, pathogènes ; dosage des anticorps comme examen <a href="https://doi.org/10.11477/mf.188160960780080905" target="_blank" rel="noopener">Ganglionopathie autonome auto-immune (résumé)</a>.</p>
<div class="lab">Limite</div>
<p>Source lue en résumé ; rattachement CIM non confirmé.</p>
<p class="src">Références : <a href="https://doi.org/10.11477/mf.188160960780080905" target="_blank" rel="noopener">Ganglionopathie autonome auto-immune (résumé)</a></p>
</template>

<template data-pop="g90-dissection" data-title="Horner douloureux et dissection carotidienne">
<div class="lab">Fréquence</div>
<p>Sur 88 Horner isolés : 7 dissections dont 6 douloureuses <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<div class="lab">Décision</div>
<p>Si douleur : imagerie urgente. Un Horner partiel avec cervicalgie ou céphalée unilatérale nouvelle impose un bilan vasculaire urgent <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a> ; <a href="https://doi.org/10.3389/fneur.2026.1842860" target="_blank" rel="noopener">Spondylose cervicale de type artère carotide interne (perspective)</a>.</p>
<div class="lab">Limite</div>
<p>La source <a href="https://doi.org/10.3389/fneur.2026.1842860" target="_blank" rel="noopener">Spondylose cervicale de type artère carotide interne (perspective)</a> est une perspective, non une recommandation.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a> ; <a href="https://doi.org/10.3389/fneur.2026.1842860" target="_blank" rel="noopener">Spondylose cervicale de type artère carotide interne (perspective)</a></p>
</template>

<template data-pop="g90-neuroblastome" data-title="Neuroblastome et Horner de l’enfant">
<div class="lab">Constat</div>
<p>Le neuroblastome est la cause maligne occulte la plus fréquente du Horner de l’enfant ; le Horner est présent dans 3,5 à 13 % des neuroblastomes <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<div class="lab">Conduite</div>
<p>Palpation du cou, des aisselles et de l’abdomen, IRM et catécholamines urinaires (recommandation discutée) <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a></p>
</template>

<template data-pop="g90-stand" data-title="Test de station debout active">
<div class="lab">Technique</div>
<p>Mesure de la pression au sphygmomanomètre couché, puis debout, pour les formes classique et retardée. Les brassards automatiques sont désavantagés car la pression chute rapidement ; plus de 4 mesures par minute sont impossibles sans obstruction veineuse <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<div class="lab">Limite</div>
<p>La forme initiale exige une mesure continue battement par battement.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></p>
</template>

<template data-pop="g90-mnemo" data-title="Repères mnémotechniques (aide pédagogique, non critère officiel)">
<div class="lab">Aide pédagogique, non critère officiel</div>
<p>Hypotension orthostatique : « vingt-dix » : 20 mmHg de pression systolique, 10 mmHg de diastolique. Horner : triade ptosis, myosis, anhidrose. Critères de Budapest : trois catégories pour les symptômes, deux pour les signes.</p>
</template>
