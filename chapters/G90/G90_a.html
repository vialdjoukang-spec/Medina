<section class="ilot" id="g90-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Une femme de 76 ans consulte pour des chutes. Couchée depuis cinq minutes, sa pression systolique est de 148 mmHg et son pouls de 70 par minute. Après trois minutes debout, la pression systolique est de 112 mmHg et le pouls de 73 par minute. La baisse est de 148 − 112 = 36 mmHg, donc supérieure au seuil de 20 mmHg : il s’agit d’une <button class="w" data-k="g90-ho">hypotension orthostatique</button>. Le pouls n’a augmenté que de 3 battements par minute, alors qu’un cœur dont le réflexe de régulation fonctionne s’accélère de plus de 10. Cette absence d’accélération oriente vers une cause neurogène et non vers une simple déplétion en volume. Cette vignette est fictive ; ses valeurs sont pédagogiques.</p>
<p>Le chapitre G90 de la classification suisse regroupe des entités très différentes, réunies par une atteinte du système nerveux autonome : une pression qui s’effondre au lever, un ptosis avec myosis, une douleur régionale disproportionnée après un traumatisme, une crise hypertensive chez un blessé médullaire, une tachycardie au lever chez une jeune femme. La question d’examen est double : reconnaître l’atteinte autonome derrière un symptôme banal (syncope, chute, céphalée), puis distinguer l’urgence (dissection carotidienne, dysréflexie autonome) de la prise en charge de fond.</p>
<p>Les objectifs sont les suivants. Définir avec leurs seuils l’hypotension orthostatique, sa forme neurogène et l’hypertension de décubitus neurogène. Reconnaître le syndrome de Claude Bernard-Horner et son piège vasculaire. Appliquer les critères de Budapest au syndrome douloureux régional complexe. Mener la conduite initiale devant une dysréflexie autonome. Prescrire, avec les limites suisses, la midodrine et la fludrocortisone.</p>
<div class="key"><b>À retenir.</b> Une atteinte autonome se reconnaît à des signes mesurables (pression, pouls, pupille, sudation, température cutanée). Chaque entité exige de séparer l’urgence de la prise en charge de fond, et la cause traitable de la cause seulement décrite.</div>
</section>

<section class="ilot" id="g90-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>Le chapitre G90 de la <button class="w" data-k="g90-codage">CIM-10-GM 2024 (sous-codes et pièges de codage)</button> rassemble des entités hétérogènes ayant en commun l’atteinte du système nerveux autonome. La dysfonction autonome due à l’alcool en est exclue (elle relève du code G31.2). Le cours suit les définitions des sociétés savantes, résumées dans le tableau suivant, puis commente les plus utiles à l’examen.</p>
<table class="t"><thead><tr><th>Entité</th><th>Définition retenue</th><th>Source</th></tr></thead><tbody><tr><td><button class="w" data-k="g90-criteres-ho">Hypotension orthostatique</button></td><td>Baisse progressive et soutenue de la pression systolique d’au moins 20 mmHg ou de la pression diastolique d’au moins 10 mmHg par rapport à la valeur de base, ou pression systolique inférieure à 90 mmHg</td><td><a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></td></tr><tr><td><button class="w" data-k="g90-hon">Hypotension orthostatique neurogène</button></td><td>Chute soutenue d’au moins 20 mmHg (30 mmHg en cas d’hypertension de décubitus) de la pression systolique, ou d’au moins 10 mmHg de la diastolique, dans les 3 minutes après le lever ou une inclinaison d’au moins 60° ; accélération cardiaque émoussée ou absente</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a> ; <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></td></tr><tr><td><button class="w" data-k="g90-hdn">Hypertension de décubitus neurogène</button></td><td>Chez un patient dont l’hypotension orthostatique neurogène est prouvée, pression systolique d’au moins 140 mmHg et/ou diastolique d’au moins 90 mmHg après au moins 5 minutes couché</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a></td></tr><tr><td><button class="w" data-k="g90-sinus">Syndrome du sinus carotidien</button></td><td>Reproduction des symptômes spontanés par le massage chez un patient ayant une syncope d’origine inconnue compatible avec un mécanisme réflexe</td><td><a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></td></tr><tr><td><button class="w" data-k="g90-horner">Syndrome de Claude Bernard-Horner</button></td><td>Atteinte de la voie oculosympathique : ptosis, myosis, anhidrose</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a></td></tr><tr><td><button class="w" data-k="g90-da">Dysréflexie autonome</button></td><td>Hypertension épisodique avec bradycardie réflexe, déclenchée par des réflexes sympathiques non modulés sous une lésion médullaire, typiquement au niveau ou au-dessus du 6e segment thoracique</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a></td></tr><tr><td><button class="w" data-k="g90-budapest">Syndrome douloureux régional complexe</button></td><td>Douleur post-traumatique primaire et invalidante, touchant les parties distales des membres ; type I sans lésion nerveuse, type II avec lésion nerveuse majeure</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6593444/" target="_blank" rel="noopener">Standards de la European Pain Federation sur le SDRC</a></td></tr><tr><td><button class="w" data-k="g90-pots">Syndrome de tachycardie posturale</button></td><td>Accélération cardiaque excessive au lever avec intolérance orthostatique</td><td><a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a></td></tr><tr><td><button class="w" data-k="g90-fd">Dysautonomie familiale</button></td><td>Neuropathie sensitive et autonome héréditaire, autosomique récessive</td><td><a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a></td></tr></tbody></table>
<div class="trap"><span class="k">Version et arbitrage</span> Le seuil de 90 mmHg de pression systolique est une nouveauté de l’ESC 2018 par rapport au consensus de 2011 ; il est particulièrement utile lorsque la pression systolique couchée est inférieure à 110 mmHg. Les chutes diastoliques isolées sont très rares. Pour les formes neurogènes, le consensus AAS/EFAS 2018 relève le seuil à 30 mmHg en présence d’une hypertension de décubitus, car la valeur de base est alors plus haute.</div>
<p>Selon le moment d’apparition, l’ESC 2018 distingue trois formes d’hypotension orthostatique : initiale (dans les premières secondes, elle exige une mesure continue battement par battement), classique (dans les 3 premières minutes) et retardée (au-delà, reproduite au test d’inclinaison). Cette distinction guide le choix de la technique de mesure (chapitre 6 et onglet Examens).</p>
<div class="key"><b>À retenir.</b> Le diagnostic d’hypotension orthostatique est une définition mesurée (20 mmHg, 10 mmHg ou moins de 90 mmHg). Le qualificatif « neurogène » ne se pose pas sur la seule baisse de pression : il exige l’absence d’accélération cardiaque, c’est-à-dire une accélération habituellement de 10 battements par minute ou moins.</div>
<button class="pareto-btn ui" data-k="pareto-g90-definition">▲ Loi de Pareto — Définitions et classification</button>
</section>

<section class="ilot" id="g90-2"><h2><span class="n">2</span>Fréquence</h2>
<p>Les données disponibles dans les sources lues sont étrangères ; aucune donnée épidémiologique suisse n’a été lue pour ces entités. Le tableau les présente par entité.</p>
<table class="t"><thead><tr><th>Entité</th><th>Donnée lue</th><th>Source</th></tr></thead><tbody><tr><td>Hypotension orthostatique</td><td>Fréquente et sous-diagnostiquée chez la personne âgée (prévalence par âge non lue)</td><td><a href="https://www.revmed.ch/revue-medicale-suisse/2025/revue-medicale-suisse-937/" target="_blank" rel="noopener">Revue médicale suisse 2025, hypotension orthostatique du sujet âgé (résumé)</a></td></tr><tr><td>Hypersensibilité sinocarotidienne</td><td>Fréquente chez l’homme âgé sans syncope (jusqu’à 40 %), exceptionnelle avant 40 ans</td><td><a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></td></tr><tr><td>Hypertension de décubitus neurogène</td><td>Parkinson 34 à 46 % ; atrophie multisystématisée 37 % (perte de la baisse nocturne jusqu’à 75 %) ; dysautonomie pure 48 à 70 %</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a></td></tr><tr><td>Syndrome de Claude Bernard-Horner</td><td>Série de 450 patients : myosis 98 %, ptosis 88 %, anhidrose 4 % ; après chirurgie thyroïdienne endoscopique : 0,03 à 0,48 %</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12399627/" target="_blank" rel="noopener">Horner après chirurgie thyroïdienne endoscopique (Xie 2025, résumé)</a></td></tr><tr><td>Dysréflexie autonome</td><td>48 à 91 % des lésions au niveau ou au-dessus du 6e segment thoracique ; début habituel 3 à 6 mois après la lésion</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a></td></tr><tr><td>Syndrome douloureux régional complexe</td><td>Incidence de 5,5 à 26,2 pour 100 000 personnes-années ; 7 % après fracture d’un membre ; environ 5 % des patients ne se souviennent d’aucun traumatisme</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6593444/" target="_blank" rel="noopener">Standards de la European Pain Federation sur le SDRC</a></td></tr><tr><td>Syndrome de tachycardie posturale</td><td>15 à 45 ans, environ 80 % de femmes ; prévalence de 0,2 à 1,0 % dans les pays développés</td><td><a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a></td></tr><tr><td>Dysautonomie familiale</td><td>Une personne sur 30 parmi les Juifs ashkénazes d’ascendance européenne porte la mutation fondatrice du gène <button class="w" data-k="g90-elp1">ELP1</button> ; 99,5 % des patients sont homozygotes</td><td><a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a></td></tr></tbody></table>
<p>Ces fréquences orientent la probabilité pré-test. Une hypersensibilité sinocarotidienne retrouvée chez un homme âgé sans syncope n’est pas un diagnostic : le syndrome du sinus carotidien exige la reproduction des symptômes spontanés. De même, la dysréflexie autonome devient rare dans le premier mois après la lésion (5,7 % seulement) et fréquente après 3 à 6 mois : un blessé médullaire récent n’est donc pas à l’abri, mais le risque s’installe avec la réorganisation médullaire décrite plus loin.</p>

<section class="ilot" id="g90-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Voies normales</b></p>
<p>La voie oculosympathique comporte trois neurones. Le premier part de l’hypothalamus et rejoint le centre cilio-spinal de Budge-Waller (du 8e segment cervical au 2e thoracique) ; le deuxième gagne le ganglion cervical supérieur (niveau du 2e au 3e segment cervical) ; le troisième longe le plexus carotidien interne, traverse le sinus caverneux et l’orbite, et innerve le dilatateur de l’iris et le <button class="w" data-k="g90-muller">muscle de Müller</button>. Le contrôle de la pression au lever repose sur le <button class="w" data-k="g90-baroreflexe">baroréflexe</button> dont les afférences passent par les nerfs crâniens IX et X.</p>
<figure><svg viewBox="0 0 380 271" role="img" aria-label="Figure 1 — Voie oculosympathique" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="10" width="356" height="65" rx="5"/><rect x="12" y="89" width="356" height="48" rx="5"/><rect x="12" y="151" width="356" height="48" rx="5"/><rect x="12" y="213" width="356" height="48" rx="5"/><path d="M190 75v14m-4-5l4 5 4-5"/><path d="M190 137v14m-4-5l4 5 4-5"/><path d="M190 199v14m-4-5l4 5 4-5"/></g><g fill="currentColor" text-anchor="middle"><text x="190" y="32">Premier neurone : hypothalamus, puis centre</text><text x="190" y="49">cilio-spinal de Budge-Waller (8e cervical à 2e</text><text x="190" y="66">thoracique)</text><text x="190" y="111">Deuxième neurone (préganglionnaire) : jusqu’au</text><text x="190" y="128">ganglion cervical supérieur (2e à 3e cervical)</text><text x="190" y="173">Troisième neurone (postganglionnaire) : plexus</text><text x="190" y="190">carotidien interne, sinus caverneux, orbite</text><text x="190" y="235">Effecteurs : dilatateur de l’iris et muscle de</text><text x="190" y="252">Müller</text></g></svg><figcaption>Figure 1 — Voie oculosympathique à trois neurones. Schéma didactique : une lésion de chaque étage porte un nom (premier, deuxième, troisième ordre) ; le niveau lésionnel guide l’imagerie.</figcaption></figure>
<p><b>Hypotension orthostatique et hypertension de décubitus neurogènes</b></p>
<p>Dans l’hypotension orthostatique neurogène, le baroréflexe est altéré à un ou plusieurs niveaux (afférent, central, efférent), le système rénine-angiotensine-aldostérone est dérégulé et les adrénorécepteurs sont hypersensibles par dénervation. L’hypertension de décubitus a le même terrain : dans l’atrophie multisystématisée, des fibres post-ganglionnaires épargnées libèrent de la noradrénaline ; dans la dysautonomie pure, des mécanismes indépendants du sympathique interviennent. La conséquence clinique principale est la <button class="w" data-k="g90-natriurese">natriurèse de pression nocturne</button> : la pression élevée couché provoque une perte urinaire de sodium et d’eau pendant la nuit, d’où nycturie, perte volémique nocturne et aggravation de l’hypotension orthostatique au réveil.</p>
<p><b>Syndrome de Claude Bernard-Horner</b></p>
<p>Le déficit du muscle de Müller entraîne un ptosis discret, car ce muscle ne relève la paupière que de 2 à 3 mm. La paupière inférieure est légèrement remontée (ptosis inversé, ou faux énophtalmos). Le myosis est plus visible dans l’obscurité, car l’iris sans dilatateur actif ne s’ouvre plus : la dilatation est retardée (environ 5 secondes). L’anhidrose est faciale pour les lésions de premier et deuxième ordre, et limitée à une petite zone frontale pour le troisième ordre. Une hétérochromie irienne est typique des formes congénitales.</p>
<p><b>Dysréflexie autonome</b></p>
<p>Sous la lésion médullaire, les neurones sympathiques préganglionnaires ont perdu leur contrôle supraspinal. S’y ajoutent une réorganisation synaptique, un bourgeonnement des fibres afférentes C porteuses de <button class="w" data-k="g90-cgrp">CGRP</button> (sous l’influence du facteur de croissance nerveuse), une plasticité propriospinale et une hypersensibilité vasculaire adrénergique. Un stimulus nociceptif sous la lésion déclenche donc une vasoconstriction massive. La bradycardie est baroréflexe ; une tachycardie est aussi rapportée, surtout pour les lésions cervicales. La suractivité détrusorienne neurogène est un déclencheur majeur.</p>
<p><b>Syndrome douloureux régional complexe, tachycardie posturale, autres entités</b></p>
<p>Le syndrome douloureux régional complexe est considéré comme pathologique et non psychopathologique. Sa physiopathologie est multifactorielle : inflammation (cytokines, inflammation neurogène par substance P et CGRP), auto-immunité, dysfonction sympathique, réorganisation corticale, atteinte des petites fibres, facteurs génétiques et épigénétiques. L’évolution fréquente d’une forme chaude aiguë vers une forme froide chronique correspond à la normalisation des médiateurs inflammatoires, en général dans les 18 mois. Les facteurs psychologiques ne prédisent pas la survenue, mais s’associent à l’intensité de la douleur. Dans la tachycardie posturale, l’étiologie reste largement inconnue (hypothèses auto-immune, hyperadrénergique, dénervation sympathique avec hypovolémie centrale). La dysautonomie familiale résulte du saut de l’exon 20 du gène ELP1, avec perte de la protéine Elongator-1, indispensable au développement et à la survie neuronale. Enfin, la <button class="w" data-k="g90-ganglionopathie">ganglionopathie autonome auto-immune</button> associe des anticorps dirigés contre le récepteur nicotinique ganglionnaire de l’acétylcholine.</p>
<div class="trap"><span class="k">Piège</span> Associer facteur psychologique et syndrome douloureux régional complexe ne signifie pas cause psychologique : les sources lues le décrivent comme une maladie pathologique, et les facteurs psychologiques s’associent à l’intensité de la douleur sans prédire la survenue.</div>
<button class="pareto-btn ui" data-k="pareto-g90-meca">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="g90-4"><h2><span class="n">4</span>Causes et déclencheurs</h2>
<p>Le tableau classe les causes par entité. La cause médicamenteuse de l’hypotension orthostatique est la plus fréquente : la rechercher d’abord est donc la première mesure thérapeutique.</p>
<table class="t"><thead><tr><th>Entité</th><th>Causes lues</th><th>Source</th></tr></thead><tbody><tr><td>Hypotension orthostatique</td><td>Médicamenteuse (la plus fréquente : vasodilatateurs, diurétiques, phénothiazines, antidépresseurs) ; déplétion volémique ; dysautonomie primaire (dysautonomie pure, atrophie multisystématisée, maladie de Parkinson, démence à corps de Lewy) ; secondaire (diabète, amylose, lésion médullaire, neuropathie auto-immune ou paranéoplasique, insuffisance rénale)</td><td><a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></td></tr><tr><td>Hypotension orthostatique du sujet âgé</td><td>Vieillissement, effets indésirables médicamenteux, déshydratation, causes neurologiques</td><td><a href="https://www.revmed.ch/revue-medicale-suisse/2025/revue-medicale-suisse-937/" target="_blank" rel="noopener">Revue médicale suisse 2025, hypotension orthostatique du sujet âgé (résumé)</a></td></tr><tr><td>Syndrome de Claude Bernard-Horner, premier ordre</td><td>Syndrome de Wallenberg (le plus fréquent), hémorragie pontique, démyélinisation, tumeur, malformation de Chiari, syringomyélie, spondylose cervicale, traumatisme</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a></td></tr><tr><td>Deuxième ordre</td><td>Malignité jusqu’à 25 % (tumeur de Pancoast, tumeurs médiastinales ou thyroïdiennes) ; plexus brachial ; chirurgie cardiothoracique ou cervicale ; anévrisme aortique</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12399627/" target="_blank" rel="noopener">Horner après chirurgie thyroïdienne endoscopique (Xie 2025, résumé)</a></td></tr><tr><td>Troisième ordre</td><td><button class="w" data-k="g90-dissection">Dissection carotidienne</button>, anévrisme, artérite, syndrome d’Eagle, ectasie jugulaire, tumeur de la base du crâne, atteinte du sinus caverneux</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a></td></tr><tr><td>Horner de l’enfant</td><td><button class="w" data-k="g90-neuroblastome">Neuroblastome</button> : cause maligne occulte la plus fréquente ; Horner dans 3,5 à 13 % des neuroblastomes</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a></td></tr><tr><td>Dysréflexie autonome</td><td>Distension vésicale ou intestinale, lacérations cutanées, ongle incarné, escarres, vêtements serrés, cathétérisme, cystomanométrie, vibrostimulation pénienne</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a></td></tr><tr><td>Syndrome douloureux régional complexe</td><td>Traumatisme distal d’un membre ; fracture ; l’immobilisation contribue mais ne suffit pas seule</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6593444/" target="_blank" rel="noopener">Standards de la European Pain Federation sur le SDRC</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a></td></tr><tr><td>Tachycardie posturale</td><td>Infection virale, vaccination, traumatisme, grossesse, chirurgie, stress psychosocial</td><td><a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a></td></tr></tbody></table>
<p>Chez le sujet âgé, plusieurs de ces causes se cumulent le plus souvent (vieillissement, médicaments, déshydratation, atteinte neurologique) : retirer un seul facteur ne suffit donc pas toujours à corriger la pression debout.</p>
<div class="trap"><span class="k">Piège</span> Un Horner de troisième ordre est le signe d’une dissection carotidienne tant que le contraire n’est pas démontré : le plexus sympathique de troisième ordre longe l’artère carotide interne, et une lésion de la paroi artérielle l’atteint. Sur 88 Horner isolés, 7 étaient des dissections, dont 6 douloureux <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</div>

<section class="ilot" id="g90-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche, pour chaque entité, le symptôme révélateur, le déclencheur et les médicaments. Les médicaments sont toujours demandés : la cause médicamenteuse est la plus fréquente de l’hypotension orthostatique.</p>
<div class="two"><div class="card"><h4>Hypotension orthostatique et hypertension de décubitus</h4><p>Chutes, vertiges, syncopes, confusion chez l’âgé <a href="https://www.revmed.ch/revue-medicale-suisse/2025/revue-medicale-suisse-937/" target="_blank" rel="noopener">Revue médicale suisse 2025, hypotension orthostatique du sujet âgé (résumé)</a>. L’hypertension de décubitus est souvent asymptomatique ou révélée par des céphalées, une nycturie et des œdèmes des chevilles ; elle peut provoquer des urgences hypertensives (AVC, œdème aigu du poumon, infarctus du myocarde), surtout sous traitement anti-hypotenseur <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p></div><div class="card"><h4>Syndrome de Claude Bernard-Horner</h4><p>La question décisive porte sur la douleur : céphalée ou cervicalgie récente, traumatisme cervical, chirurgie cervicale ou thoracique. Un Horner douloureux est une dissection carotidienne jusqu’à preuve du contraire. Chez l’enfant, rechercher une hétérochromie (forme congénitale) et une masse maligne, notamment un neuroblastome <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p></div><div class="card"><h4>Dysréflexie autonome</h4><p>Au-dessus de la lésion : céphalée, sudation, flush, piloérection, congestion nasale, vision floue, anxiété. Céphalée et sudation dans 88 % des cas ; pression systolique jusqu’à 325 mmHg rapportée. Interroger le dernier sondage, le transit, les lésions cutanées et les vêtements serrés <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a>.</p></div><div class="card"><h4>Syndrome douloureux régional complexe</h4><p>Douleur régionale distale ne correspondant pas à un territoire nerveux. Recueillir symptômes et signes dans quatre catégories (sensitive, vasomotrice, sudomotrice et œdème, motrice et trophique). Évaluer cause déclenchante, intensité, fonction, sommeil et humeur <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6593444/" target="_blank" rel="noopener">Standards de la European Pain Federation sur le SDRC</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a>.</p></div></div>
<div class="two"><div class="card"><h4>Tachycardie posturale</h4><p>Vertiges, faiblesse, palpitations au lever ; déconditionnement, céphalées, « brouillard cérébral », dyspnée, troubles digestifs. Chez l’adolescent, les symptômes sont hétérogènes et le diagnostic est sous-estimé <a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.778.741" target="_blank" rel="noopener">Revue médicale suisse 2022, tachycardie posturale de l’adolescent (résumé)</a>.</p></div><div class="card"><h4>Dysautonomie familiale</h4><p>Perte sensitive profonde dès la naissance, variabilité tensionnelle excessive, dysphagie neurogène avec pneumopathies d’inhalation, crises autonomes hyperadrénergiques (hypertension, tachycardie, marbrures, vomissements), cécité progressive, ataxie proprioceptive, morts subites nocturnes <a href="https://doi.org/10.1007/s10286-023-00941-1" target="_blank" rel="noopener">Dysautonomie familiale (González-Duarte)</a>.</p></div></div>
<div class="key"><b>Forme typique et formes atypiques.</b> Le tableau typique est celui du sujet âgé qui chute sous plusieurs médicaments. Les formes atypiques sont l’hypertension de décubitus (symptômes absents ou trompeurs) et le Horner de l’enfant (masse maligne possible).</div>
<div class="trap"><span class="k">Erreur fréquente</span> Interroger seulement les symptômes d’hypotension. L’hypertension de décubitus neurogène se cache derrière la nycturie et les œdèmes : sans pression mesurée couché, on traite l’hypotension du jour et on peut aggraver l’hypertension de la nuit.</div>
</section>

<section class="ilot" id="g90-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général, signes vitaux, signes ciblés.</p>
<div class="two"><div class="card"><h4>Pression et pouls</h4><p>Le test de <button class="w" data-k="g90-stand">station debout active</button> se fait au sphygmomanomètre. Les brassards automatiques sont désavantagés, car la pression chute rapidement ; plus de 4 mesures par minute sont impossibles sans obstruction veineuse <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>. Mesurer couché au moins 5 minutes, puis debout jusqu’à 3 minutes. Noter simultanément la fréquence cardiaque : une accélération de 10 battements par minute ou moins évoque un défaut neurogène ; une accélération exagérée évoque l’anémie ou l’hypovolémie <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p></div><div class="card"><h4>Œil et face</h4><p>L’anisocorie est maximale dans l’obscurité : le myosis du côté atteint est plus net quand la pupille saine se dilate. Rechercher un ptosis léger, un ptosis inversé, un retard de dilatation et une anhidrose <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>. Noter la douleur cervicale ou céphalique associée.</p></div></div>
<div class="two"><div class="card"><h4>Membre douloureux</h4><p>Comparer les deux côtés : température, couleur, œdème, sudation, pilosité et ongles, force, amplitude, tremblement ou dystonie, hyperalgésie, allodynie. Compter les signes par catégorie : le diagnostic en exige dans au moins deux catégories (critères de Budapest) <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a>.</p></div><div class="card"><h4>Crise hypertensive d’un blessé médullaire</h4><p>Chercher d’abord le déclencheur : vessie palpable, transit, lésion cutanée ou escarre, vêtement serré, ongle incarné. Observer la sudation et la piloérection au-dessus de la lésion <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a>.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span> Mesurer la pression debout avec un brassard automatique ou à un moment non défini : la chute peut être manquée ou artificielle. Respecter le repos préalable et noter les temps de mesure.</div>
<p>Un <button class="w" data-k="g90-mnemo">repère mnémotechnique (aide pédagogique)</button> aide à retenir les seuils chiffrés de l’hypotension orthostatique et des critères de Budapest.</p>
<div class="key"><b>À retenir.</b> L’examen d’une atteinte autonome est une mesure (pression et pouls couché puis debout, pupilles dans l’obscurité, signes cutanés comparés). Il oriente vers la cause avant tout examen complémentaire.</div>
