<template id="ch-G37"><div class="chap"><div class="chap-head"><div class="code">G 37 · Neurologie · Substance blanche du système nerveux central</div><h1>Autres affections démyélinisantes du système nerveux central</h1><span class="status">Cycle 37 · Revue par intelligence artificielle · Aucune validation médicale humaine · Audit différé</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des affections démyélinisantes</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g37-0">Question clinique</a></li><li><a href="#g37-1">Définition et classification</a></li><li><a href="#g37-2">Fréquence et pronostic de population</a></li><li><a href="#g37-3">Physiopathologie</a></li><li><a href="#g37-4">Causes et facteurs de risque</a></li><li><a href="#g37-5">Anamnèse</a></li><li><a href="#g37-6">Examen clinique</a></li><li><a href="#g37-7">Démarche diagnostique</a></li><li><a href="#g37-8">Urgences et complications</a></li><li><a href="#g37-9">Prise en charge hiérarchisée</a></li><li><a href="#g37-10">Suivi, pronostic et prévention</a></li><li><a href="#g37-11">Situations particulières</a></li><li><a href="#g37-12">Critères officiels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g37-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, un homme de 45 ans, consommateur chronique d’alcool et dénutri, est hospitalisé avec une natrémie à 108 mmol/L. Une perfusion et l’arrêt d’un diurétique relèvent sa natrémie à 124 mmol/L en 24 heures, soit +16 mmol/L. Au quatrième jour, alors que son état neurologique s’était amélioré, il devient dysarthrique, dysphagique, puis tétraparétique. Ces valeurs sont pédagogiques ; elles illustrent le schéma classique de l’<button class="w" data-k="g37-ods">syndrome de démyélinisation osmotique</button>.</p>
<p>La catégorie G 37 de la classification CIM-10-GM 2024 (BfArM 2024) réunit des maladies de la substance blanche du système nerveux central qui n’appartiennent ni à la sclérose en plaques ni à la neuromyélite optique. Leur point commun est clinique : un déficit neurologique aigu ou subaigu, avec une lésion de substance blanche à l’imagerie. Leur point de divergence est le mécanisme, et donc le traitement. Le médecin cherche d’abord le <b>contexte</b> qui désigne une entité évitable ou traitable : correction d’une hyponatrémie, alcoolisme et dénutrition, infection ou vaccination récente, homme d’âge moyen avec une myélopathie ascendante (Lambeck 2019 ; Hillbom 2014 ; Brain 2006 ; ADEM adulte 2022).</p>
<p>À la fin de ce cours, le lecteur sait classer ces entités par mécanisme, reconnaître le contexte qui les révèle, choisir l’examen de référence pour chacune, appliquer les limites de correction de la natrémie, administrer la thiamine avant les glucides et décider de l’immunothérapie d’une myélite ou d’une <button class="w" data-k="g37-adem">encéphalomyélite aiguë disséminée</button>.</p>
<div class="key"><b>À retenir.</b> Un déficit neurologique avec lésion de substance blanche se lit avec son contexte. Le contexte oriente vers la cause avant que le nom de la maladie ne soit établi.</div>

</section>
<section class="ilot" id="g37-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>G 37 est une catégorie hétérogène : elle regroupe des démyélinisations du système nerveux central d’origine <b>inflammatoire</b>, <b>toxico-métabolique</b> et <b>vasculaire</b> (BfArM 2024 ; OFS 2024). Le tableau ci-dessous les classe par mécanisme. Il sert à retenir qu’un même mot, « démyélinisation », recouvre des processus qui n’ont ni le même traitement ni le même pronostic.</p>
<table class="t"><thead><tr><th>Mécanisme</th><th>Entité (CIM-10-GM 2024)</th><th>Contexte typique</th></tr></thead><tbody><tr><td>Toxico-métabolique</td><td><button class="w" data-k="g37-ods">Myélinolyse centropontine et démyélinisation osmotique</button> (G 37.2)</td><td>Correction trop rapide d’une hyponatrémie chronique (Lambeck 2019)</td></tr><tr><td>Toxico-métabolique</td><td><button class="w" data-k="g37-mbd">Maladie de Marchiafava-Bignami</button> (G 37.1)</td><td>Alcoolisme, dénutrition, carence en thiamine (Hillbom 2014)</td></tr><tr><td>Inflammatoire</td><td><button class="w" data-k="g37-schilder">Sclérose diffuse de Schilder</button> (G 37.0)</td><td>Enfant ou adulte jeune, grandes lésions bilatérales (Schilder 2019)</td></tr><tr><td>Inflammatoire</td><td><button class="w" data-k="g37-balo">Sclérose concentrique de Baló</button> (G 37.5)</td><td>Lésion en anneaux concentriques, souvent variante de sclérose en plaques (Hardy 2014)</td></tr><tr><td>Inflammatoire</td><td><button class="w" data-k="g37-atm">Myélite transverse aiguë</button> (G 37.3)</td><td>Atteinte médullaire focale, inflammatoire (TMCWG 2002)</td></tr><tr><td>Inflammatoire</td><td><button class="w" data-k="g37-adem">Encéphalomyélite aiguë disséminée</button> (G 37.8)</td><td>Souvent après une infection, avec encéphalopathie (ADEM adulte 2022)</td></tr><tr><td>Vasculaire</td><td><button class="w" data-k="g37-foix">Syndrome de Foix-Alajouanine</button> (G 37.4)</td><td>Fistule durale spinale, homme d’âge moyen (Brain 2006)</td></tr></tbody></table>
<p>Les sous-codes G 37.8 et G 37.9 complètent la liste. Le premier inclut l’encéphalomyélite aiguë disséminée dans la version 2024 de la classification allemande (BfArM 2024). Le second désigne une affection démyélinisante du système nerveux central sans précision ; le dossier de recherche ne contient aucune donnée propre à ce dernier.</p>
<h3>1.1 Frontières avec les catégories voisines</h3>
<p>Trois exclusions guident le codage et la réflexion. L’<button class="w" data-k="g37-ald">adrénoleucodystrophie</button> (E 71.3) n’appartient pas à la maladie de Schilder : c’est une maladie métabolique des acides gras à très longue chaîne qu’il faut exclure avant d’employer l’éponyme (BfArM 2024 ; Poser 1986). La sclérose en plaques (G 35) et la neuromyélite optique (G 36.0) sont exclues de la myélite transverse aiguë du G 37.3 (BfArM 2024). Enfin, l’encéphalite ou l’encéphalomyélite post-infectieuse sans précision relève d’un autre code (G 04.8) (BfArM 2024).</p>
<div class="trap"><span class="k">Piège</span> Un diagnostic de « myélite transverse » ne s’arrête pas à l’étiquette. Si l’on trouve des anticorps anti-aquaporine 4, la maladie est une neuromyélite optique, hors G 37 ; si l’on trouve des anticorps anti-MOG, c’est une <button class="w" data-k="g37-mogad">maladie associée aux anticorps anti-MOG</button> (NEMOS 2023 ; Banwell 2023).</div>
<h3>1.2 Définitions opératoires</h3>
<p>Le <b>syndrome de démyélinisation osmotique</b> réunit la myélinolyse centropontine et la myélinose extrapontine ; Adams et Victor l’ont décrit en 1959 (Lambeck 2019). La <b>maladie de Marchiafava-Bignami</b> est une démyélinisation avec nécrose du corps calleux, surtout chez l’alcoolique dénutri (Hillbom 2014). La <b>myélite transverse aiguë</b> est une affection inflammatoire focale de la moelle qui provoque un dysfonctionnement moteur, sensitif et autonome ; le groupe de travail de 2002 distingue la forme idiopathique de la forme secondaire à une maladie connue (TMCWG 2002). Une lésion de <button class="w" data-k="g37-letm">myélite longitudinalement étendue</button> couvre au moins trois segments vertébraux contigus (NEMOS 2023).</p>
<p>Le <b>syndrome de Foix-Alajouanine</b> est une myélopathie progressive liée à une malformation artério-veineuse spinale, le plus souvent une fistule durale (Foix-Alajouanine 2025). L’<b>encéphalomyélite aiguë disséminée</b> est un premier événement polyfocal, présumé inflammatoire et démyélinisant, avec encéphalopathie non expliquée par la fièvre, une maladie systémique ou un état post-critique, sans nouveau signe clinique ou d’imagerie après trois mois (Santoro 2019 ; IPMSSG 2013).</p>
</section>
<section class="ilot" id="g37-2"><h2><span class="n">2</span>Fréquence et pronostic de population</h2>
<p>Ces maladies sont rares ou concernent des populations ciblées. Aucune donnée épidémiologique suisse n’a été trouvée (<button class="w" data-k="g37-lacunes">limites des sources du chapitre</button>) ; les chiffres qui suivent viennent de séries internationales et ne s’appliquent pas telles quelles à la Suisse.</p>
<table class="t"><thead><tr><th>Entité</th><th>Données lues</th><th>Source</th></tr></thead><tbody><tr><td>Démyélinisation osmotique</td><td>0,4 à 0,56 % des admissions neurologiques en centre tertiaire ; 0,06 % des admissions médicales ; 2,5 % en soins intensifs ; 9,8 à 29 % après transplantation hépatique ; âge typique 30 à 50 ans ; hommes 51,8 à 77 %</td><td>Lambeck 2019</td></tr><tr><td>Maladie de Marchiafava-Bignami (153 cas confirmés par imagerie)</td><td>Âge moyen 48,4 ans ; hommes 80,4 % ; alcooliques 92,8 % ; dénutrition 39,8 % ; encéphalopathie de Wernicke associée 12,4 %</td><td>Hillbom 2014</td></tr><tr><td>Sclérose de Schilder</td><td>Âge médian de début 12 ans (2 à 69) ; rapport hommes/femmes 1 pour 1,13</td><td>Schilder 2019</td></tr><tr><td>Fistule durale spinale</td><td>5 à 10 par million et par an ; surtout hommes d’âge moyen</td><td>Khan 2021 ; Brain 2006</td></tr><tr><td>Foix-Alajouanine (cas publiés)</td><td>Âge moyen 55,1 ans ; 71,7 % d’hommes</td><td>Foix-Alajouanine 2025</td></tr><tr><td>Encéphalomyélite aiguë disséminée de l’adulte</td><td>Âge moyen 37,1 ans ; hommes 41,7 %</td><td>ADEM adulte 2022</td></tr></tbody></table>
<p>Ces séries ont des limites que le lecteur doit connaître : la plupart sont rétrospectives, issues de cas publiés ou d’un centre tertiaire, ce qui surestime la gravité et sous-estime la fréquence réelle. La <button class="w" data-k="g37-ods">démyélinisation osmotique</button> n’a pas d’incidence estimable dans les recommandations européennes (ESE-ESICM-ERBP 2014).</p>
<div class="key"><b>À retenir.</b> Le contexte démographique oriente : homme de 45 à 55 ans alcoolique (Marchiafava-Bignami), homme d’âge moyen avec myélopathie ascendante (fistule durale), adulte jeune après infection (encéphalomyélite aiguë disséminée), patient transplanté ou dénutri avec hyponatrémie (démyélinisation osmotique).</div>
<button class="pareto-btn ui" data-k="pareto-g37-definition">▲ Loi de Pareto — Définition, classification et fréquence</button>
</section>
<section class="ilot" id="g37-3"><h2><span class="n">3</span>Physiopathologie : du normal au pathologique</h2>
<p>Chaque entité suit une chaîne propre : un état normal, une perturbation, une manifestation clinique. Le médecin qui connaît cette chaîne comprend pourquoi le traitement agit sur la cause et non sur le nom de la maladie.</p>
<h3>3.1 Démyélinisation osmotique</h3>
<p><b>Normal.</b> Face à une hyponatrémie, le cerveau s’adapte en environ 48 heures en perdant des osmolytes, ce qui limite le gonflement des cellules ; ce délai explique le seuil de 48 heures entre hyponatrémie aiguë et chronique (ESE-ESICM-ERBP 2014). Les cellules perdent des <button class="w" data-k="g37-osmolytes">osmolytes</button> inorganiques (environ 30 % du potassium, 20 % du chlorure) et organiques, surtout le myo-inositol (Lambeck 2019).</p>
<p><b>Perturbation.</b> Si la natrémie remonte trop vite, la cellule ne resynthétise pas ses osmolytes assez vite : elle se rétracte et meurt. Les oligodendrocytes périssent surtout par apoptose ; la démyélinisation est non inflammatoire, les neurones et les axones sont relativement préservés, et des macrophages infiltrent la lésion (Lambeck 2019). Les zones riches en oligodendrocytes et en myéline sont les plus vulnérables : pont, cervelet, corps géniculé latéral, thalamus, capsules externe et extrême, striatum (Lambeck 2019).</p>
<p><b>Manifestation.</b> Les signes apparaissent avec retard, dans un intervalle de 1 à 14 jours après l’événement déclenchant (Lambeck 2019). Le risque n’existe que pour une hyponatrémie chronique (plus de 48 heures, ou baisse inférieure à 0,5 mmol/L par heure) qui a été corrigée trop vite (Lambeck 2019).</p>
<h3>3.2 Maladie de Marchiafava-Bignami</h3>
<p>Le mécanisme principal discuté est la carence en thiamine, liée à l’alcool et à la dénutrition, qui perturbe la synthèse de la myéline : la thiamine sanguine était basse chez 16 des 20 patients testés (Hillbom 2014). Le pyrophosphate de thiamine est coenzyme de la dégradation des glucides, du cycle de l’acide citrique et de la transcétolase ; le besoin dépend de l’apport glucidique, environ 0,4 mg pour 4 200 kilojoules (Benerva (Swissmedic)). D’où la règle : la <button class="w" data-k="g37-thiamine">thiamine précède les glucides</button> (EFNS 2010).</p>
<h3>3.3 Démyélinisations inflammatoires</h3>
<p>Dans la sclérose de Schilder, le liquide cérébro-spinal est souvent sans bandes oligoclonales (absentes dans au moins 77 % des ponctions ; 86 % si les acides gras à très longue chaîne sont normaux), alors que jusqu’à 98 % des patients atteints de sclérose en plaques en ont ; la maladie de Schilder et la sclérose en plaques sont probablement immunologiquement distinctes (Schilder 2019). Dans la sclérose de Baló, les anneaux alternent bandes démyélinisées et bandes de myéline relativement préservée, avec une perte axonale minime (Baló 2021). Dans la <button class="w" data-k="g37-mogad">maladie associée aux anticorps anti-MOG</button>, la présence des anticorps est le critère central ; ses phénotypes typiques sont l’encéphalomyélite aiguë disséminée, la névrite optique et la myélite transverse (Banwell 2023).</p>
<h3>3.4 Syndrome de Foix-Alajouanine</h3>
<p>Une fistule entre une artère et une veine radiculaires, dans la gaine durale, impose une hypertension veineuse à la moelle ; la congestion entraîne ensuite une ischémie (Brain 2006). D’où un tableau progressif plutôt que brutal. La <button class="w" data-k="g37-foix">fistule durale</button> est donc un mécanisme vasculaire, et son traitement est un traitement de la fistule.</p>
<figure><svg viewBox="0 0 640 150" role="img" aria-label="Figure 1 — Chaîne de la démyélinisation osmotique"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="40" width="130" height="60" rx="6"/><rect x="170" y="40" width="130" height="60" rx="6"/><rect x="332" y="40" width="130" height="60" rx="6"/><rect x="494" y="40" width="130" height="60" rx="6"/><path d="M138 70h32M300 70h32M462 70h32"/></g><g fill="currentColor" font-size="13" text-anchor="middle"><text x="73" y="66">Hyponatrémie</text><text x="73" y="84">chronique</text><text x="235" y="66">Osmolytes</text><text x="235" y="84">perdus</text><text x="397" y="66">Correction</text><text x="397" y="84">trop rapide</text><text x="559" y="62">Oligodendrocytes</text><text x="559" y="80">et myéline</text><text x="559" y="94">détruits</text></g></svg><figcaption>Figure 1 — Chaîne simplifiée de la démyélinisation osmotique, d’après Lambeck 2019. Les signes apparaissent 1 à 14 jours après la correction. Schéma didactique, non calibré.</figcaption></figure>
<div class="key"><b>À retenir.</b> Le même terme « démyélinisation » recouvre trois mécanismes : osmotique (non inflammatoire), carentiel (thiamine) et immunologique. Le traitement vise la cause : prévention de la correction rapide, thiamine, immunothérapie, fermeture de la fistule.</div>
</section>
<section class="ilot" id="g37-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les facteurs de risque se lisent avec le mécanisme. Pour la démyélinisation osmotique, les recommandations européennes citent l’alcoolisme, l’hépatopathie, les thiazides, les antidépresseurs, la profondeur et la durée de l’hyponatrémie (ESE-ESICM-ERBP 2014). D’autres sources ajoutent l’hypokaliémie, la dénutrition et une natrémie inférieure ou égale à 105 mmol/L (Beck 2025) ; l’hypokaliémie doit être corrigée d’abord (Lambeck 2019). Dans la série publiée depuis 1997, la natrémie initiale était inférieure à 120 mmol/L dans 96 % des 54 cas, et la hausse atteignait au moins 12 mmol/L en 24 heures dans 87 % (ESE-ESICM-ERBP 2014).</p>
<table class="t"><thead><tr><th>Entité</th><th>Facteurs de risque ou déclencheurs</th><th>Mécanisme de lien</th></tr></thead><tbody><tr><td>Démyélinisation osmotique</td><td>Hyponatrémie chronique, correction rapide, alcoolisme, hépatopathie, transplantation hépatique, thiazides, antidépresseurs, hypokaliémie, dénutrition (Lambeck 2019 ; ESE-ESICM-ERBP 2014 ; Beck 2025)</td><td>Perte d’osmolytes puis resynthèse trop lente</td></tr><tr><td>Marchiafava-Bignami</td><td>Alcool (92,8 %), dénutrition ; chirurgie bariatrique chez des non-alcooliques (Hillbom 2014 ; EFNS 2010)</td><td>Carence en thiamine</td></tr><tr><td>Encéphalomyélite aiguë disséminée</td><td>Infection préalable (environ 50 %, voies respiratoires hautes 25,7 %, gastro-entérite 8,7 %) ; vaccination (2,9 %) ; délai moyen 12,5 jours (ADEM adulte 2022)</td><td>Réaction immunitaire post-infectieuse</td></tr><tr><td>Myélite transverse aiguë</td><td>Infection avant environ 30 % des poussées avec anticorps anti-aquaporine 4 (NEMOS 2023)</td><td>Inflammation médullaire</td></tr><tr><td>Foix-Alajouanine</td><td>Homme d’âge moyen, fistule durale radiculaire (Brain 2006)</td><td>Congestion veineuse puis ischémie</td></tr></tbody></table>
<div class="trap"><span class="k">Piège</span> Une explication séduisante, comme une infection récente, ne dispense pas du bilan. Une myélite après infection peut cacher une neuromyélite optique ou une maladie associée aux anticorps anti-MOG, dont la prise en charge diffère (NEMOS 2023).</div>

</section>
<section class="ilot" id="g37-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire reconstruit une chronologie : quand l’événement déclenchant a-t-il eu lieu, et quand les signes neurologiques ont-ils commencé ? La question clé de la démyélinisation osmotique est la suivante : le patient s’est-il amélioré, puis détérioré après la correction de la natrémie ? Cette évolution <b>biphasique</b> est typique (Lambeck 2019).</p>
<h3>5.1 Antécédents à rechercher</h3>
<p>Le médecin interroge l’alcool et l’état nutritionnel, la cause de l’hyponatrémie (thiazides, antidépresseurs, hépatopathie), une transplantation ou une chirurgie bariatrique, une infection ou une vaccination récentes, des épisodes neurologiques antérieurs et, pour la fistule durale, l’évolution lente d’une faiblesse des jambes (Lambeck 2019 ; Hillbom 2014 ; Brain 2006 ; ADEM adulte 2022).</p>
<h3>5.2 Symptômes par entité</h3>
<div class="two"><div class="card"><h4>Démyélinisation osmotique</h4><p>Évolution biphasique : amélioration, puis détérioration 1 à 14 jours après le facteur déclenchant. Dysarthrie et dysphagie (3,2 à 11,5 %), tétraparésie (9,8 à 28,8 %), troubles oculomoteurs ou pupillaires (environ 8 %), troubles graves de la conscience (6,1 à 14 %), syndrome <button class="w" data-k="g37-locked">d’enfermement</button> dans les formes sévères (Lambeck 2019).</p></div><div class="card"><h4>Extrapontine</h4><p>Mouvements anormaux (60 % d’une petite série) : parkinsonisme, puis choréo-athétose ou dystonie ; ataxie (8 à 14 %) ; crises (12 à 24 %). Atteinte cognitive et psychiatrique : dysfonction frontale, dépression ou manie, catatonie, mutisme (Lambeck 2019).</p></div><div class="card"><h4>Marchiafava-Bignami</h4><p>Altération de l’état mental (80,4 %), trouble de la marche (68,0 %), perte de conscience (52,3 %), dysarthrie (40,5 %), troubles mnésiques (38,6 %), signes de <button class="w" data-k="g37-disconnexion">disconnexion interhémisphérique</button> (35,9 %), signes pyramidaux (24,2 %), crises (20,9 %) (Hillbom 2014).</p></div><div class="card"><h4>Myélite transverse aiguë</h4><p>Faiblesse bilatérale des membres et niveau sensitif net ; troubles sphinctériens, sexuels et douleur ; atteinte de la motricité respiratoire à rechercher (NEMOS 2023 ; TMCWG 2002 ; Wang 2019).</p></div></div>
<div class="two"><div class="card"><h4>Foix-Alajouanine</h4><p>Faiblesse des membres inférieurs (84,8 %), troubles vésicaux (69,6 %), déficit sensitif (65,2 %), trouble de la marche (65,2 %). Au début, le tableau imite une polyradiculopathie ou une atteinte de la corne antérieure (Brain 2006 ; Foix-Alajouanine 2025).</p></div><div class="card"><h4>Encéphalomyélite aiguë disséminée</h4><p>Atteinte polyfocale (80,5 %), signes pyramidaux (68,7 %), déficit moteur (63,4 %), tronc cérébral (46,7 %), encéphalopathie (43,7 %), céphalées (38,2 %), fièvre (34,6 %), crises (13,6 %), névrite optique (11,7 %) (ADEM adulte 2022).</p></div><div class="card"><h4>Sclérose de Schilder</h4><p>Évolution souvent monophasique (26 patients avec une poussée, 24 avec deux ou plus, 11 progressifs). Cas index de 1912 : évolution fulminante en cinq mois avec cécité, hémiplégie spastique, troubles psychiques et hypertension intracrânienne (Schilder 2019).</p></div><div class="card"><h4>Sclérose de Baló</h4><p>Détérioration neurologique aiguë ou subaiguë ; l’évolution est variable à l’ère de l’imagerie, souvent bénigne et autolimitée, avec des formes agressives possibles (Hardy 2014 ; Amini Harandi 2018).</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span> Le syndrome de disconnexion de la maladie de Marchiafava-Bignami peut passer inaperçu sans testing neuropsychologique (Hillbom 2014). Chercher l’alcool et la nutrition sans tester la disconnexion laisse le diagnostic reposer sur la seule imagerie.</div>
</section>
<section class="ilot" id="g37-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit un ordre fixe : état général et vigilance, signes vitaux, puis examen neurologique ciblé par topographie. Il recherche d’abord ce qui menace la vie : trouble de la vigilance, trouble de déglutition, atteinte respiratoire.</p>
<div class="two"><div class="card"><h4>État général et vitaux</h4><p>Vigilance, orientation, nutrition (indice de dénutrition), signes d’hépatopathie ou d’intoxication alcoolique. Les constantes évaluent l’état hémodynamique et la fièvre, qui oriente vers une infection ou une encéphalomyélite aiguë disséminée (fièvre 34,6 %) (ADEM adulte 2022).</p></div><div class="card"><h4>Tronc cérébral</h4><p>Dysarthrie, dysphagie, troubles oculomoteurs et pupillaires, tétraparésie et, dans les formes sévères, <button class="w" data-k="g37-locked">syndrome d’enfermement</button> : le patient est éveillé, mais ne peut bouger que les yeux (Lambeck 2019).</p></div></div>
<div class="two"><div class="card"><h4>Cognition et comportement</h4><p>Dysfonction frontale, troubles de concentration, syndromes dépressifs ou maniaques, catatonie, mutisme. Un test neuropsychologique est utile quand la disconnexion est suspectée (Lambeck 2019 ; Hillbom 2014).</p></div><div class="card"><h4>Moelle</h4><p>Niveau sensitif, force proximale et distale, signes pyramidaux, sphincters. La motricité respiratoire et la fonction sexuelle sont examinées (NEMOS 2023). Chez un homme d’âge moyen, une faiblesse ascendante des jambes évoque une fistule durale (Brain 2006).</p></div></div>
<p><b>Signes qui s’opposent à la démyélinisation osmotique</b> : début pendant la phase de déséquilibre (et non après la correction), signes corticaux, signes latéralisés (Lambeck 2019).</p>
<div class="trap"><span class="k">Piège</span> Un tableau d’atteinte du motoneurone ou une polyradiculopathie au début peut cacher une fistule durale ; l’atteinte du motoneurone central et des segments sacrés vient plus tard (Brain 2006).</div>
