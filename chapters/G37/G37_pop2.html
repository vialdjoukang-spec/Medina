<template data-pop="g37-wernicke" data-title="Encéphalopathie de Wernicke">
<div class="lab">Lien</div><p>Associée à la maladie de Marchiafava-Bignami dans 12,4 % des cas (Hillbom 2014).</p>
<div class="lab">Conduite</div><p>Thiamine avant tout glucide ; thiamine parentérale à tout sujet à risque admis aux urgences (EFNS 2010).</p>
<p class="src">Références : <a href="https://doi.org/10.1136/jnnp-2013-305979" target="_blank" rel="noopener">Hillbom 2014</a> ; <a href="https://doi.org/10.1111/j.1468-1331.2010.03153.x" target="_blank" rel="noopener">EFNS 2010</a></p></template>
<template data-pop="g37-thiamine" data-title="Thiamine avant les glucides">
<div class="lab">Mécanisme</div><p>Le pyrophosphate de thiamine est coenzyme du métabolisme glucidique ; un apport de glucose accroît le besoin (Benerva (Swissmedic)).</p>
<div class="lab">Conduite</div><p>Thiamine parentérale avant tout glucide ; sécurité très bonne (niveau B) (EFNS 2010).</p>
<div class="lab">Aide pédagogique</div><p>Mnémonique : « thiamine d’abord, sucre ensuite » — aide pédagogique, non critère officiel.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03153.x" target="_blank" rel="noopener">EFNS 2010</a> ; <a href="https://amiko.oddb.org (GTIN 7680256360580)" target="_blank" rel="noopener">Benerva (Swissmedic)</a></p></template>
<template data-pop="g37-ecart-thiamine" data-title="Écart de dose de la thiamine">
<div class="lab">Constat</div><p>Benerva : jusqu’à 200 mg/jour par voie parentérale dans la carence sévère ou l’encéphalopathie de Wernicke (Benerva (Swissmedic)). EFNS : 200 mg trois fois par jour, de préférence par voie intraveineuse (niveau C) (EFNS 2010).</p>
<div class="lab">Arbitrage</div><p>L’information professionnelle suisse régit le produit commercialisé en Suisse ; la recommandation européenne est ancienne (2010) et lue en résumé. Le prescripteur documente la dose retenue et son motif ; la présente leçon ne tranche pas.</p>
<div class="lab">Limite</div><p>Aucune source suisse de rang supérieur n’a été trouvée.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03153.x" target="_blank" rel="noopener">EFNS 2010</a> ; <a href="https://amiko.oddb.org (GTIN 7680256360580)" target="_blank" rel="noopener">Benerva (Swissmedic)</a></p></template>
<template data-pop="g37-tpp" data-title="Pyrophosphate de thiamine">
<div class="lab">Rôle</div><p>Coenzyme de la dégradation des glucides, du cycle de l’acide citrique et de la transcétolase (Benerva (Swissmedic)).</p>
<div class="lab">Conséquence</div><p>Besoin d’environ 0,4 mg pour 4 200 kilojoules (Benerva (Swissmedic)).</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680256360580)" target="_blank" rel="noopener">Benerva (Swissmedic)</a></p></template>
<template data-pop="g37-pont" data-title="Pont">
<div class="lab">Rôle clinique</div><p>Zone préférentielle de la myélinolyse centropontine ; sa lésion explique tétraparésie, dysarthrie, dysphagie et enfermement (Lambeck 2019).</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0600" target="_blank" rel="noopener">Lambeck 2019</a></p></template>
<template data-pop="g37-corps-calleux" data-title="Corps calleux">
<div class="lab">Atteinte</div><p>Splénium, corps et genou touchés dans la maladie de Marchiafava-Bignami (Hillbom 2014).</p>
<div class="lab">Conséquence</div><p>Disconnexion interhémisphérique.</p>
<p class="src">Références : <a href="https://doi.org/10.1136/jnnp-2013-305979" target="_blank" rel="noopener">Hillbom 2014</a></p></template>
<template data-pop="g37-centre-semi-ovale" data-title="Centre semi-ovale">
<div class="lab">Atteinte</div><p>Siège des grandes lésions bilatérales de la sclérose de Schilder (Schilder 2019).</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s12974-019-1425-4" target="_blank" rel="noopener">Schilder 2019</a></p></template>
<template data-pop="g37-fibres-u" data-title="Fibres en U">
<div class="lab">Atteinte</div><p>Épargnées dans la sclérose de Baló (Baló 2021).</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jns.2021.117570" target="_blank" rel="noopener">Baló 2021</a></p></template>
<template data-pop="g37-segments" data-title="Segments vertébraux">
<div class="lab">Définition</div><p>Unité de mesure de la longueur d’une lésion médullaire à l’IRM ; au moins 3 pour une lésion longitudinalement étendue (NEMOS 2023).</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00415-023-11634-0" target="_blank" rel="noopener">NEMOS 2023</a></p></template>
<template data-pop="g37-veines-radiculaires" data-title="Veines radiculaires et fistule">
<div class="lab">Mécanisme</div><p>Une communication artérioveineuse dans la gaine durale transmet une pression artérielle à des veines qui n’y sont pas adaptées ; la congestion précède l’ischémie (Brain 2006).</p>
<p class="src">Références : <a href="https://doi.org/10.1093/brain/awl220" target="_blank" rel="noopener">Brain 2006</a></p></template>
<template data-pop="g37-oligodendrocyte" data-title="Oligodendrocyte">
<div class="lab">Rôle</div><p>Cellule dont la perte, surtout par apoptose, caractérise la démyélinisation osmotique (Lambeck 2019).</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0600" target="_blank" rel="noopener">Lambeck 2019</a></p></template>
<template data-pop="g37-apoptose" data-title="Apoptose">
<div class="lab">Rôle</div><p>Mort cellulaire programmée ; mécanisme principal de la perte des oligodendrocytes dans la démyélinisation osmotique, sans inflammation (Lambeck 2019).</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0600" target="_blank" rel="noopener">Lambeck 2019</a></p></template>
<template data-pop="g37-nacl3" data-title="Chlorure de sodium à 3 % (monographie)">
<div class="lab">Mécanisme</div><p>Soluté hypertonique qui élève la natrémie et réduit le gonflement cérébral dans l’hyponatrémie sévèrement symptomatique (ESE-ESICM-ERBP 2014).</p>
<div class="lab">Preuves</div><p>Recommandation ESE-ESICM-ERBP 2014 : 150 mL IV en 20 min (1D), contrôle à 20 min, répétition jusqu’à +5 mmol/L (2D) (ESE-ESICM-ERBP 2014).</p>
<div class="lab">Posologie</div><p>Après +5 mmol/L avec amélioration, arrêter le soluté hypertonique ; limiter la hausse à 10 mmol/L les premières 24 heures, puis 8 mmol/L par 24 heures (ESE-ESICM-ERBP 2014).</p>
<div class="lab">Effets indésirables et surveillance</div><p>Risque de surcorrection et de démyélinisation osmotique ; contrôles à 20 minutes, 6 heures, 12 heures, puis quotidiens (ESE-ESICM-ERBP 2014).</p>
<div class="lab">Limite</div><p>L’information professionnelle suisse du produit n’a pas été lue : la posologie ci-dessus est celle de la recommandation, pas d’une fiche suisse.</p>
<p class="src">Références : <a href="https://academic.oup.com/ejendo/article/170/3/G1/6668028" target="_blank" rel="noopener">ESE-ESICM-ERBP 2014</a></p></template>
<template data-pop="g37-eau-desmo" data-title="Eau sans électrolytes et desmopressine">
<div class="lab">Indication</div><p>Surcorrection : natrémie en hausse de plus de 10 mmol/L en 24 heures, ou de plus de 8 mmol/L sur une période ultérieure de 24 heures (ESE-ESICM-ERBP 2014).</p>
<div class="lab">Posologie</div><p>Arrêter le traitement actif ; avis expert pour 10 mL/kg d’eau sans électrolytes (par exemple du glucose) en 1 heure avec surveillance de la diurèse, et pour 2 µg de desmopressine IV, pas plus souvent que toutes les 8 heures (1D) (ESE-ESICM-ERBP 2014).</p>
<div class="lab">Limite</div><p>Avis d’expert : l’information professionnelle suisse de la desmopressine injectable (Minirin) n’a pas été lue.</p>
<p class="src">Références : <a href="https://academic.oup.com/ejendo/article/170/3/G1/6668028" target="_blank" rel="noopener">ESE-ESICM-ERBP 2014</a></p></template>
<template data-pop="g37-benerva" data-title="Thiamine — Benerva (monographie suisse)">
<div class="lab">Mécanisme</div><p>Vitamine hydrosoluble, précurseur du pyrophosphate de thiamine (Benerva (Swissmedic)).</p>
<div class="lab">Indication et posologie</div><p>Ampoules de 100 mg/mL ; carence sévère ou encéphalopathie de Wernicke : voie parentérale (intramusculaire ou intraveineuse lente) jusqu’à 200 mg/jour, puis relais oral (Benerva (Swissmedic)).</p>
<div class="lab">Effets indésirables</div><p>Réactions anaphylactoïdes ; voie intraveineuse réservée aux patients hospitalisés (Benerva (Swissmedic)).</p>
<div class="lab">Grossesse</div><p>Possible aux besoins quotidiens ; ne pas utiliser à forte dose sauf nécessité absolue (Benerva (Swissmedic)).</p>
<div class="lab">Contentieux</div><p>Voir l’<button class="w" data-k="g37-ecart-thiamine">écart entre cette dose et la recommandation européenne</button>.</p>
<div class="lab">Surveillance</div><p>Thiamine totale du sang prélevée avant administration (EFNS 2010).</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03153.x" target="_blank" rel="noopener">EFNS 2010</a> ; <a href="https://amiko.oddb.org (GTIN 7680256360580)" target="_blank" rel="noopener">Benerva (Swissmedic)</a></p></template>
<template data-pop="g37-mp" data-title="Méthylprednisolone — Solu-Medrol (monographie suisse)">
<div class="lab">Mécanisme</div><p>Corticoïde à action anti-inflammatoire ; réduit la durée des poussées de sclérose en plaques, sans effet sur les rechutes ni la progression (Solu-Medrol (Swissmedic)).</p>
<div class="lab">Indication suisse</div><p>Poussées aiguës de sclérose en plaques ; son usage dans la myélite ou l’encéphalomyélite aiguë disséminée est hors information professionnelle et repose sur la pratique et les recommandations (NEMOS 2024 ; ADEM adulte 2022 ; Solu-Medrol (Swissmedic)).</p>
<div class="lab">Posologie</div><p>500 à 1 000 mg/jour par voie IV en 30 minutes pendant 3 à 5 jours, le matin (Solu-Medrol (Swissmedic)).</p>
<div class="lab">Effets indésirables</div><p>Arythmies, collapsus ou arrêt cardiaque si plus de 0,5 g en moins de 10 minutes ; bradycardies ; hépatite aiguë à 1 g/jour ou plus, parfois fatale ; 1 g contient 116,8 mg de sodium (Solu-Medrol (Swissmedic)).</p>
<div class="lab">Surveillance</div><p>Protection gastrique, prophylaxie thrombotique, pression artérielle, glycémie, électrolytes (Solu-Medrol (Swissmedic)).</p>
<div class="lab">Preuves</div><p>Aucune étude randomisée dans l’encéphalomyélite aiguë disséminée de l’adulte ; corticoïdes chez 95,2 % des patients (ADEM adulte 2022).</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00415-023-11910-z" target="_blank" rel="noopener">NEMOS 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9218070/" target="_blank" rel="noopener">ADEM adulte 2022</a> ; <a href="https://amiko.oddb.org (GTIN 7680351120812)" target="_blank" rel="noopener">Solu-Medrol (Swissmedic)</a></p></template>
<template data-pop="g37-aph" data-title="Échanges plasmatiques et immunoadsorption">
<div class="lab">Mécanisme</div><p>Épuration des anticorps et des médiateurs de la circulation (NEMOS 2024).</p>
<div class="lab">Preuves</div><p>Débutée au jour 0 à 2, jusqu’à 40 % de rémission complète, contre 3,7 % à partir du jour 7 (poussées de neuromyélite optique) (NEMOS 2024). Transposition à la myélite du G 37.3 : extrapolation.</p>
<div class="lab">Posologie</div><p>En moyenne 5 séances quotidiennes ou un jour sur deux, jusqu’à 10 (NEMOS 2024).</p>
<div class="lab">Décision</div><p>Possible en première ligne dans une myélite sévère, et en association avec les corticoïdes dans les poussées sévères (NEMOS 2024).</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00415-023-11910-z" target="_blank" rel="noopener">NEMOS 2024</a></p></template>
<template data-pop="g37-balo-ttt" data-title="Traitements de la sclérose de Baló">
<div class="lab">Formes agressives</div><p>Immunosuppression intense (Amini Harandi 2018).</p>
<div class="lab">Traitement de fond</div><p>Si les critères de sclérose en plaques sont remplis, un traitement de fond de cette maladie est raisonnable (opinion) (Hardy 2014). Fingolimod probablement à éviter ; natalizumab et rituximab potentiellement efficaces ; alemtuzumab possiblement inefficace (Baló 2021).</p>
<div class="lab">Limite</div><p>Sources lues en résumé seulement ; niveau de preuve faible.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(14)70052-3" target="_blank" rel="noopener">Hardy 2014</a> ; <a href="https://doi.org/10.1016/j.jns.2021.117570" target="_blank" rel="noopener">Baló 2021</a> ; <a href="https://doi.org/10.1515/revneuro-2017-0096" target="_blank" rel="noopener">Amini Harandi 2018</a></p></template>
<template data-pop="g37-lacunes" data-title="Limites des sources de ce chapitre">
<div class="lab">Sources suisses</div><p>Aucune source suisse propre à G 37 n’a été lue ; la recherche web générale a été épuisée. Une revue d’une auteure de Bâle n’a été lue qu’en résumé (Beck 2025).</p>
<div class="lab">Textes inaccessibles</div><p>La directive allemande DGN/AWMF 030-050 et le texte intégral du consortium de 2002 sur la myélite ne sont pas accessibles ; les critères de 2002 ne sont pas sourcés en entier.</p>
<div class="lab">Informations professionnelles non lues</div><p>NaCl à 3 %, desmopressine injectable, immunoglobulines intraveineuses et dexaméthasone.</p>
<div class="lab">Sources américaines</div><p>Utilisées à titre descriptif, jamais comme fondement d’une conduite (TMCWG 2002 ; Wang 2019 ; Santoro 2019).</p>
<div class="lab">Statut</div><p>Audit différé — revue IA, distincte d’une validation médicale humaine.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.beem.2025.102067" target="_blank" rel="noopener">Beck 2025</a> ; <a href="https://doi.org/10.1212/wnl.59.4.499" target="_blank" rel="noopener">TMCWG 2002</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6560417/" target="_blank" rel="noopener">Wang 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7117081/" target="_blank" rel="noopener">Santoro 2019</a></p></template>
<template data-pop="pareto-g37-definition" data-title="Pareto — Définition, classification et fréquence">
<p class="ratio" data-cover="g37-0,g37-1,g37-2"></p><ul><li>G 37 réunit des démyélinisations inflammatoires, toxico-métaboliques et vasculaires.</li><li>Le contexte oriente : correction de natrémie, alcool, infection, homme d’âge moyen.</li><li>Les données épidémiologiques sont internationales ; aucune donnée suisse n’a été trouvée.</li></ul></template>
<template data-pop="pareto-g37-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="g37-3,g37-4"></p><ul><li>Osmotique : perte d’osmolytes puis correction trop rapide.</li><li>Carentiel : thiamine.</li><li>Inflammatoire : anticorps et lésions de substance blanche.</li><li>Vasculaire : congestion puis ischémie.</li></ul></template>
<template data-pop="pareto-g37-clinique" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="g37-5,g37-6"></p><ul><li>Évolution biphasique dans la démyélinisation osmotique.</li><li>Disconnexion à tester dans Marchiafava-Bignami.</li><li>Niveau sensitif et sphincters dans la myélite.</li><li>Faiblesse ascendante chez l’homme d’âge moyen : fistule durale.</li></ul></template>
<template data-pop="pareto-g37-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g37-7"></p><ul><li>Orienter par le contexte.</li><li>L’imagerie ouvre la démarche ; les anticorps et l’angiographie précisent.</li><li>Exclure infection, Wernicke, compression.</li></ul></template>
<template data-pop="pareto-g37-urgences" data-title="Pareto — Urgences et prise en charge">
<p class="ratio" data-cover="g37-8,g37-9"></p><ul><li>Respecter 10 puis 8 mmol/L par 24 heures.</li><li>Thiamine avant glucides.</li><li>Corticoïdes et aphérèse précoce dans les myélites inflammatoires.</li><li>Fistule durale : angiographie puis traitement de la fistule.</li></ul></template>
<template data-pop="pareto-g37-suivi" data-title="Pareto — Suivi, pronostic et situations particulières">
<p class="ratio" data-cover="g37-10,g37-11"></p><ul><li>Pronostic variable selon l’entité.</li><li>Suivi neuropsychologique et IRM dans Marchiafava-Bignami.</li><li>Thiamine suivie 6 mois après chirurgie bariatrique.</li></ul></template>
<template data-pop="pareto-g37-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g37-e-1,g37-e-2,g37-e-3,g37-e-4,g37-e-5,g37-e-6,g37-e-7"></p><ul><li>IRM d’abord ; répéter si normale précoce.</li><li>Anticorps sur cellules avant traitement.</li><li>Angiographie médullaire pour la fistule.</li><li>Ponction lombaire devant une encéphalopathie.</li></ul></template>
<template data-pop="pareto-g37-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g37-s-anat-cours"></p><ul><li>Pont : enfermement et tétraparésie.</li><li>Corps calleux : disconnexion.</li><li>Moelle : niveau sensitif.</li></ul></template>
<template data-pop="pareto-g37-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g37-s-histo-cours"></p><ul><li>Apoptose des oligodendrocytes sans inflammation dans l’osmotique.</li><li>Anneaux alternés dans Baló.</li></ul></template>
<template data-pop="pareto-g37-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g37-s-physio-cours"></p><ul><li>Adaptation en 48 heures.</li><li>La vitesse de correction décide du risque.</li></ul></template>
<template data-pop="pareto-g37-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g37-s-bioch-cours"></p><ul><li>Thiamine avant glucides.</li><li>Acides gras à très longue chaîne pour exclure l’adrénoleucodystrophie.</li></ul></template>
<template data-pop="pareto-g37-immuno" data-title="Pareto — Immunologie">
<p class="ratio" data-cover="g37-s-immuno-cours"></p><ul><li>Anticorps anti-aquaporine 4 et anti-MOG redéfinissent la maladie.</li><li>Absence de bandes oligoclonales oriente vers Schilder.</li></ul></template>
<template data-pop="pareto-g37-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g37-p-1,g37-p-2,g37-p-3"></p><ul><li>Chaque produit a un périmètre ; aucune indication suisse propre à G 37.</li><li>Divergence de dose de thiamine à documenter.</li><li>Éviter la surcorrection, le glucose avant thiamine et la biopsie médullaire précoce.</li></ul></template>
