<template data-pop="g37-ods" data-title="Syndrome de démyélinisation osmotique">
<div class="lab">Définition</div><p>Le syndrome réunit la myélinolyse centropontine et la myélinose extrapontine. Adams et Victor l’ont décrit en 1959. La lésion est une démyélinisation non inflammatoire, avec neurones et axones relativement préservés (Lambeck 2019).</p>
<div class="lab">Mécanisme</div><p>Après une hyponatrémie chronique, le cerveau a perdu des osmolytes. Si la natrémie remonte trop vite, la cellule se rétracte ; les oligodendrocytes meurent surtout par apoptose (Lambeck 2019).</p>
<div class="lab">Reconnaissance</div><p>Évolution biphasique : une amélioration initiale, puis une détérioration 1 à 14 jours après le facteur déclenchant. Topographie : pont, cervelet, corps géniculé latéral, thalamus, capsules, striatum (Lambeck 2019).</p>
<div class="lab">Décision</div><p>Le traitement est préventif : respecter les limites de correction. Aucun traitement fondé sur des preuves n’existe une fois la maladie déclarée (Lambeck 2019 ; ESE-ESICM-ERBP 2014).</p>
<div class="lab">Limite</div><p>Les données sont des revues et des séries de cas ; l’incidence n’est pas estimable (ESE-ESICM-ERBP 2014).</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0600" target="_blank" rel="noopener">Lambeck 2019</a> ; <a href="https://academic.oup.com/ejendo/article/170/3/G1/6668028" target="_blank" rel="noopener">ESE-ESICM-ERBP 2014</a></p></template>
<template data-pop="g37-osmolytes" data-title="Osmolytes et adaptation cérébrale">
<div class="lab">Définition</div><p>Les osmolytes sont des solutés que la cellule retient ou libère pour ajuster son volume. Inorganiques : environ 30 % du potassium et 20 % du chlorure ; organiques : surtout le myo-inositol (Lambeck 2019).</p>
<div class="lab">Mécanisme</div><p>L’adaptation à l’hyponatrémie dure environ 48 heures ; d’où la distinction entre hyponatrémie aiguë et chronique (ESE-ESICM-ERBP 2014). La resynthèse est plus lente que la perte.</p>
<div class="lab">Conséquence</div><p>Une natrémie qui remonte trop vite laisse la cellule sans osmolytes dans un milieu hypertonique : elle se rétracte (Lambeck 2019).</p>
<div class="lab">Limite</div><p>Les mécanismes cellulaires précis restent discutés ; la synthèse repose sur une revue non systématique (Lambeck 2019).</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0600" target="_blank" rel="noopener">Lambeck 2019</a> ; <a href="https://academic.oup.com/ejendo/article/170/3/G1/6668028" target="_blank" rel="noopener">ESE-ESICM-ERBP 2014</a></p></template>
<template data-pop="g37-correction" data-title="Limites de correction de la natrémie">
<div class="lab">Recommandation européenne</div><p>Hausse limitée à 10 mmol/L pendant les 24 premières heures, puis 8 mmol/L par 24 heures jusqu’à 130 mmol/L (grade 1D). Chez le patient à haut risque, une limite de 8 mmol/L par 24 heures est retenue (ESE-ESICM-ERBP 2014 ; Beck 2025).</p>
<div class="lab">Surcorrection</div><p>Au-delà de 10 mmol/L en 24 heures (ou 8 mmol/L sur une période ultérieure de 24 heures), arrêter le traitement actif, puis demander un avis expert pour 10 mL/kg d’eau sans électrolytes en 1 heure et pour 2 µg de desmopressine IV, pas plus souvent que toutes les 8 heures (1D) (ESE-ESICM-ERBP 2014).</p>
<div class="lab">Arbitrage de source</div><p>La recommandation de 2014 est la plus ancienne des deux sources lues ; la revue bâloise de 2025 n’a été lue qu’en résumé et ne modifie pas ces limites. En cas de divergence, la source primaire applicable la plus récente prévaut, et le texte de 2014 reste accessible comme référence historique (ESE-ESICM-ERBP 2014 ; Beck 2025).</p>
<div class="lab">Limite</div><p>Les recommandations sont de niveau 1D et 2D : preuves faibles. Les fiches suisses du NaCl à 3 % et de la desmopressine n’ont pas été lues.</p>
<p class="src">Références : <a href="https://academic.oup.com/ejendo/article/170/3/G1/6668028" target="_blank" rel="noopener">ESE-ESICM-ERBP 2014</a> ; <a href="https://doi.org/10.1016/j.beem.2025.102067" target="_blank" rel="noopener">Beck 2025</a></p></template>
<template data-pop="g37-mbd" data-title="Maladie de Marchiafava-Bignami">
<div class="lab">Définition</div><p>Démyélinisation et nécrose du corps calleux, surtout chez l’alcoolique dénutri. 153 cas confirmés par imagerie : âge moyen 48,4 ans, hommes 80,4 % (Hillbom 2014).</p>
<div class="lab">Mécanisme</div><p>La carence en thiamine, liée à l’alcool et à la dénutrition, est le mécanisme principal discuté ; la thiamine sanguine était basse chez 16 des 20 patients testés (Hillbom 2014).</p>
<div class="lab">Reconnaissance</div><p>Altération de l’état mental, trouble de la marche, disconnexion interhémisphérique. L’IRM montre des lésions du corps calleux ; les mimiques comptent une lésion spléniale solitaire disparaissant en moins d’une semaine (Hillbom 2014).</p>
<div class="lab">Décision</div><p>Thiamine parentérale précoce. Délai de traitement : seul facteur pronostique ajusté (OR 2,91) (Hillbom 2014).</p>
<div class="lab">Limite</div><p>Agrégat de cas publiés avec biais de publication ; les types A et B n’ont pas été trouvés dans les sources lues (Hillbom 2014).</p>
<p class="src">Références : <a href="https://doi.org/10.1136/jnnp-2013-305979" target="_blank" rel="noopener">Hillbom 2014</a></p></template>
<template data-pop="g37-schilder" data-title="Sclérose diffuse de Schilder">
<div class="lab">Définition</div><p>Affection démyélinisante inflammatoire rare, avec une ou deux grandes lésions, souvent bilatérales et grossièrement symétriques, du centre semi-ovale. L’éponyme se réserve aux cas correspondant à la description de 1912 ; le diagnostic exige d’exclure l’adrénoleucodystrophie (Schilder 2019 ; Poser 1986).</p>
<div class="lab">Particularité</div><p>Le liquide est souvent sans bandes oligoclonales ; la maladie semble immunologiquement distincte de la sclérose en plaques (Schilder 2019).</p>
<div class="lab">Décision</div><p>Corticoïdes à forte dose suggérés par des cas ; immunoglobulines et rituximab ponctuellement. Aucun traitement n’est fondé sur des preuves (Schilder 2019).</p>
<div class="lab">Limite</div><p>30 % du texte source n’a pas été lu ; les critères de Poser de 1986 ne sont connus qu’en résumé (Schilder 2019 ; Poser 1986).</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s12974-019-1425-4" target="_blank" rel="noopener">Schilder 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/3940347/" target="_blank" rel="noopener">Poser 1986</a></p></template>
<template data-pop="g37-ald" data-title="Adrénoleucodystrophie">
<div class="lab">Définition</div><p>Maladie métabolique à classer sous E 71.3, exclue de la maladie de Schilder par la classification (BfArM 2024).</p>
<div class="lab">Recherche</div><p>Dosage sérique des acides gras à très longue chaîne et exploration de la fonction surrénalienne (Schilder 2019 ; Poser 1986).</p>
<div class="lab">Limite</div><p>Le dossier ne contient aucune donnée sur la génétique ou le traitement de cette maladie.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g35-g37.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://doi.org/10.1186/s12974-019-1425-4" target="_blank" rel="noopener">Schilder 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/3940347/" target="_blank" rel="noopener">Poser 1986</a></p></template>
<template data-pop="g37-balo" data-title="Sclérose concentrique de Baló">
<div class="lab">Définition</div><p>Une ou plusieurs lésions en anneaux concentriques multicouches, surtout dans la substance blanche cérébrale, avec épargne des fibres en U ; souvent considérée comme variante rare de la sclérose en plaques (Hardy 2014 ; Baló 2021).</p>
<div class="lab">Évolution</div><p>Historiquement toujours fatale, mais variable à l’ère de l’IRM, souvent bénigne et autolimitée ; des formes agressives existent (Hardy 2014 ; Amini Harandi 2018).</p>
<div class="lab">Décision</div><p>Immunosuppression intense pour les formes agressives (Amini Harandi 2018) ; traitement de fond de la sclérose en plaques si les critères sont remplis (opinion) (Hardy 2014).</p>
<div class="lab">Limite</div><p>Sources lues en résumé seulement.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(14)70052-3" target="_blank" rel="noopener">Hardy 2014</a> ; <a href="https://doi.org/10.1016/j.jns.2021.117570" target="_blank" rel="noopener">Baló 2021</a> ; <a href="https://doi.org/10.1515/revneuro-2017-0096" target="_blank" rel="noopener">Amini Harandi 2018</a></p></template>
<template data-pop="g37-atm" data-title="Myélite transverse aiguë">
<div class="lab">Définition</div><p>Affection inflammatoire focale de la moelle qui provoque un dysfonctionnement moteur, sensitif et autonome ; idiopathique ou secondaire à une maladie connue (TMCWG 2002).</p>
<div class="lab">Reconnaissance</div><p>Faiblesse bilatérale des membres, niveau sensitif net, troubles sphinctériens, atteinte possible de la motricité respiratoire (NEMOS 2023 ; TMCWG 2002 ; Wang 2019).</p>
<div class="lab">Exclusions</div><p>La sclérose en plaques (G 35) et la neuromyélite optique (G 36.0) sont exclues de G 37.3 (BfArM 2024).</p>
<div class="lab">Décision</div><p>Imagerie médullaire, anticorps anti-aquaporine 4 et anti-MOG, puis corticoïdes ; l’aphérèse est possible dès la première ligne dans une myélite sévère (extrapolation de NEMOS) (NEMOS 2023 ; NEMOS 2024).</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g35-g37.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://doi.org/10.1007/s00415-023-11634-0" target="_blank" rel="noopener">NEMOS 2023</a> ; <a href="https://doi.org/10.1007/s00415-023-11910-z" target="_blank" rel="noopener">NEMOS 2024</a> ; <a href="https://doi.org/10.1212/wnl.59.4.499" target="_blank" rel="noopener">TMCWG 2002</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6560417/" target="_blank" rel="noopener">Wang 2019</a></p></template>
<template data-pop="g37-letm" data-title="Myélite longitudinalement étendue">
<div class="lab">Définition</div><p>Lésion intramédullaire d’au moins trois segments vertébraux contigus (NEMOS 2023).</p>
<div class="lab">Orientation</div><p>Évoque une neuromyélite optique (anticorps anti-aquaporine 4), mais aussi une neurosarcoïdose, le lupus ou une myélite après infection (Bachhuber 2021 ; NEMOS 2023).</p>
<div class="lab">Piège</div><p>Ne pas biopsier une lésion suspecte de tumeur avant d’avoir exclu une neuromyélite optique : handicap sévère possible (NEMOS 2023).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7876978/" target="_blank" rel="noopener">Bachhuber 2021</a> ; <a href="https://doi.org/10.1007/s00415-023-11634-0" target="_blank" rel="noopener">NEMOS 2023</a></p></template>
<template data-pop="g37-foix" data-title="Syndrome de Foix-Alajouanine et fistule durale">
<div class="lab">Définition</div><p>Myélopathie progressive liée à une malformation artério-veineuse spinale, le plus souvent une fistule durale. Incidence de la fistule : 5 à 10 par million et par an (Foix-Alajouanine 2025 ; Khan 2021).</p>
<div class="lab">Mécanisme</div><p>La communication entre artère et veine radiculaires dans la gaine durale provoque une congestion veineuse puis une ischémie (Brain 2006).</p>
<div class="lab">Reconnaissance</div><p>Homme d’âge moyen avec déficit ascendant des jambes ; IRM : œdème central et vides de flux dorsaux (Brain 2006).</p>
<div class="lab">Décision</div><p>Angiographie médullaire, puis embolisation ou chirurgie (Brain 2006).</p>
<p class="src">Références : <a href="https://doi.org/10.1093/brain/awl220" target="_blank" rel="noopener">Brain 2006</a> ; <a href="https://doi.org/10.1016/j.neuchi.2025.101710" target="_blank" rel="noopener">Foix-Alajouanine 2025</a> ; <a href="https://doi.org/10.1080/02688697.2021.1914822" target="_blank" rel="noopener">Khan 2021</a></p></template>
<template data-pop="g37-adem" data-title="Encéphalomyélite aiguë disséminée">
<div class="lab">Définition</div><p>Premier événement polyfocal présumé inflammatoire et démyélinisant, avec encéphalopathie non expliquée, sans nouvelle lésion après 3 mois (Santoro 2019 ; IPMSSG 2013).</p>
<div class="lab">Épidémiologie</div><p>Adulte : âge moyen 37,1 ans ; infection préalable dans environ 50 % ; mortalité 7,8 % (ADEM adulte 2022).</p>
<div class="lab">Décision</div><p>Corticoïdes à forte dose en première ligne ; immunoglobulines ou échanges plasmatiques en deuxième ligne ; aucune étude randomisée (ADEM adulte 2022).</p>
<div class="lab">Limite</div><p>L’exigence d’encéphalopathie laisse plus de la moitié des adultes sans diagnostic selon la revue (ADEM adulte 2022).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9218070/" target="_blank" rel="noopener">ADEM adulte 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7117081/" target="_blank" rel="noopener">Santoro 2019</a> ; <a href="https://doi.org/10.1177/1352458513484547" target="_blank" rel="noopener">IPMSSG 2013</a></p></template>
<template data-pop="g37-mogad" data-title="Maladie associée aux anticorps anti-MOG">
<div class="lab">Définition</div><p>Le critère central est la présence des anticorps anti-MOG, dosés par test sur cellules, avec phénotype compatible (encéphalomyélite aiguë disséminée, névrite optique, myélite transverse) et exclusion d’un meilleur diagnostic (Banwell 2023).</p>
<div class="lab">Âge</div><p>Anticorps retrouvés chez environ la moitié des enfants avec encéphalomyélite aiguë disséminée, moins de 10 % des adultes (ADEM adulte 2022).</p>
<div class="lab">Limite</div><p>Critères de 2023 lus en résumé seulement (Banwell 2023).</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(22)00431-8" target="_blank" rel="noopener">Banwell 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9218070/" target="_blank" rel="noopener">ADEM adulte 2022</a></p></template>
<template data-pop="g37-aqp4" data-title="Anticorps anti-aquaporine 4">
<div class="lab">Technique</div><p>Dosage dans le sérum par test sur cellules, idéalement avant traitement ; immunohistochimie et ELISA non recommandés en routine (NEMOS 2023).</p>
<div class="lab">Interprétation</div><p>Un résultat faiblement positif est à confirmer. Si les anticorps sont positifs, la maladie est une neuromyélite optique (G 36.0), exclue de G 37.3 (BfArM 2024 ; NEMOS 2023).</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g35-g37.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://doi.org/10.1007/s00415-023-11634-0" target="_blank" rel="noopener">NEMOS 2023</a></p></template>
<template data-pop="g37-irm-ods" data-title="IRM de la démyélinisation osmotique">
<div class="lab">Aspect</div><p>Hypersignal T2 et FLAIR, hyposignal T1 ; diffusion, T2 et FLAIR équivalents ; anomalies possibles dès le premier jour (Lambeck 2019).</p>
<div class="lab">Piège</div><p>Une IRM précoce normale ne suffit pas à exclure la maladie : la répéter à 1–2 semaines (Lambeck 2019).</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0600" target="_blank" rel="noopener">Lambeck 2019</a></p></template>
<template data-pop="g37-irm-mbd" data-title="IRM de la maladie de Marchiafava-Bignami">
<div class="lab">Aspect</div><p>Lésions calleuses étendues ; la diffusion détecte les plus précoces ; prise de gadolinium dans 17,8 % des cas (Hillbom 2014).</p>
<div class="lab">Suivi</div><p>Le suivi repose sur des IRM répétées, dont l’imagerie du tenseur de diffusion (Hillbom 2014).</p>
<p class="src">Références : <a href="https://doi.org/10.1136/jnnp-2013-305979" target="_blank" rel="noopener">Hillbom 2014</a></p></template>
<template data-pop="g37-irm-myelite" data-title="IRM médullaire et étiologie">
<div class="lab">Principe</div><p>La longueur, la position et le rehaussement de la lésion orientent vers la sclérose en plaques, la neuromyélite optique, la maladie associée aux anticorps anti-MOG, la sarcoïdose ou le lupus (Bachhuber 2021 ; NEMOS 2023).</p>
<div class="lab">Limite</div><p>Orientation et non critère diagnostique ; pas de critères TMCWG dans la source (Bachhuber 2021).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7876978/" target="_blank" rel="noopener">Bachhuber 2021</a> ; <a href="https://doi.org/10.1007/s00415-023-11634-0" target="_blank" rel="noopener">NEMOS 2023</a></p></template>
<template data-pop="g37-lcr" data-title="Liquide cérébro-spinal">
<div class="lab">Schilder</div><p>Bandes oligoclonales dans 23,1 % des ponctions ; leucocytes au-dessus de 5/µL dans 20,7 % ; protéines élevées dans 43,8 % (Schilder 2019).</p>
<div class="lab">Encéphalomyélite aiguë disséminée</div><p>Pléiocytose 51,8 %, protéines au-dessus de 45 mg pour 100 mL dans 39,1 %, bandes 23,9 % (ADEM adulte 2022).</p>
<div class="lab">Décision</div><p>La ponction est indispensable devant une encéphalopathie, pour exclure une infection (Santoro 2019).</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s12974-019-1425-4" target="_blank" rel="noopener">Schilder 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9218070/" target="_blank" rel="noopener">ADEM adulte 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7117081/" target="_blank" rel="noopener">Santoro 2019</a></p></template>
<template data-pop="g37-angio" data-title="Angiographie médullaire">
<div class="lab">Rôle</div><p>Indispensable pour localiser la fistule et son angio-architecture (Brain 2006).</p>
<div class="lab">Décision</div><p>Elle choisit entre embolisation et chirurgie ; l’embolisation est impossible si l’afférence naît de l’artère spinale antérieure (Brain 2006).</p>
<p class="src">Références : <a href="https://doi.org/10.1093/brain/awl220" target="_blank" rel="noopener">Brain 2006</a></p></template>
<template data-pop="g37-locked" data-title="Syndrome d’enfermement">
<div class="lab">Définition</div><p>Tableau des formes sévères de myélinolyse centropontine : le patient est éveillé, mais incapable de bouger, hors les mouvements oculaires (Lambeck 2019).</p>
<div class="lab">Piège</div><p>Un patient « inconscient » peut être éveillé et comprendre ; l’examen cherche la réponse oculaire.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0600" target="_blank" rel="noopener">Lambeck 2019</a></p></template>
<template data-pop="g37-disconnexion" data-title="Disconnexion interhémisphérique">
<div class="lab">Définition</div><p>Signes liés à l’interruption des fibres calleuses : 35,9 % des cas de Marchiafava-Bignami, 1,9 % des mimiques (Hillbom 2014).</p>
<div class="lab">Piège</div><p>Peut passer inaperçue sans testing neuropsychologique (Hillbom 2014).</p>
<p class="src">Références : <a href="https://doi.org/10.1136/jnnp-2013-305979" target="_blank" rel="noopener">Hillbom 2014</a></p></template>
