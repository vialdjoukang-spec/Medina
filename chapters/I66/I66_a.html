<section class="ilot" id="i66-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées. Un homme de 64 ans, hypertendu, diabétique et fumeur, consulte parce qu’il a présenté, à deux reprises en une semaine, un trouble neurologique focal qui a disparu en moins d’une heure. L’examen neurologique est normal le jour de la consultation. L’imagerie par résonance magnétique ne montre aucun infarctus. L’angiographie par tomodensitométrie révèle en revanche un rétrécissement serré de l’<button class="w" data-k="i66-acm">artère cérébrale moyenne</button> gauche, que le radiologue mesure à 75 % selon la <button class="w" data-k="i66-wasid-mesure">méthode de mesure du rétrécissement (formule et exemple chiffré)</button>. Le dossier se code I66.0, accompagné du code G45 pour les épisodes transitoires, et non I63, puisque aucun tissu cérébral n’est détruit. <b>La question décisive tient en une phrase : faut-il dilater et stenter cette artère, ou traiter médicalement ?</b> L’intuition d’un geste mécanique sur un rétrécissement serré est séduisante. Les essais comparatifs l’infirment : dans l’essai <button class="w" data-k="i66-sammpris">SAMMPRIS (stent contre traitement médical intensif)</button>, le stenting de première intention a causé plus d’accidents vasculaires cérébraux et de décès à 30 jours que le traitement médical. L’<button class="w" data-k="i66-sources-guides">Organisation européenne de l’accident vasculaire cérébral</button> recommande donc fortement contre l’angioplastie avec stent en première intention et privilégie un traitement médical intensif, fondé sur une <button class="w" data-k="i66-dapt">double antiagrégation plaquettaire de durée limitée</button> et sur le contrôle agressif des facteurs de risque.</p>
<div class="key"><b>À retenir.</b> La sténose intracrânienne symptomatique se traite d’abord par médicaments. Le raisonnement du chapitre suit l’ordre d’une consultation : définir la lésion et son code (îlots 1 à 3), comprendre comment elle provoque une ischémie (îlots 3 et 4), la reconnaître par la clinique et l’imagerie (îlots 5 à 7), mesurer l’urgence (îlot 8), traiter (îlots 9 à 11), puis suivre et conclure (îlots 12 à 14).</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34414299/" target="_blank" rel="noopener">ESO, accident ischémique transitoire 2021</a>.</p>
</section>
<section class="ilot" id="i66-1"><h2><span class="n">1</span>Définitions, classification et limites du code</h2>
<h3>Ce que code I66</h3>
<p>La CIM-10-GM 2024 définit I66 par une sténose ou une occlusion — embolie, obstruction complète ou partielle, thrombose — des artères cérébrales moyenne, antérieure, postérieure ou cérébelleuses, sans infarctus cérébral résultant. Si la lésion a provoqué un infarctus, le code est I63 et non I66. Le tableau énumère les sous-codes, dont les intitulés français proviennent du registre de l’Office fédéral de la statistique.</p>
<table class="t"><tr><th>Sous-code</th><th>Intitulé</th><th>Remarque d’usage</th></tr><tr><td>I66.0</td><td>Occlusion et sténose de l’<button class="w" data-k="i66-acm">artère cérébrale moyenne</button></td><td>Territoire le plus fréquent des infarctus sylviens</td></tr><tr><td>I66.1</td><td>Occlusion et sténose de l’<button class="w" data-k="i66-aca">artère cérébrale antérieure</button></td><td>1,8 % des accidents vasculaires du registre lausannois</td></tr><tr><td>I66.2</td><td>Occlusion et sténose de l’<button class="w" data-k="i66-acp">artère cérébrale postérieure</button></td><td>Vision et mémoire en première ligne</td></tr><tr><td>I66.3</td><td>Occlusion et sténose des artères cérébelleuses</td><td>Équilibre et coordination</td></tr><tr><td>I66.4</td><td>Occlusion et sténose des artères cérébrales, multiples et bilatérales</td><td>Plusieurs artères atteintes</td></tr><tr><td>I66.8</td><td>Occlusion et sténose d’une autre artère cérébrale</td><td>Inclut les artères perforantes des noyaux gris centraux</td></tr><tr><td>I66.9</td><td>Occlusion et sténose d’une artère cérébrale, sans précision</td><td>Artère non précisée</td></tr></table>
<p>Le tableau se lit avec une règle de frontière que l’on confond souvent. <b>L’artère basilaire, l’artère vertébrale et l’artère carotide, y compris son siphon, relèvent de I65 (artères précérébrales), non de I66.</b> Les codes I63.3 à I63.5 désignent l’infarctus déjà constitué par thrombose, embolie ou occlusion non précisée d’une artère cérébrale ; I67.2 désigne l’athérosclérose cérébrale ; G45 code l’accident ischémique transitoire, séparément. Un même patient peut donc recevoir deux codes pour un même événement.</p>
<div class="trap"><span class="k">Piège</span> Le code ne dépend pas de la cause de la sténose. Une sténose d’origine dissectante ou vasculitique de l’artère cérébrale moyenne se code aussi I66.0 si aucun infarctus n’est constitué ; c’est l’athérosclérose qui domine en pratique.</div>
<h3>Le vocabulaire de la sténose athéroscléreuse</h3>
<p>Quatre notions structurent la lecture des essais et des recommandations. Elles s’appuient sur les définitions de l’<button class="w" data-k="i66-sources-guides">Organisation européenne de l’accident vasculaire cérébral</button> de 2022.</p>
<table class="t"><tr><th>Notion</th><th>Définition</th><th>Conséquence pour la décision</th></tr><tr><td><button class="w" data-k="i66-icad">Maladie athéroscléreuse intracrânienne (ICAD)</button></td><td>Plaque des grosses artères intracrâniennes, à tout stade, y compris sans rétrécissement</td><td>Inclut les plaques non sténosantes, que l’imagerie de la paroi peut voir</td></tr><tr><td><button class="w" data-k="i66-icad">Sténose athéroscléreuse intracrânienne (ICAS)</button></td><td>Plaque responsable d’un rétrécissement significatif, en général supérieur à 50 %, documenté par angiographie ou <button class="w" data-k="i66-dtc">Doppler transcrânien</button></td><td>Seuil à partir duquel les recommandations s’appliquent</td></tr><tr><td><button class="w" data-k="i66-haut-grade">Sténose de haut grade</button></td><td>Rétrécissement supérieur à 70 % ou retentissement hémodynamique</td><td>Population des essais de revascularisation</td></tr><tr><td><button class="w" data-k="i66-symptomatique">Sténose symptomatique</button></td><td>Événement ischémique cérébral attribuable à la plaque</td><td>Distingue la prévention secondaire de la prise en charge d’une découverte fortuite</td></tr></table>
<p>Le retentissement hémodynamique désigne une baisse du débit antérograde dans l’artère, compensée par le recrutement de <button class="w" data-k="i66-collaterales">collatérales</button> ; il devient sévère quand ces collatérales ne maintiennent plus la perfusion. Il se suspecte devant des déficits qui fluctuent avec la posture ou après un repas, et devant des infarctus de jonction (territoires limites entre deux artères).</p>
<h3>Le degré de sténose se mesure d’une seule manière standardisée</h3>
<p>La <button class="w" data-k="i66-wasid-mesure">méthode WASID</button> calcule le pourcentage de sténose par la formule [1 − (diamètre de la sténose ÷ diamètre normal)] × 100. Le diamètre normal est celui du segment proximal sain ; à défaut, on prend le segment distal, puis l’artère nourricière. La concordance entre observateurs est bonne : 71 à 100 % des mesures ne diffèrent pas de plus de 10 points.</p>
<div class="key"><b>À retenir.</b> I66 est un code de lésion sans infarctus. Au-delà de 50 % de rétrécissement, on parle de sténose intracrânienne ; au-delà de 70 % ou avec retentissement hémodynamique, de haut grade. Tout infarctus constitué fait passer à I63. Basilaire et carotide appartiennent à I65.</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, BfArM</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10782772/" target="_blank" rel="noopener">Samuels et al., 2000</a>.</p>
</section>
<section class="ilot" id="i66-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>La fréquence de la sténose intracrânienne varie fortement avec l’origine des populations. En Occident, la maladie athéroscléreuse intracrânienne cause jusqu’à 10 % des accidents vasculaires cérébraux ischémiques ; elle est la cause la plus fréquente chez les personnes d’ascendance asiatique et représente jusqu’à 40 % des occlusions de gros vaisseaux en Asie.</p>
<table class="t"><tr><th>Population</th><th>Part des accidents vasculaires cérébraux ischémiques liée à la sténose</th><th>Remarque</th></tr><tr><td>Inde</td><td>environ 50 %</td><td>Source : revue de Song et Kwon 2025</td></tr><tr><td>Chine</td><td>47 %</td><td>Même revue</td></tr><tr><td>Corée</td><td>25 %</td><td>Même revue</td></tr><tr><td>Pays occidentaux</td><td>10 à 16 %</td><td>Même revue</td></tr><tr><td>Grèce</td><td>9,2 %</td><td>Seuil de rétrécissement de 50 % ou plus</td></tr><tr><td>Allemagne</td><td>6,5 %</td><td>Mesure par <button class="w" data-k="i66-dtc">Doppler transcrânien</button></td></tr><tr><td>Espagne</td><td>12,4 %</td><td>Seuil de 50 % ou plus</td></tr><tr><td>Pays‑Bas</td><td>3 %</td><td><button class="w" data-k="i66-angio-tdm">Angio-tomodensitométrie</button>, seuil de 50 % ou plus</td></tr><tr><td>France</td><td>17,8 %</td><td>Seuil de 30 % ou plus, autopsies d’accidents fatals</td></tr></table>
<p>Les écarts européens ne traduisent pas forcément des différences de population : les seuils (30 % ou 50 %) et les méthodes (Doppler, angio-tomodensitométrie, autopsie) diffèrent d’une étude à l’autre, de sorte que les chiffres ne se comparent pas ligne à ligne. La revue bernoise de 2021 rappelle que les sténoses athéroscléreuses intracrâniennes forment la cause la plus fréquente d’accident vasculaire cérébral ischémique dans le monde. La maladie existe aussi sans symptôme. Une sténose asymptomatique de 50 % ou plus se rencontre chez 9 % des sujets dans une étude espagnole, 11 % au Royaume-Uni et 6 % au Japon. La plaque est donc fréquente dans la population avant tout événement, ce qui pose la question du dépistage (îlot 13).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Citer « 10 % » comme un chiffre suisse. Aucune épidémiologie suisse propre à la sténose intracrânienne n’a été trouvée dans les sources lues ; le chiffre de 10 % vient de la ligne directrice européenne et vaut pour les Caucasiens.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34291662/" target="_blank" rel="noopener">Krasteva et al., Therapeutische Umschau 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a>.</p>
</section>
<section class="ilot" id="i66-3"><h2><span class="n">3</span>Anatomie et physiopathologie : de l’artère saine à l’ischémie</h2>
<h3>L’artère intracrânienne saine</h3>
<p>Les artères cérébrales sont d’origine mésodermique ; leur média est mince, elles contiennent peu de fibres élastiques et peu de vasa vasorum, ces petits vaisseaux qui nourrissent la paroi des gros vaisseaux. En <button class="w" data-k="i66-irm-paroi">IRM de paroi</button>, la paroi normale apparaît comme un épaississement concentrique et uniforme, à la lumière lisse et sans rehaussement après injection. Les lésions qui nous occupent siègent <b>en aval du polygone de Willis</b>. Cette situation distale a une conséquence directe : une artère extracrânienne bouchée est souvent suppléée par le polygone, alors qu’une artère intracrânienne distale dispose de moins de <button class="w" data-k="i66-collaterales">suppléances collatérales (ce qu’elles compensent et ce qu’elles ne compensent pas)</button>.</p>
<h3>La plaque intracrânienne diffère de la plaque carotidienne</h3>
<p>Comparée à la plaque extracrânienne, la plaque intracrânienne contient davantage de fibrose proliférative, moins de lésions compliquées, moins d’infiltration lipidique et moins d’inflammation de l’intima. Les taux de LDL, de LDL oxydées et de macrophages de l’intima y sont plus bas, et l’activité des enzymes antioxydantes plus élevée. Ces différences histologiques sont décrites ; la revue de Song et Kwon ne les relie pas à une conduite thérapeutique propre et il faut éviter d’en déduire que le traitement hypolipémiant serait moins utile.</p>
<h3>Quatre mécanismes de l’ischémie</h3>
<p>Une sténose n’est dangereuse que par ce qu’elle déclenche en aval. Les sources décrivent quatre mécanismes, souvent associés, que le <button class="w" data-k="i66-mnemo">moyen mnémotechnique (aide pédagogique, non critère officiel)</button> aide à ordonner. <figure><svg viewBox="0 0 640 330" role="img" aria-label="Quatre mécanismes de l’ischémie sur une sténose intracrânienne" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="2"><rect x="10" y="10" width="300" height="140" rx="6"/><rect x="330" y="10" width="300" height="140" rx="6"/><rect x="10" y="175" width="300" height="140" rx="6"/><rect x="330" y="175" width="300" height="140" rx="6"/><path d="M30 80h120m0 0c10 0 15-12 30-12h110"/><path d="M350 80h120m0 0c10 0 15-12 30-12h110"/><path d="M30 245h120m0 0c10 0 15-12 30-12h110"/><path d="M350 245h120m0 0c10 0 15-12 30-12h110"/></g><g fill="#222"><text x="22" y="34" font-weight="bold">1. Thrombose in situ</text><text x="22" y="115">Rupture de plaque, caillot local,</text><text x="22" y="135">occlusion de l’artère</text><text x="342" y="34" font-weight="bold">2. Embolie artère-artère</text><text x="342" y="115">Fragments emportés vers une</text><text x="342" y="135">branche distale</text><text x="22" y="199" font-weight="bold">3. Occlusion de branche</text><text x="22" y="280">La plaque couvre l’orifice d’une</text><text x="22" y="300">artère perforante : infarctus lacunaire</text><text x="342" y="199" font-weight="bold">4. Bas débit hémodynamique</text><text x="342" y="280">Sténose serrée + hypotension :</text><text x="342" y="300">infarctus de jonction</text></g></svg><figcaption>Figure 1 — Les quatre mécanismes par lesquels une sténose intracrânienne provoque une ischémie. Schéma pédagogique établi d’après Song et Kwon 2025 et Chen et al. 2024 ; le trait horizontal figure l’artère, le renflement la plaque.</figcaption></figure> La figure se lit de gauche à droite et de haut en bas. Dans le premier mécanisme, la plaque se rompt et un thrombus se forme sur place, jusqu’à obstruer l’artère. Dans le deuxième, un fragment de plaque ou de thrombus se détache et migre vers une branche distale : c’est l’embolie artère-artère, que le <button class="w" data-k="i66-dtc">Doppler transcrânien</button> détecte sous la forme de signaux microemboliques, fréquents à la phase aiguë des sténoses symptomatiques de l’<button class="w" data-k="i66-acm">artère cérébrale moyenne</button>. Dans le troisième, la plaque recouvre l’ostium d’une artère perforante ; l’infarctus lacunaire qui en résulte peut survenir même si la sténose de l’artère principale est légère. Dans le quatrième, le rétrécissement serré réduit le débit antérograde, et toute baisse supplémentaire de la pression ou du volume sanguin, par hypotension ou hypovolémie, suffit à priver de sang les territoires situés à la limite de deux artères. Selon Chen et al., l’embolie artère-artère et l’occlusion de branche sont relativement plus fréquentes. La conséquence pratique est que le pourcentage de rétrécissement ne résume pas le risque : une plaque qui obstrue une branche ou qui libère des emboles menace le cerveau même quand la lumière reste en partie ouverte. Environ un tiers des sténoses progressent malgré le traitement médical, ce qui justifie le suivi.</p>
<div class="key"><b>À retenir.</b> La lésion intracrânienne siège après le polygone, avec peu de suppléance. L’ischémie vient de quatre mécanismes : thrombose in situ, embolie artère-artère, occlusion de branche et bas débit. Le quatrième est aggravé par l’hypotension et l’hypovolémie.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20335070/" target="_blank" rel="noopener">CLAIR, Lancet Neurol 2010</a>.</p>
</section>
<section class="ilot" id="i66-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<h3>L’athérosclérose et ses facteurs de risque</h3>
<p>L’athérosclérose est la cause dominante. Les facteurs de risque sont l’âge, l’hypertension, le diabète, l’hypercholestérolémie, le tabagisme, la sédentarité et le syndrome métabolique ; l’origine ethnique joue aussi, avec une fréquence accrue chez les personnes d’ascendance noire et asiatique. Ces facteurs ne sont pas équivalents : ceux qui se modifient — pression artérielle, lipides, tabac, activité physique — forment le socle du traitement médical intensif des îlots 9 et 10. Plusieurs marqueurs biologiques accompagnent la sévérité de la sténose : un rapport apolipoprotéine B sur apolipoprotéine A1 élevé, une adiponectine basse et une <button class="w" data-k="i66-lipides">lipoprotéine(a) élevée (ce que ces marqueurs signifient)</button>. Leur valeur pour guider une décision thérapeutique n’est pas établie dans les sources lues.</p>
<h3>Un facteur génétique propre à l’Asie de l’Est</h3>
<p>Le variant <button class="w" data-k="i66-rnf213">RNF213 p.R4810K (gène, variant et populations concernées)</button> est associé à la maladie athéroscléreuse intracrânienne en Asie de l’Est ; il est absent des populations non asiatiques. Il n’intervient donc pas dans le raisonnement du médecin suisse devant un patient d’origine européenne, mais il explique une part de la fréquence asiatique.</p>
<h3>Les causes qui ne sont pas athéroscléreuses</h3>
<p>Un rétrécissement ou une occlusion intracrânienne n’est pas toujours athéroscléreux. La liste à garder en tête comprend la <button class="w" data-k="i66-dissection">dissection artérielle</button>, la <button class="w" data-k="i66-vasculite">vasculite</button>, le <button class="w" data-k="i66-svcr">syndrome de vasoconstriction cérébrale réversible</button>, l’<button class="w" data-k="i66-moyamoya">angiopathie de moyamoya</button> et l’<button class="w" data-k="i66-embolie">occlusion embolique</button> d’origine cardiaque ou carotidienne. Cette dernière est loin d’être rare : dans le registre lausannois des accidents vasculaires cérébraux, 63 % des infarctus du territoire de l’<button class="w" data-k="i66-aca">artère cérébrale antérieure</button> s’expliquaient par une embolie carotidienne ou cardiaque. L’îlot 7 donne la démarche pour les distinguer.</p>
<div class="trap"><span class="k">Piège</span> Devant une artère occluse, l’origine athéroscléreuse n’est pas la seule possible. Une occlusion embolique appelle une recherche de la source cardiaque ou carotidienne, que le traitement d’une plaque intracrânienne ne remplace pas.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/2302085/" target="_blank" rel="noopener">Bogousslavsky et Regli, Arch Neurol 1990</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37021176/" target="_blank" rel="noopener">ESO, angiopathie de moyamoya 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34746432/" target="_blank" rel="noopener">ESO, dissection artérielle 2021</a>.</p>
</section>
<section class="ilot" id="i66-5"><h2><span class="n">5</span>Anamnèse et présentation clinique</h2>
<h3>Deux manières de découvrir la maladie</h3>
<p>Comme I66 exclut par définition l’infarctus constitué, la lésion se découvre de deux façons. La première est l’accident ischémique transitoire : un déficit neurologique focal de moins de 24 heures, que les définitions de l’<button class="w" data-k="i66-sources-guides">Organisation européenne</button> rapportent à une ischémie focale cérébrale ou oculaire probable. La seconde est la découverte à l’imagerie, chez un patient sans symptôme ou dont les symptômes ont une autre explication. L’anamnèse doit d’abord établir le caractère transitoire et focal de l’épisode, puis rechercher les facteurs de risque (îlot 4) et les éléments qui orientent vers un mécanisme.</p>
<h3>Les indices en faveur d’un mécanisme hémodynamique</h3>
<p>Les déficits qui fluctuent avec la posture ou après un repas, ou qui apparaissent dans un contexte d’hypotension ou d’hypovolémie, suggèrent un <button class="w" data-k="i66-collaterales">mécanisme hémodynamique</button> : la sténose limite le débit, et toute baisse de la perfusion systémique démasque l’insuffisance de suppléance. Cette distinction oriente le suivi (îlot 12), pas encore le choix du traitement de première ligne, qui reste médical.</p>
<h3>Les symptômes selon l’artère atteinte</h3>
<p>Les tableaux cliniques par territoire proviennent presque tous de séries d’<b>infarctus</b> — registre de Lausanne et séries parisiennes — et non d’accidents transitoires. Ils décrivent donc les déficits que l’ischémie peut produire, et l’on s’en sert comme guide de ce que l’épisode transitoire peut reproduire, non comme une sémiologie validée de l’accident transitoire.</p>
<table class="t"><tr><th>Artère concernée (sous-code)</th><th>Signes rapportés dans les séries d’infarctus</th><th>Source</th></tr><tr><td><button class="w" data-k="i66-acm">Artère cérébrale moyenne superficielle</button> (I66.0)</td><td>Troubles de la personnalité et du jugement, désynchronisation motrice, désorientation, hémianopsie, héminégligence selon la branche</td><td>González Delgado et Bogousslavsky 2012</td></tr><tr><td><button class="w" data-k="i66-aca">Artère cérébrale antérieure</button> (I66.1)</td><td>Hémiparésie, perte de sensibilité d’un hémicorps, mutisme initial, aphasie motrice transcorticale, troubles de l’humeur ; plus rarement incontinence, grasping, confusion</td><td>Bogousslavsky et Regli 1990</td></tr><tr><td><button class="w" data-k="i66-acp">Artère cérébrale postérieure superficielle</button> (I66.2)</td><td>Hémianopsie (67 %), quadranopsie (22 %), troubles de mémoire (17,5 %), dysphasie, hallucinations, agnosie visuelle, prosopagnosie</td><td>Cals et al. 2002</td></tr><tr><td><button class="w" data-k="i66-cerebelleuses">Artère cérébelleuse postéro-inférieure</button> (I66.3)</td><td>Vertige aigu et ataxie axiale (partie médiale) ; instabilité et dysmétrie des membres sans dysarthrie (partie latérale)</td><td>Barth et al. 1993</td></tr><tr><td><button class="w" data-k="i66-cerebelleuses">Artère cérébelleuse antéro-inférieure</button> (I66.3)</td><td>Atteinte constante des nerfs crâniens : paralysie faciale, trouble sensitif du trijumeau, surdité, syndrome vestibulaire ; ataxie</td><td>Amarenco et Hauw 1990</td></tr><tr><td><button class="w" data-k="i66-cerebelleuses">Artère cérébelleuse supérieure</button> (I66.3)</td><td>Dysarthrie, instabilité ou vertige, ataxie des membres, dysmétrie</td><td>Barth et al. 1993 ; Amarenco et Hauw 1990</td></tr></table>
<p>Le tableau permet de relier un déficit à une artère. Il ne permet pas de prédire la cause : dans la série cérébelleuse, de petits infarctus multiples accompagnent surtout l’athérosclérose vertébro-basilaire, alors que les grands infarctus des artères cérébelleuses postéro-inférieure et supérieure sont surtout cardio-emboliques. Les formes de l’artère cérébelleuse antéro-inférieure relèvent surtout d’une thrombose sur sténose athéromateuse.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure à une plaque intracrânienne dès qu’une artère cérébrale est rétrécie ou occluse. Une occlusion embolique peut siéger sur n’importe quelle artère : dans la série lausannoise, 63 % des infarctus du territoire de l’artère cérébrale antérieure venaient d’une <button class="w" data-k="i66-embolie">embolie carotidienne</button> ou cardiaque.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/2302085/" target="_blank" rel="noopener">Bogousslavsky et Regli, Arch Neurol 1990</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12140669/" target="_blank" rel="noopener">Cals et al., J Neurol 2002</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8498823/" target="_blank" rel="noopener">Barth et al., Ann Neurol 1993</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/2302529/" target="_blank" rel="noopener">Amarenco et Hauw, Brain 1990</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/2392223/" target="_blank" rel="noopener">Amarenco et Hauw, Neurology 1990</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22377875/" target="_blank" rel="noopener">González Delgado et Bogousslavsky, Front Neurol Neurosci 2012</a>.</p>
</section>
<section class="ilot" id="i66-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen neurologique est souvent normal entre les épisodes, ce qui n’exclut en rien la maladie. Les sources lues ne décrivent aucun signe clinique spécifique de la sténose intracrânienne elle-même. L’examen sert donc à trois choses : documenter le déficit s’il persiste, rattacher le déficit à un territoire artériel (tableau de l’îlot 5), et mesurer les facteurs de risque modifiables.</p>
<div class="two"><div class="card"><h4>Déficit et territoire</h4><p>L’examen cherche les déficits de la liste de l’îlot 5 : champ visuel, langage, force et sensibilité, coordination, nerfs crâniens. Un déficit persistant à l’examen fait basculer vers l’infarctus et vers le code I63 si l’imagerie montre une lésion constituée. Un examen normal avec une histoire évocatrice d’accident transitoire reste compatible avec I66.</p></div><div class="card"><h4>Facteurs de risque mesurables</h4><p>La mesure de la pression artérielle compte, car la cible à long terme est inférieure à 130/80 mmHg (îlot 10). Une pression très basse ou une hypovolémie peuvent démasquer un mécanisme hémodynamique (îlot 3) : le médecin note donc le contexte des épisodes.</p></div></div>
<div class="trap"><span class="k">Piège</span> Un examen neurologique normal n’écarte pas une sténose de haut grade. Entre deux épisodes, la perfusion peut suffire au repos ; c’est l’imagerie vasculaire, non l’examen, qui décide.</div>
<div class="alert"><b>Gravité d’abord.</b> Un déficit qui persiste, qui s’aggrave ou qui s’installe en quelques minutes ne relève pas d’un bilan ambulatoire, mais d’une prise en charge immédiate comme un infarctus en cours (îlot 8).</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34414299/" target="_blank" rel="noopener">ESO, accident ischémique transitoire 2021</a>.</p>
</section>
