<template data-pop="i66-sources-guides" data-title="Référentiels utilisés et leurs limites">
<h3>Ce que sont les sources</h3> La sténose intracrânienne repose sur un petit nombre de textes. La ligne directrice de l’<b>Organisation européenne de l’accident vasculaire cérébral</b> sur la maladie athéroscléreuse intracrânienne (2022, rédigée avec des auteurs de Bâle) est la référence centrale. Quatre textes complémentaires du même organisme sont utilisés : l’accident ischémique transitoire (2021), la prévention secondaire à long terme (2022), l’angiopathie de moyamoya (2023) et la dissection artérielle (2021). <h3>Limites</h3> Aucune recommandation suisse spécifique à la sténose intracrânienne n’a été trouvée. La seule source suisse est une revue bernoise (Krasteva et al., 2021), lue en résumé. Les essais fondateurs (WASID, SAMMPRIS, VISSIT, CASSISS) viennent d’Amérique du Nord et de Chine : ils sont utilisés comme preuves reprises par l’Organisation européenne, non comme recommandations américaines. Les notices suisses proviennent de la base des informations professionnelles et sont datées dans le texte.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34291662/" target="_blank" rel="noopener">Krasteva et al., Therapeutische Umschau 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34414299/" target="_blank" rel="noopener">ESO, accident ischémique transitoire 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36082250/" target="_blank" rel="noopener">ESO, prévention secondaire à long terme 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37021176/" target="_blank" rel="noopener">ESO, angiopathie de moyamoya 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34746432/" target="_blank" rel="noopener">ESO, dissection artérielle 2021</a>.</p>
</template>
<template data-pop="i66-icad" data-title="ICAD et ICAS : la plaque et le rétrécissement">
<h3>Deux niveaux</h3> La <b>maladie athéroscléreuse intracrânienne</b> désigne toute plaque des grosses artères intracrâniennes, y compris celle qui ne rétrécit pas la lumière. La <b>sténose athéroscléreuse intracrânienne</b> est la plaque responsable d’un rétrécissement significatif, en général supérieur à 50 %, documenté par angiographie ou Doppler transcrânien. <h3>Pourquoi distinguer</h3> Le seuil de 50 % est celui à partir duquel les recommandations s’appliquent ; une plaque sans rétrécissement ne relève pas des mêmes décisions, mais peut se voir à l’IRM de paroi. Le lecteur lit donc « ICAD » pour la maladie de la paroi et « ICAS » pour la lésion qui rétrécit la lumière.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a>.</p>
</template>
<template data-pop="i66-haut-grade" data-title="Sténose de haut grade et retentissement hémodynamique">
<h3>Définition</h3> Le haut grade désigne un rétrécissement supérieur à 70 % ou un retentissement hémodynamique. Le retentissement est une baisse du débit antérograde avec recrutement de collatérales ; il est sévère quand celles-ci ne maintiennent plus la perfusion. <h3>Indices</h3> Fluctuations des déficits avec la posture ou après un repas ; infarctus de jonction. L’Organisation européenne ne formule aucune recommandation sur une pression permissive en phase aiguë d’une sténose de haut grade. Les essais de revascularisation ont inclus des sténoses de haut grade (SAMMPRIS : 70 à 99 %).
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a>.</p>
</template>
<template data-pop="i66-symptomatique" data-title="Sténose symptomatique ou asymptomatique">
<h3>Définitions</h3> Une sténose est <b>symptomatique</b> quand un événement ischémique cérébral lui est attribuable ; elle est <b>asymptomatique</b> chez un sujet sans accident vasculaire cérébral ou dont l’événement s’explique par une autre cause. <h3>Conséquence</h3> Les recommandations de traitement intensif et de double antiagrégation concernent la forme symptomatique. Pour la forme asymptomatique, aucune recommandation ne couvre le dépistage ni l’antiagrégation, faute d’essai randomisé.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a>.</p>
</template>
<template data-pop="i66-wasid-mesure" data-title="Mesurer une sténose selon la méthode WASID">
<h3>Formule</h3> Pourcentage de sténose = [1 − (diamètre de la sténose ÷ diamètre normal)] × 100. Le diamètre normal est celui du segment proximal sain de l’artère ; à défaut, celui du segment distal, puis celui de l’artère nourricière. <h3>Exemple chiffré fictif</h3> Segment normal de 3,0 mm et segment sténosé de 1,2 mm : [1 − (1,2 ÷ 3,0)] × 100 = 60 %. Le rétrécissement n’atteint pas le haut grade, mais dépasse 50 %. <h3>Fiabilité</h3> Dans l’étude de standardisation de Samuels et al., 71 à 100 % des mesures de deux observateurs différaient de 10 points au plus. Le piège tient au choix du segment de référence : si le segment proximal est lui-même altéré, le pourcentage est sous-estimé.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/10782772/" target="_blank" rel="noopener">Samuels et al., 2000</a>.</p>
</template>
<template data-pop="i66-collaterales" data-title="Collatérales et retentissement hémodynamique">
<h3>Ce que fait la collatérale</h3> Quand une artère se rétrécit, des voies parallèles amènent du sang vers le territoire concerné. Les lésions intracrâniennes siègent en aval du polygone de Willis et disposent de moins de suppléance collatérale que les lésions extracrâniennes. <h3>Conséquence clinique</h3> Quand les collatérales ne suffisent plus, la perfusion devient fragile : une hypotension ou une hypovolémie peut démasquer un déficit, et un infarctus peut apparaître à la jonction de deux territoires. Les déficits qui fluctuent avec la posture ou après un repas sont un indice de cette fragilité. <h3>Limite</h3> Les sources lues ne décrivent pas l’autorégulation cérébrale ; elle ne fait pas partie de ce raisonnement.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a>.</p>
</template>
<template data-pop="i66-mnemo" data-title="Quatre mécanismes : moyen mnémotechnique">
<h3>Aide pédagogique, non critère officiel</h3> Les quatre mécanismes de l’ischémie se retiennent dans l’ordre <b>T</b>hrombose in situ, <b>E</b>mbolie artère-artère, occlusion de <b>B</b>ranche, bas <b>D</b>ébit. <h3>Usage</h3> Devant un patient, la liste sert à demander quel mécanisme est plausible ; un déficit qui fluctue avec la posture évoque un bas débit. Cet ordre n’a aucune valeur de classification officielle.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a>.</p>
</template>
<template data-pop="i66-lipides" data-title="Marqueurs lipidiques associés à la sténose">
<h3>Ce qui est établi</h3> Un rapport apolipoprotéine B sur apolipoprotéine A1 élevé, une adiponectine basse et une lipoprotéine(a) élevée accompagnent la sévérité de la sténose intracrânienne. <h3>Ce qui n’est pas établi</h3> Les sources lues ne disent pas que la mesure de ces marqueurs guide le traitement. La conduite lipidique repose sur la cible de LDL-cholestérol (fenêtre « divergence des deux cibles »).
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a>.</p>
</template>
<template data-pop="i66-ldl-divergence" data-title="LDL cible : deux lignes directrices, deux chiffres">
<h3>Les deux recommandations</h3> <table class="t"><tr><th>Texte</th><th>Cible de LDL-cholestérol</th><th>Conduite complémentaire</th></tr><tr><td>Organisation européenne, maladie intracrânienne 2022</td><td>Inférieure à 1,4 mmol/L (55 mg/dL), selon Société européenne de cardiologie et Société européenne d’athérosclérose 2019</td><td>Contrôle agressif des lipides, force faible</td></tr><tr><td>Organisation européenne, prévention secondaire 2022</td><td>Inférieure à 1,8 mmol/L (70 mg/dL), avec statine</td><td>Ézétimibe ou inhibiteur de la PCSK9 si la cible n’est pas atteinte</td></tr></table> <h3>Comment présenter la divergence</h3> Les deux textes datent de la même année et ne sont pas réconciliés. Aucune source lue ne tranche entre les deux chiffres. Aucun des deux textes ne propose de cible propre à la sténose intracrânienne en dehors de cette citation.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36082250/" target="_blank" rel="noopener">ESO, prévention secondaire à long terme 2022</a>.</p>
</template>
<template data-pop="i66-rnf213" data-title="Le gène RNF213 et le variant p.R4810K">
<h3>Ce qui est décrit</h3> Le variant RNF213 p.R4810K est associé à la maladie athéroscléreuse intracrânienne en Asie de l’Est. Il est absent des populations non asiatiques. La vasculopathie RNF213 recoupe la moyamoya, dont l’IRM de paroi montre un rehaussement concentrique avec diamètre externe réduit et collatérales basales. <h3>Conséquence</h3> Chez un patient d’origine européenne, la recherche de ce variant n’a pas de place dans les sources lues.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a>.</p>
</template>
<template data-pop="i66-dissection" data-title="Dissection intracrânienne">
<h3>Ce qui l’évoque</h3> Des céphalées et une douleur cervicale postérieure ; à l’imagerie de paroi, un flap, une double lumière ou un hématome intramural. <h3>Prise en charge</h3> Avec hémorragie sous-arachnoïdienne, l’Organisation européenne recommande une intervention endovasculaire ou chirurgicale précoce. Sans hémorragie, les sources lues ne détaillent pas le traitement.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34746432/" target="_blank" rel="noopener">ESO, dissection artérielle 2021</a>.</p>
</template>
<template data-pop="i66-vasculite" data-title="Vasculite des artères cérébrales">
<h3>Ce qui l’évoque</h3> Un aspect « en chapelet » de sténoses distales à l’angiographie ; à l’IRM de paroi, un épaississement concentrique multifocal rehaussé. <h3>Distinction</h3> L’athérosclérose donne un épaississement excentrique ; la vasculite un épaississement qui touche toute la circonférence, en plusieurs sites.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a>.</p>
</template>
<template data-pop="i66-svcr" data-title="Syndrome de vasoconstriction cérébrale réversible">
<h3>Ce qui l’évoque</h3> Une céphalée en coup de tonnerre ; à l’IRM de paroi, un épaississement concentrique peu rehaussé ; une régression à l’imagerie de contrôle. <h3>Pourquoi le distinguer</h3> La régression à l’imagerie de contrôle est ce qui le sépare de l’athérosclérose et de la vasculite. Les sources lues ne détaillent pas son traitement.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a>.</p>
</template>
<template data-pop="i66-moyamoya" data-title="Angiopathie de moyamoya">
<h3>Ce qui l’évoque</h3> Des collatérales basales dites « moyamoya » ; à l’IRM de paroi, un rehaussement concentrique avec diamètre externe réduit. <h3>Prise en charge</h3> Selon l’Organisation européenne (2023), l’antiagrégation est maintenue au long cours dans la forme non hémorragique ; la revascularisation chirurgicale directe ou combinée est discutée selon le retentissement hémodynamique, 6 à 12 semaines après le dernier événement.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37021176/" target="_blank" rel="noopener">ESO, angiopathie de moyamoya 2023</a>.</p>
</template>
<template data-pop="i66-embolie" data-title="Occlusion embolique des artères cérébrales">
<h3>Fréquence</h3> Dans le registre lausannois, 63 % des infarctus du territoire de l’artère cérébrale antérieure avaient une source emboligène cardiaque ou carotidienne. Dans la série cérébelleuse, les grands infarctus des artères cérébelleuses postéro-inférieure et supérieure sont surtout cardio-emboliques. <h3>Conséquence</h3> Quand une artère est occluse sans plaque intracrânienne en cause, la recherche d’une source cardiaque ou carotidienne s’impose ; le traitement d’une sténose intracrânienne ne la remplace pas. Les sources lues ne détaillent pas le bilan cardiaque.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/2302085/" target="_blank" rel="noopener">Bogousslavsky et Regli, Arch Neurol 1990</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8498823/" target="_blank" rel="noopener">Barth et al., Ann Neurol 1993</a>.</p>
</template>
<template data-pop="i66-acm" data-title="Artère cérébrale moyenne (I66.0)">
<h3>Territoire</h3> Le territoire superficiel de l’artère cérébrale moyenne est le plus fréquemment touché parmi les infarctus sylviens. Selon la branche atteinte, la série décrit des troubles de la personnalité et du jugement, de la synchronisation motrice, une désorientation, une hémianopsie ou une héminégligence. <h3>Limite</h3> Ces signes proviennent d’infarctus ; ils ne constituent pas la sémiologie validée de l’accident transitoire.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22377875/" target="_blank" rel="noopener">González Delgado et Bogousslavsky, Front Neurol Neurosci 2012</a>.</p>
</template>
<template data-pop="i66-aca" data-title="Artère cérébrale antérieure (I66.1)">
<h3>Territoire</h3> Hémiparésie, hypoesthésie d’un hémicorps, mutisme initial, aphasie motrice transcorticale, troubles de la réalisation de tâches conflictuelles et troubles de l’humeur ; plus rarement incontinence, grasping, héminégligence, confusion et apraxie gauche unilatérale. L’infarctus de ce territoire représente 1,8 % des accidents vasculaires du registre lausannois. <h3>Cause</h3> 63 % de ces infarctus s’expliquent par une embolie carotidienne ou cardiaque.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/2302085/" target="_blank" rel="noopener">Bogousslavsky et Regli, Arch Neurol 1990</a>.</p>
</template>
<template data-pop="i66-acp" data-title="Artère cérébrale postérieure (I66.2)">
<h3>Territoire superficiel</h3> Hémianopsie (67 %), quadranopsie (22 %), déficit bilatéral (7 %), troubles de mémoire (17,5 %), dysphasie, hallucinations, négligence visuelle, agnosie visuelle, prosopagnosie et dysnomie des couleurs. <h3>Lecture</h3> La vision domine la présentation ; la mémoire arrive ensuite.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/12140669/" target="_blank" rel="noopener">Cals et al., J Neurol 2002</a>.</p>
</template>
<template data-pop="i66-cerebelleuses" data-title="Artères cérébelleuses (I66.3)">
<h3>Trois artères</h3> La partie médiale de l’artère cérébelleuse postéro-inférieure donne un vertige aigu et une ataxie axiale ; sa partie latérale, une instabilité, une ataxie et une dysmétrie des membres sans dysarthrie. L’artère cérébelleuse antéro-inférieure atteint de façon constante les nerfs crâniens (paralysie faciale, trouble sensitif du trijumeau, surdité avec ou sans acouphènes, syndrome vestibulaire) ; son mécanisme est surtout une thrombose sur sténose athéromateuse. L’artère cérébelleuse supérieure donne dysarthrie, instabilité ou vertige, ataxie et dysmétrie ; les formes graves réalisent un syndrome du sommet du tronc basilaire, jusqu’au coma. <h3>Mécanisme</h3> De petits infarctus multiples accompagnent l’athérosclérose vertébro-basilaire (8 cas sur 12 de la série) ; les grands infarctus sont surtout cardio-emboliques.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/8498823/" target="_blank" rel="noopener">Barth et al., Ann Neurol 1993</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/2302529/" target="_blank" rel="noopener">Amarenco et Hauw, Brain 1990</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/2392223/" target="_blank" rel="noopener">Amarenco et Hauw, Neurology 1990</a>.</p>
</template>
<template data-pop="i66-dapt" data-title="Double antiagrégation plaquettaire : ce qu’elle est">
<h3>Définition</h3> Association de deux antiagrégants à mécanismes distincts : ici, l’aspirine et un inhibiteur du récepteur P2Y12, par exemple le clopidogrel. <h3>Recommandation</h3> L’Organisation européenne la recommande comme traitement de choix chez la sténose symptomatique, à maintenir 90 jours (consensus d’experts, preuve faible). Elle est recommandée fortement dans l’accident transitoire non cardio-embolique à haut risque (ABCD2 de 4 ou plus). Au-delà de 90 jours, la bithérapie est déconseillée en prévention secondaire. <h3>Limite suisse</h3> La notice suisse du clopidogrel libelle la monothérapie après accident récent ; la bithérapie après accident ou infarctus n’y est pas une indication libellée.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34414299/" target="_blank" rel="noopener">ESO, accident ischémique transitoire 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36082250/" target="_blank" rel="noopener">ESO, prévention secondaire à long terme 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener">Plavix®, information professionnelle suisse</a>.</p>
</template>
