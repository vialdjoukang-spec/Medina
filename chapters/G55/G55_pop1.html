<template data-pop="g55-codage" data-title="Code de manifestation G55 (astérisque)">
<div class="lab">Définition</div><p>Le code G55 porte le marqueur astérisque : c’est un code de <b>manifestation</b>, toujours associé au code marqué d’une croix (†) de la maladie causale. Le libellé allemand est « Kompression von Nervenwurzeln und Nervenplexus bei anderenorts klassifizierten Krankheiten » ; aucune inclusion ni exclusion n’est listée sous G55 <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G50–G59 (BfArM)</a>.</p>
<div class="lab">Sous-codes et maladie causale associée</div><ul><li><b>G55.0</b> : compression des racines et des plexus nerveux au cours de maladies tumorales, associée aux codes † de C00 à D48.</li><li><b>G55.1</b> : au cours d’atteintes des disques intervertébraux, associée à M50–M51.</li><li><b>G55.2</b> : au cours de spondylarthroses, associée à M47.-.</li><li><b>G55.3</b> : au cours d’autres dorsopathies, associée à M45–M46, M48.- et M53–M54.</li><li><b>G55.8</b> : au cours d’autres maladies classées ailleurs ; aucun code † n’est listé <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G50–G59 (BfArM)</a><a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024 en français (OFS)</a>.</li></ul>
<div class="lab">Limite</div><p>Le code voisin G54.- désigne les maladies des racines et plexus nerveux ; parmi ses exclusions figurent les atteintes des disques (M50–M51) et la spondylose (M47.-), sans renvoi explicite à G55 dans le texte lu <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G50–G59 (BfArM)</a>. La classification utilisée est la CIM-10-GM 2024 ; la cartographie vers la CIM-11 reste à établir.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G50–G59, BfArM</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024 en français, Office fédéral de la statistique</a>.</p></template>
<template data-pop="g55-radiculopathie" data-title="Radiculopathie">
<div class="lab">Définition</div><p>Une radiculopathie est la compression d’une ou de plusieurs racines nerveuses, avec ou sans déficit sensitivomoteur <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>.</p>
<div class="lab">Application</div><p>La radiculopathie lombaire se manifeste par une lombosciatalgie ou une lombocruralgie, la radiculopathie cervicale par une cervicobrachialgie. La racine atteinte se localise par le territoire douloureux, la force musculaire, le réflexe et la sensibilité.</p>
<div class="lab">Limite</div><p>Une radiculopathie sans déficit existe : l’inflammation de la racine suffit à produire la douleur. L’absence de déficit ne permet donc pas d’exclure l’atteinte radiculaire.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a>.</p></template>
<template data-pop="g55-termes" data-title="Lombalgie, lombosciatalgie, lombocruralgie">
<div class="lab">Définitions</div><ul><li><b>Lombalgie</b> : douleur lombaire n’irradiant pas au-delà du pli fessier ; aiguë si elle dure moins de 4 semaines, subaiguë de 4 à 12 semaines <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</li><li><b>Lombosciatalgie</b> : douleur lombaire avec irradiation au membre inférieur par tension radiculaire (signe de Lasègue) ; l’irradiation concerne la fesse, la face postérieure de la cuisse et la jambe <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a><a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</li><li><b>Lombocruralgie</b> : irradiation à la face antérieure de la cuisse et à la crête tibiale <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>.</li></ul>
<div class="lab">Application</div><p>Le trajet de l’irradiation (face antérieure de la cuisse ou face postérieure et jambe) est le premier indice du niveau ; le déficit moteur, le réflexe et la sensibilité le précisent (voir le détail des racines lombaires).</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-hernie-types" data-title="Protrusion, extrusion et séquestre">
<div class="lab">Définition</div><p>La hernie discale lombaire est le déplacement localisé de matériel du noyau pulpeux à travers les fibres déchirées de l’anneau fibreux, dans un contexte de dégénérescence discale <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>.</p>
<div class="lab">Types</div><ul><li><b>Protrusion ou prolapsus</b> : déplacement sous-ligamentaire.</li><li><b>Extrusion</b>, ou hernie « vraie » : déplacement sous-ligamentaire ou extraligamentaire.</li><li><b>Séquestre libre</b> : fragment extraligamentaire <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>.</li></ul>
<div class="lab">Pièges</div><p>La hernie « molle », extrudée ou séquestrée, tend à se résorber ; la gravité de l’image ne prédit pas celle des symptômes. <b>Erreur fréquente</b> : décider d’une intervention sur le seul type de hernie vu à l’imagerie.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a>.</p></template>
<template data-pop="g55-myelopathie" data-title="Myélopathie cervicale">
<div class="lab">Définition</div><p>La myélopathie est une souffrance de la moelle épinière par compression directe ou par diminution de la microvascularisation, avec ischémie secondaire <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<div class="lab">Différence avec la radiculopathie</div><p>La radiculopathie concerne une racine, donc un territoire limité ; la myélopathie atteint la moelle et se manifeste notamment par des troubles mictionnels, une hyperréflexie et un clonus. La myélopathie symptomatique est par elle-même une indication opératoire <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a>.</p></template>
<template data-pop="g55-canal-etroit" data-title="Canal lombaire étroit">
<div class="lab">Définition</div><p>Le canal lombaire étroit est une description radiologique ; sa manifestation clinique est la claudication intermittente neurogène. Le rétrécissement foraminal ne concerne qu’une racine et peut mimer une radiculopathie discale <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>.</p>
<div class="lab">Mécanisme</div><p>Le rétrécissement est dégénératif : protrusion discale large, arthrose zygapophysaire, hypertrophie du ligament jaune, parfois lipomatose épidurale. L’extension du tronc réduit le volume du canal <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a><a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>.</p>
<div class="lab">Limite</div><p>Le rétrécissement existe chez 10 à 15 % des personnes de 40 ans sans symptôme ; l’image seule ne suffit pas <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay et coll., Canal lombaire étroit : clinique, physiopathologie et traitement, Revue Médicale Suisse 2012;8(332):585–589</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer, Eysel, Bredow, The diagnosis and treatment of degenerative changes of the lumbar spine, Deutsches Ärzteblatt International 2025;122(9):249–256</a>.</p></template>
<template data-pop="g55-queue-cheval" data-title="Syndrome de la queue de cheval">
<div class="lab">Définition</div><p>Le syndrome de la queue de cheval est l’apparition de troubles sphinctériens par compression des racines sacrées : rétention urinaire ou incontinence par regorgement, parésie des membres inférieurs de degré divers, anesthésie en selle <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Épidémiologie</div><p>Il concerne environ 2 % des hernies discales lombaires <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a> et 0,04 % des lombalgiques <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Conduite</div><p>La décompression chirurgicale est immédiate, entre 24 et 48 heures. Les symptômes s’installent en moins de 24 heures chez 89 % des patients ; le retard est surtout imputable au médecin dans 20 cas sur 24 <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a>.</p>
<div class="lab">Piège</div><p>L’absence de rétention urinaire rend le diagnostic très improbable (environ 1 sur 10 000), mais la définition inclut l’incontinence par regorgement. <b>Erreur fréquente</b> : ne pas examiner la sensibilité périanale.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et coll., Lumbar disc herniation, the significance of symptom duration for the indication for surgery, Deutsches Ärzteblatt International 2024;121(13):440–448</a>.</p></template>
<template data-pop="g55-hyperalgique" data-title="Sciatique hyperalgique">
<div class="lab">Définition</div><p>La lombosciatique hyperalgique est une douleur insupportable, résistant aux antalgiques de palier 3 de l’Organisation mondiale de la santé, qui empêche toute activité <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Conduite</div><p>C’est l’un des trois syndromes de sciatique à adresser en urgence. Un traitement bien conduit est d’abord essayé pendant 6 à 8 jours, avec le paracétamol, puis les anti-inflammatoires, puis le palier 3 et les infiltrations épidurales après 5 à 10 jours <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-paralysante" data-title="Sciatique paralysante">
<div class="lab">Définition</div><p>La lombosciatique paralysante est un déficit moteur d’emblée inférieur à 3 sur l’échelle du Medical Research Council, ou la progression d’un déficit moteur. Elle représente 3 % des sciatiques et 11 à 14 % des sciatiques opérées ; la racine L5 est atteinte dans 75 % des cas, et l’installation prend moins de 15 jours dans 80 % des cas <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Quatre situations</div><table class="t"><thead><tr><th>Situation</th><th>Signification</th></tr></thead><tbody><tr><td>Parésie isolée de l’extenseur propre du gros orteil (L5)</td><td>Fréquente, bon potentiel de récupération, pas une indication opératoire</td></tr><tr><td>Déficit sur l’ensemble du territoire L5</td><td>Chirurgie si aggravation claire ou douleurs intolérables</td></tr><tr><td>Début apoplectique, déficit brutal après une phase hyperalgique</td><td>Pas de corrélation entre gravité et taille de la hernie ; ischémie radiculaire très probable ; la disparition de la douleur est de mauvais pronostic neurologique</td></tr><tr><td>Aggravation d’un déficit déjà présent</td><td>Chirurgie indiquée</td></tr></tbody></table>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-mrc" data-title="Échelle du Medical Research Council">
<div class="lab">Définition</div><p>L’échelle cote la force musculaire de 0 à 5 : 5 sur 5 est normal, 4 sur 5 correspond à une faiblesse légère, 3 sur 5 à une faiblesse modérée, et 2 sur 5 ou moins à une faiblesse sévère <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a>.</p>
<div class="lab">Application</div><p>Les décisions s’alignent sur cette échelle : cotation inférieure ou égale à 3 sur 5, chirurgie si possible dans les 3 jours ; cotation de 4 sur 5, chirurgie précoce seulement si la gêne fonctionnelle est importante <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et coll., Lumbar disc herniation, the significance of symptom duration for the indication for surgery, Deutsches Ärzteblatt International 2024;121(13):440–448</a>.</p></template>
<template data-pop="g55-scores" data-title="Scores des métastases rachidiennes">
<div class="lab">Définition</div><p>Les recommandations britanniques demandent d’utiliser un score de stabilité validé, par exemple le Spinal Instability Neoplastic Score, et un score pronostique validé, par exemple le score de Tokuhashi révisé. Les deux scores s’intègrent toujours à l’évaluation clinique <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<div class="lab">Limite</div><p>Le dossier ne détaille ni les items ni les seuils de ces scores ; ils ne sont donc pas reproduits. Le grade de compression de Bilsky est cité dans une revue narrative <a href="https://pubmed.ncbi.nlm.nih.gov/40666548/" target="_blank" rel="noopener">Cureus 2025</a>.</p>
<p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE, Spinal metastases and metastatic spinal cord compression (NG234)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40666548/" target="_blank" rel="noopener">Current advancements in the diagnosis and treatment of metastatic spinal cord compression, revue, Cureus 2025</a>.</p></template>
<template data-pop="g55-degenerescence" data-title="Dégénérescence discale">
<div class="lab">Mécanisme</div><p>La dégénérescence est multifactorielle : mécanique, nutritionnelle, traumatique, génétique. Les médiateurs inflammatoires fragilisent la structure. Les facteurs génétiques semblent plus déterminants que les charges sportives ou professionnelles ; le tabac et le stress augmentent le risque <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>.</p>
<div class="lab">Fréquence</div><p>Elle touche 85 à 95 % des adultes autopsiés après 50 ans <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>. Elle ne désigne donc pas, à elle seule, la cause d’une douleur.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a>.</p></template>
<template data-pop="g55-ngf" data-title="Facteur de croissance nerveuse">
<div class="lab">Définition</div><p>Le facteur de croissance nerveuse, en anglais nerve growth factor, est une molécule signalée avec les cytokines pro-inflammatoires comme jouant un rôle majeur dans la douleur radiculaire <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<div class="lab">Limite</div><p>La source lue n’en détaille ni la source cellulaire ni la cible thérapeutique ; le dossier ne documente aucun traitement dirigé contre lui.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a>.</p></template>
<template data-pop="g55-fibres" data-title="Fibres sensitives puis motrices">
<div class="lab">Mécanisme</div><p>Sous compression, la conduction se perturbe d’abord dans les fibres sensitives, puis dans les fibres motrices. À la décompression, les fibres motrices récupèrent plus vite et plus complètement <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Application</div><p>Les paresthésies précèdent la faiblesse. Un début apoplectique traduit une ischémie radiculaire probable ; la disparition de la douleur avec un déficit est de mauvais pronostic <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Erreur fréquente</div><p>Se rassurer devant l’arrêt d’une douleur sans refaire l’examen de la force.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-resorption" data-title="Résorption spontanée de la hernie">
<div class="lab">Fait</div><p>La hernie « molle », extrudée ou séquestrée, tend à se résorber <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>. Une régression radiologique est observée chez 70 % des patients à 6–12 mois <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a> ; à 6 mois, chez deux patients sur trois, sans corrélation avec la clinique <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Conséquence</div><p>La résorption justifie le traitement conservateur initial. Elle ne justifie pas de répéter l’imagerie pour juger de l’évolution, puisqu’elle ne suit pas la clinique.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale lombaire : diagnostic et prise en charge, Revue Médicale Suisse 2014;10(454):2376–2382</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola et coll., Hernie discale cervicale : diagnostic et prise en charge, Revue Médicale Suisse 2015;11(492):2023–2029</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a>.</p></template>
<template data-pop="g55-plexopathie-radique" data-title="Plexopathie radique">
<div class="lab">Mécanisme</div><p>La plexopathie radique résulte d’une fibrose péri-plexuelle progressive ou d’une lésion neurale directe avec démyélinisation, débutant des mois à des années après la radiothérapie <a href="https://pubmed.ncbi.nlm.nih.gov/39570222/" target="_blank" rel="noopener">Mosa 2025</a>.</p>
<div class="lab">Clinique</div><p>Après un cancer du sein, la lésion est chronique et irréversible, plus fréquente si les aires axillaires et sus-claviculaires ont été irradiées. Les paresthésies progressent vers la faiblesse de la main, de la partie distale vers la partie proximale ; elle peut survenir jusqu’à 20 ans ou plus après l’irradiation <a href="https://pubmed.ncbi.nlm.nih.gov/37272709/" target="_blank" rel="noopener">Harris 2023</a>.</p>
<div class="lab">Limite</div><p>Ces deux sources sont des résumés non européens ; elles décrivent le mécanisme et ne fondent pas de conduite thérapeutique. La distinction avec la plexopathie métastatique est difficile à l’imagerie.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37272709/" target="_blank" rel="noopener">Harris, Brachial plexopathy after breast cancer : a persistent late effect of radiotherapy, Physical Medicine and Rehabilitation 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39570222/" target="_blank" rel="noopener">Mosa et coll., Radiation plexopathy, Journal of Hand Surgery 2025;50(2):216–221</a>.</p></template>
<template data-pop="g55-plexopathie-metastatique" data-title="Plexopathie métastatique">
<div class="lab">Fait</div><p>La plexopathie métastatique touche surtout des patients atteints de cancer du poumon ou du sein. Elle peut se présenter comme une plexopathie radique, et l’imagerie par résonance magnétique ne les distingue pas toujours ; la tomographie par émission de positons au fluorodésoxyglucose a établi le diagnostic dans un cas publié <a href="https://pubmed.ncbi.nlm.nih.gov/42273821/" target="_blank" rel="noopener">Ann Palliat Med 2026</a>.</p>
<div class="lab">Épidémiologie</div><p>La propagation périneurale d’un cancer du sein au plexus brachial a été observée chez 0,4 % des patients (42 sur 10 466) dans une série d’un seul centre <a href="https://pubmed.ncbi.nlm.nih.gov/37992580/" target="_blank" rel="noopener">Wu 2023</a>.</p>
<div class="lab">Limite</div><p>Les données sont des résumés et des cas isolés ; aucune recommandation européenne de traitement n’a été lue.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/42273821/" target="_blank" rel="noopener">Metastatic brachial plexopathy presenting as radiation-induced plexopathy in metastatic lung cancer, Annals of Palliative Medicine 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37992580/" target="_blank" rel="noopener">Wu et coll., Perineural breast cancer spread to the brachial plexus in men, Journal of Plastic, Reconstructive and Aesthetic Surgery 2023</a>.</p></template>
<template data-pop="g55-pancoast" data-title="Tumeur de l’apex pulmonaire">
<div class="lab">Définition</div><p>La tumeur de l’apex pulmonaire, ou tumeur de Pancoast, envahit le plexus brachial et le rachis. Dans le cas rapporté, elle s’est présentée par une douleur cervicale <a href="https://pubmed.ncbi.nlm.nih.gov/35797264/" target="_blank" rel="noopener">Am J Case Rep 2022</a>.</p>
<div class="lab">Application</div><p>Une douleur cervicale ou d’épaule associée à une atteinte neurologique du membre supérieur impose de chercher une cause tumorale, dont la tumeur de l’apex pulmonaire fait partie.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35797264/" target="_blank" rel="noopener">Pancoast tumor presenting as neck pain, cas clinique et revue, American Journal of Case Reports 2022</a>.</p></template>
<template data-pop="g55-endometriose" data-title="Endométriose extragénitale (G55.8)">
<div class="lab">Fait</div><p>L’endométriose extragénitale peut atteindre un nerf et se présenter souvent par une sciatique <a href="https://pubmed.ncbi.nlm.nih.gov/35477509/" target="_blank" rel="noopener">Lukac 2022</a>. Cet exemple est le seul retenu pour le groupe G55.8, dont la classification ne liste aucun exemple.</p>
<div class="lab">Limite</div><p>La source n’est lue qu’au niveau du résumé. Le diagnostic reste exceptionnel et se discute après les causes fréquentes.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35477509/" target="_blank" rel="noopener">Lukac et coll., Extragenital endometriosis in the differential diagnosis of non-gynecological diseases, Deutsches Ärzteblatt International 2022;119:361–367</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G50–G59, BfArM</a>.</p></template>
<template data-pop="g55-signaux-alerte" data-title="Signaux d’alerte d’une lombalgie ou d’une lombosciatalgie">
<div class="lab">Liste (tableau 1 de la revue suisse de 2010)</div><ul><li>Âge inférieur à 20 ans ou supérieur à 50 ans</li><li>Traumatisme récent</li><li>Douleur constante, progressive, non mécanique</li><li>Douleur thoracique</li><li>Fièvre</li><li>Antécédent de cancer</li><li>Ostéoporose ou corticothérapie prolongée</li><li>Immunodéficience</li><li>Toxicomanie par voie intraveineuse</li><li>Altération de l’état général, perte de poids</li><li>Symptômes neurologiques : parésie, troubles sphinctériens, anesthésie en selle</li><li>Douleur élective sur une vertèbre, douleur à la percussion d’une loge rénale, infection cutanée <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a></li></ul>
<div class="lab">Limite</div><p>Une revue de 21 recommandations a recensé 46 signaux ; les signaux urgents sont le cancer, l’infection (protéine C-réactive élevée sans autre cause, immunosuppression), un déficit inférieur ou égal à 3 sur 5, l’anesthésie en selle, les troubles sphinctériens aigus et le traumatisme <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer, Eysel, Bredow, The diagnosis and treatment of degenerative changes of the lumbar spine, Deutsches Ärzteblatt International 2025;122(9):249–256</a>.</p></template>
<template data-pop="g55-ant-cancer" data-title="Antécédent de cancer et de radiothérapie">
<div class="lab">Fait</div><p>Dans une série de près de 2000 patients atteints de cancer, tous avaient au moins un des quatre critères suivants : âge supérieur à 50 ans, perte de poids inexpliquée, antécédent tumoral, échec du traitement conservateur <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="lab">Conséquence</div><p>Un cancer connu ou suspecté, avec douleur sévère et continue, progressive, aggravée par l’effort de poussée, nocturne, ou avec symptômes neurologiques, oriente vers la compression médullaire métastatique. L’antécédent de radiothérapie, surtout axillaire et sus-claviculaire, oriente vers la plexopathie radique <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a><a href="https://pubmed.ncbi.nlm.nih.gov/37272709/" target="_blank" rel="noopener">Harris 2023</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et coll., Quand référer aux urgences un patient présentant une lombalgie ou lombosciatalgie aiguë, Revue Médicale Suisse 2010;6(259):1540–1545</a> ; <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE, Spinal metastases and metastatic spinal cord compression (NG234)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37272709/" target="_blank" rel="noopener">Harris, Brachial plexopathy after breast cancer : a persistent late effect of radiotherapy, Physical Medicine and Rehabilitation 2023</a>.</p></template>
<template data-pop="g55-claudication" data-title="Claudication neurogène et vasculaire">
<div class="lab">Claudication neurogène</div><p>Après 50 ans, elle est bilatérale et relativement symétrique, avec fatigue, paresthésies et crampes. Elle est pire en descente et soulagée par l’appui antéfléchi et la position assise <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>.</p>
<div class="lab">Comparaison</div><p>Le vélo n’est typiquement pas limité dans la claudication neurogène, ce qui la distingue de l’artériopathie ; le périmètre de marche et la palpation des pouls complètent la distinction <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a>.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay et coll., Canal lombaire étroit : clinique, physiopathologie et traitement, Revue Médicale Suisse 2012;8(332):585–589</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer, Eysel, Bredow, The diagnosis and treatment of degenerative changes of the lumbar spine, Deutsches Ärzteblatt International 2025;122(9):249–256</a>.</p></template>
<template data-pop="g55-nice-msc" data-title="Facteurs évoquant une compression médullaire métastatique">
<div class="lab">Contexte</div><p>Cancer connu ou suspecté.</p>
<div class="lab">Douleur évocatrice des métastases</div><p>Douleur sévère et continue, progressive, mécanique, aggravée par l’effort de poussée (toux, éternuement, défécation), nocturne, avec sensibilité localisée, claudication.</p>
<div class="lab">Compression</div><p>Troubles vésicaux ou intestinaux, troubles de la marche, faiblesse, signes médullaires ou de queue de cheval, troubles sensitifs, douleur radiculaire <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<div class="lab">Conséquence</div><p>Chez un patient atteint de cancer avec symptômes ou signes de compression, l’imagerie par résonance magnétique est demandée en urgence, dans les 24 heures.</p>
<p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE, Spinal metastases and metastatic spinal cord compression (NG234)</a>.</p></template>
