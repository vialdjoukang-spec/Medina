
<!-- ===== FENÊTRES I00 : prévention, suivi, aides pédagogiques ===== -->
<template data-pop="i00-educ" data-title="Éducation du patient et de sa famille">
<div class="lab">Messages essentiels</div><p>1. Le cœur peut être abîmé par de nouvelles angines. 2. L’injection empêche ces angines ; elle ne soigne pas les douleurs. 3. Chaque injection doit être faite à la date prévue, même en bonne santé. 4. La durée se compte en années.</p>
<div class="lab">Outils</div><p>Carnet ou calendrier d’injections, rappel par message, carte à présenter en cas de consultation ailleurs.</p>
<div class="lab">Communication</div><p>Interprète professionnel ; vérifier la compréhension en faisant reformuler.</p>
<div class="lab">Autres points</div><p>Consulter pour tout mal de gorge, car une angine streptococcique non traitée peut déclencher une récidive, et pour toute fièvre prolongée, qui peut révéler une endocardite. Soins dentaires réguliers, car une infection dentaire libère des bactéries dans le sang, qui peuvent se fixer sur une valve lésée. Informer avant une grossesse, car la hausse du débit cardiaque peut décompenser une valvulopathie, et certains traitements doivent être adaptés.</p></template>

<template data-pop="i00-goal" data-title="Essai GOAL (2022)">
<div class="lab">Question</div><p>La pénicilline G benzathine empêche-t-elle la progression de la cardiopathie rhumatismale latente, découverte par dépistage chez l’enfant asymptomatique ?</p>
<div class="lab">Méthode</div><p>Essai randomisé en Ouganda, 916 enfants et jeunes de 5 à 17 ans porteurs d’une atteinte limite ou définie légère (critères WHF 2012). Injection toutes les quatre semaines pendant deux ans, contre absence de prophylaxie.</p>
<div class="lab">Résultat</div><p>Progression échocardiographique à deux ans : 0,8 % sous prophylaxie contre 8,2 % sans prophylaxie ; il faut traiter 13 enfants pendant deux ans pour éviter une progression. Une seule réaction anaphylactique, légère, est survenue, soit moins de 0,1 % des injections.</p>
<div class="lab">Portée</div><p>Justifie la prophylaxie des atteintes légères découvertes par dépistage (stade B, et discussion au stade A de la WHF 2023) et le dépistage échocardiographique recommandé par l’OMS 2024.</p></template>

<template data-pop="i00-bpg-suisse" data-title="Pénicilline G benzathine en Suisse : Extencilline®">
<div class="lab">Statut</div><p>Extencilline® (autorisation Swissmedic 69765), poudre et solvant pour suspension injectable à 1,2 et 2,4 millions d’UI, est autorisée en Suisse. Son autorisation repose sur celle d’un produit identique autorisé par l’autorité néerlandaise ; l’information suisse précise que son efficacité et sa sécurité n’ont été contrôlées que sommairement par Swissmedic. Elle cite expressément la prophylaxie du rhumatisme articulaire aigu, de la chorée et de la cardiopathie rhumatismale.</p>
<div class="lab">Approvisionnement</div><p>Le 13.08.2026, Swissmedic a autorisé pour une durée limitée la distribution de la présentation française, en raison d’une rupture de la présentation suisse. La situation se vérifie au moment de la prescription.</p>
<div class="lab">Conséquences</div><p>Anticiper la commande dès le diagnostic ; prévoir le relais par pénicilline orale en cas de rupture ; vérifier la prise en charge par l’assurance obligatoire, que ce cours n’a pas pu vérifier dans la liste des spécialités.</p>
<div class="lab">Contexte mondial</div><p>Les ruptures d’approvisionnement sont fréquentes, car la production est peu rentable (OMS, aide-mémoire 2025).</p>
<div class="lab">Source</div><p>Information professionnelle suisse d’Extencilline®, Swissmedic (AIPS), mise à jour de mai 2025, consultée le 08.10.2026 ; Swissmedic, avis de rupture de stock d’Extencilline, 13.08.2026.</p></template>

<template data-pop="i00-remedy" data-title="Registre REMEDY">
<div class="lab">Description</div><p>Registre prospectif international de patients porteurs d’une cardiopathie rhumatismale dans des pays à revenu faible ou intermédiaire, surtout en Afrique et en Asie (publications de 2015 et 2016).</p>
<div class="lab">Résultats principaux</div><p>Patients jeunes, majoritairement des femmes ; faible couverture de la prophylaxie et de l’anticoagulation ; mortalité proche d’un sur six à deux ans, plus élevée en cas d’insuffisance cardiaque et d’atteinte sévère.</p>
<div class="lab">Portée</div><p>La cardiopathie rhumatismale est une maladie mortelle de l’adulte jeune, et l’accès aux soins détermine son pronostic.</p></template>

<template data-pop="i00-mnemo-jones" data-title="« J, ♥, N, E, S » : les cinq critères majeurs">
<p><i>Aide pédagogique, non critère officiel.</i></p>
<div class="lab">Lecture</div><p><b>J</b> : <i>joints</i>, les articulations (arthrite). <b>♥</b> : le cœur (cardite, clinique ou infraclinique). <b>N</b> : nodules sous-cutanés. <b>E</b> : érythème marginé. <b>S</b> : chorée de Sydenham.</p>
<div class="lab">Complément</div><p>Les critères mineurs regroupent ce qui témoigne d’une inflammation sans la localiser : fièvre, arthralgie, marqueurs biologiques, PR allongé.</p>
<div class="lab">Limite</div><p>L’aide-mémoire ne dit pas que l’atteinte articulaire majeure dépend de la population : polyarthrite seule à bas risque ; mono- ou polyarthrite et polyarthralgie à risque modéré ou élevé. L’élargissement augmente la sensibilité là où la maladie est fréquente, car la monoarthrite et la polyarthralgie y sont des présentations courantes du rhumatisme.</p></template>

<template data-pop="i00-mnemo-duree" data-title="« 5-21, 10-21, 10-40 » : durées de la prophylaxie">
<p><i>Aide pédagogique, non critère officiel.</i></p>
<div class="lab">Lecture</div><p>Premier nombre : années après le dernier épisode. Second nombre : âge jusqu’auquel poursuivre. On retient la plus longue des deux durées.</p>
<div class="lab">Trois catégories</div><p><b>5-21</b> : rhumatisme sans cardite. <b>10-21</b> : cardite guérie, sans séquelle valvulaire. <b>10-40</b> : cardite avec atteinte valvulaire persistante ; parfois à vie.</p>
<div class="lab">Source</div><p>Information professionnelle suisse d’Extencilline® (mai 2025), qui fixe ces trois durées : sans atteinte cardiaque, au moins 5 ans ou jusqu’à 21 ans ; atteinte cardiaque transitoire, au moins 10 ans ou jusqu’à 21 ans ; atteinte cardiaque persistante, au moins 10 ans ou jusqu’à 40 ans. La WHF 2023 et l’OMS 2024 adaptent la décision au stade échocardiographique et, chez l’adulte, à l’exposition au streptocoque.</p>
<div class="lab">Pourquoi deux nombres</div><p>Le risque de récidive dépend de deux facteurs indépendants. Il dépend d’abord du temps écoulé depuis la poussée : dans une cohorte australienne, 4 % de récidives la première année, 10 % à cinq ans, puis un risque faible après dix ans. Il dépend ensuite de l’âge : les récidives deviennent moins fréquentes à partir de 21 ans, quand les angines streptococciques, surtout fréquentes entre 5 et 15 ans, se raréfient. La durée la plus longue couvre les deux risques.</p>
<div class="lab">Pourquoi la cardite allonge la durée</div><p>Les récidives reproduisent souvent le premier épisode : un patient qui a fait une cardite en refera probablement une, sur une valve déjà lésée.</p>
<div class="lab">Source complémentaire</div><p>Recommandations australiennes 2025, chapitre 10, durée de la prophylaxie secondaire ; OMS 2024, section 4.7.3 (risque de récidive maximal la première année).</p>
</template>

<template data-pop="i00-duree-angine" data-title="Durée du traitement de l’angine : 6 ou 10 jours ? Arbitrage">
<div class="lab">Société suisse d’infectiologie, 2024</div><p>Recommandation « Pharyngite », validée le 08.05.2024 : pénicilline V, amoxicilline, céfuroxime, clarithromycine ou clindamycine pendant 6 jours, durée uniforme fondée sur la guérison clinique ; la preuve d’une durée de 10 jours est jugée insuffisante. Justification avancée : le rhumatisme a pratiquement disparu en Europe.</p>
<div class="lab">Informations professionnelles suisses</div><p>Ospen® (mars 2024) : au moins 10 jours dans les infections à streptocoques ; amoxicilline : au moins dix jours pour éviter le rhumatisme articulaire aigu et la glomérulonéphrite ; Klaciped® et Dalacin® C : au moins 10 jours dans la pharyngite streptococcique.</p>
<div class="lab">OMS 2024</div><p>Elle recommande la pénicilline pour prévenir le rhumatisme, sans fixer de durée ; les revues qu’elle cite comparent 2 à 6 jours et 10 jours sur la guérison, sans données suffisantes sur les complications.</p>
<div class="lab">Choix retenu</div><p>Patient autochtone sans antécédent : 6 jours (SSI 2024, source la plus récente et propre à la pratique suisse), car l’objectif est symptomatique. Patient venu d’une région endémique, antécédent de rhumatisme ou cardiopathie rhumatismale : 10 jours de pénicilline orale, conformément aux informations professionnelles suisses, ou une injection unique de pénicilline G benzathine, car l’objectif est la prévention du rhumatisme, que la SSI n’évalue pas.</p>
<div class="lab">Textes en vigueur</div><p>SSI : ssi.guidelines.ch/guideline/2408 ; informations professionnelles : AIPS de Swissmedic, version du 08.10.2026.</p></template>

<template data-pop="i00-test-allergie" data-title="Test d’allergie avant la pénicilline G benzathine : arbitrage">
<div class="lab">Information professionnelle suisse d’Extencilline®</div><p>« Si possible », un test d’hypersensibilité devrait être pratiqué avant le traitement ; surveillance d’au moins une demi-heure après l’injection. Ce passage provient du texte néerlandais de janvier 2021 sur lequel repose l’autorisation suisse.</p>
<div class="lab">OMS 2024</div><p>Déclaration de bonne pratique : ne pas faire de test d’allergie chez un patient sans antécédent d’allergie aux pénicillines qui reçoit la pénicilline G benzathine en prévention secondaire. Recommandation 6 : une dose test orale peut précéder l’injection en cas d’antécédent léger, sans anaphylaxie, angio-œdème ni réaction cutanée grave.</p>
<div class="lab">Choix retenu</div><p>Patient sans antécédent : pas de test systématique, conformément à l’OMS 2024, plus récente et propre à la prophylaxie ; surveillance d’une demi-heure, conformément à l’information suisse. Antécédent léger : dose test orale. Antécédent grave ou allergie au soja ou à l’arachide : pas d’Extencilline®, avis d’allergologie et macrolide si l’allergie est confirmée.</p>
<div class="lab">Pourquoi la prudence</div><p>Dans la grande étude internationale citée par l’OMS, des réactions allergiques sont survenues après 3,2 % des injections et une anaphylaxie après environ 0,2 % ; un dépôt intramusculaire ne peut plus être retiré une fois injecté.</p></template>
