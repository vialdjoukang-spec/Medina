<section class="ilot" id="i00-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un garçon de 12 ans, arrivé d’Érythrée avec sa famille il y a huit mois, est amené aux urgences pédiatriques. Depuis cinq jours, il a de la fièvre et des douleurs articulaires qui se déplacent : le genou droit, puis la cheville gauche, puis le poignet. Chaque articulation est rouge, chaude et si douloureuse qu’il refuse le contact du drap. À l’auscultation, on entend un souffle systolique à la pointe. Trois semaines plus tôt, il avait mal à la gorge.</p>
<p>La question qui structure le chapitre est la suivante : <b>s’agit-il d’un rhumatisme articulaire aigu, le cœur est-il atteint, que faut-il traiter maintenant, et comment éviter que ce premier épisode ne devienne, en vingt ans, un rétrécissement mitral opéré ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait appliquer les critères de Jones révisés en choisissant la bonne population de référence. Il sait prouver l’infection streptococcique récente, chercher une cardite clinique ou infraclinique par échocardiographie, traiter la poussée, reconnaître une chorée de Sydenham et prescrire une prévention secondaire par pénicilline G benzathine avec la bonne dose, le bon intervalle et la bonne durée. Il sait aussi situer l’angine streptococcique dans la pratique suisse, où le rhumatisme est devenu rare, sans oublier les patients venus des régions où il reste fréquent.</p>
<div class="key"><b>Prérequis.</b> Le <button class="w" data-k="i00-mimetisme">mimétisme moléculaire (protéine M et protéines de l’hôte)</button>, la <button class="w" data-k="i00-strepto">biologie du streptocoque du groupe A (paroi, toxines, marqueurs sérologiques)</button> et l’<button class="w" data-k="i00-sa-valve">anatomie de l’appareil valvulaire mitral et aortique (cibles de la cardite)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales. Les valvulopathies rhumatismales chroniques sont traitées dans les chapitres I34 (valve mitrale) et I35 (valve aortique).</div>
</section>

<section class="ilot" id="i00-1"><h2><span class="n">1</span>Définitions, codage et classifications</h2>
<p>Le <b>rhumatisme articulaire aigu</b> (RAA) est une maladie inflammatoire <b>non suppurée</b> qui survient deux à quatre semaines après une pharyngite à streptocoque β-hémolytique du groupe A (<i>Streptococcus pyogenes</i>). Le streptocoque n’est plus présent dans les organes atteints : ce sont les anticorps et les lymphocytes dirigés contre lui qui reconnaissent par erreur des tissus de l’hôte. Les organes cibles sont les articulations, le cœur, le cerveau, la peau et le tissu sous-cutané. Les lésions articulaires, cutanées et cérébrales guérissent sans séquelle. Les lésions valvulaires peuvent persister et s’aggraver à chaque récidive : c’est la <b>cardiopathie rhumatismale chronique</b>.</p>
<p>Cette asymétrie a une portée pratique : l’arthrite, la manifestation la plus bruyante, est pronostiquement bénigne ; la cardite, souvent silencieuse, décide de l’avenir du patient.</p>
<h3>1.1 Codage CIM-10-GM</h3>
<table class="t"><tr><th>Code</th><th>Libellé</th><th>Remarque d’usage</th></tr>
<tr><td>I00</td><td>Rhumatisme articulaire aigu sans mention d’atteinte cardiaque</td><td>Arthrite rhumatismale aiguë ou subaiguë ; l’échocardiographie doit avoir exclu une cardite</td></tr>
<tr><td>I01</td><td>Rhumatisme articulaire aigu avec atteinte cardiaque</td><td>I01.0 péricardite ; I01.1 endocardite (valvulite) ; I01.2 myocardite ; I01.8 autres atteintes cardiaques aiguës, dont la pancardite ; I01.9 sans précision</td></tr>
<tr><td>I02</td><td>Chorée rhumatismale (chorée de Sydenham)</td><td>I02.0 avec atteinte cardiaque ; I02.9 sans atteinte cardiaque</td></tr>
<tr><td>I05–I09</td><td>Cardiopathies rhumatismales chroniques</td><td>Voir chapitres I34 (mitrale, tricuspide, polyvalvulopathies) et I35 (aortique)</td></tr></table>
<h3>1.2 Premier épisode, récidive, formes possibles</h3>
<p>Le diagnostic distingue le <b>premier épisode</b> et la <b>récidive</b> chez un patient qui a déjà eu un rhumatisme ou qui porte une cardiopathie rhumatismale. Cette distinction change les critères exigés : une récidive se reconnaît avec moins d’arguments, car la probabilité avant le test est plus élevée. Le détail figure à l’îlot 7. Lorsque les critères sont incomplets, les recommandations australiennes 2020 parlent de rhumatisme probable ou possible ; ces catégories et leur conduite sont détaillées à l’îlot 7.3.</p>
<h3>1.3 Deux populations de référence</h3>
<p>Les <button class="w" data-k="i00-jones">critères de Jones révisés (AHA 2015, tableau complet)</button> ne s’appliquent pas de la même façon partout. L’American Heart Association définit une <b>population à bas risque</b> par une incidence du rhumatisme ≤ 2 pour 100 000 enfants d’âge scolaire par an, ou une prévalence de la cardiopathie rhumatismale ≤ 1 pour 1 000 habitants tous âges confondus. Toute autre population est dite <b>à risque modéré ou élevé</b>. Dans ce second groupe, les critères sont assouplis pour gagner en sensibilité.</p>
<div class="trap"><span class="k">Piège</span>La Suisse est une population à bas risque, mais le patient ne l’est pas forcément. L’AHA précise qu’un patient issu d’une population à risque modéré ou élevé doit être évalué avec les critères de ce groupe, même s’il consulte dans un pays à bas risque. L’enfant érythréen de l’îlot 0 relève donc des critères assouplis.</div>
<h3>1.4 Stades échocardiographiques de la cardiopathie rhumatismale (WHF 2023)</h3>
<p>La World Heart Federation classe l’atteinte valvulaire vue à l’échocardiographie en quatre stades, qui orientent la prophylaxie et le suivi. Le détail des critères figure dans la fiche <button class="w" data-k="i00-whf">critères échocardiographiques de la WHF 2023 (stades A à D)</button>.</p>
<p>Les stades A et B forment la cardiopathie rhumatismale précoce (anciennement « limite » et « définie légère » de la WHF 2012) ; les stades C et D, la cardiopathie avancée.</p>
<div class="two">
<div class="card"><h4>Stade A — atteinte précoce, fuite isolée</h4><p>Jusqu’à 20 ans seulement. Fuite mitrale ou aortique pathologique discrète, sans anomalie morphologique. Risque de progression faible.</p></div>
<div class="card"><h4>Stade B — atteinte précoce, fuite et morphologie</h4><p>Tout âge. Fuite pathologique et anomalies morphologiques, ou fuites mitrale et aortique pathologiques associées. Risque de progression modéré à élevé.</p></div>
<div class="card"><h4>Stade C — atteinte avancée</h4><p>Fuite modérée ou sévère, tout rétrécissement mitral ou aortique, hypertension pulmonaire ou baisse de la fonction ventriculaire gauche.</p></div>
<div class="card"><h4>Stade D — atteinte avancée compliquée</h4><p>Mêmes anomalies que le stade C, avec une complication clinique : insuffisance cardiaque, arythmie, accident vasculaire cérébral, indication chirurgicale.</p></div></div>
</section>

<section class="ilot" id="i00-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Selon l’Organisation mondiale de la santé (OMS, aide-mémoire du 24.01.2025), la cardiopathie rhumatismale touche environ <b>55 millions de personnes</b> et cause environ <b>360 000 décès par an</b>. C’est la cardiopathie acquise la plus fréquente avant 25 ans. Elle reste endémique en Afrique subsaharienne, en Asie occidentale, en Asie centrale et du Sud, dans le Pacifique Sud et dans certaines populations défavorisées des pays à haut revenu (populations aborigènes d’Australie, populations maories et océaniennes).</p>
<p>La première poussée survient surtout entre <b>5 et 15 ans</b>. Elle est rare avant 3 ans et après 30 ans, car l’exposition répétée au streptocoque et la maturation immunitaire sont nécessaires. Les récidives, elles, surviennent à tout âge ; elles sont les plus fréquentes dans les cinq années qui suivent le premier épisode. La cardiopathie chronique qui en résulte est une maladie de l’adulte jeune et de la femme en âge de procréer.</p>
<p>Dans les pays à haut revenu, l’incidence a chuté au cours du vingtième siècle, avant même l’arrivée de la pénicilline. Cette baisse est attribuée à l’amélioration du logement, à la réduction de la promiscuité et à l’accès aux soins, puis au traitement antibiotique des angines. Le rhumatisme est ainsi devenu une <button class="w" data-k="i00-pauvrete">maladie de la pauvreté (promiscuité, accès aux soins, pénicilline)</button>.</p>
<h3>2.1 En Suisse</h3>
<p>Le rhumatisme articulaire aigu est devenu exceptionnel chez les enfants nés et élevés en Suisse. Les cas observés concernent surtout des enfants et des adolescents arrivés récemment de régions endémiques (Corne de l’Afrique, Afghanistan, Syrie, Asie du Sud). Chez l’adulte migrant, on rencontre surtout la cardiopathie rhumatismale chronique, souvent découverte par un souffle ou lors d’une grossesse, sans souvenir de poussée aiguë.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Le rhumatisme articulaire aigu ne figure pas parmi les maladies à déclaration obligatoire de l’Office fédéral de la santé publique (OFSP), et il n’existe pas de registre suisse publié. Aucune incidence suisse chiffrée ne peut donc être donnée. Les données ci-dessus sont celles de l’OMS.</div>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure qu’une maladie « disparue » en Suisse n’a pas sa place dans le diagnostic différentiel. Devant une arthrite fébrile migratrice ou un souffle nouveau chez un enfant ou un adolescent venu d’une région endémique, le rhumatisme est un diagnostic de première ligne.</div>

<section class="ilot" id="i00-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie suit une chaîne en cinq maillons : <b>pharyngite streptococcique → réponse immunitaire contre le streptocoque → réaction croisée avec des protéines de l’hôte → inflammation des organes cibles → cicatrice valvulaire, aggravée à chaque récidive.</b> Chaque maillon explique un geste clinique.</p>
<h3>3.1 L’infection initiale</h3>
<p>Le streptocoque du groupe A colonise le pharynx et provoque une angine. Chez un hôte prédisposé, la réponse immunitaire est intense et prolongée. Le délai de deux à quatre semaines entre l’angine et le rhumatisme correspond au temps nécessaire pour produire des anticorps et des lymphocytes T spécifiques. C’est ce délai qui permet la <b>prévention primaire</b> : un antibiotique débuté jusqu’au neuvième jour de l’angine élimine le germe avant que la réponse immunitaire ne soit constituée.</p>
<div class="key"><b>Corrélation physiopathologie → prévention.</b> Le rhumatisme ne complique que l’infection pharyngée persistante. Traiter l’angine, même avec quelques jours de retard, suffit donc à le prévenir. En revanche, une fois la poussée déclarée, les antibiotiques ne modifient plus l’atteinte en cours : ils servent à éliminer le germe résiduel et à empêcher une nouvelle infection.</div>
<h3>3.2 Le mimétisme moléculaire</h3>
<p>La <b>protéine M</b>, principale protéine de surface du streptocoque, a une structure en double hélice enroulée. Cette structure ressemble à celle de protéines de l’hôte construites sur le même modèle : la myosine cardiaque, la tropomyosine, la kératine, la laminine de l’endothélium valvulaire. Le glucide du groupe A, riche en N-acétylglucosamine, ressemble à des motifs de la surface valvulaire et neuronale. Les anticorps et les lymphocytes T produits contre le germe reconnaissent donc aussi ces protéines de l’hôte : c’est le <button class="w" data-k="i00-mimetisme">mimétisme moléculaire (réaction croisée anticorps et lymphocytes T)</button>.</p>
<h3>3.3 Du mimétisme à la lésion valvulaire</h3>
<p>Les anticorps se fixent d’abord sur l’endothélium de la valve, le long de la ligne de fermeture des feuillets, où les frottements sont maximaux. L’endothélium activé exprime des molécules d’adhésion. Les lymphocytes T CD4 pénètrent alors dans le feuillet, qui est normalement dépourvu de vaisseaux. Ils reconnaissent la myosine et d’autres protéines valvulaires, et produisent des cytokines inflammatoires. La <button class="w" data-k="i00-epitope">diffusion épitopique (élargissement de la réponse à de nouvelles cibles)</button> entretient l’inflammation après la disparition du germe. Au microscope apparaissent les <button class="w" data-k="i00-aschoff">nodules d’Aschoff (lésion histologique caractéristique)</button>.</p>
<p>Dans la phase aiguë, l’anneau mitral se dilate, les cordages s’allongent et la pointe du feuillet antérieur bascule : la valve <b>fuit</b>. C’est pourquoi la cardite aiguë se traduit presque toujours par une insuffisance mitrale, et non par un rétrécissement. Au fil des années et des récidives, la cicatrisation fusionne les commissures, épaissit et raccourcit les cordages, puis calcifie les feuillets : la valve <b>se rétrécit</b>. Cette séquence explique la <button class="w" data-k="i00-histoire">histoire naturelle de la valvulopathie rhumatismale (de la fuite de l’enfant au rétrécissement de l’adulte)</button>.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Une fuite mitrale chez un enfant en poussée, un rétrécissement mitral chez une femme de 30 ans : ce sont deux temps de la même maladie. L’enfant d’aujourd’hui devient la patiente du chapitre I34 si les récidives ne sont pas empêchées.</div>
<h3>3.4 Les autres organes cibles</h3>
<p>Dans l’<b>articulation</b>, des complexes immuns se déposent dans la synoviale et provoquent une synovite exsudative sans érosion : c’est pourquoi l’arthrite guérit sans séquelle. Dans le <b>cerveau</b>, des anticorps reconnaissent des récepteurs dopaminergiques et d’autres antigènes des neurones des noyaux gris centraux ; ils augmentent la signalisation dopaminergique et produisent les <button class="w" data-k="i00-choree-meca">mouvements choréiques (mécanisme dopaminergique)</button>. La <b>peau</b> et le <b>tissu sous-cutané</b> sont le siège d’une vascularite et de granulomes discrets (érythème marginé, nodules).</p>

<section class="ilot" id="i00-4"><h2><span class="n">4</span>Étiologie et facteurs de risque</h2>
<p>Le rhumatisme résulte de la rencontre de trois éléments : un germe, un hôte et un environnement. Aucun ne suffit seul. Seule une petite fraction des angines streptococciques non traitées, de l’ordre de 0,3 à 3 % selon les épidémies étudiées, se complique d’un rhumatisme.</p>
<div class="two">
<div class="card"><h4>Le germe</h4><p><i>Streptococcus pyogenes</i>, streptocoque β-hémolytique du groupe A. La pharyngite est la porte d’entrée classique. Dans les régions tropicales, notamment en Australie et dans le Pacifique, les <button class="w" data-k="i00-impetigo">infections cutanées streptococciques (impétigo, gale surinfectée)</button> sont aussi incriminées. Les streptocoques des groupes C et G sont discutés dans certaines populations, sans preuve définitive.</p></div>
<div class="card"><h4>L’hôte</h4><p>Âge de 5 à 15 ans. <button class="w" data-k="i00-genet">Susceptibilité héréditaire (études de jumeaux, gènes de l’immunité)</button> : environ 3 à 6 % d’une population exposée est réceptive. Antécédent personnel de rhumatisme, qui multiplie le risque de récidive à chaque nouvelle angine. Antécédent familial.</p></div>
<div class="card"><h4>L’environnement</h4><p>Surpeuplement du logement, pauvreté, accès limité aux soins primaires, parcours migratoire avec des conditions de vie collectives, rupture d’approvisionnement en pénicilline G benzathine.</p></div>
<div class="card"><h4>Les facteurs de gravité</h4><p>Récidives répétées, mauvaise observance de la prophylaxie, cardite sévère au premier épisode, grossesse sur valvulopathie constituée.</p></div></div>
<div class="trap"><span class="k">Piège</span>L’absence de souvenir d’angine n’exclut pas le diagnostic. Environ un tiers des patients ne se souviennent d’aucun mal de gorge, car l’infection peut être peu symptomatique. C’est la sérologie qui prouve l’infection récente, et non l’anamnèse.</div>
<button class="pareto-btn ui" data-k="pareto-i00-etio">▲ Loi de Pareto — Étiologie et facteurs de risque</button>
</section>

<section class="ilot" id="i00-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse recherche trois éléments : l’infection streptococcique précédente, le terrain à risque et les manifestations actuelles, dans l’ordre de leur fréquence.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i00-atcd-angine">Angine ou infection cutanée dans les deux à quatre semaines (caractérisation)</button></li><li><button class="w" data-k="i00-atcd-origine">Pays de naissance et d’enfance, conditions de vie (population à risque)</button></li><li>Rhumatisme antérieur, souffle connu, injections mensuelles de pénicilline dans l’enfance</li></ul>
<ul><li>Antécédent familial de rhumatisme ou de valvulopathie</li><li><button class="w" data-k="i00-atcd-medic">Traitements déjà pris (anti-inflammatoires, antibiotiques)</button></li><li>Allergie aux pénicillines, documentée ou supposée</li></ul></div>
<h3>5.2 Manifestations par ordre de fréquence</h3>
<p>Les fréquences suivantes concernent le premier épisode ; elles varient selon les séries et les populations.</p>
<div class="two">
<ul><li><button class="w" data-k="i00-s-arthrite">Arthrite migratrice des grosses articulations (60 à 75 %)</button></li><li><button class="w" data-k="i00-s-fievre">Fièvre (la plupart des patients, sauf dans la chorée isolée)</button></li><li><button class="w" data-k="i00-s-cardite">Symptômes de cardite (dyspnée, douleur thoracique, palpitations)</button></li></ul>
<ul><li><button class="w" data-k="i00-s-choree">Mouvements involontaires, maladresse, labilité émotionnelle (chorée, 10 à 30 %)</button></li><li>Éruption cutanée fugace, souvent non remarquée par le patient (érythème marginé, &lt; 5 %)</li><li>Petites masses indolores sous la peau (nodules, &lt; 5 %)</li></ul></div>
<p>La cardite est présente chez 50 à 70 % des patients lors du premier épisode si l’on inclut les formes détectées seulement à l’échocardiographie. Elle est souvent asymptomatique : ce sont l’auscultation et l’échocardiographie qui la révèlent.</p>
<h3>5.3 Formes typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Garçon de 11 ans venu d’Afghanistan. Angine trois semaines plus tôt, non traitée. Fièvre à 39 °C, polyarthrite migratrice des genoux et des chevilles, souffle holosystolique apical nouveau. Antistreptolysines O élevées, protéine C-réactive à 120 mg/L, PR à 0,20 s. Premier épisode avec cardite.</p></div>
<div class="card"><h4>Forme atypique : monoarthrite</h4><p>Adolescente de 14 ans venue de Somalie. Genou gauche gonflé depuis quatre jours ; elle prend de l’ibuprofène depuis le deuxième jour. La migration articulaire a été interrompue par l’anti-inflammatoire. Dans une population à risque, la monoarthrite compte comme critère majeur. La ponction articulaire exclut d’abord une arthrite septique.</p></div>
<div class="card"><h4>Forme trompeuse : chorée isolée</h4><p>Fille de 9 ans devenue maladroite, qui renverse son verre et dont l’écriture se dégrade depuis trois semaines. Pleurs faciles. Pas de fièvre, protéine C-réactive normale. L’angine date de trois mois. L’échocardiographie révèle une fuite mitrale pathologique.</p></div>
<div class="card"><h4>Forme silencieuse : cardite de découverte tardive</h4><p>Femme de 26 ans, arrivée d’Érythrée, enceinte de 20 semaines. Souffle découvert à la consultation prénatale ; aucune poussée connue. Échocardiographie : épaississement du feuillet mitral antérieur et fuite modérée, stade C de la WHF. Le rhumatisme a été infraclinique.</p></div></div>
</section>

<section class="ilot" id="i00-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général → signes vitaux → anthropométrie → signes ciblés. Il répond à trois questions : les critères de Jones sont-ils présents, le cœur est-il atteint, et existe-t-il un diagnostic différentiel dangereux ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Aspect douloureux et immobile dans l’arthrite, agité dans la chorée. <button class="w" data-k="i00-v-fc">Fréquence cardiaque (tachycardie disproportionnée, tachycardie de sommeil)</button>, pression artérielle, fréquence respiratoire, saturation, température. Poids et taille : ils déterminent les doses d’anti-inflammatoire et de pénicilline G benzathine, et permettent de dépister une dénutrition.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Articulations</b><ul><li><button class="w" data-k="i00-e-arthrite">Arthrite rhumatismale (examen, caractères distinctifs)</button></li><li>Arthralgie sans signe objectif : critère mineur</li><li>Absence de déformation et d’atteinte axiale</li></ul></div>
<div><b>Cœur</b><ul><li><button class="w" data-k="i00-e-souffle-im">Souffle holosystolique apical d’insuffisance mitrale (technique, valeur)</button></li><li><button class="w" data-k="i00-e-carey">Roulement mésodiastolique de Carey Coombs (valvulite mitrale aiguë)</button></li><li><button class="w" data-k="i00-e-souffle-ia">Souffle diastolique d’insuffisance aortique (bord sternal gauche)</button></li><li>Frottement péricardique ; signes d’insuffisance cardiaque</li></ul></div>
<div><b>Système nerveux</b><ul><li><button class="w" data-k="i00-e-choree">Signes de chorée (traite de la laitière, signe du pronateur, langue)</button></li><li>Hypotonie, dysarthrie, écriture dégradée</li><li>Labilité émotionnelle, symptômes obsessionnels</li></ul></div>
<div><b>Peau et tissu sous-cutané</b><ul><li><button class="w" data-k="i00-e-erytheme">Érythème marginé (aspect, siège, piège de la peau foncée)</button></li><li><button class="w" data-k="i00-e-nodules">Nodules sous-cutanés (siège, association à la cardite)</button></li><li>Recherche d’impétigo et de gale</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Un souffle chez un enfant fébrile n’est pas toujours une cardite. La fièvre augmente le débit et fait apparaître des souffles fonctionnels, protosystoliques, doux, variables avec la position. Le souffle d’insuffisance mitrale rhumatismale est holosystolique, apical et irradie vers l’aisselle. Le doute se tranche par l’échocardiographie, qui est indiquée chez tout patient suspect, souffle ou non.</div>
