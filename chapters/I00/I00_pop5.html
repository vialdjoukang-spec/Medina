<template data-pop="i00-d-bpg" data-title="Pénicilline G benzathine">
<div class="lab">Mécanisme</div><p>Sel de benzylpénicilline très peu soluble. Déposé dans le muscle, il se dissout lentement et libère une concentration sanguine faible mais prolongée, suffisante contre le streptocoque du groupe A pendant environ trois semaines, puis souvent insuffisante pendant la quatrième. La pénicilline inhibe les protéines de liaison à la pénicilline et la synthèse de la paroi.</p>
<div class="lab">Preuves</div><p>Réduction des récidives de rhumatisme par rapport à la pénicilline orale (revues Cochrane) ; réduction de la progression des atteintes latentes (essai GOAL, 2022). OMS 2024 : premier choix de la prophylaxie, recommandation forte.</p>
<div class="lab">Posologie suisse</div><p>Extencilline® : 1,2 million d’UI en injection intramusculaire profonde chez l’adulte, l’adolescent et l’enfant de plus de 30 kg ; 600 000 UI au-dessous de 30 kg. Angine : dose unique. Prophylaxie : toutes les 3 à 4 semaines ; l’OMS 2024 retient 4 semaines, et l’on raccourcit à 3 semaines en cas de récidive malgré une bonne observance.</p>
<div class="lab">Administration</div><p>Voie intramusculaire profonde exclusivement : quadrant supéro-externe du grand fessier ou zone ventro-glutéale ; chez l’enfant, face antérolatérale de la cuisse. Aspiration avant l’injection, arrêt immédiat si du sang est aspiré ou si une douleur survient ; injection lente sous faible pression, sans frotter ; au plus 5 mL par site ; sites alternés. L’information suisse ne dispose de données de compatibilité qu’avec l’eau pour préparations injectables ; l’ajout de lidocaïne admis par l’OMS 2024 sort donc du cadre autorisé.</p>
<div class="lab">Effets indésirables</div><p>Douleur et infiltrat au point d’injection ; allergie, rare mais potentiellement anaphylactique, y compris syndrome de Kounis ; réactions cutanées graves ; <button class="w" data-k="i00-bpg-vagal">réaction vasovagale</button> ; injection intravasculaire accidentelle : syndrome de Hoigné (microemboles de la suspension), occlusion artérielle et gangrène, syndrome de Nicolau.</p>
<div class="lab">Contre-indications suisses</div><p>Hypersensibilité aux pénicillines, au soja ou à l’arachide (lécithine de soja de l’enrobage) ou à un excipient ; réaction immédiate sévère à une autre bêtalactamine.</p>
<div class="lab">Surveillance</div><p>Surveillance médicale d’au moins une demi-heure après l’injection, car une réaction grave peut survenir dès la première dose ; adrénaline disponible ; INR rapproché sous antivitamine K ; formule sanguine et fonction rénale si le traitement se prolonge ; suivi des dates d’injection.</p>
<div class="lab">Pharmacocinétique et intervalle</div><p>Après 1,2 million d’UI, la pénicillinémie moyenne reste au-dessus de 0,02 µg/mL, seuil admis de protection, pendant 21 jours ; au 28<sup>e</sup> jour, 36 % des prélèvements seulement atteignent ce seuil, et la concentration est plus basse au-delà de 45 kg. Une injection déposée dans la graisse plutôt que dans le muscle l’abaisse aussi. Chaque jour de retard après le 28<sup>e</sup> jour prolonge donc une période sans protection, et le schéma de 21 jours compense ce déclin chez les patients qui récidivent malgré des injections à l’heure.</p>
<div class="lab">Pourquoi le seuil de poids compte</div><p>L’information suisse fixe le seuil à 30 kg. Les données pharmacocinétiques montrent toutefois que 600 000 UI donnent des taux insuffisants chez la plupart des enfants de moins de 27 kg ; les recommandations australiennes 2025 donnent donc la dose pleine dès 20 kg. Un enfant de 20 à 29 kg relève en Suisse de 600 000 UI ; une dose pleine serait hors information professionnelle et se discute avec le spécialiste.</p>
<div class="lab">Allergie</div><p>Dans l’étude internationale citée par l’OMS 2024, des réactions allergiques sont survenues après 3,2 % des injections et une anaphylaxie après environ 0,2 % ; voir la fiche <button class="w" data-k="i00-test-allergie">test d’allergie avant la première injection</button>.</p>
<div class="lab">Source</div><p>Information professionnelle suisse d’Extencilline®, Swissmedic (AIPS), mai 2025, consultée le 08.10.2026 ; OMS 2024, section 4.7 ; Kaplan et al., J Pediatr 1989;115:146-50 ; recommandations australiennes 2025, chapitre 10.</p>
</template>

<template data-pop="i00-d-penv" data-title="Pénicilline V (phénoxyméthylpénicilline)">
<div class="lab">Mécanisme</div><p>Pénicilline stable en milieu acide, ce qui permet son absorption par voie orale. Son effet bactéricide dépend du temps passé au-dessus de la concentration minimale inhibitrice, et non du pic : d’où plusieurs prises par jour.</p>
<div class="lab">Preuves et place</div><p>Traitement de première intention de l’angine streptococcique (SSI 2024, OMS 2024) ; prophylaxie orale acceptable si l’injection est impossible (OMS 2024, recommandation conditionnelle), moins efficace que l’injection, car l’absorption orale donne des concentrations moins prévisibles et chaque prise oubliée interrompt la protection.</p>
<div class="lab">Posologie</div><p>Angine, SSI 2024 : adulte 1 million d’UI toutes les 12 heures, 6 jours. Information suisse d’Ospen® : adulte et adolescent dès 12 ans, 1 million d’UI 3 à 4 fois par jour ; enfant de plus de 6 ans, 400 000 UI 3 à 4 fois par jour ; au moins 10 jours dans les infections à streptocoques, à jeun, une heure avant le repas. Prophylaxie : indication citée par l’information suisse, sans dose ; schéma à établir avec l’infectiologue. Un comprimé d’Ospen® 1000 correspond à 1 million d’UI, soit 590 mg de phénoxyméthylpénicilline.</p>
<div class="lab">Effets indésirables</div><p>Troubles digestifs, exanthème, allergie.</p>
<div class="lab">Limite</div><p>Plusieurs prises par jour pendant des années : observance souvent insuffisante.</p></template>

<template data-pop="i00-d-amox" data-title="Amoxicilline dans l’angine streptococcique">
<div class="lab">Mécanisme</div><p>Aminopénicilline ; même cible que la pénicilline, meilleure absorption orale et goût plus acceptable en suspension.</p>
<div class="lab">Place</div><p>Alternative de première intention à la pénicilline V, en particulier chez l’enfant (SSI 2024).</p>
<div class="lab">Posologie</div><p>SSI 2024 : enfant 25 mg/kg toutes les 12 heures ; adulte 1 g toutes les 12 heures ; 6 jours. Information suisse : enfant jusqu’à 40 kg, 50 à 100 mg/kg par jour en 3 à 4 prises, au maximum 2 000 mg par jour ; au moins 10 jours dans les infections à streptocoque du groupe A ; clairance de 10 à 30 mL/min : au plus 500 mg toutes les 12 heures chez l’adulte.</p>
<div class="lab">Effets indésirables</div><p>Diarrhée, exanthème ; exanthème maculopapuleux fréquent en cas de mononucléose infectieuse : environ 30 % des enfants traités par amoxicilline dans une série récente, contre 80 à 100 % sous ampicilline dans les séries anciennes. Cet exanthème ne prouve pas à lui seul une allergie persistante, mais une sensibilisation réelle est possible. La molécule est évitée pendant l’épisode ; si une pénicilline doit être réutilisée, l’histoire de la réaction guide l’évaluation allergologique, plutôt qu’une conclusion automatique de tolérance.</p>
<div class="lab">Piège</div><p>Une angine avec grosse fatigue, adénopathies diffuses et splénomégalie évoque une mononucléose : test avant l’amoxicilline.</p></template>

<template data-pop="i00-d-macro" data-title="Alternatives en cas d’allergie aux pénicillines">
<div class="lab">Allergie non sévère aux pénicillines</div><p>Céfuroxime (SSI 2024) : adulte 500 mg toutes les 12 heures, enfant 15 mg/kg toutes les 12 heures, 6 jours. L’information suisse de Zinat® indique pour l’angine 250 mg deux fois par jour chez l’adulte et 10 mg/kg deux fois par jour chez l’enfant, au maximum 500 mg par jour. La céfalexine et le céfadroxil ne sont pas autorisés en Suisse.</p>
<div class="lab">Contre-indication à toutes les bêtalactamines</div><p>Adulte : clarithromycine 500 mg toutes les 12 heures, 6 jours (SSI 2024). Enfant : clindamycine 7 mg/kg toutes les 8 heures, 6 jours (SSI 2024). Les informations suisses demandent au moins 10 jours dans la pharyngite streptococcique (Klaciped®, Dalacin® C). L’information suisse de Zithromax® rappelle que la pénicilline reste le médicament de choix et qu’aucune étude n’établit l’efficacité de l’azithromycine dans la prévention du rhumatisme.</p>
<div class="lab">Prophylaxie</div><p>L’OMS 2024 retient les macrolides comme alternative de seconde ligne en cas d’allergie confirmée, si les souches locales y restent sensibles, sans fixer de posologie. L’érythromycine orale n’est pas autorisée en Suisse ; clarithromycine ou azithromycine, schéma à établir avec l’infectiologue.</p>
<div class="lab">Mises en garde</div><p>La résistance aux macrolides varie selon les régions ; elle repose sur une pompe d’efflux ou sur une modification de la cible ribosomique, qui peut toucher aussi la clindamycine ; allongement du QT et interactions par le cytochrome CYP3A4 (clarithromycine) ; diarrhée à <i>Clostridioides difficile</i> sous clindamycine.</p>
<div class="lab">Réflexe</div><p>Une partie des allergies déclarées n’est pas confirmée : un bilan d’allergologie peut rendre la pénicilline G benzathine accessible pour des années. La désensibilisation n’est pas une solution, car elle devrait être répétée avant chaque injection.</p>
<div class="lab">Source</div><p>Société suisse d’infectiologie, « Pharyngite », 08.05.2024 ; informations professionnelles suisses de Zinat®, Klacid®, Klaciped®, Dalacin® C et Zithromax®, AIPS du 08.10.2026 ; OMS 2024, section 4.7.2.</p></template>

<template data-pop="i00-d-asa" data-title="Acide acétylsalicylique à dose anti-inflammatoire">
<div class="lab">Mécanisme</div><p>Inhibition irréversible des cyclo-oxygénases 1 et 2, qui produisent les prostaglandines de la douleur, du gonflement et de la fièvre. À faible dose, l’effet porte surtout sur les plaquettes, qui ne peuvent pas resynthétiser l’enzyme ; les cellules de l’inflammation la renouvellent, d’où la nécessité de fortes doses pour un effet anti-inflammatoire.</p>
<div class="lab">Preuves et place</div><p>Traitement historique de l’arthrite rhumatismale, à l’effet spectaculaire ; aucun effet démontré sur la cardite séquellaire. Souvent remplacé aujourd’hui par le naproxène.</p>
<div class="lab">Posologie</div><p>Recommandations australiennes 2025 : 50 à 60 mg/kg par jour en 4 à 5 prises, jusqu’à 80 à 100 mg/kg par jour si nécessaire ; réduire à 60 à 70 mg/kg par jour dès le contrôle des symptômes. Ce schéma sort de l’information suisse d’Aspirine®, qui n’est pas étudiée à hautes doses comme antirhumatismal et n’est pas indiquée avant 12 ans.</p>
<div class="lab">Effets indésirables</div><p>Salicylisme (acouphènes, nausées, vertiges, polypnée) ; ulcère gastrique, hémorragie ; syndrome de Reye chez l’enfant en cas de grippe ou de varicelle.</p>
<div class="lab">Contre-indications</div><p>Ulcère évolutif, trouble de l’hémostase, anticoagulation, grossesse après 20 semaines à dose anti-inflammatoire, grippe ou varicelle en cours.</p>
<div class="lab">Surveillance</div><p>Symptômes de salicylisme, salicylémie si disponible, vaccination antigrippale.</p></template>

<template data-pop="i00-d-naprox" data-title="Naproxène dans le rhumatisme articulaire aigu">
<div class="lab">Mécanisme</div><p>Anti-inflammatoire non stéroïdien inhibiteur réversible des cyclo-oxygénases, à demi-vie longue (environ 12 à 17 heures), ce qui permet deux prises par jour.</p>
<div class="lab">Preuves et place</div><p>Efficacité comparable à l’acide acétylsalicylique sur l’arthrite dans de petits essais pédiatriques ; mieux toléré, sans syndrome de Reye ; anti-inflammatoire de première ligne chez l’enfant dans les recommandations australiennes 2020.</p>
<div class="lab">Posologie suisse</div><p>Apranax®, enfant de plus de 2 ans : 10 mg/kg par jour en deux prises (arthrite juvénile), au maximum 15 mg/kg par jour. Proxen®, enfant dès 12 ans : 10 à 15 mg/kg par jour en deux prises ; adulte : 500 à 1 000 mg par jour, au maximum 1 250 mg. Les recommandations australiennes 2025 montent jusqu’à 20 mg/kg par jour, au-delà du maximum suisse. Durée guidée par les symptômes et la baisse de la CRP, sans seuil validé pour l’arrêt, puis décroissance.</p>
<div class="lab">Effets indésirables</div><p>Douleurs gastriques, ulcère, rétention sodée, altération de la fonction rénale ; pseudoporphyrie cutanée chez l’enfant à peau claire.</p>
<div class="lab">Contre-indications suisses</div><p>Ulcère évolutif ou antécédent d’hémorragie digestive sous anti-inflammatoire, maladie inflammatoire de l’intestin, insuffisance hépatique sévère, clairance de la créatinine inférieure à 30 mL/min, insuffisance cardiaque sévère, troisième trimestre de la grossesse ; à partir de 20 semaines, risque d’oligoamnios et de rétrécissement du canal artériel.</p>
<div class="lab">Surveillance</div><p>Créatinine en cas d’insuffisance cardiaque ou de diurétique ; protection gastrique si facteurs de risque.</p></template>

<template data-pop="i00-d-cortico" data-title="Corticoïdes dans le rhumatisme articulaire aigu">
<div class="lab">Mécanisme</div><p>Inhibition de la transcription des cytokines inflammatoires et de l’activation lymphocytaire.</p>
<div class="lab">Preuves</div><p>Les essais anciens et les méta-analyses n’ont pas montré de réduction de la cardiopathie séquellaire par rapport à l’acide acétylsalicylique ou au placebo. L’OMS 2024 ne formule pas de recommandation : ces essais précèdent l’échocardiographie, et un seul suggère moins de progression sous hydrocortisone que sous acide acétylsalicylique, avec une faible certitude.</p>
<div class="lab">Place</div><p>Cardite sévère avec insuffisance cardiaque, pour accélérer la résolution de l’inflammation ; chorée sévère ou réfractaire.</p>
<div class="lab">Posologie</div><p>Prednisone ou prednisolone 1–2 mg/kg/jour en une prise (maximum 80 mg/jour), Si le traitement dure une semaine ou moins, arrêt dès que l’insuffisance cardiaque est contrôlée et que les marqueurs baissent ; au-delà, en général pas plus de trois semaines, baisse de 20 à 25 % par semaine pour éviter le rebond et l’insuffisance surrénalienne (recommandations australiennes 2025). Relais anti-inflammatoire non stéroïdien pendant la décroissance pour limiter le rebond.</p>
<div class="lab">Effets indésirables</div><p>Hyperglycémie, hypertension, rétention sodée, troubles de l’humeur, infections ; strongyloïdose disséminée chez le patient venu d’une région tropicale.</p>
<div class="lab">Précautions</div><p>Exclure une leucémie avant de débuter ; ivermectine préventive selon l’origine.</p></template>

<template data-pop="i00-d-valpro" data-title="Acide valproïque dans la chorée">
<div class="lab">Mécanisme</div><p>Augmentation de la transmission par l’acide gamma-aminobutyrique (GABA), blocage des canaux sodiques et calciques de type T : réduction de l’excitabilité neuronale.</p>
<div class="lab">Preuves et place</div><p>Séries de cas et petits essais : le plus efficace dans un essai comparatif de 18 patients, d’efficacité comparable à la carbamazépine dans un autre de 24 patients. Les recommandations australiennes 2025 lui préfèrent la carbamazépine, en raison de sa toxicité hépatique et de sa tératogénicité. En Suisse, la chorée sort des indications de Depakine® ; l’information suisse contre-indique le valproate chez la jeune fille et la femme en âge de procréer, sauf si toutes les conditions du programme de prévention de la grossesse sont remplies.</p>
<div class="lab">Posologie</div><p>7,5–10 mg/kg par prise, 2 fois/jour (maximum 500 mg par prise), titration progressive. Effet attendu en 1 à 2 semaines ; poursuivre 2 à 4 semaines après la disparition de la chorée, puis arrêter (recommandations australiennes 2025).</p>
<div class="lab">Effets indésirables</div><p>Hépatotoxicité, pancréatite, thrombopénie, hyperammoniémie, prise de poids, tremblement ; tératogénicité et troubles du développement de l’enfant exposé in utero.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques, hémogramme, test de grossesse, ammoniémie si somnolence.</p></template>

<template data-pop="i00-d-carba" data-title="Carbamazépine dans la chorée">
<div class="lab">Mécanisme</div><p>Blocage des canaux sodiques voltage-dépendants : réduction des décharges neuronales répétitives.</p>
<div class="lab">Preuves et place</div><p>Séries de cas et petits essais comparatifs ; premier choix des recommandations australiennes 2025, car mieux tolérée que l’acide valproïque. Dans le registre européen et international cité par l’information suisse de Tégrétol®, 5,4 % des enfants exposés ont une malformation grave, contre 3,1 % sous lamotrigine ; le valproate atteint environ 11 %. Elle reste donc tératogène et réduit l’efficacité de plusieurs contraceptifs hormonaux par induction enzymatique. En Suisse, la chorée sort des indications autorisées.</p>
<div class="lab">Posologie</div><p>3,5–10 mg/kg par prise, 2 fois/jour (maximum 200 mg par prise), titration progressive (recommandations australiennes 2025).</p>
<div class="lab">Effets indésirables</div><p>Somnolence, vertiges, ataxie, hyponatrémie, leucopénie, hépatite ; réactions cutanées graves. L’information suisse recommande de rechercher l’allèle HLA-B*1502 avant traitement chez les patients dont l’origine expose à ce risque (populations chinoise Han, thaïlandaise, philippine, malaise ; fréquences jusqu’à 2 % en Corée et 6 % en Inde) et d’y renoncer si le résultat est positif ; l’allèle HLA-A*3101 expose aussi à des réactions cutanées.</p>
<div class="lab">Interactions</div><p>Inducteur enzymatique : baisse d’efficacité de la contraception hormonale et des antivitamines K ; sa concentration augmente avec la clarithromycine et l’érythromycine.</p>
<div class="lab">Surveillance</div><p>Hémogramme, natrémie, tests hépatiques ; arrêt immédiat en cas d’éruption.</p></template>

<template data-pop="i00-d-ic" data-title="Traitement de l’insuffisance cardiaque de la cardite">
<div class="lab">Principe</div><p>L’insuffisance cardiaque de la cardite résulte d’une surcharge de volume par fuite valvulaire, non d’une défaillance contractile primitive.</p>
<div class="lab">Diurétique de l’anse</div><p>Furosémide (information suisse de Lasix®) : enfant, voie orale 2 mg/kg, au maximum 40 mg par jour ; voie intraveineuse 1 mg/kg, au maximum 20 mg par jour, réservée aux cas critiques ; adulte, voie intraveineuse 20 à 40 mg, augmentée par paliers de 20 mg toutes les 2 heures selon la diurèse. Surveiller kaliémie et créatinine.</p>
<div class="lab">Inhibiteur de l’enzyme de conversion</div><p>Réduit la postcharge et donc la fraction régurgitée dans la fuite mitrale ou aortique importante. Début à faible dose, titration selon la pression artérielle et la créatinine ; doses adultes : chapitre I50 ; doses pédiatriques selon le protocole de cardiologie pédiatrique.</p>
<div class="lab">Autres mesures</div><p>Restriction sodée, oxygène si hypoxémie, activité limitée. Digoxine rarement utilisée, surtout réservée aux tachycardies supraventriculaires : elle n’agit pas sur la fuite, qui cause l’insuffisance cardiaque, et le myocarde inflammatoire serait plus sensible à sa toxicité.</p>
<div class="lab">Échec</div><p>Fuite massive réfractaire (rupture de cordage) : chirurgie en centre expert.</p></template>
<template data-pop="i00-bpg-vagal" data-title="Malaise après l’injection de pénicilline G benzathine">
<div class="lab">Physiologie normale</div><p>En position assise ou debout, la pression artérielle dépend du tonus des vaisseaux et du retour veineux. Le baroréflexe corrige en quelques secondes toute baisse de pression en accélérant le cœur et en contractant les vaisseaux. Un cœur sain peut aussi augmenter son volume d’éjection.</p>
<div class="lab">Mécanisme</div><p>La douleur, la peur et une injection longue et visqueuse déclenchent un réflexe vasovagal : le tonus vagal augmente, le tonus sympathique s’effondre, d’où une bradycardie et une vasodilatation. Chez le sujet sain, la position couchée rétablit la perfusion en quelques minutes. Dans un rétrécissement mitral serré, une sténose aortique, une fuite aortique sévère, une hypertension pulmonaire ou une dysfonction ventriculaire, le débit cardiaque ne peut pas augmenter. La chute de pression réduit alors la perfusion coronaire et cérébrale et peut aboutir à un collapsus irréversible. Ce mécanisme est supposé, non démontré : sur dix accidents graves après l’injection, dont huit décès, trois seulement remplissaient les critères d’une anaphylaxie.</p>
<div class="lab">Conséquence clinique</div><p>L’anaphylaxie, plus rare, survient surtout dans les 15 minutes qui suivent l’injection. Elle associe urticaire, bronchospasme et hypotension avec tachycardie. Le malaise vagal associe pâleur, bradycardie et récupération rapide en décubitus, sauf chez le patient valvulaire sévère.</p>
<div class="lab">Ce qui change la décision</div><p>Avant chaque injection, demander s’il existe un vertige, une douleur thoracique ou une dyspnée croissante ; si oui, ne pas injecter et demander un avis médical. Injecter le patient couché, le laisser au repos quelques minutes, lui proposer à boire et à manger, et traiter la douleur. Garder de l’adrénaline intramusculaire à portée, traitement de première ligne de l’anaphylaxie. En cas de valvulopathie sévère, en particulier de rétrécissement mitral ou aortique serré, ou de baisse de la fonction systolique ventriculaire gauche, l’OMS 2024 admet la prophylaxie orale, par crainte d’accidents cardiaques mortels liés à l’injection. Pour la grande majorité des patients, le risque de l’injection reste bien inférieur à celui d’une cardiopathie rhumatismale sans prophylaxie.</p>
<div class="lab">Source</div><p>OMS 2024, section 4.7.3, considération 7 ; Marantelli et al., Heart Asia 2019;11:e011191 ; recommandations australiennes 2025, chapitre 10, encadrés 10.2 et 10.3.</p></template>
