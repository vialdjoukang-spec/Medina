
<!-- ===== FENÊTRES I00 : notions fondamentales ===== -->
<template data-pop="i00-mimetisme" data-title="Mimétisme moléculaire dans le rhumatisme articulaire aigu">
<div class="lab">Définition</div><p>Réaction croisée : des anticorps ou des lymphocytes T produits contre un antigène microbien reconnaissent une protéine de l’hôte dont la structure est proche.</p>
<div class="lab">Antigènes streptococciques en cause</div><p><b>Protéine M</b> : double hélice enroulée, semblable à la myosine cardiaque, à la tropomyosine, à la kératine et à la vimentine. <b>Glucide du groupe A</b> (N-acétylglucosamine) : semblable à des motifs de la laminine valvulaire et de la surface des neurones striataux.</p>
<div class="lab">Cibles et manifestations</div><p>Endothélium et matrice valvulaire : valvulite. Myosine : myocardite. Neurones des noyaux gris centraux : chorée. Kératine et tissu conjonctif : érythème marginé, nodules.</p>
<div class="lab">Pourquoi pas tout le monde ?</div><p>La réaction croisée exige un hôte génétiquement prédisposé, capable de présenter ces peptides et de produire une réponse intense et prolongée.</p>
<div class="lab">Exemple</div><p>Après une angine, un enfant produit des lymphocytes T reconnaissant un peptide de la protéine M. Les mêmes lymphocytes reconnaissent un peptide de la myosine cardiaque et s’activent dans la valve mitrale, deux à trois semaines plus tard.</p></template>

<template data-pop="i00-strepto" data-title="Streptocoque du groupe A : repères">
<div class="lab">Identité</div><p><i>Streptococcus pyogenes</i> : coccus à Gram positif, en chaînettes, hémolyse β, groupe A de Lancefield (glucide de paroi), catalase négative.</p>
<div class="lab">Virulence</div><p>Protéine M (antiphagocytaire, plus de 200 types <i>emm</i>), capsule d’acide hyaluronique, streptolysines O et S, désoxyribonucléase B, exotoxines superantigéniques.</p>
<div class="lab">Réservoir et transmission</div><p>Pharynx et peau humains ; gouttelettes et contact ; portage asymptomatique fréquent chez l’enfant d’âge scolaire.</p>
<div class="lab">Marqueurs sérologiques</div><p>Anticorps antistreptolysine O et anti-DNase B : ils prouvent une infection récente, pas une infection en cours.</p>
<div class="lab">Sensibilité</div><p>Toujours sensible à la pénicilline ; résistance variable aux macrolides.</p></template>

<template data-pop="i00-sa-valve" data-title="Appareil valvulaire mitral et aortique">
<div class="lab">Mitrale</div><p>Anneau fibreux, feuillet antérieur (grand, en continuité avec la valve aortique), feuillet postérieur (court, trois festons), deux commissures, cordages de premier ordre (bords libres) et de second ordre (face ventriculaire), deux piliers.</p>
<div class="lab">Aortique</div><p>Trois sigmoïdes semi-lunaires, trois commissures, sinus de Valsalva en regard.</p>
<div class="lab">Cibles rhumatismales</div><p>Ligne de fermeture des feuillets (verrucosités), cordages (allongement puis fusion), commissures (fusion), anneau (dilatation en phase aiguë).</p>
<div class="lab">Corrélation</div><p>La fuite de la poussée vient de l’anneau et des cordages ; la sténose chronique vient de la fusion commissurale. Voir chapitre I34.</p></template>

<template data-pop="i00-jones" data-title="Critères de Jones révisés (AHA 2015)">
<div class="lab">Population à bas risque</div><p>Incidence du rhumatisme ≤ 2 pour 100 000 enfants d’âge scolaire par an, ou prévalence de la cardiopathie rhumatismale ≤ 1 pour 1 000 habitants (tous âges). Toute autre population : risque modéré ou élevé. Le patient est classé selon sa population d’origine.</p>
<div class="lab">Majeurs, bas risque</div><p>Cardite clinique ou infraclinique ; polyarthrite ; chorée ; érythème marginé ; nodules sous-cutanés.</p>
<div class="lab">Majeurs, risque modéré ou élevé</div><p>Cardite clinique ou infraclinique ; monoarthrite, polyarthrite ou polyarthralgie ; chorée ; érythème marginé ; nodules sous-cutanés.</p>
<div class="lab">Mineurs, bas risque</div><p>Polyarthralgie ; fièvre ≥ 38,5 °C ; vitesse de sédimentation ≥ 60 mm/h et/ou CRP ≥ 30 mg/L ; PR allongé pour l’âge (sauf si la cardite est retenue).</p>
<div class="lab">Mineurs, risque modéré ou élevé</div><p>Monoarthralgie ; fièvre ≥ 38,0 °C ; vitesse de sédimentation ≥ 30 mm/h et/ou CRP ≥ 30 mg/L ; PR allongé pour l’âge.</p>
<div class="lab">Règles</div><p>Toujours une preuve d’infection streptococcique récente (sérologie, culture, test rapide). Premier épisode : 2 majeurs ou 1 majeur + 2 mineurs. Récidive : 2 majeurs, 1 majeur + 2 mineurs, ou 3 mineurs.</p>
<div class="lab">Exceptions</div><p>Chorée et cardite indolente : peuvent suffire sans preuve streptococcique, après exclusion des autres causes.</p></template>

<template data-pop="i00-whf" data-title="Critères échocardiographiques de la WHF 2023">
<div class="lab">Fuite mitrale pathologique</div><p>Vue dans deux incidences ; jet ≥ 2,0 cm (≥ 1,5 cm si poids &lt; 30 kg) dans au moins une ; vitesse ≥ 3,0 m/s sur une enveloppe complète ; holosystolique sur au moins une enveloppe.</p>
<div class="lab">Fuite aortique pathologique</div><p>Vue dans deux incidences ; jet ≥ 1,0 cm ; vitesse ≥ 3,0 m/s en protodiastole ; holodiastolique.</p>
<div class="lab">Morphologie mitrale</div><p>Feuillet antérieur épaissi : ≥ 3 mm jusqu’à 20 ans, ≥ 4 mm de 21 à 40 ans, ≥ 5 mm après 40 ans ; épaississement des cordages ; mobilité restreinte ; mouvement excessif de la pointe du feuillet (avant 35 ans).</p>
<div class="lab">Morphologie aortique</div><p>Épaississement, prolapsus ou mobilité restreinte d’une sigmoïde, défaut de coaptation.</p>
<div class="lab">Stades</div><p><b>A</b> (≤ 20 ans) : fuite pathologique sans morphologie. <b>B</b> : fuite pathologique avec morphologie, ou fuites mitrale et aortique. <b>C</b> : fuite modérée ou sévère, toute sténose, hypertension pulmonaire, dysfonction ventriculaire gauche. <b>D</b> : stade C avec complication clinique.</p>
<div class="lab">Conduite proposée</div><p>Inscription dans un registre à tous les stades. Stade A : prophylaxie raisonnable (classe 2A), échocardiographie à 1–2 ans, arrêt envisageable si normalisation. Stades B à D : prophylaxie recommandée (classe 1), durée selon les recommandations locales ou de l’OMS ; stades C et D : prise en charge spécialisée.</p>
<div class="lab">Dépistage</div><p>Critères simplifiés avant 20 ans : toute fuite mitrale de longueur suffisante, toute fuite aortique, tout rétrécissement mitral, vus dans une incidence sur au moins deux images consécutives ; confirmation par un examen complet.</p></template>

<template data-pop="i00-pauvrete" data-title="Le rhumatisme, maladie de la pauvreté">
<div class="lab">Constat</div><p>L’incidence a chuté dans les pays industrialisés dès le début du vingtième siècle, avant la pénicilline, avec l’amélioration du logement.</p>
<div class="lab">Mécanismes</div><p>Promiscuité : transmission répétée du streptocoque entre enfants. Accès limité aux soins : angines non traitées. Ruptures de pénicilline G benzathine : prophylaxie interrompue.</p>
<div class="lab">Portée actuelle</div><p>Résolution 71.14 de l’Assemblée mondiale de la santé (2018) appelant à une réponse coordonnée. En Suisse, le risque est porté par le parcours de vie du patient, non par le pays de consultation.</p></template>

<template data-pop="i00-epitope" data-title="Diffusion épitopique">
<div class="lab">Définition</div><p>Élargissement progressif d’une réponse immunitaire à des épitopes différents de celui qui l’a déclenchée, sur la même protéine ou sur d’autres protéines.</p>
<div class="lab">Dans le rhumatisme</div><p>La lésion valvulaire libère des fragments de myosine, de vimentine et de collagène. Ils sont présentés aux lymphocytes T, qui élargissent la réponse. L’inflammation peut alors persister sans nouvelle infection.</p>
<div class="lab">Conséquence</div><p>Explique la progression lente de certaines valvulopathies malgré une prophylaxie bien conduite, et la cardite « indolente ».</p></template>

<template data-pop="i00-aschoff" data-title="Nodule d’Aschoff">
<div class="lab">Définition</div><p>Granulome inflammatoire du tissu conjonctif cardiaque, spécifique de la cardite rhumatismale.</p>
<div class="lab">Évolution</div><p>1. Stade exsudatif : œdème et nécrose fibrinoïde du collagène. 2. Stade prolifératif : macrophages, lymphocytes, cellules d’Anitschkow (noyau à chromatine en barre ondulée) et cellules géantes multinucléées. 3. Stade cicatriciel : fibrose.</p>
<div class="lab">Siège</div><p>Myocarde interstitiel près des vaisseaux, endocarde, péricarde.</p>
<div class="lab">Intérêt</div><p>Confirme histologiquement l’origine rhumatismale sur une pièce opératoire ; aucune biopsie n’est faite pour le diagnostic de routine.</p></template>

<template data-pop="i00-histoire" data-title="Histoire naturelle de la valvulopathie rhumatismale">
<div class="lab">Enfance et adolescence</div><p>Cardite de la poussée : fuite mitrale, parfois aortique. Régression fréquente d’une fuite légère sans récidive.</p>
<div class="lab">Récidives</div><p>Chaque nouvelle poussée ajoute des lésions ; le risque de récidive est maximal dans les cinq ans qui suivent le premier épisode.</p>
<div class="lab">Adulte jeune</div><p>Fibrose, fusion commissurale : rétrécissement mitral, souvent 10 à 30 ans après la première poussée ; fuite aortique ; atteinte tricuspide plus tardive.</p>
<div class="lab">Complications</div><p>Fibrillation auriculaire, embolies, hypertension pulmonaire, insuffisance cardiaque, endocardite ; décompensation pendant la grossesse. Chapitres I34 et I35.</p></template>

<template data-pop="i00-choree-meca" data-title="Mécanisme de la chorée de Sydenham">
<div class="lab">Anticorps</div><p>Anticorps dirigés contre le glucide du groupe A qui reconnaissent des récepteurs dopaminergiques de type 1 et de type 2, un ganglioside membranaire et la tubuline des neurones striataux.</p>
<div class="lab">Effet</div><p>Augmentation de la libération de dopamine et de la signalisation intracellulaire ; excès d’activité de la voie directe du striatum ; levée de l’inhibition du thalamus : mouvement involontaire.</p>
<div class="lab">Délai</div><p>Un à six mois après l’angine : les anticorps doivent franchir la barrière hémato-encéphalique, dont la perméabilité est augmentée par l’inflammation.</p>
<div class="lab">Corrélation</div><p>Les mouvements diminuent avec les médicaments qui freinent l’excitabilité neuronale ou bloquent la dopamine ; ils réapparaissent dans les situations qui augmentent la sensibilité dopaminergique (grossesse, œstrogènes).</p></template>

<template data-pop="i00-impetigo" data-title="Infections cutanées streptococciques et rhumatisme">
<div class="lab">Constat</div><p>Dans les communautés aborigènes d’Australie et dans le Pacifique, l’angine est peu fréquente alors que l’impétigo et la gale surinfectée sont très fréquents, et le rhumatisme endémique.</p>
<div class="lab">Hypothèse</div><p>Des souches cutanées de streptocoque du groupe A, ou des souches mixtes, pourraient déclencher le rhumatisme, directement ou en colonisant ensuite le pharynx.</p>
<div class="lab">Conséquence pratique</div><p>Chercher et traiter l’impétigo et la gale chez un enfant venant de ces régions ; après une infection cutanée, doser les anti-DNase B plutôt que les antistreptolysines O.</p></template>

<template data-pop="i00-genet" data-title="Susceptibilité génétique au rhumatisme">
<div class="lab">Héritabilité</div><p>Environ 60 % selon une méta-analyse des études de jumeaux ; concordance plus élevée chez les monozygotes.</p>
<div class="lab">Gènes</div><p>Allèles HLA de classe II, qui présentent les peptides streptococciques aux lymphocytes T CD4 ; gènes des cytokines, de la lectine liant le mannose, des récepteurs de type Toll ; région des chaînes lourdes d’immunoglobulines dans des populations océaniennes. Les associations varient selon les populations.</p>
<div class="lab">Conséquence</div><p>Dépistage échocardiographique des frères et sœurs ; pas de test génétique utile en clinique.</p></template>
