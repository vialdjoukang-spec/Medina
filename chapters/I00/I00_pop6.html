
<!-- ===== FENÊTRES I00 : Pareto ===== -->
<template data-pop="pareto-i00-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="i00-1,i00-2"></p>
<ul><li>Maladie inflammatoire non suppurée, auto-immune, 2 à 4 semaines après une pharyngite à streptocoque du groupe A.</li><li>Articulations, peau, cerveau guérissent ; la valve garde des séquelles, aggravées par chaque récidive.</li><li>Deux populations de Jones (critères révisés 2015, endossés par la World Heart Federation, recommandés par l’<a href="https://www.who.int/publications/i/item/9789240100077" target="_blank" rel="noopener">OMS 2024</a>) ; le patient est classé selon son origine ; toute personne qui ne vient pas clairement d’une population à bas risque est à risque modéré ou élevé.</li><li><a href="https://pubmed.ncbi.nlm.nih.gov/37914787/" target="_blank" rel="noopener">WHF 2023</a> : stades A (≤ 20 ans, fuite seule), B (fuite + morphologie), C (atteinte avancée), D (compliquée).</li><li>55 millions de malades, 360 000 décès par an (<a href="https://www.who.int/news-room/fact-sheets/detail/rheumatic-heart-disease" target="_blank" rel="noopener">OMS 2025</a>) ; pic 5–15 ans. Suisse : pas de déclaration, pas de registre ; cas chez les migrants.</li></ul></template>

<template data-pop="pareto-i00-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i00-3"></p>
<ul><li>Angine → anticorps et lymphocytes T → réaction croisée (protéine M, glucide A) → organes cibles → cicatrice valvulaire.</li><li>Antibiotique jusqu’au 9<sup>e</sup> jour de l’angine : prévention ; après la poussée : aucun effet sur l’atteinte en cours.</li><li>Poussée : fuite mitrale (anneau dilaté, cordages allongés). Chronique : sténose (fusion commissurale).</li><li>Synovite sans érosion ; chorée par excès de signal dopaminergique.</li></ul></template>

<template data-pop="pareto-i00-etio" data-title="Pareto — Étiologie et facteurs de risque">
<p class="ratio" data-cover="i00-4"></p>
<ul><li>Germe + hôte prédisposé (3–6 % de la population, 5–15 ans) + promiscuité et pauvreté.</li><li>0,3–3 % des angines non traitées se compliquent.</li><li>Infections cutanées incriminées dans le Pacifique et en Australie.</li><li>Un tiers des patients n’ont aucun souvenir d’angine : la sérologie prouve l’infection.</li></ul></template>

<template data-pop="pareto-i00-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i00-5,i00-6"></p>
<ul><li>Arthrite migratrice des grosses articulations (60–75 %), douleur disproportionnée, réponse en 24–72 h aux anti-inflammatoires.</li><li>Cardite 50–70 % avec l’échocardiographie ; souvent silencieuse ; tachycardie de sommeil.</li><li>Souffle holosystolique apical (fuite mitrale), roulement de Carey Coombs, souffle diastolique aortique, frottement.</li><li>Chorée 10–30 %, tardive, sans fièvre : traite de la laitière, signe du pronateur, langue.</li><li>Érythème marginé et nodules &lt; 5 %, associés à la cardite.</li><li>Anti-inflammatoire déjà pris : migration masquée.</li></ul></template>

<template data-pop="pareto-i00-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i00-7"></p>
<ul><li>1. Population de référence. 2. Preuve streptococcique (sauf chorée, cardite indolente). 3. Compter. 4. Échocardiographie chez tous.</li><li>Premier épisode : 2 majeurs ou 1 majeur + 2 mineurs. Récidive : idem ou 3 mineurs.</li><li>Risque modéré ou élevé : monoarthrite et polyarthralgie majeures ; fièvre ≥ 38,0 °C ; vitesse de sédimentation ≥ 30 mm/h.</li><li>Bas risque : polyarthrite seule ; fièvre ≥ 38,5 °C ; vitesse de sédimentation ≥ 60 mm/h ; CRP ≥ 30 mg/L dans les deux cas.</li><li>Une manifestation ne compte qu’une fois (PR exclu si cardite).</li><li>Éliminer d’abord : arthrite septique, endocardite, leucémie, lupus.</li></ul></template>

<template data-pop="pareto-i00-urg" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="i00-8"></p>
<ul><li>Cardite sévère avec insuffisance cardiaque ; fuite mitrale aiguë massive ; bloc complet ; chorée sévère ; fièvre prolongée sur valvulopathie (hémocultures d’abord).</li><li>Hospitaliser tout premier épisode suspect.</li><li>À distance : valvulopathie (I34, I35), fibrillation auriculaire (antivitamine K si fibrillation auriculaire sur rétrécissement mitral), endocardite, insuffisance cardiaque.</li></ul></template>

<template data-pop="pareto-i00-tt" data-title="Pareto — Traitement de la poussée">
<p class="ratio" data-cover="i00-9"></p>
<ul><li>Aucun traitement de la poussée ne protège la valve ; seule la prévention des récidives le fait.</li><li>Éradication pour tous : pénicilline G benzathine (= 1<sup>re</sup> dose de prophylaxie) ou pénicilline V 10 jours.</li><li>Paracétamol tant que le diagnostic est incertain, pour ne pas masquer la migration ; puis naproxène (ou acide acétylsalicylique) selon les symptômes et la baisse de la CRP, sans seuil validé pour l’arrêt, puis décroissance.</li><li>Pas de réponse en 72 h : revoir le diagnostic.</li><li>Sortie : injection faite, rappel, cardiologie, dentiste, éducation avec interprète.</li></ul></template>

<template data-pop="pareto-i00-cardite" data-title="Pareto — Cardite rhumatismale">
<p class="ratio" data-cover="i00-10"></p>
<ul><li>Pancardite dominée par la valvulite mitrale ± aortique ; troponine peu élevée.</li><li>Insuffisance cardiaque = fuite, pas défaillance contractile : diurétique + inhibiteur de l’enzyme de conversion.</li><li>Corticoïdes dans la cardite sévère : place discutée, sans protection valvulaire prouvée.</li><li>Chirurgie si fuite massive réfractaire ; réparation préférée chez l’enfant.</li><li>Fuite légère : régression fréquente sous prophylaxie (essai <a href="https://pubmed.ncbi.nlm.nih.gov/34767321/" target="_blank" rel="noopener">GOAL</a> : progression 0,8 % contre 8,2 %).</li></ul></template>

<template data-pop="pareto-i00-choree" data-title="Pareto — Chorée de Sydenham">
<p class="ratio" data-cover="i00-11"></p>
<ul><li>Fille de 5–15 ans, 1–6 mois après l’angine ; peut être isolée ; critère suffisant.</li><li>Mouvements brusques, irréguliers, absents au sommeil ; hypotonie ; labilité émotionnelle, symptômes obsessionnels.</li><li>CRP et ASLO souvent normales ; anti-DNase B plus utiles ; échocardiographie obligatoire.</li><li>Différentiel : lupus, antiphospholipides, médicaments, hyperthyroïdie, Wilson.</li><li>Traitement : prophylaxie pour tous ; acide valproïque ou carbamazépine si gênante ; neuroleptiques en dernier recours.</li><li>Guérison en moins de 6 mois le plus souvent ; récidive possible (grossesse, œstrogènes).</li></ul></template>

<template data-pop="pareto-i00-prim" data-title="Pareto — Prévention primaire">
<p class="ratio" data-cover="i00-12"></p>
<ul><li>Score de Centor (SSI 2024) : 0–2 rien ; 3–4 test rapide si un antibiotique est envisagé (enfant de plus de 3 ans) ; antibiotique si positif ; pas de culture de routine.</li><li><a href="https://www.who.int/publications/i/item/9789240100077" target="_blank" rel="noopener">OMS 2024</a> : antibiotique pour toute angine streptococcique prouvée (forte) ; pénicilline orale ou intramusculaire en première intention.</li><li>Patient autochtone : pénicilline V 1 million d’UI ou amoxicilline 1 g toutes les 12 heures, 6 jours (SSI 2024).</li><li>Patient venu d’une région endémique ou avec antécédent : 10 jours de pénicilline orale (informations suisses) ou pénicilline G benzathine en dose unique.</li><li>Allergie non sévère : céfuroxime ; contre-indication à toutes les bêtalactamines : clarithromycine (adulte), clindamycine (enfant).</li><li>Ne pas tester les tableaux viraux ni contrôler après traitement (portage).</li></ul></template>

<template data-pop="pareto-i00-prev" data-title="Pareto — Prévention secondaire, suivi et pronostic">
<p class="ratio" data-cover="i00-13"></p>
<ul><li>Pénicilline G benzathine intramusculaire : premier choix (<a href="https://www.who.int/publications/i/item/9789240100077" target="_blank" rel="noopener">OMS 2024</a>) ; Extencilline® 1,2 million d’UI (plus de 30 kg) ou 600 000 UI ; <button class="w" data-k="i00-d-bpg">toutes les 3 à 4 semaines, 3 en cas de récidive malgré une bonne observance</button>.</li><li>Oral si l’injection est impossible (OMS) ; allergie confirmée : macrolide ; doses orales de prophylaxie non fixées par une source suisse ou européenne.</li><li>Durée (information suisse) : 5 ans ou 21 ans sans atteinte cardiaque ; 10 ans ou 21 ans si atteinte transitoire ; 10 ans ou 40 ans, parfois à vie, si atteinte persistante.</li><li>Suisse : Extencilline® autorisée, ruptures d’approvisionnement ; commande anticipée.</li><li>Suivi : observance, échocardiographie selon la sévérité, dentiste, vaccins, transition vers l’adulte.</li><li>Pronostic = cardite initiale + récidives.</li></ul></template>

<template data-pop="pareto-i00-part" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="i00-14"></p>
<ul><li>Grossesse : prophylaxie poursuivie ; pas d’anti-inflammatoire non stéroïdien après 20 semaines ; chorée gravidique ; rétrécissement mitral qui décompense.</li><li>Adulte migrant avec souffle : rhumatismal jusqu’à preuve du contraire ; stade WHF.</li><li>Allergie : pas de test systématique sans antécédent (OMS) ; dose test orale si antécédent léger ; soja ou arachide : pas d’Extencilline®.</li><li>Insuffisance rénale : 75 % de la dose de 10 à 50 mL/min, 20 à 50 % au-dessous de 10 mL/min (information suisse).</li><li>Arthrite post-streptococcique : prophylaxie non fixée par une source suisse, européenne ou de l’OMS ; échocardiographie de contrôle.</li><li>Rhumatisme possible en population à risque : prophylaxie 12 mois puis réévaluation (Australie 2020).</li></ul></template>

<template data-pop="pareto-i00-bio" data-title="Pareto — Biologie et preuve streptococcique">
<p class="ratio" data-cover="i00-e-2,i00-e-3"></p>
<ul><li>CRP ≥ 30 mg/L et vitesse de sédimentation ≥ 60 (ou ≥ 30) mm/h : critères mineurs ; normales dans la chorée.</li><li>Troponine franchement élevée : penser myocardite virale. Cytopénies : leucémie avant corticoïde.</li><li>Culture de gorge = référence de la pharyngite, souvent négative au moment du rhumatisme.</li><li>ASLO : pic 3–6 semaines ; anti-DNase B : pic 6–8 semaines, plus durables, utiles après infection cutanée et dans la chorée.</li><li>Preuve forte : hausse significative à 10–14 jours ; seuil = 80<sup>e</sup> percentile pour l’âge.</li></ul></template>

<template data-pop="pareto-i00-echo" data-title="Pareto — Électrocardiogramme et échocardiographie">
<p class="ratio" data-cover="i00-e-4,i00-e-5"></p>
<ul><li>PR allongé : &gt; 0,16 s (3–11 ans), &gt; 0,18 s (12–16 ans), &gt; 0,20 s (≥ 17 ans).</li><li>Fuite mitrale pathologique : 2 incidences, jet ≥ 2 cm (≥ 1,5 cm si &lt; 30 kg), ≥ 3 m/s, holosystolique.</li><li>Fuite aortique pathologique : 2 incidences, ≥ 1 cm, ≥ 3 m/s, holodiastolique.</li><li>Poussée : anneau dilaté, cordages allongés, prolapsus de la pointe antérieure. Chronique : feuillet épaissi (≥ 3/4/5 mm selon l’âge), restriction, fusion.</li><li>Fuite physiologique ≠ cardite infraclinique.</li></ul></template>

<template data-pop="pareto-i00-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i00-e-1,i00-e-2,i00-e-3,i00-e-4,i00-e-5,i00-e-6"></p>
<ul><li>Aucun gold standard du rhumatisme ; références : culture de gorge (pharyngite), échocardiographie Doppler (cardite).</li><li>Bilan de base : ASLO + anti-DNase B, CRP, vitesse de sédimentation, hémogramme, ECG, échocardiographie.</li><li>Ponction si monoarthrite ; hémocultures si fièvre sur valvulopathie.</li><li>Chorée : CRP normale, anti-DNase B élevées, cardite infraclinique fréquente.</li><li>Arthrite post-streptococcique : échocardiographie normale, faible réponse aux anti-inflammatoires.</li></ul></template>

<template data-pop="pareto-i00-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i00-sm,i00-si,i00-sh,i00-sa,i00-sn,i00-sg"></p>
<ul><li>Streptocoque A : hémolyse β, glucide de groupe, protéine M (plus de 200 types), streptolysine O et DNase B (sérologie) ; toujours sensible à la pénicilline.</li><li>Mimétisme : protéine M ≈ myosine ; anticorps sur l’endothélium valvulaire → lymphocytes T CD4 dans le feuillet → diffusion épitopique → fibrose.</li><li>Nodule d’Aschoff, cellules d’Anitschkow ; verrucosités sur la ligne de fermeture ; fusion commissurale (cible du ballon).</li><li>Chorée : anticorps → signal dopaminergique ↑ → voie directe → mouvement.</li><li>Héritabilité ≈ 60 %, polygénique : dépistage de la fratrie.</li></ul></template>

<template data-pop="pareto-i00-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i00-p-1,i00-p-2,i00-p-3,i00-p-4,i00-p-5"></p>
<ul><li>Antibiotique = germe ; anti-inflammatoire = symptômes ; aucun ne répare la valve.</li><li>Extencilline® : 1,2 million d’UI (plus de 30 kg) / 600 000 UI, intramusculaire profonde, jamais intravasculaire ; surveillance d’une demi-heure ; contre-indiquée en cas d’allergie au soja ou à l’arachide.</li><li>Angine : pénicilline V ou amoxicilline (SSI 2024, 6 jours ; 10 jours chez le patient à risque) ; allergie : céfuroxime, clarithromycine, clindamycine.</li><li>Naproxène : au maximum 15 mg/kg par jour chez l’enfant selon l’information suisse ; acide acétylsalicylique à forte dose hors autorisation suisse (Reye).</li><li>Prednisone 1–2 mg/kg/jour (maximum 80 mg) dans la cardite sévère ; ivermectine selon l’origine.</li><li>Chorée, hors indication suisse : carbamazépine (HLA-B*1502 selon l’origine) ou valproate (contre-indiqué chez la jeune fille sauf programme de prévention de la grossesse).</li><li>Furosémide enfant : 2 mg/kg par voie orale, au maximum 40 mg par jour.</li><li>Éviter : tétracyclines, anticoagulants oraux directs dans le rétrécissement mitral.</li></ul></template>
