
<!-- ===== FENÊTRES I00 : diagnostic et examens ===== -->
<template data-pop="i00-aslo" data-title="Antistreptolysines O et anti-DNase B">
<div class="lab">Antigènes</div><p>Streptolysine O : toxine perforante sécrétée, inactivée par l’oxygène. Désoxyribonucléase B : enzyme sécrétée par presque toutes les souches du groupe A.</p>
<div class="lab">Cinétique</div><p>ASLO : hausse dès la première semaine, pic à 3–6 semaines, normalisation en 6 à 12 mois. Anti-DNase B : pic à 6–8 semaines, plateau plus long.</p>
<div class="lab">Seuils</div><p>Limite supérieure de la normale = 80<sup>e</sup> percentile d’une population du même âge ; plus élevée chez l’enfant d’âge scolaire que chez l’adulte. Lire les valeurs du laboratoire.</p>
<div class="lab">Preuve forte</div><p>Hausse significative entre deux prélèvements à 10–14 jours d’intervalle, dosés dans le même laboratoire ; le seuil dépend de la méthode et du référentiel.</p>
<div class="lab">Sensibilité</div><p>ASLO seules : environ 80 % des rhumatismes ; plus de 90 % si les deux anticorps sont dosés.</p>
<div class="lab">Pièges</div><p>Titre élevé isolé : infection récente ou ancienne. Infection cutanée : ASLO faibles (streptolysine O inactivée par les lipides cutanés), anti-DNase B conservées. Chorée : ASLO souvent revenues à la normale.</p>
<div class="lab">Erreur fréquente</div><p>Les demander pour une angine en cours : ils ne sont pas encore élevés.</p></template>

<template data-pop="i00-pr" data-title="Allongement du PR pour l’âge">
<div class="lab">Seuils (recommandations australiennes 2020)</div><p>3 à 11 ans : &gt; 0,16 s. 12 à 16 ans : &gt; 0,18 s. À partir de 17 ans : &gt; 0,20 s. La révision de 2015 des critères de Jones exige un PR allongé pour l’âge sans fixer de seuil propre.</p>
<div class="lab">Mécanisme</div><p>Ralentissement de la conduction nodale par inflammation et tonus vagal augmenté.</p>
<div class="lab">Statut</div><p>Critère mineur, qui ne compte pas si la cardite est retenue comme critère majeur. Ne constitue pas à lui seul une cardite.</p>
<div class="lab">Évolution</div><p>Se normalise en quelques jours à semaines ; un ECG de contrôle documente la régression.</p>
<div class="lab">Piège</div><p>Un PR de 0,19 s est normal chez l’adulte et allongé chez l’enfant de 10 ans.</p>
<div class="lab">Pourquoi un seuil selon l’âge</div><p>Le PR mesure le temps de conduction des oreillettes aux ventricules, dont la plus grande part se passe dans le nœud auriculoventriculaire. Il s’allonge avec la taille du cœur pendant la croissance et raccourcit quand la fréquence s’accélère.</p>
<div class="lab">Pourquoi un simple critère mineur</div><p>L’allongement du PR n’est pas propre au rhumatisme : il s’observe aussi chez les sujets à tonus vagal élevé, sous certains médicaments ou au cours d’autres infections. Il ne témoigne pas d’une atteinte valvulaire, qui fait le pronostic. Il sert donc d’argument d’inflammation, non de preuve de cardite.</p>
<div class="lab">Ce qui change la décision</div><p>Un PR allongé ne prolonge pas la prophylaxie à lui seul ; seule une valvulite, clinique ou échocardiographique, la porte à 10 ans ou jusqu’à 21 ans. Un bloc de plus haut degré ou un rythme jonctionnel impose en revanche un ECG quotidien jusqu’à normalisation, et une surveillance continue en cas de bloc complet.</p>
<div class="lab">Source complémentaire</div><p>Critères de Jones révisés 2015 (<a href="https://pubmed.ncbi.nlm.nih.gov/25908771/" target="_blank" rel="noopener">Gewitz et al., <i>Circulation</i> 2015</a>, endossés par la World Heart Federation), tableau reproduit par l’<a href="https://www.who.int/publications/i/item/9789240100077" target="_blank" rel="noopener">OMS 2024</a> ; seuils chiffrés : recommandations australiennes 2020.</p>
</template>

<template data-pop="i00-carditeinfra" data-title="Cardite infraclinique">
<div class="lab">Définition</div><p>Valvulite détectée à l’échocardiographie Doppler (fuite pathologique selon les quatre critères de Doppler, avec ou sans anomalie morphologique) sans souffle audible.</p>
<div class="lab">Statut</div><p>Critère majeur dans toutes les populations depuis la révision de 2015 des critères de Jones, reprise par l’<a href="https://www.who.int/publications/i/item/9789240100077" target="_blank" rel="noopener">OMS 2024</a>.</p>
<div class="lab">Conséquence</div><p>Échocardiographie chez tout patient suspect ; répétée si normale et si la poussée se prolonge. Le diagnostic de cardite prolonge la prophylaxie (10 ans ou jusqu’à 21 ans au minimum).</p>
<div class="lab">Piège</div><p>Une fuite physiologique brève, courte ou vue dans une seule incidence n’est pas une cardite.</p>
<div class="lab">Pourquoi l’auscultation la manque</div><p>Une petite fuite produit un jet de faible débit dont le bruit reste sous le seuil audible, surtout chez un enfant tachycarde et fébrile. Le Doppler détecte le flux régurgitant quelle que soit son intensité acoustique.</p>
<div class="lab">Pourquoi des critères Doppler stricts</div><p>De petites fuites physiologiques, brèves, courtes et lentes, existent chez beaucoup d’enfants sains. Une vraie fuite est poussée pendant toute la systole par la différence de pression entre ventricule et oreillette : les critères de vitesse, de longueur, de durée et de deux incidences l’en distinguent.</p>
<div class="lab">Pronostic</div><p>Une revue systématique trouve une cardite infraclinique dans environ 17 % des poussées ; elle persiste ou s’aggrave chez près de la moitié des patients 3 à 23 mois plus tard. Ces données sont peu nombreuses et de qualité faible ; par prudence, les recommandations traitent la cardite infraclinique comme une cardite clinique pour la durée de la prophylaxie.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/17034886/" target="_blank" rel="noopener">Revue systématique de la cardite infraclinique, <i>International Journal of Cardiology</i> 2007;119:54-58</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37914787/" target="_blank" rel="noopener">Rwebembera et al., <i>Nature Reviews Cardiology</i> 2024</a> (WHF 2023), encadré 5.</p>
</template>

<template data-pop="i00-psra" data-title="Arthrite réactionnelle post-streptococcique">
<div class="lab">Tableau</div><p>Arthrite après une angine streptococcique, qui ne remplit pas les critères de Jones.</p>
<div class="lab">Différences avec le rhumatisme</div><p>Délai plus court (environ 10 jours) ; arthrite non migratrice, persistante, touchant grosses et petites articulations, parfois le rachis ; réponse faible aux anti-inflammatoires ; durée plus longue (semaines à mois).</p>
<div class="lab">Risque cardiaque</div><p>Une petite fraction développe ensuite une valvulopathie. Aucune recommandation suisse, européenne ou de l’OMS lue ne fixe de prophylaxie pour cette entité : la conduite est une lacune nommée. Une échocardiographie de contrôle et une décision individuelle s’imposent ; dans une population à risque, le tableau relève souvent du rhumatisme « possible » des recommandations australiennes 2020 (12 mois de prophylaxie, puis réévaluation).</p>
<div class="lab">Piège</div><p>Dans une population à risque, une monoarthrite avec preuve streptococcique doit d’abord être considérée comme un rhumatisme possible.</p></template>

<template data-pop="i00-tdr" data-title="Test antigénique rapide du streptocoque">
<div class="lab">Principe</div><p>Détection immunologique du glucide du groupe A sur un écouvillon pharyngé ; résultat en 5 à 10 minutes.</p>
<div class="lab">Performances</div><p>Spécificité élevée (≥ 95 %) : un test positif justifie le traitement. Sensibilité d’environ 85 %, variable selon la qualité du prélèvement.</p>
<div class="lab">Technique</div><p>Frotter énergiquement les deux amygdales et la paroi pharyngée postérieure, sans toucher la langue ni les joues.</p>
<div class="lab">Test négatif</div><p>La SSI 2024 ne prévoit pas de culture de gorge. Chez l’enfant venu d’une région endémique avec une forte suspicion, aucune source suisse ne tranche : la culture de contrôle relève d’une décision individuelle.</p>
<div class="lab">Indications</div><p>Score de Centor de 3 ou 4 et antibiotique envisagé en cas de résultat positif ; enfant de plus de 3 ans (SSI 2024) ; pas de test si le tableau est clairement viral, ni après traitement.</p></template>

<template data-pop="i00-mcisaac" data-title="Score de Centor (Société suisse d’infectiologie 2024)">
<div class="lab">Items (1 point chacun)</div><p>Absence de toux ; exsudat amygdalien ; fièvre ou antécédent de fièvre &gt; 38 °C ; adénopathies cervicales antérieures sensibles. La SSI l’applique à l’enfant et à l’adulte.</p>
<div class="lab">Lecture suisse</div><p>0–2 : pas de frottis, pas d’antibiotique. 3–4 : test antigénique rapide envisagé si un antibiotique est envisagé, chez l’enfant de plus de 3 ans ; antibiotique seulement si le test est positif ; pas de culture.</p>
<div class="lab">Score de McIsaac</div><p>Variante canadienne qui ajoute un point d’âge (3 à 14 ans : +1 ; 45 ans et plus : −1). La SSI relève que les recommandations françaises l’utilisent, mais retient le score de Centor, plus simple et le plus utilisé en Suisse, comme les recommandations européennes de l’ESCMID.</p>
<div class="lab">Limites</div><p>Aucun score ne remplace un test (<a href="https://www.who.int/publications/i/item/9789240100077" target="_blank" rel="noopener">OMS 2024</a>). Le score est une probabilité avant test, pas un diagnostic.</p>
<div class="lab">Pourquoi ces signes</div><p>Le streptocoque envahit l’amygdale et provoque une inflammation localisée : exsudat, adénopathies cervicales antérieures sensibles et fièvre. Un virus respiratoire atteint l’ensemble de la muqueuse des voies aériennes et donne toux, rhinorrhée, enrouement ou conjonctivite. Aucun signe n’est spécifique : un virus peut aussi produire un exsudat, et le streptocoque peut coexister avec une toux. Chaque item déplace la probabilité sans la rendre certaine.</p>
<div class="lab">Ce qui change la décision</div><p>Le score dit qui tester, non qui traiter. Il est validé pour estimer la probabilité d’une angine streptococcique, pas le risque de rhumatisme. Chez un enfant venu d’une région endémique, le seuil de test relève donc aussi du risque de rhumatisme, que la SSI ne traite pas.</p>
<div class="lab">Source</div><p><a href="https://ssi.guidelines.ch/guideline/2408/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, « Pharyngite »</a>, validée le 08.05.2024, lue le 08.10.2026 ; <a href="https://pubmed.ncbi.nlm.nih.gov/22432746/" target="_blank" rel="noopener">ESCMID, <i>Guideline for the management of acute sore throat</i>, 2012</a> ; <a href="https://www.who.int/publications/i/item/9789240100077" target="_blank" rel="noopener">OMS 2024</a>, section 4.2.</p>
</template>

<template data-pop="i00-choree-psy" data-title="Troubles neuropsychiatriques de la chorée">
<div class="lab">Fréquence</div><p>Fréquents : labilité émotionnelle, irritabilité, anxiété, symptômes obsessionnels et compulsifs, trouble de l’attention.</p>
<div class="lab">Chronologie</div><p>Peuvent précéder les mouvements de quelques jours à semaines et leur survivre.</p>
<div class="lab">Mécanisme</div><p>Le striatum participe aux boucles cortico-sous-corticales qui régulent les émotions et les comportements répétitifs.</p>
<div class="lab">Prise en charge</div><p>Information de la famille et de l’école, soutien psychologique ; avis pédopsychiatrique si les symptômes persistent après la résolution de la chorée.</p></template>

<template data-pop="i00-pandas" data-title="PANDAS">
<div class="lab">Définition proposée</div><p>Apparition brutale de symptômes obsessionnels et compulsifs ou de tics chez l’enfant, en relation temporelle avec une infection streptococcique, sans chorée ni autre critère de rhumatisme.</p>
<div class="lab">Statut</div><p>Débattu : la relation causale n’est pas établie. Le concept élargi de syndrome neuropsychiatrique pédiatrique aigu ne requiert plus le streptocoque.</p>
<div class="lab">Différence avec la chorée de Sydenham</div><p>La chorée de Sydenham est un critère majeur de Jones, s’accompagne souvent d’une cardite et impose une prophylaxie. Le PANDAS ne comporte ni chorée ni cardite et ne justifie pas de prophylaxie au long cours en dehors d’études.</p></template>
<template data-pop="i00-crp-vs" data-title="CRP et vitesse de sédimentation">
<div class="lab">Physiologie normale</div><p>La CRP est une protéine de la phase aiguë. Les hépatocytes la synthétisent sous l’effet de l’interleukine 6, quelques heures après le début d’une inflammation. Sa demi-vie plasmatique, d’environ 19 heures, ne varie pas avec la maladie : sa concentration reflète donc le débit de synthèse du moment. La vitesse de sédimentation mesure la hauteur dont les hématies tombent en une heure dans un tube. Normalement, les charges négatives de leur membrane les tiennent écartées les unes des autres, et elles sédimentent lentement.</p>
<div class="lab">Mécanisme</div><p>Le fibrinogène et les immunoglobulines neutralisent ces charges. Les hématies s’empilent alors en rouleaux, plus lourds, qui tombent plus vite. Le fibrinogène s’élève en quelques jours et décroît lentement : la vitesse de sédimentation suit l’inflammation avec un retard de plusieurs jours à semaines. Elle dépend aussi des hématies elles-mêmes : l’anémie l’accélère, la polyglobulie la ralentit. La grossesse et l’insuffisance rénale l’augmentent par la hausse du fibrinogène et l’anémie. Dans le lupus, l’excès d’immunoglobulines accélère la sédimentation alors que la CRP reste souvent peu élevée. L’explication probable est que l’interféron alpha, abondant pendant les poussées lupiques, freine la synthèse hépatique de la CRP ; ce frein a été démontré sur des hépatocytes en culture.</p>
<div class="lab">Conséquence clinique</div><p>Au début d’une arthrite ou d’une cardite, la CRP monte la première ; sous traitement, elle baisse en quelques jours, alors que la vitesse de sédimentation reste élevée plus longtemps. La CRP est donc le meilleur marqueur de suivi. Dans la chorée, qui survient quand l’inflammation systémique est éteinte, les deux sont souvent normales.</p>
<div class="lab">Ce qui change la décision</div><p>Avant de compter une vitesse de sédimentation comme critère mineur, vérifier l’hémoglobine, la grossesse et la fonction rénale, qui peuvent l’élever sans inflammation. Pendant le traitement, la baisse de la CRP accompagne la décroissance de l’anti-inflammatoire, mais aucun seuil n’est validé pour décider de l’arrêt.</p>
<div class="lab">Source</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/12813013/" target="_blank" rel="noopener">Pepys et Hirschfield, J Clin Invest 2003;111:1805-12</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29094869/" target="_blank" rel="noopener">Bray et al., Wisconsin Medical Journal 2016;115:317-21</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19950271/" target="_blank" rel="noopener">Enocsson et al., Arthritis Rheum 2009;60:3755-60</a> ; recommandations australiennes 2025, tableau 6.8 et chapitre 7.</p></template>
