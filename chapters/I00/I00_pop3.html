
<!-- ===== FENÊTRES I00 : diagnostic et examens ===== -->
<template data-pop="i00-aslo" data-title="Antistreptolysines O et anti-DNase B">
<div class="lab">Antigènes</div><p>Streptolysine O : toxine perforante sécrétée, inactivée par l’oxygène. Désoxyribonucléase B : enzyme sécrétée par presque toutes les souches du groupe A.</p>
<div class="lab">Cinétique</div><p>ASLO : hausse dès la première semaine, pic à 3–6 semaines, normalisation en 6 à 12 mois. Anti-DNase B : pic à 6–8 semaines, plateau plus long.</p>
<div class="lab">Seuils</div><p>Limite supérieure de la normale = 80<sup>e</sup> percentile d’une population du même âge ; plus élevée chez l’enfant d’âge scolaire que chez l’adulte. Lire les valeurs du laboratoire.</p>
<div class="lab">Preuve forte</div><p>Hausse significative entre deux prélèvements à 10–14 jours d’intervalle, dosés dans le même laboratoire ; le seuil dépend de la méthode et du référentiel.</p>
<div class="lab">Sensibilité</div><p>ASLO seules : environ 80 % des rhumatismes ; plus de 90 % si les deux anticorps sont dosés.</p>
<div class="lab">Pièges</div><p>Titre élevé isolé : infection récente ou ancienne. Infection cutanée : ASLO faibles (streptolysine O inactivée par les lipides cutanés), anti-DNase B conservées. Chorée : ASLO souvent revenues à la normale.</p>
<div class="lab">Erreur fréquente</div><p>Les demander pour une angine en cours : ils ne sont pas encore élevés.</p></template>

<template data-pop="i00-pr" data-title="Allongement du PR pour l’âge">
<div class="lab">Seuils (recommandations australiennes 2020)</div><p>3 à 11 ans : &gt; 0,16 s. 12 à 16 ans : &gt; 0,18 s. À partir de 17 ans : &gt; 0,20 s. L’AHA 2015 exige un PR allongé pour l’âge sans fixer de seuil propre.</p>
<div class="lab">Mécanisme</div><p>Ralentissement de la conduction nodale par inflammation et tonus vagal augmenté.</p>
<div class="lab">Statut</div><p>Critère mineur, qui ne compte pas si la cardite est retenue comme critère majeur. Ne constitue pas à lui seul une cardite.</p>
<div class="lab">Évolution</div><p>Se normalise en quelques jours à semaines ; un ECG de contrôle documente la régression.</p>
<div class="lab">Piège</div><p>Un PR de 0,19 s est normal chez l’adulte et allongé chez l’enfant de 10 ans.</p></template>

<template data-pop="i00-carditeinfra" data-title="Cardite infraclinique">
<div class="lab">Définition</div><p>Valvulite détectée à l’échocardiographie Doppler (fuite pathologique selon les quatre critères de Doppler, avec ou sans anomalie morphologique) sans souffle audible.</p>
<div class="lab">Statut</div><p>Critère majeur dans toutes les populations depuis l’AHA 2015.</p>
<div class="lab">Conséquence</div><p>Échocardiographie chez tout patient suspect ; répétée si normale et si la poussée se prolonge. Le diagnostic de cardite prolonge la prophylaxie (10 ans ou jusqu’à 21 ans au minimum).</p>
<div class="lab">Piège</div><p>Une fuite physiologique brève, courte ou vue dans une seule incidence n’est pas une cardite.</p></template>

<template data-pop="i00-psra" data-title="Arthrite réactionnelle post-streptococcique">
<div class="lab">Tableau</div><p>Arthrite après une angine streptococcique, qui ne remplit pas les critères de Jones.</p>
<div class="lab">Différences avec le rhumatisme</div><p>Délai plus court (environ 10 jours) ; arthrite non migratrice, persistante, touchant grosses et petites articulations, parfois le rachis ; réponse faible aux anti-inflammatoires ; durée plus longue (semaines à mois).</p>
<div class="lab">Risque cardiaque</div><p>Une petite fraction développe ensuite une valvulopathie. L’AHA 2009 propose une prophylaxie secondaire pendant un an au plus, avec échocardiographie de contrôle ; elle est arrêtée si aucune atteinte valvulaire n’apparaît, et poursuivie comme un rhumatisme dans le cas contraire.</p>
<div class="lab">Piège</div><p>Dans une population à risque, une monoarthrite avec preuve streptococcique doit d’abord être considérée comme un rhumatisme possible.</p></template>

<template data-pop="i00-tdr" data-title="Test antigénique rapide du streptocoque">
<div class="lab">Principe</div><p>Détection immunologique du glucide du groupe A sur un écouvillon pharyngé ; résultat en 5 à 10 minutes.</p>
<div class="lab">Performances</div><p>Spécificité élevée (≥ 95 %) : un test positif justifie le traitement. Sensibilité d’environ 85 %, variable selon la qualité du prélèvement.</p>
<div class="lab">Technique</div><p>Frotter énergiquement les deux amygdales et la paroi pharyngée postérieure, sans toucher la langue ni les joues.</p>
<div class="lab">Test négatif</div><p>Adulte à bas risque : pas de culture. Enfant, suspicion forte ou patient d’une population à risque : culture de gorge de contrôle.</p>
<div class="lab">Indications</div><p>Selon le score de McIsaac ; pas de test si le tableau est clairement viral ; pas de test avant 3 ans en règle générale, ni après traitement.</p></template>

<template data-pop="i00-mcisaac" data-title="Score de McIsaac">
<div class="lab">Items (1 point chacun)</div><p>Fièvre &gt; 38 °C ; absence de toux ; adénopathies cervicales antérieures sensibles ; tuméfaction ou exsudat amygdalien.</p>
<div class="lab">Correction d’âge</div><p>3 à 14 ans : +1. 15 à 44 ans : 0. 45 ans et plus : −1.</p>
<div class="lab">Lecture</div><p>0–2 : en Suisse, pas de test, pas d’antibiotique (IDSA : test dès 2 chez l’enfant). ≥ 3 : test antigénique rapide ; antibiotique si positif ; culture de contrôle si négatif chez l’enfant d’une population à risque.</p>
<div class="lab">Limites</div><p>Aucun score ne remplace un test (OMS 2024). Le score est une probabilité avant test, pas un diagnostic.</p>
<div class="lab">Origine</div><p>Adaptation du score de Centor (adulte) à l’enfant par l’ajout de l’âge (McIsaac, 1998).</p></template>

<template data-pop="i00-choree-psy" data-title="Troubles neuropsychiatriques de la chorée">
<div class="lab">Fréquence</div><p>Fréquents : labilité émotionnelle, irritabilité, anxiété, symptômes obsessionnels et compulsifs, trouble de l’attention.</p>
<div class="lab">Chronologie</div><p>Peuvent précéder les mouvements de quelques jours à semaines et leur survivre.</p>
<div class="lab">Mécanisme</div><p>Le striatum participe aux boucles cortico-sous-corticales qui régulent les émotions et les comportements répétitifs.</p>
<div class="lab">Prise en charge</div><p>Information de la famille et de l’école, soutien psychologique ; avis pédopsychiatrique si les symptômes persistent après la résolution de la chorée.</p></template>

<template data-pop="i00-pandas" data-title="PANDAS">
<div class="lab">Définition proposée</div><p>Apparition brutale de symptômes obsessionnels et compulsifs ou de tics chez l’enfant, en relation temporelle avec une infection streptococcique, sans chorée ni autre critère de rhumatisme.</p>
<div class="lab">Statut</div><p>Débattu : la relation causale n’est pas établie. Le concept élargi de syndrome neuropsychiatrique pédiatrique aigu ne requiert plus le streptocoque.</p>
<div class="lab">Différence avec la chorée de Sydenham</div><p>La chorée de Sydenham est un critère majeur de Jones, s’accompagne souvent d’une cardite et impose une prophylaxie. Le PANDAS ne comporte ni chorée ni cardite et ne justifie pas de prophylaxie au long cours en dehors d’études.</p></template>
