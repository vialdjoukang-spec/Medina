
<!-- ===== FENÊTRES I35 : anamnèse et examen clinique ===== -->
<template data-pop="i35-atcd-souffle" data-title="Souffle connu depuis l’enfance">
<div class="lab">Pourquoi le demander</div><p>Un souffle entendu dans l’enfance, lors d’un examen scolaire ou du recrutement militaire, oriente vers une anomalie congénitale, le plus souvent une bicuspidie.</p>
<div class="lab">Conséquence</div><p>Chez l’adulte jeune avec un RA ou une IA, il fait rechercher une bicuspidie, une aortopathie et une coarctation, et proposer un dépistage familial.</p>
<div class="lab">Piège</div><p>Un souffle qualifié autrefois de « fonctionnel » peut correspondre à une bicuspidie non calcifiée.</p></template>

<template data-pop="i35-atcd-fam" data-title="Histoire familiale">
<div class="lab">Questions</div><p>Bicuspidie, anévrisme ou dissection aortique, mort subite inexpliquée, chirurgie aortique précoce chez un parent du premier degré ; traits marfanoïdes.</p>
<div class="lab">Valeur</div><p>Une dissection chez un apparenté abaisse le seuil opératoire aortique et fait évoquer une aortopathie héréditaire.</p>
<div class="lab">Conséquence</div><p>Dépistage échocardiographique des apparentés au premier degré ; consultation de génétique si une maladie héréditaire du tissu conjonctif est suspectée.</p></template>

<template data-pop="i35-atcd-radio" data-title="Radiothérapie médiastinale">
<div class="lab">Contexte</div><p>Lymphome de Hodgkin, cancer du sein gauche, traités par radiothérapie thoracique des années ou des décennies auparavant.</p>
<div class="lab">Atteintes</div><p>Épaississement et calcification des valves (aortique et mitrale), coronaropathie ostiale, péricardite constrictive, aorte calcifiée, fibrose médiastinale.</p>
<div class="lab">Conséquence pour la décision</div><p>La fibrose médiastinale et l’aorte « porcelaine » compliquent la chirurgie : ces antécédents plaident pour le TAVI dans la discussion de Heart Team.</p></template>

<template data-pop="i35-s-dyspnee" data-title="Dyspnée d’effort">
<div class="lab">Caractérisation</div><p>Niveau d’effort déclenchant (étages, distance de marche, pente), évolution sur les derniers mois, classe fonctionnelle NYHA, orthopnée.</p>
<div class="lab">Mécanisme</div><p>RA : ventricule rigide, pression télédiastolique élevée à l’effort, puis baisse de la FEVG. IA : élévation de la pression de remplissage quand le ventricule se décompense.</p>
<div class="lab">Piège</div><p>Attribuer la dyspnée à l’âge, au poids ou au déconditionnement. Chez un patient porteur d’un RA sévère, elle est présumée valvulaire jusqu’à preuve du contraire ; une BPCO ou une anémie associée se recherchent sans retarder la décision.</p></template>

<template data-pop="i35-s-reduc" data-title="Réduction insidieuse de l’activité">
<div class="lab">Description</div><p>Le patient se déclare asymptomatique, mais a renoncé progressivement à certaines activités : randonnée, jardinage, escaliers, port de charges.</p>
<div class="lab">Comment la découvrir</div><p>Comparer l’activité actuelle à celle d’il y a un ou deux ans ; interroger un proche ; demander ce que le patient ne fait plus.</p>
<div class="lab">Conséquence</div><p>Ce patient est en réalité symptomatique. En cas de doute, l’épreuve d’effort objective la limitation.</p></template>

<template data-pop="i35-s-angor" data-title="Angor dans les valvulopathies aortiques">
<div class="lab">RA</div><p>Angor d’effort typique, cédant au repos, avec ou sans maladie coronaire ; il est plus fréquent chez l’homme, chez qui la maladie coronaire associée est plus fréquente, alors que la femme se présente plus souvent avec une dyspnée (ESC/EACTS 2025, section 17.1).</p>
<div class="lab">IA</div><p>Angor plus rare, parfois nocturne : la bradycardie du sommeil allonge la diastole, augmente le volume régurgité et abaisse la pression diastolique aortique, donc la perfusion coronaire.</p>
<div class="lab">Conduite</div><p>Évaluation coronaire avant l’intervention. Les dérivés nitrés sont maniés avec prudence dans le RA sévère (risque d’hypotension).</p></template>

<template data-pop="i35-s-palp" data-title="Palpitations et conscience des battements">
<div class="lab">IA chronique</div><p>Sensation de battements forts, surtout en décubitus latéral gauche, ou de pulsations cervicales : c’est la perception du grand volume d’éjection.</p>
<div class="lab">RA</div><p>Palpitations irrégulières : fibrillation auriculaire, qui peut déclencher une décompensation par perte de la contraction auriculaire.</p>
<div class="lab">Syncope associée</div><p>Des palpitations suivies de syncope font rechercher une arythmie ventriculaire ou un bloc (Holter, surveillance prolongée).</p></template>

<template data-pop="i35-s-dissect" data-title="Douleur de dissection aortique">
<div class="lab">Caractères</div><p>Début brutal, intensité maximale d’emblée, douleur déchirante ou lancinante, thoracique antérieure (type A) ou dorsale, migratrice.</p>
<div class="lab">Signes associés</div><p>Souffle diastolique nouveau, asymétrie tensionnelle ou des pouls, déficit neurologique, syncope, signes d’ischémie d’organe, tamponnade.</p>
<div class="lab">Terrain</div><p>Hypertension, bicuspidie, syndrome de Marfan, grossesse, cocaïne, antécédent de chirurgie cardiaque.</p>
<div class="lab">Conduite</div><p>Tomodensitométrie aortique en urgence. Voir la fenêtre « Dissection aortique de type A ».</p></template>

<template data-pop="i35-e-pp" data-title="Pression artérielle et pression pulsée">
<div class="lab">Technique</div><p>Mesure aux deux bras, en position assise après cinq minutes de repos. Pression pulsée = systolique − diastolique (normale environ 40 mmHg).</p>
<div class="lab">IA chronique sévère</div><p>Pression pulsée élargie (souvent &gt; 60 mmHg), pression diastolique basse. Dans l’IA sévère, les bruits de Korotkoff peuvent persister jusqu’à zéro : relever la diastolique à l’assourdissement (phase IV).</p>
<div class="lab">RA sévère</div><p>Pression pulsée parfois pincée. Mais une hypertension n’exclut pas un RA sévère ; elle ajoute sa postcharge à celle de la valve et peut abaisser le gradient mesuré, d’où une nouvelle mesure une fois la pression contrôlée (EACVI/ASE 2017).</p>
<div class="lab">Asymétrie</div><p>Différence &gt; 20 mmHg entre les bras : dissection, coarctation, sténose sous-clavière.</p>
<div class="lab">Piège</div><p>Une pression pulsée large chez le sujet âgé traduit souvent une rigidité artérielle, sans IA.</p></template>

<template data-pop="i35-e-pouls" data-title="Pouls parvus et tardus">
<div class="lab">Technique</div><p>Palper la carotide en même temps qu’on ausculte, ou comparer au choc de pointe : la montée carotidienne est lente et retardée, l’amplitude faible.</p>
<div class="lab">Valeur</div><p>Signe spécifique de RA sévère chez l’adulte jeune ou d’âge moyen.</p>
<div class="lab">Piège</div><p>Chez le sujet âgé, la rigidité artérielle accélère la montée du pouls et masque le retard : un pouls carotidien normal n’exclut pas un RA sévère.</p>
<div class="lab">IA</div><p>Pouls ample, bondissant, qui s’effondre (pouls de Corrigan) ; un pouls bisferiens (double pic systolique) évoque une maladie aortique mixte ou une IA sévère.</p></template>

<template data-pop="i35-e-choc" data-title="Choc de pointe">
<div class="lab">Technique</div><p>Patient en décubitus dorsal puis latéral gauche ; palper l’impulsion apicale du bout des doigts ; noter la position, l’étendue et la durée.</p>
<div class="lab">RA</div><p>Choc puissant, soutenu pendant toute la systole, peu ou pas dévié : hypertrophie concentrique. Parfois un choc présystolique palpable (contraction auriculaire, équivalent du B4).</p>
<div class="lab">IA</div><p>Choc étalé, hyperdynamique, dévié en bas et à gauche : dilatation.</p>
<div class="lab">Piège</div><p>Chez l’obèse ou le patient emphysémateux, le choc est souvent impalpable.</p></template>

<template data-pop="i35-e-souffle-ra" data-title="Souffle du rétrécissement aortique">
<div class="lab">Technique</div><p>Membrane du stéthoscope, deuxième espace intercostal droit (foyer aortique), puis trajet vers les carotides et l’apex ; patient assis penché en avant si le souffle est faible.</p>
<div class="lab">Caractères</div><p>Mésosystolique, éjectionnel, en losange (crescendo puis decrescendo), rude, séparé de B1 par un court intervalle, irradiant aux carotides. Intensité selon Levine de 1 à 6 ; frémissement palpable à partir de 4/6.</p>
<div class="lab">Signes de sévérité</div><p>Pic tardif du losange, durée longue, B2 aboli, pouls parvus et tardus.</p>
<div class="lab">Piège</div><p>L’intensité baisse avec le débit : souffle faible dans le RA à bas débit. Un souffle irradiant à l’apex peut être pris pour une insuffisance mitrale (phénomène de Gallavardin).</p></template>

<template data-pop="i35-e-b2" data-title="Deuxième bruit (B2) dans le rétrécissement aortique">
<div class="lab">Normal</div><p>B2 résulte de la fermeture de la valve aortique, puis de la valve pulmonaire ; le dédoublement s’accentue à l’inspiration.</p>
<div class="lab">RA sévère</div><p>Composante aortique diminuée ou abolie, car les cuspides calcifiées ne bougent plus. Le B2 devient unique et faible.</p>
<div class="lab">Dédoublement paradoxal</div><p>L’éjection prolongée retarde la composante aortique au-delà de la composante pulmonaire : le dédoublement apparaît à l’expiration. Il se voit aussi dans le bloc de branche gauche.</p>
<div class="lab">Valeur</div><p>Un B2 normalement perçu rend un RA sévère calcifié peu probable ; son abolition est un signe de sévérité.</p></template>

<template data-pop="i35-e-click" data-title="Clic protosystolique d’éjection">
<div class="lab">Description</div><p>Bruit bref et sec, juste après B1, audible à l’apex et à la base, ne variant pas avec la respiration.</p>
<div class="lab">Mécanisme</div><p>Mise en tension brutale d’une valve bicuspide encore souple à l’ouverture.</p>
<div class="lab">Valeur</div><p>Oriente vers une bicuspidie non calcifiée chez l’adulte jeune. Il disparaît lorsque la valve se calcifie.</p>
<div class="lab">Diagnostic différentiel</div><p>Dédoublement de B1 ; clic de l’aorte dilatée ; B4 (présystolique, grave, à l’apex, mieux entendu à la cloche).</p></template>

<template data-pop="i35-e-gallav" data-title="Phénomène de Gallavardin">
<div class="lab">Description</div><p>Dans le RA calcifié du sujet âgé, le souffle se dissocie : composante rude à la base, composante musicale, aiguë, à l’apex.</p>
<div class="lab">Mécanisme</div><p>Les vibrations de haute fréquence des cuspides calcifiées sont transmises vers l’apex par la masse ventriculaire.</p>
<div class="lab">Piège</div><p>Confondre la composante apicale avec une insuffisance mitrale. Indices : le souffle de Gallavardin reste éjectionnel (ne touche pas B1 ni B2) et varie comme le souffle aortique après une longue diastole (il se renforce), alors que celui de l’insuffisance mitrale ne change pas.</p></template>

<template data-pop="i35-e-b4" data-title="Quatrième bruit (B4)">
<div class="lab">Description</div><p>Bruit présystolique, grave, à l’apex, mieux entendu à la cloche en décubitus latéral gauche.</p>
<div class="lab">Mécanisme</div><p>La contraction auriculaire propulse le sang dans un ventricule rigide (hypertrophie).</p>
<div class="lab">Valeur</div><p>Dans le RA, il témoigne de la rigidité ventriculaire. Il disparaît en fibrillation auriculaire : sa présence implique un rythme sinusal.</p>
<div class="lab">Conséquence pratique</div><p>La contraction auriculaire contribue fortement au remplissage d’un ventricule rigide : la fibrillation auriculaire est mal tolérée dans le RA sévère.</p></template>

<template data-pop="i35-e-souffle-ia" data-title="Souffle de l’insuffisance aortique">
<div class="lab">Technique</div><p>Patient assis, penché en avant, en expiration forcée bloquée ; membrane appuyée au troisième ou quatrième espace intercostal gauche (foyer d’Erb), puis bord droit du sternum.</p>
<div class="lab">Caractères</div><p>Protodiastolique, commençant avec la composante aortique de B2, decrescendo, doux, aspiratif, de haute fréquence.</p>
<div class="lab">Localisation</div><p>Maximal au bord gauche : atteinte des cuspides. Maximal au bord droit : dilatation de la racine ou dissection.</p>
<div class="lab">Sévérité</div><p>Plus le souffle est long (holodiastolique), plus la fuite est importante, en IA chronique. Dans l’IA aiguë, il est bref, car les pressions aortique et ventriculaire s’égalisent vite.</p>
<div class="lab">Piège</div><p>Un souffle doux est facilement manqué si l’on n’utilise pas la position penchée en avant.</p></template>

<template data-pop="i35-e-austin" data-title="Roulement d’Austin Flint">
<div class="lab">Description</div><p>Roulement mésodiastolique ou présystolique grave à l’apex, chez un patient porteur d’une IA sévère sans atteinte mitrale.</p>
<div class="lab">Mécanisme</div><p>Le jet régurgitant frappe la grande valve mitrale et gêne son ouverture ; la pression ventriculaire gauche monte vite en diastole et ferme partiellement la valve mitrale.</p>
<div class="lab">Valeur</div><p>Signe d’IA sévère.</p>
<div class="lab">Diagnostic différentiel</div><p>Rétrécissement mitral : B1 éclatant et claquement d’ouverture, absents dans le roulement d’Austin Flint. L’échocardiographie tranche.</p></template>

<template data-pop="i35-e-periph" data-title="Signes périphériques de l’insuffisance aortique">
<table class="t"><tr><th>Signe</th><th>Description</th></tr>
<tr><td>Pouls de Corrigan</td><td>Pouls ample à montée brusque et chute rapide ; accentué en levant le bras du patient</td></tr>
<tr><td>Signe de de Musset</td><td>Hochement de tête synchrone du pouls</td></tr>
<tr><td>Signe de Müller</td><td>Pulsations systoliques de la luette</td></tr>
<tr><td>Pouls capillaire de Quincke</td><td>Pulsation de la coloration du lit unguéal sous une légère pression</td></tr>
<tr><td>Signe de Traube</td><td>Bruit « en coup de pistolet » systolique à l’auscultation de l’artère fémorale</td></tr>
<tr><td>Signe de Duroziez</td><td>Double souffle, systolique et diastolique, à la compression progressive de l’artère fémorale par le stéthoscope</td></tr>
<tr><td>Signe de Hill</td><td>Pression systolique poplitée nettement supérieure à la pression humérale</td></tr></table>
<div class="lab">Valeur</div><p>Ils reflètent une pression pulsée large et une IA chronique sévère ; ils sont absents dans l’IA aiguë. Leur sensibilité est faible et leur valeur quantitative limitée : l’échocardiographie mesure la sévérité.</p>
<div class="lab">Piège</div><p>Les états hyperkinétiques (fièvre, anémie, thyrotoxicose, fistule artérioveineuse) peuvent en produire certains.</p></template>

<template data-pop="i35-mnemo-ia" data-title="Signes périphériques de l’IA : de la tête aux pieds (aide pédagogique, non critère officiel)">
<p>Parcourir le corps de haut en bas :</p>
<ul><li><b>Tête</b> : de Musset (hochement).</li><li><b>Bouche</b> : Müller (luette).</li><li><b>Mains</b> : Quincke (ongles) ; Corrigan (pouls, bras levé).</li><li><b>Aine</b> : Traube (bruit de pistolet), Duroziez (double souffle).</li><li><b>Genou</b> : Hill (pression poplitée).</li></ul>
<p>Tous traduisent la même chose : une pression pulsée large. Aide pédagogique, non critère officiel.</p></template>

<template data-pop="i35-manoeuvres" data-title="Auscultation dynamique des souffles systoliques">
<table class="t"><tr><th>Manœuvre</th><th>Effet hémodynamique</th><th>RA</th><th>Cardiomyopathie hypertrophique obstructive</th><th>Insuffisance mitrale</th></tr>
<tr><td>Accroupissement</td><td>Précharge et postcharge ↑</td><td>↑</td><td>↓</td><td>↑</td></tr>
<tr><td>Valsalva (phase de poussée), passage debout</td><td>Précharge ↓</td><td>↓</td><td>↑</td><td>↓ ou =</td></tr>
<tr><td>Battement après une longue diastole (post-extrasystolique)</td><td>Remplissage et contractilité ↑</td><td>↑</td><td>↑</td><td>=</td></tr>
<tr><td>Serrement de poing soutenu</td><td>Postcharge ↑</td><td>= ou ↓</td><td>↓</td><td>↑</td></tr></table>
<div class="lab">Repère</div><p>Seul le souffle de la cardiomyopathie hypertrophique obstructive augmente quand le ventricule se vide (Valsalva, passage debout). Le renforcement après une longue diastole distingue un souffle éjectionnel d’un souffle de régurgitation mitrale.</p>
<div class="lab">Pourquoi chaque manœuvre agit</div><p>L’accroupissement augmente le retour veineux et les résistances artérielles : le ventricule se remplit, l’éjection à travers la valve augmente et le souffle du RA se renforce. La cavité élargie éloigne aussi la valve mitrale du septum et réduit l’obstruction de la cardiomyopathie hypertrophique. Le Valsalva et le passage debout font l’inverse : moins de débit à travers la valve aortique, mais un ventricule plus petit, donc plus d’obstruction dynamique. Le serrement de poing élève la postcharge : la fuite mitrale augmente, l’obstruction dynamique diminue.</p>
<div class="lab">Battement après une longue diastole</div><p>Le remplissage prolongé et la potentiation post-extrasystolique augmentent la contractilité, donc le débit et le gradient aortiques. Dans l’insuffisance mitrale, la pression aortique, plus basse après la pause, facilite l’éjection antérograde : le volume régurgité varie peu.</p>
<div class="lab">Limite</div><p>Aucune manœuvre isolée n’identifie le RA ; il se reconnaît par exclusion des autres causes, puis à l’échocardiographie.</p>
<div class="lab">Source complémentaire</div><p>Lembo et coll., <i>New England Journal of Medicine</i> 1988;318:1572–1578 (50 patients) : aucune manœuvre isolée n’identifie le souffle du RA, reconnu par exclusion ; le souffle de la cardiomyopathie hypertrophique augmente au Valsalva (sensibilité 65 %, spécificité 96 %).</p>
</template>
