
<!-- ===== FENÊTRES I35 : notions et physiopathologie ===== -->
<template data-pop="i35-bernoulli" data-title="Équation de Bernoulli simplifiée">
<div class="lab">Formule</div><p>Gradient de pression (mmHg) = 4 × V² (V en m/s). Elle convertit une vitesse mesurée au Doppler continu en différence de pression à travers l’orifice.</p>
<div class="lab">Exemple</div><p>Vmax 4 m/s : gradient maximal instantané 4 × 16 = 64 mmHg. Vmax 5 m/s : 100 mmHg. Doubler la vitesse multiplie le gradient par quatre.</p>
<div class="lab">Gradient maximal et gradient moyen</div><p>Le gradient maximal correspond au pic de vitesse ; le gradient moyen est la moyenne des gradients instantanés sur toute l’éjection. Les seuils de décision utilisent le gradient moyen (≥ 40 mmHg pour le RA sévère).</p>
<div class="lab">Limites</div><p>La forme simplifiée néglige la vitesse sous-valvulaire ; si celle-ci dépasse 1,5 m/s (hyperdébit, obstacle sous-valvulaire), utiliser 4 × (Vmax² − V CCVG²). Un mauvais alignement du faisceau Doppler sous-estime la vitesse, jamais ne la surestime.</p>
<div class="lab">Piège</div><p>Le gradient « pic à pic » du cathétérisme (différence entre pic ventriculaire et pic aortique, qui ne sont pas simultanés) est inférieur au gradient maximal instantané du Doppler : les deux ne se comparent pas.</p>
<div class="lab">Origine du facteur 4</div><p>L’équation de Bernoulli traduit la conservation de l’énergie : la pression perdue en amont de l’orifice devient énergie cinétique, égale à ½ ρ V². Avec une masse volumique du sang d’environ 1 060 kg/m³ et 1 mmHg égal à 133 Pa, ½ × 1 060 / 133 vaut environ 4. Le terme d’accélération et les pertes visqueuses, négligeables dans un orifice serré, sont omis.</p>
<div class="lab">Pourquoi l’angle ne surestime jamais</div><p>Le Doppler mesure la composante de la vitesse parallèle au faisceau, égale à V × cos θ. Le cosinus ne dépasse jamais 1 : tout écart d’angle abaisse la vitesse mesurée, et l’erreur est élevée au carré dans le gradient. Un angle de 20° sous-estime la vitesse d’environ 6 % et le gradient d’environ 12 %. D’où l’exploration par plusieurs fenêtres, dont la parasternale droite, et le choix de la vitesse la plus élevée.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/ehjci/jew335" target="_blank" rel="noopener">Baumgartner et coll., recommandations EACVI/ASE, <i>European Heart Journal – Cardiovascular Imaging</i> 2017;18:254–275</a> ; <a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>, figure 6.</p>
</template>

<template data-pop="i35-continuite" data-title="Équation de continuité">
<div class="lab">Principe</div><p>Le débit qui traverse la chambre de chasse du ventricule gauche (CCVG) traverse ensuite l’orifice aortique. Débit = surface × intégrale temps-vitesse (ITV).</p>
<div class="lab">Formule</div><p>SVA = [π × (diamètre CCVG / 2)²] × ITV CCVG / ITV transvalvulaire.</p>
<div class="lab">Exemple chiffré</div><p>Diamètre de la CCVG 2,0 cm : surface 3,14 cm². ITV CCVG 20 cm ; ITV valve 100 cm. Volume d’éjection = 3,14 × 20 ≈ 63 mL. SVA = 3,14 × 20 / 100 ≈ 0,63 cm² : RA sévère.</p>
<div class="lab">Source d’erreur principale</div><p>Le diamètre de la CCVG, élevé au carré. Mesure en mésosystole, en coupe parasternale grand axe zoomée, au ras de l’insertion des cuspides. En cas de doute, le rapport des vitesses (ITV CCVG / ITV valve, sévère si &lt; 0,25) s’affranchit du diamètre.</p></template>

<template data-pop="i35-calcif" data-title="Calcification valvulaire aortique : processus actif">
<div class="lab">Phase d’initiation</div><p>Lésion endothéliale du côté aortique, pénétration du cholestérol LDL et de la Lp(a), oxydation des lipides, inflammation (macrophages, lymphocytes T). Elle ressemble à l’athérosclérose.</p>
<div class="lab">Phase de propagation</div><p>Différenciation ostéogénique des cellules interstitielles valvulaires, microcalcifications qui fusionnent en nodules ; la rigidité accroît la contrainte mécanique, qui entretient la calcification. Le processus devient indépendant des lipides.</p>
<div class="lab">Facteurs de risque</div><p>Âge, sexe masculin, hypertension, tabac, cholestérol LDL, Lp(a) élevée, diabète, syndrome métabolique, insuffisance rénale chronique, bicuspidie.</p>
<div class="lab">Différence entre sexes</div><p>À sévérité égale, la femme a moins de calcium et plus de fibrose valvulaire (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>, section 17.1) : les seuils de score calcique sont plus bas chez elle.</p>
<div class="lab">Conséquence thérapeutique</div><p>Aucun traitement médical n’a modifié à ce jour l’histoire naturelle du RA (ESC/EACTS 2025). Les statines, efficaces sur l’athérosclérose, n’ont pas ralenti le RA établi : l’atorvastatine 80 mg ne modifiait pas la progression de la Vmax (SALTIRE, 2005), la simvastatine associée à l’ézétimibe ne réduisait pas les événements liés à la valve (SEAS, 2008), et la rosuvastatine 40 mg ne freinait pas la progression du gradient (ASTRONOMER, 2010).</p>
<div class="lab">Association ou causalité</div><p>Les études d’observation associent le cholestérol LDL et la Lp(a) au RA, sans prouver la causalité. Les études génétiques apportent cet argument : un variant du gène <i>LPA</i> qui élève la Lp(a) s’associe, par allèle, à une probabilité de calcification valvulaire environ deux fois plus élevée (rapport de cotes 2,05) et à une incidence de RA accrue (rapport de risques 1,68 par allèle dans une cohorte suédoise).</p>
<div class="lab">Pourquoi les statines échouent</div><p>Ces variants agissent dès la naissance, donc sur la phase d’initiation. Les essais de statines ont traité des RA déjà calcifiés, en phase de propagation, où les lipides ne pilotent plus le processus. Un traitement hypolipémiant précoce, avant la calcification, reste une hypothèse non testée.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/23388002/" target="_blank" rel="noopener">Thanassoulis et coll., <i>New England Journal of Medicine</i> 2013;368:503–512</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15944423/" target="_blank" rel="noopener">Cowell et coll. (SALTIRE)</a>, <a href="https://pubmed.ncbi.nlm.nih.gov/18765433/" target="_blank" rel="noopener">Rossebø et coll. (SEAS)</a>, <a href="https://pubmed.ncbi.nlm.nih.gov/20048204/" target="_blank" rel="noopener">Chan et coll. (ASTRONOMER)</a> ; ESC/EACTS 2025, section 8.3.</p>
</template>

<template data-pop="i35-lpa" data-title="Lipoprotéine(a) et rétrécissement aortique">
<div class="lab">Structure</div><p>Particule proche du LDL, à laquelle est liée l’apolipoprotéine(a). Son taux dépend surtout du gène <i>LPA</i> et varie peu au cours de la vie.</p>
<div class="lab">Lien avec la valve</div><p>La Lp(a) transporte des phospholipides oxydés et l’autotaxine, qui activent l’inflammation et la différenciation ostéogénique des cellules valvulaires. Un variant de <i>LPA</i> qui élève la Lp(a) double, par allèle, la probabilité de calcification valvulaire et augmente l’incidence du RA (Thanassoulis, 2013), ce qui plaide pour un rôle causal.</p>
<div class="lab">Mesure</div><p>Le résultat s’interprète selon la méthode et les valeurs du laboratoire ; aucune valeur seuil n’est retenue ici, faute de source primaire lue sur ce point.</p>
<div class="lab">Traitement</div><p>Aucune substance, y compris celles qui ciblent les voies de la calcification, n’a modifié l’évolution du RA (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>). L’effet sur la valve des molécules qui abaissent fortement la Lp(a) n’est pas établi.</p></template>

<template data-pop="i35-hvg" data-title="Hypertrophie concentrique du rétrécissement aortique">
<div class="lab">Mécanisme</div><p>La surcharge de pression augmente la contrainte pariétale systolique. Selon la loi de Laplace (contrainte = (pression × rayon) / (2 × épaisseur)), l’épaississement de la paroi normalise la contrainte.</p>
<div class="lab">Mesure</div><p>Épaisseur relative de paroi (2 × paroi postérieure / diamètre télédiastolique) augmentée avec une masse augmentée : hypertrophie concentrique, plus fréquente chez la femme (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>, section 17.1).</p>
<div class="lab">Conséquences délétères</div><p>Rigidité (dysfonction diastolique, dyspnée d’effort), ischémie sous-endocardique, fibrose d’abord diffuse et réversible, puis fibrose de remplacement irréversible, visible à l’IRM (rehaussement tardif au gadolinium).</p>
<div class="lab">Après remplacement valvulaire</div><p>La masse ventriculaire régresse en partie au cours de la première année ; la fibrose de remplacement ne régresse pas et pèse sur le pronostic. C’est l’hypothèse testée par l’essai EVOLVED, qui n’a pas montré de bénéfice d’une intervention précoce guidée par la fibrose, avec une puissance insuffisante (ESC/EACTS 2025).</p></template>

<template data-pop="i35-ischemie" data-title="Angor du rétrécissement aortique">
<div class="lab">Mécanisme</div><p>Besoins en oxygène augmentés (masse, pression systolique, durée d’éjection prolongée) ; apports réduits : réserve coronaire diminuée, compression du sous-endocarde par une pression télédiastolique élevée, diastole raccourcie à l’effort, raréfaction capillaire relative.</p>
<div class="lab">Conséquence</div><p>L’angor survient même avec des coronaires angiographiquement normales. Il n’établit donc pas la présence d’une maladie coronaire.</p>
<div class="lab">Maladie coronaire associée</div><p>Fréquente chez le sujet âgé, car les facteurs de risque sont communs. Elle est recherchée avant toute intervention (coroscanner ou coronarographie).</p>
<div class="lab">Piège</div><p>Les tests d’ischémie non invasifs sont peu fiables dans le RA sévère (sous-décalage du segment ST fréquent sans sténose coronaire) et l’effort maximal y est contre-indiqué chez le symptomatique.</p></template>

<template data-pop="i35-syncope" data-title="Syncope d’effort du rétrécissement aortique">
<div class="lab">Caractéristiques</div><p>Perte de connaissance brève pendant ou juste après un effort, parfois précédée de vertige ou de vision trouble ; récupération rapide. Une présyncope d’effort a la même valeur.</p>
<div class="lab">Mécanismes</div><p>(1) Débit fixe : la vasodilatation musculaire d’effort n’est pas compensée par une hausse du débit. (2) Réflexe inapproprié : l’étirement des mécanorécepteurs ventriculaires par des pressions très élevées provoque une vasodilatation et une bradycardie réflexes. (3) Arythmies : bloc auriculoventriculaire, tachycardie ventriculaire.</p>
<div class="lab">Valeur</div><p>C’est un symptôme de RA sévère qui impose l’intervention : comme tout symptôme, elle marque une nette augmentation du risque de mort subite sans intervention (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Diagnostic différentiel</div><p>Syncope réflexe, hypotension orthostatique sous traitement, bloc de conduction indépendant, cardiomyopathie hypertrophique obstructive. Une syncope de repos oriente vers une arythmie.</p></template>

<template data-pop="i35-lflg-class" data-title="Rétrécissement aortique à bas débit et bas gradient, FEVG réduite">
<div class="lab">Définition</div><p>SVA ≤ 1 cm², gradient moyen &lt; 40 mmHg, FEVG &lt; 50 %, VESi ≤ 35 mL/m² (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Question</div><p>Deux situations donnent cette image : un RA sévère qui a épuisé le ventricule (vrai RA sévère), ou une cardiomyopathie qui ouvre mal une valve modérément atteinte (pseudo-RA sévère).</p>
<div class="lab">Démarche</div><p>Échocardiographie à faible dose de dobutamine ; si la réserve contractile manque, score calcique en tomodensitométrie.</p>
<div class="lab">Conduite</div><p>Vrai RA sévère confirmé par score calcique ou échocardiographie de stress : intervention recommandée (classe I, niveau B). Pseudo-RA sévère : traitement de l’insuffisance cardiaque, surveillance de la valve.</p>
<div class="lab">Pronostic</div><p>L’absence de réserve de débit s’associe à une mortalité chirurgicale et à long terme plus élevée ; pourtant, dans les études observationnelles, la chirurgie comme le TAVI améliorent la FEVG et le devenir (ESC/EACTS 2025).</p></template>

<template data-pop="i35-lflg-parad" data-title="Rétrécissement aortique à bas débit paradoxal (FEVG préservée)">
<div class="lab">Définition</div><p>SVA ≤ 1 cm², gradient moyen &lt; 40 mmHg, FEVG ≥ 50 %, VESi ≤ 35 mL/m² (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Mécanismes du bas débit</div><p>Petit ventricule hypertrophié à faible volume télédiastolique ; fonction longitudinale altérée malgré une FEVG normale ; postcharge élevée (hypertension, rigidité artérielle) ; fibrillation auriculaire ; insuffisance mitrale ou tricuspide associée.</p>
<div class="lab">Terrain</div><p>Sujet âgé, souvent femme, hypertendu.</p>
<div class="lab">Diagnostic</div><p>Exclure les erreurs de mesure ; contrôler la pression artérielle ; score calcique en tomodensitométrie ; évaluation intégrée de l’ESC/EACTS 2025 (symptômes typiques sans autre explication, lésions valvulaires, hypertrophie sans hypertension, concordance de plusieurs méthodes dont la planimétrie en tomodensitométrie ou IRM, seuil 1,2 cm²).</p>
<div class="lab">Conduite</div><p>Intervention à envisager chez le symptomatique lorsque la sévérité est confirmée (classe IIa, niveau B, ESC/EACTS 2025), car l’intervention, chirurgicale ou percutanée, améliore le devenir par rapport au traitement médical seul.</p>
<div class="lab">Pourquoi surtout chez la femme âgée</div><p>À sévérité égale, la femme développe une hypertrophie plus concentrique, avec une cavité plus petite : sa FEVG est plus élevée, mais son volume d’éjection plus faible. Le gradient reste donc bas malgré un orifice serré, ce qui expose au sous-diagnostic et au retard d’intervention. Des seuils de bas débit propres au sexe (&lt; 40 mL/m² chez l’homme, &lt; 32 mL/m² chez la femme) ont été proposés, et le score calcique en tomodensitométrie doit être réalisé chez la femme dont les paramètres échocardiographiques sont discordants.</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025, section 17.1.</p>
</template>

<template data-pop="i35-mnemo-532" data-title="Pronostic du rétrécissement aortique symptomatique">
<div class="lab">Ce que disent les recommandations</div><p>Le RA sévère symptomatique non traité a un pronostic défavorable ; une intervention précoce est fortement recommandée chez tout patient dont l’espérance de vie estimée dépasse un an (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>). Dès l’apparition des symptômes, le risque de mort subite augmente nettement sans intervention.</p>
<div class="lab">Donnée d’essai</div><p>Dans la cohorte B de l’essai PARTNER (358 patients jugés inopérables, 2010), la mortalité à un an était de 50,7 % sous traitement standard, valvuloplastie par ballonnet comprise, contre 30,7 % après TAVI ; les patients survivants traités par TAVI étaient aussi moins souvent en classe NYHA III ou IV (25,2 % contre 58,0 %).</p>
<div class="lab">Portée</div><p>Ces chiffres concernent des patients âgés et comorbides. Le message est général : un symptôme attribuable à un RA sévère pose l’indication, et l’intervention ne doit pas être retardée par une amélioration passagère sous traitement médical.</p></template>

<template data-pop="i35-heyde" data-title="Syndrome de Heyde">
<div class="lab">Définition</div><p>Association d’un RA, de saignements digestifs sur angiodysplasies et d’un déficit acquis en facteur von Willebrand de type 2A.</p>
<div class="lab">Mécanisme</div><p>Le flux très rapide à travers la valve déplie les grands multimères du facteur von Willebrand, qui sont clivés par la protéase ADAMTS13. Or ces grands multimères sont indispensables à l’hémostase dans les capillaires à haut cisaillement des angiodysplasies.</p>
<div class="lab">Diagnostic</div><p>Anémie ferriprive, endoscopie (capsule si nécessaire), analyse des multimères du facteur von Willebrand, rapport activité/antigène abaissé.</p>
<div class="lab">Traitement</div><p>Le remplacement valvulaire (chirurgie ou TAVI) corrige le déficit et réduit nettement les récidives. Traitement endoscopique des lésions ; fer.</p>
<div class="lab">Piège</div><p>Traiter seulement l’anémie sans rechercher le RA, ou contre-indiquer l’intervention à cause des saignements alors qu’elle les traite.</p></template>

<template data-pop="i35-ia-chron" data-title="Insuffisance aortique chronique : hypertrophie excentrique">
<div class="lab">Adaptation</div><p>Le ventricule se dilate par ajout de sarcomères en série et devient plus compliant : il accueille un grand volume télédiastolique sans élévation de la pression de remplissage. Le volume d’éjection total augmente et maintient le débit utile.</p>
<div class="lab">Double surcharge</div><p>Surcharge de volume (volume régurgité) et de pression (pression systolique élevée, rayon augmenté) : la paroi s’épaissit aussi.</p>
<div class="lab">Décompensation</div><p>La fibrose interstitielle progresse, la contractilité baisse, le volume télésystolique augmente, puis la FEVG diminue et la pression de remplissage s’élève. Le diamètre et le volume télésystoliques sont les meilleurs marqueurs précoces.</p>
<div class="lab">Conséquence pratique</div><p>Opérer sur des seuils de dimension et de FEVG avant les symptômes, car la dysfonction installée ne régresse pas toujours après la chirurgie.</p></template>

<template data-pop="i35-ia-aigue" data-title="Insuffisance aortique aiguë">
<div class="lab">Causes</div><p>Endocardite infectieuse, dissection aortique de type A, traumatisme thoracique, complication d’une intervention, dysfonction aiguë de prothèse.</p>
<div class="lab">Hémodynamique</div><p>Ventricule de taille normale, peu compliant : la pression télédiastolique monte brutalement, la valve mitrale se ferme prématurément, la pression capillaire pulmonaire s’élève ; le débit utile chute.</p>
<div class="lab">Clinique</div><p>Œdème pulmonaire, tachycardie, hypotension, choc. Souffle diastolique bref et doux, pression pulsée normale, pas de signes périphériques : la gravité est sous-estimée.</p>
<div class="lab">Échocardiographie</div><p>Fuite importante, temps de demi-décroissance de pression très court, fermeture mitrale prématurée, reflux holodiastolique ; recherche de végétation ou de flap de dissection ; échocardiographie transœsophagienne.</p>
<div class="lab">Traitement</div><p>Chirurgie en urgence. En attendant : nitroprussiate de sodium, dobutamine, surveillance invasive. Contre-indiqués : ballon de contrepulsion intra-aortique ; bêtabloquants, sauf prudemment dans la dissection.</p></template>


<template data-pop="i35-grades" data-title="Grades de sévérité du rétrécissement aortique">
<table class="t"><tr><th>Grade</th><th>Vmax</th><th>Gradient moyen</th><th>SVA</th></tr>
<tr><td>Sclérose</td><td>≤ 2,5 m/s</td><td>—</td><td>—</td></tr>
<tr><td>Léger</td><td>2,6–2,9 m/s</td><td>&lt; 20 mmHg</td><td>&gt; 1,5 cm²</td></tr>
<tr><td>Modéré</td><td>3,0–3,9 m/s</td><td>20–39 mmHg</td><td>1,0–1,5 cm²</td></tr>
<tr><td>Sévère</td><td>≥ 4,0 m/s</td><td>≥ 40 mmHg</td><td>≤ 1,0 cm² (indexée ≤ 0,6 cm²/m²)</td></tr></table>
<div class="lab">Règle</div><p>Si les trois critères concordent, la sévérité est établie. S’ils divergent, rechercher d’abord une erreur de mesure, puis évaluer le débit (VESi). Sources : <a href="https://doi.org/10.1093/ehjci/jew335" target="_blank" rel="noopener">EACVI/ASE 2017</a> pour les grades ; <a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> pour la définition du RA sévère à haut gradient.</p></template>

<template data-pop="i35-iaquant" data-title="Quantification de l’insuffisance aortique">
<div class="lab">Critères d’IA sévère</div><p>Vena contracta &gt; 6 mm ; largeur du jet ≥ 65 % de la CCVG ; temps de demi-décroissance de pression &lt; 200 ms ; reflux holodiastolique dans l’aorte descendante (vitesse télédiastolique &gt; 20 cm/s) ou abdominale ; surface de l’orifice régurgitant effective ≥ 30 mm² ; volume régurgité ≥ 60 mL ; fraction régurgitée ≥ 50 %.</p>
<div class="lab">Retentissement</div><p>Dilatation ventriculaire gauche ; diamètre et volume télésystoliques ; FEVG.</p>
<div class="lab">Règle</div><p>Conclure sur un faisceau concordant (EACVI). En cas de discordance, l’IRM mesure le volume et la fraction régurgités par contraste de phase.</p>
<div class="lab">Piège</div><p>Le temps de demi-décroissance de pression raccourcit aussi quand la pression télédiastolique est élevée (IA aiguë, dysfonction diastolique) et s’allonge sous vasodilatateur : il dépend des conditions de charge.</p></template>

<template data-pop="i35-sievers" data-title="Nomenclature de la valve bicuspide">
<div class="lab">Trois types de valve (<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a>, d’après la nomenclature internationale)</div><p>Bicuspidie fusionnée (90 à 95 % des cas), bicuspidie à deux sinus (5 à 7 %) et bicuspidie à fusion partielle, forme fruste avec une courte fusion d’une commissure.</p>
<div class="lab">Fusion des cuspides</div><p>Dans la forme fusionnée, la fusion concerne les cuspides coronaires droite et gauche dans 70 à 80 % des cas, droite et non coronaire dans 20 à 30 %, gauche et non coronaire dans 3 à 6 %.</p>
<div class="lab">Phénotypes aortiques</div><p>Ascendant (70 à 75 %), racine (15 à 20 %) ou étendu à la crosse (5 à 10 %). Chaque type de valve peut s’associer à chacun de ces phénotypes.</p>
<div class="lab">Intérêt</div><p>La morphologie guide la réparation et la discussion d’un TAVI : l’anneau elliptique, les calcifications asymétriques et un raphé calcifié exposent à la fuite paravalvulaire après TAVI.</p></template>

<template data-pop="i35-aortopathie" data-title="Aortopathie de la bicuspidie">
<div class="lab">Fréquence</div><p>Fréquente : l’IA chronique sévère pure s’associe à une bicuspidie et à une dilatation de l’aorte dans plus de la moitié des cas (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Mécanismes</div><p>Fragilité génétique de la média (dégénérescence des lames élastiques) et flux systolique excentrique qui frappe la paroi convexe de l’aorte ascendante.</p>
<div class="lab">Phénotypes</div><p>Ascendant ou tubulaire (70 à 75 %, souvent avec RA) ; racine (15 à 20 %, sinus de Valsalva, souvent avec IA chez l’homme jeune, seuil opératoire plus bas) (<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a>).</p>
<div class="lab">Facteurs qui abaissent le seuil opératoire</div><p>Phénotype racine ; dans le phénotype ascendant à faible risque opératoire : âge &lt; 50 ans, croissance ≥ 3 mm par an, histoire familiale de syndrome aortique aigu, coarctation, hypertension résistante (ESC 2024).</p>
<div class="lab">Suivi</div><p>Au diagnostic, échocardiographie de l’aorte à plusieurs niveaux, puis tomodensitométrie ou IRM de toute l’aorte thoracique ; surveillance par échocardiographie si le diamètre maximal dépasse 40 mm, à un an puis tous les deux à trois ans si stable, y compris après un remplacement valvulaire isolé, car la dilatation peut continuer (ESC 2024).</p></template>

<template data-pop="i35-marfan" data-title="Syndrome de Marfan et aortopathies héréditaires">
<div class="lab">Syndrome de Marfan</div><p>Maladie autosomique dominante du gène <i>FBN1</i>. Le diagnostic repose sur la nosologie de Gand révisée, qui associe signes cliniques et génétique (<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a>). Signes : grande taille, arachnodactylie, déformations thoraciques, ectopie du cristallin.</p>
<div class="lab">Aorte</div><p>Dilatation de la racine, IA secondaire. Chirurgie recommandée à 50 mm, à envisager dès 45 mm avec facteurs de risque ; remplacement de la racine avec conservation valvulaire si l’anatomie le permet. Bêtabloquant ou ARA II à dose maximale tolérée (classe I), association des deux à envisager (IIa) (ESC 2024).</p>
<div class="lab">Syndrome de Loeys-Dietz</div><p>Gènes de la voie du TGF-β ; tortuosité artérielle, luette bifide, hypertélorisme ; dissections à de petits diamètres ; seuils selon le gène.</p>
<div class="lab">Syndrome d’Ehlers-Danlos vasculaire</div><p>Gène <i>COL3A1</i> ; ruptures artérielles et digestives ; fragilité tissulaire majeure.</p>
<div class="lab">Toujours</div><p>Conseil génétique, dépistage des apparentés, conseil préconceptionnel.</p></template>

<template data-pop="i35-rhumat" data-title="Rhumatisme articulaire aigu et valve aortique">
<div class="lab">Mécanisme</div><p>Après une pharyngite à streptocoque du groupe A, des anticorps dirigés contre la protéine M reconnaissent par mimétisme moléculaire des protéines valvulaires. L’inflammation répétée fibrose et rétracte les valves.</p>
<div class="lab">Diagnostic de la poussée</div><p>Il est traité au chapitre I00 — Rhumatisme articulaire aigu.</p>
<div class="lab">Lésions aortiques</div><p>Fusion commissurale, rétraction des bords libres : sténose, fuite ou association. Dans les pays à revenu faible ou intermédiaire, le RA rhumatismal s’associe habituellement à une atteinte mitrale (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">En Suisse</div><p>À évoquer surtout chez les personnes ayant grandi dans une région où la cardiopathie rhumatismale reste fréquente.</p>
<div class="lab">Prévention secondaire</div><p>Benzathine-benzylpénicilline 1,2 million d’unités toutes les 3 à 4 semaines pendant 10 ans, surtout chez l’enfant et l’adolescent, prolongée à l’âge adulte selon la sévérité de la valvulopathie et l’exposition au streptocoque (ESC/EACTS 2025). L’information professionnelle suisse d’Extencilline® précise : au moins 10 ans ou jusqu’à 40 ans en cas d’atteinte cardiaque persistante, parfois à vie.</p></template>

<template data-pop="i35-seuils-aorte" data-title="Seuils de chirurgie de l’aorte ascendante (ESC 2024)">
<table class="t"><tr><th>Situation</th><th>Seuil</th></tr>
<tr><td>Valve tricuspide</td><td>≥ 55 mm (I) ; aorte tubulaire &gt; 52 mm si risque faible (IIa)</td></tr>
<tr><td>Bicuspidie</td><td>≥ 55 mm ; ≥ 50 mm dans le phénotype racine (I) ; ≥ 50 mm avec facteurs de risque (IIa)</td></tr>
<tr><td>Chirurgie valvulaire aortique concomitante</td><td>≥ 45 mm si risque faible ; ≥ 50 mm sinon</td></tr>
<tr><td>Syndrome de Marfan</td><td>≥ 50 mm ; ≥ 45 mm avec facteurs de risque</td></tr></table>
<div class="lab">Repère « 55-50-45 » (aide pédagogique, non critère officiel)</div><p>55 mm : aorte isolée ; 50 mm : terrain fragile (Marfan, phénotype racine) ; 45 mm : si l’on opère déjà la valve.</p>
<div class="lab">Facteurs qui abaissent le seuil</div><p>Histoire familiale de dissection, croissance rapide confirmée, coarctation, hypertension non contrôlée, projet de grossesse, petite taille (valeurs indexées).</p>
<div class="lab">Pourquoi le diamètre guide la décision</div><p>Selon la loi de Laplace, la tension de la paroi aortique croît avec le rayon et la pression. Le risque de complication suit donc le diamètre : dans une cohorte prospective d’anévrismes thoraciques non opérés, au-delà de 60 mm, rupture ou dissection survenaient chez 6,9 % des patients par an. Le seuil opératoire se place là où ce risque dépasse celui de la chirurgie programmée.</p>
<div class="lab">Limite</div><p>Dans le registre international des dissections aortiques aiguës, 59 % des dissections de type A survenaient sous 55 mm. Le diamètre seul sélectionne donc mal ; les facteurs qui abaissent le seuil repèrent les parois qui cèdent plus tôt, et une hypertension non contrôlée ajoute de la tension à diamètre égal.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/11834007/" target="_blank" rel="noopener">Davies et al., <i>Annals of Thoracic Surgery</i> 2002;73:17–28</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17709637/" target="_blank" rel="noopener">Pape et al., <i>Circulation</i> 2007;116:1120–1127</a>.</p>
</template>
