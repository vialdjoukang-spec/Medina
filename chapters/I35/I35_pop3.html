
<!-- ===== FENÊTRES I35 : diagnostic et traitement ===== -->
<template data-pop="i35-discord" data-title="Discordance entre surface et gradient">
<div class="lab">Étape 1 — Erreur de mesure ?</div><p>Diamètre de la CCVG sous-estimé ; Vmax sous-estimée (fenêtres insuffisantes, mauvais alignement) ; SVA indexée chez l’obèse ; hypertension non contrôlée pendant l’examen. Contrôler le rapport des vitesses.</p>
<div class="lab">Étape 2 — Débit</div><p>VESi ≤ 35 mL/m² : bas débit. FEVG &lt; 50 % ou ≥ 50 %.</p>
<div class="lab">Étape 3 — Examen de confirmation</div><p>FEVG réduite : dobutamine, puis score calcique si pas de réserve. FEVG préservée : score calcique. Débit normal : le plus souvent RA modéré ; score calcique en cas de doute.</p>
<div class="lab">Étape 4 — Décision</div><p>Intégrer symptômes, score calcique, gradient sous dobutamine, peptides natriurétiques ; discussion en Heart Team.</p></template>

<template data-pop="i35-dse" data-title="Échocardiographie de stress à faible dose de dobutamine">
<div class="lab">Indication</div><p>RA à bas débit et bas gradient avec FEVG réduite.</p>
<div class="lab">Protocole</div><p>Paliers de 5 µg/kg/min toutes les 3 à 5 minutes, jusqu’à 20 µg/kg/min, sous monitorage ; mesures à chaque palier (VESi, Vmax, gradient moyen, SVA).</p>
<div class="lab">Interprétation</div><p>Réserve contractile si le volume d’éjection augmente d’au moins 20 %. Vrai RA sévère : gradient moyen ≥ 40 mmHg avec SVA ≤ 1,0 cm². Pseudo-RA sévère : SVA &gt; 1,0 cm² au débit normalisé. Surface projetée à 250 mL/s &lt; 1,0 cm² : RA sévère.</p>
<div class="lab">Arrêt</div><p>Résultat positif, fréquence cardiaque augmentée de plus de 10 à 20 battements par minute, arythmie, hypotension, symptômes.</p>
<div class="lab">Limite</div><p>Peu utile dans la forme paradoxale ; sans réserve contractile, le résultat est indéterminé et le score calcique devient l’examen décisif.</p></template>

<template data-pop="i35-cac" data-title="Score calcique valvulaire aortique">
<div class="lab">Technique</div><p>Tomodensitométrie sans injection, synchronisée à l’ECG ; quantification en unités Agatston des calcifications des cuspides.</p>
<div class="lab">Seuils (ESC/EACTS 2021)</div><p>RA sévère très probable : homme ≥ 3 000, femme ≥ 1 600. Probable : homme ≥ 2 000, femme ≥ 1 200. Peu probable : homme &lt; 1 600, femme &lt; 800.</p>
<div class="lab">Force</div><p>Indépendant du débit et des conditions de charge : il tranche les discordances.</p>
<div class="lab">Limites</div><p>Non applicable au RA rhumatismal ou fibreux du sujet jeune, ni aux bioprothèses. Les calcifications de l’anneau et de la paroi aortique doivent être exclues de la mesure.</p></template>

<template data-pop="i35-effort" data-title="Épreuve d’effort dans le rétrécissement aortique">
<div class="lab">Indication</div><p>RA sévère chez un patient qui se dit asymptomatique, pour démasquer des symptômes et stratifier le risque.</p>
<div class="lab">Contre-indication</div><p>RA sévère symptomatique : risque de syncope et de mort subite.</p>
<div class="lab">Critères anormaux</div><p>Dyspnée, angor, malaise ou présyncope à un effort bas ; chute soutenue de la pression systolique de plus de 20 mmHg par rapport au repos (ESC 2021) ; une élévation inférieure à 20 mmHg est une réponse moins spécifique ; arythmie ventriculaire complexe.</p>
<div class="lab">Conséquence</div><p>Symptômes à l’effort : intervention recommandée (classe I). Baisse tensionnelle : intervention à envisager (classe IIa).</p>
<div class="lab">Conditions</div><p>Épreuve limitée par les symptômes, sous surveillance médicale, dans un centre habitué.</p></template>

<template data-pop="i35-coro" data-title="Évaluation coronaire avant intervention valvulaire">
<div class="lab">Pourquoi</div><p>La maladie coronaire est fréquente chez le patient âgé porteur d’un RA ; elle modifie la stratégie (pontages associés à une chirurgie, angioplastie avant ou après TAVI).</p>
<div class="lab">Comment</div><p>Coroscanner si la probabilité est faible à intermédiaire (place renforcée par l’ESC/EACTS 2025) ; coronarographie si elle est élevée ou si le scanner n’est pas interprétable. Chez le candidat au TAVI, le scanner de planification évalue aussi les coronaires.</p>
<div class="lab">Conduite</div><p>Chirurgie valvulaire : pontages des sténoses significatives. TAVI : l’angioplastie des sténoses proximales significatives est à envisager ; l’essai NOTION-3 (2024) a montré un bénéfice de l’angioplastie des lésions fonctionnellement significatives chez ces patients.</p></template>

<template data-pop="i35-pressrec" data-title="Récupération de pression">
<div class="lab">Phénomène</div><p>Après l’orifice rétréci, une partie de l’énergie cinétique du jet se retransforme en pression dans l’aorte ascendante. La pression aortique en aval est alors plus élevée que la pression mesurée au niveau de l’orifice.</p>
<div class="lab">Conséquence</div><p>Le Doppler mesure la chute de pression au point le plus étroit ; il surestime la perte de pression réelle subie par le ventricule.</p>
<div class="lab">Quand y penser</div><p>Aorte ascendante &lt; 30 mm, RA modéré ; discordance entre Doppler et cathétérisme ; petites bioprothèses.</p></template>

<template data-pop="i35-gorlin" data-title="Formule de Gorlin">
<div class="lab">Formule</div><p>SVA (cm²) = débit cardiaque (mL/min) / [fréquence cardiaque × durée d’éjection systolique (s) × 44,3 × √gradient moyen (mmHg)].</p>
<div class="lab">Simplification de Hakki</div><p>SVA ≈ débit cardiaque (L/min) / √gradient pic à pic (mmHg).</p>
<div class="lab">Limites</div><p>Imprécise à bas débit ; dépend de la qualité de la mesure du débit ; le franchissement rétrograde de la valve expose à l’embolie cérébrale.</p>
<div class="lab">Place</div><p>Réservée aux discordances persistantes après les examens non invasifs.</p></template>

<template data-pop="i35-dissection" data-title="Dissection aortique de type A">
<div class="lab">Définition</div><p>Déchirure intimale avec création d’un faux chenal dans la média ; type A (classification de Stanford) si l’aorte ascendante est atteinte.</p>
<div class="lab">Présentation</div><p>Douleur brutale déchirante ; IA aiguë ; asymétrie des pouls ou de la pression ; déficit neurologique ; tamponnade ; ischémie coronaire (souvent coronaire droite), mésentérique ou d’un membre.</p>
<div class="lab">Diagnostic</div><p>Tomodensitométrie aortique en urgence ; échocardiographie transthoracique au lit (flap, IA, épanchement) ; échocardiographie transœsophagienne si le patient est instable. Des D-dimères bas rendent le diagnostic improbable chez un patient à faible probabilité clinique.</p>
<div class="lab">Traitement</div><p>Chirurgie en urgence. En attendant : antalgie, bêtabloquant intraveineux pour une fréquence d’environ 60/min et une pression systolique d’environ 100 à 120 mmHg si la perfusion le permet ; pas d’anticoagulant ni d’antiagrégant.</p>
<div class="lab">Piège</div><p>Un tableau de syndrome coronarien aigu inférieur peut révéler une dissection qui atteint l’ostium coronaire droit : la fibrinolyse ou la double antiagrégation seraient catastrophiques.</p></template>

<template data-pop="i35-bav-ballon" data-title="Valvuloplastie aortique par ballonnet">
<div class="lab">Principe</div><p>Dilatation percutanée de la valve par un ballonnet, qui fissure les calcifications et étire les commissures.</p>
<div class="lab">Résultat</div><p>Gain de surface modeste, resténose en quelques mois dans le RA calcifié ; pas d’effet démontré sur la survie.</p>
<div class="lab">Indications</div><p>Pont vers un TAVI ou une chirurgie chez un patient instable ; chirurgie non cardiaque urgente ; test lorsque la contribution du RA aux symptômes est incertaine (classe IIb, ESC/EACTS 2021). Grossesse avec RA sévère symptomatique réfractaire, dans un centre expérimenté.</p>
<div class="lab">Complications</div><p>IA aiguë, AVC, complications vasculaires, bloc de conduction.</p></template>

<template data-pop="i35-heartteam" data-title="Heart Team et centre valvulaire">
<div class="lab">Composition</div><p>Cardiologue clinicien, spécialiste de l’imagerie cardiaque, cardiologue interventionnel, chirurgien cardiaque, anesthésiste ; au besoin gériatre, néphrologue, spécialiste des soins palliatifs.</p>
<div class="lab">Critères pris en compte</div><p>Âge et espérance de vie ; risque opératoire (scores STS et EuroSCORE II) ; fragilité et autonomie ; anatomie (valve bicuspide, taille de l’anneau, hauteur des coronaires, accès fémoral, calcifications) ; lésions associées (coronaires, mitrale, aorte) ; durabilité et gestion sur toute la vie ; préférences du patient, informé des options.</p>
<div class="lab">Centre valvulaire</div><p>L’ESC/EACTS 2025 insiste sur des réseaux structurés de centres valvulaires disposant de toutes les techniques, d’un volume d’activité suffisant et d’une évaluation de leurs résultats.</p>
<div class="lab">Limites des scores</div><p>Les scores sous-estiment la fragilité, la cirrhose, l’aorte porcelaine et les séquelles de radiothérapie : la décision reste clinique.</p></template>

<template data-pop="i35-early" data-title="Intervention précoce dans le RA sévère asymptomatique : les essais">
<div class="lab">RECOVERY (2020)</div><p>145 patients coréens, RA très sévère (Vmax ≥ 4,5 m/s ou gradient moyen ≥ 50 mmHg, SVA ≤ 0,75 cm²), âge moyen 64 ans. Chirurgie précoce contre surveillance : mortalité opératoire ou décès cardiovasculaire à quatre ans 1 % contre 15 %.</p>
<div class="lab">AVATAR (2022)</div><p>157 patients européens, RA sévère asymptomatique avec épreuve d’effort normale et FEVG ≥ 50 %. Chirurgie précoce : critère composite (décès, infarctus, AVC, hospitalisation pour insuffisance cardiaque) 15,2 % contre 34,7 %.</p>
<div class="lab">EARLY TAVR (2024)</div><p>901 patients, âge moyen 76 ans, risque surtout faible. TAVI précoce contre surveillance clinique : décès, AVC ou hospitalisation cardiovasculaire non programmée à 3,8 ans (médiane) 26,8 % contre 45,3 %, différence portée surtout par les hospitalisations ; mortalité non différente (8,4 % contre 9,2 %). 87 % des patients surveillés ont reçu un remplacement pendant le suivi.</p>
<div class="lab">EVOLVED (2024)</div><p>224 patients avec fibrose myocardique à l’IRM. Intervention précoce : décès ou hospitalisation non programmée liée au RA 18 % contre 23 %, différence non significative.</p>
<div class="lab">Lecture</div><p>Réduction des événements composites et des hospitalisations ; pas de réduction démontrée de la mortalité ; essais de taille modeste ou à critères composites ; forte proportion de patients surveillés opérés rapidement. D’où une classe IIa (niveau A) dans l’ESC/EACTS 2025, qui laisse la surveillance active rapprochée comme alternative valable.</p></template>

<template data-pop="i35-mnemo-ia-seuils" data-title="Repère « 50-50-25 » de l’insuffisance aortique (aide pédagogique, non critère officiel)">
<p>Chez l’asymptomatique porteur d’une IA sévère, la chirurgie est recommandée (classe I) si :</p>
<ul><li>FEVG ≤ <b>50</b> % ;</li><li>DTSVG &gt; <b>50</b> mm ;</li><li>DTSVG indexé &gt; <b>25</b> mm/m².</li></ul>
<p>Les seuils plus précoces (FEVG ≤ 55 %, DTSVG indexé &gt; 22 mm/m², volume télésystolique indexé &gt; 45 mL/m²) relèvent d’une classe IIb chez le patient à faible risque (ESC/EACTS 2025). Aide pédagogique, non critère officiel.</p></template>

<template data-pop="i35-reparation" data-title="Chirurgie conservatrice de la valve aortique">
<div class="lab">Principe</div><p>Conserver les cuspides natives lorsqu’elles sont saines ou réparables, et traiter la cause de la fuite (racine dilatée, prolapsus).</p>
<div class="lab">Techniques</div><p>Réimplantation (technique de David) : remplacement de la racine par un tube dans lequel la valve native est réimplantée ; remodelage (technique de Yacoub) ; réparation des cuspides (plicature, résection du raphé) ; annuloplastie.</p>
<div class="lab">Indications</div><p>Remplacement de racine avec conservation valvulaire chez le patient jeune à racine dilatée : recommandé dans un centre expérimenté si un résultat durable est attendu (classe I). Réparation des cuspides dans l’IA sévère : à envisager chez des patients sélectionnés (IIa, niveau B, ESC/EACTS 2025).</p>
<div class="lab">Avantages et limites</div><p>Pas d’anticoagulation à vie, moins de complications liées à la prothèse ; risque de réintervention pour récidive de fuite, variable selon l’expérience du centre.</p></template>

<template data-pop="i35-rva" data-title="Remplacement valvulaire aortique chirurgical">
<div class="lab">Technique</div><p>Sternotomie complète ou partielle, ou minithoracotomie ; circulation extracorporelle ; excision de la valve et décalcification de l’anneau ; implantation d’une prothèse mécanique ou biologique.</p>
<div class="lab">Avantages</div><p>Excision complète de la valve ; traitement simultané des coronaires, de la mitrale, de l’aorte ; possibilité d’élargir l’anneau ; données de durabilité anciennes.</p>
<div class="lab">Complications</div><p>Saignement, fibrillation auriculaire postopératoire (fréquente), AVC, bloc auriculoventriculaire, infection sternale, insuffisance rénale ; convalescence plus longue que le TAVI.</p>
<div class="lab">Indication préférentielle</div><p>Patient de moins de 70 ans à faible risque, bicuspidie, lésions associées à opérer, anatomie défavorable au TAVI.</p></template>

<template data-pop="i35-tavi" data-title="TAVI : principe, accès, complications">
<div class="lab">Principe</div><p>Bioprothèse (péricarde bovin ou porcin) montée sur une armature métallique, compressée sur un cathéter, puis déployée dans la valve native qui est repoussée contre la paroi. Deux familles : valves expansibles par ballonnet, valves auto-expansibles (souvent en position supra-annulaire, avantageuses dans les petits anneaux).</p>
<div class="lab">Accès</div><p>Transfémoral dans la grande majorité des cas, sous anesthésie locale et sédation. Alternatives si les artères iliofémorales sont inutilisables : sous-clavière ou axillaire, carotidienne, transcave ; la voie transapicale est devenue rare.</p>
<div class="lab">Complications</div><p>Troubles de conduction et stimulateur, complications vasculaires, AVC, fuite paravalvulaire, obstruction coronaire, rupture de l’anneau, thrombose des cuspides.</p>
<div class="lab">Après TAVI</div><p>Mobilisation précoce, sortie en quelques jours ; surveillance du rythme ; échocardiographie de référence ; aspirine seule ou anticoagulant seul selon l’indication.</p></template>

<template data-pop="i35-viv" data-title="Valve-in-valve et gestion sur toute la vie">
<div class="lab">Valve-in-valve</div><p>TAVI implanté dans une bioprothèse chirurgicale dégénérée. Évite une réintervention chirurgicale ; risque de gradient résiduel élevé dans les petites prothèses (diamètre interne réduit), parfois traité par fracture de l’anneau de la prothèse au ballonnet.</p>
<div class="lab">TAVI-en-TAVI</div><p>Second TAVI dans un premier. Le premier TAVI repousse les cuspides natives ; le second repousse celles du premier, qui peuvent former un cylindre fermant les sinus devant les ostia coronaires (séquestration des sinus).</p>
<div class="lab">Conséquence</div><p>Chez le patient jeune, la Heart Team planifie la seconde intervention dès la première : taille et type de prothèse, accès coronaire futur.</p></template>

<template data-pop="i35-prothese" data-title="Prothèse mécanique ou biologique">
<table class="t"><tr><th>Critère</th><th>Prothèse mécanique</th><th>Bioprothèse</th></tr>
<tr><td>Âge (position aortique, ESC/EACTS 2021)</td><td>À envisager avant 60 ans</td><td>À envisager après 65 ans</td></tr>
<tr><td>Durabilité</td><td>Très longue</td><td>Dégénérescence structurelle, plus rapide chez le jeune</td></tr>
<tr><td>Anticoagulation</td><td>Antivitamine K à vie</td><td>Trois mois (aspirine ou antivitamine K), puis aspirine au long cours à envisager (IIb, 2025), ou anticoagulant si fibrillation auriculaire</td></tr>
<tr><td>Situations en faveur</td><td>Souhait du patient informé ; risque de dégénérescence accélérée ; anticoagulation déjà nécessaire pour une autre prothèse mécanique</td><td>Souhait du patient ; contre-indication ou mauvaise qualité de l’anticoagulation ; espérance de vie inférieure à la durabilité ; projet de grossesse</td></tr></table>
<div class="lab">Entre 60 et 65 ans</div><p>Décision partagée : risque hémorragique et contraintes de l’antivitamine K contre risque de réintervention (souvent par valve-in-valve).</p></template>

<template data-pop="i35-ross" data-title="Opération de Ross">
<div class="lab">Principe</div><p>La valve pulmonaire du patient (autogreffe) remplace la valve aortique ; une homogreffe remplace la valve pulmonaire.</p>
<div class="lab">Avantages</div><p>Tissu vivant, excellente hémodynamique, pas d’anticoagulation, faible risque thromboembolique ; survie proche de celle de la population générale dans les séries de centres experts.</p>
<div class="lab">Limites</div><p>Intervention complexe ; deux valves exposées à la dégénérescence ; dilatation possible de l’autogreffe ; expertise indispensable.</p>
<div class="lab">Place</div><p>Adultes jeunes sélectionnés, dans des centres expérimentés ; première mention dans les recommandations ESC/EACTS en 2025. Éviter en cas de maladie héréditaire du tissu conjonctif.</p></template>

<template data-pop="i35-ppm" data-title="Désaccord patient-prothèse">
<div class="lab">Définition</div><p>Surface effective de la prothèse, rapportée à la surface corporelle, trop petite pour le débit du patient.</p>
<div class="lab">Seuils (VARC-3)</div><p>Modéré : ≤ 0,85 cm²/m² ; sévère : ≤ 0,65 cm²/m². Si l’indice de masse corporelle est ≥ 30 kg/m² : ≤ 0,70 et ≤ 0,55 cm²/m².</p>
<div class="lab">Conséquences</div><p>Gradient résiduel, moindre régression de l’hypertrophie, symptômes persistants, mortalité accrue dans le désaccord sévère, dégénérescence plus rapide.</p>
<div class="lab">Prévention</div><p>Calcul de la surface attendue avant l’intervention ; élargissement de l’anneau ; prothèse supra-annulaire.</p></template>

<template data-pop="i35-inr" data-title="INR cible des prothèses mécaniques (ESC/EACTS 2021)">
<table class="t"><tr><th>Thrombogénicité de la prothèse</th><th>Sans facteur de risque</th><th>Avec ≥ 1 facteur de risque</th></tr>
<tr><td>Faible (la plupart des valves à double ailette actuelles)</td><td>2,5</td><td>3,0</td></tr>
<tr><td>Intermédiaire (autres doubles ailettes, données insuffisantes)</td><td>3,0</td><td>3,5</td></tr>
<tr><td>Élevée (valves à disque basculant anciennes, valves à bille)</td><td>3,5</td><td>4,0</td></tr></table>
<div class="lab">Facteurs de risque</div><p>Remplacement valvulaire mitral ou tricuspide ; antécédent thromboembolique ; fibrillation auriculaire ; rétrécissement mitral de tout degré ; FEVG &lt; 35 % (ESC/EACTS 2021).</p>
<div class="lab">ESC/EACTS 2025</div><p>Même logique, exprimée en cibles et en zones thérapeutiques ; l’automesure de l’INR est encouragée chez les patients formés. L’ACC/AHA 2020 admet un INR de 1,5 à 2,0 après trois mois pour la prothèse On-X en position aortique ; ce n’est pas la position européenne.</p></template>

<template data-pop="i35-halt" data-title="Thrombose infraclinique des cuspides après TAVI">
<div class="lab">Définition</div><p>Épaississement hypoatténué des cuspides en tomodensitométrie, avec parfois une mobilité réduite ; souvent sans effet sur le gradient.</p>
<div class="lab">Signification</div><p>Fréquent, parfois transitoire ; lien incertain avec les AVC et la durabilité.</p>
<div class="lab">Conduite</div><p>Pas de dépistage systématique. Anticoagulation si le gradient augmente, si une thrombose devient clinique ou en cas d’embolie. L’anticoagulation préventive systématique a augmenté la mortalité ou les hémorragies (GALILEO, ATLANTIS).</p></template>

<template data-pop="i35-pacemaker" data-title="Troubles de conduction après TAVI">
<div class="lab">Mécanisme</div><p>Compression du faisceau de His et de la branche gauche sous le septum membraneux par l’armature de la prothèse.</p>
<div class="lab">Facteurs prédictifs</div><p>Bloc de branche droit préexistant (principal) ; valve auto-expansible ; implantation profonde ; septum membraneux court ; calcifications sous-annulaires.</p>
<div class="lab">Surveillance</div><p>ECG et monitorage après l’intervention ; stimulation temporaire selon le cas ; surveillance ambulatoire du rythme si un nouveau bloc de branche gauche apparaît. La nécessité d’un stimulateur varie de quelques pourcents à plus de 15 % selon la valve et le terrain.</p>
<div class="lab">Chirurgie</div><p>Un bloc auriculoventriculaire complet est aussi possible après un remplacement chirurgical, moins souvent.</p></template>

<template data-pop="i35-suivi" data-title="Surveillance active du patient asymptomatique">
<div class="lab">Éducation</div><p>Le patient connaît les symptômes d’alerte (dyspnée, angor, malaise, syncope, baisse de la tolérance à l’effort) et consulte sans attendre le prochain rendez-vous.</p>
<div class="lab">À chaque visite</div><p>Anamnèse ciblée sur l’activité ; examen ; échocardiographie (Vmax, gradient, SVA, FEVG, VESi ; dans l’IA : dimensions et volumes, FEVG) ; BNP ou NT-proBNP ; épreuve d’effort si l’absence de symptômes est douteuse.</p>
<div class="lab">Signaux qui déclenchent la discussion en Heart Team</div><p>Symptômes ; FEVG en baisse ; progression de la Vmax ≥ 0,3 m/s par an ; peptides en hausse ; seuils ventriculaires de l’IA approchés ; aorte proche des seuils.</p>
<div class="lab">Autres mesures</div><p>Contrôle dentaire régulier ; contrôle tensionnel ; vaccinations selon l’OFSP.</p></template>

<template data-pop="i35-chirnc" data-title="Chirurgie non cardiaque et valvulopathie aortique">
<div class="lab">RA sévère symptomatique</div><p>Remplacement valvulaire (chirurgie ou TAVI) recommandé avant une chirurgie non cardiaque élective à risque intermédiaire ou élevé (ESC 2022, chirurgie non cardiaque).</p>
<div class="lab">RA sévère asymptomatique</div><p>Chirurgie à risque faible ou intermédiaire possible avec précautions ; avant une chirurgie à haut risque, un remplacement valvulaire est à envisager.</p>
<div class="lab">Anesthésie</div><p>Éviter l’hypotension (vasoconstricteur précoce : noradrénaline ou phényléphrine), la tachycardie et la perte du rythme sinusal ; prudence avec l’anesthésie neuraxiale.</p>
<div class="lab">Prothèse mécanique</div><p>Gestes mineurs (dentaires, cataracte, endoscopie simple) : poursuite de l’antivitamine K (classe I, niveau A, ESC/EACTS 2025). Chirurgie majeure : arrêt de l’antivitamine K et relais par héparine, reprise dès que l’hémostase le permet.</p></template>

<template data-pop="i35-grossesse" data-title="Grossesse et valvulopathies aortiques">
<div class="lab">Classification mWHO</div><p>Classification de risque maternel de l’Organisation mondiale de la santé modifiée ; l’ESC 2025 la complète (mWHO 2.0) par des modificateurs de risque issus du score CARPREG II. Repères de l’ESC 2018 : RA sévère symptomatique, classe IV (grossesse déconseillée) ; RA sévère asymptomatique, classe III ; prothèse mécanique, classe III ; bicuspidie avec aorte &lt; 45 mm, classe II ; 45 à 50 mm, classe III ; &gt; 50 mm, classe IV ; syndrome de Marfan avec aorte &gt; 45 mm, classe IV.</p>
<div class="lab">Avant la grossesse</div><p>RA sévère symptomatique, FEVG réduite ou épreuve d’effort anormale : intervention avant la conception. Choix d’une bioprothèse si un remplacement est nécessaire chez une femme qui souhaite une grossesse (classe I, ESC 2025). Arrêt des IEC, ARA II ; poursuite du bêtabloquant dans l’aortopathie.</p>
<div class="lab">Pendant la grossesse</div><p>Suivi par une équipe cardio-obstétricale (« Pregnancy Heart Team ») ; échocardiographie répétée. RA sévère qui se décompense malgré le traitement médical : valvuloplastie par ballonnet ou TAVI dans un centre expérimenté. L’IA est en général bien tolérée ; diurétiques si congestion.</p>
<div class="lab">Prothèse mécanique</div><p>Risque élevé de thrombose et d’hémorragie. Antivitamine K à faible dose poursuivie aux deuxième et troisième trimestres ; au premier trimestre, poursuite à faible dose ou relais par héparine de bas poids moléculaire avec contrôle de l’activité anti-Xa ; passage à l’héparine vers 36 semaines, avant l’accouchement programmé.</p>
<div class="lab">Accouchement</div><p>Voie basse conseillée dans la plupart des cas (ESC 2025 : moins de pertes sanguines, d’infections et de thromboembolies veineuses), avec analgésie péridurale ; césarienne selon l’indication obstétricale et certaines situations cardiaques (anticoagulation par antivitamine K au moment du travail, aorte très dilatée, RA sévère symptomatique).</p></template>

<template data-pop="i35-rapvit" data-title="Rapport des vitesses (indice de perméabilité Doppler)">
<div class="lab">Définition</div><p>Rapport entre l’ITV (ou la vitesse maximale) de la CCVG et celle du flux transvalvulaire. Normal proche de 1 ; RA sévère si &lt; 0,25.</p>
<div class="lab">Intérêt</div><p>Il n’utilise pas le diamètre de la CCVG, principale source d’erreur de la SVA. Il sert à vérifier une surface douteuse et à suivre une prothèse.</p>
<div class="lab">Piège</div><p>Un échantillonnage de la CCVG trop proche de la valve (accélération préstenotique) surestime le rapport et sous-estime la sévérité.</p></template>

<template data-pop="i35-vesi" data-title="Volume d’éjection systolique indexé (VESi)">
<div class="lab">Mesure</div><p>Surface de la CCVG × ITV de la CCVG, divisé par la surface corporelle.</p>
<div class="lab">Valeurs</div><p>Normal &gt; 35 mL/m² ; bas débit si ≤ 35 mL/m², seuil unique de l’ESC/EACTS 2025. Des études de cohorte proposent des seuils propres au sexe (environ ≤ 32 mL/m² chez la femme, ≤ 40 mL/m² chez l’homme) ; ils ne sont pas repris par les recommandations. Retenir que le seuil unique peut surestimer le bas débit chez la femme de petit gabarit.</p>
<div class="lab">Usage</div><p>Premier paramètre à mesurer devant une discordance surface-gradient : il sépare les formes à débit normal des formes à bas débit.</p>
<div class="lab">Piège</div><p>Il hérite de l’erreur sur le diamètre de la CCVG ; en cas de doute, le confirmer par une autre méthode (volumes biplans, IRM).</p></template>

<template data-pop="i35-projsurf" data-title="Surface projetée à débit normal">
<div class="lab">Principe</div><p>Sous dobutamine, on relève à chaque palier la SVA et le débit transvalvulaire (volume d’éjection / durée d’éjection). La droite qui les relie permet d’estimer la surface pour un débit standard de 250 mL/s.</p>
<div class="lab">Interprétation</div><p>Surface projetée &lt; 1,0 cm² : RA sévère. Elle est utile lorsque le débit augmente, mais pas assez pour se normaliser.</p>
<div class="lab">Limite</div><p>Nécessite une réserve de débit ; calcul exigeant, fait dans des centres habitués.</p></template>

<template data-pop="i35-vc" data-title="Vena contracta de l’insuffisance aortique">
<div class="lab">Définition</div><p>Largeur du jet régurgitant à son point le plus étroit, juste en aval de l’orifice, mesurée en coupe parasternale grand axe zoomée.</p>
<div class="lab">Seuils</div><p>&lt; 3 mm : IA légère ; &gt; 6 mm : IA sévère.</p>
<div class="lab">Force</div><p>Peu dépendante du débit et des conditions de charge ; paramètre semi-quantitatif le plus robuste.</p>
<div class="lab">Limites</div><p>Jets multiples ou très excentriques ; orifice non circulaire dans la bicuspidie ; une erreur de 1 mm change la classe.</p></template>

<template data-pop="i35-pht" data-title="Temps de demi-décroissance de pression de l’IA">
<div class="lab">Définition</div><p>Temps nécessaire pour que le gradient diastolique entre aorte et ventricule diminue de moitié, mesuré sur le flux régurgitant au Doppler continu.</p>
<div class="lab">Seuils</div><p>&gt; 500 ms : IA légère ; &lt; 200 ms : IA sévère.</p>
<div class="lab">Physiologie</div><p>Plus la fuite est importante, plus la pression aortique baisse et la pression ventriculaire monte vite en diastole : le gradient s’effondre rapidement.</p>
<div class="lab">Piège</div><p>Raccourci par une pression télédiastolique élevée (IA aiguë, dysfonction diastolique) ; allongé par les vasodilatateurs et une IA chronique bien compensée. À intégrer à d’autres paramètres.</p></template>

<template data-pop="i35-irm-ia" data-title="IRM cardiaque dans l’insuffisance aortique">
<div class="lab">Mesures</div><p>Volumes ventriculaires et FEVG de référence ; volume et fraction régurgités par cartographie de flux en contraste de phase dans l’aorte ascendante.</p>
<div class="lab">Seuil</div><p>Fraction régurgitée ≥ 30 à 35 % : IA sévère selon les séries d’IRM, seuil plus bas qu’en échocardiographie.</p>
<div class="lab">Indications</div><p>Discordance échocardiographique, échogénicité insuffisante, décision opératoire chez un patient proche des seuils ventriculaires ; mesure de l’aorte sans irradiation.</p>
<div class="lab">Limites</div><p>Arythmie, dispositifs non compatibles, claustrophobie ; disponibilité.</p></template>
