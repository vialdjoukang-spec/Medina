
<!-- ===== FENÊTRES I35 : diagnostic et traitement ===== -->
<template data-pop="i35-discord" data-title="Discordance entre surface et gradient">
<div class="lab">Étape 1 — Erreur de mesure ?</div><p>Diamètre de la CCVG sous-estimé ; Vmax sous-estimée (fenêtres insuffisantes, mauvais alignement) ; SVA indexée chez l’obèse ; hypertension non contrôlée pendant l’examen. Contrôler le rapport des vitesses.</p>
<div class="lab">Étape 2 — Débit</div><p>VESi ≤ 35 mL/m² : bas débit. FEVG &lt; 50 % ou ≥ 50 %.</p>
<div class="lab">Étape 3 — Examen de confirmation</div><p>FEVG réduite : dobutamine, puis score calcique si pas de réserve. FEVG préservée : score calcique. Débit normal : le plus souvent RA modéré ; score calcique en cas de doute.</p>
<div class="lab">Étape 4 — Décision</div><p>Intégrer symptômes, score calcique, gradient sous dobutamine, peptides natriurétiques ; discussion en Heart Team.</p>
<div class="lab">Pourquoi cet ordre</div><p>L’erreur de mesure vient en premier, car elle est la cause la plus fréquente : le diamètre de la CCVG, élevé au carré, est souvent sous-estimé, ce qui abaisse la surface calculée. Le débit vient ensuite, car le gradient croît avec le carré du débit qui traverse l’orifice : à surface égale, un VESi bas abaisse le gradient. Une hypertension non contrôlée ou une bradycardie allonge l’éjection et réduit le débit instantané ; la mesure se refait donc à pression et fréquence contrôlées.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>, section 8.2.1 et figure 6.</p>
</template>

<template data-pop="i35-dse" data-title="Échocardiographie de stress à faible dose de dobutamine">
<div class="lab">Indication</div><p>RA à bas débit et bas gradient avec FEVG réduite.</p>
<div class="lab">Protocole</div><p>Début à 2,5 ou 5 µg/kg/min, augmentation toutes les 3 à 5 minutes jusqu’à 10 à 20 µg/kg/min au maximum, sous surveillance médicale en raison du risque d’arythmie ; mesures à chaque palier (VESi, Vmax, gradient moyen, SVA) (<a href="https://doi.org/10.1093/ehjci/jew335" target="_blank" rel="noopener">EACVI/ASE 2017</a>).</p>
<div class="lab">Interprétation</div><p>Réserve contractile si le volume d’éjection augmente d’au moins 20 %. Vrai RA sévère : Vmax ≥ 4,0 m/s ou gradient moyen ≥ 30 à 40 mmHg, la SVA ne dépassant 1,0 cm² à aucun débit. Pseudo-RA sévère : SVA &gt; 1,0 cm² avec une réserve de débit. Si le volume d’éjection n’augmente que de 10 à 20 %, la surface projetée à un débit normalisé est calculée (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Arrêt</div><p>Résultat positif, fréquence cardiaque augmentée de plus de 10 à 20 battements par minute ou supérieure à 100 par minute (effet inotrope maximal atteint), arythmie, hypotension, symptômes.</p>
<div class="lab">Limite</div><p>Les données disponibles concernent la forme à FEVG réduite ; sans réserve, ou si un examen n’est pas concluant, le score calcique complète le diagnostic, les deux examens étant complémentaires (ESC/EACTS 2025).</p>
<div class="lab">Principe physiologique</div><p>La dobutamine stimule les récepteurs bêta-1 et augmente la contractilité, donc le volume d’éjection. Une valve réellement serrée garde une surface fixe : le gradient monte avec le débit. Une valve modérément atteinte, mal ouverte par un ventricule faible, s’ouvre davantage : la surface augmente et le gradient reste bas.</p>
<div class="lab">Valeur pronostique</div><p>Dans une étude multicentrique européenne de 136 patients, la mortalité opératoire atteignait 32 % sans réserve contractile contre 5 % avec réserve ; le remplacement valvulaire restait associé à une meilleure survie à long terme (Monin, 2003). Ces chiffres ne décrivent pas le risque actuel de chaque patient. Dans les séries contemporaines de chirurgie et de TAVI, la présence d’une réserve ne détermine pas à elle seule le pronostic après intervention ; la FEVG et le devenir peuvent s’améliorer même sans réserve.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/12835219/" target="_blank" rel="noopener">Monin et coll., <i>Circulation</i> 2003;108:319–324</a> ; <a href="https://doi.org/10.1093/ehjci/jew335" target="_blank" rel="noopener">Baumgartner et coll., EACVI/ASE 2017</a> ; ESC/EACTS 2025, sections 8.2.1 et 8.4.1.</p>
</template>

<template data-pop="i35-cac" data-title="Score calcique valvulaire aortique">
<div class="lab">Technique</div><p>Tomodensitométrie sans injection, synchronisée à l’ECG ; quantification en unités Agatston des calcifications des cuspides.</p>
<div class="lab">Seuils (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>)</div><p>RA sévère : homme &gt; 2 000, femme &gt; 1 200 (sensibilité et spécificité d’environ 85 %). Seuils très spécifiques : homme &gt; 3 000, femme &gt; 1 600. RA sévère peu probable : homme &lt; 1 600, femme &lt; 800.</p>
<div class="lab">Force</div><p>Indépendant du débit et des conditions de charge : il tranche les discordances.</p>
<div class="lab">Limites</div><p>Interprétation prudente lorsque le RA peut être sévère sans calcification marquée : bicuspidie, amylose associée, sténoses surtout fibreuses d’origine rhumatismale, radique ou inflammatoire (ESC/EACTS 2025). Les calcifications de l’anneau et de la paroi aortique doivent être exclues de la mesure.</p></template>

<template data-pop="i35-effort" data-title="Épreuve d’effort dans le rétrécissement aortique">
<div class="lab">Indication</div><p>RA sévère chez un patient qui se dit asymptomatique, pour démasquer des symptômes et stratifier le risque.</p>
<div class="lab">Contre-indication</div><p>RA sévère symptomatique : risque de syncope et de mort subite.</p>
<div class="lab">Critères anormaux</div><p>Dyspnée, angor, malaise ou présyncope à un effort bas ; chute soutenue de la pression artérielle de plus de 20 mmHg pendant l’effort (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>) ; arythmie ventriculaire complexe.</p>
<div class="lab">Conséquence</div><p>Symptômes à l’effort : intervention recommandée (classe I). Baisse tensionnelle : intervention à envisager (classe IIa, niveau C).</p>
<div class="lab">Conditions</div><p>Épreuve limitée par les symptômes, sous surveillance médicale, dans un centre habitué.</p>
<div class="lab">Mécanisme des anomalies</div><p>À l’effort, les artérioles musculaires se dilatent. Normalement, le débit cardiaque augmente et la pression systolique monte. Dans le RA sévère, l’orifice fixe limite cette hausse : la pression artérielle stagne ou baisse, ce qui traduit un débit insuffisant. Les patients réduisent souvent leur activité sans le percevoir ; l’épreuve objective une limitation niée à l’anamnèse.</p>
<div class="lab">Pourquoi elle compte</div><p>Dès l’apparition des symptômes, le risque de mort subite augmente fortement sans intervention. Chez le patient déjà symptomatique, l’indication est posée : l’épreuve n’ajoute aucun élément de décision.</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025, sections 5.4 et 8.2.2.</p>
</template>

<template data-pop="i35-coro" data-title="Évaluation coronaire avant intervention valvulaire">
<div class="lab">Pourquoi</div><p>La maladie coronaire est fréquente chez le patient âgé porteur d’un RA ; elle modifie la stratégie (pontages associés à une chirurgie, angioplastie avant ou après TAVI). L’information doit être disponible lors de la discussion en Heart Team (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Comment</div><p>Coroscanner recommandé si la probabilité prétest de maladie coronaire obstructive est ≤ 50 % ; coronarographie invasive recommandée au-delà de 50 % (classe I). Chez le candidat au TAVI, l’omission de la coronarographie est à envisager si le scanner de planification est de qualité suffisante pour exclure une maladie coronaire significative (IIa).</p>
<div class="lab">Conduite</div><p>Chirurgie valvulaire : pontages des sténoses significatives. TAVI : l’angioplastie est à envisager pour une sténose ≥ 90 % d’un gros vaisseau (≥ 2,5 mm), et peut l’être pour une sténose ≥ 70 % selon les symptômes (ESC/EACTS 2025). Le moment de l’angioplastie restait indéterminé en 2025 ; un essai randomisé européen, financé notamment par l’Hôpital universitaire de Zurich (986 patients), a depuis montré qu’une stratégie « TAVI d’abord » n’était pas inférieure à une stratégie « angioplastie d’abord » à un an (événements 22,2 % contre 24,2 % ; <i>New England Journal of Medicine</i> 2026).</p>
<div class="lab">Prudence</div><p>Les mesures fonctionnelles invasives des sténoses coronaires s’interprètent avec prudence en cas de RA sévère, qui modifie l’hémodynamique coronaire (ESC/EACTS 2025).</p></template>

<template data-pop="i35-pressrec" data-title="Récupération de pression">
<div class="lab">Phénomène</div><p>Après l’orifice rétréci, une partie de l’énergie cinétique du jet se retransforme en pression dans l’aorte ascendante. La pression aortique en aval est alors plus élevée que la pression mesurée au niveau de l’orifice.</p>
<div class="lab">Conséquence</div><p>Le Doppler mesure la chute de pression au point le plus étroit ; il surestime la perte de pression réelle subie par le ventricule.</p>
<div class="lab">Quand y penser</div><p>Aorte ascendante &lt; 30 mm, RA modéré ; discordance entre Doppler et cathétérisme ; petites bioprothèses.</p></template>

<template data-pop="i35-gorlin" data-title="Formule de Gorlin">
<div class="lab">Formule</div><p>SVA (cm²) = débit cardiaque (mL/min) / [fréquence cardiaque × durée d’éjection systolique (s) × 44,3 × √gradient moyen (mmHg)].</p>
<div class="lab">Simplification de Hakki</div><p>SVA ≈ débit cardiaque (L/min) / √gradient pic à pic (mmHg).</p>
<div class="lab">Limites</div><p>Imprécise à bas débit ; dépend de la qualité de la mesure du débit ; le franchissement rétrograde de la valve expose à l’embolie cérébrale.</p>
<div class="lab">Place</div><p>Réservée aux discordances persistantes après les examens non invasifs.</p></template>

<template data-pop="i35-dissection" data-title="Dissection aortique de type A">
<div class="lab">Définition</div><p>Déchirure intimale avec création d’un faux chenal dans la média ; type A (classification de Stanford) si l’aorte ascendante est atteinte.</p>
<div class="lab">Présentation</div><p>Douleur brutale déchirante ; IA aiguë ; asymétrie des pouls ou de la pression ; déficit neurologique ; tamponnade ; ischémie coronaire, mésentérique ou d’un membre.</p>
<div class="lab">Diagnostic</div><p>Tomodensitométrie aortique en urgence ; échocardiographie au lit (lambeau intimal, IA, épanchement). L’<a href="https://doi.org/10.1093/eurheartj/ehae179" target="_blank" rel="noopener">ESC 2024</a> propose un algorithme qui associe le score de risque clinique de dissection et le dosage des D-dimères pour écarter le diagnostic chez le patient à faible probabilité.</p>
<div class="lab">Traitement</div><p>Chirurgie en urgence. En attendant : antalgie et traitement anti-impulsionnel immédiat visant une pression systolique &lt; 120 mmHg et une fréquence ≤ 60/min, par bêtabloquant intraveineux, le labétalol en première ligne, complété au besoin par un vasodilatateur (ESC 2024) ; pas d’anticoagulant ni d’antiagrégant.</p>
<div class="lab">Piège</div><p>Un tableau de syndrome coronarien aigu peut révéler une dissection qui atteint un ostium coronaire : la fibrinolyse ou la double antiagrégation seraient catastrophiques.</p>
<div class="lab">Pourquoi ces mesures</div><p>Le bêtabloquant réduit la fréquence et la vitesse de montée de la pression aortique à chaque systole : le cisaillement sur le lambeau intimal diminue, ce qui limite l’extension du faux chenal. Il précède tout vasodilatateur, qui provoquerait sinon une tachycardie réflexe. Anticoagulants et antiagrégants sont proscrits, car ils aggravent le saignement en cas de rupture et compliquent la chirurgie imminente.</p>
<div class="lab">D-dimères</div><p>Le thrombus du faux chenal libère des produits de dégradation de la fibrine. Dans une étude prospective européenne de 1 850 patients (ADvISED), des D-dimères positifs avaient une sensibilité de 96,7 % pour un syndrome aortique aigu, mais une spécificité de 64 % : un taux bas n’exclut le diagnostic qu’à faible probabilité clinique, et un taux élevé ne le prouve pas.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/29030346/" target="_blank" rel="noopener">Nazerian et coll., <i>Circulation</i> 2018;137:250–258</a> ; ESC 2024, maladies artérielles périphériques et aortiques, section sur les syndromes aortiques aigus.</p>
</template>

<template data-pop="i35-bav-ballon" data-title="Valvuloplastie aortique par ballonnet">
<div class="lab">Principe</div><p>Dilatation percutanée de la valve par un ballonnet, qui fissure les calcifications et étire les commissures.</p>
<div class="lab">Résultat</div><p>Dans le RA calcifié, les commissures ne sont pas fusionnées : le gain de surface est transitoire.</p>
<div class="lab">Indications</div><p>Pont vers une chirurgie ou un TAVI chez un patient instable sur le plan hémodynamique, et, si c’est faisable, avant une chirurgie non cardiaque urgente à haut risque (classe IIb, niveau C, <a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>). Dans le choc cardiogénique, le TAVI l’a largement remplacée, en raison du risque d’IA sévère et de la mortalité du geste en phase aiguë. Grossesse avec RA sévère symptomatique réfractaire au traitement médical : valvuloplastie ou TAVI à envisager dans un centre expérimenté (IIb, C, <a href="https://doi.org/10.1093/eurheartj/ehaf193" target="_blank" rel="noopener">ESC 2025 sur la grossesse</a>).</p>
<div class="lab">Complications</div><p>IA aiguë sévère, accident vasculaire cérébral, complications vasculaires, bloc de conduction.</p></template>

<template data-pop="i35-heartteam" data-title="Heart Team et centre valvulaire">
<div class="lab">Composition</div><p>Cardiologue clinicien, spécialiste de l’imagerie cardiaque, cardiologue interventionnel, chirurgien cardiaque, anesthésiste ; au besoin gériatre, néphrologue, spécialiste des soins palliatifs.</p>
<div class="lab">Critères pris en compte</div><p>Âge et espérance de vie ; risque opératoire (scores STS et EuroSCORE II) ; fragilité et autonomie ; anatomie (valve bicuspide, taille de l’anneau, hauteur des coronaires, accès fémoral, calcifications) ; lésions associées (coronaires, mitrale, aorte) ; durabilité et gestion sur toute la vie ; préférences du patient, informé des options.</p>
<div class="lab">Centre valvulaire</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> insiste sur des réseaux structurés de centres valvulaires disposant de toutes les techniques, d’un volume d’activité suffisant et d’une évaluation de leurs résultats.</p>
<div class="lab">Limites des scores</div><p>Les scores sous-estiment la fragilité, la cirrhose, l’aorte porcelaine et les séquelles de radiothérapie : la décision reste clinique.</p></template>

<template data-pop="i35-early" data-title="Intervention précoce dans le RA sévère asymptomatique : les essais">
<div class="lab">RECOVERY (2020)</div><p>145 patients porteurs d’un RA très sévère, âge moyen 64 ans. La chirurgie précoce a réduit la mortalité totale par rapport à la surveillance, sur un suivi moyen de 6,2 ans (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">AVATAR (2022)</div><p>157 patients européens (9 centres de 7 pays), âge moyen 67 ans, RA sévère asymptomatique avec épreuve d’effort normale et FEVG normale. La chirurgie précoce a réduit le critère composite (décès, infarctus, accident vasculaire cérébral, hospitalisation imprévue pour insuffisance cardiaque) : rapport de risques 0,46 ; sans différence significative sur les critères secondaires, dont la mortalité, à 32 mois ; une réduction des hospitalisations pour insuffisance cardiaque et de la mortalité a été rapportée au suivi prolongé (ESC/EACTS 2025).</p>
<div class="lab">EARLY TAVR (2025)</div><p>901 patients, âge moyen 75,8 ans, 83,6 % à faible risque chirurgical. TAVI précoce contre surveillance clinique : décès, accident vasculaire cérébral ou hospitalisation cardiovasculaire imprévue chez 26,8 % contre 45,3 % (rapport de risques 0,50), différence portée surtout par les hospitalisations (20,9 % contre 41,7 %) ; décès 8,4 % contre 9,2 %. Après un suivi médian de 3,8 ans, 87,0 % des patients surveillés avaient reçu un remplacement.</p>
<div class="lab">EVOLVED (2024)</div><p>224 patients asymptomatiques avec fibrose myocardique à l’IRM. L’intervention précoce n’a pas réduit les décès ni les hospitalisations imprévues liées au RA ; l’essai manquait de puissance et le délai médian avant intervention atteignait 5 mois dans le bras précoce (ESC/EACTS 2025).</p>
<div class="lab">Lecture</div><p>La méta-analyse des quatre essais montre une réduction des hospitalisations imprévues cardiovasculaires ou pour insuffisance cardiaque et des accidents vasculaires cérébraux, sans réduction de la mortalité totale ou cardiovasculaire. Les essais chirurgicaux portaient sur des patients jeunes, à faible risque, souvent atteints d’un RA très sévère. D’où une classe IIa (niveau A) dans l’ESC/EACTS 2025, qui laisse la surveillance active rapprochée comme alternative valable.</p></template>

<template data-pop="i35-mnemo-ia-seuils" data-title="Repère « 50-50-25 » de l’insuffisance aortique (aide pédagogique, non critère officiel)">
<p>Chez l’asymptomatique porteur d’une IA sévère, la chirurgie est recommandée (classe I) si :</p>
<ul><li>FEVG ≤ <b>50</b> % ;</li><li>DTSVG &gt; <b>50</b> mm ;</li><li>DTSVG indexé &gt; <b>25</b> mm/m².</li></ul>
<p>Les seuils plus précoces (FEVG ≤ 55 %, DTSVG indexé &gt; 22 mm/m², volume télésystolique indexé &gt; 45 mL/m²) relèvent d’une classe IIb chez le patient à faible risque (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>). Aide pédagogique, non critère officiel.</p></template>

<template data-pop="i35-reparation" data-title="Chirurgie conservatrice de la valve aortique">
<div class="lab">Principe</div><p>Conserver les cuspides natives lorsqu’elles sont saines ou réparables, et traiter la cause de la fuite (racine dilatée, prolapsus).</p>
<div class="lab">Techniques</div><p>Réimplantation (technique de David) : remplacement de la racine par un tube dans lequel la valve native est réimplantée ; remodelage (technique de Yacoub) ; réparation des cuspides (plicature, résection du raphé) ; annuloplastie.</p>
<div class="lab">Indications</div><p>Remplacement de racine avec conservation valvulaire chez le patient jeune à racine dilatée : recommandé dans un centre expérimenté si un résultat durable est attendu (classe I, niveau B) ; il est supérieur au tube valvé (intervention de Bentall) pour la mortalité à long terme et la morbidité thromboembolique et infectieuse (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>). Réparation des cuspides dans l’IA sévère : à envisager chez des patients sélectionnés (IIa, niveau B, ESC/EACTS 2025).</p>
<div class="lab">Avantages et limites</div><p>Pas d’anticoagulation à vie, moins de complications liées à la prothèse ; risque de réintervention pour récidive de fuite, variable selon l’expérience du centre.</p></template>

<template data-pop="i35-rva" data-title="Remplacement valvulaire aortique chirurgical">
<div class="lab">Technique</div><p>Sternotomie complète ou partielle, ou minithoracotomie ; circulation extracorporelle ; excision de la valve et décalcification de l’anneau ; implantation d’une prothèse mécanique ou biologique.</p>
<div class="lab">Avantages</div><p>Excision complète de la valve ; traitement simultané des coronaires, de la mitrale, de l’aorte ; possibilité d’élargir l’anneau ; données de durabilité anciennes.</p>
<div class="lab">Complications</div><p>Saignement, fibrillation auriculaire postopératoire (fréquente), AVC, bloc auriculoventriculaire, infection sternale, insuffisance rénale ; convalescence plus longue que le TAVI.</p>
<div class="lab">Indication préférentielle</div><p>Patient de moins de 70 ans à faible risque, bicuspidie, lésions associées à opérer, anatomie défavorable au TAVI.</p></template>

<template data-pop="i35-tavi" data-title="TAVI : principe, accès, complications">
<div class="lab">Principe</div><p>Bioprothèse (péricarde bovin ou porcin) montée sur une armature métallique, compressée sur un cathéter, puis déployée dans la valve native qui est repoussée contre la paroi. Deux familles : valves expansibles par ballonnet, valves auto-expansibles (souvent en position supra-annulaire, avantageuses dans les petits anneaux).</p>
<div class="lab">Accès</div><p>Transfémoral dans la grande majorité des cas, sous anesthésie locale et sédation. Alternatives si les artères iliofémorales sont inutilisables : sous-clavière ou axillaire, carotidienne, transcave ; la voie transapicale est devenue rare.</p>
<div class="lab">Complications</div><p>Troubles de conduction et stimulateur, complications vasculaires, AVC, fuite paravalvulaire, obstruction coronaire, rupture de l’anneau, thrombose des cuspides.</p>
<div class="lab">Après TAVI</div><p>Mobilisation précoce, sortie en quelques jours ; surveillance du rythme ; échocardiographie de référence ; aspirine seule ou anticoagulant seul selon l’indication.</p></template>

<template data-pop="i35-viv" data-title="Valve-in-valve et gestion sur toute la vie">
<div class="lab">Valve-in-valve</div><p>TAVI implanté dans une bioprothèse chirurgicale dégénérée. Évite une réintervention chirurgicale ; risque de gradient résiduel élevé dans les petites prothèses (diamètre interne réduit), parfois traité par fracture de l’anneau de la prothèse au ballonnet.</p>
<div class="lab">TAVI-en-TAVI</div><p>Second TAVI dans un premier. Le premier TAVI repousse les cuspides natives ; le second repousse celles du premier, qui peuvent former un cylindre fermant les sinus devant les ostia coronaires (séquestration des sinus).</p>
<div class="lab">Conséquence</div><p>Chez le patient jeune, la Heart Team planifie la seconde intervention dès la première : taille et type de prothèse, accès coronaire futur.</p></template>

<template data-pop="i35-prothese" data-title="Prothèse mécanique ou biologique">
<table class="t"><tr><th>Critère</th><th>Prothèse mécanique</th><th>Bioprothèse</th></tr>
<tr><td>Âge (position aortique, <a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>)</td><td>Préférée avant 60 ans</td><td>Préférée après 65 ans</td></tr>
<tr><td>Durabilité</td><td>Très longue</td><td>Dégénérescence structurelle, plus rapide chez le jeune</td></tr>
<tr><td>Anticoagulation</td><td>Antivitamine K à vie</td><td>Trois mois (aspirine ou antivitamine K, IIa), puis aspirine au long cours à discuter (IIb), ou anticoagulant si fibrillation auriculaire</td></tr>
<tr><td>Situations en faveur</td><td>Souhait du patient informé, en l’absence de contre-indication à l’anticoagulation au long cours</td><td>Souhait du patient ; contre-indication ou mauvaise qualité de l’anticoagulation ; espérance de vie limitée ; projet de grossesse (classe I, <a href="https://doi.org/10.1093/eurheartj/ehaf193" target="_blank" rel="noopener">ESC 2025 sur la grossesse</a>)</td></tr></table>
<div class="lab">Entre 60 et 65 ans</div><p>Décision partagée : risque hémorragique et contraintes de l’antivitamine K contre risque de réintervention, souvent par valve-in-valve.</p>
<div class="lab">Pourquoi la bioprothèse dégénère plus vite chez le jeune</div><p>Le tissu animal, traité pour devenir inerte, ne se renouvelle pas : il se calcifie et se déchire avec le temps. La durabilité diminue quand l’âge baisse ; les mécanismes en cause ne sont pas établis.</p>
<div class="lab">Pourquoi la prothèse mécanique impose l’antivitamine K</div><p>Les ailettes et l’anneau de suture activent la coagulation par la voie de contact : au laboratoire, la production de thrombine qu’ils déclenchent disparaît sans facteur XII ou XI, et le plasma de patients sous antivitamine K la supprime dès un INR supérieur à 1,5 (Jaffer, 2015). D’où l’antivitamine K à vie, recommandée pour tous les porteurs de prothèse mécanique (ESC/EACTS 2025).</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025, sections 8.5, 14.1 et 14.3.1.1 ; ESC 2025 sur la grossesse.</p>
</template>

<template data-pop="i35-ross" data-title="Opération de Ross">
<div class="lab">Principe</div><p>La valve pulmonaire du patient (autogreffe) remplace la valve aortique ; une homogreffe remplace la valve pulmonaire.</p>
<div class="lab">Avantages</div><p>Tissu vivant, pas d’anticoagulation au long cours.</p>
<div class="lab">Limites</div><p>Intervention complexe ; deux valves exposées à la dégénérescence ; dilatation possible de l’autogreffe ; expertise indispensable.</p>
<div class="lab">Place</div><p>Réalisée par des chirurgiens expérimentés chez des patients jeunes bien sélectionnés, elle peut être une bonne alternative au remplacement prothétique, en particulier dans l’IA (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p></template>

<template data-pop="i35-ppm" data-title="Désaccord patient-prothèse">
<div class="lab">Définition</div><p>Surface effective de la prothèse, rapportée à la surface corporelle, trop petite pour le débit du patient.</p>
<div class="lab">Terrain</div><p>Patient dont l’anneau est petit par rapport à sa corpulence (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Conséquences</div><p>Gradient résiduel, symptômes persistants et moindre bénéfice de l’intervention.</p>
<div class="lab">Prévention et traitement</div><p>Le désaccord doit être prévenu chaque fois que possible : élargissement de l’anneau lors d’un remplacement chirurgical, ou valve percutanée supra-annulaire dans un petit anneau. Une réintervention se discute chez le patient symptomatique porteur d’un désaccord sévère, surtout si son risque est faible (ESC/EACTS 2025, section 14.4.2.1).</p></template>

<template data-pop="i35-inr" data-title="INR cible des prothèses mécaniques (ESC/EACTS 2025)">
<table class="t"><tr><th>Type et position de la prothèse</th><th>Sans facteur prothrombotique</th><th>Avec un facteur prothrombotique</th></tr>
<tr><td>Prothèse aortique à double ailette ou à disque basculant unique de génération actuelle</td><td>2,5 (zone 2 à 3) ; 2 (1,5 à 2,5) possible si le risque hémorragique est élevé</td><td>3 (2,5 à 3,5)</td></tr>
<tr><td>Prothèse à bille, à disque basculant ancien en toute position, toute prothèse mitrale ou tricuspide</td><td>3 (2,5 à 3,5)</td><td>3,5 (3 à 4) ; aspirine à faible dose possible à la place si le risque thrombotique est très élevé</td></tr></table>
<div class="lab">Facteurs prothrombotiques</div><p>État d’hypercoagulabilité héréditaire ou acquis, FEVG &lt; 35 %, fibrillation auriculaire avec rétrécissement mitral significatif, événement thrombotique majeur de moins de douze mois (AVC cardio-embolique, thrombose veineuse profonde, embolie pulmonaire). Les cibles reposent sur le type et la position de la prothèse, les facteurs de risque et les comorbidités (classe I).</p>
<div class="lab">Qualité de l’anticoagulation</div><p>L’éducation du patient et, chez le patient sélectionné et formé, l’automesure et l’autogestion de l’INR sont recommandées (classe I). Après une complication thromboembolique majeure malgré un INR adéquat documenté, une cible plus haute ou l’ajout d’aspirine à faible dose est à envisager (IIa).</p>
<div class="lab">Écart avec l’information professionnelle suisse</div><p>L’information professionnelle de Marcoumar® indique pour les valves mécaniques une zone d’INR de 2,0 à 3,5. L’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> individualise la cible selon la prothèse et le patient ; pour l’examen fédéral, retenir la cible individualisée de l’ESC/EACTS 2025, qui reste comprise dans la zone de l’information professionnelle sauf chez les patients à très haut risque (cible 3,5).</p>
<div class="lab">Pourquoi la cible varie</div><p>La thrombose naît là où le flux ralentit et où la surface est la plus thrombogène. La position mitrale, à bas débit diastolique, les modèles anciens et la stase d’une FEVG basse demandent donc une anticoagulation plus intense ; un INR plus élevé augmente en contrepartie les hémorragies.</p>
<div class="lab">Pourquoi pas d’AOD</div><p>La prothèse active en permanence la coagulation par la voie de contact. Aux concentrations usuelles, le dabigatran ne freine pas cette production de thrombine, que l’antivitamine K supprime ; l’apixaban a lui aussi échoué en clinique. Le détail figure dans la fiche <button class="w" data-k="i35-d-aod-meca">AOD et prothèse mécanique</button>.</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025, tableau 10 et section 14.3.1.1 ; information professionnelle suisse Marcoumar®, Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://pubmed.ncbi.nlm.nih.gov/26304938/" target="_blank" rel="noopener">Jaffer et coll., <i>Journal of the American Heart Association</i> 2015;4:e002322</a>.</p>
</template>

<template data-pop="i35-halt" data-title="Thrombose infraclinique des cuspides après TAVI">
<div class="lab">Définition</div><p>Épaississement hypoatténué des cuspides en tomodensitométrie, avec parfois une mobilité réduite ; souvent sans effet sur le gradient.</p>
<div class="lab">Signification</div><p>Fréquent, parfois transitoire ; lien incertain avec les AVC et la durabilité.</p>
<div class="lab">Conduite</div><p>Pas de dépistage systématique. Anticoagulation si le gradient augmente, si une thrombose devient clinique ou en cas d’embolie. L’anticoagulation préventive systématique a augmenté la mortalité ou les hémorragies (GALILEO, ATLANTIS).</p></template>

<template data-pop="i35-pacemaker" data-title="Troubles de conduction après TAVI">
<div class="lab">Mécanisme</div><p>Compression du faisceau de His et de la branche gauche sous le septum membraneux par l’armature de la prothèse.</p>
<div class="lab">Facteurs prédictifs</div><p>Bloc de branche droit préexistant (principal) ; valve auto-expansible ; implantation profonde ; septum membraneux court ; calcifications sous-annulaires.</p>
<div class="lab">Surveillance</div><p>ECG et monitorage après l’intervention ; stimulation temporaire selon le cas ; surveillance ambulatoire du rythme si un nouveau bloc de branche gauche apparaît. Dans la méta-analyse de Siontis, 17 % des patients ont reçu un stimulateur, de 2 à 51 % selon les études, davantage avec les premières valves auto-expansibles ; les valves percutanées dédiées à l’IA en exigent dans 24 % des cas (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Chirurgie</div><p>Un bloc auriculoventriculaire complet est aussi possible après un remplacement chirurgical, moins souvent.</p>
<div class="lab">Pourquoi le bloc de branche droit</div><p>La conduction ventriculaire emprunte les deux branches du faisceau de His, et la prothèse lèse surtout la branche gauche. Si la branche droite est déjà bloquée, cette atteinte interrompt la dernière voie de conduction : bloc auriculoventriculaire complet. Dans une méta-analyse de 41 études et 11 210 patients, surtout traités par les premières générations de valves, un bloc de branche droit préexistant multipliait environ par 2,9 le risque d’implantation d’un stimulateur.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/25011716/" target="_blank" rel="noopener">Siontis et coll., <i>Journal of the American College of Cardiology</i> 2014;64:129–140</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40368460/" target="_blank" rel="noopener">registre SwissTAVI (stimulateur après TAVI, <i>JACC Cardiovascular Interventions</i> 2025)</a>.</p>
</template>

<template data-pop="i35-suivi" data-title="Surveillance active du patient asymptomatique">
<div class="lab">Éducation</div><p>Le patient connaît les symptômes d’alerte (dyspnée, angor, malaise, syncope, baisse de la tolérance à l’effort) et consulte sans attendre le prochain rendez-vous.</p>
<div class="lab">À chaque visite</div><p>Anamnèse ciblée sur l’activité ; examen ; échocardiographie (Vmax, gradient, SVA, FEVG, VESi ; dans l’IA : dimensions et volumes, FEVG) ; BNP ou NT-proBNP ; épreuve d’effort si l’absence de symptômes est douteuse.</p>
<div class="lab">Signaux qui déclenchent la discussion en Heart Team</div><p>Symptômes ; FEVG en baisse ; progression de la Vmax ≥ 0,3 m/s par an ; peptides en hausse ; seuils ventriculaires de l’IA approchés ; aorte proche des seuils.</p>
<div class="lab">Autres mesures</div><p>Contrôle dentaire régulier ; contrôle tensionnel ; vaccinations selon l’OFSP.</p>
<div class="lab">Pourquoi ces intervalles</div><p>Le RA sévère asymptomatique devient souvent symptomatique en quelques mois à quelques années. Dans une série de 128 patients, la survie sans décès ni remplacement motivé par des symptômes était de 67 % à un an et de 33 % à quatre ans ; avec une calcification modérée ou sévère, elle tombait à 20 % à quatre ans. La Vmax progressait de 0,45 m/s par an chez les patients qui ont présenté un événement, contre 0,14 m/s par an chez les autres. Un contrôle au moins semestriel permet de saisir ce tournant ; un RA léger peu calcifié du sujet jeune progresse lentement et autorise un contrôle tous les deux à trois ans.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/10965007/" target="_blank" rel="noopener">Rosenhek et al., <i>New England Journal of Medicine</i> 2000;343:611–617</a> ; <a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>, section 8.6.</p>
</template>

<template data-pop="i35-chirnc" data-title="Chirurgie non cardiaque et valvulopathie aortique">
<div class="lab">RA sévère symptomatique</div><p>Chirurgie non cardiaque urgente vitale : réalisée sous surveillance hémodynamique étroite, en évitant les variations brutales de volémie et en traitant sans délai toute arythmie. Chirurgie urgente à haut risque : TAVI ou valvuloplastie par ballonnet à envisager avant le geste en cas de RA critique. Chirurgie différable : évaluation en Heart Team pour un remplacement valvulaire préalable, le TAVI étant préféré si une récupération rapide compte (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>, section 15.2.1).</p>
<div class="lab">RA sévère asymptomatique</div><p>Une chirurgie urgente à risque faible ou intermédiaire peut être réalisée avec une sécurité relative ; pour une chirurgie programmée, la décision est individualisée (ESC/EACTS 2025).</p>
<div class="lab">Anesthésie</div><p>Éviter l’hypotension, la tachycardie et la perte du rythme sinusal ; prudence avec l’anesthésie neuraxiale.</p>
<div class="lab">Prothèse mécanique</div><p>Gestes mineurs (dentaires, cataracte, endoscopie simple) : poursuite de l’antivitamine K (classe I, niveau A, ESC/EACTS 2025). Chirurgie majeure : arrêt de l’antivitamine K au moins 4 jours avant, pour un INR &lt; 1,5, et reprise dans les 24 heures si l’hémostase le permet (I, B) ; relais par héparine si un facteur thromboembolique s’ajoute (IIa, B) ; arrêt 3 à 4 jours avant sans relais envisageable pour une valve aortique de nouvelle génération sans autre facteur (IIb, B). Avec la phenprocoumone, de demi-vie longue (environ 160 heures), l’information professionnelle suisse prévoit un arrêt environ 5 à 10 jours avant l’opération sous contrôle de l’INR.</p>
<div class="lab">Pourquoi ces précautions</div><p>L’anesthésie neuraxiale bloque le tonus sympathique : la vasodilatation artérielle et veineuse abaisse brutalement la précharge et la pression artérielle, que le débit fixe du RA ne peut pas compenser. Pour un geste mineur sous antivitamine K, le saignement se contrôle localement, au besoin par un antifibrinolytique topique, alors qu’un arrêt exposerait à la thrombose de la prothèse : le traitement est donc poursuivi. Le choix du relais avant une chirurgie majeure est expliqué dans la fiche <button class="w" data-k="i35-d-hep">héparines : relais et grossesse</button>.</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025, sections 14.3.1.3 et 15.2.1 ; information professionnelle suisse Marcoumar®.</p>
</template>

<template data-pop="i35-grossesse" data-title="Grossesse et valvulopathies aortiques">
<div class="lab">Classification mWHO 2.0 (ESC 2025)</div><p>Classification de risque maternel de l’Organisation mondiale de la santé modifiée, complétée par des modificateurs issus du score CARPREG II. RA sévère symptomatique : classe IV (grossesse déconseillée) ; RA sévère asymptomatique : classe III ; RA modéré : classe II–III ; prothèse mécanique non compliquée avec INR stable : classe III ; bicuspidie avec aorte &lt; 45 mm : classe II–III ; 45 à 50 mm : classe III ; &gt; 50 mm : classe IV ; syndrome de Marfan avec aorte de 40 à 45 mm : classe III ; &gt; 45 mm : classe IV.</p>
<div class="lab">Avant la grossesse</div><p>Intervention recommandée avant la grossesse si le RA sévère est symptomatique (classe I) ; à envisager chez l’asymptomatique, après information sur les risques, surtout si la FEVG est altérée ou l’épreuve d’effort limitée (ESC 2025). Bioprothèse recommandée plutôt qu’une prothèse mécanique chez la jeune femme qui envisage une grossesse (classe I). Remplacement prophylactique de la racine avant la grossesse si l’aorte dépasse 45 mm dans le syndrome de Marfan ; correction de l’aorte à partir de 50 mm dans la bicuspidie. Arrêt des IEC et des ARA II.</p>
<div class="lab">Pendant la grossesse</div><p>Suivi par la « Pregnancy Heart Team ». RA sévère symptomatique : repos, voire hospitalisation, diurétiques avec prudence ; s’il reste réfractaire, valvuloplastie par ballonnet ou TAVI à envisager dans un centre expérimenté (IIb, C). Les femmes porteuses d’un RA sévère ou symptomatiques avant la grossesse ont un risque d’environ un sur quatre d’insuffisance cardiaque pendant la grossesse.</p>
<div class="lab">Prothèse mécanique</div><p>Plan d’anticoagulation écrit avant la grossesse (classe I). Au premier trimestre : poursuite d’une antivitamine K si la dose nécessaire est faible, ou passage à l’héparine de bas poids moléculaire à dose curative deux fois par jour, avec contrôle hebdomadaire de l’activité anti-Xa au pic (cible individualisée de 1,0 à 1,2 U/mL). Aux deuxième et troisième trimestres, jusqu’à 36 semaines : poursuite de l’antivitamine K à envisager si le risque thrombotique est élevé (IIa, C). INR contrôlé chaque semaine ou au moins toutes les deux semaines (classe I). La « faible dose » correspond à ≤ 3 mg/jour de phenprocoumone ou ≤ 2 mg/jour d’acénocoumarol.</p>
<div class="lab">Écart avec l’information professionnelle suisse</div><p>Les informations professionnelles suisses de Marcoumar® et de Sintrom® contre-indiquent la grossesse ; celle de Marcoumar® demande de passer à un traitement plus sûr avant la conception et, si une grossesse survient, d’instaurer immédiatement une héparine. La poursuite d’une antivitamine K, admise par l’ESC 2025 chez la femme porteuse d’une prothèse mécanique à haut risque thrombotique, est donc hors autorisation en Suisse : elle relève d’une décision de la Pregnancy Heart Team, documentée et partagée avec la patiente.</p>
<div class="lab">Accouchement</div><p>Voie basse conseillée dans la plupart des cas : moins de pertes sanguines, d’infections et de thromboembolies veineuses. Césarienne si le travail débute sous antivitamine K ou moins de deux semaines après son arrêt (risque d’hémorragie intracrânienne fœtale), en cas d’aortopathie à haut risque (classe mWHO 2.0 III) ou d’indication obstétricale ; à envisager dans le RA sévère symptomatique (ESC 2025).</p>
<div class="lab">Pourquoi le RA se décompense</div><p>La grossesse augmente le débit cardiaque de 30 à 50 % et la fréquence cardiaque de 10 à 20 battements par minute : ce débit accru traverse un orifice fixe, d’où une hausse du gradient et des pressions de remplissage.</p>
<div class="lab">Pourquoi éviter la prothèse mécanique</div><p>Les antivitamines K traversent le placenta : elles exposent à une embryopathie et anticoagulent le fœtus. Les héparines ne le traversent pas, mais protègent moins bien la prothèse. Dans le registre de la grossesse et des cardiopathies de l’ESC (212 femmes porteuses d’une prothèse mécanique), une thrombose de valve a compliqué 4,7 % des grossesses et une hémorragie 23,1 % ; seules 58 % des grossesses se sont déroulées sans complication grave.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf193" target="_blank" rel="noopener">ESC 2025 sur la grossesse</a> (tableau 6, sections 4.5.3, 5.2.1 et 12.5) ; <a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>, section 16 ; <a href="https://pubmed.ncbi.nlm.nih.gov/26100109/" target="_blank" rel="noopener">van Hagen et coll., registre de la grossesse et des cardiopathies de l’ESC, <i>Circulation</i> 2015</a> ; informations professionnelles suisses Marcoumar® et Sintrom®.</p>
</template>

<template data-pop="i35-rapvit" data-title="Rapport des vitesses (indice de perméabilité Doppler)">
<div class="lab">Définition</div><p>Rapport entre l’ITV (ou la vitesse maximale) de la CCVG et celle du flux transvalvulaire. Normal proche de 1 ; RA sévère si &lt; 0,25.</p>
<div class="lab">Intérêt</div><p>Il n’utilise pas le diamètre de la CCVG, principale source d’erreur de la SVA. Il sert à vérifier une surface douteuse et à suivre une prothèse.</p>
<div class="lab">Piège</div><p>Un échantillonnage de la CCVG trop proche de la valve (accélération préstenotique) surestime le rapport et sous-estime la sévérité.</p></template>

<template data-pop="i35-vesi" data-title="Volume d’éjection systolique indexé (VESi)">
<div class="lab">Mesure</div><p>Surface de la CCVG × ITV de la CCVG, divisé par la surface corporelle.</p>
<div class="lab">Valeurs</div><p>Normal &gt; 35 mL/m² ; bas débit si ≤ 35 mL/m², seuil unique de l’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>. Des seuils propres au sexe ont été proposés (&lt; 40 mL/m² chez l’homme, &lt; 32 mL/m² chez la femme) ; l’ESC/EACTS 2025 les cite sans remplacer le seuil conventionnel de 35 mL/m². Le seuil unique peut donc surestimer le bas débit chez la femme de petit gabarit.</p>
<div class="lab">Usage</div><p>Premier paramètre à mesurer devant une discordance surface-gradient : il sépare les formes à débit normal des formes à bas débit.</p>
<div class="lab">Piège</div><p>Il hérite de l’erreur sur le diamètre de la CCVG ; en cas de doute, le confirmer par une autre méthode (volumes biplans, IRM).</p></template>

<template data-pop="i35-projsurf" data-title="Surface projetée à débit normal">
<div class="lab">Principe</div><p>Sous dobutamine, on relève à chaque palier la SVA et le débit transvalvulaire (volume d’éjection / durée d’éjection). La droite qui les relie permet d’estimer la surface pour un débit standard de 250 mL/s.</p>
<div class="lab">Interprétation</div><p>Elle permet de comparer les patients à un débit standardisé ; l’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> propose de la calculer lorsque le volume d’éjection n’augmente que de 10 à 20 % sous dobutamine, c’est-à-dire quand le débit augmente sans se normaliser.</p>
<div class="lab">Limite</div><p>Nécessite une réserve de débit ; calcul exigeant, fait dans des centres habitués.</p></template>

<template data-pop="i35-vc" data-title="Vena contracta de l’insuffisance aortique">
<div class="lab">Définition</div><p>Largeur du jet régurgitant à son point le plus étroit, juste en aval de l’orifice, mesurée en coupe parasternale grand axe zoomée.</p>
<div class="lab">Seuils</div><p>&lt; 3 mm : IA légère ; &gt; 6 mm : IA sévère.</p>
<div class="lab">Force</div><p>Peu dépendante du débit et des conditions de charge ; paramètre semi-quantitatif le plus robuste.</p>
<div class="lab">Limites</div><p>Jets multiples ou très excentriques ; orifice non circulaire dans la bicuspidie ; une erreur de 1 mm change la classe.</p></template>

<template data-pop="i35-pht" data-title="Temps de demi-décroissance de pression de l’IA">
<div class="lab">Définition</div><p>Temps nécessaire pour que le gradient diastolique entre aorte et ventricule diminue de moitié, mesuré sur le flux régurgitant au Doppler continu.</p>
<div class="lab">Seuils</div><p>&gt; 500 ms : IA légère ; &lt; 200 ms : IA sévère.</p>
<div class="lab">Physiologie</div><p>Plus la fuite est importante, plus la pression aortique baisse et la pression ventriculaire monte vite en diastole : le gradient s’effondre rapidement.</p>
<div class="lab">Piège</div><p>Raccourci par une pression télédiastolique élevée (IA aiguë, dysfonction diastolique) ; allongé par les vasodilatateurs et une IA chronique bien compensée. À intégrer à d’autres paramètres.</p></template>

<template data-pop="i35-irm-ia" data-title="IRM cardiaque dans l’insuffisance aortique">
<div class="lab">Mesures</div><p>Volumes ventriculaires et FEVG de référence ; volume et fraction régurgités par cartographie de flux en contraste de phase dans l’aorte ascendante.</p>
<div class="lab">Seuils</div><p>Limites qui concordent le mieux avec les grades échocardiographiques : légère ≤ 15 %, modérée 16 à 25 %, modérée à sévère 26 à 48 %, sévère &gt; 48 % ; une fraction régurgitée &gt; 33 % prédit la nécessité d’une chirurgie (<a href="https://doi.org/10.1093/ehjci/jeab253" target="_blank" rel="noopener">EACVI 2022</a>). Pour l’IA, le volume télésystolique indexé ≥ 43 mL/m² mesuré en IRM a été proposé pour guider la prise en charge de l’asymptomatique (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Indications</div><p>Discordance échocardiographique, échogénicité insuffisante, décision opératoire chez un patient proche des seuils ventriculaires ; mesure de l’aorte sans irradiation.</p>
<div class="lab">Limites</div><p>Arythmie, dispositifs non compatibles, claustrophobie ; disponibilité.</p></template>
<template data-pop="i35-choix-tech" data-title="Anatomie et terrain : chirurgie ou TAVI">
<div class="lab">Principe</div><p>Le TAVI écrase la valve native contre la paroi sans l’exciser. La chirurgie l’excise, traite les lésions voisines et coud la prothèse sous contrôle visuel. Chaque critère de choix découle de cette différence.</p>
<div class="lab">Ce qui oriente vers la chirurgie</div><p>Des coronaires basses, des sinus de Valsalva peu profonds ou une cuspide très calcifiée exposent à l’occlusion d’un ostium par la cuspide native repoussée. La bicuspidie associe un anneau elliptique, des calcifications asymétriques et souvent un raphé calcifié : après TAVI, fuite paravalvulaire, rupture de l’anneau et AVC y sont plus fréquents que sur valve tricuspide, et un raphé calcifié s’associe à une mortalité accrue. Une calcification massive de l’anneau ou de la chambre de chasse expose aux mêmes risques. Une aorte dilatée, des pontages complexes ou une autre valve à opérer se traitent dans le même temps opératoire. L’endocardite active, contre-indication relative au TAVI, exige l’excision des tissus infectés.</p>
<div class="lab">Ce qui oriente vers le TAVI</div><p>Une aorte « porcelaine » interdit le clampage et la canulation sans risque d’embolie calcaire. Après radiothérapie ou sternotomie, la fibrose médiastinale et des pontages perméables proches du sternum rendent la réouverture dangereuse. La fragilité et une déformation thoracique alourdissent la récupération après sternotomie et circulation extracorporelle. Les avantages du TAVI démontrés par les essais concernent la voie fémorale.</p>
<div class="lab">Ce qui change la décision</div><p>Les essais ont surtout inclus des patients âgés à valve tricuspide ; les bicuspidies et les anatomies défavorables en étaient exclues. Hors de ces situations, la Heart Team pèse l’espérance de vie, la durabilité attendue et la faisabilité d’une seconde intervention.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>, sections 8.5.1.2 et 8.5.1.3, figure 9.</p></template>
<template data-pop="i35-ra-asympto" data-title="Intervenir avant les symptômes dans le rétrécissement aortique">
<div class="lab">Physiologie normale</div><p>La FEVG dépend de la contractilité et de la postcharge. Un ventricule normal éjecte plus de la moitié de son volume télédiastolique et augmente son débit à l’effort, ce qui élève la pression systolique.</p>
<div class="lab">Mécanisme</div><p>Dans le RA sévère, la postcharge comprend la pression aortique et le gradient. Lorsque l’hypertrophie ne normalise plus la contrainte pariétale, la FEVG baisse par excès de postcharge ; cette dysfonction régresse en général après le remplacement. Plus tard, la fibrose de remplacement la rend irréversible. Une FEVG inférieure à 50 % sans autre cause signale que l’adaptation est dépassée : l’intervention est alors recommandée même sans symptôme, avant que la fibrose fige la dysfonction.</p>
<div class="lab">Conséquence clinique</div><p>Les marqueurs retenus repèrent les patients chez qui un événement est proche : RA très sévère, calcification sévère, progression rapide de la Vmax, peptides natriurétiques élevés, FEVG inférieure à 55 %. Ce sont des associations pronostiques issues de cohortes (<button class="w" data-k="i35-suivi">données de progression</button>) : elles prédisent symptômes, hospitalisations et décès, sans prouver qu’une intervention précoce les prévient chez chaque patient.</p>
<div class="lab">Ce qui change la décision</div><p>L’intervention précoce se justifie quand le risque d’attendre dépasse le risque procédural. Une épreuve d’effort anormale fait reclasser le patient comme symptomatique. Sans marqueur, l’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> admet l’intervention précoce chez le patient à faible risque, en alternative à une surveillance rapprochée, car les <button class="w" data-k="i35-early">essais randomisés</button> ont réduit les hospitalisations sans réduire la mortalité. Des ressources locales limitées ou de longues listes d’attente plaident aussi pour intervenir tôt.</p>
<div class="lab">Source</div><p>ESC/EACTS 2025, sections 8.4.1 et 8.4.2.</p></template>
