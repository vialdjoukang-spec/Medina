<template data-pop="i35-d-asa" data-title="Aspirine et clopidogrel après intervention valvulaire">
<div class="lab">Mécanisme</div><p><b>Aspirine</b> : inhibition irréversible de la cyclo-oxygénase 1 plaquettaire, baisse de la synthèse du thromboxane pour la durée de vie de la plaquette (7 à 10 jours). <b>Clopidogrel</b> : promédicament activé par le foie (CYP2C19), qui bloque irréversiblement le récepteur plaquettaire P2Y12.</p>
<div class="lab">Preuves</div><p>POPular TAVI, cohorte A (2020, 665 patients) : après TAVI, l’aspirine seule a réduit les hémorragies à un an par rapport à l’association aspirine-clopidogrel (15,1 % contre 26,6 %), sans augmenter les événements thrombotiques. Cohorte B (313 patients anticoagulés) : l’ajout de clopidogrel a augmenté les hémorragies (34,6 % contre 21,7 %) sans bénéfice.</p>
<div class="lab">Posologie</div><p>Aspirine 75–100 mg/jour (ESC/EACTS 2025 ; Aspirine Cardio® 100 mg en Suisse), pendant 12 mois après TAVI en l’absence d’indication d’anticoagulation (classe I, niveau A, ESC/EACTS 2025), puis au long cours à envisager (classe IIa, niveau C) ; clopidogrel 75 mg/jour en cas d’intolérance à l’aspirine ou pour la durée imposée par une angioplastie récente.</p>
<div class="lab">Effets indésirables</div><p>Hémorragies, surtout digestives ; dyspepsie ; bronchospasme chez certains asthmatiques (aspirine) ; éruption, rarement neutropénie (clopidogrel).</p>
<div class="lab">Contre-indications</div><p>Hémorragie active, ulcère évolutif, allergie vraie ; aspirine en fin de grossesse à dose antalgique.</p>
<div class="lab">Surveillance</div><p>Hémoglobine, signes de saignement ; inhibiteur de la pompe à protons si risque digestif élevé.</p>
<div class="lab">Pourquoi un antiplaquettaire</div><p>Un endothélium intact empêche les plaquettes d’adhérer. Après un TAVI, l’armature métallique, la jupe de tissu et les cuspides natives écrasées sont d’abord à nu. On admet que les plaquettes y adhèrent tant qu’un tissu cicatriciel ne les a pas recouvertes ; ce rationnel repose sur la physiopathologie plus que sur des essais.</p>
<div class="lab">Pourquoi pas davantage</div><p>Les patients traités par TAVI sont âgés et saignent facilement. La double antiagrégation n’est donc pas recommandée après TAVI sans autre indication (classe III, niveau B). Une anticoagulation systématique ne l’est pas non plus : dans l’essai GALILEO, le rivaroxaban 10 mg associé à l’aspirine a augmenté les décès, les complications thromboemboliques et les hémorragies par rapport à l’association aspirine-clopidogrel.</p>
<div class="lab">Durée</div><p>Au-delà de 12 mois, la poursuite de l’aspirine à faible dose (classe IIa) repose sur l’avis d’experts et de petites études, non sur des essais randomisés (niveau C). Le texte de l’ESC/EACTS 2025 décrit néanmoins l’aspirine à faible dose à vie comme le traitement de référence après TAVI sans indication d’anticoagulation, car les essais l’ont montrée plus sûre que la double antiagrégation. Après bioprothèse chirurgicale aortique, l’aspirine ou l’antivitamine K pendant les trois premiers mois sont deux options (classe IIa, niveau B). Une petite étude randomisée et une méta-analyse ont trouvé plus d’hémorragies majeures sous antivitamine K, sans moins d’embolies, mais avec une faible puissance statistique.</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025 sur les valvulopathies (Praz et al.), sections 14.3.2.1 et 14.3.2.2, tableau de recommandations 16.</p>
</template>

<template data-pop="i35-d-hep" data-title="Héparines : relais et grossesse">
<div class="lab">Mécanisme</div><p>Potentialisation de l’antithrombine. L’héparine non fractionnée inhibe la thrombine et le facteur Xa ; l’héparine de bas poids moléculaire (énoxaparine) agit surtout sur le facteur Xa.</p>
<div class="lab">Indications</div><p>Relais d’une antivitamine K autour d’une chirurgie majeure chez le porteur de prothèse mécanique à risque thromboembolique ; grossesse ; anticoagulation postopératoire précoce après implantation d’une prothèse mécanique (débutée dans les 24 heures avec l’antivitamine K, classe I, ESC/EACTS 2025).</p>
<div class="lab">Posologie</div><p>Énoxaparine (Clexane®) à dose curative : 1 mg/kg deux fois par jour par voie sous-cutanée ; une injection par jour si la clairance est &lt; 30 mL/min (information professionnelle suisse). Grossesse sur prothèse mécanique : dose ajustée sur l’activité anti-Xa au pic, contrôlée chaque semaine jusqu’à la cible puis toutes les 2 à 4 semaines, cible individualisée entre 1,0 et 1,2 U/mL selon le type et la position de la valve (ESC 2025). L’héparine de bas poids moléculaire n’est pas recommandée si ce contrôle n’est pas disponible (III, C).</p>
<div class="lab">Effets indésirables</div><p>Hémorragie ; thrombopénie induite par l’héparine ; ostéoporose en usage prolongé.</p>
<div class="lab">Contre-indications et précautions</div><p>Antécédent de thrombopénie induite par l’héparine ; hémorragie active. Accumulation de l’énoxaparine en insuffisance rénale sévère. L’information professionnelle de Clexane® signale des thromboses de prothèse valvulaire, dont certaines mortelles, chez des femmes enceintes traitées à 1 mg/kg deux fois par jour.</p>
<div class="lab">Pourquoi un relais, et quand s’en passer</div><p>L’effet de l’antivitamine K disparaît en plusieurs jours, le temps que le foie reconstitue les facteurs de coagulation. L’héparine, d’action brève, protège la prothèse pendant cette période et s’arrête juste avant le geste. Ce relais est envisagé lorsqu’un facteur thromboembolique s’ajoute à la prothèse (classe IIa, niveau B). Chez le porteur d’une valve mécanique aortique de nouvelle génération sans autre facteur de risque, l’arrêt 3 à 4 jours avant le geste et la reprise dans les 24 heures sans relais peuvent être envisagés (classe IIb, niveau B), car ce choix réduit les saignements postopératoires sans augmenter les thromboses (ESC/EACTS 2025).</p>
<div class="lab">Pourquoi les héparines pendant la grossesse</div><p>Les héparines ne traversent pas le placenta, contrairement à l’antivitamine K, dont le risque d’embryopathie est maximal au premier trimestre et dépend en partie de la dose (ESC 2025). Elles protègent cependant moins bien la valve mécanique : la fiche <button class="w" data-k="i35-grossesse">grossesse et valvulopathies aortiques</button> en donne les chiffres.</p>
<div class="lab">Ce qui change la décision</div><p>Au premier trimestre, une antivitamine K à faible dose (≤ 3 mg/jour de phenprocoumone, ≤ 2 mg/jour d’acénocoumarol) peut être poursuivie ; à dose plus élevée, l’héparine de bas poids moléculaire à dose ajustée la remplace. Aux deuxième et troisième trimestres, la poursuite de l’antivitamine K est à envisager chez la femme à haut risque thrombotique (IIa, C), puis l’anticoagulation est relayée avant l’accouchement (ESC 2025). En Suisse, les informations professionnelles de la phenprocoumone et de l’acénocoumarol contre-indiquent la grossesse : la décision relève de la Pregnancy Heart Team.</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025 sur les valvulopathies (Praz et coll.), sections 14.3.1 et 16.2.2 ; ESC 2025 sur la grossesse (De Backer et coll.), sections 5.2.1 et 12.5.3.2 ; informations professionnelles suisses Clexane®, Marcoumar® et Sintrom®.</p></template>

<template data-pop="i35-d-vasodil" data-title="Vasodilatateurs artériels dans l’insuffisance aortique">
<div class="lab">Molécules</div><p>Inhibiteurs calciques dihydropyridiniques (nifédipine à libération prolongée, amlodipine) ; IEC ; ARA II.</p>
<div class="lab">Mécanisme</div><p>La baisse de la pression aortique diastolique réduit le gradient de fuite et le volume régurgité ; la baisse de la postcharge facilite l’éjection.</p>
<div class="lab">Preuves</div><p>Dans l’essai randomisé d’Evangelista (2005, 95 patients asymptomatiques porteurs d’une IA sévère, suivis sept ans), la nifédipine 20 mg deux fois par jour ou l’énalapril 20 mg par jour n’ont réduit ni le recours au remplacement valvulaire (41 % et 50 % contre 39 % sans traitement) ni le volume régurgité, la taille ou la fonction ventriculaires. L’ESC/EACTS 2025 ne recommande donc pas ces médicaments pour retarder la chirurgie ; ils peuvent soulager les symptômes d’une IA sévère chronique lorsque la chirurgie est impossible.</p>
<div class="lab">Place</div><p>Traitement de l’hypertension chez le patient porteur d’une IA ; traitement symptomatique si la chirurgie est impossible ; dysfonction ventriculaire persistante après chirurgie. Pas d’usage pour retarder une chirurgie indiquée.</p>
<div class="lab">Effets indésirables</div><p>Dihydropyridines : œdèmes des chevilles, céphalées, bouffées de chaleur. IEC et ARA II : hyperkaliémie, hausse de la créatinine, toux (IEC), angiœdème.</p>
<div class="lab">Contre-indications</div><p>Grossesse (IEC, ARA II) ; hypotension ; prudence si un RA sévère est associé.</p></template>

<template data-pop="i35-d-nitroprus" data-title="Nitroprussiate de sodium">
<div class="lab">Mécanisme</div><p>Donneur de monoxyde d’azote : vasodilatation artérielle et veineuse immédiate ; les valeurs initiales de pression reviennent rapidement à l’arrêt de la perfusion.</p>
<div class="lab">Indications dans ce chapitre</div><p>IA aiguë en attente de chirurgie : réduction de la postcharge et du volume régurgité. RA sévère avec dysfonction ventriculaire et bas débit, sous surveillance hémodynamique invasive : chez 25 patients en soins intensifs (FEVG moyenne 0,21, SVA 0,6 cm²), le nitroprussiate a augmenté le débit cardiaque (Khot, 2003).</p>
<div class="lab">Posologie (Nipruss®)</div><p>Perfusion intraveineuse débutée à 0,2 µg/kg/min, doublée toutes les 3 à 5 minutes jusqu’à la pression souhaitée, avec mesure de la pression toutes les une à deux minutes ; plage de 0,2 à plus de 10 µg/kg/min ; réduction progressive à l’arrêt ; solution protégée de la lumière par des seringues et tubulures colorées.</p>
<div class="lab">Prévention de la toxicité</div><p>L’information professionnelle suisse recommande de perfuser en même temps du thiosulfate de sodium à 10 % par une voie séparée (rapport 1:10) ; en cas de perfusion de plusieurs jours, surtout à doses élevées ou en insuffisance rénale, le thiocyanate est dosé et ne doit pas dépasser 6 mg/100 mL ; l’intoxication au thiocyanate se traite par l’arrêt et, au besoin, la dialyse.</p>
<div class="lab">Surveillance</div><p>Pression artérielle invasive, lactate, durée la plus brève possible, fonction rénale.</p>
<div class="lab">Pourquoi il peut aider dans le rétrécissement aortique à bas débit</div><p>Le ventricule gauche éjecte contre deux résistances placées en série : la valve rétrécie et les artérioles. Dans l’insuffisance cardiaque, l’activation neurohormonale resserre les artérioles et ajoute de la postcharge. Le nitroprussiate les relâche ; un ventricule défaillant peut alors éjecter davantage, même à travers un orifice fixe. Si le débit n’augmente pas, la pression chute aussitôt : d’où la surveillance invasive.</p>
<div class="lab">Mécanisme de la toxicité</div><p>Le nitroprussiate libère du cyanure, que le foie transforme en thiocyanate grâce au thiosulfate ; le rein élimine ensuite le thiocyanate. Le cyanure libre bloque la respiration mitochondriale, d’où l’élévation du lactate ; en insuffisance rénale, c’est le thiocyanate qui s’accumule. D’où l’apport de thiosulfate et le dosage du thiocyanate.</p>
<div class="lab">Source complémentaire</div><p>Information professionnelle suisse Nipruss®, Swissmedic (AIPS), consultée le 08.10.2026 ; Khot et coll., <i>New England Journal of Medicine</i> 2003;348:1756–1763 (résumé lu).</p></template>

<template data-pop="i35-d-inotrope" data-title="Dobutamine et noradrénaline">
<div class="lab">Dobutamine (Dobutrex®)</div><p>Agoniste β1 prédominant : contractilité et fréquence augmentées. Thérapeutique : 2,5 à 10 µg/kg/min dans la plupart des cas, jusqu’à 40 µg/kg/min dans de rares cas, sous surveillance continue de la pression, du rythme et de la diurèse ; réduction progressive plutôt qu’arrêt brutal (information professionnelle suisse). Diagnostic : échocardiographie de stress à faible dose dans le RA à bas débit, de 2,5 ou 5 à 10–20 µg/kg/min au maximum (EACVI/ASE 2017). Dans l’IA aiguë, la tachycardie qu’elle induit raccourcit la diastole et limite la fuite.</p>
<div class="lab">Noradrénaline (Noradrenalin Sintetica®)</div><p>Agoniste α1 prédominant, avec un effet β1 : vasoconstriction, hausse de la pression artérielle et de la pression de perfusion coronaire. Place : hypotension du RA sévère décompensé ou à l’induction anesthésique. Dose de l’information professionnelle suisse : 8 à 12 µg/min au départ, ou 0,5 à 1 µg/min titrés ; entretien moyen 2 à 4 µg/min ; jusqu’à 30 µg/min dans le choc réfractaire ; administration par cathéter veineux.</p>
<div class="lab">Effets indésirables</div><p>Arythmies, ischémie myocardique (dobutamine) ; ischémie périphérique, extravasation (noradrénaline).</p>
<div class="lab">Surveillance</div><p>Monitorage continu du rythme et de la pression artérielle, lactate, diurèse.</p>
<div class="lab">Pourquoi accélérer le cœur dans l’insuffisance aortique aiguë</div><p>Le ventricule non dilaté ne peut pas accueillir brutalement le volume régurgité. Une fréquence plus rapide raccourcit la diastole, donc le temps pendant lequel le sang reflue, et maintient le débit. Pour la même raison, une stimulation rapide par une sonde temporaire peut améliorer transitoirement l’hémodynamique en attendant l’intervention (ESC/EACTS 2025). Un vasoconstricteur seul aurait l’effet inverse : il élève la pression aortique diastolique, donc le gradient qui entraîne la fuite.</p>
<div class="lab">Pourquoi restaurer la pression dans le rétrécissement aortique</div><p>Le ventricule gauche est perfusé surtout en diastole. La pression qui pousse le sang dans les coronaires est la pression aortique diastolique diminuée de la pression télédiastolique du ventricule. Dans le RA, la pression télédiastolique élevée réduit déjà cette marge. Une hypotension la supprime : l’ischémie sous-endocardique altère la contraction, le débit baisse, puis la pression chute encore. La noradrénaline rompt ce cercle en restaurant la pression diastolique.</p>
<div class="lab">Source complémentaire</div><p>Informations professionnelles suisses Dobutrex® et Noradrenalin Sintetica®, Swissmedic (AIPS), consultées le 08.10.2026 ; ESC/EACTS 2025, section 6.5.</p></template>

<template data-pop="i35-d-aorte" data-title="Bêtabloquants et ARA II dans les aortopathies">
<div class="lab">Mécanisme</div><p>Bêtabloquants : baisse de la pression artérielle et de la vitesse de montée de la pression, donc de la contrainte sur la paroi aortique. ARA II (losartan) : baisse tensionnelle et atténuation de la signalisation du TGF-β, excessive dans le syndrome de Marfan.</p>
<div class="lab">Recommandation</div><p>Syndrome de Marfan : un bêtabloquant ou un ARA II à dose maximale tolérée est recommandé pour ralentir la dilatation aortique (classe I), et l’association des deux est à envisager (IIa) (ESC 2024).</p>
<div class="lab">Posologie</div><p>Selon les informations professionnelles suisses, qui ne mentionnent pas le syndrome de Marfan : bisoprolol (Concor®) jusqu’à 10 mg/jour ; losartan (Cosaar®) jusqu’à 100 mg/jour dans l’hypertension. La « dose maximale tolérée » de l’ESC 2024 s’inscrit dans ces limites.</p>
<div class="lab">Bicuspidie et aortopathie dégénérative</div><p>Pas de molécule spécifique démontrée ; contrôle strict de la pression artérielle.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Bêtabloquants : bradycardie, fatigue ; prudence dans l’IA sévère, car ils allongent la diastole et le volume régurgité (ESC/EACTS 2025). ARA II : contre-indiqués pendant la grossesse.</p></template>

<template data-pop="i35-d-statine" data-title="Statines et rétrécissement aortique">
<div class="lab">Hypothèse</div><p>La phase d’initiation de la calcification valvulaire ressemble à l’athérosclérose.</p>
<div class="lab">Preuves</div><p>SALTIRE (2005, atorvastatine 80 mg), SEAS (2008, simvastatine 40 mg et ézétimibe 10 mg chez 1 873 patients), ASTRONOMER (2010, rosuvastatine 40 mg) : aucune réduction de la progression du RA ni des événements liés à la valve. Dans SEAS, les événements ischémiques cardiovasculaires ont diminué (rapport de risques 0,78), surtout par moins de pontages.</p>
<div class="lab">Place</div><p>Indication selon le risque cardiovasculaire global (SCORE2, maladie coronaire associée), pas pour la valve.</p>
<div class="lab">Perspectives</div><p>Traitements abaissant la Lp(a) et ciblant la voie ostéogénique : aucun n’est validé à ce jour pour freiner le RA.</p></template>

<template data-pop="i35-d-benza" data-title="Benzathine-benzylpénicilline">
<div class="lab">Mécanisme</div><p>Sel de pénicilline G à libération lente depuis le site d’injection intramusculaire : concentrations faibles mais prolongées, suffisantes contre le streptocoque du groupe A pendant 3 à 4 semaines.</p>
<div class="lab">Indication</div><p>Prévention secondaire du rhumatisme articulaire aigu, pour éviter les récidives qui aggravent les lésions valvulaires.</p>
<div class="lab">Posologie (Extencilline®)</div><p>1,2 million d’unités par voie intramusculaire toutes les 3 à 4 semaines chez l’adulte, l’adolescent et l’enfant de plus de 30 kg ; 600 000 unités au-dessous de 30 kg. Adaptation de la dose en cas de clairance &lt; 50 mL/min (information professionnelle suisse).</p>
<div class="lab">Durée</div><p>Sans atteinte cardiaque : au moins 5 ans ou jusqu’à 21 ans ; atteinte cardiaque transitoire : au moins 10 ans ou jusqu’à 21 ans ; atteinte cardiaque persistante : au moins 10 ans ou jusqu’à 40 ans, parfois à vie (information professionnelle suisse). L’ESC/EACTS 2025 recommande 10 ans de prophylaxie dans la cardiopathie rhumatismale, surtout chez l’enfant et l’adolescent, prolongée à l’âge adulte selon la sévérité de la valvulopathie et l’exposition au streptocoque.</p>
<div class="lab">Effets indésirables</div><p>Douleur au point d’injection ; réaction allergique, rare anaphylaxie.</p>
<div class="lab">Patient anticoagulé</div><p>L’information professionnelle de Marcoumar® proscrit les injections intramusculaires pendant l’anticoagulation, en raison du risque d’hématome : chez un patient sous antivitamine K, la voie et le schéma de la prophylaxie se discutent au cas par cas.</p>
<div class="lab">Pourquoi une prévention secondaire</div><p>Le rhumatisme articulaire aigu est une réaction auto-immune qui suit une infection à streptocoque du groupe A. Chaque nouvelle infection peut aggraver une valve déjà atteinte. L’injection retard maintient pendant 3 à 4 semaines une concentration qui prévient ces infections, sans dépendre d’une prise orale quotidienne.</p>
<div class="lab">Source complémentaire</div><p>Information professionnelle suisse Extencilline®, Swissmedic (AIPS), consultée le 08.10.2026 ; ESC/EACTS 2025 sur les valvulopathies (Praz et coll.), section 6.4.</p></template>
<template data-pop="i35-d-aod-meca" data-title="Anticoagulants oraux directs et prothèse mécanique">
<div class="lab">Physiologie normale</div><p>Dans un vaisseau lésé, la coagulation démarre surtout par le facteur tissulaire exposé dans la brèche : c’est la voie extrinsèque. La voie de contact, qui commence par le facteur XII puis le facteur XI, joue un rôle mineur dans l’hémostase normale. Elle s’active en revanche au contact des surfaces artificielles.</p>
<div class="lab">Mécanisme</div><p>Les ailettes et l’anneau de suture d’une prothèse mécanique activent en permanence la voie de contact : au laboratoire, la production de thrombine qu’ils déclenchent disparaît sans facteur XII ou XI. Cette thrombine submerge le dabigatran aux concentrations atteintes en clinique, alors que le plasma de patients sous antivitamine K la supprime dès un INR supérieur à 1,5 (Jaffer et al., 2015). Cette explication de laboratoire concorde avec l’échec des deux essais cliniques.</p>
<div class="lab">Conséquence clinique</div><p>Deux essais l’ont confirmé. RE-ALIGN comparait le dabigatran à la warfarine après remplacement valvulaire mécanique aortique ou mitral. Il a été arrêté après 252 patients : un AVC est survenu chez 5 % des patients sous dabigatran et chez aucun sous warfarine ; une hémorragie majeure chez 4 % contre 2 % (Eikelboom et al., 2013). PROACT Xa comparait l’apixaban 5 mg deux fois par jour à la warfarine (INR 2,0 à 3,0) chez des porteurs d’une valve aortique On-X, réputée peu thrombogène. Il a été arrêté après 863 patients. La thrombose de valve ou l’embolie liée à la valve atteignait 4,2 % par patient-année sous apixaban, contre 1,3 % sous warfarine (Wang et al., 2023).</p>
<div class="lab">Ce qui change la décision</div><p>Tout porteur de prothèse mécanique reçoit une antivitamine K à vie (classe I, niveau A), avec une <button class="w" data-k="i35-inr">cible d’INR adaptée à la prothèse</button>. Les AOD restent proscrits, même lorsque l’INR est instable (classe III, niveau A). L’instabilité se corrige par l’éducation du patient et, chez le patient formé, par l’automesure de l’INR, qui améliore l’efficacité du traitement (classe I, niveau A). Après une bioprothèse chirurgicale, les données d’essais soutiennent au contraire les AOD pour traiter une fibrillation auriculaire associée : ils sont préférés à l’antivitamine K après trois mois (classe IIa, niveau B).</p>
<div class="lab">Source</div><p>Jaffer et al., Dabigatran is less effective than warfarin at attenuating mechanical heart valve-induced thrombin generation, J Am Heart Assoc 2015;4:e002322 ; Eikelboom et al., Dabigatran versus warfarin in patients with mechanical heart valves, N Engl J Med 2013;369:1206-14 ; Wang et al., Apixaban or warfarin in patients with an On-X mechanical aortic valve, New England Journal of Medicine Evidence 2023;2(7) ; ESC/EACTS 2025 sur les valvulopathies (Praz et al.), sections 14.3.1 et 14.3.2.3, tableau de recommandations 14.</p></template>
<template data-pop="i35-ch-aod" data-title="AOD et prothèses valvulaires : recommandation européenne et information professionnelle suisse">
<div class="lab">Position de l’ESC/EACTS 2025</div><p>Chez le porteur d’une bioprothèse chirurgicale avec fibrillation auriculaire, un AOD est à préférer à l’antivitamine K après trois mois (IIa, B), et un AOD déjà en cours peut être poursuivi dès la période postopératoire (IIb, B). Après TAVI avec indication d’anticoagulation, l’anticoagulant oral est poursuivi seul, sans que le choix entre AOD et antivitamine K soit tranché. Sur prothèse mécanique, les AOD ne sont pas recommandés (III, A).</p>
<div class="lab">Position des informations professionnelles suisses (AIPS, consultées le 08.10.2026)</div><p>Eliquis® (apixaban) : sécurité et efficacité non étudiées chez les porteurs de prothèses valvulaires cardiaques, avec ou sans fibrillation auriculaire ; non recommandé. Rivaroxaban : ne doit pas être utilisé en thromboprophylaxie après TAVI (essai GALILEO) ; non recommandé en principe chez les porteurs de valves artificielles. Lixiana® (édoxaban) : non étudié chez les porteurs de valves artificielles ni en cas de sténose mitrale modérée à sévère ; non recommandé. Pradaxa® (dabigatran) : contre-indiqué en présence de valves cardiaques artificielles.</p>
<div class="lab">Arbitrage</div><p>La source la plus récente et la plus spécifique de la question clinique est l’ESC/EACTS 2025, fondée sur des essais postérieurs aux informations professionnelles (sous-groupes valvulaires des grands essais, essais randomisés après TAVI dont ATLANTIS). L’information professionnelle suisse reste toutefois le texte d’autorisation en vigueur : la prescription d’un AOD sur bioprothèse ou après TAVI se fait hors du cadre de l’autorisation, après information du patient, et l’antivitamine K demeure une option conforme. Sur prothèse mécanique, les deux sources concordent : antivitamine K seulement.</p>
<div class="lab">Source</div><p>ESC/EACTS 2025, section 14.3.2 et tableau de recommandations 16 ; informations professionnelles suisses Eliquis®, Rivaroxaban Sandoz®, Lixiana® et Pradaxa®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
<template data-pop="i35-ch-amox" data-title="Prophylaxie de l’endocardite par amoxicilline : dose européenne et dose suisse">
<div class="lab">ESC 2023 (endocardite)</div><p>Chez le patient à haut risque, avant un geste dentaire à risque (extraction, chirurgie buccale, manipulation de la gencive ou de la région périapicale) : amoxicilline 2 g par voie orale (enfant 50 mg/kg, au maximum 2 g), en dose unique 30 à 60 minutes avant le geste. La clindamycine n’est pas recommandée, en raison de ses effets indésirables graves.</p>
<div class="lab">Informations professionnelles suisses de l’amoxicilline</div><p>Amoxicilline Sandoz® et Amoxi-Mepha®, notamment, indiquent pour la prophylaxie de l’endocardite une dose unique de 3 g par voie orale chez l’adulte et l’enfant de plus de 10 ans, environ une heure avant le geste.</p>
<div class="lab">Recommandations suisses</div><p>Les sociétés suisses d’infectiologie, de cardiologie et de cardiologie pédiatrique ont publié en 2021 des recommandations communes : prophylaxie réservée aux patients à haut risque, carte d’endocardite limitée aux soins dentaires ; le schéma détaillé figure au chapitre I33 — Endocardite infectieuse.</p>
<div class="lab">Arbitrage</div><p>Le texte primaire le plus récent est l’ESC 2023, adopté par la Société suisse de cardiologie selon la page de l’ESC consacrée à cette société : la dose de 2 g est donc celle à retenir pour l’examen fédéral. L’information professionnelle suisse, plus ancienne, mentionne 3 g : la dose européenne de 2 g est une adaptation fondée sur une recommandation, à connaître comme écart.</p>
<div class="lab">Source</div><p>Delgado V. et coll., 2023 ESC Guidelines for the management of endocarditis, tableau 6 ; Sendi P. et coll., <i>Swiss Medical Weekly</i> 2021 ; informations professionnelles suisses Amoxicilline Sandoz® et Amoxi-Mepha®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
