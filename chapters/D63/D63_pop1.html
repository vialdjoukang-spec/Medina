<template data-pop="d63-ferritine" data-title="Ferritine : réserve et réaction inflammatoire"><p>La ferritine est une protéine de stockage du fer. Sa concentration plasmatique constitue un indicateur indirect des réserves, mais elle augmente aussi lors de l’inflammation. Une valeur très basse soutient une carence absolue ; une valeur normale ou élevée ne suffit pas à exclure un fer insuffisamment disponible pour la moelle.</p><p>Interpréter avec <button class="w" data-k="d63-tsat">TSAT</button>, maladie sous-jacente, activité inflammatoire et traitements récents. La zone de 30–100 µg/L dans une <button class="w" data-k="d63-mici">MICI</button> active ne se lit pas comme chez un adulte sans inflammation. Après fer intraveineux, le délai du dosage influence sa signification. Les seuils thérapeutiques de <button class="w" data-k="d63-sources-guides">KDIGO</button> ne définissent pas une norme universelle de réserve.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="d63-carence-absolue" data-title="Carence absolue : le stock est diminué"><p>Une carence absolue signifie que les réserves de fer sont diminuées ou épuisées. Elle peut résulter de pertes, d’apports insuffisants, de besoins augmentés ou d’une absorption insuffisante. La cause doit être recherchée même si un traitement martial fait remonter l’<button class="w" data-k="d63-hb">Hb</button>.</p><p>Elle peut coexister avec une inflammation. La ferritine peut alors être moins basse que prévu, tandis que la <button class="w" data-k="d63-tsat">TSAT</button> reste réduite. Une réponse au fer prouve au mieux une composante répondant à cet apport ; elle ne garantit pas que la source de perte a disparu. Des symptômes digestifs ou un saignement ne doivent pas être absorbés par le diagnostic de maladie chronique.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-restriction" data-title="Restriction martiale : le fer atteint mal la moelle"><p>La restriction martiale décrit une disponibilité insuffisante du fer pour la production érythrocytaire. Elle peut exister malgré un stock conservé, notamment quand l’hepcidine réduit l’export du fer par la ferroportine. Le terme « fonctionnelle » est employé dans plusieurs recommandations, avec des critères liés à la population étudiée.</p><p>Ce mécanisme ne constitue pas à lui seul une indication de fer IV. Confronter anémie, <button class="w" data-k="d63-tsat">TSAT</button>, ferritine, activité inflammatoire, <button class="w" data-k="d63-mrc">MRC</button> ou chimiothérapie et recommandations pertinentes. Une carence absolue associée reste possible. La correction de la maladie causale peut améliorer la disponibilité du fer, tandis qu’une infection systémique peut conduire à suspendre temporairement le fer selon <button class="w" data-k="d63-sources-guides">KDIGO</button>.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-reticulocytes" data-title="Réticulocytes : apprécier la réponse de production"><p>Les réticulocytes sont des hématies récemment produites, qui conservent des constituants détectables par des méthodes adaptées. Leur nombre doit être interprété par rapport au degré d’anémie et à la chronologie. Un pourcentage apparemment normal peut représenter une réponse insuffisante quand le nombre total d’hématies est réduit.</p><p>Une production faible peut accompagner inflammation, <button class="w" data-k="d63-mrc">MRC</button>, carence ou maladie médullaire. Une hausse peut apparaître après traitement ou en réponse à une perte ou une hémolyse. Le nombre de réticulocytes n’est pas leur contenu en <button class="w" data-k="d63-hb">Hb</button> : <button class="w" data-k="d63-chr">CHr</button> apporte une information complémentaire sur le fer récemment disponible. Le frottis normal illustré n’est pas une méthode de comptage réticulocytaire.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-ferroportine" data-title="Ferroportine : la porte de sortie cellulaire du fer"><p>La ferroportine participe à l’export du fer depuis les entérocytes et les macrophages vers le plasma. L’hepcidine réduit cet export. Cette régulation relie absorption digestive, recyclage des hématies et besoins de la moelle.</p><p>Quand l’inflammation augmente l’hepcidine, le fer peut rester davantage dans les compartiments cellulaires. Ferritine conservée ou élevée et <button class="w" data-k="d63-tsat">TSAT</button> basse deviennent alors compatibles. Ce schéma n’explique pas tout : pertes sanguines, déficit d’<button class="w" data-k="d63-esa">EPO</button>, inhibition des précurseurs et réduction de survie des hématies peuvent s’ajouter. Une explication mécanistique n’est pas une preuve d’indication pour un médicament donné.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S417] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a>.</p></div></template>
<template data-pop="d63-hepcidine" data-title="Hepcidine : signal hépatique du métabolisme du fer"><p>L’hepcidine est un peptide produit principalement par le foie, régulé notamment par le fer, l’érythropoïèse et l’inflammation. La voie <button class="w" data-k="d63-il6-stat3">IL-6</button>–<button class="w" data-k="d63-il6-stat3">STAT3</button> participe à son augmentation inflammatoire. Elle réduit la disponibilité du fer en inhibant son export par la ferroportine.</p><p>Ce mécanisme explique pourquoi un apport oral peut être moins efficace dans une inflammation active. Il ne permet pas de conclure que le fer oral sera toujours inutile, ni que le fer IV est toujours indiqué. Les dosages d’hepcidine ne constituent pas dans ce cours un examen de routine universel ; les algorithmes retenus reposent surtout sur clinique, numération, ferritine, <button class="w" data-k="d63-tsat">TSAT</button> et contexte.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-tsat" data-title="TSAT : saturation de la transferrine"><p>La transferrine transporte le fer dans le plasma. Sa saturation correspond à la proportion de sites occupés. Une saturation basse suggère que le fer disponible pour les tissus est réduit, mais ne distingue pas seule stock épuisé et fer séquestré.</p><p>Le seuil doit conserver son contexte. <button class="w" data-k="d63-sources-guides">ECCO</button> utilise moins de 16 % dans un énoncé et moins de 20 % dans le texte ; <button class="w" data-k="d63-sources-guides">ESMO</button> utilise notamment moins de 20 % pour la restriction fonctionnelle en oncologie. <button class="w" data-k="d63-sources-guides">KDIGO</button> combine des seuils différents avec la ferritine selon la dialyse. Une <button class="w" data-k="d63-tsat">TSAT</button> de 20 % n’est donc pas une frontière universelle entre « sain » et « malade ».</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="d63-stfr" data-title="Récepteur soluble de la transferrine et index"><p>Le récepteur soluble de la transferrine peut contribuer à la recherche d’une carence associée lorsque l’inflammation rend la ferritine difficile à interpréter. Des index combinent ce résultat et la ferritine pour aider à distinguer certains profils.</p><p>Les méthodes et seuils ne sont pas totalement standardisés ; l’activité érythropoïétique influence aussi la mesure. Ne pas appliquer un seuil publié sans vérifier méthode, unité et population. Le résultat complète une démarche, il ne remplace pas l’examen clinique ni l’exploration de pertes. La revue de Weiss discute son intérêt et ses limites ; elle n’en fait pas un test indispensable à chaque anémie chronique.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-chr" data-title="CHr : contenu en hémoglobine des réticulocytes"><p>Le <button class="w" data-k="d63-chr">CHr</button> renseigne sur le fer récemment incorporé dans les réticulocytes. Une valeur basse peut soutenir une restriction du fer disponible pour la production récente, même lorsque la ferritine est difficile à lire en contexte inflammatoire.</p><p><button class="w" data-k="d63-sources-guides">ECCO</button> cite un seuil inférieur à 29 pg ; <button class="w" data-k="d63-sources-guides">ESMO</button> cite 28 pg. Ces valeurs ne doivent pas être fusionnées en un nombre prétendument universel. Vérifier analyseur, paramètre exact et références locales. Le <button class="w" data-k="d63-chr">CHr</button> ne compte pas les réticulocytes et ne localise pas les réserves. Un résultat bas n’établit pas à lui seul le mécanisme inflammatoire ou l’indication d’une perfusion.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="d63-alloimmunisation" data-title="Allo-immunisation : un risque à intégrer, sans retarder l’urgence"><p>Une exposition transfusionnelle peut conduire à une réponse immunitaire contre des antigènes d’autrui. En <button class="w" data-k="d63-mrc">MRC</button>, la sensibilisation est particulièrement pertinente lorsqu’une transplantation est envisagée. Les antécédents transfusionnels et immunologiques doivent être transmis à l’équipe et au laboratoire.</p><p><button class="w" data-k="d63-sources-guides">KDIGO</button> recommande d’éviter les transfusions lorsque cela est possible et pertinent, notamment dans cette perspective, mais la décision dépend du bénéfice et du risque immédiats. Une anémie menaçante ou un saignement urgent ne doivent pas rester sans correction au nom d’un risque futur. Documenter l’indication, utiliser le volume nécessaire et réévaluer la réponse clinique.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a>.</p></div></template>
<template data-pop="d63-d-fer-oral" data-title="Fer oral : produit, indication et interactions"><p>La fiche suisse ferro sanol décrit une capsule contenant 100 mg de fer élément. Le schéma habituel concerne les patients d’au moins 6 ans et 20 kg ; le schéma initial de 200 mg/jour concerne une carence sévère à partir de 15 ans et 50 kg. Le maximum de 5 mg/kg/jour ne supprime pas ces conditions.</p><p>La spécialité est contre-indiquée en insuffisance rénale ou hépatique sévère. Prendre à distance des repas, ne pas mâcher les granules et vérifier les interactions, notamment antibiotiques, thyroxine, antiacides et aliments. Les rythmes alternés discutés par <button class="w" data-k="d63-sources-guides">ECCO</button> et la posologie de cette spécialité sont présentés séparément. Une absence de réponse impose une réévaluation de la cause et de la prise réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a>.</p></div></template>
<template data-pop="d63-d-ferinject" data-title="Ferinject : les trois calculs à séparer"><p>Vérifier d’abord l’indication adulte et la carence documentée. Calculer ensuite le besoin total par une méthode annoncée. Enfin, appliquer les limites de chaque administration et de la semaine : perfusion au maximum 20 mg/kg et 1 000 mg ; injection au maximum 15 mg/kg et 1 000 mg ; cumul hebdomadaire au maximum 1 000 mg. En hémodialyse, la fiche limite à 200 mg par jour.</p><p>La formule de Ganzoni utilise l’<button class="w" data-k="d63-hb">Hb</button> en g/dL. Le tableau simplifié peut donner un besoin différent ; ne pas additionner les deux. Prévoir équipe formée, matériel d’urgence et observation d’au moins 30 minutes. Hypophosphatémie et extravasation ont une importance propre, même si l’<button class="w" data-k="d63-hb">Hb</button> s’améliore.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="d63-d-eprex" data-title="Eprex : vérifier indication, cible et contre-indications"><p>L’époétine alfa stimule l’érythropoïèse dans des indications précises. La fiche suisse décrit notamment une anémie symptomatique de <button class="w" data-k="d63-mrc">MRC</button> avancée nécessitant des transfusions, et une indication oncologique chez l’adulte sous chimiothérapie. Elle n’autorise pas le traitement de toute anémie inflammatoire.</p><p>La cible rénale 10–12 g/dL de la fiche doit être distinguée de la recommandation <button class="w" data-k="d63-sources-guides">KDIGO</button> de rester sous 11,5 g/dL chez l’adulte sous <button class="w" data-k="d63-esa">ESA</button>. Hypertension non contrôlée, érythroblastopénie après <button class="w" data-k="d63-esa">EPO</button>, certaines situations thrombotiques et intention curative en oncologie figurent parmi les restrictions à examiner. Une hausse insuffisante ne justifie pas une escalade aveugle. L’effet n’est pas immédiat : une urgence transfusionnelle se traite comme telle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></template>
<template data-pop="d63-hif-phi" data-title="HIF-PHI : mécanisme ne vaut pas autorisation"><p>Les inhibiteurs des prolyl-hydroxylases de HIF agissent sur la réponse à l’hypoxie et peuvent modifier la production d’érythropoïétine et le métabolisme du fer. <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 les discute dans l’anémie de <button class="w" data-k="d63-mrc">MRC</button>, avec des précautions liées notamment aux risques cardiovasculaires, thrombotiques et tumoraux.</p><p>La recommandation préfère un <button class="w" data-k="d63-esa">ESA</button> aux <button class="w" data-k="d63-hif-phi">HIF-PHI</button> en première intention lorsqu’une stimulation est retenue et ne recommande pas leur association. Ce cours ne déduit aucune autorisation suisse globale de leur présence dans une recommandation internationale. Vérifier le produit, l’indication, la fiche suisse et les conditions de prise en charge avant toute décision.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S425] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S426] OFSP, cas particuliers, art. 71a à 71d de l’OAMal</a>.</p></div></template>
<template data-pop="d63-dyspnee" data-title="Dyspnée : retentissement possible, diagnostic encore ouvert"><p>Préciser effort déclenchant, début, progression, gêne au repos, douleur thoracique, orthopnée, fièvre, toux et malaise. L’anémie peut réduire le transport d’oxygène, mais une insuffisance cardiaque, une infection, une embolie ou une autre affection respiratoire peuvent coexister.</p><p>Une saturation normale ne mesure pas la concentration d’<button class="w" data-k="d63-hb">Hb</button>. Examiner fréquence respiratoire, circulation et signes de gravité ; une dyspnée de repos importante ou une instabilité impose une évaluation urgente. <button class="w" data-k="d63-profiles">PROFILES</button> inclut la dyspnée parmi les situations de départ : le raisonnement part du symptôme et de la sécurité, pas du code D63.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S422] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a>.</p></div></template>
<template data-pop="d63-paleur" data-title="Pâleur : un signe, pas un dosage"><p>La pâleur cutanéomuqueuse peut orienter vers une anémie. L’éclairage, le site observé, la pigmentation et la perfusion modifient son appréciation. Les sources utilisées ici ne donnent pas une performance diagnostique permettant de prédire un taux d’<button class="w" data-k="d63-hb">Hb</button> à partir de ce seul signe.</p><p>Rechercher les symptômes associés et confirmer par une numération appropriée. L’absence de pâleur évidente n’exclut pas une anémie ; sa présence ne permet ni de classer le mécanisme ni de décider seule d’une transfusion. La sémiologie relie l’observation à une question biologique puis à une décision contextualisée.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S422] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a>.</p></div></template>
<template data-pop="d63-hb" data-title="Hb : concentration d’hémoglobine"><p>L’<button class="w" data-k="d63-hb">Hb</button> indique une concentration d’hémoglobine dans le sang. 1 g/dL correspond à 10 g/L : 9 g/dL correspondent à 90 g/L. Les seuils de définition d’anémie varient selon âge, sexe et grossesse ; les seuils de transfusion répondent à une autre question.</p><p>Une concentration varie aussi avec le volume plasmatique. La dynamique, les perfusions, les transfusions et l’état d’hydratation doivent accompagner l’interprétation. La cible de 15 g/dL dans une formule de déficit en fer n’est pas une cible sous <button class="w" data-k="d63-esa">ESA</button>. Confondre ces usages produit des décisions erronées malgré une arithmétique exacte.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a>.</p></div></template>
<template data-pop="d63-vgm" data-title="VGM : une moyenne ne décrit pas toute la population"><p>Le volume globulaire moyen résume la taille moyenne des hématies. Une anémie inflammatoire peut être normocytaire ou microcytaire. Une carence en fer et un déficit favorisant une macrocytose peuvent se combiner et laisser une moyenne dans l’intervalle usuel.</p><p>Confronter <button class="w" data-k="d63-vgm">VGM</button>, distribution, frottis, réticulocytes et bilan orienté. Un <button class="w" data-k="d63-vgm">VGM</button> normal ne dispense pas d’évaluer le fer ; une microcytose ne prouve pas une carence absolue. La morphologie ne remplace pas l’étude de la cause et le suivi de sa correction.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-crp" data-title="CRP : contextualiser la ferritine"><p>La protéine C-réactive contribue à apprécier un contexte inflammatoire. Une ferritine peut être augmentée dans ce contexte, ce qui modifie son interprétation comme indicateur de réserve. Le résultat s’intègre à la maladie connue, aux symptômes et à leur évolution.</p><p>La <button class="w" data-k="d63-crp">CRP</button> n’établit pas seule la cause d’une anémie. Une valeur normale à un instant donné ne résout pas toutes les causes de ferritine élevée, et une valeur élevée ne prouve pas que tous les symptômes viennent de l’inflammation. Les autres mécanismes, notamment pertes et <button class="w" data-k="d63-mrc">MRC</button>, restent à examiner.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a>.</p></div></template>
<template data-pop="d63-mrc" data-title="MRC : maladie rénale chronique et anémie multifactorielle"><p>La <button class="w" data-k="d63-mrc">MRC</button> peut contribuer à l’anémie par un défaut relatif de stimulation érythropoïétique, une inflammation et des perturbations du métabolisme du fer. Pertes, carences et autres maladies restent possibles. Le stade rénal ne suffit pas à expliquer toute baisse d’<button class="w" data-k="d63-hb">Hb</button>.</p><p><button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 distingue l’hémodialyse des situations sans hémodialyse pour les seuils de début du fer. Les décisions d’<button class="w" data-k="d63-esa">ESA</button> sont individualisées hors dialyse ; la cible adulte recommandée est inférieure à 11,5 g/dL. Les contre-indications du produit suisse doivent rester respectées. Le risque d’allo-immunisation pèse dans une éventuelle transfusion si une greffe est envisagée.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a>.</p></div></template>
