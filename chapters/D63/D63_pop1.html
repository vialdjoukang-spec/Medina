<template data-pop="d63-sources" data-title="Sources du cours et leurs limites"><h3>Ce que ce cours a lu</h3><p>Chaque affirmation du cours renvoie à une source réellement lue le 14.10.2026. Le tableau indique la nature de chaque source et ce qu’elle ne permet pas de conclure.</p><table class="t"><tr><th>Source</th><th>Nature</th><th>Limite</th></tr><tr><td>Weiss, Ganz, Goodnough, Blood 2019</td><td>Revue narrative, texte intégral ; auteur principal européen (Innsbruck)</td><td>Ce n’est pas une recommandation ; seuils de saturation et de protéine C réactive non chiffrés</td></tr><tr><td>Celi et al., Revue Médicale Suisse 2011 (Hôpitaux universitaires de Genève)</td><td>Article avec algorithme de décision, tableaux et figure</td><td>Ancienne ; seuil d’hémoglobine de l’homme à 140 g/l, divergent ; marqueurs non validés pour le pronostic</td></tr><tr><td>Nendaz et Samii, exposé des Hôpitaux universitaires de Genève, 2011</td><td>Diapositives de formation</td><td>Épidémiologie citée de seconde main</td></tr><tr><td>Nowak et al., Swiss Medical Weekly 2019</td><td>Consensus Delphi suisse sur la carence en fer ; résumé seul lu</td><td>Avis d’experts ; hors inflammation</td></tr><tr><td>BfArM, CIM-10-GM 2024</td><td>Classification, version allemande</td><td>Libellé français de l’Office fédéral de la statistique non relu</td></tr><tr><td>KDIGO 2026</td><td>Recommandation internationale, non suisse ; illustrations centrales seules lues</td><td>Terminologie et rythme de surveillance de l’hémoglobine tirés d’un résumé secondaire</td></tr><tr><td>ESC 2023</td><td>Mise à jour sur l’insuffisance cardiaque</td><td>Classes et niveaux de 2023 non lisibles (image)</td></tr><tr><td>Informations professionnelles Eprex® (août 2021) et Ferinject® (juin 2025)</td><td>Textes officiels Swissmedic</td><td>Seules ces deux préparations ont été lues en détail</td></tr></table><p>Aucune source suisse récente spécifique à l’anémie inflammatoire (Société suisse d’hématologie, Forum Médical Suisse) n’a été trouvée. Le cours le dit plutôt que de combler la lacune de mémoire.</p><p>Aide pédagogique : revue par intelligence artificielle, distincte d’une validation médicale humaine. Audit différé.</p></template>
<template data-pop="d63-nosologie" data-title="Code astérisque et code croix : D63.0* et D63.8*"><h3>Le principe de la double codification</h3><p>La CIM-10-GM distingue le code croix (†), qui désigne l’étiologie, et le code astérisque (*), qui désigne la manifestation. Une manifestation n’a pas de sens codée seule : elle accompagne toujours la maladie qui l’explique. La catégorie D63 est entièrement un code astérisque (BfArM 2024).</p><table class="t"><tr><th>Code</th><th>Libellé</th><th>Code croix associé</th></tr><tr><td>D63.0*</td><td>Anémie au cours de néoplasies</td><td>C00 à D48†</td></tr><tr><td>D63.8*</td><td>Anémie au cours d’autres maladies chroniques classées ailleurs, y compris la maladie rénale chronique de stade 3 et plus</td><td>Maladie causale, par exemple N18.3 à N18.5†</td></tr></table><p>Exemple : une anémie chez une patiente atteinte d’un cancer se code avec le code croix de la tumeur et D63.0*. Une anémie liée à une maladie rénale chronique de stade 4 se code N18.4† avec D63.8*.</p><div class="trap"><span class="k">Piège</span> Le code D63.1 n’existe pas dans la CIM-10-GM 2024. Il appartient à la CIM-10-CM américaine, que le cours n’emploie pas.</div></template>
<template data-pop="d63-seuils-hb" data-title="Seuils d’hémoglobine : pourquoi les sources divergent"><h3>Le tableau des seuils</h3><table class="t"><tr><th>Source</th><th>Homme</th><th>Femme</th><th>Remarque</th></tr><tr><td>Weiss 2019 ; KDIGO 2026</td><td>Inférieur à 130 g/l</td><td>Inférieur à 120 g/l</td><td>Seuils de référence du cours</td></tr><tr><td>Celi 2011 (Hôpitaux universitaires de Genève)</td><td>Inférieur à 140 g/l</td><td>Inférieur à 120 g/l</td><td>Anémie non régénérative, réticulocytes inférieurs à 50 G/l</td></tr></table><p>La divergence tient à l’époque et à la population de chaque source. Les seuils de l’Organisation mondiale de la santé de 2024 n’ont pas pu être lus (texte intégral inaccessible) ; le cours ne les utilise pas. Un laboratoire peut en outre afficher son propre intervalle de référence, et le compte rendu du laboratoire qui a réalisé l’analyse prévaut.</p><div class="trap"><span class="k">Erreur fréquente</span> Appliquer le seuil de 140 g/l de l’algorithme genevois en dehors de son contexte : il décrit l’anémie non régénérative de cet algorithme, pas un seuil international.</div></template>
<template data-pop="d63-hepcidine" data-title="Hepcidine : l’hormone qui ferme la porte du fer"><h3>Ce qu’elle est</h3><p>L’hepcidine est un peptide synthétisé par le foie. Elle se fixe à la ferroportine, protéine d’export du fer, et provoque son internalisation puis sa dégradation. À forte concentration, elle l’occlut aussi directement (Weiss 2019).</p><h3>Ce qui la règle</h3><p>Les régulateurs de sa synthèse sont l’érythropoïèse, les réserves en fer, le fer sérique, l’hypoxie et l’inflammation (Celi 2011). Parmi eux, l’inflammation, par l’interleukine 6, l’augmente (Weiss 2019). Le lien avec l’érythropoïèse apparaît dans la boucle de l’érythropoïétine : quand son signal baisse, la production d’érythroferrone diminue et la restriction en fer par l’hepcidine s’aggrave (Weiss 2019). Les sources lues ne détaillent pas le sens de chacun des autres régulateurs, et le cours ne le précise donc pas.</p><h3>Utilité clinique</h3><p>Elle est élevée dans l’anémie inflammatoire, basse en cas de carence associée, et pourrait prédire la réponse au fer oral. Elle n’est pas décisive seule (Weiss 2019). En 2011, aucun dosage n’était validé en routine (Celi 2011).</p></template>
<template data-pop="d63-ferroportine" data-title="Ferroportine : la porte de sortie du fer"><h3>Rôle normal</h3><p>La ferroportine exporte le fer hors des cellules : à la face basolatérale de l’entérocyte et dans les macrophages. Le fer exporté est réoxydé puis fixé à la transferrine (Celi 2011).</p><h3>Trois façons de la bloquer dans l’inflammation</h3><table class="t"><tr><th>Mécanisme</th><th>Source</th></tr><tr><td>Hepcidine : internalisation, dégradation, occlusion directe à forte concentration</td><td>Weiss 2019</td></tr><tr><td>Interféron γ et lipopolysaccharides : blocage de la transcription du gène</td><td>Weiss 2019</td></tr><tr><td>Facteur de nécrose tumorale : baisse de l’absorption duodénale, indépendante de l’hepcidine</td><td>Weiss 2019</td></tr></table><p>La conséquence est double : moins d’absorption et fer retenu dans les macrophages, qui sont pourtant la source de plus de 90 % du fer utilisé par la moelle.</p></template>
<template data-pop="d63-il6" data-title="Interleukine 6 : la cytokine qui relie inflammation et fer"><h3>Deux actions principales</h3><p>L’interleukine 6 est la cytokine inductrice principale de l’hepcidine, par la voie STAT3. Elle diminue aussi la production d’érythropoïétine, et la signalisation de l’érythropoïétine est inversement liée à l’interleukine 1 et à l’interleukine 6 (Weiss 2019).</p><div class="key"><b>Clinique.</b> Toute maladie qui élève l’interleukine 6 produit hypoferrémie et anémie par deux voies simultanées : fer séquestré et érythropoïétine émoussée.</div></template>
<template data-pop="d63-epo" data-title="Érythropoïétine : l’hormone du signal"><h3>Rôle normal</h3><p>L’érythropoïétine, produite par le rein, stimule la production des globules rouges. Dans l’inflammation, l’interleukine 1 et le TNF inhibent sa production rénale et l’interleukine 6 la diminue aussi (Weiss 2019).</p><h3>Pourquoi le nombre de récepteurs ne change pas</h3><p>Le nombre de récepteurs n’est pas réduit ; la signalisation est atténuée. Une carence en fer dans les précurseurs réduit en outre le récepteur, et la baisse du signal diminue l’érythroferrone, ce qui aggrave la restriction en fer par l’hepcidine (Weiss 2019).</p><p>Cette physiologie explique la place des agents stimulant l’érythropoïèse : ils compensent un signal émoussé. L’information professionnelle d’Eprex demande d’exclure ou de traiter la carence en fer avant de les débuter.</p></template>
<template data-pop="d63-ferritine" data-title="Ferritine : ce que permettent ses seuils"><h3>Seuils par contexte</h3><table class="t"><tr><th>Contexte</th><th>Ferritine</th><th>Lecture</th></tr><tr><td>Algorithme genevois 2011</td><td>Inférieure à 30 µg/l</td><td>Carence, avec ou sans inflammation</td></tr><tr><td>Algorithme genevois 2011</td><td>Supérieure à 30 µg/l sans inflammation ; supérieure à 100 µg/l avec inflammation</td><td>Réserves correctes</td></tr><tr><td>Algorithme genevois 2011</td><td>De 30 à 100 µg/l</td><td>Zone grise : protéine C réactive puis index</td></tr><tr><td>Consensus Delphi suisse 2019 (sans inflammation)</td><td>Inférieure à 30 µg/l ; 30 à 50 µg/l avec saturation inférieure à 20 %</td><td>Précise pour la carence sans anémie ; carence possible</td></tr><tr><td>KDIGO 2026 (maladie rénale chronique)</td><td>Inférieure à 45 µg/l</td><td>Carence sévère : chercher un saignement</td></tr><tr><td>ESC 2023 (insuffisance cardiaque)</td><td>Inférieure à 100 µg/l, ou saturation inférieure à 20 %</td><td>Carence martiale</td></tr></table><p>Pourquoi autant de seuils ? Parce que la ferritine est à la fois un reflet des réserves et une protéine dont la synthèse augmente avec l’inflammation (Celi 2011 ; Weiss 2019). Chaque contexte déplace la limite.</p><div class="trap"><span class="k">Erreur fréquente</span> Utiliser le seuil de 30 µg/l chez un malade inflammatoire : le seuil adapté est 100 µg/l.</div></template>
<template data-pop="d63-crp" data-title="Protéine C réactive : le seuil de 5 mg/l"><p>La protéine C réactive est le marqueur de l’inflammation active du bilan. Dans l’algorithme genevois, elle sert de pivot dans la zone grise de la ferritine : sous 5 mg/l, l’anémie est ferriprive ; au-dessus, le médecin calcule l’index du récepteur soluble (Celi 2011).</p><p>Sa fonction est de dire si la ferritine est fiable : sans inflammation, une ferritine basse reflète des réserves vides ; avec inflammation, elle peut être faussement rassurante.</p></template>
<template data-pop="d63-tsat" data-title="Saturation de la transferrine"><p>La saturation rapporte le fer sérique à la capacité totale de fixation de la transferrine. Elle est normalement de 20 à 40 % (Celi 2011), ou d’environ 33 % selon Nendaz et Samii (2011). Une valeur inférieure ou égale à 15 % oriente vers un manque de fer fonctionnel, mais avec une sensibilité médiocre (Celi 2011). Dans l’insuffisance cardiaque, la carence est définie par une saturation inférieure à 20 % (ESC 2023). Dans la maladie rénale chronique, KDIGO 2026 combine la saturation et la ferritine pour décider de donner ou d’interrompre le fer.</p></template>
<template data-pop="d63-fer-serique" data-title="Fer sérique : un dosage délicat"><p>Le fer sérique normal est de 8 à 33 µmol/l. Il baisse dans la carence et dans l’inflammation, ce qui le rend peu discriminant. L’hémolyse du prélèvement et les variations dans la journée le fausse (Nendaz et Samii 2011). La capacité totale de fixation de la transferrine, de 41 à 83 µmol/l, est augmentée dans la carence et basse à normale dans l’anémie inflammatoire.</p></template>
<template data-pop="d63-stfr" data-title="Récepteur soluble de la transferrine et index"><h3>Origine et sens</h3><p>Le récepteur soluble de la transferrine provient à 80 % de la lignée érythropoïétique et reflète les besoins en fer des précurseurs (Celi 2011).</p><h3>L’index</h3><table class="t"><tr><th>Index récepteur soluble / log ferritine</th><th>Lecture</th></tr><tr><td>Inférieur à 1</td><td>Anémie inflammatoire</td></tr><tr><td>Entre 1 et 2</td><td>Zone intermédiaire : contenu en hémoglobine du réticulocyte</td></tr><tr><td>Supérieur à 2</td><td>Carence associée</td></tr></table><div class="trap"><span class="k">Piège</span> Le récepteur soluble est influencé par l’inflammation (Weiss 2019), et sa disponibilité était hétérogène en Suisse romande en 2011.</div></template>
<template data-pop="d63-chr" data-title="Contenu en hémoglobine des réticulocytes et hypochromie"><p>Le réticulocyte vit un à deux jours, le globule rouge 120 jours. Le contenu en hémoglobine du réticulocyte reflète donc le fer disponible à l’instant, alors que le pourcentage d’hypochromes reflète les mois précédents (Celi 2011).</p><table class="t"><tr><th>Mesure</th><th>Seuil</th><th>Lecture</th></tr><tr><td>Contenu du réticulocyte</td><td>Inférieur à 29 pg</td><td>Carence vraie</td></tr><tr><td>Contenu du réticulocyte</td><td>Supérieur à 29 pg</td><td>Carence fonctionnelle ou anémie inflammatoire</td></tr><tr><td>Globule rouge hypochrome</td><td>Contenu inférieur à 26 pg (norme 26 à 34 pg) ; plus de 5 % d’hypochromes</td><td>État ferriprive fonctionnel</td></tr></table><p>Le contenu du réticulocyte suit la réponse au fer : la crise réticulocytaire survient vers le cinquième jour de traitement.</p></template>
<template data-pop="d63-reticulocytes" data-title="Réticulocytes : une anémie non régénérative"><p>Le réticulocyte est le globule rouge jeune sorti de la moelle. Leur nombre indique si la moelle répond à l’anémie. L’algorithme genevois définit l’anémie non régénérative par des réticulocytes inférieurs à 50 G/l (Celi 2011). Dans l’anémie inflammatoire, la moelle répond mal, car le fer manque, l’érythropoïétine est émoussée et les précurseurs sont inhibés.</p></template>
<template data-pop="d63-perls" data-title="Myélogramme et coloration de Perls"><p>La coloration de Perls révèle le fer des macrophages et des précurseurs sur un frottis de moelle. C’est le gold standard du contenu en fer médullaire. L’examen est invasif et de moins en moins utilisé (Celi 2011).</p></template>
<template data-pop="d63-exclusion" data-title="Bilan d’exclusion de la ligne directrice KDIGO 2026"><p>Le diagnostic d’anémie inflammatoire exige d’avoir écarté les autres causes. Le bilan proposé quand le bilan martial est non contributif comprend les examens suivants.</p><table class="t"><tr><th>Examen</th><th>Cause cherchée</th></tr><tr><td>Frottis</td><td>Morphologie, microcytose, syndrome myélodysplasique</td></tr><tr><td>Haptoglobine, déshydrogénase lactique</td><td>Hémolyse</td></tr><tr><td>Vitamine B12, folates</td><td>Carences vitaminiques</td></tr><tr><td>Tests hépatiques</td><td>Atteinte hépatique</td></tr><tr><td>Protéine monoclonale, chaînes légères libres, protéinurie de Bence-Jones</td><td>Gammapathie</td></tr><tr><td>TSH, parathormone</td><td>Atteinte thyroïdienne, parathyroïdienne</td></tr><tr><td>Parasites</td><td>Cause infectieuse</td></tr></table></template>
<template data-pop="d63-algorithme" data-title="Algorithme de décision genevois (2011)"><h3>Trois paliers</h3><ol><li><b>Ferritine.</b> Inférieure à 30 µg/l : carence. Supérieure à 30 µg/l sans inflammation ou supérieure à 100 µg/l avec inflammation : autre étiologie. De 30 à 100 µg/l : zone grise.</li><li><b>Protéine C réactive.</b> Dans la zone grise, inférieure à 5 mg/l : anémie ferriprive.</li><li><b>Index puis contenu du réticulocyte.</b> Index inférieur à 1 : inflammatoire ; supérieur à 2 : carence associée ; entre 1 et 2, contenu inférieur à 29 pg : carence vraie, supérieur : fonctionnelle ou inflammatoire.</li></ol><p>L’algorithme provient de la Revue Médicale Suisse 2011 (Hôpitaux universitaires de Genève). Il date de quinze ans : son esprit reste valable, mais les laboratoires romands ne proposaient pas tous l’index et le contenu du réticulocyte à l’époque.</p><div class="trap"><span class="k">Piège</span> L’algorithme est un outil d’orientation, non un critère diagnostique officiel de classification.</div></template>
<template data-pop="d63-mnemo" data-title="Moyen mnémotechnique : l’ordre des examens de la zone grise"><p><b>Aide pédagogique, non critère officiel.</b></p><p>Pour retenir l’ordre de l’algorithme dans la zone grise, on peut retenir quatre lettres : F, C, I, R. F comme ferritine, C comme protéine C réactive, I comme index, R comme réticulocyte. Chaque lettre ouvre l’examen suivant seulement si la précédente laisse le doute.</p></template>
