<template data-pop="d63-mici" data-title="MICI : inflammation, pertes et absorption"><p>Une maladie inflammatoire chronique intestinale peut associer inflammation, saignement, malabsorption et déficits nutritionnels. Un mécanisme mixte est fréquent dans ce contexte ; une ferritine intermédiaire ne doit pas être interprétée avec les seuls repères d’un adulte sans inflammation.</p><p><button class="w" data-k="d63-sources-guides">ECCO</button> recommande le fer IV en première intention notamment si la maladie est active, si le fer oral est mal toléré ou si un <button class="w" data-k="d63-esa">ESA</button> est nécessaire. Le fer oral peut convenir à une anémie légère avec maladie inactive. Le traitement de la maladie et la surveillance des récidives restent essentiels. Une proposition d’<button class="w" data-k="d63-esa">ESA</button> dans une recommandation <button class="w" data-k="d63-mici">MICI</button> n’étend pas automatiquement la fiche suisse Eprex.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a>.</p></div></template>
<template data-pop="d63-esa" data-title="ESA : agents stimulant l’érythropoïèse"><p>Les <button class="w" data-k="d63-esa">ESA</button> stimulent la production de globules rouges ; l’époétine alfa en fait partie. Une production efficace requiert un fer disponible et une moelle capable de répondre. Leur délai d’action exclut de les considérer comme une correction immédiate d’une anémie menaçante.</p><p>Le choix et la dose dépendent de l’indication et du produit. En <button class="w" data-k="d63-mrc">MRC</button>, <button class="w" data-k="d63-sources-guides">KDIGO</button> recommande une cible d’<button class="w" data-k="d63-hb">Hb</button> inférieure à 11,5 g/dL chez l’adulte. Les risques d’hypertension et de thrombose, les contre-indications et la vitesse d’augmentation d’<button class="w" data-k="d63-hb">Hb</button> modifient le suivi. Une hyporéponse impose de rechercher les causes avant d’augmenter la dose.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a>.</p></div></template>
<template data-pop="d63-il6-stat3" data-title="IL-6–STAT3 : une voie de signalisation inflammatoire"><p>L’interleukine 6 transmet un signal inflammatoire qui peut activer la voie <button class="w" data-k="d63-il6-stat3">STAT3</button> et augmenter la production d’hepcidine. L’export du fer diminue alors, contribuant à une restriction de sa disponibilité pour l’érythropoïèse.</p><p>Cette voie explique une partie du mécanisme, sans rendre les autres mécanismes inutiles. Elle ne constitue ni un test diagnostique de D63 ni une indication universelle d’un traitement ciblant l’<button class="w" data-k="d63-il6-stat3">IL-6</button>. La maladie causale, les données cliniques et les preuves propres au traitement déterminent la conduite.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="d63-hypophosphate" data-title="Hypophosphatémie après carboxymaltose ferrique"><p>Une baisse de phosphate peut survenir après Ferinject. Lorsqu’elle persiste ou se répète, elle peut s’associer à faiblesse, douleurs, ostéomalacie et fractures. Une fatigue après traitement n’est donc pas automatiquement une preuve de carence persistante en fer.</p><p>La fiche demande une attention particulière en cas de facteurs de risque : déficit en vitamine D, malabsorption, hyperparathyroïdie secondaire, <button class="w" data-k="d63-mici">MICI</button>, ostéoporose ou administrations répétées. Contrôler le phosphate lorsque le risque le justifie et réévaluer le traitement si l’hypophosphatémie persiste. Le bénéfice sur l’<button class="w" data-k="d63-hb">Hb</button> n’efface pas cet effet indésirable.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="d63-transfusion" data-title="Transfusion : indication, volume et réévaluation"><p>Chez un adulte stable sans saignement actif, une stratégie restrictive et la réévaluation après une unité peuvent limiter une exposition inutile. Les repères suisses sont 70 g/L sans maladie cardiovasculaire et 80 g/L avec maladie cardiovasculaire préexistante stable. Ils ne s’appliquent pas mécaniquement à une hémorragie majeure ou un syndrome coronarien aigu.</p><p>La tolérance, la chronologie, les comorbidités et les préférences participent à la décision. Transfuser améliore rapidement la quantité d’hématies, sans traiter la cause de l’anémie. Compatibilité, identification et surveillance des réactions restent indispensables ; la procédure institutionnelle s’applique.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng24/chapter/Red-blood-cell-transfusion" target="_blank" rel="noopener">[S407] Blood transfusion — red blood cell transfusion</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></template>
<template data-pop="d63-calcul-fer" data-title="Calcul du fer : vérifier les unités et les limites"><p>Ganzoni dans la fiche Ferinject : poids en kg × différence d’<button class="w" data-k="d63-hb">Hb</button> en g/dL × 2,4 + réserves en mg. Exemple fictif de 70 kg, <button class="w" data-k="d63-hb">Hb</button> 9 g/dL et cible de calcul 15 g/dL avec 500 mg de réserves : 1 508 mg avant l’arrondi prévu. Avec le tableau simplifié, la même situation donne 2 000 mg ; la méthode doit être annoncée.</p><p>La quantité totale n’est pas la dose unique. Appliquer ensuite les maxima pondéraux, absolus, hebdomadaires et ceux de l’hémodialyse. Une unité mal saisie peut produire un résultat numériquement précis mais cliniquement dangereux. Faire contrôler le calcul et le produit avant administration.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="d63-who" data-title="OMS 2024 : définition de l’anémie et populations"><p>Chez les adultes de 15 à 65 ans, les seuils retenus sont une <button class="w" data-k="d63-hb">Hb</button> inférieure à 120 g/L chez la femme non enceinte et à 130 g/L chez l’homme. En grossesse, les seuils sont 110 g/L aux premier et troisième trimestres et 105 g/L au deuxième. Pour les enfants, les seuils changent avec l’âge.</p><p>Le seuil de 6 à 23 mois est 105 g/L dans la recommandation 2024, distinct du seuil ancien de 110 g/L couvrant une tranche plus large. Le tableau ne fournit pas une norme pour les moins de six mois ou tous les plus de 65 ans. Ces seuils définissent une anémie ; ils ne constituent pas des seuils universels de transfusion ou d’<button class="w" data-k="d63-esa">ESA</button>.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a>.</p></div></template>
<template data-pop="d63-cim" data-title="D63* : code de manifestation, pas diagnostic automatique"><p>Dans la CIM-10-GM 2024 utilisée par l’OFS, <button class="w" data-k="d63-cim">D63.0</button>* concerne l’anémie au cours de maladies tumorales et <button class="w" data-k="d63-cim">D63.8</button>* l’anémie au cours d’autres maladies chroniques classées ailleurs. L’astérisque signale un code de manifestation associé à la maladie causale selon les règles applicables.</p><p>Le code américain <button class="w" data-k="d63-cim">D63.1</button> ne doit pas être importé dans cette classification. La CIM-10-GM inclut certaines situations rénales dans <button class="w" data-k="d63-cim">D63.8</button>*. Le codage vient après l’analyse clinique et documentaire ; une maladie chronique connue ne suffit pas à prouver que l’anémie lui est attribuable.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S415] CIM-10-GM 2024, libellés français officiels</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">[S414] ICD-10-GM 2024, D60–D64</a>.</p></div></template>
<template data-pop="d63-profiles" data-title="PROFILES et examen suisse : partir d’une situation clinique"><p>Le référentiel <button class="w" data-k="d63-profiles">PROFILES</button> 2017 inclut notamment fatigue (SSP 4), dyspnée (46), pâleur (147), anémie (165) et dyspnée aiguë (206). Ces situations demandent d’organiser l’évaluation, la sécurité, le différentiel et la prise en charge à partir d’une présentation, sans deviner d’emblée une cause unique.</p><p>Les exigences <button class="w" data-k="d63-profiles">MEBEKO</button> de l’examen 2026 consultées renvoient à ce référentiel. La transition annoncée pour le nouveau <button class="w" data-k="d63-profiles">PROFILES</button> ne doit pas être antidatée : déploiement pédagogique 2025/26 et examen 2028 sont distingués. La liste conservatoire de la plateforme n’est pas une liste fédérale de maladies à cocher.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S422] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S423] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S424] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></div></template>
<template data-pop="d63-sources-guides" data-title="Sources : dates, populations et limites de lecture"><p>La hiérarchie pratique part des sources suisses disponibles : medix, consensus suisse, smarter medicine, OFS et informations professionnelles. <button class="w" data-k="d63-sources-guides">KDIGO</button> 2026 précise l’anémie rénale ; <button class="w" data-k="d63-sources-guides">ECCO</button> 2024 concerne la <button class="w" data-k="d63-mici">MICI</button> ; <button class="w" data-k="d63-sources-guides">ESMO</button> 2018 l’oncologie. Les paragraphes de ces textes ont été consultés pour les questions indiquées, sans prétendre avoir lu chaque page de tous les documents.</p><p>La revue mécanistique de Weiss 2019 et les descriptions de physiologie normale complètent ce cadre. Les données anciennes ou les divergences de seuil sont signalées. L’image macroscopique OpenStax 2016 et le frottis humain sous licence ouverte restent des images normales, sans diagnostic inventé. Les auto-relectures et tests techniques ne constituent pas une validation médicale humaine indépendante.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S419] File:2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S420] Human blood smear — Кров людини</a>.</p></div></template>
<template data-pop="pareto-d63-cours" data-title="Monographie : les décisions qui organisent le raisonnement"><ul><li>Confirmer l’anémie et sa dynamique sans confondre seuil diagnostique et seuil transfusionnel.</li><li>Décrire la tolérance, rechercher pertes et causes associées.</li><li>Interpréter ferritine et <button class="w" data-k="d63-tsat">TSAT</button> avec l’inflammation et la population.</li><li>Traiter la maladie causale et une carence documentée ; respecter les contre-indications du produit.</li><li>Organiser le suivi et réévaluer une réponse insuffisante.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></template>
<template data-pop="pareto-d63-examens" data-title="Examens : une question par mesure"><ul><li><button class="w" data-k="d63-hb">Hb</button> et <button class="w" data-k="d63-vgm">VGM</button> décrivent le sang ; les réticulocytes interrogent la production.</li><li>Ferritine et <button class="w" data-k="d63-tsat">TSAT</button> ne mesurent pas le même compartiment.</li><li><button class="w" data-k="d63-crp">CRP</button>, fonction rénale et bilan orienté contextualisent les résultats.</li><li>Un <button class="w" data-k="d63-vgm">VGM</button> normal n’exclut pas des déficits associés.</li><li>Réserver les examens spécialisés à une question qui change la conduite.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></template>
<template data-pop="pareto-d63-pharma" data-title="Pharmacologie : produit précis et suivi réel"><ul><li>Fer oral : vérifier indication, âge, poids, contre-indications et interactions.</li><li>Ferinject : besoin total, maximum par séance et cumul hebdomadaire se calculent séparément.</li><li>Eprex : indication et restrictions suisses avant cible ou dose.</li><li>Sous <button class="w" data-k="d63-esa">ESA</button>, ne pas viser la normalisation d’<button class="w" data-k="d63-hb">Hb</button> en <button class="w" data-k="d63-mrc">MRC</button>.</li><li>Prévoir surveillance et conduite devant réaction, hypophosphatémie ou hyporéponse.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S410] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680490788041" target="_blank" rel="noopener">[S409] Information professionnelle suisse Eprex</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></template>
<template data-pop="pareto-d63-semio" data-title="Sémiologie : relier signe, mécanisme et décision"><ul><li>Une saturation normale ne mesure pas la quantité d’<button class="w" data-k="d63-hb">Hb</button>.</li><li>La chronologie distingue une production insuffisante d’un événement aigu possible.</li><li>La ferritine ne se lit pas sans contexte inflammatoire.</li><li>Douleur thoracique, dyspnée de repos ou instabilité imposent une évaluation urgente.</li><li>Une étiquette chronique ne clôt pas le diagnostic différentiel.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a>.</p></div></template>
<template data-pop="pareto-d63-anat" data-title="Anatomie : plusieurs compartiments, une même Hb"><ul><li>Moelle : production ; rein : stimulation ; intestin : absorption.</li><li>Macrophages : recyclage ; foie : stockage et signal hepcidine.</li><li>Une mesure sanguine ne décrit pas directement toutes les réserves.</li><li>L’image originale situe un tissu normal, sans diagnostiquer D63.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S417] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></template>
<template data-pop="pareto-d63-histo" data-title="Histologie : observer sans surinterpréter"><ul><li>Le <button class="w" data-k="d63-vgm">VGM</button> est une moyenne de tailles.</li><li>Le frottis normal illustre des hématies, sans dosage du fer.</li><li>Réticulocytes et <button class="w" data-k="d63-chr">CHr</button> répondent à des questions distinctes.</li><li>Méthode et population accompagnent chaque seuil.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></template>
<template data-pop="pareto-d63-physio" data-title="Physiologie : le temps et la réserve comptent"><ul><li>Production, survie et pertes déterminent la masse érythrocytaire.</li><li>Saturation et quantité d’<button class="w" data-k="d63-hb">Hb</button> sont complémentaires.</li><li>Fer et <button class="w" data-k="d63-esa">ESA</button> ont un délai ; une transfusion ne traite pas la cause.</li><li>Un pronostic associé à une <button class="w" data-k="d63-hb">Hb</button> basse ne prouve pas le bénéfice d’une cible élevée.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S416] Top5 médecine interne hospitalière : transfusion</a>.</p></div></template>
<template data-pop="pareto-d63-bio" data-title="Biochimie : stock, transport, disponibilité"><ul><li>Ferritine : indicateur de réserve et de phase aiguë.</li><li><button class="w" data-k="d63-tsat">TSAT</button> : proportion de transport occupée.</li><li>Hepcidine–ferroportine : régulation de l’export cellulaire.</li><li>Ganzoni : <button class="w" data-k="d63-hb">Hb</button> en g/dL, pas en g/L avec le même coefficient.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S408] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="pareto-d63-gen" data-title="Génétique : une régulation n’est pas une mutation"><ul><li>L’inflammation modifie des programmes d’expression.</li><li>Une cause constitutionnelle exige une question spécifique.</li><li>Le mécanisme HIF ne prouve pas l’autorisation d’un produit.</li><li>Le test et le traitement doivent conserver leur portée et leurs limites.</li></ul><p>Cette synthèse renvoie aux explications détaillées du cours ; elle ne remplace pas l’évaluation d’une situation réelle.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></template>
