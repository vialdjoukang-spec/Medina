<template data-pop="d63-d-fer-oral" data-title="Fer oral : monographie dans l’anémie inflammatoire"><h3>Place</h3><p>Le fer oral est préféré lorsqu’une vraie carence s’associe à une inflammation légère (Weiss 2019).</p><h3>Posologie et justification</h3><p>Au moins 50 mg de fer ferreux, en une prise le matin. Des prises multiples élèvent l’hepcidine et diminuent l’absorption. Passage à la voie intraveineuse en l’absence de réponse après deux semaines (Weiss 2019).</p><h3>Interactions</h3><table class="t"><tr><th>Facteur</th><th>Effet sur l’absorption</th></tr><tr><td>Vitamine C, jeûne</td><td>Favorise</td></tr><tr><td>Inhibiteurs de la pompe à protons, lait, thé</td><td>Réduit</td></tr></table><h3>Surveillance</h3><p>Réticulocytose dans la semaine, hausse d’hémoglobine en deux à trois semaines, poursuite plusieurs mois pour reconstituer les réserves. Causes d’échec : inobservance, pertes persistantes, malabsorption par gastrite ou hypochlorhydrie (Nendaz et Samii 2011).</p><p>Les contre-indications et effets indésirables chiffrés du fer oral n’ont pas été lus dans les sources du cours.</p></template>
<template data-pop="d63-d-ferinject" data-title="Ferinject® (carboxymaltose ferrique) : information professionnelle suisse"><p>Version lue : juin 2025 (Swissmedic, Vifor). Les rubriques de mécanisme et de pharmacocinétique n’ont pas été relues pour ce cours.</p><table class="t"><tr><th>Rubrique</th><th>Contenu</th></tr><tr><td>Indication</td><td>Carence martiale de l’adulte quand le fer oral est insuffisant, inefficace ou impossible, y compris dans les maladies inflammatoires de l’intestin, après diagnostic confirmé (ferritinémie, saturation, hémoglobine, hématocrite, globules rouges, volume globulaire moyen, teneur corpusculaire moyenne en hémoglobine)</td></tr><tr><td>Posologie</td><td>Besoin calculé par la formule de Ganzoni ; dose unique maximale de 15 mg/kg en injection ou de 20 mg/kg en perfusion, sans dépasser 1000 mg ; au maximum 1000 mg par semaine</td></tr><tr><td>Surveillance</td><td>Au moins 30 minutes après l’administration, en raison du risque d’hypersensibilité</td></tr><tr><td>Mises en garde</td><td>Hypophosphatémie et ostéomalacie hypophosphatémique possibles ; prudence en cas d’infection aiguë ou chronique ; interrompre en cas de bactériémie</td></tr><tr><td>Contre-indication</td><td>Premier trimestre de la grossesse</td></tr></table><div class="trap"><span class="k">Piège</span> Utiliser le carboxymaltose pour une anémie inflammatoire sans carence confirmée : l’indication exige un diagnostic de carence martiale établi.</div></template>
<template data-pop="d63-ganzoni" data-title="Formule de Ganzoni : calculer le besoin en fer"><p>L’information professionnelle de Ferinject calcule le besoin total en fer avec la formule de Ganzoni. Elle utilise une hémoglobine cible standard de 15 g/dl (150 g/l) et le poids idéal en cas de surpoids. La formule elle-même, avec ses coefficients, doit être lue dans l’information professionnelle ; le dossier de recherche du cours ne la reproduit pas.</p><div class="trap"><span class="k">Piège</span> Le besoin calculé est découpé en doses respectant les maxima par administration et par semaine.</div></template>
<template data-pop="d63-d-eprex" data-title="Eprex® (époétine alfa) : information professionnelle suisse"><p>Version lue : août 2021 (Swissmedic, Janssen).</p><table class="t"><tr><th>Rubrique</th><th>Contenu</th></tr><tr><td>Indications</td><td>Anémie symptomatique de la maladie rénale chronique avancée ; adulte cancéreux avec hémoglobine inférieure à 105 g/l et chimiothérapie prévue d’au moins deux mois ; préparation orthopédique (hémoglobine de 100 à 130 g/l, perte prévue de 900 à 1800 ml) ; don autologue</td></tr><tr><td>Cible</td><td>100 à 120 g/l, à ne pas dépasser ; hausse limitée à 10 g/l en deux semaines et à 20 g/l par mois ; au-delà de 130 g/l dans la maladie rénale chronique, risque cardiovasculaire accru</td></tr><tr><td>Cancer</td><td>Poursuite jusqu’à un mois après la chimiothérapie ; pas en traitement à visée curative ; risque de croissance tumorale ; délai de réponse de deux à trois semaines</td></tr><tr><td>Avant de débuter</td><td>Exclure ou traiter carences en vitamine B12, folates et fer, infection, inflammation, hémorragie, hémolyse, fibrose médullaire, intoxication aluminique ; fer oral de 200 à 300 mg par jour dans les cas prévus</td></tr><tr><td>Contre-indications</td><td>Aplasie érythroblastique pure sous érythropoïétine, hypertension non contrôlée, antécédents thromboemboliques, prophylaxie antithrombotique périopératoire impossible</td></tr><tr><td>Effets indésirables</td><td>Hypertension dose-dépendante pouvant donner des crises avec encéphalopathie ; thromboembolies ; aplasie érythroblastique pure très rare ; thromboses de shunt</td></tr></table><p>Les doses cumulées élevées sont associées à une mortalité accrue et à des événements cardiovasculaires et cérébrovasculaires. La posologie initiale n’est pas reproduite par ce cours.</p></template>
<template data-pop="d63-hif-phi" data-title="Inhibiteurs de la prolyl-hydroxylase du facteur inductible par l’hypoxie"><p>La ligne directrice KDIGO 2026 les présente comme une alternative aux agents stimulant l’érythropoïèse dans la maladie rénale chronique : préférence pour une voie orale ou intolérance aux agents. Ils ne sont pas à employer en cas de cancer actif ou d’événement thrombotique récent, et leur emploi s’arrête après trois à quatre mois sans réponse (KDIGO 2026).</p><p>La recherche menée dans l’AIPS le 14.10.2026 n’a retrouvé ni roxadustat ni daprodustat. L’absence de résultat ne vaut pas preuve formelle de non-autorisation : la disponibilité suisse est à vérifier dans la source officielle avant toute application.</p></template>
<template data-pop="pareto-d63-def" data-title="Pareto — Définition, nosologie et épidémiologie"><p class="ratio" data-cover="d63-1,d63-2"></p><ul><li>D63 est un code astérisque, toujours associé au code croix de la maladie causale ; D63.0* pour les néoplasies, D63.8* pour les autres maladies chroniques, dont la maladie rénale chronique de stade 3 et plus ; D63.1 n’existe pas en CIM-10-GM 2024.</li><li>Anémie : hémoglobine inférieure à 130 g/l chez l’homme, à 120 g/l chez la femme (Genève 2011 : 140 g/l chez l’homme).</li><li>Anémie inflammatoire : diagnostic d’exclusion, deuxième anémie la plus fréquente.</li><li>Trois configurations : ferriprive, inflammatoire, mixte ; carence associée chez 20 à 85 % des patients.</li><li>Données suisses anciennes (1997, seconde main) ; aucune donnée récente.</li></ul></template>
<template data-pop="pareto-d63-meca" data-title="Pareto — Fer normal et mécanismes"><p class="ratio" data-cover="d63-3,d63-4"></p><ul><li>4 g de fer ; pas d’excrétion active ; 1 mg perdu et 1 mg absorbé par jour ; recyclage macrophagique de plus de 90 % des besoins.</li><li>Interleukine 6, voie STAT3, hepcidine, ferroportine dégradée : absorption diminuée et fer retenu dans les macrophages.</li><li>Autres : interféron γ et lipopolysaccharides bloquent la ferroportine ; TNF diminue l’absorption.</li><li>Érythropoïétine émoussée (interleukines 1 et 6, TNF) ; précurseurs inhibés ; globules rouges plus fragiles.</li><li>Terrains : maladie rénale chronique, obésité, sujet âgé.</li></ul></template>
<template data-pop="pareto-d63-clin" data-title="Pareto — Causes, anamnèse et examen"><p class="ratio" data-cover="d63-5,d63-6"></p><ul><li>Maladies causales : infections, auto-immunité, cancer, maladie rénale, insuffisance cardiaque.</li><li>Carence associée : saignements, régime, chirurgie bariatrique, anti-inflammatoires, prélèvements, dialyse.</li><li>Pas de sémiologie propre à l’anémie inflammatoire dans les sources lues.</li><li>Perlèches, glossite : carence en fer associée.</li></ul></template>
<template data-pop="pareto-d63-diag" data-title="Pareto — Diagnostic, gravité et fer"><p class="ratio" data-cover="d63-7,d63-8,d63-9"></p><ul><li>Bilan : hémogramme avec réticulocytes, ferritine, saturation, protéine C réactive.</li><li>Ferritine inférieure à 30 µg/l : carence ; supérieure à 100 µg/l avec inflammation : réserves correctes ; zone grise de 30 à 100 µg/l.</li><li>Zone grise : protéine C réactive 5 mg/l ; index inférieur à 1 ou supérieur à 2 ; contenu du réticulocyte 29 pg.</li><li>Exclure les autres causes (frottis, vitamine B12, folates, hémolyse, protéine monoclonale).</li><li>Transfusion réservée à l’anémie sévère instable ; aucun seuil chiffré dans les sources.</li><li>Fer oral : au moins 50 mg en une prise matinale ; voie intraveineuse après deux semaines d’échec.</li></ul></template>
<template data-pop="pareto-d63-trait" data-title="Pareto — Traitement et contextes"><p class="ratio" data-cover="d63-10,d63-11"></p><ul><li>Agents stimulant l’érythropoïèse : cible 100 à 120 g/l, jamais en traitement curatif du cancer, risque hypertensif et thrombotique.</li><li>Maladie rénale chronique : seuils de ferritine et de saturation de KDIGO ; ne pas maintenir 115 g/l ou plus ; fer interrompu au-dessus de 700 µg/l ou 40 %.</li><li>Insuffisance cardiaque : carence si saturation inférieure à 20 % ou ferritine inférieure à 100 µg/l ; fer intraveineux recommandé.</li><li>Cancer (ESMO 2018) et maladies inflammatoires de l’intestin (ECCO 2015) : sources non lues.</li></ul></template>
<template data-pop="pareto-d63-crit" data-title="Pareto — Suivi, populations et critères"><p class="ratio" data-cover="d63-12,d63-13,d63-14"></p><ul><li>Suivi : réticulocytes à une semaine, hémoglobine à deux à trois semaines sous fer oral ; bilan martial après trois à quatre semaines sous fer intraveineux.</li><li>Sous agent stimulant : hémoglobine, pression artérielle, plaquettes.</li><li>Critères : anémie, maladie chronique connue, profil martial inflammatoire, index, exclusion des autres causes.</li><li>Lacunes majeures : ESMO 2018, seuil transfusionnel, Société suisse d’hématologie, informations professionnelles non lues.</li></ul></template>
<template data-pop="pareto-d63-exam1" data-title="Pareto — Examens à connaître"><p class="ratio" data-cover="d63-e-1,d63-e-2"></p><ul><li>Base : hémogramme avec réticulocytes, ferritine, saturation (normale 20 à 40 %), protéine C réactive (5 mg/l).</li><li>Fer sérique 8 à 33 µmol/l ; capacité de fixation 41 à 83 µmol/l.</li><li>Récepteur soluble : 80 % d’origine érythropoïétique ; contenu du réticulocyte 29 pg ; hypochromes plus de 5 %.</li><li>Hepcidine non validée en routine ; myélogramme de Perls invasif.</li></ul></template>
<template data-pop="pareto-d63-exam2" data-title="Pareto — Configurations et exclusion"><p class="ratio" data-cover="d63-e-3,d63-e-4,d63-e-5"></p><ul><li>Zone grise : ferritine, protéine C réactive, index, contenu du réticulocyte.</li><li>Bilan d’exclusion de KDIGO 2026 si le bilan martial ne tranche pas.</li><li>Une ferritine en zone grise avec une protéine C réactive inférieure à 5 mg/l signe l’anémie ferriprive.</li></ul></template>
<template data-pop="pareto-d63-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="d63-s-physio-body"></p><ul><li>L’interleukine 6 augmente l’hepcidine ; elle supprime la ferroportine ; l’absorption et la sortie des macrophages diminuent.</li><li>Fer sérique bas avec réserves conservées : ferritine haute.</li><li>Une prise unique de fer oral vaut mieux que plusieurs.</li></ul></template>
<template data-pop="pareto-d63-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="d63-s-bioc-body"></p><ul><li>Transferrine ↓, ferritine ↑, hepcidine ↑ : triptyque de l’inflammation.</li><li>Ferroportine bloquée à plusieurs niveaux ; récepteur soluble normal dans l’anémie inflammatoire pure.</li></ul></template>
<template data-pop="pareto-d63-s-histo" data-title="Pareto — Hématologie cellulaire"><p class="ratio" data-cover="d63-s-histo-body"></p><ul><li>Quatre mécanismes : fer, érythropoïétine, précurseurs, durée de vie des globules.</li><li>Morphologie : légère à modérée, normochrome normocytaire, microcytaire dans la moitié des cas.</li></ul></template>
<template data-pop="pareto-d63-s-immuno" data-title="Pareto — Immunologie"><p class="ratio" data-cover="d63-s-immuno-body"></p><ul><li>Interleukine 6 : hepcidine ; interleukine 1 et TNF : érythropoïétine ; interféron γ : ferroportine et précurseurs.</li><li>L’anti-TNF améliore l’anémie des maladies inflammatoires de l’intestin.</li></ul></template>
<template data-pop="pareto-d63-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="d63-p-1,d63-p-2,d63-p-3,d63-p-4,d63-p-5"></p><ul><li>Quatre classes : traitement de la cause, fer, agents stimulant l’érythropoïèse, inhibiteurs de la prolyl-hydroxylase.</li><li>Carboxymaltose : 15 mg/kg en injection, 20 mg/kg en perfusion, maximum 1000 mg ; surveillance de 30 minutes.</li><li>Époétine : cible 100 à 120 g/l ; contre-indiquée en cas d’hypertension non contrôlée ou d’antécédents thromboemboliques.</li><li>À éviter : fer en prises multiples, époétine en traitement curatif, dépassement de la cible.</li></ul></template>
