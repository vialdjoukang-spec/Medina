<section class="ilot" id="d63-0"><h2><span class="n">0</span> Une fatigue, une inflammation, plusieurs mécanismes possibles</h2>
<p>Un homme de 67 ans, suivi pour une polyarthrite active, décrit une fatigue croissante depuis trois mois. Il prend régulièrement des anti-inflammatoires. Son hémoglobine vaut104 g/L, sa ferritine 85 µg/L et sa protéine C réactive42 mg/L. Cette vignette est fictive. Elle pose une question réelle : l’inflammation explique-t-elle toute l’anémie, ou masque-t-elle aussi une perte de fer ?</p>
<p>La ferritine 85 µg/L n’est pas automatiquement basse chez une personne sans inflammation. Mais la <button class="w" data-k="d63-ferritine">ferritine augmente pendant la réponse inflammatoire</button>. Une valeur apparemment conservée peut alors coexister avec un manque de fer utilisable, voire avec des réserves diminuées. La prise d’anti-inflammatoires invite notamment à rechercher une perte digestive, sans prouver qu’elle existe.</p>
<p>La première décision porte sur la tolérance : douleur thoracique, dyspnée de repos, malaise, saignement ou dégradation rapide changent l’urgence. Chez une personne stable, le médecin étudie ensuite la production médullaire, l’état du fer et les mécanismes associés. Il ne prescrit pas du fer ni une hormone érythropoïétique sur le seul mot « chronique ».</p>
<p>Le raisonnement rejoint les situations de départ <button class="w" data-k="d63-profiles">PROFILES</button> 2017 : fatigue SSP 4, dyspnée SSP 46, pâleur SSP 147 et anémie SSP 165 ; la dyspnée aiguë sévère relève de SSP 206. Ces correspondances guident l’apprentissage et ne prédisent pas une question d’examen. Le cadre fédéral 2026 demeure distinct de la transition vers <button class="w" data-k="d63-profiles">PROFILES</button> 2 et l’examen 2028.</p>
<div class="key"><b>À retenir.</b> Une maladie inflammatoire rend l’anémie plausible ; elle ne dispense jamais d’en chercher les autres composantes. La stabilité clinique détermine le rythme de cette recherche.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S401] Carence en fer — mediX</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S422] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S423] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S424] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></div></section>
<section class="ilot" id="d63-1"><h2><span class="n">1</span> Définir l’anémie et séparer ses mécanismes</h2>
<p>Une anémie est une baisse de concentration d’hémoglobine par rapport au seuil applicable à la personne. Elle ne désigne ni une maladie unique, ni automatiquement une carence en fer. Dans une maladie chronique, l’inflammation peut réduire l’apport de fer à la moelle, freiner sa stimulation et raccourcir la survie des hématies. Le rein, le cancer, leurs traitements ou des pertes ajoutent souvent d’autres mécanismes.</p>
<p>Les seuils OMS 2024 sont des repères diagnostiques définis par population. Ils ne sont ni une cible à atteindre sous époétine, ni un ordre de transfuser. Chez l’adulte, le tableau OMS porte précisément sur 15–65 ans ; chez une personne plus âgée, les références du laboratoire, la situation clinique et les recommandations de sa maladie restent nécessaires.</p>
<table class="t"><thead><tr><th>Population OMS 2024</th><th>Anémie si hémoglobine inférieure à</th></tr></thead><tbody><tr><td>Femme non enceinte,15–65 ans</td><td>120 g/L</td></tr><tr><td>Homme,15–65 ans</td><td>130 g/L</td></tr><tr><td>Grossesse, premier / deuxième / troisième trimestre</td><td>110 /105 /110 g/L</td></tr><tr><td>Enfant 6–23 mois /24–59 mois</td><td>105 /110 g/L</td></tr><tr><td>Enfant 5–11 ans /12–14 ans</td><td>115 /120 g/L</td></tr></tbody></table>
<p>Une hémoglobine de 108 g/L n’a donc pas la même interprétation chez une femme non enceinte et au deuxième trimestre. Chez l’adulte 15–65 ans, l’OMS classe l’anémie comme sévère sous 80 g/L ; cette catégorie ne remplace pas l’évaluation de la vitesse de baisse, des symptômes ou du terrain cardiovasculaire. Le tableau ne fournit pas ici une norme pour le nourrisson de moins de six mois ou une norme spécifique après 65 ans.</p>
<h3>Trois questions sur le fer</h3>
<p>La <button class="w" data-k="d63-carence-absolue">carence absolue</button> signifie que les réserves sont insuffisantes. La <button class="w" data-k="d63-restriction">restriction du fer disponible</button> signifie que l’apport aux précurseurs érythroïdes est insuffisant ; elle peut persister malgré des réserves. Une forme mixte associe ces deux problèmes. L’expression « carence fonctionnelle » a été employée avec des sens variables ; les recommandations rénales 2026 privilégient une description qui précise disponibilité et réserves.</p>
<p>L’anémie rénale comporte souvent une stimulation érythropoïétique inadaptée, une inflammation, des pertes ou une carence. L’anémie du cancer peut associer inflammation, toxicité médullaire, saignement, infiltration et déficits nutritionnels. Aucun stade unique ne résume toutes ces situations. Le codage D63 sera précisé après la conclusion clinique.</p>
<div class="key"><b>À retenir.</b> Le diagnostic décrit l’anémie et son mécanisme probable. Les indices globulaires, les réticulocytes et le bilan martial préciseront ensuite ce que le seul taux d’hémoglobine ne peut pas expliquer.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S412] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://academic.oup.com/annonc/article/29/Supplement_4/iv96/4866368" target="_blank" rel="noopener">[S406] Management of anaemia and iron deficiency in patients with cancer</a>.</p></div></section>
<section class="ilot" id="d63-2"><h2><span class="n">2</span> Fréquence, terrain et portée des chiffres</h2>
<p>L’anémie inflammatoire est fréquente chez les personnes hospitalisées ou atteintes de maladies chroniques. La revue de 2019 la décrit comme la deuxième grande forme d’anémie après la carence en fer. Elle rapporte des proportions mondiales et des cohortes très hétérogènes ; ces données ne constituent pas une incidence nationale suisse de D63.</p>
<p>La coexistence d’une carence absolue est particulièrement importante pour la décision. Dans les populations assemblées par cette revue, la proportion varie de 20à85 %. Cette amplitude reflète des maladies, des définitions et des contextes différents. Elle n’autorise pas à annoncer à un patient une probabilité individuelle située arbitrairement au milieu de l’intervalle.</p>
<p>Les documents suisses consultés apportent surtout des repères diagnostiques et des avis de traitement. Ils n’établissent pas une incidence contemporaine de D63, ni sa distribution nationale par âge et sexe. Les anciennes proportions suisses reprises dans le socle provenaient d’une série de 1997 citée de seconde main en 2011. Elles ne servent pas ici de fréquence actuelle.</p>
<p>Le terrain oriente l’enquête. Une maladie rénale avancée augmente la probabilité d’une composante rénale. Une maladie intestinale active peut associer inflammation, pertes et malabsorption. Les traitements anticancéreux peuvent modifier la production médullaire. Chez une personne âgée, plusieurs mécanismes peuvent s’ajouter ; qualifier l’anémie de conséquence normale du vieillissement risquerait de retarder une cause traitable.</p>
<p>Le pronostic dépend largement de la maladie sous-jacente et des mécanismes associés. En <button class="w" data-k="d63-mrc">MRC</button>, l’anémie est associée à des événements cardiovasculaires, une baisse de qualité de vie et une mortalité plus élevée. Pourtant, relever l’hémoglobine vers une valeur normale avec un <button class="w" data-k="d63-esa">ESA</button> ne corrige pas nécessairement ces issues et peut augmenter les risques. Une association statistique ne prouve donc pas qu’une normalisation médicamenteuse soit bénéfique.</p>
<div class="key"><b>À retenir.</b> La fréquence justifie de chercher l’anémie et ses causes associées. Elle ne remplace ni le diagnostic individuel, ni une analyse du bénéfice et du risque du traitement.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2646/4202/12753" target="_blank" rel="noopener">[S402] Swiss Delphi study on iron deficiency</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a> ; <a data-reference-source="1" href="https://www.darmzentrum-bern.ch/fileadmin/darmzentrum/Education/Bible_Class/2025/IBD_EIM/2024_ECCO_EIM.pdf" target="_blank" rel="noopener">[S405] ECCO Guidelines on Extraintestinal Manifestations in Inflammatory Bowel Disease</a>.</p></div></section>
<section class="ilot" id="d63-3"><h2><span class="n">3</span> Le fonctionnement normal : produire, transporter et recycler</h2>
<p>La moelle rouge produit les cellules sanguines à partir de précurseurs qui prolifèrent puis se différencient. La maturation érythroïde permet l’accumulation d’hémoglobine ; les réticulocytes rejoignent ensuite le sang avant de devenir des hématies matures. Le <button class="w" data-k="d63-reticulocytes">nombre de réticulocytes</button> donne ainsi une information récente sur la production, différente de la concentration d’hémoglobine déjà circulante.</p>
<p>La photographie suivante situe le tissu médullaire dans une pièce osseuse. Ses repères sont macroscopiques ; ils ne montrent ni un dosage du fer ni une maladie particulière.</p>
<figure id="d63-figure-moelle-clinique" data-origin="human-original"><img src="assets/img/d63/alpha/codex/normal-marrow-openstax2016.jpg" alt="Coupe osseuse originale montrant tissu spongieux et moelle rouge" loading="lazy"><figcaption><b>Le compartiment où se fabrique le sang.</b> <b>Repère 1, centre rouge :</b> tissu médullaire entre les travées. <b>Repère 2, travées claires :</b> architecture spongieuse qui délimite les espaces. <b>Repère 3, bord périphérique :</b> limite osseuse de la pièce. <b>Repère 4, barre blanche supérieure :</b> barre conservée, sans mesure calculée car sa valeur manque dans ce fichier. Cette coupe macroscopique ne montre pas une lignée cellulaire, ne mesure pas le fer et ne diagnostique pas une anémie inflammatoire. Original : OpenStax, édition 8.25 du 18mai 2016, <a href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Pixels intacts ; annotations françaises de lecture ajoutées à la légende.</figcaption></figure>
<p>Le fer intervient notamment dans l’hème de l’hémoglobine. La transferrine transporte le fer dans le plasma vers les cellules qui en ont besoin. La ferritine participe au stockage cellulaire. Ces protéines ont donc des fonctions différentes : mesurer la ferritine sérique ne revient pas à mesurer directement le fer livré à chaque précurseur médullaire.</p>
<p>La majeure partie du fer nécessaire chaque jour à la production érythrocytaire provient du recyclage des anciennes hématies. La revue 2019 estime que ce recyclage fournit plus de 90 % du besoin quotidien de l’érythropoïèse. L’absorption intestinale compense notamment les pertes. Cette organisation explique qu’un blocage macrophagique puisse perturber la production même lorsque les apports alimentaires ne paraissent pas particulièrement faibles.</p>
<p>La <button class="w" data-k="d63-ferroportine">ferroportine</button> permet l’export du fer depuis certaines cellules, dont les entérocytes et les macrophages. L’<button class="w" data-k="d63-hepcidine">hepcidine</button> hépatique règle cet export. La stimulation érythropoïétique aide normalement à adapter la production sanguine aux besoins ; l’érythropoïétine et les signaux des précurseurs interagissent avec la régulation du fer.</p>
<div class="key"><b>À retenir.</b> La production dépend à la fois d’un tissu médullaire fonctionnel, d’une stimulation adaptée et de matériaux disponibles. Une réserve conservée ne garantit pas leur livraison à la moelle.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S417] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S418] 18.3 Erythrocytes  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S419] File:2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a>.</p></div></section>
<section class="ilot" id="d63-4"><h2><span class="n">4</span> De l’inflammation à la baisse d’hémoglobine</h2>
<p>L’inflammation active des voies immunitaires qui modifient la distribution du fer. L’interleukine6 stimule notamment la production hépatique d’hepcidine, avec participation de la voie <button class="w" data-k="d63-il6-stat3">STAT3</button>. L’hepcidine se lie à la ferroportine ; son internalisation et sa dégradation réduisent l’export. À certaines concentrations, une inhibition directe de l’export participe aussi au mécanisme décrit dans la revue.</p>
<p>Le fer reste alors davantage dans les macrophages et l’absorption intestinale contribue moins à son passage vers le plasma. La ferritine peut augmenter, tandis que le fer circulant et sa disponibilité pour la moelle diminuent. La transferrine est aussi influencée par l’inflammation. Les concentrations mesurées ne se lisent donc pas comme chez une personne sans réaction inflammatoire.</p>
<figure id="d63-chaine-hepcidine"><svg xmlns="http://www.w3.org/2000/svg" width="580" height="680" viewBox="0 0 580 680" role="img" aria-label="Inflammation et restriction du fer"><title>Inflammation et restriction du fer</title><rect x="10" y="15" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="52" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Activation inflammatoire et</tspan><tspan x="290" dy="29">cytokines</tspan></text><text x="290" y="143" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="145" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="196" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Hepcidine hépatique augmentée</tspan></text><text x="290" y="273" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="275" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="326" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Export par ferroportine réduit</tspan></text><text x="290" y="403" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="405" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="442" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Fer moins disponible pour les</tspan><tspan x="290" dy="29">précurseurs</tspan></text><text x="290" y="533" text-anchor="middle" font-size="25" fill="#222">↓</text><rect x="10" y="535" width="560" height="106" rx="8" fill="white" stroke="#222"/><text x="290" y="586" text-anchor="middle" font-size="27" fill="#222"><tspan x="290" dy="0">Production d’hémoglobine limitée</tspan></text></svg><figcaption><b>Inflammation et restriction du fer.</b> Le schéma montre une chaîne importante, mais non exclusive. Une perte de fer, une insuffisance rénale ou une toxicité médullaire peuvent agir en parallèle. Schéma causal pédagogique, sans représentation anatomique synthétique.</figcaption></figure>
<p>L’inflammation ne se limite pas au fer. Les cytokines peuvent diminuer la production ou l’efficacité biologique de l’érythropoïétine, perturber la différenciation des précurseurs et favoriser leur perte. La survie des hématies peut également raccourcir. La part de chaque mécanisme varie selon la maladie ; les observations cellulaires ou animales ne permettent pas d’en calculer la contribution chez un patient donné.</p>
<p>En <button class="w" data-k="d63-mrc">MRC</button>, la baisse de stimulation érythropoïétique s’ajoute à la restriction du fer et aux autres causes possibles. Une diminution de l’élimination de l’hepcidine peut participer au phénomène. Les pertes liées aux prélèvements ou à la dialyse peuvent en plus vider les réserves. Augmenter sans fin la dose d’<button class="w" data-k="d63-esa">ESA</button> ne corrige ni une hémorragie ni une carence non traitée.</p>
<p>Une anémie qui apparaît en quelques heures ne s’explique pas uniquement par un ralentissement de fabrication. Une hémorragie, une hémolyse, une dilution ou une autre modification aiguë doivent être envisagées. La chronologie est donc un élément du mécanisme, pas seulement une information administrative.</p>
<div class="key"><b>À retenir.</b> Le même profil peut résulter de plusieurs voies. La compréhension du mécanisme aide à choisir l’examen puis le traitement, sans transformer un schéma explicatif en preuve diagnostique individuelle.</div>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">[S411] Anemia of inflammation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">[S404] Clinical Practice Guideline for the Management of Anemia in CKD</a>.</p></div></section>
<section class="ilot" id="d63-5"><h2><span class="n">5</span> Rechercher les causes et les composantes associées</h2>
<p>La maladie chronique connue est un point de départ. Elle ne doit pas arrêter l’enquête. Une anémie plus profonde que prévu, une modification rapide ou une autre cytopénie imposent de reconsidérer les hypothèses. Le bilan cherche une cause dominante et les composantes corrigibles.</p>
<p>Le tableau rapproche des contextes fréquents de la question utile. Il ne constitue pas une liste d’examens à prescrire indistinctement.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Mécanismes possibles</th><th>Question qui oriente</th></tr></thead><tbody><tr><td>Inflammation chronique ou infection</td><td>Restriction du fer et réponse médullaire freinée ; pertes associées possibles.</td><td>La maladie est-elle active ? Une autre cause explique-t-elle la baisse ?</td></tr><tr><td>Maladie intestinale</td><td>Pertes, malabsorption, inflammation ; déficits B12/folate selon contexte.</td><td>La maladie est-elle active, avec saignement ou atteinte de l’absorption ?</td></tr><tr><td><button class="w" data-k="d63-mrc">MRC</button> ou dialyse</td><td>Stimulation inadaptée, restriction, pertes et déficits.</td><td>Le fer est-il disponible et la cause extra-rénale a-t-elle été recherchée ?</td></tr><tr><td>Cancer et traitements</td><td>Inflammation, chimiotoxicité, infiltration, pertes ou déficits.</td><td>Quelle est la chronologie par rapport au traitement et aux autres lignées ?</td></tr><tr><td>Médicaments et prélèvements</td><td>Saignement, moindre absorption ou perturbation de production.</td><td>Le médicament ou la répétition des prélèvements contribue-t-il au mécanisme ?</td></tr></tbody></table>
<p>Chez l’homme de la vignette, les anti-inflammatoires et une possible perte digestive justifient une anamnèse ciblée. Ils ne prouvent pas une hémorragie. La ferritine et la saturation de la transferrine, les réticulocytes, le frottis et les autres résultats seront confrontés au contexte. L’exploration digestive dépendra des indices de perte et de carence, pas seulement de l’étiquette de polyarthrite.</p>
<p>Une carence en B12 ou en folate, une hémolyse, une maladie thyroïdienne ou médullaire peuvent se superposer. Une numération d’hématies de taille moyenne normale ne suffit pas à les exclure : plusieurs mécanismes opposés peuvent masquer une modification du volume globulaire moyen. Une pancytopénie, des cellules atypiques ou une absence persistante d’explication motivent un avis spécialisé.</p>
<div class="key"><b>À retenir.</b> La recherche d’une cause associée protège contre deux erreurs : attribuer toute anémie à l’inflammation et traiter seulement le chiffre sans corriger le mécanisme accessible.</div>

<section class="ilot" id="d63-6" data-semiology-clinical="D63"><h2><span class="n">6</span> Interroger et examiner en partant de la tolérance</h2>
<p>La fatigue est fréquente et peu spécifique. Le médecin demande ce qui a changé : distance de marche, escaliers, activités quotidiennes, concentration, sommeil et récupération. Il précise la vitesse d’installation, les valeurs antérieures d’hémoglobine et les changements de traitement. Une comparaison avec l’état habituel aide à distinguer le retentissement de l’anémie de celui de la maladie causale.</p>
<p>La <button class="w" data-k="d63-dyspnee">dyspnée</button>, la douleur thoracique, les palpitations, les malaises et les signes de saignement sont recherchés en priorité. Un saignement extériorisé, des selles anormalement noires, des règles abondantes ou des prélèvements répétés orientent vers une perte ; l’absence de saignement visible n’écarte pas une perte occulte. Une coloration noire des selles sous fer oral doit être interprétée avec la clinique et les autres signes, sans assimiler toute coloration à un saignement ni tout saignement au médicament.</p>
<p>Les apports, les troubles digestifs, les antécédents de chirurgie digestive, les traitements et les infections sont précisés. Chez une personne atteinte de cancer, l’interrogatoire situe l’anémie par rapport à la chimiothérapie. Chez une personne dialysée, il examine aussi les pertes, les apports de fer, les traitements stimulant l’érythropoïèse et leur réponse documentée.</p>
<h3>De l’état général aux signes orientés</h3>
<p>L’examen commence par l’état de conscience, le confort respiratoire, la fréquence cardiaque, la pression artérielle et les signes de perfusion. Une situation instable impose une prise en charge urgente. La <button class="w" data-k="d63-paleur">pâleur cutanéomuqueuse</button> peut attirer l’attention, mais elle ne mesure pas précisément l’hémoglobine et n’identifie pas le mécanisme. Aucun chiffre de sensibilité ou de spécificité propre à D63 n’a été établi dans les sources retenues.</p>
<p>Une saturation pulsée normale ne garantit pas un transport total d’oxygène normal : elle décrit une proportion d’hémoglobine oxygénée, alors que l’anémie diminue la quantité d’hémoglobine. Le médecin recherche ensuite les signes de maladie causale ou associée : inflammation, infection, surcharge, atteinte digestive ou hématologique selon le contexte. Il n’interprète pas un examen peu expressif comme la preuve d’une anémie bénigne.</p>
<div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une personne anémique a une saturation pulsée de 98 % et une dyspnée à l’effort. Que signifie cette valeur ?</p><button data-ok="1">Elle ne mesure pas la quantité totale d’hémoglobine disponible pour transporter l’oxygène.</button><button data-ok="0">Elle exclut un retentissement de l’anémie.</button><button data-ok="0">Elle prouve une origine inflammatoire.</button><p class="fb" hidden>Une proportion d’hémoglobine oxygénée peut être conservée alors que sa quantité diminue. La clinique, l’hémoglobine et les autres causes de dyspnée restent à analyser.</p></div>
<div class="key"><b>À retenir.</b> L’interrogatoire et l’examen évaluent d’abord le danger, puis orientent la cause. Le laboratoire complète cette démarche ; il ne remplace pas une réévaluation si l’état change.</div>
