<section class="ilot" id="d63-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs valeurs illustrent les seuils des sources citées et ne proviennent pas de dossiers réels.</p><p>Un homme de 67 ans souffre d’une polyarthrite rhumatoïde active, traitée par méthotrexate et par anti-inflammatoires non stéroïdiens. Il se plaint d’une fatigue croissante depuis trois mois. L’hémoglobine mesure 104 g/l, la <button class="w" data-k="d63-ferritine">ferritine</button> 85 µg/l et la <button class="w" data-k="d63-crp">protéine C réactive</button> 42 mg/l. Chaque chiffre pris isolément est ambigu. Une hémoglobine basse n’indique pas son mécanisme. Une ferritine à 85 µg/l serait franchement basse chez un sujet sans inflammation, mais l’inflammation fait monter la ferritine : la valeur tombe donc dans la <button class="w" data-k="d63-algorithme">zone grise de l’algorithme genevois</button>, entre 30 et 100 µg/l. <b>La question clinique est la suivante : cette anémie est-elle due seulement à l’inflammation, c’est-à-dire à un fer présent mais séquestré, ou le malade a-t-il en plus perdu du fer, par exemple par un saignement digestif favorisé par les anti-inflammatoires ?</b></p><p>La réponse change la conduite. Une anémie purement inflammatoire guérit surtout par le traitement de la maladie causale et ne profite pas d’un apport de fer. Une carence associée justifie en revanche une supplémentation et la recherche de la source de perte (Weiss, Blood 2019 ; Celi, Rev Med Suisse 2011).</p><p>À la fin du chapitre, l’étudiant sait :</p><ul><li>nommer le code CIM-10-GM correct et expliquer pourquoi il ne s’emploie jamais seul (îlot 1) ;</li><li>décrire la chaîne qui relie l’<button class="w" data-k="d63-il6">interleukine 6</button>, l’<button class="w" data-k="d63-hepcidine">hepcidine</button> et la <button class="w" data-k="d63-ferroportine">ferroportine</button> à l’hypoferrémie (îlots 3 et 4) ;</li><li>distinguer anémie inflammatoire, anémie ferriprive et forme mixte avec l’<button class="w" data-k="d63-algorithme">algorithme de décision</button> (îlot 7) ;</li><li>choisir entre traitement de la cause, fer et agents stimulant l’érythropoïèse, en connaissant leurs limites de sécurité (îlots 9 à 11).</li></ul><div class="key"><b>Point de départ.</b> L’anémie inflammatoire est un diagnostic d’exclusion : la preuve d’un trouble du fer ne suffit pas, il faut aussi avoir écarté les autres causes d’anémie (Weiss 2019).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">Weiss, Ganz, Goodnough, Blood 2019</a> ; <a href="https://revmed.ch/view/514249/4206039/RMS_idPAS_D_ISBN_pu2011-37s_sa03_art03.pdf" target="_blank" rel="noopener">Celi et al., Rev Med Suisse 2011</a>.</p></section>
<section class="ilot" id="d63-1"><h2><span class="n">1</span>Définition, nosologie et classification</h2><h3>Un code qui ne se lit qu’avec la maladie causale</h3><p>Dans la CIM-10-GM 2024, la catégorie D63 « Anémie au cours de maladies chroniques classées ailleurs » porte un astérisque. Un <button class="w" data-k="d63-nosologie">code astérisque (manifestation) et son code croix (étiologie)</button> décrit une manifestation qui ne se code qu’en complément de la maladie qui la cause. Le médecin code d’abord la maladie chronique, par exemple une polyarthrite rhumatoïde ou une néoplasie, puis ajoute l’anémie qui en découle.</p><table class="t"><tr><th>Code</th><th>Contenu</th><th>Maladie causale (code croix)</th></tr><tr><td>D63.0*</td><td>Anémie au cours de néoplasies</td><td>Tumeurs, de C00 à D48</td></tr><tr><td>D63.8*</td><td>Anémie au cours d’autres maladies chroniques classées ailleurs ; inclut l’anémie de la maladie rénale chronique de stade 3 et plus</td><td>Maladies inflammatoires, infectieuses chroniques, rénales (N18.3 à N18.5)</td></tr></table><p>Le tableau appelle une précision utile à l’examen : <b>il n’existe pas de code D63.1 dans la CIM-10-GM 2024</b>. Ce code d’« anémie de la maladie rénale chronique » appartient à la classification américaine CIM-10-CM, que ce cours n’utilise pas. En Suisse, l’anémie rénale se code D63.8* avec le code croix N18 correspondant (BfArM, CIM-10-GM 2024).</p><div class="trap"><span class="k">Erreur fréquente</span> Coder D63 seul. Un code astérisque sans code croix est incomplet, car il ne dit pas de quelle maladie l’anémie est la manifestation.</div><h3>Définir l’anémie : des seuils qui divergent</h3><p>Une anémie est définie par une concentration d’hémoglobine inférieure à 130 g/l chez l’homme et à 120 g/l chez la femme (Weiss 2019 ; <button class="w" data-k="d63-sources">KDIGO</button> 2026). L’algorithme genevois de 2011 retient un seuil plus haut chez l’homme, 140 g/l, et précise qu’il s’agit d’une anémie non régénérative, avec des réticulocytes inférieurs à 50 G/l (Celi 2011). Cette divergence a une cause simple : les sources n’ont pas été écrites pour la même population ni à la même date. Le <button class="w" data-k="d63-seuils-hb">tableau des seuils et de leur origine</button> est donné en fenêtre.</p><h3>Anémie inflammatoire, ancienne « anémie des maladies chroniques »</h3><p>La littérature emploie « anémie inflammatoire » et « anemia of chronic disease » comme synonymes. Le premier terme est plus exact : le mécanisme dominant est l’inflammation, et pas la seule chronicité (Weiss 2019 ; Celi 2011). Le diagnostic repose sur un profil biologique caractéristique, l’hypoferrémie avec une ferritine normale ou élevée, et sur l’exclusion des autres causes.</p><h3>Trois configurations martiales</h3><p>Le raisonnement clinique classe l’anémie selon l’état du fer. Dans l’anémie ferriprive pure, les réserves sont vides. Dans l’anémie inflammatoire pure, les réserves existent mais le fer est retenu dans les macrophages. Dans la forme mixte, une carence réelle s’ajoute à l’inflammation (Celi 2011 ; Weiss 2019).</p><table class="t"><tr><th>Configuration</th><th>État du fer</th><th>Conséquence pratique</th></tr><tr><td>Anémie ferriprive pure</td><td>Réserves épuisées</td><td>Fer et recherche de la perte (voir le cours D50)</td></tr><tr><td>Anémie inflammatoire pure</td><td>Réserves conservées, fer séquestré</td><td>Traiter la maladie causale ; le fer seul ne corrige pas le mécanisme</td></tr><tr><td>Forme mixte</td><td>Séquestration et déficit réel</td><td>Fer, recherche de la perte, traitement de la maladie causale</td></tr></table><h3>Terminologie de la maladie rénale chronique</h3><p>Pour la maladie rénale chronique, la ligne directrice <button class="w" data-k="d63-sources">KDIGO</button> 2026 remplace deux expressions classiques. La « carence martiale absolue » devient « carence systémique en fer », définie par une saturation de la transferrine basse et une ferritine basse. La « carence fonctionnelle » devient « érythropoïèse à fer restreint », définie par une saturation basse malgré une ferritine normale ou élevée. Cette formulation provient d’un résumé secondaire de la ligne directrice et reste à confirmer dans son texte intégral.</p><div class="key"><b>À retenir.</b> Le code D63 est un astérisque ; la définition biologique de l’anémie varie de 130 à 140 g/l chez l’homme selon la source ; la forme mixte est la configuration la plus utile à reconnaître, car c’est elle qui change le traitement.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc D60–D64</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">Weiss 2019</a> ; <a href="https://revmed.ch/view/514249/4206039/RMS_idPAS_D_ISBN_pu2011-37s_sa03_art03.pdf" target="_blank" rel="noopener">Celi 2011</a> ; <a href="https://kdigo.org/wp-content/uploads/2026/03/KDIGO-2026-Anemia-Guideline-Central-Illustration-2-No-Dialysis.pdf" target="_blank" rel="noopener">illustrations centrales KDIGO 2026</a>.</p></section>
<section class="ilot" id="d63-2"><h2><span class="n">2</span>Épidémiologie</h2><p>L’anémie inflammatoire est la deuxième anémie la plus fréquente dans le monde, après l’anémie ferriprive, et la plus fréquente chez les patients hospitalisés et chez les malades chroniques (Weiss 2019). Jusqu’à 40 % des anémies dans le monde seraient des anémies inflammatoires ou en comporteraient une composante importante, soit plus d’un milliard de personnes (Weiss 2019).</p><p>La fréquence de la forme mixte compte davantage pour la décision : une carence martiale réelle accompagne l’inflammation chez 20 à 85 % des patients, surtout par saignement digestif ou urogénital, par prélèvements sanguins répétés ou par pertes en dialyse (Weiss 2019). L’intervalle est large, ce qui oblige à chercher la carence chez tout patient inflammatoire anémique au lieu de la présumer absente.</p><p>Les données suisses sont anciennes. Une série suisse de 1997 (Beris et Tobler, Praxis), rapportée de seconde main par l’exposé des Hôpitaux universitaires de Genève de 2011, attribuait 27 % des anémies à une maladie chronique, 29 % à une carence en fer, 17,5 % à un saignement aigu, 17,5 % à une hémolyse et 9 % à d’autres causes. La source primaire n’a pas été lue ; ces proportions décrivent une cohorte ancienne et ne s’appliquent pas sans réserve à la pratique actuelle. Aucune donnée épidémiologique suisse récente n’a été trouvée.</p><table class="t"><tr><th>Maladies associées à l’anémie inflammatoire</th><th>Exemples cités par la revue de 2019</th></tr><tr><td>Infections</td><td>Infections aiguës et chroniques, sepsis</td></tr><tr><td>Maladies auto-immunes</td><td>Polyarthrite rhumatoïde, maladies inflammatoires de l’intestin</td></tr><tr><td>Cancers</td><td>Tumeurs solides et hémopathies</td></tr><tr><td>Maladie rénale chronique</td><td>Surtout aux stades avancés</td></tr><tr><td>Autres états inflammatoires chroniques</td><td>Insuffisance cardiaque congestive, maladies pulmonaires chroniques, obésité, hépatopathies chroniques, athérosclérose avancée</td></tr></table><div class="key"><b>À retenir.</b> Un peu plus d’un quart des anémies relevaient d’une maladie chronique dans la série suisse ancienne ; la carence martiale s’y associe très souvent, ce qui justifie de la rechercher systématiquement.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">Weiss 2019</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/200611_msd_fer_epo.pdf" target="_blank" rel="noopener">Nendaz et Samii, exposé de formation HUG, 2011</a>.</p><button class="pareto-btn ui" data-k="pareto-d63-def">▲ Loi de Pareto — Définition, nosologie et épidémiologie</button></section>
<section class="ilot" id="d63-3"><h2><span class="n">3</span>Le fer normal : un circuit presque fermé</h2><p>Comprendre l’anémie inflammatoire exige de connaître d’abord le fer normal. L’adulte contient environ 4 g de fer : 2,5 g dans l’hémoglobine, 1 g dans la ferritine de réserve et 0,5 g dans d’autres protéines. Le fer circulant lié à la transferrine ne représente qu’environ 3 mg (Celi 2011).</p><h3>Peu d’entrées, pas de sortie régulée</h3><p>L’organisme ne possède pas de voie d’excrétion active du fer. Les pertes, d’environ 1 mg par jour, passent par la desquamation des cellules. L’alimentation apporte de 10 à 15 mg par jour, dont environ 1 mg est absorbé (Celi 2011). L’équilibre repose donc sur le réglage de l’absorption, jamais sur celui de l’élimination.</p><p>À la bordure apicale de l’entérocyte, le transporteur DMT1 fait entrer le fer après sa réduction de la forme ferrique à la forme ferreuse. À la face basolatérale, la <button class="w" data-k="d63-ferroportine">ferroportine</button> exporte le fer, qui est réoxydé puis fixé à la transferrine (Celi 2011).</p><h3>Le recyclage couvre l’essentiel des besoins</h3><p>Le fer recyclé par les macrophages à partir des globules rouges vieillis couvre plus de 90 % des besoins quotidiens de l’érythropoïèse (Weiss 2019). Pour un adulte de 70 kg, environ 25 mg de fer passent chaque jour du plasma vers la moelle, 2000 mg sont contenus dans les érythrocytes et environ 1000 mg sont stockés dans le foie (Nendaz et Samii 2011). Cette organisation a une conséquence : tout ce qui bloque la sortie du fer des macrophages affame rapidement la moelle, même si les réserves sont pleines.</p><h3>Qui règle le circuit ?</h3><p>L’<button class="w" data-k="d63-hepcidine">hepcidine</button> règle l’entrée dans le plasma. Sa synthèse dépend de signaux qui s’opposent : l’érythropoïèse, la quantité de fer stocké, le fer sérique, l’hypoxie et l’inflammation, dont le médiateur principal est l’<button class="w" data-k="d63-il6">interleukine 6</button> (Celi 2011). L’inflammation augmente l’hepcidine par l’interleukine 6, et la baisse du signal d’érythropoïétine aggrave la restriction (voir l’îlot 4). Les sources lues ne détaillent pas le sens des autres régulateurs. L’anémie inflammatoire est le cas où le signal inflammatoire domine.</p><div class="key"><b>Science → clinique.</b> Comme le fer n’a pas de voie d’excrétion régulée, la disponibilité dépend de l’absorption et du recyclage. Un blocage de la ferroportine produit une hypoferrémie tout en gardant des réserves pleines, ce que la ferritine élevée reflète.</div><p class="src">Références : <a href="https://revmed.ch/view/514249/4206039/RMS_idPAS_D_ISBN_pu2011-37s_sa03_art03.pdf" target="_blank" rel="noopener">Celi 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">Weiss 2019</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/200611_msd_fer_epo.pdf" target="_blank" rel="noopener">Nendaz et Samii 2011</a>.</p></section>
<section class="ilot" id="d63-4"><h2><span class="n">4</span>De l’inflammation à l’anémie : les mécanismes</h2><p>Plusieurs mécanismes s’additionnent. Chacun a une conséquence mesurable, ce qui explique que le même profil biologique se retrouve dans des maladies très différentes (Weiss 2019).</p><h3>1. L’axe interleukine 6 – hepcidine – ferroportine</h3><p>L’<button class="w" data-k="d63-il6">interleukine 6</button> est la cytokine principale qui stimule la synthèse d’<button class="w" data-k="d63-hepcidine">hepcidine</button> par le foie, par la voie de signalisation STAT3. L’hepcidine se fixe à la <button class="w" data-k="d63-ferroportine">ferroportine</button> et entraîne son internalisation puis sa dégradation. À forte concentration, elle l’occlut aussi directement. La ferroportine exportait le fer vers le plasma ; sa disparition produit deux effets. L’absorption duodénale diminue, et le fer reste séquestré dans les macrophages. Il en résulte une hypoferrémie et une érythropoïèse à fer restreint (Weiss 2019 ; Celi 2011).</p><h3>2. D’autres cytokines agissent indépendamment</h3><p>L’interféron γ et les lipopolysaccharides bloquent la transcription du gène de la ferroportine. Le facteur de nécrose tumorale (TNF) diminue l’absorption duodénale sans passer par l’hepcidine (Weiss 2019). L’inflammation attaque donc le circuit du fer à plusieurs niveaux, ce qui explique pourquoi un traitement ciblant une seule cytokine ne corrige pas toujours complètement le profil.</p><h3>3. Ferritine et transferrine</h3><p>Les cytokines augmentent la synthèse de ferritine et diminuent celle de la transferrine (Celi 2011 ; Weiss 2019). La ferritine monte donc, et la capacité de fixation baisse. C’est pour cette raison qu’une <button class="w" data-k="d63-ferritine">ferritine</button> normale ou haute avec un fer sérique bas évoque l’inflammation et non l’abondance des réserves.</p><h3>4. Une réponse émoussée à l’érythropoïétine</h3><p>L’<button class="w" data-k="d63-epo">érythropoïétine</button> est l’hormone rénale qui stimule la production de globules rouges. L’interleukine 1 et le TNF inhibent sa production rénale ; l’interleukine 6 la diminue aussi. Le nombre de récepteurs à l’érythropoïétine n’est pas réduit : c’est la signalisation qui est inversement liée à l’interleukine 1 et à l’interleukine 6. La carence en fer dans les précurseurs érythroïdes réduit en outre le récepteur. La baisse du signal d’érythropoïétine diminue la production d’érythroferrone, ce qui aggrave la restriction en fer par l’hepcidine (Weiss 2019 ; Celi 2011). Le résultat est un cercle : moins d’érythropoïétine, plus d’hepcidine, moins de fer pour la moelle.</p><h3>5. Une inhibition directe de la lignée érythroïde</h3><p>L’interféron γ favorise l’apoptose des précurseurs, réduit le récepteur à l’érythropoïétine et inhibe la différenciation par le facteur PU.1 (Weiss 2019).</p><h3>6. Une durée de vie des globules rouges raccourcie</h3><p>L’érythrophagocytose est accrue, des dépôts de complément et d’anticorps marquent les globules, et la fibrine provoque des lésions mécaniques. Ce mécanisme est mineur dans les maladies chroniques mais devient majeur dans l’infection aiguë ou le sepsis, où l’anémie s’installe en quelques heures à quelques jours (Weiss 2019).</p><h3>7. Facteurs propres à certains terrains</h3><table class="t"><tr><th>Terrain</th><th>Mécanisme additionnel</th></tr><tr><td>Maladie rénale chronique</td><td>Hepcidine élevée par baisse de son excrétion rénale ; pertes de fer en dialyse</td></tr><tr><td>Obésité</td><td>Hepcidine élevée</td></tr><tr><td>Sujet âgé</td><td>Carence en vitamine D, qui freine normalement l’hepcidine ; inflammation chronique ; insuffisance rénale ; myélodysplasie infraclinique</td></tr></table><div class="trap"><span class="k">Piège</span> Dans les régions où le paludisme est endémique, une carence martiale ou une anémie légère pourrait être protectrice ; l’enrichissement en fer y a augmenté les infections graves, dont le paludisme (Weiss 2019). La restriction du fer n’est donc peut-être pas seulement un défaut.</div><div class="key"><b>Science → clinique.</b> Quatre effets de l’inflammation se superposent : fer séquestré, réponse érythropoïétique émoussée, précurseurs inhibés, globules plus fragiles. L’apport de fer ne corrige que le premier ; seul le traitement de la maladie causale agit sur l’ensemble.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">Weiss 2019</a> ; <a href="https://revmed.ch/view/514249/4206039/RMS_idPAS_D_ISBN_pu2011-37s_sa03_art03.pdf" target="_blank" rel="noopener">Celi 2011</a>.</p><button class="pareto-btn ui" data-k="pareto-d63-meca">▲ Loi de Pareto — Fer normal et mécanismes</button></section>
<section class="ilot" id="d63-5"><h2><span class="n">5</span>Maladies causales et carence associée</h2><p>Le diagnostic étiologique comprend deux volets : la maladie inflammatoire qui produit l’anémie, et les causes surajoutées de carence martiale qui la compliquent.</p><div class="two"><div class="card"><h4>Maladies causales (D63.0* et D63.8*)</h4><p>Infections chroniques ; maladies auto-immunes comme la polyarthrite rhumatoïde ; cancers, codés D63.0* ; maladie rénale chronique de stade 3 et plus, codée D63.8* ; insuffisance cardiaque congestive ; maladies pulmonaires chroniques ; obésité ; hépatopathies chroniques ; athérosclérose avancée (Weiss 2019 ; BfArM 2024).</p></div><div class="card"><h4>Causes de carence martiale associée</h4><p>Saignement digestif, gynécologique ou urogénital ; alimentation pauvre en fer, notamment végétarisme ; chirurgie bariatrique ; médicaments qui font saigner, comme les anti-inflammatoires non stéroïdiens ; prélèvements sanguins répétés ; pertes de dialyse (Nendaz et Samii 2011 ; Celi 2011 ; Weiss 2019).</p></div></div><p>Dans l’exemple d’ouverture, l’association du méthotrexate et d’un anti-inflammatoire non stéroïdien est le piège classique : la maladie rhumatismale explique l’inflammation, et les anti-inflammatoires font saigner la muqueuse digestive. Le même patient cumule ainsi deux mécanismes, ce que seul un bilan martial complet révèle (cas rapporté par l’exposé genevois de 2011).</p><div class="trap"><span class="k">Erreur fréquente</span> S’arrêter à la maladie chronique évidente. Attribuer toute l’anémie à la polyarthrite ou au cancer fait manquer une carence associée curable, voire un saignement digestif dont la source justifie un bilan endoscopique (Celi 2011).</div><div class="key"><b>À retenir.</b> Devant toute anémie inflammatoire, deux questions : quelle maladie produit l’inflammation, et où le patient perd-il du sang ou du fer ?</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">Weiss 2019</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/200611_msd_fer_epo.pdf" target="_blank" rel="noopener">Nendaz et Samii 2011</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">BfArM 2024</a>.</p></section>
<section class="ilot" id="d63-6"><h2><span class="n">6</span>Anamnèse et examen clinique</h2><p>Aucune source lue ne décrit de sémiologie propre à l’anémie inflammatoire : ses signes sont ceux de toute anémie, et la clinique sert surtout à reconnaître la maladie causale et une carence associée. Cette limite est assumée par le cours.</p><div class="two"><div class="card"><h4>Anamnèse</h4><p>Symptômes de l’anémie : fatigue, essoufflement, palpitations, acouphènes, phosphènes, angor. Ces symptômes sont ceux de toute anémie (Nendaz et Samii 2011). L’interrogatoire recherche ensuite la maladie causale, les saignements digestifs, gynécologiques et urogénitaux, le régime alimentaire, une chirurgie bariatrique et les médicaments, en particulier les anti-inflammatoires non stéroïdiens.</p></div><div class="card"><h4>Examen</h4><p>Pâleur ; signes évoquant une carence en fer associée, comme les troubles cutanés et phanériens, les perlèches et la glossite (Nendaz et Samii 2011). L’examen cherche aussi les signes de la maladie causale : synovites, masse, signes d’infection chronique ou d’insuffisance cardiaque.</p></div></div><div class="trap"><span class="k">Piège</span> La pâleur oriente mais ne mesure pas l’hémoglobine : seul l’hémogramme confirme et quantifie l’anémie.</div><div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une femme de 52 ans, suivie pour une maladie de Crohn, présente une fatigue et des perlèches. L’hémoglobine est à 108 g/l. Quelle orientation retenez-vous d’abord ?</p><button data-ok="0">L’anémie est inflammatoire par définition : traiter la maladie de Crohn suffit et aucun bilan martial n’est nécessaire.</button><button data-ok="1">Rechercher une carence martiale associée par une ferritine lue avec la protéine C réactive, car les perlèches évoquent une carence en fer.</button><button data-ok="0">Prescrire d’emblée un agent stimulant l’érythropoïèse.</button><p class="fb" hidden>Les perlèches évoquent une carence en fer (Nendaz et Samii 2011), et la maladie inflammatoire de l’intestin expose à une carence vraie fréquente (Weiss 2019). Le bilan martial lu avec la protéine C réactive tranche entre séquestration et déficit réel ; un agent stimulant l’érythropoïèse n’a pas sa place avant ce bilan.</p></div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/200611_msd_fer_epo.pdf" target="_blank" rel="noopener">Nendaz et Samii 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6536698/" target="_blank" rel="noopener">Weiss 2019</a>.</p><button class="pareto-btn ui" data-k="pareto-d63-clin">▲ Loi de Pareto — Causes, anamnèse et examen</button></section>
