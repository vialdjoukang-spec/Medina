<template data-pop="g71-sousgroupes" data-title="Périmètre de G71 : inclusions et exclusions">
<div class="lab">Définition</div><p>G71 (« Primäre Myopathien » dans la classification allemande) réunit les affections musculaires primitives. Six sous-catégories existent : dystrophie musculaire, affections myotoniques, myopathies congénitales, myopathie mitochondriale non classée ailleurs, autres affections musculaires primitives, affection musculaire primitive sans précision.</p>
<div class="lab">Ce que contient chaque groupe</div><p>La dystrophie musculaire inclut la forme autosomique récessive de début dans la petite enfance, ressemblant à la dystrophie de Duchenne ou de Becker, les formes des ceintures, la forme bénigne de Becker, la forme scapulopéronière bénigne avec contractures précoces (Emery-Dreifuss), les formes distale, facio-scapulo-humérale, maligne de Duchenne, oculaire, oculopharyngée et scapulopéronière ; elle exclut la dystrophie musculaire congénitale, classée avec les myopathies congénitales.</p>
<p>Les affections myotoniques incluent la dystrophie myotonique (Curschmann-Batten-Steinert), la myotonie congénitale dominante (Thomsen) et récessive (Becker), la myotonie médicamenteuse, chondrodystrophique ou symptomatique, la neuromyotonie (Isaacs-Mertens), la paramyotonie congénitale (Eulenburg) et la pseudomyotonie. Les myopathies congénitales incluent la dystrophie musculaire congénitale (avec ou sans anomalie spécifique de la morphologie des fibres), la disproportion des types de fibres, les maladies à minicores, à multicores et à « central core », la myopathie myotubulaire (centronucléaire) et la myopathie à némaline. Pour la myopathie mitochondriale, un code additionnel précise les manifestations.</p>
<div class="lab">Exclusions</div><p>Arthrogrypose multiple congénitale, myosite et troubles métaboliques (chapitre E70–E90). La dermatomyosite-polymyosite et l’infarctus musculaire ischémique sont exclus de la catégorie voisine G72.</p>
<div class="lab">Piège</div><p>Le nom « Becker » désigne deux maladies différentes : la dystrophie musculaire de Becker (dystrophinopathie) et la myotonie congénitale récessive de Becker (canalopathie). Le contexte, dystrophie ou myotonie, lève l’ambiguïté.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g70-g73.htm" target="_blank" rel="noopener">ICD-10-GM 2024 (BfArM), bloc G70–G73</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, OFS</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-dystrophine" data-title="Dystrophine et dystrophinopathies">
<div class="lab">Normal</div><p>La dystrophine est une protéine du cytosquelette. Elle assure la solidité, la stabilité et la fonction des fibres musculaires.</p>
<div class="lab">Pathologique</div><p>Une mutation du gène DMD, situé en Xp21, rend la dystrophine absente ou insuffisante. Les dystrophinopathies comprennent la dystrophie de Duchenne, la dystrophie de Becker, un phénotype intermédiaire, la cardiomyopathie dilatée isolée et les conductrices symptomatiques.</p>
<div class="lab">Conséquence clinique</div><p>La dégradation et la dégénérescence musculaires progressives expliquent la faiblesse, le retard moteur, la perte de la marche, l’atteinte respiratoire et la cardiomyopathie. Le décès survient en général par atteinte cardiaque ou respiratoire.</p>
<div class="lab">Piège</div><p>Réduire les dystrophinopathies à la maladie de Duchenne : la cohorte de Becker montre une atteinte cardiaque chez 52,3 % des patients.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/cont.0000000000001618" target="_blank" rel="noopener">Jayaraman, Ghosh, dystrophinopathies, Continuum 2025</a> ; <a href="https://doi.org/10.1007/s00415-025-13126-9" target="_blank" rel="noopener">Riguzzi et al., cohorte Becker, J Neurol 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-myotonie" data-title="Myotonie et myotonies non dystrophiques">
<div class="lab">Définition</div><p>La myotonie est un retard anormal de relaxation du muscle strié. Elle se manifeste par raideur, crampes, blocage, douleur et fatigue.</p>
<div class="lab">Deux groupes</div><p>Les myotonies non dystrophiques sont des canalopathies musculaires génétiques à myotonie prédominante, sans atteinte cardiaque. Les dystrophies myotoniques sont des maladies systémiques, avec myopathie progressive, arythmies et cataracte.</p>
<div class="lab">Traitement</div><p>La revue Cochrane de 2025 (17 essais, 392 participants) conclut que la mexilétine réduit probablement la raideur dans les myotonies non dystrophiques (certitude modérée) ; la lamotrigine est possiblement efficace, sur de faibles effectifs.</p>
<div class="lab">Erreur fréquente</div><p>Confondre les deux groupes : un cœur indemne rassure dans une myotonie non dystrophique, jamais dans une dystrophie myotonique.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/14651858.CD004762.pub3" target="_blank" rel="noopener">Spillane et al., Cochrane, traitement de la myotonie, 2025</a> ; <a href="https://doi.org/10.1016/j.acvd.2024.03.001" target="_blank" rel="noopener">Experts français, mexilétine dans la dystrophie myotonique, 2024</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-congenitales" data-title="Myopathies congénitales">
<div class="lab">Définition</div><p>Myopathies héréditaires marquées par une hypotonie et une faiblesse, généralement dès la naissance, d’évolution statique ou lentement progressive. Le 277e atelier de l’ENMC (2026) les définit par des anomalies histologiques structurelles non dystrophiques, les nomme par gène, transmission et histologie, et place la génétique en première ligne.</p>
<div class="lab">Classification</div><p>Historiquement par la biopsie : némaline, central core et multi-minicore, disproportion congénitale des types de fibres, surcharge en myosine, centronucléaire et myotubulaire (liée à l’X ou autosomique). Gènes majeurs : NEB, ACTA1, ADSSL1, RYR1, SELENON, MTM1, DNM2, TPM3.</p>
<div class="lab">Diagnostic</div><p>Un même gène peut donner des aspects histologiques différents, et plusieurs gènes un même aspect : le séquençage d’exome ou de génome devient l’analyse de première ligne chez de nombreux patients.</p>
<div class="lab">Clinique</div><p>Hypotonie, faiblesse, retard ou absence d’acquisitions motrices, difficultés alimentaires et respiratoires, faciès myopathique.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/B978-0-323-98818-6.00027-3" target="_blank" rel="noopener">Myopathies congénitales, Handb Clin Neurol 2023</a> ; <a href="https://doi.org/10.1038/s10038-022-01045-w" target="_blank" rel="noopener">Gènes des myopathies congénitales, J Hum Genet 2022</a> ; <a href="https://doi.org/10.1016/j.nmd.2025.105392" target="_blank" rel="noopener">Revue systématique, critères de jugement moteurs, myopathies congénitales, 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-melas" data-title="MELAS : définition et diagnostic">
<div class="lab">Définition</div><p>MELAS (encéphalomyopathie mitochondriale, acidose lactique, épisodes pseudo-vasculaires) est un syndrome clinique comportant un ou plusieurs épisodes pseudo-vasculaires dans un contexte de dysfonction mitochondriale due à un variant pathogène de l’ADN mitochondrial, en particulier m.3243A&gt;G (MT-TL1).</p>
<div class="lab">Terminologie</div><p>Les termes « MELAS-like » et « spectre MELAS » sont déconseillés par le consensus de l’ERN EURO-NMD (2026).</p>
<div class="lab">Épisode pseudo-vasculaire</div><p>Syndrome cérébral aigu ou subaigu, évolutif, possible à tout âge, avec des anomalies corticales ou sous-corticales qui ne respectent pas, en règle, les grands territoires vasculaires. L’imagerie, l’EEG et la génétique confirment d’abord l’épisode et excluent ses imitations, dont l’ischémie vasculaire. Une fois l’épisode établi, ni antiplaquettaire ni thrombolyse ; corticoïdes intraveineux au cas par cas.</p>
<div class="lab">Prise en charge lue</div><p>Antiépileptiques à débuter rapidement si des crises sont suspectées. L’efficacité de la L-arginine, de la L-taurine, de la L-citrulline, du coenzyme Q, des vitamines et d’autres suppléments n’est pas prouvée.</p>
<div class="lab">Limite</div><p>Le texte intégral du consensus a été lu ; il ne traite pas l’infarctus artériel chez ces patients, de sorte qu’un déficit aigu non confirmé suit la filière habituelle de l’accident vasculaire cérébral.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/ene.70588" target="_blank" rel="noopener">Consensus ERN EURO-NMD, MELAS, Eur J Neurol 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13090769/" target="_blank" rel="noopener">Consensus ERN EURO-NMD, MELAS et épisodes pseudo-vasculaires, Eur J Neurol 2026, texte intégral</a>, consultées le 15 et le 16 octobre 2026.</p></template>
<template data-pop="g71-lgmd" data-title="Dystrophies des ceintures">
<div class="lab">Définition</div><p>Faiblesse progressive chronique des ceintures pelvienne et scapulaire ; transmission autosomique dominante (anciennes LGMD1) ou récessive (anciennes LGMD2).</p>
<div class="lab">Indices cliniques</div><p>Atteinte prédominante de la ceinture scapulaire, atteinte respiratoire disproportionnée, faiblesse distale, faiblesse des adducteurs de hanche, « biceps lump », signe du « diamant » quadricipital, hypertrophie des mollets, contractures, atteinte cardiaque. Près de la moitié des patients présentent au moins un indice.</p>
<div class="lab">Limite</div><p>La nomenclature a été réformée par le 229<sup>e</sup> atelier de l’ENMC (2017) ; son contenu n’a pas été lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nmd.2018.05.007" target="_blank" rel="noopener">Straub et al., 229e atelier ENMC LGMD, Neuromuscul Disord 2018</a> ; <a href="https://doi.org/10.1136/practneurol-2017-001799" target="_blank" rel="noopener">Khadilkar et al., spectre clinique des LGMD, Pract Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-dm1-genetique" data-title="DM1 : expansion CTG, anticipation, épigénétique">
<div class="lab">Mécanisme</div><p>Expansion instable d’un triplet CTG dans la région 3′ non traduite du gène DMPK, transmise de façon autosomique dominante. La plupart des symptômes musculaires s’expliquent par des effets toxiques de l’ARN porteur de l’expansion.</p>
<div class="lab">Seuils</div><p>Plus de 35 répétitions indiquent en général une mutation instable ; 50 répétitions ou plus sont compatibles avec le diagnostic.</p>
<div class="lab">Sévérité</div><p>La taille de l’expansion est grossièrement corrélée à l’âge de début et à la sévérité, mais la longueur seule ne prédit pas la sévérité : des facteurs épigénétiques interviennent. L’anticipation génétique est marquée.</p>
<div class="lab">Fréquence</div><p>Entre 1/3000 et 1/8000 dans le monde (environ 1/2500 selon une autre estimation) ; c’est la dystrophie musculaire la plus fréquente à début adulte.</p>
<div class="lab">Erreur fréquente</div><p>Prédire la sévérité d’un patient à partir du seul nombre de répétitions.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1159/000505634" target="_blank" rel="noopener">Boentert et al., DM1 pneumologues, Respiration 2020</a> ; <a href="https://doi.org/10.1016/j.gim.2024.101145" target="_blank" rel="noopener">ACMG, test DM1, Genet Med 2024</a> ; <a href="https://doi.org/10.3390/ijms23073477" target="_blank" rel="noopener">de Pontual, Tomé, épigénétique de la DM1, Int J Mol Sci 2022</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-fshd" data-title="Dystrophie facio-scapulo-humérale">
<div class="lab">Mécanisme</div><p>DUX4, facteur de transcription toxique pour le muscle, est exprimé lorsque le locus 4q35 est hypométhylé. Dans la cohorte russe, le nombre d’unités D4Z4 est inversement corrélé à la sévérité.</p>
<div class="lab">Clinique</div><p>Faiblesse progressive, souvent asymétrique, du visage, de la ceinture scapulaire, des membres supérieurs, du tronc et des jambes ; douleur et fatigue fréquentes. L’association faiblesse faciale, décollement scapulaire et faiblesse abdominale avec signe de Beevor positif est presque pathognomonique ; les formes tardives ou légères sont plus difficiles.</p>
<div class="lab">Respiration</div><p>Un syndrome restrictif touche 10 à 45 % des patients, associé au début précoce, à la sévérité, aux déformations rachidiennes et à la perte de la marche. Les troubles respiratoires du sommeil peuvent précéder l’atteinte motrice.</p>
<div class="lab">Traitement</div><p>Soins de soutien ; aucun traitement modificateur autorisé ; essais ciblant DUX4 en cours.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.ncl.2020.03.003" target="_blank" rel="noopener">Hamel, Tawil, FSHD, Neurol Clin 2020</a> ; <a href="https://doi.org/10.1016/j.nmd.2026.106419" target="_blank" rel="noopener">Insuffisance respiratoire et sommeil dans la FSHD, Neuromuscul Disord 2026</a> ; <a href="https://doi.org/10.1212/cont.0000000000001614" target="_blank" rel="noopener">Knox, FSHD, Continuum 2025</a> ; <a href="https://doi.org/10.1007/s00439-026-02865-y" target="_blank" rel="noopener">Registre russe de la FSHD, Hum Genet 2026</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-becker-cohorte" data-title="Cohorte de dystrophie de Becker (Newcastle)">
<div class="lab">Population</div><p>163 hommes, centre britannique, étude rétrospective monocentrique.</p>
<div class="lab">Résultats</div><p>Âge moyen de perte de la marche 42,2 ans (11,2 à 77,6) ; 23 % non ambulants à la dernière évaluation ; atteinte cardiaque 52,3 % ; troubles neuropsychiatriques 44,2 %. Le diagnostic est évoqué sur des symptômes musculaires (52,2 %), une histoire familiale (27,6 %), des troubles neuropsychiatriques (9,7 %), une découverte fortuite (6,7 %) ou une cardiomyopathie (3,8 %). Variants : grandes délétions 78 %, grandes duplications 11 %, petits variants 11 %.</p>
<div class="lab">Limite</div><p>Données descriptives, extrapolation à la Suisse non établie ; la durée de la maladie est corrélée à la sévérité motrice.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00415-025-13126-9" target="_blank" rel="noopener">Riguzzi et al., cohorte Becker, J Neurol 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-mito-cohorte" data-title="Cohorte de myopathies mitochondriales de l’adulte">
<div class="lab">Population</div><p>94 adultes, centre américain, étude rétrospective descriptive.</p>
<div class="lab">Résultats</div><p>Délai médian symptôme-diagnostic 11 ans ; âge médian au diagnostic 48 ans ; atteinte musculaire isolée 27 % ; système nerveux central 69 % ; cœur 21 %. Survie médiane 33,4 ans après le début des symptômes ; âge médian au décès 55 ans ; l’atteinte cardiaque est associée à une mortalité accrue (rapport de risques 2,36). Délai médian de 5,5 ans entre diagnostic et aide à la marche.</p>
<div class="lab">Limite</div><p>Source américaine, donnée descriptive, jamais fondement d’une conduite.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/braincomms/fcae041" target="_blank" rel="noopener">Beecher et al., myopathies mitochondriales de l’adulte, Brain Commun 2024</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-exercice" data-title="Exercice dans les dystrophinopathies">
<div class="lab">Pourquoi</div><p>Fragilité structurelle des fibres, anomalies métaboliques et du monoxyde d’azote contribuent à une ischémie d’effort et à une capacité d’effort réduite.</p>
<div class="lab">Conduite</div><p>Éviter l’exercice excentrique et le renforcement à haute résistance ; privilégier l’exercice aérobie sous-maximal (natation, vélo).</p>
<div class="lab">Piège</div><p>Inciter au « renforcement » comme dans un muscle sain : ce principe ne s’applique pas à une fibre sans dystrophine.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-coeur-dmd" data-title="Cœur de la dystrophie de Duchenne">
<div class="lab">Mécanisme</div><p>La déficience en dystrophine myocardique produit une cardiomyopathie ; la fibrose myocardique progressive conduit à la dysfonction ventriculaire et à un risque d’arythmies graves.</p>
<div class="lab">Clinique</div><p>Insuffisance cardiaque souvent méconnue chez le non-ambulant : fatigue, perte de poids, vomissements, douleurs abdominales, troubles du sommeil, intolérance aux activités. La classification NYHA est inadaptée, puisque la limitation d’effort est aussi musculaire.</p>
<div class="lab">Bilan</div><p>ECG et imagerie non invasive dès le diagnostic ; IRM cardiaque préférée, échocardiographie jusqu’à 6 ou 7 ans ; bilan annuel ; Holter annuel raisonnable dès dysfonction ventriculaire ou fibrose.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-hm" data-title="Hyperthermie maligne et anesthésie">
<div class="lab">Définition</div><p>Chez les sujets génétiquement prédisposés, réaction hypermétabolique aux anesthésiques volatils puissants ou au suxaméthonium.</p>
<div class="lab">Conduite péri-opératoire</div><p>Anesthésie sans agents déclenchants chez les sujets susceptibles ; pas de dantrolène prophylactique ; surveillance péri-opératoire et en salle de réveil inchangée si cette condition est remplie ; anesthésie ambulatoire possible.</p>
<div class="lab">Lien avec les myopathies</div><p>RYR1 est l’un des gènes des myopathies congénitales à cores. Le lien explicite entre RYR1 et hyperthermie maligne n’est pas énoncé dans les textes lus.</p>
<div class="lab">Limite</div><p>Le guide 2024 de reconnaissance et de traitement de la crise existe ; seul son titre a été lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1038/s10038-022-01045-w" target="_blank" rel="noopener">Gènes des myopathies congénitales, J Hum Genet 2022</a> ; <a href="https://doi.org/10.1016/j.bja.2020.09.029" target="_blank" rel="noopener">EMHG, prise en charge péri-opératoire (hyperthermie maligne), Br J Anaesth 2020</a> ; <a href="https://doi.org/10.1016/j.bja.2024.09.022" target="_blank" rel="noopener">EMHG, crise d’hyperthermie maligne, Br J Anaesth 2024</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-mito" data-title="Myopathies mitochondriales de l’adulte">
<div class="lab">Mécanisme</div><p>Défauts des complexes I à V de la phosphorylation oxydative.</p>
<div class="lab">Phénotypes</div><p>Atteinte multisystémique, MELAS, myopathie des membres, ophtalmoplégie externe progressive chronique et sa forme étendue. Faiblesse modérée et lentement progressive. Le 280e atelier de l’ENMC (2025) retient deux phénotypes majeurs de myopathie mitochondriale primaire : avec ou sans ophtalmoplégie externe progressive.</p>
<div class="lab">Examens</div><p>Électromyogramme myopathique dans 77 % des cas ; biopsie avec fibres COX-négatives (médiane 5,1 %).</p>
<div class="lab">Pronostic</div><p>Survie médiane 33,4 ans après le début des symptômes ; atteinte cardiaque associée à une mortalité accrue.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/braincomms/fcae041" target="_blank" rel="noopener">Beecher et al., myopathies mitochondriales de l’adulte, Brain Commun 2024</a> ; <a href="https://doi.org/10.1002/jimd.12751" target="_blank" rel="noopener">Déficit en complexe III, J Inherit Metab Dis 2024</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-cdm1" data-title="Dystrophie myotonique congénitale">
<div class="lab">Définition</div><p>Forme la plus sévère de la DM1, à début prénatal, avec mortalité périnatale élevée.</p>
<div class="lab">Génétique</div><p>Très grandes expansions CTG ; fort biais de transmission maternelle ; anticipation.</p>
<div class="lab">Clinique</div><p>Hypotonie sévère, insuffisance respiratoire, retard de développement, déficience intellectuelle ; strabisme, troubles oculomoteurs, myopie et astigmatisme dans les formes congénitales et juvéniles.</p>
<div class="lab">Conséquence</div><p>Une grossesse de femme atteinte exige conseil génétique et présence néonatale spécialisée.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1016/j.nbd.2019.104533" target="_blank" rel="noopener">Lanni, Pearson, DM1 congénitale, Neurobiol Dis 2019</a> ; <a href="https://doi.org/10.1016/j.nbd.2021.105532" target="_blank" rel="noopener">DM1 congénitale, cerveau et cognition, Neurobiol Dis 2021</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-conductrices" data-title="Conductrices de dystrophinopathie">
<div class="lab">Risque</div><p>Risque de myopathie et de cardiomyopathie ; dans une étude de 2016, 47 % des conductrices avaient au moins une anomalie à l’IRM cardiaque.</p>
<div class="lab">Conduite</div><p>Conseil génétique, test des apparentées, options reproductives (diagnostic préimplantatoire ou prénatal), bilan cardiaque au début de l’âge adulte puis tous les 3 à 5 ans.</p>
<div class="lab">Erreur fréquente</div><p>Considérer qu’une conductrice sans symptôme n’a pas besoin de suivi cardiaque.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/cont.0000000000001618" target="_blank" rel="noopener">Jayaraman, Ghosh, dystrophinopathies, Continuum 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-gowers" data-title="Signe de Gowers et signes d’appel">
<div class="lab">Définition</div><p>Le signe de Gowers désigne la difficulté à se relever du sol, signe d’une faiblesse proximale ; il figure parmi les signes d’appel de la petite enfance avec la maladresse, la difficulté à monter les escaliers et la marche sur la pointe des pieds.</p>
<div class="lab">Valeur</div><p>Le relever chronométré sert au suivi : plus de 30 secondes après 7 ans prédit un déclin plus rapide dans les 12 mois.</p>
<div class="lab">Piège</div><p>Ne pas attendre une perte de la marche pour agir : la corticothérapie est débutée avant un déclin physique significatif.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/cont.0000000000001618" target="_blank" rel="noopener">Jayaraman, Ghosh, dystrophinopathies, Continuum 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-transaminases" data-title="Transaminases d’origine musculaire">
<div class="lab">Principe</div><p>ASAT, ALAT et LDH s’élèvent aussi lorsque le muscle est lésé ; avec une CK élevée et une GGT normale, l’origine est musculaire.</p>
<div class="lab">Conséquence</div><p>Une élévation fortuite est une présentation moins fréquente de la dystrophie de Duchenne, et peut orienter à tort vers le foie.</p>
<div class="lab">Conduite</div><p>Doser la CK avant tout bilan hépatique approfondi.</p>
<div class="lab">Erreur fréquente</div><p>Poursuivre un bilan hépatique long chez un garçon avec retard de langage ou autisme et transaminases élevées, sans CK.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/cont.0000000000001618" target="_blank" rel="noopener">Jayaraman, Ghosh, dystrophinopathies, Continuum 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-dm1-organes" data-title="Organes atteints dans la DM1">
<div class="lab">Aperçu</div><table class="t"><thead><tr><th>Organe</th><th>Atteinte</th><th>Enjeu</th></tr></thead><tbody><tr><td>Muscle</td><td>Faiblesse et amyotrophie distales, myotonie</td><td>Chutes, préhension</td></tr><tr><td>Œil</td><td>Cataracte chez la plupart ; ptosis ; faiblesse de l’orbiculaire</td><td>Lampe à fente annuelle</td></tr><tr><td>Cœur</td><td>Bradycardie sinusale, blocs, fibrillation et flutter atriaux, tachycardie ventriculaire</td><td>ECG tous les un ou deux ans</td></tr><tr><td>Digestif</td><td>Dysphagie, reflux, douleurs, diarrhée, constipation ; pseudo-obstruction ; atteinte biliaire</td><td>Dépistage de la dysphagie</td></tr><tr><td>Cerveau</td><td>Troubles cognitifs, apathie, somnolence ; hyperintensités FLAIR aux pôles temporaux</td><td>Échelle d’Epworth</td></tr><tr><td>Endocrinien</td><td>Insulinorésistance, enzymes hépatiques élevées, dysthyroïdie, dyslipidémie, infertilité</td><td>Glycémie, TSH, lipides</td></tr><tr><td>Peau</td><td>Pilomatrixomes</td><td>Vigilance tumorale</td></tr></tbody></table>
<div class="lab">Piège</div><p>Les enzymes hépatiques élevées de façon chronique ne justifient pas à elles seules une biopsie hépatique.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-ptosis" data-title="Ptosis et ophtalmoplégie : OEPC ou myasthénie">
<div class="lab">Question</div><p>Un ptosis avec ophtalmoplégie peut relever d’une ophtalmoplégie externe progressive chronique mitochondriale ou d’une myasthénie.</p>
<div class="lab">Piège biologique</div><p>Les anticorps anti-récepteurs de l’acétylcholine peuvent être faussement positifs par ELISA ; la méthode radio-immunologique est supérieure. Un cas rapporté associait un faux positif à une ophtalmoplégie externe progressive chronique unilatérale et à des fibres « ragged red » à la biopsie.</p>
<div class="lab">Limite</div><p>Cas isolé, valeur illustrative uniquement.</p>
<p class="src">Références : <a href="https://doi.org/10.1080/01676830.2017.1423350" target="_blank" rel="noopener">Rajput et al., anticorps dirigés contre le récepteur de l’acétylcholine, cas d’OEPC unilatérale, Orbit 2018</a> ; <a href="https://doi.org/10.1093/braincomms/fcae041" target="_blank" rel="noopener">Beecher et al., myopathies mitochondriales de l’adulte, Brain Commun 2024</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-resp-dmd" data-title="Atteinte respiratoire de la dystrophie de Duchenne">
<div class="lab">Courbe</div><p>La capacité vitale forcée augmente avec la croissance jusqu’à la perte de la marche, atteint un plateau puis décline ; la baisse peut être silencieuse sans spirométrie régulière.</p>
<div class="lab">Symptômes d’hypoventilation nocturne</div><p>Fatigue, dyspnée, céphalées matinales, réveils fréquents, hypersomnolence, troubles de la concentration, réveils dyspnéiques avec tachycardie, cauchemars ; certains patients restent asymptomatiques.</p>
<div class="lab">Conduite</div><p>Spirométrie dès 5 à 6 ans, puis au moins tous les 6 mois chez le non-ambulant ; seuils du tableau de la partie 9.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-crise-surrenale" data-title="Crise surrénalienne sous glucocorticoïdes">
<div class="lab">Risque</div><p>Rare mais mortelle, en cas d’arrêt brutal des glucocorticoïdes ou de maladie intercurrente chez un garçon traité pour une dystrophie de Duchenne.</p>
<div class="lab">Prévention</div><p>Éducation de la famille ; hydrocortisone intramusculaire d’urgence à domicile : 50 mg avant 2 ans, 100 mg dès 2 ans. Doses de stress de 50 à 100 mg/m²/jour en cas de maladie grave, de traumatisme majeur ou de chirurgie lorsque le patient reçoit plus de 12 mg/m²/jour de prednisone ou de déflazacort. Arrêt par décroissance sur des semaines à des mois.</p>
<div class="lab">Sous vamorolone</div><p>La crise surrénalienne peut survenir lors d’un stress accru ou d’une réduction ou d’un arrêt brutal. En phase de stress (infection aiguë, traumatisme, chirurgie), le vamorolone est complété temporairement par de l’hydrocortisone systémique ; le vamorolone seul est déconseillé, car il est antagoniste des récepteurs minéralocorticoïdes. Après plus d’une semaine, la décroissance se fait sur plusieurs semaines, par paliers d’environ 20 %. Le patient porte sa carte d’alerte.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse AGAMREE® (vamorolone), AIPS</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-anesthesie" data-title="Anesthésie à risque dans les myopathies">
<div class="lab">Duchenne</div><p>Les anesthésiques inhalés et le suxaméthonium exposent à une rhabdomyolyse et à une hyperkaliémie potentiellement mortelles. Un avis cardiologique et pneumologique précède toute chirurgie.</p>
<div class="lab">Dystrophie myotonique de type 1</div><p>Réactions indésirables aux anesthésiques et aux opioïdes, même dans les formes légères ; la plupart des complications graves surviennent après l’anesthésie.</p>
<div class="lab">Suxaméthonium</div><p>L’information professionnelle suisse le contre-indique dans les myopathies des muscles squelettiques comme la Duchenne, en cas d’antécédent personnel ou familial de maladie myotonique (myotonie congénitale, dystrophie myotonique) et d’hyperthermie maligne ; la seringue préremplie ne doit pas être administrée avant 12 ans, ses graduations ne permettant pas un dosage précis.</p>
<div class="lab">Hyperthermie maligne</div><p>Voir la fenêtre dédiée : anesthésie sans agents déclenchants chez les sujets susceptibles.</p>
<div class="lab">Erreur fréquente</div><p>Considérer qu’une forme « légère » dispense de précautions anesthésiques.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1016/j.bja.2020.09.029" target="_blank" rel="noopener">EMHG, prise en charge péri-opératoire (hyperthermie maligne), Br J Anaesth 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699390014" target="_blank" rel="noopener">Information professionnelle suisse Suxamethonium Aguettant, Swissmedic (AIPS via AmiKo), mise à jour de mars 2025</a>, consultées le 15 et le 16 octobre 2026.</p></template>
<template data-pop="g71-infection-resp" data-title="Infection respiratoire et décompensation">
<div class="lab">Dystrophie de Duchenne</div><p>Intensifier la toux assistée si la SpO2 est inférieure à 95 %. Antibiotique si trois des cinq signes sont présents : fièvre, leucocytes ou CRP élevés, expectoration, infiltrat radiologique, hypoxémie ou détresse. L’oxygène seul est à éviter, car l’hypoxémie traduit une hypoventilation, une atélectasie ou une pneumonie.</p>
<div class="lab">Dystrophie myotonique de type 1</div><p>Insuffisance respiratoire aiguë : intubation et ventilation ; oxygène avec prudence, associé à la ventilation non invasive dans l’insuffisance chronique.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-embolie" data-title="Embolie graisseuse après fracture">
<div class="lab">Contexte</div><p>Fracture des membres inférieurs dans la dystrophie de Duchenne.</p>
<div class="lab">Signes</div><p>Troubles de la conscience, détresse respiratoire, tachycardie.</p>
<div class="lab">Conduite</div><p>Prise en charge immédiate : soutien respiratoire et corticoïdes à forte dose.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-arythmie-dm1" data-title="Troubles du rythme et de la conduction de la DM1">
<div class="lab">Spectre</div><p>Bradycardie sinusale, blocs, fibrillation et flutter atriaux, tachycardie ventriculaire ; atteinte souvent asymptomatique.</p>
<div class="lab">Signes d’alerte</div><p>Palpitations, douleur thoracique, dyspnée, orthopnée, lipothymie, syncope : bilan cardiaque.</p>
<div class="lab">ECG</div><p>Fréquence sinusale inférieure à 50/min, PR supérieur à 200 ms, QRS supérieur à 100 ms, bloc fasciculaire antérieur ou postérieur gauche, ondes Q anormales, arythmies atriales ou ventriculaires.</p>
<div class="lab">Limite</div><p>L’étude électrophysiologique invasive peut avoir des implications cliniques importantes dans la dystrophie myotonique ; le tableau ESC 2022 sur les maladies neuromusculaires n’a pas été extrait.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">ESC 2022, arythmies ventriculaires et mort subite</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-hyperck" data-title="HyperCKémie : seuil, cause et conduite">
<div class="lab">Définition</div><p>Jusqu’à 20 % de sujets « normaux » ont une CK élevée ; l’hyperCKémie est redéfinie comme une valeur supérieure à 1,5 fois la limite supérieure de la normale.</p>
<div class="lab">Conduite</div><p>Biopsie musculaire si CK ≥ 3 fois la normale, électromyogramme myopathique ou âge inférieur à 25 ans ; chez la femme avec CK inférieure à 3 fois la normale, un test ADN peut être proposé (conductrice de dystrophine).</p>
<div class="lab">Piège</div><p>Une hyperCKémie isolée ne doit pas faire refuser à tort un traitement par statine.</p>
<div class="lab">Limite</div><p>Recommandation de 2010, preuves de classe IV, abstract seulement.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03012.x" target="_blank" rel="noopener">Kyriakides et al., EFNS hyperCKémie, Eur J Neurol 2010</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-seuils-resp" data-title="Seuils respiratoires de la dystrophie de Duchenne">
<div class="lab">Recrutement des volumes</div><p>Capacité vitale forcée inférieure ou égale à 60 %.</p>
<div class="lab">Toux assistée</div><p>Capacité vitale forcée inférieure à 50 %, débit de pointe à la toux inférieur à 270 L/min ou pression expiratoire maximale inférieure à 60 cmH2O.</p>
<div class="lab">Ventilation nocturne</div><p>Capacité vitale forcée inférieure à 50 %, pression inspiratoire maximale inférieure à 60 cmH2O, pCO2 supérieure à 45 mmHg, SpO2 de base inférieure à 95 % ou critères polysomnographiques. La ventilation non invasive est préférée à la pression positive continue, même en cas d’apnées obstructives.</p>
<div class="lab">Autres</div><p>Trachéotomie dans des indications limitées ; vaccination contre la grippe (inactivée) et le pneumocoque.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-readaptation" data-title="Réadaptation dans la dystrophie de Duchenne">
<div class="lab">Mesures</div><p>Étirements quotidiens (chevilles, genoux, hanches dès le diagnostic ; membres supérieurs après la perte de la marche), orthèses, verticalisation ; exercice aérobie sous-maximal ; évitement de l’exercice excentrique et à haute résistance.</p>
<div class="lab">Rythme</div><p>Évaluation par la réadaptation tous les 4 à 6 mois.</p>
<div class="lab">Dans la DM1</div><p>Évaluation annuelle (déglutition, parole, mobilité, chutes, autonomie) ; exercice d’intensité modérée, aérobie et en résistance, encouragé.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-endocrino-nutrition" data-title="Suivi endocrinien, nutritionnel et digestif">
<div class="lab">Croissance</div><p>Taille tous les 6 mois ; orientation si la vitesse est inférieure à 4 cm par an ou au troisième percentile ; hormone de croissance non recommandée en routine.</p>
<div class="lab">Puberté</div><p>Absence de puberté à 14 ans : endocrinologue ; testostérone en cas d’hypogonadisme confirmé après 14 ans.</p>
<div class="lab">Nutrition et digestif</div><p>Diététicien à chaque visite ; calcium et 25-OH-vitamine D annuels ; dysphagie dépistée régulièrement ; gastrostomie si dénutrition réfractaire, dysphagie modérée à sévère ou déshydratation ; constipation fréquente traitée par laxatifs osmotiques ; reflux.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-coeur-traitement" data-title="Traitement cardiaque de la dystrophie de Duchenne">
<div class="lab">Prévention</div><p>Inhibiteur de l’enzyme de conversion ou antagoniste des récepteurs de l’angiotensine dès environ 10 ans (avis d’experts).</p>
<div class="lab">Insuffisance cardiaque</div><p>Traitement dès les symptômes ou anomalies d’imagerie ; bêtabloquant en cas de dysfonction ; éplérénone d’intérêt à confirmer. Sous vamorolone, l’association avec l’éplérénone ou la spironolactone expose à une hyperkaliémie : le potassium est contrôlé un mois après le début de l’association (information professionnelle suisse AGAMREE®).</p>
<div class="lab">Défibrillateur</div><p>Selon les critères de l’insuffisance cardiaque de l’adulte (fraction d’éjection inférieure à 35 %), avec particularités.</p>
<div class="lab">Limite</div><p>Recommandations partiellement issues du NHLBI (États-Unis) ; aucune posologie lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-os-ortho" data-title="Os, scoliose et chirurgie">
<div class="lab">Os</div><p>Fractures vertébrales fréquentes et souvent asymptomatiques ; radiographie rachidienne de base pour tous, puis répétée. Bisphosphonates intraveineux en première ligne pour les fractures vertébrales modérées à sévères ou de fragilité. La densitométrie ne suffit pas à exclure l’ostéoporose.</p>
<div class="lab">Scoliose</div><p>Surveillance ; avis orthopédique dès 20° ; arthrodèse postérieure si la courbe en position assise dépasse 20 à 30° chez le non-ambulant prépubère non traité par corticoïdes. Les orthèses rachidiennes ne sont pas recommandées.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-grossesse-dm1" data-title="Grossesse dans la dystrophie myotonique de type 1">
<div class="lab">Risques</div><p>Fausse couche, prématurité, insuffisance respiratoire au troisième trimestre, travail inefficace, hémorragie du post-partum.</p>
<div class="lab">Conduite</div><p>Présence néonatale spécialisée ; conseil génétique et diagnostic prénatal ou préimplantatoire.</p>
<div class="lab">Lien</div><p>Risque de forme congénitale chez l’enfant, avec biais de transmission maternelle.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1016/j.nbd.2019.104533" target="_blank" rel="noopener">Lanni, Pearson, DM1 congénitale, Neurobiol Dis 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-pronostic" data-title="Pronostic selon la maladie">
<div class="lab">Duchenne</div><p>Survie améliorée par les soins multidisciplinaires ; décès surtout cardiaque ou respiratoire.</p>
<div class="lab">DM1</div><p>Complications pulmonaires première cause de décès, cardiaques deuxième.</p>
<div class="lab">Mitochondriales de l’adulte</div><p>Survie médiane 33,4 ans après le début des symptômes ; âge médian au décès 55 ans ; atteinte cardiaque associée à une mortalité accrue.</p>
<div class="lab">Becker</div><p>Durée de la maladie corrélée à la sévérité motrice ; insuffisance respiratoire sévère rare, plus fréquente chez le non-ambulant.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1007/s00415-025-13126-9" target="_blank" rel="noopener">Riguzzi et al., cohorte Becker, J Neurol 2025</a> ; <a href="https://doi.org/10.1093/braincomms/fcae041" target="_blank" rel="noopener">Beecher et al., myopathies mitochondriales de l’adulte, Brain Commun 2024</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-lacunes" data-title="Sources non lues et limites">
<div class="lab">Absence de source suisse</div><p>Aucune recommandation suisse (Swiss Medical Forum, société suisse de neurologie, centres neuromusculaires suisses, registre) n’a été lue ; l’épidémiologie suisse manque. Les consensus sur la dystrophie de Duchenne et sur la dystrophie myotonique de type 1 sont internationaux avec forte participation américaine.</p>
<div class="lab">Non lus</div><p>Nomenclature des dystrophies des ceintures (ENMC 2017), guide 2024 de l’hyperthermie maligne, tableau ESC 2022 sur les maladies neuromusculaires, recommandations ESC 2021 de stimulation cardiaque. Myopathies congénitales, myotonies non dystrophiques, paramyotonie, neuromyotonie, dystrophie oculopharyngée, Emery-Dreifuss, dystrophies distales et dystrophie myotonique de type 2 : seulement des abstracts ou rien.</p>
<div class="lab">Statut suisse des médicaments</div><p>Givinostat, mexilétine, déflazacort, ataluren, exon-skipping et thérapie génique : non trouvés dans l’AIPS, non vérifiés directement auprès de Swissmedic. Statut européen actuel de l’ataluren non vérifié.</p>
<div class="lab">Sources nord-américaines</div><p>Plusieurs sources sont américaines et ne servent que de données descriptives, jamais de fondement à une conduite.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1016/j.nmd.2018.05.007" target="_blank" rel="noopener">Straub et al., 229e atelier ENMC LGMD, Neuromuscul Disord 2018</a> ; <a href="https://doi.org/10.1016/j.bja.2024.09.022" target="_blank" rel="noopener">EMHG, crise d’hyperthermie maligne, Br J Anaesth 2024</a> ; <a href="https://doi.org/10.1093/eurheartj/ehac262" target="_blank" rel="noopener">ESC 2022, arythmies ventriculaires et mort subite</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Recherche AIPS (vamorolone, givinostat, mexilétine, déflazacort, ataluren), 15.10.2026</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-sm-faiblesse" data-title="Faiblesse musculaire : topographie et cotation">
<div class="lab">Définition</div><p>La faiblesse est une diminution de la force musculaire, mesurée contre la pesanteur puis contre une résistance. Elle est le signe principal des myopathies, et sa distribution oriente le diagnostic.</p>
<div class="lab">Normal</div><p>Un sujet sain cote 5 sur 5 à chaque muscle de l’échelle du Medical Research Council.</p>
<div class="lab">Technique</div><p>Le patient est réchauffé et informé ; le test est interrompu en cas de fatigue. Chaque muscle est testé autour d’une seule articulation et coté de 0 (aucune contraction) à 5 (force normale) ; le grade 4 peut être subdivisé.</p>
<div class="lab">Mécanisme</div><p>La perte ou la dégénérescence des fibres diminue le nombre d’unités contractiles disponibles ; dans la dystrophie de Duchenne, l’absence de dystrophine fragilise la fibre, qui dégénère.</p>
<div class="lab">Valeur et limite</div><p>Les sources lues ne chiffrent ni sensibilité ni spécificité. La cotation dépend de la coopération du patient.</p>
<p class="src">Références : <a href="https://www.ukri.org/wp-content/uploads/2021/12/MRC-011221-AidsToTheExaminationOfThePeripheralNervousSystem.pdf" target="_blank" rel="noopener">Medical Research Council, mémorandum 45, p. 7 (utilisé avec la permission du Medical Research Council, licence Open Government 3.0)</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.779.799" target="_blank" rel="noopener">Vicino et coll., Rev Med Suisse 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5869704/" target="_blank" rel="noopener">Birnkrant et coll., Lancet Neurol 2018, partie 1</a>, consultées le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-raideur" data-title="Raideur myotonique : la main qui ne lâche pas">
<div class="lab">Définition</div><p>La myotonie est un retard anormal de relaxation du muscle strié ; elle se manifeste par raideur, crampes, blocage, douleur et fatigue.</p>
<div class="lab">Normal</div><p>Le muscle sain se relâche sans retard anormal à la fin de la contraction.</p>
<div class="lab">Questions de caractérisation</div><p>Le médecin demande si le patient peine à lâcher un objet saisi, à parler ou à avaler.</p>
<div class="lab">Valeur</div><p>Fréquence, sensibilité et spécificité non chiffrées dans les sources lues. Le diagnostic de dystrophie myotonique de type 1 repose sur l’analyse de l’expansion CTG.</p>
<div class="lab">Piège</div><p>La myotonie existe dans les myotonies non dystrophiques comme dans les dystrophies myotoniques ; l’atteinte multisystémique (arythmies, cataracte) oriente vers les secondes, et l’analyse génétique confirme.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11977047/" target="_blank" rel="noopener">Cochrane, Drug treatment for myotonia, 2025 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6294540/" target="_blank" rel="noopener">Ashizawa et coll., Neurol Clin Pract 2018</a>, consultées le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-effort" data-title="Intolérance à l’effort">
<div class="lab">Définition</div><p>Le patient ne peut pas soutenir un effort habituel, alors que sa force au repos peut être normale.</p>
<div class="lab">Valeur</div><p>Même sans faiblesse au repos, elle peut indiquer une myopathie. Sa valeur n’est pas chiffrée dans les sources lues.</p>
<div class="lab">Piège</div><p>Les troubles du métabolisme sont exclus de G71 et classés en E70–E90 : une myopathie de cette origine ne relève pas de ce cours.</p>
<p class="src">Références : <a href="https://doi.org/10.53738/REVMED.2022.18.779.799" target="_blank" rel="noopener">Vicino et coll., Rev Med Suisse 2022 (résumé)</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g70-g73.htm" target="_blank" rel="noopener">ICD-10-GM 2024 (BfArM), bloc G70–G73</a>, consultées le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-myalgie" data-title="Myalgies isolées">
<div class="lab">Valeur</div><p>Des myalgies isolées, notamment au repos, ne sont en général pas associées aux myopathies.</p>
<div class="lab">Conséquence</div><p>Une douleur isolée, sans faiblesse cotée ni CK persistante, ne justifie pas à elle seule une exploration lourde.</p>
<p class="src">Références : <a href="https://doi.org/10.53738/REVMED.2022.18.779.799" target="_blank" rel="noopener">Vicino et coll., Rev Med Suisse 2022 (résumé)</a>, consultée le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-hypoventilation" data-title="Hypoventilation nocturne : la plainte arrive tard">
<div class="lab">Mécanisme</div><p>Les muscles respiratoires affaiblis ne maintiennent plus la ventilation pendant le sommeil ; le dioxyde de carbone s’accumule.</p>
<div class="lab">Symptômes</div><p>Fatigue, dyspnée, céphalées matinales ou continues, réveils nocturnes fréquents, hypersomnolence et difficulté de concentration ; certains patients restent asymptomatiques malgré l’hypoventilation.</p>
<div class="lab">Mesure</div><p>Chez le non-ambulant, capacité vitale forcée assise, pressions maximales, débit de pointe à la toux et SpO2 au moins tous les 6 mois ; CO2 de fin d’expiration ou transcutané si la SpO2 est de 95 % ou moins.</p>
<div class="lab">Piège</div><p>L’hypoxémie traduit en général une hypoventilation, une atélectasie ou une pneumonie ; l’oxygène seul n’est pas utilisé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5889091/" target="_blank" rel="noopener">Birnkrant et coll., Lancet Neurol 2018, partie 2</a>, consultée le 16 octobre 2026.</p>
</template>
<template data-pop="g71-sm-cardiaque" data-title="Palpitations, lipothymie et syncope dans la DM1">
<div class="lab">Mécanisme</div><p>La maladie atteint le tissu de conduction et provoque bradycardie sinusale, blocs, fibrillation ou flutter atriaux et tachycardie ventriculaire.</p>
<div class="lab">Conduite</div><p>Palpitations, douleur thoracique, dyspnée, orthopnée, lipothymie et syncope justifient une investigation cardiaque.</p>
<div class="lab">Piège</div><p>L’atteinte cardiaque significative est souvent asymptomatique : l’ECG est fait même sans plainte.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6294540/" target="_blank" rel="noopener">Ashizawa et coll., Neurol Clin Pract 2018</a>, consultée le 16 octobre 2026.</p>
</template>
