<template data-pop="g71-ck-fiche" data-title="Interprétation de la créatine kinase">
<div class="lab">Valeur de référence</div><p>La valeur normale dépend du laboratoire, du sexe et de la population ; les sources lues ne donnent pas d’intervalle chiffré. L’hyperCKémie se définit par rapport à la limite supérieure du laboratoire.</p>
<div class="lab">Seuils</div><p>HyperCKémie : plus de 1,5 fois la limite supérieure de la normale. Biopsie envisagée si CK ≥ 3 fois la normale. Dystrophinopathie typique : CK supérieure à 1000 U/L selon la revue Continuum de 2025 ; le consensus de 2018 ne donne pas ce seuil.</p>
<div class="lab">Pièges</div><p>Jusqu’à 20 % de sujets « normaux » ont une CK élevée. Une élévation de ASAT, ALAT et LDH avec CK élevée et GGT normale est d’origine musculaire.</p>
<div class="lab">Erreur fréquente</div><p>Refuser une statine sur une hyperCKémie isolée, ou attribuer une élévation des transaminases au foie sans doser la CK.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1111/j.1468-1331.2010.03012.x" target="_blank" rel="noopener">Kyriakides et al., EFNS hyperCKémie, Eur J Neurol 2010</a> ; <a href="https://doi.org/10.1212/cont.0000000000001618" target="_blank" rel="noopener">Jayaraman, Ghosh, dystrophinopathies, Continuum 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-emg" data-title="Électromyogramme">
<div class="lab">Rôle</div><p>Il distingue une atteinte myopathique d’autres causes et complète la CK. Un électromyogramme myopathique justifie la biopsie en cas d’hyperCKémie pauci-symptomatique.</p>
<div class="lab">Données lues</div><p>Dans la cohorte mitochondriale adulte : profil myopathique 77 %, potentiels de fibrillation 27 %, neuropathie axonale 42 %.</p>
<div class="lab">Limite</div><p>Les détails du tracé myotonique ne figurent pas dans les sources lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03012.x" target="_blank" rel="noopener">Kyriakides et al., EFNS hyperCKémie, Eur J Neurol 2010</a> ; <a href="https://doi.org/10.1093/braincomms/fcae041" target="_blank" rel="noopener">Beecher et al., myopathies mitochondriales de l’adulte, Brain Commun 2024</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-gen-dmd" data-title="Génétique de Duchenne : stratégie en trois temps">
<div class="lab">Étape 1</div><p>Délétion ou duplication d’un ou plusieurs exons (environ 70 % des patients) : MLPA ou CGH-array. La PCR multiplexe ne détecte que les délétions.</p>
<div class="lab">Étape 2</div><p>Si négatif, séquençage du gène : 25 à 30 % de mutations ponctuelles, petites délétions ou insertions.</p>
<div class="lab">Étape 3</div><p>Si négatif, biopsie musculaire avec recherche de dystrophine par immunohistochimie et Western blot.</p>
<div class="lab">Interprétation</div><p>Les bornes de la délétion ou de la duplication indiquent si le cadre de lecture est préservé ou rompu.</p>
<div class="lab">Erreur fréquente</div><p>Arrêter après une MLPA négative.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-gen-dm1" data-title="Analyse de l’expansion CTG de DMPK">
<div class="lab">Méthodes</div><p>PCR, Southern blot et TP-PCR (triplet repeat-primed PCR).</p>
<div class="lab">Seuils</div><p>Plus de 35 répétitions : mutation en général instable ; 50 ou plus : compatible avec le diagnostic.</p>
<div class="lab">Piège</div><p>Des interruptions de la répétition peuvent modifier le phénotype. La méthode retenue relève du laboratoire.</p>
<div class="lab">Limite</div><p>Standard technique américain (ACMG 2024), utilisé pour la génétique descriptive seulement.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1016/j.gim.2024.101145" target="_blank" rel="noopener">ACMG, test DM1, Genet Med 2024</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-gen-autres" data-title="Autres tests génétiques">
<div class="lab">Facio-scapulo-humérale</div><p>Diagnostic génétique par étapes ; reconnaître les phénocopies.</p>
<div class="lab">Myopathies congénitales</div><p>Séquençage d’exome ou de génome en première ligne chez de nombreux patients.</p>
<div class="lab">Mitochondriales</div><p>Recherche d’un variant pathogène de l’ADN mitochondrial, par exemple m.3243A&gt;G.</p>
<div class="lab">Limite</div><p>Les algorithmes détaillés manquent dans les sources lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.ncl.2020.03.003" target="_blank" rel="noopener">Hamel, Tawil, FSHD, Neurol Clin 2020</a> ; <a href="https://doi.org/10.1111/ene.70588" target="_blank" rel="noopener">Consensus ERN EURO-NMD, MELAS, Eur J Neurol 2026</a> ; <a href="https://doi.org/10.1016/B978-0-323-98818-6.00027-3" target="_blank" rel="noopener">Myopathies congénitales, Handb Clin Neurol 2023</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-biopsie" data-title="Biopsie musculaire">
<div class="lab">Indications</div><p>Génétique négative dans la dystrophie de Duchenne ; hyperCKémie pauci-symptomatique à CK ≥ 3 fois la normale, EMG myopathique ou âge inférieur à 25 ans.</p>
<div class="lab">Lésions élémentaires</div><p>Lésions dystrophiques (dystrophies) ; fibres COX-négatives (médiane 5,1 %), « ragged blue » (1,4 %), « ragged red » (0,5 %) dans les myopathies mitochondriales de l’adulte ; aspects de némaline, de cores, centronucléaires dans les myopathies congénitales.</p>
<div class="lab">Piège</div><p>Les fibres typiques étant rares, une biopsie peu contributive n’exclut pas une maladie mitochondriale.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1111/j.1468-1331.2010.03012.x" target="_blank" rel="noopener">Kyriakides et al., EFNS hyperCKémie, Eur J Neurol 2010</a> ; <a href="https://doi.org/10.1016/S0140-6736(19)32910-1" target="_blank" rel="noopener">Mercuri et al., Muscular dystrophies, Lancet 2019</a> ; <a href="https://doi.org/10.1093/braincomms/fcae041" target="_blank" rel="noopener">Beecher et al., myopathies mitochondriales de l’adulte, Brain Commun 2024</a> ; <a href="https://doi.org/10.1016/B978-0-323-98818-6.00027-3" target="_blank" rel="noopener">Myopathies congénitales, Handb Clin Neurol 2023</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-efr" data-title="Exploration respiratoire">
<div class="lab">Mesures</div><p>Capacité vitale forcée assise (et couchée dans la FSHD), pressions inspiratoire et expiratoire maximales, débit de pointe à la toux, SpO2 ; capnographie si SpO2 inférieure ou égale à 95 % ; gaz du sang et capnographie nocturne dans la FSHD.</p>
<div class="lab">Fréquence</div><p>Dès 5 à 6 ans dans la dystrophie de Duchenne, au moins tous les 6 mois chez le non-ambulant ; capacité vitale forcée de base puis environ tous les 6 mois dans la DM1.</p>
<div class="lab">Valeurs de référence</div><p>Pourcentages de la valeur théorique ; les seuils de décision sont dans la fenêtre des seuils respiratoires. Les intervalles de référence ne sont pas rapportés par les sources lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1016/j.nmd.2026.106419" target="_blank" rel="noopener">Insuffisance respiratoire et sommeil dans la FSHD, Neuromuscul Disord 2026</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-ecg-dm1" data-title="ECG de la dystrophie myotonique de type 1">
<div class="lab">Critères d’atteinte</div><p>Fréquence sinusale inférieure à 50/min, PR supérieur à 200 ms, QRS supérieur à 100 ms, bloc fasciculaire antérieur ou postérieur gauche, ondes Q anormales, tachycardie, fibrillation ou flutter atriaux, arythmies ventriculaires.</p>
<div class="lab">Fréquence du contrôle</div><p>ECG tous les un ou deux ans.</p>
<div class="lab">Piège</div><p>Atteinte souvent asymptomatique : un ECG normal ne dispense pas du suivi, un ECG anormal ou un âge supérieur à 40 ans sans bilan préalable justifie l’orientation cardiologique.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-irm-cardiaque" data-title="IRM cardiaque de la dystrophie de Duchenne">
<div class="lab">Rôle</div><p>Imagerie préférée pour suivre la fonction et la fibrose myocardique ; l’échocardiographie suffit jusqu’à 6 à 7 ans.</p>
<div class="lab">Rythme</div><p>Bilan annuel ; Holter annuel raisonnable dès dysfonction ventriculaire ou fibrose.</p>
<div class="lab">Conductrices</div><p>Dans une étude de 2016, 47 % avaient au moins une anomalie à l’IRM cardiaque.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-nsaa" data-title="North Star Ambulatory Assessment et épreuves chronométrées">
<div class="lab">Rythme</div><p>Tous les 6 mois dans la dystrophie de Duchenne.</p>
<div class="lab">Seuils prédictifs après 7 ans</div><p>Test de marche de 6 minutes inférieur à 325 m, relever supérieur à 30 s, quatre marches supérieures à 8 s, dix mètres au-delà de 10 à 12 s ou score linéarisé inférieur ou égal à 34 : déclin plus rapide dans les 12 mois.</p>
<div class="lab">Limite</div><p>Prédiction de groupe, non destinée à décider seule d’un traitement individuel.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-corticoides" data-title="Glucocorticoïdes dans la dystrophie de Duchenne">
<div class="lab">Mécanisme et rôle</div><p>Ils ralentissent le déclin moteur ; le consensus les place, avec la physiothérapie, au centre de la prise en charge, y compris après la perte de la marche.</p>
<div class="lab">Preuves</div><p>Essai de phase 3 : déflazacort 0,9 et 1,2 mg/kg/jour et prednisone 0,75 mg/kg/jour supérieurs au placebo sur la force, avec moins de prise de poids sous déflazacort. Âge moyen de perte de la marche : 10,0 ans (moins d’un an de corticoïdes), 11,2 ans (prednisone quotidienne), 13,9 ans (déflazacort quotidien).</p>
<div class="lab">Effets et surveillance</div><p>Crise surrénalienne à l’arrêt brutal ; croissance et puberté à suivre ; os à surveiller.</p>
<div class="lab">Statut suisse</div><p>Prednisone Streuli® disponible (indication : glucocorticothérapie, information non lue en détail) ; aucune information suisse trouvée pour le déflazacort.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Recherche AIPS (vamorolone, givinostat, mexilétine, déflazacort, ataluren), 15.10.2026</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-vamorolone" data-title="Vamorolone (AGAMREE®)">
<div class="lab">Indication</div><p>Dystrophie de Duchenne dès 4 ans ; instauration réservée aux spécialistes expérimentés (suspension buvable 40 mg/ml, Santhera).</p>
<div class="lab">Posologie</div><p>6 mg/kg/jour en une prise (moins de 40 kg), réductible à 4 puis 2 mg/kg/jour selon la tolérance ; maximum 240 mg/jour ; dès 40 kg, 240 mg (6 ml) une fois par jour, en traitant à la dose maximale tolérée. Décroissance sur plusieurs semaines, par paliers d’environ 20 %. Insuffisance hépatique modérée : 2 mg/kg/jour (moins de 40 kg) ou 80 mg. Inhibiteurs puissants du CYP3A4 : 4 mg/kg/jour. Passage depuis prednisone ou déflazacort sans interruption, à 6 mg/kg/jour.</p>
<div class="lab">Stress et interactions</div><p>En phase de stress, hydrocortisone systémique ajoutée ; vamorolone seul déconseillé (antagoniste minéralocorticoïde). Avec spironolactone ou éplérénone, potassium contrôlé à un mois. Inducteurs puissants du CYP3A4 (carbamazépine, phénytoïne, rifampicine, millepertuis) : efficacité diminuée, autre traitement à envisager.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité, insuffisance hépatique sévère (Child-Pugh C), vaccins vivants dans les 6 semaines précédentes et pendant le traitement ; vaccination contre la varicelle avant le traitement si non immun.</p>
<div class="lab">Effets indésirables et preuves</div><p>Baisse du cortisol matinal (92,6 % à 6 mg/kg), traits cushingoïdes 28,6 %, insuffisance surrénale aiguë 16,7 %, prise de poids, irritabilité. Étude pivot (121 patients ; 6 et 2 mg/kg contre prednisone 0,75 mg/kg contre placebo) : amélioration significative de la vitesse de relever et du test de marche de 6 minutes à 24 semaines contre placebo. Mise à jour de l’information : octobre 2026.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse AGAMREE® (vamorolone), AIPS</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g71-givinostat" data-title="Givinostat">
<div class="lab">Mécanisme</div><p>Inhibiteur des histone-désacétylases.</p>
<div class="lab">Preuves</div><p>Essai EPIDYS (phase 3, 179 garçons ambulants de 6 ans ou plus sous corticoïdes) : déclin moindre à l’épreuve des quatre marches à 72 semaines (rapport 0,86 ; intervalle de confiance à 95 % de 0,745 à 0,989 ; p = 0,035).</p>
<div class="lab">Effets indésirables</div><p>Diarrhée 36 %, vomissements 29 %.</p>
<div class="lab">Statut</div><p>Autorisation européenne conditionnelle depuis le 6 juin 2025, chez le patient ambulant de 6 ans ou plus traité par corticoïdes. Aucune information professionnelle suisse trouvée ; essai financé par le fabricant ; ne pas présenter comme autorisé en Suisse.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(24)00036-X" target="_blank" rel="noopener">Mercuri et al., givinostat EPIDYS, Lancet Neurol 2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Recherche AIPS (vamorolone, givinostat, mexilétine, déflazacort, ataluren), 15.10.2026</a> ; <a href="https://www.ema.europa.eu/en/medicines/human/EPAR/duvyzat" target="_blank" rel="noopener">EMA, Duvyzat (givinostat), page EPAR</a>, consultées le 15 et le 16 octobre 2026.</p></template>
<template data-pop="g71-ataluren" data-title="Ataluren et thérapies ciblées">
<div class="lab">Principe</div><p>Thérapie ciblant la mutation de type codon stop, qui concerne environ 11 % des patients.</p>
<div class="lab">Statut</div><p>Autorisation conditionnelle européenne accordée le 31 juillet 2014. La Commission européenne a refusé son renouvellement le 28 mars 2025, car l’efficacité n’a pas été confirmée : l’autorisation a expiré et l’ataluren n’est plus autorisé dans l’Union européenne. Aucune information professionnelle suisse n’a été trouvée.</p>
<div class="lab">Limite</div><p>Exon-skipping et thérapie génique : non lus.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Recherche AIPS (vamorolone, givinostat, mexilétine, déflazacort, ataluren), 15.10.2026</a> ; <a href="https://www.ema.europa.eu/en/medicines/human/EPAR/translarna" target="_blank" rel="noopener">EMA, Translarna (ataluren), page EPAR</a>, consultées le 15 et le 16 octobre 2026.</p></template>
<template data-pop="g71-mexiletine" data-title="Mexilétine : preuves, bilan cardiaque, limites">
<div class="lab">Preuves</div><p>Cochrane 2025 : dans la DM1, la mexilétine réduit probablement le temps de relaxation de la préhension (différence moyenne 1,37 s ; certitude modérée), sans amélioration démontrée de la myotonie clinique ni de la qualité de vie ; dans les myotonies non dystrophiques, elle réduit probablement la raideur.</p>
<div class="lab">Effets indésirables</div><p>Surtout digestifs, léthargie, céphalées.</p>
<div class="lab">Sécurité cardiaque</div><p>Bilan cardiaque requis avant et pendant le traitement (effet pro-arythmique de classe Ib), surveillance renforcée dans la dystrophie myotonique ; le consensus la contre-indique en cas d’atteinte cardiaque.</p>
<div class="lab">Statut</div><p>Dans l’Union européenne, Namuscla® est autorisé pour le traitement symptomatique de la myotonie des troubles myotoniques non dystrophiques ; son emploi dans la dystrophie myotonique de type 1 est hors indication. Aucune information professionnelle suisse trouvée pour la mexilétine ; posologie non rapportée.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://doi.org/10.1002/14651858.CD004762.pub3" target="_blank" rel="noopener">Spillane et al., Cochrane, traitement de la myotonie, 2025</a> ; <a href="https://doi.org/10.1016/j.nmd.2024.104464" target="_blank" rel="noopener">Experts français, mexilétine et cœur (myotonies non dystrophiques), 2024</a> ; <a href="https://doi.org/10.1016/j.acvd.2024.03.001" target="_blank" rel="noopener">Experts français, mexilétine dans la dystrophie myotonique, 2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Recherche AIPS (vamorolone, givinostat, mexilétine, déflazacort, ataluren), 15.10.2026</a> ; <a href="https://www.ema.europa.eu/en/medicines/human/EPAR/namuscla" target="_blank" rel="noopener">EMA, Namuscla (mexilétine), page EPAR</a>, consultées le 15 et le 16 octobre 2026.</p></template>
<template data-pop="g71-modafinil" data-title="Modafinil dans la DM1">
<div class="lab">Indication</div><p>Somnolence diurne excessive si une cause centrale est suspectée, selon le consensus DM1.</p>
<div class="lab">Statut suisse</div><p>Modasomil® est autorisé en Suisse pour la somnolence excessive associée à une narcolepsie, avec ou sans cataplexie : son emploi dans la dystrophie myotonique est <b>hors indication</b>. La posologie n’a pas été reprise.</p>
<div class="lab">Bilan préalable</div><p>Échelle d’Epworth et étude du sommeil si suspicion.</p>
<p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680552720064" target="_blank" rel="noopener">Information professionnelle suisse Modasomil® (modafinil), Swissmedic (AIPS via AmiKo), mise à jour d’octobre 2026</a>, consultées le 15 et le 16 octobre 2026.</p></template>
<template data-pop="g71-mnemo" data-title="Aide mémoire : trois questions avant de prescrire">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Avant toute prescription ou intervention chez un patient myopathe, se poser trois questions : le <b>C</b>œur est-il évalué, la <b>C</b>apacité vitale est-elle connue, la <b>C</b>orticothérapie ou l’anesthésie sont-elles préparées ?</p>
<div class="lab">Limite</div><p>Cette phrase ne remplace aucun critère diagnostique ou thérapeutique ; elle rappelle seulement l’ordre des vérifications issues des consensus lus.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30024-3" target="_blank" rel="noopener">Birnkrant et al., DMD part 1, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1016/S1474-4422(18)30025-5" target="_blank" rel="noopener">Birnkrant et al., DMD part 2, Lancet Neurol 2018</a> ; <a href="https://doi.org/10.1212/CPJ.0000000000000531" target="_blank" rel="noopener">Ashizawa et al., DM1, Neurol Clin Pract 2018</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="pareto-g71-definition" data-title="Pareto — Définition, classification et fréquence">
<p class="ratio" data-cover="g71-0,g71-1,g71-2"></p><ul><li data-src="S1,S2">G71 réunit dystrophies, myotonies, myopathies congénitales, myopathie mitochondriale et autres affections musculaires primitives ; myosites et maladies métaboliques en sont exclues.</li><li data-src="S17">Famille orientée par l’âge, la topographie et les atteintes extramusculaires ; sous-type utile car cœur et poumon varient.</li><li data-src="S3,S6">Aucun chiffre suisse lu ; Duchenne 15,9 à 19,5 pour 100 000 naissances masculines ; DM1 de 1/3000 à 1/8000.</li></ul></template>
<template data-pop="pareto-g71-mecanismes" data-title="Pareto — Mécanismes et génétique">
<p class="ratio" data-cover="g71-3,g71-4"></p><ul><li data-src="S3">Duchenne : dystrophine absente, fibre fragile, récessif lié à l’X ; conductrices à surveiller.</li><li data-src="S6,S31">DM1 : expansion CTG de DMPK, ARN toxique, autosomique dominant, anticipation, forme congénitale par la mère.</li><li data-src="S14,S35,S26">FSHD : DUX4 dérépressé ; mitochondriales : complexes I à V ; congénitales : huit gènes majeurs.</li></ul></template>
<template data-pop="pareto-g71-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g71-5,g71-6"></p><ul><li data-src="S3,S15">Garçon : retard moteur, Gowers, mollets, CK élevée ; transaminases d’origine musculaire.</li><li data-src="S6,S12">Adulte : myotonie, ptosis, cataracte, troubles du rythme (DM1) ; visage et scapula asymétriques (FSHD).</li><li data-src="S4">Examiner aussi œil, cœur, respiration, croissance ; ne pas se fier à la dyspnée ni à la classe NYHA.</li></ul></template>
<template data-pop="pareto-g71-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="g71-7"></p><ul><li data-src="S9">HyperCKémie : plus de 1,5 fois la normale ; biopsie si ≥ 3 fois, EMG myopathique ou âge inférieur à 25 ans.</li><li data-src="S3">Duchenne : MLPA ou CGH-array, puis séquençage, puis biopsie avec dystrophine.</li><li data-src="S1,S37">Différentiels : myosites, maladies métaboliques, hépatopathie évoquée à tort, myasthénie face à l’OEPC.</li></ul></template>
<template data-pop="pareto-g71-urgences" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="g71-8"></p><ul><li data-src="S3">Crise surrénalienne : hydrocortisone 50 mg (moins de 2 ans) ou 100 mg ; doses de stress 50 à 100 mg/m²/jour.</li><li data-src="S4,S6,S28">Anesthésie : éviter volatils et suxaméthonium dans la Duchenne ; précautions dans la DM1 ; pas de dantrolène prophylactique.</li><li data-src="S4">Infection respiratoire : toux assistée si SpO2 inférieure à 95 % ; oxygène seul à éviter.</li></ul></template>
<template data-pop="pareto-g71-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g71-9"></p><ul><li data-src="S3,S5">Corticoïdes et physiothérapie sont les piliers ; seul le vamorolone a une fiche suisse lue.</li><li data-src="S4">Seuils respiratoires : CVF ≤ 60 %, puis moins de 50 % pour toux assistée et ventilation nocturne.</li><li data-src="S6,S19">DM1 : surveiller poumon et cœur ; mexilétine contre-indiquée en cas d’atteinte cardiaque.</li></ul></template>
<template data-pop="pareto-g71-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g71-10,g71-11"></p><ul><li data-src="S3,S4,S6">Suivi programmé : NSAA 6 mois, spirométrie 6 mois, cœur annuel (DMD) ; ECG tous les un ou deux ans (DM1).</li><li data-src="S4,S24">Décès par atteinte respiratoire ou cardiaque ; mitochondriales : survie médiane 33,4 ans.</li><li data-src="S4,S6">Conductrices : bilan cardiaque tous les 3 à 5 ans ; grossesse DM1 : risques maternels et néonataux.</li></ul></template>
<template data-pop="pareto-g71-criteres" data-title="Pareto — Critères et paramètres">
<p class="ratio" data-cover="g71-12"></p><ul><li data-src="S9,S6">CK supérieure à 1,5 fois la normale ; plus de 35 répétitions CTG instables, 50 ou plus compatibles.</li><li data-src="S23">MELAS : épisode pseudo-vasculaire avec variant de l’ADN mitochondrial, m.3243A&gt;G surtout.</li><li data-src="S5,S3">Vamorolone 6 mg/kg/jour, maximum 240 mg/jour ; hydrocortisone d’urgence 50 ou 100 mg.</li></ul></template>
<template data-pop="pareto-g71-examens-1" data-title="Pareto — Hiérarchie et CK">
