<section class="ilot" id="c93-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées. Trois situations cliniques très différentes se rangent sous la même rubrique « leucémie monocytaire », et la première tâche du médecin consiste à reconnaître laquelle il a devant lui.</p><p><b>Première situation.</b> Un homme de 76 ans, adressé après un hémogramme de routine, présente des <button class="w" data-k="c93-monocytose">monocytes à 1,4 G/l</button>, soit plus de 10 % des leucocytes, une anémie modérée et une rate palpable. L’anomalie persiste depuis plus de trois mois. Le médecin doit d’abord écarter une monocytose réactive (infection, sepsis, tuberculose, infection par le <button class="w" data-k="c93-dd-reactive">virus de l’immunodéficience humaine</button>, maladie auto-immune), puis évoquer une <button class="w" data-k="c93-lmmc-def">leucémie myélomonocytaire chronique</button> (<button class="w" data-k="c93-nosologie">C93.1</button>). Il la confirme par le frottis, la moelle, le caryotype, la biologie moléculaire et la cytométrie, la stratifie avec le <button class="w" data-k="c93-cpss">score pronostique CPSS</button> et choisit entre surveillance, cytoréduction, agent hypométhylant et allogreffe <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">(Onkopedia, 2023)</a>.</p><p><b>Deuxième situation.</b> Un adulte présente une hyperplasie gingivale, des nodules cutanés et une hyperleucocytose. Il faut penser à une <button class="w" data-k="c93-lam-m5">leucémie aiguë monoblastique ou monocytaire</button> (<button class="w" data-k="c93-nosologie">C93.0</button>), traiter sans délai les <button class="w" data-k="c93-urgences-aigue">urgences</button> (leucostase, coagulation intravasculaire disséminée, lyse tumorale) et orienter le patient vers un centre d’hématologie <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">(Onkopedia, 2025)</a>.</p><p><b>Troisième situation.</b> Un nourrisson de moins de deux ans a une rate volumineuse et une monocytose supérieure à 1 G/l. Cette association évoque la <button class="w" data-k="c93-lmmj-def">leucémie myélomonocytaire juvénile</button> (<button class="w" data-k="c93-nosologie">C93.3</button>) <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8305558/" target="_blank" rel="noopener">(revue 2021)</a>.</p><p><b>Objectifs.</b> À la fin du chapitre, le lecteur sait distinguer ces trois entités et la monocytose réactive, appliquer les seuils de définition, choisir les examens qui tranchent, repérer l’urgence et justifier la conduite en Suisse à partir des informations professionnelles Swissmedic.</p><div class="key"><b>À retenir.</b> Une monocytose n’est pas une leucémie : la durée (au moins trois mois), la dysplasie, la clonalité et l’absence de cause réactive font la différence. Le code C93 réunit des maladies d’âges, de mécanismes et de traitements différents.</div></section>

<section class="ilot" id="c93-1"><h2><span class="n">1</span>Nosologie, définitions et classifications</h2><h3>Les codes de la CIM-10-GM 2024</h3><p>Le code <button class="w" data-k="c93-nosologie">C93 « Leucémie monocytaire »</button> comporte cinq sous-catégories. Le cinquième caractère indique le statut de la maladie : 0 pour « sans mention de rémission complète » (la rémission partielle y figure), 1 pour « en rémission complète » <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024)</a>. La rémission complète est donc une notion codée et non un simple commentaire de dossier.</p><table class="t"><tr><th>Code</th><th>Entité</th><th>Précisions de la classification</th></tr><tr><td>C93.0</td><td>Leucémie monoblastique ou monocytaire aiguë</td><td>Inclut la leucémie aiguë myéloïde de type <button class="w" data-k="c93-lam-m5">M5, M5a et M5b</button></td></tr><tr><td>C93.1</td><td>Leucémie myélomonocytaire chronique</td><td>Inclut la leucémie monocytaire chronique, les formes 1 et 2, la forme avec éosinophilie ; exclue de C92.1 (leucémie myéloïde chronique <button class="w" data-k="c93-bcr-abl">BCR::ABL1</button> positive)</td></tr><tr><td>C93.3</td><td>Leucémie myélomonocytaire juvénile</td><td>Entité pédiatrique</td></tr><tr><td>C93.7</td><td>Autres leucémies monocytaires</td><td>Code résiduel, sans entité individualisée dans les sources lues</td></tr><tr><td>C93.9</td><td>Leucémie monocytaire, sans précision</td><td>Code résiduel : signale un diagnostic insuffisamment précisé</td></tr></table><p>Le tableau montre que seuls trois codes décrivent une maladie reconnaissable ; C93.7 et C93.9 ne servent qu’à coder une précision manquante. Le code additionnel C95.8! s’ajoute lorsque la leucémie est réfractaire à l’induction standard.</p><div class="trap"><span class="k">Piège</span> La <button class="w" data-k="c93-m4">leucémie aiguë myélomonocytaire (M4, y compris M4 avec éosinophiles et inversion du chromosome 16)</button> n’est pas codée C93 mais C92.5. Elle contient des monocytes, mais la classification la range avec les leucémies myéloïdes.</div><h3>Leucémie myélomonocytaire chronique : définition de l’OMS 2022</h3><p>La cinquième édition de la classification de l’<button class="w" data-k="c93-sources-guides">OMS</button> (2022), reprise par Onkopedia en 2023, pose un prérequis et des critères de soutien <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">(OMS 2022)</a>.</p><ul><li><b>Prérequis.</b> Une <button class="w" data-k="c93-monocytose">monocytose persistante</button> absolue d’au moins 0,5 G/l et relative d’au moins 10 % ; moins de 20 % de blastes dans le sang et la moelle, les <button class="w" data-k="c93-promonocyte">promonocytes</button> étant comptés comme équivalents blastiques ; absence de leucémie myéloïde chronique <button class="w" data-k="c93-bcr-abl">BCR::ABL1</button> positive, d’autres néoplasmes myéloprolifératifs et de néoplasies avec fusion d’une tyrosine kinase.</li><li><b>Critères de soutien.</b> Dysplasie d’au moins une lignée (plus de 10 % des cellules) ; anomalie clonale cytogénétique ou moléculaire acquise ; répartition anormale des sous-populations monocytaires en <button class="w" data-k="c93-cytometrie-mono">cytométrie en flux</button>.</li></ul><p>La règle des <button class="w" data-k="c93-criteres-soutien">critères de soutien</button> dépend de l’intensité de la monocytose. Si les monocytes atteignent 1,0 G/l ou plus, un seul critère suffit. Entre 0,5 et moins de 1,0 G/l, il faut la dysplasie et l’anomalie clonale. Cette exigence plus stricte compense la moindre spécificité d’une monocytose modeste : l’abaissement du seuil de 1,0 à 0,5 G/l fait entrer dans la définition la forme dite oligomonocytaire, que les infections et l’inflammation peuvent aussi imiter.</p><h3>Sous-types</h3><table class="t"><tr><th>Critère</th><th>Sous-type</th><th>Seuil</th></tr><tr><td>Leucocytes</td><td>Forme dysplasique</td><td>moins de 13 G/l</td></tr><tr><td>Leucocytes</td><td>Forme proliférative</td><td>13 G/l ou plus</td></tr><tr><td>Blastes (promonocytes inclus)</td><td>LMMC-1</td><td>moins de 5 % dans le sang et moins de 10 % dans la moelle</td></tr><tr><td>Blastes (promonocytes inclus)</td><td>LMMC-2</td><td>5 à 19 % dans le sang et 10 à 19 % dans la moelle</td></tr><tr><td>Blastes</td><td>Leucémie aiguë myéloïde</td><td>20 % ou plus</td></tr></table><p>L’OMS 2022 a supprimé la catégorie LMMC-0. Le seuil de 13 G/l sépare la forme à cytopénies de la forme à prolifération : il oriente le tableau clinique et le traitement, comme les sections suivantes le montrent. Onkopedia note une incohérence de rédaction du seuil de la forme 1 (moins de 5 % dans le texte, 4 % ou moins dans un tableau) ; la leçon retient le texte. La classification internationale de consensus (<button class="w" data-k="c93-icc">ICC</button>) 2022 diffère peu de celle de l’OMS. Enfin, la mutation <button class="w" data-k="c93-kit">KIT D816V</button> doit être exclue pour ne pas méconnaître une mastocytose systémique associée.</p><h3>Leucémie aiguë à différenciation monocytaire</h3><p>Une leucémie aiguë myéloïde se définit par au moins 20 % de blastes dans le sang, la moelle ou un tissu, sauf pour les entités définies génétiquement. L’OMS 2022 supprime ce seuil pour la plupart de ces anomalies (sauf <button class="w" data-k="c93-bcr-abl">BCR::ABL1</button> et CEBPA), et les réarrangements de <button class="w" data-k="c93-kmt2a">KMT2A</button> se diagnostiquent avec moins de 20 % de blastes ; l’ICC retient 10 % <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">(OMS 2022)</a>. La <button class="w" data-k="c93-lam-m5">leucémie aiguë myéloïde monocytaire</button> est définie par la différenciation : au moins 80 % de monocytes, monoblastes et promonocytes, moins de 20 % de cellules granuleuses en maturation, et des blastes exprimant au moins deux marqueurs monocytaires (CD11c, CD14, CD36, CD64) ou positifs à l’estérase non spécifique. La forme myélomonocytaire, codée C92.5, exige à l’inverse au moins 20 % de monocytes et au moins 20 % de granuleux en maturation.</p><h3>Forme juvénile</h3><p>La <button class="w" data-k="c93-lmmj-def">leucémie myélomonocytaire juvénile</button> est une leucémie pédiatrique rare, à la frontière des syndromes myélodysplasiques et des néoplasmes myéloprolifératifs. L’OMS 2022 la classe parmi ces derniers, exclut les réarrangements de KMT2A et retire la monosomie 7 des critères cytogénétiques, au profit de l’activation de la voie <button class="w" data-k="c93-ras">RAS</button> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">(OMS 2022)</a>.</p><div class="trap"><span class="k">Erreur fréquente</span> Chiffrer de mémoire les seuils qui distinguent M5a et M5b. Les sources de cette leçon donnent l’inclusion de la classification mais pas ces seuils : ils ne sont donc pas chiffrés ici.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., classification OMS 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMMC 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8305558/" target="_blank" rel="noopener">Mayerhofer et al., 2021</a>.</p></section>

<section class="ilot" id="c93-2"><h2><span class="n">2</span>Épidémiologie</h2><p>L’épidémiologie sert ici à reconnaître le terrain : une monocytose chez un homme âgé n’appelle pas la même hypothèse que chez un nourrisson.</p><table class="t"><tr><th>Entité</th><th>Fréquence</th><th>Terrain</th></tr><tr><td>Leucémie myélomonocytaire chronique</td><td>Environ 20 % des syndromes myélodysplasiques dans le cadre d’Onkopedia ; incidence de 0,5 à 1,0 pour 100 000 par an</td><td>Âge médian au diagnostic d’environ 76 ans ; prédominance masculine</td></tr><tr><td>Leucémie aiguë myéloïde (toutes formes)</td><td>Environ 3,7 pour 100 000 par an ; plus de 100 pour 100 000 après 70 ans</td><td>Âge médian de 72 ans (registre suédois)</td></tr><tr><td>Leucémie myélomonocytaire juvénile</td><td>1,2 enfant par million et par an, environ 2 % des hémopathies malignes pédiatriques</td><td>La moitié des cas avant 2 ans ; deux tiers de garçons</td></tr></table><p>La prévalence de la leucémie myélomonocytaire chronique croît avec le vieillissement de la population <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">(Onkopedia 2023)</a>. La source présente le rapport hommes-femmes de façon discordante (environ 3 pour 1 dans la section d’épidémiologie, « environ deux fois » ailleurs) : la leçon retient seulement une prédominance masculine. Les chiffres de la leucémie aiguë viennent d’Onkopedia 2025 <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">(Onkopedia 2025)</a>, ceux de la forme juvénile de la revue de 2021 <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8305558/" target="_blank" rel="noopener">(Mayerhofer et al.)</a>.</p><div class="alert"><b>Lacunes assumées.</b> Aucune donnée suisse spécifique (registre) n’a été lue, et la part des leucémies de type M5 parmi les leucémies aiguës myéloïdes n’est documentée dans aucune source de ce dossier. Ces chiffres ne sont pas estimés.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMMC 2023</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LAM 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8305558/" target="_blank" rel="noopener">Mayerhofer et al., 2021</a>.</p></section>

<section class="ilot" id="c93-3"><h2><span class="n">3</span>Du monocyte normal à la clonalité</h2><p>Les monocytes sont des cellules sanguines issues de la moelle osseuse ; ils quittent la circulation pour devenir macrophages. Le sang en contient normalement peu, et une monocytose de plus de 0,5 G/l signale soit une réaction à un stimulus, soit une prolifération autonome. Toute la leçon repose sur cette alternative : la cause réactive disparaît avec le stimulus, la cause clonale persiste.</p><h3>La leucémie myélomonocytaire chronique : une hématopoïèse clonale</h3><p>Les techniques de séquençage de nouvelle génération trouvent des mutations somatiques chez plus de 90 % des patients <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">(Onkopedia 2023)</a>. Elles touchent quatre grandes fonctions, et le tableau les regroupe pour que le lecteur retienne la logique plutôt qu’une liste de gènes.</p><table class="t"><tr><th>Fonction perturbée</th><th>Gènes</th><th>Fréquence indiquée</th></tr><tr><td>Régulation épigénétique</td><td><button class="w" data-k="c93-mutations">TET2, ASXL1</button>, DNMT3A, IDH1, IDH2, EZH2</td><td>TET2 environ 60 %, ASXL1 environ 40 %</td></tr><tr><td>Épissage de l’ARN</td><td>SRSF2, SF3B1, U2AF1</td><td>SRSF2 environ 50 %</td></tr><tr><td>Réparation de l’ADN</td><td>TP53</td><td>non précisée</td></tr><tr><td>Signalisation et transcription</td><td>JAK2, gènes de la voie <button class="w" data-k="c93-ras">RAS</button>, RUNX1</td><td>RAS 10 à 30 %</td></tr></table><p>Ces mutations ont deux conséquences pratiques. Elles fournissent d’abord une preuve de clonalité, donc un critère de soutien du diagnostic. Elles entrent ensuite dans le pronostic : ASXL1, NRAS, RUNX1 et SETBP1 alimentent le score <button class="w" data-k="c93-cpss">CPSS-mol</button>.</p><h3>Pourquoi les monocytes s’accumulent</h3><p>Onkopedia rapporte une <button class="w" data-k="c93-alpha-defensines">hypothèse</button> : les granuleux dysplasiques produiraient des α-défensines qui freineraient la différenciation des monocytes. Cette hypothèse n’est pas vérifiée dans la source primaire et ne doit pas être présentée comme un fait établi. La signature cytométrique, elle, est mesurable : les monocytes classiques CD14 positifs et CD16 négatifs s’accumulent, et leur proportion au-delà de 94 % distingue la leucémie myélomonocytaire chronique d’une monocytose réactive.</p><h3>Leucémie aiguë et forme juvénile</h3><p>Dans la leucémie aiguë à différenciation monocytaire, les blastes se différencient dans la lignée monocytaire. Les réarrangements de <button class="w" data-k="c93-kmt2a">KMT2A</button> s’observent chez 5 à 15 % des leucémies aiguës myéloïdes, avec un pronostic défavorable ; chez l’adulte, la blastose est souvent élevée et la différenciation habituellement monocytaire <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">(OMS 2022)</a>. Un fait de pharmacologie en découle : la différenciation monocytaire, définie par la coexpression d’au moins deux marqueurs CD4, CD36, CD64, prédit une moindre réponse à l’association vénétoclax-azacitidine <a href="https://doi.org/10.1182/bloodadvances.2024015734" target="_blank" rel="noopener">(étude de 2025)</a>.</p><p>Dans la forme juvénile, la voie de signalisation RAS est hyperactivée par des mutations de PTPN11, NRAS, KRAS, NF1 ou CBL. Une hypersensibilité au GM-CSF a été décrite, aujourd’hui largement dispensable au diagnostic <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8305558/" target="_blank" rel="noopener">(Mayerhofer et al.)</a>.</p><div class="key"><b>Corrélation clinique.</b> Une monocytose avec dysplasie et mutation acquise est clonale ; avec une cause infectieuse évidente, elle est réactive. La cytométrie (CD14 positif et CD16 négatif au-delà de 94 %) tranche les cas où l’histoire clinique hésite.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMMC 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8305558/" target="_blank" rel="noopener">Mayerhofer et al., 2021</a> ; <a href="https://doi.org/10.1182/bloodadvances.2024015734" target="_blank" rel="noopener">Prognostic significance of monocytic-like phenotype, 2025</a>.</p></section>

<section class="ilot" id="c93-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Chercher la cause d’une leucémie ne sert pas à la traiter, mais à adapter la prévention, l’information familiale et le pronostic.</p><table class="t"><tr><th>Entité</th><th>Facteurs identifiés</th><th>Conséquence pratique</th></tr><tr><td>Leucémie myélomonocytaire chronique</td><td>Solvants organiques, radiothérapie antérieure, iode radioactif, chimiothérapie ; benzène discuté (fumée de tabac), fumeurs à risque plus élevé ; maladies auto-immunes et inflammation chronique ; rares mutations germinales (DDX41)</td><td>Rechercher l’exposition professionnelle et les traitements antérieurs. La forme post-thérapeutique représente environ 10 % des cas, avec une latence médiane d’environ 6 ans et un pronostic défavorable</td></tr><tr><td>Leucémie aiguë myéloïde</td><td>Prédisposition germinale (DDX41, CEBPA, RUNX1) ; forme post-thérapeutique myélo-monoblastique typiquement avec t(9;11)</td><td>Rechercher une histoire familiale évocatrice</td></tr><tr><td>Leucémie myélomonocytaire juvénile</td><td>Syndrome de Noonan (trouble myéloprolifératif associé, souvent spontanément résolutif) ; mutation germinale CBL (résolution spontanée fréquente)</td><td>Une surveillance sans traitement peut se discuter</td></tr></table><p>Les manifestations auto-immunes, détaillées à la section suivante, peuvent précéder le diagnostic de plusieurs années <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">(Onkopedia 2023)</a>.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMMC 2023</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LAM 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8305558/" target="_blank" rel="noopener">Mayerhofer et al., 2021</a>.</p></section>

<section class="ilot" id="c93-5"><h2><span class="n">5</span>Interroger</h2><p>L’interrogatoire cherche trois choses : la durée et la tolérance de l’anomalie, les causes réactives possibles et les expositions à risque. Il se déroule différemment selon l’entité.</p><h3>Leucémie myélomonocytaire chronique</h3><p>La découverte est souvent fortuite, sur un hémogramme de contrôle. Les symptômes dépendent du sous-type. La forme dysplasique donne des cytopénies : infections à répétition, saignements, besoins transfusionnels. La forme proliférative donne une <button class="w" data-k="c93-splenomegalie">splénomégalie</button> (environ 50 % des cas) et, en cas d’hyperleucocytose, des infiltrations extramédullaires de la peau, de la plèvre ou du péritoine <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">(Onkopedia 2023)</a>.</p><p>Il faut demander explicitement les manifestations <button class="w" data-k="c93-auto-immunite">auto-immunes</button> (environ 20 % des patients) : vascularite, purpura thrombopénique immunologique, psoriasis, polyarthrite rhumatoïde, syndrome de Sweet. Elles précèdent parfois la leucémie de plusieurs années. L’interrogatoire recherche aussi les expositions des causes de la section 4.</p><div class="trap"><span class="k">Piège</span> Une hausse isolée des monocytes ne prouve pas une progression de la maladie : une infection peut la produire. Avant de conclure à une aggravation, on cherche donc une cause infectieuse.</div><h3>Leucémie aiguë à différenciation monocytaire</h3><p>Les symptômes traduisent d’abord les cytopénies. Une leucocytose existe chez environ 60 % des patients atteints de leucémie aiguë myéloïde. Les atteintes extramédullaires sont fréquentes dans les formes monoblastiques et myélomonocytaires : <button class="w" data-k="c93-infiltrats">infiltrats cutanés, hyperplasie gingivale</button>, atteinte méningée, infiltration de la rate ou du foie. Une coagulation intravasculaire disséminée et une hyperfibrinolyse sont possibles <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">(Onkopedia 2025)</a>.</p><h3>Leucémie myélomonocytaire juvénile</h3><p>L’enfant présente le plus souvent une splénomégalie, parfois une hépatomégalie et des adénopathies. L’atteinte pulmonaire se manifeste par une toux sèche, une tachypnée et des infiltrats interstitiels. La peau montre des lésions eczématiformes, des papules ou des nodules, des pétéchies. Le système nerveux central est rarement atteint <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8305558/" target="_blank" rel="noopener">(Mayerhofer et al.)</a>.</p><div class="two"><div class="card"><b>Forme dysplasique (leucocytes sous 13 G/l)</b><p>Cytopénies dominantes : infections, saignements, anémie, besoin transfusionnel.</p></div><div class="card"><b>Forme proliférative (13 G/l ou plus)</b><p>Splénomégalie, infiltrations extramédullaires, hyperleucocytose ; hydroxyurée comme premier choix.</p></div></div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myelomonozytaere-leukaemie-cmml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMMC 2023</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LAM 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8305558/" target="_blank" rel="noopener">Mayerhofer et al., 2021</a>.</p></section>

<section class="ilot" id="c93-6"><h2><span class="n">6</span>Examiner</h2><p>L’examen clinique est orienté par l’interrogatoire : on cherche les signes de cytopénie, de masse tumorale et d’infiltration. Il sert aussi de point de départ au suivi, car la taille de la rate se compare d’un contrôle à l’autre.</p><div class="two"><div class="card"><b>Cytopénies et saignement</b><p>Pâleur de l’anémie, pétéchies et ecchymoses de la thrombopénie, fièvre et foyer infectieux de la neutropénie. L’<button class="w" data-k="c93-ecog">état général (ECOG)</button> conditionne l’aptitude au traitement intensif.</p></div><div class="card"><b>Masse tumorale</b><p>Rate (<button class="w" data-k="c93-splenomegalie">splénomégalie</button>), foie, ganglions, en particulier chez l’enfant.</p></div><div class="card"><b>Infiltration cutanée et muqueuse</b><p>Nodules cutanés, <button class="w" data-k="c93-infiltrats">hyperplasie gingivale</button>, lésions eczématiformes chez l’enfant.</p></div><div class="card"><b>Atteinte pulmonaire et séreuse</b><p>Toux sèche et tachypnée chez l’enfant ; épanchement pleural ou péritonéal dans les infiltrations de la forme proliférative.</p></div></div><p>Le bilan comprend une imagerie de la rate, que les recommandations rangent parmi les examens obligatoires. Les autres causes de splénomégalie (hépatopathie, maladies de surcharge, infections) sont écartées avant d’attribuer la rate à la leucémie.</p><div class="key"><b>À retenir.</b> Chez l’adulte âgé, rate palpable plus monocytose persistante plus cytopénie orientent vers la leucémie myélomonocytaire chronique ; chez l’enfant de moins de 2 ans, la splénomégalie avec monocytose oriente vers la forme juvénile ; l’hyperplasie gingivale et les nodules cutanés orientent vers la forme aiguë monoblastique.</div><button class="pareto-btn ui" data-k="pareto-c93-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
