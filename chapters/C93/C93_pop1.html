<template data-pop="c93-sources-guides" data-title="Sources, niveau de preuve et lacunes"><h3>Sources utilisées</h3><p>Cette leçon repose sur treize sources lues : la classification suisse et allemande des maladies (BfArM, OFS), deux recommandations Onkopedia (leucémie myélomonocytaire chronique, mars 2023 ; leucémie aiguë myéloïde, septembre 2025), la classification de l’<button class="w" data-k="c93-sources-guides">OMS</button> 2022, les recommandations 2022 du réseau européen LeukemiaNet sur la leucémie aiguë myéloïde (résumé), une revue sur la forme juvénile (2021), une étude de 2025 sur le phénotype monocytaire et cinq informations professionnelles suisses (azacitidine, vénétoclax, Vyxeos®, Dacogen®, Litalir®).</p><p>Onkopedia est un guide commun aux sociétés allemande, autrichienne et suisse d’hématologie et d’oncologie ; la <button class="w" data-k="c93-sources-guides">SGH/SSH</button> (Société suisse d’hématologie) et la <button class="w" data-k="c93-sources-guides">SGMO</button> (oncologie médicale) figurent parmi les éditeurs. Aucun article du Swiss Medical Forum n’a été lu sur ce sujet.</p><h3>Lacunes</h3><ul><li>Seuils M5a et M5b : non lus, donc non chiffrés.</li><li>Épidémiologie suisse et part des M5 parmi les leucémies aiguës : non trouvées.</li><li>Ponction lombaire de l’adulte : non lue.</li><li>Recommandation ESMO 2020 : inaccessible ; ELN 2022 lue au niveau du résumé.</li><li>Statut Swissmedic du révuménib et de l’azacitidine pédiatrique : non vérifié.</li></ul><p>Cette leçon est une revue par intelligence artificielle ; elle ne remplace pas une validation médicale humaine, et aucun audit n’a été réalisé.</p></template>
<template data-pop="c93-nosologie" data-title="Codage CIM-10-GM 2024 de la leucémie monocytaire"><p>La CIM-10-GM 2024 est la version allemande modifiée de la classification internationale ; l’Office fédéral de la statistique en publie la version française pour la Suisse. Le code C93 comprend C93.0 (aiguë), C93.1 (myélomonocytaire chronique), C93.3 (myélomonocytaire juvénile), C93.7 (autres) et C93.9 (sans précision).</p><p>Le cinquième caractère précise le statut : 0, sans mention de rémission complète (la rémission partielle y est incluse) ; 1, en rémission complète. Il s’agit donc de dix codes à cinq caractères (C93.00, C93.01, C93.10, C93.11, C93.30, C93.31, C93.70, C93.71, C93.90, C93.91).</p><p>Deux précisions évitent les erreurs : la leucémie myélomonocytaire chronique est exclue de C92.1 (leucémie myéloïde chronique BCR::ABL1 positive), et la leucémie aiguë myélomonocytaire (M4) est codée C92.5. Le code additionnel C95.8! signale une leucémie réfractaire à l’induction standard. Dans les sources lues, C93.7 et C93.9 ne correspondent à aucune entité individualisée.</p></template>
<template data-pop="c93-lmmc-def" data-title="Leucémie myélomonocytaire chronique : définition"><p>La leucémie myélomonocytaire chronique est une néoplasie myéloïde clonale à cheval sur les syndromes myélodysplasiques et myéloprolifératifs. Elle associe une monocytose persistante (au moins 0,5 G/l et 10 %), moins de 20 % de blastes et une preuve de dysplasie ou de clonalité. Elle est exclue si la leucémie myéloïde chronique BCR::ABL1 positive, un autre néoplasme myéloprolifératif ou une fusion de tyrosine kinase est présent. Le diagnostic est détaillé à l’îlot 1.</p></template>
<template data-pop="c93-monocytose" data-title="Monocytose : seuils et persistance"><p>Une monocytose pathologique est définie ici par deux conditions simultanées : une valeur absolue d’au moins 0,5 G/l et une valeur relative d’au moins 10 % des leucocytes. Onkopedia demande que l’anomalie persiste (trois mois). Le patient de la vignette, à 1,4 G/l, dépasse largement le seuil de 1,0 G/l qui ne demande qu’un critère de soutien.</p><p>Une monocytose isolée ne prouve pas une leucémie : les infections, le sepsis, la tuberculose, l’infection par le virus de l’immunodéficience humaine et les maladies auto-immunes l’expliquent. Les sources lues ne donnent pas de valeur de référence normale ; elle n’est donc pas chiffrée.</p></template>
<template data-pop="c93-promonocyte" data-title="Promonocytes : équivalents de blastes"><p>Pour le compte des blastes dans la leucémie myélomonocytaire chronique, l’OMS 2022 additionne myéloblastes, monoblastes et promonocytes. Les promonocytes sont des cellules monocytaires immatures. Les compter comme des blastes évite de sous-estimer l’excès de cellules immatures : une moelle à 8 % de myéloblastes et 6 % de promonocytes compte 14 % de blastes équivalents, soit la forme 2 (10 à 19 %) et non la forme 1.</p></template>
<template data-pop="c93-criteres-soutien" data-title="Critères de soutien de l’OMS 2022"><p>Les critères de soutien confirment la nature clonale d’une monocytose : (1) dysplasie d’au moins une lignée, (2) anomalie clonale cytogénétique ou moléculaire acquise, (3) répartition anormale des sous-populations monocytaires en cytométrie.</p><table class="t"><tr><th>Monocytes</th><th>Critères exigés</th></tr><tr><td>≥ 1,0 G/l</td><td>Un seul critère</td></tr><tr><td>0,5 à &lt; 1,0 G/l</td><td>Critères 1 et 2</td></tr></table><p>L’exigence double en cas de monocytose modeste limite le risque de classer à tort une réaction inflammatoire.</p></template>
<template data-pop="c93-bcr-abl" data-title="BCR::ABL1 : exclusion de la leucémie myéloïde chronique"><p>BCR::ABL1 est le gène de fusion qui définit la leucémie myéloïde chronique (code C92.1). Sa présence exclut le diagnostic de leucémie myélomonocytaire chronique, ce qui explique qu’on le recherche d’emblée dans le bilan d’une monocytose. Les sources lues ne détaillent pas la technique de recherche (PCR ou FISH).</p></template>
<template data-pop="c93-icc" data-title="ICC : classification internationale de consensus"><p>La classification internationale de consensus (International Consensus Classification, 2022) est une classification concurrente de celle de l’OMS. Pour la leucémie myélomonocytaire chronique, elle diffère peu de l’OMS ; pour la leucémie aiguë, elle retient un seuil de 10 % de blastes avec certaines anomalies génétiques, là où l’OMS supprime le seuil.</p></template>
<template data-pop="c93-kit" data-title="KIT D816V et mastocytose systémique"><p>KIT D816V est une mutation du gène KIT caractéristique de la mastocytose systémique. Onkopedia demande de l’exclure dans le bilan de leucémie myélomonocytaire chronique pour ne pas méconnaître une mastocytose associée. Si elle existe, l’avapritinib ou la midostaurine peuvent s’employer.</p></template>
<template data-pop="c93-m4" data-title="M4 et M5 : codage des leucémies aiguës monocytaires">
<p>La classification franco-américano-britannique désigne par M4 la leucémie aiguë myélomonocytaire et par M5 la leucémie aiguë monoblastique ou monocytaire. La CIM-10-GM 2024 code M5, M5a et M5b en C93.0, et M4 (y compris M4 avec éosinophiles, inversion du chromosome 16) en C92.5. La distinction repose sur la proportion de granuleux et de monocytes : au moins 20 % de monocytes et au moins 20 % de granuleux en maturation définissent la forme myélomonocytaire selon l’OMS 2022.</p></template>
<template data-pop="c93-lam-m5" data-title="Leucémie aiguë monocytaire (M5)"><p>La leucémie aiguë myéloïde de type M5 (codée C93.0, avec M5a et M5b) est définie par la différenciation monocytaire : au moins 80 % de monocytes, monoblastes et promonocytes, moins de 20 % de granuleux, et au moins deux marqueurs monocytaires (CD11c, CD14, CD36, CD64) ou une estérase non spécifique positive.</p><p>Les sources lues précisent que M5a est à prédominance de monoblastes et M5b de promonocytes et monocytes selon l’intitulé de la classification ; elles ne donnent pas de seuils, qui ne sont donc pas chiffrés.</p></template>
<template data-pop="c93-kmt2a" data-title="Réarrangements de KMT2A"><p>KMT2A est un gène dont les réarrangements définissent une entité de leucémie aiguë myéloïde, habituellement monocytaire chez l’adulte, avec un partenaire fréquent MLLT3 (t(9;11)) ou MLLT10. Ils représentent 5 à 15 % des leucémies aiguës myéloïdes, avec un pronostic défavorable. Le diagnostic est possible avec moins de 20 % de blastes. La conséquence thérapeutique est l’allogreffe en première rémission si le patient est apte, et un inhibiteur de ménine en rechute.</p></template>
<template data-pop="c93-lmmj-def" data-title="Leucémie myélomonocytaire juvénile"><p>La leucémie myélomonocytaire juvénile est une leucémie pédiatrique rare, classée parmi les néoplasmes myéloprolifératifs par l’OMS 2022. Elle touche 1,2 enfant par million et par an. Plus de 90 % des cas portent une mutation de PTPN11, NRAS, KRAS, NF1 ou CBL. Les critères biologiques comprennent des monocytes supérieurs à 1 G/l, des blastes médullaires sous 20 %, une thrombopénie, une anémie et une splénomégalie presque constante.</p></template>
<template data-pop="c93-dd-reactive" data-title="Causes réactives de monocytose"><p>La monocytose réactive accompagne l’infection, le sepsis, la tuberculose, l’infection par le virus de l’immunodéficience humaine et les maladies auto-immunes. Son diagnostic repose sur la disparition de l’anomalie avec la cause et sur une cytométrie dont la fraction de monocytes classiques CD14 positifs et CD16 négatifs est inférieure à 94 %.</p></template>
<template data-pop="c93-cytometrie-mono" data-title="Cytométrie des monocytes : seuil de 94 %"><p>La cytométrie en flux classe les monocytes selon CD14 et CD16. Une proportion de monocytes classiques CD14 positifs et CD16 négatifs supérieure à 94 % distingue la leucémie myélomonocytaire chronique d’une monocytose réactive. Sa répartition anormale est aussi un critère de soutien de l’OMS 2022. Onkopedia range cet examen parmi les examens recommandés, et non obligatoires.</p></template>
<template data-pop="c93-cpss" data-title="Score pronostique CPSS et CPSS-mol"><p>Le CPSS (score pronostique propre à la leucémie myélomonocytaire chronique) additionne des points pour la forme LMMC-2, des leucocytes supérieurs à 13 G/l, la dépendance transfusionnelle et la cytogénétique. Il classe en faible (0), intermédiaire 1 (1), intermédiaire 2 (2 à 3) et élevé (4 à 5). Le CPSS-mol ajoute ASXL1, NRAS, RUNX1, SETBP1 et un seuil de blastes médullaires d’au moins 5 % ; ses classes sont faible (0), intermédiaire 1 (1), intermédiaire 2 (2 à 3) et élevé (4 ou plus). Le score de Düsseldorf se passe de la cytogénétique. La survie médiane va de 12 à 36 mois.</p><p>Décision : risque faible ou intermédiaire 1, surveillance ; risque intermédiaire 2 ou élevé, cytoréduction et discussion d’allogreffe.</p></template>
<template data-pop="c93-mutations" data-title="Mutations pronostiques de la leucémie myélomonocytaire chronique"><p>ASXL1, NRAS, RUNX1 et SETBP1 ont une valeur pronostique et entrent dans le CPSS-mol. TET2 est muté dans environ 60 % des cas, ASXL1 dans environ 40 %. TET2 et ASXL1 régulent l’épigénome ; SRSF2 (environ 50 %) l’épissage de l’ARN ; TP53 la réparation de l’ADN ; les gènes de la voie RAS et JAK2 la signalisation. Une mutation prouve la clonalité ; elle ne prouve pas à elle seule une leucémie, puisque l’OMS 2022 exige aussi la monocytose et les autres critères.</p></template>
<template data-pop="c93-alpha-defensines" data-title="Hypothèse des α-défensines"><p>Onkopedia rapporte l’hypothèse que des α-défensines, produites par les granuleux dysplasiques, inhibent la différenciation des monocytes et expliquent leur accumulation. Il s’agit d’une hypothèse non vérifiée dans la source primaire : elle n’a aucune conséquence sur le diagnostic ou le traitement, et ne doit pas être enseignée comme un mécanisme établi.</p></template>
<template data-pop="c93-ras" data-title="Voie RAS">
<p>La voie RAS transmet des signaux de croissance à l’intérieur de la cellule. Dans la leucémie myélomonocytaire chronique, les gènes de cette voie sont mutés dans 10 à 30 % des cas ; dans la forme juvénile, ils le sont dans plus de 90 % (PTPN11, NRAS, KRAS, NF1, CBL). L’OMS 2022 fait de son activation le fondement du diagnostic de la forme juvénile.</p></template>
<template data-pop="c93-splenomegalie" data-title="Splénomégalie"><p>Une splénomégalie touche environ la moitié des patients atteints de leucémie myélomonocytaire chronique proliférative et presque tous les enfants atteints de la forme juvénile. Elle traduit l’infiltration de la rate par les cellules clonales. Elle est suivie par une mesure annuelle (échographie si besoin). Les autres causes (hépatopathie, maladies de surcharge, infections) restent à écarter. Le ruxolitinib est employé hors indication pour les symptômes et la splénomégalie ; l’irradiation splénique reste exceptionnelle.</p></template>
<template data-pop="c93-auto-immunite" data-title="Manifestations auto-immunes"><p>Environ 20 % des patients atteints de leucémie myélomonocytaire chronique présentent une manifestation auto-immune : vascularite, purpura thrombopénique immunologique, psoriasis, polyarthrite rhumatoïde, syndrome de Sweet. Elle peut précéder la leucémie de plusieurs années. Devant une maladie auto-immune inexpliquée avec monocytose persistante, l’hémogramme doit être répété.</p></template>
<template data-pop="c93-infiltrats" data-title="Infiltrats extramédullaires">
<p>Les leucémies aiguës monoblastiques et myélomonocytaires envahissent volontiers les tissus : peau (nodules), gencives (hyperplasie gingivale), méninges, rate, foie. Ces localisations peuvent exister sans hyperleucocytose majeure. Chez l’enfant atteint de la forme juvénile, la peau montre des lésions eczématiformes, des papules ou des nodules. L’atteinte méningée justifie la ponction lombaire chez l’enfant ; chez l’adulte, la recommandation n’a pas été lue.</p></template>
<template data-pop="c93-urgences-aigue" data-title="Urgences de la leucémie aiguë">
<p>Trois urgences menacent le patient : la leucostase (environ plus de 100 G/l), la coagulation intravasculaire disséminée et la lyse tumorale. La première impose une cytoréduction rapide ; les deux autres se traitent d’emblée. Le transfert en centre d’hématologie est immédiat.</p></template>
<template data-pop="c93-leucostase" data-title="Leucostase">
<p>La leucostase désigne les complications d’une hyperleucocytose majeure (environ plus de 100 G/l). Le traitement initial associe hydroxyurée (jusqu’à 4 à 5 g par jour) et, si nécessaire, cytarabine. L’anthracycline ne se donne que lorsque les leucocytes sont tombés sous 30 G/l. Les sources lues ne détaillent pas les signes cliniques de la leucostase, qui ne sont donc pas décrits ici.</p></template>
<template data-pop="c93-lyse-tumorale" data-title="Lyse tumorale">
<p>La lyse tumorale est la libération massive du contenu des cellules tumorales détruites. Sous vénétoclax, la prévention comprend des leucocytes sous 25 G/l avant le début, une hydratation, un hypo-uricémiant et des dosages de potassium, urate, phosphate, calcium et créatinine avant la première dose, puis 6 à 8 heures après chaque palier et 24 heures après la dose cible.</p></template>
<template data-pop="c93-civd" data-title="Coagulation intravasculaire disséminée">
<p>La coagulation intravasculaire disséminée et l’hyperfibrinolyse accompagnent parfois la leucémie aiguë monocytaire. C’est pourquoi le bilan initial comprend la coagulation. Elle constitue, avec la leucostase et la lyse tumorale, une urgence à traiter d’emblée.</p></template>
<template data-pop="c93-ecog" data-title="État général ECOG et HCT-CI">
<p>L’échelle ECOG évalue l’état général du patient ; l’indice HCT-CI mesure les comorbidités avant une greffe. Ces deux mesures forment le bilan d’aptitude qui sépare le traitement intensif (7+3) du traitement moins intensif (vénétoclax-azacitidine). Au-delà de 75 ans biologiques ou en cas de comorbidité importante, le traitement curatif intensif n’est pas recommandé.</p></template>
<template data-pop="c93-ebmt" data-title="Séries d’allogreffe : EBMT et série française">
<p>Les chiffres de survie après allogreffe pour leucémie myélomonocytaire chronique proviennent de deux séries citées par Onkopedia : une série du groupe EBMT (513 patients) et une série française (73 patients). La survie est d’environ 30 % à 3–4 ans ; les échecs se partagent à peu près entre rechute et toxicité ou maladie du greffon contre l’hôte. Ces données sont observationnelles.</p></template>
<template data-pop="c93-reponse" data-title="Critères de réponse">
<p>Rémission complète : moins de 5 % de blastes médullaires, aucune atteinte extramédullaire, neutrophiles d’au moins 1 G/l, plaquettes d’au moins 100 G/l, aucun blaste circulant. Rechute : au moins 5 % de blastes, blastes circulants inexpliqués ou maladie extramédullaire.</p></template>
<template data-pop="c93-mrd" data-title="Maladie résiduelle mesurable">
<p>La maladie résiduelle se mesure en fin de consolidation. Un résultat supérieur à 10⁻⁴ en cytométrie en flux, ou à 2 % pour NPM1 ou les anomalies du facteur de liaison au noyau (CBF), signale un risque accru de rechute.</p></template>
<template data-pop="c93-mnemo" data-title="Aide pédagogique : trois temps du diagnostic"><p><b>Aide pédagogique, non critère officiel.</b> Pour une monocytose : « Durée, Cause, Clone, Blastes ». Durée (au moins trois mois) ; cause réactive exclue ; clone prouvé (dysplasie, mutation, cytométrie) ; blastes comptés (moins de 20 %).</p></template>
