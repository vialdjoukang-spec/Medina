<section class="ilot" id="s45-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un footballeur de 27 ans se luxe le genou lors d’un choc frontal ; le genou est réduit sur le terrain, et il arrive avec une jambe tiède mais sans pouls pédieux. Or, une luxation réduite ne garantit pas que l’artère poplitée est intacte, car l’étirement a pu déchirer son intima et la thromboser. La question qui structure ce cours est donc la suivante : <b>devant un traumatisme de membre, comment reconnaître la lésion vasculaire, arrêter l’hémorragie et rétablir le flux avant que le muscle et le nerf ne meurent ?</b></p>
<p>Pour y répondre, ce cours poursuit trois objectifs. D’abord, il fait comprendre que le temps est le facteur décisif : la perte fonctionnelle commence dans les deux à trois heures, et l’ESVS 2025 demande une revascularisation idéalement dans l’heure qui suit l’admission (recommandation 85). Ensuite, il ordonne les gestes, du <button class="w" data-k="s45-garrot">garrot</button> préhospitalier à la <button class="w" data-k="s45-shunt">dérivation temporaire</button> et à la réparation définitive. Enfin, il applique ces règles à chaque segment, de l’artère axillaire (S45) aux artères du pied (S95), car chaque artère n’a pas la même tolérance à la ligature.</p>
<p>Ce cours n’est pas un chapitre figé à apprendre par cœur. En effet, chaque terme vert ouvre une fenêtre qui donne la recommandation, le chiffre et le mécanisme ; de plus, les cas de l’onglet Examens reproduisent les décisions du déchocage. Ainsi, le lecteur relie en permanence la notion au geste et à sa justification.</p>
</section>
<section class="ilot" id="s45-1"><h2><span class="n">1</span>Définitions, gradation et codage</h2>
<p>La lésion vasculaire des membres est une atteinte traumatique d’une artère ou d’une veine de l’épaule au pied. Elle se grade selon la <button class="w" data-k="s35-gradation">gradation ESVS 2025</button> : le grade 1 atteint partiellement la paroi, le grade 2 forme un <button class="w" data-k="s35-faux-anevrisme">faux anévrisme</button> ou une <button class="w" data-k="s35-fav">fistule artérioveineuse</button>, le grade 3 saigne librement, et le grade X occlut l’artère. Or, dans un membre, le grade X est particulièrement fréquent après étirement, comme dans la luxation du genou ; c’est pourquoi l’ischémie domine ici autant que l’hémorragie.</p>
<table class="t"><tr><th>Catégorie CIM-10-GM 2024</th><th>Segment</th><th>Principales sous-catégories</th></tr>
<tr><td>S45</td><td>Épaule et bras</td><td>S45.0 artère axillaire ; S45.1 artère brachiale ; S45.2 veine axillaire ou brachiale ; S45.3 veines superficielles</td></tr>
<tr><td>S55</td><td>Avant-bras</td><td>S55.0 artère ulnaire ; S55.1 artère radiale ; S55.2 veines</td></tr>
<tr><td>S65</td><td>Poignet et main</td><td>S65.0 artère ulnaire ; S65.1 artère radiale ; S65.2 et S65.3 arcades palmaires superficielle et profonde ; S65.4 et S65.5 vaisseaux du pouce et des autres doigts</td></tr>
<tr><td>S75</td><td>Hanche et cuisse</td><td>S75.0 artère fémorale ; S75.1 veine fémorale ; S75.2 grande veine saphène</td></tr>
<tr><td>S85</td><td>Jambe</td><td>S85.0 artère poplitée ; S85.1 artères tibiales ; S85.2 artère fibulaire ; S85.3 et S85.4 grande et petite veines saphènes ; S85.5 veine poplitée</td></tr>
<tr><td>S95</td><td>Cheville et pied</td><td>S95.0 artère dorsale du pied ; S95.1 artère plantaire ; S95.2 veines du dos du pied</td></tr></table>
<p>Ce tableau se lit donc de la racine du membre vers son extrémité, et chaque catégorie se termine par les mêmes codes de lésions multiples (.7), d’autres vaisseaux (.8) et de vaisseau non précisé (.9), selon la <button class="w" data-k="s45-codage">règle de codage</button>. De plus, l’ordre du tableau correspond à une gravité décroissante : plus l’artère est proximale, plus son territoire est vaste et plus sa ligature est dangereuse.</p>
</section>
<section class="ilot" id="s45-2"><h2><span class="n">2</span>Épidémiologie et lésions associées</h2>
<p>Les membres sont la localisation la plus fréquente des lésions vasculaires civiles, avec environ 44 % des cas dans les grands registres, soit 26 % au membre supérieur et 18 % au membre inférieur (ESVS 2025). Ainsi, ce cours concerne la lésion vasculaire que le médecin des urgences rencontre le plus souvent. Cependant, ces données proviennent de registres nord-américains et européens ; aucune donnée suisse propre n’est rapportée, ce qui constitue une lacune.</p>
<p>Le mécanisme oriente ensuite vers l’artère. En effet, une fracture ou une luxation déplace l’os contre une artère fixée à son contact, comme le montre le tableau suivant, tiré du tableau 4 de l’ESVS 2025.</p>
<table class="t"><tr><th>Lésion orthopédique</th><th>Artère menacée</th><th>Raison anatomique</th></tr>
<tr><td>Fracture de la clavicule</td><td>Artère subclavière</td><td>L’artère passe sous la clavicule, sur la première côte</td></tr>
<tr><td>Luxation de l’épaule</td><td>Artère axillaire</td><td>La tête humérale déplacée étire l’artère dans le creux axillaire</td></tr>
<tr><td>Fracture supracondylienne de l’humérus, luxation du coude</td><td>Artère brachiale</td><td>L’artère croise la face antérieure du coude, au contact du fragment</td></tr>
<tr><td>Fracture du fémur distal</td><td>Artère fémorale superficielle</td><td>L’artère traverse le hiatus de l’adducteur, où elle est fixée</td></tr>
<tr><td>Luxation postérieure du genou, fracture du tibia proximal</td><td>Artère poplitée et trifurcation</td><td>L’artère est fixée en haut au hiatus de l’adducteur et en bas à l’arcade du soléaire</td></tr></table>
<p>Ce tableau se lit donc comme une liste de lésions orthopédiques qui imposent un examen vasculaire avant et après réduction. Par conséquent, toute réduction d’une luxation du genou ou d’une fracture supracondylienne doit être suivie d’un nouvel examen des pouls, car la réduction peut à la fois libérer et léser l’artère.</p>

<section class="ilot" id="s45-3"><h2><span class="n">3</span>Physiopathologie de l’ischémie de membre</h2>
<p>Normalement, le muscle et le nerf reçoivent en continu l’oxygène nécessaire à leurs pompes ioniques. Or, lorsque l’artère est interrompue, le nerf, très consommateur d’énergie, cesse de conduire en premier ; c’est pourquoi l’hypoesthésie et la paralysie apparaissent avant la nécrose musculaire. Ensuite, le muscle passe en métabolisme anaérobie, accumule de l’acide lactique, puis ses cellules meurent ; l’ESVS 2025 situe le début de la perte fonctionnelle dans les deux à trois heures.</p>
<p>La revascularisation entraîne ensuite ses propres lésions. En effet, le retour brutal de l’oxygène dans un tissu ischémique produit des radicaux libres et ouvre les capillaires lésés ; ainsi, le muscle gonfle dans une loge fermée par une aponévrose inextensible. Par conséquent, la pression de la loge dépasse la pression de perfusion capillaire, et le muscle redevient ischémique malgré une artère réparée : c’est le <button class="w" data-k="s45-loges">syndrome des loges</button> de reperfusion. De plus, la <button class="w" data-k="s45-reperfusion">reperfusion</button> libère dans la circulation le potassium, l’acide et la myoglobine du muscle lésé.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Un membre ischémique qui a perdu la sensibilité a déjà dépassé le stade réversible pour le nerf ; c’est pourquoi l’ischémie sensitivomotrice impose une revascularisation immédiate. De même, une douleur croissante à l’étirement passif après revascularisation traduit un syndrome des loges, qui impose une aponévrotomie.</div>
</section>
