<!-- ===== FENÊTRES S45 : complications, examens, monographies, Pareto ===== -->
<template data-pop="s45-loges" data-title="Syndrome des loges">
<div class="lab">Définition</div><p>Le syndrome des loges est une élévation de la pression dans une loge musculaire fermée par une aponévrose, qui dépasse la pression de perfusion capillaire et rend le muscle et le nerf ischémiques.</p>
<div class="lab">Signes</div><p>La douleur disproportionnée, aggravée par l’étirement passif des muscles de la loge, est le signe le plus précoce ; ensuite apparaissent l’hypoesthésie et la loge tendue. Le pouls disparaît tard, car la pression de la loge reste longtemps inférieure à la pression artérielle.</p>
<div class="lab">Conséquence pratique</div><p>Le traitement est l’aponévrotomie en urgence ; le pouls présent ne permet donc pas d’exclure le diagnostic.</p>
</template>
<template data-pop="s45-reperfusion" data-title="Lésions de reperfusion">
<div class="lab">Mécanisme</div><p>Le retour de l’oxygène dans un tissu ischémique produit des radicaux libres, active les polynucléaires et augmente la perméabilité capillaire ; ainsi, le muscle gonfle et peut mourir après la revascularisation.</p>
<div class="lab">Conséquences systémiques</div><p>Le muscle lésé libère du potassium, de l’acide lactique et de la myoglobine. L’hyperkaliémie peut provoquer une arythmie, et la myoglobine peut provoquer une insuffisance rénale aiguë.</p>
<div class="lab">Conséquence pratique</div><p>Après une ischémie prolongée, la kaliémie, la créatine kinase et la fonction rénale sont surveillées, et les loges sont examinées à intervalles rapprochés.</p>
</template>
<template data-pop="s45-aponevrotomie" data-title="Aponévrotomie des quatre loges de la jambe">
<div class="lab">Définition</div><p>L’aponévrotomie ouvre l’aponévrose des quatre loges de la jambe, antérieure, latérale, postérieure superficielle et postérieure profonde, habituellement par deux incisions, l’une latérale et l’autre médiale.</p>
<div class="lab">Indication (ESVS 2025)</div><p>Elle est recommandée en urgence pour traiter le syndrome des loges post-ischémique de la jambe (recommandation 96).</p>
<div class="lab">Raison des quatre loges</div><p>Une seule loge oubliée, souvent la postérieure profonde, reste comprimée ; c’est pourquoi l’ouverture doit être complète.</p>
</template>
<template data-pop="s45-scores" data-title="Scores de membre broyé">
<div class="lab">Définition</div><p>Les scores de membre broyé, comme le MESS, additionnent des points pour l’énergie du traumatisme, l’ischémie, le choc et l’âge, afin de prédire l’amputation.</p>
<div class="lab">Recommandation</div><p>L’ESVS 2025 déconseille de décider entre conservation et amputation sur un score (recommandation 87, classe IIIb) et recommande une décision pluridisciplinaire (recommandation 88).</p>
<div class="lab">Raison</div><p>Ces scores ont été construits sur de petites séries et prédisent mal le résultat fonctionnel d’un patient donné ; ils risquent donc de conduire à des amputations évitables.</p>
</template>
<template data-pop="s45-supracondylienne" data-title="Main rose sans pouls après fracture supracondylienne">
<div class="lab">Situation</div><p>Chez l’enfant, après réduction d’une fracture supracondylienne de l’humérus, la main peut rester rose et chaude alors que le pouls radial ne se perçoit pas.</p>
<figure><img src="images/cardiologie/s45_fracture_supracondylienne_radiographie.gif" alt="Radiographie réelle du coude d’un jeune enfant montrant une fracture supracondylienne de l’humérus désignée par une flèche" width="420" height="560" loading="lazy" decoding="async"><figcaption>Fracture supracondylienne de l’humérus chez un jeune enfant (flèche) : le fragment se déplace au contact de l’artère brachiale. James Heilman, MD, Wikimedia Commons, CC BY-SA 3.0.</figcaption></figure>
<div class="lab">Recommandation (ESVS 2025)</div><p>Une prise en charge non opératoire avec surveillance rapprochée peut être envisagée, à la recherche d’une ischémie aiguë (recommandation 104).</p>
<div class="lab">Raison</div><p>Le réseau anastomotique du coude perfuse la main malgré une artère brachiale comprimée ou spasmée ; en revanche, une main blanche et froide impose une exploration.</p>
</template>
<template data-pop="s45-doppler" data-title="Écho-Doppler dans le traumatisme de membre">
<div class="lab">Place</div><p>L’écho-Doppler a été utilisé pour le diagnostic, mais les études de qualité manquent, et un échographiste vasculaire entraîné est rarement disponible dans le délai de l’urgence (ESVS 2025).</p>
<div class="lab">Usage recommandé</div><p>Il sert au suivi : un examen clinique et un écho-Doppler à un mois après la réparation, ou plus tôt en cas d’anomalie, peuvent être envisagés chez l’adulte et chez l’enfant (recommandations 97 et 105).</p>
</template>
<template data-pop="s45-d-heparine" data-title="Héparine non fractionnée peropératoire">
<div class="lab">Mécanisme</div><p>L’héparine non fractionnée potentialise l’antithrombine, qui inactive la thrombine et le facteur Xa ; elle empêche ainsi la formation d’un caillot dans l’artère clampée ou réparée.</p>
<div class="lab">Place (ESVS 2025)</div><p>L’héparinisation systémique peropératoire peut être envisagée au cas par cas, selon l’étendue de la réparation, la durée d’interruption du flux, les lésions associées, le risque hémorragique et la coagulopathie (recommandation 94, classe IIb). L’ESVS ne fixe pas de posologie pour cette indication.</p>
<div class="lab">Avantage pratique</div><p>Sa demi-vie courte et son antagonisation par la protamine permettent de l’arrêter vite si le saignement reprend, ce qui explique son emploi peropératoire.</p>
<div class="lab">Contre-indication relative</div><p>Une lésion cérébrale hémorragique ou un saignement viscéral non contrôlé font préférer l’héparinisation locale ou l’abstention.</p>
</template>
<template data-pop="pareto-s45-notions" data-title="Pareto — Notions et lésions associées"><p class="ratio" data-cover="s45-0,s45-1,s45-2,s45-3"></p><ul>
<li>S45, S55, S65, S75, S85 et S95 codent les vaisseaux du bras au pied.</li>
<li>La luxation du genou menace la poplitée, et la fracture supracondylienne menace la brachiale.</li>
<li>Le nerf souffre avant le muscle ; la perte fonctionnelle commence en deux à trois heures.</li>
<li>La reperfusion provoque le syndrome des loges, l’hyperkaliémie et la myoglobinurie.</li></ul></template>
<template data-pop="pareto-s45-pec" data-title="Pareto — Hémorragie et revascularisation"><p class="ratio" data-cover="s45-4,s45-5"></p><ul>
<li>Les signes francs imposent un geste ; des pouls palpables rendent une lésion peu probable ; sinon, un angioscanner immédiat est indiqué.</li>
<li>L’index de cheville n’est pas indiqué pour le diagnostic.</li>
<li>Le garrot se pose aussi distalement que possible, sans héparine.</li>
<li>La revascularisation se fait idéalement dans l’heure, par réparation définitive ou par dérivation temporaire.</li></ul></template>
<template data-pop="pareto-s45-segment" data-title="Pareto — Décision selon le segment"><p class="ratio" data-cover="s45-6"></p><ul>
<li>Les troncs uniques, axillaire, brachiale, fémorale et poplitée, se réparent.</li>
<li>La radiale ou l’ulnaire isolée, ou une seule artère de jambe, se lient s’il n’y a pas d’ischémie.</li>
<li>Les veines fémorale et poplitée se réparent chez le patient stable.</li></ul></template>
<template data-pop="pareto-s45-suivi" data-title="Pareto — Loges, amputation, suivi"><p class="ratio" data-cover="s45-7"></p><ul>
<li>Le syndrome des loges post-ischémique se traite par aponévrotomie des quatre loges.</li>
<li>L’amputation se décide en équipe, et non sur un score.</li>
<li>Un écho-Doppler de contrôle peut être fait à un mois.</li></ul></template>
<template data-pop="pareto-s45-crit" data-title="Pareto — Enfant et critères"><p class="ratio" data-cover="s45-8"></p><ul>
<li>La main rose sans pouls après fracture supracondylienne se surveille de près.</li>
<li>La dérivation se convertit au mieux pendant la même intervention, sinon dans les 12 heures.</li></ul></template>
<template data-pop="pareto-s45-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="s45-e-1,s45-e-2"></p><ul>
<li>L’angioscanner immédiat est indiqué quand l’examen ne peut pas exclure la lésion.</li>
<li>L’écho-Doppler sert au suivi.</li>
<li>L’angiographie complète l’angioscanner en cas d’artefact ou pour un geste endovasculaire.</li></ul></template>
<template data-pop="pareto-s45-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="s45-p-1,s45-p-2"></p><ul>
<li>L’acide tranexamique est donné tôt ; l’héparine peropératoire se décide au cas par cas.</li>
<li>Un antiagrégant simple peut suivre la réparation.</li>
<li>Après une ischémie prolongée, il faut surveiller le potassium et la fonction rénale.</li></ul></template>
