<!-- ===== FENÊTRES S45 : notions, examen, gestes ===== -->
<template data-pop="s45-codage" data-title="Codage des lésions vasculaires des membres (CIM-10-GM 2024)">
<div class="lab">Règle</div><p>Chaque segment du membre a sa catégorie : S45 pour l’épaule et le bras, S55 pour l’avant-bras, S65 pour le poignet et la main, S75 pour la hanche et la cuisse, S85 pour la jambe et S95 pour la cheville et le pied. Dans chaque catégorie, la sous-catégorie .7 code les lésions de plusieurs vaisseaux, .8 les autres vaisseaux et .9 le vaisseau non précisé.</p>
<div class="lab">Limite</div><p>L’artère subclavière, menacée par une fracture de la clavicule, ne se code pas en S45 mais avec les vaisseaux du thorax, en S25 ; le code suit donc le siège du vaisseau, et non celui de la fracture.</p>
<div class="lab">Conséquence pratique</div><p>Le code du vaisseau s’ajoute à celui de la lésion osseuse ou nerveuse associée, parce qu’un même traumatisme lèse souvent l’os, le nerf et l’artère.</p>
</template>
<template data-pop="s45-signes-francs" data-title="Signes francs de lésion vasculaire">
<div class="lab">Définition</div><p>Les signes francs sont ceux qui prouvent cliniquement une lésion vasculaire significative : saignement pulsatile, hématome expansif ou pulsatile, pouls distal absent, souffle ou frémissement, et signes d’ischémie distale.</p>
<div class="lab">Mécanisme de chaque signe</div><p>Le saignement pulsatile et l’hématome expansif traduisent une paroi ouverte, de grade 3 ou 2. Le pouls absent et l’ischémie traduisent une occlusion, de grade X. Le souffle et le frémissement traduisent un flux turbulent, typique de la fistule artérioveineuse.</p>
<div class="lab">Conséquence pratique</div><p>Un signe franc avec instabilité conduit au bloc ; un signe franc chez un patient stable conduit à l’angioscanner immédiat ou au geste, selon le délai d’ischémie.</p>
</template>
<template data-pop="s45-ips" data-title="Index de pression cheville-bras dans le traumatisme">
<div class="lab">Définition</div><p>L’index de pression cheville-bras est le rapport entre la pression systolique mesurée à la cheville par Doppler et la pression systolique au bras.</p>
<div class="lab">Recommandation</div><p>L’ESVS 2025 ne l’indique pas pour affirmer ou exclure une lésion vasculaire du membre traumatisé (recommandation 83, classe IIIa).</p>
<div class="lab">Raison</div><p>L’index dépend de la pression artérielle, de l’hypothermie, de la douleur et de l’œdème du blessé, et il reste normal en présence de lésions non occlusives ; il ne sépare donc pas de façon fiable les patients qui ont besoin d’une imagerie.</p>
</template>
<template data-pop="s45-garrot" data-title="Garrot préhospitalier">
<div class="lab">Indication (ESVS 2025)</div><p>Le garrot est recommandé lorsqu’une hémorragie de membre n’est pas contrôlée par la compression locale ou le tamponnement ; il est posé aussi distalement que possible, de préférence avant l’installation du choc (recommandation 6).</p>
<figure><img src="images/cardiologie/s45_garrot_tactique.gif" alt="Photographie réelle d’un garrot tactique à sangle et à tige de serrage" width="440" height="415" loading="lazy" decoding="async"><figcaption>Garrot tactique : la tige tourne pour serrer la sangle jusqu’à l’arrêt du flux artériel. auteur Indnam, Wikimedia Commons, CC BY-SA 3.0.</figcaption></figure>
<div class="lab">Règles d’usage</div><p>L’heure de pose est notée, le besoin est réévalué souvent, surtout lors d’une évacuation longue, et le garrot est retiré dès que possible en milieu contrôlé, ou converti en pansement compressif.</p>
<div class="lab">Après le retrait</div><p>Le patient est surveillé pour une reprise du saignement et pour une reperfusion avec syndrome des loges ; en revanche, l’héparine n’est pas indiquée du seul fait du garrot (recommandation 7).</p>
</template>
<template data-pop="s45-shunt" data-title="Dérivation vasculaire temporaire">
<div class="lab">Définition</div><p>La dérivation temporaire est un tube introduit dans les deux bouts de l’artère, et si besoin de la veine, pour rétablir le flux en quelques minutes avant la réparation définitive. Un tube stérile du bon calibre, par exemple une sonde gastrique, ou une dérivation carotidienne du commerce peuvent servir (ESVS 2025).</p>
<div class="lab">Indication</div><p>Elle est recommandée lorsque la réparation définitive rapide n’est pas faisable, en raison de la physiologie du patient ou d’une instabilité osseuse (recommandations 14 et 86).</p>
<div class="lab">Durée et risques</div><p>Les complications, occlusion, déplacement ou embolie, atteignent 20 % ; elles augmentent après 6 heures. La dérivation doit donc être convertie au plus tôt, idéalement pendant la même intervention, sinon dans les 12 heures (recommandation 15).</p>
</template>
<template data-pop="s45-interposition" data-title="Pontage court d’interposition">
<div class="lab">Définition</div><p>Le pontage d’interposition remplace le segment détruit de l’artère par un greffon placé dans l’axe, entre deux anastomoses proches de la lésion.</p>
<div class="lab">Raison (ESVS 2025, recommandation 16)</div><p>Les greffons courts ont une meilleure perméabilité que les pontages longs. De plus, l’interposition permet d’inspecter directement la lésion, d’exciser les tissus dévitalisés et de vérifier la veine et le nerf voisins.</p>
</template>
<template data-pop="s45-greffon" data-title="Choix du greffon">
<div class="lab">Options</div><p>La veine autologue, habituellement la grande saphène, et la prothèse synthétique sont les deux conduits. Aucune donnée de haute qualité ne permet de préférer l’un à l’autre pour la réparation traumatique (ESVS 2025).</p>
<div class="lab">Règle pratique</div><p>La prothèse synthétique convient à l’interposition d’urgence (recommandation 17), alors que la veine est préférée pour un conduit long ou pour une petite artère distale, sous le genou ou sous le coude (recommandation 18). Le prélèvement de veine sur le membre blessé est raisonnable en l’absence de preuve contraire.</p>
<div class="lab">Comportement en cas d’infection</div><p>Une veine infectée tend à se désagréger et à saigner, alors qu’une prothèse infectée lâche plutôt au niveau des anastomoses en formant un faux anévrisme.</p>
</template>
