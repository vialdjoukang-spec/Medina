<template data-pop="e10-a01-fenetre-1" data-title="Glycémie : mesure et conditions"><div id="e10-a01-fenetre-1"><p>Une valeur de glucose n’a de sens qu’avec son type de prélèvement : plasma veineux au laboratoire, sang capillaire au lecteur ou glucose interstitiel au capteur. L’heure, la relation au repas, les symptômes et le traitement déjà administré complètent l’interprétation. Un lecteur permet de reconnaître rapidement une situation dangereuse ; la confirmation diagnostique repose sur une méthode de laboratoire lorsque la situation le permet.</p><p>Exemple fictif : 24 mmol/L au lecteur chez une personne qui vomit appelle un bilan et une orientation immédiats, et une seconde mesure ne doit pas retarder ce recours. À l’inverse, un résultat modérément élevé sans symptôme demande une mesure de laboratoire et l’analyse des conditions du prélèvement.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-a01-fenetre-2" data-title="Insuline : rôle et actions"><div id="e10-a01-fenetre-2"><p>L’insuline agit comme un signal coordonnant plusieurs organes. Dans le muscle et le tissu adipeux, elle favorise l’entrée du glucose par mobilisation de transporteurs. Dans le foie, elle freine la production de glucose ; dans le tissu adipeux, elle freine la libération d’acides gras. Le manque du signal augmente donc à la fois le glucose sanguin et les substrats disponibles pour fabriquer des cétones.</p><p>Cette explication motive deux fonctions du traitement : une couverture basale entre les repas et une couverture prandiale des apports alimentaires. La première demeure nécessaire même en l’absence de repas.</p><p class="src">Sources : <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="pareto-e10-a01" data-title="Loi de Pareto — Cas initial et objectifs"><div id="pareto-e10-a01"><p class="ratio" data-cover="e10-a01"></p><ul><li>Le diagnostic, le type et la gravité sont trois questions distinctes.</li><li>Chez une personne qui vomit et respire profondément, cétones et acidose se recherchent immédiatement, avant toute classification.</li></ul><p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-a02-fenetre-1" data-title="Classification : arguments et incertitude"><div id="e10-a02-fenetre-1"><p>La classification repose sur un faisceau d’arguments. Une cétose indique une carence métabolique importante, mais elle n’est pas à elle seule un test d’auto-immunité. Les anticorps sont plus informatifs près du diagnostic, car leur taux de faux négatifs y est le plus bas. Si leur recherche est négative et que l’incertitude persiste, <button class="w" data-k="e10-gl-3">NICE</button> propose un peptide C non à jeun avec glycémie simultanée ; son pouvoir discriminant augmente avec le temps écoulé depuis le début.</p><p>Le raisonnement reste révisable : l’insulinothérapie nécessaire se poursuit pendant que l’étiologie est réexaminée. Un résultat négatif isolé ne suffit donc pas à retirer un traitement indispensable.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="e10-a02-fenetre-2" data-title="Fréquence suisse : dénominateurs"><div id="e10-a02-fenetre-2"><p>Numérateur MonAM : personnes déclarant un diagnostic de diabète ou un traitement. Dénominateur : population résidant en ménage privé en Suisse, âgée d’au moins 15 ans, estimée à partir de l’enquête de 2022. Résultat : 6,2 %, tous types confondus.</p><p>Les enfants de moins de 15 ans et les personnes vivant en institution ne sont pas couverts par cette définition. L’enquête ne distingue pas de façon fiable les types déclarés. Il serait donc incorrect d’étiqueter 6,2 % « fréquence du type 1 », de compter les utilisateurs d’insuline comme des types 1, ou de présenter cette observation comme une incidence annuelle.</p><p class="src">Sources : <a href="https://ind.obsan.admin.ch/fr/indicator/monam/diabete-age-15" target="_blank" rel="noopener">OFSP / Obsan — Diabète (âge : 15+) — mise à jour 17 mars 2025, enquête 2022</a>.</p></div></template>
<template data-pop="pareto-e10-a02" data-title="Loi de Pareto — Définition, classification et fréquence"><div id="pareto-e10-a02"><p class="ratio" data-cover="e10-a02"></p><ul><li>Le type 1 est une perte de fonction des cellules β, le plus souvent auto-immune, qui impose l’insuline.</li><li>Ni l’âge ni l’indice de masse corporelle ne suffisent à classer ; à 60 ans ou plus, un diabète nouveau avec amaigrissement fait rechercher un cancer du pancréas.</li><li>La statistique suisse de 6,2 % réunit tous les diabètes et ne mesure pas le type 1.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a> ; <a href="https://ind.obsan.admin.ch/fr/indicator/monam/diabete-age-15" target="_blank" rel="noopener">OFSP / Obsan — Diabète (âge : 15+) — mise à jour 17 mars 2025, enquête 2022</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p></div></template>
<template data-pop="e10-a03-fenetre-1" data-title="Déficit insulinique : chaîne causale"><div id="e10-a03-fenetre-1"><p>Le tissu adipeux stocke les acides gras sous forme de triglycérides. Lorsque le frein insulinique manque, leur hydrolyse libère acides gras et glycérol. Le foie oxyde les acides gras dans ses mitochondries ; l’<button class="w" data-k="e10-gl-33">acétyl-CoA</button> produit peut alimenter la cétogenèse. L’acétoacétate et le β-hydroxybutyrate circulent ensuite vers les autres tissus.</p><p>Une cétose nutritionnelle et une acidocétose ne sont pas synonymes : il faut considérer la disponibilité de l’insuline, la production de cétones, l’hydratation et le pH. Chez une personne de type 1 malade, des cétones élevées ne doivent pas être banalisées parce que la glycémie paraît peu élevée.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="e10-a03-fenetre-2" data-title="Symptômes : mécanisme et limites"><div id="e10-a03-fenetre-2"><p>La polyurie désigne un volume urinaire excessif ; elle ne désigne pas seulement le fait d’uriner souvent. Le glucose urinaire augmente la quantité de particules dans le tubule, ce qui limite la récupération de l’eau et explique la soif compensatrice. Une nycturie récente peut ainsi révéler une hyperglycémie.</p><p>Vomissements, douleurs abdominales et respiration profonde peuvent orienter vers une acidocétose, mais une affection abdominale peut aussi la déclencher. La persistance d’une douleur malgré la correction métabolique oblige à réexaminer cette hypothèse. Les symptômes guident les examens ; ils ne remplacent ni la cétonémie ni la gazométrie.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5468371/" target="_blank" rel="noopener">Tran et al. — Review of Evidence for Adult DKA Management Protocols — 2017</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="pareto-e10-a03" data-title="Loi de Pareto — Mécanismes et symptômes"><div id="pareto-e10-a03"><p class="ratio" data-cover="e10-a03"></p><ul><li>Le glucose urinaire entraîne la diurèse osmotique, la soif et la déshydratation.</li><li>Sans insuline, la lipolyse alimente la cétogenèse hépatique ; l’acidose stimule la ventilation.</li><li>Chaque mécanisme se mesure : β-hydroxybutyrate pour la cétose, pH et bicarbonates pour l’acidose.</li></ul><p class="src">Sources : <a href="https://www.frontiersin.org/journals/physiology/articles/10.3389/fphys.2020.575789/full" target="_blank" rel="noopener">Mari, Tura, Grespan et Bizzotto — Glucose homeostasis — 25 novembre 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11703732/" target="_blank" rel="noopener">Revue — B cells in type 1 diabetes — 2024, article avec correction 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5468371/" target="_blank" rel="noopener">Tran et al. — Review of Evidence for Adult DKA Management Protocols — 2017</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8656040/" target="_blank" rel="noopener">Kolb et al. — Ketone bodies: from enemy to friend and guardian angel — 9 décembre 2021</a>.</p></div></template>
<template data-pop="e10-a04-fenetre-1" data-title="Seuil diagnostique et intervalle normal"><div id="e10-a04-fenetre-1"><p>Un intervalle de référence décrit une population et une méthode de laboratoire. Un seuil diagnostique est une limite choisie pour classer une maladie. Une cible thérapeutique est un objectif adapté à une personne déjà malade. Ces trois nombres peuvent donc être différents sans contradiction.</p><p>Exemple : 5,5 mmol/L est la borne supérieure affichée par le catalogue Viollier cité ; 7,0 mmol/L est un seuil diagnostique à jeun ; la plage de temps dans la cible d’un capteur chez de nombreux adultes traités s’étend de 3,9 à 10,0 mmol/L. L’heure du prélèvement, les repas, le dispositif et le risque d’hypoglycémie donnent à chaque chiffre son sens.</p><p class="src">Sources : <a href="https://www.viollier.ch/fr/analysis/7380" target="_blank" rel="noopener">Viollier — catalogue glucose — catalogue consulté le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-a04-fenetre-2" data-title="Classification biologique : portée des examens"><div id="e10-a04-fenetre-2"><p>Les autoanticorps témoignent d’une réponse immunitaire dirigée contre des antigènes des cellules β. Le peptide C est libéré lors de la maturation de la proinsuline ; contrairement à l’insuline injectée, il renseigne sur la sécrétion endogène. Une glycémie simultanée permet de savoir si cette sécrétion est appropriée au stimulus.</p><p>Une sécrétion mesurable au début n’exclut pas un type 1. À l’inverse, un peptide C bas pendant une crise ne suffit pas à reconstruire toute l’étiologie. La fonction rénale et la méthode influencent le résultat. L’équipe spécialisée choisit le moment et interprète les mesures en cas de diagnostic incertain.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="pareto-e10-a04" data-title="Loi de Pareto — Anamnèse, examen et diagnostic"><div id="pareto-e10-a04"><p class="ratio" data-cover="e10-a04"></p><ul><li>Les seuils suisses sont ≥ 7,0 mmol/L à jeun, ≥ 11,1 mmol/L à deux heures ou ≥ 11,1 mmol/L avec symptômes.</li><li>Le raisonnement classe d’abord l’acidocétose, puis l’état hyperosmolaire, puis la classification du type.</li><li>Deux autoanticorps au diagnostic ; le peptide C seulement si le doute persiste.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://www.viollier.ch/fr/analysis/7380" target="_blank" rel="noopener">Viollier — catalogue glucose — catalogue consulté le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12730728/" target="_blank" rel="noopener">Kandinov et al. — Molecular Portrait of Type 1 Diabetes — 11 décembre 2025</a>.</p></div></template>
<template data-pop="e10-a05-fenetre-1" data-title="Rapport insuline et glucides : bases, unités et limites"><div id="e10-a05-fenetre-1"><p>Un rapport glucides/insuline exprimé en g/U décrit combien de grammes sont couverts par une unité pour un repas et une situation donnés. L’opération est donc une division : grammes du repas ÷ grammes par unité. Si le rapport est exprimé dans l’autre sens, en U/g, l’opération devient une multiplication. Il faut lire les unités avant de calculer.</p><p>Avec le rapport fictif prescrit de 10 g/U, 45 g donnent 4,5 U. La dose effectivement administrable dépend du dispositif et du plan convenu. La <button class="w" data-k="e10-gl-2">SSED</button> décrit l’utilisation du comptage des glucides et des bolus ; elle ne fait pas de cet exemple une dose initiale universelle. Les repas riches en graisse, l’exercice et l’insuline active imposent une interprétation supplémentaire.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-a05-fenetre-2" data-title="Facteur de correction : exemple sourcé"><div id="e10-a05-fenetre-2"><p>Le facteur de correction décrit la baisse de glycémie attendue pour une unité dans les conditions où il a été établi. Exemple fictif prescrit : 2 mmol/L/U. L’écart entre 12 mmol/L mesurés et 6 mmol/L visés vaut 6 mmol/L ; 6 mmol/L ÷ 2 mmol/L/U = 3 U.</p><p>Cette opération ne recommande pas d’injecter immédiatement 3 U. Une dose récente peut encore agir ; le capteur peut montrer une baisse ; une activité est peut-être prévue. Ajouter sans tenir compte de ces éléments expose à une accumulation de doses. L’équipe définit les paramètres et leur réévaluation. Aucune règle empirique de type 500 ou 1800 n’est présentée ici comme validée pour tous.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/68_SickDayRulesCard/Sick-Day-Rules_Meienberg_Einzeln_Schnittmarken.pdf" target="_blank" rel="noopener">SSED — carte Sick Day Rules — version téléchargée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="pareto-e10-a05" data-title="Loi de Pareto — Stratégie d’insuline et éducation initiale"><div id="pareto-e10-a05"><p class="ratio" data-cover="e10-a05"></p><ul><li>La fonction basale couvre les besoins hors repas, la fonction prandiale les repas et les corrections.</li><li>Un calcul repose sur des paramètres prescrits ; il ne remplace ni l’insuline active ni le contexte.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/68_SickDayRulesCard/Sick-Day-Rules_Meienberg_Einzeln_Schnittmarken.pdf" target="_blank" rel="noopener">SSED — carte Sick Day Rules — version téléchargée le 13 octobre 2026</a>.</p></div></template>
<template data-pop="e10-a06-fenetre-1" data-title="Acidocétose : critères et mécanismes"><div id="e10-a06-fenetre-1"><p>La cétose correspond à l’augmentation des corps cétoniques ; l’acidose correspond à leur retentissement, apprécié par le pH et les bicarbonates. Pour le <button class="w" data-k="e10-gl-4">JBDS</button> 2023 adulte, les trois composantes diagnostiques sont glucose &gt; 11 mmol/L ou diabète connu, cétones &gt; 3 mmol/L ou urine ≥ 2+, et pH veineux &lt; 7,3 et/ou bicarbonates &lt; 15 mmol/L.</p><p>Le tableau <button class="w" data-k="e10-gl-30">RMS</button> 2019 utilise d’autres limites, notamment glucose ≥ 14 mmol/L et bicarbonates ≤ 18 mmol/L. Il s’agit de versions et de cadres différents, et non de nombres à combiner ; une glycémie inférieure à 14 ne permet donc pas d’exclure la crise. En pédiatrie, le protocole de l’équipe pédiatrique s’applique, et non les débits de l’adulte.</p><p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a>.</p></div></template>
<template data-pop="e10-a06-fenetre-2" data-title="Trouble de conscience : démarche discriminante"><div id="e10-a06-fenetre-2"><p>La première discrimination est rapide : une glycémie basse peut expliquer immédiatement le trouble de conscience et exige un secours adapté. Si elle est élevée, le médecin mesure cétones et pH, puis apprécie l’osmolalité, la perfusion et la fonction rénale. Ni une glycémie élevée ni un diabète connu n’excluent un accident vasculaire cérébral, un sepsis ou une intoxication.</p><p>L’état hyperosmolaire s’installe souvent plus lentement et exige une correction osmotique prudente ; infarctus, accident vasculaire et thromboses y sont plus fréquents. Les données <button class="w" data-k="e10-gl-4">JBDS</button> concernent l’adulte hospitalisé et ne fournissent pas une recette unique pour un tableau mixte ou un enfant. La surveillance neurologique répétée repère une détérioration que la seule évolution du glucose n’explique pas : une baisse du score de Glasgow impose une imagerie cérébrale urgente.</p><p class="src">Sources : <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a>.</p></div></template>
<template data-pop="pareto-e10-a06" data-title="Loi de Pareto — Décompensations et états avec coma"><div id="pareto-e10-a06"><p class="ratio" data-cover="e10-a06"></p><ul><li>Selon le JBDS, l’acidocétose associe glucose &gt; 11 mmol/L ou diabète connu, cétones &gt; 3 mmol/L et pH &lt; 7,3 ou bicarbonates &lt; 15 mmol/L.</li><li>Le potassium s’ajoute à 40 mmol par litre entre 3,5 et 5,5 mmol/L si la personne urine ; sous 3,5, un avis senior est requis.</li><li>Les cétones doivent baisser d’au moins 0,5 mmol/L par heure ; la résolution exige cétones &lt; 0,6 mmol/L et pH &gt; 7,3.</li></ul><p class="src">Sources : <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-a07-fenetre-1" data-title="Hypoglycémie : gradation et conduite"><div id="e10-a07-fenetre-1"><p>Deux axes sont nécessaires. L’axe biologique distingue &lt; 3,9 et &lt; 3,0 mmol/L dans les rapports de capteur. L’axe fonctionnel évalue si la personne peut encore se traiter : une aide extérieure nécessaire définit le niveau 3, appelé grade III par le texte suisse de conduite. Le seuil hospitalier <button class="w" data-k="e10-gl-29">HUG</button> &lt; 4 mmol/L privilégie une action simple et précoce.</p><p>Le protocole HUG adulte utilise 15 g de glucides par voie orale, ou 30 g sous 2,5 mmol/L, puis une mesure à 20–30 minutes ; ce délai ne se fusionne pas avec celui d’un autre protocole. Sous administration automatisée, la <button class="w" data-k="e10-gl-2">SSED</button> enseigne 4 g pour prévenir et 8 g pour traiter une hypoglycémie légère, car l’algorithme a déjà suspendu l’insuline. En cas de trouble de conscience ou de déglutition, rien n’est donné par la bouche ; le secours prescrit est administré et le 144 appelé. Chez l’enfant, le plan pédiatrique s’applique.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="e10-a07-fenetre-2" data-title="Glucagon : produit, usage et limites"><div id="e10-a07-fenetre-2"><p>Baqsimi 3 mg poudre nasale est un récipient unidose de glucagon. L’information professionnelle suisse prévoit une dose intranasale unique de 3 mg chez l’adulte et l’enfant dès 1 an ayant un diabète et une hypoglycémie sévère. L’absorption est passive : la personne n’a pas besoin d’inhaler. Le produit doit être accessible et son emploi appris par l’entourage.</p><p>Il est contre-indiqué en cas de phéochromocytome et d’hypersensibilité. Des réserves insuffisantes de glycogène, après jeûne, insuffisance surrénalienne ou abus chronique d’alcool, limitent son efficacité. La <button class="w" data-k="e10-gl-5">FI</button> nomme trois interactions : l’indométacine peut supprimer l’effet hyperglycémiant, voire provoquer une hypoglycémie ; la warfarine voit son effet anticoagulant augmenté ; sous bêtabloquant, pouls et pression artérielle s’élèvent transitoirement. Aucune n’est une contre-indication. Après réponse, des glucides oraux sont donnés dès que la déglutition est sûre ; la FI ne dispense pas d’appeler le 144 devant une altération de conscience et ne prévoit pas de seconde dose.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="pareto-e10-a07" data-title="Loi de Pareto — Hypoglycémies et incidents de traitement"><div id="pareto-e10-a07"><p class="ratio" data-cover="e10-a07"></p><ul><li>Le protocole HUG traite toute glycémie &lt; 4 mmol/L par 15 g de glucides, ou 30 g sous 2,5 mmol/L, avec contrôle à 20–30 minutes.</li><li>Une personne qui n’avale plus reçoit le secours prescrit, comme Baqsimi 3 mg, et le 144 est appelé.</li><li>Après un secours, la cause se recherche et la récidive se prévient, surtout sous insuline prolongée.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a>.</p></div></template>
<template data-pop="e10-a08-fenetre-1" data-title="Temps dans la cible : définition, dénominateur et limites"><div id="e10-a08-fenetre-1"><p>Le temps dans la cible est une proportion : durée mesurée dans la plage choisie divisée par la durée effectivement renseignée, multipliée par 100. La plage standard <button class="w" data-k="e10-gl-2">SSED</button> adulte est 3,9–10 mmol/L ; la grossesse utilise une autre plage. Des valeurs sans horodatage régulier ou de longues lacunes empêchent une interprétation naïve par simple comptage.</p><p>Exemple fictif : sur 20 heures exploitables, 14 sont dans la plage, soit 14/20 × 100 = 70 %. Ce résultat ne démontre pas que 70 % des 24 heures étaient dans la plage : les quatre heures manquantes peuvent contenir des événements. Le rapport mentionne donc toujours aussi les hypoglycémies, la couverture et le contexte.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-a08-fenetre-2" data-title="Panne de pompe : plan de secours sourcé"><div id="e10-a08-fenetre-2"><p>La pompe utilise une insuline rapide pour assurer la couverture de fond. Une interruption prolongée peut donc provoquer une carence, une hyperglycémie puis une cétose. La personne vérifie le glucose par la méthode de secours si nécessaire, mesure les cétones selon le plan et inspecte le circuit. Vomissements, respiration anormale ou altération de l’état général imposent un recours urgent.</p><p>La <button class="w" data-k="e10-gl-5">FI</button> suisse de NovoRapid demande de disposer d’une méthode alternative d’administration. Le diabétologue précise à l’avance les produits, doses et horaires en cas d’arrêt de pompe, ainsi que le chevauchement lors de sa reprise. Une dose basale improvisée puis un redémarrage sans tenir compte de sa durée d’action exposent à une hypoglycémie.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="pareto-e10-a08" data-title="Loi de Pareto — Capteurs, pompes et automatisation"><div id="pareto-e10-a08"><p class="ratio" data-cover="e10-a08"></p><ul><li>Un rapport se lit par la qualité des données, puis le temps sous la plage.</li><li>Chez l’adulte : plus de 70 % dans 3,9–10 mmol/L, moins de 4 % sous 3,9, moins de 25 % au-dessus de 10 et au plus 5 % au-dessus de 13,9 mmol/L.</li><li>Médicaments, altitude et variations rapides faussent le capteur : la mesure capillaire tranche.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-a09-fenetre-1" data-title="Dépistage : question, examen et intervalle"><div id="e10-a09-fenetre-1"><p>Le dépistage cherche une atteinte encore silencieuse. Pour le rein, le rapport albumine/créatinine et la filtration estimée sont complémentaires ; pour l’œil, il faut un examen rétinien ; pour le pied, inspection, pouls et sensibilité. Les critères suisses de qualité retiennent un contrôle annuel rénal et des pieds, ainsi qu’un examen ophtalmologique dans les deux ans.</p><p>Une fréquence de dépistage ne s’applique pas à une complication déjà active : une plaie exige un suivi au moins hebdomadaire selon le guide suisse du pied, et une baisse visuelle brutale un avis urgent. La question clinique commande donc l’intervalle. Le dossier documente le dernier résultat, le prochain rendez-vous et l’intervenant responsable.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p></div></template>
<template data-pop="e10-a09-fenetre-2" data-title="Complication rénale : articulation avec N18"><div id="e10-a09-fenetre-2"><p>Une baisse de filtration et une albuminurie ne sont pas synonymes. La première estime la capacité d’épuration ; la seconde renseigne sur une fuite anormale d’albumine. Leur combinaison aide à apprécier le risque, mais une mesure isolée pendant déshydratation ou maladie aiguë ne suffit pas à qualifier une maladie chronique.</p><p>Le chapitre N18 expose la confirmation de chronicité, les catégories de filtration et d’albuminurie et leurs conséquences. Dans E10, deux conséquences comptent déjà : le dépistage est régulier, et l’insuline se réévalue lorsque la fonction rénale change, car les besoins peuvent diminuer et le risque d’hypoglycémie augmenter. Une présentation atypique appelle un avis néphrologique.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="pareto-e10-a09" data-title="Loi de Pareto — Complications d’organe"><div id="pareto-e10-a09"><p class="ratio" data-cover="e10-a09"></p><ul><li>Chaque organe se dépiste par un examen précis : albuminurie et filtration, rétine, pied.</li><li>Une atteinte active impose un rythme propre, plus rapide que le dépistage annuel.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-a10-fenetre-1" data-title="Pied diabétique : examen et orientation"><div id="e10-a10-fenetre-1"><p>L’examen inspecte les deux pieds, entre les orteils, sous la plante et au niveau des appuis ; il décrit la plaie, puis cherche infection, profondeur et perfusion. Le guide suisse considère une plaie comme simple seulement si tous les critères sont réunis : grade 1, pas d’infection, pas d’artériopathie significative, pas de neuropathie ni de déformation. Pour la filière de plaie simple, le guide retient un monofilament perçu 4 fois sur 4 et une pallesthésie supérieure à 4/8; ces critères ne constituent pas une exclusion universelle de toute neuropathie; le guide suisse emploie deux pouls palpables et un index cheville-bras ≥ 0,9 pour orienter les plaies simples. Ce raccourci ne constitue pas un test d’exclusion : en présence d’une plaie ou d’une suspicion vasculaire, le guide IWGDF/ESVS/SVS 2023 associe les courbes Doppler, l’index cheville-bras et l’index orteil-bras; aucun résultat isolé n’exclut l’artériopathie. <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">Recommandations 2 et 4</a>.</p><p>Gangrène, cellulite, signes systémiques, ischémie aiguë et Charcot aigu relèvent d’une filière urgente. L’absence de douleur ne réduit pas cette gravité si la sensibilité est perdue. Toute plaie se revoit au moins chaque semaine ; une réduction de surface &lt; 10 % par semaine ou &lt; 50 % en quatre semaines impose l’escalade, et la décharge, l’infection et la vascularisation se coordonnent.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p></div></template>
<template data-pop="e10-a10-fenetre-2" data-title="Tableau multicompliqué : hiérarchisation"><div id="e10-a10-fenetre-2"><p>Exemple fictif : une personne ayant neuropathie et insuffisance rénale présente une nouvelle zone noire sur un orteil. La priorité est l’évaluation urgente du pied et de l’état général, puis la coordination des contraintes rénales et glycémiques. Attendre le prochain contrôle annuel serait inadapté.</p><p>La hiérarchisation répond à quatre questions : un organe ou la vie sont-ils menacés maintenant ? Quel examen manque pour préciser le mécanisme ? Quelles adaptations interfèrent avec les autres traitements ? Qui assure le suivi et l’accès effectif aux soins ? La réponse reste clinique ; compter le nombre de complications ne suffit pas.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p></div></template>
<template data-pop="pareto-e10-a10" data-title="Loi de Pareto — Autres complications et tableaux multiples"><div id="pareto-e10-a10"><p class="ratio" data-cover="e10-a10"></p><ul><li>Le pied se classe en simple, complexe ou urgence ; la plaie se gradue de 1 à 3 selon sa profondeur.</li><li>Le suivi est au moins hebdomadaire ; une réduction de surface &lt; 10 % par semaine impose l’escalade.</li><li>Gangrène, ischémie aiguë, infection systémique ou Charcot aigu appellent la filière urgente.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a>.</p></div></template>
<template data-pop="e10-a11-fenetre-1" data-title="Jour de maladie : règles et limites"><div id="e10-a11-fenetre-1"><p>La maladie peut accroître les besoins d’insuline même si la personne mange moins, car les hormones de stress augmentent la production hépatique de glucose. La couverture basale reste donc toujours organisée, tandis que les doses de repas et les corrections suivent le plan prescrit. La personne prépare lecteur, cétonémètre ou autre méthode définie, boissons, secours et numéro de contact.</p><p>Vomissements persistants, incapacité à boire, cétones croissantes, respiration anormale ou trouble de conscience imposent une évaluation urgente. La carte <button class="w" data-k="e10-gl-2">SSED</button> de suspension temporaire de certains médicaments ne constitue pas une règle d’arrêt de l’insuline. En cas d’hypoglycémie sévère, la dose suivante nécessite au contraire une décision médicale spécifique : aucune formule générale ne remplace cette réévaluation.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/68_SickDayRulesCard/Sick-Day-Rules_Meienberg_Einzeln_Schnittmarken.pdf" target="_blank" rel="noopener">SSED — carte Sick Day Rules — version téléchargée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="e10-a11-fenetre-2" data-title="Projet de grossesse : parcours"><div id="e10-a11-fenetre-2"><p>Préparer la conception permet de revoir équilibre glycémique, rétine, rein, traitements et matériel avec une équipe spécialisée. La <button class="w" data-k="e10-gl-2">SSED</button> 2025 recommande un conseil sur le capteur et l’automatisation avant et pendant la grossesse, avec un suivi au moins mensuel ; le système exact doit avoir des réglages et un accompagnement adaptés.</p><p>La plage de capteur retenue pendant la grossesse est 3,5–7,8 mmol/L, avec plus de 70 % du temps dans la plage, moins de 4 % sous 3,5 mmol/L, moins de 1 % sous 3,0 mmol/L et moins de 25 % au-dessus de 7,8 mmol/L. Le glucose moyen converti en <button class="w" data-k="e10-gl-1">HbA1c</button> estimée n’est pas utilisé. Une acidocétose pendant la grossesse est une urgence obstétricale : dans les données britanniques citées par le <button class="w" data-k="e10-gl-4">JBDS</button>, la mortalité fœtale atteignait 16 %. Après la naissance, les besoins diminuent et chaque <button class="w" data-k="e10-gl-5">FI</button> se vérifie pour l’allaitement : NovoRapid et Tresiba ne sont pas interchangeables sur ce point.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a>.</p></div></template>
<template data-pop="pareto-e10-a11" data-title="Loi de Pareto — Vie quotidienne et situations particulières"><div id="pareto-e10-a11"><p class="ratio" data-cover="e10-a11"></p><ul><li>Les objectifs diffèrent chez l’enfant, la personne âgée fragile et la femme enceinte, dont la plage est 3,5–7,8 mmol/L.</li><li>Tresiba ne devrait pas être utilisé pendant l’allaitement selon sa FI suisse.</li><li>Pour conduire avec un capteur, une glycémie &lt; 4,0 mmol/L interdit le départ et impose 45 minutes d’attente après correction.</li></ul><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/68_SickDayRulesCard/Sick-Day-Rules_Meienberg_Einzeln_Schnittmarken.pdf" target="_blank" rel="noopener">SSED — carte Sick Day Rules — version téléchargée le 13 octobre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a>.</p></div></template>
<template data-pop="e10-a12-fenetre-1" data-title="Critères diagnostiques officiels"><div id="e10-a12-fenetre-1"><p>Pour diagnostiquer le diabète, la <button class="w" data-k="e10-gl-2">SSED</button> retient les limites plasmatiques de 7,0 mmol/L à jeun et 11,1 mmol/L à deux heures d’une charge de 75 g, ou 11,1 mmol/L de façon aléatoire avec symptômes. Le document original utilise le signe ≥. Une extraction informatique qui affiche seulement > ne doit pas changer la règle.</p><p>Ces critères ne déterminent pas le type. Chez une personne avec suspicion de type 1 aigu, le médecin cherche la gravité sans attendre l’<button class="w" data-k="e10-gl-1">HbA1c</button>. Pour diagnostiquer l’acidocétose de l’adulte, le médecin utilise les trois composantes <button class="w" data-k="e10-gl-4">JBDS</button> présentées en A06 ; pour l’auto-immunité, il interprète les anticorps dans le contexte clinique.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a>.</p></div></template>
<template data-pop="e10-a12-fenetre-2" data-title="Pareto du traitement et du suivi"><div id="e10-a12-fenetre-2"><p>Quatre compétences dominent. Le médecin et la personne reconnaissent une urgence, comprennent le rôle basal et prandial de l’insuline, savent traiter une hypoglycémie et appliquer un plan de maladie ou de panne, et maintiennent le dépistage coordonné du rein, de l’œil et des pieds. La technologie facilite ces compétences, elle ne les remplace pas.</p><p>Une revue utile relie les données au vécu : hypoglycémies, horaires des excursions, repas, exercice, erreurs, fatigue des alarmes et accès aux soins. La décision se prend avec la personne et se réévalue. Un résultat numérique isolé n’autorise pas à déduire une dose, une aptitude à conduire ou l’absence de complication.</p><p class="src">Sources : <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a>.</p></div></template>
<template data-pop="pareto-e10-a12" data-title="Loi de Pareto — Critères formels, suivi et synthèse"><div id="pareto-e10-a12"><p class="ratio" data-cover="e10-a12"></p><ul><li>L’urgence métabolique est recherchée immédiatement; le diagnostic de diabète, son type et l’existence d’une crise sont trois questions distinctes.</li><li>À l’aigu, conscience, hydratation, cétones, pH et potassium décident ; au suivi, les quatre temps du capteur, les hypoglycémies et les organes.</li></ul><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_FR_1_.pdf" target="_blank" rel="noopener">SSED — diagnostic du diabète avec l’HbA1c — 2011</a> ; <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS — Management of hyperosmolar hyperglycaemic state in adults — 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED — critères suisses de qualité du suivi — 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.nice.org.uk/guidance/ng17/chapter/Recommendations" target="_blank" rel="noopener">NICE NG17 — Type 1 diabetes in adults — recommandations avec amendements 2022, page consultée le 13 octobre 2026</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000812.pdf" target="_blank" rel="noopener">HUG — Hypoglycémie, prise en charge — 2 septembre 2022, version 1.0</a> ; <a href="https://www.revmed.ch/view/415288/3626033/RMS_639_449.pdf" target="_blank" rel="noopener">Revue Médicale Suisse — crises hyperglycémiques — 2019, volume 639, p. 449</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680625620017" target="_blank" rel="noopener">Swissmedic — Tresiba, information professionnelle — décembre 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic — Baqsimi 3 mg nasal, information professionnelle — mars 2026</a>.</p></div></template>
<template data-pop="e10-a06-potassium" data-title="Acidocétose : potassium et vitesse de réponse"><div id="e10-a06-potassium"><p><b>Pourquoi le potassium baisse sous traitement.</b> Dans l’acidocétose, l’acidose et le manque d’insuline déplacent le potassium des cellules vers le plasma, tandis que la diurèse osmotique l’élimine dans l’urine. La kaliémie d’admission peut donc être normale ou élevée alors que le stock corporel est bas. L’insuline réactive l’entrée du potassium dans les cellules : la kaliémie chute, parfois brutalement. La <button class="w" data-k="e10-gl-5">FI</button> suisse de NovoRapid rappelle qu’une hypokaliémie non traitée peut entraîner une paralysie respiratoire, une arythmie ventriculaire et le décès, surtout sous insuline intraveineuse.</p><p><b>Règle du protocole britannique.</b> Au-dessus de 5,5 mmol/L, la perfusion ne contient pas de potassium ; entre 3,5 et 5,5 mmol/L, elle en contient 40 mmol par litre si la personne urine ; sous 3,5 mmol/L, un avis senior organise un apport supplémentaire. Si la kaliémie sort de 4,0–5,5 mmol/L, elle se contrôle chaque heure.</p><p><b>Calcul de la vitesse de réponse, exemple fictif.</b> La vitesse se calcule par la différence entre deux mesures divisée par le temps écoulé. Cétones 5,2 mmol/L à 10 h puis 4,8 mmol/L à 11 h : (5,2 − 4,8) ÷ 1 h = 0,4 mmol/L/h, inférieure à l’objectif de 0,5. L’équipe vérifie d’abord que la pompe fonctionne, que la ligne est connectée et que le volume restant est correct ; si tout fonctionne, le prescripteur réévalue le débit selon le protocole hospitalier et le produit exact. Sans mesure des cétones, des bicarbonates passant de 11 à 13 mmol/L en une heure montent de 2 mmol/L/h, sous l’objectif de 3,0, et conduisent au même raisonnement.</p><p><b>Limites.</b> Les objectifs de réponse et les règles de potassium décrivent le protocole adulte du <button class="w" data-k="e10-gl-4">JBDS</button> 2023 ; l’hôpital suisse applique son propre protocole et la FI du produit exact, et l’enfant relève d’un protocole pédiatrique.</p><p class="src">Sources : <a href="https://abcd.care/sites/default/files/site_uploads/JBDS_Guidelines_Current/JBDS_02_DKA_Guideline_with_QR_code_March_2023.pdf" target="_blank" rel="noopener">JBDS — The Management of Diabetic Ketoacidosis in Adults — mars 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Swissmedic — NovoRapid, information professionnelle — avril 2026</a>.</p></div></template>
<template data-pop="e10-a08-metriques" data-title="Métriques du capteur : calcul pas à pas"><div id="e10-a08-metriques"><p>Chaque métrique est une proportion : la durée passée dans une plage divisée par la durée réellement enregistrée, multipliée par 100. Le dénominateur est donc la durée mesurée, et non la période entière ; la couverture indique la part de la période réellement enregistrée.</p><p><b>Exemple fictif sur 14 jours, soit 336 heures.</b> Le capteur a enregistré 320 heures : couverture 320 ÷ 336 × 100 = 95,2 %. Sur ces 320 heures, 16 heures sont sous 3,9 mmol/L, soit 16 ÷ 320 × 100 = 5,0 %, dont 4 heures sous 3,0 mmol/L, soit 1,25 %. Ensuite, 72 heures sont au-dessus de 10 mmol/L, soit 22,5 %, dont 12 heures au-dessus de 13,9 mmol/L, soit 3,75 %. Le temps dans la plage vaut donc (320 − 16 − 72) ÷ 320 × 100 = 72,5 %.</p><p><b>Interprétation.</b> Le temps dans la plage dépasse 70 % et le temps au-dessus respecte les objectifs de la <button class="w" data-k="e10-gl-2">SSED</button> ; pourtant, le temps sous 3,9 mmol/L dépasse 4 %. La priorité est donc de réduire les hypoglycémies avant toute autre adaptation.</p><p><b>Coefficient de variation.</b> Il mesure la variabilité : écart-type × 100 ÷ glucose moyen, les deux en mmol/L. Avec un écart-type fictif de 3,0 mmol/L et une moyenne de 8,0 mmol/L, le coefficient vaut 37,5 %, au-dessus du repère &lt; 36 % cité par le texte suisse de conduite. Une variabilité élevée signale des oscillations qui favorisent l’hypoglycémie même lorsque la moyenne est bonne.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2025_Swiss_Diabetes_and_Technology_Recommendations_inkl_Table_E.pdf" target="_blank" rel="noopener">SSED — recommandations suisses sur les technologies du diabète — 25 février 2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a>.</p></div></template>
<template data-pop="e10-a10-pied-grades" data-title="Pied diabétique : réduction de surface et escalade"><div id="e10-a10-pied-grades"><p>Le guide suisse mesure l’évolution d’une plaie par la réduction de sa surface, rapportée à la surface initiale : (surface initiale − surface actuelle) ÷ surface initiale × 100. Le calcul exige une mesure reproductible, par exemple avec la même méthode et une photographie documentée, comme le guide le demande.</p><p><b>Exemple fictif.</b> Une plaie plantaire de grade 1 mesure 4,0 cm², puis 3,7 cm² une semaine plus tard : (4,0 − 3,7) ÷ 4,0 × 100 = 7,5 %. Cette réduction est inférieure à 10 % par semaine : la plaie passe au niveau 2, avec un spécialiste du pied diabétique. Si elle mesure 2,4 cm² après quatre semaines, la réduction vaut (4,0 − 2,4) ÷ 4,0 × 100 = 40 %, inférieure à 50 % : le niveau 3, avec l’équipe interprofessionnelle, devient nécessaire.</p><p>La profondeur se gradue en trois niveaux : grade 1 limité au derme, grade 2 atteignant fascias, muscles, tendons ou capsules, grade 3 atteignant l’os ou l’articulation. Une plaie plantaire, donc exposée à la pression, ne remplit pas les critères du traitement standard de premier recours. Le guide ne fixe pas ici de schéma antibiotique : l’infection suit la recommandation spécifique et la gravité des signes locaux et généraux.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare / SSED — guide pratique du pied diabétique — 2023</a>.</p></div></template>
<template data-pop="e10-a11-conduite" data-title="Conduite automobile : second groupe médical et exemple"><div id="e10-a11-conduite"><p><b>Second groupe médical.</b> Il comprend les permis D, D1, C et C1, l’autorisation de transport professionnel de personnes et les experts de la circulation. Selon le texte <button class="w" data-k="e10-gl-2">SSED</button>/<button class="w" data-k="e10-gl-31">SGRM</button> 2025, les exigences minimales médicales excluent les permis D et D1 sous un traitement exposant à l’hypoglycémie. Une autorisation exceptionnelle, au sens de l’article 7, alinéa 3, de l’ordonnance réglant l’admission à la circulation routière, peut être examinée par un médecin de niveau 4. Elle exige toutes les conditions suivantes : traitement et suivi par un endocrinologue-diabétologue ; soit un diabète de type 1 traité par pompe en boucle fermée hybride avec mesure continue du glucose, soit un diabète de type 2 traité par une insuline basale à action ultralongue avec un capteur ; ce dispositif utilisé depuis au moins trois mois ; aucune hypoglycémie sévère depuis douze mois ; perception conservée (score de Clarke &lt; 4) ; confirmation du spécialiste que la personne a été formée et utilise correctement la pompe et le capteur (type 1) ou le capteur (type 2). Une injection basal–bolus, même avec capteur, ne remplit donc pas ces conditions.</p><p>Pour l’ensemble du second groupe, une <button class="w" data-k="e10-gl-1">HbA1c</button> &gt; 8,5 % exclut l’admission ou le maintien, de même qu’une complication pertinente pour la conduite. Pour les permis C et C1, le transport professionnel de personnes et les experts de la circulation, une évaluation par un endocrinologue-diabétologue et une expertise de médecine du trafic au moins de niveau 3 sont toujours nécessaires. Le tableau suivant reprend les cinq catégories de risque du tableau 3 de la directive suisse pour l’ensemble du second groupe ; dans les catégories C et C1, l’aptitude suppose en outre un métabolisme stable et la capacité démontrée d’éviter les hypoglycémies.</p><table class="t"><tr><th>Risque</th><th>Traitement</th><th>Mesures du second groupe</th></tr><tr><td>Aucun</td><td>Metformine, agonistes du récepteur du peptide apparenté au glucagon de type 1, seuls ou doubles avec le polypeptide insulinotrope dépendant du glucose, inhibiteurs de la dipeptidyl-peptidase 4, inhibiteurs du cotransporteur sodium–glucose de type 2, ou leur association</td><td>Aucune mesure de glycémie nécessaire avant ou pendant le trajet.</td></tr><tr><td>Faible</td><td>Insuline basale à action ultralongue (dégludec, glargine 300 U/mL), gliclazide ou glinides</td><td>Permis D et D1 exclus, sauf autorisation exceptionnelle après expertise obligatoire de niveau 4 ; glycémie régulière 3 à 4 fois par jour (ou capteur) ; pas de mesure nécessaire avant chaque trajet ; glucides et lecteur de glycémie dans le véhicule ; spécialiste et expertise de médecine du trafic de niveau 3 au moins.</td></tr><tr><td>Moyen</td><td>Insulines à action prolongée (glargine 100 U/mL, détémir) ou insuline coformulée (Ryzodeg) une à deux fois par jour ; basal–bolus avec capteur ou stylos connectés ; pompe en boucle fermée hybride</td><td>Permis D et D1 exclus, sauf autorisation exceptionnelle après expertise obligatoire de niveau 4 ; mesure avant chaque trajet, ou alarmes du capteur ; glucides et lecteur dans le véhicule ; &lt; 4,0 mmol/L : pas de conduite, glucides rapides et 45 minutes d’attente ; spécialiste et expertise de médecine du trafic de niveau 3 au moins.</td></tr><tr><td>Élevé</td><td>Basal–bolus sans capteur ; pompe sans boucle fermée hybride ; sulfonylurées à action prolongée</td><td>Permis D et D1 exclus ; délai d’attente de trois mois en règle générale ; contrôle avant et pendant les longs trajets ; 4–5 mmol/L : 10–20 g de glucides ; pas de conduite &lt; 4 mmol/L ; glucides et lecteur dans le véhicule ; spécialiste et expertise de médecine du trafic de niveau 3 au moins.</td></tr><tr><td>Très élevé</td><td>Au moins une hypoglycémie sévère par an ou perception altérée (score de Clarke ≥ 4)</td><td>Permis D et D1 exclus ; délai d’au moins trois mois sans hypoglycémie sévère ; capteur obligatoire ; contrôle avant et pendant les longs trajets ; pas de conduite &lt; 5 mmol/L ; glucides et lecteur dans le véhicule ; suivi rapproché par le spécialiste et expertise de médecine du trafic de niveau 4.</td></tr></table><p>La lecture se fait par le traitement, puis par l’histoire hypoglycémique : un conducteur professionnel sous dégludec relève du risque faible, mais une hypoglycémie sévère dans l’année le fait passer au risque très élevé. Dans cette dernière ligne, le délai sans hypoglycémie sévère et le capteur obligatoire sont des conditions, et non des conseils.</p><p><b>Pourquoi ces règles.</b> L’hypoglycémie est la cause principale du risque d’accident lié au diabète, car elle altère la concentration, la motricité fine et les réflexes. Le capteur abaisse le seuil de départ à 4,0 mmol/L parce que ses alarmes et ses flèches de tendance avertissent avant la baisse ; sans capteur, la marge exigée est plus grande.</p><p><b>Exemple fictif.</b> Luc, 30 ans, permis B, basal–bolus sans capteur, mesure 4,6 mmol/L avant de partir. Le tableau du texte suisse prévoit 10–20 g de glucides entre 4 et 5 mmol/L ; le texte courant exige ≥ 5,0 mmol/L avant le départ pour ce niveau de risque. Luc prend donc ses glucides, et la règle applicable à son départ se précise avec son diabétologue. S’il avait mesuré 3,8 mmol/L, il ne partirait pas : glucides rapides, puis attente d’au moins 45 minutes, car les fonctions cérébrales récupèrent plus lentement que la glycémie.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED / médecine légale — diabète et conduite — 1 août 2025</a>.</p></div></template>
