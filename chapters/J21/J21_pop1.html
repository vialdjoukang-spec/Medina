<template data-pop="j21-gravite" data-title="Degrés de gravité de la bronchiolite : signes, seuils et pièges"><p>Deux grilles européennes récentes gradent la bronchiolite après désobstruction nasale, chez un enfant calme. Elles reposent sur les mêmes signes et diffèrent surtout par les seuils.</p><table class="t"><tr><th>Critère</th><th>SSPP 2020 : sévère si</th><th>Haute Autorité de santé 2019 : grave si</th></tr><tr><td>État général</td><td>Apathie</td><td>Altération, dont hypotonie et geignement</td></tr><tr><td>Fréquence respiratoire, comptée sur une minute</td><td>Supérieure à 70/min (modérée dès 60/min)</td><td>70/min ou plus, ou inférieure à 30/min, respiration superficielle, pauses (modérée de 60 à 69/min)</td></tr><tr><td>Fréquence cardiaque</td><td>Non retenue</td><td>Supérieure à 180 ou inférieure à 80/min</td></tr><tr><td>Signes de lutte</td><td>Tirage marqué</td><td>Mise en jeu intense des muscles accessoires</td></tr><tr><td>SpO₂ en air ambiant</td><td>Inférieure à 88 %</td><td>90 % ou moins à l’éveil, ou cyanose</td></tr><tr><td>Alimentation</td><td>Moins de 50 %, détresse en buvant</td><td>Réduction importante ou refus</td></tr></table><p class="lab">Lecture</p><p>Dans la grille française, la forme légère exige que tous les critères soient rassurants, et un seul critère grave classe l’épisode comme grave. La forme modérée y correspond à une SpO₂ supérieure à 90 % et au plus égale à 92 %, ou à moins de 50 % des apports sur trois repas consécutifs. Les signes de lutte (muscles intercostaux inférieurs et sterno-cléido-mastoïdiens, balancement thoraco-abdominal, battement des ailes du nez) y sont absents ou légers, modérés, puis intenses. Le NICE fait envisager l’hôpital au-delà de 60 cycles par minute et adresse en urgence au-delà de 70 en cas de détresse sévère.</p><div class="key"><b>Piège.</b> Une fréquence inférieure à 30 par minute, ou une respiration superficielle, chez un nourrisson en détresse traduit l’épuisement : c’est un critère de gravité, non un signe rassurant. Ces grilles orientent sans remplacer la réévaluation, car l’état varie beaucoup pendant les premiers jours et avec l’encombrement nasal.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020, tableau 2</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, formes cliniques et liste de contrôle</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.2.1 et 1.2.2</a>.</p></template>

<template data-pop="j21-sspp" data-title="Recommandations sur la bronchiolite : textes suisses et NICE"><p class="lab">Textes suisses</p><p>Le groupe suisse de pneumologie pédiatrique (SAPP) a publié en 2003 des recommandations de traitement de la bronchiolite aiguë du nourrisson. En 2020, trois pneumologues pédiatres suisses ont publié dans le Forum Médical Suisse une mise à jour critique, évaluée par les pairs, qui confirme la stratégie d’intervention minimale et abaisse le seuil d’oxygène à 90 %. La prévention relève des recommandations de l’OFSP et de la CFV, mises à jour en 2026.</p><p class="lab">NICE NG9</p><p>La recommandation britannique « Bronchiolitis in children: diagnosis and management » date du 1<sup>er</sup> juin 2015. Sa révision du 9 août 2021, fondée sur un essai randomisé, a abaissé à 90 % le seuil de saturation pour l’hospitalisation, l’oxygène et la sortie dès 6 semaines ; elle a maintenu 92 % avant 6 semaines, en cas de maladie sous-jacente et pour envisager l’adressage depuis les soins primaires. Les autres recommandations datent de 2015.</p><p class="lab">Arbitrage de ce cours</p><p>Lorsque les textes divergent, la source primaire applicable la plus récente l’emporte. Pour la prise en charge, ce cours retient la mise à jour suisse de 2020 et la révision du NICE de 2021, recommandation européenne formelle la plus récemment révisée et concordante avec le texte suisse ; la recommandation française de 2019 complète les points que les deux autres ne traitent pas. Pour la prévention, le texte suisse de 2026 fait foi.</p><div class="key"><b>Limite.</b> La mise à jour de 2020 est un article de revue et non une recommandation formelle gradée ; le texte de 2003 reste le dernier document national de ce type.</div><p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, Paediatrica 2003;14(6):18-22</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben, Regamey et Hammer, Forum Médical Suisse 2020;20(9-10):155-159</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, version du 09.08.2021</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026</a>.</p></template>

<template data-pop="j21-def-europe" data-title="Bronchiolite : définition européenne et américaine"><p>La définition européenne exige des crépitants inspiratoires fins ou des sibilants expiratoires aigus après un tableau viral saisonnier. L’Australie retient la même définition en insistant sur l’âge inférieur à 12 mois, le premier épisode et les crépitants.</p><p class="lab">Conséquence</p><p>Pour les cliniciens américains, ce sont les sibilants, et non les crépitants, qui définissent la bronchiolite après une infection virale des voies aériennes supérieures, et la définition n’est pas limitée au nourrisson. Les études américaines incluent donc des enfants sifflants jusqu’à 2 ans, chez qui l’Europe aurait diagnostiqué une bronchite obstructive. Un effet des bronchodilatateurs observé dans une telle population ne s’applique pas au nourrisson européen.</p><div class="key"><b>Limite.</b> La transition entre bronchiolite du nourrisson et bronchite obstructive du petit enfant est continue.</div><p class="src">Référence : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020</a>.</p></template>

<template data-pop="j21-ers-def" data-title="Définitions ERS/ESCMID des infections respiratoires basses de l’adulte"><p>La recommandation conjointe de l’ERS et de l’ESCMID (2011) propose des définitions pragmatiques, inchangées depuis 2005. Elles sont conçues pour être simples en pratique, au prix d’une certaine imprécision.</p><table class="t"><tr><th>Entité</th><th>Définition</th></tr><tr><td>Infection respiratoire basse</td><td>Maladie aiguë de 21 jours au plus, avec toux et au moins un autre symptôme respiratoire bas, sans autre explication</td></tr><tr><td>Bronchite aiguë</td><td>Maladie aiguë avec toux, chez un patient sans maladie pulmonaire chronique, sans autre explication</td></tr><tr><td>Pneumonie suspectée</td><td>Toux et au moins un signe : signes focaux nouveaux, fièvre de plus de quatre jours, dyspnée ou tachypnée</td></tr><tr><td>Pneumonie certaine</td><td>Même tableau avec une opacité radiographique probablement nouvelle ; chez la personne âgée, opacité et maladie aiguë sans autre cause</td></tr></table><p>Ces cadres ne s’excluent pas : « infection respiratoire basse » est le terme générique, employé aussi pour les cas inclassables.</p><div class="key"><b>Conséquence.</b> Le terme désigne une étape du raisonnement, non un diagnostic final : il oblige à chercher la pneumonie et les exacerbations.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead et al., Clin Microbiol Infect 2011, définitions</a>.</p></template>

<template data-pop="j21-epi-ch" data-title="Données suisses sur le VRS"><p class="lab">Hospitalisations du nourrisson (OFSP 2026)</p><p>De 2014-2015 à 2019-2020, le taux annuel moyen d’hospitalisation pour VRS avant 1 an était de 2410 pour 100 000 (intervalle de confiance à 95 % : 2084 à 2760). Environ 56 % de toutes les hospitalisations pour VRS concernent des nourrissons. Avant la pandémie, 6,4 % des nourrissons atteints du VRS étaient hospitalisés au cours de leur deuxième mois de vie, et 10,7 % en 2022-2023.</p><p class="lab">Registre hospitalier 2003-2021</p><p>Les hospitalisations ont augmenté selon un rythme bisannuel jusqu’à 3575 en 2018-2019, puis 2487 en 2019-2020 et 902 en 2020-2021. Les deux tiers concernaient des nourrissons, d’âge moyen 118 jours ; les adultes hospitalisés avaient 74 ans en moyenne. Au total, 7,2 % des patients sont passés en soins intensifs, et 90,8 % des nourrissons hospitalisés étaient nés après 35 semaines, sans dysplasie bronchopulmonaire ni cardiopathie congénitale.</p><p class="lab">Saisonnalité</p><p>Pendant la pandémie, le pic s’est déplacé à l’été 2021, avant de revenir en hiver dès 2022, comme l’a observé l’hôpital du Jura à Delémont.</p><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 4.3</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39328156/" target="_blank" rel="noopener">Stucki et al., Euro Surveill 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39137355/" target="_blank" rel="noopener">Hayes et al., hôpital du Jura, Swiss Med Wkly 2024</a>.</p></template>

<template data-pop="j21-wheezing-long" data-title="Bronchiolite, sifflements récidivants et asthme"><p>Plusieurs études associent une bronchiolite sévère du nourrisson à un risque accru d’asthme et de sifflements récidivants pendant l’enfance. Selon le groupe de travail de l’EAACI, l’infection respiratoire basse à VRS est modestement associée aux sifflements récidivants ou à l’asthme à l’âge scolaire (rapports de cotes de 2,5 à 4,3), sans association avec l’atopie. Un premier épisode sifflant sévère à rhinovirus avant 2 ans est, lui, associé à l’asthme atopique scolaire (rapport de cotes de 5,0).</p><p class="lab">Association ou causalité</p><p>Deux essais randomisés chez le prématuré ont tranché en partie. Le palivizumab a réduit les sifflements récidivants rapportés par les parents, mais non l’asthme diagnostiqué par un médecin à 6 ans. Pour l’EAACI, ces résultats indiquent que l’infection à VRS ne cause pas l’asthme : une vulnérabilité génétique ou environnementale commune expliquerait l’association.</p><div class="key"><b>Conséquence.</b> La Haute Autorité de santé ne recommande ni les corticoïdes inhalés pour prévenir l’asthme ou les récidives sifflantes après une bronchiolite, ni les antileucotriènes pour prévenir les récidives.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30276826/" target="_blank" rel="noopener">Jartti et al., groupe de travail EAACI, Allergy 2019</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 4.1</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a>.</p></template>

<template data-pop="j21-adulte-vrs" data-title="Le VRS chez l’adulte"><p class="lab">Clinique</p><p>L’adulte âgé infecté présente d’abord une infection des voies respiratoires supérieures de deux à quatre jours. Une toux sèche initiale touche environ 90 % des malades, et près de la moitié ont une fièvre supérieure à 38 °C, plus rarement à un âge avancé. Les sibilants sont plus fréquents qu’avec la grippe, même sans maladie obstructive préexistante.</p><p class="lab">Gravité</p><p>Chez l’adulte de 65 ans ou plus, une infection conduit à l’hospitalisation dans 4 à 17 % des cas ; 26 % des hospitalisés passent en soins intensifs, et la mortalité hospitalière atteint 8 %. Dans les pays à revenu élevé, une revue estime à plus de 5 millions les infections respiratoires aiguës à VRS par an après 60 ans, avec 470 000 hospitalisations et 33 000 décès hospitaliers.</p><p class="lab">Sous-diagnostic</p><p>Le VRS est rarement recherché chez l’adulte ; sa charge virale est faible et son excrétion courte. Les consultations et hospitalisations liées au VRS seraient sous-diagnostiquées d’un facteur 1,5 à plus de 20. Beaucoup sont enregistrées comme infections aiguës des voies respiratoires inférieures sans précision, ou comme décompensations de maladies chroniques.</p><p class="src">Référence : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitres 4.1 et 4.3.3, tableau 4</a>.</p></template>

<template data-pop="j21-ns2" data-title="De la protéine NS2 à l’hypoxémie"><p class="lab">Observation</p><p>Les cellules ciliées infectées par le VRS s’arrondissent et sont expulsées de l’épithélium. Des virus mutants privés de gènes viraux ont montré que cette morphologie dépend d’un seul gène, celui de la protéine non structurale 2 ; un virus parainfluenza modifié pour exprimer NS2 reproduit le même aspect.</p><p class="lab">Conséquence</p><p>Les cellules desquamées s’accumulent dans la lumière étroite des bronchioles, avec des débris nécrotiques, des cellules géantes multinucléées et une majorité de neutrophiles. Ce matériel obstrue les voies aériennes distales, d’autant plus aisément que leur calibre est petit et que la ventilation collatérale du nourrisson est peu développée. La perte des cils supprime en outre la clairance mécanique, ce qui retient les débris sur place.</p><p class="lab">Du piégeage à l’hypoxémie</p><p>L’air piégé derrière une obstruction complète est résorbé : des micro-atélectasies et des atélectasies sous-segmentaires apparaissent. Les régions perfusées mais mal ventilées créent un déséquilibre ventilation-perfusion et un shunt intrapulmonaire, qui aggravent l’hypoxémie. Le virus peut aussi atteindre les alvéoles, directement ou par extension de l’inflammation bronchiolaire ; l’œdème alvéolaire gêne alors les échanges gazeux, jusqu’à l’insuffisance respiratoire.</p><div class="key"><b>Conséquence et limite.</b> Les opacités radiographiques de la bronchiolite correspondent souvent à ces atélectasies et non à une surinfection. Une partie des données sur NS2 provient de modèles animaux et de cultures cellulaires ; elles concordent avec les observations anatomopathologiques chez le nourrisson.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25302625/" target="_blank" rel="noopener">Pickles et al., J Pathol 2015</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020, tableau 5</a>.</p></template>

<template data-pop="j21-apnee" data-title="Apnées du jeune nourrisson"><p class="lab">Terrain</p><p>Le jeune nourrisson, surtout avant 6 semaines, peut présenter une apnée sans autre signe clinique ; la prématurité accroît ce risque. C’est pourquoi l’âge inférieur à 2 mois, en âge corrigé, figure parmi les critères de vulnérabilité.</p><p class="lab">Conduite</p><p>Une apnée observée ou rapportée impose l’hospitalisation ; répétée, elle signe une insuffisance respiratoire imminente et fait discuter les soins intensifs. Le NICE fait aspirer les voies aériennes supérieures d’un nourrisson qui présente une apnée, même sans sécrétions visibles. La surveillance continue de la saturation est indiquée avant 2 mois. La Haute Autorité de santé ne recommande pas la caféine dans la bronchiolite compliquée d’apnées (grade C).</p><div class="key"><b>Piège.</b> Un nourrisson de 4 semaines amené en hiver pour un malaise peut être au début d’une bronchiolite, sans toux ni tirage.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.5, 1.1.10, 1.3.2 et 1.4.8</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24694087/" target="_blank" rel="noopener">Øymar et al., 2014</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a>.</p></template>

<template data-pop="j21-virus" data-title="Virus de la bronchiolite"><p>La part de chaque virus avant 12 mois montre la domination du VRS, mais aussi la place du rhinovirus, dont le profil clinique diffère.</p><table class="t"><tr><th>Virus</th><th>Part avant 12 mois</th></tr><tr><td>Virus respiratoire syncytial</td><td>60 à 80 %</td></tr><tr><td>Rhinovirus</td><td>14 à 30 %</td></tr><tr><td>Bocavirus humain</td><td>14 à 15 %</td></tr><tr><td>Métapneumovirus humain</td><td>3 à 12 %</td></tr><tr><td>Entérovirus, adénovirus, coronavirus, virus de la grippe</td><td>1 à 8 %</td></tr></table><p>Plusieurs virus sont retrouvés ensemble chez 20 à 30 % des enfants, sans gravité supplémentaire démontrée. Le VRS comporte deux sous-groupes, A et B, cliniquement proches.</p><p class="lab">Deux profils</p><p>Le groupe de travail de l’EAACI distingue la bronchiolite à VRS, du nourrisson jeune, dominée par l’obstruction mécanique par mucus et débris cellulaires, et le premier épisode sifflant à rhinovirus, de l’enfant plus âgé, associé à une prédisposition atopique et à un risque élevé d’asthme ultérieur.</p><div class="key"><b>Conséquence.</b> Un premier épisode sifflant chez un enfant atopique de 18 mois n’a ni le pronostic ni la réponse thérapeutique d’une bronchiolite à VRS d’un nourrisson de 2 mois.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24694087/" target="_blank" rel="noopener">Øymar et al., 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30276826/" target="_blank" rel="noopener">Jartti et al., Allergy 2019</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 1.2</a>.</p></template>

<template data-pop="j21-facteurs-risque" data-title="Facteurs de risque de bronchiolite grave"><p class="lab">Listes des recommandations</p><p>Le NICE retient les terrains du tableau de l’îlot 4 : maladie pulmonaire chronique, cardiopathie à retentissement hémodynamique, âge inférieur à 3 mois, prématurité surtout avant 32 semaines, maladie neuromusculaire, déficit immunitaire. La Haute Autorité de santé y ajoute la prématurité avant 36 semaines d’aménorrhée, l’âge inférieur à 2 mois en âge corrigé, une ventilation néonatale prolongée, le polyhandicap et la trisomie 21.</p><p class="lab">Données suisses</p><p>Dans le registre hospitalier suisse, la naissance entre octobre et mars, le faible poids de naissance, la naissance multiple, les malformations du cœur, des gros vaisseaux, des poumons, des voies aériennes ou biliaires, une maladie hépatique, l’hémophilie, la trisomie 21, un déficit immunitaire, une maladie du système nerveux central, du cœur ou des poumons, la mucoviscidose, l’insuffisance rénale et une carence sévère en vitamine D sont associés à l’hospitalisation.</p><div class="key"><b>Conséquence.</b> Plus de 80 % des nourrissons hospitalisés pour un VRS sont nés à terme et en bonne santé : l’absence de facteur de risque ne rassure pas, et elle ne dispense pas d’immuniser l’enfant.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.2.3</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 4.1</a>.</p></template>

<template data-pop="j21-environnement" data-title="Facteurs d’environnement"><p>La Haute Autorité de santé (2019) retient des critères d’environnement qui imposent une vigilance accrue, avec leur niveau de preuve. Le tableau distingue ceux qui valent pour tout nourrisson de ceux qui ont été établis chez le prématuré.</p><table class="t"><tr><th>Population</th><th>Facteur</th><th>Grade</th></tr><tr><td>Tout nourrisson</td><td>Tabagisme passif : recours aux soins accru ; transfert en réanimation plus fréquent</td><td>A ; C</td></tr><tr><td>Tout nourrisson</td><td>Contexte social défavorable, difficulté d’accès aux soins empêchant le retour à domicile</td><td>C</td></tr><tr><td>Prématuré de moins de 35 semaines</td><td>Tabagisme pendant la grossesse, crèche, absence d’allaitement maternel</td><td>A</td></tr><tr><td>Prématuré de moins de 35 semaines</td><td>Naissance autour de l’épidémie à VRS</td><td>B</td></tr><tr><td>Prématuré de moins de 35 semaines</td><td>Fratrie</td><td>C</td></tr></table><p>Le tableau se lit par la première colonne : chez un nourrisson né à terme, seuls le tabagisme passif et le contexte social figurent dans la liste. Un début des signes de lutte ou de la toux datant de moins de 48 heures compte aussi, car l’aggravation survient surtout pendant cette période.</p><div class="key"><b>Conséquence.</b> La protection stricte contre la fumée et les autres polluants inhalés fait partie des conseils donnés aux parents, en Suisse comme en France.</div><p class="src">Références : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, critères de vulnérabilité et environnementaux</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableau 4</a>.</p></template>

<template data-pop="j21-evolution" data-title="Chronologie de la bronchiolite"><p class="lab">Début et phase d’état</p><p>Un prodrome rhinitique d’un à trois jours précède la toux, la tachypnée ou le tirage. Les symptômes et les difficultés alimentaires culminent entre le troisième et le cinquième jour ; tout nourrisson peut s’aggraver pendant les 48 premières heures de gêne respiratoire. La phase aiguë dure en moyenne dix jours.</p><p class="lab">Résolution</p><p>La toux disparaît chez 90 % des nourrissons en trois semaines ; une toux légère isolée peut persister jusqu’à quatre semaines. Au-delà, des signes respiratoires quotidiens imposent un avis spécialisé.</p><div class="key"><b>Conséquence.</b> Les parents sont prévenus que la toux peut durer plusieurs semaines, ce qui évite des consultations et des prescriptions inutiles.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.2 à 1.1.4</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a>.</p></template>

<template data-pop="j21-alimentation" data-title="Alimentation et déshydratation"><p class="lab">Mesure</p><p>Les apports se comparent aux apports habituels du nourrisson (allaitement, biberons, diversification). La Haute Autorité de santé classe en forme modérée une prise inférieure à 50 % sur trois repas consécutifs ; le NICE fait envisager l’hospitalisation à 50-75 % de l’habituel, selon le terrain. Une diurèse diminuée et une perte de poids signalent une déshydratation débutante.</p><p class="lab">Conduite</p><p>Les repas sont fractionnés (grade A) ; si l’enfant tète mal, la mère tire son lait. La mise à jour suisse conseille de surélever la tête après le repas pour limiter le reflux ; pour le sommeil, la Haute Autorité de santé rappelle le couchage sur le dos, à plat, et ne recommande pas la position proclive.</p><div class="key"><b>Conséquence.</b> Une alimentation insuffisante est à elle seule un critère d’hospitalisation ; elle se corrige par sonde gastrique avant toute perfusion.</div><p class="src">Références : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, support nutritionnel et positionnement</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.2.2, 1.3.2 et 1.4.11</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableaux 3 et 4</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003, tableau 2</a>.</p></template>

<template data-pop="j21-desobstruction" data-title="Désobstruction nasale"><p class="lab">Pourquoi</p><p>La désobstruction des voies aériennes supérieures améliore la respiration du nourrisson. Elle précède l’évaluation de la gravité et la mesure de la SpO₂, car un nez encombré fausse les deux. Selon la mise à jour suisse, l’hypoxémie s’améliore souvent dès la toilette nasopharyngée.</p><p class="lab">Comment</p><p>La mise à jour suisse de 2020 recommande des lavages au sérum physiologique (NaCl 0,9 %) et une aspiration régulière, superficielle à l’hôpital. La Haute Autorité de santé (2019) ne trouve aucune technique supérieure aux autres et ne recommande pas les aspirations nasopharyngées, qui ont plus d’effets indésirables. Le NICE (2015) ne recommande pas l’aspiration systématique ; il la propose en cas de détresse ou de difficulté alimentaire due aux sécrétions, et l’impose en cas d’apnée.</p><div class="key"><b>Arbitrage.</b> La mise à jour suisse de 2020, texte applicable le plus récent, fait foi : lavage et aspiration superficielle selon l’encombrement.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020, tableaux 4 et 5</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.4.6 à 1.4.8</a>.</p></template>

<template data-pop="j21-oxymetrie" data-title="Oxymétrie de pouls chez le nourrisson"><p class="lab">Indication</p><p>La SpO₂ se mesure chez tout nourrisson suspect de bronchiolite, y compris au cabinet si un oxymètre pédiatrique est disponible. L’opérateur doit être formé à son emploi chez le nourrisson ; un appareil avec courbe de pouls permet de reconnaître les artefacts.</p><p class="lab">Pièges</p><p>Un capteur mal placé fausse la valeur. Certains appareils surestiment ou sous-estiment la saturation lorsqu’elle est proche des seuils, et une surestimation a été rapportée chez les personnes à peau foncée. La saturation fluctue au début de la maladie : elle se mesure à plusieurs reprises, et des chutes brèves sous 90 % n’imposent pas d’oxygène à elles seules.</p><p class="lab">Surveillance continue</p><p>La Haute Autorité de santé l’indique dans les formes graves, sous oxygène, et pendant au moins 24 heures dans les formes modérées hospitalisées ou avant 2 mois ; elle n’est pas systématique chez l’enfant hospitalisé sans oxygène.</p><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.8 et 1.1.9</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, surveillance des besoins en oxygène</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a>.</p></template>

<template data-pop="j21-crepitants" data-title="Crépitants et sibilants de la bronchiolite"><p class="lab">Mécanisme</p><p>Les crépitants fins naissent de la réouverture des plus petites voies aériennes en fin d’inspiration. La mise à jour suisse les tient pour pathognomoniques de la bronchiolite, et leur présence est corrélée à la gravité clinique.</p><p class="lab">Valeur selon l’âge</p><p>Chez les plus jeunes nourrissons, des crépitants inspiratoires fins peuvent être la seule anomalie auscultatoire ; les sibilants expiratoires aigus dominent chez l’enfant plus âgé. Les sibilants définissent à eux seuls la bronchiolite dans la définition américaine, non dans la définition européenne.</p><div class="key"><b>Piège.</b> Des crépitants localisés et persistants, surtout avec une fièvre supérieure à 39 °C, évoquent une pneumonie plutôt qu’une bronchiolite. Des sibilants persistants sans crépitants, chez un enfant plus âgé, évoquent des sifflements viraux ou un asthme.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24694087/" target="_blank" rel="noopener">Øymar et al., 2014</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.6 et 1.1.7</a>.</p></template>

<template data-pop="j21-bio" data-title="Biologie sanguine dans la bronchiolite"><p class="lab">Position</p><p>Les examens sanguins ne sont pas recommandés de façon systématique, même chez le nourrisson fébrile. Ils se discutent dans les formes graves à l’hôpital.</p><p class="lab">Performances</p><p>Selon les recommandations suisses de 2003, une leucocytose supérieure à 15 000/µL n’a qu’une sensibilité et une spécificité d’environ 50 % pour distinguer une pneumonie bactérienne. Une CRP supérieure à 80 mg/L a une spécificité de 90 % mais une sensibilité de 35 %. La grippe et l’adénovirus peuvent élever la CRP. La surinfection bactérienne se suspecte d’abord sur la clinique : fièvre élevée persistante, dégradation de l’état général, aspect septique.</p><p class="lab">Ionogramme et gazométrie</p><p>Ils évaluent les décompensations respiratoires ou métaboliques et la natrémie, dans les seules formes graves hospitalisées.</p><p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, Paediatrica 2003</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.3.6</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a>.</p></template>

<template data-pop="j21-radio" data-title="Radiographie thoracique dans la bronchiolite"><p class="lab">Position</p><p>La radiographie n’est pas recommandée de façon systématique, même chez l’enfant fébrile, ni chez le nourrisson qui n’est pas hospitalisé. Elle se discute dans les formes les plus graves, lorsque les soins intensifs sont envisagés, ou pour un diagnostic différentiel.</p><p class="lab">Pourquoi elle égare</p><p>Les infiltrats et opacités sont fréquents dans l’infection à VRS et correspondent souvent à des atélectasies. Ils imitent une pneumonie et ne doivent pas servir à décider d’un antibiotique. La liste suisse « smarter medicine » de pédiatrie (2024) déconseille la radiographie de routine : elle n’améliore pas la prise en charge, expose aux rayons et multiplie les diagnostics erronés de pneumonie bactérienne.</p><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.3.7 et 1.3.8</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://www.smartermedicine.ch/de/top-5-listen/paediatrie-2024" target="_blank" rel="noopener">Pédiatrie Suisse, liste Top 5 2024, recommandation 5</a>.</p></template>

<template data-pop="j21-virologie" data-title="Recherche virale"><p class="lab">Examen de référence</p><p>L’amplification génique sur prélèvement respiratoire est l’examen de référence du VRS ; elle existe en panel multiplex avec la grippe et le SARS-CoV-2. Des tests antigéniques rapides existent aussi. La sérologie, qui exige des sérums appariés, et la culture, qui demande plusieurs jours, n’ont pas de place en routine.</p><p class="lab">Indications utiles</p><p>La recherche virale ne pose pas le diagnostic de bronchiolite et n’est pas systématique. Elle aide à regrouper les nourrissons infectés à l’hôpital pour limiter la transmission nosocomiale ; une hygiène rigoureuse peut toutefois y suppléer. Chez le nouveau-né dont la fièvre est bien tolérée, l’identification d’un virus peut limiter les examens. En période épidémique, la recherche de la grippe peut conduire à un antiviral. Dans un tableau atypique, la recherche d’autres virus renforce le diagnostic.</p><div class="key"><b>Interférences.</b> Le nirsévimab ne perturbe ni l’amplification génique ni les tests antigéniques rapides. Le clesrovimab peut fausser un test antigénique rapide : un résultat négatif chez un enfant au tableau évocateur se contrôle par amplification génique.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 4.2</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Beyfortus® (07.2026) et Enflonsia® (11.2025), Swissmedic (AIPS), consultées le 09.10.2026</a>.</p></template>

<template data-pop="j21-pneumonie-diff" data-title="Suspecter une pneumonie"><p class="lab">Chez l’enfant</p><p>Le NICE fait envisager une pneumonie devant une fièvre supérieure à 39 °C ou des crépitants localisés persistants. Numération, CRP et radiographie distinguent mal la pneumonie bactérienne de la bronchiolite : la décision repose d’abord sur la clinique.</p><p class="lab">Chez l’adulte</p><p>La recommandation ERS/ESCMID suspecte une pneumonie devant des signes auscultatoires focaux nouveaux, une dyspnée, une tachypnée, un pouls supérieur à 100 par minute ou une fièvre de plus de quatre jours.</p><div class="key"><b>Conséquence.</b> La pneumonie suspectée ou certaine justifie un antibiotique ; l’infection respiratoire basse sans pneumonie, non.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.1.6</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead et al., ERS/ESCMID 2011</a>.</p></template>

<template data-pop="j21-asthme-diff" data-title="Sifflements viraux et asthme du jeune enfant"><p>Le NICE fait penser à des sifflements viraux ou à un asthme précoce plutôt qu’à une bronchiolite chez le nourrisson plus âgé ou le jeune enfant qui présente des sibilants persistants sans crépitants, des épisodes sifflants récidivants ou une atopie personnelle ou familiale. Ces tableaux sont inhabituels avant 1 an. Le premier épisode sifflant à rhinovirus s’observe chez un enfant plus âgé, prédisposé à l’atopie.</p><p class="lab">Point de vue suisse</p><p>La bronchiolite est en principe la première manifestation d’une maladie obstructive du nourrisson et peut parfois récidiver. Lorsque les épisodes se répètent et que l’obstruction bronchique domine, un asthme du petit enfant est à envisager, surtout en cas d’atopie ou d’antécédents familiaux. La Haute Autorité de santé demande, devant un deuxième épisode rapproché avant 12 mois, d’envisager d’autres diagnostics.</p><div class="key"><b>Conséquence.</b> L’enfant qui siffle à répétition relève de la démarche de l’asthme. La mise à jour suisse n’envisage l’inhalation d’un bronchodilatateur qu’en cas de bronchite obstructive, et la recommandation de 2003 jugeait justifié un essai de bêta-2-mimétique chez le nourrisson à hyperréactivité bronchique connue, poursuivi seulement s’il répond.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.1.7</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableau 5</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003, annexe</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30276826/" target="_blank" rel="noopener">Jartti et al., 2019</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, définitions</a>.</p></template>

<template data-pop="j21-mucoviscidose" data-title="Diagnostics à évoquer devant des épisodes répétés"><p>Devant une bronchiolite récidivante ou atypique, la mise à jour suisse énumère les diagnostics différentiels suivants : asthme du petit enfant, surtout en cas d’atopie ou d’antécédents familiaux ; mucoviscidose ; dyskinésie ciliaire primitive ; fausses routes récidivantes ; anomalies cardiaques ; anomalies trachéales ou bronchiques congénitales rares.</p><p class="lab">Mucoviscidose</p><p>Le dépistage néonatal manque environ 5 % des cas. Un dépistage normal n’exclut donc pas la maladie chez un nourrisson aux épisodes répétés.</p><p class="lab">Signes d’évolution inhabituelle</p><p>La Haute Autorité de santé adresse au spécialiste l’enfant dont la toux quotidienne, la polypnée, les signes de lutte ou l’auscultation anormale persistent au-delà de quatre à six semaines, ou dont le poids fléchit.</p><div class="key"><b>Conséquence.</b> La répétition des épisodes et leur persistance, plus que leur intensité, conduisent au bilan spécialisé.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, circuits du patient</a>.</p></template>

<template data-pop="j21-reanimation" data-title="Insuffisance respiratoire et soins intensifs"><p class="lab">Insuffisance imminente</p><p>Le NICE retient trois signes : épuisement (léthargie, effort respiratoire qui diminue), apnées récidivantes, saturation qui ne se maintient pas malgré l’oxygène. Il propose alors une gazométrie capillaire si la détresse s’aggrave sous plus de 50 % d’oxygène, et une pression positive continue.</p><p class="lab">Critères de soins intensifs</p><p>La Haute Autorité de santé retient les apnées, l’épuisement apprécié sur la clinique, une capnie supérieure à 46-50 mmHg et un pH inférieur à 7,34, ainsi qu’une augmentation rapide des besoins en oxygène. Le transport est médicalisé ; avant 2 mois, il est confié de préférence à une équipe néonatale ou pédiatrique, avec surveillance de la respiration.</p><div class="key"><b>Nuance.</b> Selon les recommandations suisses de 2003, la décision de ventiler dépend de la situation clinique d’ensemble et non d’une valeur isolée de gaz du sang.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.10, 1.4.5 et 1.4.10</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003</a>.</p></template>
