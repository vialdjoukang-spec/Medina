<template data-pop="j21-siadh" data-title="Hyponatrémie et apports hydriques"><p class="lab">Mécanisme</p><p>Chez le nourrisson gravement atteint, une sécrétion inappropriée d’hormone antidiurétique retient l’eau libre. Des apports hydriques abondants, surtout par perfusion, exposent alors à l’intoxication à l’eau, à l’hyponatrémie et aux œdèmes.</p><p class="lab">Prévention</p><p>La mise à jour suisse de 2020 recommande, après correction d’un éventuel déficit, de ne pas dépasser les besoins d’entretien chez le nourrisson gravement malade, et de réduire les apports à environ 60 à 70 % de l’entretien pendant les 24 premières heures ; l’osmolarité urinaire offre une surveillance simple. Le NICE (2015) prescrit des solutés isotoniques lorsqu’une perfusion est nécessaire. Sous perfusion, les électrolytes sont contrôlés régulièrement.</p><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.4.12</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003</a>.</p></template>
<template data-pop="j21-suivi" data-title="Évolution prolongée et bronchiolite oblitérante"><p>Le médecin vérifie la guérison au plus tard quatre à six semaines après l’épisode, sur un examen clinique redevenu normal. Une toux légère, habituellement diurne, peut persister jusqu’à quatre semaines.</p><p class="lab">Signes qui imposent un avis spécialisé</p><p>Une toux quotidienne, diurne ou nocturne, au-delà de ce délai, une polypnée au repos, des signes de lutte, une auscultation anormale, un retentissement sur le poids ou une fièvre secondaire inexpliquée imposent un avis spécialisé. Le but est de dépister précocement une bronchiolite oblitérante.</p><div class="key"><b>Limite.</b> La Haute Autorité de santé fonde ces délais sur un accord d’experts.</div><p class="src">Référence : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, circuits du patient et critères de sortie</a>.</p></template>
<template data-pop="j21-oxygene-seuil" data-title="Seuils d’oxygène : arbitrage entre recommandations"><p>Trois textes européens fixent le seuil de saturation qui déclenche l’oxygène ; ils divergent de 2 points, ce qui suffit à changer la conduite pour de nombreux nourrissons.</p><table class="t"><tr><th>Source</th><th>Oxygène si SpO₂ persistante</th><th>Cible</th></tr><tr><td>NICE, révision du 09.08.2021</td><td>Inférieure à 90 % dès 6 semaines ; inférieure à 92 % avant 6 semaines ou en cas de maladie sous-jacente</td><td>Non précisée au-delà des seuils</td></tr><tr><td>SSPP, 2020</td><td>Inférieure à 90 %</td><td>Non précisée</td></tr><tr><td>Haute Autorité de santé, 2019</td><td>92 % ou moins dans les formes modérées</td><td>Plus de 92 % éveillé, plus de 90 % endormi ; plus de 94 % dans les formes graves ; saturation habituelle chez le cardiopathe</td></tr></table><p class="lab">Décision retenue</p><p>Le texte applicable le plus récent est la révision du NICE de 2021, qui concorde avec la mise à jour suisse de 2020 : oxygène sous 90 % dès 6 semaines, sous 92 % avant 6 semaines ou en cas de comorbidité. Ce choix repose sur l’essai britannique de Cunningham (2015), dans lequel une cible de 90 % était aussi sûre et efficace qu’une cible de 94 % chez des nourrissons de 6 semaines à 12 mois. Au cabinet, le NICE garde toutefois le seuil de 92 % pour envisager l’adressage à l’hôpital : il préserve une marge de sécurité chez un enfant qui peut s’aggraver, et l’oxymétrie y est moins fiable.</p><p class="lab">Limites</p><p>L’essai excluait les nourrissons de moins de 6 semaines et les enfants à haut risque : pour eux, le seuil de 92 % est un choix de prudence sans preuve directe.</p><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.2.2 et 1.4.4, justifications de 2021</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableau 5</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, oxygénothérapie</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26382998/" target="_blank" rel="noopener">Cunningham et al., Lancet 2015</a>.</p></template>
<template data-pop="j21-haut-debit" data-title="Oxygénothérapie nasale à haut débit"><p class="lab">Principe</p><p>De l’air réchauffé et humidifié, enrichi en oxygène, est délivré par canules nasales à environ 2 L/kg/min selon la Haute Autorité de santé (plus de 2 L/kg/min selon la mise à jour suisse), pour éviter la pression positive continue ou l’intubation.</p><p class="lab">Preuves</p><p>Dans l’essai multicentrique de Franklin (2018), mené hors des soins intensifs chez 1472 nourrissons de moins de 12 mois ayant besoin d’oxygène, l’escalade thérapeutique pour échec est survenue chez 12 % des enfants sous haut débit contre 23 % sous oxygène standard. La durée d’hospitalisation et la durée d’oxygène n’ont pas différé ; 61 % des échecs de l’oxygène standard ont répondu au haut débit de secours. Un pneumothorax est survenu dans chaque groupe.</p><p class="lab">Position</p><p>La Haute Autorité de santé propose le haut débit ou la pression positive en cas de non-amélioration sous oxygène standard, dans une unité dotée d’un personnel formé ; ces supports améliorent l’hématose sans raccourcir l’hospitalisation (grade A).</p><div class="key"><b>Conséquence.</b> Le haut débit est un traitement de recours, non de première intention, chez le nourrisson dont l’état se dégrade sous oxygène.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29562151/" target="_blank" rel="noopener">Franklin et al., N Engl J Med 2018</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a>.</p></template>
<template data-pop="j21-cpap" data-title="Pression positive continue"><p class="lab">Mécanisme</p><p>La pression positive continue, par sonde ou masque nasal, recrute les voies aériennes collabées et les alvéoles correspondantes et réduit la résistance moyenne. La vidange expiratoire s’améliore, la distension et le travail respiratoire diminuent, les échanges gazeux progressent.</p><p class="lab">Place</p><p>Le NICE l’envisage chez le nourrisson en insuffisance respiratoire imminente ; la Haute Autorité de santé la propose, comme le haut débit, en cas de non-amélioration sous oxygène, avec une pression de 7 cm d’eau. Malgré son usage répandu, les preuves de son efficacité restent limitées, et elle ne raccourcit pas l’hospitalisation (grade A).</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24694087/" target="_blank" rel="noopener">Øymar et al., 2014</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.4.5</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a>.</p></template>
<template data-pop="j21-nutrition" data-title="Sonde gastrique ou perfusion"><p class="lab">Position actuelle</p><p>L’alimentation orale continue tant que l’enfant ne s’épuise pas et ne désature pas. Quand elle ne suffit plus, l’apport par sonde gastrique est aussi efficace que la voie intraveineuse (SSPP 2020) ; le NICE propose une sonde nasogastrique ou orogastrique, et la Haute Autorité de santé l’alimentation entérale en première intention. La perfusion isotonique se réserve à l’intolérance de la sonde, à l’insuffisance respiratoire imminente ou à l’urgence vitale.</p><p class="lab">Divergence historique</p><p>Les recommandations suisses de 2003 déconseillaient la sonde nasale, qui ajoute une obstruction des narines. Les textes plus récents la recommandent ; la voie orogastrique, que le NICE propose aussi, laisse les narines libres.</p><div class="key"><b>Conséquence.</b> Chez un nourrisson qui boit moins de la moitié de ses repas, la sonde précède la perfusion.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.4.11 et 1.4.12</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003</a>.</p></template>
<template data-pop="j21-bronchodilat" data-title="Bronchodilatateurs dans la bronchiolite"><p class="lab">Preuves</p><p>La revue Cochrane de 2014 réunit 30 essais et 1992 nourrissons. Les bronchodilatateurs n’ont amélioré ni la saturation, ni le taux d’hospitalisation après traitement ambulatoire (11,9 % contre 15,9 %, non significatif), ni la durée d’hospitalisation. Un léger effet sur le score clinique ambulatoire est d’importance clinique douteuse. Tachycardie, désaturation et tremblements ont été rapportés.</p><p class="lab">Recommandations</p><p>Toutes les recommandations citées les déconseillent en routine. La Haute Autorité de santé note une tolérance médiocre avant 2 mois, et la recommandation suisse de 2003 signalait une désaturation paradoxale possible avant 6 mois.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24937099/" target="_blank" rel="noopener">Gadomski et al., revue Cochrane 2014</a> ; <a href="https://www.smartermedicine.ch/fr/liste-top-5/pediatrie" target="_blank" rel="noopener">Pédiatrie Suisse, liste Top 5 2021, recommandation 4</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003, annexe</a>.</p></template>
<template data-pop="j21-adrenaline" data-title="Adrénaline nébulisée"><p class="lab">Preuves</p><p>La revue Cochrane de 2011 (19 essais, 2256 enfants) montre, chez l’enfant ambulatoire, moins d’admissions au premier jour par rapport au placebo (risque relatif 0,67), mais non au septième jour, et aucun effet sur la durée de séjour des enfants hospitalisés. Aucun bénéfice n’est démontré pour des doses répétées ou prolongées.</p><p class="lab">Recommandations</p><p>Le NICE et la Haute Autorité de santé (grade A) ne la recommandent pas ; la mise à jour suisse lui reconnaît au plus un effet symptomatique ambulatoire.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21678340/" target="_blank" rel="noopener">Hartling et al., revue Cochrane 2011</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.4.3</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a>.</p></template>
<template data-pop="j21-corticoides" data-title="Corticoïdes dans la bronchiolite"><p class="lab">Preuves</p><p>La revue Cochrane de 2013 (17 essais, 2596 enfants) ne montre aucun effet cliniquement pertinent des corticoïdes systémiques ou inhalés sur les admissions ambulatoires aux premier et septième jours, ni sur la durée de séjour. Un seul grand essai a suggéré qu’une dexaméthasone à forte dose associée à l’adrénaline inhalée réduisait les admissions au septième jour (risque relatif 0,65) ; ce résultat reste exploratoire.</p><p class="lab">Recommandations</p><p>Le NICE déconseille les corticoïdes, seuls ou associés à l’adrénaline ; la liste « smarter medicine » de pédiatrie déconseille leur usage systématique.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/23733383/" target="_blank" rel="noopener">Fernandes et al., revue Cochrane 2013</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.4.3</a> ; <a href="https://www.smartermedicine.ch/fr/liste-top-5/pediatrie" target="_blank" rel="noopener">Pédiatrie Suisse, liste Top 5 2021</a>.</p></template>
<template data-pop="j21-ssh" data-title="Sérum salé hypertonique : arbitrage"><p class="lab">Données les plus récentes</p><p>La revue Cochrane de 2023 réunit 34 essais et 5205 nourrissons. Le sérum salé hypertonique (3 % le plus souvent) raccourcirait le séjour hospitalier de 0,40 jour, améliorerait légèrement le score clinique et réduirait de 13 % le risque d’hospitalisation après les urgences, avec une certitude faible à très faible en raison de l’hétérogénéité et du risque de biais. Les effets indésirables (toux, agitation, bronchospasme, désaturation) sont surtout légers.</p><p class="lab">Recommandations et décision retenue</p><p>Le NICE (2015), la Haute Autorité de santé (2019, grade A) et la mise à jour suisse de 2020 ne le recommandent pas ; le texte suisse, le plus récent, s’appuie sur plusieurs essais multicentriques négatifs, dont une étude suisse. Une méta-analyse de faible certitude ne suffit pas à renverser cette position.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37014057/" target="_blank" rel="noopener">Zhang et al., revue Cochrane 2023</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.4.3</a>.</p></template>
<template data-pop="j21-antibio-nourrisson" data-title="Antibiotiques chez le nourrisson atteint de bronchiolite"><p>La bronchiolite est une maladie virale : les antibiotiques ne sont pas recommandés, même chez l’enfant fébrile (grade A) ou porteur d’un foyer radiologique (accord d’experts). Ils se justifient seulement devant une infection bactérienne associée, documentée ou fortement suspectée.</p><p>La surinfection bactérienne est rare, sauf chez le nourrisson intubé et ventilé plusieurs jours. L’azithromycine n’a pas non plus de place, ni à visée curative ni à visée préventive (grade A).</p><p class="src">Références : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, antibiotiques</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableau 5</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.4.3</a>.</p></template>
<template data-pop="j21-kine" data-title="Kinésithérapie respiratoire"><p class="lab">Essais</p><p>Dans l’essai français de Gajdos (2010), 496 nourrissons hospitalisés ont reçu trois séances quotidiennes d’augmentation du flux expiratoire avec toux assistée, ou des aspirations nasales : le délai de guérison n’a pas différé (2,02 contre 2,31 jours), mais les vomissements et les déstabilisations respiratoires transitoires ont été plus fréquents pendant les séances. L’essai suisse de Rochat (2012), chez 99 nourrissons, n’a pas raccourci le délai de stabilisation clinique (2,9 contre 3,2 jours).</p><p class="lab">Synthèse</p><p>La revue Cochrane de 2023 conclut avec une certitude élevée que les techniques conventionnelles (percussions, vibrations, drainage postural) et les techniques d’expiration forcée ne modifient pas l’évolution, ces dernières exposant à des effets indésirables graves. Les techniques d’expiration lente amélioreraient modestement le score de gravité, avec une certitude faible.</p><p class="lab">Recommandations</p><p>Le NICE la déconseille sans comorbidité et la propose en cas d’atrophie musculaire spinale ou de trachéomalacie sévère. La Haute Autorité de santé contre-indique drainage, vibrations et clapping (grade A) et ne recommande pas l’augmentation du flux expiratoire chez l’enfant hospitalisé (grade B).</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20927359/" target="_blank" rel="noopener">Gajdos et al., PLoS Med 2010</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21927808/" target="_blank" rel="noopener">Rochat et al., Eur J Pediatr 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37010196/" target="_blank" rel="noopener">Roqué et al., revue Cochrane 2023</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.4.1 et 1.4.2</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a>.</p></template>
<template data-pop="j21-sortie" data-title="Critères de sortie de l’hôpital"><p>Les critères de sortie combinent la saturation, l’alimentation et la stabilité clinique ; le tableau compare les trois textes.</p><table class="t"><tr><th>Source</th><th>Saturation en air ambiant</th><th>Alimentation et état</th></tr><tr><td>NICE, 2021</td><td>Supérieure à 90 % pendant 4 heures, sommeil compris ; supérieure à 92 % avant 6 semaines ou en cas de maladie sous-jacente</td><td>Cliniquement stable, apports oraux suffisants</td></tr><tr><td>SSPP, 2020</td><td>Au moins 90 % pendant une longue phase de sommeil ; désaturations brèves (une minute, au-dessus de 80 %) tolérées</td><td>Bon état général stable, au moins deux tiers des besoins</td></tr><tr><td>Haute Autorité de santé, 2019</td><td>Au moins 92 %</td><td>Amélioration stable, plus de 50 % des apports habituels</td></tr></table><p class="lab">Décision retenue</p><p>La révision du NICE de 2021, concordante avec la mise à jour suisse, fait foi. La mise à jour suisse souligne que chez plus de la moitié des enfants, une saturation jugée « trop basse » est le seul paramètre qui prolonge inutilement l’hospitalisation.</p><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.5.1</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableau 6</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a>.</p></template>
<template data-pop="j21-crp-adulte" data-title="CRP dans l’infection respiratoire basse de l’adulte"><p class="lab">Seuils</p><p>Chez l’adulte suspect de pneumonie en soins primaires, une CRP inférieure à 20 mg/L rend la pneumonie très improbable, une CRP supérieure à 100 mg/L la rend probable (ERS/ESCMID, grade B1).</p><p class="lab">Limites</p><p>Le seuil bas ne vaut qu’après plus de 24 heures de symptômes. Entre 20 et 100 mg/L, la CRP ne tranche pas : la radiographie thoracique confirme ou écarte le diagnostic. En soins primaires, la même recommandation déconseille les marqueurs biologiques destinés à prouver une cause bactérienne.</p><div class="key"><b>Conséquence.</b> Une CRP basse chez un adulte sans signe de pneumonie soutient la décision de ne pas prescrire d’antibiotique.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead et al., ERS/ESCMID 2011, diagnostic en soins primaires</a>.</p></template>
<template data-pop="j21-diff-adulte" data-title="Ce qui imite l’infection respiratoire basse de l’adulte"><p>Quatre diagnostics imitent l’infection respiratoire basse et changent la conduite ; la recommandation ERS/ESCMID précise quand les évoquer.</p><table class="t"><tr><th>Diagnostic</th><th>Quand l’évoquer</th><th>Examen</th></tr><tr><td>Insuffisance cardiaque gauche</td><td>Plus de 65 ans avec orthopnée, choc de pointe dévié, antécédent d’infarctus, d’hypertension ou de fibrillation atriale</td><td>BNP inférieur à 40 pg/mL ou NT-proBNP inférieur à 150 pg/mL : diagnostic improbable</td></tr><tr><td>Embolie pulmonaire</td><td>Antécédent de thrombose ou d’embolie, immobilisation dans les quatre semaines, cancer</td><td>Démarche de l’embolie pulmonaire</td></tr><tr><td>Maladie bronchique chronique</td><td>Toux persistante avec au moins deux éléments : sibilants, consultations antérieures pour toux ou sifflements, dyspnée, expiration prolongée, tabagisme, allergie</td><td>Épreuves fonctionnelles respiratoires</td></tr><tr><td>Pneumonie d’inhalation</td><td>Troubles de la déglutition et signes d’infection basse</td><td>Radiographie thoracique</td></tr></table><p>Le tableau se lit par la deuxième colonne : chez un fumeur âgé qui tousse, une bronchopneumopathie chronique obstructive doit être envisagée ; chez un patient de 75 ans orthopnéique, un NT-proBNP inférieur à 150 pg/mL rend l’insuffisance cardiaque improbable.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead et al., ERS/ESCMID 2011, prise en charge hors de l’hôpital</a>.</p></template>
<template data-pop="j21-antibio-adulte" data-title="Antibiotiques dans l’infection respiratoire basse de l’adulte"><p class="lab">Essai européen de Little (2013)</p><p>Dans douze pays, 2061 adultes atteints d’infection respiratoire basse sans suspicion de pneumonie ont reçu de l’amoxicilline (1 g trois fois par jour pendant sept jours) ou un placebo. La durée des symptômes et leur sévérité n’ont pas différé. Les symptômes nouveaux ou aggravés ont été un peu moins fréquents sous amoxicilline (15,9 % contre 19,3 %, nombre de patients à traiter : 30), au prix de nausées, éruptions ou diarrhées plus fréquentes (nombre de patients pour un préjudice : 21) et d’un cas d’anaphylaxie. Aucun bénéfice particulier n’a été observé après 60 ans.</p><p class="lab">Revue Cochrane 2017 sur la bronchite aiguë</p><p>Dans 17 essais (5099 participants), l’antibiotique n’a pas augmenté la proportion de patients améliorés ; il a raccourci la toux de 0,46 jour en moyenne et augmenté les effets indésirables (un préjudice pour 24 patients traités).</p><p class="lab">Recommandation ERS/ESCMID</p><p>Après l’amoxicilline ou une tétracycline de premier choix, un macrolide est l’alternative en cas d’hypersensibilité dans les pays où la résistance du pneumocoque aux macrolides est faible ; les fluoroquinolones se réservent aux résistances cliniquement pertinentes aux premiers choix.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/23265995/" target="_blank" rel="noopener">Little et al., Lancet Infect Dis 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28626858/" target="_blank" rel="noopener">Smith et al., revue Cochrane 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead et al., ERS/ESCMID 2011</a>.</p></template>
<template data-pop="j21-prohosp" data-title="Essai ProHOSP"><p>Essai suisse de non-infériorité mené en 2006-2008 dans les urgences de six hôpitaux tertiaires, chez 1359 adultes atteints d’infection respiratoire basse, le plus souvent sévère. Les antibiotiques étaient décidés selon un algorithme fondé sur des seuils de procalcitonine, ou selon les recommandations habituelles.</p><p class="lab">Résultats</p><p>Les évolutions défavorables à 30 jours (décès, soins intensifs, complications, récidive traitée par antibiotique) ont été comparables : 15,4 % contre 18,9 %. L’exposition aux antibiotiques a diminué de 8,7 à 5,7 jours au total, de 10,7 à 7,2 jours dans la pneumonie, de 5,1 à 2,5 jours dans l’exacerbation de bronchopneumopathie chronique obstructive et de 2,8 à 1,0 jour dans la bronchite aiguë. Les effets indésirables des antibiotiques ont reculé de 28,1 à 19,8 %.</p><div class="key"><b>Limite.</b> L’essai concerne des patients hospitaliers ; il ne transpose pas directement la procalcitonine au cabinet.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/19738090/" target="_blank" rel="noopener">Schuetz et al., JAMA 2009</a>.</p></template>
<template data-pop="j21-orientation-adulte" data-title="Risque de complication et orientation de l’adulte"><p class="lab">Facteurs de complication après 65 ans</p><p>Bronchopneumopathie chronique obstructive, diabète ou insuffisance cardiaque ; hospitalisation dans l’année ; corticoïdes oraux ; antibiotique dans le mois précédent ; malaise général ; absence de symptômes respiratoires hauts ; confusion ; pouls supérieur à 100, température supérieure à 38 °C, fréquence respiratoire supérieure à 30, pression artérielle inférieure à 90/60 mmHg ; diagnostic de pneumonie par le médecin.</p><p class="lab">Orientation hospitalière à envisager</p><p>Pneumonie suspectée grave (tachypnée, tachycardie, hypotension, confusion) ; pneumonie qui ne répond pas à l’antibiotique ; pneumonie du sujet âgé avec comorbidité (diabète, insuffisance cardiaque, bronchopneumopathie chronique obstructive modérée ou sévère, maladie hépatique ou rénale, cancer) ; suspicion d’embolie pulmonaire ou de cancer bronchique.</p><p class="lab">Surveillance</p><p>L’effet d’un antibiotique s’attend en trois jours. Les patients gravement atteints, et les personnes âgées avec comorbidité, sont revus après deux jours.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead et al., ERS/ESCMID 2011</a>.</p></template>
<template data-pop="j21-signes-alerte" data-title="Signes d’alerte pour les parents"><p class="lab">Appeler les secours</p><p>L’enfant devient bleu autour de la bouche, fait un malaise ou des pauses respiratoires, respire lentement tout en restant très gêné, ne réagit plus, est très fatigué, dort tout le temps ou geint.</p><p class="lab">Consulter rapidement</p><p>Si, après lavage du nez, le comportement change (fatigue, moindre réactivité, agitation), la respiration s’accélère, la gêne augmente avec un thorax qui se creuse, ou l’enfant boit moins bien sur plusieurs repas consécutifs ou refuse le sein ou le biberon.</p><p class="lab">À savoir</p><p>L’attention doit être accrue pendant les deux premiers jours. Le NICE ajoute deux repères concrets : des apports tombés à 50-75 % de l’habituel, ou aucune couche mouillée depuis 12 heures. Il rappelle aussi qu’on ne fume pas dans le logement de l’enfant.</p><p class="src">Références : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, fiche de conseils de surveillance pour les parents</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.6.1</a>.</p></template>
<template data-pop="j21-algorithme" data-title="Algorithme suisse d’immunisation du nourrisson (2026)"><p class="lab">Selon le mois de naissance prévu</p><p>Le tableau de l’îlot 11 résume l’algorithme. Deux précisions comptent : la vaccination maternelle se fait idéalement au moins cinq semaines avant le terme, et l’anticorps du nouveau-né né d’octobre à mars se donne idéalement avant la sortie de maternité.</p><p class="lab">Règles complémentaires</p><p>Un nourrisson né entre octobre et mars sans dose au 31 mars peut la recevoir en octobre suivant, jusqu’à la veille de son premier anniversaire. Si l’accouchement survient moins de 14 jours après la vaccination maternelle, l’enfant reçoit aussi l’anticorps. La vaccination maternelle n’est faite qu’une fois : lors d’une grossesse ultérieure, l’enfant reçoit l’anticorps.</p><p class="lab">Exceptions : anticorps malgré la vaccination maternelle</p><p>Prématurité avant 37+0 semaines ; immunosuppression maternelle, y compris une infection par le VIH ; risque de perte de l’immunité humorale après circulation extracorporelle ou oxygénation par membrane extracorporelle ; comorbidité jugée à risque de VRS potentiellement mortel par le spécialiste.</p><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026, figure 1 et chapitre 1.1.a</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 2</a>.</p></template>
<template data-pop="j21-deuxieme-saison" data-title="Deuxième saison : enfants à haut risque persistant"><p>Une deuxième dose d’anticorps à longue durée d’action (nirsévimab 200 mg, en deux injections de 100 mg) est recommandée en septembre ou en octobre aux enfants de 24 mois ou moins qui gardent, selon le spécialiste, un risque élevé et persistant de forme grave :</p><table class="t"><tr><th>Groupe</th><th>Exemples</th></tr><tr><td>Cœur et circulation pulmonaire</td><td>Malformation cardiaque à retentissement hémodynamique, cardiopathie cyanogène, hypertension artérielle pulmonaire</td></tr><tr><td>Poumon</td><td>Dysplasie bronchopulmonaire modérée à sévère, malformation pulmonaire, mucoviscidose</td></tr><tr><td>Système nerveux et muscles</td><td>Épilepsie, infirmité motrice cérébrale, maladie neuromusculaire</td></tr><tr><td>Immunité et génétique</td><td>Immunodéficience congénitale, acquise ou médicamenteuse ; trisomie 21 et autres anomalies chromosomiques</td></tr><tr><td>Autres</td><td>Prématurité avant 32 semaines, maladie métabolique congénitale retentissant sur le cœur ou le poumon, hépatopathie chronique, malformation d’organe</td></tr></table><p>Après une chirurgie cardiaque avec circulation extracorporelle, une dose supplémentaire est donnée dès que l’enfant est stable. Un enfant qui n’a pas reçu sa deuxième dose avant la fin de sa deuxième saison la reçoit en octobre, avant la troisième.</p><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 2.2</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026, chapitre 3.1.i</a>.</p></template>
<template data-pop="j21-vaccin-adulte" data-title="Vaccination de l’adulte contre le VRS (OFSP et CFV, 2026)"><p class="lab">Qui vacciner</p><p>Une dose est recommandée à toutes les personnes dès 75 ans, aux personnes de 65 à 74 ans à haut risque et à celles de 18 à 64 ans à très haut risque de forme grave.</p><table class="t"><tr><th>Exemples</th><th>18 à 64 ans, très haut risque</th><th>65 à 74 ans, haut risque</th></tr><tr><td>Cœur</td><td>Insuffisance cardiaque dès NYHA III</td><td>Insuffisance cardiaque dès NYHA II, antécédent d’infarctus, hypertension résistante</td></tr><tr><td>Poumon</td><td>BPCO GOLD 3, ou dès GOLD 1 avec exacerbations fréquentes ; asthme sous traitement continu ou avec exacerbations ; emphysème, bronchectasies sévères, mucoviscidose, fibrose pulmonaire</td><td>BPCO GOLD 2, ou dès GOLD 1 avec exacerbations fréquentes ; mêmes autres maladies</td></tr><tr><td>Rein</td><td>Insuffisance rénale dès le stade 4 (DFG inférieur à 30 mL/min/1,73 m²)</td><td>Idem</td></tr><tr><td>Immunité</td><td>Transplantation, hémopathie maligne, immunosuppression intensive, VIH avec moins de 200 lymphocytes T CD4 par µL</td><td>Idem, plus cancer sous traitement actif et biothérapies</td></tr><tr><td>Autres</td><td>Atteinte neuromusculaire respiratoire, antécédent d’AVC</td><td>Idem, plus diabète avec atteinte d’organe et personnes fragiles ou en établissement de soins de longue durée</td></tr></table><p class="lab">Modalités</p><p>Une dose de l’un des trois vaccins autorisés, sans préférence, idéalement entre mi-octobre et mi-novembre. La protection dure au moins trois ans ; la nécessité d’un rappel est en cours d’évaluation. Aucune sérologie n’est recommandée avant ou après. L’assurance de base ne rembourse pas ces vaccins chez l’adulte non enceinte (état automne 2026).</p><p class="lab">Efficacité</p><p>Dans les essais de phase 3 chez les 60 ans et plus, l’efficacité des trois vaccins contre l’infection respiratoire basse à VRS s’est située entre 67 et 86 %, selon le vaccin et la définition retenue ; les chiffres figurent dans les monographies.</p><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 3, tableaux 3 et 6</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36791160/" target="_blank" rel="noopener">Papi et al., N Engl J Med 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37018468/" target="_blank" rel="noopener">Walsh et al., N Engl J Med 2023</a>.</p></template>
<template data-pop="j21-d-nirsevimab" data-title="Nirsévimab (Beyfortus®)"><p class="lab">Mécanisme</p><p>Anticorps monoclonal humain de type immunoglobuline G de sous-classe 1, recombinant et neutralisant, dirigé contre la protéine F du VRS en conformation préfusionnelle. Il se lie au site Ø de cette protéine. Une triple substitution d’acides aminés dans la région Fc prolonge sa demi-vie sérique, d’environ 71 jours chez un nourrisson de 5 kg. Ce n’est pas un vaccin : il confère une immunisation passive d’environ six mois.</p><p class="lab">Preuves</p><p>Dans l’essai MELODY (nourrissons nés à 35 semaines ou plus), l’infection respiratoire basse à VRS médicalement prise en charge a touché 1,2 % des enfants traités contre 5,0 % sous placebo (efficacité 74,5 %). Dans l’essai pragmatique HARMONIE, comparé aux soins habituels sans immunisation, l’hospitalisation a concerné 0,3 % contre 1,5 % des nourrissons (efficacité 83,2 %), et l’efficacité contre les formes très sévères a été de 75,7 %. Chez les prématurés de 29 à 35 semaines, l’efficacité contre l’infection médicalement prise en charge a été de 70,1 %.</p><p class="lab">Posologie</p><p>Les doses de base figurent dans le tableau des doses. Après chirurgie cardiaque avec circulation extracorporelle, dose supplémentaire de 50 ou 100 mg selon le poids si l’intervention a lieu dans les 90 jours, 50 mg au-delà ; en deuxième saison, 200 mg dans les 90 jours, 100 mg au-delà.</p><p class="lab">Effets indésirables et contre-indication</p><p>L’éruption, la réaction au site d’injection et la fièvre sont occasionnelles, et des réactions d’hypersensibilité graves ont été rapportées. Le nirsévimab est contre-indiqué après un antécédent d’hypersensibilité grave au produit, dont l’anaphylaxie. La prudence s’impose en cas de thrombopénie, de trouble de la coagulation ou d’anticoagulation, parce que l’injection est intramusculaire. Le nirsévimab ne perturbe pas les tests diagnostiques du VRS.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Beyfortus®, Swissmedic (AIPS), mise à jour 07.2026, consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35235726/" target="_blank" rel="noopener">Hammitt et al., MELODY, N Engl J Med 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38157500/" target="_blank" rel="noopener">Drysdale et al., HARMONIE, N Engl J Med 2023</a>.</p></template>
<template data-pop="j21-d-clesrovimab" data-title="Clesrovimab (Enflonsia®)"><p class="lab">Mécanisme</p><p>Anticorps monoclonal humain de type immunoglobuline G de sous-classe 1, neutralisant, dirigé contre le site IV de la protéine F du VRS. La triple substitution de sa région Fc augmente la liaison au récepteur Fc néonatal et prolonge la demi-vie, d’environ 44 jours chez un nourrisson de 5 kg ; la protection dépasse cinq mois.</p><p class="lab">Preuves</p><p>Dans l’essai CLEVER, chez 3614 nourrissons prématurés ou nés à terme, l’infection respiratoire basse à VRS médicalement prise en charge a touché 2,6 % des enfants traités contre 6,5 % sous placebo sur cinq mois (efficacité 60,4 %) ; l’efficacité contre l’hospitalisation a été de 84,2 %. Aucune donnée en vie réelle n’était publiée à la mi-2026.</p><p class="lab">Posologie</p><p>Dose unique de 105 mg, quel que soit le poids, pendant la première saison seulement ; une dose supplémentaire de 105 mg suit une chirurgie cardiaque avec circulation extracorporelle.</p><p class="lab">Contre-indication et interférence</p><p>Antécédent d’hypersensibilité sévère, y compris d’anaphylaxie, à l’un des composants. Le clesrovimab peut fausser un test antigénique rapide du VRS ; il ne perturbe pas l’amplification génique, qui confirme un test rapide négatif chez un enfant au tableau évocateur.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Enflonsia®, Swissmedic (AIPS), mise à jour 11.2025, consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40961446/" target="_blank" rel="noopener">Zar et al., CLEVER, N Engl J Med 2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitres 5.1 et 6.2</a>.</p></template>
<template data-pop="j21-d-abrysvo" data-title="Abrysvo®, vaccin bivalent contre le VRS"><p class="lab">Composition et mécanisme</p><p>Vaccin protéique recombinant sans adjuvant contenant 60 µg de protéine F préfusionnelle stabilisée de chacun des sous-groupes A et B. Chez la femme enceinte, il fait produire des anticorps neutralisants qui traversent le placenta et protègent le nouveau-né dès sa naissance pendant au moins cinq à six mois.</p><p class="lab">Preuves</p><p>Dans l’essai MATISSE, chez des femmes vaccinées entre 24 et 36 semaines, l’infection respiratoire basse sévère médicalement prise en charge du nourrisson a été réduite de 81,8 % dans les 90 jours et de 69,4 % dans les 180 jours ; l’efficacité contre toute infection respiratoire basse à 90 jours (57,1 %) n’a pas atteint le critère statistique. Chez l’adulte de 60 ans et plus, l’essai de Walsh (2023) a montré une efficacité de 66,7 % contre l’infection respiratoire basse avec au moins deux signes.</p><p class="lab">Posologie</p><p>Dose unique de 0,5 mL dans le deltoïde ; pendant la grossesse, entre 32 0/7 et 36 0/7 semaines, une fois seulement.</p><p class="lab">Précautions</p><p>Contre-indication : hypersensibilité aux composants. Non recommandé avant 32 semaines en raison d’un déséquilibre numérique de naissances prématurées (6 % contre 5 % dans l’essai principal), sans causalité établie. Une étude observationnelle américaine chez les 65 ans et plus a relevé un risque accru de syndrome de Guillain-Barré dans les 42 jours (rapport de taux d’incidence 2,02, intervalle de confiance de 0,93 à 4,40), soit environ 9 cas supplémentaires par million de doses. Report en cas de maladie fébrile aiguë, non pour un simple rhume.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Abrysvo®, Swissmedic (AIPS), mise à jour 07.2026, consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37018474/" target="_blank" rel="noopener">Kampmann et al., MATISSE, N Engl J Med 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37018468/" target="_blank" rel="noopener">Walsh et al., N Engl J Med 2023</a>.</p></template>
<template data-pop="j21-d-arexvy" data-title="Arexvy®, vaccin adjuvé contre le VRS"><p class="lab">Composition</p><p>Protéine F préfusionnelle du VRS de sous-groupe A (120 µg) associée à l’adjuvant AS01E, fait d’un extrait de <i>Quillaja saponaria</i> et d’un dérivé lipidique bactérien ; selon l’OFSP, cet adjuvant entre aussi dans un vaccin contre le zona. Les anticorps protègent aussi contre le sous-groupe B par immunité croisée.</p><p class="lab">Preuves</p><p>Dans l’essai de phase 3 de Papi (2023), chez 24 966 adultes de 60 ans et plus, l’efficacité contre l’infection respiratoire basse à VRS confirmée a été de 82,6 %, de 94,1 % contre les formes sévères et de 71,7 % contre l’infection respiratoire aiguë. Elle diminue avec le temps ; selon le bulletin de l’OFSP, une deuxième dose un an plus tard n’a pratiquement rien ajouté à l’efficacité sur deux ans.</p><p class="lab">Posologie et précautions</p><p>Le vaccin se donne en dose unique de 0,5 mL dans le deltoïde, dès 60 ans ou de 18 à 59 ans en cas de risque accru ; il n’est pas autorisé avant 18 ans. Il est contre-indiqué en cas d’hypersensibilité à ses composants. Une étude observationnelle américaine chez les 65 ans et plus a relevé un risque accru de syndrome de Guillain-Barré dans les 42 jours, soit environ 7 cas supplémentaires par million de doses ; selon l’information professionnelle, le lien de causalité n’est cependant pas établi avec certitude.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Arexvy, Swissmedic (AIPS), mise à jour 06.2026, consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36791160/" target="_blank" rel="noopener">Papi et al., N Engl J Med 2023</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitres 5.3 et 6.2</a>.</p></template>
<template data-pop="j21-d-mresvia" data-title="mRESVIA, vaccin à ARN messager contre le VRS"><p class="lab">Composition</p><p>ARN messager codant la protéine F du VRS de sous-groupe A stabilisée en conformation préfusionnelle, enveloppé dans des nanoparticules lipidiques (50 µg par dose). L’ARN est dégradé en quelques heures à quelques jours ; les anticorps protègent aussi contre le sous-groupe B par immunité croisée.</p><p class="lab">Preuves</p><p>Selon le bulletin de l’OFSP, l’essai de phase 3 chez 35 541 adultes de 60 ans et plus a montré une efficacité de 83,7 % contre l’infection respiratoire basse à VRS avec au moins deux symptômes, après un suivi médian de 3,7 mois.</p><p class="lab">Rappel : une divergence</p><p>L’information professionnelle autorise un rappel après au moins 12 mois ; l’OFSP n’en recommande pas à ce jour, car une dose protège au moins trois ans et l’intérêt d’un rappel reste en évaluation. La recommandation officielle suisse fait foi pour l’indication.</p><p class="lab">Contre-indications</p><p>Hypersensibilité aux composants ; enfant de moins de 8 mois, en raison d’un risque accru de maladie respiratoire grave renforcée par le VRS.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse mRESVIA, Swissmedic (AIPS), mise à jour 08.2026, consultée le 09.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitres 3.2, 5.3 et tableau 6</a>.</p></template>
<template data-pop="j21-d-paracetamol" data-title="Paracétamol chez le nourrisson"><p class="lab">Place</p><p>La mise à jour suisse propose le paracétamol en cas de forte fièvre ou de douleur ; il ne modifie pas l’évolution de la bronchiolite.</p><p class="lab">Posologie (Dafalgan® enfant, sirop à 30 mg/mL)</p><p>15 mg/kg par prise, soit 60 mg (2 mL) pour 4 kg, selon le tableau des doses. En cas de clairance de la créatinine entre 10 et 50 mL/min, l’intervalle minimal est de 6 heures ; sous 10 mL/min, de 8 heures.</p><p class="lab">Contre-indications et précautions</p><p>Hypersensibilité, insuffisance hépatique grave, hépatite aiguë, maladie de Gilbert. Dose réduite ou intervalle allongé en cas de déshydratation, de dénutrition ou de maladie hépatique. Le surdosage provoque des lésions hépatiques très graves : aucun autre médicament contenant du paracétamol ne doit être associé.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Dafalgan® enfant, sirop, Swissmedic (AIPS), mise à jour 09.2025, consultée le 09.10.2026</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableau 5</a>.</p></template>
<template data-pop="j21-d-palivizumab" data-title="Palivizumab : un anticorps remplacé"><p>Le palivizumab (Synagis®), premier anticorps monoclonal contre le VRS, a été commercialisé dans les années 1990 pour les enfants de moins de 2 ans. Sa demi-vie courte impose une injection mensuelle pendant toute la saison ; il était donc réservé aux enfants à très haut risque, selon les déclarations de consensus suisses de 1999, 2002 et 2016.</p><p class="lab">Position actuelle</p><p>L’OFSP et la CFV recommandent d’utiliser exclusivement les anticorps à longue durée d’action et de renoncer au palivizumab. Dans l’essai comparatif MEDLEY, chez des nourrissons à haut risque, les infections graves à VRS ont été comparables sous nirsévimab (0,6 %) et sous palivizumab (1,0 %).</p><p class="src">Référence : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitres 1.2, 2 et 6.2</a>.</p></template>
<template data-pop="j21-xylometazoline" data-title="Décongestionnants nasaux chez le nourrisson : arbitrage"><p class="lab">Ce que proposent les recommandations suisses</p><p>La mise à jour suisse de 2020 mentionne, en cas de rhinite importante, des gouttes décongestionnantes à la xylométazoline pendant cinq à sept jours, en complément du lavage au sérum physiologique. Les recommandations de 2003 reconnaissaient déjà qu’aucune étude n’en démontre l’efficacité.</p><p class="lab">Ce que dit l’information professionnelle</p><p>L’information professionnelle suisse de Rinosedin® 0,05 % gouttes nasales (février 2025) interdit l’emploi avant 1 an et le réserve à la prescription médicale entre 1 et 2 ans, pour une semaine au plus en raison du risque de rhinite médicamenteuse. D’autres préparations, comme les sprays dosés à 0,1 %, ne s’emploient qu’à partir de 12 ans.</p><p class="lab">Décision retenue</p><p>Pour les doses et contre-indications, l’information professionnelle suisse prime : pas de décongestionnant chez le nourrisson de moins de 1 an, c’est-à-dire chez la plupart des enfants atteints de bronchiolite. La désobstruction repose sur le sérum physiologique.</p><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableaux 4 et 5</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003, annexe</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Rinosedin® 0,05 % gouttes nasales et Otrivin Rhume (02.2025), Swissmedic (AIPS), consultées le 09.10.2026</a>.</p></template>
<template data-pop="pareto-j21-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j21-0,j21-1,j21-2,j21-3,j21-4,j21-5,j21-6"></p><ul><li>La bronchiolite est une infection virale des bronchioles du nourrisson ; son diagnostic est clinique et repose sur des crépitants ou des sibilants qui apparaissent après une rhinite.</li><li>La gravité se juge sur l’état général, la fréquence respiratoire comptée sur une minute, la SpO₂, le tirage et l’alimentation ; la forme est sévère au-delà de 70/min ou sous 88 %.</li><li>En Suisse, 2,4 % des nourrissons sont hospitalisés chaque hiver, avec un pic au deuxième mois de vie ; 75 à 90 % d’entre eux sont nés à terme et en bonne santé, si bien que la prévention doit viser tous les nourrissons.</li><li>Des cellules desquamées (NS2) et des neutrophiles bouchent des bronchioles de 120 µm, ce qui provoque un piégeage de l’air, des atélectasies et un shunt.</li><li>VRS 60 à 80 %, puis rhinovirus ; apnée isolée possible avant 6 semaines.</li><li>Chez l’adulte, l’« infection respiratoire basse » est un cadre d’attente qui oblige à rechercher une pneumonie.</li></ul></template>

<template data-pop="pareto-j21-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j21-7"></p><ul><li>Aucun examen n’est systématique : ni bilan sanguin, ni radiographie, ni recherche virale de routine, car leurs résultats ne modifient pas la prise en charge.</li><li>La radiographie montre des atélectasies prises pour des pneumonies.</li><li>Il faut penser d’abord à une infection bactérienne du nouveau-né, à une cardiopathie et à une pneumonie ; des sibilants récidivants chez un enfant atopique relèvent de la démarche de l’asthme.</li></ul></template>

<template data-pop="pareto-j21-tt" data-title="Pareto — Gravité et traitements"><p class="ratio" data-cover="j21-8,j21-9,j21-10"></p><ul><li>Une apnée, un épuisement, une cyanose ou une détresse sévère imposent un transfert urgent ; une fréquence respiratoire qui baisse chez un enfant qui se dégrade signe l’épuisement, et non une amélioration.</li><li>L’enfant est hospitalisé si sa SpO₂ reste sous 90 % (92 % avant 6 semaines ou en cas de comorbidité), si ses apports tombent à 50-75 % ou moins, s’il fait une apnée ou si son terrain ou son contexte sont défavorables.</li><li>Le traitement repose sur la désobstruction, l’oxygène sous le seuil de saturation, le haut débit ou la pression positive en cas d’échec, et des repas fractionnés puis une sonde si l’enfant ne boit pas assez.</li><li>Ni salbutamol, ni adrénaline, ni corticoïde, ni sérum hypertonique, ni antibiotique, ni kinésithérapie en routine.</li><li>Chez l’adulte, une CRP sous 20 mg/L rend la pneumonie très improbable ; l’antibiotique n’est indiqué qu’en cas de pneumonie ou de comorbidité sérieuse.</li></ul></template>

<template data-pop="pareto-j21-crit" data-title="Pareto — Suivi, prévention et critères"><p class="ratio" data-cover="j21-11,j21-12,j21-13"></p><ul><li>Le médecin réévalue le patient dans les 24 à 48 heures et vérifie la guérison à quatre à six semaines.</li><li>Tout nourrisson doit être immunisé : la mère reçoit le vaccin entre 32 et 36 semaines si la naissance est prévue d’octobre à mars ; sinon, l’enfant reçoit un anticorps monoclonal.</li><li>Nirsévimab 50 mg sous 5 kg, 100 mg dès 5 kg, 200 mg en deuxième saison ; clesrovimab 105 mg.</li><li>L’adulte reçoit une dose de vaccin dès 75 ans, ou plus tôt en cas de risque élevé.</li></ul></template>

<template data-pop="pareto-j21-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j21-e-1,j21-e-2,j21-e-3"></p><ul><li>Le seul examen systématique est l’oxymétrie de pouls, mesurée après la désobstruction, car des sécrétions nasales abaissent la saturation à tort.</li><li>L’amplification génique est la référence pour le VRS ; elle sert à regrouper les enfants à l’hôpital et à explorer le nouveau-né fébrile.</li><li>Une gazométrie se justifie si la détresse s’aggrave : une capnie au-delà de 46-50 mmHg et un pH sous 7,34 orientent vers les soins intensifs.</li><li>CRP et numération peu discriminantes ; opacités radiographiques souvent atélectasiques.</li><li>Chez l’adulte, une CRP sous 20 mg/L permet d’écarter la pneumonie, et une CRP au-delà de 100 mg/L permet de la retenir.</li></ul></template>

<template data-pop="pareto-j21-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j21-p-1,j21-p-2,j21-p-3,j21-p-4"></p><ul><li>La pharmacologie est préventive : le nourrisson reçoit un anticorps monoclonal ou bénéficie du vaccin maternel, et l’adulte âgé ou à risque reçoit un vaccin.</li><li>Nirsévimab selon le poids et la saison ; clesrovimab en dose fixe la première année, qui peut fausser un test antigénique rapide.</li><li>Pas de vaccin à ARN messager avant 8 mois ; vaccin maternel seulement après 32 semaines ; signal de Guillain-Barré chez la personne âgée.</li><li>Paracétamol 15 mg/kg par prise, au plus 75 mg/kg par jour.</li><li>Il faut éviter les bronchodilatateurs, l’adrénaline, les corticoïdes, le sérum hypertonique, les antibiotiques sans infection bactérienne, les antitussifs et les décongestionnants avant 1 an, car aucun n’améliore l’évolution et plusieurs exposent à des effets indésirables.</li></ul></template>
