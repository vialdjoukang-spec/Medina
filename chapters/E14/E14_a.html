<section class="ilot" id="e14-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 34 ans consulte pour une soif intense, une polyurie et une perte de poids de 6 kg en deux mois. Elle mesure 1,72 m et pèse 61 kg ; aucun dossier antérieur n’est disponible. Sa glycémie capillaire est de 26 mmol/L et son HbA1c de 11,4 %. Ces valeurs pédagogiques servent de fil conducteur : le diabète est établi, mais personne ne sait encore de quel type il s’agit.</p>
<p>Le diagnostic de « diabète sucré, sans précision » n’est donc pas une maladie distincte. C’est un diagnostic d’étape, que <button class="w" data-k="e14-nosologie">la catégorie E14 de la classification suisse (sous-codes et exclusions)</button> réserve aux situations où le diabète est documenté sans que le type puisse être attribué. La question du cours est double. Il faut d’abord confirmer le diabète et reconnaître ses urgences et ses complications, que le quatrième caractère du code désigne. Il faut ensuite classer le type, parce que la décision de traiter par insuline d’emblée en dépend.</p>
<h3>Objectifs d’apprentissage</h3>
<ul><li>Énoncer les critères diagnostiques du diabète et les limites de l’HbA1c.</li><li>Conduire la démarche qui permet de sortir de la catégorie « sans précision » : âge, cétose, autoanticorps, peptide C.</li><li>Reconnaître et traiter l’acidocétose, l’état hyperglycémique hyperosmolaire et l’hypoglycémie.</li><li>Dépister les complications que les sous-codes distinguent : rein, œil, nerfs, vaisseaux, pied.</li><li>Appliquer les règles suisses de codage, dont la notion de diabète « décompensé ».</li></ul>
<div class="key"><b>À retenir.</b> Un diabète « sans précision » est un diabète dont le type reste à établir. L’insulinodéficience est la question pratique qui commande le traitement, tant que le type est incertain.</div>
</section>
<section class="ilot" id="e14-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>L’Organisation mondiale de la santé définit le diabète comme un groupe de troubles métaboliques caractérisés par une <b>hyperglycémie en l’absence de traitement</b>. L’étiologie est hétérogène : elle comprend des défauts de sécrétion de l’insuline, des défauts de son action, ou les deux, avec des troubles du métabolisme des glucides, des lipides et des protéines. À long terme, la maladie provoque des effets spécifiques (rétinopathie, néphropathie, neuropathie) et augmente le risque de maladie cardiaque, d’artériopathie périphérique, de maladie cérébrovasculaire, de cataracte et de certaines infections, dont la tuberculose (OMS 2019).</p>
<h3>1.1 La catégorie E14 dans la classification suisse</h3>
<p>La classification statistique suisse (CIM-10-GM, version 2024 de l’Office fédéral de la statistique) range sous <b>E14 Diabète sucré, sans précision</b> le diabète dont le type n’est pas désigné. Elle le distingue du type 1 (E10), du type 2 (E11), du diabète de malnutrition (E12) et des autres formes précisées (E13), qui comprennent par exemple le diabète dû aux stéroïdes. Une règle du manuel de codage évite une confusion fréquente : <b>le traitement à l’insuline ne permet pas de déterminer le type de diabète et ne prouve pas une dépendance primaire à l’insuline</b>.</p>
<p>Le quatrième caractère indique la complication, du coma (.0) à l’absence de complication (.9). Le cinquième caractère précise si le diabète est désigné comme décompensé. Les <button class="w" data-k="e14-nosologie">libellés complets et les exclusions</button> sont rassemblés dans une fenêtre, et la section 12 explique les règles d’emploi.</p>
<h3>1.2 La classification clinique de l’OMS (2019)</h3>
<p>La classification clinique répond à une autre question : quel traitement envisager au diagnostic ? Elle supprime les sous-classes des types 1 et 2 et constitue un compromis entre la clinique et l’étiologie. Le tableau résume ses catégories ; il est suivi de ses deux enseignements pratiques.</p>
<table class="t"><thead><tr><th>Catégorie</th><th>Définition courte</th></tr></thead><tbody><tr><td>Type 1</td><td>Destruction des cellules β, surtout auto-immune, avec carence absolue en insuline ; début surtout dans l’enfance et chez le jeune adulte</td></tr><tr><td>Type 2</td><td>Forme la plus fréquente ; degrés variables de dysfonction des cellules β et d’insulinorésistance ; surpoids ou obésité fréquents</td></tr><tr><td>Formes hybrides</td><td>Diabète immunomédié d’évolution lente de l’adulte ; diabète de type 2 cétosique</td></tr><tr><td>Autres types spécifiques</td><td>Formes monogéniques, maladies du pancréas exocrine, endocrinopathies, médicaments et toxiques, infections, formes immunes rares, syndromes génétiques</td></tr><tr><td>Diabète non classé</td><td>Aucune catégorie claire ; catégorie <b>temporaire</b>, surtout près du diagnostic</td></tr><tr><td>Hyperglycémie découverte en grossesse</td><td>Diabète au cours de la grossesse ; diabète gestationnel</td></tr></tbody></table>
<p>Premier enseignement : aucun critère isolé (âge, perte de fonction β, insulinorésistance, autoanticorps, besoin d’insuline) ne sépare sans équivoque les types 1 et 2. Second enseignement : la classification vise surtout la décision <b>insuline ou non</b> au diagnostic. Les <button class="w" data-k="e14-oms2019">formes hybrides et les autres types spécifiques</button> ainsi que la place de <button class="w" data-k="e14-nonclasse">la catégorie « diabète non classé » par rapport à E14</button> sont détaillées en fenêtre. Le rapprochement entre E14 et « diabète non classé » est une interprétation pédagogique : aucune source lue ne l’établit officiellement.</p>
<div class="trap"><span class="k">Piège</span> Ne pas déduire le type du traitement reçu. Un patient sous insuline n’est pas pour autant de type 1, et un patient sans insuline n’est pas pour autant de type 2.</div>
</section>
<section class="ilot" id="e14-2"><h2><span class="n">2</span>Fréquence</h2>
<p>Selon l’enquête suisse sur la santé 2022 (personnes de 15 ans et plus vivant en ménage privé, diagnostic ou traitement déclaré par la personne), le diabète touche <b>6,2 %</b> de la population, contre 4,8 % en 2017. La fréquence est de 5,6 % chez les femmes et de 6,9 % chez les hommes, et elle augmente avec l’âge. Cette enquête ne permet pas de quantifier de façon fiable les types 1 et 2 : elle ne dit donc rien de la part des diabètes « sans précision » (Observatoire suisse de la santé).</p>
<p>Les lignes directrices suisses sur l’aptitude à la conduite (2025) citent une prévalence de 6,3 %, et le consensus suisse sur l’insuffisance cardiaque évoque environ 500 000 personnes diabétiques en Suisse. À l’échelle mondiale, l’OMS indique que 30 à 80 % des diabètes, selon les pays, ne sont pas diagnostiqués. Ce dernier chiffre explique que des complications soient parfois présentes dès le diagnostic.</p>
<p>Les sous-groupes du type 2 montrent pourquoi la précision du type reste difficile. Selon la SSED (2023), les « diabètes de type 2 » se répartissent approximativement comme suit.</p>
<table class="t"><thead><tr><th>Sous-groupe (SSED 2023)</th><th>Part approximative</th></tr></thead><tbody><tr><td>Type 1 non diagnostiqué</td><td>6 %</td></tr><tr><td>Insulinodéficience nette sans anticorps</td><td>18 %</td></tr><tr><td>Insulinorésistance très forte (davantage de stéatose et de complications rénales)</td><td>15 %</td></tr><tr><td>Associé à l’obésité</td><td>20 %</td></tr><tr><td>Lié à l’âge</td><td>40 %</td></tr></tbody></table>
<p>La SSED ajoute que 25 % des patients étiquetés « type 2 » ont en réalité une insulinodéficience et sont parfois mal classés (type 1, forme monogénique, mitochondriale, pancréatique) ; le type 1 et les formes spécifiques représentent chacun environ 5 %. Une cohorte suédoise de 8 980 adultes (Ahlqvist et coll., 2018) a identifié <button class="w" data-k="e14-sousgroupes">cinq sous-groupes reproductibles de diabète de l’adulte (variables et risques)</button> ; le groupe le plus insulinorésistant a le risque le plus élevé de maladie rénale diabétique, et le groupe insulinodéficient le risque de rétinopathie le plus élevé.</p>
<div class="alert"><b>Lacune.</b> Aucune donnée suisse sur la fréquence du code E14 dans la statistique médicale des hôpitaux n’a été trouvée : le poids réel de la catégorie « sans précision » en Suisse n’est pas documenté dans ce cours.</div>
<button class="pareto-btn ui" data-k="pareto-e14-definition">▲ Loi de Pareto — Définition et fréquence</button>
</section>
<section class="ilot" id="e14-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le raisonnement part de la situation normale. Les cellules β du pancréas sécrètent l’insuline avec le peptide C, <b>en quantité équimolaire</b> : le peptide C reflète donc la sécrétion endogène d’insuline, y compris chez un patient traité par insuline injectée, parce qu’il n’est pas apporté par le traitement. Cette équimolarité est établie par la revue de Jones et Hattersley (2013). L’insuline sécrétée freine la néoglucogenèse et la cétogenèse ; c’est son insuffisance qui ouvre la voie aux crises décrites plus bas (consensus 2024).</p>
<h3>3.1 Du déficit d’insuline à l’hyperglycémie</h3>
<p>Dans le <b>type 1</b>, la destruction des cellules β crée une carence absolue en insuline. Dans le <b>type 2</b>, une insulinorésistance, liée à l’obésité viscérale et à la sédentarité, s’associe à une carence insulinique relative ; l’une ou l’autre peut dominer ou précéder. En insulinorésistance extrême, une insuline et un peptide C « normaux » peuvent rester insuffisants. Cette dualité explique que la même hyperglycémie puisse naître de mécanismes opposés, ce qui justifie le sous-typage avant de choisir le traitement.</p>
<figure><svg viewBox="0 0 640 250" role="img" aria-label="Figure 1 — Déficit insulinique, hyperglycémie et deux crises"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="10" y="10" width="190" height="52" rx="6"/><rect x="225" y="10" width="190" height="52" rx="6"/><rect x="440" y="10" width="190" height="52" rx="6"/><path d="M200 36h25m-5-4l5 4-5 4M415 36h25m-5-4l5 4-5 4"/><rect x="10" y="110" width="290" height="60" rx="6"/><rect x="340" y="110" width="290" height="60" rx="6"/><path d="M320 62v30M120 62v48M520 62v48"/><rect x="170" y="195" width="300" height="46" rx="6"/><path d="M155 170l60 25M485 170l-60 25"/></g><g fill="currentColor" font-size="13" text-anchor="middle"><text x="105" y="32">Carence en insuline</text><text x="105" y="50">absolue ou relative</text><text x="320" y="32">Excès d’hormones</text><text x="320" y="50">de contre-régulation</text><text x="535" y="32">Hyperglycémie</text><text x="535" y="50">et diurèse osmotique</text><text x="155" y="136">Acidocétose</text><text x="155" y="156">insuline insuffisante pour freiner la cétogenèse</text><text x="485" y="136">État hyperosmolaire</text><text x="485" y="156">sécrétion résiduelle : peu de cétose</text><text x="320" y="214">Déshydratation, perte de potassium</text><text x="320" y="232">kaliémie initiale souvent trompeuse</text></g></svg><figcaption>Figure 1. Chaîne de la décompensation hyperglycémique (consensus 2024). Schéma pédagogique, sans échelle.</figcaption></figure>
<h3>3.2 Les deux crises hyperglycémiques</h3>
<p>L’<b>acidocétose</b> résulte d’une carence absolue ou relative en insuline, insuffisante pour freiner la néoglucogenèse et la cétogenèse, et d’un excès d’hormones de contre-régulation (glucagon, adrénaline, noradrénaline, cortisol, hormone de croissance). Dans l’<b>état hyperglycémique hyperosmolaire</b>, une sécrétion résiduelle d’insuline limite la cétose sans contrôler l’hyperglycémie. Les deux crises se recouvrent chez plus d’un tiers des patients. Le détail clinique figure aux sections 8 et <button class="w" data-k="e14-acd">dans la fenêtre sur l’acidocétose (critères, gravité, traitement)</button>.</p>
<p>Le <b>potassium</b> mérite une attention particulière. Le déficit corporel total est de 3 à 6 mmol/kg, en raison de la diurèse osmotique, des vomissements et de l’hyperaldostéronisme. Pourtant la kaliémie initiale est souvent normale ou élevée, car l’acidose et la carence en insuline font sortir le potassium des cellules. L’insuline, la correction de l’acidose et la réhydratation la font ensuite chuter ; <button class="w" data-k="e14-potassium">la conduite sur le potassium (seuils et délais)</button> en découle.</p>
<h3>3.3 L’exposition glycémique cumulée</h3>
<p>Les complications chroniques dépendent de la durée et de l’intensité de l’hyperglycémie. Les lignes directrices suisses sur la conduite décrivent une exposition en « HbA1c-années », chaque valeur d’HbA1c supérieure à 6,0 % étant comptée. À 50–70 HbA1c-années, presque toutes les complications microvasculaires sont présentes ; l’hypertension, l’hypercholestérolémie et l’obésité viscérale non traitées renforcent cet effet. <button class="w" data-k="e14-exposition">Le calcul de l’exposition (exemples)</button> aide à comprendre pourquoi un diabète longtemps non diagnostiqué se présente avec des complications.</p>
<div class="key"><b>À retenir.</b> Même hyperglycémie, mécanismes différents : carence absolue, insulinorésistance, ou les deux. Le peptide C, équimolaire à l’insuline, mesure la sécrétion endogène. La kaliémie initiale d’une crise ne renseigne pas sur le déficit en potassium.</div>
<button class="pareto-btn ui" data-k="pareto-e14-meca">▲ Loi de Pareto — Physiopathologie</button>
</section>
<section class="ilot" id="e14-4"><h2><span class="n">4</span>Quel type derrière le « sans précision » ?</h2>
<p>La classification précise rarement le type au premier contact. L’OMS propose une marche à suivre en cinq étapes, qui constitue le cœur pratique de cette catégorie. <button class="w" data-k="e14-typage">La démarche complète en cinq étapes (OMS 2019)</button> est détaillée en fenêtre ; en voici la logique.</p>
<table class="t"><thead><tr><th>Étape</th><th>Question posée</th><th>Raison</th></tr></thead><tbody><tr><td>1</td><td>Le diabète est-il confirmé, surtout chez le patient sans symptôme ?</td><td>Une seule valeur anormale chez l’asymptomatique exige une répétition.</td></tr><tr><td>2</td><td>Existe-t-il une cause secondaire ?</td><td>Les formes spécifiques (pancréas exocrine, endocrinopathies, médicaments) sont codées en E13.</td></tr><tr><td>3</td><td>Quels sont l’âge au diagnostic, les antécédents familiaux, l’examen (obésité) et le syndrome métabolique ?</td><td>Ces éléments pèsent différemment selon l’âge.</td></tr><tr><td>4</td><td>Y a-t-il une cétose ou une acidocétose ?</td><td>Elle oriente vers la carence insulinique, sans être réservée au type 1.</td></tr><tr><td>5</td><td>Les autoanticorps β-cellulaires et le peptide C sont-ils disponibles ?</td><td>Ils objectivent l’auto-immunité et la sécrétion résiduelle.</td></tr></tbody></table>
<p>Le classement peut ne devenir possible qu’avec le temps, par exemple lorsque le besoin d’insuline à long terme se précise. L’OMS recommande donc de <b>réévaluer régulièrement</b> la classification : l’étiquette « sans précision » n’est pas un verdict, mais une étape documentée.</p>
<h3>4.1 L’âge au diagnostic oriente le type</h3>
<button class="w" data-k="e14-age">La répartition des types selon l’âge (tranches et exceptions)</button> est la grille la plus utile au cabinet. Avant 6 mois, il s’agit surtout d’un diabète néonatal monogénique, donc génétique. Entre 6 mois et 10 ans, le type 1 domine. Entre 10 et 25 ans, les types 1, 2 et monogénique coexistent, le pic du monogénique se situant entre 15 et 20 ans. Entre 25 et 50 ans, le type 2, le diabète immunomédié lent (environ 10 % des « types 2 » en Europe, avec anticorps anti-GAD) et le type 1 se côtoient. Après 50 ans, ces mêmes formes persistent, le type 1 étant moins fréquent. Le groupe de 20 à 40 ans est le plus hétérogène : c’est là que le risque d’erreur de classement est le plus élevé.
<h3>4.2 Éléments qui évoquent un type 1 chez l’adulte</h3>
<p>Une cétose, une perte de poids rapide, un début avant 50 ans, un indice de masse corporelle inférieur à 25 kg/m² et des antécédents personnels ou familiaux d’auto-immunité font évoquer un type 1. Le syndrome métabolique est présent chez 33 % des diabètes immunomédiés lents, contre 83 % des types 2 : son absence plaide pour une forme auto-immune, sans l’exclure.</p>
<h3>4.3 Éléments qui évoquent un type 2 chez le jeune</h3>
<p>Le surpoids ou l’obésité, un âge supérieur à 10 ans, une forte histoire familiale, une acanthosis nigricans, des autoanticorps indétectables et un peptide C normal ou élevé plaident pour un type 2 ; les modèles de prédiction en ligne du diabète monogénique aident quand ces éléments sont discordants.</p>
<h3>4.4 La cétose ne désigne pas un type</h3>
<p>Une acidocétose ne signe pas un type 1. Le diagnostic différentiel comprend le type 1, le type 2 cétosique (adultes de toutes origines sauf caucasienne, diagnostic établi avec le temps) et le type 2 du jeune ou de l’adulte. Une acidocétose est présente au diagnostic chez environ 30 % des types 1 et 10 % des types 2. Les régimes cétogènes sont à rechercher. Le diabète auto-immun déclenché par les inhibiteurs de points de contrôle immunitaires se révèle par une acidocétose dans 69,7 % des cas d’une revue de 278 patients (<button class="w" data-k="e14-immuno">le diabète sous immunothérapie (fréquence et conduite)</button>).</p>
<div class="trap"><span class="k">Piège</span> Ne retenir ni « type 2 » parce que le patient est obèse, ni « type 1 » parce qu’il est cétosique. Chaque élément modifie la probabilité ; aucun ne tranche seul. Les anticorps eux-mêmes ne sont pas absolus : ils sont présents chez 5 à 14 % des « types 2 », et 41 % d’entre eux se sont négativés en dix ans dans une étude.</div>
<div class="key"><b>À retenir.</b> Procédure retenue : âge, cétose, anticorps, peptide C. <button class="w" data-k="e14-mnemo">Moyen mnémotechnique pour la séquence de typage (aide pédagogique, non critère officiel)</button>.</div>
<button class="pareto-btn ui" data-k="pareto-e14-causes">▲ Loi de Pareto — Quel type</button>
</section>
<section class="ilot" id="e14-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire a trois buts : caractériser le début et l’intensité de l’hyperglycémie, repérer des indices de type, et dépister une urgence ou une complication déjà installée.</p>
<h3>5.1 Antécédents et contexte à rechercher</h3>
<ul><li><button class="w" data-k="e14-fam">Antécédents familiaux de diabète et d’auto-immunité (lecture pour le typage)</button> : une forte histoire familiale plaide pour un type 2 ou une forme monogénique chez le jeune ; une auto-immunité personnelle ou familiale fait évoquer un type 1.</li><li><button class="w" data-k="e14-medic">Médicaments et régimes à rechercher (inhibiteurs du SGLT2, inhibiteurs de points de contrôle immunitaires, régime cétogène, alcool)</button> : ils peuvent déclencher une acidocétose ou un diabète secondaire.</li><li>Pancréatite, maladie hépatique, endocrinopathie : elles orientent vers une forme spécifique codée en E13.</li><li>Grossesse : un diabète découvert pendant la grossesse sort de la catégorie E14 (voir section 11).</li></ul>
<h3>5.2 Symptômes, par ordre de fréquence</h3>
<p>Les symptômes classiques sont la soif, la polyurie, la vision floue, la perte de poids et les mycoses génitales. Dans le type 2, les symptômes sont souvent absents, de sorte que des complications peuvent déjà exister au diagnostic. Dans l’acidocétose et l’état hyperosmolaire, la polyurie et la polydipsie s’accompagnent de perte de poids, de vomissements, de déshydratation et de troubles cognitifs. L’installation est rapide dans l’acidocétose (heures à jours) et plus lente dans l’état hyperosmolaire (jours à semaines) : cette différence de rythme guide l’interrogatoire sur la date de début.</p>
<div class="two"><div class="card"><h4>Forme typique à l’adulte jeune</h4><p>Soif intense, polyurie, perte de poids rapide, éventuellement cétose. Début avant 50 ans, indice de masse corporelle inférieur à 25 kg/m², auto-immunité associée. Le tableau évoque une insulinodéficience, donc une insulinothérapie d’emblée.</p></div><div class="card"><h4>Formes atypiques</h4><p>Diabète découvert par une complication (pied, rein, œil) ou par un bilan chez un patient sans symptôme. Acidocétose sans hyperglycémie majeure sous inhibiteur du SGLT2.</p></div></div>
<div class="trap"><span class="k">Piège</span> Un patient sans symptôme peut avoir une complication déjà installée. Chez l’asymptomatique, un seul test anormal ne suffit pas : il faut répéter le même test un autre jour.</div>
<div class="key"><b>À retenir.</b> L’interrogatoire cherche les arguments de typage, les déclencheurs de crise (infection, omission d’insuline, alcool, médicament) et les complications déjà présentes.</div>
<button class="pareto-btn ui" data-k="pareto-e14-anamnese">▲ Loi de Pareto — Anamnèse</button>
</section>
<section class="ilot" id="e14-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général, constantes, anthropométrie, puis signes ciblés. Chaque signe sert soit à estimer la gravité, soit à orienter le type, soit à dépister une complication.</p>
<div class="two"><div class="card"><h4>État général et constantes</h4><button class="w" data-k="e14-kussmaul">Respiration de Kussmaul et odeur fruitée (acétone)</button> : signes de l’acidocétose.
<p>Déshydratation et troubles cognitifs : signes communs aux deux crises ; leur présence impose le bilan d’urgence de la section 8.</p>
<p>Tension artérielle : cible de 130/70–79 mmHg, ou 130–139 mmHg après 65 ans (SSED 2023) ; contrôle au moins deux fois par an (critère de qualité SSED 2017).</p></div><div class="card"><h4>Anthropométrie</h4><p>Poids et indice de masse corporelle : un indice inférieur à 25 kg/m² évoque un type 1 chez l’adulte ; un surpoids ou une obésité évoquent un type 2.</p>
<button class="w" data-k="e14-acanthosis">Acanthosis nigricans (valeur d’orientation)</button> : argument en faveur d’un type 2 chez le jeune.</div></div>
<div class="two"><div class="card"><h4>Pied : dépistage annuel</h4><button class="w" data-k="e14-monofil">Monofilament et pallesthésie (critères de neuropathie absente)</button> : neuropathie considérée comme absente si le monofilament est perçu 4 fois sur 4 et la pallesthésie supérieure à 4/8.
<button class="w" data-k="e14-pouls">Pouls pédieux et indice de pression systolique (critères d’absence d’artériopathie significative)</button> : artériopathie des membres inférieurs considérée comme non significative si deux pouls pédieux sont palpables et l’indice supérieur ou égal à 0,9.</div><div class="card"><h4>Autres examens ciblés</h4><p>Fond d’œil ou examen ophtalmologique au moins tous les deux ans (critère de qualité de la SSED, 2017).</p>
<p>Signes d’insuffisance cardiaque (dyspnée, œdèmes) : l’insuffisance cardiaque atteint jusqu’à 30 % des diabétiques au-delà de 65 ans.</p></div></div>
<p>Le pied mérite un examen systématique parce que la neuropathie et l’artériopathie s’additionnent. L’examen est annuel ; si l’un des critères est anormal, le <button class="w" data-k="e14-pied">parcours en trois niveaux du pied diabétique (QCARE 2023)</button> prend le relais.</p>
<div class="trap"><span class="k">Piège</span> Un examen du pied normal l’année précédente ne dispense pas du suivant. Une absence de symptôme ne prouve pas l’absence de neuropathie.</div>
