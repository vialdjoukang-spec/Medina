<template data-pop="e14-classification" data-title="Classification : une conclusion clinique réévaluable"><div class="lab">Ce qui est classé</div><p>Le diabète est confirmé par des critères de glycémie ou d’HbA1c dans des conditions adaptées. Le type décrit le mécanisme probable : destruction β-cellulaire, résistance associée à dysfonction sécrétoire, forme hybride ou autre cause spécifique. Une information insuffisante justifie un type provisoire, pas l’absence de traitement [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>].</p>
<div class="lab">Raisonnement</div><p>Le médecin recherche d’abord le besoin d’insuline et les urgences. Il confronte ensuite histoire, âge, phénotype, famille, auto-immunité et sécrétion. Une maladie du pancréas, une endocrinopathie ou un médicament peut changer l’hypothèse. Aucun élément isolé n’est décisif dans tous les cas [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="lab">Limite</div><p>La catégorie OMS « non classé » est temporaire. Son rapprochement avec E14 n’est pas une correspondance administrative officielle démontrée. L’insuline reçue ne classe pas le type ; les sous-groupes de cohortes ne sont pas des sous-codes de E14 [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
</template>
<template data-pop="e14-peptide" data-title="Peptide C : sécrétion, concentration et interprétation"><div class="lab">De la molécule au sang</div><p>Le clivage de la proinsuline produit une molécule d’insuline et une de peptide C. Leur sécrétion est équimolaire. Leurs concentrations périphériques ne sont pas égales : une partie importante de l’insuline est extraite par le foie et sa demi-vie est plus courte. La revue décrit environ 20–30 minutes pour le peptide C contre 3–5 pour l’insuline [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="lab">Ce qui est mesuré</div><p>L’insuline injectée n’apporte pas de peptide C. Le résultat estime donc la sécrétion endogène actuelle. Une insuffisance rénale peut augmenter le taux sanguin ; un prélèvement pendant une hypoglycémie peut le diminuer. Le laboratoire doit connaître jeûne ou repas/stimulation, glycémie simultanée et méthode [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="lab">Unités et repères</div><p>Un nmol/L représente 1000 pmol/L. Ainsi 0,2 nmol/L correspond à 200 pmol/L. Dans la revue, un peptide C stimulé &lt;0,2 nmol/L soutient un déficit absolu ; le seuil proposé à jeun est différent (&lt;0,08 nmol/L). Ces repères proviennent de populations insulinotraitées et ne sont pas des références universelles ; une valeur proche d’une borne exige prudence [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<p>La SSED 2023 décrit un contexte de peptide C &gt;200 et &lt;600 pmol/L avec anticorps négatifs et sans forte histoire familiale. Une insulinodéficience est alors envisagée ; un type 1 précoce reste possible. La méthode, le repas, le glucose et le rein empêchent d’appliquer ce nombre sans contexte [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>].</p>
<div class="lab">Conséquence</div><p>Une réserve conservée au début ne réfute pas un type 1. L’utilité discriminante augmente après plusieurs années ; cela n’interdit pas un dosage plus précoce pertinent. L’insulinothérapie nécessaire n’attend pas le résultat [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>].</p>
</template>
<template data-pop="e14-semio" data-title="Sémiologie : plainte, mécanisme et décision"><div class="lab">Chronologie</div><p>La polyurie décrit une augmentation de volume, tandis qu’une pollakiurie décrit des mictions fréquentes. Le médecin précise nycturie, boissons, perte de poids et durée. Le glucose urinaire entraîne de l’eau et des électrolytes, ce qui relie hyperglycémie, polyurie, soif et déplétion [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Gravité</div><p>Vomissements, respiration profonde et troubles cognitifs changent l’urgence. La respiration de Kussmaul compense une acidose ; son absence ne l’exclut pas. La douleur abdominale peut être liée à la crise ou à sa cause et demande une nouvelle évaluation si elle persiste après correction [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Examen et interprétation</div><p>La pression artérielle apparemment préservée peut masquer une déplétion dans l’hyperosmolarité. L’examen est confronté aux électrolytes, cétones, pH et osmolalité. La première décision concerne la sécurité ; le type sera précisé ensuite [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e14-hba" data-title="HbA1c : seuil, cible et interférences"><div class="lab">Diagnostic et cible</div><p>Le seuil de diabète retenu est ≥6,5 % ou 48 mmol/mol avec une méthode standardisée. Chez l’asymptomatique, le résultat est confirmé. La zone 5,7–6,4 % citée par la SSED 2011 exprime un risque intermédiaire ; elle ne signifie pas absence certaine de diabète si le plasma répond à un critère. Une cible de traitement autour de 7 % n’est pas un seuil de normalité [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Discordances</div><p>Les hémoglobinopathies et les changements de renouvellement érythrocytaire peuvent modifier la mesure ou sa signification. Hémolyse, transfusion, insuffisance sévère rénale/hépatique et carence martiale demandent une interprétation prudente. La direction et l’importance peuvent dépendre de la méthode et du contexte ; le laboratoire participe à l’analyse [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Situations rapides ou particulières</div><p>Le diagnostic aigu d’un type 1 possible ne doit pas attendre l’HbA1c. Le diagnostic de diabète gestationnel utilise un parcours spécifique. L’OMS retient les bornes ≥ ; le document suisse 2011 utilise parfois >. Cette différence historique est déclarée, pas fusionnée [<a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">S14</a>].</p>
</template>
<template data-pop="e14-pied" data-title="Pied diabétique : la douleur absente ne rassure pas"><div class="lab">Examen</div><p>Le pied est inspecté sur toutes ses faces. Le médecin décrit profondeur et localisation d’une plaie, rougeur, chaleur, tuméfaction, déformations, pouls et sensibilité. Le monofilament et la pallesthésie évaluent des fonctions différentes. Les repères QCARE de monofilament 4/4 et vibration &gt;4/8 appartiennent à son parcours ; ils n’excluent pas toute neuropathie dans toute technique [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>].</p>
<div class="lab">Limite vasculaire majeure</div><p>La simplification QCARE « deux pouls et indice ≥0,9 » ne permet pas une exclusion universelle d’artériopathie. le groupe international du pied diabétique et les sociétés de chirurgie vasculaire européenne et américaine recommande de combiner Doppler, indice cheville-bras et indice orteil-bras. La maladie devient moins probable avec indice cheville-bras 0,9–1,3, indice orteil-bras ≥0,70 et flux bi- ou triphasique ; aucun résultat isolé ne suffit à l’exclure [<a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>].</p>
<div class="lab">Urgence</div><p>Ulcère/gangrène avec infection et ischémie demande un avis vasculaire urgent. Dans ce contexte, les repères d’ischémie sévère IWGDF comprennent indice cheville-bras &lt;0,4, pression cheville &lt;50 mmHg, pression orteil &lt;30 mmHg, pression transcutanée d’oxygène &lt;30 mmHg ou Doppler monophasique/absent. Ces valeurs ne doivent pas être mélangées avec les seuils légèrement différents du parcours QCARE [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>, <a data-reference-source="1" href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-05-PAD-Guideline.pdf" target="_blank" rel="noopener">S25</a>].</p>
<p>Une plaie profonde/plantaire, une évolution défavorable ou un pied chaud évoquant Charcot nécessite une montée de niveau. L’absence de douleur peut refléter la neuropathie et ne diminue pas l’urgence [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">S13</a>].</p>
</template>
<template data-pop="e14-crise" data-title="Crises adultes : stratégie, surveillance et résolution"><div class="lab">Diagnostic</div><p>L’acidocétose exige diabète connu ou glucose ≥11,1 mmol/L, cétones élevées et acidose. La figure 2 du consensus précise β-hydroxybutyrate ≥3 ou cétonurie ≥2+, pH &lt;7,3 et/ou bicarbonate &lt;18. Une glycémie plus basse est possible chez le diabétique connu, notamment sous traitement favorisant la cétose [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Traitement hospitalier</div><p>Le consensus adulte coordonne remplissage, insuline, électrolytes et cause. L’insuline rapide en perfusion est généralement débutée à 0,1 unité/kg/h dans l’acidocétose après sécurisation du potassium ; sous 13,9 mmol/L de glucose, l’ajout de glucose et une réduction usuelle à 0,05 permettent de poursuivre la correction des cétones. Les valeurs sont un protocole syndromique, pas une posologie inscrite dans toute FI [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<p>Dans l’état hyperosmolaire sans acidose (pH ≥7,3, bicarbonate ≥18), le consensus décrit 0,05 unité/kg/h ; en forme mixte, il décrit 0,1. JBDS privilégie d’abord la correction hydrique et peut différer l’insuline tant que le glucose baisse avec elle. Bicarbonate 15–17,9 ou contexte complexe demande une analyse experte plutôt qu’un automatisme [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<div class="lab">Limites de vitesse</div><p>Pour l’état hyperosmolaire, le consensus évite une baisse glycémique dépassant 5–6,7 mmol/L/h, une baisse de sodium &gt;10 mmol/L/24 h et une baisse d’osmolalité au-delà de 3–8 mOsm/kg/h. La hausse initiale du sodium sous correction du glucose ne suffit pas à décider un soluté hypotonique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Surveillance et sortie de crise</div><p>Le glucose est suivi toutes les une à deux heures ; électrolytes, créatinine, cétones et pH environ toutes les quatre heures. La résolution de l’acidocétose exige cétones &lt;0,6 et pH ≥7,3 ou bicarbonate ≥18. Le trou anionique et la cétonurie ne sont pas des critères privilégiés. Le relais sous-cutané prévoit un recouvrement d’une à deux heures avant arrêt de perfusion, avec dose adaptée au produit et au patient [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le protocole est adulte. Grossesse, fragilité, dialyse, atteinte cardiaque et enfance demandent une adaptation ; les limites de produits suisses restent visibles dans les fenêtres dédiées [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680411810011" target="_blank" rel="noopener">S27</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680298000024" target="_blank" rel="noopener">S30</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586050014" target="_blank" rel="noopener">S31</a>].</p>
</template>
<template data-pop="e14-potassium" data-title="Potassium : impératif physiologique et limites de produit"><div class="lab">Pourquoi la kaliémie trompe</div><p>Le déficit total dans l’acidocétose est souvent de 3–6 mmol/kg, mais l’acidose et le manque d’insuline déplacent le potassium vers le sang. Une valeur normale ou élevée n’exclut pas le déficit. L’insuline le fait rentrer dans les cellules et peut provoquer une chute dangereuse [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="lab">Repères du consensus adulte</div><p>Si la kaliémie est &lt;3,5 mmol/L, le consensus préconise une substitution et retarde l’insuline jusqu’à &gt;3,5. Il décrit un repère de 10 mmol/h dans cette situation et généralement 20–30 mmol de potassium par litre de soluté lorsque nécessaire pour viser 4–5 mmol/L. La diurèse, la fonction rénale et les contrôles conditionnent toute mise en œuvre. Ce repère n’est pas une prescription des concentrés nommés ci-dessous [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Produits suisses effectivement lus</div><table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Produit</th><th data-e14-style="e14-local-1">Concentration</th><th data-e14-style="e14-local-1">Limite décisive</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Kaliumchlorid B. Braun 7,45 %/14,9 %, janvier 2007</td><td data-e14-style="e14-local-1">1 ou 2 mmol/ml</td><td data-e14-style="e14-local-1">La FI mentionne acidose, déshydratation sévère, insuffisance rénale, anurie/oligurie, hyperkaliémie et hyperchlorémie parmi les contre-indications.</td></tr><tr><td data-e14-style="e14-local-1">Kalium chloratum 15 % Sintetica, février 2024</td><td data-e14-style="e14-local-1">2 mmol/ml</td><td data-e14-style="e14-local-1">Les contre-indications comprennent également acidose, déshydratation grave et insuffisance rénale.</td></tr><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-potassium">KCl</button> 7,45 % Sintetica, février 2024</td><td data-e14-style="e14-local-1">1 mmol/ml</td><td data-e14-style="e14-local-1">La dilution est obligatoire ; la même divergence avec l’acidocétose demeure.</td></tr></tbody></table>
<p>Aucun concentré ne s’administre non dilué. Les FI demandent un contrôle de diurèse, de kaliémie et de l’électrocardiogramme. Leur énumération n’autorise pas une substitution de marque ni un usage automatique pendant une acidose [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>].</p>
<div class="lab">Décision et limite explicite</div><p>Le besoin vital de traiter l’hypokaliémie est conservé. Le médecin hospitalier expérimenté et la pharmacie confrontent le protocole de crise au produit exact et à son cadre d’emploi. Le cours ne fournit pas une ordonnance d’ampoules qui ignorerait la FI et n’invente pas un produit alternatif. Une insuffisance rénale, une anurie ou une hyperkaliémie excluent toute supplémentation automatique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680295520907" target="_blank" rel="noopener">S24</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680514340132" target="_blank" rel="noopener">S26</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680565210019" target="_blank" rel="noopener">S29</a>].</p>
</template>
<template data-pop="e14-osmoles" data-title="Osmolalité : formule, unités et interprétation"><div class="lab">Base du calcul</div><p>La tonicité décrit l’effet des osmoles efficaces sur les mouvements d’eau. Le sodium et le glucose contribuent au calcul utile ; l’urée contribue à l’osmolalité totale mais n’est pas une osmole efficace de la même manière. Toutes les concentrations de la formule doivent être en mmol/L [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<div class="lab">Deux formules distinctes</div><table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Calcul</th><th data-e14-style="e14-local-1">Formule</th><th data-e14-style="e14-local-1">Exemple fictif</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Efficace</td><td data-e14-style="e14-local-1">2 × sodium + glucose</td><td data-e14-style="e14-local-1">Sodium 140 et glucose 35 donnent 2 ×140 +35 =315.</td></tr><tr><td data-e14-style="e14-local-1">Totale</td><td data-e14-style="e14-local-1">2 × sodium + glucose + urée</td><td data-e14-style="e14-local-1">Avec urée 10 : 280 +35 +10 =325.</td></tr></tbody></table>
<p>Ces valeurs calculées approchent l’osmolalité et sont généralement exprimées par convention clinique en mOsm/kg dans les recommandations ; le laboratoire peut calculer autrement ou mesurer directement. Le compte rendu doit préciser formule et unités [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
<div class="lab">Interprétation</div><p>Le consensus 2024 retient efficace &gt;300 ou totale &gt;320 dans les critères de l’état hyperosmolaire, avec glycémie ≥33,3 et les autres critères. L’exemple dépasse les deux repères mais ne donne pas à lui seul le diagnostic : cétones, acidose et clinique sont encore nécessaires [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Pendant le traitement, la trajectoire est suivie pour éviter une baisse trop rapide. Une natrémie qui monte alors que le glucose baisse n’impose pas à elle seule un soluté hypotonique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e14-anion" data-title="Trou anionique : charges mesurées et limites"><div class="lab">Pourquoi ce calcul</div><p>Le plasma reste électriquement équilibré. Le laboratoire mesure certains ions majeurs ; les autres charges ne disparaissent pas parce qu’elles ne figurent pas dans le calcul. Le trou anionique estime la différence entre le sodium mesuré et les principaux anions mesurés [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Formule sans potassium</div><p>Trou anionique = sodium − (chlorure + bicarbonate), avec chaque valeur en mmol/L. Exemple pédagogique : sodium 140, chlorure 100 et bicarbonate 14 donnent 140 −114 =26 mmol/L. Le consensus cite &gt;12 comme compatible avec une acidose à anions non mesurés ; le contexte et les références du laboratoire restent nécessaires [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Pièges</div><p>Des troubles mixtes peuvent modifier pH et bicarbonate. Après des volumes chlorés importants, une acidose hyperchlorémique peut persister alors que la cétose est corrigée. Le trou anionique n’est donc pas recommandé comme critère privilégié de résolution de l’acidocétose ; on préfère cétones et pH ou bicarbonate. Une autre cause d’acidose peut aussi coexister [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
</template>
<template data-pop="e14-rein" data-title="Rein : rapport urinaire, filtration et chronicité"><div class="lab">Deux axes complémentaires</div><p>La filtration estimée décrit une fonction ; le rapport albumine/créatinine urinaire décrit une perte d’albumine rapportée à un marqueur de concentration urinaire. Le bilan suisse recommande créatinine ou cystatine C et rapport sur échantillon au moins annuels chez l’adulte diabétique [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">S15</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Albuminurie</th><th data-e14-style="e14-local-1">Rapport albumine/créatinine</th><th data-e14-style="e14-local-1">Sens</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-rein">A1</button></td><td data-e14-style="e14-local-1">&lt;3 mg/mmol</td><td data-e14-style="e14-local-1">Elle est normale à légèrement augmentée dans cette classification.</td></tr><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-rein">A2</button></td><td data-e14-style="e14-local-1">≥3 à &lt;30 mg/mmol</td><td data-e14-style="e14-local-1">Elle est modérément augmentée.</td></tr><tr><td data-e14-style="e14-local-1"><button class="w" data-k="e14-rein">A3</button></td><td data-e14-style="e14-local-1">≥30 mg/mmol</td><td data-e14-style="e14-local-1">Elle est fortement augmentée.</td></tr></tbody></table>
<p>Le rapport ne se calcule pas si les unités sont incompatibles. Exemple pédagogique : albumine urinaire 40 mg/L divisée par créatinine 10 mmol/L donne 4 mg/mmol, catégorie <button class="w" data-k="e14-rein">A2</button>. Une valeur isolée ne démontre pas la chronicité. La synthèse suisse demande une persistance d’au moins trois mois de baisse du débit et/ou d’albuminurie pour la maladie chronique [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">S15</a>].</p>
<div class="lab">Ne pas tout attribuer au diabète</div><p>Hématurie active, dégradation rapide de filtration, albuminurie rapidement croissante ou syndrome néphrotique demandent une évaluation néphrologique. Une atteinte aiguë influence en outre la metformine, l’insuline et l’interprétation du peptide C ; les mêmes chiffres n’ont pas la même conséquence dans un état stable et une crise [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">S15</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3748788/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
</template>
