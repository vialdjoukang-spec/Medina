<template data-pop="pareto-e14-definition" data-title="Pareto — Définition et fréquence">
<p class="ratio" data-cover="e14-0,e14-1,e14-2"></p><ul><li>E14 est un diagnostic d’étape : diabète documenté, type non attribué.</li><li>L’insuline ne détermine pas le type ; la classification de l’OMS vise la décision insuline ou non.</li><li>Prévalence suisse déclarée : 6,2 % en 2022 ; le type n’est pas quantifiable dans l’enquête.</li><li>Un quart des « type 2 » est insulinodéficient (SSED 2023) : l’erreur de classement est fréquente.</li></ul></template>
<template data-pop="pareto-e14-meca" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="e14-3"></p><ul><li>Insuline et peptide C sont sécrétés en quantité équimolaire : le peptide C mesure la sécrétion endogène.</li><li>Acidocétose : carence en insuline plus contre-régulation ; état hyperosmolaire : sécrétion résiduelle qui limite la cétose.</li><li>Déficit total en potassium de 3 à 6 mmol/kg malgré une kaliémie initiale souvent normale ou élevée.</li><li>Exposition cumulée : 50 à 70 HbA1c-années correspondent à la plupart des complications microvasculaires.</li></ul></template>
<template data-pop="pareto-e14-causes" data-title="Pareto — Quel type">
<p class="ratio" data-cover="e14-4"></p><ul><li>Cinq étapes OMS : confirmer, exclure une cause secondaire, âge et clinique, cétose, anticorps et peptide C.</li><li>Le groupe de 20 à 40 ans est le plus hétérogène ; réévaluer le type régulièrement.</li><li>Cétose et acidocétose ne sont pas réservées au type 1.</li><li>Anticorps : 5 à 14 % des « types 2 » en possèdent ; absents ne veut pas dire type 2.</li></ul></template>
<template data-pop="pareto-e14-anamnese" data-title="Pareto — Anamnèse">
<p class="ratio" data-cover="e14-5"></p><ul><li>Soif, polyurie, vision floue, perte de poids, mycoses génitales ; symptômes souvent absents dans le type 2.</li><li>Acidocétose : heures à jours ; état hyperosmolaire : jours à semaines.</li><li>Rechercher inhibiteurs du SGLT2, immunothérapie, régime cétogène, alcool, infection.</li><li>Une grossesse en cours fait sortir le diabète de la catégorie E14.</li></ul></template>
<template data-pop="pareto-e14-clinique" data-title="Pareto — Examen clinique">
<p class="ratio" data-cover="e14-6"></p><ul><li>Kussmaul et haleine fruitée orientent vers l’acidocétose ; déshydratation et troubles cognitifs vers les deux crises.</li><li>Pied annuel : monofilament 4 sur 4, pallesthésie supérieure à 4/8, deux pouls pédieux, indice supérieur ou égal à 0,9.</li><li>Examen ophtalmologique au moins tous les deux ans.</li><li>Insuffisance cardiaque jusqu’à 30 % au-delà de 65 ans chez le diabétique.</li></ul></template>
<template data-pop="pareto-e14-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="e14-7"></p><ul><li>Seuils OMS : glycémie à jeun ≥ 7,0 ; à 2 heures ≥ 11,1 ; HbA1c ≥ 6,5 % ; aléatoire ≥ 11,1 avec symptômes.</li><li>Chez l’asymptomatique, répéter le test un autre jour.</li><li>HbA1c inadaptée : hémoglobinopathies, renouvellement érythrocytaire accru, insuffisance hépatique ou rénale sévère.</li><li>Peptide C : utile à 3 à 5 ans ; absent, il signe un besoin absolu d’insuline.</li></ul></template>
<template data-pop="pareto-e14-urgences" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="e14-8"></p><ul><li>Acidocétose = glycémie ≥ 11,1 (ou diabète connu) + β-hydroxybutyrate ≥ 3,0 + pH < 7,30 ou bicarbonate < 18.</li><li>Insuline 0,1 unité/kg/heure ; retarder l’insuline si kaliémie < 3,5 ; pas de bicarbonate en routine.</li><li>État hyperosmolaire : osmolalité ≥ 320, glycémie ≥ 30, cétonémie ≤ 3,0 ; remplissage d’abord.</li><li>Hypoglycémie : sous insuline ou sulfonylurées uniquement ; grade 3 = aide d’un tiers.</li><li>Maladie rénale chronique : débit < 60 et/ou rapport > 3 mg/mmol pendant au moins 3 mois.</li></ul></template>
<template data-pop="pareto-e14-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="e14-9"></p><ul><li>Tant que le type est incertain, traiter l’insulinodéficience.</li><li>Insuline d’emblée : HbA1c > 10 %, perte de poids, cétose, maladie aiguë, poids normal ou bas, suspicion de type 1.</li><li>Type 2 : metformine plus inhibiteur du SGLT2 ou agoniste du GLP-1, puis insuline basale, jamais insuline plus sulfonylurée.</li><li>Éviter toute HbA1c supérieure à 8,0 % ; cible usuelle d’environ 7 %.</li></ul></template>
<template data-pop="pareto-e14-suivi" data-title="Pareto — Suivi et pronostic">
<p class="ratio" data-cover="e14-10"></p><ul><li>Indicateurs de qualité : 3 consultations, 2 HbA1c, 2 tensions, bilan rénal et pieds annuels, œil tous les 2 ans.</li><li>Mortalité de l’acidocétose inférieure à 1 % ; état hyperosmolaire 5 à 10 fois plus élevé.</li><li>Réévaluer le type régulièrement : E14 est une étape, pas une destination.</li></ul></template>
<template data-pop="pareto-e14-particulier" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="e14-11"></p><ul><li>Diabète préexistant en grossesse : O24.-, hors E14 ; diabète gestationnel par charge de 75 g à 24–28 semaines.</li><li>Sujet âgé : cibles moins strictes, éviter les agonistes du GLP-1 si anorexie.</li><li>Metformine contre-indiquée sous 30 mL/min ; conduite : arrêt si glycémie < 4,0 mmol/L au volant.</li></ul></template>
<template data-pop="pareto-e14-codage" data-title="Pareto — Codage">
<p class="ratio" data-cover="e14-12"></p><ul><li>Quatrième caractère : complication ; cinquième caractère : décompensé (1) ou non (0).</li><li>Décompensé : jugé sur l’ensemble du séjour ; la glycémie d’admission n’est pas un critère.</li><li>Diabète traité avec une seule complication : .6 ; complications multiples : .7 ; pied diabétique : .74 ou .75.</li></ul></template>
<template data-pop="pareto-e14-exam-hier" data-title="Pareto — Hiérarchie des examens">
<p class="ratio" data-cover="e14-e-1"></p><ul><li>Pas de test unique : seuils pour le diabète, combinaison pour le type, examen dédié pour chaque complication.</li><li>Urgence : β-hydroxybutyrate, pH, bicarbonate, osmolalité et potassium en premier.</li><li>Typage : anticorps et peptide C, seulement s’ils changent la décision.</li></ul></template>
<template data-pop="pareto-e14-exam-gly" data-title="Pareto — Glycémie et HbA1c">
<p class="ratio" data-cover="e14-e-2"></p><ul><li>Glycémie : à jeun ≥ 7,0 ; 2 heures ≥ 11,1 ; aléatoire ≥ 11,1 avec symptômes.</li><li>HbA1c ≥ 6,5 % avec méthode standardisée ; limites en cas de renouvellement érythrocytaire anormal.</li><li>Répéter chez l’asymptomatique ; ne jamais conclure sur une valeur isolée.</li></ul></template>
<template data-pop="pareto-e14-exam-typage" data-title="Pareto — Typage">
<p class="ratio" data-cover="e14-e-3"></p><ul><li>Anticorps chez 5 à 14 % des « types 2 » ; absents ne veut pas dire type 2.</li><li>Peptide C absent à tout moment = besoin absolu d’insuline.</li><li>Peptide C de 200 à 600 pmol/L avec anticorps négatifs : insulinodéficience, répéter à 3 ans.</li></ul></template>
<template data-pop="pareto-e14-exam-crise" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="e14-e-4"></p><ul><li>β-hydroxybutyrate sanguin préféré à la bandelette urinaire.</li><li>Glycémie < 11,1 mmol/L n’exclut pas l’acidocétose sous inhibiteur du SGLT2.</li><li>Résolution : cétonémie < 0,6 et pH ≥ 7,3 ou bicarbonate ≥ 18 ; pas de trou anionique.</li><li>Rein : rapport > 3 mg/mmol ou débit < 60 pendant au moins 3 mois.</li></ul></template>
<template data-pop="pareto-e14-s-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e14-s-physio-cours"></p><ul><li>Peptide C équimolaire à l’insuline : mesure de la sécrétion endogène, même sous insuline injectée.</li><li>Type 2 = résistance plus carence relative ; l’une ou l’autre peut dominer.</li><li>Hypoglycémie seulement sous insuline, sulfonylurées et glinides.</li></ul></template>
<template data-pop="pareto-e14-s-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="e14-s-bioch-cours"></p><ul><li>Insuline insuffisante : cétogenèse non freinée, acidose, β-hydroxybutyrate élevé.</li><li>Kaliémie initiale trompeuse : déficit total de 3 à 6 mmol/kg.</li><li>Osmolalité = 2 × Na⁺ + glucose + urée ; seuil de 320 mOsm/kg.</li></ul></template>
<template data-pop="pareto-e14-s-gen" data-title="Pareto — Génétique et immunologie">
<p class="ratio" data-cover="e14-s-gen-cours"></p><ul><li>Avant 6 mois : monogénique néonatal ; pic monogénique à 15–20 ans.</li><li>Diabète immunomédié lent : environ 10 % des « types 2 » en Europe, un seul anti-GAD.</li><li>Le type 2 est hétérogène : cinq sous-groupes reproductibles dans une cohorte de 8 980 adultes.</li></ul></template>
<template data-pop="pareto-e14-s-compl" data-title="Pareto — Complications">
<p class="ratio" data-cover="e14-s-compl-cours"></p><ul><li>Exposition cumulée : 50 à 70 HbA1c-années correspondent à presque toutes les complications microvasculaires.</li><li>Insulinorésistance forte : rein et stéatose ; insulinodéficience : rétinopathie.</li><li>Pied : neuropathie plus artériopathie plus infection ; parcours en trois niveaux.</li></ul></template>
<template data-pop="pareto-e14-pharma-strat" data-title="Pareto — Stratégie">
<p class="ratio" data-cover="e14-p-1"></p><ul><li>Trois temps : urgences, insuline ou non selon l’insulinodéficience, protection cardio-rénale.</li><li>Type 2 établi : metformine plus inhibiteur du SGLT2 ou agoniste du GLP-1 ; insuline basale préférée à une sulfonylurée.</li><li>Doses non lues pour insuline, inhibiteurs du SGLT2 et agonistes du GLP-1 : voir l’information professionnelle.</li></ul></template>
<template data-pop="pareto-e14-pharma-doses" data-title="Pareto — Doses">
<p class="ratio" data-cover="e14-p-2"></p><ul><li>Acidocétose : insuline 0,1 unité/kg/heure, puis 0,05 à glycémie < 13,9 avec glucose ; potassium 10 mmol/heure si < 3,5.</li><li>Metformine : maximum 1000 mg/jour à DFGe 30–44, contre-indiquée sous 30.</li><li>Glucagon nasal : 3 mg en dose unique dès 1 an.</li></ul></template>
<template data-pop="pareto-e14-pharma-inter" data-title="Pareto — Interactions et effets indésirables">
<p class="ratio" data-cover="e14-p-3"></p><ul><li>Éviter l’association insuline plus sulfonylurée.</li><li>Inhibiteur du SGLT2 : acidocétose euglycémique ; arrêt à l’admission.</li><li>Metformine : stop si DFGe < 30, si acidose, coma ou précoma diabétiques ; arrêt 48 heures avant contraste iodé si DFGe < 60.</li></ul></template>
<template data-pop="pareto-e14-pharma-mono" data-title="Pareto — Monographies">
<p class="ratio" data-cover="e14-p-4"></p><ul><li>Seules les informations professionnelles de la metformine et du glucagon nasal sont lues.</li><li>Pour insuline sous-cutanée, inhibiteurs du SGLT2 et agonistes du GLP-1 : vérifier la dose dans l’information professionnelle.</li></ul></template>
<template data-pop="e14-nosologie" data-title="E14 : libellés, sous-codes et exclusions">
<div class="lab">Libellés (OFS, CIM-10-GM 2024)</div><p>La catégorie <b>E14 Diabète sucré, sans précision</b> compte dix quatrièmes caractères : .0 avec coma, .1 avec acidocétose, .2 complications rénales, .3 oculaires, .4 neurologiques, .5 vasculaires périphériques, .6 autres complications précisées, .7 complications multiples, .8 complications non précisées, .9 sans complication. Le cinquième caractère indique si le diabète est désigné comme décompensé (1) ou non (0). Les codes existants sont E14.01, E14.11, E14.20 et E14.21, E14.30 et E14.31, E14.40 et E14.41, E14.50 et E14.51, E14.60 et E14.61, E14.72 à E14.75, E14.80 et E14.81, E14.90 et E14.91.</p>
<div class="lab">Exclusions (OMS 2019)</div><p>Sont exclus de E14 : le diabète de malnutrition (E12), le diabète néonatal (P70.2), le diabète de la grossesse, de l’accouchement et du post-partum (O24.-), les types 1 (E10) et 2 (E11), la glycosurie sans précision (R81), la glycosurie rénale (E74.8), l’anomalie de la tolérance au glucose (R73.0) et l’hypo-insulinémie postchirurgicale (E89.1). Le coma hypoglycémique est inclus dans E14.0. Si le diabète est médicamenteux, un code de cause externe s’ajoute.</p>
<div class="lab">Pourquoi cette organisation</div><p>Le quatrième caractère transforme un diagnostic de tri en description de la gravité (coma, acidocétose, complications), ce qui oriente le séjour hospitalier. Il ne remplace pas la classification clinique de l’OMS, qui vise le choix du traitement.</p>
<div class="lab">Limite</div><p>Les libellés suisses ne contiennent pas les notes d’inclusion de l’OMS ; la page de l’OMS consultée renvoie par erreur la note du type 2 vers E10.</p>
<p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024, catégorie E14</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/27985670/master" target="_blank" rel="noopener">OFS, Manuel de codage médical 2024</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E14" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E14</a>.</p></template>
<template data-pop="e14-oms2019" data-title="Classification de l’OMS 2019 : formes hybrides et autres types">
<div class="lab">Formes hybrides</div><p>Le <b>diabète immunomédié d’évolution lente de l’adulte</b> (ancien LADA) associe un syndrome métabolique plus fréquent que dans le type 1, un seul anticorps anti-GAD et une fonction β mieux conservée. Le <b>type 2 cétosique</b> débute par une cétose et une carence en insuline, puis l’insuline devient moins nécessaire.</p>
<div class="lab">Autres types spécifiques</div><p>Défauts monogéniques de la fonction β ou de l’action de l’insuline, maladies du pancréas exocrine, endocrinopathies, médicaments et toxiques, infections, formes immunes rares et syndromes génétiques. Dans la classification suisse, ces formes relèvent de E13 et non de E14.</p>
<div class="lab">Ce que la classification ne fait pas</div><p>Elle supprime les sous-classes des types 1 et 2 et reste un compromis entre clinique et étiologie. Aucun critère (âge, perte de fonction β, insulinorésistance, autoanticorps, besoin d’insuline) ne distingue à lui seul sans équivoque les types 1 et 2.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">OMS, Classification of diabetes mellitus, 2019</a>.</p></template>
<template data-pop="e14-nonclasse" data-title="Diabète non classé et E14">
<div class="lab">Définition</div><p>La catégorie « diabète non classé » de l’OMS regroupe les diabètes qui ne rentrent clairement dans aucune catégorie. Elle est <b>temporaire</b> et sert surtout près du diagnostic, tant que les données manquent.</p>
<div class="lab">Rapprochement avec E14</div><p>E14 joue en pratique le même rôle dans la classification suisse : un diagnostic d’attente, remplacé par E10, E11 ou E13 quand le type est établi. Ce rapprochement est une interprétation du cours : <b>aucune source lue n’établit officiellement l’équivalence</b> entre E14 et « diabète non classé ».</p>
<div class="lab">Conséquence pratique</div><p>Réévaluer régulièrement le type. Le classement peut ne devenir possible qu’avec le temps, par exemple après plusieurs années de besoin d’insuline.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">OMS, Classification of diabetes mellitus, 2019</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024, catégorie E14</a>.</p></template>
<template data-pop="e14-sousgroupes" data-title="Sous-groupes du diabète de l’adulte (cohorte suédoise)">
<div class="lab">Étude</div><p>Ahlqvist et coll. (<i>Lancet Diabetes Endocrinol</i>, 2018) ont analysé 8 980 adultes de la cohorte suédoise ANDIS à partir de six variables : anticorps anti-GAD, âge au diagnostic, indice de masse corporelle, HbA1c, fonction β et résistance à l’insuline estimées par le modèle d’évaluation de l’homéostasie. Cinq sous-groupes reproductibles sont apparus.</p>
<div class="lab">Résultats utiles</div><p>Le groupe le plus insulinorésistant a un risque significativement plus élevé de maladie rénale diabétique. Le groupe insulinodéficient a le risque de rétinopathie le plus élevé.</p>
<div class="lab">Lecture suisse</div><p>La SSED (2023) décrit aussi l’hétérogénéité : 6 % de types 1 non diagnostiqués, 18 % d’insulinodéficience nette sans anticorps, 15 % d’insulinorésistance très forte, 20 % associés à l’obésité, 40 % liés à l’âge.</p>
<div class="lab">Limite</div><p>Seul le résumé de l’article a été lu. Ces sous-groupes décrivent des risques ; ils ne sont pas des critères diagnostiques.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/s2213-8587(18)30051-2" target="_blank" rel="noopener">Ahlqvist et coll., sous-groupes du diabète de l’adulte, 2018</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a>.</p></template>
<template data-pop="e14-seuils" data-title="Critères diagnostiques de l’OMS 2019">
<div class="lab">Définition</div><p>Le diabète est diagnostiqué par une glycémie plasmatique à jeun ≥ 7,0 mmol/L, une glycémie 2 heures après 75 g de glucose ≥ 11,1 mmol/L, une HbA1c ≥ 6,5 % (48 mmol/mol), ou une glycémie aléatoire ≥ 11,1 mmol/L avec symptômes.</p>
<div class="lab">Pourquoi répéter</div><p>Chez le patient asymptomatique, une valeur isolée peut résulter d’une variabilité biologique ou d’une erreur préanalytique. L’OMS demande de répéter le test, de préférence le même, un autre jour. Chez le patient symptomatique, la clinique renforce la valeur du premier résultat.</p>
<div class="lab">Application</div><p>Une HbA1c de 11,4 % avec soif et perte de poids suffit. Une HbA1c de 6,6 % sans symptôme est répétée. En grossesse, des valeurs de diabète dès le premier contrôle définissent un diabète préexistant (O24.-).</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">OMS, Classification of diabetes mellitus, 2019</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM, lignes directrices aptitude à la conduite, août 2025</a>.</p></template>
<template data-pop="e14-hba1c" data-title="Limites de l’HbA1c pour le diagnostic">
<div class="lab">Condition d’emploi</div><p>La SSED recommande l’HbA1c pour le diagnostic du diabète et du prédiabète si la <b>méthode est standardisée</b> sur les références de l’essai sur le contrôle du diabète et ses complications et de l’étude prospective britannique du diabète.</p>
<div class="lab">Avantages</div><p>Sa variabilité biologique est de 2 %, contre 12 à 15 % pour la glycémie à jeun ; elle est stable avant l’analyse.</p>
<div class="lab">Situations où elle est inadaptée</div><p>Hémoglobinopathies (HbS, HbC, HbF, HbE) ; renouvellement érythrocytaire accru (hémolyse, transfusions, hémolyse infraclinique du VIH) ; insuffisance hépatique ou rénale sévère ; diabète gestationnel ; type 1 ; diabète de la mucoviscidose.</p>
<div class="lab">Situations de prudence</div><p>Carence martiale (valeur faussement élevée) ; fortes doses de vitamines C et E ; âge supérieur à 70 ans (+0,4 %).</p>
<div class="lab">Limite</div><p>Le document de 2011 est ancien et écrit « supérieur à 6,5 % » ; l’OMS retient « supérieur ou égal ». Ce cours suit l’OMS.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">SSED, HbA1c et diagnostic, 2011</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">OMS, Classification of diabetes mellitus, 2019</a>.</p></template>
<template data-pop="e14-typage" data-title="Les cinq étapes du sous-typage (OMS 2019)">
<div class="lab">Séquence</div><p>(1) Confirmer le diabète chez l’asymptomatique. (2) Exclure les causes secondaires. (3) Relever l’âge au diagnostic, les antécédents familiaux, l’examen (obésité) et le syndrome métabolique. (4) Chercher une cétose ou une acidocétose. (5) Doser les autoanticorps β-cellulaires et le peptide C si disponibles.</p>
<div class="lab">Pourquoi dans cet ordre</div><p>Les étapes les plus accessibles (clinique) précèdent les plus coûteuses (biologie). La confirmation et l’exclusion des causes secondaires évitent de typer une hyperglycémie qui n’est pas un diabète primaire.</p>
<div class="lab">Décision</div><p>Le classement peut n’être possible qu’avec le temps (besoin d’insuline à long terme). Tant qu’il manque, le code reste E14 et le traitement répond à l’insulinodéficience.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">OMS, Classification of diabetes mellitus, 2019</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a>.</p></template>
<template data-pop="e14-age" data-title="Types de diabète les plus probables selon l’âge">
<table class="t"><thead><tr><th>Âge au diagnostic</th><th>Types les plus probables</th></tr></thead><tbody><tr><td>Moins de 6 mois</td><td>Diabète néonatal monogénique (génétique)</td></tr><tr><td>6 mois à 10 ans</td><td>Surtout type 1</td></tr><tr><td>10 à 25 ans</td><td>Types 1, 2 et monogénique ; pic du monogénique de 15 à 20 ans</td></tr><tr><td>25 à 50 ans</td><td>Type 2, diabète immunomédié lent (environ 10 % des « types 2 » en Europe), type 1</td></tr><tr><td>Plus de 50 ans</td><td>Mêmes formes ; type 1 moins fréquent</td></tr></tbody></table>
<div class="lab">Pièges</div><p>Le groupe de 20 à 40 ans est le plus hétérogène et expose au risque d’erreur de classement le plus élevé. Un modèle de prédiction en ligne (diabetesgenes.org) aide à estimer la probabilité d’une forme monogénique chez le jeune.</p>
