<template data-pop="e14-cibles" data-title="Cibles de traitement : individualiser sans confondre normalité"><div class="lab">Objectif partagé</div><p>La SSED propose souvent une HbA1c de 7 % pour le type 2. Cette cible est ajustée avec le patient selon durée, complications, hypoglycémies, comorbidités et espérance de vie. Elle ne s’applique pas mécaniquement à une grossesse ni à une crise [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Contexte décrit par SSED 2023</th><th data-e14-style="e14-local-1">Objectif possible</th><th data-e14-style="e14-local-1">Condition</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">La plupart des adultes type 2</td><td data-e14-style="e14-local-1">Autour de 7 %</td><td data-e14-style="e14-local-1">Le risque hypoglycémique et les préférences sont considérés.</td></tr><tr><td data-e14-style="e14-local-1">Certains patients plus jeunes/durée courte</td><td data-e14-style="e14-local-1">Environ 6,5 %</td><td data-e14-style="e14-local-1">L’objectif doit rester réalisable sans hypoglycémies significatives répétées.</td></tr><tr><td data-e14-style="e14-local-1">Fragilité, hypoglycémies sévères, comorbidités ou espérance de vie limitée</td><td data-e14-style="e14-local-1">Souvent 7–8 %, parfois objectif symptomatique simplifié</td><td data-e14-style="e14-local-1">La prévention des hypoglycémies et la charge de traitement priment.</td></tr></tbody></table>
<p>Pour une cible d’HbA1c voisine de 7 %, la SSED cite souvent un temps dans l’intervalle 3,9–10 mmol/L d’au moins 70 %. Ce pourcentage est un objectif de suivi sous capteur, pas un critère diagnostique ni une norme biologique de jeûne. Un capteur ne remplace pas les dosages hospitaliers nécessaires pendant une crise [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
</template>
<template data-pop="e14-conduite" data-title="Conduite automobile : règles suisses 2025 contextualisées"><div class="lab">Population</div><p>Les règles ci-dessous concernent le premier groupe médical et les catégories privées décrites par la directive 2025. Le transport professionnel et les autres catégories demandent leurs conditions propres. Complications visuelles, neurologiques, cardiovasculaires, déséquilibre et perception des hypoglycémies sont évalués [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">S8</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Risque selon traitement/situation</th><th data-e14-style="e14-local-1">Mesures principales</th><th data-e14-style="e14-local-1">Repères</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Faible risque selon directive</td><td data-e14-style="e14-local-1">Le lecteur et les glucides restent dans le véhicule.</td><td data-e14-style="e14-local-1">Le contrôle avant chaque trajet peut être dispensé dans les conditions décrites.</td></tr><tr><td data-e14-style="e14-local-1">Risque moyen sans surveillance continue</td><td data-e14-style="e14-local-1">La glycémie est vérifiée avant départ et au moins toutes les deux heures lors d’un long trajet.</td><td data-e14-style="e14-local-1">Sous 4 mmol/L : pas de conduite ; correction puis attente minimale de 45 minutes. À 4–5 : glucides selon directive.</td></tr><tr><td data-e14-style="e14-local-1">Risque élevé sans surveillance continue</td><td data-e14-style="e14-local-1">Les contrôles précèdent chaque trajet et sont réguliers pendant les longs trajets.</td><td data-e14-style="e14-local-1">La cible avant/durant le trajet est ≥5 ; à 4–5, la directive décrit 10–20 g de glucides.</td></tr><tr><td data-e14-style="e14-local-1">Hypoglycémie sévère ou perception altérée</td><td data-e14-style="e14-local-1">Une évaluation spécialisée est nécessaire.</td><td data-e14-style="e14-local-1">Les exigences de surveillance renforcée sont définies par la directive.</td></tr></tbody></table>
<p>Une surveillance continue avec alarmes change les exigences mais ne dispense pas de corriger une tendance descendante ou une hypoglycémie. Sous 4 mmol/L, le trajet est interrompu ; le délai minimal après correction reste 45 minutes, et une mesure capillaire est recommandée en cas de doute. Le document ne doit pas être réduit à « jamais conduire sous 5 » dans tous les traitements [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">S8</a>].</p>
<div class="lab">Portée</div><p>Le médecin confronte les règles à la situation et au permis. Cette fenêtre n’est ni une autorisation de conduire ni une expertise de médecine du trafic [<a data-reference-source="1" href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">S8</a>].</p>
</template>
<template data-pop="e14-nosologie" data-title="Sous-codes suisses et décompensation documentée"><div class="lab">Après le diagnostic clinique</div><p>E14 indique un type sans précision. Les catégories E10, E11, E12 et E13 décrivent des types ou causes précisés ; la grossesse et le diabète néonatal ont leur classification distincte. L’insuline reçue ne démontre pas une dépendance primaire ni un type 1 [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://classbrowser.nhs.uk/ICD-10-5TH-Edition/vol1/block-e10-e14.htm" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Sous-code terminal local 2024</th><th data-e14-style="e14-local-1">Libellé</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">E14.01</td><td data-e14-style="e14-local-1">Avec coma: Désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.11</td><td data-e14-style="e14-local-1">Avec acidocétose: Désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.20</td><td data-e14-style="e14-local-1">Avec complications rénales: Non désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.21</td><td data-e14-style="e14-local-1">Avec complications rénales: Désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.30</td><td data-e14-style="e14-local-1">Avec complications oculaires: Non désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.31</td><td data-e14-style="e14-local-1">Avec complications oculaires: Désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.40</td><td data-e14-style="e14-local-1">Avec complications neurologiques: Non désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.41</td><td data-e14-style="e14-local-1">Avec complications neurologiques: Désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.50</td><td data-e14-style="e14-local-1">Avec complications vasculaires périphériques: Non désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.51</td><td data-e14-style="e14-local-1">Avec complications vasculaires périphériques: Désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.60</td><td data-e14-style="e14-local-1">Avec autres complications précisées: Non désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.61</td><td data-e14-style="e14-local-1">Avec autres complications précisées: Désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.72</td><td data-e14-style="e14-local-1">Avec complications multiples: Avec autres complications multiples, non désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.73</td><td data-e14-style="e14-local-1">Avec complications multiples: Avec autres complications multiples, désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.74</td><td data-e14-style="e14-local-1">Avec complications multiples: Avec syndrome du pied diabétique, non désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.75</td><td data-e14-style="e14-local-1">Avec complications multiples: Avec syndrome du pied diabétique, désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.80</td><td data-e14-style="e14-local-1">Avec complications non précisées: Non désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.81</td><td data-e14-style="e14-local-1">Avec complications non précisées: Désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.90</td><td data-e14-style="e14-local-1">Sans complication: Non désigné comme décompensé</td></tr><tr><td data-e14-style="e14-local-1">E14.91</td><td data-e14-style="e14-local-1">Sans complication: Désigné comme décompensé</td></tr></tbody></table>
<p>Les dix familles E14.0 à E14.9 sont reliées dans le corps du cours à leurs situations cliniques ; les vingt codes terminaux ci-dessus décrivent les subdivisions disponibles du catalogue suisse local. Les combinaisons absentes ne sont pas inventées [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>].</p>
<div class="lab">Décompensation</div><p>Le manuel suisse 2025 utilise le cinquième caractère et juge le métabolisme sur l’ensemble de la prise en charge, rétrospectivement. La glycémie d’admission seule n’est pas son critère de contrôle. Ses exemples comprennent hypoglycémies symptomatiques répétées &lt;3 mmol/L avec surveillance et adaptation, forte variabilité, HbA1c nettement élevée ou valeurs &gt;15 répétées avec modification thérapeutique. Ces repères de codage ne remplacent pas les critères cliniques d’urgence [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
<p>Le diagnostic principal dépend de la priorité thérapeutique de l’hospitalisation et des manifestations ; les règles des groupes de coûts hospitaliers détaillées ne sont pas remplacées par un choix de code sur tableau. Le catalogue de cours reste 2024 et le manuel lu 2025 : aucune certification du codage 2026 n’est revendiquée [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">S20</a>].</p>
</template>
<template data-pop="e14-calculdose" data-title="Insuline : calcul d’un débit et limites de la préparation"><div class="lab">Grandeurs différentes</div><p>Le débit thérapeutique en unité/kg/h est multiplié par le poids en kg pour donner unité/h. La concentration préparée en unité/ml permet ensuite de convertir ce débit en ml/h. Le flacon à 100 unités/ml n’est pas d’emblée la concentration de la perfusion [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="lab">Exemple pédagogique adulte</div><p>Pour 60 kg au repère du consensus 0,1 unité/kg/h : 60 ×0,1 =6 unités/h. Si une préparation professionnelle vérifiée contient 1 unité/ml, la pompe délivre 6 ÷1 =6 ml/h. Avec 0,05 unité/kg/h, le résultat serait 3 unités/h. Ces calculs n’établissent pas l’indication chez le patient ni une recette de dilution [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Produit et sécurité</div><p>La FI <button class="w" data-k="e14-novorapid">NovoRapid</button> 100 unités/ml décrit, pour certaines solutions et récipients compatibles, des concentrations 0,05–1 unité/ml stables 24 heures ; elle signale une adsorption initiale sur le matériel. La préparation, le contenant, la voie et le protocole sont vérifiés. Glycémie et potassium sont surveillés ; une hypokaliémie peut retarder l’insuline selon le consensus [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<p>Le besoin total sous-cutané exprimé par jour est une autre grandeur. Il ne doit pas être remplacé par le débit horaire d’une crise. L’insuffisance rénale/hépatique, l’alimentation et la fragilité changent les besoins [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
</template>
<template data-pop="e14-metformine" data-title="Glucophage : FI suisse octobre 2025, produit exact"><div class="lab">Indications et mécanisme</div><p>Les comprimés Glucophage 500, 850 et 1000 mg contiennent la metformine. La FI indique le type 2 en complément des mesures de vie, avec possibilités d’associations. Elle décrit aussi un complément dans certains types 1 avec résistance à l’insuline ; ce n’est jamais un remplacement de l’insuline déficitaire. Le produit réduit notamment la production hépatique de glucose et améliore la réponse insulinique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<div class="lab">Adultes : voie orale et titration</div><p>Le début est 500–1000 mg/j, augmenté selon glycémie et tolérance de 500 mg tous les cinq à sept jours. La dose usuelle d’entretien est 1500–2000 mg/j et le maximum 3000 mg/j. Les prises sont réparties avec ou après les repas, habituellement deux à trois ; une augmentation progressive réduit les troubles digestifs. La durée est chronique tant que l’indication et la tolérance persistent, avec réévaluation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Filtration estimée ou clairance</th><th data-e14-style="e14-local-1">Dose de cette FI</th><th data-e14-style="e14-local-1">Contrôle rénal</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">≥60, état stable</td><td data-e14-style="e14-local-1">Titration usuelle selon patient</td><td data-e14-style="e14-local-1">Au moins annuel si fonction normale ; davantage si risque.</td></tr><tr><td data-e14-style="e14-local-1">45–59 ml/min/1,73 m²</td><td data-e14-style="e14-local-1">Début 500 ou 850 mg/j ; maximum 1000 mg/j en deux prises</td><td data-e14-style="e14-local-1">Tous les trois à six mois.</td></tr><tr><td data-e14-style="e14-local-1">30–44 ml/min/1,73 m²</td><td data-e14-style="e14-local-1">Même maximum 1000 mg/j, sans autre facteur d’acidose lactique</td><td data-e14-style="e14-local-1">Au moins tous les trois mois.</td></tr><tr><td data-e14-style="e14-local-1">&lt;30 ml/min/1,73 m²</td><td data-e14-style="e14-local-1">Contre-indiqué ; arrêt</td><td data-e14-style="e14-local-1">Une dégradation aiguë demande une action immédiate.</td></tr></tbody></table>
<p>La clairance est exprimée en ml/min ; le débit estimé indexé en ml/min/1,73 m². La FI cite les deux : le prescripteur utilise la grandeur appropriée, sans en faire deux mesures identiques chez tous les gabarits. Le plafond 30–59 de ce produit n’est pas remplacé par celui d’un tableau de classe [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<div class="lab">Contre-indications et situations aiguës</div><p>Hypersensibilité, acidose métabolique, coma/précoma diabétique, fonction rénale sous le seuil, insuffisance hépatique, intoxication alcoolique aiguë/alcoolisme et situations aiguës hypoxiques ou menaçant le rein contre-indiquent le produit. Une déshydratation par vomissements/diarrhée ou une infection grave peut imposer l’arrêt. Une suspicion d’acidose lactique impose arrêt et hospitalisation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<div class="lab">Contraste, chirurgie et interactions</div><p>Si filtration ou clairance &lt;60 avant contraste iodé intravasculaire, arrêt 48 heures avant et reprise uniquement si le contrôle rénal 48 heures après n’indique pas d’aggravation. Pour chirurgie prévue sous anesthésie générale, spinale ou péridurale, arrêt 48 heures avant ; reprise au plus tôt 48 heures après avec alimentation orale et fonction rénale satisfaisantes. Alcool, diurétiques, médicaments néphrotoxiques et inhibiteurs du transport rénal peuvent augmenter le risque ; la glycémie et le rein guident l’adaptation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<div class="lab">Effets indésirables et populations</div><p>Les troubles digestifs sont fréquents au début ; la carence en vitamine B12 est décrite et une anémie/neuropathie demande de l’évaluer. L’acidose lactique est très rare mais grave. Chez l’enfant dès dix ans, la FI décrit début 500 ou 850 mg et maximum 2000 mg/j en deux à trois prises ; sous dix ans, le produit n’est pas utilisé. Cette indication ne vaut pas traitement d’un type 1 présumé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<p>En grossesse, la FI permet d’envisager le produit si indication clinique avec surveillance de la croissance ; elle demande de ne pas débuter ou d’arrêter s’il existe des facteurs de petit poids de naissance. L’allaitement exige de peser bénéfice maternel et risque théorique pour le nourrisson. Une maladie mitochondriale connue/suspectée appelle une prudence spécifique et le produit n’y est pas recommandé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">S19</a>].</p>
<p class="src"><a href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">[S19] Swissmedic/AIPS via AmiKo, Glucophage, octobre 2025</a>, passages relus le 2 novembre 2026. Aucune substitution par une autre formulation.</p>
</template>
<template data-pop="e14-novorapid" data-title="Insuline aspart 100 unités/ml : information suisse avril 2026"><div class="lab">Produit et mécanisme</div><p><button class="w" data-k="e14-novorapid">NovoRapid</button> est une insuline aspart rapide à 100 unités/ml, indiquée dans le diabète quand l’insuline est nécessaire. Son action réduit le glucose et déplace le potassium vers les cellules. La FI relue concerne ce produit exact ; la voie et le dispositif sont vérifiés avant usage [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="lab">Administration et dose</div><p>La dose est individualisée. La FI cite des besoins totaux usuels de 0,5–1 unité/kg/j chez l’adulte et l’enfant dès deux ans, avec fraction rapide généralement 50–70 % dans un schéma basal-bolus et le reste en insuline intermédiaire/prolongée. Ce repère n’est ni un maximum ni une dose de crise. L’injection sous-cutanée est généralement immédiatement avant le repas, parfois juste après selon situation [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<p>Début d’action sous-cutané environ 10–20 minutes, maximum une à trois heures et durée trois à cinq heures. La rotation des sites limite lipodystrophie/amyloïdose et variations d’absorption. Une pompe compatible peut assurer débit basal et bolus ; un secours est nécessaire en cas de panne. Hors ce contexte, une insuline rapide seule ne couvre pas automatiquement toute la journée [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="lab">Voie intraveineuse</div><p>La FI l’autorise par un professionnel avec garantie de suivi et contrôle étroit du glucose et du potassium. Elle décrit des solutions et récipients compatibles à 0,05–1 unité/ml pendant 24 heures et une adsorption initiale. Elle ne fournit pas les débits/kg/h du consensus de crise ; ils restent attribués à [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>]. Aucune recette universelle de mélange n’est déduite d’une simple liste de compatibilité [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="lab">Contre-indications et risques</div><p>L’hypersensibilité est contre-indiquée. Hypoglycémie et hypokaliémie sont des risques majeurs ; une hypoglycémie sévère peut provoquer perte de conscience ou convulsions. Des erreurs de produit/concentration, des repas omis ou des injections dans un tissu remanié peuvent provoquer des fluctuations. Les allergies, réactions locales et œdèmes doivent être considérés [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<div class="lab">Interactions et adaptations</div><p>Les bêtabloquants peuvent masquer les signes ; l’alcool peut majorer l’hypoglycémie. Corticostéroïdes et autres médicaments peuvent augmenter les besoins ; d’autres traitements les diminuer. Insuffisance rénale/hépatique et âge avancé imposent une adaptation individualisée avec contrôles renforcés, sans réduction forfaitaire unique. Grossesse et allaitement sont possibles avec suivi et adaptation ; les données sous deux ans sont limitées et la surveillance doit être étroite [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">S23</a>].</p>
<p class="src"><a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">[S23] Swissmedic/AIPS via AmiKo, NovoRapid, avril 2026</a>, relue le 2 novembre 2026.</p>
</template>
<template data-pop="e14-baqsimi" data-title="Baqsimi : glucagon nasal 3 mg, FI mars 2026"><div class="lab">Indication et dose</div><p>Baqsimi 3 mg poudre nasale est indiqué pour l’hypoglycémie sévère chez le diabétique dès un an. Une tierce personne administre une dose unique de 3 mg dans une narine ; aucune inspiration profonde n’est nécessaire. Un trouble de conscience ne permet pas d’attendre que le patient s’administre le produit [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>].</p>
<div class="lab">Mécanisme et conduite</div><p>Le glucagon active les récepteurs hépatiques et la libération de glucose à partir du glycogène. Des réserves suffisantes sont nécessaires. Une aide médicale urgente est sollicitée ; aucune prise orale n’est donnée tant que la déglutition n’est pas sûre. Après récupération, des glucides par bouche contribuent à reconstituer les réserves et prévenir une récidive [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>].</p>
<div class="lab">Limites et contre-indications</div><p>Hypersensibilité et phéochromocytome sont contre-indiqués. Un insulinome peut provoquer une récidive par libération d’insuline. Jeûne, abus chronique d’alcool, insuffisance surrénale ou hypoglycémie chronique peuvent réduire l’efficacité ; l’équipe peut devoir administrer du glucose. Sous un an, Baqsimi n’est pas recommandé faute de données [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>].</p>
<div class="lab">Interactions et effets indésirables</div><p>L’indométacine peut diminuer l’effet voire favoriser une hypoglycémie ; l’effet anticoagulant de la warfarine peut augmenter. Les bêtabloquants peuvent majorer transitoirement pouls et pression. Nausées, vomissements, céphalées et irritation nasale/aérienne sont les effets fréquemment rapportés ; une réaction allergique est possible [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>].</p>
<div class="lab">Populations particulières</div><p>Aucune adaptation forfaitaire liée au rein, au foie ou à l’âge n’est requise ; aucune étude formelle dédiée rénale/hépatique n’a été réalisée. Grossesse et allaitement sont possibles selon la FI. L’absence d’ajustement ne démontre pas une efficacité dans toute déplétion en glycogène [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">S18</a>].</p>
<p class="src"><a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">[S18] Swissmedic/AIPS via AmiKo, Baqsimi, mars 2026</a>, relue le 2 novembre 2026.</p>
</template>
<template data-pop="e14-fluides" data-title="Cristalloïdes suisses : aucune interchangeabilité présumée"><div class="lab">Repère de crise adulte</div><p>Le consensus propose saline isotonique ou cristalloïde équilibré à 500–1000 ml/h pendant deux à quatre heures chez l’adulte sans limitation cardiaque/rénale, puis adaptation. Ce chiffre ne dispense pas de vérifier le produit ; une fragilité ou une insuffisance d’organe demande une stratégie plus prudente [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">S11</a>].</p>
<table class="t" data-e14-style="e14-local-0"><thead><tr><th data-e14-style="e14-local-1">Produit exact</th><th data-e14-style="e14-local-1">Données de la FI</th><th data-e14-style="e14-local-1">Contre-indications importantes</th></tr></thead><tbody><tr><td data-e14-style="e14-local-1">Chlorure de sodium 0,9 % Baxter, février 2022</td><td data-e14-style="e14-local-1">154 mmol/L de sodium et chlorure ; 500 ml–3 L/24 h pour déplétion isotonique, adaptation aux situations extrêmes.</td><td data-e14-style="e14-local-1">Hypervolémie, hypernatrémie, hyperchlorémie, déshydratation hypertonique.</td></tr><tr><td data-e14-style="e14-local-1">Natrium chloratum Bichsel 0,9 %, octobre 2025</td><td data-e14-style="e14-local-1">La routine décrite cite 540 ml/h et limite 2000 ml/j, avec possibilité d’adaptation extrême/choc.</td><td data-e14-style="e14-local-1">Les mêmes quatre contre-indications sont listées.</td></tr><tr><td data-e14-style="e14-local-1">Ringer-Acetat Fresenius, avril 2026</td><td data-e14-style="e14-local-1">sodium 137, potassium 4 et chlorure 110 mmol/L ; débit adulte recommandé 5 ml/kg/h, maximum 40 ml/kg/j.</td><td data-e14-style="e14-local-1">Œdèmes, hyperhydratation, déshydratation hypertonique, insuffisance rénale sévère, alcalose, insuffisance cardiaque décompensée, hyperkaliémie.</td></tr></tbody></table>
<p>La fenêtre compare les documents ; elle ne constitue pas une ordonnance de l’un de ces produits pour un état hyperosmolaire. Le prescripteur et la pharmacie vérifient état hydrique, sodium, chlorure, potassium, fonction rénale, compatibilités et cadre d’emploi. Le débit syndromique n’annule pas une limite de produit [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680411810011" target="_blank" rel="noopener">S27</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680298000024" target="_blank" rel="noopener">S30</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586050014" target="_blank" rel="noopener">S31</a>].</p>
<div class="lab">Mélanges et surveillance</div><p>Les ajouts et les co-perfusions demandent une compatibilité vérifiée. Le calcium du Ringer-Acetat peut précipiter avec certaines substances. Surcharge, œdèmes, troubles du sodium/chlorure et déséquilibre acido-basique sont recherchés ; les conditions de grossesse, âge et défaillance rénale/cardiaque sont individualisées [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680411810011" target="_blank" rel="noopener">S27</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680298000024" target="_blank" rel="noopener">S30</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680586050014" target="_blank" rel="noopener">S31</a>].</p>
</template>
<template data-pop="pareto-e14-1" data-title="Essentiel — Reconnaître le diabète sans attendre son type"><p> L’urgence et le besoin d’insuline précèdent l’étiquette du diabète. Un traitement reçu ne prouve pas son type.</p>
<p class="ratio" data-cover="e14-1"></p>
</template>
<template data-pop="pareto-e14-2" data-title="Essentiel — Définition, histoire naturelle et classification clinique"><p> Le type est une conclusion argumentée et révisable. « Sous insuline » ne signifie pas « type 1 ».</p>
<p class="ratio" data-cover="e14-2"></p>
</template>
<template data-pop="pareto-e14-3" data-title="Essentiel — Épidémiologie suisse et limites de comparaison"><p> Le poids du diabète en Suisse est documenté ; la part des types incertains reste une question distincte.</p>
<p class="ratio" data-cover="e14-3"></p>
</template>
<template data-pop="pareto-e14-4" data-title="Essentiel — Du fonctionnement normal aux syndromes"><p> La polyurie reflète une perte d’eau ; les cétones reflètent un déficit d’action insulinique. Une kaliémie initiale normale ne prouve pas des réserves normales.</p>
<p class="ratio" data-cover="e14-4"></p>
</template>
<template data-pop="pareto-e14-5" data-title="Essentiel — Étiologies et facteurs qui orientent le typage"><p> Le médecin choisit les examens qui peuvent modifier la décision. Le type reste réévalué après correction de la crise.</p>
<p class="ratio" data-cover="e14-5"></p>
</template>
<template data-pop="pareto-e14-6" data-title="Essentiel — Anamnèse : préciser le symptôme et son contexte"><p> La temporalité, les pertes hydriques et les traitements donnent au chiffre glycémique sa signification clinique.</p>
<p class="ratio" data-cover="e14-6"></p>
</template>
<template data-pop="pareto-e14-7" data-title="Essentiel — Examen clinique et syndromes de gravité"><p> La gravité est clinique et biologique. Un chiffre isolé, un pouls palpable ou une douleur absente ne suffisent pas à rassurer.</p>
<p class="ratio" data-cover="e14-7"></p>
</template>
<template data-pop="pareto-e14-8" data-title="Essentiel — Diagnostic positif, examens et arbre décisionnel"><p> Le diagnostic de diabète, le diagnostic de crise et le diagnostic du type répondent à trois questions différentes.</p>
<p class="ratio" data-cover="e14-8"></p>
</template>
<template data-pop="pareto-e14-9" data-title="Essentiel — Drapeaux rouges et crises hyperglycémiques"><p> Les cétones et l’équilibre acido-basique déterminent l’acidocétose. L’hyperosmolarité se calcule avec une formule précisée.</p>
<p class="ratio" data-cover="e14-9"></p>
</template>
<template data-pop="pareto-e14-10" data-title="Essentiel — Prise en charge : stabiliser puis choisir le traitement"><p> La stabilisation précède le traitement durable. Chaque protocole s’applique à sa population et chaque médicament à son produit exact.</p>
<p class="ratio" data-cover="e14-10"></p>
</template>
<template data-pop="pareto-e14-11" data-title="Essentiel — Complications, suivi et prévention des récidives"><p> Le suivi vérifie les organes, l’autonomie et le type. Le plan de sortie doit rendre possible le traitement prescrit.</p>
<p class="ratio" data-cover="e14-11"></p>
</template>
<template data-pop="pareto-e14-12" data-title="Essentiel — Grossesse, enfant, âge avancé et organes défaillants"><p> La population et les organes conditionnent chaque résultat et chaque dose. Une conduite adulte standard ne couvre pas toutes ces situations.</p>
<p class="ratio" data-cover="e14-12"></p>
</template>
<template data-pop="pareto-e14-13" data-title="Essentiel — Documentation clinique, sous-codes et particularités suisses"><p> Le code décrit la conclusion clinique ; il ne la remplace ni ne décide le remboursement.</p>
<p class="ratio" data-cover="e14-13"></p>
</template>
<template data-pop="pareto-e14-14" data-title="Essentiel — Critères formels, paramètres décisifs et pièges"><p> Le dossier garde séparés diagnostic, type, crise, cible et codage. Chaque incertitude appelle une action et une échéance.</p>
<p class="ratio" data-cover="e14-14"></p>
</template>
