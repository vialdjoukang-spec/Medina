<template data-pop="e14-cetose" data-title="Acidocétose euglycémique">
<div class="lab">Définition</div><p>Acidocétose avec glycémie inférieure à 11,1 mmol/L. Elle représente environ 10 % des acidocétoses. Le critère diagnostique retient « glycémie ≥ 11,1 mmol/L <b>ou</b> diabète connu » : un diabète connu suffit.</p>
<div class="lab">Causes</div><p>Insuline exogène, apport alimentaire réduit, grossesse, alcool, insuffisance hépatique et, pour la majorité des cas récents, inhibiteurs du SGLT2.</p>
<div class="lab">Conduite</div><p>Arrêt de l’inhibiteur du SGLT2 à l’admission ; traitement comme toute acidocétose. La reprise après résolution n’est pas recommandée en routine dans le type 2 faute de données.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a>.</p></template>
<template data-pop="e14-immuno" data-title="Diabète sous inhibiteurs de points de contrôle immunitaires">
<div class="lab">Fait</div><p>Le diabète auto-immun associé aux inhibiteurs de points de contrôle se révèle par une acidocétose dans 69,7 % des cas d’une revue de 278 patients.</p>
<div class="lab">Conséquence</div><p>Un diabète d’apparition brutale sous immunothérapie doit faire chercher une acidocétose, et l’immunothérapie figure parmi les médicaments à rechercher à l’anamnèse.</p>
<div class="lab">Limite</div><p>Le dossier ne précise ni la prise en charge spécifique ni l’intérêt des anticorps dans cette situation.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a>.</p></template>
<template data-pop="e14-mnemo" data-title="Moyens mnémotechniques (aide pédagogique, non critère officiel)">
<p><b>Typage : A, C, A, P.</b> Âge au diagnostic, Cétose, Anticorps, Peptide C. Cette séquence aide à se rappeler l’ordre des étapes de la démarche de l’OMS ; elle ne remplace pas les cinq étapes complètes.</p>
<p><b>Acidocétose : D, K, A.</b> Diabète (glycémie ≥ 11,1 ou diabète connu), cétones (β-hydroxybutyrate ≥ 3,0), acidose (pH < 7,30 ou bicarbonate < 18). Les trois critères doivent être réunis. La séquence D, K, A figure dans le consensus de 2024.</p>
<p class="src">Aide pédagogique, non critère officiel.</p></template>
<template data-pop="e14-fam" data-title="Antécédents familiaux : lecture pour le typage">
<div class="lab">Type 2 et forme monogénique</div><p>Une forte histoire familiale est un argument en faveur d’un type 2 chez le jeune ; chez un jeune à anticorps négatifs et sécrétion conservée, une forme monogénique est à envisager.</p>
<div class="lab">Auto-immunité</div><p>Des antécédents personnels ou familiaux d’auto-immunité font évoquer un type 1 chez l’adulte.</p>
<div class="lab">Limite</div><p>Un antécédent familial ne fait pas le diagnostic : il modifie une probabilité.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">OMS, Classification of diabetes mellitus, 2019</a>.</p></template>
<template data-pop="e14-medic" data-title="Médicaments et régimes à rechercher">
<div class="lab">Inhibiteurs du SGLT2</div><p>Cause de la majorité des acidocétoses euglycémiques récentes.</p>
<div class="lab">Inhibiteurs de points de contrôle immunitaires</div><p>Diabète auto-immun, souvent révélé par une acidocétose.</p>
<div class="lab">Régimes cétogènes et alcool</div><p>Les régimes cétogènes sont à rechercher devant une cétose ; l’alcool est un facteur déclenchant d’acidocétose.</p>
<div class="lab">Diabète médicamenteux</div><p>Le diabète dû aux stéroïdes relève de E13 dans la classification suisse ; l’OMS ajoute un code de cause externe quand le diabète est médicamenteux.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/27985670/master" target="_blank" rel="noopener">OFS, Manuel de codage médical 2024</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E14" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E14</a>.</p></template>
<template data-pop="e14-kussmaul" data-title="Respiration de Kussmaul et odeur fruitée">
<div class="lab">Signe</div><p>Respiration profonde et ample, avec odeur fruitée de l’acétone dans l’haleine, dans l’acidocétose.</p>
<div class="lab">Valeur</div><p>Le signe oriente vers l’acidocétose et justifie la mesure immédiate du β-hydroxybutyrate et du pH.</p>
<div class="lab">Piège</div><p>Le diagnostic repose sur les critères biologiques (cétones et acidose), non sur le seul signe clinique.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a>.</p></template>
<template data-pop="e14-acanthosis" data-title="Acanthosis nigricans">
<div class="lab">Valeur</div><p>Chez le sujet jeune, l’acanthosis nigricans fait partie des arguments en faveur d’un type 2, avec le surpoids ou l’obésité, un âge supérieur à 10 ans, une forte histoire familiale, des autoanticorps indétectables et un peptide C normal ou élevé.</p>
<div class="lab">Limite</div><p>Aucun de ces éléments n’est suffisant ; ils s’additionnent.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/2cb3ab68-a52a-402e-ad47-8bc5a4edc834/content" target="_blank" rel="noopener">OMS, Classification of diabetes mellitus, 2019</a>.</p></template>
<template data-pop="e14-monofil" data-title="Monofilament et pallesthésie">
<div class="lab">Critère</div><p>La neuropathie est considérée comme absente si le monofilament est perçu 4 fois sur 4 et si la pallesthésie est supérieure à 4/8.</p>
<div class="lab">Fréquence</div><p>Examen annuel du pied, critère de qualité du suivi en premier recours.</p>
<div class="lab">Piège</div><p>L’absence de symptôme ne remplace pas l’examen annuel.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED, critères de qualité du suivi en premier recours, 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">SSED et QCARE, parcours du pied diabétique, 2023</a>.</p></template>
<template data-pop="e14-pouls" data-title="Pouls pédieux et indice de pression systolique">
<div class="lab">Critère</div><p>Une artériopathie des membres inférieurs significative est considérée comme absente si deux pouls pédieux sont palpables et si l’indice de pression systolique est supérieur ou égal à 0,9.</p>
<div class="lab">Valeurs de gravité</div><p>Dans le parcours QCARE, un indice < 0,9 ou moins de deux pouls place le patient au niveau 2 ; un indice < 0,5, une pression d’orteil < 30 mmHg ou une pression transcutanée en oxygène < 25 mmHg correspondent à une ischémie aiguë (niveau 3).</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED, critères de qualité du suivi en premier recours, 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">SSED et QCARE, parcours du pied diabétique, 2023</a>.</p></template>
<template data-pop="e14-pied" data-title="Pied diabétique : parcours QCARE 2023">
<table class="t"><thead><tr><th>Niveau</th><th>Situation</th><th>Suivi</th></tr></thead><tbody><tr><td>1 — simple (premier recours)</td><td>Ulcère de grade 1 superficiel (jusqu’au derme), pas d’infection, pas d’artériopathie significative, pas de neuropathie ni de déformation</td><td>Contrôle à 1 semaine</td></tr><tr><td>2 — complexe (réseau spécialisé)</td><td>Ulcère de grade 2 ou plus, ou plantaire ; infection ; artériopathie (moins de 2 pouls, indice < 0,9) ; neuropathie ; antécédent d’ulcère ou d’amputation ; déformation ; durée > 4 semaines ; réduction < 10 % par semaine</td><td>Au moins hebdomadaire</td></tr><tr><td>3 — urgence (équipe interprofessionnelle)</td><td>Cellulite, gangrène, infection systémique, ischémie aiguë, Charcot aigu, nécrose, réduction < 50 % en 4 semaines, dialyse</td><td>Au moins hebdomadaire</td></tr></tbody></table>
<div class="lab">Codage</div><p>Le syndrome du pied diabétique est codé E14.74 ou E14.75, avec G63.2* et I79.2*.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">SSED et QCARE, parcours du pied diabétique, 2023</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/27985670/master" target="_blank" rel="noopener">OFS, Manuel de codage médical 2024</a>.</p></template>
<template data-pop="e14-acd" data-title="Acidocétose diabétique : critères, gravité et traitement">
<div class="lab">Critères (consensus 2024)</div><p>Trois critères réunis : glycémie ≥ 11,1 mmol/L ou diabète connu ; β-hydroxybutyrate ≥ 3,0 mmol/L (ou cétonurie ≥ 2+) ; pH < 7,30 et/ou bicarbonate < 18 mmol/L. Le β-hydroxybutyrate ≥ 3,0 a une sensibilité et une spécificité supérieures à 90 %.</p>
<div class="lab">Gravité</div><p>Légère : pH > 7,25 et < 7,30 ou bicarbonate 15–18. Modérée : pH 7,0–7,25 ou bicarbonate 10 à moins de 15. Sévère : β-hydroxybutyrate > 6,0 et troubles de la conscience, avec soins intensifs.</p>
<div class="lab">Traitement</div><p>Cristalloïdes 500–1000 mL/heure pendant 2–4 heures ; insuline intraveineuse 0,1 unité/kg/heure ; potassium 10 mmol/heure et insuline retardée si kaliémie < 3,5 ; glucose 5–10 % et insuline 0,05 unité/kg/heure à glycémie < 13,9 ; pas de bicarbonate en routine ; relais sous-cutané avec chevauchement de 1–2 heures.</p>
<div class="lab">Pourquoi ces choix</div><p>Le remplissage corrige le déficit hydrique. L’insuline freine la cétogenèse et la néoglucogenèse ; le potassium protège contre l’hypokaliémie induite par l’insuline. Le glucose empêche l’hypoglycémie quand l’insuline doit continuer à agir sur les cétones.</p>
<div class="lab">Complications du traitement</div><p>Hypoglycémie (16–28 % ; sous 2,2 mmol/L, mortalité ×4,8), hypokaliémie ≤ 2,5 mmol/L (mortalité ×3), acidose hyperchlorémique, thrombose, œdème cérébral, démyélinisation osmotique, insuffisance rénale aiguë.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a>.</p></template>
<template data-pop="e14-ehh" data-title="État hyperglycémique hyperosmolaire">
<div class="lab">Critères (JBDS 2022)</div><p>Hypovolémie marquée ; osmolalité ≥ 320 mOsm/kg ; glycémie ≥ 30 mmol/L ; cétonémie ≤ 3,0 mmol/L ; pH > 7,3 ; bicarbonate ≥ 15 mmol/L.</p>
<div class="lab">Traitement</div><p>Pertes de 100 à 220 mL/kg. Remplissage d’abord ; insuline intraveineuse à débit fixe seulement quand l’osmolalité cesse de baisser, sauf cétonémie. Baisse de l’osmolalité de 3,0 à 8,0 mOsm/kg/heure ; glycémie de 10 à 15 mmol/L pendant 24 heures ; glucose 5–10 % si glycémie < 14.</p>
<div class="lab">Résolution</div><p>Osmolalité < 300, diurèse ≥ 0,5 mL/kg/heure, état cognitif antérieur, glycémie < 15 mmol/L.</p>
<div class="lab">Risques</div><p>Thrombo-embolie et lésions du pied.</p>
<div class="lab">Limite</div><p>Les seuils de la figure du consensus 2024 n’ont pas été lus ; les valeurs viennent du JBDS 2022.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/dme.15005" target="_blank" rel="noopener">JBDS, état hyperglycémique hyperosmolaire, 2022</a> ; <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a>.</p></template>
<template data-pop="e14-osmo" data-title="Calcul de l’osmolalité">
<div class="lab">Formule</div><p>Osmolalité (mOsm/kg) = 2 × Na⁺ + glucose + urée, les trois en mmol/L (formule des lignes directrices JBDS 2022).</p>
<div class="lab">Exemple fictif</div><p>Natrémie 150 mmol/L, glycémie 40 mmol/L, urée 15 mmol/L : 2 × 150 + 40 + 15 = 355 mOsm/kg, valeur supérieure au seuil de 320 de l’état hyperosmolaire.</p>
<div class="lab">Piège</div><p>Une natrémie basse à l’admission est souvent apparente : chaque baisse de 5,6 mmol/L de glucose fait remonter la natrémie de 1,6 mmol/L (consensus 2024). L’osmolalité se suit pour éviter une chute trop rapide (objectif de 3,0 à 8,0 mOsm/kg/heure).</p>
<p class="src">Références : <a href="https://doi.org/10.1111/dme.15005" target="_blank" rel="noopener">JBDS, état hyperglycémique hyperosmolaire, 2022</a> ; <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a>.</p></template>
<template data-pop="e14-exposition" data-title="Exposition glycémique cumulée (HbA1c-années)">
<div class="lab">Principe</div><p>Les lignes directrices suisses de 2025 décrivent une exposition en « HbA1c-années », chaque HbA1c supérieure à 6,0 % étant comptée. À 50–70 HbA1c-années, presque toutes les complications microvasculaires sont présentes. L’hypertension, l’hypercholestérolémie et l’obésité viscérale non traitées renforcent cet effet.</p>
<div class="lab">Lecture pédagogique</div><p>Si l’on additionne, pour chaque année, l’excès de l’HbA1c au-dessus de 6,0 %, un patient à 8,0 % pendant 10 ans cumule 20 unités. Cette lecture est un exemple du cours ; le texte allemand original précise la méthode de calcul.</p>
<div class="lab">Conséquence</div><p>Un diabète longtemps non diagnostiqué peut déjà avoir accumulé de l’exposition : des complications au diagnostic ne signifient pas un diabète récent.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM, lignes directrices aptitude à la conduite, août 2025</a>.</p></template>
<template data-pop="e14-cibles" data-title="Cibles glycémiques selon le patient (SSED 2023)">
<table class="t"><thead><tr><th>Patient</th><th>Cible d’HbA1c</th></tr></thead><tbody><tr><td>Cas général</td><td>Environ 7,0 %</td></tr><tr><td>Sujet jeune à diabète récent, ou avec complications microvasculaires, sans hypoglycémie</td><td>6,5 %</td></tr><tr><td>Sujet âgé, antécédent d’hypoglycémie sévère, comorbidités, espérance de vie limitée</td><td>7 à 8 %</td></tr><tr><td>Sujet âgé sans insuline ni sulfonylurée</td><td>6,5 à 7,0 %</td></tr><tr><td>Sujet âgé avec insuline ou sulfonylurée</td><td>Moins de 8,0 %</td></tr></tbody></table>
<div class="lab">Autres repères</div><p>Toujours éviter une HbA1c supérieure à 8,0 %. Glycémie préprandiale inférieure à 7 mmol/L, postprandiale inférieure à 10 mmol/L. Temps dans la cible de 3,9 à 10 mmol/L d’au moins 70 %.</p>
<div class="lab">Score de la mesure continue du glucose (lignes directrices 2025)</div><p>HbA1c, coefficient de variation inférieur à 36 %, temps sous 3,0 mmol/L inférieur à 1 %, temps dans la cible supérieur à 70 %.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM, lignes directrices aptitude à la conduite, août 2025</a>.</p></template>
<template data-pop="e14-insuline" data-title="Quand débuter l’insuline d’emblée">
<div class="lab">Situations (SSED 2023)</div><p>HbA1c supérieure à 10 % ; perte de poids ; cétonurie ou cétose ; déséquilibre aigu (hospitalisation, chirurgie, maladie aiguë) ; poids normal ou bas ; suspicion de type 1. Dans ces cas, débuter l’insuline « n’est jamais une erreur ».</p>
<div class="lab">Pourquoi</div><p>Ces situations traduisent une insulinodéficience (carence de sécrétion) ou un besoin aigu que les antidiabétiques non insuliniques ne couvrent pas rapidement.</p>
<div class="lab">Suite</div><p>Dans le type 2, l’insuline peut parfois être arrêtée après retour à l’euglycémie. En insulinodéficience, l’insuline vient avant les protecteurs cardio-rénaux. L’insuline co-formulée aux repas principaux donne la même HbA1c que le basal-bolus avec moins d’hypoglycémies.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM, lignes directrices aptitude à la conduite, août 2025</a>.</p></template>
<template data-pop="e14-grossesse" data-title="Diabète et grossesse : seuils et codage">
<div class="lab">Diabète préexistant</div><p>HbA1c ≥ 6,5 %, glycémie à jeun ≥ 7,0 mmol/L ou glycémie à 2 heures ≥ 11,1 mmol/L dès le premier contrôle : diabète préexistant, codé O24.-.</p>
<div class="lab">Diabète gestationnel</div><p>Charge de 75 g à 24–28 semaines d’aménorrhée : à jeun ≥ 5,1 ; 1 heure ≥ 10,0 ; 2 heures ≥ 8,5 mmol/L. L’HbA1c est inadaptée à ce diagnostic.</p>
<div class="lab">Conséquence</div><p>Dans les deux cas, le diagnostic sort de la catégorie E14 (exclusion O24.-).</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM, lignes directrices aptitude à la conduite, août 2025</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E14" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E14</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024, catégorie E14</a>.</p></template>
<template data-pop="e14-conduite" data-title="Aptitude à la conduite">
<div class="lab">Principe</div><p>Le groupe 1 (catégories A, B, etc.) exige un équilibre stable sans hypoglycémie ni hyperglycémie dangereuse ; le groupe 2 (C, D, etc.) est restreint, avec exceptions par un médecin du trafic de niveau 4.</p>
<div class="lab">Hypoglycémie</div><p>L’altération de la conduite est mesurable surtout si la glycémie veineuse reste inférieure à 2,5 mmol/L plus de 15 minutes, plus faible à 3,0–3,5 mmol/L, et peu probable au-dessus de 3,9 mmol/L stable. Si la glycémie est inférieure à 4,0 mmol/L : s’arrêter, retirer la clé, passer côté passager, corriger par glucides rapides, attendre 45 minutes.</p>
<div class="lab">Rôle du médecin</div><p>Le médecin a le <b>droit</b>, non l’obligation, de signaler un doute sur l’aptitude (article 15d, alinéa 3, de la loi fédérale sur la circulation routière) et le <b>devoir d’informer</b> le patient.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM, lignes directrices aptitude à la conduite, août 2025</a>.</p></template>
<template data-pop="e14-decompense" data-title="« Désigné comme décompensé » dans le manuel de codage suisse">
<div class="lab">Règle</div><p>Le cinquième caractère se juge sur l’<b>ensemble du séjour</b> (évaluation rétrospective). La glycémie d’admission n’est pas un critère. Le terme désigne l’état métabolique.</p>
<div class="lab">Critères discutés avec la SSED</div><p>Hypoglycémies récidivantes < 3 mmol/L symptomatiques avec 3 contrôles par jour et adaptation du traitement ; ou variations ≥ 5 mmol/L avec 3 contrôles par jour et adaptation ; ou HbA1c > 9 % pendant 3 mois avec 3 contrôles par jour ; et/ou valeurs > 15 mmol/L au moins 3 fois avec adaptation ; ou valeurs < 15 mais gestion lourde (plus de 3 contrôles par jour pendant plusieurs jours, nouvelle injection documentée).</p>
<div class="lab">Limite</div><p>Il s’agit de règles de codage hospitalier, non d’un critère clinique ; les règles 2024 ont été confirmées par le manuel 2025.</p>
<p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/27985670/master" target="_blank" rel="noopener">OFS, Manuel de codage médical 2024</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32326843/master" target="_blank" rel="noopener">OFS, Manuel de codage médical 2025</a>.</p></template>
<template data-pop="e14-daguetoile" data-title="Système dague-étoile du diabète">
<div class="lab">Principe</div><p>Une manifestation d’organe peut recevoir un code étoile (*) associé au code du diabète. Pour l’hospitalisation causée par une complication, le quatrième caractère de la manifestation est utilisé avec le code étoile.</p>
<table class="t"><thead><tr><th>Code étoile</th><th>Organe concerné (libellé usuel de la CIM-10)</th></tr></thead><tbody><tr><td>N08.3*</td><td>Rein : glomérulopathie diabétique</td></tr><tr><td>H36.0*</td><td>Rétine : rétinopathie diabétique</td></tr><tr><td>H28.0*</td><td>Cristallin : cataracte diabétique</td></tr><tr><td>G63.2*</td><td>Nerfs : polyneuropathie diabétique</td></tr><tr><td>G59.0*</td><td>Nerf : mononeuropathie diabétique</td></tr><tr><td>I79.2*</td><td>Vaisseaux : angiopathie périphérique</td></tr></tbody></table>
<div class="lab">Pied diabétique</div><p>E14.74 ou E14.75 avec G63.2* et I79.2*.</p>
<div class="lab">Limite</div><p>Les libellés des codes étoiles viennent de la CIM-10 usuelle ; le dossier du cours cite les codes sans les développer.</p>
<p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/27985670/master" target="_blank" rel="noopener">OFS, Manuel de codage médical 2024</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E14" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E14</a>.</p></template>
<template data-pop="e14-rein" data-title="Maladie rénale diabétique : dépistage et avis spécialisé">
<div class="lab">Dépistage</div><p>Au moins une fois par an chez tout adulte diabétique : créatinine plasmatique (ou cystatine C) et rapport albumine/créatinine urinaire. Bandelette puis sédiment si le débit est inférieur à 60 ou le rapport supérieur à 3 mg/mmol.</p>
<div class="lab">Définition</div><p>Maladie rénale chronique : débit estimé < 60 et/ou rapport > 3 mg/mmol pendant au moins 3 mois. Classes d’albuminurie : A1 < 3, A2 de 3 à 29, A3 ≥ 30 mg/mmol. Environ 40 % des diabétiques de type 2 développeront une maladie rénale.</p>
<div class="lab">Drapeaux rouges pour un avis néphrologique</div><p>Hématurie persistante ; baisse du débit > 5 mL/min par an ; albuminurie A3 rapidement croissante ; débit trop bas pour l’âge (< 75 avant 40 ans, < 60 de 40 à 65 ans, < 45 mL/min après 65 ans) ; syndrome néphrotique ; histoire familiale ; hypertension résistante ; baisse du débit > 30 % après un bloqueur du système rénine-angiotensine.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">SSED et Société suisse de néphrologie, maladie rénale diabétique, 2024</a>.</p></template>
<template data-pop="e14-coeur" data-title="Dépister l’insuffisance cardiaque chez le diabétique">
<div class="lab">Fréquence</div><p>Jusqu’à 30 % des diabétiques de plus de 65 ans (consensus suisse 2024).</p>
<div class="lab">Démarche</div><p>Pas de dépistage systématique. En cas de suspicion clinique et d’électrocardiogramme anormal : NT-proBNP > 125 pg/mL ou BNP > 35 pg/mL, puis échocardiographie.</p>
<div class="lab">Limite</div><p>Seul le résumé du consensus a été lu ; les seuils viennent du texte des recommandations de la SSED.</p>
<p class="src">Références : <a href="https://doi.org/10.57187/s.4000" target="_blank" rel="noopener">SSED et Société suisse de cardiologie, identification précoce de l’insuffisance cardiaque, 2024</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a>.</p></template>
<template data-pop="e14-esc" data-title="Recommandations cardiovasculaires européennes (ESC 2023)">
<div class="lab">Principes lus</div><p>Dépistage systématique du diabète chez tout patient cardiovasculaire. Agonistes du GLP-1 et/ou inhibiteurs du SGLT2 pour réduire le risque cardiovasculaire en cas de maladie athéroscléreuse, indépendamment du contrôle glycémique ; inhibiteurs du SGLT2 dans l’insuffisance cardiaque chronique quelle que soit la fraction d’éjection ; inhibiteurs du SGLT2 et/ou finérénone dans la maladie rénale chronique ; SCORE2-Diabetes pour le risque à 10 ans du type 2 sans maladie cardiovasculaire établie.</p>
<div class="lab">Limite</div><p>Seule l’introduction du texte a été lue : les classes de recommandation et les cibles chiffrées ne sont pas reprises. Les recommandations ESC de 2026 n’ont pas été consultées pour ce sujet.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehad192" target="_blank" rel="noopener">ESC, maladies cardiovasculaires et diabète, 2023</a>.</p></template>
<template data-pop="e14-metformine" data-title="Metformine (Glucophage®, information professionnelle suisse)">
<div class="lab">Indication</div><p>Diabète de type 2 ; en complément de l’insuline dans le type 1 avec insulinorésistance.</p>
<div class="lab">Contre-indications</div><p>Acidose métabolique (dont l’acidocétose) ; coma et précoma diabétiques ; débit estimé inférieur à 30 mL/min ; affections aiguës à risque rénal ou hypoxique ; insuffisance hépatique ; alcoolisme.</p>
<div class="lab">Posologie selon la fonction rénale</div><p>Débit de 30 à 44 mL/min : maximum 1000 mg/jour, contrôle de la fonction rénale au moins tous les 3 mois. Chez le sujet âgé avec nausées, dose réduite à 1000 mg/jour (SSED 2023).</p>
<div class="lab">Précautions</div><p>Produits de contraste iodés : arrêt 48 heures avant si le débit est inférieur à 60 mL/min. Vitamine B12 annuelle, surtout en cas d’anémie ou de neuropathie. Insuline à envisager en chirurgie ou en décompensation. Pas d’hypoglycémie en monothérapie.</p>
<div class="lab">Limite</div><p>Seuls l’indication, la posologie selon la fonction rénale, les contre-indications et les mises en garde ont été lus (mise à jour d’octobre 2025). Le mécanisme d’action et les essais ne figurent pas dans le dossier.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">Swissmedic, information professionnelle Glucophage®</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a>.</p></template>
<template data-pop="e14-baqsimi" data-title="Glucagon nasal (Baqsimi®, information professionnelle suisse)">
<div class="lab">Indication</div><p>Hypoglycémies sévères du diabétique dès l’âge de 1 an.</p>
<div class="lab">Posologie</div><p>Dose unique de 3 mg par voie intranasale ; pas d’adaptation hépatique, rénale ou liée à l’âge.</p>
<div class="lab">Place</div><p>La SSED recommande sa prescription sous schéma basal-bolus.</p>
<div class="lab">Limite</div><p>Seules l’indication et la posologie ont été lues (mise à jour de mars 2026) ; contre-indications et effets indésirables sont à relire dans l’information professionnelle.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Swissmedic, information professionnelle Baqsimi®</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a>.</p></template>
<template data-pop="e14-insulineiv" data-title="Insuline intraveineuse dans les crises hyperglycémiques">
<div class="lab">Doses (consensus 2024)</div><p>Acidocétose : 0,1 unité/kg/heure à débit fixe, réduite à 0,05 quand la glycémie descend sous 13,9 mmol/L avec glucose 5–10 %. État hyperosmolaire sans cétose, ou avec cétonémie de 1,0 à moins de 3,0 mmol/L et sans acidose : 0,05 ; forme mixte : 0,1.</p>
<div class="lab">Précautions</div><p>Retarder l’insuline si la kaliémie est inférieure à 3,5 mmol/L. Contrôler la kaliémie 2 heures après le début, puis toutes les 4 heures. Surveiller l’hypoglycémie (16–28 %).</p>
<div class="lab">Relais</div><p>Chevauchement de 1 à 2 heures avec l’insuline sous-cutanée.</p>
<div class="lab">Limite</div><p>Aucune information professionnelle d’insuline n’a été lue dans ce cours.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a> ; <a href="https://doi.org/10.1111/dme.15005" target="_blank" rel="noopener">JBDS, état hyperglycémique hyperosmolaire, 2022</a>.</p></template>
<template data-pop="e14-sglt2" data-title="Inhibiteurs du SGLT2 : repères du cours">
<div class="lab">Indications lues</div><p>Type 2 d’emblée avec la metformine (SSED 2023) ; maladie rénale chronique indépendamment de la glycémie (ne pas débuter sous un débit de 30 mais poursuivre) ; insuffisance cardiaque chronique quelle que soit la fraction d’éjection (ESC 2023).</p>
<div class="lab">Risque</div><p>Acidocétose euglycémique : arrêt à l’admission en cas d’acidocétose ; reprise après résolution non recommandée en routine dans le type 2 faute de données.</p>
<div class="lab">Limite</div><p>Aucune information professionnelle n’a été lue : posologies, contre-indications et mécanisme sont à vérifier pour le produit prescrit.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a> ; <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a> ; <a href="https://doi.org/10.1093/eurheartj/ehad192" target="_blank" rel="noopener">ESC, maladies cardiovasculaires et diabète, 2023</a>.</p></template>
<template data-pop="e14-glp1" data-title="Agonistes du récepteur du GLP-1 : repères du cours">
<div class="lab">Place</div><p>Association d’emblée avec la metformine dans le type 2 (SSED 2023) ; réduction du risque cardiovasculaire en cas de maladie athéroscléreuse, indépendamment du contrôle glycémique (ESC 2023).</p>
<div class="lab">Remboursement et précautions</div><p>Remboursement si l’indice de masse corporelle dépasse 28 kg/m² ; à éviter chez le sujet âgé en cas d’anorexie.</p>
<div class="lab">Limite</div><p>Aucune information professionnelle n’a été lue : posologies et contre-indications sont à vérifier.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a> ; <a href="https://doi.org/10.1093/eurheartj/ehad192" target="_blank" rel="noopener">ESC, maladies cardiovasculaires et diabète, 2023</a>.</p></template>
<template data-pop="e14-hypo" data-title="Hypoglycémie : grades, conduite et glucagon">
<div class="lab">Grades</div><p>Grade 1 : glycémie < 3,9 mmol/L ; grade 2 : < 3,0 ; grade 3 : aide d’un tiers ou perte de connaissance. Le coma hypoglycémique est inclus dans E14.0 par l’OMS.</p>
<div class="lab">Population à risque</div><p>L’hypoglycémie du diabétique ne survient que sous insuline ou sulfonylurées et glinides.</p>
<div class="lab">Conduite</div><p>Glucides rapides si la personne est consciente ; en cas d’hypoglycémie sévère, glucagon nasal 3 mg (<button class="w" data-k="e14-baqsimi">information professionnelle</button>).</p>
<div class="lab">Prévention</div><p>L’insuline co-formulée aux repas principaux réduit les hypoglycémies par rapport au basal-bolus à HbA1c égale ; l’association insuline plus sulfonylurée est à éviter.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM, lignes directrices aptitude à la conduite, août 2025</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E14" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E14</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a>.</p></template>
<template data-pop="e14-potassium" data-title="Potassium dans l’acidocétose">
<div class="lab">Mécanisme</div><p>Déficit corporel total de 3 à 6 mmol/kg (diurèse osmotique, vomissements, hyperaldostéronisme). L’acidose et la carence en insuline font sortir le potassium des cellules : la kaliémie initiale est souvent normale ou élevée. L’insuline, la correction de l’acidose et la réhydratation la font chuter.</p>
<div class="lab">Conduite</div><p>Si la kaliémie est inférieure à 3,5 mmol/L (5 à 10 % des cas) : potassium 10 mmol/heure et retard de l’insuline jusqu’à une kaliémie supérieure à 3,5. Contrôles 2 heures après le début de l’insuline, puis toutes les 4 heures.</p>
<div class="lab">Danger</div><p>Une hypokaliémie ≤ 2,5 mmol/L multiplie la mortalité par 3.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus sur les crises hyperglycémiques de l’adulte, 2024</a>.</p></template>
<template data-pop="e14-peptidec" data-title="Peptide C : prélèvements, moment et interprétation">
<div class="lab">Principe</div><p>Le peptide C est sécrété en quantité équimolaire à l’insuline. C’est la meilleure mesure de la sécrétion endogène d’insuline chez le diabétique ; il se dose aussi chez un patient traité par insuline injectée.</p>
<div class="lab">Prélèvements</div><p>Sang, à jeun ou après stimulation (souvent par glucagon intraveineux), ou urine (rapport peptide C/créatinine sur échantillon). Il est plus stable que supposé, ce qui facilite l’analyse.</p>
<div class="lab">Moment</div><p>Utilité maximale 3 à 5 ans après le diagnostic : une sécrétion conservée oriente vers un type 2 ou une forme monogénique. Un peptide C absent à tout moment signe un besoin absolu d’insuline.</p>
<div class="lab">Repère suisse</div><p>SSED 2023 : peptide C entre 200 et 600 pmol/L, anticorps négatifs, pas de forte histoire familiale : insulinodéficience ; un type 1 débutant reste possible ; répéter le dosage 3 ans plus tard.</p>
<div class="lab">Limite</div><p>Revue narrative britannique de 2013 ; les seuils suisses viennent de la SSED.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/dme.12159" target="_blank" rel="noopener">Jones et Hattersley, peptide C, 2013</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED, recommandations pour le diabète de type 2, 2023</a>.</p></template>
