<template data-pop="e59-absorption" data-title="Absorption, stock et élimination du sélénium"><h3>Ce que les sources établissent</h3><p>L’absorption du sélénium est de 56 % à 81 % selon les études isotopiques. Pour les aliments, elle atteint 70 % à 80 %, surtout au duodénum, et elle ne dépend ni de la dose ni du statut de la personne. Le sélénite de la préparation médicamenteuse est absorbé de 44 % à 89 %. Le stock corporel total est de 4 à 20 mg.</p><h3>Élimination</h3><p>L’élimination est urinaire et fécale, sous forme de triméthylsélénonium notamment, et pulmonaire à forte dose. L’urine élimine de 40 % à 60 % de l’apport. La demi-vie terminale par voie orale est de 96 à 144 jours.</p><h3>Conséquences pratiques</h3><p>Une absorption élevée et indépendante du statut signifie que la voie orale suffit si le tube digestif fonctionne : c’est la raison pour laquelle l’ESPEN la préfère à la voie intraveineuse. L’élimination surtout urinaire explique la prudence en insuffisance rénale lorsque les doses sont répétées.</p><h3>Limites</h3><p>Les fourchettes viennent de méthodes différentes (isotopes, bilans, information professionnelle) ; elles ne se comparent pas terme à terme.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-anorexie" data-title="Anorexie mentale et sélénium"><h3>Le fait</h3><p>Une cohorte de 349 enfants et adolescents atteints d’anorexie mentale, suivis à Lyon avec un centre lausannois, rapporte une carence en sélénium chez 23,5 % d’entre eux (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13536237/" target="_blank" rel="noopener">Iordan et al., Int J Eat Disord 2026</a>).</p><h3>Interprétation</h3><p>Un apport alimentaire réduit explique le déficit : l’anorexie est donc un facteur de risque d’apport insuffisant, au même titre que le régime végétalien non supplémenté. Le résultat invite à doser le sélénium chez l’enfant dénutri qui présente des signes évocateurs.</p><h3>Limites</h3><p>Seul le résumé de l’article a été lu ; le seuil retenu pour définir la carence n’a pas été relu. Le chiffre de 23,5 % ne s’applique donc qu’avec cette réserve, et il ne documente ni symptôme ni conséquence clinique.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13536237/" target="_blank" rel="noopener">Iordan et al., Int J Eat Disord 2026</a>.</p></template>
<template data-pop="e59-bariatrie" data-title="Chirurgie bariatrique et sélénium"><h3>Ce que disent les sources</h3><p>Des cas de cardiomyopathie et de myopathie par carence en sélénium après chirurgie bariatrique ont été rapportés (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>). Un compte rendu suisse de médecine interne (Kantonsspital Aarau, 2024) indique qu’en pratique la carence est rare, surtout avec des anastomoses très distales. Il préconise des contrôles à vie, avec un suivi en centre pendant les cinq premières années (<a href="https://rosenfluh.ch/ernaehrungsmedizin-2024-04/mikronaehrstoffe-gewichtszunahme-postoperative-komplikationen-lebenslange-kontrollen-nach-bariatrie" target="_blank" rel="noopener">Baumgartner et Schütz, Schweizer Zeitschrift für Ernährungsmedizin 2024</a>).</p><h3>Limites</h3><p>Le compte rendu ne donne aucune fréquence chiffrée pour le sélénium ; il a été lu par une extraction automatique, non en texte intégral. La rareté de la carence ne justifie donc pas de l’ignorer dans un suivi à vie : le sélénium s’inscrit parmi les micronutriments à surveiller en cas de signe cardiaque ou musculaire.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://rosenfluh.ch/ernaehrungsmedizin-2024-04/mikronaehrstoffe-gewichtszunahme-postoperative-komplikationen-lebenslange-kontrollen-nach-bariatrie" target="_blank" rel="noopener">Baumgartner et Schütz, Schweizer Zeitschrift für Ernährungsmedizin 2024</a>.</p></template>
<template data-pop="e59-biopsie" data-title="Biopsie myocardique : lésions élémentaires"><h3>Indication</h3><p>La biopsie myocardique n’est pas un examen de routine. Elle se discute dans des cas sélectionnés, par exemple pour écarter une myocardite ou une cardiomyopathie infiltrative devant une cardiomyopathie non élucidée (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>).</p><h3>Lésions décrites</h3><p>Dans le cas publié, l’histologie ressemble à celle d’une cardiomyopathie dilatée : myofibrillolyse (dissolution des myofibrilles), vacuolisation cytoplasmique, perte de sarcomères et apoptose accrue. Dans la maladie de Keshan, les lésions sont une nécrose myocardique, des calcifications et une fibrose (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8509311/" target="_blank" rel="noopener">Shimada et al., Int J Mol Sci 2021</a>).</p><h3>Piège</h3><p>Ces lésions ne sont pas spécifiques de la carence : elles se rapprochent d’autres cardiomyopathies. Le contexte et le sélénium plasmatique restent indispensables. L’intérêt pronostique est notable : une récupération complète est possible malgré une dégénérescence histologique.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8509311/" target="_blank" rel="noopener">Shimada et al., Int J Mol Sci 2021</a>.</p></template>
<template data-pop="e59-biostat" data-title="Insuffisance cardiaque aggravée : cohorte européenne"><h3>L’étude</h3><p>Une cohorte européenne de 2382 patients en insuffisance cardiaque aggravée a mesuré le sélénium sérique. La carence est définie à moins de 70 µg/L, dans un intervalle de référence de 70 à 130 µg/L. Elle concerne 20,4 % des patients, plus âgés, plus souvent des femmes, en classe fonctionnelle plus élevée de la New York Heart Association (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a>).</p><h3>Pronostic</h3><p>Un sélénium inférieur à 70 µg/L est associé à un risque accru du critère composite (rapport de risque 1,23) et de mortalité (rapport de risque 1,52). Les patients concernés ont aussi une distance de marche de six minutes plus courte et une moindre qualité de vie.</p><h3>Limites</h3><p>L’étude est observationnelle : elle établit une association, non une causalité. Un patient plus gravement atteint peut avoir un sélénium plus bas pour des raisons nutritionnelles ou inflammatoires. Ce résultat ne démontre pas qu’une supplémentation améliore le pronostic ; il justifie seulement d’y penser. Le seuil de 70 µg/L est propre à l’étude et diffère du seuil ESPEN de 60 µg/L.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a>.</p></template>
<template data-pop="e59-brulures" data-title="Brûlures et pertes digestives"><h3>Mécanisme</h3><p>Les brûlures font perdre du sélénium par les exsudats. Les fistules et la diarrhée augmentent l’élimination digestive (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://www.rosenfluh.ch/media/ernaehrungsmedizin/2022/05/Neue-ESPEN-Guidelines-fuer-Mikronaehrstoffe.pdf" target="_blank" rel="noopener">Berger, exposé sur les lignes directrices ESPEN, Schweizer Zeitschrift für Ernährungsmedizin 2022</a>).</p><h3>Conséquence pour la dose</h3><p>Les besoins augmentent : environ 375 µg/jour par voie intraveineuse chez le brûlé selon le tableau ESPEN, environ 275 µg/jour après un traumatisme majeur ou une chirurgie cardiaque, et jusqu’à 300 µg/jour supplémentaires selon des études de bilan. Ces doses dépassent la limite supérieure d’apport tolérable de la population générale (255 µg/jour) ; elles se justifient par des pertes mesurées, non par un projet de prévention.</p><h3>Voie d’administration</h3><p>La notice de selenase® recommande la voie parentérale en cas de vomissements ou de diarrhées graves, vraisemblablement parce que l’absorption orale n’est plus assurée (déduction du rédacteur) (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026)).</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://www.rosenfluh.ch/media/ernaehrungsmedizin/2022/05/Neue-ESPEN-Guidelines-fuer-Mikronaehrstoffe.pdf" target="_blank" rel="noopener">Berger, exposé sur les lignes directrices ESPEN, Schweizer Zeitschrift für Ernährungsmedizin 2022</a> ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9854220/" target="_blank" rel="noopener">EFSA, limite supérieure d’apport tolérable en sélénium, 2023</a>.</p></template>
<template data-pop="e59-cardiomyopathie" data-title="Cardiomyopathie par carence en sélénium : mécanisme"><h3>Mécanisme causal</h3><p>Le déficit en sélénium diminue l’activité des glutathion peroxydases. Les espèces réactives de l’oxygène s’accumulent alors dans les cardiomyocytes et provoquent apoptose et nécrose. Le cœur dispose de peu de catalase et dépend surtout de ces enzymes. Dans des cardiomyocytes humains privés de sélénium, la fonction mitochondriale et la phosphorylation oxydative s’altèrent (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a>).</p><h3>Présentation</h3><p>Le tableau associe une insuffisance cardiaque, une fraction d’éjection abaissée, un allongement de l’intervalle QT corrigé et une histologie évoquant une cardiomyopathie dilatée. La carence n’est pas citée dans les recommandations ESC 2021 sur l’insuffisance cardiaque, selon les auteurs du cas publié.</p><h3>Réversibilité</h3><p>Le pronostic est favorable si le sélénium est corrigé : le seuil d’irréversibilité est inconnu et une récupération complète a été observée malgré une dégénérescence histologique.</p><h3>Limites</h3><p>La majorité des données sont des cas rapportés ou des revues narratives. Le mécanisme de l’allongement de l’intervalle QT corrigé est une hypothèse des auteurs.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8509311/" target="_blank" rel="noopener">Shimada et al., Int J Mol Sci 2021</a>.</p></template>
<template data-pop="e59-cas-publie" data-title="Le cas publié : de la présentation à la récupération"><h3>Le patient</h3><p>Un patient japonais atteint de maladie de Crohn et traité par hémodialyse présente une insuffisance cardiaque (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>). Il cumule deux facteurs de risque : une maladie digestive inflammatoire et une épuration extrarénale.</p><h3>Les constats</h3><table class="t"><tr><th>Élément</th><th>Valeur ou observation</th></tr><tr><td>Examen des ongles</td><td>Leuconychie, disparue après traitement</td></tr><tr><td>Électrocardiogramme</td><td>Intervalle QT corrigé de 594 ms, ondes T négatives</td></tr><tr><td>Fraction d’éjection du ventricule gauche</td><td>29,2 %, puis 43,3 % après une semaine, puis 50 % à trois mois</td></tr><tr><td>Peptide natriurétique de type B</td><td>963, puis 332, puis 174 pg/mL</td></tr><tr><td>Biopsie myocardique</td><td>Myofibrillolyse, vacuolisation cytoplasmique, perte de sarcomères</td></tr><tr><td>Traitement</td><td>Sélénium, 100 µg/jour par voie intraveineuse</td></tr></table><p>Le tableau montre qu’une correction modeste (100 µg/jour) a suffi à une amélioration en une semaine et à une récupération à trois mois.</p><h3>Limites</h3><p>C’est un cas unique : il suggère une causalité sans la prouver. L’article mentionne une « plage normale inférieure à 10,0 µg/dL » probablement erronée ; cette valeur ne doit pas servir de seuil.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>.</p></template>
<template data-pop="e59-conversion" data-title="Conversion des unités du sélénium"><h3>Les facteurs</h3><p>1 µg/L correspond à 0,01266 µmol/L, et 1 µmol/L à 79 µg/L (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>). Le nanogramme par millilitre est numériquement identique au microgramme par litre.</p><h3>Exemples</h3><table class="t"><tr><th>Valeur en micromoles par litre</th><th>Valeur en microgrammes par litre (calcul du rédacteur)</th></tr><tr><td>0,30</td><td>environ 24</td></tr><tr><td>0,4</td><td>environ 32 (31,6)</td></tr><tr><td>0,75</td><td>environ 59 à 60</td></tr><tr><td>1,20</td><td>environ 95</td></tr></table><h3>Piège</h3><p>Le laboratoire peut rendre le résultat dans l’une des deux unités. Avant d’appliquer un seuil, on vérifie l’unité du rapport, puis on convertit. L’ESPEN arrondit 0,75 µmol/L à 60 µg/L.</p><p class="src">Référence : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>.</p></template>
<template data-pop="e59-cretinisme" data-title="Crétinisme myxœdémateux endémique (E00.1)"><h3>Définition</h3><p>La carence combinée en iode et en sélénium produit le crétinisme myxœdémateux endémique, observé en Afrique centrale (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>). La CIM-10-GM 2024 le classe sous E00.1, « Syndrome d’insuffisance thyroïdienne congénitale de type myxœdémateux », hors de E59 (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>).</p><h3>Mécanisme</h3><p>Le sélénium intervient dans le métabolisme des hormones thyroïdiennes par la désiodase de type 1, qui transforme la thyroxine en triiodothyronine. Un déficit en sélénium s’ajoute au déficit en iode, ce qui aggrave l’atteinte.</p><h3>Limite</h3><p>Le dossier ne détaille pas les données cliniques de ce syndrome ; il le cite comme diagnostic voisin.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>.</p></template>
<template data-pop="e59-crp-albumine" data-title="CRP et albumine : pourquoi doser en même temps"><h3>La recommandation</h3><p>L’ESPEN recommande de mesurer la CRP, et l’albumine, en même temps que le sélénium (recommandation 12.2, grade A) (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><h3>Le mécanisme</h3><p>L’inflammation redistribue le sélénium hors du compartiment circulant. La sélénoprotéine P, de poids moléculaire voisin de celui de l’albumine, baisse comme elle. La baisse du dosage ne signifie donc pas une perte de stock.</p><h3>Les chiffres</h3><table class="t"><tr><th>CRP</th><th>Baisse attendue du sélénium</th></tr><tr><td>10 à 40 mg/L</td><td>15 à 25 %</td></tr><tr><td>41 à 80 mg/L</td><td>environ 35 %</td></tr><tr><td>Plus de 80 mg/L</td><td>environ 50 %</td></tr></table><h3>Piège</h3><p>Dès que la CRP dépasse 40 mg/L, il ne reste presque plus de valeurs normales. Un sélénium bas sans CRP ne permet aucune conclusion.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://www.rosenfluh.ch/media/ernaehrungsmedizin/2022/05/Neue-ESPEN-Guidelines-fuer-Mikronaehrstoffe.pdf" target="_blank" rel="noopener">Berger, exposé sur les lignes directrices ESPEN, Schweizer Zeitschrift für Ernährungsmedizin 2022</a>.</p></template>
<template data-pop="e59-def-deplet" data-title="Déplétion et carence : définitions de l’ESPEN"><h3>Les deux termes</h3><p>La <b>déplétion</b> est la perte objectivable d’un micronutriment dans les liquides de l’organisme, ou un apport inférieur aux recommandations, avec une concentration sanguine ou plasmatique sous la valeur de référence. La <b>carence</b> est la même perte ou le même apport insuffisant, associé à des signes ou des symptômes explicables par le déficit, ou à une concentration sous la référence avec effets métaboliques défavorables (<a href="https://www.rosenfluh.ch/media/ernaehrungsmedizin/2022/05/Neue-ESPEN-Guidelines-fuer-Mikronaehrstoffe.pdf" target="_blank" rel="noopener">Berger, exposé sur les lignes directrices ESPEN, Schweizer Zeitschrift für Ernährungsmedizin 2022</a>).</p><h3>Conséquence pratique</h3><p>Un sélénium à 0,60 µmol/L sans CRP élevée et sans signe clinique est une déplétion : on le corrige (recommandation 12.6) mais on n’annonce pas une carence clinique. La notice suisse de la préparation injectable précise qu’il n’est pas prouvé que les symptômes de carence extrême apparaissent lors d’un apport seulement sous-optimal (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026)).</p><h3>Limite</h3><p>Le texte de référence est un compte rendu suisse d’un exposé de congrès sur les lignes directrices ESPEN 2022 ; la terminologie figure dans les lignes directrices elles-mêmes (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><p class="src">Références : <a href="https://www.rosenfluh.ch/media/ernaehrungsmedizin/2022/05/Neue-ESPEN-Guidelines-fuer-Mikronaehrstoffe.pdf" target="_blank" rel="noopener">Berger, exposé sur les lignes directrices ESPEN, Schweizer Zeitschrift für Ernährungsmedizin 2022</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-desiodase" data-title="Iodothyronine 5’-désiodase de type 1"><h3>Fonction</h3><p>Cette sélénoenzyme convertit la thyroxine (T4) en triiodothyronine (T3), forme active de l’hormone (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026)).</p><h3>Lien avec la clinique</h3><p>Un statut en sélénium bas est associé épidémiologiquement à la thyroïdite auto-immune, à la maladie de Basedow et au goitre (<a href="https://doi.org/10.1038/s41574-019-0311-6" target="_blank" rel="noopener">Winther et al., Nat Rev Endocrinol 2020</a>). La carence combinée en iode et en sélénium provoque le crétinisme myxœdémateux endémique (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><h3>Limite</h3><p>Il s’agit d’associations épidémiologiques. Les sources lues ne démontrent pas qu’une supplémentation améliore ces maladies hors de l’orbitopathie légère et de la baisse des anticorps.</p><p class="src">Références : information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://doi.org/10.1038/s41574-019-0311-6" target="_blank" rel="noopener">Winther et al., Nat Rev Endocrinol 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>.</p></template>
<template data-pop="e59-dialyse" data-title="Hémodialyse et épuration extrarénale"><h3>Mécanisme</h3><p>L’hémodialyse et l’épuration extrarénale continue augmentent les pertes de sélénium et le stress oxydatif (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>).</p><h3>Conséquences</h3><p>Les besoins en sélénium augmentent lors de l’épuration extrarénale. Le patient du cas publié était hémodialysé ; sa carence s’est compliquée d’une cardiomyopathie. Pour les oligo-éléments administrés par voie intraveineuse, la dose doit être adaptée à l’insuffisance rénale car l’excrétion diminue (information professionnelle suisse Nutryelt (Swissmedic, mise à jour novembre 2019, via AIPS, consultée le 15.10.2026)).</p><h3>Piège</h3><p>Deux raisons contraires coexistent : les pertes dialytiques augmentent les besoins, l’insuffisance rénale diminue l’excrétion. La dose ne se déduit pas d’un seul des deux mécanismes ; le sélénium plasmatique, lu avec la CRP, guide l’ajustement.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> ; information professionnelle suisse Nutryelt (Swissmedic, mise à jour novembre 2019, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-gpx" data-title="Glutathion peroxydases"><h3>Fonction</h3><p>Les glutathion peroxydases sont des sélénoenzymes. En présence de glutathion réduit, elles convertissent les hydroperoxydes en alcools, et l’intégrité des membranes cellulaires en dépend. Elles forment la première ligne de défense antioxydante, à l’intérieur et à l’extérieur des cellules (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><h3>Deux formes utiles</h3><p>La glutathion peroxydase de type 1 est érythrocytaire ; celle de type 3 est plasmatique et représente environ 20 % du sélénium plasmatique. Leur activité sert de marqueur fonctionnel du statut.</p><h3>Conséquence clinique</h3><p>Quand l’activité baisse, les espèces réactives de l’oxygène s’accumulent. Le cœur, peu pourvu en catalase, en dépend particulièrement (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>). L’activité de la glutathion peroxydase plasmatique atteint un plateau vers 0,75 µmol/L de sélénium plasmatique : c’est la justification du seuil de 0,75 µmol/L.</p><p class="src">Références : information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>.</p></template>
<template data-pop="e59-gradation" data-title="Seuils de supplémentation et grades ESPEN"><h3>Les recommandations</h3><table class="t"><tr><th>Recommandation</th><th>Contenu</th><th>Niveau</th></tr><tr><td>12.1</td><td>Sélénium et CRP au début de la nutrition parentérale prolongée, puis au moins tous les 3 à 6 mois</td><td>Grade B, consensus 92 %</td></tr><tr><td>12.2</td><td>Doser la CRP avec le sélénium</td><td>Grade A</td></tr><tr><td>12.3</td><td>Nutrition entérale : 50 à 150 µg pour 1500 kcal</td><td>Grade B</td></tr><tr><td>12.4</td><td>Nutrition parentérale : 60 à 100 µg/jour</td><td>Grade B</td></tr><tr><td>12.5</td><td>Sélénium inférieur à 0,4 µmol/L : au moins 100 µg/jour</td><td>Point de bonne pratique, consensus 100 %</td></tr><tr><td>12.6</td><td>Sélénium inférieur à 0,75 µmol/L avec CRP inférieure à 20 mg/L : supplémenter</td><td>Point de bonne pratique, consensus 100 %</td></tr><tr><td>12.7</td><td>Nutrition entérale dès 100 µg/jour ; voie intraveineuse jusqu’à 400 µg/jour pendant au moins 7 à 10 jours si le sélénium est inférieur à 0,4 µmol/L</td><td>Grade 0, consensus 100 %</td></tr></table><h3>Lecture</h3><p>Le niveau de preuve est souvent bas (points de bonne pratique et grade 0) : les seuils reposent sur des consensus d’experts plus que sur des essais. Le consensus est cependant total (100 %) pour les trois recommandations de seuil et de dose. Les sources lues ne redéfinissent pas chaque grade ; il faut donc les citer tels quels.</p><p class="src">Référence : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>.</p></template>
<template data-pop="e59-inflammation" data-title="Inflammation et sélénium plasmatique"><h3>Le phénomène</h3><p>L’inflammation abaisse le sélénium plasmatique par redistribution hors du compartiment circulant. Le retour à la normale est souvent spontané, sans supplément. La sélénoprotéine P, de poids moléculaire voisin de celui de l’albumine, baisse comme elle (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><h3>L’ampleur</h3><p>Une CRP de 10 à 40 mg/L entraîne une baisse attendue de 15 à 25 % ; de 41 à 80 mg/L, d’environ 35 % ; au-delà de 80 mg/L, d’environ 50 % (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>). Dès que la CRP dépasse 40 mg/L, il ne reste presque plus de valeurs normales (<a href="https://www.rosenfluh.ch/media/ernaehrungsmedizin/2022/05/Neue-ESPEN-Guidelines-fuer-Mikronaehrstoffe.pdf" target="_blank" rel="noopener">Berger, exposé sur les lignes directrices ESPEN, Schweizer Zeitschrift für Ernährungsmedizin 2022</a>).</p><h3>Application</h3><p>Pour la patiente de la vignette, la CRP est à 6 mg/L : l’inflammation est absente, le chiffre de 0,30 µmol/L reflète donc un vrai déficit. Pour un malade de réanimation à CRP élevée, la même valeur serait ambiguë.</p><h3>Piège</h3><p>L’ESPEN fixe le seuil de 0,75 µmol/L à une CRP inférieure à 20 mg/L. Entre 20 et 40 mg/L, le dossier ne formule pas de règle explicite pour le sélénium entre 0,4 et 0,75 µmol/L.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://www.rosenfluh.ch/media/ernaehrungsmedizin/2022/05/Neue-ESPEN-Guidelines-fuer-Mikronaehrstoffe.pdf" target="_blank" rel="noopener">Berger, exposé sur les lignes directrices ESPEN, Schweizer Zeitschrift für Ernährungsmedizin 2022</a>.</p></template>
<template data-pop="e59-kashin" data-title="Maladie de Kashin-Beck"><h3>Définition et code</h3><p>La maladie de Kashin-Beck est une ostéoarthropathie endémique. La CIM-10-GM 2024 la nomme « maladie de Kaschin-Beck » et la code <b>M12.1</b> en rhumatologie, hors de E59 (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>).</p><h3>Mécanisme</h3><p>La nécrose touche les chondrocytes de la plaque de croissance et des surfaces articulaires. Un sélénium et un iode bas réduisent davantage l’activité des glutathion peroxydases (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11096467/" target="_blank" rel="noopener">Liu et al., Front Nutr 2024</a>).</p><h3>Épidémiologie et clinique</h3><p>La Chine comptait 379 comtés d’endémie à la fin de 2021. La maladie donne des douleurs articulaires symétriques et multiples avec déformations, un retard de croissance et un handicap parfois permanent (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11096467/" target="_blank" rel="noopener">Liu et al., Front Nutr 2024</a>).</p><h3>Limites</h3><p>La description vient d’une revue chinoise, utilisée seulement pour décrire la maladie, non pour une conduite.</p><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11096467/" target="_blank" rel="noopener">Liu et al., Front Nutr 2024</a>.</p></template>
<template data-pop="e59-keshan" data-title="Maladie de Keshan"><h3>Définition et code</h3><p>La maladie de Keshan est une cardiomyopathie endémique liée à la carence en sélénium. La CIM-10-GM 2024 l’inclut dans E59 (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>).</p><h3>Épidémiologie</h3><p>Elle touche surtout l’enfant et la femme jeune en âge de procréer, dans des régions où l’apport habituel est inférieur à 20 µg/jour (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><h3>Mécanisme et lésions</h3><p>La carence de l’hôte augmente la virulence de certains virus ; un coxsackievirus cardiotoxique a été impliqué dans l’étiologie. Les lésions sont une nécrose myocardique, des calcifications et une fibrose (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8509311/" target="_blank" rel="noopener">Shimada et al., Int J Mol Sci 2021</a> ; <a href="https://doi.org/10.1017/S0029665122002646" target="_blank" rel="noopener">Rayman et al., Proc Nutr Soc 2022</a>).</p><h3>Clinique et prévention</h3><p>Les formes graves donnent un choc cardiogénique, des arythmies et une insuffisance cardiaque congestive. La supplémentation en sélénite a fortement réduit l’incidence (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8509311/" target="_blank" rel="noopener">Shimada et al., Int J Mol Sci 2021</a>).</p><h3>Limites</h3><p>La description repose sur une revue narrative américaine, utilisée seulement pour la maladie ; elle ne fonde aucune conduite thérapeutique de ce chapitre.</p><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8509311/" target="_blank" rel="noopener">Shimada et al., Int J Mol Sci 2021</a> ; <a href="https://doi.org/10.1017/S0029665122002646" target="_blank" rel="noopener">Rayman et al., Proc Nutr Soc 2022</a>.</p></template>
<template data-pop="e59-leuconychie" data-title="Leuconychie : description et limites"><h3>Le signe</h3><p>La leuconychie est le blanchiment des ongles. Dans le cas publié, elle est le signe caractéristique de la carence en sélénium et elle a disparu après le traitement (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>). Les atteintes cutanées et unguéales sont des points d’aboutissement d’une carence sévère (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><h3>Pourquoi elle oriente</h3><p>Elle apparaît dans un contexte de carence installée, avec un sélénium très bas ; elle a donc une valeur d’alerte chez un patient à risque.</p><h3>Limites</h3><p>Les sources lues ne donnent ni sensibilité ni spécificité. Un ongle anormal ne distingue pas la carence de la sélénose chronique, qui altère aussi ongles et cheveux : le dosage tranche (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>.</p></template>
<template data-pop="e59-mnemo" data-title="Aide-mémoire des seuils"><p><b>Aide pédagogique, non critère officiel.</b></p><p>Trois nombres résument la lecture : 75, 40 et 20. « 75 » rappelle 0,75 µmol/L, le seuil sans inflammation ; « 40 » rappelle 0,4 µmol/L, le seuil de carence sévère valable quelle que soit la CRP ; « 20 » rappelle la CRP de 20 mg/L, qui borne l’absence d’inflammation. Pour les microgrammes par litre : 60 (soit 0,75) et 32 (soit 0,4).</p><p>Pour la dose : 100 µg/jour au départ, 400 µg/jour par voie intraveineuse pendant au moins 7 à 10 jours dans la carence profonde de la nutrition entérale, puis un contrôle. La limite à ne pas franchir : 255 µg/jour.</p></template>
<template data-pop="e59-nosologie" data-title="E59 et les catégories voisines de la CIM-10-GM 2024"><h3>La catégorie</h3><p>E59 — Carence alimentaire en sélénium appartient au bloc E50–E64 (autres carences nutritionnelles), chapitre IV. La catégorie est terminale, sans sous-code. Elle inclut la maladie de Keshan et exclut les séquelles de carence en sélénium (E64.8). Elle peut servir de diagnostic principal, sans restriction d’âge ni de sexe, et n’est pas classée infectieuse (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>).</p><h3>Les catégories voisines</h3><table class="t"><tr><th>Code</th><th>Intitulé</th><th>Lien avec E59</th></tr><tr><td>E64.8</td><td>Séquelles d’autres carences nutritionnelles</td><td>Séquelles de carence en sélénium (exclusion de E59)</td></tr><tr><td>M12.1</td><td>Maladie de Kaschin-Beck</td><td>Ostéoarthropathie endémique, codée en rhumatologie</td></tr><tr><td>E00.1</td><td>Syndrome d’insuffisance thyroïdienne congénitale de type myxœdémateux</td><td>Crétinisme myxœdémateux endémique</td></tr><tr><td>I42.8</td><td>Autres myocardiopathies</td><td>Codage cardiologique éventuel d’une cardiomyopathie</td></tr><tr><td>E61.-</td><td>Carences en autres éléments nutritionnels</td><td>E61 exclut E64.-, E00-E02 et E83.-</td></tr><tr><td>E83.-</td><td>Anomalies du métabolisme des minéraux</td><td>E83 renvoie la carence alimentaire en minéraux vers E58-E61</td></tr></table><h3>Lecture</h3><p>Le tableau situe E59 : les codes voisins sont des diagnostics différentiels ou des comorbidités, non des composantes de E59. Les sources ne précisent pas comment coder une carence par perte plutôt que par apport.</p><p class="src">Référence : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>.</p></template>
<template data-pop="e59-np" data-title="Nutrition parentérale et sélénium"><h3>Le risque</h3><p>Une nutrition parentérale sans sélénium, ou insuffisamment supplémentée, expose à la cardiomyopathie et à la myopathie (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>). L’information professionnelle de Nutryelt précise que, lors d’une nutrition parentérale moyenne ou longue, les carences en fer, en zinc et en sélénium sont plus fréquentes et qu’il faut compléter si nécessaire (information professionnelle suisse Nutryelt (Swissmedic, mise à jour novembre 2019, via AIPS, consultée le 15.10.2026)).</p><h3>Les apports</h3><p>L’ESPEN recommande 60 à 100 µg/jour de sélénium en nutrition parentérale (grade B) ; 150 à 200 µg/jour en cas de besoins élevés. À domicile, sans inflammation, 60 à 100 µg/jour suffisent à normaliser le sélénium (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><h3>Même supplémentée</h3><p>Une courte nutrition parentérale postopératoire, supplémentée, a provoqué une carence avec cardiomyopathie réversible chez un patient dénutri atteint de maladie de Crohn (<a href="https://doi.org/10.1136/pgmj.70.821.235" target="_blank" rel="noopener">Levy et al., Postgrad Med J 1994</a>). L’état nutritionnel de départ et les pertes comptent autant que l’apport.</p><h3>Limite</h3><p>Le cas de 1994 n’est lu qu’en résumé et concerne un seul patient.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; information professionnelle suisse Nutryelt (Swissmedic, mise à jour novembre 2019, via AIPS, consultée le 15.10.2026) ; <a href="https://doi.org/10.1136/pgmj.70.821.235" target="_blank" rel="noopener">Levy et al., Postgrad Med J 1994</a>.</p></template>
<template data-pop="e59-orbitopathie" data-title="Orbitopathie basedowienne et sélénium"><h3>La position européenne</h3><p>Les lignes directrices EUGOGO 2021 retiennent une cure de sélénium de six mois dans l’orbitopathie basedowienne légère, surtout en zone carencée. Elles ne retiennent pas de preuve pour les formes modérées à sévères (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12687763/" target="_blank" rel="noopener">Bartalena et al., Eur Thyroid J 2025 (lignes directrices EUGOGO 2021)</a>).</p><h3>Thyroïdite auto-immune</h3><p>Le sélénium fait baisser les anticorps sans amélioration clinique démontrée (<a href="https://doi.org/10.1038/s41574-019-0311-6" target="_blank" rel="noopener">Winther et al., Nat Rev Endocrinol 2020</a>).</p><h3>Limites</h3><p>Seule la position EUGOGO sert de fondement ; la dose de sélénium recommandée n’a pas été relue. L’article compare les lignes directrices EUGOGO à un consensus de 2022 de sociétés de thyroïdologie américaine et européenne ; ce consensus n’est pas retenu comme fondement. Aucune posologie n’est donc proposée dans ce chapitre pour cette indication.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12687763/" target="_blank" rel="noopener">Bartalena et al., Eur Thyroid J 2025 (lignes directrices EUGOGO 2021)</a> ; <a href="https://doi.org/10.1038/s41574-019-0311-6" target="_blank" rel="noopener">Winther et al., Nat Rev Endocrinol 2020</a>.</p></template>
<template data-pop="e59-profiles" data-title="PROFILES et situations de départ"><h3>Le rattachement</h3><p>Dans le dépôt de MEDINA, la carence alimentaire en sélénium est rattachée aux situations de départ 16 (perte de poids, malnutrition), 138 (cachexie et malnutrition) et 170 (carences nutritionnelles). Les situations 198 (malnutrition et sarcopénie) et 142 (exophtalmie) sont des liens utiles (<a href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener">PROFILES 2017</a>).</p><h3>Limite</h3><p>Cette correspondance est pédagogique, établie par le dépôt ; elle n’est pas un transcodage officiel. La brochure PROFILES n’a pas été relue en entier dans ce cycle.</p><p class="src">Référence : <a href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener">PROFILES 2017</a>.</p></template>
<template data-pop="e59-qtc" data-title="Électrocardiogramme de la carence en sélénium"><h3>Anomalies décrites</h3><p>Le cas publié montre un intervalle QT corrigé très long (594 ms) et une inversion des ondes T (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>).</p><h3>Mécanisme proposé</h3><p>Les auteurs proposent que le stress oxydatif altère la gestion du calcium et du potassium et retarde la repolarisation. C’est une hypothèse, non un fait démontré.</p><h3>Conséquence pratique</h3><p>Chez un patient à risque, un intervalle QT corrigé long sans autre cause justifie le dosage du sélénium. Le contrôle de la normalisation après traitement fait partie de la surveillance rapportée par le cas.</p><h3>Limite</h3><p>La valeur de 594 ms est celle d’un cas unique ; elle ne constitue pas un seuil.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>.</p></template>
<template data-pop="e59-selenoproteines" data-title="Sélénocystéine et sélénoprotéines"><h3>Définition</h3><p>La sélénocystéine est un acide aminé qui contient du sélénium. Sa synthèse exige du sélénium disponible. Elle entre dans la structure d’au moins 25 protéines humaines, les sélénoprotéines, qui interviennent dans la défense antioxydante et dans le métabolisme des hormones thyroïdiennes (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><h3>Les familles à retenir</h3><p>Les glutathion peroxydases protègent les cellules contre les hydroperoxydes. La désiodase de type 1 active la thyroxine. La thiorédoxine réductase est une troisième sélénoenzyme citée par l’information professionnelle de selenase® (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026)). La sélénoprotéine P assure le transport.</p><h3>Conséquence</h3><p>Le déficit en sélénium réduit la synthèse de ces protéines. La clinique dépend des tissus les plus exposés au stress oxydatif ; le cœur est le premier cité.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-selenop" data-title="Sélénoprotéine P"><h3>Fonction</h3><p>La sélénoprotéine P est produite par le foie. Elle est la principale forme circulante du sélénium (plus de 50 % du sélénium plasmatique) et le transporte vers les tissus par le récepteur LRP-8, aussi nommé ApoER-2 (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><h3>Piège d’interprétation</h3><p>Son poids moléculaire est voisin de celui de l’albumine, et son taux baisse avec l’inflammation comme celui de l’albumine : un sélénium plasmatique bas en contexte inflammatoire reflète en partie cette baisse.</p><h3>Dosage</h3><p>Le dosage direct de la sélénoprotéine P est peu répandu et les résultats des méthodes sont discordants ; il n’est pas systématique. Le plateau de la sélénoprotéine P correspond à environ 110 µg/L de sélénium plasmatique.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>.</p></template>
<template data-pop="e59-selenose" data-title="Sélénose : l’excès de sélénium"><h3>Signes</h3><p>Le surdosage aigu donne une haleine alliacée, de la fatigue, des nausées, de la diarrhée et des douleurs abdominales. L’exposition chronique altère les ongles et les cheveux et peut provoquer une polyneuropathie (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><h3>Conduite</h3><p>Il n’existe pas d’antidote. Le dimercaprol est déconseillé car il augmente la toxicité. La dialyse est possible en cas de surdosage extrême (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026)).</p><h3>Causes et limites</h3><p>Les suppléments à forte dose et la consommation régulière de noix du Brésil exposent à l’excès. La limite supérieure d’apport tolérable est de 255 µg/jour chez l’adulte ; la dose minimale avec effet nocif observé est de 330 µg/jour (alopécie) (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9854220/" target="_blank" rel="noopener">EFSA, limite supérieure d’apport tolérable en sélénium, 2023</a>).</p><h3>Piège</h3><p>La carence et l’excès altèrent tous deux les ongles ; le dosage les distingue. Un sélénium élevé contre-indique la selenase® (intoxication au sélénium).</p><p class="src">Références : information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9854220/" target="_blank" rel="noopener">EFSA, limite supérieure d’apport tolérable en sélénium, 2023</a>.</p></template>
<template data-pop="e59-sources" data-title="Sources lues et limites"><h3>Sources suisses</h3><p>Classification CIM-10-GM 2024 de l’Office fédéral de la statistique ; valeurs de référence de l’OSAV (juin 2022) ; étude de l’OSAV sur le statut en sélénium de la population suisse (2023) ; études suisses antérieures (2008, 2010) ; étude vaudoise (2026) ; comptes rendus de la Schweizer Zeitschrift für Ernährungsmedizin (2022 et 2024) ; informations professionnelles Swissmedic de selenase® (juin 2023), Nutryelt (novembre 2019), Addaven (janvier 2021) et Peditrace® (novembre 2025), consultées le 15.10.2026.</p><h3>Sources européennes et internationales</h3><p>Lignes directrices ESPEN 2022 sur les micronutriments (texte intégral) ; avis de l’EFSA 2023 ; revue pour les recommandations nutritionnelles nordiques 2023 ; cas publié dans l’European Heart Journal – Case Reports (2026) ; étude de l’insuffisance cardiaque (2020) ; revues sur les maladies de Keshan et de Kashin-Beck ; lignes directrices EUGOGO 2021 (via un article de 2025).</p><h3>Lacunes déclarées</h3><p>Aucun article du Swiss Medical Forum ou de la Revue médicale suisse sur la carence en sélénium n’a été trouvé ; le remboursement de selenase® dans la Liste des spécialités n’a pas été vérifié ; les recommandations ESPGHAN 2018 de nutrition parentérale pédiatrique n’ont pas été lues ; la dose EUGOGO de sélénium n’a pas été relue ; les fréquences des symptômes, la sensibilité et la spécificité des signes, les délais d’urgence, l’incidence suisse codée, les conditions pré-analytiques, la liste OFSP des déclarations, l’aptitude à la conduite, Suva et assurance-invalidité n’ont pas été trouvés. Plusieurs articles ne sont lus qu’en résumé : leurs données sont signalées comme telles.</p></template>
<template data-pop="e59-statut-suisse" data-title="Statut en sélénium de la population suisse"><h3>Les mesures</h3><p>En 2019, 700 donneurs de sang adultes ont une moyenne de 98 ± 12 µg/L (64 à 136 µg/L). Les mesures antérieures sont de 93 ± 15 µg/L en 1993 et de 98 ± 13 µg/L en 2006 (<a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>). Une étude de 2006 sur 1847 donneurs donne une moyenne de 98 µg/L, un minimum de 62 µg/L et un risque de carence marginale faible (<a href="https://doi.org/10.1016/j.jtemb.2007.11.002" target="_blank" rel="noopener">Burri et al., J Trace Elem Med Biol 2008</a>). L’apport estimé en 2010 est d’environ 66 µg/jour (<a href="https://doi.org/10.1080/19440049.2010.506603" target="_blank" rel="noopener">Jenny-Burri et al., Food Addit Contam 2010</a>).</p><h3>L’apport</h3><p>Il est de 67 ± 13 µg/jour chez la femme et de 70 ± 12 µg/jour chez l’homme. La prévalence d’apport insuffisant (besoin moyen estimé de 45 µg/jour) est inférieure à 2 % chez l’homme et à 5 % chez la femme (<a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>).</p><h3>Limites</h3><p>Les donneurs de sang sont des adultes en bonne santé. Le collectif végane est petit (48 personnes). Les articles de 2008 et de 2010 ne sont lus qu’en résumé.</p><p class="src">Références : <a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a> ; <a href="https://doi.org/10.1016/j.jtemb.2007.11.002" target="_blank" rel="noopener">Burri et al., J Trace Elem Med Biol 2008</a> ; <a href="https://doi.org/10.1080/19440049.2010.506603" target="_blank" rel="noopener">Jenny-Burri et al., Food Addit Contam 2010</a>.</p></template>
<template data-pop="e59-ul-efsa" data-title="Limite supérieure d’apport et valeurs par âge"><h3>La limite</h3><p>L’EFSA fixe en 2023 la limite supérieure d’apport tolérable du sélénium à 255 µg/jour chez l’adulte, grossesse et allaitement compris. La dose minimale avec effet nocif observé est de 330 µg/jour (alopécie, essai SELECT) (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9854220/" target="_blank" rel="noopener">EFSA, limite supérieure d’apport tolérable en sélénium, 2023</a>).</p><h3>Par âge</h3><table class="t"><tr><th>Âge</th><th>Limite (µg/jour)</th></tr><tr><td>4 à 6 mois</td><td>45</td></tr><tr><td>7 à 11 mois</td><td>55</td></tr><tr><td>1 à 3 ans</td><td>70</td></tr><tr><td>4 à 6 ans</td><td>95</td></tr><tr><td>7 à 10 ans</td><td>130</td></tr><tr><td>11 à 14 ans</td><td>180</td></tr><tr><td>15 à 17 ans</td><td>230</td></tr></table><h3>Signification</h3><p>Ces valeurs sont des plafonds de sécurité pour la population ; elles ne sont pas des doses de traitement. Les doses de traitement de l’ESPEN dépassent parfois ces plafonds dans des situations précises : environ 375 µg/jour par voie intraveineuse chez le brûlé, par exemple. Un essai danois a observé une mortalité accrue à 15 ans après 300 µg/jour pendant 5 ans, mais pas après 200 µg/jour (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><h3>Limite</h3><p>La section des valeurs pédiatriques détaillées de l’avis n’a pas été relue en entier.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9854220/" target="_blank" rel="noopener">EFSA, limite supérieure d’apport tolérable en sélénium, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>.</p></template>
<template data-pop="e59-valeurs-suisses" data-title="Valeurs de référence suisses pour le sélénium"><h3>Origine</h3><p>Le fichier de l’OSAV de juin 2022 donne des valeurs de référence nutritionnelles pour la Suisse. Pour le sélénium (µg/jour) : 15 de 7 mois à 3 ans, 20 de 4 à 6 ans, 35 de 7 à 10 ans, 55 de 11 à 14 ans, 70 de 15 à 17 ans, 70 pour l’adulte et pendant la grossesse, 85 pendant l’allaitement, 55 à 60 chez la femme et 55 à 70 chez l’homme après 65 ans (<a href="https://www.blv.admin.ch/dam/de/sd-web/FLClcT03o4I6/nutrient-requirements-ch-2022.xlsx" target="_blank" rel="noopener">OSAV, valeurs de référence nutritionnelles pour la Suisse, juin 2022</a>).</p><h3>Comparaison</h3><p>La révision allemande, autrichienne et suisse (D-A-CH) de 2015 considère le besoin supplémentaire négligeable en grossesse et de 75 µg/jour pendant l’allaitement (<a href="https://doi.org/10.1016/j.jtemb.2015.07.005" target="_blank" rel="noopener">Kipp et al., J Trace Elem Med Biol 2015</a>). Les valeurs suisses actuelles sont celles du fichier de 2022.</p><h3>Limites</h3><p>Le fichier n’indique pas la source primaire de chaque valeur. Il s’agit de valeurs de planification pour une population saine, non de seuils de carence. L’article de 2015 n’est lu qu’en résumé.</p><p class="src">Références : <a href="https://www.blv.admin.ch/dam/de/sd-web/FLClcT03o4I6/nutrient-requirements-ch-2022.xlsx" target="_blank" rel="noopener">OSAV, valeurs de référence nutritionnelles pour la Suisse, juin 2022</a> ; <a href="https://doi.org/10.1016/j.jtemb.2015.07.005" target="_blank" rel="noopener">Kipp et al., J Trace Elem Med Biol 2015</a>.</p></template>
<template data-pop="e59-vaud" data-title="Hommes détenus vaudois et facteurs associés"><h3>L’étude</h3><p>Une étude transversale vaudoise (Unisanté, CHUV) a comparé 206 hommes détenus et 189 hommes de la population générale. Les médianes sont de 106 et de 105 ng/mL. Des valeurs inférieures à 60 ng/mL (seuil ESPEN) concernent 2,55 % des détenus et 0 % de la population générale ; des valeurs inférieures à la limite inférieure suisse (86 ng/mL) concernent 11,7 % des détenus et 8,47 % de la population générale, différence non significative (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13482155/" target="_blank" rel="noopener">Bettex et al., Int J Public Health 2026</a>).</p><h3>Facteurs associés à un sélénium plus bas</h3><p>L’âge plus élevé, un revenu inférieur à 3000 francs suisses avant l’incarcération et le tabagisme actif (β = −11,1 ng/mL) sont associés à un sélénium plus bas.</p><h3>Limites</h3><p>L’étude ne concerne que des hommes et son plan est transversal : les associations ne prouvent pas de causalité.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13482155/" target="_blank" rel="noopener">Bettex et al., Int J Public Health 2026</a>.</p></template>
<template data-pop="e59-vegane" data-title="Alimentation végétalienne et sélénium"><h3>En Suisse</h3><p>Chez les femmes véganes non supplémentées, la médiane est de 80 µg/L ; le minimum observé chez les véganes non supplémentés est de 62 µg/L (<a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>). Le collectif végane est petit (48 personnes).</p><h3>Au Danemark</h3><p>Les apports véganes sont de 33 µg/jour chez l’homme et de 25 µg/jour chez la femme, contre 52 et 39 µg/jour dans la population de comparaison (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><h3>Conduite</h3><p>L’OSAV recommande des mesures ciblées pour les personnes véganes. Le conseil comprend un supplément ciblé lorsque le régime exclut les sources animales.</p><p class="src">Références : <a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>.</p></template>
<template data-pop="e59-virus" data-title="Carence en sélénium et virus"><h3>L’hypothèse</h3><p>La carence de l’hôte augmente la virulence de virus à acide ribonucléique, dont le virus de la grippe A et le coxsackievirus B3, impliqué dans la maladie de Keshan (<a href="https://doi.org/10.1017/S0029665122002646" target="_blank" rel="noopener">Rayman et al., Proc Nutr Soc 2022</a>). Un coxsackievirus cardiotoxique est considéré comme impliqué dans l’étiologie de cette maladie (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><h3>Signification</h3><p>La maladie de Keshan est donc discutée comme l’association d’une carence et d’un agent viral (hypothèse). Elle n’est pas classée infectieuse par l’OFS, qui la place sous E59 avec la mention non infectieuse (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>).</p><h3>Limite</h3><p>La revue sur laquelle repose ce passage n’est lue qu’en résumé : le rôle viral reste un élément de contexte, sans conséquence sur la conduite de ce chapitre.</p><p class="src">Références : <a href="https://doi.org/10.1017/S0029665122002646" target="_blank" rel="noopener">Rayman et al., Proc Nutr Soc 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>.</p></template>
<template data-pop="e59-zinc" data-title="Carence en zinc : diagnostic différentiel cutané et unguéal"><h3>Éléments discriminants</h3><p>La carence en zinc donne une alopécie, une éruption du visage, des plis, des mains et des pieds, et des troubles du goût (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>). Elle peut donc évoquer une atteinte de la peau et des ongles proche de celle du sélénium.</p><h3>Conduite</h3><p>Le dosage de chaque oligo-élément départage les deux. En nutrition parentérale moyenne ou longue, les carences en fer, en zinc et en sélénium sont plus fréquentes (information professionnelle suisse Nutryelt (Swissmedic, mise à jour novembre 2019, via AIPS, consultée le 15.10.2026)).</p><h3>Limite</h3><p>Le dossier ne détaille pas le diagnostic de la carence en zinc ; il la signale comme différentiel.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; information professionnelle suisse Nutryelt (Swissmedic, mise à jour novembre 2019, via AIPS, consultée le 15.10.2026).</p></template>
