<template data-pop="pareto-k70-clinique" data-title="Loi de Pareto — Maladie alcoolique du foie"><p class="ratio" data-cover="k70-2,k70-5,k70-7,k70-8,k70-9,k70-10,k70-11"></p><ul><li>Risque au-delà de 30 g/j d’alcool.</li><li>AUDIT-C pour dépister ; éthylglucuronide pour l’abstinence.</li><li>Hépatite alcoolique : ictère récent, ASAT rarement > 300 UI/l.</li><li>Sévère : Maddrey ≥ 32.</li><li>Prednisolone 40 mg/j 28 jours, sans infection active.</li><li>Lille J7 ≥ 0,45 : non-réponse ; arrêt.</li><li>Transplantation si Child-Pugh C ou MELD ≥ 15.</li></ul></template>
<template data-pop="pareto-k70-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k70-e-1,k70-e-2"></p><ul><li>AUDIT-C pour dépister.</li><li>Élastographie : une fibrose avancée peut avoir des tests normaux.</li><li>Maddrey ≥ 32 : hépatite sévère.</li><li>Éthylglucuronide capillaire : abstinence sur ≤ 6 mois.</li></ul></template>
<template data-pop="pareto-k70-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k70-p-1,k70-p-2,k70-p-3"></p><ul><li>Prednisolone 40 mg/j 28 jours si sévère et sans infection.</li><li>Arrêt si Lille ≥ 0,56 (non-répondeur nul).</li><li>Acamprosate : contre-indiqué si créatinine > 120 µmol/l.</li><li>Disulfirame : contre-indiqué si hépatopathie avancée.</li><li>Benzodiazépines ≤ 10-14 jours ; vitamines B.</li></ul></template>
<template data-pop="k70-ha" data-title="Hépatite alcoolique"><p class="lab">Définition</p><p>Syndrome d’ictère d’apparition récente chez un buveur excessif, sous-tendu par une stéatohépatite.</p><p class="lab">Biologie (EASL 2018)</p><p>Bilirubine > 50 µmol/l ; ASAT > 2 × normale, rarement > 300 UI/l ; ASAT/ALAT > 1,5-2 ; polynucléose.</p><p class="lab">Code</p><p>K70.1.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-tua" data-title="Trouble de l’usage d’alcool"><p class="lab">Définition</p><p>Terme du DSM-5, qui remplace « abus » et « dépendance ».</p><p class="lab">Dépistage</p><p>AUDIT ou AUDIT-C (grade A1).</p><p class="lab">Prise en charge</p><p>Intervention brève, équipe multidisciplinaire, psychothérapie, médicaments.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-mdf" data-title="Fonction discriminante de Maddrey (modifiée)"><p class="lab">Formule</p><p>4,6 × (temps de prothrombine du patient − témoin, en secondes) + bilirubine (mg/dl).</p><p class="lab">Seuil</p><p>≥ 32 : hépatite alcoolique sévère, seuil habituel de traitement.</p><p class="lab">Pronostic</p><p>< 32 : mortalité à un mois < 10 %.</p><p class="src">Références : <a href="https://doi.org/10.7326/0003-4819-110-9-685" target="_blank" rel="noopener">Carithers R. L. et al., Methylprednisolone therapy in patients with severe alcoholic hepatitis, Ann Intern Med 1989;110:685-690 (fonction discriminante modifiée)</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-meld" data-title="Score MELD"><p class="lab">Variables</p><p>Bilirubine, INR, créatinine.</p><p class="lab">Usage</p><p>Pronostic à court terme de l’hépatite alcoolique ; priorité de greffe ; MELD ≥ 15 : discuter la transplantation dans la cirrhose alcoolique.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-gahs" data-title="Score de Glasgow de l’hépatite alcoolique"><p class="lab">Variables</p><p>Âge, bilirubine, urée, temps de prothrombine, leucocytes.</p><p class="lab">Échelle</p><p>5 à 12.</p><p class="lab">Seuil</p><p>≥ 9 avec Maddrey ≥ 32 : mauvais pronostic, bénéfice des corticoïdes à 84 jours.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-abic" data-title="Score ABIC"><p class="lab">Variables</p><p>Âge, bilirubine, INR, créatinine.</p><p class="lab">Usage</p><p>Risque de décès à 90 jours : faible, intermédiaire ou élevé.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-lille" data-title="Score de Lille"><p class="lab">Variables</p><p>Données initiales et évolution de la bilirubine entre J0 et J7 de corticoïdes.</p><p class="lab">Seuils</p><p>≤ 0,16 : répondeur complet ; 0,16-0,56 : partiel ; ≥ 0,56 : non-répondeur nul ; ≥ 0,45 : non-réponse.</p><p class="lab">Conduite</p><p>Arrêt des corticoïdes en cas de non-réponse.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-steatose" data-title="Stéatose alcoolique"><p class="lab">Lésion</p><p>Vacuoles lipidiques, surtout macrovacuolaires, dans les hépatocytes.</p><p class="lab">Fréquence</p><p>Environ 90 % des buveurs excessifs.</p><p class="lab">Évolution</p><p>Peut régresser complètement en quelques semaines d’abstinence.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-sha" data-title="Stéatohépatite alcoolique"><p class="lab">Lésions</p><p>Stéatose, ballonnisation, nécrose, inflammation lobulaire à polynucléaires.</p><p class="lab">Portée</p><p>Lésion progressive, qui augmente le risque de cirrhose et de carcinome hépatocellulaire.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-mallory" data-title="Corps de Mallory-Denk"><p class="lab">Nature</p><p>Inclusions éosinophiles des hépatocytes ballonnisés, faites surtout de kératines 8 et 18.</p><p class="lab">Valeur</p><p>Évocateurs, mais non spécifiques, de stéatohépatite.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-pnpla3" data-title="Gène PNPLA3"><p class="lab">Rôle</p><p>Variants associés à un risque accru de lésions hépatiques alcooliques chez les sujets caucasiens.</p><p class="lab">Usage</p><p>Facteur de risque ; pas de test de routine recommandé.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-ictere" data-title="Ictère"><p class="lab">Signe</p><p>Coloration jaune de la peau et des sclères par la bilirubine.</p><p class="lab">Valeur ici</p><p>Signe cardinal de l’hépatite alcoolique quand il est récent.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-wernicke" data-title="Encéphalopathie de Wernicke"><p class="lab">Cause</p><p>Carence en thiamine (vitamine B1).</p><p class="lab">Prévention</p><p>Vitamines du groupe B chez le patient alcoolique, notamment dans l’hépatite alcoolique.</p><p class="lab">Diagnostic différentiel</p><p>Encéphalopathie hépatique, sevrage.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-sevrage" data-title="Syndrome de sevrage alcoolique"><p class="lab">Traitement</p><p>Benzodiazépines (ou clométhiazole), à limiter à 10-14 jours (grade A1).</p><p class="lab">Risque</p><p>Abus et encéphalopathie en cas de prolongation.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-audit" data-title="Questionnaire AUDIT"><p class="lab">Contenu</p><p>Dix questions de l’OMS sur la consommation, la dépendance et les conséquences ; AUDIT-C : les trois premières, sur la consommation.</p><p class="lab">Usage</p><p>Dépistage du trouble de l’usage d’alcool (grade A1).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-cdt" data-title="Transferrine carboxy-déficiente"><p class="lab">Type</p><p>Marqueur indirect sérique de consommation chronique excessive.</p><p class="lab">Limite</p><p>Sensibilité et spécificité modestes ; facteurs de confusion.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-etg" data-title="Éthylglucuronide"><p class="lab">Type</p><p>Métabolite direct de l’éthanol.</p><p class="lab">Fenêtre</p><p>Urine : jusqu’à environ 80 h ; cheveux : jusqu’à 6 mois.</p><p class="lab">Usage</p><p>Vérification de l’abstinence (grade A2).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-elasto" data-title="Élastographie impulsionnelle"><p class="lab">Usage</p><p>Mesure de la fibrose chez tout buveur excessif dépisté (grade A1).</p><p class="lab">Piège</p><p>Inflammation d’une hépatite alcoolique : valeurs surestimées.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-biopsie" data-title="Biopsie hépatique"><p class="lab">Indications (grade A1)</p><p>Incertitude diagnostique, stadage précis, essais cliniques.</p><p class="lab">Voie</p><p>Transjugulaire dans l’hépatite alcoolique (troubles de la coagulation).</p><p class="lab">Rendement</p><p>Autre diagnostic dans 10 à 20 % des cas.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-stopah" data-title="Essai STOPAH"><p class="lab">Plan</p><p>Essai britannique 2011-2014 : prednisolone et pentoxifylline dans l’hépatite alcoolique sévère.</p><p class="lab">Résultat</p><p>Réduction limite de la mortalité à 28 jours sous prednisolone, aucun bénéfice au-delà d’un mois.</p><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1412278" target="_blank" rel="noopener">Thursz M. R. et al., Prednisolone or pentoxifylline for alcoholic hepatitis (STOPAH), N Engl J Med 2015;372:1619-1628</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-nutrition" data-title="Nutrition de l’hépatite alcoolique"><p class="lab">Objectifs (grade A2)</p><p>≥ 35-40 kcal/kg/j ; 1,2-1,5 g/kg/j de protéines ; voie orale en premier.</p><p class="lab">Risque</p><p>Apport < 21,5 kcal/kg/j : mortalité et infections accrues.</p><p class="lab">Si échec</p><p>Nutrition entérale par sonde.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-tx" data-title="Transplantation hépatique"><p class="lab">Cirrhose alcoolique (grade A1)</p><p>Child-Pugh C et/ou MELD ≥ 15.</p><p class="lab">Abstinence</p><p>Pas de seul critère des six mois ; évaluation multidisciplinaire.</p><p class="lab">Hépatite sévère</p><p>Greffe précoce chez une minorité de non-répondeurs sélectionnés.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-d-prednisolone" data-title="Prednisolone"><p class="lab">Dose (EASL 2018)</p><p>40 mg/j, 28 jours ; arrêt brutal ou décroissance sur 3 semaines.</p><p class="lab">Contre-indication pratique</p><p>Infection active non contrôlée.</p><p class="lab">Statut suisse</p><p>Hépatite alcoolique absente des indications de la FI ; réduction de dose possible en cas de cirrhose.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Prednisolone Streuli®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k70-d-nac" data-title="N-acétylcystéine"><p class="lab">Principe</p><p>Restaure le glutathion et limite le stress oxydatif.</p><p class="lab">Place</p><p>Intraveineuse, 5 jours, avec corticoïdes (grade B2) ; seule, pas de bénéfice de survie.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-d-acamprosate" data-title="Acamprosate (Campral®)"><p class="lab">Indication suisse</p><p>Maintien de l’abstinence après sevrage, avec mesures psychosociales.</p><p class="lab">Dose</p><p>2 comprimés 3 fois par jour, débuté vers le 5e jour d’abstinence, 6 à 12 mois.</p><p class="lab">Contre-indications</p><p>Créatinine > 120 µmol/l, allaitement ; prudence en Child-Pugh C.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Campral®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
