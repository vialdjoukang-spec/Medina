<template data-pop="pareto-k70-clinique" data-title="Loi de Pareto — Maladie alcoolique du foie"><p class="ratio" data-cover="k70-2,k70-5,k70-7,k70-8,k70-9,k70-10,k70-11"></p><ul><li>Risque au-delà de 30 g/j d’alcool.</li><li>L’AUDIT-C dépiste, et l’éthylglucuronide vérifie l’abstinence.</li><li>Hépatite alcoolique : ictère récent, ASAT rarement > 300 UI/l.</li><li>Sévère : Maddrey ≥ 32.</li><li>La prednisolone se donne à 40 mg/j pendant 28 jours, en l’absence d’infection active.</li><li>Un Lille à J7 ≥ 0,45 signale une non-réponse et fait arrêter les corticoïdes.</li><li>Transplantation si Child-Pugh C ou MELD ≥ 15.</li></ul></template>
<template data-pop="pareto-k70-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k70-e-1,k70-e-2"></p><ul><li>AUDIT-C pour dépister.</li><li>Élastographie : une fibrose avancée peut avoir des tests normaux.</li><li>Un Maddrey ≥ 32 définit l’hépatite sévère.</li><li>Éthylglucuronide capillaire : abstinence sur ≤ 6 mois.</li></ul></template>
<template data-pop="pareto-k70-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k70-p-1,k70-p-2,k70-p-3"></p><ul><li>Prednisolone 40 mg/j 28 jours si sévère et sans infection.</li><li>On arrête si le Lille est ≥ 0,56 (non-répondeur nul).</li><li>Acamprosate : contre-indiqué si créatinine > 120 µmol/l.</li><li>Disulfirame : contre-indiqué si hépatopathie avancée.</li><li>Benzodiazépines ≤ 10-14 jours ; vitamines B.</li></ul></template>
<template data-pop="k70-ha" data-title="Hépatite alcoolique"><p class="lab">Définition</p><p>Syndrome d’ictère d’apparition récente chez un buveur excessif, sous-tendu par une stéatohépatite.</p><p class="lab">Biologie (EASL 2018)</p><p>Bilirubine > 50 µmol/l ; ASAT > 2 × normale, rarement > 300 UI/l ; ASAT/ALAT > 1,5-2 ; polynucléose.</p><p class="lab">Code</p><p>K70.1.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-tua" data-title="Trouble de l’usage d’alcool"><p class="lab">Définition</p><p>Terme du DSM-5, qui remplace « abus » et « dépendance ».</p><p class="lab">Dépistage</p><p>AUDIT ou AUDIT-C (grade A1).</p><p class="lab">Prise en charge</p><p>On associe une intervention brève, une équipe multidisciplinaire, une psychothérapie et des médicaments, car l’abstinence est le premier facteur pronostique.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-mdf" data-title="Fonction discriminante de Maddrey (modifiée)"><p class="lab">Formule</p><p>4,6 × (temps de prothrombine du patient − témoin, en secondes) + bilirubine (mg/dl).</p><p class="lab">Seuil</p><p>Un score ≥ 32 définit l’hépatite alcoolique sévère et constitue le seuil habituel de traitement.</p><p class="lab">Pronostic</p><p>< 32 : mortalité à un mois < 10 %.</p><p class="src">Références : <a href="https://doi.org/10.7326/0003-4819-110-9-685" target="_blank" rel="noopener">Carithers R. L. et al., Methylprednisolone therapy in patients with severe alcoholic hepatitis, Ann Intern Med 1989;110:685-690 (fonction discriminante modifiée)</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-meld" data-title="Score MELD"><p class="lab">Variables</p><p>Il combine la bilirubine, l’INR et la créatinine.</p><p class="lab">Usage</p><p>Il prédit la mortalité à court terme de l’hépatite alcoolique et priorise la greffe ; dans la cirrhose alcoolique, un MELD ≥ 15 fait discuter la transplantation.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-gahs" data-title="Score de Glasgow de l’hépatite alcoolique"><p class="lab">Variables</p><p>Âge, bilirubine, urée, temps de prothrombine, leucocytes.</p><p class="lab">Échelle</p><p>5 à 12.</p><p class="lab">Seuil</p><p>≥ 9 avec Maddrey ≥ 32 : mauvais pronostic, bénéfice des corticoïdes à 84 jours.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-abic" data-title="Score ABIC"><p class="lab">Variables</p><p>Il combine l’âge, la bilirubine, l’INR et la créatinine.</p><p class="lab">Usage</p><p>Il classe le risque de décès à 90 jours en faible, intermédiaire ou élevé.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-lille" data-title="Score de Lille"><p class="lab">Variables</p><p>Il combine les données initiales et l’évolution de la bilirubine entre J0 et J7 de corticoïdes.</p><p class="lab">Seuils</p><p>Un score ≤ 0,16 signale un répondeur complet, de 0,16 à 0,56 un répondeur partiel et ≥ 0,56 un non-répondeur nul ; à partir de 0,45, on parle de non-réponse.</p><p class="lab">Conduite</p><p>On arrête les corticoïdes en cas de non-réponse, car ils n’apportent alors que le risque infectieux.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-steatose" data-title="Stéatose alcoolique"><p class="lab">Lésion</p><p>Les hépatocytes contiennent des vacuoles lipidiques, surtout macrovacuolaires.</p><p class="lab">Fréquence</p><p>Elle touche environ 90 % des buveurs excessifs.</p><p class="lab">Évolution</p><p>Peut régresser complètement en quelques semaines d’abstinence.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p><figure><img src="data:image/gif;base64,R0lGODdh4AGsAYUAAOvq7ezg6/3L8+7N5f627/6n6/Gv3/6b6P6S5f6K5/6K2viY3viK2uuS1P6C4f574P2A1f151f513f5w3P1y0feA1vd41Pdx0fF40OR4yv1p2/xp0/pqzftlzPxg1PpgyPtYzPJn0PJmxfJax+pgxtxfwvpPzPhOwOpOw/hDwuhDv/A0utk+vcQ4uMQcsZwOowAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA4AGsAUAI/wAbZGhAsIEBAxlKlCDhIcWKFS5csGjxouKLFiUoVmyBYsMEBwkgUOhwQoMGDx5QqFCBgkXEFixQnEyJIoSGDh9GkJiQYAILBwsMDBggUIJJEiUaCBBAYEEDDAouTECBwoQJCS4jao04sUQCDCFIkIhAYYPJDhwoXHhg4QLIBBYWjkABwgMIjiYePkyRwsQJqhweRLhQYeDSAAMOLrjAorFMDSEmrkQxQsOEDhs+nOCAecIFtxUUHjC4dOkBhXMbr2zMQiFSEQ4gLFRYofDAggQNECAwVPeCBRAuiHBrgQQHDgMLCFgQYgIIEx40tFTBYqVD6iUKJA4gwIBCEw4d6v8dz5flhAcPvpYIEWIDBQgRfLqwWJGFhoUYKlh4EGLEBqQCBADAgAEUaGCBABiYoICJLYDBCCf8hcIJIFB4Al9UiTCcBCS0MF9MHrjUwogWjThQUEMh1ttBJWSgQG4HCTXUjAc1IEKEOFanwggczKUCTNTtqCEHIpBAGYQ4qpBjhCqskAJ1ElFlAggoRMeBkVS1ppBTAinEAnQpgShCCbWxR0ICIWj0ggsPfCDlc+KFx5dVfUWH0koddMCCWCW05OFWW1WUAQEZGCBAAQhEIMIG7G2AQl+QNsnXCM6h9IBKk3WEQAEFHMAABgeM9ttvDLioQGENLMApAhmIkIADJHT/IEEHc3EgnK0XSEAWBBCIkJ8DGJAQwgMTUPCACDeFIIEEFKjFwAERRJCWBJ+9KpVHRCpEGgEEcZsQBgh4ioED+kFQXAYYZJCBqrrtttRBBMQobwEEHJCBAxJ4CJNJdmEmQgd2SQdTC9GhwBUIPB2wgLoGFcCABSMoCd7EfFU8JYUVUubeBRQ44PEDGbWGpkL5gZrAZxNk9l8FBSxAQAEFCWWAQAxE9VlzM1GqAUvRkRBTY7ESiUFb0VJwHE4mqMTCmiP+uQJ1qm1QgqGJzRzjjAcKaOAABZSgo5IgaIbCB7RqSEGRQ4owNtl50prhCHC7xIJdUHKlmoUX4lijAQsT//Ttq5yh8GdEfp2AWV0ooUQnXyCMwAKo+J4nbVUpfRBB <template data-pop="k70-mallory" data-title="Corps de Mallory-Denk"><p class="lab">Nature</p><p>Inclusions éosinophiles des hépatocytes ballonnisés, faites surtout de kératines 8 et 18.</p><p class="lab">Valeur</p><p>Ils évoquent une stéatohépatite, mais ne sont pas spécifiques.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-pnpla3" data-title="Gène PNPLA3"><p class="lab">Rôle</p><p>Variants associés à un risque accru de lésions hépatiques alcooliques chez les sujets caucasiens.</p><p class="lab">Usage</p><p>C’est un facteur de risque, mais on ne recommande pas de le tester en routine.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>

<template data-pop="k70-wernicke" data-title="Encéphalopathie de Wernicke"><p class="lab">Cause</p><p>Elle est due à une carence en thiamine (vitamine B1).</p><p class="lab">Prévention</p><p>Vitamines du groupe B chez le patient alcoolique, notamment dans l’hépatite alcoolique.</p><p class="lab">Diagnostic différentiel</p><p>Il faut la distinguer de l’encéphalopathie hépatique et du sevrage.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-sevrage" data-title="Syndrome de sevrage alcoolique"><p class="lab">Traitement</p><p>Benzodiazépines (ou clométhiazole), à limiter à 10-14 jours (grade A1).</p><p class="lab">Risque</p><p>Si on prolonge les benzodiazépines, elles exposent à l’abus et à l’encéphalopathie.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-audit" data-title="Questionnaire AUDIT"><p class="lab">Contenu</p><p>Il comporte dix questions de l’OMS sur la consommation, la dépendance et les conséquences ; l’AUDIT-C reprend les trois premières, qui portent sur la consommation.</p><p class="lab">Usage</p><p>Dépistage du trouble de l’usage d’alcool (grade A1).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-cdt" data-title="Transferrine carboxy-déficiente"><p class="lab">Type</p><p>C’est un marqueur sérique indirect de consommation chronique excessive.</p><p class="lab">Limite</p><p>Sa sensibilité et sa spécificité sont modestes, et des facteurs de confusion existent.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-etg" data-title="Éthylglucuronide"><p class="lab">Type</p><p>C’est un métabolite direct de l’éthanol.</p><p class="lab">Fenêtre</p><p>Il reste détectable jusqu’à environ 80 h dans l’urine et jusqu’à 6 mois dans les cheveux.</p><p class="lab">Usage</p><p>Il sert à vérifier l’abstinence (grade A2).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-elasto" data-title="Élastographie impulsionnelle"><p class="lab">Usage</p><p>Mesure de la fibrose chez tout buveur excessif dépisté (grade A1).</p><p class="lab">Piège</p><p>L’inflammation d’une hépatite alcoolique surestime les valeurs.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-biopsie" data-title="Biopsie hépatique"><p class="lab">Indications (grade A1)</p><p>On la fait en cas d’incertitude diagnostique, de besoin d’un stadage précis ou d’essai clinique.</p><p class="lab">Voie</p><p>Transjugulaire dans l’hépatite alcoolique (troubles de la coagulation).</p><p class="lab">Rendement</p><p>Elle trouve un autre diagnostic dans 10 à 20 % des cas.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-stopah" data-title="Essai STOPAH"><p class="lab">Plan</p><p>Cet essai britannique de 2011-2014 a testé la prednisolone et la pentoxifylline dans l’hépatite alcoolique sévère.</p><p class="lab">Résultat</p><p>La prednisolone a réduit de façon limite la mortalité à 28 jours, sans aucun bénéfice au-delà d’un mois.</p><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1412278" target="_blank" rel="noopener">Thursz M. R. et al., Prednisolone or pentoxifylline for alcoholic hepatitis (STOPAH), N Engl J Med 2015;372:1619-1628</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-nutrition" data-title="Nutrition de l’hépatite alcoolique"><p class="lab">Objectifs (grade A2)</p><p>On vise ≥ 35-40 kcal/kg/j et 1,2-1,5 g/kg/j de protéines, d’abord par voie orale, car la dénutrition aggrave le pronostic.</p><p class="lab">Risque</p><p>Apport < 21,5 kcal/kg/j : mortalité et infections accrues.</p><p class="lab">Si échec</p><p>On passe à une nutrition entérale par sonde.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-tx" data-title="Transplantation hépatique"><p class="lab">Cirrhose alcoolique (grade A1)</p><p>Child-Pugh C et/ou MELD ≥ 15.</p><p class="lab">Abstinence</p><p>La règle des six mois ne suffit pas à elle seule ; une évaluation multidisciplinaire décide.</p><p class="lab">Hépatite sévère</p><p>Greffe précoce chez une minorité de non-répondeurs sélectionnés.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-d-prednisolone" data-title="Prednisolone"><p class="lab">Dose (EASL 2018)</p><p>On donne 40 mg/j pendant 28 jours, puis on arrête brutalement ou l’on décroît sur 3 semaines.</p><p class="lab">Contre-indication pratique</p><p>Infection active non contrôlée.</p><p class="lab">Statut suisse</p><p>L’hépatite alcoolique ne figure pas dans les indications de la FI, et la dose peut être réduite en cas de cirrhose.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Prednisolone Streuli®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k70-d-nac" data-title="N-acétylcystéine"><p class="lab">Principe</p><p>Elle restaure le glutathion et limite ainsi le stress oxydatif.</p><p class="lab">Place</p><p>On la donne par voie intraveineuse pendant 5 jours avec les corticoïdes (grade B2) ; seule, elle n’améliore pas la survie.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
<template data-pop="k70-d-acamprosate" data-title="Acamprosate (Campral®)"><p class="lab">Indication suisse</p><p>Il est autorisé pour maintenir l’abstinence après le sevrage, avec des mesures psychosociales.</p><p class="lab">Dose</p><p>2 comprimés 3 fois par jour, débuté vers le 5e jour d’abstinence, 6 à 12 mois.</p><p class="lab">Contre-indications</p><p>Il est contre-indiqué si la créatinine dépasse 120 µmol/l et pendant l’allaitement, et il demande de la prudence en Child-Pugh C.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Campral®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></template>
