<h1>Maladie alcoolique du foie</h1><span class="status">Adulte · stéatose, hépatite alcoolique, fibrose et cirrhose alcooliques, trouble de l’usage d’alcool · rédaction du 09.10.2026 · référentiels EASL maladie alcoolique du foie 2018, Baveno VII (2022), informations professionnelles suisses</span></div>

<section class="ilot" id="k70-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 48 ans, qui boit environ une bouteille de vin par jour depuis quinze ans, consulte pour un <button class="w" data-k="k70-ictere">ictère</button> apparu en trois semaines, avec fièvre modérée et amaigrissement. Or, elle n’a ni douleur biliaire ni prise de paracétamol. <b>La question est donc de savoir s’il s’agit d’une <button class="w" data-k="k70-ha">hépatite alcoolique</button>, si elle est sévère, et s’il faut la traiter par corticoïdes.</b></p><p>Pour y répondre, le médecin doit savoir : quantifier la consommation et dépister le <button class="w" data-k="k70-tua">trouble de l’usage d’alcool</button> ; distinguer <button class="w" data-k="k70-steatose">stéatose</button>, hépatite alcoolique et cirrhose ; mesurer la gravité par la <button class="w" data-k="k70-mdf">fonction discriminante de Maddrey</button> ou le <button class="w" data-k="k70-meld">score MELD</button> ; décider d’une corticothérapie et juger la réponse au septième jour par le <button class="w" data-k="k70-lille">score de Lille</button> ; enfin, organiser l’abstinence, qui détermine le pronostic à long terme.</p><div class="key"><b>Point de départ.</b> Ictère récent chez un buveur excessif : penser hépatite alcoolique, mesurer la gravité, rechercher l’infection, puis décider.</div></section>
<section class="ilot" id="k70-1"><h2><span class="n">1</span>Définition et spectre lésionnel</h2><p>La maladie alcoolique du foie regroupe les lésions hépatiques causées par une consommation excessive et prolongée d’alcool. Ainsi, l’EASL 2018 décrit un spectre qui va de la <button class="w" data-k="k70-steatose">stéatose</button> pure à la <button class="w" data-k="k70-sha">stéatohépatite alcoolique</button>, puis à la fibrose progressive, à la cirrhose et au carcinome hépatocellulaire. En outre, ces lésions coexistent souvent chez un même patient, si bien que le diagnostic clinique ne suffit pas toujours à les séparer.</p><p>Parmi ces formes, l’<button class="w" data-k="k70-ha">hépatite alcoolique</button> occupe une place à part. En effet, c’est un syndrome clinique d’<button class="w" data-k="k70-ictere">ictère</button> d’apparition récente, sous-tendu par une stéatohépatite, qui peut survenir sur un foie déjà cirrhotique. Par conséquent, la CIM-10-GM distingue la stéatose (K70.0), l’hépatite alcoolique (K70.1), la fibrose (K70.2), la cirrhose (K70.3), l’insuffisance hépatique alcoolique (K70.4) et la forme non précisée (K70.9).</p><table class="t"><tr><th>Forme</th><th>Lésion dominante</th><th>Réversibilité</th></tr><tr><td>Stéatose (K70.0)</td><td>Vacuoles lipidiques dans les hépatocytes</td><td>Réversible en quelques semaines d’abstinence</td></tr><tr><td>Hépatite alcoolique (K70.1)</td><td>Ballonnisation, corps de <button class="w" data-k="k70-mallory">Mallory-Denk</button>, polynucléaires</td><td>Partielle ; mortalité précoce si forme sévère</td></tr><tr><td>Fibrose (K70.2) et cirrhose (K70.3)</td><td>Fibrose périveinulaire puis septa et nodules</td><td>Fibrose partiellement réversible ; cirrhose au mieux stabilisée</td></tr></table><p>Le tableau se lit de haut en bas : en effet, chaque forme ajoute une lésion à la précédente, et la réversibilité diminue en conséquence.</p><div class="key"><b>À retenir.</b> Stéatose → stéatohépatite → fibrose → cirrhose → carcinome hépatocellulaire ; l’hépatite alcoolique est un syndrome aigu possible à chaque stade.</div><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></section>
<section class="ilot" id="k70-2"><h2><span class="n">2</span>Seuils de consommation et facteurs de risque</h2><p>Après la définition, il faut quantifier l’exposition. Ainsi, selon l’EASL 2018, le risque de maladie alcoolique du foie augmente au-delà de 30 g d’alcool par jour, ou au-delà de 7 unités par semaine chez la femme et de 14 unités chez l’homme ; de plus, à 100 g par jour, le risque relatif atteint 26. Par ailleurs, le diagnostic est évoqué dès une consommation régulière de plus de 20 g par jour chez la femme et de plus de 30 g par jour chez l’homme, associée à des anomalies cliniques ou biologiques hépatiques.</p><p>Cependant, tous les buveurs excessifs ne développent pas une maladie grave. En effet, environ 90 % d’entre eux ont une <button class="w" data-k="k70-steatose">stéatose</button>, mais une minorité seulement évolue vers la cirrhose. C’est pourquoi l’EASL insiste sur les cofacteurs : sexe féminin, obésité et insulinorésistance, tabagisme, surcharge en fer, hépatites virales et variants du gène <button class="w" data-k="k70-pnpla3">PNPLA3</button>. En outre, l’<button class="w" data-k="k70-ha">hépatite alcoolique</button> survient en général après des décennies de consommation lourde, supérieure à 80 g par jour.</p><div class="trap"><span class="k">Piège des unités</span>Une unité standard ne contient pas la même quantité d’alcool selon les pays ; la source EASL ne précise pas la valeur retenue. Le calcul en grammes (volume en ml × degré × 0,8 / 100) évite cette ambiguïté.</div><div class="key"><b>À retenir.</b> Risque au-delà de 30 g/j ; diagnostic évoqué au-delà de 20 g/j (femme) ou 30 g/j (homme) avec anomalies hépatiques ; cofacteurs : sexe féminin, obésité, tabac, fer, virus, PNPLA3.</div><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></section>
<section class="ilot" id="k70-3"><h2><span class="n">3</span>Physiopathologie</h2><p>Pour comprendre ces seuils, il faut suivre le métabolisme de l’éthanol. D’abord, l’alcool déshydrogénase puis l’aldéhyde déshydrogénase oxydent l’éthanol en acétaldéhyde, puis en acétate ; or, cette oxydation consomme du NAD⁺ et favorise la synthèse d’acides gras, d’où la <button class="w" data-k="k70-steatose">stéatose</button>. Ensuite, l’induction du cytochrome CYP2E1 produit des espèces réactives de l’oxygène ; de plus, l’éthanol épuise les antioxydants, notamment le glutathion.</p><p>Par conséquent, le stress oxydatif et l’acétaldéhyde lèsent l’hépatocyte. En outre, l’alcool augmente la perméabilité intestinale, et les endotoxines bactériennes activent les cellules de Kupffer, qui libèrent des cytokines et attirent les polynucléaires neutrophiles. Enfin, les cellules étoilées activées produisent du collagène autour des veinules centrolobulaires : c’est pourquoi la fibrose alcoolique débute typiquement dans la région périveinulaire.</p><div class="key"><b>À retenir.</b> Éthanol → acétaldéhyde, excès de NADH, stress oxydatif (CYP2E1), endotoxines → stéatose, inflammation neutrophile, fibrose périveinulaire.</div><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></section>
<section class="ilot" id="k70-4"><h2><span class="n">4</span>Présentation clinique</h2><p>La présentation dépend donc du stade. Ainsi, la <button class="w" data-k="k70-steatose">stéatose</button> est le plus souvent asymptomatique et découverte devant des enzymes hépatiques anormales ; de même, une fibrose avancée peut exister avec des tests hépatiques normaux. En revanche, l’<button class="w" data-k="k70-ha">hépatite alcoolique</button> se manifeste par un <button class="w" data-k="k70-ictere">ictère</button> progressif, souvent associé à de la fièvre, même sans infection, à un malaise, à un amaigrissement et à une dénutrition (EASL 2018).</p><p>De plus, l’examen recherche les signes de cirrhose et d’hypertension portale, ainsi que les atteintes extrahépatiques de l’alcool. En effet, l’alcool touche aussi le cœur, le pancréas, le rein et le système nerveux. Par conséquent, un trouble de la conscience chez ce patient évoque une encéphalopathie hépatique, mais aussi une <button class="w" data-k="k70-wernicke">encéphalopathie de Wernicke</button> ou un <button class="w" data-k="k70-sevrage">syndrome de sevrage</button>, qui doivent être écartés.</p><figure><img src="data:image/gif;base64,R0lGODdhWAL+AIYAAPLh2+zazOrXyevUzeHTvunPzunOuuDOwunIwuHHw+bGq9vHx9vFsOW/rOW3qN66quK6leG0k+Kxkd6xkdi/ude3sc+4tte4l9axleOsld+skNyskt6qh9mrmNmqjtmqh9mmhd6ijdqih9eii9ehgdqZiNaYg9OpmNOmhdOehdOYhdOUhNKWe82jkM2VgceekrybkdSOgNCMfM6Nf86Nds2IeciNgMiHe8iJcs2DeMiDdcaDc8SCcsZ+csV4cL6Ge799b755bbx1bbt0Z7tvaLV4b7RuZqV7eaZuabVoY7BoYq5oYatmYKZkXpRkZKVdWptbWY5aWn9ZXopRUnlOU2lSXmVJVV5FUmBASlQ/TUk9VEw2Rz41UT8tQDEwWC0jOAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWAL+AEAI/wCZMFlihMgQIwSNGFHCUImRgwoVElmYJCIRIUIMCgmCkYjBIRuDiAziw0cQgz189KjRIwiPGjJk1MCxgwcPHThy7tABk4aMGCZYCM1Jg4UIESZo0DCBlIUJElBJCIU69ahVERw0aABBgutUEF67cuDAFSpYsB8kQFgroe0EDx9QeFgLAYNdCAryXtibV++FBwogXLD74MHfBw0a5G1QeC9gBYwbJ2bAoEIFBgcCAAjAoHDizwkQCECQoHR <section class="ilot" id="k70-5"><h2><span class="n">5</span>Dépister le trouble de l’usage d’alcool</h2><p>Avant toute décision hépatologique, il faut nommer et évaluer la consommation. Ainsi, l’EASL recommande le terme de <button class="w" data-k="k70-tua">trouble de l’usage d’alcool</button>, défini par le DSM-5, plutôt que les termes stigmatisants d’« alcoolique » ou d’« abus ». De plus, le questionnaire <button class="w" data-k="k70-audit">AUDIT</button> ou sa version courte AUDIT-C doit servir au dépistage (grade A1), et le patient doit être examiné à la recherche de troubles psychiatriques et d’autres addictions.</p><p>Par ailleurs, les marqueurs biologiques complètent l’entretien. En effet, la GGT, le volume globulaire moyen et la <button class="w" data-k="k70-cdt">transferrine carboxy-déficiente</button> sont des marqueurs indirects ; en revanche, l’<button class="w" data-k="k70-etg">éthylglucuronide</button> urinaire ou capillaire est un marqueur direct qui permet de vérifier l’abstinence (grade A2). Enfin, le patient dépisté reçoit une intervention brève et est adressé à une équipe multidisciplinaire (grade A1).</p><div class="quiz ui"><p>Quel marqueur permet de documenter une abstinence sur plusieurs mois ?</p><button data-ok="0">GGT sérique</button><button data-ok="1">Éthylglucuronide dans les cheveux</button><button data-ok="0">ALAT sérique</button><p class="fb" hidden>L’éthylglucuronide capillaire reflète la consommation sur une fenêtre allant jusqu’à environ six mois ; l’urinaire, sur environ 80 heures (EASL 2018, tableau 5).</p></div><div class="key"><b>À retenir.</b> Terme : trouble de l’usage d’alcool (DSM-5). Dépistage : AUDIT ou AUDIT-C. Abstinence : éthylglucuronide urinaire ou capillaire. Intervention brève et équipe multidisciplinaire.</div><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-Mgmt-ALD.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines: Management of alcohol-related liver disease, J Hepatol 2018;69:154-181</a>.</p></section>
<section class="ilot" id="k70-6"><h2><span class="n">6</span>Démarche diagnostique de l’atteinte hépatique</h2><p>Une fois la consommation établie, il reste à mesurer l’atteinte hépatique. Ainsi, le bilan comporte la GGT, l’ALAT et l’ASAT, mais aussi un test de fibrose, par exemple l’<button class="w" data-k="k70-elasto">élastographie impulsionnelle</button>, car une fibrose avancée peut coexister avec des tests normaux (grade A1). De plus, toute anomalie conduit à une échographie, et d’autres causes sont recherchées : sérologies des hépatites B et C, ferritine et saturation de la transferrine notamment.</p><p>Cependant, l’alcool ne s’affirme pas par l’imagerie, qui ne sert qu’à décrire la <button class="w" data-k="k70-steatose">stéatose</button>, la cirrhose et ses complications. C’est pourquoi la <button class="w" data-k="k70-biopsie">biopsie hépatique</button> est requise en cas d’incertitude diagnostique, pour un stadage précis ou dans les essais (grade A1). En outre, si une cirrhose est présente, la recherche de varices suit les critères de Baveno, et une surveillance clinique, biologique et échographique est instaurée.</p><figure><img src="data:image/gif;base64,R0lGODdh4AGsAYUAAOvq7ezg6/3L8+7N5f627/6n6/Gv3/6b6P6S5f6K5/6K2viY3viK2uuS1P6C4f574P2A1f151f513f5w3P1y0feA1vd41Pdx0fF40OR4yv1p2/xp0/pqzftlzPxg1PpgyPtYzPJn0PJmxfJax+pgxtxfwvpPzPhOwOpOw/hDwuhDv/A0utk+vcQ4uMQcsZwOowAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA4AGsAUAI/wAbZGhAsIEBAxlKlCDhIcWKFS5csGjxouKLFiUoVmyBYsMEBwkgUOhwQoMGDx5QqFCBgkXEFixQnEyJIoSGDh9GkJiQYAILBwsMDBggUIJJEiUaCBBAYEEDDAouTECBwoQJCS4jao04sUQCDCFIkIhAYYPJDhwoXHhg4QLIBBYWjkABwgMIjiYePkyRwsQJqhweRLhQYeDSAAMOLrjAorFMDSEmrkQxQsOEDhs+nOCAecIFtxUUHjC4dOkBhXMbr2zMQiFSEQ4gLFRYofDAggQNECAwVPeCBRAuiHBrgQQHDgMLCFgQYgIIEx40tFTBYqVD6iUKJA4gwIBCEw4d6v8dz5flhAcPvpYIEWIDBQgRfLqwWJGFhoUYKlh4EGLEBqQCBADAgAEUaGCBABiYoICJLYDBCCf8hcIJIFB4Al9UiTCcBCS0MF9MHrjUwogWjThQUEMh1ttBJWSgQG4HCTXUjAc1IEKEOFanwggczKUCTNTtqCEHIpBAGYQ4qpBjhCqskAJ1ElFlAg
