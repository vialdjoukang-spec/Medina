<template data-pop="b18-ph-etv" data-title="Entécavir (Baraclude®) — monographie">
<p><b>Mécanisme.</b> Analogue nucléosidique de la guanosine, phosphorylé en triphosphate actif (demi-vie intracellulaire de 15 heures). Il inhibe les trois fonctions de la polymérase du VHB : amorçage, transcription inverse du brin négatif, synthèse du brin positif. Il n’inhibe que faiblement les polymérases humaines.</p>
<p><b>Preuves.</b> Dans les essais pivots de 48 semaines, l’ADN est devenu indétectable chez 67 % des 715 patients Ag HBe positifs et 90 % des 648 patients Ag HBe négatifs. Après sept ans, il l’était chez 96,8 % et 100 % des patients suivis. La résistance génotypique atteint 1,2 % à cinq ans chez le patient naïf, mais dépasse 50 % au-delà de cinq ans après une résistance à la lamivudine.</p>
<p><b>Posologie.</b> 0,5 mg par jour à jeun ; 1 mg en cas de résistance à la lamivudine ou de maladie décompensée. Adaptation si la clairance est inférieure à 50 mL/min.</p>
<p><b>Effets indésirables et précautions.</b> Bonne tolérance rénale et osseuse. Poussée d’hépatite possible sous traitement et après l’arrêt ; acidose lactique rare en maladie décompensée. Non recommandé chez la personne co-infectée par le VIH sans traitement antirétroviral efficace.</p>
<p><b>Contre-indication.</b> Hypersensibilité. Grossesse seulement en cas de nécessité absolue ; allaitement déconseillé.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57435" target="_blank" rel="noopener" data-reference-source="1">Baraclude®, mars 2026</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, tableau 10</a>.</p>
</template>

<template data-pop="b18-ph-etv-rein" data-title="Entécavir : adaptation à la fonction rénale">
<p>L’information professionnelle suisse adapte la dose selon la clairance de la créatinine. La solution buvable, une prise par jour, est préférée ; à défaut, l’intervalle s’allonge.</p>
<div class="table-wrap"><table class="t"><thead><tr><th>Clairance (mL/min)</th><th>Patient naïf</th><th>Résistance à la lamivudine ou décompensation</th></tr></thead><tbody>
<tr><td>≥ 50</td><td>0,5 mg/jour</td><td>1 mg/jour</td></tr>
<tr><td>30–49</td><td>0,25 mg/jour ou 0,5 mg/48 h</td><td>0,5 mg/jour ou 1 mg/48 h</td></tr>
<tr><td>10–29</td><td>0,15 mg/jour ou 0,5 mg/72 h</td><td>0,3 mg/jour ou 1 mg/72 h</td></tr>
<tr><td>&lt; 10, hémodialyse</td><td>0,05 mg/jour ou 0,5 mg tous les 5 à 7 jours</td><td>0,1 mg/jour ou 1 mg tous les 5 à 7 jours</td></tr>
</tbody></table></div>
<p>Le jour d’une hémodialyse, l’entécavir se donne après la séance. Les doses inférieures à 0,5 mg exigent la solution buvable, car les comprimés ne se divisent pas. Ces schémas reposent sur une extrapolation : la réponse virologique se contrôle étroitement.</p>
<p>Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57435" target="_blank" rel="noopener" data-reference-source="1">Baraclude®, mars 2026</a>.</p>
</template>

<template data-pop="b18-ph-tdf" data-title="Ténofovir disoproxil (Viread®) — monographie">
<p><b>Mécanisme.</b> Promédicament du ténofovir, analogue nucléotidique de l’adénosine monophosphate ; le ténofovir diphosphate termine la chaîne d’ADN viral. Il agit aussi sur le VIH.</p>
<p><b>Preuves.</b> À 48 semaines, l’ADN est devenu indétectable chez 76 % des patients Ag HBe positifs et 93 % des Ag HBe négatifs ; à sept ans, chez plus de 99 %. Aucune résistance n’a été observée après cinq ans.</p>
<p><b>Posologie.</b> 245 mg une fois par jour avec un repas. Toutes les 48 heures si la clairance est de 30 à 49 mL/min ; non recommandé de 10 à 29 mL/min ; contre-indiqué sous 10 mL/min sans dialyse et chez le dialysé.</p>
<p><b>Effets indésirables.</b> Tubulopathie proximale avec hypophosphatémie, protéinurie, rarement syndrome de Fanconi ; baisse de la densité minérale osseuse, souvent réversible. Sur 535 patients traités jusqu’à huit ans, 3,4 % ont nécessité une adaptation de dose.</p>
<p><b>Surveillance.</b> Clairance et phosphatémie à 2–4 semaines, 3 mois, puis tous les 3 à 6 mois ; éviter les médicaments néphrotoxiques.</p>
<p><b>Grossesse.</b> Plus de 1000 grossesses sans malformation ; allaitement possible.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56251" target="_blank" rel="noopener" data-reference-source="1">Viread®, juin 2024</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a>.</p>
</template>

<template data-pop="b18-ph-taf" data-title="Ténofovir alafénamide (Vemlidy®) — monographie">
<p><b>Mécanisme.</b> Précurseur phosphonamidate du ténofovir, capté par l’hépatocyte et activé par la carboxylestérase 1. L’activation intracellulaire réduit l’exposition systémique.</p>
<p><b>Preuves.</b> À 48 semaines, l’ADN est devenu indétectable chez 64 % des 581 patients Ag HBe positifs et 94 % des 285 Ag HBe négatifs, sans différence de suppression avec le ténofovir disoproxil ; l’ALAT se normalisait plus souvent. À cinq ans, 80,9 % et 92,4 %. Après 96 semaines, la baisse du débit de filtration et de la densité osseuse était moindre qu’avec le ténofovir disoproxil.</p>
<p><b>Posologie.</b> 25 mg une fois par jour avec un repas ; aucune adaptation dès 15 mL/min ou en hémodialyse (prise après la séance). Non recommandé si Child-Pugh B ou C.</p>
<p><b>Effets indésirables.</b> Élévation des lipides et prise de poids plus marquées qu’avec le ténofovir disoproxil.</p>
<p><b>Interactions.</b> Inducteurs de la glycoprotéine P (rifampicine, rifabutine, carbamazépine, phénytoïne, phénobarbital, millepertuis) : association non recommandée.</p>
<p><b>Grossesse.</b> 300 à 1000 grossesses exposées sans signal ; utilisation si le bénéfice justifie le risque.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66190" target="_blank" rel="noopener" data-reference-source="1">Vemlidy®, février 2024</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a>.</p>
</template>

<template data-pop="b18-ph-peg" data-title="Interféron pégylé α-2a (Pegasys®) — monographie">
<p><b>Mécanisme.</b> Immunomodulation (lymphocytes NK, T et B) et inhibition de plusieurs étapes du cycle viral, dont la transcription de l’ADNccc.</p>
<p><b>Indication suisse.</b> Hépatite chronique B de l’adulte sans décompensation, attestée par l’Ag HBs, l’ADN et les transaminases. L’hépatite D ne figure pas dans l’information professionnelle suisse ; l’EASL 2023 recommande pourtant 48 semaines d’interféron pégylé chez tout patient atteint d’hépatite D compensée sans contre-indication.</p>
<p><b>Posologie.</b> 180 µg une fois par semaine sous la peau, 48 semaines ; 135 µg en cas d’insuffisance rénale sévère.</p>
<p><b>Prédiction et arrêt.</b> Une faible charge virale, une ALAT de 2 à 5 fois la norme, un âge jeune, le sexe féminin et les génotypes A et B prédisent la réponse. Les règles d’arrêt reposent sur l’ADN et l’Ag HBs quantitatif aux semaines 12 et 24.</p>
<p><b>Contre-indications.</b> Hépatite auto-immune, cirrhose décompensée ou trouble hépatique grave, cardiopathie sévère ou instable, maladie psychiatrique sévère (notamment dépression), grossesse et allaitement.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=55585" target="_blank" rel="noopener" data-reference-source="1">Pegasys®, décembre 2023</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a> ; <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2023</a>.</p>
</template>

<template data-pop="b18-ph-sofvel" data-title="Sofosbuvir/velpatasvir (Epclusa®) — monographie">
<p><b>Mécanisme.</b> Sofosbuvir : promédicament nucléotidique, analogue de l’uridine qui termine la chaîne d’ARN synthétisée par la polymérase NS5B. Velpatasvir : inhibiteur de la NS5A. Activité pangénotypique.</p>
<p><b>Preuves.</b> Dans l’essai <b>ASTRAL-1</b> (2015), 12 semaines ont guéri 98 % des patients de génotype 1a (206 sur 210) et 100 % des patients de génotype 2. Dans l’essai <b>ASTRAL-4</b>, en cirrhose décompensée Child-Pugh B, l’ajout de ribavirine a porté la guérison du génotype 1a de 88 à 94 %. La SASL relève des taux supérieurs à 95 % pour tous les génotypes.</p>
<p><b>Posologie.</b> Un comprimé de 400/100 mg par jour, avec ou sans repas, 12 semaines. En cirrhose décompensée : avec ribavirine 12 semaines, ou 24 semaines sans ribavirine si celle-ci est impossible.</p>
<p><b>Rein : un écart entre deux sources de janvier 2021.</b> La SASL déconseille l’association sous 30 mL/min, car le sofosbuvir et son métabolite s’éliminent par le rein. L’information professionnelle suisse, de même date, l’autorise sans adaptation lorsqu’aucune alternative n’existe. Pour la dose et l’autorisation, l’information professionnelle fait foi ; le glécaprévir/pibrentasvir reste préférable s’il est utilisable.</p>
<p><b>Interactions.</b> Contre-indiqué avec les inducteurs puissants ; amiodarone seulement sans alternative ; inhibiteurs de la pompe à protons seulement si nécessaire ; rosuvastatine et digoxine à surveiller.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66095" target="_blank" rel="noopener" data-reference-source="1">Epclusa®, janvier 2021</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2020</a>.</p>
</template>

<template data-pop="b18-ph-glepib" data-title="Glécaprévir/pibrentasvir (Maviret®) — monographie">
<p><b>Mécanisme.</b> Glécaprévir : inhibiteur de la protéase NS3/4A, nécessaire au clivage de la polyprotéine. Pibrentasvir : inhibiteur de la NS5A. Activité pangénotypique.</p>
<p><b>Preuves.</b> Dans l’essai <b>ENDURANCE-1</b>, 8 semaines ont guéri 99 % des patients de génotype 1a et 100 % des génotypes 1b sans cirrhose. Dans l’essai <b>EXPEDITION-8</b>, 8 semaines ont guéri 98 % de 343 patients naïfs atteints de cirrhose compensée.</p>
<p><b>Posologie.</b> 300/120 mg (trois comprimés de 100/40 mg) en une prise avec de la nourriture. Patient naïf : 8 semaines, avec ou sans cirrhose compensée. Patient déjà traité : 8 à 16 semaines selon le génotype et la cirrhose. Aucune adaptation rénale, dialyse comprise.</p>
<p><b>Contre-indications.</b> Child-Pugh B ou C ou antécédent de décompensation ; inducteurs puissants ou modérés (dont l’éfavirenz) ; atazanavir, atorvastatine, simvastatine, dabigatran ; éthinylestradiol.</p>
<p><b>Effets indésirables.</b> Céphalées et fatigue.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66472" target="_blank" rel="noopener" data-reference-source="1">Maviret®, juin 2026</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2020</a>.</p>
</template>

<template data-pop="b18-ph-vosevi" data-title="Sofosbuvir/velpatasvir/voxilaprévir (Vosevi®) — rattrapage">
<p>Cette triple association ajoute un inhibiteur de protéase NS3/4A au sofosbuvir/velpatasvir. Un comprimé de 400/100/100 mg se prend une fois par jour au cours d’un repas.</p>
<p>La SASL la recommande pendant 12 semaines comme traitement de rattrapage après l’échec d’un schéma d’antiviraux directs. Elle est autorisée par Swissmedic mais n’était pas remboursée pour cette indication en 2021 ; la prise en charge se demande à l’assureur. Comme tout inhibiteur de protéase, elle est contre-indiquée en cirrhose Child-Pugh B ou C ; elle est déconseillée sous 30 mL/min et contre-indiquée avec l’amiodarone.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66510" target="_blank" rel="noopener" data-reference-source="1">Vosevi®, mars 2021</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a>.</p>
</template>

<template data-pop="b18-ph-blv" data-title="Bulévirtide (Hepcludex®) — monographie">
<p><b>Mécanisme.</b> Lipopeptide synthétique myristoylé de 47 acides aminés qui occupe le NTCP et bloque l’entrée du VHD et du VHB dans l’hépatocyte.</p>
<p><b>Preuves.</b> Dans l’essai <b>MYR202</b>, 24 semaines à 2 mg ont fait baisser l’ARN du VHD d’au moins 2 log₁₀ chez 53 % des patients, mais 89 % des répondeurs ont rechuté à l’arrêt. Dans l’essai <b>MYR301</b>, à 48 semaines, la baisse d’au moins 2 log₁₀ atteignait 71 % avec 2 mg ; l’ARN était indétectable chez 12 % et la réponse combinée virologique et biochimique atteignait 45 %. La dose de 10 mg n’apportait pas d’avantage.</p>
<p><b>Indication et posologie suisses.</b> Hépatite D chronique avec maladie compensée et ARN du VHD positif, chez l’adulte et l’enfant d’au moins 3 ans pesant au moins 10 kg. Adulte : 2 mg une fois par jour sous la peau (1,7 mg réellement délivrés). Durée optimale inconnue : le traitement se poursuit tant qu’il apporte un bénéfice ; son arrêt se discute après six mois de séroconversion HBs. Le VHB sous-jacent se traite selon ses propres indications.</p>
<p><b>Surveillance.</b> ARN du VHD tous les six mois ; après l’arrêt, à 1, 3, 6 et 12 mois. Exacerbation sévère possible à l’arrêt.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=68338" target="_blank" rel="noopener" data-reference-source="1">Hepcludex®, juillet 2026</a> ; <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2023</a>.</p>
</template>

<template data-pop="b18-ph-rbv" data-title="Ribavirine — usage et limites">
<p><b>Statut suisse.</b> Aucune information professionnelle suisse de ribavirine ne figure dans la base de Swissmedic consultée le 8 octobre 2026. Ses doses proviennent de l’information professionnelle d’Epclusa® et des recommandations de l’EASL.</p>
<p><b>VHC, cirrhose décompensée.</b> 1000 mg par jour sous 75 kg, 1200 mg au-delà, en deux prises au repas, avec le sofosbuvir/velpatasvir ; début à 600 mg en Child-Pugh C. Baisse par paliers de 200 mg si l’hémoglobine passe sous 10 g/dL, arrêt sous 8,5 g/dL.</p>
<p><b>VHE chronique du transplanté.</b> Monothérapie de 12 semaines si l’ARN persiste trois mois après sa détection ; prolongation à six mois si l’ARN reste détectable dans le sang ou les selles. Dans une série de 59 transplantés (dose médiane 600 mg par jour, durée médiane trois mois), 78 % ont été guéris.</p>
<p><b>Effets indésirables.</b> Anémie dose-dépendante, toux sèche, éruptions ; tératogénicité, qui impose une contraception efficace chez la patiente et la partenaire du patient.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66095" target="_blank" rel="noopener" data-reference-source="1">Epclusa®</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2020</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2018</a>.</p>
</template>

<template data-pop="b18-ph-amiodarone" data-title="Sofosbuvir et amiodarone : bradycardie grave">
<p><b>Mécanisme.</b> Plusieurs mécanismes sont proposés : inhibition de la glycoprotéine P, déplacement de la liaison aux protéines et effet direct sur les cardiomyocytes ou les canaux ioniques. La toxicité résulte probablement de leur combinaison.</p>
<p><b>Délai.</b> Quelques heures à quelques jours, parfois jusqu’à deux semaines ; certains patients ont nécessité un stimulateur cardiaque.</p>
<p><b>Conduite.</b> La SASL et l’EASL contre-indiquent l’association et demandent d’attendre au moins trois mois après l’arrêt de l’amiodarone, dont la demi-vie est très longue. L’information professionnelle suisse ne l’admet qu’en l’absence d’alternative : surveillance cardiaque hospitalière pendant 48 heures, puis contrôle quotidien de la fréquence cardiaque pendant deux semaines.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66095" target="_blank" rel="noopener" data-reference-source="1">Epclusa®</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2020</a>.</p>
</template>

<template data-pop="b18-ph-ipp" data-title="Inhibiteurs de la pompe à protons et velpatasvir">
<p>L’élévation du pH gastrique réduit l’absorption du velpatasvir. Pris en même temps, l’oméprazole 20 mg diminue l’exposition au sofosbuvir d’environ un tiers.</p>
<p>L’information professionnelle suisse n’admet l’association que si elle est absolument nécessaire : Epclusa® se prend alors avec de la nourriture, quatre heures avant l’inhibiteur, à une dose maximale équivalente à 20 mg d’oméprazole. La SASL formule la même limite de 20 mg, l’inhibiteur étant pris quatre heures après le comprimé.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66095" target="_blank" rel="noopener" data-reference-source="1">Epclusa®</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a>.</p>
</template>

<template data-pop="b18-ph-arret" data-title="Arrêter un analogue du VHB : conditions">
<p><b>Principe.</b> L’ADNccc persiste : l’arrêt expose à une rechute virale et à une poussée parfois sévère, voire mortelle. Il se décide avec un médecin expérimenté et une surveillance rapprochée garantie.</p>
<p><b>Situations où l’arrêt est recommandé ou possible.</b> Perte confirmée de l’Ag HBs (deux fois à six mois d’intervalle) : arrêt recommandé ; en cirrhose compensée, après au moins douze mois de consolidation. Personne initialement Ag HBe positive sans maladie avancée : arrêt possible douze mois après la séroconversion HBe avec ADN indétectable. Personne Ag HBe négative sélectionnée, sans maladie avancée : arrêt possible après trois à quatre ans d’ADN indétectable si l’Ag HBs est bas (moins de 1000 UI/mL chez les patients européens, moins de 100 UI/mL chez les patients asiatiques).</p>
<p><b>Situations où il est proscrit.</b> Cirrhose décompensée (sauf séroconversion anti-HBs), immunosuppression en cours.</p>
<p><b>Suivi.</b> ADN et ALAT tous les trois mois la première année, puis tous les six à douze mois ; l’information professionnelle de Baraclude® demande une surveillance d’au moins un an, les poussées survenant en médiane 23 à 24 semaines après l’arrêt.</p>
<p>Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, arrêt des analogues</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57435" target="_blank" rel="noopener" data-reference-source="1">Baraclude®</a>.</p>
</template>

<template data-pop="b18-ph-grossesse" data-title="Grossesse et antiviraux">
<div class="table-wrap"><table class="t"><thead><tr><th>Molécule</th><th>Grossesse</th><th>Allaitement</th></tr></thead><tbody>
<tr><td>Ténofovir disoproxil</td><td>Plus de 1000 grossesses sans malformation</td><td>Possible</td></tr>
<tr><td>Ténofovir alafénamide</td><td>300 à 1000 grossesses sans signal</td><td>Déconseillé par l’information suisse</td></tr>
<tr><td>Entécavir</td><td>Seulement si nécessité absolue</td><td>Déconseillé</td></tr>
<tr><td>Interféron pégylé, ribavirine</td><td>Contre-indiqués</td><td>Contre-indiqué (interféron)</td></tr>
<tr><td>Glécaprévir/pibrentasvir</td><td>Données absentes ou limitées</td><td>Risque non exclu</td></tr>
</tbody></table></div>
<p>Le tableau se lit avec l’objectif : chez la femme enceinte dont l’ADN atteint 200 000 UI/mL, le ténofovir prévient la transmission au nouveau-né, idéalement avant la 28<sup>e</sup> semaine, en complément du vaccin et des immunoglobulines à la naissance. L’entécavir se remplace par le ténofovir avant ou au début d’une grossesse.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56251" target="_blank" rel="noopener" data-reference-source="1">Viread®</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66190" target="_blank" rel="noopener" data-reference-source="1">Vemlidy®</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57435" target="_blank" rel="noopener" data-reference-source="1">Baraclude®</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=55585" target="_blank" rel="noopener" data-reference-source="1">Pegasys®</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=66472" target="_blank" rel="noopener" data-reference-source="1">Maviret®</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, grossesse</a>.</p>
</template>

<template data-pop="b18-ph-prophylaxie" data-title="Prophylaxie de la réactivation sous immunosuppression">
<p><b>Qui.</b> Porteur de l’Ag HBs exposé à un risque élevé ou modéré ; personne Ag HBs négative, anti-HBc positive et ADN négatif exposée à un risque élevé (destruction des lymphocytes B, greffe de cellules souches, chimiothérapie combinée à forte dose). Si le risque est faible ou modéré sans prophylaxie, l’ADN ou l’Ag HBs se contrôlent tous les trois mois ; la prophylaxie s’impose si cette surveillance n’est pas réalisable.</p>
<p><b>Quoi.</b> Entécavir, ténofovir disoproxil ou ténofovir alafénamide, aux doses habituelles.</p>
<p><b>Combien de temps.</b> Au moins 6 à 12 mois après la fin de l’immunosuppression ; au moins 18 mois après un traitement détruisant les lymphocytes B.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, tableau 14</a>.</p>
</template>

<template data-pop="b18-ph-pareto" data-title="Loi de Pareto — Pharmacologie de l’hépatite virale chronique">
<p class="ratio" data-cover="b18-p-1,b18-p-2,b18-p-3,b18-p-4,b18-p-5,b18-p-6"></p>
<ul>
<li>VHB : entécavir 0,5 mg à jeun, ténofovir disoproxil 245 mg ou alafénamide 25 mg au repas ; suppression sans guérison.</li>
<li>Rein ou os fragiles : ténofovir alafénamide ou entécavir ; grossesse : ténofovir disoproxil.</li>
<li>Entécavir et ténofovir disoproxil : adaptation sous 50 mL/min ; ténofovir disoproxil contre-indiqué en dialyse.</li>
<li>VHC : sofosbuvir/velpatasvir 12 semaines ou glécaprévir/pibrentasvir 8 semaines ; inhibiteurs de protéase interdits dès Child-Pugh B.</li>
<li>Amiodarone + sofosbuvir : bradycardie grave. Inducteurs : contre-indiqués. Maviret® : pas d’éthinylestradiol ni d’atorvastatine ou simvastatine.</li>
<li>VHD : bulévirtide 2 mg/jour sous la peau, maladie compensée ; interféron pégylé 48 semaines en option.</li>
<li>VHE : réduire l’immunosuppression, puis ribavirine 12 semaines.</li>
<li>Porteur de l’Ag HBs traité pour le VHC : analogue associé jusqu’à 12 semaines après la fin.</li>
<li>Arrêt d’un analogue : seulement encadré ; jamais en cirrhose décompensée ni sous immunosuppression.</li>
</ul>
</template>
