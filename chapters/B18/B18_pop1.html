<template data-pop="b18-e-adn" data-title="ADN du VHB : l’examen de référence de la virémie">
<p><b>Définition.</b> L’ADN du VHB se quantifie dans le sérum ou le plasma par amplification génique en temps réel. Le résultat s’exprime en unités internationales par millilitre (UI/mL), unité standardisée qui permet de comparer les laboratoires. La limite de détection des tests commerciaux est de 10 à 20 UI/mL.</p>
<p><b>Valeur.</b> L’EASL le qualifie d’examen de référence, parce que la virémie est un facteur pronostique indépendant de cirrhose et de carcinome hépatocellulaire. Il fonde l’indication thérapeutique (seuils de 2000 et 20 000 UI/mL selon la situation, 200 000 UI/mL pendant la grossesse) et mesure la réponse au traitement.</p>
<p><b>Pièges.</b> Une valeur unique ne classe pas la phase : la réplication fluctue, surtout chez la personne Ag HBe négative. Un ADN bas n’exclut pas une hépatite D, qui n’a besoin que de l’enveloppe du virus B. Pendant la fenêtre initiale de l’infection aiguë, l’ADN peut être positif alors que l’Ag HBs ne l’est pas encore.</p>
<p><b>Conséquence pratique.</b> L’ADN se mesure au diagnostic, tous les trois à six mois la première année, puis selon la phase ou sous traitement.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite B, 2025, tableau 5</a>.</p>
</template>

<template data-pop="b18-e-hbsag" data-title="Ag HBs : sensibilité, faux positifs et faux négatifs">
<p><b>Principe.</b> L’hépatocyte infecté sécrète l’Ag HBs en très grand excès ; l’antigène passe dans le sang et se détecte tôt. Les immunodosages actuels ont une limite de détection inférieure à 0,05 UI/mL ; des tests plus sensibles descendent sous 0,005 UI/mL.</p>
<p><b>Faux négatifs.</b> Certains variants de l’antigène échappent aux anticorps de certains réactifs. Un Ag HBs bas peut aussi s’observer lors d’une réactivation sous immunosuppression. L’anti-HBc et l’ADN du VHB résolvent ces discordances.</p>
<p><b>Faux positifs.</b> Ils surviennent chez l’hémodialysé, en présence d’anticorps hétérophiles ou sous facteur de croissance granulocytaire. Le test de neutralisation par l’anti-HBs, prévu par le fabricant, les écarte.</p>
<p><b>Conséquence pratique.</b> Un Ag HBs positif isolé et inattendu se confirme avant d’annoncer une infection. Deux résultats positifs à plus de six mois d’intervalle définissent la chronicité.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, dépistage</a>.</p>
</template>

<template data-pop="b18-e-antihbc" data-title="Anti-HBc total et IgM anti-HBc">
<p><b>Anti-HBc total.</b> Il apparaît après tout contact avec le virus et persiste. Les tests actuels détectent ensemble les IgM et les IgG ; leur spécificité dépasse 99,8 %. Il ne dit pas si l’infection est en cours ou résolue. Chez une personne Ag HBs négative, il signale un risque de réactivation sous immunosuppression.</p>
<p><b>IgM anti-HBc.</b> Elles sont très élevées dans l’hépatite B aiguë et disparaissent habituellement en six mois. Elles peuvent cependant réapparaître à faible concentration lors d’une poussée d’hépatite chronique. Leur valeur diagnostique isolée est donc limitée ; une concentration élevée oriente vers l’infection aiguë.</p>
<p><b>Piège.</b> Une hépatite aiguë avec IgM anti-HBc positives chez une personne d’origine endémique peut être une poussée d’infection chronique méconnue. Le contrôle de l’Ag HBs à six mois tranche.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, anti-HBc</a>.</p>
</template>

<template data-pop="b18-e-antihbs" data-title="Anti-HBs : immunité et seuils de protection">
<p><b>Définition.</b> L’anti-HBs neutralise l’Ag HBs. Il traduit une immunité naturelle après guérison ou une immunité vaccinale ; seul l’anti-HBc permet de distinguer les deux.</p>
<p><b>Seuils.</b> L’EASL définit la séroprotection par un taux d’au moins 10 UI/L. Chez les personnes à risque de forme grave, notamment immunodéprimées, le schéma est jugé optimal si l’anti-HBs atteint au moins 100 UI/L un à deux mois après la dernière dose. Entre 10 et 100 UI/L, une dose de rappel est suggérée dans ces groupes ; sous 10 UI/L, la vaccination complète est recommencée après avoir exclu une infection.</p>
<p><b>Usage.</b> L’anti-HBs n’est pas nécessaire au diagnostic chez le porteur de l’Ag HBs. Il documente la séroconversion après une perte de l’Ag HBs et aide à estimer le risque de réactivation.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, tableau 5 et vaccination</a>.</p>
</template>

<template data-pop="b18-e-hbe" data-title="Ag HBe et anti-HBe : la phase et ses mutants">
<p><b>Définition.</b> L’Ag HBe est une protéine sécrétée par le virus sauvage lorsqu’il se réplique. Sa présence situe l’infection en phase 1 ou 2 ; son absence avec un anti-HBe positif, en phase 3 ou 4.</p>
<p><b>Mécanisme du piège.</b> Après la séroconversion HBe, des mutations des régions précore ou promoteur basal du core suppriment ou réduisent la production d’Ag HBe. Le virus échappe ainsi à la réponse immunitaire dirigée contre cet antigène, tout en continuant à se répliquer : c’est l’hépatite chronique Ag HBe négative.</p>
<p><b>Données.</b> La séroconversion spontanée survient surtout avant 30 à 40 ans (âge moyen 31 ans). Lorsqu’elle survient sans besoin ultérieur de traitement, la perte de l’Ag HBs suit dans 38 à 45 % des cas en 25 ans.</p>
<p><b>Conséquence pratique.</b> L’Ag HBe et l’anti-HBe se contrôlent chaque année chez la personne Ag HBe positive, ou lorsque l’ADN ou l’ALAT changent nettement.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, suivi initial</a>.</p>
</template>

<template data-pop="b18-e-qhbs" data-title="Ag HBs quantitatif : un complément pronostique">
<p><b>Ce qu’il mesure.</b> La quantité d’antigène circulant, produit par l’ADNccc et par l’ADN viral intégré dans le génome de l’hépatocyte. Il ne remplace pas l’ADN du VHB.</p>
<p><b>Seuils utiles.</b> Chez la personne Ag HBe négative avec un ADN inférieur à 2000 UI/mL, un Ag HBs inférieur à 1000 UI/mL identifie l’infection peu active (exactitude de 85 à 94 %) ; inférieur à 100 UI/mL, il offre la meilleure spécificité. Un Ag HBs d’au moins 1000 UI/mL avec un ADN bas expose à un risque plus élevé de réactivation et, dans des cohortes asiatiques, de carcinome. Chez la personne Ag HBe positive, un taux très élevé (au-delà de 25 000 UI/mL) s’associe plutôt à une fibrose faible.</p>
<p><b>Usage thérapeutique.</b> Il guide l’interféron pégylé et sélectionne les rares candidats à l’arrêt d’un analogue.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, Ag HBs quantitatif</a>.</p>
</template>

<template data-pop="b18-e-nouveaux" data-title="Antigène apparenté à la capside et ARN du VHB">
<p>Ces marqueurs sériques reflètent le réservoir d’ADNccc transcriptionnellement actif dans le noyau des hépatocytes. Ils exigent une technologie spécialisée et ne servent pas encore au dépistage ni au diagnostic de routine.</p>
<p>L’antigène apparenté à la capside aide à repérer une virémie élevée chez la personne non traitée lorsque l’ADN n’est pas disponible. Avec l’ARN du VHB, il peut affiner la sélection des patients chez qui un arrêt d’analogue est envisagé ; l’EASL formule cette option avec une recommandation faible.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, nouveaux biomarqueurs viraux</a>.</p>
</template>

<template data-pop="b18-e-synthese" data-title="Albumine, INR, bilirubine et plaquettes : lire la fonction">
<p><b>Albumine et INR.</b> Le foie synthétise l’albumine et les facteurs de coagulation. Leur baisse, traduite par une albuminémie basse et un INR allongé, signale une perte de capacité de synthèse. Ces deux paramètres ont aussi des causes non hépatiques : ils se lisent avec le contexte et les autres tests.</p>
<p><b>Bilirubine.</b> Elle dépend de sa production, de sa conjugaison par l’hépatocyte et de son excrétion biliaire. Dans l’hépatite chronique, sa hausse avec un INR allongé témoigne d’une maladie avancée.</p>
<p><b>Plaquettes.</b> La fibrose les abaisse, alors qu’elle élève l’ASAT ; l’indice APRI exploite cette opposition. Elles entrent aussi dans le score PAGE-B et dans les critères de Baveno.</p>
<p><b>Conséquence.</b> Ces paramètres entrent dans le score de Child-Pugh, qui conditionne le choix des antiviraux du VHC.</p>
<p>Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, évaluation biochimique</a> ; <a href="https://doi.org/10.1053/jhep.2003.50346" target="_blank" rel="noopener" data-reference-source="1">Wai et coll., Hepatology 2003</a>.</p>
</template>

<template data-pop="b18-e-elasto" data-title="Élastographie : technique, seuils et pièges">
<p><b>Technique.</b> L’élastographie impulsionnelle contrôlée par vibration mesure la rigidité du foie en kilopascals, au moyen d’une sonde posée sur la peau. L’élastographie par ondes de cisaillement et l’imagerie par force de radiation acoustique sont des variantes ; leurs échelles diffèrent, et un seuil ne se transpose pas d’un appareil à l’autre.</p>
<p><b>Seuils.</b> Hépatite B : plus de 7, 8 et 11 kPa pour la fibrose significative, avancée et la cirrhose. Hépatite C : 10 kPa (fibrose avancée) et 13 kPa (cirrhose). Une rigidité inférieure à 10 kPa rend une maladie chronique avancée compensée improbable ; au-delà de 15 kPa, elle est très probable. Dans l’hépatite B, l’exclusion par le seuil de 10 kPa est moins sensible que dans les autres causes.</p>
<p><b>Pièges.</b> L’inflammation, l’obésité, un repas récent et la congestion élèvent la mesure. Une poussée surestime donc la fibrose. Après une guérison du VHC, la mesure ne sert plus à restadifier la fibrose.</p>
<p>Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, tableau 6</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2020, tableau 3</a>.</p>
</template>

<template data-pop="b18-e-fib4" data-title="FIB-4 et APRI : scores sanguins de fibrose">
<p><b>FIB-4.</b> Il se calcule ainsi : âge (années) × ASAT (U/L) divisé par plaquettes (G/L) × racine carrée de l’ALAT (U/L). Développé chez des patients co-infectés par le VIH et le VHC, il excluait une fibrose avancée sous 1,45 (valeur prédictive négative 90 %) et l’affirmait au-delà de 3,25 (spécificité 97 %).</p>
<p><b>APRI.</b> Il rapporte l’ASAT au nombre de plaquettes : la fibrose élève la première et abaisse les secondes. Dans l’hépatite C, un APRI de 1,0 détecte la cirrhose avec une sensibilité de 77 % ; un APRI de 2,0 l’affirme avec une spécificité de 94 %.</p>
<p><b>Limite dans l’hépatite B.</b> L’EASL 2025 rapporte qu’une analyse d’essais internationaux déconseille les seuils standards de ces scores dans l’hépatite B, en raison de classements erronés fréquents. Ils restent utiles quand l’élastographie manque.</p>
<p>Sources : <a href="https://doi.org/10.1002/hep.21178" target="_blank" rel="noopener" data-reference-source="1">Sterling et coll., Hepatology 2006</a> ; <a href="https://doi.org/10.1053/jhep.2003.50346" target="_blank" rel="noopener" data-reference-source="1">Wai et coll., Hepatology 2003</a> ; <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2020, tableau 3</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a>.</p>
</template>

<template data-pop="b18-e-biopsie" data-title="Biopsie hépatique : quand l’histologie change la décision">
<p>La biopsie mesure directement l’inflammation, la fibrose et les lésions associées comme la stéatose. L’EASL la réserve aux situations où son résultat modifiera la décision : incertitude diagnostique, tests non invasifs discordants, cause additionnelle suspectée (syndrome métabolique, alcool, auto-immunité).</p>
<p>En cirrhose avancée, le risque hémorragique augmente ; l’indication se pèse alors avec soin, d’autant que la cirrhose clinique suffit souvent à poser l’indication thérapeutique. Elle ne sert pas à suivre l’évolution de la fibrose.</p>
<p>Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a> ; <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2023, hépatite D</a>.</p>
</template>

<template data-pop="b18-e-baveno" data-title="Rigidité, plaquettes et varices : critères de Baveno">
<p>Chez le patient cirrhotique compensé, une rigidité inférieure à 20 kPa associée à des plaquettes supérieures à 150 G/L rend improbables les varices à haut risque. La gastroscopie de dépistage peut alors être évitée.</p>
<p>Ces critères restent valables sous traitement antiviral efficace. Lorsqu’un des deux critères manque, la rigidité de la rate, avec un seuil de 40 kPa validé chez 504 patients atteints de cirrhose liée au VHB, évite davantage d’endoscopies sans manquer plus de varices.</p>
<p>Après guérison du VHC, la SASL et l’EASL reprennent la même règle : plaquettes supérieures à 150 G/L et rigidité inférieure à 20 kPa dispensent d’endoscopie.</p>
<p>Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a>.</p>
</template>

<template data-pop="b18-e-echo" data-title="Échographie abdominale : diagnostic et surveillance">
<p><b>Au diagnostic.</b> Elle recherche une tumeur hépatique, une stéatose associée et des signes d’hypertension portale. Une image normale n’exclut pas une fibrose avancée.</p>
<p><b>En surveillance.</b> Elle se répète tous les six mois chez les personnes à risque de carcinome, par un opérateur expérimenté. La tomodensitométrie ou l’IRM avec produit de contraste la remplacent quand l’échographie ne fournit pas d’information fiable.</p>
<p><b>Piège.</b> Une surveillance normale antérieure n’exclut pas une lésion nouvelle ; l’intervalle de six mois ne se rallonge pas parce que l’ADN est indétectable.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, surveillance du carcinome hépatocellulaire</a>.</p>
</template>

<template data-pop="b18-e-pageb" data-title="Score PAGE-B : stratifier le risque de carcinome">
<p><b>Construction.</b> Le score additionne l’âge (0 à 10 points), le sexe (homme 6 points) et les plaquettes (0, 6 ou 9 points). Il a été développé chez des patients européens sous analogue nucléos(t)idique.</p>
<p><b>Lecture.</b> 0 à 9 : risque faible ; 10 à 17 : intermédiaire ; 18 ou plus : élevé. Selon l’EASL 2025, un score d’au moins 10 justifie la surveillance échographique semestrielle chez le porteur de l’Ag HBs non cirrhotique traité.</p>
<p><b>Exemple.</b> Un homme de 55 ans avec 150 G/L de plaquettes totalise 6 + 6 + 6 = 18 points : risque élevé.</p>
<p><b>Limites.</b> Le score se recalcule, car l’âge et les plaquettes évoluent. La version modifiée ajoute l’albumine ; d’autres modèles conviennent mieux aux populations asiatiques.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, tableaux 12 et 13</a>.</p>
</template>

<template data-pop="b18-e-afp" data-title="Alpha-fœtoprotéine : un complément, non un substitut">
<p>L’alpha-fœtoprotéine peut s’ajouter à l’échographie dans la surveillance du carcinome hépatocellulaire ; l’EASL formule cette option avec une recommandation faible. Elle ne remplace jamais l’imagerie.</p>
<p>Une valeur normale n’exclut pas une tumeur. La SASL mentionne son dosage semestriel avec l’échographie selon l’usage local après guérison du VHC.</p>
<p>Sources : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a>.</p>
</template>

<template data-pop="b18-e-vhd" data-title="Anti-VHD et ARN du VHD">
<p><b>Dépistage.</b> L’anti-VHD se recherche au moins une fois chez tout porteur de l’Ag HBs, puis à nouveau si les risques persistent ou si l’ALAT s’élève sans explication. Les groupes à risque comprennent les personnes originaires de régions de forte prévalence et les personnes exposées par voie sanguine ou sexuelle.</p>
<p><b>Confirmation.</b> L’anticorps persiste après la guérison ; l’ARN du VHD, mesuré par amplification génique sensible et standardisée, prouve l’infection active. Seuls 58,5 % des anti-VHD positifs ont un ARN détectable.</p>
<p><b>Piège technique.</b> Les tests d’ARN varient beaucoup selon l’extraction et les amorces, et certains sous-estiment fortement les génotypes africains. Le suivi quantitatif se fait dans le même laboratoire.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2023-06/EASL%20Clinical%20Practice%20Guidelines%20on%20hepatitis%20delta%20virus.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite D, 2023</a>.</p>
</template>

<template data-pop="b18-e-vhc" data-title="Anti-VHC, ARN et antigène de capside du VHC">
<p><b>Anti-VHC.</b> Test de première ligne par immunodosage. Il peut manquer en début d’infection et chez la personne profondément immunodéprimée. Il persiste après guérison : il ne diagnostique ni la virémie actuelle ni une réinfection.</p>
<p><b>ARN du VHC.</b> Il prouve la virémie ; la méthode doit détecter au plus 15 UI/mL. La plupart des personnes à traiter ont plus de 50 000 UI/mL. Dans la cohorte suisse de l’hépatite C, 3,5 % des patients non traités ont eu au moins une fois une charge inférieure ou égale à 1000 UI/mL.</p>
<p><b>Antigène de capside.</b> Il remplace l’ARN pour prouver la virémie, mais il est moins sensible (seuil équivalent à 500 à 3000 UI/mL d’ARN selon le génotype).</p>
<p><b>Réinfection.</b> Elle se suspecte devant un ARN qui réapparaît après une guérison chez une personne exposée.</p>
<p>Source : <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite C, 2020, diagnostic</a>.</p>
</template>

<template data-pop="b18-e-vhe" data-title="ARN du VHE chez la personne immunodéprimée">
<p>Chez la personne immunodéprimée, les anticorps anti-VHE sont souvent absents ; la détection de l’ARN par amplification génique, dans le sang et si possible dans les selles, est alors le seul moyen fiable de diagnostic.</p>
<p>Une virémie d’au moins trois mois définit l’hépatite E chronique. La charge virale suit ensuite la réponse à la réduction de l’immunosuppression ou à la ribavirine. En fin de traitement, l’ARN se recherche dans le sang et dans les selles : un ARN persistant dans les selles annonce un risque de rechute.</p>
<p>Source : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, hépatite E, 2018</a>.</p>
</template>

<template data-pop="b18-e-reponse" data-title="Réponse aux analogues : définitions et conduite">
<p>L’EASL définit la réponse chez le patient observant :</p>
<div class="table-wrap"><table class="t"><thead><tr><th>Réponse</th><th>Définition</th></tr></thead><tbody>
<tr><td>Complète</td><td>ADN indétectable (&lt; 20 UI/mL)</td></tr>
<tr><td>Partielle</td><td>ADN qui ne baisse plus et reste &gt; 2000 UI/mL</td></tr>
<tr><td>Absente</td><td>Baisse &lt; 1 log₁₀ à six mois</td></tr>
<tr><td>Résistance</td><td>Remontée ≥ 1 log₁₀ au-dessus du nadir</td></tr>
</tbody></table></div>
<p>Le tableau se lit avec l’observance : 30 à 40 % des échappements relèvent d’une mauvaise prise. Après un analogue nucléosidique (lamivudine, entécavir), l’EASL recommande le ténofovir ; après le ténofovir, le passage à l’entécavir ou son ajout. En cas de cirrhose, l’ADN doit être indétectable après douze mois de traitement.</p>
<p>Source : <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025, encadré 1</a>.</p>
</template>

<template data-pop="b18-e-rein" data-title="Surveillance rénale sous ténofovir disoproxil">
<p><b>Mécanisme.</b> Le ténofovir s’élimine par le rein. Le ténofovir disoproxil peut léser le tubule proximal : perte de phosphate, protéinurie, rarement syndrome de Fanconi.</p>
<p><b>Calendrier suisse.</b> L’information professionnelle impose la clairance de la créatinine avant le traitement, puis clairance et phosphatémie à 2–4 semaines, à 3 mois et tous les 3 à 6 mois. Une phosphatémie inférieure à 0,48 mmol/L ou une clairance inférieure à 50 mL/min impose un nouveau bilan dans la semaine.</p>
<p><b>Complément.</b> L’EASL ajoute chaque année phosphate et protéines urinaires, plus sensibles que la créatinine, qui dépend aussi de la masse musculaire.</p>
<p>Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56251" target="_blank" rel="noopener" data-reference-source="1">Viread®, juin 2024</a> ; <a href="https://easlcampus.eu/sites/default/files/2025-08/EASL_CPGs_on_management_of_HBV_infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2025</a>.</p>
</template>

<template data-pop="b18-e-svr" data-title="SVR12 et suivi après guérison du VHC">
<p><b>Définition.</b> ARN du VHC indétectable, par une méthode d’au plus 15 UI/mL, douze semaines après la fin du traitement. L’antigène de capside indétectable peut servir de critère si l’antigène était détectable au départ.</p>
<p><b>Portée.</b> La réponse virologique soutenue correspond à une guérison définitive dans la grande majorité des cas. La SASL considère le patient guéri si l’ARN est négatif 3 à 12 mois après la fin. L’EASL juge le contrôle facultatif avec les schémas pangénotypiques, sauf chez les personnes exposées à une réinfection.</p>
<p><b>Après la guérison.</b> Fibrose avancée ou cirrhose : surveillance du carcinome (voir l’onglet Pathologie). Exposition persistante : ARN tous les six à douze mois, car l’anticorps ne détecte pas la réinfection.</p>
<p>Sources : <a href="https://easl.eu/wp-content/uploads/2020/10/EASL-recommendations-on-treatment-of-hepatitis-C.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL 2020</a> ; <a href="https://www.sasl.unibas.ch/guidelines/SASL-SSG-SSI_EOS_HepC_Jan2021.pdf" target="_blank" rel="noopener" data-reference-source="1">SASL 2021</a>.</p>
</template>

<template data-pop="b18-e-pareto" data-title="Loi de Pareto — Examens de l’hépatite virale chronique">
<p class="ratio" data-cover="b18-e-1,b18-e-2,b18-e-3,b18-e-4,b18-e-5,b18-e-6,b18-e-7,b18-e-8"></p>
<ul>
<li>ADN du VHB quantitatif : examen de référence de la virémie et du pronostic.</li>
<li>Anti-HBc = contact ; Ag HBs = infection actuelle, chronique au-delà de six mois ; anti-HBs ≥ 10 UI/L = immunité.</li>
<li>Anti-HBc isolé avant immunosuppression : ADN du VHB.</li>
<li>Phase : Ag HBe, ADN (seuil 2000 UI/mL), Ag HBs (seuil 1000 UI/mL), ALAT répétées la première année.</li>
<li>Élastographie hépatite B : &gt; 7, 8, 11 kPa ; hépatite C : 10 et 13 kPa ; la poussée surestime.</li>
<li>Échographie semestrielle : cirrhose, fibrose avancée, VHD, antécédent familial, PAGE-B ≥ 10.</li>
<li>VHD, VHC, VHE : anticorps puis ARN ; ADN bas n’exclut pas le VHD.</li>
<li>Non-réponse : baisse &lt; 1 log₁₀ à six mois ; vérifier d’abord l’observance.</li>
<li>Ténofovir disoproxil : clairance et phosphatémie à 2–4 semaines, 3 mois, puis 3 à 6 mois.</li>
<li>SVR12 : ARN &lt; 15 UI/mL douze semaines après la fin.</li>
</ul>
