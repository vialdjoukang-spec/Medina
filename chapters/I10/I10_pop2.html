
<!-- ===== FENÊTRES I10 : clinique ===== -->
<template data-pop="i10-atcd-fam" data-title="Antécédents familiaux">
<div class="lab">Questions</div><p>« Vos parents, frères et sœurs sont-ils hypertendus ? À quel âge ? Quelqu’un a-t-il eu un accident vasculaire cérébral, un infarctus, une dialyse, une maladie rénale kystique, un phéochromocytome ? »</p>
<div class="lab">Pourquoi</div><p>Un parent hypertendu double environ le risque. Un accident vasculaire cérébral ou une hypertension sévère chez un apparenté jeune évoque une forme monogénique, en particulier un hyperaldostéronisme familial. La polykystose rénale est dominante. Un phéochromocytome familial oriente vers une néoplasie endocrinienne multiple de type 2, une maladie de von Hippel et Lindau ou un variant de la succinate déshydrogénase.</p></template>

<template data-pop="i10-atcd-preg" data-title="Antécédent de complication de grossesse">
<div class="lab">Questions</div><p>« Avez-vous eu une tension élevée, une prééclampsie, un diabète gestationnel, un accouchement prématuré ou un enfant de petit poids ? »</p>
<div class="lab">Pourquoi</div><p>Une prééclampsie double environ le risque cardiovasculaire ultérieur et multiplie par trois à quatre celui d’hypertension chronique. L’ESC 2024 en fait un modificateur de risque propre à la femme, comme la ménopause précoce et le syndrome des ovaires polykystiques.</p></template>

<template data-pop="i10-atcd-med" data-title="Médicaments et substances hypertensives">
<div class="lab">Exemple clinique</div><p>Femme de 58 ans, hypertendue contrôlée par une combinaison fixe ramipril/amlodipine. Elle revient à 162/98 mmHg. L’anamnèse ciblée révèle qu’elle prend de l’ibuprofène 400 mg trois fois par jour depuis trois semaines pour une gonarthrose et qu’on lui a prescrit de la venlafaxine il y a un mois. La créatinine a augmenté de 20 %. Les deux substances expliquent la perte de contrôle : l’anti-inflammatoire retient le sodium et bloque l’effet de l’IEC, la venlafaxine augmente le tonus noradrénergique. On remplace l’ibuprofène par le paracétamol et une prise en charge physique, on discute avec le psychiatre d’un antidépresseur neutre sur la pression, et on recontrôle avant de renforcer le traitement.</p>
<div class="lab">Autres causes à demander</div><p>Œstroprogestatifs, corticoïdes, décongestionnants sympathomimétiques, stimulants (méthylphénidate, amphétamines, cocaïne), ciclosporine et tacrolimus, anti-VEGF, érythropoïétine, réglisse, alcool, boissons énergisantes.</p></template>

<template data-pop="i10-s-cephal" data-title="Céphalées et hypertension">
<div class="lab">Ce qui est vrai</div><p>L’hypertension chronique modérée ne provoque en général pas de céphalées.</p>
<div class="lab">Quand la céphalée est hypertensive</div><p>Céphalée occipitale matinale d’une hypertension sévère ; céphalée intense avec confusion, troubles visuels ou convulsions de l’encéphalopathie ; céphalée paroxystique avec sueurs et palpitations du phéochromocytome.</p>
<div class="lab">Piège</div><p>Une douleur élève la pression, et non l’inverse. Une céphalée « en coup de tonnerre » avec pression élevée impose d’abord une imagerie cérébrale (hémorragie méningée).</p></template>

<template data-pop="i10-s-ronfl" data-title="Symptômes d’apnées du sommeil">
<div class="lab">À rechercher</div><p>Ronflement, pauses respiratoires constatées par le conjoint, réveils avec étouffement, nycturie, céphalées matinales, sommeil non réparateur, somnolence (score d’Epworth).</p>
<div class="lab">Questionnaire</div><p><button class="w" data-k="i10-saos">STOP-BANG</button> : un score ≥ 3 justifie une polygraphie.</p>
<div class="lab">Physiopathologie</div><p>Chaque apnée provoque une hypoxie et une décharge sympathique ; la pression monte la nuit et le profil nocturne s’inverse.</p></template>

<template data-pop="i10-s-triade" data-title="Triade du phéochromocytome">
<div class="lab">Description</div><p>Céphalées, sueurs profuses et palpitations, par crises de quelques minutes à une heure, avec pâleur et pression parfois très élevée. Complète, la triade est rare mais très spécifique.</p>
<div class="lab">Déclencheurs</div><p>Effort, palpation abdominale, miction (paragangliome vésical), anesthésie, métoclopramide, glucocorticoïdes, bêtabloquant seul.</p>
<div class="lab">Autres présentations</div><p>Hypertension permanente résistante, hypotension orthostatique paradoxale (hypovolémie), cardiomyopathie de stress, hyperglycémie, masse surrénalienne découverte fortuitement.</p>
<div class="lab">Diagnostic différentiel</div><p>Attaque de panique, hyperthyroïdie, sevrage alcoolique, hypoglycémie, migraine, sympathomimétiques.</p></template>

<template data-pop="i10-s-crampes" data-title="Symptômes d’hypokaliémie">
<div class="lab">Clinique et ECG</div><p>Faiblesse, crampes, constipation, polyurie ; onde T aplatie, onde U, intervalle QU allongé, extrasystoles.</p>
<div class="lab">Signification</div><p>Une hypokaliémie spontanée, ou disproportionnée sous faible dose de thiazidique, oriente vers un excès minéralocorticoïde ; elle doit être corrigée avant le rapport aldostérone/rénine.</p></template>

<template data-pop="i10-e-taille" data-title="Tour de taille">
<div class="lab">Technique</div><p>Debout, à mi-distance entre le rebord costal et la crête iliaque, en fin d’expiration, mètre horizontal.</p>
<div class="lab">Seuils et sens</div><p>Cible ESC 2024 : &lt; 94 cm (homme), &lt; 80 cm (femme) d’origine européenne. La graisse viscérale active les systèmes sympathique et rénine-angiotensine et prédit le risque mieux que l’indice de masse corporelle seul.</p></template>

<template data-pop="i10-e-pouls-fem" data-title="Pouls fémoraux et coarctation">
<div class="lab">Technique</div><p>Palpation simultanée radiale et fémorale ; pression au bras et à la cheville. Un retard radio-fémoral, un pouls fémoral faible, une pression plus basse aux jambes qu’aux bras (au lieu d’être plus haute) et un souffle interscapulaire évoquent une coarctation. À examiner une fois chez tout hypertendu jeune.</p></template>

<template data-pop="i10-e-souffle" data-title="Souffle abdominal">
<div class="lab">Technique et valeur</div><p>Auscultation de l’épigastre et des flancs, patient couché. Un souffle systolodiastolique latéralisé est assez spécifique d’une sténose de l’artère rénale ; un souffle systolique court et médian est fréquent chez le sujet mince. Sensibilité faible.</p></template>

<template data-pop="i10-e-fo" data-title="Fond d’œil et rétinopathie hypertensive"><figure><img src="images/cardiologie/i10_retinopathie_hypertensive.gif" alt="Photographie de fond d’œil montrant une rétinopathie hypertensive" width="480" height="480" loading="lazy" decoding="async">
<figcaption>Rétinopathie hypertensive au fond d’œil. Photographie de Frank Wood, CC BY 3.0, Wikimedia Commons ; convertie pour l’atlas.</figcaption></figure><p>Cette photographie réelle montre ce que le fond d’œil révèle : l’hypertension rétrécit les artérioles rétiniennes puis lèse leur paroi, ce qui provoque des hémorragies, des exsudats et, au stade le plus grave, un œdème papillaire. Comme la rétine est le seul endroit où l’on voit directement des artérioles, son examen renseigne sur l’atteinte microvasculaire des autres organes.</p>
<div class="lab">Technique</div><p>Ophtalmoscopie, idéalement après dilatation, ou photographie ; en urgence, l’ophtalmoscopie directe suffit souvent à voir un œdème papillaire.</p>
<div class="lab">Lésions et valeur</div><p>Rétrécissement artériolaire et signe du croisement (chroniques, peu reproductibles) ; hémorragies en flammèches, nodules cotonneux, exsudats (sévères) ; œdème papillaire. Hémorragies, nodules et œdème papillaire définissent l’hypertension maligne.</p></template>

<template data-pop="i10-e-cushing" data-title="Signes cliniques du syndrome de Cushing">
<div class="lab">Discriminants</div><p>Vergetures pourpres larges (&gt; 1 cm), ecchymoses, amyotrophie proximale, érythrose faciale.</p>
<div class="lab">Piège</div><p>La première cause est iatrogène : corticoïdes oraux, inhalés, cutanés ou infiltrés, à demander avant tout dosage.</p></template>

<!-- ===== FENÊTRES I10 : causes secondaires ===== -->
<template data-pop="i10-saos" data-title="Apnées obstructives du sommeil et hypertension">
<div class="lab">Dépistage</div><p>Questionnaire STOP-BANG (score ≥ 3), profil nocturne non abaissé, polygraphie ventilatoire ; index d’apnées-hypopnées 5–14/h léger, 15–29/h modéré, ≥ 30/h sévère.</p>
<div class="lab">Traitement</div><p>Ventilation en pression positive continue, perte de poids, orthèse d’avancée mandibulaire. La ventilation améliore la somnolence et baisse modestement la pression, davantage chez les patients observants et résistants.</p>
<div class="lab">Priorité</div><p>Chez l’adulte jeune obèse hypertendu, l’ESC 2024 fait commencer le bilan étiologique par les apnées.</p></template>

<template data-pop="i10-hap" data-title="Hyperaldostéronisme primaire">
<div class="lab">Formes</div><p>Hyperplasie bilatérale (la plus fréquente), adénome producteur d’aldostérone (syndrome de Conn), formes familiales rares.</p>
<div class="lab">Démarche</div><p>Rapport aldostérone/rénine → test de confirmation (sauf forme franche) → tomodensitométrie → cathétérisme des veines surrénaliennes si une chirurgie est envisagée. Seuils : îlot 4 de l’onglet Examens.</p>
<div class="lab">Traitement</div><p>Forme unilatérale : surrénalectomie laparoscopique, qui guérit l’hypokaliémie et améliore ou guérit l’hypertension. Forme bilatérale ou patient non opérable : spironolactone, dont la dose est ajustée jusqu’à ce que la rénine ne soit plus freinée, signe d’un blocage suffisant du récepteur (Endocrine Society 2025, co-parrainée par les sociétés européennes d’endocrinologie et d’hypertension). En cas de gynécomastie, l’éplérénone est une alternative, hors indication autorisée en Suisse.</p></template>

<template data-pop="i10-rar" data-title="Rapport aldostérone/rénine">
<div class="lab">Question clinique</div><p>L’aldostérone est-elle inappropriée à une rénine freinée ?</p>
<div class="lab">Conditions</div><p>Matin, deux heures après le lever, assis depuis 5 à 15 minutes, kaliémie normalisée, sel libre, médicaments notés. Seuils et interférences : îlot 4 de l’onglet Examens.</p>
<div class="lab">Piège</div><p>Un rapport élevé avec une aldostérone basse et une rénine effondrée n’est pas un hyperaldostéronisme : le dénominateur minuscule gonfle le rapport. Il faut exiger une aldostérone non freinée.</p></template>

<template data-pop="i10-parench" data-title="Hypertension rénoparenchymateuse">
<div class="lab">Causes et mécanismes</div><p>Néphropathie diabétique, glomérulonéphrites, polykystose, néphropathies interstitielles, uropathie obstructive. Réduction néphronique et activation rénine-angiotensine et sympathique.</p>
<div class="lab">Dépistage</div><p>Créatinine, bandelette, albumine/créatinine, échographie rénale ; protéinurie abondante ou hématurie : glomérulopathie.</p></template>

<template data-pop="i10-sar" data-title="Sténose des artères rénales">
<div class="lab">Indices</div><p>Hypertension avant 30 ans ou sévère après 55 ans, aggravation brutale, hypokaliémie, créatinine + 30 % sous IEC ou ARA II, asymétrie rénale &gt; 1,5 cm, œdème pulmonaire « flash », souffle abdominal.</p>
<div class="lab">Dysplasie fibromusculaire</div><p>Femme jeune ; atteinte moyenne et distale, « collier de perles » ; dissections et anévrismes d’autres territoires (carotides, vertébrales) à rechercher. Angioplastie au ballon sans stent.</p>
<div class="lab">Athérome</div><p>Traitement médical optimal (bloqueur du système rénine-angiotensine sous surveillance, statine, antiagrégant, arrêt du tabac) ; revascularisation seulement pour œdème pulmonaire « flash » récidivant, insuffisance rénale rapidement progressive ou hypertension réfractaire (ASTRAL, CORAL).</p></template>

<template data-pop="i10-cushing" data-title="Syndrome de Cushing : dépistage">
<div class="lab">Quand le chercher</div><p>Signes discriminants, ostéoporose ou diabète inhabituels pour l’âge, incidentalome surrénalien, hypertension résistante avec phénotype évocateur.</p>
<div class="lab">Démarche</div><p>Deux tests anormaux sur trois (onglet Examens), puis dosage de l’ACTH : basse, origine surrénalienne ; normale ou haute, origine hypophysaire ou ectopique. Hypertension par action minéralocorticoïde du cortisol en excès, synthèse d’angiotensinogène et sensibilité accrue aux catécholamines.</p></template>

<template data-pop="i10-pheo" data-title="Phéochromocytome et paragangliome">
<div class="lab">Quand le chercher</div><p>Crises adrénergiques, hypertension paroxystique ou résistante, incidentalome surrénalien, syndrome génétique, antécédent familial, réaction hypertensive à l’anesthésie ou à un médicament.</p>
<div class="lab">Diagnostic</div><p>Métanéphrines plasmatiques libres en décubitus, puis imagerie (tomodensitométrie ou IRM ; tomographie par émission de positons pour les formes extrasurrénaliennes, métastatiques ou génétiques).</p>
<div class="lab">Traitement</div><p>Chirurgie après une à deux semaines d’alpha-blocage (phénoxybenzamine ou doxazosine) avec apport hydrosodé ; bêtabloquant seulement ensuite, si tachycardie. Test génétique pour tous.</p>
<div class="lab">Piège</div><p>Un bêtabloquant seul supprime la vasodilatation β2 et laisse la vasoconstriction α sans opposition : crise hypertensive possible.</p></template>

<template data-pop="i10-coarct" data-title="Coarctation de l’aorte">
<div class="lab">Clinique et examens</div><p>Rétrécissement de l’isthme, associé à une bicuspidie aortique dans une grande partie des cas, au syndrome de Turner et aux anévrismes intracrâniens ; aspect en « 3 » de l’aorte et encoches costales à la radiographie ; hypertension aux bras, pouls fémoraux faibles et retardés. Échocardiographie ; IRM ou angioscanner, référence.</p>
<div class="lab">Suivi</div><p>Stent ou chirurgie ; l’hypertension persiste ou réapparaît chez de nombreux opérés : suivi à vie par mesure ambulatoire.</p></template>

<template data-pop="i10-pseudo" data-title="Pseudo-hyperaldostéronisme">
<div class="lab">Définition</div><p>Tableau d’excès minéralocorticoïde (hypertension, hypokaliémie, alcalose) avec rénine <b>et</b> aldostérone basses : le récepteur ou le canal sodique est activé par autre chose que l’aldostérone.</p>
<div class="lab">Exemple clinique</div><p>Homme de 63 ans, hypertension récente à 168/100 mmHg, kaliémie 2,9 mmol/L, rénine et aldostérone effondrées. Il consomme chaque jour depuis deux mois un demi-sachet de réglisse en bâtons pour arrêter de fumer. L’acide glycyrrhizique inhibe la 11β-hydroxystéroïde déshydrogénase de type 2 : le cortisol active le récepteur minéralocorticoïde. Arrêt de la réglisse, potassium, spironolactone transitoire ; normalisation en quelques semaines.</p>
<div class="lab">Autres causes</div><p>Syndrome de Liddle (amiloride), excès apparent de minéralocorticoïdes congénital, Cushing sévère ou ectopique, hyperplasies congénitales des surrénales par déficit en 11β- ou 17α-hydroxylase.</p></template>

<template data-pop="i10-mono" data-title="Hypertensions monogéniques">
<div class="lab">Quand y penser</div><p>Hypertension avant 30 ans, histoire familiale d’hypertension précoce ou d’accident vasculaire cérébral jeune, dyskaliémie, rénine basse.</p>
<div class="lab">Logique commune</div><p>Presque toutes augmentent la réabsorption rénale de sodium : toutes ont une rénine basse. Aldostérone élevée : hyperaldostéronismes familiaux. Aldostérone et kaliémie basses : Liddle, excès apparent de minéralocorticoïdes, hyperplasies congénitales. Aldostérone basse et kaliémie élevée : Gordon. Chacune a un traitement ciblé et justifie un dépistage familial.</p></template>

<template data-pop="i10-mnemo-abcde" data-title="Aide-mémoire des causes secondaires, de A à E">
<p><b>A</b> — <i>Accuracy</i> : exactitude de la mesure ; <i>Apnea</i> : apnées ; <i>Aldosteronism</i> : hyperaldostéronisme.<br>
<b>B</b> — <i>Bruits</i> : sténose de l’artère rénale ; <i>Bad kidneys</i> : néphropathie.<br>
<b>C</b> — <i>Catecholamines</i> : phéochromocytome ; <i>Coarctation</i> ; <i>Cushing</i>.<br>
<b>D</b> — <i>Drugs</i> : médicaments ; <i>Diet</i> : sel, alcool, réglisse.<br>
<b>E</b> — <i>Erythropoietin</i> ; <i>Endocrine</i> : thyroïde, parathyroïdes, acromégalie.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique anglo-saxon (Onusko, <i>American Family Physician</i> 2003), non critère officiel ; il rappelle de vérifier la mesure et l’observance avant tout bilan coûteux.</p></template>

<template data-pop="i10-dosage" data-title="Dosage des antihypertenseurs (observance)">
<div class="lab">Principe</div><p>Recherche des médicaments prescrits ou de leurs métabolites dans le sang ou les urines, par chromatographie couplée à la spectrométrie de masse, sur un prélèvement non annoncé à l’avance.</p>
<div class="lab">Résultats</div><p>Chez les patients à hypertension résistante apparente, une non-observance partielle ou totale est retrouvée dans une proportion importante des cas selon les séries. Un médicament indétectable alors qu’il devrait l’être signe une non-prise.</p>
<div class="lab">Usage</div><p>Avant d’ajouter un quatrième médicament, de prescrire un bilan coûteux ou de discuter une dénervation rénale. Le résultat se présente sans jugement, comme le point de départ d’une discussion sur les obstacles (effets indésirables, nombre de comprimés, croyances).</p>
<div class="lab">Limites</div><p>Reflète seulement les dernières prises ; disponibilité limitée à certains laboratoires hospitaliers.</p></template>
