<section class="ilot" id="i10-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 54 ans, employé de bureau, consulte pour un certificat d’aptitude sportive. Il n’a aucune plainte. L’assistante médicale mesure 152/96 mmHg au bras droit. La question qui structure le chapitre est la suivante : <b>ce chiffre traduit-il une hypertension réelle, quel risque fait-elle courir à ce patient, existe-t-il une cause curable, et quel traitement réduira ce risque sans lui nuire ?</b></p>
<p>L’hypertension est la maladie chronique que le médecin assistant rencontrera le plus souvent, dans toutes les disciplines. Elle est presque toujours asymptomatique ; sa gravité tient à ses conséquences : accident vasculaire cérébral, infarctus, insuffisance cardiaque, fibrillation auriculaire, insuffisance rénale, déclin cognitif. Le traitement ne soulage donc pas un symptôme : il prévient des événements.</p>
<p>À la fin du chapitre, le médecin assistant sait mesurer la pression et confirmer le diagnostic hors du cabinet, estimer le risque, rechercher les atteintes d’organe et les causes secondaires, construire un traitement par combinaison fixe jusqu’à la cible, reconnaître une hypertension résistante et distinguer l’urgence hypertensive de l’élévation sévère sans atteinte aiguë. Le référentiel principal est l’ESC 2024, mis en regard de l’ESH 2023, dont des auteurs suisses ont coordonné la rédaction.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i10-natripress">natriurèse de pression (le rein fixe le niveau tensionnel à long terme)</button>, le <button class="w" data-k="i10-sraa">système rénine-angiotensine-aldostérone (régulation hormonale du volume et du tonus)</button> et le <button class="w" data-k="i10-baro">baroréflexe (régulation nerveuse à court terme)</button>, développés dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i10-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>La pression artérielle est une variable continue : le risque cardiovasculaire augmente de façon linéaire dès environ 115/75 mmHg. Toute définition de l’hypertension est donc une convention, qui fixe le seuil là où le traitement apporte plus de bénéfice que de risque. C’est pourquoi les seuils ont changé au fil des essais thérapeutiques.</p>
<h3>1.1 Les trois catégories de l’ESC 2024</h3>
<p>La nouveauté de l’ESC 2024 est la catégorie <b>« pression artérielle élevée »</b> : une zone intermédiaire où le médicament dépend du risque cardiovasculaire global, et non du seul chiffre.</p>
<table class="t"><tr><th>Catégorie (ESC 2024)</th><th>Cabinet</th><th>Automesure et mesure ambulatoire diurne</th><th>Conséquence</th></tr>
<tr><td>Non élevée</td><td>&lt; 120/70 mmHg</td><td>&lt; 120/70 mmHg</td><td>Mode de vie sain</td></tr>
<tr><td>Élevée</td><td>120–139/70–89 mmHg</td><td>120–134/70–84 mmHg</td><td>Mode de vie ; médicament si risque suffisamment élevé et pression ≥ 130/80 mmHg après trois mois</td></tr>
<tr><td>Hypertension</td><td>≥ 140/90 mmHg</td><td>≥ 135/85 mmHg</td><td>Mode de vie et médicament</td></tr></table>
<p class="src">Une seule des deux composantes suffit à classer. Seuils sur 24 heures et nocturnes : îlot 4.</p>
<h3>1.2 Les grades de l’ESH 2023</h3>
<table class="t"><tr><th>Catégorie (ESH 2023)</th><th>Systolique (mmHg)</th><th></th><th>Diastolique (mmHg)</th></tr>
<tr><td>Optimale</td><td>&lt; 120</td><td>et</td><td>&lt; 80</td></tr>
<tr><td>Normale</td><td>120–129</td><td>et/ou</td><td>80–84</td></tr>
<tr><td>Normale haute</td><td>130–139</td><td>et/ou</td><td>85–89</td></tr>
<tr><td>Hypertension de grade 1</td><td>140–159</td><td>et/ou</td><td>90–99</td></tr>
<tr><td>Hypertension de grade 2</td><td>160–179</td><td>et/ou</td><td>100–109</td></tr>
<tr><td>Hypertension de grade 3</td><td>≥ 180</td><td>et/ou</td><td>≥ 110</td></tr>
<tr><td>Hypertension systolique isolée</td><td>≥ 140</td><td>et</td><td>&lt; 90</td></tr></table>
<div class="trap"><span class="k">Piège</span>Les deux référentiels coexistent en Suisse. Ils s’accordent sur le seuil de 140/90 mmHg au cabinet et sur la cible de 120 à 129 mmHg chez la plupart des patients traités. Ils divergent sur trois points : le traitement de la zone 130–139 mmHg (plus large pour l’ESC), la place des bêtabloquants en première ligne (conservée par l’ESH) et le dépistage de l’hyperaldostéronisme primaire (à envisager chez tout hypertendu confirmé pour l’ESC 2024, classe IIa ; ciblé pour l’ESH). Il faut savoir nommer le référentiel utilisé. Aucune prise de position publiée de la Société suisse d’hypertension sur l’ESC 2024 n’a été trouvée ; la recommandation de médecine de famille mediX (révisée en 2024 et 2025) et la plateforme « Guidelines Schweiz » de la FMH s’appuient sur l’ESC 2024.</div>
<h3>1.3 Phénotypes selon le lieu de mesure</h3>
<p>Le croisement de la pression au cabinet et hors du cabinet définit quatre phénotypes : normotension vraie, <button class="w" data-k="i10-blouse">hypertension de la blouse blanche (élevée seulement au cabinet)</button>, <button class="w" data-k="i10-masquee">hypertension masquée (normale seulement au cabinet)</button> et hypertension soutenue (îlot 4).</p>
<h3>1.4 Classification étiologique et codage CIM-10-GM</h3>
<p>L’hypertension <b>primaire</b>, ou essentielle, n’a pas de cause unique identifiable (environ 90 % des cas) ; l’hypertension <b>secondaire</b> a une cause identifiable, parfois curable.</p>
<table class="t"><tr><th>Code</th><th>Libellé</th><th>Précision utile</th></tr>
<tr><td>I10.-</td><td>Hypertension essentielle</td><td>I10.0- bénigne, I10.1- maligne, I10.9- sans précision ; cinquième caractère : 0 sans, 1 avec crise hypertensive (ex. I10.01)</td></tr>
<tr><td>I11.-</td><td>Cardiopathie hypertensive</td><td>I11.0- avec insuffisance cardiaque</td></tr>
<tr><td>I12.-</td><td>Néphropathie hypertensive (néphroangiosclérose)</td><td>I12.0- avec insuffisance rénale</td></tr>
<tr><td>I13.-</td><td>Cardionéphropathie hypertensive</td><td>Atteinte cardiaque et rénale associées</td></tr>
<tr><td>I15.-</td><td>Hypertension secondaire</td><td>I15.0- vasculo-rénale ; I15.1- rénoparenchymateuse ; I15.2- endocrinienne</td></tr></table>
<h3>1.5 Hypertension résistante</h3>
<p>Une hypertension est <b>résistante</b> lorsque la pression reste ≥ 140/90 mmHg au cabinet, confirmée hors du cabinet, malgré trois classes d’antihypertenseurs de mécanismes différents, dont un diurétique, à dose optimale ou maximale tolérée, avec une observance vérifiée et une cause secondaire exclue. Sans ces vérifications, on parle de résistance apparente (îlot 12).</p>
</section>

<section class="ilot" id="i10-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>L’hypertension est le premier facteur de risque modifiable de décès dans le monde. Sa prévalence augmente fortement avec l’âge, par rigidification artérielle : une minorité des adultes jeunes, une majorité des plus de 65 ans.</p>
<h3>2.1 Données suisses</h3>
<ul><li><b>Enquête suisse sur la santé 2022</b> (Office fédéral de la statistique, environ 22 000 répondants) : 19,5 % des 15 ans et plus déclarent une hypertension (22,4 % des hommes) ; 33,9 % sans formation postobligatoire contre 15,9 % avec un diplôme tertiaire. Une déclaration sous-estime une maladie silencieuse.</li>
<li><b>Étude suisse sur le sel 2022–2023</b> (Office fédéral de la sécurité alimentaire et des affaires vétérinaires, 863 participants à Lausanne, Berne, Zurich et Bellinzone) : 24 % avaient une pression ≥ 140/90 mmHg ou un traitement (32 % des hommes, 15 % des femmes). Sel mesuré sur les urines de 24 heures : 8,7 g/jour en moyenne (9,9 g chez l’homme, 7,4 g chez la femme), pour une cible de 5 g.</li>
<li><b>Étude Bus Santé, Genève 2005–2023</b> (11 278 participants, publication 2025) : prévalence mesurée passée de 38,9 % à 35,2 % ; 42,2 % des hypertendus non contrôlés en fin de période ; 57,7 % des hommes jeunes hypertendus ignoraient leur maladie.</li></ul>
<h3>2.2 Pronostic</h3>
<p>Chaque élévation de 20 mmHg de la systolique (ou de 10 mmHg de la diastolique) au-dessus de 115/75 mmHg double approximativement la mortalité cardiovasculaire (Prospective Studies Collaboration, 61 cohortes, 2002). À l’inverse, une baisse de 10 mmHg de la systolique réduit d’environ 20 % les événements cardiovasculaires majeurs, de 27 % les accidents vasculaires cérébraux et de 28 % l’insuffisance cardiaque (méta-analyse d’Ettehad, <i>Lancet</i> 2016). Le bénéfice relatif est similaire quel que soit le niveau de départ ; le bénéfice absolu croît avec le risque initial.</p>
<div class="key"><b>Corrélation épidémiologie → décision.</b> Le bénéfice absolu est le produit du risque de base par la réduction relative. C’est pourquoi l’ESC 2024 ne traite par médicament la zone élevée (130–139 mmHg) que chez les patients à risque suffisamment élevé : SCORE2 ou SCORE2-OP ≥ 10 %, maladie cardiovasculaire, maladie rénale chronique, diabète, atteinte d’organe ou hypercholestérolémie familiale. Chez eux, la même baisse tensionnelle prévient beaucoup plus d’événements.</div>
<div class="trap"><span class="k">Lacune documentaire</span>La Suisse n’a pas de registre national mesurant la prévalence, le traitement et le contrôle de l’hypertension selon une méthode standardisée. Les données ci-dessus proviennent d’une enquête déclarative, d’une étude nutritionnelle multicentrique et d’une cohorte cantonale.</div>

</section>

<section class="ilot" id="i10-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La pression artérielle moyenne est le produit du débit cardiaque par les résistances vasculaires périphériques. Chez le sujet jeune, le débit et le tonus sympathique dominent souvent ; chez l’hypertendu établi, les résistances sont élevées et le débit normal ; chez le sujet âgé, la rigidité des grosses artères devient le mécanisme principal. La chaîne à retenir : <b>terrain génétique et environnement → rein qui excrète mal le sodium, activation neurohormonale → résistances élevées et remodelage artériel → atteintes d’organe.</b></p>
<h3>3.1 Le rein fixe le niveau tensionnel à long terme</h3>
<p>Chez le sujet normal, une hausse de pression augmente aussitôt l’excrétion rénale de sodium et d’eau ; le volume sanguin diminue et la pression revient à l’équilibre. C’est la <button class="w" data-k="i10-natripress">natriurèse de pression (relation entre pression artérielle et excrétion sodée)</button>. Une hypertension durable exige que cette relation soit déplacée : le rein n’excrète alors l’apport sodé qu’à une pression plus élevée. Exemple : dans l’hyperaldostéronisme primaire, l’aldostérone en excès force la réabsorption du sodium ; l’équilibre sodé n’est retrouvé qu’à une pression plus haute.</p>

<div class="key"><b>Corrélation physiologie → thérapeutique.</b> Les thiazidiques, la restriction sodée et les antagonistes de l’aldostérone ramènent la courbe vers la gauche ou réduisent l’apport effectif en sel. Les bloqueurs du système rénine-angiotensine redonnent de la pente à la courbe, car l’angiotensine II est le principal signal de rétention sodée quand la pression monte. Traiter l’hypertension, c’est d’abord permettre au rein d’excréter le sel à une pression plus basse.</div>
<h3>3.2 Sensibilité au sel et systèmes neurohormonaux</h3>
<p>La <button class="w" data-k="i10-sel">sensibilité au sel (hausse tensionnelle induite par un apport sodé)</button> est plus marquée chez le sujet âgé, le patient d’ascendance africaine, l’obèse, le diabétique et l’insuffisant rénal ; chez eux, réduire le sel baisse davantage la pression et potentialise les bloqueurs du système rénine-angiotensine. Le <button class="w" data-k="i10-sraa">système rénine-angiotensine-aldostérone</button> est souvent inadapté : la rénine n’est pas freinée malgré la pression élevée. L’<button class="w" data-k="i10-sympa">hyperactivité sympathique (obésité, apnées du sommeil, stress)</button> augmente la fréquence, la vasoconstriction et la sécrétion de rénine. Le <button class="w" data-k="i10-baro">baroréflexe</button> se recale en quelques jours sur des valeurs élevées : il amortit les variations mais ne corrige pas l’hypertension chronique.</p>
<h3>3.3 Les artères : résistances et rigidité</h3>
<p>Dans les artérioles, l’élévation chronique de pression entraîne un <button class="w" data-k="i10-remod-vasc">remodelage artériolaire (lumière rétrécie, paroi épaissie)</button> et une raréfaction capillaire : les résistances deviennent structurelles. C’est pourquoi une hypertension ancienne se normalise lentement, même après la cure d’une cause secondaire. Dans l’aorte, l’âge et l’hypertension remplacent l’élastine par du collagène. La <button class="w" data-k="i10-rigid">rigidité artérielle (onde de pouls rapide, pression différentielle élevée)</button> explique l’<b>hypertension systolique isolée</b> du sujet âgé : la systolique monte, la diastolique baisse, la perfusion coronaire diastolique en souffre.</p>
<h3>3.4 Des mécanismes aux atteintes d’organe</h3>
<p>La postcharge élevée provoque une <button class="w" data-k="i10-hvg">hypertrophie ventriculaire gauche (adaptation puis maladie)</button>, une dysfonction diastolique, une dilatation de l’oreillette gauche, puis une fibrillation auriculaire et une insuffisance cardiaque à fraction préservée : c’est la cardiopathie hypertensive (I11). Au rein, la <button class="w" data-k="i10-nephroangio">néphroangiosclérose (lésion des artérioles rénales)</button> donne une albuminurie puis une baisse de la filtration (I12). Au cerveau, l’atteinte des artères perforantes produit des lacunes, des hémorragies profondes, une leucopathie et un déclin cognitif. La rétine montre directement l’atteinte artériolaire.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Le sujet jeune à diastolique élevée et fréquence rapide a souvent une hypertension « à débit », à composante sympathique. Le sujet âgé à systolique élevée et diastolique basse a une hypertension « de rigidité » ; chez lui, une diastolique sous 60 à 70 mmHg peut compromettre la perfusion coronaire, et l’hypotension orthostatique est à rechercher.</div>

<section class="ilot" id="i10-4"><h2><span class="n">4</span>Mesurer la pression artérielle</h2>
<p>Le diagnostic engage un traitement de plusieurs décennies et repose sur une mesure dont les erreurs sont fréquentes et systématiques. La mesure est un acte technique codifié.</p>
<h3>4.1 Au cabinet</h3>
<p>La <button class="w" data-k="i10-mes-cab">mesure standardisée au cabinet (conditions, technique, erreurs)</button> se fait assis, dos appuyé, bras soutenu à hauteur du cœur, jambes décroisées, après cinq minutes de repos et en silence, avec un appareil validé et un brassard adapté. On fait trois mesures à une ou deux minutes d’intervalle et on retient la moyenne des deux dernières. À la première consultation, on mesure aux deux bras : une <button class="w" data-k="i10-e-bras">différence ≥ 10 mmHg (sténose de la sous-clavière, risque accru)</button> impose de retenir le bras le plus élevé. On recherche une <button class="w" data-k="i10-ortho">hypotension orthostatique (baisse ≥ 20/10 mmHg à 1 ou 3 minutes)</button> avant tout début ou renforcement du traitement (ESC 2024, classe I).</p>
<div class="trap"><span class="k">Erreur fréquente</span>Mesurer un bras obèse avec un brassard standard : un brassard trop petit surestime la pression. Parler, laisser le bras pendre, mesurer dès l’arrivée ou vessie pleine l’élèvent aussi. Une mesure isolée ne suffit jamais au diagnostic, sauf pression très élevée avec atteinte d’organe.</div>
<h3>4.2 Hors du cabinet</h3>
<p>L’ESC 2024 recommande de confirmer le diagnostic hors du cabinet chaque fois que possible.</p>
<div class="two">
<div class="card"><h4>Mesure ambulatoire sur 24 heures</h4><p>La <button class="w" data-k="i10-mapa">MAPA (protocole, validité, lecture)</button> enregistre la pression pendant les activités et le sommeil. Elle est la <b>référence diagnostique</b> et seule à mesurer la <button class="w" data-k="i10-dipper">pression nocturne et le profil jour-nuit</button>, puissant marqueur pronostique.</p></div>
<div class="card"><h4>Automesure à domicile</h4><p>L’<button class="w" data-k="i10-auto">automesure (3 à 7 jours, matin et soir)</button> est peu coûteuse, répétable et favorise l’adhésion ; elle sert au suivi. Elle ne mesure pas la nuit et dépend de la rigueur du patient.</p></div></div>

<h3>4.3 Blouse blanche et hypertension masquée</h3>
<table class="t"><tr><th></th><th>Hors cabinet normale</th><th>Hors cabinet élevée</th></tr>
<tr><th>Cabinet normal</th><td>Normotension vraie</td><td><b>Hypertension masquée</b> : risque proche de l’hypertension soutenue, souvent méconnue</td></tr>
<tr><th>Cabinet élevé</th><td><b>Hypertension de la blouse blanche</b> : risque intermédiaire</td><td>Hypertension soutenue</td></tr></table>
<p>L’<button class="w" data-k="i10-blouse">hypertension de la blouse blanche</button> concerne un quart à un tiers des pressions élevées au cabinet, surtout chez le sujet âgé et la femme. Elle précède souvent une hypertension soutenue : on la surveille hors du cabinet, sans médicament si le risque global est faible. L’<button class="w" data-k="i10-masquee">hypertension masquée</button> échappe au dépistage ; on la soupçonne devant une pression de cabinet dans la zone élevée avec une atteinte d’organe inexpliquée, chez le diabétique, le fumeur, l’insuffisant rénal ou l’apnéique.</p>
<div class="trap"><span class="k">Piège</span>Chez le patient traité existent les mêmes discordances : hypertension non contrôlée « de la blouse blanche » ou « masquée ». Intensifier sur le seul chiffre du cabinet expose dans le premier cas à l’hypotension ; se fier au cabinet laisse le second cas sans protection. En fibrillation auriculaire, l’ESC 2024 recommande des mesures auscultatoires manuelles répétées.</div>

<section class="ilot" id="i10-5"><h2><span class="n">5</span>Étiologies et causes secondaires</h2>
<h3>5.1 Hypertension primaire</h3>
<p>Elle résulte de l’interaction de très nombreux variants génétiques de faible effet et de l’environnement : âge, hérédité, excès de sel, déficit en potassium, obésité abdominale, alcool, sédentarité, stress chronique, faible niveau socio-économique et, chez la femme, complications hypertensives de grossesse. C’est un diagnostic d’exclusion, raisonnable après un bilan de base normal.</p>
<h3>5.2 Hypertension secondaire : quand la chercher</h3>
<p>Une cause secondaire est retrouvée chez environ 10 % des hypertendus, davantage en cas de résistance. On ne la cherche ni chez tous par une batterie d’examens, ni jamais : on la cherche devant des signaux précis.</p>
<div class="two">
<div class="card"><h4>Signaux qui imposent une recherche</h4><ul><li>Hypertension avant 40 ans (classe I, ESC 2024) ; chez l’adulte jeune obèse, commencer par les apnées du sommeil</li><li>Hypertension résistante ou aggravation brutale</li><li>Grade 3 ou urgence hypertensive</li><li>Hypokaliémie spontanée ou sous diurétique</li><li>Atteinte d’organe disproportionnée</li></ul></div>
<div class="card"><h4>Indices orientant vers une cause</h4><ul><li>Créatinine + 30 % sous IEC ou ARA II : sténose de l’artère rénale</li><li>Œdème pulmonaire « flash » récidivant : sténose bilatérale des artères rénales</li><li>Céphalées, sueurs, palpitations paroxystiques : phéochromocytome</li><li>Ronflement, somnolence : apnées du sommeil</li><li>Vergetures pourpres, amyotrophie : Cushing</li><li>Pouls fémoraux faibles : coarctation</li></ul></div></div>
<table class="t"><tr><th>Cause</th><th>Fréquence chez l’hypertendu</th><th>Indice clé</th><th>Dépistage</th></tr>
<tr><td><button class="w" data-k="i10-saos">Apnées obstructives du sommeil</button></td><td>Très fréquentes (jusqu’à la moitié des résistances)</td><td>Obésité, ronflement, hypertension nocturne</td><td>Questionnaire, polygraphie</td></tr>
<tr><td><button class="w" data-k="i10-hap">Hyperaldostéronisme primaire</button></td><td>5 à 10 %, jusqu’à 20 % des résistances</td><td>Souvent normokaliémique</td><td>Rapport aldostérone/rénine</td></tr>
<tr><td><button class="w" data-k="i10-parench">Néphropathie parenchymateuse</button></td><td>2 à 10 %</td><td>Créatinine, protéinurie, hématurie</td><td>Filtration, bandelette, albumine/créatinine, échographie</td></tr>
<tr><td><button class="w" data-k="i10-sar">Sténose des artères rénales</button></td><td>1 à 10 % selon le terrain</td><td>Athérome diffus, ou femme jeune</td><td>Doppler, angioscanner, angio-IRM</td></tr>
<tr><td><button class="w" data-k="i10-atcd-med">Médicaments et substances</button></td><td>Fréquents, souvent contributifs</td><td>Anamnèse ciblée</td><td>Arrêt d’essai</td></tr>
<tr><td>Dysthyroïdie, hyperparathyroïdie</td><td>Rares comme cause unique</td><td>Signes thyroïdiens, hypercalcémie</td><td>Thyréostimuline, calcémie</td></tr>
<tr><td><button class="w" data-k="i10-cushing">Syndrome de Cushing</button></td><td>&lt; 1 %</td><td>Phénotype, diabète, ostéoporose</td><td>Freinage minute par dexaméthasone</td></tr>
<tr><td><button class="w" data-k="i10-pheo">Phéochromocytome et paragangliome</button></td><td>0,1 à 0,6 %</td><td>Paroxysmes, pression labile</td><td>Métanéphrines plasmatiques libres</td></tr>
<tr><td><button class="w" data-k="i10-coarct">Coarctation de l’aorte</button></td><td>Rare, adulte jeune</td><td>Gradient bras-jambes</td><td>Échocardiographie, IRM</td></tr></table>
<p class="src">Fréquences indicatives d’après l’ESH 2023 et l’ESC 2024. L’aide-mémoire <button class="w" data-k="i10-mnemo-abcde">ABCDE des causes secondaires (aide pédagogique)</button> structure l’anamnèse.</p>
<h3>5.3 Hyperaldostéronisme primaire : la cause curable la plus fréquente</h3>
<p>C’est une production autonome d’aldostérone, non freinée par le sel ni par la pression : adénome unilatéral (syndrome de Conn), curable par surrénalectomie, ou hyperplasie bilatérale, traitée par un antagoniste minéralocorticoïde. L’hypokaliémie manque dans la majorité des cas. À pression égale, ces patients ont davantage de fibrillation auriculaire, d’accidents vasculaires cérébraux et d’hypertrophie ventriculaire, car l’aldostérone est toxique par elle-même pour le cœur, les vaisseaux et le rein. Le dépistage par le <button class="w" data-k="i10-rar">rapport aldostérone/rénine (conditions, interférences, seuils)</button> est <b>à envisager chez tout hypertendu confirmé (ESC 2024, classe IIa)</b> ; la Société d’endocrinologie américaine (2025) suggère aussi un dépistage universel. L’ESH 2023 le réserve aux situations évocatrices : résistance, hypokaliémie, incidentalome surrénalien, fibrillation auriculaire inexpliquée, apnées, grade 2 ou 3, antécédent familial d’hypertension ou d’accident vasculaire cérébral avant 40 ans.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure à l’absence d’hyperaldostéronisme sur un rapport normal obtenu sous spironolactone ou chez un patient hypokaliémique. Antagonistes minéralocorticoïdes et diurétiques élèvent la rénine ; l’hypokaliémie freine l’aldostérone. On corrige d’abord la kaliémie et on interprète le rapport selon le traitement en cours.</div>
<h3>5.4 Sténose des artères rénales</h3>
<p>La sténose <b>athéromateuse</b> (environ 90 %) touche le sujet âgé polyvasculaire ; les essais ASTRAL (2009) et CORAL (2014) n’ont pas montré de bénéfice du stent par rapport au traitement médical optimal. La <b>dysplasie fibromusculaire</b> touche surtout la femme de moins de 50 ans (aspect en « collier de perles ») ; l’angioplastie sans stent peut guérir l’hypertension. La revascularisation d’une sténose athéromateuse ne se discute qu’en cas d’œdème pulmonaire « flash » récidivant, d’insuffisance rénale rapidement progressive ou d’hypertension réellement réfractaire.</p>
<h3>5.5 Médicaments et substances</h3>
<p>L’anamnèse médicamenteuse est le dépistage le moins coûteux : anti-inflammatoires non stéroïdiens, œstroprogestatifs, décongestionnants sympathomimétiques, corticoïdes, venlafaxine, stimulants, cocaïne, ciclosporine, tacrolimus, anti-VEGF, érythropoïétine, réglisse et alcool. Exemples et mécanismes : fiche <button class="w" data-k="i10-atcd-med">médicaments et substances hypertensives</button>.</p>

<section class="ilot" id="i10-6"><h2><span class="n">6</span>Anamnèse</h2>
<p>Elle a trois objectifs : estimer le risque global, chercher des symptômes d’atteinte d’organe et repérer les indices d’une cause secondaire. Elle précise aussi ce que le patient sait et craint de son traitement, car l’adhésion détermine le succès.</p>
<h3>6.1 Antécédents</h3>
<div class="two">
<ul><li><button class="w" data-k="i10-atcd-fam">Antécédents familiaux (hypertension précoce, accident vasculaire jeune, néphropathie)</button></li><li>Tabac, diabète, dyslipidémie, obésité, sédentarité</li><li>Maladie cardiovasculaire ou rénale établie</li></ul>
<ul><li><button class="w" data-k="i10-atcd-preg">Complication de grossesse (prééclampsie, diabète gestationnel)</button></li><li><button class="w" data-k="i10-atcd-med">Médicaments, substances et habitudes</button></li><li>Ancienneté, valeurs antérieures, traitements essayés et effets indésirables ; sel, activité, sommeil, stress</li></ul></div>
<h3>6.2 Symptômes</h3>
<p>La plupart des hypertendus n’ont aucun symptôme ; on cherche surtout ceux des atteintes d’organe et des causes secondaires.</p>
<div class="two">
<ul><li><button class="w" data-k="i10-s-cephal">Céphalées (rarement dues à l’hypertension elle-même)</button></li><li>Dyspnée d’effort, palpitations : cardiopathie, fibrillation auriculaire</li><li>Angor, claudication, déficit neurologique transitoire, troubles cognitifs</li></ul>
<ul><li><button class="w" data-k="i10-s-ronfl">Ronflement, pauses respiratoires, somnolence (apnées)</button></li><li><button class="w" data-k="i10-s-crampes">Crampes, faiblesse, polyurie (hypokaliémie)</button></li><li><button class="w" data-k="i10-s-triade">Céphalées, sueurs et palpitations paroxystiques (phéochromocytome)</button></li></ul></div>
<div class="trap"><span class="k">Piège</span>« Je sens quand ma tension monte. » Ces patients associent à tort une céphalée ou une anxiété à la pression et ajustent eux-mêmes leur traitement. La pression se mesure ; une pression très élevée peut être parfaitement asymptomatique.</div>
<h3>6.3 Présentations typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Homme de 56 ans, en surpoids, père hypertendu. 148/94 mmHg à deux consultations, automesure moyenne 142/90 mmHg, bilan de base normal. Hypertension primaire de grade 1.</p></div>
<div class="card"><h4>Forme du sujet âgé</h4><p>Femme de 79 ans, 172/68 mmHg, étourdissements au lever. Hypertension systolique isolée de rigidité ; hypotension orthostatique à rechercher avant tout traitement.</p></div>
<div class="card"><h4>Forme endocrinienne méconnue</h4><p>Femme de 44 ans, trois médicaments, kaliémie 3,6 mmol/L sous hydrochlorothiazide. Rapport aldostérone/rénine élevé, adénome gauche : hyperaldostéronisme non soupçonné faute d’hypokaliémie franche.</p></div>
<div class="card"><h4>Forme révélée par une complication</h4><p>Homme de 38 ans jamais contrôlé : vision floue, céphalées, 232/138 mmHg, hémorragies rétiniennes, œdème papillaire, créatinine 190 µmol/L. Hypertension maligne : urgence hypertensive.</p></div></div>
</section>

<section class="ilot" id="i10-7"><h2><span class="n">7</span>Examen clinique</h2>
<p>Ordre habituel : état général, signes vitaux, anthropométrie, signes ciblés. Il cherche des atteintes d’organe et des indices de cause secondaire.</p>
<p><b>Signes vitaux et anthropométrie.</b> Pression aux deux bras puis debout selon la <button class="w" data-k="i10-mes-cab">technique standardisée</button> ; pouls (une fibrillation auriculaire modifie la mesure et le risque) ; poids, taille, indice de masse corporelle et <button class="w" data-k="i10-e-taille">tour de taille (≥ 94 cm chez l’homme, ≥ 80 cm chez la femme)</button>.</p>
<div class="two">
<div><b>Cœur et vaisseaux</b><ul><li>Choc de pointe étalé, quatrième bruit, souffle aortique</li><li><button class="w" data-k="i10-e-pouls-fem">Pouls fémoraux et gradient bras-jambes (coarctation)</button></li><li>Souffles carotidiens, pouls périphériques</li></ul></div>
<div><b>Rein et abdomen</b><ul><li><button class="w" data-k="i10-e-souffle">Souffle abdominal ou lombaire (sténose de l’artère rénale)</button></li><li>Gros reins palpables (polykystose)</li><li>Bandelette urinaire</li></ul></div>
<div><b>Œil et système nerveux</b><ul><li><button class="w" data-k="i10-e-fo">Fond d’œil (rétinopathie, œdème papillaire)</button></li><li>Déficit focal, troubles cognitifs ; confusion et troubles visuels en urgence</li></ul></div>
<div><b>Indices endocriniens</b><ul><li><button class="w" data-k="i10-e-cushing">Signes cushingoïdes (vergetures pourpres, amyotrophie proximale)</button></li><li>Goitre, tremblement ; taches café au lait, neurofibromes (neurofibromatose de type 1 : phéochromocytome, sténose de l’artère rénale) ; traits acromégaliques</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Un souffle abdominal n’a de valeur que s’il est systolodiastolique et latéralisé ; son absence n’exclut pas une sténose. L’examen oriente, l’imagerie tranche.</div>
