
<!-- ===== FENÊTRES I10 : monographies ===== -->
<template data-pop="i10-d-iec" data-title="Inhibiteurs de l’enzyme de conversion (IEC)">
<div class="lab">Mécanisme</div><p>L’IEC bloque la conversion de l’angiotensine I en angiotensine II : il provoque une vasodilatation, abaisse l’aldostérone et favorise la natriurèse. La même enzyme dégrade la bradykinine, qui s’accumule et explique la toux et l’angiœdème. Au rein, la dilatation de l’artériole efférente abaisse la pression intraglomérulaire, d’où la baisse de l’albuminurie.</p>
<div class="lab">Preuves</div><p>Les IEC réduisent les événements dans l’hypertension, dans la coronaropathie (essais Heart Outcomes Prevention Evaluation et EUROPA) et après un accident vasculaire cérébral (PROGRESS). Ils ralentissent la progression de la néphropathie protéinurique.</p>
<div class="lab">Effets indésirables</div><p>La toux sèche est fréquente. L’angiœdème est rare mais grave, et plus fréquent chez le patient d’ascendance africaine. L’hyperkaliémie, la hausse de la créatinine et l’hypotension de première dose découlent directement de la baisse de l’angiotensine II et de l’aldostérone.</p>
<div class="lab">Contre-indications</div><p>Les IEC sont contre-indiqués pendant la grossesse, après un angiœdème et en cas de sténose bilatérale des artères rénales ou sur rein unique. Ils ne s’associent ni à un ARA II, ni à l’aliskirène chez le diabétique ou l’insuffisant rénal, ni au sacubitril, dont ils doivent être séparés de 36 heures.</p>
<div class="lab">Surveillance</div><p>La créatinine et la kaliémie sont contrôlées deux à quatre semaines après chaque changement, puis au moins une fois par an. Les doses figurent dans le tableau de l’onglet Pharmacologie.</p></template>

<template data-pop="i10-d-ara" data-title="Antagonistes des récepteurs de l’angiotensine II (ARA II)">
<div class="lab">Mécanisme</div><p>L’ARA II bloque le récepteur AT1 ; l’angiotensine II en excès stimule alors le récepteur AT2. La bradykinine ne s’accumule pas : l’ARA II ne fait pas tousser et provoque beaucoup plus rarement un angiœdème, ce qui explique une meilleure persistance du traitement.</p>
<div class="lab">Preuves</div><p>Dans LIFE, le losartan a fait mieux que l’aténolol chez l’hypertendu avec hypertrophie ventriculaire. IDNT et RENAAL ont montré une néphroprotection dans la néphropathie diabétique. ONTARGET a montré que le telmisartan n’est pas inférieur au ramipril, et que leur association est délétère.</p>
<div class="lab">Particularités</div><p>Le losartan est uricosurique, ce qui l’oriente chez le goutteux. L’olmésartan peut rarement provoquer une entéropathie de type sprue. Les contre-indications et la surveillance sont celles des IEC.</p></template>

<template data-pop="i10-d-icc" data-title="Inhibiteurs calciques">
<div class="lab">Deux familles</div><p>Les <b>dihydropyridines</b> (amlodipine, lercanidipine, nifédipine à libération prolongée) dilatent sélectivement les artérioles. Les <b>non-dihydropyridiniques</b> (vérapamil, diltiazem) ralentissent la fréquence et diminuent la contractilité : ils ne sont pas de première ligne dans l’hypertension.</p>
<div class="lab">Preuves</div><p>Syst-Eur a démontré le bénéfice dans l’hypertension systolique isolée du sujet âgé. Dans ASCOT-BPLA, l’amlodipine, associée si besoin au périndopril, a fait mieux que l’aténolol associé si besoin à un thiazidique. ACCOMPLISH a montré la supériorité de l’association IEC et amlodipine sur l’association IEC et hydrochlorothiazide.</p>
<div class="lab">Effets indésirables et interactions</div><p>Les œdèmes malléolaires sont dose-dépendants et non volémiques ; un IEC ou un ARA II les réduit. Céphalées, bouffées de chaleur et hyperplasie gingivale sont les autres effets fréquents. Un inhibiteur puissant du CYP3A4, comme la clarithromycine, augmente leur concentration et expose le sujet âgé à l’hypotension et à l’insuffisance rénale aiguë. Le vérapamil et le diltiazem provoquent un bloc avec les bêtabloquants et un surdosage de la digoxine et des statines métabolisées par le CYP3A4.</p>
<div class="lab">Place</div><p>Les dihydropyridines sont de première ligne. Elles agissent quel que soit le niveau de rénine, donc aussi chez le sujet âgé et le patient d’ascendance africaine, et restent sûres en cas de maladie rénale. La nifédipine à libération prolongée est utilisable pendant la grossesse.</p></template>

<template data-pop="i10-d-thz" data-title="Diurétiques thiazidiques et apparentés">
<div class="lab">Molécules et mécanisme</div><p>L’hydrochlorothiazide est le thiazidique classique ; la chlortalidone et l’indapamide, dits apparentés, sont privilégiés par l’ESC 2024, car leur action est plus longue et leurs preuves plus solides. Tous bloquent le NCC du tube distal : ils provoquent une natriurèse les premières semaines, puis une baisse durable des résistances vasculaires.</p>
<div class="lab">Preuves</div><p>Dans ALLHAT, la chlortalidone n’a pas été inférieure à l’amlodipine ni au lisinopril, et a mieux prévenu l’insuffisance cardiaque. HYVET a montré le bénéfice de l’indapamide après 80 ans. CLICK a étudié la chlortalidone au stade 4 de la maladie rénale, situation où l’information professionnelle suisse la contre-indique.</p>
<div class="lab">Effets indésirables</div><p>Les thiazidiques exposent à l’hypokaliémie, à l’hyponatrémie (surtout chez la femme âgée), à l’hypomagnésémie, à l’hyperuricémie avec goutte, à l’hyperglycémie, à la photosensibilité et à l’hypercalcémie. L’hydrochlorothiazide au long cours augmente le risque de carcinome cutané non mélanocytaire (Swissmedic, 2018).</p>
<div class="lab">Particularités</div><p>L’effet antihypertenseur plafonne : au-delà de 25 mg d’hydrochlorothiazide, la dose ajoute surtout des effets indésirables. La baisse de la calciurie est utile chez le patient lithiasique ou ostéoporotique. Natrémie, kaliémie et créatinine sont contrôlées à deux à quatre semaines.</p></template>

<template data-pop="i10-d-spiro" data-title="Spironolactone et éplérénone dans l’hypertension">
<div class="lab">Mécanisme</div><p>Ces molécules bloquent le récepteur minéralocorticoïde du tube collecteur : elles augmentent la natriurèse, retiennent le potassium et exercent un effet antifibrosant.</p>
<div class="lab">Preuves et place</div><p>PATHWAY-2 (2015) : 25 à 50 mg/jour baissent la systolique à domicile d’environ 8,7 mmHg de plus que le placebo, davantage que le bisoprolol et la doxazosine, d’autant plus que la rénine est basse. La spironolactone est le quatrième médicament de la résistance (ESC 2024, classe IIa) et le traitement de l’hyperaldostéronisme bilatéral.</p>
<div class="lab">Dose : essais et information professionnelle suisse</div><p>L’information professionnelle suisse d’Aldactone® prévoit dans l’hypertension 50 à 100 mg/jour, jusqu’à 200 mg/jour, et 100 mg/jour, jusqu’à 200 mg, en cas d’hyperproduction d’aldostérone ; elle contre-indique la spironolactone si la clairance est &lt; 30 mL/min, en cas d’hyperkaliémie et en association à l’éplérénone. Les 25 à 50 mg/jour de PATHWAY-2 et de l’ESC 2024 restent en deçà du schéma de l’information professionnelle : cette dose plus faible réduit le risque d’hyperkaliémie au prix d’une utilisation hors du schéma autorisé, à documenter dans le dossier. Source : information professionnelle suisse Aldactone®, Swissmedic (AIPS), consultée le 08.10.2026.</p>
<div class="lab">Conditions et effets indésirables</div><p>La filtration doit être ≥ 30 mL/min/1,73 m², et la kaliémie de départ de préférence ≤ 4,5 mmol/L ; le traitement est suspendu en cas de déshydratation ou de maladie aiguë. Les risques principaux sont l’hyperkaliémie et la hausse de la créatinine ; la spironolactone provoque aussi gynécomastie, mastodynie et troubles des règles. L’éplérénone, plus sélective, en est dépourvue, mais elle est moins puissante et hors indication autorisée en Suisse dans l’hypertension.</p>
<div class="lab">Surveillance</div><p>Kaliémie et créatinine sont contrôlées à une et quatre semaines, puis tous les trois à six mois.</p></template>

<template data-pop="i10-d-bb" data-title="Bêtabloquants dans l’hypertension">
<div class="lab">Molécules</div><p>Le bisoprolol, le métoprolol succinate et le nébivolol sont β1-sélectifs ; le carvédilol et le labétalol bloquent aussi les récepteurs α1.</p>
<div class="lab">Place</div><p>Moins efficaces que les autres classes pour prévenir les accidents vasculaires cérébraux, surtout l’aténolol (LIFE, ASCOT-BPLA), en partie parce qu’ils baissent moins la pression centrale. ESC 2024 : sur indication propre (angor, post-infarctus, insuffisance cardiaque à fraction réduite, fréquence, grossesse) ; ESH 2023 : l’une des cinq classes majeures.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Les bêtabloquants provoquent fatigue, bradycardie, extrémités froides, dysfonction érectile et hyperglycémie modérée ; ils masquent les signes adrénergiques de l’hypoglycémie. Ils sont contre-indiqués en cas de bloc auriculoventriculaire de haut degré, d’asthme sévère pour les non-sélectifs, de phéochromocytome non alpha-bloqué et en association au vérapamil ou au diltiazem. Chez le coronarien, l’arrêt est toujours progressif.</p></template>

<template data-pop="i10-d-alpha" data-title="Alpha-bloquants et antihypertenseurs centraux">
<div class="lab">Alpha-bloquants</div><p>La doxazosine et l’urapidil dilatent les vaisseaux en bloquant les récepteurs α1. Ils servent dans l’hypertension résistante, l’hypertrophie prostatique et la préparation du phéochromocytome. L’hypotension orthostatique de première dose impose la prise au coucher. Le bras doxazosine d’ALLHAT a été interrompu pour excès d’insuffisance cardiaque : ils ne sont donc pas de première ligne.</p>
<div class="lab">Centraux</div><p>La clonidine (agoniste α2), la moxonidine (agoniste imidazolinique) et la méthyldopa (réservée à la grossesse) abaissent le tonus sympathique central. Elles provoquent sédation et bouche sèche. L’arrêt brutal de la clonidine entraîne un <b>rebond</b> hypertensif sévère. La moxonidine est contre-indiquée dans l’insuffisance cardiaque, où l’essai MOXCON a montré une surmortalité.</p></template>

<template data-pop="i10-d-amil" data-title="Amiloride">
<div class="lab">Mécanisme et place</div><p>L’amiloride bloque directement le canal ENaC du tube collecteur, indépendamment de l’aldostérone. C’est une alternative à la spironolactone dans l’hypertension résistante : 10 à 20 mg/jour, efficacité comparable dans une étude secondaire de PATHWAY-2. En Suisse, l’amiloride n’existe qu’associé à l’hydrochlorothiazide (Comilorid Mepha® 5/50 mg et mite 2,5/25 mg, au plus 4 comprimés à 5/50 mg par jour) : 10 à 20 mg d’amiloride apportent donc 100 à 200 mg d’hydrochlorothiazide, ce qui rend le schéma de PATHWAY-2 difficilement transposable. L’amiloride traite aussi le syndrome de Liddle et corrige une hypokaliémie sous thiazidique.</p>
<div class="lab">Précautions</div><p>Le risque principal est l’hyperkaliémie, surtout avec un IEC ou un ARA II et une filtration basse. L’amiloride ne s’associe à un antagoniste minéralocorticoïde ni à un sel potassique (contre-indications de l’information professionnelle suisse, comme une kaliémie &gt; 5,5 mmol/L et l’insuffisance rénale).</p></template>

<template data-pop="i10-d-click" data-title="Chlortalidone et insuffisance rénale sévère : essai et information professionnelle suisse">
<div class="lab">La donnée d’essai</div><p>L’essai CLICK (2021), mené chez des patients dont le débit de filtration était de 15 à 30 mL/min/1,73 m², a montré, chez 160 patients hypertendus non contrôlés, que la chlortalidone (12,5 à 50 mg/jour) abaissait la systolique mesurée sur 24 heures de 11,0 mmHg à 12 semaines, contre 0,5 mmHg sous placebo (Agarwal, <i>New England Journal of Medicine</i> 2021). Le thiazidique apparenté garde donc un effet natriurétique lorsque la filtration est très basse.</p>
<div class="lab">La règle suisse</div><p>L’information professionnelle suisse de la chlortalidone (Chlortalidone Galepharm®, consultée le 08.10.2026 dans l’AIPS) la contre-indique en cas d’insuffisance rénale sévère, définie par une clairance de la créatinine &lt; 30 mL/min. Pour l’examen fédéral et la prescription en Suisse, cette contre-indication s’applique : sous 30 mL/min, le diurétique de l’hypertension est un diurétique de l’anse, comme l’indique aussi l’ESC 2024 pour définir la résistance à ce niveau de filtration. Un usage de la chlortalidone sous 30 mL/min reste une décision spécialisée hors du cadre autorisé.</p></template>

<template data-pop="i10-d-apro" data-title="Aprocitentan">
<div class="lab">Mécanisme</div><p>L’aprocitentan bloque les deux récepteurs, A et B, de l’endothéline 1 : il dilate les vaisseaux et abaisse la pression par une voie indépendante du système rénine-angiotensine et du volume.</p>
<div class="lab">Preuve</div><p>Dans l’essai de phase 3 décrit par l’information professionnelle suisse (730 patients résistants à un traitement standardisé par valsartan, amlodipine et hydrochlorothiazide), l’aprocitentan a abaissé la systolique davantage que le placebo à quatre semaines, et l’effet s’est maintenu ensuite.</p>
<div class="lab">Statut en Suisse</div><p>Autorisé par Swissmedic le 18.09.2025 (Jeraygo), pour l’hypertension résistante de l’adulte en association avec au moins trois antihypertenseurs ; 12,5 mg une fois par jour, portés à 25 mg si cette dose est tolérée et qu’un contrôle plus strict est nécessaire ; non recommandé si le débit de filtration est &lt; 15 mL/min ou en dialyse (information professionnelle suisse Jeraygo®, version de juin 2026). Absent de l’ESC 2024, qui lui est antérieure.</p>
<div class="lab">Effets indésirables et précautions</div><p>L’aprocitentan provoque une rétention hydrique et des œdèmes, d’où la prudence en cas d’insuffisance cardiaque, et une baisse de l’hémoglobine. Il est tératogène : il est contre-indiqué pendant la grossesse et l’allaitement, et chez la femme en âge de procréer sans contraception fiable, comme dans l’insuffisance hépatique sévère (Child-Pugh C). Le remboursement se vérifie dans la liste des spécialités.</p></template>

<template data-pop="i10-d-spc" data-title="Combinaisons fixes (un seul comprimé)">
<div class="lab">Pourquoi</div><p>L’adhésion diminue avec le nombre de comprimés. Les combinaisons fixes améliorent la persistance et le contrôle ; leurs molécules à faible dose ont moins d’effets indésirables. ESC 2024 : bithérapie fixe à faible dose en première intention (classe I).</p>
<div class="lab">Associations et limites</div><p>Les associations de référence réunissent un IEC ou un ARA II avec un inhibiteur calcique ou un thiazidique, puis les trois classes en trithérapie. La combinaison fixe offre moins de souplesse de titration, et son remboursement figure dans la liste des spécialités. Piège : deux comprimés contenant chacun un bloqueur du système rénine-angiotensine ne doivent jamais être associés.</p></template>

<template data-pop="i10-d-urg" data-title="Antihypertenseurs intraveineux de l’urgence">
<div class="lab">Labétalol</div><p>Alpha- et bêtabloquant : 50 mg en injection intraveineuse lente (au moins une minute), répétables toutes les 5 minutes, ou perfusion d’environ 2 mg/min ; dose efficace habituelle de 50 à 200 mg. Dans l’hypertension de la grossesse, perfusion de 20 mg/heure, doublée toutes les 30 minutes jusqu’à 160 mg/heure au plus (information professionnelle suisse Trandate®). Contre-indiqué dans l’asthme, le bloc auriculoventriculaire, l’insuffisance cardiaque décompensée.</p>
<div class="lab">Urapidil</div><p>Alpha-bloquant à action centrale : 10 à 50 mg en injection intraveineuse, répétables selon la pression ; perfusion initiale jusqu’à 2 mg/min, puis entretien d’environ 9 mg/heure, 48 heures au plus (information professionnelle suisse Ebrantil®).</p>
<div class="lab">Nicardipine, clévidipine</div><p>Dihydropyridines titrables : nicardipine 3 à 5 mg/heure, augmentée par paliers de 0,5 à 1 mg toutes les 15 minutes jusqu’à 15 mg/heure au plus, puis 2 à 4 mg/heure (information professionnelle suisse Nicardipin Aguettant®) ; clévidipine 2 mg/heure, doublée toutes les 90 secondes, entretien 4 à 6 mg/heure, 32 mg/heure au plus (information professionnelle suisse Cleviprex®).</p>
<div class="lab">Nitroglycérine, nitroprussiate</div><p>Nitroglycérine : 0,75 à 8 mg/heure habituellement (environ 12 à 130 µg/min), jusqu’à 10 mg/heure (œdème pulmonaire, syndrome coronarien ; information professionnelle suisse Nitroglycerin Sintetica®). Nitroprussiate en soins intensifs, titré en µg/kg/min ; au-delà de 10 µg/kg/min ou en cas de perfusion prolongée ou d’insuffisance rénale, surveiller le thiocyanate, qui ne doit pas dépasser 6 mg/100 mL (information professionnelle suisse Nipruss®).</p>
<div class="lab">Esmolol, phentolamine</div><p>Esmolol : dose de charge de 500 µg/kg/min pendant une minute (soit 0,5 mg/kg), puis 50 à 100 µg/kg/min, titrés jusqu’à 300 µg/kg/min au plus (information professionnelle suisse Brevibloc®) ; c’est le bêtabloquant de choix de la dissection aortique, car il est titrable. La phentolamine est l’alpha-bloquant de la crise du phéochromocytome ; aucune information professionnelle suisse n’a été trouvée dans l’AIPS au 08.10.2026, la dose n’est donc pas donnée ici.</p>
<div class="lab">Source</div><p>Les posologies proviennent des informations professionnelles suisses citées (Swissmedic, AIPS, consultées le 08.10.2026) ; les indications et les cibles, de l’ESC 2024. Le protocole de l’établissement précise les dilutions.</p></template>

<template data-pop="i10-d-preg" data-title="Antihypertenseurs de la grossesse">
<div class="lab">Nifédipine à libération prolongée</div><p>La dose est de 20 mg deux fois par jour (forme retard) ou de 40 mg une fois par jour (forme à libération contrôlée), sans dépasser 80 mg par jour selon l’information professionnelle suisse. Efficace et bien tolérée, elle est aussi utilisable par voie orale dans l’hypertension sévère.</p>
<div class="lab">Labétalol</div><p>Par voie orale, il débute à 100 mg deux fois par jour et peut atteindre 2400 mg par jour selon l’information professionnelle suisse Trandate® ; la voie intraveineuse est réservée à l’hypertension sévère. Il est contre-indiqué dans l’asthme.</p>
<div class="lab">Méthyldopa</div><p>Elle se donne à 250 mg deux à trois fois par jour, jusqu’à 3 g par jour selon l’information professionnelle suisse Aldomet® ; c’est la molécule au recul le plus long. Elle provoque sédation et hépatite, et favorise la dépression du post-partum : elle est donc remplacée après l’accouchement.</p>
<div class="lab">À proscrire</div><p>Les IEC, les ARA II et l’aliskirène sont proscrits, car ils provoquent une atteinte rénale fœtale et un oligoamnios. L’aténolol est évité (retard de croissance), comme les antagonistes minéralocorticoïdes ; l’aprocitentan est contre-indiqué. Les diurétiques sont évités, car ils réduisent le volume plasmatique déjà diminué de la prééclampsie ; l’information professionnelle suisse de la chlortalidone contre-indique l’hypertension de la grossesse.</p>
<div class="lab">Allaitement et source</div><p>L’ESC 2025 considère l’énalapril, le captopril, la nifédipine, le labétalol et le métoprolol comme compatibles avec l’allaitement ; l’information professionnelle suisse de l’énalapril recommande toutefois la prudence. Sources : ESC 2025 sur la maladie cardiovasculaire et la grossesse, ESC 2024, informations professionnelles suisses.</p></template>
