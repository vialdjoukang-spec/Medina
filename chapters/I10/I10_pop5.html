
<!-- ===== FENÊTRES PARETO I10 ===== -->
<template data-pop="pareto-i10-def" data-title="Pareto — Définition, classifications, épidémiologie">
<p class="ratio" data-cover="i10-1,i10-2"></p>
<ul><li>Risque linéaire dès 115/75 mmHg : le seuil est une convention fondée sur le bénéfice.</li><li>ESC 2024 (cabinet) : non élevée &lt; 120/70 ; élevée 120–139/70–89 ; hypertension ≥ 140/90. Automesure et diurne : ≥ 135/85.</li><li>ESH 2023 : grades 1 (140–159/90–99), 2 (160–179/100–109), 3 (≥ 180/≥ 110) ; systolique isolée ≥ 140/&lt; 90.</li><li>Divergences : zone 130–139 (ESC plus large), bêtabloquants de première ligne (ESH), étendue du dépistage de l’hyperaldostéronisme (ciblé pour l’ESH). La Société suisse de cardiologie a repris l’ESC 2024 (FMH, « Guides de pratique Suisse ») ; pas de position propre de la Société suisse d’hypertension.</li><li>Primaire (environ 90 %) ou secondaire : la cause secondaire appelle un traitement propre.</li><li>Résistante = ≥ 140/90 sous trois classes dont un diurétique, confirmée hors cabinet, observance vérifiée, cause secondaire exclue.</li><li>Suisse : 19,5 % déclarent une hypertension ; 24 % mesurés ; sel 8,7 g/jour ; Genève : 42 % non contrôlés.</li><li>− 10 mmHg : − 20 % d’événements majeurs, − 27 % d’accidents vasculaires cérébraux, − 28 % d’insuffisance cardiaque ; traiter la zone élevée si risque suffisamment élevé.</li></ul></template>

<template data-pop="pareto-i10-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i10-3"></p>
<ul><li>Pression moyenne = débit × résistances ; jeune : débit, sympathique ; établi : résistances ; âgé : rigidité.</li><li>Toute hypertension durable = natriurèse de pression déplacée ou aplatie (sensibilité au sel : âgé, ascendance africaine, obèse, diabétique, insuffisant rénal).</li><li>Rénine inappropriée ; sympathique (obésité, apnées) ; baroréflexe recalé.</li><li>Remodelage artériolaire → résistances structurelles ; rigidité aortique → systolique isolée.</li><li>Organes : hypertrophie → fibrillation auriculaire, insuffisance cardiaque préservée ; néphroangiosclérose ; lacunes, démence ; rétinopathie.</li></ul></template>

<template data-pop="pareto-i10-mesure" data-title="Pareto — Mesure de la pression artérielle">
<p class="ratio" data-cover="i10-4"></p>
<ul><li>Cabinet : assis 5 min, bras soutenu, brassard adapté, 3 mesures (moyenne des 2 dernières), deux bras (garder le plus haut), orthostatisme (≥ 20/10 = hypotension orthostatique).</li><li>Confirmer hors cabinet ; mesure ambulatoire = référence, seule à mesurer la nuit.</li><li>Seuils : automesure et diurne ≥ 135/85 ; 24 h ≥ 130/80 ; nuit ≥ 120/70.</li><li>Blouse blanche (un quart à un tiers) : surveiller. Masquée : risque proche du soutenu ; la chercher si atteinte d’organe inexpliquée.</li><li>Fibrillation auriculaire : mesures manuelles répétées.</li></ul></template>

<template data-pop="pareto-i10-etio" data-title="Pareto — Étiologies et causes secondaires">
<p class="ratio" data-cover="i10-5"></p>
<ul><li>Chercher si &lt; 40 ans (obèse jeune : apnées d’abord), résistance, aggravation brutale, grade 3, hypokaliémie, atteinte disproportionnée.</li><li>Apnées &gt; hyperaldostéronisme (5–10 %) &gt; néphropathie &gt; sténose rénale &gt; médicaments &gt; Cushing, phéochromocytome, coarctation.</li><li>Hyperaldostéronisme : souvent normokaliémique, plus toxique à pression égale ; rapport aldostérone/rénine à envisager chez tout hypertendu confirmé (ESC 2024, IIa) ; corriger K ; faux négatifs sous antagonistes minéralocorticoïdes et amiloride.</li><li>Sténose athéromateuse : traitement médical (ASTRAL, CORAL) ; dysplasie fibromusculaire : angioplastie sans stent.</li><li>Médicaments : anti-inflammatoires, œstroprogestatifs, décongestionnants, venlafaxine, stimulants, ciclosporine, anti-VEGF, réglisse, alcool.</li></ul></template>

<template data-pop="pareto-i10-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i10-6,i10-7"></p>
<ul><li>Buts : risque, atteinte d’organe, cause secondaire, adhésion.</li><li>Antécédents : famille (hypertension ou accident vasculaire jeune), prééclampsie, médicaments.</li><li>L’hypertension ne se ressent pas.</li><li>Indices : ronflement, crampes et polyurie, céphalées-sueurs-palpitations, vergetures pourpres.</li><li>Examen : deux bras et debout, tour de taille, pouls fémoraux, souffle systolodiastolique latéralisé, fond d’œil, signes endocriniens.</li></ul></template>

<template data-pop="pareto-i10-risque" data-title="Pareto — Risque et atteintes d’organe">
<p class="ratio" data-cover="i10-8"></p>
<ul><li>Risque élevé d’emblée : maladie cardiovasculaire, maladie rénale (filtration &lt; 60 ou albumine/créatinine ≥ 3 mg/mmol), diabète, hypercholestérolémie familiale, atteinte d’organe.</li><li>Sinon SCORE2 (40–69 ans), SCORE2-OP (≥ 70 ans) ; Suisse = faible risque ; seuil 10 % ; 5–10 % : modificateurs ou score calcique.</li><li>Atteintes : hypertrophie (&gt; 115/95 g/m²), albuminurie, filtration &lt; 60, onde de pouls &gt; 10 m/s, index &lt; 0,9, rétinopathie, lésions cérébrales.</li><li>SCORE2 sous-estime le risque du jeune.</li></ul></template>

<template data-pop="pareto-i10-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i10-9"></p>
<ul><li>Pression réelle ? risque ? atteinte d’organe ? cause ?</li><li>Confirmer hors cabinet, sauf ≥ 180/110 ou grade 2 avec atteinte d’organe.</li><li>Bilan : Na, K, créatinine, glycémie ou HbA1c, lipides, bandelette, albumine/créatinine, ECG ; rapport aldostérone/rénine à envisager chez tout hypertendu confirmé (ESC 2024, IIa).</li><li>Différentiels : urgence → élévation réactionnelle → secondaire → blouse blanche, erreur de mesure → pseudo-hypertension → primaire.</li></ul></template>

<template data-pop="pareto-i10-urg" data-title="Pareto — Urgence hypertensive">
<p class="ratio" data-cover="i10-10"></p>
<ul><li>Urgence = pression très élevée + atteinte aiguë d’organe → intraveineux titrable, soins continus.</li><li>Sans atteinte aiguë (≥ 180/110) → voie orale, baisse progressive sur 24–48 h, contrôle en quelques jours.</li><li>Autorégulation décalée : pression moyenne − 20 à 25 % en quelques heures (maligne, encéphalopathie).</li><li>Dissection : &lt; 120 mmHg et fréquence &lt; 60 en 1 h ; coronaire, œdème pulmonaire : &lt; 140 ; hémorragie cérébrale : 140–160 dans les 6 h, et si ≥ 220, pas plus de 70 mmHg de baisse en 1 h (III) ; infarctus cérébral : traiter si &gt; 220/120, ou &lt; 185/110 avant thrombolyse ; prééclampsie &lt; 160/105 + magnésium.</li><li>Crise adrénergique : phentolamine ou urapidil, jamais de bêtabloquant seul. Jamais de nifédipine à libération immédiate.</li></ul></template>

<template data-pop="pareto-i10-tt" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i10-11"></p>
<ul><li>Sel ≈ 5 g/jour ; potassium + 0,5–1 g (sel enrichi, sauf maladie rénale avancée) ; indice de masse corporelle 20–25 ; ≥ 150 min/semaine ; alcool &lt; 100 g/semaine ; DASH ; tabac.</li><li>Médicament : hypertension confirmée → d’emblée ; zone 130–139 + risque élevé → après 3 mois si ≥ 130/80.</li><li>Cible ESC 2024 : 120–129 si toléré ; &lt; 140 si ≥ 85 ans, fragilité, orthostatisme, espérance de vie limitée. ESH 2023 : &lt; 140/80, puis 120–129 (18–64 ans), 130–139 (65–79 ans).</li><li>A + C ou A + D fixe à faible dose → A + C + D → pleine dose → spironolactone ; bêtabloquant sur indication. Jamais IEC + ARA II.</li><li>Créatinine et K à 2–4 semaines ; + 30 % toléré ; revoir à 1 mois, cible en 3 mois ; heure de prise indifférente.</li></ul></template>

<template data-pop="pareto-i10-resist" data-title="Pareto — Hypertension résistante">
<p class="ratio" data-cover="i10-12"></p>
<ul><li>Éliminer la pseudo-résistance : technique, blouse blanche (mesure ambulatoire), non-observance (dosage des médicaments), sous-dosage, anti-inflammatoires, sel (natriurèse), alcool.</li><li>Résistance vraie = volume : chercher hyperaldostéronisme et apnées.</li><li>Chlortalidone ou indapamide ; diurétique de l’anse si filtration &lt; 30 (chlortalidone contre-indiquée en Suisse malgré CLICK) ; spironolactone 25–50 mg (IIa, − 8,7 mmHg) ; sinon amiloride (en Suisse, associé à l’hydrochlorothiazide), éplérénone, bêtabloquant, alpha-bloquant, central.</li><li>Dénervation : IIb, centre expérimenté, pas si filtration &lt; 40 ; − 4 à 6 mmHg.</li><li>Aprocitentan : Swissmedic 2025, après au moins trois antihypertenseurs ; tératogène, rétention hydrique ; hors algorithme ESC 2024.</li></ul></template>

<template data-pop="pareto-i10-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i10-13,i10-14"></p>
<ul><li>Suivi mensuel jusqu’à la cible, puis 3–6 mois ; automesure ; bilan rénal annuel ; combinaison fixe. Dépistage : ≥ tous les 3 ans avant 40 ans, annuel ensuite.</li><li>Grossesse : traiter ≥ 140/90, cible &lt; 140/90 ; ≥ 160/110 = hospitalisation. Nifédipine à libération prolongée, labétalol, méthyldopa ; IEC et ARA II contre-indiqués. Aspirine 100–150 mg le soir, débutée avant 16 semaines et poursuivie jusqu’à 36 semaines, si risque &gt; 1/100 (Société suisse de gynécologie et d’obstétrique). sFlt-1/PlGF ≤ 38 exclut à une semaine.</li><li>Post-partum : même cible, pic entre le 3e et le 6e jour, prééclampsie possible jusqu’à 6 semaines ; méthyldopa remplacée ; risque cardiovasculaire × 2.</li><li>Âgé : traiter à vie si toléré ; &lt; 140 si ≥ 85 ans ou fragile.</li><li>Rein : 120–129 si filtration &gt; 30 ; IEC ou ARA II si albuminurie ; iSGLT2 si &gt; 20 ; finérénone.</li><li>Chirurgie : pas de report si &lt; 180/110 ; IEC et ARA II interrompus le jour même à envisager (IIa) ; bêtabloquants jamais arrêtés brutalement.</li></ul></template>

<template data-pop="pareto-i10-bio" data-title="Pareto — Biologie de base">
<p class="ratio" data-cover="i10-e-3"></p>
<ul><li>K bas spontané ou sous faible dose de diurétique = excès minéralocorticoïde ; corriger avant le rapport aldostérone/rénine.</li><li>Albumine/créatinine : A1 &lt; 3, A2 3–30, A3 &gt; 30 mg/mmol ; deux sur trois en 3–6 mois.</li><li>Urines de 24 h : sel (g) ≈ sodium (mmol) / 17 ; créatinine urinaire pour la complétude ; kaliurèse &gt; 30 mmol/jour malgré hypokaliémie = perte rénale.</li></ul></template>

<template data-pop="pareto-i10-horm" data-title="Pareto — Bilan hormonal">
<p class="ratio" data-cover="i10-e-4"></p>
<ul><li>Rapport aldostérone/rénine : rénine ≤ 8,2 mU/L + aldostérone ≥ 277 pmol/L (immunodosage) + rapport &gt; 70 (immunodosage ; environ 25 % plus bas en spectrométrie de masse) ; seuil du laboratoire.</li><li>Faux négatifs : antagonistes minéralocorticoïdes, amiloride (arrêt 4 semaines), diurétiques, IEC, ARA II, hypokaliémie ; faux positifs : bêtabloquants, centraux (arrêt 2 semaines), œstroprogestatifs.</li><li>Confirmation seulement si probabilité intermédiaire et chirurgie envisagée : charge sodée assise (improbable si &lt; 162 pmol/L en spectrométrie de masse, &lt; 217 en immunodosage) ; captopril 50 mg (improbable si &lt; 277 pmol/L à 2 h).</li><li>Cathétérisme : sélectivité &gt; 1,4 à 3 (&gt; 5 sous cosyntropine) ; latéralisation ≥ 4 = latéralisé, &lt; 3 = bilatéral.</li><li>K / rénine / aldostérone : primaire ↓ ou N / ↓ / ↑ ; secondaire ↓ / ↑ / ↑ ; pseudo ↓ / ↓ / ↓ ; Gordon ↑ / ↓ / N ou ↓.</li><li>Phéochromocytome : métanéphrines en décubitus, &gt; 3 × la limite. Cushing : 2 tests sur 3. Observance : dosage des médicaments.</li></ul></template>

<template data-pop="pareto-i10-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i10-e-1,i10-e-2,i10-e-3,i10-e-4,i10-e-5"></p>
<ul><li>Références : mesure ambulatoire, cathétérisme surrénalien, angiographie numérisée, polysomnographie, métanéphrines plasmatiques.</li><li>Mesure ambulatoire : 24 h ≥ 130/80, jour ≥ 135/85, nuit ≥ 120/70 ; baisse nocturne 10–20 % ; ≥ 70 % valides.</li><li>ECG : Sokolow et Lyon &gt; 35 mm ; Cornell &gt; 28 / &gt; 20 mm ; peu sensible.</li><li>Échocardiographie : masse &gt; 115/95 g/m² ; épaisseur relative &gt; 0,42 ; oreillette &gt; 34 mL/m² ; E/e′ ≤ 8 normal, &gt; 14 élevé.</li><li>Fond d’œil stades 3–4 = maligne. Doppler rénal : &gt; 180–200 cm/s, rapport &gt; 3,5 ; index de résistance &gt; 0,8 = mauvaise réponse. Apnées : 5–14, 15–29, ≥ 30/h.</li></ul></template>

<template data-pop="pareto-i10-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i10-sa,i10-sh,i10-sp,i10-sb,i10-sg"></p>
<ul><li>Artère rénale droite derrière la veine cave ; athérome ostial, dysplasie distale ; artères accessoires (un quart) ; nerfs rénaux proches de la lumière en distal.</li><li>Veine surrénalienne droite courte dans la veine cave : cathétérisme difficile, sélectivité par le cortisol.</li><li>Hyaline (chronique) ; hyperplasique et nécrose fibrinoïde (maligne) → schizocytes, thrombopénie, insuffisance rénale.</li><li>Glomérulée : aldostérone ; fasciculée : cortisol ; médullaire : catécholamines (adrénaline grâce au cortisol).</li><li>Baroréflexe (IX, X → noyau du tractus solitaire → vague ↑, sympathique ↓) ; rénine-angiotensine ; natriurèse de pression (long terme).</li><li>Sodium : proximal 65 %, anse 25 %, distal 5–7 % (thiazidiques), collecteur 2–5 % (spironolactone, amiloride).</li><li>Réglisse inhibe la 11β-hydroxystéroïde déshydrogénase de type 2 ; métanéphrines produites en continu.</li><li>Liddle (amiloride), familial type 1 (glucocorticoïde), <i>KCNJ5</i>, Gordon (thiazidique) ; phéochromocytome : un tiers germinal → test pour tous.</li></ul></template>

<template data-pop="pareto-i10-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i10-p-1,i10-p-2,i10-p-3,i10-p-4,i10-p-5,i10-p-6"></p>
<ul><li>Première ligne : IEC, ARA II, dihydropyridines, thiazidiques apparentés ; bêtabloquants sur indication ; spironolactone en quatrième ; aprocitentan en recours (Swissmedic 2025).</li><li>Doses repères : amlodipine 5–10 ; périndopril 5–10 ; ramipril 2,5–10 ; losartan 50–100 ; valsartan 80–160 ; chlortalidone 12,5–25 (contre-indiquée si clairance &lt; 30) ; indapamide 1,5 ; spironolactone 25–50 (essais ; information professionnelle suisse 50–100) ; aprocitentan 12,5–25 mg/jour.</li><li>Interactions : IEC ou ARA II + diurétique + anti-inflammatoire ; hyperkaliémiants ; bêtabloquant + vérapamil ou diltiazem ; clonidine ; lithium ; CYP3A4 ; antidépresseurs ; réglisse.</li><li>Effets : toux, angiœdème ; œdèmes non volémiques ; hyponatrémie, hypokaliémie, goutte ; gynécomastie.</li><li>À éviter : IEC, ARA II pendant la grossesse ; nifédipine à libération immédiate ; alpha-bloquants en première ligne ; bêtabloquant seul dans le phéochromocytome.</li></ul></template>
