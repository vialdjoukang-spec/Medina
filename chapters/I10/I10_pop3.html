
<!-- ===== FENÊTRES I10 : risque et atteintes d’organe ===== -->
<template data-pop="i10-score2" data-title="SCORE2 et SCORE2-OP">
<div class="lab">Ce qu’ils estiment</div><p>Le risque à dix ans d’événement cardiovasculaire mortel ou non (décès cardiovasculaire, infarctus, accident vasculaire cérébral) sans maladie cardiovasculaire établie. SCORE2 de 40 à 69 ans ; SCORE2-OP dès 70 ans, en tenant compte du risque concurrent de décès non cardiovasculaire.</p>
<div class="lab">Variables</div><p>Âge, sexe, tabagisme, systolique, cholestérol non HDL ; calibration en quatre régions ; la Suisse est à faible risque. Calculateurs en ligne de l’ESC.</p>
<div class="lab">Hors score</div><p>Maladie cardiovasculaire, maladie rénale chronique modérée à sévère, hypercholestérolémie familiale, atteinte d’organe, diabète : risque d’emblée élevé ; avant 60 ans, SCORE2-Diabetes peut reclasser un diabétique sous 10 %.</p>
<div class="lab">Seuil et limites</div><p>ESC 2024 : ≥ 10 % justifie un médicament dans la zone élevée après trois mois de mode de vie. Le score sous-estime le risque du jeune et ignore antécédents familiaux, précarité, maladies inflammatoires et complications de grossesse, d’où les modificateurs.</p></template>

<template data-pop="i10-modif" data-title="Modificateurs de risque">
<div class="lab">Usage</div><p>Aider à décider quand SCORE2 est intermédiaire (environ 5 à 10 %).</p>
<div class="lab">Propres à la femme</div><p>Prééclampsie, hypertension ou diabète gestationnels, prématurité, ménopause précoce, syndrome des ovaires polykystiques.</p>
<div class="lab">Autres</div><p>Antécédent familial de maladie cardiovasculaire précoce, ascendance sud-asiatique, précarité, maladie inflammatoire chronique, infection par le VIH, maladie psychiatrique sévère ; imagerie (score calcique, plaque carotidienne).</p></template>

<template data-pop="i10-cac" data-title="Score calcique coronaire">
<div class="lab">Principe et lecture</div><p>Tomodensitométrie sans contraste, synchronisée à l’ECG, qui quantifie le calcium coronaire (score d’Agatston). Score nul : risque coronaire à moyen terme très bas, argument pour différer un traitement dans la zone intermédiaire. Score élevé ou &gt; 75e percentile pour l’âge et le sexe : reclassement vers le risque élevé. ESC 2024 : classe IIb, si le résultat change la décision.</p></template>

<template data-pop="i10-aoc" data-title="Atteintes d’organe médiées par l’hypertension">
<div class="lab">Définition</div><p>Altération structurelle ou fonctionnelle causée par l’hypertension, souvent asymptomatique, qui augmente le risque d’événement.</p>
<div class="lab">Liste</div><p>Cœur : hypertrophie ventriculaire, oreillette gauche dilatée. Rein : albumine/créatinine ≥ 3 mg/mmol, filtration &lt; 60 mL/min/1,73 m². Artères : onde de pouls &gt; 10 m/s, index de pression systolique &lt; 0,9, plaques, score calcique élevé. Œil : rétinopathie sévère. Cerveau : lacunes, leucopathie, microsaignements, déclin cognitif.</p>
<div class="lab">Conséquence</div><p>Risque élevé : traitement sans attendre, cible 120–129 mmHg si tolérée.</p></template>

<template data-pop="i10-alb" data-title="Albuminurie">
<div class="lab">Mesure et catégories (KDIGO)</div><p>Rapport albumine/créatinine sur les premières urines du matin : A1 &lt; 3 mg/mmol ; A2 3–30 ; A3 &gt; 30 (en mg/g : &lt; 30, 30–300, &gt; 300). Deux prélèvements positifs sur trois en trois à six mois.</p>
<div class="lab">Signification</div><p>Lésion endothéliale glomérulaire et systémique ; prédit l’insuffisance rénale et les événements cardiovasculaires indépendamment de la filtration.</p>
<div class="lab">Thérapeutique</div><p>IEC ou ARA II à dose maximale tolérée, inhibiteur du SGLT2, finérénone chez le diabétique de type 2. Sa baisse sous traitement est de bon pronostic.</p></template>

<template data-pop="i10-vop" data-title="Vitesse de l’onde de pouls carotido-fémorale">
<div class="lab">Principe et seuil</div><p>Temps de transit de l’onde entre carotide et fémorale rapporté à la distance ; plus l’aorte est rigide, plus l’onde est rapide. &gt; 10 m/s : atteinte d’organe. Référence de la rigidité artérielle ; classe IIb ; peu disponible en ville.</p></template>

<template data-pop="i10-ips" data-title="Index de pression systolique">
<div class="lab">Technique et lecture</div><p>Pression systolique à la cheville (sonde Doppler) divisée par la systolique humérale la plus élevée, patient couché. 0,9–1,4 : normal ; &lt; 0,9 : artériopathie des membres inférieurs, risque élevé ; &gt; 1,4 : artères incompressibles (diabète, insuffisance rénale), ininterprétable.</p></template>

<!-- ===== FENÊTRES I10 : urgence ===== -->
<template data-pop="i10-urg-table" data-title="Urgence hypertensive : cibles et traitements par situation">
<div class="lab">Hypertension maligne, encéphalopathie</div><p>Baisser la pression moyenne de 20 à 25 % en quelques heures. Labétalol, nicardipine, urapidil.</p>
<div class="lab">Dissection aortique aiguë</div><p>Systolique &lt; 120 mmHg et fréquence &lt; 60/min en moins d’une heure. Esmolol ou labétalol d’abord, puis nitroprussiate, nitroglycérine ou nicardipine.</p>
<div class="lab">Syndrome coronarien aigu ; œdème pulmonaire cardiogénique</div><p>Systolique &lt; 140 mmHg. Nitroglycérine (± labétalol dans le syndrome coronarien) ; diurétique de l’anse et ventilation non invasive dans l’œdème pulmonaire.</p>
<div class="lab">Infarctus cérébral</div><p>Sans thrombolyse : ne baisser que si &gt; 220/120 mmHg, d’environ 15 % en une heure. Avec thrombolyse : &lt; 185/110 mmHg avant, &lt; 180/105 mmHg pendant 24 heures.</p>
<div class="lab">Hémorragie intracérébrale</div><p>Systolique 140–160 mmHg dans les six heures (IIa) ; si la systolique initiale est ≥ 220 mmHg, pas de baisse de plus de 70 mmHg dans la première heure (classe III).</p>
<div class="lab">Prééclampsie sévère, éclampsie, HELLP</div><p>Systolique &lt; 160 mmHg et diastolique &lt; 105 mmHg. Labétalol intraveineux, nifédipine orale, méthyldopa ; sulfate de magnésium ; décision d’accouchement.</p>
<div class="lab">Crise adrénergique</div><p>Phentolamine ou urapidil ; benzodiazépine (cocaïne) ; pas de bêtabloquant seul.</p>
<div class="lab">Source</div><p>ESC 2024 (tableau des urgences hypertensives) et ESH 2023. La disponibilité des molécules intraveineuses varie selon les hôpitaux suisses.</p></template>

<template data-pop="i10-malig" data-title="Hypertension maligne">
<div class="lab">Définition</div><p>Pression très élevée (souvent ≥ 200/120 mmHg) avec rétinopathie avancée : hémorragies en flammèches, nodules cotonneux, ± œdème papillaire.</p>
<div class="lab">Complications</div><p>Microangiopathie thrombotique (schizocytes, thrombopénie, lactate déshydrogénase élevée, haptoglobine effondrée), insuffisance rénale aiguë, encéphalopathie, insuffisance cardiaque. L’ischémie rénale active massivement le système rénine-angiotensine, qui entretient l’hypertension.</p>
<div class="lab">Conduite</div><p>Hospitalisation, voie intraveineuse, baisse de 20 à 25 % en quelques heures, relais oral. Chercher une cause secondaire (sténose de l’artère rénale, glomérulopathie, phéochromocytome, sclérodermie, cocaïne) ; si l’hémolyse persiste après le contrôle tensionnel, évoquer un syndrome hémolytique et urémique atypique ou un purpura thrombotique thrombocytopénique.</p></template>

<template data-pop="i10-pres" data-title="Encéphalopathie hypertensive et syndrome PRES">
<div class="lab">Clinique et mécanisme</div><p>Céphalées, confusion, troubles visuels jusqu’à la cécité corticale, convulsions. Dépassement de la limite supérieure d’autorégulation : œdème vasogénique surtout postérieur.</p>
<div class="lab">Imagerie et causes</div><p>IRM : hypersignaux pariéto-occipitaux bilatéraux en séquence T2 FLAIR, réversibles. Autres causes : éclampsie, ciclosporine, tacrolimus, chimiothérapies, insuffisance rénale, maladies auto-immunes. Réversible si la pression est contrôlée vite.</p></template>

<!-- ===== FENÊTRES I10 : grossesse ===== -->
<template data-pop="i10-preec" data-title="Prééclampsie : définition et critères">
<div class="lab">Définition (ISSHP 2021)</div><p>Hypertension après 20 semaines avec au moins : protéinurie (protéines/créatinine ≥ 30 mg/mmol) ; dysfonction d’organe maternelle (créatinine ≥ 90 µmol/L, transaminases élevées, complication neurologique, plaquettes &lt; 150 G/L, hémolyse) ; ou dysfonction utéroplacentaire (retard de croissance, Doppler anormal, mort fœtale).</p>
<div class="lab">Physiopathologie</div><p>Défaut de remodelage des artères spiralées → ischémie placentaire → excès de sFlt-1 et baisse du PlGF → dysfonction endothéliale maternelle diffuse.</p>
<div class="lab">Gravité et traitement</div><p>Pression ≥ 160/110 mmHg, céphalées, troubles visuels, douleur épigastrique, oligurie, œdème pulmonaire, thrombopénie, cytolyse, éclampsie. Seul traitement curatif : l’accouchement ; contrôle tensionnel et sulfate de magnésium dans les formes sévères.</p>
<div class="lab">Facteurs de risque</div><p>Antécédent de prééclampsie, hypertension chronique, maladie rénale, diabète, lupus, syndrome des antiphospholipides, grossesse multiple, primiparité, âge &gt; 40 ans, obésité, procréation médicalement assistée.</p></template>

<template data-pop="i10-hellp" data-title="Syndrome HELLP">
<div class="lab">Définition et clinique</div><p>Hémolyse, cytolyse hépatique et thrombopénie ; douleur épigastrique ou de l’hypochondre droit, nausées ; l’hypertension peut être modérée.</p>
<div class="lab">Complications et conduite</div><p>Hématome sous-capsulaire du foie, coagulation intravasculaire disséminée, hématome rétroplacentaire, insuffisance rénale aiguë. Centre périnatal, sulfate de magnésium, contrôle tensionnel, accouchement.</p></template>

<template data-pop="i10-sflt" data-title="Rapport sFlt-1/PlGF">
<div class="lab">Biologie</div><p>Le placenta ischémique produit un excès de sFlt-1, qui capte le PlGF ; le rapport augmente dans les semaines qui précèdent la prééclampsie.</p>
<div class="lab">Seuils</div><p>≤ 38 : exclusion d’une prééclampsie dans la semaine suivante, valeur prédictive négative d’environ 99 % (étude PROGNOSIS, 2016). &gt; 85 avant 34 semaines ou &gt; 110 ensuite : fortement évocateur.</p>
<div class="lab">Usage en Suisse</div><p>Entre 20 et 37 semaines, pour décider d’une hospitalisation ou d’une surveillance ambulatoire ; cadre fixé par l’avis d’experts n° 67 de la Société suisse de gynécologie et d’obstétrique. Il ne remplace pas la clinique.</p></template>

<template data-pop="i10-asp" data-title="Acide acétylsalicylique et prévention de la prééclampsie">
<div class="lab">Indication en Suisse</div><p>Dépistage combiné du premier trimestre (facteurs maternels, pression artérielle moyenne, Doppler des artères utérines, PlGF) avec un risque de prééclampsie avant 37 semaines &gt; 1/100, ou facteur de risque élevé (antécédent de prééclampsie, hypertension chronique, maladie rénale, diabète, lupus, antiphospholipides) : avis d’experts n° 57 de la Société suisse de gynécologie et d’obstétrique (2019).</p>
<div class="lab">Posologie</div><p>100 à 150 mg le soir, débuté avant 16 semaines (idéalement vers 12) et poursuivi jusqu’à 36 semaines (même schéma : ESC 2025 sur la maladie cardiovasculaire et la grossesse, ESH 2023). L’essai ASPRE (2017), à 150 mg, a réduit de 62 % la prééclampsie avant 37 semaines.</p>
<div class="lab">Mécanisme</div><p>Moins de thromboxane, meilleure placentation, à condition de débuter tôt.</p></template>

<template data-pop="i10-mgso4" data-title="Sulfate de magnésium">
<div class="lab">Indications et schéma</div><p>Prévention et traitement de l’éclampsie ; neuroprotection fœtale avant 32 semaines. Charge de 4 g par voie intraveineuse en 15 à 20 minutes, puis 1 g/heure pendant 24 heures (schéma de l’essai Magpie), selon le protocole local.</p>
<div class="lab">Surveillance</div><p>Réflexes ostéotendineux, fréquence respiratoire, diurèse, magnésémie si insuffisance rénale. Surdosage : aréflexie, dépression respiratoire ; antidote : gluconate de calcium. Ce n’est pas un antihypertenseur.</p></template>

<!-- ===== FENÊTRES I10 : prise en charge ===== -->
<template data-pop="i10-dash" data-title="Alimentation DASH et méditerranéenne">
<div class="lab">Contenu et preuve</div><p>Fruits, légumes, légumineuses, céréales complètes, produits laitiers maigres, noix ; peu de viandes transformées et de sucres. Essai DASH (1997) : − 11/5,5 mmHg chez les hypertendus en huit semaines, sans perte de poids ; effet additionné à la réduction du sel (DASH-Sodium, 2001). Le régime méditerranéen suit les mêmes principes et réduit les événements.</p></template>

<template data-pop="i10-mnemo-acd" data-title="A + C + D : les associations privilégiées">
<p><b>A</b> — bloqueur de l’<b>A</b>ngiotensine : IEC ou ARA II.<br><b>C</b> — inhibiteur <b>C</b>alcique dihydropyridinique.<br><b>D</b> — <b>D</b>iurétique thiazidique ou apparenté.</p>
<div class="lab">Règles</div><p>Étape 1 : A + C ou A + D. Étape 2 : A + C + D. Étape 3 : spironolactone. Jamais deux « A ». Bêtabloquant à toute étape si indication propre.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique dérivé des algorithmes ESC et ESH, non critère officiel.</p></template>

<template data-pop="i10-finer" data-title="Finérénone dans la maladie rénale diabétique">
<div class="lab">Mécanisme et preuves</div><p>Antagoniste minéralocorticoïde non stéroïdien, anti-inflammatoire et antifibrosant, à effet tensionnel modeste. FIDELIO-DKD et FIGARO-DKD : chez le diabétique de type 2 albuminurique sous IEC ou ARA II à dose maximale, moins de progression rénale et d’événements cardiovasculaires, surtout d’insuffisance cardiaque.</p>
<div class="lab">Conditions</div><p>Kaliémie ≤ 5,0 mmol/L, filtration ≥ 25 mL/min/1,73 m² ; 10 ou 20 mg/jour selon la filtration ; kaliémie à quatre semaines. Traitement néphroprotecteur, non antihypertenseur de routine.</p></template>

<template data-pop="i10-dnr" data-title="Dénervation rénale">
<div class="lab">Principe</div><p>Destruction par cathéter (radiofréquence ou ultrasons) des fibres sympathiques périartérielles rénales, surtout distales et sur les branches, où elles sont proches de la lumière.</p>
<div class="lab">Preuves</div><p>SYMPLICITY HTN-3 (2014) négatif. SPYRAL HTN (patients sans puis sous traitement), RADIANCE-HTN et RADIANCE II (2018–2023), contre procédure simulée : − 4 à 6 mmHg de pression ambulatoire diurne de plus que la procédure simulée, durable. Aucune preuve sur les événements.</p>
<div class="lab">Indications</div><p>ESC 2024, IIb : hypertension résistante non contrôlée par trois médicaments, ou intolérance aux médicaments, après décision partagée et évaluation multidisciplinaire, dans un centre à volume moyen ou élevé. Contre-indiquée si la filtration est &lt; 40 mL/min/1,73 m² (III), en cas d’hypertension secondaire ou d’anatomie défavorable. Complications rares : point de ponction, dissection ou sténose de l’artère rénale.</p></template>
