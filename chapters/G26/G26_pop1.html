<template data-pop="g26-hba1c" data-title="Glycémie et hémoglobine glyquée">
<div class="lab">Définition</div><p data-evidence="G26-C0142" data-src="S7,S8">La glycémie mesure le glucose sanguin au moment du prélèvement ; l’hémoglobine glyquée (HbA1c) en résume le niveau sur une période plus longue. Dans la striatopathie diabétique, la série de 176 patients donne une glycémie moyenne de 414 mg/dl et une HbA1c moyenne de 13,1 % ; la revue de 214 cas donne une glycémie médiane de 379 mg/dl et une HbA1c médiane de 13,7 %.</p><div class="lab">Application</div><p data-evidence="G26-C0143" data-src="S7,S8">Une chorée aiguë ou subaiguë chez un patient diabétique impose de mesurer les deux valeurs. Elles ne sont pas des seuils diagnostiques : aucun critère formel validé n’a été lu, et le diabète n’est connu que dans 78,1 % des cas de la revue ; la chorée a même révélé le diabète chez 61 patients.</p><div class="lab">Limite</div><p data-evidence="G26-C0144" data-src="S8">Ces valeurs décrivent des cas publiés. Un mouvement peut persister ou s’aggraver après la normalisation glycémique, ce qui limite le rôle explicatif de la seule glycémie.</p></template>
<template data-pop="g26-codage" data-title="G26* : code de manifestation">
<div class="lab">Définition</div><p data-evidence="G26-C0145" data-src="S1,S2">Un astérisque (*) marque un code de manifestation : il décrit l’expression d’une maladie déjà codée par un code (†). La CIM-10-GM 2024 ne liste sous G26* aucune inclusion, exclusion ou sous-code.</p><div class="lab">Application</div><p data-evidence="G26-C0146" data-src="S1,S2">Le clinicien enregistre d’abord la maladie causale (†), puis G26* pour le trouble du mouvement qu’elle provoque. Sans maladie causale identifiée, le code ne s’emploie pas.</p><div class="lab">Limite</div><p data-evidence="G26-C0147" data-src="S1">Les paires officielles † / G26* n’ont pas pu être lues : l’index alphabétique de la classification n’a pas été consulté. Le périmètre exact reste à confirmer avec l’index officiel.</p></template>
<template data-pop="g26-g22" data-title="G21, G22* et G26*">
<div class="lab">Définition</div><p data-evidence="G26-C0148" data-src="S1">G21 désigne le parkinsonisme secondaire (sous-code 0 syndrome malin des neuroleptiques, 1 autre parkinsonisme médicamenteux, 2 autres agents externes, 3 postencéphalitique, 4 vasculaire, 8 autre, 9 sans précision). G22* désigne le parkinsonisme au cours d’affections classées ailleurs, par exemple la syphilis (code † A52, sous-code 1).</p><div class="lab">Application</div><p data-evidence="G26-C0149" data-src="S1">Par déduction de la structure du bloc, les autres troubles du mouvement au cours de maladies classées ailleurs (chorée, ballisme, dystonie, myoclonies, tremblement) relèvent de G26*.</p><div class="lab">Limite</div><p data-evidence="G26-C0150" data-src="S1">Cette frontière est déduite, non lue dans une définition officielle. Les troubles d’origine médicamenteuse se codent probablement hors G26*, ce qui n’a pas été vérifié.</p></template>
<template data-pop="g26-chorea" data-title="Chorée, dystonie, myoclonie, parkinsonisme">
<div class="lab">Définition</div><p data-evidence="G26-C0151" data-src="S6">La chorée est faite de mouvements brefs, irréguliers, sans but, qui passent de façon imprévisible d’une partie du corps à l’autre. La dystonie est une contraction musculaire soutenue ou intermittente qui cause des mouvements ou des postures anormaux. La myoclonie est une secousse très brève, en décharge. Le parkinsonisme se définit par la bradykinésie.</p><div class="lab">Application</div><p data-evidence="G26-C0152" data-src="S3,S6">Nommer le mouvement oriente le bilan : la chorée évoque d’abord les causes métaboliques et auto-immunes, la dystonie et le parkinsonisme évoquent aussi la maladie de Wilson. Un parkinsonisme « atypique » répond mal à la lévodopa.</p><div class="lab">Limite</div><p data-evidence="G26-C0153" data-src="S3">Les tics, l’akathisie, l’épilepsie focale et le myoclonus-dystonie peuvent imiter la chorée.</p></template>
<template data-pop="g26-striatopathie" data-title="Striatopathie diabétique">
<div class="lab">Définition</div><p data-evidence="G26-C0154" data-src="S7">Hyperglycémie associée à une chorée ou un ballisme et, ou, à des anomalies du striatum en imagerie ; la nomenclature est encore ambiguë (hémichorée-hémiballisme hyperglycémique).</p><div class="lab">Profil</div><p data-evidence="G26-C0155" data-src="S7,S8">Femme âgée dans les deux séries (rapport hommes-femmes 1 pour 1,7 ; 65,3 % de femmes), âge médian de 71 ans, diabète de type 2 dans 96,6 % des cas de la première série. Hémichorée ou hémiballisme dans 88,1 %, chorée bilatérale dans 9,7 %.</p><div class="lab">Évolution</div><p data-evidence="G26-C0156" data-src="S7">Contrôle glycémique seul : succès dans 25,7 % des cas ; avec antichoréique : 76,2 %. Récidive dans 18,2 %.</p><div class="lab">Limite</div><p data-evidence="G26-C0157" data-src="S7,S8">Aucun critère diagnostique formel validé n’a été lu ; la majorité des cas viennent d’Asie, avec un biais de publication possible.</p></template>
<template data-pop="g26-dhca" data-title="Dégénérescence hépatocérébrale acquise">
<div class="lab">Définition</div><p data-evidence="G26-C0158" data-src="S11,S12">Syndrome neurologique chronique des hépatopathies avancées, surtout avec shunts porto-systémiques, facteur de risque principal.</p><div class="lab">Mécanisme</div><p data-evidence="G26-C0159" data-src="S11">Accumulation de substances toxiques, ammoniac et manganèse, avec neuro-inflammation. L’imagerie montre une hyperintensité T1 bilatérale du pallidum.</p><div class="lab">Prise en charge</div><p data-evidence="G26-C0160" data-src="S12">Les antiparkinsoniens améliorent cliniquement ; la transplantation hépatique n’a pas amélioré l’état neurologique chez deux patients et son rôle reste controversé.</p><div class="lab">Limite</div><p data-evidence="G26-C0161" data-src="S11,S12">Seul un résumé a été lu pour chaque article ; aucune recommandation européenne dédiée n’a été trouvée.</p></template>
<template data-pop="g26-wilson" data-title="Maladie de Wilson">
<div class="lab">Définition</div><p data-evidence="G26-C0162" data-src="S4">Maladie autosomique récessive du gène ATP7B : défaut d’excrétion biliaire du cuivre et d’incorporation dans la céruloplasmine, avec accumulation toxique dans le foie puis le cerveau. Plus de 800 variants pathogènes, sans corrélation génotype-phénotype.</p><div class="lab">Clinique</div><p data-evidence="G26-C0163" data-src="S4">Parkinsonisme, dyskinésie choréo-athétosique, dystonie ou syndrome cérébelleux ; signes pyramidaux rares, troubles sensitifs jamais. Formes : pseudosclérotique (tremblement, dysarthrie scandée, ataxie), pseudo-parkinsonienne, arythmique-hyperkinétique (choréo-athétose, dystonie).</p><div class="lab">Application</div><p data-evidence="G26-C0164" data-src="S4">Tout trouble extrapyramidal inexpliqué jusqu’à 45 ans doit faire évoquer la maladie. Début entre 5 et 45 ans, avec un pic de 13 à 24 ans.</p><div class="lab">Limite</div><p data-evidence="G26-C0165" data-src="S5">La recommandation EASL-ERN 2025 n’a pu être lue que dans son résumé.</p></template>
<template data-pop="g26-gaba" data-title="GABA et désinhibition">
<div class="lab">Définition</div><p data-evidence="G26-C0166" data-src="S8">Le GABA est ici un substrat alternatif utilisé par le cerveau hyperglycémique, dans l’hypothèse d’un métabolisme tourné vers les voies anaérobies avec baisse du cycle de Krebs.</p><div class="lab">Application</div><p data-evidence="G26-C0167" data-src="S8">Selon ce modèle, l’utilisation du GABA désinhiberait le noyau sous-thalamique et les noyaux gris, d’où le mouvement involontaire.</p><div class="lab">Limite</div><p data-evidence="G26-C0168" data-src="S8">Le modèle n’explique pas les cas qui persistent ou s’aggravent après normalisation glycémique ; il s’agit d’une hypothèse, non d’un fait établi.</p></template>
<template data-pop="g26-kf" data-title="Anneau de Kayser-Fleischer">
<div class="lab">Définition</div><p data-evidence="G26-C0169" data-src="S4">Dépôt de cuivre cornéen recherché à l’examen oculaire ; quasi pathognomonique de la maladie de Wilson, surtout avec signes neurologiques.</p><div class="lab">Application</div><p data-evidence="G26-C0170" data-src="S4">Avec une céruloplasmine inférieure à 10 mg/dl, il constitue une constellation suffisante. Il vaut 2 points dans le score de Leipzig.</p><div class="lab">Limite</div><p data-evidence="G26-C0171" data-src="S4">Son absence n’exclut pas le diagnostic : il manque souvent chez l’enfant et dans la forme hépatique ; il est rarement présent dans d’autres cholestases chroniques.</p></template>
<template data-pop="g26-bilan" data-title="Bilan de laboratoire d’une chorée sporadique">
<div class="lab">Définition</div><p data-evidence="G26-C0172" data-src="S3">Ensemble d’examens proposé par la directive allemande, approuvée par la Société suisse de neurologie : tests hépatiques, CK et frottis, vitamine B12, ferritine, ASLO, anti-DNase B, céruloplasmine, cuivre sérique et urinaire, ANA, ENA, anti-ADN double brin, ANCA, anticorps antiphospholipides, TSH, parathormone, sérologies, VIH.</p><div class="lab">Application</div><p data-evidence="G26-C0173" data-src="S3">Il vise les causes réversibles ; glycémie, natrémie et calcémie sont les causes métaboliques à exclure en premier.</p><div class="lab">Limite</div><p data-evidence="G26-C0174" data-src="S3">La liste est une énumération sans hiérarchie de fréquence ; le médecin la module selon le contexte.</p></template>
<template data-pop="g26-irm" data-title="IRM des noyaux gris">
<div class="lab">Définition</div><p data-evidence="G26-C0175" data-src="S3">Imagerie de première intention pour exclure une cause symptomatique ; la tomodensitométrie la remplace en cas de contre-indication.</p><div class="lab">Application</div><p data-evidence="G26-C0176" data-src="S3,S4,S11">Hyperintensité T1 putaminale (hyperglycémie non cétosique), signal T1 anormal et signe du panda géant (Wilson), hyperintensité T1 bilatérale du pallidum (DHCA), calcifications (hypoparathyroïdie).</p><div class="lab">Limite</div><p data-evidence="G26-C0177" data-src="S7,S8">Discordance TDM/IRM chez environ un patient sur six, IRM normale dans 5,2 % des cas de striatopathie ; dans le Wilson, l’imagerie documente mais ne pose pas le diagnostic.</p></template>
<template data-pop="g26-diffs" data-title="Diagnostics différentiels de la chorée">
<div class="lab">Définition</div><p data-evidence="G26-C0178" data-src="S3">Épilepsie focale, tics, akathisie, myoclonus-dystonie, maladie de Huntington et autres chorées génétiques.</p><div class="lab">Application</div><p data-evidence="G26-C0179" data-src="S3">Les tics sont précédés d’une sensation impérieuse et brièvement répressibles. L’akathisie est difficile à distinguer et souvent induite par les neuroleptiques, surtout la tétrabénazine. La maladie de Huntington est la chorée héréditaire la plus fréquente ; environ 8 % des patients n’ont pas d’antécédent familial.</p><div class="lab">Limite</div><p data-evidence="G26-C0180" data-src="S6">L’encéphalite anti-NMDAR de l’enfant peut être confondue au début avec une chorée de Sydenham.</p></template>
<template data-pop="g26-smn" data-title="Syndrome malin des neuroleptiques">
<div class="lab">Définition</div><p data-evidence="G26-C0181" data-src="S15">Complication rare des antidopaminergiques, mentionnée dans l’information suisse de la tétrabénazine : altération psychique, rigidité, hyperthermie, dysautonomie, CK élevées.</p><div class="lab">Application</div><p data-evidence="G26-C0182" data-src="S15">Arrêt immédiat du médicament. Le syndrome figure aussi dans la classification sous G21 (sous-code 0).</p><div class="lab">Limite</div><p data-evidence="G26-C0183" data-src="S1,S15">Le tableau est rare ; il reste à évoquer chez tout patient sous antichoréique devenu rigide et fébrile.</p></template>
<template data-pop="g26-wilsonaigu" data-title="Wilson : insuffisance hépatique aiguë">
<div class="lab">Définition</div><p data-evidence="G26-C0184" data-src="S4">Forme hépatique fulminante de la maladie de Wilson.</p><div class="lab">Application</div><p data-evidence="G26-C0185" data-src="S4">La transplantation hépatique est décidée selon le « New Wilson Index ». Elle est aussi envisageable, à titre exceptionnel, dans les formes neurologiques réfractaires.</p><div class="lab">Limite</div><p data-evidence="G26-C0186" data-src="S4">Le dossier ne détaille ni le calcul de l’indice ni ses seuils.</p></template>
<template data-pop="g26-chelation" data-title="Chélation du cuivre : principe">
<div class="lab">Définition</div><p data-evidence="G26-C0187" data-src="S4">Un chélateur fixe le cuivre et en favorise l’élimination urinaire. Le zinc agit autrement et sert à l’entretien.</p><div class="lab">Application</div><p data-evidence="G26-C0188" data-src="S4">Dans les formes hépatiques et neurologiques symptomatiques, on débute par un chélateur à dose progressive ; la cuprurie sert de contrôle (cible basale inférieure à 100 µg/j).</p><div class="lab">Limite</div><p data-evidence="G26-C0189" data-src="S4">Une amélioration est attendue en 6 à 24 mois ; l’initiation trop rapide peut aggraver l’atteinte neurologique.</p></template>
<template data-pop="g26-aggravation" data-title="Aggravation neurologique paradoxale">
<div class="lab">Définition</div><p data-evidence="G26-C0190" data-src="S4,S18">Aggravation des signes neurologiques en début de chélation, parfois irréversible, par mobilisation trop rapide du cuivre ; l’information suisse de la trientine évoque un excès de cuivre libre.</p><div class="lab">Application</div><p data-evidence="G26-C0191" data-src="S4">On évite l’aggravation par une montée lente ; dans les formes neurologiques, les paliers de D-pénicillamine sont espacés de 1 à 2 semaines et l’escalade est suspendue en cas d’aggravation. Pour la trientine, le suivi a lieu toutes les 2 à 3 semaines.</p><div class="lab">Limite</div><p data-evidence="G26-C0192" data-src="S4">Le mécanisme précis n’est pas détaillé dans les sources lues.</p></template>
<template data-pop="g26-horsindication" data-title="Statut hors indication suisse">
<div class="lab">Définition</div><p data-evidence="G26-C0193" data-src="S15,S16,S17">Les informations professionnelles de Xenazine®, Tiapridal® et Haldol® n’indiquent aucune chorée secondaire. Xenazine® cible la maladie de Huntington ; Tiapridal® la chorée de Huntington sévère et les tics ; Haldol® n’a pas d’indication pour une chorée secondaire.</p><div class="lab">Application</div><p data-evidence="G26-C0194" data-src="S3">La directive allemande propose pourtant ces produits ; une prescription dans une chorée secondaire est donc un choix argumenté, hors indication, qui se documente.</p><div class="lab">Limite</div><p data-evidence="G26-C0195" data-src="S15,S16,S17">Ce constat est déduit de la lecture des trois informations professionnelles, sans consultation d’une autorité de remboursement.</p></template>
<template data-pop="g26-unites" data-title="Unités de glycémie (calcul de conversion)">
<div class="lab">Définition</div><p data-evidence="G26-C0196">Les publications citent la glycémie en mg/dl, les laboratoires suisses en mmol/L. La conversion approchée est : glycémie en mmol/L ≈ glycémie en mg/dl divisée par 18.</p><div class="lab">Application</div><p data-evidence="G26-C0197" data-src="S7,S8">Glycémie moyenne de 414 mg/dl : environ 23 mmol/L. Glycémie médiane de 379 mg/dl : environ 21 mmol/L.</p><div class="lab">Limite</div><p data-evidence="G26-C0198">Ce calcul de conversion est une opération arithmétique ajoutée par le rédacteur ; il ne provient pas du dossier de sources. Les valeurs de référence suisses n’ont pas été lues pour cette leçon et sont à confirmer avec le laboratoire.</p></template>
<template data-pop="g26-petfdg" data-title="TEP-FDG">
<div class="lab">Définition</div><p data-evidence="G26-C0199" data-src="S3">Tomographie par émission de positons au fluorodésoxyglucose, réservée à des cas particuliers.</p><div class="lab">Application</div><p data-evidence="G26-C0200" data-src="S3,S10">Hypermétabolisme des noyaux gris dans la chorée de Sydenham et l’encéphalite auto-immune ; hypoperfusion striatale controlatérale dans l’hémichorée hyperglycémique ; hypermétabolisme bilatéral rapporté dans la chorée hyperthyroïdienne.</p><div class="lab">Limite</div><p data-evidence="G26-C0201" data-src="S3">Examen de seconde intention ; il n’est pas un critère diagnostique.</p></template>
<template data-pop="g26-cuivre" data-title="Cuivre : urinaire, sérique, libre, hépatique">
<div class="lab">Définition</div><p data-evidence="G26-C0202" data-src="S4">Seuils de la directive : urinaire supérieur à 100 µg/24 h (enfant : sûrement normal seulement inférieur à 40 µg/24 h) ; sérique inférieur à 70 µg/dl ; libre supérieur à 10 µg/dl (cuivre échangeable relatif supérieur à 18,5 %) ; hépatique supérieur à 250 µg/g de poids sec.</p><div class="lab">Application</div><p data-evidence="G26-C0203" data-src="S4">Le cuivre urinaire est aussi le paramètre de suivi : cible basale inférieure à 100 µg/j après deux jours de pause, valeur supérieure à 500 µg/24 h sous D-pénicillamine.</p><div class="lab">Limite</div><p data-evidence="G26-C0204" data-src="S4">Les seuils sont des repères d’experts de niveau S1 ; ils se lisent avec la clinique et le score de Leipzig.</p></template>
<template data-pop="g26-ceruloplasmine" data-title="Céruloplasmine">
<div class="lab">Définition</div><p data-evidence="G26-C0205" data-src="S4">Protéine qui incorpore le cuivre ; basse dans la maladie de Wilson (inférieure à 20 mg/dl, typiquement inférieure à 10).</p><div class="lab">Application</div><p data-evidence="G26-C0206" data-src="S4">Avec l’anneau de Kayser-Fleischer, une céruloplasmine inférieure à 10 mg/dl suffit à poser le diagnostic.</p><div class="lab">Limite</div><p data-evidence="G26-C0207" data-src="S4">Elle baisse en cas de malnutrition, d’insuffisance hépatique ou de fuite protéique et monte avec les œstrogènes et l’inflammation : une valeur isolée ou limite n’est ni sensible ni spécifique.</p></template>
<template data-pop="g26-leipzig" data-title="Score de Leipzig">
<div class="lab">Définition</div><p data-evidence="G26-C0208" data-src="S4">Score cumulatif de huit éléments : anneau de Kayser-Fleischer, symptômes neuropsychiatriques, anémie hémolytique à Coombs négatif, cuivre urinaire, cuivre hépatique, rhodanine, céruloplasmine, mutation ATP7B.</p><div class="lab">Application</div><p data-evidence="G26-C0209" data-src="S4">Total supérieur ou égal à 4 : diagnostic très probable ; 2 à 3 : possible ; 0 à 1 : improbable.</p><div class="lab">Limite</div><p data-evidence="G26-C0210" data-src="S5">L’EASL-ERN 2025 le complète par le cuivre échangeable relatif ; le texte intégral n’a pas été lu.</p></template>
<template data-pop="g26-anticorps" data-title="Anticorps neuronaux">
<div class="lab">Définition</div><p data-evidence="G26-C0211" data-src="S6">Anticorps dirigés contre des antigènes de surface (NMDAR, LGI1, CASPR2) ou intracellulaires (onconeuronaux, par exemple Hu, Yo, Ma2, CRMP-5).</p><div class="lab">Application</div><p data-evidence="G26-C0212" data-src="S6,S3">Les anticorps de surface répondent habituellement bien à l’immunothérapie ; les anticorps onconeuronaux accompagnent des syndromes progressifs et orientent vers une recherche de tumeur.</p><div class="lab">Limite</div><p data-evidence="G26-C0213" data-src="S6">Le liquide cérébro-spinal de base est souvent normal dans les formes LGI1/CASPR2 ; la revue source est narrative.</p></template>
