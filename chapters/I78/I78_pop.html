<template data-pop="i78-hht" data-title="Télangiectasie hémorragique héréditaire"><p><b>Définition (recommandations internationales 2020).</b> Maladie autosomique dominante, d’une prévalence d’environ 1 sur 5000, caractérisée par des malformations vasculaires de la peau, des muqueuses du nez et du tube digestif, du cerveau, du poumon et du foie.</p><p><b>Conséquences.</b> Saignements chroniques, hémorragies aiguës et complications du shunt à travers les malformations. Synonymes : maladie de Rendu-Osler, syndrome de Rendu-Osler-Weber (CIM-10-GM I78.0).</p></template>
<template data-pop="i78-telang" data-title="Télangiectasie"><p>Petite malformation vasculaire de 1 à 3 mm de la peau ou d’une muqueuse, où une artériole rejoint directement une veinule dilatée sans capillaire intermédiaire.</p><p><b>Aspect.</b> Tache rouge plane ou étoilée, parfois légèrement saillante, qui blanchit à la pression et n’est pas pulsatile. <b>Sites caractéristiques (Curaçao).</b> Lèvres, cavité buccale, doigts, nez.</p></template>
<template data-pop="i78-mav" data-title="Malformation artérioveineuse viscérale"><p>Communication directe et volumineuse entre une artère et une veine d’un organe profond, sans réseau capillaire.</p><p><b>Organes et risques.</b> Poumon : hypoxémie, embolie paradoxale, abcès cérébral, hémoptysie. Cerveau et moelle : hémorragie. Foie : insuffisance cardiaque à haut débit, hypertension pulmonaire et portale, ischémie biliaire. Tube digestif : saignement chronique.</p></template>
<template data-pop="i78-stellaire" data-title="Angiome stellaire (diagnostic différentiel)"><p>Lésion vasculaire bénigne faite d’une artériole centrale d’où partent de fins vaisseaux radiaires ; la pression du centre la fait disparaître, et l’artériole centrale peut battre. Elle se rencontre notamment au cours des hépatopathies chroniques et de la grossesse (sémiologie classique ; CIM-10-GM I78.1).</p><p><b>Distinction.</b> Les télangiectasies de la maladie de Rendu-Osler sont planes et non pulsatiles, et elles s’associent aux épistaxis et à l’histoire familiale.</p></template>
<template data-pop="i78-mavp" data-title="Malformation artérioveineuse pulmonaire"><p>Communication directe entre une branche de l’artère pulmonaire et une veine pulmonaire, qui crée un shunt droite-gauche.</p><p><b>Conséquences.</b> Hypoxémie, cyanose, hippocratisme ; passage systémique de caillots, de bulles et de bactéries, d’où accident vasculaire cérébral et abcès cérébral ; hémoptysie, surtout pendant la grossesse.</p><p><b>Dépistage.</b> Échocardiographie de contraste ; confirmation par scanner. <b>Traitement.</b> Embolisation ; chez l’enfant, artère afférente d’au moins 3 mm accessible à l’embolisation (recommandations 2020).</p></template>
<template data-pop="i78-eng" data-title="Gène ENG (type 1)"><p>Gène de l’endogline, corécepteur endothélial de la voie de signalisation de la protéine morphogénétique osseuse 9. Ses mutations causent la télangiectasie hémorragique héréditaire de type 1, plus souvent associée aux malformations pulmonaires et cérébrales.</p></template>
<template data-pop="i78-acvrl1" data-title="Gène ACVRL1 (type 2)"><p>Gène du récepteur de type I ALK1, exprimé par l’endothélium. Ses mutations causent la télangiectasie hémorragique héréditaire de type 2, plus souvent associée aux malformations hépatiques.</p></template>
<template data-pop="i78-smad4" data-title="Gène SMAD4 (polypose juvénile)"><p>Gène d’un messager intracellulaire commun aux voies de la famille du facteur de croissance transformant bêta. Ses mutations causent un syndrome associant polypose juvénile et télangiectasie hémorragique héréditaire.</p><p><b>Conséquence pratique (recommandations 2020).</b> Coloscopie dès 15 ans, tous les 3 ans sans polype, ou chaque année avec gastroscopie si des polypes sont trouvés.</p></template>
<template data-pop="i78-ess" data-title="Score de sévérité des épistaxis"><p>Questionnaire validé (Hoag et al., 2010) qui combine la fréquence, la durée et l’intensité des épistaxis, le recours aux soins, l’anémie et les transfusions ; il donne un score de 0 à 10.</p><p><b>Usage.</b> Mesurer le retentissement et l’effet d’un traitement ; c’est le critère de jugement des essais randomisés cités par les recommandations 2020.</p></template>
<template data-pop="i78-curacao" data-title="Critères de Curaçao (2000)"><p><b>Quatre critères.</b> 1. Épistaxis spontanées et récidivantes. 2. Télangiectasies multiples aux sites caractéristiques : lèvres, cavité buccale, doigts, nez. 3. Lésions viscérales : télangiectasies digestives, malformations artérioveineuses pulmonaires, hépatiques, cérébrales ou médullaires. 4. Parent au premier degré atteint selon ces critères.</p><p><b>Interprétation.</b> Certain : 3 ou 4 critères. Possible ou suspect : 2 critères. Peu probable : 0 ou 1 critère. Maintenus par les recommandations de 2011 et de 2020.</p></template>
<template data-pop="i78-etc" data-title="Échocardiographie de contraste"><p>Injection intraveineuse de sérum physiologique agité, qui forme des microbulles normalement arrêtées par les capillaires pulmonaires.</p><p><b>Lecture.</b> Bulles dans les cavités gauches après quelques cycles cardiaques : shunt intrapulmonaire ; apparition presque immédiate : shunt intracardiaque.</p><p><b>Place.</b> Dépistage des malformations pulmonaires chez l’adulte, l’enfant et la femme enceinte non dépistée (recommandations 2020).</p></template>
<template data-pop="i78-atx" data-title="Acide tranexamique oral"><p><b>Indication (recommandations 2020).</b> Épistaxis qui ne répondent pas à l’humidification ; saignement digestif léger.</p><p><b>Posologie suisse (Cyklokapron®).</b> Épistaxis prolongées ou récidivantes : 1 g 3 fois par jour pendant 7 jours ; hémorragies digestives : 1,5 g 3 fois par jour pendant 7 jours ; adaptation à la fonction rénale.</p><p><b>Contre-indications.</b> Maladie thromboembolique aiguë, hypercoagulabilité, coagulopathie de consommation, hémorragie sous-arachnoïdienne, insuffisance rénale sévère.</p></template>
<template data-pop="i78-beva" data-title="Bévacizumab intraveineux"><p>Anticorps monoclonal contre le facteur de croissance de l’endothélium vasculaire.</p><p><b>Place (recommandations 2020).</b> Épistaxis réfractaires (recommandation forte) ; saignement digestif modéré à sévère ; insuffisance cardiaque à haut débit d’origine hépatique après échec du traitement de première ligne.</p><p><b>En Suisse.</b> Hors indication (Avastin® : indications oncologiques). Risques : hypertension, protéinurie, perforation digestive, retard de cicatrisation.</p></template>
<template data-pop="i78-digestif" data-title="Gradation du saignement digestif"><p><b>Recommandations 2020, après au moins 3 mois de fer.</b> Léger : objectif d’hémoglobine atteint avec le fer oral. Modéré : objectif atteint avec le fer intraveineux. Sévère : objectif non atteint malgré un apport adéquat de fer, ou transfusions nécessaires.</p><p>L’objectif d’hémoglobine est individuel : âge, sexe, symptômes et comorbidités.</p></template>
<template data-pop="i78-precautions" data-title="Prévention des embolies paradoxales"><p>Chez un patient porteur d’une malformation pulmonaire, le filtre capillaire est court-circuité. C’est pourquoi les recommandations de 2011, maintenues en 2020, prévoient des filtres à air sur les perfusions intraveineuses et une antibioprophylaxie avant les gestes à risque de bactériémie, notamment dentaires.</p><p>Ces précautions s’appliquent aussi lors de l’endoscopie digestive.</p></template>
<template data-pop="i78-bmp9" data-title="Protéine morphogénétique osseuse 9"><p>Ligand circulant, codé par le gène GDF2, qui active sur l’endothélium le récepteur ALK1 avec son corécepteur, l’endogline ; le signal passe ensuite par les messagers SMAD, dont SMAD4.</p><p><b>Conséquence.</b> Une mutation de ENG, ACVRL1, SMAD4 ou, plus rarement, GDF2 diminue ce signal et favorise la formation de connexions artérioveineuses directes.</p></template>
<template data-pop="pareto-i78-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i78-0,i78-1,i78-2,i78-3,i78-4,i78-5,i78-6"></p><ul>
<li>Maladie autosomique dominante, environ 1 sur 5000, longtemps méconnue.</li>
<li>Télangiectasies muco-cutanées qui saignent ; malformations viscérales pulmonaires, cérébrales et hépatiques.</li>
<li>Shunt pulmonaire : hypoxémie, embolie paradoxale, abcès cérébral.</li>
<li>Gènes ENG, ACVRL1, SMAD4 ; SMAD4 impose un dépistage colique dès 15 ans.</li>
<li>Rechercher les télangiectasies aux lèvres, à la langue, aux doigts et au nez.</li></ul></template>
<template data-pop="pareto-i78-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i78-7,i78-8,i78-9"></p><ul>
<li>Curaçao : certain si 3 critères, possible si 2.</li>
<li>Dépister les malformations pulmonaires chez tous ; Doppler hépatique proposé à l’adulte.</li>
<li>Épistaxis : humidification, acide tranexamique, ablation, bévacizumab, chirurgie.</li>
<li>Saignement digestif gradé sur la réponse au fer.</li>
<li>Anticoagulation possible si indiquée ; éviter les associations d’antithrombotiques.</li></ul></template>
<template data-pop="pareto-i78-suivi" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="i78-10,i78-11"></p><ul>
<li>Suivi à vie en centre de compétence ; surveillance des malformations pulmonaires traitées.</li>
<li>Filtres à air et antibioprophylaxie si malformation pulmonaire.</li>
<li>Grossesse : dépistage, traitement au deuxième trimestre, péridurale non contre-indiquée.</li>
<li>Enfant : dépistage pulmonaire au diagnostic puis tous les 5 ans.</li></ul></template>
<template data-pop="pareto-i78-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i78-e-1,i78-e-2,i78-e-3"></p><ul>
<li>Échocardiographie de contraste pour le dépistage pulmonaire ; scanner pour confirmer.</li>
<li>Foie : échographie-Doppler ; jamais de biopsie hépatique.</li>
<li>Gastroscopie puis vidéocapsule pour le saignement digestif ; IRM cérébrale.</li></ul></template>
<template data-pop="pareto-i78-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i78-p-1,i78-p-2"></p><ul>
<li>Acide tranexamique : 1 g 3 fois par jour pour les épistaxis (Suisse) ; contre-indiqué en cas de thrombose aiguë.</li>
<li>Bévacizumab : hors indication en Suisse ; hypertension, protéinurie, cicatrisation.</li>
<li>Fer oral 35 à 65 mg une fois par jour ; fer intraveineux si échec.</li></ul></template>
