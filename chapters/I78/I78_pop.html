<template data-pop="i78-hht" data-title="Télangiectasie hémorragique héréditaire"><p><b>Définition (recommandations internationales 2020).</b> La télangiectasie hémorragique héréditaire est une maladie autosomique dominante, d’une prévalence d’environ 1 sur 5000. Elle se caractérise par des malformations vasculaires de la peau, des muqueuses du nez et du tube digestif, du cerveau, du poumon et du foie.</p><p><b>Conséquences.</b> La maladie provoque des saignements chroniques, des hémorragies aiguës et des complications du shunt à travers les malformations. Elle porte aussi les noms de maladie de Rendu-Osler et de syndrome de Rendu-Osler-Weber (CIM-10-GM I78.0).</p></template>
<template data-pop="i78-telang" data-title="Télangiectasie"><p>Une télangiectasie est une petite malformation vasculaire de 1 à 3 mm de la peau ou d’une muqueuse : une artériole y rejoint directement une veinule dilatée, sans capillaire intermédiaire, ce qui expose la veinule à la pression artérielle.</p><p><b>Aspect.</b> La lésion forme une tache rouge plane ou étoilée, parfois légèrement saillante ; elle blanchit à la pression et n’est pas pulsatile. <b>Sites caractéristiques (Curaçao).</b> Le médecin la cherche aux lèvres, dans la cavité buccale, aux doigts et au nez.</p><figure><img src="images/cardiologie/i78_telangiectasies_langue.gif" alt="Photographie réelle d’une langue tirée portant de nombreuses télangiectasies punctiformes rouges" width="520" height="346" loading="lazy" decoding="async">
<figcaption>Même image que la figure 2 du cours — Télangiectasies de la langue dans une télangiectasie hémorragique héréditaire : multiples points rouges sur le dos et les bords de la langue. Photographie de Herbert L. Fred et Hendrik A. van Dijk (<i>Images of Memorable Cases</i>), Wikimedia Commons, licence Creative Commons Attribution ; convertie pour l’atlas.</figcaption></figure><p>Cette photographie réelle montre l’aspect typique des télangiectasies : de petits points rouges qui pâlissent à la pression. Chacun est une connexion directe entre une artériole et une veinule sans capillaire intermédiaire ; la paroi fine saigne donc au moindre traumatisme, ce qui explique les épistaxis et les saignements digestifs.</p></template>
<template data-pop="i78-mav" data-title="Malformation artérioveineuse viscérale"><p>Une malformation artérioveineuse viscérale est une communication directe et volumineuse entre une artère et une veine d’un organe profond, sans réseau capillaire.</p><p><b>Organes et risques.</b> Au poumon, elle provoque hypoxémie, embolie paradoxale, abcès cérébral et hémoptysie. Au cerveau et à la moelle, elle expose à l’hémorragie. Au foie, elle entraîne une insuffisance cardiaque à haut débit, une hypertension pulmonaire et portale et une ischémie biliaire. Dans le tube digestif, elle cause un saignement chronique.</p></template>
<template data-pop="i78-stellaire" data-title="Angiome stellaire (diagnostic différentiel)"><p>Lésion vasculaire bénigne faite d’une artériole centrale d’où partent de fins vaisseaux radiaires ; la pression du centre la fait disparaître, et l’artériole centrale peut battre. Elle se rencontre notamment au cours des hépatopathies chroniques et de la grossesse (sémiologie classique ; CIM-10-GM I78.1).</p><p><b>Distinction.</b> Les télangiectasies de la maladie de Rendu-Osler sont planes et non pulsatiles, et elles s’associent aux épistaxis et à l’histoire familiale.</p></template>
<template data-pop="i78-mavp" data-title="Malformation artérioveineuse pulmonaire"><p>Communication directe entre une branche de l’artère pulmonaire et une veine pulmonaire, qui crée un shunt droite-gauche.</p><p><b>Conséquences.</b> Le shunt provoque hypoxémie, cyanose et hippocratisme. De plus, des caillots, des bulles et des bactéries passent dans la circulation systémique sans filtre capillaire, d’où l’accident vasculaire cérébral et l’abcès cérébral. Enfin, l’hémoptysie survient surtout pendant la grossesse.</p><p><b>Dépistage.</b> L’échocardiographie de contraste dépiste la malformation, et le scanner la confirme. <b>Traitement.</b> L’embolisation est le traitement ; chez l’enfant, elle s’envisage quand l’artère afférente mesure au moins 3 mm et reste accessible (recommandations 2020).</p><figure><img src="images/cardiologie/i78_mavp_histologie.gif" alt="Coupe histologique réelle de poumon montrant une veine pulmonaire très dilatée au sein du parenchyme alvéolaire" width="520" height="390" loading="lazy" decoding="async">
<figcaption>Même image que la figure 5 du cours — Malformation artérioveineuse pulmonaire, coupe d’autopsie colorée : veine pulmonaire très dilatée appartenant à la malformation, entourée de parenchyme alvéolaire ; ce patient avait des embolies systémiques de moelle osseuse par le shunt droite-gauche. Image de Yale Rosen, Wikimedia Commons, licence CC BY-SA 2.0 ; convertie pour l’atlas.</figcaption></figure><p>Cette coupe réelle montre une veine pulmonaire dilatée appartenant à la malformation. Le sang veineux y passe directement dans la circulation systémique sans traverser les capillaires filtrants ; c’est pourquoi des emboles paradoxaux, des abcès cérébraux et une hypoxémie peuvent survenir.</p></template>
<template data-pop="i78-eng" data-title="Gène ENG (type 1)"><p>ENG est le gène de l’endogline, corécepteur endothélial de la voie de signalisation de la protéine morphogénétique osseuse 9. Ses mutations causent la télangiectasie hémorragique héréditaire de type 1, plus souvent associée aux malformations pulmonaires et cérébrales.</p></template>
<template data-pop="i78-acvrl1" data-title="Gène ACVRL1 (type 2)"><p>ACVRL1 est le gène du récepteur de type I ALK1, exprimé par l’endothélium. Ses mutations causent la télangiectasie hémorragique héréditaire de type 2, plus souvent associée aux malformations hépatiques.</p></template>
<template data-pop="i78-smad4" data-title="Gène SMAD4 (polypose juvénile)"><p>SMAD4 est le gène d’un messager intracellulaire commun aux voies de la famille du facteur de croissance transformant bêta. Ses mutations causent un syndrome qui associe polypose juvénile et télangiectasie hémorragique héréditaire.</p><p><b>Conséquence pratique (recommandations 2020).</b> Coloscopie dès 15 ans, tous les 3 ans sans polype, ou chaque année avec gastroscopie si des polypes sont trouvés.</p></template>
<template data-pop="i78-ess" data-title="Score de sévérité des épistaxis"><p>Questionnaire validé (Hoag et al., 2010) qui combine la fréquence, la durée et l’intensité des épistaxis, le recours aux soins, l’anémie et les transfusions ; il donne un score de 0 à 10.</p><p><b>Usage.</b> Mesurer le retentissement et l’effet d’un traitement ; c’est le critère de jugement des essais randomisés cités par les recommandations 2020.</p></template>
<template data-pop="i78-curacao" data-title="Critères de Curaçao (2000)"><p><b>Quatre critères.</b> 1. Le patient a des épistaxis spontanées et récidivantes. 2. Il présente des télangiectasies multiples aux sites caractéristiques : lèvres, cavité buccale, doigts, nez. 3. Il porte des lésions viscérales : télangiectasies digestives ou malformations artérioveineuses pulmonaires, hépatiques, cérébrales ou médullaires. 4. Un parent au premier degré est atteint selon ces critères.</p><p><b>Interprétation.</b> Le diagnostic est certain avec 3 ou 4 critères, possible ou suspect avec 2 critères et peu probable avec 0 ou 1 critère. Les recommandations de 2011 et de 2020 ont maintenu ces critères.</p></template>
<template data-pop="i78-etc" data-title="Échocardiographie de contraste"><p>Injection intraveineuse de sérum physiologique agité, qui forme des microbulles normalement arrêtées par les capillaires pulmonaires.</p><p><b>Lecture.</b> Si les bulles apparaissent dans les cavités gauches après quelques cycles cardiaques, le shunt est intrapulmonaire, car elles ont dû traverser le poumon. Si elles apparaissent presque immédiatement, le shunt est intracardiaque.</p><p><b>Place.</b> L’examen dépiste les malformations pulmonaires chez l’adulte, chez l’enfant et chez la femme enceinte non dépistée (recommandations 2020).</p></template>
<template data-pop="i78-atx" data-title="Acide tranexamique oral"><p><b>Indication (recommandations 2020).</b> Épistaxis qui ne répondent pas à l’humidification ; saignement digestif léger.</p><p><b>Posologie suisse (Cyklokapron®).</b> Pour des épistaxis prolongées ou récidivantes, la dose est de 1 g 3 fois par jour pendant 7 jours ; pour des hémorragies digestives, elle est de 1,5 g 3 fois par jour pendant 7 jours. La dose s’adapte à la fonction rénale, car le médicament est éliminé par le rein.</p><p><b>Contre-indications.</b> L’acide tranexamique est contre-indiqué en cas de maladie thromboembolique aiguë, d’hypercoagulabilité, de coagulopathie de consommation, d’hémorragie sous-arachnoïdienne et d’insuffisance rénale sévère, car il freine la dissolution des caillots.</p></template>
<template data-pop="i78-beva" data-title="Bévacizumab intraveineux"><p>Le bévacizumab est un anticorps monoclonal dirigé contre le facteur de croissance de l’endothélium vasculaire ; il freine ainsi la formation des vaisseaux anormaux qui saignent.</p><p><b>Place (recommandations 2020).</b> Épistaxis réfractaires (recommandation forte) ; saignement digestif modéré à sévère ; insuffisance cardiaque à haut débit d’origine hépatique après échec du traitement de première ligne.</p><p><b>En Suisse.</b> Il est utilisé hors indication, car Avastin® n’est autorisé que dans des indications oncologiques. Il expose à l’hypertension, à la protéinurie, à la perforation digestive et au retard de cicatrisation.</p></template>
<template data-pop="i78-digestif" data-title="Gradation du saignement digestif"><p><b>Recommandations 2020, après au moins 3 mois de fer.</b> Le saignement est léger si le fer oral atteint l’objectif d’hémoglobine, modéré si le fer intraveineux est nécessaire pour l’atteindre, et sévère si l’objectif n’est pas atteint malgré un apport adéquat de fer ou si des transfusions sont nécessaires.</p><p>L’objectif d’hémoglobine est individuel : âge, sexe, symptômes et comorbidités.</p></template>
<template data-pop="i78-precautions" data-title="Prévention des embolies paradoxales"><p>Chez un patient porteur d’une malformation pulmonaire, le filtre capillaire est court-circuité. C’est pourquoi les recommandations de 2011, maintenues en 2020, prévoient des filtres à air sur les perfusions intraveineuses et une antibioprophylaxie avant les gestes à risque de bactériémie, notamment dentaires.</p><p>Ces précautions s’appliquent aussi lors de l’endoscopie digestive.</p></template>
<template data-pop="i78-bmp9" data-title="Protéine morphogénétique osseuse 9"><p>Ligand circulant, codé par le gène GDF2, qui active sur l’endothélium le récepteur ALK1 avec son corécepteur, l’endogline ; le signal passe ensuite par les messagers SMAD, dont SMAD4.</p><p><b>Conséquence.</b> Une mutation de ENG, ACVRL1, SMAD4 ou, plus rarement, GDF2 diminue ce signal et favorise la formation de connexions artérioveineuses directes.</p></template>
<template data-pop="pareto-i78-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i78-0,i78-1,i78-2,i78-3,i78-4,i78-5,i78-6"></p><ul>
<li>C’est une maladie autosomique dominante, d’une prévalence d’environ 1 sur 5000, longtemps méconnue.</li>
<li>Télangiectasies muco-cutanées qui saignent ; malformations viscérales pulmonaires, cérébrales et hépatiques.</li>
<li>Le shunt pulmonaire provoque hypoxémie, embolie paradoxale et abcès cérébral.</li>
<li>Gènes ENG, ACVRL1, SMAD4 ; SMAD4 impose un dépistage colique dès 15 ans.</li>
<li>Le médecin recherche les télangiectasies aux lèvres, à la langue, aux doigts et au nez.</li></ul></template>
<template data-pop="pareto-i78-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i78-7,i78-8,i78-9"></p><ul>
<li>Selon Curaçao, le diagnostic est certain avec 3 critères et possible avec 2.</li>
<li>Le médecin dépiste les malformations pulmonaires chez tous les patients et propose un Doppler hépatique à l’adulte.</li>
<li>Les épistaxis se traitent par humidification, acide tranexamique, ablation, bévacizumab, puis chirurgie.</li>
<li>Le saignement digestif se gradue selon la réponse au fer.</li>
<li>Une anticoagulation reste possible si elle est indiquée, mais il faut éviter les associations d’antithrombotiques, car elles majorent les saignements.</li></ul></template>
<template data-pop="pareto-i78-suivi" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="i78-10,i78-11"></p><ul>
<li>Le suivi se fait à vie en centre de compétence, avec surveillance des malformations pulmonaires traitées.</li>
<li>Filtres à air et antibioprophylaxie si malformation pulmonaire.</li>
<li>Pendant la grossesse, on dépiste et on traite au deuxième trimestre ; la péridurale n’est pas contre-indiquée.</li>
<li>Chez l’enfant, le dépistage pulmonaire a lieu au diagnostic puis tous les 5 ans.</li></ul></template>
<template data-pop="pareto-i78-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i78-e-1,i78-e-2,i78-e-3"></p><ul>
<li>L’échocardiographie de contraste dépiste les malformations pulmonaires, et le scanner les confirme.</li>
<li>Le foie s’explore par échographie-Doppler ; la biopsie hépatique est proscrite, car elle risque une hémorragie.</li>
<li>La gastroscopie puis la vidéocapsule explorent le saignement digestif ; l’IRM explore le cerveau.</li></ul></template>
<template data-pop="pareto-i78-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i78-p-1,i78-p-2"></p><ul>
<li>L’acide tranexamique se donne à 1 g 3 fois par jour pour les épistaxis (Suisse) ; il est contre-indiqué en cas de thrombose aiguë.</li>
<li>Le bévacizumab est hors indication en Suisse ; il expose à l’hypertension, à la protéinurie et au retard de cicatrisation.</li>
<li>Le fer oral se donne à 35 à 65 mg une fois par jour ; le fer intraveineux prend le relais en cas d’échec.</li></ul></template>
