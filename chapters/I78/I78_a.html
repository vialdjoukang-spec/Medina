<section class="ilot" id="i78-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 52 ans consulte pour une fatigue d’effort ; or, l’hémogramme montre une anémie microcytaire avec une ferritine effondrée. Interrogé, il rapporte des saignements de nez presque quotidiens depuis l’adolescence, que personne n’a jamais explorés, et sa mère avait « les mêmes points rouges » sur les lèvres. Dès lors, l’association d’épistaxis récidivantes, de petites taches rouges des lèvres et d’une histoire familiale oriente vers une maladie héréditaire des vaisseaux. La question qui structure ce cours est donc la suivante : <b>comment reconnaître une télangiectasie hémorragique héréditaire, dépister ses malformations viscérales silencieuses et traiter le saignement chronique ?</b></p>
<p>Pour y répondre, ce cours poursuit trois objectifs. D’abord, il pose le diagnostic clinique par les critères de Curaçao et, si besoin, par la génétique. Ensuite, il organise le dépistage des malformations pulmonaires, cérébrales et hépatiques, dont les complications sont graves mais évitables. Enfin, il hiérarchise le traitement des épistaxis, des saignements digestifs et de l’anémie, du geste le moins invasif au plus lourd. Par ailleurs, la catégorie I78 contient d’autres maladies des capillaires, comme l’angiome stellaire ; celles-ci sont donc situées par rapport à la maladie principale, dans la démarche diagnostique.</p>
</section>
<section class="ilot" id="i78-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>Il faut d’abord nommer la maladie avec précision. La <button class="w" data-k="i78-hht">télangiectasie hémorragique héréditaire (maladie de Rendu-Osler)</button> est, selon les recommandations internationales de 2020, une maladie autosomique dominante caractérisée par des malformations vasculaires de la peau et des muqueuses du nez et du tube digestif, ainsi que du cerveau, du poumon et du foie. Ces malformations entraînent, en effet, trois types de conséquences : des saignements chroniques, des hémorragies aiguës et des complications liées au shunt du sang à travers la malformation.</p>
<p>Cette définition distingue donc deux tailles de lésions, qui n’ont pas les mêmes risques. D’une part, la <button class="w" data-k="i78-telang">télangiectasie (lésion muco-cutanée)</button> est une petite malformation de la peau ou d’une muqueuse, qui saigne au moindre traumatisme. D’autre part, la <button class="w" data-k="i78-mav">malformation artérioveineuse viscérale (définition)</button> est une communication directe, plus volumineuse, entre une artère et une veine d’un organe profond ; elle est le plus souvent silencieuse, mais elle peut se rompre, emboliser ou surcharger le cœur.</p>

<p>Ainsi posée, la classification renvoie l’essentiel de la gravité aux malformations viscérales. C’est pourquoi l’épidémiologie et le pronostic, abordés ensuite, se lisent organe par organe.</p>
</section>
<section class="ilot" id="i78-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La maladie est rare, mais elle n’est pas exceptionnelle. En effet, sa prévalence est estimée à environ 1 sur 5000 (recommandations 2020). Or, elle reste sous-diagnostiquée, et un long délai diagnostique est fréquent ; de nombreux patients vivent donc des années avec des épistaxis et une anémie sans diagnostic, comme le patient du cas d’ouverture.</p>
<p>De plus, l’expression de la maladie dépend de l’âge. Ainsi, l’épistaxis, symptôme le plus fréquent, et les télangiectasies typiques apparaissent progressivement au cours de la vie (recommandations 2020) ; par conséquent, un enfant porteur peut ne remplir aucun critère clinique. À l’inverse, les malformations pulmonaires ont chez l’enfant une prévalence comparable à celle de l’adulte, avec un risque de complications graves (recommandations 2020, chapitre pédiatrique).</p>
<p>Le pronostic tient donc moins aux épistaxis qu’à leurs conséquences et aux malformations viscérales. D’une part, l’anémie ferriprive chronique est une complication fréquente, surtout chez l’adulte. D’autre part, les malformations pulmonaires exposent aux embolies paradoxales, les malformations cérébrales à l’hémorragie intracrânienne, et les malformations hépatiques à l’insuffisance cardiaque à haut débit. C’est pourquoi le dépistage occupe une place centrale dans la prise en charge.</p>
</section>
<section class="ilot" id="i78-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Pour comprendre ces complications, il faut partir de la lésion élémentaire. Dans une télangiectasie, une artériole se connecte directement à une veinule dilatée, sans lit capillaire intermédiaire. Or, le capillaire est normalement la zone où la pression chute ; en son absence, la pression artérielle s’exerce donc directement sur une paroi veineuse fine et fragile, qui saigne au moindre frottement, par exemple lors du mouchage ou du passage du bol alimentaire.</p>
<p>Les mêmes connexions directes, de plus grande taille, expliquent ensuite les complications viscérales. Ainsi, dans le poumon, une <button class="w" data-k="i78-mavp">malformation artérioveineuse pulmonaire (shunt droite-gauche)</button> court-circuite le filtre capillaire : le sang veineux passe sans être oxygéné, ce qui donne une hypoxémie, et les caillots, les bulles d’air ou les bactéries veineuses atteignent directement la circulation systémique, ce qui provoque accident vasculaire cérébral et abcès cérébral. De même, dans le foie, les shunts entre artère hépatique, veines hépatiques et veine porte augmentent le retour veineux ; le cœur doit alors élever son débit, jusqu’à l’insuffisance cardiaque à haut débit et l’hypertension pulmonaire.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> La paroi veineuse fine, exposée à la pression artérielle, se rompt facilement ; c’est pourquoi surviennent les épistaxis et le saignement digestif. Le shunt pulmonaire court-circuite les capillaires filtrants et provoque hypoxémie, embolie paradoxale et abcès cérébral. Le shunt hépatique augmente le retour veineux et entraîne un débit cardiaque élevé et une hypertension pulmonaire. Chaque mécanisme appelle donc sa réponse : traitement local du saignement, embolisation pulmonaire et filtres sur les perfusions, surveillance cardiaque.</div>
<p>Ces mécanismes communs ont pourtant des causes génétiques différentes ; la section suivante les précise, car elles modulent l’atteinte des organes.</p>
</section>
<section class="ilot" id="i78-4"><h2><span class="n">4</span>Génétique et formes</h2>
<p>La transmission est autosomique dominante : un parent atteint transmet donc la maladie à la moitié de ses enfants, en moyenne. En outre, chez 97 % des patients qui ont un diagnostic clinique certain, une mutation causale est identifiée dans l’un de trois gènes (recommandations 2020) : <button class="w" data-k="i78-eng">ENG (endogline, type 1)</button>, <button class="w" data-k="i78-acvrl1">ACVRL1 (type 2)</button> ou <button class="w" data-k="i78-smad4">SMAD4 (forme associée à la polypose juvénile)</button>.</p>
<p>Le gène en cause modifie ensuite la surveillance. Ainsi, la forme liée à SMAD4 associe une polypose juvénile du côlon ; elle impose donc une coloscopie de dépistage dès 15 ans, répétée tous les 3 ans en l’absence de polype, ou chaque année avec une gastroscopie si des polypes sont trouvés (recommandations 2020). Les autres patients suivent, en revanche, le dépistage du cancer colorectal de la population générale.</p>
<div class="trap"><span class="k">Piège</span>Tester d’emblée un enfant asymptomatique sans connaître la mutation familiale. Les recommandations 2020 demandent de tester d’abord un apparenté atteint pour identifier la mutation causale ; l’enfant n’est testé qu’ensuite, ce qui rend un résultat négatif interprétable.</div>
</section>
