<template data-pop="e51-wernicke" data-title="Encéphalopathie de Wernicke"><div class="lab">Définition</div><p>L’encéphalopathie de Gayet-Wernicke est la manifestation cérébrale aiguë de la carence en thiamine. Elle repose sur une triade classique : état mental altéré ou déficit mnésique, troubles oculomoteurs (nystagmus, ophtalmoplégie), ataxie ou trouble de la marche.</p><div class="lab">Pourquoi la triade trompe</div><p>La triade complète n’est présente que dans environ un tiers des cas selon la méta-analyse de 2026 (32,7 %), et près d’un cinquième des cas confirmés à l’autopsie n’ont aucun de ces signes. Un diagnostic qui exigerait la triade manquerait la majorité des malades. D’où les critères de Caine, qui demandent deux signes sur quatre, et la consigne de l’EFNS de suspecter la maladie dans toute situation pouvant mener à une carence.</p><div class="lab">Conséquence</div><p>Les patients alcooliques et non alcooliques ne se présentent pas de la même façon : hors alcool, ils sont plus jeunes, plus souvent des femmes, et la mortalité est plus élevée (8,8 % contre 5,1 % pour l’ensemble). Le traitement empirique précoce est le seul moyen d’éviter le Korsakoff.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40911513/" target="_blank" rel="noopener">Puertas et coll., méta-analyse sur la Wernicke, 2026</a>.</p></template>
<template data-pop="e51-korsakoff" data-title="Syndrome de Korsakoff"><div class="lab">Définition</div><p>Le syndrome de Korsakoff est la séquelle neuropsychiatrique chronique de l’encéphalopathie de Wernicke : amnésie globale, confabulation (récits inventés pour combler les trous de mémoire), apathie et troubles cognitifs. Il est largement irréversible.</p><div class="lab">Fréquence</div><p>Environ la moitié des survivants d’une encéphalopathie de Wernicke le développent. Une revue ancienne, fondée sur des sources secondaires, avance que près de 80 % des Wernicke alcooliques évoluent vers un Korsakoff.</p><div class="lab">Limite du dossier</div><p>Le codage du Korsakoff dans la CIM-10-GM n’a pas été vérifié pour cette leçon. Il est donc volontairement omis.</p><div class="lab">Décision</div><p>La possibilité de séquelle est la raison de traiter sans attendre le dosage, avec des doses élevées de thiamine par voie intraveineuse.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a>.</p></template>
<template data-pop="e51-shoshin" data-title="Shoshin béribéri"><div class="lab">Définition</div><p>Forme fulminante du béribéri humide : choc cardiogénique avec acidose lactique et défaillance multiviscérale, sans œdème, pouvant mimer un sepsis.</p><div class="lab">Mécanisme</div><p>L’acidose lactique déprime la contractilité cardiaque et aggrave la vasodilatation périphérique déjà présente ; le débit élevé du béribéri humide se transforme en choc. Le déficit en pyruvate déshydrogénase explique le lactate.</p><div class="lab">Décision</div><p>Le choc est réversible sous thiamine : chez le nourrisson, la récupération se fait en heures, la fonction cardiaque se normalise en jours. La voie parentérale à doses plus élevées est utilisée, avec dilution dans du soluté salé sans glucose.</p><div class="lab">Piège</div><p>Un patient en choc avec lactate élevé, sans œdème et à risque nutritionnel, reçoit la thiamine en même temps que la recherche d’un sepsis, non après.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a>.</p></template>
<template data-pop="e51-beriberi-humide" data-title="Béribéri humide"><div class="lab">Mécanisme</div><p>Une vasodilatation périphérique active le système sympathique et le système rénine-angiotensine. La rétention hydrosodée augmente le volume ; la postcharge baisse ; le débit cardiaque s’élève. C’est une insuffisance cardiaque à haut débit. Une atteinte endothéliale par le monoxyde d’azote peut produire une hypertension pulmonaire et une insuffisance cardiaque droite.</p><div class="lab">Clinique</div><p>Tachycardie, œdèmes des membres inférieurs, dyspnée, congestion hépatique et splénique, prédominance droite.</p><div class="lab">Décision</div><p>Thiamine de 100 à 300 mg par jour suffit généralement, au moins six semaines, la voie orale étant possible.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a>.</p></template>
<template data-pop="e51-beriberi-sec" data-title="Béribéri sec"><div class="lab">Mécanisme</div><p>Des perturbations glutamatergiques et gabaergiques et une myélinisation réduite, par atteinte de la voie des pentoses phosphates, altèrent les nerfs périphériques.</p><div class="lab">Clinique</div><p>Polyneuropathie périphérique et faiblesse musculaire. L’information professionnelle suisse cite polynévrite, bradycardie et altérations psychiques en carence prolongée.</p><div class="lab">Décision</div><p>Thiamine, puis rééducation en cas de neuropathie.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a>.</p></template>
<template data-pop="e51-infantile" data-title="Béribéri infantile"><div class="lab">Contexte</div><p>Il touche le nourrisson de moins de quatre mois, surtout au deuxième ou troisième mois, allaité par une mère carencée. L’OMS (1999) en distingue des formes cardiaque aiguë, pseudo-méningitique et aphonique.</p><div class="lab">Clinique</div><p>Irritabilité, refus du sein, tachycardie, tachypnée, vomissements, cri strident puis aphonie ; puis insuffisance cardiaque (œdème pulmonaire, hépatomégalie, cyanose). Plus tard : nystagmus, ophtalmoplégie, fontanelle bombée, troubles de la conscience.</p><div class="lab">Piège</div><p>La forme pseudo-méningitique simule une méningite.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a>.</p></template>
<template data-pop="e51-codage" data-title="Codage CIM-10-GM de la catégorie E51"><div class="lab">Contenu</div><p>E51.1 Béribéri ; E51.2 Encéphalopathie de Wernicke ; E51.8 Autres manifestations de la carence en thiamine ; E51.9 Carence en thiamine, sans précision. La catégorie E51 fait partie du bloc E50-E64, autres carences nutritionnelles.</p><div class="lab">Limite</div><p>Le relevé local ne contient pas de sous-code E51.0. Le codage du syndrome de Korsakoff n’a pas été vérifié. La cartographie en CIM-11 n’est pas établie : le catalogue du dépôt reste en CIM-10-GM 2024.</p><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, OFS, catégorie E51</a>.</p></template>
<template data-pop="e51-epidemio" data-title="Épidémiologie : séries et limites"><div class="lab">Chiffres</div><table class="t"><thead><tr><th>Série</th><th>Résultat</th></tr></thead><tbody><tr><td>Autopsies</td><td>Wernicke chez environ 1 % de la population générale ; 12,5 à 35 % des patients dépendants de l’alcool ; environ 80 % non diagnostiqués du vivant</td></tr><tr><td>Méta-analyse 2026 (12 études, 5510 patients)</td><td>65,4 % d’hommes, âge moyen 60,7 ans, alcool 90,7 %, triade complète 32,7 %, mortalité 5,1 % (8,8 % hors alcool)</td></tr><tr><td>Hyperemesis gravidarum (177 cas)</td><td>Vomissements médians 7 semaines, perte de 12,1 kg, séquelles cognitives 65,4 %, perte de grossesse 50 %, décès maternel 5 %</td></tr><tr><td>Chirurgie bariatrique (118 cas)</td><td>Bypass 52 %, âge médian 33 ans, vomissements 87,3 %, ataxie 84,7 %</td></tr><tr><td>Pédiatrie (88 cas)</td><td>Cancer 25, maladies digestives 19, malnutrition 17 ; 37 % avaient reçu une nutrition parentérale sans thiamine</td></tr><tr><td>Pharmacovigilance GLP-1 (15 cas)</td><td>Rapport de disproportionnalité 2,35 (IC 95 % 1,38–4,01), base FAERS ; signal, non causalité</td></tr></tbody></table><div class="lab">Lecture</div><p>Ces séries sont des séries de cas et des revues, non des incidences nationales. Dans un article de 2021, la figure 1 inverse les rapports de sexe du texte : le texte donne 1,69 homme pour une femme avec alcool et 1,84 femme pour un homme hors alcool, et c’est le texte qui est retenu.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40911513/" target="_blank" rel="noopener">Puertas et coll., méta-analyse sur la Wernicke, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30889425/" target="_blank" rel="noopener">Oudman et coll., hyperemesis gravidarum, 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29693218/" target="_blank" rel="noopener">Oudman et coll., chirurgie bariatrique, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39997622/" target="_blank" rel="noopener">Oudman et coll., Wernicke pédiatrique, 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41534460/" target="_blank" rel="noopener">Lev et coll., agonistes du GLP-1 et Wernicke, 2026</a>.</p></template>
<template data-pop="e51-thdp" data-title="ThDP : pyrophosphate de thiamine"><div class="lab">Définition</div><p>Le pyrophosphate de thiamine (ThDP) est la forme active de la vitamine B1. La cellule l’obtient en phosphorylant la thiamine. Il représente environ 80 % de la thiamine corporelle.</p><div class="lab">Rôle</div><p>Cofacteur de la pyruvate déshydrogénase, de l’α-cétoglutarate déshydrogénase, de la transcétolase, de la déshydrogénase des α-cétoacides ramifiés et de la 2-hydroxyacyl-CoA lyase. Il intervient aussi dans l’excitation nerveuse et la transmission neuromusculaire.</p><div class="lab">Décision</div><p>Le ThDP du sang total est le dosage de référence ; il est apparié à ces enzymes dans l’onglet Sciences.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29520660/" target="_blank" rel="noopener">Amrein et coll., soins intensifs et thiamine, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a>.</p></template>
<template data-pop="e51-pdh" data-title="Pyruvate déshydrogénase"><div class="lab">Fonction</div><p>Enzyme qui transforme le pyruvate de la glycolyse en acétyl-coenzyme A, substrat du cycle de Krebs. Elle dépend du ThDP.</p><div class="lab">Si le ThDP manque</div><p>Le pyruvate s’accumule et est converti en lactate : acidose lactique ; la production d’ATP baisse.</p><div class="lab">Décision</div><p>Un lactate élevé sans cause évidente chez un patient à risque justifie la thiamine.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29520660/" target="_blank" rel="noopener">Amrein et coll., soins intensifs et thiamine, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a>.</p></template>
<template data-pop="e51-akgdh" data-title="α-cétoglutarate déshydrogénase"><div class="lab">Fonction</div><p>Enzyme du cycle de Krebs, dépendante du ThDP. Elle catalyse l’étape qui suit l’α-cétoglutarate et contribue à la production d’ATP.</p><div class="lab">Si le ThDP manque</div><p>Le cycle de Krebs ralentit et l’α-cétoglutarate s’accumule ; ce dernier est un des marqueurs indirects de la carence.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29520660/" target="_blank" rel="noopener">Amrein et coll., soins intensifs et thiamine, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a>.</p></template>
<template data-pop="e51-transcetolase" data-title="Transcétolase"><div class="lab">Fonction</div><p>Enzyme de la voie des pentoses phosphates, dépendante du ThDP. Cette voie fournit le NADPH et les sucres à cinq carbones nécessaires aux acides nucléiques.</p><div class="lab">Si le ThDP manque</div><p>L’activité de la transcétolase baisse ; une réduction de la myélinisation est invoquée dans le béribéri sec.</p><div class="lab">Examen</div><p>L’activité de la transcétolase érythrocytaire est le fondement du coefficient d’activation ETKAC.</p><div class="lab">Limite</div><p>Des variants de la transcétolase sont cités comme cause d’utilisation cellulaire altérée de la thiamine, sans autre détail dans les sources lues.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a>.</p></template>
<template data-pop="e51-alcool" data-title="Alcool et carence en thiamine"><div class="lab">Trois mécanismes</div><p>L’alcool réduit l’apport (la dénutrition accompagne souvent la consommation importante), diminue l’absorption intestinale de la thiamine et réduit son stockage hépatique. L’absorption est un transport actif saturable que l’alcool inhibe ; la carence en folates l’inhibe aussi.</p><div class="lab">Conséquences cliniques</div><p>Chez le patient alcoolique, la voie orale est moins fiable : ESPEN rappelle que la bonne absorption orale est la règle sauf en cas de gastrite alcoolique, et que 250 mg par voie intraveineuse sont requis dans l’encéphalopathie à cause de la mauvaise absorption. L’alcool reste le premier facteur de risque (90,7 % dans la méta-analyse de 2026).</p><div class="lab">Piège</div><p>L’ivresse masque les signes oculomoteurs et cérébelleux aux urgences (Royal College of Physicians) ; un patient alcoolique ivre et confus reçoit des vitamines B parentérales d’emblée.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40911513/" target="_blank" rel="noopener">Puertas et coll., méta-analyse sur la Wernicke, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12414541/" target="_blank" rel="noopener">Royal College of Physicians, alcool et Wernicke, 2002</a>.</p></template>
<template data-pop="e51-hyperemese" data-title="Hyperemesis gravidarum et encéphalopathie de Wernicke"><div class="lab">Série</div><p>Revue systématique de 177 cas : vomissements médians de 7 semaines, perte de poids de 12,1 kg, nausées et vomissements chez 100 % des patientes, Wernicke entre 10 et 15 semaines de gestation. Un glucose intraveineux a aggravé la maladie dans 14,1 % des cas.</p><div class="lab">Évolution</div><p>Séquelles cognitives dans 65,4 % des cas, perte de grossesse dans 50 % des cas, décès maternel dans 5 % des cas.</p><div class="lab">Prévention</div><p>Thiamine 100 mg par voie intraveineuse ou intramusculaire en cas de vomissements persistants ou sévères tardifs. Un traitement curatif « adéquat » a été défini dans la revue comme une dose supérieure à 500 mg par jour par voie intramusculaire ou intraveineuse.</p><div class="lab">Limite</div><p>Il s’agit de cas publiés, donc d’une série sélectionnée.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30889425/" target="_blank" rel="noopener">Oudman et coll., hyperemesis gravidarum, 2019</a>.</p></template>
<template data-pop="e51-glp1" data-title="Agonistes du GLP-1 : signal de pharmacovigilance"><div class="lab">Constat</div><p>Une étude de 2026 a identifié 15 cas d’encéphalopathie de Wernicke sous <button class="w" data-k="e51-glp1">agonistes du GLP-1</button> (sémaglutide 8, tirzépatide 6), presque tous avec vomissements et perte pondérale. Le rapport de disproportionnalité est de 2,35 (IC 95 % 1,38–4,01).</p><div class="lab">Interprétation</div><p>Le mécanisme plausible est celui de tout vomissement prolongé avec apport réduit, non un effet direct sur la thiamine. La base FAERS permet de détecter un signal, non de prouver une causalité.</p><div class="lab">Décision</div><p>Chez un patient traité par agoniste du GLP-1 qui vomit ou perd rapidement du poids, penser à la thiamine ; les sources lues ne contiennent aucune recommandation de prophylaxie dédiée.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41534460/" target="_blank" rel="noopener">Lev et coll., agonistes du GLP-1 et Wernicke, 2026</a>.</p></template>
<template data-pop="e51-pediatrie" data-title="Encéphalopathie de Wernicke de l’enfant"><div class="lab">Série</div><p>Revue systématique de 88 cas : cancer (25), maladies digestives (19), malnutrition (17). Parmi eux, 37 % avaient reçu une nutrition parentérale sans thiamine. Nausées et vomissements dans 60 % et 55 % des cas.</p><div class="lab">Imagerie et évolution</div><p>Sensibilité de l’IRM de 85 %. Rémission complète dans 61 % des cas ; des doses parentérales plus élevées sont associées à une récupération plus rapide.</p><div class="lab">Décision</div><p>Ajouter systématiquement la thiamine à la nutrition parentérale : c’est une cause évitable.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39997622/" target="_blank" rel="noopener">Oudman et coll., Wernicke pédiatrique, 2025</a>.</p></template>
<template data-pop="e51-nutrition-parenterale" data-title="Nutrition artificielle et thiamine"><div class="lab">Apports</div><p>ESPEN recommande au moins 2,5 mg par jour en nutrition parentérale (recommandation 14.4, grade B) et 1,5 à 3 mg pour 1500 kcal en nutrition entérale (recommandation 14.3).</p><div class="lab">Avant de commencer</div><p>Chez le patient à haut risque, une première dose de thiamine précède le début de la nutrition parentérale (ESPEN, maladies du foie). Dans le syndrome de renutrition, 300 mg par voie intraveineuse sont donnés avant la nutrition.</p><div class="lab">Pourquoi</div><p>Les calories apportées sont métabolisées par des voies dépendantes du ThDP ; sans vitamine, la nutrition peut précipiter la carence.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_clinical_nutrition_in_liver_disease.pdf" target="_blank" rel="noopener">ESPEN, nutrition clinique et maladies du foie, 2019</a>.</p></template>
<template data-pop="e51-reserves" data-title="Réserves et cinétique de la thiamine"><div class="lab">Chiffres</div><p>Réserves de 25 à 30 mg selon ESPEN, de 30 à 50 mg selon une autre revue ; environ 80 % sous forme de ThDP. Épuisement en 18 à 20 jours à six semaines d’apport nul. Demi-vie de 18 jours selon une revue de soins intensifs, de 10 à 20 jours selon l’information professionnelle suisse aux doses physiologiques.</p><div class="lab">Arbitrage</div><p>Les écarts proviennent des méthodes et des populations. On retient que le stock est faible et que la carence s’installe en quelques semaines.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29520660/" target="_blank" rel="noopener">Amrein et coll., soins intensifs et thiamine, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a>.</p></template>
<template data-pop="e51-absorption" data-title="Absorption de la thiamine"><div class="lab">Mécanisme</div><p>Absorption dans le jéjunum et l’iléon. Transport actif saturable : le transporteur THTR2 fait entrer la thiamine au pôle apical de l’entérocyte, THTR1 la fait sortir au pôle basolatéral. Aux fortes concentrations, une diffusion passive s’ajoute.</p><div class="lab">Conséquences</div><p>L’alcool et la carence en folates inhibent l’absorption ; une résection, une chirurgie bariatrique, une maladie de Crohn ou une diarrhée chronique la réduisent. Les antiacides la diminuent aussi (information professionnelle suisse).</p><div class="lab">Décision</div><p>En carence aiguë sévère, la voie intraveineuse contourne l’intestin.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a>.</p></template>
<template data-pop="e51-besoins" data-title="Apports de référence : DGE et ESPEN"><div class="lab">DGE</div><table class="t"><thead><tr><th>Population</th><th>Apport de référence (mg par jour)</th></tr></thead><tbody><tr><td>Hommes de 19 à 25 ans</td><td>1,3</td></tr><tr><td>Femmes de 19 à 25 ans</td><td>1,0</td></tr><tr><td>Hommes de 25 à 65 ans</td><td>1,2</td></tr><tr><td>Femmes de 25 à 65 ans</td><td>1,0</td></tr><tr><td>Hommes de plus de 65 ans</td><td>1,1</td></tr><tr><td>Femmes de plus de 65 ans</td><td>1,0</td></tr><tr><td>Grossesse, 2e trimestre</td><td>1,2</td></tr><tr><td>Grossesse, 3e trimestre</td><td>1,3</td></tr><tr><td>Allaitement</td><td>1,3</td></tr><tr><td>Nourrissons</td><td>0,2 à 0,4</td></tr></tbody></table><div class="lab">ESPEN</div><p>Besoin moyen estimé de 0,9 à 1,0 mg par jour, apport recommandé de 1,1 à 1,2 mg par jour, valeurs non révisées depuis 1998.</p><div class="lab">Limite</div><p>La page lue est celle de la DGE ; l’adoption par la Société suisse de nutrition n’a pas été vérifiée.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://www.dge.de/wissenschaft/referenzwerte/thiamin/" target="_blank" rel="noopener">DGE, valeur de référence pour la thiamine, dérivation 2015</a>.</p></template>
<template data-pop="e51-foie" data-title="Maladie du foie et thiamine"><div class="lab">Contexte</div><p>Les patients atteints de maladie hépatique ont souvent des carences en vitamines hydrosolubles, surtout en thiamine. Le risque de syndrome de renutrition et de carence en thiamine est élevé chez le patient cirrhotique.</p><div class="lab">Recommandation</div><p>Thiamine en routine dans l’hépatopathie alcoolique pour prévenir le syndrome de Wernicke-Korsakoff ; première dose avant de démarrer une nutrition parentérale chez le patient à haut risque.</p><div class="lab">Piège</div><p>L’encéphalopathie hépatique coexiste fréquemment et masque l’encéphalopathie de Wernicke.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_clinical_nutrition_in_liver_disease.pdf" target="_blank" rel="noopener">ESPEN, nutrition clinique et maladies du foie, 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9010400/" target="_blank" rel="noopener">Caine et coll., critères opérationnels, 1997</a>.</p></template>
<template data-pop="e51-voie" data-title="Voie orale ou intraveineuse"><div class="lab">Règle ESPEN</div><p>La recommandation 14.7 (grade 0) indique une bonne absorption orale sauf en cas de gastrite alcoolique. Dans la carence aiguë sévère, la voie intraveineuse est la plus efficace (3 fois 100 à 300 mg par jour). Une carence chronique sans maladie aiguë se traite par voie orale ; une maladie aiguë justifie la voie intraveineuse.</p><div class="lab">Information professionnelle suisse</div><p>La voie intraveineuse est réservée aux patients hospitalisés ; la voie orale est préférée quand elle est possible pour limiter les réactions anaphylactoïdes ; l’injection est très lente.</p><div class="lab">Arbitrage</div><p>Les deux textes ne se contredisent pas : le risque d’anaphylaxie est faible (environ 4 cas par million d’administrations intraveineuses) et la gravité de l’encéphalopathie justifie la voie intraveineuse à l’hôpital.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a>.</p></template>
<template data-pop="e51-hospitalise" data-title="Prophylaxie du patient hospitalisé"><div class="lab">Recommandation</div><p>ESPEN (recommandation 14.6, grade B) : tout patient hospitalisé dont l’apport a été réduit les jours précédents ou qui consomme beaucoup d’alcool reçoit 100 à 300 mg de thiamine par jour, par voie orale ou intraveineuse.</p><div class="lab">Soins intensifs</div><p>Recommandation 14.5 (grade B) : 100 à 300 mg par jour par voie intraveineuse dès l’admission pendant 3 à 4 jours.</p><div class="lab">Limite</div><p>Ces doses sont des recommandations d’experts à faible niveau de preuve.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a>.</p></template>
<template data-pop="e51-insuffisance-cardiaque" data-title="Insuffisance cardiaque et thiamine"><div class="lab">Constat</div><p>Une carence est retrouvée chez 6 % des insuffisants cardiaques ambulatoires. Les diurétiques au long cours augmentent les pertes urinaires de thiamine.</p><div class="lab">Recommandation</div><p>Doser le statut en thiamine en cas de cardiomyopathie (ESPEN, recommandation 14.1, grade 0). Pour les diurétiques au long cours, ESPEN suggère 50 mg par jour par voie orale.</p><div class="lab">Limite</div><p>Le béribéri humide est une insuffisance cardiaque à haut débit : il doit être distingué de l’insuffisance cardiaque habituelle, dont la prise en charge relève d’autres leçons.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a>.</p></template>
<template data-pop="e51-securite" data-title="Sécurité de la thiamine"><div class="lab">Données</div><p>Il n’existe pas de limite supérieure d’apport ; l’excès est éliminé dans l’urine. Plus de 400 mg peuvent provoquer des nausées, une anorexie et une ataxie légère. L’anaphylaxie est rare : 4 cas par million d’administrations intraveineuses, 1 pour 5 millions par voie intramusculaire.</p><div class="lab">Information professionnelle suisse</div><p>Aucun cas d’hypervitaminose n’est connu ; des réactions allergiques ou anaphylactiques sont possibles.</p><div class="lab">Décision</div><p>Le rapport bénéfice-risque est très favorable au traitement empirique.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a>.</p></template>
