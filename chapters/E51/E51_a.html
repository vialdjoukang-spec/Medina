<section class="ilot" id="e51-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, un homme de 54 ans est amené aux urgences. Il consomme de l’alcool en grande quantité, mange très peu depuis deux semaines et vomit depuis dix jours. Il est confus, ne retient pas les consignes, présente des mouvements oculaires anormaux et ne tient pas debout sans appui. Ces trois signes, état mental, yeux et équilibre, correspondent à la triade décrite de l’<button class="w" data-k="e51-wernicke">encéphalopathie de Wernicke</button>.</p>
<p>La question n’est pas « quel examen faut-il attendre ? », mais « que faut-il donner avant de savoir ? ». Les recommandations européennes demandent de prélever le sang pour le dosage de la thiamine, puis de traiter sans attendre le résultat, par voie intraveineuse, <b>avant toute perfusion de glucose</b>. Le traitement coûte peu, le risque d’une dose inutile est très faible, et un retard expose à une atteinte cérébrale durable.</p>
<div class="key"><b>À retenir.</b> Penser à la thiamine devant une confusion, des troubles oculomoteurs ou une ataxie chez un patient dénutri ou alcoolique ; prélever si possible, puis traiter immédiatement. Le dosage confirme après coup, il ne conditionne pas le geste.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a>.</p>
</section>
<section class="ilot" id="e51-1"><h2><span class="n">1</span>Définition, formes cliniques et codage</h2>
<p>La <b>carence en thiamine</b>, ou vitamine B1, désigne un apport, une absorption, un stockage ou une utilisation de thiamine insuffisants par rapport aux besoins. Elle est dite <button class="w" data-k="e51-codage">carence biologique</button> lorsque le déficit est mesuré ou raisonnablement établi, avec ou sans manifestation clinique. Les manifestations cliniques classiques se regroupent en trois tableaux, qui peuvent se chevaucher : l’<b>encéphalopathie de Gayet-Wernicke</b>, qui peut évoluer vers le <b>syndrome de Korsakoff</b>, le <b>béribéri humide</b>, cardiovasculaire, et le <b>béribéri sec</b>, neurologique périphérique.</p>
<p>Le béribéri humide s’accompagne d’œdèmes ; le béribéri sec correspond à une atteinte du système nerveux périphérique. Une forme fulminante du béribéri humide, le <button class="w" data-k="e51-shoshin">Shoshin béribéri</button>, associe choc cardiogénique, acidose lactique et défaillance multiviscérale, sans œdème. Elle peut ressembler à un sepsis. Le terme « <i>thiamine deficiency disorders</i> » regroupe cet ensemble de présentations qui se chevauchent au cours de la vie.</p>
<p>La CIM-10-GM 2024 organise la catégorie E51 de la façon suivante.</p>
<table class="t"><thead><tr><th>Code</th><th>Intitulé CIM-10-GM 2024</th></tr></thead><tbody><tr><td>E51.1</td><td>Béribéri</td></tr><tr><td>E51.2</td><td>Encéphalopathie de Wernicke</td></tr><tr><td>E51.8</td><td>Autres manifestations de la carence en thiamine</td></tr><tr><td>E51.9</td><td>Carence en thiamine, sans précision</td></tr></tbody></table>
<p>Le relevé local de la classification ne comporte pas de sous-code E51.0. Le codage du syndrome de Korsakoff n’a pas été vérifié dans la CIM-10-GM au moment de la préparation de cette leçon : il n’est donc pas indiqué ici, plutôt que de le citer de mémoire.</p>
<p>Les entités ne s’excluent pas : un même patient peut présenter une atteinte cérébrale et une atteinte cardiaque. Le béribéri relève du sous-code E51.1, l’encéphalopathie de Wernicke du sous-code E51.2.</p>
<div class="key"><b>À retenir.</b> La carence est un déficit métabolique ; Wernicke, Korsakoff et béribéri en sont les traductions cliniques. L’encéphalopathie de Wernicke est aiguë et réversible si elle est traitée à temps ; le syndrome de Korsakoff est chronique et largement irréversible. Ce passage de l’un à l’autre fait toute l’urgence du traitement.</div>
<p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, OFS, catégorie E51</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2022/revue-medicale-suisse-801/thiamine-une-simple-vitamine" target="_blank" rel="noopener">Silhadi et coll., Revue Médicale Suisse 2022 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a>.</p>

<section class="ilot" id="e51-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p>La carence en thiamine est <b>sous-diagnostiquée parce qu’elle est sous-évoquée</b>, y compris en Suisse, alors que ses facteurs de risque, l’alcool et la malnutrition, sont fréquents. Dans les séries d’autopsie, une <button class="w" data-k="e51-wernicke">encéphalopathie de Wernicke</button> est retrouvée chez environ 1 % de la population générale et chez 12,5 à 35 % des personnes dépendantes de l’alcool. Environ 80 % des cas ne sont pas diagnostiqués du vivant. Les prévalences autopsiques nationales publiées vont de 0,6 à 2,2 %, notamment en Autriche, en France et en Allemagne.</p>
<p>Une méta-analyse de 2026 (12 études, 5510 patients) décrit un âge moyen de 60,7 ans et 65,4 % d’hommes. L’alcool est le principal facteur de risque (90,7 %). Hors alcool, on retrouve la malnutrition (30,2 %), les infections (25,1 %) et les troubles psychiatriques (15,4 %). La triade complète n’est présente que dans <b>32,7 %</b> des cas. La mortalité globale est de 5,1 %, et plus élevée hors alcool (8,8 %). Les patients sans alcool sont plus jeunes et plus souvent des femmes.</p>
<p>Dans d’autres contextes, la carence est très fréquente : jusqu’à plus de 90 % des patients de soins intensifs présentent une carence ou une déplétion, et 6 % des insuffisants cardiaques ambulatoires. Dans les pays à revenu faible ou intermédiaire, le béribéri reste un problème de santé publique, favorisé par le riz poli, le manioc et les aliments contenant des thiaminases.</p>
<div class="trap"><span class="k">Population des chiffres</span> Les prévalences autopsiques décrivent des séries sélectionnées. Les données suisses spécifiques sont absentes des sources lues : aucune incidence nationale n’est donc déduite de chiffres étrangers. La fenêtre <button class="w" data-k="e51-epidemio">épidémiologie et séries</button> présente les séries et leurs limites.</div>
<p>Le pronostic dépend de la précocité du traitement. Environ la moitié des survivants d’une encéphalopathie de Wernicke développent un syndrome de Korsakoff. Les chiffres de mortalité varient selon l’époque de publication : les séries anciennes sont plus sombres que la méta-analyse récente. Cet écart est détaillé dans la fenêtre dédiée.</p>
<div class="key"><b>À retenir.</b> L’alcool domine les statistiques, mais la carence n’est pas réservée à l’alcoolisme : vomissements, chirurgie bariatrique, soins intensifs, nutrition parentérale sans vitamines et renutrition en sont d’autres portes d’entrée.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40911513/" target="_blank" rel="noopener">Puertas et coll., méta-analyse sur la Wernicke, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a>.</p>

<section class="ilot" id="e51-3"><h2><span class="n">3</span>Physiopathologie : du métabolisme normal à la lésion</h2>
<p>La thiamine est une vitamine hydrosoluble que l’organisme ne synthétise pas en quantité utile. <button class="w" data-k="e51-reserves">Les réserves corporelles</button> sont faibles (environ 25 à 30 mg selon ESPEN ; 30 à 50 mg selon une autre revue) et se vident en quelques semaines, environ 18 à 20 jours à six semaines d’apport nul ou insuffisant. Une carence s’installe donc vite lorsque l’apport s’effondre ou que les besoins augmentent.</p>
<h3>3.1 La forme active et ses enzymes</h3>
<p>Dans la cellule, la thiamine devient du <button class="w" data-k="e51-thdp">pyrophosphate de thiamine (ThDP)</button>. Le ThDP est le cofacteur de trois enzymes clés du métabolisme énergétique : la <button class="w" data-k="e51-pdh">pyruvate déshydrogénase</button>, qui relie la glycolyse au cycle de Krebs, l’<button class="w" data-k="e51-akgdh">α-cétoglutarate déshydrogénase</button>, enzyme du cycle de Krebs, et la <button class="w" data-k="e51-transcetolase">transcétolase</button>, enzyme de la voie des pentoses phosphates qui produit le NADPH. Il intervient aussi dans la déshydrogénase des α-cétoacides ramifiés.</p>
<h3>3.2 La conséquence métabolique</h3>
<p>Lorsque le ThDP manque, la pyruvate déshydrogénase se bloque. Le pyruvate s’accumule et est converti en <b>lactate</b> : l’acidose lactique est un signe biologique de la carence. La production d’ATP baisse, car le cycle de Krebs fonctionne mal. Les tissus qui consomment le plus d’énergie, le cerveau et le cœur, sont atteints en premier.</p>
<h3>3.3 Le cerveau</h3>
<p>Dans le cerveau, le déficit énergétique s’accompagne d’une acidose lactique locale, d’une rupture de la barrière hémato-encéphalique, d’une excitotoxicité par le glutamate (les transporteurs astrocytaires du glutamate sont diminués) et d’une inflammation microgliale. Les lésions prédominent autour des ventricules : thalamus, hypothalamus, région périaqueducale, corps mamillaires et cervelet. Cette topographie explique la triade : l’atteinte du tronc et des noyaux oculomoteurs donne les troubles oculomoteurs, celle du cervelet l’ataxie, celle du diencéphale la confusion et les troubles mnésiques.</p>
<h3>3.4 Le cœur, les vaisseaux et les nerfs</h3>
<p>Dans le béribéri humide, une vasodilatation périphérique active le système sympathique et le système rénine-angiotensine. La rétention hydrosodée qui en résulte, associée à la baisse de la postcharge, aboutit à une insuffisance cardiaque <b>à haut débit</b>. Dans le Shoshin, l’acidose lactique déprime la contractilité et aggrave la vasodilatation : le choc est cardiogénique. Dans le béribéri sec, des perturbations glutamatergiques et gabaergiques et une myélinisation réduite, par atteinte de la voie des pentoses, expliquent la neuropathie périphérique.</p>
<h3>3.5 Le rôle du glucose</h3>
<p>La dégradation des glucides consomme de la thiamine : le besoin est d’environ 0,4 mg pour 4200 kilojoules de métabolisme glucidique. Une charge glucidique chez un patient carencé augmente donc la demande en ThDP et peut précipiter une encéphalopathie de Wernicke. C’est la raison de la consigne de l’EFNS : donner la thiamine <b>avant</b> tout glucide. Dans l’hyperemesis gravidarum, un glucose intraveineux a aggravé l’encéphalopathie dans 14,1 % des cas publiés.</p>
<div class="trap"><span class="k">Nuance sur l’ordre thiamine puis glucose</span> Des études récentes citées par une revue de 2021 n’ont pas montré de différence entre thiamine donnée avant ou après un glucose de courte durée. Aucune recommandation lue n’énonce le geste à privilégier devant une hypoglycémie chez un patient suspect. Le dossier ne tranche pas : le médecin applique la consigne EFNS tout en gardant son jugement clinique, détaillé dans la fenêtre <button class="w" data-k="e51-glucose">glucose et thiamine</button>.</div>
<div class="key"><b>À retenir.</b> Le déficit en ThDP bloque l’entrée du glucose dans le cycle de Krebs : lactate élevé, énergie basse, atteinte du cerveau et du cœur. Plus on donne de glucose à un carencé, plus la carence devient symptomatique.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29520660/" target="_blank" rel="noopener">Amrein et coll., soins intensifs et thiamine, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30889425/" target="_blank" rel="noopener">Oudman et coll., hyperemesis gravidarum, 2019</a>.</p>

<section class="ilot" id="e51-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>On classe les causes selon le mécanisme qui épuise la thiamine. Le tableau suivant en fait la synthèse ; chaque ligne est illustrée par des exemples cliniques fréquents.</p>
<table class="t"><thead><tr><th>Mécanisme</th><th>Exemples</th></tr></thead><tbody><tr><td>Apport diminué</td><td>Alcool, anorexie mentale, jeûne, malnutrition du sujet âgé, nutrition parentérale sans thiamine, vomissements (hyperemesis gravidarum), insécurité alimentaire</td></tr><tr><td>Absorption diminuée</td><td>Alcool, maladie de Crohn, sténose pylorique, diarrhée chronique, résections digestives, chirurgie bariatrique, antiacides</td></tr><tr><td>Stockage diminué</td><td>Insuffisance hépatique terminale, alcool</td></tr><tr><td>Utilisation cellulaire altérée</td><td>Variants de la transcétolase</td></tr><tr><td>Besoins ou pertes accrus</td><td>Charge glucidique, hyperthyroïdie, cancers à croissance rapide, sepsis et soins intensifs, grossesse, diurétiques, dialyse et épuration extra-rénale continue</td></tr></tbody></table>
<p>Le tableau montre qu’un même patient cumule souvent plusieurs mécanismes. Un patient alcoolique mange peu (apport diminué), absorbe mal la thiamine (alcool) et stocke mal (atteinte hépatique). Une femme enceinte avec hyperemesis gravidarum vomit (apport et absorption) alors que ses besoins augmentent.</p>
<h3>4.1 <button class="w" data-k="e51-alcool">Alcool</button></h3>
<p>L’alcool agit à trois niveaux : il réduit l’apport par la dénutrition, l’absorption de la thiamine, et le stockage hépatique. C’est le facteur de risque dominant (90,7 % dans la méta-analyse de 2026). Chez le patient alcoolique, le traitement par voie orale est moins fiable à cause de la mauvaise absorption, ce qui justifie la voie intraveineuse.</p>
<h3>4.2 <button class="w" data-k="e51-bariatrique">Chirurgie bariatrique</button> et vomissements</h3>
<p>Après chirurgie bariatrique, 118 cas publiés d’encéphalopathie de Wernicke associent le bypass (52 %) et la sleeve, avec un âge médian de 33 ans et des vomissements dans 87,3 % des cas. Les vomissements prolongés cumulent un apport réduit et une malabsorption. Le syndrome de Wernicke est aussi décrit dans l’<button class="w" data-k="e51-hyperemese">hyperemesis gravidarum</button> (177 cas publiés), où les vomissements durent en médiane 7 semaines, avec une perte de 12,1 kg.</p>
<h3>4.3 <button class="w" data-k="e51-nutrition-parenterale">Nutrition artificielle</button> et renutrition</h3>
<p>Une nutrition parentérale sans thiamine expose à la carence. <button class="w" data-k="e51-pediatrie">Chez l’enfant</button>, 37 % des 88 cas publiés avaient reçu une nutrition parentérale sans thiamine. Le <button class="w" data-k="e51-renutrition">syndrome de renutrition</button> survient quand on réalimente un patient dénutri : la reprise du métabolisme glucidique consomme la thiamine disponible. Les critères suisses de dépistage sont un IMC bas, une perte de poids involontaire importante, un apport faible ou nul et l’abus d’alcool ou de drogues.</p>
<h3>4.4 Médicaments et signaux récents</h3>
<p>Les diurétiques au long cours augmentent les pertes urinaires. L’épuration extra-rénale continue soustrait environ 4 à 5 mg de thiamine par jour. Les antiacides diminuent l’absorption ; le 5-fluorouracile et la thiosemicarbazone antagonisent la thiamine. Enfin, une étude de pharmacovigilance de 2026 a relevé 15 cas d’encéphalopathie de Wernicke sous <button class="w" data-k="e51-glp1">agonistes du GLP-1</button> (sémaglutide 8, tirzépatide 6), presque tous avec vomissements et perte pondérale, avec un rapport de disproportionnalité de 2,35 (IC 95 % 1,38–4,01). Il s’agit d’un signal, non d’une preuve de causalité.</p>
<div class="trap"><span class="k">Signal et causalité</span> Le signal GLP-1 provient d’une base de pharmacovigilance : il oriente la vigilance (vomissements, perte pondérale rapide), il ne démontre pas que ces médicaments causent la carence.</div>
<div class="key"><b>À retenir.</b> Devant tout patient qui vomit, mange peu ou est réalimenté après un jeûne, on se demande : « quelles réserves de thiamine lui reste-t-il ? ». Cette question prime sur l’étiquette « alcoolique » ou « non alcoolique ».</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29520660/" target="_blank" rel="noopener">Amrein et coll., soins intensifs et thiamine, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29429529/" target="_blank" rel="noopener">Friedli et coll., syndrome de renutrition, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30889425/" target="_blank" rel="noopener">Oudman et coll., hyperemesis gravidarum, 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29693218/" target="_blank" rel="noopener">Oudman et coll., chirurgie bariatrique, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39997622/" target="_blank" rel="noopener">Oudman et coll., Wernicke pédiatrique, 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41534460/" target="_blank" rel="noopener">Lev et coll., agonistes du GLP-1 et Wernicke, 2026</a>.</p>

<section class="ilot" id="e51-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche les mécanismes décrits ci-dessus et les signes précoces qui précèdent l’encéphalopathie. Elle est souvent obtenue auprès d’un tiers, car le patient est confus.</p>
<ul><li><b>Alcool</b> : quantité, durée, dernière consommation.</li><li><b>Alimentation</b> des jours précédents : apport faible ou nul, jeûne, régime restrictif.</li><li><b>Vomissements</b> : durée et sévérité ; 100 % des patientes avec hyperemesis gravidarum en présentent, 60 et 55 % des enfants.</li><li><b>Chirurgie</b> bariatrique ou digestive, nutrition parentérale récente, cancer, dialyse, traitement diurétique, traitement par agoniste du GLP-1, grossesse.</li><li><b>Symptômes visuels</b> : vision double ou floue.</li></ul>
<p>Les prodromes fréquents sont les nausées, les vomissements et les troubles visuels. Le patient peut aussi décrire une instabilité à la marche. Chez le nourrisson allaité, on interroge sur l’alimentation et l’état nutritionnel de la mère.</p>
<div class="trap"><span class="k">Ivresse et confusion</span> Aux urgences, l’ivresse peut masquer les signes oculomoteurs et cérébelleux (Royal College of Physicians). Un patient alcoolique ivre et confus reçoit des vitamines B par voie parentérale d’emblée.</div>
<div class="key"><b>À retenir.</b> Chercher d’abord la cause de carence : alcool, jeûne, vomissements, chirurgie, nutrition artificielle. Trouver un mécanisme suffit à justifier le traitement, sans attendre la triade complète.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30889425/" target="_blank" rel="noopener">Oudman et coll., hyperemesis gravidarum, 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39997622/" target="_blank" rel="noopener">Oudman et coll., Wernicke pédiatrique, 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12414541/" target="_blank" rel="noopener">Royal College of Physicians, alcool et Wernicke, 2002</a>.</p>
