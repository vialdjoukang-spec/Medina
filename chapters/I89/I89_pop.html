<template data-pop="i89-i88" data-title="Lymphadénite non spécifique (I88)"><p>La lymphadénite non spécifique est une inflammation ganglionnaire sans agent infectieux ni maladie spécifique identifiés (CIM-10-GM 2024).</p><table class="t"><tr><th>Situation</th><th>Code</th></tr><tr><td>Lymphadénite mésentérique non spécifique, aiguë ou chronique</td><td>I88.0</td></tr><tr><td>Lymphadénite chronique, sauf mésentérique</td><td>I88.1</td></tr><tr><td>Autre lymphadénite non spécifique ; sans précision</td><td>I88.8 ; I88.9</td></tr><tr><td>Adénopathie découverte, bilan non conclu</td><td>R59</td></tr><tr><td>Lymphadénopathie généralisée liée au VIH (exclue de I88)</td><td>B23.8</td></tr></table><p>Le tableau se lit au rythme du bilan : la constatation se code R59, puis devient I88 seulement si le bilan écarte une cause spécifique ou si l’histologie montre une hyperplasie réactionnelle. Une lymphadénite aiguë relève en revanche de L04.</p></template>
<template data-pop="i89-mesent" data-title="Lymphadénite mésentérique (I88.0)"><p>La lymphadénite mésentérique associe des ganglions mésentériques augmentés et une douleur abdominale, souvent de la fosse iliaque droite ; elle peut donc imiter une appendicite. Elle est le plus souvent secondaire à une inflammation intestinale, c’est pourquoi la forme primaire reste un diagnostic d’exclusion (Macari et al., American Journal of Roentgenology 2002).</p></template>
<template data-pop="i89-charge" data-title="Charge lymphatique et capacité de transport"><p>La <b>charge lymphatique obligatoire</b> est le liquide filtré par les capillaires sanguins vers l’interstitium et non réabsorbé, avec ses protéines et ses cellules. La <b>capacité de transport</b> est ce que le système lymphatique peut évacuer. À l’état normal, les deux sont en équilibre (S2k 2017). Le lymphoedème survient quand le transport tombe sous la charge : insuffisance à bas débit. Les autres œdèmes surviennent quand une charge excessive déborde des lymphatiques intacts : insuffisance à haut débit (ISL 2023).</p></template>
<template data-pop="i89-lymphangion" data-title="Lymphangion"><p>Segment d’un collecteur lymphatique compris entre deux valvules, dont la paroi musculaire se contracte de façon rythmique et propulse la lymphe vers le centre. L’étirement de la paroi augmente la fréquence de ces pulsations : c’est le mécanisme du drainage lymphatique manuel (S2k 2017).</p><figure><img src="images/cardiologie/i89_capillaire_collecteur.gif" alt="Illustration publiée d’un capillaire lymphatique à jonctions en bouton prolongé par un collecteur à jonctions en fermeture éclair, valvules, lymphangion et cellules musculaires lisses" width="760" height="442" loading="lazy" decoding="async">
<figcaption>Même image que la figure 4 du cours — Du capillaire lymphatique au collecteur : jonctions endothéliales « en bouton » du capillaire, qui laissent entrer le liquide, puis collecteur à jonctions « en fermeture éclair », valvules et cellules musculaires lisses ; le segment compris entre deux valvules est le lymphangion. Légendes en anglais. Figure de SGUL lymres (St George’s, University of London), Wikimedia Commons, licence Creative Commons Attribution – Partage dans les mêmes conditions 4.0 ; convertie pour l’atlas, dérivé sous la même licence.</figcaption></figure><p>Cette figure publiée situe le lymphangion sur le collecteur. Les jonctions en bouton du capillaire laissent entrer le liquide, puis les valvules et les cellules musculaires lisses du collecteur le propulsent segment par segment. Dès lors, une lésion des collecteurs supprime cette pompe et le liquide s’accumule dans l’interstitium.</p></template>
<template data-pop="i89-stemmer" data-title="Signe de Stemmer"><p>Le médecin pince et soulève un pli de peau à la base, au niveau de la première phalange, du deuxième ou du troisième orteil ou doigt, et éventuellement sur d’autres régions atteintes. Si la peau ne se soulève pas ou à peine, le tissu est induré : le signe est <b>positif</b> et oriente vers un lymphoedème. Un signe <b>négatif n’exclut pas</b> un lymphoedème (S2k 2017), en particulier au stade I.</p></template>
<template data-pop="i89-lipoedeme" data-title="Lipoedème"><p>Le lipoedème est une accumulation symétrique de tissu adipeux, surtout sous la crête iliaque, aux hanches et aux cuisses ; elle est sensible à la pression, douloureuse et s’accompagne d’une tendance aux ecchymoses. Il touche surtout la femme et débute le plus souvent à la puberté, parfois après une grossesse ou à la ménopause. Le système lymphatique n’est pas atteint au début, ce qui explique un signe de Stemmer négatif ; au stade avancé, en revanche, un lymphoedème peut s’y ajouter (S2k 2017, ISL 2023).</p></template>
<template data-pop="i89-stewart" data-title="Syndrome de Stewart et Treves"><p>Le syndrome de Stewart et Treves est un lymphangiosarcome, tumeur maligne vasculaire rare et très létale, qui survient sur un lymphoedème chronique mal contrôlé (ISL 2023). La S2k 2017 rappelle d’ailleurs que le lymphoedème est suspecté d’être en soi cancérigène. C’est pourquoi toute lésion cutanée nouvelle sur un lymphoedème ancien justifie un avis dermatologique.</p></template>
<template data-pop="i89-tdc" data-title="Thérapie décongestive complexe"><p>La thérapie décongestive complexe est le traitement physique de référence du lymphoedème ; elle se déroule en deux phases. La <b>phase I</b> réduit le volume : elle associe soins de peau, drainage lymphatique manuel, exercices de pompe musculaire et bandages multicouches à allongement court, une à deux fois par jour. La <b>phase II</b> maintient le résultat : elle repose sur un bas ou un manchon de compression sur mesure, les soins de peau, l’exercice, le drainage selon les besoins et l’autotraitement. Elle exige des médecins, infirmiers et thérapeutes spécifiquement formés (ISL 2023, S2k 2017).</p></template>
<template data-pop="i89-scinti" data-title="Lymphoscintigraphie"><p>Un traceur radioactif, des nanocolloïdes marqués au technétium 99m, est injecté dans la peau ou le tissu sous-cutané des deux pieds ou des deux mains ; une caméra suit sa progression dans les lymphatiques et les ganglions et compare les deux côtés. L’examen montre les anomalies structurelles et fonctionnelles et peut être répété. Il est contre-indiqué pendant la grossesse (S2k 2017, ISL 2023).</p><figure><img src="images/cardiologie/i89_lymphoscintigraphie.gif" alt="Deux lymphoscintigraphies réelles des membres inférieurs : (a) reflux dermique et ganglions poplités, (b) absence de passage par les voies lymphatiques principales" width="442" height="584" loading="lazy" decoding="async">
<figcaption>Même image que la figure 3 du cours — Lymphoscintigraphies des membres inférieurs dans le lymphoedème du membre inférieur gauche : (a) patient au stade lymphoscintigraphique IIa, avec reflux dermique du traceur et ganglions poplités visibles ; (b) patient au stade IV, sans passage du traceur par les voies lymphatiques principales. Ces stades sont ceux de l’étude source, et non ceux de l’ISL. Images de Karaçavuş S., Yılmaz Y. K., Ekim H., Molecular Imaging and Radionuclide Therapy 2015;24:80-84, figure 3, article en libre accès de PubMed Central (via Open-i), Wikimedia Commons, licence Creative Commons Attribution 2.5 ; converties pour l’atlas.</figcaption></figure><p>Ces deux examens réels montrent ce que mesure la scintigraphie. Au stade IIa, le traceur reflue dans le derme parce que les collecteurs ne l’évacuent plus ; au stade IV, il ne quitte presque plus le point d’injection. Par conséquent, l’examen confirme l’origine lymphatique d’un œdème et en gradue la sévérité.</p></template>
<template data-pop="i89-d-penicilline" data-title="Prophylaxie des érysipèles répétés"><p>Lorsque les infections du membre récidivent malgré une thérapie décongestive optimale, l’ISL 2023 recommande une pénicilline prophylactique, plus rarement un antibiotique à large spectre sous surveillance, poursuivie selon le rapport bénéfice-risque. Le contrôle de l’œdème lui-même réduit aussi la fréquence des érysipèles. La molécule et la dose suisses ne figurent pas dans les sources lues.</p></template>
<template data-pop="i89-stades" data-title="Stades du lymphoedème"><p><b>Stade 0 — latence.</b> Pas de gonflement visible malgré un transport lymphatique altéré ; peut précéder de mois ou d’années l’œdème.</p><p><b>Stade I — spontanément réversible.</b> Œdème mou, riche en protéines, qui diminue à la surélévation ; godet possible.</p><p><b>Stade II — non spontanément réversible.</b> Graisse et fibrose ; la surélévation réduit rarement le gonflement ; godet net, qui peut disparaître tardivement.</p><p><b>Stade III — éléphantiasis lymphostatique.</b> Le gonflement est dur et déformant, et le godet est souvent absent, car la fibrose et la graisse ont remplacé le liquide libre. La peau présente une acanthose et des excroissances verruqueuses.</p><p>Un même membre peut présenter plusieurs stades (ISL 2023).</p></template>
<template data-pop="i89-sev" data-title="Sévérité du lymphoedème (ISL 2023)"><p><b>Calcul.</b> On exprime l’excès de volume du membre atteint par rapport au membre sain, en pourcentage, car cette comparaison corrige les différences de gabarit entre patients.</p><p><b>Seuils.</b> Le lymphoedème est <b>minime</b> entre plus de 5 et moins de 20 %, <b>modéré</b> entre 20 et 40 % et <b>sévère</b> au-delà de 40 %. Certaines équipes distinguent en outre un stade minime de plus de 5 à 10 % et un stade léger de plus de 10 à moins de 20 %.</p><p><b>Limite.</b> En cas d’atteinte bilatérale, la comparaison entre membres s’interprète avec prudence, car le membre de référence est lui-même atteint.</p></template>
<template data-pop="i89-ery" data-title="Érysipèle sur lymphoedème"><p><b>Définition (S2k 2017).</b> L’érysipèle est une dermite aiguë inflammatoire à streptocoque du groupe A, appelée cellulite dans les pays anglo-saxons. Le tissu lymphoedémateux la favorise, car la stase perturbe la circulation des leucocytes.</p><p><b>Clinique (ISL 2023).</b> L’érysipèle associe un érythème, une douleur et une forte fièvre ; il évolue rarement vers un choc septique. En revanche, une rougeur discrète sans signe général n’est pas forcément bactérienne.</p><p><b>Conduite.</b> Antibiothérapie systémique ; interruption de la thérapie décongestive du membre jusqu’à l’effet de l’antibiotique ; pénicilline prophylactique si les épisodes récidivent malgré un traitement optimal.</p><p><b>Cercle vicieux.</b> Chaque épisode altère davantage les lymphatiques, ce qui aggrave la stase et favorise l’épisode suivant ; c’est pourquoi une prophylaxie se discute en cas de récidives.</p></template>
<template data-pop="i89-malin" data-title="Lymphoedème malin"><p><b>Définition (S2k 2017).</b> Lymphoedème dû au blocage des lymphatiques par une tumeur : lymphangiose carcinomateuse ou envahissement ganglionnaire.</p><p><b>Quand y penser (ISL 2023).</b> Devant un lymphoedème unilatéral de l’adulte, le médecin cherche une tumeur solide primitive ou métastatique, un lymphome ou un sarcome des tissus mous, car une masse peut comprimer ou envahir les voies lymphatiques.</p><p><b>Traitement.</b> Contre-indication relative à la thérapie décongestive ; celle-ci peut être palliative, avec un traitement oncologique dirigé contre la tumeur, et n’est pas imposée au patient qui la vit comme un fardeau. Un bref traitement diurétique peut aider.</p></template>
<template data-pop="i89-compr" data-title="Compression du lymphoedème"><p><b>Phase I.</b> Bandages multicouches à allongement court, posés uniquement par du personnel formé, car un bandage mal posé peut être nocif ou inutile.</p><p><b>Phase II.</b> Le patient porte un bas ou un manchon à allongement court, <b>sur mesure</b> et mesuré par un professionnel ; le tricot est plat ou rond selon les équipes. L’allongement court est choisi parce qu’il offre une forte résistance quand le muscle se contracte, ce qui renforce l’effet de pompe.</p><p><b>Pression.</b> La classe la plus élevée tolérée, d’environ 20 à 60 mmHg, est probablement la plus bénéfique (ISL 2023).</p><p><b>Prescription médicale.</b> Elle évite un usage malgré une contre-indication : artériopathie, syndrome post-thrombotique douloureux, néoplasie occulte, infection aiguë, certaines dermatoses.</p></template>
<template data-pop="i89-psm" data-title="Surveillance prospective après cancer"><p><b>Avant le traitement.</b> Mesure de départ du volume des deux membres et de la mobilité fonctionnelle ; bioimpédance ou constante diélectrique tissulaire si disponibles.</p><p><b>Ensuite.</b> Les contrôles ont lieu par exemple tous les 3 mois la première année, puis sont plus espacés, avec un soutien psychosocial.</p><p><b>Seuil.</b> Un lymphoedème infraclinique est détectable dès 3 à 5 % d’excès de volume par rapport au départ, sans variation de poids, car la mesure de départ sert de référence propre au patient.</p><p><b>Bénéfice.</b> Le dépistage permet un traitement conservateur précoce par compression, éducation, autodrainage et exercice (ISL 2023), qui réduit le risque d’évolution vers un stade chronique.</p></template>
<template data-pop="i89-cone" data-title="Formule du tronc de cône"><p>Le membre est assimilé à une succession de troncs de cône entre deux circonférences mesurées à intervalle fixe h. Le volume d’un segment vaut V = h × (C1² + C1 × C2 + C2²) / (12 π), où C1 et C2 sont les circonférences à ses deux extrémités ; le volume du membre est la somme des segments. La mesure utilise un ruban souple non extensible ; l’ISL 2023 la décrit comme la méthode la plus répandue, car disponible et peu coûteuse.</p></template>
<template data-pop="i89-icg" data-title="Lymphographie au vert d’indocyanine"><p><b>Principe.</b> Le vert d’indocyanine injecté par voie sous-cutanée se lie à l’albumine et est drainé par les lymphatiques ; une caméra en proche infrarouge le visualise en temps réel, sans irradiation (S2k 2017, ISL 2023).</p><p><b>Usages.</b> L’examen visualise les lymphatiques superficiels, repère les vaisseaux fonctionnels avant une anastomose lymphaticoveineuse et détecte précocement le lymphoedème après un cancer.</p><p><b>Limites.</b> L’examen ne voit qu’à environ 2 cm de profondeur, et ses classifications ne sont pas standardisées. De plus, on n’injecte pas dans un érysipèle, et des réactions anaphylactiques ont été décrites après injection intraveineuse.</p></template>
<template data-pop="pareto-i89-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i89-0,i89-1,i89-2,i89-3,i89-4,i89-5,i89-6"></p><ul>
<li>Lymphoedème = transport lymphatique inférieur à la charge ; maladie inflammatoire chronique de l’interstitium.</li>
<li>Le lymphoedème évolue en quatre stades : 0 (latence), I (réversible), II (irréversible, avec fibrose) et III (éléphantiasis).</li>
<li>Dans le monde, 85 % des lymphoedèmes sont secondaires ; dans les pays industrialisés, le cancer et son traitement en sont la première cause.</li>
<li>Le risque atteint 19,9 % après curage axillaire et 5,6 % après ganglion sentinelle, car le curage retire beaucoup plus de ganglions ; l’obésité l’aggrave.</li>
<li>Examen debout et couché ; signe de Stemmer ; un signe négatif n’exclut rien.</li></ul></template>
<template data-pop="pareto-i89-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i89-7,i89-8,i89-9"></p><ul>
<li>Diagnostic clinique ; bilan médical complet avant traitement ; unilatéral de l’adulte = chercher une tumeur.</li>
<li>Le diagnostic différentiel comprend les œdèmes généraux, l’insuffisance veineuse, le lipoedème et la thrombose.</li>
<li>En cas d’érysipèle, le médecin prescrit un antibiotique systémique et suspend la thérapie décongestive jusqu’à l’effet de l’antibiotique.</li>
<li>Le traitement associe soins de peau, éducation et thérapie décongestive en deux phases, avec la compression la plus forte tolérée (20 à 60 mmHg).</li>
<li>La thérapie décongestive est absolument contre-indiquée en cas d’insuffisance cardiaque décompensée, de thrombose aiguë, d’érysipèle sévère et d’artériopathie aux stades III et IV, car la mobilisation des œdèmes surcharge le cœur et la compression aggrave l’ischémie.</li></ul></template>
<template data-pop="pareto-i89-suivi" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="i89-10,i89-11"></p><ul>
<li>Le suivi porte sur le volume des deux membres, la peau, les infections et le port effectif de la compression.</li>
<li>Après un cancer, le médecin prend une mesure de départ, puis contrôle tous les 3 mois la première année ; le lymphoedème infraclinique se détecte dès 3 à 5 % d’excès de volume.</li>
<li>L’activité physique recommandée atteint au moins 150 minutes par semaine d’activité modérée mixte.</li></ul></template>
<template data-pop="pareto-i89-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i89-e-1,i89-e-2,i89-e-3,i89-e-4"></p><ul>
<li>Le volume se mesure au ruban non extensible avec la formule du tronc de cône.</li>
<li>Écho-Doppler veineux d’abord ; lymphoscintigraphie si doute, contre-indiquée pendant la grossesse.</li>
<li>La lymphographie directe à l’huile est contre-indiquée pour diagnostiquer un lymphoedème.</li></ul></template>
<template data-pop="pareto-i89-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i89-p-1,i89-p-2"></p><ul>
<li>Aucun médicament propre au lymphoedème n’a démontré son efficacité.</li>
<li>Érysipèles répétés malgré un traitement optimal : pénicilline prophylactique.</li>
<li>Le diurétique au long cours est découragé, car il retire l’eau sans corriger le défaut de transport ; les benzopyrones ne remplacent pas la thérapie physique, et la coumarine est hépatotoxique.</li></ul></template>
