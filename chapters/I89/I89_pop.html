<template data-pop="i89-charge" data-title="Charge lymphatique et capacité de transport"><p>La <b>charge lymphatique obligatoire</b> est le liquide filtré par les capillaires sanguins vers l’interstitium et non réabsorbé, avec ses protéines et ses cellules. La <b>capacité de transport</b> est ce que le système lymphatique peut évacuer. À l’état normal, les deux sont en équilibre (S2k 2017). Le lymphoedème survient quand le transport tombe sous la charge : insuffisance à bas débit. Les autres œdèmes surviennent quand une charge excessive déborde des lymphatiques intacts : insuffisance à haut débit (ISL 2023).</p></template>
<template data-pop="i89-lymphangion" data-title="Lymphangion"><p>Segment d’un collecteur lymphatique compris entre deux valvules, dont la paroi musculaire se contracte de façon rythmique et propulse la lymphe vers le centre. L’étirement de la paroi augmente la fréquence de ces pulsations : c’est le mécanisme du drainage lymphatique manuel (S2k 2017).</p></template>
<template data-pop="i89-stemmer" data-title="Signe de Stemmer"><p>Le médecin pince et soulève un pli de peau à la base, au niveau de la première phalange, du deuxième ou du troisième orteil ou doigt, et éventuellement sur d’autres régions atteintes. Si la peau ne se soulève pas ou à peine, le tissu est induré : le signe est <b>positif</b> et oriente vers un lymphoedème. Un signe <b>négatif n’exclut pas</b> un lymphoedème (S2k 2017), en particulier au stade I.</p></template>
<template data-pop="i89-lipoedeme" data-title="Lipoedème"><p>Accumulation symétrique de tissu adipeux, surtout sous la crête iliaque (hanches et cuisses), sensible à la pression, douloureuse, avec tendance aux ecchymoses. Il touche surtout la femme et débute le plus souvent à la puberté, parfois après une grossesse ou à la ménopause. Le système lymphatique n’est pas atteint au début ; au stade avancé, un lymphoedème peut s’y ajouter (S2k 2017, ISL 2023).</p></template>
<template data-pop="i89-stewart" data-title="Syndrome de Stewart et Treves"><p>Lymphangiosarcome, tumeur maligne vasculaire rare et très létale, survenant sur un lymphoedème chronique mal contrôlé (ISL 2023). La S2k 2017 rappelle d’ailleurs que le lymphoedème est suspecté d’être en soi cancérigène. Toute lésion cutanée nouvelle sur un lymphoedème ancien justifie un avis dermatologique.</p></template>
<template data-pop="i89-tdc" data-title="Thérapie décongestive complexe"><p>Traitement physique de référence du lymphoedème, en deux phases. <b>Phase I</b> : soins de peau, drainage lymphatique manuel, exercices de pompe musculaire et bandages multicouches à allongement court, une à deux fois par jour. <b>Phase II</b> : bas ou manchon de compression sur mesure, soins de peau, exercice, drainage selon les besoins et autotraitement. Elle exige des médecins, infirmiers et thérapeutes spécifiquement formés (ISL 2023, S2k 2017).</p></template>
<template data-pop="i89-scinti" data-title="Lymphoscintigraphie"><p>Un traceur radioactif, des nanocolloïdes marqués au technétium 99m, est injecté dans la peau ou le tissu sous-cutané des deux pieds ou des deux mains ; une caméra suit sa progression dans les lymphatiques et les ganglions et compare les deux côtés. L’examen montre les anomalies structurelles et fonctionnelles et peut être répété. Il est contre-indiqué pendant la grossesse (S2k 2017, ISL 2023).</p></template>
<template data-pop="i89-d-penicilline" data-title="Prophylaxie des érysipèles répétés"><p>Lorsque les infections du membre récidivent malgré une thérapie décongestive optimale, l’ISL 2023 recommande une pénicilline prophylactique, plus rarement un antibiotique à large spectre sous surveillance, poursuivie selon le rapport bénéfice-risque. Le contrôle de l’œdème lui-même réduit aussi la fréquence des érysipèles. La molécule et la dose suisses ne figurent pas dans les sources lues.</p></template>
<template data-pop="i89-stades" data-title="Stades du lymphoedème"><p><b>Stade 0 — latence.</b> Pas de gonflement visible malgré un transport lymphatique altéré ; peut précéder de mois ou d’années l’œdème.</p><p><b>Stade I — spontanément réversible.</b> Œdème mou, riche en protéines, qui diminue à la surélévation ; godet possible.</p><p><b>Stade II — non spontanément réversible.</b> Graisse et fibrose ; la surélévation réduit rarement le gonflement ; godet net, qui peut disparaître tardivement.</p><p><b>Stade III — éléphantiasis lymphostatique.</b> Gonflement dur et déformant, godet souvent absent, acanthose, excroissances verruqueuses.</p><p>Un même membre peut présenter plusieurs stades (ISL 2023).</p></template>
<template data-pop="i89-sev" data-title="Sévérité du lymphoedème (ISL 2023)"><p><b>Calcul.</b> Excès de volume du membre atteint par rapport au membre sain, en pourcentage.</p><p><b>Seuils.</b> <b>Minime</b> : plus de 5 à moins de 20 %. <b>Modéré</b> : 20 à 40 %. <b>Sévère</b> : plus de 40 %. Certaines équipes distinguent plus de 5 à 10 % (minime) et plus de 10 à moins de 20 % (léger).</p><p><b>Limite.</b> En cas d’atteinte bilatérale, la comparaison entre membres s’interprète avec prudence.</p></template>
<template data-pop="i89-ery" data-title="Érysipèle sur lymphoedème"><p><b>Définition (S2k 2017).</b> Dermite aiguë inflammatoire à streptocoque du groupe A, appelée cellulite dans les pays anglo-saxons ; le tissu lymphoedémateux la favorise.</p><p><b>Clinique (ISL 2023).</b> Érythème, douleur, forte fièvre, rarement choc septique. Une rougeur discrète sans signe général n’est pas forcément bactérienne.</p><p><b>Conduite.</b> Antibiothérapie systémique ; interruption de la thérapie décongestive du membre jusqu’à l’effet de l’antibiotique ; pénicilline prophylactique si les épisodes récidivent malgré un traitement optimal.</p><p><b>Cercle vicieux.</b> Chaque épisode altère davantage les lymphatiques.</p></template>
<template data-pop="i89-malin" data-title="Lymphoedème malin"><p><b>Définition (S2k 2017).</b> Lymphoedème dû au blocage des lymphatiques par une tumeur : lymphangiose carcinomateuse ou envahissement ganglionnaire.</p><p><b>Quand y penser (ISL 2023).</b> Lymphoedème unilatéral de l’adulte : chercher une tumeur solide primitive ou métastatique, un lymphome ou un sarcome des tissus mous.</p><p><b>Traitement.</b> Contre-indication relative à la thérapie décongestive ; celle-ci peut être palliative, avec un traitement oncologique dirigé contre la tumeur, et n’est pas imposée au patient qui la vit comme un fardeau. Un bref traitement diurétique peut aider.</p></template>
<template data-pop="i89-compr" data-title="Compression du lymphoedème"><p><b>Phase I.</b> Bandages multicouches à allongement court, posés uniquement par du personnel formé, car un bandage mal posé peut être nocif ou inutile.</p><p><b>Phase II.</b> Bas ou manchon à allongement court, <b>sur mesure</b>, mesuré par un professionnel ; tricot plat ou rond selon les équipes.</p><p><b>Pression.</b> La classe la plus élevée tolérée, d’environ 20 à 60 mmHg, est probablement la plus bénéfique (ISL 2023).</p><p><b>Prescription médicale.</b> Elle évite un usage malgré une contre-indication : artériopathie, syndrome post-thrombotique douloureux, néoplasie occulte, infection aiguë, certaines dermatoses.</p></template>
<template data-pop="i89-psm" data-title="Surveillance prospective après cancer"><p><b>Avant le traitement.</b> Mesure de départ du volume des deux membres et de la mobilité fonctionnelle ; bioimpédance ou constante diélectrique tissulaire si disponibles.</p><p><b>Ensuite.</b> Contrôles par exemple tous les 3 mois la première année, puis plus espacés, avec soutien psychosocial.</p><p><b>Seuil.</b> Lymphoedème infraclinique dès 3 à 5 % d’excès de volume par rapport au départ, sans variation de poids.</p><p><b>Bénéfice.</b> Traitement conservateur précoce : compression, éducation, autodrainage, exercice (ISL 2023).</p></template>
<template data-pop="i89-cone" data-title="Formule du tronc de cône"><p>Le membre est assimilé à une succession de troncs de cône entre deux circonférences mesurées à intervalle fixe h. Le volume d’un segment vaut V = h × (C1² + C1 × C2 + C2²) / (12 π), où C1 et C2 sont les circonférences à ses deux extrémités ; le volume du membre est la somme des segments. La mesure utilise un ruban souple non extensible ; l’ISL 2023 la décrit comme la méthode la plus répandue, car disponible et peu coûteuse.</p></template>
<template data-pop="i89-icg" data-title="Lymphographie au vert d’indocyanine"><p><b>Principe.</b> Le vert d’indocyanine injecté par voie sous-cutanée se lie à l’albumine et est drainé par les lymphatiques ; une caméra en proche infrarouge le visualise en temps réel, sans irradiation (S2k 2017, ISL 2023).</p><p><b>Usages.</b> Lymphatiques superficiels ; repérage des vaisseaux fonctionnels avant anastomose lymphaticoveineuse ; détection précoce après cancer.</p><p><b>Limites.</b> Profondeur visible d’environ 2 cm ; classifications non standardisées ; pas d’injection sur un érysipèle ; réactions anaphylactiques décrites après injection intraveineuse.</p></template>
<template data-pop="pareto-i89-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i89-0,i89-1,i89-2,i89-3,i89-4,i89-5,i89-6"></p><ul>
<li>Lymphoedème = transport lymphatique inférieur à la charge ; maladie inflammatoire chronique de l’interstitium.</li>
<li>Stades 0 (latence), I (réversible), II (irréversible, fibrose), III (éléphantiasis).</li>
<li>85 % secondaires dans le monde ; dans les pays industrialisés, d’abord le cancer et son traitement.</li>
<li>Curage axillaire : 19,9 % ; ganglion sentinelle : 5,6 % ; obésité aggravante.</li>
<li>Examen debout et couché ; signe de Stemmer ; un signe négatif n’exclut rien.</li></ul></template>
<template data-pop="pareto-i89-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i89-7,i89-8,i89-9"></p><ul>
<li>Diagnostic clinique ; bilan médical complet avant traitement ; unilatéral de l’adulte = chercher une tumeur.</li>
<li>Différentiels : œdèmes généraux, insuffisance veineuse, lipoedème, thrombose.</li>
<li>Érysipèle : antibiotique systémique, pause de la thérapie décongestive.</li>
<li>Soins de peau, éducation, thérapie décongestive en deux phases, compression tolérée la plus forte (20 à 60 mmHg).</li>
<li>Contre-indications absolues : insuffisance cardiaque décompensée, thrombose aiguë, érysipèle sévère, artériopathie stades III et IV.</li></ul></template>
<template data-pop="pareto-i89-suivi" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="i89-10,i89-11"></p><ul>
<li>Volume des deux membres, peau, infections, port de la compression.</li>
<li>Après cancer : mesure de départ, contrôles tous les 3 mois la première année ; infraclinique dès 3 à 5 %.</li>
<li>Activité physique : au moins 150 minutes par semaine d’activité modérée mixte.</li></ul></template>
<template data-pop="pareto-i89-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i89-e-1,i89-e-2,i89-e-3,i89-e-4"></p><ul>
<li>Volume : ruban non extensible et formule du tronc de cône.</li>
<li>Écho-Doppler veineux d’abord ; lymphoscintigraphie si doute, contre-indiquée pendant la grossesse.</li>
<li>Lymphographie directe à l’huile contre-indiquée pour le diagnostic du lymphoedème.</li></ul></template>
<template data-pop="pareto-i89-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i89-p-1,i89-p-2"></p><ul>
<li>Pas de médicament propre d’efficacité démontrée.</li>
<li>Érysipèles répétés malgré un traitement optimal : pénicilline prophylactique.</li>
<li>Diurétique au long cours découragé ; benzopyrones non substitutives, coumarine hépatotoxique.</li></ul></template>
