<section class="ilot" id="i89-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 56 ans, en surpoids, consulte pour une jambe droite gonflée depuis quatre ans. Or, elle a fait trois érysipèles de cette jambe ; après chacun, la jambe a désenflé un peu moins. De plus, le gonflement touche le dos du pied et les orteils, ne disparaît plus la nuit, et la peau de la base du deuxième orteil ne se laisse plus pincer. Enfin, elle a reçu un diurétique, sans effet. Dès lors, la question qui structure ce cours est la suivante : <b>comment reconnaître un lymphoedème au lit du patient et le distinguer des autres œdèmes, pourquoi le diurétique a échoué, et quel traitement réduit le volume et les infections ?</b></p>
<p>Pour y répondre, le cours suit le plan monographique. Ainsi, à la fin de ce cours, le médecin assistant sait définir le lymphoedème et le classer en stades, rechercher le signe de Stemmer, écarter une cause tumorale ou cardiaque, distinguer le lymphoedème du lipoedème et de l’œdème veineux, prescrire la thérapie décongestive complexe en connaissant ses contre-indications, et reconnaître et traiter les complications infectieuses.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i89-charge">charge lymphatique et la capacité de transport (notions)</button> et le <button class="w" data-k="i89-lymphangion">lymphangion (unité contractile du collecteur)</button>.</div>
</section>
<section class="ilot" id="i89-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>Avant toute démarche, il faut définir précisément l’entité. Le <b>lymphoedème</b> est en effet une maladie inflammatoire chronique de l’interstitium, due à une atteinte primaire (congénitale) ou secondaire (acquise) du système de drainage lymphatique : capillaires lymphatiques, précollecteurs, collecteurs, troncs ou ganglions (S2k 2017). De même, selon l’ISL 2023, c’est la manifestation d’une insuffisance du système lymphatique et d’un transport lymphatique perturbé : le transport est tombé sous la capacité nécessaire pour évacuer la charge filtrée par les capillaires sanguins.</p>
<p>Une fois la maladie définie, il faut en graduer l’évolution. La <button class="w" data-k="i89-stades">classification par stades (ISL 2023, S2k 2017)</button> est commune aux deux référentiels.</p>
<table class="t"><tr><th>Stade</th><th>Clinique (ISL 2023, S2k 2017)</th></tr>
<tr><td><b>0</b> — latence</td><td>Pas de gonflement visible malgré un transport lymphatique altéré ; parfois anomalies scintigraphiques ou symptômes subjectifs. Il peut précéder de mois ou d’années l’œdème manifeste.</td></tr>
<tr><td><b>I</b> — spontanément réversible</td><td>Œdème mou, relativement riche en protéines, qui diminue à la surélévation du membre ; le godet est possible.</td></tr>
<tr><td><b>II</b> — non spontanément réversible</td><td>Accumulation permanente de graisse et de protéines ; la surélévation seule réduit rarement le gonflement ; godet net, qui peut disparaître tardivement quand la graisse et la fibrose s’installent.</td></tr>
<tr><td><b>III</b> — éléphantiasis lymphostatique</td><td>Gonflement dur, déformant ; godet souvent absent ; épaississement cutané, acanthose, dépôts graisseux et fibrose, excroissances verruqueuses.</td></tr></table>
<p>Toutefois, un même membre peut présenter plusieurs stades selon les territoires lymphatiques (ISL 2023). En outre, à l’intérieur de chaque stade, l’ISL apprécie la sévérité par l’<button class="w" data-k="i89-sev">excès de volume (seuils de sévérité ISL)</button> par rapport au côté sain : minime de plus de 5 à moins de 20 %, modéré de 20 à 40 %, sévère au-delà de 40 %.</p>
<p>Ces stades se retrouvent d’ailleurs dans le codage. <b>Codage.</b> La CIM-10-GM range sous I89.0 le lymphoedème non classé ailleurs, avec un cinquième caractère pour le stade et le siège ; le lymphoedème héréditaire relève de Q82 et le lymphoedème après mastectomie ou autre intervention de I97 (S2k 2017). En revanche, les fistules lymphatiques cutanées, lymphocèles et reflux chyleux se codent sous I89.8.</p>
</section>
<section class="ilot" id="i89-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La classification posée, il faut en mesurer la fréquence. Dans le monde, en effet, environ 85 % des lymphoedèmes sont secondaires (ISL 2023). Dans les pays industrialisés, plus précisément, la cause secondaire la plus fréquente est le <b>cancer et son traitement</b> (S2k 2017). À l’inverse, l’incidence du lymphoedème primaire est estimée à 1 sur 6000 naissances ; les femmes sont nettement plus touchées par la forme primaire, avec un rapport hommes-femmes de 1 pour 4,5 à 1 pour 6,1. Par ailleurs, le nombre de patients augmente avec l’âge.</p>
<p>Le risque dépend surtout du geste réalisé. Ainsi, après traitement d’un cancer du sein, l’incidence du lymphoedème à 12 à 24 mois est de 19,9 % après curage axillaire et de 5,6 % après biopsie du ganglion sentinelle ; après curage ganglionnaire pour cancer gynécologique, elle est d’environ 20 % (S2k 2017). De plus, le curage inguinal expose davantage que le curage axillaire. En outre, l’obésité favorise et aggrave le lymphoedème. En revanche, aucune donnée suisse n’a été trouvée dans les sources lues (lacune nommée).</p>
<p>Quelle que soit sa cause, le lymphoedème devient le plus souvent une affection <b>chronique</b> et, en règle générale, incurable : il exige des soins à vie, comme une insuffisance veineuse chronique exige une compression à vie (ISL 2023). C’est pourquoi un traitement précoce donne les meilleurs résultats.</p>
</section>
<section class="ilot" id="i89-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Pour comprendre cette chronicité, il faut revenir à la physiologie. À l’état physiologique, en effet, le liquide filtré par les capillaires sanguins et non réabsorbé, appelé <button class="w" data-k="i89-charge">charge lymphatique obligatoire (notion)</button>, est évacué par le système lymphatique ; il existe un équilibre entre cette charge et la capacité de transport (S2k 2017). De fait, presque tout le liquide interstitiel finit par devenir de la lymphe (ISL 2023).</p>
<p>Lorsque cet équilibre se rompt, l’ISL distingue deux défaillances, qui conduisent toutes deux à l’œdème mais n’ont pas la même signification.</p>
<figure><img src="images/cardiologie/i89_capillaires_lymphatiques_openstax.gif" alt="Illustration publiée des capillaires lymphatiques dans les espaces tissulaires : le liquide interstitiel entre par les jonctions endothéliales et devient la lymphe" width="760" height="440" loading="lazy" decoding="async" style="max-width:100%;height:auto">
<figcaption>Figure 1 — Formation de la lymphe : le liquide filtré par les capillaires sanguins dans l’interstitium (charge lymphatique) entre dans les capillaires lymphatiques par des jonctions endothéliales en clapet, puis gagne les vaisseaux lymphatiques munis de valvules. Légendes en anglais. Figure 2202 d’OpenStax College, Anatomy &amp; Physiology (2013), Wikimedia Commons, licence Creative Commons Attribution 3.0 ; convertie pour l’atlas.</figcaption></figure>
<table class="t"><tr><th>Type</th><th>Mécanisme (ISL 2023)</th><th>Exemples</th></tr>
<tr><td><b>Insuffisance à bas débit</b> = lymphoedème</td><td>Transport lymphatique réduit : dysplasie congénitale, destruction acquise</td><td>Lymphoedème primaire ; curage ganglionnaire, irradiation, lymphangites répétées, filariose</td></tr>
<tr><td><b>Insuffisance à haut débit</b> = œdème non lymphatique</td><td>Lymphatiques intacts, débordés par une filtration excessive</td><td>Cirrhose (ascite), syndrome néphrotique, insuffisance cardiaque droite, insuffisance veineuse de la jambe</td></tr>
<tr><td><b>Forme mixte</b> (« insuffisance de la soupape de sécurité »)</td><td>Une surcharge prolongée finit par altérer les lymphatiques</td><td>Infections répétées, brûlures, réactions allergiques répétées ; particulièrement difficile à traiter</td></tr></table>
<p>Dans le lymphoedème proprement dit, le gonflement résulte de l’accumulation de liquide, de protéines plasmatiques filtrées, de cellules et de produits cellulaires. Or, cette stase provoque une <b>prolifération tissulaire</b> avec dépôt de matrice extracellulaire et de tissu adipeux, qui commence tôt (ISL 2023). De plus, la stase perturbe la circulation des leucocytes, ce qui favorise l’<button class="w" data-k="i89-ery">érysipèle (définition et conduite)</button>, dermite aiguë à streptocoque du groupe A (S2k 2017).</p>
<div class="key"><b>Corrélation physiopathologie → traitement.</b> Le diurétique de la vignette a échoué parce qu’il agit sur l’eau et le sodium, alors que le problème est un défaut de transport et une accumulation de protéines, de graisse et de fibrose. L’ISL décourage son usage prolongé dans le lymphoedème périphérique.</div>
</section>
<section class="ilot" id="i89-4"><h2><span class="n">4</span>Étiologies</h2>
<table class="t"><tr><th>Lymphoedème primaire (S2k 2017)</th><th>Lymphoedème secondaire (S2k 2017)</th></tr>
<tr><td>Aplasie ou atrésie, hypoplasie, hyperplasie ou dysplasie des lymphatiques ; fibrose ou agénésie ganglionnaire. Origine génétique, héréditaire ou sporadique, parfois révélée des années plus tard ; formes syndromiques (syndrome de Turner, syndrome de Klippel-Trénaunay) ; gènes connus, par exemple FLT4 dans la maladie de Nonne et Milroy et FOXC2 dans le lymphoedème avec distichiasis</td><td>Chirurgie et curage ganglionnaire ; irradiation ; processus malins ; traumatismes et cicatrices ; infections, en particulier érysipèles répétés ; obésité ; stades avancés de l’insuffisance veineuse chronique ; lymphoedème provoqué volontairement. Dans le monde, la filariose lymphatique (ISL 2023)</td></tr></table>
<div class="alert"><b><button class="w" data-k="i89-malin">Lymphoedème malin (définition)</button>.</b> Une tumeur peut bloquer les lymphatiques par lymphangiose carcinomateuse ou envahissement ganglionnaire (S2k 2017). Devant un lymphoedème unilatéral de l’adulte, l’ISL demande de rechercher une tumeur solide, un lymphome ou un sarcome des tissus mous qui obstrue les lymphatiques en amont.</div>
</section>
