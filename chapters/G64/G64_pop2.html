<template data-pop="g64-biopsie-cutanee" data-title="Biopsie cutanée des petites fibres (EFNS/PNS 2010)">
<div class="lab">Technique</div><p>Cette guideline émane de l’<button class="w" data-k="g64-biopsie-cutanee">EFNS</button>, devenue l’<button class="w" data-k="g64-biopsie-cutanee">EAN</button>. Elle recommande une biopsie de 3 mm à la jambe distale, la mesure de la densité linéaire des fibres intraépidermiques selon des règles de comptage standardisées et la comparaison à des normes appariées pour l’âge.</p>
<div class="lab">Niveaux de preuve</div><p>La technique est fiable pour diagnostiquer la neuropathie des petites fibres (niveau A) ; normes appariées pour l’âge (niveau A) ; densité réduite associée au risque de douleur neuropathique, non à son intensité (niveau B) ; biopsies sériées utiles pour suivre la progression (niveau C).</p>
<div class="lab">Sécurité et limite</div><p>Environ 35 000 biopsies ont été réalisées sans effet grave, avec 0,19 % d’effets non graves. La biopsie n’identifie pas l’étiologie.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03023.x" target="_blank" rel="noopener">Lauria et al., guideline EFNS/PNS, biopsie cutanée, Eur J Neurol 2010 (résumé)</a>.</p></template>
<template data-pop="g64-genetique" data-title="Génétique">
<div class="lab">Contenu</div><p>L’étape 7 de la démarche consiste en l’analyse de <button class="w" data-k="g64-genetique">PMP22</button>, <button class="w" data-k="g64-genetique">GJB1</button>, <button class="w" data-k="g64-genetique">MPZ</button>, <button class="w" data-k="g64-genetique">MFN2</button>, par panel ou par exome ou génome.</p>
<div class="lab">Indications</div><p>La guideline allemande de 2025 indique l’analyse devant un début précoce, un antécédent familial ou un pied creux avec orteils en griffe. La duplication de <button class="w" data-k="g64-genetique">PMP22</button> se recherche avant les panels. Les gènes <button class="w" data-k="g64-genetique">GLA</button> (maladie de Fabry), <button class="w" data-k="g64-genetique">TTR</button> (amylose héréditaire) et <button class="w" data-k="g64-genetique">RFC1</button> (polyneuropathie axonale idiopathique chronique) se cherchent sur des signes précis, détaillés dans l’onglet Sciences, sous-onglet Génétique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a> ; <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, § 3.2.4</a>.</p></template>
<template data-pop="g64-poems" data-title="Syndrome POEMS">
<div class="lab">Définition</div><p>Le syndrome POEMS associe une polyneuropathie, une paraprotéine monoclonale, une organomégalie, une endocrinopathie et des lésions cutanées ou ostéosclérotiques.</p>
<div class="lab">Application</div><p>Une paraprotéine avec organomégalie, endocrinopathie, lésions cutanées ou ostéosclérotiques est un drapeau rouge : avis spécialisé. Une maladie de Castleman, des lésions ostéocondensantes ou un facteur de croissance de l’endothélium vasculaire élevé orientent vers ce syndrome. Le traitement de première ligne cité par la revue allemande de 2018 est l’autogreffe de cellules souches.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-paraproteine" data-title="Paraprotéines et neuropathie">
<div class="lab">Définition</div><p>Une paraprotéine est souvent découverte fortuitement et n’explique pas la neuropathie.</p>
<div class="lab">Exceptions</div><p>Neuropathie à <button class="w" data-k="g64-paraproteine">IgM</button> avec anticorps anti-<button class="w" data-k="g64-paraproteine">MAG</button> ; <button class="w" data-k="g64-poems">POEMS</button> ; amylose. Des <button class="w" data-k="g64-paraproteine">IgM</button> élevées font évoquer une maladie de Waldenström et font doser les anticorps anti-<button class="w" data-k="g64-paraproteine">MAG</button> ; des <button class="w" data-k="g64-paraproteine">IgG</button> élevées peuvent orienter vers une amylose <button class="w" data-k="g64-paraproteine">AL</button> liée au myélome. Selon la guideline allemande de 2025, une gammapathie <button class="w" data-k="g64-paraproteine">IgG</button> ou <button class="w" data-k="g64-paraproteine">IgA</button>, très fréquente chez le sujet âgé, n’a en général pas de lien avec la polyneuropathie, sauf syndrome <button class="w" data-k="g64-poems">POEMS</button>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a> ; <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, diagnostic des anticorps</a>.</p></template>
<template data-pop="g64-dysimmun" data-title="Causes dysimmunitaires">
<div class="lab">Fréquence</div><p><button class="w" data-k="g64-sgb">SGB</button> : incidence de 1 à 2 pour 100 000 par an. <button class="w" data-k="g64-pidc">PIDC</button> : prévalence de 2 à 3 pour 100 000. Neuropathie motrice multifocale : prévalence de 0,6 à 2 pour 100 000, avec blocs de conduction multifocaux, <button class="w" data-k="g64-paraproteine">IgM</button> anti-<button class="w" data-k="g64-dysimmun">GM1</button> chez environ la moitié des patients et prédominance masculine.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-nav" data-title="Canaux sodiques Nav1.7, 1.8 et 1.9">
<div class="lab">Définition</div><p>Les variants à gain de fonction des canaux sodiques voltage-dépendants <button class="w" data-k="g64-nav">Nav</button>1.7, 1.8 et 1.9 sont associés à la neuropathie des petites fibres.</p>
<div class="lab">Mécanisme</div><p>Ces variants provoquent une hyperexcitabilité nociceptive, dont dépend la douleur neuropathique. Le phénotype forme un continuum, avec ou sans dysautonomie.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/jns.12298" target="_blank" rel="noopener">Sopacua et al., Small-fiber neuropathy, J Peripher Nerv Syst 2019 (résumé)</a>.</p></template>
<template data-pop="g64-pregabaline" data-title="Prégabaline : posologie et sécurité">
<div class="lab">Source</div><p>Information professionnelle suisse Lyrica®, mise à jour de juillet 2026, consultée via <button class="w" data-k="g64-pregabaline">AmiKo</button> le 16.10.2026 ; rubriques indications, posologie, tableau 1 d’adaptation rénale, mises en garde et aptitude à la conduite.</p>
<div class="lab">Posologie</div><p>La clairance de la créatinine fixe la dose. <button class="w" data-k="g64-pregabaline">Clcr</button> d’au moins 60 ml/min : 150 mg par jour en 2 ou 3 prises ; 300 mg après 3 à 7 jours ; maximum 600 mg après 7 jours de plus. <button class="w" data-k="g64-pregabaline">Clcr</button> de 30 à 60 ml/min : 75 mg par jour au départ, 300 mg par jour au maximum, en 2 ou 3 prises. <button class="w" data-k="g64-pregabaline">Clcr</button> inférieure à 30 ml/min : ne doit pas être utilisée selon la <button class="w" data-k="g64-pregabaline">FI</button>. Après 65 ans, la dose n’est réduite qu’en cas d’insuffisance rénale.</p>
<div class="lab">Sécurité</div><p>Les étourdissements et la somnolence rendent les chutes plus fréquentes chez la personne âgée. Le patient ne conduit pas tant qu’il ignore l’effet du médicament. Une dépression respiratoire sévère a été rapportée. L’association aux opiacés impose la prudence. Le mésusage et la dépendance sont possibles aux doses thérapeutiques. Une insuffisance cardiaque a été rapportée chez des sujets âgés à fonction cardiovasculaire altérée. La prise de poids peut imposer d’ajuster les antidiabétiques. Un angio-œdème impose l’arrêt immédiat. L’arrêt du traitement est progressif, sur plusieurs semaines à plusieurs mois.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">Information professionnelle suisse Lyrica®, mise à jour juillet 2026, via AmiKo</a>.</p></template>
<template data-pop="g64-duloxetine" data-title="Duloxétine : indication limitée">
<div class="lab">Source</div><p>Information professionnelle suisse Duloxetin-Mepha®, mise à jour de décembre 2024, consultée via <button class="w" data-k="g64-pregabaline">AmiKo</button> le 16.10.2026.</p>
<div class="lab">Contenu</div><p>Indication : douleur neuropathique diabétique. Dose : 60 mg une fois par jour. Il n’y a pas de bénéfice supplémentaire au-delà de 60 mg, et la tolérance est moins bonne. La <button class="w" data-k="g64-duloxetine">TA</button> augmente en moyenne de 1 à 2 mmHg et des crises hypertensives sont décrites : surveillance. Contre-indications : inhibiteurs irréversibles de la monoamine oxydase, insuffisance hépatique, inhibiteurs du <button class="w" data-k="g64-duloxetine">CYP1A2</button> (fluvoxamine, ciprofloxacine, énoxacine), clairance de la créatinine inférieure à 30 ml/min, hypertension non équilibrée. Précautions : saignements, hyponatrémie du sujet âgé, idées suicidaires ; la prise simultanée pour plusieurs indications est à éviter. L’efficacité se juge après deux mois.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680660980053" target="_blank" rel="noopener">Information professionnelle suisse Duloxetin-Mepha®, mise à jour décembre 2024, via AmiKo</a>.</p></template>
<template data-pop="g64-immunosupp" data-title="Immunosuppression de la vascularite non systémique">
<div class="lab">Recommandations</div><p>Première ligne : corticothérapie seule, au moins six mois. Association si évolution rapide ou progression sous corticoïdes. Cyclophosphamide en bolus intraveineux pour les formes sévères. L’azathioprine ou le méthotrexate figurent parmi les autres immunosuppresseurs. Entretien de 18 à 24 mois après rémission sous association.</p>
<div class="lab">Limite</div><p>Il s’agit de bonnes pratiques de classes II et III, issues d’une guideline de 2010.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Collins et al., guideline PNS, neuropathie vascularitique non systémique, 2010 (résumé)</a>.</p></template>
<template data-pop="pareto-g64-definition" data-title="Pareto — Définition et profils">
<p class="ratio" data-cover="g64-0,g64-1,g64-2"></p><ul><li>G64 est un code résiduel sans sous-code, utilisé quand aucune catégorie plus précise ne convient ; une polyneuropathie reconnue de cause inconnue se code G62.9.</li><li>Les polyneuropathies touchent 5 à 8 % selon l’âge.</li><li>Deux tris orientent : la distribution (symétrique distale, radiculaire, multifocale) et l’évolution (quatre semaines, huit semaines, années).</li><li>La neuropathie des petites fibres échappe à l’<button class="w" data-k="g64-neurographie">ENG</button> standard.</li></ul></template>
<template data-pop="pareto-g64-causes" data-title="Pareto — Fréquence et causes">
<p class="ratio" data-cover="g64-3"></p><ul><li>Le diabète est la première cause en Europe ; l’alcool, la chimiothérapie, les carences et les toxiques suivent.</li><li>Jusqu’à 30 % des polyneuropathies restent indéterminées, souvent de bon pronostic.</li><li>Le <button class="w" data-k="g64-sgb">SGB</button> touche 1 à 2 personnes pour 100 000 par an.</li><li>La carence en <button class="w" data-k="g64-biologie">B12</button> existe sans anémie macrocytaire.</li></ul></template>
<template data-pop="pareto-g64-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g64-4"></p><ul><li>Trois mécanismes : axonal ou démyélinisant, ischémique (vascularite), excitabilité nociceptive (canaux <button class="w" data-k="g64-nav">Nav</button>).</li><li>La vascularite est asymétrique, multifocale, douloureuse, sans démyélinisation.</li><li>La physiologie normale du nerf n’est pas sourcée dans le dossier.</li></ul></template>
<template data-pop="pareto-g64-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g64-5,g64-6"></p><ul><li>L’interrogatoire cherche toxiques, médicaments, alcool, diabète, infection récente, chirurgie, antécédents familiaux.</li><li>Aréflexie distale plus hypopallesthésie ou hypoalgésie à la piqûre : signe sensible et spécifique.</li></ul></template>
<template data-pop="pareto-g64-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g64-7"></p><ul><li>Sept étapes, du moins au plus invasif.</li><li>La biopsie nerveuse est le dernier recours.</li><li>Une neurographie normale n’écarte pas les petites fibres.</li></ul></template>
<template data-pop="pareto-g64-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g64-8"></p><ul><li>Paralysie ascendante après infection : <button class="w" data-k="g64-sgb">SGB</button> très probable.</li><li>Atteinte multifocale progressive : vascularite.</li><li>Paraprotéine avec organomégalie, endocrinopathie, lésions cutanées : <button class="w" data-k="g64-poems">POEMS</button>.</li><li>Neuropathie rapidement progressive avec dysautonomie, cardiopathie ou canal carpien bilatéral : amylose à transthyrétine.</li><li>Neuropathie sévère sans cause : centre spécialisé.</li><li>Syndrome de Guillain-Barré : hospitalisation rapide, souvent en soins intensifs.</li></ul></template>
<template data-pop="pareto-g64-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g64-9"></p><ul><li>Traiter la cause d’abord : éviction du toxique, correction des carences, équilibre glycémique.</li><li>Douleur : tricycliques, ligands α2δ ou <button class="w" data-k="g64-neupsig">IRSN</button> en première ligne.</li><li>Entraînement physique, physiothérapie et ergothérapie complètent.</li></ul></template>
<template data-pop="pareto-g64-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g64-10,g64-11"></p><ul><li>Forme cryptogénique : bon pronostic ; contrôle après six mois à un an, plus tôt si l’atteinte est inhabituelle, sévère ou rapide.</li><li>Biopsies cutanées sériées : utiles pour suivre les petites fibres (niveau C).</li><li>Chimiothérapie : activité physique supervisée de 8 à 12 semaines.</li><li>Postopératoire : positionnement préventif, physiothérapie.</li></ul></template>
<template data-pop="pareto-g64-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="g64-e-1,g64-e-2,g64-e-3,g64-e-4,g64-e-5,g64-e-6"></p><ul><li>Une question, un examen.</li><li>Biologie de base, puis neurographie et <button class="w" data-k="g64-neurographie">EMG</button>, puis examens ciblés.</li><li>Biopsie cutanée de 3 mm : 0,19 % d’effets non graves.</li><li>Vascularite certaine : inflammation pariétale et lésion vasculaire.</li></ul></template>
<template data-pop="pareto-g64-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g64-s-anat-cours"></p><ul><li>Fibres Aδ et C : petites fibres.</li><li>Vasa nervorum : vaisseaux du nerf, cible de la vascularite.</li></ul></template>
<template data-pop="pareto-g64-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g64-s-histo-cours"></p><ul><li>Biopsie nerveuse : démyélinisation, axone, infiltrats, amylose.</li><li>Biopsie cutanée : densité des fibres intraépidermiques.</li></ul></template>
<template data-pop="pareto-g64-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g64-s-physio-cours"></p><ul><li>Gain de fonction <button class="w" data-k="g64-nav">Nav</button>1.7 à 1.9 : hyperexcitabilité des nocicepteurs.</li><li>Ischémie nerveuse dans la vascularite.</li></ul></template>
<template data-pop="pareto-g64-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g64-s-bioch-cours"></p><ul><li><button class="w" data-k="g64-biologie">B12</button> et B6 : carence et excès sont neuropathiques.</li><li><button class="w" data-k="g64-paraproteine">IgM</button> anti-<button class="w" data-k="g64-dysimmun">GM1</button> dans la neuropathie motrice multifocale.</li></ul></template>
<template data-pop="pareto-g64-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g64-p-1,g64-p-2,g64-p-3,g64-p-4,g64-p-5,g64-p-6,g64-p-7"></p><ul><li>Aucun traitement n’est spécifique de G64.</li><li>Première ligne forte : tricycliques, ligands α2δ, <button class="w" data-k="g64-neupsig">IRSN</button>.</li><li>Prégabaline : la clairance de la créatinine fixe la dose ; 150 mg par jour au départ (600 au maximum) si <button class="w" data-k="g64-pregabaline">Clcr</button> d’au moins 60 ml/min, 75 mg par jour (300 au maximum) entre 30 et 60 ml/min, à ne pas utiliser au-dessous de 30 ml/min.</li><li>Duloxétine : indication limitée à la neuropathie diabétique ; contre-indiquée avec les inhibiteurs du <button class="w" data-k="g64-duloxetine">CYP1A2</button> et en insuffisance hépatique.</li><li>Amitriptyline : indiquée dans les douleurs neuropathiques de l’adulte, 10 à 25 mg le soir au départ ; contre-indications cardiaques. Gabapentine : neuropathie diabétique ou névralgie postherpétique seulement.</li><li>Vascularite non systémique : corticoïdes au moins six mois.</li></ul></template>
<template data-pop="pareto-g64-gen" data-title="Pareto — Génétique">
<p class="ratio" data-cover="g64-s-gen-cours"></p><ul><li>Duplication de <button class="w" data-k="g64-genetique">PMP22</button> : Charcot-Marie-Tooth de type 1A ; délétion : neuropathie avec hypersensibilité à la pression.</li><li>Début précoce, antécédent familial, pied creux : analyse génétique, duplication de <button class="w" data-k="g64-genetique">PMP22</button> d’abord.</li><li>Amylose à transthyrétine : dysautonomie, cardiomyopathie, canal carpien bilatéral, début possible après 60 ans.</li><li><button class="w" data-k="g64-genetique">RFC1</button> : cause d’une part importante des polyneuropathies axonales idiopathiques chroniques.</li></ul></template>
<template data-pop="g64-sm-paresth" data-title="Fourmillements et engourdissement">
<div class="lab">Définition</div><p>Les paresthésies sont des sensations anormales sans stimulus (fourmillements, picotements) ; l’hypoesthésie est une diminution de la sensibilité au contact.</p>
<div class="lab">Mécanisme</div><p>La polyneuropathie la plus fréquente résulte d’un processus axonal longueur-dépendant qui commence aux jambes. Les fibres les plus longues, celles des pieds, sont donc touchées en premier.</p>
<div class="lab">Caractérisation</div><p>Le médecin demande le site de début, la symétrie, la vitesse d’extension et le moment de la journée. Il note si la plainte remonte en chaussettes puis atteint les mains.</p>
<div class="lab">Valeur et piège</div><p>Les sources lues ne chiffrent pas la valeur de ce symptôme. Un début aux bras oriente vers une autre cause que le diabète ou l’alcool.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, § 3.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-sm-douleur" data-title="Douleur neuropathique : brûlures et allodynie">
<div class="lab">Définition</div><p>L’allodynie est une douleur provoquée par un contact normalement indolore, par exemple celui des vêtements.</p>
<div class="lab">Mécanisme</div><p>Elle traduit l’atteinte des petites fibres Aδ et C ; certains variants des canaux sodiques Nav1.7 à 1.9 rendent les nocicepteurs hyperexcitables.</p>
<div class="lab">Valeur</div><p>Environ la moitié des polyneuropathies sont douloureuses.</p>
<div class="lab">Piège</div><p>La douleur domine la neuropathie des petites fibres, dont l’électroneurographie est normale.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, § 3.1</a> ; <a href="https://doi.org/10.1111/jns.12298" target="_blank" rel="noopener" data-reference-source="1">Sopacua et al., J Peripher Nerv Syst 2019 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Dtsch Arztebl Int 2018</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.779.803" target="_blank" rel="noopener" data-reference-source="1">Théaudin et al., Rev Med Suisse 2022 (résumé)</a>.</p></template>
<template data-pop="g64-sm-ataxie" data-title="Instabilité à la marche dans l’obscurité">
<div class="lab">Définition</div><p>Le patient se sent instable debout ou à la marche, surtout dans le noir.</p>
<div class="lab">Mécanisme</div><p>L’atteinte des grosses fibres altère le sens de position. Le fait que la vue compense ce déficit le jour est une déduction pédagogique, non une phrase des sources lues.</p>
<div class="lab">Technique</div><p>Test de Romberg, marche en ligne et marche les yeux fermés.</p>
<div class="lab">Piège</div><p>Une chute inexpliquée chez la personne âgée peut révéler la polyneuropathie, par trouble de la marche ou par intolérance orthostatique.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, § 3.1 et § 3.6.2</a>.</p></template>
<template data-pop="g64-sm-faiblesse" data-title="Faiblesse distale ou proximale">
<div class="lab">Caractérisation</div><p>Des trébuchements fréquents suggèrent une faiblesse distale ; une difficulté à monter les escaliers ou à se relever d’un siège bas suggère une faiblesse proximale.</p>
<div class="lab">Technique</div><p>Marche sur les talons et les pointes, lever d’une chaise et de l’accroupissement ; recherche d’une faiblesse de l’écartement des orteils et d’une atrophie du court extenseur des orteils, signes précoces.</p>
<div class="lab">Piège</div><p>Une atteinte surtout motrice fait discuter une myopathie, une maladie de la corne antérieure ou un trouble de la jonction neuromusculaire.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, § 3.1</a>.</p></template>
<template data-pop="g64-sm-autonome" data-title="Plaintes autonomes">
<div class="lab">Questions</div><p>Le médecin demande syncopes, intolérance orthostatique, troubles vésicaux ou intestinaux, intolérance à la chaleur, troubles de la sudation et dysfonction érectile.</p>
<div class="lab">Technique</div><p>Pupilles, sécheresse cutanée et test de Schellong couché puis debout. Le seuil de positivité n’a pas été lu pour cette leçon.</p>
<div class="lab">Orientation</div><p>Une dysautonomie marquée oriente vers l’amylose, le diabète, le syndrome de Guillain-Barré, le syndrome de Sjögren ou une cause paranéoplasique.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, § 3.1 et tableau 1</a>.</p></template>
<template data-pop="g64-sm-plaie" data-title="Plaies indolores des pieds">
<div class="lab">Définition</div><p>Une plaie que le patient ne sent pas, souvent découverte tardivement.</p>
<div class="lab">Mécanisme</div><p>La perte de la sensibilité douloureuse et les troubles trophiques de la dénervation autonome (œdème, ulcère, ostéoarthropathie) y contribuent.</p>
<div class="lab">Conduite</div><p>Le médecin inspecte les pieds à chaque consultation ; chez le diabétique, les soins des pieds font partie de la prise en charge.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, § 3.1 et tableau 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-sm-achilleen" data-title="Réflexe achilléen : valeur chiffrée">
<div class="lab">Normal</div><p>Le réflexe est présent et symétrique.</p>
<div class="lab">Pathologique</div><p>Dans la polyneuropathie, les réflexes s’affaiblissent puis disparaissent, en règle d’abord au tendon d’Achille.</p>
<div class="lab">Valeur</div><p>Chez des patients adressés pour neurophysiologie, l’abolition bilatérale prédit une électroneurographie anormale : sensibilité 72 %, spécificité 91 %, rapport de vraisemblance positif 7,6, négatif 0,3 ; kappa entre examinateurs 0,6, soit un accord modeste.</p>
<div class="lab">Limite</div><p>Étude australienne lue en résumé, population sélectionnée ; aucune source suisse ou européenne lue ne chiffre ce signe.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, § 3.1</a> ; <a href="https://doi.org/10.1111/imj.15079" target="_blank" rel="noopener" data-reference-source="1">Chew et al., Intern Med J 2022 (résumé)</a>.</p></template>
<template data-pop="g64-sm-diapason" data-title="Pallesthésie au diapason">
<div class="lab">Technique</div><p>Le diapason gradué de Rydel-Seiffer est posé sur le dos de l’articulation interphalangienne du gros orteil.</p>
<div class="lab">Mécanisme</div><p>La vibration est portée par les grosses fibres.</p>
<div class="lab">Valeur et limite</div><p>Associée à l’aréflexie distale, l’hypopallesthésie forme un signe sensible et spécifique. Le seuil normal selon l’âge n’a pas été lu pour cette leçon.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.diabres.2015.02.026" target="_blank" rel="noopener" data-reference-source="1">de Simone et al., Diabetes Res Clin Pract 2015 (résumé)</a> ; <a href="https://register.awmf.org/assets/guidelines/030-067l_S1_Diagnostik-Polyneuropathien_2025-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Heuß et al., guideline de la Société allemande de neurologie, 2025, § 3.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Dtsch Arztebl Int 2018</a>.</p></template>
