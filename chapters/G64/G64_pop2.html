<template data-pop="g64-biopsie-cutanee" data-title="Biopsie cutanée des petites fibres (EFNS/PNS 2010)">
<div class="lab">Technique</div><p>Guideline de l’<button class="w" data-k="g64-biopsie-cutanee">EFNS</button>, devenue l’<button class="w" data-k="g64-biopsie-cutanee">EAN</button>. Biopsie de 3 mm à la jambe distale ; densité linéaire des fibres intraépidermiques selon des règles de comptage standardisées ; comparaison à des normes appariées pour l’âge.</p>
<div class="lab">Niveaux de preuve</div><p>Technique fiable pour diagnostiquer la neuropathie des petites fibres (niveau A) ; normes appariées pour l’âge (niveau A) ; densité réduite associée au risque de douleur neuropathique, non à son intensité (niveau B) ; biopsies sériées utiles pour suivre la progression (niveau C).</p>
<div class="lab">Sécurité et limite</div><p>Environ 35 000 biopsies sans effet grave, 0,19 % d’effets non graves. La biopsie n’identifie pas l’étiologie.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03023.x" target="_blank" rel="noopener">Lauria et al., guideline EFNS/PNS, biopsie cutanée, Eur J Neurol 2010 (résumé)</a>.</p></template>
<template data-pop="g64-genetique" data-title="Génétique">
<div class="lab">Contenu</div><p>Étape 7 de la démarche : analyse de <button class="w" data-k="g64-genetique">PMP22</button>, <button class="w" data-k="g64-genetique">GJB1</button>, <button class="w" data-k="g64-genetique">MPZ</button>, <button class="w" data-k="g64-genetique">MFN2</button>, par panel ou par exome ou génome.</p>
<div class="lab">Limite</div><p>Le dossier ne précise ni les indications fines ni les maladies associées à chaque gène.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-poems" data-title="Syndrome POEMS">
<div class="lab">Définition</div><p>Association d’une polyneuropathie, d’une paraprotéine monoclonale, d’une organomégalie, d’une endocrinopathie et de lésions cutanées ou ostéosclérotiques.</p>
<div class="lab">Application</div><p>Une paraprotéine avec organomégalie, endocrinopathie, lésions cutanées ou ostéosclérotiques est un drapeau rouge : avis spécialisé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-paraproteine" data-title="Paraprotéines et neuropathie">
<div class="lab">Définition</div><p>Une paraprotéine est souvent découverte fortuitement et n’explique pas la neuropathie.</p>
<div class="lab">Exceptions</div><p>Neuropathie à <button class="w" data-k="g64-paraproteine">IgM</button> avec anticorps anti-<button class="w" data-k="g64-paraproteine">MAG</button> ; <button class="w" data-k="g64-poems">POEMS</button> ; amylose. Des <button class="w" data-k="g64-paraproteine">IgM</button> élevées font évoquer une maladie de Waldenström ; des <button class="w" data-k="g64-paraproteine">IgG</button> avec amylose font évoquer une amylose.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-dysimmun" data-title="Causes dysimmunitaires">
<div class="lab">Fréquence</div><p><button class="w" data-k="g64-sgb">SGB</button> : 1 à 2 pour 100 000 par an. <button class="w" data-k="g64-pidc">PIDC</button> : 2 à 3 pour 100 000. Neuropathie motrice multifocale : 0,6 à 2 pour 100 000, avec blocs de conduction multifocaux, <button class="w" data-k="g64-paraproteine">IgM</button> anti-<button class="w" data-k="g64-dysimmun">GM1</button> chez environ la moitié des patients et prédominance masculine.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-nav" data-title="Canaux sodiques Nav1.7, 1.8 et 1.9">
<div class="lab">Définition</div><p>Les variants à gain de fonction des canaux sodiques voltage-dépendants <button class="w" data-k="g64-nav">Nav</button>1.7, 1.8 et 1.9 sont associés à la neuropathie des petites fibres.</p>
<div class="lab">Mécanisme</div><p>Ces variants provoquent une hyperexcitabilité nociceptive, dont dépend la douleur neuropathique. Le phénotype forme un continuum, avec ou sans dysautonomie.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/jns.12298" target="_blank" rel="noopener">Sopacua et al., Small-fiber neuropathy, J Peripher Nerv Syst 2019 (résumé)</a>.</p></template>
<template data-pop="g64-pregabaline" data-title="Prégabaline : posologie et sécurité">
<div class="lab">Source</div><p>Information professionnelle suisse Lyrica®, consultée via <button class="w" data-k="g64-pregabaline">AmiKo</button>, lecture partielle des rubriques indications, posologie, adaptation rénale et mises en garde.</p>
<div class="lab">Posologie</div><p>150 mg par jour en 2 ou 3 prises ; 300 mg après 3 à 7 jours ; maximum 600 mg après 7 jours de plus. <button class="w" data-k="g64-pregabaline">Clcr</button> de 30 à 60 ml/min : 75 à 300 mg par jour. <button class="w" data-k="g64-pregabaline">Clcr</button> inférieure à 30 ml/min : non recommandée selon la <button class="w" data-k="g64-pregabaline">FI</button>.</p>
<div class="lab">Sécurité</div><p>Arrêt progressif ; insuffisance cardiaque rapportée chez des sujets âgés à fonction cardiovasculaire altérée ; ajustement possible des antidiabétiques (prise de poids) ; angio-œdème : arrêt.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Lyrica® via AmiKo</a>.</p></template>
<template data-pop="g64-duloxetine" data-title="Duloxétine : indication limitée">
<div class="lab">Source</div><p>Information professionnelle suisse Duloxetin-Mepha®.</p>
<div class="lab">Contenu</div><p>Indication : douleur neuropathique diabétique. Dose : 60 mg une fois par jour. Pas de bénéfice supplémentaire au-delà de 60 mg, avec moins bonne tolérance. La <button class="w" data-k="g64-duloxetine">TA</button> augmente en moyenne de 1 à 2 mmHg et des crises hypertensives sont décrites : surveillance. Contre-indication : insuffisance rénale sévère. Éviter les doubles prescriptions.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Duloxetin-Mepha® via AmiKo</a>.</p></template>
<template data-pop="g64-immunosupp" data-title="Immunosuppression de la vascularite non systémique">
<div class="lab">Recommandations</div><p>Première ligne : corticothérapie seule, au moins six mois. Association si évolution rapide ou progression sous corticoïdes. Cyclophosphamide en bolus intraveineux pour les formes sévères. Azathioprine ou méthotrexate. Entretien de 18 à 24 mois après rémission sous association.</p>
<div class="lab">Limite</div><p>Bonnes pratiques de classes II et III, guideline de 2010.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Collins et al., guideline PNS, neuropathie vascularitique non systémique, 2010 (résumé)</a>.</p></template>
<template data-pop="pareto-g64-definition" data-title="Pareto — Définition et profils">
<p class="ratio" data-cover="g64-0,g64-1,g64-2"></p><ul><li>G64 est un code résiduel sans sous-code, utilisé quand aucune catégorie plus précise ne convient.</li><li>Les polyneuropathies touchent 5 à 8 % selon l’âge.</li><li>Deux tris orientent : la distribution (symétrique distale, radiculaire, multifocale) et l’évolution (quatre semaines, huit semaines, années).</li><li>La neuropathie des petites fibres échappe à l’<button class="w" data-k="g64-neurographie">ENG</button> standard.</li></ul></template>
<template data-pop="pareto-g64-causes" data-title="Pareto — Fréquence et causes">
<p class="ratio" data-cover="g64-3"></p><ul><li>Le diabète est la première cause en Europe ; l’alcool, la chimiothérapie, les carences et les toxiques suivent.</li><li>Jusqu’à 30 % des polyneuropathies restent indéterminées, souvent de bon pronostic.</li><li>Le <button class="w" data-k="g64-sgb">SGB</button> touche 1 à 2 personnes pour 100 000 par an.</li><li>La carence en <button class="w" data-k="g64-biologie">B12</button> existe sans anémie macrocytaire.</li></ul></template>
<template data-pop="pareto-g64-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g64-4"></p><ul><li>Trois mécanismes : axonal ou démyélinisant, ischémique (vascularite), excitabilité nociceptive (canaux <button class="w" data-k="g64-nav">Nav</button>).</li><li>La vascularite est asymétrique, multifocale, douloureuse, sans démyélinisation.</li><li>La physiologie normale du nerf n’est pas sourcée dans le dossier.</li></ul></template>
<template data-pop="pareto-g64-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g64-5,g64-6"></p><ul><li>L’interrogatoire cherche toxiques, médicaments, alcool, diabète, infection récente, chirurgie, antécédents familiaux.</li><li>Aréflexie distale plus hypopallesthésie ou hypoalgésie à la piqûre : signe sensible et spécifique.</li></ul></template>
<template data-pop="pareto-g64-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g64-7"></p><ul><li>Sept étapes, du moins au plus invasif.</li><li>La biopsie nerveuse est le dernier recours.</li><li>Une neurographie normale n’écarte pas les petites fibres.</li></ul></template>
<template data-pop="pareto-g64-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g64-8"></p><ul><li>Paralysie ascendante après infection : <button class="w" data-k="g64-sgb">SGB</button> très probable.</li><li>Atteinte multifocale progressive : vascularite.</li><li>Paraprotéine avec organomégalie, endocrinopathie, lésions cutanées : <button class="w" data-k="g64-poems">POEMS</button>.</li><li>Neuropathie sévère sans cause : centre spécialisé.</li></ul></template>
<template data-pop="pareto-g64-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g64-9"></p><ul><li>Traiter la cause d’abord : éviction du toxique, correction des carences, équilibre glycémique.</li><li>Douleur : tricycliques, ligands α2δ ou <button class="w" data-k="g64-neupsig">IRSN</button> en première ligne.</li><li>Entraînement physique, physiothérapie et ergothérapie complètent.</li></ul></template>
<template data-pop="pareto-g64-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g64-10,g64-11"></p><ul><li>Forme cryptogénique : bon pronostic.</li><li>Biopsies cutanées sériées : utiles pour suivre les petites fibres (niveau C).</li><li>Chimiothérapie : activité physique supervisée de 8 à 12 semaines.</li><li>Postopératoire : positionnement préventif, physiothérapie.</li></ul></template>
<template data-pop="pareto-g64-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="g64-e-1,g64-e-2,g64-e-3,g64-e-4,g64-e-5,g64-e-6"></p><ul><li>Une question, un examen.</li><li>Biologie de base, puis neurographie et <button class="w" data-k="g64-neurographie">EMG</button>, puis examens ciblés.</li><li>Biopsie cutanée de 3 mm : 0,19 % d’effets non graves.</li><li>Vascularite certaine : inflammation pariétale et lésion vasculaire.</li></ul></template>
<template data-pop="pareto-g64-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g64-s-anat-cours"></p><ul><li>Fibres Aδ et C : petites fibres.</li><li>Vasa nervorum : vaisseaux du nerf, cible de la vascularite.</li></ul></template>
<template data-pop="pareto-g64-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g64-s-histo-cours"></p><ul><li>Biopsie nerveuse : démyélinisation, axone, infiltrats, amylose.</li><li>Biopsie cutanée : densité des fibres intraépidermiques.</li></ul></template>
<template data-pop="pareto-g64-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g64-s-physio-cours"></p><ul><li>Gain de fonction <button class="w" data-k="g64-nav">Nav</button>1.7 à 1.9 : hyperexcitabilité des nocicepteurs.</li><li>Ischémie nerveuse dans la vascularite.</li></ul></template>
<template data-pop="pareto-g64-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g64-s-bioch-cours"></p><ul><li><button class="w" data-k="g64-biologie">B12</button> et B6 : carence et excès sont neuropathiques.</li><li><button class="w" data-k="g64-paraproteine">IgM</button> anti-<button class="w" data-k="g64-dysimmun">GM1</button> dans la neuropathie motrice multifocale.</li></ul></template>
<template data-pop="pareto-g64-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g64-p-1,g64-p-2,g64-p-3,g64-p-4,g64-p-5,g64-p-6"></p><ul><li>Aucun traitement n’est spécifique de G64.</li><li>Première ligne forte : tricycliques, ligands α2δ, <button class="w" data-k="g64-neupsig">IRSN</button>.</li><li>Prégabaline : 150 à 600 mg par jour, 75 à 300 mg si <button class="w" data-k="g64-pregabaline">Clcr</button> de 30 à 60 ml/min.</li><li>Duloxétine : indication limitée à la neuropathie diabétique.</li><li>Vascularite non systémique : corticoïdes au moins six mois.</li></ul></template>
