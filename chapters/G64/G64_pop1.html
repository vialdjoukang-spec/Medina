<template data-pop="g64-code" data-title="Le code G64 dans la CIM-10-GM 2024">
<div class="lab">Définition</div><p>G64 est la catégorie « Sonstige Krankheiten des peripheren Nervensystems » de la <button class="w" data-k="g64-code">CIM</button>-10-<button class="w" data-k="g64-code">GM</button> 2024. Son unique inclusion est « affection du système nerveux périphérique sans autre indication ». Elle n’a ni sous-catégorie ni exclusion propre.</p>
<div class="lab">Application</div><p>Le médecin la choisit quand l’atteinte périphérique est reconnue mais qu’aucune catégorie plus précise ne convient. Les exclusions du bloc G60–G64 sont la névralgie et la névrite sans autre indication (M79.2-), la névrite périphérique de la grossesse (O26.83) et la radiculite sans autre indication (M54.1-).</p>
<div class="lab">Sources</div><p>Le libellé allemand vient de l’institut allemand <button class="w" data-k="g64-code">BfArM</button> ; le libellé français vient du registre du dépôt, construit sur l’édition de l’<button class="w" data-k="g64-code">OFS</button>. Le document source de l’<button class="w" data-k="g64-code">OFS</button> n’a pas été rouvert.</p>
<div class="lab">Limite</div><p>La source officielle ne donne aucun critère diagnostique. La lecture « démarche devant une atteinte non étiquetée » est une déduction de structure. La revue principale de la leçon est celle du <button class="w" data-k="g64-code">Dtsch Arztebl</button> 2018.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g60-g64.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G60–G64</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français, entrée G64</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-sgb" data-title="Syndrome de Guillain-Barré : urgence à reconnaître">
<div class="lab">Définition</div><p>Le <button class="w" data-k="g64-sgb">SGB</button> est une neuropathie aiguë dysimmune dont le nadir est atteint en quatre semaines au plus. Il touche 1 à 2 personnes pour 100 000 par an.</p>
<div class="lab">Application</div><p>Une paralysie ascendante après une infection digestive ou respiratoire rend le <button class="w" data-k="g64-sgb">SGB</button> très probable. Le risque de troubles de la conduction cardiaque et d’insuffisance respiratoire impose une surveillance et une évaluation spécialisée urgente.</p>
<div class="lab">Limite</div><p>Le dossier ne contient pas le traitement du <button class="w" data-k="g64-sgb">SGB</button> ; la leçon n’en cite aucun.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-pidc" data-title="PIDC : polyradiculoneuropathie inflammatoire démyélinisante chronique">
<div class="lab">Définition</div><p>La <button class="w" data-k="g64-pidc">PIDC</button> est une neuropathie dysimmune dont l’évolution dépasse huit semaines. Le dossier cite 2 à 3 cas pour 100 000, sans préciser si le chiffre est une incidence ou une prévalence.</p>
<div class="lab">Application</div><p>La durée de huit semaines sépare la <button class="w" data-k="g64-pidc">PIDC</button> du <button class="w" data-k="g64-sgb">SGB</button>, dont le nadir est atteint en quatre semaines au plus. Le <button class="w" data-k="g64-lcr">LCR</button> contient typiquement moins de 10 leucocytes par microlitre et des protéines élevées, sans que ces critères soient obligatoires.</p>
<div class="lab">Traitement non médicamenteux</div><p>Un entraînement à l’ergomètre et en résistance, trois fois par semaine, améliore la forme et la force.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-petites-fibres" data-title="Neuropathie des petites fibres">
<div class="lab">Définition</div><p>La neuropathie des petites fibres atteint les fibres Aδ finement myélinisées et les fibres C amyélinisées. Elle est dominée par la douleur neuropathique et les symptômes dysautonomiques.</p>
<div class="lab">Application</div><p>Elle échappe à l’<button class="w" data-k="g64-neurographie">ENG</button> standard. Le diagnostic repose sur la densité des fibres nerveuses intraépidermiques en biopsie cutanée et sur les tests sensitifs quantitatifs (<button class="w" data-k="g64-petites-fibres">QST</button>). Les causes associées sont les maladies auto-immunes, les variants des canaux sodiques (<button class="w" data-k="g64-nav">Nav</button>1.7, 1.8, 1.9), le diabète et la carence en <button class="w" data-k="g64-biologie">B12</button> ; aucune cause n’est trouvée dans plus de la moitié des cas.</p>
<div class="lab">Limite</div><p>Les sources lues sont un résumé de revue (2019) et une guideline européenne de 2010.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/jns.12298" target="_blank" rel="noopener">Sopacua et al., Small-fiber neuropathy, J Peripher Nerv Syst 2019 (résumé)</a> ; <a href="https://doi.org/10.1111/j.1468-1331.2010.03023.x" target="_blank" rel="noopener">Lauria et al., guideline EFNS/PNS, biopsie cutanée, Eur J Neurol 2010 (résumé)</a>.</p></template>
<template data-pop="g64-neupsig" data-title="Méta-analyse NeuPSIG 2025">
<div class="lab">Définition</div><p>La méta-analyse <button class="w" data-k="g64-neupsig">NeuPSIG</button> (Soliman et al., Lancet Neurology 2025) agrège 313 essais sur la pharmacothérapie et la neuromodulation de la douleur neuropathique.</p>
<div class="lab">Résultats</div><p>Première ligne forte : antidépresseurs tricycliques (<button class="w" data-k="g64-neupsig">NNT</button> 4,6 ; <button class="w" data-k="g64-neupsig">NNH</button> 17,1), ligands α2δ (<button class="w" data-k="g64-neupsig">NNT</button> 8,9 ; <button class="w" data-k="g64-neupsig">NNH</button> 26,2) et <button class="w" data-k="g64-neupsig">IRSN</button> (<button class="w" data-k="g64-neupsig">NNT</button> 7,4 ; <button class="w" data-k="g64-neupsig">NNH</button> 13,9). Seconde ligne faible : capsaïcine 8 % (<button class="w" data-k="g64-neupsig">NNT</button> 13,2), capsaïcine crème, lidocaïne 5 % emplâtre. Toxine botulique A : recommandation faible.</p>
<div class="lab">Limite</div><p>Résumé seul lu. Les résultats valent pour la douleur neuropathique toute cause confondue, non pour G64 en particulier.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(25)00068-7" target="_blank" rel="noopener">Soliman et al., NeuPSIG, Lancet Neurol 2025 (résumé)</a>.</p></template>
<template data-pop="g64-vasc-criteres" data-title="Vascularite nerveuse : critères PNS 2010">
<div class="lab">Définition</div><p>Selon la guideline <button class="w" data-k="g64-vasc-criteres">PNS</button> 2010, la vascularite nerveuse est <b>certaine</b> si la biopsie montre une inflammation de la paroi vasculaire et une lésion du vaisseau. Elle est <b>probable</b> si cinq prédicteurs sont réunis : dépôts vasculaires d’<button class="w" data-k="g64-paraproteine">IgM</button>, de C3 ou de fibrinogène en immunofluorescence directe, dépôts d’hémosidérine, perte asymétrique de fibres, dégénérescence axonale active marquée, nécrose ou régénération ou infarctus du muscle court fibulaire.</p>
<div class="lab">Systémique ou non</div><p>Cinq éléments appuient une vascularite <b>systémique</b> : atteinte d’autres organes, <button class="w" data-k="g64-vasc-criteres">ANCA</button>, cryoglobulines, <button class="w" data-k="g64-vasc-criteres">VS</button> de 100 mm/h ou plus, condition ou médicament prédisposant.</p>
<div class="lab">Limite</div><p>Guideline de 2010, résumé exécutif lu seul, niveau de preuve de classes II et III.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Collins et al., guideline PNS, neuropathie vascularitique non systémique, 2010 (résumé)</a>.</p></template>
<template data-pop="g64-biologie" data-title="Biologie de base et élargie">
<div class="lab">Base</div><p><button class="w" data-k="g64-biologie">CRP</button>, formule sanguine, électrolytes, fonctions hépatique et rénale, électrophorèse et immunofixation des protéines, protéines de Bence Jones, <button class="w" data-k="g64-biologie">TSH</button>, <button class="w" data-k="g64-biologie">HbA1c</button>, <button class="w" data-k="g64-biologie">CDT</button>, vitamine <button class="w" data-k="g64-biologie">B12</button>.</p>
<div class="lab">Élargie, orientée</div><p>Holotranscobalamine ; vitamines B1, B6, E ; <button class="w" data-k="g64-biologie">ANA</button>, p-<button class="w" data-k="g64-vasc-criteres">ANCA</button>, c-<button class="w" data-k="g64-vasc-criteres">ANCA</button> ; cryoglobulines ; sérologies des hépatites, du <button class="w" data-k="g64-biologie">VIH</button> et de Borrelia ; <button class="w" data-k="g64-paraproteine">IgM</button> anti-<button class="w" data-k="g64-dysimmun">GM1</button>, anti-<button class="w" data-k="g64-biologie">GQ1b</button>, anti-<button class="w" data-k="g64-paraproteine">MAG</button>.</p>
<div class="lab">Limite</div><p>Le dossier ne donne pas de seuils. Les intervalles de référence viennent du laboratoire. L’interprétation de la <button class="w" data-k="g64-biologie">CDT</button> n’est pas détaillée dans la source.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-lcr" data-title="Liquide céphalorachidien">
<div class="lab">Indication</div><p>Le <button class="w" data-k="g64-lcr">LCR</button> est analysé, avec sérologies, quand une cause inflammatoire est suspectée.</p>
<div class="lab">Interprétation</div><p>Dans la <button class="w" data-k="g64-pidc">PIDC</button>, la revue allemande décrit moins de 10 leucocytes par microlitre et des protéines élevées. Ces critères ne sont pas obligatoires.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-neurographie" data-title="Neurographie et EMG">
<div class="lab">Rôle</div><p>La neurographie (électroneurographie, <button class="w" data-k="g64-neurographie">ENG</button>) et l’<button class="w" data-k="g64-neurographie">EMG</button> distinguent l’atteinte axonale de l’atteinte démyélinisante. Des potentiels évoqués peuvent s’y ajouter.</p>
<div class="lab">Limite</div><p>L’<button class="w" data-k="g64-neurographie">ENG</button> standard ne détecte pas la neuropathie des petites fibres : un résultat normal n’écarte pas ce diagnostic. Aucune valeur chiffrée de conduction n’est donnée dans le dossier.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a> ; <a href="https://doi.org/10.1111/jns.12298" target="_blank" rel="noopener">Sopacua et al., Small-fiber neuropathy, J Peripher Nerv Syst 2019 (résumé)</a>.</p></template>
<template data-pop="g64-imagerie" data-title="Échographie nerveuse et neurographie par IRM">
<div class="lab">Rôle</div><p>Étape 4 de la démarche de la revue allemande de 2018 : l’échographie nerveuse et la neurographie par <button class="w" data-k="g64-imagerie">IRM</button> complètent la localisation de l’atteinte.</p>
<div class="lab">Limite</div><p>Le dossier ne chiffre ni sensibilité ni critère d’interprétation.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a>.</p></template>
<template data-pop="g64-biopsie-nerf" data-title="Biopsie nerveuse">
<div class="lab">Indication</div><p>Neuropathie modérée à sévère, progressive, sans diagnostic obtenu par des méthodes moins invasives.</p>
<div class="lab">Apport</div><p>Elle sépare atteinte démyélinisante et axonale, montre des infiltrats inflammatoires ou une amylose. La biopsie combinée du nerf, du muscle et de la peau améliore le rendement dans la vascularite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et al., Polyneuropathies, Dtsch Arztebl Int 2018</a> ; <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Collins et al., guideline PNS, neuropathie vascularitique non systémique, 2010 (résumé)</a>.</p></template>
