<template data-pop="pareto-r02-notions" data-title="Pareto — Notions et causes"><p class="ratio" data-cover="r02-0,r02-1,r02-2,r02-3"></p><ul>
<li>La gangrène sèche est une ischémie sans infection, avec un sillon net ; la gangrène humide est une surinfection ; la gangrène gazeuse est due à la toxine clostridienne.</li>
<li>R02 seulement si la cause n’est pas codée ailleurs.</li>
<li>Causes : ischémie chronique, ischémie aiguë, vasopresseurs, purpura fulminans, TIH, calciphylaxie.</li>
<li>Le débridement aggrave le pyoderma gangrenosum.</li></ul></template>
<template data-pop="pareto-r02-pec" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="r02-4,r02-5"></p><ul>
<li>Une douleur disproportionnée, des bulles et une crépitation imposent une chirurgie immédiate.</li>
<li>L’ordre est l’infection, puis la perfusion, puis l’amputation.</li>
<li>La gangrène humide impose un drainage le jour même (GVG 2019, 6.7), puis la stadification WIfI et la revascularisation.</li></ul></template>
<template data-pop="pareto-r02-crit" data-title="Pareto — Critères"><p class="ratio" data-cover="r02-6,r02-7"></p><ul>
<li>L’IWGDF/IDSA 2023 classe l’infection en grades 1 à 4 sur un diagnostic clinique, avec le suffixe (O) pour l’ostéite.</li>
<li>CLTI : index &lt; 0,4, cheville &lt; 50, orteil &lt; 30, TcPO₂ &lt; 30 mmHg.</li></ul></template>
<template data-pop="pareto-r02-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="r02-e-1"></p><ul>
<li>Chez le diabétique ou le dialysé, le médecin mesure la pression d’orteil et analyse les ondes Doppler, car les artères calcifiées faussent l’index de cheville.</li>
<li>Le gaz apparaît tardivement à la radiographie ; il ne faut donc pas différer la chirurgie.</li>
<li>Prélèvements profonds seulement.</li></ul></template>
<template data-pop="pareto-r02-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="r02-p-1,r02-p-2"></p><ul>
<li>L’amoxicilline-clavulanate est le choix de base ; la pipéracilline-tazobactam s’impose si un Gram négatif résistant est suspecté.</li>
<li>La myonécrose se traite par pénicilline et clindamycine, cette dernière bloquant la toxine.</li>
<li>Le médecin ne débute pas d’inhibiteur du SGLT2 chez un patient porteur d’une plaie (IWGDF 2023).</li></ul></template>
