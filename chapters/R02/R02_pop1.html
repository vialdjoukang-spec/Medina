<!-- ===== FENÊTRES R02 : notions fondamentales, définitions, classifications ===== -->
<template data-pop="r02-necrose" data-title="Nécrose de coagulation et nécrose de liquéfaction">
<div class="lab">Définition</div><p>La nécrose est la mort d’un ensemble de cellules dans un tissu vivant, avec perte de l’intégrité membranaire et réaction inflammatoire autour. La nécrose de coagulation conserve l’architecture du tissu, parce que l’acidose intracellulaire dénature à la fois les protéines de structure et les enzymes qui les digéreraient. La nécrose de liquéfaction détruit l’architecture, parce que des enzymes, bactériennes ou libérées par les polynucléaires, digèrent le tissu mort.</p>
<div class="lab">Application à la gangrène</div><p>La gangrène sèche est une nécrose de coagulation étendue, déshydratée au contact de l’air. La gangrène humide associe une nécrose de coagulation à une liquéfaction surajoutée par l’infection. Le passage de l’une à l’autre se voit à l’œil nu : le tissu noir et dur devient mou, suintant et malodorant.</p>
<div class="lab">Conséquence pratique</div><p>Une nécrose de coagulation sèche et limitée peut attendre la revascularisation. Une liquéfaction impose l’excision, parce qu’elle s’étend dans les tissus vivants voisins.</p>
</template>

<template data-pop="r02-do2" data-title="Apport tissulaire en oxygène">
<div class="lab">Définition</div><p>L’apport en oxygène d’un tissu est le produit du débit sanguin qui le traverse par le contenu artériel en oxygène. Le contenu artériel vaut environ 1,34 × hémoglobine (g/dL) × saturation + 0,003 × pression partielle artérielle en oxygène (mmHg), en millilitres d’oxygène par décilitre de sang.</p>
<div class="lab">Exemple chiffré</div><p>Avec 14 g/dL d’hémoglobine et une saturation de 98 %, le contenu atteint environ 18,4 mL/dL. Si le débit du pied est divisé par deux par une sténose et que l’hémoglobine tombe à 9 g/dL, l’apport baisse d’environ deux tiers, alors que la plaie infectée consomme davantage.</p>
<div class="lab">Conséquence pratique</div><p>La nécrose survient quand l’apport reste inférieur à la consommation. Le débit est la variable la plus déterminante, d’où la revascularisation ; corriger une anémie sévère, une hypoxémie ou un œdème réduit l’écart sans le combler.</p>
</template>

<template data-pop="r02-medialcalc" data-title="Calcification de la média (artère incompressible)">
<div class="lab">Définition</div><p>La calcification de la média, ou médiacalcose, dépose des cristaux de phosphate de calcium dans la couche musculaire de la paroi artérielle. Elle diffère de la plaque d’athérome, qui siège dans l’intima et rétrécit la lumière. Elle est fréquente dans le diabète ancien et l’insuffisance rénale chronique, en particulier chez le dialysé.</p>
<div class="lab">Mécanisme de l’erreur de mesure</div><p>Un brassard mesure la pression qu’il faut appliquer pour écraser l’artère et interrompre le flux. Lorsque la paroi est rigide, il faut ajouter la pression nécessaire pour vaincre la rigidité : la pression mesurée dépasse la pression réelle. L’index de pression cheville-bras devient faussement normal ou supérieur à 1,40.</p>
<div class="lab">Conséquence pratique</div><p>Chez le diabétique et le dialysé, la pression d’orteil, l’index orteil-bras, la pression transcutanée en oxygène et l’analyse des ondes Doppler remplacent ou complètent l’index de cheville. Les GVG 2019 font de la pression d’orteil la mesure préférée chez ces patients.</p>
</template>

<template data-pop="r02-seche" data-title="Gangrène sèche">
<div class="lab">Définition</div><p>La gangrène sèche est une nécrose ischémique non infectée, qui se déshydrate et se momifie. Le segment atteint est noir, dur, froid, insensible et ratatiné ; il ne sent pas et n’est pas entouré d’œdème.</p>
<div class="lab">Mécanisme</div><p>La perfusion insuffisante tue les cellules lentement, sans porte d’entrée bactérienne. Le tissu mort perd son eau par évaporation. À sa limite, le tissu vivant forme un sillon de délimitation inflammatoire.</p>
<div class="lab">Évolution et conduite</div><p>La nécrose peut se détacher spontanément en plusieurs semaines : c’est l’autoamputation. Le médecin la garde sèche, la protège des appuis, n’y applique pas de pansement humide, ne prescrit pas d’antibiotique en l’absence d’infection et organise le bilan vasculaire. Toute rougeur, tout œdème ou toute odeur signale une transformation en gangrène humide.</p>
<div class="lab">Piège</div><p>Un pansement occlusif humide ou un bain de pied macère la nécrose et favorise la surinfection.</p>
</template>

<template data-pop="r02-humide" data-title="Gangrène humide">
<div class="lab">Définition</div><p>La gangrène humide est une nécrose surinfectée par une flore le plus souvent polymicrobienne, qui la liquéfie. Le tissu est tuméfié, mou, suintant, malodorant, entouré d’un érythème et d’un œdème qui s’étendent.</p>
<div class="lab">Mécanisme</div><p>Les bactéries prolifèrent dans le tissu mort, inaccessible aux défenses et aux antibiotiques. L’infection gagne le tissu vivant, augmente sa consommation d’oxygène, provoque un œdème et des thromboses des petits vaisseaux, ce qui étend la nécrose.</p>
<div class="lab">Conduite</div><p>Le médecin prélève des hémocultures en cas de fièvre ou de sepsis, débute un antibiotique intraveineux et demande un avis chirurgical urgent pour drainer, exciser et amputer si nécessaire. Les GVG 2019 recommandent ce drainage urgent avant la décision de revascularisation, puis une restadification du membre.</p>
<figure><img src="images/cardiologie/r02_gangrene_humide_pied.gif" alt="Gangrène humide du pied" width="420" height="530" loading="lazy" decoding="async"><figcaption>Gangrène humide : tissu tuméfié et suintant, sans limite nette, car l’infection progresse. علاء, Wikimedia Commons, CC BY-SA 3.0.</figcaption></figure></template>

<template data-pop="r02-gazeuse" data-title="Gangrène gazeuse (myonécrose clostridienne)">
<div class="lab">Définition</div><p>La gangrène gazeuse est une infection du muscle par des clostridies, surtout <i>Clostridium perfringens</i>, qui détruit un muscle jusque-là sain par l’action de toxines. Elle est codée A48.0 dans la CIM-10-GM, et non R02.</p>
<div class="lab">Contextes</div><p>La forme post-traumatique suit une plaie profonde, contuse ou souillée, une fracture ouverte ou une chirurgie digestive. La forme spontanée, due à <i>Clostridium septicum</i>, survient sans plaie chez un patient porteur d’un cancer colique ou neutropénique.</p>
<div class="lab">Signes</div><p>La douleur est intense et disproportionnée. La peau, d’abord pâle et œdémateuse, devient bronzée ou violacée, avec des bulles hémorragiques, une sérosité brunâtre et une crépitation. La tachycardie précède le choc, l’hémolyse et l’insuffisance rénale.</p>
<div class="lab">Conduite</div><p>Le chirurgien explore et excise immédiatement, puis répète l’excision tant que la nécrose progresse. L’antibiotique est d’abord empirique et large (vancomycine et pipéracilline-tazobactam, ampicilline-sulbactam ou carbapénème) ; l’association pénicilline et clindamycine le remplace lorsque la clostridie est documentée. Le patient est réanimé. L’IDSA 2014 recommande une exploration chirurgicale urgente et un débridement des tissus atteints.</p>
</template>

<template data-pop="r02-codage" data-title="Codage CIM-10-GM 2024 de R02">
<div class="lab">Intitulé et place</div><p>R02 « Gangrène, non classée ailleurs » appartient au bloc R00–R09 des symptômes et signes de l’appareil circulatoire et respiratoire. C’est un code de symptôme : il décrit une manifestation dont la cause n’est pas codée ailleurs.</p>
<div class="lab">Inclusion</div><p>La nécrose post-traumatique de la peau et du tissu sous-cutané, non classée ailleurs, est incluse.</p>
<div class="lab">Sous-catégories</div><p>R02.0- regroupe la nécrose de la peau et du tissu sous-cutané, avec un cinquième caractère pour le siège : tête et cou, épaule et bras, avant-bras et poignet, main et doigt, tronc, région pelvienne et cuisse, jambe et genou, cheville et pied, siège non précisé. R02.8 désigne une autre gangrène ou une gangrène non précisée.</p>
<div class="lab">Exclusions</div><p>Gangrène au cours de l’athérosclérose (I70.25), des autres maladies vasculaires périphériques (I73.-), du diabète sucré (E10–E14, quatrième caractère .5) ; gangrène gazeuse (A48.0) ; gangrène de certaines localisations, selon l’index alphabétique ; nécrose cutanée par athérosclérose (I70.24) ; pyodermite gangréneuse (L88) ; ulcère de décubitus (L89.-).</p>
<div class="lab">Conséquence pratique</div><p>Le code R02 est remplacé par le code de la cause dès que celle-ci est établie. La source est le BfArM, CIM-10-GM 2024, bloc R00–R09.</p>
</template>

<template data-pop="r02-wifi" data-title="Classification WIfI (plaie, ischémie, infection du pied)">
<div class="lab">Définition</div><p>Le système WIfI de la Society for Vascular Surgery gradue de 0 à 3 la plaie, l’ischémie et l’infection du pied, dont les initiales anglaises forment son nom. Les GVG 2019 l’adoptent pour stadifier la menace qui pèse sur le membre. Les combinaisons se regroupent en stades cliniques 1 à 4 de risque croissant d’amputation majeure ; le stade 5 désigne un pied non sauvable.</p>
<div class="lab">Mode d’emploi</div><p>La plaie se grade sur la profondeur, le siège et l’étendue de l’ulcère ou de la gangrène. L’ischémie se grade sur l’index de cheville, la pression de cheville, la pression d’orteil ou la pression transcutanée en oxygène ; la pression d’orteil l’emporte en cas de discordance. L’infection reprend la classification IDSA : 0 non infecté, 1 léger, 2 modéré, 3 sévère avec syndrome inflammatoire systémique.</p>
<div class="lab">Valeur et limites</div><p>WIfI prédit le risque d’amputation à un an et le bénéfice attendu de la revascularisation. Il ne mesure ni le risque opératoire du patient ni l’anatomie, qui relèvent du cadre PLAN.</p>
<div class="lab">Conséquence pratique</div><p>Une restadification après drainage ou amputation mineure est recommandée avant la décision suivante, car l’infection et la plaie changent en quelques jours.</p>
</template>

<template data-pop="r02-wifi-stades" data-title="Stades cliniques WIfI">
<div class="lab">Principe</div><p>Les GVG 2019 regroupent les 64 combinaisons de grades en quatre stades de risque d’amputation majeure : le stade 1 est très faible, le stade 2 faible, le stade 3 modéré et le stade 4 élevé. Le stade 5, hors tableau, désigne un pied non sauvable, le plus souvent par l’étendue de la plaie ou la gravité de l’infection.</p>
<div class="lab">Exemples tirés du tableau des GVG</div><p>Par exemple, une plaie 0, une ischémie 0 et une infection 0 ou 1 donnent le stade 1. Une plaie 1, une ischémie 1 et une infection 1 donnent le stade 2. Une plaie 2, une ischémie 2 et une infection 0 donnent le stade 3. Une plaie 2, une ischémie 3 et une infection 0 à 3 donnent le stade 4.</p>
<div class="lab">Conséquence pratique</div><p>Chez un patient à risque opératoire moyen, la revascularisation est recommandée au stade 4 avec une ischémie de grade 2 ou 3, et envisagée aux stades 2 et 3 avec la même ischémie (GVG 2019, recommandations 6.11 et 6.12).</p>
</template>

<template data-pop="r02-gvg" data-title="Global Vascular Guidelines 2019">
<div class="lab">Origine</div><p>Ce sont des recommandations internationales sur l’ischémie chronique menaçant le membre, élaborées conjointement par la Société européenne de chirurgie vasculaire (ESVS), la Society for Vascular Surgery (SVS) et la World Federation of Vascular Societies (WFVS), publiées en 2019 dans le <i>European Journal of Vascular and Endovascular Surgery</i> et le <i>Journal of Vascular Surgery</i>.</p>
<div class="lab">Apports</div><p>Ces recommandations définissent la CLTI, adoptent WIfI et font de la pression d’orteil la mesure préférée. Elles proposent le cadre décisionnel PLAN et le système anatomique GLASS, et formulent des recommandations sur la revascularisation, les traitements sans revascularisation et l’amputation.</p>
<div class="lab">Statut au 08.10.2026</div><p>Aucune mise à jour de ces recommandations n’a été trouvée lors de la rédaction. Les recommandations ESC 2024 sur les artériopathies périphériques, traitées dans le cours I70, couvrent aussi l’ischémie chronique menaçant le membre ; les essais BEST-CLI (2022) et BASIL-2 (2023), postérieurs aux GVG, précisent le choix de la technique.</p>
</template>

<template data-pop="r02-iwgdf" data-title="International Working Group on the Diabetic Foot">
<div class="lab">Origine</div><p>L’IWGDF est un groupe international qui publie depuis 1999 des recommandations fondées sur les preuves pour la prévention et la prise en charge du pied diabétique. La version 2023 utilise la méthode d’évaluation des preuves par niveau de certitude et force de recommandation.</p>
<div class="lab">Documents utilisés dans ce cours</div><p>Les sources sont les recommandations IWGDF/IDSA 2023 sur le diagnostic et le traitement des infections du pied diabétique (Senneville et al.) et les recommandations IWGDF 2023 sur l’artériopathie chez le diabétique ayant une plaie du pied, lues en texte intégral sur iwgdfguidelines.org.</p>
<div class="lab">Limite</div><p>Beaucoup de recommandations reposent sur des preuves de certitude faible ou sur des énoncés de bonne pratique ; le cours indique leur force lorsque cela change la décision.</p>
</template>

<template data-pop="r02-iwgdf-class" data-title="Classification IWGDF/IDSA de l’infection du pied diabétique">
<div class="lab">Grades</div><p><b>1, non infecté</b> : aucun signe local ou général. <b>2, léger</b> : au moins deux signes parmi tuméfaction ou induration, érythème de plus de 0,5 et de moins de 2 cm autour de la plaie, sensibilité ou douleur, chaleur, écoulement purulent, sans autre cause d’inflammation. <b>3, modéré</b> : érythème de 2 cm ou plus, ou atteinte plus profonde que la peau et le tissu sous-cutané, sans signe systémique. <b>4, sévère</b> : toute infection avec au moins deux critères du syndrome inflammatoire systémique. Le suffixe (O) signale une ostéomyélite aux grades 3 et 4.</p>
<div class="lab">Valeur</div><p>L’IWGDF/IDSA 2023 recommande fortement son usage, malgré une certitude faible, parce qu’elle aide à décider de l’hospitalisation et du spectre antibiotique et qu’elle a été validée dans plusieurs cohortes.</p>
<div class="lab">Piège</div><p>L’infection peut toucher toute partie du pied, pas seulement l’ulcère. L’ischémie atténue les signes inflammatoires. Une goutte, une neuro-arthropathie de Charcot aiguë, une fracture, une thrombose ou une stase veineuse peuvent imiter une infection et doivent être exclues.</p>
</template>

<template data-pop="r02-fontaine" data-title="Classification de Leriche et Fontaine">
<div class="lab">Stades</div><p>Le stade I correspond à une artériopathie asymptomatique. Le stade II correspond à une claudication intermittente, subdivisée en IIa au-delà de 200 mètres et IIb en deçà. Le stade III correspond à une douleur ischémique de décubitus, et le stade IV à des troubles trophiques, ulcère ou gangrène.</p>
<div class="lab">Usage dans la CIM-10-GM</div><p>La CIM-10-GM 2024 reprend ces stades dans la sous-catégorie I70.2- : I70.24 pour l’ulcération et I70.25 pour la gangrène, sèche ou humide.</p>
<div class="lab">Limite</div><p>Cette classification décrit des symptômes. Elle ne mesure ni la sévérité de l’ischémie, ni l’infection, ni l’étendue de la plaie, et ne prédit pas le bénéfice d’une revascularisation : WIfI la complète pour décider.</p>
</template>

<template data-pop="r02-clti" data-title="Ischémie chronique menaçant le membre (CLTI)">
<div class="lab">Définition (GVG 2019)</div><p>L’ischémie chronique menaçant le membre est un syndrome clinique qui associe une artériopathie démontrée à une douleur ischémique de repos, à une gangrène ou à un ulcère du membre inférieur évoluant depuis plus de 2 semaines. Les causes veineuses, traumatiques, emboliques et non athéroscléreuses sont exclues de cette définition.</p>
<div class="lab">Critères hémodynamiques</div><p>La douleur de repos exige au moins un des critères suivants : index de cheville inférieur à 0,4, pression de cheville inférieure à 50 mmHg, pression d’orteil inférieure à 30 mmHg, pression transcutanée en oxygène inférieure à 30 mmHg, onde pléthysmographique plate. La perte tissulaire exige une preuve objective d’artériopathie significative, par exemple une ischémie WIfI de grade 1 ou plus.</p>
<div class="lab">Pourquoi ce terme</div><p>L’ancien terme d’« ischémie critique » suggérait un seuil de perfusion unique. La menace dépend en réalité de la combinaison de l’ischémie, de la plaie et de l’infection : une ischémie modérée suffit à menacer un pied largement infecté.</p>
<div class="lab">Conséquence pratique</div><p>Tout patient suspect de CLTI est adressé à un spécialiste vasculaire, sauf si une amputation majeure est médicalement urgente.</p>
</template>

<template data-pop="r02-autoreg" data-title="Autorégulation et réserve vasodilatatrice">
<div class="lab">Fonctionnement normal</div><p>Les artérioles ajustent leur diamètre pour maintenir un débit constant malgré les variations de pression. Quand la pression en aval d’une sténose baisse, les artérioles se dilatent sous l’effet de métabolites locaux, comme l’adénosine, le dioxyde de carbone, les ions hydrogène et le potassium, et du monoxyde d’azote endothélial.</p>
<div class="lab">Épuisement</div><p>Lorsque les artérioles sont dilatées au maximum, toute nouvelle baisse de pression réduit directement le débit. Le tissu perd sa marge : le moindre surcroît de besoin, plaie, infection ou effort, crée une ischémie.</p>
<div class="lab">Corrélation clinique</div><p>Le lit d’aval maximalement dilaté explique l’onde Doppler monophasique, la rougeur de déclivité et l’absence d’effet des vasodilatateurs dans l’artériopathie sévère.</p>
</template>

<template data-pop="r02-sillon" data-title="Sillon de délimitation">
<div class="lab">Définition</div><p>Le sillon de délimitation est une ligne rouge ou violacée, parfois ulcérée, qui sépare le tissu nécrosé du tissu vivant.</p>
<div class="lab">Mécanisme</div><p>Les débris cellulaires libèrent des signaux de danger qui recrutent polynucléaires puis macrophages à la frontière. Ces cellules digèrent le tissu mort au contact du vivant, puis un tissu de granulation se forme si la perfusion le permet.</p>
<div class="lab">Valeur clinique</div><p>Un sillon net et stable signale une gangrène sèche délimitée. Un sillon flou, œdémateux, qui progresse vers l’amont, signale une infection ou une ischémie qui s’aggrave.</p>
<div class="lab">Conséquence pratique</div><p>Le niveau d’amputation se décide après revascularisation, en fonction de la perfusion et non de la seule limite visible, parce que le tissu en apparence sain près du sillon peut ne pas cicatriser.</p>
</template>

<template data-pop="r02-clostridium" data-title="Clostridium perfringens et espèces voisines">
<div class="lab">Bactériologie</div><p>Les clostridies sont des bacilles à Gram positif, anaérobies et sporulés. Les spores persistent dans le sol et le tube digestif. Elles germent dans un tissu dévitalisé, au potentiel d’oxydoréduction bas.</p>
<div class="lab">Espèces</div><p><i>Clostridium perfringens</i> domine la myonécrose post-traumatique. <i>Clostridium septicum</i>, plus tolérant à l’oxygène, provoque des myonécroses spontanées par voie sanguine, à partir d’une muqueuse colique lésée par un cancer ou une neutropénie.</p>
<div class="lab">Conséquence pratique</div><p>Une myonécrose à <i>Clostridium septicum</i> justifie la recherche d’une lésion colique après la guérison. L’examen direct peropératoire, qui montre de gros bacilles à Gram positif avec peu de polynucléaires, oriente le traitement avant la culture.</p>
<figure><img src="images/cardiologie/r02_clostridium_gram.gif" alt="Clostridium perfringens au Gram" width="560" height="372" loading="lazy" decoding="async"><figcaption>Gros bacilles à Gram positif de Clostridium perfringens : anaérobie sporulé, producteur de la toxine alpha. Don Stalons, CDC PHIL, domaine public.</figcaption></figure></template>

<template data-pop="r02-toxine-alpha" data-title="Toxine alpha de Clostridium perfringens">
<div class="lab">Nature</div><p>La toxine alpha est une phospholipase C qui hydrolyse la phosphatidylcholine et la sphingomyéline des membranes cellulaires.</p>
<div class="lab">Effets</div><p>Elle lyse les cellules musculaires, les hématies et les cellules endothéliales. Elle active et agrège les plaquettes et les leucocytes dans les vaisseaux, qui occluent la microcirculation et étendent la nécrose. Elle déprime le myocarde et dilate les vaisseaux, ce qui participe au choc. La toxine thêta, ou perfringolysine O, forme des pores dans les membranes et agit en synergie.</p>
<div class="lab">Corrélation clinique</div><p>Les leucocytes restent bloqués dans les vaisseaux : le tissu nécrosé contient peu de polynucléaires et peu de pus. La toxine circulante explique l’hémolyse et le choc précoce. La clindamycine, qui bloque la synthèse protéique bactérienne, réduit la production de toxine.</p>
</template>

<template data-pop="r02-neuropathie" data-title="Neuropathie diabétique et pied">
<div class="lab">Trois composantes</div><p>La neuropathie sensitive supprime la sensibilité protectrice : une chaussure blessante ou un corps étranger ne sont pas sentis. La neuropathie motrice affaiblit les muscles intrinsèques, ce qui produit des orteils en griffe et des zones d’hyperappui sous les têtes métatarsiennes. La neuropathie autonome supprime la sudation, d’où une peau sèche et fissurée, porte d’entrée bactérienne.</p>
<div class="lab">Conséquence</div><p>Une plaie neuropathique évolue sans douleur, et une infection profonde peut se développer sans alerte. La douleur ischémique de décubitus manque aussi.</p>
<div class="lab">Conduite</div><p>Le test au monofilament de 10 g repère la perte de sensibilité protectrice. La décharge mécanique, les chaussures adaptées et l’inspection quotidienne compensent l’absence d’alerte douloureuse.</p>
</template>

<template data-pop="r02-geneve" data-title="Amputations majeures à Genève : données suisses">
<div class="lab">Étude 1990–2010</div><p>Selon Carmona, Lacraz, Hoffmeyer et Assal (<i>Revue médicale suisse</i> 2014;10:1997–2001), l’incidence des amputations majeures des membres inférieurs dans le canton de Genève était de 10,02 pour 100 000 habitants par an. Le diabète multipliait le risque relatif par 20, un âge de 65 ans ou plus par 9. L’incidence diminuait et l’âge à l’amputation augmentait au cours de la période.</p>
<div class="lab">Étude 1990–1999 chez les plus de 65 ans</div><p>Dans l’étude de Carmona et al. (<i>Diabetes &amp; Metabolism</i> 2005;31:449–454), le diabète était présent chez 48 % des amputés, avec un risque relatif d’environ 10, et une artériopathie sévère chez plus de 94 %. La mortalité à deux ans atteignait 47 %, et 53 % seulement des patients ont pu être appareillés.</p>
<div class="lab">Limites</div><p>Ces données monocentriques, cantonales et anciennes sont observationnelles. Elles montrent une association et ne mesurent pas l’effet causal de chaque facteur. Aucun registre national suisse consolidé n’a été trouvé.</p>
</template>

<template data-pop="r02-angiosome" data-title="Angiosome">
<div class="lab">Définition</div><p>Un angiosome est un territoire tridimensionnel de peau, de tissu sous-cutané, de muscle et d’os irrigué par une artère source. Six angiosomes ont été décrits au pied et à la cheville : trois issus de la tibiale postérieure (calcanéen médial, plantaire médial, plantaire latéral), un de la tibiale antérieure (dorsal du pied) et deux de la fibulaire (calcanéen latéral, branche perforante antérieure).</p>
<div class="lab">Application</div><p>La revascularisation dite directe vise l’artère source de l’angiosome où siège la plaie. Les GVG 2019 la suggèrent avec un faible niveau de preuve pour les plaies étendues du médio-pied et de l’arrière-pied, lorsque l’artère cible est accessible.</p>
<div class="lab">Limite</div><p>Les anastomoses entre angiosomes peuvent irriguer une plaie par voie indirecte ; la règle n’est donc pas absolue. Le but premier reste un flux direct vers au moins une artère du pied.</p>

<template data-pop="r02-clinda-toxine" data-title="Clindamycine et inhibition des toxines">
<div class="lab">Mécanisme</div><p>La clindamycine se fixe sur la sous-unité 50S du ribosome bactérien et bloque la synthèse des protéines, dont les toxines. Cet effet persiste lorsque les bactéries sont en phase stationnaire, dans un inoculum dense.</p>
<div class="lab">Complémentarité avec la pénicilline</div><p>Les bêtalactamines inhibent la synthèse de la paroi et tuent surtout les bactéries en division. Dans un inoculum très dense, une partie des bactéries ne se divise plus et échappe à leur action. L’association couvre les deux situations.</p>
<div class="lab">Conséquence pratique</div><p>L’IDSA 2014 recommande l’association de pénicilline et de clindamycine pour la myonécrose clostridienne et la fasciite nécrosante à streptocoque du groupe A. La clindamycine ne s’emploie pas seule, en raison de résistances possibles.</p>
