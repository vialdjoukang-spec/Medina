<section class="ilot" id="r02-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme diabétique de 71 ans, fumeur, consulte pour un orteil noir depuis dix jours ; or, depuis hier, le pied est tuméfié, rouge et malodorant, et sa température atteint 38,6 °C. Dès lors, l’urgence n’est plus seulement vasculaire : elle est aussi infectieuse. La question qui structure ce cours est donc la suivante : <b>devant un tissu noir, comment distinguer la gangrène sèche, qui laisse le temps du bilan, de la gangrène humide ou gazeuse, qui menace la vie en quelques heures ?</b></p>
<p>Pour y répondre, ce cours poursuit trois objectifs. D’abord, reconnaître les trois formes de gangrène et leur mécanisme. Ensuite, ordonner les décisions : contrôler l’infection, puis revasculariser, puis amputer au bon niveau. Enfin, appliquer au pied diabétique la classification de l’IWGDF/IDSA 2023. En revanche, l’artériopathie elle-même est développée dans le cours I70 ; ce cours n’en reprend donc que ce qui décide pour la gangrène.</p>
</section>
<section class="ilot" id="r02-1"><h2><span class="n">1</span>Définitions, formes et codage</h2>
<p>La gangrène est une <button class="w" data-k="r02-necrose">nécrose tissulaire</button> étendue, visible à l’œil nu, d’un segment de membre ou d’un organe. Elle n’est donc pas une maladie en soi, mais l’aboutissement visible d’une ischémie, d’une infection, d’une agression thermique ou toxique, ou de leur combinaison. C’est pourquoi la distinction utile oppose trois formes, qui n’ont ni le même risque vital ni la même urgence.</p>
<table class="t"><tr><th>Forme</th><th>Mécanisme dominant</th><th>Aspect</th><th>Urgence</th></tr>
<tr><td><button class="w" data-k="r02-seche">Gangrène sèche</button></td><td>Ischémie artérielle lente, sans infection</td><td>Noire, dure, froide, ratatinée, inodore ; <button class="w" data-k="r02-sillon">sillon de délimitation</button> net</td><td>Relative : bilan vasculaire en jours</td></tr>
<tr><td><button class="w" data-k="r02-humide">Gangrène humide</button></td><td>Ischémie surinfectée, flore polymicrobienne</td><td>Tuméfiée, suintante, malodorante, bords inflammatoires</td><td>Haute : drainage et antibiotiques en heures</td></tr>
<tr><td><button class="w" data-k="r02-gazeuse">Gangrène gazeuse</button></td><td>Toxines de Clostridium qui détruisent le muscle sain</td><td>Douleur intense, peau bronzée ou violacée, bulles hémorragiques, crépitation</td><td>Extrême : chirurgie immédiate</td></tr></table>
<p>Ce tableau se lit donc de haut en bas comme une échelle de gravité : plus les bactéries envahissent la nécrose, plus le délai d’action se raccourcit. Le codage suit, quant à lui, la règle des symptômes : R02 ne s’emploie que si la cause n’est pas codée ailleurs, selon la <button class="w" data-k="r02-codage">règle de codage de R02</button>. Ainsi, la gangrène d’une artériopathie athéroscléreuse se code en I70.2-, et celle d’un diabète avec le code du diabète et de ses complications.</p>
</section>
<section class="ilot" id="r02-2"><h2><span class="n">2</span>Physiopathologie</h2>
<p>Normalement, chaque cellule reçoit par la microcirculation l’oxygène et le glucose qui maintiennent son gradient ionique ; cet apport dépend du <button class="w" data-k="r02-do2">transport de l’oxygène</button>. Or, lorsque l’apport s’interrompt assez longtemps, la cellule ne produit plus assez d’adénosine triphosphate : ses pompes s’arrêtent, elle gonfle, puis ses membranes se rompent. Par conséquent, la gangrène correspond à la mort de tout un territoire, et non de quelques cellules isolées.</p>
<p>La suite dépend ensuite de ce qui colonise ce tissu mort. Si aucune bactérie ne s’y installe, le tissu se dessèche et se momifie ; ainsi, l’organisme le sépare du tissu vivant par un sillon inflammatoire. À l’inverse, si des bactéries le colonisent, elles le liquéfient et diffusent le long des gaines tendineuses ; c’est la gangrène humide. Enfin, dans la gangrène gazeuse, Clostridium perfringens produit la <button class="w" data-k="r02-toxine-alpha">toxine alpha</button>, qui détruit les membranes du muscle encore sain ; de plus, la fermentation libère des gaz, d’où la crépitation.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> La sèche est limitée par un sillon, car le tissu vivant voisin reste perfusé ; la humide s’étend, car l’infection progresse dans un tissu mal perfusé où les antibiotiques diffusent mal ; la gazeuse progresse en heures, car la toxine tue le muscle sain devant elle.</div>

<figcaption>Figure 1 — Gangrène des orteils 1 à 4 du pied droit chez une personne diabétique. Image de James Heilman, MD, Wikimedia Commons, licence CC BY-SA 3.0 ; convertie pour l’atlas, dérivé sous la même licence.</figcaption></figure>
<p>La figure 1 montre ainsi la topographie typique de l’ischémie distale : ce sont les orteils, à l’extrémité de l’<button class="w" data-k="r02-angiosome">angiosome</button>, qui reçoivent la pression la plus basse du membre. Cependant, l’aspect seul ne dit pas si l’infection a franchi la limite ; c’est pourquoi on recherche, autour de la nécrose, un érythème, une tuméfaction ou un écoulement.</p>
</section>
<section class="ilot" id="r02-3"><h2><span class="n">3</span>Étiologies</h2>
<p>La cause la plus fréquente est l’<button class="w" data-k="r02-clti">ischémie chronique menaçant le membre</button>, sur artériopathie athéroscléreuse ou diabétique, favorisée par la <button class="w" data-k="r02-medialcalc">médiacalcose</button> et la <button class="w" data-k="r02-neuropathie">neuropathie</button>. Cependant, d’autres causes doivent être reconnues, car leur traitement diffère. Ainsi, une <button class="w" data-k="r02-ischemie-aigue">ischémie aiguë</button> embolique nécrose un membre en quelques heures ; de même, les <button class="w" data-k="r02-vasopresseurs">vasopresseurs</button>, l’<button class="w" data-k="r02-ergot">ergotisme</button>, le <button class="w" data-k="r02-purpura">purpura fulminans</button> et la <button class="w" data-k="r02-tih">thrombopénie induite par l’héparine</button> donnent des gangrènes symétriques ou distales.</p>
<p>De plus, chez le sujet jeune fumeur, la <button class="w" data-k="r02-buerger">thromboangéite oblitérante</button> doit être évoquée (cours I73), et chez le dialysé, la <button class="w" data-k="r02-calciphylaxie">calciphylaxie</button>. Enfin, un <button class="w" data-k="r02-pyoderma">pyoderma gangrenosum</button> peut imiter une gangrène humide ; or, le débridement chirurgical l’aggrave, ce qui impose de l’évoquer avant d’opérer.</p>
