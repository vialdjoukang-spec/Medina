<template data-pop="m32-ana" data-title="Anticorps antinucléaires"><p>Dépistés par immunofluorescence indirecte sur cellules HEp-2 ; le résultat donne un titre et un aspect (homogène, moucheté, nucléolaire, centromère). Un titre ≥ 1:80 est le critère d’entrée des critères de 2019, avec une sensibilité de 98 % pour le lupus. Très sensibles, ils sont peu spécifiques : on en trouve aussi chez des sujets sains, surtout à faible titre. Toujours préciser la spécificité (anti-ADN double brin, anti-ENA).</p></template>
<template data-pop="m32-compl" data-title="Complément dans le lupus"><p>La poussée active la voie classique : C3 et C4 baissent, CH50 baisse. Leur remontée accompagne la rémission. Un C4 bas permanent peut refléter un déficit génétique partiel, qui est aussi un facteur de risque de lupus.</p></template>
<template data-pop="m32-peau" data-title="Lupus cutané"><p><b>Aigu</b> : érythème malaire en ailes de papillon épargnant les sillons nasogéniens, photosensible, corrélé à l’activité. <b>Subaigu</b> : lésions annulaires ou psoriasiformes des zones exposées, anti-SSA. <b>Discoïde</b> : plaques atrophiques cicatricielles, alopécie définitive. Photoprotection et hydroxychloroquine pour toutes les formes.</p></template>
<template data-pop="m32-nephr" data-title="Néphrite lupique"><p>Glomérulonéphrite à complexes immuns ; classification ISN/RPS (I à VI). Dépistage à chaque visite : pression artérielle, bandelette, rapport protéines/créatinine, sédiment. Biopsie (EULAR/ERA-EDTA 2019) si hématurie glomérulaire ou cylindres cellulaires, protéinurie supérieure à 0,5 g par 24 heures ou baisse inexpliquée de la filtration. Induction des classes III et IV : mycophénolate ou cyclophosphamide à faible dose, avec corticostéroïdes, ± bélimumab ou inhibiteur de la calcineurine ; bloqueur du système rénine-angiotensine hors grossesse ; traitement d’au moins 3 ans après la réponse.</p></template>
<template data-pop="m32-np" data-title="Lupus neuropsychiatrique"><p>Les syndromes neuropsychiatriques du lupus sont centraux ou périphériques. Mécanismes : vasculopathie, thromboses liées aux anticorps antiphospholipides, auto-anticorps, inflammation. Démarche : exclure infection, troubles métaboliques et effets des médicaments, notamment des corticostéroïdes ; IRM, ponction lombaire, électroencéphalogramme. Traitement selon l’EULAR 2023 : corticostéroïdes et immunosuppresseurs pour les formes inflammatoires, antiagrégants ou anticoagulants pour les formes athérothrombotiques ou liées aux antiphospholipides, avec traitement symptomatique (antipsychotique, antiépileptique).</p></template>
<template data-pop="m32-ac" data-title="Auto-anticorps spécifiques"><p><b>Anti-ADN double brin</b> : spécifiques, suivent l’activité et la néphrite. <b>Anti-Sm</b> : très spécifiques. <b>Anti-SSA/SSB</b> : Sjögren, lupus subaigu, lupus néonatal. <b>Anti-RNP</b> : connectivite mixte. <b>Anti-histones</b> : lupus induit. <b>Antiphospholipides</b> : thromboses, pertes fœtales.</p></template>
<template data-pop="m32-sledai" data-title="Scores SLEDAI-2K et SLICC"><p><b>SLEDAI-2K</b> : indice pondéré d’activité qui additionne des manifestations cliniques et biologiques récentes (convulsions, psychose, vascularite, arthrite, protéinurie, anti-ADN, complément…). L’EULAR 2023 cite aussi le BILAG parmi les instruments validés. <b>Indice de dommage SLICC</b> : relevé des lésions irréversibles depuis le début de la maladie, à évaluer au moins une fois par an, car l’accumulation des dommages a une valeur pronostique.</p></template>
<template data-pop="m32-d-hcq" data-title="Hydroxychloroquine"><p>Elle inhibe la signalisation des récepteurs Toll endosomaux et la présentation antigénique. L’EULAR 2023 la recommande pour toutes les patientes : elle réduit les poussées et possède des effets antithrombotiques ; l’EULAR 2017 la recommande avant et pendant la grossesse, où elle peut réduire le risque de bloc cardiaque fœtal. Cible européenne : 5 mg/kg de poids réel par jour, individualisée selon le risque de poussée et de rétinopathie ; une dose initiale plus élevée, sans dépasser 400 mg par jour, peut se discuter dans une forme modérée ou sévère. Posologie suisse : 400 à 600 mg par jour au début, puis 200 à 400 mg par jour. Contre-indications suisses : rétinopathie préexistante, myasthénie, psoriasis, déficit en glucose-6-phosphate déshydrogénase, porphyrie. Effets : troubles digestifs, rétinopathie, allongement du QT.</p><p class="small">EULAR 2023 et 2017 ; information professionnelle suisse Plaquenil®, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>
<template data-pop="m32-d-bio" data-title="Biothérapies du lupus"><p><b>Bélimumab</b> : anticorps anti-BLyS, facteur de survie des lymphocytes B ; autorisé en Suisse dans le lupus actif avec auto-anticorps dès 5 ans et dans la néphrite lupique de l’adulte, à 10 mg/kg aux jours 0, 14 et 28 puis toutes les 4 semaines ; arrêt à envisager sans amélioration après 6 mois ; non étudié dans les atteintes graves du système nerveux central. <b>Anifrolumab</b> : anti-récepteur de l’interféron de type I ; autorisé dans le lupus modéré à sévère, 300 mg par voie intraveineuse toutes les 4 semaines ou 120 mg par voie sous-cutanée chaque semaine ; non recommandé dans la néphrite active sévère ; infections respiratoires et zona. <b>Rituximab</b> : anti-CD20, formes réfractaires, hors autorisation dans le lupus.</p><p class="small">Information professionnelle suisse Benlysta® et Saphnelo®, Swissmedic (AIPS), consultées le 08.10.2026 ; EULAR 2023.</p></template>
<template data-pop="m32-ch-hcq" data-title="Hydroxychloroquine : posologie suisse, cible européenne et dépistage rétinien"><table class="t"><tr><th>Point</th><th>Information professionnelle suisse</th><th>EULAR 2023</th><th>Société suisse de rhumatologie (09-2026)</th></tr><tr><td>Dose</td><td>400 à 600 mg par jour au début, puis 200 à 400 mg par jour</td><td>Cible de 5 mg/kg de poids réel par jour, individualisée ; au plus 400 mg par jour si une dose initiale plus élevée est utilisée</td><td>Dose usuelle ≤ 5 mg/kg par jour ; forte dose 5 à 7 mg/kg</td></tr><tr><td>Dépistage rétinien</td><td>Avant le traitement puis tous les 3 à 6 mois</td><td>Surveillance plus étroite si insuffisance rénale, maculopathie ou tamoxifène</td><td>Tomographie en cohérence optique et périmétrie avant ; annuel dès la 5e année à ≤ 5 mg/kg sans facteur de risque, annuel d’emblée au-delà</td></tr></table><p><b>Choix retenu</b> : la cible de 5 mg/kg de poids réel, recommandation européenne la plus récente reprise par la Société suisse de rhumatologie, guide la dose ; elle reste compatible avec la fourchette d’entretien de l’information professionnelle suisse (200 à 400 mg par jour). Une dose initiale de 600 mg par jour, permise par l’information professionnelle, dépasse la cible chez la plupart des patientes et ne se justifie qu’exceptionnellement. Le calendrier de dépistage suit la Société suisse de rhumatologie en pratique spécialisée ; l’information professionnelle reste la référence opposable.</p></template>
<template data-pop="m32-ch-grossesse" data-title="Délais d’arrêt avant la grossesse : positions suisse et européenne"><table class="t"><tr><th>Médicament</th><th>Société suisse de rhumatologie (03-2026)</th><th>Autre source</th></tr><tr><td>Mycophénolate</td><td>Arrêt plus de 6 semaines avant la conception</td><td>EULAR/ERA-EDTA 2019 : un arrêt environ 6 mois avant permet de vérifier l’efficacité et la tolérance du relais</td></tr><tr><td>Méthotrexate</td><td>Arrêt 1 à 3 mois avant, acide folique jusqu’au premier trimestre</td><td>Information professionnelle suisse : contraception jusqu’à 6 mois après l’arrêt chez la femme</td></tr><tr><td>Cyclophosphamide</td><td>Arrêt 3 mois avant ; possible aux 2e et 3e trimestres seulement si la vie ou un organe est menacé</td><td>EULAR 2017 : analogues de la gonadolibérine pour préserver la fertilité</td></tr><tr><td>Hydroxychloroquine, azathioprine, tacrolimus</td><td>Compatibles avant, pendant et après la grossesse</td><td>EULAR 2017 : compatibles</td></tr></table><p><b>Choix retenu</b> : la position suisse s’applique pour l’examen fédéral ; l’arrêt plus précoce du mycophénolate proposé par l’EULAR/ERA-EDTA sert à tester le relais dans une néphrite, et l’information professionnelle fixe la contraception après méthotrexate.</p></template>
<template data-pop="pareto-m32-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="m32-0,m32-1,m32-2,m32-3,m32-4,m32-5"></p><ul><li>Auto-immunité anti-noyau, complexes immuns, complément consommé, interféron de type I.</li><li>Femme jeune ; menaces : rein, infections, risque cardiovasculaire et corticostéroïdes.</li><li>Déclencheurs : soleil, œstrogènes si antiphospholipides, arrêt de l’hydroxychloroquine, médicaments inducteurs (hydralazine, procaïnamide, isoniazide, chlorpromazine, carbamazépine, anti-TNF).</li><li>Clinique : fatigue, arthrite non érosive, érythème malaire, aphtes, cytopénies, sérites, néphrite, atteinte neuropsychiatrique.</li><li>Psychose : lupus, corticostéroïdes ou infection.</li></ul></template>
<template data-pop="pareto-m32-diag" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="m32-6"></p><ul><li>Anticorps antinucléaires HEp-2 ≥ 1:80 (entrée, sensibilité 98 %), puis anti-ADN double brin, anti-Sm, SSA/SSB, RNP, antiphospholipides.</li><li>C3, C4, formule, Coombs, créatinine, rapport protéines/créatinine, sédiment.</li><li>Biopsie rénale : hématurie glomérulaire, cylindres, protéinurie &gt; 0,5 g/24 h, baisse de filtration.</li><li>Différentiels : infections, polyarthrite, autres connectivites, lupus induit.</li></ul></template>
<template data-pop="pareto-m32-tt" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="m32-7,m32-8"></p><ul><li>Urgences : néphrite proliférative, neurolupus, cytopénies, syndrome catastrophique des antiphospholipides, infections (CRP élevée), tamponnade.</li><li>Hydroxychloroquine pour toutes, cible 5 mg/kg ; photoprotection ; corticostéroïdes ≤ 5 mg/jour en entretien.</li><li>Méthotrexate, azathioprine, mycophénolate ; bélimumab, anifrolumab ; cyclophosphamide si menace ; rituximab si réfractaire.</li><li>Néphrite III–IV : mycophénolate ou Euro-Lupus ± bélimumab ou inhibiteur de la calcineurine ; bloqueur rénine-angiotensine ; au moins 3 ans.</li></ul></template>
<template data-pop="pareto-m32-crit" data-title="Pareto — Suivi, grossesse et critères"><p class="ratio" data-cover="m32-9,m32-10,m32-11"></p><ul><li>Suivi : SLEDAI-2K, urines, complément, anti-ADN ; dommages annuels ; rétine, os, cœur ; vaccins et dépistage des cancers.</li><li>Grossesse : activité dans les 6–12 mois = risque ; hydroxychloroquine avant et pendant ; azathioprine, tacrolimus compatibles ; aspirine avant la 16e semaine si haut risque ; anti-SSA : bloc 0,7–2 %, 16 % après un enfant atteint.</li><li>Pas de contraception combinée si antiphospholipides.</li><li>Critères 2019 : anticorps antinucléaires ≥ 1:80 + ≥ 10 points dont un clinique.</li></ul></template>
<template data-pop="pareto-m32-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="m32-e-1,m32-e-2"></p><ul><li>Anticorps antinucléaires : sensibles, peu spécifiques ; anti-ADN double brin et anti-Sm : spécifiques.</li><li>Complément bas = activité ; CRP élevée = infection ou sérite.</li><li>Protéinurie &gt; 0,5 g/g, cylindres : biopsie, classes ISN/RPS.</li><li>Profil antiphospholipide à haut risque : anticoagulant lupique, double ou triple positivité.</li></ul></template>
<template data-pop="pareto-m32-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="m32-p-1,m32-p-2"></p><ul><li>Hydroxychloroquine : cible 5 mg/kg/jour, jamais arrêtée pendant la grossesse ; rétine, QT.</li><li>Tératogènes : mycophénolate, méthotrexate, cyclophosphamide ; azathioprine compatible (TPMT, NUDT15 ; allopurinol : dose au quart).</li><li>Bélimumab 10 mg/kg ; anifrolumab 300 mg/4 semaines ; voclosporine 23,7 mg × 2 avec mycophénolate.</li><li>Syndrome des antiphospholipides : antivitamine K ; anticoagulants oraux directs défavorables.</li></ul></template>
