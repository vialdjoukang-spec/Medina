<template data-pop="m32-science-reading" data-title="Activité lupique : relier la sérologie à l’organe"><p>Un résultat immunologique renseigne une partie du mécanisme. Une hausse des anti-ADN ou une baisse de complément ne démontre pas, seule, une nouvelle lésion rénale.</p><p>Le bilan examine pression, fonction rénale, protéinurie et sédiment urinaire. Les valeurs sont comparées au profil antérieur du patient. Une infection, une toxicité médicamenteuse ou une lésion chronique peut expliquer une partie du tableau.</p><p>Lorsqu’une biopsie est indiquée, sa classe est lue avec l’activité, la chronicité et les lésions associées. L’inflammation active et la cicatrice n’ont pas le même potentiel de réponse.</p><p>La stratégie rénale dépend de cette synthèse. Les atteintes extrarénales restent examinées séparément : une fibrose rénale avancée ne décrit pas l’activité de tout le lupus.</p><div class="key"><b>À retenir.</b> Le résultat répond à une question précise. Son interprétation exige les autres informations du patient.</div></template>
<template data-pop="pareto-m32-sciences-revision" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="m32-si,m32-sh,m32-sg">Les parties reliées ci-dessous expliquent les mécanismes essentiels à cette synthèse.</p><ul><li>Une activité immunologique peut précéder ou accompagner des lésions. Sa lecture doit rester liée au patient et aux organes examinés.</li><li>Une classe histologique n’est pas toute la biopsie. L’activité et la chronicité expliquent ce qu’un traitement peut espérer modifier.</li><li>Une susceptibilité n’est pas une preuve de lupus. Une cause confirmée peut cependant modifier le conseil et la prévention.</li></ul></template>
