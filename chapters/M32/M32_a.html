<section class="ilot" id="m32-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 27 ans présente depuis deux mois des douleurs des poignets et des doigts, une fatigue intense, une éruption du visage apparue après un séjour au soleil et des aphtes indolores du palais. La formule sanguine montre 2 800 leucocytes/µL et 110 000 plaquettes/µL. La question du cours : <b>s’agit-il d’un lupus érythémateux systémique, comment le prouver, quels organes sont menacés et comment protéger le rein, le cerveau et les grossesses futures ?</b></p>
<p>À la fin de ce cours, le médecin assistant sait reconnaître les manifestations cutanées, articulaires, hématologiques, séreuses, rénales et neuropsychiatriques, interpréter les auto-anticorps et le complément, appliquer les critères de classification de 2019, dépister la néphrite lupique, prescrire l’hydroxychloroquine selon l’EULAR et l’information professionnelle suisse, et conduire une grossesse lupique.</p>
<div class="key"><b>Prérequis.</b> Les <button class="w" data-k="m32-ana">anticorps antinucléaires (dépistage)</button> et le <button class="w" data-k="m32-compl">complément comme marqueur d’activité</button>.</div>
</section>
<section class="ilot" id="m32-1"><h2><span class="n">1</span>Définition et formes</h2>
<p>Le lupus érythémateux systémique est une <b>maladie auto-immune systémique</b> qui évolue par poussées. Il se caractérise par la production d’<b>auto-anticorps dirigés contre des constituants du noyau</b> et par des lésions d’organes dues aux complexes immuns, au complément et à l’inflammation. Il peut toucher tous les organes ; sa présentation varie donc beaucoup d’une patiente à l’autre.</p>
<div class="two"><div class="card"><h4>Lupus cutané isolé</h4><p>Lupus discoïde (lésions cicatricielles, alopécie définitive), lupus subaigu (annulaire, photosensible, anticorps anti-SSA) : une minorité évolue vers une forme systémique.</p></div>
<div class="card"><h4>Lupus induit par les médicaments</h4><p>Hydralazine, procaïnamide, isoniazide, minocycline, anti-TNF, et en psychiatrie chlorpromazine et carbamazépine : arthralgies, sérites, anticorps anti-histones ; atteintes rénale et neurologique rares ; régression à l’arrêt du médicament.</p></div></div>
</section>
<section class="ilot" id="m32-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Le lupus touche surtout la <b>femme jeune</b>. <b>Lacune nommée</b> : aucune prévalence suisse ni aucun rapport de sexe chiffré n’a été relu pour cette révision ; les chiffres internationaux de prévalence et de survie ne sont donc pas repris.</p>
<p>Le pronostic dépend de trois menaces que les recommandations relues visent explicitement : l’<b>atteinte rénale</b>, que l’EULAR 2023 demande de dépister régulièrement ; les <b>infections</b>, favorisées par l’immunosuppression ; le <b>risque cardiovasculaire</b> et les effets cumulés des corticostéroïdes, que l’EULAR 2023 combat par la réduction de la corticothérapie à 5 mg par jour au plus, la vaccination et la gestion des facteurs de risque. L’EULAR 2023 souligne qu’un diagnostic précoce, un dépistage régulier des atteintes d’organe et une adhésion stricte au traitement préviennent poussées et dommages.</p>
</section>
<section class="ilot" id="m32-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Terrain génétique</b> : déficits en C1q, C2, C4 (clairance des débris), variants de la voie de l’interféron. <b>Défaut d’élimination des cellules apoptotiques</b> : les antigènes nucléaires restent exposés. <b>Signature interféron de type I</b> : les cellules dendritiques plasmacytoïdes produisent de l’interféron alpha, qui active lymphocytes B et T. <b>Auto-anticorps et complexes immuns</b> : ils se déposent dans le rein, la peau, les séreuses, activent le complément (d’où C3 et C4 bas) et attirent les neutrophiles. <b>Cytopénies</b> : destruction périphérique par anticorps.</p>
<div class="key"><b>Corrélation physiopathologie → examens et traitement.</b> Les complexes immuns expliquent la consommation du complément et les dépôts rénaux ; l’interféron explique la cible de l’anifrolumab ; l’activation des lymphocytes B explique le bélimumab et le rituximab ; l’exposition aux ultraviolets, qui augmente l’apoptose des kératinocytes, explique la photosensibilité et la nécessité de la photoprotection, que l’EULAR 2023 range parmi les mesures non médicamenteuses essentielles.</div>
</section>
<section class="ilot" id="m32-4"><h2><span class="n">4</span>Facteurs déclenchants</h2>
<p>Exposition solaire, œstrogènes chez les patientes à risque (contraception combinée en cas d’anticorps antiphospholipides, grossesse, post-partum), infections virales, tabac, médicaments inducteurs, arrêt de l’hydroxychloroquine, qui réduit les poussées selon l’EULAR 2023 et dont l’interruption les favorise.</p>
</section>
<section class="ilot" id="m32-5"><h2><span class="n">5</span>Manifestations cliniques</h2>
<p>Le tableau classe les manifestations par domaine, dans l’ordre des domaines des critères de classification de 2019 ; les fréquences ne sont pas reprises faute de source primaire relue.</p>
<table class="t"><tr><th>Domaine</th><th>Manifestations</th></tr>
<tr><td>Général</td><td>Fatigue, fièvre inexpliquée (exclure d’abord une infection), amaigrissement</td></tr>
<tr><td>Articulaire</td><td>Polyarthrite ou arthralgies inflammatoires, <b>non érosives</b> ; déformations réductibles (Jaccoud)</td></tr>
<tr><td>Cutanéo-muqueux</td><td><button class="w" data-k="m32-peau">Éruption malaire « en vespertilio »</button>, photosensibilité, ulcérations buccales indolores, alopécie non cicatricielle, lupus discoïde, vascularite, Raynaud</td></tr>
<tr><td>Hématologique</td><td>Leucopénie et lymphopénie, thrombopénie, anémie hémolytique auto-immune</td></tr>
<tr><td>Séreuses</td><td>Pleurésie, péricardite</td></tr>
<tr><td>Rénal</td><td><button class="w" data-k="m32-nephr">Néphrite lupique</button> : protéinurie, hématurie, cylindres, hypertension, insuffisance rénale</td></tr>
<tr><td>Neuropsychiatrique</td><td><button class="w" data-k="m32-np">Lupus neuropsychiatrique</button> : crises épileptiques, psychose, état confusionnel, accident vasculaire cérébral, troubles cognitifs, neuropathies</td></tr>
<tr><td>Autres</td><td>Syndrome des antiphospholipides associé (thromboses, pertes fœtales), myocardite, endocardite de Libman-Sacks, pneumopathie, adénopathies, syndrome sec</td></tr></table>
<div class="trap"><span class="k">Piège</span>Une <b>psychose</b> chez une patiente lupique peut être due au lupus, aux corticostéroïdes, surtout à forte dose et dans les premières semaines, ou à une infection du système nerveux central. La chronologie, l’imagerie, la ponction lombaire et l’activité sérologique orientent ; le traitement diffère radicalement. L’EULAR 2023 traite les manifestations inflammatoires par corticostéroïdes et immunosuppresseurs, les manifestations athérothrombotiques ou liées aux antiphospholipides par antiagrégants ou anticoagulants.</div>

<section class="ilot" id="m32-6"><h2><span class="n">6</span>Démarche diagnostique</h2>
<p><b>Étape 1</b> : anticorps antinucléaires par immunofluorescence indirecte sur cellules HEp-2. Un titre ≥ 1:80 est la porte d’entrée des critères de 2019 ; à ce seuil, leur sensibilité atteint 98 %, si bien que leur absence rend le lupus très improbable. <b>Étape 2</b> : spécificité — <button class="w" data-k="m32-ac">anti-ADN double brin, anti-Sm, anti-SSA, anti-SSB, anti-RNP</button>, anticorps antiphospholipides. <b>Étape 3</b> : complément C3 et C4, formule sanguine, test de Coombs, créatinine, <b>rapport protéines/créatinine urinaire</b> et sédiment urinaire (hématies déformées, cylindres). <b>Étape 4</b> : bilan d’organe selon la clinique (échocardiographie, radiographie thoracique, IRM cérébrale). Selon l’EULAR/ERA-EDTA 2019, toute patiente lupique avec hématurie glomérulaire ou cylindres cellulaires, protéinurie supérieure à 0,5 g par 24 heures (ou rapport protéines/créatinine supérieur à 500 mg/g) ou baisse inexpliquée de la filtration est candidate à la <b>biopsie rénale</b>.</p>
<table class="t"><tr><th>Diagnostic différentiel</th><th>Argument</th></tr>
<tr><td>Infections (parvovirus B19, virus d’Epstein-Barr, VIH, endocardite)</td><td>Sérologies, hémocultures ; anticorps antinucléaires transitoires possibles</td></tr>
<tr><td>Polyarthrite rhumatoïde</td><td>Érosions, anticorps anti-peptides citrullinés</td></tr>
<tr><td>Autres connectivites</td><td>Sclérodermie (anti-centromère, anti-Scl-70), Sjögren (anti-SSA/SSB isolés), dermatomyosite, connectivite mixte (anti-RNP isolés à titre élevé)</td></tr>
<tr><td>Lupus induit</td><td>Médicament, anti-histones, anti-ADN double brin habituellement absents</td></tr>
<tr><td>Hémopathies, vascularites</td><td>Frottis, ANCA</td></tr></table>
