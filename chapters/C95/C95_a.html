<div class="chap-head"><div class="code">C95 — Leucémie à cellules non précisées · C95.0- aiguë, C95.1- chronique, C95.7- autres, C95.8! réfractaire à l’induction standard, C95.9- sans précision · renvois : C91 — Leucémie lymphoïde, C92 — Leucémie myéloïde, C94 — Autres leucémies de type cellulaire précisé · CIM-10-GM 2024 · Tumeurs · Sang et organes hématopoïétiques</div>
<h1>Leucémie à cellules non précisées</h1><span class="status">Adulte, avec un volet pédiatrique · contenu clinique principal : leucémie aiguë de lignée ambiguë · référentiels : Onkopedia avec <button class="w" data-k="c95-sources-guides">SGH/SSH et SGMO</button>, LMA septembre 2025 et LLA mars 2026 ; revue Haematologica 2025 ; études <button class="w" data-k="c95-sources-guides">EBMT</button> 2017 et 2026 ; étude iBFM-AMBI2012 ; informations professionnelles suisses 2024 à 2026 · état au 15.10.2026 · revue par intelligence artificielle, audit différé, validation médicale indépendante en attente</span></div>
<div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la leucémie à cellules non précisées</button></div>
<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#c95-0">Question clinique</a></li><li><a href="#c95-1">Nosologie, définitions et classifications</a></li><li><a href="#c95-2">Épidémiologie</a></li><li><a href="#c95-3">Du progéniteur à la lignée ambiguë</a></li><li><a href="#c95-4">Causes et facteurs de risque</a></li><li><a href="#c95-5">Interroger</a></li><li><a href="#c95-6">Examiner</a></li><li><a href="#c95-7">Établir le diagnostic et écarter les imitations</a></li><li><a href="#c95-8">Urgences et complications</a></li><li><a href="#c95-9">Prise en charge : choisir le protocole</a></li><li><a href="#c95-10">Sous-groupes : LAPM Ph+, LAI et thérapies ciblées</a></li><li><a href="#c95-11">Allogreffe de cellules souches en première rémission</a></li><li><a href="#c95-12">Réponse, leucémie réfractaire et suivi</a></li><li><a href="#c95-13">Pronostic et situations particulières</a></li><li><a href="#c95-14">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="c95-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p><p>Un homme de 34 ans consulte pour une fièvre depuis quatre jours, une fatigue intense et des saignements des gencives au brossage. L’hémogramme montre 48 G/l de leucocytes, une hémoglobine à 82 g/L et 21 G/l de plaquettes ; le frottis révèle 70 % de <button class="w" data-k="c95-blastes">blastes</button>. Le diagnostic de leucémie aiguë est donc acquis en quelques minutes. <b>La vraie question commence ensuite : de quelle lignée sont ces blastes ?</b> Le laboratoire rapporte que les blastes expriment la myéloperoxydase et, sur la même population, le CD19 avec le CD79a et le CD22. Une seule population cellulaire porte donc les marqueurs de la lignée myéloïde et de la lignée B : c’est le profil d’une <button class="w" data-k="c95-lapm">leucémie aiguë à phénotype mixte</button>.</p><p>Cette réponse commande le traitement. Une leucémie aiguë myéloïde et une leucémie aiguë lymphoblastique ne se soignent pas avec les mêmes protocoles ; lorsque la lignée est ambiguë, le choix du protocole devient lui-même la décision difficile. La catégorie C95 de la CIM-10-GM 2024 existe pour ces situations : elle reçoit les leucémies dont la lignée cellulaire n’est pas attribuée ou ne peut pas être déterminée.</p><p>C95 n’est donc pas une maladie unique mais une <button class="w" data-k="c95-categorie">catégorie de codage</button> au contenu clinique double. D’un côté, la leucémie aiguë de lignée ambiguë (LALA), qui regroupe la leucémie aiguë à phénotype mixte (LAPM) et la leucémie aiguë indifférenciée (LAI). De l’autre, la leucémie « sans précision », le plus souvent un diagnostic provisoire que le bilan de référence doit faire disparaître. Ce double contenu explique l’organisation du chapitre : une grande part porte sur la LALA, seule entité clinique réellement décrite par les sources lues, et une autre sur l’usage correct du code.</p><div class="key"><b>Point de départ.</b> Devant toute leucémie aiguë, deux gestes ne se négocient pas : prouver le seuil de <button class="w" data-k="c95-blastes">20 % de blastes</button> et attribuer une lignée par <button class="w" data-k="c95-cytometrie">cytométrie en flux</button>. La lignée ambiguë est un diagnostic d'exclusion : les <button class="w" data-k="c95-exclusion">leucémies myéloïdes définies génétiquement</button> priment toujours.</div><p>Le chapitre suit l’ordre d’une consultation réelle : définir et classer (îlots 1 et 2), comprendre le mécanisme et les causes (îlots 3 et 4), interroger et examiner (îlots 5 et 6), établir le diagnostic (îlot 7), gérer l’urgence (îlot 8), traiter (îlots 9 à 11), puis suivre et pronostiquer (îlots 12 et 13). L’îlot 14 résume les critères formels et les paramètres clés.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a>.</p></section><section class="ilot" id="c95-1"><h2><span class="n">1</span>Nosologie, définitions et classifications</h2><h3>Ce que contient la catégorie C95</h3><p>La CIM-10-GM 2024 réunit sous C95 les leucémies « à cellules non précisées » : la cellule leucémique n’est pas classée dans une lignée, ou sa lignée n’a pas été déterminée. Les sous-codes se lisent avec un cinquième caractère, qui indique le statut de rémission. Le tableau ci-dessous reprend les intitulés français de l’Office fédéral de la statistique et les notes du BfArM.</p><table class="t"><tr><th>Code</th><th>Intitulé</th><th>Contenu clinique réel</th></tr><tr><td>C95.0-</td><td>Leucémie aiguë à cellules non précisées</td><td>Leucémie aiguë biphénotypique, bilinéale ou de lignée mixte ; leucémie à cellules souches de lignée incertaine</td></tr><tr><td>C95.1-</td><td>Leucémie chronique à cellules non précisées</td><td>Aucune entité clinique décrite dans les sources lues ; code de documentation incomplète</td></tr><tr><td>C95.7-</td><td>Autres leucémies à cellules non précisées</td><td>Aucune entité clinique décrite dans les sources lues</td></tr><tr><td>C95.8!</td><td>Leucémie, réfractaire au traitement d’induction standard</td><td>Code additionnel qui s’ajoute à un autre code de leucémie ; il n’a pas de cinquième caractère</td></tr><tr><td>C95.9-</td><td>Leucémie, sans précision</td><td>Diagnostic provisoire ou incomplet</td></tr></table><p>Le tableau appelle trois commentaires. Premièrement, seul C95.0- correspond à un tableau clinique décrit : c’est lui qui fonde la suite du chapitre. Deuxièmement, la mention « exclut » de la CIM-10-GM place l’exacerbation aiguë d’une leucémie chronique sans précision en C95.1- et non en C95.0-. Troisièmement, le point d’exclamation de C95.8! signale un <button class="w" data-k="c95-c958">code additionnel</button> : il n’existe pas seul, il qualifie une leucémie déjà codée par ailleurs.</p><h3>Le cinquième caractère</h3><p>Pour les catégories C90 à C95, le cinquième caractère vaut <b>0</b> en l’absence de rémission complète (la rémission partielle et l’absence d’indication de rémission sont incluses) et <b>1</b> en rémission complète. La page BfArM 2024 lue ne définit pas de cinquième caractère « 2 ». Le codeur applique donc une règle simple : la rémission est complète ou ne l’est pas, et seule une rémission complète documentée justifie le « 1 ». <button class="w" data-k="c95-cim-5e">Le détail du codage figure dans la fenêtre.</button></p><h3>Deux définitions à connaître par cœur</h3><p>La LALA est une leucémie aiguë rare, à haut risque, dont on ne peut pas attribuer une lignée unique. Elle regroupe deux entités :</p><ul><li>la <b>LAPM</b>, dont les blastes expriment des marqueurs de plus d’une lignée. Elle est <button class="w" data-k="c95-lapm">biphénotypique</button> lorsqu’une seule population porte les marqueurs de deux lignées, et <b>bilinéale</b> lorsque deux populations distinctes coexistent ;</li><li>la <b>LAI</b>, dans laquelle les blastes n’expriment aucun marqueur définissant une lignée. Le critère admet au plus un marqueur associé par lignée ; la plupart des cas expriment un marqueur myéloïde, le CD34, le HLA-DR et la TdT (voir <button class="w" data-k="c95-lai">LAI</button>).</li></ul><p>Le seuil commun aux classifications <button class="w" data-k="c95-who-icc">OMS 5e édition et ICC 2022</button> est d’au moins 20 % de blastes dans le sang ou la moelle. Ce seuil est le même que celui de la leucémie aiguë myéloïde (hors anomalies génétiques définissantes). La nomenclature allemande des leucémies aiguës lymphoblastiques retient 25 % de blastes médullaires, en dessous desquels on parle de lymphome lymphoblastique.</p><h3>Comment on attribue une lignée</h3><p>L’attribution de lignée repose sur l’immunophénotype des blastes : on compare leurs marqueurs à ceux des progéniteurs normaux. Le tableau résume les critères de la classification de l’OMS 5e édition et de l’ICC 2022.</p><table class="t"><tr><th>Lignée</th><th>Critère d’attribution</th></tr><tr><td>Myéloïde</td><td>Myéloperoxydase (MPO) positive, soit plus de 50 % de l’intensité des neutrophiles matures, soit un profil de type progéniteurs CD34+ normaux ; si la MPO est faible ou absente : au moins 2 des 5 marqueurs monocytaires (CD11c, CD14, CD64, lysozyme, estérase non spécifique)</td></tr><tr><td>T</td><td>CD3 cytoplasmique ou membranaire à plus de 50 % de l’intensité des lymphocytes T matures, sur au moins une partie des blastes</td></tr><tr><td>B</td><td>CD19 à plus de 50 % de l’intensité des progéniteurs B normaux, associé à au moins un marqueur parmi CD10, CD22 et CD79a ; si le CD19 est plus faible : au moins 2 marqueurs supplémentaires</td></tr></table><p>La MPO est le marqueur myéloïde le plus spécifique parce qu’elle est une enzyme des granules des cellules myéloïdes : sa présence dans un blaste signe l’engagement vers cette lignée. Le CD3 est le marqueur de lignée T le plus spécifique pour la raison inverse : il appartient au complexe de reconnaissance de l’antigène des lymphocytes T. Pour la lignée B, le CD19 est le marqueur le plus précoce ; c’est pourquoi on exige de lui une intensité comparable à celle des progéniteurs B normaux, puis un second marqueur qui confirme l’engagement. Les <button class="w" data-k="c95-crit-b">critères B</button> et les <button class="w" data-k="c95-crit-t">critères T</button> sont détaillés en fenêtre.</p><h3>Sous-types et sous-groupes génétiques</h3><p>Les sous-types par lignées sont : B/myéloïde (environ deux tiers des cas), puis T/myéloïde ; les formes B/T, B/T/myéloïde et T/mégacaryoblastique sont rares. Dans la revue de Karasek 2025, la répartition est de 59 % pour B/myéloïde et 35 % pour T/myéloïde. Les sous-groupes définis par la génétique sont :</p><ul><li><b>BCR::ABL1</b>, dans 15 à 20 % des LAPM, chez des sujets plus âgés et avec un phénotype B/myéloïde ;</li><li><b>KMT2A réarrangé</b>, environ 10 % des cas, surtout chez le nourrisson et l’enfant ;</li><li><b>ZNF384 réarrangé</b>, jusqu’à la moitié des LAPM B/myéloïdes pédiatriques, rare chez l’adulte ;</li><li><b>activation de BCL11B</b>, 10 à 15 % des LAPM, environ un tiers des LAPM T/myéloïdes.</li></ul><p>Onkopedia LMA 2025 liste dans son tableau 4 : leucémie aiguë de lignée incertaine, LAI, LAPM avec t(9;22) BCR::ABL1, LAPM avec réarrangement KMT2A, LAPM B/myéloïde sans autre précision et LAPM T/myéloïde sans autre précision.</p><div class="key"><b>À retenir.</b> C95 est un code, pas une maladie. Le contenu clinique est la LALA : LAPM (deux lignées, avec ses sous-groupes BCR::ABL1, KMT2A, ZNF384 et BCL11B) ou LAI (aucune lignée). Le seuil est de 20 % de blastes. La lignée se prouve par la MPO, le CD3 et le CD19 comparés à des cellules normales.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024 (OFS)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://doi.org/10.3389/fped.2025.1715087" target="_blank" rel="noopener">Karasek et al. 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LLA 2026</a>.</p></section><section class="ilot" id="c95-2"><h2><span class="n">2</span>Épidémiologie</h2><h3>En Suisse</h3><p>Le rapport de l’Office fédéral de la statistique sur le cancer (période 2013 à 2017) recense environ 1150 leucémies par an pour l’ensemble des catégories C91 à C95, soit environ 700 hommes et 450 femmes, un peu moins de 3 % des cancers. Le risque cumulé de leucémie est de 1,4 % chez l’homme et de 0,9 % chez la femme. Les leucémies causent environ 600 décès par an, soit environ 3,5 % des décès par cancer. L’âge médian au diagnostic est de 69 ans pour la leucémie myéloïde et de 68 ans (hommes) à 70 ans (femmes) pour la leucémie lymphoïde.</p><p>Aucun chiffre suisse n’isole la catégorie C95. Les chiffres ci-dessus donnent donc le cadre général des leucémies, non l’incidence de C95.</p><h3>Dans la littérature</h3><p>La LALA représente environ 2 à 3 % des leucémies aiguës ; l’incidence rapportée par le registre américain SEER est de 0,35 par million de personnes-années. La revue de Karasek 2025 situe la LAPM à 1 à 5 % des leucémies aiguës. Ces données sont nord-américaines pour la plupart et ne servent ici qu’à situer la rareté.</p><p>Pour comparer, la leucémie aiguë myéloïde a une incidence d’environ 3,7 pour 100 000 par an (plus de 100 pour 100 000 après 70 ans). La leucémie aiguë lymphoblastique atteint 1,1 pour 100 000 par an, avec un pic avant 5 ans (5,3 pour 100 000) et un second pic après 80 ans.</p><p>Le tableau compare les incidences annuelles des trois entités concernées.</p><table class="t"><tr><th>Maladie</th><th>Incidence annuelle</th><th>Particularité de l’âge</th></tr><tr><td>LMA</td><td>Environ 3,7 / 100 000</td><td>Plus de 100 / 100 000 après 70 ans</td></tr><tr><td>LLA</td><td>1,1 / 100 000</td><td>Pic avant 5 ans, second pic après 80 ans</td></tr><tr><td>LALA</td><td>Environ 0,35 / million (SEER)</td><td>LAPM : 1 à 5 % des leucémies aiguës ; pronostic meilleur chez l’enfant</td></tr></table><p>Le tableau montre que la LALA est environ cent fois moins fréquente que la LMA. Cette rareté a une conséquence pratique : aucun médecin ne voit beaucoup de cas dans sa carrière, d’où l’importance de reconnaître le profil et d’adresser tôt à un centre d’hématologie.</p><h3>Facteurs de risque généraux des leucémies</h3><p>Le rapport suisse cite comme facteurs de risque des leucémies le benzène, le formaldéhyde, l’oxyde d’éthylène et le 1,3-butadiène, les agents alkylants et les inhibiteurs de la topo-isomérase II (étoposide), les rayonnements ionisants, le tabac et la trisomie 21 (voir <button class="w" data-k="c95-facteurs">facteurs de risque</button>). Ces facteurs sont décrits pour les leucémies en général ; aucune des sources lues ne les rapporte spécifiquement à la LALA.</p><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">Le cancer en Suisse, OFS 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://doi.org/10.3389/fped.2025.1715087" target="_blank" rel="noopener">Karasek et al. 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LLA 2026</a>.</p></section><section class="ilot" id="c95-3"><h2><span class="n">3</span>Du progéniteur à la lignée ambiguë</h2><h3>Le principe : une lignée se construit</h3><p>Dans la moelle, les précurseurs hématopoïétiques produisent les leucocytes. À mesure qu’un progéniteur mûrit, il s’engage dans une lignée, lymphoïde (B ou T) ou myéloïde, et exprime les marqueurs correspondants. La classification des leucémies aiguës attribue une lignée aux blastes par ressemblance avec les progéniteurs normaux : le blaste qui exprime la MPO ressemble à un progéniteur myéloïde, celui qui exprime le CD19 et le CD79a à un progéniteur B.</p><p>Une leucémie naît lorsque des précurseurs immatures prolifèrent sans contrôle et envahissent la moelle puis le sang, à un stade où ils sont non fonctionnels. La distinction lymphoïde ou myéloïde dépend du précurseur atteint par la transformation.</p><h3>Là où la LALA échappe à la règle</h3><p>La LALA échappe à cette attribution parce que les blastes n'ont pas choisi une lignée unique : soit ils n’ont engagé aucune lignée (LAI), soit ils en expriment plusieurs (LAPM). Cette absence d’engagement ou cet engagement multiple expliquent à la fois le diagnostic difficile et la mauvaise réponse aux traitements conçus pour une lignée précise. On peut raisonner qu'un traitement conçu pour une lignée risque de ne pas atteindre la composante de l'autre lignée ; les sources lues ne démontrent pas ce mécanisme, elles montrent seulement que les protocoles de type LLA donnent de meilleurs résultats.</p><svg viewBox="0 0 560 250" role="img" aria-label="Progéniteur normal engagé dans une lignée, leucémie aiguë à phénotype mixte et leucémie aiguë indifférenciée" font-family="Atkinson Hyperlegible, sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="10" y="20" width="170" height="200" rx="6"/><rect x="195" y="20" width="170" height="200" rx="6"/><rect x="380" y="20" width="170" height="200" rx="6"/><circle cx="95" cy="75" r="22"/><circle cx="280" cy="75" r="22"/><circle cx="465" cy="75" r="22" stroke-dasharray="4 4"/><path d="M95 97V135M280 97V135M280 97L240 135M280 97L320 135"/><rect x="60" y="135" width="70" height="28"/><rect x="205" y="135" width="70" height="28"/><rect x="285" y="135" width="70" height="28"/></g><g fill="#222"><text x="22" y="14" font-weight="bold">Normal</text><text x="207" y="14" font-weight="bold">LAPM</text><text x="392" y="14" font-weight="bold">LAI</text><text x="40" y="79">Progéniteur</text><text x="225" y="79">Blaste</text><text x="402" y="79">Blaste</text><text x="70" y="154">Myéloïde</text><text x="209" y="154">Myéloïde</text><text x="311" y="154">B</text><text x="26" y="188">Une lignée</text><text x="26" y="206">attribuée</text><text x="207" y="188">Plusieurs lignées</text><text x="207" y="206">sur les blastes</text><text x="392" y="140">Aucun marqueur</text><text x="392" y="158">définissant</text><text x="392" y="176">une lignée</text><text x="392" y="206">≤ 1 marqueur par lignée</text></g></svg><p><i>Figure. Le progéniteur normal s’engage dans une seule lignée ; dans la leucémie aiguë de lignée ambiguë, les blastes portent les marqueurs de plusieurs lignées (LAPM) ou d’aucune (LAI).</i></p><h3>La génétique : un fond clonal complexe</h3><p>Des anomalies cytogénétiques sont retrouvées dans jusqu’à 90 % des LAPM, surtout sous forme de caryotypes complexes. Quatre altérations définissent des sous-groupes : les fusions <button class="w" data-k="c95-bcrabl1">BCR::ABL1</button>, <button class="w" data-k="c95-kmt2a">KMT2A</button> et <button class="w" data-k="c95-znf384">ZNF384</button>, et l’<button class="w" data-k="c95-bcl11b">activation de BCL11B</button>. Des mutations liées à la myélodysplasie sont fréquentes (environ 32 % des LAPM et 59 % des LAI) ; elles déplacent le diagnostic vers la leucémie myéloïde (voir <button class="w" data-k="c95-exclusion">diagnostic d’exclusion</button>).</p><h3>Le changement de lignée sous traitement</h3><p>Une leucémie aiguë lymphoblastique B soumise à une pression thérapeutique spécifique de lignée (CAR-T dirigés contre le CD19, blinatumomab) peut basculer vers une autre lignée. Dans la série rapportée, la bascule aboutit à une leucémie aiguë myéloïde dans 75,7 % des cas et à une LAPM ou une LAI dans 24,3 % ; elle survient dans les six mois chez 81,4 % des patients, et la survie médiane après la bascule est de 4,8 mois. Le réarrangement KMT2A est présent dans 64 % des bascules vers la leucémie myéloïde. Ce phénomène, le <button class="w" data-k="c95-lineage-switch">changement de lignée</button>, illustre le mécanisme : le traitement détruit les cellules qui portent la cible et sélectionne un clone qui ne la porte pas.</p><h3>La conséquence commune : l’insuffisance médullaire</h3><p>Quelle que soit la lignée, la prolifération blastique occupe la moelle et chasse les précurseurs normaux. <button class="w" data-k="c95-insuffisance">L’insuffisance médullaire</button> produit une anémie (fatigue, pâleur), une neutropénie (infections bactériennes et mycoses) et une thrombopénie (pétéchies, ecchymoses, épistaxis, ménorragies). Ces trois cytopénies expliquent presque tous les motifs de consultation.</p><div class="key"><b>À retenir.</b> La lignée ambiguë n’est pas une erreur du laboratoire mais un état biologique : des blastes non engagés ou engagés dans plusieurs lignées. Elle explique l’échec des protocoles à lignée unique. Le changement de lignée sous CAR-T ou blinatumomab en est la version thérapeutique.</div><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">Le cancer en Suisse, OFS 2021</a> ; <a href="https://doi.org/10.1182/hematology.2024000554" target="_blank" rel="noopener">Weinberg, Hematology 2024</a> ; <a href="https://doi.org/10.3389/fped.2025.1715087" target="_blank" rel="noopener">Karasek et al. 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://doi.org/10.1111/ijlh.14529" target="_blank" rel="noopener">Kirtek et Weinberg 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a>.</p></section><section class="ilot" id="c95-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Les sources lues ne décrivent aucune cause établie propre à la LALA. Cette absence est elle-même une information : le médecin ne doit pas chercher une exposition précise pour confirmer le diagnostic, ni en conclure à l’absence de cause. Il reprend plutôt les <button class="w" data-k="c95-facteurs">facteurs de risque des leucémies</button> que cite le rapport suisse, et il relève les situations de contexte que décrit la littérature sur la LALA.</p><table class="t"><tr><th>Facteur</th><th>Source et portée</th><th>Ce que le médecin en fait</th></tr><tr><td>Benzène, formaldéhyde, oxyde d’éthylène, 1,3-butadiène</td><td>Rapport suisse, leucémies en général</td><td>Rechercher une exposition professionnelle</td></tr><tr><td>Agents alkylants, étoposide (inhibiteur de topo-isomérase II)</td><td>Rapport suisse, leucémies en général</td><td>Rechercher une chimiothérapie antérieure ; évoquer la forme post-thérapeutique</td></tr><tr><td>Rayonnements ionisants</td><td>Rapport suisse</td><td>Antécédent de radiothérapie</td></tr><tr><td>Tabac</td><td>Rapport suisse</td><td>Quantifier le tabagisme</td></tr><tr><td>Trisomie 21</td><td>Rapport suisse</td><td>Terrain constitutionnel connu</td></tr><tr><td>Immunothérapie anti-CD19 antérieure</td><td>Revue 2025, mécanisme de bascule</td><td>Penser au changement de lignée</td></tr><tr><td>Leucémie post-thérapeutique au phénotype mixte</td><td>Revue 2025</td><td>Pronostic plus sombre que la LAPM d’emblée</td></tr></table><p>Le tableau se lit en deux temps. Les quatre premières lignes (toxiques, chimiothérapie, radiations, tabac) sont des facteurs du risque de leucémie en général ; la trisomie 21 en est le facteur constitutionnel. Les deux dernières lignes concernent la LALA : un patient déjà traité pour une leucémie lymphoblastique B par une immunothérapie dirigée contre le CD19 peut développer une leucémie de lignée différente, et une LMA post-thérapeutique au phénotype mixte a un pronostic plus sombre que la LAPM d’emblée (survie médiane de 10,3 mois contre 42,8 mois).</p><div class="trap"><span class="k">Piège</span> L’absence de facteur de risque ne rend pas le diagnostic improbable. La plupart des patients atteints de leucémie aiguë n’ont aucune exposition identifiée : on ne s’appuie jamais sur l’anamnèse pour décider de la recherche de la lignée.</div><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">Le cancer en Suisse, OFS 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></section><section class="ilot" id="c95-5"><h2><span class="n">5</span>Interroger</h2><h3>Un tableau qui s’installe en quelques jours</h3><p>Les leucémies aiguës s’installent en quelques jours à quelques semaines. Selon Onkopedia, environ un tiers des patients atteints de LLA se présentent avec une infection ou une hémorragie. L’interrogatoire cherche donc d’abord les trois conséquences de l’<button class="w" data-k="c95-insuffisance">insuffisance médullaire</button>, puis les signes d’infiltration, puis le contexte.</p><table class="t"><tr><th>Question</th><th>Ce qu’elle cherche</th><th>Raison</th></tr><tr><td>Fatigue, dyspnée, pâleur, palpitations</td><td>Anémie</td><td>Le transport d’oxygène baisse ; le cœur et la respiration compensent</td></tr><tr><td>Fièvre, infections répétées, ulcérations buccales</td><td>Neutropénie</td><td>Les polynucléaires neutrophiles défendent contre les bactéries et les mycoses</td></tr><tr><td>Saignements des gencives, épistaxis, pétéchies, règles abondantes</td><td>Thrombopénie, CIVD</td><td>Les plaquettes ferment les brèches vasculaires</td></tr><tr><td>Douleurs osseuses, gonflement ganglionnaire, céphalées</td><td>Infiltration</td><td>La moelle, les ganglions et le système nerveux central peuvent être envahis</td></tr><tr><td>Amaigrissement, sueurs, fièvre prolongée</td><td>Syndrome tumoral</td><td>Hypercatabolisme</td></tr><tr><td>Antécédents de chimiothérapie, de radiothérapie, d’immunothérapie anti-CD19, exposition professionnelle</td><td>Contexte</td><td>Voir [[c95-facteurs</td><td>facteurs de risque]]</td></tr></table><p>Aucune source lue ne décrit un tableau clinique propre à la LALA qui la distinguerait de celui des LMA ou des LLA. L’interrogatoire ne sépare donc pas ces entités : il prépare le diagnostic biologique, qui seul attribue la lignée.</p><h3>Forme typique et formes trompeuses</h3><div class="two"><div class="card"><h4>Forme typique</h4><p>Un homme de 34 ans présente une fièvre de quatre jours, des saignements gingivaux et une fatigue intense. L’hémogramme montre une hyperleucocytose et des blastes. La cytométrie révèle des blastes à la fois myéloïdes et B. Le diagnostic est biologique, jamais clinique.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Un compte de globules blancs normal ou bas n’exclut pas une leucémie : l’hyperleucocytose existe chez environ 60 % des patients seulement. Un patient traité par CAR-T ou blinatumomab peut rechuter sous une autre lignée, avec un tableau banal.</p></div></div><div class="trap"><span class="k">Piège</span> Le motif de consultation d’une LALA est celui de toute leucémie aiguë. Ne pas nommer la lignée avant le laboratoire.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LLA 2026</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></section><section class="ilot" id="c95-6"><h2><span class="n">6</span>Examiner</h2><h3>Le trajet de l'examen</h3><p>L’examen suit l’ordre habituel : état général et tolérance, constantes, peau et muqueuses, aires ganglionnaires, abdomen, système nerveux. Chaque signe renvoie à un mécanisme.</p><ul><li><b>Pâleur cutanéo-muqueuse, tachycardie</b> : traduction de l’anémie.</li><li><b>Pétéchies, ecchymoses, saignement gingival</b> : traduction de la thrombopénie. Une atteinte plus profonde (hémorragie rétinienne, saignement digestif) suggère une <button class="w" data-k="c95-civd">CIVD</button> ou une <button class="w" data-k="c95-leucostase">leucostase</button>.</li><li><b>Fièvre, foyers infectieux</b> : traduction de la neutropénie. Toute fièvre chez un patient suspect est une urgence infectieuse.</li><li><b>Adénopathies</b> (environ 60 % des LLA) et <b>splénomégalie</b> (aussi fréquente) : signes d’infiltration lymphoïde.</li><li><b>Masse médiastinale</b> (14 % des LLA, 60 % des LLA-T) : cherchée à la radiographie, et à l’examen par une dyspnée ou un syndrome cave.</li><li><b>Infiltrats cutanés, hyperplasie gingivale, hépatosplénomégalie, signes méningés</b> : plus fréquents dans les formes myélomonocytaires ou monoblastiques.</li><li><b>Atteinte du système nerveux central</b> (7 % des LLA) : paires crâniennes, céphalées, raideur de nuque.</li></ul><p>Le tableau rattache chaque signe à son mécanisme et à ce qu’il oriente.</p><table class="t"><tr><th>Signe</th><th>Mécanisme</th><th>Ce qu’il oriente</th></tr><tr><td>Adénopathies, splénomégalie, masse médiastinale</td><td>Infiltration lymphoïde</td><td>Composante lymphoïde (B ou T)</td></tr><tr><td>Infiltrats cutanés, hyperplasie gingivale</td><td>Infiltration monocytaire</td><td>Composante myéloïde, plutôt monocytaire</td></tr><tr><td>Hémorragies étendues, ecchymoses spontanées</td><td>Thrombopénie et coagulopathie</td><td>Rechercher une CIVD</td></tr><tr><td>Dyspnée, hypoxie, signes neurologiques</td><td>Leucostase</td><td>Urgence hématologique</td></tr></table><p>Le tableau associe chaque signe à sa signification. Il ne remplace pas la cytométrie : un patient sans adénopathie peut avoir une composante lymphoïde, et un patient avec hyperplasie gingivale une LAPM. Le facteur pronostique défavorable décrit pour la LAPM est une leucocytose élevée ou une atteinte extramédullaire.</p><div class="key"><b>À retenir.</b> L’examen mesure la tolérance et décide de l’urgence. Une pâleur, un saignement ou une fièvre mènent à l’hémogramme et au frottis ; une masse médiastinale ou une atteinte du système nerveux central orientent vers la composante lymphoïde. L’examen n’attribue jamais la lignée.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LLA 2026</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a> ; <a href="https://doi.org/10.3389/fped.2025.1715087" target="_blank" rel="noopener">Karasek et al. 2025</a>.</p><button class="pareto-btn ui" data-k="pareto-c95-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
