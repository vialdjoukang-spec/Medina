<template data-pop="c95-insuffisance" data-title="Insuffisance médullaire"><p>Les blastes occupent la moelle et chassent les précurseurs normaux. La production de globules rouges, de neutrophiles et de plaquettes baisse. Les trois cytopénies expliquent les symptômes : fatigue et pâleur (anémie), infections bactériennes et mycoses (neutropénie), pétéchies, ecchymoses, épistaxis et ménorragies (thrombopénie).</p><p>Le mécanisme est un encombrement : plus la moelle est envahie, moins elle produit de cellules normales. Une hyperleucocytose faite de blastes ne protège donc pas contre l'infection : les blastes ne remplacent pas les neutrophiles.</p><p class="src">Référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a>.</p></template>
<template data-pop="c95-civd" data-title="CIVD et hyperfibrinolyse"><p>La coagulation intravasculaire disséminée associe consommation de facteurs de coagulation et saignements. Onkopedia cite la CIVD et l'hyperfibrinolyse parmi les complications des leucémies myéloïdes. La CIVD décompensée est une urgence : traitement intensif immédiat. La leucémie aiguë promyélocytaire est l'exemple le plus connu, d'où l'ATRA sans délai en cas de suspicion.</p><p class="src">Référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a>.</p></template>
<template data-pop="c95-leucostase" data-title="Leucostase"><p>La leucostase est l'obstruction de la microcirculation par un excès de blastes circulants. Le risque apparaît au-delà d'environ 100 000 leucocytes par microlitre. Les signes sont l'hypoxie, les infiltrats pulmonaires, les hémorragies rétiniennes et les signes neurologiques.</p><p>Le traitement associe cytoréduction (hydroxyurée 4 à 5 g par jour, cytarabine si insuffisant) et, exceptionnellement, leucaphérèse toujours accompagnée de chimiothérapie. Les anthracyclines ne se donnent que lorsque les leucocytes sont inférieurs à 30 G/l.</p><p class="src">Référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a>.</p></template>
<template data-pop="c95-lyse" data-title="Syndrome de lyse tumorale"><p>Le traitement détruit rapidement de nombreux blastes, qui libèrent acide urique, potassium et phosphate dans le sang. Le risque est rénal et métabolique. Dans la LLA, une préphase de dexaméthasone, avec ou sans cyclophosphamide, pendant environ cinq jours prévient la lyse. La rasburicase traite l'hyperuricémie, mais pas les autres troubles ioniques.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LLA 2026</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">Fasturtec®</a>.</p></template>
<template data-pop="c95-induction" data-title="Induction de type LLA"><p>Une induction de type LLA est un traitement initial conçu pour la leucémie lymphoblastique aiguë. Il est recommandé pour la plupart des LAPM par la revue Haematologica 2025, et Onkopedia LLA 2026 traite la LAPM selon les protocoles LLA. Chez l'enfant, l'étude iBFM-AMBI2012 le confirme (survie sans événement à 5 ans de 80 %).</p><p>Le raisonnement est comparatif : les protocoles de type LMA ont donné 36 % de survie sans événement dans la même étude, et les protocoles hybrides sont associés à une survie inférieure. Les sources lues ne décrivent pas les molécules du protocole.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LLA 2026</a> ; <a href="https://doi.org/10.1182/blood-2017-12-821363" target="_blank" rel="noopener">iBFM-AMBI2012, Blood 2018</a>.</p></template>
<template data-pop="c95-ibfm" data-title="Étude iBFM-AMBI2012"><p>Cette étude internationale a rassemblé 233 enfants atteints de leucémie de lignée ambiguë, sur cinq continents mais essentiellement en Europe. La survie sans événement à 5 ans est de 80 ± 4 % avec un traitement de type LLA, 36 ± 7,2 % avec un traitement de type LMA et 50 ± 12 % avec un traitement combiné.</p><p>Elle conclut à l'induction de type LLA en première intention, au traitement de type LMA seulement pour une minorité CD19-négative sans autre caractère lymphoïde, et à un changement de protocole seulement si 5 % de blastes ou plus subsistent après l'induction. Elle ne montre pas de bénéfice global de l'allogreffe, à réserver aux mauvais répondeurs. L'étude est observationnelle : les groupes ne sont pas randomisés.</p><p class="src">Référence : <a href="https://doi.org/10.1182/blood-2017-12-821363" target="_blank" rel="noopener">iBFM-AMBI2012, Blood 2018</a>.</p></template>
<template data-pop="c95-ebmt" data-title="Études EBMT sur l&#x27;allogreffe"><p>Les deux études du groupe de travail sur les leucémies aiguës de l'EBMT (Société européenne de greffe de moelle) sont rétrospectives et ne comparent pas avec l'absence de greffe.</p><table class="t"><tr><th>Étude</th><th>Patients</th><th>Survie globale</th><th>Survie sans leucémie</th><th>Rechute</th><th>Mortalité non liée à la rechute</th></tr><tr><td>2017 (3 ans)</td><td>519 adultes</td><td>56,3 %</td><td>46,5 %</td><td>31,4 %</td><td>22,1 %</td></tr><tr><td>2026 (2 ans)</td><td>195 adultes</td><td>70,7 %</td><td>56,4 %</td><td>29,8 %</td><td>13,8 %</td></tr></table><p>Les durées de suivi sont différentes (3 ans contre 2 ans) : les deux séries ne se comparent pas directement. Le conditionnement myéloablatif est associé à de meilleurs résultats dans les deux études, et les cellules souches périphériques à moins de rechutes dans l'étude de 2026. L'étude de 2017 suggère un effet greffon contre leucémie.</p><p class="src">Références : <a href="https://doi.org/10.3324/haematol.2017.174441" target="_blank" rel="noopener">EBMT 2017</a> ; <a href="https://doi.org/10.1038/s41409-026-02920-2" target="_blank" rel="noopener">EBMT 2026</a>.</p></template>
<template data-pop="c95-hors-etiquette" data-title="Usage hors étiquette"><p>Un médicament est utilisé hors étiquette lorsque l'indication n'est pas celle de l'information professionnelle suisse. L'imatinib et le ponatinib ont pour indication la LLA Ph+ ; leur emploi dans la LAPM Ph+ est hors étiquette. Le médecin documente la raison (littérature, comité).</p><p>Le fait de s'appuyer sur une recommandation, comme celle d'Onkopedia ou de la revue de 2025, n'équivaut pas à une indication autorisée.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680563950023" target="_blank" rel="noopener">Glivec®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680630970053" target="_blank" rel="noopener">Iclusig®</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></template>
<template data-pop="c95-d-imatinib" data-title="Imatinib (Glivec®)"><p>L'imatinib est inscrit en Suisse pour la LLA Ph+ de l'adulte et de l'enfant, en association à une chimiothérapie standard. La dose est de 600 mg par jour chez l'adulte et de 340 mg/m² par jour chez l'enfant. Associé à la chimiothérapie, il expose à une hépatotoxicité de grade 3 ou 4, parfois fatale. Chez les patients cardiaques, la fraction d'éjection est surveillée.</p><p>L'information professionnelle lue date de juillet 2026. La LAPM Ph+ n'y figure pas : usage hors étiquette.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680563950023" target="_blank" rel="noopener">Glivec®</a>.</p></template>
<template data-pop="c95-d-ponatinib" data-title="Ponatinib (Iclusig®)"><p>Le ponatinib est inscrit pour la LLA Ph+ avec mutation T315I ou lorsque les autres ITK ne conviennent pas. La dose lue est de 45 mg par jour. Le risque d'événements artériels occlusifs dépend de la dose. L'information professionnelle lue date de septembre 2024. Son emploi dans la LAPM Ph+ est hors étiquette.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680630970053" target="_blank" rel="noopener">Iclusig®</a>.</p></template>
<template data-pop="c95-d-rasburicase" data-title="Rasburicase (Fasturtec®)"><p>La rasburicase traite et prévient l'hyperuricémie aiguë des leucémies aiguës à forte masse tumorale, à 0,20 mg/kg par jour jusqu'à 7 jours. Elle est contre-indiquée en cas de déficit en G6PD, parce que la dégradation de l'acide urique produit du peroxyde d'hydrogène qui provoque une hémolyse. Elle expose aussi à la méthémoglobinémie et à l'anaphylaxie. Elle n'agit pas directement sur l'hyperkaliémie, l'hyperphosphatémie ni l'hypocalcémie.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">Fasturtec®</a>.</p></template>
<template data-pop="c95-d-hydroxycarbamide" data-title="Hydroxycarbamide (Litalir®)"><p>L'indication suisse est la leucémie myéloïde chronique et d'autres néoplasies myéloprolifératives. Le médicament est contre-indiqué en cas de grossesse ou d'allaitement. Une surveillance hématologique hebdomadaire est prévue au début du traitement, et une pneumopathie interstitielle est possible.</p><p>La cytoréduction de la leucostase par 4 à 5 g par jour d'hydroxyurée est une recommandation Onkopedia, non une indication nommée de l'information professionnelle.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680529580165" target="_blank" rel="noopener">Litalir®</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a>.</p></template>
<template data-pop="c95-rc" data-title="Critères de réponse"><p>Selon Onkopedia (ELN), la rémission complète demande : blastes médullaires sous 5 %, aucune atteinte extramédullaire, neutrophiles d'au moins 1000/µl, plaquettes d'au moins 100 000/µl et aucun blaste circulant. Les rémissions incomplètes (RCh, RCi) et le statut MLFS en sont des variantes définies par Onkopedia. Les critères de la LMA s'appliquent ici à la LALA par défaut de critères propres dans les sources lues.</p><p class="src">Référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a>.</p></template>
<template data-pop="c95-mrd" data-title="Maladie résiduelle mesurable"><p>La maladie résiduelle mesurable (MRD) désigne les cellules leucémiques que la morphologie ne voit plus. Une MRD négative est associée à une meilleure survie. Chez l'enfant, dans une série de 112 cas, une MRD positive en fin d'induction a un risque relatif de 6,00 pour la survie sans événement et de 9,57 pour la survie. Il ne faut pas fonder seule une décision majeure sur la MRD hors essai. Dans la LLA, les méthodes atteignent 10⁻⁴ et les contrôles se font tous les trois mois.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LLA 2026</a>.</p></template>
<template data-pop="c95-medecin" data-title="Lacune : le médecin de premier recours"><p>Aucune source suisse en texte intégral n'a été lue sur le rôle du médecin de premier recours. Le chapitre n'invente donc pas de conduite. Les complications entre les cycles (fièvre en neutropénie, saignement) relèvent des urgences décrites à l'îlot 8, et le suivi de la maladie relève du centre d'hématologie.</p><p class="src">Référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a>.</p></template>
<template data-pop="c95-pronostic" data-title="Lire les chiffres de pronostic"><p>Les chiffres de survie viennent de registres et de cohortes nord-américains (SEER, cohorte de 4756 adultes) : le risque de décès est supérieur de 59 % à celui de la LLA et de 26 % à celui de la LMA, la survie médiane de 4,2 mois, la mortalité à 30 jours de 33 %. Ils décrivent la gravité dans une population âgée (âge médian 68 ans), pas l'effet d'un traitement. Pour la LAI, la survie médiane est de 1,4 mois dans cette cohorte. En Suisse, le rapport de l'OFS indique un pronostic très bon chez l'enfant et moins favorable chez l'adulte.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">Le cancer en Suisse, OFS 2021</a>.</p></template>
<template data-pop="pareto-c95-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="c95-0,c95-1,c95-2,c95-3,c95-4,c95-5,c95-6"></p><ul><li>C95 est une catégorie de codage ; son contenu clinique est la leucémie aiguë de lignée ambiguë, avec la LAPM (deux lignées) et la LAI (aucune).</li><li>Seuil de la leucémie aiguë : au moins 20 % de blastes dans le sang ou la moelle.</li><li>Lignée : MPO supérieure à 50 % de l'intensité des neutrophiles (myéloïde), CD3 supérieur à 50 % (T), CD19 supérieur à 50 % avec CD10, CD22 ou CD79a (B).</li><li>Sous-groupes de LAPM : BCR::ABL1 (15 à 20 %), KMT2A (environ 10 %), ZNF384 (enfant), BCL11B (10 à 15 %).</li><li>Le tableau clinique est celui de toute leucémie aiguë : anémie, neutropénie, thrombopénie. Aucun signe ne distingue la LALA.</li><li>Suisse : environ 1150 leucémies et 600 décès par an (C91 à C95) ; aucune donnée propre à C95.</li><li>Le changement de lignée sous CAR-T ou blinatumomab fait penser à la LAPM ou à la LAI en rechute.</li></ul></template>
<template data-pop="pareto-c95-diag" data-title="Pareto — Diagnostic et urgences"><p class="ratio" data-cover="c95-7,c95-8"></p><ul><li>Le diagnostic de LALA est un diagnostic d'exclusion : les LMA définies, les LMA-MR, les formes post-thérapeutiques et la crise blastique de LMC priment.</li><li>La cytométrie en flux est l'examen pivot ; la ponction médullaire est obligatoire.</li><li>Mutations de myélodysplasie : environ 32 % des LAPM et 59 % des LAI ; RUNX1 fait exception.</li><li>Urgences : leucostase au-delà d'environ 100 000/µl, lyse tumorale, CIVD, neutropénie fébrile, leucémie promyélocytaire (ATRA immédiat).</li><li>Anthracycline seulement après leucocytes inférieurs à 30 G/l ; rasburicase contre-indiquée en cas de déficit en G6PD.</li></ul></template>
<template data-pop="pareto-c95-trait" data-title="Pareto — Prise en charge, suivi et critères"><p class="ratio" data-cover="c95-9,c95-10,c95-11,c95-12,c95-13,c95-14"></p><ul><li>Induction de type LLA pour la plupart des LAPM ; ne pas combiner en protocole hybride (HR 2,11).</li><li>Enfant : survie sans événement à 5 ans de 80 % (type LLA) contre 36 % (type LMA).</li><li>LAPM Ph+ : ajouter un ITK, hors étiquette ; imatinib 600 mg par jour (LLA Ph+ de l'adulte).</li><li>Allogreffe en RC1 chez l'adulte éligible : survie globale de 56,3 % à 3 ans (EBMT 2017) et de 70,7 % à 2 ans (EBMT 2026), données rétrospectives.</li><li>Rémission complète : blastes sous 5 %, neutrophiles d'au moins 1000/µl, plaquettes d'au moins 100 000/µl.</li><li>Réfractaire : C95.8! s'ajoute au code de la leucémie.</li><li>Pronostic : leucémie à haut risque, meilleur chez l'enfant ; chiffres nord-américains descriptifs.</li></ul></template>
<template data-pop="pareto-c95-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="c95-e-1,c95-e-2,c95-e-3,c95-e-4"></p><ul><li>Un examen est utile s'il change la lignée, le sous-groupe génétique, l'urgence ou l'éligibilité à la greffe.</li><li>Cytométrie : on compare l'intensité du blaste à celle d'une cellule normale de référence ; une positivité faible isolée ne définit pas une lignée.</li><li>Panel génétique : BCR::ABL1, KMT2A, panel myéloïde ; FISH FGFR1 si lignée mixte ou changeante.</li><li>Le code C95.9- est provisoire : il se remplace dès que la lignée est connue.</li></ul></template>
<template data-pop="pareto-c95-sci" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="c95-s-histo-body,c95-s-immuno-body,c95-s-gen-body,c95-s-bioc-body"></p><ul><li>La lignée s'acquiert par accumulation de marqueurs ; la LALA fige cet engagement incomplet ou double.</li><li>Critères exprimés en pourcentage de l'intensité d'une cellule normale de référence.</li><li>Quatre altérations définissent des sous-groupes ; les mutations de myélodysplasie requalifient en LMA-MR.</li><li>BCR::ABL1 est une kinase de fusion ; la rasburicase protège le rein mais lèse les hématies déficitaires en G6PD.</li></ul></template>
<template data-pop="pareto-c95-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="c95-p-1,c95-p-2,c95-p-3,c95-p-4,c95-p-5"></p><ul><li>Aucun médicament n'a d'indication suisse nommée LAPM : imatinib et ponatinib (LLA Ph+), rasburicase (hyperuricémie), hydroxycarbamide (LMC et néoplasies myéloprolifératives).</li><li>Doses lues : imatinib 600 mg par jour, ponatinib 45 mg par jour, rasburicase 0,20 mg/kg par jour jusqu'à 7 jours, hydroxyurée 4 à 5 g par jour.</li><li>Contre-indications : rasburicase si déficit en G6PD ; hydroxycarbamide en cas de grossesse ou d'allaitement.</li><li>Les usages hors étiquette sont tracés comme tels.</li></ul></template>
