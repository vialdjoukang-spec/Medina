<template data-pop="c95-sources-guides" data-title="Sources, niveau de preuve et lacunes"><h3>Sources utilisées</h3><p>Ce chapitre repose sur vingt sources lues : la classification suisse et allemande des maladies (BfArM, OFS), le rapport de l'OFS sur le cancer en Suisse (2021), deux recommandations Onkopedia (leucémie aiguë myéloïde, septembre 2025 ; leucémie aiguë lymphoblastique, mars 2026), la revue Haematologica 2025 sur les leucémies de lignée ambiguë, deux études rétrospectives de l'<button class="w" data-k="c95-sources-guides">EBMT</button> (2017 et 2026), l'étude iBFM-AMBI2012 et quatre informations professionnelles Swissmedic (Glivec®, Iclusig®, Fasturtec®, Litalir®).</p><p>Onkopedia est un guide commun aux sociétés allemande, autrichienne et suisse d'hématologie et d'oncologie ; la <button class="w" data-k="c95-sources-guides">SGH/SSH</button> (Société suisse d'hématologie) et la <button class="w" data-k="c95-sources-guides">SGMO</button> (Société suisse d'oncologie médicale) en sont éditeurs. L'<button class="w" data-k="c95-sources-guides">OMS</button> est l'Organisation mondiale de la santé, dont la classification des tumeurs hématopoïétiques (5e édition) sert de référence ; l'<button class="w" data-k="c95-sources-guides">ICC</button> est la classification internationale de consensus de 2022.</p><h3>Niveau de preuve</h3><p>Les données sur la LALA viennent surtout d'études rétrospectives et de revues. Aucun essai randomisé n'est cité. Plusieurs sources n'ont été lues qu'en résumé.</p><h3>Lacunes</h3><ul><li>Aucune recommandation suisse (SSH, SAKK, Swiss Medical Forum), ESMO ou EHA dédiée à la LALA.</li><li>Article suisse de 2013 sur la conduite en premier recours : introuvable (erreur 404).</li><li>C95.1- et C95.7- : aucune entité clinique décrite.</li><li>Aucun chiffre suisse propre à C95 ; données de survie nord-américaines, descriptives.</li><li>Informations professionnelles du vénétoclax, du blinatumomab et des inhibiteurs de ménine non relues.</li></ul><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">Le cancer en Suisse, OFS 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LLA 2026</a>.</p></template>
<template data-pop="c95-blastes" data-title="Blastes : compter et seuil de 20 %"><p>Un blaste est une cellule immature de la moelle. Le médecin le compte au frottis sanguin et sur la moelle, en pourcentage des cellules nucléées. Le seuil de 20 % sépare la leucémie aiguë d'une hémopathie moins avancée ; il est commun à l'OMS 5e édition et à l'ICC 2022 pour la LALA.</p><table class="t"><tr><th>Contexte</th><th>Seuil de blastes</th></tr><tr><td>LALA (OMS 5e édition, ICC 2022)</td><td>Au moins 20 % dans le sang ou la moelle</td></tr><tr><td>LMA</td><td>Au moins 20 %, sauf anomalies génétiques définissantes</td></tr><tr><td>LLA (nomenclature allemande GMALL)</td><td>Au moins 25 % dans la moelle ; en dessous, lymphome lymphoblastique</td></tr></table><p>Le tableau montre que la frontière diffère selon la famille de leucémies : le seuil de 20 % ne dispense pas de respecter la définition de la LLA.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-lymphatische-leukaemie-all/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LLA 2026</a>.</p></template>
<template data-pop="c95-lapm" data-title="Leucémie aiguë à phénotype mixte"><p>La LAPM est une leucémie aiguë dont les blastes expriment des marqueurs de plus d'une lignée. Deux formes existent.</p><table class="t"><tr><th>Forme</th><th>Définition</th><th>Conséquence</th></tr><tr><td>Biphénotypique</td><td>Une seule population de blastes porte les marqueurs de deux lignées</td><td>Un seul clone, traitement unique</td></tr><tr><td>Bilinéale</td><td>Deux populations distinctes, au moins 20 % de blastes au total</td><td>Deux clones à couvrir</td></tr></table><p>La distinction se fait par la cytométrie en flux. Une publication ICC suggère qu'une sous-population divergente au-delà de 5 % peut suffire dans la forme bilinéale. Le sous-type le plus fréquent est B/myéloïde (environ deux tiers des cas), puis T/myéloïde. La LAPM représente 1 à 5 % des leucémies aiguës.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://doi.org/10.3389/fped.2025.1715087" target="_blank" rel="noopener">Karasek et al. 2025</a>.</p></template>
<template data-pop="c95-lai" data-title="Leucémie aiguë indifférenciée"><p>Dans la LAI, les blastes n'expriment aucun marqueur qui définisse une lignée. Le critère admet au plus un marqueur associé par lignée. La plupart des cas expriment un marqueur myéloïde, le CD34, le HLA-DR et la TdT : ce sont des marqueurs d'immaturité, non de lignée.</p><p>Le diagnostic de LAI est donc un diagnostic de négation, d'autant plus fragile que le panel de marqueurs est limité. Un panel incomplet peut faire classer en LAI une leucémie qui aurait rempli un critère de lignée. Environ 59 % des LAI portent des mutations liées à la myélodysplasie, ce qui impose de rechercher une LMA-MR avant de retenir la LAI. L'approche thérapeutique optimale est inconnue.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://doi.org/10.1111/ijlh.14529" target="_blank" rel="noopener">Kirtek et Weinberg 2025</a> ; <a href="https://doi.org/10.4103/ijc.ijc_505_21" target="_blank" rel="noopener">LLA-T CD3 négative 2025</a>.</p></template>
<template data-pop="c95-categorie" data-title="Catégorie de codage et diagnostic clinique"><p>Une catégorie de la CIM-10-GM est un outil de classement statistique et de facturation, non une entité de maladie. C95 est une catégorie « résiduelle » : elle reçoit les leucémies dont la lignée n'est pas attribuée. Deux conséquences pratiques en découlent. D'abord, le diagnostic clinique se pose par les critères de lignée de l'OMS ou de l'ICC, jamais par le code. Ensuite, le code évolue avec le bilan : C95.9- au début, C95.0- si la lignée est ambiguë, un code de LMA ou de LLA dès que la lignée est connue.</p><p>Les codes C95.1- et C95.7- ne correspondent à aucune entité clinique dans les sources lues. Ils servent à documenter une situation incomplète.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024 (OFS)</a>.</p></template>
<template data-pop="c95-cim-5e" data-title="Cinquième caractère : rémission complète ou non"><p>Pour C90 à C95, le cinquième caractère indique l'état de rémission. Le chiffre 0 s'applique en l'absence de rémission complète, y compris la rémission partielle et l'absence d'indication de rémission. Le chiffre 1 s'applique à la rémission complète.</p><table class="t"><tr><th>Situation du patient</th><th>Cinquième caractère</th><th>Exemple de code</th></tr><tr><td>Diagnostic initial, leucémie active</td><td>0</td><td>C95.00</td></tr><tr><td>Rémission partielle</td><td>0</td><td>C95.00</td></tr><tr><td>Rémission complète documentée</td><td>1</td><td>C95.01</td></tr><tr><td>Leucémie réfractaire à l'induction</td><td>0, avec le code additionnel C95.8!</td><td>C95.00 et C95.8!</td></tr></table><p>Le choix repose sur la documentation médicale : en l'absence d'une rémission complète écrite, le codeur choisit 0. La page BfArM 2024 lue ne définit pas de chiffre 2.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024 (OFS)</a>.</p></template>
<template data-pop="c95-c958" data-title="C95.8! : le code additionnel de la leucémie réfractaire"><p>Le point d'exclamation désigne un code additionnel : il complète un code de leucémie et ne s'emploie jamais seul. C95.8! signale une leucémie réfractaire au traitement d'induction standard. Il n'a pas de cinquième caractère.</p><p>Le code décrit un échec thérapeutique, pas une lignée. Il peut donc compléter une leucémie de lignée précisée (LMA, LLA) autant que C95.0-. Le critère clinique est l'absence de rémission au jalon prévu (par exemple après deux cycles d'induction intensive). Les sources lues ne précisent pas d'autre règle de codage.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia LMA 2025</a>.</p></template>
<template data-pop="c95-who-icc" data-title="OMS 5e édition et ICC 2022"><p>Deux classifications coexistent. L'OMS 5e édition (2022) et la classification internationale de consensus (ICC 2022) définissent toutes deux la LALA par le seuil de 20 % de blastes et par les critères de lignée. Les critères d'attribution cités dans ce chapitre sont communs aux deux. Elles diffèrent surtout par certains détails, comme le seuil de sous-population divergente de la forme bilinéale (une publication ICC propose 5 %).</p><p>Le médecin note donc quelle classification est utilisée dans le rapport du laboratoire. Les sources lues ne détaillent pas toutes les différences entre les deux classifications.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></template>
<template data-pop="c95-crit-b" data-title="Critères de la lignée B"><p>Le CD19 est le marqueur B le plus précoce. Le critère exige une intensité du CD19 supérieure à 50 % de celle des progéniteurs B normaux, associée à au moins un marqueur parmi le CD10, le CD22 et le CD79a. Si le CD19 est plus faible, il faut au moins deux marqueurs supplémentaires.</p><p>Le raisonnement est le suivant : un CD19 isolé peut être exprimé à bas niveau par des cellules d'une autre lignée, alors que sa combinaison avec un second marqueur confirme l'engagement B. Le critère se pose sur les blastes eux-mêmes, non sur les lymphocytes normaux du prélèvement.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></template>
<template data-pop="c95-crit-t" data-title="Critères de la lignée T"><p>Le critère de lignée T repose sur le CD3, cytoplasmique ou membranaire, dont l'intensité dépasse 50 % de celle des lymphocytes T matures, sur au moins une partie des blastes. Le CD3 est spécifique des lymphocytes T ; il suffit donc, à la différence des lignées B et myéloïde, qui demandent plusieurs marqueurs en cas de positivité faible.</p><p>Une limite existe : des cas de LLA-T sont CD3-négatifs. Un blaste T sans CD3 échappe donc à ce critère ; c'est la raison pour laquelle on interprète l'ensemble du phénotype.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://doi.org/10.4103/ijc.ijc_505_21" target="_blank" rel="noopener">LLA-T CD3 négative 2025</a>.</p></template>
<template data-pop="c95-cd3neg" data-title="LLA-T à CD3 négatif"><p>Une série de trois cas, avec revue de la littérature, décrit des LLA-T dont le CD3 est négatif. La conséquence est qu'un critère strict fondé sur le CD3 ne détecterait pas ces leucémies comme lymphoïdes T ; elles pourraient être classées à tort en LAI.</p><p>Le phénotype complet doit donc être interprété avec le critère CD3. La série est très petite : elle montre que le piège existe, non sa fréquence.</p><p class="src">Références : <a href="https://doi.org/10.4103/ijc.ijc_505_21" target="_blank" rel="noopener">LLA-T CD3 négative 2025</a> ; <a href="https://doi.org/10.1002/pbc.31394" target="_blank" rel="noopener">Hrusak et al. 2024</a>.</p></template>
<template data-pop="c95-auer" data-title="Bâtonnets d&#x27;Auer dans la LALA"><p>Les bâtonnets d'Auer sont des inclusions du cytoplasme des blastes, quasi exclusives des hémopathies myéloïdes. Une publication de Hrusak et al. (2024) décrit des cas exceptionnels de leucémie aiguë à phénotype surtout lymphoïde qui en contiennent. Un bâtonnet d'Auer ne prouve donc pas la lignée myéloïde ; il doit être confronté à la MPO et aux autres marqueurs.</p><p class="src">Référence : <a href="https://doi.org/10.1002/pbc.31394" target="_blank" rel="noopener">Hrusak et al. 2024</a>.</p></template>
<template data-pop="c95-cytometrie" data-title="Cytométrie en flux : pivot du diagnostic"><p>La cytométrie en flux marque les cellules par des anticorps fluorescents et mesure l'intensité de chaque marqueur, cellule par cellule. Elle est l'examen pivot de la LALA : seule elle montre si les marqueurs de plusieurs lignées sont portés par la même cellule. La revue de 2025 sur le diagnostic par cytométrie en fait la base de l'attribution de lignée.</p><p>Le résultat dépend du panel d'anticorps choisi : un panel incomplet peut manquer un critère de lignée. Il se lit avec la morphologie, la cytochimie (MPO) et la génétique.</p><p class="src">Références : <a href="https://doi.org/10.3390/cancers17050871" target="_blank" rel="noopener">cytométrie, Cancers 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></template>
<template data-pop="c95-exclusion" data-title="Diagnostic d&#x27;exclusion : LMA définies et LMA-MR"><p>Une leucémie de phénotype ambigu reste une LMA si elle porte une anomalie génétique définissante. Si elle porte une cytogénétique ou des mutations liées à la myélodysplasie (ASXL1, BCOR, EZH2, SF3B1, SRSF2, STAG2, U2AF1, ZRSR2), elle est classée comme LMA liée à la myélodysplasie ; RUNX1 fait exception.</p><p>Les mutations de ce type touchent environ 32 % des LAPM et 59 % des LAI. L'étude de Kirtek et Weinberg montre donc que le diagnostic de LALA dépend du séquençage autant que du phénotype. Ces mutations traduisent probablement une maladie issue d'une cellule déjà dysplasique ; les sources lues ne le démontrent pas.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://doi.org/10.1111/ijlh.14529" target="_blank" rel="noopener">Kirtek et Weinberg 2025</a>.</p></template>
<template data-pop="c95-facteurs" data-title="Facteurs de risque des leucémies"><p>Le rapport suisse de l'OFS cite le benzène, le formaldéhyde, l'oxyde d'éthylène et le 1,3-butadiène (expositions professionnelles ou environnementales), les agents alkylants et les inhibiteurs de la topo-isomérase II comme l'étoposide, les rayonnements ionisants, le tabac et la trisomie 21.</p><p>Ces facteurs concernent les leucémies en général. Aucune source lue ne les rapporte spécifiquement à la LALA. La plupart des patients n'ont aucune exposition identifiée.</p><p class="src">Référence : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">Le cancer en Suisse, OFS 2021</a>.</p></template>
<template data-pop="c95-bcrabl1" data-title="BCR::ABL1 : le chromosome Philadelphie"><p>La fusion BCR::ABL1 résulte de la translocation t(9;22). Elle concerne 15 à 20 % des LAPM, surtout des sujets plus âgés avec un phénotype B/myéloïde. Elle donne une protéine à activité tyrosine kinase qui entretient la prolifération.</p><p>La conséquence thérapeutique est l'ajout d'un ITK à la chimiothérapie : le pronostic se rapproche alors de celui de la LLA Ph+ (survie médiane 53,6 mois, survie à 5 ans 49 % dans une cohorte réelle). L'indication suisse des ITK vise la LLA Ph+ ; l'usage dans la LAPM est hors étiquette. Le transcrit se cherche sous forme p190 ou p210.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680563950023" target="_blank" rel="noopener">Glivec®</a>.</p></template>
<template data-pop="c95-kmt2a" data-title="KMT2A réarrangé"><p>Le réarrangement de KMT2A concerne environ 10 % des LAPM, surtout chez le nourrisson et l'enfant. Il est aussi présent dans 64 % des bascules de LLA-B vers la leucémie myéloïde observées sous CAR-T ou blinatumomab. Il signale donc une plasticité de lignée.</p><p>Les sources lues ne décrivent pas le mécanisme moléculaire détaillé.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></template>
<template data-pop="c95-znf384" data-title="ZNF384 réarrangé"><p>Le réarrangement de ZNF384 est retrouvé chez jusqu'à la moitié des LAPM B/myéloïdes pédiatriques et il est rare chez l'adulte. Il illustre que la LAPM de l'enfant et celle de l'adulte n'ont pas la même génétique, ce qui rappelle que la LAPM de l'enfant et celle de l'adulte ne sont pas la même maladie.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></template>
<template data-pop="c95-bcl11b" data-title="Activation de BCL11B"><p>L'activation de BCL11B concerne 10 à 15 % des LAPM, soit environ un tiers des LAPM T/myéloïdes. Elle relie un événement génétique à un phénotype de lignée : c'est un exemple de sous-groupe défini par le génome plutôt que par le seul phénotype.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></template>
<template data-pop="c95-fgfr1" data-title="Réarrangement de FGFR1"><p>Une publication de 2024 décrit une leucémie à réarrangement cryptique de FGFR1 avec changement de lignée. Le réarrangement échappe au caryotype classique, d'où la recommandation de la FISH devant une leucémie de lignée mixte ou changeante. La publication est un cas rapporté : elle justifie l'examen, non une fréquence.</p><p class="src">Référence : <a href="https://doi.org/10.1093/ajcp/aqad135" target="_blank" rel="noopener">FGFR1, Am J Clin Pathol 2024</a>.</p></template>
<template data-pop="c95-lineage-switch" data-title="Changement de lignée"><p>Le changement de lignée (lineage switch) est le passage d'une leucémie à une autre lignée sous traitement. Après un traitement dirigé contre une lignée (CAR-T anti-CD19, blinatumomab), une LLA-B peut devenir une LMA (75,7 %) ou une LAPM ou LAI (24,3 %). Dans 81,4 % des cas, cela survient dans les six mois ; la survie médiane après la bascule est de 4,8 mois. Environ 8 % des LLA-B traitées par CAR-T sont concernées.</p><p>Le mécanisme est la sélection : le traitement détruit les cellules porteuses de la cible et laisse un clone sans la cible. La conséquence pratique est de refaire l'immunophénotype à chaque rechute, sans présumer de la lignée initiale.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12951158/" target="_blank" rel="noopener">Sherban et Wolach, Haematologica 2025</a>.</p></template>
