<template data-pop="g01-pl" data-title="Ponction lombaire dans la méningite">
<div class="lab">Quand</div><p>Immédiatement après l’examen clinique, avec glucose sérique et au moins deux paires d’hémocultures, en l’absence de trouble sévère de la conscience, de déficit focal nouveau ou de crise récente.</p>
<div class="lab">Si un critère est présent</div><p>Hémocultures, puis antibiotique et dexaméthasone, puis tomodensitométrie, puis ponction si l’imagerie le permet.</p>
<div class="lab">Pourquoi</div><p>Ces trois critères motivent une recherche de complication intracrânienne ; ils ne résument pas toutes les contre-indications à la ponction. Un trouble de coagulation manifeste ou une anticoagulation orale doit également être évalué. La tomodensitométrie recherche les complications intracrâniennes avant la ponction (recommandation allemande S2k).</p>
<div class="lab">Piège</div><p>Le délai de l’imagerie ne justifie pas de retarder l’antibiotique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande S2k sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a>.</p>
</template>
<template data-pop="g01-hemoculture" data-title="Hémocultures">
<div class="lab">Indication</div><p>Au moins deux paires avant l’antibiotique, avec la ponction ou avant l’imagerie.</p>
<div class="lab">Rendement</div><p>Positives dans plus de la moitié des méningites bactériennes ; seul examen positif chez 35 patients sur 252 neurolistérioses.</p>
<div class="lab">Application</div><p>Une hémoculture positive en neurolistériose est associée à la mortalité (odds ratio 3,67).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande S2k sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://doi.org/10.1016/S1473-3099(16)30521-7" target="_blank" rel="noopener">Charlier et collaborateurs, cohorte nationale française de listériose, Lancet Infectious Diseases 2017</a>.</p>
</template>
<template data-pop="g01-imagerie" data-title="Imagerie cérébrale dans la méningite">
<div class="lab">Tomodensitométrie</div><p>En cas de suspicion d’hypertension intracrânienne ou de critères avant la ponction.</p>
<div class="lab">Imagerie par résonance magnétique</div><p>Supérieure pour les complications : ventriculite, abcès, empyème, ischémie, thrombose veineuse.</p>
<div class="lab">Limite</div><p>L’imagerie ne nomme pas le germe. Un examen ORL précoce recherche un foyer (environ 20 %).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande S2k sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a>.</p>
</template>
<template data-pop="g01-pct" data-title="Procalcitonine sérique">
<div class="lab">Valeur</div><p>Quasi constamment élevée dans la méningite bactérienne.</p>
<div class="lab">Limite</div><p>Aucune valeur seuil n’a été lue dans le dossier ; la procalcitonine ne nomme pas le germe et ne remplace ni le liquide ni l’hémoculture. Sa normalité isolée ne doit donc pas interrompre la démarche si la suspicion clinique reste forte.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande S2k sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a>.</p>
</template>
<template data-pop="g01-cxcl13" data-title="CXCL13 du liquide">
<div class="lab">Neuroborréliose</div><p>Sensibilité 89 %, spécificité 96 % ; non standardisé.</p>
<div class="lab">Neurosyphilis</div><p>Non recommandé ; élevé aussi dans le lymphome du système nerveux central.</p>
<div class="lab">Application</div><p>Le CXCL13 est un appoint, jamais un critère de confirmation.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a>.</p>
</template>
<template data-pop="g01-syph-tests" data-title="Tests de la neurosyphilis">
<div class="lab">Sérum</div><p>Test tréponémique (TPPA, TPHA ou TPLA), puis confirmation par FTA-ABS ou ELISA.</p>
<div class="lab">Liquide</div><p>Cellules, protéines, lactate, profil de Reiber, index ITpA ou TPHA. Le VDRL du liquide est très spécifique, de sensibilité 30 à 85,7 %.</p>
<div class="lab">Non recommandés</div><p>PCR du liquide (sensibilité 31,7 à 63,7 %) et CXCL13.</p>
<div class="lab">Suivi</div><p>VDRL sérique et du liquide, IgM ; TPPA, FTA et ITpA sont inutiles au suivi.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a>.</p>
</template>
<template data-pop="g01-ceftriaxone" data-title="Ceftriaxone">
<div class="lab">Mécanisme (rappel général)</div><p>Céphalosporine de troisième génération par voie parentérale ; rappel de pharmacologie générale, non repris du dossier.</p>
<div class="lab">Preuves</div><p>Associée à l’ampicilline dans le traitement empirique de la méningite aiguë de l’adulte (recommandation allemande S2k, 2023) ; durée de 7 à 10 jours pour le méningocoque.</p>
<div class="lab">Posologie</div><p>Information suisse (Ceftriaxon Labatec, juin 2025) : 1 à 2 g/jour, jusqu’à 4 g/jour en infection sévère ; enfant, méningite : 100 mg/kg (maximum 4 g) une fois par jour ; durées pédiatriques : méningocoque 4 jours, <i>H. influenzae</i> 6 jours, pneumocoque 7 jours. Maladie de Lyme : 50 mg/kg (maximum 2 g) une fois par jour pendant 14 jours.</p>
<div class="lab">Contre-indications</div><p>Ne pas mélanger ni administrer simultanément avec des solutions calciques par voie intraveineuse ; contre-indiquée chez le nouveau-né de 28 jours ou moins nécessitant du calcium par voie intraveineuse. Perfusion de 60 minutes chez le nouveau-né (encéphalopathie bilirubinique).</p>
<div class="lab">Limite</div><p>Les effets indésirables détaillés ne figurent pas dans les extraits lus ; se référer à l’information professionnelle complète.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande S2k sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Ceftriaxon Labatec, Swissmedic, juin 2025</a>.</p>
</template>
<template data-pop="g01-amoxicilline" data-title="Amoxicilline et ampicilline">
<div class="lab">Statut suisse</div><p>Aucune information professionnelle suisse n’a été trouvée pour l’ampicilline ; l’amoxicilline par voie intraveineuse (Amoxicillin OrPha, février 2026) est autorisée pour la méningite.</p>
<div class="lab">Posologie</div><p>Adulte, infections sévères : 2 g en perfusion de 30 minutes, 3 à 6 fois par jour. Enfant : 50 mg/kg par dose, 4 fois par jour, maximum 12 g/jour. Recommandation allemande : ampicilline 6 × 2 g/jour pour couvrir <i>Listeria</i>.</p>
<div class="lab">Inférence</div><p>L’équivalence ampicilline – amoxicilline est une inférence à faire valider par l’infectiologue et la pharmacie.</p>
<div class="lab">Limite</div><p>Contre-indications et effets indésirables détaillés non lus.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande S2k sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Amoxicillin OrPha, Swissmedic, février 2026</a>.</p>
</template>
<template data-pop="g01-dexamethasone" data-title="Dexaméthasone adjuvante">
<div class="lab">Mécanisme (rappel général)</div><p>Glucocorticoïde qui limite la réaction inflammatoire sous-arachnoïdienne décrite dans la physiopathologie ; l’issue dépend de l’intensité de cette inflammation.</p>
<div class="lab">Preuves</div><p>Cochrane (25 essais, 4121 patients) : mortalité globale non significativement réduite (17,8 contre 19,9 %, risque relatif 0,90) ; mortalité pneumococcique réduite (0,84) ; moins de surdité sévère (0,67) ; bénéfice dans les pays à haut revenu seulement ; plus de fièvre récurrente.</p>
<div class="lab">Posologie</div><p>Recommandation : 10 mg par voie intraveineuse 4 fois par jour, première dose avant ou avec l’antibiotique ; 4 jours si pneumocoque. Information suisse de Dexaméthasone Galepharm Amp (juin 2022), section « Enfants et adolescents » : 0,15 mg/kg toutes les 6 heures pendant 4 jours ou 0,4 mg/kg toutes les 12 heures pendant 2 jours.</p>
<div class="lab">Données contradictoires et décision spécialisée</div><p>MONALISA (2017) rapporte une association défavorable (odds ratio 4,58). Une cohorte prospective néerlandaise de 2023 portant sur 162 adultes rapporte au contraire une association favorable avec un schéma adjuvant précoce (odds ratio ajusté 0,40 ; intervalle de confiance 0,19–0,81). Ces résultats observationnels ne démontrent ni une causalité uniforme ni une contre-indication suisse. L’identification de Listeria impose une réévaluation spécialisée, sans règle d’arrêt déduite d’une seule cohorte.</p><p class="src">Source complémentaire réellement lue : <a href="https://doi.org/10.1016/j.eclinm.2023.101922" target="_blank" rel="noopener">Brouwer et van de Beek, cohorte néerlandaise 2023, méthodes, résultats et discussion ; cohorte prospective néerlandaise, limites observationnelles</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande S2k sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://doi.org/10.1002/14651858.CD004405.pub5" target="_blank" rel="noopener">Brouwer et collaborateurs, Corticoïdes dans la méningite bactérienne aiguë, Cochrane 2015 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3131058/" target="_blank" rel="noopener">Revue de physiopathologie de la méningite pneumococcique (van de Beek et collaborateurs), Clinical Microbiology Reviews 2011</a> ; <a href="https://doi.org/10.1016/S1473-3099(16)30521-7" target="_blank" rel="noopener">Charlier et collaborateurs, cohorte nationale française de listériose, Lancet Infectious Diseases 2017</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Dexaméthasone Galepharm, Swissmedic, juin 2022</a>.</p>
</template>
<template data-pop="g01-penicilline" data-title="Pénicilline G">
<div class="lab">Place</div><p>Neurosyphilis : 4 × 6, 5 × 5 ou 3 × 10 millions d’unités/jour pendant 14 jours (au moins 10) par voie intraveineuse.</p>
<div class="lab">Information suisse</div><p>Pénicilline Grünenthal (mai 2023) : méningite, 20 à 60 millions d’unités/jour en 4 à 6 doses ; convulsions en cas de perfusion trop rapide ; Jarisch-Herxheimer 2 à 12 heures après la première dose.</p>
<div class="lab">Surveillance</div><p>Vitesse de perfusion, crises ; anticonvulsivant si antécédent de crises.</p>
<div class="lab">Limite</div><p>Non utilisée pour le méningocoque avant l’antibiogramme.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande S2k sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Pénicilline Grünenthal, Swissmedic, mai 2023</a>.</p>
</template>
<template data-pop="g01-doxycycline" data-title="Doxycycline">
<div class="lab">Place</div><p>Neuroborréliose : par voie orale, efficacité équivalente à la ceftriaxone, 14 jours en forme précoce ; deux semaines suffisent, six semaines n’apportent rien de plus. Neurosyphilis : 2 × 200 mg pendant 28 jours envisageable.</p>
<div class="lab">Information suisse</div><p>Doxycyclin-Mepha (février 2024) : 100 mg deux fois par jour pendant 10 à 60 jours aux stades 1 et 2 de la maladie de Lyme.</p>
<div class="lab">Âge et grossesse</div><p>La recommandation S3 de 2025 ne retient plus de limite de huit ans pour la neuroborréliose. La FI suisse de Doxycyclin-Mepha (février 2024) impose toutefois, chez l’enfant de 12 ans ou moins, une situation grave menaçant le pronostic vital, un bénéfice attendu supérieur au risque et l’absence d’autre traitement disponible. L’usage pédiatrique nécessite donc un avis spécialisé avec identification du cadre clinique et réglementaire ; les tétracyclines sont contre-indiquées pendant la grossesse.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a> ; <a href="https://doi.org/10.1111/ene.16034" target="_blank" rel="noopener">Revue systématique des traitements de la neuroborréliose de Lyme, European Journal of Neurology 2023</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Doxycyclin-Mepha, Swissmedic, février 2024</a>.</p>
</template>
<template data-pop="g01-antitb" data-title="Traitement antituberculeux">
<div class="lab">Schéma</div><p>Deux mois de rifampicine, isoniazide, pyrazinamide et éthambutol, puis rifampicine et isoniazide ; méningite : continuation étendue à 10 mois (12 mois au total).</p>
<div class="lab">Corticoïdes</div><p>Dexaméthasone ou prednisolone pour tous les patients, quelle que soit la gravité, pendant 6 à 8 semaines.</p>
<div class="lab">Particularité</div><p>Rifampicine à forte dose réservée à la méningite, à discuter avec un spécialiste ; la rifampicine et l’éthambutol pénètrent peu dans le liquide.</p>
<div class="lab">Produits et surveillance</div><p data-src="S18,S33,S34">Le guide suisse V1.2024 (chapitre 7) distingue la phase initiale de deux mois et la continuation de dix mois dans la méningite. La FI de Rifater (autorisation 47063 ; rifampicine, isoniazide, pyrazinamide) précise que ses doses standard concernent les cas non compliqués et renvoie aux directives détaillées en cas d’atteinte du système nerveux central : la combinaison fixe n’est donc pas un schéma méningé à transposer automatiquement. Ses risques hépatiques et ses nombreuses interactions imposent une surveillance biologique et médicamenteuse. La FI de Myambutol (autorisation 33153 ; éthambutol) exige une évaluation de l’acuité visuelle, des couleurs et de la fonction rénale ; une névrite optique peut entraîner une perte visuelle. Les produits et leurs doses sont choisis avec le spécialiste de la tuberculose.</p><p class="src">Consultation du 15.10.2026 : <a href="https://amiko.oddb.org/fr/fi?gtin=7680470630353" target="_blank" rel="noopener">FI Rifater, posologie, précautions, interactions</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680331530013" target="_blank" rel="noopener">FI Myambutol, août 2024, précautions visuelles et rénales</a>.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Office fédéral de la santé publique et Ligue pulmonaire suisse, Tuberculose en Suisse, guide V1.2024</a> ; <a href="https://doi.org/10.1016/j.jinf.2009.06.011" target="_blank" rel="noopener">Recommandation britannique sur la tuberculose du système nerveux central, Journal of Infection 2009 (résumé)</a>.</p>
</template>
<template data-pop="g01-vanco-mero" data-title="Vancomycine et méropénème : produits suisses et limites">
<div class="lab">Place clinique</div><p data-src="S3">La recommandation allemande S2k de 2023 propose cette association en cas d’immunosuppression ou dans certaines situations neurochirurgicales. Elle n’en fait pas le schéma communautaire universel ; l’infectiologue tient compte du contexte et des résistances locales.</p>
<div class="lab">Vancomycine Sandoz injectable</div><p data-src="S29">La FI suisse (autorisation 57236, GTIN 7680572360035) indique chez les patients à partir de 12 ans : 15 à 20 mg/kg toutes les 8 à 12 heures, au maximum 2 g par dose. Chez le patient gravement malade, une charge de 25 à 30 mg/kg peut être utilisée. Les doses ultérieures dépendent des concentrations sériques et de la fonction rénale ; elles ne suivent pas un schéma fixe en insuffisance rénale. Perfuser sur au moins une heure et sans dépasser 10 mg/min, en retenant la durée la plus longue. La néphrotoxicité, l’ototoxicité et les réactions liées à une perfusion rapide imposent une surveillance adaptée.</p>
<div class="lab">Meronem injectable</div><p data-src="S30">La FI suisse (autorisation 53105, février 2026, GTIN 7680531050250) rapporte 2 g toutes les 8 heures pour la méningite chez l’adulte, en précisant que l’expérience adulte est très limitée et que ce n’est pas le médicament de choix de la méningite. La perfusion courte dure 15 à 30 minutes ; les données sur un bolus de 2 g sont limitées. Réduire le schéma si la clairance de la créatinine est inférieure à 51 ml/min selon le tableau du produit. L’association au valproate est à éviter : sa concentration peut chuter fortement et compromettre le contrôle des crises.</p>
<div class="lab">Interprétation</div><p>La recommandation définit la situation clinique et la FI encadre le produit. La réserve adulte de Meronem et la surveillance individualisée de la vancomycine doivent être explicitées au moment de prescrire ; les chiffres ci-dessus ne constituent pas une ordonnance pour chaque patient immunodéprimé.</p>
<p class="src">Sources consultées le 15.10.2026 : <a href="https://doi.org/10.1186/s42466-023-00264-6" target="_blank" rel="noopener">S2k 2023, tableau 3</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680572360035" target="_blank" rel="noopener">FI suisse Vancomycine Sandoz injectable, indications, posologie, précautions et mode d’administration</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680531050250" target="_blank" rel="noopener">FI suisse Meronem injectable, février 2026, indications, posologie et interaction au valproate</a>.</p>
</template>
<template data-pop="g01-delai" data-title="Pourquoi l’heure compte">
<div class="lab">Délai recommandé</div><p>L’antibiotique est donné dans l’heure suivant l’arrivée du patient ; un retard de plus de 3 heures doit être évité.</p>
<div class="lab">Mécanisme</div><p>L’issue dépend de l’intensité de l’inflammation sous-arachnoïdienne, qui s’installe tant que la bactérie se multiplie librement dans le liquide ; dans la méningococcie, choc, coma ou décès peuvent survenir en quelques heures.</p>
<div class="lab">Conséquence</div><p>Les hémocultures et, si les critères le commandent, l’imagerie ne justifient pas d’attendre : l’antibiotique et la dexaméthasone suivent immédiatement les hémocultures.</p>
<div class="lab">Limite</div><p>Les données quantitatives reliant le délai à la mortalité ne figurent pas dans le dossier de recherche.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande S2k sur la méningite bactérienne communautaire de l’adulte, version abrégée, Neurological Research and Practice 2023</a> ; <a href="https://doi.org/10.1002/14651858.CD004405.pub5" target="_blank" rel="noopener">Brouwer et collaborateurs, Corticoïdes dans la méningite bactérienne aiguë, Cochrane 2015 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3131058/" target="_blank" rel="noopener">Revue de physiopathologie de la méningite pneumococcique (van de Beek et collaborateurs), Clinical Microbiology Reviews 2011</a> ; <a href="https://www.bag.admin.ch/fr/maladies-invasives-a-meningocoques" target="_blank" rel="noopener">Office fédéral de la santé publique, Maladies invasives à méningocoques (page consultée le 14.10.2026)</a>.</p>
</template>
<template data-pop="g01-crit-borrelia" data-title="Critères de la neuroborréliose">
<div class="lab">Possible</div><p>Tableau typique et anticorps sériques, sans examen du liquide.</p>
<div class="lab">Probable</div><p>Tableau typique, anticorps sériques et liquide inflammatoire : pléiocytose lymphocytaire, dysfonction de barrière et synthèse intrathécale d’immunoglobulines.</p>
<div class="lab">Confirmée</div><p>Critères du niveau probable, auxquels s’ajoute une synthèse intrathécale spécifique d’anticorps anti-<i>Borrelia</i> (index positif), ou une culture ou PCR positive dans le liquide. Les autres causes doivent avoir été recherchées ; un index positif isolé ne suffit pas.</p>
<div class="lab">Application</div><p>Le niveau de certitude dépend de l’examen du liquide : sans ponction, le diagnostic reste « possible » dans cette classification. La sérologie sérique peut encore être négative très précocement ; le contexte clinique et l’exclusion des autres causes demeurent nécessaires.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">Recommandation allemande sur la neuroborréliose de Lyme, German Medical Science 2025</a>.</p>
</template>
<template data-pop="g01-crit-syph" data-title="Critères de la neurosyphilis">
<div class="lab">Probable</div><p>Test tréponémique positif dans le sérum (TPHA, TPPA ou FTA) et deux critères parmi trois : symptômes neuropsychiatriques subaigus ou chroniques ; pléiocytose ou dysfonction de barrière ; effet favorable du traitement.</p>
<div class="lab">Confirmée</div><p>Probable plus production intrathécale d’anticorps antitréponémiques (ITpA ou index TPHA liquide/sérum).</p>
<div class="lab">Asymptomatique</div><p>Sérologie positive avec pléiocytose lymphocytaire, protéines élevées ou VDRL du liquide positif, sans clinique.</p>
<div class="lab">Limite</div><p>La recommandation était valable jusqu’au 30.04.2025 ; aucune version plus récente n’a été lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur le diagnostic et le traitement de la neurosyphilis, Neurological Research and Practice 2020</a>.</p>
</template>
<template data-pop="pareto-g01-definition" data-title="Pareto — Définition et classification">
<p class="ratio" data-cover="g01-0,g01-1,g01-2"></p><ul><li>G01* est une manifestation méningée ; la maladie causale porte le code croix.</li><li>Quatre symptômes cardinaux : céphalée, méningisme, fièvre, trouble de la conscience ; trois sur quatre réunis chez la moitié des patients seulement.</li><li>Repères suisses : environ 50 méningococcies invasives par an, jusqu’à 100 listérioses par an, 365 tuberculoses en 2022.</li></ul></template>
<template data-pop="pareto-g01-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="g01-3,g01-4"></p><ul><li>La bactérie se multiplie librement dans le liquide ; la réaction inflammatoire cause l’œdème, la vascularite et la rupture de barrière.</li><li>Le terrain (âge avancé, cancer, immunosuppression, grossesse) augmente la probabilité de <i>Listeria</i>.</li><li>La dexaméthasone cible l’inflammation ; les résultats observationnels concernant la neurolistériose sont contradictoires.</li></ul></template>
<template data-pop="pareto-g01-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g01-5,g01-6"></p><ul><li>La rapidité d’évolution et le contexte orientent le germe.</li><li>L’érythème migrant manque dans 50 à 75 % des cas aigus de neuroborréliose.</li><li>Le déficit focal, la crise et le trouble sévère de la conscience modifient la séquence ponction – imagerie.</li></ul></template>
<template data-pop="pareto-g01-diagnostic" data-title="Pareto — Démarche diagnostique et urgences">
<p class="ratio" data-cover="g01-7,g01-8"></p><ul><li>Hémocultures, puis antibiotique et dexaméthasone, puis imagerie si critères, puis ponction.</li><li>Antibiotique dans l’heure ; retard de plus de 3 heures à éviter.</li><li>Liquide bactérien : &gt; 1000 cellules/µl, lactate &gt; 3,5 mmol/l, rapport glucose &lt; 0,3.</li></ul></template>
<template data-pop="pareto-g01-prise" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g01-9,g01-10,g01-11"></p><ul><li>Ceftriaxone plus ampicilline (ou amoxicilline après validation), dexaméthasone avant ou avec la première dose.</li><li>Traitement ciblé : durées de 14 jours (Borrelia, neurosyphilis), 7–10 jours (méningocoque), ≥ 3 semaines (Listeria), 12 mois (tuberculose).</li><li>Chimioprophylaxie du contact étroit : ciprofloxacine 20 mg/kg en dose unique (maximum 500 mg).</li></ul></template>
<template data-pop="pareto-g01-criteres" data-title="Pareto — Critères et paramètres">
<p class="ratio" data-cover="g01-12"></p><ul><li>Neuroborréliose possible, probable, confirmée selon le liquide et la synthèse intrathécale.</li><li>Neurosyphilis probable ou confirmée selon la sérologie et la production intrathécale d’anticorps.</li><li>Contact étroit : de 7 jours avant les symptômes à 24 heures après le début du traitement.</li></ul></template>
<template data-pop="pareto-g01-examens-1" data-title="Pareto — Ponction et liquide">
<p class="ratio" data-cover="g01-e-1,g01-e-2"></p><ul><li>Le liquide oriente ; le germe confirme.</li><li>Un tiers des méningites pneumococciques ont moins de 1000 cellules/µl.</li><li>Les valeurs normales du liquide ne figurent pas dans les sources lues.</li></ul></template>
<template data-pop="pareto-g01-examens-2" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g01-e-3,g01-e-4,g01-e-5,g01-e-6,g01-e-7"></p><ul><li>PCR multiplex : sensibilité 89,5 %, spécificité 97,4 %.</li><li>Index d’anticorps ≥ 1,5 pour la neuroborréliose ; PCR du liquide non recommandée en neurosyphilis.</li><li>Méningite tuberculeuse : volume du liquide, répétition de la ponction, dépistage du VIH.</li></ul></template>
<template data-pop="pareto-g01-examens-3" data-title="Pareto — Tableau croisé">
<p class="ratio" data-cover="g01-e-8"></p><ul><li>Chaque profil du liquide se lit avec le contexte clinique.</li><li>Le CXCL13 est un appoint, jamais un critère de confirmation.</li></ul></template>
<template data-pop="pareto-g01-sciences" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="g01-s-anat-cours,g01-s-histo-cours,g01-s-physio-cours,g01-s-bioch-cours,g01-s-micro-cours"></p><ul><li>La réaction cellulaire du liquide traduit le type d’agent.</li><li>La ceftriaxone atteint environ 2 % de sa concentration plasmatique dans un liquide non inflammatoire et jusqu’à 25 % dans la méningite.</li><li>L’agent détermine le spectre : ampicilline, pénicilline G, ceftriaxone ou doxycycline, antituberculeux.</li></ul></template>
<template data-pop="pareto-g01-pharma-1" data-title="Pareto — Doses">
<p class="ratio" data-cover="g01-p-1,g01-p-2"></p><ul><li>Ceftriaxone 2 × 2 g/jour plus ampicilline 6 × 2 g/jour ; dexaméthasone 10 mg quatre fois par jour pendant 4 jours.</li><li>Information suisse : ceftriaxone 1–2 g/jour, jusqu’à 4 g/jour dans l’infection sévère.</li><li>Aucune information professionnelle suisse pour l’ampicilline.</li></ul></template>
<template data-pop="pareto-g01-pharma-2" data-title="Pareto — Surveillance et interdits">
<p class="ratio" data-cover="g01-p-3,g01-p-4"></p><ul><li>Pas de ceftriaxone avec du calcium par voie intraveineuse chez le nouveau-né.</li><li>Jarisch-Herxheimer : anti-inflammatoire non stéroïdien, sans interrompre l’antibiotique.</li><li>Pas de corticoïdes pour la paralysie faciale de la neuroborréliose.</li></ul></template>
<template data-pop="pareto-g01-pharma-3" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g01-p-5"></p><ul><li>Chaque monographie précise les limites des sources lues.</li><li>Une inférence sans équivalent suisse se nomme et se fait valider.</li></ul></template>
