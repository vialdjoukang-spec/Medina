<template data-pop="pareto-k58-clinique" data-title="Loi de Pareto — Côlon irritable"><p class="ratio" data-cover="k58-1,k58-3,k58-4,k58-5,k58-7"></p><ul><li>Appliquez les critères de Rome IV et classez le sous-type avec l’échelle de Bristol.</li><li>Recherchez les signes d’alarme avant de retenir le diagnostic.</li><li>Faites une recherche de germes et une endoscopie si la diarrhée domine.</li><li>Expliquez le mécanisme et identifiez les déclencheurs.</li><li>Traitez le symptôme dominant : antispasmodique, lopéramide ou fibres et laxatifs.</li><li>N’utilisez pas d’opioïdes contre la douleur.</li></ul></template>
<template data-pop="pareto-k58-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k58-e-1,k58-e-2"></p><ul><li>Appliquez les critères de Rome IV.</li><li>Cherchez les signes d’alarme.</li><li>Explorez toute diarrhée chronique par les selles et l’endoscopie.</li><li>Ne demandez ni test du microbiote ni IgG alimentaires.</li></ul></template>
<template data-pop="pareto-k58-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k58-p-1,k58-p-2,k58-p-3"></p><ul><li>Choisissez le médicament selon le symptôme dominant.</li><li>Prescrivez l’huile de menthe poivrée 3 fois par jour, 3 mois au plus.</li><li>Réservez le linaclotide aux constipations réfractaires aux laxatifs.</li><li>Informez le patient que l’amitriptyline est hors indication.</li></ul></template>
<template data-pop="k58-sii" data-title="Syndrome de l’intestin irritable"><p class="lab">Définition</p><p>Il s’agit d’un trouble de l’axe intestin-cerveau qui associe des douleurs abdominales récidivantes à des troubles du transit, sans lésion organique qui les explique.</p><p class="lab">Pourquoi ce nom ?</p><p>Le terme « irritable » traduit l’hyperréactivité de l’intestin, à la fois motrice et sensitive.</p><p class="lab">Diagnostic</p><p>Il repose sur les critères de Rome IV et sur l’exclusion ciblée des maladies qui l’imitent.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></template>
<template data-pop="k58-rome" data-title="Critères de Rome IV"><p class="lab">Douleur</p><p>Les douleurs surviennent au moins un jour par semaine en moyenne au cours des trois derniers mois.</p><p class="lab">Critères associés</p><p>Au moins deux critères sont présents : un lien avec la défécation, une modification de la fréquence et une modification de la forme des selles.</p><p class="lab">Durée</p><p>Les symptômes ont commencé plus de six mois avant le diagnostic.</p><p class="lab">Pourquoi ?</p><p>Ces exigences sélectionnent un trouble chronique et stable, alors qu’une plainte récente ou progressive évoque une maladie organique.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></template>
<template data-pop="k58-alarme" data-title="Signes d’alarme"><p class="lab">Liste</p><p>La fièvre ou d’autres signes inflammatoires, l’anémie ou d’autres anomalies biologiques, la perte de poids, le sang dans les selles, la progression et une histoire de moins de trois mois sont des signes d’alarme.</p><p class="lab">Pourquoi ?</p><p>Chacun traduit une lésion ou une inflammation que le côlon irritable ne produit pas.</p><p class="lab">Conséquence</p><p>Le diagnostic de travail est exclu jusqu’à un bilan complet.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></template>
<template data-pop="k58-bristol" data-title="Échelle de Bristol"><p class="lab">Principe</p><p>Elle classe les selles en sept types, des billes dures (type 1) aux selles liquides (type 7).</p><p class="lab">Usage</p><p>Rome IV compte sur deux semaines les jours avec une selle de type 1-2 ou 6-7 pour définir le sous-type.</p><p class="lab">Pourquoi ?</p><p>La forme des selles reflète le temps de transit colique.</p><figure><img src="data:image/gif;base64,R0lGODdh4AEhAYUAAP/////+/////v7//v7+//7+/v7+/f3+/f79/v39/v39/fz9/f39/Pz8/Pr8+/r6+vj7+Pj39/Ty8e7v7eTl4d7Y08vVzMXBv7O/tIPJg0GuSUOtSUGtSUGtSEGtRz+tR7OfgZeXl6aBTYF/gUGsRzyrQzmbPVd1WXNhVG1IMVBUUEM+PTwvKjAeGRkWFwYEBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA4AEhAUAI/wABSLBAsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatzIsaPHjyANVpBAMoIDBwUIRMBQwkMHEiQ+dPgg04PLDjhz6tzJs6fPn0CDCh1KtKhPEjhhIuXg4YMGDR02cNhAdYMHElOfciDx1OaHDUo5aKi6YSxMqWWpmv1AgurWDR2uKuWqYStbmhxofi37tK5TD1P5UmUrlqzbD1uxWm07liZMvxpgegDboS6Hy32nNm3rofHXq2Adn7UsFelYsGM75I15Ou5YDXeTJjZKu7bt27h3zoWZk7CGEypGhMBwocKECCtbvlyeu7nz59CHIt3NdUOJDBQAaAfAAIP1Eha2a/+fkMHEdQgTNpjYkMFCBO0UMngooX4DBAkZStAPb0E/VRMZOEAegAPEVwJWel11nQUPABCBBfmBdZ0EAORXggYUdGfdhhkgQMEGGABQgXVTAegAfgACQF4JqnGAk3oZGDBiS3h9cF124mkXgYUbZFdeBhHM6AEGEIg3Y4kZTIDfgS/BJBNS0UUp5ZREPQbcCCMQZxxyLLmkFHNU6vblUdNNlxSUy/GGZpjQlTmXXmq9dpVmk+UFJ1kIRvUUVTMpRpNaMLl4VpxL/alWVRrYJJVMmW1wF1tpOcqWUqdRNZ1TcRlGQlNbRTXZaU1B2iRWUHWWV1RlNYWoXJJedhZXb0n/WmmgU9U6KW9gsqnrrrnFZGVwWRZ3XAD9YcAABBCcpOyyzDbrrAPIIgttssk+62y0JyW7wAIOPBBttdaGK+645JZr7rnopqvuuuy26+678MYr77zqInuABeoFN5wFFEzQYLEAHFBAjgIMXEABChxwAAMOKDDAdg1EDAAFKLCQAgopiCBCCiyw0AIK2TWAQAEISFDBBSCEcIEEBwhAwcYjoCAzxh2z4MIKFjQggAEDGJzjz9sd7LPQAwNQNNDiGVzwwAQgnaPBQx/t9NRJG2010T4DHfXVWVPt9ddghy322GSXbfbZaKetNtIFMCCieigIhwG/EvxbQogCa3ew0UQ7/wAACCyskALHLbTgwgssgEDBAA1UAAKWGKMAAggVRABB5Bi34LELnLugwgX+RkDByRiAcAHoAlww8+AtpFCBAQwUYIAATe+tN98Iq6jCClhOgAEKqqsgfHgYCH+BAgD4XYELIySPPNsFNBiCCyEefMEKKlRQAQq7o+D7CrwPtDuW4IcwwgsvgBwCCyPULWLH4YewAgshFGABCyoAX7ELISwAwPQWwAALKCA/DI <template data-pop="k58-hypersens" data-title="Hypersensibilité viscérale"><p class="lab">Définition</p><p>Le patient perçoit plus intensément des stimuli viscéraux normaux et les juge menaçants.</p><p class="lab">Conséquence</p><p>Cette perception explique la douleur sans lésion et justifie les traitements centraux.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></template>
<template data-pop="k58-fodmap" data-title="Régime pauvre en FODMAP"><p class="lab">Définition</p><p>Les FODMAP sont des oligo-, di- et monosaccharides fermentescibles et des polyols, c’est-à-dire des sucres courts mal absorbés dans l’intestin grêle.</p><p class="lab">Pourquoi ?</p><p>Ils deviennent osmotiquement actifs et fermentent rapidement dans le côlon, ce qui provoque douleurs, ballonnements et selles molles.</p><p class="lab">Déroulement</p><p>Le patient évite les aliments riches en FODMAP pendant 6 à 8 semaines, puis il les réintroduit progressivement pour trouver sa tolérance, et il adopte enfin une alimentation durable.</p><p class="lab">Indication</p><p>La S3 le recommande quand la douleur, les ballonnements ou la diarrhée dominent (grade B), avec une diététicienne (grade B), afin d’éviter une restriction excessive et une dénutrition.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></template>
<template data-pop="k58-fibres" data-title="Fibres solubles"><p class="lab">Indication</p><p>Elles doivent être utilisées dans la forme constipée (grade B) et peuvent l’être dans la forme diarrhéique (grade 0).</p><p class="lab">Pourquoi ?</p><p>Elles forment un gel qui normalise l’hydratation des selles.</p><p class="lab">Dose (S3)</p><p>On donne 1 mesure ou 1 sachet de psyllium 2 à 6 fois par jour, avec 150 ml d’eau à chaque prise.</p><figure><img src="data:image/gif;base64,R0lGODdh4AEOAYUAAMPAvrq3tLeyrLCwrrKqoq2ppKinpKuhlqagmKSfmKCgnp2cm5+ckqSVhp+ViZyXj5yRhJmWj5iPg5OTkpOSiJKOhpOLgIyKg5SGd46Ge5R/aY5/bouGgIuEdYp9boWDfYWBc4N9coB5coJ5Z4pyWoJyYH5xYXlyaXlwXndrW3xkTXRkUG5iUnFYQWZWRF1DLAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA4AEOAUAI/wAHCBxIcGCBggYJFihg4GABAhAhLowogMBDiwQECCjI0IABBQtCMohAocKFkxQmRIgwgcJKlQsmqFxJoWSGDhtGjPDgIYSIEB8qyAw54SYIDx06IM0ggQEDB1CjOp0a1QEECxYwdMCQIYOFCiwXKBibYGGCBxW+SqhQYS3bthFCKigYoC6Au3gBBBBQt69fAQs/KvAIcqzHi4E9NhRYgEEHEyVIlCiBosSIDRYgrHVZIYMIEytUkBhNQoPp0xhSq16tWgKEBg0gvJYtG8NpDaRFTy7hAUPTBAga9h3QcUAAvQGM8wVQ8YBzBMEP1h3w0WMCBgicH4gY0Tl37nzt3v9NvlDg8AIIInzokAGDBQfYszvHrh227AcJtH/XyH/v94zL5SUgXn9VBKCBBBwAQWqnwabddhAZ+KB2Dhhw3QNWMWhabip06CFppvkmG1T0PXcAAlM5dZ1T8+UH3UIMITCWXCDFFdMECxA2mAEDebRASRZkAMJRJpgQAnsZtIUVBhvc5iRppeE22m2pWSDBVy/huCNC0ykH45cHKUZYQ91px+IBDXiX0XF6jefXQGy6eRd/FfG1kUZ+sUkABLdBuYEEJDIgAU8dDJkUVoh2dVMIIDAFlUlgAYcAcAZEB6Nxbk4Ho3MNrEbbAwwkAJxhDQWGwAMSHAoBVBACSMCkBQj/4GaC3vGXoAEBEpinXnwZFOtBeA4oLHLJEWehAtBld+aEzNa34GuwpTlhtLBFSGdFBjyVlQTUPrjfXhsJBJVmGrLmJGoYQCstpw6iyQCn9c33FKiiTmopjMlCl8ACD0TAwAIrkVRTXCNVwMEFX1lwMEoyGfzBBxw8zIEFFICaIgP4ATcRnRAdsOyJoqqYYnA8CkRYAmTlu+JUD2AoAaBOyfcUbVhdAHEEBdTF30LQXSyqpJQu9JyK1yUg63gmO4AAngGcLKoDQaarWQYhMGoBdopJN1xy1w7QnAMZjBCCBAp6MFkKKYzAVQYUhPrvSCS5VpVTUa0KH1VWaSY3hB2h/8hAbFXpZ22CGeUlAEhyASwBBiaIpgEGsDmFLHTaIdBRyQgdNFB4ceplLOIYP3WlUh5swNoGOU0mmQqhqTCZBtBC2CV1Y+2YdXnWcn7huLWZe26fUAY/mmgg+tbA3ZISJlfWCJlce+2CrbhSSGLVTn31zyu/QOj9CvxvSJJmhwB3jVnwk1euXenVVw5QcLe33xGnuUAaeR1jAhF <template data-pop="k58-spasmo" data-title="Antispasmodiques"><p class="lab">Indication</p><p>Ils doivent être recommandés contre la douleur (grade A).</p><p class="lab">Preuve</p><p>Ils soulagent la douleur chez 58 % des patients contre 46 % sous placebo, avec un nombre de sujets à traiter de 5.</p><p class="lab">Exemples suisses</p><p>La mébévérine (Duspatalin® Retard) se prend à raison d’une gélule de 200 mg matin et soir ; la butylscopolamine est un antispasmodique anticholinergique.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Duspatalin® Retard, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k58-d-menthe" data-title="Huile de menthe poivrée (Colpermin®)"><p class="lab">Indication</p><p>La FI suisse l’indique dans le côlon irritable avec spasmes et ballonnements ; la S3 demande de l’envisager (grade A).</p><p class="lab">Dose</p><p>L’adulte prend 1 capsule 3 fois par jour, ou 2 capsules 3 fois par jour si les symptômes sont sévères, pendant 3 mois au plus.</p><p class="lab">Contre-indications</p><p>Elle est contre-indiquée en cas d’obstruction biliaire, de cholécystite, d’atteinte hépatique, d’achlorhydrie et d’allergie à l’arachide ou au soja.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Colpermin®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></template>
<template data-pop="k58-d-lop" data-title="Lopéramide (Imodium®)"><p class="lab">Indication</p><p>La S3 recommande de l’utiliser contre la diarrhée (grade B), et la FI suisse l’indique dans la diarrhée chronique.</p><p class="lab">Dose</p><p>L’adulte commence par 4 mg, puis prend 2 à 12 mg par jour selon les selles, sans dépasser 16 mg par jour.</p><p class="lab">Prudence</p><p>On ne le donne pas en première intention en cas de dysenterie aiguë ou de colite ulcéreuse aiguë, car il retiendrait les germes et l’inflammation.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Imodium®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></template>
<template data-pop="k58-d-lina" data-title="Linaclotide (Constella®)"><p class="lab">Indication</p><p>La FI suisse l’indique dans le côlon irritable modéré à sévère avec constipation chez l’adulte ; la S3 le réserve aux constipations réfractaires aux laxatifs.</p><p class="lab">Dose</p><p>On prend 290 µg une fois par jour, au moins 30 minutes avant un repas, et l’on réévalue après 4 semaines.</p><p class="lab">Contre-indication</p><p>Il est contre-indiqué en cas d’obstruction mécanique connue ou suspectée.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Constella®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></template>
<template data-pop="k58-d-ami" data-title="Amitriptyline (Saroten®)"><p class="lab">Indication</p><p>La S3 recommande de l’utiliser contre la douleur et les symptômes globaux, sauf en cas de constipation (grade B).</p><p class="lab">Dose (S3)</p><p>On commence par 12,5 ou 25 mg le soir, puis on augmente chaque semaine jusqu’à 50 mg, sans dépasser 75 mg.</p><p class="lab">Statut</p><p>Cet usage est hors indication en Suisse.</p><p class="lab">Contre-indications</p><p>Elle est contre-indiquée après un infarctus récent et en cas de trouble de la conduction ou du rythme cardiaque.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Saroten®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
