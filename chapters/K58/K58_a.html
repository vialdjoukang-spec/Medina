<section class="ilot" id="k58-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 34 ans souffre depuis deux ans de douleurs abdominales liées aux selles, avec des selles tantôt dures, tantôt molles et des ballonnements ; elle n’a ni perte de poids, ni sang dans les selles, ni anémie. <b>La question est donc de savoir si l’on peut poser un diagnostic positif de <button class="w" data-k="k58-sii">syndrome de l’intestin irritable</button> sans multiplier les examens, et comment la traiter.</b></p><p>Pour y répondre, le médecin doit savoir appliquer les <button class="w" data-k="k58-rome">critères de Rome IV</button>, rechercher les <button class="w" data-k="k58-alarme">signes d’alarme</button> qui interdisent ce diagnostic de travail, et exclure de façon ciblée les maladies qui imitent le syndrome. Ensuite, il doit expliquer au patient un modèle plausible de ses symptômes, puis choisir un traitement selon le symptôme dominant, car la recommandation S3 de 2021 fonde la thérapeutique sur les symptômes et non sur un mécanisme unique.</p><p><i>Pourquoi ce cas ?</i> En effet, le côlon irritable est un diagnostic fréquent, mais un diagnostic d’exclusion mal conduit expose à deux erreurs opposées : manquer une maladie grave ou répéter inutilement les examens. Ainsi, contrairement à un manuel figé, ce cours relie chaque décision à sa justification, et chaque mot vert ouvre le critère, la dose ou la recommandation qui la fonde.</p><div class="key"><b>Point de départ.</b> Le diagnostic repose sur deux piliers : des symptômes compatibles et l’exclusion ciblée des maladies qui les imitent. Le traitement vise ensuite le symptôme dominant.</div></section>
<section class="ilot" id="k58-1"><h2><span class="n">1</span>Définition, sous-types et épidémiologie</h2><p>Selon les <button class="w" data-k="k58-rome">critères de Rome IV</button> cités par la S3, le <button class="w" data-k="k58-sii">syndrome de l’intestin irritable</button> associe des douleurs abdominales récidivantes, au moins un jour par semaine en moyenne au cours des trois derniers mois, à au moins deux des trois critères suivants : un lien avec la défécation, une modification de la fréquence des selles et une modification de leur consistance. De plus, les symptômes doivent avoir commencé plus de six mois avant le diagnostic. Cette exigence de durée se justifie, car une plainte récente oriente davantage vers une maladie organique évolutive.</p><p>Par ailleurs, on distingue la forme à diarrhée (K58.1), la forme à constipation (K58.2), la forme mixte (K58.3) et les formes autres ou non précisées (K58.8) dans la CIM-10-GM. En effet, Rome IV classe le patient selon les jours d’un journal de deux semaines où au moins une selle est anormale, c’est-à-dire de type 1-2 ou 6-7 sur l’<button class="w" data-k="k58-bristol">échelle de Bristol</button>. Enfin, le syndrome est plus fréquent chez la femme (odds ratio poolé de 1,46), il altère nettement la qualité de vie, parfois davantage que d’autres maladies chroniques, et il s’associe souvent à des troubles anxieux, dépressifs ou somatoformes (S3 2021).</p><figure><img src="data:image/gif;base64,R0lGODdh4AEhAYUAAP/////+/////v7//v7+//7+/v7+/f3+/f79/v39/v39/fz9/f39/Pz8/Pr8+/r6+vj7+Pj39/Ty8e7v7eTl4d7Y08vVzMXBv7O/tIPJg0GuSUOtSUGtSUGtSEGtRz+tR7OfgZeXl6aBTYF/gUGsRzyrQzmbPVd1WXNhVG1IMVBUUEM+PTwvKjAeGRkWFwYEBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA4AEhAUAI/wABSLBAsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatzIsaPHjyANVpBAMoIDBwUIRMBQwkMHEiQ+dPgg04PLDjhz6tzJs6fPn0CDCh1KtKhPEjhhIuXg4YMGDR02cNhAdYMHElOfciDx1OaHDUo5aKi6YSxMqWWpmv1AgurWDR2uKuWqYStbmhxofi37tK5TD1P5UmUrlqzbD1uxWm07liZMvxpgegDboS6Hy32nNm3rofHXq2Adn <section class="ilot" id="k58-2"><h2><span class="n">2</span>Physiopathologie : l’axe intestin-cerveau</h2><p>La S3 décrit le syndrome comme associé à des modifications possibles à tous les niveaux de l’axe intestin-cerveau. Ainsi, elle cite des troubles de la motricité et des réflexes intestinaux, un métabolisme anormal des acides biliaires, une altération de la barrière et de la sécrétion muqueuses, une <button class="w" data-k="k58-hypersens">hypersensibilité viscérale</button>, ainsi que des modifications du microbiote. De plus, un syndrome peut apparaître après une inflammation intestinale, infectieuse ou non, ou après une antibiothérapie (S3 2021).</p><p>Par ailleurs, le cerveau module la perception. En effet, les patients peuvent percevoir plus intensément des stimuli viscéraux normaux et les interpréter comme menaçants ; or, le stress, l’anxiété et la dépression peuvent participer à l’apparition et à l’entretien des symptômes, même si le stress seul ne cause pas le syndrome. C’est pourquoi la S3 retient un modèle biopsychosocial, qui justifie à la fois les traitements intestinaux, comme les <button class="w" data-k="k58-spasmo">antispasmodiques</button>, et les traitements centraux, comme les antidépresseurs ou la psychothérapie.</p><figure><img src="data:image/gif;base64,R0lGODdh4AFkAYUAAMmilrR4YrVyXK5yWrJtX7FsTqpsVLFmWKtmWLBmSKtmR6hlT6FlTqxfUaRfUqdYT6teQaVdQKZWPp9dT59WTp9YPZlaR5lTQo9WRKROSKJOOJpORJpNNZRNRIpNQ45LNJtEO5BENodEO4ZDLYs+M4g3L3tDNHo7MG89LnIzKWAxI2MrIVEqGFEjGDkcEBoIBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA4AFkAUAI/wBfCBxIsKDBgwI9eEhxQoQIEw49OBQhMWIHDxgsWMioseMEChQmbMRQoQKDCx86UuhQIULLBxtAhCABIkOGBw0oIEDgwAEBAjsR/PzJE4EBAwMMLDCwk2hQoT8dCIU6NChQClIDWDiKlAGDAAMsnJgAdMGEBQseUHDYQerHog5AUrhpEwSIDRQeIDiAYIAABgs0ijjRQW5PqXGx9nzKs6danHkRNMC5c7IDtJgLaE4QAQLODDUbNMigAQQHDhIgQNAgerRN0KDtyp5d8zXOA0Od5s49oHdvpL29Hj0wgECA47wJ9BagWQBzAbktfCALlOpPpQqyK0iQQEGECEubEv+YQBbqzqN+iyv3LeAA7gMBHjrA0JfBALD3jwO4PwFACxQABChggCq8EOAADGDAQEstXXB "><b>À retenir.</b> Le syndrome résulte d’un dérèglement de l’axe intestin-cerveau : motricité, acides biliaires, barrière muqueuse, hypersensibilité viscérale, microbiote et facteurs psychiques. La muqueuse reste macroscopiquement normale.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></section>
<section class="ilot" id="k58-3"><h2><span class="n">3</span>Diagnostic positif et signes d’alarme</h2><p>La S3 exige deux composantes pour un diagnostic positif (grade A) : l’anamnèse et le profil des symptômes doivent être compatibles, et les maladies qui donnent les mêmes symptômes doivent être exclues de façon ciblée selon les symptômes. En outre, elle recommande d’exclure en priorité les maladies graves potentiellement menaçantes (grade A), puis d’envisager les causes traitables (grade B). Ce choix se justifie, car l’objectif est d’éviter à la fois l’erreur grave et la recherche aveugle.</p><p>Cependant, certains signes excluent d’emblée le diagnostic de travail : la fièvre ou d’autres signes inflammatoires, une anémie ou d’autres anomalies biologiques, une perte de poids, du sang visible ou occulte dans les selles, des symptômes progressifs, et une anamnèse de moins de trois mois. En effet, chacun de ces signes témoigne d’une lésion ou d’une inflammation que le côlon irritable ne produit pas. De plus, la S3 rappelle deux pièges : plus de 85 % des patientes atteintes d’un cancer de l’ovaire ont d’abord des symptômes de type côlon irritable, et environ un tiers des patients ayant une maladie inflammatoire chronique de l’intestin en rémission en présentent le tableau complet.</p><div class="alert"><b>Gravité d’abord.</b> Une fièvre, une anémie, une perte de poids, du sang dans les selles, des symptômes progressifs ou une histoire de moins de trois mois interdisent de retenir le côlon irritable avant un bilan complet. Une femme qui présente de nouveaux symptômes de type côlon irritable doit faire évoquer un cancer de l’ovaire.</div><div class="quiz ui"><p>Un homme de 58 ans a des troubles du transit depuis deux mois et une anémie ferriprive. Peut-on retenir un côlon irritable ?</p><button data-ok="0">Oui, si les critères de Rome IV sont remplis</button><button data-ok="1">Non : l’histoire courte et l’anémie sont des signes d’alarme qui imposent un bilan, notamment endoscopique</button><button data-ok="0">Oui, après un essai d’antispasmodique</button><p class="fb" hidden>Selon la S3, une anamnèse de moins de trois mois et une anémie excluent le diagnostic de travail ; une lésion organique doit d’abord être recherchée.</p></div><div class="key"><b>À retenir.</b> Le diagnostic positif repose sur des symptômes compatibles et une exclusion ciblée (grade A). Les <button class="w" data-k="k58-alarme">signes d’alarme</button> interdisent ce diagnostic jusqu’à un bilan complet.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></section>
<section class="ilot" id="k58-4"><h2><span class="n">4</span>Examens : cibler et ne pas répéter</h2><p>Le bilan dépend du symptôme dominant. Ainsi, lorsque la diarrhée domine, la S3 impose un bilan complet, avec une recherche de germes dans les selles et une endoscopie (grade A) ; en effet, la plupart des diarrhées chroniques ont une cause identifiable et traitable, comme une maladie inflammatoire, une colite microscopique ou une maladie cœliaque. En revanche, en l’absence de diarrhée, un traitement symptomatique d’essai de deux mois au plus est possible après un bilan de base négatif, même sans diagnostic positif établi (grade 0).</p><p>Par ailleurs, plusieurs examens sont déconseillés. En effet, aucun biomarqueur ne permet un diagnostic positif (grade 0), l’analyse du microbiote commensal ne doit pas être faite (grade B), et le dosage des IgG spécifiques d’aliments ne doit pas être demandé (grade B), car ces tests ne distinguent pas les malades des sujets sains. De plus, en cas d’intolérance alimentaire suspectée, la S3 propose un journal des symptômes suivi d’une éviction ciblée et limitée dans le temps (grade B). Enfin, une fois le diagnostic posé, il faut éviter de répéter le bilan si aucun élément nouveau n’apparaît (grade A), car la répétition entretient l’inquiétude sans bénéfice.</p><div class="trap"><span class="k">Piège</span>Une diarrhée chronique ne doit pas être étiquetée côlon irritable sans recherche de germes et sans endoscopie, car la majorité des diarrhées chroniques ont une autre cause. À l’inverse, refaire une coloscopie normale sans élément nouveau n’apporte rien.</div><div class="key"><b>À retenir.</b> Une diarrhée dominante impose les selles et l’endoscopie. Les biomarqueurs, l’analyse du microbiote et les IgG alimentaires sont inutiles. Le bilan ne se répète pas sans élément nouveau.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-016l_S3_Definition-Pathophysiologie-Diagnostik-Therapie-Reizdarmsyndroms_2022-02-abgelaufen.pdf" target="_blank" rel="noopener">Layer P. et al., Update S3-Leitlinie Reizdarmsyndrom : Definition, Pathophysiologie, Diagnostik und Therapie (DGVS, DGNM), Z Gastroenterol 2021;59:1323-1415</a>.</p></section>
