<section class="ilot" id="j69-0"><h2><span class="n">0</span>Question clinique</h2><p>Madame R., 81 ans, a été hospitalisée il y a quatre jours pour un accident vasculaire cérébral ischémique sylvien gauche. Or, depuis la veille, elle tousse à chaque repas ; ce matin, elle a en outre 38,4 °C, une fréquence respiratoire de 26 par minute, une SpO₂ de 89 % à l’air ambiant et des crépitants à la base droite. <b>Chez une patiente dont la déglutition est altérée, toute fièvre avec infiltrat impose donc de se demander si le poumon a reçu des sécrétions colonisées, un liquide gastrique acide ou les deux.</b></p><p>Le poumon communique avec l’extérieur par une surface d’échange immense. Il peut ainsi être lésé par ce qui est aspiré depuis la bouche ou l’estomac, par ce qui est inhalé dans l’air, et par ce qui l’atteint de l’intérieur : un médicament ou un rayonnement. Ce cours réunit ces trois familles, car elles partagent une même démarche : identifier l’agent, mesurer la lésion, supprimer l’exposition. Le médecin qui sait les distinguer évite deux erreurs opposées : l’antibiotique prescrit à une lésion chimique stérile, et la cause non retirée d’une lésion qui progresse.</p><div class="key"><b>Objectifs.</b> À la fin du cours, le lecteur distingue une <button class="w" data-justification="1" data-k="j69-pneumonie-aspiration">pneumonie d’aspiration (définition BTS)</button> d’une <button class="w" data-justification="1" data-k="j69-pneumopathie-chimique">pneumopathie chimique d’aspiration (lésion stérile)</button> ; il reconnaît une inhalation de fumées compliquée d’<button class="w" data-justification="1" data-k="j69-co">intoxication au monoxyde de carbone</button> ou au <button class="w" data-justification="1" data-k="j69-cyanure">cyanure</button> ; il suspecte une <button class="w" data-justification="1" data-k="j69-pid-medicamenteuse">pneumopathie médicamenteuse (diagnostic d’exclusion)</button> ou une <button class="w" data-justification="1" data-k="j69-pneumopathie-radique">pneumopathie radique (chronologie et champ)</button>.</div></section>
<section class="ilot" id="j69-1"><h2><span class="n">1</span>Définitions et classification</h2><p>Pour répondre, il faut d’abord définir les termes. L’<b>aspiration</b> désigne le passage, sous les cordes vocales, d’un contenu venu de l’oropharynx ou du tube digestif. Ainsi, la British Thoracic Society (BTS, 2023) définit la pneumonie d’aspiration comme la microaspiration de sécrétions oropharyngées ou digestives riches en bactéries, en quantité suffisante pour provoquer une inflammation alvéolaire et systémique ; elle s’accompagne d’ailleurs le plus souvent d’un trouble de la déglutition. La <b>pneumopathie chimique d’aspiration</b> est, en revanche, une autre maladie : un grand volume de liquide gastrique acide entre brusquement dans les poumons et provoque d’abord une agression chimique, non une infection. L’aspiration survient alors souvent devant témoin, chez un patient dont la conscience est abaissée.</p><p>L’<b>inhalation</b>, quant à elle, désigne l’entrée par l’air d’un gaz, d’une fumée, d’une vapeur ou d’un aérosol. Akgün et Nemery (2026) distinguent ainsi la lésion aiguë après une exposition unique ou brève, la pneumopathie toxique subaiguë après des pics répétés, et la maladie chronique d’inhalation. Le <button class="w" data-justification="1" data-k="j69-rads">syndrome de dysfonction réactive des voies aériennes, ou RADS (asthme après une exposition massive)</button> en est, par ailleurs, la forme bronchique aiguë.</p><p>Les <b>agents externes</b> regroupent enfin les rayonnements ionisants et les médicaments, qui lèsent le poumon par la circulation ou par l’irradiation du thorax. Pour la lésion radique, la phase aiguë, avant six mois, est la pneumopathie radique, tandis que la phase chronique, après six mois, est la fibrose radique. Le tableau ordonne donc ces entités selon l’agent, car c’est l’agent qui commande la conduite.</p><table class="t"><tr><th>Famille</th><th>Entités</th><th>Mécanisme dominant</th></tr><tr><td>Aspiration de solides et de liquides</td><td>Pneumonie d’aspiration ; pneumopathie chimique d’aspiration ; <button class="w" data-justification="1" data-k="j69-lipidique">pneumopathie lipidique exogène</button> ; aspiration de sang</td><td>Infection bactérienne ou agression chimique</td></tr><tr><td>Inhalation de gaz, fumées et vapeurs</td><td>Atteinte des voies aériennes supérieures ; bronchite et pneumopathie chimiques ; œdème pulmonaire toxique ; RADS ; séquelles chroniques</td><td>Irritation épithéliale, toxicité systémique</td></tr><tr><td>Rayonnements ionisants</td><td>Pneumopathie radique ; fibrose radique</td><td>Lésion épithéliale et endothéliale puis fibrose</td></tr><tr><td>Médicaments</td><td>Pneumopathies interstitielles médicamenteuses aiguës et chroniques</td><td>Toxicité directe ou réaction immunitaire</td></tr></table><p>Le tableau se lit par la première colonne : il faut en effet nommer l’agent avant la lésion, puisqu’une même image de verre dépoli peut relever d’une fumée, d’un médicament ou d’une irradiation. L’erreur fréquente consiste dès lors à étiqueter « pneumonie d’aspiration » toute pneumonie du sujet âgé. Enfin, le syndrome de Mendelson, aspiration gastrique liée à l’anesthésie, relève du cours <i>Complications respiratoires des actes médicaux</i>.</p><div class="key"><b>À retenir.</b> Aspiration et inhalation ne sont pas synonymes. La pneumonie d’aspiration est une infection, la pneumopathie chimique d’aspiration une brûlure stérile. Les gaz, les médicaments et les rayonnements forment deux autres familles, définies par leur agent. Le diagnostic commence donc par l’identification de l’exposition.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">Simpson et al., BTS Clinical Statement on aspiration pneumonia, Thorax 2023</a> ; <a href="https://doi.org/10.4274/balkanmedj.galenos.2026.2026-7-35" target="_blank" rel="noopener">Akgün et Nemery, Inhalation injury, Balkan Med J 2026 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7788688/" target="_blank" rel="noopener">Arroyo-Hernández et al., Radiation-induced lung injury, BMC Pulm Med 2021</a>.</p></section>
<section class="ilot" id="j69-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>Ces définitions posées, l’épidémiologie montre que les troubles de la déglutition sont fréquents et sous-estimés. Selon la BTS, 5 à 15 % des pneumonies communautaires seraient en effet des pneumonies d’aspiration, et l’incidence des hospitalisations pour pneumonie d’aspiration communautaire atteint 31 pour 10 000 personnes de plus de 65 ans par an, puis 35 pour 10 000 après 75 ans. De plus, parmi les patients hospitalisés pour pneumonie, 55 % ont une déglutition altérée. La mortalité hospitalière de la pneumonie d’aspiration est ainsi d’environ 10 à 15 %. Toutefois, aucune incidence suisse spécifique n’a été trouvée.</p><p>Parmi les situations à risque, l’accident vasculaire cérébral est la mieux étudiée. En effet, plus de 50 % des patients ont une dysphagie à la phase aiguë (European Stroke Organisation, ESO, 2021). Par conséquent, la pneumonie associée à l’accident vasculaire cérébral touche environ 12 % des patients ; c’est la complication infectieuse la plus fréquente, et 78 % des cas surviennent dans la première semaine (ESO, 2026).</p><p>Sur le versant de l’inhalation, les intoxications sont recensées en Suisse par <button class="w" data-justification="1" data-k="j69-toxinfo">Tox Info Suisse (numéro 145)</button>. En 2025, le centre a ainsi reçu 44 736 demandes, dont 229 consultations motivées par les gaz de fumée et 53 par le monoxyde de carbone. Par ailleurs, les assureurs-accidents suisses ont reconnu environ 2700 maladies professionnelles respiratoires entre 2014 et 2023, soit près de 10 % des maladies professionnelles ; de plus, 5 à 15 % des asthmes professionnels relèvent d’un mécanisme irritatif (<button class="w" data-justification="1" data-k="j69-suva">Suva, 2026 (reconnaissance et déclaration)</button>).</p><p>Quant aux agents externes, les pneumopathies interstitielles médicamenteuses représentent 3 à 5 % des pneumopathies interstitielles, avec une incidence de 4,1 à 12,4 par million d’habitants et par an ; les anticancéreux en causent d’ailleurs 23 à 51 % (Conte, 2022). De même, sous amiodarone orale, la toxicité pulmonaire touche 2 à 7 % des patients et elle est mortelle dans environ 10 % des cas (information professionnelle suisse). Enfin, sous pembrolizumab en monothérapie, une pneumopathie survient chez 4,2 % des patients, et chez 8,1 % après une radiothérapie thoracique.</p><div class="key"><b>À retenir.</b> La pneumonie d’aspiration est une maladie du sujet âgé, du patient neurologique et de l’institution ; elle tue environ un patient hospitalisé sur dix. Les atteintes toxiques et iatrogènes sont plus rares, mais elles sont évitables ou réversibles si l’exposition est reconnue tôt.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42095755/" target="_blank" rel="noopener">Meisel et al., ESO guideline on stroke-associated pneumonia, Eur Stroke J 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34746431/" target="_blank" rel="noopener">Dziewas et al., ESO et Société européenne des troubles de la déglutition, 2021</a> ; <a href="https://www.toxinfo.ch/jahresberichte_de" target="_blank" rel="noopener">Tox Info Suisse, rapport annuel 2025 et annexe</a> ; <a href="https://www.suva.ch/3601-37.f" target="_blank" rel="noopener">Suva, Asthme professionnel et RADS, 3601-37.f, septembre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al., ESMO Open 2022</a>.</p></section>
<section class="ilot" id="j69-3"><h2><span class="n">3</span>Des défenses du carrefour aérodigestif à la lésion alvéolaire</h2><p>Pour comprendre ces chiffres, il faut partir du sujet sain : des sécrétions oropharyngées atteignent en effet le poumon en petite quantité, et ce sont elles qui ensemencent le microbiote pulmonaire normal. Deux défenses limitent toutefois la charge : une <button class="w" data-justification="1" data-k="j69-deglutition">déglutition efficace (trois phases et apnée de déglutition)</button> et une <button class="w" data-justification="1" data-k="j69-toux">toux efficace (trois conditions et débit de pointe de toux)</button>. La pneumonie apparaît donc lorsque la quantité ou la composition bactérienne du matériel aspiré dépasse ce que les défenses alvéolaires éliminent.</p><p>Or le vieillissement affaiblit chaque étape. La sensibilité pharyngée diminue, la fermeture laryngée est retardée, et certains sujets inspirent même pendant la déglutition au lieu d’expirer. De plus, le résidu pharyngé augmente et peut être aspiré après la déglutition. Lorsque la sensibilité laryngopharyngée ou la vigilance baisse, l’aspiration devient alors <button class="w" data-justification="1" data-k="j69-silencieuse">silencieuse (sans toux ni signe visible)</button>. En outre, en institution ou à l’hôpital, l’oropharynx se colonise par <i>Escherichia coli</i>, <i>Klebsiella pneumoniae</i>, <i>Pseudomonas aeruginosa</i> et <i>Staphylococcus aureus</i>, si bien que l’aspiration apporte des bactéries plus agressives.</p><p>Le liquide gastrique acide agit, à l’inverse, autrement : il brûle l’épithélium bronchique et alvéolaire, de sorte que la lésion initiale est chimique et stérile, l’infection n’étant qu’une complication possible. De leur côté, les gaz irritants lèsent l’épithélium à un niveau qui dépend de leur <button class="w" data-justification="1" data-k="j69-solubilite">solubilité dans l’eau (siège de la lésion)</button> et, pour les particules, de leur diamètre aérodynamique. Certains gaz, comme le dioxyde d’azote ou le phosgène, provoquent même un <button class="w" data-justification="1" data-k="j80-oedeme-lesionnel">œdème pulmonaire lésionnel (perméabilité accrue)</button> retardé de plusieurs heures. Les asphyxiants, enfin, n’abîment pas le poumon, mais bloquent le transport ou l’utilisation de l’oxygène.</p><p>Les médicaments lèsent le poumon par toxicité directe sur l’épithélium et l’endothélium, comme la bléomycine et l’amiodarone, ou par une réaction immunitaire dirigée contre des protéines modifiées. L’irradiation détruit les cellules épithéliales et endothéliales ; une phase exsudative survient trois à douze semaines après la radiothérapie, puis une fibrose peut s’installer au-delà de six mois.</p><div class="key"><b>Conséquence thérapeutique.</b> Une lésion chimique stérile ne relève pas de l’antibiotique ; une infection par sécrétions colonisées en relève ; un asphyxiant relève d’un antidote ou de l’oxygène ; un médicament ou un champ d’irradiation relève de l’arrêt de l’exposition et, selon la gravité, des corticoïdes.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023, sections Pathogenesis et Microbiology</a> ; <a href="https://doi.org/10.4274/balkanmedj.galenos.2026.2026-7-35" target="_blank" rel="noopener">Akgün et Nemery 2026 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7788688/" target="_blank" rel="noopener">Arroyo-Hernández et al. 2021</a>.</p></section>
<section class="ilot" id="j69-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Chaque famille possède ses circonstances favorisantes. Le tableau les rassemble, car l’anamnèse étiologique consiste précisément à les parcourir.</p><table class="t"><tr><th>Famille</th><th>Causes et facteurs de risque</th></tr><tr><td><button class="w" data-justification="1" data-k="j69-facteurs-aspiration">Aspiration (tableau 1 de la BTS)</button></td><td>Âge supérieur à 60 ans ; vie en institution ; conscience abaissée (alcool, sédatifs, opiacés, antipsychotiques, antiépileptiques) ; accident vasculaire cérébral, démence, maladie de Parkinson ; cancer de l’œsophage, de la tête ou du cou ; reflux ; mauvaise hygiène buccale ; sonde nasogastrique, gastrostomie, sonde d’intubation</td></tr><tr><td>Gaz irritants</td><td><button class="w" data-justification="1" data-k="j69-chlore">Chlore libéré par l’eau de Javel mélangée à un acide</button>, ammoniac, dioxyde de soufre, gaz lacrymogènes ; <button class="w" data-justification="1" data-k="j69-no2">dioxyde d’azote (ensilage, explosifs)</button> ; <button class="w" data-justification="1" data-k="j69-phosgene">phosgène (combustion de plastiques chlorés)</button> ; <button class="w" data-justification="1" data-k="j69-sprays">sprays imperméabilisants</button></td></tr><tr><td>Fumées d’incendie</td><td>Feu en espace clos : <button class="w" data-justification="1" data-k="j69-fumees">lésion thermique, irritants et asphyxiants</button></td></tr><tr><td>Médicaments</td><td><button class="w" data-justification="1" data-k="j69-d-amiodarone">Amiodarone</button>, <button class="w" data-justification="1" data-k="j69-d-methotrexate">méthotrexate</button>, <button class="w" data-justification="1" data-k="j69-d-nitrofurantoine">nitrofurantoïne</button>, <button class="w" data-justification="1" data-k="j69-d-bleomycine">bléomycine</button>, <button class="w" data-justification="1" data-k="j69-d-ici">inhibiteurs de points de contrôle immunitaire</button>, <button class="w" data-justification="1" data-k="j69-d-tdxd">trastuzumab déruxtécan</button></td></tr><tr><td>Radiothérapie</td><td><button class="w" data-justification="1" data-k="j69-dose-pulmonaire">Dose reçue par le poumon sain</button> ; chimioradiothérapie concomitante ; pneumopathie interstitielle préexistante ; âge</td></tr><tr><td>Hydrocarbures et huiles</td><td><button class="w" data-justification="1" data-k="j69-hydrocarbures">Huile de lampe ou carburant avalés par un enfant</button> ; huiles aspirées de façon répétée chez l’adulte</td></tr></table><p>En pratique, le clinicien commence par la colonne de droite qui correspond au contexte. Ainsi, chez Madame R., la conjonction de l’accident vasculaire cérébral, de l’âge et de la toux aux repas suffit à orienter vers l’aspiration. Chez un pompier, en revanche, l’espace clos et la suie orientent vers les asphyxiants, tandis que, chez une patiente qui prend de la nitrofurantoïne depuis des mois, le médicament devient le premier suspect. L’erreur fréquente consiste donc à ne pas relire la liste des médicaments ni le parcours professionnel, alors que ces deux informations changent la conduite.</p><div class="key"><b>À retenir.</b> Les facteurs modifiables (sédatifs, hygiène buccale, position, exposition professionnelle, médicament pneumotoxique) sont ceux qui comptent le plus, car leur correction prévient la récidive.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023, tableau 1</a> ; <a href="https://www.suva.ch/3601-37.f" target="_blank" rel="noopener">Suva 2026, chapitre 5</a> ; <a href="https://www.pneumotox.com" target="_blank" rel="noopener">Pneumotox, base de données des pneumopathies médicamenteuses</a>.</p></section>
<section class="ilot" id="j69-5"><h2><span class="n">5</span>Interroger pour reconnaître l’agression</h2><p>L’anamnèse identifie dès lors l’agent, la dose et le délai. Devant toute dyspnée avec hypoxémie et radiographie anormale, la BTS demande ainsi d’explorer le niveau de conscience, l’efficacité de la déglutition et les épisodes récents d’étouffement avec des comprimés, des aliments ou des liquides. De plus, chez la personne âgée ou fragile, une pneumonie d’aspiration peut se révéler par un <button class="w" data-justification="1" data-k="j69-presentation-fragile">syndrome gériatrique (confusion hypoactive, chute, perte de mobilité)</button>. C’est pourquoi le récit d’un proche ou d’un soignant est souvent décisif lorsque le patient a des troubles cognitifs.</p><p>Devant une inhalation, le médecin précise le produit, sa présentation (gaz, fumée, aérosol), le lieu clos ou ouvert, la durée de l’exposition et l’heure exacte. Il recherche les symptômes immédiats d’irritation : brûlure des yeux et de la gorge, toux, dyspnée, oppression thoracique. Il recherche aussi les signes d’asphyxie : céphalées, vertiges, nausées, confusion, perte de connaissance. Un intervalle libre ne rassure pas après une exposition à un gaz peu soluble.</p><p>Devant un infiltrat inexpliqué sous traitement, le médecin date le début du médicament, ses changements de dose et la dose cumulée, puis il consulte la base <button class="w" data-justification="1" data-k="j69-pneumotox">Pneumotox</button>. Il demande la date, le site et la dose de toute radiothérapie thoracique. Il retrace enfin le parcours professionnel et interroge sur les collègues exposés, car un tableau partagé rend l’origine professionnelle plus plausible (Suva, 2026).</p><div class="two"><div class="card"><h4>Formes typiques</h4><p>Une patiente dysphagique après un accident vasculaire cérébral présente fièvre, toux et condensation basale droite. De même, un ouvrier qui a mélangé deux produits de nettoyage tousse et respire mal dans l’heure, tandis qu’un patient sous amiodarone depuis plusieurs mois s’essouffle à l’effort.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Un résident d’établissement médico-social chute et devient confus sans fièvre. Plus trompeur encore, un agriculteur se sent bien après être entré dans un silo, puis s’asphyxie la nuit suivante. De même, une pneumopathie survient dans un champ irradié des mois plus tôt, au moment où débute un nouvel anticancéreux : c’est le <button class="w" data-justification="1" data-k="j69-rappel">rappel radique</button>. Enfin, une pneumopathie lipidique se présente comme une masse qui simule un cancer.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> Le médecin conclut à une « pneumonie d’aspiration » sans avoir cherché le trouble de la déglutition ni la cause de ce trouble. Il traite l’épisode, mais il laisse intacte la cause de la récidive.</div><div class="key"><b>À retenir.</b> L’interrogatoire nomme l’agent, quantifie l’exposition et date les symptômes ; il recherche systématiquement déglutition, médicaments, radiothérapie et métier.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023, section Diagnosis</a> ; <a href="https://www.suva.ch/3601-37.f" target="_blank" rel="noopener">Suva 2026, chapitre 6</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a>.</p></section>
<section class="ilot" id="j69-6"><h2><span class="n">6</span>Examiner pour mesurer la gravité</h2><p>L’examen commence par l’état de conscience, la fréquence respiratoire, la SpO₂, la pression artérielle et la température. Il mesure ensuite la gravité propre à chaque agent, puis il cherche la cause.</p><div class="two"><div class="card"><h4>Aspiration</h4><p>Le médecin évalue la vigilance et les fonctions cognitives. Il <button class="w" data-justification="1" data-k="j69-examen-buccal">examine la bouche (dentition, candidose, résidus alimentaires)</button>, car la BTS le demande chez tout patient hospitalisé à risque. Il recherche des crépitants ou un souffle tubaire dans les segments déclives. Il évalue la toux volontaire et les nerfs crâniens bulbaires. La fièvre et l’hyperleucocytose peuvent manquer chez le sujet âgé.</p></div><div class="card"><h4>Inhalation et intoxication</h4><p>Le médecin recherche de la <button class="w" data-justification="1" data-k="j69-suie">suie autour de la bouche, du nez ou dans l’oropharynx</button>, une confusion, une hypotension et une mydriase, qui évoquent un cyanure. Il recherche une atteinte des voies aériennes supérieures : l’examen direct du larynx par nasolaryngoscopie guide la décision d’intubation et évite une intubation inutile (Gigengack, 2020). Il ausculte à la recherche de sibilants ou de crépitants. Une SpO₂ normale ne mesure pas la carboxyhémoglobine.</p></div></div><div class="two"><div class="card"><h4>Médicament</h4><p>Le médecin recherche des crépitants, une cyanose, et des signes systémiques comme une éruption ou des adénopathies, qui orientent vers une infection ou une réaction d’hypersensibilité (Conte, 2022).</p></div><div class="card"><h4>Radiation</h4><p>Le médecin recherche dyspnée, toux, fébricule, frottement pleural et crépitants, trois à douze semaines après la radiothérapie. Il compare la fonction respiratoire à celle d’avant le traitement.</p></div></div><div class="key"><b>À retenir.</b> Les signes de gravité sont respiratoires (hypoxémie, polypnée), laryngés (atteinte des voies aériennes supérieures) et systémiques (confusion, hypotension, acidose). L’examen buccal et neurologique cherche la cause d’une aspiration ; la suie et la confusion cherchent l’asphyxiant.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cyanokit®, Swissmedic (AIPS via AmiKo, mise à jour 09.2018), consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29734568/" target="_blank" rel="noopener">Hampson, Carboxyhemoglobin: a primer for clinicians, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33060384/" target="_blank" rel="noopener">Gigengack et al., Curr Opin Anaesthesiol 2020</a>.</p><button class="pareto-btn ui" data-k="pareto-j69-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
