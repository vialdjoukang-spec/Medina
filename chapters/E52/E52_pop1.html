<template data-pop="e52-niacine" data-title="Niacine : acide nicotinique, nicotinamide et équivalent niacine"><h3>Ce que désigne le mot</h3><p>La niacine est le terme collectif de deux molécules, l’acide nicotinique et le nicotinamide. Les deux sont hydrosolubles, peu stockées, et tous les tissus les convertissent en <button class="w" data-k="e52-nad">NAD et NADP</button>. Le foie en contient une fraction de réserve. Cette faible réserve s’accorde avec le délai d’environ 60 jours d’apport déficient décrit avant l’apparition d’une pellagre, et avec le jugement de l’OMS selon lequel une prévention intermittente est inefficace.</p><table class="t"><tr><th>Forme</th><th>Où la trouve-t-on ?</th><th>Particularité clinique</th></tr><tr><td>Acide nicotinique</td><td>Surtout dans les plantes</td><td>Flush dès 30 mg chez le sujet jeune ; limite supérieure citée par l’ESPEN d’après l’EFSA : 10 mg par jour</td></tr><tr><td>Nicotinamide</td><td>Surtout dans les tissus animaux</td><td>Pas de flush ; limite supérieure citée : 12,5 mg/kg/jour, soit environ 900 mg par jour</td></tr></table><p>Le tableau explique le choix du nicotinamide pour les doses thérapeutiques : la tolérance, et non l’efficacité, distingue les deux formes. La quantité de niacine d’un aliment s’exprime en <button class="w" data-k="e52-tryptophane">équivalents niacine</button>, parce que l’organisme fabrique aussi de la niacine à partir du tryptophane.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, sections 15.1 et 15.2</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, pages 10, 11 et 15</a>.</p></template>
<template data-pop="e52-nad" data-title="NAD et NADP : le coenzyme dont la pellagre est la carence"><h3>Rôles</h3><p>Le NAD et le NADP sont les formes actives de la niacine. Plus de 400 enzymes en dépendent, davantage que pour tout autre coenzyme vitaminique. Leur déficit altère quatre fonctions cellulaires : la production d’énergie, la synthèse lipidique, la réparation de l’ADN et la défense antioxydante.</p><h3>Pourquoi la peau, l’intestin et le cerveau</h3><p>Ces trois organes ont une forte demande énergétique ou un renouvellement rapide. Un déficit en coenzyme les atteint donc avant les autres tissus. Cette explication relie la triade clinique à la biochimie, mais elle est un cadre de raisonnement, non la preuve de chaque lésion.</p><h3>Quand les besoins augmentent</h3><p>L’ESPEN note une consommation de NAD accrue chez le sujet âgé, pendant la grossesse et lors de traitements qui lèsent l’ADN, comme la radiothérapie ou certaines chimiothérapies. La poly-ADP-ribose polymérase, grande consommatrice de NAD, figure parmi les voies proposées pour la lésion neuronale.</p><h3>Mesure</h3><p>L’ESPEN recommande le NAD sanguin ou tissulaire comme mesure du statut (recommandation 16.2, grade A, consensus de 91 %). Le <button class="w" data-k="e52-biomarqueurs">détail des biomarqueurs</button> précise les limites.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, sections 15.1 et 15.4</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25317166/" target="_blank" rel="noopener">Fu et al., Neural Regen Res 2014</a>.</p></template>
<template data-pop="e52-tryptophane" data-title="Équivalent niacine : le tryptophane comme source de niacine"><h3>Définition</h3><p>Un équivalent niacine correspond à 1 mg de niacine ou à 60 mg de tryptophane. L’apport total d’un aliment s’obtient donc en additionnant la niacine préformée et un soixantième du tryptophane. Exemple pédagogique : un repas apportant 8 mg de niacine et 360 mg de tryptophane fournit 8 + 6 = 14 mg d’équivalents niacine.</p><h3>Pourquoi le tryptophane compte</h3><p>Dans le foie, la voie de la kynurénine convertit le tryptophane en niacine. Elle exige les vitamines B1, B2 et B6 ; une carence en B6 la ralentit et des carences en zinc et en cuivre pourraient la freiner. Le lait, pauvre en niacine mais riche en tryptophane, protège pour cette raison.</p><h3>Conséquence clinique</h3><p>Une absorption intestinale altérée, un détournement du tryptophane vers la sérotonine ou un défaut de transport (maladie de Hartnup) font baisser cette seconde source. La pellagre devient possible même avec un apport de niacine préformée correct.</p><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, pages 10 et 11</a> ; <a href="https://www.dge.de/wissenschaft/referenzwerte/niacin/" target="_blank" rel="noopener">DGE</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, section 15.1</a>.</p></template>
<template data-pop="e52-niacine-liee" data-title="Maïs, niacine liée et traitement alcalin"><h3>Le mécanisme</h3><p>Dans le maïs, la niacine est liée de façon covalente à des peptides et à des glucides. Sous cette forme, elle n’est pas disponible pour l’absorption. L’hydrolyse alcaline douce la libère. Les peuples amérindiens qui traitaient le maïs à la chaux ou à la cendre (nixtamalisation) n’étaient pas touchés par la pellagre ; les populations européennes qui adoptaient le maïs sans ce traitement l’étaient.</p><h3>Conséquences</h3><p>La niacine des céréales est moins bien absorbée que celle des aliments animaux. Un régime à base de maïs ou de sorgho non traité expose donc à la pellagre même si la quantité de niacine analysée paraît suffisante. Le lait protège, car son tryptophane se convertit en niacine.</p><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, pages 3 et 11</a> ; <a href="https://www.dge.de/wissenschaft/referenzwerte/niacin/" target="_blank" rel="noopener">DGE</a>.</p></template>
<template data-pop="e52-3d" data-title="La maladie des trois D et ses limites"><h3>Origine et usage</h3><p>Les trois D sont la dermatite, la diarrhée et la démence ; le quatrième D désigne le décès. L’expression résume l’évolution d’une pellagre non traitée et reste utile comme aide-mémoire. Elle ne sert pas de critère diagnostique.</p><h3>Pourquoi l’OMS la juge trompeuse</h3><p>La diarrhée n’est pas constante, la démence est relativement rare et la dépression est fréquente. Dans la revue systématique 2000–2023, l’atteinte cutanée est présente dans 98,6 % des cas, l’atteinte digestive dans 59,4 % et l’atteinte neurologique dans 54,2 %. Dans une série alcoolique de 16 patients, trois seulement avaient la triade complète. Pour la forme encéphalopathique, certains auteurs préfèrent le terme de delirium à celui de démence.</p><div class="trap"><span class="k">Piège</span> Écarter la pellagre faute de diarrhée ou de démence.</div><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, note 1 page 2</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41876960/" target="_blank" rel="noopener">revue systématique 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35500141/" target="_blank" rel="noopener">Chen et al. 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38222748/" target="_blank" rel="noopener">Ann Med Surg 2024</a>.</p></template>
<template data-pop="e52-collier-casal" data-title="Collier de Casal : distribution et terminologie"><h3>Description</h3><p>Le collier désigne l’atteinte de la base du cou et du haut du thorax, selon l’encolure du vêtement. La partie haute du cou, ombragée par le menton, est épargnée. Il s’ajoute aux autres zones exposées : dos des mains et avant-bras jusqu’au bord des manches, pieds et jambes jusqu’à l’ourlet, front, nez et joues.</p><h3>Terminologie et histoire</h3><p>L’OMS déconseille l’expression « collier de Casal », mais la clinique l’emploie encore. Le nom renvoie à Gaspar Casal, qui a décrit la maladie dans les Asturies ; l’OMS date cette description de 1763, une autre source de 1735. Cette divergence n’est pas résolue dans le dossier.</p><h3>Intérêt diagnostique</h3><p>Un collier associé à une dermatite des mains, symétrique et nettement démarquée, soutient la pellagre. Il distingue celle-ci de nombreuses éruptions phototoxiques ou bulleuses (<button class="w" data-k="e52-differentiel-cutane">diagnostic différentiel cutané</button>).</p><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, pages 2 et 4</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39045418/" target="_blank" rel="noopener">Front Med 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42381827/" target="_blank" rel="noopener">cas de pellagre bulleuse, 2026</a>.</p></template>
<template data-pop="e52-photosensibilite" data-title="Photosensibilité de la pellagre"><h3>Mécanisme lu dans le dossier</h3><p>Les ultraviolets aggravent la dermatite parce que le déficit en NAD empêche la réparation de l’ADN et la récupération des kératinocytes. Cette explication provient d’un cas de pellagre bulleuse.</p><h3>Limites</h3><p>D’autres hypothèses sur la photosensibilité (voie de la kynurénine, acide urocanique) n’ont pas été lues dans les sources de ce chapitre. L’OMS décrit aussi des lésions aux zones de friction et aux points de pression, sans mécanisme détaillé. Les lésions peuvent manquer si la peau n’a pas été exposée.</p><h3>Conséquence pratique</h3><p>La photoprotection complète le traitement. L’anamnèse doit chercher une exposition solaire récente, qui déclenche ou aggrave l’éruption.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/42381827/" target="_blank" rel="noopener">cas de pellagre bulleuse, 2026</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, pages 4 et 6</a>.</p></template>
<template data-pop="e52-sources" data-title="Référentiels et sources du chapitre"><h3>Ce qui fonde le cours</h3><p>Le chapitre repose sur des textes lus en entier : la recommandation de l’ESPEN de 2022 sur les micronutriments (section niacine, recommandations 16.1 à 16.6), le document de l’OMS de 2000 sur la pellagre dans les situations d’urgence, les valeurs de référence de la DGE et de l’ÖGE, la CIM-10-GM 2024 de l’OFS et du BfArM, les directives suisses SMOB (en vigueur dès le 1.7.2023), les informations professionnelles suisses de Bécozyme forte (mars 2026), Soluvit N (novembre 2022) et Cernévit (juillet 2023), ainsi qu’une revue systématique de 2026, une étude cas-témoins de 2022 et des cas rapportés.</p><h3>Limites</h3><table class="t"><tr><th>Limite</th><th>Conséquence</th></tr><tr><td>Aucune source suisse propre à la pellagre</td><td>Épidémiologie suisse inconnue</td></tr><tr><td>Document de l’OMS de 2000, seuils provisoires</td><td>Valeurs biochimiques non entérinées</td></tr><tr><td>Texte de l’EFSA inaccessible</td><td>Limites supérieures citées de seconde main</td></tr><tr><td>Doses parentérales « OMS » de cas rapportés non retrouvées</td><td>Non utilisées</td></tr><tr><td>Aucune monopréparation suisse de nicotinamide retrouvée</td><td>Obtention de 300 mg par jour non documentée</td></tr></table><p>Pour un contentieux clinique, la source primaire applicable la plus récente l’emporte ; ici, la recommandation de l’ESPEN (2022) est le texte de recommandation le plus récent lu, et le document de l’OMS (2000) reste la source de plusieurs repères pratiques plus anciens.</p></template>
<template data-pop="e52-apports" data-title="Apports recommandés de niacine : comparaison des sources"><h3>Le tableau</h3><p>Les trois sources ne mesurent pas la même chose. La DGE et l’ÖGE donnent des apports recommandés en équivalents niacine ; l’OMS donne la quantité qui prévient la pellagre ; l’ESPEN cite des valeurs de référence reprises d’une autre source, données ici à titre de comparaison et non comme fondement d’une conduite.</p><table class="t"><tr><th>Population</th><th>DGE et ÖGE (mg d’équivalents niacine par jour)</th><th>ESPEN (mg par jour)</th><th>OMS</th></tr><tr><td>Homme adulte</td><td>14–16 selon l’âge</td><td>16 (plus de 14 ans)</td><td>15–20 mg de niacine par jour, tout âge</td></tr><tr><td>Femme adulte</td><td>11–13 selon l’âge</td><td>14</td><td>15–20</td></tr><tr><td>Grossesse</td><td>14 (2e trimestre), 16 (3e trimestre)</td><td>18</td><td>—</td></tr><tr><td>Allaitement</td><td>16</td><td>16</td><td>—</td></tr></table><p>L’adoption par la Suisse des valeurs de la DGE et de l’ÖGE n’a pas été vérifiée. En nutrition artificielle, l’ESPEN recommande 18 à 40 mg par jour pour 1500 kcal en nutrition entérale et au moins 40 mg par jour en nutrition parentérale.</p><p class="src">Références : <a href="https://www.dge.de/wissenschaft/referenzwerte/niacin/" target="_blank" rel="noopener">DGE</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, page 15</a>.</p></template>
<template data-pop="e52-biomarqueurs" data-title="Biomarqueurs du statut en niacine"><h3>Ce qui est mesurable</h3><table class="t"><tr><th>Biomarqueur</th><th>Ce qu’il reflète</th><th>Limite</th></tr><tr><td>NAD sanguin ou tissulaire</td><td>Statut en niacine ; recommandé par l’ESPEN (16.2, grade A, 91 %) ; peut être mesuré devant diarrhée, dermatite ou démence (16.1, bonne pratique clinique, 89 %)</td><td>Disponibilité en routine suisse non documentée</td></tr><tr><td>Index de niacine (rapport NAD/NADP érythrocytaire)</td><td>Statut érythrocytaire</td><td>Les métabolites urinaires ont été préférés chez des patients atteints de pellagre clinique</td></tr><tr><td>N1-méthylnicotinamide et 2-pyridone urinaires</td><td>Apport ; le premier est le plus sensible à un apport marginal</td><td>Reflètent l’apport, non forcément le diagnostic</td></tr><tr><td>Niacine ou nicotinamide sériques</td><td>—</td><td>De moins de 20 ng/mL à environ 30 000 ng/mL : trop variables</td></tr></table><p>La conduite pragmatique de l’ESPEN consiste à conserver un échantillon de sang et à juger l’effet du traitement quand le dosage est difficile.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, section 15.3 et recommandations 16.1 et 16.2</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37251973/" target="_blank" rel="noopener">cas de pellagre après dérivation gastrique, 2023</a>.</p></template>
<template data-pop="e52-seuils-oms" data-title="Seuils urinaires de l’OMS : N1-méthylnicotinamide et 2-pyridone"><h3>Les seuils</h3><p>Les métabolites urinaires de la niacine sont le N1-méthylnicotinamide et la 2-pyridone. L’OMS propose, à titre provisoire, les catégories suivantes pour l’adulte, exprimées en milligrammes par gramme de créatinine.</p><table class="t"><tr><th>Catégorie</th><th>N1-méthylnicotinamide</th></tr><tr><td>Déficiente</td><td>moins de 0,5</td></tr><tr><td>Basse</td><td>0,5 à 1,59</td></tr><tr><td>Acceptable</td><td>1,6 à 4,29</td></tr><tr><td>Élevée</td><td>4,3 ou plus</td></tr></table><p>Un rapport 2-pyridone/N1-méthylnicotinamide inférieur à 1 correspond à un déficit latent. L’excrétion de N1-méthylnicotinamide est de 7 à 10 mg par jour sur un total d’au plus 30 mg par jour de métabolites.</p><h3>Limites</h3><p>Ces seuils sont provisoires, établis dans un contexte de santé publique. Ils reflètent l’apport et non le diagnostic de pellagre.</p><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, tableau 4 et pages 8 et 10</a>.</p></template>
<template data-pop="e52-differentiel-cutane" data-title="Dermatite photodistribuée : diagnostic différentiel"><h3>Les hypothèses</h3><p>Un cas de pellagre bulleuse chez un patient alcoolique opéré d’une dérivation gastrique a conduit à discuter l’éruption phototoxique médicamenteuse, la phytophotodermatite, le lupus bulleux, la porphyrie, la pseudoporphyrie, l’érythème pigmenté fixe bulleux et l’érythème polymorphe. Un autre cas d’éruption « en châle » corticorésistante a fait discuter la dermatomyosite, dont l’histologie d’interface est trompeuse.</p><h3>Ce qui discrimine</h3><table class="t"><tr><th>Élément</th><th>En faveur de la pellagre</th></tr><tr><td>Collier de Casal</td><td>Présent</td></tr><tr><td>Contexte nutritionnel</td><td>Alcool, malabsorption, bariatrie, régime restrictif</td></tr><tr><td>Signe de Nikolsky</td><td>Négatif dans le cas bulleux</td></tr><tr><td>Réponse à la vitamine</td><td>Rapide</td></tr></table><p>Le dossier ne détaille pas les éléments propres à chaque différentiel (par exemple le dosage des porphyrines) ; il ne faut pas les compléter de mémoire. Les dermatoses de malnutrition de l’OMS (tableau 3) se distinguent par l’absence de démarcation nette, l’absence de squames en bordure et la localisation en zone non exposée.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/42381827/" target="_blank" rel="noopener">cas de pellagre bulleuse, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41111680/" target="_blank" rel="noopener">Cureus 2025</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, page 7</a>.</p></template>
<template data-pop="e52-encephalopathie" data-title="Encéphalopathie pellagreuse : tableau clinique et mécanismes proposés"><h3>Tableau clinique</h3><p>Chez l’alcoolique, l’encéphalopathie pellagreuse associe confusion, obnubilation, hypertonie oppositionnelle (résistance du tonus musculaire à la mobilisation passive), ataxie, myoclonies dans environ la moitié des cas et hallucinations. L’électroencéphalogramme montre un ralentissement diffus thêta, profil de delirium plutôt que de démence. En carence aiguë, le tableau est proche de celui de l’encéphalopathie de Wernicke. L’imagerie est non spécifique et sert à exclure les diagnostics concurrents.</p><h3>Neuropathologie</h3><p>La lésion décrite est une chromatolyse neuronale diffuse, surtout pyramidale, souvent associée à une maladie de Marchiafava-Bignami ou de Wernicke-Korsakoff.</p><h3>Mécanismes proposés</h3><p>Cinq voies sont proposées, en partie expérimentales : la voie de la kynurénine et de l’acide kynurénique, le métabolisme de l’ATP mitochondrial, la poly-ADP-ribose polymérase (PARP, grande consommatrice de NAD), l’axe du facteur neurotrophique dérivé du cerveau et de son récepteur, et des facteurs génétiques. Aucune n’est établie comme cause unique.</p><div class="trap"><span class="k">Piège</span> Traiter l’encéphalopathie de l’alcoolique par la thiamine seule. La coexistence avec Wernicke est fréquente, mais la thiamine sans niacine a semblé aggraver l’état dans la série de Serdaru.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/3401685/" target="_blank" rel="noopener">Serdaru et al., Brain 1988</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38222748/" target="_blank" rel="noopener">Ann Med Surg 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25317166/" target="_blank" rel="noopener">Fu et al. 2014</a>.</p></template>
<template data-pop="e52-serdaru" data-title="Série de Serdaru : autopsies et traitement par thiamine"><h3>Ce que rapporte l’étude</h3><p>Serdaru et ses collègues (Brain 1988) décrivent le spectre clinique de l’encéphalopathie pellagreuse alcoolique. Dans leurs autopsies de 22 buveurs excessifs, ils trouvent une chromatolyse neuronale diffuse de type pellagreux, associée dans 13 cas à une maladie de Marchiafava-Bignami ou de Wernicke-Korsakoff. La pellagre alcoolique était souvent méconnue du vivant.</p><h3>Le résultat thérapeutique</h3><p>Chez 15 patients traités par thiamine et pyridoxine sans niacine, le traitement a semblé aggraver l’état neurologique ou déclencher l’encéphalopathie pellagreuse dans 9 cas. Les auteurs recommandent une polyvitaminothérapie dans toute encéphalopathie non étiquetée de l’alcoolique.</p><h3>Limites</h3><p>L’étude est ancienne et observationnelle ; « a semblé » traduit l’absence de démonstration causale. Elle justifie la prudence, non un seuil de dose.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/3401685/" target="_blank" rel="noopener">Serdaru et al., Brain 1988;111:829–842</a>.</p></template>
<template data-pop="e52-revue-systematique" data-title="Revue systématique 2000–2023 sur la pellagre"><h3>Méthode et population</h3><p>Litaiem et collègues ont analysé 133 études, soit 1212 cas de pellagre publiés de 2000 à 2023 (Int J Dermatol 2026).</p><h3>Résultats</h3><table class="t"><tr><th>Mesure</th><th>Résultat</th></tr><tr><td>Atteinte cutanée</td><td>98,6 %</td></tr><tr><td>Atteinte digestive</td><td>59,4 %</td></tr><tr><td>Atteinte neurologique</td><td>54,2 %</td></tr><tr><td>Cause alimentaire</td><td>85 % (dont 93 % en insécurité alimentaire ou crise humanitaire)</td></tr><tr><td>Alcool</td><td>9,6 %</td></tr><tr><td>Isoniazide</td><td>première cause médicamenteuse, 14,3 %</td></tr><tr><td>Résolution complète</td><td>27,4 jours de supplémentation en moyenne</td></tr></table><p>Les causes médicamenteuses et de malabsorption sont en progression. La revue décrit des cas publiés, souvent de pays à ressources limitées : elle ne donne pas l’incidence suisse.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41876960/" target="_blank" rel="noopener">Litaiem et al., Int J Dermatol 2026;65(8):1590–1599</a>.</p></template>
<template data-pop="e52-malawi" data-title="Étude cas-témoins du Malawi sur l’isoniazide"><h3>Résultat principal</h3><p>Pendant l’extension d’un traitement préventif de la tuberculose, une étude cas-témoins (Lancet Glob Health 2022) associe l’isoniazide en prophylaxie continue à un rapport de cotes ajusté de 42,6 (intervalle de confiance à 95 % : 13,3 à 136,6) de pellagre. Les autres facteurs associés sont l’infection par le VIH, l’insécurité alimentaire, l’insuffisance pondérale, l’alcool et l’allaitement.</p><h3>Délai et mécanisme</h3><p>Le délai médian entre le début de l’isoniazide et l’éruption est de 5 mois en période de disette, contre 9 mois après la récolte. L’isoniazide perturbe la synthèse intracellulaire de niacine. La voie de la kynurénine dépend de la pyridoxine, et la coadministration de B6 n’a eu qu’un effet protecteur modeste.</p><h3>Prise en charge</h3><p>Une multivitamine B quotidienne contenant 300 mg de nicotinamide pendant 30 jours, avec arrêt de l’isoniazide, a été suivie d’une amélioration à 30 jours. Des schémas à base de rifamycine ont été proposés. Coadministrer préventivement une multivitamine B contenant de la niacine reste « à explorer ».</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35427527/" target="_blank" rel="noopener">Lancet Glob Health 2022;10:e705–e714</a>.</p></template>
<template data-pop="e52-isoniazide" data-title="Isoniazide et pellagre"><h3>Pourquoi l’isoniazide</h3><p>L’isoniazide est le médicament le mieux documenté parmi les causes médicamenteuses : il représente 14,3 % des cas de la revue systématique 2000–2023 et son association atteint un rapport de cotes ajusté de 42,6 dans l’<button class="w" data-k="e52-malawi">étude du Malawi</button>. Il perturbe la synthèse intracellulaire de niacine ; l’OMS note aussi une inhibition de l’absorption de la niacine par l’isoniazide et la rifampicine.</p><h3>Quand y penser</h3><p>Chez tout patient sous isoniazide, surtout en prophylaxie continue, avec insécurité alimentaire, infection par le VIH, insuffisance pondérale, alcool ou allaitement, une éruption photodistribuée ou une diarrhée doit faire évoquer la pellagre.</p><h3>Conduite décrite</h3><p>Arrêt ou substitution du médicament, nicotinamide associé à une multivitamine B. Les autres médicaments (6-mercaptopurine, 5-fluorouracile, chloramphénicol, azathioprine, anticonvulsivants) sont cités avec un niveau de preuve moindre ; le pyrazinamide et l’éthionamide ne sont pas documentés dans ce dossier.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35427527/" target="_blank" rel="noopener">Lancet Glob Health 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41876960/" target="_blank" rel="noopener">revue systématique 2026</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, pages 10 et 13</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33471377/" target="_blank" rel="noopener">Prabhu et al. 2021</a>.</p></template>
<template data-pop="e52-carcinoide" data-title="Syndrome carcinoïde et détournement du tryptophane"><h3>Mécanisme</h3><p>Une tumeur neuroendocrine sécrète de la sérotonine. Elle détourne jusqu’à 99 % du tryptophane alimentaire vers la voie de la sérotonine, contre environ 1 % normalement. Le substrat de la synthèse de nicotinamide manque alors.</p><h3>Fréquence et reconnaissance</h3><p>La pellagre clinique est rare et survient à un stade tardif ; la déplétion biochimique infraclinique serait plus fréquente mais mal définie. Le syndrome se reconnaît par le flush, la diarrhée et les sifflements. Un cas a été rapporté avec un carcinoïde pulmonaire atypique.</p><h3>Examens et piège</h3><p>L’acide 5-hydroxy-indole-acétique urinaire et le tryptophane plasmatique renseignent la charge sérotoninergique, non le statut en niacine. La prise en charge de la tumeur fait partie du traitement.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/42735610/" target="_blank" rel="noopener">Baldini et al., Nutrition 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42004872/" target="_blank" rel="noopener">Clin Case Rep 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39045418/" target="_blank" rel="noopener">Front Med 2024</a>.</p></template>
<template data-pop="e52-hartnup" data-title="Maladie de Hartnup"><h3>Ce qui est établi dans le dossier</h3><p>La maladie de Hartnup est un défaut congénital d’absorption et de transport du tryptophane. Elle bloque la voie tryptophane vers acide nicotinique et peut ainsi produire un tableau de pellagre. La CIM-10-GM 2024 la classe sous E72.0.</p><h3>Quand y penser</h3><p>Le début précoce et le caractère familial l’évoquent, devant une pellagre sans autre cause.</p><h3>Limites</h3><p>La prise en charge spécifique, la génétique et l’épidémiologie de la maladie n’ont pas été lues ; le dossier ne les décrit pas et le chapitre ne les complète pas de mémoire.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39045418/" target="_blank" rel="noopener">Front Med 2024</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, page 13</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e70-e90.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc E70–E90</a>.</p></template>
<template data-pop="e52-alcool" data-title="Pellagre alcoolique"><h3>Pourquoi l’alcool</h3><p>Chez l’alcoolique, plusieurs mécanismes concourent : malnutrition, absorption réduite de la niacine et de ses précurseurs, conversion du tryptophane en niacine diminuée, carence en zinc, troubles de la synthèse de l’hème, modifications du glutamate et du GABA. La CIM-10-GM 2024 inclut la pellagre alcoolique dans E52.</p><h3>Présentation</h3><p>La pellagre alcoolique se présente souvent sans éruption, ou seulement par un delirium. Dans une série rétrospective de 16 patients, trois avaient la triade complète ; deux avaient une encéphalopathie de Wernicke associée et trois un syndrome de sevrage. Un cas rapporté chez un homme de plus de 80 ans alcoolique avait une présentation confusionnelle.</p><h3>Prise en charge</h3><p>Sevrage et abstinence, réalimentation, polyvitaminothérapie incluant la niacine, supplémentation en zinc si carence. La thiamine seule peut aggraver l’état.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35500141/" target="_blank" rel="noopener">Chen et al. 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38222748/" target="_blank" rel="noopener">Ann Med Surg 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/3401685/" target="_blank" rel="noopener">Serdaru et al. 1988</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36323450/" target="_blank" rel="noopener">BMJ Case Rep 2022</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, page 13</a>.</p></template>
<template data-pop="e52-bariatrique" data-title="Chirurgie bariatrique et pellagre"><h3>Risque</h3><p>Une dérivation gastrique réduit l’absorption et expose à des carences vitaminiques multiples. La pellagre a été rapportée après dérivation gastrique de Roux-en-Y, parfois en association à l’alcool. Dans ce contexte, la voie orale peut échouer et la voie intramusculaire a été utilisée dans un cas.</p><h3>Prévention suisse</h3><p>Les directives suisses de la Société suisse d’étude de l’obésité morbide (SMOB), en vigueur dès le 1.7.2023, prévoient des multivitamines (minéraux et oligo-éléments inclus) à long terme, et à vie après chirurgie malabsorptive. Le bilan annuel inclut le statut vitaminique, et le succès de toute correction de carence est contrôlé.</p><h3>Dépistage</h3><p>Le dépistage systématique de la niacine après bariatrie a un rapport coût-efficacité inconnu ; le dosage est utile si des symptômes apparaissent.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37251973/" target="_blank" rel="noopener">cas de pellagre après dérivation gastrique, 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42381827/" target="_blank" rel="noopener">cas de pellagre bulleuse, 2026</a> ; <a href="https://www.smob.ch/wp-content/uploads/2026/04/SMOB-Directives-2023-07-01-Fr.pdf" target="_blank" rel="noopener">directives SMOB 2023</a>.</p></template>
<template data-pop="e52-mnemo" data-title="Moyens mnémotechniques (aide pédagogique, non critère officiel)"><h3>Trois organes, quatre maillons</h3><p><b>Aide pédagogique, non critère officiel.</b> Pour l’examen clinique, retenir les trois organes qui consomment le plus d’énergie ou se renouvellent le plus vite : peau, intestin, cerveau. Pour l’interrogatoire, parcourir les quatre maillons de la chaîne : apport, absorption, conversion du tryptophane, consommation de coenzyme.</p><h3>Les trois D</h3><p>Dermatite, diarrhée, démence, puis décès. Ce moyen est historique ; l’OMS le juge trompeur parce que la diarrhée n’est pas constante et que la dépression est plus fréquente que la démence.</p><h3>Règle d’action</h3><p>Échantillon, nicotinamide, complexe B, cause : quatre gestes dans l’ordre devant un contexte à risque.</p></template>
