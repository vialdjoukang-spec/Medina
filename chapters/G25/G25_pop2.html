<template data-pop="g25-d-topiramate" data-title="Topiramate">
<div class="lab">Statut</div>
<p>Hors étiquette pour le tremblement essentiel. L’information professionnelle suisse n’a pas été lue (lacune 3).</p>
<div class="lab">Preuves</div>
<p>La ligne directrice 2022 recommande qu’il soit utilisé, à 200 à 400 mg ; les abandons sont fréquents dans les essais.</p>
<div class="lab">Limite</div>
<p>Mécanisme, contre-indications et surveillance ne sont pas documentés dans le dossier.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, rec. 3,4.</p>
</template>
<template data-pop="g25-d-toxine" data-title="Toxine botulique, stimulation cérébrale profonde et ultrasons focalisés">
<div class="lab">Toxine botulique</div>
<p>Envisageable pour le tremblement des mains (faiblesse réversible), efficace chez plus de la moitié des patients pour le tremblement céphalique (faiblesse de maintien de la tête, cervicalgies, dysphagie), recommandée sous guidage électromyographique dans le tremblement dystonique du bras.</p>
<div class="lab">Stimulation cérébrale profonde</div>
<p>Du noyau ventral intermédiaire du thalamus, uni- ou bilatérale, pour les formes sévères pharmacorésistantes ; bilatérale en cas de tremblement axial (voix, tête) ; cible pallidale interne si dystonique. Indication en centre spécialisé.</p>
<div class="lab">Ultrasons focalisés guidés par IRM</div>
<p>Unilatéral pour le tremblement pharmacorésistant ; bilatéral seulement en études ou registres.</p>
<div class="lab">À éviter</div>
<p>Thalamotomie par radiofréquence (sauf exception, bilatérale proscrite) et radiochirurgie.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, rec. 5,11–16,18–30.</p>
</template>
<template data-pop="g25-d-gabapentinoides" data-title="Gabapentine et prégabaline">
<div class="lab">Statut</div>
<p>Hors étiquette pour les jambes sans repos ; gabapentine recommandée dans le tremblement orthostatique primaire (hors étiquette). L’information suisse n’a pas été lue (lacune 3).</p>
<div class="lab">Posologie</div>
<p>Gabapentine 200 à 1800 mg/j en prises fractionnées ; prégabaline 150 à 450 mg le soir, début à 50 à 75 mg.</p>
<div class="lab">Effets et précautions</div>
<p>Vertiges, œdèmes, ataxie et somnolence, surtout chez l’âgé ; élimination rénale.</p>
<div class="lab">Place</div>
<p>Première ligne possible dans les jambes sans repos, à la place d’un dopaminergique ; ligands α2δ ; moins d’effet que les agonistes dopaminergiques sur les mouvements périodiques. La prégabaline est à ne pas utiliser dans le tremblement essentiel.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, rec. 9,§2.7.2; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>.</p>
</template>
<template data-pop="g25-d-myoclonie" data-title="Traitements de la myoclonie">
<div class="lab">Principe</div>
<p>Les preuves randomisées sont rares ; le traitement est symptomatique et cible le générateur, après correction de la cause.</p>
<div class="lab">Choix</div>
<p>Corticale : valproate, clonazépam, piracétam, phénobarbital, lévétiracétam, topiramate, zonisamide, souvent combinés. Urgence : diazépam, lorazépam, clonazépam, midazolam, valproate ou lévétiracétam par voie veineuse. Segmentaire : clonazépam, lévétiracétam, tétrabénazine, toxine botulique, baclofène intrathécal.</p>
<div class="lab">Limite</div>
<p>L’information suisse du clonazépam (Rivotril) n’a pas été lue ; doses non extraites.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders</a>.</p>
</template>
<template data-pop="g25-d-tiapride" data-title="Tiapride (Tiapridal)">
<div class="lab">Indications suisses</div>
<p>Formes sévères de chorée de Huntington de l’adulte ; tics sévères de l’enfant, de l’adolescent et de l’adulte après échec du non-pharmacologique.</p>
<div class="lab">Posologie</div>
<p>Chorée de Huntington : jusqu’à 1200 mg/j au début, entretien 300 à 600 mg/j ; réduction de dose si clairance &lt; 60 ml/min. Dose pour les tics : non extraite.</p>
<div class="lab">Limite</div>
<p>Aucune source lue ne l’autorise dans les autres chorées.</p>
<p class="src">Références : <a href="AmiKo GTIN 7680392200160" target="_blank" rel="noopener" data-reference-source="1">Tiapridal®</a>.</p>
</template>
<template data-pop="g25-d-fer" data-title="Fer dans les jambes sans repos">
<div class="lab">Indication</div>
<p>Ferritine ≤ 75 µg/l ou saturation de la transferrine &lt; 20 % chez tout patient avec jambes sans repos ; pendant la grossesse, ferritine ≤ 75 µg/l.</p>
<div class="lab">Voies</div>
<p>Fer oral (sulfate ferreux avec 100 mg de vitamine C) pour les formes légères ; carboxymaltose ferrique par voie veineuse, 1000 mg en une fois (le résumé suisse mentionne aussi 2 × 500 mg en une semaine) pour les formes modérées à sévères ou en cas d’échec ou d’intolérance orale ; à partir du deuxième trimestre pendant la grossesse. Premier traitement chez l’enfant.</p>
<div class="lab">Limites et surveillance</div>
<p>Ne pas dépasser ferritine 300 µg/l ni saturation 40 %. Contrôle clinique et biologique à 12 semaines.</p>
<div class="lab">Limite du dossier</div>
<p>L’information professionnelle suisse de Ferinject n’a pas été lue ; effets indésirables et contre-indications ne sont pas documentés ici (lacune 3).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://rosenfluh.ch/arsmedici-2023-06/neue-leitlinie-zum-restless-legs-syndrom" target="_blank" rel="noopener" data-reference-source="1">Neue Leitlinie zum Restless-Legs-Syndrom</a>.</p>
</template>
<template data-pop="g25-d-pramipexole" data-title="Pramipexole (Sifrol)">
<div class="lab">Indication suisse</div>
<p>Syndrome des jambes sans repos idiopathique.</p>
<div class="lab">Posologie</div>
<p>0,125 mg une fois par jour, 2 à 3 h avant le coucher ; +0,125 mg tous les 4 à 7 jours ; maximum 0,75 mg/j (sel). Ligne directrice 2024 : 0,18 à 0,52 mg (base).</p>
<div class="lab">Effets indésirables</div>
<p>Augmentation très fréquente (11,8 %) ; rebond chez 10 % des patients à l’arrêt brutal ; œdèmes, nausées, hypotension orthostatique ; troubles du contrôle des impulsions (12,4 % sous dose stable) ; attaques de sommeil, d’où arrêt de la conduite.</p>
<div class="lab">Place</div>
<p>Premier choix médicamenteux possible, en monothérapie à la plus faible dose.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="AmiKo GTIN 7680542770161" target="_blank" rel="noopener" data-reference-source="1">Sifrol®/Sifrol ER</a>.</p>
</template>
<template data-pop="g25-d-rotigotine" data-title="Rotigotine (Neupro)">
<div class="lab">Indication suisse</div>
<p>Syndrome des jambes sans repos idiopathique modéré à sévère de l’adulte.</p>
<div class="lab">Posologie</div>
<p>1 mg/24 h, +1 mg par semaine, maximum 3 mg/24 h ; dose recommandée par la ligne directrice : 2 mg ; alterner le site d’application.</p>
<div class="lab">Augmentation</div>
<p>Cliniquement significative chez 1,5 % (6 mois, double aveugle), jusqu’à 9,4 % (un an, ouvert) ; ligne directrice : 1,7 % contre 7,2 % sous agonistes oraux.</p>
<div class="lab">Place</div>
<p>Agent de longue durée utilisé lors de l’augmentation.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="AmiKo GTIN 7680574170236" target="_blank" rel="noopener" data-reference-source="1">Neupro®</a>.</p>
</template>
<template data-pop="g25-d-ropinirole" data-title="Ropinirole">
<div class="lab">Ligne directrice</div>
<p>Dose citée : 0,25 à 4 mg pour les jambes sans repos.</p>
<div class="lab">Statut suisse</div>
<p>Les informations suisses consultées (Requip, Requip-Modutab, Ropinirol-Mepha retard, Ropinirole Sandoz retard) ne mentionnent que la maladie de Parkinson. L’autorisation suisse pour les jambes sans repos n’est pas confirmée (lacune 8 ; Adartrel non trouvé).</p>
<div class="lab">Conséquence</div>
<p>Ne pas le présenter comme autorisé dans cette indication en Suisse sans vérification.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="AmiKo GTIN Requip (recherche 'requip'), 7680626140026, 7680624800021" target="_blank" rel="noopener" data-reference-source="1">Requip®/Requip-Modutab, Ropinirol-Mepha retard, Ropinirole Sandoz Retard</a>.</p>
</template>
<template data-pop="g25-d-levodopa" data-title="Lévodopa avec inhibiteur de décarboxylase (Madopar)">
<div class="lab">Fiche suisse</div>
<p>Syndrome des jambes sans repos idiopathique et symptomatique ; traitement « généralement prolongé » ; 62,5 à 125 mg au coucher, jusqu’à 500 mg/24 h.</p>
<div class="lab">Ligne directrice</div>
<p>Pas de traitement continu ; usage intermittent ou diagnostique, 100 mg au plus, car l’augmentation est élevée, surtout à partir de 200 mg/j.</p>
<div class="lab">Grossesse</div>
<p>Lévodopa avec carbidopa (100/25 à 200/50 mg) ; jamais de bensérazide.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="AmiKo GTIN 7680380960953" target="_blank" rel="noopener" data-reference-source="1">Madopar®</a>.</p>
</template>
<template data-pop="g25-div-levodopa" data-title="Lévodopa : intermittent ou prolongé ?">
<div class="lab">Deux textes</div>
<p>La fiche suisse du Madopar autorise le syndrome des jambes sans repos idiopathique et symptomatique et décrit un traitement généralement prolongé, jusqu’à 500 mg/24 h. La ligne directrice 2024, coapprouvée par la Société suisse de neurologie, déconseille tout traitement continu et limite la lévodopa à 100 mg en usage intermittent ou diagnostique.</p>
<div class="lab">Arbitrage</div>
<p>La ligne directrice est plus récente et spécifique : elle est retenue pour la conduite clinique, parce qu’elle s’appuie sur le risque d’augmentation. La fiche reste le texte en vigueur pour l’autorisation. Le médecin choisit donc un usage intermittent et documente son choix.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="AmiKo GTIN 7680380960953" target="_blank" rel="noopener" data-reference-source="1">Madopar®</a>.</p>
</template>
<template data-pop="g25-augmentation" data-title="Augmentation : critères et conduite">
<div class="lab">Critères</div>
<p>Avance d’environ deux heures du début des symptômes, extension à d’autres régions du corps, intensité accrue depuis le début du traitement, perte d’efficacité ; exclure les imitateurs et l’hyperalgésie induite par les opioïdes.</p>
<div class="lab">Prévention</div>
<p>Gabapentinoïde en première intention ou dopaminergique à la dose la plus faible, en monothérapie, sans dépasser la dose autorisée.</p>
<div class="lab">Conduite</div>
<p>Contrôler le fer (substituer si ferritine ≤ 75 µg/l ou saturation &lt; 20 %) ; réduire à la dose maximale autorisée ; passer à un agent de longue durée comme la rotigotine ou associer un opioïde ; sevrage très lent (syndrome de sevrage des agonistes : apathie, anxiété, dépression, fatigue, sueurs, douleurs).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="AmiKo GTIN 7680542770161" target="_blank" rel="noopener" data-reference-source="1">Sifrol®/Sifrol ER</a>; <a href="AmiKo GTIN 7680574170236" target="_blank" rel="noopener" data-reference-source="1">Neupro®</a>.</p>
</template>
<template data-pop="g25-d-akathisie" data-title="Akathisie : options et niveau de preuve">
<div class="lab">Clinique</div>
<p>Agitation motrice des jambes et agitation intérieure ; difficulté à rester assis ou debout ; pas de gêne sensitive ni de rythme circadien. Difficile à distinguer de la chorée ; provoquée par les antidopaminergiques et par la tétrabénazine.</p>
<div class="lab">Traitement</div>
<p>Réduire le médicament en cause ; options citées : propranolol, anticholinergiques, benzodiazépines, antagonistes 5-HT2A (cyproheptadine, trazodone, miansérine, mirtazapine).</p>
<div class="lab">Preuves</div>
<p>Méta-analyse en réseau de 19 essais et 661 patients : antagonistes 5-HT2A (différence moyenne standardisée −1,07) et bêtabloquants (−0,46) améliorent probablement, confiance faible ; benzodiazépines et vitamine B6, confiance très faible ; aucun essai sur la réduction de dose ni sur le changement d’antipsychotique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10666412/" target="_blank" rel="noopener" data-reference-source="1">Differential diagnosis of chorea</a>; <a href="https://doi.org/10.1093/schbul/sbae098" target="_blank" rel="noopener" data-reference-source="1">Comparative Efficacy and Acceptability of Treatment Strategies for Antipsychotic-Induced Akathi</a>; <a href="AmiKo GTIN 7680583750016" target="_blank" rel="noopener" data-reference-source="1">Xenazine®</a>.</p>
</template>
<template data-pop="g25-d-ivig" data-title="Syndrome de l’homme raide : traitements">
<div class="lab">Symptomatique</div>
<p>Benzodiazépines (diazépam) et baclofène, qui visent la transmission GABAergique.</p>
<div class="lab">Immunologique</div>
<p>Immunoglobulines intraveineuses : traitement le mieux étayé, surtout dans les formes sévères ou réfractaires. Échanges plasmatiques et autogreffe : résultats variables. Rituximab : pas de bénéfice démontré dans les essais randomisés.</p>
<div class="lab">Limite</div>
<p>Doses et information suisse non documentées dans le dossier.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/ene.70435" target="_blank" rel="noopener" data-reference-source="1">Systematic Review of Immune and Symptomatic Treatments for Stiff-Person Syndrome</a>.</p>
</template>
<template data-pop="g25-irm" data-title="IRM dans les mouvements anormaux">
<div class="lab">Quand</div>
<p>Obligatoire dans le tremblement cérébelleux ou intentionnel ; recommandée dans la chorée (coupes coronales, fer, calcifications, lésions) ; utile pour une lésion du tronc cérébral (Holmes) ou une pseudo-hypertrophie olivaire (vélopalatin symptomatique).</p>
<div class="lab">Lecture</div>
<p>Hypersignal T1 du putamen : hyperglycémie non cétosique. Atrophie caudée : maladie de Huntington. Fer réduit dans la substance noire : jambes sans repos (imagerie de recherche).</p>
<div class="lab">Limite</div>
<p>Une IRM normale n’exclut pas un tremblement essentiel, qui est un diagnostic clinique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.6.1; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10666412/" target="_blank" rel="noopener" data-reference-source="1">Differential diagnosis of chorea</a>.</p>
</template>
<template data-pop="g25-datscan" data-title="DaT-SPECT : indication et limites">
<div class="lab">Principe</div>
<p>Scintigraphie avec ioflupane marqué à l’iode 123, qui montre un déficit dopaminergique présynaptique.</p>
<div class="lab">Indication</div>
<p>Conditionnelle : doute entre tremblement fonctionnel et syndrome parkinsonien.</p>
<div class="lab">Limite</div>
<p>Le résultat ne remplace pas les signes positifs du tremblement fonctionnel.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.8.1.</p>
</template>
<template data-pop="g25-plms" data-title="Mouvements périodiques du sommeil">
<div class="lab">Définition</div>
<p>Mouvements périodiques des membres pendant le sommeil, surtout léger, souvent ignorés du dormeur, pouvant causer insomnie, sommeil non réparateur, somnolence.</p>
<div class="lab">Valeurs</div>
<p>Index > 15/h chez plus de 80 % des patients avec jambes sans repos ; > 5/h chez l’enfant. Ils augmentent avec l’âge et existent dans d’autres troubles du sommeil.</p>
<div class="lab">Traitement</div>
<p>Les agonistes dopaminergiques les réduisent davantage que les ligands α2δ.</p>
<div class="lab">Limite</div>
<p>Critères et prise en charge du trouble isolé non documentés (lacune 9).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://rosenfluh.ch/arsmedici-2023-06/neue-leitlinie-zum-restless-legs-syndrom" target="_blank" rel="noopener" data-reference-source="1">Neue Leitlinie zum Restless-Legs-Syndrom</a>; <a href="https://www.hug.ch/laboratoire-du-sommeil/syndrome-jambes-sans-repos" target="_blank" rel="noopener" data-reference-source="1">Syndrome des jambes sans repos — Laboratoire du sommeil</a>.</p>
</template>
<template data-pop="pareto-g25-bases" data-title="Pareto — Bases du cours">
<p class="ratio" data-cover="g25-0,g25-1,g25-2,g25-3"></p><ul><li>Nommer le mouvement avant d’agir : tremblement, myoclonie, chorée, tic, akathisie, jambes sans repos.</li><li>G25 est un carrefour de syndromes : chaque entité a sa classification, ses critères et son traitement.</li><li>Le tremblement essentiel est fréquent, le syndrome des jambes sans repos est fréquent chez le sujet âgé, la myoclonie est rare et souvent symptomatique.</li><li>Fer cérébral, dopamine déréglée et excitabilité corticale expliquent respectivement les jambes sans repos, l’augmentation et la myoclonie.</li></ul>
</template>
<template data-pop="pareto-g25-clinique" data-title="Pareto — Anamnèse, examen et démarche">
<p class="ratio" data-cover="g25-4,g25-5,g25-6,g25-7"></p><ul><li>Médicaments et hyperthyroïdie d’abord pour le tremblement ; glycémie et revue des médicaments pour la chorée.</li><li>Cinq critères pour les jambes sans repos : diagnostic clinique, polysomnographie en soutien.</li><li>L’électromyogramme debout est indispensable pour le tremblement orthostatique ; l’IRM pour le tremblement cérébelleux.</li><li>Le tremblement fonctionnel est un diagnostic positif, non d’exclusion.</li></ul>
</template>
<template data-pop="pareto-g25-pec" data-title="Pareto — Prise en charge, suivi et situations">
<p class="ratio" data-cover="g25-9,g25-10,g25-11"></p><ul><li>Tremblement essentiel : propranolol, primidone, topiramate ; connaître la liste des médicaments déconseillés.</li><li>Jambes sans repos : fer si ferritine ≤ 75 µg/l ou saturation &lt; 20 %, puis monothérapie minimale ; reconnaître l’augmentation.</li><li>Grossesse : jamais de bensérazide ; enfant : fer d’abord.</li><li>Chorée et tics : le dossier ne détaille pas la pharmacologie ; ne pas extrapoler l’autorisation suisse de la tétrabénazine ou du tiapride.</li></ul>
</template>
<template data-pop="pareto-g25-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g25-e-1,g25-e-2,g25-e-3,g25-e-4,g25-e-5,g25-e-6,g25-e-7,g25-e-8,g25-e-9,g25-e-10"></p><ul><li>Un examen par question : électromyographie, imagerie, bilan ferrique, polysomnographie, bilan étendu de la chorée.</li><li>Les seuils du fer sont des seuils de décision, non des intervalles normaux ; contrôle à 12 semaines.</li><li>La fréquence d’un tremblement oriente, ne tranche pas.</li><li>Les critères formels de l’homme raide n’ont pas été lus : ne pas les affirmer.</li></ul>
</template>
<template data-pop="pareto-g25-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g25-s-anat-cours"></p><ul><li>Chaque syndrome a son étage : cortex, noyaux gris, thalamus, tronc cérébral, moelle, nerf.</li><li>VIM pour le tremblement essentiel sévère, pallidum interne s’il est dystonique.</li><li>Holmes : noyau rouge ; vélopalatin : olive inférieure.</li></ul>
</template>
<template data-pop="pareto-g25-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g25-s-physio-cours"></p><ul><li>Fréquence et amplitude varient en sens inverse.</li><li>Excitabilité corticale, GABA et rythme circadien distinguent les syndromes proches.</li><li>Le tremblement renforcé dépend de l’adrénaline.</li></ul>
</template>
<template data-pop="pareto-g25-bioch" data-title="Pareto — Biochimie">
