<template data-pop="g25-definition" data-title="Un groupe de troubles, pas une maladie unique"><p>G25 rassemble plusieurs phénomènes : tremblement, myoclonies, certaines chorées et certains tics, jambes sans repos et autres troubles précisés. Le même terme administratif ne choisit pas le traitement.</p><p>Décrire le mouvement et son contexte, rechercher une cause et une urgence, puis choisir le code applicable. Certaines maladies ou symptômes ressemblants sont classés ailleurs.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM — ClaML G25 et G25.0/.1/.2/.3/.4/.5/.6/.8/.80/.81/.88/.9</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a>.</p></template>
<template data-pop="g25-phenotype" data-title="Phénotype : ce que l’on observe"><p>Préciser type de mouvement, rythme, durée, régions, côté, conditions d’activation, chronologie et signes associés. Ajouter les symptômes que l’examen ne peut voir, comme besoin de bouger ou gêne sensitive.</p><p>Le phénotype oriente les examens mais n’établit pas toujours la cause. Une même étiologie peut produire plusieurs profils et plusieurs causes peuvent produire un profil proche.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a>.</p></template>
<template data-pop="g25-etiology" data-title="Cause : relier des arguments concordants"><p>Histoire familiale et médicale, médicaments, événements et signes associés permettent de cibler une hypothèse. Début aigu et confusion ne s’explorent pas comme une oscillation bilatérale stable depuis des années.</p><p>La famille négative ne supprime pas toute hérédité ; une association médicamenteuse n’est pas toujours une preuve d’imputabilité. Expliquer ce qui est certain, probable et encore à chercher.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a>.</p></template>
<template data-pop="g25-rest" data-title="Repos réellement soutenu"><p>Pour caractériser un tremblement de repos, le membre doit être relâché et soutenu ; une main tenue en l’air maintient déjà une activité posturale. Décrire la condition de l’observation.</p><p>Un tremblement de repos ne suffit pas à lui seul à diagnostiquer Parkinson. Les autres signes, médicaments et contexte restent indispensables.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TREMOR — Définition, activation, causes, anamnèse et examen</a>.</p></template>
<template data-pop="g25-posture" data-title="Maintien de posture et mouvement"><p>Le tremblement postural apparaît lors d’un maintien contre la gravité ; le cinétique pendant le mouvement. Comparer aussi une tâche précise, car certaines manifestations dépendent d’une action ou d’une position.</p><p>Cette description prépare une hypothèse de syndrome. Elle ne prouve pas à elle seule une cause essentielle, médicamenteuse ou cérébelleuse.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a>.</p></template>
<template data-pop="g25-intention" data-title="Oscillation à l’approche d’une cible"><p>Le tremblement d’intention augmente typiquement lors de l’approche d’un but, par exemple au doigt-nez. Chercher les autres signes de coordination et distinguer une dysmétrie sans oscillation.</p><p>Un syndrome cérébelleux justifie une recherche de cause structurale, notamment par imagerie selon la recommandation. Toutes les intentions ne prouvent pas une même lésion ni un même traitement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-CEREB — p81–82, syndrome cérébelleux</a> ; <a data-reference-source="1" href="https://www.usz.ch/krankheit/tremor/" target="_blank" rel="noopener">CH-USZ-TREMOR — Définition, activation, causes, anamnèse et examen</a>.</p></template>
<template data-pop="g25-essential" data-title="Critères du tremblement essentiel"><p>La recommandation DGN/SNG 2022 décrit tremblement d’action bilatéral des membres supérieurs depuis au moins trois ans, sans autre syndrome neurologique défini. Une famille atteinte ou un effet de l’alcool peut soutenir mais n’est pas obligatoire.</p><p>Moins de trois ans : chercher notamment médicaments et hyperthyroïdie, documenter et réévaluer. Ce n’est pas une instruction d’attendre sans soins, ni une invitation à utiliser l’alcool.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a>.</p></template>
<template data-pop="g25-etplus" data-title="Essentiel plus : des signes discrets"><p>La catégorie essentiel plus décrit des signes supplémentaires discrets insuffisants pour établir un autre syndrome, par exemple anomalies légères de marche en tandem ou signes dystoniques douteux.</p><p>Un parkinsonisme, une ataxie ou une dystonie clairement établis ne sont pas simplement absorbés dans cette étiquette. Décrire et réévaluer ; les études historiques regroupaient souvent ces profils.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ET — p18–19, critères essentiel/ETplus</a>.</p></template>
<template data-pop="g25-drug" data-title="Médicament : dose, durée et chronologie"><p>Reprendre les médicaments réellement pris, ceux reçus ailleurs, changements et arrêts. Antagonistes dopaminergiques, certains antiémétiques, agents dopaminergiques et de nombreuses autres substances peuvent contribuer.</p><p>Revoir la cause avec le prescripteur avant d’empiler des traitements. Un arrêt brutal peut être dangereux pour certains traitements ; une toxicité grave relève d’une prise en charge urgente adaptée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-AKA — Akathisie et tremblement médicamenteux</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, galénique/dose/adaptations, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-frequency" data-title="La fréquence aide sans décider seule"><p>Une fréquence est un nombre d’oscillations par seconde. Plusieurs syndromes ont des plages qui se chevauchent ; la condition, le rythme, l’amplitude et les signes associés restent nécessaires.</p><p>Le profil rapide 13–18 Hz cohérent debout caractérise une situation particulière, le tremblement orthostatique primaire. On ne l’étend pas à tous les tremblements ou à toute instabilité.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a>.</p></template>
<template data-pop="g25-functional" data-title="Signes positifs d’un tremblement fonctionnel"><p>Variabilité, modification par distraction et entraînement à une tâche rythmique controlatérale peuvent soutenir le diagnostic dans un ensemble concordant. Le spécialiste explique les signes et le raisonnement.</p><p>Une anxiété, une IRM normale ou un seul signe ne suffit pas. Une autre maladie neurologique peut coexister, et trouble fonctionnel n’est pas synonyme de simulation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-FUNC — p98–99, signes positifs et explication</a>.</p></template>
<template data-pop="g25-orthostatic" data-title="Instabilité liée à la station debout"><p>Le tremblement orthostatique primaire survient dans les jambes debout, avec activité typique 13–18 Hz et cohérence élevée ; la station assise, couchée ou la marche peuvent soulager. L’examen et l’EMG doivent reproduire la condition avec sécurité.</p><p>Formes lentes et myoclonies orthostatiques sont distinctes. Ce n’est pas un diagnostic de jambes sans repos, ni une hypotension supposée sans évaluation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a>.</p></template>
<template data-pop="g25-positive" data-title="Myoclonie positive"><p>Une contraction brève produit une secousse. Sa distribution, sa relation à l’action ou aux stimuli, et son évolution renseignent ; plusieurs niveaux de générateurs sont possibles.</p><p>La rythmicité n’est pas toujours absente et l’épilepsie n’est pas obligatoire. L’étiologie et, si nécessaire, la neurophysiologie déterminent la suite.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a>.</p></template>
<template data-pop="g25-negative" data-title="Myoclonie négative et astérixis"><p>Une interruption brève d’une activité musculaire en cours fait céder une posture. L’astérixis en est un exemple, notamment dans un contexte toxique ou métabolique.</p><p>Toutes les myoclonies négatives ne s’appellent pas astérixis. Distinguer interruption, faiblesse persistante et oscillation ; une confusion nouvelle impose une recherche urgente de cause.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a>.</p></template>
<template data-pop="g25-emg" data-title="Électromyographie de surface"><p>Des électrodes enregistrent les bouffées musculaires, leur durée et leurs relations. Choisir les muscles et la condition qui reproduit le phénomène est essentiel.</p><p>Durées et rythmes se chevauchent ; l’enregistrement ne livre pas seul la cause. Des techniques complémentaires et l’examen clinique sont parfois nécessaires.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-ORTHO — p89, tremblement orthostatique</a>.</p></template>
<template data-pop="g25-eeg" data-title="Coupler cerveau et muscles"><p>Un EEG–EMG simultané recherche la relation temporelle entre secousse et activité corticale. Un rétromoyennage peut rendre visible un signal discret avec suffisamment d’événements de qualité.</p><p>Artefacts, médicaments et échantillonnage limitent l’interprétation. Un EEG bref normal n’exclut pas toutes les crises ni tous les générateurs corticaux ; G25.3 exclut l’épilepsie myoclonique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-NEURO — Sections classification et neurophysiologie</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a>.</p></template>
<template data-pop="g25-chorea" data-title="Chorée : un profil irrégulier"><p>Mouvements rapides, imprévisibles et irréguliers, parfois intégrés dans un geste apparemment volontaire. L’examen cherche aussi signes neurologiques, systémiques et histoire familiale.</p><p>Causes acquises, métaboliques, médicamenteuses et héréditaires sont possibles. Huntington et Sydenham ont des codes distincts ; une dose de traitement de Huntington ne devient pas un traitement de toutes les chorées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-DX — Introduction, approbations et Suggested work-up</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s42466-023-00292-2" target="_blank" rel="noopener">EU-CHOREA-CAUSE — Metabolic/endocrine/toxic, Medication et lésions</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-tic" data-title="Tic : besoin et suppression variables"><p>Tics moteurs ou vocaux, brefs et récurrents, souvent avec tension prémonitoire et possibilité de suppression transitoire. Ces caractéristiques varient selon âge et sévérité.</p><p>Ni absence de besoin rapporté chez un enfant ni suppression au cabinet ne tranche toute la question. Rechercher retentissement, comorbidités et causes ; Tourette ne relève pas de G25.6.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-DX — Phénoménologie et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener">EU-TICS-EXAM — Physical examination et examen multiforme</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">CH-CIM-BOUND — Exclusions et notes G25</a>.</p></template>
<template data-pop="g25-akathisia" data-title="Akathisie : une agitation à reconnaître"><p>Difficulté à rester assis ou immobile, avec besoin de bouger et agitation intérieure. Le lien avec médicament et évolution aide à distinguer ce phénomène d’une simple anxiété ou de jambes sans repos.</p><p>La prédominance soir/nuit et le profil sensoriel du RLS ne sont pas obligatoires dans l’akathisie. Revoir la cause et la dose avec l’équipe ; les adjuvants ont des preuves et des risques variables.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-AKA — Akathisie et tremblement médicamenteux</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-rls" data-title="Jambes sans repos : diagnostic clinique"><p>Le besoin de bouger au repos, soulagé par mouvement et à prédominance soir/nuit doit satisfaire les cinq critères, dont l’absence d’explication intégrale par une autre condition.</p><p>Une polysomnographie n’est pas obligatoire pour ce diagnostic. Crampes, neuropathie, gêne articulaire ou positionnelle peuvent imiter ou coexister ; distinguer les plaintes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MIMIC — Table2 et diagnostics différentiels</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-du-sommeil/syndrome-jambes-sans-repos" target="_blank" rel="noopener">CH-HUG-RLS — Page clinique complète, symptômes et PLMS</a>.</p></template>
<template data-pop="g25-criteria" data-title="Les cinq critères ensemble"><p>Besoin de bouger ; début ou aggravation au repos ; soulagement au moins partiel tant que le mouvement continue ; prédominance soir/nuit ; manifestations non entièrement expliquées par une autre condition.</p><p>Un score de sévérité n’est pas un diagnostic autonome. L’interview et les mots du patient, adaptés au développement chez l’enfant, restent nécessaires.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a>.</p></template>
<template data-pop="g25-plms" data-title="Mouvements périodiques et trouble du sommeil"><p>Les mouvements périodiques pendant le sommeil peuvent accompagner les jambes sans repos. Ils sont observés par un enregistrement du sommeil et ne sont pas la même chose qu’une envie consciente de bouger.</p><p>Un index polysomnographique seul ne suffit pas à définir une maladie PLMD à traiter. Le contexte, les plaintes et les autres troubles du sommeil doivent être pris en compte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-DX — Diagnostic, cinq critères et PSG</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a> ; <a data-reference-source="1" href="https://www.hug.ch/laboratoire-du-sommeil/syndrome-jambes-sans-repos" target="_blank" rel="noopener">CH-HUG-RLS — Page clinique complète, symptômes et PLMS</a>.</p></template>
<template data-pop="g25-iron" data-title="Fer : indication et bilan"><p>Numération, ferritine et saturation de la transferrine sont utiles dans la démarche RLS. La recommandation discute supplémentation selon tableau clinique et bilan.</p><p>Ferinject exige une carence adulte confirmée et un oral insuffisamment efficace, impossible ou intoléré. Un code RLS ne suffit pas à administrer automatiquement du fer intraveineux.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a>.</p></template>
<template data-pop="g25-ferritin" data-title="Ferritine : un seuil contextualisé"><p>La recommandation RLS 2024 utilise autour de 75 µg/L pour discuter le fer, avec des formulations ≤ dans le résumé et < dans le corps du texte. La saturation et le contexte complètent la lecture.</p><p>Ce n’est ni une mesure directe du fer cérébral ni une norme universelle suisse. Aux bornes, ne pas fabriquer une précision absente et vérifier l’ensemble du bilan et du produit envisagé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-IRON — Résumé et section Iron/Intravenous Iron</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-MECH — Pathophysiology et comorbidités</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a>.</p></template>
<template data-pop="g25-augmentation" data-title="Augmentation sous dopaminergique"><p>Début des symptômes avancé d’environ deux heures, propagation, intensité accrue ou effet plus court. La chronologie comparée au début du traitement est importante.</p><p>Ne pas augmenter automatiquement la dose. Revoir fer, imitateurs et traitement avec expertise ; un agoniste chronique peut devoir être réduit très lentement pour éviter un syndrome de sevrage.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-prami" data-title="Pramipexole immédiat et RLS"><p>La FI Sifrol prévoit 0,125 mg de sel une fois par jour deux à trois heures avant coucher, puis paliers de 0,125 mg tous les quatre à sept jours si besoin, maximum RLS 0,75 mg/jour et dose la plus faible utile.</p><p>La forme ER et les plafonds Parkinson ne s’importent pas au RLS. Vérifier rein, augmentation, somnolence/endormissement subit et pulsions ; l’hémodialyse est contre-indiquée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-base" data-title="Sel et base : deux écritures à identifier"><p>Dans la présentation lue, 0,125 mg de pramipexole sous forme de sel correspond à 0,088 mg de base. Les nombres du schéma RLS de ce cours sont exprimés en sel.</p><p>Une source étrangère ou une autre rubrique peut employer la base et des arrondis différents. Vérifier chaque force et formulation ; ne pas remplacer numériquement un nombre par l’autre ni harmoniser tous les arrondis.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-primidone" data-title="Primidone : usage et galénique"><p>La DGN/SNG recommande la primidone pour l’essentiel, hors indication de la FI Mysoline qui concerne l’épilepsie. La tolérance initiale peut être mauvaise même à faible dose.</p><p>Le comprimé suisse de 250 mg est demi-sécable ; un très faible début discuté dans la guideline exige une formulation vérifiée, pas une division inventée. Risques de sédation, ataxie, induction et reproduction à expliquer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-TX — p5–6 et20–21, propranolol/primidone</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680178850145" target="_blank" rel="noopener">FI-MYSOLINE — Indications, début épilepsie, organes, interactions/reproduction et mécanisme</a>.</p></template>
<template data-pop="g25-pregabalin" data-title="Prégabaline : efficacité discutée et FI suisse"><p>Les indications Lyrica sont adultes et ne comprennent pas le RLS. La recommandation RLS décrit un usage hors indication ; le résumé italien 2026, dérivé de recommandations américaines, ne change pas ce statut.</p><p>La FI juillet 2026 exclut l’utilisation si clairance < 30 mL/min. Vérifier somnolence, dépendance et risque respiratoire avec opioïdes ; arrêt progressif individualisé sur semaines ou mois.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680570570016" target="_blank" rel="noopener">FI-LYRICA — Indications, doses, rein, arrêt, sécurité/reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-TX — Recommandations thérapeutiques et Pregabalin</a> ; <a data-reference-source="1" href="https://doi.org/10.1007/s10072-026-09487-2" target="_blank" rel="noopener">EU-RLS-2026 — Résumé primaire viaEuropePMC seulement</a>.</p></template>
<template data-pop="g25-sps" data-title="Syndrome de la personne raide"><p>Raideur axiale/proximale, spasmes déclenchés et retentissement sur marche/chutes orientent. Le spectre peut être associé à une auto-immunité, mais le diagnostic relève d’un faisceau clinique spécialisé.</p><p>Électrophysiologie, anticorps et recherche de contexte auto-immun ou tumoral se discutent. Traitement symptomatique et immunitaire sont individualisés, avec preuves limitées pour plusieurs options.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-MECH — Introduction et physiopathologie</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a>.</p></template>
<template data-pop="g25-gad" data-title="GAD65 : enzyme et anticorps"><p>GAD2 code une glutamate décarboxylase, isoforme GAD65, participant à la synthèse du GABA. Des anticorps anti-GAD65 sont associés à plusieurs contextes, dont certaines formes de personne raide.</p><p>Un résultat positif isolé ne constitue pas le diagnostic neurologique. Titre, clinique, électrophysiologie et parfois liquide cérébrospinal importent. L’immunomarquage PCP4 montré dans ce cours est différent.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://rest.uniprot.org/uniprotkb/Q05329.txt" target="_blank" rel="noopener">NORMAL-GAD2 — Fonction, catalyse, cofacteur</a> ; <a data-reference-source="1" href="https://www.sundhed.dk/sundhedsfaglig/laegehaandbogen/neurologi/tilstande-og-sygdomme/oevrige-sygdomme/stiff-person-syndrom/" target="_blank" rel="noopener">EU-SPS-DX — Clinique, examens, anticorps et suivi</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:PCP4_immunohistochemistry_in_human_cerebellum.jpg" target="_blank" rel="noopener">IMG-PURKINJE — Description, provenance, droits propres et original réellement vus</a>.</p></template>
<template data-pop="g25-urgent" data-title="Urgence : les signes associés changent le circuit"><p>Début soudain avec déficit, confusion, convulsions ou trouble respiratoire exige une évaluation immédiate. Après médicaments, fièvre, rigidité ou clonus et instabilité autonome font rechercher une toxicité grave.</p><p>Un syndrome malin peut être atypique, sans rigidité nette ou avec fièvre modérée. Ne pas attendre tous les critères ; sécuriser et traiter avec l’équipe, en retrouvant produits, doses et chronologie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10984309/" target="_blank" rel="noopener">EU-MYO-DX — Résumé, introduction et présentation aiguë/subaiguë</a> ; <a data-reference-source="1" href="https://www.cbip.be/fr/articles/3577?folia=3562" target="_blank" rel="noopener">EU-CBIP-URG — Syndromes sérotoninergique et malin des antipsychotiques</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680392200160" target="_blank" rel="noopener">FI-TIAPRIDAL — Indications, tics/âge/rein et sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-follow" data-title="Suivi : fonction et sécurité"><p>Répéter une tâche utile dans des conditions comparables, demander sommeil, autonomie, chutes et vécu. Documenter traitements et effets indésirables, pas seulement amplitude du mouvement.</p><p>Une réponse symptomatique ne prouve pas la cause. Nouveaux signes, symptômes plus précoces sous agoniste ou perte de tolérance imposent une réévaluation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener">EU-TREMOR-PHENO — p15–17, phénotypage et objectifs</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">EU-RLS-AUG — Augmentation, diagnostic/prévention/prise en charge</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12639332/" target="_blank" rel="noopener">EU-SPS-TX — Méthode, discussion, table2 et limites</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680542770161" target="_blank" rel="noopener">FI-SIFROL — Formes/sel-base, RLS, rein, augmentation, sécurité/reproduction/mécanisme</a>.</p></template>
<template data-pop="g25-calculation" data-title="Dose déjà choisie, volume vérifié"><p>Pour les gouttes orales Rivotril à 0,1 mg/goutte, une quantité déjà prescrite de 0,5 mg correspond à cinq gouttes. Pour Ferinject à 50 mg de fer/mL, 500 mg correspondent à 10 mL de produit avant dilution.</p><p>L’arithmétique ne choisit pas indication, dose, voie ou personne. Rivotril injectable est une autre formulation ; Ferinject injection et perfusion ont des plafonds en mg/kg différents, avec cumul hebdomadaire et surveillance.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680377570127" target="_blank" rel="noopener">FI-RIVOTRIL — Indications/voies/forme orale, organes, dépendance/reproduction/mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510021" target="_blank" rel="noopener">FI-FERINJECT — Indication/doses/voies, populations/sécurité/reproduction</a>.</p></template>
