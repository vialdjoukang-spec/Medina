
<!-- ===== FENÊTRES I46 : notions fondamentales ===== -->
<template data-pop="i46-ppc" data-title="Pression de perfusion coronaire pendant la réanimation">
<div class="lab">Définition</div><p>Différence entre la pression aortique pendant le relâchement des compressions (équivalent de la diastole) et la pression auriculaire droite au même moment. C’est la pression motrice du sang dans les coronaires pendant l’arrêt.</p>
<div class="lab">Seuil</div><p>Dans les études expérimentales et dans une étude humaine classique (Paradis, 1990), aucun RACS n’était observé sous environ 15 mmHg. La valeur exacte varie ; le principe est constant : sans perfusion coronaire suffisante, le myocarde ne peut pas reprendre une activité efficace.</p>
<div class="lab">Ce qui l’augmente</div><p>Compressions profondes et continues, relâchement complet, adrénaline (vasoconstriction α qui élève la pression aortique), absence d’hyperventilation.</p>
<div class="lab">Ce qui la réduit</div><p>Chaque pause, les appuis résiduels entre les compressions, l’hyperventilation, l’hypovolémie.</p>
<div class="lab">Mesure</div><p>Rarement mesurée directement ; la pression artérielle diastolique invasive (cible ≥ 30 mmHg selon l’ERC 2025, réanimation guidée par la physiologie chez un patient déjà cathétérisé) et l’EtCO₂ en sont des reflets.</p></template>

<template data-pop="i46-noflow" data-title="No-flow et low-flow">
<div class="lab">No-flow</div><p>Durée entre l’arrêt et le début des compressions : aucun débit. C’est la période la plus délétère pour le cerveau ; seuls les témoins peuvent la raccourcir.</p>
<div class="lab">Low-flow</div><p>Durée des compressions jusqu’au RACS : débit partiel, environ un quart à un tiers de la normale. Elle limite les lésions sans les empêcher.</p>
<div class="lab">Usage clinique</div><p>Ces deux durées sont notées dans la chronologie de toute réanimation. Elles orientent la décision de RCP extracorporelle (no-flow court exigé) et l’interprétation du pronostic.</p>
<div class="lab">Exemple</div><p>Effondrement à 10 h 00, compressions du témoin à 10 h 02, RACS à 10 h 20 : no-flow 2 minutes, low-flow 18 minutes.</p></template>

<template data-pop="i46-fvphases" data-title="Modèle en trois phases de la fibrillation ventriculaire">
<div class="lab">Origine</div><p>Modèle proposé par Weisfeldt et Becker (2002) à partir de données expérimentales et cliniques.</p>
<div class="lab">Phase électrique (0 à 4 minutes environ)</div><p>Myocarde encore riche en énergie : le choc immédiat est le traitement le plus efficace.</p>
<div class="lab">Phase circulatoire (4 à 10 minutes environ)</div><p>Réserves épuisées : un choc seul donne souvent une asystolie ou une AESP. Des compressions de qualité avant et après le choc améliorent son efficacité.</p>
<div class="lab">Phase métabolique (au-delà de 10 minutes environ)</div><p>Acidose, lésions cellulaires et de reperfusion dominent : les chances de survie deviennent faibles avec les moyens conventionnels ; c’est le domaine de la RCP extracorporelle.</p>
<div class="lab">Limite</div><p>Les limites temporelles sont indicatives. L’ERC ne recommande pas de période systématique de compressions avant le premier choc : on choque dès que le défibrillateur est prêt.</p></template>

<template data-pop="i46-ischcereb" data-title="Vulnérabilité du cerveau à l’anoxie">
<div class="lab">Chronologie</div><p>Perte de conscience en 10 secondes environ ; EEG plat en 20 à 40 secondes ; épuisement de l’ATP en quelques minutes ; lésions irréversibles des régions vulnérables après environ 5 minutes de no-flow en normothermie.</p>
<div class="lab">Régions vulnérables</div><p>Hippocampe (région CA1), cellules de Purkinje du cervelet, couches corticales moyennes, ganglions de la base. Le tronc cérébral résiste plus longtemps.</p>
<div class="lab">Modulateurs</div><p>L’hypothermie réduit la consommation d’oxygène d’environ 6 à 7 % par degré, ce qui explique les survies exceptionnelles après noyade en eau glacée ou avalanche. La fièvre fait l’inverse.</p>
<div class="lab">Conséquence</div><p>Chaque minute de no-flow compte davantage pour le cerveau que pour le cœur : un RACS tardif peut rétablir le cœur sans le cerveau.</p></template>

<template data-pop="i46-pompe" data-title="Pompe cardiaque et pompe thoracique">
<div class="lab">Théorie de la pompe cardiaque</div><p>Le cœur est comprimé entre le sternum et le rachis ; les valves auriculoventriculaires se ferment et le sang est éjecté vers l’aorte et l’artère pulmonaire.</p>
<div class="lab">Théorie de la pompe thoracique</div><p>La compression élève la pression dans tout le thorax ; le cœur agit comme un conduit passif ; les valves veineuses et le collapsus des veines empêchent le reflux, et le sang sort vers les artères extrathoraciques.</p>
<div class="lab">Synthèse</div><p>Les deux mécanismes coexistent. Le premier domine chez les sujets à thorax souple, le second chez les thorax larges et rigides.</p>
<div class="lab">Conséquence pratique</div><p>Dans les deux cas, le relâchement complet est indispensable : c’est pendant cette phase que le cœur se remplit et que les coronaires sont perfusées.</p></template>

<template data-pop="i46-spac" data-title="Syndrome post-arrêt cardiaque">
<div class="lab">Quatre composantes</div><p>1. <b>Lésion cérébrale</b> anoxique : coma, convulsions, myoclonies, œdème. 2. <b>Dysfonction myocardique</b> : sidération, hypotension, bas débit, maximale à 24 heures et souvent réversible en 48 à 72 heures. 3. <b>Réponse systémique d’ischémie-reperfusion</b> : syndrome inflammatoire proche du sepsis, vasoplégie, coagulopathie, insuffisance surrénalienne relative. 4. <b>Pathologie causale persistante</b> : infarctus, embolie, sepsis, hémorragie.</p>
<div class="lab">Chronologie</div><p>Phase immédiate (20 premières minutes), précoce (jusqu’à 12 heures), intermédiaire (12 à 72 heures), puis récupération. Les décès précoces sont surtout cardiovasculaires ; les décès tardifs, surtout neurologiques, souvent après limitation thérapeutique.</p>
<div class="lab">Conséquence</div><p>Chaque composante a sa cible : cerveau (température, oxygène, CO₂, pression), cœur (hémodynamique, coronarographie), inflammation (soutien d’organe), cause (traitement spécifique).</p></template>

<template data-pop="i46-reperf" data-title="Lésions d’ischémie-reperfusion">
<div class="lab">Mécanismes</div><p>Surcharge calcique intracellulaire ; production d’espèces réactives de l’oxygène par les mitochondries lésées et la xanthine oxydase ; ouverture du pore de transition de perméabilité mitochondriale ; activation des neutrophiles et de l’endothélium ; microthromboses (« no-reflow » cérébral).</p>
<div class="lab">Délai</div><p>Les lésions se poursuivent pendant des heures à des jours après le RACS : c’est la fenêtre des mesures neuroprotectrices.</p>
<div class="lab">Leviers démontrés ou raisonnables</div><p>Éviter la fièvre, l’hypoxie et l’hyperoxie extrêmes, l’hypocapnie et l’hypotension. Aucun médicament neuroprotecteur n’a démontré de bénéfice clinique.</p></template>

<template data-pop="i46-defib" data-title="Défibrillation : onde biphasique et impédance">
<div class="lab">Ce qui dépolarise</div><p>Le courant qui traverse le myocarde, non l’énergie affichée. Courant = tension / impédance (loi d’Ohm).</p>
<div class="lab">Impédance transthoracique</div><p>Environ 70 à 80 ohms chez l’adulte. Elle augmente avec une mauvaise adhésion des électrodes, la pilosité, l’inspiration profonde et la distance entre les électrodes.</p>
<div class="lab">Onde biphasique</div><p>Le courant change de sens au cours du choc. À énergie plus faible que l’ancienne onde monophasique (360 J), elle défibrille aussi bien ou mieux, avec moins de lésions myocardiques. Les appareils compensent l’impédance en ajustant la durée ou la tension.</p>
<div class="lab">Énergies (ERC 2025)</div><p>Premier choc : au moins 150 J (biphasique rectiligne ou exponentielle tronquée) ou 130 à 150 J (biphasique pulsée) ; chocs suivants à énergie égale ou croissante. En cas de doute sur l’appareil, choisir l’énergie maximale.</p>
<div class="lab">Sécurité</div><p>Pas de contact avec le patient au moment du choc ; oxygène à distance (plus d’un mètre) ou laissé connecté au circuit fermé ; retirer les patchs médicamenteux sous les électrodes ; électrodes à au moins 8 cm d’un boîtier implanté.</p></template>

<template data-pop="i46-choquable" data-title="Rythmes choquables">
<div class="lab">Lesquels</div><p>Fibrillation ventriculaire et tachycardie ventriculaire sans pouls. Ils ont en commun une activité électrique ventriculaire désorganisée ou trop rapide, qui peut être interrompue par la dépolarisation simultanée du myocarde.</p>
<div class="lab">Pronostic</div><p>Meilleur que celui des rythmes non choquables : ils traduisent souvent un arrêt récent, d’origine cardiaque, chez un myocarde encore riche en énergie.</p>
<div class="lab">Évolution</div><p>Sans traitement, la FV dégénère en asystolie en quelques minutes. Un rythme initial non choquable peut devenir choquable pendant la réanimation (conversion), ce qui justifie l’analyse toutes les deux minutes.</p>
<div class="lab">Piège</div><p>Une TV avec pouls relève de la cardioversion synchronisée, pas de l’algorithme d’arrêt.</p></template>

<template data-pop="i46-aesp" data-title="Activité électrique sans pouls (AESP)">
<div class="lab">Définition</div><p>Activité électrique organisée au moniteur, qui devrait produire un pouls, sans pouls palpable. Les anglophones parlent de « pulseless electrical activity ».</p>
<div class="lab">Vraie et pseudo-AESP</div><p>Dans la vraie AESP, le cœur ne se contracte pas (dissociation électromécanique). Dans la pseudo-AESP, l’échographie montre des contractions, mais le débit est trop faible pour un pouls : hypovolémie extrême, tamponnade, embolie massive, vasoplégie. La pseudo-AESP a un meilleur pronostic si la cause est traitée.</p>
<div class="lab">Lecture des QRS</div><p>QRS fins et rapides : cause mécanique probable (tamponnade, pneumothorax, embolie, hypovolémie). QRS larges et lents : cause métabolique (hyperkaliémie, acidose, toxiques bloqueurs sodiques) ou myocardique (infarctus étendu).</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>Cette règle de lecture « fin et rapide = mécanique, large et lent = métabolique » est une orientation, pas une classification validée.</p></template>

<template data-pop="i46-utstein" data-title="Style d’Utstein">
<div class="lab">Principe</div><p>Recommandations internationales, dont le nom vient d’une abbaye norvégienne où la première conférence s’est tenue en 1990. Elles définissent les variables à recueillir pour chaque arrêt (lieu, témoin, réanimation par témoin, rythme initial, délais, traitements) et les issues (RACS, survie à 30 jours ou à la sortie, catégorie de performance cérébrale).</p>
<div class="lab">Intérêt</div><p>Comparer des systèmes de secours et suivre la qualité. Le « groupe comparateur d’Utstein » (arrêt devant témoin, rythme initial choquable) sert d’indicateur de performance du système.</p>
<div class="lab">En Suisse</div><p>Le registre Swissreca suit ce format.</p></template>

<template data-pop="i46-eureca" data-title="Registres EuReCa">
<p>Trois études EuReCa (2014, 2017 et 2022) ont recueilli, sur des périodes de quelques mois, les arrêts extrahospitaliers de nombreux pays européens selon le style d’Utstein.</p>
<div class="lab">Messages principaux</div><p>Incidence des tentatives de réanimation de l’ordre de 50 à 60 pour 100 000 habitants par an ; réanimation par un témoin dans environ la moitié à deux tiers des cas, avec de grands écarts ; survie à la sortie de l’hôpital d’environ 8 à 10 % en moyenne, de moins de 1 % à environ 25 % selon les régions.</p>
<div class="lab">Limite</div><p>Participation variable des pays et des régions ; les chiffres sont des ordres de grandeur, non des valeurs nationales.</p></template>

<template data-pop="i46-mnemo-4h4t" data-title="4H et 4T — causes réversibles">
<p><b>H</b>ypoxie ; <b>H</b>ypovolémie ; <b>H</b>ypo- ou hyperkaliémie et autres troubles métaboliques ; <b>H</b>ypo- ou hyperthermie.<br><b>T</b>hrombose (coronaire ou pulmonaire) ; <b>T</b>ension (pneumothorax sous tension) ; <b>T</b>amponnade ; <b>T</b>oxiques.</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>Aide-mémoire enseigné dans les cours de l’ERC et du SRC. Il ne remplace pas le raisonnement contextuel : l’ordre de recherche dépend du patient.</p>
<div class="lab">Outils</div><p>Anamnèse des témoins et du dossier ; examen ciblé ; gazométrie au point de soins ; échographie ciblée ; température centrale.</p></template>

<template data-pop="i46-commotio" data-title="Commotio cordis">
<p>FV déclenchée par un choc thoracique non pénétrant, de faible énergie, sur la région précordiale : balle de baseball ou de hockey, coup de poing, chez un sujet jeune au cœur sain.</p>
<div class="lab">Mécanisme</div><p>Le choc survient dans une fenêtre étroite de la phase ascendante de l’onde T (période vulnérable) ; l’étirement brutal active des canaux ioniques sensibles à l’étirement et déclenche la FV.</p>
<div class="lab">Conduite</div><p>RCP et défibrillation immédiates : la survie est élevée si le DAE est utilisé rapidement. Protections thoraciques et présence de DAE sur les terrains de sport.</p></template>

<template data-pop="i46-sport" data-title="Mort subite du sportif et du sujet jeune">
<div class="lab">Causes principales</div><p>Avant 35 ans : cardiomyopathie hypertrophique, cardiomyopathie arythmogène, anomalies coronaires congénitales, myocardite, canalopathies, autopsie « blanche ». Après 35 ans : maladie coronaire.</p>
<div class="lab">Reconnaissance</div><p>Un effondrement brutal pendant l’effort, sans traumatisme, est un arrêt cardiaque jusqu’à preuve du contraire. Des mouvements convulsifs brefs et une respiration « presque normale » les premières secondes trompent les témoins.</p>
<div class="lab">Prévention</div><p>DAE dans les installations sportives, formation des entraîneurs, dépistage préparticipatif (anamnèse, examen, ECG selon les recommandations ESC de cardiologie du sport 2020).</p></template>

<template data-pop="i46-acih" data-title="Arrêt intrahospitalier : prévenir et répondre">
<div class="lab">Signes précurseurs</div><p>Dans les heures précédant la plupart des arrêts intrahospitaliers : tachypnée (signe le plus prédictif), désaturation, hypotension, tachycardie, confusion, baisse de la diurèse.</p>
<div class="lab">Système de réponse</div><p>Scores d’alerte précoce fondés sur les signes vitaux, avec des seuils d’appel ; équipe d’intervention rapide ou de réanimation disponible à toute heure ; numéro interne unique.</p>
<div class="lab">Décisions anticipées</div><p>Statut de réanimation documenté à l’admission, discuté avec le patient (directives ASSM).</p>
<div class="lab">Particularités de la réanimation</div><p>Monitorage souvent présent : défibrillation très rapide possible, trois chocs successifs autorisés si la FV survient sous monitorage avec un défibrillateur prêt.</p></template>

<template data-pop="i46-agonal" data-title="Respiration agonale (gasps)">
<p>Mouvements respiratoires lents, irréguliers, profonds ou bruyants, parfois avec ouverture de la bouche, qui persistent une à plusieurs minutes après l’arrêt chez environ un tiers à la moitié des victimes.</p>
<div class="lab">Mécanisme</div><p>Réflexe du tronc cérébral hypoxique ; ils ne produisent pas de ventilation efficace.</p>
<div class="lab">Importance</div><p>C’est la première cause de non-reconnaissance de l’arrêt par les témoins et les régulateurs. Leur présence est associée à une meilleure survie, car elle traduit un arrêt récent : il faut donc comprimer aussitôt.</p>
<div class="lab">Formulation au téléphone</div><p>« Respire-t-il normalement ? » plutôt que « respire-t-il ? ».</p></template>
