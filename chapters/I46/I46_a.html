<section class="ilot" id="i46-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 58 ans s’effondre dans la file d’attente d’une gare. Un passant constate qu’il ne répond pas et qu’il respire par à-coups, bruyamment, toutes les dix secondes. Il appelle le 144. Le régulateur lui fait débuter les compressions thoraciques au téléphone ; quatre minutes plus tard, une infirmière alertée par une application de premiers répondants arrive avec un défibrillateur, qui délivre un choc. À l’arrivée de l’ambulance, le pouls est revenu, mais le patient reste comateux.</p>
<p>Ce scénario pose trois questions successives qui structurent le chapitre : <b>comment reconnaître l’arrêt et gagner les premières minutes, comment conduire la réanimation avancée et corriger la cause, et comment protéger le cerveau et le cœur une fois la circulation revenue ?</b> Une quatrième question traverse l’ensemble : quand faut-il ne pas débuter ou arrêter la réanimation ?</p>
<p>À la fin du chapitre, le médecin assistant sait reconnaître un arrêt cardiaque en moins de dix secondes, conduire une réanimation de base et avancée conforme aux recommandations du Conseil européen de réanimation (ERC) 2025 adoptées par le Swiss Resuscitation Council (SRC), rechercher et traiter les causes réversibles, organiser les soins post-réanimation selon l’ERC et la Société européenne de médecine intensive (ESICM) 2025, et appliquer les directives de l’Académie suisse des sciences médicales (ASSM) aux décisions de réanimation.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i46-ppc">pression de perfusion coronaire (déterminant du retour de la circulation)</button>, la <button class="w" data-k="i46-noflow">distinction entre « no-flow » et « low-flow » (durées qui font le pronostic)</button> et le <button class="w" data-k="i47-pa">potentiel d’action cardiaque (base des rythmes d’arrêt)</button>. Les deux premières notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i46-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>L’<b>arrêt cardiaque</b> est la cessation de l’activité mécanique efficace du cœur, confirmée par l’absence de signes de circulation : le patient ne répond pas et ne respire pas normalement. Sans intervention, il conduit à la mort en quelques minutes. La <b>mort subite cardiaque</b> désigne un décès naturel d’origine cardiaque survenant dans l’heure qui suit le début des symptômes, ou dans les 24 heures qui suivent le dernier moment où la personne a été vue en bonne santé si le décès n’a pas eu de témoin. Un arrêt réanimé avec succès est appelé « mort subite avortée ».</p>
<h3>1.1 Selon le lieu : extrahospitalier et intrahospitalier</h3>
<div class="two">
<div class="card"><h4>Arrêt cardiaque extrahospitalier (ACEH)</h4><p>Survient hors de l’hôpital, le plus souvent au domicile. Le pronostic dépend des témoins : reconnaissance, appel au 144, compressions et défibrillation avant l’arrivée des secours. Une part notable est d’origine cardiaque et se présente en fibrillation ventriculaire. En Europe, le premier rythme enregistré n’est pourtant choquable que dans un cas sur cinq environ : une partie des arrêts ne débute pas en FV, et la FV dégénère en asystolie d’autant plus souvent que l’absence de débit se prolonge avant l’analyse du rythme.</p></div>
<div class="card"><h4>Arrêt cardiaque intrahospitalier (ACIH)</h4><p>Survient chez un patient hospitalisé, souvent âgé et malade. Il est <button class="w" data-k="i46-acih">fréquemment précédé de signes de détérioration (repérage précoce, équipe d’intervention)</button>. Le rythme initial est le plus souvent non choquable ; les causes respiratoires, hémorragiques et septiques dominent. Ces causes mènent à l’arrêt par une hypoxémie ou une hypoperfusion progressives, qui ralentissent le cœur jusqu’à l’AESP puis l’asystolie plutôt que de déclencher une FV.</p></div></div>
<h3>1.2 Selon le rythme : choquable et non choquable</h3>
<p>Le premier rythme enregistré sépare deux algorithmes. Les <button class="w" data-k="i46-choquable">rythmes choquables (FV et TV sans pouls)</button> répondent à la défibrillation. Les rythmes non choquables, l’<button class="w" data-k="i46-aesp">activité électrique sans pouls (AESP, dissociation électromécanique)</button> et l’asystolie, ne répondent pas au choc : leur traitement repose sur les compressions, l’adrénaline et surtout la correction de la cause. Le choc agit en dépolarisant en même temps tout le myocarde excitable, ce qui interrompt une activité électrique désorganisée ; il ne peut ni créer une contraction absente ni remplir un cœur vide ou comprimé.</p>
<table class="t"><tr><th>Rythme</th><th>Activité électrique</th><th>Activité mécanique</th><th>Traitement central</th></tr>
<tr><td>Fibrillation ventriculaire (FV)</td><td>Anarchique, sans QRS identifiable</td><td>Nulle</td><td>Défibrillation immédiate</td></tr>
<tr><td>TV sans pouls</td><td>QRS larges, réguliers, rapides</td><td>Insuffisante pour un pouls</td><td>Défibrillation immédiate (non synchronisée) : l’appareil repère mal l’onde R de QRS larges et de forme variable, et attendre la synchronisation retarderait le choc</td></tr>
<tr><td>AESP</td><td>Complexes organisés</td><td>Absente ou trop faible pour un pouls</td><td>Compressions, adrénaline, cause réversible</td></tr>
<tr><td>Asystolie</td><td>Tracé plat (vérifier gain et électrodes, car une électrode décollée ou un gain trop faible peuvent masquer une FV fine, qui doit être choquée)</td><td>Nulle</td><td>Compressions, adrénaline, cause réversible</td></tr></table>
<h3>1.3 Le vocabulaire des issues</h3>
<p>Le <b>retour à une circulation spontanée (RACS)</b> est la reprise d’un pouls palpable ou d’une pression artérielle mesurable. Il n’est qu’une étape : l’issue qui compte pour le patient est la survie avec une bonne fonction neurologique, mesurée par la catégorie de performance cérébrale (CPC 1 ou 2) ou l’échelle de Rankin modifiée. Le cerveau supporte l’absence de débit bien moins longtemps que le cœur : un RACS peut survenir alors que la lésion anoxique est déjà sévère, et cette lésion cause environ deux tiers des décès hospitaliers des patients admis comateux en soins intensifs après un arrêt extrahospitalier. Les registres décrivent les arrêts selon le <button class="w" data-k="i46-utstein">style d’Utstein (variables et issues standardisées)</button>, ce qui permet de comparer les systèmes de secours.</p>
<div class="trap"><span class="k">Piège</span>Une TV rapide « avec pouls » et une TV « sans pouls » ont le même tracé. Seul l’examen du patient les distingue, et leur traitement diffère radicalement : défibrillation non synchronisée et compressions pour la TV sans pouls. Avec pouls, une TV monomorphe instable relève d’une cardioversion synchronisée ; une TV stable demande une prise en charge monitorée et spécialisée. Une TV polymorphe soutenue nécessite un choc non synchronisé, car ses QRS variables empêchent une synchronisation fiable. La synchronisation sur l’onde R évite de choquer pendant l’onde T, période réfractaire relative où le choc peut déclencher une FV. Une sédation est réalisée si le patient est conscient et si elle ne retarde pas un choc urgent.</div>
</section>

<section class="ilot" id="i46-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>En Europe, les registres <button class="w" data-k="i46-eureca">EuReCa (registres européens de l’arrêt cardiaque)</button> décrivent une incidence d’arrêts extrahospitaliers traités par les services de secours d’environ 55 pour 100 000 habitants par an (17 à 104 selon les pays), et une survie de 7,5 % en 2022, avec des écarts considérables entre pays (3,1 à 35 %). Ces écarts tiennent notamment aux premiers maillons : la réanimation par un témoin varie de 13 à 82 % selon les pays. En Suède, parmi plus de 30 000 arrêts devant témoin, une RCP débutée avant l’arrivée des secours était associée à une survie à 30 jours plus que doublée (10,5 % contre 4,0 %).</p>
<p>En Suisse, le registre Swissreca, tenu par l’Interassociation de sauvetage (IAS), recueille les arrêts pris en charge par les services de secours participants. Une analyse nationale portant sur 2019 et 2020 rapporte une réanimation par un témoin dans 57 à 63 % des tentatives et un transport avec RACS dans 28 à 30 % des cas. Dans le canton de Fribourg (2018–2022), l’incidence était de 72 arrêts pour 100 000 habitants par an, l’âge médian de 70 ans, 70 % des arrêts survenaient au domicile, et la survie à la sortie de l’hôpital atteignait 7,7 %.</p>
<p>L’arrêt intrahospitalier touche environ 1,5 à 2,8 patients pour 1 000 admissions selon les séries européennes. Le rythme initial est choquable dans moins d’un cas sur cinq. Les séries suédoises et danoises publiées de 2020 à 2024 rapportent, pour l’ensemble des patients, une survie à 30 jours d’environ 27 à 50 %. Elle est meilleure lorsque l’arrêt survient en zone surveillée, où la reconnaissance et le choc sont immédiats, et chez le sujet plus jeune, peu comorbide, en rythme choquable.</p>
<p>Le pronostic se joue sur des <button class="w" data-k="i46-pronostic">facteurs connus dès les premières minutes</button> : arrêt devant témoin, réanimation par un témoin, rythme initial choquable, délai court jusqu’au premier choc, lieu public, âge. Chaque minute de retard à la défibrillation d’une FV augmente de 6 % la probabilité que le choc échoue et abaisse de 3 à 6 % la probabilité de survie à la sortie de l’hôpital, car le myocarde fibrillant épuise ses réserves d’énergie.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Il n’existe pas de publication récente de la survie nationale suisse à la sortie de l’hôpital couvrant tous les cantons. Les chiffres cités proviennent de Swissreca (2019–2020), d’une étude fribourgeoise (2018–2022) et des registres européens EuReCa ; ils sont datés et ne doivent pas être généralisés.</div>

<section class="ilot" id="i46-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie de l’arrêt cardiaque suit une chaîne en quatre temps : <b>arrêt de la perfusion → ischémie des organes, cerveau en premier → perfusion partielle pendant la réanimation → lésions de reperfusion après le RACS.</b> Chaque temps explique un geste thérapeutique précis.</p>
<h3>3.1 L’arrêt de la perfusion et la vulnérabilité du cerveau</h3>
<p>Le cerveau consomme environ 20 % de l’oxygène de l’organisme sans en stocker. Dix secondes après l’arrêt, la conscience disparaît ; en quelques minutes, les réserves d’ATP s’épuisent et les neurones se dépolarisent. Sans ATP, les pompes Na⁺/K⁺ ne maintiennent plus les gradients ioniques : le calcium s’accumule dans les neurones, dont l’activité cesse. Le risque de lésions irréversibles augmente rapidement avec la durée sans perfusion, particulièrement dans les <button class="w" data-k="i46-ischcereb">régions cérébrales les plus vulnérables (hippocampe, cervelet, cortex)</button>. Aucun seuil de cinq minutes ne permet, à lui seul, de conclure au pronostic individuel. La durée sans aucun débit (<button class="w" data-k="i46-noflow">« no-flow »</button>) est donc le premier déterminant du pronostic neurologique : c’est la raison pour laquelle le témoin doit comprimer avant l’arrivée des secours.</p>
<h3>3.2 La fibrillation ventriculaire évolue avec le temps</h3>
<p>La fibrillation ventriculaire n’est pas un état fixe. Le <button class="w" data-k="i46-fvphases">modèle en trois phases (électrique, circulatoire, métabolique)</button> décrit son évolution. Pendant les quatre à cinq premières minutes, le myocarde garde des réserves énergétiques : un choc immédiat a les meilleures chances de réussir. Ensuite, le myocarde s’épuise ; un choc isolé restaure alors une activité électrique organisée que le cœur ne peut pas convertir en contraction. Selon ce modèle, des compressions avant le choc redonnent un peu d’énergie au myocarde ; chez l’homme pourtant, une période imposée de 1,5 à 3 minutes de RCP avant le premier choc n’a pas fait mieux qu’un choc immédiat. Après une dizaine de minutes, l’acidose et les lésions cellulaires dominent. Le tracé traduit cette évolution : une FV à grandes mailles devient progressivement une FV à petites mailles, puis une asystolie.</p>
<h3>3.3 Ce que produit la réanimation : une perfusion partielle</h3>
<p>Les compressions thoraciques de bonne qualité produisent environ un quart à un tiers du débit cardiaque normal. Elles agissent par compression directe du cœur et par variation de la pression intrathoracique (<button class="w" data-k="i46-pompe">théories de la pompe cardiaque et de la pompe thoracique</button>). Le myocarde est perfusé pendant la phase de relâchement, selon la <button class="w" data-k="i46-ppc">pression de perfusion coronaire (pression aortique diastolique moins pression auriculaire droite)</button>. Une valeur d’au moins 15 mmHg environ est nécessaire au RACS dans les études expérimentales et humaines.</p>
<div class="key"><b>Corrélation physiologie → thérapeutique.</b> La pression de perfusion coronaire monte lentement au fil des compressions et s’effondre à chaque interruption. D’où les règles de la réanimation : limiter chaque pause à moins de 5 à 10 secondes, relâcher complètement le thorax (la pression intrathoracique redevient négative et le cœur se remplit), éviter l’hyperventilation (elle élève la pression intrathoracique et réduit le retour veineux). L’adrénaline, par son effet vasoconstricteur α, élève la pression aortique diastolique et donc la perfusion coronaire.</div>
<h3>3.4 Après le retour de la circulation : le syndrome post-arrêt cardiaque</h3>
<p>Le RACS ne met pas fin à la maladie : il en ouvre une nouvelle phase. Le <button class="w" data-k="i46-spac">syndrome post-arrêt cardiaque (quatre composantes)</button> associe une lésion cérébrale anoxique, une dysfonction myocardique transitoire, une réaction systémique d’ischémie-reperfusion proche du sepsis et la persistance de la cause de l’arrêt. Les <button class="w" data-k="i46-reperf">lésions d’ischémie-reperfusion (radicaux libres, surcharge calcique, excitotoxicité)</button> se poursuivent pendant des heures à des jours : c’est la fenêtre dans laquelle agissent le contrôle de la température, l’oxygénation mesurée et le maintien de la pression artérielle.</p>

<section class="ilot" id="i46-4"><h2><span class="n">4</span>Étiologies et causes réversibles</h2>
<p>Chez l’adulte, la cause est cardiaque dans la majorité des arrêts extrahospitaliers, et la maladie coronaire en représente la plus grande part. Elle explique environ 80 % des morts subites cardiaques, et les cardiomyopathies non ischémiques 10 à 15 %. L’ischémie aiguë déstabilise électriquement le myocarde, et la cicatrice d’un infarctus ancien crée des circuits de réentrée ; environ un tiers des arrêts extrahospitaliers sont pourtant d’origine extracardiaque. Après 35 ans, un arrêt en fibrillation ventriculaire doit faire évoquer d’abord une occlusion coronaire aiguë ou une cicatrice d’infarctus. Chez le sujet plus jeune, la <button class="w" data-k="i46-sport">mort subite du sportif et du sujet jeune (cardiomyopathies, canalopathies)</button> relève d’autres causes.</p>
<div class="two">
<div class="card"><h4>Causes cardiaques</h4><p>Syndrome coronarien aigu, souvent par <button class="w" data-k="i21-omi">occlusion coronaire aiguë (infarctus occlusif)</button> ; cicatrice d’infarctus (TV monomorphe) ; cardiomyopathies hypertrophique, dilatée, arythmogène ; canalopathies : <button class="w" data-k="i47-qtl">QT long congénital</button>, <button class="w" data-k="i47-brugada">syndrome de Brugada</button> ; myocardite ; valvulopathie (rétrécissement aortique serré) ; <button class="w" data-k="i46-commotio">commotio cordis (choc thoracique sur la période vulnérable)</button> ; bradycardie extrême.</p></div>
<div class="card"><h4>Causes non cardiaques</h4><p>Hypoxie (asphyxie, noyade, obstruction des voies aériennes, insuffisance respiratoire), hémorragie, embolie pulmonaire, pneumothorax sous tension, intoxications, troubles électrolytiques (surtout hyperkaliémie), hypothermie, accident vasculaire cérébral hémorragique (hémorragie sous-arachnoïdienne), sepsis, traumatisme.</p></div></div>
<h3>4.1 Les causes réversibles : 4H et 4T</h3>
<p>La recherche des causes réversibles est essentielle dans un rythme non choquable et se mène en parallèle des compressions, de la ventilation et de l’adrénaline. Corriger un obstacle mécanique ou un trouble métabolique traite la cause ; les gestes de réanimation maintiennent entre-temps une perfusion partielle. Selon l’ESC 2022, des causes réversibles pourraient expliquer jusqu’à la moitié des arrêts cardiaques soudains, même si elles sont souvent difficiles à établir. L’ERC 2025 les regroupe dans l’aide-mémoire <button class="w" data-k="i46-mnemo-4h4t">« 4H et 4T » (huit causes à rechercher pendant la réanimation)</button>.</p>
<table class="t"><tr><th>Cause</th><th>Indices</th><th>Traitement pendant la réanimation</th></tr>
<tr><td><b>H</b>ypoxie</td><td>Asphyxie, noyade, pendaison, insuffisance respiratoire, bradycardie qui précède l’arrêt, car l’hypoxémie ralentit le cœur avant de l’arrêter</td><td>Ventilation en oxygène à 100 %, contrôle des voies aériennes : sans oxygène, les compressions ne font circuler qu’un sang désaturé</td></tr>
<tr><td><b>H</b>ypovolémie</td><td>Traumatisme, hémorragie digestive, rupture d’anévrisme, grossesse extra-utérine</td><td>Arrêt du saignement, remplissage, transfusion : sans précharge, les compressions n’éjectent presque rien, et la transfusion restaure aussi le transport d’oxygène</td></tr>
<tr><td><b>H</b>ypo- ou <b>h</b>yperkaliémie et troubles métaboliques</td><td>Dialyse, insuffisance rénale, médicaments, ECG précédant l’arrêt : l’insuffisance rénale limite l’excrétion du potassium, que les inhibiteurs de l’enzyme de conversion et les antagonistes des minéralocorticoïdes réduisent encore</td><td>Hyperkaliémie : calcium, insuline et glucose, bicarbonate, dialyse (<button class="w" data-k="i46-hyperk">hyperkaliémie en arrêt</button>) ; hypokaliémie : potassium et magnésium ; hypoglycémie : glucose</td></tr>
<tr><td><b>H</b>ypo- ou <b>h</b>yperthermie</td><td>Exposition au froid, avalanche, noyade en eau froide ; coup de chaleur</td><td>Réchauffement ou refroidissement, ECMO en hypothermie : sous 30 °C, le cœur froid répond mal aux chocs et l’adrénaline s’accumule, alors que l’ECMO perfuse et réchauffe en même temps</td></tr>
<tr><td><b>T</b>hrombose coronaire</td><td>Douleur thoracique, FV, ECG avant l’arrêt</td><td>Coronarographie après RACS, parfois sous compressions mécaniques : rouvrir l’artère supprime l’ischémie qui entretient la FV</td></tr>
<tr><td><b>T</b>hrombose pulmonaire (embolie)</td><td>Dyspnée brutale, immobilisation, AESP, ventricule droit dilaté ; ce dernier signe est peu spécifique, car tout arrêt de quelques minutes dilate le cœur droit</td><td>Fibrinolyse pendant la réanimation (<button class="w" data-k="i46-ep">embolie pulmonaire en arrêt</button>)</td></tr>
<tr><td><b>T</b>ension (pneumothorax)</td><td>Traumatisme, ventilation en pression positive, asthme</td><td>Décompression thoracique (<button class="w" data-k="i46-pnothx">pneumothorax sous tension</button>)</td></tr>
<tr><td><b>T</b>amponnade</td><td>Traumatisme pénétrant, chirurgie cardiaque, dissection, cancer</td><td>Péricardiocentèse ou thoracotomie : le liquide sous pression empêche les ventricules de se remplir, et son évacuation rétablit le remplissage</td></tr>
<tr><td><b>T</b>oxiques</td><td>Contexte, emballages, antécédents psychiatriques</td><td>Antidote, réanimation prolongée (<button class="w" data-k="i46-intox">intoxications</button>)</td></tr></table>
<p>Le tableau compte neuf lignes pour huit causes, car l’aide-mémoire réunit la thrombose coronaire et la thrombose pulmonaire sous une même lettre. L’ordre de recherche suit le contexte : chez un dialysé, l’hyperkaliémie vient en tête ; chez un opéré récent alité, l’embolie pulmonaire ; chez un polytraumatisé, l’hypovolémie, le pneumothorax et la tamponnade.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Réciter les 4H et 4T sans agir. Chaque cause évoquée doit conduire à un geste ou à un examen précis pendant la réanimation : gazométrie et kaliémie au point de soins, échographie ciblée pendant la vérification du pouls, auscultation et recherche d’emphysème, anamnèse des témoins.</div>
<button class="pareto-btn ui" data-k="pareto-i46-etio">▲ Loi de Pareto — Étiologies et causes réversibles</button>
</section>

<section class="ilot" id="i46-5"><h2><span class="n">5</span>Anamnèse : avant, pendant et après</h2>
<p>L’anamnèse d’un arrêt cardiaque ne précède pas la réanimation : elle se fait en parallèle, par un membre de l’équipe qui interroge les témoins, les proches et le dossier. Elle répond à trois questions : quelle est la cause probable, combien de temps a duré l’absence de perfusion, et quelle est la volonté du patient ?</p>
<h3>5.1 Questions aux témoins</h3>
<p>Les <button class="w" data-k="i46-s-temoin">questions aux témoins (heure, circonstances, gestes, délais)</button> établissent la durée du no-flow et du low-flow : heure de l’effondrement, arrêt vu ou non, délai jusqu’aux premières compressions, utilisation d’un défibrillateur et nombre de chocs. Les circonstances orientent la cause : effort ou émotion (canalopathie, coronaire), repas (obstruction des voies aériennes), baignade, prise de toxiques, traumatisme.</p>
<h3>5.2 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i46-atcd-card">Cardiopathie connue (infarctus, cardiomyopathie, défibrillateur)</button></li><li>Facteurs de risque cardiovasculaire, qui rendent probable une maladie coronaire, première cause de mort subite</li><li>Insuffisance rénale, dialyse (hyperkaliémie)</li><li>Thrombose veineuse, cancer, chirurgie récente (embolie pulmonaire)</li></ul>
<ul><li><button class="w" data-k="i46-atcd-medic">Médicaments et toxiques (QT long, bradycardisants, opioïdes)</button></li><li><button class="w" data-k="i47-atcd-fam">Mort subite dans la famille</button></li><li>Maladie respiratoire, asthme sévère, allergie connue</li><li><button class="w" data-k="i46-da">Directives anticipées, représentant thérapeutique</button></li></ul></div>
<h3>5.3 Symptômes précurseurs, par ordre de fréquence</h3>
<p>Une part importante des arrêts extrahospitaliers est précédée de symptômes dans les heures ou les jours précédents. Dans une cohorte de l’Oregon, 51 % des victimes de 35 à 65 ans avaient eu des symptômes dans les quatre semaines précédentes, surtout une douleur thoracique ou une dyspnée, récidivant dans les 24 heures chez 93 % d’entre elles. Les 19 % qui avaient appelé les secours survivaient à 32 %, contre 6 % sans appel : cette association plaide pour faire appeler le 144 dès ces symptômes.</p>
<div class="two">
<ul><li><button class="w" data-k="i46-s-prodr">Douleur thoracique (prodrome le plus fréquent)</button></li><li>Dyspnée</li><li>Malaise, sueurs, nausées</li></ul>
<ul><li><button class="w" data-k="i46-s-syncope">Syncope d’effort ou palpitations suivies de syncope</button></li><li>Chez l’hospitalisé : tachypnée, confusion, hypotension, désaturation, qui traduisent la défaillance progressive de la respiration ou de la circulation dans les heures précédant l’arrêt</li><li>Convulsion brève inaugurale (anoxie cérébrale)</li></ul></div>
<h3>5.4 Présentations typiques et trompeuses</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Homme de 62 ans, fumeur, douleur thoracique depuis une heure, effondrement devant son épouse. Rythme initial : FV. Cause : occlusion de l’interventriculaire antérieure.</p></div>
<div class="card"><h4>Forme trompeuse : la respiration agonale</h4><p>Le témoin décrit une personne « qui respire encore » : ce sont des <button class="w" data-k="i46-agonal">gasps agonaux (respiration anormale qui signe l’arrêt)</button>. Ils retardent la reconnaissance et l’appel.</p></div>
<div class="card"><h4>Forme trompeuse : la convulsion</h4><p>Femme de 24 ans, « crise d’épilepsie » à la sonnerie du réveil. Les secousses brèves traduisaient l’anoxie cérébrale d’une torsade de pointes sur QT long congénital. De telles secousses accompagnent 4 à 13 % des arrêts extrahospitaliers et retardent leur reconnaissance au téléphone (médiane de 130 contre 62 secondes) : une personne qui reste inconsciente et respire anormalement après la crise est en arrêt.</p></div>
<div class="card"><h4>Forme intrahospitalière</h4><p>Homme de 80 ans, pneumonie, fréquence respiratoire à 32/min et confusion depuis six heures, non signalées. Arrêt en AESP par hypoxie. L’arrêt était prévisible et probablement évitable.</p></div></div>
</section>

<section class="ilot" id="i46-6"><h2><span class="n">6</span>Examen clinique : reconnaître et chercher la cause</h2>
<p>L’examen clinique change de nature selon le moment. Avant la réanimation, il se réduit à une reconnaissance de moins de dix secondes. Pendant la réanimation, il cherche une cause réversible sans interrompre les compressions. Après le RACS, il redevient complet et oriente les soins post-réanimation.</p>
<h3>6.1 Reconnaître l’arrêt : moins de dix secondes</h3>
<p>La reconnaissance repose sur deux constats : <b>absence de réponse</b> (secouer doucement les épaules, appeler fort) et <b>respiration absente ou anormale</b> (tête basculée en arrière, menton relevé, regarder, écouter, sentir). Chez la personne inconsciente, la perte de tonus fait tomber la base de la langue contre le pharynx ; la bascule de la tête et l’élévation du menton la décollent et libèrent les voies aériennes. Pour un professionnel entraîné, la recherche d’un pouls carotidien peut accompagner l’évaluation de la respiration, sans dépasser dix secondes, car la <button class="w" data-k="i46-e-pouls">palpation du pouls (fiabilité médiocre)</button> est une source fréquente d’erreur et de retard.</p>
<div class="trap"><span class="k">Piège</span>Une personne inconsciente qui respire « anormalement » est en arrêt cardiaque jusqu’à preuve du contraire. Les gasps, une respiration lente et laborieuse, ou une respiration presque normale dans les premières secondes chez un sportif, ne doivent pas faire différer les compressions. Comprimer un patient qui n’est pas en arrêt expose à peu de complications graves ; ne pas comprimer un patient en arrêt le condamne.</div>
<h3>6.2 Pendant la réanimation : les signes des causes réversibles</h3>
<div class="two">
<div><b>Thorax et voies aériennes</b><ul><li><button class="w" data-k="i46-e-thorax">Asymétrie ventilatoire, emphysème sous-cutané (pneumothorax)</button></li><li>Résistance à l’insufflation (obstruction, bronchospasme)</li><li>Corps étranger visible à la laryngoscopie</li></ul></div>
<div><b>Circulation et volume</b><ul><li>Veines jugulaires turgescentes (tamponnade, embolie pulmonaire, pneumothorax), car l’obstacle au remplissage ou à l’éjection du cœur droit fait monter la pression veineuse ; elles restent plates dans l’hypovolémie</li><li>Pâleur extrême, saignement extériorisé, abdomen distendu (hypovolémie)</li><li>Mollet asymétrique, œdème unilatéral (thrombose veineuse)</li></ul></div>
<div><b>Peau et température</b><ul><li>Température centrale basse (hypothermie)</li><li>Urticaire, œdème facial (anaphylaxie)</li><li>Fistule artérioveineuse (dialyse : hyperkaliémie)</li></ul></div>
<div><b>Indices toxiques et neurologiques</b><ul><li><button class="w" data-k="i46-e-pupilles">Pupilles (myosis serré des opioïdes, mydriase non interprétable)</button></li><li>Traces d’injection, emballages, patch transdermique</li><li>Morsure de langue, signes de traumatisme crânien</li></ul></div></div>
<h3>6.3 Après le RACS : l’examen de départ</h3>
<p>Il comprend les signes vitaux complets (pression artérielle, fréquence, SpO₂, capnographie, température centrale, glycémie), l’examen cardiovasculaire (souffle, signes d’insuffisance cardiaque), l’examen respiratoire (position de la sonde, inhalation) et un examen neurologique initial documenté : score de Glasgow, pupilles, réflexes du tronc, myoclonies. Ce premier examen ne permet pas, à lui seul, de conclure à un <b>pronostic neurologique défavorable</b> : il sert de référence pour les examens ultérieurs.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure à un mauvais pronostic sur des pupilles aréactives dans l’heure qui suit le RACS. L’adrénaline, l’atropine, l’hypoxie récente et la sédation modifient les pupilles. Un signe clinique précoce isolé ne justifie pas une conclusion défavorable ; la conclusion pronostique chez le patient toujours inconscient se construit à 72 heures ou plus, de façon multimodale et après exclusion des facteurs confondants.</div>

</section>
