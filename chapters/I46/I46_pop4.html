
<!-- ===== FENÊTRES I46 : monographies ===== -->
<template data-pop="i46-d-adre" data-title="Adrénaline dans l’arrêt cardiaque">
<div class="lab">Mécanisme</div><p>Agoniste α et β. L’effet α1 (vasoconstriction) élève la pression aortique diastolique et la pression de perfusion coronaire et cérébrale : c’est l’effet recherché. L’effet β1 augmente la consommation d’oxygène du myocarde et son excitabilité ; l’effet α peut réduire la microcirculation cérébrale.</p>
<div class="lab">Preuves</div><p>PARAMEDIC2 (2018, 8 014 arrêts extrahospitaliers) : survie à 30 jours de 3,2 % contre 2,4 % avec placebo, sans différence significative de survie avec une bonne fonction neurologique (2,2 % contre 1,9 %). L’adrénaline augmente nettement le RACS et la survie à court terme ; son bénéfice neurologique reste incertain. Son effet est plus marqué dans les rythmes non choquables et lorsqu’elle est administrée tôt.</p>
<div class="lab">Posologie (ERC 2025)</div><p>1 mg par voie intraveineuse ou intraosseuse toutes les 3 à 5 minutes. Rythme non choquable : dès que possible. Rythme choquable : après le 3e choc. Hypothermie : une seule dose de 1 mg sous 30 °C, sauf RCP extracorporelle imminente, car elle s’accumule ; intervalle de 6 à 10 minutes entre 30 et 35 °C.</p>
<div class="lab">Autres usages</div><p>Anaphylaxie : 0,5 mg par voie intramusculaire (solution à 1 mg/mL). Après le RACS ou dans la bradycardie : perfusion continue titrée, par exemple de 2 à 10 µg/min (voir la fiche « adrénaline en perfusion » du chapitre I44).</p>
<div class="lab">Effets indésirables</div><p>Tachycardie, récidive de FV, hypertension et ischémie myocardique après le RACS ; nécrose en cas d’extravasation.</p>
<div class="lab">Erreurs</div><p>Bolus de 1 mg chez un patient qui a un pouls ; confusion des concentrations (1 mg/mL et 0,1 mg/mL).</p>
<div class="lab">Pourquoi le moment dépend du rythme</div><p>Dans un rythme non choquable, aucun choc ne peut rétablir une activité organisée : l’adrénaline, qui élève la pression de perfusion coronaire, est l’une des rares mesures disponibles, et la survie baisse à mesure qu’elle est retardée. Dans un rythme choquable, le choc est le traitement causal : l’adrénaline n’est donnée qu’après trois chocs inefficaces, pour ne pas retarder la défibrillation. L’ILCOR recommande fortement de la donner dès que possible dans les rythmes non choquables et suggère, plus faiblement, de la donner après l’échec des premiers chocs dans les rythmes choquables ; la certitude des preuves est très faible dans les deux cas.</p>
<div class="lab">Bénéfice et incertitude</div><p>Dans PARAMEDIC2, le gain de survie persiste à 12 mois. Les fortes doses (5 à 10 mg) et la vasopressine n’ont pas amélioré la survie à long terme. La dose optimale n’est pas établie ; sous monitorage artériel continu, l’ERC 2025 propose des incréments de 50 à 100 µg plutôt qu’un bolus de 1 mg.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, réanimation avancée de l’adulte (Soar et al., Resuscitation 2025;215:110769), sections sur les vasopresseurs et l’arrêt sous monitorage.</p>
</template>

<template data-pop="i46-d-lido" data-title="Lidocaïne dans la FV réfractaire">
<div class="lab">Mécanisme</div><p>Antiarythmique de classe Ib : blocage rapide des canaux sodiques, surtout dans le tissu ischémique et dépolarisé ; raccourcit la durée du potentiel d’action.</p>
<div class="lab">Preuves</div><p>ALPS (2016) : ni l’amiodarone ni la lidocaïne n’ont amélioré significativement la survie à la sortie par rapport au placebo dans la FV réfractaire ; toutes deux augmentaient l’admission à l’hôpital, avec un bénéfice possible dans les arrêts devant témoin.</p>
<div class="lab">Posologie (ERC 2025)</div><p>100 mg par voie intraveineuse après le 3e choc, puis 50 mg après le 5e, si l’amiodarone n’est pas disponible.</p>
<div class="lab">Toxicité</div><p>Neurologique (paresthésies péribuccales, convulsions) et cardiaque à forte dose ; prudence en insuffisance hépatique et cardiaque.</p></template>

<template data-pop="i46-d-lyse" data-title="Fibrinolytiques dans l’arrêt cardiaque">
<div class="lab">Molécules</div><p>Altéplase, ténectéplase : activateurs du plasminogène qui transforment le plasminogène lié à la fibrine en plasmine, qui lyse le caillot.</p>
<div class="lab">Indication (ERC 2025)</div><p>Arrêt cardiaque dont l’embolie pulmonaire est la cause suspectée ou confirmée. Pas d’indication systématique : l’essai TROICA (2008, ténectéplase dans les arrêts extrahospitaliers non sélectionnés) n’a pas montré de bénéfice.</p>
<div class="lab">Posologie</div><p>Non fixée par l’ERC : bolus unique selon le protocole de l’institution (altéplase ou ténectéplase, pleine dose ou dose réduite). En Suisse, seule l’altéplase (Actilyse®) est autorisée dans l’embolie pulmonaire massive avec instabilité hémodynamique, à 100 mg en 2 heures si le poids est ≥ 65 kg ; le bolus de l’arrêt cardiaque sort de ce schéma, et la ténectéplase (Metalyse®) n’est autorisée que dans l’infarctus (informations professionnelles suisses, consultées le 08.10.2026). Poursuivre la réanimation 60 à 90 minutes après l’administration, souvent avec un dispositif de compressions mécaniques.</p>
<div class="lab">Risques</div><p>Hémorragies, surtout aux sites de ponction et en cas de traumatisme dû aux compressions. En arrêt, le bénéfice attendu l’emporte habituellement sur ce risque.</p>
<div class="lab">Pourquoi poursuivre 60 à 90 minutes</div><p>Le faible débit des compressions doit amener le fibrinolytique jusqu’au caillot, puis la lyse doit libérer assez l’artère pulmonaire pour que le ventricule droit éjecte à nouveau ; les séries de cas montrent que ce délai justifie de poursuivre 60 à 90 minutes. Les preuves de bénéfice sont de très faible certitude : une étude a montré une survie à 30 jours de 16 % contre 6 %, trois autres n’ont pas montré de différence de survie à la sortie. L’ILCOR juge néanmoins que le bénéfice possible l’emporte sur le risque hémorragique.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, réanimation avancée de l’adulte (Soar et al., Resuscitation 2025;215:110769), section sur les thrombolytiques.</p>
</template>

<template data-pop="i46-d-bicar" data-title="Bicarbonate de sodium">
<div class="lab">Mécanisme</div><p>Tampon : neutralise les ions hydrogène en produisant du CO₂ et de l’eau. Apporte du sodium, qui antagonise le blocage des canaux sodiques par certains toxiques.</p>
<div class="lab">Indications (ERC 2025)</div><p>Hyperkaliémie menaçante (50 mmol) ; intoxication aux antidépresseurs tricycliques et autres bloqueurs sodiques (QRS larges). Pas d’usage systématique pour l’acidose de l’arrêt.</p>
<div class="lab">Présentation</div><p>Solution à 8,4 % : 1 mmol/mL, donc 50 mL pour 50 mmol. L’information professionnelle suisse (Natrium Bicarbonicum Sintetica® 8,4 %) ne tolère le tamponnement à l’aveugle qu’en réanimation : environ 1 mmol/kg, 100 mmol au plus, puis 0,5 mmol/kg toutes les 10 minutes si l’arrêt se prolonge.</p>
<div class="lab">Effets indésirables</div><p>Acidose intracellulaire paradoxale par le CO₂ produit, hypernatrémie, hyperosmolarité, alcalose, hypokaliémie, baisse du calcium ionisé ; précipite avec le calcium ; inactive les catécholamines dans la même voie.</p>
<div class="lab">Preuves</div><p>Les méta-analyses de trois essais randomisés n’ont montré aucun bénéfice du bicarbonate systématique sur la survie à court terme, la survie à la sortie ni le devenir neurologique à un mois ; l’ILCOR le déconseille en routine. Faute d’effet hypokaliémiant notable, l’ERC 2025 ne le recommande plus dans l’hyperkaliémie sans arrêt ; il le garde dans l’arrêt hyperkaliémique.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, réanimation avancée de l’adulte (Soar et al., Resuscitation 2025;215:110769), section sur le bicarbonate ; ERC 2025, circonstances particulières (Lott et al., Resuscitation 2025;215:110753), section sur l’hyperkaliémie.</p>
</template>

<template data-pop="i46-d-nalox" data-title="Naloxone">
<div class="lab">Mécanisme</div><p>Antagoniste compétitif des récepteurs opioïdes μ, κ et δ ; action en 1 à 2 minutes par voie intraveineuse, durée de 30 à 90 minutes, plus courte que celle de nombreux opioïdes (méthadone, formes à libération prolongée).</p>
<div class="lab">Place</div><p>Dépression respiratoire aux opioïdes avec pouls : ventilation au ballon, puis naloxone : l’information professionnelle suisse (Naloxon OrPha®) prévoit dans le surdosage d’opioïdes 0,4 à 2 mg par voie intraveineuse, intramusculaire ou sous-cutanée, répétables toutes les 2 à 3 minutes, et 0,1 à 0,2 mg par voie intraveineuse pour lever une dépression respiratoire postopératoire ; la durée d’action de certains opioïdes dépasse celle de la naloxone, ce qui impose une surveillance prolongée. En arrêt cardiaque, la ventilation et l’algorithme standard priment ; la naloxone n’a pas démontré de bénéfice propre.</p>
<div class="lab">Précautions</div><p>Syndrome de sevrage brutal (agitation, vomissements, œdème pulmonaire) chez le dépendant ; resédation à la fin de l’effet : surveillance prolongée ou perfusion.</p>
<div class="lab">Pourquoi la ventilation prime en arrêt</div><p>Les opioïdes tuent par dépression respiratoire : l’hypoxie conduit à la bradycardie puis à l’arrêt. Une fois le cœur arrêté, la naloxone ne peut que lever la dépression du centre respiratoire, et elle ne l’atteint qu’avec une circulation ; ventiler corrige directement l’hypoxie, cause de l’arrêt. Une revue systématique de l’ILCOR a trouvé des résultats hétérogènes, insuffisants pour recommander la naloxone dans l’arrêt par opioïdes.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, circonstances particulières (Lott et al., Resuscitation 2025;215:110753), section sur l’intoxication aux opioïdes.</p>
</template>

<template data-pop="i46-d-lipid" data-title="Émulsion lipidique à 20 %">
<div class="lab">Indication</div><p>Toxicité systémique des anesthésiques locaux (bupivacaïne, ropivacaïne), avec convulsions, arythmies ou arrêt ; envisagée dans d’autres intoxications par des médicaments liposolubles en situation réfractaire, sur avis toxicologique.</p>
<div class="lab">Mécanisme proposé</div><p>Compartiment lipidique qui capte le toxique liposoluble (« puits lipidique ») ; effets métaboliques et inotropes directs.</p>
<div class="lab">Posologie usuelle</div><p>Bolus intraveineux suivi d’une perfusion continue, bolus répétables en cas d’instabilité persistante, selon le protocole de l’institution. Lacune nommée : les volumes chiffrés circulant en pratique proviennent d’un avis de pratique américain (Neal et al., 2018) et n’ont pas été retrouvés dans une source européenne lue lors du balayage du 08.10.2026. Aucune émulsion lipidique n’a cette indication dans une information professionnelle suisse de l’AIPS : son emploi est hors indication autorisée.</p>
<div class="lab">Précautions</div><p>Réanimation prolongée ; le propofol n’est pas un substitut. Interférence avec certains dosages biologiques, pancréatite.</p>
<div class="lab">Pourquoi les anesthésiques locaux arrêtent le cœur</div><p>Les anesthésiques locaux bloquent les canaux sodiques ; en excès, ils bloquent aussi ceux des cardiomyocytes. La conduction ralentit, la contractilité baisse, puis surviennent arythmie ou collapsus, habituellement 1 à 5 minutes après une injection intravasculaire accidentelle, parfois jusqu’à une heure plus tard. Les premiers signes, engourdissement péribuccal, goût métallique, vertiges, acouphènes et vision floue, précèdent souvent l’hypotension, les arythmies et les convulsions.</p>
<div class="lab">Ce qui change la décision (ERC 2025)</div><p>L’adrénaline est réduite à 1 µg/kg au plus, car à dose standard elle entretient l’arythmie et l’acidose dans les modèles animaux. Une ventilation adaptée corrige l’hypercapnie et peut compenser l’acidémie en abaissant la PaCO₂ ; elle ne supprime pas la cause de l’acidose métabolique, qui exige le rétablissement de la perfusion et le traitement de la toxicité. Éviter l’hypoxie et l’acidémie limite la cardiotoxicité, favorisée notamment par le piégeage intracellulaire de la forme ionisée de l’anesthésique. L’émulsion lipidique est recommandée malgré des preuves de très faible certitude, faute de nocivité documentée. Le propofol ne la remplace pas : il ne contient que 10 % de lipides et déprime le myocarde bien avant d’en apporter assez.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, circonstances particulières (Lott et al., Resuscitation 2025;215:110753), section sur la toxicité des anesthésiques locaux .</p>
</template>

<template data-pop="i46-d-vaso" data-title="Vasopresseurs et inotropes après le RACS">
<div class="lab">Noradrénaline</div><p>Agoniste α1 prédominant et β1 : vasopresseur de première intention pour atteindre une PAM &gt; 60–65 mmHg. Perfusion par voie centrale de préférence.</p>
<div class="lab">Dobutamine</div><p>Agoniste β1 : inotrope en cas de bas débit par sidération myocardique malgré une pression correcte. Tachycardie et arythmies possibles.</p>
<div class="lab">Cibles</div><p>ERC-ESICM 2025 : PAM &gt; 60–65 mmHg, PAS &gt; 100 mmHg, diurèse et lactate. L’essai BOX (2022) n’a pas montré de différence entre une PAM cible de 63 et de 77 mmHg. Une cible plus élevée peut se discuter chez l’hypertendu chronique ou en cas d’hypoperfusion persistante.</p>
<div class="lab">Assistance mécanique</div><p>Dans le choc cardiogénique réfractaire d’origine ischémique, selon le choix d’un centre expert. L’ERC-ESICM 2025 la réserve à des patients sélectionnés, par exemple infarctus avec sus-décalage, score de Glasgow d’au moins 8 à l’arrivée et arrêt de moins de 10 minutes : dans une méta-analyse sur données individuelles, l’assistance n’a réduit la mortalité que chez les patients en choc avec sus-décalage sans risque de lésion cérébrale anoxique, au prix de plus de saignements et de complications vasculaires. L’essai DanGer Shock, favorable à la pompe microaxiale, excluait les patients comateux après un arrêt extrahospitalier.</p>
<div class="lab">Pourquoi le choc après le RACS</div><p>Deux mécanismes s’additionnent. Le myocarde ischémié reste sidéré : la dysfonction touche jusqu’à 60 % des patients, culmine dans les 24 à 48 premières heures puis régresse. La reperfusion déclenche une réaction inflammatoire proche du sepsis, qui dilate les vaisseaux. L’échocardiographie précoce sépare ces deux composantes et oriente le choix entre remplissage, vasopresseur et inotrope.</p>
<div class="lab">Pourquoi la noradrénaline d’abord</div><p>Son effet α1 restaure le tonus vasculaire, et son effet β1 soutient modérément la contraction. Aucun essai n’a désigné le meilleur vasopresseur après un arrêt : la noradrénaline est retenue par extrapolation du choc cardiogénique, où l’adrénaline a causé davantage de chocs réfractaires dans un essai interrompu, et parce qu’elle a été bien tolérée aux cibles élevées des essais. Une solution diluée peut passer par une voie périphérique en attendant la voie centrale. L’efficacité se juge aussi sur la diurèse, supérieure à 0,5 mL/kg/h, et la baisse du lactate.</p>
<div class="lab">Source complémentaire</div><p>ERC-ESICM 2025, soins post-réanimation (Nolan et al., Resuscitation 2025;215:110809), sections sur la surveillance et la prise en charge hémodynamiques.</p>
</template>

<template data-pop="i46-d-antiep" data-title="Anticonvulsivants après un arrêt cardiaque">
<div class="lab">Indication</div><p>Crises cliniques ou état de mal électrique. Pas de prophylaxie (ERC-ESICM 2025).</p>
<div class="lab">Choix</div><p>Lévétiracétam ou valproate de sodium en première intention, en plus de la sédation (propofol, benzodiazépines). La phénytoïne est moins utilisée (hypotension, arythmies).</p>
<div class="lab">Myoclonies</div><p>Distinguer l’état de mal myoclonique précoce, généralisé et continu (souvent pronostic défavorable), des myoclonies d’action du syndrome de Lance-Adams, compatibles avec un bon réveil. L’EEG aide ; l’ERC-ESICM 2025 recommande un essai d’éveil si l’EEG de fond est bénin.</p>
<div class="lab">Pourquoi traiter, mais pas prévenir</div><p>Une crise augmente le métabolisme cérébral et peut aggraver la lésion anoxique : les crises cliniques et électriques sont donc traitées. Elles touchent 20 à 30 % des patients et signent le plus souvent une lésion anoxique sévère ; dans l’essai TELSTAR, supprimer l’activité rythmique et périodique n’a pas changé le devenir, mauvais chez 90 % des patients des deux groupes. Aucune donnée ne soutient une prophylaxie.</p>
<div class="lab">Pourquoi éviter la phénytoïne et la surenchère sédative</div><p>Ses effets inotropes négatifs et vasodilatateurs aggravent un état hémodynamique déjà fragile après le RACS. Un traitement sédatif agressif peut en outre fausser l’examen et conduire à un pronostic trop pessimiste chez un patient qui développe un syndrome de Lance-Adams.</p>
<div class="lab">Source complémentaire</div><p>ERC-ESICM 2025, soins post-réanimation (Nolan et al., Resuscitation 2025;215:110809), section sur le contrôle des crises.</p>
</template>


<template data-pop="i46-enfant" data-title="Arrêt cardiaque de l’enfant">
<div class="lab">Causes</div><p>Surtout respiratoires et circulatoires : insuffisance respiratoire, sepsis, déshydratation, noyade, traumatisme, obstruction des voies aériennes. L’arrêt est souvent précédé d’une bradycardie hypoxique ; les rythmes non choquables prédominent.</p>
<div class="lab">Réanimation de base (ERC 2025)</div><p>Cinq insufflations initiales ; puis 15 compressions pour 2 ventilations pour le professionnel formé, 30:2 admis pour le témoin formé seulement à la réanimation de l’adulte ; le témoin non formé suit les instructions du 144 ; profondeur d’au moins un tiers du diamètre antéropostérieur du thorax (5 à 6 cm chez l’adolescent, jamais plus de 6 cm) ; fréquence de 100 à 120/min.</p>
<div class="lab">Doses (ERC 2025)</div><p>Défibrillation : 4 J/kg (maximum 120 à 200 J selon l’appareil) ; FV réfractaire : jusqu’à 8 J/kg (maximum 360 J). Adrénaline : 10 µg/kg (maximum 1 mg) par voie intraveineuse ou intraosseuse, dès que possible dans un rythme non choquable, après le 3e choc dans un rythme choquable, puis toutes les 3 à 5 minutes. Amiodarone : 5 mg/kg (maximum 300 mg) après le 3e choc, puis 5 mg/kg (maximum 150 mg) après le 5e. Lidocaïne : 1 mg/kg si l’amiodarone n’est pas disponible.</p>
<div class="lab">Différences avec l’adulte</div><p>Priorité à l’oxygénation et à la ventilation ; voie intraosseuse d’emblée si l’accès veineux est difficile ; doses calculées au poids (ruban de Broselow ou âge) ; présence des parents encouragée.</p>
<div class="lab">Prescription</div><p>Pour les doses de perfusion et les formes galéniques, se référer au protocole pédiatrique local et à l’information professionnelle.</p>
<div class="lab">Pourquoi la ventilation passe d’abord</div><p>Chez l’enfant, la moitié des arrêts extrahospitaliers ont une cause réversible, l’hypoxie en tête. Le cœur s’arrête alors par épuisement hypoxique, après une bradycardie : rétablir l’oxygénation traite la cause. C’est pourquoi l’ERC 2025 commence par cinq insufflations et préfère 15 compressions pour 2 ventilations chez le professionnel formé, et pourquoi une bradycardie avec mauvaise perfusion est traitée comme un rythme non choquable.</p>
<div class="lab">Intervalle de l’adrénaline</div><p>L’intervalle reste de 3 à 5 minutes ; l’ERC 2025 retient en pratique une dose toutes les 4 minutes, soit un cycle sur deux. Dans un rythme choquable, la première dose suit le troisième choc, vers la quatrième minute.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, réanimation pédiatrique (Djakow et al., Resuscitation 2025;215:110767).</p>
</template>

<template data-pop="i46-mnemo-choc" data-title="« 3 et 5 » — médicaments d’un rythme choquable">
<p><b>3</b>e choc : adrénaline 1 mg et amiodarone 300 mg.<br><b>5</b>e choc : adrénaline 1 mg et amiodarone 150 mg.<br>Ensuite, adrénaline tous les deux cycles (3 à 5 minutes), sans nouvelle dose d’amiodarone.</p>
<div class="lab">Rythme non choquable</div><p>Adrénaline immédiate, puis tous les deux cycles ; pas d’amiodarone.</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>Aide-mémoire construit sur l’algorithme de réanimation avancée de l’ERC 2025. Si l’arrêt survient sous monitorage avec trois chocs successifs, ces trois chocs comptent comme le premier choc.</p></template>

<!-- ===== FENÊTRES PARETO ===== -->
<template data-pop="pareto-i46-def" data-title="Pareto — Définitions et épidémiologie">
<p class="ratio" data-cover="i46-1,i46-2"></p>
<ul><li>Arrêt = inconscient + respiration absente ou anormale. Mort subite : décès cardiaque &lt; 1 h après les symptômes (&lt; 24 h si sans témoin).</li><li>Arrêt réanimé avec succès = mort subite avortée ; la cause (infarctus, cardiomyopathie, canalopathie) se cherche toujours.</li><li>Choquables : FV, TV sans pouls → choc. Non choquables : AESP, asystolie → adrénaline tôt + cause.</li><li>ACEH : domicile, souvent cardiaque, témoin décisif. ACIH : non choquable, précédé de signes d’alerte.</li><li>Issue qui compte : survie avec bonne fonction (CPC 1–2), pas le RACS.</li><li>Europe : ≈ 55 arrêts traités par les secours/100 000/an ; survie ≈ 7,5 % (3,1–35 %, EuReCa 2022). Suisse : RCP par témoin ≈ 57–63 % (Swissreca 2019–2020) ; Fribourg : survie 7,7 %.</li><li>Chaque minute de retard au choc d’une FV : échec du choc +6 %, survie à la sortie −3 à 6 % (ERC 2025), car le myocarde fibrillant épuise ses réserves d’énergie.</li></ul></template>

<template data-pop="pareto-i46-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i46-3"></p>
<ul><li>Chaîne : no-flow → low-flow → RACS et reperfusion → lésion cérébrale.</li><li>Cerveau : conscience perdue en 10 s ; risque croissant de lésion irréversible avec le no-flow (hippocampe, cervelet, cortex), sans seuil individuel certain de cinq minutes.</li><li>FV : phase électrique (choc immédiat) → circulatoire (compressions + choc) → métabolique.</li><li>RCP = 25–33 % du débit ; perfusion coronaire en relâchement ; seuil ≈ 15 mmHg ; chaque pause la fait chuter.</li><li>Adrénaline α → pression aortique diastolique ↑.</li><li>Syndrome post-arrêt : cerveau + cœur sidéré + réaction systémique + cause persistante.</li></ul></template>

<template data-pop="pareto-i46-etio" data-title="Pareto — Étiologies et causes réversibles">
<p class="ratio" data-cover="i46-4"></p>
<ul><li>Adulte : coronaire d’abord ; &lt; 35 ans : cardiomyopathies, canalopathies, myocardite.</li><li>4H : hypoxie, hypovolémie, hypo/hyperkaliémie-métabolique, hypo/hyperthermie.</li><li>4T : thrombose (coronaire, pulmonaire), tension (pneumothorax), tamponnade, toxiques.</li><li>Chaque cause → un geste : O₂/ventilation ; remplissage/hémostase ; calcium-insuline-bicarbonate-dialyse ; réchauffement/ECMO ; coronarographie ; fibrinolyse ; décompression ; péricardiocentèse ; antidote.</li><li>Hypokaliémie : potassium + magnésium ; hypoglycémie : glucose.</li><li>L’ordre de recherche suit le contexte (dialysé, opéré, traumatisé).</li></ul></template>

<template data-pop="pareto-i46-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i46-5,i46-6"></p>
<ul><li>Anamnèse parallèle à la réanimation : heure, témoin, délai des compressions et du choc (no-flow, low-flow), circonstances, médicaments, directives anticipées.</li><li>Prodromes fréquents : douleur thoracique, dyspnée, syncope d’effort ; à l’hôpital : tachypnée, confusion, hypotension.</li><li>Pièges : gasps agonaux (= arrêt), convulsion brève (= anoxie), pouls peu fiable (≤ 10 s ; doute → comprimer).</li><li>Pendant la RCP : signes des 4H et 4T sans pause (thorax, jugulaires, saignement, température, pupilles, emballages).</li><li>Après RACS : examen de référence ; une constatation précoce isolée, notamment des pupilles aréactives, ne permet pas de conclure à un pronostic défavorable.</li></ul></template>

<template data-pop="pareto-i46-bls" data-title="Pareto — Chaîne de survie et réanimation de base">
<p class="ratio" data-cover="i46-7"></p>
<ul><li>Chaîne : reconnaissance + 144 → RCP → DAE → réanimation avancée et post-réanimation.</li><li>144 en haut-parleur ; RCP guidée par le régulateur ; premiers répondants par application (Ticino Cuore, Momentum).</li><li>Mains : moitié inférieure du sternum. 100–120/min, 5–6 cm, relâchement complet, 30:2 (compressions seules si non formé), relais toutes les 2 min.</li><li>DAE dès que disponible ; compressions pendant la pose ; après le choc, reprise immédiate 2 min sans vérifier le pouls.</li><li>Choc ≤ 3 min après un effondrement devant témoin : 74 % de survie, contre 49 % au-delà (casinos, 2000) ; phase électrique de la FV.</li><li>Corps étranger : 5 tapes dans le dos, 5 compressions abdominales ; inconscient → RCP. Inconscient qui respire : position latérale de sécurité.</li></ul></template>

<template data-pop="pareto-i46-als" data-title="Pareto — Réanimation avancée">
<p class="ratio" data-cover="i46-8"></p>
<ul><li>Priorités : compressions de qualité, pause pré-choc &lt; 5 s, choc immédiat, causes réversibles.</li><li>Cycles de 2 min ; analyse &lt; 5 s ; compressions pendant la charge.</li><li>Choquable : 1er choc ≥ 150 J (biphasique) ; adrénaline 1 mg après le 3e choc puis /3–5 min ; amiodarone 300 mg (3e choc), 150 mg (5e) ; lidocaïne 100/50 mg.</li><li>Aide-mémoire « 3 et 5 » : adrénaline + amiodarone 300 au 3e choc, adrénaline + amiodarone 150 au 5e.</li><li>Péri-arrêt : bradycardie (atropine, stimulation), tachycardie avec pouls (cardioversion synchronisée).</li><li>Arrêt sous monitorage : jusqu’à 3 chocs successifs. FV réfractaire : électrodes, position antéropostérieure.</li><li>Non choquable : adrénaline 1 mg dès que possible puis /3–5 min ; chercher la cause.</li><li>Voies aériennes : progressif ; intubation si succès &gt; 95 % en 2 essais, pause &lt; 5 s ; puis compressions continues, 10 ventilations/min ; capnographie obligatoire.</li><li>Intraveineux d’abord, intraosseux après 2 échecs ; pas de voie trachéale.</li><li>EtCO₂ qui bondit (&gt; 35–40 mmHg) = RACS probable → différer l’adrénaline.</li></ul></template>

<template data-pop="pareto-i46-causes" data-title="Pareto — Causes réversibles et arrêt des manœuvres">
<p class="ratio" data-cover="i46-9"></p>
<ul><li>Échographie : opérateur expérimenté, pause ≤ 10 s.</li><li>Hyperkaliémie : chlorure de calcium 10 % 10 mL (ou gluconate 30 mL), insuline 10 unités + glucose 25 g, bicarbonate 50 mmol, dialyse.</li><li>Embolie pulmonaire : fibrinolyse dès la suspicion, RCP 60–90 min ensuite.</li><li>Pneumothorax : thoracostomie au doigt ; tamponnade : péricardiocentèse ; torsades : magnésium 2 g.</li><li>RCP extracorporelle : sauvetage chez des patients sélectionnés, système organisé.</li><li>ERC 2025 : à l’hôpital, pas de règle d’arrêt seule ; EtCO₂ basse ou échographie jamais seules.</li><li>Arrêt envisageable : asystolie &gt; 20 min sans cause réversible (hors hypothermie, noyade en eau froide, intoxication) ; règles d’arrêt préhospitalières.</li><li>Ne pas arrêter une FV réfractaire sans discuter l’ECMO.</li></ul></template>

<template data-pop="pareto-i46-post" data-title="Pareto — Soins post-réanimation">
<p class="ratio" data-cover="i46-10"></p>
<ul><li>SpO₂ 94–98 % (PaO₂ 75–100 mmHg) ; PaCO₂ 35–45 mmHg ; PAM &gt; 60–65, PAS &gt; 100 mmHg.</li><li>Comateux : fièvre évitée (≤ 37,5 °C) 36–72 h ; ne pas réchauffer une hypothermie légère spontanée (TTM2 : pas de bénéfice démontré de 33 °C sur la normothermie avec traitement de la fièvre).</li><li>Crises : lévétiracétam ou valproate ; pas de prophylaxie.</li><li>ECG dès le RACS ; sus-décalage → coronarographie immédiate ; sinon différée (COACT, TOMAHAWK) sauf forte suspicion d’occlusion ; cause non coronaire → TDM tête-bassin à double phase + angiographie pulmonaire ; TDM cérébrale répétée à 72–96 h si coma et premier examen normal.</li><li>Pronostic ≥ 72 h, Glasgow moteur &lt; 6, confusions exclues ; ≥ 2 critères : pupilles/cornéens abolis, N20 absente, EEG hautement malin, NSE &gt; 60 µg/L, état de mal myoclonique, lésion anoxique diffuse.</li><li>FV/TV sans cause réversible → défibrillateur (ESC 2022, I) ; arrêt inexpliqué → bilan + famille ; suivi à 3 mois des survivants et des proches.</li></ul></template>

<template data-pop="pareto-i46-part" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="i46-11"></p>
<ul><li>Grossesse &gt; 20 semaines : déplacement manuel de l’utérus à gauche ; hystérotomie de réanimation précoce, sur place, car elle seule lève définitivement la compression aortocave (repère 4–5 min de l’ERC 2021 ; ERC 2025 : préparation immédiate, sans délai fixe).</li><li>Noyade : 5 insufflations d’abord.</li><li>Hypothermie &lt; 30 °C : une seule dose d’adrénaline de 1 mg (accumulation), sauf RCP extracorporelle imminente ; après 3 chocs, attendre &gt; 30 °C ; 30–35 °C : adrénaline /6–10 min ; ECMO veino-artérielle, score HOPE ; classification suisse clinique.</li><li>Intoxication : RCP prolongée, antidotes, lipides (anesthésiques locaux), Tox Info Suisse 145.</li><li>Anaphylaxie : adrénaline intramusculaire 0,5 mg, répéter à 5 min, remplissage ; en arrêt, algorithme standard.</li><li>Traumatisme : hémorragie, oxygène, décompression, tamponnade avant tout.</li><li>Chirurgie cardiaque récente : 3 chocs, stimulation épicardique, réouverture dans les 5 min (jusqu’à 10 jours).</li><li>Enfant : 5 insufflations, 15:2, un tiers du thorax ; 4 J/kg ; adrénaline 10 µg/kg (max 1 mg) ; amiodarone 5 mg/kg.</li></ul></template>

<template data-pop="pareto-i46-ethique" data-title="Pareto — Éthique et droit suisse">
<p class="ratio" data-cover="i46-12"></p>
<ul><li>ASSM 2021 : la réanimation exige indication + consentement (exprimé ou présumé) ; pas d’obligation de proposer une réanimation futile, mais obligation d’expliquer et de documenter.</li><li>Code civil : directives anticipées et représentant thérapeutique (art. 370 et suivants, 378).</li><li>Sans information : réanimer, sauf signes certains de mort ; arrêter dès qu’une directive valable est connue.</li><li>« Pas de réanimation » ≠ « pas de traitement ».</li><li>Proposer la présence des proches.</li><li>Don après arrêt circulatoire (Maastricht III) : décision d’arrêt des traitements d’abord et indépendante ; 5 min d’attente puis constat (ASSM 2017) ; évaluer le don chez tout réanimé qui décède.</li></ul></template>

<template data-pop="pareto-i46-bio" data-title="Pareto — Électrocardiogramme, capnographie et biologie">
<p class="ratio" data-cover="i46-e-2,i46-e-3,i46-e-4"></p>
<ul><li>Analyse du rythme en fin de cycle, &lt; 5 s ; doute FV fine/asystolie → choquer (ERC 2025) : ne pas choquer une FV coûte plus qu’un choc inutile.</li><li>AESP : QRS fins-rapides → mécanique ; larges-lents → métabolique (orientation).</li><li>Asystolie : vérifier câbles, gain, deux dérivations ; ondes P seules → stimulation.</li><li>ECG post-RACS : répéter à ≈ 8 min si décisif.</li><li>Capnographie : sonde trachéale, qualité de RCP (cible ≥ 25 mmHg), RACS ; aucun seuil isolé pour arrêter.</li><li>Gazométrie : K⁺, Hb, glucose, Ca ionisé ; veineuse plus fidèle pendant l’arrêt ; lactate : suivre la clairance.</li><li>Configurations : K⁺ haut + QRS larges (hyperkaliémie) ; K⁺ bas + torsades (hypokaliémie : chlorure de potassium 20 puis 10 mmol) ; PaCO₂ haute d’emblée (asphyxie) ; Hb basse (hémorragie) ; trou anionique et osmolalité hauts (méthanol, éthylène glycol) ; trou anionique seul (metformine).</li><li>Troponine presque toujours élevée : décision coronaire sur l’ECG et le contexte.</li></ul></template>

<template data-pop="pareto-i46-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i46-e-1,i46-e-2,i46-e-3,i46-e-4,i46-e-5,i46-e-6"></p>
<ul><li>Hiérarchie : rythme (décision de choc) → capnographie → gazométrie → échographie ciblée → ECG post-RACS et coronarographie (référence de l’occlusion) → TDM tête-bassin → pronostic multimodal (aucun examen isolé n’est de référence).</li><li>Échographie : tamponnade, hypovolémie, pneumothorax ; ventricule droit dilaté non spécifique ; pause ≤ 10 s.</li><li>Pronostic : pupilles/cornéens ≥ 72 h ; N20 ≥ 24 h ; EEG &gt; 24 h ; NSE &gt; 60 µg/L à 48–72 h (hémolyse = faux positif) ; myoclonies ≤ 72 h ; TDM 24–72 h, IRM 2–7 jours.</li><li>EEG continu et réactif, NSE basse = signes favorables.</li></ul></template>

<template data-pop="pareto-i46-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i46-sa,i46-sh,i46-sp,i46-sb,i46-sg"></p>
<ul><li>Mains au centre du thorax, moitié inférieure du sternum ; la plus grande section ventriculaire est le plus souvent sous le tiers inférieur ; électrode latérale sur la ligne axillaire moyenne (V6) ; courant à travers la masse ventriculaire.</li><li>Vulnérabilité : CA1, Purkinje, couches corticales 3-5-6, ganglions de la base ; tronc plus résistant ; nécrose laminaire ; NSE libérée.</li><li>Myocarde sidéré 24–72 h : réévaluer la FEVG à distance.</li><li>Perfusion coronaire = aorte en relâchement − oreillette droite ; chute à chaque pause.</li><li>Défibrillation : le courant (tension/impédance ≈ 70–80 ohms) dépolarise une masse critique ; biphasique.</li><li>CO₂ → débit cérébral : normocapnie.</li><li>Électrode postérieure : même hauteur, en dedans de l’omoplate gauche.</li><li>Ischémie : ATP ↓, pompe Na⁺/K⁺ arrêtée, K⁺ sort, glutamate et calcium (excitotoxicité) ; reperfusion : radicaux libres, hyperoxie délétère ; bicarbonate → CO₂ intracellulaire.</li><li>Génétique : canalopathies et cardiomyopathies ; autopsie moléculaire ; dépistage en cascade ; jamais sur un variant incertain.</li></ul></template>

<template data-pop="pareto-i46-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i46-p-1,i46-p-2,i46-p-3,i46-p-4,i46-p-5"></p>
<ul><li>Médicaments = RACS ↑, survie neurologique peu ou pas modifiée ; jamais au détriment d’une compression ou d’un choc.</li><li>Adrénaline 1 mg /3–5 min (non choquable : immédiat ; choquable : 3e choc) ; rinçage 20 mL ; PARAMEDIC2.</li><li>Amiodarone 300 puis 150 mg ; lidocaïne 100 puis 50 mg (ALPS).</li><li>Magnésium 2 g (torsades) ; chlorure de calcium 10 % 10 mL (ou gluconate 30 mL) et bicarbonate 50 mmol (hyperkaliémie, tricycliques) ; fibrinolyse (embolie, RCP 60–90 min) ; hypokaliémie : chlorure de potassium 20 mmol en 2–3 min puis 10 mmol en 2 min.</li><li>Anaphylaxie : 0,5 mg intramusculaire ; lipides 20 % selon le protocole et adrénaline ≤ 1 µg/kg (anesthésiques locaux) ; naloxone avant l’arrêt.</li><li>Post-RACS : noradrénaline (PAM &gt; 60–65 ; BOX), dobutamine ; lévétiracétam/valproate ; sédation courte.</li><li>Pas en routine : calcium (COCA), bicarbonate, corticoïdes, vasopressine, atropine, voie trachéale.</li></ul></template>
