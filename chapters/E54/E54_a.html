<template id="ch-E54"><div class="chap"><div class="chap-head"><div class="code">E 54 · Endocrinologie et métabolisme · Carences nutritionnelles</div><h1>Carence en acide ascorbique (scorbut)</h1><span class="status">Cycle Betta 40 · Revue par intelligence artificielle · Aucune validation médicale humaine · Audit différé</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la carence en vitamine C</button></div>
<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e54-0">Question clinique</a></li><li><a href="#e54-1">Définition, seuils et classification</a></li><li><a href="#e54-2">Fréquence et populations touchées</a></li><li><a href="#e54-3">Physiopathologie</a></li><li><a href="#e54-4">Causes et facteurs de risque</a></li><li><a href="#e54-5">Anamnèse</a></li><li><a href="#e54-6">Examen clinique</a></li><li><a href="#e54-7">Démarche diagnostique</a></li><li><a href="#e54-8">Urgences et complications</a></li><li><a href="#e54-9">Prise en charge</a></li><li><a href="#e54-10">Suivi, pronostic et prévention</a></li><li><a href="#e54-11">Situations particulières</a></li><li><a href="#e54-12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="e54-0"><h2><span class="n">0</span>Question clinique</h2>
<p data-evidence="E54-C0001">Dans cette <b>vignette fictive</b>, un homme de 72 ans vit seul depuis son veuvage. Il boit de l’alcool chaque jour et se nourrit surtout de pain, de pâtes et de conserves. Depuis trois mois, il est fatigué et irritable ; depuis trois semaines, ses jambes sont douloureuses et ses gencives saignent au brossage. À l’examen, vous voyez des points rouges autour des follicules pileux des cuisses, des poils enroulés en tire-bouchon et des ecchymoses des jambes. L’hémoglobine est basse, la coagulation est normale et la vitamine C plasmatique, dosée à jeun, est à 1,5 mg/L, soit environ 9 µmol/L. Ces valeurs sont pédagogiques ; elles permettent de poser les trois questions du cours.</p>
<p data-evidence="E54-C0002">La première question est celle du <b>diagnostic</b> : pourquoi un patient qui saigne avec une coagulation normale doit-il faire penser à une <button class="w" data-k="e54-collagene">fragilité du collagène (mécanisme de la fragilité capillaire)</button> ? La deuxième est celle de la <b>preuve</b> : que prouve un <button class="w" data-k="e54-dosage">dosage plasmatique (technique, seuils, limites)</button> et que ne prouve-t-il pas ? La troisième est celle de la <b>conduite</b> : quelle dose, par quelle voie, et quelles précautions imposent le rein, le fer ou le glucose-6-phosphate déshydrogénase ?</p>
<p data-evidence="E54-C0003">Le scorbut persiste chez l’adulte et passe souvent inaperçu, parce qu’il imite des maladies plus fréquentes. Dans une <button class="w" data-k="e54-adultes280">revue de 280 cas adultes publiés entre 2000 et 2025 (retard diagnostique)</button>, le retard diagnostique a conduit à des bilans auto-immuns ou hémostatiques étendus et inutiles (Rivière et al., Clinical Nutrition 2026). Chez l’enfant, 32 % des cas ont d’abord reçu un faux diagnostic, en premier lieu une leucémie ; 18 % ont subi un examen invasif, dont 11 ponctions ou biopsies médullaires (Trapani et al., Nutrients 2022). La série zurichoise de 1994 conclut que, la symptomatologie connue, le diagnostic est facile et le traitement simple et efficace.</p>
<ul><li data-evidence="E54-C0004">Reconnaître le scorbut à ses signes cutanés, gingivaux et ostéo-articulaires, et à son contexte alimentaire.</li><li data-evidence="E54-C0005">Interpréter un taux plasmatique avec ses seuils, son délai d’action et l’effet de l’inflammation.</li><li data-evidence="E54-C0006">Prescrire la vitamine C par la voie et à la dose justifiées, en connaissant ses plafonds de sécurité.</li><li data-evidence="E54-C0007">Chercher et corriger la cause : alimentation, situation sociale, psychiatrie, malabsorption.</li></ul>
<div class="key" data-evidence="E54-C0008"><b>À retenir.</b> Un saignement diffus avec une coagulation normale, chez un patient dont l’alimentation est pauvre en fruits et légumes, évoque la carence en vitamine C. Le diagnostic se pose sur le contexte, les signes et la réponse au traitement ; le dosage le confirme mais ne doit jamais retarder l’essai thérapeutique en présence de symptômes.</div>
</section>
<section class="ilot" id="e54-1"><h2><span class="n">1</span>Définition, seuils et classification</h2>
<p data-evidence="E54-C0009">La carence en vitamine C résulte d’un apport ou d’une absorption insuffisants d’acide L-ascorbique. Le <b>scorbut</b> en est l’expression clinique ; le préscorbut désigne la phase qui précède les signes francs, et la maladie de Möller-Barlow le scorbut du nourrisson. Les informations professionnelles suisses de Streuli et de Burgerstein nomment explicitement ces trois entités dans leurs indications. Dans la CIM-10-GM 2024 de l’Office fédéral de la statistique, la catégorie E54 est un code unique, sans subdivision, du bloc E50-E64 « Autres carences nutritionnelles ».</p>
<p data-evidence="E54-C0010">Aucun seuil unique ne s’impose, car les sources n’ont pas retenu les mêmes repères. Le tableau ci-dessous les juxtapose. Les <button class="w" data-k="e54-seuils">deux échelles (ESPEN et information professionnelle suisse)</button> ne se contredisent pas : la première classe un taux biologique, la seconde relie des paliers de taux à une insuffisance d’apport puis à la maladie clinique. Les valeurs en µmol/L et en mg/L se convertissent par <button class="w" data-k="e54-unites">1 mg/dL = 56,78 µmol/L (calcul de conversion)</button>.</p>
<table class="t"><thead><tr><th>Repère</th><th>ESPEN 2022 (µmol/L)</th><th>Information professionnelle suisse</th></tr></thead><tbody><tr><td data-evidence="E54-C0011">Taux habituel</td><td data-evidence="E54-C0012">≥ 23 µmol/L (valeur normale)</td><td data-evidence="E54-C0013">environ 10 mg/L (60 µmol/L)</td></tr><tr><td data-evidence="E54-C0014">Apport pas toujours suffisant</td><td data-evidence="E54-C0015">&lt; 23 µmol/L (hypovitaminose)</td><td data-evidence="E54-C0016">&lt; 6 mg/L (35 µmol/L)</td></tr><tr><td data-evidence="E54-C0017">Apport insuffisant</td><td data-evidence="E54-C0018">&lt; 11 µmol/L (carence)</td><td data-evidence="E54-C0019">&lt; 4 mg/L (20 µmol/L)</td></tr><tr><td data-evidence="E54-C0020">Scorbut clinique</td><td data-evidence="E54-C0021">non défini séparément</td><td data-evidence="E54-C0022">&lt; 2 mg/L (10 µmol/L)</td></tr></tbody></table>
<p data-evidence="E54-C0023">Ce tableau se lit ligne par ligne : une valeur de 15 µmol/L, par exemple, est une hypovitaminose pour ESPEN mais reste au-dessus du palier d’apport insuffisant de l’information suisse (20 µmol/L en dessous). Les deux seuils ESPEN d’hypovitaminose et de carence reposent sur le seul taux plasmatique, sans signe clinique. Les publications sur le scorbut retiennent des seuils variables de 2 à 3 mg/L : les expériences de Hodges, citées dans l’étude gériatrique parisienne, situent l’apparition des signes entre 1,3 et 2,4 mg/L, et Fain retient 2,5 mg/L. Cette dispersion rappelle qu’un taux est un indice et non un critère diagnostique.</p>
<p data-evidence="E54-C0024">La classification utile en pratique suit le <b>mécanisme</b>. Le tableau 13 d’ESPEN distingue quatre voies de déficit, qui orientent la recherche étiologique et la dose.</p>
<table class="t"><thead><tr><th>Mécanisme</th><th>Situations typiques</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td data-evidence="E54-C0025">Consommation accrue, recyclage diminué</td><td data-evidence="E54-C0026">inflammation, ischémie-reperfusion, traumatisme, sepsis, arrêt cardiaque, brûlures, transplantation</td><td data-evidence="E54-C0027">le taux chute vite ; l’interprétation est trompeuse en phase inflammatoire</td></tr><tr><td data-evidence="E54-C0028">Apport diminué</td><td data-evidence="E54-C0029">dénutrition, alcoolisme</td><td data-evidence="E54-C0030">l’anamnèse alimentaire est l’élément décisif</td></tr><tr><td data-evidence="E54-C0031">Absorption entérale réduite</td><td data-evidence="E54-C0032">malabsorption, chirurgie bariatrique</td><td data-evidence="E54-C0033">la voie orale peut échouer ; la dose d’entretien est plus élevée</td></tr><tr><td data-evidence="E54-C0034">Pertes accrues</td><td data-evidence="E54-C0035">épuration extrarénale, hyperfiltration glomérulaire, réabsorption tubulaire diminuée dans l’insuffisance rénale</td><td data-evidence="E54-C0036">l’apport doit compenser les pertes, avec un plafond lié à l’oxalate</td></tr></tbody></table>
<p data-evidence="E54-C0037">Les sources lues ne proposent pas de classification officielle de gravité du scorbut. Le cours distingue donc seulement le <b>taux biologique</b>, le <b>tableau clinique</b> (préscorbut, scorbut, Möller-Barlow) et le <b>mécanisme</b>, sans inventer de stades.</p>
<button class="pareto-btn ui" data-k="pareto-e54-definition">▲ Loi de Pareto — Définition et seuils</button>
</section>
<section class="ilot" id="e54-2"><h2><span class="n">2</span>Fréquence et populations touchées</h2>
<p data-evidence="E54-C0038">Il n’existe aucune donnée de prévalence suisse ou européenne représentative. Les chiffres disponibles proviennent de séries de cas, d’une étude hospitalière et d’un échantillon de volontaires ; ils décrivent des populations précises et ne se transposent pas à la population générale.</p>
<table class="t"><thead><tr><th>Population</th><th>Donnée</th><th>Limite</th></tr></thead><tbody><tr><td data-evidence="E54-C0039">Suisse, Zurich (1994)</td><td data-evidence="E54-C0040">4 cas en deux ans : deux hommes au tabagisme et à l’alcoolisme lourds, une femme de 35 ans dénutrie par phobie alimentaire, une femme de 69 ans dénutrie par démence et isolement</td><td data-evidence="E54-C0041">série de cas ; les auteurs jugent l’incidence sous-estimée</td></tr><tr><td data-evidence="E54-C0042">Suisse, Genève (2025)</td><td data-evidence="E54-C0043">une femme d’environ 58 ans, trouble alimentaire ancien, IMC de 14,7 kg/m², hypertension pulmonaire précapillaire réversible</td><td data-evidence="E54-C0044">cas unique</td></tr><tr><td data-evidence="E54-C0045">France, gériatrie aiguë</td><td data-evidence="E54-C0046">18 patients sur 145 (12 %) avec signes cliniques ; taux &lt; 2 mg/L chez 94 % d’entre eux contre 30 % des témoins ; mortalité hospitalière 44 % contre 9 %</td><td data-evidence="E54-C0047">association, non causalité démontrée</td></tr><tr><td data-evidence="E54-C0048">Allemagne, volontaires</td><td data-evidence="E54-C0049">17,4 % avec un taux &lt; 5 mg/L et 3,3 % &lt; 1,5 mg/L sur 178 participants (<button class="w" data-k="e54-allemagne">détail</button>)</td><td data-evidence="E54-C0050">échantillon non représentatif</td></tr><tr><td data-evidence="E54-C0051">Enfants, revue de vingt ans</td><td data-evidence="E54-C0052">166 enfants, âge médian 42 mois, 74 % de garçons ; 76 % avec une comorbidité, 23 % en bonne santé</td><td data-evidence="E54-C0053">publications en hausse depuis 2015</td></tr></tbody></table>
<p data-evidence="E54-C0054">Le tableau montre que le scorbut touche des profils reconnaissables. Le détail des <button class="w" data-k="e54-zurich">quatre cas zurichois</button> et du <button class="w" data-k="e54-geneve">cas genevois</button> précise le contexte. L’<button class="w" data-k="e54-geriatrie">étude gériatrique parisienne</button> chiffre l’ampleur chez la personne âgée hospitalisée, et la <button class="w" data-k="e54-enfants">revue pédiatrique</button> décrit le terrain de l’enfant : maladie neurologique (autisme, paralysie cérébrale, retard de développement, anorexie) dans 29 % des cas, maladie hématologique (surcharge en fer transfusionnelle, greffe de moelle) dans 14 % et dénutrition sévère dans 29 %.</p>
<p data-evidence="E54-C0055">Chez les patients hospitalisés, la carence cliniquement visible est rare, mais les taux chutent vite et très bas chez une part importante des patients inflammatoires ou de soins intensifs. Environ 35 % des patients opérés d’une chirurgie bariatrique présentent une déplétion chronique (ESPEN 2022). En France, le scorbut touche surtout les <button class="w" data-k="e54-precaires">sans-abri des grandes villes</button> ; à Paris, un repas enrichi en vitamine C leur est distribué. Les auteurs zurichois expliquent la sous-estimation par la disparition rapide des signes à l’hôpital, dès que l’alimentation redevient normale.</p>
<div class="key" data-evidence="E54-C0056"><b>À retenir.</b> Le scorbut n’est pas réservé aux livres d’histoire : il frappe l’alcoolique isolé, la personne âgée démente, le patient souffrant d’un trouble alimentaire ou neurodéveloppemental et la personne sans abri. L’absence de prévalence suisse représentative est une lacune des sources, non une preuve de rareté.</div>
<button class="pareto-btn ui" data-k="pareto-e54-epidemio">▲ Loi de Pareto — Fréquence</button>
</section>
<section class="ilot" id="e54-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p data-evidence="E54-C0057">L’être humain ne synthétise pas la vitamine C : il lui manque l’enzyme terminale de la voie, la gulonolactone oxydase. Son statut dépend donc strictement de l’alimentation. Le pool corporel normal est d’environ 1500 mg, renouvelé de 45 à 60 mg par jour, soit environ 3 % du pool ; la demi-vie est de 10 à 20 jours. Cette réserve explique le <b>délai</b> : les signes apparaissent après 4 à 12 semaines d’apport insuffisant (8 à 12 chez l’enfant), lorsque le <button class="w" data-k="e54-pool">pool tombe sous environ 300 mg (réserves, renouvellement et délais)</button>.</p>
<figure data-evidence="E54-C0058"><svg viewBox="0 0 380 300" role="img" aria-label="Figure 1 — Du déficit aux signes cliniques" font-size="14"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="12" width="356" height="44" rx="5"/><path d="M190 56v14m-4-5l4 5 4-5"/><rect x="12" y="70" width="356" height="44" rx="5"/><path d="M190 114v14m-4-5l4 5 4-5"/><rect x="12" y="128" width="356" height="44" rx="5"/><path d="M190 172v14m-4-5l4 5 4-5"/><rect x="12" y="186" width="356" height="44" rx="5"/><path d="M190 230v14m-4-5l4 5 4-5"/><rect x="12" y="244" width="356" height="44" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="190" y="39">Apport ou absorption insuffisants</text><text x="190" y="97">Pool corporel puis taux plasmatique en baisse</text><text x="190" y="155">Cofacteurs enzymatiques sans ascorbate</text><text x="190" y="213">Collagène, os, catécholamines, fer altérés</text><text x="190" y="271">Saignements, douleurs osseuses, anémie</text></g></svg><figcaption>Figure 1 — Du déficit aux signes cliniques. Le schéma suit la chaîne causale décrite par les sources ; il ne prédit pas le délai exact d’un patient donné.</figcaption></figure>
<p data-evidence="E54-C0059">La chaîne repose sur l’ascorbate comme donneur d’électrons. Sans lui, l’hydroxylation de la proline et de la lysine du procollagène est bloquée. Le collagène perd sa stabilité en triple hélice et ses liaisons croisées ; les parois capillaires et la membrane basale (collagène IV) deviennent fragiles. Il en résulte des pétéchies, des hémorragies périfolliculaires et gingivales, des ecchymoses, des hémarthroses et une mauvaise cicatrisation. L’atteinte prédomine aux membres inférieurs, où la pression hydrostatique s’ajoute à la fragilité capillaire. Le <button class="w" data-k="e54-collagene">mécanisme du collagène</button> explique ainsi pourquoi la coagulation est normale malgré les saignements.</p>
<p data-evidence="E54-C0060">L’<b>os</b> est touché de deux façons : la matrice ostéoïde se forme mal et la résorption augmente. Chez l’enfant, les ostéoblastes ne produisent plus de bordure ostéoïde, et des hémorragies sous-périostées causent des douleurs intenses des membres inférieurs (<button class="w" data-k="e54-os">atteinte osseuse (mécanisme et conséquences)</button>). La <b>kératine</b> est mal formée, d’où l’hyperkératose folliculaire et les poils en tire-bouchon.</p>
<p data-evidence="E54-C0061">Deux mécanismes expliquent des signes précoces, mais restent des hypothèses dans les sources. Le déficit en <button class="w" data-k="e54-carnitine">carnitine</button> pourrait expliquer l’asthénie et les myalgies ; l’altération de la synthèse des <button class="w" data-k="e54-catecholamines">catécholamines</button> expliquerait les troubles de l’humeur et du comportement. Ces liens sont présentés comme plausibles, sans preuve directe : le cours ne doit pas les enseigner comme établis.</p>
<p data-evidence="E54-C0062">L’<button class="w" data-k="e54-anemie">anémie (plurifactorielle)</button> associe des saignements, une absorption du fer diminuée, une hémolyse intravasculaire et, selon le terrain, une carence en folates ou en vitamine B12. Son type (normocytaire, microcytaire ou macrocytaire) dépend du facteur dominant, ce qui explique qu’aucun profil d’hémogramme ne soit spécifique.</p>
<p data-evidence="E54-C0063">Enfin, le déficit diminue la biodisponibilité du monoxyde d’azote endothélial et la dégradation du facteur induit par l’hypoxie HIF-1α. Il pourrait ainsi favoriser une vasoconstriction et un remodelage pulmonaires ; ces mécanismes sont plausibles, non démontrés. Une <button class="w" data-k="e54-hp">hypertension pulmonaire</button> réversible est décrite chez 3 % des enfants de la série pédiatrique et dans le cas genevois.</p>
<div class="trap" data-evidence="E54-C0064"><span class="k">Rebond</span> Un traitement prolongé de 2 à 3 g par jour peut provoquer un <button class="w" data-k="e54-rebond">scorbut de rebond à l’arrêt (mécanisme et prévention)</button>, et de fortes doses maternelles pendant la grossesse peuvent entraîner un scorbut chez le nouveau-né (information professionnelle suisse Streuli).</div>
<button class="pareto-btn ui" data-k="pareto-e54-meca">▲ Loi de Pareto — Mécanismes</button>
</section>
<section class="ilot" id="e54-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p data-evidence="E54-C0065">Le risque naît d’un apport insuffisant, d’une absorption réduite ou d’une perte accrue. Le tableau regroupe les causes par mécanisme, ce qui oriente la correction.</p>
<table class="t"><thead><tr><th>Mécanisme</th><th>Causes et facteurs de risque</th></tr></thead><tbody><tr><td data-evidence="E54-C0066">Apport insuffisant</td><td data-evidence="E54-C0067">régime pauvre en fruits et légumes ; sans-abrisme, isolement social, pauvreté ; grand âge et démence ; alcoolisme ; troubles psychiatriques (anorexie mentale, trouble de restriction ou d’évitement de l’alimentation, autisme, phobie alimentaire) ; régimes restrictifs ; enfant au régime sélectif fondé sur les glucides ; nourrisson nourri exclusivement au lait de vache</td></tr><tr><td data-evidence="E54-C0068">Malabsorption</td><td data-evidence="E54-C0069">chirurgie bariatrique, maladie de Crohn, rectocolite, maladie cœliaque, maladie de Whipple, gastrectomie, grêle court</td></tr><tr><td data-evidence="E54-C0070">Pertes ou besoins accrus</td><td data-evidence="E54-C0071">dialyse chronique ; tabagisme (renouvellement plus élevé de 40 %) ; inflammation, sepsis, chirurgie, traumatisme, brûlures ; diabète, insuffisance cardiaque, BPCO sévère ; grossesse et allaitement ; chimiothérapie et greffe de moelle ; surcharge en fer transfusionnelle (drépanocytose, thalassémie)</td></tr></tbody></table>
<p data-evidence="E54-C0072">Ce tableau doit être lu avec le terrain. Chez le patient gériatrique, le besoin d’aide pour manger était associé au scorbut (56 % contre 13 %). Le lait maternel et le lait infantile enrichi contiennent plus de vitamine C que le lait de vache, ce qui explique le risque du nourrisson nourri au seul lait de vache. La surcharge en fer accélère la dégradation de l’ascorbate : la carence du patient polytransfusé est donc un piège classique. Le <button class="w" data-k="e54-tabac">tabagisme</button>, la <button class="w" data-k="e54-bariatrique">chirurgie bariatrique</button> et la <button class="w" data-k="e54-dialyse">dialyse</button> illustrent les trois voies de déficit.</p>
<p data-evidence="E54-C0073">Certains <b>médicaments</b> modifient le statut selon l’information professionnelle suisse. L’acide acétylsalicylique inhibe le transport intestinal de la vitamine C et augmente son élimination rénale ; les barbituriques augmentent l’élimination rénale ; les tétracyclines inhibent le métabolisme intracellulaire et la réabsorption tubulaire ; les corticostéroïdes augmentent l’oxydation ; les contraceptifs oraux altèrent le statut, probablement par l’élévation de la céruloplasmine. Le détail figure dans la fenêtre sur les <button class="w" data-k="e54-medic">interactions médicamenteuses</button>.</p>
<div class="key" data-evidence="E54-C0074"><b>À retenir.</b> Devant un scorbut, la question n’est pas seulement « combien de vitamine C ? » mais « pourquoi manquait-elle ? ». La cause (isolement, alcool, trouble alimentaire, malabsorption, dialyse) détermine la durée du traitement et le risque de récidive.</div>
<button class="pareto-btn ui" data-k="pareto-e54-causes">▲ Loi de Pareto — Causes et facteurs de risque</button>
</section>
<section class="ilot" id="e54-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-evidence="E54-C0075">L’<b>anamnèse alimentaire ciblée</b> est l’élément obligatoire. Elle révèle souvent un régime sélectif d’abord méconnu ; chez l’enfant, il faut interroger les parents. Elle précise la fréquence des fruits et légumes frais, le mode de cuisson (la cuisson, le stockage et l’oxydation détruisent la vitamine), l’alcool, le tabac et le contexte social. Voir <button class="w" data-k="e54-alimentaire">comment conduire l’anamnèse alimentaire</button>.</p>
<p data-evidence="E54-C0076">Les <b>antécédents</b> à rechercher sont l’isolement, la précarité, l’alcool, le tabac, les troubles psychiatriques, la chirurgie digestive et la dialyse. Les <b>symptômes précoces</b> sont non spécifiques : <button class="w" data-k="e54-precoces">asthénie, lassitude, irritabilité, anorexie et fébricule (symptômes précoces)</button>. Les symptômes ultérieurs sont les douleurs des membres, les myalgies, les arthralgies et les saignements. Le caractère trompeur de la phase précoce explique le retard diagnostique : l’asthénie et l’irritabilité mènent d’abord vers des causes psychiatriques ou infectieuses.</p>
<div class="two"><div class="card"><h4>Forme de l’adulte</h4><p data-evidence="E54-C0077">Les signes ostéo-articulaires touchent 80 % des cas adultes. Le patient décrit des douleurs des genoux, des chevilles et des poignets, des saignements gingivaux et des ecchymoses des jambes. Le contexte alimentaire et social oriente le diagnostic.</p></div><div class="card"><h4>Forme de l’enfant</h4><p data-evidence="E54-C0078">Les douleurs des membres inférieurs sont présentes chez 88 % des enfants, le refus de marcher chez 73 % et la boiterie chez 31 %. Chez le nourrisson, une <button class="w" data-k="e54-pseudo">pseudo-paralysie</button> peut simuler une ostéomyélite ou une arthrite septique.</p></div></div>
<div class="trap" data-evidence="E54-C0079"><span class="k">Signe trompeur</span> Un indice de masse corporelle normal et une croissance normale n’excluent pas le diagnostic chez l’enfant : un régime sélectif fondé sur les glucides peut couvrir l’énergie sans couvrir la vitamine C (revue pédiatrique, 2022).</div>
<div class="key" data-evidence="E54-C0080"><b>À retenir.</b> L’anamnèse alimentaire est l’examen le plus rentable. Quand la maladie est évoquée, un interrogatoire de deux minutes sur les fruits et légumes remplace des bilans coûteux.</div>
</section>
<section class="ilot" id="e54-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-evidence="E54-C0081">L’examen suit l’ordre habituel : état général, peau, bouche, appareil locomoteur, puis signes généraux. Chaque signe renvoie à un mécanisme ; reconnaître le mécanisme évite de multiplier les bilans.</p>
<div class="two"><div class="card"><h4>Peau et phanères</h4><p data-evidence="E54-C0082"><button class="w" data-k="e54-peau">Hyperkératose folliculaire et hémorragies périfolliculaires</button>, poils en tire-bouchon, cheveux secs et cassants, pétéchies et ecchymoses surtout aux membres inférieurs, peau sèche et squameuse, retard de cicatrisation. L’œdème peut être « ligneux ». Le purpura, parfois palpable, et les ecchymoses étendues peuvent simuler une vasculite. Les hémorragies en flammèche sous-unguéales et la koïlonychie sont décrites. Les saignements aux points de ponction veineuse servent de critère clinique dans l’étude gériatrique.</p></div><div class="card"><h4>Bouche</h4><p data-evidence="E54-C0083"><button class="w" data-k="e54-gencive">Gencives tuméfiées, spongieuses et violacées</button>, qui saignent au moindre contact ; dents mobiles et chute dentaire. Chez l’enfant, la gingivorragie est présente dans 43 % des cas et l’hypertrophie gingivale dans 27 %. Les signes buccaux révèlent souvent la maladie chez l’enfant neuro-atypique, et le dentiste peut faire le diagnostic.</p></div></div>
<div class="two"><div class="card"><h4>Appareil locomoteur</h4><p data-evidence="E54-C0084">80 % des cas adultes ont des <button class="w" data-k="e54-osteo">signes ostéo-articulaires</button> : arthralgies des genoux, des chevilles et des poignets, myalgies, hémarthroses et hématomes musculaires. Une vraie synovite est rare, alors que l’hémarthrose spontanée est fréquente.</p></div><div class="card"><h4>Signes généraux et autres</h4><p data-evidence="E54-C0085">Œdèmes, dyspnée, exophtalmie et anémie. La série zurichoise décrit aussi un syndrome sec, des hémorragies rétiniennes, un hématome sous-dural et des hémorragies digestives. Les sources évoquent une hypotension et des morts subites. Devant une dyspnée et des œdèmes chez un patient dénutri, il faut évoquer une <button class="w" data-k="e54-hp">hypertension pulmonaire</button>.</p></div></div>
<div class="trap" data-evidence="E54-C0086"><span class="k">Piège</span> Ne pas confondre hémorragie périfolliculaire et purpura vasculaire. Le premier siège autour du follicule, surtout aux jambes, et s’accompagne d’une hyperkératose ; le second, parfois palpable, évoque une vasculite et conduit, à tort, à un bilan auto-immun étendu.</div>
<div class="key" data-evidence="E54-C0087"><b>À retenir.</b> Les quatre signes cliniques utilisés comme définition opérationnelle dans l’étude gériatrique sont l’hyperkératose périfolliculaire, les pétéchies ou ecchymoses, l’hémorragie au point de ponction veineuse et la gingivite sévère.</div>
