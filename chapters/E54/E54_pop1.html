<template data-pop="e54-seuils" data-title="Seuils de vitamine C plasmatique">
<div class="lab">Définition</div><p data-evidence="E54-C0352">ESPEN 2022 classe un taux plasmatique ≥ 23 µmol/L comme normal, un taux &lt; 23 µmol/L comme hypovitaminose C et un taux &lt; 11 µmol/L comme carence. Ces deux derniers seuils reposent sur le seul taux plasmatique, sans signe clinique. Les informations professionnelles suisses fixent un taux habituel d’environ 10 mg/L (60 µmol/L), un apport pas toujours suffisant sous 6 mg/L (35 µmol/L), insuffisant sous 4 mg/L (20 µmol/L) et un scorbut clinique sous 2 mg/L (10 µmol/L).</p>
<div class="lab">Application</div><p data-evidence="E54-C0353">Le médecin convertit d’abord les unités, puis compare le taux au contexte. Un taux de 1,5 mg/L (environ 9 µmol/L) est inférieur aux deux seuils de carence ; un taux de 15 µmol/L est une hypovitaminose pour ESPEN, sans atteindre les paliers cliniques suisses.</p>
<div class="lab">Dispersion des seuils</div><p data-evidence="E54-C0354">Les seuils publiés du scorbut varient de 2 à 3 mg/L. Les expériences de Hodges, citées par l’étude gériatrique parisienne, situent l’apparition des signes entre 1,3 et 2,4 mg/L ; Fain retient 2,5 mg/L ; l’étude parisienne a utilisé &lt; 5 mg/L pour la déplétion et &lt; 2 mg/L pour la carence. La revue pédiatrique place les manifestations sous 0,2 mg/dL (2 mg/L) avec un pool corporel sous 300 mg.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0355">Le taux plasmatique reflète surtout l’apport récent, baisse avec l’inflammation et se normalise après une prise récente. Il ne fonde donc pas seul le diagnostic.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20617280/" target="_blank" rel="noopener">Raynaud-Simon et al., scorbut du sujet âgé hospitalisé, Journal of Nutrition, Health and Aging 2010</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15797491/" target="_blank" rel="noopener">Fain, manifestations musculo-squelettiques du scorbut, Joint Bone Spine 2005</a>.</p></template>
<template data-pop="e54-unites" data-title="Conversion des unités">
<div class="lab">Définition</div><p data-evidence="E54-C0356">Selon ESPEN, 1 mg/dL = 56,78 µmol/L. On en déduit 1 mg/L ≈ 5,7 µmol/L.</p>
<div class="lab">Calculs</div><p data-evidence="E54-C0357">2 mg/L × 5,7 ≈ 11 µmol/L, valeur du seuil de carence d’ESPEN. 10 mg/L × 5,7 ≈ 57 µmol/L, proche du taux habituel de 60 µmol/L de l’information suisse. 14 mg/L × 5,7 ≈ 80 µmol/L, à comparer au seuil rénal indiqué à 85 µmol/L.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0358">Dans le document d’ESPEN, les seuils s’affichent en « mmol/L » ; le contexte montre qu’il s’agit de µmol/L. Les conversions sont arrondies : les sources suisses donnent elles-mêmes 6 mg/L pour 35 µmol/L.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025.</p></template>
<template data-pop="e54-zurich" data-title="Série zurichoise (1994)">
<div class="lab">Série</div><p data-evidence="E54-C0359">Hürlimann et Salomon rapportent quatre cas en deux ans à l’hôpital universitaire de Zurich : deux hommes avec tabagisme et alcoolisme lourds, une femme de 35 ans dénutrie par phobie alimentaire et une femme de 69 ans dénutrie par démence et isolement social. On trouvait aussi un syndrome sec, des hémorragies rétiniennes, un hématome sous-dural et des hémorragies digestives. Des carences en folates et en B12 étaient présentes chez deux patients sur quatre.</p>
<div class="lab">Message</div><p data-evidence="E54-C0360">Les auteurs jugent l’incidence réelle sous-estimée, car les signes disparaissent vite à l’hôpital grâce à l’alimentation normale. Ils concluent que, la symptomatologie connue, le diagnostic est facile et le traitement simple et efficace.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0361">Série de quatre cas ; source disponible en résumé seulement.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/8091164/" target="_blank" rel="noopener">Hürlimann et Salomon, Skorbut (Zurich), Schweizerische Medizinische Wochenschrift 1994</a>.</p></template>
<template data-pop="e54-geneve" data-title="Cas genevois (2025)">
<div class="lab">Cas</div><p data-evidence="E54-C0362">Berra et al. décrivent une femme d’environ 58 ans avec un trouble alimentaire ancien, un IMC de 14,7 kg/m² et une hypertension pulmonaire précapillaire réversible. Des carences en B1, zinc et sélénium étaient associées.</p>
<div class="lab">Évolution</div><p data-evidence="E54-C0363">L’hypertension pulmonaire s’est normalisée en une semaine sous traitement oral.</p>
<div class="lab">Mécanisme</div><p data-evidence="E54-C0364">La carence diminue la biodisponibilité du monoxyde d’azote et la dégradation de HIF-1α ; elle pourrait favoriser une vasoconstriction et un remodelage pulmonaires. Ces mécanismes sont plausibles, non démontrés. La carence en B1 donne plutôt une hypertension pulmonaire à haut débit.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41360493/" target="_blank" rel="noopener">Berra et al., hypertension pulmonaire réversible et scorbut (Genève), BMJ Case Reports 2025</a>.</p></template>
<template data-pop="e54-geriatrie" data-title="Étude gériatrique parisienne">
<div class="lab">Résultats</div><p data-evidence="E54-C0365">Sur 145 patients gériatriques consécutifs, 18 (12 %) présentaient des signes cliniques de scorbut. 94 % d’entre eux avaient un taux &lt; 2 mg/L contre 30 % des témoins. La mortalité hospitalière était de 44 % contre 9 %. Le besoin d’aide pour manger était associé au scorbut (56 % contre 13 %).</p>
<div class="lab">Définition opérationnelle</div><p data-evidence="E54-C0366">Au moins un signe parmi l’hyperkératose périfolliculaire, les pétéchies ou ecchymoses, l’hémorragie au point de ponction veineuse et la gingivite sévère. Le traitement était de 1 g par jour par voie orale en prises fractionnées pendant 15 jours, avec des aliments riches en vitamine C.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0367">Association et non causalité. L’étude reste significative après exclusion des CRP > 50 mg/L.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20617280/" target="_blank" rel="noopener">Raynaud-Simon et al., scorbut du sujet âgé hospitalisé, Journal of Nutrition, Health and Aging 2010</a>.</p></template>
<template data-pop="e54-enfants" data-title="Série pédiatrique de vingt ans">
<div class="lab">Résultats</div><p data-evidence="E54-C0368">La revue de Trapani et al. décrit 166 enfants : âge médian 42 mois, 74 % de garçons. 76 % avaient une comorbidité (maladie neurologique 29 %, maladie hématologique 14 %, dénutrition sévère 29 %) et 23 % étaient en bonne santé. 32 % ont d’abord reçu un faux diagnostic, 18 % un examen invasif.</p>
<div class="lab">Clinique</div><p data-evidence="E54-C0369">Douleurs des membres inférieurs (88 %), refus de marcher (73 %), boiterie (31 %), gingivorragie (43 %), hypertrophie gingivale (27 %). Anémie dans 46 % des cas ; guérison complète dans 76 % des cas en 1 à 11 mois.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0370">Revue narrative ; pas de prévalence européenne pédiatrique récente.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a>.</p></template>
<template data-pop="e54-dach" data-title="Valeurs de référence D-A-CH">
<div class="lab">Définition</div><p data-evidence="E54-C0371">Les valeurs D-A-CH sont les valeurs de référence communes des sociétés de nutrition allemande, autrichienne et suisse, utilisées en Suisse. Chez l’adulte : 110 mg par jour chez l’homme et 95 mg chez la femme. Grossesse dès le 4e mois : 105 mg ; allaitement : 125 mg ; fumeurs : 155 mg (homme) et 135 mg (femme), car le renouvellement est plus élevé de 40 %. Enfants de 1 à moins de 15 ans : 20 à 85 mg ; adolescents : 105 mg (garçon) et 90 mg (fille) ; nourrissons : 20 mg.</p>
<div class="lab">Dérivation</div><p data-evidence="E54-C0372">Elles visent un taux plasmatique à jeun de 50 µmol/L, avec des pertes de 50 mg par jour, une absorption de 80 % et une excrétion urinaire de 25 % ; le besoin moyen calculé de l’homme est de 91 mg par jour. ESPEN indique un apport de référence de 90 à 100 mg par jour chez le sujet sain, pour un taux de 60 à 100 µmol/L.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0373">Valeurs de nutrition préventive, non thérapeutiques. Les valeurs américaines ne sont pas utilisées.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26227083/" target="_blank" rel="noopener">Valeurs de référence D-A-CH pour la vitamine C (DGE, ÖGE, SGE), Annals of Nutrition and Metabolism 2015</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a>.</p></template>
<template data-pop="e54-collagene" data-title="Collagène et fragilité capillaire">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0374">Sans ascorbate, la prolyl- et la lysyl-hydroxylase du procollagène ne fonctionnent plus. Le collagène perd sa stabilité en triple hélice et ses liaisons croisées. Les parois capillaires et la membrane basale (collagène IV) deviennent fragiles.</p>
<div class="lab">Conséquence</div><p data-evidence="E54-C0375">Pétéchies, hémorragies périfolliculaires et gingivales, ecchymoses, hémarthroses et mauvaise cicatrisation. L’atteinte prédomine aux membres inférieurs, où la pression hydrostatique s’ajoute à la fragilité.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0376">La coagulation est normale : un saignement avec hémostase normale évoque une fragilité de paroi et conduit à doser la vitamine C et à interroger l’alimentation.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-os" data-title="Atteinte osseuse">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0377">La matrice ostéoïde se forme mal et la résorption osseuse augmente. Chez l’enfant, les ostéoblastes ne produisent plus de bordure ostéoïde.</p>
<div class="lab">Conséquence</div><p data-evidence="E54-C0378">Des hémorragies sous-périostées causent des douleurs intenses des membres inférieurs ; 80 % des cas adultes ont des signes ostéo-articulaires. Les signes radiologiques apparaissent après 3 à 6 mois de carence.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0379">Un enfant qui refuse de marcher avec une alimentation sélective relève d’un dosage et d’une imagerie avant tout geste invasif.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15797491/" target="_blank" rel="noopener">Fain, manifestations musculo-squelettiques du scorbut, Joint Bone Spine 2005</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-carnitine" data-title="Carnitine : hypothèse">
<div class="lab">Hypothèse</div><p data-evidence="E54-C0380">Le déficit en carnitine pourrait expliquer l’asthénie et les myalgies précoces. La vitamine C joue un rôle dans la synthèse de la carnitine.</p>
<div class="lab">Statut</div><p data-evidence="E54-C0381">La revue pédiatrique présente ce lien comme une hypothèse (« may be responsible ») ; le cours ne l’enseigne pas comme établi.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-catecholamines" data-title="Catécholamines : hypothèse">
<div class="lab">Mécanisme probable</div><p data-evidence="E54-C0382">La vitamine C est cofacteur de la dopamine-β-hydroxylase, qui produit la noradrénaline. Une synthèse altérée expliquerait les troubles de l’humeur et du comportement.</p>
<div class="lab">Statut</div><p data-evidence="E54-C0383">Ce mécanisme est présenté comme probable, sans preuve directe.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-anemie" data-title="Anémie du scorbut">
<div class="lab">Mécanismes</div><p data-evidence="E54-C0384">Saignements : anémie normocytaire, ou microcytaire si une carence martiale s’installe. Absorption du fer diminuée : anémie microcytaire. Hémolyse intravasculaire. Carence associée en folates ou en B12 : anémie macrocytaire. L’information suisse attribue l’anémie macrocytaire du scorbut au déficit en acide tétrahydrofolique.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0385">L’hémogramme ne suffit pas à identifier la cause ; on cherche les carences associées et on traite la vitamine C.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-hp" data-title="Hypertension pulmonaire">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0386">Le déficit diminue la biodisponibilité du monoxyde d’azote endothélial et la dégradation de HIF-1α. Il pourrait favoriser une vasoconstriction et un remodelage pulmonaires ; ces mécanismes sont plausibles, non démontrés.</p>
<div class="lab">Clinique</div><p data-evidence="E54-C0387">Une hypertension pulmonaire réversible est décrite chez 3 % des enfants de la série pédiatrique et dans le cas genevois. Il faut l’évoquer devant une dyspnée et des œdèmes chez un patient dénutri.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0388">Rechercher une carence en vitamine C devant une hypertension pulmonaire inexpliquée chez un patient dénutri ; la carence en B1 donne plutôt une hypertension à haut débit.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41360493/" target="_blank" rel="noopener">Berra et al., hypertension pulmonaire réversible et scorbut (Genève), BMJ Case Reports 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40437614/" target="_blank" rel="noopener">Toscano et al., série pédiatrique de scorbut, Italian Journal of Pediatrics 2025</a>.</p></template>
<template data-pop="e54-pool" data-title="Pool, renouvellement et délais">
<div class="lab">Valeurs</div><p data-evidence="E54-C0389">Le pool corporel est d’environ 1500 mg. Le renouvellement quotidien est de 45 à 60 mg, environ 3 % du pool ; la demi-vie est de 10 à 20 jours. Les manifestations apparaissent lorsque le pool passe sous environ 300 mg.</p>
<div class="lab">Délais</div><p data-evidence="E54-C0390">Les signes apparaissent après 4 à 12 semaines d’apport insuffisant (8 à 12 chez l’enfant) ; les lésions cutanées vers 5 mois de régime carencé ; les signes radiologiques après 3 à 6 mois. Les symptômes non spécifiques apparaissent sous 20 µmol/L et les signes spécifiques sous 11,4 µmol/L.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0391">Un apport insuffisant depuis moins de quatre semaines ne suffit pas à expliquer un scorbut constitué.</p>
<p class="src">Références : Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-rebond" data-title="Scorbut de rebond">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0392">Un traitement prolongé de 2 à 3 g par jour peut provoquer un scorbut à l’arrêt ; chez le nouveau-né, de fortes doses maternelles pendant la grossesse peuvent entraîner un scorbut.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0393">Éviter l’arrêt brutal après des doses élevées prolongées ; ne pas dépasser les doses recommandées pendant la grossesse.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023.</p></template>
<template data-pop="e54-tabac" data-title="Tabagisme">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0394">Le renouvellement de la vitamine C est plus élevé de 40 % chez le fumeur. Les valeurs D-A-CH sont donc majorées : 155 mg par jour chez l’homme et 135 mg chez la femme.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0395">Le tabagisme compte parmi les facteurs de risque, et ESPEN le cite parmi les situations de stress oxydatif chronique à 500 mg par jour.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26227083/" target="_blank" rel="noopener">Valeurs de référence D-A-CH pour la vitamine C (DGE, ÖGE, SGE), Annals of Nutrition and Metabolism 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8091164/" target="_blank" rel="noopener">Hürlimann et Salomon, Skorbut (Zurich), Schweizerische Medizinische Wochenschrift 1994</a>.</p></template>
<template data-pop="e54-bariatrique" data-title="Chirurgie bariatrique">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0396">L’absorption entérale est réduite. Environ 35 % des patients opérés présentent une déplétion chronique.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0397">200 à 500 mg par jour peuvent être nécessaires (recommandation 23.6 d’ESPEN, point de bonne pratique).</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a>.</p></template>
<template data-pop="e54-dialyse" data-title="Dialyse chronique">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0398">L’épuration extrarénale, l’hyperfiltration glomérulaire ou la réabsorption tubulaire diminuée augmentent les pertes.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0399">L’oxalate, métabolite de la vitamine C, s’accumule : l’information suisse limite la dose à 50 à 100 mg par jour en insuffisance rénale sévère ou sous dialyse.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a>.</p></template>
<template data-pop="e54-medic" data-title="Médicaments qui modifient le statut">
<div class="lab">Interactions (information suisse Streuli)</div><ul><li data-evidence="E54-C0400">Acide acétylsalicylique : inhibe le transport intestinal de la vitamine C et augmente son élimination rénale.</li><li data-evidence="E54-C0401">Barbituriques : augmentent l’élimination rénale.</li><li data-evidence="E54-C0402">Tétracyclines : inhibent le métabolisme intracellulaire et la réabsorption tubulaire.</li><li data-evidence="E54-C0403">Corticostéroïdes : augmentent l’oxydation.</li><li data-evidence="E54-C0404">Contraceptifs oraux : altèrent le statut, probablement par l’élévation de la céruloplasmine.</li></ul>
<div class="lab">Décision</div><p data-evidence="E54-C0405">Chez un patient sous un de ces médicaments avec une alimentation pauvre, le seuil d’alerte est abaissé.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025.</p></template>
<template data-pop="e54-alimentaire" data-title="Anamnèse alimentaire">
<div class="lab">Principe</div><p data-evidence="E54-C0406">Elle est obligatoire et révèle souvent un régime sélectif d’abord méconnu ; chez l’enfant, on interroge les parents.</p>
<div class="lab">Questions utiles</div><p data-evidence="E54-C0407">Fréquence de fruits et légumes frais, mode de cuisson, alcool, tabac, isolement, aide pour manger. Environ 90 % des apports viennent des fruits et légumes ; la cuisson, le stockage et l’oxydation détruisent la vitamine.</p>
<div class="lab">Piège</div><p data-evidence="E54-C0408">Un indice de masse corporelle normal et une croissance normale n’excluent pas le diagnostic.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-precoces" data-title="Symptômes précoces">
<div class="lab">Définition</div><p data-evidence="E54-C0409">Asthénie, lassitude, irritabilité, anorexie et fébricule.</p>
<div class="lab">Mécanisme possible</div><p data-evidence="E54-C0410">Le déficit en carnitine et la synthèse altérée de catécholamines sont des hypothèses explicatives.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0411">Chez un patient à risque alimentaire, ces symptômes justifient la recherche des signes cutanés et gingivaux.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-pseudo" data-title="Pseudo-paralysie">
<div class="lab">Définition</div><p data-evidence="E54-C0412">Chez le nourrisson, la douleur osseuse sous-périostée empêche le mouvement du membre et peut simuler une ostéomyélite ou une arthrite septique.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0413">Rechercher les signes gingivaux, l’alimentation et les signes radiologiques avant un geste invasif.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32247222/" target="_blank" rel="noopener">Schwetje et al., scorbut infantile, Nutrition 2020</a>.</p></template>
<template data-pop="e54-peau" data-title="Signes cutanés">
<div class="lab">Signes</div><p data-evidence="E54-C0414">Hyperkératose folliculaire et hémorragies périfolliculaires, poils en tire-bouchon, cheveux secs, pétéchies et ecchymoses aux membres inférieurs, peau sèche et squameuse, retard de cicatrisation, œdème « ligneux », purpura parfois palpable, hémorragies en flammèche sous-unguéales, koïlonychie.</p>
<div class="lab">Mécanisme</div><p data-evidence="E54-C0415">Collagène capillaire fragile, kératine altérée.</p>
<div class="lab">Piège</div><p data-evidence="E54-C0416">Le purpura palpable et les ecchymoses étendues peuvent simuler une vasculite.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-gencive" data-title="Signes gingivaux">
<div class="lab">Signes</div><p data-evidence="E54-C0417">Gencives tuméfiées, spongieuses et violacées, saignant au moindre contact ; dents mobiles et chute dentaire.</p>
<div class="lab">Fréquence</div><p data-evidence="E54-C0418">Chez l’enfant, gingivorragie dans 43 % des cas et hypertrophie gingivale dans 27 %.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0419">Les signes buccaux révèlent souvent la maladie de l’enfant neuro-atypique ; le dentiste peut faire le diagnostic.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-osteo" data-title="Signes ostéo-articulaires">
<div class="lab">Fréquence</div><p data-evidence="E54-C0420">80 % des cas adultes.</p>
<div class="lab">Signes</div><p data-evidence="E54-C0421">Arthralgies des genoux, des chevilles et des poignets, myalgies, hémarthroses et hématomes musculaires. Une vraie synovite est rare ; l’hémarthrose spontanée est fréquente.</p>
<div class="lab">Piège</div><p data-evidence="E54-C0422">Ils peuvent faire penser à une maladie rhumatologique.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15797491/" target="_blank" rel="noopener">Fain, manifestations musculo-squelettiques du scorbut, Joint Bone Spine 2005</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
