<p>Une numération très anormale peut annoncer plusieurs maladies dont le traitement diffère profondément. Une leucémie myéloïde aiguë perturbe la différenciation et la production sanguine efficace ; une leucémie myéloïde chronique <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> positive conserve souvent une maturation granulocytaire importante en phase chronique. Une masse de blastes myéloïdes peut, elle, apparaître hors de la moelle. Le premier travail consiste à reconnaître la présentation, rechercher une urgence et obtenir les preuves qui identifient la maladie.</p>
<p>La famille C92 réunit ces situations dans la CIM-10-GM. Elle comprend les formes aiguës, la <button class="w" data-k="c92-bcr-abl">LMC</button> <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> positive, l’ancienne « <button class="w" data-k="c92-bcr-abl">LMC</button> atypique » <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> négative, le sarcome myéloïde, la leucémie promyélocytaire et des formes particulières ou non précisées. Les mots du catalogue ne remplacent pas la classification biologique actuelle. Ainsi, une <button class="w" data-k="c92-classification">LAM</button> myélomonocytaire n’est pas une leucémie myélomonocytaire chronique, et une dysplasie visible ne suffit plus à classer une <button class="w" data-k="c92-classification">LAM</button> comme myélodysplasie-associée.</p>
<table class="t"><thead><tr><th>Sous-catégorie <button class="w" data-k="c92-classification">OFS</button>, CIM-10-GM 2024</th><th>Libellé français et portée clinique</th></tr></thead><tbody><tr><td>C92.0</td><td>Leucémie myéloblastique aiguë [<button class="w" data-k="c92-classification">LMA</button>] : préciser ensuite l’entité biologique et ses caractéristiques.</td></tr><tr><td>C92.1</td><td>Leucémie myéloïde chronique, BCR/ABL positive : démonstration de la fusion et caractérisation de la phase.</td></tr><tr><td>C92.2</td><td>Leucémie myéloïde chronique atypique, BCR/ABL négative : libellé historique à relier aux critères modernes de MDS/MPN avec neutrophilie.</td></tr><tr><td>C92.3</td><td>Sarcome myéloïde : masse tissulaire à caractériser et bilan systémique, même sans blastes circulants.</td></tr><tr><td>C92.4</td><td>Leucémie promyélocytaire aiguë : urgence de coagulation et confirmation de <button class="w" data-k="c92-differenciation">PML::RARA</button>.</td></tr><tr><td>C92.5</td><td>Leucémie myélomonocytaire aiguë : ne pas confondre avec la leucémie myélomonocytaire chronique codée C93.1.</td></tr><tr><td>C92.6</td><td>Leucémie myéloïde aiguë avec anomalie 11q23 : caractériser le remaniement et la classification biologique, sans réduire la génétique moderne au seul libellé de code.</td></tr><tr><td>C92.7</td><td>Autres leucémies myéloïdes : catégorie résiduelle, pas protocole thérapeutique unique.</td></tr><tr><td>C92.8</td><td>Leucémie myéloïde aiguë avec dysplasie multilinéaire : ancien libellé administratif, sans équivalence automatique avec toute <button class="w" data-k="c92-classification">LAM</button> liée à la myélodysplasie selon <button class="w" data-k="c92-classification">OMS</button>/<button class="w" data-k="c92-classification">ICC</button> actuelles.</td></tr><tr><td>C92.9</td><td>Leucémie myéloïde, sans précision : conserver l’incertitude et compléter une caractérisation réalisable.</td></tr></tbody></table>
<p>Dans ces sous-catégories, le cinquième caractère <b>0</b> signifie « sans mention de rémission complète » et <b>1</b> « en rémission complète ». Par exemple, C92.00 et C92.01 ne décrivent pas deux lignées différentes. Ne pas importer un cinquième caractère de rechute issu de l’ICD-10-CM américaine. Le statut clinique documenté, la version de codage applicable et les règles suisses en vigueur restent à vérifier ; cette leçon ne certifie pas une facturation individuelle.</p>
<p>Trois questions guident toute la leçon : <b>la personne est-elle menacée maintenant ; quelle lignée et quelle anomalie définissent le clone ; quel résultat modifiera réellement la conduite ?</b> L’interrogatoire et l’examen commencent immédiatement. La morphologie, l’immunophénotype, la cytogénétique et la biologie moléculaire se complètent ensuite ; aucun de ces étages ne doit être remplacé par une impression isolée au frottis.</p>
<div class="alert"><b>Point de décision.</b> Des saignements avec un frottis évocateur de leucémie promyélocytaire imposent une prise en charge spécialisée immédiate. La confirmation génétique est urgente, mais son attente ne doit pas retarder l’<button class="w" data-k="c92-differenciation">ATRA</button> et le soutien de la coagulation sous responsabilité hématologique.</div>
<p>À l’examen fédéral, partir de la présentation : anomalie leucocytaire, anémie, thrombopénie, coagulation perturbée ou résultat cytologique inhabituel. Les situations <button class="w" data-k="c92-profiles">PROFILES</button> 152, 154, 159, 165 et 174 soutiennent ce raisonnement ; elles ne constituent pas une promesse de question sur un sous-code. <button class="w" data-k="c92-profiles">Objectifs et limites du référentiel</button> · <button class="w" data-k="c92-classification">Comprendre les classifications</button></p>

<section class="ilot" id="c92-2"><h2><span class="n">2</span> Épidémiologie, terrain et facteurs de risque</h2>
<p>Les fréquences doivent être rattachées à la maladie réellement étudiée. Le rapport suisse <button class="w" data-k="c92-classification">OFS</button> consulté regroupe des leucémies C91–C95 : ce total n’est ni une incidence de C92 seul, ni une fréquence de chaque forme myéloïde. Les sources retenues ne permettent pas ici de donner une incidence suisse actuelle et précise de chacun des sous-types. Cette limite évite une fausse exactitude.</p>
<p>Pour la <button class="w" data-k="c92-classification">LAM</button>, Onkopedia rapporte environ 3,7 nouveaux cas pour 100 000 habitants par an dans son contexte de référence et une forte augmentation avec l’âge ; un registre suédois adulte situe l’âge médian à 72 ans. Ce sont des repères européens, pas des chiffres nationaux suisses. Une médiane décrit une population : elle n’exclut pas une <button class="w" data-k="c92-classification">LAM</button> chez un adulte jeune ou un enfant. Les néoplasies MDS/MPN avec neutrophilie et les sarcomes myéloïdes sont rares ; leurs séries sont petites et sélectionnées.</p>
<p>L’âge avancé, certains antécédents de syndrome myélodysplasique, des expositions cytotoxiques et l’hématopoïèse clonale participent au risque de <button class="w" data-k="c92-classification">LAM</button>. Rechercher radiothérapie, chimiothérapie, exposition au benzène et tabagisme, sans attribuer une causalité individuelle sur la seule présence d’un facteur. Une maladie survenue après traitement cytotoxique doit être caractérisée génétiquement et qualifiée par son contexte : l’étiquette « secondaire » ne dispense pas de chercher une cible ou une prédisposition.</p>
<p>La plupart des anomalies présentes dans les cellules leucémiques sont acquises. Une histoire familiale, plusieurs cancers personnels, des cytopénies antérieures ou certains résultats, notamment DDX41, peuvent conduire à une évaluation germinale. La distinction importe aussi pour choisir un donneur apparenté : un variant délétère partagé ne doit pas être ignoré. Un variant trouvé dans le sang tumoral ne prouve pas à lui seul une transmission héréditaire.</p>
<div class="key"><b>À retenir.</b> Ne pas confondre risque de développer une maladie, classification pronostique au diagnostic et risque de rechute après traitement. Ces trois questions utilisent des populations et des paramètres différents.</div>

<section class="ilot" id="c92-3"><h2><span class="n">3</span> Du fonctionnement normal au clone pathologique</h2>
<p>La moelle maintient une production réglée de cellules sanguines. Les progéniteurs prolifèrent puis mûrissent ; les cellules deviennent capables d’assurer des fonctions différentes. Les neutrophiles participent à la défense anti-infectieuse, les hématies au transport de l’oxygène, et les plaquettes à l’hémostase primaire. Le nombre de cellules et leur efficacité fonctionnelle sont deux dimensions distinctes.</p>
<p>Dans une <button class="w" data-k="c92-classification">LAM</button>, un clone myéloïde anormal se développe avec un défaut variable de différenciation. L’espace médullaire et les interactions qui soutiennent l’hématopoïèse normale sont perturbés. Une anémie explique une partie de la fatigue ou de la dyspnée ; une thrombopénie favorise le saignement ; une neutropénie ou une défense inefficace expose aux infections. Une leucocytose élevée ne signifie donc pas que l’immunité est performante.</p>
<p>Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, la fusion <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> produit une tyrosine kinase anormalement active. En phase chronique, la production granulocytaire augmente avec une maturation encore présente. Les inhibiteurs de tyrosine kinase réduisent le signal de croissance ; ils ne sont pas interchangeables avec un traitement de toute leucocytose. La progression vers une phase blastique correspond à une maladie plus complexe que la simple persistance d’un chiffre élevé.</p>
<p>La <button class="w" data-k="c92-differenciation">LPA</button> illustre un autre mécanisme : <button class="w" data-k="c92-differenciation">PML::RARA</button> perturbe le programme de différenciation. L’<button class="w" data-k="c92-differenciation">ATRA</button> agit sur ce blocage ; le trioxyde d’arsenic intervient sur la protéine de fusion par une autre voie. Le traitement peut restaurer une différenciation, mais cette modification rapide peut aussi provoquer un syndrome inflammatoire grave. Comprendre le mécanisme permet de surveiller simultanément l’efficacité et la toxicité.</p>

<section class="ilot" id="c92-4"><h2><span class="n">4</span> Démarche initiale : sécuriser avant de préciser</h2>
<p>Une suspicion de leucémie aiguë conduit à une évaluation hématologique urgente. Mesurer les constantes, rechercher un saignement, une infection, une atteinte respiratoire ou neurologique et apprécier la perfusion. Prélever rapidement l’hémogramme avec formule et frottis, les paramètres de coagulation et le bilan de lyse. Les prélèvements utiles au diagnostic doivent être organisés sans retarder les gestes indispensables.</p>
<p>La leucostase est un syndrome clinique : dyspnée, hypoxie, troubles neurologiques ou autres atteintes d’organes dans un contexte compatible. Une hyperleucocytose supérieure à 100 G/L constitue un repère de risque dans la <button class="w" data-k="c92-classification">LAM</button>, mais l’absence de ce chiffre ne suffit pas à exclure une leucostase. La cytoréduction et le traitement spécifique relèvent immédiatement du centre spécialisé. La leucaphérèse n’est pas une réponse automatique à une valeur élevée asymptomatique ; elle est particulièrement évitée dans la <button class="w" data-k="c92-differenciation">LPA</button> coagulopathique.</p>
<p>Une fièvre chez une personne neutropénique ou présentant une infection sévère impose prélèvements adaptés et traitement anti-infectieux rapide selon les protocoles locaux. Des signes inflammatoires peuvent être discrets. La présence d’une leucémie ne permet pas d’expliquer une fièvre sans chercher une infection. À l’inverse, un syndrome de différenciation peut coexister avec une infection : les deux hypothèses doivent rester ouvertes.</p>
<p>Chez une personne stable, attendre les résultats génétiques rapidement disponibles peut améliorer le choix de l’induction. Cette attente est une décision surveillée, pas une règle absolue : coagulopathie menaçante, leucostase, lyse ou dégradation clinique changent la priorité. Documenter précisément ce qui est connu, ce qui manque et le délai de réévaluation.</p>
<div class="alert"><b>Point de décision.</b> <button class="w" data-k="c92-differenciation">LPA</button> suspectée, leucostase, hémorragie majeure, lyse tumorale, sepsis et syndrome de différenciation sont des urgences distinctes. Chacune demande une action immédiate adaptée ; aucune n’est traitée par la simple normalisation d’un chiffre.</div>

<section class="ilot" id="c92-5"><h2><span class="n">5</span> Anamnèse : reconstruire la trajectoire</h2>
<p>Préciser le début et la vitesse d’évolution : fatigue récente, gêne à l’effort, infections répétées, ecchymoses spontanées, saignements muqueux ou règles inhabituellement abondantes. Rechercher dyspnée de repos, céphalée nouvelle, trouble visuel, confusion ou déficit focal. Un symptôme ancien stable et un symptôme brutal n’ont pas la même valeur d’alarme.</p>
<p>Une <button class="w" data-k="c92-bcr-abl">LMC</button> peut rester silencieuse pendant des mois et être découverte sur une numération. Fatigue, perte pondérale et sueurs nocturnes sont possibles mais peu spécifiques. Demander retentissement sur les activités, satiété inhabituelle ou gêne abdominale, sans conclure à une splénomégalie sur le seul récit. Une masse, une douleur osseuse localisée, une atteinte cutanée ou des symptômes ORL persistants peuvent orienter vers une manifestation extramédullaire qui nécessite sa propre preuve.</p>
<p>Recueillir les numérations antérieures et les résultats médullaires disponibles. Un antécédent de myélodysplasie, de néoplasie myéloproliférative ou de traitement anticancéreux modifie l’interprétation. Dresser la liste complète des médicaments, automédications et produits végétaux : les interactions <button class="w" data-k="c92-interactions">CYP3A</button> deviennent particulièrement importantes avec plusieurs thérapies ciblées. Le millepertuis ne doit pas être oublié.</p>
<p>Le terrain guide aussi la faisabilité du traitement : fonction cardiaque, pulmonaire, rénale et hépatique ; infections ; autonomie ; cognition ; soutien à domicile ; projet parental. L’âge civil seul ne résume pas l’aptitude à une thérapie intensive ou à une greffe. Les préférences de la personne, la charge du suivi et les objectifs de soins doivent être discutés avec une information compréhensible.</p>
<p>Chez une personne déjà traitée pour <button class="w" data-k="c92-bcr-abl">LMC</button>, demander les prises réellement effectuées, les interruptions, la tolérance, les repas et les médicaments ajoutés. Une remontée moléculaire peut traduire plusieurs situations ; attribuer immédiatement le résultat à une mutation résistante ferait perdre des informations essentielles.</p>

<section class="ilot" id="c92-6" data-semiology-clinical="C92"><h2><span class="n">6</span> Examen clinique : décrire le signe et son mécanisme</h2>
<p>L’examen commence par la gravité : état de conscience, fréquence respiratoire, saturation, pression artérielle, pouls, température et signes de mauvaise perfusion. Une hypoxie ou un trouble neurologique dans une leucémie hyperleucocytaire exige une évaluation urgente ; la même manifestation peut aussi provenir d’une infection, d’une hémorragie ou d’une autre complication. Le contexte oriente, mais ne suffit pas à prouver le mécanisme.</p>
<p>Rechercher pâleur, pétéchies, ecchymoses et saignements muqueux. La pâleur n’est pas un dosage d’hémoglobine. Une thrombopénie peut contribuer au saignement, tandis qu’une coagulopathie, notamment dans la <button class="w" data-k="c92-differenciation">LPA</button>, ajoute un mécanisme distinct. Examiner la bouche et les gencives : infection, ulcération et infiltration ne se déduisent pas du même signe. L’hypertrophie gingivale peut accompagner une différenciation monocytique ou myélomonocytaire.</p>
<p>Palper les aires ganglionnaires et apprécier foie et rate. Une rate augmentée peut participer au tableau d’une <button class="w" data-k="c92-bcr-abl">LMC</button>, mais n’est pas spécifique de <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button>. Noter localisation, volume clinique et sensibilité ; l’évolution sous traitement peut être informative. Examiner les lésions cutanées ou masses avec précision : nombre, taille, couleur, douleur, évolution et signes compressifs. Une biopsie peut devenir nécessaire pour distinguer infiltration myéloïde, infection et autre tumeur.</p>
<p>Rechercher un foyer infectieux selon les symptômes et le risque : poumons, peau, bouche et région périnéale par examen adapté. Une neutropénie peut atténuer les signes habituels. L’examen neurologique est orienté par la plainte et recherche une atteinte focale ou diffuse ; une ponction lombaire n’est pas un examen réflexe à effectuer pendant une coagulopathie promyélocytaire.</p>
<p>Consigner les résultats négatifs utiles et les limites. Une absence de splénomégalie ou de saignement visible n’exclut pas une leucémie. Les sources retenues ne fournissent pas de sensibilité universelle permettant de transformer ces signes en test de dépistage autonome.</p>
<div class="key"><b>À retenir.</b> Signe → mécanisme possible → examen discriminant → décision. La valeur sémiologique se construit avec la chronologie et la biologie ; un signe isolé ne nomme pas le clone.</div>

<section class="ilot" id="c92-7"><h2><span class="n">7</span> Reconnaître les grands tableaux myéloïdes</h2>
<p><b>Le tableau aigu.</b> Cytopénies, blastes et symptômes d’insuffisance médullaire orientent vers une leucémie aiguë. La leucocytose peut être importante, normale ou basse : le chiffre total ne suffit pas à exclure la maladie. Les formes myélomonocytaires et certaines <button class="w" data-k="c92-classification">LAM</button> avec réarrangement KMT2A peuvent présenter des manifestations extramédullaires ; leur classification exige les examens intégrés.</p>
<p><b>Le tableau promyélocytaire.</b> Une coagulopathie associée à une morphologie suspecte doit faire évoquer la <button class="w" data-k="c92-differenciation">LPA</button>. La forme hypogranulaire peut être moins évidente au premier regard. Des corps d’Auer sont un indice myéloïde, mais leur présence n’est pas une preuve autonome de <button class="w" data-k="c92-differenciation">PML::RARA</button>, et leur absence visible n’exclut pas la maladie.</p>
<figure id="c92-main-apl" data-origin="human-original"><img src="assets/img/c92/alpha/codex/apl-hypogranular.jpg" alt="Frottis sanguin humain de LPA hypogranulaire montrant deux cellules anormales et des hématies" loading="lazy"><figcaption><b>Une <button class="w" data-k="c92-differenciation">LPA</button> peut être peu granuleuse.</b> <b>Repère 1, grande cellule à gauche :</b> noyau irrégulier, avec repli du contour. <b>Repère 2, cellule au centre droit :</b> autre noyau irrégulier et cytoplasme périphérique. <b>Repère 3, cytoplasme bleu :</b> les grosses granulations typiques ne sont pas évidentes dans ce champ. <b>Repère 4, disques rosés autour :</b> hématies servant de contexte visuel, sans étalonnage de taille. La provenance indique une <button class="w" data-k="c92-differenciation">LPA</button> hypogranulaire, coloration de Wright. Aucun corps d’Auer n’est affirmé ici ; la photographie seule ne démontre pas <button class="w" data-k="c92-differenciation">PML::RARA</button>. Original : Mikael Häggström, 29 novembre 2022, <a href="https://commons.wikimedia.org/wiki/File:Peripheral_blood_smear_of_acute_promyelocytic_leukemia,_hypogranular_variant,_source_image_(1).jpg" target="_blank" rel="noopener">provenance</a>, <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0 1.0</a>. Pixels intacts ; repères français ajoutés à la légende.</figcaption></figure>
<p><b>Le tableau chronique <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> positif.</b> Une prolifération granulocytaire avec déviation à gauche conduit à rechercher la fusion. La <button class="w" data-k="c92-bcr-abl">LMC</button> se distingue d’une réaction à une infection, d’une autre néoplasie myéloproliférative et du MDS/MPN avec neutrophilie. Le frottis aide à poser la question ; il ne remplace pas la réponse moléculaire.</p>
<p><b>Le tableau dysplasique et prolifératif <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> négatif.</b> Le MDS/MPN avec neutrophilie associe prolifération et dysgranulopoïèse, avec des critères d’exclusion précis. Un test <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> négatif ne suffit pas à poser ce diagnostic, surtout si la technique ne couvre pas un transcrit atypique.</p>
<p><b>Le tableau extramédullaire.</b> Le sarcome myéloïde est une masse tissulaire de blastes myéloïdes. Il peut accompagner une maladie médullaire, précéder sa détection ou correspondre à une rechute. Une numération rassurante ne dispense pas du bilan médullaire et de la caractérisation du tissu.</p>
<p>Les catégories résiduelles « autres » ou « non précisées » servent à décrire l’information disponible ; elles n’autorisent pas à ignorer une caractérisation réalisable. Le traitement suit la maladie établie, le terrain et ses cibles, pas le seul degré de précision du code.</p>
