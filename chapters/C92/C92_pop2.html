<template data-pop="c92-immunophenotype" data-title="Immunophénotype : un panel plutôt qu’un marqueur magique">
<p>La cytométrie décrit l’expression de marqueurs sur les populations cellulaires. Elle contribue à l’attribution de lignée et à la caractérisation du clone. Des expressions aberrantes ou des marqueurs absents peuvent compliquer une interprétation isolée.</p>
<p>Le panel doit être confronté à morphologie et génétique. Dans un tissu, l’immunohistochimie du sarcome myéloïde utilise plusieurs marqueurs, dont l’expression peut varier. Un profil diagnostic peut aussi contribuer au suivi, avec des exigences analytiques spécifiques ; il n’est pas automatiquement un test <button class="w" data-k="c92-mrd">MRD</button> validé.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a>.</p></div></template>
<template data-pop="c92-moelle" data-title="Aspiration et biopsie : des informations complémentaires">
<p>L’aspiration fournit des cellules pour cytologie, cytométrie et analyses génétiques. La biopsie conserve l’architecture et aide notamment quand l’aspiration est pauvre ou impossible. Une ponction blanche ne signifie pas une moelle indemne.</p>
<p>Prévenir le laboratoire, répartir le matériel et évaluer l’hémodilution améliorent l’interprétation. Pour <button class="w" data-k="c92-mrd">MRD</button>, la qualité du prélèvement influence la sensibilité réelle. Un résultat négatif dans un échantillon inadéquat ne porte pas la même conclusion qu’un prélèvement de qualité documentée.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a>.</p></div></template>
<template data-pop="c92-mrd" data-title="MRD : mesurable ne signifie pas omniscient">
<p>La maladie résiduelle mesurable recherche un signal sous le seuil de la morphologie habituelle. Méthode, marqueur, matériel, sensibilité et date de traitement conditionnent sa signification. Une négativité ne prouve pas l’éradication de toute cellule leucémique.</p>
<p>Les mutations DNMT3A, TET2 et ASXL1 peuvent refléter une hématopoïèse clonale persistante ; elles ne doivent pas être assimilées sans nuance à tous les marqueurs leucémiques. La cinétique d’un marqueur approprié peut guider consolidation ou surveillance, dans le cadre de la maladie et du traitement concernés.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="c92-reponse" data-title="Réponse : trois dimensions à nommer">
<p>Dans la <button class="w" data-k="c92-classification">LAM</button>, la morphologie, la récupération hématologique et la <button class="w" data-k="c92-mrd">MRD</button> décrivent des dimensions distinctes. La CR associe notamment moins de 5 % de blastes médullaires, absence de maladie extramédullaire/blastes circulants, neutrophiles ≥ 1 G/L et plaquettes ≥ 100 G/L.</p>
<p>CRh décrit une récupération partielle définie ; CRi une récupération incomplète selon les critères <button class="w" data-k="c92-sources">ELN</button>. La catégorie employée doit être explicite pour éviter de compter deux fois la même réponse. En <button class="w" data-k="c92-bcr-abl">LMC</button>, réponse hématologique et réponse moléculaire ont également des profondeurs différentes.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="c92-sources" data-title="Sources : dates, lecture et désaccords conservés">
<p>La priorité documentaire est suisse lorsque la question concerne codage, produit ou cadre national, complétée par les recommandations européennes et les sources biologiques pertinentes. Chaque référence conserve son niveau de lecture : section ciblée, résumé ou réutilisation attribuée d’une lecture antérieure.</p>
<p>Les changements de classification, les divergences <button class="w" data-k="c92-fi">FI</button>/recommandations et les unités douteuses ne sont pas effacés. La <button class="w" data-k="c92-fi">FI</button> française de Vyxeos présente par exemple une unité de bilirubine incohérente dans l’extraction consultée : aucun seuil numérique n’est repris de mémoire. Une entrée bibliographique n’est pas une preuve de lecture intégrale.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S501] CIM-10-GM 2024 français, catégories C92</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11515/Doehner_H.etal_Blood2024.GeneticriskclassificationforadultswithAMLreceivingless-intensivetherapies-the2024ELNrecommendations.pdf" target="_blank" rel="noopener">[S504] ELN 2024 Less-Intensive genetic risk classification</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680680140017" target="_blank" rel="noopener">[S541] Vyxeos liposomal / daunorubicine–cytarabine</a>.</p></div></template>
<template data-pop="c92-strategie" data-title="Stratégie : maladie, personne et objectif">
<p>La décision combine entité, risque, mutations, état fonctionnel, organes, souhaits et possibilités de suivi. Une induction intensive, une association moins intensive, un <button class="w" data-k="c92-bcr-abl">TKI</button> ou une stratégie de support répondent à des situations différentes.</p>
<p>Préciser l’objectif : urgence vitale, rémission, prévention de rechute, contrôle durable ou confort. Une cible moléculaire ouvre une discussion mais ne suffit pas à choisir la dose ou l’association. Les classifications de risque doivent correspondre au traitement envisagé.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11515/Doehner_H.etal_Blood2024.GeneticriskclassificationforadultswithAMLreceivingless-intensivetherapies-the2024ELNrecommendations.pdf" target="_blank" rel="noopener">[S504] ELN 2024 Less-Intensive genetic risk classification</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></template>
<template data-pop="c92-suivi" data-title="Suivi : quoi mesurer, quand et pour agir comment">
<p>La surveillance dépend de l’entité, du traitement, de la profondeur de réponse et du marqueur disponible. Numération, toxicités, qualité de vie et mesure moléculaire ne sont pas interchangeables. Le calendrier doit annoncer quelle anomalie déclenchera une nouvelle évaluation.</p>
<p>Une PCR <button class="w" data-k="c92-differenciation">PML::RARA</button> après consolidation ne signifie pas qu’un suivi moléculaire identique est nécessaire indéfiniment pour tous les schémas de <button class="w" data-k="c92-differenciation">LPA</button>. En <button class="w" data-k="c92-bcr-abl">LMC</button>, même après arrêt surveillé du <button class="w" data-k="c92-bcr-abl">TKI</button>, le suivi moléculaire reste durable. Les recommandations et populations exactes accompagnent chaque rythme.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="c92-tfr" data-title="Arrêt surveillé du TKI : une décision sélectionnée">
<p>Selon l’<button class="w" data-k="c92-sources">ELN</button> 2025, l’arrêt se discute notamment en première phase chronique, avec patient motivé, accès rapide à une PCR de qualité, traitement suffisamment long et réponse moléculaire profonde durable. Les critères minimaux incluent généralement plus de cinq ans de <button class="w" data-k="c92-bcr-abl">TKI</button>, ou plus de quatre ans avec certains <button class="w" data-k="c92-bcr-abl">TKI</button> de deuxième génération, et <button class="w" data-k="c92-cml-is">MR4</button> depuis plus de deux ans ; d’autres conditions restent nécessaires.</p>
<p>Après arrêt : PCR toutes les 6–8 semaines les six premiers mois, tous les deux mois jusqu’à un an, puis tous les 3–6 mois. La perte de <button class="w" data-k="c92-cml-is">MMR</button> conduit à reprendre le traitement, sans attendre une seconde confirmation qui retarderait la reprise. L’arrêt n’est ni une guérison prouvée ni une option autonome.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="c92-jalons" data-title="Jalons LMC : un seuil se lit dans une trajectoire">
<p>L’<button class="w" data-k="c92-sources">ELN</button> 2025 utilise notamment <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> IS ≤ 10 % à trois mois, ≤ 1 % à six mois et ≤ 0,1 % à douze mois comme jalons favorables. Une valeur au-dessus d’un seuil exige contexte, confirmation et analyse de la cinétique selon le moment.</p>
<p>À trois mois, un résultat > 10 % doit être confirmé dans les 1–3 mois avant certaines conclusions. Observance, interactions, tolérance, contrôles analytiques et mutations éventuelles participent à la décision. Changer de <button class="w" data-k="c92-bcr-abl">TKI</button> sur un chiffre isolé sans cette analyse peut être inapproprié.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="c92-cml-is" data-title="Échelle internationale : lire la profondeur de réponse">
<p><button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> IS exprime le résultat sur une échelle internationale pour les transcrits usuels. <button class="w" data-k="c92-cml-is">MMR</button> correspond à ≤ 0,1 %, <button class="w" data-k="c92-cml-is">MR4</button> à ≤ 0,01 % et <button class="w" data-k="c92-cml-is">MR4,5</button> à ≤ 0,0032 %. Ces seuils exigent une qualité et une quantité suffisantes de transcrits de contrôle.</p>
<p>« Indétectable » avec un contrôle insuffisant ne prouve pas une réponse très profonde. Certains transcrits atypiques nécessitent une stratégie personnalisée. La durée d’une réponse compte aussi : une mesure profonde unique ne suffit pas à autoriser un arrêt surveillé du traitement.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="c92-flt3" data-title="FLT3 : mutation et indication sont liées au contexte">
<p>ITD et mutations du domaine tyrosine kinase sont des catégories d’altérations <button class="w" data-k="c92-flt3">FLT3</button>. Midostaurine, quizartinib et giltéritinib ont des indications et schémas différents : première ligne <button class="w" data-k="c92-flt3">FLT3</button> mutée, première ligne <button class="w" data-k="c92-flt3">FLT3</button>-ITD ou rechute/réfractaire selon le produit.</p>
<p>Le statut à la rechute peut devoir être réévalué. Le <button class="w" data-k="c92-interactions">QT</button>, les interactions et les phases d’induction, consolidation ou entretien modifient la prescription. La <button class="w" data-k="c92-fi">FI</button> suisse de quizartinib ne l’indique pas en entretien après allogreffe ; une recommandation européenne plus large doit être signalée comme telle.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680663100014" target="_blank" rel="noopener">[S514] Rydapt / midostaurine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680672110011" target="_blank" rel="noopener">[S518] Xospata / giltéritinib</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a>.</p></div></template>
<template data-pop="c92-formulation" data-title="Formulation : une partie de l’identité du traitement">
<p>Vyxeos combine daunorubicine et cytarabine dans une formulation liposomale à rapport fixe. Ses doses et jours d’administration ne sont pas interchangeables avec les deux molécules libres. Les deux quantités doivent être explicites pour éviter une erreur de préparation.</p>
<p>De même, azacitidine injectable et orale ne sont pas des substitutions automatiques. Nom, formulation, voie, dose, unité et calendrier doivent être vérifiés ensemble. Une conversion arithmétique correcte peut rester pharmacologiquement incorrecte si la formulation change.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680680140017" target="_blank" rel="noopener">[S541] Vyxeos liposomal / daunorubicine–cytarabine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680683400019" target="_blank" rel="noopener">[S540] Daunoblastin / daunorubicine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680548450142" target="_blank" rel="noopener">[S539] Cytosar Solution / cytarabine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680573800011" target="_blank" rel="noopener">[S515] Vidaza / azacitidine injectable</a>.</p></div></template>
<template data-pop="pareto-c92-cours" data-title="C92 en cinq décisions"><ol><li>Nommer l’entité moderne sans confondre code, <button class="w" data-k="c92-classification">OMS</button> et <button class="w" data-k="c92-classification">ICC</button>.</li><li>Reconnaître les urgences, notamment <button class="w" data-k="c92-differenciation">LPA</button> et leucostase symptomatique.</li><li>Combiner morphologie, immunophénotype et génétique.</li><li>Adapter stratégie et risque à la personne et au traitement.</li><li>Suivre réponse, toxicités et qualité de vie avec des méthodes explicites.</li></ol><p>Cette synthèse aide au rappel ; les conditions, exceptions et sources restent dans la leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S501] CIM-10-GM 2024 français, catégories C92</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></template>
<template data-pop="pareto-c92-examens" data-title="Examens qui changent la décision"><ol><li>Numération et frottis décrivent quantité et morphologie.</li><li>Moelle et tissu répondent à des questions complémentaires.</li><li>Génétique : classification, cible et risque sont distincts.</li><li>Coagulation, rein et électrolytes identifient des urgences.</li><li><button class="w" data-k="c92-mrd">MRD</button> et réponse exigent un prélèvement et une méthode de qualité.</li></ol><p>Cette synthèse aide au rappel ; les conditions, exceptions et sources restent dans la leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a>.</p></div></template>
<template data-pop="pareto-c92-pharma" data-title="Prescrire dans le bon contexte"><ol><li>Indication suisse datée et protocole spécialisé.</li><li>Formulation, dose, voie et jours vérifiés ensemble.</li><li>Interactions revues à chaque changement.</li><li><button class="w" data-k="c92-interactions">QT</button>, lyse, aplasie et différenciation surveillés selon produit.</li><li>Autorisation et remboursement ne sont pas synonymes.</li></ol><p>Cette synthèse aide au rappel ; les conditions, exceptions et sources restent dans la leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S520] FI suisse Venclyxto</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680684410017" target="_blank" rel="noopener">[S512] Scemblix / asciminib</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S535] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S536] OFSP, cas particuliers, art. 71a–d OAMal</a>.</p></div></template>
<template data-pop="pareto-c92-semio" data-title="Partir de la fonction et de la gravité"><ol><li>Transport, défense et hémostase peuvent être déficients ensemble.</li><li>Chronologie et paramètres vitaux précèdent l’étiquette.</li><li>Une numération totale ne décrit pas la fonction.</li><li>Plusieurs mécanismes peuvent coexister.</li><li>Une urgence se traite en parallèle du bilan.</li></ol><p>Cette synthèse aide au rappel ; les conditions, exceptions et sources restent dans la leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></template>
<template data-pop="pareto-c92-anat" data-title="Trois compartiments"><ol><li>Moelle : production et architecture.</li><li>Sang : cellules circulantes et nombres absolus.</li><li>Tissu : infiltration ou masse extramédullaire.</li><li>Biopsie et aspiration ne sont pas redondantes.</li><li>Contrôle local et systémique se discutent séparément.</li></ol><p>Cette synthèse aide au rappel ; les conditions, exceptions et sources restent dans la leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S525] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a>.</p></div></template>
<template data-pop="pareto-c92-histo" data-title="Regarder sans inventer"><ol><li>Décrire noyau, cytoplasme et maturation.</li><li>Auer oriente la lignée sans prouver <button class="w" data-k="c92-differenciation">PML::RARA</button>.</li><li>Une <button class="w" data-k="c92-differenciation">LPA</button> peut être hypogranulaire.</li><li>Un champ ne vaut pas un décompte représentatif.</li><li>Morphologie, immunophénotype et génétique se confrontent.</li></ol><p>Cette synthèse aide au rappel ; les conditions, exceptions et sources restent dans la leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="pareto-c92-physio" data-title="Nombre et fonction"><ol><li>Le clone peut augmenter une population et réduire les lignées normales.</li><li>Leucocytose ne signifie pas défense efficace.</li><li><button class="w" data-k="c92-differenciation">LPA</button> : coagulopathie au-delà de la thrombopénie.</li><li>Réponse hématologique et moléculaire ont des profondeurs différentes.</li><li>Support et traitement du clone ont des objectifs complémentaires.</li></ol><p>Cette synthèse aide au rappel ; les conditions, exceptions et sources restent dans la leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-4-leukocytes-and-platelets" target="_blank" rel="noopener">[S526] 18.4 Leukocytes and Platelets  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="pareto-c92-bio" data-title="Mécanisme et sécurité"><ol><li>Kinase, différenciation et apoptose sont des cibles distinctes.</li><li>Lyse rapide impose prévention et contrôles après dose.</li><li>Différenciation peut s’accompagner d’une urgence.</li><li>Interactions et seuils <button class="w" data-k="c92-interactions">QT</button> sont propres au produit.</li><li>Plausibilité biologique ne suffit pas à créer une indication.</li></ol><p>Cette synthèse aide au rappel ; les conditions, exceptions et sources restent dans la leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S520] FI suisse Venclyxto</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680684410017" target="_blank" rel="noopener">[S512] Scemblix / asciminib</a>.</p></div></template>
<template data-pop="pareto-c92-gen" data-title="Donner un sens au résultat"><ol><li>Préciser méthode, matériel et sensibilité.</li><li>Nommer la classification et sa version.</li><li>Adapter le risque au traitement.</li><li>Distinguer clone tumoral, hématopoïèse clonale et germinal.</li><li><button class="w" data-k="c92-mrd">MRD</button> négative ne prouve pas une éradication certaine.</li></ol><p>Cette synthèse aide au rappel ; les conditions, exceptions et sources restent dans la leçon.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11515/Doehner_H.etal_Blood2024.GeneticriskclassificationforadultswithAMLreceivingless-intensivetherapies-the2024ELNrecommendations.pdf" target="_blank" rel="noopener">[S504] ELN 2024 Less-Intensive genetic risk classification</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
