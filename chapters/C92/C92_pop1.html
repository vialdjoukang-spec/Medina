<template data-pop="c92-classification" data-title="C92, OMS et ICC : trois plans à ne pas confondre">
<p>C92 est une famille de codage CIM-10-GM, comprenant plusieurs maladies myéloïdes. L’<button class="w" data-k="c92-classification">OMS</button> et l’<button class="w" data-k="c92-classification">ICC</button> sont des classifications biologiques utilisant morphologie, clinique et génétique. Un même intitulé historique de code peut donc recouvrir une entité dont le nom moderne a changé.</p>
<p>Dans la <button class="w" data-k="c92-classification">LAM</button>, le seuil de blastes dépend de l’entité et de la classification. Ne pas transformer « 20 % » en règle sans exception, ni conclure que toute mutation suffit à abaisser ce seuil. Documenter classification, matériel et anomalie. C92.5 désigne une leucémie aiguë myélomonocytaire ; la leucémie myélomonocytaire chronique relève de C93.1.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">[S501] CIM-10-GM 2024 français, catégories C92</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a>.</p></div></template>
<template data-pop="c92-clonalite" data-title="Clonalité : une origine commune ne donne pas toute la réponse">
<p>Un clone regroupe des cellules issues d’une cellule ancestrale portant des caractéristiques communes. Une anomalie clonale peut aider à reconnaître une néoplasie, mais toute hématopoïèse clonale n’est pas une leucémie aiguë. Les mutations doivent être interprétées avec cytopénies, morphologie, proportion de blastes et critères de l’entité.</p>
<p>Après traitement, certaines mutations associées à l’hématopoïèse clonale peuvent persister sans avoir le même sens qu’un marqueur leucémique spécifique. La question « existe-t-il un clone ? » diffère de « quelle maladie ? » et de « quelle maladie résiduelle ? ».</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a>.</p></div></template>
<template data-pop="c92-differenciation" data-title="Différenciation : une maturation utile peut s’accompagner d’une urgence">
<p>La différenciation transforme un précurseur en cellule plus mature. Dans la <button class="w" data-k="c92-differenciation">LPA</button>, <button class="w" data-k="c92-differenciation">PML::RARA</button> perturbe ce processus ; <button class="w" data-k="c92-differenciation">ATRA</button> et <button class="w" data-k="c92-differenciation">ATO</button> agissent sur cette biologie. Une réponse par différenciation n’est pas synonyme d’absence de risque immédiat.</p>
<p>Fièvre, dyspnée, prise de poids, œdèmes, hypotension ou atteinte rénale peuvent évoquer un syndrome de différenciation. Le traitement urgent et la gestion des médicaments suivent le produit/protocole ; infection et surcharge restent des diagnostics possibles ou associés. Les critères de suspension ne sont pas identiques pour <button class="w" data-k="c92-differenciation">ATO</button>, ivosidenib et giltéritinib.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680690770013" target="_blank" rel="noopener">[S516] Tibsovo / ivosidenib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680672110011" target="_blank" rel="noopener">[S518] Xospata / giltéritinib</a>.</p></div></template>
<template data-pop="c92-epidemiologie" data-title="Épidémiologie : conserver la population du chiffre">
<p>Une incidence de <button class="w" data-k="c92-classification">LAM</button> dans une population européenne ne devient pas une incidence suisse de toutes les maladies C92. Les statistiques suisses regroupant les leucémies C91–C95 ne fournissent pas directement la fréquence de chaque sous-type de C92.</p>
<p>De même, un âge médian observé dans un registre ne fixe ni l’âge du diagnostic individuel ni l’éligibilité à un traitement. Pour les entités rares, les séries sélectionnées et les changements de classification limitent les comparaisons. Cette leçon indique les données disponibles et leur périmètre plutôt que fabriquer un taux national spécifique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/19305697/master" target="_blank" rel="noopener">[S537] Le cancer en Suisse, rapport 2021, leucémies</a> ; <a data-reference-source="1" href="https://www.mll.com/en/myelodysplastic-myeloproliferative-neoplasm-mds-mpn/myelodysplastic-myeloproliferative-neoplasm-with-neutrophilia-mds-mpn-n" target="_blank" rel="noopener">[S508] MDS/MPN with neutrophilia: diagnostics and prognosis</a>.</p></div></template>
<template data-pop="c92-germinal" data-title="Prédisposition germinale et choix du donneur">
<p>Une variante germinale est présente au-delà du clone tumoral. Une analyse du sang atteint ne permet pas toujours de distinguer prédisposition constitutionnelle et mutation acquise. L’histoire familiale, les caractéristiques cliniques et un test dans un tissu approprié peuvent orienter une évaluation spécialisée.</p>
<p>L’enjeu dépasse le diagnostic : conseil familial, suivi et choix d’un donneur apparenté peuvent changer. Un donneur portant une prédisposition pertinente doit être identifié par la démarche adaptée ; un panel tumoral isolé ne remplace pas cette évaluation.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a>.</p></div></template>
<template data-pop="c92-grossesse" data-title="Grossesse, fertilité et projet parental">
<p>Le projet parental doit être discuté tôt avec hématologie et équipes concernées. Urgence de la maladie, terme, traitement, profondeur de réponse et parent exposé modifient la décision. Les recommandations européennes et les <button class="w" data-k="c92-fi">FI</button> suisses doivent être confrontées au cas concret.</p>
<p>Un arrêt spontané du <button class="w" data-k="c92-bcr-abl">TKI</button> n’est pas une stratégie sûre. Les délais de contraception diffèrent selon produit et sexe ; ils ne se déduisent pas d’une durée unique pour toute la classe. La fertilité, les possibilités de préservation et l’allaitement nécessitent une discussion séparée, sans retarder indûment une urgence vitale.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527750195" target="_blank" rel="noopener">[S521] FI suisse Vesanoid</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680684410017" target="_blank" rel="noopener">[S512] Scemblix / asciminib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680663100014" target="_blank" rel="noopener">[S514] Rydapt / midostaurine</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680672110011" target="_blank" rel="noopener">[S518] Xospata / giltéritinib</a>.</p></div></template>
<template data-pop="c92-interactions" data-title="Interactions : vérifier le produit, la phase et la dose">
<p>Les inhibiteurs du <button class="w" data-k="c92-interactions">CYP3A</button> peuvent augmenter l’exposition de certains traitements. La réponse réglementaire varie : réduction de dose pour vénétoclax ou ivosidenib dans les situations décrites, adaptations spécifiques pour quizartinib, prudence sans réduction initiale automatique pour tous les cas d’asciminib.</p>
<p>Vérifier aussi les substrats concernés, les médicaments allongeant le <button class="w" data-k="c92-interactions">QT</button>, les électrolytes, les compléments et le millepertuis. Un tableau de réduction pour toxicité ne se substitue pas au tableau d’interaction. Refaire cette vérification à chaque changement de prescription.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S520] FI suisse Venclyxto</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680690770013" target="_blank" rel="noopener">[S516] Tibsovo / ivosidenib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680684410017" target="_blank" rel="noopener">[S512] Scemblix / asciminib</a>.</p></div></template>
<template data-pop="c92-lyse" data-title="Lyse tumorale : la cinétique explique la surveillance">
<p>La destruction de nombreuses cellules libère potassium, phosphate et précurseurs de l’urate. L’atteinte rénale peut aggraver les désordres ; des complications cardiaques ou neurologiques peuvent apparaître. Le risque dépend du clone, de la charge tumorale, du rein et du traitement.</p>
<p>Prévention de l’hyperuricémie, hydratation adaptée et contrôles biologiques après les doses sont organisés avant exposition. Sous vénétoclax, la <button class="w" data-k="c92-fi">FI</button> prévoit des prélèvements rapprochés lors de l’escalade. Sous rasburicase, la préanalyse de l’urate est essentielle car l’enzyme peut continuer à agir dans le tube.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S520] FI suisse Venclyxto</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">[S522] FI suisse Fasturtec</a>.</p></div></template>
<template data-pop="c92-myelopoiese" data-title="Myélopoïèse : production et fonction sont distinctes">
<p>La moelle organise production et maturation des lignées myéloïdes. Une prolifération clonale peut augmenter le nombre de certaines cellules tout en réduisant la production normale. Une leucocytose peut donc coexister avec anémie, thrombopénie et défense inefficace.</p>
<p>La formule sanguine, la morphologie et la moelle renseignent des dimensions différentes. Dans la <button class="w" data-k="c92-bcr-abl">LMC</button>, la maturation est relativement conservée ; dans de nombreuses <button class="w" data-k="c92-classification">LAM</button>, le défaut de différenciation est plus marqué. Ces repères expliquent des tableaux, sans remplacer les critères biologiques de classification.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S525] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-4-leukocytes-and-platelets" target="_blank" rel="noopener">[S526] 18.4 Leukocytes and Platelets  - Anatomy and Physiology 2e | OpenStax</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="c92-neutropenie" data-title="Neutropénie fébrile : reconnaître l’urgence">
<p>Une fièvre chez une personne neutropénique exige une évaluation urgente. L’immunodépression peut atténuer certains signes locaux ; l’absence de pus ou de réaction inflammatoire spectaculaire ne rassure pas à elle seule.</p>
<p>Stabilité, foyer, prélèvements, antibiotiques antérieurs, colonisations, allergies et fonction rénale guident le protocole empirique local. Ne pas retarder l’antibiothérapie nécessaire pour attendre toute l’identification microbiologique. La stratégie infectieuse doit aussi être conciliée avec les interactions des traitements antileucémiques.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/prise-en-chargede-la-neutropenie-febrile" target="_blank" rel="noopener">[S524] Prise en chargede la neutropénie fébrile</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662350021" target="_blank" rel="noopener">[S520] FI suisse Venclyxto</a>.</p></div></template>
<template data-pop="c92-observance" data-title="Observance : une variable clinique à explorer sans jugement">
<p>Une hausse de <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> peut refléter une résistance, mais aussi des prises manquées, un effet indésirable, une interaction ou une difficulté d’accès au traitement. Interroger les horaires, repas, effets ressentis et contraintes quotidiennes aide à comprendre le résultat.</p>
<p>Une valeur isolée ne suffit pas toujours à changer de <button class="w" data-k="c92-bcr-abl">TKI</button>. Confirmer la cinétique et la qualité de l’analyse, puis discuter mutation de résistance et adaptation selon le contexte. L’objectif est une prise réellement possible et efficace, pas seulement une ordonnance théoriquement correcte.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680563950023" target="_blank" rel="noopener">[S519] FI suisse Glivec</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680684410017" target="_blank" rel="noopener">[S512] Scemblix / asciminib</a>.</p></div></template>
<template data-pop="c92-profiles" data-title="PROFILES et examen fédéral : raisonner à partir des situations">
<p><button class="w" data-k="c92-profiles">PROFILES</button> organise des compétences et situations de départ, pas une promesse de question d’examen sur chaque code CIM. Fatigue, fièvre, saignement, anomalies sanguines ou masse conduisent à un raisonnement clinique : gravité, hypothèses, examens pertinents et communication.</p>
<p>La documentation <button class="w" data-k="c92-profiles">MEBEKO</button> consultée pour 2026 renvoie au référentiel officiel. Les correspondances pédagogiques de cette leçon ne sont pas présentées comme une validation officielle de chaque numéro ou comme un programme exhaustif de l’examen. Le lien utile est la capacité à expliquer une décision, ses risques et ses limites.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S532] CIMS, PROFILES 2017, SSP</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S533] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S534] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></div></template>
<template data-pop="c92-sarcome" data-title="Sarcome myéloïde : masse locale, bilan systémique">
<p>Un sarcome myéloïde est une masse extramédullaire de cellules myéloïdes immatures. Il peut accompagner une leucémie ou sembler isolé. L’imagerie décrit extension et retentissement ; la biopsie avec immunohistochimie et génétique établit la nature de la lésion.</p>
<p>Un bilan médullaire recherche une atteinte concomitante. Les traitements systémiques proches de ceux de <button class="w" data-k="c92-classification">LAM</button> sont discutés même dans certaines formes isolées ; chirurgie ou radiothérapie répondent à des indications locales sélectionnées. Les données sont surtout observationnelles, sans supériorité universelle d’un protocole spécifique démontrée ici.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a> ; <a data-reference-source="1" href="https://iris.unil.ch/entities/publication/607ac57b-f30a-4d32-aa01-23eaa45bb7f9" target="_blank" rel="noopener">[S511] Manifestations ORL du sarcome myéloïde</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a>.</p></div></template>
<template data-pop="c92-semiologie" data-title="Sémiologie : cinq questions avant l’étiquette">
<ol><li>Quelle fonction est perturbée : transport, défense, hémostase, infiltration ?</li><li>Depuis quand et à quelle vitesse ?</li><li>Existe-t-il une menace respiratoire, neurologique, infectieuse ou hémorragique ?</li><li>Quel examen départage les mécanismes possibles ?</li><li>Quelle décision doit précéder les résultats complets ?</li></ol>
<p>Les réponses organisent le bilan sans imposer prématurément un sous-type. Les neuf unités du sous-onglet de sémiologie détaillent normalité, signes, mécanismes, examen, interprétation, différentiels, urgence, limites et sources.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a>.</p></div></template>
<template data-pop="c92-urgences" data-title="Urgences : ne pas attendre la fin du classement">
<p><button class="w" data-k="c92-differenciation">LPA</button> suspectée avec coagulopathie, leucostase symptomatique, lyse tumorale, infection grave, hémorragie ou compression neurologique imposent un circuit urgent. Stabilisation, appel spécialisé et prélèvements utiles avancent en parallèle.</p>
<p>La numération seule ne décide pas de la leucostase, et une <button class="w" data-k="c92-differenciation">LPA</button> ne se traite pas comme toute autre hyperleucocytose. Après exposition, syndrome de différenciation et toxicité rythmique ajoutent des urgences propres aux médicaments. Un diagnostic plausible n’exclut pas une seconde complication.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-promyelozyten-leukaemie-apl/@@guideline/html/index.html" target="_blank" rel="noopener">[S507] Akute Promyelozyten Leukämie (APL) — Onkopedia</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a>.</p></div></template>
<template data-pop="c92-bcr-abl" data-title="BCR::ABL1 : définir la LMC et préparer son suivi">
<p>La fusion <button class="w" data-k="c92-bcr-abl">BCR::ABL1</button> code une tyrosine kinase dérégulée. Caryotype, FISH et RT-PCR apportent des informations complémentaires : chromosome et anomalies additionnelles, remaniement ciblé, identité du transcrit.</p>
<p>Les transcrits atypiques peuvent échapper à une PCR courante. Une discordance mérite vérification avec le laboratoire ; une PCR négative ne doit pas faire ignorer les autres preuves. Identifier le transcrit au diagnostic permet de choisir un suivi fiable. Le terme « Philadelphie positif » ne remplace pas toute la caractérisation.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a>.</p></div></template>
<template data-pop="c92-differentiels" data-title="Différentiels : tester une hypothèse concurrente">
<p>Le diagnostic différentiel dépend du point de départ : leucocytose réactionnelle, autres néoplasies myéloprolifératives, MDS/MPN, leucémie lymphoblastique ou autre cause de cytopénie. Dans une masse, lymphome et autres tumeurs nécessitent un panel adapté.</p>
<p>La persistance, les lignées associées, le frottis, la moelle et la génétique modifient les probabilités. Une dysplasie ou un marqueur isolé ne suffit pas toujours. Une fois la leucémie connue, une infection ou une toxicité peut encore expliquer de nouveaux symptômes ; le diagnostic initial ne ferme pas le raisonnement.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.mll.com/en/myelodysplastic-myeloproliferative-neoplasm-mds-mpn/myelodysplastic-myeloproliferative-neoplasm-with-neutrophilia-mds-mpn-n" target="_blank" rel="noopener">[S508] MDS/MPN with neutrophilia: diagnostics and prognosis</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10345021/" target="_blank" rel="noopener">[S510] Myeloid sarcoma: more and less than a distinct entity</a>.</p></div></template>
<template data-pop="c92-fi" data-title="Information professionnelle suisse : ce qu’elle établit">
<p>La <button class="w" data-k="c92-fi">FI</button> décrit notamment indication, dose, contre-indications, adaptations, interactions et surveillance du produit exact. Elle doit être datée. Une recommandation européenne peut discuter un usage plus large que son libellé suisse ; cet écart doit être signalé.</p>
<p>La <button class="w" data-k="c92-fi">FI</button> ne prouve pas à elle seule le remboursement de chaque situation, ni la supériorité de son produit dans toute comparaison. Les schémas adultes ne se transposent pas automatiquement à l’enfant, à la grossesse ou à une formulation différente. Le cours conserve les limites des passages réellement lus.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S535] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S536] OFSP, cas particuliers, art. 71a–d OAMal</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651780020" target="_blank" rel="noopener">[S513] Trisenox / trioxyde d’arsenic</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680697100011" target="_blank" rel="noopener">[S517] Vanflyta / quizartinib</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680684410017" target="_blank" rel="noopener">[S512] Scemblix / asciminib</a>.</p></div></template>
<template data-pop="c92-genetique" data-title="Génétique : préciser l’usage du résultat">
<p>Une anomalie peut définir une entité, contribuer au pronostic, ouvrir une option ciblée ou servir au suivi. Ces usages ont des exigences distinctes. La classification <button class="w" data-k="c92-classification">OMS</button> ne se substitue pas au tableau pronostique <button class="w" data-k="c92-sources">ELN</button>, et l’un ou l’autre ne remplace pas une indication Swissmedic.</p>
<p>Noter méthode, matériel, sensibilité et version de classification. Un test tumoral ne prouve pas une prédisposition germinale. Une mutation persistante d’hématopoïèse clonale n’a pas automatiquement le même sens qu’un marqueur de maladie résiduelle spécifique.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">[S502] WHO 5th edition: myeloid and histiocytic/dendritic neoplasms</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11515/Doehner_H.etal_Blood2024.GeneticriskclassificationforadultswithAMLreceivingless-intensivetherapies-the2024ELNrecommendations.pdf" target="_blank" rel="noopener">[S504] ELN 2024 Less-Intensive genetic risk classification</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="c92-greffe" data-title="Allogreffe : bénéfice antileucémique et risque propre">
<p>L’allogreffe associe traitement préparatoire et effet immunologique contre le clone. Le bénéfice attendu dépend du risque de rechute, de la réponse/<button class="w" data-k="c92-mrd">MRD</button>, de la maladie, de l’état fonctionnel, du donneur et des risques de toxicité, infection et réaction du greffon contre l’hôte.</p>
<p>Une greffe n’est ni systématique pour toute <button class="w" data-k="c92-classification">LAM</button> ni décidée par l’âge seul. Dans le MDS/MPN avec neutrophilie, elle constitue la stratégie à potentiel curatif établi chez des patients sélectionnés, avec données limitées sur le meilleur traitement préalable. Une prédisposition germinale peut modifier le choix du donneur.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/NBK608332/" target="_blank" rel="noopener">[S509] EBMT Handbook, chapter76: Myelodysplastic/Myeloproliferative Neoplasms</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
<template data-pop="c92-hemogramme" data-title="Hémogramme : lire les nombres et leurs limites">
<p>L’hémogramme donne des concentrations et des indices ; le frottis apporte la morphologie. Le nombre total de leucocytes ne dit pas combien sont des neutrophiles fonctionnels ou des blastes. Comparer aux résultats antérieurs et regarder toutes les lignées.</p>
<p>Une leucémie aiguë peut avoir une numération leucocytaire élevée, normale ou basse. Les normes d’hémoglobine et d’autres paramètres dépendent du laboratoire et de la population. Une alerte automate ou une discordance clinique demande une vérification adaptée, sans diagnostic génétique déduit d’un chiffre.</p>
<div class="src"><p>Sources : <a data-reference-source="1" href="https://www.leukemia-net.org/sites/leukemia-net/content/e58/e480/e481/e11514/Doehner_H.etal_Blood2022.DiagnosisandmanagementofAMLinadults-2022recommendationsfromaninternationalexpertpanelonbehalfoftheELN.pdf" target="_blank" rel="noopener">[S503] Diagnosis and management of AML in adults, ELN 2022</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">[S506] Akute Myeloische Leukämie (AML) — Onkopedia</a> ; <a data-reference-source="1" href="https://www.nature.com/articles/s41375-025-02664-w" target="_blank" rel="noopener">[S505] 2025 European LeukemiaNet recommendations for CML</a>.</p></div></template>
