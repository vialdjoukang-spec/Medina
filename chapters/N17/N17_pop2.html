<template data-pop="n17-hyperk" data-title="Hyperkaliémie urgente">
<p data-evidence="N17-C0651">Le tableau de gravité UKKA utilise des seuils de décision. L’intervalle sérique Viollier 3,5–5,1 mmol/L décrit une référence de laboratoire ; il n’est pas identique à la frontière de la forme légère. Les valeurs entre ces repères demandent le contexte et le laboratoire, sans grade inventé.</p>
<table class="t"><thead><tr><th>Grade adulte UKKA</th><th>Kaliémie</th><th>Conséquence</th></tr></thead><tbody><tr><td data-evidence="N17-C0652">Légère</td>
<td data-evidence="N17-C0653">5,5–5,9 mmol/L</td>
<td data-evidence="N17-C0654">Le médecin confirme le résultat et recherche la cause et la progression.</td>
</tr><tr><td data-evidence="N17-C0655">Modérée</td>
<td data-evidence="N17-C0656">6,0–6,4 mmol/L</td>
<td data-evidence="N17-C0657">Le médecin obtient un électrocardiogramme urgent et adapte la conduite à la maladie aiguë et au contexte.</td>
</tr><tr><td data-evidence="N17-C0658">Sévère</td>
<td data-evidence="N17-C0659">≥6,5 mmol/L</td>
<td data-evidence="N17-C0660">L’équipe traite en urgence et surveille le cœur en continu, même sans tracé typique.</td>
</tr></tbody></table>
<p data-evidence="N17-C0661">Ces grades ne remplacent pas la clinique : une toxicité électrique à une concentration moins élevée peut aussi imposer une cardioprotection. La fonction rénale, la vitesse d’augmentation et la fiabilité du prélèvement modifient le risque.</p>
<div class="lab">Reconnaissance</div><p data-evidence="N17-C0092">Selon UKKA 2023, une kaliémie ≥ 6,5 mmol/L est sévère. Un électrocardiogramme urgent est recommandé dès 6,0 mmol/L. Un tracé sans anomalie ne dispense pas du traitement d’une hyperkaliémie sévère.</p>
<div class="lab">Surveillance</div><p data-evidence="N17-C0093">Le monitorage est continu si la kaliémie atteint 6,5 mmol/L, si le tracé montre une toxicité, ou si la kaliémie vaut 6,0–6,4 mmol/L chez un patient mal en point ou exposé à une hausse rapide.</p>
<div class="lab">Stratégie</div><p data-evidence="N17-C0094">Le calcium protège le cœur lorsqu’il existe des anomalies électriques. L’insuline et le glucose déplacent le potassium vers les cellules. L’équipe organise ensuite son élimination et recherche la cause. Le déplacement seul expose au rebond.</p>
<div class="lab">Délais d’action</div><p data-evidence="N17-CL1014-084">Selon UKKA, le calcium améliore le tracé en environ 3 minutes, mais son effet ne dure que 30–60 minutes ; une nouvelle dose peut être nécessaire si les anomalies électrocardiographiques toxiques persistent ou réapparaissent. L’équipe réévalue le tracé et la clinique ; le calcium ne traite pas la concentration potassique elle-même. L’insuline abaisse la kaliémie dès 15 minutes, au maximum de 0,65–1,0 mmol/L entre 30 et 60 minutes, avec un effet maintenu jusqu’à 2 heures avant un rebond progressif. Le Conseil européen de réanimation 2025 situe l’effet combiné de l’insuline et du salbutamol à 4–6 heures.</p>
<div class="lab">Élimination</div><p data-evidence="N17-CL1014-085">L’étape d’élimination retire réellement le potassium de l’organisme. UKKA recommande le cyclosilicate de zirconium sodique dans la forme sévère et le propose dans la forme modérée ; elle ne recommande plus la résine de polystyrène sulfonate de calcium en situation aiguë. La dialyse est le traitement le plus définitif ; le Conseil européen de réanimation la retient notamment pour une hyperkaliémie sévère réfractaire, une <button class="w" data-k="n17-criteres">IRA</button> oligurique sous 400 mL/jour ou une lyse tissulaire importante. Le <button class="w" data-k="n17-lokelma">cyclosilicate de zirconium sodique</button> a une information professionnelle suisse plus restrictive.</p>
<div class="lab">Produits</div><p data-evidence="N17-C0095">Le schéma insulinique relève ici d’une recommandation clinique européenne et d’un usage hors indication diabète. Les concentrations, le volume de glucose et les contre-indications du produit réellement disponible doivent être contrôlés.</p>
</template>
<template data-pop="n17-acidose" data-title="Acidose métabolique">
<div class="lab">Lien rénal</div><p data-evidence="N17-C0096">Une <button class="w" data-k="n17-criteres">IRA</button> sévère peut s’accompagner d’acidose métabolique. Le gaz du sang et les bicarbonates évaluent sa gravité, avec la respiration, le potassium et l’état circulatoire.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0097">Une acidose réfractaire aux mesures médicales, menaçant le patient, justifie une discussion immédiate pour suppléance. <button class="w" data-k="n17-criteres">KDIGO</button> ne fixe pas un <button class="w" data-k="n17-acidobase">pH (acidité du sang et lecture du gaz)</button> universel qui rendrait toute autre information inutile.</p>
<div class="lab">Bicarbonate</div><p data-evidence="N17-C0098">Le bicarbonate ne traite pas automatiquement toute hyperkaliémie. Il peut se discuter pour une acidose métabolique après examen de la charge sodée, du volume et de ses contre-indications.</p>
</template>
<template data-pop="n17-uremie" data-title="Complications urémiques">
<div class="lab">Reconnaissance</div><p data-evidence="N17-C0099">Une encéphalopathie ou une péricardite peuvent accompagner une insuffisance rénale sévère. Elles imposent une évaluation urgente et la recherche d’autres causes.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0100">Des complications urémiques qui ne répondent pas aux moyens médicaux justifient une orientation immédiate vers la suppléance. L’urée ou la créatinine isolées ne remplacent pas l’appréciation du patient.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0101">Une confusion n’est pas automatiquement une encéphalopathie urémique. Une infection, un médicament accumulé ou un autre trouble métabolique restent possibles.</p>
</template>
<template data-pop="n17-suppleance" data-title="Suppléance rénale">
<div class="lab">Indications</div><p data-evidence="N17-C0102">L’équipe discute immédiatement la suppléance si persistent une hyperkaliémie, une acidose, une surcharge, un œdème pulmonaire ou une complication urémique malgré les mesures médicales appropriées. Une menace vitale impose une réponse urgente.</p>
<div class="lab">Choix</div><p data-evidence="N17-C0103">La technique dépend de la stabilité circulatoire, des besoins d’épuration et des ressources. <button class="w" data-k="n17-criteres">KDIGO</button> suggère une technique continue plutôt qu’une hémodialyse intermittente classique lorsque l’hémodynamique est instable.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0104">La décision porte sur l’ensemble du patient et les tendances. Un stade 3 ou une valeur unique de créatinine ne suffisent pas à fixer automatiquement l’heure d’une dialyse.</p>
<div class="lab">Suivi</div><p data-evidence="N17-C0105">La suppléance remplace temporairement certaines fonctions ; elle ne constitue pas la preuve d’une récupération rénale. Le médecin suit la diurèse et l’évolution entre les séances.</p>
</template>
<template data-pop="n17-nephro" data-title="Orientation néphrologique">
<div class="lab">Parcours suisse</div><p data-evidence="N17-C0106">Le bundle Hôpitaux universitaires de Genève prévoit un contact si le stade 2 est atteint ou si l’<button class="w" data-k="n17-criteres">IRA</button> ne s’améliore pas. Le parcours tient aussi compte des complications et de l’incertitude étiologique.</p>
<div class="lab">Urgence</div><p data-evidence="N17-C0107">Une complication menaçante impose un avis immédiat, sans attendre le classement complet. La recommandation britannique 148 recommande une discussion dans les 24 heures notamment pour un stade 3, une cause inconnue, une réponse insuffisante, un rein transplanté ou une maladie rénale chronique avancée.</p>
<div class="lab">Cause spécialisée</div><p data-evidence="N17-C0108">Une suspicion de glomérulonéphrite, de vascularite, de néphrite interstitielle ou de myélome conduit à un avis rapide. Le diagnostic causal détermine les traitements spécialisés.</p>
</template>
<template data-pop="n17-contraste" data-title="Produit de contraste iodé">
<div class="lab">Évaluation</div><p data-evidence="N17-C0109">La recommandation britannique 148 2024 décrit un petit surcroît de risque lorsque le débit estimé stable est inférieur à 30 mL/min/1,73 m². Une <button class="w" data-k="n17-criteres">IRA</button> après injection nécessite pourtant un bilan causal ; la succession temporelle ne prouve pas la causalité.</p>
<div class="lab">Urgence</div><p data-evidence="N17-C0110">Un examen avec contraste ne doit pas être retardé dans une urgence dont le retard aurait des conséquences importantes. Le risque rénal se confronte au bénéfice attendu.</p>
<div class="lab">Prévention</div><p data-evidence="N17-C0111">L’hydratation orale est encouragée chez les patients à risque. Chez certains patients hospitalisés particulièrement vulnérables, la recommandation britannique 148 propose de considérer une expansion intraveineuse par chlorure de sodium 0,9 % ou bicarbonate isotonique. La surcharge interdit une prescription indifférenciée.</p>
<div class="lab">Portée</div><p data-evidence="N17-C0112">Le repère de débit concerne une fonction relativement stable. Pendant une <button class="w" data-k="n17-criteres">IRA</button> évolutive, le calcul automatique ne devient pas une mesure exacte de filtration.</p>
</template>
<template data-pop="n17-suivi" data-title="Suivi après l’épisode aigu">
<div class="lab">Hospitalisation</div><p data-evidence="N17-C0113">La créatinine, la diurèse, les électrolytes et l’état volémique se suivent selon la gravité. La recommandation britannique 148 indique qu’un dosage quotidien de créatinine est habituel à l’hôpital ; une urgence potassique exige des contrôles bien plus rapprochés.</p>
<div class="lab">Après la sortie</div><p data-evidence="N17-C0114">Le médecin remet un plan de médicaments, précise les contrôles et vérifie la récupération. <button class="w" data-k="n17-criteres">KDIGO</button> propose une évaluation à trois mois pour rechercher une résolution, une maladie rénale chronique nouvelle ou son aggravation.</p>
<div class="lab">Arbitrage</div><p data-evidence="N17-C0115">La position European Renal Best Practice de 2012 demande, chez les patients à haut risque après <button class="w" data-k="n17-criteres">IRA</button>, une évaluation <b>au plus tard deux mois après la sortie</b>. Elle complète le contrôle <button class="w" data-k="n17-criteres">KDIGO</button> à trois mois ; une nouvelle dégradation exige une réponse plus précoce.</p>
<div class="lab">Prévention</div><p data-evidence="N17-C0116">Le patient connaît les risques liés à la déshydratation et aux antalgiques sans ordonnance. Il dispose d’une consigne personnalisée pour demander une aide en cas de maladie intercurrente.</p>
</template>
<template data-pop="n17-nacl" data-title="chlorure de sodium 0,9 % Sintetica">
<div class="lab">Produit et mécanisme</div><p data-evidence="N17-C0117">La solution de perfusion 0,9 % est isotonique et contient 154 mmol/L de sodium et autant de chlorure. Elle remplace un déficit extracellulaire ; la présentation 0,45 % est hypotonique et n’est pas interchangeable.</p>
<p data-evidence="N17-C0721">Les <button class="w" data-k="n17-calcul-nacl">calculs de concentration et de charge sodée</button> partent de la présentation exacte. Les doses générales de la notice ne deviennent pas une recette universelle de remplissage d’une <button class="w" data-k="n17-criteres">IRA</button>.</p>

<div class="lab">Place et dose</div><p data-evidence="N17-C0118">L’information professionnelle adapte le volume à l’âge, au poids et à l’état clinique. Elle décrit 1000 mL/jour en routine et une limite usuelle de 2000 mL/jour, avec des schémas différents dans les situations extrêmes. Ces volumes ne sont pas une cible obligatoire dans l’<button class="w" data-k="n17-criteres">IRA</button>. La dose efficace est celle qui corrige le déficit avec réévaluation.</p>
<div class="lab">Contre-indications et surveillance</div><p data-evidence="N17-C0119">L’information professionnelle contre-indique la solution 0,9 % dans l’hypervolémie, l’hypernatrémie, l’hyperchlorémie et la déshydratation hypertonique. L’insuffisance rénale, cardiaque ou hépatique impose une prudence renforcée. Le bilan hydrique, les électrolytes et l’équilibre acido-basique sont contrôlés.</p>
<div class="lab">Grossesse et interactions</div><p data-evidence="N17-C0120">L’information professionnelle demande une prudence pendant la grossesse et ne fournit pas de données cliniques. Les corticoïdes peuvent renforcer la rétention sodée. La compatibilité de tout médicament ajouté doit être vérifiée.</p>
<div class="lab">Source</div><p data-evidence="N17-C0121">L’information professionnelle suisse de chlorure de sodium 0,9 %/0,45 % Sintetica porte les autorisations 52041 pour la perfusion et 56540 pour l’injection. Sa mise à jour affichée est juillet 2014 ; le texte a été consulté le 11 octobre 2026. Un retrait de lots ne constitue pas un retrait global de l’autorisation.</p>
</template>
<template data-pop="n17-lasix" data-title="Furosémide — Lasix injectable">
<div class="lab">Produit et mécanisme</div><p data-evidence="N17-C0122">Lasix injectable contient 20 mg de furosémide par ampoule de 2 mL. Le médicament agit sur le cotransport sodium–potassium–chlorure de la branche ascendante de l’anse, après transport vers la lumière tubulaire. La natriurèse entraîne une déplétion.</p>
<div class="lab">Place et preuves</div><p data-evidence="N17-C0123"><button class="w" data-k="n17-criteres">KDIGO</button> recommande de ne pas utiliser les diurétiques pour prévenir l’<button class="w" data-k="n17-criteres">IRA</button> et suggère de ne pas les employer pour la traiter, sauf pour la surcharge. Les essais repris par la recommandation n’établissent pas de bénéfice sur la récupération ou le recours à la suppléance. Une diurèse provoquée n’équivaut donc pas à une guérison.</p>
<p data-evidence="N17-C0717">La <button class="w" data-k="n17-calcul-debits">conversion dose →durée minimale à la vitesse maximale</button> est explicitée avec les unités. Elle ne décide pas si le furosémide est indiqué chez ce patient.</p>

<div class="lab">Dose adulte</div><p data-evidence="N17-C0124">L’information professionnelle décrit une dose initiale de 20–40 mg par voie intraveineuse chez l’adulte et à partir de 15 ans. Une réponse insuffisante permet des augmentations de 20 mg à intervalles de deux heures selon cette information professionnelle. La réponse clinique détermine la dose utile ; il n’existe pas de dose cible de récupération rénale.</p>
<div class="lab">Vitesse et limites</div><p data-evidence="N17-C0125">L’injection ne dépasse pas 4 mg/minute. En insuffisance rénale sévère avec créatinine &gt; <button class="w" data-k="n17-calcul-creatinine">5 milligrammes par décilitre (≈ 442 µmol/L)</button>, l’information professionnelle demande au plus 2,5 mg/minute. Son plafond parentéral adulte de 1500 mg/jour est un maximum réglementaire dans des situations sélectionnées, pas une cible usuelle d’<button class="w" data-k="n17-criteres">IRA</button>.</p>
<div class="lab">Contre-indications et effets</div><p data-evidence="N17-C0126">L’hypersensibilité au furosémide, aux sulfamides ou à un excipient est une contre-indication. S’y ajoutent l’insuffisance rénale avec anurie, l’hypovolémie, la déshydratation, l’hypokaliémie ou l’hyponatrémie sévères, le précoma ou coma hépatique et l’allaitement. La déplétion peut aggraver l’<button class="w" data-k="n17-criteres">IRA</button> ; une administration rapide expose à l’ototoxicité.</p>
<div class="lab">Obstacle et indication rénale</div><p data-evidence="N17-CL1014-086">L’information professionnelle exige de garantir l’écoulement des urines en cas de gêne à l’évacuation, par exemple hypertrophie prostatique, sténose urétérale ou hydronéphrose. En effet, l’urine produite sous diurétique doit pouvoir s’écouler ; c’est pourquoi l’obstacle est recherché et levé avant d’augmenter la diurèse. La recommandation britannique 148 ne propose pas les diurétiques de l’anse en routine pour traiter l’<button class="w" data-k="n17-criteres">IRA</button> ; elle les envisage pour une surcharge ou des œdèmes en attendant la suppléance ou pendant la récupération.</p>
<div class="lab">Interactions et surveillance</div><p data-evidence="N17-C0127">Les aminoglycosides renforcent les risques ototoxiques ou néphrotoxiques. Le lithium peut s’accumuler. Le médecin suit la pression, le poids, la diurèse, la créatinine, le sodium, le potassium et le magnésium, puis réévalue la réponse avant d’augmenter.</p>
<div class="lab">Grossesse et fonction hépatique</div><p data-evidence="N17-C0128">L’information professionnelle réserve la grossesse à une nécessité absolue, sur une durée brève et avec surveillance fœtale. Une atteinte hépatique augmente la vulnérabilité aux troubles hydro-électrolytiques ; le précoma ou coma hépatique interdit l’emploi. Il n’existe pas ici de dose hépatique standard à transposer.</p>
<div class="lab">Source</div><p data-evidence="N17-C0129">L’information professionnelle Lasix injectable, Swissmedic 30630, mise à jour en mars 2025, a été lue le 11 octobre 2026. Le produit et la voie sont précisés ; la prescription ne se déduit pas d’une information professionnelle orale.</p>
</template>
<template data-pop="n17-noradrenaline" data-title="Noradrénaline — Noradrenalin Sintetica">
<div class="lab">Produit et mécanisme</div><p data-evidence="N17-C0130">Le concentré contient 1 mg/mL de noradrénaline-base. La stimulation alpha-adrénergique augmente la résistance vasculaire et la pression. Une vasoconstriction excessive peut réduire les perfusions viscérales ; ce médicament n’est pas un traitement vasodilatateur rénal.</p>
<div class="lab">Place</div><p data-evidence="N17-C0131">Un choc vasoplégique malgré un volume circulant approprié peut justifier un vasopresseur associé aux mesures de soutien. L’information professionnelle interdit de traiter une hypovolémie par noradrénaline seule. En urgence, le remplissage approprié peut accompagner le vasopresseur.</p>
<p data-evidence="N17-C0518">La noradrénaline est contre-indiquée en cas d’hypersensibilité au principe actif ou aux excipients, pendant une anesthésie au cyclopropane ou aux gaz halogénés, et comme adjuvant d’anesthésie locale aux doigts, orteils, oreilles, nez ou organes génitaux. Ces contre-indications s’ajoutent à l’hypovolémie traitée par noradrénaline seule.</p>

<div class="lab">Dose adulte</div><p data-evidence="N17-C0132">L’information professionnelle propose une initiation à 8–12 µg/minute, ou une alternative à 0,5–1 µg/minute avec titration croissante. L’entretien moyen est de 2–4 µg/minute ; le texte décrit jusqu’à 30 µg/minute dans le choc réfractaire. Ces repères sont ajustés à la réponse et ne constituent pas un objectif de protection rénale.</p>
<div class="lab">Administration</div><p data-evidence="N17-C0133">Le concentré est dilué dans un véhicule compatible et administré par pompe, avec contrôle de la concentration en noradrénaline-base. L’information professionnelle décrit notamment la stabilité de 4 mg dans 1 L de glucose 5 %, chlorure de sodium 0,9 % ou solution glucosaline ; ce renseignement de stabilité ne définit pas une préparation obligatoire pour tout service. La pression, le rythme et le site sont surveillés ; l’arrêt brutal est évité. L’information professionnelle demande une mesure de pression toutes les 2 minutes jusqu’à la valeur souhaitée, puis toutes les 5 minutes pendant toute la perfusion.</p>
<p data-evidence="N17-C0716">Les <button class="w" data-k="n17-calcul-debits">étapes des conversions microgrammes, milligrammes, poids et débit de pompe</button> permettent de vérifier les unités sans transformer l’exemple de préparation en schéma obligatoire.</p>

<div class="lab">Interactions et effets</div><p data-evidence="N17-C0134">Les inhibiteurs de la monoamine oxydase et certains antidépresseurs peuvent augmenter l’effet vasopresseur. L’information professionnelle signale aussi, par extrapolation, un risque avec le linézolide ; cette association demande une surveillance médicale étroite. Les anesthésiques halogénés majorent le risque rythmique. Une extravasation peut provoquer une nécrose locale ; une ischémie ou une arythmie impose une réévaluation immédiate.</p>
<div class="lab">Populations particulières</div><p data-evidence="N17-C0135">L’information professionnelle ne recommande pas l’emploi chez l’enfant. Pendant la grossesse, elle le réserve à une nécessité absolue, en situation d’urgence ; les données d’allaitement sont insuffisantes. Aucune formule standard d’adaptation rénale ou hépatique n’est donnée : la titration suit la réponse circulatoire.</p>
<div class="lab">Source</div><p data-evidence="N17-C0136">L’information professionnelle de Noradrenalin Sintetica, Swissmedic 60955, mise à jour en octobre 2020, a été consultée le 11 octobre 2026. Les doses sont exprimées en noradrénaline-base, pas en poids de tartrate.</p>
<p class="src">Sources des passages et calculs : <a href="https://amiko.oddb.org/fr/fi?gtin=7680609550040" target="_blank" rel="noopener">Noradrenalin Sintetica 1mg/mL de base, licence 60955, octobre 2020</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-insuline" data-title="Insuline soluble — Actrapid HM">
<div class="lab">Produit exact</div><p data-evidence="N17-C0137">Actrapid HM est une solution limpide d’insuline humaine à 100 unités/mL. L’information professionnelle autorise sa voie intraveineuse. La même notice décrit Insulatard HM, une suspension retard ; cette suspension ne doit jamais être administrée par voie intraveineuse.</p>
<div class="lab">Mécanisme et place</div><p data-evidence="N17-C0138">L’insuline augmente l’entrée cellulaire du potassium, notamment via la <button class="w" data-k="n17-pompe">pompe sodium–potassium dépendante de l’ATP</button>. L’effet redistribue le potassium et n’en assure pas l’élimination. L’indication suisse de l’information professionnelle est le diabète ; le traitement de l’hyperkaliémie relève d’un usage hors indication.</p>
<div class="lab">Schéma clinique adulte</div><p data-evidence="N17-C0139">UKKA 2023 recommande 10 unités d’insuline soluble associées à 25 g de glucose par perfusion intraveineuse pour une kaliémie ≥ 6,5 mmol/L. Elle suggère le même schéma à 6,0–6,4 mmol/L. Le débit, la concentration et le volume de glucose se valident dans le protocole hospitalier avec le produit exact ; la dose quotidienne du diabète ne remplace pas ce schéma.</p>
<div class="lab">Surveillance</div><p data-evidence="N17-C0140">La glycémie est contrôlée à 0, 30, 60, 90, 120, 180, 240, 300 et 360 minutes. Une administration répétée ou un risque élevé peuvent justifier une surveillance plus longue. Le potassium est réévalué pour documenter la réponse et le rebond.</p>
<div class="lab">Risque rénal et hépatique</div><p data-evidence="N17-C0141">Les besoins d’insuline peuvent diminuer lors d’une insuffisance rénale ou hépatique. L’hypoglycémie est donc un risque majeur. Une dose standard européenne ne dispense pas d’une décision clinique individualisée et d’un dispositif de correction de l’hypoglycémie.</p>
<p data-evidence="N17-C0519">Actrapid est formellement contre-indiqué en cas d’hypersensibilité au principe actif ou à un excipient. L’hypoglycémie est son risque majeur et relève des mises en garde ; ce risque ne remplace pas la liste des contre-indications.</p>

<div class="lab">Compatibilité et interactions</div><p data-evidence="N17-C0142">L’information professionnelle décrit la compatibilité d’Actrapid HM avec certaines solutions de chlorure de sodium et de glucose dans des poches adaptées. Une recette contenant du chlorure de potassium ne doit pas être transposée au traitement d’une hyperkaliémie. Les bêtabloquants peuvent masquer l’hypoglycémie ; l’alcool peut renforcer son risque.</p>
<div class="lab">Grossesse et allaitement</div><p data-evidence="N17-C0143">L’information professionnelle permet l’insuline pour le diabète pendant la grossesse et l’allaitement, avec adaptation des besoins. Cette autorisation ne devient pas une validation spécifique du schéma d’hyperkaliémie ; l’urgence maternelle se traite avec les spécialistes.</p>
<div class="lab">Source</div><p data-evidence="N17-C0144">L’information professionnelle des Insulines Humaines Monocomposées Novo Nordisk, mise à jour en avril 2026, distingue Actrapid HM, Swissmedic 44610, d’Insulatard HM, Swissmedic 45495. Elle a été lue le 11 octobre 2026.</p>
<p class="src">Sources des passages et calculs : <a href="https://amiko.oddb.org/fr/fi?gtin=7680446100354" target="_blank" rel="noopener">Actrapid HM, licence 44610 ; notice humaine commune, avril 2026</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-glucose" data-title="Glucose 10 % Fresenius">
<div class="lab">Produit et concentration</div><p data-evidence="N17-C0145">Glucose 10 % Fresenius contient 100 g/L de glucose anhydre. Les <button class="w" data-k="n17-calcul-glucose">étapes du calcul 25 g →250 mL et de la charge hydrique</button> sont explicitées séparément. Cette équivalence n’est pas une autorisation spécifique du schéma hyperkaliémique.</p>
<div class="lab">Rôle clinique</div><p data-evidence="N17-C0146">Le glucose accompagne l’insuline pour réduire le risque d’hypoglycémie. UKKA propose, si la glycémie initiale est &lt; 7 mmol/L, un apport supplémentaire de glucose 10 % à 50 mL/heure pendant cinq heures. Le volume total exige une décision particulière chez un patient oligo-anurique ou congestif.</p>
<div class="lab">Autorisation et dose</div><p data-evidence="N17-C0147">L’information professionnelle suisse autorise un apport parentéral, une solution vectrice et une réhydratation. Elle décrit pour le 10 % une perfusion continue de 2,5 mL/kg/heure et un maximum quotidien de 1,5–6 g/kg. Ces doses nutritionnelles ne sont pas un protocole d’urgence. Le schéma clinique doit documenter tout écart de posologie et son bénéfice-risque.</p>
<div class="lab">Contre-indications</div><p data-evidence="N17-C0148">L’hyperhydratation, le diabète décompensé, l’hyperglycémie, certains troubles postopératoires du métabolisme du glucose et l’hypokaliémie sans apport parallèle sont contre-indiqués. Une lactacidose exige de la prudence. L’information professionnelle ne comporte pas la contre-indication absolue d’anurie présente dans d’autres produits glucosés.</p>
<div class="lab">Surveillance et interactions</div><p data-evidence="N17-C0149">Le médecin contrôle la glycémie, le volume administré et les électrolytes. Une perfusion trop rapide peut provoquer une irritation veineuse ou un trouble hyperosmolaire. La solution ne passe pas par le même dispositif que le sang. Les diurétiques peuvent diminuer la tolérance au glucose.</p>
<div class="lab">Grossesse et source</div><p data-evidence="N17-C0150">L’information professionnelle permet l’usage correct pendant la grossesse et l’allaitement. Elle porte Swissmedic 42423 et la mise à jour octobre 2019 ; la présentation 10 % comporte le code de conditionnement 7680424234323. Le texte exact a été lu le 11 octobre 2026.</p>
</template>
<template data-pop="n17-calcium" data-title="Calcium intraveineux et cardioprotection">
<div class="lab">Principe clinique</div><p data-evidence="N17-C0151">Le calcium antagonise la toxicité électrique du potassium. Il peut améliorer rapidement les anomalies du tracé, mais ne diminue pas la kaliémie. La redistribution et l’élimination du potassium doivent être conduites simultanément.</p>
<div class="lab">Produit et calcium total</div><p data-evidence="N17-C0152">Calciumgluconat B. Braun 10 % Injektionslösung est une spécialité allemande importée en milieu hospitalier suisse, en Mini-Plasco connect de 10 mL. Une ampoule apporte au total 2,25 mmol de calcium. L’information professionnelle distingue 940 mg de calcium gluconate, apportant 2,10 mmol, et le calcium-D-saccharate tétrahydraté, apportant encore 0,15 mmol. Le libellé hospitalier « 1 g/10 mL » désigne le sel de la préparation ; il ne signifie pas 1 g de calcium élémentaire.</p>
<p data-evidence="N17-C0593">Les <button class="w" data-k="n17-calcul-calcium">calculs du calcium (mmol, récipients, débit et dilution)</button> rendent l’équivalence vérifiable. Il faut connaître la concentration du produit exact avant de convertir une dose en volume.</p>

<div class="lab">Indication et contexte suisse</div><p data-evidence="N17-C0153">L’information professionnelle allemande, datée de juillet 2014 et actuellement servie par Fachinfo-Service, autorise le traitement de l’hypocalcémie aiguë symptomatique. L’hyperkaliémie est donc hors indication de cette information professionnelle. Les monographies Hôpitaux universitaires de Genève et PHEL documentent localement la cardioprotection lors de troubles cardiaques liés à l’hyperkaliémie. PHEL décrit le remplacement d’anciens produits suisses par cette spécialité allemande importée ; aucun numéro d’autorisation Swissmedic ne lui est attribué.</p>
<div class="lab">Administration et surveillance</div><p data-evidence="N17-C0154">Pour l’hypocalcémie aiguë symptomatique de l’adulte, l’information professionnelle allemande commence par 10 mL, soit 2,25 mmol de calcium, renouvelables selon les mesures et la clinique. Dans cette indication, l’injection intraveineuse ne dépasse pas 2 mL/minute (0,45 mmol/minute). Le patient est allongé, avec surveillance cardiaque et du site ; une injection trop rapide expose à bradycardie, hypotension ou arythmie.</p>
<div class="lab">Insuffisance rénale, grossesse et allaitement</div><p data-evidence="N17-C0155">L’information professionnelle exige une indication soigneusement pesée en cas d’insuffisance rénale, avec suivi du calcium et du phosphate. Le terrain cardiaque, la sarcoïdose et une néphrocalcinose appellent également la prudence. Pendant la grossesse, le traitement exige une nécessité clinique et une surveillance évitant l’hypercalcémie maternelle ; le calcium traverse le placenta. Pendant l’allaitement, la décision de poursuivre le traitement ou l’allaitement tient compte des bénéfices pour la mère et l’enfant. L’information professionnelle ne fournit pas de dose hyperkaliémique adaptée à ces populations.</p>
<div class="lab">Schéma hyperkaliémique et choix de source</div><p data-evidence="N17-C0501"><b>Repère retenu pour la cardioprotection hyperkaliémique de l’adulte avec tracé toxique :</b> La figure 2 du document final Conseil européen de réanimation 2025 et UKKA 2023 décrivent 30 mL de gluconate 10 % intraveineux en 10 minutes ; UKKA préfère le gluconate hors réanimation, et la figure Conseil européen de réanimation situe le chlorure en arrêt ou péri-arrêt. La recommandation britannique de réanimation 2025 confirme 30 mL en 10 minutes comme alternative lorsque son chlorure 10 % n’est pas disponible. Pour le Mini-Plasco B. Braun exact, 30 mL représentent 3 récipients de 10 mL et 6,75 mmol ; la dose UKKA est arrondie à 6,8 mmol. C’est un usage hors indication de la notice allemande ; aucune autorisation Swissmedic n’est inventée.</p>
<p data-evidence="N17-C0587">La recommandation britannique de réanimation 2025 privilégie le chlorure 10 % à 10 mL en 5 minutes en hyperkaliémie sévère avec anomalies électriques ; elle propose le gluconate 30 mL en 10 minutes si ce chlorure n’est pas disponible. UKKA 2023 réserve préférentiellement le chlorure à la réanimation et emploie le gluconate dans les autres situations. Les sources diffèrent donc dans le choix du sel, sans changer ici l’équivalence gluconate. Les volumes ne se transposent pas à la présentation suisse Hôpitaux universitaires de Genève de chlorure réservée à d’autres usages ; la préparation disponible est vérifiée.</p>

<p data-evidence="N17-C0586"><b>Divergence suisse conservée.</b> La fiche Hôpitaux universitaires de Genève du 14 août 2026 mentionne les arythmies dues à l’hyperkaliémie et conserve un débit maximal de 0,45 mmol/minute. Elle ne donne pas le schéma complet de 30 mL en 10 minutes pour ce produit. Le repère britannique et européen cible explicitement l’urgence hyperkaliémique, alors qu’aucune recommandation suisse publiée ne fixe ce débit ; il ne respecte pas la limite des Hôpitaux universitaires de Genève. En pratique hospitalière, l’équipe identifie cette différence et suit le protocole applicable avec la pharmacie et les spécialistes, sans inventer un compromis de 30 mL en 15 minutes.</p>

<p data-evidence="N17-C0585"><b>Pourquoi ce débit ?</b> UKKA distingue l’antagonisme urgent de la toxicité électrique de la simple réplétion d’une hypocalcémie. Son schéma de 30 mL en 10 minutes correspond à 3 mL/minute, donc 0,675 mmol/minute pour ce produit. Le débit de 2 mL/minute de l’indication hypocalcémie ne doit pas être présenté comme celui du schéma britannique hyperkaliémique.</p>

<div class="lab">Contre-indications</div><p data-evidence="N17-C0502">L’information professionnelle contre-indique notamment l’hypercalcémie, l’hypercalciurie, l’hypersensibilité et l’intoxication par glycosides cardiaques. Sous traitement par glycosides, son exception concerne une hypocalcémie immédiatement menaçante sans solution plus sûre ; elle ne constitue pas une autorisation générale dans l’hyperkaliémie. Ces restrictions doivent être confrontées au produit et au contexte de l’urgence.</p>
<div class="lab">Ceftriaxone et âge</div><p data-evidence="N17-C0503">Chez les nouveau-nés de 28 jours ou moins, y compris prématurés, la ceftriaxone est contre-indiquée s’ils reçoivent ou doivent recevoir du calcium intraveineux. À tout âge, les produits ne se mélangent pas et ne s’administrent pas simultanément, même par des lignes séparées. Au-delà de 28 jours, l’administration séquentielle n’est envisagée que selon les conditions de l’information professionnelle, avec système déconnecté ou soigneusement rincé au chlorure de sodium physiologique ; l’information professionnelle déconseille cette séquence en cas d’hypovolémie.</p>
<div class="lab">Voie, dilution et extravasation</div><p data-evidence="N17-C0504">Pour la cardioprotection hyperkaliémique décrite ici, la voie est intraveineuse. Chez les moins de 18 ans, l’information professionnelle décrit uniquement une injection lente ou une perfusion intraveineuse après dilution, sans injection intramusculaire. Les doses adultes d’hyperkaliémie ne s’étendent pas à la pédiatrie. L’extravasation peut provoquer une nécrose. L’information professionnelle prévoit pour la perfusion une dilution avec chlorure de sodium 0,9 % ou glucose 5 % ; le mélange n’est jamais déduit de la seule présence d’un soluté dans la ligne. Une dilution pédiatrique et sa vitesse nécessitent leur protocole propre.</p>
<div class="lab">Compatibilités et interactions</div><p data-evidence="N17-C0505">En <b>perfusion continue</b>, la fiche Hôpitaux universitaires de Genève décrit, en cas de restriction hydrique, une concentration maximale périphérique de 50 mg/mL de préparation (≈0,115 mmol/mL selon sa valeur arrondie) et centrale de 100 mg/mL (0,225 mmol/mL). Ces limites de concentration ne constituent ni une règle générale du bolus hyperkaliémique ni une justification par l’osmolarité 280. La perfusion continue non diluée par voie centrale sert notamment à la réplétion sous techniques citratées.</p>
<p data-evidence="N17-C0609"><b>Compatibilités et interactions.</b> Le calcium peut précipiter avec bicarbonate, phosphate, sulfate, carbonate, citrate ou oxalate. Il ne se mélange pas avec la ceftriaxone et n’est pas administré simultanément avec elle, même par des lignes différentes ; après 28 jours de vie, une administration séquentielle exige une séparation adaptée et un rinçage compatible. Les nouveau-nés exposés à la ceftriaxone intraveineuse ont une contre-indication spécifique. Les glycosides cardiaques exposent à une toxicité renforcée ; leur contre-indication et son exception très limitée concernent la réplétion hypocalcémique de la notice, sans autoriser une généralisation.</p>

<div class="lab">Données physicochimiques et arbitrage</div><p data-evidence="N17-C0506">L’information professionnelle du produit exact indique une <b>osmolarité théorique de 660 milliosmoles/L</b> et une plage de <button class="w" data-k="n17-ph-solution">pH de la solution</button> 5,5–7,5. Hôpitaux universitaires de Genève affiche 280 milliosmoles/L sans préciser le mode de détermination, avec un <button class="w" data-k="n17-ph-solution">pH de la solution</button> 6,9 compatible. La propriété théorique de l’information professionnelle décrit donc la préparation importée. Le cours n’emploie pas 280 pour choisir le site ou déduire une innocuité périphérique. La différence physique reste inexpliquée ; elle ne sert pas de recette de dilution.</p>
<div class="lab">Sources et substitutions</div><p data-evidence="N17-C0507">Sources lues le 11 octobre 2026 : Fachinformation allemande de juillet 2014, servie par Fachinfo-Service ; PHEL.FP.217 V 09 du 9 décembre 2025 ; PHELinfos 89 de mai 2025, pages 6–7 ; document calcium Hôpitaux universitaires de Genève révisé le 14 août 2026. Le catalogue allemand B. Braun confirme Mini-Plasco connect, 20 × 10 mL. Ces documents hospitaliers ne sont pas des recommandations nationales. Les solutions de chlorure/calcium dédiées à l’hémodiafiltration citratée ne se substituent pas automatiquement au gluconate de cardioprotection.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.fachinfo.de/fi/pdf/002742/calciumgluconat-b-braun-10-injektionsloesung" target="_blank" rel="noopener">Information professionnelle allemande du produit exact</a> ; <a href="https://www.erc.edu/media/wwufbysp/gl2025-06-spec-circ-e.pdf" target="_blank" rel="noopener">Recommandations européennes de réanimation 2025</a> ; <a href="https://www.hug.ch/pharmacie/recommandations/document/calcium" target="_blank" rel="noopener">14.08.2026</a> ; <a href="https://ukkidney.org/sites/renal.org/files/FINAL%20VERSION%20-%20UKKA%20CLINICAL%20PRACTICE%20GUIDELINE%20-%20MANAGEMENT%20OF%20HYPERKALAEMIA%20IN%20ADULTS%20-%20191223_0.pdf" target="_blank" rel="noopener">Recommandation britannique hyperkaliémie 2023</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-bicarbonate" data-title="Bicarbonate de sodium Bichsel 8,4 %">
<div class="lab">Produit</div><p data-evidence="N17-C0156">La solution 8,4 % contient 1 mmol de bicarbonate et 1 mmol de sodium par mL. Elle est hyperosmolaire. L’indication porte notamment sur des acidoses métaboliques.</p>
<div class="lab">Place</div><p data-evidence="N17-C0157">UKKA ne recommande pas le bicarbonate intraveineux en routine dans l’hyperkaliémie aiguë. Une acidose métabolique peut justifier une décision spécifique. La charge sodée et le risque de surcharge importent particulièrement dans l’<button class="w" data-k="n17-criteres">IRA</button>.</p>
<div class="lab">Dose selon l’information professionnelle</div><p data-evidence="N17-C0158">La <button class="w" data-k="n17-calcul-bicarbonate">formule indicative de l’information professionnelle (bases, unités et exemple)</button> calcule une quantité en mmol : déficit de bases × 0,3 ×poids. La notice commence par la moitié calculée, puis exige un nouveau contrôle. Elle décrit généralement 100–200 mmol dans les premières 24 heures et une vitesse maximale d’environ 1,5 mmol/kg/heure ; ces repères ne sont pas un bolus universel d’hyperkaliémie.</p>
<p data-evidence="N17-C0520">La solution à 8,4 % est fortement alcaline et hyperosmolaire : son information professionnelle exige une injection intraveineuse lente dans de gros vaisseaux, ou une dilution dans une solution vectrice appropriée. Elle ne donne pas ici de recette unique de dilution ; celle-ci exige une vérification de compatibilité.</p>

<div class="lab">Contre-indications et effets</div><p data-evidence="N17-C0159">Le bicarbonate Bichsel est contre-indiqué dans les alcaloses métabolique et respiratoire, l’acidose respiratoire, les pertes digestives massives de chlorures ou après certains diurétiques, l’hypocalcémie, les convulsions, la décompensation cardiaque et l’hypernatrémie. La ventilation, le gaz du sang, le sodium, le calcium et le bilan hydrique sont surveillés.</p>
<div class="lab">Incompatibilités et populations</div><p data-evidence="N17-C0160">Le bicarbonate est incompatible avec des solutions contenant calcium, magnésium ou phosphate ; un mélange dans la même ligne nécessite une compatibilité démontrée. Pendant la grossesse, l’information professionnelle exige une nécessité absolue. Elle ne fournit pas de dose hépatique standard ni de garantie générale pour l’allaitement.</p>
<div class="lab">Source</div><p data-evidence="N17-C0161">Pendant la grossesse, l’information professionnelle réserve le médicament à une nécessité absolue ; l’absence de données ne permet pas d’affirmer une innocuité pendant l’allaitement. La présentation 8,4 % Bichsel porte Swissmedic 36797, avec texte mis à jour en novembre 2025, relu le 11 octobre 2026.</p>
<p class="src">Sources des passages et calculs : <a href="https://amiko.oddb.org/fr/fi?gtin=7680367971262" target="_blank" rel="noopener">bicarbonate de sodium Bichsel 8,4%, licence 36797, novembre 2025</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>

<p class="ratio" data-cover="n17-s-bioch-cours"></p><ul><li data-evidence="N17-C0441">Le calcium protège électriquement sans abaisser la kaliémie.</li><li data-evidence="N17-C0442">L’insuline redistribue le potassium et expose à l’hypoglycémie ; une élimination et des contrôles restent nécessaires.</li><li data-evidence="N17-C0443">L’hème peut contribuer à une toxicité tubulaire ; les données précliniques ne prouvent pas une thérapeutique humaine.</li></ul></template>
<template data-pop="pareto-n17-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="n17-p-1,n17-p-2,n17-p-3,n17-p-4"></p><ul><li data-evidence="N17-C0496">Les traitements corrigent une cause ou une complication ; aucun médicament ne guérit toutes les <button class="w" data-k="n17-criteres">IRA</button>.</li><li data-evidence="N17-C0497">Le remplissage dépend du déficit. Le furosémide traite la surcharge et est contre-indiqué dans l’anurie selon son information professionnelle.</li><li data-evidence="N17-C0498">L’insuline soluble et le glucose redistribuent le potassium en usage clinique hors indication ; les glycémies sont contrôlées jusqu’à six heures au moins.</li><li data-evidence="N17-C0499">Le calcium protège sans abaisser la kaliémie. Le produit exact apporte 2,25 mmol par 10 mL ; le schéma hyperkaliémique de 30 mL en 10 minutes provient d’UKKA et du Conseil européen de réanimation, tandis que les Hôpitaux universitaires de Genève fixent un débit plus lent.</li><li data-evidence="N17-CL1014-101">Lokelma élimine le potassium par voie digestive, 10 g trois fois par jour selon sa notice suisse, mais il n’est pas un traitement d’urgence d’une hyperkaliémie menaçant la vie.</li><li data-evidence="N17-C0500">Une dopamine dite rénale et les diurétiques préventifs ne sont pas des stratégies recommandées.</li></ul></template>
<template data-pop="n17-calcul-calcium" data-title="Calcium : quantité, volume, débit et dilution">
<p data-evidence="N17-C0588"><b>Quantité.</b> Une millimole mesure une quantité de matière. Le calcium total d’un Mini-Plasco est 2,25 mmol dans 10 mL : concentration =2,25 ÷ 10 =0,225 mmol/mL. Les 2,10 mmol du gluconate et 0,15 mmol du saccharate s’additionnent ; oublier le second sel sous-estime la quantité.</p>
<p data-evidence="N17-C0589"><b>Volume.</b> Pour trois récipients :3 × 10 =30 mL et 3 × 2,25 =6,75 mmol. La valeur 6,8 mmol des recommandations est arrondie ; elle ne justifie pas d’ajouter une fraction de récipient. Le libellé hospitalier 1 g/10 mL concerne la préparation de sel, pas 1 g de calcium élémentaire.</p>
<p data-evidence="N17-C0590"><b>Débit.</b> Volume ÷ durée :30 mL ÷ 10 minutes =3 mL/minute. Quantité ÷ durée :6,75 mmol ÷ 10 minutes =0,675 mmol/minute. Ce calcul expose le schéma britannique ; il n’est pas celui de la limite Hôpitaux universitaires de Genève 0,45 mmol/minute ni de l’indication allemande d’hypocalcémie.</p>
<p data-evidence="N17-C0591"><b>Dilution.</b> L’information professionnelle décrit une dilution 1:10 pour une perfusion, avec chlorure de sodium 0,9 % ou glucose 5 %. Cela correspond à 10 mL de produit dans un <b>volume final de 100 mL</b> :2,25 ÷ 100 =0,0225 mmol/mL. Le calcul ne valide pas une nouvelle préparation hyperkaliémique ni la compatibilité d’un autre véhicule.</p>
<p data-evidence="N17-C0592"><b>Limites.</b> Les maxima périphérique et central de la perfusion continue Hôpitaux universitaires de Genève ne se transposent pas automatiquement à un bolus. Aucune règle de voie veineuse n’est déduite ici du chiffre d’osmolarité 280. Les unités de sel, de calcium élémentaire et de quantité molaire doivent rester distinctes.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.fachinfo.de/fi/pdf/002742/calciumgluconat-b-braun-10-injektionsloesung" target="_blank" rel="noopener">Information professionnelle allemande du produit exact</a> ; <a href="https://ukkidney.org/sites/renal.org/files/FINAL%20VERSION%20-%20UKKA%20CLINICAL%20PRACTICE%20GUIDELINE%20-%20MANAGEMENT%20OF%20HYPERKALAEMIA%20IN%20ADULTS%20-%20191223_0.pdf" target="_blank" rel="noopener">Recommandation britannique hyperkaliémie 2023</a> ; <a href="https://www.hug.ch/pharmacie/recommandations/document/calcium" target="_blank" rel="noopener">14.08.2026</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-calcul-glucose" data-title="Insuline et glucose : concentration, volume et charge hydrique">
<p data-evidence="N17-C0594"><b>Base.</b> La solution glucose 10 % Fresenius contient 100 g/L, soit 10 g pour 100 mL et 0,1 g/mL. Le pourcentage indique ici une masse par volume, et pas une probabilité ni un pourcentage de la glycémie.</p>
<p data-evidence="N17-C0595"><b>Volume pour 25 g.</b> Volume =masse ÷concentration :25 g ÷ 0,1 g/mL =250 mL. Les grammes s’annulent. Cette équivalence arithmétique ne devient pas une indication réglementaire du glucose dans l’hyperkaliémie.</p>
<p data-evidence="N17-C0596"><b>Apport supplémentaire.</b>50 mL/heure × 5 heures =250 mL, donc 25 g supplémentaires de glucose 10 %. Avec le volume initial de 250 mL, le total de ces deux apports est 500 mL et 50 g. Ce calcul explique la charge hydrique ; les autres perfusions s’ajoutent au bilan.</p>
<p data-evidence="N17-C0597"><b>Insuline.</b> Actrapid contient 100 unités/mL ;10 unités correspondent à 10 ÷ 100 =0,1 mL de solution concentrée. Ce très petit volume n’autorise pas une injection improvisée : le schéma de perfusion, la mesure précise, le contrôle indépendant et la concentration finale relèvent de la préparation hospitalière.</p>
<p data-evidence="N17-C0598"><b>Limites.</b> Le repère d’apport supplémentaire s’applique à une glycémie avant traitement inférieure à 7 mmol/L. Ce seuil prévient l’hypoglycémie sous insuline ; il n’est pas l’intervalle normal du glucose à jeun. Le contrôle glycémique rapproché et les contre-indications du produit restent nécessaires.</p>
<p class="src">Sources des passages et calculs : <a href="https://amiko.oddb.org/fr/fi?gtin=7680424234323" target="_blank" rel="noopener">Glucose 5%,10%Fresenius, licence 42423, octobre 2019</a> ; <a href="https://ukkidney.org/sites/renal.org/files/FINAL%20VERSION%20-%20UKKA%20CLINICAL%20PRACTICE%20GUIDELINE%20-%20MANAGEMENT%20OF%20HYPERKALAEMIA%20IN%20ADULTS%20-%20191223_0.pdf" target="_blank" rel="noopener">Recommandation britannique hyperkaliémie 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680446100354" target="_blank" rel="noopener">Actrapid HM, licence 44610 ; notice humaine commune, avril 2026</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-calcul-bicarbonate" data-title="Bicarbonate : déficit, coefficient, poids, quantité et limites">
<p data-evidence="N17-C0599"><b>Concentration.</b> La préparation 8,4 % Bichsel contient 1000 mmol/L de bicarbonate et autant de sodium :1000 mmol ÷ 1000 mL =1 mmol/mL. Une quantité en mmol est donc numériquement égale au volume en mL de ce concentré.</p>
<p data-evidence="N17-C0600"><b>Bases du calcul.</b> L’information professionnelle utilise le déficit de bases fourni par le bilan artériel, en mmol/L, le poids en kilogrammes et un coefficient indicatif de distribution 0,3 L/kg. Quantité =déficit (mmol/L) × 0,3 (L/kg) ×poids (kg). Les litres et kilogrammes s’annulent ; il reste des mmol.</p>
<p data-evidence="N17-C0601"><b>Exemple fictif.</b> Avec un déficit de 10 mmol/L et un poids de 70 kg :10 × 0,3 × 70 =210 mmol. La moitié initiale prévue par la notice vaut 105 mmol, donc 105 mL de solution 8,4 %, avant un nouveau bilan. Cet exemple illustre la formule ; il ne prescrit pas le traitement d’un patient.</p>
<p data-evidence="N17-C0602"><b>Limites.</b> Le coefficient est indicatif et une redistribution peut entraîner une surcorrection. L’information professionnelle décrit généralement 100–200 mmol sur les premières 24 heures et une vitesse maximale d’environ 1,5 mmol/kg/heure. Ces limites et les contre-indications sont confrontées au calcul avant toute administration ; on ne vise pas automatiquement la quantité théorique totale.</p>
<p data-evidence="N17-C0603"><b>Réévaluation.</b> Le gaz, la ventilation, le sodium, le calcium et le bilan hydrique contrôlent l’effet. Une baisse de bicarbonates ne suffit pas à distinguer toutes les causes d’acidose, et le concentré ne se mélange pas avec le calcium ou le phosphate sans preuve de compatibilité.</p>
<p class="src">Sources des passages et calculs : <a href="https://amiko.oddb.org/fr/fi?gtin=7680367971262" target="_blank" rel="noopener">bicarbonate de sodium Bichsel 8,4%, licence 36797, novembre 2025</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-osmolalite" data-title="Osmolalité : mesure, calcul CHUV et trou osmolaire">
<p data-evidence="N17-C0604"><b>Base.</b> L’osmolalité exprime les particules osmotiquement actives par kilogramme d’eau ; l’osmolarité les rapporte à un litre de solution. Leur dénominateur diffère. Le Centre hospitalier universitaire vaudois mesure l’osmolalité par abaissement du point de congélation et calcule une estimation à partir du sodium, du glucose et de l’urée sanguins.</p>
<p data-evidence="N17-C0605"><b>Formule Centre hospitalier universitaire vaudois actuelle.</b> Osmolalité calculée =2 ×sodium +glucose +urée, avec <b>les trois concentrations en mmol/L</b>. Le compte rendu l’exprime en mmol/kg d’eau. Le Centre hospitalier universitaire vaudois a remplacé en 2023 sa formule antérieure 1,86 ×sodium +glucose +urée +9 ; les résultats de formules différentes ne se comparent pas comme des mesures identiques.</p>
<p data-evidence="N17-C0606"><b>Étapes, exemple fictif.</b> Sodium 140 mmol/L, glucose 5 mmol/L et urée 5 mmol/L :2 × 140 =280 ;280 +5 +5 =290 mmol/kg d’eau estimés. Le trou osmolaire =osmolalité mesurée −calculée. Si la mesure vaut 295, le trou vaut 295 −290 =5 mmol/kg d’eau.</p>
<p data-evidence="N17-C0607"><b>Interprétation locale.</b> Pour cette formule, le Centre hospitalier universitaire vaudois rapporte un intervalle du trou de −12 à 2 mmol/kg d’eau (percentiles 2,5–97,5) dans 129 adultes de référence à sodium, urée et glucose dans leurs intervalles. Le laboratoire signale automatiquement les trous supérieurs à 10, mais un résultat supérieur à 2 peut mériter une interprétation plus sensible selon la question clinique.</p>
<p data-evidence="N17-C0608"><b>Limites.</b> Viollier indique 280–300 milliosmoles/kg pour l’osmolalité sérique mesurée ; cet intervalle appartient à ce laboratoire. Le calcul du sang ne permet pas de résoudre la différence 660 théoriques contre 280 non qualifiés d’une préparation de calcium, ni de calculer une dilution de médicament par simple comparaison au plasma.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.chuv.ch/fileadmin/sites/dl/documents/LCC-Lettre-information-osmolalite-2023-10-03.pdf" target="_blank" rel="noopener">CHUV : lettre osmolalité 2023</a> ; <a href="https://www.viollier.ch/fr/analysis/18362" target="_blank" rel="noopener">Viollier : osmolalité sérique</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-pompe" data-title="Pompe sodium–potassium, énergie et compartiments">
<p data-evidence="N17-C0610"><b>Membrane et énergie.</b> Une cellule sépare son milieu intérieur du liquide extracellulaire par une membrane. La pompe sodium–potassium est une protéine de cette membrane ; l’adénosine triphosphate (<button class="w" data-k="n17-pompe">ATP</button>) lui fournit l’énergie nécessaire au transport actif. La membrane du côté du sang est dite basolatérale ; celle du côté de l’urine, apicale.</p>
<p data-evidence="N17-C0611"><b>Insuline.</b> Elle augmente l’activité et le recrutement de la pompe, favorisant l’entrée du potassium dans les cellules. Le potassium a changé de compartiment : il n’a pas quitté le corps. Une baisse de la glycémie et un rebond de kaliémie restent donc à surveiller.</p>
<p data-evidence="N17-C0612"><b>Sécrétion distale.</b> Dans une cellule principale du collecteur, l’entrée apicale de sodium rend la lumière relativement négative et favorise la sortie apicale du potassium par ses canaux. L’aldostérone renforce ces transports. La pompe entretient les gradients du côté du sang ; ce n’est pas elle qui verse directement le potassium dans l’urine.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.ncbi.nlm.nih.gov/sites/books/NBK554411/?report=reader" target="_blank" rel="noopener">StatPearls : histologie rénale</a> ; <a href="https://ukkidney.org/sites/renal.org/files/FINAL%20VERSION%20-%20UKKA%20CLINICAL%20PRACTICE%20GUIDELINE%20-%20MANAGEMENT%20OF%20HYPERKALAEMIA%20IN%20ADULTS%20-%20191223_0.pdf" target="_blank" rel="noopener">Recommandation britannique hyperkaliémie 2023</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-acidobase" data-title="Acide–base : bases, références, compensation et trou anionique">
<p data-evidence="N17-C0613"><b>Lire le gaz.</b> Le <button class="w" data-k="n17-acidobase">pH</button> décrit l’état acide ou alcalin ; acidémie signifie <button class="w" data-k="n17-acidobase">pH</button> bas, tandis qu’acidose désigne le processus qui tend à le faire baisser. Le gaz mesure le <button class="w" data-k="n17-acidobase">pH</button> et la pression partielle du dioxyde de carbone (pCO₂) ; ses bicarbonates sont calculés. Les bicarbonates du bilan sérique sont mesurés par une autre méthode. On note toujours le prélèvement et la méthode.</p>
<p data-evidence="N17-C0614"><b>Références suisses.</b> Viollier donne un <button class="w" data-k="n17-acidobase">pH</button> artériel 7,35–7,45 et des bicarbonates standard artériels 21–29 mmol/L ; le bicarbonate sérique enzymatique est 20–31 mmol/L. Pour la pCO₂ artérielle, la référence est 32–45 mmHg chez la femme et 35–48 chez l’homme. Ces intervalles ne s’échangent pas avec ceux d’un prélèvement veineux et ne remplacent pas le laboratoire du patient.</p>
<p data-evidence="N17-C0615"><b>Deux organes.</b> Le bicarbonate participe au tamponnement des acides. Le rein récupère le bicarbonate filtré et élimine l’acide, notamment sous forme d’ammonium ou lié aux tampons urinaires. Le poumon élimine le dioxyde de carbone. Une <button class="w" data-k="n17-criteres">IRA</button> peut compromettre le premier mécanisme ; une hypoventilation peut compromettre le second.</p>
<p data-evidence="N17-C0616"><b>Compensation, formule de Winter.</b> En acidose métabolique, pCO₂ attendue (mmHg) =1,5 ×bicarbonates (mmol/L) +8, avec une marge de±2 mmHg. Les coefficients portent les unités nécessaires à cette règle empirique. Exemple fictif : bicarbonates 12 donnent 1,5 × 12 +8 =26 mmHg, intervalle 24–28. Une pCO₂ mesurée 40 est au-dessus de cette compensation et fait rechercher une acidose respiratoire associée ; ce n’est pas une compensation normale.</p>
<p data-evidence="N17-C0617"><b>Trou anionique.</b> Avec les trois concentrations en mmol/L : sodium −(chlorure +bicarbonates). Exemple fictif :140 −(102 +12) =26 mmol/L. Le sang reste électriquement neutre ; ce calcul estime la différence entre ions non inclus dans la formule. L’intervalle normal dépend de la méthode et de l’inclusion éventuelle du potassium : on demande celui du laboratoire, sans attribuer un chiffre universel.</p>
<p data-evidence="N17-C0618"><b>Albumine.</b> Une albumine basse diminue le trou apparent. La correction conventionnelle ajoute 2,5 mmol/L par baisse de 10 g/L d’albumine sous 40 g/L : trou corrigé =trou +2,5 ×(40 −albumine en g/L)/10. Exemple fictif :26 +2,5 ×(40 −20)/10 =31 mmol/L. Le 40 de la formule est un repère conventionnel, pas l’intervalle Viollier d’albumine (31–45 g/L chez l’adulte).</p>
<p data-evidence="N17-C0619"><b>Limites.</b> On interprète le résultat avec la clinique, le lactate, les cétones ou les toxiques selon la question. La formule de Winter s’applique à l’acidose métabolique et ne calcule pas la dose de bicarbonate. Un <button class="w" data-k="n17-acidobase">pH</button> normal peut masquer des troubles associés ; un trou élevé n’identifie pas à lui seul l’acide responsable.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.msdmanuals.com/fr/professional/n%C3%A9phrologie/r%C3%A9gulation-et-troubles-acido-basiques/troubles-de-l-%C3%A9quilibre-acide-base" target="_blank" rel="noopener">Manuel médical professionnel : troubles acido-basiques</a> ; <a href="https://www.viollier.ch/fr/analysis/14136" target="_blank" rel="noopener">Viollier : fiche du paramètre correspondant</a> ; <a href="https://www.revmed.ch/view/425044/3680642/RMS_615_1455.pdf" target="_blank" rel="noopener">Revue médicale suisse : bases acido-basiques 2018</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-ph-solution" data-title="pH d’une préparation : contexte et limites"><p data-evidence="N17-C0712">Le <button class="w" data-k="n17-acidobase">pH</button> décrit le caractère acide ou alcalin d’un milieu. Dans une information professionnelle, il concerne la solution du médicament ; une plage de préparation 5,5–7,5 ne représente pas l’intervalle normal du sang. L’information professionnelle du gluconate importé fournit cette plage pour sa solution. La compatibilité d’un mélange ne se déduit pas de son <button class="w" data-k="n17-acidobase">pH</button> seul.</p></template><template data-pop="n17-calcul-debits" data-title="Débits médicamenteux : masse, poids, concentration et durée">
<p data-evidence="N17-C0713"><b>Noradrénaline : concentration et unités.</b> La préparation illustrative de la notice contient 4 mg de base dans 1 litre. Convertir 4 mg en 4000 microgrammes et 1 litre en 1000 mL donne 4000/1000 =4 microgrammes/mL. Le débit volumique =débit de quantité ÷concentration. Exemple arithmétique :8 microgrammes/minute ÷ 4 microgrammes/mL =2 mL/minute ; multiplier par 60 minutes/heure donne 120 mL/heure. Ce calcul explique la notice, sans imposer ce volume à un patient avec <button class="w" data-k="n17-criteres">IRA</button>.</p>
<p data-evidence="N17-C0714"><b>Débit pondéral.</b> Une dose en microgrammes/kg/minute se multiplie par le poids pour obtenir des microgrammes/minute. Exemple fictif :0,5 × 70 =35 microgrammes/minute. Elle n’est pas numériquement égale à 0,5 microgramme/minute. La concentration finale utilisée, la titration et la surveillance sont vérifiées avant de régler une pompe ; aucune préparation improvisée ne découle de l’exemple.</p>
<p data-evidence="N17-C0715"><b>Furosémide : vitesse maximale.</b> Lasix injectable apporte 20 mg dans 2 mL, soit 10 mg/mL. À la limite maximale générale de 4 mg/minute,20 mg demandent au moins 20/4 =5 minutes ; une administration plus lente reste possible. La notice abaisse la limite à 2,5 mg/minute si la créatinine dépasse 5 milligrammes par décilitre, soit environ 442 µmol/L. Une vitesse maximale n’est ni une indication ni une dose quotidienne.</p>
</template>
<template data-pop="n17-calcul-nacl" data-title="Chlorure de sodium : pourcentage, grammes, mmol et volume">
<p data-evidence="N17-C0718"><b>Concentration massique.</b> La préparation 0,9 % contient 9 g de chlorure de sodium dans 1 litre :9 g/1000 mL =0,009 g/mL. Dans 100 mL, la masse est 0,009 × 100 =0,9 g. Ce pourcentage massique par volume ne signifie pas 0,9 % de la natrémie.</p>
<p data-evidence="N17-C0719"><b>Concentration des ions.</b> L’information professionnelle donne 154 mmol/L de sodium et 154 mmol/L de chlorure. Un volume fictif de 500 mL =0,5 litre contient 154 × 0,5 =77 mmol de chaque ion. Ce calcul expose la charge administrée ; il ne valide pas un volume de remplissage. La notice indique une osmolarité théorique 308 milliosmoles/L, distincte de l’osmolalité sérique par kilogramme.</p>
<p data-evidence="N17-C0720"><b>Limites.</b> La prescription confronte la quantité de sodium et le volume au bilan hydrique, à la congestion et aux contre-indications. L’intervalle de référence de natrémie ne donne pas une cible de volume de perfusion ; toutes les perfusions et les pertes participent au bilan.</p>
</template>
<template data-pop="n17-mole" data-title="Mole, millimole, micromole : quantité et concentration">
<p data-evidence="N17-C0722"><b>Ce que l’on compte.</b> Une mole est une quantité de matière qui contient exactement 6,02214076 × 10²³ entités spécifiées. Une entité peut être un atome, une molécule ou un ion : on nomme donc toujours ce qui est compté. Cette définition internationale du Bureau international des poids et mesures ne décrit pas une concentration normale du sang.</p>
<p data-evidence="N17-C0723"><b>Préfixes.</b> Une millimole est un millième de mole ; une micromole est un millionième. Donc 1 mmol =1000 µmol et 1 µmol =0,001 mmol. Exemple :2,25 mmol de calcium =2250 µmol. Une quantité n’est pas une concentration : diviser par 10 mL donne 0,225 mmol/mL. Le dénominateur nomme le volume dans lequel cette quantité se trouve.</p>
<p data-evidence="N17-C0724"><b>Masse et entité.</b> Des grammes expriment une masse, des moles un nombre d’entités. La conversion dépend de la substance et de sa masse molaire ; elle ne repose pas sur une égalité universelle entre gramme et millimole. Dans le produit importé, les quantités de calcium fournies par le gluconate et le saccharate s’additionnent. Une masse de sel et une masse de calcium élémentaire ne sont pas interchangeables.</p>
<p class="src">Définition : <a href="https://www.bipm.org/fr/si-base-units/mole" target="_blank" rel="noopener">Bureau international des poids et mesures : la mole</a> ; composition : information professionnelle allemande du produit exact.</p></template>

<template data-pop="n17-ion-sodium" data-title="Ion sodium : compartiment et référence suisse"><p data-evidence="N17-P1-C001">Un ion sodium porte ici une charge positive. Le sodium du sang et le sodium transporté par une cellule tubulaire concernent des compartiments différents. Pour le sérum, Viollier donne 136–145 mmol/L ; cet intervalle ne décrit pas une concentration intracellulaire ni une cible de correction.</p><p>Les <button class="w" data-k="n17-normalite">conditions de prélèvement et références du laboratoire</button> accompagnent l’interprétation. La <button class="w" data-k="n17-pompe">pompe sodium–potassium</button> explique le transport cellulaire ; le résultat sérique ne mesure pas directement ce flux.</p><p class="src">Référence : <a href="https://www.viollier.ch/fr/analysis/7090" target="_blank" rel="noopener">Viollier, sodium sérique</a> ; StatPearls, Histology, Nephron, transport distal.</p></template>
<template data-pop="n17-ion-potassium" data-title="Ion potassium : sérum, stock et transport"><p data-evidence="N17-P1-C002">Un ion potassium porte ici une charge positive. Pour le sérum, Viollier donne 3,5–5,1 mmol/L. Cette référence dépend du prélèvement et ne définit ni un stock corporel normal ni une cible thérapeutique individuelle. Un transport entre cellules et sang peut modifier la kaliémie sans éliminer le potassium.</p><p>Le médecin distingue les <button class="w" data-k="n17-normalite">références et pièges du prélèvement</button>, les <button class="w" data-k="n17-hyperk">seuils de gravité de l’hyperkaliémie</button> et la <button class="w" data-k="n17-pompe">physiologie du transport cellulaire</button>. Une cible cardiologique héritée d’un autre contexte ne s’applique pas automatiquement à l’<button class="w" data-k="n17-criteres">IRA</button>.</p><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/7100" target="_blank" rel="noopener">Viollier, potassium sérique</a> ; UKKA 2023, classification et physiologie ; StatPearls, Histology, Nephron, transport distal.</p></template>
<template data-pop="n17-qrs" data-title="Complexe QRS : toxicité électrique du potassium"><p data-evidence="N17-P1-C003">Les lettres Q, R et S désignent les déflexions du complexe ventriculaire de l’électrocardiogramme. Dans l’hyperkaliémie, son élargissement traduit un ralentissement de conduction ; il fait rechercher une toxicité électrique et peut imposer une cardioprotection urgente. Cette fenêtre ne décrit pas les critères de resynchronisation d’une insuffisance cardiaque chronique.</p><p>Un tracé sans anomalie n’exclut pas une hyperkaliémie sévère. Les <button class="w" data-k="n17-hyperk">critères d’électrocardiogramme, de surveillance et de traitement urgent</button> restent fondés sur la kaliémie et la situation clinique. La figure du cours illustre des formes sans durée calibrée ; elle n’établit pas un diagnostic individuel.</p><p class="src">Référence : <a href="https://ukkidney.org/sites/renal.org/files/FINAL%20VERSION%20-%20UKKA%20CLINICAL%20PRACTICE%20GUIDELINE%20-%20MANAGEMENT%20OF%20HYPERKALAEMIA%20IN%20ADULTS%20-%20191223_0.pdf" target="_blank" rel="noopener">UKKA 2023, physiologie et anomalies électrocardiographiques, sections 2 et 14</a>.</p></template>
<template data-pop="n17-lokelma" data-title="Cyclosilicate de zirconium sodique — Lokelma">
<div class="lab">Produit et mécanisme</div><p data-evidence="N17-CL1014-087">Lokelma est une poudre minérale insoluble, non absorbée, présentée en sachets de 5 g à mettre en suspension dans environ 45 mL d’eau. Elle capte le potassium dans tout le tube digestif en échange d’ions sodium et hydrogène ; le potassium quitte ainsi l’organisme par les selles. Contrairement à l’insuline, elle réduit donc le stock corporel et non sa seule répartition.</p>
<div class="lab">Indication et limite suisse</div><p data-evidence="N17-CL1014-088">L’information professionnelle suisse indique le traitement de l’hyperkaliémie de l’adulte, mais précise que le produit ne doit pas être utilisé comme médicament d’urgence d’une hyperkaliémie menaçant le pronostic vital. Son effet commence environ 1 heure après la prise ; la normokaliémie survient typiquement en 24 à 48 heures. UKKA 2023 et le Conseil européen de réanimation 2025 l’intègrent pourtant dès la prise en charge aiguë d’une forme sévère. Les deux positions se concilient : le chélateur complète l’étape d’élimination, mais il ne remplace jamais le calcium, l’insuline ni la dialyse devant une menace immédiate.</p>
<div class="lab">Dose adulte</div><p data-evidence="N17-CL1014-089">Phase de correction selon l’information professionnelle : 10 g trois fois par jour par voie orale si la kaliémie dépasse 5,0 mmol/L. Si elle reste supérieure à 5,0 mmol/L après 48 heures, le même schéma peut être prolongé de 24 heures ; sans normokaliémie après 3 jours, une autre approche est envisagée. L’entretien éventuel utilise la dose minimale efficace, sans dépasser 10 g une fois par jour.</p>
<div class="lab">Contre-indication, précautions et populations</div><p data-evidence="N17-CL1014-090">La seule contre-indication est l’hypersensibilité au principe actif. Une hypokaliémie peut survenir ; sous 3,0 mmol/L, le traitement est arrêté et le patient réévalué. Chaque sachet de 5 g contient environ 400 mg de sodium : chez un patient en surcharge ou insuffisant cardiaque, des œdèmes et une décompensation sont recherchés. Faute de données, l’emploi est évité pendant la grossesse par précaution.</p>
<p class="src">Source : information professionnelle suisse Lokelma, Swissmedic 67851, mise à jour janvier 2026, consultée le 14 octobre 2026 via AmiKo ; UKKA 2023, recommandations 16.6.1a–b ; Conseil européen de réanimation 2025, figure 2.</p><div class="lab">Interactions et adaptations</div><p data-evidence="N17-ALPHA1-E01">Lokelma peut modifier transitoirement le pH gastrique. Les médicaments oraux dont la biodisponibilité dépend de ce pH sont espacés d’au moins deux heures avant ou après la prise. La notice demande explicitement cet espacement pour le tacrolimus : une étude chez des volontaires sains a montré une diminution de son exposition lors de la coadministration. Chez le patient transplanté avec IRA, cette interaction est revue avec l’équipe de transplantation. La notice ne demande pas d’adaptation rénale hors hémodialyse chronique ni d’adaptation hépatique ; le schéma de dialyse chronique reste distinct.</p><p data-evidence="N17-ALPHA1-E02">À la phase de correction de 10 g trois fois par jour, six sachets de 5 g représentent environ 6 × 400 = 2400 mg de sodium par jour. Cette quantité décrit le contenu administré ; elle ne prédit pas la quantité absorbée. Dyspnée, œdèmes et poids sont suivis chez le patient à risque de surcharge.</p>
</template>
<template data-pop="n17-levee" data-title="Syndrome de levée d’obstacle">
<div class="lab">Mécanisme</div><p data-evidence="N17-CL1014-091">Après une obstruction, les tubules restent incapables de concentrer l’urine pendant un temps. Lorsque le drainage rétablit l’écoulement, l’eau et les solutés accumulés sont alors éliminés massivement : il s’agit d’une polyurie osmotique.</p>
<div class="lab">Reconnaissance</div><p data-evidence="N17-CL1014-092">Le référentiel du Collège français d’urologie décrit une polyurie parfois très abondante, une hypokaliémie et une déshydratation extracellulaire. Le médecin mesure donc la diurèse horaire, le poids, la pression et l’ionogramme dès les premières heures après le drainage.</p>
<div class="lab">Conduite</div><p data-evidence="N17-CL1014-093">La compensation est d’abord réalisée volume pour volume par voie intraveineuse, avec un soluté adapté à l’ionogramme, le plus souvent du chlorure de sodium isotonique ou du bicarbonate isotonique. Elle diminue progressivement les jours suivants à mesure que la fonction rénale se normalise. Une compensation prolongée sans réévaluation peut à l’inverse entretenir la polyurie.</p>
<div class="lab">Autres complications du drainage</div><p data-evidence="N17-CL1014-094">Le médecin surveille aussi le saignement ou l’infection au point d’entrée, le déplacement de la sonde et, après néphrostomie, une fistule artérioveineuse. Une créatinine qui ne baisse pas fait vérifier le bon fonctionnement du drainage et rechercher une cause associée.</p>
<p class="src">Source : <a href="https://www.urofrance.org/wp-content/uploads/2021/11/item-348-Insuffisance-renale-aigue.pdf" target="_blank" rel="noopener">Collège français d’urologie, item 348, complications de la dérivation urinaire</a>, consulté le 14 octobre 2026.</p></template>
<template data-pop="n17-aigu-chronique" data-title="Aigu, subaigu ou chronique : trancher devant une créatinine élevée">
<div class="lab">Trois catégories</div><p data-evidence="N17-CL1014-095"><button class="w" data-k="n17-criteres">KDIGO</button> 2012 distingue l’<button class="w" data-k="n17-criteres">IRA</button>, définie par une variation sur 48 heures ou sept jours, la maladie rénale aiguë dite « subaiguë », qui dure moins de trois mois, et la maladie rénale chronique, qui persiste plus de trois mois. Une maladie rénale aiguë sans <button class="w" data-k="n17-criteres">IRA</button> correspond par exemple à une baisse de filtration d’au moins 35 % ou à une hausse de créatinine de plus de 50 % installée sur moins de trois mois, sans franchir les délais de l’<button class="w" data-k="n17-criteres">IRA</button>.</p>
<div class="lab">Éléments discriminants</div><p data-evidence="N17-CL1014-096">La créatinine antérieure datée reste l’argument principal. Des reins petits, bilatéralement ou d’un seul côté, ou une asymétrie de taille orientent vers la chronicité, selon le tableau 13 de <button class="w" data-k="n17-criteres">KDIGO</button> ; une hydronéphrose, des kystes ou des calculs peuvent en revanche exister dans les deux situations. Le Collège français d’urologie ajoute qu’une anémie et une hypocalcémie orientent vers une maladie chronique sous-jacente ; ces indices restent toutefois non spécifiques, car une <button class="w" data-k="n17-criteres">IRA</button> peut aussi s’accompagner d’hémolyse ou d’hypocalcémie.</p>
<div class="lab">Diurèse</div><p data-evidence="N17-CL1014-097"><button class="w" data-k="n17-criteres">KDIGO</button> rappelle qu’une maladie rénale chronique, même sévère, ne provoque habituellement pas d’oligurie avant la dialyse. Une oligurie chez un patient chronique fait donc rechercher une <button class="w" data-k="n17-criteres">IRA</button> surajoutée. À l’inverse, une oligurie peut survenir sans baisse de filtration lorsque les apports d’eau et de solutés sont très faibles.</p>
<div class="lab">Fausse hausse</div><p data-evidence="N17-CL1014-098">Le triméthoprime ou la cimétidine réduisent la sécrétion tubulaire de créatinine et élèvent sa concentration sans baisse de filtration. La chronologie du médicament, l’absence d’autre anomalie et l’évolution à l’arrêt aident à conclure, sans écarter trop vite une véritable <button class="w" data-k="n17-criteres">IRA</button>.</p>
<p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" target="_blank" rel="noopener">KDIGO 2012, chapitre 2.5, tableaux 11, 13 et 14</a> ; <a href="https://www.urofrance.org/wp-content/uploads/2021/11/item-348-Insuffisance-renale-aigue.pdf" target="_blank" rel="noopener">Collège français d’urologie, item 348, préciser le caractère aigu</a>, consultés le 14 octobre 2026.</p></template>

<template data-pop="n17-salbutamol-alpha1" data-title="Salbutamol nébulisé : adjuvant et limites suisses"><p data-evidence="N17-ALPHA1-E03">UKKA 2023, recommandations 16.4.1–16.4.3, recommande 10–20 mg de salbutamol nébulisé en adjuvant de l’hyperkaliémie sévère ; il ne doit pas être utilisé seul. Ce schéma est distinct de la posologie du bronchospasme.</p><p data-evidence="N17-ALPHA1-E04">La notice suisse commune Ventolin, janvier 2026, identifie Ventolin Solution concentrée pour appareils aérosols, Swissmedic 37397, à 5 mg/mL (GTIN 7680373970242). Elle est réservée à l’inhalation et ne doit être ni injectée ni avalée. Ses indications concernent le bronchospasme et l’état de mal asthmatique : l’hyperkaliémie relève donc ici d’un usage hors indication. Le produit disponible, le dispositif, la préparation et la dose du protocole hospitalier sont vérifiés ; le Diskus et le nébuliseur-doseur ne se substituent pas à cette solution.</p><p data-evidence="N17-ALPHA1-E05">La notice contre-indique l’hypersensibilité et l’association aux bêtabloquants non sélectifs. Elle appelle à la prudence en cas de tachyarythmie ou de cardiopathie importante et décrit des risques de troubles métaboliques, dont l’hyperglycémie et l’acidose lactique. Le rythme, la réponse clinique et les résultats biologiques sont surveillés. Les doses de l’adulte ne sont pas transposées à l’enfant ou à la grossesse ; aucune adaptation rénale standard n’est déduite de cette notice.</p><p class="src">Sources : UKKA 2023, p.12–13, 16.4.1–16.4.3 ; information professionnelle suisse Ventolin, <a href="https://amiko.oddb.org/fr/fi?gtin=7680373970242" target="_blank" rel="noopener" data-reference-source="1">GlaxoSmithKline</a>, janvier 2026, composition, forme, indications, posologie, contre-indications et mises en garde ; AIPS via AmiKo, <a href="https://amiko.oddb.org/fr/fi?gtin=7680373970242">produit exact</a>, consultées le 15 octobre 2026.</p></template>
