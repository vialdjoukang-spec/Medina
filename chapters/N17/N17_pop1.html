<template data-pop="n17-criteres" data-title="Critères KDIGO 2012">
<div class="lab">Définition</div><p data-evidence="N17-C0001">L’<button class="w" data-k="n17-criteres">IRA</button> est définie par au moins un critère : une hausse de créatinine ≥ 26,5 µmol/L en 48 heures, une valeur ≥ 1,5 fois la référence sur sept jours, ou une diurèse &lt; 0,5 mL/kg/heure durant six heures. Le critère urinaire permet de reconnaître une atteinte avant une hausse mesurable de créatinine.</p>
<div class="lab">Application</div><p data-evidence="N17-C0002">Le médecin recherche la valeur stable antérieure et sa date. Il compare ensuite les deux créatinines et les volumes urinaires horodatés. Il attribue le stade le plus élevé établi par l’un des deux axes.</p>
<div class="lab">Arbitrage de référence</div><p data-evidence="N17-C0003">La position ERBP 2012 propose une créatinine d’admission comme référence. Elle se distingue de la comparaison avec une mesure stable antérieure ; une valeur déjà altérée à l’arrivée ne devient pas une valeur normale du patient. Le bundle Hôpitaux universitaires de Genève demande une référence et sa date. La référence la plus sûre reste donc une valeur stable antérieure connue ; lorsqu’elle manque, le médecin documente l’incertitude.</p>


<div class="lab">Limite</div><p data-evidence="N17-C0004">Une créatinine élevée isolée ne distingue pas une maladie aiguë d’une maladie chronique. Les seuils arrondis des documents opérationnels ne remplacent pas les limites de la recommandation primaire.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" target="_blank" rel="noopener">KDIGO 2012, définition et stades, section 2.1</a> ; <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3520085/fullTextXML" target="_blank" rel="noopener">Position européenne ERBP 2012, créatinine de référence</a> ; <a href="https://www.hug.ch/vdoc/HUG_000000849.pdf" target="_blank" rel="noopener">Bundle HUG, version 1.0 du 18.11.2022, référence datée</a>.</p></template>
<template data-pop="n17-stades" data-title="Stades KDIGO : tableau et lecture des deux axes">
<p data-evidence="N17-C0640">Le tableau ci-dessous classe la gravité, après confirmation de l’<button class="w" data-k="n17-criteres">IRA</button> et des délais diagnostiques. Un seul axe suffit ; si les axes diffèrent, on retient le plus élevé. Les quantités sont des seuils de classement, pas des intervalles de normalité.</p>
<table class="t"><thead><tr><th>Stade</th><th>Créatinine</th><th>Diurèse</th></tr></thead><tbody><tr><td data-evidence="N17-C0641">1</td>
<td data-evidence="N17-C0642">1,5–1,9 fois la référence, ou hausse≥26,5 µmol/L en 48 heures</td>
<td data-evidence="N17-C0643">Moins de 0,5 mL/kg/heure pendant 6–12 heures</td>
</tr><tr><td data-evidence="N17-C0644">2</td>
<td data-evidence="N17-C0645">2,0–2,9 fois la référence</td>
<td data-evidence="N17-C0646">Moins de 0,5 mL/kg/heure pendant au moins 12 heures</td>
</tr><tr><td data-evidence="N17-C0647">3</td>
<td data-evidence="N17-C0648">Au moins 3 fois la référence ; ou≥353,6 µmol/L dans une atteinte aiguë déjà définie ; ou début de suppléance rénale</td>
<td data-evidence="N17-C0649">Moins de 0,3 mL/kg/heure pendant au moins 24 heures, ou anurie pendant au moins 12 heures</td>
</tr></tbody></table>
<p data-evidence="N17-C0650">Les seuils ci-dessus concernent l’adulte. Chez les moins de 18 ans, <button class="w" data-k="n17-criteres">KDIGO</button> ajoute au stade 3 une baisse du débit estimé sous 35 mL/min/1,73 m² ; cette clause pédiatrique ne justifie pas de classer une <button class="w" data-k="n17-criteres">IRA</button> adulte par un débit automatique instable. Une baisse de créatinine après dialyse ne prouve pas une récupération du rein. Les <button class="w" data-k="n17-calcul-creatinine">calculs de variation et de rapport</button> et <button class="w" data-k="n17-calcul-diurese">le calcul de diurèse</button> détaillent les unités et leurs limites.</p>
<p class="src">Sources des passages et calculs : <a href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" target="_blank" rel="noopener">KDIGO : insuffisance rénale aiguë 2012, Kidney International Supplements 2</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>

<template data-pop="n17-creatinine" data-title="Créatinine sérique">
<div class="lab">Origine</div><p data-evidence="N17-C0008">La créatinine provient du métabolisme de la créatine, lié notamment à la masse musculaire. Elle est filtrée par le glomérule et également sécrétée par le tubule. Sa concentration dépend de sa production, de son élimination et du volume de distribution.</p>
<div class="lab">Interprétation</div><p data-evidence="N17-C0009">Une hausse tardive peut sous-estimer une atteinte récente. Une sarcopénie, une maladie hépatique ou un sepsis peuvent réduire sa production. Un remplissage peut diluer sa concentration. Le médecin suit la tendance et la diurèse, plutôt qu’une valeur prétendument normale.</p>
<div class="lab">Fausse hausse</div><p data-evidence="N17-C0010">Le triméthoprime ou la cimétidine peuvent inhiber la sécrétion tubulaire et augmenter la créatinine sans baisse correspondante de filtration. Cette possibilité ne dispense pas de rechercher une véritable <button class="w" data-k="n17-criteres">IRA</button>.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0011">L’intervalle de référence dépend du laboratoire et de sa méthode. Les critères <button class="w" data-k="n17-criteres">KDIGO</button> portent sur une variation et sa durée ; ils ne correspondent pas à une norme universelle de créatinine.</p>
</template>
<template data-pop="n17-diurese" data-title="Diurèse et oligurie">
<div class="lab">Mesure</div><p data-evidence="N17-C0012">Le <button class="w" data-k="n17-calcul-diurese">débit urinaire se calcule : volume ÷ (poids × durée)</button>. Le numérateur est le volume réellement recueilli, en millilitres ; le poids est en kilogrammes et la durée en heures. Avec 140 mL, 70 kg et huit heures, 140 ÷ (70 × 8) = 0,25 mL/kg/heure. Cet exemple est fictif.</p>
<div class="lab">Technique</div><p data-evidence="N17-C0013">Le recueil exige des heures fiables et la vérification de l’absence d’obstruction du dispositif. Une sonde urinaire n’est pas justifiée uniquement pour classer un patient stable qui peut effectuer un recueil fiable.</p>
<div class="lab">Limites</div><p data-evidence="N17-C0014">Les diurétiques modifient le débit sans prouver une récupération de filtration. Le poids œdémateux et les extrêmes de corpulence peuvent fausser le dénominateur. La position européenne ERBP propose le poids idéal lorsque ces situations rendent le calcul trompeur.</p>
<div class="lab">Conséquence</div><p data-evidence="N17-C0015">Le médecin compare le débit à sa durée. Une oligurie brève ne suffit pas à elle seule au stade 2. Une <button class="w" data-k="n17-criteres">IRA</button> peut aussi rester non oligurique.</p>
</template>
<template data-pop="n17-dfg" data-title="Filtration et estimation du débit">
<div class="lab">Distinction</div><p data-evidence="N17-C0016">La filtration glomérulaire est une fonction. Le débit estimé à partir de la créatinine est un calcul qui suppose une production et une concentration relativement stables.</p>
<div class="lab">Limite aiguë</div><p data-evidence="N17-C0017">Pendant une <button class="w" data-k="n17-criteres">IRA</button> évolutive, ces conditions ne sont pas réunies. Une valeur automatiquement calculée par le laboratoire peut donc surestimer ou sous-estimer la fonction actuelle.</p>
<div class="lab">Médicaments</div><p data-evidence="N17-C0018">Le médecin adapte les prescriptions aux concentrations disponibles, à l’évolution, à la diurèse et à une éventuelle suppléance. Il sollicite la pharmacie clinique pour les médicaments à marge étroite ; il ne transforme pas un débit instable en précision certaine.</p>
</template>
<template data-pop="n17-perfusion" data-title="Hypoperfusion rénale">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0019">Une perte de volume, un débit cardiaque insuffisant ou une vasodilatation peuvent diminuer la perfusion rénale. La baisse de filtration peut initialement survenir sans nécrose visible.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0020">Le médecin précise les vomissements, diarrhées, saignements, apports hydriques, pertes opératoires et traitements. Il examine simultanément la pression, les signes de perfusion et la congestion.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0021">Un déficit volémique justifie un cristalloïde isotonique et une réévaluation. Une congestion importante peut au contraire justifier une déplétion. L’oligurie seule ne choisit pas entre ces deux stratégies.</p>
</template>
<template data-pop="n17-congestion" data-title="Congestion et surcharge">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0022">Une pression veineuse élevée peut contribuer à une baisse de fonction rénale, même lorsque le volume total est excessif. Les œdèmes et la dyspnée imposent donc de rechercher une congestion avant de perfuser.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0023">Le médecin suit le poids, les entrées et sorties, les œdèmes, les signes veineux et l’auscultation pulmonaire. Il confronte ces éléments à la respiration et aux données hémodynamiques.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0024">Le furosémide peut traiter une surcharge chez un patient qui peut répondre au diurétique. Une surcharge ou un œdème pulmonaire réfractaires aux moyens médicaux imposent un avis immédiat pour suppléance. La créatinine seule ne décide pas.</p>
</template>
<template data-pop="n17-tubule" data-title="Atteinte tubulaire aiguë">
<div class="lab">Histologie</div><p data-evidence="N17-C0025">L’atteinte tubulaire aiguë peut comporter une dilatation, un épithélium aplati, une perte de bordure en brosse et des cellules détachées. Une véritable nécrose cellulaire est une lésion plus précise ; elle n’est pas obligatoire dans toute <button class="w" data-k="n17-criteres">IRA</button>.</p>
<div class="lab">Origines</div><p data-evidence="N17-C0026">Une ischémie, une exposition toxique ou des pigments peuvent léser les tubules. Des maladies glomérulaires, interstitielles ou microvasculaires peuvent également entraîner une atteinte tubulaire secondaire.</p>
<div class="lab">Examens et limites</div><p data-evidence="N17-C0027">Le sédiment peut montrer des cellules tubulaires et des cylindres granulaires. Ces éléments orientent mais ne déterminent pas seuls la cause. Une biopsie est conditionnelle lorsque son résultat modifierait une prise en charge spécialisée.</p>
</template>
<template data-pop="n17-corticale" data-title="Nécrose corticale">
<div class="lab">Définition</div><p data-evidence="N17-C0028">La nécrose corticale désigne une destruction ischémique du cortex, qui peut atteindre de nombreux tubules. Elle se distingue de lésions tubulaires aiguës moins destructrices.</p>
<div class="lab">Contexte</div><p data-evidence="N17-C0029">Une atteinte microvasculaire sévère peut s’accompagner d’ischémie et de lésions tubulaires. Une <button class="w" data-k="n17-criteres">IRA</button> sévère persistante, particulièrement dans un contexte obstétrical ou microangiopathique, nécessite une évaluation spécialisée.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0030">Le stade biologique ne prouve pas une nécrose corticale. La qualification anatomopathologique exige une argumentation spécifique ; le médecin ne déduit pas une lésion irréversible d’une créatinine élevée.</p>
</template>
<template data-pop="n17-obstruction" data-title="Obstruction urinaire">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0031">Un obstacle élève la pression en amont et réduit la filtration. Une obstruction bilatérale, ou celle d’un rein fonctionnel unique, peut compromettre la fonction rénale globale.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0032">Le médecin recherche une rétention vésicale, un calcul, des troubles mictionnels, une hématurie et un cancer pelvien. Une échographie examine les voies excrétrices et la vessie.</p>
<div class="lab">Piège</div><p data-evidence="N17-C0033">Une dilatation peut manquer au début, en cas de déshydratation ou de fibrose rétropéritonéale. Une échographie non dilatée ne clôt donc pas une forte suspicion.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0034">Une obstruction infectée, bilatérale ou touchant un rein unique impose un avis urologique immédiat. La dérivation est choisie selon le siège : drainage vésical, sonde urétérale ou néphrostomie.</p>
</template>
<template data-pop="n17-papillaire" data-title="Nécrose papillaire et obstacle">
<div class="lab">Présentation</div><p data-evidence="N17-C0035">Une nécrose papillaire aiguë peut former un obstacle intraluminal urétéral. Elle appartient au diagnostic différentiel d’une obstruction ; un calcul n’est pas l’unique cause possible.</p>
<div class="lab">Démarche</div><p data-evidence="N17-C0036">Le médecin étudie le siège de l’obstacle et le retentissement sur le ou les reins fonctionnels. Les signes infectieux et les complications de l’<button class="w" data-k="n17-criteres">IRA</button> déterminent l’urgence urologique.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0037">Le mécanisme obstructif décrit ici ne démontre pas à lui seul une nécrose médullaire diffuse. Une lésion papillaire, une nécrose corticale et une atteinte tubulaire ne sont pas des diagnostics interchangeables.</p>
</template>
<template data-pop="n17-glomerule" data-title="Atteinte glomérulaire">
<div class="lab">Indices</div><p data-evidence="N17-C0038">Une hématurie et une protéinurie sans infection urinaire évidente font évoquer une néphrite. Des hématies dysmorphiques ou des cylindres érythrocytaires renforcent cette orientation.</p>
<div class="lab">Urgence</div><p data-evidence="N17-C0039">Une progression rapide, un sédiment actif ou une cause immunologique possible imposent une discussion néphrologique précoce. Le spécialiste choisit les sérologies et la biopsie selon l’hypothèse.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0040">Une bandelette positive pour le sang peut aussi signaler une myoglobine ou une hémoglobine. Le sédiment et le contexte évitent de confondre une pigmentation avec une hématurie glomérulaire.</p>
</template>
<template data-pop="n17-interstitielle" data-title="Néphrite interstitielle">
<div class="lab">Origine</div><p data-evidence="N17-C0041">Des médicaments et des infections peuvent provoquer une inflammation interstitielle accompagnée d’<button class="w" data-k="n17-criteres">IRA</button>. Les inhibiteurs de la pompe à protons et certains antibiotiques font partie des expositions à rechercher.</p>
<div class="lab">Indices</div><p data-evidence="N17-C0042">Une leucocyturie, des cylindres leucocytaires ou une éosinophilie peuvent orienter. Ils ne suffisent pas à confirmer la maladie ni à l’écarter lorsqu’ils manquent.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0043">Le médecin précise le début de chaque exposition, revoit le médicament suspect et contacte le néphrologue. Une biopsie peut être utile lorsque le diagnostic modifierait le traitement ; une corticothérapie n’est pas automatique.</p>
</template>
<template data-pop="n17-microangiopathie" data-title="Microangiopathie thrombotique">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0044">Une lésion endothéliale et des thrombi microvasculaires peuvent provoquer une ischémie rénale. L’atteinte tubulaire peut être secondaire à ces lésions vasculaires.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0045">Une thrombopénie, des schizocytes, une hausse de lactate déshydrogénase et une baisse d’haptoglobine orientent vers une hémolyse microangiopathique. Leur absence isolée n’exclut pas toutes les formes rénales.</p>
<div class="lab">Conséquence</div><p data-evidence="N17-C0046">L’<button class="w" data-k="n17-criteres">IRA</button> associée à cette suspicion relève d’une discussion urgente avec néphrologie et hématologie. Le contexte obstétrical, les médicaments et les maladies sous-jacentes orientent le bilan.</p>
</template>
<template data-pop="n17-rhabdo" data-title="Rhabdomyolyse">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0047">Une destruction musculaire libère de la myoglobine. Filtrée, celle-ci peut contribuer à des cylindres, à une toxicité liée à l’hème et à une diminution de perfusion. L’hypovolémie et l’ischémie aggravent le risque.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0048">Le médecin demande les efforts intenses, traumatismes, immobilisations et expositions toxiques. Il dose la créatine kinase selon le contexte. Une bandelette positive pour le sang avec peu d’hématies évoque un pigment.</p>
<div class="lab">Piège</div><p data-evidence="N17-C0049">La triade de douleurs musculaires, faiblesse et urines foncées peut manquer. Un résultat tardif de créatine kinase se confronte à la chronologie ; il ne suffit pas à exclure une atteinte antérieure.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0050">Le bilan cherche aussi les complications potassiques et l’état volémique. Le remplissage se réévalue ; une oligo-anurie ou une congestion empêchent une perfusion indifférenciée.</p>
</template>
<template data-pop="n17-cristaux" data-title="Cristaux et cylindres protéiques">
<div class="lab">Mécanisme</div><p data-evidence="N17-C0051">Des cristaux ou des protéines peuvent s’accumuler dans les tubules et contribuer à leur obstruction ou à une inflammation. La présence de cristaux dans une urine ne démontre pas nécessairement une lésion rénale.</p>
<div class="lab">Contextes</div><p data-evidence="N17-C0052">Les expositions, une lyse tumorale, une maladie lithiasique et une suspicion de myélome orientent la recherche. Dans le myélome, des chaînes légères peuvent former des cylindres et léser les tubules.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0053">Le médecin choisit les examens à partir du contexte, puis demande un avis spécialisé. L’identification de la cause importe davantage qu’une simple désignation de « nécrose tubulaire ».</p>
</template>
<template data-pop="n17-sepsis" data-title="Sepsis et risque rénal">
<div class="lab">Contexte</div><p data-evidence="N17-C0054">Le sepsis expose à l’<button class="w" data-k="n17-criteres">IRA</button>, par plusieurs mécanismes circulatoires, microvasculaires et inflammatoires. Une pression apparemment corrigée ne prouve pas une récupération rénale.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0055">Le médecin cherche le foyer, suit la perfusion, la diurèse et la créatinine, et revoit les traitements éliminés par le rein.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0056">La prise en charge traite l’infection et soutient l’hémodynamique. Le choix et la posologie de l’anti-infectieux suivent le foyer et son information professionnelle, avec l’aide de la pharmacie lorsque la fonction rénale évolue.</p>
</template>
<template data-pop="n17-atcd" data-title="Antécédents qui modifient le risque">
<div class="lab">Questions</div><p data-evidence="N17-C0057">Le médecin recherche une maladie rénale chronique, une <button class="w" data-k="n17-criteres">IRA</button> antérieure, un diabète, une insuffisance cardiaque, une maladie hépatique ou une transplantation. Il demande aussi les comptes rendus et les créatinines antérieures.</p>
<div class="lab">Conséquence</div><p data-evidence="N17-C0058">Ces antécédents augmentent le risque ou modifient l’interprétation. Une créatinine chronique élevée n’empêche pas une <button class="w" data-k="n17-criteres">IRA</button> surajoutée ; une maladie rénale stable ne doit pas expliquer sans examen toute nouvelle hausse.</p>
<div class="lab">Orientation</div><p data-evidence="N17-C0059">Un rein transplanté, une maladie rénale chronique avancée ou une cause incertaine justifient une discussion spécialisée rapide.</p>
</template>
<template data-pop="n17-medicaments" data-title="Revue des médicaments">
<div class="lab">Recueil</div><p data-evidence="N17-C0060">Le médecin demande les traitements prescrits, les changements récents, les produits sans ordonnance et les préparations de phytothérapie. Il relève les dernières doses, pas seulement les noms.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0061">Il distingue une toxicité directe, un effet hémodynamique et une accumulation secondaire à l’<button class="w" data-k="n17-criteres">IRA</button>. Il suspend un produit néphrotoxique si le bénéfice-risque le permet, puis adapte les médicaments éliminés par le rein.</p>
<div class="lab">Réévaluation</div><p data-evidence="N17-C0062">Une interruption temporaire a une raison et un plan de reprise. Les bloqueurs du système rénine–angiotensine se discutent particulièrement lors de vomissements, diarrhées ou sepsis ; leur arrêt définitif n’est pas une règle de l’<button class="w" data-k="n17-criteres">IRA</button>.</p>
</template>
<template data-pop="n17-ains" data-title="Anti-inflammatoires non stéroïdiens">
<div class="lab">Risque</div><p data-evidence="N17-C0063">Les anti-inflammatoires non stéroïdiens font partie des médicaments qui peuvent provoquer ou aggraver une <button class="w" data-k="n17-criteres">IRA</button>. Une hypovolémie, une maladie rénale ou une association avec d’autres traitements augmentent la vulnérabilité.</p>
<div class="lab">Recherche</div><p data-evidence="N17-C0064">Le médecin demande explicitement les antalgiques sans ordonnance. Le patient peut ne pas considérer un produit acheté librement comme un traitement.</p>
<div class="lab">Conduite</div><p data-evidence="N17-C0065">L’exposition est revue pendant l’<button class="w" data-k="n17-criteres">IRA</button>. Une alternative dépend de l’indication et du patient ; aucune substitution médicamenteuse universelle n’existe.</p>
</template>
<template data-pop="n17-symptomes" data-title="Symptômes et formes silencieuses">
<div class="lab">Caractérisation</div><p data-evidence="N17-C0066">Le médecin précise la baisse des urines, les pertes digestives, les apports, la dyspnée, les douleurs lombaires, la fièvre et les troubles mictionnels. Il situe chaque symptôme dans le temps.</p>
<div class="lab">Interprétation</div><p data-evidence="N17-C0067">La maladie causale peut dominer le tableau. L’<button class="w" data-k="n17-criteres">IRA</button> peut rester non oligurique, ou être révélée uniquement par la créatinine. Une diurèse conservée n’exclut donc pas la maladie.</p>
<div class="lab">Conséquence</div><p data-evidence="N17-C0068">Une douleur avec fièvre et obstacle possible évoque une infection obstructive. Une dyspnée avec congestion ou une confusion dans une <button class="w" data-k="n17-criteres">IRA</button> sévère impose une recherche urgente de complication.</p>
</template>
<template data-pop="n17-vitals" data-title="Signes vitaux et perfusion">
<div class="lab">Examen</div><p data-evidence="N17-C0069">Le médecin évalue l’état de conscience, la pression, le pouls, la respiration et l’oxygénation. Il recherche ensuite des indices de perte de volume ou de congestion et suit leur évolution.</p>
<div class="lab">Valeur</div><p data-evidence="N17-C0070">Une hypotension ou des signes d’hypoperfusion orientent vers un mécanisme circulatoire. Une hypertension avec œdèmes et sédiment actif peut orienter vers une maladie glomérulaire.</p>
<div class="lab">Piège</div><p data-evidence="N17-C0071">Une seule pression artérielle ne décrit pas la perfusion rénale ni le volume circulant. Le choix entre remplissage, déplétion et vasopresseur exige une confrontation clinique.</p>
</template>
<template data-pop="n17-poids" data-title="Poids et bilan hydrique">
<div class="lab">Mesure</div><p data-evidence="N17-C0072">Le poids récent, les apports, les pertes et les volumes urinaires permettent d’évaluer l’évolution. Les Hôpitaux universitaires de Genève demandent une appréciation de la volémie et du poids dans leur bundle <button class="w" data-k="n17-criteres">IRA</button>.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0073">Un bilan incomplet oublie facilement des apports médicamenteux ou des pertes. Le poids peut être excessif à cause d’œdèmes et fausser le calcul du débit urinaire par kilogramme.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0074">Une prise de poids avec congestion peut conduire à limiter les apports et à dépléter. Une perte hydrique documentée peut justifier un remplissage, suivi d’une réévaluation clinique.</p>
</template>
<template data-pop="n17-sediment" data-title="Sédiment urinaire">
<div class="lab">Technique</div><p data-evidence="N17-C0075">La microscopie urinaire complète la bandelette. L’expérience de l’opérateur et le contexte de prélèvement influencent l’interprétation.</p>
<div class="lab">Lecture</div><p data-evidence="N17-C0076">Les cellules tubulaires et cylindres granulaires orientent vers une atteinte tubulaire. Les hématies dysmorphiques et cylindres érythrocytaires orientent vers le glomérule. Les cylindres leucocytaires peuvent accompagner une atteinte interstitielle ou une pyélonéphrite.</p>
<div class="lab">Limite</div><p data-evidence="N17-C0077">Les cylindres hyalins peuvent apparaître sans maladie organique spécifique. Une bactériurie peut correspondre à une infection ou à une colonisation ; elle s’interprète avec les symptômes.</p>
<p data-evidence="N17-C0681">Le tableau complète la lecture des cellules, cylindres et cristaux de la synthèse suisse. Les observations sont des orientations morphologiques, pas des valeurs numériques normales. Un élément inattendu est confirmé et confronté à la clinique, aux symptômes et au prélèvement.</p>
<table class="t"><thead><tr><th>Élément</th><th>Sens possible</th><th>Limite</th></tr></thead><tbody><tr><td data-evidence="N17-C0682">Hématies normomorphes</td>
<td data-evidence="N17-C0683">Origine urologique possible.</td>
<td data-evidence="N17-C0684">Une forme ne localise pas toujours seule le saignement.</td>
</tr><tr><td data-evidence="N17-C0685">Leucocytes</td>
<td data-evidence="N17-C0686">Atteinte interstitielle ou des voies urinaires.</td>
<td data-evidence="N17-C0687">La leucocyturie n’est pas spécifique.</td>
</tr><tr><td data-evidence="N17-C0688">Cellules urothéliales ou squameuses</td>
<td data-evidence="N17-C0689">Pas d’information spécifique sur une <button class="w" data-k="n17-criteres">IRA</button> dans cette synthèse.</td>
<td data-evidence="N17-C0690">La qualité du recueil reste à apprécier.</td>
</tr><tr><td data-evidence="N17-C0691">Cylindres hyalins</td>
<td data-evidence="N17-C0692">Matrice protéique d’uromoduline, liée notamment à densité et <button class="w" data-k="n17-acidobase">pH (contexte et lecture)</button>.</td>
<td data-evidence="N17-C0693">Pas de cause organique spécifique démontrée.</td>
</tr><tr><td data-evidence="N17-C0694">Cylindres cireux ou lipidiques</td>
<td data-evidence="N17-C0695">Peuvent accompagner une protéinurie.</td>
<td data-evidence="N17-C0696">Interprétation spécialisée, sans cause unique déduite.</td>
</tr><tr><td data-evidence="N17-C0697">Bactéries ou levures</td>
<td data-evidence="N17-C0698">Infection ou colonisation.</td>
<td data-evidence="N17-C0699">Le médecin confronte le résultat aux symptômes et à la culture, si elle est indiquée.</td>
</tr><tr><td data-evidence="N17-C0700">Cristaux d’urate, oxalate, phosphate ou médicament</td>
<td data-evidence="N17-C0701">Présence possible dans une urine normale ou une cristallopathie.</td>
<td data-evidence="N17-C0702">Le contexte et l’atteinte rénale font la différence.</td>
</tr><tr><td data-evidence="N17-C0703">Cristaux de cholestérol ou de cystine</td>
<td data-evidence="N17-C0704">Cholestérol : protéinurie ou embolie possible ; cystine : trouble génétique et obstruction possible.</td>
<td data-evidence="N17-C0705">Ces morphologies pathologiques justifient une identification experte et une recherche ciblée.</td>
</tr></tbody></table>

<div class="lab">Décision</div><p data-evidence="N17-C0078">Un sédiment actif ou une aggravation rapide justifient l’avis néphrologique. Le sédiment oriente la cause ; il ne remplace pas les critères de gravité de l’<button class="w" data-k="n17-criteres">IRA</button>.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.revmed.ch/revue-medicale-suisse/2017/revue-medicale-suisse-573/insuffisance-renale-aigue-en-2017-prise-en-charge-dans-un-hopital-non-universitaire-un-exemple-de-collaboration-interprofessionnelle" target="_blank" rel="noopener">Revue médicale suisse 2017</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-bandelette" data-title="Bandelette urinaire">
<div class="lab">Question</div><p data-evidence="N17-C0079">La bandelette recherche le sang, les protéines, les leucocytes, les nitrites et le glucose. Elle appartient au bilan initial recommandé.</p>
<div class="lab">Piège</div><p data-evidence="N17-C0080">Le résultat « sang » peut refléter des hématies ou un pigment. Une protéinurie qualitative doit être complétée lorsque le contexte nécessite une quantification.</p>
<div class="lab">Décision</div><p data-evidence="N17-C0081">Une hématurie et une protéinurie sans explication infectieuse conduisent à envisager une néphrite. Le sédiment et les rapports protéine/créatinine et albumine/créatinine affinent l’orientation dans la démarche suisse des Hôpitaux universitaires de Genève.</p>
</template>
<template data-pop="n17-ultrason" data-title="Échographie rénale et vésicale">
<div class="lab">Référence</div><p data-evidence="N17-C0082">L’échographie est l’examen initial de référence pour rechercher un obstacle des voies urinaires. Elle ne constitue pas un examen universel de confirmation de toutes les causes d’<button class="w" data-k="n17-criteres">IRA</button>.</p>
<div class="lab">Délais</div><p data-evidence="N17-C0083">La recommandation britannique 148 recommande un examen dans les six heures si une pyonéphrose est suspectée, et dans les 24 heures si la cause est inconnue ou si le patient risque une obstruction. Le bundle Hôpitaux universitaires de Genève inclut un ultrason dans son parcours hospitalier.</p>
<div class="lab">Limites</div><p data-evidence="N17-C0084">Une obstruction précoce, une déshydratation ou une fibrose rétropéritonéale peuvent limiter la dilatation. Le clinicien poursuit l’exploration si la suspicion reste forte.</p>
<div class="lab">Arbitrage</div><p data-evidence="N17-C0085">La recommandation britannique 148 ne demande pas d’échographie systématique lorsque la cause est déjà identifiée. La pratique Hôpitaux universitaires de Genève est une mesure institutionnelle plus large ; les deux périmètres sont indiqués et ne deviennent pas une contradiction masquée.</p>
</template>
<template data-pop="n17-biopsie" data-title="Biopsie rénale">
<div class="lab">Statut</div><p data-evidence="N17-C0086">La biopsie est l’examen de référence pour caractériser certaines lésions parenchymateuses. Elle est conditionnelle ; elle n’est pas le « gold standard » obligatoire de toute <button class="w" data-k="n17-criteres">IRA</button>.</p>
<div class="lab">Indications</div><p data-evidence="N17-C0087">Un sédiment actif, une maladie inflammatoire possible, une cause incertaine ou une évolution défavorable peuvent conduire le néphrologue à la proposer. Son résultat doit pouvoir modifier la conduite.</p>
<div class="lab">Interprétation</div><p data-evidence="N17-C0088">La biopsie distingue notamment les lésions glomérulaires, interstitielles, vasculaires et tubulaires. Une lésion tubulaire aiguë ne démontre pas à elle seule la cause, ni l’absence d’une atteinte associée.</p>
</template>
<template data-pop="n17-fen" data-title="Fraction excrétée du sodium : formule, unités et limites">
<p data-evidence="N17-C0636"><b>But et limites.</b> La fraction excrétée du sodium estime la part du sodium filtré éliminée dans l’urine. Diurétiques, sepsis, congestion, maladie rénale chronique et apports en modifient la valeur. Les seuils historiques proviennent de groupes sélectionnés ; le résultat ne choisit pas seul un remplissage.</p>
<p data-evidence="N17-C0637"><b>Formule.</b> FENa (%) =100 ×(sodium urinaire ×créatinine plasmatique)/(sodium plasmatique ×créatinine urinaire). Les deux sodiums doivent être dans la même unité, et les deux créatinines également. On utilise des prélèvements rapprochés dans un contexte documenté ; les unités s’annulent avant la multiplication par 100.</p>
<p data-evidence="N17-C0638"><b>Étapes, exemple fictif.</b> Sodium urinaire 20 et plasmatique 140 mmol/L ; créatinine plasmatique 200 µmol/L et urinaire 10 mmol/L =10000 µmol/L. FENa =100 ×(20 × 200)/(140 × 10000) =0,286 %, arrondi 0,29 %. Oublier la conversion de créatinine donne un résultat mille fois trop grand.</p>
<p data-evidence="N17-C0639"><b>Interprétation.</b> Une conservation du sodium ne démontre pas l’absence de lésion tubulaire ; une excrétion accrue sous diurétique n’établit pas une nécrose. La chronologie, le sédiment, l’hémodynamique et la recherche d’obstacle gardent la priorité. Il n’existe pas ici d’intervalle suisse « normal » transposable à tous les patients avec <button class="w" data-k="n17-criteres">IRA</button>.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.revmed.ch/revue-medicale-suisse/2017/revue-medicale-suisse-573/insuffisance-renale-aigue-en-2017-prise-en-charge-dans-un-hopital-non-universitaire-un-exemple-de-collaboration-interprofessionnelle" target="_blank" rel="noopener">Revue médicale suisse 2017</a> ; <a href="https://www.msdmanuals.com/fr/professional/n%C3%A9phrologie/prise-en-charge-du-patient-pr%C3%A9sentant-des-troubles-r%C3%A9naux/%C3%A9valuation-du-patient-pr%C3%A9sentant-des-troubles-r%C3%A9naux" target="_blank" rel="noopener">Manuel médical professionnel : évaluation rénale</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>

<template data-pop="n17-calcul-creatinine" data-title="Créatinine : concentration, variation, rapport et conversion">
<p data-evidence="N17-C0523"><b>But.</b> Le médecin compare une créatinine récente à une valeur stable antérieure datée. La concentration exprime une quantité de créatinine par litre ; elle ne mesure pas directement le débit de filtration.</p>
<p data-evidence="N17-C0524"><b>Hausse absolue.</b> Créatinine récente − référence, dans la même unité. Exemple fictif : 210 − 80 = 130 µmol/L en 48 heures. Ce résultat dépasse la hausse diagnostique de 26,5 µmol/L en 48 heures.</p>
<p data-evidence="N17-C0525"><b>Rapport.</b> Créatinine récente ÷ référence. Les unités identiques s’annulent : 210 ÷ 80 = 2,625. Ce rapport, sans unité, se situe dans l’intervalle de stade 2 (2,0–2,9). Il faut vérifier les délais puis comparer aussi la diurèse.</p>
<p data-evidence="N17-C0526"><b>Conversion.</b> Pour la créatinine, 1 milligramme par décilitre correspond à 88,4 µmol/L dans les équivalences <button class="w" data-k="n17-criteres">KDIGO</button>. Pour passer en µmol/L, on multiplie par 88,4 : 5 × 88,4 =442 µmol/L. Pour l’inverse, on divise : 210 ÷ 88,4 ≈2,38 milligrammes par décilitre. Le coefficient appartient à la créatinine et ne se transpose pas au glucose.</p>
<p data-evidence="N17-C0527"><b>Limites.</b> La masse musculaire, les apports de viande ou créatine et des interférences analytiques influencent la concentration. La référence du laboratoire ne remplace pas la référence personnelle ; le débit estimé devient peu fiable hors équilibre.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.viollier.ch/fr/analysis/7190" target="_blank" rel="noopener">Viollier : fiche du paramètre correspondant</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-calcul-diurese" data-title="Diurèse : unités, recueil, poids et durée">
<p data-evidence="N17-C0528"><b>Base.</b> Un débit est un volume rapporté à une durée. La normalisation par le poids permet de comparer le recueil aux critères <button class="w" data-k="n17-criteres">KDIGO</button> : diurèse = volume (mL) ÷ [poids (kg) × durée (heures)].</p>
<p data-evidence="N17-C0529"><b>Étapes.</b> Dans le cas fictif initial, 0,35 mL/kg/heure × 70 kg =24,5 mL/heure ; sur 14 heures, cela représente 343 mL si le débit est constant. À l’inverse, 343 ÷(70 × 14)=0,35 mL/kg/heure. Le débit inférieur à 0,5 pendant au moins 12 heures établit un stade 2.</p>
<p data-evidence="N17-C0530"><b>Contrôle.</b> Le médecin vérifie le début et la fin du recueil, les pertes, la rétention et une sonde éventuellement obstruée. Il n’installe pas une sonde seulement pour obtenir ce chiffre si elle n’est pas indiquée. La position européenne préconise des blocs de recueil de 6–8 heures et un poids idéal si la corpulence ou les œdèmes rendent le poids réel trompeur.</p>
<p data-evidence="N17-C0531"><b>Interprétation.</b> Une diurèse au-dessus du seuil d’oligurie n’est pas une preuve de filtration normale. Les apports et les diurétiques modifient les urines ; le stade reste fondé sur l’axe le plus sévère. Il n’existe pas un volume quotidien « normal » identique pour tous les apports et tous les patients.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC3520085/fullTextXML" target="_blank" rel="noopener">European Renal Best Practice position statement, 2012</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>

olalité sérique</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-jugulaire" data-title="Jugulaire : reconnaître, mesurer et interpréter">
<p data-evidence="N17-C0620"><b>Geste.</b> Le patient relâche son cou ; le médecin adapte l’inclinaison du lit et éclaire tangentiellement pour voir la pulsation veineuse jugulaire. Elle varie avec la respiration et n’est pas palpable comme l’artère carotide. Le niveau le plus haut est repéré verticalement par rapport à l’angle sternal ; on note la position du patient.</p>
<p data-evidence="N17-C0621"><b>Valeur.</b> Ajouter approximativement 5 cm à la hauteur au-dessus de l’angle sternal estime une hauteur par rapport à l’oreillette droite, en centimètres d’eau. Cette estimation dépend de la position et de la visibilité. Elle soutient l’évaluation de congestion, sans mesurer directement le volume total du corps. Une veine non visible est « non visualisée », pas une preuve de pression basse.</p>
<p data-evidence="N17-C0622"><b>Piège.</b> Œdèmes et élévation jugulaire peuvent coexister avec une perfusion rénale insuffisante. Le médecin les confronte à la pression, aux pertes, au poids, au poumon et à l’échographie avant de prescrire un remplissage.</p>
<p class="src">Sources des passages et calculs : <a href="https://med.stanford.edu/stanfordmedicine25/the25/neck-exam-jugular-venous-pressure-measurement.html" target="_blank" rel="noopener">Université Stanford : examen jugulaire</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2017/revue-medicale-suisse-573/insuffisance-renale-aigue-en-2017-prise-en-charge-dans-un-hopital-non-universitaire-un-exemple-de-collaboration-interprofessionnelle" target="_blank" rel="noopener">Revue médicale suisse 2017</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-oedeme" data-title="Œdèmes : godet, distribution et limites">
<p data-evidence="N17-C0623"><b>Geste.</b> Le médecin compare les deux membres, leur étendue, chaleur, rougeur et douleur. Une pression du doigt sur une zone œdématiée recherche une dépression persistante : le godet. Le résultat est décrit avec son siège, sa symétrie et son évolution ; le poids et le bilan hydrique l’accompagnent.</p>
<p data-evidence="N17-C0624"><b>Valeur et piège.</b> Un œdème traduit du liquide interstitiel, pas nécessairement un excès de volume circulant efficace. Une insuffisance cardiaque, une maladie hépatique, une protéinurie ou une cause locale demandent des raisonnements différents. L’absence de godet ne suffit pas à exclure toute rétention hydrique.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.msdmanuals.com/fr/professional/troubles-cardiovasculaires/sympt%C3%B4mes-des-maladies-cardiovasculaires/%C5%93d%C3%A8me" target="_blank" rel="noopener">Manuel médical professionnel : œdèmes</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-poumon" data-title="Poumon : percussion, auscultation et interprétation">
<p data-evidence="N17-C0625"><b>Geste.</b> Le médecin examine la respiration et compare les deux côtés à la percussion puis à l’auscultation. Les crépitants sont des bruits discontinus ; une matité à la percussion peut orienter vers un épanchement. Le médecin associe l’écoute à la fréquence respiratoire, au travail ventilatoire et à l’oxygénation.</p>
<p data-evidence="N17-C0626"><b>Valeur et piège.</b> Des crépitants peuvent soutenir une congestion pulmonaire mais apparaissent aussi dans une atélectasie ou une fibrose. La distribution, la chronologie et l’imagerie aident à trancher. Une auscultation seule ne valide ni un remplissage ni une déplétion.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.msdmanuals.com/fr/professional/troubles-cardiovasculaires/prise-en-charge-du-patient-cardiaque/examen-cardiovasculaire" target="_blank" rel="noopener">Manuel médical professionnel : examen cardiovasculaire</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-vessie" data-title="Rétention : examen sus-pubien et confirmation">
<p data-evidence="N17-C0627"><b>Geste.</b> Le médecin interroge le patient sur la dernière miction, les douleurs et la sensation de vidange. Une inspection, palpation et percussion sus-pubiennes recherchent une vessie distendue ; la douleur ou la matité soutiennent une rétention. Le médecin vérifie également qu’une sonde déjà présente n’est pas obstruée.</p>
<p data-evidence="N17-C0628"><b>Valeur et piège.</b> Un examen abdominal peu contributif n’exclut pas un obstacle. La mesure échographique vésicale et l’échographie des voies urinaires répondent à la question anatomique. Un obstacle infecté ou sur rein unique impose une orientation urgente, sans attendre une masse palpable.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.msdmanuals.com/fr/professional/n%C3%A9phrologie/prise-en-charge-du-patient-pr%C3%A9sentant-des-troubles-r%C3%A9naux/%C3%A9valuation-du-patient-pr%C3%A9sentant-des-troubles-r%C3%A9naux" target="_blank" rel="noopener">Manuel médical professionnel : évaluation rénale</a> ; <a href="https://www.nice.org.uk/guidance/ng148/chapter/Recommendations" target="_blank" rel="noopener">Recommandation britannique 148, publiée 18.12.2019, actualisée 16.10.2024</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-calcul-urine" data-title="Rapports urinaires : albumine ou protéines sur créatinine">
<p data-evidence="N17-C0631"><b>Bases.</b> Un rapport urinaire divise une concentration de protéine par celle de créatinine dans le même échantillon. Il atténue l’effet de dilution de l’urine ; il ne mesure pas directement une masse éliminée en 24 heures. Le rapport albumine/créatinine et le rapport protéines totales/créatinine sont deux rapports distincts.</p>
<p data-evidence="N17-C0632"><b>Calcul d’albumine, exemple fictif.</b> Albumine 30 mg/L et créatinine urinaire 10 mmol/L :30 ÷ 10 =3 mg/mmol. Les litres s’annulent. Il faut convertir les unités avant de diviser ; une créatinine plasmatique ne remplace pas celle de cette urine. Viollier donne un rapport de référence inférieur à 3 mg/mmol, de préférence sur la deuxième urine du matin.</p>
<p data-evidence="N17-C0633"><b>Protéines totales, exemple fictif.</b>200 mg/L ÷ 10 mmol/L =20 mg/mmol. La référence Viollier est inférieure à 15 mg/mmol pour ce rapport, sur l’urine du matin. Ce résultat ne devient pas un rapport albumine/créatinine de 20 : les protéines mesurées ne sont pas les mêmes.</p>
<p data-evidence="N17-C0634"><b>Limites.</b> Une masse musculaire très basse modifie l’excrétion de créatinine et peut modifier le rapport. Exercice, contexte aigu et prélèvement sont documentés. Une anomalie est réévaluée selon sa cause ; elle ne prouve pas à elle seule une lésion glomérulaire ni une chronicité de trois mois.</p>
<p class="src">Sources des passages et calculs : <a href="https://www.viollier.ch/fr/analysis/16140" target="_blank" rel="noopener">Viollier : fiche du paramètre correspondant</a> ; <a href="https://www.viollier.ch/fr/analysis/14624" target="_blank" rel="noopener">Viollier : fiche du paramètre correspondant</a> ; <a href="https://www.msdmanuals.com/fr/professional/n%C3%A9phrologie/prise-en-charge-du-patient-pr%C3%A9sentant-des-troubles-r%C3%A9naux/%C3%A9valuation-du-patient-pr%C3%A9sentant-des-troubles-r%C3%A9naux" target="_blank" rel="noopener">Manuel médical professionnel : évaluation rénale</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
<template data-pop="n17-normalite-ciblee" data-title="Examens ciblés : références suisses et sens clinique">
<p data-evidence="N17-C0706"><b>Créatine kinase.</b> Viollier : chez les≥19 ans,34–145 unités/L chez la femme et 46–171 chez l’homme, dosage sérique enzymatique. Une hausse est confrontée à la lésion musculaire et à sa chronologie ; elle ne mesure pas directement le débit rénal.</p>
<p data-evidence="N17-C0707"><b>Lactate déshydrogénase.</b>125–220 unités/L chez les femmes et les hommes, sans tranche d’âge explicitée sur cette fiche. Après coagulation, le tube est centrifugé immédiatement. La valeur contribue au bilan d’hémolyse ; elle ne démontre pas seule une microangiopathie.</p>
<p data-evidence="N17-C0708"><b>Plaquettes.</b>150–450 milliards/L chez les femmes et les hommes, selon la fiche suisse. Une baisse, associée à des schizocytes et aux marqueurs d’hémolyse, peut orienter une microangiopathie ; le prélèvement et les autres causes de thrombopénie sont évalués.</p>
<p data-evidence="N17-C0709"><b>Excès de bases.</b> Viollier :−2 à+3 mmol/L sur sang artériel. Une valeur négative décrit un déficit ; la formule de la notice Bichsel utilise sa magnitude positive. Ce paramètre calculé du gaz ne se confond pas avec un bicarbonate sérique mesuré ni avec une dose directement prescrite.</p>
<p data-evidence="N17-C0711"><b>Haptoglobine.</b> Viollier donne 0,30–2,00 g/L dans le sérum, chez les femmes et les hommes, dosage immunoturbidimétrique. Le résultat fait partie du bilan d’hémolyse ; il est confronté à la numération, au frottis et aux autres marqueurs. Ce laboratoire ne précise pas de tranche d’âge sur cette fiche.</p><p class="src">Sources des passages et calculs : <a href="https://www.viollier.ch/fr/analysis/7540" target="_blank" rel="noopener">Viollier : fiche du paramètre correspondant</a> ; <a href="https://www.viollier.ch/fr/analysis/7602" target="_blank" rel="noopener">Viollier : fiche du paramètre correspondant</a> ; <a href="https://www.viollier.ch/fr/analysis/19630" target="_blank" rel="noopener">Viollier : fiche du paramètre correspondant</a> ; <a href="https://www.viollier.ch/fr/analysis/14166" target="_blank" rel="noopener">Viollier : fiche du paramètre correspondant</a> ; <a href="https://www.viollier.ch/fr/analysis/35142" target="_blank" rel="noopener">Viollier : fiche du paramètre correspondant</a>. Les exemples chiffrés sont fictifs lorsqu’ils sont désignés comme tels.</p></template>
