<template data-pop="j09-ph-cycle" data-title="Cycle du virus influenza et cibles des antiviraux"><p class="lab">Fonction et cible</p><p>Chaque antiviral agit sur une étape indispensable à la multiplication du virus : entrée, décapsidation, transcription ou libération.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’hémagglutinine se lie à l’acide sialique et déclenche l’endocytose. Dans l’endosome acide, la protéine M2 laisse entrer des protons, ce qui détache les segments d’ARN de leur matrice. Dans le noyau, la polymérase virale (sous-unités acide, basique 1 et basique 2) capture la coiffe d’un ARN messager cellulaire : la sous-unité acide porte l’endonucléase qui coupe cette coiffe, ciblée par le baloxavir. Les nouveaux virions bourgeonnent à la membrane ; ils y resteraient accrochés à l’acide sialique sans la neuraminidase, ciblée par l’oseltamivir, le zanamivir et le péramivir.</p><p class="lab">Conséquence clinique</p><p>Un inhibiteur de la neuraminidase n’empêche pas l’infection des cellules déjà atteintes ; il limite la propagation à de nouvelles cellules. Le baloxavir agit plus tôt et fait chuter la charge virale plus vite, sans raccourcir davantage les symptômes dans les essais.</p><div class="key"><b>Limite.</b> La réduction de la charge virale est un critère biologique. Le bénéfice clinique se mesure par la durée des symptômes, les complications et la mortalité.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j09-ph-oseltamivir" data-title="Oseltamivir : monographie"><p class="lab">Mécanisme</p><p>L’oseltamivir est un promédicament absorbé par voie orale. Des estérases surtout hépatiques le transforment en carboxylate d’oseltamivir, analogue de l’acide sialique. Ce métabolite occupe le site actif de la neuraminidase des virus A et B et empêche la libération des virions.</p><p class="lab">Preuves</p><p>L’évaluation des technologies de la santé publiée par l’OFSP le 11.04.2025 conclut que l’oseltamivir réduit les complications grippales de 13 % à 8 % et l’usage d’antibiotiques de 15 % à 10 %, raccourcit les symptômes d’environ un jour, sans effet démontré sur la mortalité ni sur les premières hospitalisations. Une méta-analyse de 9 essais (4 328 adultes, Dobson, Lancet 2015) a raccourci le délai de soulagement de 21 % : 97,5 heures contre 122,7 heures. Les complications respiratoires basses nécessitant un antibiotique sont passées de 8,7 % à 4,9 %, et les hospitalisations de 1,7 % à 0,6 %. La revue Cochrane de 2014 (Jefferson) trouve un gain plus faible, 16,8 heures, sans effet significatif sur les hospitalisations ; elle critique les biais des essais du fabricant. Chez les patients hospitalisés de la pandémie de 2009, une méta-analyse observationnelle de 29 234 patients (Muthuri 2014) associe le traitement à une mortalité plus faible (odds ratio ajusté 0,81), et le traitement précoce à un bénéfice plus net (0,50 contre absence de traitement).</p><p class="lab">Posologie de l’adulte</p><p>Traitement : 75 mg deux fois par jour pendant 5 jours. Prophylaxie après contact : 75 mg une fois par jour pendant 10 jours. La dose est adaptée dès que la clairance de la créatinine est égale ou inférieure à 60 mL/min.</p><p class="lab">Effets indésirables</p><p>Nausées (10 %), vomissements (8 %), céphalées ; rarement troubles neuropsychiatriques, élévation des enzymes hépatiques, éruptions cutanées.</p><p class="lab">Contre-indications et surveillance</p><p>La seule contre-indication est l’hypersensibilité au principe actif ou à un excipient. La surveillance porte sur la réponse clinique à 48–72 heures, l’hydratation et, chez l’adolescent, le comportement.</p><div class="key"><b>Limite.</b> L’information suisse indique l’absence de données contrôlées chez les patients assez graves pour être hospitalisés. La recommandation chez eux repose sur des données observationnelles et sur la plausibilité de la réplication persistante.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/hkgFTLg65Zo8/h0087tflu-hta-report.pdf" target="_blank" rel="noopener">OFSP, évaluation des technologies de la santé oseltamivir et baloxavir, rapport du 11.04.2025</a> ; <a href="https://doi.org/10.1016/S0140-6736(14)62449-1" target="_blank" rel="noopener">Dobson, Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a> ; <a href="https://doi.org/10.1016/S2213-2600(14)70041-4" target="_blank" rel="noopener">Muthuri, Lancet Respiratory Medicine 2014</a>.</p></template>

<template data-pop="j09-ph-baloxavir" data-title="Baloxavir marboxil : monographie"><p class="lab">Mécanisme</p><p>Le baloxavir marboxil est un promédicament hydrolysé en baloxavir. Celui-ci inhibe l’endonucléase cap-dépendante de la sous-unité acide de la polymérase virale. Le virus ne peut plus fabriquer ses ARN messagers. La longue demi-vie autorise une dose unique.</p><p class="lab">Preuves</p><p>CAPSTONE-1 (adultes et adolescents sans risque, 2016–2017) : soulagement médian en 53,7 heures contre 80,2 heures sous placebo, sans différence avec l’oseltamivir. CAPSTONE-2 (personnes à risque élevé) : amélioration en 73,2 heures contre 102,3 heures sous placebo, sans différence significative avec l’oseltamivir. BLOCKSTONE (prophylaxie dans les ménages, Japon) : grippe symptomatique chez 1,9 % contre 13,6 % sous placebo. CENTERSTONE (2025, cas index de 5 à 64 ans) : transmission aux contacts du ménage à 5 jours de 9,5 % contre 13,4 %, sans réduction significative de la transmission symptomatique (5,8 % contre 7,6 %). FLAGSTONE (hospitalisés graves) : l’ajout du baloxavir à un inhibiteur de la neuraminidase n’a pas amélioré l’évolution (97,5 heures contre 100,2 heures).</p><p class="lab">Posologie de l’adulte</p><p>Dose unique : 40 mg de 20 à moins de 80 kg, 80 mg dès 80 kg, dans les 48 heures après le début des symptômes ou après le contact. Aucune adaptation rénale ni pour une insuffisance hépatique légère à modérée.</p><p class="lab">Indications suisses</p><p>Grippe non compliquée de moins de 48 heures chez la personne par ailleurs en bonne santé dès 3 mois, ou chez la personne à risque élevé de complication dès 12 ans ; prophylaxie après exposition dès 3 mois. La Société suisse d’infectiologie le réserve, en traitement ambulatoire, au très haut risque (85 ans et plus ou immunodépression), après un test.</p><p class="lab">Effets indésirables, contre-indications et surveillance</p><p>Pas d’excès d’effets indésirables contre placebo ; anaphylaxie, angiœdème, érythème polymorphe et diarrhée rapportés après commercialisation. Contre-indiqué en cas d’hypersensibilité. À éviter pendant la grossesse, faute de données. Éviter les cations polyvalents au moment de la prise.</p><div class="key"><b>Limite.</b> L’émergence de virus I38T sous traitement et l’absence de bénéfice chez l’hospitalisé limitent son emploi à la grippe non grave.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://doi.org/10.1056/NEJMoa1716197" target="_blank" rel="noopener">Hayden, New England Journal of Medicine 2018</a> ; <a href="https://doi.org/10.1016/S1473-3099(20)30004-9" target="_blank" rel="noopener">Ison, Lancet Infectious Diseases 2020</a> ; <a href="https://doi.org/10.1056/NEJMoa1915341" target="_blank" rel="noopener">Ikematsu, New England Journal of Medicine 2020</a> ; <a href="https://doi.org/10.1056/NEJMoa2413156" target="_blank" rel="noopener">Monto, New England Journal of Medicine 2025</a> ; <a href="https://doi.org/10.1016/S1473-3099(21)00469-2" target="_blank" rel="noopener">Kumar, Lancet Infectious Diseases 2022</a>.</p></template>

<template data-pop="j09-ph-zanamivir" data-title="Zanamivir : monographie"><p class="lab">Mécanisme</p><p>Le zanamivir est un analogue de l’acide sialique qui inhibe la neuraminidase des virus A et B. Sa biodisponibilité orale est faible ; il est donc inhalé et agit surtout sur l’épithélium respiratoire.</p><p class="lab">Preuves</p><p>La revue Cochrane de 2014 rapporte chez l’adulte un raccourcissement des symptômes de 0,6 jour (de 6,6 à 6,0 jours) et une réduction de la grippe symptomatique en prophylaxie.</p><p class="lab">Posologie</p><p>Traitement dès 7 ans : 2 inhalations de 5 mg deux fois par jour pendant 5 jours, débuté le premier ou le deuxième jour. Prophylaxie dès 12 ans : 2 inhalations de 5 mg une fois par jour pendant 10 jours, prolongeable jusqu’à un mois si l’exposition dure. Aucune adaptation rénale, hépatique ou liée à l’âge n’est nécessaire. L’allaitement est déconseillé pendant le traitement.</p><p class="lab">Effets indésirables et contre-indications</p><p>Bronchospasme et baisse de la fonction pulmonaire, parfois sévères, même sans maladie respiratoire connue. Contre-indiqué en cas d’hypersensibilité au zanamivir, au lactose ou d’allergie grave aux protéines du lait.</p><p class="lab">Surveillance</p><p>En cas d’asthme ou de BPCO, le patient garde un bronchodilatateur rapide à portée de main et l’inhale avant le zanamivir. La poudre ne doit jamais être nébulisée.</p><div class="key"><b>Limite.</b> Le zanamivir reste actif contre la plupart des virus H275Y résistants à l’oseltamivir ; l’OMS 2024 le déconseille néanmoins en traitement courant. L’information suisse date d’octobre 2020.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/9f998a6f23924e77b4bd14f8da661d15-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Relenza®, Swissmedic (AIPS), version d’octobre 2020, consultée le 08.10.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a>.</p></template>

<template data-pop="j09-ph-peramivir" data-title="Péramivir : statut suisse et preuves"><p class="lab">Fonction et cible</p><p>Le péramivir est un inhibiteur de la neuraminidase administré par voie intraveineuse, en dose unique dans la grippe non compliquée aux États-Unis.</p><p class="lab">Mécanisme de l’affirmation</p><p>Il occupe le site actif de la neuraminidase comme l’oseltamivir. Sa voie intraveineuse paraît utile lorsque la voie orale est impossible, mais aucun essai n’a montré de supériorité chez l’hospitalisé.</p><p class="lab">Conséquence clinique</p><p>Aucune information professionnelle suisse ne figure dans l’AIPS de Swissmedic consulté le 08.10.2026. L’OMS 2024 formule une recommandation conditionnelle contre son emploi, dans la grippe non grave comme dans la grippe grave. L’oseltamivir par sonde gastrique reste l’option habituelle chez le patient intubé.</p><div class="key"><b>Limite.</b> La mutation H275Y réduit aussi la sensibilité des virus H1N1 au péramivir.</div><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a>.</p></template>

<template data-pop="j09-ph-adamantanes" data-title="Adamantanes : pourquoi ils sont obsolètes"><p class="lab">Fonction et cible</p><p>L’amantadine et la rimantadine bloquent le canal à protons M2 et empêchent la décapsidation du virus A.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des virus porteurs de mutations de la protéine M2 résistent à ces molécules et se sont répandus dans le monde ; selon l’ECDC, tous les virus A en circulation sont résistants, avec une résistance supérieure à 99 %. Les adamantanes n’agissent pas non plus sur le virus B.</p><p class="lab">Conséquence clinique</p><p>Un adamantane n’apporte donc aucun bénéfice antiviral attendu : l’ECDC déconseille son emploi contre la grippe, et l’Institut Robert Koch rappelle que l’amantadine, moins bien tolérée que les inhibiteurs de la neuraminidase, n’est plus utilisée en pratique. La rimantadine n’est pas autorisée en Suisse selon l’information professionnelle de Tamiflu.</p><div class="key"><b>Limite.</b> L’amantadine conserve d’autres usages en neurologie ; seule son indication antigrippale est abandonnée.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/prevention-and-control/antivirals" target="_blank" rel="noopener">ECDC, Antiviral treatment of influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j09-ph-delai" data-title="Pourquoi le délai de 48 heures compte"><p class="lab">Fonction et cible</p><p>Un antiviral réduit la production de virus. Son effet dépend donc de la quantité de réplication encore à venir.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez l’adulte immunocompétent, l’excrétion virale culmine pendant les deux premiers jours des symptômes, puis décroît sous l’effet de la réponse immunitaire. Traité tard, le patient a déjà produit l’essentiel de ses virus ; les symptômes tardifs relèvent surtout de l’inflammation.</p><p class="lab">Conséquence clinique</p><p>L’information suisse de Tamiflu demande un début le jour de l’apparition des symptômes ou le lendemain, idéalement dans les 36 premières heures. Le baloxavir est autorisé dans les 48 heures. L’ECDC fixe le repère à 48 heures, en relevant un bénéfice possible au-delà chez le patient sévère, hospitalisé ou à haut risque ; la Société suisse d’infectiologie maintient l’oseltamivir au-delà de 48 heures chez le patient en état critique.</p><div class="key"><b>Limite.</b> Le délai de 48 heures est un seuil des essais, pas une frontière biologique nette. Il sert la décision chez le patient ambulatoire, pas chez le patient grave.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/prevention-and-control/antivirals" target="_blank" rel="noopener">ECDC, Antiviral treatment of influenza, consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></template>

<template data-pop="j09-ph-contentieux" data-title="OMS 2024 et Société suisse d’infectiologie 2026 : arbitrage des sources"><p class="lab">Fonction et cible</p><p>Deux référentiels récents répondent à la même question, le traitement antiviral de la grippe ; ils divergent pour la grippe non grave du patient à haut risque.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’OMS 2024 repose sur des méta-analyses en réseau, avec une méthode d’évaluation du niveau de preuve. Chez les personnes à risque faible, aucun antiviral ne réduit les hospitalisations de façon importante ; l’oseltamivir ajoute des nausées et des vomissements. L’OMS formule donc une recommandation forte contre l’oseltamivir dans la grippe non grave, suggère le baloxavir chez la personne non grave à haut risque (recommandation conditionnelle) et l’oseltamivir dans la grippe grave (conditionnelle). La Société suisse d’infectiologie, dans sa directive validée le 01.09.2026, propose aussi le baloxavir au patient ambulatoire à haut risque, mais ses experts n’en recommandent pas l’usage systématique et le réservent au très haut risque : 85 ans et plus ou immunodépression.</p><p class="lab">Conséquence clinique</p><p>La source suisse, la plus récente et propre au contexte de l’examen fédéral, est suivie : baloxavir en dose unique après un test chez le patient ambulatoire à très haut risque vu dans les 48 heures, pas d’antiviral systématique au simple haut risque, oseltamivir chez le patient hospitalisé. Les deux textes convergent sur l’essentiel : oseltamivir chez le patient sévère, pas d’antiviral chez la personne en bonne santé non grave, pas d’antibiotique sans argument bactérien, pas de baloxavir pendant la grossesse.</p><div class="key"><b>Limite.</b> Le texte de l’OMS 2024 reste accessible et applicable ; sa recommandation du baloxavir repose sur des preuves de faible qualité. L’ECDC ne publie pas de recommandation clinique propre et renvoie aux directives nationales. L’évaluation publiée par l’OFSP le 11.04.2025 compare les deux molécules pour la réserve pandémique, non pour la prescription individuelle.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/prevention-and-control/antivirals" target="_blank" rel="noopener">ECDC, Antiviral treatment of influenza, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/hkgFTLg65Zo8/h0087tflu-hta-report.pdf" target="_blank" rel="noopener">OFSP, évaluation des technologies de la santé oseltamivir et baloxavir, rapport du 11.04.2025</a>.</p></template>

<template data-pop="j09-ph-grossesse" data-title="Grossesse : pourquoi l’oseltamivir"><p class="lab">Fonction et cible</p><p>La grossesse augmente le risque de grippe grave ; le choix de l’antiviral doit tenir compte de la mère et du fœtus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le volume courant augmente, la capacité résiduelle fonctionnelle diminue, le débit cardiaque s’élève et l’immunité cellulaire est modulée. Une pneumonie virale altère donc vite l’oxygénation. La fièvre maternelle et l’hypoxémie menacent aussi le fœtus.</p><p class="lab">Conséquence clinique</p><p>L’information suisse de Tamiflu rapporte plus de 1000 grossesses exposées au premier trimestre sans effet délétère identifié, sans adaptation de dose malgré une exposition plus faible au métabolite, et réserve l’emploi aux situations de nécessité absolue. La Société suisse d’infectiologie ne recommande pas le baloxavir pendant la grossesse, faute de données de sécurité, et l’information suisse de Xofluza demande de l’éviter sauf bénéfice maternel prédominant. L’OMS 2024 admet l’oseltamivir chez la femme enceinte lorsque le bénéfice probable dépasse le risque.</p><div class="key"><b>Limite.</b> L’information suisse de Tamiflu juge l’ampleur du bénéfice incertaine, faute d’essai contrôlé ; la grippe sévère ou hospitalisée de la femme enceinte constitue la situation de nécessité la plus claire.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a>.</p></template>

<template data-pop="j09-ph-prophylaxie" data-title="Prophylaxie antivirale : qui, avec quoi, combien de temps"><p class="lab">Fonction et cible</p><p>La prophylaxie empêche l’infection après un contact, chez une personne dont la vaccination protège mal ou dont le risque de complication est très élevé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le médicament présent dans les voies respiratoires au moment de l’inoculation bloque la réplication avant l’amplification virale. L’effet cesse avec l’arrêt du traitement : il n’induit aucune immunité.</p><p class="lab">Conséquence clinique</p><p>La Société suisse d’infectiologie propose la prophylaxie post-exposition aux personnes à très haut risque, âgées de 85 ans et plus ou porteuses de plusieurs facteurs de risque, par exemple en établissement médico-social, dans les 48 heures après un contact avec un cas avéré : baloxavir en dose unique ou oseltamivir pendant 10 jours adapté à la fonction rénale. Selon l’information suisse, l’oseltamivir se donne à 75 mg une fois par jour pendant 10 jours. BLOCKSTONE a réduit la grippe symptomatique des contacts du ménage de 13,6 % à 1,9 %. L’ECDC rapporte, d’après la revue Cochrane de 2014, une réduction absolue de 13,6 % de la grippe symptomatique dans les ménages, soit environ 7 contacts à traiter pour éviter un cas. En cas de foyer en établissement de soins, l’Institut Robert Koch recommande la prophylaxie des résidents et du personnel, vaccinés ou non.</p><div class="key"><b>Limite.</b> La prophylaxie n’est pas recommandée chez la personne en bonne santé exposée. Une fièvre sous prophylaxie impose un test et une dose de traitement, non la poursuite de la dose prophylactique.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1056/NEJMoa1915341" target="_blank" rel="noopener">Ikematsu, New England Journal of Medicine 2020</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/Scientific-advice-neuraminidase-inhibitors-2017.pdf" target="_blank" rel="noopener">ECDC, avis d’experts sur les inhibiteurs de la neuraminidase, 2017</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>

<template data-pop="j09-ph-rein" data-title="Oseltamivir et rein : pourquoi adapter"><p class="lab">Fonction et cible</p><p>L’adaptation rénale maintient une exposition efficace sans accumulation.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le carboxylate d’oseltamivir n’est presque pas métabolisé. Il est éliminé dans l’urine par filtration glomérulaire et par sécrétion tubulaire des anions. Quand la clairance de la créatinine baisse, sa demi-vie s’allonge et ses concentrations augmentent. Une dose plus faible ou plus espacée donne alors une exposition comparable à celle d’un rein normal.</p><p class="lab">Conséquence clinique</p><p>Le seuil d’adaptation de l’information actuelle est de 60 mL/min. L’hémodialyse épure le métabolite ; c’est pourquoi une dose suit chaque séance en traitement. Le baloxavir, éliminé surtout dans les selles, ne demande aucune adaptation rénale.</p><div class="key"><b>Limite.</b> Des versions anciennes de l’information professionnelle n’adaptaient la dose qu’en dessous de 30 mL/min ; un tableau ancien conduit donc à surdoser le patient dont la clairance se situe entre 30 et 60 mL/min. Aucune dose n’est validée à 10 mL/min ou moins sans dialyse, ni chez l’enfant insuffisant rénal.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j09-ph-h275y" data-title="Mutation H275Y et résistance à l’oseltamivir"><p class="lab">Fonction et cible</p><p>La mutation H275Y remplace une histidine par une tyrosine en position 275 de la neuraminidase des virus H1N1. L’information suisse de Xofluza l’écrit H274Y, selon une autre numérotation.</p><p class="lab">Mécanisme de l’affirmation</p><p>Selon l’ECDC, les virus porteurs de cette mutation sont beaucoup moins inhibés par l’oseltamivir au laboratoire ; la mutation réduit aussi l’effet du péramivir. L’Institut Robert Koch indique que ces virus restaient sensibles au zanamivir.</p><p class="lab">Conséquence clinique</p><p>Entre 2007 et 2009, les virus H1N1 saisonniers étaient devenus presque tous résistants : plus de 99 % des isolats H1N1 circulant en Europe en 2008 selon l’information suisse de Tamiflu. Le virus H1N1 de la pandémie de 2009, qui les a remplacés, est resté sensible dans son immense majorité. Une résistance apparaît surtout chez l’immunodéprimé traité. Le baloxavir reste actif sur ces virus selon son information suisse.</p><div class="key"><b>Limite.</b> La fréquence varie selon les saisons ; elle se lit dans les rapports de surveillance européens de l’ECDC et du bureau régional de l’OMS.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j09-ph-i38t" data-title="Mutation I38T et baloxavir"><p class="lab">Fonction et cible</p><p>La substitution I38T remplace une isoleucine par une thréonine en position 38 de la sous-unité acide de la polymérase, dans le site de l’endonucléase.</p><p class="lab">Mécanisme de l’affirmation</p><p>La chaîne latérale plus petite de la thréonine réduit les contacts entre le baloxavir et la poche enzymatique. Le médicament se fixe moins bien, tandis que l’enzyme garde une activité suffisante pour le virus.</p><p class="lab">Conséquence clinique</p><p>Selon l’information suisse, des virus mutés sont apparus sous traitement chez 9,7 % des patients infectés de CAPSTONE-1, 5,2 % de CAPSTONE-2 et 19,3 % des enfants de 1 à 12 ans. Dans CENTERSTONE, 7,2 % des patients index ont développé une résistance, sans transmission détectée aux contacts. L’émergence peut s’accompagner d’un rebond de la charge virale.</p><div class="key"><b>Limite.</b> Les conséquences cliniques de cette sensibilité réduite restent incertaines selon l’information suisse. Le risque est plus grand chez l’enfant et l’immunodéprimé.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1056/NEJMoa2413156" target="_blank" rel="noopener">Monto, New England Journal of Medicine 2025</a>.</p></template>

<template data-pop="j09-ph-vvaa" data-title="Vaccin vivant atténué et antiviraux"><p class="lab">Fonction et cible</p><p>Le vaccin vivant atténué intranasal contient des virus capables de se répliquer dans le nez ; cette réplication produit l’immunité.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un antiviral actif sur les virus influenza peut bloquer cette réplication comme celle d’un virus sauvage. Le vaccin perd donc une partie de son efficacité si l’antiviral est présent dans les muqueuses au moment de la réplication vaccinale. La durée de l’interférence dépend de la demi-vie : courte pour l’oseltamivir, beaucoup plus longue pour le baloxavir, dont la demi-vie terminale atteint environ 79 heures chez les patients caucasiens selon son information suisse.</p><p class="lab">Conséquence clinique</p><p>L’OFSP indique que le vaccin intranasal n’est pas disponible en Suisse pour la saison 2026, et aucune information professionnelle suisse de ce vaccin ne figure dans l’AIPS consulté le 08.10.2026. En Suisse, la vaccination antigrippale repose sur des vaccins inactivés, que les antiviraux n’affectent pas selon l’information de Tamiflu.</p><div class="key"><b>Limite.</b> Pour une personne vaccinée à l’étranger avec un vaccin vivant, les délais d’interférence relèvent de l’information professionnelle du pays d’autorisation ; aucun texte suisse en vigueur ne les fixe.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j09-ph-cations" data-title="Baloxavir et cations polyvalents"><p class="lab">Fonction et cible</p><p>Le baloxavir doit être absorbé dans l’intestin pour atteindre les voies respiratoires.</p><p class="lab">Mécanisme de l’affirmation</p><p>La molécule fixe des ions métalliques : c’est d’ailleurs ainsi qu’elle bloque les deux ions manganèse du site de l’endonucléase. Dans l’intestin, le calcium, le fer, le magnésium, le sélénium ou le zinc forment avec elle un complexe peu absorbable.</p><p class="lab">Conséquence clinique</p><p>Une dose unique mal absorbée peut rester sans effet antiviral. Le médecin recherche donc les laxatifs, antiacides, compléments minéraux, boissons enrichies en calcium et produits laitiers pris au même moment.</p><div class="key"><b>Limite.</b> L’information suisse demande d’éviter ces associations sans fixer d’intervalle chiffré ; la prise à distance est une précaution raisonnable.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j09-ph-neuropsy" data-title="Troubles neuropsychiatriques sous oseltamivir"><p class="lab">Fonction et cible</p><p>La question est de savoir si le délire, les convulsions ou les comportements dangereux viennent du médicament ou de la grippe.</p><p class="lab">Mécanisme de l’affirmation</p><p>La grippe peut causer une encéphalopathie, surtout chez l’enfant, par la fièvre et la réaction inflammatoire. Ces troubles apparaissent donc aussi chez des patients non traités. L’information suisse indique que la contribution de l’oseltamivir reste inconnue.</p><p class="lab">Conséquence clinique</p><p>Le comportement de l’enfant et de l’adolescent traités est surveillé, et l’entourage est informé. La méta-analyse de Dobson (2015) n’a pas trouvé d’excès de troubles neurologiques ou psychiatriques chez l’adulte traité. La revue Cochrane de 2014 trouve un léger excès d’événements psychiatriques en prophylaxie.</p><div class="key"><b>Limite.</b> Le signal est rare et non démontré comme causal ; il ne justifie pas de priver d’oseltamivir une personne qui en a besoin.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1016/S0140-6736(14)62449-1" target="_blank" rel="noopener">Dobson, Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a>.</p></template>

<template data-pop="j09-ph-reye" data-title="Syndrome de Reye et acide acétylsalicylique"><p class="lab">Fonction et cible</p><p>Le syndrome de Reye associe une encéphalopathie aiguë et une stéatose hépatique microvésiculaire, après une infection virale comme la grippe ou la varicelle.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le salicylate perturbe le fonctionnement des mitochondries, en particulier l’oxydation des acides gras. Associé à l’infection virale, il entraîne une insuffisance hépatique, une hyperammoniémie et un œdème cérébral. L’association a été établie par des études épidémiologiques ; la baisse des cas a suivi la réduction de l’usage pédiatrique de l’aspirine.</p><p class="lab">Conséquence clinique</p><p>L’information suisse d’Aspirine 500 demande que l’adolescent dès 12 ans fébrile ou atteint d’une infection virale ne la prenne que sur prescription et en deuxième intention. Elle cite les vomissements importants, les troubles de la conscience et l’atteinte hépatique. Chez l’enfant et l’adolescent grippé, préférer le paracétamol.</p><div class="key"><b>Limite.</b> Chez l’adulte, l’aspirine n’est pas contre-indiquée par la grippe ; elle n’a cependant aucun avantage sur le paracétamol pour la fièvre.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/110558-aspirine-cpr-eff-500-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse Aspirine® 500, Swissmedic (AIPS), consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>

<template data-pop="j09-ph-antibio" data-title="Antibiotique : quand il devient indiqué"><p class="lab">Fonction et cible</p><p>L’antibiotique traite une surinfection bactérienne, pas la grippe.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium cilié et expose des récepteurs auxquels adhèrent le pneumocoque et <i>Staphylococcus aureus</i>. La surinfection survient souvent après une amélioration initiale, avec une nouvelle fièvre, une toux productive, un foyer ou une aggravation respiratoire.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 recommande fortement de ne pas donner d’antibiotique dans la grippe non grave lorsque la probabilité de coinfection bactérienne est faible, et la Société suisse d’infectiologie ne le recommande pas lorsque la suspicion de surinfection est faible. Une pneumonie ou un sepsis justifient au contraire une antibiothérapie rapide, selon la directive suisse et <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a> ; devant une surinfection à <i>Staphylococcus aureus</i>, elle ajoute la clindamycine ou le linézolide jusqu’à l’exclusion d’une toxine de Panton-Valentine.</p><div class="key"><b>Limite.</b> Une coinfection bactérienne précoce existe dans les formes graves ; l’absence d’antibiotique ne s’applique pas à une pneumonie grave hospitalisée.</div><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>

<template data-pop="j09-ph-cortico" data-title="Corticostéroïdes dans la grippe"><p class="lab">Fonction et cible</p><p>Les corticostéroïdes réduisent l’inflammation, mais diminuent aussi l’immunité antivirale.</p><p class="lab">Mécanisme de l’affirmation</p><p>En freinant les lymphocytes T et les interférons, ils prolongent l’excrétion virale. Les données observationnelles associent leur emploi dans la grippe grave à une mortalité et à des surinfections plus fréquentes.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 formule une recommandation conditionnelle contre les corticostéroïdes dans la grippe grave, et la Société suisse d’infectiologie demande de les éviter chez le patient grippé. Une autre indication garde sa place, comme le précise la directive suisse : exacerbation d’asthme ou de BPCO.</p><div class="key"><b>Limite.</b> Les données reposent surtout sur des études observationnelles, exposées aux biais d’indication.</div><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>

<template data-pop="j09-ph-paracetamol" data-title="Paracétamol dans la grippe"><p class="lab">Fonction et cible</p><p>Le paracétamol diminue la fièvre et les myalgies par une action surtout centrale. Il ne modifie pas la réplication virale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une petite fraction est transformée en métabolite réactif, neutralisé par le glutathion hépatique. Le jeûne, l’alcool et la dénutrition réduisent ce glutathion ; un surdosage dépasse la capacité de neutralisation et lèse le foie.</p><p class="lab">Conséquence clinique</p><p>Adulte de plus de 40 kg : 500 à 1 000 mg par prise, avec 4 à 8 heures entre les prises, sans dépasser 4 000 mg par jour. Les spécialités combinées contre le rhume contiennent souvent du paracétamol, qui s’additionne à la dose prescrite.</p><div class="key"><b>Limite.</b> Le plafond n’est pas un objectif. La dose est réduite en cas de dénutrition, d’alcoolisme ou d’hépatopathie.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1547675-paracetamol-sandoz-eco-cpr-500-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse Paracétamol Sandoz eco®, Swissmedic (AIPS), consultée le 08.10.2026</a>.</p></template>

<template data-pop="j09-ph-ains" data-title="Anti-inflammatoires non stéroïdiens dans la grippe"><p class="lab">Fonction et cible</p><p>Les AINS inhibent les cyclo-oxygénases et la synthèse des prostaglandines : ils diminuent la fièvre et la douleur.</p><p class="lab">Mécanisme de l’affirmation</p><p>Quand la volémie baisse, les prostaglandines dilatent l’artériole afférente et maintiennent la filtration glomérulaire. La fièvre, les vomissements et la faible prise de boissons réduisent la volémie ; un AINS supprime alors cette compensation et peut provoquer une insuffisance rénale aiguë. L’association à un diurétique ou à un inhibiteur du système rénine-angiotensine renforce ce risque.</p><p class="lab">Conséquence clinique</p><p>L’information suisse de Brufen contre-indique l’ibuprofène en cas d’insuffisance rénale grave (clairance inférieure à 30 mL/min), d’insuffisance cardiaque NYHA III–IV, d’ulcère actif, de bronchospasme après un AINS et au troisième trimestre de la grossesse. Le paracétamol est préférable chez la personne âgée, déshydratée ou insuffisante rénale.</p><div class="key"><b>Limite.</b> Chez l’adulte jeune bien hydraté, une prise brève à la dose minimale efficace reste possible.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/13700-brufen-cpr-pell-400-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse Brufen®, Swissmedic (AIPS), consultée le 08.10.2026</a>.</p></template>

<template data-pop="j09-ph-vaccin" data-title="Vaccin grippal inactivé : mécanisme et limites"><p class="lab">Fonction et cible</p><p>Le vaccin inactivé fragmenté apporte l’hémagglutinine et la neuraminidase des souches choisies, sans virus capable de se répliquer.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les anticorps dirigés contre la tête de l’hémagglutinine empêchent la fixation du virus sur l’acide sialique. Leur titre atteint un niveau protecteur environ deux semaines après l’injection, puis diminue en quelques mois. La dérive antigénique modifie chaque année l’hémagglutinine ; l’OMS adapte donc la composition, aujourd’hui trivalente : A(H1N1), A(H3N2) et B lignée Victoria.</p><p class="lab">Conséquence clinique</p><p>La vaccination est annuelle, de la mi-octobre au début de l’épidémie. Elle est possible le même jour qu’un vaccin contre la COVID-19. Jusqu’à 25 % des personnes ont une douleur ou une rougeur locale, environ 5 % de la fièvre ou des myalgies brèves selon l’OFSP.</p><div class="key"><b>Limite.</b> L’efficacité varie selon la concordance entre souches vaccinales et circulantes, et selon l’âge. Elle réduit le risque sans l’annuler ; c’est pourquoi les contacts sont aussi vaccinés.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, grippe saisonnière, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse Efluelda TIV®, Swissmedic (AIPS), consultée le 08.10.2026</a>.</p></template>

<template data-pop="j09-ph-hautedose" data-title="Vaccin à haute dose après 65 ans"><p class="lab">Fonction et cible</p><p>Le vaccin à haute dose compense la réponse immunitaire plus faible du sujet âgé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Avec l’âge, les lymphocytes B et T naïfs diminuent et la coopération entre ces cellules devient moins efficace : c’est l’immunosénescence. Efluelda contient 60 µg d’hémagglutinine par souche, contre 15 µg pour un vaccin standard. Cette quantité plus grande produit des titres d’anticorps plus élevés.</p><p class="lab">Conséquence clinique</p><p>Dans l’essai de Diaz Granados (31 989 personnes de 65 ans et plus), la grippe confirmée est passée de 1,9 % à 1,4 %, soit une efficacité relative de 24,2 % (intervalle de confiance à 95 % : 9,7 à 36,5). L’OFSP préfère ce vaccin dès 75 ans et dès 65 ans avec un facteur de risque supplémentaire.</p><div class="key"><b>Limite.</b> La réactogénicité est plus élevée : douleur locale chez 41 % et myalgies chez 22,5 % selon l’information suisse. L’OFSP ne le recommande pas avant 65 ans, et il n’a aucune place pendant la grossesse, où le vaccin standard s’applique.</div><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1315727" target="_blank" rel="noopener">Diaz Granados, New England Journal of Medicine 2014</a> ; <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse Efluelda TIV®, Swissmedic (AIPS), consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, état février 2025</a>.</p></template>

<template data-pop="j09-ph-ci-vaccin" data-title="Contre-indications vaccinales et allergie à l’œuf"><p class="lab">Fonction et cible</p><p>Identifier les rares personnes qui ne doivent pas recevoir le vaccin ou qui doivent le recevoir sous précautions.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une anaphylaxie peut viser un antigène, un excipient ou une trace de fabrication. Les vaccins cultivés sur œufs peuvent contenir des traces d’ovalbumine et de formaldéhyde. Une infection aiguë modérée à sévère rend difficile l’interprétation d’un effet indésirable. Un syndrome de Guillain et Barré après un vaccin antérieur pourrait relever d’un mécanisme auto-immun.</p><p class="lab">Conséquence clinique</p><p>L’information suisse d’Efluelda (décembre 2024) contre-indique le vaccin en cas d’hypersensibilité aux composants ou aux traces d’œuf et de formaldéhyde. Elle demande de différer la vaccination pendant une infection modérée à sévère, de peser le risque après un syndrome de Guillain et Barré survenu dans les 6 semaines, et d’être prudent en cas de trouble de la coagulation. </p><div class="key"><b>Limite.</b> En Suisse, l’information professionnelle du produit fait foi. Une allergie grave à l’œuf demande un avis allergologique et une vaccination dans une structure capable de traiter une anaphylaxie, plutôt que l’absence de vaccination.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse Efluelda TIV®, Swissmedic (AIPS), consultée le 08.10.2026</a>.</p></template>

<template data-pop="pareto-j09-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j09-p-1,j09-p-2,j09-p-3,j09-p-4,j09-p-5,j09-p-6,j09-p-7,j09-p-8"></p><ul><li>Oseltamivir et baloxavir sont les antiviraux de référence en Suisse ; les adamantanes sont obsolètes.</li><li>Grippe grave ou hospitalisée : oseltamivir, dans les 48 heures et au-delà en état critique. Non grave à très haut risque : baloxavir en dose unique après un test (Société suisse d’infectiologie 2026) ; au simple haut risque, pas d’antiviral systématique, alors que l’OMS 2024 suggère le baloxavir. Risque faible : aucun antiviral.</li><li>Oseltamivir 75 mg deux fois par jour pendant 5 jours ; adapter dès une clairance de 60 mL/min. Baloxavir 40 mg ou 80 mg en dose unique dans les 48 heures. En dialyse péritonéale, oseltamivir 30 mg puis 30 mg tous les 5 jours selon l’information suisse.</li><li>Résistances : H275Y pour l’oseltamivir, I38T pour le baloxavir.</li><li>Baloxavir à distance des cations polyvalents ; zanamivir jamais nébulisé ; vaccin vivant intranasal non disponible en Suisse.</li><li>Pas d’aspirine chez l’enfant ou l’adolescent ; pas d’antibiotique ni de corticostéroïde sans indication propre ; paracétamol en premier choix.</li><li>Vaccin inactivé annuel dès la mi-octobre ; haute dose dès 75 ans ou dès 65 ans avec un facteur de risque.</li></ul></template>
<template data-pop="j09-ph-dialyse" data-title="Oseltamivir en dialyse : texte suisse et écart avec l’OMS"><p class="lab">Fonction et cible</p><p>Le schéma en dialyse doit maintenir des concentrations efficaces de carboxylate d’oseltamivir, éliminé presque entièrement par le rein, chez un patient sans fonction rénale résiduelle notable.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’information suisse de Tamiflu s’appuie sur deux études pharmacocinétiques en hémodialyse et en dialyse péritonéale continue ambulatoire, et sur un modèle de population. En traitement, elle prévoit chez le patient en dialyse péritonéale une dose de 30 mg avant le début de la dialyse, puis 30 mg tous les 5 jours ; en prophylaxie, 30 mg puis 30 mg tous les 7 jours. En hémodialyse, elle prévoit 30 mg avant la séance si les symptômes débutent entre deux séances, puis 30 mg après chaque séance en traitement et après une séance sur deux en prophylaxie.</p><p class="lab">Conséquence clinique</p><p>Les lignes directrices de l’OMS de 2024 indiquent, en dialyse péritonéale, une dose unique de 30 mg pour le traitement. En Suisse, l’information professionnelle approuvée par Swissmedic prime : le patient en dialyse péritonéale reçoit 30 mg, puis une nouvelle dose de 30 mg tous les 5 jours tant que dure le traitement.</p><div class="key"><b>Limite.</b> Aucune recommandation posologique n’existe pour le patient dont la clairance est inférieure à 10 mL/min sans dialyse, ni pour l’enfant insuffisant rénal, faute de données pharmacocinétiques.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a>.</p></template>
