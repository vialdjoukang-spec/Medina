<template data-pop="j09-ph-cycle" data-title="Cycle du virus influenza et cibles des antiviraux"><p class="lab">Mécanisme</p><p>L’hémagglutinine fixe le virus sur l’acide sialique et déclenche l’endocytose. Dans l’endosome acide, le canal M2 fait entrer des protons et libère les segments d’ARN. Dans le noyau, l’endonucléase de la sous-unité acide de la polymérase coupe la coiffe d’ARN messagers cellulaires pour amorcer la transcription virale. La neuraminidase coupe enfin l’acide sialique qui retient les nouveaux virions à la membrane.</p><p class="lab">Conséquence clinique</p><p>Un inhibiteur de la neuraminidase limite la propagation sans protéger les cellules déjà infectées. Le baloxavir abaisse la charge virale plus vite, sans raccourcir davantage les symptômes.</p><div class="key"><b>Limite.</b> La charge virale est un critère biologique ; le bénéfice se juge sur les symptômes, les complications et la mortalité.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a>.</p></template><template data-pop="j09-ph-oseltamivir" data-title="Oseltamivir : monographie"><p class="lab">Mécanisme</p><p>Des estérases hépatiques hydrolysent ce promédicament en carboxylate d’oseltamivir, analogue de l’acide sialique qui occupe le site actif de la neuraminidase des virus A et B.</p><p class="lab">Preuves</p><p>Chez 4 328 adultes de 9 essais (Dobson 2015), le soulagement survient en 97,5 heures contre 122,7 heures (−21 %) ; les complications respiratoires basses traitées par antibiotique passent de 8,7 % à 4,9 %, les hospitalisations de 1,7 % à 0,6 %. La revue Cochrane 2014 (Jefferson), critique envers les essais du fabricant, ne retient que 16,8 heures et aucun effet significatif sur les hospitalisations. Chez 29 234 hospitalisés de 2009 (Muthuri 2014), le traitement est associé à une mortalité plus faible : odds ratio ajusté 0,81, et 0,50 s’il est précoce.</p><p class="lab">Tolérance et contre-indication</p><p>Outre les troubles digestifs, il donne des céphalées et, rarement, une élévation des enzymes hépatiques ou une éruption. Seule l’hypersensibilité au principe actif ou à un excipient le contre-indique.</p><div class="key"><b>Limite.</b> Aucune donnée contrôlée n’existe chez l’hospitalisé, selon l’information suisse : l’indication y repose sur l’observation et la réplication persistante.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1016/S0140-6736(14)62449-1" target="_blank" rel="noopener">Dobson, Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a> ; <a href="https://doi.org/10.1016/S2213-2600(14)70041-4" target="_blank" rel="noopener">Muthuri, Lancet Respiratory Medicine 2014</a>.</p></template><template data-pop="j09-ph-baloxavir" data-title="Baloxavir marboxil : monographie"><p class="lab">Mécanisme</p><p>Le baloxavir, issu de l’hydrolyse du promédicament, inhibe l’endonucléase cap-dépendante : le virus ne fabrique plus ses ARN messagers. Sa longue demi-vie permet une dose unique.</p><p class="lab">Preuves</p><p>CAPSTONE-1 (sujets sans risque, 2016–2017) : soulagement médian en 53,7 heures contre 80,2 heures sous placebo, comme sous oseltamivir. CAPSTONE-2 (risque élevé) : 73,2 heures contre 102,3 heures sous placebo, sans différence significative avec l’oseltamivir. BLOCKSTONE (prophylaxie familiale, Japon) : grippe symptomatique chez 1,9 % contre 13,6 %. CENTERSTONE (2025) : transmission aux contacts du ménage à 5 jours de 9,5 % contre 13,4 %, sans réduction significative de la transmission symptomatique. FLAGSTONE (hospitalisés graves) : l’ajout à un inhibiteur de la neuraminidase n’apporte rien (97,5 heures contre 100,2 heures).</p><p class="lab">Indications suisses</p><p>Il traite la grippe non compliquée de moins de 48 heures dès 3 mois chez la personne saine et dès 12 ans chez la personne à risque élevé ; la prophylaxie après exposition est autorisée dès 3 mois.</p><p class="lab">Précautions</p><p>La grossesse est à éviter faute de données. Une diarrhée a aussi été rapportée après commercialisation.</p><div class="key"><b>Limite.</b> L’émergence de virus I38T et l’absence de bénéfice chez l’hospitalisé réservent le baloxavir à la grippe non grave.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1056/NEJMoa1716197" target="_blank" rel="noopener">Hayden, New England Journal of Medicine 2018</a> ; <a href="https://doi.org/10.1016/S1473-3099(20)30004-9" target="_blank" rel="noopener">Ison, Lancet Infectious Diseases 2020</a> ; <a href="https://doi.org/10.1056/NEJMoa1915341" target="_blank" rel="noopener">Ikematsu, New England Journal of Medicine 2020</a> ; <a href="https://doi.org/10.1056/NEJMoa2413156" target="_blank" rel="noopener">Monto, New England Journal of Medicine 2025</a> ; <a href="https://doi.org/10.1016/S1473-3099(21)00469-2" target="_blank" rel="noopener">Kumar, Lancet Infectious Diseases 2022</a>.</p></template><template data-pop="j09-ph-zanamivir" data-title="Zanamivir : monographie"><p class="lab">Mécanisme</p><p>Cet analogue de l’acide sialique inhibe la neuraminidase des virus A et B ; sa faible biodisponibilité orale impose l’inhalation.</p><p class="lab">Preuves</p><p>Chez l’adulte, la revue Cochrane 2014 rapporte un raccourcissement des symptômes de 0,6 jour (6,0 contre 6,6 jours) et une réduction de la grippe symptomatique en prophylaxie.</p><p class="lab">Posologie</p><p>Le traitement est autorisé dès 7 ans. La prophylaxie, dès 12 ans, est de 2 inhalations de 5 mg une fois par jour pendant 10 jours.</p><p class="lab">Tolérance et contre-indications</p><p>Le bronchospasme survient même sans maladie respiratoire connue ; l’asthmatique inhale un bronchodilatateur rapide avant le zanamivir. L’hypersensibilité au zanamivir ou au lactose et l’allergie grave aux protéines du lait le contre-indiquent.</p><div class="key"><b>Limite.</b> Le zanamivir reste actif sur la plupart des virus H275Y, mais l’OMS 2024 le déconseille en traitement courant. Son information suisse date d’octobre 2020.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/78179-relenza-disk-5-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Relenza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a>.</p></template><template data-pop="j09-ph-peramivir" data-title="Péramivir : statut suisse et preuves"><p class="lab">Fonction et cible</p><p>Cet inhibiteur intraveineux de la neuraminidase s’emploie en dose unique aux États-Unis.</p><p class="lab">Mécanisme</p><p>Sa voie intraveineuse n’a montré aucune supériorité chez l’hospitalisé.</p><p class="lab">Conséquence clinique</p><p>Compendium.ch n’en publiait aucune information suisse le 08.10.2026, et l’OMS 2024 le déconseille (conditionnelle) dans toutes les formes. Chez le patient intubé, l’oseltamivir passe par sonde gastrique.</p><div class="key"><b>Limite.</b> La mutation H275Y réduit aussi la sensibilité des virus H1N1 au péramivir.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/health-care-readiness/clinical-guidelines-for-influenza---translation-summary-french.pdf" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024, résumé officiel</a>.</p></template><template data-pop="j09-ph-adamantanes" data-title="Adamantanes : pourquoi ils sont obsolètes"><p class="lab">Mécanisme</p><p>La substitution S31N modifie le pore du canal M2 et empêche la fixation du médicament sans gêner le virus ; presque tous les virus A H3N2 et H1N1 de 2009 la portent. Le canal à protons du virus B diffère de M2 et n’est pas bloqué.</p><p class="lab">Conséquence clinique</p><p>Un adamantane n’apporte aucun bénéfice et expose la personne âgée à la confusion et aux vertiges. La rimantadine n’est pas autorisée en Suisse (information de Tamiflu).</p><div class="key"><b>Limite.</b> Seule l’indication antigrippale de l’amantadine est abandonnée ; ses usages neurologiques persistent.</div><p class="src">Références : <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7305a1.htm" target="_blank" rel="noopener">CDC, recommandations de l’ACIP 2024–2025</a> ; <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a>.</p></template><template data-pop="j09-ph-delai" data-title="Pourquoi le délai de 48 heures compte"><p class="lab">Mécanisme</p><p>Chez l’adulte immunocompétent, l’excrétion virale culmine les deux premiers jours puis décroît sous l’effet de l’immunité. Plus tard, l’essentiel des virus est produit et les symptômes relèvent surtout de l’inflammation.</p><p class="lab">Conséquence clinique</p><p>L’antiviral agit donc sur la réplication encore à venir. Chez l’hospitalisé ou l’immunodéprimé, elle persiste plusieurs jours : le traitement reste indiqué au-delà de 48 heures.</p><div class="key"><b>Limite.</b> Ce seuil vient des essais ambulatoires ; il ne marque pas une frontière biologique.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018, Clinical Infectious Diseases 2019</a>.</p></template><template data-pop="j09-ph-contentieux" data-title="OMS 2024 et IDSA 2018 : arbitrage des sources"><p class="lab">Fonction et cible</p><p>Les deux recommandations divergent sur la grippe non grave.</p><p class="lab">Mécanisme</p><p>L’OMS 2024 repose sur des méta-analyses en réseau récentes avec cotation du niveau de preuve. Chez la personne à risque faible, aucun antiviral ne réduit nettement les hospitalisations, et l’oseltamivir ajoute nausées et vomissements : d’où sa recommandation forte contre l’oseltamivir. L’IDSA 2018, plus ancienne, admet de traiter la personne saine vue avant 48 heures.</p><p class="lab">Conséquence clinique</p><p>Le cours suit l’OMS 2024, source primaire la plus récente. Les deux textes concordent sur l’oseltamivir immédiat chez l’hospitalisé et sur l’absence d’antibiotique sans surinfection.</p><div class="key"><b>Limite.</b> Le résumé officiel de l’OMS ne détaille pas la stratification par risque de sa recommandation contre l’oseltamivir. Chez la personne à risque élevé privée de baloxavir, l’oseltamivir reste autorisé en Suisse et appuyé par l’IDSA 2018.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/health-care-readiness/clinical-guidelines-for-influenza---translation-summary-french.pdf" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024, résumé officiel</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018, Clinical Infectious Diseases 2019</a>.</p></template><template data-pop="j09-ph-grossesse" data-title="Grossesse : pourquoi l’oseltamivir"><p class="lab">Mécanisme</p><p>La capacité résiduelle fonctionnelle diminue, le volume courant et le débit cardiaque augmentent, et l’immunité cellulaire est modulée : une pneumonie virale altère vite l’oxygénation. La fièvre et l’hypoxémie maternelles menacent aussi le fœtus.</p><p class="lab">Conséquence clinique</p><p>Plus de 1 000 grossesses exposées à l’oseltamivir au premier trimestre n’ont montré aucun effet délétère ; la dose reste inchangée malgré une exposition plus faible au métabolite (information de Tamiflu). Le baloxavir est à éviter, faute de données.</p><div class="key"><b>Limite.</b> L’information de Tamiflu réserve son emploi aux situations de nécessité, dont la grippe confirmée ou fortement suspectée chez la femme enceinte ; le bénéfice reste observationnel.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018, Clinical Infectious Diseases 2019</a>.</p></template><template data-pop="j09-ph-prophylaxie" data-title="Prophylaxie antivirale : qui, avec quoi, combien de temps"><p class="lab">Mécanisme</p><p>Le médicament présent dans les voies respiratoires lors de l’inoculation bloque la réplication avant l’amplification. Il n’induit aucune immunité : la protection cesse à l’arrêt.</p><p class="lab">Conséquence clinique</p><p>BLOCKSTONE a réduit la grippe symptomatique des contacts du ménage de 13,6 % à 1,9 % sous baloxavir. Selon la revue Cochrane 2014, environ 7 contacts traités par oseltamivir ou zanamivir évitent un cas. Lors d’une flambée en établissement de soins, l’IDSA 2018 prolonge la prophylaxie au moins deux semaines, et jusqu’à une semaine après le dernier cas.</p><div class="key"><b>Limite.</b> La personne saine exposée n’en reçoit pas. Une fièvre sous prophylaxie impose un test et la dose de traitement.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1056/NEJMoa1915341" target="_blank" rel="noopener">Ikematsu, New England Journal of Medicine 2020</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018, Clinical Infectious Diseases 2019</a>.</p></template><template data-pop="j09-ph-rein" data-title="Oseltamivir et rein : pourquoi adapter"><p class="lab">Mécanisme</p><p>Le carboxylate d’oseltamivir, presque pas métabolisé, est éliminé dans l’urine par filtration glomérulaire et sécrétion tubulaire des anions. Quand la clairance baisse, sa demi-vie s’allonge ; une dose réduite ou espacée rétablit l’exposition d’un rein normal.</p><p class="lab">Conséquence clinique</p><p>L’hémodialyse épure le métabolite : une dose suit donc chaque séance en traitement. Le baloxavir est éliminé surtout dans les selles.</p><div class="key"><b>Limite.</b> L’information suisse de 2010 fixait le seuil à 30 ml/min ; celle de janvier 2026, en vigueur, le porte à 60 ml/min.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a>.</p></template><template data-pop="j09-ph-h275y" data-title="Mutation H275Y et résistance à l’oseltamivir"><p class="lab">Fonction et cible</p><p>Une tyrosine remplace une histidine en position 275 de la neuraminidase des virus H1N1 (H274Y dans une autre numérotation).</p><p class="lab">Mécanisme</p><p>Pour fixer l’oseltamivir, l’enzyme doit faire pivoter un acide glutamique voisin et ouvrir une poche hydrophobe ; la tyrosine, plus volumineuse, l’en empêche. Le zanamivir, plus proche de l’acide sialique, n’a pas besoin de cette poche.</p><p class="lab">Conséquence clinique</p><p>De 2007 à 2009, presque tous les H1N1 saisonniers étaient résistants ; le virus pandémique de 2009 qui les a remplacés est resté très majoritairement sensible. La résistance émerge surtout chez l’immunodéprimé traité longtemps.</p><div class="key"><b>Limite.</b> La fréquence varie selon les saisons et se lit dans les rapports de surveillance de l’OMS et des CDC.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018, Clinical Infectious Diseases 2019</a>.</p></template><template data-pop="j09-ph-i38t" data-title="Mutation I38T et baloxavir"><p class="lab">Fonction et cible</p><p>Une thréonine remplace une isoleucine en position 38 de la sous-unité acide de la polymérase, dans le site de l’endonucléase.</p><p class="lab">Mécanisme</p><p>La chaîne latérale plus petite de la thréonine réduit les contacts avec le baloxavir, tandis que l’enzyme reste assez active pour le virus.</p><p class="lab">Conséquence clinique</p><p>Selon l’information suisse, des virus mutés sont apparus sous traitement chez 9,7 % des patients infectés de CAPSTONE-1, 5,2 % de CAPSTONE-2 et 19,3 % des enfants de 1 à 12 ans. Dans CENTERSTONE, 7,2 % des cas index en ont développé, sans transmission détectée. L’émergence peut s’accompagner d’un rebond de la charge virale.</p><div class="key"><b>Limite.</b> Les conséquences cliniques restent incertaines ; le risque est plus grand chez l’enfant et l’immunodéprimé.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1056/NEJMoa2413156" target="_blank" rel="noopener">Monto, New England Journal of Medicine 2025</a>.</p></template><template data-pop="j09-ph-vvaa" data-title="Vaccin vivant atténué et antiviraux"><p class="lab">Mécanisme</p><p>Le vaccin intranasal immunise par la réplication de virus atténués dans le nez. Un antiviral présent dans la muqueuse bloque cette réplication, et la durée d’interférence suit sa demi-vie.</p><p class="lab">Conséquence clinique</p><p>Selon l’ACIP 2024–2025, l’interférence débute 48 heures avant la vaccination pour l’oseltamivir et le zanamivir, 5 jours avant pour le péramivir et 17 jours avant pour le baloxavir ; elle dure jusqu’à 2 semaines après. L’OFSP indique que ce vaccin n’est pas disponible en Suisse en 2026.</p><div class="key"><b>Limite.</b> Les délais du péramivir et du baloxavir sont calculés sur cinq demi-vies, non tirés d’essais cliniques.</div><p class="src">Références : <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7305a1.htm" target="_blank" rel="noopener">CDC, recommandations de l’ACIP 2024–2025</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, grippe saisonnière, consultée le 08.10.2026</a>.</p></template><template data-pop="j09-ph-cations" data-title="Baloxavir et cations polyvalents"><p class="lab">Mécanisme</p><p>Le baloxavir chélate les ions métalliques : c’est ainsi qu’il bloque les deux ions manganèse du site de l’endonucléase. Dans l’intestin, le calcium, le fer, le magnésium, le sélénium ou le zinc forment avec lui un complexe peu absorbable.</p><p class="lab">Conséquence clinique</p><p>Une dose unique mal absorbée peut rester sans effet antiviral.</p><div class="key"><b>Limite.</b> L’information suisse demande d’éviter ces associations sans fixer d’intervalle ; espacer les prises est une précaution raisonnable.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a>.</p></template><template data-pop="j09-ph-neuropsy" data-title="Troubles neuropsychiatriques sous oseltamivir"><p class="lab">Mécanisme</p><p>La grippe cause elle-même une encéphalopathie, surtout chez l’enfant, par la fièvre et l’inflammation ; délire et convulsions touchent aussi les non-traités. L’information suisse juge la contribution de l’oseltamivir inconnue.</p><p class="lab">Conséquence clinique</p><p>Dobson (2015) ne trouve aucun excès neurologique ou psychiatrique chez l’adulte traité ; la revue Cochrane 2014 trouve un léger excès psychiatrique en prophylaxie. L’entourage de l’enfant et de l’adolescent surveille le comportement.</p><div class="key"><b>Limite.</b> Ce signal rare, non démontré comme causal, ne justifie pas de priver d’oseltamivir une personne qui en a besoin.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1016/S0140-6736(14)62449-1" target="_blank" rel="noopener">Dobson, Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a>.</p></template><template data-pop="j09-ph-reye" data-title="Syndrome de Reye et acide acétylsalicylique"><p class="lab">Fonction et cible</p><p>Le syndrome associe une encéphalopathie aiguë et une stéatose hépatique microvésiculaire après une grippe ou une varicelle.</p><p class="lab">Mécanisme</p><p>Le salicylate perturbe l’oxydation mitochondriale des acides gras ; avec l’infection, il provoque insuffisance hépatique, hyperammoniémie et œdème cérébral. Les cas ont reculé avec l’abandon de l’aspirine en pédiatrie.</p><p class="lab">Conséquence clinique</p><p>Selon l’information d’Aspirine 500, l’adolescent dès 12 ans fébrile ou atteint d’une infection virale ne la prend que sur prescription, en deuxième intention ; vomissements importants, troubles de la conscience et atteinte hépatique doivent alerter.</p><div class="key"><b>Limite.</b> Chez l’adulte, la grippe ne contre-indique pas l’aspirine, qui n’apporte toutefois aucun avantage sur le paracétamol.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/110558-aspirine-cpr-eff-500-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Aspirine 500, consultée le 08.10.2026</a>.</p></template><template data-pop="j09-ph-antibio" data-title="Antibiotique : quand il devient indiqué"><p class="lab">Mécanisme</p><p>Le virus détruit l’épithélium cilié et expose des récepteurs auxquels adhèrent le pneumocoque et Staphylococcus aureus.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 déconseille fortement l’antibiotique dans la grippe non grave à faible probabilité de coinfection. Une pneumonie ou un sepsis exigent au contraire une antibiothérapie rapide, selon le cours sur les pneumonies.</p><div class="key"><b>Limite.</b> Une coinfection précoce existe dans les formes graves : la règle ne vaut pas pour la pneumonie grave hospitalisée.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/health-care-readiness/clinical-guidelines-for-influenza---translation-summary-french.pdf" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024, résumé officiel</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018, Clinical Infectious Diseases 2019</a>.</p></template><template data-pop="j09-ph-cortico" data-title="Corticostéroïdes dans la grippe"><p class="lab">Mécanisme</p><p>En freinant les lymphocytes T et les interférons, ils prolongent l’excrétion virale ; l’observation associe leur emploi dans la grippe grave à plus de décès et de surinfections.</p><p class="lab">Conséquence clinique</p><p>Ils gardent leurs indications propres : exacerbation d’asthme ou de BPCO, choc septique réfractaire selon son protocole, insuffisance surrénalienne.</p><div class="key"><b>Limite.</b> Ces données observationnelles restent exposées au biais d’indication.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/health-care-readiness/clinical-guidelines-for-influenza---translation-summary-french.pdf" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024, résumé officiel</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018, Clinical Infectious Diseases 2019</a>.</p></template><template data-pop="j09-ph-paracetamol" data-title="Paracétamol dans la grippe"><p class="lab">Fonction et cible</p><p>Il abaisse la fièvre et soulage les myalgies par une action surtout centrale.</p><p class="lab">Mécanisme</p><p>Une petite fraction devient un métabolite réactif neutralisé par le glutathion hépatique ; le jeûne, l’alcool et la dénutrition épuisent ce glutathion, et un surdosage lèse le foie.</p><p class="lab">Conséquence clinique</p><p>L’adulte de plus de 40 kg prend 500 à 1 000 mg par prise, à 4 à 8 heures d’intervalle, sans dépasser 4 000 mg par jour, spécialités combinées contre le rhume comprises.</p><div class="key"><b>Limite.</b> Le plafond n’est pas un objectif ; la dose baisse en cas de dénutrition, d’alcoolisme ou d’hépatopathie.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1547675-paracetamol-sandoz-eco-cpr-500-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Paracétamol Sandoz eco, consultée le 08.10.2026</a>.</p></template><template data-pop="j09-ph-ains" data-title="Anti-inflammatoires non stéroïdiens dans la grippe"><p class="lab">Mécanisme</p><p>Quand la volémie baisse, les prostaglandines dilatent l’artériole afférente et maintiennent la filtration glomérulaire. Fièvre, vomissements et faible prise de boissons réduisent la volémie ; l’AINS, qui inhibe les cyclo-oxygénases, supprime cette compensation et peut causer une insuffisance rénale aiguë, surtout avec un diurétique ou un inhibiteur du système rénine-angiotensine.</p><p class="lab">Conséquence clinique</p><p>L’information de Brufen contre-indique l’ibuprofène en cas de clairance inférieure à 30 ml/min, d’insuffisance cardiaque NYHA III–IV, d’ulcère actif, de bronchospasme après un AINS et au troisième trimestre de la grossesse. Le paracétamol est préféré chez la personne âgée, déshydratée ou insuffisante rénale.</p><div class="key"><b>Limite.</b> Chez l’adulte jeune bien hydraté, une prise brève à la dose minimale efficace reste possible.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/13700-brufen-cpr-pell-400-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Brufen, consultée le 08.10.2026</a>.</p></template><template data-pop="j09-ph-vaccin" data-title="Vaccin grippal inactivé : mécanisme et limites"><p class="lab">Fonction et cible</p><p>Le vaccin fragmenté apporte l’hémagglutinine et la neuraminidase des souches choisies par l’OMS, sans virus réplicatif.</p><p class="lab">Mécanisme</p><p>Les anticorps contre la tête de l’hémagglutinine empêchent la fixation du virus sur l’acide sialique. La dérive antigénique modifie cette protéine chaque année ; la composition change donc, aujourd’hui trivalente : A(H1N1), A(H3N2) et B lignée Victoria.</p><p class="lab">Conséquence clinique</p><p>Il peut être injecté le même jour que le vaccin contre la COVID-19. Selon l’OFSP, jusqu’à 25 % des vaccinés ont une douleur ou une rougeur locale, environ 5 % une fièvre ou des myalgies brèves.</p><div class="key"><b>Limite.</b> L’efficacité varie avec la concordance des souches et l’âge ; elle réduit le risque sans l’annuler, d’où la vaccination des contacts.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, grippe saisonnière, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Efluelda TIV 2026/2027, consultée le 08.10.2026</a>.</p></template><template data-pop="j09-ph-hautedose" data-title="Vaccin à haute dose après 65 ans"><p class="lab">Mécanisme</p><p>Avec l’âge, les lymphocytes B et T naïfs diminuent et coopèrent moins bien : c’est l’immunosénescence. Efluelda contient 60 µg d’hémagglutinine par souche contre 15 µg, ce qui élève les titres d’anticorps.</p><p class="lab">Conséquence clinique</p><p>Dans l’essai de Diaz Granados (31 989 personnes de 65 ans et plus), la grippe confirmée passe de 1,9 % à 1,4 % : efficacité relative de 24,2 % (intervalle de confiance à 95 % : 9,7 à 36,5).</p><div class="key"><b>Limite.</b> La réactogénicité est plus forte : douleur locale chez 41 % et myalgies chez 22,5 % selon l’information suisse. Le vaccin n’est indiqué ni avant 65 ans ni pendant la grossesse.</div><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1315727" target="_blank" rel="noopener">Diaz Granados, New England Journal of Medicine 2014</a> ; <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Efluelda TIV 2026/2027, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, état février 2025</a>.</p></template><template data-pop="j09-ph-ci-vaccin" data-title="Contre-indications vaccinales et allergie à l’œuf"><p class="lab">Mécanisme</p><p>Les vaccins cultivés sur œufs contiennent des traces d’ovalbumine et de formaldéhyde, cibles possibles d’une anaphylaxie. Une infection aiguë modérée à sévère brouille l’interprétation d’un effet indésirable. Un syndrome de Guillain et Barré après un vaccin antérieur pourrait relever d’un mécanisme auto-immun.</p><p class="lab">Conséquence clinique</p><p>L’information d’Efluelda (décembre 2024) contre-indique le vaccin en cas d’hypersensibilité aux composants ou aux traces d’œuf et de formaldéhyde, et demande de la prudence en cas de trouble de la coagulation. L’ACIP 2024–2025 ne demande aucune précaution liée à l’allergie à l’œuf, l’ovalbumine résiduelle étant minime.</p><div class="key"><b>Limite.</b> En Suisse, l’information du produit fait foi. Une allergie grave à l’œuf demande un avis allergologique et une vaccination dans une structure capable de traiter l’anaphylaxie, plutôt que l’abstention.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Efluelda TIV 2026/2027, consultée le 08.10.2026</a> ; <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7305a1.htm" target="_blank" rel="noopener">CDC, recommandations de l’ACIP 2024–2025</a>.</p></template><template data-pop="pareto-j09-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j09-p-1,j09-p-2,j09-p-3,j09-p-4,j09-p-5,j09-p-6,j09-p-7,j09-p-8"></p><ul><li>L’oseltamivir et le baloxavir sont les antiviraux de référence en Suisse ; les adamantanes sont obsolètes.</li><li>Le patient grave ou hospitalisé reçoit l’oseltamivir sans attendre, quel que soit le délai. Le patient non grave à risque élevé reçoit un antiviral précoce, de préférence le baloxavir (OMS 2024) ; à risque faible, aucun antiviral systématique.</li><li>L’oseltamivir se donne à 75 mg deux fois par jour pendant 5 jours et s’adapte dès une clairance de 60 ml/min. Le baloxavir se donne en dose unique de 40 mg ou 80 mg dans les 48 heures.</li><li>La mutation H275Y réduit l’effet de l’oseltamivir ; I38T, celui du baloxavir.</li><li>Le baloxavir se prend à distance des cations polyvalents ; le zanamivir n’est jamais nébulisé ; un antiviral annule le vaccin vivant.</li><li>L’aspirine est évitée chez l’enfant et l’adolescent ; antibiotique et corticostéroïde exigent une indication propre ; le paracétamol est le premier choix.</li><li>Le vaccin inactivé est annuel dès la mi-octobre ; la haute dose est préférée dès 75 ans, ou dès 65 ans avec un facteur de risque.</li></ul></template>
<template data-pop="j09-reflexe-rein" data-title="Estimer la clairance avant la première dose d’oseltamivir"><p class="lab">Mécanisme</p><p>Le carboxylate d’oseltamivir, métabolite actif, est éliminé par filtration glomérulaire et sécrétion tubulaire ; une clairance abaissée augmente son exposition, donc les nausées, les vomissements et les manifestations neuropsychiatriques.</p><p class="lab">Ordre des gestes</p><p>Estimer la clairance de la créatinine, puis appliquer le palier : 75 mg deux fois par jour au-delà de 60 mL/min, 30 mg deux fois par jour de plus de 30 à 60 mL/min, 30 mg une fois par jour de 10 à 30 mL/min, et un schéma lié aux séances en hémodialyse. En dessous de 10 mL/min sans dialyse, aucune dose n’est recommandée, faute de données pharmacocinétiques.</p><p class="lab">Conséquence pratique</p><p>Le baloxavir, d’élimination surtout biliaire, ne demande aucune adaptation rénale et reste utilisable sans ajustement dans ses propres indications.</p><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-penser-resistance" data-title="Résistance virale chez l’immunodéprimé"><p class="lab">Mécanisme</p><p>Une réplication prolongée sous antiviral sélectionne les virus dont la cible a muté : la substitution H275Y de la neuraminidase réduit très fortement la sensibilité des virus H1N1 à l’oseltamivir, et la substitution I38T de la sous-unité acide de la polymérase réduit celle du baloxavir de plus de dix fois, chez 5 à 10 % des adultes traités.</p><p class="lab">Conséquence pratique</p><p>Chez un greffé ou un patient sous immunosuppresseur qui s’aggrave sous traitement, avec une amplification génique restée positive, demander un test de résistance au laboratoire de référence et discuter un changement de classe : le zanamivir et le baloxavir restent actifs sur un virus porteur de H275Y.</p><div class="key"><b>Limite.</b> Une aggravation sous antiviral évoque d’abord une surinfection bactérienne ou une complication cardiaque ; la résistance ne se retient qu’après les avoir écartées.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC, antiviraux, résumé pour cliniciens, mis à jour le 10.03.2026</a>.</p></template>
<template data-pop="j09-piege-cations" data-title="Un comprimé de baloxavir mal pris est un traitement perdu"><p class="lab">Mécanisme</p><p>Le baloxavir forme avec les cations polyvalents (calcium, magnésium, fer, aluminium) des complexes qui ne sont pas absorbés, et l’exposition plasmatique chute. Comme le traitement tient en une prise unique, aucune dose suivante ne vient compenser cette perte.</p><p class="lab">Conséquence pratique</p><p>Le comprimé se prend à distance des antiacides, des laxatifs, des compléments minéraux et des boissons enrichies en calcium ; les produits laitiers sont évités au moment de la prise. La consigne s’explique au patient, car une prise accompagnée d’un antiacide ou de produits laitiers réduit fortement l’exposition au médicament.</p><p class="src">Référence : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a>.</p></template>
