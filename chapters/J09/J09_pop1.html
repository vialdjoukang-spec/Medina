<template data-pop="j09-q-decision" data-title="Quatre décisions devant un syndrome grippal"><p class="lab">Fonction et cible</p><p>Un syndrome grippal impose quatre décisions : tester ou non, traiter par antiviral ou non, soigner à domicile ou à l’hôpital, protéger l’entourage.</p><p class="lab">Mécanisme de l’affirmation</p><p>La gravité se juge d’abord, car un patient instable est orienté avant tout test. Le terrain vient ensuite, car il fonde l’indication antivirale ; le test n’est utile que si son résultat change la conduite. La protection de l’entourage découle d’une contagiosité maximale les trois premiers jours.</p><p class="lab">Conséquence clinique</p><p>En période épidémique, l’adulte jeune sans facteur de risque n’a besoin ni de test ni d’antiviral. Chez le patient à risque ou hospitalisé, le test et l’antiviral se discutent immédiatement.</p><div class="key"><b>Limite.</b> Cette séquence résume la démarche ; les parties Diagnostic et Prise en charge en donnent les critères détaillés.</div><p class="src">Références : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j09-types" data-title="Types A, B, C et D du virus influenza"><p class="lab">Fonction et cible</p><p>Les quatre types se distinguent par leurs protéines internes, la nucléoprotéine et la protéine de matrice.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le type A infecte les oiseaux, les porcs, les chevaux et l’être humain ; cette diversité d’hôtes permet des réassortiments entre virus d’espèces différentes. Le type B, presque strictement humain, évolue par dérive mais ne subit pas de cassure. Aucune maladie humaine n’est clairement attribuée au type D.</p><p class="lab">Conséquence clinique</p><p>Seuls les types A et B entrent dans les vaccins, et seul le type A peut causer une pandémie. Le type B peut être grave, notamment chez l’enfant et lors de certaines saisons.</p><div class="key"><b>Limite.</b> Un test qui distingue A et B ne précise pas le sous-type ; seul un laboratoire de référence identifie un virus zoonotique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-hn" data-title="Hémagglutinine et neuraminidase : sous-types H et N"><p class="lab">Fonction et cible</p><p>Les deux glycoprotéines de l’enveloppe virale définissent les sous-types du type A.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’hémagglutinine fixe le virus à l’acide sialique et assure la fusion des membranes ; la neuraminidase coupe l’acide sialique pour libérer les virions. Deux sous-types n’ont été trouvés que chez des chauves-souris. Les anticorps protecteurs visent surtout la tête de l’hémagglutinine.</p><p class="lab">Conséquence clinique</p><p>H1N1 et H3N2 sont les sous-types humains saisonniers, H5N1 un sous-type aviaire. L’hémagglutinine est la cible des vaccins, la neuraminidase celle de l’oseltamivir et du zanamivir.</p><div class="key"><b>Limite.</b> Le sous-type ne prédit pas le comportement : A(H1N1)pdm09 et le virus H1N1 de 1918 le partagent sans partager leurs propriétés épidémiques.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-nomenclature" data-title="Nom complet d’une souche de grippe"><p class="lab">Fonction et cible</p><p>Le nom d’une souche indique le type, l’hôte s’il n’est pas humain, le lieu du premier isolement, le numéro, l’année et, pour le type A, le sous-type entre parenthèses.</p><p class="lab">Mécanisme de l’affirmation</p><p>A/Lieu/numéro/année(H3N2) désigne un virus A isolé chez l’être humain, de sous-type H3N2. Pour un virus animal, l’espèce suit le type, par exemple « A/canard/… ». Le suffixe « pdm09 » distingue le virus pandémique de 2009 des virus H1N1 antérieurs.</p><p class="lab">Conséquence clinique</p><p>Cette règle permet de lire la composition annuelle du vaccin, qui nomme chaque souche, et les rapports de surveillance.</p><div class="key"><b>Limite.</b> Le nom ne dit rien de la sensibilité aux antiviraux ni de la concordance avec le vaccin ; ces données viennent des laboratoires de référence.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-derive" data-title="Dérive antigénique"><p class="lab">Fonction et cible</p><p>La dérive accumule des mutations ponctuelles dans les gènes de l’hémagglutinine et de la neuraminidase des types A et B.</p><p class="lab">Mécanisme de l’affirmation</p><p>La polymérase virale ne corrige pas ses erreurs de copie. Dans une population partiellement immunisée, les variants dont les sites antigéniques ont changé échappent aux anticorps neutralisants et sont sélectionnés.</p><p class="lab">Conséquence clinique</p><p>La concordance vaccinale peut baisser une saison donnée : en 2023/2024, 18 % des virus suisses caractérisés ne réagissaient pas aux antisérums dirigés contre les souches vaccinales.</p><div class="key"><b>Limite.</b> La dérive ne crée pas de nouveau sous-type, et une immunité croisée partielle persiste ; c’est ce qui sépare une épidémie saisonnière d’une pandémie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-cassure" data-title="Cassure antigénique et pandémie"><p class="lab">Fonction et cible</p><p>La cassure introduit chez l’être humain un virus A porteur d’une hémagglutinine nouvelle ; elle seule peut provoquer une pandémie.</p><p class="lab">Mécanisme de l’affirmation</p><p>Quand deux virus différents, humain et aviaire par exemple, infectent la même cellule, les virions néoformés peuvent combiner leurs huit segments. Le porc, porteur de récepteurs pour les virus humains et aviaires, sert de lieu de mélange ; le virus de 2009 est un réassortant d’origine porcine. Un virus animal peut aussi s’adapter directement à l’être humain par mutations.</p><p class="lab">Conséquence clinique</p><p>Une pandémie exige une hémagglutinine nouvelle, une population sans immunité et une transmission interhumaine efficace. Elle frappe alors des adultes jeunes et peut survenir hors saison ; le virus pandémique devient ensuite souvent saisonnier et remplace son prédécesseur du même type.</p><div class="key"><b>Limite.</b> La plupart des infections humaines par un virus aviaire restent des impasses, faute de transmission interhumaine soutenue.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://cdn.who.int/media/docs/default-source/influenza/h5n1-human-case-cumulative-table/2026_table_h5n1_march.pdf" target="_blank" rel="noopener">OMS, cas humains cumulés de grippe A(H5N1), état au 31.03.2026</a>.</p></template>
<template data-pop="j09-codage" data-title="Trois pièges de codage de la grippe"><p class="lab">Mécanisme de l’affirmation</p><p><i>Haemophilus influenzae</i> est une bactérie sans lien avec le virus influenza ; ses infections sont exclues des catégories J09 à J11. Le rhume, infection aiguë des voies respiratoires supérieures sans grippe, est exclu de J11 et se code ailleurs. Pour un virus pandémique devenu saisonnier, la CIM-10-GM renvoie aux règles du programme mondial de lutte contre la grippe de l’OMS : A(H1N1)pdm09 se code aujourd’hui comme un virus saisonnier.</p><p class="lab">Conséquence clinique</p><p>J09 n’a pas de subdivision : une pneumonie ou une autre manifestation s’y ajoute par un code supplémentaire.</p><div class="key"><b>Limite.</b> Le code ne remplace pas la déclaration obligatoire : un virus zoonotique suspecté se déclare à l’autorité sanitaire.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j09-j18.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc J09 à J18, version allemande officielle</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j09-sentinella" data-title="Réseau Sentinella et définition du syndrome grippal"><p class="lab">Fonction et cible</p><p>Sentinella réunit des généralistes, internistes et pédiatres volontaires. Il estime l’activité grippale, car la plupart des patients peu malades ne sont jamais testés.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le syndrome grippal y est défini par l’apparition soudaine d’une forte fièvre de plus de 38 °C avec toux ou maux de gorge, éventuellement avec malaise marqué, faiblesse, douleurs musculaires ou articulaires, céphalées ou symptômes digestifs. Le Centre national de référence, aux Hôpitaux universitaires de Genève, analyse les frottis par PCR multiplex.</p><p class="lab">Conséquence clinique</p><p>L’OFSP extrapole ces déclarations à la population et publie un bulletin hebdomadaire, qui renseigne la probabilité avant test.</p><div class="key"><b>Limite.</b> L’échantillon est petit, et l’OFSP invite à lire les extrapolations avec prudence. D’autres virus remplissent la définition du syndrome grippal.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-seuil" data-title="Seuil épidémique : ancienne et nouvelle méthode"><p class="lab">Fonction et cible</p><p>Un seuil épidémique date le début et la fin d’une épidémie.</p><p class="lab">Mécanisme de l’affirmation</p><p>Jusqu’en 2019/2020, l’OFSP fixait avant chaque saison un seuil de consultations calculé sur les saisons précédentes. La pandémie de COVID-19 a bouleversé les consultations et la circulation virale : l’OFSP y a renoncé dès 2020/2021. En 2023/2024, la positivité des frottis Sentinella a culminé à 46,2 % la cinquième semaine.</p><p class="lab">Conséquence clinique</p><p>La positivité dit directement quelle part des syndromes grippaux est due à la grippe : à 40 %, un syndrome grippal sur deux à trois est une grippe.</p><div class="key"><b>Limite.</b> Elle dépend de la sélection des patients prélevés, et certains cantons emploient leurs propres seuils ; le médecin vérifie la source de l’indicateur.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/bag/fr/dokumente/mt/infektionskrankheiten/grippe/saisonbericht-grippe-2021-22.pdf.download.pdf/saisonbericht-grippe-2021-22_FR.pdf" target="_blank" rel="noopener">OFSP, Rapport sur la saison grippale 2021/2022</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-age" data-title="Incidence et gravité selon l’âge"><p class="lab">Fonction et cible</p><p>L’âge agit en sens opposé sur le risque d’infection et sur le risque de complication.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les jeunes enfants, sans immunité antérieure, s’infectent plus souvent et excrètent plus longtemps ; en 2023/2024, les consultations Sentinella étaient les plus fréquentes chez les 0 à 4 ans et les plus rares chez les 65 ans et plus. Chez la personne âgée, l’immunosénescence et les comorbidités aggravent la maladie : une pneumonie compliquait 8,6 % des consultations des 65 ans et plus, contre 3,4 % de l’ensemble des patients.</p><p class="lab">Conséquence clinique</p><p>Le vaccin et l’antiviral visent d’abord les personnes âgées. Vacciner l’entourage des nourrissons de moins de six mois, qui ne peuvent pas être vaccinés, les protège indirectement.</p><div class="key"><b>Limite.</b> Ces données décrivent une saison dominée par A(H1N1)pdm09 ; les saisons à A(H3N2) pèsent souvent davantage sur les personnes âgées.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-fardeau" data-title="Hospitalisations et décès dus à la grippe en Suisse"><p class="lab">Fonction et cible</p><p>Le fardeau mesure l’impact de la grippe sur le système de santé et fonde la stratégie nationale de prévention.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces chiffres sont des estimations : beaucoup de décès surviennent par décompensation cardiaque ou pulmonaire chez des patients jamais testés et sont attribués à une autre cause.</p><p class="lab">Conséquence clinique</p><p>Pour une personne âgée, la grippe n’est pas une maladie anodine ; cet argument soutient la vaccination.</p><div class="key"><b>Limite.</b> Les six hôpitaux de surveillance ne représentent pas tous les hôpitaux suisses, et ce système a été suspendu fin août 2024. Les données récentes se lisent sur le portail de l’OFSP.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/fr/strategie-nationale-de-prevention-de-la-grippe-grips" target="_blank" rel="noopener">OFSP, Stratégie nationale de prévention de la grippe, publiée le 06.01.2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-ha" data-title="Hémagglutinine et acide sialique"><p class="lab">Fonction et cible</p><p>L’hémagglutinine reconnaît l’acide sialique terminal, lié au sucre suivant par une liaison alpha 2,6 ou alpha 2,3.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les virus humains préfèrent la liaison alpha 2,6, abondante dans les voies aériennes supérieures ; les virus aviaires préfèrent la liaison alpha 2,3, présente chez l’être humain surtout dans les bronchioles et les alvéoles. L’hémagglutinine doit aussi être clivée par des protéases de l’hôte. Chez les virus saisonniers, seules des protéases de l’épithélium respiratoire la clivent ; certains virus aviaires hautement pathogènes, dont A(H5N1), portent un site multibasique clivé dans de nombreux tissus.</p><p class="lab">Conséquence clinique</p><p>Un virus aviaire se fixe mal au nez et à la gorge, donc se transmet mal entre humains ; parvenu aux alvéoles, il provoque une pneumonie grave. Les infections humaines par A(H5N1) sont donc rares mais graves.</p><div class="key"><b>Limite.</b> Quelques mutations suffisent à déplacer la préférence vers la liaison alpha 2,6 ; la surveillance génétique des virus aviaires recherche précisément ces mutations.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a>.</p></template>
<template data-pop="j09-cycle" data-title="Endocytose, polymérase virale et vol de coiffe"><p class="lab">Fonction et cible</p><p>La protéine de matrice 2 et la polymérase virale à trois sous-unités livrent le génome au noyau et font produire les protéines virales.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le canal à protons de la protéine de matrice 2 acidifie l’intérieur du virion et libère ses ribonucléoprotéines ; l’acidité change aussi la forme de l’hémagglutinine, qui fusionne l’enveloppe avec la membrane. Dans le noyau, l’endonucléase d’une sous-unité de la polymérase arrache l’extrémité coiffée des ARN messagers cellulaires et s’en sert d’amorce.</p><p class="lab">Conséquence clinique</p><p>Le baloxavir marboxil inhibe cette endonucléase et réduit vite la charge virale. L’amantadine bloquait le canal de la protéine de matrice 2 ; la résistance quasi générale des virus actuels l’a rendue inutilisable.</p><div class="key"><b>Limite.</b> Une mutation de l’endonucléase réduit la sensibilité au baloxavir, surtout chez l’enfant et l’immunodéprimé ; l’onglet Pharmacologie la détaille.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-na" data-title="Neuraminidase et libération des virions"><p class="lab">Fonction et cible</p><p>La neuraminidase coupe l’acide sialique, en fin de cycle et dans le mucus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Sans elle, l’hémagglutinine retiendrait les virions bourgeonnants à la surface de la cellule et les agrégerait entre eux. Elle découpe aussi les mucines sialylées qui piégeraient le virus avant l’épithélium, et elle dévoile des récepteurs pour le pneumocoque.</p><p class="lab">Conséquence clinique</p><p>L’oseltamivir et le zanamivir retiennent les virions sur la cellule infectée et ralentissent la propagation aux cellules voisines. Comme ils n’agissent pas sur les cellules déjà infectées, leur bénéfice est maximal pendant la réplication active, donc tôt.</p><div class="key"><b>Limite.</b> Des mutations de la neuraminidase confèrent une résistance ; le Centre national de référence de l’influenza la recherche sur un échantillon de virus suisses.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a>.</p></template>
<template data-pop="j09-ifn" data-title="Interférons et protéine non structurale 1"><p class="lab">Fonction et cible</p><p>Les interférons de type I et III forment la première défense antivirale, produite dans les heures qui suivent l’infection.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des senseurs cytosoliques reconnaissent des motifs de l’acide ribonucléique viral absents des ARN cellulaires et déclenchent la sécrétion d’interférons. Ceux-ci induisent dans les cellules voisines des protéines qui freinent la réplication. La protéine non structurale 1 du virus inhibe ces senseurs et la synthèse des interférons.</p><p class="lab">Conséquence clinique</p><p>Une réponse rapide confine la réplication à l’épithélium bronchique. Une réponse retardée laisse monter la charge virale, puis s’accompagne d’une inflammation excessive ; les interférons participent aussi à la fièvre et à la fatigue.</p><div class="key"><b>Limite.</b> La même réponse altère le recrutement des polynucléaires et des macrophages contre les bactéries ; elle favorise donc la surinfection.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a>.</p></template>
<template data-pop="j09-cytokines" data-title="Des cytokines aux symptômes généraux"><p class="lab">Mécanisme de l’affirmation</p><p>Chez 19 volontaires infectés par un virus A(H1N1), l’IL-6 et l’interféron alpha des sécrétions nasales évoluaient avec la charge virale, la température, la production de mucus et les scores de symptômes ; le TNF s’élevait aux troisième et quatrième jours. Ces cytokines élèvent le point de consigne thermique de l’hypothalamus par la PGE₂ : le patient frissonne jusqu’à ce que sa température atteigne ce nouveau point.</p><p class="lab">Conséquence clinique</p><p>Le paracétamol réduit la PGE₂ et soulage la fièvre et les courbatures sans agir sur le virus. L’intensité des signes généraux du deuxième jour coïncide avec le pic de réplication et de contagiosité.</p><div class="key"><b>Limite.</b> Ces adultes jeunes infectés expérimentalement ne représentent pas la personne âgée, chez qui la fièvre peut manquer malgré une infection active.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-adaptatif" data-title="Anticorps et lymphocytes T dans la grippe"><p class="lab">Fonction et cible</p><p>L’immunité adaptative élimine le virus et protège contre une réinfection par une souche proche.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les anticorps contre la tête de l’hémagglutinine empêchent l’attachement du virus ; les IgA sécrétoires protègent la muqueuse ; les anticorps contre la neuraminidase limitent la diffusion. Les lymphocytes T CD8 reconnaissent les protéines internes, plus stables d’une souche à l’autre, et détruisent les cellules infectées. Chez le sujet déjà exposé, la mémoire accélère cette réponse.</p><p class="lab">Conséquence clinique</p><p>Les anticorps fondent la protection vaccinale, qui dépend de la concordance des souches. Les lymphocytes T expliquent qu’une exposition antérieure atténue la gravité sans empêcher l’infection.</p><div class="key"><b>Limite.</b> La dérive contourne les anticorps spécifiques de souche. Un déficit de l’immunité cellulaire, après une greffe par exemple, prolonge l’excrétion virale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-dad" data-title="Pneumonie virale primaire et dommage alvéolaire diffus"><p class="lab">Fonction et cible</p><p>La pneumonie virale primaire est une atteinte alvéolaire due au virus seul. Elle survient en général dans les trois à cinq premiers jours de la maladie.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus infecte les pneumocytes et l’endothélium des capillaires alvéolaires ; la barrière alvéolo-capillaire devient perméable et un exsudat riche en protéines remplit les alvéoles. Ces alvéoles perfusées mais non ventilées créent un effet shunt, que l’oxygène corrige mal.</p><p class="lab">Conséquence clinique</p><p>Le patient présente une dyspnée croissante, une tachypnée et une hypoxémie, souvent avec des opacités bilatérales. Le SDRA peut exiger une ventilation mécanique, voire une oxygénation par membrane extracorporelle.</p><div class="key"><b>Limite.</b> La pneumonie virale et la surinfection bactérienne peuvent coexister. Ni l’imagerie ni la clinique ne les séparent toujours, d’où la recherche microbiologique de l’onglet Examens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-surinfection" data-title="Synergie entre virus influenza et bactéries"><p class="lab">Fonction et cible</p><p>La surinfection est une pneumonie bactérienne favorisée par les lésions virales ; elle a dominé la mortalité des grandes pandémies anciennes.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’épithélium détruit expose la membrane basale, où les bactéries adhèrent ; la neuraminidase dévoile des récepteurs bactériens ; les interférons et la mort des macrophages alvéolaires réduisent la clairance bactérienne. L’analyse de 58 autopsies de 1918 et de 109 séries publiées attribue la majorité des décès de cette pandémie à une pneumonie bactérienne secondaire.</p><p class="lab">Conséquence clinique</p><p>La surinfection se manifeste typiquement par une aggravation après amélioration, du quatrième au quatorzième jour environ. Ce mécanisme fonde la vaccination antipneumococcique des groupes à risque et un antibiotique ciblé en cas de surinfection documentée ou probable.</p><div class="key"><b>Limite.</b> La plupart des grippes ne se surinfectent pas. Un antibiotique systématique dans une grippe simple expose aux effets indésirables et aux résistances, sans bénéfice.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., causes de décès de la pandémie de 1918, 2008</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j09-voies" data-title="Gouttelettes, aérosols et contact"><p class="lab">Fonction et cible</p><p>Les plus grosses particules respiratoires tombent en un à deux mètres ; les plus fines restent en suspension dans un local mal ventilé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Selon le CDC, le virus se transmet surtout par les gouttelettes, moins souvent par une surface contaminée portée ensuite à la bouche, au nez ou aux yeux. La part des particules fines dans la transmission reste discutée.</p><p class="lab">Conséquence clinique</p><p>Les mesures découlent des voies : masque chirurgical, distance, aération, hygiène des mains et nettoyage des surfaces. Lors des gestes générant des aérosols, comme l’intubation, le soignant porte un appareil de protection respiratoire filtrant.</p><div class="key"><b>Limite.</b> Aucune mesure isolée ne suffit, d’autant que la transmission commence avant les symptômes.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/spread/index.html" target="_blank" rel="noopener">CDC, How flu spreads, mise à jour du 17.09.2024</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-incubation" data-title="Incubation et cinétique de l’excrétion virale"><p class="lab">Fonction et cible</p><p>La période contagieuse correspond à l’excrétion d’un virus capable d’infecter.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’OFSP retient une incubation de un à trois jours, le CDC de un à quatre. Chez les volontaires inoculés, l’excrétion augmentait nettement entre 12 et 24 heures après l’infection, culminait au deuxième jour et durait en moyenne 4,8 jours.</p><p class="lab">Conséquence clinique</p><p>Le malade limite ses contacts pendant les premiers jours, surtout avec des personnes à risque, et un soignant malade ne soigne pas de patients durant cette période. Un contact qui tombe malade dans les quatre jours suivant l’exposition a probablement été infecté par ce cas.</p><div class="key"><b>Limite.</b> Ces données de volontaires jeunes ne s’appliquent pas directement à la personne âgée.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/spread/index.html" target="_blank" rel="noopener">CDC, How flu spreads, mise à jour du 17.09.2024</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a>.</p></template>
<template data-pop="j09-asympto" data-title="Infections asymptomatiques et peu symptomatiques"><p class="lab">Fonction et cible</p><p>Une infection asymptomatique ne provoque aucun symptôme ; une infection peu symptomatique n’en provoque qu’un.</p><p class="lab">Mécanisme de l’affirmation</p><p>Dans une étude de contacts familiaux à Hong Kong portant sur 235 infections secondaires, 11 % étaient asymptomatiques et 13 % peu symptomatiques. Ces patients excrétaient l’ARN viral moins longtemps et en quantité inférieure de 1 à 2 logarithmes décimaux.</p><p class="lab">Conséquence clinique</p><p>Une personne à peine malade peut infecter un patient fragile. La vaccination du personnel, le masque en période épidémique et l’hygiène des mains protègent mieux qu’un tri fondé sur les seuls symptômes.</p><div class="key"><b>Limite.</b> L’ARN détecté ne prouve pas la présence de virus infectieux ; la part de ces formes dans la transmission reste incertaine.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28011603/" target="_blank" rel="noopener">Ip et al., excrétion virale des infections peu symptomatiques, 2017</a>.</p></template>
<template data-pop="j09-risque" data-title="Personnes à risque accru de complications selon l’OFSP"><p class="lab">Fonction et cible</p><p>Cette liste fixe les cibles prioritaires de la vaccination, prise en charge par l’assurance obligatoire des soins sous réserve de la franchise.</p><p class="lab">Mécanisme de l’affirmation</p><p>Elle comprend les personnes de 65 ans et plus, les femmes enceintes ou ayant accouché depuis moins de quatre semaines, et les prématurés nés avant 32 semaines ou pesant moins de 1500 g, pendant leurs deux premiers hivers dès l’âge de six mois. Elle comprend aussi, dès six mois, les personnes atteintes d’une maladie cardiaque, pulmonaire, neurologique, musculosquelettique ou hépatique, d’une maladie métabolique retentissant sur le cœur, le poumon ou le rein (diabète, obésité morbide), d’une insuffisance rénale, d’une asplénie, d’une hémoglobinopathie ou d’une immunodéficience. Les résidents des établissements de soins y figurent également.</p><p class="lab">Conséquence clinique</p><p>Les mêmes patients sont candidats à un antiviral précoce. Dès 75 ans, ou dès 65 ans avec un facteur de risque supplémentaire, l’OFSP privilégie un vaccin à dose élevée.</p><div class="key"><b>Limite.</b> Conçue pour la vaccination, la liste ne remplace pas l’évaluation clinique : un patient sans facteur de risque peut faire une forme grave.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-grossesse-risque" data-title="Pourquoi la grossesse aggrave la grippe"><p class="lab">Mécanisme de l’affirmation</p><p>L’utérus refoule le diaphragme et réduit la capacité résiduelle fonctionnelle, réserve d’oxygène des poumons. La consommation d’oxygène et le débit cardiaque augmentent, et l’immunité s’adapte pour tolérer le fœtus ; une hypoxémie maternelle réduit en outre l’oxygénation fœtale.</p><p class="lab">Conséquence clinique</p><p>Aux États-Unis, d’avril à août 2009, 30 des 788 femmes enceintes rapportées sont décédées, soit 5 % de tous les décès dus au virus pandémique sur cette période ; parmi les 56 décès de femmes enceintes admises aux soins intensifs jusqu’à fin 2009, 64,3 % survenaient au troisième trimestre. Un traitement débuté plus de quatre jours après les symptômes s’associait à davantage d’admissions aux soins intensifs qu’un traitement dans les deux jours. L’OFSP recommande la vaccination à toute femme enceinte et pendant les quatre semaines suivant l’accouchement.</p><div class="key"><b>Limite.</b> Ces données observationnelles portent sur un virus pandémique et une surveillance américaine ; elles décrivent une association, non le résultat d’un essai randomisé.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20407061/" target="_blank" rel="noopener">Siston et al., grippe pandémique et grossesse, 2010</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-oms-risque" data-title="Définitions du haut risque : OFSP, OMS et IDSA"><p class="lab">Fonction et cible</p><p>Ces définitions servent des décisions différentes : la vaccination pour l’OFSP, le traitement antiviral pour l’OMS et l’IDSA.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les lignes directrices de l’OMS du 12 septembre 2024 classent à haut risque de forme grave les personnes de 65 ans et plus ou porteuses d’au moins un facteur de risque majeur ; elles réservent la prophylaxie après exposition aux personnes à très haut risque. L’IDSA (2019) utilise une liste proche de celle de l’OFSP, en y ajoutant notamment les enfants de moins de cinq ans et les personnes d’origine autochtone américaine.</p><p class="lab">Conséquence clinique</p><p>En Suisse, le médecin repère le risque avec la liste de l’OFSP et fonde l’indication antivirale sur la recommandation la plus récente, celle de l’OMS de 2024, détaillée dans l’onglet Pharmacologie. Le texte de l’IDSA de 2019 reste accessible et concorde pour le patient hospitalisé.</p><div class="key"><b>Limite.</b> Les listes ne se superposent pas exactement, et l’OMS formule des recommandations conditionnelles, fondées sur des preuves de certitude variable.</div><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-debut" data-title="Début brutal"><p class="lab">Fonction et cible</p><p>Le patient passe en quelques heures d’un état normal à une maladie franche.</p><p class="lab">Mécanisme de l’affirmation</p><p>La réplication est rapide : la charge virale et les cytokines culminent dès le deuxième jour. Les signes généraux et respiratoires apparaissent donc ensemble, sans phase prodromique prolongée.</p><p class="lab">Conséquence clinique</p><p>Ce trait distingue la grippe du rhume, qui s’installe progressivement avec une rhinorrhée au premier plan. L’heure de début sert aussi à calculer le délai de 48 heures utile à la décision d’antiviral.</p><div class="key"><b>Limite.</b> Le début brutal n’est pas spécifique : une infection à SARS-CoV-2, une pneumonie à pneumocoque ou une méningite peuvent débuter ainsi. Chez la personne âgée, le début peut être insidieux.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a>.</p></template>
<template data-pop="j09-fievre" data-title="Fièvre de la grippe"><p class="lab">Mécanisme de l’affirmation</p><p>Les cytokines élèvent, par la PGE₂, le point de consigne thermique de l’hypothalamus ; les frissons produisent la chaleur nécessaire pour l’atteindre.</p><p class="lab">Conséquence clinique</p><p>Dans l’analyse de Monto, la fièvre était présente dans 68 % des grippes confirmées et 40 % des syndromes grippaux d’autre cause. Sa réapparition après une défervescence évoque une surinfection bactérienne.</p><div class="key"><b>Limite.</b> La fièvre manque souvent : chez les volontaires inoculés, elle n’apparaissait que dans 37 % des infections A(H1N1), 40,6 % des A(H3N2) et 7,5 % des infections B. Son absence n’exclut donc pas une grippe, surtout chez la personne âgée, l’immunodéprimé ou après un antipyrétique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-myalgies" data-title="Courbatures et fatigue"><p class="lab">Fonction et cible</p><p>Les courbatures touchent surtout le dos et les membres ; la fatigue oblige souvent à s’aliter.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les cytokines circulantes, IL-6 et interférons en particulier, agissent sur le muscle et sur le système nerveux central ; leur intensité suit le pic de réplication du deuxième jour. Le muscle lui-même est rarement infecté chez l’adulte.</p><p class="lab">Conséquence clinique</p><p>Des courbatures intenses orientent vers une grippe plutôt que vers un rhume. Une douleur musculaire très forte à la pression, des urines foncées ou une faiblesse font rechercher une myosite ou une rhabdomyolyse.</p><div class="key"><b>Limite.</b> La fatigue peut durer plus de deux semaines, surtout chez la personne âgée, sans traduire une complication ni justifier à elle seule des examens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-cephalees" data-title="Céphalées de la grippe"><p class="lab">Fonction et cible</p><p>Les céphalées accompagnent la fièvre et l’inflammation systémique, parfois avec une douleur à la mobilisation des yeux ; elles cèdent en général avec les antipyrétiques et la défervescence.</p><p class="lab">Conséquence clinique</p><p>Une céphalée fébrile banale ne demande pas d’examen. Une raideur de nuque, une confusion, une somnolence, des convulsions ou un déficit neurologique font rechercher en urgence une méningite bactérienne ou une encéphalite.</p><div class="key"><b>Limite.</b> La grippe n’exclut pas une autre infection : le CDC signale des infections invasives à méningocoque après une grippe.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-toux" data-title="Toux sèche, douleur rétrosternale et mal de gorge"><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium de la trachée et des bronches ; les terminaisons nerveuses mises à nu déclenchent la toux et la brûlure. La réparation de l’épithélium demande plusieurs semaines, d’où une toux souvent prolongée.</p><p class="lab">Conséquence clinique</p><p>Une toux prolongée sans fièvre ni dyspnée est attendue et ne justifie pas d’antibiotique. Une toux devenue productive avec fièvre et dyspnée fait rechercher une pneumonie.</p><div class="key"><b>Limite.</b> Sensible mais peu spécifique, la toux était présente dans 93 % des grippes confirmées et dans 80 % des syndromes grippaux d’autre cause.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-atypique-age" data-title="Grippe de la personne âgée fragile"><p class="lab">Mécanisme de l’affirmation</p><p>L’immunosénescence atténue la réponse cytokinique, donc la fièvre. Avec une réserve cérébrale et fonctionnelle réduite, toute infection se traduit par une confusion, une chute, un refus alimentaire ou une perte d’autonomie ; le CDC signale ces modifications de l’état mental, du comportement et de l’appétit chez les résidents âgés.</p><p class="lab">Conséquence clinique</p><p>En période épidémique, un changement brutal de l’état d’un résident fait tester la grippe, surtout si d’autres résidents ou soignants toussent. Une confirmation précoce permet l’antiviral et le contrôle de la flambée.</p><div class="key"><b>Limite.</b> Ces signes ne sont pas spécifiques : ils imposent aussi de rechercher une autre infection, une déshydratation ou un effet médicamenteux.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j09-decompensation" data-title="Grippe révélée par une décompensation chronique"><p class="lab">Mécanisme de l’affirmation</p><p>Chez l’asthmatique et le patient atteint de BPCO, le virus déclenche un bronchospasme ; chez le diabétique, le stress inflammatoire élève la glycémie. Le risque d’hospitalisation pour infarctus du myocarde était multiplié par 6,05 dans les sept jours suivant une grippe confirmée, sans excès au-delà.</p><p class="lab">Conséquence clinique</p><p>Devant une insuffisance cardiaque décompensée, une exacerbation de BPCO ou un déséquilibre diabétique en hiver, le médecin recherche une grippe. Chez l’hospitalisé, sa confirmation peut justifier un antiviral quel que soit le délai.</p><div class="key"><b>Limite.</b> L’étude de Kwong, série de cas autocontrôlée, montre une association temporelle forte, non une causalité démontrée par un essai.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus du myocarde après grippe confirmée, 2018</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j09-delai" data-title="Délai depuis le début des symptômes"><p class="lab">Mécanisme de l’affirmation</p><p>Les antiviraux freinent une réplication qui culmine aux premier et deuxième jours ; leur bénéfice sur la durée des symptômes a été démontré chez des patients traités dans les 48 heures. Chez l’hospitalisé ou le malade grave, la réplication persiste, et l’IDSA recommande l’antiviral quel que soit le délai.</p><p class="lab">Conséquence clinique</p><p>Chez le patient ambulatoire à risque, le médecin discute l’antiviral si le délai est court. Chez l’hospitalisé, il ne le retarde pas pour un délai dépassé.</p><div class="key"><b>Limite.</b> Le délai de 48 heures est un repère tiré des essais, non une limite biologique stricte ; les indications figurent dans la partie Prise en charge et l’onglet Pharmacologie.</div><p class="src">Références : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j09-contage" data-title="Contacts et activité grippale régionale"><p class="lab">Mécanisme de l’affirmation</p><p>La valeur prédictive positive d’un tableau clinique augmente avec la fréquence de la maladie : en 2023/2024, près de la moitié des frottis Sentinella étaient positifs au pic, contre très peu hors saison. Un contact familial malade dans les jours précédents renforce encore la probabilité.</p><p class="lab">Conséquence clinique</p><p>En pleine épidémie, le médecin peut retenir un diagnostic clinique de grippe chez un patient sans risque. Hors saison, il teste plus volontiers et recherche d’autres causes.</p><div class="key"><b>Limite.</b> Le SARS-CoV-2 et le VRS circulent en même temps, et des co-infections existent : le contexte oriente sans exclure.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a>.</p></template>
<template data-pop="j09-vaccin-statut" data-title="Statut vaccinal de la saison"><p class="lab">Mécanisme de l’affirmation</p><p>Le vaccin induit des anticorps contre l’hémagglutinine des souches choisies. La protection apparaît environ deux semaines après l’injection, dépend de la concordance avec les virus circulants et réduit le risque d’infection et de forme grave sans l’annuler.</p><p class="lab">Conséquence clinique</p><p>Un patient vacciné peut avoir une grippe, et la vaccination ne retire pas l’indication d’un antiviral chez un patient à risque. Le statut sert aussi à proposer la vaccination : en 2023/2024, seuls 9,1 % des patients consultant pour syndrome grippal ou infection respiratoire aiguë étaient vaccinés, et 15,2 % des 65 ans et plus.</p><div class="key"><b>Limite.</b> L’efficacité vaccinale varie selon la saison, l’âge et le sous-type.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-expo-animale" data-title="Exposition animale et suspicion de grippe zoonotique"><p class="lab">Fonction et cible</p><p>Une grippe zoonotique est due à un virus d’origine animale, par exemple A(H5N1) des oiseaux ou un virus d’origine porcine.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces virus se transmettent surtout par contact rapproché avec des animaux malades ou morts, leurs sécrétions ou un environnement contaminé. Le CDC retient une exposition dans les dix jours précédant les symptômes pour définir les cas à investiguer.</p><p class="lab">Conséquence clinique</p><p>Une fièvre ou une conjonctivite après un tel contact impose des précautions respiratoires, un prélèvement adressé au laboratoire de référence et une déclaration à l’autorité sanitaire. La partie Situations particulières détaille la conduite.</p><div class="key"><b>Limite.</b> Un test rapide de grippe A ne distingue pas un virus aviaire d’un virus saisonnier.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/influenza/h5n1-human-case-cumulative-table/2026_table_h5n1_march.pdf" target="_blank" rel="noopener">OMS, cas humains cumulés de grippe A(H5N1), état au 31.03.2026</a> ; <a href="https://archive.cdc.gov/www_cdc_gov/bird-flu/hcp/case-definition/index.html" target="_blank" rel="noopener">CDC, définitions de cas des infections humaines par virus aviaires, version archivée</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-aspirine" data-title="Acide acétylsalicylique et syndrome de Reye"><p class="lab">Fonction et cible</p><p>Le syndrome de Reye associe une encéphalopathie aiguë et une stéatose hépatique microvésiculaire. Il survient chez l’enfant et l’adolescent après une infection virale, surtout une grippe ou une varicelle.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des études épidémiologiques l’ont associé à la prise d’acide acétylsalicylique pendant l’infection ; un trouble de la fonction mitochondriale est en cause. Il est devenu rare depuis que ce médicament est évité chez l’enfant fébrile.</p><p class="lab">Conséquence clinique</p><p>Le médecin traite la fièvre de l’enfant grippé par le paracétamol ou l’ibuprofène et vérifie qu’un adulte de la famille ne lui donne pas ses propres médicaments.</p><div class="key"><b>Limite.</b> Chez l’enfant qui prend de l’acide acétylsalicylique au long cours pour une indication précise, la vaccination antigrippale est particulièrement recommandée ; la décision relève du spécialiste.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-biphasique" data-title="Évolution en deux temps"><p class="lab">Fonction et cible</p><p>Après une amélioration initiale, la fièvre réapparaît, la toux devient productive, une dyspnée ou une douleur thoracique s’installe.</p><p class="lab">Mécanisme de l’affirmation</p><p>La grippe simple s’améliore à partir du troisième au cinquième jour. Une nouvelle aggravation traduit alors le plus souvent une surinfection de l’épithélium lésé par le pneumocoque, le staphylocoque doré ou le streptocoque du groupe A.</p><p class="lab">Conséquence clinique</p><p>Ce récit impose un examen rapide, la recherche d’un foyer et d’une hypoxémie, une imagerie thoracique et la discussion d’un antibiotique. Le staphylocoque doré peut causer chez l’adulte jeune une pneumonie nécrosante rapidement grave.</p><div class="key"><b>Limite.</b> Une pneumonie virale progressive, une myocardite, une embolie pulmonaire ou une décompensation chronique peuvent aussi expliquer l’aggravation.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j09-v-fr" data-title="Fréquence respiratoire"><p class="lab">Fonction et cible</p><p>Elle mesure le travail ventilatoire. Le médecin la compte sur une minute entière, sans prévenir le patient, qui modifie sa respiration s’il se sait observé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une acidose métabolique ou une baisse de la compliance pulmonaire stimulent les centres respiratoires. L’hyperventilation compense d’abord le défaut d’oxygénation : la fréquence monte avant que la saturation ne baisse.</p><p class="lab">Conséquence clinique</p><p>Selon la Société suisse d’infectiologie, une fréquence d’au moins 22 par minute augmente la probabilité d’une pneumonie, et une fréquence de 30 par minute ou plus est un signal d’alarme qui compte dans le score CRB-65.</p><div class="key"><b>Limite.</b> La fièvre et l’anxiété l’élèvent aussi. Une fréquence normale sous oxygène n’exclut pas un épuisement débutant.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j09-v-spo" data-title="Saturation pulsée en oxygène"><p class="lab">Fonction et cible</p><p>L’oxymètre de pouls estime la saturation artérielle de l’hémoglobine en oxygène. La mesure se fait en air ambiant, avec un signal stable, sur un doigt bien perfusé et sans vernis.</p><p class="lab">Mécanisme de l’affirmation</p><p>Dans une pneumonie virale, le sang qui traverse des alvéoles perfusées mais non ventilées reste désaturé et abaisse la saturation du mélange artériel.</p><p class="lab">Conséquence clinique</p><p>Selon la Société suisse d’infectiologie, une saturation inférieure à 92 % est un signal d’alarme de l’infection respiratoire aiguë, et une saturation inférieure à 90 % fait envisager l’hospitalisation quel que soit le score. Chez le patient atteint de BPCO, la valeur se compare à sa saturation habituelle.</p><div class="key"><b>Limite.</b> Une mauvaise perfusion périphérique fausse la mesure, et une intoxication au monoxyde de carbone la surestime. Sous oxygène, une saturation correcte peut masquer une aggravation, que révèlent la fréquence respiratoire et la gazométrie.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j09-v-pa" data-title="Pression artérielle et perfusion"><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre, la transpiration et des apports réduits diminuent le volume circulant ; un sepsis provoque une vasodilatation ; une myocardite réduit le débit cardiaque. Le médecin recherche aussi des marbrures, un temps de recoloration prolongé et une baisse de la diurèse.</p><p class="lab">Conséquence clinique</p><p>Une systolique inférieure à 90 mmHg est un signal d’alarme selon la Société suisse d’infectiologie ; une systolique inférieure à 90 mmHg ou une diastolique d’au plus 60 mmHg donne un point du CRB-65. Une hypotension orthostatique chez un patient qui boit peu traduit une déshydratation.</p><div class="key"><b>Limite.</b> Chez l’hypertendu, une pression encore normale peut cacher un choc débutant : le médecin la compare à la valeur habituelle et répète la mesure.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j09-v-fc" data-title="Fréquence cardiaque"><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre accélère le métabolisme et la fréquence cardiaque ; la déshydratation et l’hypoxémie l’accélèrent davantage. Une myocardite grippale provoque une tachycardie disproportionnée à la fièvre, des troubles du rythme ou une insuffisance cardiaque.</p><p class="lab">Conséquence clinique</p><p>Une tachycardie qui persiste après la défervescence, une douleur thoracique, une dyspnée ou un pouls irrégulier font demander un électrocardiogramme et un dosage de troponine.</p><div class="key"><b>Limite.</b> Un bêtabloquant masque la tachycardie : une fréquence normale n’exclut alors ni une myocardite ni un sepsis.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus du myocarde après grippe confirmée, 2018</a>.</p></template>
<template data-pop="j09-conscience" data-title="État de conscience et confusion"><p class="lab">Fonction et cible</p><p>La confusion est une altération aiguë de l’attention et de la conscience, recherchée par l’orientation, l’attention et la cohérence du discours.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une hypotension, une fièvre élevée, une déshydratation ou une hyponatrémie perturbent le fonctionnement cérébral, surtout chez la personne âgée. Plus rarement, la grippe provoque une encéphalite ou une encéphalopathie.</p><p class="lab">Conséquence clinique</p><p>Une confusion nouvelle compte dans le score CRB-65. Elle fait rechercher une hypoxémie, un trouble métabolique, un sepsis et, en présence d’une raideur de nuque ou de convulsions, une infection du système nerveux central.</p><div class="key"><b>Limite.</b> Chez un patient dément, le médecin compare à l’état habituel décrit par l’entourage ou les soignants.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-ausc" data-title="Auscultation pulmonaire dans la grippe"><p class="lab">Mécanisme de l’affirmation</p><p>Dans la grippe simple, l’atteinte trachéobronchique produit au plus des ronchi diffus, modifiés par la toux. Un exsudat alvéolaire produit des crépitants ; une condensation transmet mieux les vibrations vocales et peut produire un souffle.</p><p class="lab">Conséquence clinique</p><p>Des crépitants localisés ou bilatéraux orientent vers une pneumonie, virale ou bactérienne, et justifient une imagerie. Des sibilants diffus chez un asthmatique traduisent un bronchospasme induit par le virus.</p><div class="key"><b>Limite.</b> Une auscultation normale n’exclut pas une pneumonie virale débutante, en particulier chez un patient hypoxémique : la saturation et la fréquence respiratoire restent indispensables.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j09-deshydratation" data-title="Déshydratation au cours de la grippe"><p class="lab">Fonction et cible</p><p>La déshydratation est fréquente chez la personne âgée et le jeune enfant grippés.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre et la tachypnée augmentent les pertes insensibles ; l’anorexie, les nausées et la fatigue réduisent les apports, et la personne âgée ressent moins la soif. La baisse du volume circulant provoque une tachycardie, une hypotension orthostatique et une baisse de la diurèse.</p><p class="lab">Conséquence clinique</p><p>Une incapacité à boire motive l’hospitalisation d’un patient fragile. Le CDC compte la déshydratation parmi les complications de la grippe à tout âge.</p><div class="key"><b>Limite.</b> Les signes cutanés sont peu fiables chez la personne âgée ; à l’hôpital, la créatinine recherche une insuffisance rénale fonctionnelle.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-alarme" data-title="Signes de gravité d’une grippe"><p class="lab">Fonction et cible</p><p>Un signe de gravité signale une complication en cours ou une réserve insuffisante ; il change le lieu de soins et l’urgence du traitement.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une dyspnée, une fréquence respiratoire de 30 par minute ou plus et une saturation inférieure à 92 % traduisent une atteinte alvéolaire. Une systolique inférieure à 90 mmHg, des marbrures, une baisse de la diurèse ou une douleur thoracique traduisent un sepsis, une déshydratation ou une atteinte cardiaque. Une confusion, des convulsions ou un déficit traduisent une hypoxémie, un trouble métabolique ou une atteinte neurologique, et l’évolution en deux temps une surinfection.</p><p class="lab">Conséquence clinique</p><p>Un seul signe justifie une évaluation hospitalière, des examens et un antiviral sans attendre, quel que soit le délai depuis le début des symptômes. Chez le patient à risque, le seuil d’hospitalisation est plus bas.</p><div class="key"><b>Limite.</b> Ces signes ne sont pas propres à la grippe, et leur absence n’exclut pas une aggravation ultérieure : le médecin donne au patient des consignes de reconsultation.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="pareto-j09-bases" data-title="Pareto — Virus, mécanismes et clinique de la grippe"><p class="ratio" data-cover="j09-0,j09-1,j09-2,j09-3,j09-4,j09-5,j09-6"></p><ul><li>La grippe est due aux virus influenza A ou B. La dérive antigénique explique les épidémies annuelles et la révision du vaccin ; la cassure par réassortiment peut provoquer une pandémie.</li><li>Le code est J09 pour un virus zoonotique ou pandémique, J10 pour un virus saisonnier confirmé, J11 sans identification. <i>Haemophilus influenzae</i> est une bactérie, sans rapport avec ces codes.</li><li>En Suisse, l’épidémie culmine le plus souvent entre fin décembre et février. Les enfants s’infectent le plus ; les personnes âgées concentrent les hospitalisations et les décès.</li><li>L’hémagglutinine fixe le virus à l’acide sialique et la neuraminidase libère les virions. Le baloxavir bloque le vol de coiffe de la polymérase ; l’oseltamivir bloque la neuraminidase.</li><li>Les cytokines produisent la fièvre et les courbatures. L’atteinte alvéolaire donne une pneumonie virale hypoxémiante, et l’épithélium lésé favorise la surinfection à pneumocoque et à staphylocoque doré.</li><li>L’incubation dure un à quatre jours. La contagiosité commence la veille des symptômes et culmine pendant les trois premiers jours.</li><li>Sont à risque les personnes de 65 ans et plus, les femmes enceintes ou récemment accouchées, les malades chroniques, les immunodéprimés et les résidents d’établissements de soins.</li><li>Le récit typique associe un début brutal, une fièvre élevée, des courbatures et une toux sèche. Le médecin date le début, établit le terrain et recherche une exposition animale ; chez la personne âgée, la fièvre peut manquer.</li><li>Une fréquence respiratoire de 30 par minute ou plus, une saturation inférieure à 92 %, une systolique inférieure à 90 mmHg, une confusion ou une aggravation en deux temps imposent une évaluation hospitalière.</li></ul></template>
