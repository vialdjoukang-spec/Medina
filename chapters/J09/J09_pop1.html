UJHAUJiULNKnrjNagICADs=" width="340" height="295" loading="lazy" decoding="async" style="max-width:100%;height:auto" alt="Radiographie thoracique d’une grippe compliquée d’une surinfection à Haemophilus influenzae"><figcaption>Cette radiographie appartient à un homme de 88 ans, examiné environ une semaine après le début d’une fièvre, d’une fatigue et d’une toux légère ; les examens ont détecté à la fois un virus de la grippe A et Haemophilus influenzae. La flèche désigne une opacité du lobe supérieur droit. Le virus détruit l’épithélium cilié et altère les défenses locales, si bien que des bactéries colonisent les voies aériennes et provoquent une pneumonie secondaire. C’est pourquoi une aggravation après une amélioration initiale, ou une fièvre qui persiste au-delà de quelques jours, doit faire rechercher une surinfection bactérienne et discuter un antibiotique. Source : <a href="https://commons.wikimedia.org/wiki/File:Chest_radiograph_in_influensa_and_H_influenzae,_posteroanterior,_annotated.jpg" target="_blank" rel="noopener" data-reference-source="1">Mikael Häggström, M.D. Author info - Reusing images- Conflicts of interest: None Mikael Häggström, M.D.Consent note: Wri, Wikimedia Commons</a> ; <a href="http://creativecommons.org/publicdomain/zero/1.0/deed.en" target="_blank" rel="noopener" data-reference-source="1">licence CC0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Fonction et cible</p><p>La surinfection bactérienne est une pneumonie due à une bactérie qui profite des lésions provoquées par le virus. Elle est la principale cause de décès des grandes pandémies anciennes.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium cilié et expose la membrane basale, à laquelle les bactéries adhèrent. La neuraminidase coupe l’acide sialique et dévoile des récepteurs bactériens. Les interférons et la mort des macrophages alvéolaires réduisent la capacité à éliminer les bactéries. L’ECDC et l’Institut Robert Koch citent le pneumocoque, le staphylocoque doré et <i>Haemophilus influenzae</i> parmi les germes de surinfection. L’examen de 58 autopsies de 1918 et de 109 séries publiées montre que la majorité des décès de cette pandémie résultaient d’une pneumonie bactérienne secondaire.</p><p class="lab">Conséquence clinique</p><p>Une surinfection se manifeste typiquement par une aggravation après une amélioration initiale ; dans les formes sévères, l’Institut Robert Koch situe souvent l’aggravation entre le troisième et le dixième jour. Un antibiotique ciblé en cas de surinfection documentée ou probable découle de ce mécanisme.</p><div class="key"><b>Limite.</b> La plupart des grippes ne se surinfectent pas. La Société suisse d’infectiologie ne recommande pas d’antibiotique chez le patient grippé dont la suspicion de surinfection est faible, en raison des résistances et des effets indésirables.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., causes de décès de la pandémie de 1918, 2008</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></template>
<template data-pop="j09-voies" data-title="Gouttelettes, aérosols et contact"><p class="lab">Fonction et cible</p><p>Les particules respiratoires émises par un patient ont des tailles variées. Les plus grosses retombent à courte distance ; les plus fines restent en suspension plus longtemps dans un local mal ventilé.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’ECDC indique que le virus se transmet surtout par gouttelettes et par contact, directement ou par les sécrétions respiratoires déposées sur les mains et les objets. Une personne située à moins d’un mètre d’un malade qui tousse ou éternue sans se couvrir peut être infectée. Des aérosols infectieux pourraient aussi contribuer à la transmission ; leur part exacte reste discutée.</p><p class="lab">Conséquence clinique</p><p>Les mesures découlent des voies : hygiène des mains, toux dans le coude, distance, aération et masque. En milieu de soins, l’Institut Robert Koch prévoit une chambre individuelle pendant 7 jours à partir du début des symptômes et le port d’une blouse, de gants et d’un masque médical à l’entrée de la chambre.</p><div class="key"><b>Limite.</b> Aucune mesure isolée ne suffit. L’OFSP rappelle que le virus se transmet aussi avant que la personne ne se sente malade, ce qui limite l’efficacité de l’isolement des seuls malades.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-incubation" data-title="Incubation et cinétique de l’excrétion virale"><p class="lab">Fonction et cible</p><p>L’incubation est le délai entre l’infection et les premiers symptômes. La période contagieuse correspond à la durée d’excrétion d’un virus capable d’infecter.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’ECDC indique une incubation moyenne de deux jours, de un à quatre jours ; l’OFSP retient un à trois jours. Le virus est retrouvé dans le nez et la gorge d’un jour avant à cinq à sept jours après le début des symptômes, avec une excrétion plus faible avant les symptômes. Dans les études d’inoculation volontaire, l’excrétion augmentait nettement entre 12 et 24 heures après l’infection, culminait le deuxième jour et durait en moyenne 4,8 jours.</p><p class="lab">Conséquence clinique</p><p>Le malade limite ses contacts pendant les premiers jours, surtout avec des personnes à risque ; un soignant malade ne s’occupe pas de patients pendant cette période. Un contact qui tombe malade dans les quatre jours suivant l’exposition a probablement été infecté par ce cas.</p><div class="key"><b>Limite.</b> L’excrétion est plus longue chez le jeune enfant, la personne âgée et l’immunodéprimé. Ces données de volontaires jeunes ne s’appliquent pas directement à la personne âgée.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a>.</p></template>
<template data-pop="j09-asympto" data-title="Infections asymptomatiques et peu symptomatiques"><p class="lab">Fonction et cible</p><p>Une infection asymptomatique est une infection confirmée sans symptôme ; une infection peu symptomatique ne provoque qu’un seul symptôme. Ces formes contribuent à la diffusion du virus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Dans les études d’inoculation, 66,9 % des infections étaient symptomatiques. Dans une étude de contacts familiaux à Hong Kong portant sur 235 infections secondaires, 11 % étaient asymptomatiques et 13 % peu symptomatiques. Ces patients excrétaient de l’ARN viral moins longtemps et en quantité inférieure de 1 à 2 logarithmes décimaux.</p><p class="lab">Conséquence clinique</p><p>Une personne qui se sent à peine malade peut infecter un patient fragile. La vaccination du personnel, le masque en période épidémique et l’hygiène des mains protègent mieux qu’un dépistage fondé sur les seuls symptômes.</p><div class="key"><b>Limite.</b> L’ARN détecté ne prouve pas la présence de virus infectieux ; la contribution exacte de ces formes à la transmission reste incertaine.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28011603/" target="_blank" rel="noopener">Ip et al., excrétion virale des infections peu symptomatiques, 2017</a>.</p></template>
<template data-pop="j09-risque" data-title="Personnes à risque accru de complications selon l’OFSP"><p class="lab">Fonction et cible</p><p>L’OFSP définit les personnes à risque accru de complications de la grippe. Cette liste fixe les cibles prioritaires de la vaccination, prise en charge par l’assurance obligatoire des soins sous réserve de la franchise.</p><p class="lab">Mécanisme de l’affirmation</p><p>La liste comprend les femmes enceintes ou ayant accouché au cours des quatre dernières semaines, et les enfants prématurés, nés avant 32 semaines ou pesant moins de 1500 g, pendant leurs deux premiers hivers dès l’âge de six mois. Elle comprend aussi, dès six mois, les personnes atteintes de maladie cardiaque, pulmonaire, métabolique affectant le cœur, le poumon ou le rein, comme le diabète ou l’obésité morbide, d’une maladie neurologique ou musculosquelettique, hépatique, d’une insuffisance rénale, d’une asplénie, d’une hémoglobinopathie ou d’une immunodéficience. Les résidents des maisons de soins et des établissements pour malades chroniques y figurent également. Les personnes de 65 ans et plus, exposées elles aussi à un risque accru de forme grave, relèvent d’une vaccination complémentaire du Plan de vaccination suisse 2026.</p><p class="lab">Conséquence clinique</p><p>Chaque catégorie correspond à un mécanisme d’aggravation, décrit dans le tableau du cours. Pour l’antiviral, la Société suisse d’infectiologie emploie une liste voisine, centrée sur l’âge de 65 ans et plus, l’immunodépression et les maladies cardiovasculaires, neurologiques et respiratoires chroniques. Dès 75 ans, ou dès 65 ans avec un facteur de risque supplémentaire, l’OFSP privilégie un vaccin à dose élevée.</p><div class="key"><b>Limite.</b> La liste est conçue pour la vaccination ; elle ne remplace pas l’évaluation clinique. Un patient sans facteur de risque peut faire une forme grave.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026, chapitres 2 et 3</a>.</p></template>
<template data-pop="j09-grossesse-risque" data-title="Pourquoi la grossesse aggrave la grippe"><p class="lab">Fonction et cible</p><p>La grossesse modifie la respiration, la circulation et l’immunité. Ces adaptations normales réduisent la tolérance à une pneumonie.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’utérus refoule le diaphragme et diminue la capacité résiduelle fonctionnelle, réserve d’oxygène des poumons. La consommation d’oxygène et le débit cardiaque augmentent. L’immunité s’adapte pour tolérer le fœtus. Une hypoxémie maternelle réduit en outre l’oxygénation fœtale. Pendant la pandémie de 2009, aux États-Unis, 30 femmes enceintes sur 788 cas rapportés d’avril à août sont décédées, soit 5 % de tous les décès dus au virus pandémique rapportés sur cette période ; les auteurs concluent à un risque de mortalité disproportionnellement élevé. Parmi les 56 décès de femmes enceintes admises aux soins intensifs jusqu’à fin 2009, 64,3 % survenaient au troisième trimestre.</p><p class="lab">Conséquence clinique</p><p>L’OFSP recommande la vaccination à toute femme enceinte et pendant les quatre semaines suivant l’accouchement. Dans la même série, le traitement plus de quatre jours après le début des symptômes s’associait à davantage d’admissions aux soins intensifs que le traitement dans les deux jours.</p><div class="key"><b>Limite.</b> Les données de 2009 portent sur un virus pandémique et sur une surveillance américaine ; elles décrivent une association et non un essai randomisé.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20407061/" target="_blank" rel="noopener">Siston et al., grippe pandémique et grossesse, 2010</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-oms-risque" data-title="Définitions du haut risque : OFSP, Société suisse d’infectiologie et OMS"><p class="lab">Fonction et cible</p><p>Plusieurs définitions du risque de forme grave coexistent. Elles servent des décisions différentes : la vaccination pour l’OFSP, le traitement antiviral pour la Société suisse d’infectiologie et pour l’OMS.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’OMS 2024 classe à haut risque d’hospitalisation les personnes de 65 ans et plus et celles qui portent au moins un facteur de risque majeur : immunodépression, maladie cardiovasculaire, maladie neurologique ou maladie respiratoire chronique. Le cancer, la grossesse et le diabète sont des facteurs additionnels de moindre poids. Le très haut risque désigne les personnes de 85 ans et plus et celles qui cumulent plusieurs facteurs majeurs. La Société suisse d’infectiologie reprend la même liste de haut risque ; elle réserve le baloxavir thérapeutique au très haut risque, défini par un âge de 85 ans et plus ou une immunodépression, et la prophylaxie aux personnes de 85 ans et plus ou porteuses de plusieurs facteurs de risque.</p><p class="lab">Conséquence clinique</p><p>En Suisse, le médecin repère les patients à vacciner avec la liste de l’OFSP, puis applique pour l’antiviral les seuils de la Société suisse d’infectiologie. Un homme de 70 ans coronarien est à haut risque ; une femme de 87 ans ou un patient transplanté est à très haut risque.</p><div class="key"><b>Limite.</b> Les listes ne sont pas strictement superposables : l’OFSP inclut la grossesse et l’obésité morbide parmi ses groupes cibles de vaccination, alors que l’OMS les traite comme facteurs additionnels. Le jugement clinique tranche les cas limites.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-debut" data-title="Début brutal"><p class="lab">Fonction et cible</p><p>Le début brutal est le passage, en quelques heures, d’un état normal à un état de maladie franche. Le patient peut souvent indiquer l’heure à laquelle il a commencé à frissonner.</p><p class="lab">Mécanisme de l’affirmation</p><p>La réplication virale est très rapide : la charge virale et les cytokines culminent dès le deuxième jour. Les signes généraux apparaissent donc presque en même temps que les signes respiratoires, sans phase prodromique prolongée.</p><p class="lab">Conséquence clinique</p><p>Ce trait distingue la grippe du rhume, qui s’installe progressivement avec une rhinorrhée au premier plan. L’heure de début permet aussi de calculer le délai de 48 heures utile à la décision d’antiviral.</p><div class="key"><b>Limite.</b> Un début brutal n’est pas spécifique : une infection à SARS-CoV-2, une pneumonie à pneumocoque ou une méningite peuvent débuter de la même façon. Chez la personne âgée, le début peut être insidieux.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a>.</p></template>
<template data-pop="j09-fievre" data-title="Fièvre de la grippe"><p class="lab">Fonction et cible</p><p>La fièvre est une élévation du point de consigne thermique de l’hypothalamus. Dans la grippe, elle atteint souvent 38 à 40 °C dès le premier jour.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les cytokines et la PGE₂ élèvent le point de consigne ; les frissons produisent de la chaleur jusqu’à l’atteindre. Chez des adultes et adolescents présentant un syndrome grippal, la fièvre était présente chez 68 % des grippes confirmées et 40 % des autres causes. Dans les études d’inoculation, elle manquait souvent : elle n’apparaissait que dans 37 % des infections A(H1N1), 40,6 % des A(H3N2) et 7,5 % des infections B.</p><p class="lab">Conséquence clinique</p><p>Les signes généraux durent habituellement quelques jours selon l’ECDC. La réapparition de la fièvre après une défervescence évoque une surinfection bactérienne. Une fièvre et une toux de moins de 48 heures, en période épidémique, ont une valeur prédictive positive de 79 % pour une grippe.</p><div class="key"><b>Limite.</b> L’absence de fièvre n’exclut pas une grippe, en particulier chez la personne âgée ou immunodéprimée, ou après la prise d’un antipyrétique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-myalgies" data-title="Courbatures et fatigue"><p class="lab">Fonction et cible</p><p>Les courbatures sont des douleurs musculaires diffuses, surtout du dos et des membres. La fatigue de la grippe oblige souvent à s’aliter.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces symptômes proviennent surtout des cytokines circulantes, IL-6 et interférons en particulier, qui agissent sur le muscle et sur le système nerveux central. Leur intensité suit le pic de réplication du deuxième jour. Le muscle lui-même est rarement infecté chez l’adulte.</p><p class="lab">Conséquence clinique</p><p>Des courbatures intenses orientent vers une grippe plutôt que vers un rhume. Une douleur musculaire très forte à la pression, des urines foncées ou une faiblesse font rechercher une myosite ou une rhabdomyolyse, décrites parmi les complications.</p><div class="key"><b>Limite.</b> La fatigue peut persister plus de deux semaines, surtout chez la personne âgée, sans signifier une complication. Elle ne justifie pas à elle seule des examens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-cephalees" data-title="Céphalées de la grippe"><p class="lab">Fonction et cible</p><p>Les céphalées font partie des symptômes typiques de la grippe selon l’OFSP et l’ECDC. Elles accompagnent la fièvre dès le début de la maladie.</p><p class="lab">Mécanisme de l’affirmation</p><p>Elles accompagnent la fièvre et l’inflammation systémique ; elles s’atténuent en général avec les antipyrétiques et la défervescence.</p><p class="lab">Conséquence clinique</p><p>Une céphalée fébrile banale ne demande pas d’examen. Une raideur de nuque, une confusion, une somnolence, des convulsions ou un déficit neurologique doivent faire rechercher une méningite bactérienne ou une encéphalite, complication de la grippe citée par l’ECDC et l’Institut Robert Koch.</p><div class="key"><b>Limite.</b> La grippe n’exclut pas une autre infection fébrile : une céphalée inhabituelle impose de réexaminer le patient plutôt que d’attribuer tout symptôme au virus.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-toux" data-title="Toux sèche, douleur rétrosternale et mal de gorge"><p class="lab">Fonction et cible</p><p>La toux de la grippe est d’abord sèche et quinteuse. Elle s’accompagne souvent d’une brûlure rétrosternale et d’un mal de gorge.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium de la trachée et des bronches ; les terminaisons nerveuses mises à nu déclenchent la toux et la sensation de brûlure. La toux était présente chez 93 % des grippes confirmées dans l’analyse de Monto. La réparation de l’épithélium demande du temps : selon l’ECDC, la toux, la fatigue et le malaise peuvent persister plusieurs semaines.</p><p class="lab">Conséquence clinique</p><p>Une toux prolongée sans fièvre ni dyspnée après une grippe est attendue et ne justifie pas d’antibiotique. Une toux devenue productive avec fièvre et dyspnée fait rechercher une pneumonie.</p><div class="key"><b>Limite.</b> La toux est présente dans 80 % des syndromes grippaux non dus à la grippe ; elle est sensible mais peu spécifique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-atypique-age" data-title="Grippe de la personne âgée fragile"><p class="lab">Fonction et cible</p><p>Chez la personne âgée fragile, en particulier en établissement de soins, la grippe se présente souvent sans le tableau classique.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’immunosénescence et une réponse cytokinique moins vive réduisent la fièvre ; l’OFSP rappelle que la personne âgée peut ne pas avoir de fièvre. La réserve cérébrale et fonctionnelle diminuée fait que toute infection peut se traduire par une confusion, une chute, un refus alimentaire ou une perte d’autonomie. L’Institut Robert Koch demande de penser à la grippe pendant la vague chez la personne âgée ou immunodéprimée, même devant des symptômes non fébriles et peu spécifiques.</p><p class="lab">Conséquence clinique</p><p>En période épidémique, un changement brutal de l’état d’un résident doit faire tester la grippe, surtout si d’autres résidents ou soignants toussent. Une confirmation précoce permet les mesures de contrôle d’une flambée et la discussion de l’antiviral.</p><div class="key"><b>Limite.</b> Ces signes ne sont pas spécifiques ; ils imposent aussi de rechercher une autre infection, une déshydratation ou un effet médicamenteux.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-decompensation" data-title="Grippe révélée par une décompensation chronique"><p class="lab">Fonction et cible</p><p>Chez un patient porteur d’une maladie chronique, la grippe peut se révéler d’abord par l’aggravation de cette maladie.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre et la tachycardie augmentent la demande en oxygène du cœur ; l’inflammation favorise la thrombose coronaire. Le risque d’hospitalisation pour infarctus du myocarde était multiplié par 6,05 dans les sept jours suivant une grippe confirmée, sans excès après le septième jour. L’ECDC rappelle que les maladies sous-jacentes, cardiovasculaires notamment, peuvent être aggravées par la grippe, et l’Institut Robert Koch cite les exacerbations des maladies pulmonaires chroniques.</p><p class="lab">Conséquence clinique</p><p>Devant une insuffisance cardiaque décompensée, une exacerbation de BPCO ou un déséquilibre diabétique en hiver, le médecin recherche une grippe. Chez le patient hospitalisé, sa confirmation justifie l’oseltamivir selon la Société suisse d’infectiologie.</p><div class="key"><b>Limite.</b> L’étude de Kwong est une série de cas autocontrôlée, donc observationnelle ; elle montre une association temporelle forte, non une preuve de causalité au sens d’un essai.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus du myocarde après grippe confirmée, N Engl J Med 2018</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></template>
<template data-pop="j09-delai" data-title="Délai depuis le début des symptômes"><p class="lab">Fonction et cible</p><p>Le délai entre le début des symptômes et la consultation détermine le bénéfice attendu d’un antiviral.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les antiviraux freinent la réplication virale, qui culmine aux premier et deuxième jours. Selon l’ECDC, ils doivent être pris dans les 48 premières heures, et leur efficacité diminue avec le temps écoulé ; l’information suisse de Tamiflu demande de commencer le jour de l’apparition des symptômes ou le lendemain, idéalement dans les 36 premières heures. L’ECDC relève toutefois un bénéfice possible au-delà de 48 heures dans la grippe sévère, chez l’hospitalisé ou chez la personne à haut risque.</p><p class="lab">Conséquence clinique</p><p>Le médecin note le jour et l’heure du début. Chez le patient ambulatoire à très haut risque, le baloxavir n’a de sens que dans les 48 heures ; chez le patient hospitalisé, la Société suisse d’infectiologie prescrit l’oseltamivir dans les 48 heures et le maintient au-delà chez le patient en état critique.</p><div class="key"><b>Limite.</b> Le délai de 48 heures est un repère tiré des essais, non une limite biologique stricte. Les indications précises figurent dans la partie Prise en charge et l’onglet Pharmacologie.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/prevention-and-control/antivirals" target="_blank" rel="noopener">ECDC, Antiviral treatment of influenza, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></template>
<template data-pop="j09-contage" data-title="Contacts et activité grippale régionale"><p class="lab">Fonction et cible</p><p>La probabilité avant test d’une grippe dépend surtout de la circulation du virus dans la population et dans l’entourage du patient.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un même syndrome grippal n’a pas la même signification en janvier et en juillet. La valeur prédictive positive d’un tableau clinique augmente avec la fréquence de la maladie. En 2023/2024, près de la moitié des frottis Sentinella étaient positifs au pic, contre très peu hors saison. Un contact familial malade dans les jours précédents renforce encore la probabilité.</p><p class="lab">Conséquence clinique</p><p>Le médecin consulte le bulletin hebdomadaire de l’OFSP et demande si l’entourage est malade. En pleine épidémie, il peut retenir un diagnostic clinique de grippe chez un patient sans risque ; hors saison, il teste plus volontiers et recherche d’autres causes.</p><div class="key"><b>Limite.</b> D’autres virus circulent en même temps, notamment le SARS-CoV-2 et le VRS ; des co-infections existent. Le contexte oriente sans exclure.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a>.</p></template>
<template data-pop="j09-vaccin-statut" data-title="Statut vaccinal de la saison"><p class="lab">Fonction et cible</p><p>Le statut vaccinal indique si le patient a reçu le vaccin de la saison en cours, et à quelle date.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le vaccin induit des anticorps contre l’hémagglutinine des souches choisies. La protection apparaît environ deux semaines après l’injection et dépend de la concordance avec les virus circulants. Elle réduit le risque d’infection et de forme grave, sans l’annuler. En 2023/2024, 9,1 % des patients consultant pour syndrome grippal ou infection respiratoire aiguë étaient vaccinés contre la grippe, et 15,2 % des 65 ans et plus.</p><p class="lab">Conséquence clinique</p><p>Un patient vacciné peut avoir une grippe : la vaccination ne permet pas d’exclure le diagnostic. Elle n’enlève pas non plus l’indication d’un antiviral chez un patient à risque.</p><div class="key"><b>Limite.</b> L’efficacité vaccinale varie selon la saison, l’âge et le sous-type. Le statut sert aussi à proposer la vaccination aux proches et au patient pour les saisons suivantes.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-expo-animale" data-title="Exposition animale et suspicion de grippe zoonotique"><p class="lab">Fonction et cible</p><p>Une grippe zoonotique est une infection humaine par un virus d’origine animale, par exemple A(H5N1) des oiseaux ou un virus d’origine porcine.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces virus se transmettent surtout par contact rapproché avec des animaux malades ou morts, leurs sécrétions ou un environnement contaminé. Selon l’OFSP, les premiers symptômes apparaissent généralement de 2 à 14 jours après le contact avec un animal infecté ; des cas bénins avec conjonctivite ont été décrits chez des personnes exposées professionnellement à des vaches laitières infectées. Du 1<sup>er</sup> janvier 2003 au 6 septembre 2026, l’OMS a recensé 1003 infections humaines confirmées par A(H5N1) dans 25 pays, dont 479 mortelles.</p><p class="lab">Conséquence clinique</p><p>Une fièvre ou une conjonctivite après un contact avec des volailles, des oiseaux sauvages ou d’autres animaux infectés impose des précautions respiratoires, un prélèvement adressé au laboratoire de référence et une déclaration téléphonique dans les deux heures. La conduite détaillée figure dans la partie Situations particulières.</p><div class="key"><b>Limite.</b> Le rapport élevé de décès reflète en partie un biais de détection : les formes bénignes sont moins souvent testées. Un test rapide de grippe A ne distingue pas un virus aviaire d’un virus saisonnier.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-aviaire-h5n1-situation-en-suisse" target="_blank" rel="noopener">OFSP, grippe aviaire H5N1, situation en Suisse, consultée le 08.10.2026</a> ; <a href="https://cdn.who.int/media/docs/default-source/wpro---documents/emergency/surveillance/avian-influenza/ai_20260918.pdf" target="_blank" rel="noopener">OMS, bureau régional du Pacifique occidental, Avian Influenza Weekly Update du 18.09.2026 (cas humains mondiaux de A(H5N1) au 06.09.2026)</a>.</p></template>
<template data-pop="j09-aspirine" data-title="Acide acétylsalicylique et syndrome de Reye"><p class="lab">Fonction et cible</p><p>Le syndrome de Reye associe une encéphalopathie aiguë et une dégénérescence graisseuse du foie. Il survient chez l’enfant et l’adolescent après une infection virale, en particulier une grippe ou une varicelle.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’Institut Robert Koch rappelle que les salicylés sont contre-indiqués chez l’enfant grippé, car ils peuvent provoquer ce syndrome. L’information suisse d’Aspirine 500 ne l’autorise chez l’adolescent dès 12 ans fébrile ou atteint d’une infection virale que sur prescription et en deuxième intention, et en décrit les signes : vomissements importants, troubles de la conscience et atteinte hépatique.</p><p class="lab">Conséquence clinique</p><p>Chez l’enfant et l’adolescent grippés, le médecin traite la fièvre par le paracétamol, jamais par l’acide acétylsalicylique. Il le demande aussi lorsqu’un adulte de la famille donne ses propres médicaments.</p><div class="key"><b>Limite.</b> Chez l’adulte, la grippe ne contre-indique pas l’acide acétylsalicylique ; celui-ci n’a cependant aucun avantage sur le paracétamol contre la fièvre.</div><p class="src">Références : <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://compendium.ch/fr/product/110558-aspirine-cpr-eff-500-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse Aspirine® 500, Swissmedic (AIPS), consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-biphasique" data-title="Évolution en deux temps"><p class="lab">Fonction et cible</p><p>Une évolution en deux temps est une aggravation après une amélioration initiale : la fièvre réapparaît, la toux devient productive, une dyspnée ou une douleur thoracique s’installe.</p><p class="lab">Mécanisme de l’affirmation</p><p>La grippe non compliquée dure en général cinq à sept jours selon l’Institut Robert Koch, qui situe souvent l’aggravation des formes sévères entre le troisième et le dixième jour. Une nouvelle aggravation traduit le plus souvent une surinfection bactérienne de l’épithélium lésé, notamment par le pneumocoque ou le staphylocoque doré.</p><p class="lab">Conséquence clinique</p><p>Ce récit impose un examen rapide, la recherche d’un foyer et d’une hypoxémie, une imagerie thoracique et la discussion d’un antibiotique. Devant une surinfection à staphylocoque doré, la Société suisse d’infectiologie ajoute la clindamycine ou le linézolide jusqu’à l’exclusion d’une toxine de Panton-Valentine.</p><div class="key"><b>Limite.</b> Une aggravation peut aussi traduire une pneumonie virale progressive, une myocardite, une embolie pulmonaire ou la décompensation d’une maladie chronique. Le récit oriente sans trancher.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j09-v-fr" data-title="Fréquence respiratoire"><p class="lab">Fonction et cible</p><p>La fréquence respiratoire mesure le travail ventilatoire. Chez l’adulte au repos, elle se situe entre 12 et 20 par minute.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une acidose métabolique ou une diminution de la compliance pulmonaire stimulent les centres respiratoires. La fréquence s’élève alors avant que la saturation ne baisse, car l’hyperventilation compense d’abord le défaut d’oxygénation. Le médecin la compte pendant une minute entière, sans prévenir le patient, car celui-ci modifie sa respiration lorsqu’il se sait observé.</p><p class="lab">Conséquence clinique</p><p>Selon la Société suisse d’infectiologie, une fréquence d’au moins 22 par minute chez un patient qui tousse fait partie des critères qui imposent le dosage de la CRP, car la probabilité de bénéficier d’un antibiotique devient moyenne à élevée. Une fréquence de 30 par minute ou plus est un signal d’alarme qui fait envisager l’hospitalisation et compte dans le score CRB-65.</p><div class="key"><b>Limite.</b> La fièvre et l’anxiété élèvent aussi la fréquence. Une fréquence normale sous oxygène n’exclut pas un épuisement débutant.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j09-v-spo" data-title="Saturation pulsée en oxygène"><p class="lab">Fonction et cible</p><p>L’oxymètre de pouls estime la saturation de l’hémoglobine artérielle en oxygène. Chez l’adulte sain, elle atteint au moins 95 % en air ambiant.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une pneumonie virale crée des alvéoles perfusées mais non ventilées ; le sang qui les traverse reste désaturé et abaisse la saturation du mélange artériel. La mesure doit se faire en air ambiant, avec un signal de pouls stable, sur un doigt bien perfusé et sans vernis.</p><p class="lab">Conséquence clinique</p><p>Selon la Société suisse d’infectiologie, une saturation inférieure à 92 % est un signal d’alarme de l’infection respiratoire aiguë, et une saturation inférieure à 90 % fait envisager une hospitalisation quel que soit le score. Chez le patient atteint de BPCO, le médecin compare la valeur à la saturation habituelle.</p><div class="key"><b>Limite.</b> Une mauvaise perfusion périphérique fausse la mesure ; une intoxication au monoxyde de carbone la surestime. Une saturation correcte sous oxygène peut masquer une aggravation : la fréquence respiratoire et la gazométrie la révèlent.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j09-v-pa" data-title="Pression artérielle et perfusion"><p class="lab">Fonction et cible</p><p>La pression artérielle et les signes de perfusion renseignent sur la capacité de la circulation à maintenir l’apport d’oxygène aux organes.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre, la transpiration et une prise de boissons réduite diminuent le volume circulant. Un sepsis, viral ou bactérien, provoque une vasodilatation. Une myocardite réduit le débit cardiaque. Chacun de ces mécanismes peut abaisser la pression. Le médecin recherche aussi les marbrures, un temps de recoloration prolongé et une diurèse diminuée.</p><p class="lab">Conséquence clinique</p><p>Une systolique inférieure à 90 mmHg est un signal d’alarme selon la Société suisse d’infectiologie ; une systolique inférieure à 90 mmHg ou une diastolique d’au plus 60 mmHg donne un point du CRB-65. Une hypotension orthostatique chez un patient qui boit peu traduit une déshydratation.</p><div class="key"><b>Limite.</b> Une pression encore normale n’exclut pas un choc débutant chez un patient hypertendu ; le médecin compare à la valeur habituelle et répète la mesure.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j09-v-fc" data-title="Fréquence cardiaque"><p class="lab">Fonction et cible</p><p>La fréquence cardiaque de repos de l’adulte se situe entre 60 et 100 par minute. La fièvre l’accélère.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’élévation de la température augmente le métabolisme et la fréquence cardiaque. Une déshydratation et une hypoxémie l’accélèrent davantage. Une myocardite grippale peut provoquer une tachycardie hors de proportion avec la fièvre, des troubles du rythme et des signes d’insuffisance cardiaque.</p><p class="lab">Conséquence clinique</p><p>Le médecin interprète la fréquence avec la température et l’hydratation. Une tachycardie qui persiste après la baisse de la fièvre, une douleur thoracique, une dyspnée ou un pouls irrégulier font rechercher une atteinte cardiaque par un électrocardiogramme et un dosage de troponine.</p><div class="key"><b>Limite.</b> Un bêtabloquant masque la tachycardie. Une fréquence normale n’exclut ni une myocardite ni un sepsis chez un patient ainsi traité.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus du myocarde après grippe confirmée, N Engl J Med 2018</a>.</p></template>
<template data-pop="j09-conscience" data-title="État de conscience et confusion"><p class="lab">Fonction et cible</p><p>La confusion est une altération aiguë de l’attention et de la conscience. Elle se recherche par l’orientation, l’attention et la cohérence du discours.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une hypotension, une fièvre élevée, une déshydratation ou une hyponatrémie perturbent le fonctionnement cérébral, surtout chez la personne âgée dont la réserve est réduite. Plus rarement, la grippe provoque une encéphalite ou une encéphalopathie.</p><p class="lab">Conséquence clinique</p><p>Une confusion nouvelle est un signal d’alarme et compte dans le score CRB-65. Elle impose la recherche d’une hypoxémie, d’un trouble métabolique, d’un sepsis et, en présence d’une raideur de nuque ou de convulsions, d’une infection du système nerveux central.</p><div class="key"><b>Limite.</b> Chez un patient dément, le médecin compare avec l’état habituel décrit par l’entourage ou les soignants.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-ausc" data-title="Auscultation pulmonaire dans la grippe"><p class="lab">Fonction et cible</p><p>L’auscultation recherche les bruits anormaux qui traduisent une atteinte bronchique, alvéolaire ou pleurale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Dans la grippe non compliquée, l’atteinte prédomine dans la trachée et les bronches : l’auscultation est souvent normale, ou révèle des ronchi diffus qui changent après la toux. Lorsque des alvéoles se remplissent d’exsudat, des crépitants apparaissent ; une condensation transmet mieux les vibrations vocales et peut produire un souffle.</p><p class="lab">Conséquence clinique</p><p>Des crépitants localisés ou bilatéraux orientent vers une pneumonie, virale ou bactérienne, et justifient une imagerie. Des sibilants diffus chez un asthmatique traduisent un bronchospasme induit par le virus.</p><div class="key"><b>Limite.</b> Une auscultation normale n’exclut pas une pneumonie virale débutante, en particulier chez un patient hypoxémique. La saturation et la fréquence respiratoire restent indispensables.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j09-deshydratation" data-title="Déshydratation au cours de la grippe"><p class="lab">Fonction et cible</p><p>La déshydratation est une perte d’eau et de sel non compensée. Elle menace surtout la personne âgée et le jeune enfant grippés.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre et la tachypnée augmentent les pertes insensibles ; l’anorexie, les nausées et la fatigue réduisent les apports, et l’OFSP cite la perte d’appétit parmi les symptômes typiques. La personne âgée ressent moins la soif. Le volume circulant diminue, ce qui provoque une tachycardie, une hypotension orthostatique et une baisse de la diurèse.</p><p class="lab">Conséquence clinique</p><p>Le médecin recherche des muqueuses sèches, une hypotension orthostatique, une baisse de la diurèse et une confusion. Une incapacité à boire chez un patient fragile, surtout si la surveillance à domicile est insuffisante, fait partie des facteurs sociaux et cliniques qui conduisent la Société suisse d’infectiologie à envisager une hospitalisation.</p><div class="key"><b>Limite.</b> Les signes cutanés sont peu fiables chez la personne âgée. Une insuffisance rénale fonctionnelle se recherche par la créatinine lorsque le patient est hospitalisé.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j09-alarme" data-title="Signes de gravité d’une grippe"><p class="lab">Fonction et cible</p><p>Un signe de gravité signale une complication en cours ou une réserve insuffisante. Il change le lieu de soins et l’urgence du traitement.</p><p class="lab">Mécanisme de l’affirmation</p><p>La Société suisse d’infectiologie fait envisager une hospitalisation devant une mauvaise impression clinique générale, une systolique inférieure à 90 mmHg, une fréquence respiratoire de 30 par minute ou plus, une saturation inférieure à 92 %, des hémoptysies, un stridor, une maladie pulmonaire sévère ou une immunodéficience sévère. Les signes respiratoires traduisent une atteinte alvéolaire, les signes circulatoires un sepsis, une déshydratation ou une atteinte cardiaque, les signes neurologiques une hypoxémie, un trouble métabolique ou une atteinte du système nerveux. L’évolution en deux temps traduit une surinfection.</p><p class="lab">Conséquence clinique</p><p>Un seul signe suffit à justifier une évaluation hospitalière et des examens complémentaires. À l’hôpital, le prélèvement virologique précède l’oseltamivir, dont l’instauration n’attend pas le résultat. Chez le patient à risque, le seuil d’hospitalisation est plus bas.</p><div class="key"><b>Limite.</b> Ces signes ne sont pas spécifiques de la grippe ; ils signalent la gravité de toute infection respiratoire. L’absence de signe de gravité n’exclut pas une aggravation ultérieure : le médecin donne au patient des consignes de reconsultation.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a>.</p></template>
<template data-pop="pareto-j09-bases" data-title="Pareto — Virus, mécanismes et clinique de la grippe"><p class="ratio" data-cover="j09-0,j09-1,j09-2,j09-3,j09-4,j09-5,j09-6"></p><ul><li>La grippe est due aux virus influenza A ou B. La dérive antigénique explique les épidémies annuelles et la révision annuelle du vaccin ; la cassure par réassortiment peut provoquer une pandémie.</li><li>En Suisse, l’épidémie culmine le plus souvent entre fin décembre et février. Les enfants consultent le plus ; les personnes âgées représentent l’essentiel des hospitalisations et des décès.</li><li>L’hémagglutinine fixe le virus à l’acide sialique ; la neuraminidase libère les virions. Le baloxavir bloque le vol de coiffe de la polymérase ; l’oseltamivir bloque la neuraminidase.</li><li>Les cytokines produisent la fièvre et les courbatures ; l’atteinte alvéolaire donne une pneumonie virale hypoxémiante ; l’épithélium lésé favorise la surinfection à pneumocoque et à staphylocoque doré.</li><li>L’incubation dure un à quatre jours ; la contagiosité commence la veille des symptômes et culmine pendant les trois premiers jours.</li><li>Les personnes à risque sont celles de 65 ans et plus, les femmes enceintes ou récemment accouchées, les malades chroniques, les immunodéprimés et les résidents d’établissements de soins.</li><li>Le récit typique associe un début brutal, une fièvre élevée, des courbatures et une toux sèche. Le médecin date le début, établit le terrain et recherche une exposition animale. La fièvre peut manquer chez la personne âgée.</li><li>Une fréquence respiratoire de 30 par minute ou plus, une saturation inférieure à 92 %, une systolique inférieure à 90 mmHg, une confusion ou une aggravation en deux temps imposent une évaluation hospitalière.</li></ul></template>
