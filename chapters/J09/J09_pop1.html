<template data-pop="j09-q-decision" data-title="Quatre décisions devant un syndrome grippal"><p class="lab">Fonction et cible</p><p>Un syndrome grippal associe en général une fièvre d’apparition brutale, une toux ou un mal de gorge et des signes généraux. Il impose quatre décisions successives : tester ou non, traiter par antiviral ou non, soigner à domicile ou à l’hôpital, protéger l’entourage.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces décisions suivent un ordre logique. La gravité se juge d’abord, parce qu’un patient instable doit être orienté avant tout test. Le terrain se juge ensuite, parce qu’il détermine l’indication d’un antiviral. Le test ne vient qu’après, lorsque son résultat modifie la conduite. La protection de l’entourage découle de la contagiosité, maximale pendant les trois premiers jours.</p><p class="lab">Conséquence clinique</p><p>Chez un adulte jeune sans facteur de risque, le diagnostic clinique en période épidémique suffit le plus souvent ; il n’a besoin ni de test ni d’antiviral. Chez un patient à risque ou hospitalisé, le test et l’antiviral sont discutés immédiatement.</p><div class="key"><b>Limite.</b> Ces étapes résument la démarche ; elles ne remplacent ni les recommandations détaillées des parties Diagnostic et Prise en charge, ni le jugement clinique dans une situation inhabituelle.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>

6tiCgUERLxedUZue5D1+ORZkq4sJLYJQKuI7ZUF3CvvYJnLI+yVExRQu6T9XGkzylLmfoEof1u+ozpzI8xkZoTKipqYB8Vj6kLd18/3SSZgxuPSENrYFlfii04LolVrkOh11qEQmLymunAbRdVWUl7mcHntSv6IRVf9Z4QYAjKKzKjzITQAe5xgGZMFzMmOmTlxe7QoHyZNwR25folx+wPqpiCFnwRXW6I+9uD6m3v/lGQu3yCb3flTTHQcXrpeqo6OG8yWMBpqoyAHU8Cs2neFps5TgrCjrpYYiGNxMl0cfKal7LULR7B1eQgcvBBKNIlhbQHTMWGbcwl/KOOuG51CplIbDmOXffoRT5QMSR02mgf+wBo3U6mrKTmiJ77Mt0oF3sUqkWbwCUflTs9EbXnv2JUR+2HJqF97GiPerDH9mdxjdPLuGNsFbX1By9YMt2DxwaukUwJdihHwENGwoCVkMQuohm2jlpiugSIJkcOVo7YIoDLiiSk21cpS3aSAu+XBpZjlMPcfvTy3j7qcfOBw+P9ihwQADs=" width="340" height="291" loading="lazy" decoding="async" style="max-width:100%;height:auto" alt="Micrographie électronique du virus de la grippe A en coloration négative"><figcaption>Cette micrographie électronique en coloration négative montre des particules du virus de la grippe A. Chaque virion est entouré d’une enveloppe lipidique hérissée de spicules d’hémagglutinine et de neuraminidase. L’hémagglutinine fixe le virus à l’acide sialique des cellules respiratoires, tandis que la neuraminidase libère les nouveaux virions ; c’est pourquoi les inhibiteurs de la neuraminidase, comme l’oseltamivir, freinent la propagation de l’infection. De plus, ces deux protéines changent sans cesse, par dérive ou par cassure antigénique, si bien que le vaccin doit être renouvelé chaque année. Source : <a href="https://commons.wikimedia.org/wiki/File:Influenza_A_virus_-_negative_stain_image_TEM.JPG" target="_blank" rel="noopener" data-reference-source="1">auteur indiqué sur la page source, Wikimedia Commons</a> ; <a href="https://commons.wikimedia.org/wiki/Help:Public_domain" target="_blank" rel="noopener" data-reference-source="1">licence Public domain</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Fonction et cible</p><p>Les quatre types se distinguent par leurs protéines internes, la nucléoprotéine et la protéine de matrice. Ils diffèrent par leurs hôtes et par leur capacité épidémique.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le type A infecte les oiseaux aquatiques sauvages, qui hébergent presque tous ses sous-types, ainsi que les volailles, les porcs, les chevaux et l’être humain. Ce large éventail d’hôtes permet les réassortiments entre virus d’espèces différentes. Le type B circule presque exclusivement chez l’être humain ; il évolue par dérive mais ne subit pas de cassure. Le type C provoque des infections respiratoires bénignes, surtout chez l’enfant. Le type D infecte surtout les bovins ; aucune maladie humaine ne lui est clairement attribuée.</p><p class="lab">Conséquence clinique</p><p>Seuls les types A et B causent les épidémies saisonnières et sont inclus dans les vaccins. Seul le type A peut provoquer une pandémie. Les deux types peuvent provoquer une grippe grave : chez l’enfant et lors de certaines saisons, le type B est loin d’être bénin.</p><div class="key"><b>Limite.</b> Le type n’indique pas la gravité individuelle. Un test qui distingue A et B ne précise pas le sous-type ; seul un laboratoire de référence identifie un virus zoonotique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-hn" data-title="Hémagglutinine et neuraminidase : sous-types H et N"><p class="lab">Fonction et cible</p><p>L’hémagglutinine et la neuraminidase sont les deux glycoprotéines de l’enveloppe virale. Elles servent à classer les virus du type A en sous-types, notés H et N suivis d’un numéro.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’hémagglutinine fixe le virus à l’acide sialique de la cellule et permet la fusion des membranes. La neuraminidase coupe l’acide sialique pour libérer les virions néoformés. On connaît au moins 18 hémagglutinines et 11 neuraminidases ; deux de ces sous-types n’ont été trouvés que chez des chauves-souris. Les anticorps protecteurs visent surtout la tête de l’hémagglutinine.</p><p class="lab">Conséquence clinique</p><p>Le sous-type renseigne sur l’origine et le comportement épidémique d’un virus. Les sous-types humains saisonniers actuels sont H1N1 et H3N2 ; H5N1 est un sous-type aviaire. Les deux glycoprotéines sont aussi les cibles des vaccins (hémagglutinine) et des inhibiteurs de la neuraminidase.</p><div class="key"><b>Limite.</b> Deux virus du même sous-type peuvent différer beaucoup par leurs antigènes et leur gravité. Le virus A(H1N1)pdm09 et le virus H1N1 de 1918 partagent un sous-type, mais pas leurs propriétés épidémiques.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-nomenclature" data-title="Nom complet d’une souche de grippe"><p class="lab">Fonction et cible</p><p>Le nom d’une souche indique son type, son hôte d’origine s’il n’est pas humain, le lieu du premier isolement, le numéro de la souche, l’année et, pour le type A, le sous-type entre parenthèses.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une souche notée A/Lieu/numéro/année(H3N2) est un virus du type A, isolé chez l’être humain dans ce lieu cette année-là, de sous-type H3N2. Pour un virus animal, l’espèce s’ajoute après le type, par exemple « A/canard/… ». Le suffixe « pdm09 » distingue le virus pandémique de 2009 des virus H1N1 antérieurs.</p><p class="lab">Conséquence clinique</p><p>Cette nomenclature permet de lire la composition annuelle du vaccin, qui désigne chaque souche par son nom complet, et de comprendre les rapports de surveillance.</p><div class="key"><b>Limite.</b> Le nom d’une souche ne renseigne pas sur sa sensibilité aux antiviraux ni sur sa concordance avec le vaccin ; ces informations viennent des laboratoires de référence.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-derive" data-title="Dérive antigénique"><p class="lab">Fonction et cible</p><p>La dérive antigénique est l’accumulation progressive de mutations ponctuelles dans les gènes de l’hémagglutinine et de la neuraminidase. Elle touche les types A et B.</p><p class="lab">Mécanisme de l’affirmation</p><p>La polymérase virale copie l’acide ribonucléique sans corriger ses erreurs. Une fraction des mutations modifie les sites de l’hémagglutinine reconnus par les anticorps neutralisants. Dans une population déjà partiellement immunisée, ces variants échappent mieux aux anticorps et se multiplient davantage : la sélection naturelle les favorise.</p><p class="lab">Conséquence clinique</p><p>La dérive explique les épidémies annuelles, les réinfections au cours de la vie et la révision annuelle de la composition du vaccin par l’OMS. Elle explique aussi qu’un vaccin puisse être moins efficace une saison donnée : en 2023/2024, 18 % des virus suisses caractérisés ne réagissaient pas aux antisérums dirigés contre les souches vaccinales.</p><div class="key"><b>Limite.</b> La dérive est continue et modérée ; elle ne crée pas de nouveau sous-type. Une immunité croisée partielle persiste en général, ce qui distingue une épidémie saisonnière d’une pandémie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-cassure" data-title="Cassure antigénique et pandémie"><p class="lab">Fonction et cible</p><p>La cassure antigénique est l’apparition chez l’être humain d’un virus du type A porteur d’une hémagglutinine nouvelle pour la population. Elle seule peut provoquer une pandémie.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le génome est divisé en huit segments. Lorsque deux virus différents, par exemple un virus humain et un virus aviaire, infectent la même cellule, les virions néoformés peuvent combiner des segments des deux parents : c’est le réassortiment. Le porc, dont les voies respiratoires portent des récepteurs pour les virus humains et aviaires, peut servir de lieu de mélange. Le virus de 2009 est un réassortant d’origine porcine. Un virus animal peut aussi s’adapter directement à l’être humain par mutations.</p><p class="lab">Conséquence clinique</p><p>Une pandémie exige trois conditions : une hémagglutinine nouvelle, une population sans immunité et une transmission interhumaine efficace. Elle touche alors des adultes jeunes, habituellement épargnés par les formes graves, et peut survenir hors de la saison hivernale. Le virus pandémique remplace souvent le virus saisonnier du même type et devient lui-même saisonnier.</p><div class="key"><b>Limite.</b> La plupart des infections humaines par des virus aviaires restent des impasses : sans transmission interhumaine soutenue, elles ne constituent pas une pandémie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://cdn.who.int/media/docs/default-source/wpro---documents/emergency/surveillance/avian-influenza/ai_20260918.pdf" target="_blank" rel="noopener">OMS, bureau régional du Pacifique occidental, Avian Influenza Weekly Update du 18.09.2026 (cas humains mondiaux de A(H5N1) au 06.09.2026)</a>.</p></template>
<template data-pop="j09-sentinella" data-title="Réseau Sentinella et définition du syndrome grippal"><p class="lab">Fonction et cible</p><p>Sentinella est un réseau de médecins de premier recours volontaires, généralistes, internistes et pédiatres, d’environ 170 cabinets. Il estime l’activité grippale dans la population, car la plupart des patients peu malades ne sont jamais testés.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les médecins déclarent chaque semaine les consultations pour syndrome grippal. La définition retenue est l’apparition soudaine d’une forte fièvre de plus de 38 °C, d’une toux ou de maux de gorge, éventuellement accompagnés d’une sensation marquée de maladie, de faiblesse, de douleurs musculaires ou articulaires, de céphalées et de symptômes digestifs. Une partie des médecins envoie des frottis nasopharyngés au Centre national de référence de l’influenza, aux Hôpitaux universitaires de Genève, qui recherche plusieurs virus par PCR multiplex.</p><p class="lab">Conséquence clinique</p><p>L’OFSP extrapole ces déclarations à la population suisse et publie un bulletin hebdomadaire. Le médecin s’en sert pour estimer la probabilité qu’un syndrome grippal soit une grippe.</p><div class="key"><b>Limite.</b> L’échantillon est petit : l’OFSP recommande d’interpréter les extrapolations avec prudence. La définition du syndrome grippal n’est pas spécifique de la grippe ; d’autres virus la remplissent.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-seuil" data-title="Seuil épidémique : ancienne et nouvelle méthode"><p class="lab">Fonction et cible</p><p>Un seuil épidémique sert à dater le début et la fin d’une épidémie. Il permet d’annoncer aux médecins que la grippe circule.</p><p class="lab">Mécanisme de l’affirmation</p><p>Jusqu’à la saison 2019/2020, l’OFSP fixait avant chaque saison un seuil de consultations pour syndrome grippal, calculé sur les saisons précédentes. La pandémie de COVID-19 a modifié la fréquence des consultations et la circulation des virus ; l’OFSP a renoncé à fixer ce seuil à partir de 2020/2021. Le rapport 2023/2024 décrit la saison par le taux de frottis Sentinella positifs pour un virus influenza, qui a dépassé 10 % de la semaine 49 à la semaine 11, avec un maximum de 46,2 % la cinquième semaine.</p><p class="lab">Conséquence clinique</p><p>Le taux de positivité dit directement quelle part des syndromes grippaux est due à la grippe. Lorsqu’il atteint 40 %, un syndrome grippal sur deux à trois est une grippe ; hors saison, ce taux reste très bas.</p><div class="key"><b>Limite.</b> Ce taux dépend de la sélection des patients prélevés. Certains cantons emploient leurs propres seuils ; le médecin vérifie la source de l’indicateur qu’il lit.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/N1QWQUAX6xMa/saisonbericht-grippe-2021-22.pdf" target="_blank" rel="noopener">OFSP, Rapport sur la saison grippale 2021/2022</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-age" data-title="Incidence et gravité selon l’âge"><p class="lab">Fonction et cible</p><p>L’âge modifie à la fois la probabilité d’infection et la probabilité de complication. Les deux ne vont pas dans le même sens.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les jeunes enfants n’ont pas encore rencontré la plupart des virus ; ils s’infectent plus souvent et excrètent plus longtemps. En 2023/2024, les consultations Sentinella étaient les plus fréquentes chez les 0 à 4 ans et les moins fréquentes chez les 65 ans et plus. Chez la personne âgée, l’immunosénescence et les comorbidités augmentent la gravité : une pneumonie compliquait 8,6 % des consultations des 65 ans et plus, contre 3,4 % de l’ensemble des patients, et l’âge médian des hospitalisés était de 71 ans.</p><p class="lab">Conséquence clinique</p><p>La vaccination et l’antiviral visent en priorité les personnes âgées, qui portent l’essentiel des complications. La vaccination de l’entourage des nourrissons de moins de six mois les protège indirectement, car ils ne peuvent pas être vaccinés.</p><div class="key"><b>Limite.</b> Ces données décrivent une saison où A(H1N1)pdm09 dominait. Lors des saisons à A(H3N2), la charge chez les personnes âgées est souvent plus lourde ; une saison ne prédit pas la suivante.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-fardeau" data-title="Hospitalisations et décès dus à la grippe en Suisse"><p class="lab">Fonction et cible</p><p>Le fardeau de la grippe mesure son impact sur le système de santé. Il justifie la stratégie nationale de prévention et la vaccination des groupes à risque.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’OFSP indique que les complications de la grippe entraînent chaque année plusieurs milliers d’hospitalisations et fréquemment plusieurs centaines de décès. Ces chiffres sont des estimations : beaucoup de décès surviennent par décompensation cardiaque ou pulmonaire chez des patients jamais testés, et sont attribués à une autre cause. En 2023/2024, les six hôpitaux du système de surveillance ont recensé 1653 hospitalisations pour grippe, dont 12,0 % avec séjour aux soins intensifs et 4,2 % de décès hospitaliers.</p><p class="lab">Conséquence clinique</p><p>Le médecin peut expliquer à un patient âgé que la grippe n’est pas une maladie anodine pour lui. L’hospitalisation contractée à l’hôpital dans 17,2 % des cas montre que la vaccination du personnel protège aussi les patients.</p><div class="key"><b>Limite.</b> Les six hôpitaux de surveillance ne représentent pas tous les hôpitaux suisses, et ce système a été suspendu fin août 2024. Les données plus récentes doivent être lues sur le portail de l’OFSP.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/fr/strategie-nationale-de-prevention-de-la-grippe-grips" target="_blank" rel="noopener">OFSP, Stratégie nationale de prévention de la grippe, publiée le 06.01.2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-ha" data-title="Hémagglutinine et acide sialique"><p class="lab">Fonction et cible</p><p>L’hémagglutinine reconnaît l’acide sialique terminal des glycoprotéines de la cellule. La liaison de ce sucre à l’avant-dernier sucre peut se faire par deux liaisons, alpha 2,6 ou alpha 2,3.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les virus humains se lient de préférence à l’acide sialique en liaison alpha 2,6, abondant dans l’épithélium des voies aériennes supérieures humaines. Les virus aviaires préfèrent la liaison alpha 2,3, présente chez l’être humain surtout dans les bronchioles et les alvéoles. Pour devenir fonctionnelle, l’hémagglutinine doit aussi être clivée par des protéases de l’hôte. Les virus saisonniers possèdent un site de clivage reconnu seulement par des protéases de l’épithélium respiratoire ; certains virus aviaires hautement pathogènes, dont A(H5N1), possèdent un site multibasique, clivé par des protéases présentes dans de nombreux tissus.</p><p class="lab">Conséquence clinique</p><p>Un virus aviaire se fixe mal au nez et à la gorge de l’être humain : il se transmet mal d’une personne à l’autre. Lorsqu’il atteint les alvéoles, il provoque en revanche une pneumonie grave. Ce double comportement explique la rareté et la gravité des infections humaines par A(H5N1).</p><div class="key"><b>Limite.</b> Un petit nombre de mutations peut déplacer la préférence de l’hémagglutinine vers la liaison alpha 2,6. La surveillance génétique des virus aviaires recherche précisément ces mutations.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a>.</p></template>
<template data-pop="j09-cycle" data-title="Endocytose, polymérase virale et vol de coiffe"><p class="lab">Fonction et cible</p><p>Après l’attachement, le virus doit livrer son génome au noyau, puis faire produire ses protéines par la cellule. Ces étapes reposent sur la protéine de matrice 2 et sur la polymérase virale à trois sous-unités.</p><p class="lab">Mécanisme de l’affirmation</p><p>La vésicule d’endocytose s’acidifie. Le canal ionique de la protéine de matrice 2 laisse entrer des protons dans le virion et libère ses ribonucléoprotéines ; l’acidité modifie aussi la forme de l’hémagglutinine, qui fusionne l’enveloppe avec la membrane. Dans le noyau, la polymérase virale arrache l’extrémité coiffée des ARN messagers de la cellule et s’en sert d’amorce pour ses propres ARN messagers. Ce « vol de coiffe » dépend d’une activité endonucléase portée par une sous-unité de la polymérase.</p><p class="lab">Conséquence clinique</p><p>Le baloxavir marboxil inhibe cette endonucléase et réduit rapidement la charge virale. L’amantadine bloquait le canal de la protéine de matrice 2 ; la résistance quasi générale des virus actuels l’a rendue inutilisable. La polymérase ne corrige pas ses erreurs, d’où la dérive antigénique.</p><div class="key"><b>Limite.</b> Une mutation de l’endonucléase peut réduire la sensibilité au baloxavir, surtout chez l’enfant et l’immunodéprimé. Les détails sont traités dans l’onglet Pharmacologie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-na" data-title="Neuraminidase et libération des virions"><p class="lab">Fonction et cible</p><p>La neuraminidase est une enzyme de surface qui coupe l’acide sialique. Elle agit à la fin du cycle et pendant la traversée du mucus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les virions néoformés bourgeonnent à la membrane cellulaire, qui porte de l’acide sialique. Sans neuraminidase, l’hémagglutinine les retiendrait à la surface de la cellule et les ferait s’agréger entre eux. La neuraminidase coupe ces liaisons et libère les virions. Elle découpe aussi les mucines sialylées du mucus, qui piégeraient sinon le virus avant qu’il n’atteigne l’épithélium.</p><p class="lab">Conséquence clinique</p><p>L’oseltamivir et le zanamivir inhibent la neuraminidase : les virions restent attachés à la cellule infectée et l’infection progresse moins vite vers les cellules voisines. Comme ils n’agissent pas sur les cellules déjà infectées, leur bénéfice est maximal lorsqu’ils sont donnés tôt, pendant la phase de réplication active.</p><div class="key"><b>Limite.</b> Des mutations de la neuraminidase peuvent conférer une résistance ; le Centre national de référence de l’influenza la recherche sur un échantillon de virus suisses. La neuraminidase favorise aussi l’adhérence du pneumocoque, ce qui relie ce mécanisme aux surinfections.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a>.</p></template>
<template data-pop="j09-ifn" data-title="Interférons et protéine non structurale 1"><p class="lab">Fonction et cible</p><p>Les interférons de type I et III sont la première ligne de défense antivirale. Ils sont produits dans les heures qui suivent l’infection d’une cellule.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des senseurs cytosoliques reconnaissent l’acide ribonucléique viral, qui porte des caractéristiques absentes des ARN de la cellule. Leur activation déclenche la sécrétion d’interférons, qui induisent dans les cellules voisines des protéines antivirales freinant la réplication. Le virus produit une protéine non structurale qui inhibe ces senseurs et la synthèse des interférons. L’issue des premières heures dépend de cet équilibre.</p><p class="lab">Conséquence clinique</p><p>Une réponse interféron efficace limite la réplication à l’épithélium bronchique. Une réponse retardée laisse la charge virale monter, puis s’accompagne d’une inflammation excessive. Les interférons participent aussi à la fièvre et à la fatigue des premiers jours.</p><div class="key"><b>Limite.</b> La réponse interféron altère le recrutement des polynucléaires et des macrophages contre les bactéries ; elle contribue ainsi à la surinfection. Une même réponse protège contre le virus et fragilise contre les bactéries.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a>.</p></template>
<template data-pop="j09-cytokines" data-title="Des cytokines aux symptômes généraux"><p class="lab">Fonction et cible</p><p>Les cytokines inflammatoires relient l’infection locale aux symptômes généraux. Elles expliquent que le patient se sente très malade dès le premier jour.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez 19 volontaires infectés par un virus A(H1N1), l’IL-6 et l’interféron alpha des sécrétions nasales culminaient le deuxième jour et évoluaient avec la charge virale, la température, la production de mucus et les scores de symptômes. Le TNF s’élevait plus tard, aux troisième et quatrième jours. Ces cytokines agissent sur l’hypothalamus par la PGE₂, qui élève le point de consigne thermique : le patient frissonne pour produire de la chaleur jusqu’à ce que sa température atteigne ce nouveau point.</p><p class="lab">Conséquence clinique</p><p>Un antipyrétique comme le paracétamol abaisse la PGE₂ et soulage la fièvre et les courbatures, sans agir sur le virus. L’intensité des symptômes généraux du deuxième jour correspond au pic de réplication et de contagiosité.</p><div class="key"><b>Limite.</b> Cette étude porte sur des adultes jeunes infectés expérimentalement ; elle ne décrit pas la réponse de la personne âgée, chez qui la fièvre peut manquer malgré une infection active.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-adaptatif" data-title="Anticorps et lymphocytes T dans la grippe"><p class="lab">Fonction et cible</p><p>L’immunité adaptative élimine le virus et protège contre les réinfections par une souche proche. Elle associe des anticorps et des lymphocytes T.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les anticorps dirigés contre la tête de l’hémagglutinine neutralisent le virus et empêchent son attachement ; les IgA sécrétoires protègent la muqueuse. Les anticorps contre la neuraminidase limitent la diffusion de l’infection. Les lymphocytes T CD8 reconnaissent des protéines internes, plus stables d’une souche à l’autre, et détruisent les cellules infectées. Lors d’une première rencontre, cette réponse demande une à deux semaines ; chez un sujet déjà exposé, la mémoire la rend plus rapide.</p><p class="lab">Conséquence clinique</p><p>Les anticorps expliquent la protection vaccinale, qui dépend de la concordance entre souches vaccinale et circulante. Les lymphocytes T expliquent qu’une exposition antérieure atténue la gravité même lorsqu’elle n’empêche pas l’infection.</p><div class="key"><b>Limite.</b> Les anticorps contre l’hémagglutinine sont spécifiques de la souche : la dérive les contourne. Un déficit de l’immunité cellulaire, par exemple après une greffe, prolonge l’excrétion virale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-dad" data-title="Pneumonie virale primaire et dommage alvéolaire diffus"><p class="lab">Fonction et cible</p><p>La pneumonie virale primaire est une atteinte des alvéoles par le virus lui-même, sans bactérie. Elle survient en général dans les trois à cinq premiers jours de la maladie.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus infecte les pneumocytes et l’endothélium des capillaires alvéolaires. Les cellules meurent, la barrière alvéolo-capillaire devient perméable, et un exsudat riche en protéines remplit les alvéoles. La fibrine se dépose sur les parois et forme des membranes hyalines ; c’est le dommage alvéolaire diffus. Le sang qui traverse ces alvéoles non ventilées n’est pas oxygéné : il se crée un effet shunt, qui résiste à l’oxygène.</p><p class="lab">Conséquence clinique</p><p>Le patient présente une dyspnée croissante, une tachypnée et une hypoxémie, avec souvent des opacités bilatérales. L’évolution vers un SDRA peut exiger une ventilation mécanique, voire une oxygénation par membrane extracorporelle.</p><div class="key"><b>Limite.</b> La pneumonie virale primaire et la surinfection bactérienne peuvent coexister. L’imagerie et la clinique ne permettent pas toujours de les séparer, d’où la recherche microbiologique décrite dans l’onglet Examens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
