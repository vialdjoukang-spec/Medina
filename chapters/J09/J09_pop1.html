<template data-pop="j09-q-decision" data-title="Quatre décisions devant un syndrome grippal"><p class="lab">Fonction et cible</p><p>Le médecin décide s’il teste, s’il prescrit un antiviral, où il soigne et comment il protège l’entourage.</p><p class="lab">Mécanisme de l’affirmation</p><p>La gravité se juge d’abord, car un patient instable est orienté avant tout test. Le terrain fonde ensuite l’indication antivirale ; le test n’est utile que si son résultat change la conduite. La protection de l’entourage découle d’une contagiosité maximale les trois premiers jours.</p><p class="lab">Conséquence clinique</p><p>En période épidémique, l’adulte jeune sans facteur de risque n’a besoin ni de test ni d’antiviral. Chez le patient à risque ou hospitalisé, test et antiviral se discutent immédiatement.</p><p class="src">Références : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j09-types" data-title="Types A, B, C et D du virus influenza"><p class="lab">Fonction et cible</p><p>Les quatre types se distinguent par leurs protéines internes, nucléoprotéine et protéine de matrice.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le type A infecte les oiseaux, les porcs, les chevaux et l’être humain ; cette diversité d’hôtes permet des réassortiments entre virus d’espèces différentes. Le type B évolue par dérive mais ne subit pas de cassure. Le type C cause des infections bénignes, surtout chez l’enfant ; le type D infecte surtout les bovins, sans maladie humaine établie.</p><p class="lab">Conséquence clinique</p><p>Seuls A et B entrent dans les vaccins, et seul A peut causer une pandémie. Le type B peut être grave, notamment chez l’enfant.</p><div class="key"><b>Limite.</b> Un test qui distingue A et B ne précise pas le sous-type ; seul un laboratoire de référence identifie un virus zoonotique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-hn" data-title="Hémagglutinine et neuraminidase : sous-types H et N"><p class="lab">Mécanisme de l’affirmation</p><p>L’hémagglutinine fixe le virus à l’acide sialique et assure la fusion des membranes ; la neuraminidase coupe l’acide sialique pour libérer les virions. Deux sous-types n’ont été trouvés que chez des chauves-souris.</p><p class="lab">Conséquence clinique</p><p>H1N1 et H3N2 sont les sous-types humains saisonniers, H5N1 un sous-type aviaire. L’hémagglutinine est la cible des vaccins et des anticorps protecteurs, la neuraminidase celle de l’oseltamivir et du zanamivir.</p><div class="key"><b>Limite.</b> Le sous-type ne prédit pas le comportement : A(H1N1)pdm09 et le virus H1N1 de 1918 le partagent sans partager leurs propriétés épidémiques.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-nomenclature" data-title="Nom complet d’une souche de grippe"><p class="lab">Fonction et cible</p><p>Le nom indique le type, l’hôte s’il n’est pas humain, le lieu d’isolement, le numéro, l’année et, pour le type A, le sous-type.</p><p class="lab">Mécanisme de l’affirmation</p><p>A/Lieu/numéro/année(H3N2) désigne un virus A humain de sous-type H3N2 ; pour un virus animal, l’espèce suit le type (« A/canard/… »). Le suffixe « pdm09 » distingue le virus pandémique de 2009 des virus H1N1 antérieurs.</p><p class="lab">Conséquence clinique</p><p>Cette règle permet de lire la composition annuelle du vaccin et les rapports de surveillance.</p><div class="key"><b>Limite.</b> Le nom ne dit rien de la sensibilité aux antiviraux ni de la concordance vaccinale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-derive" data-title="Dérive antigénique"><p class="lab">Mécanisme de l’affirmation</p><p>La polymérase virale ne corrige pas ses erreurs de copie. Dans une population partiellement immunisée, les variants dont les sites antigéniques ont changé échappent aux anticorps neutralisants et sont sélectionnés.</p><p class="lab">Conséquence clinique</p><p>La concordance vaccinale peut baisser : en 2023/2024, 18 % des virus suisses caractérisés ne réagissaient pas aux antisérums dirigés contre les souches vaccinales.</p><div class="key"><b>Limite.</b> La dérive ne crée pas de nouveau sous-type, et une immunité croisée partielle persiste ; c’est ce qui sépare épidémie saisonnière et pandémie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-cassure" data-title="Cassure antigénique et pandémie"><p class="lab">Mécanisme de l’affirmation</p><p>Quand un virus humain et un virus aviaire infectent la même cellule, les virions néoformés peuvent combiner leurs huit segments. Le porc, porteur de récepteurs pour les deux, sert de lieu de mélange ; le virus de 2009 est un réassortant d’origine porcine. Un virus animal peut aussi s’adapter à l’être humain par mutations.</p><p class="lab">Conséquence clinique</p><p>Une pandémie exige une hémagglutinine nouvelle, une population sans immunité et une transmission interhumaine efficace. Elle frappe alors des adultes jeunes, peut survenir hors saison, puis devient souvent saisonnière en remplaçant le virus précédent du même type.</p><div class="key"><b>Limite.</b> La plupart des infections humaines par un virus aviaire restent des impasses, faute de transmission interhumaine soutenue.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://cdn.who.int/media/docs/default-source/influenza/h5n1-human-case-cumulative-table/2026_table_h5n1_march.pdf" target="_blank" rel="noopener">OMS, cas humains cumulés de grippe A(H5N1), état au 31.03.2026</a>.</p></template>
<template data-pop="j09-codage" data-title="Trois pièges de codage de la grippe"><p class="lab">Mécanisme de l’affirmation</p><p><i>Haemophilus influenzae</i> est une bactérie : ses infections sont exclues des catégories J09 à J11. Le rhume, infection aiguë des voies respiratoires supérieures sans grippe, est exclu de J11. Pour un virus pandémique devenu saisonnier, la CIM-10-GM renvoie aux règles du programme mondial de lutte contre la grippe de l’OMS : A(H1N1)pdm09 se code aujourd’hui comme saisonnier.</p><p class="lab">Conséquence clinique</p><p>J09 n’a pas de subdivision : une pneumonie ou une autre manifestation s’y ajoute par un code supplémentaire.</p><div class="key"><b>Limite.</b> Le code ne remplace pas la déclaration : un virus zoonotique suspecté se déclare à l’autorité sanitaire.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j09-j18.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc J09 à J18, version allemande officielle</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j09-sentinella" data-title="Réseau Sentinella et définition du syndrome grippal"><p class="lab">Fonction et cible</p><p>Ce réseau de généralistes, internistes et pédiatres volontaires estime l’activité grippale, car la plupart des patients peu malades ne sont jamais testés.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le syndrome grippal y est défini par une forte fièvre soudaine de plus de 38 °C avec toux ou maux de gorge, éventuellement avec malaise marqué, faiblesse, douleurs musculaires ou articulaires, céphalées ou symptômes digestifs. Le Centre national de référence, aux Hôpitaux universitaires de Genève, analyse les frottis par PCR multiplex.</p><p class="lab">Conséquence clinique</p><p>L’OFSP extrapole ces déclarations à la population dans un bulletin hebdomadaire, qui renseigne la probabilité avant test.</p><div class="key"><b>Limite.</b> L’échantillon est petit, et l’OFSP invite à la prudence. D’autres virus remplissent la définition.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-seuil" data-title="Seuil épidémique : ancienne et nouvelle méthode"><p class="lab">Mécanisme de l’affirmation</p><p>Jusqu’en 2019/2020, l’OFSP fixait avant chaque saison un seuil de consultations calculé sur les saisons précédentes ; la pandémie de COVID-19 ayant bouleversé consultations et circulation virale, il y a renoncé dès 2020/2021. En 2023/2024, la positivité des frottis Sentinella a culminé à 46,2 % la cinquième semaine.</p><p class="lab">Conséquence clinique</p><p>La positivité dit directement quelle part des syndromes grippaux est due à la grippe : à 40 %, un sur deux à trois est une grippe.</p><div class="key"><b>Limite.</b> Elle dépend de la sélection des patients prélevés, et certains cantons emploient leurs propres seuils.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/bag/fr/dokumente/mt/infektionskrankheiten/grippe/saisonbericht-grippe-2021-22.pdf.download.pdf/saisonbericht-grippe-2021-22_FR.pdf" target="_blank" rel="noopener">OFSP, Rapport sur la saison grippale 2021/2022</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-age" data-title="Incidence et gravité selon l’âge"><p class="lab">Mécanisme de l’affirmation</p><p>Sans immunité antérieure, les jeunes enfants s’infectent plus souvent et excrètent plus longtemps : en 2023/2024, les consultations Sentinella étaient les plus fréquentes chez les 0 à 4 ans et les plus rares chez les 65 ans et plus. Chez ces derniers, l’immunosénescence et les comorbidités aggravent la maladie : une pneumonie compliquait 8,6 % de leurs consultations, contre 3,4 % de l’ensemble.</p><p class="lab">Conséquence clinique</p><p>Vaccin et antiviral visent d’abord les personnes âgées. Vacciner l’entourage des nourrissons de moins de six mois, non vaccinables, les protège indirectement.</p><div class="key"><b>Limite.</b> Cette saison était dominée par A(H1N1)pdm09 ; les saisons à A(H3N2) pèsent souvent davantage sur les personnes âgées.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-fardeau" data-title="Hospitalisations et décès dus à la grippe en Suisse"><p class="lab">Mécanisme de l’affirmation</p><p>Ces chiffres, qui fondent la stratégie nationale de prévention, sont des estimations : beaucoup de décès surviennent par décompensation cardiaque ou pulmonaire chez des patients jamais testés et sont attribués à une autre cause.</p><p class="lab">Conséquence clinique</p><p>Pour une personne âgée, la grippe n’est pas une maladie anodine ; cet argument soutient la vaccination.</p><div class="key"><b>Limite.</b> Les six hôpitaux de surveillance ne représentent pas tous les hôpitaux suisses, et ce système a été suspendu fin août 2024 ; les données récentes figurent sur le portail de l’OFSP.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/fr/strategie-nationale-de-prevention-de-la-grippe-grips" target="_blank" rel="noopener">OFSP, Stratégie nationale de prévention de la grippe, publiée le 06.01.2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a>.</p></template>
<template data-pop="j09-ha" data-title="Hémagglutinine et acide sialique"><p class="lab">Mécanisme de l’affirmation</p><p>Les virus humains se lient à l’acide sialique en liaison alpha 2,6, abondante dans les voies aériennes supérieures ; les virus aviaires préfèrent la liaison alpha 2,3, présente chez l’être humain surtout dans les bronchioles et les alvéoles. L’hémagglutinine doit aussi être clivée par des protéases de l’hôte : seules celles de l’épithélium respiratoire clivent les virus saisonniers, alors que le site multibasique de certains virus aviaires hautement pathogènes, dont A(H5N1), est clivé dans de nombreux tissus.</p><p class="lab">Conséquence clinique</p><p>Un virus aviaire se fixe mal au nez et à la gorge, donc se transmet mal ; parvenu aux alvéoles, il provoque une pneumonie grave. Les infections humaines par A(H5N1) sont donc rares mais graves.</p><div class="key"><b>Limite.</b> Quelques mutations suffisent à déplacer la préférence vers la liaison alpha 2,6 ; la surveillance génétique des virus aviaires les recherche.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a>.</p></template>
<template data-pop="j09-cycle" data-title="Endocytose, polymérase virale et vol de coiffe"><p class="lab">Mécanisme de l’affirmation</p><p>Le canal à protons de la protéine de matrice 2 acidifie le virion et libère ses ribonucléoprotéines ; l’acidité change aussi la forme de l’hémagglutinine, qui fusionne l’enveloppe avec la membrane. Dans le noyau, l’endonucléase d’une des trois sous-unités de la polymérase arrache l’extrémité coiffée des ARN messagers cellulaires et s’en sert d’amorce.</p><p class="lab">Conséquence clinique</p><p>Le baloxavir marboxil inhibe cette endonucléase et réduit vite la charge virale. L’amantadine bloquait le canal de la protéine de matrice 2, mais la résistance quasi générale des virus actuels l’a rendue inutilisable.</p><div class="key"><b>Limite.</b> Une mutation de l’endonucléase réduit la sensibilité au baloxavir, surtout chez l’enfant et l’immunodéprimé ; l’onglet Pharmacologie la détaille.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-na" data-title="Neuraminidase et libération des virions"><p class="lab">Mécanisme de l’affirmation</p><p>Sans neuraminidase, l’hémagglutinine retiendrait les virions bourgeonnants à la surface cellulaire et les agrégerait. L’enzyme découpe aussi les mucines sialylées qui piégeraient le virus avant l’épithélium, et elle dévoile des récepteurs pour le pneumocoque.</p><p class="lab">Conséquence clinique</p><p>L’oseltamivir et le zanamivir retiennent les virions sur la cellule infectée et ralentissent la propagation. Ils n’agissent pas sur les cellules déjà infectées : leur bénéfice est maximal tôt, pendant la réplication active.</p><div class="key"><b>Limite.</b> Des mutations de la neuraminidase confèrent une résistance ; le Centre national de référence la recherche sur un échantillon de virus suisses.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a>.</p></template>
<template data-pop="j09-ifn" data-title="Interférons et protéine non structurale 1"><p class="lab">Fonction et cible</p><p>Les interférons de type I et III forment la première défense antivirale, dans les heures qui suivent l’infection.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des senseurs cytosoliques reconnaissent des motifs de l’ARN viral absents des ARN cellulaires et déclenchent la sécrétion d’interférons, qui induisent un état antiviral dans les cellules voisines. La protéine non structurale 1 du virus inhibe ces senseurs et la synthèse des interférons.</p><p class="lab">Conséquence clinique</p><p>Une réponse rapide confine la réplication aux bronches ; une réponse retardée laisse monter la charge virale, puis s’accompagne d’une inflammation excessive.</p><div class="key"><b>Limite.</b> La même réponse altère le recrutement des polynucléaires et des macrophages contre les bactéries : elle favorise la surinfection.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a>.</p></template>
<template data-pop="j09-cytokines" data-title="Des cytokines aux symptômes généraux"><p class="lab">Mécanisme de l’affirmation</p><p>Chez 19 volontaires infectés par A(H1N1), l’IL-6 et l’interféron alpha des sécrétions nasales évoluaient avec la charge virale, la température, la production de mucus et les symptômes ; le TNF s’élevait aux troisième et quatrième jours. Ces cytokines élèvent par la PGE₂ le point de consigne thermique de l’hypothalamus : le patient frissonne jusqu’à l’atteindre.</p><p class="lab">Conséquence clinique</p><p>Le paracétamol réduit la PGE₂ et soulage la fièvre et les courbatures sans agir sur le virus. Les signes généraux du deuxième jour coïncident avec le pic de réplication et de contagiosité.</p><div class="key"><b>Limite.</b> Ces adultes jeunes infectés expérimentalement ne représentent pas la personne âgée, chez qui la fièvre peut manquer.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-adaptatif" data-title="Anticorps et lymphocytes T dans la grippe"><p class="lab">Mécanisme de l’affirmation</p><p>Les anticorps contre la tête de l’hémagglutinine empêchent l’attachement ; les IgA sécrétoires protègent la muqueuse ; les anticorps contre la neuraminidase limitent la diffusion. Les lymphocytes T CD8 reconnaissent les protéines internes, plus stables d’une souche à l’autre, et détruisent les cellules infectées ; la mémoire accélère cette réponse chez le sujet déjà exposé.</p><p class="lab">Conséquence clinique</p><p>Les anticorps fondent la protection vaccinale, qui dépend de la concordance des souches. Les lymphocytes T expliquent qu’une exposition antérieure atténue la gravité sans empêcher l’infection.</p><div class="key"><b>Limite.</b> La dérive contourne les anticorps spécifiques de souche, et un déficit cellulaire, après une greffe par exemple, prolonge l’excrétion.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-dad" data-title="Pneumonie virale primaire et dommage alvéolaire diffus"><p class="lab">Fonction et cible</p><p>Cette atteinte alvéolaire due au virus seul survient en général dans les trois à cinq premiers jours.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus infecte les pneumocytes et l’endothélium capillaire ; un exsudat protéique franchit la barrière alvéolo-capillaire, et la fibrine forme des membranes hyalines. Les alvéoles perfusées mais non ventilées créent un effet shunt, que l’oxygène corrige mal.</p><p class="lab">Conséquence clinique</p><p>Le patient présente une dyspnée croissante, une tachypnée et une hypoxémie, souvent avec des opacités bilatérales. Le SDRA peut exiger une ventilation mécanique, voire une oxygénation par membrane extracorporelle.</p><div class="key"><b>Limite.</b> Pneumonie virale et surinfection bactérienne peuvent coexister sans que l’imagerie les sépare, d’où la microbiologie de l’onglet Examens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, Nature Reviews Disease Primers, 2018</a>.</p></template>
<template data-pop="j09-surinfection" data-title="Synergie entre virus influenza et bactéries"><p class="lab">Mécanisme de l’affirmation</p><p>L’épithélium détruit expose la membrane basale, où les bactéries adhèrent ; la neuraminidase dévoile des récepteurs bactériens ; les interférons et la mort des macrophages alvéolaires réduisent la clairance bactérienne. L’analyse de 58 autopsies de 1918 et de 109 séries publiées attribue la majorité des décès de cette pandémie à une pneumonie bactérienne secondaire.</p><p class="lab">Conséquence clinique</p><p>La surinfection se manifeste par une aggravation après amélioration, du quatrième au quatorzième jour environ. Ce mécanisme fonde la vaccination antipneumococcique des groupes à risque et un antibiotique ciblé en cas de surinfection documentée ou probable.</p><div class="key"><b>Limite.</b> La plupart des grippes ne se surinfectent pas : un antibiotique systématique dans une grippe simple expose aux effets indésirables et aux résistances sans bénéfice.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., causes de décès de la pandémie de 1918, 2008</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j09-voies" data-title="Gouttelettes, aérosols et contact"><p class="lab">Fonction et cible</p><p>Les grosses particules tombent en un à deux mètres ; les fines restent en suspension dans un local mal ventilé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Selon le CDC, le virus se transmet surtout par les gouttelettes, moins souvent par une surface contaminée portée à la bouche, au nez ou aux yeux. La part des particules fines reste discutée.</p><p class="lab">Conséquence clinique</p><p>Les mesures découlent des voies : masque chirurgical, distance, aération, hygiène des mains, nettoyage des surfaces. Lors des gestes générant des aérosols, comme l’intubation, le soignant porte un appareil de protection respiratoire filtrant.</p><div class="key"><b>Limite.</b> Aucune mesure isolée ne suffit, d’autant que la transmission commence avant les symptômes.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/spread/index.html" target="_blank" rel="noopener">CDC, How flu spreads, mise à jour du 17.09.2024</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-incubation" data-title="Incubation et cinétique de l’excrétion virale"><p class="lab">Mécanisme de l’affirmation</p><p>L’OFSP retient une incubation de un à trois jours, le CDC de un à quatre. Chez les volontaires inoculés, l’excrétion augmentait nettement entre 12 et 24 heures, culminait au deuxième jour et durait en moyenne 4,8 jours.</p><p class="lab">Conséquence clinique</p><p>Le malade limite ses contacts les premiers jours, surtout avec des personnes à risque, et un soignant malade ne soigne pas de patients. Un contact malade dans les quatre jours suivant l’exposition a probablement été infecté par ce cas.</p><div class="key"><b>Limite.</b> Ces données de volontaires jeunes ne s’appliquent pas directement à la personne âgée.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/spread/index.html" target="_blank" rel="noopener">CDC, How flu spreads, mise à jour du 17.09.2024</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), consultée le 08.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a>.</p></template>
<template data-pop="j09-asympto" data-title="Infections asymptomatiques et peu symptomatiques"><p class="lab">Mécanisme de l’affirmation</p><p>Dans une étude de contacts familiaux à Hong Kong, sur 235 infections secondaires, 11 % étaient asymptomatiques et 13 % ne donnaient qu’un symptôme. Ces patients excrétaient l’ARN viral moins longtemps et en quantité inférieure de 1 à 2 logarithmes décimaux.</p><p class="lab">Conséquence clinique</p><p>Une personne à peine malade peut infecter un patient fragile : vaccination du personnel, masque en période épidémique et hygiène des mains protègent mieux qu’un tri sur les symptômes.</p><div class="key"><b>Limite.</b> L’ARN détecté ne prouve pas la présence de virus infectieux ; la part de ces formes dans la transmission reste incertaine.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28011603/" target="_blank" rel="noopener">Ip et al., excrétion virale des infections peu symptomatiques, 2017</a>.</p></template>
<template data-pop="j09-risque" data-title="Personnes à risque accru de complications selon l’OFSP"><p class="lab">Mécanisme de l’affirmation</p><p>La liste comprend les personnes de 65 ans et plus, les femmes enceintes ou ayant accouché depuis moins de quatre semaines, et les prématurés nés avant 32 semaines ou pesant moins de 1500 g, pendant leurs deux premiers hivers dès six mois. Dès six mois s’y ajoutent les maladies cardiaques, pulmonaires, neurologiques, musculosquelettiques ou hépatiques, les maladies métaboliques retentissant sur le cœur, le poumon ou le rein (diabète, obésité morbide), l’insuffisance rénale, l’asplénie, les hémoglobinopathies, les immunodéficiences et la résidence en établissement de soins.</p><p class="lab">Conséquence clinique</p><p>Pour ces personnes, la vaccination est prise en charge par l’assurance obligatoire des soins, sous réserve de la franchise, et un antiviral précoce se discute. Dès 75 ans, ou dès 65 ans avec un facteur de risque supplémentaire, l’OFSP privilégie un vaccin à dose élevée.</p><div class="key"><b>Limite.</b> Conçue pour la vaccination, la liste ne remplace pas l’évaluation clinique : un patient sans facteur de risque peut faire une forme grave.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-grossesse-risque" data-title="Pourquoi la grossesse aggrave la grippe"><p class="lab">Mécanisme de l’affirmation</p><p>L’utérus refoule le diaphragme et réduit la capacité résiduelle fonctionnelle, réserve d’oxygène des poumons ; la consommation d’oxygène et le débit cardiaque augmentent ; l’immunité s’adapte pour tolérer le fœtus. Une hypoxémie maternelle réduit en outre l’oxygénation fœtale.</p><p class="lab">Conséquence clinique</p><p>Aux États-Unis, d’avril à août 2009, 30 des 788 femmes enceintes rapportées sont décédées, soit 5 % des décès pandémiques de la période ; 64,3 % des 56 décès de femmes enceintes admises aux soins intensifs jusqu’à fin 2009 survenaient au troisième trimestre. Un traitement débuté après le quatrième jour s’associait à plus d’admissions aux soins intensifs qu’un traitement dans les deux jours. L’OFSP recommande la vaccination pendant toute la grossesse et les quatre semaines suivant l’accouchement.</p><div class="key"><b>Limite.</b> Ces données observationnelles portent sur un virus pandémique et une surveillance américaine.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20407061/" target="_blank" rel="noopener">Siston et al., grippe pandémique et grossesse, 2010</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-oms-risque" data-title="Définitions du haut risque : OFSP, OMS et IDSA"><p class="lab">Fonction et cible</p><p>L’OFSP définit le risque pour la vaccination, l’OMS et l’IDSA pour le traitement antiviral.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’OMS (lignes directrices du 12 septembre 2024) classe à haut risque de forme grave les personnes de 65 ans et plus ou porteuses d’au moins un facteur de risque majeur, et réserve la prophylaxie après exposition aux personnes à très haut risque. L’IDSA (2019) utilise une liste proche de celle de l’OFSP, en ajoutant notamment les enfants de moins de cinq ans et les personnes d’origine autochtone américaine.</p><p class="lab">Conséquence clinique</p><p>Le médecin repère le risque avec la liste de l’OFSP et fonde l’indication antivirale sur la recommandation la plus récente, celle de l’OMS, détaillée dans l’onglet Pharmacologie. Le texte de l’IDSA de 2019 reste accessible et concorde pour le patient hospitalisé.</p><div class="key"><b>Limite.</b> Les listes ne se superposent pas exactement, et les recommandations de l’OMS sont conditionnelles, fondées sur des preuves de certitude variable.</div><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-debut" data-title="Début brutal"><p class="lab">Mécanisme de l’affirmation</p><p>La charge virale et les cytokines culminent dès le deuxième jour : les signes généraux et respiratoires apparaissent ensemble, sans phase prodromique prolongée.</p><p class="lab">Conséquence clinique</p><p>Ce trait distingue la grippe du rhume, qui s’installe progressivement avec une rhinorrhée au premier plan. L’heure de début sert aussi à calculer le délai de 48 heures.</p><div class="key"><b>Limite.</b> Une infection à SARS-CoV-2, une pneumonie à pneumocoque ou une méningite peuvent débuter de la même façon ; chez la personne âgée, le début peut être insidieux.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a>.</p></template>
<template data-pop="j09-fievre" data-title="Fièvre de la grippe"><p class="lab">Mécanisme de l’affirmation</p><p>Les cytokines élèvent par la PGE₂ le point de consigne hypothalamique ; les frissons produisent la chaleur nécessaire pour l’atteindre.</p><p class="lab">Conséquence clinique</p><p>Dans l’analyse de Monto, la fièvre était présente dans 68 % des grippes confirmées et 40 % des syndromes grippaux d’autre cause. Sa réapparition après une défervescence évoque une surinfection bactérienne.</p><div class="key"><b>Limite.</b> Chez les volontaires inoculés, la fièvre n’apparaissait que dans 37 % des infections A(H1N1), 40,6 % des A(H3N2) et 7,5 % des infections B. Son absence n’exclut donc pas une grippe, surtout chez la personne âgée, l’immunodéprimé ou après un antipyrétique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-myalgies" data-title="Courbatures et fatigue"><p class="lab">Mécanisme de l’affirmation</p><p>Les cytokines circulantes, IL-6 et interférons surtout, agissent sur le muscle et le système nerveux central ; leur intensité suit le pic de réplication. Le muscle est rarement infecté chez l’adulte.</p><p class="lab">Conséquence clinique</p><p>Des courbatures intenses du dos et des membres orientent vers une grippe plutôt qu’un rhume. Une douleur très forte à la pression, des urines foncées ou une faiblesse font rechercher une myosite ou une rhabdomyolyse.</p><div class="key"><b>Limite.</b> La fatigue peut durer plus de deux semaines, surtout chez la personne âgée, sans traduire une complication ni justifier seule des examens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-cephalees" data-title="Céphalées de la grippe"><p class="lab">Fonction et cible</p><p>Les céphalées accompagnent la fièvre, parfois avec une douleur à la mobilisation des yeux, et cèdent en général avec la défervescence.</p><p class="lab">Conséquence clinique</p><p>Une céphalée fébrile banale ne demande pas d’examen. Une raideur de nuque, une confusion, une somnolence, des convulsions ou un déficit neurologique font rechercher en urgence une méningite bactérienne ou une encéphalite.</p><div class="key"><b>Limite.</b> La grippe n’exclut pas une autre infection : le CDC signale des infections invasives à méningocoque après une grippe.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-toux" data-title="Toux sèche, douleur rétrosternale et mal de gorge"><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium trachéobronchique ; les terminaisons nerveuses mises à nu déclenchent la toux et la brûlure. La réparation prend plusieurs semaines, d’où une toux souvent prolongée.</p><p class="lab">Conséquence clinique</p><p>Une toux prolongée sans fièvre ni dyspnée est attendue et ne justifie pas d’antibiotique ; devenue productive avec fièvre et dyspnée, elle fait rechercher une pneumonie.</p><div class="key"><b>Limite.</b> La toux est sensible mais peu spécifique : elle était présente dans 93 % des grippes confirmées et dans 80 % des syndromes grippaux d’autre cause.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-atypique-age" data-title="Grippe de la personne âgée fragile"><p class="lab">Mécanisme de l’affirmation</p><p>L’immunosénescence atténue la réponse cytokinique, donc la fièvre. Avec une réserve cérébrale et fonctionnelle réduite, toute infection se traduit par une confusion, une chute, un refus alimentaire ou une perte d’autonomie, que le CDC signale chez les résidents âgés.</p><p class="lab">Conséquence clinique</p><p>En période épidémique, un changement brutal de l’état d’un résident fait tester la grippe, surtout si d’autres résidents ou soignants toussent. Une confirmation précoce permet l’antiviral et le contrôle de la flambée.</p><div class="key"><b>Limite.</b> Ces signes imposent aussi de rechercher une autre infection, une déshydratation ou un effet médicamenteux.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j09-decompensation" data-title="Grippe révélée par une décompensation chronique"><p class="lab">Mécanisme de l’affirmation</p><p>Chez l’asthmatique et le patient atteint de BPCO, le virus déclenche un bronchospasme ; chez le diabétique, le stress inflammatoire élève la glycémie. Le risque d’hospitalisation pour infarctus était multiplié par 6,05 dans les sept jours suivant une grippe confirmée, sans excès au-delà.</p><p class="lab">Conséquence clinique</p><p>Devant une insuffisance cardiaque décompensée, une exacerbation de BPCO ou un déséquilibre diabétique en hiver, le médecin recherche une grippe ; chez l’hospitalisé, sa confirmation peut justifier un antiviral quel que soit le délai.</p><div class="key"><b>Limite.</b> L’étude de Kwong, série de cas autocontrôlée, montre une association temporelle forte, non une causalité démontrée par un essai.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus du myocarde après grippe confirmée, 2018</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j09-delai" data-title="Délai depuis le début des symptômes"><p class="lab">Mécanisme de l’affirmation</p><p>Les antiviraux freinent une réplication qui culmine aux premier et deuxième jours ; leur bénéfice sur la durée des symptômes a été démontré chez des patients traités dans les 48 heures. Chez l’hospitalisé ou le malade grave, la réplication persiste, et l’IDSA recommande l’antiviral quel que soit le délai.</p><p class="lab">Conséquence clinique</p><p>En ambulatoire, le médecin discute l’antiviral chez le patient à risque vu tôt ; chez l’hospitalisé, il ne le retarde pas pour un délai dépassé.</p><div class="key"><b>Limite.</b> Le délai de 48 heures est un repère tiré des essais, non une limite biologique ; la Prise en charge et l’onglet Pharmacologie précisent les indications.</div><p class="src">Références : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j09-contage" data-title="Contacts et activité grippale régionale"><p class="lab">Mécanisme de l’affirmation</p><p>La valeur prédictive positive d’un tableau clinique augmente avec la fréquence de la maladie : en 2023/2024, près de la moitié des frottis Sentinella étaient positifs au pic, contre très peu hors saison. Un contact familial malade renforce encore la probabilité.</p><p class="lab">Conséquence clinique</p><p>En pleine épidémie, un diagnostic clinique suffit chez le patient sans risque ; hors saison, le médecin teste plus volontiers et recherche d’autres causes.</p><div class="key"><b>Limite.</b> Le SARS-CoV-2 et le VRS circulent en même temps, et des co-infections existent.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a>.</p></template>
<template data-pop="j09-vaccin-statut" data-title="Statut vaccinal de la saison"><p class="lab">Mécanisme de l’affirmation</p><p>Le vaccin induit des anticorps contre l’hémagglutinine des souches choisies. La protection apparaît environ deux semaines après l’injection, dépend de la concordance avec les virus circulants et réduit le risque d’infection et de forme grave sans l’annuler.</p><p class="lab">Conséquence clinique</p><p>Un patient vacciné peut avoir une grippe, et la vaccination ne retire pas l’indication d’un antiviral chez un patient à risque. En 2023/2024, seuls 9,1 % des patients consultant pour syndrome grippal ou infection respiratoire aiguë étaient vaccinés, et 15,2 % des 65 ans et plus : chaque consultation est une occasion de proposer le vaccin.</p><div class="key"><b>Limite.</b> L’efficacité vaccinale varie selon la saison, l’âge et le sous-type.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-expo-animale" data-title="Exposition animale et suspicion de grippe zoonotique"><p class="lab">Mécanisme de l’affirmation</p><p>Les virus aviaires, comme A(H5N1), ou d’origine porcine se transmettent surtout par contact rapproché avec des animaux malades ou morts, leurs sécrétions ou un environnement contaminé. Le CDC retient une exposition dans les dix jours précédant les symptômes pour définir les cas à investiguer.</p><p class="lab">Conséquence clinique</p><p>Une fièvre ou une conjonctivite après un tel contact impose des précautions respiratoires, un prélèvement adressé au laboratoire de référence et une déclaration à l’autorité sanitaire, détaillés dans les Situations particulières.</p><div class="key"><b>Limite.</b> Un test rapide de grippe A ne distingue pas un virus aviaire d’un virus saisonnier.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/influenza/h5n1-human-case-cumulative-table/2026_table_h5n1_march.pdf" target="_blank" rel="noopener">OMS, cas humains cumulés de grippe A(H5N1), état au 31.03.2026</a> ; <a href="https://archive.cdc.gov/www_cdc_gov/bird-flu/hcp/case-definition/index.html" target="_blank" rel="noopener">CDC, définitions de cas des infections humaines par virus aviaires, version archivée</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a>.</p></template>
<template data-pop="j09-aspirine" data-title="Acide acétylsalicylique et syndrome de Reye"><p class="lab">Fonction et cible</p><p>Le syndrome de Reye associe une encéphalopathie aiguë et une stéatose hépatique microvésiculaire, chez l’enfant et l’adolescent, après une grippe ou une varicelle surtout.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des études épidémiologiques l’ont associé à la prise d’acide acétylsalicylique pendant l’infection ; un trouble de la fonction mitochondriale est en cause. Il est devenu rare depuis que ce médicament est évité chez l’enfant fébrile.</p><p class="lab">Conséquence clinique</p><p>Le médecin traite la fièvre de l’enfant grippé par le paracétamol ou l’ibuprofène et vérifie qu’un adulte ne lui donne pas ses propres médicaments.</p><div class="key"><b>Limite.</b> Chez l’enfant sous acide acétylsalicylique au long cours pour une indication précise, la vaccination antigrippale est particulièrement recommandée ; la décision relève du spécialiste.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-biphasique" data-title="Évolution en deux temps"><p class="lab">Mécanisme de l’affirmation</p><p>La grippe simple s’améliore à partir du troisième au cinquième jour. Une nouvelle aggravation, avec retour de la fièvre, toux productive, dyspnée ou douleur thoracique, traduit alors le plus souvent une surinfection par le pneumocoque, le staphylocoque doré ou le streptocoque du groupe A.</p><p class="lab">Conséquence clinique</p><p>Ce récit impose un examen rapide, la recherche d’un foyer et d’une hypoxémie, une imagerie thoracique et la discussion d’un antibiotique. Le staphylocoque doré peut causer chez l’adulte jeune une pneumonie nécrosante rapidement grave.</p><div class="key"><b>Limite.</b> Une pneumonie virale progressive, une myocardite, une embolie pulmonaire ou une décompensation chronique peuvent aussi expliquer l’aggravation.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne après grippe, 2014</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a>.</p></template>
<template data-pop="j09-v-fr" data-title="Fréquence respiratoire"><p class="lab">Fonction et cible</p><p>Le médecin la compte sur une minute entière, sans prévenir le patient, qui modifie sa respiration s’il se sait observé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une acidose métabolique ou une baisse de la compliance pulmonaire stimulent les centres respiratoires ; l’hyperventilation compense d’abord le défaut d’oxygénation, si bien que la fréquence monte avant que la saturation ne baisse.</p><p class="lab">Conséquence clinique</p><p>Selon la Société suisse d’infectiologie, une fréquence d’au moins 22 par minute augmente la probabilité d’une pneumonie, et une fréquence de 30 par minute ou plus est un signal d’alarme compté dans le score CRB-65.</p><div class="key"><b>Limite.</b> La fièvre et l’anxiété l’élèvent aussi ; une fréquence normale sous oxygène n’exclut pas un épuisement débutant.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j09-v-spo" data-title="Saturation pulsée en oxygène"><p class="lab">Fonction et cible</p><p>La mesure se fait en air ambiant, avec un signal de pouls stable, sur un doigt bien perfusé et sans vernis.</p><p class="lab">Mécanisme de l’affirmation</p><p>Dans une pneumonie virale, le sang qui traverse des alvéoles perfusées mais non ventilées reste désaturé et abaisse la saturation du mélange artériel.</p><p class="lab">Conséquence clinique</p><p>Selon la Société suisse d’infectiologie, une saturation inférieure à 90 % fait envisager l’hospitalisation quel que soit le score. Chez le patient atteint de BPCO, la valeur se compare à sa saturation habituelle.</p><div class="key"><b>Limite.</b> Une mauvaise perfusion périphérique fausse la mesure, et le monoxyde de carbone la surestime. Sous oxygène, une saturation correcte peut masquer une aggravation, que révèlent la fréquence respiratoire et la gazométrie.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j09-v-pa" data-title="Pression artérielle et perfusion"><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre, la transpiration et des apports réduits diminuent le volume circulant ; un sepsis provoque une vasodilatation ; une myocardite réduit le débit cardiaque. Les marbrures, un temps de recoloration prolongé et une baisse de la diurèse signalent une perfusion insuffisante.</p><p class="lab">Conséquence clinique</p><p>Une systolique inférieure à 90 mmHg ou une diastolique d’au plus 60 mmHg donne un point du CRB-65. Une hypotension orthostatique chez un patient qui boit peu traduit une déshydratation.</p><div class="key"><b>Limite.</b> Chez l’hypertendu, une pression encore normale peut cacher un choc débutant : le médecin la compare à la valeur habituelle et répète la mesure.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j09-v-fc" data-title="Fréquence cardiaque"><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre accélère le métabolisme et la fréquence cardiaque ; la déshydratation et l’hypoxémie l’accélèrent davantage. Une myocardite grippale provoque une tachycardie disproportionnée, des troubles du rythme ou une insuffisance cardiaque.</p><p class="lab">Conséquence clinique</p><p>Une tachycardie qui persiste après la défervescence, une douleur thoracique, une dyspnée ou un pouls irrégulier font demander un électrocardiogramme et un dosage de troponine.</p><div class="key"><b>Limite.</b> Un bêtabloquant masque la tachycardie : une fréquence normale n’exclut alors ni une myocardite ni un sepsis.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus du myocarde après grippe confirmée, 2018</a>.</p></template>
<template data-pop="j09-conscience" data-title="État de conscience et confusion"><p class="lab">Fonction et cible</p><p>La confusion, altération aiguë de l’attention et de la conscience, se recherche par l’orientation, l’attention et la cohérence du discours.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une hypotension, une fièvre élevée, une déshydratation ou une hyponatrémie perturbent le fonctionnement cérébral, surtout chez la personne âgée. Plus rarement, la grippe provoque une encéphalite ou une encéphalopathie.</p><p class="lab">Conséquence clinique</p><p>Une confusion nouvelle compte dans le score CRB-65. Elle fait rechercher une hypoxémie, un trouble métabolique, un sepsis et, avec une raideur de nuque ou des convulsions, une infection du système nerveux central.</p><div class="key"><b>Limite.</b> Chez un patient dément, le médecin compare à l’état habituel décrit par l’entourage ou les soignants.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-ausc" data-title="Auscultation pulmonaire dans la grippe"><p class="lab">Mécanisme de l’affirmation</p><p>L’atteinte trachéobronchique de la grippe simple produit au plus des ronchi diffus, modifiés par la toux. Un exsudat alvéolaire produit des crépitants ; une condensation transmet mieux les vibrations vocales et peut produire un souffle.</p><p class="lab">Conséquence clinique</p><p>Des crépitants localisés ou bilatéraux justifient une imagerie. Des sibilants diffus chez un asthmatique traduisent un bronchospasme induit par le virus.</p><div class="key"><b>Limite.</b> Une auscultation normale n’exclut pas une pneumonie virale débutante chez un patient hypoxémique : la saturation et la fréquence respiratoire restent indispensables.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a>.</p></template>
<template data-pop="j09-deshydratation" data-title="Déshydratation au cours de la grippe"><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre et la tachypnée augmentent les pertes insensibles ; l’anorexie, les nausées et la fatigue réduisent les apports, et la personne âgée ressent moins la soif. La baisse du volume circulant provoque une tachycardie, une hypotension orthostatique, une sécheresse des muqueuses et une baisse de la diurèse.</p><p class="lab">Conséquence clinique</p><p>Fréquente chez la personne âgée et le jeune enfant, elle figure pour le CDC parmi les complications de la grippe à tout âge. Une incapacité à boire motive l’hospitalisation d’un patient fragile.</p><div class="key"><b>Limite.</b> Les signes cutanés sont peu fiables chez la personne âgée ; à l’hôpital, la créatinine recherche une insuffisance rénale fonctionnelle.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a>.</p></template>
<template data-pop="j09-alarme" data-title="Signes de gravité d’une grippe"><p class="lab">Mécanisme de l’affirmation</p><p>Une dyspnée, une fréquence respiratoire de 30 par minute ou plus et une saturation inférieure à 92 % traduisent une atteinte alvéolaire. Une systolique inférieure à 90 mmHg, des marbrures, une oligurie ou une douleur thoracique traduisent un sepsis, une déshydratation ou une atteinte cardiaque. Une confusion, des convulsions ou un déficit traduisent une hypoxémie, un trouble métabolique ou une atteinte neurologique. L’évolution en deux temps traduit une surinfection.</p><p class="lab">Conséquence clinique</p><p>Un seul signe justifie une évaluation hospitalière, des examens et un antiviral sans attendre, quel que soit le délai ; chez le patient à risque, le seuil d’hospitalisation est plus bas.</p><div class="key"><b>Limite.</b> Ces signes ne sont pas propres à la grippe, et leur absence n’exclut pas une aggravation ultérieure : le médecin donne des consignes de reconsultation.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA sur la grippe saisonnière, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="pareto-j09-bases" data-title="Pareto — Virus, mécanismes et clinique de la grippe"><p class="ratio" data-cover="j09-0,j09-1,j09-2,j09-3,j09-4,j09-5,j09-6"></p><ul><li>La grippe est due aux virus influenza A ou B. La dérive explique les épidémies annuelles et la révision du vaccin ; la cassure par réassortiment peut provoquer une pandémie.</li><li>J09 désigne un virus zoonotique ou pandémique, J10 un virus saisonnier confirmé, J11 une grippe sans identification. <i>Haemophilus influenzae</i> est une bactérie, sans rapport avec ces codes.</li><li>En Suisse, l’épidémie culmine le plus souvent entre fin décembre et février. Les enfants s’infectent le plus ; les personnes âgées concentrent hospitalisations et décès.</li><li>L’hémagglutinine fixe le virus à l’acide sialique et la neuraminidase libère les virions. Le baloxavir bloque le vol de coiffe ; l’oseltamivir bloque la neuraminidase.</li><li>Les cytokines produisent la fièvre et les courbatures. L’atteinte alvéolaire donne une pneumonie virale hypoxémiante ; l’épithélium lésé favorise la surinfection à pneumocoque et à staphylocoque doré.</li><li>L’incubation dure un à quatre jours. La contagiosité commence la veille des symptômes et culmine les trois premiers jours.</li><li>Sont à risque les personnes de 65 ans et plus, les femmes enceintes ou récemment accouchées, les malades chroniques, les immunodéprimés et les résidents d’établissements de soins.</li><li>Le récit typique associe un début brutal, une fièvre élevée, des courbatures et une toux sèche. Le médecin date le début, établit le terrain et recherche une exposition animale ; chez la personne âgée, la fièvre peut manquer.</li><li>Une fréquence respiratoire de 30 par minute ou plus, une saturation inférieure à 92 %, une systolique inférieure à 90 mmHg, une confusion ou une aggravation en deux temps imposent une évaluation hospitalière.</li></ul></template>
