<template data-pop="j09-diag-clinique" data-title="Diagnostic clinique de la grippe et circulation virale"><p class="lab">Fonction et cible</p><p>Le diagnostic clinique estime la probabilité de grippe à partir des symptômes et du contexte épidémique, sans test.</p><p class="lab">Mécanisme de l’affirmation</p><p>La valeur prédictive positive d’un signe augmente avec la fréquence de la maladie dans la population examinée. Dans les essais d’antiviraux menés en saison, la fièvre associée à une toux apparue depuis moins de 48 heures prédisait une grippe confirmée dans 79 % des cas (Monto, 2000).</p><p class="lab">Conséquence clinique</p><p>En saison, l’adulte à risque qui présente ce tableau peut recevoir un antiviral sans confirmation. Hors saison, le même tableau impose un test.</p><div class="key"><b>Limite.</b> La fièvre manque souvent chez le sujet âgé, et la co-circulation du SARS-CoV-2 et du VRS réduit la spécificité clinique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., Arch Intern Med 2000</a>.</p></template>
<template data-pop="j09-indication-test" data-title="Indications du test grippal"><p class="lab">Fonction et cible</p><p>Le test identifie le virus influenza dans un prélèvement respiratoire ; il n’est utile que s’il modifie une décision.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez l’hospitalisé, un résultat positif oriente l’antiviral, l’isolement et le regroupement des patients. En établissement de soins, la confirmation des premiers cas déclenche le contrôle du foyer et la prophylaxie des résidents. Hors saison ou après une exposition animale, il peut révéler un virus zoonotique.</p><p class="lab">Conséquence clinique</p><p>L’IDSA 2018 recommande de tester le patient hospitalisé pour une maladie respiratoire aiguë en saison, et le patient ambulatoire à risque lorsque le résultat change la conduite. L’adulte sain atteint d’une grippe non compliquée n’en a généralement pas besoin.</p><div class="key"><b>Limite.</b> Le traitement d’un patient grave n’attend jamais le résultat. L’OMS 2024 recommande de débuter l’antiviral lorsque le résultat demande plus de 24 heures, puis de l’arrêter si le test est négatif.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse des recommandations OMS 2024, 2025</a>.</p></template>
<template data-pop="j09-tests" data-title="Tests antigéniques et tests moléculaires"><p class="lab">Fonction et cible</p><p>Le test antigénique détecte la nucléoprotéine virale par immunochromatographie. Le test moléculaire, dont la PCR, amplifie un segment de l’acide ribonucléique viral.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le test antigénique exige beaucoup de protéine virale et manque les prélèvements pauvres en virus ; l’amplification détecte de très faibles quantités. Dans la méta-analyse de Merckx (2017), la sensibilité groupée atteignait environ 54 % pour les tests antigéniques classiques, 80 % pour les tests à lecture numérique et plus de 90 % pour les tests moléculaires rapides, avec une spécificité supérieure à 98 % pour les trois.</p><p class="lab">Conséquence clinique</p><p>Un test positif est fiable. Chez l’hospitalisé, un test antigénique négatif conduit à une PCR. Le prélèvement nasopharyngé profond est le plus rentable ; chez l’intubé, un prélèvement des voies respiratoires inférieures peut être positif malgré un nasopharynx négatif.</p><div class="key"><b>Limite.</b> La positivité diminue après quatre à cinq jours de symptômes. Une PCR peut rester positive après la guérison sans prouver la contagiosité.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28869986/" target="_blank" rel="noopener">Merckx et al., Ann Intern Med 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-ddx-sepsis" data-title="Sepsis bactérien : le diagnostic à ne pas manquer"><p class="lab">Fonction et cible</p><p>Le sepsis est une dysfonction d’organe menaçant la vie, causée par une réponse dérégulée de l’hôte à une infection (définition Sepsis-3).</p><p class="lab">Mécanisme de l’affirmation</p><p>Fièvre, frissons et myalgies proviennent des cytokines de l’hôte et ne distinguent pas un virus d’une bactérie. Une hypotension, des marbrures ou une confusion traduisent une hypoperfusion d’organe, rare dans une grippe non compliquée. Hors de l’unité de soins intensifs, deux critères parmi une fréquence respiratoire d’au moins 22 par minute, une altération de la conscience et une pression systolique d’au plus 100 mmHg signalent un pronostic de sepsis.</p><p class="lab">Conséquence clinique</p><p>Le patient fébrile hypoperfusé reçoit des hémocultures puis un antibiotique sans attendre le test grippal. Une méningococcie, une pyélonéphrite ou une endocardite peuvent débuter comme un syndrome grippal. La prise en charge suit <a href="#/entry/A41">A41 — Sepsis et choc septique de l’adulte</a>.</p><div class="key"><b>Limite.</b> La grippe peut elle-même causer un sepsis viral, et un test positif n’exclut pas une bactérie associée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26903338/" target="_blank" rel="noopener">Singer et al., Sepsis-3, JAMA 2016</a>.</p></template>
<template data-pop="j09-ddx-pneumonie" data-title="Pneumonie bactérienne ou pneumonie grippale"><p class="lab">Fonction et cible</p><p>La pneumonie infecte le parenchyme pulmonaire et altère l’échange gazeux.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des crépitants localisés, une matité ou un souffle tubaire traduisent un comblement alvéolaire. Une aggravation après quelques jours d’amélioration oriente vers une surinfection bactérienne ; une dyspnée progressive dès le début oriente vers une pneumonie virale.</p><p class="lab">Conséquence clinique</p><p>En cas de doute, le médecin mesure la saturation et demande une radiographie thoracique. La gravité et l’antibiotique suivent <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>.</p><div class="key"><b>Limite.</b> La procalcitonine et la CRP ne séparent pas de façon fiable une pneumonie virale d’une co-infection bactérienne ; une valeur basse ne suffit pas à suspendre l’antibiotique d’un patient grave.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31573350/" target="_blank" rel="noopener">Metlay et al., ATS et IDSA 2019</a>.</p></template>
<template data-pop="j09-ddx-covid" data-title="COVID-19 et grippe"><p class="lab">Fonction et cible</p><p>Le SARS-CoV-2 et le virus influenza infectent l’épithélium respiratoire et circulent souvent ensemble en hiver.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les deux infections déclenchent la même réponse interféron et cytokinique : fièvre, toux et myalgies leur sont communes. L’anosmie oriente vers la COVID-19, mais elle est devenue rare avec les variants récents.</p><p class="lab">Conséquence clinique</p><p>Chez le patient à risque ou hospitalisé, un test moléculaire multiplex distingue les deux virus, car les antiviraux et l’isolement diffèrent. Dans la cohorte britannique ISARIC, la co-infection par un virus influenza était associée à davantage de ventilation mécanique invasive et de décès que la COVID-19 seule.</p><div class="key"><b>Limite.</b> Aucun signe clinique isolé ne tranche ; le test s’impose lorsque la décision en dépend.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35344735/" target="_blank" rel="noopener">Swets et al., Lancet 2022</a>.</p></template>
<template data-pop="j09-ddx-vrs" data-title="Virus respiratoire syncytial chez l’adulte"><p class="lab">Fonction et cible</p><p>Le VRS infecte l’épithélium bronchiolaire ; il hospitalise aussi l’adulte âgé et l’insuffisant cardiaque ou respiratoire.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’atteinte des petites voies aériennes provoque sifflements et obstruction, avec une fièvre souvent plus modérée que dans la grippe. Chez l’adulte hospitalisé, Falsey (2005) observait un recours aux soins intensifs (15 % contre 12 %) et une mortalité (8 % contre 7 %) proches de ceux de la grippe A.</p><p class="lab">Conséquence clinique</p><p>Le test moléculaire évite un antiviral grippal inutile. Le Plan de vaccination suisse 2026 recommande le vaccin contre le VRS dès 75 ans et dès 60 ans en cas de risque élevé.</p><div class="key"><b>Limite.</b> L’adulte ne dispose pas d’antiviral spécifique couramment recommandé ; le traitement vise les décompensations.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15858184/" target="_blank" rel="noopener">Falsey et al., N Engl J Med 2005</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-gravite" data-title="Signes de gravité de la grippe"><p class="lab">Fonction et cible</p><p>Ces signes repèrent une défaillance respiratoire, circulatoire ou neurologique qui exige une surveillance hospitalière.</p><p class="lab">Mécanisme de l’affirmation</p><p>Selon la Société suisse d’infectiologie, une saturation inférieure à 92 % en air ambiant est un signal d’alarme : l’oxygénation atteint la partie pentue de la courbe de dissociation de l’hémoglobine, où une faible baisse de pression partielle fait chuter la saturation. Une fréquence respiratoire de 30 par minute ou plus traduit un travail respiratoire élevé. Hypotension et confusion signalent une hypoperfusion d’organe.</p><p class="lab">Conséquence clinique</p><p>Le patient reçoit à l’hôpital l’oseltamivir immédiat, une radiographie thoracique, une gazométrie si l’oxygénation est altérée et une recherche de surinfection.</p><div class="key"><b>Limite.</b> Chez l’insuffisant respiratoire chronique, c’est la baisse par rapport à la saturation habituelle qui compte. Le sujet âgé peut être grave sans fièvre.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, infection respiratoire aiguë</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a> ; <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC 2026</a>.</p></template>
<template data-pop="j09-pneumonie-virale" data-title="Pneumonie virale primaire"><p class="lab">Fonction et cible</p><p>Les pneumocytes de type I assurent l’échange gazeux ; ceux de type II produisent le surfactant et régénèrent l’épithélium.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit les pneumocytes et déclenche une inflammation intense ; un exsudat protéique remplit les alvéoles. Ces territoires perfusés mais non ventilés créent un effet shunt, peu corrigé par l’oxygène.</p><p class="lab">Conséquence clinique</p><p>La dyspnée progresse dès les premiers jours, avec des opacités bilatérales et une auscultation parfois pauvre. Le patient reçoit oxygène, antiviral immédiat et surveillance intensive.</p><div class="key"><b>Limite.</b> Une co-infection bactérienne précoce est difficile à exclure : l’antibiotique est souvent débuté d’emblée chez le patient grave, puis réévalué.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-sdra" data-title="Syndrome de détresse respiratoire aiguë grippal"><p class="lab">Fonction et cible</p><p>La barrière alvéolocapillaire sépare l’air alvéolaire du sang et retient le liquide plasmatique.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’agression virale et l’inflammation lèsent épithélium et endothélium. Un œdème lésionnel, non cardiogénique, remplit les alvéoles, inactive le surfactant et effondre la compliance.</p><p class="lab">Conséquence clinique</p><p>Le patient relève des soins intensifs : ventilation protectrice, décubitus ventral si l’hypoxémie est sévère, oxygénation par membrane extracorporelle dans les formes réfractaires. En 2009, en Australie et en Nouvelle-Zélande, 68 patients atteints de SDRA à A(H1N1) ont reçu cette assistance ; ils avaient un âge médian de 34 ans, et 21 % étaient décédés à la fin de l’étude.</p><div class="key"><b>Limite.</b> Le SDRA grippal n’a pas de traitement spécifique hormis l’antiviral ; l’OMS 2024 recommande, sous réserve, de ne pas donner de corticostéroïdes dans la grippe grave.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/19822628/" target="_blank" rel="noopener">ANZ ECMO Influenza Investigators, JAMA 2009</a> ; <a href="https://www.ncbi.nlm.nih.gov/books/NBK607909/" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a>.</p></template>
<template data-pop="j09-surinfection-pec" data-title="Surinfection bactérienne après grippe"><p class="lab">Fonction et cible</p><p>L’épithélium cilié et le mucus éliminent les bactéries inhalées ; les macrophages alvéolaires les phagocytent.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium cilié et expose la membrane basale, où les bactéries adhèrent. La neuraminidase virale démasque des récepteurs bactériens, et la réponse interféron affaiblit temporairement macrophages et neutrophiles. Les poumons des victimes de 1918 montraient une pneumonie bactérienne dans la grande majorité des décès (Morens, 2008).</p><p class="lab">Conséquence clinique</p><p>Les germes principaux sont Streptococcus pneumoniae, Staphylococcus aureus et Streptococcus pyogenes. Le staphylocoque producteur de toxine nécrosante cause chez l’adulte jeune des pneumonies nécrosantes avec hémoptysie et choc. Une fièvre réapparue après amélioration impose un examen et une radiographie.</p><div class="key"><b>Limite.</b> La chronologie n’est pas absolue : une co-infection peut exister dès l’admission.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., J Infect Dis 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-decompensation-pec" data-title="Décompensation des maladies chroniques"><p class="lab">Fonction et cible</p><p>Les réserves cardiaques, respiratoires et métaboliques absorbent une hausse brutale de la demande.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre augmente la consommation d’oxygène et la fréquence cardiaque. L’inflammation systémique favorise la rétention hydrosodée et l’instabilité de la plaque coronaire, et l’hypoxie contracte les artérioles pulmonaires. Chez le diabétique, les hormones de stress élèvent la glycémie et peuvent déclencher une acidocétose ; l’inflammation bronchique aggrave l’obstruction de l’asthmatique.</p><p class="lab">Conséquence clinique</p><p>Chez l’insuffisant cardiaque, la grippe se présente souvent comme une décompensation cardiaque. Le médecin traite les deux : voir <a href="#/entry/I50">I50 — Insuffisance cardiaque</a>, <a href="#/entry/J44">J44 — Bronchopneumopathie chronique obstructive</a> et <a href="#/entry/J45">J45 — Asthme</a>.</p><div class="key"><b>Limite.</b> Une présentation atypique impose un test avant d’attribuer la décompensation à la grippe.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-infarctus" data-title="Grippe et infarctus du myocarde"><p class="lab">Fonction et cible</p><p>La chape fibreuse isole la plaque coronaire stable du sang circulant.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’inflammation systémique active les macrophages de la plaque, fragilise la chape et augmente la coagulabilité ; tachycardie et hypoxémie accroissent la demande myocardique. Dans une série de cas autocontrôlée canadienne, l’incidence de l’infarctus était six fois plus élevée pendant les sept jours suivant une grippe confirmée (rapport d’incidence 6,05).</p><p class="lab">Conséquence clinique</p><p>Une douleur thoracique pendant une grippe justifie un électrocardiogramme et une troponine. Ce lien soutient la vaccination du coronarien.</p><div class="key"><b>Limite.</b> Cette association temporelle ne quantifie pas le bénéfice individuel du vaccin.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., N Engl J Med 2018</a>.</p></template>
<template data-pop="j09-myocardite" data-title="Myocardite grippale"><p class="lab">Fonction et cible</p><p>Les cardiomyocytes assurent la contraction et participent à la conduction électrique.</p><p class="lab">Mécanisme de l’affirmation</p><p>La lésion résulte surtout de l’infiltrat inflammatoire et des cytokines, plus rarement d’une invasion virale directe. La nécrose libère la troponine ; l’œdème provoque arythmies et baisse de la fraction d’éjection. La revue de Sellers (2017) place la myocardite parmi les complications extrapulmonaires les plus décrites.</p><p class="lab">Conséquence clinique</p><p>Une douleur thoracique, une dyspnée disproportionnée, une tachycardie inexpliquée ou un choc font demander électrocardiogramme, troponine et échocardiographie. La prise en charge suit <a href="#/entry/I40">I40 — Myocardite</a>.</p><div class="key"><b>Limite.</b> Une troponine élevée pendant une grippe grave peut aussi traduire une souffrance hypoxémique ou un infarctus ; l’imagerie précise le mécanisme.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28745014/" target="_blank" rel="noopener">Sellers et al., Influenza Other Respir Viruses 2017</a>.</p></template>
<template data-pop="j09-encephalite" data-title="Encéphalopathie et encéphalite grippales"><p class="lab">Fonction et cible</p><p>La barrière hématoencéphalique protège le cerveau de l’inflammation systémique.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’atteinte résulte surtout d’une libération massive de cytokines qui rompt cette barrière et provoque un œdème cérébral ; le virus est rarement retrouvé dans le liquide cérébrospinal. La forme nécrosante aiguë touche surtout l’enfant.</p><p class="lab">Conséquence clinique</p><p>Une confusion, des convulsions ou un coma imposent une imagerie cérébrale, une ponction lombaire en l’absence de contre-indication et l’exclusion d’une méningite bactérienne.</p><div class="key"><b>Limite.</b> Chez le sujet âgé, la confusion relève plus souvent de la fièvre, de la déshydratation ou de l’hypoxémie que d’une encéphalite.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28745014/" target="_blank" rel="noopener">Sellers et al., Influenza Other Respir Viruses 2017</a>.</p></template>
<template data-pop="j09-rhabdo" data-title="Myosite et rhabdomyolyse"><p class="lab">Fonction et cible</p><p>La myoglobine et la créatine kinase restent dans la fibre musculaire tant que sa membrane est intacte.</p><p class="lab">Mécanisme de l’affirmation</p><p>La myosite grippale, plus fréquente avec l’influenza B chez l’enfant, associe douleur des mollets et créatine kinase élevée. Dans la rhabdomyolyse, la myoglobine libérée précipite dans les tubules rénaux et peut causer une insuffisance rénale aiguë.</p><p class="lab">Conséquence clinique</p><p>Des douleurs intenses, une faiblesse ou des urines foncées font doser créatine kinase, créatinine et potassium. L’hydratation intraveineuse protège le rein.</p><div class="key"><b>Limite.</b> Les myalgies banales ne justifient aucun dosage ; l’intensité, la faiblesse ou la couleur des urines orientent.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28745014/" target="_blank" rel="noopener">Sellers et al., Influenza Other Respir Viruses 2017</a>.</p></template>
<template data-pop="j09-reye" data-title="Syndrome de Reye"><p class="lab">Fonction et cible</p><p>Les mitochondries hépatiques assurent la bêta-oxydation des acides gras et la détoxification de l’ammoniac par le cycle de l’urée.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’acide acétylsalicylique pris par l’enfant pendant une grippe ou une varicelle provoque une atteinte mitochondriale diffuse : stéatose microvésiculaire, hyperammoniémie et œdème cérébral. Aux États-Unis, les cas pédiatriques sont passés de 555 en 1980 à 36 au plus par an dès 1987, après les mises en garde contre les salicylés ; la létalité atteignait 31 %.</p><p class="lab">Conséquence clinique</p><p>L’aspirine est contre-indiquée chez l’enfant et l’adolescent fébriles.</p><div class="key"><b>Limite.</b> L’enfant traité au long cours par aspirine doit être vacciné contre la grippe, car l’arrêt n’est pas toujours possible. Devant un tableau de Reye, il faut exclure une maladie métabolique héréditaire.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/10228187/" target="_blank" rel="noopener">Belay et al., N Engl J Med 1999</a>.</p></template>
<template data-pop="j09-hospitalisation" data-title="Critères d’orientation hospitalière"><p class="lab">Fonction et cible</p><p>L’hôpital apporte l’oxygène, la surveillance continue et le traitement des complications.</p><p class="lab">Mécanisme de l’affirmation</p><p>Hypoxémie, pneumonie, instabilité hémodynamique ou confusion signalent une défaillance qui peut s’aggraver en quelques heures. L’incapacité à boire mène à la déshydratation et à l’insuffisance rénale.</p><p class="lab">Conséquence clinique</p><p>Le médecin hospitalise devant un signe de gravité, une pneumonie à score CURB-65 ou CRB-65 élevé, une décompensation non contrôlable ou un isolement social qui empêche la surveillance.</p><div class="key"><b>Limite.</b> Ces scores n’ont pas été construits pour la grippe et sous-estiment la gravité de l’adulte jeune hypoxémique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31573350/" target="_blank" rel="noopener">Metlay et al., ATS et IDSA 2019</a>.</p></template>
<template data-pop="j09-delai-pec" data-title="Délai de 48 heures et patient hospitalisé"><p class="lab">Fonction et cible</p><p>Les antiviraux bloquent la libération des virions ou la transcription virale ; ils n’agissent que sur un virus qui se réplique.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez l’immunocompétent, la réplication culmine entre 24 et 72 heures, puis décroît. Les essais ambulatoires, menés dans les 48 heures, ont raccourci les symptômes d’environ un jour. Chez l’hospitalisé ou l’immunodéprimé, la réplication dure plus longtemps, et des études observationnelles associent un traitement tardif à une mortalité plus basse que l’absence de traitement.</p><p class="lab">Conséquence clinique</p><p>L’IDSA et les CDC recommandent l’antiviral au patient hospitalisé, grave ou immunodéprimé quel que soit le délai.</p><div class="key"><b>Limite.</b> Ce bénéfice tardif repose sur des données observationnelles. L’information professionnelle suisse de Tamiflu prévoit un début le jour des symptômes ou le lendemain ; l’usage au-delà relève de la recommandation clinique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a> ; <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC, mis à jour le 10.03.2026</a> ; <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, Tamiflu, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-contentieux" data-title="Contentieux : quel antiviral chez le patient ambulatoire à risque ?"><p class="lab">Fonction et cible</p><p>La question porte sur la grippe non grave du patient ambulatoire à risque de complication.</p><p class="lab">Mécanisme de l’affirmation</p><p><b>OMS, septembre 2024.</b> L’OMS recommande, sous réserve, le baloxavir dans les 48 heures pour la grippe non grave à haut risque. Elle recommande de ne pas donner l’oseltamivir dans la grippe non grave, car les méta-analyses montrent un effet faible sur les hospitalisations, et le recommande sous réserve dans la grippe grave.</p><p><b>CDC, page du 10.03.2026.</b> Les CDC recommandent un antiviral à tout ambulatoire à risque : oseltamivir, zanamivir ou baloxavir selon l’âge et le terrain. Ils préfèrent l’oseltamivir chez l’hospitalisé et la femme enceinte, et déconseillent le baloxavir en monothérapie chez l’immunodéprimé sévère.</p><p class="lab">Conséquence clinique</p><p>Le cours retient la source la plus récente, celle des CDC : baloxavir ou oseltamivir chez l’ambulatoire à risque ; oseltamivir chez le patient grave, hospitalisé, enceinte ou immunodéprimé sévère. Le baloxavir offre une dose unique et réduit la transmission domestique (CENTERSTONE) ; l’oseltamivir bénéficie d’une longue expérience pendant la grossesse.</p><div class="key"><b>Limite.</b> Aucune recommandation clinique suisse récente ne tranche. Swissmedic autorise les deux molécules. L’OFSP a publié le 11.04.2025 une évaluation comparative pour sa réserve pandémique, sans recommandation individuelle.</div><p class="src">Références : <a href="https://www.ncbi.nlm.nih.gov/books/NBK607909/" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse 2025</a> ; <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC 2026</a> ; <a href="https://www.bag.admin.ch/fr/loseltamivir-et-le-baloxavir-marboxil-pour-le-traitement-et-la-prevention-de-la-grippe-virus-influenza-a-et-b" target="_blank" rel="noopener">OFSP, évaluation 2025</a>.</p></template>
<template data-pop="j09-oseltamivir" data-title="Oseltamivir"><p class="lab">Fonction et cible</p><p>Prodrogue orale, l’oseltamivir est transformé par le foie en carboxylate d’oseltamivir, qui inhibe la neuraminidase des virus influenza A et B.</p><p class="lab">Mécanisme de l’affirmation</p><p>La neuraminidase clive l’acide sialique et libère les virions de la cellule infectée ; son inhibition les retient en surface et freine la propagation. Chez les patients confirmés, la méta-analyse de Dobson (2015) retrouvait un raccourcissement des symptômes d’environ 25 heures et moins de complications respiratoires basses traitées par antibiotique. La revue Cochrane 2014 retrouvait 16,8 heures chez l’adulte, sans effet démontré sur les hospitalisations.</p><p class="lab">Conséquence clinique</p><p>L’adulte reçoit 75 mg deux fois par jour pendant cinq jours ; la dose est réduite dès une clairance de la créatinine de 60 mL/min ou moins. Nausées et vomissements dominent les effets indésirables, et la prise au repas les réduit.</p><div class="key"><b>Limite.</b> La mutation H275Y de la neuraminidase rend les virus A(H1N1) résistants ; rare chez les virus saisonniers actuels, elle émerge chez l’immunodéprimé traité longtemps.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25640810/" target="_blank" rel="noopener">Dobson et al., Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson et al., Cochrane 2014</a>.</p></template>
<template data-pop="j09-baloxavir" data-title="Baloxavir marboxil"><p class="lab">Fonction et cible</p><p>Prodrogue orale, le baloxavir marboxil est transformé en acide de baloxavir, qui inhibe l’endonucléase dépendante de la coiffe de la polymérase virale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus prélève la coiffe des acides ribonucléiques messagers cellulaires pour amorcer la transcription de ses gènes ; bloquer l’endonucléase arrête la synthèse des protéines virales dès le début du cycle, et la charge virale chute plus vite qu’avec l’oseltamivir. Dans CAPSTONE-1, le délai médian d’amélioration était de 53,7 heures contre 80,2 heures sous placebo, semblable à celui de l’oseltamivir. CAPSTONE-2 a confirmé le bénéfice chez le patient à haut risque, et CENTERSTONE (2025) a réduit la transmission domestique confirmée de 13,4 % à 9,5 %.</p><p class="lab">Conséquence clinique</p><p>La dose orale unique se prend dans les 48 heures : 40 mg de 20 à moins de 80 kg, 80 mg dès 80 kg. Swissmedic autorise le traitement dès 3 mois chez le sujet sain et dès 12 ans chez le patient à risque, ainsi que la prophylaxie post-exposition dès 3 mois. Les cations polyvalents (calcium, fer, magnésium, antiacides, laxatifs) réduisent son absorption et ne doivent pas être pris en même temps.</p><div class="key"><b>Limite.</b> La substitution I38T de l’endonucléase, qui réduit la sensibilité, apparaissait chez environ 10 % des patients traités dans CAPSTONE-1 et 7 % dans CENTERSTONE, davantage chez l’enfant et l’immunodéprimé. Les CDC ne le recommandent ni pendant la grossesse ni chez l’hospitalisé.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30184455/" target="_blank" rel="noopener">Hayden et al., CAPSTONE-1, N Engl J Med 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32526195/" target="_blank" rel="noopener">Ison et al., CAPSTONE-2, Lancet Infect Dis 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40267424/" target="_blank" rel="noopener">Monto et al., CENTERSTONE, N Engl J Med 2025</a>.</p></template>
<template data-pop="j09-corticoides" data-title="Corticostéroïdes dans la grippe"><p class="lab">Fonction et cible</p><p>Les corticostéroïdes inhibent la transcription des gènes inflammatoires et la réponse immunitaire adaptative.</p><p class="lab">Mécanisme de l’affirmation</p><p>En freinant la réponse antivirale, ils prolongent l’excrétion du virus. La revue Cochrane 2019, fondée surtout sur des études observationnelles, associait leur emploi à une mortalité et à des surinfections plus fréquentes, avec un biais d’indication probable.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 recommande de ne pas les donner pour traiter la grippe grave. Une indication validée par ailleurs, comme une exacerbation d’asthme ou de bronchopneumopathie chronique obstructive ou un choc septique réfractaire, reste traitée.</p><div class="key"><b>Limite.</b> Aucun essai randomisé spécifique n’établit leur place dans le SDRA grippal ; l’extrapolation depuis la COVID-19 n’est pas validée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30798570/" target="_blank" rel="noopener">Lansbury et al., Cochrane 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse OMS 2024</a>.</p></template>
<template data-pop="j09-antibiotique" data-title="Antibiotique et grippe"><p class="lab">Fonction et cible</p><p>L’antibiotique cible une bactérie et n’a aucune action sur le virus influenza.</p><p class="lab">Mécanisme de l’affirmation</p><p>Sans infection bactérienne, il n’apporte que des effets indésirables, des infections à Clostridioides difficile et des résistances. Une pneumonie chez un patient grippé peut toutefois cacher une co-infection bactérienne qu’aucun examen n’exclut rapidement.</p><p class="lab">Conséquence clinique</p><p>L’ATS et l’IDSA 2019 recommandent un antibiotique d’emblée chez l’adulte atteint de pneumonie communautaire avec test grippal positif. Le spectre couvre le pneumocoque et Staphylococcus aureus selon <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>. Il peut être arrêté tôt si l’évolution et les cultures n’indiquent pas de bactérie.</p><div class="key"><b>Limite.</b> L’OMS 2024 déconseille l’antibiotique dans la grippe non grave à faible probabilité de co-infection.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31573350/" target="_blank" rel="noopener">Metlay et al., ATS et IDSA 2019</a> ; <a href="https://www.ncbi.nlm.nih.gov/books/NBK607909/" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a>.</p></template>
<template data-pop="j09-isolement" data-title="Isolement du patient grippé"><p class="lab">Fonction et cible</p><p>L’isolement réduit le nombre de contacts exposés pendant l’excrétion virale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus se transmet par gouttelettes et aérosols à courte distance, et par les mains ou les surfaces contaminées. L’excrétion culmine pendant les trois premiers jours, puis décroît parallèlement à la fièvre.</p><p class="lab">Conséquence clinique</p><p>À domicile, les CDC (mars 2024) conseillent de reprendre les activités lorsque les symptômes s’améliorent et que la fièvre a disparu depuis 24 heures sans antipyrétique, puis de redoubler de précautions pendant cinq jours. À l’hôpital, les CDC prévoient des précautions gouttelettes pendant sept jours après le début des symptômes ou jusqu’à 24 heures après la résolution de la fièvre et des symptômes respiratoires, selon la durée la plus longue.</p><div class="key"><b>Limite.</b> L’enfant et l’immunodéprimé excrètent plus longtemps. Le soignant fébrile ne travaille pas auprès de patients vulnérables.</div><p class="src">Références : <a href="https://www.cdc.gov/respiratory-viruses/guidance/index.html" target="_blank" rel="noopener">CDC, Respiratory Virus Guidance, mars 2024</a> ; <a href="https://www.cdc.gov/flu/hcp/infection-control/healthcare-settings.html" target="_blank" rel="noopener">CDC, prévention de la grippe en milieu de soins, mise à jour du 29.09.2026</a>.</p></template>
<template data-pop="j09-vaccin-groupes" data-title="Groupes à risque de complications : Plan de vaccination suisse 2026"><p class="lab">Fonction et cible</p><p>Le plan désigne les personnes chez qui la grippe cause plus souvent hospitalisation ou décès.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le plan 2026 cite les femmes enceintes ou ayant accouché dans les quatre semaines ; les prématurés nés avant 32 semaines ou pesant moins de 1500 g, dès 6 mois et pendant deux hivers ; les personnes dès 6 mois atteintes d’une maladie chronique cardiaque, pulmonaire (notamment asthme), métabolique avec répercussion cardiaque, pulmonaire ou rénale (diabète, obésité avec IMC d’au moins 40), neurologique ou musculosquelettique avec répercussion sur ces fonctions, d’une hépatopathie, d’une insuffisance rénale, d’une asplénie ou d’un déficit immunitaire ; les résidents des établissements de soins. Une recommandation complémentaire vise les personnes de 65 ans et plus.</p><p class="lab">Conséquence clinique</p><p>Ces groupes partagent une réserve cardiorespiratoire, métabolique ou immunitaire réduite. La vaccination de l’entourage protège ceux qui répondent mal au vaccin, comme le grand immunodéprimé et le nourrisson de moins de 6 mois.</p><div class="key"><b>Limite.</b> Toute personne qui souhaite réduire son risque pour des raisons privées ou professionnelles peut aussi être vaccinée.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026, chapitres 2 et 3.2</a>.</p></template>
<template data-pop="j09-soignants" data-title="Vaccination du personnel de santé"><p class="lab">Fonction et cible</p><p>La vaccination du soignant protège d’abord ses patients, puis lui-même et la continuité des soins.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’excrétion virale commence environ un jour avant les symptômes, et une partie des infections reste peu symptomatique : le soignant infecté peut transmettre en travaillant normalement. Ses patients âgés ou immunodéprimés répondent moins bien au vaccin.</p><p class="lab">Conséquence clinique</p><p>Le plan 2026 recommande la vaccination à tout le personnel médical, soignant et paramédical, au personnel des crèches et des établissements pour personnes âgées, étudiants et stagiaires compris.</p><div class="key"><b>Limite.</b> Le bénéfice mesuré sur la mortalité des résidents varie selon les études ; la recommandation repose sur l’ensemble des données de transmission.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-vaccin-efficacite" data-title="Vaccin grippal inactivé : mécanisme, efficacité, sécurité"><p class="lab">Fonction et cible</p><p>Le vaccin inactivé contient l’hémagglutinine, fragmentée ou purifiée, des souches attendues ; il induit des anticorps neutralisants contre sa tête globulaire.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces anticorps empêchent la fixation du virus à l’acide sialique cellulaire. Ils apparaissent en deux semaines environ, puis déclinent en quelques mois. La protection dépend de la concordance entre souches vaccinales et virus circulants : aux États-Unis, l’efficacité globale contre la grippe confirmée a été estimée à 44 % en 2023–2024, 56 % en 2024–2025 et 36 % en 2025–2026 (estimation préliminaire).</p><p class="lab">Conséquence clinique</p><p>Les effets indésirables habituels sont une douleur au point d’injection et une fébricule d’un à deux jours. Selon l’ACIP, l’allergie à l’œuf n’impose aucune précaution particulière ; une anaphylaxie après une dose antérieure contre-indique le vaccin.</p><div class="key"><b>Limite.</b> Le vaccin pandémique A(H1N1) de 2009 était associé à environ 1,6 cas supplémentaire de syndrome de Guillain-Barré par million de personnes vaccinées, un risque comparable à celui des vaccins saisonniers ; la grippe elle-même expose davantage à ce syndrome.</div><p class="src">Références : <a href="https://www.cdc.gov/flu-vaccines-work/php/effectiveness-studies/index.html" target="_blank" rel="noopener">CDC, études d’efficacité vaccinale, mise à jour du 16.03.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39197095/" target="_blank" rel="noopener">Grohskopf et al., recommandations ACIP 2024–2025, MMWR 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23498095/" target="_blank" rel="noopener">Salmon et al., Lancet 2013</a>.</p></template>
<template data-pop="j09-haute-dose" data-title="Vaccin à dose élevée"><p class="lab">Fonction et cible</p><p>Le vaccin à dose élevée contient quatre fois plus d’hémagglutinine par souche que le vaccin standard.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’immunosénescence réduit la réponse des lymphocytes B et T : la même dose d’antigène produit moins d’anticorps, et une dose plus forte compense en partie ce déficit. Chez des personnes de 65 ans et plus, la dose élevée réduisait la grippe confirmée de 24,2 % par rapport à la dose standard (DiazGranados, 2014).</p><p class="lab">Conséquence clinique</p><p>Le plan 2026 la préfère dès 75 ans et dès 65 ans avec un facteur de risque supplémentaire. Le vaccin standard reste préférable à l’absence de vaccination si la dose élevée manque.</p><div class="key"><b>Limite.</b> Les réactions locales sont un peu plus fréquentes, et la comparaison avec les vaccins adjuvantés repose sur des données moins solides.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25119609/" target="_blank" rel="noopener">DiazGranados et al., N Engl J Med 2014</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-pep" data-title="Prophylaxie antivirale post-exposition"><p class="lab">Fonction et cible</p><p>La prophylaxie empêche l’infection de s’établir chez une personne exposée à un cas de grippe.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un antiviral présent lors de l’inoculation limite la réplication initiale. La revue Cochrane 2014 retrouvait une réduction de la grippe symptomatique sous oseltamivir prophylactique.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 réserve la prophylaxie de la grippe saisonnière aux personnes à risque très élevé d’hospitalisation, et la recommande après exposition à un virus zoonotique. L’oseltamivir se donne à 75 mg une fois par jour pendant dix jours, débuté dans les 48 heures suivant le contact ; le baloxavir se donne en dose unique dans le même délai, dès 3 mois.</p><div class="key"><b>Limite.</b> La protection cesse avec le traitement et ne remplace pas la vaccination. Une personne déjà symptomatique reçoit une dose curative.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson et al., Cochrane 2014</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse OMS 2024</a>.</p></template>
<template data-pop="j09-hygiene" data-title="Mesures d’hygiène"><p class="lab">Fonction et cible</p><p>Les mesures d’hygiène interrompent la transmission par gouttelettes et par contact.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les gouttelettes émises par la toux retombent en général à moins de deux mètres, et un masque porté par le malade en retient une partie. Le virus persiste quelques heures sur les mains et les surfaces ; la friction hydroalcoolique détruit son enveloppe lipidique.</p><p class="lab">Conséquence clinique</p><p>Dans la revue Cochrane 2023, l’hygiène des mains réduisait les infections respiratoires aiguës de 14 % (380 à 327 pour 1000 personnes), sans effet significatif sur la grippe confirmée en laboratoire. Le port communautaire du masque changeait probablement peu ou pas le risque de grippe confirmée.</p><div class="key"><b>Limite.</b> L’observance faible et les biais des essais limitent ces conclusions ; l’association des mesures reste recommandée chez le malade et dans les salles d’attente.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36715243/" target="_blank" rel="noopener">Jefferson et al., Cochrane 2023</a>.</p></template>
<template data-pop="j09-grossesse" data-title="Grippe et grossesse"><p class="lab">Fonction et cible</p><p>La grossesse modifie la mécanique respiratoire, le débit cardiaque et la régulation immunitaire.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’utérus élève le diaphragme et réduit la capacité résiduelle fonctionnelle, tandis que la consommation d’oxygène et le débit cardiaque augmentent : la réserve face à une pneumonie diminue. L’hypoxémie maternelle réduit l’apport d’oxygène au fœtus, et la fièvre élevée au premier trimestre est associée à des malformations.</p><p class="lab">Conséquence clinique</p><p>La femme enceinte ou accouchée depuis moins de quatre semaines reçoit l’oseltamivir dès la suspicion, même après 48 heures, et le paracétamol contre la fièvre. La vaccination à chaque grossesse protège aussi le nourrisson par les anticorps transmis par le placenta.</p><div class="key"><b>Limite.</b> L’information professionnelle suisse réserve l’oseltamivir aux situations de nécessité pendant la grossesse ; les données accumulées depuis 2009 sont rassurantes.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC 2026</a> ; <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-ems" data-title="Foyer de grippe en établissement de soins"><p class="lab">Fonction et cible</p><p>Les résidents âgés et polymorbides vivent en contact étroit et répondent moins bien au vaccin.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’immunosénescence atténue la fièvre : la grippe se présente par une confusion, une chute, une anorexie ou une décompensation. Un cas non reconnu contamine les autres résidents et le personnel.</p><p class="lab">Conséquence clinique</p><p>Devant au moins deux cas respiratoires en quelques jours, l’équipe teste les malades. L’IDSA 2018 recommande, dès qu’un foyer est confirmé, une prophylaxie de tous les résidents non malades, vaccinés ou non, pendant au moins deux semaines et jusqu’à une semaine après le dernier cas. Les malades sont isolés et traités.</p><div class="key"><b>Limite.</b> La prophylaxie collective exige d’adapter la dose à la fonction rénale de chaque résident.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-immunodeprime" data-title="Grippe chez le patient immunodéprimé"><p class="lab">Fonction et cible</p><p>Les lymphocytes T cytotoxiques et les anticorps éliminent normalement le virus en une à deux semaines.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez le greffé ou le patient sous chimiothérapie ou immunosuppresseur, l’excrétion peut durer plusieurs semaines. Cette réplication prolongée sous antiviral sélectionne des mutants résistants, et l’atteinte des voies respiratoires inférieures est plus fréquente.</p><p class="lab">Conséquence clinique</p><p>Le patient reçoit l’oseltamivir quel que soit le délai. Selon les CDC, un traitement de plus de cinq jours peut être nécessaire, et le baloxavir n’est pas recommandé en monothérapie chez l’immunodéprimé sévère. Une absence d’amélioration fait rechercher une résistance au laboratoire de référence.</p><div class="key"><b>Limite.</b> Les doses doublées d’oseltamivir n’ont pas montré de bénéfice clinique clair. La vaccination de l’entourage compense la faible réponse vaccinale du patient.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC, mis à jour le 10.03.2026</a>.</p></template>
<template data-pop="j09-rein" data-title="Oseltamivir et insuffisance rénale"><p class="lab">Fonction et cible</p><p>Le carboxylate d’oseltamivir, métabolite actif, est éliminé à plus de 99 % par le rein, par filtration glomérulaire et sécrétion tubulaire.</p><p class="lab">Mécanisme de l’affirmation</p><p>Quand la clairance de la créatinine baisse, l’élimination ralentit et la concentration plasmatique augmente. Une dose standard expose alors à l’accumulation et à davantage d’effets indésirables digestifs et neuropsychiatriques.</p><p class="lab">Conséquence clinique</p><p>Le médecin estime la clairance avant la prescription et réduit la dose dès 60 mL/min ou moins. L’onglet Pharmacologie donne les paliers et le schéma en dialyse.</p><div class="key"><b>Limite.</b> Chez le patient grave, la fonction rénale varie vite et la dose doit être réévaluée. Le baloxavir n’est pas éliminé principalement par le rein.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-zoonotique" data-title="Grippe zoonotique : A(H5N1) et autres sous-types aviaires"><p class="lab">Fonction et cible</p><p>Les virus aviaires se fixent de préférence aux acides sialiques liés en alpha-2,3, abondants dans les voies respiratoires basses humaines et rares dans le nez.</p><p class="lab">Mécanisme de l’affirmation</p><p>Cette préférence explique une transmission interhumaine faible mais des pneumonies graves. La co-infection d’une même cellule par un virus saisonnier permet un réassortiment des segments géniques, source d’un virus pandémique. Selon l’OFSP, l’incubation dure de deux à quatorze jours.</p><p class="lab">Conséquence clinique</p><p>L’OFSP impose de déclarer par téléphone dans les deux heures toute suspicion d’infection humaine par un nouveau sous-type et d’isoler le patient. L’oseltamivir débute sans attendre la confirmation, quel que soit le délai, et les contacts reçoivent une prophylaxie selon l’OMS 2024. Aucun vaccin humain contre la souche actuelle de A(H5N1) n’est autorisé en Suisse.</p><div class="key"><b>Limite.</b> La Suisse ne comptait aucun cas humain confirmé lors de la consultation de la page de l’OFSP. Le code J09 exige l’identification du virus zoonotique ou pandémique.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-aviaire-h5n1-situation-en-suisse" target="_blank" rel="noopener">OFSP, grippe aviaire H5N1, consultée le 08.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse OMS 2024</a>.</p></template>
<template data-pop="j09-criteres" data-title="Origine et limites des critères diagnostiques"><p class="lab">Fonction et cible</p><p>Les critères distinguent grippe probable, confirmée et grave, puis relient la confirmation virologique au code CIM-10-GM 2024.</p><p class="lab">Mécanisme de l’affirmation</p><p>La définition clinique reprend celle du syndrome grippal de surveillance (début brutal, fièvre, toux, signe général) utilisée par le réseau Sentinella ; elle privilégie la sensibilité, non la certitude individuelle. La confirmation exige la détection du virus, car aucun signe clinique n’est spécifique.</p><p class="lab">Conséquence clinique</p><p>Le dossier mentionne la méthode de confirmation, la gravité et le code : J09 — Grippe à virus d’influenza zoonotique ou pandémique identifié ; J10 — Grippe, à virus d’influenza saisonnière identifié ; J11 — Grippe, virus non identifié.</p><div class="key"><b>Limite.</b> Aucun critère officiel ne définit le diagnostic individuel de grippe ; ceux-ci forment un outil pédagogique tiré des définitions de surveillance et des recommandations de l’OMS et de l’IDSA.</div><p class="src">Références : <a href="https://www.ncbi.nlm.nih.gov/books/NBK607909/" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="pareto-j09-pec" data-title="Pareto — Diagnostic, urgences et prise en charge"><p class="ratio" data-cover="j09-7,j09-8,j09-9,j09-10,j09-11,j09-12"></p><ul><li>En période épidémique, la grippe est un diagnostic clinique ; le test sert lorsqu’il change le traitement, l’isolement ou l’orientation, et un test antigénique négatif n’exclut pas.</li><li>Hypoxémie, polypnée, hypotension, confusion ou rechute fébrile après amélioration signalent une grippe grave ou une surinfection à pneumocoque ou staphylocoque.</li><li>Antiviral immédiat chez le patient grave, hospitalisé, enceinte ou immunodéprimé, quel que soit le délai ; dans les 48 heures chez l’ambulatoire à risque.</li><li>Oseltamivir adulte 75 mg deux fois par jour pendant cinq jours, réduit dès une clairance de 60 mL/min ou moins ; baloxavir en dose unique, évité pendant la grossesse.</li><li>Pas d’antibiotique sans argument bactérien, sauf pneumonie confirmée ; pas de corticostéroïde pour la grippe elle-même ; pas d’aspirine chez l’enfant.</li><li>Vaccination annuelle des groupes à risque, de l’entourage et des soignants, de la mi-octobre au début de la vague ; dose élevée dès 75 ans, ou dès 65 ans avec un facteur de risque.</li><li>Suspicion de A(H5N1) après exposition animale : isolement, oseltamivir et déclaration téléphonique dans les deux heures.</li></ul></template>
