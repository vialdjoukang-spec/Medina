<template data-pop="j09-diag-clinique" data-title="Diagnostic clinique de la grippe et circulation virale"><p class="lab">Fonction et cible</p><p>Le diagnostic clinique estime la probabilité de grippe sans test, d’après les symptômes et l’épidémie en cours.</p><p class="lab">Mécanisme de l’affirmation</p><p>La valeur prédictive positive d’un signe augmente avec la fréquence de la maladie. Dans les essais d’antiviraux menés en saison, fièvre et toux apparues depuis moins de 48 heures prédisaient une grippe confirmée dans 79 % des cas.</p><p class="lab">Conséquence clinique</p><p>En saison, l’adulte à risque qui présente ce tableau reçoit l’antiviral sans confirmation ; hors saison, il est testé.</p><div class="key"><b>Limite.</b> La fièvre manque souvent chez le sujet âgé, et la co-circulation du SARS-CoV-2 et du VRS réduit la spécificité.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., Arch Intern Med 2000</a>.</p></template>
<template data-pop="j09-indication-test" data-title="Indications du test grippal"><p class="lab">Fonction et cible</p><p>Le test n’est utile que s’il modifie une décision.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez l’hospitalisé, il oriente l’antiviral, l’isolement et le regroupement des patients. En établissement de soins, la confirmation des premiers cas déclenche le contrôle du foyer. Hors saison ou après une exposition animale, il peut révéler un virus zoonotique.</p><p class="lab">Conséquence clinique</p><p>L’IDSA 2018 teste en saison tout patient hospitalisé pour une maladie respiratoire aiguë, et l’ambulatoire à risque si le résultat change la conduite. L’adulte sain atteint d’une grippe non compliquée n’en a généralement pas besoin.</p><div class="key"><b>Limite.</b> Le patient grave n’attend jamais le résultat : l’OMS 2024 débute l’antiviral si le test demande plus de 24 heures, puis l’arrête s’il est négatif.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse des recommandations OMS 2024, 2025</a>.</p></template>
<template data-pop="j09-tests" data-title="Tests antigéniques et tests moléculaires"><p class="lab">Fonction et cible</p><p>Le test antigénique détecte la nucléoprotéine virale par immunochromatographie ; le test moléculaire, dont la PCR, amplifie l’acide ribonucléique viral.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le test antigénique exige beaucoup de protéine virale, alors que l’amplification détecte de très faibles quantités. Dans la méta-analyse de Merckx (2017), la sensibilité atteignait 54 % pour les tests antigéniques classiques, 80 % pour ceux à lecture numérique et plus de 90 % pour les tests moléculaires rapides ; la spécificité dépassait 98 % pour les trois.</p><p class="lab">Conséquence clinique</p><p>Un test positif est fiable. Chez l’hospitalisé, un test antigénique négatif conduit à une PCR, de préférence sur un prélèvement nasopharyngé profond ; chez l’intubé, un prélèvement bronchique peut être seul positif.</p><div class="key"><b>Limite.</b> La positivité baisse après quatre à cinq jours de symptômes. Une PCR positive après la guérison ne prouve pas la contagiosité.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28869986/" target="_blank" rel="noopener">Merckx et al., Ann Intern Med 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-ddx-sepsis" data-title="Sepsis bactérien : le diagnostic à ne pas manquer"><p class="lab">Fonction et cible</p><p>Le sepsis est une dysfonction d’organe menaçant la vie, due à une réponse dérégulée de l’hôte à une infection.</p><p class="lab">Mécanisme de l’affirmation</p><p>Fièvre, frissons et myalgies proviennent des cytokines de l’hôte et ne distinguent pas un virus d’une bactérie. Hypotension, marbrures ou confusion traduisent une hypoperfusion, rare dans la grippe non compliquée. Hors des soins intensifs, deux critères parmi fréquence respiratoire d’au moins 22 par minute, conscience altérée et pression systolique d’au plus 100 mmHg annoncent un pronostic de sepsis.</p><p class="lab">Conséquence clinique</p><p>Le patient hypoperfusé reçoit hémocultures puis antibiotique sans attendre le test grippal, selon <a href="#/entry/A41">A41 — Sepsis et choc septique de l’adulte</a>. Méningococcie, pyélonéphrite ou endocardite peuvent débuter comme un syndrome grippal.</p><div class="key"><b>Limite.</b> La grippe peut causer un sepsis viral, et un test positif n’exclut pas une bactérie associée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26903338/" target="_blank" rel="noopener">Singer et al., Sepsis-3, JAMA 2016</a>.</p></template>
<template data-pop="j09-ddx-pneumonie" data-title="Pneumonie bactérienne ou pneumonie grippale"><p class="lab">Mécanisme de l’affirmation</p><p>Crépitants localisés, matité ou souffle tubaire traduisent un comblement alvéolaire. Une aggravation après amélioration oriente vers la surinfection bactérienne ; une dyspnée progressive dès le début, vers la pneumonie virale.</p><p class="lab">Conséquence clinique</p><p>En cas de doute, le médecin mesure la saturation et demande une radiographie thoracique ; gravité et antibiotique suivent <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>.</p><div class="key"><b>Limite.</b> Procalcitonine et CRP ne séparent pas de façon fiable pneumonie virale et co-infection ; une valeur basse ne suffit pas à suspendre l’antibiotique d’un patient grave.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31573350/" target="_blank" rel="noopener">Metlay et al., ATS et IDSA 2019</a>.</p></template>
<template data-pop="j09-ddx-covid" data-title="COVID-19 et grippe"><p class="lab">Mécanisme de l’affirmation</p><p>Le SARS-CoV-2 et le virus influenza déclenchent la même réponse interféron et cytokinique : fièvre, toux et myalgies leur sont communes. L’anosmie oriente vers la COVID-19, mais elle est devenue rare avec les variants récents.</p><p class="lab">Conséquence clinique</p><p>Chez le patient à risque ou hospitalisé, un test moléculaire multiplex distingue les deux virus, car antiviraux et isolement diffèrent. Dans une cohorte britannique de patients hospitalisés, la co-infection grippale était associée à davantage de ventilation invasive et de décès que la COVID-19 seule.</p><div class="key"><b>Limite.</b> Aucun signe clinique isolé ne tranche.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35344735/" target="_blank" rel="noopener">Swets et al., Lancet 2022</a>.</p></template>
<template data-pop="j09-ddx-vrs" data-title="Virus respiratoire syncytial chez l’adulte"><p class="lab">Mécanisme de l’affirmation</p><p>Le VRS atteint les bronchioles : il provoque sifflements et obstruction, avec une fièvre souvent modérée. Chez l’adulte hospitalisé, recours aux soins intensifs (15 % contre 12 %) et mortalité (8 % contre 7 %) étaient proches de ceux de la grippe A (Falsey, 2005).</p><p class="lab">Conséquence clinique</p><p>Le test moléculaire évite un antiviral grippal inutile. Le Plan de vaccination suisse 2026 recommande le vaccin contre le VRS dès 75 ans, et dès 60 ans en cas de risque élevé.</p><div class="key"><b>Limite.</b> L’adulte ne dispose d’aucun antiviral spécifique courant ; le traitement vise les décompensations.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15858184/" target="_blank" rel="noopener">Falsey et al., N Engl J Med 2005</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-gravite" data-title="Signes de gravité et orientation hospitalière"><p class="lab">Fonction et cible</p><p>Ces signes repèrent une défaillance respiratoire, circulatoire ou neurologique qui exige l’hôpital.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une saturation inférieure à 92 % en air ambiant, seuil d’alarme de la Société suisse d’infectiologie, place l’oxygénation sur la partie pentue de la courbe de dissociation de l’hémoglobine : une faible baisse supplémentaire de pression partielle fait chuter la saturation. Une fréquence respiratoire de 30 par minute ou plus traduit un travail respiratoire élevé. Hypotension et confusion signalent une hypoperfusion ; l’incapacité à boire mène à la déshydratation et à l’insuffisance rénale.</p><p class="lab">Conséquence clinique</p><p>Le médecin hospitalise devant un signe de gravité, une pneumonie à score CRB-65 élevé, une décompensation non contrôlable ou un isolement social qui empêche la surveillance. L’hôpital débute l’oseltamivir, réalise une radiographie, une gazométrie si l’oxygénation est altérée, et recherche une surinfection.</p><div class="key"><b>Limite.</b> Chez l’insuffisant respiratoire chronique, la baisse par rapport à la saturation habituelle compte davantage que le seuil. Les scores de pneumonie, non construits pour la grippe, sous-estiment la gravité de l’adulte jeune hypoxémique.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, infection respiratoire aiguë</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31573350/" target="_blank" rel="noopener">Metlay et al., ATS et IDSA 2019</a>.</p></template>
<template data-pop="j09-pneumonie-virale" data-title="Pneumonie virale primaire"><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit les pneumocytes de type I, qui assurent l’échange gazeux, et de type II, qui produisent le surfactant. Un exsudat protéique remplit les alvéoles ; ces territoires perfusés mais non ventilés créent un effet shunt, peu corrigé par l’oxygène.</p><p class="lab">Conséquence clinique</p><p>La dyspnée progresse dès les premiers jours, avec des opacités bilatérales et une auscultation parfois pauvre. Le patient reçoit oxygène, antiviral immédiat et surveillance intensive.</p><div class="key"><b>Limite.</b> Une co-infection bactérienne précoce est difficile à exclure : l’antibiotique est souvent débuté chez le patient grave, puis réévalué.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-sdra" data-title="Syndrome de détresse respiratoire aiguë grippal"><p class="lab">Mécanisme de l’affirmation</p><p>L’agression virale et l’inflammation lèsent l’épithélium alvéolaire et l’endothélium. Un œdème lésionnel, non cardiogénique, inactive le surfactant et effondre la compliance.</p><p class="lab">Conséquence clinique</p><p>Le patient relève des soins intensifs : ventilation protectrice, décubitus ventral si l’hypoxémie est sévère, oxygénation par membrane extracorporelle si elle est réfractaire. En 2009, 68 patients australiens et néo-zélandais atteints de SDRA à A(H1N1), d’âge médian 34 ans, ont reçu cette assistance ; 21 % étaient décédés à la fin de l’étude.</p><div class="key"><b>Limite.</b> Hormis l’antiviral, aucun traitement spécifique n’existe ; l’OMS 2024 déconseille, sous réserve, les corticostéroïdes dans la grippe grave.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/19822628/" target="_blank" rel="noopener">Davies et al., JAMA 2009</a> ; <a href="https://www.ncbi.nlm.nih.gov/books/NBK607909/" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a>.</p></template>
<template data-pop="j09-surinfection-pec" data-title="Surinfection bactérienne après grippe"><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium cilié et expose la membrane basale, où les bactéries adhèrent. La neuraminidase virale démasque des récepteurs bactériens, et la réponse interféron affaiblit temporairement macrophages et neutrophiles. En 1918, une pneumonie bactérienne était présente dans la grande majorité des décès autopsiés.</p><p class="lab">Conséquence clinique</p><p>Streptococcus pneumoniae, Staphylococcus aureus et Streptococcus pyogenes dominent. Le staphylocoque producteur de toxine nécrosante cause chez l’adulte jeune des pneumonies nécrosantes avec hémoptysie et choc. Une fièvre réapparue après amélioration impose examen et radiographie.</p><div class="key"><b>Limite.</b> Une co-infection peut exister dès l’admission.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., J Infect Dis 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-decompensation-pec" data-title="Décompensation des maladies chroniques"><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre augmente la consommation d’oxygène et la fréquence cardiaque. L’inflammation favorise la rétention hydrosodée, et l’hypoxie contracte les artérioles pulmonaires. Chez le diabétique, les hormones de stress élèvent la glycémie jusqu’à l’acidocétose ; chez l’asthmatique, l’inflammation bronchique aggrave l’obstruction.</p><p class="lab">Conséquence clinique</p><p>Chez l’insuffisant cardiaque, la grippe se présente souvent comme une décompensation cardiaque. Le médecin traite les deux, selon <a href="#/entry/I50">I50 — Insuffisance cardiaque</a>, <a href="#/entry/J44">J44 — Bronchopneumopathie chronique obstructive</a> ou <a href="#/entry/J45">J45 — Asthme</a>.</p><div class="key"><b>Limite.</b> Une présentation atypique impose un test avant d’attribuer la décompensation à la grippe.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-infarctus" data-title="Grippe et infarctus du myocarde"><p class="lab">Mécanisme de l’affirmation</p><p>L’inflammation systémique active les macrophages de la plaque, fragilise sa chape fibreuse et augmente la coagulabilité ; tachycardie et hypoxémie accroissent la demande myocardique. Dans une série de cas autocontrôlée canadienne, l’incidence de l’infarctus était six fois plus élevée pendant les sept jours suivant une grippe confirmée (rapport d’incidence 6,05).</p><p class="lab">Conséquence clinique</p><p>Une douleur thoracique pendant une grippe impose électrocardiogramme et troponine. Ce lien soutient la vaccination du coronarien.</p><div class="key"><b>Limite.</b> Cette association temporelle ne mesure pas le bénéfice individuel du vaccin.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., N Engl J Med 2018</a>.</p></template>
<template data-pop="j09-extrapulm" data-title="Complications extrapulmonaires"><p class="lab">Mécanisme de l’affirmation</p><p><b>Myocardite.</b> L’infiltrat inflammatoire et les cytokines, plus rarement le virus lui-même, lèsent les cardiomyocytes : la nécrose libère la troponine, l’œdème provoque arythmies et baisse de la fraction d’éjection. <b>Encéphalopathie.</b> Une libération massive de cytokines rompt la barrière hématoencéphalique et provoque un œdème cérébral ; le virus est rarement retrouvé dans le liquide cérébrospinal, et la forme nécrosante aiguë touche surtout l’enfant. <b>Myosite et rhabdomyolyse.</b> La myosite, plus fréquente avec l’influenza B chez l’enfant, donne des douleurs des mollets ; dans la rhabdomyolyse, la myoglobine libérée précipite dans les tubules et peut causer une insuffisance rénale aiguë.</p><p class="lab">Conséquence clinique</p><p>Douleur thoracique, dyspnée disproportionnée ou tachycardie inexpliquée font demander électrocardiogramme, troponine et échocardiographie, selon <a href="#/entry/I40">I40 — Myocardite</a>. Confusion, convulsions ou coma imposent imagerie cérébrale, ponction lombaire sans contre-indication et exclusion d’une méningite bactérienne. Douleurs musculaires intenses, faiblesse ou urines foncées font doser créatine kinase, créatinine et potassium, et justifient une hydratation intraveineuse.</p><div class="key"><b>Limite.</b> Une troponine élevée peut aussi traduire une souffrance hypoxémique ou un infarctus. Chez le sujet âgé, la confusion relève plus souvent de la fièvre, de la déshydratation ou de l’hypoxémie que d’une encéphalite. Les myalgies banales ne justifient aucun dosage.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28745014/" target="_blank" rel="noopener">Sellers et al., Influenza Other Respir Viruses 2017</a>.</p></template>
<template data-pop="j09-reye" data-title="Syndrome de Reye"><p class="lab">Mécanisme de l’affirmation</p><p>L’acide acétylsalicylique pris par l’enfant pendant une grippe ou une varicelle provoque une atteinte mitochondriale diffuse : la bêta-oxydation et le cycle de l’urée défaillent, d’où stéatose microvésiculaire, hyperammoniémie et œdème cérébral. Aux États-Unis, les cas pédiatriques sont passés de 555 en 1980 à 36 au plus par an dès 1987, après les mises en garde ; la létalité atteignait 31 %.</p><p class="lab">Conséquence clinique</p><p>L’aspirine est contre-indiquée chez l’enfant et l’adolescent fébriles ; l’enfant qui en reçoit au long cours est vacciné contre la grippe.</p><div class="key"><b>Limite.</b> Le syndrome étant devenu exceptionnel, un tableau évocateur fait d’abord exclure une maladie métabolique héréditaire.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/10228187/" target="_blank" rel="noopener">Belay et al., N Engl J Med 1999</a>.</p></template>
<template data-pop="j09-delai-pec" data-title="Délai de 48 heures et patient hospitalisé"><p class="lab">Mécanisme de l’affirmation</p><p>Les antiviraux n’agissent que sur un virus qui se réplique. Chez l’immunocompétent, la réplication culmine entre 24 et 72 heures ; les essais ambulatoires, menés dans les 48 heures, ont raccourci les symptômes d’environ un jour. Chez l’hospitalisé ou l’immunodéprimé, la réplication dure plus longtemps, et des études observationnelles associent un traitement tardif à une mortalité plus basse que l’absence de traitement.</p><p class="lab">Conséquence clinique</p><p>L’IDSA et les CDC traitent le patient hospitalisé, grave ou immunodéprimé quel que soit le délai.</p><div class="key"><b>Limite.</b> Ce bénéfice tardif repose sur des données observationnelles. L’information professionnelle de Tamiflu prévoit un début le jour des symptômes ou le lendemain ; l’usage au-delà relève de la recommandation clinique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a> ; <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC, mis à jour le 10.03.2026</a> ; <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, Tamiflu, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-contentieux" data-title="Contentieux : quel antiviral chez le patient ambulatoire à risque ?"><p class="lab">Mécanisme de l’affirmation</p><p><b>OMS, septembre 2024.</b> L’OMS recommande, sous réserve, le baloxavir dans les 48 heures pour la grippe non grave à haut risque. Elle déconseille l’oseltamivir dans la grippe non grave, faute d’effet net sur les hospitalisations, et le recommande sous réserve dans la grippe grave.</p><p><b>CDC, 10.03.2026.</b> Les CDC traitent tout ambulatoire à risque par oseltamivir, zanamivir ou baloxavir selon l’âge et le terrain. Ils préfèrent l’oseltamivir chez l’hospitalisé et la femme enceinte, et déconseillent le baloxavir en monothérapie chez l’immunodéprimé sévère.</p><p class="lab">Conséquence clinique</p><p>Le cours retient la source la plus récente, celle des CDC. Le baloxavir offre une dose unique et réduit la transmission domestique ; l’oseltamivir bénéficie d’une longue expérience pendant la grossesse.</p><div class="key"><b>Limite.</b> Aucune recommandation clinique suisse récente ne tranche ; Swissmedic autorise les deux molécules. L’évaluation de l’OFSP du 11.04.2025 concerne la réserve pandémique, non la décision individuelle.</div><p class="src">Références : <a href="https://www.ncbi.nlm.nih.gov/books/NBK607909/" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse 2025</a> ; <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC 2026</a> ; <a href="https://www.bag.admin.ch/fr/loseltamivir-et-le-baloxavir-marboxil-pour-le-traitement-et-la-prevention-de-la-grippe-virus-influenza-a-et-b" target="_blank" rel="noopener">OFSP, évaluation 2025</a>.</p></template>
<template data-pop="j09-oseltamivir" data-title="Oseltamivir"><p class="lab">Mécanisme de l’affirmation</p><p>Le foie transforme cette prodrogue en carboxylate d’oseltamivir, qui inhibe la neuraminidase des virus A et B : les virions restent fixés à la cellule et la propagation ralentit. Chez les patients confirmés, la méta-analyse de Dobson (2015) retrouvait environ 25 heures de symptômes en moins et moins de complications respiratoires basses ; la revue Cochrane 2014 retrouvait 16,8 heures chez l’adulte, sans effet démontré sur les hospitalisations.</p><p class="lab">Conséquence clinique</p><p>L’adulte reçoit 75 mg deux fois par jour pendant cinq jours, au repas pour limiter nausées et vomissements ; la dose est réduite dès une clairance de la créatinine de 60 mL/min ou moins.</p><div class="key"><b>Limite.</b> La mutation H275Y rend les virus A(H1N1) résistants ; rare chez les virus saisonniers, elle émerge chez l’immunodéprimé traité longtemps.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25640810/" target="_blank" rel="noopener">Dobson et al., Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson et al., Cochrane 2014</a>.</p></template>
<template data-pop="j09-baloxavir" data-title="Baloxavir marboxil"><p class="lab">Mécanisme de l’affirmation</p><p>L’acide de baloxavir inhibe l’endonucléase qui prélève la coiffe des acides ribonucléiques messagers cellulaires pour amorcer la transcription virale ; la synthèse des protéines virales s’arrête dès le début du cycle. Dans CAPSTONE-1, le délai médian d’amélioration était de 53,7 heures contre 80,2 heures sous placebo, semblable à l’oseltamivir. CAPSTONE-2 a confirmé le bénéfice chez le patient à haut risque ; CENTERSTONE (2025) a réduit la transmission domestique confirmée de 13,4 % à 9,5 %.</p><p class="lab">Conséquence clinique</p><p>La dose unique se prend dans les 48 heures : 40 mg de 20 à moins de 80 kg, 80 mg dès 80 kg. Swissmedic autorise le traitement dès 3 mois chez le sujet sain et dès 12 ans chez le patient à risque, et la prophylaxie post-exposition dès 3 mois. Calcium, fer, magnésium, antiacides et laxatifs réduisent son absorption et ne sont pas pris en même temps.</p><div class="key"><b>Limite.</b> La substitution I38T réduit la sensibilité ; elle apparaissait chez environ 10 % des traités de CAPSTONE-1 et 7 % de CENTERSTONE, davantage chez l’enfant et l’immunodéprimé. Les CDC ne le recommandent ni pendant la grossesse ni chez l’hospitalisé.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30184455/" target="_blank" rel="noopener">Hayden et al., CAPSTONE-1, N Engl J Med 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32526195/" target="_blank" rel="noopener">Ison et al., CAPSTONE-2, Lancet Infect Dis 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40267424/" target="_blank" rel="noopener">Monto et al., CENTERSTONE, N Engl J Med 2025</a>.</p></template>
<template data-pop="j09-corticoides" data-title="Corticostéroïdes dans la grippe"><p class="lab">Mécanisme de l’affirmation</p><p>En freinant la réponse immunitaire antivirale, les corticostéroïdes prolongent l’excrétion du virus. La revue Cochrane 2019, surtout observationnelle, associait leur emploi à une mortalité et à des surinfections plus fréquentes, avec un biais d’indication probable.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 déconseille de les donner pour la grippe grave. Une indication propre, comme une exacerbation d’asthme ou de bronchopneumopathie chronique obstructive ou un choc septique réfractaire, reste traitée.</p><div class="key"><b>Limite.</b> Aucun essai randomisé n’établit leur place dans le SDRA grippal, et l’extrapolation depuis la COVID-19 n’est pas validée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30798570/" target="_blank" rel="noopener">Lansbury et al., Cochrane 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse OMS 2024</a>.</p></template>
<template data-pop="j09-antibiotique" data-title="Antibiotique et grippe"><p class="lab">Mécanisme de l’affirmation</p><p>Sans bactérie, l’antibiotique n’apporte qu’effets indésirables, infections à Clostridioides difficile et résistances. Une pneumonie chez un grippé peut toutefois cacher une co-infection qu’aucun examen n’exclut rapidement.</p><p class="lab">Conséquence clinique</p><p>L’ATS et l’IDSA 2019 donnent d’emblée un antibiotique à l’adulte atteint de pneumonie communautaire avec test grippal positif. Le spectre couvre le pneumocoque et Staphylococcus aureus, selon <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>, et l’arrêt est précoce si l’évolution et les cultures n’indiquent pas de bactérie.</p><div class="key"><b>Limite.</b> L’OMS 2024 déconseille l’antibiotique dans la grippe non grave à faible probabilité de co-infection.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31573350/" target="_blank" rel="noopener">Metlay et al., ATS et IDSA 2019</a> ; <a href="https://www.ncbi.nlm.nih.gov/books/NBK607909/" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a>.</p></template>
<template data-pop="j09-isolement" data-title="Isolement et hygiène"><p class="lab">Mécanisme de l’affirmation</p><p>Le virus se transmet par gouttelettes et aérosols à courte distance, et par les mains ou les surfaces. L’excrétion culmine les trois premiers jours, puis décroît avec la fièvre. La friction hydroalcoolique détruit l’enveloppe lipidique du virus.</p><p class="lab">Conséquence clinique</p><p>À domicile, les CDC (mars 2024) autorisent la reprise des activités lorsque les symptômes s’améliorent et que la fièvre a disparu depuis 24 heures sans antipyrétique, avec des précautions renforcées pendant cinq jours. À l’hôpital, ils prévoient des précautions gouttelettes pendant sept jours après le début des symptômes, ou jusqu’à 24 heures après la résolution de la fièvre et des symptômes respiratoires si cette durée est plus longue. Le malade tousse dans le coude, se lave les mains et porte un masque en présence d’autrui.</p><div class="key"><b>Limite.</b> Dans la revue Cochrane 2023, l’hygiène des mains réduisait les infections respiratoires aiguës de 14 %, sans effet significatif sur la grippe confirmée, et le masque communautaire changeait probablement peu le risque. L’enfant et l’immunodéprimé excrètent plus longtemps.</div><p class="src">Références : <a href="https://www.cdc.gov/respiratory-viruses/guidance/index.html" target="_blank" rel="noopener">CDC, Respiratory Virus Guidance, mars 2024</a> ; <a href="https://www.cdc.gov/flu/hcp/infection-control/healthcare-settings.html" target="_blank" rel="noopener">CDC, prévention de la grippe en milieu de soins, mise à jour du 29.09.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36715243/" target="_blank" rel="noopener">Jefferson et al., Cochrane 2023</a>.</p></template>
<template data-pop="j09-vaccin-groupes" data-title="Groupes cibles : Plan de vaccination suisse 2026"><p class="lab">Fonction et cible</p><p>Le plan 2026 vise les femmes enceintes ou accouchées depuis moins de quatre semaines ; les prématurés nés avant 32 semaines ou pesant moins de 1500 g, dès 6 mois et pendant deux hivers ; les personnes dès 6 mois atteintes d’une maladie chronique cardiaque, pulmonaire (notamment asthme), métabolique avec répercussion d’organe (diabète, obésité avec IMC d’au moins 40), neurologique ou musculosquelettique avec répercussion sur ces fonctions, d’une hépatopathie, d’une insuffisance rénale, d’une asplénie ou d’un déficit immunitaire ; les résidents des établissements de soins ; les personnes de 65 ans et plus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces groupes partagent une réserve cardiorespiratoire, métabolique ou immunitaire réduite. L’excrétion virale commence environ un jour avant les symptômes : un soignant infecté transmet en travaillant normalement à des patients qui répondent mal au vaccin.</p><p class="lab">Conséquence clinique</p><p>Le plan recommande aussi la vaccination de l’entourage des personnes à risque et des nourrissons de moins de 6 mois, et de tout le personnel médical, soignant, paramédical, de crèche et d’établissement pour personnes âgées, étudiants et stagiaires compris.</p><div class="key"><b>Limite.</b> Le bénéfice mesuré de la vaccination des soignants sur la mortalité des résidents varie selon les études. Toute personne qui le souhaite peut être vaccinée.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026, chapitres 2 et 3.2</a>.</p></template>
<template data-pop="j09-vaccin-efficacite" data-title="Vaccin grippal inactivé : mécanisme, efficacité, sécurité"><p class="lab">Mécanisme de l’affirmation</p><p>L’hémagglutinine des souches attendues induit des anticorps neutralisants qui empêchent la fixation du virus à l’acide sialique. Ils apparaissent en deux semaines environ, puis déclinent en quelques mois. La protection dépend de la concordance des souches : aux États-Unis, l’efficacité globale contre la grippe confirmée a été estimée à 44 % en 2023–2024, 56 % en 2024–2025 et 36 % en 2025–2026 (estimation préliminaire).</p><p class="lab">Conséquence clinique</p><p>Douleur au point d’injection et fébricule d’un à deux jours sont les effets habituels. Selon l’ACIP, l’allergie à l’œuf n’impose aucune précaution particulière ; une anaphylaxie après une dose antérieure contre-indique le vaccin.</p><div class="key"><b>Limite.</b> Le vaccin pandémique de 2009 était associé à environ 1,6 cas supplémentaire de syndrome de Guillain-Barré par million de vaccinés, un risque comparable à celui des vaccins saisonniers ; la grippe expose davantage à ce syndrome.</div><p class="src">Références : <a href="https://www.cdc.gov/flu-vaccines-work/php/effectiveness-studies/index.html" target="_blank" rel="noopener">CDC, études d’efficacité vaccinale, mise à jour du 16.03.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39197095/" target="_blank" rel="noopener">Grohskopf et al., recommandations ACIP 2024–2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23498095/" target="_blank" rel="noopener">Salmon et al., Lancet 2013</a>.</p></template>
<template data-pop="j09-haute-dose" data-title="Vaccin à dose élevée"><p class="lab">Mécanisme de l’affirmation</p><p>Ce vaccin contient quatre fois plus d’hémagglutinine par souche. L’immunosénescence réduit la réponse des lymphocytes B et T, et une dose d’antigène plus forte compense en partie ce déficit. Dès 65 ans, il réduisait la grippe confirmée de 24,2 % par rapport à la dose standard (Diaz Granados, 2014).</p><p class="lab">Conséquence clinique</p><p>Le plan 2026 le préfère dès 75 ans et dès 65 ans avec un facteur de risque. S’il manque, le vaccin standard reste préférable à l’absence de vaccination.</p><div class="key"><b>Limite.</b> Les réactions locales sont un peu plus fréquentes, et la comparaison avec les vaccins adjuvantés repose sur des données moins solides.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25119609/" target="_blank" rel="noopener">Diaz Granados et al., N Engl J Med 2014</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-pep" data-title="Prophylaxie antivirale post-exposition"><p class="lab">Mécanisme de l’affirmation</p><p>Un antiviral présent lors de l’inoculation limite la réplication initiale ; la revue Cochrane 2014 retrouvait moins de grippes symptomatiques sous oseltamivir prophylactique.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 réserve la prophylaxie de la grippe saisonnière aux personnes à risque très élevé d’hospitalisation, et la recommande après exposition à un virus zoonotique. L’oseltamivir se donne à 75 mg une fois par jour pendant dix jours, débuté dans les 48 heures suivant le contact ; le baloxavir, en dose unique dans le même délai, dès 3 mois.</p><div class="key"><b>Limite.</b> La protection cesse avec le traitement. Une personne déjà symptomatique reçoit une dose curative.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson et al., Cochrane 2014</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse OMS 2024</a>.</p></template>
<template data-pop="j09-grossesse" data-title="Grippe et grossesse"><p class="lab">Mécanisme de l’affirmation</p><p>L’utérus élève le diaphragme et réduit la capacité résiduelle fonctionnelle, tandis que consommation d’oxygène et débit cardiaque augmentent : la réserve face à une pneumonie diminue. L’hypoxémie maternelle prive le fœtus d’oxygène, et la fièvre élevée du premier trimestre est associée à des malformations.</p><p class="lab">Conséquence clinique</p><p>La femme enceinte ou accouchée depuis moins de quatre semaines reçoit l’oseltamivir dès la suspicion, même après 48 heures, et le paracétamol contre la fièvre. Les anticorps vaccinaux transmis par le placenta protègent aussi le nourrisson.</p><div class="key"><b>Limite.</b> L’information professionnelle suisse réserve l’oseltamivir aux situations de nécessité pendant la grossesse ; les données accumulées depuis 2009 sont rassurantes.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC 2026</a> ; <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-ems" data-title="Foyer de grippe en établissement de soins"><p class="lab">Mécanisme de l’affirmation</p><p>Chez le résident âgé, l’immunosénescence atténue la fièvre : la grippe se présente par une confusion, une chute, une anorexie ou une décompensation. Un cas méconnu contamine résidents et personnel.</p><p class="lab">Conséquence clinique</p><p>Devant au moins deux cas respiratoires en quelques jours, l’équipe teste les malades, les isole et les traite. Dès qu’un foyer est confirmé, l’IDSA 2018 recommande une prophylaxie de tous les résidents non malades, vaccinés ou non, pendant au moins deux semaines et jusqu’à une semaine après le dernier cas.</p><div class="key"><b>Limite.</b> La dose de chaque résident s’adapte à sa fonction rénale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-immunodeprime" data-title="Grippe chez le patient immunodéprimé"><p class="lab">Mécanisme de l’affirmation</p><p>Les lymphocytes T cytotoxiques et les anticorps éliminent normalement le virus en une à deux semaines. Sous chimiothérapie, immunosuppresseur ou après greffe, l’excrétion peut durer des semaines : la réplication prolongée sous antiviral sélectionne des mutants résistants, et l’atteinte basse est plus fréquente.</p><p class="lab">Conséquence clinique</p><p>Le patient reçoit l’oseltamivir quel que soit le délai, parfois plus de cinq jours selon les CDC, qui déconseillent le baloxavir en monothérapie chez l’immunodéprimé sévère. Une absence d’amélioration fait rechercher une résistance au laboratoire de référence.</p><div class="key"><b>Limite.</b> La double dose d’oseltamivir n’a pas montré de bénéfice clinique clair. La vaccination de l’entourage compense la faible réponse vaccinale du patient.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC, mis à jour le 10.03.2026</a>.</p></template>
<template data-pop="j09-rein" data-title="Oseltamivir et insuffisance rénale"><p class="lab">Mécanisme de l’affirmation</p><p>Le carboxylate d’oseltamivir est éliminé à plus de 99 % par le rein, par filtration et sécrétion tubulaire. Quand la clairance baisse, sa concentration augmente et expose à davantage d’effets indésirables digestifs et neuropsychiatriques.</p><p class="lab">Conséquence clinique</p><p>Le médecin estime la clairance de la créatinine avant de prescrire et réduit la dose dès 60 mL/min ou moins ; l’onglet Pharmacologie donne les paliers et le schéma en dialyse.</p><div class="key"><b>Limite.</b> Chez le patient grave, la fonction rénale varie vite et la dose se réévalue. Le baloxavir n’est pas éliminé principalement par le rein.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-zoonotique" data-title="Grippe zoonotique : A(H5N1) et autres sous-types aviaires"><p class="lab">Mécanisme de l’affirmation</p><p>Les virus aviaires se fixent de préférence aux acides sialiques liés en alpha-2,3, abondants dans les voies respiratoires basses humaines et rares dans le nez : la transmission interhumaine est faible, mais la pneumonie grave. La co-infection d’une cellule par un virus saisonnier permet un réassortiment génique, source d’un virus pandémique. L’incubation dure de deux à quatorze jours selon l’OFSP.</p><p class="lab">Conséquence clinique</p><p>L’OFSP impose l’isolement et la déclaration téléphonique dans les deux heures de toute suspicion d’infection humaine par un nouveau sous-type. L’oseltamivir débute sans attendre, quel que soit le délai, et les contacts reçoivent une prophylaxie selon l’OMS 2024. Aucun vaccin humain contre la souche actuelle de A(H5N1) n’est autorisé en Suisse.</p><div class="key"><b>Limite.</b> La Suisse ne comptait aucun cas humain confirmé lors de la consultation de la page de l’OFSP. Le code J09 exige l’identification du virus zoonotique ou pandémique.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-aviaire-h5n1-situation-en-suisse" target="_blank" rel="noopener">OFSP, grippe aviaire H5N1, consultée le 08.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse OMS 2024</a>.</p></template>
<template data-pop="j09-criteres" data-title="Origine et limites des critères diagnostiques"><p class="lab">Mécanisme de l’affirmation</p><p>La définition clinique reprend celle du syndrome grippal du réseau de surveillance Sentinella (début brutal, fièvre, toux, signe général) ; elle privilégie la sensibilité, non la certitude individuelle. La confirmation exige la détection du virus, car aucun signe clinique n’est spécifique.</p><p class="lab">Conséquence clinique</p><p>Le dossier mentionne la méthode de confirmation, la gravité et le code : J09 — Grippe à virus d’influenza zoonotique ou pandémique identifié ; J10 — Grippe, à virus d’influenza saisonnière identifié ; J11 — Grippe, virus non identifié.</p><div class="key"><b>Limite.</b> Aucun critère officiel ne définit le diagnostic individuel ; ceux-ci forment un outil pédagogique tiré de la surveillance et des recommandations de l’OMS et de l’IDSA.</div><p class="src">Références : <a href="https://www.ncbi.nlm.nih.gov/books/NBK607909/" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="pareto-j09-pec" data-title="Pareto — Diagnostic, urgences et prise en charge"><p class="ratio" data-cover="j09-7,j09-8,j09-9,j09-10,j09-11,j09-12"></p><ul><li>En période épidémique, la grippe est un diagnostic clinique ; le test sert lorsqu’il change le traitement, l’isolement ou l’orientation, et un test antigénique négatif n’exclut pas.</li><li>Hypoxémie, polypnée, hypotension, confusion ou rechute fébrile après amélioration signalent une grippe grave ou une surinfection à pneumocoque ou staphylocoque.</li><li>Antiviral immédiat chez le patient grave, hospitalisé, enceinte ou immunodéprimé, quel que soit le délai ; dans les 48 heures chez l’ambulatoire à risque.</li><li>Oseltamivir adulte 75 mg deux fois par jour pendant cinq jours, réduit dès une clairance de 60 mL/min ou moins ; baloxavir en dose unique, évité pendant la grossesse.</li><li>Pas d’antibiotique sans argument bactérien, sauf pneumonie confirmée ; pas de corticostéroïde pour la grippe elle-même ; pas d’aspirine chez l’enfant.</li><li>Vaccination annuelle des groupes à risque, de l’entourage et des soignants, de la mi-octobre au début de la vague ; dose élevée dès 75 ans, ou dès 65 ans avec un facteur de risque.</li><li>Suspicion de A(H5N1) après exposition animale : isolement, oseltamivir et déclaration téléphonique dans les deux heures.</li></ul></template>
