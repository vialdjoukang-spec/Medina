<template data-pop="j09-diag-clinique" data-title="Diagnostic clinique de la grippe et circulation virale"><p class="lab">Fonction et cible</p><p>Le diagnostic clinique estime la probabilité de grippe à partir des symptômes et du contexte épidémique, sans test.</p><p class="lab">Mécanisme de l’affirmation</p><p>La valeur prédictive positive d’un signe dépend de la fréquence de la maladie dans la population testée. Pendant une épidémie, la grippe représente une grande part des syndromes fébriles respiratoires ; la même association de signes devient donc plus probante. Dans les essais d’antiviraux menés en saison, l’association de fièvre et de toux apparues depuis moins de 48 heures avait une valeur prédictive positive de 79 % pour une grippe confirmée (Monto, 2000). L’Institut Robert Koch juge que, au pic d’une vague, le tableau typique permet le diagnostic clinique chez la plupart des patients.</p><p class="lab">Conséquence clinique</p><p>En saison, ce diagnostic clinique suffit au patient qui ne recevra ni antiviral ni antibiotique. Dès qu’un antiviral est envisagé, la Société suisse d’infectiologie recommande un test de laboratoire avant de l’instaurer. Hors saison, la même présentation impose un test avant d’attribuer les symptômes à la grippe.</p><div class="key"><b>Limite.</b> Chez le sujet âgé, la fièvre manque souvent et la valeur de ces critères baisse. La co-circulation du SARS-CoV-2 et du VRS diminue aussi la spécificité clinique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></template>
<template data-pop="j09-indication-test" data-title="Indications du test grippal"><p class="lab">Fonction et cible</p><p>Le test identifie le virus influenza dans un prélèvement respiratoire. Il n’est utile que s’il modifie une décision.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez le patient hospitalisé, un résultat positif oriente l’antiviral, l’isolement en chambre et le regroupement des patients ; la Société suisse d’infectiologie demande une PCR grippale chez le patient hospitalisé pour pneumonie communautaire pendant la saison. En établissement de soins, la confirmation des premiers cas déclenche les mesures de contrôle du foyer et la prophylaxie des résidents à très haut risque. Hors saison ou après une exposition animale, le test distingue une grippe d’une autre infection et peut révéler un virus zoonotique.</p><p class="lab">Conséquence clinique</p><p>Selon la Société suisse d’infectiologie, un test spécifique de la grippe n’est recommandé que si un antiviral est envisagé ; le lien épidémiologique et le délai du résultat entrent dans la décision. Un adulte sain ambulatoire avec une grippe non compliquée n’a pas besoin de test.</p><div class="key"><b>Limite.</b> Chez le patient grave, le prélèvement précède l’antiviral, mais le résultat ne retarde pas son instauration ; l’Institut Robert Koch demande d’adapter ensuite le traitement au résultat.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-tests" data-title="Tests antigéniques et tests moléculaires"><p class="lab">Fonction et cible</p><p>Les tests antigéniques détectent la nucléoprotéine virale par immunochromatographie. Les tests moléculaires, dont la PCR, amplifient un segment de l’acide ribonucléique viral.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le test antigénique a besoin d’une grande quantité de protéine virale ; il manque les prélèvements pauvres en virus. L’amplification multiplie la cible et détecte de très faibles quantités. Dans la méta-analyse de Merckx (2017), la sensibilité groupée était d’environ 54 % pour les tests antigéniques rapides classiques, 80 % pour les tests antigéniques à lecture numérique et plus de 90 % pour les tests moléculaires rapides. La spécificité dépassait 98 % pour les trois familles.</p><p class="lab">Conséquence clinique</p><p>Un test positif est fiable, mais la Société suisse d’infectiologie ne recommande pas les tests antigéniques rapides chez l’adulte, faute de valeur prédictive négative suffisante ; la PCR est le test de choix, éventuellement au lieu de soins. L’Institut Robert Koch précise qu’un écouvillonnage nasal est plus sensible qu’un prélèvement de gorge.</p><div class="key"><b>Limite.</b> La probabilité d’un test positif diminue après les deux premiers jours de maladie, car l’excrétion virale décroît. Une PCR peut rester positive après la guérison et ne prouve pas à elle seule la contagiosité.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28869986/" target="_blank" rel="noopener">Merckx et al., Ann Intern Med 2017</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-ddx-sepsis" data-title="Sepsis bactérien : le diagnostic à ne pas manquer"><p class="lab">Fonction et cible</p><p>Le sepsis est une dysfonction d’organe menaçant la vie, causée par une réponse dérégulée à une infection.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre, les frissons, les myalgies et le malaise sont produits par les cytokines de l’hôte ; ils ne distinguent pas un virus d’une bactérie. Une hypotension, des marbrures ou une confusion traduisent une hypoperfusion d’organe, rare dans une grippe non compliquée.</p><p class="lab">Conséquence clinique</p><p>Un patient fébrile avec un signe d’hypoperfusion reçoit des hémocultures puis un antibiotique sans attendre le test grippal. Une méningococcie, une pyélonéphrite ou une endocardite peuvent débuter comme un « syndrome grippal ». La prise en charge est détaillée dans <a href="#/entry/A41">A41 — Sepsis et choc septique de l’adulte</a>.</p><div class="key"><b>Limite.</b> La grippe elle-même peut provoquer un sepsis viral ; un test grippal positif n’exclut pas une infection bactérienne associée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26903338/" target="_blank" rel="noopener">Singer et al., définitions Sepsis-3, 2016</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></template>
<template data-pop="j09-ddx-pneumonie" data-title="Pneumonie bactérienne ou pneumonie grippale"><p class="lab">Fonction et cible</p><p>Une pneumonie est une infection du parenchyme pulmonaire qui altère l’échange gazeux. La Société suisse d’infectiologie la définit par un nouvel infiltrat à l’imagerie associé à des symptômes d’infection respiratoire basse.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un foyer de crépitants localisé, une matité ou un souffle tubaire traduisent un comblement alvéolaire. Une aggravation après quelques jours d’amélioration oriente vers une surinfection bactérienne ; une dyspnée progressive dès le début oriente vers une pneumonie virale.</p><p class="lab">Conséquence clinique</p><p>Le médecin recherche ces signes, mesure la saturation et demande une imagerie thoracique en cas de suspicion de pneumonie. L’évaluation de gravité par le score CRB-65 et le choix de l’antibiotique suivent la directive suisse et <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>.</p><div class="key"><b>Limite.</b> La procalcitonine et la CRP ne séparent pas de façon fiable une pneumonie virale d’une co-infection bactérienne ; une valeur basse ne suffit pas à suspendre un antibiotique chez un patient grave.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></template>
<template data-pop="j09-ddx-covid" data-title="COVID-19 et grippe"><p class="lab">Fonction et cible</p><p>Le SARS-CoV-2 et le virus influenza infectent tous deux l’épithélium respiratoire et circulent souvent en même temps en hiver.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les deux infections déclenchent la même réponse interféron et cytokinique ; fièvre, toux et myalgies sont donc communes. L’ECDC souligne qu’il est difficile de les distinguer sur les seuls symptômes et qu’une RT-PCR multiplex détecte dans le même prélèvement les grippes A et B et le SARS-CoV-2.</p><p class="lab">Conséquence clinique</p><p>La Société suisse d’infectiologie recommande un test moléculaire du SARS-CoV-2 lorsque le résultat modifie la prise en charge d’un patient à haut risque, et un test de la grippe lorsqu’un antiviral est envisagé. Les traitements et l’isolement diffèrent selon le virus.</p><div class="key"><b>Limite.</b> Aucun signe clinique isolé ne permet de trancher ; le test est nécessaire lorsque la décision en dépend. Une co-infection est possible.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></template>
<template data-pop="j09-ddx-vrs" data-title="Virus respiratoire syncytial chez l’adulte"><p class="lab">Fonction et cible</p><p>Le VRS infecte l’épithélium bronchiolaire. Il est connu chez le nourrisson, mais il cause aussi des hospitalisations chez l’adulte âgé et chez l’insuffisant cardiaque ou respiratoire.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’atteinte des petites voies aériennes provoque des sifflements et une obstruction ; la fièvre est souvent plus modérée que dans la grippe. Chez le sujet âgé, la décompensation cardiaque ou respiratoire peut dominer le tableau.</p><p class="lab">Conséquence clinique</p><p>Le diagnostic repose sur le test moléculaire. Il évite un antiviral grippal inutile et oriente la prévention : depuis le 1er septembre 2025, l’OFSP recommande la vaccination contre le VRS à toutes les personnes de 75 ans et plus et aux adultes de 60 ans et plus à risque élevé, selon une recommandation publiée à part du Plan de vaccination suisse 2026.</p><div class="key"><b>Limite.</b> L’adulte ne dispose pas d’antiviral spécifique couramment recommandé contre le VRS ; le traitement est symptomatique et vise les décompensations.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026, remarques préliminaires</a> ; <a href="https://www.bag.admin.ch/fr/virus-respiratoire-syncytial-humain-vrs" target="_blank" rel="noopener">OFSP, virus respiratoire syncytial humain</a>.</p></template>
<template data-pop="j09-gravite" data-title="Signes de gravité de la grippe"><p class="lab">Fonction et cible</p><p>Les signes de gravité repèrent une défaillance respiratoire, circulatoire ou neurologique qui exige une surveillance hospitalière.</p><p class="lab">Mécanisme de l’affirmation</p><p>Selon la Société suisse d’infectiologie, une saturation inférieure à 92 % en air ambiant est un signal d’alarme. Elle indique que l’oxygénation artérielle se rapproche de la partie pentue de la courbe de dissociation de l’hémoglobine : une faible baisse supplémentaire de la pression partielle en oxygène fait alors chuter la saturation. Une fréquence respiratoire de 30 par minute ou plus traduit un travail respiratoire élevé, critère retenu dans le score CRB-65. Une hypotension et une confusion signalent une hypoperfusion d’organe.</p><p class="lab">Conséquence clinique</p><p>Ces patients sont évalués à l’hôpital. Le prélèvement virologique précède l’oseltamivir, dont l’instauration n’attend pas le résultat ; une imagerie thoracique, une gazométrie si l’oxygénation est altérée et une recherche de surinfection complètent le bilan.</p><div class="key"><b>Limite.</b> Chez le patient atteint de bronchopneumopathie chronique obstructive, la saturation habituelle peut être plus basse ; c’est la baisse par rapport à la valeur de base qui compte. Un sujet âgé peut être grave sans fièvre.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-pneumonie-virale" data-title="Pneumonie virale primaire"><p class="lab">Fonction et cible</p><p>Les pneumocytes de type I assurent l’échange gazeux ; les pneumocytes de type II produisent le surfactant et régénèrent l’épithélium.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus atteint les alvéoles, infecte et détruit les pneumocytes, puis déclenche une inflammation intense. Les alvéoles se remplissent d’un exsudat riche en protéines. La perfusion de ces territoires non ventilés crée un effet shunt et une hypoxémie peu corrigée par l’oxygène. L’Institut Robert Koch range cette pneumonie grippale primaire parmi les trois complications pulmonaires principales.</p><p class="lab">Conséquence clinique</p><p>La dyspnée progresse dès les premiers jours, la radiographie montre des opacités bilatérales et l’auscultation peut être pauvre. Le patient nécessite oxygène, oseltamivir et surveillance intensive.</p><div class="key"><b>Limite.</b> La distinction avec une co-infection bactérienne précoce est difficile ; la pneumonie sévère reçoit d’emblée l’antibiothérapie de la directive suisse des pneumonies communautaires, réévaluée selon les cultures.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j09-sdra" data-title="Syndrome de détresse respiratoire aiguë grippal"><p class="lab">Fonction et cible</p><p>La barrière alvéolocapillaire sépare l’air alvéolaire du sang et empêche le passage du liquide plasmatique.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’agression virale et la réponse inflammatoire lèsent l’épithélium et l’endothélium. Un œdème lésionnel, non cardiogénique, remplit les alvéoles ; le surfactant est inactivé, la compliance pulmonaire chute et l’hypoxémie devient sévère.</p><p class="lab">Conséquence clinique</p><p>Le patient relève des soins intensifs : ventilation protectrice, décubitus ventral si l’hypoxémie est sévère, et oxygénation par membrane extracorporelle (ECMO) dans les formes réfractaires, comme pendant la pandémie de 2009.</p><div class="key"><b>Limite.</b> Le SDRA grippal n’a pas de traitement spécifique autre que l’antiviral ; l’OMS 2024 recommande, de façon conditionnelle, de ne pas utiliser les corticostéroïdes dans la grippe grave.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.202303-0558WS" target="_blank" rel="noopener">Matthay et al., définition globale du syndrome de détresse respiratoire aiguë, 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a>.</p></template>
<template data-pop="j09-surinfection-pec" data-title="Surinfection bactérienne après grippe"><p class="lab">Fonction et cible</p><p>L’épithélium cilié et le mucus éliminent les bactéries inhalées ; les macrophages alvéolaires les phagocytent.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium cilié et expose la membrane basale, sur laquelle les bactéries adhèrent. La neuraminidase virale clive les acides sialiques et démasque des récepteurs bactériens. La réponse interféron diminue temporairement l’efficacité des macrophages et des neutrophiles. Les études des poumons de 1918 montrent qu’une pneumonie bactérienne était présente dans la grande majorité des décès (Morens, 2008).</p><p class="lab">Conséquence clinique</p><p>Les germes principaux sont <i>Streptococcus pneumoniae</i>, <i>Staphylococcus aureus</i> et <i>Haemophilus influenzae</i>. Devant une surinfection d’une grippe à <i>Staphylococcus aureus</i>, la Société suisse d’infectiologie ajoute la clindamycine ou le linézolide jusqu’à l’exclusion d’une toxine de Panton-Valentine, toxine nécrosante de ce germe. Une fièvre qui réapparaît après amélioration impose un examen et une imagerie.</p><div class="key"><b>Limite.</b> La chronologie typique n’est pas absolue : une co-infection peut être présente dès l’admission.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., J Infect Dis 2008</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-decompensation-pec" data-title="Décompensation des maladies chroniques"><p class="lab">Fonction et cible</p><p>Les réserves cardiaques, respiratoires et métaboliques permettent de faire face à une augmentation brutale de la demande.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre augmente la consommation d’oxygène et la fréquence cardiaque. L’inflammation systémique favorise la rétention hydrosodée, la vasoconstriction pulmonaire hypoxique et l’instabilité de la plaque coronaire. Chez le diabétique, les hormones de stress augmentent la glycémie et peuvent déclencher une acidocétose. L’inflammation bronchique aggrave l’obstruction d’un asthme ou d’une bronchopneumopathie chronique obstructive.</p><p class="lab">Conséquence clinique</p><p>Une grippe chez un insuffisant cardiaque se présente souvent comme une décompensation cardiaque. Le médecin traite la grippe et la décompensation : voir <a href="#/entry/I50">I50 — Insuffisance cardiaque</a>, <a href="#/entry/J44">J44 — Bronchopneumopathie chronique obstructive</a> et <a href="#/entry/J45">J45 — Asthme</a>.</p><div class="key"><b>Limite.</b> L’attribution à la grippe exige un test lorsque la présentation n’est pas typique ; une autre cause de décompensation reste possible.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., N Engl J Med 2018</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-infarctus" data-title="Grippe et infarctus du myocarde"><p class="lab">Fonction et cible</p><p>La plaque coronaire stable possède une chape fibreuse qui l’isole du sang circulant.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’inflammation systémique active les macrophages de la plaque, fragilise la chape et augmente la coagulabilité. La tachycardie et l’hypoxémie accroissent la demande en oxygène du myocarde. Dans une étude canadienne en série de cas autocontrôlée, l’incidence de l’infarctus était environ six fois plus élevée dans les sept jours suivant une grippe confirmée (rapport d’incidence 6,05) que pendant les périodes de référence.</p><p class="lab">Conséquence clinique</p><p>Une douleur thoracique pendant une grippe justifie un électrocardiogramme et un dosage de troponine. Ce lien soutient aussi la vaccination des patients coronariens.</p><div class="key"><b>Limite.</b> Il s’agit d’une association temporelle observée ; elle est cohérente avec un mécanisme plausible mais ne quantifie pas le bénéfice individuel du vaccin.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., N Engl J Med 2018</a>.</p></template>
<template data-pop="j09-myocardite" data-title="Myocardite grippale"><p class="lab">Fonction et cible</p><p>Les cardiomyocytes assurent la contraction ; leur atteinte réduit la fonction ventriculaire et perturbe la conduction électrique.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’ECDC et l’Institut Robert Koch comptent la myocardite parmi les atteintes d’organe de la grippe sévère, potentiellement mortelle. La nécrose myocytaire libère la troponine ; l’œdème et l’inflammation provoquent arythmies et baisse de la fraction d’éjection.</p><p class="lab">Conséquence clinique</p><p>Douleur thoracique, dyspnée disproportionnée, tachycardie inexpliquée ou choc font demander un électrocardiogramme, une troponine et une échocardiographie. La prise en charge suit <a href="#/entry/I40">I40 — Myocardite</a>.</p><div class="key"><b>Limite.</b> Une troponine élevée pendant une grippe grave peut aussi traduire une souffrance myocardique par hypoxémie ou un infarctus ; l’imagerie précise le mécanisme.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus du myocarde après grippe confirmée, N Engl J Med 2018</a>.</p></template>
<template data-pop="j09-encephalite" data-title="Encéphalopathie et encéphalite grippales"><p class="lab">Fonction et cible</p><p>La barrière hématoencéphalique protège le cerveau de l’inflammation systémique.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’ECDC et l’Institut Robert Koch citent l’encéphalite parmi les complications graves de la grippe ; l’Institut Robert Koch signale aussi des encéphalopathies chez l’enfant. L’atteinte est surtout attribuée à la réaction inflammatoire de l’hôte plutôt qu’à une réplication virale cérébrale.</p><p class="lab">Conséquence clinique</p><p>Une confusion, des convulsions ou un coma pendant une grippe imposent une imagerie cérébrale, une ponction lombaire si elle n’est pas contre-indiquée, et la recherche d’une autre cause, notamment d’une méningite bactérienne.</p><div class="key"><b>Limite.</b> Chez le sujet âgé, une confusion est plus souvent due à la fièvre, à la déshydratation ou à l’hypoxémie qu’à une encéphalite.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-rhabdo" data-title="Myosite et rhabdomyolyse"><p class="lab">Fonction et cible</p><p>Les fibres musculaires contiennent la myoglobine et la créatine kinase, qui restent intracellulaires lorsque la membrane est intacte.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’Institut Robert Koch décrit la myosite et la rhabdomyolyse parmi les atteintes d’organe de la grippe, ainsi que la myosite aiguë bénigne de l’enfant, observée surtout lors de fortes circulations de grippe B, avec des douleurs des deux mollets. Dans la rhabdomyolyse, la destruction musculaire libère la myoglobine, qui précipite dans les tubules rénaux et peut provoquer une insuffisance rénale aiguë.</p><p class="lab">Conséquence clinique</p><p>Des douleurs musculaires intenses, une faiblesse ou des urines foncées font doser la créatine kinase, la créatinine et le potassium. L’hydratation intraveineuse protège le rein.</p><div class="key"><b>Limite.</b> Les myalgies banales de la grippe ne justifient pas de dosage systématique ; c’est l’intensité, la faiblesse ou la couleur des urines qui orientent.</div><p class="src">Références : <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-reye" data-title="Syndrome de Reye"><p class="lab">Fonction et cible</p><p>Les mitochondries hépatiques assurent la bêta-oxydation des acides gras et l’élimination de l’ammoniac par le cycle de l’urée.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’association d’une infection virale, notamment grippale ou varicelleuse, et de l’acide acétylsalicylique chez l’enfant provoque une atteinte mitochondriale diffuse. L’Institut Robert Koch décrit une encéphalopathie aiguë associée à une dégénérescence graisseuse du foie.</p><p class="lab">Conséquence clinique</p><p>L’Institut Robert Koch contre-indique les salicylés chez l’enfant grippé ; l’information suisse d’Aspirine 500 ne l’autorise chez l’adolescent dès 12 ans fébrile ou atteint d’une infection virale que sur prescription et en deuxième intention.</p><div class="key"><b>Limite.</b> Le syndrome de Reye est très rare selon l’information suisse ; sa gravité justifie néanmoins la règle de prudence chez l’enfant et l’adolescent.</div><p class="src">Références : <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://compendium.ch/fr/product/110558-aspirine-cpr-eff-500-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse Aspirine® 500, Swissmedic (AIPS), consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-hospitalisation" data-title="Critères d’orientation hospitalière"><p class="lab">Fonction et cible</p><p>L’hospitalisation permet l’oxygénothérapie, la surveillance continue et le traitement des complications.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une pneumonie, une instabilité hémodynamique ou une confusion indiquent une défaillance qui peut s’aggraver en quelques heures. L’incapacité à boire expose à la déshydratation et à l’insuffisance rénale. Une décompensation cardiaque ou respiratoire exige un traitement que le domicile ne permet pas toujours.</p><p class="lab">Conséquence clinique</p><p>Pour l’infection respiratoire aiguë, la Société suisse d’infectiologie fait envisager l’hospitalisation devant une mauvaise impression générale, une systolique inférieure à 90 mmHg, une fréquence respiratoire de 30 par minute ou plus, une saturation inférieure à 92 %, des hémoptysies, un stridor, une maladie pulmonaire sévère ou une immunodéficience sévère. En cas de pneumonie, elle retient un score CRB-65 d’au moins 1 point, sauf l’âge seul, une saturation inférieure à 90 % en air ambiant, des comorbidités instables, une complication ou des facteurs sociaux.</p><div class="key"><b>Limite.</b> Les scores de pneumonie n’ont pas été construits pour la grippe ; ils sous-estiment la gravité chez l’adulte jeune hypoxémique.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j09-delai-pec" data-title="Délai de 48 heures et patient hospitalisé"><p class="lab">Fonction et cible</p><p>Les antiviraux bloquent la libération des virions ou la transcription virale ; ils n’agissent que sur un virus qui se réplique encore.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez l’adulte immunocompétent, la réplication culmine dans les premiers jours, puis décroît. Les essais ambulatoires, qui ont inclus des patients dans les 48 heures, ont montré un raccourcissement des symptômes d’environ un jour. Chez le patient hospitalisé ou immunodéprimé, la réplication dure plus longtemps ; selon l’ECDC, des études observationnelles associent un traitement commencé jusqu’à quatre à cinq jours après le début à une mortalité plus basse chez l’hospitalisé.</p><p class="lab">Conséquence clinique</p><p>La Société suisse d’infectiologie prescrit l’oseltamivir pendant 5 jours au patient hospitalisé dont les symptômes évoluent depuis moins de 48 heures ; chez le patient en état critique dont les symptômes durent depuis plus longtemps, elle relève un bénéfice observationnel sur la mortalité. La directive de l’Hôpital cantonal de Saint-Gall, à laquelle renvoie la directive suisse des pneumonies, envisage le traitement au-delà de 48 heures aux soins intensifs, en cas de besoin élevé en oxygène, d’immunodépression sévère ou d’évolution grave.</p><div class="key"><b>Limite.</b> Le bénéfice d’un traitement tardif repose sur des données observationnelles, avec un risque de biais. L’information professionnelle suisse de Tamiflu demande un début le jour de l’apparition des symptômes ou le lendemain et signale l’absence de données contrôlées chez le patient assez grave pour être hospitalisé ; l’usage au-delà relève de la recommandation clinique.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://kssg.guidelines.ch/guideline/1727/de" target="_blank" rel="noopener">Hôpital cantonal de Saint-Gall, directive Influenza (Saisonale Grippe) Therapie, version validée le 15.01.2026</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/Scientific-advice-neuraminidase-inhibitors-2017.pdf" target="_blank" rel="noopener">ECDC, avis d’experts sur les inhibiteurs de la neuraminidase, 2017</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-contentieux" data-title="Contentieux : quel antiviral chez le patient ambulatoire à haut risque ?"><p class="lab">Fonction et cible</p><p>La question porte sur la grippe non sévère du patient ambulatoire à haut risque de complication.</p><p class="lab">Mécanisme de l’affirmation</p><p><b>OMS, septembre 2024.</b> L’OMS suggère le baloxavir dans les 2 jours pour la grippe non sévère à haut risque (recommandation conditionnelle, preuves de faible qualité). Elle recommande fortement de ne pas donner l’oseltamivir dans la grippe non sévère, faute d’effet important sur les hospitalisations, et suggère l’oseltamivir dans la grippe sévère.</p><p><b>Société suisse d’infectiologie, directive validée le 01.09.2026.</b> Le baloxavir en dose unique, après un test et dans les 48 heures, est l’antiviral proposé au patient ambulatoire à haut risque. Ses experts n’en recommandent cependant pas l’usage systématique : les preuves sont peu solides, le traitement n’est pas remboursé et le délai de 48 heures est difficile à tenir. Ils le réservent au très haut risque, soit 85 ans et plus ou immunodépression, et l’excluent pendant la grossesse.</p><p class="lab">Conséquence clinique</p><p>La source la plus récente, suisse, est retenue : pas d’antiviral systématique chez le patient ambulatoire à haut risque, baloxavir en dose unique chez le patient à très haut risque vu dans les 48 heures, oseltamivir chez le patient hospitalisé. Le patient est informé du coût et de l’effet limité, de l’ordre d’un jour de symptômes en moins. Le baloxavir réduit aussi la transmission domestique confirmée dans l’essai CENTERSTONE.</p><div class="key"><b>Limite.</b> Le texte de l’OMS 2024 demeure applicable et accessible ; sa préférence pour le baloxavir chez tout patient à haut risque repose sur une recommandation conditionnelle. L’évaluation de l’OFSP du 11.04.2025 confirme un effet d’environ un jour sur les symptômes pour les deux molécules, sans effet démontré sur la mortalité ; elle sert la réserve pandémique et non la prescription individuelle.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/hkgFTLg65Zo8/h0087tflu-hta-report.pdf" target="_blank" rel="noopener">OFSP, évaluation des technologies de la santé oseltamivir et baloxavir, rapport du 11.04.2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40267424/" target="_blank" rel="noopener">Monto et al., CENTERSTONE, N Engl J Med 2025</a>.</p></template>
<template data-pop="j09-oseltamivir" data-title="Oseltamivir"><p class="lab">Fonction et cible</p><p>L’oseltamivir est une prodrogue orale transformée par des estérases, surtout hépatiques, en carboxylate d’oseltamivir, qui inhibe la neuraminidase des virus influenza A et B.</p><p class="lab">Mécanisme de l’affirmation</p><p>La neuraminidase clive l’acide sialique et libère les nouveaux virions de la cellule infectée. Son inhibition retient les virions à la surface cellulaire et limite la propagation d’une cellule à l’autre. Dans l’évaluation de l’OFSP de 2025, l’oseltamivir réduisait les complications grippales de 13 % à 8 % et l’usage d’antibiotiques de 15 % à 10 % chez les patients dont la grippe était confirmée, et raccourcissait les symptômes d’environ un jour, sans effet démontré sur la mortalité ni sur les premières hospitalisations. La revue Cochrane de 2014 retrouvait un gain de 16,8 heures chez l’adulte.</p><p class="lab">Conséquence clinique</p><p>Le schéma adulte est de 75 mg deux fois par jour pendant cinq jours, selon l’information professionnelle suisse. Les nausées et vomissements sont les effets indésirables principaux ; une prise avec un repas les réduit. La dose est réduite dès que la clairance de la créatinine est de 60 mL/min ou moins. Le détail se trouve dans l’onglet Pharmacologie.</p><div class="key"><b>Limite.</b> Une mutation de la neuraminidase en position 275 confère une résistance aux virus A(H1N1) ; elle reste rare dans les virus saisonniers actuels mais apparaît chez l’immunodéprimé traité.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/hkgFTLg65Zo8/h0087tflu-hta-report.pdf" target="_blank" rel="noopener">OFSP, évaluation des technologies de la santé oseltamivir et baloxavir, rapport du 11.04.2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25640810/" target="_blank" rel="noopener">Dobson et al., Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson et al., Cochrane 2014</a>.</p></template>
<template data-pop="j09-baloxavir" data-title="Baloxavir marboxil"><p class="lab">Fonction et cible</p><p>Le baloxavir marboxil est une prodrogue orale hydrolysée en baloxavir, qui inhibe l’endonucléase dépendante de la coiffe de la polymérase virale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus « vole » la coiffe des acides ribonucléiques messagers cellulaires pour amorcer la transcription de ses propres gènes. L’inhibition de cette endonucléase bloque la synthèse des protéines virales dès le début du cycle. Dans CAPSTONE-1, le délai de soulagement était semblable à celui de l’oseltamivir et plus court que sous placebo ; CAPSTONE-2 a confirmé le bénéfice chez les patients à haut risque. CENTERSTONE (2025) a réduit la transmission confirmée aux contacts domestiques de 13,4 % à 9,5 %.</p><p class="lab">Conséquence clinique</p><p>Une seule dose orale, adaptée au poids, se prend dans les 48 heures. En Suisse, il est autorisé dès 3 mois dans la grippe non compliquée de la personne par ailleurs en bonne santé, dès 12 ans chez la personne à risque élevé de complication, et dès 3 mois en prophylaxie post-exposition. La Société suisse d’infectiologie le réserve, en traitement ambulatoire, au patient à très haut risque. Les produits contenant des cations polyvalents (calcium, fer, magnésium, laxatifs, antiacides) réduisent son absorption et ne doivent pas être pris en même temps.</p><div class="key"><b>Limite.</b> Des virus porteurs d’une substitution de l’endonucléase réduisant la sensibilité apparaissent chez environ 10 % des patients traités dans CAPSTONE-1 et 7 % dans CENTERSTONE, davantage chez l’enfant et l’immunodéprimé. La Société suisse d’infectiologie ne le recommande pas pendant la grossesse et juge les données insuffisantes chez le patient hospitalisé.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30184455/" target="_blank" rel="noopener">Hayden et al., CAPSTONE-1, N Engl J Med 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32526195/" target="_blank" rel="noopener">Ison et al., CAPSTONE-2, Lancet Infect Dis 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40267424/" target="_blank" rel="noopener">Monto et al., CENTERSTONE, N Engl J Med 2025</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></template>
<template data-pop="j09-symptomatique" data-title="Traitement symptomatique de la grippe"><p class="lab">Fonction et cible</p><p>Le traitement symptomatique soulage la fièvre, la douleur, la toux et la déshydratation sans agir sur le virus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le paracétamol et les anti-inflammatoires non stéroïdiens réduisent la synthèse centrale des prostaglandines qui élève la consigne thermique hypothalamique et sensibilise les nocicepteurs. La fièvre et la tachypnée augmentent les pertes hydriques insensibles ; la boisson compense ces pertes.</p><p class="lab">Conséquence clinique</p><p>La Société suisse d’infectiologie réserve les anti-inflammatoires non stéroïdiens à l’adulte qui présente une fièvre, des céphalées ou des myalgies. Le dextrométhorphane peut soulager une toux sèche, avec une efficacité contestée ; la codéine ne fait pas mieux que le placebo. Le miel réduit la fréquence des quintes et améliore le sommeil, l’association lierre et thym peut soulager la toux ; les antihistaminiques et les décongestionnants apportent peu. Le paracétamol respecte la dose maximale de l’information professionnelle et se réduit en cas d’hépatopathie ou de dénutrition.</p><div class="key"><b>Limite.</b> L’acide acétylsalicylique est contre-indiqué chez l’enfant grippé en raison du syndrome de Reye. Les bronchodilatateurs ne se justifient que si la toux traduit l’aggravation d’une maladie bronchique connue, comme l’asthme.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://compendium.ch/fr/product/1547675-paracetamol-sandoz-eco-cpr-500-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse Paracétamol Sandoz eco®, Swissmedic (AIPS), consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-corticoides" data-title="Corticostéroïdes dans la grippe"><p class="lab">Fonction et cible</p><p>Les corticostéroïdes inhibent la transcription des gènes inflammatoires et la réponse immunitaire adaptative.</p><p class="lab">Mécanisme de l’affirmation</p><p>En diminuant la réponse immunitaire antivirale, ils prolongent l’excrétion du virus. Une revue Cochrane de 2019, fondée surtout sur des études observationnelles, associait leur emploi à une mortalité et à des surinfections plus fréquentes, avec un risque élevé de biais d’indication.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 formule une recommandation conditionnelle contre les corticostéroïdes dans la grippe sévère. La Société suisse d’infectiologie, qui les recommande dans la pneumonie communautaire sévère, demande de les éviter chez le patient grippé, sauf autre indication, par exemple une exacerbation d’asthme ou de bronchopneumopathie chronique obstructive.</p><div class="key"><b>Limite.</b> Leur place dans le SDRA grippal n’est pas établie par des essais randomisés spécifiques ; l’extrapolation depuis la COVID-19 n’est pas validée pour l’influenza.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30798570/" target="_blank" rel="noopener">Lansbury et al., Cochrane 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j09-antibiotique" data-title="Antibiotique et grippe"><p class="lab">Fonction et cible</p><p>L’antibiotique cible une bactérie ; il n’a aucune action sur le virus influenza.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une antibiothérapie sans infection bactérienne expose aux effets indésirables, aux infections à <i>Clostridioides difficile</i> et à la sélection de résistances, sans bénéfice. En revanche, une pneumonie confirmée chez un patient grippé peut être une co-infection bactérienne qu’aucun examen n’exclut rapidement.</p><p class="lab">Conséquence clinique</p><p>La Société suisse d’infectiologie ne recommande pas d’antibiotique chez le patient grippé dont la suspicion de surinfection est faible. Devant une toux aiguë avec fièvre de 38,5 °C ou plus depuis plus de 3 jours, dyspnée, fréquence respiratoire de 22 par minute ou plus, anomalie focale à l’auscultation ou pouls de 100 par minute ou plus, elle fait doser la CRP : une valeur de 100 mg/L ou plus fait envisager l’antibiotique, une valeur inférieure à 50 mg/L le traitement symptomatique, et la zone intermédiaire relève de la décision partagée. Une pneumonie se traite selon la directive suisse et <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>.</p><div class="key"><b>Limite.</b> L’OMS 2024 recommande fortement de ne pas donner d’antibiotique dans la grippe non sévère à faible probabilité de co-infection bactérienne ; une grippe sans pneumonie ne justifie pas d’antibiotique préventif.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a>.</p></template>
<template data-pop="j09-isolement" data-title="Isolement du patient grippé"><p class="lab">Fonction et cible</p><p>L’isolement réduit le nombre de contacts exposés pendant la période d’excrétion virale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus se transmet surtout par gouttelettes et par contact avec des mains ou surfaces contaminées. L’excrétion commence la veille des symptômes et dure cinq à sept jours ; elle est plus longue chez l’enfant, la personne âgée et l’immunodéprimé.</p><p class="lab">Conséquence clinique</p><p>À domicile, l’ECDC conseille de rester chez soi au moins 24 heures après la disparition de la fièvre et le début de l’amélioration de la toux. En milieu de soins, l’Institut Robert Koch prévoit une chambre individuelle pendant 7 jours à partir du début des symptômes, avec blouse, gants et masque médical pour entrer dans la chambre, selon le protocole d’hygiène de l’établissement.</p><div class="key"><b>Limite.</b> L’enfant et l’immunodéprimé excrètent le virus plus longtemps ; un soignant malade ne doit pas travailler auprès de patients vulnérables pendant sa période contagieuse.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p></template>
<template data-pop="j09-vaccin-groupes" data-title="Groupes à risque de complications : Plan de vaccination suisse 2026"><p class="lab">Fonction et cible</p><p>Le plan désigne les personnes chez qui la grippe cause plus souvent hospitalisation ou décès.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le plan 2026 cite comme personnes à risque accru de complications : les femmes enceintes ou ayant accouché dans les quatre semaines précédentes ; les prématurés nés avant 32 semaines ou pesant moins de 1500 g, dès 6 mois pendant les deux premiers hivers ; les personnes dès 6 mois atteintes de façon chronique d’une affection cardiaque, pulmonaire (en particulier asthme), métabolique avec répercussion cardiaque, pulmonaire ou rénale (par exemple diabète ou obésité avec un IMC d’au moins 40), neurologique ou musculosquelettique avec répercussion sur ces fonctions, d’une hépatopathie, d’une insuffisance rénale, d’une asplénie ou dysfonction splénique, hémoglobinopathies comprises, ou d’un déficit immunitaire ; les résidents des maisons de soins et des établissements pour malades chroniques. Les personnes de 65 ans et plus, dont le risque de forme grave est accru, relèvent d’une vaccination complémentaire, recommandée en premier lieu pour leur protection individuelle.</p><p class="lab">Conséquence clinique</p><p>Chaque groupe partage une réserve cardiorespiratoire, métabolique ou immunitaire réduite. La vaccination de l’entourage protège aussi ceux qui répondent mal au vaccin, comme le grand immunodéprimé et le nourrisson de moins de 6 mois.</p><div class="key"><b>Limite.</b> Le plan permet aussi la vaccination de toute personne qui souhaite réduire son risque pour des raisons privées ou professionnelles.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026, chapitres 2 et 3.2</a>.</p></template>
<template data-pop="j09-soignants" data-title="Vaccination du personnel de santé"><p class="lab">Fonction et cible</p><p>La vaccination du soignant protège d’abord ses patients, puis lui-même et la continuité des soins.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’excrétion virale commence environ un jour avant les symptômes, et une partie des infections reste peu symptomatique. Un soignant infecté peut donc transmettre le virus en travaillant normalement. Ses patients âgés ou immunodéprimés répondent moins bien au vaccin et dépendent de la protection de leur entourage.</p><p class="lab">Conséquence clinique</p><p>Le plan 2026 recommande la vaccination à tout le personnel médical, soignant et paramédical, au personnel des crèches et des établissements pour personnes âgées, y compris aux étudiants et stagiaires.</p><div class="key"><b>Limite.</b> Le bénéfice mesuré sur la mortalité des résidents varie selon les études ; la recommandation se fonde sur l’ensemble des données de transmission et de protection.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-vaccin-efficacite" data-title="Vaccin grippal inactivé : mécanisme, efficacité, sécurité"><p class="lab">Fonction et cible</p><p>Le vaccin inactivé contient l’hémagglutinine des souches attendues, fragmentée ou purifiée. Il induit des anticorps neutralisants dirigés contre la tête de l’hémagglutinine.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces anticorps empêchent la fixation du virus à l’acide sialique cellulaire. Ils apparaissent en deux semaines environ et diminuent au cours des mois suivants. La protection dépend de la concordance entre les souches vaccinales et les virus circulants : l’OFSP estime l’efficacité entre 20 et 80 % selon la saison et les personnes, et l’Institut Robert Koch entre 40 et 60 % contre la grippe confirmée, les valeurs hautes lors des saisons de bonne concordance.</p><p class="lab">Conséquence clinique</p><p>Selon l’OFSP, le vaccin atténue souvent les symptômes et rend les complications graves plus rares même lorsqu’il n’empêche pas l’infection. Jusqu’à 25 % des personnes vaccinées ont une douleur ou une rougeur locale, et environ 5 % une fébricule, des myalgies ou un malaise passagers. En Suisse, l’information professionnelle du vaccin fait foi pour les contre-indications : celle d’Efluelda contre-indique le vaccin en cas d’hypersensibilité aux traces d’œuf ou de formaldéhyde.</p><div class="key"><b>Limite.</b> L’efficacité est souvent réduite chez la personne âgée, immunodéprimée ou atteinte de maladie chronique. Un syndrome de Guillain-Barré survenu dans les 6 semaines après une vaccination grippale antérieure impose une évaluation individuelle selon l’information suisse d’Efluelda.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse Efluelda TIV®, Swissmedic (AIPS), consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-haute-dose" data-title="Vaccin à dose élevée"><p class="lab">Fonction et cible</p><p>Le vaccin à dose élevée contient quatre fois plus d’hémagglutinine par souche que le vaccin standard.</p><p class="lab">Mécanisme de l’affirmation</p><p>Avec l’âge, l’immunosénescence réduit la réponse des lymphocytes B et T ; la même dose d’antigène produit moins d’anticorps. L’augmentation de la quantité d’antigène compense en partie ce déficit. Dans l’essai de Diaz Granados (2014) chez des personnes de 65 ans et plus, la dose élevée réduisait la grippe confirmée de 24,2 % par rapport à la dose standard.</p><p class="lab">Conséquence clinique</p><p>Le plan de vaccination suisse 2026 préfère la dose élevée dès 75 ans et dès 65 ans avec un facteur de risque supplémentaire. Le vaccin standard reste acceptable si la dose élevée n’est pas disponible, car vacciner reste préférable à attendre.</p><div class="key"><b>Limite.</b> Les réactions locales sont un peu plus fréquentes. Les données de comparaison avec les vaccins adjuvantés sont moins solides.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25119609/" target="_blank" rel="noopener">Diaz Granados et al., N Engl J Med 2014</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-pep" data-title="Prophylaxie antivirale post-exposition"><p class="lab">Fonction et cible</p><p>La prophylaxie empêche une infection de s’établir chez une personne exposée à un cas de grippe.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un antiviral présent au moment de l’inoculation limite la réplication initiale et la propagation cellulaire. Selon l’évaluation de l’OFSP de 2025, l’oseltamivir prophylactique réduit le risque de grippe confirmée de 14 % à 8 %, sans effet démontré sur la mortalité.</p><p class="lab">Conséquence clinique</p><p>La Société suisse d’infectiologie propose la prophylaxie post-exposition aux personnes à très haut risque, âgées de 85 ans et plus ou porteuses de plusieurs facteurs de risque, par exemple en établissement médico-social, après un contact avec un cas avéré et dans les 48 heures : baloxavir en dose unique selon le poids, ou oseltamivir pendant 10 jours à une dose adaptée à la fonction rénale. L’OMS 2024 la réserve de même au risque extrêmement élevé d’hospitalisation et la recommande après une exposition à un virus zoonotique. Selon l’information suisse, l’oseltamivir se donne à 75 mg une fois par jour, débuté dans les deux jours suivant le contact.</p><div class="key"><b>Limite.</b> La prophylaxie ne protège que pendant sa durée ; elle ne remplace pas la vaccination. Un traitement à dose curative est préférable si la personne exposée a déjà des symptômes.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/hkgFTLg65Zo8/h0087tflu-hta-report.pdf" target="_blank" rel="noopener">OFSP, évaluation des technologies de la santé oseltamivir et baloxavir, rapport du 11.04.2025</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-hygiene" data-title="Mesures d’hygiène"><p class="lab">Fonction et cible</p><p>Les mesures d’hygiène interrompent les voies de transmission du virus.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’ECDC recommande un lavage des mains au savon pendant 40 à 60 secondes, ou une friction hydroalcoolique, qui réduit la quantité de virus sur les mains. L’étiquette respiratoire consiste à se couvrir la bouche et le nez en toussant, dans un mouchoir jeté ensuite ou dans le pli du coude, puis à se laver les mains. Le masque, correctement porté, réduit l’exposition lorsque la distance ne peut pas être maintenue.</p><p class="lab">Conséquence clinique</p><p>Le patient tousse dans le coude, se lave les mains et porte un masque en présence d’autres personnes, en particulier dans les salles d’attente. Les soignants appliquent l’hygiène des mains avant et après chaque contact.</p><div class="key"><b>Limite.</b> Un masque mal porté peut augmenter la transmission au lieu de la réduire. L’effet individuel de chaque mesure est difficile à mesurer ; leur association reste recommandée.</div><p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-grossesse" data-title="Grippe et grossesse"><p class="lab">Fonction et cible</p><p>La grossesse modifie la mécanique respiratoire, le débit cardiaque et la régulation immunitaire.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’utérus élève le diaphragme et réduit la capacité résiduelle fonctionnelle ; la consommation d’oxygène et le débit cardiaque augmentent. Ces changements réduisent la réserve face à une pneumonie, et l’hypoxémie maternelle diminue l’apport d’oxygène au fœtus. L’OMS 2024 estime le risque de forme sévère lié à la grossesse à un rapport des cotes de 1,88 et la classe parmi les facteurs additionnels, non majeurs.</p><p class="lab">Conséquence clinique</p><p>La Société suisse d’infectiologie ne recommande pas le baloxavir pendant la grossesse. L’information suisse de Tamiflu rapporte plus de 1000 grossesses exposées au premier trimestre sans effet délétère, mais réserve son emploi aux situations de nécessité absolue, après prise en compte de la souche en circulation et de la maladie sous-jacente ; une forme sévère ou une hospitalisation en sont l’exemple. La fièvre est traitée par paracétamol. La vaccination est recommandée par l’OFSP à chaque grossesse, quel que soit le trimestre, et pendant les quatre semaines suivant l’accouchement.</p><div class="key"><b>Limite.</b> Aucune étude contrôlée de l’oseltamivir n’a été menée chez la femme enceinte, et l’information suisse juge l’ampleur du bénéfice incertaine malgré une exposition plus faible au métabolite actif. Pendant l’allaitement, l’oseltamivir peut être envisagé si le bénéfice est indiscutable.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-ems" data-title="Foyer de grippe en établissement de soins"><p class="lab">Fonction et cible</p><p>Les résidents âgés, souvent polymorbides, vivent en contact étroit et répondent moins bien au vaccin.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’immunosénescence atténue la fièvre, si bien que la grippe se présente par une confusion, une chute, une anorexie ou une décompensation. Un cas non reconnu transmet le virus aux autres résidents et au personnel.</p><p class="lab">Conséquence clinique</p><p>Devant plusieurs cas respiratoires en quelques jours, l’équipe cherche rapidement l’agent par un test des premiers malades, isole et traite ces derniers. L’Institut Robert Koch recommande en cas de foyer une prophylaxie post-exposition des résidents et du personnel, indépendamment de leur vaccination. La Société suisse d’infectiologie la propose aux résidents à très haut risque exposés à un cas avéré, dans les 48 heures : baloxavir en dose unique ou oseltamivir pendant 10 jours.</p><div class="key"><b>Limite.</b> La prophylaxie par oseltamivir demande une adaptation à la fonction rénale de chaque résident ; le baloxavir n’en demande pas.</div><p class="src">Références : <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-immunodeprime" data-title="Grippe chez le patient immunodéprimé"><p class="lab">Fonction et cible</p><p>Les lymphocytes T cytotoxiques et les anticorps éliminent normalement le virus en une à deux semaines.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez le greffé, le patient sous chimiothérapie ou sous immunosuppresseur, cette élimination est retardée ; l’excrétion peut durer plusieurs semaines. Une réplication prolongée sous antiviral favorise la sélection de mutants résistants : selon l’information suisse de Tamiflu, une résistance est apparue chez 14,5 % des adultes immunodéprimés traités 10 jours à dose standard et chez 2,7 % de ceux traités à double dose, surtout des greffés, et chez 20,7 % des enfants immunodéprimés.</p><p class="lab">Conséquence clinique</p><p>La Société suisse d’infectiologie demande de contacter un infectiologue en cas de grippe sévère chez l’immunodéprimé, pour discuter d’une association d’oseltamivir et de baloxavir. En traitement ambulatoire, le baloxavir s’emploie avec prudence, car des résistances apparaissent fréquemment, et l’association à l’oseltamivir doit être envisagée. L’OMS 2024 admet une durée de traitement prolongée chez l’immunodéprimé. Une prophylaxie peut durer jusqu’à 12 semaines selon l’information suisse.</p><div class="key"><b>Limite.</b> Chez l’adulte immunodéprimé, l’exposition au métabolite actif est jusqu’à 50 % plus élevée sans justifier d’adaptation lorsque la clairance est normale. La vaccination de l’entourage reste essentielle, car la réponse vaccinale du patient est réduite.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/58809431c75e47769f83a53d0c7773da-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Xofluza®, Swissmedic (AIPS), version de juillet 2026, consultée le 08.10.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a>.</p></template>
<template data-pop="j09-rein" data-title="Oseltamivir et insuffisance rénale"><p class="lab">Fonction et cible</p><p>Le carboxylate d’oseltamivir, métabolite actif, est éliminé à plus de 99 % par le rein, par filtration glomérulaire et sécrétion tubulaire.</p><p class="lab">Mécanisme de l’affirmation</p><p>Lorsque la clairance de la créatinine diminue, l’élimination ralentit et la concentration plasmatique augmente. Une dose standard expose alors à une accumulation et à davantage d’effets indésirables digestifs et neuropsychiatriques.</p><p class="lab">Conséquence clinique</p><p>Le médecin estime la clairance de la créatinine avant la prescription. La dose est réduite lorsque la clairance diminue ; les paliers et le schéma en dialyse figurent dans l’onglet Pharmacologie, d’après l’information professionnelle en vigueur.</p><div class="key"><b>Limite.</b> Chez le patient grave, la fonction rénale change rapidement ; la dose est réévaluée en cours de traitement. Le baloxavir n’est pas éliminé principalement par le rein.</div><p class="src">Références : <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/ca31b8a78bf34e4a9cdb47f07cbc7e02-fr.html" target="_blank" rel="noopener">Information professionnelle suisse Tamiflu®, Swissmedic (AIPS), version de janvier 2026, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-zoonotique" data-title="Grippe zoonotique : A(H5N1) et autres sous-types aviaires"><p class="lab">Fonction et cible</p><p>Les virus aviaires se fixent préférentiellement aux acides sialiques liés en alpha-2,3, abondants dans les voies respiratoires basses humaines et rares dans le nez.</p><p class="lab">Mécanisme de l’affirmation</p><p>Cette préférence explique une transmission interhumaine faible mais des pneumonies graves lorsque l’infection survient. Une co-infection par un virus saisonnier dans la même cellule permet un réassortiment des segments géniques et l’émergence d’un virus pandémique. L’incubation est de deux à quatorze jours après le contact selon l’OFSP.</p><p class="lab">Conséquence clinique</p><p>Selon l’OFSP, une suspicion d’infection humaine par un nouveau sous-type comme A(H5N1) doit être déclarée par téléphone dans les deux heures, et le patient isolé. L’OMS 2024 étend la recommandation d’oseltamivir à l’infection par un nouveau virus A à mortalité élevée, même sans critère de gravité, et recommande une prophylaxie des personnes exposées. Aucun vaccin humain contre la souche actuelle de A(H5N1) n’est autorisé en Suisse.</p><div class="key"><b>Limite.</b> L’OFSP juge le risque faible pour la population générale et faible à moyen pour les personnes exposées professionnellement ; rien n’indique à ce jour de chaîne de transmission interhumaine continue.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-aviaire-h5n1-situation-en-suisse" target="_blank" rel="noopener">OFSP, grippe aviaire H5N1, situation en Suisse, consultée le 08.10.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a>.</p></template>
<template data-pop="j09-criteres" data-title="Origine et limites des critères diagnostiques"><p class="lab">Fonction et cible</p><p>Les critères distinguent une grippe probable, confirmée et grave.</p><p class="lab">Mécanisme de l’affirmation</p><p>La définition clinique s’inspire des définitions de surveillance du syndrome grippal (début brutal, fièvre, toux, signe général), utilisées par le réseau Sentinella. Elle privilégie la sensibilité pour la surveillance, non la certitude individuelle. La confirmation repose sur la détection du virus, de préférence par PCR, car aucun signe clinique n’est spécifique.</p><p class="lab">Conséquence clinique</p><p>Le dossier mentionne la méthode de confirmation, la gravité et, en cas d’exposition animale, la suspicion de virus zoonotique déclarée à l’autorité sanitaire.</p><div class="key"><b>Limite.</b> Il n’existe pas de critères officiels de diagnostic individuel de la grippe ; ceux-ci sont un outil pédagogique construit à partir des définitions de surveillance et des directives de la Société suisse d’infectiologie et de l’OMS.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024, texte intégral</a>.</p></template>
<template data-pop="pareto-j09-pec" data-title="Pareto — Diagnostic, urgences et prise en charge"><p class="ratio" data-cover="j09-7,j09-8,j09-9,j09-10,j09-11,j09-12"></p><ul><li>En période épidémique, la grippe est un diagnostic clinique ; un test, de préférence une PCR, précède tout antiviral, et les tests antigéniques rapides ne sont pas recommandés chez l’adulte.</li><li>Hypoxémie inférieure à 92 %, fréquence respiratoire de 30 par minute ou plus, systolique inférieure à 90 mmHg, confusion ou rechute fébrile après amélioration signalent une grippe grave ou une surinfection à pneumocoque ou staphylocoque.</li><li>Oseltamivir 5 jours chez le patient hospitalisé, dans les 48 heures et au-delà en état critique ; baloxavir en dose unique, après test et dans les 48 heures, chez le patient ambulatoire à très haut risque (85 ans et plus ou immunodépression) ; pas d’antiviral systématique au simple haut risque.</li><li>Oseltamivir adulte 75 mg deux fois par jour pendant cinq jours, réduit dès une clairance de 60 mL/min ; baloxavir non recommandé pendant la grossesse ; traitement ambulatoire non remboursé.</li><li>Pas d’antibiotique sans argument bactérien, pas de corticostéroïde pour la grippe elle-même, pas d’aspirine chez l’enfant.</li><li>Vaccination annuelle des groupes à risque, des personnes de 65 ans et plus, de l’entourage et des soignants, de mi-octobre au début de la vague ; dose élevée dès 75 ans, ou dès 65 ans avec un facteur de risque supplémentaire.</li><li>Suspicion de A(H5N1) après exposition animale : isolement, oseltamivir et déclaration téléphonique dans les deux heures.</li></ul></template>
