<template data-pop="j09-rtpcr" data-title="RT-PCR grippale : l’examen de référence"><p class="lab">Fonction et cible</p><p>La technique détecte le génome du virus grippal dans un prélèvement respiratoire et distingue la grippe A de la grippe B.</p><p class="lab">Mécanisme de l’affirmation</p><p>La transcription inverse copie le génome viral, un acide ribonucléique, en acide désoxyribonucléique ; chaque cycle d’amplification double ensuite le nombre de copies. Cette multiplication exponentielle rend détectable une charge virale que les méthodes immunologiques ne voient pas, d’où une sensibilité supérieure à celle des tests antigéniques.</p><p class="lab">Conséquence clinique</p><p>Chez un patient hospitalisé pour une atteinte respiratoire aiguë en période de circulation du virus, ce test décide de l’antiviral, de l’isolement et de la poursuite ou de l’arrêt d’un antibiotique. L’OMS 2024 recommande, de façon conditionnelle, un test d’amplification des acides nucléiques en cas de suspicion de grippe sévère.</p><div class="key"><b>Limite.</b> Un résultat positif prouve la présence de matériel génomique, non une contagiosité actuelle : la détection peut persister après la fin de la réplication, surtout chez l’immunodéprimé. Un résultat négatif n’exclut pas la maladie si le prélèvement est tardif, mal réalisé, ou si l’atteinte siège dans les voies aériennes basses.</div><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, IDSA 2018</a>.</p></template>
<template data-pop="j09-multiplex" data-title="Panel respiratoire multiplex : ce qu’il ajoute"><p class="lab">Fonction et cible</p><p>Le panel recherche simultanément plusieurs virus et quelques bactéries atypiques dans un même prélèvement respiratoire.</p><p class="lab">Mécanisme de l’affirmation</p><p>Plusieurs couples d’amorces amplifient des cibles différentes dans une même réaction. Le panel couvre notamment la grippe, le virus respiratoire syncytial et le virus du COVID-19, dont les tableaux cliniques ne se séparent pas de façon fiable par le seul examen clinique.</p><p class="lab">Conséquence clinique</p><p>Chez un patient immunodéprimé hospitalisé, identifier l’agent oriente le traitement, l’isolement et la décision de poursuivre ou non des antibiotiques. L’IDSA 2018 recommande cette approche dans cette population et l’envisage chez les autres patients hospitalisés lorsque le résultat modifierait la conduite.</p><div class="key"><b>Limite.</b> Détecter un virus ne prouve pas qu’il explique tout le tableau : une co-détection est fréquente et un portage prolongé est possible. Un panel large demandé sans question précise produit des résultats qui ne changent aucune décision.</div><p class="src">Référence : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, IDSA 2018, diagnostic</a>.</p></template>
<template data-pop="j09-tdr" data-title="Test antigénique rapide et immuno-essai numérique"><p class="lab">Fonction et cible</p><p>Ces tests détectent une protéine du virus, le plus souvent la nucléoprotéine, et rendent un résultat en moins de trente minutes au lieu de soins.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des anticorps fixés sur une membrane capturent l’antigène viral et produisent un signal coloré ou lu par un petit automate. Sans amplification du signal, la détection exige une quantité de virus élevée : la sensibilité suit la charge virale, qui diminue après les premiers jours de symptômes et reste plus basse chez l’adulte que chez l’enfant.</p><p class="lab">Conséquence clinique</p><p>Dans la méta-analyse de Merckx et collaborateurs, la sensibilité groupée pour la grippe A était de 54,4 % pour les tests antigéniques classiques et de 80,0 % pour les immuno-essais numériques, avec une spécificité supérieure à 98 %. Un test positif confirme donc pratiquement la grippe en période épidémique ; un test négatif n’autorise ni à lever un isolement, ni à renoncer à un antiviral chez un patient à risque.</p><div class="key"><b>Limite.</b> La performance dépend du moment du prélèvement, de sa qualité et du type de virus : la sensibilité est plus basse pour la grippe B. Chez un patient hospitalisé, un résultat négatif doit être confirmé par un test moléculaire.</div><p class="src">Références : <a href="https://doi.org/10.7326/M17-0848" target="_blank" rel="noopener">Merckx et collaborateurs, 2017</a> ; <a href="https://doi.org/10.7326/0003-4819-156-7-201204030-00403" target="_blank" rel="noopener">Chartrand et collaborateurs, 2012</a>.</p></template>
<template data-pop="j09-prelevement" data-title="Écouvillonnage nasopharyngé : technique et délai"><p class="lab">Fonction et cible</p><p>Le geste recueille des cellules et du mucus au niveau du nasopharynx, site de réplication préférentiel des virus grippaux humains.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’écouvillon est introduit parallèlement au plancher de la fosse nasale, jusqu’à la paroi postérieure du pharynx, puis tourné quelques secondes avant d’être retiré. Arrêté dans le vestibule nasal, il ramène peu de matériel cellulaire : la quantité de virus prélevée, donc la sensibilité du test, dépend de cette profondeur.</p><p class="lab">Conséquence clinique</p><p>L’IDSA 2018 privilégie le prélèvement nasopharyngé et demande, chez l’ambulatoire, un prélèvement de préférence dans les quatre jours suivant le début des symptômes. À défaut, un prélèvement nasal moyen est préférable à un prélèvement de gorge, et la combinaison nasale et pharyngée est acceptable ; un prélèvement de gorge isolé ne suffit pas. Les écouvillons floqués recueillent davantage de matériel que les écouvillons lisses.</p><div class="key"><b>Limite.</b> Un prélèvement techniquement correct mais tardif peut rester négatif alors que la maladie est présente. Chez un patient en insuffisance respiratoire, un prélèvement haut négatif n’exclut pas une réplication dans les voies aériennes basses.</div><p class="src">Référence : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, IDSA 2018, prélèvements</a>.</p></template>
<template data-pop="j09-prelev-bas" data-title="Prélèvements des voies aériennes basses"><p class="lab">Fonction et cible</p><p>L’aspiration trachéale et le lavage broncho-alvéolaire recueillent des sécrétions au contact du site réellement atteint chez un patient en insuffisance respiratoire.</p><p class="lab">Mécanisme de l’affirmation</p><p>Lorsque la maladie progresse vers le poumon profond, la réplication peut persister dans les alvéoles alors qu’elle a cessé dans le nasopharynx : le prélèvement haut devient faussement négatif, parce qu’il n’échantillonne plus le compartiment malade.</p><p class="lab">Conséquence clinique</p><p>L’IDSA 2018 recommande, chez le patient intubé pour insuffisance respiratoire, un prélèvement trachéal ou un lavage broncho-alvéolaire dès que possible, y compris lorsque le prélèvement des voies aériennes supérieures est revenu négatif. Cette règle évite d’arrêter à tort un antiviral chez un patient grave.</p><div class="key"><b>Limite.</b> Le geste est réservé aux patients déjà intubés ou explorés pour une autre raison ; il ne se justifie pas pour confirmer une grippe chez un patient stable. Les prélèvements non respiratoires, comme le sang ou l’urine, ne doivent pas être envoyés pour une recherche de grippe.</div><p class="src">Référence : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, IDSA 2018</a>.</p></template>
<template data-pop="j09-prevalence" data-title="Prévalence et valeurs prédictives : le calcul"><p class="lab">Fonction et cible</p><p>Le calcul montre pourquoi le même test antigénique se lit différemment en janvier et en août.</p><p class="lab">Mécanisme de l’affirmation</p><p>Avec une sensibilité de 55 % et une spécificité de 98 %, prenons 1000 patients. En pleine épidémie, si 300 ont la grippe, le test identifie 165 vrais positifs et produit 14 faux positifs : la valeur prédictive positive atteint environ 92 %, mais 135 malades sont manqués et la valeur prédictive négative tombe à environ 84 %. Hors saison, si 20 patients seulement ont la grippe, le test donne 11 vrais positifs et 20 faux positifs : la valeur prédictive positive s’effondre autour de 35 %.</p><p class="lab">Conséquence clinique</p><p>En période épidémique, un test positif confirme et un test négatif ne rassure pas. Hors épidémie, un test positif isolé doit être confronté au contexte, et une confirmation moléculaire se discute si la décision est importante.</p><div class="key"><b>Limite.</b> Ces chiffres sont des ordres de grandeur destinés à montrer l’effet de la prévalence ; ils ne remplacent pas les performances exactes du test utilisé, qui figurent dans sa documentation et varient avec le délai de prélèvement.</div><p class="src">Référence : <a href="https://doi.org/10.7326/M17-0848" target="_blank" rel="noopener">Merckx et collaborateurs, performances groupées, 2017</a>.</p></template>
<template data-pop="j09-contentieux-test" data-title="OMS 2024 et IDSA 2018 : quel référentiel appliquer"><p class="lab">Fonction et cible</p><p>Deux référentiels encadrent la stratégie de test, avec des périmètres et des dates différents.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’OMS 2024, la plus récente, formule deux recommandations conditionnelles : une amplification des acides nucléiques en cas de suspicion de grippe sévère, et un immuno-essai numérique ou une amplification en forme non sévère. L’IDSA 2018 reste plus détaillée sur les indications de test par population et sur les prélèvements, et préfère un test moléculaire rapide au test antigénique chez l’ambulatoire.</p><p class="lab">Conséquence clinique</p><p>Le texte le plus récent s’applique au choix de la méthode : en forme non sévère, un immuno-essai numérique est accepté, alors qu’un test antigénique classique reste peu sensible. Pour les indications de test, le délai de prélèvement et les prélèvements des voies aériennes basses, le texte de 2018 demeure la source utilisable, car l’OMS n’a pas publié de consigne équivalente.</p><div class="key"><b>Limite.</b> Les deux recommandations de l’OMS 2024 sur les tests sont conditionnelles : la certitude est limitée et le contexte local pèse. La disponibilité réelle des méthodes dans un hôpital ou un cabinet suisse peut imposer une autre stratégie, qui doit alors être assumée explicitement.</div><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, IDSA 2018</a>.</p></template>
<template data-pop="j09-serologie" data-title="Sérologie grippale : pourquoi elle ne décide rien"><p class="lab">Fonction et cible</p><p>La sérologie mesure des anticorps dirigés contre le virus dans le sang, non le virus lui-même.</p><p class="lab">Mécanisme de l’affirmation</p><p>La production d’anticorps spécifiques demande une à deux semaines. Un sérum unique ne distingue pas une infection actuelle d’une immunité ancienne ou vaccinale : l’interprétation exige deux prélèvements séparés de deux à trois semaines, montrant une ascension du titre.</p><p class="lab">Conséquence clinique</p><p>Le résultat arrive donc après la fenêtre où un antiviral, un isolement ou une prophylaxie auraient été utiles. L’IDSA 2018 demande de ne pas utiliser la sérologie pour la prise en charge clinique.</p><div class="key"><b>Limite.</b> La sérologie garde sa place dans les enquêtes épidémiologiques et les études de séroprévalence, où le délai importe peu ; cet usage ne justifie pas sa prescription au lit du patient.</div><p class="src">Référence : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, IDSA 2018</a>.</p></template>
<template data-pop="j09-culture" data-title="Culture virale : une place résiduelle mais réelle"><p class="lab">Fonction et cible</p><p>La culture multiplie le virus sur cellules pour obtenir un isolat vivant.</p><p class="lab">Mécanisme de l’affirmation</p><p>La croissance virale demande plusieurs jours, ce qui exclut la culture du diagnostic en temps utile. Un isolat permet en revanche les études antigéniques, la mesure de la sensibilité aux antiviraux et la préparation des souches candidates vaccinales, qui exigent un virus réplicatif que l’amplification génique ne fournit pas.</p><p class="lab">Conséquence clinique</p><p>La culture ne décide d’aucun traitement : elle sert aux laboratoires de référence, à la surveillance et à la documentation d’un foyer épidémique quand les tests rapides sont discordants.</p><div class="key"><b>Limite.</b> La culture exige un prélèvement précoce, un transport adapté et un laboratoire de niveau de sécurité approprié. Un virus zoonotique suspecté impose des précautions particulières et une concertation préalable avec le laboratoire.</div><p class="src">Référence : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, IDSA 2018</a>.</p></template>
<template data-pop="j09-oxymetrie" data-title="Oxymétrie de pouls : ce qu’elle mesure et ses pièges"><p class="lab">Fonction et cible</p><p>L’appareil estime la proportion d’hémoglobine liée à l’oxygène dans le sang artériel pulsé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Deux longueurs d’onde traversent le doigt ; l’hémoglobine oxygénée et l’hémoglobine désoxygénée absorbent différemment la lumière, et l’appareil calcule leur rapport sur la composante pulsatile du signal. La mesure dépend donc d’une perfusion périphérique suffisante et d’un signal stable.</p><p class="lab">Conséquence clinique</p><p>La saturation dépiste l’hypoxémie et suit son évolution : elle est la mesure de première intention chez un patient grippé dyspnéique. Elle se lit avec l’apport d’oxygène, la fréquence respiratoire et le travail respiratoire.</p><div class="key"><b>Limite.</b> La valeur peut être faussée par une hypoperfusion, un mouvement, un vernis ou une dyshémoglobinémie. Les travaux de Sjoding et collaborateurs ont montré une surestimation de l’oxygénation chez des patients à peau foncée, avec des hypoxémies non détectées. L’oxymétrie ne renseigne ni sur l’hémoglobine totale, ni sur la capnie : une anémie sévère ou une hypercapnie peuvent coexister avec une saturation normale.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMc2029240" target="_blank" rel="noopener">Sjoding et collaborateurs, biais de mesure de l’oxymétrie, 2020</a>.</p></template>
<template data-pop="j09-gazo" data-title="Gazométrie artérielle : trois informations en un prélèvement"><p class="lab">Fonction et cible</p><p>La gazométrie mesure la pression artérielle en oxygène, la pression en dioxyde de carbone, le pH et les bicarbonates.</p><p class="lab">Mécanisme de l’affirmation</p><p>La pression en oxygène évalue l’efficacité de l’échange gazeux, indépendamment de la quantité d’hémoglobine. La pression en dioxyde de carbone mesure la ventilation alvéolaire : elle s’élève quand le patient ne parvient plus à ventiler suffisamment. Le pH et les bicarbonates distinguent une acidose respiratoire d’une acidose métabolique, par exemple par hyperlactatémie.</p><p class="lab">Conséquence clinique</p><p>Le rapport entre la pression artérielle en oxygène et la fraction inspirée d’oxygène quantifie la sévérité de l’atteinte et entre dans la définition du syndrome de détresse respiratoire aiguë. Une capnie qui monte chez un patient épuisé annonce une défaillance ventilatoire et impose une décision rapide sur l’assistance respiratoire.</p><div class="key"><b>Limite.</b> Le prélèvement est douloureux et n’apporte rien chez un patient stable dont la saturation est normale en air ambiant. Une seule gazométrie décrit un instant : chez un patient qui s’aggrave, c’est la tendance et la clinique qui décident.</div><p class="src">Référence : <a href="https://doi.org/10.1164/rccm.202303-0558WS" target="_blank" rel="noopener">Matthay et collaborateurs, définition globale 2024</a>.</p></template>
<template data-pop="j09-sdra-criteres" data-title="Syndrome de détresse respiratoire aiguë : définition 2024 et antériorité de Berlin"><p class="lab">Fonction et cible</p><p>La définition identifie un œdème pulmonaire inflammatoire non cardiogénique, afin d’orienter la ventilation et la surveillance.</p><p class="lab">Mécanisme de l’affirmation</p><p>La définition globale publiée en 2024 conserve les critères de Berlin et les élargit. Elle retient un facteur déclenchant récent, des opacités bilatérales à la radiographie, à la tomodensitométrie ou à l’échographie thoracique, l’absence d’explication purement cardiogénique, et une hypoxémie définie par un rapport PaO₂/FiO₂ inférieur ou égal à 300 mmHg, ou par un rapport SpO₂/FiO₂ inférieur ou égal à 315 lorsque la saturation est inférieure ou égale à 97 %. Elle inclut l’oxygénation nasale à haut débit d’au moins 30 L/min et n’exige pas de pression expiratoire positive minimale dans les contextes à ressources limitées.</p><p class="lab">Conséquence clinique</p><p>Un patient grippé hypoxémique sous haut débit peut donc être reconnu comme atteint sans intubation préalable et sans gazométrie, ce qui accélère l’orientation vers une surveillance continue et une stratégie de ventilation protectrice.</p><div class="key"><b>Limite.</b> La définition de Berlin de 2012 exigeait une pression expiratoire positive d’au moins 5 centimètres d’eau et un rapport calculé à partir de la gazométrie. Elle reste la référence de la plupart des essais thérapeutiques publiés avant 2024, ce qu’il faut garder en tête en transposant leurs résultats. Les auteurs de la définition globale indiquent eux-mêmes que sa valeur pronostique demande des évaluations prospectives.</div><p class="src">Référence : <a href="https://doi.org/10.1164/rccm.202303-0558WS" target="_blank" rel="noopener">Matthay et collaborateurs, définition globale du syndrome de détresse respiratoire aiguë, 2024</a>.</p></template>
<template data-pop="j09-rx" data-title="Radiographie thoracique dans la grippe"><p class="lab">Fonction et cible</p><p>L’image recherche une atteinte du parenchyme pulmonaire : condensation, opacités bilatérales, épanchement ou abcès.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’air et les liquides absorbent différemment les rayons X : une alvéole remplie d’exsudat devient une opacité. La pneumonie virale primaire donne plutôt des opacités bilatérales interstitielles ou alvéolaires diffuses, la surinfection bactérienne une condensation localisée.</p><p class="lab">Conséquence clinique</p><p>La radiographie se demande devant des signes focaux à l’auscultation, une hypoxémie, des critères de gravité ou l’absence d’amélioration attendue. Elle modifie la décision d’hospitalisation et celle d’antibiothérapie.</p><div class="key"><b>Limite.</b> Une image précoce peut être normale alors que l’atteinte débute, et une opacité ne dit pas si elle est virale ou bactérienne. Prescrire une radiographie à tout patient grippé expose à une irradiation sans bénéfice ; l’examen ne remplace pas la mesure de l’oxygénation.</div><p class="src">Référence : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, IDSA 2018, complications</a>.</p></template>
<template data-pop="j09-lactate" data-title="Lactate : un marqueur d’hypoperfusion, non d’infection"><p class="lab">Fonction et cible</p><p>Le lactate sanguin renseigne sur l’adéquation entre apport et besoin en oxygène des tissus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Quand l’oxygène manque, le pyruvate n’est plus oxydé dans la mitochondrie et devient du lactate. D’autres mécanismes l’élèvent sans hypoxie tissulaire : la stimulation adrénergique, une insuffisance hépatique qui réduit son élimination, certains médicaments.</p><p class="lab">Conséquence clinique</p><p>Chez un patient grippé fébrile et tachycarde, un lactate élevé fait suspecter une hypoperfusion et accélère la prise en charge. Dans la définition Sepsis-3, un lactate supérieur à 2 mmol/L persistant chez un patient nécessitant un vasopresseur malgré un remplissage adéquat définit le choc septique.</p><div class="key"><b>Limite.</b> Un lactate normal n’exclut pas une infection grave, et un lactate élevé n’identifie pas sa cause. La valeur se lit avec la pression artérielle, la diurèse, l’état de conscience et la perfusion cutanée ; c’est la tendance sous traitement qui informe le plus.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/26903338/" target="_blank" rel="noopener">Singer et collaborateurs, définitions Sepsis-3, 2016</a>.</p></template>
<template data-pop="j09-pct" data-title="Procalcitonine dans la grippe : un test pour exclure"><p class="lab">Fonction et cible</p><p>La procalcitonine est un précurseur de la calcitonine dont la concentration sanguine augmente lors des infections bactériennes systémiques.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des produits bactériens et certaines cytokines induisent sa production par de nombreux tissus, alors que les interférons libérés au cours des infections virales freinent cette induction. Cette différence de régulation explique une élévation plus marquée dans les infections bactériennes, sans que la distinction soit absolue.</p><p class="lab">Conséquence clinique</p><p>Dans la méta-analyse de Wu et collaborateurs portant sur 137 cas de co-infection bactérienne et 381 cas sans co-infection, la sensibilité groupée était de 0,84 et la spécificité de 0,64, avec un rapport de vraisemblance positif de 2,31 et un rapport négatif de 0,26. Dans une cohorte de 972 patients de soins intensifs atteints de grippe A(H1N1), une valeur inférieure à 0,29 ng/mL était associée à une valeur prédictive négative de 91,9 %, qui atteignait 94 % en l’absence de choc.</p><div class="key"><b>Limite.</b> Le rapport de vraisemblance positif est trop faible pour affirmer une bactérie : une grippe sévère avec choc élève aussi la procalcitonine. Le marqueur ne doit jamais retarder une antibiothérapie chez un patient instable, et l’OMS 2024 recommande, de façon forte, de ne pas prescrire d’antibiotique dans une grippe non sévère à faible probabilité de co-infection bactérienne, sans exiger de dosage.</div><p class="src">Références : <a href="https://doi.org/10.1111/j.1750-2659.2012.00386.x" target="_blank" rel="noopener">Wu et collaborateurs, 2012</a> ; <a href="https://doi.org/10.1016/j.jinf.2015.11.007" target="_blank" rel="noopener">Rodríguez et collaborateurs, 2016</a>.</p></template>
<template data-pop="j09-ck" data-title="Créatine kinase : myosite grippale et rhabdomyolyse"><p class="lab">Fonction et cible</p><p>La créatine kinase est une enzyme cytoplasmique du muscle squelettique et du myocarde ; son passage dans le sang signale une lésion des fibres musculaires.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’atteinte musculaire au cours de la grippe associe un effet direct du virus sur la fibre et l’effet des médiateurs inflammatoires. La rupture des membranes libère la créatine kinase, mais aussi la myoglobine et le potassium. La myoglobine filtrée précipite dans les tubules rénaux et provoque une insuffisance rénale aiguë ; l’hyperkaliémie expose à des troubles du rythme.</p><p class="lab">Conséquence clinique</p><p>Le dosage se demande devant des myalgies inhabituellement intenses, une faiblesse musculaire, des urines foncées ou une insuffisance rénale aiguë inexpliquée. Il conduit à une hydratation, à une surveillance de la créatinine, du potassium et de la diurèse.</p><div class="key"><b>Limite.</b> Des myalgies banales de syndrome grippal ne justifient pas ce dosage. Une élévation modérée est fréquente et non spécifique : un exercice récent, une injection intramusculaire ou une chute peuvent l’expliquer. Une élévation importante doit être rapportée à la fonction rénale plutôt qu’à un seuil isolé.</div><p class="src">Référence : <a href="https://doi.org/10.1016/S0140-6736(22)00982-5" target="_blank" rel="noopener">Uyeki et collaborateurs, séminaire Lancet, 2022, complications</a>.</p></template>
<template data-pop="j09-troponine" data-title="Troponine : lésion myocardique et risque coronarien"><p class="lab">Fonction et cible</p><p>La troponine cardiaque est une protéine du myocarde dont la présence dans le sang témoigne d’une lésion des cellules myocardiques.</p><p class="lab">Mécanisme de l’affirmation</p><p>La grippe lèse le myocarde par deux voies : une inflammation myocardique directe ou médiée par les cytokines, et un déséquilibre entre apport et besoin en oxygène, favorisé par la fièvre, la tachycardie, l’hypoxémie et l’inflammation, qui peut aussi déstabiliser une plaque coronarienne. Dans l’étude de Kwong et collaborateurs, le risque d’hospitalisation pour infarctus aigu du myocarde était multiplié par 6,05 dans les sept jours suivant un test grippal positif, avec un intervalle de confiance de 3,86 à 9,50.</p><p class="lab">Conséquence clinique</p><p>Devant une douleur thoracique, une dyspnée disproportionnée ou une instabilité hémodynamique, l’électrocardiogramme et la troponine orientent vers un syndrome coronarien aigu ou une myocardite. Cette possibilité justifie aussi la vaccination des patients coronariens.</p><div class="key"><b>Limite.</b> Une élévation modérée est fréquente dans toute maladie aiguë sévère et ne signifie pas infarctus : l’interprétation exige la cinétique, l’électrocardiogramme et le contexte. L’étude citée établit une association temporelle forte, dans un plan en cas autocontrôlés, et non une relation causale démontrée pour chaque patient.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMoa1702090" target="_blank" rel="noopener">Kwong et collaborateurs, infarctus après grippe confirmée, 2018</a>.</p></template>
<template data-pop="j09-hemocultures" data-title="Hémocultures : rendement et moment du prélèvement"><p class="lab">Fonction et cible</p><p>Les hémocultures recherchent une bactérie ou un champignon dans le sang et permettent d’adapter l’antibiotique à la sensibilité du germe.</p><p class="lab">Mécanisme de l’affirmation</p><p>La bactériémie est souvent intermittente et de faible densité : le volume de sang prélevé est le premier déterminant du rendement, d’où le prélèvement de deux paires de flacons. Une seule dose d’antibiotique peut stériliser les cultures et priver l’équipe de l’identification du germe, ce qui justifie de prélever avant la première administration.</p><p class="lab">Conséquence clinique</p><p>Chez un patient grippé qui présente une pneumonie étendue, une hypotension ou une aggravation après amélioration, les hémocultures précèdent l’antibiotique. Le résultat permet ensuite de cibler le traitement, notamment en cas de pneumocoque ou de <i>Staphylococcus aureus</i>.</p><div class="key"><b>Limite.</b> Le prélèvement ne doit jamais retarder la première dose chez un patient en choc. Des hémocultures négatives n’excluent pas une pneumonie bactérienne, car la bactériémie est inconstante ; un germe de la flore cutanée isolé dans un seul flacon évoque d’abord une contamination.</div><p class="src">Référence : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, IDSA 2018, co-infection bactérienne</a>.</p></template>
<template data-pop="j09-typage" data-title="Typage, sous-typage et séquençage"><p class="lab">Fonction et cible</p><p>Ces analyses précisent le type, le sous-type et la séquence des gènes de surface de la souche détectée.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le typage distingue la grippe A de la grippe B. Le sous-typage utilise des amorces spécifiques des sous-types humains attendus, notamment A(H1N1)pdm09 et A(H3N2). Le séquençage lit le gène de l’hémagglutinine pour rattacher la souche à un groupe génétique et suivre la dérive antigénique, et le gène de la neuraminidase pour détecter des substitutions associées à une résistance aux inhibiteurs de cette enzyme.</p><p class="lab">Conséquence clinique</p><p>En Suisse, cette caractérisation est réalisée par le Centre national de référence de l’influenza, aux Hôpitaux universitaires de Genève, dans le cadre de la surveillance et du réseau de l’OMS. Elle alimente les décisions de composition vaccinale et documente les résistances.</p><div class="key"><b>Limite.</b> Une grippe A dont le sous-type ne peut pas être déterminé par les amorces de routine n’est pas un résultat banal : elle doit faire évoquer un virus animal et conduire à contacter le laboratoire de référence. Le séquençage ne se demande pas pour la prise en charge courante d’une grippe saisonnière.</div><p class="src">Référence : <a href="https://www.hug.ch/laboratoire-virologie/centre-national-reference-influenza-cnri" target="_blank" rel="noopener">Hôpitaux universitaires de Genève, Centre national de référence de l’influenza</a>.</p></template>
<template data-pop="j09-zoonose-labo" data-title="Suspicion de grippe zoonotique : circuit et déclaration"><p class="lab">Fonction et cible</p><p>La démarche vise à identifier un virus grippal animal chez un humain, à protéger l’entourage et le personnel, et à alerter les autorités sanitaires.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les virus aviaires se fixent préférentiellement sur des acides sialiques en configuration α2,3, présents surtout dans le poumon profond : l’atteinte peut donc être d’emblée pulmonaire et sévère. Les amorces de routine ciblent les sous-types humains ; un virus animal peut donc donner une grippe A sans sous-type identifiable. Préciser l’exposition sur la demande de laboratoire est ce qui déclenche l’emploi des réactifs appropriés.</p><p class="lab">Conséquence clinique</p><p>Devant une fièvre avec atteinte respiratoire ou conjonctivale après contact étroit avec des oiseaux malades ou morts, avec des mammifères infectés ou après un séjour en zone touchée, le patient est isolé, le personnel protégé, le laboratoire de référence contacté avant l’envoi. Selon l’OFSP, la suspicion d’un nouveau sous-type de grippe A, dont la grippe A(H5N1), fait l’objet d’une déclaration téléphonique dans les deux heures. À ce jour, la Suisse n’a enregistré aucun cas humain confirmé en laboratoire de grippe A(H5N1).</p><div class="key"><b>Limite.</b> Le délai de deux heures et la liste des agents concernés dépendent de l’ordonnance sur la déclaration en vigueur : il faut vérifier la version actuelle auprès du médecin cantonal, dont les coordonnées et les canaux de déclaration changent. L’absence de cas humain en Suisse ne dispense pas de la démarche, puisque c’est le premier cas qui doit être reconnu.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-aviaire-h5n1-situation-en-suisse" target="_blank" rel="noopener">OFSP, grippe aviaire A(H5N1), situation en Suisse</a> ; <a href="https://www.hug.ch/laboratoire-virologie/centre-national-reference-influenza-cnri" target="_blank" rel="noopener">Centre national de référence de l’influenza, Genève</a>.</p></template>
<template data-pop="j09-hemagglutinine" data-title="Hémagglutinine : attachement puis fusion"><p class="lab">Fonction et cible</p><p>L’hémagglutinine est la glycoprotéine de surface majoritaire du virus grippal ; elle assure la fixation à la cellule et l’entrée du génome.</p><p class="lab">Mécanisme de l’affirmation</p><p>Sa partie globulaire reconnaît un acide sialique porté par les glycoprotéines de la membrane cellulaire. Le virus est ensuite internalisé dans une vésicule, dont l’acidification modifie la conformation de la protéine ; cette modification expose un segment qui fusionne la membrane virale et la membrane de la vésicule, libérant les segments du génome dans la cellule.</p><p class="lab">Conséquence clinique</p><p>Comme l’attachement est la première étape obligatoire, l’hémagglutinine est la cible principale des anticorps neutralisants et donc des vaccins. Sa séquence définit le sous-type et sert à suivre la dérive antigénique saison après saison.</p><div class="key"><b>Limite.</b> Les régions les plus accessibles aux anticorps sont aussi les plus variables : une immunité acquise une saison protège partiellement la suivante. La conservation d’une partie de la protéine fonde des travaux de vaccins à plus large couverture, qui ne sont pas un standard de soins.</div><p class="src">Référence : <a href="https://doi.org/10.1038/s41572-018-0002-y" target="_blank" rel="noopener">Krammer et collaborateurs, 2018</a>.</p></template>
<template data-pop="j09-neuraminidase" data-title="Neuraminidase : libérer les virions et traverser le mucus"><p class="lab">Fonction et cible</p><p>La neuraminidase est une enzyme de surface qui coupe les acides sialiques.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les virions nouvellement formés restent fixés par leur hémagglutinine aux acides sialiques de la cellule qui les a produits. En clivant ces résidus, l’enzyme libère les particules et leur permet d’infecter d’autres cellules. Elle fluidifie aussi le mucus, riche en acides sialiques, ce qui facilite la progression du virus dans les voies aériennes.</p><p class="lab">Conséquence clinique</p><p>Cette fonction explique l’action des inhibiteurs de la neuraminidase, qui bloquent la libération des virions et limitent la propagation locale. Leur efficacité dépend d’une administration précoce, lorsque la réplication est encore active.</p><div class="key"><b>Limite.</b> Des substitutions de la neuraminidase peuvent réduire la liaison de l’inhibiteur et conférer une résistance ; leur recherche repose sur le séquençage au laboratoire de référence. Bloquer la libération n’efface pas les lésions épithéliales déjà constituées, ce qui explique une persistance des symptômes malgré un traitement adapté.</div><p class="src">Référence : <a href="https://doi.org/10.1016/S0140-6736(22)00982-5" target="_blank" rel="noopener">Uyeki et collaborateurs, séminaire Lancet, 2022</a>.</p></template>
<template data-pop="j09-segments" data-title="Réassortiment : l’échange de segments entiers"><p class="lab">Fonction et cible</p><p>Le réassortiment désigne la redistribution de segments de génome entre deux virus grippaux infectant la même cellule.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le génome des virus de type A est réparti en huit segments distincts, et non en une seule molécule. Lors de l’assemblage des nouvelles particules, les segments des deux virus parents sont combinés. Un seul événement suffit alors pour qu’un virus porte une hémagglutinine d’origine animale associée à des segments adaptés à la réplication chez l’humain.</p><p class="lab">Conséquence clinique</p><p>C’est le mécanisme principal des cassures antigéniques et des pandémies : la population n’a aucune immunité contre la nouvelle protéine de surface. Il justifie la surveillance des sous-types circulant chez les animaux et la déclaration immédiate d’un sous-type inhabituel chez un humain.</p><div class="key"><b>Limite.</b> Un réassortiment ne produit pas automatiquement un virus pandémique : la transmission interhumaine efficace exige aussi une adaptation de la fixation aux récepteurs des voies aériennes supérieures et de la polymérase virale. Les virus de type B, qui n’ont pas de réservoir animal comparable, ne donnent pas ce type d’événement.</div><p class="src">Référence : <a href="https://doi.org/10.1038/s41572-018-0002-y" target="_blank" rel="noopener">Krammer et collaborateurs, 2018</a>.</p></template>
<template data-pop="j09-derive-cassure" data-title="Dérive et cassure antigéniques : la comparaison utile"><p class="lab">Fonction et cible</p><p>Les deux termes décrivent la variation des protéines de surface, mais à des échelles et avec des conséquences différentes.</p><p class="lab">Mécanisme de l’affirmation</p><p>La dérive résulte de mutations ponctuelles accumulées par une polymérase sans correction d’erreur efficace ; elle modifie progressivement les sites reconnus par les anticorps, au sein du même sous-type. La cassure résulte d’un échange de segments et introduit une hémagglutinine d’un sous-type nouveau pour l’humain. La dérive concerne la grippe A et la grippe B, la cassure essentiellement la grippe A.</p><p class="lab">Conséquence clinique</p><p>La dérive explique les épidémies annuelles, la reformulation du vaccin chaque saison et l’efficacité vaccinale variable d’une année à l’autre. La cassure explique le risque pandémique et l’organisation de la déclaration obligatoire des nouveaux sous-types.</p><div class="key"><b>Limite.</b> Parler de « nouvelle souche » à chaque saison est imprécis : la dérive produit des variants au sein d’un sous-type connu, devant lequel la population conserve une immunité partielle. La disparition apparente d’un lignage est un phénomène distinct : l’OMS n’a plus confirmé de détection naturelle de virus du lignage B/Yamagata depuis mars 2020 et a jugé l’inclusion de ses antigènes vaccinaux non justifiée.</div><p class="src">Références : <a href="https://doi.org/10.1038/s41572-018-0002-y" target="_blank" rel="noopener">Krammer et collaborateurs, 2018</a> ; <a href="https://www.who.int/publications/m/item/recommended-composition-of-influenza-virus-vaccines-for-use-in-the-2024-southern-hemisphere-influenza-season" target="_blank" rel="noopener">OMS, composition vaccinale, septembre 2023</a>.</p></template>
<template data-pop="j09-mucociliaire" data-title="Clairance mucociliaire : la défense qui précède l’immunité"><p class="lab">Fonction et cible</p><p>Le tapis mucociliaire piège les particules inhalées et les évacue vers le pharynx avant toute réaction immunitaire spécifique.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les cellules sécrétrices produisent des mucines qui forment un gel ; une couche liquidienne périciliaire permet aux cils de battre de façon coordonnée et de déplacer ce gel vers le haut. Le virus grippal détruit des cellules ciliées et désorganise la surface : la vitesse de transport diminue, le mucus stagne et les bactéries habituellement évacuées adhèrent et se multiplient.</p><p class="lab">Conséquence clinique</p><p>Cette rupture est le mécanisme principal de la surinfection bactérienne après grippe. Elle explique aussi la toux productive et la persistance de la toux plusieurs semaines, le temps de la réparation de l’épithélium.</p><div class="key"><b>Limite.</b> La diminution de la clairance ne justifie aucun antibiotique préventif, dont le bénéfice n’est pas démontré et qui expose aux résistances. Une toux résiduelle de quelques semaines est compatible avec la convalescence ; une aggravation, une fièvre de retour ou une dyspnée imposent une réévaluation.</div><p class="src">Référence : <a href="https://doi.org/10.1016/S0140-6736(22)00982-5" target="_blank" rel="noopener">Uyeki et collaborateurs, séminaire Lancet, 2022</a>.</p></template>
<template data-pop="j09-recepteurs" data-title="Récepteurs α2,6 et α2,3 : pourquoi le siège change tout"><p class="lab">Fonction et cible</p><p>Les acides sialiques de surface sont les points de fixation de l’hémagglutinine ; leur configuration varie selon le niveau de l’arbre respiratoire.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’acide sialique est relié au galactose sous-jacent soit par une liaison de type α2,6, soit par une liaison de type α2,3. Les virus grippaux humains se fixent préférentiellement sur la configuration α2,6, les virus aviaires sur la configuration α2,3. Les travaux de Shinya et collaborateurs ont montré, sur des coupes de voies aériennes humaines, que la configuration α2,6 prédomine dans l’épithélium des voies aériennes supérieures et des grosses bronches, alors que la configuration α2,3 se trouve surtout dans les bronchioles terminales et les alvéoles.</p><p class="lab">Conséquence clinique</p><p>Le siège de la réplication commande le tableau : le virus saisonnier se multiplie haut, excrète abondamment et se transmet facilement, alors que le virus aviaire produit une atteinte profonde souvent sévère mais se transmet rarement entre humains, car il est produit loin du site d’émission des gouttelettes.</p><div class="key"><b>Limite.</b> Cette distribution est une explication partielle, et non une règle absolue : la transmissibilité dépend aussi de la stabilité de l’hémagglutinine et de l’adaptation de la polymérase virale. La préférence de fixation n’est pas exclusive, ce qui laisse possible une infection humaine par un virus aviaire et impose la vigilance clinique après exposition animale.</div><p class="src">Référence : <a href="https://doi.org/10.1038/440435a" target="_blank" rel="noopener">Shinya et collaborateurs, Nature, 2006</a>.</p></template>
<template data-pop="j09-interferons" data-title="Interférons de type I et III : la première riposte"><p class="lab">Fonction et cible</p><p>Ces molécules installent un état de résistance antivirale dans la cellule infectée et dans ses voisines.</p><p class="lab">Mécanisme de l’affirmation</p><p>Des capteurs intracellulaires reconnaissent l’acide ribonucléique viral comme étranger et déclenchent la transcription des gènes des interférons. Ceux-ci se fixent sur leurs récepteurs et induisent des protéines qui dégradent l’acide ribonucléique viral, bloquent la traduction et limitent l’assemblage des particules. Ils favorisent aussi la présentation des antigènes et le recrutement des cellules immunitaires.</p><p class="lab">Conséquence clinique</p><p>Cette réponse explique la précocité et l’intensité des symptômes généraux : fièvre, myalgies, céphalées et abattement apparaissent avant la production des anticorps spécifiques. Le malaise mesure la réaction de défense, non la gravité de l’atteinte pulmonaire, qui s’évalue par l’oxygénation.</p><div class="key"><b>Limite.</b> Une réponse interféron excessive ou mal localisée participe aux lésions tissulaires ; l’administration d’interférons n’est pas un traitement recommandé de la grippe. Une réponse insuffisante, chez l’immunodéprimé, se traduit par une excrétion virale prolongée, qui explique des résultats de test positifs durables sans aggravation clinique.</div><p class="src">Référence : <a href="https://doi.org/10.1038/s41572-018-0002-y" target="_blank" rel="noopener">Krammer et collaborateurs, 2018</a>.</p></template>
<template data-pop="j09-anticorps-ha" data-title="Anticorps anti-hémagglutinine : un corrélat imparfait"><p class="lab">Fonction et cible</p><p>Ces anticorps empêchent la fixation du virus sur la cellule et constituent le principal mécanisme de protection acquise.</p><p class="lab">Mécanisme de l’affirmation</p><p>En se liant à la partie globulaire de l’hémagglutinine, ils bloquent l’attachement à l’acide sialique et empêchent l’entrée du virus. Le laboratoire les mesure par leur capacité à inhiber l’agglutination des globules rouges par le virus. Un titre d’inhibition de 1:40 est traditionnellement associé, dans des études de provocation anciennes, à une réduction d’environ la moitié du risque d’infection.</p><p class="lab">Conséquence clinique</p><p>La cible de ces anticorps est précisément la région que la dérive antigénique modifie : c’est la raison biologique de la vaccination annuelle et de la reformulation du vaccin. Les anticorps dirigés contre la neuraminidase atténuent la maladie sans toujours empêcher l’infection.</p><div class="key"><b>Limite.</b> Le seuil de 1:40 est un corrélat de population, établi chez de jeunes adultes volontaires ; il ne garantit pas la protection d’un patient donné et n’a pas de place dans la décision clinique. Ce chiffre n’a pas été revérifié en texte intégral pour cette rédaction et doit être attribué à la littérature historique de l’inhibition de l’hémagglutination.</div><p class="src">Référence : <a href="https://doi.org/10.1038/s41572-018-0002-y" target="_blank" rel="noopener">Krammer et collaborateurs, revue de synthèse, 2018</a>.</p></template>
<template data-pop="j09-lymphoT" data-title="Réponse T : protection croisée contre la gravité"><p class="lab">Fonction et cible</p><p>Les lymphocytes T CD8 éliminent les cellules déjà infectées, ce que les anticorps ne peuvent pas faire.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les protéines virales produites dans la cellule sont découpées en peptides et présentées à la surface par les molécules de classe I du complexe majeur d’histocompatibilité. Les lymphocytes T CD8 qui reconnaissent ces peptides détruisent la cellule, interrompant la production de nouveaux virions. Comme beaucoup de ces peptides proviennent de protéines internes plus conservées que l’hémagglutinine, la reconnaissance persiste malgré la dérive antigénique.</p><p class="lab">Conséquence clinique</p><p>Cette mémoire explique qu’un adulte déjà exposé fasse souvent une maladie moins grave, même lorsque ses anticorps ne neutralisent plus la souche circulante. Elle explique aussi la gravité particulière chez l’immunodéprimé, dont la réponse cellulaire est altérée.</p><div class="key"><b>Limite.</b> La protection apportée est surtout une réduction de la gravité, non une prévention de l’infection : elle ne remplace pas la vaccination. La destruction des cellules infectées contribue elle-même à la lésion de l’épithélium, ce qui participe à la toux persistante et à la fragilité face aux bactéries.</div><p class="src">Référence : <a href="https://doi.org/10.1016/S0140-6736(22)00982-5" target="_blank" rel="noopener">Uyeki et collaborateurs, séminaire Lancet, 2022</a>.</p></template>
<template data-pop="j09-tempete-cytokinique" data-title="Tempête cytokinique : ce que les données montrent vraiment"><p class="lab">Fonction et cible</p><p>L’expression désigne une production massive de cytokines et de chimiokines au cours d’une infection, associée à des lésions tissulaires.</p><p class="lab">Mécanisme de l’affirmation</p><p>Dans l’étude de de Jong et collaborateurs, qui a comparé dix-huit patients infectés par un virus A(H5N1) à huit patients infectés par des virus grippaux humains, les charges virales pharyngées étaient élevées, l’acide ribonucléique viral était fréquemment détecté dans le sang des cas fatals, et les concentrations de cytokines et de chimiokines étaient d’autant plus hautes que la charge virale était élevée. Les auteurs concluaient que la charge virale élevée et la réponse inflammatoire intense sont centrales dans la gravité.</p><p class="lab">Conséquence clinique</p><p>Il faut donc contrôler tôt la réplication virale, par un diagnostic rapide et un antiviral précoce, plutôt que supprimer la réponse immunitaire. L’OMS 2024 formule des recommandations conditionnelles contre les corticostéroïdes dans la grippe sévère, contre les macrolides sans co-infection bactérienne, contre le plasma de convalescent et contre les inhibiteurs de la voie mTOR.</p><div class="key"><b>Limite.</b> L’étude citée est observationnelle, de petit effectif, et porte sur un virus aviaire : elle démontre une association, non une causalité, et ne se transpose pas directement à la grippe saisonnière. L’expression « tempête cytokinique » n’a pas de définition biologique opérationnelle ni de seuil, et ne doit pas servir à justifier une immunosuppression.</div><p class="src">Références : <a href="https://doi.org/10.1038/nm1477" target="_blank" rel="noopener">de Jong et collaborateurs, 2006</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024</a>.</p></template>
<template data-pop="j09-shunt" data-title="Shunt intrapulmonaire : l’hypoxémie qui résiste à l’oxygène"><p class="lab">Fonction et cible</p><p>Le shunt désigne le passage de sang à travers des territoires pulmonaires perfusés mais non ventilés.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une alvéole remplie d’exsudat ou collabée ne reçoit plus d’air ; le sang qui traverse ses capillaires ne se charge pas en oxygène et rejoint la circulation systémique avec une saturation veineuse. Augmenter la fraction inspirée d’oxygène n’améliore pas cette fraction du sang, puisqu’elle ne rencontre aucun gaz alvéolaire : c’est pourquoi un shunt important répond mal à l’oxygène, alors qu’une simple inadéquation entre ventilation et perfusion y répond bien.</p><p class="lab">Conséquence clinique</p><p>Une hypoxémie qui persiste malgré un débit d’oxygène élevé signale un shunt significatif. La réponse thérapeutique n’est plus l’augmentation du débit seule mais l’application d’une pression positive, par oxygénation nasale à haut débit, ventilation non invasive ou ventilation invasive, afin de rouvrir les alvéoles collabées.</p><div class="key"><b>Limite.</b> La distinction entre shunt et inadéquation est un modèle : dans la grippe grave, les deux coexistent avec un trouble de la diffusion. La réponse à l’oxygène est un argument clinique utile, non une mesure du shunt ; la décision d’assistance repose aussi sur le travail respiratoire et la tolérance du patient.</div><p class="src">Référence : <a href="https://doi.org/10.1164/rccm.202303-0558WS" target="_blank" rel="noopener">Matthay et collaborateurs, définition globale 2024</a>.</p></template>
<template data-pop="pareto-j09-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j09-e-1,j09-e-2,j09-e-3,j09-e-4"></p><ul><li>Un examen ne se demande que si son résultat change une décision : antiviral, antibiotique, isolement, lieu de soins ou déclaration.</li><li>La RT-PCR sur prélèvement nasopharyngé est l’examen de référence ; elle est exigée chez l’hospitalisé et en suspicion zoonotique.</li><li>Un test antigénique positif confirme en période épidémique ; sa sensibilité voisine de 54 % pour la grippe A interdit d’exclure la maladie sur un résultat négatif.</li><li>Le prélèvement doit être nasopharyngé et précoce ; chez le patient intubé dont le prélèvement haut est négatif, une aspiration trachéale ou un lavage broncho-alvéolaire est indiqué.</li><li>La gravité se mesure par l’oxygénation rapportée à l’apport d’oxygène, le lactate et la perfusion, non par la positivité du test.</li><li>La procalcitonine sert surtout à ne pas commencer un antibiotique ; son rapport de vraisemblance positif est trop faible pour affirmer une bactérie.</li><li>Une grippe A sans sous-type identifiable après exposition animale impose isolement, contact du laboratoire de référence et déclaration téléphonique dans les deux heures.</li></ul></template>
<template data-pop="pareto-j09-sci" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="j09-s-viro-body,j09-s-anat-body,j09-s-imm-body,j09-s-phys-body"></p><ul><li>Le génome est segmenté : les mutations ponctuelles produisent la dérive antigénique et les épidémies annuelles, l’échange de segments produit la cassure et le risque pandémique.</li><li>L’hémagglutinine fixe le virus sur un acide sialique et fusionne les membranes ; la neuraminidase libère les virions et fluidifie le mucus.</li><li>La configuration α2,6 prédomine en haut et la configuration α2,3 dans les alvéoles : le siège de la réplication décide du tableau clinique et de la transmissibilité.</li><li>La destruction de l’épithélium cilié réduit la clairance mucociliaire et ouvre la voie à la surinfection bactérienne.</li><li>Les interférons expliquent les symptômes généraux, les anticorps anti-hémagglutinine la protection acquise et sa perte par dérive, les lymphocytes T une protection croisée contre la gravité.</li><li>Une charge virale élevée s’accompagne d’une réponse inflammatoire intense : l’objectif est le contrôle précoce du virus, et l’OMS 2024 recommande, de façon conditionnelle, de ne pas utiliser de corticostéroïdes dans la grippe sévère.</li><li>L’hypoxémie associe inadéquation entre ventilation et perfusion, shunt et trouble de diffusion ; un shunt important répond mal à l’oxygène seul et demande une pression positive.</li></ul></template>
<template data-pop="j09-federal-qui-tester" data-title="Qui doit être testé"><p class="lab">Critère</p><p>Le test est indiqué chez tout patient hospitalisé pour atteinte respiratoire aiguë pendant la circulation du virus, et l’amplification génique y est exigée. Il est conditionnel en ambulatoire : chez le patient à risque si le résultat change le traitement, devant un foyer en établissement de soins, hors saison, et après une exposition animale.</p><p class="lab">Conséquence pratique</p><p>Chez l’adulte sans facteur de risque dont le tableau est typique en pleine épidémie, aucun test n’est indiqué, parce qu’aucun résultat ne modifierait la conduite. À l’inverse, un test négatif chez l’hospitalisé n’arrête pas le raisonnement : il se contrôle par une amplification sur un prélèvement de qualité.</p><p class="src">Références : <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et collaborateurs, recommandations de l’IDSA, 2019</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 12.09.2024</a>.</p></template>
<template data-pop="j09-piege-pct" data-title="Une procalcitonine élevée ne prouve pas la bactérie"><p class="lab">Mécanisme</p><p>La procalcitonine s’élève sous l’effet des produits bactériens, mais aussi dans toute inflammation systémique intense : une grippe grave avec choc ou syndrome de détresse respiratoire aiguë l’élève sans surinfection. Dans la méta-analyse de Wu, la sensibilité groupée atteint 0,84 et la spécificité 0,64, avec un rapport de vraisemblance positif de 2,31 et négatif de 0,26 : la valeur d’exclusion dépasse nettement la valeur de confirmation.</p><p class="lab">Conséquence pratique</p><p>Une valeur basse soutient la décision de ne pas commencer un antibiotique ; une valeur élevée ne le justifie pas à elle seule, car la décision reste clinique et radiologique. Dans les deux cas, la réévaluation est datée et le résultat ne se lit jamais seul.</p><p class="src">Références : <a href="https://doi.org/10.1111/j.1750-2659.2012.00386.x" target="_blank" rel="noopener">Wu et collaborateurs, procalcitonine dans la grippe, 2012</a> ; <a href="https://doi.org/10.1016/j.jinf.2015.11.007" target="_blank" rel="noopener">Rodríguez et collaborateurs, seuils de procalcitonine en soins intensifs, 2016</a>.</p></template>
<template data-pop="j09-reflexe-zoonose" data-title="Suspicion de virus animal : l’ordre des gestes"><p class="lab">Ordre des gestes</p><p>Isoler le patient et porter une protection respiratoire ; prélever le nasopharynx, et les voies aériennes basses si l’atteinte y siège ; inscrire l’exposition animale sur la demande et appeler le laboratoire de référence avant l’envoi ; déclarer la suspicion par téléphone dans les deux heures ; débuter l’oseltamivir sans attendre le résultat.</p><p class="lab">Mécanisme</p><p>Les amorces des tests de routine ciblent les sous-types humains attendus : une grippe A non sous-typable, voire un test négatif, n’écarte pas un virus aviaire. Ces virus se répliquent surtout dans le poumon profond, ce qui rend un prélèvement nasal isolé moins fiable.</p><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-aviaire-h5n1-situation-en-suisse" target="_blank" rel="noopener">OFSP, grippe aviaire A(H5N1), situation en Suisse, consultée le 08.10.2026</a> ; <a href="https://www.hug.ch/laboratoire-virologie/centre-national-reference-influenza-cnri" target="_blank" rel="noopener">Hôpitaux universitaires de Genève, Centre national de référence de l’influenza</a>.</p></template>
<template data-pop="j09-piege-derive" data-title="Dérive annuelle ou cassure pandémique"><p class="lab">Mécanisme</p><p>La dérive accumule des mutations ponctuelles sur les sites antigéniques de l’hémagglutinine, au sein d’un même sous-type : l’immunité acquise reste partiellement efficace. La cassure échange des segments entiers et introduit chez l’être humain une hémagglutinine de sous-type nouveau, devant laquelle la population n’a pas d’immunité.</p><p class="lab">Conséquence pratique</p><p>Appeler « nouvelle souche » un variant annuel conduit à surestimer le risque pandémique et à sous-estimer la protection résiduelle d’une vaccination antérieure. Seul un sous-type inhabituel, par exemple une grippe A non sous-typable en routine, justifie la déclaration immédiate et le recours au laboratoire de référence.</p><p class="src">Référence : <a href="https://doi.org/10.1038/s41572-018-0002-y" target="_blank" rel="noopener">Krammer et collaborateurs, revue de synthèse sur la grippe, 2018</a>.</p></template>
<template data-pop="j09-federal-sdra" data-title="Définition globale 2024 du syndrome de détresse respiratoire aiguë"><p class="lab">Critères</p><p>Un facteur déclenchant, des opacités bilatérales, l’absence d’explication purement cardiogénique et une hypoxémie définie par un rapport PaO₂/FiO₂ inférieur ou égal à 300 mmHg, ou par un rapport SpO₂/FiO₂ inférieur ou égal à 315 lorsque la saturation est inférieure ou égale à 97 %. L’oxygénation nasale à haut débit d’au moins 30 L/min est admise, ainsi que l’échographie thoracique comme modalité d’imagerie.</p><p class="lab">Conséquence pratique</p><p>Une grippe hypoxémiante se classe donc sans gazométrie ni ventilation invasive, ce qui permet le diagnostic au lit du malade. La définition de Berlin, de 2012, exigeait une gazométrie et une pression expiratoire positive d’au moins 5 centimètres d’eau ; elle reste celle des essais antérieurs, dont les seuils ne se transposent pas sans précaution.</p><p class="src">Référence : <a href="https://doi.org/10.1164/rccm.202303-0558WS" target="_blank" rel="noopener">Matthay et collaborateurs, définition globale du syndrome de détresse respiratoire aiguë, 2024</a>.</p></template>
