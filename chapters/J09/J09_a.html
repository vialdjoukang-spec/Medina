<section class="ilot" id="j09-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>En janvier, une femme de 72 ans consulte au deuxième jour d’une fièvre à 39,2 °C. Les frissons, les courbatures et une toux sèche ont commencé en quelques heures, la veille au soir. Elle a une insuffisance cardiaque connue. Trois personnes de son entourage présentent les mêmes symptômes. <b>La question n’est pas seulement « est-ce une grippe ? », mais « cette grippe va-t-elle se compliquer, et que faut-il faire aujourd’hui ? »</b></p>
<p>La grippe est une infection aiguë par un virus influenza. Chez la plupart des adultes, elle guérit seule en une à deux semaines. Chez une minorité, elle se complique d’une pneumonie virale, d’une surinfection bactérienne ou de la décompensation d’une maladie chronique ; ces complications causent chaque hiver plusieurs milliers d’hospitalisations en Suisse. Le médecin doit donc reconnaître la grippe, mesurer le risque de complication et agir vite, car l’efficacité des antiviraux décroît à mesure que la réplication virale s’éteint.</p>
<p>Quatre compétences en découlent. Il faut comprendre pourquoi le virus change chaque année et pourquoi il provoque parfois une pandémie. Il faut relier chaque symptôme et chaque complication à son mécanisme. Il faut savoir qui bénéficie d’un test, d’un antiviral ou d’une hospitalisation. Il faut enfin appliquer les recommandations suisses de vaccination et de déclaration. <button class="w" data-justification="1" data-k="j09-q-decision">Les quatre décisions à prendre devant un syndrome grippal (ordre et raison)</button> structurent toute la démarche.</p>
<div class="key"><b>À retenir.</b> Devant un syndrome grippal, le médecin pose trois questions successives : le tableau est-il compatible avec une grippe, le patient appartient-il à un groupe à risque de complication, et existe-t-il déjà un signe de gravité ? La réponse à ces trois questions décide du test, du traitement et du lieu de soins. Tout commence par le virus, dont les propriétés éclairent chacune de ces décisions.</div>
<p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/prevention-and-control/antivirals" target="_blank" rel="noopener">ECDC, Antiviral treatment of influenza, consultée le 08.10.2026</a>.</p></section>

<section class="ilot" id="j09-1"><h2><span class="n">1</span>Définition et classification virale</h2>
<p>La <b>grippe</b> (influenza) est une infection respiratoire aiguë causée par un virus de la famille des <i>Orthomyxoviridae</i>. Ce virus possède une enveloppe lipidique et un génome d’acide ribonucléique simple brin, divisé en huit segments chez les types A et B. Le terme de « grippe » ne désigne donc pas n’importe quel « état grippal » : un rhume, une infection à SARS-CoV-2 ou à VRS peuvent provoquer des symptômes voisins sans être une grippe au sens strict.</p>
<h3>Types, sous-types et lignées</h3>
<p>Les virus influenza se répartissent en quatre types, A, B, C et D, selon leurs protéines internes. <button class="w" data-justification="1" data-k="j09-types">Seuls les types A et B provoquent les épidémies humaines (réservoirs et gravité)</button>. Le type A infecte de nombreuses espèces, en particulier les oiseaux aquatiques sauvages, qui constituent son réservoir naturel. Le type B circule presque exclusivement chez l’être humain. Le type C provoque des infections bénignes, et le type D touche surtout les bovins.</p>
<p>Les virus du type A se classent en <button class="w" data-justification="1" data-k="j09-hn">sous-types selon leurs deux glycoprotéines de surface (hémagglutinine et neuraminidase)</button>. On connaît au moins 18 hémagglutinines (H) et 11 neuraminidases (N). Un sous-type associe une hémagglutinine et une neuraminidase : H1N1 ou H3N2, par exemple. Les virus du type B ne forment pas de sous-types ; ils se divisent en deux lignées, Victoria et Yamagata. Depuis la pandémie de COVID-19, la surveillance suisse ne détecte plus de virus de la lignée Yamagata.</p>
<p>En Suisse, trois virus saisonniers circulent aujourd’hui : A(H1N1)pdm09, A(H3N2) et B/Victoria. Lors de la saison 2023/2024, A(H1N1)pdm09 représentait 72,1 % des virus identifiés par le réseau Sentinella, A(H3N2) 18,4 % et B/Victoria 8,5 %. La proportion de chaque virus varie d’une saison à l’autre ; elle influence la gravité de la saison et l’efficacité du vaccin. <button class="w" data-justification="1" data-k="j09-nomenclature">Le nom complet d’une souche suit une règle internationale (lecture d’un exemple)</button>.</p>
<h3>Dérive et cassure antigéniques</h3>
<p>La <button class="w" data-justification="1" data-k="j09-derive">dérive antigénique (mutations ponctuelles et réinfections)</button> est une modification progressive de l’hémagglutinine et de la neuraminidase. La polymérase virale ne corrige pas ses erreurs de copie. Les mutations qui modifient les sites reconnus par les anticorps permettent au virus d’échapper partiellement à l’immunité acquise lors des saisons précédentes. C’est la raison pour laquelle une personne peut faire plusieurs grippes au cours de sa vie et pour laquelle la composition du vaccin est révisée chaque année.</p>
<p>La <button class="w" data-justification="1" data-k="j09-cassure">cassure antigénique (réassortiment et pandémie)</button> est un changement brutal : un virus de type A acquiert une hémagglutinine contre laquelle la population humaine n’a presque aucune immunité. Elle survient surtout par réassortiment, lorsque deux virus différents infectent la même cellule et échangent des segments de leur génome. Si le nouveau virus se transmet efficacement d’une personne à l’autre, il peut provoquer une <b>pandémie</b>. Les quatre pandémies du siècle dernier et du début de ce siècle ont été causées par des virus H1N1 en 1918, H2N2 en 1957, H3N2 en 1968 et A(H1N1)pdm09 en 2009.</p>
<p>Un <b>virus zoonotique</b> est un virus d’origine animale qui infecte occasionnellement l’être humain. Le virus aviaire A(H5N1) en est l’exemple principal. De 2003 au 31 mars 2026, l’OMS a recensé 997 infections humaines confirmées par ce virus, dont 478 décès. Cette létalité apparente de près de 50 % surestime la létalité réelle, car les formes graves sont bien plus souvent testées que les formes bénignes. La plupart de ces infections ont suivi un contact rapproché avec des volailles ; aucune transmission interhumaine soutenue n’a été documentée à ce jour.</p>

<div class="key"><b>À retenir.</b> La grippe est causée par un virus influenza A ou B. Les mutations ponctuelles de la dérive expliquent les épidémies annuelles et la révision annuelle du vaccin. Le réassortiment de la cassure peut créer un virus nouveau et provoquer une pandémie. L’épidémiologie montre ensuite comment ces virus circulent en Suisse.</div>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, 2018</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://cdn.who.int/media/docs/default-source/influenza/h5n1-human-case-cumulative-table/2026_table_h5n1_march.pdf" target="_blank" rel="noopener">OMS, cas humains cumulés de grippe A(H5N1), état au 31.03.2026</a>.</p></section>

<section class="ilot" id="j09-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>En Suisse, la grippe circule par vagues hivernales. La saison grippale de la surveillance s’étend de la semaine 40 à la semaine 20 de l’année suivante. Le pic survient le plus souvent entre fin décembre et février : lors de la saison 2023/2024, les consultations pour syndrome grippal ont culminé la cinquième semaine de 2024, avec 148 consultations pour 100 000 habitants en une semaine. Le moment du pic varie d’une année à l’autre, si bien que le médecin ne peut pas déduire l’activité grippale du seul calendrier.</p>
<h3>Comment la Suisse mesure la grippe</h3>
<p>L’OFSP s’appuie sur plusieurs systèmes complémentaires. Le <button class="w" data-justification="1" data-k="j09-sentinella">réseau Sentinella (définition du syndrome grippal et extrapolation)</button> réunit environ 170 cabinets de médecins de premier recours qui déclarent leurs consultations et envoient une partie de leurs frottis au Centre national de référence de l’influenza, à Genève. Les laboratoires déclarent en outre chaque infection confirmée, et un réseau d’hôpitaux a suivi jusqu’en août 2024 les hospitalisations dues à la grippe. Depuis 2022, la recherche du virus dans les eaux usées complète ces données.</p>
<p>Sur l’année 2023/2024, l’OFSP estime qu’environ 230 000 consultations ambulatoires ont concerné un syndrome grippal, soit 2595 consultations pour 100 000 habitants. Avant la pandémie de COVID-19, la moyenne des saisons 2013/2014 à 2018/2019 atteignait 2844 consultations pour 100 000 habitants. <button class="w" data-justification="1" data-k="j09-seuil">Le début d’une épidémie se repère aujourd’hui par la proportion de frottis positifs (pourquoi l’ancien seuil a été abandonné)</button> : en 2023/2024, plus de 10 % des frottis Sentinella étaient positifs pour un virus influenza de la semaine 49 à la semaine 11.</p>
<h3>Qui tombe malade, qui est hospitalisé</h3>
<p>L’incidence et la gravité ne touchent pas les mêmes âges. <button class="w" data-justification="1" data-k="j09-age">Les enfants consultent le plus, les personnes âgées sont le plus hospitalisées (données suisses et explication)</button>. En 2023/2024, les infections confirmées en laboratoire atteignaient 459 cas pour 100 000 habitants chez les enfants de 0 à 4 ans et 441 cas pour 100 000 chez les personnes de 65 ans et plus. Les personnes hospitalisées pour une grippe avaient un âge médian de 71 ans.</p>
<p>Dans les six hôpitaux de surveillance, 1653 hospitalisations ont été dues à la grippe en 2023/2024. Parmi ces patients, 12,0 % ont séjourné aux soins intensifs et 4,2 % sont décédés pendant l’hospitalisation. Dans 17,2 % des cas, l’infection avait été contractée à l’hôpital, ce qui montre l’importance de la prévention chez les soignants. <button class="w" data-justification="1" data-k="j09-fardeau">À l’échelle du pays, l’OFSP décrit plusieurs milliers d’hospitalisations et plusieurs centaines de décès par an (portée et limites de ces chiffres)</button>.</p>
<p>À l’échelle mondiale, l’OMS estime que la grippe saisonnière provoque environ un milliard d’infections, 3 à 5 millions de formes graves et 290 000 à 650 000 décès d’origine respiratoire chaque année. Ces estimations reposent sur des modèles ; elles servent à comparer les maladies et à planifier la prévention, pas à prédire le pronostic d’un patient.</p>
<div class="key"><b>À retenir.</b> La grippe suisse est une épidémie hivernale dont le pic se situe le plus souvent entre fin décembre et février. Les jeunes enfants ont l’incidence la plus élevée, mais les personnes âgées représentent l’essentiel des hospitalisations et des décès. Le médecin consulte les données hebdomadaires de l’OFSP pour savoir si le virus circule : cette information augmente fortement la probabilité qu’un syndrome grippal soit une grippe. Le mécanisme de l’infection explique ensuite pourquoi l’âge et les comorbidités aggravent le pronostic.</div>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière, 2026</a> ; <a href="https://www.who.int/fr/news-room/fact-sheets/detail/influenza-(seasonal)" target="_blank" rel="noopener">OMS, aide-mémoire Grippe saisonnière</a>.</p></section>

<section class="ilot" id="j09-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Les symptômes de la grippe ont deux origines distinctes. La première est la destruction des cellules de l’épithélium respiratoire par le virus. La seconde est la réponse immunitaire de l’hôte, qui produit la fièvre et les courbatures. Comprendre cette double origine permet d’expliquer le début brutal, la fatigue prolongée et les complications.</p>
<h3>L’épithélium respiratoire normal</h3>
<p>La trachée et les bronches sont tapissées d’un épithélium cilié recouvert de mucus. Le mucus capte les particules inhalées, et le battement coordonné des cils le transporte vers le pharynx, où il est dégluti. Les mucines du mucus portent des résidus d’acide sialique, le même sucre que le virus utilise pour s’attacher aux cellules. Dans les alvéoles, les pneumocytes de type I assurent les échanges gazeux et les pneumocytes de type II produisent le surfactant.</p>
<h3>Le cycle du virus dans la cellule</h3>
<p>La figure 1 résume les six étapes du cycle viral et leurs conséquences cliniques. Chaque étape constitue aussi une cible thérapeutique ou une explication d’un symptôme.</p>

<p>Pour lire la figure, il faut suivre la ligne A de gauche à droite, puis descendre vers la ligne B. L’attachement se fait par l’<button class="w" data-justification="1" data-k="j09-ha">hémagglutinine sur l’acide sialique (pourquoi le virus aviaire se transmet mal à l’être humain)</button>. Le virus pénètre par endocytose ; l’acidification de la vésicule et le canal ionique de la protéine de matrice 2 libèrent ses segments d’acide ribonucléique. Dans le noyau, <button class="w" data-justification="1" data-k="j09-cycle">la polymérase virale vole la coiffe des ARN messagers de la cellule (étape ciblée par le baloxavir)</button> pour produire ses propres protéines. À la fin du cycle, la <button class="w" data-justification="1" data-k="j09-na">neuraminidase libère les nouveaux virions (étape ciblée par l’oseltamivir)</button>. La réplication atteint son maximum un à deux jours après l’infection ; l’excrétion virale dure en moyenne cinq jours chez l’adulte sain.</p>
<h3>La réponse de l’hôte : protectrice, puis responsable des symptômes</h3>
<p>Les cellules infectées détectent l’acide ribonucléique viral et sécrètent des interférons. Ces molécules mettent les cellules voisines en état de résistance antivirale. Le virus produit une protéine non structurale qui freine cette réponse. <button class="w" data-justification="1" data-k="j09-ifn">Cet équilibre entre interférons et protéine virale détermine la vitesse de réplication (mécanisme et conséquence)</button>.</p>
<p>Les cellules épithéliales et les macrophages libèrent aussi des cytokines inflammatoires. Chez des volontaires infectés, l’IL-6 et l’interféron alpha culminent dès le deuxième jour, en parallèle de la charge virale, de la fièvre et des symptômes ; le TNF s’élève plus tard. <button class="w" data-justification="1" data-k="j09-cytokines">Ces cytokines produisent la fièvre, les frissons et les courbatures (de la cytokine au symptôme)</button>. C’est la raison pour laquelle les symptômes généraux dominent dès le premier jour, alors que la lésion respiratoire est encore limitée. La guérison dépend de l’<button class="w" data-justification="1" data-k="j09-adaptatif">immunité adaptative (anticorps contre l’hémagglutinine et lymphocytes T CD8)</button>, qui apparaît en une à deux semaines lors d’une première rencontre avec un sous-type.</p>
<h3>Des lésions bronchiques aux lésions alvéolaires</h3>
<p>Dans la forme non compliquée, le virus détruit surtout l’épithélium de la trachée et des bronches. Les cellules ciliées meurent et se détachent ; la clairance mucociliaire s’effondre. La réparation commence en quelques jours, mais la restauration complète de l’épithélium peut demander plusieurs semaines. <b>Cette réparation lente explique la toux et la fatigue qui persistent souvent plus de deux semaines, sans qu’il faille y voir une infection persistante.</b></p>
<p>Lorsque le virus atteint les alvéoles, il provoque une <button class="w" data-justification="1" data-k="j09-dad">pneumonie virale primaire par dommage alvéolaire diffus (de la lésion à l’hypoxémie)</button>. Les alvéoles se remplissent d’œdème et de fibrine, qui forment des membranes hyalines. Le sang qui traverse ces alvéoles n’est plus oxygéné : la saturation baisse, même sous oxygène, et le tableau peut évoluer vers un SDRA en quelques jours.</p>
<p>La lésion virale prépare aussi la <button class="w" data-justification="1" data-k="j09-surinfection">surinfection bactérienne (synergie virus-bactérie)</button>. L’épithélium détruit expose la membrane basale, la neuraminidase dévoile des récepteurs pour les bactéries, et la réponse interféron altère le recrutement des polynucléaires. <i>Streptococcus pneumoniae</i>, <i>Staphylococcus aureus</i> et <i>Streptococcus pyogenes</i> profitent de ces conditions. Au cours de la pandémie de 1918, la majorité des décès a été attribuée à une pneumonie bactérienne secondaire.</p>
<p>L’inflammation systémique a enfin des conséquences hors du poumon. La fièvre et la tachycardie augmentent la consommation d’oxygène du myocarde, et l’inflammation favorise la rupture d’une plaque d’athérome et la thrombose. Dans une étude ontarienne, le risque d’hospitalisation pour infarctus du myocarde était multiplié par 6 au cours des sept jours suivant une grippe confirmée. C’est pourquoi une grippe peut se présenter comme une décompensation cardiaque chez la patiente de 72 ans.</p>
<div class="key"><b>À retenir.</b> Le virus détruit l’épithélium bronchique et provoque une réponse cytokinique responsable de la fièvre et des courbatures. L’atteinte alvéolaire produit une pneumonie virale hypoxémiante ; l’épithélium lésé favorise la surinfection par le pneumocoque ou le staphylocoque doré ; l’inflammation systémique déstabilise le cœur. Les deux antiviraux principaux agissent à deux étapes du cycle viral. Ces mécanismes expliquent pourquoi la contagiosité est maximale au début et pourquoi certains terrains se compliquent davantage.</div>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., causes de décès en 1918, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus après grippe, 2018</a>.</p></section>

<section class="ilot" id="j09-4"><h2><span class="n">4</span>Transmission, contagiosité et facteurs de risque</h2>
<p>La grippe se transmet d’une personne à l’autre par les voies respiratoires. Une personne infectée émet des particules de tailles variées lorsqu’elle tousse, éternue ou parle. <button class="w" data-justification="1" data-k="j09-voies">Gouttelettes, aérosols et contact (part de chaque voie et mesures correspondantes)</button> expliquent la diffusion rapide dans les familles, les écoles et les établissements de soins. Les mains contaminées et les surfaces jouent un rôle moindre, mais réel.</p>
<h3>Incubation et période contagieuse</h3>
<p>Les symptômes apparaissent en moyenne deux jours après l’infection, avec des extrêmes de un à quatre jours. <button class="w" data-justification="1" data-k="j09-incubation">La contagiosité commence la veille des symptômes et dure cinq à sept jours (cinétique de l’excrétion)</button>. Elle est maximale durant les trois premiers jours de la maladie, lorsque la charge virale est la plus élevée. Les jeunes enfants et les personnes immunodéprimées excrètent le virus plus longtemps, parfois pendant plusieurs semaines chez l’immunodéprimé.</p>
<p>Une partie des infections passe inaperçue. Dans les études d’inoculation volontaire, environ deux infections sur trois seulement provoquaient des symptômes. <button class="w" data-justification="1" data-k="j09-asympto">Les personnes peu symptomatiques excrètent moins de virus, mais en excrètent (conséquence pour la prévention)</button>. C’est pourquoi l’isolement des seuls malades fébriles ne suffit pas à protéger un service hospitalier ; la vaccination du personnel et le port du masque complètent la protection.</p>
<h3>Facteurs de risque de complication</h3>
<p>Le risque de complication ne dépend pas d’abord du virus, mais du terrain. Dans le réseau Sentinella, les patients porteurs d’une maladie chronique avaient en 2023/2024 un risque de pneumonie 3,3 fois plus élevé que les autres. L’OFSP désigne les <button class="w" data-justification="1" data-k="j09-risque">personnes à risque accru de complications (liste officielle 2025)</button>, qui sont aussi les cibles prioritaires de la vaccination. Le tableau suivant relie chaque facteur au mécanisme qui aggrave la grippe ; il sert à expliquer le risque au patient et à décider d’un antiviral.</p>
<table class="t"><tr><th>Facteur de risque (OFSP)</th><th>Mécanisme principal de l’aggravation</th></tr>
<tr><td>65 ans et plus</td><td>Réponse immunitaire moins efficace, comorbidités fréquentes, réserve cardiorespiratoire réduite</td></tr>
<tr><td>Grossesse et 4 semaines après l’accouchement</td><td>Capacité pulmonaire de réserve diminuée, débit cardiaque augmenté, adaptation immunitaire de la grossesse</td></tr>
<tr><td>Maladie cardiaque</td><td>Fièvre et tachycardie augmentent la demande en oxygène ; inflammation favorisant l’infarctus</td></tr>
<tr><td>Maladie pulmonaire, asthme compris</td><td>Bronchospasme induit par le virus, réserve ventilatoire faible</td></tr>
<tr><td>Diabète, obésité morbide (IMC ≥ 40)</td><td>Fonction des polynucléaires altérée par l’hyperglycémie ; volumes pulmonaires réduits par l’obésité</td></tr>
<tr><td>Maladie neurologique ou musculosquelettique</td><td>Toux inefficace, risque d’inhalation, faiblesse des muscles respiratoires</td></tr>
<tr><td>Maladie hépatique, insuffisance rénale</td><td>Défenses diminuées, déséquilibres hydriques et métaboliques sous fièvre</td></tr>
<tr><td>Asplénie, hémoglobinopathie</td><td>Clairance réduite des bactéries encapsulées, dont le pneumocoque de surinfection</td></tr>
<tr><td>Immunodéficience (infection VIH, cancer, immunosuppresseur)</td><td>Réplication virale prolongée, pneumonie virale, sélection de résistances</td></tr>
<tr><td>Résidence en maison de soins ou en établissement pour malades chroniques</td><td>Âge et fragilité cumulés, transmission rapide entre résidents</td></tr></table>
<p>Ce tableau se lit en partant du patient : le médecin recherche chaque ligne à l’anamnèse, et une seule ligne présente suffit à classer le patient « à risque ». Chez la femme de 72 ans de l’introduction, deux lignes sont présentes : l’âge et la maladie cardiaque. L’erreur fréquente consiste à rassurer un patient jeune et obèse ou une femme enceinte en bonne santé apparente, alors que l’ECDC compte l’obésité morbide parmi les terrains de complication et que la grossesse augmente le risque d’hospitalisation pour maladie respiratoire pendant les saisons grippales. <button class="w" data-justification="1" data-k="j09-grossesse-risque">La grossesse aggrave la grippe par des mécanismes respiratoires, circulatoires et immunitaires (détail)</button>.</p>
<p>La liste de l’OFSP a été conçue pour la vaccination. Pour décider d’un antiviral, <button class="w" data-justification="1" data-k="j09-oms-risque">la Société suisse d’infectiologie et l’OMS emploient leur propre définition du « haut risque » et du « très haut risque » de forme grave (comparaison avec l’OFSP)</button>. Ces définitions se recouvrent largement : pour l’antiviral, le médecin applique la liste de la Société suisse d’infectiologie et la complète par son jugement clinique.</p>
<div class="key"><b>À retenir.</b> La grippe se transmet par voie respiratoire, après une incubation de un à quatre jours. La contagiosité commence la veille des symptômes, culmine pendant les trois premiers jours et se prolonge chez l’enfant et l’immunodéprimé. Le risque de complication dépend du terrain : âge de 65 ans et plus, grossesse, maladie chronique, immunodéficience ou résidence en établissement de soins. L’anamnèse doit établir ce terrain dès la première minute de consultation.</div>
<p class="src">Références : <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel 2023/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28011603/" target="_blank" rel="noopener">Ip et al., 2017</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a>.</p></section>

<section class="ilot" id="j09-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse répond à trois questions : le récit est-il celui d’une grippe, quand la maladie a-t-elle commencé, et le patient appartient-il à un groupe à risque ? La deuxième est souvent oubliée ; c’est pourtant elle qui conditionne l’efficacité d’un antiviral chez le patient ambulatoire.</p>
<h3>Le récit typique</h3>
<p>Le <button class="w" data-justification="1" data-k="j09-debut">début brutal (pourquoi le patient peut souvent donner l’heure)</button> est le trait le plus évocateur. Le patient décrit une <button class="w" data-justification="1" data-k="j09-fievre">fièvre élevée, souvent de 38 à 40 °C, avec frissons (mécanisme et durée)</button>, des <button class="w" data-justification="1" data-k="j09-myalgies">courbatures diffuses et une grande fatigue (origine cytokinique)</button> et des <button class="w" data-justification="1" data-k="j09-cephalees">céphalées (caractéristiques et signes d’alerte)</button>. Une <button class="w" data-justification="1" data-k="j09-toux">toux sèche, une douleur rétrosternale et un mal de gorge (lésion trachéobronchique)</button> accompagnent ou suivent de peu les signes généraux. La rhinorrhée est souvent présente, mais moins au premier plan que dans un rhume.</p>
<p>Lorsque la grippe circule, l’association d’une fièvre et d’une toux apparues depuis moins de 48 heures a une bonne valeur prédictive. Dans une analyse de 3744 adultes et adolescents présentant un syndrome grippal, cette association avait une valeur prédictive positive de 79 % pour une grippe confirmée. Cette valeur dépend toutefois de la fréquence de la grippe dans la population : hors épidémie, le même tableau correspond beaucoup plus souvent à un autre virus.</p>
<h3>Formes typiques et formes atypiques</h3>
<p>La présentation varie selon l’âge et le terrain. Les deux cartes suivantes opposent le tableau de l’adulte jeune à celui des patients chez qui le diagnostic est le plus souvent manqué.</p>
<div class="two"><div class="card"><h4>Forme typique de l’adulte</h4><p>Le début est brutal, avec une fièvre élevée et des frissons dès les premières heures. Les courbatures et la fatigue obligent souvent à s’aliter. La toux sèche et le mal de gorge suivent rapidement. Les signes généraux durent habituellement quelques jours et la maladie cinq à sept jours, mais la toux, la fatigue et le malaise peuvent persister plusieurs semaines.</p></div><div class="card"><h4>Formes atypiques</h4><p>Chez la <button class="w" data-justification="1" data-k="j09-atypique-age">personne âgée fragile (confusion, chute, perte d’appétit sans fièvre)</button>, la fièvre peut manquer et la grippe se révéler par une confusion, une chute ou un refus alimentaire. Chez l’immunodéprimé, la fièvre est souvent modeste alors que la réplication virale se prolonge. Chez le jeune enfant, des nausées, des vomissements ou une diarrhée s’ajoutent aux signes respiratoires. Chez le patient porteur d’une maladie chronique, la grippe peut se présenter d’abord comme une <button class="w" data-justification="1" data-k="j09-decompensation">décompensation de cette maladie (insuffisance cardiaque, BPCO, diabète)</button>.</p></div></div>
<p>Ces cartes portent un avertissement : l’absence de fièvre n’exclut pas une grippe chez un patient âgé ou immunodéprimé. L’erreur fréquente consiste à attribuer la confusion d’un résident d’établissement de soins à sa démence ou à une infection urinaire, alors que plusieurs résidents toussent depuis deux jours.</p>
<h3>Les questions qui changent la décision</h3>
<p>Le médecin demande d’abord <button class="w" data-justification="1" data-k="j09-delai">le jour et l’heure du début des symptômes (délai de 48 heures et antiviral)</button>. Il recherche ensuite les <button class="w" data-justification="1" data-k="j09-contage">contacts et l’activité grippale régionale (probabilité avant le test)</button>. Il établit les facteurs de risque du tableau précédent, sans oublier la grossesse, un traitement immunosuppresseur et le <button class="w" data-justification="1" data-k="j09-vaccin-statut">statut vaccinal de la saison en cours (ce qu’il change et ce qu’il ne change pas)</button>.</p>
<p>Une <button class="w" data-justification="1" data-k="j09-expo-animale">exposition à des volailles, à des oiseaux sauvages ou à d’autres animaux infectés (suspicion de grippe zoonotique)</button> change entièrement la conduite : elle impose des mesures de protection, un test spécifique et une déclaration. Le médecin s’enquiert aussi des médicaments : chez l’enfant et l’adolescent, <button class="w" data-justification="1" data-k="j09-aspirine">l’acide acétylsalicylique est proscrit pendant une grippe (syndrome de Reye)</button>.</p>
<p>Il recherche enfin les signes d’alarme du récit : une dyspnée, une douleur thoracique, une confusion, une baisse de la diurèse ou une incapacité à boire. Une <button class="w" data-justification="1" data-k="j09-biphasique">aggravation après une amélioration initiale (évolution en deux temps et surinfection)</button> est un signal particulièrement important.</p>
<div class="key"><b>À retenir.</b> Le récit typique associe un début brutal, une fièvre élevée, des courbatures et une toux sèche. Le médecin date précisément le début, établit le terrain, vérifie la vaccination et recherche une exposition animale. Chez la personne âgée ou immunodéprimée, la fièvre peut manquer : une confusion, une chute ou une décompensation chronique en période épidémique doivent faire évoquer la grippe. L’examen clinique cherche ensuite à mesurer la gravité.</div>
<p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://www.ecdc.europa.eu/en/seasonal-influenza/facts/factsheet" target="_blank" rel="noopener">ECDC, Factsheet about seasonal influenza, consultée le 08.10.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation volontaire, 2008</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a>.</p></section>

<section class="ilot" id="j09-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Dans une grippe non compliquée, l’examen est souvent pauvre en signes localisés : le patient est fébrile, fatigué, parfois tachycarde, mais l’auscultation pulmonaire est normale. La valeur de l’examen tient donc moins à la confirmation de la grippe qu’à la recherche d’une complication. Le médecin commence par l’état général et les paramètres vitaux, puis examine les organes que la grippe peut atteindre.</p>
<h3>Paramètres vitaux</h3>
<p>Les paramètres vitaux permettent de mesurer objectivement la gravité. Le tableau suivant compare, pour chacun, le repère normal de l’adulte et le seuil qui fait changer la décision. Les seuils proviennent des recommandations suisses sur l’infection respiratoire aiguë, que la grippe partage avec la pneumonie.</p>
<table class="t"><tr><th>Paramètre</th><th>Repère normal (adulte)</th><th>Seuil d’alarme</th></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-fr">Fréquence respiratoire (technique et signification)</button></td><td>12 à 20 par minute</td><td>30 par minute ou plus</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-spo">Saturation pulsée en oxygène (mesure et pièges)</button></td><td>95 % ou plus en air ambiant</td><td>Moins de 92 % ; moins de 90 % : hospitalisation à envisager</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-pa">Pression artérielle et perfusion (hypotension et déshydratation)</button></td><td>Valeur habituelle du patient</td><td>Systolique inférieure à 90 mmHg</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-fc">Fréquence cardiaque (fièvre, déshydratation ou myocardite)</button></td><td>60 à 100 par minute</td><td>Tachycardie disproportionnée à la fièvre</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-conscience">État de conscience (confusion et ses causes)</button></td><td>Orienté, attentif</td><td>Confusion nouvelle</td></tr></table>
<p>Ce tableau se lit de haut en bas, dans l’ordre de la mesure. Un seul seuil d’alarme suffit à faire envisager une évaluation hospitalière, même si les autres paramètres sont normaux. L’erreur fréquente consiste à ne pas compter la fréquence respiratoire, alors qu’elle s’élève souvent avant la baisse de la saturation. Chez la femme de 72 ans de l’introduction, une fréquence respiratoire de 28 par minute et une saturation de 91 % imposent une évaluation hospitalière malgré une pression artérielle normale.</p>
<h3>Examen ciblé</h3>
<div class="two"><div class="card"><h4>Ce qui est compatible avec une grippe simple</h4><p>Le pharynx est rouge, sans dépôt. Les conjonctives peuvent être injectées. De petits ganglions cervicaux sensibles sont possibles. L’<button class="w" data-justification="1" data-k="j09-ausc">auscultation pulmonaire (normale ou bruits bronchiques diffus)</button> est le plus souvent normale ; quelques ronchi diffus traduisent l’atteinte bronchique. Le patient boit et se lève.</p></div><div class="card"><h4>Ce qui oriente vers une complication</h4><p>Des crépitants localisés ou un foyer de matité orientent vers une pneumonie virale ou bactérienne. Des sibilants diffus traduisent un bronchospasme, en particulier chez l’asthmatique. Des signes de <button class="w" data-justification="1" data-k="j09-deshydratation">déshydratation (muqueuses sèches, hypotension orthostatique)</button> traduisent des pertes non compensées. Des signes d’insuffisance cardiaque, une raideur de nuque, un déficit neurologique ou des muscles très douloureux à la pression font rechercher une atteinte d’organe.</p></div></div>
<p>Ces deux cartes ne s’opposent pas comme « grippe » et « pas grippe » : elles séparent une grippe simple d’une grippe compliquée. La présence d’un signe de la seconde carte ne remet pas en cause le diagnostic de grippe ; elle impose de rechercher la complication correspondante. Le médecin rassemble enfin ces éléments dans une <button class="w" data-justification="1" data-k="j09-alarme">liste de signes de gravité (synthèse et conduite)</button>.</p>
<div class="quiz ui"><p>Un homme de 45 ans, sans antécédent, consulte au troisième jour d’une grippe typique. Il allait mieux la veille, mais la fièvre est réapparue à 39,5 °C avec une toux productive et une douleur thoracique droite. La fréquence respiratoire est de 26 par minute et la saturation de 93 %. Quelle hypothèse faut-il retenir en premier ?</p><button data-ok="0">Une évolution naturelle de la grippe, qui ne justifie qu’un traitement symptomatique</button><button data-ok="1">Une pneumonie bactérienne de surinfection, qui impose une évaluation rapide et une imagerie</button><button data-ok="0">Une toux postvirale, qui peut durer plusieurs semaines</button><p class="fb" hidden>La réapparition de la fièvre après une amélioration, avec une toux productive, une douleur thoracique et une tachypnée, signe une évolution en deux temps. L’épithélium détruit par le virus favorise l’adhérence du pneumocoque et du staphylocoque doré. Le médecin recherche un foyer à l’examen et à l’imagerie, et discute une antibiothérapie. La toux postvirale persiste sans fièvre ni dyspnée ; elle ne s’accompagne pas d’une aggravation.</p></div>
<div class="key"><b>À retenir.</b> L’examen d’une grippe simple est souvent normal en dehors de la fièvre. Sa fonction est de rechercher une complication : une fréquence respiratoire de 30 par minute ou plus, une saturation inférieure à 92 %, une systolique inférieure à 90 mmHg ou une confusion nouvelle sont des signaux d’alarme. Un foyer pulmonaire, une déshydratation, des signes cardiaques ou neurologiques orientent vers une atteinte d’organe. Le diagnostic, les tests et les diagnostics différentiels sont traités dans la partie suivante.</div>
<p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, version validée le 09.09.2026</a> ; <a href="https://www.rki.de/DE/Aktuelles/Publikationen/RKI-Ratgeber/Ratgeber/Ratgeber_Influenza_saisonal.html" target="_blank" rel="noopener">Institut Robert Koch (Allemagne), guide Influenza saisonnière, chapitres actualisés en février 2025</a>.</p>
<button class="pareto-btn ui" data-k="pareto-j09-bases">▲ Loi de Pareto — Virus, mécanismes et clinique de la grippe</button></section>
