<section class="ilot" id="j09-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>En janvier, une femme de 72 ans, insuffisante cardiaque, consulte au deuxième jour d’une fièvre à 39,2 °C. Les frissons, les courbatures et une toux sèche ont débuté en quelques heures, la veille au soir ; trois proches ont les mêmes symptômes. <b>La question n’est pas seulement « est-ce une grippe ? », mais « va-t-elle se compliquer, et que faire aujourd’hui ? »</b></p>
<p>La plupart des adultes guérissent seuls en une à deux semaines. Chez une minorité, la grippe se complique d’une pneumonie virale, d’une surinfection bactérienne ou de la décompensation d’une maladie chronique ; ces complications causent chaque hiver plusieurs milliers d’hospitalisations en Suisse. L’antiviral agit d’autant mieux qu’il est précoce : <button class="w" data-justification="1" data-k="j09-q-decision">quatre décisions s’enchaînent dès la première consultation (ordre et raison)</button>.</p>
<div class="key"><b>À retenir.</b> Trois questions guident la consultation : le tableau évoque-t-il une grippe, le patient est-il à risque, existe-t-il un signe de gravité ? Leurs réponses décident du test, du traitement et du lieu de soins.</div>
<p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA, 2019</a>.</p></section></section>

<section class="ilot" id="j09-1"><h2><span class="n">1</span>Définition, virus et codage</h2>
<p>La <b>grippe</b> (influenza) est une infection respiratoire aiguë due à un virus enveloppé de la famille des <i>Orthomyxoviridae</i>, dont le génome d’acide ribonucléique simple brin compte huit segments chez les types A et B. Un « état grippal » dû à un rhinovirus, au SARS-CoV-2 ou au VRS n’est pas une grippe.</p>
<h3>Types, sous-types et lignées</h3>
<p><button class="w" data-justification="1" data-k="j09-types">Seuls les types A et B causent les épidémies humaines (les quatre types)</button>. Le type A a pour réservoir les oiseaux aquatiques sauvages ; le type B est presque strictement humain. Le type A se classe en <button class="w" data-justification="1" data-k="j09-hn">sous-types H et N</button> : au moins 18 hémagglutinines et 11 neuraminidases sont connues, combinées par exemple en H1N1 ou H3N2. Le type B se divise en lignées Victoria et Yamagata ; la surveillance suisse ne détecte plus Yamagata depuis la pandémie de COVID-19.</p>
<p>En 2023/2024, A(H1N1)pdm09 représentait 72,1 % des virus identifiés par le réseau Sentinella, A(H3N2) 18,4 % et B/Victoria 8,5 %. Cette répartition change chaque saison et module la gravité de la saison comme l’efficacité du vaccin. <button class="w" data-justification="1" data-k="j09-nomenclature">Le nom complet d’une souche suit une règle internationale</button>.</p>
<h3>Dérive et cassure antigéniques</h3>
<p>La <button class="w" data-justification="1" data-k="j09-derive">dérive antigénique</button> modifie progressivement l’hémagglutinine et la neuraminidase des types A et B. Elle explique les réinfections au cours de la vie et la révision annuelle du vaccin.</p>
<p>La <button class="w" data-justification="1" data-k="j09-cassure">cassure antigénique (réassortiment)</button> dote brusquement un virus A d’une hémagglutinine que la population ne connaît pas. S’il se transmet efficacement entre humains, ce virus provoque une <b>pandémie</b> : H1N1 en 1918, H2N2 en 1957, H3N2 en 1968, A(H1N1)pdm09 en 2009.</p>
<p>Un <b>virus zoonotique</b> est un virus animal qui infecte occasionnellement l’être humain, au premier rang A(H5N1). De 2003 au 31 mars 2026, l’OMS a recensé 997 infections humaines confirmées par ce virus, dont 478 décès ; ce rapport surestime la létalité, car les formes graves sont plus souvent testées. La plupart des cas ont suivi un contact rapproché avec des volailles, sans transmission interhumaine soutenue documentée.</p>
<h3>Codage CIM-10-GM</h3>
<p>La CIM-10-GM 2024 code la grippe selon le virus identifié, ce qui conditionne la surveillance et la déclaration.</p>
<table class="t"><tr><th>Code et intitulé</th><th>Situation</th><th>Exemple</th></tr>
<tr><td><b>J09 — Grippe à virus d’influenza zoonotique ou pandémique identifié</b></td><td>Virus transmis par l’animal ou pandémique</td><td>A(H5N1) après contact avec des volailles</td></tr>
<tr><td><b>J10 — Grippe, à virus d’influenza saisonnière identifié</b></td><td>Virus saisonnier A, B ou C confirmé</td><td>Test positif pour A(H3N2) en janvier</td></tr>
<tr><td><b>J11 — Grippe, virus non identifié</b></td><td>Diagnostic clinique, sans identification</td><td>Syndrome grippal typique en épidémie, non testé</td></tr></table>
<p>Non testée, la patiente de 72 ans relève de J11 ; un test positif pour A(H1N1)pdm09 la classe en J10. Le quatrième caractère précise la manifestation : <b>J10.0</b> et <b>J11.0</b> désignent une pneumonie, <b>J10.1</b> et <b>J11.1</b> une autre atteinte respiratoire, <b>J10.8</b> et <b>J11.8</b> une autre manifestation, comme une myocardite. <button class="w" data-justification="1" data-k="j09-codage">Trois pièges de codage</button> reviennent souvent. <button class="w" data-flag="federal" data-k="j09-federal-codage">Instant examen fédéral</button></p>
<div class="key"><b>À retenir.</b> La dérive explique les épidémies annuelles et la révision du vaccin ; la cassure peut créer un virus pandémique. J09 désigne un virus zoonotique ou pandémique, J10 un virus saisonnier confirmé, J11 une grippe sans identification du virus.</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j09-j18.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc J09 à J18, version allemande officielle</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, 2018</a> ; <a href="https://cdn.who.int/media/docs/default-source/influenza/h5n1-human-case-cumulative-table/2026_table_h5n1_march.pdf" target="_blank" rel="noopener">OMS, cas humains cumulés de grippe A(H5N1), état au 31.03.2026</a>.</p></section></section>

<section class="ilot" id="j09-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>En Suisse, la surveillance couvre les semaines 40 à 20, et le pic tombe le plus souvent entre fin décembre et février. En 2023/2024, il a atteint 148 consultations pour syndrome grippal pour 100 000 habitants, la cinquième semaine de 2024. Comme sa date varie, le calendrier ne remplace pas le bulletin hebdomadaire de l’OFSP.</p>
<h3>Comment la Suisse mesure la grippe</h3>
<p>Le <button class="w" data-justification="1" data-k="j09-sentinella">réseau Sentinella</button> réunit environ 170 cabinets de premier recours, qui déclarent leurs consultations et envoient des frottis au Centre national de référence de l’influenza, à Genève. Les déclarations des laboratoires, un réseau hospitalier actif jusqu’en août 2024 et, depuis 2022, l’analyse des eaux usées complètent ces données.</p>
<p>En 2023/2024, l’OFSP estime à environ 230 000 les consultations pour syndrome grippal, soit 2595 pour 100 000 habitants, contre 2844 en moyenne de 2013/2014 à 2018/2019. <button class="w" data-justification="1" data-k="j09-seuil">La proportion de frottis positifs repère désormais l’épidémie</button> : elle a dépassé 10 % de la semaine 49 à la semaine 11.</p>
<h3>Qui tombe malade, qui est hospitalisé</h3>
<p><button class="w" data-justification="1" data-k="j09-age">Les enfants s’infectent le plus, les personnes âgées sont le plus hospitalisées</button>. En 2023/2024, les infections confirmées atteignaient 459 pour 100 000 habitants chez les 0 à 4 ans et 441 chez les 65 ans et plus ; l’âge médian des hospitalisés était de 71 ans.</p>
<p>Les six hôpitaux de surveillance ont recensé 1653 hospitalisations pour grippe : 12,0 % des patients ont séjourné aux soins intensifs et 4,2 % sont décédés. L’infection était nosocomiale dans 17,2 % des cas, ce qui justifie la vaccination des soignants. <button class="w" data-justification="1" data-k="j09-fardeau">À l’échelle du pays, l’OFSP estime plusieurs milliers d’hospitalisations et plusieurs centaines de décès par an</button>.</p>
<p>L’OMS estime chaque année un milliard d’infections, 3 à 5 millions de formes graves et 290 000 à 650 000 décès respiratoires dans le monde. Ces chiffres modélisés servent à planifier la prévention, non à prédire un pronostic individuel.</p>
<div class="key"><b>À retenir.</b> Les jeunes enfants ont l’incidence la plus forte, mais les personnes âgées concentrent les hospitalisations et les décès. Une circulation active, lue dans le bulletin de l’OFSP, augmente fortement la probabilité qu’un syndrome grippal soit une grippe.</div>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière, 2026</a> ; <a href="https://www.who.int/fr/news-room/fact-sheets/detail/influenza-(seasonal)" target="_blank" rel="noopener">OMS, aide-mémoire Grippe saisonnière</a>.</p></section></section>

<section class="ilot" id="j09-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Les symptômes ont deux origines : la destruction de l’épithélium respiratoire par le virus et la réponse immunitaire de l’hôte, qui produit la fièvre et les courbatures.</p>
<h3>L’épithélium respiratoire normal</h3>
<p>La trachée et les bronches portent un épithélium cilié qui transporte le mucus et les particules captées vers le pharynx. Les mucines portent de l’acide sialique, le sucre auquel le virus s’attache. Dans les alvéoles, les pneumocytes de type I assurent les échanges gazeux et ceux de type II produisent le surfactant.</p>
<h3>Le cycle du virus dans la cellule</h3>
<p>La figure 1 relie les six étapes du cycle viral aux cibles thérapeutiques et aux symptômes.</p>
<figure><svg viewBox="0 0 680 330" role="img" aria-label="Cycle du virus influenza dans une cellule de l'épithélium respiratoire en six étapes, de l'attachement à la libération, puis quatre conséquences cliniques : toux, fièvre et courbatures, hypoxémie et surinfection bactérienne" font-family="sans-serif" font-size="11"><g fill="none" stroke="#222" stroke-width="1.5"><rect x="8" y="30" width="102" height="92" rx="4"/><rect x="120" y="30" width="102" height="92" rx="4"/><rect x="232" y="30" width="102" height="92" rx="4"/><rect x="344" y="30" width="102" height="92" rx="4"/><rect x="456" y="30" width="102" height="92" rx="4"/><rect x="568" y="30" width="104" height="92" rx="4"/><path d="M110 76h8M222 76h8M334 76h8M446 76h8M558 76h8"/><path d="M114 72l4 4-4 4M226 72l4 4-4 4M338 72l4 4-4 4M450 72l4 4-4 4M562 72l4 4-4 4"/><path d="M340 140v40" stroke-dasharray="4 3"/><path d="M336 176l4 6 4-6"/><rect x="8" y="200" width="157" height="98" rx="4"/><rect x="177" y="200" width="157" height="98" rx="4"/><rect x="346" y="200" width="157" height="98" rx="4"/><rect x="515" y="200" width="157" height="98" rx="4"/></g><g fill="#222"><text x="8" y="18" font-weight="bold">A. Cycle viral dans une cellule ciliée</text><text x="16" y="48" font-weight="bold">1. Attachement</text><text x="16" y="64">hémagglutinine</text><text x="16" y="78">sur acide sialique</text><text x="16" y="92">de la cellule</text><text x="128" y="48" font-weight="bold">2. Endocytose</text><text x="128" y="64">acidification ;</text><text x="128" y="78">canal ionique de la</text><text x="128" y="92">protéine de matrice 2</text><text x="240" y="48" font-weight="bold">3. Fusion</text><text x="240" y="64">les 8 segments</text><text x="240" y="78">d’acide ribonucléique</text><text x="240" y="92">gagnent le noyau</text><text x="352" y="48" font-weight="bold">4. Noyau</text><text x="352" y="64">polymérase virale :</text><text x="352" y="78">vol de coiffe,</text><text x="352" y="92">copies sans relecture</text><text x="352" y="106">(dérive)</text><text x="464" y="48" font-weight="bold">5. Assemblage</text><text x="464" y="64">protéines et</text><text x="464" y="78">segments réunis</text><text x="464" y="92">sous la membrane</text><text x="576" y="48" font-weight="bold">6. Libération</text><text x="576" y="64">la neuraminidase</text><text x="576" y="78">coupe l’acide</text><text x="576" y="92">sialique et libère</text><text x="576" y="106">les virions</text><text x="350" y="165">mort cellulaire et réponse de l’hôte</text><text x="8" y="192" font-weight="bold">B. Conséquences cliniques</text><text x="16" y="220" font-weight="bold">Épithélium détruit</text><text x="16" y="236">perte des cils ;</text><text x="16" y="250">toux sèche, douleur</text><text x="16" y="264">trachéale, toux</text><text x="16" y="278">prolongée</text><text x="185" y="220" font-weight="bold">Cytokines</text><text x="185" y="236">interférons, IL-6, TNF ;</text><text x="185" y="250">fièvre, frissons,</text><text x="185" y="264">courbatures,</text><text x="185" y="278">fatigue</text><text x="354" y="220" font-weight="bold">Atteinte alvéolaire</text><text x="354" y="236">œdème, membranes</text><text x="354" y="250">hyalines ; hypoxémie,</text><text x="354" y="264">pneumonie virale,</text><text x="354" y="278">SDRA</text><text x="523" y="220" font-weight="bold">Défenses affaiblies</text><text x="523" y="236">récepteurs exposés,</text><text x="523" y="250">macrophages altérés ;</text><text x="523" y="264">surinfection à</text><text x="523" y="278">pneumocoque, staphylocoque</text></g></svg><figcaption>Figure 1 — Cycle du virus influenza dans une cellule ciliée (A) et conséquences cliniques de la lésion et de la réponse de l’hôte (B). Les étapes 4 et 6 sont les cibles des antiviraux actuels. Schéma pédagogique original, noir et blanc, non à l’échelle.</figcaption></figure>
<p>L’<button class="w" data-justification="1" data-k="j09-ha">hémagglutinine se fixe à l’acide sialique (pourquoi le virus aviaire se transmet mal)</button>. Après l’endocytose, l’acidification de la vésicule et le canal à protons de la protéine de matrice 2 libèrent les segments viraux. Dans le noyau, <button class="w" data-justification="1" data-k="j09-cycle">la polymérase virale vole la coiffe des ARN messagers cellulaires (cible du baloxavir)</button> ; en fin de cycle, la <button class="w" data-justification="1" data-k="j09-na">neuraminidase libère les virions (cible de l’oseltamivir)</button>. La réplication culmine un à deux jours après l’infection, et l’excrétion dure en moyenne cinq jours chez l’adulte sain.</p>
<h3>La réponse de l’hôte : protectrice, puis responsable des symptômes</h3>
<p>Les cellules infectées sécrètent des <button class="w" data-justification="1" data-k="j09-ifn">interférons, que freine une protéine virale</button>. Chez des volontaires infectés, l’IL-6 et l’interféron alpha culminent au deuxième jour avec la charge virale et la fièvre ; le TNF s’élève plus tard. <button class="w" data-justification="1" data-k="j09-cytokines">Ces cytokines produisent la fièvre, les frissons et les courbatures</button> : les signes généraux dominent donc dès le premier jour, alors que la lésion respiratoire reste limitée. La guérison repose sur l’<button class="w" data-justification="1" data-k="j09-adaptatif">immunité adaptative</button>, qui demande une à deux semaines lors d’une première rencontre avec un sous-type.</p>
<h3>Des lésions bronchiques aux lésions alvéolaires</h3>
<p>Dans la forme simple, le virus détruit l’épithélium trachéobronchique et la clairance mucociliaire s’effondre. <b>La réparation complète demande plusieurs semaines : elle explique la toux et la fatigue qui durent souvent plus de deux semaines, sans infection persistante.</b></p>
<p>L’atteinte des alvéoles produit une <button class="w" data-justification="1" data-k="j09-dad">pneumonie virale primaire par dommage alvéolaire diffus</button> : la saturation baisse malgré l’oxygène, et un SDRA peut s’installer en quelques jours. La lésion virale prépare aussi la <button class="w" data-justification="1" data-k="j09-surinfection">surinfection bactérienne</button> à <i>Streptococcus pneumoniae</i>, <i>Staphylococcus aureus</i> ou <i>Streptococcus pyogenes</i> ; en 1918, la majorité des décès a été attribuée à cette pneumonie secondaire.</p>
<p>L’inflammation systémique agit enfin sur le cœur. La fièvre et la tachycardie augmentent la demande myocardique en oxygène, et l’inflammation favorise la rupture de plaque et la thrombose. Dans une étude ontarienne, le risque d’hospitalisation pour infarctus du myocarde était multiplié par 6 dans les sept jours suivant une grippe confirmée : la grippe de la patiente de 72 ans peut se révéler par une décompensation cardiaque.</p>
<div class="key"><b>À retenir.</b> Les cytokines produisent la fièvre et les courbatures ; l’atteinte alvéolaire donne une pneumonie virale hypoxémiante ; l’épithélium lésé favorise la surinfection à pneumocoque ou à staphylocoque doré ; l’inflammation systémique déstabilise le cœur. Le baloxavir et l’oseltamivir agissent à deux étapes distinctes du cycle.</div>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., causes de décès en 1918, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus après grippe, 2018</a>.</p></section></section>

<section class="ilot" id="j09-4"><h2><span class="n">4</span>Transmission, contagiosité et facteurs de risque</h2>
<p>La grippe se transmet par les particules émises lors de la toux, de l’éternuement ou de la parole, et accessoirement par les mains et les surfaces. Ces <button class="w" data-justification="1" data-k="j09-voies">voies de transmission</button> expliquent la diffusion rapide dans les familles, les écoles et les établissements de soins.</p>
<h3>Incubation et période contagieuse</h3>
<p>L’incubation dure en moyenne deux jours, de un à quatre jours. <button class="w" data-justification="1" data-k="j09-incubation">La contagiosité commence la veille des symptômes et dure cinq à sept jours</button> ; elle culmine les trois premiers jours et se prolonge, parfois plusieurs semaines, chez le jeune enfant et l’immunodéprimé.</p>
<p>Dans les études d’inoculation, seules 66,9 % des infections provoquaient des symptômes. <button class="w" data-justification="1" data-k="j09-asympto">Les formes peu symptomatiques excrètent moins de virus, mais en excrètent</button> : isoler les seuls malades fébriles ne protège donc pas un service hospitalier, et la vaccination du personnel comme le masque restent nécessaires.</p>
<h3>Facteurs de risque de complication</h3>
<p>Le risque de complication dépend d’abord du terrain : en 2023/2024, les patients Sentinella atteints d’une maladie chronique avaient un risque de pneumonie 3,3 fois plus élevé. Les <button class="w" data-justification="1" data-k="j09-risque">personnes à risque accru selon l’OFSP</button> sont aussi les cibles prioritaires de la vaccination. Le tableau relie chaque facteur à son mécanisme d’aggravation.</p>
<table class="t"><tr><th>Facteur de risque (OFSP)</th><th>Mécanisme principal de l’aggravation</th></tr>
<tr><td>65 ans et plus</td><td>Immunité moins efficace, comorbidités, réserve cardiorespiratoire réduite</td></tr>
<tr><td>Grossesse et 4 semaines après l’accouchement</td><td>Réserve pulmonaire diminuée, débit cardiaque accru, adaptation immunitaire</td></tr>
<tr><td>Maladie cardiaque</td><td>Demande en oxygène accrue ; infarctus favorisé</td></tr>
<tr><td>Maladie pulmonaire, asthme compris</td><td>Bronchospasme viral, faible réserve ventilatoire</td></tr>
<tr><td>Diabète, obésité morbide (IMC ≥ 40)</td><td>Polynucléaires altérés par l’hyperglycémie ; volumes pulmonaires réduits</td></tr>
<tr><td>Maladie neurologique ou musculosquelettique</td><td>Toux inefficace, inhalation, faiblesse respiratoire</td></tr>
<tr><td>Maladie hépatique, insuffisance rénale</td><td>Défenses diminuées, déséquilibres hydriques et métaboliques</td></tr>
<tr><td>Asplénie, hémoglobinopathie</td><td>Clairance réduite du pneumocoque et des autres bactéries encapsulées</td></tr>
<tr><td>Immunodéficience (infection VIH, cancer, immunosuppresseur)</td><td>Réplication prolongée, pneumonie virale, résistances</td></tr>
<tr><td>Résidence en établissement de soins</td><td>Fragilité, transmission rapide entre résidents</td></tr></table>
<p>Une seule ligne suffit à classer le patient « à risque » ; la patiente de 72 ans en cumule deux. L’erreur fréquente est de rassurer un adulte jeune obèse ou une femme enceinte en apparente bonne santé : ces deux groupes étaient surreprésentés parmi les formes graves de 2009. <button class="w" data-justification="1" data-k="j09-grossesse-risque">La grossesse aggrave la grippe par trois mécanismes</button>.</p>
<p>La liste de l’OFSP sert à la vaccination ; pour l’antiviral, <button class="w" data-justification="1" data-k="j09-oms-risque">l’OMS a défini en 2024 le « haut risque » de forme grave</button>. Ces définitions se recouvrent largement, et le jugement clinique tranche les cas limites.</p>
<div class="key"><b>À retenir.</b> La contagiosité débute la veille des symptômes et culmine les trois premiers jours. Le risque de complication tient au terrain : âge de 65 ans et plus, grossesse, maladie chronique, immunodéficience ou vie en établissement de soins.</div>
<p class="src">Références : <a href="https://www.cdc.gov/flu/spread/index.html" target="_blank" rel="noopener">CDC, How flu spreads, mise à jour du 17.09.2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel 2023/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28011603/" target="_blank" rel="noopener">Ip et al., 2017</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a>.</p></section></section>

<section class="ilot" id="j09-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse établit si le récit évoque une grippe, depuis quand, et sur quel terrain. La date du début, souvent négligée, conditionne le bénéfice de l’antiviral en ambulatoire. <button class="w" data-flag="reflexe" data-k="j09-reflexe-dater">Instant réflexe</button></p>
<h3>Le récit typique</h3>
<p>Le <button class="w" data-justification="1" data-k="j09-debut">début brutal</button> est le trait le plus évocateur : le patient peut souvent en donner l’heure. Il décrit une <button class="w" data-justification="1" data-k="j09-fievre">fièvre de 38 à 40 °C avec frissons</button>, des <button class="w" data-justification="1" data-k="j09-myalgies">courbatures diffuses et une grande fatigue</button> et des <button class="w" data-justification="1" data-k="j09-cephalees">céphalées frontales ou rétro-orbitaires</button>. Une <button class="w" data-justification="1" data-k="j09-toux">toux sèche, une brûlure rétrosternale et un mal de gorge</button> accompagnent ou suivent de peu ces signes généraux ; la rhinorrhée reste moins au premier plan que dans un rhume.</p>
<p>Chez 3744 adultes et adolescents présentant un syndrome grippal en période épidémique, une fièvre et une toux apparues depuis moins de 48 heures avaient une valeur prédictive positive de 79 % pour une grippe confirmée. Hors épidémie, le même tableau relève bien plus souvent d’un autre virus.</p>
<h3>Formes typiques et formes atypiques</h3>
<p>Les deux cartes opposent la forme de l’adulte aux formes où le diagnostic est le plus souvent manqué.</p>
<div class="two"><div class="card"><h4>Forme typique de l’adulte</h4><p>Le patient doit souvent s’aliter. La fièvre dure trois à cinq jours, et les symptômes principaux trois à sept jours. La toux et la fatigue peuvent persister plus de deux semaines.</p></div><div class="card"><h4>Formes atypiques</h4><p>Chez la <button class="w" data-justification="1" data-k="j09-atypique-age">personne âgée fragile</button>, la fièvre peut manquer, et la grippe se révèle par une confusion, une chute ou un refus alimentaire. Chez l’immunodéprimé, la fièvre reste modeste malgré une réplication prolongée. Chez le jeune enfant, des nausées, des vomissements ou une diarrhée s’ajoutent. Le malade chronique peut se présenter par une <button class="w" data-justification="1" data-k="j09-decompensation">décompensation de sa maladie</button>. <button class="w" data-flag="penser" data-k="j09-penser-age">Il faut y penser</button></p></div></div>
<p>L’erreur fréquente est d’attribuer la confusion d’un résident à sa démence ou à une infection urinaire, alors que plusieurs résidents toussent depuis deux jours.</p>
<h3>Les questions qui changent la décision</h3>
<p>Le médecin fait préciser <button class="w" data-justification="1" data-k="j09-delai">le jour et l’heure du début des symptômes</button>, les <button class="w" data-justification="1" data-k="j09-contage">contacts malades et l’activité grippale régionale</button>, les facteurs de risque, dont la grossesse et un traitement immunosuppresseur, et le <button class="w" data-justification="1" data-k="j09-vaccin-statut">statut vaccinal de la saison</button>. Une <button class="w" data-justification="1" data-k="j09-expo-animale">exposition à des volailles, à des oiseaux sauvages ou à d’autres animaux infectés</button> impose une protection respiratoire, un test spécifique et une déclaration. Chez l’enfant et l’adolescent, il vérifie que personne ne donne d’<button class="w" data-justification="1" data-k="j09-aspirine">acide acétylsalicylique (syndrome de Reye)</button>.</p>
<p>Il recherche enfin une dyspnée, une douleur thoracique, une confusion, une baisse de la diurèse ou une incapacité à boire. Une <button class="w" data-justification="1" data-k="j09-biphasique">aggravation après une amélioration initiale</button> est le signal le plus important.</p>
<div class="key"><b>À retenir.</b> Le médecin date le début, établit le terrain, vérifie la vaccination et recherche une exposition animale. En période épidémique, une confusion, une chute ou une décompensation chronique chez le sujet âgé doivent faire évoquer la grippe, même sans fièvre.</div>
<p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., 2008</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., IDSA, 2019</a>.</p></section></section>

<section class="ilot" id="j09-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Dans la grippe simple, le patient est fébrile, fatigué, parfois tachycarde, et l’auscultation est normale. L’examen sert donc surtout à rechercher une complication, en commençant par les paramètres vitaux.</p>
<h3>Paramètres vitaux</h3>
<p>Les seuils d’alarme sont ceux de la Société suisse d’infectiologie pour l’infection respiratoire aiguë.</p>
<table class="t"><tr><th>Paramètre</th><th>Repère normal (adulte)</th><th>Seuil d’alarme</th></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-fr">Fréquence respiratoire</button></td><td>12 à 20 par minute</td><td>30 par minute ou plus</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-spo">Saturation pulsée en oxygène</button></td><td>95 % ou plus en air ambiant</td><td>Moins de 92 % ; moins de 90 % : hospitalisation à envisager</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-pa">Pression artérielle et perfusion</button></td><td>Valeur habituelle du patient</td><td>Systolique inférieure à 90 mmHg</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-fc">Fréquence cardiaque</button></td><td>60 à 100 par minute</td><td>Tachycardie disproportionnée à la fièvre</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-conscience">État de conscience</button></td><td>Orienté, attentif</td><td>Confusion nouvelle</td></tr></table>
<p>Un seul seuil franchi fait envisager une évaluation hospitalière. L’erreur fréquente est de ne pas compter la fréquence respiratoire, qui s’élève souvent avant la chute de la saturation. Chez la patiente de 72 ans, 28 cycles par minute et une saturation de 91 % imposent cette évaluation malgré une pression normale.</p>
<h3>Examen ciblé</h3>
<div class="two"><div class="card"><h4>Ce qui est compatible avec une grippe simple</h4><p>Le pharynx est rouge, sans dépôt ; les conjonctives peuvent être injectées, et de petits ganglions cervicaux sensibles sont possibles. L’<button class="w" data-justification="1" data-k="j09-ausc">auscultation pulmonaire</button> est le plus souvent normale. Le patient boit et se lève.</p></div><div class="card"><h4>Ce qui oriente vers une complication</h4><p>Des crépitants localisés ou une matité orientent vers une pneumonie ; des sibilants diffus, vers un bronchospasme. Une <button class="w" data-justification="1" data-k="j09-deshydratation">déshydratation</button> traduit des pertes non compensées. Des signes d’insuffisance cardiaque, une raideur de nuque, un déficit neurologique ou des muscles très douloureux à la pression font rechercher une atteinte d’organe.</p></div></div>
<p>Un signe de la seconde carte ne remet pas en cause la grippe : il impose de rechercher la complication correspondante. Les <button class="w" data-justification="1" data-k="j09-alarme">signes de gravité</button> rassemblent ces éléments.</p>
<div class="quiz ui"><p>Un homme de 45 ans, sans antécédent, consulte au troisième jour d’une grippe typique. Il allait mieux la veille, mais la fièvre est réapparue à 39,5 °C avec une toux productive et une douleur thoracique droite. La fréquence respiratoire est de 26 par minute et la saturation de 93 %. Quelle hypothèse faut-il retenir en premier ?</p><button data-ok="0">Une évolution naturelle de la grippe, qui ne justifie qu’un traitement symptomatique</button><button data-ok="1">Une pneumonie bactérienne de surinfection, qui impose une évaluation rapide et une imagerie</button><button data-ok="0">Une toux postvirale, qui peut durer plusieurs semaines</button><p class="fb" hidden>La réapparition de la fièvre après une amélioration, avec une toux productive, une douleur thoracique et une tachypnée, signe une évolution en deux temps. L’épithélium détruit par le virus favorise l’adhérence du pneumocoque et du staphylocoque doré. Le médecin recherche un foyer à l’examen et à l’imagerie, et discute une antibiothérapie. La toux postvirale persiste sans fièvre ni dyspnée ; elle ne s’accompagne pas d’une aggravation.</p></div>
<div class="key"><b>À retenir.</b> Une fréquence respiratoire de 30 par minute ou plus, une saturation inférieure à 92 %, une systolique inférieure à 90 mmHg ou une confusion nouvelle sont des signaux d’alarme. Un foyer pulmonaire, une déshydratation ou des signes cardiaques ou neurologiques orientent vers une atteinte d’organe.</div>
<p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire, signaux d’alarme</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, 2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., IDSA, 2019</a>.</p>
