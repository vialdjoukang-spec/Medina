<section class="ilot" id="j09-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>En janvier, une femme de 72 ans, insuffisante cardiaque, consulte au deuxième jour d’une fièvre à 39,2 °C. Les frissons, les courbatures et une toux sèche ont débuté en quelques heures, la veille au soir. Trois de ses proches ont les mêmes symptômes. <b>La question n’est pas seulement « est-ce une grippe ? », mais « cette grippe va-t-elle se compliquer, et que faire aujourd’hui ? »</b></p>
<p>Chez la plupart des adultes, la grippe guérit seule en une à deux semaines. Chez une minorité, elle se complique d’une pneumonie virale, d’une surinfection bactérienne ou de la décompensation d’une maladie chronique ; ces complications causent chaque hiver plusieurs milliers d’hospitalisations en Suisse. Le médecin doit reconnaître la grippe, estimer le risque du patient et décider vite, car l’antiviral agit d’autant mieux qu’il est précoce. <button class="w" data-justification="1" data-k="j09-q-decision">Quatre décisions s’enchaînent : test, antiviral, lieu de soins, protection de l’entourage (ordre et raison)</button>.</p>
<div class="key"><b>À retenir.</b> Trois questions guident la consultation : le tableau évoque-t-il une grippe, le patient est-il à risque de complication, existe-t-il déjà un signe de gravité ? Leurs réponses décident du test, du traitement et du lieu de soins. Les propriétés du virus expliquent chacune de ces décisions.</div>
<p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière (influenza), page consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., recommandations de l’IDSA, 2019</a>.</p></section></section>

<section class="ilot" id="j09-1"><h2><span class="n">1</span>Définition, virus et codage</h2>
<p>La <b>grippe</b> (influenza) est une infection respiratoire aiguë due à un virus de la famille des <i>Orthomyxoviridae</i>. Ce virus enveloppé porte un génome d’acide ribonucléique simple brin, divisé en huit segments chez les types A et B. Un « état grippal » dû à un rhinovirus, au SARS-CoV-2 ou au VRS n’est pas une grippe.</p>
<h3>Types, sous-types et lignées</h3>
<p><button class="w" data-justification="1" data-k="j09-types">Seuls les types A et B causent les épidémies humaines (hôtes et gravité des quatre types)</button>. Le type A a pour réservoir les oiseaux aquatiques sauvages et infecte de nombreuses espèces ; le type B est presque strictement humain. Le type C cause des infections bénignes, et le type D touche surtout les bovins.</p>
<p>Le type A se classe en <button class="w" data-justification="1" data-k="j09-hn">sous-types selon l’hémagglutinine (H) et la neuraminidase (N)</button>. Au moins 18 hémagglutinines et 11 neuraminidases sont connues ; leur combinaison donne par exemple H1N1 ou H3N2. Le type B se divise en deux lignées, Victoria et Yamagata ; la surveillance suisse ne détecte plus la lignée Yamagata depuis la pandémie de COVID-19.</p>
<p>Trois virus saisonniers circulent en Suisse : A(H1N1)pdm09, A(H3N2) et B/Victoria. En 2023/2024, ils représentaient respectivement 72,1 %, 18,4 % et 8,5 % des virus identifiés par le réseau Sentinella. Leur proportion change chaque saison et module la gravité de la saison comme l’efficacité du vaccin. <button class="w" data-justification="1" data-k="j09-nomenclature">Le nom complet d’une souche obéit à une règle internationale (lecture d’un exemple)</button>.</p>
<h3>Dérive et cassure antigéniques</h3>
<p>La <button class="w" data-justification="1" data-k="j09-derive">dérive antigénique (mutations ponctuelles sans relecture)</button> modifie progressivement l’hémagglutinine et la neuraminidase des types A et B. Le virus échappe ainsi en partie à l’immunité des saisons précédentes : la dérive explique les réinfections au cours de la vie et la révision annuelle du vaccin.</p>
<p>La <button class="w" data-justification="1" data-k="j09-cassure">cassure antigénique (réassortiment de segments)</button> dote brusquement un virus A d’une hémagglutinine contre laquelle la population n’a presque aucune immunité. Si ce virus se transmet efficacement entre humains, il provoque une <b>pandémie</b>. Les quatre dernières pandémies sont dues aux virus H1N1 en 1918, H2N2 en 1957, H3N2 en 1968 et A(H1N1)pdm09 en 2009.</p>
<p>Un <b>virus zoonotique</b> est un virus animal qui infecte occasionnellement l’être humain ; A(H5N1) en est l’exemple principal. De 2003 au 31 mars 2026, l’OMS a recensé 997 infections humaines confirmées par ce virus, dont 478 décès. Ce rapport surestime la létalité, car les formes graves sont plus souvent testées. La plupart des cas ont suivi un contact rapproché avec des volailles, et aucune transmission interhumaine soutenue n’est documentée.</p>
<h3>Codage CIM-10-GM</h3>
<p>La CIM-10-GM 2024 répartit la grippe en trois catégories selon le virus identifié. Ce choix conditionne la surveillance épidémiologique et la déclaration.</p>
<table class="t"><tr><th>Code et intitulé</th><th>Situation</th><th>Exemple</th></tr>
<tr><td><b>J09 — Grippe à virus d’influenza zoonotique ou pandémique identifié</b></td><td>Virus transmis par l’animal ou responsable d’une pandémie</td><td>A(H5N1) après contact avec des volailles</td></tr>
<tr><td><b>J10 — Grippe, à virus d’influenza saisonnière identifié</b></td><td>Virus saisonnier A, B ou C confirmé par un test</td><td>Test positif pour A(H3N2) en janvier</td></tr>
<tr><td><b>J11 — Grippe, virus non identifié</b></td><td>Diagnostic clinique sans test, ou test sans identification</td><td>Syndrome grippal typique en pleine épidémie, non testé</td></tr></table>
<p>Le médecin cherche d’abord si un virus a été identifié, puis s’il est saisonnier. Non testée, la patiente de 72 ans relève de J11 ; un test positif pour A(H1N1)pdm09 la classe en J10. Le quatrième caractère précise la manifestation : <b>J10.0</b> et <b>J11.0</b> désignent une pneumonie, <b>J10.1</b> et <b>J11.1</b> une autre atteinte respiratoire, <b>J10.8</b> et <b>J11.8</b> une autre manifestation, comme une myocardite ou une encéphalopathie. <button class="w" data-justification="1" data-k="j09-codage">Trois pièges de codage (bactérie au nom trompeur, rhume, virus pandémique devenu saisonnier)</button> reviennent souvent.</p>
<div class="key"><b>À retenir.</b> Les virus influenza A et B causent la grippe humaine. La dérive explique les épidémies annuelles et la révision du vaccin ; la cassure peut créer un virus pandémique. J09 désigne un virus zoonotique ou pandémique, J10 un virus saisonnier confirmé, J11 une grippe sans identification du virus.</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j09-j18.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc J09 à J18, version allemande officielle</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Influenza, 2018</a> ; <a href="https://cdn.who.int/media/docs/default-source/influenza/h5n1-human-case-cumulative-table/2026_table_h5n1_march.pdf" target="_blank" rel="noopener">OMS, cas humains cumulés de grippe A(H5N1), état au 31.03.2026</a>.</p></section></section>

<section class="ilot" id="j09-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>En Suisse, la grippe circule par vagues hivernales, et la surveillance couvre les semaines 40 à 20. Le pic tombe le plus souvent entre fin décembre et février : en 2023/2024, il a atteint 148 consultations pour syndrome grippal pour 100 000 habitants, la cinquième semaine de 2024. Comme sa date varie, le calendrier ne remplace pas le bulletin hebdomadaire de l’OFSP.</p>
<h3>Comment la Suisse mesure la grippe</h3>
<p>Le <button class="w" data-justification="1" data-k="j09-sentinella">réseau Sentinella (définition du syndrome grippal et extrapolation)</button> réunit environ 170 cabinets de premier recours. Ils déclarent leurs consultations et envoient une partie de leurs frottis au Centre national de référence de l’influenza, à Genève. Les déclarations des laboratoires, un réseau hospitalier actif jusqu’en août 2024 et, depuis 2022, la recherche du virus dans les eaux usées complètent ces données.</p>
<p>En 2023/2024, l’OFSP estime à environ 230 000 les consultations pour syndrome grippal, soit 2595 pour 100 000 habitants ; la moyenne des saisons 2013/2014 à 2018/2019 était de 2844. <button class="w" data-justification="1" data-k="j09-seuil">La proportion de frottis positifs repère désormais l’épidémie (abandon de l’ancien seuil)</button> : elle a dépassé 10 % de la semaine 49 à la semaine 11.</p>
<h3>Qui tombe malade, qui est hospitalisé</h3>
<p><button class="w" data-justification="1" data-k="j09-age">Les enfants s’infectent le plus, les personnes âgées sont le plus hospitalisées (données et explication)</button>. En 2023/2024, les infections confirmées atteignaient 459 pour 100 000 habitants chez les 0 à 4 ans et 441 pour 100 000 chez les 65 ans et plus. L’âge médian des patients hospitalisés était de 71 ans.</p>
<p>Les six hôpitaux de surveillance ont recensé 1653 hospitalisations pour grippe en 2023/2024 : 12,0 % des patients ont séjourné aux soins intensifs et 4,2 % sont décédés. L’infection avait été contractée à l’hôpital dans 17,2 % des cas, ce qui justifie la vaccination des soignants. <button class="w" data-justification="1" data-k="j09-fardeau">À l’échelle du pays, l’OFSP estime plusieurs milliers d’hospitalisations et plusieurs centaines de décès par an (portée et limites)</button>.</p>
<p>L’OMS estime chaque année dans le monde un milliard d’infections, 3 à 5 millions de formes graves et 290 000 à 650 000 décès d’origine respiratoire. Ces chiffres modélisés servent à planifier la prévention, non à prédire le pronostic d’un patient.</p>
<div class="key"><b>À retenir.</b> L’épidémie suisse culmine le plus souvent entre fin décembre et février. Les jeunes enfants ont l’incidence la plus forte, mais les personnes âgées concentrent les hospitalisations et les décès. Une circulation active, lue dans le bulletin de l’OFSP, augmente fortement la probabilité qu’un syndrome grippal soit une grippe.</div>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, Grippe saisonnière, 2026</a> ; <a href="https://www.who.int/fr/news-room/fact-sheets/detail/influenza-(seasonal)" target="_blank" rel="noopener">OMS, aide-mémoire Grippe saisonnière</a>.</p></section></section>

<section class="ilot" id="j09-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Les symptômes ont deux origines : la destruction de l’épithélium respiratoire par le virus et la réponse immunitaire de l’hôte, qui produit la fièvre et les courbatures. Cette double origine explique le début brutal, la fatigue prolongée et les complications.</p>
<h3>L’épithélium respiratoire normal</h3>
<p>La trachée et les bronches portent un épithélium cilié couvert de mucus. Le battement des cils transporte ce mucus et les particules captées vers le pharynx. Les mucines portent de l’acide sialique, le sucre auquel le virus s’attache. Dans les alvéoles, les pneumocytes de type I assurent les échanges gazeux et ceux de type II produisent le surfactant.</p>
<h3>Le cycle du virus dans la cellule</h3>
<p>La figure 1 relie les six étapes du cycle viral aux cibles thérapeutiques et aux symptômes.</p>

52" y="106">(dérive)</text><text x="464" y="48" font-weight="bold">5. Assemblage</text><text x="464" y="64">protéines et</text><text x="464" y="78">segments réunis</text><text x="464" y="92">sous la membrane</text><text x="576" y="48" font-weight="bold">6. Libération</text><text x="576" y="64">la neuraminidase</text><text x="576" y="78">coupe l’acide</text><text x="576" y="92">sialique et libère</text><text x="576" y="106">les virions</text><text x="350" y="165">mort cellulaire et réponse de l’hôte</text><text x="8" y="192" font-weight="bold">B. Conséquences cliniques</text><text x="16" y="220" font-weight="bold">Épithélium détruit</text><text x="16" y="236">perte des cils ;</text><text x="16" y="250">toux sèche, douleur</text><text x="16" y="264">trachéale, toux</text><text x="16" y="278">prolongée</text><text x="185" y="220" font-weight="bold">Cytokines</text><text x="185" y="236">interférons, IL-6, TNF ;</text><text x="185" y="250">fièvre, frissons,</text><text x="185" y="264">courbatures,</text><text x="185" y="278">fatigue</text><text x="354" y="220" font-weight="bold">Atteinte alvéolaire</text><text x="354" y="236">œdème, membranes</text><text x="354" y="250">hyalines ; hypoxémie,</text><text x="354" y="264">pneumonie virale,</text><text x="354" y="278">SDRA</text><text x="523" y="220" font-weight="bold">Défenses affaiblies</text><text x="523" y="236">récepteurs exposés,</text><text x="523" y="250">macrophages altérés ;</text><text x="523" y="264">surinfection à</text><text x="523" y="278">pneumocoque, staphylocoque</text></g></svg><figcaption>Figure 1 — Cycle du virus influenza dans une cellule ciliée (A) et conséquences cliniques de la lésion et de la réponse de l’hôte (B). Les étapes 4 et 6 sont les cibles des antiviraux actuels. Schéma pédagogique original, noir et blanc, non à l’échelle.</figcaption></figure>
<p>La figure se lit de gauche à droite sur la ligne A, puis vers la ligne B. L’<button class="w" data-justification="1" data-k="j09-ha">hémagglutinine se fixe à l’acide sialique (pourquoi le virus aviaire se transmet mal à l’être humain)</button>. Après l’endocytose, l’acidification de la vésicule et le canal à protons de la protéine de matrice 2 libèrent les segments viraux. Dans le noyau, <button class="w" data-justification="1" data-k="j09-cycle">la polymérase virale vole la coiffe des ARN messagers cellulaires (cible du baloxavir)</button>. En fin de cycle, la <button class="w" data-justification="1" data-k="j09-na">neuraminidase libère les nouveaux virions (cible de l’oseltamivir)</button>. La réplication culmine un à deux jours après l’infection, et l’excrétion dure en moyenne cinq jours chez l’adulte sain.</p>
<h3>La réponse de l’hôte : protectrice, puis responsable des symptômes</h3>
<p>Les cellules infectées détectent l’acide ribonucléique viral et sécrètent des interférons, qui mettent les cellules voisines en état antiviral. Une protéine non structurale du virus freine cette réponse. <button class="w" data-justification="1" data-k="j09-ifn">Cet équilibre fixe la vitesse de réplication (mécanisme et conséquence)</button>.</p>
<p>Chez des volontaires infectés, l’IL-6 et l’interféron alpha culminent au deuxième jour, avec la charge virale, la fièvre et les symptômes ; le TNF s’élève plus tard. <button class="w" data-justification="1" data-k="j09-cytokines">Ces cytokines produisent la fièvre, les frissons et les courbatures (de la cytokine au symptôme)</button> : les signes généraux dominent donc dès le premier jour, alors que la lésion respiratoire reste limitée. La guérison repose sur l’<button class="w" data-justification="1" data-k="j09-adaptatif">immunité adaptative (anticorps contre l’hémagglutinine et lymphocytes T CD8)</button>, qui demande une à deux semaines lors d’une première rencontre avec un sous-type.</p>
<h3>Des lésions bronchiques aux lésions alvéolaires</h3>
<p>Dans la forme simple, le virus détruit l’épithélium de la trachée et des bronches. Les cellules ciliées se détachent et la clairance mucociliaire s’effondre ; la réparation complète demande plusieurs semaines. <b>Cette réparation lente explique la toux et la fatigue qui durent souvent plus de deux semaines, sans infection persistante.</b></p>
<p>L’atteinte des alvéoles produit une <button class="w" data-justification="1" data-k="j09-dad">pneumonie virale primaire par dommage alvéolaire diffus (de la lésion à l’hypoxémie)</button>. L’œdème et la fibrine y forment des membranes hyalines. Le sang qui traverse ces alvéoles n’est plus oxygéné : la saturation baisse malgré l’oxygène, et un SDRA peut s’installer en quelques jours.</p>
<p>La lésion virale prépare aussi la <button class="w" data-justification="1" data-k="j09-surinfection">surinfection bactérienne (synergie entre virus et bactérie)</button> à <i>Streptococcus pneumoniae</i>, <i>Staphylococcus aureus</i> ou <i>Streptococcus pyogenes</i>. Au cours de la pandémie de 1918, la majorité des décès a été attribuée à une pneumonie bactérienne secondaire.</p>
<p>L’inflammation systémique agit enfin sur le cœur. La fièvre et la tachycardie augmentent la demande myocardique en oxygène, et l’inflammation favorise la rupture de plaque et la thrombose. Dans une étude ontarienne, le risque d’hospitalisation pour infarctus du myocarde était multiplié par 6 dans les sept jours suivant une grippe confirmée. La grippe de la patiente de 72 ans peut donc se révéler par une décompensation cardiaque.</p>
<div class="key"><b>À retenir.</b> Le virus détruit l’épithélium bronchique, et les cytokines produisent la fièvre et les courbatures. L’atteinte alvéolaire donne une pneumonie virale hypoxémiante ; l’épithélium lésé favorise la surinfection à pneumocoque ou à staphylocoque doré ; l’inflammation systémique déstabilise le cœur. Le baloxavir et l’oseltamivir agissent à deux étapes distinctes du cycle viral.</div>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29955068/" target="_blank" rel="noopener">Krammer et al., Nature Reviews Disease Primers, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18039138/" target="_blank" rel="noopener">Taubenberger et Morens, pathologie de la grippe, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., études d’inoculation, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9449698/" target="_blank" rel="noopener">Hayden et al., cytokines et symptômes, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24590244/" target="_blank" rel="noopener">McCullers, surinfection bactérienne, 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., causes de décès en 1918, 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., infarctus après grippe, 2018</a>.</p></section></section>

<section class="ilot" id="j09-4"><h2><span class="n">4</span>Transmission, contagiosité et facteurs de risque</h2>
<p>La grippe se transmet par les particules respiratoires émises lors de la toux, de l’éternuement ou de la parole ; les mains et les surfaces y contribuent moins. <button class="w" data-justification="1" data-k="j09-voies">Gouttelettes, aérosols et contact (part de chaque voie et mesures correspondantes)</button> expliquent la diffusion rapide dans les familles, les écoles et les établissements de soins.</p>
<h3>Incubation et période contagieuse</h3>
<p>L’incubation dure en moyenne deux jours, avec des extrêmes de un à quatre jours. <button class="w" data-justification="1" data-k="j09-incubation">La contagiosité commence la veille des symptômes et dure cinq à sept jours (cinétique de l’excrétion)</button> ; elle culmine durant les trois premiers jours. Le jeune enfant et l’immunodéprimé excrètent le virus plus longtemps, parfois plusieurs semaines.</p>
<p>Dans les études d’inoculation volontaire, seules 66,9 % des infections provoquaient des symptômes. <button class="w" data-justification="1" data-k="j09-asympto">Les formes peu symptomatiques excrètent moins de virus, mais en excrètent (données familiales)</button>. Isoler les seuls malades fébriles ne protège donc pas un service hospitalier : la vaccination du personnel et le masque complètent la protection.</p>
<h3>Facteurs de risque de complication</h3>
<p>Le risque de complication dépend d’abord du terrain : en 2023/2024, les patients Sentinella atteints d’une maladie chronique avaient un risque de pneumonie 3,3 fois plus élevé que les autres. Les <button class="w" data-justification="1" data-k="j09-risque">personnes à risque accru de complications (liste officielle de l’OFSP, 2025)</button> sont aussi les cibles prioritaires de la vaccination. Le tableau relie chaque facteur au mécanisme qui aggrave la grippe.</p>
<table class="t"><tr><th>Facteur de risque (OFSP)</th><th>Mécanisme principal de l’aggravation</th></tr>
<tr><td>65 ans et plus</td><td>Immunité moins efficace, comorbidités, réserve cardiorespiratoire réduite</td></tr>
<tr><td>Grossesse et 4 semaines après l’accouchement</td><td>Réserve pulmonaire diminuée, débit cardiaque accru, adaptation immunitaire</td></tr>
<tr><td>Maladie cardiaque</td><td>Demande en oxygène accrue par la fièvre et la tachycardie ; infarctus favorisé</td></tr>
<tr><td>Maladie pulmonaire, asthme compris</td><td>Bronchospasme viral, faible réserve ventilatoire</td></tr>
<tr><td>Diabète, obésité morbide (IMC ≥ 40)</td><td>Polynucléaires altérés par l’hyperglycémie ; volumes pulmonaires réduits</td></tr>
<tr><td>Maladie neurologique ou musculosquelettique</td><td>Toux inefficace, inhalation, faiblesse des muscles respiratoires</td></tr>
<tr><td>Maladie hépatique, insuffisance rénale</td><td>Défenses diminuées, déséquilibres hydriques et métaboliques</td></tr>
<tr><td>Asplénie, hémoglobinopathie</td><td>Clairance réduite des bactéries encapsulées, dont le pneumocoque</td></tr>
<tr><td>Immunodéficience (infection VIH, cancer, immunosuppresseur)</td><td>Réplication prolongée, pneumonie virale, sélection de résistances</td></tr>
<tr><td>Résidence en établissement de soins</td><td>Fragilité cumulée, transmission rapide entre résidents</td></tr></table>
<p>Une seule ligne suffit à classer le patient « à risque » ; la patiente de 72 ans en cumule deux, l’âge et la cardiopathie. L’erreur fréquente est de rassurer un adulte jeune obèse ou une femme enceinte en apparente bonne santé : ces deux groupes étaient surreprésentés parmi les formes graves de la pandémie de 2009. <button class="w" data-justification="1" data-k="j09-grossesse-risque">La grossesse aggrave la grippe par des mécanismes respiratoires, circulatoires et immunitaires (données de 2009)</button>.</p>
<p>La liste de l’OFSP sert à la vaccination. Pour l’antiviral, <button class="w" data-justification="1" data-k="j09-oms-risque">l’OMS a défini en 2024 le « haut risque » de forme grave (comparaison avec l’OFSP et l’IDSA)</button>. Ces définitions se recouvrent largement, et le jugement clinique tranche les cas limites.</p>
<div class="key"><b>À retenir.</b> La grippe se transmet par voie respiratoire après une incubation de un à quatre jours. La contagiosité débute la veille des symptômes, culmine les trois premiers jours et se prolonge chez l’enfant et l’immunodéprimé. Le risque de complication tient au terrain : âge de 65 ans et plus, grossesse, maladie chronique, immunodéficience ou vie en établissement de soins.</div>
<p class="src">Références : <a href="https://www.cdc.gov/flu/spread/index.html" target="_blank" rel="noopener">CDC, How flu spreads, mise à jour du 17.09.2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, recommandation de vaccination contre la grippe saisonnière, état février 2025</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel 2023/2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28011603/" target="_blank" rel="noopener">Ip et al., 2017</a> ; <a href="https://www.who.int/publications/i/item/9789240097759" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a>.</p></section></section>

<section class="ilot" id="j09-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse établit trois points : le récit évoque-t-il une grippe, depuis quand, et sur quel terrain ? Le deuxième, souvent négligé, conditionne le bénéfice de l’antiviral chez le patient ambulatoire.</p>
<h3>Le récit typique</h3>
<p>Le <button class="w" data-justification="1" data-k="j09-debut">début brutal (le patient peut souvent en donner l’heure)</button> est le trait le plus évocateur. Le patient décrit une <button class="w" data-justification="1" data-k="j09-fievre">fièvre de 38 à 40 °C avec frissons (mécanisme et valeur diagnostique)</button>, des <button class="w" data-justification="1" data-k="j09-myalgies">courbatures diffuses et une grande fatigue (origine cytokinique)</button> et des <button class="w" data-justification="1" data-k="j09-cephalees">céphalées frontales ou rétro-orbitaires (signes d’alerte)</button>. Une <button class="w" data-justification="1" data-k="j09-toux">toux sèche, une brûlure rétrosternale et un mal de gorge (lésion trachéobronchique)</button> accompagnent ou suivent de peu ces signes généraux. La rhinorrhée, fréquente, reste moins au premier plan que dans un rhume.</p>
<p>Chez 3744 adultes et adolescents présentant un syndrome grippal en période épidémique, l’association d’une fièvre et d’une toux apparues depuis moins de 48 heures avait une valeur prédictive positive de 79 % pour une grippe confirmée. Hors épidémie, le même tableau relève bien plus souvent d’un autre virus.</p>
<h3>Formes typiques et formes atypiques</h3>
<p>La présentation varie avec l’âge et le terrain. Les deux cartes opposent la forme de l’adulte aux formes où le diagnostic est le plus souvent manqué.</p>
<div class="two"><div class="card"><h4>Forme typique de l’adulte</h4><p>Le début est brutal, avec une fièvre élevée et des frissons dès les premières heures. Les courbatures et la fatigue obligent souvent à s’aliter ; la toux sèche et le mal de gorge suivent vite. La fièvre dure trois à cinq jours et les symptômes principaux trois à sept jours. La toux et la fatigue peuvent persister plus de deux semaines.</p></div><div class="card"><h4>Formes atypiques</h4><p>Chez la <button class="w" data-justification="1" data-k="j09-atypique-age">personne âgée fragile (confusion, chute, refus alimentaire sans fièvre)</button>, la fièvre peut manquer. Chez l’immunodéprimé, elle reste modeste malgré une réplication prolongée. Chez le jeune enfant, des nausées, des vomissements ou une diarrhée s’ajoutent aux signes respiratoires. Le malade chronique peut se présenter par une <button class="w" data-justification="1" data-k="j09-decompensation">décompensation de sa maladie (insuffisance cardiaque, BPCO, diabète)</button>.</p></div></div>
<p>L’absence de fièvre n’exclut donc pas une grippe chez le sujet âgé ou immunodéprimé. L’erreur fréquente est d’attribuer la confusion d’un résident à sa démence ou à une infection urinaire, alors que plusieurs résidents toussent depuis deux jours.</p>
<h3>Les questions qui changent la décision</h3>
<p>Le médecin fait préciser <button class="w" data-justification="1" data-k="j09-delai">le jour et l’heure du début des symptômes (délai de 48 heures et antiviral)</button>. Il recherche les <button class="w" data-justification="1" data-k="j09-contage">contacts malades et l’activité grippale régionale (probabilité avant le test)</button>. Il établit les facteurs de risque du tableau précédent, dont la grossesse et un traitement immunosuppresseur, ainsi que le <button class="w" data-justification="1" data-k="j09-vaccin-statut">statut vaccinal de la saison en cours (ce qu’il change et ce qu’il ne change pas)</button>.</p>
<p>Une <button class="w" data-justification="1" data-k="j09-expo-animale">exposition à des volailles, à des oiseaux sauvages ou à d’autres animaux infectés (suspicion de grippe zoonotique)</button> change la conduite : elle impose une protection respiratoire, un test spécifique et une déclaration. Chez l’enfant et l’adolescent, le médecin vérifie que personne ne donne d’<button class="w" data-justification="1" data-k="j09-aspirine">acide acétylsalicylique, proscrit pendant une grippe (syndrome de Reye)</button>.</p>
<p>Il recherche enfin les signes d’alarme du récit : une dyspnée, une douleur thoracique, une confusion, une baisse de la diurèse ou une incapacité à boire. Une <button class="w" data-justification="1" data-k="j09-biphasique">aggravation après une amélioration initiale (évolution en deux temps et surinfection)</button> est le signal le plus important.</p>
<div class="key"><b>À retenir.</b> Le récit typique associe un début brutal, une fièvre élevée, des courbatures et une toux sèche. Le médecin date le début, établit le terrain, vérifie la vaccination et recherche une exposition animale. En période épidémique, une confusion, une chute ou une décompensation chronique chez le sujet âgé doivent faire évoquer la grippe, même sans fièvre.</div>
<p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, mise à jour du 04.02.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., signes prédictifs de grippe, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18230677/" target="_blank" rel="noopener">Carrat et al., 2008</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., IDSA, 2019</a>.</p></section></section>

<section class="ilot" id="j09-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Dans la grippe simple, l’examen trouve un patient fébrile, fatigué, parfois tachycarde, dont l’auscultation pulmonaire est normale. Il sert donc surtout à rechercher une complication, en commençant par les paramètres vitaux.</p>
<h3>Paramètres vitaux</h3>
<p>Le tableau oppose le repère normal de l’adulte au seuil qui change la décision. Les seuils sont ceux de la Société suisse d’infectiologie pour l’infection respiratoire aiguë, communs à la grippe et à la pneumonie.</p>
<table class="t"><tr><th>Paramètre</th><th>Repère normal (adulte)</th><th>Seuil d’alarme</th></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-fr">Fréquence respiratoire (technique et signification)</button></td><td>12 à 20 par minute</td><td>30 par minute ou plus</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-spo">Saturation pulsée en oxygène (mesure et pièges)</button></td><td>95 % ou plus en air ambiant</td><td>Moins de 92 % ; moins de 90 % : hospitalisation à envisager</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-pa">Pression artérielle et perfusion (hypotension et déshydratation)</button></td><td>Valeur habituelle du patient</td><td>Systolique inférieure à 90 mmHg</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-v-fc">Fréquence cardiaque (fièvre, déshydratation ou myocardite)</button></td><td>60 à 100 par minute</td><td>Tachycardie disproportionnée à la fièvre</td></tr>
<tr><td><button class="w" data-justification="1" data-k="j09-conscience">État de conscience (confusion et ses causes)</button></td><td>Orienté, attentif</td><td>Confusion nouvelle</td></tr></table>
<p>Un seul seuil franchi suffit à faire envisager une évaluation hospitalière. L’erreur fréquente est de ne pas compter la fréquence respiratoire, qui s’élève souvent avant la chute de la saturation. Chez la patiente de 72 ans, une fréquence de 28 par minute et une saturation de 91 % imposent cette évaluation malgré une pression artérielle normale.</p>
<h3>Examen ciblé</h3>
<div class="two"><div class="card"><h4>Ce qui est compatible avec une grippe simple</h4><p>Le pharynx est rouge, sans dépôt. Les conjonctives peuvent être injectées, et de petits ganglions cervicaux sensibles sont possibles. L’<button class="w" data-justification="1" data-k="j09-ausc">auscultation pulmonaire (normale ou ronchi diffus)</button> est le plus souvent normale. Le patient boit et se lève.</p></div><div class="card"><h4>Ce qui oriente vers une complication</h4><p>Des crépitants localisés ou une matité orientent vers une pneumonie virale ou bactérienne. Des sibilants diffus traduisent un bronchospasme, surtout chez l’asthmatique. Des signes de <button class="w" data-justification="1" data-k="j09-deshydratation">déshydratation (muqueuses sèches, hypotension orthostatique)</button> traduisent des pertes non compensées. Des signes d’insuffisance cardiaque, une raideur de nuque, un déficit neurologique ou des muscles très douloureux à la pression font rechercher une atteinte d’organe.</p></div></div>
<p>Un signe de la seconde carte ne remet pas en cause la grippe : il impose de rechercher la complication correspondante. Les <button class="w" data-justification="1" data-k="j09-alarme">signes de gravité (synthèse et conduite)</button> rassemblent ces éléments.</p>
<div class="quiz ui"><p>Un homme de 45 ans, sans antécédent, consulte au troisième jour d’une grippe typique. Il allait mieux la veille, mais la fièvre est réapparue à 39,5 °C avec une toux productive et une douleur thoracique droite. La fréquence respiratoire est de 26 par minute et la saturation de 93 %. Quelle hypothèse faut-il retenir en premier ?</p><button data-ok="0">Une évolution naturelle de la grippe, qui ne justifie qu’un traitement symptomatique</button><button data-ok="1">Une pneumonie bactérienne de surinfection, qui impose une évaluation rapide et une imagerie</button><button data-ok="0">Une toux postvirale, qui peut durer plusieurs semaines</button><p class="fb" hidden>La réapparition de la fièvre après une amélioration, avec une toux productive, une douleur thoracique et une tachypnée, signe une évolution en deux temps. L’épithélium détruit par le virus favorise l’adhérence du pneumocoque et du staphylocoque doré. Le médecin recherche un foyer à l’examen et à l’imagerie, et discute une antibiothérapie. La toux postvirale persiste sans fièvre ni dyspnée ; elle ne s’accompagne pas d’une aggravation.</p></div>
<div class="key"><b>À retenir.</b> L’examen d’une grippe simple est normal en dehors de la fièvre. Une fréquence respiratoire de 30 par minute ou plus, une saturation inférieure à 92 %, une systolique inférieure à 90 mmHg ou une confusion nouvelle sont des signaux d’alarme. Un foyer pulmonaire, une déshydratation ou des signes cardiaques ou neurologiques orientent vers une atteinte d’organe ; le diagnostic et les tests suivent.</div>
<p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, pneumonie communautaire, signaux d’alarme</a> ; <a href="https://www.cdc.gov/flu/hcp/clinical-signs/index.html" target="_blank" rel="noopener">CDC, Clinical signs and symptoms of influenza, 2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki et al., IDSA, 2019</a>.</p>
