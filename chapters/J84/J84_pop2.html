<template data-pop="j84-dmd" data-title="Discussion multidisciplinaire"><p>La discussion réunit au minimum un pneumologue, un radiologue thoracique et, si un prélèvement existe, un pathologiste, tous expérimentés dans les PID ; un rhumatologue s’y joint dès qu’une connectivite est envisagée. Chaque discipline apporte une probabilité partielle, et leur intégration rend le diagnostic plus fiable et plus reproductible que chaque examen isolé. La discussion formule un diagnostic de travail assorti d’un niveau de confiance, décide si un prélèvement changerait la conclusion, choisit le traitement et fixe la réévaluation.</p><div class="key"><b>Limite.</b> Ce diagnostic reste révisable si une connectivite ou une exposition apparaît pendant le suivi.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a>.</p></template>
<template data-pop="j84-lba" data-title="Lavage broncho-alvéolaire"><p>Le liquide reflète la population cellulaire alvéolaire. Une lymphocytose nette traduit une réponse immunitaire active (pneumopathie d’hypersensibilité, sarcoïdose, réaction médicamenteuse) et rend la FPI moins probable ; une éosinophilie oriente vers une pneumopathie à éosinophiles. Le lavage recherche aussi une infection et une hémorragie alvéolaire.</p><div class="key"><b>Limite.</b> Il n’apporte rien devant un aspect UIP typique ; il est réservé aux cas indéterminés.</div></template>
<template data-pop="j84-biopsie" data-title="Cryobiopsie transbronchique et biopsie chirurgicale"><p>La biopsie chirurgicale par vidéothoracoscopie prélève plusieurs lobes et reste la référence histologique. La cryobiopsie transbronchique prélève par bronchoscopie des fragments de quelques millimètres après congélation du tissu. Comme le diagnostic d’UIP exige de voir l’hétérogénéité de la fibrose, un fragment plus grand et plusieurs sites augmentent le rendement. La recommandation 2022 accepte la cryobiopsie comme alternative dans les centres expérimentés (recommandation conditionnelle, preuves de très faible qualité) ; ses risques principaux sont le pneumothorax et le saignement, tandis que la chirurgie expose davantage à la mortalité et aux exacerbations.</p><div class="key"><b>Limite.</b> La biopsie est évitée en cas de DLCO très basse, d’hypertension pulmonaire ou de grande fragilité, et toujours si son résultat ne changerait pas la décision.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a>.</p></template>
<template data-pop="j84-cpfe" data-title="Association fibrose et emphysème"><p>Ce syndrome associe un emphysème des sommets et une fibrose des bases, presque toujours chez un grand fumeur. L’emphysème augmente les volumes, la fibrose les diminue : les deux effets s’annulent sur la spirométrie, mais tous deux détruisent la surface d’échange, d’où une DLCO effondrée. L’hypertension pulmonaire et le cancer bronchique y sont fréquents.</p><div class="key"><b>Piège.</b> Une spirométrie normale ne rassure pas devant une dyspnée importante chez un fumeur : la DLCO et la TDM révèlent la maladie.</div></template>
<template data-pop="j84-exacerbation" data-title="Exacerbation aiguë de la FPI"><p class="lab">Définition</p><p>Selon Collard et collaborateurs (2016), l’exacerbation associe une aggravation respiratoire en moins d’un mois, de nouvelles opacités bilatérales en verre dépoli ou des condensations sur un fond d’UIP, non entièrement expliquées par une insuffisance cardiaque ou une surcharge hydrique. Elle est dite déclenchée si une cause est identifiée, idiopathique sinon.</p><p class="lab">Mécanisme</p><p>Une lésion alvéolaire diffuse, proche du syndrome de détresse respiratoire aiguë, se superpose à une fibrose dont la réserve ne permet pas de la compenser.</p><p class="lab">Conduite</p><p>Le traitement associe oxygène, recherche et traitement des causes, soins de support et, sur un avis d’experts faible, des corticoïdes à forte dose. Dans l’essai EXAFIP, l’ajout de cyclophosphamide intraveineux aux glucocorticoïdes s’accompagnait d’une mortalité à trois mois de 45 % contre 31 % (différence non significative, p = 0,10), ce qui argumente contre son usage.</p><div class="key"><b>Limite.</b> Aucun essai randomisé n’a démontré l’efficacité des corticoïdes ici ; dans EXAFIP, la prise d’un antifibrosant s’associait à moins de décès, sans preuve causale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27299520/" target="_blank" rel="noopener">Collard et al., 2016</a> ; <a href="https://doi.org/10.1016/S2213-2600(21)00354-4" target="_blank" rel="noopener">Naccache et al., EXAFIP, 2022</a>.</p></template>
<template data-pop="j84-htp" data-title="Hypertension pulmonaire des PID"><p>L’hypertension pulmonaire des PID appartient au groupe 3 (maladies pulmonaires et hypoxie) et se confirme par cathétérisme droit. La destruction du lit capillaire, la vasoconstriction hypoxique et le remodelage artériolaire élèvent les résistances ; le ventricule droit se dilate. Elle est suspectée devant une dyspnée disproportionnée, une DLCO très basse, une désaturation marquée, des peptides natriurétiques élevés ou une pression pulmonaire élevée à l’échocardiographie. Elle aggrave le pronostic et compte parmi les critères d’inscription en transplantation.</p><div class="key"><b>Limite.</b> Les traitements de l’hypertension artérielle pulmonaire du groupe 1 ne sont pas transposables et certains sont nuisibles ici.</div></template>
<template data-pop="j84-d-nintedanib" data-title="Nintédanib"><p class="lab">Mécanisme</p><p>Inhibiteur intracellulaire de plusieurs tyrosine kinases, dont les récepteurs VEGFR, FGFR et PDGFR, le nintédanib freine la prolifération, la migration et la différenciation des fibroblastes.</p><p class="lab">Preuves</p><p>Dans INPULSIS-1 et INPULSIS-2 (1066 patients, 52 semaines), le déclin annuel de la CVF était de 114,7 contre 239,9 mL et de 113,6 contre 207,3 mL sous placebo. INBUILD a étendu le bénéfice aux fibroses progressives non idiopathiques, SENSCIS à la PID de la sclérodermie.</p><p class="lab">Indications et posologie suisses</p><p>FPI, PID fibrosantes chroniques à phénotype progressif et PID de la sclérodermie systémique, chez l’adulte. 150 mg deux fois par jour au cours d’un repas ; 100 mg deux fois par jour en cas d’effet indésirable ou d’insuffisance hépatique Child-Pugh A.</p><p class="lab">Effets indésirables et contre-indications</p><p>La diarrhée touche 62,4 % des patients dans INPULSIS ; nausées, vomissements, amaigrissement, élévation des transaminases, saignements, thromboses artérielles, perforations digestives et, rarement, insuffisance rénale ou protéinurie complètent le profil. Le médicament est contre-indiqué pendant la grossesse et en cas d’hypersensibilité au nintédanib, à l’arachide ou au soja.</p><p class="lab">Surveillance</p><p>Transaminases et bilirubine avant le traitement, régulièrement pendant trois mois puis périodiquement ; fonction rénale ; poids ; test de grossesse et contraception très efficace jusqu’à trois mois après la dernière dose.</p><p class="src">Références : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1402584" target="_blank" rel="noopener">Richeldi et al., 2014</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Ofev®, Swissmedic (AIPS, mise à jour 03.2025), consultée le 08.10.2026</a>.</p></template>
<template data-pop="j84-d-pirfenidone" data-title="Pirfénidone"><p class="lab">Mécanisme</p><p>La pirfénidone exerce des effets antifibrosants et anti-inflammatoires ; elle réduit la production de TGF-β et la synthèse de collagène, sans cible moléculaire précise établie.</p><p class="lab">Preuves</p><p>Des trois essais de phase 3 antérieurs, deux étaient positifs. L’essai ASCEND (555 patients) a réduit de 47,9 % à 52 semaines la proportion de patients ayant perdu au moins 10 points de CVF prédite ou décédés.</p><p class="lab">Indication et posologie suisses</p><p>FPI de l’adulte uniquement. Titration sur deux semaines jusqu’à 801 mg trois fois par jour (2403 mg par jour), avec des aliments.</p><p class="lab">Effets indésirables et contre-indications</p><p>Nausées (36,1 %), diarrhée, dyspepsie, photosensibilité, éruption et élévation des transaminases dominent. Le médicament est contre-indiqué avec la fluvoxamine, en cas d’insuffisance hépatique sévère ou terminale et d’insuffisance rénale sévère (clairance inférieure à 30 mL/min) ou dialysée ; il est proscrit après un angio-œdème sous pirfénidone.</p><p class="lab">Surveillance</p><p>Bilan hépatique avant le traitement, chaque mois pendant six mois puis tous les trois mois ; protection solaire quotidienne ; arrêt du tabac, qui réduit de moitié l’exposition au médicament.</p><div class="key"><b>Limite.</b> Hors FPI, la recommandation 2022 demande des études complémentaires dans la FPP. La recommandation ERS/EULAR 2025 la suggère dans la PID rhumatoïde d’aspect UIP, hors indication suisse.</div><p class="src">Références : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1402582" target="_blank" rel="noopener">King et al., 2014</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Esbriet®, Swissmedic (AIPS, mise à jour 08.2022), consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1016/j.ard.2025.08.021" target="_blank" rel="noopener">Antoniou et al., ERS/EULAR 2025</a>.</p></template>
<template data-pop="j84-d-nerandomilast" data-title="Nérandomilast"><p class="lab">Mécanisme</p><p>Inhibiteur préférentiel de la PDE4B, le nérandomilast possède des propriétés antifibrosantes et immunomodulatrices.</p><p class="lab">Preuves</p><p>Dans FIBRONEER-IPF (1177 patients, dont 77,7 % sous nintédanib ou pirfénidone), la CVF a baissé de 114,7 mL à 52 semaines sous 18 mg deux fois par jour contre 183,5 mL sous placebo. Dans FIBRONEER-ILD (1176 patients atteints de FPP), elle a baissé de 98,6 mL contre 165,8 mL. La diarrhée était l’effet le plus fréquent.</p><p class="lab">Statut et posologie</p><p>La Commission européenne l’a autorisé le 15.07.2026 dans la FPI et la FPP de l’adulte ; aucune information professionnelle suisse n’est publiée au 08.10.2026. Selon le résumé européen, la dose est de 18 mg deux fois par jour, réduite à 9 mg en cas de diarrhée ou de perte de poids mal tolérées ou avec un inhibiteur puissant du CYP3A, mais jamais sous pirfénidone ou sous inducteur du CYP3A.</p><div class="key"><b>Limite.</b> Le résumé européen demande de surveiller le poids et l’état psychique ; il déconseille le médicament en insuffisance hépatique Child-Pugh C et en insuffisance rénale terminale.</div><p class="src">Références : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa2414108" target="_blank" rel="noopener">Richeldi et al., 2025</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa2503643" target="_blank" rel="noopener">Maher et al., 2025</a> ; <a href="https://www.ema.europa.eu/en/documents/product-information/jascayd-epar-product-information_en.pdf" target="_blank" rel="noopener">Jascayd, résumé européen des caractéristiques du produit (EMA)</a>.</p></template>
<template data-pop="j84-oxygene" data-title="Oxygénothérapie dans les PID"><p>L’oxygène élève la pression alvéolaire, donc le gradient qui traverse une membrane épaissie, et réduit la vasoconstriction hypoxique. Chez le patient qui désature à la marche, l’oxygène d’effort améliore la dyspnée et la qualité de vie (essai croisé AmbOx, 84 patients désaturant à 88 % ou moins au test de marche, Visca, 2018).</p><p class="src">Référence : <a href="https://doi.org/10.1016/S2213-2600(18)30289-3" target="_blank" rel="noopener">Visca et al., AmbOx, 2018</a>.</p></template>
<template data-pop="j84-rehabilitation" data-title="Réhabilitation respiratoire"><p>Selon la revue Cochrane de 2021 (21 études, programmes de 3 à 48 semaines), la réhabilitation allonge la distance de marche de 40 m en moyenne (37 m dans la FPI), réduit la dyspnée et améliore la qualité de vie ; ces gains persistent en partie six à douze mois. Aucun événement indésirable lié aux séances n’a été rapporté.</p><div class="key"><b>Limite.</b> Les preuves sont de certitude faible à modérée, et l’effet sur la survie reste incertain.</div><p class="src">Référence : <a href="https://doi.org/10.1002/14651858.CD006322.pub4" target="_blank" rel="noopener">Dowman et al., Cochrane, 2021</a>.</p></template>
<template data-pop="j84-a-eviter" data-title="Traitements à éviter dans la FPI"><p>Des essais randomisés ont rejeté l’association prednisone, azathioprine et N-acétylcystéine (PANTHER-IPF), la warfarine (ACE-IPF, interrompu pour 14 décès contre 3 sous placebo) ; la recommandation 2022 déconseille les antiacides et la chirurgie antireflux à visée respiratoire. L’immunosuppression favorise les infections sans freiner la fibrose ; l’anticoagulation n’agit pas sur la fibrogenèse et expose au saignement.</p><div class="key"><b>Limite.</b> L’anticoagulation garde ses indications propres (fibrillation atriale, thrombose) et le reflux symptomatique se traite pour lui-même.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22607134/" target="_blank" rel="noopener">Raghu et al., 2012</a> ; <a href="https://doi.org/10.1164/rccm.201202-0314OC" target="_blank" rel="noopener">Noth et al., ACE-IPF, 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a>.</p></template>
<template data-pop="j84-transplantation" data-title="Transplantation pulmonaire : critères ISHLT 2021"><p class="lab">Définition</p><p>Le consensus ISHLT 2021 distingue l’orientation vers un centre, précoce, et l’inscription sur liste, réservée à une maladie qui progresse malgré le traitement.</p><table class="t"><tr><th>Étape</th><th>Critères pour une PID fibrosante</th></tr><tr><td>Orientation</td><td>Dès le diagnostic d’une UIP histologique ou d’un aspect UIP certain ou probable, même si un traitement débute ; toute fibrose avec CVF inférieure à 80 % ou DLCO inférieure à 40 % ; en deux ans, baisse relative de la CVF d’au moins 10 %, de la DLCO d’au moins 15 %, ou de la CVF d’au moins 5 % avec aggravation des symptômes ou de l’imagerie ; tout besoin d’oxygène, même à l’effort ; connectivite ou forme familiale</td></tr><tr><td>Inscription</td><td>En six mois malgré le traitement : baisse absolue de la CVF de plus de 10 %, de la DLCO de plus de 10 %, ou de la CVF de plus de 5 % avec progression radiologique ; SpO₂ inférieure à 88 % ou perte de plus de 50 m au test de marche ; hypertension pulmonaire ; hospitalisation pour déclin respiratoire, pneumothorax ou exacerbation</td></tr></table><p class="lab">Mécanisme</p><p>Le remplacement du poumon fibreux supprime le défaut d’échange gazeux ; l’immunosuppression à vie expose aux infections, au rejet chronique et aux cancers.</p><p class="lab">Conséquence clinique</p><p>L’évaluation prend des mois ; une orientation précoce évite qu’une exacerbation rende le patient inéligible. En Suisse, les transplantations pulmonaires sont réalisées dans des centres universitaires.</p><div class="key"><b>Limite.</b> L’âge biologique, les comorbidités, la fragilité et les télomèropathies modifient l’éligibilité ; la décision appartient au centre.</div><p class="src">Référence : <a href="https://doi.org/10.1016/j.healun.2021.07.005" target="_blank" rel="noopener">Leard et al., consensus ISHLT, 2021, tableau 3</a>.</p></template>
<template data-pop="j84-pins" data-title="Pneumopathie interstitielle non spécifique"><p>La PINS est une atteinte interstitielle homogène dans le temps, cellulaire ou fibrosante. En TDM, elle donne un verre dépoli et des réticulations basales et symétriques, souvent avec une épargne sous-pleurale immédiate. Une agression unique ou continue, souvent auto-immune, enflamme toutes les parois au même stade. La PINS impose de rechercher une connectivite, une pneumopathie d’hypersensibilité ou un médicament ; la forme cellulaire répond bien à l’immunosuppression, la forme fibrosante moins, et peut évoluer en FPP.</p><div class="key"><b>Limite.</b> La PINS idiopathique est rare et n’est retenue qu’après discussion multidisciplinaire et suivi.</div></template>
<template data-pop="j84-fpp" data-title="Fibrose pulmonaire progressive : critères 2022"><p>Chez un patient atteint d’une PID fibrosante autre que la FPI, la FPP exige au moins deux des trois critères suivants au cours de l’année écoulée, sans autre explication.</p><table class="t"><tr><th>Domaine</th><th>Critère</th></tr><tr><td>Symptômes</td><td>Aggravation des symptômes respiratoires</td></tr><tr><td>Fonction</td><td>Baisse absolue de la CVF d’au moins 5 % de la valeur prédite, ou de la DLCO corrigée pour l’hémoglobine d’au moins 10 %</td></tr><tr><td>Imagerie</td><td>Bronchiectasies de traction plus étendues ; nouveau verre dépoli avec bronchiectasies de traction ; réticulations nouvelles, plus étendues ou plus grossières ; rayon de miel nouveau ou étendu ; perte de volume lobaire accrue</td></tr></table><p>Au-delà de leur cause, ces maladies partagent une fibrogenèse autonome comparable à celle de la FPI ; la FPP justifie donc un antifibrosant (recommandation conditionnelle pour le nintédanib) en plus du traitement de la cause.</p><div class="key"><b>Limite.</b> La FPP décrit un comportement évolutif, non un diagnostic ; insuffisance cardiaque, infection et embolie sont exclues avant de la retenir.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022, tableau 4</a>.</p></template>
<template data-pop="j84-inbuild" data-title="Essai INBUILD"><p>Cet essai randomisé a inclus 663 patients atteints de PID fibrosante progressive autre que la FPI (pneumopathie d’hypersensibilité, connectivites, PINS, PID inclassables). Le déclin annuel de la CVF était de 80,8 mL sous nintédanib contre 187,8 mL sous placebo, avec un bénéfice comparable avec ou sans aspect UIP. Il a fondé l’indication du nintédanib dans la FPP.</p><div class="key"><b>Limite.</b> Ses critères de progression diffèrent légèrement de la définition de 2022.</div><p class="src">Référence : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1908681" target="_blank" rel="noopener">Flaherty et al., 2019</a>.</p></template>
<template data-pop="j84-gap" data-title="Indice GAP"><p>L’indice GAP combine quatre variables mesurées en routine : le sexe, l’âge et deux variables fonctionnelles, la CVF et la DLCO. Il distingue trois stades, dont la mortalité à un an atteint 6 %, 16 % et 39 %. Il a été dérivé chez 228 patients et validé chez 330 autres, en Californie, au Minnesota et en Italie.</p><div class="key"><b>Limite.</b> Établi rétrospectivement avant les antifibrosants, il décrit des groupes et non un individu.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/22586007/" target="_blank" rel="noopener">Ley et al., 2012</a>.</p></template>
<template data-pop="j84-immunosuppresseurs" data-title="Immunosuppresseurs dans les PID inflammatoires"><p class="lab">Mécanismes</p><p>Le mycophénolate inhibe la synthèse des purines lymphocytaires ; le rituximab détruit les lymphocytes B porteurs du CD20 ; le cyclophosphamide est un agent alkylant ; le tocilizumab bloque le récepteur de l’interleukine 6.</p><p class="lab">Place selon ERS/EULAR 2025</p><p>Dans la sclérodermie, le mycophénolate est suggéré, seul ou avec le nintédanib. Dans les myopathies inflammatoires, l’immunosuppression est recommandée, en associations comprenant les glucocorticoïdes. Dans toute connectivite avec FPP, l’ajout du nintédanib est suggéré.</p><p class="lab">Surveillance</p><p>Numération sanguine, fonction hépatique, vaccinations, prophylaxie de la pneumocystose selon le schéma, contraception pour les molécules tératogènes.</p><div class="key"><b>Limite.</b> Ces molécules sont nuisibles dans la FPI.</div><p class="src">Référence : <a href="https://doi.org/10.1016/j.ard.2025.08.021" target="_blank" rel="noopener">Antoniou et al., ERS/EULAR 2025</a>.</p></template>
<template data-pop="j84-corticoides" data-title="Glucocorticoïdes dans les PID"><p>Les glucocorticoïdes inhibent la transcription des cytokines inflammatoires et le recrutement lymphocytaire, sans agir sur une fibrogenèse établie. Ils sont efficaces dans la pneumopathie organisée, la PINS cellulaire et certaines pneumopathies médicamenteuses ou d’hypersensibilité, et employés à forte dose dans l’exacerbation aiguë de FPI sur avis d’experts. Diabète, ostéoporose, myopathie, infections et troubles de l’humeur limitent leur usage prolongé, qui impose une prévention de l’ostéoporose.</p><div class="key"><b>Limite.</b> Dans la FPI, la corticothérapie au long cours est proscrite depuis PANTHER-IPF.</div></template>
<template data-pop="j84-interactions" data-title="Interactions des antifibrosants"><p class="lab">Pirfénidone</p><p>Métabolisée par le CYP1A2, elle est contre-indiquée avec la fluvoxamine, qui multiplie par quatre son exposition. Avec la ciprofloxacine à 750 mg deux fois par jour, sa dose est réduite à 534 mg trois fois par jour ; aux doses de 250 ou 500 mg, la prudence suffit. Le tabac, inducteur du CYP1A2, réduit son exposition de moitié : l’arrêt est demandé avant et pendant le traitement.</p><p class="lab">Nintédanib</p><p>Substrat de la glycoprotéine P, il voit son exposition multipliée par 1,6 sous kétoconazole, ce qui impose de surveiller la tolérance ; la rifampicine la réduit de moitié et fait choisir une alternative non inductrice. Il peut majorer le risque hémorragique, ce qui compte chez le patient anticoagulé.</p><p class="lab">Nérandomilast</p><p>Substrat du CYP3A, il voit son exposition multipliée par 2,2 sous itraconazole ; la carbamazépine la réduit de 51 % et la pirfénidone d’environ moitié.</p><p>Une diarrhée ou des vomissements compromettent la contraception orale et imposent une méthode complémentaire.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Esbriet®, Swissmedic (AIPS, mise à jour 08.2022), consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Ofev®, Swissmedic (AIPS, mise à jour 03.2025), consultée le 08.10.2026</a> ; <a href="https://www.ema.europa.eu/en/documents/product-information/jascayd-epar-product-information_en.pdf" target="_blank" rel="noopener">Jascayd, résumé européen des caractéristiques du produit (EMA)</a>.</p></template>
<template data-pop="pareto-j84-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j84-0,j84-1,j84-2,j84-3,j84-4,j84-5,j84-6"></p><ul><li>Une PID atteint la paroi alvéolaire ; elle provoque donc une dyspnée d’effort, une toux sèche, un trouble restrictif et une DLCO basse, parce que la paroi épaissie et rigide gêne à la fois l’expansion du poumon et le passage des gaz.</li><li>La FPI est une fibrose chronique de cause inconnue, après 60 ans, d’aspect UIP ; son diagnostic est d’exclusion.</li><li>Sans traitement, la CVF baisse d’environ 200 mL par an ; l’évolution est hétérogène et ponctuée d’exacerbations.</li><li>Le mécanisme est une réparation aberrante de micro-lésions épithéliales, non une inflammation ; MUC5B et les télomères prédisposent.</li><li>Médicaments, expositions, antigènes et connectivite sont recherchés avant toute conclusion.</li><li>Crépitants « velcro » des bases, hippocratisme et désaturation d’effort sont les signes clés.</li></ul></template>
<template data-pop="pareto-j84-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j84-7"></p><ul><li>La TDM en haute résolution se lit en quatre catégories : UIP, UIP probable, indéterminée, diagnostic alternatif.</li><li>Un aspect UIP, ou UIP probable compatible, sans cause permet de retenir une FPI sans biopsie après discussion multidisciplinaire.</li><li>Lavage et biopsie ne se justifient que si leur résultat peut changer la décision.</li><li>Insuffisance cardiaque, infection, lymphangite et hémorragie alvéolaire sont éliminées d’abord.</li><li>Un aspect UIP ne signifie pas une FPI, car la polyarthrite rhumatoïde, la pneumopathie d’hypersensibilité et l’asbestose l’imitent.</li></ul></template>
<template data-pop="pareto-j84-tt" data-title="Pareto — Urgences et traitements"><p class="ratio" data-cover="j84-8,j84-9,j84-10"></p><ul><li>Une exacerbation aiguë est une aggravation en moins d’un mois avec des opacités nouvelles, et sa mortalité hospitalière est lourde.</li><li>Un antifibrosant, nintédanib ou pirfénidone, se discute dès le diagnostic de FPI, parce qu’il ralentit le déclin de la CVF sans réparer la fibrose déjà constituée ; le nérandomilast est autorisé dans l’Union européenne, mais il n’a pas de monographie suisse au 08.10.2026.</li><li>Oxygène, réhabilitation, vaccinations, arrêt du tabac, orientation précoce vers la transplantation.</li><li>Ni corticoïdes au long cours, ni triple association, ni warfarine sans indication.</li><li>Hors FPI, la cause est traitée ; une progression (deux critères sur trois en un an) appelle un antifibrosant ajouté.</li></ul></template>
<template data-pop="pareto-j84-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="j84-11,j84-12,j84-13"></p><ul><li>CVF, DLCO et test de marche suivis régulièrement ; une baisse absolue de CVF d’au moins 5 % en un an est un critère de progression.</li><li>L’indice GAP prédit une mortalité à un an de 6 %, 16 % et 39 % selon son stade.</li><li>Soins palliatifs précoces et directives anticipées avant toute exacerbation.</li><li>Nintédanib contre-indiqué pendant la grossesse ; adaptation hépatique et rénale des antifibrosants.</li><li>Le diagnostic de FPI exige l’exclusion des autres causes et un aspect UIP, ou un aspect UIP probable compatible avec le contexte, ou une concordance avec l’histologie.</li></ul></template>
<template data-pop="pareto-j84-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j84-e-1,j84-e-2,j84-e-3"></p><ul><li>La discussion multidisciplinaire est le standard diagnostique, tandis que la biopsie chirurgicale reste la référence lésionnelle.</li><li>TDM en haute résolution avec coupes en expiration et en décubitus ventral.</li><li>Trouble restrictif, rapport VEMS/CVF normal, DLCO abaissée précocement ; piège de l’emphysème associé.</li><li>La sérologie recherche les anticorps antinucléaires, le facteur rhumatoïde, les anti-CCP et, selon la clinique, un panel de myosite, car une connectivite méconnue change le traitement.</li><li>Devant un même aspect, le contexte tranche entre FPI, connectivite, hypersensibilité et asbestose.</li></ul></template>
<template data-pop="pareto-j84-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j84-p-1,j84-p-2,j84-p-3,j84-p-4"></p><ul><li>Un phénotype fibrosant appelle un antifibrosant et un phénotype inflammatoire un immunosuppresseur ; les deux coexistent souvent.</li><li>Nintédanib 150 mg deux fois par jour ; pirfénidone 801 mg trois fois par jour après titration ; prise au cours des repas.</li><li>Fluvoxamine contre-indiquée avec la pirfénidone ; glycoprotéine P et anticoagulants avec le nintédanib.</li><li>Transaminases, poids et tolérance digestive sont surveillés ; la dose est réduite plutôt qu’arrêtée.</li><li>Corticoïdes au long cours, triple association, warfarine et cyclophosphamide dans l’exacerbation sont à éviter.</li></ul></template>
