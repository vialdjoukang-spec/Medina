<template data-pop="j84-dmd" data-title="Discussion multidisciplinaire"><p class="lab">Définition</p><p>La discussion multidisciplinaire réunit au minimum un pneumologue, un radiologue thoracique et, si un prélèvement existe, un pathologiste, tous expérimentés dans les PID. Un rhumatologue s’y joint dès qu’une connectivite est envisagée.</p><p class="lab">Mécanisme</p><p>Chaque discipline apporte une probabilité partielle. Leur intégration produit un diagnostic plus fiable et plus reproductible que chaque examen isolé, et décide si un prélèvement supplémentaire changerait la conclusion.</p><p class="lab">Conséquence clinique</p><p>La discussion formule un diagnostic de travail assorti d’un niveau de confiance, décide du traitement et fixe la date de réévaluation.</p><div class="key"><b>Limite.</b> Ce diagnostic reste révisable : une connectivite ou une exposition découverte pendant le suivi peut le modifier.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a>.</p></template>
<template data-pop="j84-lba" data-title="Lavage broncho-alvéolaire"><p class="lab">Repère normal</p><p>Chez le non-fumeur, la formule comporte plus de 80 % de macrophages, moins de 15 % de lymphocytes, moins de 3 % de neutrophiles et moins de 1 % d’éosinophiles.</p><p class="lab">Mécanisme</p><p>Le liquide recueilli reflète la population cellulaire des alvéoles. Une alvéolite lymphocytaire traduit une réponse immunitaire active, comme dans la pneumopathie d’hypersensibilité, la sarcoïdose ou une réaction médicamenteuse.</p><p class="lab">Conséquence clinique</p><p>Une lymphocytose nette rend la FPI moins probable et oriente vers une cause ; une éosinophilie supérieure à 25 % oriente vers une pneumopathie à éosinophiles. Le lavage recherche aussi une infection et une hémorragie alvéolaire.</p><div class="key"><b>Limite.</b> Le lavage n’apporte rien lorsque la TDM montre un aspect UIP typique ; il est réservé aux cas indéterminés, sur décision de la discussion multidisciplinaire.</div></template>
<template data-pop="j84-biopsie" data-title="Cryobiopsie transbronchique et biopsie chirurgicale"><p class="lab">Définition</p><p>La biopsie pulmonaire chirurgicale, par vidéothoracoscopie, prélève plusieurs lobes et reste la référence histologique. La cryobiopsie transbronchique prélève par bronchoscopie des fragments de quelques millimètres, après congélation du tissu par une sonde.</p><p class="lab">Mécanisme</p><p>Le diagnostic d’UIP exige de voir l’hétérogénéité de la fibrose : un fragment plus grand et plusieurs sites augmentent la probabilité de la montrer.</p><p class="lab">Conséquence clinique</p><p>La recommandation 2022 accepte la cryobiopsie comme alternative à la biopsie chirurgicale dans les centres expérimentés (recommandation conditionnelle, preuves de très faible qualité). Ses complications principales sont le pneumothorax et le saignement ; la chirurgie expose davantage à la mortalité et aux exacerbations chez le patient fragile.</p><div class="key"><b>Limite.</b> Une biopsie n’est indiquée que si son résultat peut changer la décision ; elle est évitée en cas de DLCO très basse, d’hypertension pulmonaire ou de grande fragilité.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a>.</p></template>
<template data-pop="j84-cpfe" data-title="Association fibrose et emphysème"><p class="lab">Définition</p><p>Ce syndrome associe un emphysème des sommets et une fibrose des bases, presque toujours chez un grand fumeur.</p><p class="lab">Mécanisme</p><p>L’emphysème augmente la compliance et les volumes, la fibrose les diminue : les deux effets s’annulent sur la spirométrie. Tous deux détruisent en revanche la surface d’échange, d’où une DLCO effondrée.</p><p class="lab">Conséquence clinique</p><p>Les volumes peuvent paraître normaux chez un patient très dyspnéique. L’hypertension pulmonaire et le cancer bronchique y sont fréquents et pèsent sur le pronostic.</p><div class="key"><b>Piège.</b> Une spirométrie normale ne rassure pas devant une dyspnée importante chez un fumeur : la DLCO et la TDM révèlent la maladie.</div></template>
<template data-pop="j84-exacerbation" data-title="Exacerbation aiguë de la FPI"><p class="lab">Définition</p><p>Selon Collard et collaborateurs (2016), l’exacerbation associe une aggravation respiratoire en moins d’un mois, de nouvelles opacités bilatérales en verre dépoli ou des condensations sur un fond d’UIP, et l’absence d’explication complète par une insuffisance cardiaque ou une surcharge hydrique. Elle est dite déclenchée si une cause est identifiée (infection, chirurgie, inhalation), idiopathique sinon.</p><p class="lab">Mécanisme</p><p>Une lésion alvéolaire diffuse aiguë, histologiquement proche du syndrome de détresse respiratoire aiguë, se superpose à la fibrose ; la réserve déjà réduite ne permet pas de la compenser.</p><p class="lab">Conséquence clinique</p><p>Le traitement associe l’oxygène, la recherche et le traitement des causes, les soins de support et, sur un avis d’experts ancien et faible, des corticoïdes à forte dose. Dans l’essai EXAFIP, l’ajout de cyclophosphamide augmentait la mortalité à trois mois (45 % contre 31 %). Près de la moitié des patients hospitalisés décèdent selon les séries.</p><div class="key"><b>Limite.</b> Aucun essai randomisé n’a démontré l’efficacité des corticoïdes dans cette situation. Dans EXAFIP, la prise d’un antifibrosant s’associait à un risque de décès plus faible, sans preuve causale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27299520/" target="_blank" rel="noopener">Collard et al., 2016</a> ; <a href="https://doi.org/10.1016/S2213-2600(21)00354-4" target="_blank" rel="noopener">Naccache et al., EXAFIP, 2022</a>.</p></template>
<template data-pop="j84-htp" data-title="Hypertension pulmonaire des PID"><p class="lab">Définition</p><p>L’hypertension pulmonaire associée aux PID appartient au groupe 3 de la classification (maladies pulmonaires et hypoxie). Le cathétérisme cardiaque droit la confirme.</p><p class="lab">Mécanisme</p><p>La destruction du lit capillaire, la vasoconstriction hypoxique et le remodelage artériolaire élèvent les résistances vasculaires pulmonaires ; le ventricule droit se dilate.</p><p class="lab">Conséquence clinique</p><p>Elle est suspectée devant une dyspnée disproportionnée, une DLCO très basse, une désaturation marquée à l’effort, des peptides natriurétiques élevés ou une pression systolique pulmonaire élevée à l’échocardiographie. Elle aggrave le pronostic et compte parmi les critères d’inscription en transplantation.</p><div class="key"><b>Limite.</b> Les traitements de l’hypertension artérielle pulmonaire du groupe 1 ne sont pas transposables, et certains sont nuisibles dans les PID ; leur usage relève d’un centre spécialisé.</div></template>
<template data-pop="j84-d-nintedanib" data-title="Nintédanib"><p class="lab">Mécanisme</p><p>Le nintédanib inhibe de l’intérieur de la cellule les tyrosine kinases des récepteurs VEGFR, FGFR et PDGFR. Il freine la prolifération, la migration et la différenciation des fibroblastes.</p><p class="lab">Preuves</p><p>Dans les essais INPULSIS (1066 patients, 52 semaines), le déclin annuel de la CVF était de 113,6 mL sous nintédanib contre 223,5 mL sous placebo. INBUILD a étendu le bénéfice aux fibroses progressives non idiopathiques, SENSCIS à la PID de la sclérodermie.</p><p class="lab">Posologie</p><p>150 mg deux fois par jour au cours d’un repas ; 100 mg deux fois par jour en cas d’intolérance ou d’atteinte hépatique Child-Pugh A.</p><p class="lab">Effets indésirables et contre-indications</p><p>La diarrhée touche environ deux patients sur trois ; s’y ajoutent nausées, perte d’appétit et de poids, élévation des transaminases, saignements, rares événements thromboemboliques artériels et perforations digestives. Le médicament est contre-indiqué pendant la grossesse et en cas d’hypersensibilité à l’arachide ou au soja (excipient).</p><p class="lab">Surveillance</p><p>Transaminases et bilirubine avant le traitement, à intervalles réguliers pendant les trois premiers mois puis périodiquement ; poids ; contraception très efficace jusqu’à trois mois après l’arrêt.</p><div class="key"><b>Limite.</b> Indications européennes : FPI, autres PID fibrosantes chroniques progressives, PID de la sclérodermie systémique. L’information professionnelle suisse n’a pas pu être lue ; ces données suivent le résumé britannique révisé le 02.10.2025.</div><p class="src">Références : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1402584" target="_blank" rel="noopener">Richeldi et al., 2014</a> ; <a href="https://www.medicines.org.uk/emc/product/7705/smpc" target="_blank" rel="noopener">Ofev, résumé des caractéristiques</a>.</p></template>
<template data-pop="j84-d-pirfenidone" data-title="Pirfénidone"><p class="lab">Mécanisme</p><p>La pirfénidone réduit la production de TGF-β et de médiateurs inflammatoires, diminue la synthèse de collagène par les fibroblastes et exerce une activité antioxydante ; son mécanisme moléculaire précis reste mal connu.</p><p class="lab">Preuves</p><p>Des deux essais CAPACITY, un seul était positif. L’essai confirmatoire ASCEND (555 patients) a réduit de 47,9 % à 52 semaines la proportion de patients ayant perdu au moins 10 % de CVF prédite ou décédés.</p><p class="lab">Posologie</p><p>Titration sur deux semaines jusqu’à 801 mg trois fois par jour (2403 mg par jour), toujours au cours des repas.</p><p class="lab">Effets indésirables et contre-indications</p><p>Les effets principaux sont les nausées, la dyspepsie, l’anorexie, la photosensibilité, l’éruption cutanée et l’élévation des transaminases. Le médicament est contre-indiqué avec la fluvoxamine, en cas d’insuffisance hépatique sévère, d’insuffisance rénale sévère et d’antécédent d’angio-œdème sous pirfénidone.</p><p class="lab">Surveillance</p><p>Bilan hépatique avant le traitement, chaque mois pendant six mois puis tous les trois mois ; protection solaire ; arrêt du tabac, qui réduit l’exposition au médicament.</p><div class="key"><b>Limite.</b> Hors FPI, la recommandation 2022 ne s’est pas prononcée pour la pirfénidone dans la FPP. La recommandation ERS/EULAR 2025 la suggère dans la PID rhumatoïde d’aspect UIP et juge les preuves insuffisantes dans les autres connectivites.</div><p class="src">Références : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1402582" target="_blank" rel="noopener">King et al., 2014</a> ; <a href="https://www.medicines.org.uk/emc/product/7939/smpc" target="_blank" rel="noopener">Esbriet, résumé des caractéristiques</a> ; <a href="https://doi.org/10.1016/j.ard.2025.08.021" target="_blank" rel="noopener">Antoniou et al., ERS/EULAR 2025</a>.</p></template>
<template data-pop="j84-d-nerandomilast" data-title="Nérandomilast"><p class="lab">Mécanisme</p><p>Le nérandomilast inhibe préférentiellement la PDE4B. L’élévation de l’AMPc qui en résulte freine la transformation des fibroblastes en myofibroblastes et la libération de cytokines inflammatoires.</p><p class="lab">Preuves</p><p>Dans FIBRONEER-IPF (1177 patients, dont 77,7 % déjà sous antifibrosant), la CVF a baissé de 114,7 mL à 52 semaines sous 18 mg deux fois par jour contre 183,5 mL sous placebo. Dans FIBRONEER-ILD (1176 patients atteints de FPP), elle a baissé de 98,6 mL contre 165,8 mL. La diarrhée était l’effet le plus fréquent ; une dépression a été rapportée chez 12 % des patients contre 10 % sous placebo dans FIBRONEER-IPF.</p><p class="lab">Posologie et statut</p><p>18 mg deux fois par jour ; 9 mg deux fois par jour en cas d’intolérance, sauf sous pirfénidone, qui réduit d’environ moitié l’exposition au nérandomilast. Le médicament est autorisé par la FDA depuis le 07.10.2025 dans la FPI et depuis le 19.12.2025 dans la FPP, puis dans l’Union européenne en juillet 2026 pour ces deux indications.</p><div class="key"><b>Limite.</b> Aucune autorisation Swissmedic n’a pu être confirmée au 08.10.2026. Dans les deux essais, le critère secondaire principal (délai jusqu’à une exacerbation, une hospitalisation respiratoire ou un décès) n’a pas été atteint.</div><p class="src">Références : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa2414108" target="_blank" rel="noopener">Richeldi et al., 2025</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa2503643" target="_blank" rel="noopener">Maher et al., 2025</a> ; <a href="https://www.fda.gov/drugs/news-events-human-drugs/fda-approves-drug-treat-idiopathic-pulmonary-fibrosis" target="_blank" rel="noopener">FDA, 2025</a> ; <a href="https://www.ema.europa.eu/en/medicines/human/EPAR/jascayd" target="_blank" rel="noopener">EMA, Jascayd</a>.</p></template>
<template data-pop="j84-oxygene" data-title="Oxygénothérapie dans les PID"><p class="lab">Indications</p><p>L’oxygénothérapie de longue durée est indiquée lorsque la PaO₂ de repos est inférieure ou égale à 7,3 kPa, ou à 8,0 kPa en présence d’un cœur pulmonaire ou d’une polyglobulie. Ces seuils ont été établis dans la BPCO puis appliqués aux PID.</p><p class="lab">Mécanisme</p><p>L’oxygène élève la pression partielle alvéolaire, donc le gradient qui pousse l’oxygène à travers une membrane épaissie ; il réduit aussi la vasoconstriction hypoxique.</p><p class="lab">Conséquence clinique</p><p>Chez les patients qui désaturent à la marche, l’oxygène d’effort améliore la dyspnée et la qualité de vie selon l’essai randomisé britannique AmbOx (Visca, 2018).</p><div class="key"><b>Limite.</b> Aucun essai n’a démontré de bénéfice de survie dans les PID ; les critères de prescription sont extrapolés de la BPCO.</div></template>
<template data-pop="j84-rehabilitation" data-title="Réhabilitation respiratoire"><p class="lab">Définition</p><p>Programme supervisé de huit à douze semaines qui associe entraînement en endurance et en force, éducation et soutien psychologique.</p><p class="lab">Mécanisme</p><p>L’entraînement améliore l’extraction musculaire de l’oxygène, diminue la ventilation nécessaire à un même effort et réduit la peur de l’essoufflement.</p><p class="lab">Conséquence clinique</p><p>Selon la revue Cochrane de 2021, elle allonge la distance de marche d’environ 40 m et améliore la dyspnée et la qualité de vie dans les PID.</p><div class="key"><b>Limite.</b> Le bénéfice s’estompe en quelques mois sans poursuite de l’activité ; l’oxygène d’effort est adapté pendant les séances.</div></template>
<template data-pop="j84-a-eviter" data-title="Traitements à éviter dans la FPI"><p class="lab">Définition</p><p>Plusieurs traitements ont été évalués par essais randomisés puis rejetés : corticoïdes au long cours associés à l’azathioprine et à la N-acétylcystéine (PANTHER-IPF), warfarine (ACE-IPF), ambrisentan, antiacides et chirurgie antireflux à visée respiratoire.</p><p class="lab">Mécanisme</p><p>L’immunosuppression favorise les infections sans freiner la fibrose ; l’anticoagulation n’agit pas sur la fibrogenèse et expose au saignement.</p><p class="lab">Conséquence clinique</p><p>L’essai ACE-IPF a été interrompu pour surmortalité sous warfarine. Une anticoagulation reste prescrite pour ses indications propres, comme la fibrillation atriale ou la thrombose.</p><div class="key"><b>Limite.</b> Le reflux gastro-œsophagien symptomatique se traite pour lui-même ; seule la prescription destinée à améliorer la fonction respiratoire est déconseillée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22607134/" target="_blank" rel="noopener">Raghu et al., 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a>.</p></template>
<template data-pop="j84-transplantation" data-title="Transplantation pulmonaire : critères ISHLT 2021"><p class="lab">Définition</p><p>Le consensus ISHLT 2021 distingue l’orientation vers un centre, précoce, et l’inscription sur liste, réservée à une maladie qui progresse malgré le traitement.</p><table class="t"><tr><th>Étape</th><th>Critères pour une PID fibrosante</th></tr><tr><td>Orientation</td><td>Dès le diagnostic d’une UIP histologique ou d’un aspect UIP certain ou probable, même si un traitement débute ; toute fibrose avec CVF inférieure à 80 % ou DLCO inférieure à 40 % ; en deux ans, baisse relative de la CVF d’au moins 10 %, de la DLCO d’au moins 15 %, ou de la CVF d’au moins 5 % avec aggravation des symptômes ou de l’imagerie ; tout besoin d’oxygène, même à l’effort ; connectivite ou forme familiale</td></tr><tr><td>Inscription</td><td>En six mois malgré le traitement : baisse absolue de la CVF de plus de 10 %, de la DLCO de plus de 10 %, ou de la CVF de plus de 5 % avec progression radiologique ; SpO₂ inférieure à 88 % ou perte de plus de 50 m au test de marche ; hypertension pulmonaire ; hospitalisation pour déclin respiratoire, pneumothorax ou exacerbation</td></tr></table><p class="lab">Mécanisme</p><p>Le remplacement du poumon fibreux supprime le défaut d’échange gazeux ; l’immunosuppression à vie expose aux infections, au rejet chronique et aux cancers.</p><p class="lab">Conséquence clinique</p><p>L’évaluation prend des mois ; une orientation précoce évite qu’une exacerbation rende le patient inéligible. En Suisse, les transplantations pulmonaires sont réalisées dans des centres universitaires.</p><div class="key"><b>Limite.</b> L’âge biologique, les comorbidités, la fragilité et les télomèropathies modifient l’éligibilité ; la décision appartient au centre.</div><p class="src">Référence : <a href="https://doi.org/10.1016/j.healun.2021.07.005" target="_blank" rel="noopener">Leard et al., consensus ISHLT, 2021, tableau 3</a>.</p></template>
<template data-pop="j84-pins" data-title="Pneumopathie interstitielle non spécifique"><p class="lab">Définition</p><p>La PINS est une atteinte interstitielle homogène dans le temps, cellulaire ou fibrosante. En TDM, elle donne un verre dépoli et des réticulations basales et symétriques, souvent avec une épargne de la zone immédiatement sous-pleurale.</p><p class="lab">Mécanisme</p><p>Une agression unique ou continue, souvent auto-immune, enflamme toutes les parois au même stade ; la fibrose apparaît secondairement.</p><p class="lab">Conséquence clinique</p><p>La PINS impose de rechercher une connectivite, une pneumopathie d’hypersensibilité ou un médicament. La forme cellulaire répond bien aux corticoïdes et aux immunosuppresseurs ; la forme fibrosante répond moins et peut évoluer en FPP.</p><div class="key"><b>Limite.</b> La PINS idiopathique est rare : elle n’est retenue qu’après discussion multidisciplinaire et suivi.</div></template>
<template data-pop="j84-fpp" data-title="Fibrose pulmonaire progressive : critères 2022"><p class="lab">Définition</p><p>Chez un patient atteint d’une PID fibrosante autre que la FPI, la FPP exige au moins deux des trois critères suivants au cours de l’année écoulée, sans autre explication.</p><table class="t"><tr><th>Domaine</th><th>Critère</th></tr><tr><td>Symptômes</td><td>Aggravation des symptômes respiratoires</td></tr><tr><td>Fonction</td><td>Baisse absolue de la CVF d’au moins 5 % de la valeur prédite, ou de la DLCO corrigée pour l’hémoglobine d’au moins 10 %</td></tr><tr><td>Imagerie</td><td>Bronchiectasies de traction plus étendues ; nouveau verre dépoli avec bronchiectasies de traction ; réticulations nouvelles, plus étendues ou plus grossières ; rayon de miel nouveau ou étendu ; perte de volume lobaire accrue</td></tr></table><p class="lab">Mécanisme</p><p>Au-delà de leur cause, ces maladies partagent une voie finale de fibrogenèse autonome comparable à celle de la FPI.</p><p class="lab">Conséquence clinique</p><p>La FPP justifie un antifibrosant (recommandation conditionnelle pour le nintédanib) en plus du traitement de la cause.</p><div class="key"><b>Limite.</b> La FPP décrit un comportement évolutif, non un diagnostic ; une insuffisance cardiaque, une infection ou une embolie doivent être exclues avant de la retenir.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022, tableau 4</a>.</p></template>
<template data-pop="j84-inbuild" data-title="Essai INBUILD"><p class="lab">Définition</p><p>Essai randomisé de 663 patients atteints de PID fibrosante progressive autre que la FPI : pneumopathie d’hypersensibilité, connectivites, PINS et PID inclassables notamment.</p><p class="lab">Résultat</p><p>Le déclin annuel de la CVF était de 80,8 mL sous nintédanib contre 187,8 mL sous placebo, avec un bénéfice comparable en présence ou en l’absence d’aspect UIP.</p><p class="lab">Conséquence clinique</p><p>L’essai a fondé le concept de phénotype fibrosant progressif et l’indication du nintédanib dans la FPP.</p><div class="key"><b>Limite.</b> Ses critères de progression diffèrent légèrement de la définition de 2022 ; la décision individuelle reste prise en discussion multidisciplinaire.</div><p class="src">Référence : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1908681" target="_blank" rel="noopener">Flaherty et al., 2019</a>.</p></template>
<template data-pop="j84-gap" data-title="Indice GAP"><p class="lab">Définition</p><p>L’indice attribue des points au sexe (homme 1), à l’âge (61 à 65 ans 1, plus de 65 ans 2), à la CVF (50 à 75 % 1, moins de 50 % 2) et à la DLCO (36 à 55 % 1, 35 % ou moins 2, mesure impossible 3). Le stade I correspond à 0 à 3 points, le stade II à 4 ou 5, le stade III à 6 à 8.</p><p class="lab">Mécanisme</p><p>Il combine l’âge et la sévérité fonctionnelle, deux déterminants indépendants de la mortalité.</p><p class="lab">Conséquence clinique</p><p>La mortalité à un an atteint 5,6 %, 16,2 % et 39,2 % aux stades I, II et III. Un homme de 72 ans avec une CVF à 65 % et une DLCO à 40 % totalise 1 + 2 + 1 + 1 = 5 points : stade II.</p><div class="key"><b>Limite.</b> L’indice a été établi avant les antifibrosants, sur des cohortes nord-américaines ; il décrit des groupes, non un individu.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/22586007/" target="_blank" rel="noopener">Ley et al., 2012</a>.</p></template>
<template data-pop="j84-immunosuppresseurs" data-title="Immunosuppresseurs dans les PID inflammatoires"><p class="lab">Mécanisme</p><p>Le mycophénolate inhibe la synthèse des purines dans les lymphocytes ; le rituximab détruit les lymphocytes B porteurs du CD20 ; le cyclophosphamide est un agent alkylant ; le tocilizumab bloque le récepteur de l’interleukine 6.</p><p class="lab">Place</p><p>La recommandation ERS/EULAR 2025 les module selon la connectivite. Dans la sclérodermie, elle suggère le mycophénolate, éventuellement associé au nintédanib. Dans les myopathies inflammatoires, elle recommande une immunosuppression et suggère des associations comprenant les glucocorticoïdes. Dans toute connectivite avec FPP, elle suggère d’ajouter le nintédanib.</p><p class="lab">Surveillance</p><p>Numération sanguine, fonction hépatique, prévention des infections (vaccinations, prophylaxie de la pneumocystose selon le schéma) et contraception pour les molécules tératogènes.</p><div class="key"><b>Limite.</b> Ces molécules sont nuisibles dans la FPI ; leur prescription exige un diagnostic de PID inflammatoire posé en discussion multidisciplinaire.</div><p class="src">Référence : <a href="https://doi.org/10.1016/j.ard.2025.08.021" target="_blank" rel="noopener">Antoniou et al., ERS/EULAR 2025</a>.</p></template>
<template data-pop="j84-corticoides" data-title="Glucocorticoïdes dans les PID"><p class="lab">Mécanisme</p><p>Les glucocorticoïdes inhibent la transcription des cytokines inflammatoires et le recrutement des lymphocytes ; ils n’agissent pas sur une fibrogenèse établie.</p><p class="lab">Place</p><p>Ils sont efficaces dans la pneumopathie organisée, la PINS cellulaire, certaines pneumopathies médicamenteuses ou d’hypersensibilité ; ils sont employés à forte dose dans l’exacerbation aiguë de FPI sur avis d’experts.</p><p class="lab">Effets indésirables</p><p>Diabète, ostéoporose, myopathie, infections et troubles de l’humeur ; une prévention de l’ostéoporose accompagne tout traitement prolongé.</p><div class="key"><b>Limite.</b> Dans la FPI, la corticothérapie au long cours est proscrite depuis PANTHER-IPF.</div></template>
<template data-pop="j84-interactions" data-title="Interactions des antifibrosants"><p class="lab">Pirfénidone</p><p>Elle est métabolisée surtout par le CYP1A2. La fluvoxamine multiplie environ par quatre son exposition : l’association est contre-indiquée. Avec la ciprofloxacine à 750 mg deux fois par jour, la pirfénidone est réduite à 534 mg trois fois par jour (résumé européen). Le tabac, inducteur du CYP1A2, réduit l’exposition : l’arrêt est encouragé, sans augmenter la dose.</p><p class="lab">Nintédanib</p><p>Il est substrat de la glycoprotéine P. Les inhibiteurs puissants (kétoconazole, érythromycine, ciclosporine) augmentent son exposition et imposent de surveiller la tolérance ; les inducteurs (rifampicine, carbamazépine, phénytoïne, millepertuis) la diminuent et font chercher une alternative. Les anticoagulants majorent le risque hémorragique.</p><p class="lab">Nérandomilast</p><p>Il est substrat du CYP3A : l’itraconazole multiplie par 2,2 son exposition selon le résumé européen. La pirfénidone la réduit d’environ moitié.</p><p class="lab">Conséquence clinique</p><p>Chaque nouvelle prescription chez un patient sous antifibrosant est vérifiée. Une diarrhée ou des vomissements compromettent l’efficacité d’une contraception orale.</p><div class="key"><b>Limite.</b> Ces données proviennent des résumés européens et de l’étiquetage américain ; l’information professionnelle suisse n’a pas pu être lue.</div><p class="src">Références : <a href="https://www.medicines.org.uk/emc/product/7939/smpc" target="_blank" rel="noopener">Esbriet</a> ; <a href="https://www.medicines.org.uk/emc/product/7705/smpc" target="_blank" rel="noopener">Ofev</a> ; <a href="https://www.ema.europa.eu/en/medicines/human/EPAR/jascayd" target="_blank" rel="noopener">Jascayd</a>.</p></template>
<template data-pop="pareto-j84-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j84-0,j84-1,j84-2,j84-3,j84-4,j84-5,j84-6"></p><ul><li>Une PID atteint la paroi alvéolaire : dyspnée d’effort, toux sèche, trouble restrictif et DLCO basse.</li><li>La FPI est une fibrose chronique de cause inconnue, après 60 ans, d’aspect UIP ; son diagnostic est d’exclusion.</li><li>Sans traitement, la CVF baisse d’environ 200 mL par an ; l’évolution est hétérogène et ponctuée d’exacerbations.</li><li>Le mécanisme est une réparation aberrante de micro-lésions épithéliales, non une inflammation ; MUC5B et les télomères prédisposent.</li><li>Médicaments, expositions, antigènes et connectivite sont recherchés avant toute conclusion.</li><li>Crépitants « velcro » des bases, hippocratisme et désaturation d’effort sont les signes clés.</li></ul></template>
<template data-pop="pareto-j84-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j84-7"></p><ul><li>La TDM en haute résolution se lit en quatre catégories : UIP, UIP probable, indéterminée, diagnostic alternatif.</li><li>Un aspect UIP, ou UIP probable compatible, sans cause permet de retenir une FPI sans biopsie après discussion multidisciplinaire.</li><li>Lavage et biopsie ne se justifient que si leur résultat peut changer la décision.</li><li>Insuffisance cardiaque, infection, lymphangite et hémorragie alvéolaire sont éliminées d’abord.</li><li>UIP ne signifie pas FPI : polyarthrite rhumatoïde, hypersensibilité et asbestose l’imitent.</li></ul></template>
<template data-pop="pareto-j84-tt" data-title="Pareto — Urgences et traitements"><p class="ratio" data-cover="j84-8,j84-9,j84-10"></p><ul><li>Exacerbation aiguë : aggravation en moins d’un mois avec opacités nouvelles ; près de la moitié des patients hospitalisés en meurent.</li><li>Antifibrosant dès le diagnostic de FPI : nintédanib ou pirfénidone ; nérandomilast autorisé aux États-Unis et dans l’Union européenne.</li><li>Oxygène, réhabilitation, vaccinations, arrêt du tabac, orientation précoce vers la transplantation.</li><li>Ni corticoïdes au long cours, ni triple association, ni warfarine sans indication.</li><li>Hors FPI, la cause est traitée ; une progression (deux critères sur trois en un an) appelle un antifibrosant ajouté.</li></ul></template>
<template data-pop="pareto-j84-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="j84-11,j84-12,j84-13"></p><ul><li>CVF, DLCO et test de marche tous les trois à six mois ; une baisse de 5 à 10 % de la CVF signale une progression.</li><li>Indice GAP : mortalité à un an de 5,6 %, 16,2 % et 39,2 %.</li><li>Soins palliatifs précoces et directives anticipées avant toute exacerbation.</li><li>Nintédanib contre-indiqué pendant la grossesse ; adaptation hépatique et rénale des antifibrosants.</li><li>FPI : exclusion des causes et aspect UIP, ou UIP probable compatible, ou concordance avec l’histologie.</li></ul></template>
<template data-pop="pareto-j84-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j84-e-1,j84-e-2,j84-e-3"></p><ul><li>Standard diagnostique : discussion multidisciplinaire ; référence lésionnelle : biopsie chirurgicale.</li><li>TDM en haute résolution avec coupes en expiration et en décubitus ventral.</li><li>Trouble restrictif, rapport VEMS/CVF normal, DLCO abaissée précocement ; piège de l’emphysème associé.</li><li>Sérologie : anticorps antinucléaires, facteur rhumatoïde, anti-CCP, panel de myosite selon la clinique.</li><li>Devant un même aspect, le contexte tranche entre FPI, connectivite, hypersensibilité et asbestose.</li></ul></template>
<template data-pop="pareto-j84-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j84-p-1,j84-p-2,j84-p-3,j84-p-4"></p><ul><li>Phénotype fibrosant : antifibrosant ; phénotype inflammatoire : immunosuppresseur ; souvent les deux.</li><li>Nintédanib 150 mg deux fois par jour ; pirfénidone 801 mg trois fois par jour après titration ; prise au cours des repas.</li><li>Fluvoxamine contre-indiquée avec la pirfénidone ; glycoprotéine P et anticoagulants avec le nintédanib.</li><li>Transaminases, poids et tolérance digestive sont surveillés ; la dose est réduite plutôt qu’arrêtée.</li><li>Corticoïdes au long cours, triple association, warfarine et cyclophosphamide dans l’exacerbation sont à éviter.</li></ul></template>
