<h1>Pneumopathies interstitielles diffuses</h1><span class="status">Adulte · fibrose pulmonaire idiopathique au premier plan · référentiels ATS/ERS/JRS/ALAT 2022 et ERS/EULAR 2025 · état au 08.10.2026</span></div>

<section class="ilot" id="j84-0"><h2><span class="n">0</span>Question clinique</h2><p>Un homme de 71 ans, ancien fumeur, s’essouffle de plus en plus à l’effort depuis dix-huit mois et tousse sec. Deux inhalateurs n’ont rien changé. Des crépitants fins et secs occupent les deux bases. <b>Chez un adulte de plus de 60 ans, ce signe impose de rechercher une pneumopathie interstitielle fibrosante avant de conclure à une bronchopathie ou à une insuffisance cardiaque.</b></p><p>Les pneumopathies interstitielles diffuses (PID) atteignent la paroi alvéolaire, là où l’oxygène passe dans le sang. Leur traitement dépend d’une question : la fibrose est-elle idiopathique, secondaire à une cause qu’il faut supprimer, ou inflammatoire et sensible aux immunosuppresseurs ? La fibrose pulmonaire idiopathique (FPI) en est la forme la plus fréquente et la plus grave.</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="j84-interstitium">L’interstitium pulmonaire (contenu et raison de l’essoufflement)</button> ; <button class="w" data-justification="1" data-k="j84-velcro">les crépitants « velcro » (mécanisme et valeur diagnostique)</button>.</div></section>
<section class="ilot" id="j84-1"><h2><span class="n">1</span>Définitions et classification</h2><p>Une PID est une maladie dont la lésion dominante siège dans l’interstitium, tissu conjonctif qui sépare l’épithélium alvéolaire de l’endothélium capillaire. Inflammation ou fibrose épaississent cette cloison et rigidifient le poumon. Le clinicien distingue plusieurs familles, car chacune appelle une conduite propre : PID de cause connue (médicaments, expositions, connectivites), granulomatoses (sarcoïdose, pneumopathie d’hypersensibilité), pneumopathies interstitielles idiopathiques et formes rares (lymphangioléiomyomatose, histiocytose).</p><p>La <button class="w" data-justification="1" data-k="j84-classification">classification ATS/ERS 2013 des pneumopathies interstitielles idiopathiques</button> place en tête la FPI : pneumopathie fibrosante chronique et progressive, de cause inconnue, limitée au poumon et associée à l’aspect de <button class="w" data-justification="1" data-k="j84-tdm-uip">pneumopathie interstitielle commune, dite UIP (catégories tomodensitométriques)</button>. La classification distingue six entités majeures, réparties en trois familles, et deux entités rares.</p><table class="t"><tr><th>Famille</th><th>Entités</th></tr><tr><td>Fibrosantes chroniques</td><td>FPI ; PINS idiopathique</td></tr><tr><td>Liées au tabac</td><td>Bronchiolite respiratoire avec PID ; pneumopathie interstitielle desquamative</td></tr><tr><td>Aiguës ou subaiguës</td><td>Pneumopathie organisée cryptogénique ; pneumopathie interstitielle aiguë</td></tr><tr><td>Rares</td><td>Pneumopathie interstitielle lymphoïde idiopathique ; fibroélastose pleuroparenchymateuse idiopathique</td></tr></table><p>Une entité n’est dite idiopathique qu’après exclusion des causes : la même lésion peut compliquer une connectivite ou un médicament. Les fibroses d’origine externe (pneumopathie d’hypersensibilité, pneumoconioses, fibrose post-radique) et la sarcoïdose font l’objet d’autres cours.</p><div class="key"><b>À retenir.</b> « Interstitiel » désigne un siège lésionnel, non une maladie. Le clinicien passe du syndrome à l’entité, car FPI, PINS d’une connectivite et pneumopathie d’hypersensibilité ne se traitent pas de la même manière.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5803655/" target="_blank" rel="noopener">Travis et al., classification ATS/ERS, 2013, tableaux 1 et 2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., recommandation ATS/ERS/JRS/ALAT, 2022</a>.</p></section>
<section class="ilot" id="j84-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2><p>La FPI est rare : en Europe, son incidence varie de 0,09 à 0,49 pour 10 000 habitants par an et sa prévalence de 0,33 à 2,51 pour 10 000 (Maher, 2021). Elle frappe surtout l’homme de plus de 60 ans, souvent ancien fumeur. Aucune incidence suisse publiée n’a été identifiée.</p><p>Sans traitement, la capacité vitale forcée (CVF) perd environ 200 mL par an : de 207 à 240 mL en 52 semaines dans les groupes placebo des deux essais <button class="w" data-justification="1" data-k="j84-d-nintedanib">INPULSIS (nintédanib)</button>. L’évolution est hétérogène : certains patients restent stables des années, d’autres déclinent vite, et une <button class="w" data-justification="1" data-k="j84-exacerbation">exacerbation aiguë (définition et pronostic)</button> peut rompre une évolution lente. Les PID des connectivites touchent des patients plus jeunes, plus souvent des femmes ; une partie d’entre elles progresse malgré le traitement : c’est la fibrose pulmonaire progressive (FPP).</p><div class="key"><b>À retenir.</b> La FPI est rare mais grave ; l’hétérogénéité de son évolution impose de mesurer régulièrement la fonction respiratoire plutôt que d’annoncer d’emblée un pronostic.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8261998/" target="_blank" rel="noopener">Maher et al., incidence et prévalence mondiales, 2021</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1402584" target="_blank" rel="noopener">Richeldi et al., essais INPULSIS, 2014</a>.</p></section>
<section class="ilot" id="j84-3"><h2><span class="n">3</span>De la micro-lésion alvéolaire à la fibrose</h2><p>La paroi alvéolaire normale est extrêmement fine. Une lésion banale y guérit sans cicatrice : les pneumocytes de type II prolifèrent, se différencient en type I, puis la matrice provisoire est résorbée.</p><p>Dans la FPI, ce n’est plus l’inflammation chronique qui domine mais une <button class="w" data-justification="1" data-k="j84-reparation">réparation aberrante après des micro-lésions épithéliales répétées (séquence cellulaire)</button>. Un épithélium vieilli, agressé par le tabac, les poussières ou le reflux et prédisposé par le <button class="w" data-justification="1" data-k="j84-muc5b">variant de MUC5B</button> ou une <button class="w" data-justification="1" data-k="j84-telomeres">télomèropathie</button>, ne se régénère plus. Il libère du TGF-β, qui transforme les fibroblastes en myofibroblastes ; ceux-ci forment des <button class="w" data-justification="1" data-k="j84-foyers">foyers fibroblastiques (lésion active)</button> et déposent un collagène rigide. La matrice durcie active à son tour les fibroblastes : la fibrose devient autonome.</p><p>Les alvéoles se rétractent, les bronchioles se dilatent par traction, puis des kystes se groupent en rayon de miel. La paroi épaissie et la perte de capillaires réduisent le transfert des gaz ; la rigidité accroît le travail inspiratoire. <b>Dyspnée, désaturation d’effort et toux découlent de ces deux conséquences.</b></p><div class="key"><b>Conséquence thérapeutique.</b> Une fibrose née d’une réparation aberrante ne répond pas aux corticoïdes : c’est la raison de l’échec de l’<button class="w" data-justification="1" data-k="j84-panther">essai PANTHER-IPF (immunosuppression nuisible)</button> et de l’efficacité des antifibrosants.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1013660" target="_blank" rel="noopener">Seibold et al., variant de MUC5B, 2011</a>.</p></section>
<section class="ilot" id="j84-4"><h2><span class="n">4</span>Causes à rechercher et facteurs de risque</h2><p>La FPI est un diagnostic d’exclusion, et cette exclusion soigne : retirer un médicament toxique ou un antigène inhalé peut stabiliser une fibrose qui, attribuée à tort à la FPI, aurait progressé. Le tableau relie chaque cause à la mesure qu’elle commande.</p><table class="t"><tr><th>Cause</th><th>Exemples</th><th>Conséquence</th></tr><tr><td><button class="w" data-justification="1" data-k="j84-medicaments">Médicaments pneumotoxiques</button></td><td>Amiodarone, méthotrexate, nitrofurantoïne, bléomycine, inhibiteurs de points de contrôle immunitaire</td><td>Arrêt ; corticoïdes selon le cas</td></tr><tr><td><button class="w" data-justification="1" data-k="j84-connectivites">Connectivites</button></td><td>Sclérodermie systémique, polyarthrite rhumatoïde, myopathies inflammatoires, Gougerot-Sjögren</td><td>Avis rhumatologique, immunosuppression</td></tr><tr><td><button class="w" data-justification="1" data-k="j84-hypersensibilite">Antigènes inhalés</button></td><td>Oiseaux, duvet, moisissures, foin moisi</td><td>Éviction antigénique</td></tr><tr><td>Poussières minérales</td><td>Amiante, silice, métaux durs</td><td>Déclaration à la Suva, protection des collègues</td></tr><tr><td>Radiothérapie thoracique</td><td>Sein, poumon, lymphome</td><td>Fibrose limitée au champ d’irradiation ; la chronologie oriente</td></tr></table><p>Une femme de 58 ans traitée depuis des années par nitrofurantoïne pour des cystites présente une PID : l’arrêt du médicament précède toute autre décision. Chez un homme âgé sans exposition ni signe systémique, la FPI devient l’hypothèse principale. Ses facteurs de risque sont l’âge, le sexe masculin, le tabac, les poussières de bois ou de métaux, le reflux et une fibrose familiale ; leur absence n’exclut rien.</p><div class="key"><b>À retenir.</b> Toute PID impose l’inventaire écrit des médicaments, des expositions et des signes de connectivite, sur lequel s’appuie la discussion multidisciplinaire.</div><p class="src">Références : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., diagnostic de la FPI, ATS/ERS/JRS/ALAT 2018</a> ; <a href="https://www.pneumotox.com" target="_blank" rel="noopener">Pneumotox, base de données des pneumopathies médicamenteuses</a>.</p></section>
<section class="ilot" id="j84-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>La <button class="w" data-justification="1" data-k="j84-dyspnee">dyspnée d’effort progressive (mécanisme et quantification)</button> est le symptôme cardinal ; elle s’installe en quelques mois et passe souvent pour un effet de l’âge. Le médecin la quantifie par l’échelle mMRC et par une activité concrète, comme le nombre d’étages montés sans arrêt. La <button class="w" data-justification="1" data-k="j84-toux">toux sèche</button> touche la majorité des patients.</p><p>L’anamnèse étiologique couvre les médicaments sur plusieurs années, le parcours professionnel, les oiseaux et le duvet, l’humidité du logement, une radiothérapie, une fibrose ou une cirrhose familiale. Elle recherche les <button class="w" data-justification="1" data-k="j84-signes-systemiques">signes de connectivite</button>, qui orientent vers une PID secondaire. Une découverte fortuite sur un scanner coronarien ou abdominal, ou une exacerbation inaugurale qui simule une pneumonie, sont des formes trompeuses.</p><div class="trap"><span class="k">Erreur fréquente</span> Le patient reçoit des mois d’inhalateurs pour une « bronchite » ou un « asthme tardif », sans spirométrie ni auscultation attentive des bases. Le retard diagnostique de la FPI se compte encore souvent en années.</div><div class="key"><b>À retenir.</b> L’interrogatoire date les symptômes, quantifie la dyspnée et dresse l’inventaire des causes.</div></section>
<section class="ilot" id="j84-6"><h2><span class="n">6</span>Examiner pour reconnaître</h2><p>Le médecin mesure la fréquence respiratoire, la SpO₂ au repos puis après un effort simple, et le poids, car l’amaigrissement aggrave le pronostic et complique les antifibrosants. Des <button class="w" data-justification="1" data-k="j84-velcro">crépitants fins, secs, télé-inspiratoires et basaux (« velcro »)</button> existent chez la grande majorité des patients atteints de FPI. Une <button class="w" data-justification="1" data-k="j84-desaturation">désaturation d’effort</button> précède souvent l’hypoxémie de repos. Un <button class="w" data-justification="1" data-k="j84-hippocratisme">hippocratisme digital</button> s’observe chez une partie des patients. Un éclat du deuxième bruit et des œdèmes signalent une hypertension pulmonaire ; une sclérodactylie, des papules de Gottron ou des synovites, une connectivite.</p><p>Des crépitants bilatéraux sans fièvre ni surcharge hydrique justifient une tomodensitométrie (TDM) thoracique en haute résolution. Des sibilants, rares dans la FPI, font au contraire chercher une bronchiolite ou une pneumopathie d’hypersensibilité.</p><div class="key"><b>À retenir.</b> Les crépitants « velcro » conduisent à l’imagerie ; l’examen extrapulmonaire conduit à la cause.</div><p class="src">Références : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., 2018</a> ; <a href="https://doi.org/10.1159/000464332" target="_blank" rel="noopener">Funke-Chambour et al., prise de position du groupe de travail de la Société suisse de pneumologie sur la FPI, Respiration 2017</a>.</p><button class="pareto-btn ui" data-k="pareto-j84-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
