<template data-pop="j84-interstitium" data-title="L’interstitium pulmonaire"><p class="lab">Définition</p><p>L’interstitium est le tissu de soutien du poumon : cloison alvéolaire avec sa membrane basale, ses fibres élastiques et ses capillaires, et gaines conjonctives des bronches, des vaisseaux et des septums interlobulaires.</p><p class="lab">Mécanisme</p><p>Là où l’air et le sang se touchent, l’interstitium se réduit à quelques dixièmes de micromètre. Toute cellule inflammatoire, tout œdème ou tout collagène ajouté allonge la distance de diffusion et rigidifie la paroi.</p><p class="lab">Conséquence clinique</p><p>Une PID se manifeste par une dyspnée d’effort, une désaturation à la marche, un trouble restrictif et une baisse de la DLCO, parfois avant que la radiographie standard ne soit franchement anormale.</p><div class="key"><b>Limite.</b> Le terme est anatomique : de nombreuses PID atteignent aussi les alvéoles ou les bronchioles, et la TDM en haute résolution précise la distribution réelle.</div></template>
<template data-pop="j84-velcro" data-title="Crépitants « velcro »"><p class="lab">Définition</p><p>Ce sont des crépitants fins, secs et nombreux, entendus en fin d’inspiration, surtout aux bases et dans les régions axillaires. Leur timbre rappelle le décollement d’une bande auto-agrippante.</p><p class="lab">Mécanisme</p><p>Les petites voies aériennes des zones fibreuses restent fermées en fin d’expiration. Elles s’ouvrent brusquement en fin d’inspiration, lorsque la pression transpulmonaire devient suffisante ; chaque réouverture produit une brève onde sonore.</p><p class="lab">Conséquence clinique</p><p>Présents chez la grande majorité des patients atteints de FPI, ils peuvent précéder les anomalies radiographiques. Chez un adulte de plus de 60 ans, ils justifient une TDM en haute résolution.</p><div class="key"><b>Limite.</b> Les crépitants de l’œdème pulmonaire sont plus humides et régressent sous diurétique ; ceux d’une pneumonie sont localisés et fébriles. La sarcoïdose et la pneumopathie d’hypersensibilité donnent moins souvent ce signe.</div><p class="src">Référence : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., 2018</a>.</p></template>
<template data-pop="j84-classification" data-title="Classification ATS/ERS 2013 des pneumopathies interstitielles idiopathiques"><p class="lab">Définition</p><p>La classification distingue six entités majeures réparties en trois familles, deux entités rares et une catégorie inclassable.</p><table class="t"><tr><th>Famille</th><th>Entités</th></tr><tr><td>Fibrosantes chroniques</td><td>FPI ; PINS idiopathique</td></tr><tr><td>Liées au tabac</td><td>Bronchiolite respiratoire avec PID ; pneumopathie interstitielle desquamative</td></tr><tr><td>Aiguës ou subaiguës</td><td>Pneumopathie organisée cryptogénique ; pneumopathie interstitielle aiguë</td></tr><tr><td>Rares</td><td>Pneumopathie interstitielle lymphoïde ; fibroélastose pleuroparenchymateuse</td></tr></table><p class="lab">Mécanisme</p><p>Chaque famille correspond à un mode d’agression : réparation aberrante pour la FPI, réaction à la fumée pour les formes tabagiques, lésion alvéolaire aiguë ou bourgeons conjonctifs intra-alvéolaires pour les formes aiguës.</p><p class="lab">Conséquence clinique</p><p>Les formes tabagiques régressent souvent à l’arrêt du tabac, la pneumopathie organisée répond aux corticoïdes, la FPI relève d’un antifibrosant.</p><div class="key"><b>Limite.</b> Une entité n’est dite idiopathique qu’après exclusion des causes ; la même lésion peut être secondaire à une connectivite ou à un médicament.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/24032382/" target="_blank" rel="noopener">Travis et al., 2013</a>.</p></template>
<template data-pop="j84-tdm-uip" data-title="TDM en haute résolution : les quatre catégories"><p class="lab">Définition</p><p>La recommandation 2022 classe l’aspect tomodensitométrique selon la probabilité d’une UIP histologique.</p><table class="t"><tr><th>Catégorie</th><th>Aspect</th><th>Confiance pour une UIP</th></tr><tr><td>UIP</td><td>Prédominance sous-pleurale et basale ; rayon de miel, avec ou sans bronchiectasies de traction</td><td>Plus de 90 %</td></tr><tr><td>UIP probable</td><td>Même distribution ; réticulations et bronchiectasies de traction périphériques, sans rayon de miel</td><td>70 à 89 %</td></tr><tr><td>Indéterminée</td><td>Fibrose sans les signes typiques de l’UIP ni indice d’une autre cause</td><td>51 à 69 %</td></tr><tr><td>Diagnostic alternatif</td><td>Kystes, mosaïque, verre dépoli prédominant, nodules centrolobulaires, prédominance supérieure</td><td>50 % ou moins</td></tr></table><p class="lab">Mécanisme</p><p>Le rayon de miel traduit la destruction alvéolaire et sa transformation en kystes bronchiolisés ; les bronchiectasies de traction traduisent la rétraction du tissu fibreux, qui écarte les parois bronchiques.</p><p class="lab">Conséquence clinique</p><p>Un aspect UIP, ou UIP probable dans un contexte compatible, permet de retenir une FPI sans biopsie lorsque aucune cause n’est retrouvée.</p><div class="key"><b>Piège.</b> Les opacités déclives des bases disparaissent en décubitus ventral ; sans ces coupes, une hypoventilation peut passer pour une fibrose.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022, tableau 3</a>.</p></template>
<template data-pop="j84-fpi-def" data-title="Fibrose pulmonaire idiopathique"><p class="lab">Définition</p><p>La FPI est une pneumopathie interstitielle fibrosante chronique et progressive, de cause inconnue, limitée au poumon, survenant surtout après 60 ans et associée à l’aspect UIP.</p><p class="lab">Mécanisme</p><p>Des micro-lésions épithéliales répétées frappent un épithélium vieilli ou génétiquement prédisposé ; leur réparation aberrante par les myofibroblastes produit la fibrose.</p><p class="lab">Conséquence clinique</p><p>Le diagnostic repose sur l’exclusion des causes et la discussion multidisciplinaire ; le traitement repose sur les antifibrosants, non sur l’immunosuppression.</p><div class="key"><b>Limite.</b> « Idiopathique » n’exclut pas des facteurs de risque connus (tabac, poussières, génétique) : aucun d’eux ne suffit à expliquer la maladie.</div></template>
<template data-pop="j84-reparation" data-title="Réparation aberrante de l’épithélium alvéolaire"><p class="lab">Repère normal</p><p>Une alvéole lésée se répare par prolifération des pneumocytes de type II, différenciation en type I et résorption de la matrice provisoire.</p><p class="lab">Mécanisme</p><ol><li>Des micro-lésions répétées frappent un épithélium vieilli, aux télomères courts ou en stress du réticulum endoplasmique.</li><li>Les pneumocytes de type II, épuisés ou sénescents, ne régénèrent plus la surface et sécrètent des médiateurs profibrosants.</li><li>Le TGF-β activé transforme les fibroblastes en myofibroblastes, qui déposent du collagène.</li><li>La matrice rigide entretient l’activation des fibroblastes : la fibrose devient autonome.</li></ol><p class="lab">Conséquence clinique</p><p>La maladie progresse même après l’arrêt du tabac ; seuls les médicaments qui ciblent la fibrogenèse ralentissent son évolution.</p><div class="key"><b>Limite.</b> Ce modèle reste incomplet ; le rôle du reflux, des virus et du microbiome pulmonaire est discuté.</div></template>
<template data-pop="j84-foyers" data-title="Foyers fibroblastiques"><p class="lab">Définition</p><p>Ce sont de petits amas de fibroblastes et de myofibroblastes dans une matrice jeune, recouverts d’un épithélium hyperplasique, à la jonction entre poumon fibreux et poumon encore normal.</p><p class="lab">Mécanisme</p><p>Ils forment le front actif de la fibrose, où le collagène est produit. Leur juxtaposition à une fibrose ancienne crée l’hétérogénéité temporelle propre à l’UIP.</p><p class="lab">Conséquence clinique</p><p>Leur présence est un critère histologique de l’UIP ; leur abondance s’associe, dans plusieurs séries, à une évolution plus rapide.</p><div class="key"><b>Limite.</b> Ils ne sont pas spécifiques de la FPI et existent dans d’autres fibroses d’aspect UIP.</div></template>
<template data-pop="j84-muc5b" data-title="Le variant de MUC5B"><p class="lab">Définition</p><p>Le variant rs35705950 du promoteur de MUC5B est porté par environ un tiers des patients atteints de FPI.</p><p class="lab">Mécanisme</p><p>Il augmente l’expression de la mucine 5B dans les bronchioles distales et les kystes du rayon de miel. Un excès de mucus pourrait gêner la clairance et prolonger l’exposition de l’épithélium aux agressions.</p><p class="lab">Conséquence clinique</p><p>Il explique une part du risque familial et sporadique et s’associe aux anomalies interstitielles découvertes fortuitement chez des sujets asymptomatiques.</p><div class="key"><b>Limite.</b> Il n’est pas recherché en routine : il est fréquent dans la population générale et la plupart des porteurs ne développent jamais de fibrose.</div><p class="src">Référence : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1013660" target="_blank" rel="noopener">Seibold et al., 2011</a>.</p></template>
<template data-pop="j84-telomeres" data-title="Télomèropathies"><p class="lab">Définition</p><p>Les télomèropathies sont des maladies héréditaires dues à des variants des gènes de maintenance des télomères : TERT, TERC, RTEL1, PARN et d’autres.</p><p class="lab">Mécanisme</p><p>Des télomères courts déclenchent la sénescence des cellules à renouvellement rapide : les pneumocytes de type II ne régénèrent plus l’alvéole, la moelle produit moins de cellules sanguines, le foie peut évoluer vers la cirrhose.</p><p class="lab">Conséquence clinique</p><p>Une fibrose avant 50 ans, des cas familiaux, une cytopénie, une cirrhose inexpliquée ou une canitie très précoce font évoquer ce diagnostic et proposer un conseil génétique.</p><div class="key"><b>Limite.</b> Les variants de signification incertaine sont fréquents ; leur interprétation relève d’un centre spécialisé.</div></template>
<template data-pop="j84-genetique" data-title="Génétique des fibroses pulmonaires"><p class="lab">Définition</p><p>La fibrose pulmonaire est dite familiale lorsque au moins deux apparentés biologiques sont atteints. Les gènes impliqués concernent la mucine (MUC5B), les télomères (TERT, TERC, RTEL1, PARN) et le surfactant (SFTPC et d’autres).</p><p class="lab">Mécanisme</p><p>Les variants du surfactant provoquent un mauvais repliement protéique dans les pneumocytes de type II ; ceux des télomères en épuisent la capacité de division. Les deux voies aboutissent à une réparation épithéliale défaillante.</p><p class="lab">Conséquence clinique</p><p>Un variant pathogène identifié permet le conseil familial et adapte la transplantation, car les télomèropathies majorent la toxicité médullaire des immunosuppresseurs.</p><div class="key"><b>Limite.</b> Un test négatif n’exclut pas une prédisposition familiale : de nombreux gènes restent inconnus.</div></template>
<template data-pop="j84-panther" data-title="Essai PANTHER-IPF"><p class="lab">Définition</p><p>Essai randomisé publié en 2012 qui comparait l’association prednisone, azathioprine et N-acétylcystéine à un placebo dans la FPI légère à modérée.</p><p class="lab">Mécanisme</p><p>L’association reposait sur l’hypothèse d’une inflammation chronique à l’origine de la fibrose ; elle imposait l’immunosuppression sans cibler la réparation aberrante.</p><p class="lab">Résultat</p><p>Le bras de triple association a été interrompu : 8 décès contre 1 et 23 hospitalisations contre 7 sous placebo. Les corticoïdes au long cours et l’azathioprine sont donc proscrits comme traitement de fond de la FPI.</p><div class="key"><b>Limite.</b> L’essai ne concerne pas les PID inflammatoires (connectivites, PINS cellulaire, pneumopathie organisée), où corticoïdes et immunosuppresseurs gardent leur place.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/22607134/" target="_blank" rel="noopener">Raghu et al., 2012</a>.</p></template>
<template data-pop="j84-medicaments" data-title="Pneumopathies interstitielles médicamenteuses"><p class="lab">Définition</p><p>Plusieurs centaines de médicaments peuvent provoquer une PID. Les plus fréquents en pratique sont l’amiodarone, le méthotrexate, la nitrofurantoïne, la bléomycine et les inhibiteurs de points de contrôle immunitaire.</p><p class="lab">Mécanisme</p><p>Trois mécanismes dominent : toxicité directe (amiodarone, accumulée dans les macrophages et les pneumocytes), hypersensibilité (méthotrexate, nitrofurantoïne) et activation immunitaire (inhibiteurs de points de contrôle).</p><p class="lab">Conséquence clinique</p><p>Le délai varie de quelques jours à plusieurs années. L’arrêt du médicament est la mesure essentielle ; une corticothérapie se discute selon la gravité et le médicament.</p><div class="key"><b>Piège.</b> La nitrofurantoïne prise des années pour prévenir des cystites peut provoquer une fibrose chronique qui imite une FPI.</div><p class="src">Référence : <a href="https://www.pneumotox.com" target="_blank" rel="noopener">Pneumotox</a>.</p></template>
<template data-pop="j84-connectivites" data-title="PID des connectivites"><p class="lab">Définition</p><p>Les connectivites qui atteignent le plus souvent l’interstitium sont la sclérodermie systémique, la polyarthrite rhumatoïde, les myopathies inflammatoires, dont le syndrome des antisynthétases, et le syndrome de Gougerot-Sjögren.</p><table class="t"><tr><th>Maladie</th><th>Aspect fréquent</th><th>Indice</th></tr><tr><td>Sclérodermie systémique</td><td>PINS</td><td>Anti-topoisomérase I, Raynaud</td></tr><tr><td>Polyarthrite rhumatoïde</td><td>UIP ou PINS</td><td>Anti-CCP, homme fumeur</td></tr><tr><td>Myopathie inflammatoire</td><td>PINS, pneumopathie organisée</td><td>Anti-synthétases, anti-MDA5</td></tr><tr><td>Gougerot-Sjögren</td><td>PINS, pneumopathie lymphoïde</td><td>Sécheresse, anti-SSA</td></tr></table><p class="lab">Mécanisme</p><p>L’auto-immunité entretient une inflammation interstitielle qui guérit ou se fibrose selon la maladie et le terrain.</p><p class="lab">Conséquence clinique</p><p>La recommandation ERS/EULAR 2025 propose une TDM de dépistage chez tous les patients atteints de sclérodermie, de connectivite mixte ou de myopathie inflammatoire (hors myosite à inclusions), et chez ceux atteints de polyarthrite rhumatoïde ou de syndrome de Gougerot-Sjögren porteurs de facteurs de risque. Dans la sclérodermie, elle suggère le mycophénolate, le rituximab, le cyclophosphamide ou le nintédanib, recommande le tocilizumab dans la forme diffuse récente avec syndrome inflammatoire, et suggère l’association nintédanib et mycophénolate. L’essai SENSCIS a montré que le nintédanib ralentit le déclin de la CVF dans cette maladie.</p><div class="key"><b>Piège.</b> Une dermatomyosite à anticorps anti-MDA5 peut provoquer une PID rapidement progressive avec peu de signes musculaires ; elle exige une immunosuppression intensive urgente.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.ard.2025.08.021" target="_blank" rel="noopener">Antoniou et al., ERS/EULAR 2025</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1903076" target="_blank" rel="noopener">Distler et al., SENSCIS, 2019</a>.</p></template>
<template data-pop="j84-hypersensibilite" data-title="Pneumopathie d’hypersensibilité : renvoi"><p class="lab">Définition</p><p>La pneumopathie d’hypersensibilité est une PID immunologique due à l’inhalation répétée d’antigènes, souvent aviaires ou fongiques. Elle fait l’objet du cours J67.</p><p class="lab">Mécanisme</p><p>L’antigène inhalé atteint les bronchioles et les alvéoles ; la réponse lymphocytaire forme des granulomes mal limités et une bronchiolite, qui peuvent évoluer vers la fibrose.</p><p class="lab">Conséquence clinique</p><p>La TDM montre des nodules centrolobulaires, une mosaïque et un piégeage expiratoire ; le lavage montre souvent une lymphocytose. L’éviction de l’antigène est le traitement principal.</p><div class="key"><b>Piège.</b> L’antigène reste introuvable dans près de la moitié des cas ; une forme fibrosante sans exposition retrouvée peut alors passer pour une FPI.</div></template>
<template data-pop="j84-dyspnee" data-title="Dyspnée d’effort dans les PID"><p class="lab">Définition</p><p>La dyspnée est la perception d’un effort respiratoire excessif. L’échelle mMRC la gradue de 0 (essoufflement lors d’un effort intense seulement) à 4 (essoufflement à l’habillage).</p><p class="lab">Mécanisme</p><p>La baisse de compliance accroît le travail inspiratoire ; l’hypoxémie d’effort stimule les chémorécepteurs ; les récepteurs à l’étirement des zones fibreuses accélèrent la fréquence respiratoire.</p><p class="lab">Conséquence clinique</p><p>Une dyspnée qui progresse depuis des mois avec une spirométrie non obstructive impose de mesurer la DLCO et de rechercher une PID.</p><div class="key"><b>Limite.</b> Une dyspnée disproportionnée par rapport aux volumes fait chercher une hypertension pulmonaire, une anémie ou une cardiopathie.</div></template>
<template data-pop="j84-toux" data-title="Toux de la fibrose pulmonaire"><p class="lab">Définition</p><p>La toux sèche touche la majorité des patients atteints de FPI ; elle est souvent quinteuse, déclenchée par la parole ou l’effort.</p><p class="lab">Mécanisme</p><p>La distorsion mécanique des voies aériennes par la fibrose, la sensibilisation des afférences vagales et l’hypersécrétion de mucine distale l’entretiennent ; un reflux associé peut l’aggraver.</p><p class="lab">Conséquence clinique</p><p>La toux altère le sommeil et la vie sociale et constitue un facteur pronostique défavorable dans plusieurs cohortes. Les formes réfractaires relèvent d’opiacés à faible dose, dans une démarche palliative.</p><div class="key"><b>Limite.</b> Les antitussifs usuels sont souvent peu efficaces, et les antiacides ne sont pas recommandés dans le seul but d’améliorer la fonction respiratoire.</div></template>
<template data-pop="j84-signes-systemiques" data-title="Signes de connectivite à rechercher"><p class="lab">Définition</p><p>Le médecin recherche un phénomène de Raynaud, une sclérodactylie, des télangiectasies, des arthrites, une faiblesse musculaire proximale, des papules de Gottron, des « mains de mécanicien » et une sécheresse buccale ou oculaire.</p><p class="lab">Mécanisme</p><p>Ces signes traduisent l’atteinte vasculaire, cutanée, articulaire ou musculaire de la maladie auto-immune dont la PID est parfois la première manifestation.</p><p class="lab">Conséquence clinique</p><p>Un seul signe suffit à demander un avis rhumatologique et un bilan ciblé d’auto-anticorps, car le diagnostic change le traitement.</p><div class="key"><b>Limite.</b> Certains patients ont des signes et des auto-anticorps sans remplir les critères d’une connectivite ; ils sont suivis pour une évolution possible.</div></template>
<template data-pop="j84-desaturation" data-title="Désaturation d’effort et test de marche de six minutes"><p class="lab">Définition</p><p>Le test de marche de six minutes mesure la distance parcourue dans un couloir plat, sous enregistrement continu de la SpO₂ et de la fréquence cardiaque. Un sujet sain de 70 ans parcourt habituellement plus de 400 m sans désaturer.</p><p class="lab">Mécanisme</p><p>À l’effort, le temps de transit capillaire raccourcit et l’inégalité ventilation-perfusion s’accentue : la SpO₂ chute alors qu’elle était normale au repos.</p><p class="lab">Conséquence clinique</p><p>Une SpO₂ inférieure à 88 % pendant le test aggrave le pronostic, justifie une oxygénothérapie d’effort et constitue un critère ISHLT d’inscription en transplantation.</p><div class="key"><b>Limite.</b> Aux doigts froids, un signal de mauvaise qualité sous-estime la saturation ; un capteur frontal ou au lobe de l’oreille est alors préférable.</div></template>
<template data-pop="j84-hippocratisme" data-title="Hippocratisme digital"><p class="lab">Définition</p><p>L’hippocratisme est un bombement de l’extrémité des doigts avec perte de l’angle normal entre l’ongle et le repli unguéal. Le signe de Schamroth recherche la disparition de la fenêtre losangique entre deux ongles accolés.</p><p class="lab">Mécanisme</p><p>Selon l’hypothèse dominante, des mégacaryocytes et des amas plaquettaires échappent au filtre pulmonaire et libèrent des facteurs de croissance (PDGF, VEGF) dans la pulpe digitale.</p><p class="lab">Conséquence clinique</p><p>Il s’observe chez une partie des patients atteints de FPI, plus rarement dans la sarcoïdose et la pneumopathie d’hypersensibilité.</p><div class="key"><b>Piège.</b> Un hippocratisme récent chez un fumeur impose de rechercher un cancer bronchique, plus fréquent sur un poumon fibreux.</div></template>
<template data-pop="j84-serologie" data-title="Bilan d’auto-immunité devant une PID"><p class="lab">Définition</p><p>Le bilan initial comprend les anticorps antinucléaires, le facteur rhumatoïde et les anticorps anti-CCP. Selon la clinique, il s’étend aux anticorps anti-ENA, à un panel de myosite (anti-synthétases, anti-MDA5) et aux ANCA.</p><p class="lab">Mécanisme</p><p>Ces auto-anticorps témoignent d’une maladie auto-immune dont la PID est une manifestation, parfois inaugurale.</p><p class="lab">Conséquence clinique</p><p>Un résultat positif et concordant avec la clinique réoriente vers une PID de connectivite et vers l’immunosuppression.</p><div class="key"><b>Piège.</b> Un faible titre isolé d’anticorps antinucléaires est fréquent après 60 ans et n’exclut pas une FPI ; il ne compte que s’il s’accompagne d’un signe ou d’un aspect concordant.</div><p class="src">Référence : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., 2018</a>.</p></template>
<template data-pop="j84-dlco" data-title="Épreuves fonctionnelles : restriction et transfert"><p class="lab">Définition</p><p>La DLCO mesure le transfert du monoxyde de carbone de l’alvéole vers l’hémoglobine ; elle s’interprète par rapport à la LIN, après correction pour l’hémoglobine. Le KCO rapporte la DLCO au volume alvéolaire.</p><p class="lab">Mécanisme</p><p>La fibrose réduit la surface d’échange et la densité capillaire et épaissit la membrane : la DLCO baisse. La rétraction élastique réduit la CPT et la CVF, tandis que le rapport VEMS/CVF reste normal ou augmente.</p><p class="lab">Conséquence clinique</p><p>Une DLCO inférieure à 40 % de la valeur prédite traduit une maladie avancée. Une baisse absolue de CVF de 5 % ou de DLCO de 10 % en un an est un critère de progression.</p><div class="key"><b>Piège.</b> Une anémie abaisse la DLCO sans atteinte pulmonaire ; un tabagisme récent l’abaisse aussi, par le monoxyde de carbone déjà présent dans le sang.</div></template>
