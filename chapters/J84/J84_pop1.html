<template data-pop="j84-interstitium" data-title="L’interstitium pulmonaire"><p class="lab">Définition</p><p>L’interstitium est le tissu de soutien du poumon : cloison alvéolaire, avec sa membrane basale, ses fibres élastiques et ses capillaires, et gaines conjonctives des bronches, des vaisseaux et des septums.</p><p class="lab">Mécanisme et conséquence</p><p>Là où l’air touche le sang, il est extrêmement mince. Toute cellule inflammatoire, tout œdème ou tout collagène ajouté allonge la distance de diffusion et rigidifie la paroi : dyspnée d’effort, désaturation à la marche, trouble restrictif et DLCO basse en résultent, parfois avant toute anomalie radiographique.</p><div class="key"><b>Limite.</b> Le terme est anatomique : beaucoup de PID atteignent aussi les alvéoles ou les bronchioles.</div></template>
<template data-pop="j84-velcro" data-title="Crépitants « velcro »"><p class="lab">Définition</p><p>Crépitants fins, secs et nombreux, de fin d’inspiration, surtout basaux et axillaires ; leur timbre rappelle le décollement d’une bande auto-agrippante.</p><p class="lab">Mécanisme</p><p>Les petites voies aériennes des zones fibreuses, fermées en fin d’expiration, s’ouvrent brusquement lorsque la pression transpulmonaire devient suffisante ; chaque réouverture produit une brève onde sonore.</p><p class="lab">Conséquence clinique</p><p>Présents chez la grande majorité des patients atteints de FPI, parfois avant la radiographie, ils justifient une TDM en haute résolution après 60 ans.</p><div class="key"><b>Limite.</b> Les crépitants de l’œdème sont plus humides et régressent sous diurétique ; ceux d’une pneumonie sont localisés et fébriles.</div><p class="src">Référence : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., 2018</a>.</p></template>
<template data-pop="j84-classification" data-title="Classification ATS/ERS 2013 des pneumopathies interstitielles idiopathiques"><p>La révision ATS/ERS de 2013 complète la classification de 2002. Elle retient six entités majeures (FPI, PINS idiopathique, bronchiolite respiratoire avec PID, pneumopathie desquamative, pneumopathie organisée cryptogénique, pneumopathie interstitielle aiguë), deux entités rares (pneumopathie lymphoïde, fibroélastose pleuroparenchymateuse) et une catégorie inclassable.</p><p class="lab">Apports</p><p>La PINS y est mieux définie ; la bronchiolite respiratoire avec PID se diagnostique désormais le plus souvent sans biopsie chirurgicale ; l’évolution de la FPI et de la PINS est reconnue hétérogène. Une part notable des patients reste difficile à classer, souvent par mélange de lésions : la révision propose alors de les classer selon leur comportement évolutif.</p><div class="key"><b>Limite.</b> Le diagnostic reste multidisciplinaire ; l’histologie a perdu son statut de référence unique depuis 2002.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5803655/" target="_blank" rel="noopener">Travis et al., 2013</a>.</p></template>

ne pneumopathie d’hypersensibilité fibrosante peuvent le reproduire. Source : <a href="https://commons.wikimedia.org/wiki/File:CT_scan_in_usual_interstitial_pneumonia_(UIP).jpg" target="_blank" rel="noopener" data-reference-source="1">Yale Rosen from USA, Wikimedia Commons</a> ; <a href="https://creativecommons.org/licenses/by-sa/2.0" target="_blank" rel="noopener" data-reference-source="1">licence CC BY-SA 2.0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p>La recommandation 2022 classe l’aspect tomodensitométrique selon la probabilité d’une UIP histologique.</p><table class="t"><tr><th>Catégorie</th><th>Aspect</th><th>Confiance pour une UIP</th></tr><tr><td>UIP</td><td>Prédominance sous-pleurale et basale ; rayon de miel, avec ou sans bronchiectasies de traction</td><td>Plus de 90 %</td></tr><tr><td>UIP probable</td><td>Même distribution ; réticulations et bronchiectasies de traction périphériques, sans rayon de miel</td><td>70 à 89 %</td></tr><tr><td>Indéterminée</td><td>Fibrose sans les signes typiques de l’UIP ni indice d’une autre cause</td><td>51 à 69 %</td></tr><tr><td>Diagnostic alternatif</td><td>Kystes, mosaïque, verre dépoli prédominant, nodules centrolobulaires, prédominance supérieure</td><td>50 % ou moins</td></tr></table><p>Le rayon de miel traduit la transformation des alvéoles détruites en kystes bronchiolisés ; les bronchiectasies de traction, la rétraction du tissu fibreux qui écarte les parois bronchiques. Un aspect UIP, ou UIP probable dans un contexte compatible, permet de retenir une FPI sans biopsie si aucune cause n’est retrouvée.</p><div class="key"><b>Piège.</b> Sans coupes en décubitus ventral, une hypoventilation déclive des bases peut passer pour une fibrose.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022, tableau 3</a>.</p></template>
<template data-pop="j84-fpi-def" data-title="Fibrose pulmonaire idiopathique"><p>La FPI est une pneumopathie interstitielle fibrosante chronique et progressive, de cause inconnue, limitée au poumon, survenant surtout après 60 ans et associée à l’aspect UIP. Elle naît de la réparation aberrante de micro-lésions épithéliales répétées ; elle se traite par antifibrosant, non par immunosuppression.</p><div class="key"><b>Limite.</b> « Idiopathique » n’exclut pas des facteurs de risque (tabac, poussières, génétique) : aucun ne suffit à expliquer la maladie.</div></template>
<template data-pop="j84-reparation" data-title="Réparation aberrante de l’épithélium alvéolaire"><p class="lab">Séquence</p><ol><li>Des micro-lésions répétées frappent un épithélium vieilli, aux télomères courts ou en stress du réticulum endoplasmique.</li><li>Les pneumocytes de type II, épuisés ou sénescents, ne régénèrent plus la surface et sécrètent des médiateurs profibrosants.</li><li>Le TGF-β activé transforme les fibroblastes en myofibroblastes, qui déposent du collagène.</li><li>La matrice rigide entretient l’activation des fibroblastes : la fibrose devient autonome.</li></ol><p class="lab">Conséquence clinique</p><p>La maladie progresse même après l’arrêt du tabac ; seuls les médicaments qui ciblent la fibrogenèse la ralentissent.</p><div class="key"><b>Limite.</b> Le rôle du reflux, des virus et du microbiome pulmonaire reste discuté.</div></template>
<template data-pop="j84-foyers" data-title="Foyers fibroblastiques"><p>Ce sont de petits amas de fibroblastes et de myofibroblastes dans une matrice jeune, sous un épithélium hyperplasique, à la jonction du poumon fibreux et du poumon normal. Ils forment le front actif de la fibrose ; leur juxtaposition à une fibrose ancienne crée l’hétérogénéité temporelle de l’UIP, dont ils sont un critère histologique. Leur abondance s’associe à une évolution plus rapide.</p><div class="key"><b>Limite.</b> Ils existent aussi dans d’autres fibroses d’aspect UIP.</div></template>
<template data-pop="j84-muc5b" data-title="Le variant de MUC5B"><p>L’allèle mineur du variant rs35705950, situé dans le promoteur de MUC5B, a une fréquence de 38 % chez les patients atteints de FPI contre 9 % chez les témoins. Le risque de FPI est multiplié par 9,0 chez l’hétérozygote et par 21,8 chez l’homozygote. Le variant s’associe à une expression accrue de MUC5B dans le poumon, ce qui pourrait gêner la clairance bronchiolaire.</p><div class="key"><b>Limite.</b> Le variant est fréquent chez les témoins : sa présence isolée ne prédit pas la maladie chez un individu.</div><p class="src">Référence : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1013660" target="_blank" rel="noopener">Seibold et al., 2011</a>.</p></template>
<template data-pop="j84-telomeres" data-title="Télomèropathies"><p>Ces maladies héréditaires touchent les gènes de maintenance des télomères (TERT, TERC, RTEL1, PARN). Des télomères courts font entrer en sénescence les cellules à renouvellement rapide : pneumocytes de type II, moelle, foie. Une fibrose avant 50 ans, des cas familiaux, une cytopénie, une cirrhose inexpliquée ou une canitie très précoce font proposer un conseil génétique.</p><div class="key"><b>Limite.</b> Les variants de signification incertaine sont fréquents ; leur interprétation relève d’un centre spécialisé.</div></template>
<template data-pop="j84-genetique" data-title="Génétique des fibroses pulmonaires"><p>La fibrose est dite familiale lorsque plusieurs apparentés biologiques sont atteints ; la Société européenne de pneumologie (ERS) consacre une déclaration au séquençage génétique, au conseil et au dépistage des apparentés dans ces familles. Les gènes impliqués concernent la mucine (MUC5B), les télomères (TERT, TERC, RTEL1, PARN) et le surfactant (SFTPC et d’autres) ; tous aboutissent à une réparation épithéliale défaillante. Un variant pathogène permet le conseil familial et adapte la transplantation, car les télomèropathies majorent la toxicité médullaire des immunosuppresseurs.</p><div class="key"><b>Limite.</b> Un test négatif n’exclut pas une prédisposition : de nombreux gènes restent inconnus.</div><p class="src">Référence : <a href="https://doi.org/10.1183/13993003.01383-2022" target="_blank" rel="noopener">Borie et al., déclaration ERS sur la fibrose pulmonaire familiale, Eur Respir J 2023</a>.</p></template>
<template data-pop="j84-panther" data-title="Essai PANTHER-IPF"><p>Cet essai randomisé (2012) comparait prednisone, azathioprine et N-acétylcystéine à un placebo dans la FPI légère à modérée, sous l’hypothèse d’une inflammation causale. Le bras de triple association a été interrompu : 8 décès contre 1 et 23 hospitalisations contre 7. Corticoïdes au long cours et azathioprine sont depuis proscrits comme traitement de fond de la FPI.</p><div class="key"><b>Limite.</b> L’essai ne concerne pas les PID inflammatoires, où corticoïdes et immunosuppresseurs gardent leur place.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/22607134/" target="_blank" rel="noopener">Raghu et al., 2012</a>.</p></template>
<template data-pop="j84-medicaments" data-title="Pneumopathies interstitielles médicamenteuses"><p>Plusieurs centaines de médicaments peuvent provoquer une PID, par toxicité directe (amiodarone, accumulée dans les macrophages et les pneumocytes), hypersensibilité (méthotrexate, nitrofurantoïne) ou activation immunitaire (inhibiteurs de points de contrôle). Le délai va de quelques jours à plusieurs années. L’arrêt du médicament est la mesure essentielle ; une corticothérapie se discute selon la gravité.</p><div class="key"><b>Piège.</b> La nitrofurantoïne prise des années pour prévenir des cystites peut provoquer une fibrose qui imite une FPI.</div><p class="src">Référence : <a href="https://www.pneumotox.com" target="_blank" rel="noopener">Pneumotox</a>.</p></template>
<template data-pop="j84-connectivites" data-title="PID des connectivites"><p>Chaque connectivite a son aspect préférentiel et ses marqueurs ; le tableau les résume.</p><table class="t"><tr><th>Maladie</th><th>Aspect fréquent</th><th>Indice</th></tr><tr><td>Sclérodermie systémique</td><td>PINS</td><td>Anti-topoisomérase I, Raynaud</td></tr><tr><td>Polyarthrite rhumatoïde</td><td>UIP ou PINS</td><td>Anti-CCP, homme fumeur</td></tr><tr><td>Myopathie inflammatoire</td><td>PINS, pneumopathie organisée</td><td>Anti-synthétases, anti-MDA5</td></tr><tr><td>Gougerot-Sjögren</td><td>PINS, pneumopathie lymphoïde</td><td>Sécheresse, anti-SSA</td></tr></table><p class="lab">Recommandation ERS/EULAR 2025</p><p>Une TDM de dépistage est proposée à tous les patients atteints de sclérodermie, de connectivite mixte ou de myopathie inflammatoire (hors myosite à inclusions), et à ceux atteints de polyarthrite rhumatoïde ou de syndrome de Gougerot-Sjögren porteurs de facteurs de risque. Dans la sclérodermie, la recommandation suggère le mycophénolate, le rituximab, le cyclophosphamide, le nintédanib ou l’association nintédanib et mycophénolate, et recommande le tocilizumab dans la forme diffuse récente avec syndrome inflammatoire. L’essai SENSCIS a montré que le nintédanib ralentit le déclin de la CVF dans cette maladie.</p><div class="key"><b>Piège.</b> Une dermatomyosite à anti-MDA5 peut provoquer une PID rapidement progressive avec peu de signes musculaires ; elle exige une immunosuppression intensive urgente.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.ard.2025.08.021" target="_blank" rel="noopener">Antoniou et al., ERS/EULAR 2025</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1903076" target="_blank" rel="noopener">Distler et al., SENSCIS, 2019</a>.</p></template>
<template data-pop="j84-hypersensibilite" data-title="Pneumopathie d’hypersensibilité : renvoi"><p>Cette PID immunologique naît de l’inhalation répétée d’antigènes souvent aviaires ou fongiques. La réponse lymphocytaire forme des granulomes mal limités et une bronchiolite, qui peuvent se fibroser. La TDM montre des nodules centrolobulaires, une mosaïque et un piégeage expiratoire ; le lavage, une lymphocytose. L’éviction de l’antigène est le traitement principal.</p><div class="key"><b>Piège.</b> Lorsque l’antigène reste introuvable, une forme fibrosante peut passer pour une FPI ; l’anamnèse des expositions est donc reprise à chaque discussion multidisciplinaire.</div></template>
<template data-pop="j84-dyspnee" data-title="Dyspnée d’effort dans les PID"><p>L’échelle mMRC gradue la dyspnée de 0 (effort intense seulement) à 4 (habillage). Trois mécanismes l’expliquent : la baisse de compliance accroît le travail inspiratoire, l’hypoxémie d’effort stimule les chémorécepteurs, les récepteurs à l’étirement des zones fibreuses accélèrent la fréquence. Une dyspnée progressive avec une spirométrie non obstructive impose de mesurer la DLCO.</p><div class="key"><b>Limite.</b> Une dyspnée disproportionnée aux volumes fait chercher une hypertension pulmonaire, une anémie ou une cardiopathie.</div></template>
<template data-pop="j84-toux" data-title="Toux de la fibrose pulmonaire"><p>La toux sèche, souvent quinteuse, touche la majorité des patients atteints de FPI. La distorsion des voies aériennes par la fibrose, la sensibilisation des afférences vagales et l’hypersécrétion de mucine l’entretiennent ; un reflux peut l’aggraver. Elle altère le sommeil et constitue un facteur pronostique défavorable. Les formes réfractaires relèvent d’opiacés à faible dose, dans une démarche palliative.</p><div class="key"><b>Limite.</b> Les antitussifs usuels sont souvent peu efficaces.</div></template>
<template data-pop="j84-signes-systemiques" data-title="Signes de connectivite à rechercher"><p>Le médecin recherche un phénomène de Raynaud, une sclérodactylie, des télangiectasies, des arthrites, une faiblesse proximale, des papules de Gottron, des « mains de mécanicien » et une sécheresse buccale ou oculaire. Ces signes traduisent la maladie auto-immune dont la PID est parfois la première manifestation ; un seul suffit à demander un avis rhumatologique et des auto-anticorps ciblés.</p><div class="key"><b>Limite.</b> Certains patients ont des signes et des auto-anticorps sans remplir les critères d’une connectivite ; ils sont suivis.</div></template>
<template data-pop="j84-desaturation" data-title="Désaturation d’effort et test de marche de six minutes"><p>Le test mesure la distance parcourue en six minutes dans un couloir plat, avec enregistrement continu de la SpO₂. À l’effort, le temps de transit capillaire raccourcit et l’inégalité ventilation-perfusion s’accentue. Une SpO₂ inférieure à 88 % pendant le test est un critère ISHLT d’inscription en transplantation ; une SpO₂ de 88 % ou moins définissait la désaturation d’effort dans l’essai AmbOx sur l’oxygène ambulatoire.</p><div class="key"><b>Limite.</b> Aux doigts froids, le signal sous-estime la saturation ; un capteur frontal ou auriculaire est préférable.</div></template>
<template data-pop="j84-hippocratisme" data-title="Hippocratisme digital"><p>Bombement de l’extrémité des doigts avec perte de l’angle entre l’ongle et le repli unguéal ; le signe de Schamroth recherche la disparition de la fenêtre losangique entre deux ongles accolés. Selon l’hypothèse dominante, des amas plaquettaires échappés du filtre pulmonaire libèrent PDGF et VEGF dans la pulpe digitale. Il s’observe chez une partie des patients atteints de FPI.</p><div class="key"><b>Piège.</b> Un hippocratisme récent chez un fumeur fait rechercher un cancer bronchique, plus fréquent sur poumon fibreux.</div></template>
<template data-pop="j84-serologie" data-title="Bilan d’auto-immunité devant une PID"><p>Le bilan initial comprend les anticorps antinucléaires, le facteur rhumatoïde et les anti-CCP ; selon la clinique, il s’étend aux anti-ENA, à un panel de myosite (anti-synthétases, anti-MDA5) et aux ANCA. Un résultat positif et concordant réoriente vers une PID de connectivite et vers l’immunosuppression.</p><div class="key"><b>Piège.</b> Un faible titre isolé d’anticorps antinucléaires est fréquent après 60 ans et n’exclut pas une FPI.</div><p class="src">Référence : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., 2018</a>.</p></template>
<template data-pop="j84-dlco" data-title="Épreuves fonctionnelles : restriction et transfert"><p>La DLCO mesure le transfert du monoxyde de carbone vers l’hémoglobine ; elle se lit par rapport à la LIN, corrigée pour l’hémoglobine. Le KCO la rapporte au volume alvéolaire. La fibrose réduit la surface d’échange et épaissit la membrane, d’où une DLCO basse ; la rétraction élastique réduit la CPT et la CVF. Une DLCO inférieure à 40 % de la valeur prédite justifie, selon l’ISHLT, l’orientation vers un centre de transplantation ; une baisse absolue de CVF de 5 % ou de DLCO de 10 % en un an est un critère de progression.</p><div class="key"><b>Piège.</b> Une anémie ou un tabagisme récent abaissent la DLCO sans atteinte pulmonaire.</div></template>
