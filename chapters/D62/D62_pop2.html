<template data-pop="d62-compatibilite" data-title="Identité, anticorps et compatibilité"><p>Un produit destiné à une personne peut être incompatible avec une autre. Vérifier l’identité et la concordance documentaire est donc une étape de sécurité biologique. La procédure HUG 2025 précise les contrôles au lit, les informations du produit et le circuit de laboratoire.</p><p>Les anticorps dirigés contre les antigènes érythrocytaires peuvent détruire les cellules transfusées. Une réaction peut être immédiate ou retardée. La recherche d’anticorps, les tests de compatibilité et l’historique transfusionnel répondent à cette question ; les délais de validité et exceptions suivent la procédure locale.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></template>
<template data-pop="d62-phosphate" data-title="Ferinject et hypophosphatémie"><p>La <button class="w" data-k="d62-fi">FI</button> suisse de Ferinject décrit une hypophosphatémie, habituellement transitoire, et des cas symptomatiques avec ostéomalacie et fractures. Le risque mérite une attention particulière en cas de doses répétées élevées et de facteurs de risque.</p><p>Des douleurs osseuses ou articulaires doivent conduire à une évaluation. Chez les patients à risque recevant des traitements répétés, contrôler le phosphate selon la <button class="w" data-k="d62-fi">FI</button>. Une hypophosphatémie persistante impose de réévaluer le traitement. Ne pas attribuer automatiquement une fatigue persistante après fer à une anémie insuffisamment corrigée.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="d62-pcc" data-title="Octaplex : facteurs de coagulation, pas hémoglobine"><p>Octaplex apporte des facteurs du complexe prothrombinique. Sa <button class="w" data-k="d62-fi">FI</button> suisse de novembre 2021 précise des indications urgentes dans certains déficits acquis et des indications congénitales spécifiques. L’évaluation spécialisée, la réponse clinique et les contrôles de coagulation guident la dose.</p><p>Le produit contient de l’héparine et est contre-indiqué notamment en cas d’hypersensibilité à l’héparine ou d’antécédent de thrombocytopénie induite par héparine. Il ne contient pas d’antithrombine III et comporte des restrictions dans les situations exposant à son déficit. Il ne s’ajoute pas à toute D62.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a>.</p></div></template>
<template data-pop="d62-txa" data-title="Antifibrinolytique ne signifie pas traitement de tout saignement"><p>Le <button class="w" data-k="d62-txa">TXA</button> limite l’activation du plasminogène en plasmine et la dégradation de la fibrine. Ce mécanisme explique une possibilité d’action ; il ne démontre pas à lui seul un bénéfice clinique dans toutes les maladies.</p><p>Les directives trauma et postpartum soutiennent un usage précoce dans des populations précises, alors que <button class="w" data-k="d62-sources">ESGE</button> déconseille l’usage dans le saignement digestif haut non variqueux. La <button class="w" data-k="d62-fi">FI</button> exacte apporte les limites de voie, de rein, de thrombose et de convulsions. Un traitement doit satisfaire à la fois le contexte et la sécurité du produit.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a>.</p></div></template>
<template data-pop="d62-feroral" data-title="Fer oral : objectif et limites"><p>Le fer oral apporte un substrat à la production de nouvelles hématies en cas de carence. Il n’est pas un traitement immédiat du choc. L’efficacité dépend du diagnostic, de l’absorption, de la tolérance et de la persistance éventuelle de pertes.</p><p>La <button class="w" data-k="d62-fi">FI</button> deferro sanol d’avril 2021 précise doses selon poids/âge, plafond, interactions et contre-indications, dont certaines atteintes rénale ou hépatique sévères. La dose en fer élémentaire ne se confond pas avec la masse d’un sel. Le schéma de cette <button class="w" data-k="d62-fi">FI</button> ne doit pas être remplacé implicitement par une stratégie alternée issue d’une autre recommandation.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S620] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a>.</p></div></template>
<template data-pop="d62-feriv" data-title="Fer intraveineux : corriger une carence documentée"><p>Ferinject est indiqué chez l’adulte en carence confirmée lorsque le fer oral ne convient pas selon sa <button class="w" data-k="d62-fi">FI</button>. Le besoin total, la dose par séance, la voie et les intervalles sont contrôlés séparément. Une équipe capable de traiter une anaphylaxie et une surveillance d’au moins 30 minutes après administration sont nécessaires.</p><p>Les réactions d’hypersensibilité et l’hypophosphatémie font partie des précautions. Après une hémorragie postpartum, la ferritine inflammatoire et les indications contextuelles <button class="w" data-k="d62-sources">OMS</button> doivent être confrontées à la <button class="w" data-k="d62-fi">FI</button> suisse. Le fer intraveineux ne se substitue pas à une transfusion cliniquement nécessaire.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></template>
<template data-pop="d62-profiles" data-title="PROFILES et examen fédéral2026"><p>Les situations de départ <button class="w" data-k="d62-profiles">PROFILES</button> 2017 pertinentes comprennent fatigue, dyspnée, pâleur et anémie. Elles servent à organiser un raisonnement clinique : reconnaître l’urgence, formuler des hypothèses, choisir un examen et expliquer une décision.</p><p>Les exigences <button class="w" data-k="d62-profiles">MEBEKO</button> 2026 consultées sont distinguées de la transition vers <button class="w" data-k="d62-profiles">PROFILES</button> 2. Aucun numéro hérité de bannière ni score de préparation ne prouve une certification fédérale de cette leçon. Les cas présentés sont fictifs ; ils illustrent des décisions justifiées par les sources.</p><div class="src"><p>Sources : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S623] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S624] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S625] Swiss Medical Weekly 2025, transition PROFILES 2</a>.</p></div></template>
<template data-pop="d62-sources" data-title="Sources, versions et limites"><p>Les recommandations sont datées et attribuées. Les lectures ciblées et les réemplois de passages réellement lus auparavant sont distingués dans le dossier de recherche. Une entrée n’équivaut pas à une lecture intégrale.</p><p>Les limites principales concernent l’absence de fréquence nationale D62 établie ici, les populations des seuils transfusionnels, les divergences entre <button class="w" data-k="d62-fi">FI</button> et directives et les règles institutionnelles de transfusion.</p><ul><li><b>CIM-10-GM 2024 français, D62 — 2024</b>. Ne certifie pas la facturation de toutes les années ; pas de code américain importé.</li><li><b>ICD-10-GM 2024 D62 — 2024</b>. D62 ne code pas à lui seul le site ni le mécanisme causal de la perte.</li><li><b>Anémie, stratégie SMPR — 2022</b>. Document institutionnel 2022 ; seuils de laboratoire datés, transfusion aiguë contextualisée par directives plus spécifiques.</li><li><b>European guideline on major bleeding and coagulopathy following trauma, sixth edition — 1 mars 2023</b>. Pas une directive digestive/obstétricale ; portions non lues non revendiquées. Date de téléchargement 2026 non prise pour version. Objectifs transfusionnels ne deviennent pas seuils isolés en choc.</li><li><b>Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026 — publication 13 mai 2026 ;58:899–924</b>. Ne pas généraliser les seuils au choc ni appliquer aux varices ; recommandations antithrombotiques reconduites non réévaluées ; anciennes pages 2015/2021 non prises pour version 2026.</li><li><b>Peripartum haemorrhage: <button class="w" data-k="d62-sources">DGGG</button>/<button class="w" data-k="d62-sources">OEGGG</button>/<button class="w" data-k="d62-sources">SGGG</button> guideline — S2k août 2022 ; validité jusqu’au 31 juillet 2027</b>. Consensus S2k, pas S3 ; définition thérapeutique <button class="w" data-k="d62-sources">OMS</button> 2025 plus précoce présentée séparément ; pas extrapolation à D62 tout contexte.</li><li><b>Consolidated guidelines for postpartum haemorrhage — 2025</b>. Hébergement NLM ne fait pas de ce texte une directive américaine. Lecture du PDF ciblée, pas résumé seul. Critères <button class="w" data-k="d62-sources">OMS</button> de réponse initiale ne déclenchent pas automatiquement chirurgie/transfusion ; pas adoption suisse inventée.</li><li><b>Tranexamic Acid Leman, solution injectable 100 mg/mL — septembre 2026</b>. Table rénale&gt;500µmol/L en tension avec CI rénale sévère : aucune ordonnance simplifiée ; indication digestive <button class="w" data-k="d62-fi">FI</button> différente de <button class="w" data-k="d62-sources">ESGE</button> ; allaitement non recommandé <button class="w" data-k="d62-fi">FI</button> ; horaires trauma/PPH attribués à directives.</li><li><b>Octaplex 500/1000 — novembre 2021</b>. Pas substitution universelle en D62 ; pas dose 25–50 UI/kg recopiée hors contexte ; données enfant non établies ; formulation INR/Quick ambiguë non reproduite.</li><li><b>Information professionnelle suisse Ferinject — juin 2025</b>. Autorisation pédiatrique non établie par les essais cités dans la <button class="w" data-k="d62-fi">FI</button> ; doses d’étude ne deviennent pas prescription.</li><li><b>Technique clinique : transfusions de produits sanguins labiles — version 3.0 applicable 2 mai 2025</b>. Délai <button class="w" data-k="d62-compatibilite">RAI</button> et moyens locaux ne deviennent pas règle nationale ; numéro interne non proposé hors HUG ; unité O2 incohérente dans extraction non reprise.</li><li><b>Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f — version 1.0,9 août 2024</b>. Classification datée ; ne prétend pas revalider toutes les définitions internationales ultérieures.</li><li><b>Top 5 médecine interne hospitalière : transfusion — mai 2016, page consultée 2 novembre 2026</b>. Repères de cette liste datée, pas algorithme universel pour hémorragie active ou ischémie aiguë.</li><li><b>18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax — 2022 ; page consultée 2026</b>. Ouvrage américain de biologie, aucune recommandation clinique américaine ; paraphrases factuelles uniquement ; aucune figure de cette version NC-SA reproduite.</li><li><b>18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax — Anatomy and Physiology 2 e, page consultée 2026</b>. Paraphrases factuelles ciblées ; aucune recommandation américaine de traitement ni image sous licence actuelle reprise. Intervalles chiffrés et simplifications pathologiques du manuel non utilisés.</li><li><b>18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax — Anatomy and Physiology 2 e, page consultée 2026</b>. Paraphrases factuelles ciblées ; aucune recommandation américaine de traitement ni image sous licence actuelle reprise. Intervalles chiffrés et simplifications pathologiques du manuel non utilisés.</li><li><b>File:2205 Bone Marrow.jpg - Wikimedia Commons — édition 8.25,18 mai 2016 ; CC BY 4.0</b>. La licence de cet original 2016 est CC BY 4.0 ; distincte du manuel 2026 NC-SA. Barre sans valeur non mesurée ; pas preuve diagnostique de leucémie.</li><li><b>Human blood smear — Кров людини — CC BY 4.0, copie D50 du 15 octobre 2026</b>. Champ peu grossi, ne permet pas de qualifier des réticulocytes ni les réserves en fer. Aucun pixel modifié. </li><li><b>Guideline on haemoglobin cutoffs to define anaemia in individuals and populations — 5 mars 2024, ISBN 9789240088542</b>. Seuils diagnostiques, pas seuils transfusionnels ; pas norme spécifique &gt;65 ans ou &lt;6 mois inventée. Tables paraphrasées, pas image reproduite.</li><li><b>Information professionnelle suisse ferro sanol — avril 2021</b>. Atteintes rénale/hépatique sévères contre-indiquées ; absence de données d’ajustement ne supprime pas ces CI. Schéma alterné ECCO distinct de posologie <button class="w" data-k="d62-fi">FI</button>.</li><li><b>Carence en fer — medi X — révision juillet 2022, modification mai 2023</b>. Positions sur carence sans anémie divergentes du Delphi et d’ECCO ; ne pas étendre aux indications rénales/cardiaques spécifiques.</li><li><b>HUG, enseignement hémogramme adulte, septembre 2019 — enseignement 9 septembre 2019</b>. Repères datés non norme nationale 2026 ; exemple avec unité <button class="w" data-k="d62-concentration">Hb</button> manifestement incohérente non utilisé.</li><li><b><button class="w" data-k="d62-profiles">PROFILES</button> 2017, situations de départ — 2017</b>. Référentiel 2017 distinct de <button class="w" data-k="d62-profiles">PROFILES</button> 2/examen 2028.</li><li><b>OFSP/<button class="w" data-k="d62-profiles">MEBEKO</button>, exigences examen 2026, §2 — exigences examen 2026</b>. Lecture parent partagée et attribuée ; n’anticipe pas les questions d’examen.</li><li><b>Swiss Medical Weekly 2025, transition <button class="w" data-k="d62-profiles">PROFILES</button> 2 — 2025</b>. Lecture parent partagée ; version d’enseignement distincte du cadre examen 2026.</li><li><b>OFSP, liste des spécialités — page consultée 2 novembre 2026</b>. Aucune limitation individuelle des produits étudiés n’est certifiée ici.</li><li><b>OFSP, cas particuliers, art. 71 a–d OAMal — page consultée 2 novembre 2026</b>. Explication générale, pas accord d’assurance ni garantie financière individuelle.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.mct.bfs.admin.ch/en/cim10/2024/hierarchy/III/D60-D64?lang=fr" target="_blank" rel="noopener">[S601] CIM-10-GM 2024 français, D62</a> ; <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d60-d64.htm" target="_blank" rel="noopener">[S602] ICD-10-GM 2024 D62</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11998639/" target="_blank" rel="noopener">[S606] Peripartum haemorrhage: DGGG/OEGGG/SGGG guideline</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/de/top-5-listen/stationaere-allgemeine-innere-medizin-2016" target="_blank" rel="noopener">[S613] Top 5 médecine interne hospitalière : transfusion</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S614] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S616] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:2205_Bone_Marrow.jpg" target="_blank" rel="noopener">[S617] File:2205 Bone Marrow.jpg - Wikimedia Commons</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S618] Human blood smear — Кров людини</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/f9f74397-1440-478d-a63c-26f29a01552f/content" target="_blank" rel="noopener">[S619] Guideline on haemoglobin cutoffs to define anaemia in individuals and populations</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">[S620] Information professionnelle suisse ferro sanol</a> ; <a data-reference-source="1" href="https://www.guidelines.fmh.ch/downloads/23084195/download-fr.pdf" target="_blank" rel="noopener">[S621] Carence en fer — medi X</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/updates_MSD/09.09.19_update_medecine_generale_anemie.pdf" target="_blank" rel="noopener">[S622] HUG, enseignement hémogramme adulte, septembre 2019</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">[S623] PROFILES 2017, situations de départ</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">[S624] OFSP/MEBEKO, exigences examen 2026, §2</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/4389/6356?inline=1" target="_blank" rel="noopener">[S625] Swiss Medical Weekly 2025, transition PROFILES 2</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/medicaments" target="_blank" rel="noopener">[S626] OFSP, liste des spécialités</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/prise-en-charge-de-medicaments-dans-des-cas-particuliers" target="_blank" rel="noopener">[S627] OFSP, cas particuliers, art. 71 a–d OAMal</a>.</p></div></template>
<template data-pop="pareto-d62-cours" data-title="Loi de Pareto — Monographie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Reconnaître une perte encore active et sa tolérance.</li><li>L’hémoglobine initiale peut masquer la perte.</li><li>Contrôler la source ; contextualiser transfusion et <button class="w" data-k="d62-txa">TXA</button>.</li><li>Après stabilisation, rechercher carence et récidive.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.esge.com/assets/downloads/pdfs/guidelines/2026_a-2863-8314.pdf" target="_blank" rel="noopener">[S605] Endoscopic diagnosis and management of peptic ulcer bleeding, Update 2026</a> ; <a data-reference-source="1" href="https://www.ncbi.nlm.nih.gov/books/n/who382923/pdf/" target="_blank" rel="noopener">[S607] Consolidated guidelines for postpartum haemorrhage</a>.</p></div></template>
<template data-pop="pareto-d62-examens" data-title="Loi de Pareto — Examens"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Relier chaque prélèvement aux pertes et traitements.</li><li>Numération, perfusion, coagulation et imagerie répondent à des questions différentes.</li><li>La compatibilité et l’identité font partie de la sécurité.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a> ; <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a>.</p></div></template>
<template data-pop="pareto-d62-pharma" data-title="Loi de Pareto — Pharmacologie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Nommer la fonction à corriger avant le produit.</li><li>Comparer indication clinique et <button class="w" data-k="d62-fi">FI</button> exacte.</li><li>Ne pas confondre dose, concentration, débit et besoin total.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680579180025" target="_blank" rel="noopener">[S609] Octaplex 500/1000</a>.</p></div></template>
<template data-pop="pareto-d62-semio" data-title="Loi de Pareto — Sémiologie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Associer signes de tolérance et mesures répétées.</li><li>Aucun signe ni chiffre isolé ne mesure la perte.</li><li>Le contexte détermine l’urgence et les objectifs.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="pareto-d62-anat" data-title="Loi de Pareto — Anatomie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Distinguer circulation, moelle et site de perte.</li><li>Une perte interne peut ne pas être visible.</li><li>Traiter la source et remplacer le sang répondent à deux besoins.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S614] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="pareto-d62-histo" data-title="Loi de Pareto — Histologie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>La photographie montre une morphologie, pas une concentration.</li><li>Les indices sont des moyennes.</li><li>Les réticulocytes se lisent avec sévérité et chronologie.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_anemie_final.pdf" target="_blank" rel="noopener">[S603] Anémie, stratégie SMPR</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:%D0%9A%D1%80%D0%BE%D0%B2_%D0%BB%D1%8E%D0%B4%D0%B8%D0%BD%D0%B8.jpg" target="_blank" rel="noopener">[S618] Human blood smear — Кров людини</a>.</p></div></template>
<template data-pop="pareto-d62-physio" data-title="Loi de Pareto — Physiologie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Quantité d’hémoglobine, saturation et circulation sont distinctes.</li><li>Perte et dilution modifient la concentration.</li><li>La production médullaire participe à la récupération.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-2-production-of-the-formed-elements" target="_blank" rel="noopener">[S614] 18.2 Production of the Formed Elements  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-3-erythrocytes" target="_blank" rel="noopener">[S615] 18.3 Erythrocytes  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://link.springer.com/article/10.1186/s13054-023-04327-7" target="_blank" rel="noopener">[S604] European guideline on major bleeding and coagulopathy following trauma, sixth edition</a>.</p></div></template>
<template data-pop="pareto-d62-bio" data-title="Loi de Pareto — Biochimie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Plaquettes, facteurs et fibrinolyse n’ont pas la même fonction.</li><li><button class="w" data-k="d62-txa">TXA</button> ne remplace ni hématies ni source contrôlée.</li><li>Le fer corrige un substrat déficient avec ses précautions.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/18-5-hemostasis" target="_blank" rel="noopener">[S616] 18.5 Hemostasis  - Anatomy and Physiology 2 e | OpenStax</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680693850033" target="_blank" rel="noopener">[S608] Tranexamic Acid Leman, solution injectable 100 mg/mL</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">[S610] Information professionnelle suisse Ferinject</a>.</p></div></template>
<template data-pop="pareto-d62-immuno" data-title="Loi de Pareto — Immunohématologie"><p>Repères à relier au contexte clinique, sans remplacer les indications détaillées.</p><ul><li>Vérifier identité et compatibilité.</li><li>Une hémolyse transfusionnelle peut être immédiate ou retardée.</li><li>Arrêter et investiguer une réaction ; séparer gravité et causalité.</li></ul><div class="src"><p>Sources : <a data-reference-source="1" href="https://www.hug.ch/vdoc/HUG_000001043.pdf" target="_blank" rel="noopener">[S611] Technique clinique : transfusions de produits sanguins labiles</a> ; <a data-reference-source="1" href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/bewilligungen/i-310/i-310-aa-01-a01_mbklassierungundabklaerungvontransfusionsreaktione.pdf.download.pdf/I-310.AA.01-A01f_mbclassificationetanalysedesreactionstransfusionne.pdf" target="_blank" rel="noopener">[S612] Classification et analyse des réactions transfusionnelles I-310.AA.01-A01 f</a>.</p></div></template>
