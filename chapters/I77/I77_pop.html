<template data-pop="i77-dfm" data-title="Dysplasie fibromusculaire"><p><b>Définition (consensus ESH-SVM 2019, reprise de la définition européenne de 2014).</b> Maladie idiopathique, segmentaire, ni athéroscléreuse ni inflammatoire, de la musculature de la paroi artérielle, qui sténose les artères de petit et de moyen calibre.</p><p><b>Spectre.</b> Sténoses focales ou multifocales, auxquelles s’ajoutent anévrismes, dissections et tortuosités. Les lésions peuvent être symptomatiques ou silencieuses, hémodynamiquement significatives ou non.</p></template>
<template data-pop="i77-multi" data-title="Forme multifocale"><p>Alternance de sténoses et de dilatations, dite « en collier de perles », siégeant en général sur les portions moyenne et distale de l’artère. C’est l’aspect de la grande majorité des atteintes rénales de la femme d’âge moyen ; il correspond le plus souvent à la fibroplasie médiale (Orphanet 2007).</p></template>
<template data-pop="i77-focale" data-title="Forme focale"><p>Sténose unique, pouvant siéger sur n’importe quelle portion de l’artère. Elle est découverte en général avant 30 ans, avec des pressions plus élevées et une répartition plus équilibrée entre les sexes ; la guérison de l’hypertension après angioplastie y est plus fréquente que dans la forme multifocale (consensus 2019).</p></template>
<template data-pop="i77-multivasc" data-title="Atteinte multivasculaire"><p><b>Règle du consensus 2019.</b> Si une lésion focale ou multifocale établit le diagnostic dans un territoire, un anévrisme, une dissection ou une tortuosité d’un autre territoire comptent comme atteinte de ce territoire.</p><p><b>Fréquence.</b> 66,3 % des patients du registre ARCADIA explorés systématiquement.</p></template>
<template data-pop="i77-upa" data-title="Ulcère aortique pénétrant"><p><b>Définition (ESC 2024).</b> Ulcération d’une plaque athéroscléreuse de l’aorte qui traverse la limitante élastique interne et pénètre la média, souvent associée à un hématome intramural et à une athérosclérose diffuse ; 2 à 7 % des syndromes aortiques aigus.</p><p><b>Terrain.</b> Homme âgé de plus de 65 ans, fumeur, avec hypertension, maladie coronaire, bronchopneumopathie chronique obstructive ou insuffisance rénale. Siège habituel : aorte thoracique descendante moyenne et basse.</p><p><b>Diagnostic.</b> Scanner en première intention ; échocardiographie transœsophagienne et IRM en alternative.</p></template>
<template data-pop="i77-dunbar" data-title="Compression du tronc cœliaque"><p><b>Mécanisme.</b> Le ligament arqué médian, bande fibreuse des piliers du diaphragme, comprime le tronc cœliaque et le ganglion nerveux voisin.</p><p><b>Clinique.</b> Souvent asymptomatique ; parfois douleur épigastrique après les repas et amaigrissement.</p><p><b>Imagerie.</b> Sténose focale et dynamique de l’origine du tronc cœliaque, qui peut diminuer en inspiration profonde ou en position debout, parfois avec dilatation en aval (consensus 2019, diagnostic différentiel).</p></template>
<template data-pop="i77-gradient" data-title="Gradient de pression translésionnel"><p>Différence entre la pression aortique (Pa) et la pression de l’artère rénale en aval de la sténose (Pd), mesurée simultanément au repos, idéalement par guide de pression.</p><p><b>Seuil proposé.</b> Gradient d’au moins 10 % de la pression moyenne, soit Pd/Pa inférieur à 0,90 ; seuil extrapolé de la sténose athéroscléreuse, non validé dans la dysplasie (consensus 2019).</p><p><b>Usage.</b> Décider l’angioplastie et vérifier la disparition du gradient après le geste.</p></template>
<template data-pop="i77-dac" data-title="Dissection des artères cervicales"><p>Clivage de la paroi d’une artère carotide ou vertébrale qui crée un faux chenal. Elle se traduit par une douleur unilatérale de la tête, du cou ou du visage, éventuellement avec un syndrome de Claude Bernard-Horner partiel ou un déficit neurologique focal.</p><p><b>Dans la dysplasie.</b> 26 % des patients du registre américain ont eu une dissection, le plus souvent cervicale ; traitement antithrombotique de 3 à 6 mois puis antiagrégation au long cours (consensus 2019).</p></template>
<template data-pop="i77-phactr1" data-title="Locus PHACTR1"><p>Variant fréquent rs9349379-A, dans un intron du gène PHACTR1 (région 6p24), identifié par étude d’association pangénomique ; rapport de cotes d’environ 1,4 pour la dysplasie.</p><p>Il est aussi associé à la dissection cervicale, à l’hypertension et à la migraine, mais protège de la maladie coronaire athéroscléreuse. Il ne constitue pas un test diagnostique (consensus 2019).</p></template>
<template data-pop="i77-acouph" data-title="Acouphène pulsatile"><p>Bruit de « souffle » perçu dans l’oreille, rythmé par les battements du cœur. Manifestation fréquente de l’atteinte cérébrovasculaire : symptôme révélateur chez 32 % des patients du registre américain.</p><p>Prise en charge : explication et réassurance, parfois thérapie sonore ou cognitivo-comportementale ; un avis audiologique et ORL recherche d’autres causes (consensus 2019).</p></template>
<template data-pop="i77-cerveau" data-title="Imagerie du cerveau au bassin"><p><b>Recommandation du consensus 2019.</b> Quel que soit le territoire révélateur, tout patient atteint de dysplasie bénéficie au moins une fois d’une imagerie de toutes les artères du cerveau au bassin, en général par angioscanner ou angio-IRM avec contraste.</p><p><b>But.</b> Découvrir d’autres lésions de dysplasie, des anévrismes et des dissections occultes. Elle remplace l’approche séquentielle des documents antérieurs.</p><p>La même exploration est recommandée après une dissection coronaire spontanée.</p></template>
<template data-pop="i77-anevr" data-title="Anévrisme intracrânien"><p><b>Dépistage.</b> Tout patient atteint de dysplasie bénéficie d’au moins une imagerie cérébrale par angioscanner ou angio-IRM ; l’intérêt de la répéter est inconnu (consensus 2019).</p><p><b>Fréquence.</b> 12,9 % des femmes du registre américain ; plus de la moitié avaient plusieurs anévrismes.</p><p><b>Traitement.</b> Embolisation par coils ou clip chirurgical, comme sans dysplasie ; contrôle tensionnel et arrêt du tabac.</p></template>
<template data-pop="i77-diff" data-title="Diagnostic différentiel"><p><b>Imitent la forme multifocale.</b> Médiolyse artérielle segmentaire, spasme artériel (dérivés de l’ergot, sympathomimétiques, cathéter), ondes stationnaires, artefacts d’IRM ou de scanner.</p><p><b>Imitent la forme focale.</b> Athérosclérose (origine de l’artère, facteurs de risque), vascularites des gros vaisseaux (Takayasu, artérite à cellules géantes), compression du tronc cœliaque, syndromes de Williams, de neurofibromatose de type 1 et d’Alagille.</p><p><b>Anévrismes et dissections.</b> Syndromes de Loeys-Dietz et d’Ehlers-Danlos vasculaire, dissection artérielle spontanée isolée (consensus 2019).</p></template>
<template data-pop="i77-scad" data-title="Dissection coronaire spontanée"><p>Dissection d’une artère coronaire sans athérosclérose, par formation d’un faux chenal dans le tiers externe de la média qui comprime la vraie lumière. Plus de 90 % de femmes ; 10 à 25 % des infarctus de la femme de moins de 50 ans (consensus 2019).</p><p><b>Lien avec la dysplasie.</b> Dysplasie extracoronaire chez 45 à 62,7 % des patients explorés ; imagerie du cerveau au bassin recommandée. Traitement le plus souvent conservateur ; récidive de 10,4 % sur environ 3 ans dans une série prospective.</p></template>
<template data-pop="i77-angio" data-title="Angioplastie rénale au ballonnet"><p><b>Indication (ESC 2024, classe IIa, niveau B).</b> Hypertension ou dysfonction rénale due à une sténose par dysplasie, avec critères de haut risque et signes de viabilité du rein.</p><p><b>Technique (consensus 2019).</b> Ballon choisi d’après l’artère saine en aval, augmenté de 0,5 mm jusqu’à disparition du gradient ; stent seulement en sauvetage (dissection limitant le flux, rupture). Chirurgie si lésion complexe ou échec.</p></template>
<template data-pop="i77-upa-risque" data-title="Ulcère aortique pénétrant à haut risque"><p><b>Critères d’imagerie (ESC 2024).</b> Largeur maximale d’au moins 13 à 20 mm ; profondeur d’au moins 10 mm ; croissance de la largeur ou de la profondeur de plus de 5 mm par an ; anévrisme sacculaire associé ; épanchement pleural croissant.</p><p><b>Conduite.</b> Type B non compliqué à haut risque : traitement endovasculaire à envisager (classe IIa). Type B compliqué : endovasculaire recommandé (classe I). Type A : chirurgie (classe I).</p></template>
<template data-pop="i77-doppler" data-title="Écho-Doppler de la dysplasie"><p>Aucun critère Doppler validé n’existe pour la dysplasie carotidienne. Les signes qui la soutiennent sont la turbulence, l’élévation des vitesses et la tortuosité de la portion moyenne et distale de la carotide interne, zone épargnée par l’athérosclérose (consensus 2019).</p><p>Le Doppler est utile au suivi ; il est le premier examen seulement dans les centres très expérimentés.</p></template>
<template data-pop="i77-mediale" data-title="Fibroplasie médiale"><p>Type histologique le plus fréquent, près de 85 % des sténoses rénales : collier homogène de tissu élastique, sténoses multiples alternant avec des dilatations dont le diamètre dépasse celui de l’artère normale, limitante élastique interne préservée. C’est la lésion du « collier de perles » (Orphanet 2007).</p></template>
<template data-pop="i77-sra" data-title="Bloqueurs du système rénine-angiotensine"><p>Les inhibiteurs de l’enzyme de conversion empêchent la formation d’angiotensine II ; les antagonistes des récepteurs de l’angiotensine II bloquent son action. Dans l’hypertension rénovasculaire, la sécrétion de rénine du rein ischémique entretient l’hypertension ; ces médicaments s’opposent donc directement au mécanisme.</p><p>En aval d’une sténose serrée, la filtration glomérulaire dépend toutefois de l’angiotensine II : leur introduction impose un contrôle de la créatinine.</p></template>
<template data-pop="pareto-i77-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i77-0,i77-1,i77-2,i77-3,i77-4,i77-5,i77-6"></p><ul>
<li>Diagnostic : au moins une lésion focale ou multifocale ; anévrisme, dissection ou tortuosité seuls ne suffisent pas.</li>
<li>80 à 90 % de femmes ; artères rénales chez environ 75 % ; atteinte multivasculaire fréquente.</li>
<li>Signes rénaux : hypertension avant 30 ans, grade 3, résistante ; petit rein ; souffle abdominal.</li>
<li>Signes cérébrovasculaires : migraine, acouphène pulsatile, souffle cervical haut, accident ischémique, dissection.</li>
<li>Aucun test génétique ; tabac associé.</li></ul></template>
<template data-pop="pareto-i77-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i77-7,i77-8,i77-9"></p><ul>
<li>Angioscanner en premier ; puis imagerie du cerveau au bassin et recherche d’anévrisme intracrânien.</li>
<li>Aspirine 75 à 100 mg par jour si pas de contre-indication.</li>
<li>Bloqueur du système rénine-angiotensine en cas d’hypertension rénovasculaire.</li>
<li>Angioplastie au ballonnet si gradient significatif, stent de sauvetage seulement.</li>
<li>Ulcère aortique pénétrant : type A chirurgie ; type B médical, endovasculaire si compliqué ou à haut risque.</li></ul></template>
<template data-pop="pareto-i77-suivi" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="i77-10,i77-11"></p><ul>
<li>Suivi au moins annuel : pression, souffles, pouls, fonction rénale.</li>
<li>Après angioplastie : Doppler dans le mois, tous les 6 mois pendant 2 ans, puis chaque année.</li>
<li>Guérison de l’hypertension après angioplastie : 36 % seulement.</li>
<li>Grossesse : conseil préconceptionnel et suivi à haut risque.</li></ul></template>
<template data-pop="pareto-i77-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i77-e-1,i77-e-2,i77-e-3"></p><ul>
<li>Angioscanner : premier examen ; angio-IRM si contre-indication.</li>
<li>Doppler : premier examen seulement en centre expert.</li>
<li>Angiographie seulement si elle change la conduite ; mesure du gradient Pd/Pa.</li></ul></template>
<template data-pop="pareto-i77-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i77-p-1,i77-p-2"></p><ul>
<li>Aspirine : hors indication explicite en Suisse pour la dysplasie ; 100 mg par jour, contre-indiquée au troisième trimestre.</li>
<li>Bloqueurs du système rénine-angiotensine : contrôler la créatinine.</li>
<li>Prudence avec triptans et vasoconstricteurs, surtout après dissection.</li></ul></template>
