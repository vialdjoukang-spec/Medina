<template data-pop="i77-dfm" data-title="Dysplasie fibromusculaire"><p><b>Définition (consensus ESH-SVM 2019, reprise de la définition européenne de 2014).</b> La dysplasie fibromusculaire est une maladie idiopathique, segmentaire, ni athéroscléreuse ni inflammatoire, de la musculature de la paroi artérielle ; elle sténose les artères de petit et de moyen calibre.</p><p><b>Spectre.</b> Sténoses focales ou multifocales, auxquelles s’ajoutent anévrismes, dissections et tortuosités. Les lésions peuvent être symptomatiques ou silencieuses, hémodynamiquement significatives ou non.</p></template>
<template data-pop="i77-multi" data-title="Forme multifocale"><p>Alternance de sténoses et de dilatations, dite « en collier de perles », siégeant en général sur les portions moyenne et distale de l’artère. C’est l’aspect de la grande majorité des atteintes rénales de la femme d’âge moyen ; il correspond le plus souvent à la fibroplasie médiale (Orphanet 2007).</p><figure><img src="images/cardiologie/i77_dfm_renale_angiographie.gif" alt="Artériographie rénale réelle : aspect en collier de perles d’une artère rénale accessoire inférieure gauche et petit anévrisme sacculaire à droite" width="600" height="480" loading="lazy" decoding="async">
<figcaption>Même image que la figure 1 du cours — Artériographie rénale d’une femme de 35 ans à l’hypertension inexpliquée : aspect typique « en collier de perles » (flèches) d’une dysplasie fibromusculaire multifocale de l’artère rénale accessoire inférieure gauche ; la tête de flèche montre un petit anévrisme sacculaire distal de l’artère rénale droite. Image de Zeina A. R., Vladimir W., Barmeir E., Journal of Medical Case Reports 2007;1:58, doi:10.1186/1752-1947-1-58, Wikimedia Commons, licence Creative Commons Attribution 2.0 ; convertie pour l’atlas.</figcaption></figure><p>Cette artériographie réelle montre l’aspect qui définit la forme multifocale. Les sténoses alternent avec des dilatations plus larges que l’artère saine, parce que la paroi désorganisée forme des voiles et des segments affaiblis. C’est pourquoi l’aspect seul ne dit pas le retentissement : seule la mesure du gradient décide d’une dilatation.</p></template>
<template data-pop="i77-focale" data-title="Forme focale"><p>Sténose unique, pouvant siéger sur n’importe quelle portion de l’artère. Elle est découverte en général avant 30 ans, avec des pressions plus élevées et une répartition plus équilibrée entre les sexes ; la guérison de l’hypertension après angioplastie y est plus fréquente que dans la forme multifocale (consensus 2019).</p></template>
<template data-pop="i77-multivasc" data-title="Atteinte multivasculaire"><p><b>Règle du consensus 2019.</b> Si une lésion focale ou multifocale établit le diagnostic dans un territoire, un anévrisme, une dissection ou une tortuosité d’un autre territoire comptent comme atteinte de ce territoire.</p><p><b>Fréquence.</b> 66,3 % des patients du registre ARCADIA explorés systématiquement.</p></template>
<template data-pop="i77-upa" data-title="Ulcère aortique pénétrant"><p><b>Définition (ESC 2024).</b> Ulcération d’une plaque athéroscléreuse de l’aorte qui traverse la limitante élastique interne et pénètre la média, souvent associée à un hématome intramural et à une athérosclérose diffuse ; 2 à 7 % des syndromes aortiques aigus.</p><p><b>Terrain.</b> Le patient type est un homme de plus de 65 ans, fumeur, avec une hypertension, une maladie coronaire, une bronchopneumopathie chronique obstructive ou une insuffisance rénale, car l’ulcère naît d’une plaque d’athérome. L’ulcère siège habituellement sur l’aorte thoracique descendante moyenne et basse.</p><p><b>Diagnostic.</b> Scanner en première intention ; échocardiographie transœsophagienne et IRM en alternative.</p></template>
<template data-pop="i77-dunbar" data-title="Compression du tronc cœliaque"><p><b>Mécanisme.</b> Le ligament arqué médian, bande fibreuse des piliers du diaphragme, comprime le tronc cœliaque et le ganglion nerveux voisin.</p><p><b>Clinique.</b> La compression est souvent asymptomatique ; elle provoque parfois une douleur épigastrique après les repas et un amaigrissement, car la digestion augmente la demande en sang de l’intestin.</p><p><b>Imagerie.</b> Sténose focale et dynamique de l’origine du tronc cœliaque, qui peut diminuer en inspiration profonde ou en position debout, parfois avec dilatation en aval (consensus 2019, diagnostic différentiel).</p><figure><img src="images/cardiologie/i77_compression_tronc_coeliaque.gif" alt="Coupe sagittale réelle d’angioscanner montrant la compression de l’origine du tronc cœliaque" width="520" height="458" loading="lazy" decoding="async">
<figcaption>Même image que la figure 4 du cours — Angioscanner, reconstruction curviligne parasagittale, d’un syndrome de compression du tronc cœliaque : rétrécissement de l’origine du tronc cœliaque (flèche) au bord antérieur de l’aorte. Image de MBq, Wikimedia Commons, domaine public ; convertie pour l’atlas.</figcaption></figure><p>Cet angioscanner réel montre le rétrécissement focal de l’origine du tronc cœliaque par le ligament arqué médian. La compression est extrinsèque et varie avec la respiration ; elle se distingue donc d’une sténose athéroscléreuse ou dysplasique, et l’angioplastie seule ne la lève pas.</p></template>
<template data-pop="i77-gradient" data-title="Gradient de pression translésionnel"><p>Le gradient translésionnel est la différence entre la pression aortique (Pa) et la pression de l’artère rénale en aval de la sténose (Pd). On le mesure simultanément au repos, idéalement par guide de pression, car il montre si la sténose freine réellement le flux.</p><p><b>Seuil proposé.</b> Un gradient d’au moins 10 % de la pression moyenne, soit un rapport Pd/Pa inférieur à 0,90, est jugé significatif. Toutefois, ce seuil est extrapolé de la sténose athéroscléreuse et n’est pas validé dans la dysplasie (consensus 2019).</p><p><b>Usage.</b> Décider l’angioplastie et vérifier la disparition du gradient après le geste.</p></template>
<template data-pop="i77-dac" data-title="Dissection des artères cervicales"><p>Clivage de la paroi d’une artère carotide ou vertébrale qui crée un faux chenal. Elle se traduit par une douleur unilatérale de la tête, du cou ou du visage, éventuellement avec un syndrome de Claude Bernard-Horner partiel ou un déficit neurologique focal.</p><p><b>Dans la dysplasie.</b> 26 % des patients du registre américain ont eu une dissection, le plus souvent cervicale ; traitement antithrombotique de 3 à 6 mois puis antiagrégation au long cours (consensus 2019).</p></template>
<template data-pop="i77-phactr1" data-title="Locus PHACTR1"><p>Le variant fréquent rs9349379-A se situe dans un intron du gène PHACTR1 (région 6p24) ; une étude d’association pangénomique l’a identifié. Il augmente modestement le risque de dysplasie, avec un rapport de cotes d’environ 1,4, ce qui explique qu’il ne serve pas de test diagnostique.</p><p>Il est aussi associé à la dissection cervicale, à l’hypertension et à la migraine, mais protège de la maladie coronaire athéroscléreuse. Il ne constitue pas un test diagnostique (consensus 2019).</p></template>
<template data-pop="i77-acouph" data-title="Acouphène pulsatile"><p>L’acouphène pulsatile est un bruit de « souffle » perçu dans l’oreille et rythmé par les battements du cœur, car le flux turbulent dans une carotide sténosée se transmet à l’oreille. C’est une manifestation fréquente de l’atteinte cérébrovasculaire : il est le symptôme révélateur chez 32 % des patients du registre américain.</p><p>Prise en charge : explication et réassurance, parfois thérapie sonore ou cognitivo-comportementale ; un avis audiologique et ORL recherche d’autres causes (consensus 2019).</p></template>
<template data-pop="i77-cerveau" data-title="Imagerie du cerveau au bassin"><p><b>Recommandation du consensus 2019.</b> Quel que soit le territoire révélateur, tout patient atteint de dysplasie bénéficie au moins une fois d’une imagerie de toutes les artères du cerveau au bassin, en général par angioscanner ou angio-IRM avec contraste.</p><p><b>But.</b> Cette imagerie découvre d’autres lésions de dysplasie, des anévrismes et des dissections occultes, car la maladie est souvent multivasculaire. Elle remplace l’approche séquentielle des documents antérieurs.</p><p>La même exploration est recommandée après une dissection coronaire spontanée.</p></template>
<template data-pop="i77-anevr" data-title="Anévrisme intracrânien"><p><b>Dépistage.</b> Tout patient atteint de dysplasie bénéficie d’au moins une imagerie cérébrale par angioscanner ou angio-IRM ; l’intérêt de la répéter est inconnu (consensus 2019).</p><p><b>Fréquence.</b> 12,9 % des femmes du registre américain ; plus de la moitié avaient plusieurs anévrismes.</p><p><b>Traitement.</b> L’anévrisme est traité par embolisation par coils ou par clip chirurgical, comme sans dysplasie ; le contrôle tensionnel et l’arrêt du tabac complètent la prise en charge.</p></template>
<template data-pop="i77-diff" data-title="Diagnostic différentiel"><p><b>Imitent la forme multifocale.</b> Médiolyse artérielle segmentaire, spasme artériel (dérivés de l’ergot, sympathomimétiques, cathéter), ondes stationnaires, artefacts d’IRM ou de scanner.</p><p><b>Imitent la forme focale.</b> Plusieurs maladies imitent la forme focale : l’athérosclérose, qui touche l’origine de l’artère chez un patient avec facteurs de risque, les vascularites des gros vaisseaux (Takayasu, artérite à cellules géantes), la compression du tronc cœliaque, ainsi que les syndromes de Williams, de neurofibromatose de type 1 et d’Alagille.</p><p><b>Anévrismes et dissections.</b> Devant un anévrisme ou une dissection, le médecin discute aussi les syndromes de Loeys-Dietz et d’Ehlers-Danlos vasculaire et la dissection artérielle spontanée isolée (consensus 2019).</p></template>
<template data-pop="i77-scad" data-title="Dissection coronaire spontanée"><p>La dissection coronaire spontanée est la dissection d’une artère coronaire sans athérosclérose : un faux chenal se forme dans le tiers externe de la média et comprime la vraie lumière. Elle touche des femmes dans plus de 90 % des cas et cause 10 à 25 % des infarctus de la femme de moins de 50 ans (consensus 2019).</p><p><b>Lien avec la dysplasie.</b> Une dysplasie extracoronaire est retrouvée chez 45 à 62,7 % des patients explorés ; c’est pourquoi l’imagerie du cerveau au bassin est recommandée. Le traitement est le plus souvent conservateur, et la récidive atteint 10,4 % sur environ 3 ans dans une série prospective.</p></template>
<template data-pop="i77-angio" data-title="Angioplastie rénale au ballonnet"><p><b>Indication (ESC 2024, classe IIa, niveau B).</b> L’angioplastie se discute en cas d’hypertension ou de dysfonction rénale due à une sténose par dysplasie, avec des critères de haut risque et des signes de viabilité du rein, car un rein détruit ne récupère pas après revascularisation.</p><p><b>Technique (consensus 2019).</b> Le ballon est choisi d’après l’artère saine en aval, puis augmenté de 0,5 mm jusqu’à disparition du gradient. Le stent est réservé au sauvetage, en cas de dissection limitant le flux ou de rupture, parce que la dilatation simple suffit le plus souvent dans cette paroi fibreuse. La chirurgie se discute si la lésion est complexe ou en cas d’échec.</p></template>
<template data-pop="i77-upa-risque" data-title="Ulcère aortique pénétrant à haut risque"><p><b>Critères d’imagerie (ESC 2024).</b> Largeur maximale d’au moins 13 à 20 mm ; profondeur d’au moins 10 mm ; croissance de la largeur ou de la profondeur de plus de 5 mm par an ; anévrisme sacculaire associé ; épanchement pleural croissant.</p><p><b>Conduite.</b> Dans le type B non compliqué à haut risque, un traitement endovasculaire est à envisager (classe IIa). Dans le type B compliqué, il est recommandé (classe I). Dans le type A, la chirurgie est recommandée (classe I), car l’atteinte de l’aorte ascendante menace la vie.</p></template>
<template data-pop="i77-doppler" data-title="Écho-Doppler de la dysplasie"><p>Aucun critère Doppler validé n’existe pour la dysplasie carotidienne. Les signes qui la soutiennent sont la turbulence, l’élévation des vitesses et la tortuosité de la portion moyenne et distale de la carotide interne, zone épargnée par l’athérosclérose (consensus 2019).</p><p>Le Doppler est utile au suivi ; il est le premier examen seulement dans les centres très expérimentés.</p></template>
<template data-pop="i77-mediale" data-title="Fibroplasie médiale"><p>La fibroplasie médiale est le type histologique le plus fréquent, avec près de 85 % des sténoses rénales. Un collier homogène de tissu élastique crée des sténoses multiples qui alternent avec des dilatations plus larges que l’artère normale, alors que la limitante élastique interne reste préservée. C’est la lésion du « collier de perles » (Orphanet 2007).</p></template>
<template data-pop="i77-sra" data-title="Bloqueurs du système rénine-angiotensine"><p>Les inhibiteurs de l’enzyme de conversion empêchent la formation d’angiotensine II ; les antagonistes des récepteurs de l’angiotensine II bloquent son action. Dans l’hypertension rénovasculaire, la sécrétion de rénine du rein ischémique entretient l’hypertension ; ces médicaments s’opposent donc directement au mécanisme.</p><p>En aval d’une sténose serrée, la filtration glomérulaire dépend toutefois de l’angiotensine II : leur introduction impose un contrôle de la créatinine.</p></template>
<template data-pop="pareto-i77-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i77-0,i77-1,i77-2,i77-3,i77-4,i77-5,i77-6"></p><ul>
<li>Diagnostic : au moins une lésion focale ou multifocale ; anévrisme, dissection ou tortuosité seuls ne suffisent pas.</li>
<li>La maladie touche des femmes dans 80 à 90 % des cas et les artères rénales chez environ 75 % des patients ; l’atteinte multivasculaire est fréquente.</li>
<li>Les signes rénaux comprennent une hypertension avant 30 ans, de grade 3 ou résistante, un petit rein et un souffle abdominal.</li>
<li>Les signes cérébrovasculaires comprennent la migraine, l’acouphène pulsatile, le souffle cervical haut, l’accident ischémique et la dissection.</li>
<li>Aucun test génétique n’existe, et le tabac est associé à la maladie.</li></ul></template>
<template data-pop="pareto-i77-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i77-7,i77-8,i77-9"></p><ul>
<li>L’angioscanner vient en premier ; il est suivi de l’imagerie du cerveau au bassin et de la recherche d’un anévrisme intracrânien.</li>
<li>L’aspirine se donne à 75 à 100 mg par jour en l’absence de contre-indication.</li>
<li>Un bloqueur du système rénine-angiotensine traite l’hypertension rénovasculaire.</li>
<li>L’angioplastie au ballonnet s’indique si le gradient est significatif, et le stent ne sert qu’au sauvetage.</li>
<li>Ulcère aortique pénétrant : type A chirurgie ; type B médical, endovasculaire si compliqué ou à haut risque.</li></ul></template>
<template data-pop="pareto-i77-suivi" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="i77-10,i77-11"></p><ul>
<li>Le suivi est au moins annuel et porte sur la pression, les souffles, les pouls et la fonction rénale.</li>
<li>Après angioplastie, un Doppler a lieu dans le mois, puis tous les 6 mois pendant 2 ans, puis chaque année.</li>
<li>L’hypertension ne guérit après angioplastie que chez 36 % des patients.</li>
<li>La grossesse exige un conseil préconceptionnel et un suivi à haut risque.</li></ul></template>
<template data-pop="pareto-i77-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i77-e-1,i77-e-2,i77-e-3"></p><ul>
<li>L’angioscanner est le premier examen ; l’angio-IRM le remplace en cas de contre-indication.</li>
<li>Le Doppler ne sert de premier examen qu’en centre expert, car il dépend fortement de l’opérateur.</li>
<li>Angiographie seulement si elle change la conduite ; mesure du gradient Pd/Pa.</li></ul></template>
<template data-pop="pareto-i77-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i77-p-1,i77-p-2"></p><ul>
<li>L’aspirine n’a pas d’indication explicite en Suisse pour la dysplasie ; on la donne à 100 mg par jour, et elle est contre-indiquée au troisième trimestre.</li>
<li>Sous bloqueur du système rénine-angiotensine, le médecin contrôle la créatinine, car une sténose rénale serrée peut faire chuter la filtration.</li>
<li>Les triptans et les vasoconstricteurs exigent la prudence, surtout après une dissection, car ils resserrent des artères fragiles.</li></ul></template>
