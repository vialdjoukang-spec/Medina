<section class="ilot" id="i77-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 34 ans, non fumeuse et sans antécédent, consulte pour une hypertension découverte à 172/104 mmHg, qui résiste déjà à deux médicaments. En outre, elle entend depuis des mois un souffle rythmé par son pouls dans l’oreille droite, et l’auscultation trouve un souffle abdominal. Or, chez une patiente jeune sans facteur de risque d’athérosclérose, cette association n’est pas banale : elle fait suspecter une maladie artérielle d’un autre type. Dès lors, la question qui structure ce cours est la suivante : <b>comment reconnaître une dysplasie fibromusculaire, l’explorer sur tout l’arbre artériel et décider entre traitement médical et angioplastie ?</b></p>
<p>Pour y répondre, ce cours poursuit trois objectifs. D’abord, définir la maladie et la distinguer de l’athérosclérose et des vascularites. Ensuite, organiser l’imagerie, du premier examen à l’exploration « du cerveau au bassin ». Enfin, poser les indications de l’<b>angioplastie au ballonnet</b> et du suivi. Par ailleurs, la catégorie CIM-10-GM I77 regroupe d’autres atteintes artérielles, comme l’ulcère aortique pénétrant et la compression du tronc cœliaque ; elles sont donc traitées ici à partir de leur source européenne, à la suite de la dysplasie.</p>
</section>
<section class="ilot" id="i77-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>Avant toute démarche, il faut définir la maladie. Selon la définition européenne reprise par le consensus international de 2019, la <button class="w" data-k="i77-dfm">dysplasie fibromusculaire (définition ESH-SVM 2019)</button> est une maladie idiopathique, segmentaire, ni athéroscléreuse ni inflammatoire, de la musculature de la paroi artérielle, qui sténose les artères de petit et de moyen calibre. Ses lésions peuvent, en outre, être symptomatiques ou silencieuses, et hémodynamiquement significatives ou non.</p>
<p>Cette définition posée, reste à classer les lésions. Or, le consensus 2019 abandonne la classification histologique, car le tissu artériel n’est presque plus jamais disponible depuis l’essor du traitement endovasculaire ; il retient donc une classification <b>angiographique</b> à deux types. D’une part, la <button class="w" data-k="i77-multi">forme multifocale (« collier de perles »)</button> alterne sténoses et dilatations, en général sur les portions moyenne et distale de l’artère. D’autre part, la <button class="w" data-k="i77-focale">forme focale (sténose unique)</button> peut siéger sur n’importe quelle portion de l’artère.</p>

<p>De plus, la maladie ne se limite pas aux sténoses. En effet, anévrismes, dissections et tortuosités artérielles sont plus fréquents chez les patients atteints. Cependant, ils ne suffisent pas, seuls, au diagnostic : il faut au moins une lésion focale ou multifocale. En revanche, lorsqu’une telle lésion existe dans un territoire, un anévrisme, une dissection ou une tortuosité d’un autre territoire comptent comme atteinte de ce territoire ; on parle alors d’<button class="w" data-k="i77-multivasc">atteinte multivasculaire (règle du consensus)</button>.</p>

<p>Enfin, certaines atteintes artérielles ne sont que l’expression d’une maladie générale décrite ailleurs, comme l’aortite syphilitique ou l’angiopathie périphérique du diabète. Leur traitement est donc celui de la maladie causale ; c’est pourquoi ce cours les mentionne sans les développer.</p>
</section>
<section class="ilot" id="i77-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Ces définitions éclairent la fréquence de la maladie, qui est longtemps restée sous-estimée. En effet, la dysplasie fibromusculaire est souvent silencieuse : les séries de donneurs vivants de rein retrouvent une atteinte rénale chez 3 à 4 % des candidats, et la prévalence de formes asymptomatiques est estimée entre 3 et 6 % (consensus 2019). De plus, 80 à 90 % des patients sont des <b>femmes</b>. À l’inverse, l’homme, moins souvent atteint, peut avoir une évolution plus agressive, avec davantage d’anévrismes et de dissections.</p>
<p>Quant aux territoires, les artères rénales sont touchées chez environ 75 % des patients des registres américain et français ARCADIA. Or, l’imagerie systématique montre une atteinte cervicale d’une fréquence comparable. Ainsi, dans le registre ARCADIA, l’exploration de 469 patients a trouvé une autre lésion de dysplasie chez 48 % d’entre eux et un anévrisme ou une dissection d’un autre territoire chez 18 %, soit 66,3 % d’atteintes multivasculaires. Par conséquent, la maladie doit être pensée comme une <b>artériopathie systémique</b>.</p>
<p>Le pronostic dépend donc des complications plus que des sténoses. En effet, dans le registre américain, un anévrisme, une dissection ou les deux étaient présents chez 41,7 % des patients ; dans ARCADIA, les anévrismes concernaient 26 % des patients et les dissections 15,1 %. De plus, 12,9 % des femmes du registre américain avaient un anévrisme intracrânien. En revanche, la dissection coronaire n’était rapportée que chez 2,7 % de l’ensemble des patients du registre.</p>
</section>
<section class="ilot" id="i77-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Comprendre ces complications suppose de revenir à la paroi artérielle. La maladie associe en effet une prolifération cellulaire anormale et une architecture désorganisée de la paroi (consensus 2019). Dans la forme multifocale, les rétrécissements et les zones dilatées créent ainsi des « voiles » intraluminaux ; or, ces voiles et ces dilatations peuvent servir de point de départ à l’agrégation plaquettaire, ce qui justifie l’antiagrégation.</p>
<p>Cependant, l’aspect angiographique ne dit pas le retentissement. En effet, une sténose rénale multifocale peut être visuellement impressionnante sans réduire la pression en aval, ou l’inverse ; le consensus rapporte ainsi des <button class="w" data-k="i77-gradient">gradients de pression translésionnels (rapport Pd/Pa)</button> très variables entre des artères d’aspect identique. Par conséquent, seule la mesure de pression permet de décider d’une dilatation. De plus, le flux rénal et la sécrétion de rénine sont souvent normaux, et l’atteinte est souvent bilatérale ; le dosage de rénine dans les veines rénales ne latéralise donc pas toujours.</p>
<p>Enfin, la fragilité pariétale explique les autres manifestations. Ainsi, une <button class="w" data-k="i77-dac">dissection des artères cervicales (définition)</button> se traduit par une douleur cervicale ou céphalique unilatérale et des signes neurologiques focaux. De même, une dissection rénale peut provoquer un infarctus rénal, et un anévrisme peut se rompre ou emboliser.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Sténose : hypertension rénovasculaire ou souffle. Paroi fragile : dissection et anévrisme. Voiles et dilatations : thrombose et embolie. Chaque mécanisme appelle donc sa réponse : correction de la pression, imagerie de dépistage des anévrismes, antiagrégation.</div>
</section>
<section class="ilot" id="i77-4"><h2><span class="n">4</span>Étiologies et facteurs associés</h2>
<p>Si les mécanismes sont décrits, la cause reste en revanche mal connue. Le consensus 2019 retient en effet une combinaison de facteurs génétiques et environnementaux. Sur le plan génétique, d’abord, seule une minorité de patients (1,9 à 7,3 %) rapporte un apparenté atteint. En outre, une étude d’association pangénomique a identifié un variant fréquent du locus <button class="w" data-k="i77-phactr1">PHACTR1 (variant de susceptibilité)</button>, qui augmente le risque d’environ 1,4 fois.</p>
<p>Sur le plan environnemental, ensuite, le <b>tabagisme</b> est associé à la forme rénale (rapport de cotes de 2,5 à 4,05 pour le tabagisme actuel) ; de plus, les fumeurs ont un diagnostic plus précoce et davantage d’anévrismes. Toutefois, le tabac n’est pas une condition nécessaire. De même, les hormones féminines sont suspectées en raison de la prédominance féminine, mais aucun lien causal avec la contraception orale n’a été établi. Enfin, des facteurs mécaniques sont évoqués pour certains sites, comme l’artère rénale droite plus souvent que la gauche, la carotide interne moyenne et distale ou l’artère iliaque externe.</p>
<div class="trap"><span class="k">Piège</span>Demander un test génétique ou dépister les apparentés asymptomatiques. Il n’existe aucun test génétique propre à la dysplasie fibromusculaire ; les apparentés ne sont donc explorés qu’en présence de symptômes ou de signes évocateurs (consensus 2019).</div>
</section>
