<template data-pop="d73-rate-fonctions" data-title="La rate normale : fonctions">
<div class="lab">Définition</div><p>La rate est le plus grand organe lymphoïde. Son anatomie permet de surveiller et de phagocyter les éléments circulants du sang (de Porto 2010).</p>
<div class="lab">Trois fonctions</div><p>Défense : filtration et phagocytose des bactéries circulantes, production d’anticorps opsonisants et d’éléments de la voie alterne du complément. Contrôle des globules rouges : le pitting retire leurs inclusions (corps de Howell-Jolly) ou élimine l’érythrocyte qui les contient. Réservoir : environ un tiers des plaquettes et une part importante des leucocytes y résident.</p>
<div class="lab">Application</div><p>Chaque fonction a sa maladie : le déficit de défense donne l’infection fulminante, la rétention excessive donne les cytopénies, et la perte du contrôle donne les anomalies du frottis.</p>
<div class="lab">Limite</div><p>Les autres organes du système réticulo-endothélial ne compensent ces fonctions que partiellement (OFSP 2015).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2995208/" target="_blank" rel="noopener">Revue d’Amsterdam 2010</a> ; <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a>.</p></template>
<template data-pop="d73-zone-marginale" data-title="Zone marginale">
<div class="lab">Définition</div><p>Région de la rate où les macrophages captent des bactéries encapsulées entières et déclenchent une réponse humorale.</p>
<div class="lab">Mécanisme</div><p>Les lymphocytes B de la zone marginale répondent aux antigènes thymo-indépendants de type 2 des bactéries encapsulées. Ils se différencient rapidement en plasmocytes sécrétant des IgM, des IgG et des IgA.</p>
<div class="lab">Application</div><p>Leur nombre diminue après splénectomie, et les lymphocytes B mémoire IgM sont absents du sang des splénectomisés : la rapidité de la première défense contre le pneumocoque disparaît.</p>
<div class="lab">Limite</div><p>Le dosage des lymphocytes B mémoire IgM est encore à valider comme marqueur de fonction.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2995208/" target="_blank" rel="noopener">de Porto et al., 2010</a>.</p></template>
<template data-pop="d73-pitting" data-title="Pitting (« épépinage »)">
<div class="lab">Définition</div><p>La rate débarrasse l’érythrocyte de ses inclusions, par exemple les corps de Howell-Jolly, ou élimine l’érythrocyte qui les contient.</p>
<div class="lab">Application</div><p>En l’absence de rate efficace, les inclusions restent : corps de Howell-Jolly sur le frottis et érythrocytes « piquetés » en contraste interférentiel (0 à 4 % chez le sujet normal ; plus de 4 % en hyposplénisme).</p>
<div class="lab">Limite</div><p>Le compte des piquetés dépiste ; la scintigraphie confirme.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2995208/" target="_blank" rel="noopener">de Porto et al., 2010</a>.</p></template>
<template data-pop="d73-howell" data-title="Corps de Howell-Jolly">
<div class="lab">Définition</div><p>Reliquats d’ADN nucléaire basophile, que la rate retire normalement de l’érythrocyte.</p>
<div class="lab">Application</div><p>Leur présence évoque une rate absente ou peu efficace. Ils s’ajoutent à d’autres anomalies du frottis : acanthocytes, cellules cibles, corps de Heinz, sidérocytes, corps de Pappenheimer.</p>
<div class="trap"><span class="k">Piège</span> Leur corrélation avec la scintigraphie est mauvaise ; ils ne détectent pas l’hyposplénisme léger. Un frottis sans Howell-Jolly n’exclut donc pas une fonction altérée.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2995208/" target="_blank" rel="noopener">de Porto et al., 2010</a> ; <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a>.</p></template>
<template data-pop="d73-scinti" data-title="Scintigraphie de la fonction splénique">
<div class="lab">Définition</div><p>Examen de référence de la fonction splénique : érythrocytes autologues marqués au technétium 99m et altérés par la chaleur, réinjectés, idéalement avec une imagerie SPECT-CT.</p>
<div class="lab">Principe</div><p>Une rate normale capte environ 90 % de ces érythrocytes altérés, alors qu’un colloïde soufré (environ 10 % splénique) est surtout phagocyté par le foie. La proportion captée par la rate mesure donc sa fonction de filtration.</p>
<div class="lab">Application</div><p>Elle confirme un hyposplénisme dépisté par le compte d’érythrocytes piquetés. Avec des érythrocytes ou des plaquettes marqués, elle évalue aussi la séquestration splénique pathologique.</p>
<div class="lab">Limite</div><p>Elle n’est pas adaptée au dépistage de masse.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2995208/" target="_blank" rel="noopener">de Porto et al., 2010</a>.</p></template>
<template data-pop="d73-nosologie" data-title="Hyposplénisme et asplénie">
<div class="lab">Définition</div><p>L’hyposplénisme est une altération acquise de la fonction splénique ; l’asplénie est l’absence de rate, le plus souvent chirurgicale. L’asplénie fonctionnelle est assimilée à l’asplénie anatomique pour le risque infectieux.</p>
<div class="lab">Reste de tissu</div><p>Après splénectomie subtotale, le risque infectieux est corrélé à la quantité de tissu splénique et à l’intégrité de sa vascularisation ; l’autogreffe ectopique ne protège pas de façon fiable. Les patients ayant eu une embolisation post-traumatique ne sont pas considérés comme aspléniques, sauf en cas de nécrose complète (CHUV 2026).</p>
<div class="lab">Divergence</div><p>La recommandation britannique 2024 (résumé lu seulement) inclut parmi les patients à risque la splénectomie partielle et l’embolisation splénique. Le cours suit la position suisse du CHUV, et signale la divergence.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(10)61493-6" target="_blank" rel="noopener">Di Sabatino 2011</a> ; <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a> ; <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a> ; <a href="https://doi.org/10.1111/bjh.19361" target="_blank" rel="noopener">BSH 2024, résumé</a>.</p></template>
<template data-pop="d73-asplenie-fonctionnelle" data-title="Asplénie fonctionnelle : causes et risque">
<div class="lab">Causes</div><p>Thalassémie ; drépanocytose homozygote et formes mixtes HbS/C et HbS/β-thalassémie (pas le trait asymptomatique) ; syndromes lymphoprolifératifs ; 6 à 12 mois après greffe de cellules souches ; réaction chronique du greffon contre l’hôte ; maladie cœliaque compliquée ou associée à d’autres maladies auto-immunes ; irradiation splénique (OFSP 2015). Autres associations : maladies inflammatoires chroniques de l’intestin et lupus érythémateux systémique (de Porto 2010).</p>
<div class="lab">Risque</div><p>Le risque relatif est le plus élevé dans ces situations, plus que pour la splénectomie traumatique ou le purpura thrombopénique immunologique.</p>
<div class="lab">Application</div><p>Toute personne atteinte de l’une de ces maladies est à considérer comme asplénique pour la vaccination et la règle de la fièvre.</p>
<p class="src">Références : <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2995208/" target="_blank" rel="noopener">de Porto 2010</a>.</p></template>
<template data-pop="d73-opsi" data-title="Infection fulminante post-splénectomie">
<div class="lab">Définition</div><p>L’infection fulminante post-splénectomie (OPSI, « overwhelming post-splenectomy infection ») est un sepsis rapidement progressif du patient asplénique, d’une létalité d’environ 50 % (jusqu’à 70 % dans une revue).</p>
<div class="lab">Épidémiologie</div><p>Incidence des infections potentiellement létales : 0,23 à 0,42 % par an ; risque cumulé jusqu’à 5 % ; 30 % la première année, 50 % dans les deux premières ; risque augmenté toute la vie.</p>
<div class="lab">Clinique</div><p>Début non spécifique (état subfébrile, myalgies, pharyngite, parfois troubles digestifs), puis défaillance multiviscérale en quelques heures. Toute fièvre chez un patient asplénique est un signal d’alarme.</p>
<div class="lab">Application</div><p>Voir la règle de la fièvre : consultation immédiate, antibiotique de réserve si aucun médecin n’est joignable dans l’heure.</p>
<p class="src">Références : <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2995208/" target="_blank" rel="noopener">de Porto 2010</a>.</p></template>
<template data-pop="d73-pneumocoque" data-title="Streptococcus pneumoniae chez l’asplénique">
<div class="lab">Fait</div><p>Le pneumocoque cause jusqu’à 90 % des infections menaçant la vie chez l’asplénique (OFSP 2015).</p>
<div class="lab">Autres agents</div><p>Le risque accru pour le méningocoque ne fait pas l’unanimité et il est déduit par analogie ; Haemophilus influenzae de type b est devenu rare depuis la vaccination de routine avant 5 ans ; streptocoques du groupe B, Staphylococcus aureus, salmonelles, Escherichia coli sont décrits.</p>
<div class="lab">Application</div><p>La prévention vise donc d’abord le pneumocoque (vaccin conjugué 21-valent), puis les méningocoques.</p>
<p class="src">Références : <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a> ; <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a>.</p></template>
<template data-pop="d73-capno" data-title="Capnocytophaga canimorsus">
<div class="lab">Fait</div><p>Cette bactérie cause un sepsis grave chez l’asplénique après morsure ou griffure de chien ou de chat (OFSP 2015).</p>
<div class="lab">Application</div><p>Toute morsure ou griffure impose une consultation rapide chez le patient asplénique. L’information remise au patient le précise.</p>
<div class="lab">Limite</div><p>Les sources lues ne détaillent pas le traitement spécifique.</p>
<p class="src">Références : <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a> ; <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a>.</p></template>
<template data-pop="d73-crp-opsi" data-title="Protéine C réactive et OPSI">
<div class="lab">Fait</div><p>Au début d’un sepsis post-splénectomie, la protéine C réactive est normale ou à peine élevée ; elle peut rassurer à tort.</p>
<div class="lab">Application</div><p>Chez le patient asplénique fébrile, ne pas attendre une élévation de la protéine C réactive pour agir. La décision se fonde sur la fièvre et le contexte.</p>
<p class="src">Références : <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a>.</p></template>
<template data-pop="d73-dameshek" data-title="Critères de Dameshek (1955)">
<div class="lab">Définition</div><p>Quatre critères de l’hypersplénisme : cytopénie d’une ou plusieurs lignées ; hyperplasie médullaire compensatrice ; splénomégalie ; correction des cytopénies après splénectomie.</p>
<div class="lab">Application</div><p>Les quatre ne sont pas toujours réunis. La forme occulte associe une moelle compensatrice sans cytopénie, jusqu’à une agression médullaire.</p>
<div class="lab">Classification</div><p>Primaire (cause inconnue), secondaire (cirrhose avec hypertension portale, la plus fréquente ; paludisme ; lupus, polyarthrite rhumatoïde, sarcoïdose ; néoplasies ; hémolyse chronique ; lipidoses ; néoplasies myéloprolifératives) ou occulte.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5038876/" target="_blank" rel="noopener">Lv et al., 2016</a>.</p></template>
<template data-pop="d73-sequestration" data-title="Séquestration splénique">
<div class="lab">Mécanisme</div><p>Normalement, environ un tiers des plaquettes est dans la rate ; en hypersplénisme, 50 à 90 %. Cette proportion se normalise après splénectomie.</p>
<div class="lab">Autres mécanismes</div><p>Phagocytose accrue par des macrophages activés ; auto-anticorps antiplaquettes (anti-GPIIb-IIIa chez 64 % des hépatopathes chroniques dans une étude citée) ; consommation plaquettaire.</p>
<div class="lab">Application</div><p>En hypertension portale, la rate atteint 8 à 10 fois sa taille normale ; la taille s’évalue à l’échographie et la séquestration par des plaquettes marquées au chrome 51.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5038876/" target="_blank" rel="noopener">Lv et al., 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2995208/" target="_blank" rel="noopener">de Porto 2010</a>.</p></template>
<template data-pop="d73-seuils-taille" data-title="Seuils de taille de la rate">
<div class="lab">Définition</div><p>Grand axe ≥ 13 cm à l’échographie ou > 10 cm au scanner, poids > 291 g : splénomégalie. Massive si grand axe > 18 cm, poids > 1500 g ou rate palpable jusqu’à l’ombilic (Curovic 2017). Baveno VII retient une rate ≥ 13 cm comme signe non spécifique d’hypertension portale.</p>
<div class="lab">Causes</div><p>La splénomégalie est presque toujours due à une maladie extra-splénique. Dans la splénomégalie massive, les causes hématologiques atteignent 64 %.</p>
<div class="lab">Limite</div><p>Ces seuils sont ceux d’une cohorte et d’un consensus ; le laboratoire d’imagerie local peut utiliser d’autres références.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5685614/" target="_blank" rel="noopener">Curovic 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">Baveno VII</a>.</p></template>
<template data-pop="d73-splenomegalie-causes" data-title="Causes d’une splénomégalie : cohorte danoise">
<div class="lab">Population</div><p>Cohorte d’Odense, 118 patients : causes hématologiques 39 % (lymphomes 43 %, néoplasies myéloprolifératives 34 %, leucémie lymphoïde chronique et leucémie à tricholeucocytes 13 %), hépatiques 18 %, infectieuses 10 % (mononucléose, cytomégalovirus, endocardite), spléniques primaires 3 %, inflammatoires 2 %, idiopathiques 25 %.</p>
<div class="lab">Application</div><p>Fièvre et adénopathies orientent vers une cause infectieuse, mais une hémopathie doit être exclue, surtout chez le sujet âgé. Hépatomégalie, signes d’hépatopathie et thrombopénie sont plus fréquents dans le groupe hépatique. Penser à la maladie de Gaucher en cas de splénomégalie inexpliquée. Parmi les splénomégalies hépatiques, la cirrhose représente 62 %.</p>
<div class="lab">Limite</div><p>Cohorte danoise monocentrique ; elle décrit l’ordre de grandeur, pas la fréquence suisse.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5685614/" target="_blank" rel="noopener">Curovic Rotbain 2017</a>.</p></template>
<template data-pop="d73-baveno" data-title="Hypertension portale : repères de Baveno VII">
<div class="lab">Définition</div><p>Hypertension portale cliniquement significative : gradient de pression veineuse hépatique ≥ 10 mmHg ; ce gradient est la méthode de référence.</p>
<div class="lab">Repères</div><p>Élasticité hépatique ≤ 15 kPa avec plaquettes ≥ 150 G/l : exclut l’hypertension portale cliniquement significative dans la maladie hépatique chronique avancée compensée. Plaquettes ≤ 150 G/l ou élasticité ≥ 20 kPa : dépister les varices. Élasticité splénique < 21 kPa ou > 50 kPa : exclut ou affirme l’hypertension portale cliniquement significative dans les hépatites virales ; ≤ 40 kPa : faible probabilité de varices à haut risque.</p>
<div class="lab">Thrombose porte</div><p>Thrombose porte récente non cirrhotique : guérit rarement spontanément ; héparine de bas poids moléculaire, puis antivitamine K.</p>
<div class="lab">Lacune</div><p>L’hypertension portale segmentaire par thrombose de la veine splénique d’origine pancréatique n’est pas couverte par une source européenne lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11090185/" target="_blank" rel="noopener">Baveno VII, J Hepatol 2022</a>.</p></template>
<template data-pop="d73-embolisation" data-title="Embolisation splénique partielle">
<div class="lab">Principe</div><p>Occlusion partielle des vaisseaux de la rate pour réduire son volume fonctionnel en hypersplénisme.</p>
<div class="lab">Preuves</div><p>Elle augmente les plaquettes et les leucocytes, avec un risque d’infarctus et d’abcès. Une méta-analyse (études surtout chinoises) trouve une hausse de plaquettes plus forte avec la splénectomie, mais moins de complications avec l’embolisation (rapport de cotes 0,53) et une hospitalisation plus courte. Les complications mineures (syndrome post-embolisation) sont fréquentes ; les majeures sont plus rares mais parfois mortelles (revue de 2020, source américaine non retenue pour fonder une conduite).</p>
<div class="lab">Limite</div><p>Les données viennent surtout de populations chinoises avec cirrhose.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5038876/" target="_blank" rel="noopener">Lv 2016</a> ; <a href="https://doi.org/10.1080/13645706.2021.1933535" target="_blank" rel="noopener">Huang 2021, résumé</a> ; <a href="https://doi.org/10.1016/j.jvir.2019.08.015" target="_blank" rel="noopener">Talwar 2020, résumé</a>.</p></template>
<template data-pop="d73-splenectomie" data-title="Complications de la splénectomie">
<div class="lab">Données</div><p>Complications post-opératoires de 20 à 52 % et mortalité de 1,2 à 2,4 % dans des études récentes ; risque accru de thrombose et d’infection (Curovic 2017). L’hyposplénisme et l’asplénie peuvent prédisposer aux événements thromboemboliques (Di Sabatino 2011).</p>
<div class="lab">Application</div><p>La splénectomie est réservée aux formes sévères d’hypersplénisme, aux abcès volumineux, aux kystes à risque de malignité ou de récidive, aux ruptures ; elle est toujours précédée de vaccination quand elle est programmée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5685614/" target="_blank" rel="noopener">Curovic 2017</a> ; <a href="https://doi.org/10.1016/S0140-6736(10)61493-6" target="_blank" rel="noopener">Di Sabatino 2011</a>.</p></template>
