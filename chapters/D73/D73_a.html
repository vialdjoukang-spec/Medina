<section class="ilot" id="d73-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Trois situations se présentent au médecin de premier recours. Dans la première, la rate manque ou ne fonctionne plus, et le patient court un risque d’infection fulminante toute sa vie. Dans la deuxième, la rate est trop grosse et trop active : le sang est retenu et détruit dans l’organe, et une ou plusieurs lignées cellulaires diminuent. Dans la troisième, une lésion focale (abcès, kyste, infarctus, rupture) occupe l’hypochondre gauche. Le chapitre D73 de la CIM-10-GM 2024 réunit ces trois situations sous un seul code, et le cours suit donc ces trois axes plutôt que l’ordre des sous-codes.</p>
<p>Dans cette <b>vignette fictive</b>, une femme de 34 ans, splénectomisée à 31 ans pour un traumatisme abdominal, consulte un samedi soir : elle a 38,2 °C, des myalgies et un mal de gorge depuis quatre heures. Sa <button class="w" data-k="d73-crp-opsi">protéine C réactive</button> est à peine élevée. Le médecin ne peut pas conclure à une virose banale : devant tout épisode fébrile chez un patient asplénique, il suspecte une <button class="w" data-k="d73-opsi">infection fulminante post-splénectomie (OPSI)</button> jusqu’à preuve du contraire. La vignette sert à discuter la reconnaissance de l’urgence, puis la prévention qui aurait réduit le risque.</p>
<div class="key"><b>À retenir.</b> Une rate absente, une rate trop active et une lésion splénique focale sont trois problèmes distincts. La première question est toujours : <i>ce patient a-t-il encore une rate qui fonctionne ?</i> Si la réponse est non, toute fièvre est une urgence.</div>

</section>
<section class="ilot" id="d73-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La CIM-10-GM 2024 rattache huit codes à D73. Le tableau suivant les situe, puis le cours les regroupe selon trois axes de raisonnement. Le code <b>Q89.01</b> (asplénie congénitale) et le code <b>Q89.00</b> (splénomégalie congénitale), la splénomégalie sans précision <b>R16.1</b> et la rupture traumatique <b>S36.04</b> sont exclus de D73 par la classification <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc D70–D77</a>.</p>
<table class="t"><thead><tr><th>Code</th><th>Entité</th><th>Axe du cours</th><th>Précision de la classification</th></tr></thead><tbody><tr><td>D73.0</td><td>Hyposplénisme</td><td>Déficit de fonction</td><td>Inclut l’asplénie après splénectomie et l’atrophie de la rate ; exclut l’asplénie congénitale (Q89.01).</td></tr><tr><td>D73.1</td><td>Hypersplénisme</td><td>Excès de fonction</td><td>Exclut la splénomégalie congénitale (Q89.00) et la splénomégalie sans précision (R16.1).</td></tr><tr><td>D73.2</td><td>Splénomégalie congestive chronique</td><td>Excès de fonction</td><td>Congestion veineuse de l’organe, en pratique par hypertension portale.</td></tr><tr><td>D73.3</td><td>Abcès de la rate</td><td>Lésion focale</td><td>Collection suppurée intrasplénique.</td></tr><tr><td>D73.4</td><td>Kyste de la rate</td><td>Lésion focale</td><td>Parasitaire ou non parasitaire.</td></tr><tr><td>D73.5</td><td>Infarctus de la rate</td><td>Lésion focale</td><td>Inclut la rupture splénique non traumatique et la torsion ; exclut la rupture traumatique (S36.04).</td></tr><tr><td>D73.8</td><td>Autres maladies de la rate</td><td>Lésion focale ou non précisée</td><td>Fibrose splénique sans précision, périsplénite, splénite sans précision.</td></tr><tr><td>D73.9</td><td>Maladie de la rate, sans précision</td><td>—</td><td>Code de repli, sans diagnostic précis.</td></tr></tbody></table>
<p>Le tableau appelle un commentaire. D73.0 est l’entité dont l’enjeu vital est le plus grand : l’<button class="w" data-k="d73-nosologie">hyposplénisme et l’asplénie</button> exposent à une septicémie dont la létalité atteint environ 50 %. D73.1 et D73.2 forment un couple : la congestion de la rate (D73.2) produit souvent l’hypersplénisme (D73.1), mais l’hypersplénisme peut survenir sans congestion. Les codes D73.3 à D73.5 désignent des lésions que l’imagerie met en évidence. Enfin, D73.8 et D73.9 regroupent des entités pour lesquelles les sources lues ne donnent pas de conduite spécifique.</p>
<p>Trois définitions fondent la suite. L’<b>hyposplénisme</b> est une altération acquise de la fonction splénique, causée par plusieurs maladies hématologiques et immunologiques ; l’<b>asplénie</b> est l’absence de rate, rarement congénitale et le plus souvent chirurgicale <a href="https://doi.org/10.1016/S0140-6736(10)61493-6" target="_blank" rel="noopener">Di Sabatino, Lancet 2011</a>. L’asplénie fonctionnelle (rate présente mais inefficace) est assimilée à l’asplénie anatomique pour le risque infectieux <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a>. L’<b>hypersplénisme</b> désigne l’association d’une splénomégalie et d’une cytopénie périphérique de causes variées <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5038876/" target="_blank" rel="noopener">Lv et al., 2016</a>.</p>
<div class="trap"><span class="k">Vocabulaire</span> « Splénomégalie » et « hypersplénisme » ne sont pas synonymes. La splénomégalie est un signe (une rate plus grosse) ; l’hypersplénisme associe ce signe à une cytopénie. Une rate volumineuse peut rester sans cytopénie, et la splénomégalie sans précision relève du code R16.1, hors D73.</div>
<button class="pareto-btn ui" data-k="pareto-d73-definition">▲ Loi de Pareto — Définition et classification</button>

</section>
<section class="ilot" id="d73-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p>Aucune source suisse ou européenne lue ne donne l’incidence globale des maladies de la rate en Suisse. Les chiffres disponibles décrivent chaque entité séparément et proviennent de séries de tailles et d’origines très différentes ; le tableau précise la population de chaque chiffre pour qu’on ne les compare pas à tort.</p>
<table class="t"><thead><tr><th>Entité</th><th>Chiffre</th><th>Population et source</th></tr></thead><tbody><tr><td>Infections potentiellement létales après asplénie</td><td>0,23 à 0,42 % par an (un cas pour 300 à 500 patients-années) ; risque cumulé sur la vie jusqu’à 5 %</td><td>Patients aspléniques, texte de l’OFSP 2015 (état 2015).</td></tr><tr><td>Létalité du sepsis post-splénectomie</td><td>Environ 50 % (jusqu’à 70 % dans une revue)</td><td>OFSP 2015 ; revue d’Amsterdam 2010.</td></tr><tr><td>Moment des infections</td><td>30 % la première année, 50 % dans les deux premières ; risque augmenté toute la vie</td><td>OFSP 2015.</td></tr><tr><td>Abcès de la rate</td><td>0,14 à 0,7 % des autopsies</td><td>Série de Pavie, 2009.</td></tr><tr><td>Kyste de la rate</td><td>0,07 à 0,13 % des autopsies</td><td>Revue 2024.</td></tr><tr><td>Infarctus splénique</td><td>0,016 % des admissions en médecine sur 10 ans (32 patients, âge médian 64 ans)</td><td>Hôpital universitaire israélien, 2015.</td></tr><tr><td>Rupture non traumatique</td><td>Mortalité 12,2 % (845 patients) ; 8,7 % (400 cas, 2015–2025)</td><td>Revue de l’Inselspital de Berne, 2009 ; revue estonienne, 2026.</td></tr></tbody></table>
<p>Trois enseignements découlent de ce tableau. D’abord, le risque infectieux de l’asplénie est faible à l’échelle d’une année mais cumulatif, et il est aggravé par la maladie sous-jacente : après une splénectomie non traumatique, l’hémoglobinopathie ou le cancer hématologique et leur traitement (chimiothérapie, corticothérapie) contribuent de manière décisive au risque <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a>. Ensuite, le risque relatif est le plus faible après splénectomie traumatique ou pour purpura thrombopénique immunologique, et le plus élevé dans les <button class="w" data-k="d73-asplenie-fonctionnelle">asplénies fonctionnelles</button> ; la létalité est plus élevée chez l’enfant. Enfin, les patients aspléniques sont insuffisamment informés de leur risque : des données suisses (Suisse orientale, patients oncologiques), citées par l’OFSP, le documentent, mais leurs sources primaires n’ont pas été lues pour ce cours.</p>
<div class="key"><b>À retenir.</b> Le danger de l’asplénie n’est pas la fréquence de l’infection, mais sa vitesse et sa létalité : une défaillance multiviscérale en quelques heures, et une mortalité d’environ un patient sur deux.</div>
<div class="trap"><span class="k">Population des chiffres</span> Les séries d’infarctus, de kystes et d’abcès viennent d’hôpitaux isolés ou d’autopsies. Elles décrivent la physiopathologie et l’ordre de grandeur, jamais la fréquence en médecine ambulatoire suisse.</div>
<button class="pareto-btn ui" data-k="pareto-d73-epid">▲ Loi de Pareto — Fréquence et pronostic</button>

</section>
<section class="ilot" id="d73-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le raisonnement part de la rate normale. La <button class="w" data-k="d73-rate-fonctions">rate</button> est le plus grand organe lymphoïde ; son anatomie lui permet de surveiller et de phagocyter les éléments circulants du sang <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2995208/" target="_blank" rel="noopener">de Porto et al., 2010</a>. Elle reçoit 5 % du débit cardiaque, ce qui l’expose aux embols <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4616622/" target="_blank" rel="noopener">Schattner et al., 2015</a>. Elle remplit trois fonctions : une fonction de défense (filtration des bactéries, production d’anticorps opsonisants, voie alterne du complément), une fonction de contrôle de qualité des globules rouges (le <button class="w" data-k="d73-pitting">pitting</button>) et une fonction de réservoir (environ un tiers des plaquettes y réside normalement).</p>
<p>Chaque axe du cours correspond à la défaillance d’une de ces fonctions ou à une atteinte de l’organe lui-même.</p>
<div class="two"><div class="card"><h4>Axe 1 — Déficit de fonction (D73.0)</h4><p>La <button class="w" data-k="d73-zone-marginale">zone marginale</button> ne capte plus les bactéries encapsulées entières et ne déclenche plus la réponse humorale rapide. Les lymphocytes B de la zone marginale diminuent après splénectomie, et les lymphocytes B mémoire IgM sont absents du sang. Les autres organes du système réticulo-endothélial ne compensent que partiellement. La conséquence est une bactériémie non contrôlée par <button class="w" data-k="d73-pneumocoque"><i>Streptococcus pneumoniae</i></button> surtout, d’où la prévention vaccinale.</p>
</div><div class="card"><h4>Axe 2 — Excès de fonction ou congestion (D73.1, D73.2)</h4><p>La rate augmente de volume (jusqu’à 8 à 10 fois sa taille normale en hypertension portale) et retient davantage de cellules. La <button class="w" data-k="d73-sequestration">séquestration</button> fait passer la fraction plaquettaire splénique d’environ un tiers à 50–90 % ; s’y ajoutent une phagocytose accrue par des macrophages activés, des auto-anticorps antiplaquettes et une consommation plaquettaire. Les cellules sont détruites ou stockées, d’où des cytopénies avec une moelle compensatrice.</p>
</div><div class="card"><h4>Axe 3 — Lésion focale (D73.3 à D73.5)</h4><p>Une occlusion artérielle (embole, thrombose) cause l’<button class="w" data-k="d73-infarctus">infarctus</button>, qui peut se surinfecter en abcès ; un embol septique, une bactériémie ou une extension locale causent l’<button class="w" data-k="d73-abces">abcès</button> ; un kyste est parasitaire ou non ; une rate pathologique (néoplasique, infectieuse ou inflammatoire) peut se rompre sans traumatisme, c’est la <button class="w" data-k="d73-rupture">rupture non traumatique</button>. La mobilité excessive de la rate (laxité des ligaments) expose à une <button class="w" data-k="d73-torsion">torsion</button>.</p>
</div></div>
<figure><svg viewBox="0 0 560 250" role="img" aria-label="Figure 1 — Trois axes des maladies de la rate" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="280" cy="40" rx="90" ry="26"/><path d="M230 62L110 120M280 66V120M330 62L450 120" /><rect x="20" y="120" width="180" height="110" rx="6"/><rect x="190" y="120" width="180" height="110" rx="6"/><rect x="360" y="120" width="180" height="110" rx="6"/></g><g fill="currentColor" text-anchor="middle"><text x="280" y="44">Rate : D73</text><text x="110" y="145" font-weight="bold">Déficit de fonction</text><text x="110" y="168">D73.0</text><text x="110" y="190">asplénie, hyposplénisme</text><text x="110" y="212">risque : OPSI</text><text x="280" y="145" font-weight="bold">Excès de fonction</text><text x="280" y="168">D73.1, D73.2</text><text x="280" y="190">hypersplénisme, congestion</text><text x="280" y="212">risque : cytopénies</text><text x="450" y="145" font-weight="bold">Lésion focale</text><text x="450" y="168">D73.3, D73.4, D73.5, D73.8</text><text x="450" y="190">abcès, kyste, infarctus</text><text x="450" y="212">rupture, torsion</text></g></svg><figcaption>Figure 1 — Les trois axes de raisonnement du chapitre D73. Un patient peut passer d’un axe à l’autre : l’embolisation d’un hypersplénisme peut infarcir la rate, et la splénectomie crée l’asplénie.</figcaption></figure>
<p>Les trois axes se chevauchent. L’embolisation splénique thérapeutique d’un hypersplénisme peut ainsi provoquer un infarctus puis un abcès ; l’infarctus de l’endocardite peut évoluer vers l’abcès dans jusqu’à 5 % des cas ; et la splénectomie, traitement d’une lésion focale ou d’un hypersplénisme, crée l’asplénie. Un patient peut donc passer d’un axe à l’autre au cours de sa maladie.</p>
<div class="trap"><span class="k">Piège</span> La fonction splénique n’est pas figée : dans les maladies inflammatoires ou immunologiques, la dysfonction peut s’aggraver en poussée et s’améliorer sous traitement, tandis que l’atrophie entraîne une perte irréversible. Une rate de taille normale ne prouve pas qu’elle fonctionne.</div>
<button class="pareto-btn ui" data-k="pareto-d73-physio">▲ Loi de Pareto — Physiopathologie</button>

</section>
<section class="ilot" id="d73-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se rangent par axe. Pour l’asplénie, la distinction essentielle oppose les causes anatomiques (chirurgie) aux <button class="w" data-k="d73-asplenie-fonctionnelle">causes fonctionnelles</button>, dont le risque infectieux est le plus élevé.</p>
<table class="t"><thead><tr><th>Entité</th><th>Causes principales</th><th>Source</th></tr></thead><tbody><tr><td>Asplénie anatomique</td><td>Splénectomie (traumatique ou non) ; absence congénitale rare (Q89.01). Une splénectomie subtotale conserve une fonction, proportionnelle à la quantité de tissu et à l’intégrité de sa vascularisation ; l’autogreffe ectopique ne protège pas de façon fiable.</td><td>OFSP 2015</td></tr><tr><td>Asplénie fonctionnelle</td><td>Thalassémie ; drépanocytose homozygote et formes mixtes (HbS/C, HbS/β-thalassémie), pas le trait hétérozygote asymptomatique ; syndromes lymphoprolifératifs ; 6 à 12 mois après greffe de cellules souches ; réaction chronique du greffon contre l’hôte ; maladie cœliaque compliquée ou associée à des maladies auto-immunes ; irradiation splénique. Associations décrites : maladies inflammatoires chroniques de l’intestin, lupus érythémateux systémique.</td><td>OFSP 2015 ; revue d’Amsterdam 2010</td></tr><tr><td>Hypersplénisme</td><td>Primaire (cause inconnue) ; secondaire : cirrhose avec hypertension portale (cause la plus fréquente), paludisme, lupus, polyarthrite rhumatoïde, sarcoïdose, néoplasies, hémolyse chronique, lipidoses, néoplasies myéloprolifératives ; forme occulte (moelle compensatrice sans cytopénie).</td><td>Lv 2016</td></tr><tr><td>Splénomégalie</td><td>Presque toujours une maladie extra-splénique : hématologique 39 % (lymphomes, néoplasies myéloprolifératives, leucémie lymphoïde chronique, leucémie à tricholeucocytes), hépatique 18 %, infectieuse 10 %, splénique primaire 3 %, inflammatoire 2 %, idiopathique 25 % (cohorte danoise de 118 patients).</td><td>Curovic 2017</td></tr><tr><td>Abcès</td><td>Infection hématogène, extension locale, embols septiques, traumatisme, drépanocytose, paludisme ; endocardite infectieuse ; chirurgie bariatrique (surtout la gastrectomie en manchon).</td><td>Ferraioli 2009 ; ESC 2023 ; Arora 2024 ; Buksh 2022</td></tr><tr><td>Kyste</td><td>Parasitaire (<i>Echinococcus granulosus</i>) ; non parasitaire : kyste vrai (épithélial, primaire) ou pseudokyste (sans revêtement épithélial, souvent post-traumatique).</td><td>Ibikunle 2024</td></tr><tr><td>Infarctus</td><td>Emboles cardiogéniques 62,5 % (fibrillation auriculaire, endocardite, procédures cardiaques) ; maladie auto-immune 12,5 % (syndrome des antiphospholipides, lupus) ; infection 12,5 % ; hémopathie avec splénomégalie 6 % ; cryptogénique (2 cas sur 32).</td><td>Schattner 2015</td></tr><tr><td>Rupture non traumatique</td><td>Rate pathologique dans 93 % : néoplasique 30,3 %, infectieuse 27,3 %, inflammatoire non infectieuse 20,0 %, médicamenteuse ou thérapeutique 9,2 %, mécanique 6,8 % ; rate normale 7 %. Dans la revue 2015–2025 : infectieuse 25,6 %, néoplasique 22,9 %, médicamenteuse 19 % (antithrombotiques, dont anticoagulants oraux directs).</td><td>Renzulli 2009 ; Pastak 2026</td></tr></tbody></table>
<p>Le tableau montre que la majorité des lésions focales de la rate sont secondaires à une maladie extra-splénique. Chez un patient donné, la cause se cherche donc avant l’organe : un embol cardiaque pour l’infarctus, une hémopathie pour la grosse rate, un foyer septique ou une valvulopathie pour l’abcès. Les facteurs de mortalité de la rupture non traumatique sont la splénomégalie, l’âge de plus de 40 ans et la néoplasie (Berne), puis l’âge de plus de 50 ans et la néoplasie (Estonie).</p>
<div class="key"><b>À retenir.</b> Une rupture splénique non traumatique est le plus souvent « pathologique » : la rate était déjà atteinte (néoplasie, infection, inflammation) ou le patient prenait un antithrombotique. Seuls 7 % des cas surviennent sur rate normale.</div>
<button class="pareto-btn ui" data-k="pareto-d73-causes">▲ Loi de Pareto — Causes et facteurs de risque</button>

</section>
<section class="ilot" id="d73-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche à répondre à deux questions : le patient a-t-il une asplénie anatomique ou fonctionnelle, et quelle lésion ou quelle cause explique le tableau actuel ?</p>
<p><b>Antécédents à rechercher.</b> Il faut penser à une asplénie devant un antécédent d’infection invasive à pneumocoque, de lymphome, de tumeur de l’estomac ou du pancréas, de chirurgie gastrique ou abdominale post-traumatique, ou de cicatrices abdominales <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a>. La présence de corps de Howell-Jolly sur un frottis ancien est un indice supplémentaire. Les patients aspléniques sont insuffisamment informés de leur risque : il faut demander explicitement s’ils ont un carnet de vaccination et un antibiotique de réserve.</p>
<p><b>Symptômes par fréquence et signification.</b></p>
<table class="t"><thead><tr><th>Symptôme</th><th>Fréquence ou contexte</th><th>Ce qu’il suggère</th></tr></thead><tbody><tr><td>Douleur abdominale</td><td>94,6 % des ruptures spontanées ; 84 % des infarctus (surtout hypochondre gauche ou épigastre) ; 16 % des infarctus sont indolores</td><td>Rupture, infarctus, abcès</td></tr><tr><td>Fièvre, douleur abdominale, masse de l’hypochondre gauche</td><td>Abcès de la rate</td><td>Abcès (embol septique, bactériémie)</td></tr><tr><td>État subfébrile, myalgies, pharyngite, troubles digestifs</td><td>Début non spécifique d’un sepsis post-splénectomie, suivi d’une défaillance multiviscérale en quelques heures</td><td>OPSI chez un patient asplénique</td></tr><tr><td>Fièvre persistante ou récurrente, bactériémie persistante</td><td>Endocardite infectieuse traitée</td><td>Complication splénique à rechercher</td></tr><tr><td>Douleur, inconfort ou ballonnement ; ou aucun symptôme</td><td>Kyste de la rate, souvent découvert fortuitement</td><td>Kyste</td></tr><tr><td>Symptômes de la cause</td><td>Hépatopathie, hémopathie, infection</td><td>Splénomégalie secondaire, hypersplénisme</td></tr></tbody></table>
<p>Le tableau appelle une précision : la douleur splénique n’est pas spécifique. Une douleur de l’hypochondre gauche avec fièvre fait penser à l’abcès ; sans fièvre et en contexte cardiaque, à l’infarctus ; avec défaillance hémodynamique, à la rupture. La fièvre et les vomissements sont rares dans l’infarctus.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>Fièvre sans foyer chez un patient asplénique, d’intensité modérée au début, avec myalgies et pharyngite : le tableau est banal, mais il peut évoluer en quelques heures vers une défaillance multiviscérale.</p>
</div><div class="card"><h4>Formes trompeuses</h4><p>Infarctus indolore (16 %) ; rupture spontanée chez un patient sous anticoagulant ; abcès sans douleur évidente ; kyste asymptomatique ; asplénie fonctionnelle ignorée du patient, sans cicatrice abdominale.</p>
</div></div>
<p><b>Exposition.</b> Une morsure ou une griffure de chien ou de chat fait craindre un sepsis grave à <button class="w" data-k="d73-capno"><i>Capnocytophaga canimorsus</i></button> ; un voyage en zone d’endémie palustre fait craindre un paludisme plus sévère et plus rapide chez le patient asplénique <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a>.</p>
<div class="trap"><span class="k">Piège</span> Une protéine C réactive normale ou à peine élevée au début d’un sepsis post-splénectomie peut rassurer à tort. Chez un patient asplénique, c’est la fièvre, non la biologie, qui déclenche l’urgence.</div>

</section>
<section class="ilot" id="d73-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, puis signes ciblés.</p>
<div class="two"><div class="card"><h4>État général et signes vitaux</h4><p>Le médecin recherche sans attendre les signes de sepsis (fièvre, hypotension, atteinte de plusieurs organes), car l’évolution de l’OPSI se mesure en heures. Chez le patient asplénique, toute fièvre est un signal d’alarme.</p>
</div><div class="card"><h4>Abdomen et rate</h4><p>Une rate palpable jusqu’à l’ombilic définit la <button class="w" data-k="d73-seuils-taille">splénomégalie massive</button>, qui est associée à une cause hématologique dans 64 % des cas. L’hypochondre gauche douloureux évoque un infarctus, un abcès ou une rupture. Une cicatrice abdominale (laparotomie) oriente vers une splénectomie.</p>
</div><div class="card"><h4>Signes d’hépatopathie</h4><p>Hépatomégalie, signes d’hépatopathie et thrombopénie sont plus fréquents quand la splénomégalie est d’origine hépatique, donc en hypertension portale.</p>
</div><div class="card"><h4>Signes infectieux et ganglionnaires</h4><p>Fièvre et adénopathies orientent vers une cause infectieuse, mais une hémopathie doit être exclue, surtout chez le sujet âgé. Dans l’endocardite infectieuse, les infarctus spléniques sont fréquents et souvent asymptomatiques.</p>
</div></div>
<p>Les sources lues ne détaillent pas la technique de palpation ou de percussion de la rate ; le cours ne la reproduit donc pas. La taille de la rate se mesure à l’imagerie (seuils dans la <button class="w" data-k="d73-seuils-taille">fenêtre dédiée</button>), et les infarctus, abcès et kystes se découvrent le plus souvent à l’imagerie.</p>
<div class="key"><b>À retenir.</b> L’examen oriente vers l’axe en cause, mais il ne confirme ni la lésion ni la fonction : l’imagerie précise la lésion, le frottis et la scintigraphie précisent la fonction.</div>
