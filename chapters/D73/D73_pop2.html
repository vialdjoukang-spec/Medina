<template data-pop="d73-abces" data-title="Abcès de la rate">
<div class="lab">Épidémiologie</div><p>Incidence autopsique 0,14 à 0,7 %. Série de Pavie (16 patients) : abcès bactériens (dont un tuberculeux), amibiens et fongiques.</p>
<div class="lab">Mécanismes et clinique</div><p>Infection hématogène, extension locale, embols septiques, traumatisme, drépanocytose, paludisme. Fièvre, douleur abdominale, masse de l’hypochondre gauche. Le scanner injecté est l’examen de référence.</p>
<div class="lab">Traitement</div><p>L’aspiration à l’aiguille fine sous échographie a guéri 7 des 10 abcès bactériens ; elle sert aussi de pont vers la chirurgie chez le patient fragile. Après chirurgie bariatrique (surtout gastrectomie en manchon), 27 cas : succès du traitement non chirurgical 34 %, splénectomie 41,7 %.</p>
<div class="lab">Limite</div><p>Séries de petite taille ; revue pédiatrique pour la clinique.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.ijid.2008.08.024" target="_blank" rel="noopener">Ferraioli 2009</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11350243/" target="_blank" rel="noopener">Arora 2024</a> ; <a href="https://doi.org/10.1177/0003134821991971" target="_blank" rel="noopener">Buksh 2022, résumé</a>.</p></template>
<template data-pop="d73-endocardite" data-title="Endocardite infectieuse et rate (ESC 2023)">
<div class="lab">Fait</div><p>Les infarctus spléniques sont fréquents et souvent asymptomatiques ; jusqu’à 5 % évoluent vers l’abcès.</p>
<div class="lab">Démarche</div><p>Fièvre persistante ou récurrente, douleur abdominale ou bactériémie persistante : rechercher une complication splénique par échographie, scanner, IRM ou TEP-scanner.</p>
<div class="lab">Conduite</div><p>Infarctus et abcès répondant aux antibiotiques : traitement conservateur. Gros abcès : splénectomie à discuter, en général avant la chirurgie valvulaire pour limiter le risque de réinfection de la valve. Drainage percutané ou laparoscopie si le risque opératoire est élevé. Vacciner après splénectomie. Une série roumaine ne rapporte pas de réinfection, que la splénectomie soit simultanée ou postérieure à la chirurgie valvulaire (résumé).</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023, section 9.3</a> ; <a href="https://doi.org/10.1016/j.surge.2024.06.008" target="_blank" rel="noopener">Minciuna 2024</a>.</p></template>
<template data-pop="d73-kyste" data-title="Kyste de la rate">
<div class="lab">Classification</div><p>Kystes parasitaires (hydatiques, Echinococcus granulosus) et non parasitaires : kystes vrais (épithéliaux, primaires) et pseudokystes (sans revêtement épithélial, secondaires, souvent post-traumatiques). Incidence autopsique 0,07 à 0,13 %.</p>
<div class="lab">Clinique et imagerie</div><p>Souvent asymptomatique et découvert fortuitement ; sinon douleur, inconfort ou ballonnement. Échographie, scanner et IRM précisent taille et caractère simple ou complexe ; cytoponction ou biopsie pour exclure une malignité.</p>
<div class="lab">Traitement</div><p>Petits kystes asymptomatiques : surveillance. Grands kystes : chirurgie conservatrice de la rate, surtout chez le jeune. Splénectomie : risque de malignité ou de récidive. Après approche laparoscopique conservatrice, la récidive dépasse 20 % pour les kystes vrais non parasitaires ; elle est faible pour les kystes post-traumatiques.</p>
<div class="lab">Lacune</div><p>Aucun seuil de taille d’intervention n’a été trouvé dans une source lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11636947/" target="_blank" rel="noopener">Ibikunle 2024</a> ; <a href="https://doi.org/10.1055/s-2008-1004767" target="_blank" rel="noopener">Kaiser 2008, résumé</a>.</p></template>
<template data-pop="d73-hydatique" data-title="Kyste hydatique de la rate">
<div class="lab">Cas suisse</div><p>Un cas du Valais décrit 6 semaines d’albendazole avant l’opération, puis péricystectomie totale avec splénectomie et vaccination péri-opératoire.</p>
<div class="lab">Limite</div><p>Il n’existe pas de recommandation spécifique pour l’atteinte splénique ; seul un consensus d’experts est disponible. Un cas isolé ne fonde pas une conduite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12606989/" target="_blank" rel="noopener">Caracioni 2025</a>.</p></template>
<template data-pop="d73-infarctus" data-title="Infarctus splénique">
<div class="lab">Mécanisme</div><p>Occlusion de l’artère splénique ou d’une de ses branches par un embole ou une thrombose in situ. Fréquence : 0,016 % des admissions en médecine (32 patients, âge médian 64 ans).</p>
<div class="lab">Causes</div><p>Emboles cardiogéniques 62,5 % ; maladie auto-immune 12,5 % ; infection 12,5 % ; hémopathie avec splénomégalie 6 % ; deux cas cryptogéniques. Chez 28 % des patients, aucun facteur n’était connu : une cause nouvelle a alors été trouvée chez 5 sur 9.</p>
<div class="lab">Clinique</div><p>Douleur abdominale dans 84 % (hypochondre gauche ou épigastre), indolore dans 16 % ; fièvre et vomissements rares ; leucocytes ≥ 14 G/l et LDH > 2 fois la normale chacun dans environ 25 % ; épanchement pleural gauche ou atélectasie 22 à 37,5 %.</p>
<div class="lab">Conduite</div><p>Scanner précoce ; échocardiographie et anticoagulant lupique si aucune cause. Tous les patients ont été anticoagulés (guérison complète sauf un cas ; séjour médian 6,5 jours).</p>
<div class="lab">Limite</div><p>Série rétrospective israélienne ; aucune recommandation européenne lue sur l’anticoagulation.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4616622/" target="_blank" rel="noopener">Schattner 2015</a>.</p></template>
<template data-pop="d73-rupture" data-title="Rupture splénique non traumatique">
<div class="lab">Revue bernoise (845 patients)</div><p>Rate normale 7 % (rupture idiopathique), pathologique 93 % : néoplasique 30,3 %, infectieuse 27,3 %, inflammatoire non infectieuse 20,0 %, médicamenteuse ou thérapeutique 9,2 %, mécanique 6,8 %. Splénectomie totale 84,1 %, conservateur 14,7 %, mortalité 12,2 %. Facteurs de mortalité : splénomégalie, âge > 40 ans, néoplasie.</p>
<div class="lab">Revue 2015–2025 (400 cas)</div><p>Causes infectieuses 25,6 %, néoplasiques 22,9 %, médicamenteuses 19 % (antithrombotiques, dont anticoagulants oraux directs), inflammatoires 14,6 %, idiopathiques 4,1 %. Douleur abdominale 94,6 %. Splénectomie 74,4 %, angio-embolisation 10,8 % en hausse. Mortalité 8,7 %. Facteurs : âge > 50 ans et néoplasie.</p>
<div class="lab">Limite</div><p>Séries rétrospectives agrégées ; la revue estonienne est connue par son résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/bjs.6737" target="_blank" rel="noopener">Renzulli 2009</a> ; <a href="https://doi.org/10.1016/j.jss.2025.12.029" target="_blank" rel="noopener">Pastak 2026</a>.</p></template>
<template data-pop="d73-torsion" data-title="Torsion et rate mobile">
<div class="lab">Mécanisme</div><p>Une mobilité anormale de la rate, due à la laxité ou à l’absence de ses ligaments, expose à la torsion aiguë, qui peut entraîner un infarctus.</p>
<div class="lab">Conduite</div><p>Splénopexie si la rate est viable ; splénectomie si elle est non viable (série pédiatrique de trois cas).</p>
<div class="lab">Limite</div><p>Source pédiatrique limitée ; aucune donnée adulte lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s12887-025-06005-9" target="_blank" rel="noopener">Al Blooshi 2025</a>.</p></template>
<template data-pop="d73-moment-vaccin" data-title="Moment de la vaccination">
<div class="lab">Règle</div><p>Sans immunosuppression ou avec immunosuppression chronique : au moins 2 semaines avant une splénectomie programmée. Sinon, après la phase catabolique post-opératoire mais avant la sortie de l’hôpital.</p>
<div class="lab">Immunosuppression limitée dans le temps</div><p>Corticothérapie de plus de 2 semaines à plus de 20 mg/jour de prednisone : attendre 1 mois après l’arrêt. Chimiothérapie : attendre 3 mois.</p>
<div class="lab">Immunosuppression sévère</div><p>Envisager d’autres mesures : antibioprophylaxie ou immunoglobulines parentérales.</p>
<div class="lab">Controverse</div><p>Le bénéfice d’attendre 2 semaines après la splénectomie est controversé, et l’attente expose à l’oubli de la vaccination.</p>
<p class="src">Références : <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a> ; <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a>.</p></template>
<template data-pop="d73-plaquettes-vaccin" data-title="Plaquettes et voie d’injection">
<div class="lab">Règle</div><p>Plaquettes > 20 G/l : injection intramusculaire. Entre 20 et 50 G/l : évaluation. Sous 20 G/l : voie sous-cutanée, moins immunogène et plus réactogène.</p>
<div class="lab">Application</div><p>Chez un patient thrombopénique par hypersplénisme, vérifier le compte plaquettaire avant le geste.</p>
<p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a>.</p></template>
<template data-pop="d73-reserve" data-title="Antibiotique de réserve">
<div class="lab">Principe</div><p>L’adulte asplénique reçoit une réserve à prendre en cas de fièvre si aucun médecin n’est joignable dans l’heure ; elle ne remplace pas la consultation.</p>
<div class="lab">Schéma CHUV 2026</div><p>Amoxicilline-acide clavulanique 2000 mg (2 comprimés), puis 1000 mg 2 fois par jour par voie orale ; en cas d’allergie à la pénicilline, moxifloxacine 400 mg 1 fois par jour par voie orale. Le schéma de l’OFSP 2015 était 875/125 mg, 2 comprimés initialement, puis 3 × 1 comprimé par jour 8 heures plus tard.</p>
<div class="lab">Enfant allergique</div><p>Céfprozil (allergie non IgE), clarithromycine ou clindamycine (allergie de type I).</p>
<p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a> ; <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a>.</p></template>
<template data-pop="d73-prophylaxie-enfant" data-title="Prophylaxie antibiotique continue de l’enfant">
<div class="lab">Règle</div><p>Au moins pendant les 5 premières années de vie et les 3 premières années après splénectomie. Pénicilline ou amoxicilline 2 × 125 mg/jour (0–5 ans) ou 2 × 250 mg/jour (plus de 5 ans), ou amoxicilline 20 mg/kg/jour.</p>
<div class="lab">Preuve</div><p>La seule preuve contrôlée vient de la drépanocytose de l’enfant (Gaston, 1986, cité par l’OFSP).</p>
<div class="lab">Adulte</div><p>Pas de prophylaxie continue recommandée.</p>
<p class="src">Références : <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a>.</p></template>
<template data-pop="d73-mnemo" data-title="Aide mnémotechnique de la prévention">
<div class="lab">Moyen</div><p>Quatre verbes : Informer, Vacciner, Réserver l’antibiotique, Protéger des morsures et du paludisme.</p>
<div class="lab">Contenu</div><p>Informer : règle de la fièvre, carnet, feuille d’information. Vacciner : pneumocoque conjugué, méningocoques, grippe. Réserver : amoxicilline-acide clavulanique ou moxifloxacine. Protéger : morsures, voyage.</p>
<p><i>Aide pédagogique, non critère officiel.</i></p>
<p class="src">Références : <a href="https://www.nitag-resource.org/sites/default/files/7ee0404bfafb551ae030a648d0e1bbb2024ea825_1.pdf" target="_blank" rel="noopener">OFSP 2015</a> ; <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a>.</p></template>
<template data-pop="d73-augmentin" data-title="Monographie : Augmentin (amoxicilline-acide clavulanique)">
<div class="lab">Rôle</div><p>Antibiotique de réserve de l’adulte asplénique (CHUV 2026).</p>
<div class="lab">Posologie</div><p>Comprimé filmé de 1 g (875/125). Dose de réserve : 2000 mg puis 1000 mg 2 fois par jour. L’information professionnelle mentionne 2 × 1 g/jour dans des situations particulières, jusqu’à 3 × 1 g/jour au maximum.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux pénicillines ou aux céphalosporines ; ictère ou atteinte hépatique sous un traitement antérieur par Augmentin. Pas de posologie de 2 × 1 g/jour si la clairance de la créatinine est inférieure à 30 ml/min.</p>
<div class="lab">Lacune</div><p>Le mécanisme, les effets indésirables et les interactions ne figurent pas dans l’extrait lu ; ils se vérifient dans l’information professionnelle complète (version de mars 2026).</p>
<p class="src">Références : Information professionnelle suisse Augmentin, mise à jour mars 2026, lue via l’AIPS.</p></template>
<template data-pop="d73-moxi" data-title="Monographie : moxifloxacine 400 mg">
<div class="lab">Rôle</div><p>Antibiotique de réserve en cas d’allergie à la pénicilline (CHUV 2026).</p>
<div class="lab">Posologie</div><p>400 mg par jour, indiquée à partir de 18 ans.</p>
<div class="lab">Contre-indications</div><p>Allongement du QT ; lésion tendineuse antérieure sous quinolone.</p>
<div class="lab">Lacune</div><p>Mécanisme, effets indésirables et interactions : non extraits ; voir l’information professionnelle complète (Sandoz, août 2025).</p>
<p class="src">Références : Information professionnelle suisse Moxifloxacine Sandoz 400, mise à jour août 2025, lue via l’AIPS.</p></template>
<template data-pop="d73-capvaxive" data-title="Monographie : Capvaxive (vaccin pneumococcique conjugué 21-valent)">
<div class="lab">Posologie</div><p>1 dose de 0,5 ml dès 18 ans ; la nécessité d’un rappel n’est pas établie (information professionnelle). Le protocole CHUV 2026 prévoit une dose unique sans rappel.</p>
<div class="lab">Place</div><p>Remplace, dans le protocole CHUV 2026, le Prevenar 20 de la version 2024 ; le pneumocoque reste une dose unique.</p>
<div class="lab">Moment</div><p>Au moins 2 semaines avant une splénectomie programmée, sinon avant la sortie de l’hôpital.</p>
<div class="lab">Lacune</div><p>Composition détaillée, effets indésirables et contre-indications non extraits.</p>
<p class="src">Références : Information professionnelle suisse Capvaxive, mise à jour juin 2025, lue via l’AIPS ;  ; <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a>.</p></template>
<template data-pop="d73-menquadfi" data-title="Monographie : MenQuadfi (méningocoque ACWY conjugué)">
<div class="lab">Information professionnelle</div><p>Indiqué dès 6 semaines ; 1 dose unique dès 12 mois selon l’information professionnelle ; rappel possible ; besoin de rappel non établi après primovaccination.</p>
<div class="lab">Recommandation suisse</div><p>Pour l’asplénie : 2 doses à 1 mois d’intervalle, puis rappel tous les 5 ans (CHUV 2026). Ce schéma suit la recommandation suisse, non l’information professionnelle.</p>
<div class="lab">Lacune</div><p>Contre-indications et effets indésirables non extraits.</p>
<p class="src">Références : Information professionnelle suisse MenQuadfi, mise à jour décembre 2025, lue via l’AIPS ;  ; <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a>.</p></template>
<template data-pop="d73-bexsero" data-title="Monographie : Bexsero (méningocoque B)">
<div class="lab">Information professionnelle</div><p>2 doses espacées de 1 mois minimum entre 2 et 10 ans ; rappel à envisager si le risque persiste ; des données d’immunogénicité existent en asplénie.</p>
<div class="lab">Recommandation suisse</div><p>Adulte asplénique : 2 doses à 2 mois d’intervalle, rappel tous les 5 ans (CHUV 2026).</p>
<div class="lab">Lacune</div><p>Le schéma de l’adolescent et de l’adulte de l’information professionnelle n’a pas été cité textuellement ; l’intervalle de 2 mois du CHUV fait foi pour le cours.</p>
<p class="src">Références : Information professionnelle suisse Bexsero, mise à jour novembre 2023, lue via l’AIPS ;  ; <a href="https://www.chuv.ch/fileadmin/sites/chv/documents/Splenectomie_CHV_V6_2026.pdf" target="_blank" rel="noopener">CHUV 2026</a>.</p></template>
<template data-pop="pareto-d73-definition" data-title="Pareto — Définition et classification"><p class="ratio" data-cover="d73-0,d73-1"></p><ul><li>Trois axes : déficit de fonction (D73.0), excès ou congestion (D73.1, D73.2), lésion focale (D73.3 à D73.5, D73.8).</li><li>Hyposplénisme : altération acquise de la fonction ; asplénie : absence de rate ; l’asplénie fonctionnelle équivaut à l’asplénie anatomique pour le risque infectieux.</li><li>Hypersplénisme : splénomégalie plus cytopénie ; splénomégalie sans précision = R16.1, hors D73.</li><li>Toute fièvre chez un asplénique est une urgence.</li></ul></template>
<template data-pop="pareto-d73-epid" data-title="Pareto — Fréquence et pronostic"><p class="ratio" data-cover="d73-2"></p><ul><li>OPSI : 0,23 à 0,42 % par an, 5 % sur la vie, létalité environ 50 %.</li><li>30 % des infections la première année, 50 % en deux ans ; risque à vie.</li><li>Rupture non traumatique : mortalité 8,7 à 12,2 %. Les autres chiffres viennent de séries isolées.</li></ul></template>
<template data-pop="pareto-d73-physio" data-title="Pareto — Physiopathologie"><p class="ratio" data-cover="d73-3"></p><ul><li>Rate normale : défense, contrôle des globules rouges, réservoir (un tiers des plaquettes).</li><li>Asplénie : perte de la zone marginale, bactériémie à bactéries encapsulées.</li><li>Hypersplénisme : séquestration (50 à 90 % des plaquettes), phagocytose, auto-anticorps, consommation.</li><li>Lésions focales : occlusion artérielle (infarctus), embol septique (abcès), kyste, rupture, torsion.</li></ul></template>
<template data-pop="pareto-d73-causes" data-title="Pareto — Causes et facteurs de risque"><p class="ratio" data-cover="d73-4"></p><ul><li>Asplénie fonctionnelle : drépanocytose homozygote, thalassémie, syndromes lymphoprolifératifs, greffe, maladie cœliaque, irradiation.</li><li>Hypersplénisme : cirrhose avec hypertension portale d’abord.</li><li>Infarctus : emboles cardiogéniques 62,5 %. Rupture : rate pathologique 93 %.</li></ul></template>
<template data-pop="pareto-d73-anamnese" data-title="Pareto — Anamnèse"><p class="ratio" data-cover="d73-5"></p><ul><li>Rechercher une asplénie : splénectomie, cicatrice, lymphome, chirurgie gastrique, infection invasive à pneumocoque.</li><li>Douleur : 84 % des infarctus, 94,6 % des ruptures ; 16 % des infarctus indolores.</li><li>Morsure : Capnocytophaga ; voyage : paludisme.</li></ul></template>
<template data-pop="pareto-d73-examen" data-title="Pareto — Examen clinique"><p class="ratio" data-cover="d73-6"></p><ul><li>Sepsis : fièvre, signes vitaux. Rate palpable jusqu’à l’ombilic : splénomégalie massive (64 % hématologique).</li><li>Signes d’hépatopathie : orientent vers l’hypertension portale.</li></ul></template>
<template data-pop="pareto-d73-diagnostic" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="d73-7"></p><ul><li>Question 1 : la rate fonctionne-t-elle ? Frottis, piquetés > 4 %, scintigraphie.</li><li>Question 2 : taille et congestion. Grand axe ≥ 13 cm ; gradient ≥ 10 mmHg.</li><li>Question 3 : lésion focale : scanner.</li><li>Un mécanisme sans cause n’est pas un diagnostic.</li></ul></template>
<template data-pop="pareto-d73-urgences" data-title="Pareto — Urgences"><p class="ratio" data-cover="d73-8"></p><ul><li>OPSI : consultation immédiate ; réserve si aucun médecin dans l’heure.</li><li>Rupture : splénectomie, angio-embolisation, conservateur. Endocardite : rechercher l’abcès, splénectomie à discuter avant la chirurgie valvulaire.</li><li>Splénectomie : complications 20 à 52 %, mortalité 1,2 à 2,4 %.</li></ul></template>
<template data-pop="pareto-d73-traitement" data-title="Pareto — Prise en charge"><p class="ratio" data-cover="d73-9"></p><ul><li>Vacciner au moins 2 semaines avant une splénectomie programmée : PCV21, MenACWY et MenB en 2 doses, grippe annuelle.</li><li>Réserve : amoxicilline-acide clavulanique 2 g puis 1 g 2 fois par jour ; moxifloxacine 400 mg en cas d’allergie.</li><li>Hypersplénisme : traiter la cause, puis embolisation ou splénectomie des formes sévères.</li><li>Abcès : ponction échoguidée ; kyste : surveillance ou chirurgie conservatrice ; infarctus : anticoagulation de la série, sans recommandation européenne lue.</li></ul></template>
<template data-pop="pareto-d73-suivi" data-title="Pareto — Suivi et pronostic"><p class="ratio" data-cover="d73-10"></p><ul><li>Rappels de méningocoques tous les 5 ans ; grippe chaque automne ; réserve antibiotique entretenue.</li><li>Infection pneumococcique malgré le vaccin : doser les anticorps sérotype-spécifiques.</li></ul></template>
<template data-pop="pareto-d73-terrains" data-title="Pareto — Situations particulières"><p class="ratio" data-cover="d73-11"></p><ul><li>Enfant : prophylaxie continue (5 ans de vie, 3 ans après splénectomie). Voyage : prophylaxie antipaludique stricte.</li><li>Grossesse et sports de contact : lacunes.</li></ul></template>
<template data-pop="pareto-d73-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="d73-e-1,d73-e-2,d73-e-3"></p><ul><li>Fonction : scintigraphie (référence) ; piquetés > 4 % ; Howell-Jolly peu fiables.</li><li>Taille : échographie ≥ 13 cm. Portale : gradient ≥ 10 mmHg ; élasticité hépatique ≤ 15 kPa et plaquettes ≥ 150 G/l excluent l’hypertension significative.</li><li>Lésions : scanner (abcès, infarctus) ; kyste : imagerie, ponction pour malignité.</li></ul></template>
<template data-pop="pareto-d73-anat" data-title="Pareto — Anatomie"><p class="ratio" data-cover="d73-s-anat-cours"></p><ul><li>5 % du débit cardiaque ; artère splénique (infarctus) ; drainage portal (congestion) ; ligaments (torsion).</li></ul></template>
<template data-pop="pareto-d73-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="d73-s-histo-cours"></p><ul><li>Zone marginale : macrophages, lymphocytes B, plasmocytes IgM ; frottis lit la fonction ; paroi du kyste vrai ou pseudokyste.</li></ul></template>
<template data-pop="pareto-d73-physio-s" data-title="Pareto — Physiologie"><p class="ratio" data-cover="d73-s-physio-cours"></p><ul><li>Filtration, pitting, réservoir (un tiers des plaquettes) ; scintigraphie = captation de 90 % ; hypersplénisme = 50 à 90 %.</li></ul></template>
<template data-pop="pareto-d73-immun" data-title="Pareto — Immunologie"><p class="ratio" data-cover="d73-s-immun-cours"></p><ul><li>Opsonisation et voie alterne perdues ; vaccins conjugués plutôt que polysaccharidiques ; pneumocoque jusqu’à 90 % des infections graves.</li></ul></template>
<template data-pop="pareto-d73-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="d73-p-1,d73-p-2,d73-p-3,d73-p-4"></p><ul><li>Piliers : vaccins conjugués et réserve antibiotique.</li><li>Contre-indications : allergie à la pénicilline (Augmentin), QT et tendon (moxifloxacine), clairance < 30 ml/min (2 g/jour).</li><li>À éviter : vaccin polysaccharidique 23-valent, vaccin Hib de l’adulte, prophylaxie continue de l’adulte.</li></ul></template>
