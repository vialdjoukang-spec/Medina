
<!-- ===== FENÊTRES Q21 : étiologies, syndromes, anamnèse, examen ===== -->
<template data-pop="q21-terato" data-title="Facteurs maternels et tératogènes">
<div class="lab">Maladies maternelles</div><p><b>Diabète prégestationnel</b> mal équilibré au premier trimestre : risque multiplié (transposition, tronc commun, CIV, cardiomyopathie hypertrophique fœtale transitoire) ; l’HbA1c préconceptionnelle en est le reflet. <b>Phénylcétonurie</b> non contrôlée : tétralogie, coarctation ; un régime strict avant la conception prévient le risque. <b>Lupus avec anticorps anti-Ro</b> : bloc auriculoventriculaire congénital. <b>Obésité</b> : risque modérément accru.</p>
<div class="lab">Infections</div><p><b>Rubéole congénitale</b> : canal artériel, sténoses des branches pulmonaires ; prévention par la vaccination avant la grossesse.</p>
<div class="lab">Substances et médicaments</div><p>Alcool (syndrome d’alcoolisation fœtale : CIV, CIA) ; rétinoïdes (isotrétinoïne : cardiopathies conotroncales) ; valproate ; antiépileptiques anciens ; mycophénolate ; antivitamine K au premier trimestre (embryopathie) ; <b>lithium</b> (voir la fenêtre dédiée).</p>
<div class="lab">Fenêtre de vulnérabilité</div><p>Semaines 3 à 8 de développement : l’exposition est souvent antérieure au diagnostic de grossesse, d’où l’importance de l’adaptation préconceptionnelle des traitements.</p></template>

<template data-pop="q21-lithium" data-title="Lithium, grossesse et anomalie d’Ebstein">
<div class="lab">Historique</div><p>Les registres des années 1970 avaient suggéré un risque très élevé d’anomalie d’Ebstein sous lithium. Ces registres collectaient surtout les cas malformés et surestimaient le risque.</p>
<div class="lab">Données récentes</div><p>Les grandes cohortes montrent une augmentation modérée du risque de malformation cardiaque, dose-dépendante, avec un risque absolu d’anomalie d’Ebstein qui reste faible.</p>
<div class="lab">Conduite</div><p>Décision partagée avec la patiente et le psychiatre : le risque de rechute d’un trouble bipolaire à l’arrêt du lithium, en particulier en post-partum, est souvent supérieur au risque malformatif. Dose minimale efficace, lithémies surveillées (fractionnement des prises), échocardiographie fœtale vers 18 à 22 semaines, surveillance néonatale.</p></template>

<template data-pop="q21-recurr" data-title="Risque de récurrence familiale">
<div class="lab">Cardiopathie non syndromique</div><p>Fratrie d’un enfant atteint : environ 2 à 5 %. Enfant d’un parent atteint : environ 3 à 5 % si le père est atteint, souvent plus si c’est la mère. Deux apparentés du premier degré atteints : risque plus élevé.</p>
<div class="lab">Variations selon la lésion</div><p>Les obstacles gauches (bicuspidie, coarctation, hypoplasie du cœur gauche) ont une composante héréditaire marquée : échocardiographie proposée aux apparentés du premier degré.</p>
<div class="lab">Maladie monogénique ou microdélétion</div><p>Transmission autosomique dominante : 50 % de risque pour chaque enfant, avec une expressivité variable.</p>
<div class="lab">Pratique</div><p>Conseil génétique, échocardiographie fœtale vers 18 à 22 semaines.</p></template>

<template data-pop="q21-down" data-title="Trisomie 21 et cœur">
<div class="lab">Fréquence</div><p>Une cardiopathie chez environ 40 à 50 % des enfants ; le canal atrioventriculaire en représente une grande part, puis la CIV, la CIA et le canal artériel.</p>
<div class="lab">Particularités</div><p>Maladie vasculaire pulmonaire plus précoce et plus fréquente, favorisée par l’obstruction des voies aériennes supérieures et les apnées du sommeil ; souffle parfois discret. D’où l’échocardiographie systématique à la naissance et la réparation précoce du canal atrioventriculaire complet.</p>
<div class="lab">Adulte</div><p>Dysfonction thyroïdienne, apnées du sommeil, obésité, vieillissement précoce ; Eisenmenger chez les adultes non opérés dans l’enfance. Consentement et information adaptés aux capacités de la personne.</p></template>

<template data-pop="q21-turner" data-title="Syndrome de Turner et cœur">
<div class="lab">Génétique</div><p>Monosomie X totale (45,X) ou en mosaïque ; femme de petite taille, insuffisance ovarienne.</p>
<div class="lab">Cœur et vaisseaux</div><p>Bicuspidie aortique, coarctation, dilatation de l’aorte ascendante, retour veineux pulmonaire anormal partiel, hypertension artérielle.</p>
<div class="lab">Mesure de l’aorte</div><p>La petite taille rend les diamètres absolus trompeurs : on utilise l’<b>index de taille aortique</b> (diamètre divisé par la surface corporelle, en mm/m²). Un index &gt; 25 mm/m² signale un risque élevé de dissection.</p>
<div class="lab">Grossesse</div><p>Souvent obtenue par don d’ovocytes ; la dissection aortique est la complication redoutée. Bilan de l’aorte par IRM avant la grossesse. Un index de taille aortique &gt; 25 mm/m² classe la patiente en IV de l’OMS modifiée (ESC 2018 et ESC 2025) : grossesse contre-indiquée. Entre 20 et 25 mm/m², le risque est élevé (classe III dans l’ESC 2018, II–III dans l’ESC 2025) et la décision relève d’une équipe grossesse-cœur.</p></template>

<template data-pop="q21-digeorge" data-title="Microdélétion 22q11.2 (syndrome de DiGeorge)">
<div class="lab">Génétique</div><p>Microdélétion la plus fréquente chez l’humain (environ 1 naissance sur 4 000) ; perte d’un allèle de <i>TBX1</i>, gène de la migration de la crête neurale dans les arcs pharyngiens. Transmission autosomique dominante ; souvent de novo.</p>
<div class="lab">Cœur</div><p>Cardiopathies conotroncales : interruption de l’arche aortique de type B, tronc artériel commun, tétralogie de Fallot (surtout avec atrésie pulmonaire), CIV, arc aortique droit.</p>
<div class="lab">Autres atteintes</div><p>Hypoparathyroïdie et hypocalcémie ; hypoplasie thymique et déficit lymphocytaire T ; fente ou insuffisance vélopalatine ; troubles des apprentissages ; troubles psychiatriques, avec un risque de schizophrénie nettement augmenté à l’âge adulte.</p>
<div class="lab">Conduite</div><p>Recherche par analyse chromosomique sur puce devant toute cardiopathie conotroncale ; calcium, parathormone, lymphocytes ; produits sanguins irradiés et vaccins vivants différés jusqu’au bilan immunitaire ; suivi psychiatrique et neuropsychologique.</p></template>

<template data-pop="q21-williams" data-title="Syndrome de Williams">
<div class="lab">Génétique</div><p>Microdélétion 7q11.23 incluant le gène de l’élastine (<i>ELN</i>) ; autosomique dominante, souvent de novo.</p>
<div class="lab">Vaisseaux</div><p>Artériopathie élastique diffuse : sténose aortique supravalvulaire (en sablier), sténoses des branches pulmonaires, sténoses des artères rénales et coronaires ostiales, hypertension artérielle.</p>
<div class="lab">Autres signes</div><p>Faciès caractéristique, hypercalcémie du nourrisson, déficience intellectuelle légère à modérée, sociabilité marquée avec anxiété fréquente.</p>
<div class="lab">Piège</div><p>Risque de mort subite lors d’une anesthésie ou d’une sédation, par ischémie coronaire : anesthésie en centre expérimenté.</p></template>

<template data-pop="q21-atcd-grossesse" data-title="Histoire prénatale">
<div class="lab">Questions</div><p>Échographies prénatales (anomalie cardiaque signalée, clarté nucale augmentée) ; diabète, épilepsie, trouble bipolaire, lupus ; médicaments du premier trimestre ; alcool ; infections ; procréation médicalement assistée ; grossesse gémellaire.</p>
<div class="lab">Pourquoi</div><p>Elle oriente vers une cause (tératogène, syndrome), permet d’anticiper une cardiopathie critique et de préparer le conseil génétique.</p></template>

<template data-pop="q21-atcd-fam" data-title="Histoire familiale">
<div class="lab">Questions</div><p>Cardiopathie congénitale chez un parent, un frère ou une sœur ; mort subite du sujet jeune ; dissection aortique ; syndrome connu (Marfan, Noonan, microdélétion) ; consanguinité.</p>
<div class="lab">Conséquence</div><p>Une histoire positive justifie un conseil génétique et, selon la lésion, une échocardiographie des apparentés du premier degré (bicuspidie, obstacles gauches, aortopathie).</p></template>

<template data-pop="q21-atcd-chir" data-title="Antécédents d’intervention : ce que chaque opération a laissé">
<div class="lab">Comment rechercher</div><p>Demander les comptes rendus opératoires, l’âge et le nom exact de chaque intervention. Le patient connaît souvent un nom propre : il faut en connaître la conséquence.</p>
<div class="lab">Correspondances utiles</div><p><b>Blalock-Taussig</b> : anastomose palliative entre une artère sous-clavière et une artère pulmonaire ; pouls radial parfois absent et pression non fiable du côté opéré. <b>Mustard ou Senning</b> : réparation atriale de la transposition ; ventricule droit systémique. <b>Jatene</b> : détransposition artérielle ; surveillance de la néo-aorte et des coronaires. <b>Rastelli</b> : tunnel ventricule gauche–aorte et conduit ventricule droit–artère pulmonaire ; dégénérescence du conduit. <b>Glenn</b> et <b>Fontan</b> : dérivations cavopulmonaires. <b>Cerclage de l’artère pulmonaire</b> : protection pulmonaire temporaire. <b>Patch transannulaire</b> : fuite pulmonaire obligatoire.</p>
<div class="lab">Pourquoi</div><p>Chaque intervention a ses complications tardives propres ; les connaître oriente la surveillance.</p></template>

<template data-pop="q21-s-nourr" data-title="Insuffisance cardiaque du nourrisson">
<div class="lab">Signes d’appel</div><p>Biberons longs et interrompus (plus de 20 à 30 minutes), sueurs pendant la tétée, polypnée, stagnation ou cassure de la courbe pondérale, infections respiratoires répétées, irritabilité.</p>
<div class="lab">Physiopathologie</div><p>La tétée est l’effort du nourrisson : elle augmente la consommation d’oxygène alors que l’hyperdébit pulmonaire rend le poumon rigide et œdémateux. L’activation sympathique provoque les sueurs ; la dépense énergétique accrue et les apports réduits expliquent la stagnation pondérale.</p>
<div class="lab">Examen associé</div><p>Hépatomégalie (signe le plus fiable à cet âge), tachycardie, tirage ; les œdèmes des membres et la turgescence jugulaire sont rares chez le nourrisson.</p></template>

<template data-pop="q21-s-dysp" data-title="Dyspnée et intolérance à l’effort">
<div class="lab">Caractériser</div><p>Comparer avec les pairs et avec les années précédentes (activités abandonnées, sport scolaire), rechercher une cyanose d’effort, des palpitations associées.</p>
<div class="lab">Mécanismes</div><p>Surcharge de volume ou de pression, dysfonction ventriculaire, chute de la saturation à l’effort (shunt droite-gauche), incompétence chronotrope, hypertension pulmonaire, limitation du débit dans le Fontan.</p>
<div class="lab">Piège</div><p>L’adaptation depuis l’enfance masque la limitation : le patient se dit asymptomatique. L’épreuve d’effort cardiorespiratoire objective la consommation maximale d’oxygène et suit son évolution.</p></template>

<template data-pop="q21-s-palp" data-title="Palpitations chez l’adulte porteur d’une cardiopathie congénitale">
<div class="lab">Causes</div><p>Tachycardies par réentrée intra-auriculaire autour des cicatrices chirurgicales, flutter et fibrillation auriculaires (CIA, Ebstein, Fontan), tachycardies ventriculaires (tétralogie réparée), tachycardies par voie accessoire (Ebstein).</p>
<div class="lab">Gravité</div><p>Une tachycardie auriculaire avec conduction 1:1 peut provoquer un collapsus dans un Fontan ou un ventricule droit systémique. Toute palpitation soutenue impose un ECG pendant l’accès et un avis du centre.</p>
<div class="lab">Question</div><p>« Le cœur bat-il vite et régulièrement ? Depuis quand ? Avec malaise, essoufflement, perte de connaissance ? »</p></template>

<template data-pop="q21-s-squat" data-title="Accroupissement (« squatting »)">
<p>L’enfant porteur d’une tétralogie de Fallot non réparée s’accroupit spontanément après un effort.</p>
<div class="lab">Mécanisme</div><p>La flexion des membres inférieurs comprime les artères fémorales et élève les résistances systémiques : le shunt droite-gauche à travers la CIV diminue et davantage de sang passe vers le poumon. Le retour du sang veineux très désaturé des jambes est aussi réduit.</p>
<div class="lab">Corrélation thérapeutique</div><p>La position genoux-poitrine de la crise hypoxique et la phényléphrine reproduisent le même principe.</p></template>

<template data-pop="q21-s-embol" data-title="Embolie paradoxale">
<div class="lab">Définition</div><p>Passage d’un embole veineux (thrombus, air, graisse) vers la circulation systémique à travers un shunt droite-gauche permanent ou transitoire.</p>
<div class="lab">Arguments</div><p>Accident ischémique cérébral ou périphérique chez un sujet jeune sans autre cause ; circonstance d’effort à glotte fermée (défécation, port de charge, toux) ; thrombose veineuse ou immobilisation récente.</p>
<div class="lab">Bilan</div><p>Échocardiographie avec microbulles et manœuvre de Valsalva, Doppler transcrânien ; recherche d’une thrombose veineuse profonde et d’une thrombophilie selon le contexte.</p></template>

<template data-pop="q21-s-hyperv" data-title="Symptômes d’hyperviscosité">
<div class="lab">Symptômes</div><p>Céphalées, vertiges, troubles visuels, acouphènes, paresthésies, fatigue, troubles de concentration, myalgies.</p>
<div class="lab">Mécanisme</div><p>La viscosité sanguine augmente de façon exponentielle avec l’hématocrite ; elle est aggravée par la déshydratation et par la carence martiale (globules microcytaires moins déformables).</p>
<div class="lab">Piège</div><p>Ces symptômes sont plus souvent dus à une carence martiale ou à une déshydratation qu’à l’hématocrite lui-même. Avant une phlébotomie : réhydrater, rechercher et corriger la carence martiale.</p></template>

<template data-pop="q21-e-4membres" data-title="Pression artérielle aux quatre membres et saturation pré- et postductale">
<div class="lab">Technique</div><p>Brassard adapté à chaque membre ; mesure au bras droit et à une jambe au minimum. Saturation à la main droite (préductale) et à un pied (postductal), capteurs posés simultanément ou à la suite chez un enfant calme.</p>
<div class="lab">Interprétation</div><p>Pression plus basse aux jambes qu’au bras droit (&gt; 20 mmHg environ) : coarctation. Saturation préductale supérieure à la postductale : shunt droite-gauche par le canal. Pression plus basse au bras gauche qu’au droit : coarctation proximale ou origine anormale de la sous-clavière.</p>
<div class="lab">Piège</div><p>Un canal artériel largement ouvert peut masquer le gradient d’une coarctation pendant les premiers jours.</p></template>

<template data-pop="q21-e-croiss" data-title="Croissance et cardiopathies congénitales">
<div class="lab">Mesure</div><p>Poids, taille et périmètre crânien reportés sur les courbes de référence utilisées en Suisse, à chaque consultation.</p>
<div class="lab">Interprétation</div><p>Le poids fléchit d’abord (dépense énergétique, apports réduits) ; une atteinte de la taille et du périmètre crânien évoque un syndrome génétique ou une insuffisance cardiaque prolongée. Une cassure pondérale est un critère pour avancer une chirurgie.</p></template>

<template data-pop="q21-e-cyanose" data-title="Cyanose centrale, périphérique et différentielle">
<div class="lab">Centrale</div><p>Langue et muqueuses bleues, extrémités chaudes : sang artériel désaturé (cardiopathie cyanogène, maladie pulmonaire).</p>
<div class="lab">Périphérique</div><p>Extrémités bleues et froides, langue rose : extraction accrue de l’oxygène par stase (froid, bas débit). Normale chez le nouveau-né (acrocyanose).</p>
<div class="lab">Différentielle</div><p>Pieds plus cyanosés que les mains : shunt droite-gauche par le canal artériel (Eisenmenger sur canal, hypertension pulmonaire persistante, coarctation critique). La main gauche peut être aussi cyanosée que les pieds si la sous-clavière gauche naît près du canal. Forme inversée (mains plus cyanosées que les pieds) : transposition avec hypertension pulmonaire ou obstacle aortique.</p></template>

<template data-pop="q21-e-hippo" data-title="Hippocratisme digital">
<div class="lab">Technique</div><p>Signe de Schamroth : accoler dos à dos les dernières phalanges des deux index ; normalement, une petite fenêtre en losange apparaît entre les ongles. Sa disparition signe l’hippocratisme. Angle entre l’ongle et le repli unguéal supérieur à 180°.</p>
<div class="lab">Mécanisme proposé</div><p>Des mégacaryocytes et des amas plaquettaires, qui ne sont plus filtrés par le poumon en cas de shunt droite-gauche, se bloquent dans les capillaires des doigts et libèrent des facteurs de croissance (dont le facteur de croissance de l’endothélium vasculaire).</p>
<div class="lab">Diagnostic différentiel</div><p>Maladies pulmonaires suppurées, cancer bronchique, fibrose pulmonaire, endocardite, maladies inflammatoires de l’intestin, cirrhose.</p></template>

<template data-pop="q21-e-b2" data-title="Dédoublement fixe du deuxième bruit">
<div class="lab">Technique</div><p>Auscultation au deuxième ou troisième espace intercostal gauche, patient couché, en respiration calme ; comparer inspiration et expiration.</p>
<div class="lab">Normal</div><p>Dédoublement de B2 à l’inspiration (fermeture pulmonaire retardée par l’augmentation du retour veineux droit), unique à l’expiration.</p>
<div class="lab">CIA</div><p>Dédoublement large et fixe : le ventricule droit est surchargé en permanence, et les variations respiratoires du retour veineux sont compensées par des variations inverses du shunt.</p>
<div class="lab">Autres anomalies</div><p>B2 unique : tétralogie de Fallot, atrésie pulmonaire, transposition (valve pulmonaire postérieure), Eisenmenger. Composante pulmonaire éclatante : hypertension pulmonaire.</p></template>

<template data-pop="q21-e-civ" data-title="Souffle de communication interventriculaire">
<div class="lab">Sémiologie</div><p>Souffle holosystolique, maximal au troisième ou quatrième espace intercostal gauche, irradiant « en rayon de roue », souvent frémissant.</p>
<div class="lab">Intensité et taille</div><p>Petite CIV restrictive : souffle intense, gradient élevé, retentissement faible. Grande CIV : souffle plus doux, roulement mitral d’hyperdébit à l’apex, B2 renforcé. Eisenmenger : souffle absent.</p>
<div class="lab">Évolution</div><p>La diminution progressive d’un souffle de CIV peut signifier une fermeture spontanée ou, au contraire, une hausse des résistances pulmonaires : l’échocardiographie tranche.</p></template>

<template data-pop="q21-e-continu" data-title="Souffle continu">
<div class="lab">Sémiologie</div><p>Souffle systolique et diastolique, sans interruption au deuxième bruit, maximal sous la clavicule gauche, renforcé en fin de systole (souffle « tunnel » ou « tourbillon »).</p>
<div class="lab">Mécanisme</div><p>Gradient de pression entre aorte et artère pulmonaire présent pendant tout le cycle.</p>
<div class="lab">Diagnostic différentiel</div><p>Fistule coronaire, rupture d’un anévrisme du sinus de Valsalva, collatérales aorto-pulmonaires, anastomose de Blalock-Taussig, souffle veineux innocent (disparaît en décubitus ou à la compression jugulaire).</p>
<div class="lab">Valeur</div><p>Chez le prématuré, le souffle peut être seulement systolique ; un pouls bondissant et une pression différentielle large sont des signes plus précoces.</p></template>

<template data-pop="q21-e-cicatrices" data-title="Cicatrices et pouls chez l’adulte opéré">
<div class="lab">Lecture des cicatrices</div><p>Sternotomie médiane : réparation sous circulation extracorporelle. Thoracotomie latérale gauche : coarctation, canal artériel, anastomose de Blalock-Taussig gauche, cerclage. Thoracotomie droite : anastomose droite ou fermeture de CIA par voie mini-invasive.</p>
<div class="lab">Pouls</div><p>Un pouls radial faible ou absent du côté d’une ancienne anastomose de Blalock-Taussig classique rend la mesure de la pression artérielle non fiable de ce côté.</p>
<div class="lab">Autres indices</div><p>Cicatrices d’accès vasculaires multiples (occlusions veineuses gênant les futurs cathétérismes), boîtier de stimulateur.</p></template>

<template data-pop="q21-e-innocent" data-title="Souffles innocents de l’enfant">
<div class="lab">Caractères</div><p>Systolique (jamais diastolique seul), court, doux (intensité ≤ 2/6), sans frémissement, variable avec la position, B2 normal, enfant asymptomatique avec un examen normal.</p>
<div class="lab">Exemples</div><p><b>Souffle de Still</b> : vibratoire, musical, au bord gauche du sternum, entre 3 et 7 ans. <b>Souffle d’éjection pulmonaire</b> : au foyer pulmonaire, chez l’enfant mince. <b>Souffle veineux</b> : continu, sous la clavicule droite, disparaît en décubitus ou à la rotation de la tête. <b>Souffle des branches pulmonaires</b> du nouveau-né : disparaît vers 6 mois.</p>
<div class="lab">Aide mnémotechnique « les 7 S »</div><p>Systolique, Short (court), Soft (doux), Sensible à la position, Simple (sans clic ni bruit surajouté), Sans symptôme, Sweet (musical). Aide pédagogique, non critère officiel.</p>
<div class="lab">Avis spécialisé si</div><p>Souffle diastolique ou holosystolique, ≥ 3/6 ou frémissant, clic, B2 anormal, souffle chez le nouveau-né, symptômes, pouls fémoraux faibles, syndrome génétique.</p></template>
