
<!-- ===== FENÊTRES Q21 : dépistage, diagnostic, urgences ===== -->
<template data-pop="q21-oxy" data-title="Dépistage néonatal par oxymétrie de pouls en Suisse">
<div class="lab">Question clinique</div><p>Ce nouveau-né apparemment sain a-t-il une cardiopathie critique qui se révélera à la fermeture du canal ?</p>
<div class="lab">Recommandation</div><p>Recommandé en Suisse depuis 2005 par les sociétés suisses de néonatologie et de cardiologie pédiatrique, chez tous les nouveau-nés.</p>
<div class="lab">Protocole</div><p>Saturation au pied avant 24 heures ; &lt; 95 % : échocardiographie (conduite détaillée dans l’onglet Examens, îlot 2).</p>
<div class="lab">Performance</div><p>Spécificité très élevée et sensibilité modérée : 99,9 % et 76,5 % dans une méta-analyse de 229 421 nouveau-nés. La sensibilité reste modérée, car un obstacle gauche comme la coarctation ne désature pas le pied tant que peu de sang passe de l’artère pulmonaire à l’aorte par le canal. Dans l’étude multicentrique suisse de 3 262 nouveau-nés, 24 avaient une saturation répétée inférieure à 95 % : 17 avaient une cardiopathie, et 5 des 7 autres une hypertension pulmonaire persistante, elle aussi à traiter.</p>
<div class="lab">Source</div><p>Recommandations suisses (2005) ; <a href="https://pubmed.ncbi.nlm.nih.gov/20047132/" target="_blank" rel="noopener">Kuelling et al.</a>, <i>Swiss Medical Weekly</i> 2009, qui montre que 85 % des nouveau-nés suisses étaient dépistés en 2007 ; <a href="https://pubmed.ncbi.nlm.nih.gov/16211399/" target="_blank" rel="noopener">Arlettaz et al.</a>, <i>European Journal of Pediatrics</i> 2006 ; <a href="https://pubmed.ncbi.nlm.nih.gov/22554860/" target="_blank" rel="noopener">Thangaratinam et al.</a>, <i>Lancet</i> 2012.</p></template>

<template data-pop="q21-hyperox" data-title="Test d’hyperoxie">
<div class="lab">Question clinique</div><p>La cyanose de ce nouveau-né est-elle d’origine cardiaque (shunt fixe) ou pulmonaire ?</p>
<div class="lab">Technique</div><p>Gaz du sang artériel préductal (artère radiale droite) après environ 10 minutes sous oxygène à 100 %.</p>
<div class="lab">Interprétation</div><p>Pression partielle artérielle en oxygène &gt; 150 mmHg (20 kilopascals) : cardiopathie cyanogène peu probable. &lt; 100 mmHg (13 kilopascals) : shunt droite-gauche fixe ou mélange probable. Valeurs intermédiaires : ni l’un ni l’autre n’est exclu.</p>
<div class="lab">Limites</div><p>L’hypertension pulmonaire persistante du nouveau-né donne aussi une réponse faible ; l’oxygène prolongé favorise la fermeture du canal. L’échocardiographie a largement remplacé ce test là où elle est disponible.</p></template>

<template data-pop="q21-echofoet" data-title="Échocardiographie fœtale">
<div class="lab">Moment</div><p>Vers 18 à 22 semaines ; certaines anomalies ne sont visibles que plus tard (obstacles évolutifs, coarctation).</p>
<div class="lab">Indications</div><p>Anomalie suspectée à l’échographie de routine ; clarté nucale augmentée ; anomalie chromosomique ou extracardiaque ; diabète prégestationnel ; exposition à un tératogène ; cardiopathie chez un parent ou dans la fratrie ; anticorps anti-Ro ; grossesse monochoriale ; procréation médicalement assistée.</p>
<div class="lab">Bénéfice</div><p>Conseil prénatal, recherche d’un syndrome, accouchement planifié dans un centre ; dans les lésions ducto-dépendantes, meilleure stabilité préopératoire.</p></template>

<template data-pop="q21-bulles" data-title="Test aux microbulles">
<div class="lab">Question clinique</div><p>Existe-t-il un shunt droite-gauche (foramen ovale perméable, CIA, fistule artérioveineuse pulmonaire) ?</p>
<div class="lab">Technique</div><p>Injection intraveineuse de sérum physiologique agité (avec un peu d’air et parfois de sang), au repos puis avec une manœuvre de Valsalva relâchée au moment où les bulles opacifient l’oreillette droite. Lecture en échocardiographie transthoracique ou transœsophagienne ; le Doppler transcrânien compte les signaux dans l’artère cérébrale moyenne.</p>
<div class="lab">Interprétation</div><p>Gradation (nombre de bulles, moment d’apparition, échelle de Spencer) : tableau de l’onglet Examens, îlot 4.</p>
<div class="lab">Pièges</div><p>Valsalva insuffisant (faux négatif), car seul un relâchement efficace porte brièvement la pression de l’oreillette droite au-dessus de celle de la gauche ; injection par une veine du membre inférieur plus sensible, le flux de la veine cave inférieure étant dirigé vers le septum.</p></template>

<template data-pop="q21-chocneo" data-title="Choc du nouveau-né ducto-dépendant">
<div class="lab">Reconnaissance</div><p>Nouveau-né de quelques jours, jusque-là bien, qui devient gris, polypnéique, refuse de boire ; pouls fémoraux faibles ou absents, hépatomégalie, oligurie, acidose lactique. Il est souvent pris d’abord pour un sepsis.</p>
<div class="lab">Conduite</div><p>1. Alprostadil en perfusion continue dès la suspicion. 2. Voies aériennes : prévoir la ventilation (apnées, épuisement). 3. Remplissage prudent, inotrope si nécessaire. 4. Correction de l’acidose, de l’hypoglycémie et de l’hypocalcémie. 5. Antibiotiques jusqu’à exclusion d’un sepsis. 6. Échocardiographie et transfert médicalisé vers un centre de chirurgie cardiaque pédiatrique.</p>
<div class="lab">Piège</div><p>Oxygène à haute concentration : il peut accélérer la fermeture du canal et, dans l’hypoplasie du cœur gauche, augmenter le débit pulmonaire au détriment du débit systémique.</p></template>

<template data-pop="q21-spell" data-title="Crise hypoxique de la tétralogie de Fallot">
<div class="lab">Tableau</div><p>Nourrisson (pic entre 2 et 6 mois), souvent le matin, après pleurs, tétée ou défécation : agitation, polypnée, cyanose intense, puis hypotonie ; le souffle s’atténue ou disparaît. Risque de convulsions, d’accident vasculaire cérébral et de décès.</p>
<div class="lab">Mécanisme</div><p>Cercle vicieux : contraction de l’infundibulum et chute des résistances systémiques → plus de shunt droite-gauche → hypoxémie et acidose → stimulation respiratoire et catécholamines → aggravation.</p>
<div class="lab">Conduite</div><p>Séquence et doses : îlot 5.1 de l’onglet Pharmacologie et fenêtre des médicaments de la crise hypoxique. Toute crise impose de programmer la réparation.</p>
<div class="lab">Prévention</div><p>Éviter déshydratation et anémie ; carence martiale à corriger.</p></template>

<template data-pop="q21-arythmie" data-title="Arythmies de l’adulte porteur d’une cardiopathie congénitale">
<div class="lab">Tachycardies auriculaires</div><p>Tachycardie par réentrée intra-auriculaire autour des cicatrices (réparation atriale, Fontan atriopulmonaire, tétralogie), flutter, fibrillation auriculaire (CIA, sujet âgé). Souvent lentes (cycle long) avec conduction 2:1 trompeuse ; une conduction 1:1 est grave.</p>
<div class="lab">Arythmies ventriculaires</div><p>Tétralogie réparée (isthmes entre cicatrices et anneaux valvulaires), ventricule systémique défaillant.</p>
<div class="lab">Bradycardies</div><p>Dysfonction sinusale après réparation atriale ou Fontan ; bloc auriculoventriculaire dans la transposition corrigée, le canal atrioventriculaire, après fermeture d’une CIV ; mutations <i>NKX2-5</i>.</p>
<div class="lab">Principes</div><p>ECG pendant l’accès ; cardioversion rapide si mal tolérée, après exclusion d’un thrombus si l’arythmie dure ; anticoagulation dans les formes modérées et sévères ; ablation en centre expert ; bilan hémodynamique, car une arythmie nouvelle signale souvent une lésion résiduelle.</p>
<div class="lab">Pourquoi la tachycardie est mal tolérée</div><p>Dans un Fontan, le ventricule unique se remplit par un écoulement passif à travers le poumon ; une fréquence rapide raccourcit la diastole, et la perte de la contraction auriculaire réduit encore le remplissage. Après une réparation atriale, les chenaux auriculaires restrictifs empêchent la précharge d’augmenter : le volume éjecté chute, et l’ischémie qui en résulte peut déclencher une tachycardie ou une fibrillation ventriculaires.</p>
<div class="lab">Pourquoi la conduction 2:1 trompe</div><p>Une tachycardie par réentrée intra-auriculaire bat souvent entre 150 et 250 par minute dans l’oreillette. Conduite en 2:1, elle donne une fréquence ventriculaire proche d’une tachycardie sinusale. Un antiarythmique de la classe 1C ralentit l’oreillette sans freiner le nœud auriculoventriculaire : il peut permettre une conduction 1:1 et un effondrement hémodynamique.</p>
<div class="lab">Ce qui change la décision</div><p>Une arythmie tolérée depuis 48 heures ou plus impose d’exclure un thrombus ou d’anticoaguler au moins 3 semaines avant la cardioversion. Une pause sinusale peut suivre le choc chez un patient dont le nœud sinusal est malade : une stimulation de secours doit être disponible. L’ablation est préférée à un antiarythmique au long cours, car ces médicaments ont souvent des effets inotropes ou dromotropes négatifs ; l’amiodarone au long cours n’est pas recommandée chez le jeune.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaa554" target="_blank" rel="noopener">Recommandations ESC 2020 sur les cardiopathies congénitales de l’adulte</a>, sections 3.4.2.1, 3.4.2.2 et 4.12.2.1.</p>
</template>

<template data-pop="q21-hemopt" data-title="Hémoptysie du syndrome d’Eisenmenger">
<div class="lab">Causes</div><p>Rupture de collatérales bronchiques ou d’artérioles pulmonaires, infarctus pulmonaire sur thrombose in situ des artères pulmonaires dilatées.</p>
<div class="lab">Conduite</div><p>Hospitalisation en centre ; arrêt de l’aspirine et des anticoagulants ; toux calmée ; correction de l’hypovolémie ; scanner thoracique ; embolisation des artères bronchiques si l’hémorragie persiste. Éviter la bronchoscopie systématique, car elle expose le patient à un risque et apporte rarement une information utile.</p>
<div class="lab">Signification</div><p>Complication fréquente, parfois inaugurale d’une thrombose artérielle pulmonaire ; elle peut être fatale. Le sang extériorisé ne reflète pas l’étendue de l’hémorragie dans le poumon, retrouvée jusque chez tous les patients Eisenmenger examinés : une hémoptysie modeste peut cacher un saignement important.</p></template>

<template data-pop="q21-abces" data-title="Abcès cérébral du patient cyanosé">
<div class="lab">Mécanisme</div><p>Les bactéries de bactériémies banales ne sont plus filtrées par le poumon et atteignent le cerveau par le shunt droite-gauche ; l’hypoxie et l’hyperviscosité favorisent de petits foyers d’ischémie qui s’infectent.</p>
<div class="lab">Tableau</div><p>Céphalées nouvelles, fièvre inconstante, déficit focal, convulsions, troubles de conscience chez un patient cyanosé, le plus souvent après l’âge de 2 ans.</p>
<div class="lab">Conduite</div><p>Toute céphalée nouvelle et persistante chez un patient cyanosé impose une imagerie cérébrale avec injection. Traitement : antibiothérapie prolongée, drainage neurochirurgical selon la taille.</p></template>

<template data-pop="q21-endoc" data-title="Endocardite : patients congénitaux à haut risque">
<div class="lab">Haut risque (<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>)</div><p>Cardiopathie cyanogène non traitée ; cardiopathie réparée avec matériel prothétique (chirurgical ou percutané) pendant les 6 mois suivant l’intervention, ou à vie s’il persiste un shunt résiduel ou une fuite au contact du matériel ; shunts palliatifs et conduits ; prothèse valvulaire (dont les valves pulmonaires percutanées) ; antécédent d’endocardite.</p>
<div class="lab">Prophylaxie</div><p>Antibioprophylaxie en dose unique avant un soin dentaire à risque ; hygiène buccodentaire, contrôle dentaire deux fois par an ; éviter tatouages et piercings, ou les réaliser dans des conditions d’asepsie stricte.</p>
<div class="lab">Piège</div><p>Les valves pulmonaires percutanées de type veine jugulaire bovine ont un risque d’endocardite plus élevé : dans une revue systématique de 50 études (7 063 patients), l’incidence cumulée médiane de l’endocardite atteignait 5,4 % avec ces valves contre 1,2 % avec les autres, qu’elles soient posées par chirurgie ou par cathéter (<a href="https://pubmed.ncbi.nlm.nih.gov/28728659/" target="_blank" rel="noopener">Sharma et al.</a>, Journal of the American College of Cardiology: Cardiovascular Interventions 2017;10:1449–1458). Toute fièvre inexpliquée chez un porteur impose donc des hémocultures avant antibiotique.</p>
<div class="lab">Voir aussi</div><p>Doses et différences entre la Suisse et l’ESC : chapitre « I33 — Endocardite infectieuse ».</p>
<div class="lab">Pourquoi ces patients</div><p>Un flux turbulent à travers un défaut, une valve ou un conduit exerce un cisaillement qui lèse l’endothélium ; une bactériémie banale peut alors coloniser la lésion. Un matériel prothétique offre la même cible tant qu’il n’est pas recouvert d’endothélium, d’où la prophylaxie limitée aux 6 premiers mois, sauf si un shunt résiduel ou une fuite au contact du matériel entretient le jet. La cyanose et les interventions répétées ajoutent leur risque. Chez l’adulte porteur d’une cardiopathie congénitale, l’endocardite est 27 à 44 fois plus fréquente que dans la population générale.</p>
<div class="lab">Valves et conduits</div><p>Une prothèse contenant une valve reste un facteur de risque à vie, alors qu’un matériel sans valve ne l’est que pendant 6 mois. Après implantation percutanée d’une valve pulmonaire, l’incidence de l’endocardite atteint 2 à 3 % par an.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">Recommandations ESC 2023 sur l’endocardite</a>, sections 3.2 et 12.7 ; <a href="https://doi.org/10.1093/eurheartj/ehaa554" target="_blank" rel="noopener">recommandations ESC 2020 sur les cardiopathies congénitales de l’adulte</a>, sections 4.10.2 et 4.10.4.</p>
</template>
