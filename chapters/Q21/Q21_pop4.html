
<!-- ===== FENÊTRES Q21 : lésions ===== -->
<template data-pop="q21-cia-types" data-title="Types de communication interauriculaire">
<div class="lab">Ostium secundum (environ 80 %, ESC 2020)</div><p>Fosse ovale ; seul type accessible à une prothèse (figure 3).</p>
<div class="lab">Ostium primum (environ 15 à 20 %)</div><p>Partie basse du septum, au contact des valves atrioventriculaires ; forme partielle du canal atrioventriculaire, avec fente mitrale. Chirurgie.</p>
<div class="lab">Sinus venosus (environ 5 à 10 %)</div><p>Supérieur, à l’abouchement de la veine cave supérieure, presque toujours associé à un retour veineux pulmonaire anormal de la veine pulmonaire supérieure droite ; plus rarement inférieur. Souvent invisible en échocardiographie transthoracique. Chirurgie, ou stent couvert dans des centres experts.</p>
<div class="lab">Sinus coronaire « découvert » (rare)</div><p>Absence de toit du sinus coronaire ; souvent avec une veine cave supérieure gauche persistante.</p></template>

<template data-pop="q21-cia-ferm" data-title="Fermeture d’une communication interauriculaire">
<div class="lab">Percutanée</div><p>Prothèse à double disque posée par voie veineuse fémorale sous guidage échographique transœsophagien ou intracardiaque. Conditions : ostium secundum, diamètre compatible, berges suffisantes (sauf parfois la berge aortique), pas de retour veineux anormal associé.</p>
<div class="lab">Test d’occlusion au ballon</div><p>Chez le patient âgé ou à ventricule gauche rigide : occlusion temporaire avec mesure de la pression de l’oreillette gauche. Une hausse importante fait renoncer à la fermeture ou choisir une prothèse fenestrée.</p>
<div class="lab">Suites</div><p>Aspirine, au moins 75 mg par jour, pendant au moins 6 mois, car la surface de la prothèse reste thrombogène tant que l’endothélium ne l’a pas recouverte ; antibioprophylaxie pendant 6 mois ; suivi échographique à 1 jour, 1 mois, 6 mois, puis régulier pendant 2 ans et tous les 3 à 5 ans ensuite.</p>
<div class="lab">Complications</div><p>Arythmies auriculaires, thrombus sur la prothèse, embolisation de la prothèse, érosion de la paroi auriculaire ou de l’aorte (rare mais grave : douleur thoracique ou épanchement péricardique après la pose).</p>
<div class="lab">Chirurgicale</div><p>Suture directe ou patch ; obligatoire pour les types primum, sinus venosus et sinus coronaire et pour les grands défauts sans berge.</p></template>

<template data-pop="q21-rvpa" data-title="Retours veineux pulmonaires anormaux">
<div class="lab">Partiel</div><p>Une ou plusieurs veines pulmonaires se drainent dans l’oreillette droite ou une veine systémique (veine cave supérieure, veine innominée, veine cave inférieure dans le syndrome du cimeterre). Physiologie d’une CIA : surcharge droite. Association fréquente à la CIA sinus venosus et au syndrome de Turner. Diagnostic par IRM ou scanner.</p>
<div class="lab">Total</div><p>Toutes les veines pulmonaires se drainent vers le cœur droit. Forme obstruée : urgence néonatale absolue (cyanose, œdème pulmonaire, radiographie évocatrice d’une maladie pulmonaire) ; l’alprostadil n’aide pas, car l’obstacle siège sur le retour veineux pulmonaire : ouvrir le canal ne lève pas cet obstacle et pourrait même augmenter le débit pulmonaire, donc l’œdème. La chirurgie est immédiate.</p></template>

<template data-pop="q21-rope" data-title="Score RoPE et classification PASCAL">
<div class="lab">Score RoPE (0 à 10 points)</div><p>1 point pour chacun : absence d’hypertension, absence de diabète, absence d’antécédent d’accident vasculaire cérébral ou d’accident ischémique transitoire, non-fumeur, infarctus cortical à l’imagerie. Âge : 18–29 ans 5 points ; 30–39 ans 4 ; 40–49 ans 3 ; 50–59 ans 2 ; 60–69 ans 1 ; ≥ 70 ans 0. Plus le score est élevé, plus le foramen ovale est probablement responsable.</p>
<div class="lab">Caractères à haut risque du foramen</div><p>Large shunt (plus de 20 microbulles) ; anévrisme du septum interauriculaire (excursion de plus de 10 mm).</p>
<div class="lab">Classification PASCAL</div><p><b>Improbable</b> : RoPE &lt; 7 et aucun caractère à haut risque. <b>Possible</b> : RoPE &lt; 7 avec un caractère à haut risque, ou RoPE ≥ 7 sans. <b>Probable</b> : RoPE ≥ 7 avec un caractère à haut risque.</p>
<div class="lab">Décision (ESO 2024)</div><p>18–60 ans, accident inexpliqué après bilan complet : fermeture plus antiplaquettaire (recommandation forte). Causalité improbable : fermeture déconseillée (recommandation faible). Au-delà de 60 ans : pas de preuve suffisante, décision individuelle. Pas d’anticoagulation au long cours sans autre indication.</p>
<div class="lab">Aide pédagogique</div><p>Outils de probabilité, non critères diagnostiques.</p>
<div class="lab">Ce que mesure le score</div><p>Le score RoPE estime la part des accidents attribuable au foramen. Entre 0 et 3 points, la prévalence du foramen (23 %) est celle de la population générale : sa part attribuable est proche de 0 %. À 9 ou 10 points, la prévalence atteint 73 % et la part attribuable environ 90 %. Le taux de récidive d’accident ischémique ou transitoire à 2 ans baissait de 20 % dans la classe la plus basse à 2 % dans la plus haute : un score bas signale d’autres mécanismes d’accident, qui récidivent.</p>
<div class="lab">Effet de la fermeture selon la classification</div><p>Dans l’analyse groupée des six essais randomisés (3 740 patients de 18 à 60 ans), la fermeture a réduit les récidives d’accident ischémique de 59 %. Le bénéfice dépend de la probabilité causale : rapport des risques de 0,10 si elle est probable, de 0,38 si elle est possible, et de 1,14, soit aucun bénéfice, si elle est improbable. L’ESO 2024 retient que les patients qui cumulent un large shunt et un anévrisme du septum bénéficient le plus de la fermeture.</p>
<div class="lab">Source complémentaire</div><p>Kent et al., <i>Neurology</i> 2013 ; Kent et al., <i>JAMA</i> 2021 ; Caso et al., <i>European Stroke Journal</i> 2024.</p>
</template>

<template data-pop="q21-civ-types" data-title="Types de communication interventriculaire">
<div class="lab">Périmembraneuse (environ 70 à 80 %)</div><p>Sous la valve aortique, près du faisceau de His. Fermeture spontanée fréquente par tissu tricuspide accessoire (« anévrisme du septum membraneux »). Risque de prolapsus aortique et de bloc après fermeture.</p>
<div class="lab">Musculaire (trabéculée)</div><p>Entourée de muscle ; fermeture spontanée fréquente dans l’enfance ; parfois multiples (« en fromage de gruyère »). Accessible aux prothèses percutanées.</p>
<div class="lab">Infundibulaire, sous-artérielle</div><p>Sous les valves aortique et pulmonaire ; plus fréquente dans les populations d’Asie de l’Est. Ne se ferme pas ; prolapsus de la sigmoïde coronaire droite et insuffisance aortique fréquents.</p>
<div class="lab">D’admission</div><p>Sous les valves atrioventriculaires ; composante du canal atrioventriculaire.</p></template>

<template data-pop="q21-civ-ia" data-title="Prolapsus d’une sigmoïde aortique dans une CIV">
<div class="lab">Mécanisme</div><p>Le jet systolique de la CIV aspire la sigmoïde voisine (effet Venturi), qui perd son soutien et prolabe dans le défaut ; la CIV peut paraître se réduire alors que la valve se détériore.</p>
<div class="lab">Conséquence</div><p>Insuffisance aortique progressive, surtout avec les CIV infundibulaires et périmembraneuses.</p>
<div class="lab">Conduite</div><p>Surveillance échographique rapprochée ; fermeture chirurgicale dès l’apparition d’une insuffisance aortique progressive, même si le shunt est petit (ESC 2020, IIa).</p></template>

<template data-pop="q21-ca" data-title="Canal artériel persistant">
<div class="lab">Physiologie de fermeture</div><p>Contraction sous l’effet de l’oxygène et de la chute des prostaglandines, fermeture fonctionnelle en 24 à 72 heures, puis fibrose en ligament artériel.</p>
<div class="lab">Formes selon la taille</div><p><b>Minuscule</b> : inaudible, découverte échographique ; pas de fermeture. <b>Petit</b> : souffle continu, pas de retentissement ; fermeture discutée. <b>Moyen</b> : surcharge des cavités gauches, pouls bondissants ; fermeture. <b>Large</b> : insuffisance cardiaque du nourrisson, puis Eisenmenger avec cyanose différentielle.</p>
<div class="lab">Traitement</div><p>Fermeture percutanée par prothèse ou spirale, méthode de choix après la période néonatale. Prématuré : ibuprofène ou paracétamol, ligature chirurgicale ou fermeture percutanée si échec.</p>
<div class="lab">Adulte</div><p>Le canal peut se calcifier (fermeture chirurgicale difficile) ou se compliquer d’une endartérite.</p></template>

<template data-pop="q21-cav" data-title="Canal atrioventriculaire">
<div class="lab">Anatomie</div><p>Défaut des bourrelets endocardiques. <b>Forme complète</b> : CIA ostium primum, CIV d’admission, valve atrioventriculaire unique à cinq feuillets. <b>Forme partielle</b> : CIA ostium primum avec fente mitrale, deux orifices valvulaires distincts. <b>Forme intermédiaire</b> : petite CIV restrictive.</p>
<div class="lab">Signes caractéristiques</div><p>Axe gauche à l’ECG ; en échocardiographie, valves atrioventriculaires insérées au même niveau (perte du décalage normal) ; aspect en « col de cygne » de la chambre de chasse gauche à l’angiographie.</p>
<div class="lab">Traitement</div><p>Forme complète : réparation vers 3 à 6 mois. Forme partielle : réparation dans l’enfance ou à la découverte.</p>
<div class="lab">Séquelles de l’adulte</div><p>Fuite de la valve atrioventriculaire gauche (première cause de réintervention), sténose de cette valve après réparation, obstruction sous-aortique, bloc auriculoventriculaire.</p></template>

<template data-pop="q21-sp-niveaux" data-title="Sténose pulmonaire : les quatre niveaux">
<div class="lab">Valvulaire (80 à 90 %)</div><p>Valve en dôme à commissures fusionnées, avec une dilatation fréquente du tronc pulmonaire. L’ESC 2020 attribue surtout cette dilatation à une anomalie propre de la paroi, indépendante de l’hémodynamique ; la rupture de ce vaisseau à basse pression est très rare et ne justifie pas d’intervention. La valve dysplasique (15 à 20 % des cas, souvent dans un syndrome de Noonan) a des feuillets épais, myxoïdes et peu mobiles : le ballon, qui agit en séparant des commissures fusionnées, l’ouvre mal, et la chirurgie lui est préférée.</p>
<div class="lab">Sous-valvulaire</div><p>Infundibulaire (tétralogie de Fallot, hypertrophie réactive) ; ventricule droit à double chambre (bandes musculaires anormales, souvent avec une CIV périmembraneuse, évolutif chez l’adulte).</p>
<div class="lab">Supravalvulaire et branches</div><p>Syndromes de Williams et d’Alagille, rubéole congénitale, séquelles de détransposition artérielle ou d’anastomose palliative. Traitement par angioplastie ou stent.</p>
<div class="lab">Clinique commune</div><p>Souffle éjectionnel au foyer pulmonaire ; clic protosystolique seulement dans la forme valvulaire mobile, diminué à l’inspiration.</p></template>

<template data-pop="q21-coarct-tt" data-title="Coarctation : indications et techniques (ESC 2020)">
<div class="lab">Indications</div><p>Seuils de l’ESC 2020 (I et IIa) : voir l’îlot 12.2.</p>
<div class="lab">Techniques</div><p>Nouveau-né et nourrisson : résection et anastomose termino-terminale. Grand enfant et adulte : stent, de préférence couvert, car les stents couverts ont moins de complications à court et à long terme. Angioplastie au ballon seule : surtout pour la recoarctation du jeune enfant ; chez l’adulte, l’ESC 2020 la réserve à la redilatation d’un stent déjà posé.</p>
<div class="lab">Pourquoi le gradient invasif</div><p>Les collatérales développées court-circuitent l’obstacle : le gradient peut être modeste alors que le rétrécissement est serré. L’anatomie (pourcentage de rétrécissement) complète donc le gradient.</p>
<div class="lab">Suivi</div><p>Pression artérielle ambulatoire, imagerie de l’aorte tous les 3 à 5 ans, épreuve d’effort (hypertension d’effort), recherche d’une bicuspidie et d’une aortopathie ascendante.</p></template>

<template data-pop="q21-subao" data-title="Sténoses sous-aortique et supravalvulaire">
<div class="lab">Sous-aortique</div><p>Membrane ou bourrelet fibromusculaire sous la valve aortique ; lésion acquise et évolutive sur une anatomie prédisposante, souvent associée à une CIV ou à une coarctation. Le jet lèse la valve aortique : insuffisance aortique. Chirurgie chez le patient symptomatique avec un gradient moyen ≥ 40 mmHg ou une insuffisance aortique sévère (ESC 2020, I). Chez le patient à faible risque opératoire, le seuil d’intervention est plus bas que pour une sténose valvulaire, car la résection n’exige pas de prothèse ; une resténose tardive reste possible et impose un suivi après l’opération.</p>
<div class="lab">Supravalvulaire</div><p>Rétrécissement en sablier de la jonction sinotubulaire, typique du syndrome de Williams ; les ostiums coronaires, situés en amont, subissent une pression élevée et peuvent être rétrécis. Risque d’ischémie et de mort subite, notamment à l’anesthésie. Comme les coronaires subissent cette pression élevée, l’ESC 2020 envisage la chirurgie plus tôt que pour une sténose valvulaire.</p></template>

<template data-pop="q21-fallot" data-title="Tétralogie de Fallot : anatomie et physiopathologie">
<div class="lab">Spectre</div><p>De la forme « rose » (obstacle modéré, shunt gauche-droite) à l’atrésie pulmonaire avec CIV, où la vascularisation pulmonaire dépend du canal ou de collatérales aorto-pulmonaires majeures.</p>
<div class="lab">Associations</div><p>Arc aortique droit (environ un quart des cas), microdélétion 22q11.2, anomalies coronaires (une coronaire croisant l’infundibulum, importante pour la chirurgie), CIA.</p>
<div class="lab">Pourquoi le souffle s’atténue en crise</div><p>Il naît de l’obstacle droit : moins de sang passe par l’infundibulum contracté, davantage passe dans l’aorte par la CIV, qui ne souffle pas car les pressions sont égales.</p></template>

<template data-pop="q21-bt" data-title="Anastomoses palliatives aorto-pulmonaires">
<div class="lab">Principe</div><p>Créer une source de débit pulmonaire indépendante du canal, pour faire grandir les artères pulmonaires avant une réparation complète.</p>
<div class="lab">Blalock-Taussig</div><p>Classique : artère sous-clavière sectionnée et anastomosée à l’artère pulmonaire (pouls radial homolatéral diminué). Modifiée : tube synthétique entre sous-clavière et artère pulmonaire (pouls conservé).</p>
<div class="lab">Complications tardives</div><p>Distorsion ou sténose de la branche pulmonaire, hyperdébit et hypertension pulmonaire unilatérale si l’anastomose est trop large, thrombose, endocardite.</p>
<div class="lab">Alternative actuelle</div><p>Stent du canal artériel ou de la voie d’éjection droite par cathétérisme dans certains centres.</p></template>

<template data-pop="q21-rashkind" data-title="Atrioseptostomie de Rashkind">
<div class="lab">Principe</div><p>Un ballon gonflé dans l’oreillette gauche est tiré brusquement vers l’oreillette droite à travers le foramen ovale, qu’il déchire et agrandit.</p>
<div class="lab">Indication</div><p>Transposition simple avec foramen ovale restrictif et hypoxémie sévère malgré l’alprostadil ; autres lésions où un mélange ou une décharge auriculaire est vital.</p>
<div class="lab">Réalisation</div><p>Au lit du malade sous guidage échographique, ou en salle de cathétérisme, par la veine ombilicale ou fémorale.</p></template>

<template data-pop="q21-switch-art" data-title="Détransposition artérielle (opération de Jatene)">
<div class="lab">Principe</div><p>Section des deux gros vaisseaux, remise en place sur le bon ventricule, et réimplantation des coronaires dans la néo-aorte. L’artère pulmonaire est placée en avant de l’aorte (manœuvre de Lecompte).</p>
<div class="lab">Moment</div><p>Dans les deux à trois premières semaines, tant que le ventricule gauche, qui éjecte dans une circulation pulmonaire à basse pression, reste capable de supporter la pression systémique.</p>
<div class="lab">Séquelles de l’adulte</div><p>Sténoses supravalvulaire pulmonaire et des branches (étirées autour de l’aorte) ; dilatation de la néo-racine aortique et insuffisance néo-aortique ; sténoses ou occlusions des ostiums coronaires réimplantés : une douleur thoracique d’effort impose une recherche d’ischémie et un coroscanner. Ces complications coronaires tardives sont rares : l’ESC 2020 juge discutable leur dépistage systématique chez le patient asymptomatique. La chirurgie de la néo-racine aortique est envisagée au-delà de 55 mm (IIa).</p>
<div class="lab">Pronostic</div><p>Survie à long terme excellente ; ventricule gauche systémique.</p></template>

<template data-pop="q21-switch-atr" data-title="Réparation atriale (Mustard, Senning)">
<div class="lab">Principe</div><p>Opérations pratiquées jusqu’aux années 1980–1990 : des chenaux (« baffles ») construits dans les oreillettes redirigent le sang des veines caves vers la valve mitrale et le ventricule gauche (qui éjecte dans l’artère pulmonaire), et le sang des veines pulmonaires vers la valve tricuspide et le ventricule droit (qui éjecte dans l’aorte).</p>
<div class="lab">Conséquence</div><p>Correction physiologique, mais le ventricule droit reste systémique toute la vie.</p>
<div class="lab">Complications</div><p>Dysfonction du ventricule droit systémique et fuite tricuspide ; sténose ou fuite des chenaux (syndrome cave supérieur, embolie paradoxale) ; dysfonction sinusale ; tachycardies par réentrée intra-auriculaire ; mort subite.</p>
<div class="lab">Suivi</div><p>Centre spécialisé, IRM ou scanner, Holter ; stimulateur ou défibrillateur fréquemment nécessaires, dont les sondes passent par les chenaux.</p>
<div class="lab">Pourquoi le cœur se dégrade</div><p>Le ventricule droit éjecte dans l’aorte toute la vie ; il se dilate, et sa valve d’entrée, la tricuspide, devient incontinente, ce qui aggrave la dilatation. La chirurgie étendue des oreillettes fait perdre le rythme sinusal : bradycardie et incompétence chronotrope s’installent, alors que la conduction auriculoventriculaire est souvent conservée. Les chenaux sont restrictifs ; la précharge ne peut pas augmenter, et une fréquence rapide fait chuter le volume éjecté.</p>
<div class="lab">Ce qui change la décision</div><p>Les médicaments qui ralentissent le cœur sont prescrits avec prudence, car la dysfonction sinusale est fréquente. Une hypertension pulmonaire tardive est le plus souvent postcapillaire : un vasodilatateur pulmonaire y est contre-indiqué, d’où un cathétérisme avant tout traitement. Une fuite des chenaux est exclue ou fermée avant de passer une sonde de stimulateur ou de défibrillateur, car elle exposerait à une embolie paradoxale. Dans les plus grandes séries, avec un suivi allant jusqu’à 40 ans, la survie est de 60 à 75 %, et la survie sans complication de 20 % seulement.</p>
<div class="lab">Source complémentaire</div><p>Recommandations ESC 2020 sur les cardiopathies congénitales de l’adulte, section 4.12.2.</p>
</template>

<template data-pop="q21-cctgv" data-title="Transposition congénitalement corrigée">
<div class="lab">Anatomie</div><p>Double discordance : l’oreillette droite se connecte au ventricule gauche, qui éjecte dans l’artère pulmonaire ; l’oreillette gauche se connecte au ventricule droit, qui éjecte dans l’aorte. Le sang suit un trajet normal ; le ventricule droit est systémique.</p>
<div class="lab">Lésions associées</div><p>CIV, sténose pulmonaire, valve tricuspide dysplasique (aspect d’Ebstein) avec fuite, dextrocardie.</p>
<div class="lab">Évolution</div><p>Bloc auriculoventriculaire complet (le nœud atrioventriculaire est antérieur et fragile), avec un risque d’environ 2 % par an ; fuite tricuspide et insuffisance cardiaque souvent à partir de la quatrième décennie. Parfois découverte fortuite chez un adulte âgé.</p>
<div class="lab">Piège</div><p>La stimulation ventriculaire du ventricule sous-pulmonaire (gauche morphologique) peut aggraver la fonction du ventricule droit systémique, car elle désynchronise la contraction : chez l’adulte congénital stimulé, l’ESC 2020 voit dans la stimulation ventriculaire conventionnelle, plus que dans un bloc de branche, la principale cause de dysfonction du ventricule systémique. Une stimulation biventriculaire doit donc être envisagée en cas de bloc auriculoventriculaire complet ou de stimulation ventriculaire au-delà de 40 % du temps (IIa) ; la stimulation du système de conduction est une alternative.</p></template>

<template data-pop="q21-fontan-etapes" data-title="Les étapes vers la circulation de Fontan">
<div class="lab">1. Période néonatale</div><p>Équilibrer les circulations : anastomose aorto-pulmonaire ou stent du canal si le débit pulmonaire manque ; cerclage de l’artère pulmonaire s’il est excessif ; opération de Norwood dans l’hypoplasie du cœur gauche.</p>
<div class="lab">2. Anastomose de Glenn (3 à 6 mois)</div><p>Veine cave supérieure abouchée à l’artère pulmonaire droite ; le ventricule unique est déchargé ; la saturation reste autour de 75 à 85 %. L’intervention attend quelques mois, car le sang ne peut s’écouler passivement dans le poumon qu’une fois achevée la baisse néonatale des résistances pulmonaires.</p>
<div class="lab">3. Fontan (2 à 5 ans)</div><p>Sang de la veine cave inférieure dirigé vers les artères pulmonaires, par un conduit extracardiaque ou un tunnel latéral intra-auriculaire, souvent avec une petite fenestration de décharge vers l’oreillette.</p>
<div class="lab">Variante historique</div><p>Fontan atriopulmonaire (oreillette droite reliée à l’artère pulmonaire) : l’oreillette très dilatée expose à des arythmies et à des thromboses ; conversion chirurgicale parfois proposée.</p></template>

<template data-pop="q21-fald" data-title="Hépatopathie associée au Fontan">
<div class="lab">Mécanisme</div><p>Hypertension veineuse systémique chronique et bas débit : le foie, placé en amont d’un circuit sans pompe, reste congestif et se fibrose progressivement.</p>
<div class="lab">Spectre</div><p>Selon l’ESC 2020, l’hépatopathie associée au Fontan va de la simple congestion à la fibrose sévère, avec signes d’hypertension portale, nodules hyperartérialisés et carcinome hépatocellulaire ; la dysfonction et la cirrhose hépatiques sont reconnues comme des complications typiques de cette circulation.</p>
<div class="lab">Surveillance</div><p>Biologie annuelle (hémogramme, albumine, fonctions hépatique et rénale). Chez l’adulte, IRM hépatique initiale lors de la première consultation, puis évaluation annuelle, par exemple échographie et alpha-fœtoprotéine, à envisager avec l’hépatologue ; l’imagerie hépatique régulière relève de la classe IIa.</p>
<div class="lab">Interprétation</div><p>La congestion modifie les examens du foie : les tests hépatiques et l’élastographie s’interprètent en tenant compte de l’hypertension veineuse, d’où l’intérêt d’un hépatologue familier de cette circulation.</p>
<div class="lab">Source</div><p>ESC 2020 sur les cardiopathies congénitales de l’adulte, European Heart Journal 2021;42:563-645, sections 4.16.2, 4.16.3 et 4.16.6.</p></template>

<template data-pop="q21-fontan-compl" data-title="Complications de la circulation de Fontan">
<div class="lab">Arythmies</div><p>Tachycardies auriculaires (surtout après Fontan atriopulmonaire), dysfonction sinusale ; mal tolérées : cardioversion rapide.</p>
<div class="lab">Thromboses</div><p>Dans le conduit, l’oreillette, les veines ; embolies pulmonaires ou paradoxales par la fenestration.</p>
<div class="lab">Entéropathie exsudative</div><p>Perte digestive de protéines : œdèmes, ascite, hypoalbuminémie, lymphopénie, diarrhée ; diagnostic par clairance fécale de l’alpha-1-antitrypsine. Cette protéine résiste à la digestion : une clairance fécale anormalement élevée étaye une perte de protéines plasmatiques dans l’intestin. Sa seule présence dans les selles ne suffit pas, car une excrétion normale existe. La congestion veineuse chronique perturbe le drainage lymphatique, et la lymphe perdue emporte protéines et lymphocytes. Le pronostic est réservé : la survie à 5 ans était inférieure à 50 % dans les séries anciennes et de 88 % dans une série récente.</p>
<div class="lab">Bronchite plastique</div><p>Moulages bronchiques riches en fibrine, liés à des fuites lymphatiques ; toux, expectoration de « branches », asphyxie possible.</p>
<div class="lab">Cyanose</div><p>Collatérales veino-veineuses, fenestration, fistules artérioveineuses pulmonaires.</p>
<div class="lab">Fontan défaillant</div><p>Dysfonction ventriculaire, résistances pulmonaires élevées, complications ci-dessus : bilan hémodynamique par cathétérisme et discussion de transplantation cardiaque, parfois cardiohépatique.</p></template>

<template data-pop="q21-eis-def" data-title="Syndrome d’Eisenmenger : définition">
<div class="lab">Place dans l’hypertension pulmonaire</div><p>Groupe 1 (hypertension artérielle pulmonaire), forme associée aux cardiopathies congénitales (ESC/ERS 2022).</p>
<div class="lab">Lésions en cause</div><p>Défauts post-tricuspides (CIV, canal artériel, canal atrioventriculaire, tronc commun) en règle dans l’enfance ; défauts pré-tricuspides (CIA) plus rarement et plus tardivement.</p>
<div class="lab">Historique</div><p>Décrit par Victor Eisenmenger en 1897 ; le terme de syndrome a été proposé par Paul Wood en 1958.</p></template>

<template data-pop="q21-eis-erythro" data-title="Érythrocytose secondaire et phlébotomie">
<div class="lab">Nature</div><p>Réponse adaptée à l’hypoxémie (érythropoïétine) ; elle restaure le transport d’oxygène. Le terme de « polyglobulie » est trompeur : il ne s’agit pas d’une maladie de la moelle.</p>
<div class="lab">Quand saigner</div><p>Symptômes modérés à sévères d’hyperviscosité, avec un hématocrite &gt; 65 %, après exclusion d’une déshydratation et d’une carence martiale. Soustraction de 400 à 500 mL avec compensation par 750 à 1 000 mL de soluté isotonique, afin d’éviter une chute de la précharge et de la pression artérielle.</p>
<div class="lab">Quand ne pas saigner</div><p>Pour « normaliser » un chiffre, chez un patient asymptomatique : les saignées répétées provoquent une carence martiale, qui aggrave la viscosité, la tolérance à l’effort et le risque d’accident vasculaire cérébral.</p>
<div class="lab">Réponse</div><p>Hydratation, correction prudente de la carence martiale, recherche d’une autre cause des symptômes.</p></template>

<template data-pop="q21-eis-prec" data-title="Précautions de vie dans le syndrome d’Eisenmenger">
<div class="lab">À éviter</div><p>Déshydratation (chaleur, vomissements, diarrhée, diurétiques excessifs) ; efforts intenses et isométriques ; exposition brusque à plus de 2 500 m d’altitude, alors qu’une montée progressive jusqu’à 2 500 m est souvent tolérée ; tabac ; grossesse ; œstrogènes ; AINS, qui aggravent la tendance hémorragique et la fonction rénale ; bains chauds prolongés, car la vasodilatation systémique augmente le shunt droite-gauche ; froid extrême.</p>
<div class="lab">Soins</div><p>Filtre à air sur toutes les lignes veineuses ; anesthésie et chirurgie en centre expert, avec une équipe connaissant la physiologie ; sédation avec prudence (hypoventilation, vasodilatation).</p>
<div class="lab">Prévention</div><p>Vaccinations (grippe, pneumocoque, COVID-19), hygiène dentaire et antibioprophylaxie, traitement rapide des infections respiratoires.</p>
<div class="lab">Voyages</div><p>Les vols commerciaux sont en général bien tolérés avec une bonne hydratation et une mobilisation en cabine ; oxygène en vol selon l’avis du centre.</p></template>

<template data-pop="q21-aaoca" data-title="Origine aortique anormale d’une artère coronaire">
<div class="lab">Anatomie à haut risque</div><p>Trajet interartériel entre l’aorte et l’artère pulmonaire ; segment intramural dans la paroi aortique ; ostium en fente ; angle de départ aigu ; ostium situé à plus de 1 cm au-dessus de la jonction sinotubulaire.</p>
<div class="lab">Mécanisme de l’ischémie</div><p>À l’effort, l’aorte se distend et comprime le segment intramural aplati ; l’ostium en fente se ferme en partie.</p>
<div class="lab">Gravité selon la forme</div><p>Coronaire gauche née du sinus droit : forme rare mais la plus associée à la mort subite d’effort. Coronaire droite née du sinus gauche : plus fréquente, risque plus faible.</p>
<div class="lab">Recommandations (ESC 2020)</div><p>Chirurgie recommandée chez le patient qui a un angor typique et, en plus, une ischémie d’effort dans le territoire concerné ou une anatomie à haut risque (I). Une imagerie fonctionnelle sous effort physique est recommandée pour confirmer ou exclure l’ischémie (I). À envisager chez l’asymptomatique avec ischémie, et chez l’asymptomatique porteur d’une origine anormale de la coronaire gauche avec anatomie à haut risque (IIa). Non recommandée pour une origine anormale de la coronaire droite asymptomatique sans ischémie ni anatomie à haut risque (III). Pour une coronaire gauche dans la même situation, la chirurgie peut se discuter avant 35 ans (IIb), car les morts subites touchent surtout le sujet jeune, pendant ou juste après l’effort.</p>
<div class="lab">Techniques</div><p>Désenrobage (« unroofing ») du segment intramural, réimplantation.</p></template>

<template data-pop="q21-alcapa" data-title="Origine de la coronaire gauche depuis l’artère pulmonaire (ALCAPA)">
<div class="lab">Physiopathologie</div><p>In utero et à la naissance, la pression pulmonaire élevée perfuse la coronaire gauche. Quand elle chute, le sang coule à rebours : de la coronaire droite, par des collatérales, vers la coronaire gauche puis l’artère pulmonaire (vol coronaire). Le myocarde gauche devient ischémique.</p>
<div class="lab">Nourrisson</div><p>Vers 6 à 8 semaines : pleurs, pâleur et sueurs aux tétées (angor du nourrisson), cardiomyopathie dilatée, insuffisance mitrale ischémique ; ECG avec ondes Q profondes en DI et aVL.</p>
<div class="lab">Adulte</div><p>Forme avec collatérales abondantes : souffle continu, insuffisance mitrale, arythmies ventriculaires, mort subite.</p>
<div class="lab">Traitement</div><p>Réimplantation chirurgicale de la coronaire dans l’aorte (ESC 2020, I) ; la fonction ventriculaire récupère souvent.</p>
<div class="lab">Nom</div><p>Syndrome de Bland-White-Garland.</p></template>

<template data-pop="q21-fistule" data-title="Fistules coronaires">
<div class="lab">Définition</div><p>Communication directe entre une coronaire et une cavité cardiaque (surtout droite) ou un vaisseau (artère pulmonaire, sinus coronaire).</p>
<div class="lab">Conséquences</div><p>Petites : fréquentes, sans conséquence, découverte fortuite au coroscanner. Grandes : souffle continu, surcharge de volume, vol coronaire avec ischémie, dilatation anévrismale et thrombose de l’artère nourricière, endocardite.</p>
<div class="lab">Traitement</div><p>Fermeture percutanée ou chirurgicale des fistules larges, symptomatiques ou compliquées.</p></template>

<template data-pop="q21-truncus" data-title="Tronc artériel commun">
<div class="lab">Anatomie</div><p>Un seul vaisseau quitte la base du cœur, au-dessus d’une CIV large, et donne l’aorte, les coronaires et les artères pulmonaires ; la valve troncale est souvent dysplasique et fuyante. Absence de cloisonnement conotroncal ; microdélétion 22q11.2 dans environ un tiers des cas.</p>
<div class="lab">Présentation</div><p>Cyanose légère et insuffisance cardiaque dans les premières semaines, quand les résistances pulmonaires chutent et que le débit pulmonaire devient excessif ; pouls bondissants.</p>
<div class="lab">Réparation</div><p>Dans les premières semaines : fermeture de la CIV (le tronc devient l’aorte) et conduit entre ventricule droit et artères pulmonaires, qu’il faudra remplacer plusieurs fois avec la croissance.</p></template>

<template data-pop="q21-vddi" data-title="Ventricule droit à double issue">
<div class="lab">Anatomie</div><p>Les deux gros vaisseaux naissent entièrement ou majoritairement du ventricule droit ; le ventricule gauche n’a pour issue qu’une CIV.</p>
<div class="lab">Formes selon la position de la CIV</div><p>CIV sous-aortique avec sténose pulmonaire : physiologie de tétralogie de Fallot. CIV sous-pulmonaire (anomalie de Taussig et Bing) : physiologie de transposition. CIV sous-aortique sans sténose : physiologie de grande CIV (hyperdébit, insuffisance cardiaque).</p>
<div class="lab">Réparation</div><p>Selon la forme : tunnel intraventriculaire du ventricule gauche vers l’aorte, associé si besoin à une détransposition artérielle ou à l’élargissement de la voie pulmonaire ; circulation de Fontan si la biventricularisation est impossible.</p></template>

<template data-pop="q21-hlhs" data-title="Hypoplasie du cœur gauche">
<div class="lab">Anatomie</div><p>Ventricule gauche, valves mitrale et aortique et aorte ascendante trop petits pour assurer la circulation systémique. Le ventricule droit alimente le corps à travers le canal artériel ; l’aorte ascendante est perfusée à rebours.</p>
<div class="lab">Présentation</div><p>Souvent diagnostiquée en prénatal. Sinon, choc vers le 2e au 7e jour à la fermeture du canal : marbrures, pouls faibles partout, acidose.</p>
<div class="lab">Urgence</div><p>Alprostadil ; oxygène limité (il augmente le débit pulmonaire au détriment du débit systémique) ; un foramen ovale restrictif impose une décompression auriculaire urgente.</p>
<div class="lab">Réparation</div><p>Palliation en trois étapes : opération de Norwood (néo-aorte construite à partir de l’artère pulmonaire, source contrôlée de débit pulmonaire), puis Glenn, puis Fontan. Une transplantation ou des soins de confort sont des alternatives discutées avec les parents.</p></template>

<template data-pop="q21-rao" data-title="Sténose aortique valvulaire congénitale">
<div class="lab">Anatomie</div><p>Valve unicuspide ou bicuspide épaisse, avec fusion commissurale.</p>
<div class="lab">Forme critique du nouveau-né</div><p>Circulation systémique ducto-dépendante : choc à la fermeture du canal, ventricule gauche dysfonctionnel. Alprostadil, puis valvuloplastie au ballon ou chirurgie en urgence.</p>
<div class="lab">Forme de l’enfant</div><p>Souffle éjectionnel au foyer aortique avec clic et frémissement suprasternal ; le plus souvent asymptomatique. Valvuloplastie au ballon (ou chirurgie) si le gradient est élevé ou en cas de symptômes, de modifications ECG ou de dysfonction ventriculaire. La fuite aortique consécutive et la resténose conduisent souvent à une opération de Ross ou à un remplacement valvulaire ultérieur.</p>
<div class="lab">Sport</div><p>Une sténose modérée ou sévère contre-indique le sport intense : risque de syncope et de mort subite à l’effort.</p></template>
