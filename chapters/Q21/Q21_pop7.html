
<!-- ===== FENÊTRES PARETO Q21 ===== -->
<template data-pop="pareto-q21-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="q21-1,q21-2"></p>
<ul><li>Trois familles : shunts gauche-droite (surcharge de volume), obstacles (surcharge de pression), cyanogènes (shunt droite-gauche, mélange, circulations en parallèle).</li><li>ESC 2020 : complexité légère, modérée, sévère → lieu du suivi (sévère = centre exclusivement).</li><li>Opéré ≠ guéri : patients « réparés », car fuites, sténoses et cicatrices résiduelles évoluent après la réparation.</li><li>Incidence 8–10/1 000 naissances ; CIV la plus fréquente ; &gt; 90 % atteignent l’âge adulte ; plus d’adultes que d’enfants atteints.</li><li>Suisse : ≈ 650–800 nouveau-nés par an (calcul) ; registre SACHER.</li></ul></template>

<template data-pop="pareto-q21-physio" data-title="Pareto — Physiopathologie générale">
<p class="ratio" data-cover="q21-3"></p>
<ul><li>La naissance révèle la malformation : chute des résistances pulmonaires, fermeture du foramen ovale et du canal.</li><li>Jours 2–7 : lésions ducto-dépendantes ; semaines 2–8 : shunts larges (insuffisance cardiaque).</li><li>Qp/Qs &gt; 1,5 = shunt significatif. CIA → cavités droites dilatées ; CIV et canal → cavités gauches dilatées.</li><li>Hyperdébit sous pression → maladie vasculaire pulmonaire → inversion du shunt (Eisenmenger) ; le cisaillement endothélial déclenche le remodelage ; rapide dans le canal atrioventriculaire et la trisomie 21.</li><li>Cyanose : shunt droite-gauche, mélange, circulations en parallèle ; érythrocytose, hippocratisme, hyperuricémie.</li><li>Ducto-dépendance : alprostadil dès la suspicion ; pas d’oxygène fort par réflexe, car l’oxygène contracte le canal.</li></ul></template>

<template data-pop="pareto-q21-clin" data-title="Pareto — Étiologies, syndromes, anamnèse et examen">
<p class="ratio" data-cover="q21-4,q21-5,q21-6,q21-7"></p>
<ul><li>Cause génétique : 10–30 % (ESC 2020) ; tératogènes : diabète, phénylcétonurie, rubéole, alcool, rétinoïdes, valproate, lithium (risque absolu faible). Récurrence 2–5 % ; 50 % si autosomique dominant.</li><li>Trisomie 21 → canal atrioventriculaire (échocardiographie systématique). Turner → bicuspidie, coarctation, index aortique. 22q11.2 → conotroncales, calcium, immunité, psychiatrie. Williams → sténose supravalvulaire, hypercalcémie. Marfan → racine aortique. Noonan → sténose pulmonaire dysplasique.</li><li>Nourrisson : biberons longs, sueurs, stagnation pondérale, hépatomégalie.</li><li>Adulte : arythmie auriculaire, dyspnée sous-estimée, embolie paradoxale.</li><li>Examen : PA aux 4 membres, SpO₂ main droite et pied, pouls fémoraux, courbes de croissance.</li><li>B2 dédoublé fixe = CIA ; holosystolique = CIV ; continu = canal ; souffle innocent : systolique, doux, variable, asymptomatique.</li><li>Le souffle mesure le gradient, pas la gravité : il naît de la turbulence d’un flux rapide ; quand les pressions s’égalisent, le souffle d’un canal ou d’une CIV larges diminue ou disparaît.</li></ul></template>

<template data-pop="pareto-q21-diag" data-title="Pareto — Démarche diagnostique et dépistage">
<p class="ratio" data-cover="q21-8"></p>
<ul><li>Échocardiographie = référence ; analyse segmentaire.</li><li>Prénatal : échographie à 20–23 semaines ; échocardiographie fœtale si facteur de risque.</li><li>Suisse : oxymétrie au pied avant 24 h chez tous ; &lt; 95 % → évaluation et échocardiographie.</li><li>Hyperoxie : &gt; 150 mmHg → cardiopathie cyanogène peu probable ; &lt; 100 mmHg → shunt fixe.</li><li>ETO : sinus venosus, retours veineux, bilan avant prothèse. IRM : volumes droits, Qp/Qs. Scanner : coronaires. Microbulles : foramen ovale.</li></ul></template>

<template data-pop="pareto-q21-urg" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="q21-9"></p>
<ul><li>Nouveau-né en choc ou cyanose réfractaire → alprostadil sans attendre, prévoir l’apnée, transfert.</li><li>Crise hypoxique : genoux-poitrine, oxygène, morphine, remplissage, bêtabloquant, phényléphrine → programmer la réparation.</li><li>Adulte : arythmies = cause majeure d’hospitalisation ; insuffisance cardiaque = 1re cause de décès dans les cohortes récentes ; mal tolérées dans le Fontan et le ventricule droit systémique.</li><li>Cyanosé : hémoptysie, abcès cérébral (céphalée nouvelle → imagerie), embolie paradoxale, car le shunt court-circuite le filtre pulmonaire ; filtres à air sur les voies veineuses.</li><li>Endocardite : matériel prothétique, cyanose, shunt résiduel. Dissection : Turner, Marfan, bicuspidie, coarctation.</li></ul></template>

<template data-pop="pareto-q21-cia" data-title="Pareto — Communication interauriculaire et foramen ovale">
<p class="ratio" data-cover="q21-10"></p>
<ul><li>Types : secundum (≈ 80 %, seul percutané, car il faut des berges pour ancrer la prothèse), primum, sinus venosus (retour veineux anormal), sinus coronaire.</li><li>Shunt diastolique réglé par la compliance ; symptômes souvent après 40 ans ; FA, flutter.</li><li>B2 dédoublé fixe, souffle pulmonaire d’hyperdébit ; ECG : axe droit et bloc droit incomplet (primum : axe gauche).</li><li>Fermer si surcharge droite et RVP &lt; 3 unités Wood (I), quels que soient les symptômes ; percutané si secundum ; 3–5 unités Wood : si Qp/Qs &gt; 1,5 ; Eisenmenger : contre-indiqué.</li><li>Ventricule gauche rigide : test d’occlusion au ballon, car la fermeture renvoie tout le retour veineux pulmonaire vers un ventricule gauche peu compliant et élève les pressions de remplissage.</li><li>Foramen ovale : ESO 2024 → fermeture + antiplaquettaire entre 18 et 60 ans si accident inexpliqué (forte) ; RoPE et PASCAL ; improbable → ne pas fermer ; &gt; 60 ans : individuel. Chercher d’abord une FA.</li></ul></template>

<template data-pop="pareto-q21-shunts" data-title="Pareto — CIV, canal artériel, canal atrioventriculaire">
<p class="ratio" data-cover="q21-11"></p>
<ul><li>CIV : périmembraneuse (70–80 %), musculaire (fermeture spontanée fréquente), infundibulaire (prolapsus aortique). Restrictive : souffle fort, peu de shunt ; non restrictive : insuffisance cardiaque à 4–8 semaines, risque d’Eisenmenger → chirurgie dans la 1re année.</li><li>Adulte : fermer si surcharge gauche et RVP &lt; 3 (I) ; endocardites répétées ou insuffisance aortique progressive (IIa).</li><li>Canal : souffle continu sous-claviculaire, pouls bondissants ; fermeture percutanée si surcharge gauche ; minuscule inaudible = rien ; large non fermé = cyanose différentielle.</li><li>Canal atrioventriculaire : trisomie 21, axe gauche, réparation à 3–6 mois (forme complète) ; adulte : fuite de la valve gauche, obstruction sous-aortique, bloc.</li></ul></template>

<template data-pop="pareto-q21-obst" data-title="Pareto — Obstacles">
<p class="ratio" data-cover="q21-12"></p>
<ul><li>Sténose pulmonaire : valvulaire en dôme (dysplasique = Noonan) ; sévère si gradient &gt; 64 mmHg (&gt; 4 m/s) → intervention (I) ; ballon pour la valve en dôme ; critique néonatale = ducto-dépendante.</li><li>Coarctation : isthme ; bicuspidie jusqu’à 85 %, Turner, anévrismes intracrâniens jusqu’à 10 % (imagerie cérébrale si symptômes selon l’ESC 2020). Néonatale : choc à la fermeture du canal. Adulte : hypertension des bras, fémoraux faibles, gradient bras-jambes &gt; 20 mmHg, encoches costales.</li><li>Réparer si hypertendu et gradient invasif ≥ 20 mmHg (stent préféré chez l’adulte, I).</li><li>Après réparation : hypertension fréquente, recoarctation, anévrisme ; imagerie tous les 3–5 ans.</li><li>Bicuspidie : 1–2 % ; chercher coarctation et aortopathie ; dépistage des apparentés ; détails en I35.</li></ul></template>

<template data-pop="pareto-q21-cyan" data-title="Pareto — Tétralogie de Fallot et transposition">
<p class="ratio" data-cover="q21-13"></p>
<ul><li>Fallot = 1 défaut (déviation du septum infundibulaire) → CIV, aorte à cheval, obstacle droit, hypertrophie droite ; 22q11.2 ≈ 15 %.</li><li>Cyanose selon l’obstacle ; crises hypoxiques ; accroupissement ; cœur en sabot ; souffle = obstacle droit.</li><li>Réparation à 3–6 mois ; adulte : fuite pulmonaire → dilatation droite → remplacement valvulaire (symptômes, VTDi ≥ 160, VTSi ≥ 80 mL/m²) ; QRS ≥ 180 ms = risque de mort subite.</li><li>Transposition : circulations en parallèle, cyanose sans souffle, alprostadil ± Rashkind, détransposition artérielle dans les 2–3 semaines, avant que le ventricule gauche, déchargé par la baisse des résistances pulmonaires, ne perde la masse nécessaire pour devenir systémique.</li><li>Adultes après Mustard/Senning : ventricule droit systémique, arythmies, dysfonction sinusale. Après Jatene : néo-aorte, branches pulmonaires, ostiums coronaires.</li><li>Transposition corrigée : double discordance, bloc auriculoventriculaire (≈ 2 %/an), fuite tricuspide.</li><li>Autres critiques : tronc commun (22q11.2, conduit), ventricule droit à double issue (physiologie Fallot, transposition ou CIV), hypoplasie du cœur gauche (alprostadil, Norwood → Glenn → Fontan), sténose aortique critique (ballon).</li></ul></template>

<template data-pop="pareto-q21-fontan" data-title="Pareto — Ventricule unique et Fontan">
<p class="ratio" data-cover="q21-14"></p>
<ul><li>Étapes : palliation néonatale → Glenn (3–6 mois) → Fontan (2–5 ans).</li><li>Aucune pompe pulmonaire ; seul moteur : la pression veineuse systémique ; exige RVP basses (pression pulmonaire moyenne &lt; 15 mmHg), bon remplissage, valve atrioventriculaire continente, rythme sinusal.</li><li>Complications : foie (fibrose, cirrhose, carcinome), entéropathie exsudative, bronchite plastique, thromboses, arythmies, cyanose, Fontan défaillant → transplantation.</li><li>Anticoagulation si thrombus, arythmie auriculaire ou événement thromboembolique (ESC 2020, I) ; bénéfice non démontré chez tous ; anticoagulants directs pas encore standard.</li><li>Tachycardie auriculaire = urgence : cardioversion rapide, car la perte du rythme sinusal fait chuter le débit d’une circulation sans pompe pulmonaire, et les médicaments sont souvent inefficaces (ESC 2020).</li><li>Suivi au moins annuel en centre : échocardiographie, ECG, biologie, épreuve d’effort ; IRM hépatique initiale, puis échographie et alpha-fœtoprotéine annuelles avec l’hépatologue ; cathétérisme sans tarder si œdèmes, déclin à l’effort, arythmie, cyanose ou hémoptysie (I).</li></ul></template>

<template data-pop="pareto-q21-eis" data-title="Pareto — Syndrome d’Eisenmenger">
<p class="ratio" data-cover="q21-15"></p>
<ul><li>Shunt large non fermé → maladie vasculaire pulmonaire → shunt inversé ; HTAP groupe 1 (pression pulmonaire moyenne &gt; 20 mmHg, RVP &gt; 2 unités Wood).</li><li>Cyanose, hippocratisme, B2 éclatant, souffle absent ; atteinte multisystémique.</li><li>Fermeture contre-indiquée ; shunts : &lt; 3 unités Wood fermer, 3–5 discuter, ≥ 5 : fermeture fenestrée d’une CIA seulement si les résistances baissent sous traitement ; pour une CIV ou un canal, décision individuelle en centre si Qp/Qs &gt; 1,5.</li><li>Bosentan (I, ESC/ERS 2022 ; BREATHE-5) ; inhibiteur de la phosphodiestérase de type 5 ou association (IIa).</li><li>Carence martiale à corriger ; phlébotomie seulement si hyperviscosité et hématocrite &gt; 65 %, car l’érythrocytose compense l’hypoxémie et les saignées créent une carence martiale.</li><li>Grossesse contre-indiquée (mWHO IV) ; contraception sans œstrogène ; filtres ; pas de déshydratation ; centre pour toute anesthésie.</li><li>Crase et glycémie faussées par l’hématocrite.</li></ul></template>

<template data-pop="pareto-q21-ebco" data-title="Pareto — Ebstein et anomalies coronaires">
<p class="ratio" data-cover="q21-16"></p>
<ul><li>Ebstein : feuillets tricuspides déplacés (≥ 8 mm/m²), ventricule droit atrialisé, fuite tricuspide ; CIA ou foramen (cyanose, embolie paradoxale) ; voies accessoires (pré-excitation).</li><li>ECG : grandes P, bloc droit ; chirurgie (réparation en cône) si fuite sévère avec symptômes ou baisse d’effort ; ablation des voies accessoires.</li><li>Lithium : risque absolu faible ; échocardiographie fœtale.</li><li>Origine aortique anormale : coronaire gauche du sinus droit = la plus dangereuse ; trajet interartériel, segment intramural ; syncope ou douleur d’effort ; coroscanner + ischémie ; chirurgie si angor typique avec ischémie d’effort concordante ou anatomie à haut risque (I) ; sans symptôme, coronaire gauche à anatomie à haut risque : IIa.</li><li>ALCAPA : ischémie du nourrisson à 6–8 semaines, Q en DI–aVL → chirurgie (I). Fistules larges → fermeture.</li></ul></template>

<template data-pop="pareto-q21-suivi" data-title="Pareto — Organisation, transition et suivi">
<p class="ratio" data-cover="q21-17"></p>
<ul><li>Tout adulte vu au moins une fois en centre ; niveau selon la complexité.</li><li>Transition dès 12 ans, transfert à 16–18 ans ; risque majeur : perte de suivi.</li><li>Suisse : assurance invalidité jusqu’à 20 ans, puis assurance obligatoire des soins.</li><li>Santé mentale : anxiété, dépression, troubles attentionnels fréquents ; psychologue et travailleur social dans chaque centre (ESC 2020).</li><li>Sport encouragé ; compétition après évaluation. Endocardite : hygiène dentaire, prophylaxie si haut risque. Vaccins OFSP. Conduite selon la SSC.</li><li>Chirurgie non cardiaque en centre pour Fontan, Eisenmenger, ventricule systémique défaillant.</li></ul></template>

<template data-pop="pareto-q21-grossesse" data-title="Pareto — Grossesse et situations particulières">
<p class="ratio" data-cover="q21-18"></p>
<ul><li>Volume +40–50 %, débit +30–50 %, résistances systémiques ↓ (cyanose ↑), hypercoagulabilité, fragilité aortique.</li><li>mWHO (ESC 2018 et mWHO 2.0 de l’ESC 2025) : I–II shunts simples réparés, Fallot réparé ; II–III canal atrioventriculaire, coarctation réparée ; III Fontan non compliqué, ventricule droit systémique à bonne fonction (II–III possible selon l’ESC 2025), cyanose ; IV Eisenmenger, HTAP, dysfonction systémique sévère, ventricule droit systémique dysfonctionnel, Fontan compliqué, coarctation sévère, aorte très dilatée (Marfan &gt; 45 mm, Turner avec index &gt; 25 mm/m²).</li><li>Équipe grossesse-cœur dès II–III ; consultation préconceptionnelle (génétique, médicaments).</li><li>Voie basse préférée. SpO₂ maternelle &lt; 85 % → ≈ 12 % de naissances vivantes (fausses couches, retard de croissance, prématurité). Échocardiographie fœtale.</li><li>Tératogènes : antagonistes de l’endothéline, IEC, ARA II, antivitamine K.</li><li>Contraception : progestatifs seuls ou dispositif hormonal ; pas d’œstrogène si cyanose, Fontan, HTAP.</li><li>Altitude : vols tolérés si stable ; éviter la haute altitude prolongée (cyanose, Fontan).</li></ul></template>

<template data-pop="pareto-q21-oxy" data-title="Pareto — Oxymétrie et gaz du sang">
<p class="ratio" data-cover="q21-e-2"></p>
<ul><li>Pied ≥ 95 % : normal ; 90–94 % : contrôle ; &lt; 90 % : échocardiographie immédiate.</li><li>Main droite &gt; pied : shunt droite-gauche ductal (hypertension pulmonaire persistante, coarctation). Pied &gt; main : transposition compliquée.</li><li>Dépistage négatif ≠ absence de cardiopathie (coarctation manquée) ; palper les fémoraux.</li><li>Hyperoxie : &gt; 150 mmHg rassurant ; &lt; 100 mmHg shunt fixe ; test court.</li></ul></template>

<template data-pop="pareto-q21-echo" data-title="Pareto — ECG, radiographie et échocardiographie">
<p class="ratio" data-cover="q21-e-3,q21-e-4"></p>
<ul><li>Axe gauche = canal atrioventriculaire ; axe droit + bloc droit incomplet = CIA ; grandes P = Ebstein ; bloc auriculoventriculaire = transposition corrigée ; QRS ≥ 180 ms = Fallot à risque.</li><li>T positive en V1 après la 1re semaine = hypertrophie droite.</li><li>Sabot = Fallot ; œuf couché = transposition ; « 3 » + encoches = coarctation ; cardiomégalie globuleuse = Ebstein.</li><li>Échocardiographie : ventricule droit &gt; 41 mm dilaté ; TAPSE &lt; 17 mm ; fuite tricuspide &gt; 2,8 m/s = hypertension pulmonaire possible ; Qp/Qs &gt; 1,5 ; sténose pulmonaire sévère &gt; 64 mmHg.</li><li>Dilatation droite inexpliquée → chercher sinus venosus et retour veineux anormal (ETO, IRM).</li></ul></template>

<template data-pop="pareto-q21-bio" data-title="Pareto — IRM, cathétérisme, biologie et effort">
<p class="ratio" data-cover="q21-e-5,q21-e-6,q21-e-7"></p>
<ul><li>IRM = référence des volumes droits et des débits ; Fallot : VTDi ≥ 160, VTSi ≥ 80 mL/m² ; fraction de régurgitation &gt; 30–40 %.</li><li>Scanner = anatomie coronaire ; limiter l’irradiation.</li><li>Cathétérisme = référence hémodynamique : saut ≥ 7 points (oreillette) ou ≥ 5 (ventricule, artère) ; Flamm (3 × veine cave supérieure + veine cave inférieure)/4 ; RVP = gradient transpulmonaire / Qp.</li><li>Biologie du cyanosé : Hb « normale » = anémie relative ; carence martiale (saturation &lt; 20 %, microcytose) ; crase faussée (citrate) ; glycémie faussement basse.</li><li>Génétique : analyse chromosomique sur puce en première intention si syndromique ou conotroncal.</li><li>Épreuve cardiorespiratoire : objective la limitation, critère d’intervention.</li></ul></template>

<template data-pop="pareto-q21-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="q21-e-1,q21-e-2,q21-e-3,q21-e-4,q21-e-5,q21-e-6,q21-e-7"></p>
<ul><li>Références : échocardiographie (anatomie), IRM (ventricule droit, débits), scanner (coronaires), cathétérisme (résistances).</li><li>Oxymétrie au pied &lt; 95 % → échocardiographie.</li><li>ECG et radiographie : signatures lésionnelles (axe gauche, sabot, « 3 », grandes P).</li><li>Seuils : Qp/Qs &gt; 1,5 ; RVP 3 et 5 unités Wood ; sténose pulmonaire &gt; 64 mmHg ; coarctation ≥ 20 mmHg pic à pic ; Fallot VTDi 160 / VTSi 80 mL/m².</li><li>Cyanosé : crase sur citrate ajusté, fer, acide urique, rein.</li><li>Microbulles : &lt; 3 cycles = intracardiaque, &gt; 20 bulles = large shunt ; Doppler transcrânien le plus sensible (Spencer). Aorte : score Z, index de Turner &gt; 25 mm/m², coarctation ≥ 50 %.</li><li>Épreuve d’effort : consommation maximale d’oxygène &lt; 85 % de la prédite, pente ventilatoire &gt; 30, désaturation ≥ 5 points.</li></ul></template>

<template data-pop="pareto-q21-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="q21-se,q21-sa,q21-sp,q21-sh,q21-sg"></p>
<ul><li>Cœur formé entre les semaines 3 et 8 : tératogènes précoces.</li><li>Secundum = septum primum résorbé ; primum et canal atrioventriculaire = bourrelets endocardiques ; Fallot = septum infundibulaire dévié ; transposition = septum conotroncal non spiralé ; tronc commun = absence de septum ; crête neurale + <i>TBX1</i> → 22q11.2.</li><li>Foramen ovale = passage oblique entre septum secundum et primum.</li><li>Analyse segmentaire : situs → jonction atrioventriculaire → jonction ventriculo-artérielle ; ventricule identifié par sa morphologie (bande modératrice = droit).</li><li>Circulation fœtale : canal veineux, foramen ovale, canal artériel ; transition : fermeture du canal en 24–72 h, chute des RVP sur 6–8 semaines.</li><li>Heath et Edwards I–III réversibles, IV–VI irréversibles ; RVP au cathétérisme comme substitut imparfait (vasoréactivité et biopsie non validées pour l’opérabilité).</li><li>Génétique : aneuploïdies, microdélétions (22q11.2, 7q11.23), monogéniques (<i>NKX2-5</i>, <i>TBX5</i>, <i>PTPN11</i>, <i>FBN1</i>, <i>NOTCH1</i>), multifactoriel ; tester les parents.</li></ul></template>

<template data-pop="pareto-q21-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="q21-p-1,q21-p-2,q21-p-3,q21-p-4,q21-p-5,q21-p-6"></p>
<ul><li>Alprostadil : 0,01–0,025 µg/kg/min si canal ouvert, 0,05–0,1 si fermé ou choc, puis dose minimale ; apnée = ventiler, ne pas arrêter.</li><li>Prématuré : ibuprofène 10–5–5 mg/kg ou paracétamol ; contre-indiqués si ducto-dépendance.</li><li>Eisenmenger : bosentan 62,5 → 125 mg × 2 (transaminases, test de grossesse) ; sildénafil 20 mg × 3, tadalafil 40 mg ; pas de vasodilatateur systémique, qui augmenterait le shunt droite-gauche.</li><li>Ventricule droit systémique ou unique : diurétiques ; thérapie fondamentale sans preuve. Ventricule gauche systémique : comme en I50.</li><li>Arythmies : ablation d’abord ; amiodarone → thyrotoxicose fréquente. Anticoagulation : FA/flutter des formes modérées et sévères, Fontan compliqué, valve mécanique (antivitamine K).</li><li>Crise hypoxique : morphine 0,1 mg/kg, remplissage 10–20 mL/kg, bêtabloquant, phényléphrine.</li><li>Prophylaxie : amoxicilline 2 g (50 mg/kg).</li><li>Interactions : bosentan–contraception hormonale ; phosphodiestérase 5–nitrés ; INR faussé par l’hématocrite. AINS au 3e trimestre : fermeture du canal fœtal.</li></ul></template>
