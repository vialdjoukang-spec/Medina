
<!-- ===== FENÊTRES Q21 : organisation, grossesse, examens ===== -->
<template data-pop="q21-centres" data-title="Organisation des soins et réseau suisse">
<div class="lab">Principe (ESC 2020)</div><p>Chaque adulte porteur d’une cardiopathie congénitale est vu au moins une fois dans un centre spécialisé, qui fixe le niveau de soins : suivi exclusif en centre, suivi partagé, ou suivi en cardiologie générale avec accès au centre.</p>
<div class="lab">En Suisse</div><p>Les consultations spécialisées se trouvent dans les hôpitaux universitaires et des centres affiliés. Le registre SACHER (registre suisse des cardiopathies congénitales de l’adulte) documente cette population et favorise la recherche multicentrique.</p>
<div class="lab">Intervalles indicatifs</div><p>L’ESC 2020 précise les intervalles de suivi lésion par lésion ; ils se raccourcissent lorsque l’état clinique se dégrade. Une désaturation, une arythmie, une hypertension pulmonaire ou une dysfonction annoncent des complications plus rapides ; les patients cyanosés sont ainsi revus tous les 6 à 12 mois en centre.</p></template>

<template data-pop="q21-transition-soins" data-title="Transition de la pédiatrie à la médecine adulte">
<div class="lab">Définition</div><p>Processus éducatif planifié, distinct du simple transfert de dossier, qui prépare l’adolescent à gérer sa maladie de façon autonome.</p>
<div class="lab">Calendrier</div><p>Début vers 12 ans ; consultations en partie sans les parents à partir du milieu de l’adolescence ; transfert vers 16 à 18 ans, idéalement lors d’une consultation commune ou d’une clinique de transition.</p>
<div class="lab">Contenus</div><p>Connaître son diagnostic, ses opérations, ses traitements et les signes d’alerte ; prophylaxie de l’endocardite ; contraception, grossesse et hérédité ; sport, orientation professionnelle, conduite, assurances ; tabac, alcool, drogues, tatouages et piercings ; santé psychique.</p>
<div class="lab">Risque principal</div><p>Le risque principal est la perte de suivi au moment du transfert. Le patient revient alors tard, pour une complication qui aurait pu être évitée : dilatation ventriculaire droite, arythmie ou endocardite. Ces lésions résiduelles progressent souvent sans symptôme pendant des années, d’où l’intérêt d’un suivi ininterrompu.</p></template>

<template data-pop="q21-ai" data-title="Infirmités congénitales et assurance invalidité (Suisse)">
<div class="lab">Principe</div><p>Les cardiopathies congénitales figurent dans la liste des infirmités congénitales de l’ordonnance fédérale. Pour les assurés de moins de 20 ans, l’assurance invalidité prend en charge les mesures médicales nécessaires à leur traitement.</p>
<div class="lab">À 20 ans</div><p>La prise en charge passe à l’assurance obligatoire des soins, avec franchise et quote-part. Ce changement, qui coïncide avec la transition, est une cause de rupture du suivi.</p>
<div class="lab">Conseil pratique</div><p>Annonce à l’assurance invalidité dès le diagnostic ; information de l’adolescent et de sa famille sur le changement à venir ; orientation vers un service social si nécessaire.</p></template>

<template data-pop="q21-sport" data-title="Activité physique et sport">
<div class="lab">Principe</div><p>L’activité physique régulière est recommandée à presque tous les patients : elle améliore la capacité d’effort, la qualité de vie et le risque cardiovasculaire acquis.</p>
<div class="lab">Évaluation avant le sport de compétition</div><p>Fonction ventriculaire, pression pulmonaire, saturation d’effort, arythmies (Holter, épreuve d’effort), aorte, anticoagulation (sports de contact). La décision relève du cardiologue spécialisé après cette évaluation complète.</p>
<div class="lab">Restrictions habituelles</div><p>Hypertension pulmonaire et Eisenmenger : pas de sport intense. Aortopathie dilatée : éviter les efforts isométriques lourds et les sports de collision. Origine anormale coronaire à haut risque non opérée : pas de compétition. Anticoagulation : éviter les sports de contact.</p>
<div class="lab">Pourquoi ces restrictions</div><p>L’effort dynamique augmente le débit cardiaque et abaisse les résistances systémiques. Dans l’hypertension pulmonaire et le syndrome d’Eisenmenger, des résistances pulmonaires fixes empêchent le débit pulmonaire de suivre : le shunt droite-gauche augmente, la saturation chute et une syncope peut survenir. L’effort isométrique élève brutalement la pression artérielle, donc la tension de la paroi d’une aorte dilatée. Dans une origine aortique anormale d’une coronaire, l’ischémie d’effort est attribuée à la compression du segment intramural par l’aorte distendue. Sous anticoagulant, un choc expose à une hémorragie, notamment intracrânienne.</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2020 juge les médecins souvent trop restrictifs : l’activité physique améliore la condition, le bien-être et le risque cardiovasculaire acquis, et les complications d’effort restent rares. Elle préfère l’effort dynamique à l’effort statique et demande de mesurer la capacité d’effort avant de fixer une intensité ; l’épreuve cardiorespiratoire permet une prescription individualisée.</p>
<div class="lab">Source complémentaire</div><p>ESC 2020 sur les cardiopathies congénitales de l’adulte, European Heart Journal 2021;42:563-645, sections 3.3.4, 3.5.5, 4.6.6 et 4.17 ; ESC/ERS 2022 sur l’hypertension pulmonaire, European Heart Journal 2022;43:3618-3731, section 7.5.2.</p>
</template>

<template data-pop="q21-chirnc" data-title="Chirurgie non cardiaque chez l’adulte congénital">
<div class="lab">Où opérer</div><p>Dans un centre disposant d’une anesthésie expérimentée pour les patients Fontan, Eisenmenger, cyanosés, à ventricule systémique défaillant ou en hypertension pulmonaire.</p>
<div class="lab">Fontan</div><p>Préserver le retour veineux : jeûne court, hydratation, ventilation spontanée si possible, pressions de ventilation basses, laparoscopie avec prudence (le pneumopéritoine réduit le retour veineux).</p>
<div class="lab">Eisenmenger</div><p>Éviter toute chute des résistances systémiques (anesthésie rachidienne en injection unique, vasodilatateurs) et toute hausse des résistances pulmonaires (hypoxie, hypercapnie, acidose) ; filtres à air ; prévention de la thrombose sans excès de saignement.</p>
<div class="lab">Tous</div><p>Antibioprophylaxie selon le risque ; gestion des anticoagulants ; interrogation des stimulateurs et défibrillateurs.</p>
<div class="lab">Pourquoi ces précautions</div><p>Dans le Fontan, aucun ventricule ne propulse le sang dans les poumons : le débit pulmonaire dépend de l’écart entre la pression veineuse systémique et celle de l’oreillette. Le jeûne et l’hypovolémie abaissent la première ; la ventilation en pression positive et le pneumopéritoine élèvent la pression intrathoracique ou abdominale et freinent le retour veineux. Le débit cardiaque chute alors. Dans le syndrome d’Eisenmenger, une baisse des résistances systémiques, comme la vasodilatation d’une rachianesthésie, ou une hausse des résistances pulmonaires par hypoxie, hypercapnie ou acidose augmentent le shunt droite-gauche et la désaturation. Le filtre à air empêche qu’une bulle injectée gagne le cerveau par le shunt.</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2020 retient comme facteurs de risque périopératoire la cyanose, l’insuffisance cardiaque, l’hypertension pulmonaire, une cardiopathie complexe et l’urgence. Elle demande d’opérer le Fontan, l’Eisenmenger et le patient cyanosé dans un centre expert. L’ESC/ERS 2022 limite les interventions à celles qui sont indispensables chez les patients porteurs d’une hypertension artérielle pulmonaire d’origine congénitale.</p>
<div class="lab">Source complémentaire</div><p>ESC 2020 sur les cardiopathies congénitales de l’adulte, European Heart Journal 2021;42:563-645, sections 3.5.6 et 4.16 ; ESC/ERS 2022 sur l’hypertension pulmonaire, European Heart Journal 2022;43:3618-3731, section 7.5.2.</p>
</template>

<template data-pop="q21-mwho" data-title="Classification mWHO 2.0 (ESC 2025) : cardiopathies congénitales">
<div class="lab">I</div><p>Petites lésions ou lésions légères : sténose pulmonaire légère, petit canal artériel. Lésions simples réparées avec succès : CIA, CIV, canal artériel, retour veineux pulmonaire anormal.</p>
<div class="lab">II</div><p>CIA ou CIV non opérée ; tétralogie de Fallot réparée ; syndrome de Turner sans dilatation aortique.</p>
<div class="lab">II–III</div><p>Canal atrioventriculaire ; coarctation réparée ; syndrome de Marfan sans dilatation aortique ; bicuspidie avec aorte &lt; 45 mm.</p>
<div class="lab">III</div><p>Circulation de Fontan non compliquée et ventricule droit systémique à fonction bonne ou légèrement diminuée (classe III dans l’ESC 2018 ; l’ESC 2025 peut les classer II–III lorsque la fonction ventriculaire, les valves, le rythme, la tolérance à l’effort et la saturation sont normaux) ; cardiopathie cyanogène non réparée ; autre cardiopathie complexe ; dilatation aortique modérée (Marfan 40–45 mm, bicuspidie 45–50 mm, Turner avec index de taille aortique 20–25 mm/m², tétralogie &lt; 50 mm).</p>
<div class="lab">IV : grossesse contre-indiquée</div><p>Hypertension artérielle pulmonaire, dont le syndrome d’Eisenmenger ; dysfonction ventriculaire systémique sévère (fraction d’éjection &lt; 30 % ou classe NYHA III–IV) ; ventricule droit systémique à fonction modérément ou sévèrement diminuée ; <b>Fontan avec n’importe quelle complication</b> ; (re)coarctation sévère ; dilatation aortique sévère (Marfan &gt; 45 mm, bicuspidie &gt; 50 mm, Turner avec index de taille aortique &gt; 25 mm/m², tétralogie &gt; 50 mm).</p>
<div class="lab">Usage</div><p>Le risque maternel d’événement cardiaque augmente d’une classe à l’autre. À partir de la classe II–III, la patiente est suivie par une équipe pluridisciplinaire grossesse-cœur. En classe IV, une grossesse survenue fait discuter une interruption. La classe se complète par des modificateurs individuels (saturation, peptides natriurétiques, arythmies).</p>
<div class="lab">Source</div><p>ESC 2025, tableau mWHO 2.0 ; ESC 2018, tableau 3. Les situations de classe IV sont identiques dans les deux versions, en particulier le Fontan compliqué et le syndrome de Turner avec index de taille aortique &gt; 25 mm/m². En cas de divergence de lecture, retenir la classe la plus élevée : une grossesse n’est jamais encouragée au-delà de ce seuil.</p>
<div class="lab">Pourquoi le risque augmente</div><p>Dès 6 semaines de grossesse, le débit cardiaque augmente de 30 à 50 % et les résistances périphériques baissent de 20 à 50 % ; la grossesse est aussi un état d’hypercoagulabilité. Un ventricule systémique défaillant ne peut pas fournir ce débit supplémentaire. Dans le syndrome d’Eisenmenger, la vasodilatation systémique augmente le shunt droite-gauche, la cyanose s’aggrave et le ventricule droit, face à des résistances fixes, risque de défaillir ; s’y ajoutent les embolies paradoxales. Une circulation de Fontan, sans pompe pulmonaire, tolère mal la surcharge de volume, les arythmies et l’état prothrombotique. Une aorte dilatée subit à la fois la hausse du débit et les modifications hormonales de sa paroi ; chez la femme atteinte d’un syndrome de Marfan, les dissections surviennent plus souvent après l’accouchement que pendant la grossesse.</p>
<div class="lab">Chiffres utiles</div><p>Le taux d’événements cardiaques maternels atteint 19 à 27 % en classe III et 40 à 100 % en classe IV. Chez la femme cyanosée, une saturation supérieure à 90 % ramène la perte fœtale vers 10 %.</p>
<div class="lab">Source complémentaire</div><p>ESC 2025 sur les maladies cardiovasculaires et la grossesse, European Heart Journal 2025;46:4462-4568, section 3.2 et chapitres sur l’hypertension pulmonaire et les aortopathies ; ESC 2020 sur les cardiopathies congénitales de l’adulte, European Heart Journal 2021;42:563-645, tableau 10.</p>
</template>

<template data-pop="q21-contracep" data-title="Contraception chez la patiente porteuse d’une cardiopathie congénitale">
<div class="lab">Méthodes préférées</div><p>Dispositif intra-utérin au lévonorgestrel, implant à l’étonogestrel, pilule progestative seule (désogestrel) : efficaces et sans risque thrombotique notable. Sans œstrogène, ils ne stimulent pas la synthèse hépatique des facteurs de la coagulation.</p>
<div class="lab">Œstrogènes : à éviter si</div><p>Cyanose, circulation de Fontan, hypertension pulmonaire, antécédent thrombotique, prothèse mécanique, arythmie auriculaire, dysfonction ventriculaire sévère. Une thrombose veineuse peut alors devenir une embolie paradoxale ou obstruer une circulation sans pompe pulmonaire ; une anticoagulation associée ne neutralise pas ce risque de façon démontrée.</p>
<div class="lab">Pièges</div><p>Pose d’un dispositif intra-utérin : réaction vagale possible, grave chez une patiente Fontan ou Eisenmenger, d’où une pose en milieu hospitalier. Elle survient chez environ 5 % des femmes ; la bradycardie et la vasodilatation font chuter un débit qui dépend du retour veineux (Fontan) ou augmentent le shunt droite-gauche (Eisenmenger). Bosentan : réduit l’efficacité des méthodes hormonales ; il faut une méthode non exclusivement hormonale en plus.</p>
<div class="lab">Contraception d’urgence</div><p>Le lévonorgestrel oral est utilisable.</p></template>

<template data-pop="q21-altitude" data-title="Altitude et voyages aériens">
<div class="lab">Physiologie</div><p>En altitude, la baisse de la pression partielle en oxygène provoque une vasoconstriction pulmonaire hypoxique : les résistances pulmonaires montent. Dans un Fontan, le débit baisse ; dans un shunt, le passage droite-gauche augmente.</p>
<div class="lab">Vols commerciaux</div><p>Cabine pressurisée à une altitude équivalente de 1 800 à 2 400 m environ : généralement bien tolérée par les patients stables, y compris cyanosés, avec hydratation et mobilisation. L’hydratation et la mobilisation préviennent la thrombose veineuse, que l’immobilité et l’érythrocytose favorisent. Oxygène en vol si le centre le juge utile.</p>
<div class="lab">Séjours en montagne</div><p>Les patients cyanosés, Fontan ou Eisenmenger évitent les séjours prolongés en haute altitude ; ascension progressive et avis préalable du centre pour les autres. Pour le patient cyanosé, l’ESC 2020 déconseille l’exposition aiguë au-delà de 2 500 m et juge qu’une ascension progressive jusqu’à cette altitude peut être tolérée.</p></template>

<template data-pop="q21-ecg" data-title="ECG des cardiopathies congénitales">
<div class="lab">Lire selon l’âge</div><p>Nouveau-né : dominance droite normale (axe droit, grande onde R en V1). Ondes T positives en V1 normales la première semaine, anormales ensuite jusqu’à l’adolescence (hypertrophie ventriculaire droite).</p>
<div class="lab">Signatures</div><p>Tableau croisé ECG–radiographie–échocardiographie de l’onglet Examens (îlot 3). À retenir en plus : ondes Q en DI et aVL chez un nourrisson = origine pulmonaire de la coronaire gauche ; rythme auriculaire bas = CIA sinus venosus.</p>
<div class="lab">Adulte opéré</div><p>Tétralogie réparée : bloc de branche droit ; une durée du QRS ≥ 180 ms ou un allongement rapide signale un risque d’arythmie ventriculaire. Transposition après réparation atriale : dysfonction sinusale, rythme jonctionnel.</p>
<div class="lab">Mécanismes des signatures</div><p>Dans la CIA, la surcharge de volume dilate le ventricule droit et allonge son activation : l’aspect rsR′ apparaît en V1 et l’axe se porte à droite. Dans la transposition corrigée, les branches du faisceau de His sont inversées avec les ventricules ; le septum s’active de droite à gauche, d’où des ondes Q en V1 et leur absence en V6. Son nœud auriculoventriculaire, relié à un faisceau long et fragile, explique un bloc complet qui survient chez environ 2 % des patients par an. Dans l’anomalie d’Ebstein, l’oreillette droite très dilatée inscrit de grandes ondes P, la portion atrialisée du ventricule droit retarde la conduction, et des voies accessoires fréquentes donnent une pré-excitation.</p><p>Dans la tétralogie réparée, la ventriculotomie et le patch lèsent la branche droite ; la durée du QRS augmente ensuite avec la dilatation du ventricule droit, alors que les cicatrices et les isthmes anatomiques lents forment le substrat des tachycardies ventriculaires. Dans l’origine pulmonaire de la coronaire gauche, l’ischémie du territoire antérolatéral explique les ondes Q en DI et aVL. Après réparation atriale, les sutures lèsent le nœud sinusal ou son artère, d’où la dysfonction sinusale et le rythme jonctionnel.</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2020 intègre la durée du QRS à une stratification du risque de mort subite qui comprend aussi la fonction ventriculaire, les tachycardies non soutenues et la cicatrice. Un bloc auriculoventriculaire progressif fait discuter un stimulateur dans la transposition corrigée et le canal atrioventriculaire, où un bloc complet peut survenir tardivement.</p>
<div class="lab">Source complémentaire</div><p>ESC 2020 sur les cardiopathies congénitales de l’adulte, European Heart Journal 2021;42:563-645, sections 4.1.3, 4.3.1, 4.9.3, 4.10 et 4.13 ; Gatzoulis et al., Circulation 1995;92:231-237 ; Warnes, Circulation 2006;114:2699-2709 ; Attenhofer Jost et al., Circulation 2007;115:277-285.</p>
</template>

<template data-pop="q21-rx" data-title="Radiographie thoracique : silhouettes évocatrices">
<div class="lab">Vascularisation pulmonaire</div><p>Augmentée (shunt gauche-droite, transposition) ; diminuée (tétralogie, atrésie pulmonaire, Ebstein) ; artères proximales dilatées avec périphérie pauvre (Eisenmenger) ; œdème (retour veineux pulmonaire total obstrué, obstacle gauche).</p>
<div class="lab">Silhouettes</div><p>Voir le tableau de l’onglet Examens (îlot 3). En plus : élargissement supérieur en « bonhomme de neige » (retour veineux pulmonaire total supracardiaque) ; opacité en cimeterre à droite (retour veineux anormal partiel dans la veine cave inférieure).</p>
<div class="lab">Arc aortique droit</div><p>Évoque une tétralogie ou une microdélétion 22q11.2.</p>
<div class="lab">Mécanismes</div><p>Le calibre des artères pulmonaires suit le débit qu’elles reçoivent. Un shunt gauche-droite, ou une transposition où le ventricule gauche éjecte dans l’artère pulmonaire, les élargissent ; un obstacle droit associé à un shunt droite-gauche les amincit. Dans le syndrome d’Eisenmenger, la pression élevée dilate les artères proximales, alors que l’oblitération des artérioles raréfie la périphérie.</p><p>Dans la coarctation, le « 3 » associe la dilatation d’amont, l’incisure de l’obstacle et la dilatation d’aval. Les encoches costales, des 3e et 4e jusqu’aux 8e côtes, sont creusées par les artères intercostales dilatées qui servent de collatérales ; elles demandent des années pour se former. Dans la tétralogie, la pointe relevée par l’hypertrophie ventriculaire droite et le creux de l’arc moyen, dû à une artère pulmonaire petite, dessinent le sabot. Dans la transposition, l’aorte et l’artère pulmonaire superposées d’avant en arrière rétrécissent le pédicule. Dans l’anomalie d’Ebstein, l’oreillette droite très dilatée donne la cardiomégalie globuleuse, et le faible débit pulmonaire laisse des poumons clairs.</p>
<div class="lab">Ce qui change la décision</div><p>La radiographie oriente sans mesurer : une hypervascularisation fait rechercher un shunt, puis l’échocardiographie le localise et le quantifie. L’ESC 2020 note qu’une hypervascularisation de la CIA est souvent méconnue.</p>
<div class="lab">Source complémentaire</div><p>ESC 2020 sur les cardiopathies congénitales de l’adulte, European Heart Journal 2021;42:563-645, sections 4.1.3, 4.6.3 et 4.11.3 ; Attenhofer Jost et al., Circulation 2007;115:277-285.</p>
</template>

<template data-pop="q21-echo-seg" data-title="Échocardiographie des cardiopathies congénitales">
<div class="lab">Question clinique</div><p>Quelle est l’anatomie segmentaire, quel est le retentissement, et quelles lésions résiduelles existent après une réparation ?</p>
<div class="lab">Fenêtres</div><p>Sous-costale (situs, septum interauriculaire, retours veineux : la meilleure chez l’enfant), parasternale, apicale, suprasternale (arche aortique, isthme, canal artériel). Chez l’adulte, la distance plus grande et l’interposition du poumon dégradent l’image sous-costale.</p>
<div class="lab">Mesures</div><p>Diamètres et fonction des ventricules (TAPSE, onde S′, variation fractionnelle de surface), gradients par Bernoulli, pression pulmonaire systolique par la vitesse de la fuite tricuspide, Qp/Qs, insertion des valves atrioventriculaires.</p>
<div class="lab">Limites</div><p>Fenêtres acoustiques limitées chez l’adulte opéré ; ventricule droit mal quantifié par une seule coupe ; structures postérieures et veineuses mieux vues en transœsophagien ou en IRM. Le ventricule droit s’enroule autour du gauche : aucune coupe unique ne contient tout son volume.</p>
<div class="lab">Sécurité</div><p>Non irradiante ; répétable à chaque consultation.</p></template>

<template data-pop="q21-irm-vd" data-title="IRM dans les cardiopathies congénitales">
<div class="lab">Question clinique</div><p>Quels sont les volumes et la fonction du ventricule droit, quelle est la fraction de régurgitation, quel est le Qp/Qs, où sont la fibrose et les sténoses vasculaires ?</p>
<div class="lab">Séquences</div><p>Ciné-IRM (volumes et fractions d’éjection, référence) ; contraste de phase (débits, fraction de régurgitation, Qp/Qs) ; angiographie IRM (aorte, branches pulmonaires, retours veineux) ; rehaussement tardif (fibrose).</p>
<div class="lab">Seuils décisionnels</div><p>Tétralogie réparée : volume télédiastolique indexé du ventricule droit ≥ 160 mL/m² ou télésystolique ≥ 80 mL/m² (ESC 2020). Fraction de régurgitation pulmonaire &gt; 30 à 40 % : fuite sévère (ESC 2020).</p>
<div class="lab">Limites</div><p>Artefacts des stents et des prothèses ; dispositifs implantés (protocole adapté) ; arythmies ; claustrophobie ; sédation chez le jeune enfant.</p></template>

<template data-pop="q21-cath" data-title="Cathétérisme : oxymétrie étagée et résistances">
<div class="lab">Oxymétrie étagée</div><p>Prélèvements successifs dans les veines caves, l’oreillette droite, le ventricule droit, l’artère pulmonaire, une veine pulmonaire (ou l’oreillette gauche) et l’aorte. Saut significatif : ≥ 7 points entre veines caves et oreillette droite ; ≥ 5 points entre oreillette et ventricule droits ou entre ventricule droit et artère pulmonaire. Le seuil est plus haut à l’étage auriculaire, car le sang des deux veines caves et du sinus coronaire, de saturations différentes, s’y mélange mal.</p>
<div class="lab">Calculs</div><p>Qp/Qs par les saturations ; débits absolus par la méthode de Fick (consommation d’oxygène mesurée ou estimée) ; résistances pulmonaires = (pression pulmonaire moyenne − pression capillaire) / Qp.</p>
<div class="lab">Test de vasoréactivité</div><p>Monoxyde d’azote inhalé, avec ou sans oxygène : une baisse des résistances plaide pour une maladie encore réversible et soutient la discussion d’opérabilité. Inhalé, le monoxyde d’azote dilate les seuls vaisseaux pulmonaires ventilés, sans effet systémique. Aucune donnée prospective ne valide toutefois ce test pour décider d’une fermeture, et l’ESC 2020 ne le recommande pas pour une CIA dont les résistances atteignent 5 unités Wood.</p>
<div class="lab">Risques</div><p>Les risques sont faibles en centre expert. Des cathétérismes répétés dans l’enfance laissent parfois des veines fémorales occluses par thrombose, ce qui impose de prévoir un autre accès.</p></template>

<template data-pop="q21-bio" data-title="Biologie du patient cyanosé : pièges">
<div class="lab">Crase</div><p>Hématocrite élevé = moins de plasma dans le tube = excès relatif de citrate : temps de Quick et temps de céphaline faussement allongés. Correction : volume de citrate (mL) = 0,00185 × volume de sang (mL) × (100 − hématocrite en %), formule utilisée par les laboratoires d’hémostase.</p>
<div class="lab">Glycémie</div><p>Faussement basse si l’analyse est retardée (consommation par les globules rouges).</p>
<div class="lab">Fer</div><p>Carence martiale fréquente : saturation de la transferrine &lt; 20 %, microcytose ; la ferritine est moins fiable en cas d’inflammation. Une hémoglobine « normale » chez un patient très désaturé est une anémie relative.</p>
<div class="lab">Autres</div><p>Hyperuricémie ; thrombopénie modérée ; protéinurie ; bilirubine non conjuguée élevée (<button class="w" data-k="q21-cyan-sys">renouvellement érythrocytaire accru</button>) et lithiase pigmentaire.</p></template>
