
<!-- ===== FENÊTRES Q21 : notions fondamentales ===== -->
<template data-pop="q21-fetal" data-title="Circulation fœtale">
<div class="lab">Principe</div><p>Le placenta assure l’oxygénation. Trois dérivations écartent le sang des organes qui ne fonctionnent pas encore : le canal veineux court-circuite le foie, le foramen ovale et le canal artériel court-circuitent le poumon.</p>
<div class="lab">Conséquence clinique</div><p>Presque toutes les cardiopathies sont bien tolérées in utero, car chaque ventricule peut compenser l’autre par les dérivations. Elles se révèlent à la naissance, quand les dérivations se ferment.</p></template>

<template data-pop="q21-transition" data-title="Adaptation circulatoire à la naissance">
<div class="lab">Séquence</div><p>Première respiration → chute des résistances pulmonaires → hausse du débit pulmonaire et de la pression de l’oreillette gauche → fermeture fonctionnelle du foramen ovale. Oxygène et chute des prostaglandines → contraction du canal artériel (fermeture fonctionnelle en 24 à 72 heures à terme, anatomique en 2 à 3 semaines).</p>
<div class="lab">Suite</div><p>Les résistances pulmonaires continuent de baisser pendant 6 à 8 semaines, par amincissement de la média des artérioles.</p>
<div class="lab">Situations qui retardent la transition</div><p>Hypoxie, acidose, infection, inhalation méconiale : hypertension pulmonaire persistante du nouveau-né, avec shunt droite-gauche par le canal et le foramen ovale.</p>
<div class="lab">Pourquoi les résistances pulmonaires chutent</div><p>Avant la naissance, les alvéoles sont remplies de liquide et les résistances pulmonaires dépassent les résistances systémiques : le sang éjecté par le ventricule droit passe de l’artère pulmonaire à l’aorte par le canal. Les premières respirations chassent ce liquide et aèrent le poumon. La pression partielle en oxygène s’élève, les résistances pulmonaires baissent et le débit pulmonaire augmente ; ce débit remplace le retour veineux ombilical comme source de remplissage du cœur gauche.</p>
<div class="lab">Pourquoi le canal se ferme</div><p>In utero, la prostaglandine de type E, en grande partie d’origine placentaire, relâche le muscle du canal ; chez le prématuré, le monoxyde d’azote y contribue. À la naissance, le clampage du cordon supprime le placenta, et le poumon désormais perfusé dégrade les prostaglandines : leur taux s’effondre. L’oxygène inhibe en même temps des canaux potassiques des cellules musculaires du canal ; la membrane se dépolarise, le calcium entre et la paroi se contracte. Dans les dix premières minutes, le flux devient bidirectionnel puis gauche-droite, et il diminue jusqu’à la fermeture fonctionnelle.</p>
<div class="lab">Source complémentaire</div><p>Hooper et al., <i>Pediatric Research</i> 2015 ; Crockett et al., <i>Congenital Heart Disease</i> 2019.</p>
</template>

<template data-pop="q21-rvp" data-title="Résistances vasculaires pulmonaires et unités Wood">
<div class="lab">Définition</div><p>Résistances pulmonaires = (pression artérielle pulmonaire moyenne − pression capillaire pulmonaire) / débit pulmonaire. L’unité est le mmHg·min/L, appelée unité Wood ; 1 unité Wood = 80 dyn·s·cm⁻⁵.</p>
<div class="lab">Valeurs</div><p>Normale chez l’adulte : environ 1 unité Wood. Supérieure à 2 unités Wood : composante précapillaire d’une hypertension pulmonaire (ESC/ERS 2022).</p>
<div class="lab">Chez l’enfant</div><p>On utilise les résistances indexées à la surface corporelle (unités Wood·m²).</p>
<div class="lab">Piège</div><p>Utiliser le débit pulmonaire (Qp), jamais le débit systémique, pour le calcul en présence d’un shunt, car seul ce débit traverse le lit pulmonaire. Une érythrocytose majore aussi les résistances calculées, en augmentant la viscosité du sang : l’hématocrite entre dans leur interprétation.</p></template>

<template data-pop="q21-shuntdet" data-title="Déterminants d’un shunt">
<div class="lab">Défaut restrictif</div><p>Petit orifice : il limite lui-même le débit et maintient un gradient de pression élevé. Exemple : petite CIV, souffle intense, shunt faible.</p>
<div class="lab">Défaut non restrictif</div><p>Grand orifice : les pressions s’égalisent et la direction du flux dépend des résistances d’aval. CIV ou canal : résistances pulmonaires contre résistances systémiques. CIA : compliance du ventricule droit contre celle du ventricule gauche.</p>
<div class="lab">Exemples de modulation</div><p>Une hypertension artérielle ou une rigidité ventriculaire gauche augmentent le shunt d’une CIA ; une hypoxie ou une altitude élevée, qui élèvent les résistances pulmonaires, diminuent le shunt d’une CIV et peuvent l’inverser.</p>
<div class="lab">Corrélation thérapeutique</div><p>Chez le nourrisson en insuffisance cardiaque par CIV large, l’oxygène à forte concentration abaisse les résistances pulmonaires et augmente le shunt : il est utilisé avec retenue.</p></template>

<template data-pop="q21-qpqs" data-title="Rapport Qp/Qs">
<div class="lab">Définition</div><p>Rapport du débit pulmonaire (Qp) au débit systémique (Qs). Égal à 1 sans shunt ; &gt; 1 en cas de shunt gauche-droite ; &lt; 1 en cas de shunt droite-gauche.</p>
<div class="lab">Calcul par l’oxymétrie (Fick)</div><p>Qp/Qs = (saturation aortique − saturation veineuse mêlée) / (saturation veineuse pulmonaire − saturation artérielle pulmonaire). La consommation d’oxygène s’élimine du rapport. En présence d’une CIA, le sang de l’oreillette droite est déjà enrichi par le shunt : la saturation veineuse mêlée s’estime en amont, à partir des veines caves.</p>
<div class="lab">Autres méthodes</div><p>Échocardiographie (intégrale temps-vitesse × surface de chaque voie d’éjection) ; IRM par contraste de phase, la plus fiable.</p>
<div class="lab">Seuil</div><p>&gt; 1,5 : shunt hémodynamiquement significatif, argument de fermeture si les résistances pulmonaires le permettent. Le rapport décide surtout entre 3 et 5 unités Wood. Sous 3 unités Wood, la dilatation des cavités qui reçoivent le shunt juge mieux sa portée que le calcul.</p>
<div class="lab">Exemple</div><p>Aorte 96 %, veine cave supérieure 70 %, veine pulmonaire 98 %, artère pulmonaire 84 % : (96 − 70) / (98 − 84) = 26 / 14 ≈ 1,9.</p></template>

<template data-pop="q21-heath" data-title="Maladie vasculaire pulmonaire : classification de Heath et Edwards">
<div class="lab">Stades</div><p>I : hypertrophie de la média. II : prolifération cellulaire de l’intima. III : fibrose intimale concentrique, occlusion progressive. IV : lésions plexiformes et dilatations. V : lésions angiomatoïdes, dépôts d’hémosidérine. VI : artérite nécrosante.</p>
<div class="lab">Réversibilité</div><p>Stades I à III : régression possible après fermeture du shunt. Stades IV à VI : irréversibles.</p>
<div class="lab">Usage actuel</div><p>Classification histologique historique (1958). La décision clinique repose aujourd’hui sur les résistances mesurées au cathétérisme et leur réponse aux vasodilatateurs pulmonaires.</p>
<div class="lab">Mécanisme du remodelage</div><p>Un grand shunt post-tricuspide transmet au poumon un débit élevé sous une pression proche de la pression systémique. Les forces de cisaillement anormales lèsent l’endothélium des artérioles ; l’ESC 2020 désigne ce cisaillement comme le déclencheur de la maladie vasculaire pulmonaire, sur un terrain génétique variable. L’endothélium lésé produit moins de monoxyde d’azote et de prostacycline, et davantage d’endothéline 1 : la vasoconstriction et la prolifération des cellules musculaires lisses l’emportent. La média s’épaissit, puis l’intima prolifère et obstrue la lumière.</p>
<div class="lab">Ce qui change la décision</div><p>Fermer le shunt supprime le stimulus tant que les lésions restent réversibles : c’est la raison de fermer tôt les grands shunts post-tricuspides. Chez l’adulte, aucune donnée prospective ne valide la biopsie pulmonaire ni le test de vasoréactivité pour juger l’opérabilité.</p>
<div class="lab">Source complémentaire</div><p>Recommandations ESC 2020 sur les cardiopathies congénitales de l’adulte, section 3.4.3 ; recommandations ESC/ERS 2022 sur l’hypertension pulmonaire, sections 6.3.3 et 7.5.</p>
</template>

<template data-pop="q21-cyanose" data-title="Cyanose : physiologie et pièges">
<div class="lab">Mécanisme</div><p>Coloration bleutée due à la désoxyhémoglobine dans les capillaires superficiels. Elle devient visible au-delà d’environ 50 g/L de désoxyhémoglobine capillaire.</p>
<div class="lab">Piège de l’anémie</div><p>Pour une même saturation, un patient anémique contient moins de désoxyhémoglobine : il peut être profondément hypoxémique sans cyanose visible. À l’inverse, un patient polyglobulique paraît cyanosé plus tôt.</p>
<div class="lab">Piège de l’œil</div><p>L’œil ne détecte pas de façon fiable une saturation de 85 à 94 %, surtout chez le nouveau-né à peau foncée ou en lumière artificielle : d’où l’oxymétrie systématique.</p>
<div class="lab">Autres causes</div><p>Méthémoglobinémie (saturation mesurée autour de 85 %, sang « chocolat », pression partielle en oxygène normale). L’oxymètre plafonne vers 84 à 86 % quand la méthémoglobine atteint environ 35 %, et il surestime alors la saturation réelle ; la pression partielle reste normale, car elle mesure l’oxygène dissous ; cyanose périphérique par vasoconstriction (extrémités froides, langue rose).</p></template>

<template data-pop="q21-parallele" data-title="Circulations en parallèle (transposition)">
<div class="lab">Principe</div><p>Normalement, les deux circulations sont en série : le sang passe alternativement par le poumon et par le corps. Dans la transposition, elles sont en parallèle : le sang systémique désaturé retourne à l’aorte et le sang oxygéné retourne au poumon.</p>
<div class="lab">Condition de survie</div><p>Un mélange entre les deux circuits : foramen ovale, canal artériel, CIV. Le plus efficace est le mélange auriculaire, d’où l’atrioseptostomie de Rashkind.</p>
<div class="lab">Signe clinique</div><p>Cyanose profonde qui ne cède pas à l’oxygène, sans détresse respiratoire proportionnée ; souvent aucun souffle.</p></template>

<template data-pop="q21-ductdep" data-title="Cardiopathies ducto-dépendantes">
<div class="lab">Circulation pulmonaire ducto-dépendante</div><p>Atrésie pulmonaire, sténose pulmonaire critique, atrésie tricuspide avec obstacle pulmonaire, tétralogie extrême. Fermeture du canal : cyanose brutale et profonde.</p>
<div class="lab">Circulation systémique ducto-dépendante</div><p>Hypoplasie du cœur gauche, sténose aortique critique, coarctation critique, interruption de l’arche. Fermeture du canal : choc, pouls fémoraux faibles, acidose, insuffisance rénale.</p>
<div class="lab">Mélange ducto-dépendant</div><p>Transposition simple avec foramen ovale restrictif.</p>
<div class="lab">Conduite</div><p>Alprostadil en perfusion continue dès la suspicion ; transfert vers un centre de cardiologie pédiatrique et de chirurgie cardiaque.</p></template>

<template data-pop="q21-segment" data-title="Analyse segmentaire séquentielle">
<div class="lab">Principe</div><p>Décrire le cœur en trois segments (oreillettes, ventricules, gros vaisseaux) et deux jonctions, en identifiant chaque cavité par sa morphologie et non par sa position.</p>
<div class="lab">Étapes</div><p>1. Situs atrial (solitus, inversus, isomérisme droit ou gauche). 2. Connexion atrioventriculaire (concordante, discordante, univentriculaire). 3. Connexion ventriculo-artérielle (concordante, discordante, double issue, issue unique). 4. Lésions associées.</p>
<div class="lab">Hétérotaxie</div><p>Défaut de latéralisation : l’isomérisme droit (asplénie) s’accompagne de cardiopathies cyanogènes complexes et d’un risque infectieux ; l’isomérisme gauche (polysplénie) d’une interruption de la veine cave inférieure et de blocs auriculoventriculaires.</p>
<div class="lab">Exemple</div><p>Transposition congénitalement corrigée : situs solitus, connexion atrioventriculaire discordante, connexion ventriculo-artérielle discordante.</p></template>

<template data-pop="q21-complex" data-title="Complexité des cardiopathies congénitales de l’adulte (ESC 2020)">
<div class="lab">Légère</div><p>Maladie valvulaire aortique congénitale isolée et bicuspidie ; maladie valvulaire mitrale congénitale isolée, sauf valve en parachute et fente valvulaire ; sténose pulmonaire légère isolée (infundibulaire, valvulaire ou supravalvulaire) ; petite CIA, CIV ou petit canal artériel isolés ; CIA ostium secundum, CIA sinus venosus, CIV ou canal artériel réparés sans lésion résiduelle ni séquelle (dilatation d’une cavité, dysfonction ventriculaire, élévation de la pression pulmonaire).</p>
<div class="lab">Modérée</div><p>Retour veineux pulmonaire anormal partiel ou total ; origine anormale d’une coronaire depuis l’artère pulmonaire ou depuis le sinus opposé ; sténose aortique sous-valvulaire ou supravalvulaire ; canal atrioventriculaire partiel ou complet ; CIA ostium secundum moyenne ou large non réparée ; coarctation ; ventricule droit à double chambre ; anomalie d’Ebstein ; syndrome de Marfan et maladies héréditaires apparentées de l’aorte thoracique, syndrome de Turner ; canal artériel moyen ou large non réparé ; sténoses pulmonaires périphériques ; sténose pulmonaire modérée ou sévère ; anévrisme ou fistule du sinus de Valsalva ; CIA sinus venosus ; tétralogie de Fallot réparée ; transposition après détransposition artérielle ; CIV avec lésions associées ou shunt au moins modéré. Dans chaque cas, en l’absence de maladie vasculaire pulmonaire.</p>
<div class="lab">Sévère</div><p>Toute cardiopathie, réparée ou non, associée à une maladie vasculaire pulmonaire (dont le syndrome d’Eisenmenger) ; toute cardiopathie cyanogène non opérée ou palliée ; ventricule à double issue ; circulation de Fontan ; interruption de l’arche aortique ; atrésie pulmonaire sous toutes ses formes ; transposition des gros vaisseaux, sauf après détransposition artérielle ; cœur univentriculaire (ventricule à double entrée, atrésie tricuspide ou mitrale, hypoplasie du cœur gauche) ; tronc artériel commun ; autres anomalies complexes des connexions atrioventriculaires et ventriculo-artérielles (cœur entrecroisé, hétérotaxie, inversion ventriculaire, dont la transposition congénitalement corrigée).</p>
<div class="lab">Conséquence</div><p>L’ESC 2020 distingue trois niveaux de soins : suivi exclusivement en centre spécialisé, suivi partagé avec la cardiologie adulte générale, ou suivi en consultation non spécialisée avec accès au centre si besoin. La complexité n’est pas le seul critère : une lésion anatomiquement simple, comme une CIA avec hypertension artérielle pulmonaire, peut exiger un centre. C’est pourquoi chaque adulte est vu au moins une fois en centre spécialisé, qui fixe le niveau de soins et les intervalles de suivi.</p>
<div class="lab">Source</div><p>ESC 2020 sur les cardiopathies congénitales de l’adulte, European Heart Journal 2021;42:563-645, section 3.2 et tableau 4.</p></template>

<template data-pop="q21-mnemo-5t" data-title="Les « 5 T » des cardiopathies cyanogènes">
<p><b>T</b>étralogie de Fallot ;<br><b>T</b>ransposition des gros vaisseaux ;<br><b>T</b>ronc artériel commun ;<br>a<b>T</b>résie <b>T</b>ricuspide ;<br>re<b>T</b>our veineux pulmonaire anormal <b>T</b>otal.</p>
<div class="lab">Compléments indispensables</div><p>Atrésie pulmonaire, anomalie d’Ebstein sévère, hypoplasie du cœur gauche, ventricule unique.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. Il ne dit rien de la fréquence : la tétralogie de Fallot et la transposition sont de loin les plus fréquentes.</p></template>

<template data-pop="q21-htap" data-title="Hypertension artérielle pulmonaire associée aux cardiopathies congénitales">
<div class="lab">Définition hémodynamique (ESC/ERS 2022)</div><p>Hypertension pulmonaire : pression artérielle pulmonaire moyenne &gt; 20 mmHg au repos. Précapillaire : pression capillaire ≤ 15 mmHg et résistances vasculaires pulmonaires &gt; 2 unités Wood.</p>
<div class="lab">Quatre formes cliniques (groupe 1)</div><p>1. Syndrome d’Eisenmenger. 2. Hypertension pulmonaire avec shunt gauche-droite prédominant, opérable ou non. 3. Hypertension pulmonaire avec petit défaut, sans rapport hémodynamique avec lui (comportement proche de la forme idiopathique). 4. Hypertension pulmonaire persistante ou apparue après fermeture d’un défaut.</p>
<div class="lab">Implication</div><p>La forme 4 est de pronostic plus sombre que l’Eisenmenger, car le ventricule droit a perdu le shunt qui le déchargeait et affronte seul des résistances élevées : elle justifie de mesurer les résistances avant toute fermeture. La forme 3 évolue comme l’hypertension artérielle pulmonaire idiopathique, probablement parce qu’elle partage la même vasculopathie proliférative ; la fermeture du petit défaut y est contre-indiquée.</p></template>
<template data-pop="q21-cyan-sys" data-title="Cyanose chronique : retentissement sur les organes">
<div class="lab">Adaptation normale à l’hypoxémie</div><p>Une saturation artérielle basse stimule la sécrétion d’érythropoïétine : la masse de globules rouges augmente et restaure le contenu artériel en oxygène. La courbe de dissociation de l’hémoglobine se déplace vers la droite, ce qui facilite la libération de l’oxygène aux tissus, et le débit cardiaque augmente. Cette érythrocytose secondaire est une compensation et non une maladie de la moelle. Elle est dite compensée tant que l’hématocrite reste stable ; elle devient décompensée quand il monte sans fin, avec des symptômes d’hyperviscosité.</p>
<div class="lab">Mécanisme des complications</div><p>La viscosité du sang croît avec la masse de globules rouges, et l’hypoxémie s’accompagne d’une dysfonction endothéliale marquée : la microcirculation de tous les organes en souffre. L’hémostase est perturbée à plusieurs niveaux. Les plaquettes sont moins nombreuses et fonctionnent moins bien, les facteurs de coagulation dépendants de la vitamine K et le facteur V baissent, la fibrinolyse augmente et les plus grands multimères du facteur de von Willebrand disparaissent. Le patient saigne donc facilement, mais il thrombose aussi, par stase dans les cavités et les artères pulmonaires dilatées, dysfonction endothéliale, matériel prothétique et arythmies.</p>
<p>Le renouvellement accru des globules rouges produit davantage d’acide urique et de bilirubine non conjuguée. Le rein filtre mal l’urate : l’hyperuricémie favorise la goutte. La bilirubine précipite en calculs de bilirubinate de calcium, qui peuvent se compliquer de cholécystite. Le rein subit des anomalies fonctionnelles et structurelles, d’où une protéinurie et une baisse de la filtration fréquentes. S’y ajoutent l’hippocratisme digital, l’ostéoarthropathie hypertrophiante et la cyphoscoliose.</p>
<div class="lab">Conséquence clinique</div><p>Les hémoptysies, les accidents vasculaires cérébraux et les thromboses des grandes artères pulmonaires dilatées, présentes chez jusqu’à 30 % des patients cyanosés, découlent de ces deux versants de l’hémostase. La mortalité des patients cyanosés est nettement plus élevée que celle des patients non cyanosés.</p>
<div class="lab">Ce qui change la décision</div><p>L’hyperuricémie asymptomatique ne se traite pas ; la goutte se traite en surveillant la fonction rénale et le risque hémorragique. Le bilan comprend un hémogramme avec volume globulaire moyen, une ferritine et une saturation de la transferrine, la créatinine, l’acide urique et la crase, car la carence martiale, l’atteinte rénale et les troubles de l’hémostase sont fréquents et silencieux. Les médicaments néphrotoxiques et la déshydratation sont évités, et les produits de contraste iodés sont utilisés avec prudence. L’anticoagulation n’est pas systématique, faute de bénéfice démontré et à cause du risque hémorragique ; elle se discute en cas de flutter ou de fibrillation auriculaire. La saignée obéit à des règles strictes, qui protègent les réserves en fer (<button class="w" data-k="q21-eis-erythro">quand saigner</button>).</p>
<div class="lab">Source</div><p>Recommandations ESC 2020 sur les cardiopathies congénitales de l’adulte, section 3.4.8 ; recommandations ESC/ERS 2022 sur l’hypertension pulmonaire, section 7.5.</p>
</template>
