
<!-- ===== FENÊTRES Q21 : notions fondamentales ===== -->
<template data-pop="q21-fetal" data-title="Circulation fœtale">
<div class="lab">Principe</div><p>Le placenta assure l’oxygénation. Trois dérivations écartent le sang des organes qui ne fonctionnent pas encore : le canal veineux court-circuite le foie, le foramen ovale et le canal artériel court-circuitent le poumon.</p>
<div class="lab">Conséquence clinique</div><p>Presque toutes les cardiopathies sont bien tolérées in utero, car chaque ventricule peut compenser l’autre par les dérivations. Elles se révèlent à la naissance, quand les dérivations se ferment.</p></template>

<template data-pop="q21-transition" data-title="Adaptation circulatoire à la naissance">
<div class="lab">Séquence</div><p>Première respiration → chute des résistances pulmonaires → hausse du débit pulmonaire et de la pression de l’oreillette gauche → fermeture fonctionnelle du foramen ovale. Oxygène et chute des prostaglandines → contraction du canal artériel (fermeture fonctionnelle en 24 à 72 heures à terme, anatomique en 2 à 3 semaines).</p>
<div class="lab">Suite</div><p>Les résistances pulmonaires continuent de baisser pendant 6 à 8 semaines, par amincissement de la média des artérioles.</p>
<div class="lab">Situations qui retardent la transition</div><p>Hypoxie, acidose, infection, inhalation méconiale : hypertension pulmonaire persistante du nouveau-né, avec shunt droite-gauche par le canal et le foramen ovale.</p></template>

<template data-pop="q21-rvp" data-title="Résistances vasculaires pulmonaires et unités Wood">
<div class="lab">Définition</div><p>Résistances pulmonaires = (pression artérielle pulmonaire moyenne − pression capillaire pulmonaire) / débit pulmonaire. L’unité est le mmHg·min/L, appelée unité Wood ; 1 unité Wood = 80 dyn·s·cm⁻⁵.</p>
<div class="lab">Valeurs</div><p>Normale chez l’adulte : environ 1 unité Wood. Supérieure à 2 unités Wood : composante précapillaire d’une hypertension pulmonaire (ESC/ERS 2022).</p>
<div class="lab">Chez l’enfant</div><p>On utilise les résistances indexées à la surface corporelle (unités Wood·m²).</p>
<div class="lab">Piège</div><p>Utiliser le débit pulmonaire (Qp), jamais le débit systémique, pour le calcul en présence d’un shunt.</p></template>

<template data-pop="q21-shuntdet" data-title="Déterminants d’un shunt">
<div class="lab">Défaut restrictif</div><p>Petit orifice : il limite lui-même le débit et maintient un gradient de pression élevé. Exemple : petite CIV, souffle intense, shunt faible.</p>
<div class="lab">Défaut non restrictif</div><p>Grand orifice : les pressions s’égalisent et la direction du flux dépend des résistances d’aval. CIV ou canal : résistances pulmonaires contre résistances systémiques. CIA : compliance du ventricule droit contre celle du ventricule gauche.</p>
<div class="lab">Exemples de modulation</div><p>Une hypertension artérielle ou une rigidité ventriculaire gauche augmentent le shunt d’une CIA ; une hypoxie ou une altitude élevée, qui élèvent les résistances pulmonaires, diminuent le shunt d’une CIV et peuvent l’inverser.</p>
<div class="lab">Corrélation thérapeutique</div><p>Chez le nourrisson en insuffisance cardiaque par CIV large, l’oxygène à forte concentration abaisse les résistances pulmonaires et augmente le shunt : il est utilisé avec retenue.</p></template>

<template data-pop="q21-qpqs" data-title="Rapport Qp/Qs">
<div class="lab">Définition</div><p>Rapport du débit pulmonaire (Qp) au débit systémique (Qs). Égal à 1 sans shunt ; &gt; 1 en cas de shunt gauche-droite ; &lt; 1 en cas de shunt droite-gauche.</p>
<div class="lab">Calcul par l’oxymétrie (Fick)</div><p>Qp/Qs = (saturation aortique − saturation veineuse mêlée) / (saturation veineuse pulmonaire − saturation artérielle pulmonaire). La consommation d’oxygène s’élimine du rapport.</p>
<div class="lab">Autres méthodes</div><p>Échocardiographie (intégrale temps-vitesse × surface de chaque voie d’éjection) ; IRM par contraste de phase, la plus fiable.</p>
<div class="lab">Seuil</div><p>&gt; 1,5 : shunt hémodynamiquement significatif, argument de fermeture si les résistances pulmonaires le permettent.</p>
<div class="lab">Exemple</div><p>Aorte 96 %, veine cave supérieure 70 %, veine pulmonaire 98 %, artère pulmonaire 84 % : (96 − 70) / (98 − 84) = 26 / 14 ≈ 1,9.</p></template>

<template data-pop="q21-heath" data-title="Maladie vasculaire pulmonaire : classification de Heath et Edwards">
<div class="lab">Stades</div><p>I : hypertrophie de la média. II : prolifération cellulaire de l’intima. III : fibrose intimale concentrique, occlusion progressive. IV : lésions plexiformes et dilatations. V : lésions angiomatoïdes, dépôts d’hémosidérine. VI : artérite nécrosante.</p>
<div class="lab">Réversibilité</div><p>Stades I à III : régression possible après fermeture du shunt. Stades IV à VI : irréversibles.</p>
<div class="lab">Usage actuel</div><p>Classification histologique historique (1958). La décision clinique repose aujourd’hui sur les résistances mesurées au cathétérisme et leur réponse aux vasodilatateurs pulmonaires.</p></template>

<template data-pop="q21-cyanose" data-title="Cyanose : physiologie et pièges">
<div class="lab">Mécanisme</div><p>Coloration bleutée due à la désoxyhémoglobine dans les capillaires superficiels. Elle devient visible au-delà d’environ 50 g/L de désoxyhémoglobine capillaire.</p>
<div class="lab">Piège de l’anémie</div><p>Pour une même saturation, un patient anémique contient moins de désoxyhémoglobine : il peut être profondément hypoxémique sans cyanose visible. À l’inverse, un patient polyglobulique paraît cyanosé plus tôt.</p>
<div class="lab">Piège de l’œil</div><p>L’œil ne détecte pas de façon fiable une saturation de 85 à 94 %, surtout chez le nouveau-né à peau foncée ou en lumière artificielle : d’où l’oxymétrie systématique.</p>
<div class="lab">Autres causes</div><p>Méthémoglobinémie (saturation mesurée autour de 85 %, sang « chocolat », pression partielle en oxygène normale) ; cyanose périphérique par vasoconstriction (extrémités froides, langue rose).</p></template>

<template data-pop="q21-parallele" data-title="Circulations en parallèle (transposition)">
<div class="lab">Principe</div><p>Normalement, les deux circulations sont en série : le sang passe alternativement par le poumon et par le corps. Dans la transposition, elles sont en parallèle : le sang systémique désaturé retourne à l’aorte et le sang oxygéné retourne au poumon.</p>
<div class="lab">Condition de survie</div><p>Un mélange entre les deux circuits : foramen ovale, canal artériel, CIV. Le plus efficace est le mélange auriculaire, d’où l’atrioseptostomie de Rashkind.</p>
<div class="lab">Signe clinique</div><p>Cyanose profonde qui ne cède pas à l’oxygène, sans détresse respiratoire proportionnée ; souvent aucun souffle.</p></template>

<template data-pop="q21-ductdep" data-title="Cardiopathies ducto-dépendantes">
<div class="lab">Circulation pulmonaire ducto-dépendante</div><p>Atrésie pulmonaire, sténose pulmonaire critique, atrésie tricuspide avec obstacle pulmonaire, tétralogie extrême. Fermeture du canal : cyanose brutale et profonde.</p>
<div class="lab">Circulation systémique ducto-dépendante</div><p>Hypoplasie du cœur gauche, sténose aortique critique, coarctation critique, interruption de l’arche. Fermeture du canal : choc, pouls fémoraux faibles, acidose, insuffisance rénale.</p>
<div class="lab">Mélange ducto-dépendant</div><p>Transposition simple avec foramen ovale restrictif.</p>
<div class="lab">Conduite</div><p>Alprostadil en perfusion continue dès la suspicion ; transfert vers un centre de cardiologie pédiatrique et de chirurgie cardiaque.</p></template>

<template data-pop="q21-segment" data-title="Analyse segmentaire séquentielle">
<div class="lab">Principe</div><p>Décrire le cœur en trois segments (oreillettes, ventricules, gros vaisseaux) et deux jonctions, en identifiant chaque cavité par sa morphologie et non par sa position.</p>
<div class="lab">Étapes</div><p>1. Situs atrial (solitus, inversus, isomérisme droit ou gauche). 2. Connexion atrioventriculaire (concordante, discordante, univentriculaire). 3. Connexion ventriculo-artérielle (concordante, discordante, double issue, issue unique). 4. Lésions associées.</p>
<div class="lab">Hétérotaxie</div><p>Défaut de latéralisation : l’isomérisme droit (asplénie) s’accompagne de cardiopathies cyanogènes complexes et d’un risque infectieux ; l’isomérisme gauche (polysplénie) d’une interruption de la veine cave inférieure et de blocs auriculoventriculaires.</p>
<div class="lab">Exemple</div><p>Transposition congénitalement corrigée : situs solitus, connexion atrioventriculaire discordante, connexion ventriculo-artérielle discordante.</p></template>

<template data-pop="q21-complex" data-title="Complexité des cardiopathies congénitales de l’adulte (ESC 2020)">
<div class="lab">Légère</div><p>Maladie valvulaire aortique congénitale isolée et bicuspidie ; petite CIA, CIV ou canal artériel non opérés ; CIA ostium secundum, CIV ou canal fermés sans lésion résiduelle ; sténose pulmonaire légère.</p>
<div class="lab">Modérée</div><p>Origine anormale d’une coronaire, dont l’origine pulmonaire ; canal atrioventriculaire ; coarctation ; anomalie d’Ebstein ; tétralogie de Fallot réparée ; CIV avec lésions associées ; sténose pulmonaire modérée ou sévère ; retour veineux pulmonaire anormal ; CIA de type sinus venosus ; transposition après détransposition artérielle.</p>
<div class="lab">Sévère</div><p>Toute cardiopathie avec hypertension artérielle pulmonaire (dont Eisenmenger) ; toute cardiopathie cyanogène non opérée ou palliée ; circulation de Fontan ; ventricule unique ; transposition après réparation atriale ; transposition congénitalement corrigée ; tronc artériel commun ; autres anomalies complexes de connexion.</p>
<div class="lab">Conséquence</div><p>Formes sévères : suivi exclusivement en centre ; formes modérées : suivi partagé avec évaluation régulière en centre ; formes légères : cardiologie générale possible après un premier bilan en centre.</p></template>

<template data-pop="q21-ap" data-title="Classification anatomique et physiologique (ACC/AHA)">
<div class="lab">Principe</div><p>Introduite par l’ACC/AHA en 2018 : elle combine la complexité anatomique (I simple, II modérée, III complexe) et un stade physiologique (A à D), qui décrit l’état du patient.</p>
<div class="lab">Stades physiologiques</div><p>A : NYHA I, sans séquelle hémodynamique ni arythmie. B : NYHA II, élargissement ventriculaire léger ou dysfonction légère, valvulopathie légère. C : NYHA III, dysfonction modérée, hypertension pulmonaire, arythmie contrôlée, cyanose modérée. D : NYHA IV, cyanose sévère, arythmie réfractaire, Eisenmenger, dysfonction sévère.</p>
<div class="lab">Exemple</div><p>Tétralogie réparée avec dilatation modérée du ventricule droit et épreuve d’effort abaissée : classe anatomique II, stade physiologique C. Le stade guide la fréquence du suivi et la nécessité d’un centre.</p></template>

<template data-pop="q21-cim" data-title="Codes CIM-10 Q20 à Q28">
<div class="lab">Q20</div><p>Malformations des cavités et des connexions : tronc artériel commun, ventricule droit à double issue, transposition des gros vaisseaux, ventricule à double entrée, discordance atrioventriculaire (transposition corrigée), isomérismes.</p>
<div class="lab">Q21</div><p>Malformations des cloisons : CIV, CIA, canal atrioventriculaire, tétralogie de Fallot, fenêtre aorto-pulmonaire.</p>
<div class="lab">Q22</div><p>Valves pulmonaire et tricuspide : atrésie et sténose pulmonaires, insuffisance pulmonaire congénitale, atrésie tricuspide, anomalie d’Ebstein, hypoplasie du cœur droit.</p>
<div class="lab">Q23</div><p>Valves aortique et mitrale : sténose et insuffisance aortiques congénitales (dont la bicuspidie), anomalies mitrales, hypoplasie du cœur gauche.</p>
<div class="lab">Q24</div><p>Autres malformations cardiaques : dextrocardie, cœur triatrial, sténose sous-aortique, anomalies des coronaires, bloc cardiaque congénital.</p>
<div class="lab">Q25 et Q26</div><p>Gros vaisseaux : canal artériel persistant, coarctation, atrésie et sténoses aortiques ou pulmonaires, anomalies des veines caves, retours veineux pulmonaires anormaux totaux ou partiels.</p>
<div class="lab">Q27 et Q28</div><p>Autres malformations vasculaires, notamment artérioveineuses cérébrales.</p>
<div class="lab">Remarque</div><p>Le foramen ovale perméable est inclus dans Q21.1 (communication interauriculaire, persistance du foramen ovale).</p></template>

<template data-pop="q21-mnemo-5t" data-title="Les « 5 T » des cardiopathies cyanogènes">
<p><b>T</b>étralogie de Fallot ;<br><b>T</b>ransposition des gros vaisseaux ;<br><b>T</b>ronc artériel commun ;<br>a<b>T</b>résie <b>T</b>ricuspide ;<br>re<b>T</b>our veineux pulmonaire anormal <b>T</b>otal.</p>
<div class="lab">Compléments indispensables</div><p>Atrésie pulmonaire, anomalie d’Ebstein sévère, hypoplasie du cœur gauche, ventricule unique.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. Il ne dit rien de la fréquence : la tétralogie de Fallot et la transposition sont de loin les plus fréquentes.</p></template>

<template data-pop="q21-htap" data-title="Hypertension artérielle pulmonaire associée aux cardiopathies congénitales">
<div class="lab">Définition hémodynamique (ESC/ERS 2022)</div><p>Hypertension pulmonaire : pression artérielle pulmonaire moyenne &gt; 20 mmHg au repos. Précapillaire : pression capillaire ≤ 15 mmHg et résistances vasculaires pulmonaires &gt; 2 unités Wood.</p>
<div class="lab">Quatre formes cliniques (groupe 1)</div><p>1. Syndrome d’Eisenmenger. 2. Hypertension pulmonaire avec shunt gauche-droite prédominant, opérable ou non. 3. Hypertension pulmonaire avec petit défaut, sans rapport hémodynamique avec lui (comportement proche de la forme idiopathique). 4. Hypertension pulmonaire persistante ou apparue après fermeture d’un défaut.</p>
<div class="lab">Implication</div><p>La forme 4 est de pronostic plus sombre que l’Eisenmenger : elle justifie de mesurer les résistances avant toute fermeture.</p></template>
