<template data-pop="n12-codes" data-title="Périmètre du code N12">
<div class="lab">Définition</div><p>Le bloc N10 à N16 de la CIM-10-GM 2024 regroupe les maladies rénales tubulo-interstitielles et inclut la pyélonéphrite. N12 désigne la néphrite tubulo-interstitielle non précisée comme aiguë ou chronique et inclut la néphrite interstitielle sans précision, la pyélite sans précision et la pyélonéphrite sans précision. Il n’a pas de sous-code. N10 est la forme aiguë (pyélonéphrite aiguë infectieuse comprise) ; N11.- la forme chronique (N11.0 avec reflux, N11.1 obstructive, N11.8, N11.9).</p>
<div class="lab">Application</div><p>En pratique, N12 reste le code tant que l’évolution n’est pas établie. Lorsque la chronologie, l’imagerie ou la biopsie précisent la forme, le codage passe à N10 ou N11. Si une maladie rénale chronique est présente, un code N18 est ajouté.</p>
<div class="lab">Limite</div><p>La classification utilisée en Suisse est la version française de l’Office fédéral de la statistique ; le texte lu pour ce cours est la version allemande du BfArM. Leur contenu pour N12 a été confronté au registre du dépôt.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-n10-n16.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc N10–N16 (BfArM)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-ira" data-title="Insuffisance rénale aiguë : critères et stades KDIGO 2012">
<div class="lab">Définition</div><p>L’insuffisance rénale aiguë est définie par un critère au moins : hausse de la créatinine d’au moins 26,5 µmol/L en 48 heures, ou à 1,5 fois la valeur de base en 7 jours, ou diurèse inférieure à 0,5 mL/kg/heure pendant 6 heures.</p>
<div class="lab">Stades</div><table class="t"><thead><tr><th>Stade</th><th>Créatinine</th><th>Diurèse</th></tr></thead><tbody><tr><td>1</td><td>1,5 à 1,9 fois la base, ou hausse de 26,5 µmol/L</td><td>moins de 0,5 mL/kg/heure pendant 6 à 12 heures</td></tr><tr><td>2</td><td>2,0 à 2,9 fois la base</td><td>moins de 0,5 mL/kg/heure pendant au moins 12 heures</td></tr><tr><td>3</td><td>3,0 fois la base, ou 353,6 µmol/L au moins, ou épuration extrarénale</td><td>moins de 0,3 mL/kg/heure pendant au moins 24 heures, ou anurie pendant au moins 12 heures</td></tr></tbody></table><div class="lab">Application</div><p>Le médecin retient le stade le plus sévère entre créatinine et diurèse. Après toute IRA, il réévalue à 3 mois la résolution, l’apparition ou l’aggravation d’une maladie rénale chronique. Exemple fictif : 85 → 190 µmol/L donne un rapport de 2,2, soit un stade 2.</p>
<div class="lab">Limite</div><p>La recommandation date de 2012 ; elle est admise en Suisse selon le plan du projet mais n’est pas spécifique de la NIA.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" target="_blank" rel="noopener">KDIGO 2012, insuffisance rénale aiguë</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-hypersens" data-title="Hypersensibilité retardée de la NIA">
<div class="lab">Définition</div><p>La NIA est une inflammation tubulo-interstitielle avec œdème, dont la conséquence principale est l’IRA. Sa forme médicamenteuse relève d’une hypersensibilité retardée en trois phases : reconnaissance et présentation de l’antigène par les monocytes au contact de l’épithélium tubulaire ; phase régulatrice avec activation des lymphocytes T ; phase effectrice humorale.</p>
<div class="lab">Application</div><p>Ce mécanisme explique la latence entre exposition et maladie, l’indépendance par rapport à la dose, la récidive à la réexposition et les manifestations extrarénales. L’œdème interstitiel distend la capsule rénale, d’où les douleurs lombaires.</p>
<div class="lab">Limite</div><p>Le détail moléculaire de chaque phase n’a pas été lu en texte intégral hors de la revue suisse. Praga et González (résumé seul lu) ne modifient pas ce schéma.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a> ; <a href="https://doi.org/10.1038/ki.2010.89" target="_blank" rel="noopener">Praga et González, Kidney International 2010</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-fibrose" data-title="Fibrose interstitielle et délai de traitement">
<div class="lab">Définition</div><p>L’infiltrat libère des cytokines qui stimulent la matrice extracellulaire et la prolifération des fibroblastes. Il en résulte une fibrose interstitielle et une atrophie tubulaire, détectables après 7 jours si le traitement est retardé.</p>
<div class="lab">Application</div><p>Une série espagnole de 61 patients montre que des corticoïdes débutés dans les 2 semaines après l’arrêt du médicament sont associés à une meilleure récupération, alors qu’un retard moyen de 34 jours laisse une récupération incomplète. La pratique genevoise utilise le degré de fibrose à la biopsie : supérieur à 75 %, traitement symptomatique ; inférieur ou égal à 75 %, corticoïdes.</p>
<div class="lab">Limite</div><p>Les données sont rétrospectives et non randomisées (résumé seul lu pour González 2008).</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a> ; <a href="https://doi.org/10.1038/sj.ki.5002776" target="_blank" rel="noopener">González et collaborateurs, Kidney International 2008</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-etiologies" data-title="Répartition des causes de NIA">
<div class="lab">Définition</div><p>Dans la revue suisse, la NIA est médicamenteuse et immuno-allergique dans 70 à 75 % des cas, liée à une maladie systémique dans 10 à 20 %, infectieuse dans 4 à 10 % et autre ou idiopathique dans moins de 5 %.</p>
<div class="lab">Application</div><p>Ces proportions classent les hypothèses selon leur probabilité préalable : on cherche d’abord un médicament, puis une maladie systémique, puis une infection.</p>
<div class="lab">Limite</div><p>Il s’agit de chiffres de séries biopsiées dont certaines sont américaines (Muriithi, Raghavan) ; ils décrivent la fréquence, ils ne guident pas une conduite individuelle.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-chronique" data-title="Néphrite interstitielle chronique">
<div class="lab">Définition</div><p>La néphrite interstitielle chronique est moins documentée que la NIA et probablement moins fréquente. Ses causes toxiques et génétiques sont plus spécifiques. Elle comprend des néphropathies endémiques toxiques (néphropathie des Balkans, acide aristolochique), observées notamment chez de jeunes travailleurs agricoles masculins.</p>
<div class="lab">Application</div><p>Elle reste asymptomatique jusqu’au stade terminal ; la biopsie montre une atrophie tubulaire. Elle relève du code N11, objet d’une autre leçon.</p>
<div class="lab">Limite</div><p>Seule la revue suisse a été lue ; aucune source dédiée ne figure au dossier.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-medic" data-title="Médicaments et NIA : classes et fréquences">
<div class="lab">Définition</div><p>La revue suisse cite les antibiotiques (bêtalactamines dont méticilline, ciprofloxacine, rifampicine, sulfamides, vancomycine, tétracycline, cotrimoxazole), les AINS, les IPP, les diurétiques, les inhibiteurs de points de contrôle, les antiépileptiques, ainsi que l’allopurinol, l’aciclovir, la cocaïne et la mésalazine.</p>
<div class="lab">Application</div><p>Une série de 133 biopsies (1993–2011) attribue 70 % des cas aux médicaments : antibiotiques 49 %, IPP 14 %, AINS 11 %. Une série espagnole de 61 NIA médicamenteuses donne antibiotiques 56 % et AINS 37 %. Les informations professionnelles suisses citent la néphrite tubulo-interstitielle pour le pantoprazole (fréquence inconnue) et la néphrite interstitielle comme rare pour la ciprofloxacine.</p>
<div class="lab">Limite</div><p>Ces séries ne prouvent pas la causalité chez un patient donné. L’information professionnelle indique la fréquence des effets, non leur probabilité dans une situation précise.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a> ; <a href="https://doi.org/10.1038/sj.ki.5002776" target="_blank" rel="noopener">González et collaborateurs, Kidney International 2008</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-ipci" data-title="Inhibiteurs de points de contrôle immunitaire">
<div class="lab">Définition</div><p>Ces médicaments rompent la tolérance immunitaire. La latence est de semaines à mois ; l’atteinte peut persister après l’arrêt. Jusqu’à 4,9 % des patients développent une NIA.</p>
<div class="lab">Application</div><p>Selon le consensus ADQI 34 (2026), une IRA touche jusqu’à 20 % des patients ; l’IRA liée à ces médicaments est de 2 à 5 % ; la néphrite tubulo-interstitielle est trouvée dans 80 à 90 % des biopsies. Aucun signe clinique ne distingue de façon fiable cette IRA des autres causes, la biopsie est la référence. Les corticoïdes débutés dans les 3 jours après le diagnostic sont associés à une meilleure récupération ; la récidive à la réexposition est inférieure à 20 %. Une revue 2026 décrit l’activation de lymphocytes T CD8 résidents de mémoire et une cascade de l’interféron gamma.</p>
<div class="lab">Limite</div><p>Résumés seuls lus ; panel international à majorité d’auteurs américains ; la dose et la durée optimales des corticoïdes restent incertaines.</p>
<p class="src">Références : <a href="https://doi.org/10.1681/ASN.0000001232" target="_blank" rel="noopener">Conférence de consensus ADQI 34, 2026</a> ; <a href="https://doi.org/10.25259/Cytojournal_68_2026" target="_blank" rel="noopener">Jiang et collaborateurs, 2026, pathogenèse</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-systemique" data-title="Maladies systémiques et différentiel">
<div class="lab">Définition</div><p>Les maladies systémiques représentent 10 à 20 % des NIA. Par ordre de fréquence décrit : sarcoïdose, syndrome de Sjögren, syndrome TINU, maladie à IgG4, vascularites à ANCA, lupus. Le syndrome DRESS est aussi à évoquer.</p>
<div class="lab">Application</div><p>Les maladies liées aux IgG4 ont des mimiques : infection, néoplasie, vascularite à ANCA, maladie de Castleman, syndrome de Sjögren. Le syndrome TINU rechute fréquemment (60 % dans une série monocentrique britannique de 10 patients), souvent pendant la décroissance des corticoïdes. Une NIA cortico-dépendante récidivante est reconnue.</p>
<div class="lab">Limite</div><p>Séries petites ; résumés seuls lus.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a> ; <a href="https://doi.org/10.1093/ndt/gfu326" target="_blank" rel="noopener">Praga et collaborateurs, Nephrology Dialysis Transplantation 2015</a> ; <a href="https://doi.org/10.1016/j.ekir.2026.106630" target="_blank" rel="noopener">El-Feghi et collaborateurs, 2026, maladie rénale liée aux IgG4</a> ; <a href="https://doi.org/10.1111/nep.70271" target="_blank" rel="noopener">Ali et collaborateurs, Nephrology 2026, syndrome TINU</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-infect" data-title="Infections en cause">
<div class="lab">Définition</div><p>Bactéries (Brucella, Campylobacter, Escherichia coli, Legionella, Salmonella, streptocoque, staphylocoque, Leptospira, Yersinia, diphtérie), virus (cytomégalovirus, virus d’Epstein-Barr, hantavirus, virus de l’immunodéficience humaine, polyomavirus BK chez le transplanté, rougeole, Coxsackie, hépatites A et B, grippe, virus de l’herpès simplex), spirochètes, toxoplasmose, mycoplasme et tuberculose.</p>
<div class="lab">Application</div><p>Les formes infectieuses de NIA sont presque toujours réversibles. Chez le patient infecté par le virus de l’immunodéficience humaine, la NIA représente 11 à 13 % selon les séries.</p>
<div class="lab">Limite</div><p>Liste issue d’une revue narrative ; elle ne hiérarchise pas les agents par fréquence.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-delais" data-title="Délais d’apparition selon la classe">
<div class="lab">Définition</div><p>Le délai moyen entre exposition et NIA est de 7 à 10 jours. Les antibiotiques peuvent agir dès 24 heures ; les IPP après 10 à 11 semaines ; les AINS après 6 à 18 mois ; les inhibiteurs de points de contrôle après des semaines ou des mois.</p>
<div class="lab">Application</div><p>Le délai oriente l’imputabilité : un antibiotique introduit récemment est un suspect majeur, un AINS pris depuis un an reste suspect.</p>
<div class="lab">Limite</div><p>Ce sont des moyennes de séries ; un patient donné peut s’en écarter largement.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-triade" data-title="Triade classique et formes actuelles">
<div class="lab">Définition</div><p>La triade classique associe état subfébrile, éruption et éosinophilie ; elle n’est complète que dans 10 à 20 % des cas. La fièvre est présente dans 35 à 70 % des cas, l’éruption et les arthralgies dans 25 à 40 %.</p>
<div class="lab">Application</div><p>La présentation classique (antibiotiques, éruption, fièvre, éosinophilie) a été largement remplacée par des formes pauci-symptomatiques, surtout chez la personne âgée, avec AINS et IPP. L’absence de la triade n’exclut donc pas la NIA.</p>
<div class="lab">Limite</div><p>Chiffres de séries ; l’oligurie, présente chez 51 % des patients d’une série, ne se transpose pas à tous.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a> ; <a href="https://doi.org/10.1093/ndt/gfu326" target="_blank" rel="noopener">Praga et collaborateurs, Nephrology Dialysis Transplantation 2015</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-sediment" data-title="Sédiment urinaire">
<div class="lab">Définition</div><p>Le sédiment urinaire est obligatoire. Dans la NIA : leucocyturie sans bactérie (75 à 85 %), hématurie (70 à 90 %), cylindres leucocytaires, protéinurie tubulaire le plus souvent inférieure à 1 g/24 h, fraction d’excrétion du sodium supérieure à 1 %.</p>
<div class="lab">Application</div><p>Les cylindres leucocytaires sont hautement suggestifs de NIA s’il n’y a pas de pyélonéphrite. Une protéinurie néphrotique est rare, sauf atteinte glomérulaire associée aux AINS.</p>
<div class="lab">Limite</div><p>Aucun élément n’est spécifique pris isolément ; les valeurs sont celles d’une revue narrative.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-eosinophilurie" data-title="Éosinophilurie">
<div class="lab">Définition</div><p>La recherche d’éosinophiles urinaires (coloration de Hansel) a une spécificité de 85 % et une sensibilité de 67 %.</p>
<div class="lab">Application</div><p>Sur 100 patients atteints de NIA, 67 seraient détectés et 33 manqués (calcul à partir de la sensibilité) ; sur 100 patients non atteints, 15 auraient un faux positif (calcul à partir de la spécificité). Le test est insuffisant pour confirmer ou exclure la maladie.</p>
<div class="lab">Limite</div><p>Chiffres issus de la revue suisse ; les effectifs sous-jacents n’ont pas été lus.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-biopsie" data-title="Biopsie rénale">
<div class="lab">Définition</div><p>La biopsie rénale est la référence du diagnostic. Elle montre un infiltrat interstitiel (lymphocytes T, monocytes, plasmocytes, éosinophiles), un œdème et une tubulite. Les glomérules et les vaisseaux sont le plus souvent préservés. L’immunofluorescence est le plus souvent négative.</p>
<div class="lab">Application</div><p>Neutrophiles nombreux : infection bactérienne ; éosinophiles : médicament ; granulomes : sarcoïdose, tuberculose ou certains médicaments. La biopsie est envisagée si l’état ne s’améliore pas 5 à 7 jours après l’arrêt de l’agent.</p>
<div class="lab">Limite</div><p>Les contre-indications et complications de la biopsie ne figurent pas dans le dossier et ne sont pas traitées ici.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-tubulaire" data-title="Atteinte tubulaire : chaîne causale">
<div class="lab">Définition</div><p>L’atteinte tubulaire peut précéder la hausse de la créatinine. Elle provoque une acidose métabolique hyperchlorémique, une hyperkaliémie, un défaut de concentration et, dans l’atteinte proximale, un syndrome de Fanconi (glycosurie, phosphaturie, uricosurie, amino-acidurie).</p>
<div class="lab">Application</div><p>Ces anomalies expliquent pourquoi un bilan électrolytique peut précéder la créatinine. Elles rendent compte aussi d’une fraction d’excrétion du sodium supérieure à 1 %.</p>
<div class="lab">Limite</div><p>Le mécanisme détaillé de chaque anomalie n’est pas décrit dans les sources lues.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
