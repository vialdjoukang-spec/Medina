<template id="ch-G03"><div class="chap"><div class="chap-head"><div class="code">G03 · N-05-Neurologie</div><h1>G03 — Méningite due à des causes autres et non précisées</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G03"><section class="ilot" id="g03-intro"><h2>Un syndrome méningé impose d’abord une décision clinique</h2><p>Une céphalée inhabituelle accompagnée de fièvre, de photophobie ou de raideur de nuque peut annoncer une méningite. La première décision porte sur la gravité et sur la possibilité d’une ponction lombaire rapide. Le diagnostic causal vient ensuite : une infection bactérienne reste possible tant que le bilan et l’évolution ne permettent pas de l’écarter. Un liquide clair ou une culture négative après antibiotiques ne suffisent pas à rassurer.</p><p>Cette leçon étudie les méningites dues à d’autres causes ou non encore précisées, notamment les formes non purulentes, chroniques, récurrentes et médicamenteuses. Elle apprend à passer du syndrome à une cause probable, puis à réviser le diagnostic. Le code G03 décrit une catégorie administrative ; il ne regroupe pas automatiquement toutes les méningites virales, toutes les inflammations non infectieuses ou toutes les atteintes encéphaliques.</p><div class="key"><b>À retenir.</b> Reconnaître le syndrome, rechercher l’urgence, prélever sans retard dangereux, traiter une cause grave probable puis réévaluer l’étiquette diagnostique.</div><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r13">[R13]</button> · <button class="w" data-k="g03-r18">[R18]</button></p></section><section class="ilot" id="g03-definitions"><h2>Définir l’inflammation, sa durée et son territoire</h2><p>Une méningite est une inflammation des enveloppes du système nerveux central, généralement des leptoméninges et du compartiment contenant le liquide céphalorachidien. Le syndrome méningé décrit des symptômes et des signes d’irritation ; il ne démontre pas à lui seul une inflammation du liquide ni sa cause. Un méningisme peut reproduire certains signes sans méningite démontrée. Une atteinte de la conscience, du comportement ou une focalisation fait rechercher une atteinte encéphalique ou une complication.</p><p><button class="w" data-k="g03-aseptique">« Aseptique » : préciser ce que le mot signifie</button></p><table class="t"><thead><tr><th>Temporalité</th><th>Description utile</th><th>Conséquence</th></tr></thead><tbody><tr><td>Aiguë</td><td>Installation en heures ou quelques jours.</td><td>Écarter en priorité une infection bactérienne ou une autre urgence.</td></tr><tr><td>Chronique</td><td>Inflammation persistante au-delà de quatre semaines dans la revue suisse.</td><td>Bilan séquentiel infectieux, inflammatoire et tumoral ; ne pas attendre ce délai pour explorer un patient qui s’aggrave.</td></tr><tr><td>Récurrente</td><td>Épisodes distincts séparés par des intervalles de récupération.</td><td>Rechercher une cause documentable à chaque nouvel épisode ; Mollaret est une possibilité, pas une dispense de bilan.</td></tr></tbody></table><p>La durée et le territoire sont deux axes distincts. Une pachyméningite concerne surtout la dure-mère ; une leptoméningite concerne arachnoïde et pie-mère. Un rehaussement à l’IRM décrit une anomalie anatomique et ne détermine pas à lui seul le mécanisme infectieux, tumoral ou inflammatoire.</p><div class="key"><b>À retenir.</b> Distinguer syndrome, inflammation objectivée, temporalité et étiologie ; aucun de ces niveaux ne remplace les autres.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r13">[R13]</button> · <button class="w" data-k="g03-r14">[R14]</button> · <button class="w" data-k="g03-r16">[R16]</button></p></section><section class="ilot" id="g03-epidemio"><h2>Épidémiologie : attribuer chaque chiffre à sa population</h2><p>Les méningites chroniques sont rares et leur incidence exacte reste indéterminée dans la revue suisse de 2021. Les lectures réalisées ne fournissent pas d’incidence nationale actuelle propre à l’ensemble G03. Les séries de méningites virales, de récidives HSV-2 ou de pharmacovigilance décrivent des populations différentes ; leurs fréquences ne doivent pas être additionnées.</p><table class="t"><thead><tr><th>Donnée lue</th><th>Population et mesure</th><th>Limite</th></tr></thead><tbody><tr><td>1,2 cas/million d’adultes/an</td><td>Méningite lymphocytaire récurrente associée à HSV-2, cohorte nationale danoise 2015–2020.</td><td>Estimation fondée sur 28 cas incidents hospitalisés ; pas incidence suisse ni de tout G03.</td></tr><tr><td>22 % ; IC95 % 15–30 %</td><td>Risque estimé de progression vers une forme récurrente après méningite HSV-2 dans cette cohorte.</td><td>Critères d’étude et suivi propres au dispositif danois.</td></tr><tr><td>329 notifications ; 203 dossiers détaillés</td><td>Pharmacovigilance française, 1985–2017.</td><td>Ni dénominateur de personnes exposées ni incidence ; sous-notification et biais de déclaration.</td></tr></tbody></table><p>Dans une consultation suisse, la probabilité dépend davantage du terrain, des médicaments, des voyages, de l’immunité et du contexte épidémique que d’un pourcentage général non applicable. Une donnée étrangère reste utile lorsqu’elle est nommée et que son incertitude est conservée.</p><div class="key"><b>À retenir.</b> Un taux danois de récidives et une proportion de notifications françaises ne deviennent pas une incidence suisse.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></section><section class="ilot" id="g03-causes"><h2>Organiser les causes par mécanisme et par contexte</h2><p>Les méningites à liquide clair ou lymphocytaire peuvent être infectieuses. Les virus sont fréquents dans les syndromes aigus, mais une tuberculose, une cryptococcose, une neuroborréliose ou une syphilis peuvent produire une évolution plus lente. Une infection bactérienne prétraitée reste un diagnostic important. Les causes non infectieuses comprennent les médicaments, les maladies inflammatoires systémiques et l’infiltration tumorale des méninges.</p><table class="t"><thead><tr><th>Contexte</th><th>Hypothèses orientées</th><th>Information à rechercher</th></tr></thead><tbody><tr><td>Immunodépression, exposition tuberculeuse ou séjour en zone d’endémie</td><td>Tuberculose, cryptococcose et autres agents adaptés au terrain.</td><td>Type d’immunosuppression, VIH, traitement et expositions ; examens microbiologiques ciblés.</td></tr><tr><td>Douleurs radiculaires, paralysie faciale et exposition aux tiques</td><td>Neuroborréliose parmi les possibilités.</td><td>Syndrome compatible et analyse conjointe sang/LCR ; une sérologie sanguine positive isolée ne suffit pas.</td></tr><tr><td>Aphtose, uvéite, atteinte pulmonaire, cutanée ou articulaire</td><td>Behçet, sarcoïdose, lupus et autres inflammations systémiques.</td><td>Examen général et éventuel site de prélèvement extraneural.</td></tr><tr><td>Cancer ou hémopathie, atteinte de plusieurs nerfs crâniens ou racines</td><td>Infiltration leptoméningée.</td><td>Imagerie et cytologie/cytométrie choisies selon l’hypothèse.</td></tr><tr><td>Nouvelle prise ou perfusion de médicament</td><td>Méningite médicamenteuse possible.</td><td>Chronologie complète ; rechercher aussi les causes qui ont motivé le médicament.</td></tr></tbody></table><p>L’examen doit préserver les hypothèses concurrentes. Par exemple, un AINS pris pour une céphalée débutante peut sembler précéder une méningite alors qu’il répondait déjà à ses premiers symptômes : c’est un biais protopathique. Une relation temporelle mérite une investigation et ne prouve pas une causalité.</p><div class="key"><b>À retenir.</b> Le terrain sélectionne les recherches ; il n’autorise pas à exclure les autres causes graves.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r11">[R11]</button> · <button class="w" data-k="g03-r12">[R12]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-anamnese"><h2>Analyser l’histoire de la plainte</h2><p>Décrire le début, la vitesse d’installation, l’intensité et le caractère inhabituel de la céphalée. Rechercher vomissements, lumière ou bruit pénibles, fièvre ressentie ou mesurée et douleur à la mobilisation du cou. Préciser l’état fonctionnel entre les épisodes : récupération complète, symptômes résiduels ou dégradation continue. Une céphalée explosive fait aussi rechercher une hémorragie sous-arachnoïdienne ; une évolution lente avec troubles cognitifs ou marche instable peut révéler une forme chronique sans triade classique.</p><p>Interroger directement le patient et, si la vigilance ou la mémoire le justifie, son entourage. Noter les antibiotiques déjà reçus et leur heure, les voyages, contacts infectieux, exposition aux tiques ou animaux, pratiques sexuelles pertinentes, immunosuppression, cancer et manifestations systémiques. Les informations sensibles sont recueillies avec discrétion et selon leur utilité clinique.</p><p><button class="w" data-k="g03-medic">Reconstituer une chronologie médicamenteuse exploitable</button></p><div class="key"><b>À retenir.</b> La chronologie distingue persistance, récidive et effet médicamenteux possible ; elle doit rester vérifiable et être réévaluée.</div><p>Sources : <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-examen"><h2>Examiner le syndrome et rechercher ce qui le dépasse</h2><p>Évaluer d’abord respiration, circulation, température, perfusion et vigilance. Quantifier l’état de conscience avec l’échelle de Glasgow lorsqu’elle est applicable ; observer langage, attention, comportement et capacité à suivre les consignes. Rechercher déficit moteur ou sensitif, asymétrie, atteinte des nerfs crâniens et crises. Un déficit focal n’appartient pas au tableau attendu d’une simple méningite virale ; il modifie le bilan et l’urgence.</p><p><button class="w" data-k="g03-meningisme">Raideur, Kernig et Brudzinski : technique et limite</button></p><p>Examiner la peau, les muqueuses et les sites d’infection possibles ; un purpura rapidement extensif ou un état de choc impose une prise en charge urgente. Dans les formes chroniques, rechercher signes oculaires, pulmonaires, articulaires et cutanés. Une plainte visuelle justifie un examen ophtalmologique adapté. Le fond d’œil peut contribuer au bilan, mais l’absence d’œdème papillaire ne suffit pas à garantir la sécurité d’une PL.</p><div class="key"><b>À retenir.</b> Une sémiologie méningée négative ne clôt pas le raisonnement ; une focalisation ou une altération de vigilance augmente l’urgence.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></section><section class="ilot" id="g03-urgent"><h2>Décider immédiatement : ponction rapide ou report motivé</h2><p>Toute suspicion de méningite aiguë nécessite une évaluation hospitalière urgente. Prélever les hémocultures et les examens sanguins utiles, puis réaliser rapidement la PL lorsqu’elle est sûre. Une imagerie préalable systématique peut retarder les soins sans bénéfice démontré. En présence d’un risque de lésion expansive ou d’engagement, l’imagerie précède la PL ; elle ne doit jamais faire attendre le traitement d’une infection bactérienne probable.</p><p><button class="w" data-k="g03-ct">OMS 2025 : quand imager avant la PL ?</button></p><table class="t"><thead><tr><th>Situation</th><th>Action initiale</th></tr></thead><tbody><tr><td>PL immédiatement réalisable et sûre</td><td>Examen clinique, hémocultures et prélèvements ; PL rapide, puis traitement indiqué sans délai évitable.</td></tr><tr><td>PL différée pour imagerie ou autre risque</td><td>Hémocultures si obtenues sans retard, traitement empirique indiqué et stabilisation avant le scanner ; PL dès qu’elle devient sûre.</td></tr><tr><td>Purpura extensif, choc ou détresse neurologique</td><td>Réanimation et traitement urgents ; la séquence des examens s’adapte à la stabilité.</td></tr></tbody></table><p>Un scanner rassurant n’annule pas une instabilité ou une anomalie de coagulation et ne remplace pas la réévaluation clinique. Le motif du report et l’heure des traitements doivent être documentés.</p><div class="key"><b>À retenir.</b> Ne pas choisir entre diagnostic et soin : prélever vite lorsque possible, traiter sans attendre si la PL est différée.</div><p>Sources : <button class="w" data-k="g03-r1">[R1]</button> · <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></section><section class="ilot" id="g03-positive"><h2>Établir le diagnostic puis en mesurer la solidité</h2><p>Le diagnostic associe un syndrome compatible et une inflammation du LCR, puis la recherche d’une étiologie. Les leucocytes, leur formule, le glucose associé au sérum, les protéines et le lactate orientent ; aucun profil ne sépare parfaitement les causes. Une inflammation débutante, une immunodépression ou un prétraitement peuvent modifier la présentation attendue.</p><p>Une culture, une PCR ou un autre test positif n’a de sens qu’avec le syndrome, le prélèvement et les limites de la méthode. Inversement, une PCR multiplex négative ne recherche pas tous les agents et ne remplace pas les cultures. Si la probabilité clinique reste élevée, discuter la répétition ou l’élargissement du bilan avec le laboratoire et les spécialistes.</p><table class="t"><thead><tr><th>Étiquette envisagée</th><th>Éléments qui la soutiennent</th><th>Ce qui ne suffit pas</th></tr></thead><tbody><tr><td>Chronique</td><td>Symptômes et inflammation persistants au-delà de quatre semaines.</td><td>Une céphalée prolongée sans preuve d’inflammation.</td></tr><tr><td>Mollaret / forme récurrente lymphocytaire</td><td>Épisodes séparés par récupération, LCR inflammatoire et documentation étiologique adaptée.</td><td>Un ancien diagnostic rapporté ou des cellules de Mollaret seules.</td></tr><tr><td>Médicamenteuse</td><td>Exclusion raisonnée des autres causes, chronologie et évolution après retrait compatibles.</td><td>Culture stérile, association temporelle isolée ou terrain lupique seul.</td></tr><tr><td>Inflammatoire systémique</td><td>Syndrome compatible, arguments systémiques et investigations ciblées, parfois tissu.</td><td>Un autoanticorps isolé ou une amélioration sous corticoïde.</td></tr></tbody></table><p>Les définitions de recherche ne sont pas des critères universels. La cohorte danoise exigeait au moins deux épisodes et un lien documenté avec HSV-2 ; d’autres études utilisent une définition différente. L’absence de critères internationaux uniques doit être dite, sans empêcher une démarche clinique structurée.</p><div class="key"><b>À retenir.</b> Exprimer le degré de certitude : syndrome établi, cause probable, cause documentée ou cause encore indéterminée.</div><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r8">[R8]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></section>
