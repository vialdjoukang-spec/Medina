<template data-pop="g03-codage" data-title="Classification G03 : ce qui entre et ce qui sort"><h3>Ce que la rubrique contient</h3><p>La CIM-10-GM 2024 du BfArM définit G03 comme les méningites dues à d’autres causes ou à une cause non précisée : arachnoïdite, leptoméningite, méningite et pachyméningite. Elle exclut la méningo-encéphalite et la méningomyélite, qui relèvent de G04. Les libellés français sont repris du registre de l’Office fédéral de la statistique, non du texte allemand.</p><table class="t"><tr><th>Sous-code</th><th>Intitulé</th></tr><tr><td>G03.0</td><td>Méningite à liquide clair (inclut la méningite abactérienne)</td></tr><tr><td>G03.1</td><td>Méningite chronique</td></tr><tr><td>G03.2</td><td>Méningite récurrente bénigne [Mollaret]</td></tr><tr><td>G03.8</td><td>Méningite due à d’autres causes précisées</td></tr><tr><td>G03.9</td><td>Méningite, sans précision (inclut l’arachnoïdite spinale sans précision)</td></tr></table><p>Le tableau présente la rubrique telle que les sources la libellent. Les cas sans agent identifié se rangent en G03.0 ou G03.9. La cartographie vers la CIM-11 n’est pas établie dans ce cours.</p><div class="trap"><span class="k">Piège</span> Considérer que la méningite médicamenteuse se code en G03.8 : ce rattachement n’a pas été vérifié dans l’index alphabétique de la CIM-10-GM. Le codeur tranche.</div></template>
<template data-pop="g03-menin-virale" data-title="Méningite virale aiguë : symptômes et limites du méningisme"><h3>Le tableau clinique</h3><p>La recommandation allemande de 2025 décrit des céphalées, des nausées, parfois des vomissements, une raideur de nuque, une photophobie et une phonophobie. Il n’y a ni signe focal ni trouble de conscience. Le liquide contient moins de 1000 cellules par µl, avec des protéines et un lactate normaux ou peu élevés. La maladie régresse spontanément en quelques jours à quelques semaines.</p><h3>Pourquoi le méningisme ne suffit pas</h3><p>Dans la cohorte danoise, la céphalée existe dans 95 % des épisodes, la fièvre dans 71 %, la photophobie ou phonophobie dans 67 % et la raideur de nuque dans 36 % seulement. La triade complète est présente dans 28 % des cas, et la triade est incomplète dans 72 % des méningites virales. La conséquence est directe : l’absence de raideur de nuque ne rassure pas, et l’examen clinique seul ne suffit pas à trancher entre les causes.</p><div class="trap"><span class="k">Erreur fréquente</span> Exiger la triade complète pour envisager une méningite. Elle manque dans près de trois cas sur quatre.</div></template>
<template data-pop="g03-encephalite" data-title="Méningo-encéphalite : la frontière avec G04"><h3>Définition</h3><p>La méningo-encéphalite associe à l’atteinte méningée des troubles quantitatifs ou qualitatifs de la conscience, souvent des signes focaux (parésie, aphasie, crises). Le méningisme peut manquer. La CIM-10-GM l’exclut de G03 et la classe en G04.</p><h3>Pourquoi cette frontière change la conduite</h3><p>L’encéphalite herpétique suspectée impose l’aciclovir par voie intraveineuse immédiat, même sans ponction lorsque celle-ci est contre-indiquée. L’IRM est l’examen de choix du syndrome encéphalitique, alors que le scanner n’est qu’un dépistage. Chez le nouveau-né, HSV-2 provoque une encéphalite hémorragique nécrosante diffuse, qui n’a rien de la méningite bénigne de l’adulte.</p><div class="key"><b>À retenir.</b> Conscience, signes focaux, crises : sortie de G03, traitement empirique.</div></template>
<template data-pop="g03-plio" data-title="Ponction lombaire et pléiocytose"><h3>Ce que l’on mesure</h3><p>La pléiocytose est le nombre de cellules par µl dans le liquide céphalo-rachidien. La recommandation allemande de 2023 impose quatre paramètres obligatoires lors de la ponction : cellularité avec formule, protéines, lactate ou rapport glucose du liquide sur glucose du sang (sang prélevé en même temps).</p><h3>Quels seuils</h3><p>Plus de 1000 cellules par µl, granulocytaires : profil bactérien. Moins de 1000, lymphocytaires : profil viral. Moins de 1000, mixtes : profil tuberculeux. Pendant les 4 à 48 premières heures d’une méningite virale, la pléiocytose peut être mixte, de 25 à 1000 cellules par µl, avant de devenir lymphocytaire.</p><h3>Quand ne pas ponctionner d’emblée</h3><p>En cas de trouble de conscience sévère, de crise, de déficit focal ou d’immunosuppression connue, l’imagerie précède la ponction, et les antibiotiques précèdent l’imagerie.</p><div class="trap"><span class="k">Piège</span> Un tiers des méningites pneumococciques ont moins de 1000 cellules par µl. La cellularité basse s’observe aussi très tôt, sous antibiotique, en évolution fulminante ou en cas de leucopénie.</div></template>
<template data-pop="g03-lactate" data-title="Lactate du liquide céphalo-rachidien"><h3>Seuil et signification</h3><p>Un lactate du liquide supérieur à 3,5 mmol/l caractérise les méningites bactérienne et tuberculeuse ; il reste inférieur à 3,5 mmol/l dans la méningite virale. La recommandation allemande de 2023 le juge plus sensible que la cellularité pour séparer bactérien et viral en l’absence d’antibiothérapie préalable. Un seuil de 3,45 mmol/l a été rapporté avec une sensibilité de 90 % et une spécificité de 85 %.</p><h3>Pourquoi on le mesure</h3><p>Il remplace ou complète le rapport glucose : la recommandation demande au moins l’un des deux.</p><div class="trap"><span class="k">Piège</span> Interpréter le lactate après une antibiothérapie : la supériorité du lactate est décrite en l’absence d’antibiothérapie préalable.</div></template>
<template data-pop="g03-index-glucose" data-title="Rapport glucose liquide/sérum"><h3>Définition et seuils</h3><p>Le rapport divise le glucose du liquide céphalo-rachidien par le glucose sanguin prélevé en même temps. Il est normal dans le profil viral, abaissé dans le tuberculeux, très abaissé dans le bactérien. Un glucose du liquide inférieur à 30 mg/dl ou un rapport inférieur à 0,3 appartient au profil bactérien.</p><h3>Condition de prélèvement</h3><p>La recommandation exige un prélèvement sanguin fait en même temps que la ponction.</p><div class="trap"><span class="k">Piège</span> Chez le diabétique, un rapport abaissé jusqu’à 0,3 est possible sans méningite.</div></template>
<template data-pop="g03-proteines" data-title="Protéines du liquide et barrière"><h3>Seuils</h3><p>Les protéines sont inférieures à 100 mg/dl dans le profil viral, supérieures à 100 mg/dl dans les profils bactérien et tuberculeux ; la barrière hémato-méningée est normale à peu altérée dans le premier cas et sévèrement altérée dans les deux autres. Une valeur supérieure à 1000 mg/l désigne la dysfonction sévère de la barrière.</p><h3>Pourquoi les protéines renseignent sur la barrière</h3><p>Les protéines viennent du sang. Plus elles sont nombreuses dans le liquide, plus la barrière laisse passer.</p><div class="trap"><span class="k">Piège</span> Dans la méningite aseptique sous immunoglobulines intraveineuses, les protéines peuvent atteindre plusieurs centaines de mg/dl : un taux élevé ne prouve pas l’origine bactérienne.</div></template>
<template data-pop="g03-barriere" data-title="Barrière hémato-méningée"><h3>État normal</h3><p>La barrière limite le passage des cellules et des protéines du sang vers le liquide céphalo-rachidien. Pour un antibiotique, elle limite aussi l’accès : la ceftriaxone atteint environ 2 % de sa concentration plasmatique dans le liquide sans inflammation.</p><h3>Quand l’inflammation l’ouvre</h3><p>Avec des méninges enflammées, la ceftriaxone atteint jusqu’à 25 % de sa concentration plasmatique. Le profil bactérien traduit une altération sévère de la barrière, le profil viral une altération nulle ou légère.</p><div class="key"><b>À retenir.</b> Cellules, protéines et médicaments suivent la même perméabilité.</div></template>
<template data-pop="g03-pct" data-title="Procalcitonine sérique"><h3>Ce que recommande la recommandation allemande de 2023</h3><p>La procalcitonine sérique est presque toujours élevée dans la méningite bactérienne et plus sensible que la protéine C réactive en phase précoce. Elle est recommandée. La procalcitonine du liquide ne l’est pas ; le lactate du liquide, avec un seuil de 3,45 mmol/l (sensibilité 90 %, spécificité 85 %), est préféré.</p><div class="trap"><span class="k">Erreur fréquente</span> Exclure une méningite bactérienne sur une procalcitonine négative seule : la recommandation l’interdit.</div></template>
<template data-pop="g03-hsv2" data-title="HSV-2 : virus de l’herpès simplex de type 2"><h3>Place dans les méningites</h3><p>HSV-2 représente 16 % des agents identifiés dans la cohorte danoise de méningites virales. Il est lié à la méningite récurrente de Mollaret : jusqu’à 85 % des cas selon les revues, 10 cas sur 13 dans une série, et environ 20 % des méningites à HSV-2 récidivent. Chez le nouveau-né, il provoque une encéphalite hémorragique nécrosante diffuse.</p><h3>Quel traitement</h3><p>L’épisode guérit spontanément ; l’aciclovir est utilisé sans donnée contrôlée. Un essai contrôlé n’a pas montré de bénéfice du valaciclovir d’un an en prévention.</p></template>
<template data-pop="g03-entero" data-title="Entérovirus : premier agent des méningites virales"><h3>Ce que disent les sources</h3><p>Les entérovirus (Coxsackie A et B, échovirus) sont les agents les plus fréquents des méningites virales ; ils représentent 39 % des agents identifiés dans la cohorte danoise. Leur circulation et leurs variations saisonnières ne sont pas chiffrées dans le dossier de recherche.</p><div class="key"><b>À retenir.</b> Premier agent par la fréquence, mais 27 % des épisodes restent sans agent identifié.</div></template>
<template data-pop="g03-pcr" data-title="PCR sur liquide non centrifugé"><h3>Modalités</h3><p>La recommandation allemande de 2025 prescrit la PCR ou la PCR multiplex sur liquide non centrifugé. Les cibles listées sont les herpèsvirus (HSV, VZV, cytomégalovirus, virus d’Epstein-Barr), le virus JC, les flavivirus et les entérovirus.</p><h3>Condition de transport</h3><p>Le liquide voyage à température ambiante, à l’abri de la lumière, et arrive en 2 heures au plus.</p><div class="trap"><span class="k">Erreur fréquente</span> Centrifuger l’échantillon avant la PCR.</div></template>
<template data-pop="g03-index-ac" data-title="Index d’anticorps"><h3>Définition et seuil</h3><p>Un index d’anticorps supérieur à 1,5 traduit une synthèse intrathécale d’anticorps. La recommandation allemande de 2025 le juge surtout utile après plus de 10 jours d’évolution. Les IgM spécifiques complètent le bilan.</p><div class="trap"><span class="k">Piège</span> Utiliser l’index en début d’évolution : la recommandation le situe après 10 jours.</div></template>
<template data-pop="g03-ngs" data-title="Séquençage de nouvelle génération du liquide"><h3>Place</h3><p>La recommandation allemande de 2025 réserve le séquençage de nouvelle génération aux cas dont l’étiologie reste inexpliquée après le bilan standard. Dans la méningite de Mollaret, la PCR ou le séquençage peuvent détecter HSV-2.</p><div class="trap"><span class="k">Erreur fréquente</span> Le demander d’emblée : il s’agit d’un examen de deuxième intention.</div></template>
<template data-pop="g03-ct" data-title="Imagerie avant la ponction lombaire"><h3>Les quatre indications</h3><p>La tomodensitométrie précède la ponction seulement en cas de trouble de conscience sévère, de crise épileptique, de déficit focal ou d’immunosuppression connue (critères ESCMID 2016 rapportés par la recommandation allemande de 2023). Les antibiotiques précèdent alors l’imagerie. L’IRM est l’examen de choix du syndrome encéphalitique.</p><div class="trap"><span class="k">Piège</span> Réaliser le scanner à tous les patients : la recommandation le réserve à ces quatre situations.</div></template>
<template data-pop="g03-mollaret" data-title="Méningite de Mollaret"><h3>Définition et histoire</h3><p>C’est une méningite aseptique récidivante, habituellement bénigne et douloureuse, décrite par Mollaret en 1944 et ensuite liée étroitement à la réactivation d’HSV-2, qui n’en est pas la seule cause. Certains auteurs réservent le terme aux formes idiopathiques.</p><h3>Clinique et liquide</h3><p>Presque tous les patients ont une céphalée ; plus de la moitié ont photophobie, phonophobie ou fièvre. Le début est brutal, l’épisode dure quelques jours, les intervalles libres vont de semaines à années. Le liquide montre une pléiocytose lymphocytaire, des protéines normales ou peu élevées, un glucose normal et des cultures négatives.</p><h3>Épidémiologie et limite</h3><p>Plus de 80 % des patients sont des femmes. Aucun critère diagnostique formel de Mollaret n’a été lu pour ce cours.</p><div class="trap"><span class="k">Piège</span> Poser le diagnostic sur la seule présence de cellules de Mollaret : elles sont non spécifiques.</div></template>
<template data-pop="g03-cell-mollaret" data-title="Cellules de Mollaret et cytologie du liquide"><h3>Ce qu’elles sont</h3><p>Les cellules de Mollaret sont de grandes cellules d’origine monocytaire. Elles sont observées surtout dans les 24 premières heures de l’épisode, puis dégénèrent (« cellules fantômes »). Elles sont non spécifiques.</p><h3>Conséquence</h3><p>Une cytologie du liquide peut les montrer, mais n’est pas un examen systématique et ne suffit pas à poser le diagnostic.</p></template>
<template data-pop="g03-chronique" data-title="Méningite chronique"><h3>Définition</h3><p>La méningite chronique est une inflammation méningée d’installation subaiguë dont les anomalies du liquide (pléiocytose, hyperprotéinorachie) persistent au moins un mois.</p><h3>Causes et démarche</h3><p>Les causes sont infectieuses (germes classiques et opportunistes) ou non infectieuses (carcinomateuse, maladie systémique, toxique, sarcoïdose, vascularite). La cause reste inconnue chez environ un tiers des patients ; la forme idiopathique a une évolution relativement bonne. Il n’existe pas de démarche standardisée : anamnèse approfondie et examen complet sont obligatoires, avec des algorithmes distincts chez l’immunocompétent et l’immunodéprimé.</p><div class="trap"><span class="k">Lacune</span> Les textes intégraux n’ont pas été lus (accès payant) : volumes de liquide, ponctions répétées et biopsie méningée ne sont pas détaillés.</div></template>
<template data-pop="g03-medic" data-title="Méningite aseptique médicamenteuse : mécanismes et imputabilité"><h3>Deux mécanismes</h3><p>La revue de Yelehe-Okouma (2018) distingue l’irritation méningée directe après administration intrathécale et la réaction d’hypersensibilité immunologique après administration systémique. L’inflammation méningée est stérile.</p><h3>Critères d’imputabilité</h3><p>Apparition rapide après l’introduction du médicament, régression rapide à l’arrêt, récidive à la réexposition, exclusion des causes infectieuses. Le glucose du liquide est normal.</p><h3>Terrains</h3><p>Le lupus érythémateux prédispose à la méningite aux anti-inflammatoires non stéroïdiens ; la migraine prédispose à la méningite sous immunoglobulines intraveineuses.</p><h3>Chiffres de la série de Singh (108 patients)</h3><p>Âge moyen 47 ans, 55 % de femmes ; céphalée 78 %, fièvre 65 %, raideur de nuque 56 %, atteinte neurologique sévère 17 % ; pléiocytose 65 %, protéines élevées 60 % ; résolution dans tous les cas publiés après l’arrêt, corticoïdes dans les formes sévères.</p></template>
<template data-pop="g03-sources-guides" data-title="Sources de référence et leurs limites"><h3>Qui parle</h3><p>La DGN, société allemande de neurologie, publie avec l’AWMF les recommandations 030/100 (méningo-encéphalite virale, version 7.0, révision du 09.01.2025) et 030/089 (méningo-encéphalite bactérienne de l’adulte, version 6.0, révision du 28.04.2023). Ce sont des recommandations allemandes, non suisses ; la première est de niveau S1 (consensus d’experts). L’ESCMID est la société européenne de microbiologie clinique et de maladies infectieuses ; son guide de 2016 n’a été lu que tel que rapporté par la recommandation de 2023.</p><h3>Ce qui manque</h3><p>Aucune source suisse spécifique (Swiss Medical Forum, société suisse de neurologie, OFSP) sur la méningite aseptique ou chronique n’a été lue ; l’épidémiologie suisse est absente. Les informations professionnelles suisses lues sont celles de l’aciclovir, du valaciclovir, de l’ibuprofène, de Privigen® et de la ceftriaxone.</p><div class="trap"><span class="k">Rappel</span> Revue par intelligence artificielle, audit différé : ce n’est pas une validation médicale humaine.</div></template>
<template data-pop="g03-mnemo-profils" data-title="Aide pédagogique : trois profils du liquide"><h3>« B haut, V bas, T mélangé »</h3><p>B pour bactérien : cellules, lactate et protéines hauts, glucose bas. V pour viral : cellules, lactate et protéines bas, glucose normal. T pour tuberculeux : cellules moins de 1000 à formule mixte, lactate et protéines hauts comme le B, glucose abaissé.</p><p><i>Aide pédagogique, non critère officiel.</i> Les seuils exacts sont ceux de la recommandation allemande de 2023.</p></template>
<template data-pop="g03-lacunes" data-title="Ce que ce cours ne peut pas affirmer"><h3>Lacunes de sources</h3><p>Aucune source suisse spécifique ni épidémiologie suisse ; texte intégral ESCMID 2016 et revues sur la méningite chronique non lus (résumés seuls) ; critères diagnostiques formels de Mollaret non lus ; guide pédiatrique non lu ; rattachement des formes médicamenteuses à G03.8 non vérifié ; aucune information professionnelle suisse lue pour l’ampicilline, la dexaméthasone et la vancomycine.</p><div class="trap"><span class="k">Rappel</span> Une lacune nommée vaut mieux qu’un critère inventé.</div></template>
