<template data-pop="g03-aseptique" data-k="g03-aseptique"><h3>« Aseptique » : préciser ce que le mot signifie</h3><p>Dans l’usage syndromique, une méningite aseptique désigne souvent une inflammation méningée sans bactérie identifiée par les méthodes usuelles ; une cause virale reste possible. Dans la série française de méningites médicamenteuses, la définition de recherche excluait aussi les microorganismes viraux détectés. Ces usages ne sont donc pas interchangeables.</p><p>Une culture stérile peut résulter d’antibiotiques déjà administrés, d’un agent exigeant ou d’une technique insuffisante. Le mot ne constitue ni une preuve d’innocuité ni une indication à arrêter immédiatement toute couverture empirique.</p><p>Sources : <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></template>
<template data-pop="g03-medic" data-k="g03-medic"><h3>Reconstituer une chronologie médicamenteuse exploitable</h3><p>Lister prescriptions, automédication, produits injectés et perfusions récentes, changements de dose, médicaments intermittents et traitements intrathécaux. Pour chaque produit suspect, relever début, dernière administration, délai avant les symptômes, évolution après arrêt et épisodes antérieurs involontaires de réexposition.</p><p>La temporalité d’une méningite médicamenteuse est variable. Pour Privigen, la FI situe habituellement le début dans les heures à deux jours suivant l’administration. Cet intervalle est spécifique à ce signal et ne devient pas une fenêtre obligatoire pour tous les médicaments. Une réexposition volontaire pour « confirmer » n’est pas proposée.</p><p>Sources : <button class="w" data-k="g03-r9">[R9]</button> · <button class="w" data-k="g03-r11">[R11]</button> · <button class="w" data-k="g03-r12">[R12]</button></p></template>
<template data-pop="g03-meningisme" data-k="g03-meningisme"><h3>Raideur, Kernig et Brudzinski : technique et limite</h3><p>Chez un patient coopérant et sans contre-indication à la mobilisation, la flexion douce de la nuque recherche une résistance douloureuse compatible avec une irritation méningée. Le signe de Brudzinski correspond à une flexion involontaire des membres inférieurs lors de la flexion cervicale. Le signe de Kernig recherche une résistance douloureuse à l’extension du genou avec la hanche fléchie.</p><p>Ces manœuvres ne doivent pas être forcées et ne remplacent pas la recherche de gravité. Une douleur mécanique, une limitation articulaire ou une coopération insuffisante peuvent gêner l’examen. Leur absence n’exclut pas une méningite et leur présence ne distingue pas bactérie, virus ou autre inflammation.</p><p>Sources : <button class="w" data-k="g03-r2">[R2]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r14">[R14]</button></p></template>
<template data-pop="g03-ct" data-k="g03-ct"><h3>OMS 2025 : quand imager avant la PL ?</h3><p>L’OMS recommande une imagerie avant la PL en cas de Glasgow <10, signe neurologique focal, atteinte d’un nerf crânien, œdème papillaire, crise d’apparition récente chez l’adulte ou immunodépression sévère. La PL est différée si l’imagerie nécessaire n’est pas disponible. Les recommandations sont fortes malgré une certitude très faible pour plusieurs critères.</p><p>Des troubles hémorragiques, une infection au site de ponction ou une instabilité nécessitant stabilisation peuvent également conduire à reporter la PL. Les seuils biologiques et délais liés aux anticoagulants dépendent du contexte et du protocole spécialisé : aucune valeur unique n’est inventée ici.</p><p>Exception importante : devant une première suspicion de méningite cryptococcique liée au VIH, la PL avec pression d’ouverture et test antigénique rapide est centrale ; l’immunodépression ne doit pas devenir un motif automatique de retard. La décision tient compte des autres contre-indications. Chez l’enfant, une crise fébrile isolée sans autre signe de risque ne justifie pas à elle seule un scanner.</p><p>Sources : <button class="w" data-k="g03-r4">[R4]</button></p></template>
<template data-pop="g03-mollaret" data-k="g03-mollaret"><h3>Mollaret : récidives et lien avec HSV-2</h3><p>Des épisodes aigus douloureux alternent avec des intervalles libres. HSV-2 est une association importante, mais la documentation peut varier entre épisodes ; les cellules historiquement dites de Mollaret ne sont pas spécifiques. La DGN rappelle qu’une méningite médicamenteuse peut reproduire le tableau.</p><p>La cohorte danoise associait au moins deux épisodes à une preuve de HSV-2 lors d’un épisode, selon ses définitions. Elle retrouvait un pronostic fonctionnel global favorable, avec une possibilité persistante de nouvelle hospitalisation. L’évaluation utilisée peut manquer fatigue et troubles cognitifs subtils.</p><p>Sources : <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r8">[R8]</button></p></template>
<template data-pop="g03-chronique" data-k="g03-chronique"><h3>PL répétées et biopsie : pourquoi et dans quelles limites ?</h3><p>Une première PL négative ne clôt pas nécessairement le bilan chronique. Répéter des prélèvements orientés peut augmenter le rendement microbiologique ou cytologique, après réévaluation de la sécurité. Le volume, les tubes, le transport et les analyses sont discutés en amont avec le laboratoire ; il n’existe pas de volume ou de nombre universel de PL à appliquer à tout patient.</p><p>L’IRM avec contraste recherche le siège du rehaussement, les atteintes des nerfs crâniens, l’hydrocéphalie et d’autres lésions. Une biopsie peut être discutée lorsque le bilan reste non concluant et que le résultat modifierait les soins. Un site extraneural accessible est recherché ; si une biopsie méningée est retenue, cibler une région anormale à l’imagerie peut améliorer le rendement, sans garantir un diagnostic.</p><p>La décision associe neurologue, infectiologue et, selon les hypothèses, interniste, immunologue, ophtalmologue ou oncologue. Les faibles rendements de certaines techniques et les risques du geste sont explicités au patient.</p><p>Sources : <button class="w" data-k="g03-r3">[R3]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></template>
<template data-pop="pareto-g03-clinique" data-k="pareto-g03-clinique"><h3>Raisonnement clinique</h3><p>Une méningite est une urgence potentielle avant son étiquette. Distinguer aiguë, persistante et récurrente ; interpréter ensemble clinique, LCR et microbiologie. Retirer un médicament suspect avec traçabilité, rechercher les causes chroniques et réviser tout diagnostic acquis.</p></template>
<template data-pop="g03-lcr" data-k="g03-lcr"><h3>Lire ensemble cellules, glucose, protéines et lactate</h3><p>Chez l’adulte, la recommandation de diagnostic du LCR cite notamment moins de 5 leucocytes/µl, protéines totales inférieures à 500 mg/l et rapport glucose LCR/sérum supérieur à 0,50 comme repères usuels, avec variation selon âge, site et méthode. Ils doivent être confrontés aux valeurs du laboratoire. Les seuils pédiatriques ne sont pas extrapolés.</p><p>Une pléiocytose traduit un excès de cellules nucléées ; la formule indique leur répartition. Une prédominance neutrophile peut se voir au début d’une virose ou dans une méningite médicamenteuse. Une faible cellularité n’élimine pas une infection grave, surtout en début d’évolution ou en immunodépression.</p><p>Un glucose abaissé peut accompagner une infection bactérienne, tuberculeuse ou fongique et une infiltration tumorale. Les protéines renseignent sur perméabilité, circulation et inflammation, sans fournir une cause unique. Le lactate est un argument d’orientation, affecté notamment par un prétraitement et par d’autres atteintes neurologiques.</p><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r5">[R5]</button> · <button class="w" data-k="g03-r7">[R7]</button> · <button class="w" data-k="g03-r9">[R9]</button></p></template>
<template data-pop="pareto-g03-examens" data-k="pareto-g03-examens"><h3>Explorations</h3><p>La sécurité précède le geste ; le prélèvement apparié et le transport conditionnent le résultat. Les profils du LCR se chevauchent. Choisir microbiologie, immunologie, cytologie et imagerie selon une hypothèse réévaluée.</p></template>
<template data-pop="pareto-g03-semio" data-k="pareto-g03-semio"><h3>Sémiologie</h3><p>Décrire avant de conclure. Relier enveloppes, douleur, LCR et fonction neurologique ; reconnaître les signes qui dépassent une méningite simple. Une triade absente ou un test négatif isolé n’excluent pas une cause grave.</p></template>
<template data-pop="g03-pression" data-k="g03-pression"><h3>Pression d’ouverture : mesure, sécurité et exception cryptococcique</h3><p>La pression d’ouverture est mesurée en décubitus latéral avant retrait significatif de liquide, avec un dispositif adapté. Le guide européen cite 100–250 mm d’eau comme intervalle de référence dépendant notamment de la corpulence ; il ne s’agit pas d’un seuil universel isolé de maladie. L’indication et la sécurité de la PL sont évaluées auparavant.</p><p>Une masse avec effet de pression et risque d’engagement peut imposer de différer le geste. À l’inverse, la suspicion de méningite cryptococcique liée au VIH rend la PL avec pression d’ouverture essentielle selon OMS 2025, sous réserve des autres contre-indications. La mesure et une éventuelle gestion thérapeutique de la pression relèvent du protocole spécialisé.</p><p>Sources : <button class="w" data-k="g03-r4">[R4]</button> · <button class="w" data-k="g03-r7">[R7]</button></p></template>
<template data-pop="g03-cellules" data-k="g03-cellules"><h3>Cellules de Mollaret : une observation non spécifique</h3><p>Des cellules historiquement décrites dans la méningite récurrente ont donné leur nom à une description cytologique. La DGN 2025 précise qu’elles ne sont pas pathognomoniques. Leur présence ne suffit ni à identifier HSV-2 ni à exclure une cause médicamenteuse ou une autre inflammation.</p><p>La cohorte danoise récente a défini ses cas à partir des épisodes cliniques et de l’association documentée à HSV-2, sans exiger ces cellules. Le diagnostic moderne repose sur un faisceau clinique et microbiologique, avec des définitions variables entre études.</p><p>Sources : <button class="w" data-k="g03-r6">[R6]</button> · <button class="w" data-k="g03-r8">[R8]</button></p></template>
<template data-pop="g03-paracetamol" data-k="g03-paracetamol"><h3>DAFALGAN 500 mg : schéma adulte et adaptations vérifiées</h3><p>FI suisse septembre 2025, autorisation 69266 : chaque comprimé contient 500 mg de paracétamol. Pour l’adulte de plus de 40 kg, la FI décrit 500–1000 mg par prise, avec intervalle de 4–8 heures et maximum 4000 mg par jour toutes spécialités confondues. Ce plafond n’est pas une dose à atteindre systématiquement.</p><p>Insuffisance rénale : clairance de créatinine 10–50 ml/min, intervalle minimal 6 heures et maximum 3000 mg/j ; clairance <10 ml/min, intervalle minimal 8 heures et maximum 2000 mg/j. En maladie hépatique chronique ou compensée active, alcoolisme chronique, déficit alimentaire, déshydratation ou cachexie, réduire la dose ou espacer, sans dépasser 2000 mg/j selon la FI.</p><p>Contre-indications de cette présentation : hypersensibilité, atteinte hépatique grave/hépatite aiguë ou maladie décompensée active, et maladie de Gilbert mentionnée par cette FI. Vérifier le terrain avant toute proposition. Les schémas pédiatriques et les données SwissPedDose ajoutées à la page ne sont pas extrapolés ici.</p><p>Sources : <button class="w" data-k="g03-r10">[R10]</button></p></template>
<template data-pop="g03-privigen" data-k="g03-privigen"><h3>Privigen : signal documenté, pas traitement de G03</h3><p>FI juillet 2025 : syndrome habituellement dans les heures à deux jours, parfois avec forte pléiocytose majoritairement granulocytaire et protéines augmentées. Une dose élevée et/ou un débit élevé sont associés à un risque plus fréquent. Les patients symptomatiques doivent recevoir une évaluation neurologique avec analyse du LCR afin d’exclure d’autres causes.</p><p>La FI rapporte une rémission généralement en quelques jours après arrêt. Cette évolution habituelle n’est ni garantie individuelle ni motif pour attendre sans bilan. Enregistrer produit et lot ; déclarer l’effet nouveau ou grave suspect selon les modalités suisses. Aucune dose d’IgIV n’est proposée comme traitement de la méningite.</p><p>Sources : <button class="w" data-k="g03-r11">[R11]</button></p></template>
<template data-pop="g03-ibuprofene" data-k="g03-ibuprofene"><h3>Ibuprofène : méningite aseptique avec ou sans lupus</h3><p>FI décembre 2024 d’Ibuprofen-Mepha Teva : des cas de méningite aseptique sont rapportés. Lupus et collagénoses semblent prédisposer, mais des cas surviennent aussi sans ces maladies. L’ibuprofène peut masquer les symptômes d’une infection sous-jacente et retarder la reconnaissance de son aggravation.</p><p>Rechercher l’automédication et les prises intermittentes. En cas de suspicion, discuter retrait et alternative, documenter l’imputabilité et éviter une réexposition provocatrice. Aucun schéma d’AINS n’est proposé ici pour traiter G03.</p><p>Sources : <button class="w" data-k="g03-r12">[R12]</button></p></template>
<template data-pop="g03-suppression" data-k="g03-suppression"><h3>Valaciclovir suppressif : ce que l’essai permet de dire</h3><p>L’essai suédois de 2012 a randomisé 101 patients après méningite HSV-2 vers placebo ou valaciclovir 500 mg deux fois/j pendant un an. Aucune réduction significative des récidives n’a été montrée la première année. Le résumé conclut que ce schéma ne peut pas être recommandé en prévention générale des récidives méningées.</p><p>Il s’agit du schéma testé, pas d’une démonstration que toute stratégie antivirale est inefficace. Le traitement aigu, l’herpès génital et l’encéphalite sont des indications différentes. Le texte intégral n’a pas été lu ; le résumé indexé contient une incohérence dans un intervalle de confiance de deuxième année, qui n’est pas reproduit.</p><p>Sources : <button class="w" data-k="g03-r15">[R15]</button></p></template>
<template data-pop="pareto-g03-pharmaco" data-k="pareto-g03-pharmaco"><h3>Pharmacologie</h3><p>Traiter une indication précise. Pour le symptôme adulte, vérifier le comprimé 500 mg, les intervalles et les plafonds rénaux/hépatiques. Rechercher les médicaments suspects, ne pas provoquer de réexposition et ne pas convertir un résultat d’essai de suppression en règle sur tout antiviral.</p></template>
