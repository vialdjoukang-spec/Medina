<template data-pop="g03-r1" data-k="g03-r1"><h3>[R1] SSI : addendum suisse à ESCMID, 28 décembre 2017</h3><p>L’addendum contextualise le lactate, la sécurité de la PL et les choix antibiotiques en Suisse. Le choix distingue notamment amoxicilline et pénicilline G ; la dexaméthasone adulte est arrêtée si la cause n’est pas bactérienne ou n’est pas pneumococcique.</p><p><b>Passage lu :</b> Deux pages : lactate, sécurité de PL, traitement empirique et corticothérapie. <b>Population :</b> Méningites bactériennes, adultes et enfants, selon rubriques. <b>Limites :</b> Addendum daté 2017 ; aucune version 2026 du guide dynamique SSI établie. Les particularités pédiatriques et les seuils de coagulation ne deviennent pas règles universelles.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode document.</p><p><a data-reference-source href="https://ssi.guidelines.ch/api/reader/get/glFile/10635" target="_blank" rel="noopener noreferrer">Consulter la source — Swiss Society for Infectious Diseases</a></p></template>
<template data-pop="g03-r2" data-k="g03-r2"><h3>[R2] Syndrome méningé fébrile aux urgences, 2016</h3><p>Les signes cliniques sont insuffisants pour exclure une méningite ; une antibiothérapie préalable modifie le rendement et le profil du liquide. La PL est centrale, sans retarder le traitement si elle est différée.</p><p><b>Passage lu :</b> Narration clinique : urgence, clinique, PL, microbiologie, PCT et lactate. <b>Population :</b> Patients des urgences, méningites aiguës. <b>Limites :</b> Revue suisse ancienne ; pas protocole actuel exclusif. Tableaux illustrés non intégralement relus. Le chiffre américain cité dans son introduction ne constitue pas incidence suisse.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-526/syndrome-meninge-febrile-au-service-des-urgences-prise-en-charge" target="_blank" rel="noopener noreferrer">Consulter la source — Degraeve et al., Revue médicale suisse</a></p></template>
<template data-pop="g03-r3" data-k="g03-r3"><h3>[R3] Méningite chronique : étiologies et approche diagnostique, 2021</h3><p>Une inflammation persistant au-delà de quatre semaines diffère d’épisodes aigus séparés par récupération. Terrain immunitaire, expositions, examen systémique, IRM et analyses orientées du LCR organisent un bilan séquentiel ; une biopsie accessible extraneurale peut aider.</p><p><b>Passage lu :</b> Narration complète : cas, définition, clinique, bilan, PL répétées, biopsie, causes, discussion et conclusion. <b>Population :</b> Méningites chroniques ; observation suisse d’une patiente de 62 ans. <b>Limites :</b> Revue 2021 et cas clinique, non essai ni incidence nationale. Tableaux/images seulement légendés, non utilisés pour critères détaillés. Les propositions empiriques et rendements issus de petites séries ne sont pas des prescriptions universelles.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.revmed.ch/revue-medicale-suisse/2021/revue-medicale-suisse-748/meningite-chronique-etiologies-et-approche-diagnostique" target="_blank" rel="noopener noreferrer">Consulter la source — Ammann et al., Revue médicale suisse</a></p></template>
<template data-pop="g03-r4" data-k="g03-r4"><h3>[R4] WHO guidelines on meningitis diagnosis, treatment and care, 2025</h3><p>Pas d’imagerie systématique avant PL ; critères de risque précisés, sans retarder le traitement. Corticoïdes avec les premiers antibiotiques si suspicion bactérienne, arrêt si LCR non compatible. Dépistage auditif avant sortie ou dans les quatre semaines. Un second test formel est prévu après un premier dépistage avant sortie normal.</p><p><b>Passage lu :</b> Chapitre 3 : diagnostic A1–A4, admission B1, corticoïdes B3 et dépistage auditif C4. <b>Population :</b> Méningite aiguë communautaire, enfants de plus d’un mois et adultes. <b>Limites :</b> Guide mondial, adaptation suisse nécessaire ; plusieurs recommandations fortes reposent sur certitude faible ou très faible. Les chapitres de traitement étiologique spécialisés ne sont pas tous lus. Exception cryptococcose/VIH : PL avec pression d’ouverture malgré immunodépression selon contexte.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.ncbi.nlm.nih.gov/books/NBK614844/" target="_blank" rel="noopener noreferrer">Consulter la source — Organisation mondiale de la santé</a></p></template>
<template data-pop="g03-r5" data-k="g03-r5"><h3>[R5] German guidelines on acute bacterial meningitis in adults, 2023</h3><p>L’absence d’un signe cardinal n’exclut pas la maladie. Les profils du LCR se chevauchent ; PCR multiplex ne remplace pas Gram, culture et antibiogramme. Si PL différée, prélèvements sanguins puis traitement avant imagerie.</p><p><b>Passage lu :</b> Recommandations initiales, clinique, paramètres LCR, microbiologie, imagerie et complications. <b>Population :</b> Adultes, méningite bactérienne communautaire. <b>Limites :</b> Version allemande abrégée/traduite, non prescription suisse. Incohérence d’unité protéique entre narration et tableau évitée ; aucun seuil protéique isolé n’est employé pour exclure une bactérie.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener noreferrer">Consulter la source — DGN/AWMF, traduction publiée Klein et al.</a></p></template>
<template data-pop="g03-r6" data-k="g03-r6"><h3>[R6] DGN : Virale Meningoenzephalitis, version 7, 2025</h3><p>Une méningite virale simple ne comporte pas de déficit focal ni de trouble de conscience ; leur présence change le niveau d’urgence. Mollaret peut récidiver sur plusieurs années ; ses cellules ne sont pas pathognomoniques. Une forme simple reçoit un traitement symptomatique.</p><p><b>Passage lu :</b> Recommandations clés, classification 1.2 et Mollaret 3.2.6. <b>Population :</b> Syndromes viraux neurologiques, surtout adultes européens. <b>Limites :</b> Consensus S1 allemand, lecture ciblée ; pas preuve contrôlée de tout antiviral ni règle diagnostique internationale de Mollaret.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Deutsche Gesellschaft für Neurologie</a></p></template>
<template data-pop="g03-r7" data-k="g03-r7"><h3>[R7] S1 guideline lumbar puncture and cerebrospinal fluid analysis, traduction 2020</h3><p>Associer sérum et LCR pour glucose et quotients ; acheminer rapidement, interpréter selon âge, site et méthode. Des bandes oligoclonales spécifiques du LCR soutiennent une réponse intrathécale sans en identifier la cause. Un profil peu cellulaire n’exclut pas une infection.</p><p><b>Passage lu :</b> Indications, contre-indications, préanalytique, pression, tableau 4, protéines, albumine, Ig et diagnostic infectieux. <b>Population :</b> Exploration neurologique par LCR, normes surtout adultes. <b>Limites :</b> Consensus S1 de 2019 traduit 2020. Normes européennes indicatives, à confronter au laboratoire ; seuils de coagulation variables entre sources et non érigés en prescription universelle.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7650145/" target="_blank" rel="noopener noreferrer">Consulter la source — DGN et DGLN, Tumani et al.</a></p></template>
<template data-pop="g03-r8" data-k="g03-r8"><h3>[R8] Mollaret au Danemark : cohorte nationale, 2024</h3><p>L’incidence estimée est 1,2/million d’adultes/an au Danemark ; le risque de progression après HSV-2 est 22 % (IC95 % 15–30). Les épisodes récidivent malgré une présentation souvent favorable ; les critères d’étude exigent au moins deux épisodes et une association documentée à HSV-2.</p><p><b>Passage lu :</b> Résumé, définition de cohorte, méthodes, résultats, tableaux 1–2, discussion et limites. <b>Population :</b> 47 adultes hospitalisés pour méningite récurrente associée à HSV-2, Danemark 2015–2020. <b>Limites :</b> Population hospitalière et épisodes antérieurs parfois rétrospectifs ; estimation non suisse, non tous G03. Le score fonctionnel peut manquer des troubles cognitifs fins. Critères d’étude, non critères universels.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11235955/" target="_blank" rel="noopener noreferrer">Consulter la source — Petersen et al., European Journal of Neurology</a></p></template>
<template data-pop="g03-r9" data-k="g03-r9"><h3>[R9] Méningite aseptique médicamenteuse : 329 cas français, 2019</h3><p>Les classes incluent IgIV, AINS et antimicrobiens. Le LCR peut être neutrophilique ou lymphocytaire ; l’arrêt du médicament suspect est central. Dans les dossiers détaillés, 44,8 % étaient dits purulents et 33 % lymphocytaires.</p><p><b>Passage lu :</b> Résumé, méthodes et définitions, analyse de 203 dossiers, évolution, discussion et limites. <b>Population :</b> Notifications françaises 1985–2017 ; 203 cas bien documentés, 282 médicaments suspects. <b>Limites :</b> Pharmacovigilance spontanée : sous-notification, biais de notoriété et protopathique, causalité non certaine et aucune incidence. La définition d’aseptique propre à cette série exclut les agents viraux détectés, contrairement à certains usages syndromiques.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6848896/" target="_blank" rel="noopener noreferrer">Consulter la source — Bihan et al., British Journal of Clinical Pharmacology</a></p></template>
<template data-pop="g03-r10" data-k="g03-r10"><h3>[R10] DAFALGAN comprimés 500 mg, FI septembre 2025</h3><p>La FI autorise 500–1000 mg par prise, intervalle adulte 4–8 h, maximum 4 g/j pour >40 kg ; elle réduit plafonds et/ou espace en insuffisance rénale et terrains hépatiques. Le surdosage provoque une toxicité hépatique.</p><p><b>Passage lu :</b> Composition, indications, dose, reins/foie, contre-indications, interactions, grossesse, pharmacodynamie et métabolisme. <b>Population :</b> Présentation comprimés autorisation 69266 ; adulte dans cette leçon. <b>Limites :</b> Aucune dose pédiatrique de cette page ni donnée SwissPedDose ajoutée ne sont transposées. Le plafond 4 g n’est pas un objectif ; durée minimale et réévaluation clinique, absence de durée fixe de traitement d’une méningite.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680692660022" target="_blank" rel="noopener noreferrer">Consulter la source — UPSA Switzerland, information professionnelle suisse via AmiKo</a></p></template>
<template data-pop="g03-r11" data-k="g03-r11"><h3>[R11] Privigen : FI juillet 2025</h3><p>Le syndrome débute habituellement dans les heures à deux jours ; LCR parfois fortement granulocytaire. Il faut exclure les autres causes ; arrêt associé à rémission habituelle en quelques jours. Forte dose ou débit élevé favorisent le risque.</p><p><b>Passage lu :</b> Mise en garde syndrome de méningite aseptique, effets indésirables, annonce ElViS et version. <b>Population :</b> Patients recevant des immunoglobulines intraveineuses. <b>Limites :</b> Pas critère permettant de conclure au seul délai ; aucune posologie d’IgIV prescrite pour G03. Le syndrome après perfusion reste une urgence diagnostique.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680583140015" target="_blank" rel="noopener noreferrer">Consulter la source — CSL Behring, information professionnelle suisse via AmiKo</a></p></template>
<template data-pop="g03-r12" data-k="g03-r12"><h3>[R12] Ibuprofen-Mepha Teva : FI décembre 2024</h3><p>Une méningite aseptique est rapportée, notamment en lupus/collagénose mais aussi sans ces maladies. Le médicament peut masquer les signes infectieux ; un effet nouveau ou grave suspect est à déclarer via ElViS.</p><p><b>Passage lu :</b> Mise en garde méningite aseptique, masquage infectieux, effets indésirables et déclaration. <b>Population :</b> Utilisateurs d’ibuprofène. <b>Limites :</b> Pas incidence mesurée par notification ; pas exclusivité du terrain lupique. Aucun schéma d’ibuprofène comme traitement de G03 n’est publié ici.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680491560011" target="_blank" rel="noopener noreferrer">Consulter la source — Mepha Pharma, information professionnelle suisse via AmiKo</a></p></template>
<template data-pop="g03-r13" data-k="g03-r13"><h3>[R13] CIM-10-GM 2024 : G03</h3><p>G03.0 non purulente, G03.1 chronique, G03.2 récurrente bénigne de Mollaret, G03.8 autres causes précisées, G03.9 non précisée. L’encéphalite et la myélite associées sortent vers G04 selon rubrique.</p><p><b>Passage lu :</b> Bloc G03 et exclusions voisines G04. <b>Population :</b> Classification allemande GM 2024. <b>Limites :</b> Source de définition du code, non diagnostic clinique ni preuve d’un codage de facturation suisse actuel ; l’étiologie établie peut imposer une rubrique spécifique.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener noreferrer">Consulter la source — BfArM</a></p></template>
<template data-pop="g03-r14" data-k="g03-r14"><h3>[R14] CEN : méningites et méningo-encéphalites, item 151</h3><p>Raideur, Kernig et Brudzinski traduisent une irritation sans identifier la cause. Le nourrisson peut avoir hypotonie et signes généraux ; l’adulte âgé des signes frustes. Les causes chroniques comprennent infections, inflammation et infiltration tumorale.</p><p><b>Passage lu :</b> Syndromes méningé/encéphalitique, âges extrêmes, causes chroniques, médicaments, inflammations et carcinose. <b>Population :</b> Enseignement clinique adulte et enfant. <b>Limites :</b> Page pédagogique sans date clinique de version assurée ; descriptions automatiques d’images non utilisées. Ne pas reprendre sa liste où Nocardia figure parmi les champignons : bactérie.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.cen-neurologie.fr/second-cycle/i-connaissances/chapitre-24-item-151-meningites-meningo-encephalites-abces-cerebral-chez-ladulte-et-lenfant" target="_blank" rel="noopener noreferrer">Consulter la source — Collège des enseignants de neurologie, France</a></p></template>
<template data-pop="g03-r15" data-k="g03-r15"><h3>[R15] Essai randomisé valaciclovir suppressif après méningite HSV-2, 2012</h3><p>500 mg deux fois/j pendant un an n’a pas montré de prévention des récidives dans cet essai. Cette dose de suppression ne doit pas être recommandée de routine pour ce but.</p><p><b>Passage lu :</b> Résumé primaire : méthodes, résultat première année et conclusion. <b>Population :</b> 101 patients après méningite HSV-2 primaire ou récurrente. <b>Limites :</b> Résumé ciblé uniquement, pas texte intégral. L’intervalle de confiance du signal de deuxième année est manifestement incohérent dans le résumé indexé : non reproduit. Ce résultat ne démontre pas l’inefficacité de tout schéma ni ne prescrit le traitement aigu.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode abstract.</p><p><a data-reference-source href="https://pubmed.ncbi.nlm.nih.gov/22460966/" target="_blank" rel="noopener noreferrer">Consulter la source — Aurelius et al., essai multicentrique suédois</a></p></template>
<template data-pop="g03-r16" data-k="g03-r16"><h3>[R16] Gray Anatomy 1918, planche 1196 : enveloppes et sinus</h3><p>Dure-mère, arachnoïde, pie-mère et sinus sagittal supérieur sont distingués sur l’original. Des annotations françaises adjacentes relient enveloppes, LCR et raisonnement clinique.</p><p><b>Passage lu :</b> Description, auteur, provenance et notice de domaine public ; original affiché et inspecté. <b>Population :</b> Anatomie humaine normale historique. <b>Limites :</b> Original humain historique, pixels inchangés ; pas image d’inflammation ni preuve diagnostique. Notice relue pour G03, cache antérieur.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener noreferrer">Consulter la source — Wikimedia Commons, Gray/Carter</a></p></template>
<template data-pop="g03-r17" data-k="g03-r17"><h3>[R17] Gray Anatomy 1918, planche 764 : voie motrice</h3><p>Le trajet cortical, capsulaire et corticospinal rappelle pourquoi un déficit moteur focal indique une atteinte dépassant une simple irritation méningée.</p><p><b>Passage lu :</b> Description, auteur, date, licence et original affiché/inspecté. <b>Population :</b> Voie motrice humaine normale simplifiée. <b>Limites :</b> Planche historique simplifiée, sans maladie ni procédure de PL représentée ; ne localise pas à elle seule une lésion. Pixels inchangés.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener noreferrer">Consulter la source — Wikimedia Commons, schéma historique modifié de Poirier, Gray/Carter</a></p></template>
<template data-pop="g03-r18" data-k="g03-r18"><h3>[R18] PROFILES 2017 : urgence céphalée sévère et méningisme</h3><p>La céphalée aiguë sévère et le méningisme constituent une situation de départ et d’urgence ; reconnaître, explorer et initier la prise en charge doit s’apprendre ensemble.</p><p><b>Passage lu :</b> EPA 6d et SSP 207, avec SSP 205 déficit neurologique aigu. <b>Population :</b> Formation médicale suisse. <b>Limites :</b> Référentiel 2017 ; rattachement pédagogique proposé pour G03, aucun crosswalk fédéral officiel CIM-10/SSP ni affirmation de version 2026.</p><p>Lecture ciblée de Sol le 2 novembre 2026 ; journalisation après lecture. Mode section.</p><p><a data-reference-source href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Joint Commission of Swiss Medical Schools, SIWF/ISFM</a></p></template>
