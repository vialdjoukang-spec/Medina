<template data-pop="j12-d-nirmatrelvir" data-title="Nirmatrelvir-ritonavir (Paxlovid®)"><p class="lab">Mécanisme</p><p>Le nirmatrelvir inhibe la protéase principale du SARS-CoV-2, qui découpe les polyprotéines virales : la réplication s’arrête. Le ritonavir n’a ici qu’un rôle pharmacocinétique : il inhibe le CYP3A, qui métabolise le nirmatrelvir, et en augmente la concentration.</p><p class="lab">Preuve</p><p>L’essai pivot de phase 2-3, publié en 2022, a comparé le traitement au placebo en double aveugle chez des adultes non vaccinés à haut risque. Dans l’analyse intermédiaire des patients traités dans les trois jours, l’hospitalisation liée à la COVID-19 ou le décès à 28 jours est passé de 7,01 % à 0,77 %, soit une réduction relative de 89 %. Dans l’analyse finale, les 13 décès sont tous survenus sous placebo. La dysgueusie (5,6 %) et la diarrhée (3,1 %) étaient plus fréquentes sous traitement.</p><p class="lab">Posologie et précautions</p><p>300 mg/100 mg toutes les 12 heures pendant cinq jours, le plus tôt possible après un test positif ; adaptation dès un débit de filtration inférieur à 60 mL/min ; proscrit en Child-Pugh C. Les contre-indications par interaction sont nombreuses. La femme en âge de procréer évite toute grossesse jusqu’à sept jours après la fin du traitement ; le ritonavir réduisant l’efficacité des contraceptifs hormonaux combinés, une méthode de contraception supplémentaire est nécessaire jusqu’à un cycle après l’arrêt.</p><div class="key"><b>Place.</b> Premier choix de la SSI pour le traitement précoce du patient à haut risque, dans les cinq premiers jours.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680687930017" target="_blank" rel="noopener">Information professionnelle suisse Paxlovid®, août 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35172054/" target="_blank" rel="noopener">Hammond et al., N Engl J Med 2022</a> ; <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, COVID-19, 2026</a>.</p></template>
<template data-pop="j12-d-remdesivir" data-title="Remdésivir (Veklury®)"><p class="lab">Mécanisme</p><p>Le remdésivir est la prodrogue d’un analogue nucléotidique de l’adénosine, activée dans la cellule en triphosphate. Celui-ci entre en compétition avec l’ATP pour l’incorporation dans l’ARN viral naissant et en interrompt l’élongation.</p><p class="lab">Preuve</p><p>Dans un essai en double aveugle contre placebo publié en 2022, trois jours de remdésivir chez 562 patients ambulatoires à risque ont réduit l’hospitalisation ou le décès de 5,3 % à 0,7 % (rapport de risque 0,13).</p><p class="lab">Posologie et précautions</p><p>200 mg au jour 1, puis 100 mg par jour ; trois jours sans oxygène, au moins cinq et au plus dix jours sous oxygène. Aucune adaptation rénale ou hépatique. Il expose à des réactions d’hypersensibilité pendant la perfusion et à une élévation des transaminases.</p><div class="key"><b>Place.</b> Alternative au nirmatrelvir-ritonavir pour le traitement précoce si une voie intraveineuse est disponible ; cinq jours chez le patient hospitalisé sous oxygène. La SSI rappelle que l’OMS le recommande conditionnellement en cas d’oxygénothérapie et le déconseille chez le patient intubé. Sa prise en charge suit une limitation de l’OFSP valable jusqu’au 31.12.2026 ; le traitement ambulatoire précoce est instauré par un centre spécialisé ou un hôpital universitaire.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680680260012" target="_blank" rel="noopener">Information professionnelle suisse Veklury®, décembre 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34937145/" target="_blank" rel="noopener">Gottlieb et al., N Engl J Med 2022</a> ; <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, COVID-19, 2026</a>.</p></template>
<template data-pop="j12-d-dexa" data-title="Dexaméthasone dans la COVID-19"><p class="lab">Mécanisme</p><p>Le glucocorticoïde peut moduler la lésion pulmonaire d’origine inflammatoire et réduire ainsi la progression vers l’insuffisance respiratoire : c’est l’hypothèse qu’a testée l’essai Recovery.</p><p class="lab">Preuve</p><p>Dans l’essai ouvert Recovery (6425 patients hospitalisés), 6 mg par jour pendant au plus dix jours ont réduit la mortalité à 28 jours de 25,7 % à 22,9 %. Le bénéfice portait sur les patients ventilés (29,3 % contre 41,4 %) et sous oxygène (23,3 % contre 26,2 %) ; sans assistance respiratoire, la mortalité était de 17,8 % contre 14,0 %, sans bénéfice.</p><p class="lab">Posologie</p><p>6 mg par jour par voie orale ou intraveineuse, sept à dix jours ou jusqu’à la sortie. Équivalents proposés par la SSI : prednisone 40 mg par jour ou méthylprednisolone 10 mg toutes les 6 heures, adaptées au poids chez l’obèse. La SSI conseille d’éviter la dexaméthasone pendant la grossesse ou avec un anticoagulant oral direct. Selon l’information professionnelle, un corticoïde systémique pris au long cours pour une autre maladie n’est pas interrompu chez le patient qui n’a pas besoin d’oxygène.</p><div class="key"><b>Place.</b> COVID-19 avec besoin d’oxygène ou ventilation : premier immunomodulateur.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32678530/" target="_blank" rel="noopener">Recovery Collaborative Group, N Engl J Med 2021</a> ; <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, COVID-19, 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680667100010" target="_blank" rel="noopener">Information professionnelle Dexaméthasone Galepharm, juin 2022</a>.</p></template>
<template data-pop="j12-d-immunomod" data-title="Tocilizumab et baricitinib"><p class="lab">Indication selon la SSI</p><p>Ces deux médicaments s’ajoutent aux corticoïdes dans une COVID-19 sévère dont les besoins en oxygène ne s’améliorent pas 12 à 24 heures après leur début ; certaines études ont ajouté un seuil de CRP supérieur à 75 mg/L. La SSI réserve le tocilizumab au cas où le baricitinib est indisponible ou contre-indiqué. Avec la dexaméthasone à faible dose, ce sont les seuls médicaments qui ont réduit la mortalité globale, y compris en réanimation.</p><p class="lab">Tocilizumab</p><p>Le tocilizumab est un anticorps contre le récepteur de l’interleukine 6. La SSI administre 8 mg/kg du poids réel, au plus 800 mg, en une injection intraveineuse unique ; l’effet est immédiat et persiste après l’administration. Les contre-indications relatives sont une infection non contrôlée, une cause non infectieuse d’aggravation comme une embolie pulmonaire, des plaquettes inférieures à 50 G/L et des transaminases supérieures à cinq fois la normale. La COVID-19 ne figure pas dans son information professionnelle suisse.</p><p class="lab">Baricitinib</p><p>Inhibiteur des kinases Janus 1 et 2. La dose est de 4 mg par jour pendant au plus 14 jours, 2 mg si le débit de filtration est de 30 à 60 mL/min ; il n’est pas recommandé en dessous de 30. Son effet survient en trois à cinq jours et cesse rapidement à l’arrêt. Il est contre-indiqué si l’anticoagulation l’est, car il favorise la thrombose. En Suisse, son information professionnelle l’autorise dans la COVID-19 en association avec le remdésivir chez l’adulte hospitalisé sous oxygène ; la SSI admet son emploi sans remdésivir.</p><div class="key"><b>Précaution commune.</b> Une hépatite B latente ou occulte est recherchée, sans retarder l’administration.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, COVID-19, 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680588680011" target="_blank" rel="noopener">Information professionnelle Actemra®, septembre 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662150010" target="_blank" rel="noopener">Information professionnelle Olumiant®, novembre 2025</a>.</p></template>
<template data-pop="j12-d-ganciclovir" data-title="Ganciclovir (Cymevene) et alternatives"><p class="lab">Mécanisme</p><p>Le ganciclovir est un analogue nucléosidique. Dans la cellule infectée, la kinase virale UL97 le phosphoryle en monophosphate ; des kinases cellulaires le transforment ensuite en triphosphate, qui inhibe l’ADN polymérase virale et interrompt la chaîne d’ADN.</p><p class="lab">Posologie</p><p>5 mg/kg en perfusion d’une heure toutes les 12 heures pendant 14 à 21 jours ; l’ECIL-7 retient au moins trois semaines pour la pneumonie. La dose diminue dès une clairance inférieure à 70 mL/min. Le traitement n’est pas débuté si les neutrophiles sont inférieurs à 500/µL, les plaquettes à 25 000/µL ou l’hémoglobine à 8 g/dL.</p><p class="lab">Toxicité</p><p>Le ganciclovir expose à la neutropénie, à l’anémie, à la thrombopénie et à l’aplasie. Il est contre-indiqué pendant la grossesse et l’allaitement ; la femme utilise une contraception efficace jusqu’à 30 jours après la fin, l’homme une contraception barrière jusqu’à 90 jours.</p><div class="key"><b>Alternatives.</b> Le foscarnet remplace le ganciclovir selon l’ECIL ; son information professionnelle suisse ne prévoit que la rétinite à CMV du sida. Le maribavir est réservé à l’infection réfractaire ou résistante (ECIL-10).</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680491880133" target="_blank" rel="noopener">Information professionnelle suisse Cymevene, janvier 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680523570131" target="_blank" rel="noopener">Information professionnelle Foscavir, juin 2022</a> ; <a href="https://www.ecil-leukaemia.com/images/resources/2017/1_ECIL_7_CMV_final_slides_for_website.pdf" target="_blank" rel="noopener">ECIL-7, 2017</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/Recommendation_slides_ECIL_10_CMV_working_group_final_.pdf" target="_blank" rel="noopener">ECIL-10, CMV, 2024</a>.</p></template>
<template data-pop="j12-d-aciclovir" data-title="Aciclovir intraveineux dans la pneumonie varicelleuse"><p class="lab">Mécanisme</p><p>L’aciclovir est actif sur les virus herpès simplex 1 et 2 et sur le VZV ; son information professionnelle l’indique dans le zona, en particulier de l’immunodéprimé.</p><p class="lab">Posologie</p><p>L’information professionnelle suisse fixe chez l’adulte 5 mg/kg toutes les 8 heures pour le zona et 10 mg/kg toutes les 8 heures pour le zona de l’immunodéprimé à fonction rénale normale, en perfusion d’une heure. La dose s’adapte à la fonction rénale ; une bonne hydratation limite la néphrotoxicité.</p><div class="key"><b>Lacune nommée.</b> L’information professionnelle ne comporte pas de ligne propre à la pneumonie varicelleuse de l’adulte ; la dose de 10 mg/kg correspond à l’infection grave à VZV de l’immunodéprimé. Dans la cohorte de réanimation de 2017, tous les patients ont reçu de l’aciclovir.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680447720193" target="_blank" rel="noopener">Information professionnelle suisse Zovirax® intraveineux, décembre 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28592328/" target="_blank" rel="noopener">Mirouse et al., 2017</a>.</p></template>
<template data-pop="j12-d-ribavirine" data-title="Ribavirine et cidofovir chez le greffé"><p class="lab">Ribavirine</p><p>L’ECIL propose de la discuter chez le greffé allogénique à haut risque de progression vers une infection basse à VRS, ou qui en est atteint : 10 à 30 mg/kg par jour par voie orale en trois prises, au plus 600 mg toutes les 8 heures ; 200 mg toutes les 8 heures si la clairance est de 30 à 50 mL/min. Elle impose de surveiller l’hémolyse, le bilan hépatique, la fonction rénale et les interactions. La forme en aérosol, tératogène pour l’entourage, est devenue exceptionnelle.</p><p class="lab">Cidofovir</p><p>Pour l’adénovirus, l’ECIL propose par exemple 1 mg/kg trois fois par semaine sans probénécide en cas de virémie, ou 5 mg/kg une fois par semaine avec probénécide en cas de pneumonie, avec hyperhydratation et surveillance rénale.</p><div class="key"><b>Lacune nommée.</b> Aucune information professionnelle suisse de la ribavirine ou du cidofovir n’a été trouvée sur amiko.oddb.org le 09.10.2026 ; ces schémas reposent sur l’ECIL, avec un niveau de preuve modéré à faible.</div><p class="src">Référence : <a href="https://www.ecil-leukaemia.com/images/ecil-10/CARVs_Update_2024_ECIL-10_final_4.pdf" target="_blank" rel="noopener">ECIL-10, virus respiratoires communautaires, 2024</a>.</p></template>
<template data-pop="j12-d-doxy" data-title="Doxycycline"><p class="lab">Spectre utile</p><p>L’information professionnelle suisse documente l’activité sur <i>Chlamydia psittaci</i> (CMI 0,03 mg/L), <i>Mycoplasma pneumoniae</i> et les rickettsies, dont l’agent de la fièvre Q, et l’indique dans les pneumonies à germes sensibles.</p><p class="lab">Posologie</p><p>L’information professionnelle prévoit 200 mg le premier jour puis 100 mg par jour, ou 200 mg par jour dans les infections graves. Pour <i>C. burnetii</i> et <i>M. pneumoniae</i>, la SSI prescrit 100 mg toutes les 12 heures, avec une dose de charge facultative de 200 mg.</p><p class="lab">Précautions</p><p>La doxycycline est contre-indiquée en cas d’atteinte hépatique sévère. Pendant la grossesse, elle est réservée à la nécessité absolue ; jusqu’à 12 ans, aux situations graves menaçant le pronostic vital, en raison de la coloration dentaire permanente.</p><div class="key"><b>Place.</b> Fièvre Q, psittacose et, en alternative aux macrolides, pneumonie à germes intracellulaires.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680659520017" target="_blank" rel="noopener">Information professionnelle suisse Doxycyclin-Mepha, février 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, 2026</a>.</p></template>
<template data-pop="j12-d-cotrimoxazole" data-title="Triméthoprime-sulfaméthoxazole (Bactrim®)"><p class="lab">Posologies</p><p>Le comprimé forte contient 160 mg de triméthoprime et 800 mg de sulfaméthoxazole. Dans la pneumocystose, l’information professionnelle prévoit jusqu’à 20 mg/kg de triméthoprime et 100 mg/kg de sulfaméthoxazole par jour en quatre prises pendant 14 jours, alors que l’EACS prescrit 5 mg/kg de triméthoprime trois fois par jour pendant au moins 21 jours. En prophylaxie, le patient prend un comprimé forte trois fois par semaine. Dans la nocardiose, il reçoit 480 à 640 mg de triméthoprime par jour pendant au moins trois mois.</p><p class="lab">Corticoïdes associés</p><p>Chez la personne vivant avec le VIH dont la PaO₂ est inférieure à 70 mmHg, l’EACS ajoute la prednisone : 40 mg deux fois par jour pendant cinq jours, 40 mg par jour pendant cinq jours, puis 20 mg par jour pendant dix jours, idéalement avant la première dose.</p><p class="lab">Précautions</p><p>La dose est réduite de moitié pour une clairance de 15 à 30 mL/min ; l’association est contre-indiquée en dessous de 15, au troisième trimestre de la grossesse, en cas de déficit en glucose-6-phosphate déshydrogénase et d’antécédent de toxidermie grave. L’hyperkaliémie est fréquente à forte dose : la kaliémie, la créatinine et l’hémogramme sont surveillés.</p><div class="key"><b>Alternative.</b> En cas d’intolérance documentée, l’ECIL préfère l’association primaquine-clindamycine. L’atovaquone, 750 mg deux fois par jour pendant 21 jours, traite les formes légères à modérées (EACS ; information professionnelle Wellvone).</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680483060482" target="_blank" rel="noopener">Information professionnelle suisse Bactrim forte, mars 2023</a> ; <a href="https://www.eacsociety.org/media/guidelines-12.0.pdf" target="_blank" rel="noopener">EACS 12.0, 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27550993/" target="_blank" rel="noopener">Maschmeyer et al., 2016</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680535630151" target="_blank" rel="noopener">Information professionnelle Wellvone, décembre 2025</a>.</p></template>
<template data-pop="j12-d-azoles" data-title="Antifongiques de l’aspergillose invasive"><p class="lab">Choix</p><p>Le voriconazole et l’isavuconazole sont les traitements de première ligne de l’aspergillose pulmonaire invasive ; l’amphotéricine B liposomale est une option, privilégiée si une résistance aux azolés est à craindre. L’association d’antifongiques en première intention n’est pas recommandée.</p><p class="lab">Voriconazole</p><p>Le voriconazole inhibe la déméthylation du 14α-stérol dépendante du cytochrome P-450 fongique, étape essentielle de la synthèse de l’ergostérol. 6 mg/kg toutes les 12 heures le premier jour, puis 4 mg/kg ; relais oral 200 mg toutes les 12 heures. Concentration résiduelle cible de 1 à 5 µg/mL. Troubles visuels (26,2 %) et anomalies du bilan hépatique (25,2 %) très fréquents ; correction préalable de la kaliémie, de la magnésémie et de la calcémie.</p><p class="lab">Isavuconazole et amphotéricine B</p><p>L’isavuconazole se donne à 200 mg toutes les 8 heures pendant 48 heures, puis à 200 mg par jour, avec un relais oral sans ajustement. L’AmBisome® se donne à 3 à 5 mg/kg par jour pendant au moins 14 jours.</p><div class="key"><b>Durée.</b> Elle dépend de l’amélioration clinique, du degré d’immunosuppression et de la réponse radiologique (ESCMID).</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29544767/" target="_blank" rel="noopener">Ullmann et al., 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33333012/" target="_blank" rel="noopener">Koehler et al., 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680559450025" target="_blank" rel="noopener">Information professionnelle Vfend®, mai 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680661730015" target="_blank" rel="noopener">Information professionnelle Cresemba®, janvier 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680533420198" target="_blank" rel="noopener">Information professionnelle AmBisome®, janvier 2025</a>.</p></template>
<template data-pop="j12-d-nirsevimab" data-title="Nirsévimab (Beyfortus®) et vaccins contre le VRS"><p class="lab">Mécanisme</p><p>Le nirsévimab est un anticorps monoclonal humain neutralisant, dirigé contre la protéine F du VRS en conformation de préfusion. Une modification de son fragment constant prolonge sa demi-vie, d’environ 71 jours chez le nourrisson de 5 kg : une injection couvre la saison.</p><p class="lab">Posologie</p><p>Une dose intramusculaire unique de 50 mg sous 5 kg et de 100 mg à partir de 5 kg pendant la première saison ; selon le plan suisse, dans la première semaine de vie pour une naissance d’octobre à mars, en octobre pour une naissance d’avril à septembre.</p><p class="lab">Vaccins</p><p>Abrysvo®, Arexvy® et mRESVIA® s’administrent en une dose unique de 0,5 mL. Abrysvo® est le seul autorisé pendant la grossesse, entre 32 et 36 semaines.</p><div class="key"><b>Limite chez l’adulte.</b> L’ECIL juge les données insuffisantes pour utiliser le nirsévimab chez l’adulte, en prévention comme en traitement.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680690390020" target="_blank" rel="noopener">Information professionnelle suisse Beyfortus®, juillet 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680696910017" target="_blank" rel="noopener">Abrysvo®, juillet 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680693100015" target="_blank" rel="noopener">Arexvy, juin 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680699950010" target="_blank" rel="noopener">mRESVIA, août 2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/CARVs_Update_2024_ECIL-10_final_4.pdf" target="_blank" rel="noopener">ECIL-10, 2024</a>.</p></template>
<template data-pop="pareto-j12-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j12-0,j12-1,j12-2,j12-3,j12-4,j12-5,j12-6"></p><ul><li>Une pneumonie se définit par un infiltrat nouveau et des signes d’infection basse ; l’agent se déduit du terrain, de la saison et de l’exposition.</li><li>Un virus est retrouvé dans 24,5 % des pneumonies communautaires de l’adulte, davantage avec des prélèvements bas ; l’infection mixte virale et bactérienne s’associe à une mortalité plus élevée (rapport de cotes 2,1).</li><li>Le VRS hospitalise surtout après 75 ans ; psittacose et fièvre Q naissent d’une exposition aux oiseaux ou au bétail.</li><li>La lésion épithéliale virale, puis l’inflammation, conduisent à l’hypoxémie ; antiviral tôt, immunomodulateur tard.</li><li>L’immunosuppression sévère fait sortir des recommandations communautaires.</li><li>L’interrogatoire date le début des symptômes ; l’oxymétrie et les signes d’alerte décident du lieu de soins.</li></ul></template>
<template data-pop="pareto-j12-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j12-7"></p><ul><li>L’imagerie prouve la pneumonie mais ne désigne pas l’agent.</li><li>En ambulatoire, un test viral ne se fait que si un antiviral est envisagé ; à l’hôpital, PCR de l’influenza en saison, et test du SARS-CoV-2 avant tout antiviral.</li><li>Antibiotique envisagé si CRP ≥ 100 mg/L ou procalcitonine ≥ 0,25 µg/L.</li><li>Légionellose et pneumocystose sont à éliminer selon le terrain.</li></ul></template>
<template data-pop="pareto-j12-pec" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="j12-8,j12-9,j12-10"></p><ul><li>Hypoxémie, sepsis, SDRA, surinfection bactérienne ou aspergillaire sont les complications graves.</li><li>Haut débit nasal pour l’insuffisance respiratoire hypoxémique.</li><li>Pas d’antibiotique sans suspicion bactérienne.</li><li>Dans la COVID-19, le patient à risque reçoit du nirmatrelvir-ritonavir dans les cinq jours, alors que la dexaméthasone n’est indiquée que sous oxygène, parce qu’elle freine l’inflammation de la phase tardive et non la réplication virale précoce.</li><li>Chez l’immunocompétent, le VRS ne se traite par aucun antiviral.</li><li>Chez l’immunodéprimé, le médecin pratique précocement un lavage avec PCR multiplex ; il traite le CMV par ganciclovir et l’Aspergillus par voriconazole ou isavuconazole.</li></ul></template>
<template data-pop="pareto-j12-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="j12-11,j12-12,j12-13"></p><ul><li>Relais oral après stabilité clinique ; réévaluation à 72 heures.</li><li>Vaccin contre le VRS dès 75 ans, ou plus tôt en cas de risque ; vaccination annuelle contre la COVID-19 des personnes à risque.</li><li>Grossesse, insuffisance rénale ou hépatique et interactions du ritonavir modifient la prescription.</li><li>Une pneumonie à CMV est probable si le CMV est retrouvé au lavage et que le patient a des signes de pneumonie.</li></ul></template>
<template data-pop="pareto-j12-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j12-e-1,j12-e-2,j12-e-3"></p><ul><li>Un examen se justifie s’il change le traitement, l’isolement ou le pronostic.</li><li>Une PCR nasopharyngée positive désigne un virus, non une pneumonie ; le rhinovirus est fréquent chez le sujet sain.</li><li>Pas de test antigénique de la grippe chez l’adulte.</li><li>Au lavage, une PCR du CMV négative exclut la pneumonie à CMV, et un β-D-glucane négatif exclut la pneumocystose.</li></ul></template>
<template data-pop="pareto-j12-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j12-p-1,j12-p-2,j12-p-3,j12-p-4"></p><ul><li>L’agent choisit la classe, la phase choisit le moment.</li><li>Nirmatrelvir-ritonavir 300/100 mg deux fois par jour cinq jours, adapté au rein ; ritonavir et voriconazole imposent la revue des comédications.</li><li>Ganciclovir 5 mg/kg deux fois par jour, sous contrôle de l’hémogramme et de la clairance.</li><li>Pas de dexaméthasone sans oxygène, pas de corticoïde dans la grippe, pas de letermovir curatif.</li></ul></template>
