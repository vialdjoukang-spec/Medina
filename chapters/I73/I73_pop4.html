
<!-- ===== FENÊTRES I73 : Pareto ===== -->
<template data-pop="pareto-i73-def" data-title="Pareto — Définitions, classification, épidémiologie">
<p class="ratio" data-cover="i73-1,i73-2"></p>
<ul><li>Phénomène de Raynaud : ischémie digitale transitoire au froid ou à l’émotion ; au moins blanc puis bleu, limite nette ; diagnostic clinique, photographie utile.</li><li>Primaire : jeune, symétrique, sans lésion, capillaroscopie normale, anticorps antinucléaires négatifs ou bas (1:40). Secondaire : début tardif, asymétrie, ulcères, capillaroscopie ou anticorps anormaux.</li><li>CIM-10-GM 2024 : I73.0 Raynaud (primaire et secondaire) ; I73.1 Buerger ; I73.8 acrocyanose, érythrocyanose, érythromélalgie, acroparesthésies ; I73.9 sans précision. Athérosclérose : I70.</li><li>Prévalence de la forme primaire ≈ 4,85 % ; aucune donnée suisse.</li><li>Évolution vers une sclérodermie : 12,6 % en centre ; capillaroscopie anormale + anticorps spécifique = risque × 60.</li><li>Buerger : âge médian 38,5 ans ; amputation 21,4 % à 5,7 ans ; survie sans amputation 66 % à 15 ans. Érythromélalgie : 1,3 pour 100 000 par an.</li></ul></template>

<template data-pop="pareto-i73-physio" data-title="Pareto — Physiopathologie et causes">
<p class="ratio" data-cover="i73-3,i73-4"></p>
<ul><li>Froid → sympathique → récepteurs α2C migrés en surface → spasme des artères digitales.</li><li>Primaire : spasme excessif sur artère saine, réversible. Secondaire : endothélium lésé (moins de monoxyde d’azote et de prostacycline, plus d’endothéline 1), intima épaissie, capillaires perdus → ulcères.</li><li>Résistance ∝ 1/rayon⁴ : rayon divisé par 2 → résistance × 16.</li><li>Causes secondaires : connectivites, artères obstruées, vibrations et marteau hypothénarien, médicaments et toxiques, cryoglobulines et agglutinines froides, hypothyroïdie et cancer.</li><li>Atteinte unilatérale = cause locale.</li><li>Bêtabloquant indispensable : pas d’arrêt systématique (7 % contre 4,6 % de vasoconstriction).</li></ul></template>

<template data-pop="pareto-i73-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i73-5,i73-6"></p>
<ul><li>Question de dépistage, couleurs, limite, symétrie, durée, déclencheurs.</li><li>Expositions : tabac, cannabis, outils vibrants, frappe de la paume, médicaments vasoconstricteurs.</li><li>Signes de connectivite : dysphagie, reflux, essoufflement, sécheresse, arthrite, éruption, faiblesse.</li><li>Douleur permanente d’un doigt = ischémie critique.</li><li>Examen : pression aux deux bras (différence &gt; 15 mmHg), pouls, test d’Allen, ulcères et cicatrices pulpaires, repli de l’ongle au dermatoscope, doigts boudinés, sclérodactylie, télangiectasies, calcinose.</li><li>Examen normal ≠ forme primaire.</li></ul></template>

<template data-pop="pareto-i73-diag" data-title="Pareto — Diagnostic, urgences et traitement du phénomène de Raynaud">
<p class="ratio" data-cover="i73-7,i73-8,i73-9"></p>
<ul><li>Ordre : doigt menacé ? → primaire ou secondaire (capillaroscopie + anticorps antinucléaires) → cause.</li><li>Différentiels par gravité : embolie, vascularite et cryoglobulinémie, Buerger, érythromélalgie (chaleur, inverse du Raynaud), acrocyanose (permanente), engelures.</li><li>Ischémie critique : hospitalisation, réchauffement, antalgie, iloprost, recherche de source embolique ; anticoagulation au cas par cas.</li><li>Hypertension brutale chez un sclérodermique : crise rénale → inhibiteur de l’enzyme de conversion.</li><li>Tous : protection de tout le corps, arrêt du tabac, éviter les vasoconstricteurs.</li><li>EULAR 2023 : nifédipine → inhibiteur de la phosphodiestérase de type 5 → iloprost intraveineux ; ulcères : inhibiteur de la phosphodiestérase de type 5 et/ou iloprost ; bosentan contre les nouveaux ulcères.</li><li>Effet modeste : ≈ 2,9 crises de moins par semaine (Cochrane 2017).</li></ul></template>

<template data-pop="pareto-i73-autres" data-title="Pareto — Buerger, érythromélalgie, acrosyndromes et suivi">
<p class="ratio" data-cover="i73-10,i73-11,i73-12,i73-13,i73-14"></p>
<ul><li>Buerger : fumeur &lt; 45 ans, ischémie distale des quatre membres, claudication plantaire, thrombophlébites migratrices, artères proximales saines, collatérales en tire-bouchon ; thrombus inflammatoire, limitante élastique interne intacte.</li><li>Critères d’Olin ; arrêt total du tabac ; iloprost (85 % contre 17 %) ; infection du membre = risque d’amputation × 12.</li><li>Érythromélalgie : brûlure, rougeur, chaleur à la chaleur, soulagées par le froid ; SCN9A (Nav1.7) ; néoplasie myéloproliférative → JAK2, aspirine ; nifédipine peut la déclencher ; pas d’eau glacée prolongée.</li><li>Acrocyanose : bleue, permanente, indolore, pouls normaux ; secondaire si tardive ou asymétrique.</li><li>I73.9 : seulement sans cause ; index ≤ 0,90 → I70.</li><li>Suivi : réévaluer si signe nouveau ; capillaroscopie ou anticorps anormaux → suivi rapproché.</li><li>Grossesse : bosentan contre-indiqué. Après 60 ans : jamais primaire. Vibrations : maladie professionnelle.</li></ul></template>

<template data-pop="pareto-i73-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i73-e-1,i73-e-2,i73-e-3,i73-e-4,i73-e-5"></p>
<ul><li>Capillaroscopie : examen de référence de la microangiopathie ; normal ≥ 7 anses par mm ; sclérodermique = capillaires géants (≥ 50 µm) et/ou perte, avec formes anormales.</li><li>Anticorps antinucléaires sur HEp-2 (titre, aspect) puis spécifiques : anticentromère (forme limitée, hypertension pulmonaire), anti-topo-isomérase I (pneumopathie), anti-ARN polymérase III (crise rénale, cancer).</li><li>Explorations artérielles si asymétrie, pouls absent, ulcère, tabac : écho-Doppler, index (normal 1,00–1,40), angio-TDM ou angio-IRM, artériographie.</li><li>Cryoglobulines à 37 °C ; hémogramme et JAK2 dans l’érythromélalgie.</li><li>Test au froid : non systématique.</li></ul></template>

<template data-pop="pareto-i73-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i73-sa,i73-sh,i73-sp,i73-si,i73-sg"></p>
<ul><li>Main : artères radiale et ulnaire, arcades superficielle (ulnaire) et profonde (radiale), deux artères digitales par doigt ; artère ulnaire exposée sur l’hamatum.</li><li>Primaire : aucune lésion ; sclérodermie : intima et capillaires ; Buerger : thrombus inflammatoire, paroi conservée.</li><li>Balance du tonus : noradrénaline, endothéline, sérotonine contre monoxyde d’azote, prostacycline.</li><li>Poiseuille : rayon ÷ 2 → résistance × 16.</li><li>Cryoglobulines : type I obstructif, types II et III vascularite, hépatite C.</li><li>SCN9A : gain de fonction → érythromélalgie ; perte → insensibilité à la douleur.</li></ul></template>

<template data-pop="pareto-i73-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i73-p-1,i73-p-2,i73-p-3,i73-p-4,i73-p-5"></p>
<ul><li>Nifédipine à libération prolongée : 30 mg par jour, titration, maximum 120 mg par jour (information professionnelle étrangère) ; hors indication ; céphalées, œdèmes.</li><li>Sildénafil : 20 mg trois fois par jour (dose de l’hypertension pulmonaire) ; jamais avec un nitré.</li><li>Iloprost intraveineux : 0,5 à 2,0 ng/kg/min, 6 heures par jour.</li><li>Bosentan : 62,5 mg deux fois par jour 4 semaines, puis 125 mg deux fois par jour ; transaminases, contraception, pas avec ciclosporine ni glibenclamide, grossesse contre-indiquée.</li><li>Aspirine 100 mg : érythromélalgie des néoplasies myéloprolifératives.</li><li>Éviter : vasoconstricteurs, tabac ; nifédipine et vérapamil dans l’érythromélalgie.</li></ul></template>
