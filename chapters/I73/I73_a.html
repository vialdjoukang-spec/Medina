<section class="ilot" id="i73-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une étudiante de 19 ans décrit des doigts qui deviennent subitement blancs, comme exsangues, lorsqu’elle sort ses mains du gant au ski ; la crise dure une vingtaine de minutes et se termine par une rougeur douloureuse. Or, sa mère présente les mêmes symptômes. À l’inverse, quelques semaines plus tard, une femme de 41 ans consulte pour un tableau semblable apparu cet hiver, mais elle signale aussi des doigts gonflés le matin, un reflux gastro-œsophagien et une petite plaie de la pulpe de l’index. Dès lors, la question qui structure ce cours est la suivante : <b>comment reconnaître un phénomène de Raynaud par l’interrogatoire, et comment distinguer, dès le cabinet, la <button class="w" data-k="i73-prim">forme primaire (caractères ESVM)</button> bénigne de la <button class="w" data-k="i73-sec">forme secondaire (signes d’alerte)</button> qui annonce une connectivite ?</b></p>
<p>Pour répondre à cette question, le cours suit le plan monographique. Ainsi, à la fin de ce cours, le médecin assistant sait poser le diagnostic sur une pâleur digitale bien délimitée provoquée par le froid, rechercher les arguments d’une forme secondaire, prescrire le bilan minimal recommandé (formule sanguine, vitesse de sédimentation ou protéine C réactive, anticorps antinucléaires, capillaroscopie), conduire les mesures générales puis le traitement par inhibiteur calcique, et adresser au spécialiste au bon moment. Il reconnaît en outre une thromboangéite oblitérante chez le fumeur jeune et distingue le phénomène de Raynaud de l’<button class="w" data-k="i73-acro">acrocyanose (définition)</button>, de l’<button class="w" data-k="i73-erythro">érythromélalgie (définition)</button>, des engelures et de l’<button class="w" data-k="i73-achenbach">hématome digital paroxystique (définition)</button>.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i73-vasospasme">vasoconstriction digitale (mécanisme du vasospasme)</button> et la <button class="w" data-k="i73-capillaro">capillaroscopie péri-unguéale (technique et lecture)</button>.</div>
</section>
<section class="ilot" id="i73-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>Avant toute démarche, il faut définir précisément le phénomène observé. Le <b>phénomène de Raynaud</b> désigne en effet des crises transitoires et réversibles de vasospasme des artères digitales, déclenchées par le froid ou l’émotion, qui produisent une <b>pâleur</b> bien délimitée des doigts. La pâleur est donc la condition du diagnostic ; la cyanose puis la rougeur qui la suivent souvent n’en sont pas des conditions nécessaires (ESVM 2017, recommandation 1). Sur le plan historique, par ailleurs, Maurice Raynaud décrivit le phénomène en 1862 dans sa thèse « De l’asphyxie locale et de la gangrène symétrique des extrémités ».</p>
<p>Cette définition posée, la terminologie doit être fixée. Ainsi, l’ESVM 2017 recommande de ne retenir que deux termes : <b>phénomène de Raynaud primaire</b>, sans affection associée, et <b>phénomène de Raynaud secondaire</b>, associé à une affection causale. En revanche, les anciens termes « maladie de Raynaud » et « syndrome de Raynaud » sont abandonnés (recommandation 2, grade IIa, niveau C). La raison en est clinique : le mot « maladie » médicalise une forme bénigne qui ne conduit ni à la perte tissulaire ni à la progression, alors que la forme secondaire tire son pronostic de l’affection sous-jacente et non du vasospasme lui-même.</p>
<p>Au-delà de ses deux formes, le phénomène de Raynaud s’inscrit dans un ensemble plus large. Il appartient en effet aux <b>acrosyndromes vasculaires</b>, ensemble des troubles, primaires ou secondaires, vasospastiques ou occlusifs, de la microcirculation cutanée des extrémités. C’est pourquoi le tableau situe chaque entité du chapitre par son mécanisme dominant.</p>
<table class="t"><tr><th>Entité</th><th>Mécanisme dominant</th><th>Signe qui l’identifie</th></tr>
<tr><td><b>Phénomène de Raynaud</b></td><td>Vasospasme paroxystique</td><td>Pâleur digitale bien délimitée, déclenchée par le froid</td></tr>
<tr><td><b>Thromboangéite oblitérante</b> (maladie de Buerger)</td><td>Occlusion segmentaire inflammatoire des artères distales</td><td>Fumeur, ischémie distale, nécrose acrale</td></tr>
<tr><td>Acrocyanose</td><td>Vasoconstriction permanente</td><td>Cyanose indolore, permanente, sans crise ni démarcation</td></tr>
<tr><td>Érythromélalgie</td><td>Vasodilatation paroxystique</td><td>Brûlure et rougeur aggravées par la chaleur, soulagées par le froid</td></tr>
<tr><td>Livedo</td><td>Désoxygénation du plexus veineux superficiel</td><td>Réseau rouge-violacé de la peau</td></tr></table>
<p>Ce tableau se lit donc par l’opposition du froid et du chaud : le froid déclenche le Raynaud et aggrave l’acrocyanose, alors que la chaleur déclenche l’érythromélalgie. Cependant, la thromboangéite se distingue des trois autres par son caractère occlusif : elle laisse une ischémie permanente et des lésions tissulaires.</p>
</section>
<section class="ilot" id="i73-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Ces entités définies, il faut en mesurer la fréquence. Or, le phénomène de Raynaud est fréquent : sa prévalence varie de 3 à 21 % selon le climat (ESVM 2017). De plus, la forme primaire est <b>neuf fois plus fréquente chez la femme</b> ; sa prévalence globale avoisine 10 % et peut atteindre 20 à 30 % chez les jeunes femmes. Elle débute en outre typiquement entre 10 et 30 ans, souvent sur un terrain familial, et représente la grande majorité des patients vus au cabinet. En revanche, aucune donnée suisse spécifique n’est publiée ; les estimations européennes de l’ESVM tiennent lieu de référence.</p>
<p>Toutefois, la répartition change avec le lieu de consultation : plus de la moitié des patients adressés en milieu spécialisé ont une maladie systémique sous-jacente. Ainsi, le phénomène de Raynaud touche <b>90 % des patients atteints de sclérodermie systémique</b>, 85 % des connectivites mixtes, 10 à 45 % des lupus érythémateux systémiques, 33 % des syndromes de Sjögren et 20 % des dermatomyosites ou polymyosites. En outre, après 60 ans, la cause la plus fréquente est l’<b>athérosclérose</b> : 60 % des phénomènes de Raynaud de cette tranche d’âge lui sont attribués.</p>
<p>Cette répartition commande le pronostic. En effet, le pronostic de la forme primaire est excellent : ni perte tissulaire ni progression dans les circonstances habituelles. À l’inverse, la forme secondaire peut précéder de <b>jusqu’à deux décennies</b> l’affection causale ; c’est pourquoi un premier épisode au cours des troisième à cinquième décennies expose à un risque élevé de connectivite (ESVM 2017) et justifie une surveillance.</p>
</section>
<section class="ilot" id="i73-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Pour comprendre ces formes, il faut décrire la crise elle-même. Celle-ci suit une chaîne en trois temps, que l’ESVM décrit ainsi. D’abord, un <button class="w" data-k="i73-vasospasme">vasospasme des artères digitales (mécanisme)</button> interrompt le flux : la peau pâlit, avec une limite nette, et le doigt s’engourdit. Ensuite, le sang veineux immobilisé dans les capillaires se désoxygène : la peau devient <b>cyanotique</b>. Enfin, à la levée du spasme, l’afflux sanguin dépasse transitoirement les besoins (<button class="w" data-k="i73-hyperhemie">hyperhémie réactive (définition)</button>) : la peau rougit et devient douloureuse, avec des paresthésies au réchauffement.</p>
<p>Toutefois, cette séquence triphasique classique est inconstante : elle n’est observée que chez environ un tiers des patients atteints de forme primaire et deux tiers des patients atteints de sclérodermie systémique. Une pâleur isolée suffit donc au diagnostic.</p>
<figure><img src="images/cardiologie/i73_raynaud_phases.gif" alt="Animation schématique des trois phases de la crise de Raynaud : pâleur, cyanose, rougeur" width="560" height="370" loading="lazy" decoding="async" style="max-width:100%;height:auto">
<figcaption>Figure 1 — Séquence d’une crise : pâleur obligatoire, cyanose et rougeur inconstantes ; le pouce est souvent épargné dans la forme primaire. Schéma animé original de l’atlas, établi d’après l’ESVM 2017.</figcaption></figure>
<p>Le mécanisme de fond diffère cependant selon la forme. Dans la <b>forme primaire</b>, l’ESVM décrit une exagération de la réponse vasculaire normale à la température : les mêmes patients présentent souvent des réponses vasodilatatrices excessives à la chaleur, à l’alcool ou aux mets épicés, et d’autres manifestations vasospastiques (migraine, côlon irritable, douleur thoracique microvasculaire). Dans la <b>forme secondaire</b>, en revanche, l’atteinte structurelle de la microcirculation, visible en capillaroscopie, s’ajoute au spasme : la perfusion de base est déjà réduite, ce qui explique les ulcères digitaux. Enfin, les médiateurs moléculaires du vasospasme ne sont pas détaillés par l’ESVM ; ce cours ne les développe donc pas (lacune nommée).</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> La forme primaire est un trouble <b>fonctionnel</b> : entre les crises, le doigt est normal et ne s’ulcère pas. Toute lésion trophique signale une atteinte <b>structurelle</b> et impose la recherche d’une cause.</div>
</section>
<section class="ilot" id="i73-4"><h2><span class="n">4</span>Étiologies et facteurs aggravants</h2>
<p>La physiopathologie conduit naturellement aux causes. Ainsi, l’ESVM sépare trois groupes qu’il ne faut pas confondre (recommandation 3, grade IIb, niveau C) : les <b>affections réellement associées</b>, liées étiologiquement au phénomène ; les <b>facteurs qui l’aggravent</b> ou le révèlent ; et les <b>affections qui ne provoquent pas de vasospasme mais une nécrose digitale</b> par occlusion des petits vaisseaux.</p>
<table class="t"><tr><th>Groupe</th><th>Exemples (ESVM 2017, tableaux I à III)</th></tr>
<tr><td><b>Connectivites</b></td><td>Sclérodermie systémique, lupus érythémateux systémique, connectivite mixte, syndrome de Sjögren, dermatomyosite et polymyosite, cirrhose biliaire primitive (souvent avec sclérodermie)</td></tr>
<tr><td><b>Causes professionnelles</b></td><td><button class="w" data-k="i73-vibrations">Syndrome des vibrations main-bras (exposition et conduite)</button>, syndrome du marteau hypothénar, chlorure de vinyle monomère, silice et solvants</td></tr>
<tr><td><b>Médicaments et toxiques</b></td><td>Dérivés de l’ergot, bêtabloquants non sélectifs y compris en collyre, certains cytotoxiques, ciclosporine, bromocriptine, interférons alpha et bêta, cocaïne, amphétamines, cannabis, œstrogènes sans progestatif, éphédrine des préparations nasales</td></tr>
<tr><td><b>Causes endocriniennes et autres</b></td><td>Hypothyroïdie, phéochromocytome, syndrome paranéoplasique, thromboangéite oblitérante, indice de masse corporelle bas, chirurgie bariatrique, syndrome douloureux régional complexe, séquelles de gelure ou de traumatisme digital</td></tr>
<tr><td><b>Facteurs aggravants</b></td><td>Syndrome du défilé thoracobrachial, syndrome du canal carpien, athérosclérose, tabagisme</td></tr>
<tr><td><b>Occlusions qui imitent le Raynaud</b></td><td>Embolie (par exemple depuis un défilé thoracobrachial), hémopathies malignes, cryoglobulinémie, cryofibrinogénémie, maladie des agglutinines froides, hyperviscosité, vascularite liée à une hépatite</td></tr></table>
<p>Ce tableau rappelle en outre qu’une cause trouvée n’achève pas l’enquête : un phénomène de Raynaud multifactoriel n’est pas rare. Par exemple, une patiente hypothyroïdienne avec un canal carpien peut aussi avoir une sclérodermie limitée débutante. Par ailleurs, les <b>bêtabloquants</b> sont les médicaments en cause les plus souvent prescrits ; les bêtabloquants vasodilatateurs de nouvelle génération semblent mieux tolérés. En revanche, le lien avec la contraception orale n’a jamais été démontré.</p>
<div class="trap"><span class="k">Piège</span>Un phénomène de Raynaud <b>asymétrique</b> ou limité à un territoire nerveux oriente vers une cause locale : territoire du nerf médian dans le canal carpien, territoire de la huitième racine cervicale et de la première racine thoracique dans le défilé thoracobrachial. Il impose la mesure de la pression artérielle aux deux bras.</div>
</section>
<section class="ilot" id="i73-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Une fois les causes connues, l’enquête clinique commence par l’anamnèse. En effet, l’interrogatoire fait le diagnostic lorsqu’il établit une <b>pâleur bien délimitée</b> des doigts, avec ou sans cyanose et rougeur (ESVM 2017). Pour cela, le médecin précise l’âge de début, la fréquence des crises, l’engourdissement, les paresthésies au réchauffement et la douleur. Comme les crises cessent souvent dans la salle d’attente chauffée, il demande au patient de <b>photographier ses doigts pendant une crise</b>.</p>
<p>De plus, la crise typique a des caractères précis. Ainsi, la décoloration débute à la pointe du doigt et s’étend à une, deux ou trois phalanges, ou à plusieurs doigts. De plus, sa limite est nette et <b>circonférentielle</b>, palmaire et dorsale. En outre, un engourdissement transitoire l’accompagne presque toujours. Enfin, le spasme peut toucher le nez, les oreilles, la langue ou les mamelons.</p>
<div class="two"><div class="card"><b>Arguments d’une forme primaire</b><br>Début entre 10 et 30 ans ; antécédents familiaux ; atteinte symétrique des deux mains, pouce souvent épargné ; migraine, côlon irritable ou autres manifestations vasospastiques ; aucune lésion trophique ; examen normal entre les crises.</div>
<div class="card"><b>Arguments d’une forme secondaire</b><br>Premier épisode au cours des troisième à cinquième décennies ; atteinte asymétrique ; ulcère ou cicatrice pulpaire ; photosensibilité, aphtes, sécheresse oculaire ou buccale, peau qui se tend, doigts boudinés ; médicament inducteur ; exposition aux vibrations ; début chez l’enfant de moins de 12 ans.</div></div>
<p>Au-delà de la crise, l’anamnèse médicamenteuse et professionnelle est systématique. Par ailleurs, une <b>apparition rapide d’une sclérose cutanée</b> en même temps que le phénomène de Raynaud évoque une sclérodermie cutanée diffuse ; à l’inverse, dans la forme cutanée limitée, le phénomène précède souvent le diagnostic de plusieurs années.</p>
</section>
