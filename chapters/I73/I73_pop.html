<template data-pop="i73-vasospasme" data-title="Vasospasme digital"><p>Le vasospasme est une contraction transitoire et excessive de la paroi musculaire des artères digitales, qui réduit ou interrompt le flux sanguin. Il est réversible : à sa levée, le flux revient et la couleur se normalise. Dans la forme primaire du phénomène de Raynaud, l’ESVM le décrit comme une exagération de la réponse vasculaire normale au froid ; dans la forme secondaire, il survient sur une microcirculation déjà lésée. Le vasospasme peut être systémique et toucher le nez, les oreilles, la langue ou les mamelons.</p></template>
<template data-pop="i73-hyperhemie" data-title="Hyperhémie réactive"><p>L’hyperhémie réactive est l’augmentation transitoire du débit sanguin qui suit une période d’ischémie. Après le spasme, les tissus reçoivent plus de sang que d’habitude : la peau rougit, se réchauffe et devient douloureuse, avec des paresthésies. C’est la troisième phase, inconstante, de la crise de Raynaud.</p></template>
<template data-pop="i73-capillaro" data-title="Capillaroscopie péri-unguéale"><p>Examen microscopique non invasif des capillaires du repli de peau situé à la base de l’ongle. Il montre la forme et la densité des anses capillaires. Des anomalies capillaires sont de forts prédicteurs de connectivite chez un patient atteint de phénomène de Raynaud (ESVM 2017, recommandation 7, grade IIa, niveau B). L’examen exige un matériel de bonne qualité optique et un opérateur expérimenté ; un dermatoscope à faible grossissement peut méconnaître des anomalies précoces.</p><figure><img src="images/cardiologie/i73_capillaroscopie_figure.gif" alt="Figure publiée de capillaroscopie : anses capillaires péri-unguéales normales, puis anses dilatées avec zones avasculaires" width="461" height="388" loading="lazy" decoding="async">
<figcaption>Même image que la figure 4 du cours — Capillaroscopie péri-unguéale : (A) anses capillaires normales, régulières et parallèles ; (B) anses dilatées et raréfaction des capillaires avec zone avasculaire (« drop out »), aspect des formes secondaires, en particulier de la sclérodermie systémique. Figure publiée par Asghar M. S. et al., « Nailfold changes as a sign of underlying systemic illnesses », Fortune Journals, Wikimedia Commons, licence Creative Commons Attribution – Partage dans les mêmes conditions 4.0 ; convertie pour l’atlas, dérivé sous la même licence.</figcaption></figure><p>Cette image montre pourquoi la capillaroscopie sépare les deux formes : dans la forme primaire, le spasme est purement fonctionnel et les anses restent régulières ; dans la sclérodermie, en revanche, la microangiopathie détruit des capillaires, d’où les zones avasculaires et les anses géantes. C’est pourquoi des anomalies capillaires prédisent l’évolution vers une connectivite.</p></template>
<template data-pop="i73-allen" data-title="Manœuvre d’Allen"><p>Le patient lève la main et serre le poing pendant environ 30 secondes. Le médecin comprime l’artère radiale et l’artère ulnaire au poignet, puis le patient ouvre la main, qui est pâle. Le médecin libère une seule artère : si la couleur revient rapidement, la circulation est jugée normale ; si la pâleur persiste, l’artère libérée est en partie occluse. On répète ensuite pour l’autre artère. L’ESVM 2017 la considère comme obligatoire pour dépister une atteinte artérielle distale du membre supérieur.</p></template>
<template data-pop="i73-vibrations" data-title="Syndrome des vibrations main-bras"><p>Anciennement appelé « doigt blanc des vibrations », c’est la forme la plus fréquente de phénomène de Raynaud professionnel. Sa prévalence atteint 50 % chez les travailleurs utilisant de façon prolongée des outils vibrants (ESVM 2017). Un diagnostic précoce et l’arrêt de l’exposition peuvent faire régresser le trouble. Le patient est adressé à un médecin vasculaire expérimenté ou à un médecin du travail. Le syndrome du marteau hypothénar, lésion de l’artère ulnaire par des chocs répétés du talon de la main, en est un diagnostic voisin.</p></template>
<template data-pop="i73-d-nifedipine" data-title="Nifédipine à libération prolongée"><p><b>Mécanisme.</b> Inhibiteur calcique de la famille des dihydropyridines : il bloque l’entrée du calcium dans les cellules musculaires lisses vasculaires et provoque une vasodilatation artérielle.</p><p><b>Preuves.</b> Une méta-analyse d’essais randomisés montre une baisse du nombre et de la sévérité des crises ; la revue Cochrane de 2016 (7 essais, 296 patients atteints de forme primaire) chiffre l’effet à 1,72 crise de moins par semaine (intervalle de confiance à 95 % : 0,60 à 2,84), avec des essais petits et de qualité variable (cités par l’ESVM 2017).</p><p><b>Posologie.</b> L’ESVM recommande 10 à 20 mg deux ou trois fois par jour en forme retard, avec une introduction progressive pour limiter les céphalées et les œdèmes. L’information suisse de Nifedipin-Mepha 20 retard prévoit 20 mg deux fois par jour dans l’hypertension et l’angor, et jusqu’à 40 mg deux fois par jour. L’intervalle entre deux prises est de 12 heures et ne doit jamais être inférieur à 4 heures. Le patient ne mâche ni ne fractionne les comprimés, car il détruirait la libération prolongée, et il évite le jus de pamplemousse, qui inhibe le CYP3A4 et augmente les concentrations.</p><p><b>Effets indésirables.</b> Effets vasodilatateurs, plus marqués avec les formes rapides ; ils s’atténuent souvent en quelques semaines.</p><p><b>Contre-indications.</b> La nifédipine est contre-indiquée en cas de choc cardiovasculaire, d’angor instable, d’infarctus de moins de 4 semaines, pendant les 20 premières semaines de grossesse et l’allaitement, et en association à la rifampicine. En effet, la vasodilatation et la tachycardie réflexe aggravent l’ischémie d’un myocarde instable, et la rifampicine effondre ses concentrations par induction du CYP3A4.</p><p><b>Statut suisse.</b> L’indication autorisée en Suisse se limite à l’angor stable et à l’hypertension. Le Raynaud est donc un usage hors étiquette, dont le médecin informe le patient.</p></template>
<template data-pop="i73-d-iloprost" data-title="Iloprost intraveineux"><p><b>Mécanisme.</b> L’iloprost est un analogue stable de la prostacycline ; il dilate les artérioles et inhibe l’agrégation plaquettaire de façon puissante (ESVM 2017), ce qui rouvre la microcirculation digitale.</p><p><b>Preuves.</b> Une méta-analyse et des essais randomisés montrent un bénéfice de l’iloprost intraveineux ; comparés à la nifédipine, les prostanoïdes sont aussi efficaces sur les symptômes et meilleurs pour la cicatrisation des ulcères (ESVM 2017). Les prostanoïdes oraux sont inefficaces dans leur forme actuelle.</p><p><b>Indications suisses.</b> Thromboangéite oblitérante à un stade avancé avec troubles circulatoires sévères, lorsqu’une revascularisation n’est pas indiquée ; rarement, Raynaud secondaire avancé réfractaire.</p><p><b>Posologie.</b> L’iloprost se perfuse 6 heures par jour, à 0,5 à 2,0 ng/kg/min selon la tolérance établie les 2 à 3 premiers jours, en général pendant 4 semaines. Il s’administre exclusivement en milieu hospitalier ou en cabinet équipé, car l’hypotension impose une surveillance.</p><p><b>Effets indésirables.</b> L’iloprost provoque des céphalées, des nausées et une hypotension, parfois orthostatique au lever ; ces effets découlent directement de la vasodilatation.</p><p><b>Contre-indications.</b> L’iloprost est contre-indiqué en cas de risque hémorragique accru, de coronaropathie sévère ou d’angor instable, d’infarctus de moins de six mois, d’insuffisance cardiaque de classe II à IV, d’arythmie de pronostic grave, de congestion pulmonaire et de grossesse. En effet, l’effet antiagrégant favorise le saignement, et l’hypotension peut décompenser un cœur fragile.</p><p><b>Surveillance.</b> Le soignant mesure la pression artérielle et la fréquence cardiaque au début et après chaque augmentation de dose. De plus, une amputation impérative ne doit pas être retardée au profit d’un essai d’iloprost.</p></template>
<template data-pop="i73-prim" data-title="Phénomène de Raynaud primaire"><p><b>Définition (ESVM 2017).</b> Phénomène de Raynaud sans affection associée ; les termes « maladie de Raynaud » et « syndrome de Raynaud » sont à abandonner.</p><p><b>Caractères.</b> Le vasospasme est symétrique et touche en général les deux mains ; le froid, l’émotion ou le port d’objets le déclenchent, et le pouce est souvent épargné. Il débute plus tôt que la forme secondaire et ne laisse <b>aucun trouble trophique</b>, parce que la microcirculation reste structurellement normale.</p><p><b>Épidémiologie.</b> La forme primaire est neuf fois plus fréquente chez la femme, et la prévalence globale du phénomène atteint 10 %.</p><p><b>Pronostic.</b> Le pronostic est bénin : dans les circonstances habituelles, la forme primaire ne cause ni perte tissulaire ni progression.</p><figure><img src="images/cardiologie/i73_raynaud_phases_photo.gif" alt="Trois photographies des doigts d’un même patient pendant une crise de Raynaud : doigts blancs à limite nette, puis extrémités cyanosées" width="720" height="311" loading="lazy" decoding="async">
<figcaption>Même image que la figure 1 du cours — Crise de Raynaud chez un homme de 25 ans atteint de lupus systémique, donc de forme secondaire : pâleur des doigts à limite nette et circonférentielle (à gauche), puis cyanose distale des doigts (au centre et à droite). Photographies réelles : Tcal, Wikimedia Commons, « Raynaud phenomenon.jpg », licence Creative Commons Attribution – Partage dans les mêmes conditions 3.0 ; redimensionnées et converties pour l’atlas, dérivé diffusé sous la même licence.</figcaption></figure><p>Cette crise appartient à une forme secondaire, mais elle illustre les deux premières phases communes à toutes les formes. La pâleur à limite nette traduit l’arrêt du flux dans les artères digitales spasmées ; ensuite, le sang immobilisé se désoxygène, d’où la cyanose. Dans la forme primaire, la crise est identique, mais aucun ulcère ni aucune cicatrice ne l’accompagne.</p></template>
<template data-pop="i73-sec" data-title="Phénomène de Raynaud secondaire"><p><b>Définition (ESVM 2017).</b> Phénomène de Raynaud associé à une affection, dont il prend le pronostic.</p><p><b>Signes d’alerte.</b> Un début tardif, une atteinte asymétrique et des troubles trophiques font suspecter une forme secondaire. Ces troubles sont l’ulcère digital, les cicatrices pulpaires déprimées, la sclérodactylie et les télangiectasies ; ils traduisent une atteinte structurelle des vaisseaux.</p><p><b>Causes principales.</b> Connectivites, en tête la sclérodermie systémique (90 % des patients ont un phénomène de Raynaud), maladie occlusive artérielle, vibrations, médicaments.</p><p><b>Délai.</b> Le phénomène peut précéder la maladie systémique de jusqu’à deux décennies.</p></template>
<template data-pop="i73-acro" data-title="Acrocyanose primaire"><p><b>Définition (ESVM 2017).</b> L’acrocyanose primaire est une affection bénigne qui associe une cyanose distale, symétrique et <b>indolore</b> des membres supérieurs ou des quatre extrémités, une froideur et parfois une hyperhidrose palmaire ou palmo-plantaire. Elle est liée à une hyperactivité sympathique, qui ralentit en permanence le flux capillaire.</p><p><b>Terrain.</b> Elle touche surtout la jeune femme à faible indice de masse corporelle, souvent anorexique, dont la thermorégulation favorise la vasoconstriction cutanée.</p><p><b>Différence avec le Raynaud.</b> La cyanose est permanente, sans crise ni pâleur bien délimitée, et le froid l’aggrave ; elle n’a donc pas les trois phases du Raynaud.</p></template>
<template data-pop="i73-erythro" data-title="Érythromélalgie"><p><b>Définition.</b> Acrosyndrome vasculaire caractérisé par des extrémités rouges, chaudes et douloureuses, avec sensation de brûlure, déclenché par la chaleur et soulagé par le froid ; il figure parmi les acrosyndromes de l’ESVM 2017.</p><p><b>Différence avec le Raynaud.</b> Le déclencheur est inverse : la chaleur, et non le froid.</p></template>
<template data-pop="i73-achenbach" data-title="Hématome digital paroxystique"><p><b>Synonymes (ESVM 2017).</b> Cette affection s’appelle aussi syndrome d’Achenbach, apoplexie veineuse digitale ou hématome digital spontané.</p><p><b>Clinique.</b> Douleur aiguë brutale d’un doigt, rarement de la paume ou d’un orteil, spontanée ou après un traumatisme mineur ; une tension douloureuse persiste des heures, puis une ecchymose apparaît. Les deuxième, troisième et quatrième doigts sont les plus touchés.</p><p><b>Évolution.</b> L’hématome régresse spontanément en quelques jours, et une thrombose veineuse digitale est très rare ; aucun traitement n’est donc nécessaire.</p><p><b>Mécanisme et terrain.</b> Une veinule se contracte brutalement puis se rompt, ce qui produit l’ecchymose. Elle touche surtout la femme de 40 à 60 ans, souvent porteuse d’un autre acrosyndrome primaire.</p></template>
<template data-pop="i73-sclero" data-title="Sclérodactylie"><p><b>Définition.</b> Épaississement et induration de la peau des doigts : d’abord doigts boudinés, puis peau tendue.</p><p><b>Valeur (ESVM 2017).</b> Avec les cicatrices pulpaires déprimées, elle est associée au développement ultérieur d’autres signes de connectivite et peut contribuer aux critères de classification ACR-EULAR 2013 de la sclérodermie systémique.</p><p><b>Conduite.</b> Une sclérodactylie fait considérer la forme comme secondaire jusqu’à preuve du contraire ; le médecin demande donc les anticorps, une capillaroscopie et un avis spécialisé.</p></template>
<template data-pop="i73-livedo" data-title="Livedo"><p><b>Définition (ESVM 2017).</b> Coloration de la peau rouge à bleue, marbrée, en réseau, surtout des membres inférieurs, parfois du corps entier.</p><p><b>Formes.</b> Livedo réticulaire à mailles complètes ; livedo racemosa à mailles incomplètes.</p><p><b>Mécanisme.</b> Trouble des artérioles dermo-hypodermiques, qui désoxygène le plexus veineux superficiel.</p><p><b>Causes.</b> Vasospasme au froid (forme idiopathique, bénigne, de la jeune femme, qui disparaît en surélevant ou réchauffant le membre) ; embolie artérielle, hyperviscosité, syndrome de Sneddon, médicaments, vasculite (formes secondaires, qui exigent un bilan complet).</p></template>
<template data-pop="i73-grade" data-title="Gradation des recommandations de l’ESVM"><p><b>Niveaux de preuve (ESVM 2017, d’après l’ESC).</b> Le niveau <b>A</b> repose sur de nombreux essais randomisés ou des méta-analyses. Le niveau <b>B</b> repose sur un essai randomisé ou de grandes études non randomisées. Le niveau <b>C</b> repose sur un consensus d’experts, de petites études, des registres ou des études rétrospectives.</p><p><b>Grades.</b> Le grade <b>I</b> signifie que le traitement ou la procédure est bénéfique et efficace. Le grade <b>II</b> signifie que les preuves sont contradictoires ou que les experts divergent ; dans le grade <b>IIa</b>, le poids des preuves penche en faveur de l’utilité.</p><p>Le grade exprime la force des preuves, et non l’importance clinique de la recommandation.</p></template>
<template data-pop="pareto-i73-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i73-0,i73-1,i73-2,i73-3,i73-4,i73-5,i73-6"></p><ul>
<li>Raynaud = pâleur digitale bien délimitée, transitoire, déclenchée par le froid ou l’émotion ; cyanose et rougeur facultatives.</li>
<li>Le phénomène est primaire, sans cause, ou secondaire, avec une cause associée ; sa prévalence va de 3 à 21 %, et la forme primaire est neuf fois plus fréquente chez la femme.</li>
<li>Sclérodermie systémique : Raynaud chez 90 % ; après 60 ans, 60 % sont athéroscléreux ; le Raynaud peut précéder une connectivite de deux décennies.</li>
<li>Causes : connectivites, vibrations, bêtabloquants et autres médicaments, endocrinopathies, thromboangéite ; une cause trouvée ne clôt pas l’enquête.</li>
<li>Forme secondaire : début plus tardif, asymétrie, ulcère, cicatrice pulpaire, sclérodactylie ; pression aux deux bras, pouls, manœuvre d’Allen.</li></ul></template>
<template data-pop="pareto-i73-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i73-7,i73-8,i73-9"></p><ul>
<li>Bilan pour tous : formule sanguine, vitesse de sédimentation ou protéine C réactive, anticorps antinucléaires ; capillaroscopie si disponible.</li>
<li>Le médecin adresse le patient en cas de forme secondaire suspectée, d’ulcère, de bilan anormal, d’aggravation, chez l’enfant de moins de 12 ans et en cas d’exposition aux vibrations.</li>
<li>Ischémie digitale fixée ou ulcère infecté : avis spécialisé rapide, infection traitée énergiquement.</li>
<li>Le traitement commence par les mesures générales et l’arrêt du tabac, puis ajoute la nifédipine retard à dose progressive, hors étiquette en Suisse ; l’iloprost intraveineux est réservé aux formes secondaires sévères, et la forme primaire ne relève jamais de la chirurgie.</li></ul></template>
<template data-pop="pareto-i73-autres" data-title="Pareto — Thromboangéite, différentiels et suivi"><p class="ratio" data-cover="i73-10,i73-11,i73-12,i73-13"></p><ul>
<li>Thromboangéite oblitérante : nicotine, occlusions segmentaires distales, nécrose acrale ; arrêt complet du tabac ; iloprost autorisé en Suisse au stade avancé.</li>
<li>L’acrocyanose donne une cyanose permanente indolore ; l’érythromélalgie donne une brûlure soulagée par le froid ; les engelures donnent des papules prurigineuses ; l’hématome digital paroxystique donne une ecchymose bénigne.</li>
<li>Nifédipine contre-indiquée les 20 premières semaines de grossesse et pendant l’allaitement ; enfant de moins de 12 ans adressé ; après 60 ans, chercher l’athérosclérose.</li></ul></template>
<template data-pop="pareto-i73-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i73-e-1,i73-e-2,i73-e-3,i73-e-4"></p><ul>
<li>Le diagnostic est clinique, et une photographie prise pendant la crise le confirme.</li>
<li>Capillaroscopie anormale = fort prédicteur de connectivite ; normale n’exclut pas une connectivite future.</li>
<li>Anticentromère : sclérodermie limitée ; anti-topo-isomérase : diffuse ; anti-Ro et anti-La : Sjögren ; anti-ADN double brin : lupus.</li></ul></template>
<template data-pop="pareto-i73-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i73-p-1,i73-p-2"></p><ul>
<li>La nifédipine retard se donne à 10 à 20 mg deux ou trois fois par jour (ESVM), avec une introduction lente ; elle est métabolisée par le CYP3A4, d’où la contre-indication de la rifampicine.</li>
<li>L’iloprost intraveineux se perfuse à 0,5 à 2,0 ng/kg/min, 6 heures par jour, pendant environ 4 semaines, sous surveillance tensionnelle.</li>
<li>Le médecin évite les bêtabloquants non sélectifs, l’ergot et l’éphédrine, car tous favorisent la vasoconstriction.</li></ul></template>
