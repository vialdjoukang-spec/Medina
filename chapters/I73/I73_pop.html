<template data-pop="i73-vasospasme" data-title="Vasospasme digital"><p>Le vasospasme est une contraction transitoire et excessive de la paroi musculaire des artères digitales, qui réduit ou interrompt le flux sanguin. Il est réversible : à sa levée, le flux revient et la couleur se normalise. Dans la forme primaire du phénomène de Raynaud, l’ESVM le décrit comme une exagération de la réponse vasculaire normale au froid ; dans la forme secondaire, il survient sur une microcirculation déjà lésée. Le vasospasme peut être systémique et toucher le nez, les oreilles, la langue ou les mamelons.</p></template>
<template data-pop="i73-hyperhemie" data-title="Hyperhémie réactive"><p>L’hyperhémie réactive est l’augmentation transitoire du débit sanguin qui suit une période d’ischémie. Après le spasme, les tissus reçoivent plus de sang que d’habitude : la peau rougit, se réchauffe et devient douloureuse, avec des paresthésies. C’est la troisième phase, inconstante, de la crise de Raynaud.</p></template>
<template data-pop="i73-capillaro" data-title="Capillaroscopie péri-unguéale"><p>Examen microscopique non invasif des capillaires du repli de peau situé à la base de l’ongle. Il montre la forme et la densité des anses capillaires. Des anomalies capillaires sont de forts prédicteurs de connectivite chez un patient atteint de phénomène de Raynaud (ESVM 2017, recommandation 7, grade IIa, niveau B). L’examen exige un matériel de bonne qualité optique et un opérateur expérimenté ; un dermatoscope à faible grossissement peut méconnaître des anomalies précoces.</p></template>
<template data-pop="i73-allen" data-title="Manœuvre d’Allen"><p>Le patient lève la main et serre le poing pendant environ 30 secondes. Le médecin comprime l’artère radiale et l’artère ulnaire au poignet, puis le patient ouvre la main, qui est pâle. Le médecin libère une seule artère : si la couleur revient rapidement, la circulation est jugée normale ; si la pâleur persiste, l’artère libérée est en partie occluse. On répète ensuite pour l’autre artère. L’ESVM 2017 la considère comme obligatoire pour dépister une atteinte artérielle distale du membre supérieur.</p></template>
<template data-pop="i73-vibrations" data-title="Syndrome des vibrations main-bras"><p>Anciennement appelé « doigt blanc des vibrations », c’est la forme la plus fréquente de phénomène de Raynaud professionnel. Sa prévalence atteint 50 % chez les travailleurs utilisant de façon prolongée des outils vibrants (ESVM 2017). Un diagnostic précoce et l’arrêt de l’exposition peuvent faire régresser le trouble. Le patient est adressé à un médecin vasculaire expérimenté ou à un médecin du travail. Le syndrome du marteau hypothénar, lésion de l’artère ulnaire par des chocs répétés du talon de la main, en est un diagnostic voisin.</p></template>
<template data-pop="i73-d-nifedipine" data-title="Nifédipine à libération prolongée"><p><b>Mécanisme.</b> Inhibiteur calcique de la famille des dihydropyridines : il bloque l’entrée du calcium dans les cellules musculaires lisses vasculaires et provoque une vasodilatation artérielle.</p><p><b>Preuves.</b> Une méta-analyse d’essais randomisés montre une baisse du nombre et de la sévérité des crises ; la revue Cochrane de 2016 (7 essais, 296 patients atteints de forme primaire) chiffre l’effet à 1,72 crise de moins par semaine (intervalle de confiance à 95 % : 0,60 à 2,84), avec des essais petits et de qualité variable (cités par l’ESVM 2017).</p><p><b>Posologie.</b> ESVM : 10 à 20 mg deux ou trois fois par jour en forme retard, introduction progressive. Information suisse (Nifedipin-Mepha 20 retard) : 20 mg deux fois par jour dans l’hypertension et l’angor, jusqu’à 40 mg deux fois par jour ; intervalle de 12 heures, jamais inférieur à 4 heures ; comprimés ni mâchés ni fractionnés ; éviter le jus de pamplemousse.</p><p><b>Effets indésirables.</b> Effets vasodilatateurs, plus marqués avec les formes rapides ; ils s’atténuent souvent en quelques semaines.</p><p><b>Contre-indications.</b> Choc cardiovasculaire, angor instable, infarctus de moins de 4 semaines, 20 premières semaines de grossesse, allaitement, association à la rifampicine.</p><p><b>Statut suisse.</b> Indication autorisée : angor stable et hypertension. Le Raynaud est un usage hors étiquette.</p></template>
<template data-pop="i73-d-iloprost" data-title="Iloprost intraveineux"><p><b>Mécanisme.</b> Analogue stable de la prostacycline, aux propriétés vasodilatatrices et antiagrégantes plaquettaires puissantes (ESVM 2017).</p><p><b>Preuves.</b> Une méta-analyse et des essais randomisés montrent un bénéfice de l’iloprost intraveineux ; comparés à la nifédipine, les prostanoïdes sont aussi efficaces sur les symptômes et meilleurs pour la cicatrisation des ulcères (ESVM 2017). Les prostanoïdes oraux sont inefficaces dans leur forme actuelle.</p><p><b>Indications suisses.</b> Thromboangéite oblitérante à un stade avancé avec troubles circulatoires sévères, lorsqu’une revascularisation n’est pas indiquée ; rarement, Raynaud secondaire avancé réfractaire.</p><p><b>Posologie.</b> Perfusion de 6 heures par jour, 0,5 à 2,0 ng/kg/min selon la tolérance établie les 2 à 3 premiers jours, en général pendant 4 semaines, exclusivement en milieu hospitalier ou en cabinet équipé.</p><p><b>Effets indésirables.</b> Céphalées, nausées, hypotension ; hypotension orthostatique au lever.</p><p><b>Contre-indications.</b> Risque hémorragique accru, coronaropathie sévère ou angor instable, infarctus de moins de six mois, insuffisance cardiaque de classe II à IV, arythmie de pronostic grave, congestion pulmonaire, grossesse.</p><p><b>Surveillance.</b> Pression artérielle et fréquence cardiaque au début et après chaque augmentation de dose. Une amputation impérative ne doit pas être retardée au profit d’un essai d’iloprost.</p></template>
<template data-pop="pareto-i73-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i73-0,i73-1,i73-2,i73-3,i73-4,i73-5,i73-6"></p><ul>
<li>Raynaud = pâleur digitale bien délimitée, transitoire, déclenchée par le froid ou l’émotion ; cyanose et rougeur facultatives.</li>
<li>Primaire (sans cause) ou secondaire (cause associée) ; prévalence 3 à 21 % ; forme primaire neuf fois plus fréquente chez la femme.</li>
<li>Sclérodermie systémique : Raynaud chez 90 % ; après 60 ans, 60 % sont athéroscléreux ; le Raynaud peut précéder une connectivite de deux décennies.</li>
<li>Causes : connectivites, vibrations, bêtabloquants et autres médicaments, endocrinopathies, thromboangéite ; une cause trouvée ne clôt pas l’enquête.</li>
<li>Forme secondaire : début plus tardif, asymétrie, ulcère, cicatrice pulpaire, sclérodactylie ; pression aux deux bras, pouls, manœuvre d’Allen.</li></ul></template>
<template data-pop="pareto-i73-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i73-7,i73-8,i73-9"></p><ul>
<li>Bilan pour tous : formule sanguine, vitesse de sédimentation ou protéine C réactive, anticorps antinucléaires ; capillaroscopie si disponible.</li>
<li>Adresser : forme secondaire suspectée, ulcère, bilan anormal, aggravation, enfant de moins de 12 ans, vibrations.</li>
<li>Ischémie digitale fixée ou ulcère infecté : avis spécialisé rapide, infection traitée énergiquement.</li>
<li>Mesures générales et arrêt du tabac, puis nifédipine retard progressive (hors étiquette en Suisse) ; iloprost intraveineux pour les formes secondaires sévères ; pas de chirurgie dans la forme primaire.</li></ul></template>
<template data-pop="pareto-i73-autres" data-title="Pareto — Thromboangéite, différentiels et suivi"><p class="ratio" data-cover="i73-10,i73-11,i73-12,i73-13"></p><ul>
<li>Thromboangéite oblitérante : nicotine, occlusions segmentaires distales, nécrose acrale ; arrêt complet du tabac ; iloprost autorisé en Suisse au stade avancé.</li>
<li>Acrocyanose : cyanose permanente indolore ; érythromélalgie : brûlure soulagée par le froid ; engelures : papules prurigineuses ; hématome digital paroxystique : ecchymose bénigne.</li>
<li>Nifédipine contre-indiquée les 20 premières semaines de grossesse et pendant l’allaitement ; enfant de moins de 12 ans adressé ; après 60 ans, chercher l’athérosclérose.</li></ul></template>
<template data-pop="pareto-i73-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i73-e-1,i73-e-2,i73-e-3,i73-e-4"></p><ul>
<li>Diagnostic clinique ; photographie de crise.</li>
<li>Capillaroscopie anormale = fort prédicteur de connectivite ; normale n’exclut pas une connectivite future.</li>
<li>Anticentromère : sclérodermie limitée ; anti-topo-isomérase : diffuse ; anti-Ro et anti-La : Sjögren ; anti-ADN double brin : lupus.</li></ul></template>
<template data-pop="pareto-i73-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i73-p-1,i73-p-2"></p><ul>
<li>Nifédipine retard : 10 à 20 mg deux ou trois fois par jour (ESVM), introduction lente ; CYP3A4 ; rifampicine contre-indiquée.</li>
<li>Iloprost intraveineux : 0,5 à 2,0 ng/kg/min, 6 heures par jour, environ 4 semaines ; surveillance tensionnelle.</li>
<li>Éviter les bêtabloquants non sélectifs, l’ergot et l’éphédrine.</li></ul></template>
