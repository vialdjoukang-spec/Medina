<template data-pop="m06-synov" data-title="Synovite"><p>Inflammation de la membrane synoviale : tuméfaction élastique, chaleur, douleur, épanchement. Cliniquement, un gonflement articulaire palpable distingue l’arthrite de la simple arthralgie. L’échographie Doppler la confirme et détecte les formes infracliniques.</p></template>
<template data-pop="m06-inflam" data-title="Douleur inflammatoire ou mécanique"><p><b>Inflammatoire</b> : réveils nocturnes, raideur matinale prolongée (&gt; 30 minutes), amélioration par le mouvement, signes locaux, CRP élevée. <b>Mécanique</b> : douleur à l’effort, calmée par le repos, raideur de dérouillage brève (&lt; 15 minutes).</p></template>
<template data-pop="m06-epitope" data-title="Épitope partagé"><p>Séquence d’acides aminés commune à plusieurs allèles HLA-DRB1, qui favorise la présentation des peptides citrullinés ; elle est associée au risque de polyarthrite séropositive et interagit avec le tabac.</p></template>
<template data-pop="m06-citrul" data-title="Citrullination"><p>Transformation post-traductionnelle de l’arginine en citrulline par les peptidyl-arginine désiminases, activées par le tabac et l’inflammation. Les protéines citrullinées (fibrine, vimentine) deviennent des auto-antigènes ; les anticorps qui les ciblent sont les anticorps anti-peptides citrullinés.</p></template>
<template data-pop="m06-squeeze" data-title="Test de compression"><p>Compression latérale des quatre métacarpophalangiennes ou métatarsophalangiennes entre le pouce et les doigts de l’examinateur. Douleur = argument pour une synovite de ces articulations.</p></template>
<template data-pop="m06-sero" data-title="Facteur rhumatoïde et anticorps anti-peptides citrullinés"><p><b>Anticorps anti-peptides citrullinés</b> : présents tôt, parfois avant les arthrites, et pronostiques. <b>Facteur rhumatoïde</b> : moins spécifique, positif aussi dans le Sjögren, l’hépatite C, les infections chroniques et chez le sujet âgé. Dans les critères de 2010, un titre supérieur à trois fois la normale de l’un des deux vaut 3 points, un titre inférieur 2 points. Une sérologie négative n’exclut pas la maladie.</p></template>
<template data-pop="m06-das" data-title="Scores d’activité"><p><b>DAS28</b> : 28 articulations douloureuses et gonflées, CRP ou vitesse de sédimentation, évaluation globale du patient. <b>CDAI</b> (sans biologie) : rémission ≤ 2,8. <b>SDAI</b> (avec CRP) : rémission ≤ 3,3. <b>Définition booléenne 2022</b> : articulations douloureuses ≤ 1, gonflées ≤ 1, CRP ≤ 1 mg/dL, évaluation globale du patient ≤ 2 sur 10. Sous inhibiteur de la voie de l’IL-6, la CRP baisse par effet pharmacologique : un score qui l’intègre peut surestimer la rémission.</p><p class="small">Studenic P. et al., critères de rémission, révision 2022, Annals of the Rheumatic Diseases 2023. Les seuils d’activité du DAS28 n’ont pas été relus dans une source primaire pour cette révision.</p></template>
<template data-pop="m06-d-mtx" data-title="Méthotrexate"><div class="lab">Mécanisme</div><p>Antagoniste de l’acide folique qui se fixe sur la dihydrofolate réductase ; réponse thérapeutique attendue après 4 à 8 semaines.</p><div class="lab">Posologie (information professionnelle suisse)</div><p>7,5 mg une fois par semaine, à un jour fixe noté sur l’ordonnance ; paliers de 2,5 mg ; en général 25 mg par semaine au plus, toxicité médullaire nettement accrue au-delà de 20 mg. Supplémentation en acide folique envisagée. Clairance de la créatinine 30 à 59 mL/min : 50 % de la dose ; moins de 30 mL/min : contre-indication.</p><div class="lab">Effets indésirables</div><p>Nausées, stomatite, cytopénies, hépatotoxicité, atteinte pulmonaire à toutes les doses, lymphomes, tératogénicité.</p><div class="lab">Contre-indications</div><p>Grossesse et allaitement, insuffisance hépatique, abus d’alcool, clairance inférieure à 30 mL/min, dyscrasie sanguine, infections sévères, ulcérations buccales ou digestives, vaccins vivants simultanés, anesthésie au protoxyde d’azote.</p><p class="small">Information professionnelle suisse Metoject®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
<template data-pop="m06-d-autres" data-title="Léflunomide, sulfasalazine, hydroxychloroquine"><p><b>Léflunomide</b> : inhibe la synthèse des pyrimidines ; 20 mg par jour. Hépatotoxicité, cytopénies, tératogénicité. Procédure d’élimination selon l’information professionnelle suisse : colestyramine 8 g trois fois par jour ou charbon activé 50 g quatre fois par jour pendant 11 jours, puis deux dosages à au moins 14 jours d’intervalle et attente d’un mois et demi après le premier taux inférieur à 0,02 mg/L. <b>Sulfasalazine</b> : compatible avec la grossesse avec acide folique selon la Société suisse de rhumatologie ; cytopénies, hépatotoxicité, oligospermie réversible. <b>Hydroxychloroquine</b> : contre-indiquée en cas de rétinopathie préexistante, de myasthénie, de psoriasis, de déficit en glucose-6-phosphate déshydrogénase et de porphyrie ; rétinopathie dose-dépendante.</p></template>
<template data-pop="m06-d-bio" data-title="Biothérapies de la polyarthrite rhumatoïde"><p><b>Anti-TNF</b> : de préférence associés au méthotrexate ; risque d’infections et de tuberculose ; contre-indiqués dans l’insuffisance cardiaque de classe NYHA III à IV ; prudence en cas de maladie démyélinisante. <b>Tocilizumab, sarilumab</b> (anti-récepteur de l’IL-6) : utilisables en monothérapie si le méthotrexate est impossible ; perforations digestives, notamment sur diverticulite ; CRP et neutrophiles abaissés pendant une infection. <b>Abatacept</b> : bloque la costimulation des lymphocytes T. <b>Rituximab</b> : autorisé en Suisse en association au méthotrexate après échec d’un ou plusieurs anti-TNF ; hypogammaglobulinémie. En Suisse, le remboursement suit la limitation de la liste des spécialités et peut exiger un accord préalable de l’assureur.</p><p class="small">EULAR 2025 ; information professionnelle suisse Humira®, Actemra®, Kevzara®, MabThera®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
<template data-pop="m06-d-jak" data-title="Inhibiteurs de JAK"><p>Petites molécules orales bloquant les kinases Janus. Risques : zona (vaccin recombinant avant), infections graves, thromboses veineuses, événements cardiovasculaires majeurs et cancers ; ORAL Surveillance (2022) a montré davantage de cancers sous tofacitinib que sous anti-TNF chez des patients de 50 ans ou plus à risque cardiovasculaire. L’information professionnelle suisse réserve les inhibiteurs de JAK, chez les patients de plus de 65 ans, les fumeurs ou anciens fumeurs et ceux qui ont d’autres facteurs de risque de cancer, aux situations sans alternative appropriée. La Société suisse de rhumatologie admet une extension au-delà de 65 ans lorsque les facteurs de risque sont traités, après discussion avec le patient ; un accord préalable de l’assureur est requis.</p><p class="small">Information professionnelle suisse Rinvoq®, Xeljanz®, Olumiant® ; Société suisse de rhumatologie, fiche inhibiteurs de JAK (09-2026).</p></template>
<template data-pop="m06-ch-mtx" data-title="Méthotrexate : position suisse et information professionnelle"><p>Deux sources suisses encadrent le méthotrexate ; elles ne disent pas exactement la même chose.</p><table class="t"><tr><th>Question</th><th>Information professionnelle suisse (Swissmedic)</th><th>Société suisse de rhumatologie (09-2026)</th></tr><tr><td>Dose</td><td>7,5 mg par semaine, paliers de 2,5 mg, 25 mg au plus en général</td><td>5 à 15 mg par semaine au début, entretien de 10 à 30 mg par semaine</td></tr><tr><td>Acide folique</td><td>Supplémentation envisagée</td><td>5 à 10 mg par semaine</td></tr><tr><td>Surveillance</td><td>Au moins mensuelle pendant 6 mois, puis au moins trimestrielle</td><td>Toutes les 2 à 4 semaines le premier mois, tous les 1 à 2 mois jusqu’au 6e mois, puis tous les 2 à 3 mois</td></tr><tr><td>Rein</td><td>50 % de la dose si clairance 30 à 59 mL/min ; contre-indiqué en dessous de 30</td><td>Acceptable jusqu’au stade 3 de maladie rénale chronique, avec contrôles plus fréquents</td></tr><tr><td>Désir de grossesse</td><td>Contraception jusqu’à 6 mois après l’arrêt chez la femme et 3 mois chez l’homme</td><td>Arrêt 1 à 3 mois avant la conception chez la femme ; poursuite possible chez l’homme</td></tr></table><p><b>Choix retenu pour le cours</b> : la posologie, les adaptations rénales et les contre-indications suivent l’information professionnelle suisse, qui fait foi pour la prescription ; les fourchettes de la société savante éclairent la pratique spécialisée et le conseil préconceptionnel, discuté avec le rhumatologue.</p><p class="small">Information professionnelle suisse Metoject®, Swissmedic (AIPS), version 02-2025 ; Société suisse de rhumatologie, fiche méthotrexate (09-2026) et recommandations grossesse et allaitement (03-2026), consultées le 08.10.2026.</p></template>
<template data-pop="m06-ch-hcq" data-title="Hydroxychloroquine : dépistage rétinien en Suisse"><p>L’<b>information professionnelle suisse</b> de Plaquenil® demande un contrôle ophtalmologique des deux yeux avant le traitement puis tous les 3 à 6 mois (acuité, champ visuel central, vision des couleurs, fond d’œil) ; elle situe le risque rétinien comme faible jusqu’à 6,5 mg/kg par jour et contre-indique la rétinopathie préexistante. La <b>Société suisse de rhumatologie</b> (09-2026) retient une dose usuelle de 5 mg/kg par jour au plus, un examen initial par tomographie en cohérence optique et périmétrie automatisée, puis un contrôle annuel à partir de la 5e année si la dose est d’au plus 5 mg/kg par jour et en l’absence de facteur de risque, annuel d’emblée au-delà.</p><p><b>Lecture</b> : le calendrier de la société savante, plus récent et plus ciblé, structure le suivi spécialisé ; l’information professionnelle reste opposable pour la prescription. En cas de doute, le contrôle le plus fréquent protège la rétine.</p></template>
<template data-pop="pareto-m06-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="m06-0,m06-1,m06-2,m06-3,m06-4,m06-5,m06-6"></p><ul><li>Rhumatisme auto-immun : synovite symétrique des petites articulations, destruction ostéocartilagineuse, atteintes extra-articulaires.</li><li>Tabac + HLA-DRB1 porteur de l’épitope partagé → citrullination → anticorps anti-peptides citrullinés, parfois avant les arthrites.</li><li>Pannus, TNF-α, IL-6, RANKL → érosions irréversibles : traitement de fond dès le diagnostic.</li><li>Raideur matinale prolongée ; poignets, métacarpophalangiennes, interphalangiennes proximales, métatarsophalangiennes ; interphalangiennes distales épargnées.</li><li>Déformations tardives : déviation cubitale, col de cygne, boutonnière ; nodules.</li><li>Guérison exceptionnelle : l’arrêt du traitement est souvent suivi de poussée (EULAR 2025).</li></ul></template>
<template data-pop="pareto-m06-diag" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="m06-7"></p><ul><li>Avis rhumatologique rapide devant toute arthrite inexpliquée.</li><li>CRP, vitesse de sédimentation, facteur rhumatoïde, anticorps anti-peptides citrullinés, anticorps antinucléaires si lupus envisagé, radiographies mains-pieds-thorax, échographie.</li><li>Différentiels : septique, viral (parvovirus, hépatites), lupus, psoriasique, cristaux, pseudo-polyarthrite rhizomélique, arthrose, hémochromatose.</li></ul></template>
<template data-pop="pareto-m06-tt" data-title="Pareto — Atteintes et traitement"><p class="ratio" data-cover="m06-8,m06-9"></p><ul><li>Urgences : rachis cervical, infection sous immunosuppresseurs (CRP abaissée sous inhibiteur de l’IL-6), sclérite, vascularite, atteinte pulmonaire au méthotrexate.</li><li>Traitement de fond dès le diagnostic ; cible : rémission prolongée ; amélioration à 3 mois, cible à 6 mois (EULAR 2025).</li><li>Méthotrexate 7,5 mg une fois par semaine, paliers de 2,5 mg, 25 mg au plus (information professionnelle suisse), acide folique ; corticostéroïdes courts ; pas de trithérapie conventionnelle.</li><li>Échec : ajouter une biothérapie, sans stratification pronostique ; inhibiteur de JAK après pesée des risques (plus de 65 ans, tabac, cancer).</li><li>Avant : tuberculose, hépatites, VIH, vaccins dont le zona recombinant ; pas de vaccin vivant.</li></ul></template>
<template data-pop="pareto-m06-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="m06-10,m06-11,m06-12"></p><ul><li>Rémission : CDAI ≤ 2,8, SDAI ≤ 3,3 ou définition booléenne 2022.</li><li>Rémission prolongée : poursuivre le traitement de fond ; réduction prudente possible.</li><li>Grossesse : méthotrexate et léflunomide contre-indiqués ; hydroxychloroquine, sulfasalazine, azathioprine, anti-TNF compatibles.</li><li>Méthotrexate : 50 % de la dose si clairance 30 à 59 mL/min, contre-indiqué en dessous de 30.</li><li>Critères 2010 : synovite + score ≥ 6/10 (articulations 0–5, sérologie 0–3, phase aiguë 0–1, durée 0–1).</li></ul></template>
<template data-pop="pareto-m06-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="m06-e-1,m06-e-2"></p><ul><li>Anticorps anti-peptides citrullinés : marqueur de référence, pronostique ; facteur rhumatoïde moins spécifique.</li><li>Liquide inflammatoire stérile sans cristaux.</li><li>Radiographie : ostéopénie en bande, pincement symétrique, érosions marginales ; échographie Doppler ; IRM : œdème osseux.</li><li>Bilan préthérapeutique complet, lipides avant inhibiteur de JAK.</li></ul></template>
<template data-pop="pareto-m06-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="m06-p-1,m06-p-2"></p><ul><li>Méthotrexate une fois par semaine, 7,5 à 25 mg ; surveillance mensuelle 6 mois puis trimestrielle.</li><li>Méthotrexate + cotrimoxazole : pancytopénie ; prise quotidienne par erreur : décès, folinate de calcium.</li><li>Léflunomide tératogène, élimination par colestyramine ; hydroxychloroquine : rétine et QT.</li><li>Biothérapies, inhibiteurs de JAK : infections, tuberculose, zona, thromboses ; anti-TNF contre-indiqués en NYHA III à IV.</li></ul></template>
