<template data-pop="m06-science-reading" data-title="Activité inflammatoire et dommage articulaire : deux dimensions"><p>L’activité indique ce qui s’enflamme aujourd’hui. Le dommage indique ce que la maladie a déjà détruit ou déformé. Les deux dimensions influencent douleur et fonction, mais ne répondent pas de la même manière au traitement.</p><p>L’examen recherche synovite et limitation. L’imagerie décrit épaississement, signal Doppler et lésions structurales selon la méthode. Une radiographie sans érosion ne supprime pas une synovite précoce. Une érosion ancienne ne prouve pas une inflammation intense actuelle.</p><p>Les anticorps participent au diagnostic et au pronostic, sans mesurer seuls l’activité du jour. Une voie médicamenteuse qui réduit la CRP peut rendre ce marqueur moins informatif dans certaines situations.</p><p>Le suivi confronte symptômes, articulations, fonction et traitements. Une plainte nouvelle peut aussi relever d’une infection ou d’une autre cause qui nécessite une évaluation propre.</p><div class="key"><b>À retenir.</b> Le résultat répond à une question précise. Son interprétation exige les autres informations du patient.</div></template>
