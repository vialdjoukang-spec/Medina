<section class="ilot" id="m06-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 46 ans, fumeuse, décrit depuis deux mois des douleurs des deux poignets et des doigts, avec une raideur matinale de plus d’une heure. Elle a du mal à ouvrir un bocal. La question qui structure le cours est la suivante : <b>s’agit-il d’une polyarthrite rhumatoïde débutante, comment la confirmer rapidement, et quel traitement de fond instaurer sans attendre pour prévenir les destructions articulaires ?</b></p>
<p>À la fin du cours, le médecin assistant sait reconnaître une arthrite inflammatoire, appliquer les critères de classification de 2010, interpréter facteur rhumatoïde et anticorps anti-peptides citrullinés, mesurer l’activité par un score composite, débuter le méthotrexate selon l’information professionnelle suisse, conduire la stratégie « traiter jusqu’à la cible » de l’EULAR 2025 et reconnaître les atteintes extra-articulaires graves.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="m06-synov">synovite (inflammation de la membrane synoviale)</button> et la <button class="w" data-k="m06-inflam">différence entre douleur inflammatoire et mécanique</button>.</div>
</section>
<section class="ilot" id="m06-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La polyarthrite rhumatoïde est un <b>rhumatisme inflammatoire chronique auto-immun</b>. Elle associe une synovite habituellement <b>symétrique</b> des petites et grandes articulations périphériques, qui détruit le cartilage et l’os en l’absence de traitement, et des atteintes extra-articulaires. On distingue la forme <b>séropositive</b>, avec facteur rhumatoïde ou anticorps anti-peptides citrullinés, et la forme <b>séronégative</b>. Les critères de 2010 attribuent un poids maximal aux anticorps à titre élevé, car ils signalent un risque accru d’évolution persistante ou érosive.</p>
<p>Les critères ACR/EULAR 2010 sont des critères de <b>classification</b>, conçus pour reconnaître tôt les patients à risque d’arthrite persistante ou érosive. Ils s’appliquent à un patient qui présente au moins une synovite clinique non mieux expliquée par une autre maladie (détail au § 12). Exemple : une patiente avec six petites articulations gonflées (3 points), des anticorps anti-peptides citrullinés supérieurs à trois fois la normale (3 points), une CRP élevée (1 point) et des symptômes depuis huit semaines (1 point) totalise 8 points sur 10 ; le seuil de 6 est atteint.</p>
</section>
<section class="ilot" id="m06-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La polyarthrite rhumatoïde est le rhumatisme inflammatoire chronique le plus fréquent de l’adulte. L’étude Global Burden of Disease 2021 estime sa prévalence standardisée sur l’âge à <b>285 cas pour 100 000 habitants en Europe de l’Ouest</b> en 2020, soit environ 0,3 % de la population, contre 209 pour 100 000 dans le monde. La maladie touche <b>2,45 femmes pour un homme</b>. Sa prévalence augmente avec l’âge et culmine entre 75 et 79 ans, car une maladie chronique rarement guérie s’accumule au fil des décennies. Aucune étude de population n’a encore mesuré sa prévalence propre à la Suisse.</p>
<p>Le pronostic vital s’est amélioré, mais l’écart avec la population générale persiste. Une méta-analyse française des cohortes de polyarthrite débutante retrouve une mortalité 1,47 fois supérieure à celle de la population de même âge et de même sexe ; la mortalité brute y baisse de 2,3 % par an au fil des cohortes, sans que cet excès relatif ne disparaisse. Le risque cardiovasculaire explique une part de cet écart. Dans le registre suisse <b>SCQM</b>, les événements cardiovasculaires majeurs surviennent chez 2,67 patients atteints de polyarthrite pour 1 000 patients-années ; après ajustement sur les facteurs de risque classiques, ce taux ne diffère plus de celui du rhumatisme psoriasique ou de la spondyloarthrite axiale. Les auteurs en concluent que l’inflammation, plutôt que la maladie elle-même, entretient ce risque : contrôler la synovite protège donc aussi les artères.</p>
<p>La guérison reste exceptionnelle : selon l’EULAR 2025, l’arrêt des traitements de fond est suivi de poussées chez la plupart des patients, même en rémission prolongée. La maladie entraîne aussi des coûts individuels, médicaux et sociaux élevés, que l’EULAR demande de prendre en compte dans les décisions. En Suisse, le registre SCQM suit les patients sous traitement de fond ciblé ; la Société suisse de rhumatologie recommande d’y inclure notamment les patients traités par inhibiteurs de JAK.</p>
<div class="key"><b>À retenir.</b> Environ trois adultes sur mille vivent avec une polyarthrite rhumatoïde en Europe de l’Ouest, surtout des femmes. La surmortalité, d’origine notamment cardiovasculaire, suit l’inflammation : la rémission est un objectif vital, pas seulement articulaire.</div>
</section>
<section class="ilot" id="m06-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Rupture de tolérance</b> : chez un sujet génétiquement prédisposé (allèles HLA-DRB1 portant l’<button class="w" data-k="m06-epitope">épitope partagé</button>), un facteur d’environnement, surtout le <b>tabac</b>, favorise dans le poumon et les muqueuses la <button class="w" data-k="m06-citrul">citrullination de protéines</button>. Des anticorps anti-peptides citrullinés peuvent apparaître <b>avant</b> les arthrites, pendant une phase préclinique.</p>
<p><b>Synovite</b> : la membrane synoviale est envahie par des lymphocytes T et B, des macrophages et des plasmocytes. Les cytokines (TNF-α, IL-6, IL-1) entretiennent l’inflammation et la prolifération des synoviocytes fibroblastiques. La synoviale s’épaissit en un tissu agressif, le <b>pannus</b>.</p>
<p><b>Destruction</b> : le pannus et les métalloprotéases détruisent le cartilage, d’où le pincement articulaire ; le RANKL active les ostéoclastes qui creusent des <b>érosions</b> à la jonction cartilage-os. La perte d’os périarticulaire donne l’ostéopénie en bande. Les tendons et ligaments inflammés se rompent ou se distendent, ce qui produit les déformations.</p>

<div class="key"><b>Corrélation physiopathologie → traitement et examens.</b> Chaque cytokine est une cible (anti-TNF, anti-récepteur de l’IL-6) ; les lymphocytes B (rituximab) et la costimulation des lymphocytes T (abatacept) aussi ; les inhibiteurs de JAK bloquent la signalisation commune de plusieurs cytokines. L’IL-6 stimule la synthèse hépatique de CRP et l’hepcidine : l’information professionnelle suisse du tocilizumab décrit d’ailleurs, sous traitement, une baisse rapide de la CRP et une hausse de l’hémoglobine. Les érosions étant irréversibles, l’EULAR 2025 demande de débuter le traitement de fond dès que le diagnostic est posé.</div>
</section>
<section class="ilot" id="m06-4"><h2><span class="n">4</span>Facteurs de risque</h2>
<p><b>Génétiques</b> : HLA-DRB1 porteur de l’épitope partagé, PTPN22. <b>Environnement</b> : le <b>tabac</b> est le principal facteur modifiable, surtout pour la forme à anticorps anti-peptides citrullinés, avec une interaction avec l’épitope partagé ; la maladie parodontale est aussi discutée, car <i>Porphyromonas gingivalis</i> produit une enzyme citrullinante. <b>Sexe féminin</b> ; le post-partum est une période de début fréquente. Un facteur de risque augmente une probabilité ; il ne fait pas le diagnostic (voir l’onglet Sciences, génétique).</p>
</section>
<section class="ilot" id="m06-5"><h2><span class="n">5</span>Anamnèse</h2>
<p><b>Douleurs inflammatoires</b> : réveils nocturnes en seconde partie de nuit, <b>raideur matinale prolongée</b>, amélioration par le mouvement. Topographie typique : <b>poignets, métacarpophalangiennes, interphalangiennes proximales, métatarsophalangiennes</b>, de manière <b>symétrique</b> ; les interphalangiennes distales sont épargnées. Signes généraux : fatigue marquée, fébricule, amaigrissement. Rechercher : tabac, antécédents familiaux, psoriasis personnel ou familial, éruption, sécheresse oculo-buccale, symptômes digestifs, infections récentes (parvovirus B19, hépatites), voyage, grossesse.</p>
<div class="two"><div class="card"><h4>Début typique</h4><p>Polyarthrite bilatérale et symétrique des mains et des pieds, progressive sur des semaines.</p></div>
<div class="card"><h4>Débuts atypiques</h4><p>Monoarthrite d’une grosse articulation ; forme rhizomélique du sujet âgé ressemblant à une pseudo-polyarthrite rhizomélique ; rhumatisme palindromique (poussées de quelques heures à quelques jours, sans séquelle) ; ténosynovite isolée avec syndrome du canal carpien.</p></div></div>
</section>
<section class="ilot" id="m06-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Compter les <b>articulations gonflées et douloureuses</b> : les 28 articulations du DAS28 servent de base aux scores composites. La synovite se palpe comme une tuméfaction élastique, chaude, douloureuse ; le <button class="w" data-k="m06-squeeze">test de compression des métacarpophalangiennes ou des métatarsophalangiennes</button> est positif. Au stade évolué : déviation cubitale des doigts, <b>doigts en col de cygne</b> et <b>en boutonnière</b>, pouce en Z, avant-pied plat triangulaire, <b>nodules rhumatoïdes</b> aux faces d’extension (coudes). Rechercher les atteintes extra-articulaires (îlot 8) : poumons (crépitants), yeux, peau, nerfs, cœur.</p>
