<template data-pop="c34-ofs" data-title="Statistiques suisses du cancer bronchique (OFS)"><p>L’Office fédéral de la statistique publie, avec l’Organe national d’enregistrement du cancer, des estimations nationales fondées sur les registres cantonaux des tumeurs. Pour la période 2018–2022, publiée le 10 novembre 2025, le cancer de la trachée, des bronches et du poumon compte en moyenne 2855 nouveaux cas annuels chez l’homme et 2206 chez la femme ; de plus, il cause 1898 décès chez l’homme et 1364 chez la femme.</p><p>Les taux pour 100 000 personnes atteignent 45,9 et 32,2 pour l’incidence, et 29,5 et 18,4 pour la mortalité. Par ailleurs, la maladie fait perdre 5658 années potentielles de vie chez l’homme et 3930 chez la femme. Ces chiffres font donc du cancer bronchique l’un des cancers les plus meurtriers en Suisse.</p></template>
<template data-pop="c34-rcp" data-title="Concertation pluridisciplinaire en oncologie thoracique"><p>La concertation réunit au minimum le pneumologue, l’oncologue médical, le chirurgien thoracique, le radio-oncologue, le radiologue, le médecin nucléaire et le pathologiste. Elle décide de la technique de prélèvement, de la résécabilité et de l’enchaînement des traitements ; en effet, l’ESMO 2025 exige qu’elle fixe la séquence néoadjuvante, périopératoire ou adjuvante avant tout traitement. C’est pourquoi aucun stade III ne devrait être traité sans cette discussion.</p></template>
<template data-pop="c34-tdm" data-title="Scanner thoracique injecté dans le cancer bronchique"><p>Le scanner avec injection de produit de contraste couvre le thorax et l’abdomen supérieur, jusqu’aux surrénales, car le foie et les surrénales sont des sites métastatiques fréquents. Il mesure la tumeur dans son plus grand diamètre et, pour une lésion partiellement solide, la seule composante solide. En outre, il décrit les rapports avec la paroi, le médiastin et les vaisseaux, ainsi que les ganglions et les nodules associés.</p><div class="trap"><span class="k">Piège</span>Un ganglion de taille normale peut être envahi, et inversement un ganglion augmenté peut être inflammatoire ; la taille seule ne suffit donc pas à fixer la catégorie N.</div></template>
<template data-pop="c34-tep" data-title="Tomographie par émission de positons au fluorodésoxyglucose"><p>Le fluorodésoxyglucose, analogue radioactif du glucose, se concentre dans les tissus à forte consommation de glucose, comme les tumeurs. La TEP-TDM détecte ainsi les atteintes ganglionnaires et métastatiques ; elle est d’ailleurs la méthode la plus sensible pour les métastases osseuses (ESMO 2023).</p><p>Cependant, sa spécificité est relativement basse, car l’inflammation et l’infection fixent aussi le traceur. Par conséquent, toute fixation qui modifie la stratégie doit être prouvée, et la TEP n’est pas recommandée en routine pour le suivi.</p></template>
<template data-pop="c34-ebus" data-title="Échoendoscopie bronchique et œsophagienne"><p>L’échoendoscopie bronchique associe un bronchoscope et une sonde d’échographie ; elle permet ainsi de voir et de ponctionner à l’aiguille les ganglions au contact de la trachée et des bronches, dans les stations 2, 4, 7, 10 et 11. L’échoendoscopie œsophagienne complète l’accès aux stations para-œsophagiennes et sous-carénaires.</p><p>L’ESMO 2025 recommande cette stadification invasive chez tout patient dont les ganglions médiastinaux ou hilaires sont anormaux au scanner ou à la TEP. En outre, le geste fournit souvent le diagnostic histologique, si bien qu’il évite une seconde procédure.</p></template>
<template data-pop="c34-ihc" data-title="Immunohistochimie p40 et TTF-1"><p>Lorsque la morphologie ne permet pas de sous-typer un CBNPC, le pathologiste utilise en général deux marqueurs. Ainsi, p40, protéine nucléaire des cellules basales malpighiennes, oriente vers un carcinome épidermoïde ; à l’inverse, TTF-1, facteur de transcription des pneumocytes, oriente vers un adénocarcinome. L’ESMO demande toutefois de limiter les marquages inutiles, car le tissu doit être conservé pour les tests moléculaires.</p></template>
<template data-pop="c34-pdl1" data-title="Expression de PD-L1"><p class="lab">Mesure</p><p>Le score est le pourcentage de cellules tumorales qui présentent un marquage membranaire, sur au moins 100 cellules analysables. Il est rendu au minimum en trois classes : moins de 1 %, 1 à 49 % et 50 % ou plus.</p><p class="lab">Interprétation</p><p>Au stade IV, une expression d’au moins 50 % autorise le pembrolizumab en monothérapie ; en revanche, au-dessous de 50 %, la monothérapie n’est pas recommandée et la chimio-immunothérapie s’impose. Aux stades II à III, le score éclaire la décision périopératoire et adjuvante.</p><div class="trap"><span class="k">Piège</span>Les tests 22C3, SP263 et 28-8 sont interchangeables, mais le test SP142 donne des résultats différents ; il faut donc connaître le test employé.</div></template>
<template data-pop="c34-operabilite" data-title="Évaluation fonctionnelle avant résection"><p class="lab">Calcul</p><p>La valeur postopératoire prédite du VEMS ou de la DLCO vaut la valeur préopératoire, en pourcentage de la théorique, multipliée par le nombre de segments fonctionnels conservés divisé par 19. Ainsi, pour une lobectomie inférieure droite de 5 segments avec un VEMS à 70 %, la valeur prédite est d’environ 52 %.</p><p class="lab">Seuils de l’ESMO 2025</p><p>Si les deux valeurs prédites atteignent 60 % ou plus, la chirurgie peut être réalisée sans autre exploration. En revanche, si l’une d’elles est inférieure à 30 %, la consommation maximale d’oxygène doit être mesurée ; lorsqu’elle est inférieure à 10 mL/kg/min, une résection infralobaire ou un traitement non chirurgical doivent être discutés. Par ailleurs, la fonction cardiaque est évaluée par l’indice de risque cardiaque thoracique révisé et recalibré.</p></template>
<template data-pop="c34-sublobaire" data-title="Résection infralobaire"><p>La résection infralobaire, par segmentectomie anatomique ou résection atypique, épargne du parenchyme. Deux essais de phase III, l’un nord-américain et l’autre japonais, ont montré qu’elle n’est pas inférieure à la lobectomie, en survie sans maladie et en survie globale, pour une tumeur périphérique de 2 cm au plus. Toutefois, les récidives locorégionales y étaient un peu plus fréquentes : 13,4 % contre 10,0 % dans le premier, 10,5 % contre 5,4 % dans le second.</p><div class="key"><b>Conditions.</b> L’absence d’atteinte ganglionnaire doit être confirmée pendant l’intervention ; en outre, la résection anatomique est préférée à la résection atypique (ESMO 2025).</div></template>
<template data-pop="c34-sbrt" data-title="Radiothérapie stéréotaxique"><p>La radiothérapie stéréotaxique délivre en quelques séances une dose très élevée, concentrée sur la tumeur grâce à des faisceaux multiples et à un repérage précis. Dans les essais randomisés, elle obtient au stade I un contrôle local à long terme d’au moins 90 %, avec moins de 5 % de toxicité de grade 3 à 5 ; elle est d’ailleurs supérieure à la radiothérapie conventionnelle. Dans une étude prospective chez des patients opérables, la survie à cinq ans a atteint 87 %.</p><div class="key"><b>Indications.</b> Elle est le traitement non chirurgical de choix du stade I, notamment en cas de bronchopneumopathie sévère ou chez le sujet âgé ou fragile ; en revanche, les tumeurs centrales ou ultracentrales reçoivent des schémas plus fractionnés (ESMO 2025).</div></template>
<template data-pop="c34-perio" data-title="Chimio-immunothérapie néoadjuvante et périopératoire"><p>Ajouter un anti-PD-1 ou anti-PD-L1 à la chimiothérapie avant la chirurgie a modifié la prise en charge des stades II à III résécables. Ainsi, dans CheckMate 816, la réponse pathologique complète est passée de 2,2 % à 24 % et la survie à cinq ans de 55,0 % à 65,4 %. De même, dans KEYNOTE-671, le pembrolizumab périopératoire a amélioré la survie sans événement et la survie globale, avec une survie à trois ans de 71 % contre 64 %. Enfin, AEGEAN et CheckMate 77T ont montré un bénéfice en survie sans événement.</p><div class="key"><b>Conditions.</b> L’absence de mutation EGFR et de fusion ALK doit être établie avant de débuter ; de plus, la réponse pathologique complète est fortement associée à une meilleure survie (ESMO 2025).</div></template>
<template data-pop="c34-rtct" data-title="Chimioradiothérapie concomitante"><p>Administrer la chimiothérapie pendant la radiothérapie augmente d’environ 4 % la survie à cinq ans par rapport à une administration séquentielle ; en revanche, l’œsophagite réversible est plus fréquente. La dose de référence est de 60 Gy en fractions quotidiennes, car les doses supérieures n’améliorent pas la survie et peuvent même l’altérer. Avec les techniques modernes, on observe environ 8 % d’œsophagite temporaire de grade 3 et 5 % de pneumopathie de haut grade.</p><div class="key"><b>En pratique.</b> Le doublet associé comporte de préférence cisplatine et étoposide ou carboplatine et paclitaxel, ou cisplatine et pémétrexed dans les histologies non épidermoïdes (ESMO 2025).</div></template>
<template data-pop="c34-palliatif" data-title="Soins palliatifs au stade IV"><p>L’ESMO recommande une intervention palliative précoce, en parallèle du traitement oncologique, dès le diagnostic du stade IV. En effet, elle vise les symptômes, le soutien psychosocial et l’anticipation des décisions. En outre, plusieurs gestes palliatifs sont recommandés : la radiothérapie pour une hémoptysie, une obstruction bronchique, une douleur ou un syndrome cave supérieur ; la pleurodèse au talc ou le cathéter tunnellisé pour un épanchement récidivant ; la désobstruction endoscopique ou l’endoprothèse pour une obstruction des grosses voies aériennes.</p></template>
<template data-pop="c34-depistage" data-title="Dépistage par scanner à faible dose"><p class="lab">Preuves</p><p>Les essais NLST et NELSON ont réduit d’au moins 20 % la mortalité par cancer bronchique chez des fumeurs et anciens fumeurs. Dans NLST, la mortalité toutes causes a en outre diminué de 6,7 % ; dans NELSON, le dépistage a réduit la proportion de cancers découverts au stade IV.</p><p class="lab">Recommandations</p><p>L’ESMO 2025 recommande le dépistage, dans des programmes organisés, chez les fumeurs actuels de plus de 30 paquets-années ou les anciens fumeurs sevrés depuis moins de 15 ans, âgés de 55 à 74 ans. En Suisse, le Swiss Cancer Screening Committee émet en revanche une recommandation conditionnelle : le dépistage s’envisage dans un programme organisé, avec décision partagée et aide au sevrage.</p><div class="trap"><span class="k">Piège</span>Le dépistage ne remplace jamais l’arrêt du tabac, et ses inconvénients (anomalies bénignes, examens complémentaires, surdiagnostic) doivent être expliqués lors de la décision partagée.</div></template>
<template data-pop="c34-sevrage" data-title="Sevrage tabagique chez le patient atteint de cancer bronchique"><p>L’ESMO recommande un soutien optimal au sevrage, associant conseil, techniques comportementales et traitement médicamenteux ; en effet, l’arrêt améliore les résultats du traitement et réduit le risque de second cancer. Il ne vient donc jamais « trop tard », même après le diagnostic. Les substituts nicotiniques ou la varénicline peuvent être prescrits selon leurs informations professionnelles.</p></template>
<template data-pop="c34-irae" data-title="Effets indésirables d’origine immunitaire"><p>Les anti-PD-1 ou anti-PD-L1 lèvent un frein de tolérance ; par conséquent, ils peuvent provoquer une inflammation de presque tous les organes : poumon, côlon, foie, glandes endocrines, peau, rein, et plus rarement myocarde ou système nerveux. Ces effets peuvent survenir à tout moment, y compris après l’arrêt du traitement.</p><p class="lab">Conduite générale</p><p>Le traitement est gradué : au grade 1, la surveillance suffit souvent ; dès le grade 2 d’une pneumopathie, l’immunothérapie est suspendue et la prednisone débutée à 1 à 2 mg/kg par jour ; aux grades 3 et 4, l’arrêt est définitif (information professionnelle Keytruda). Toutefois, une infection doit toujours être exclue avant la corticothérapie.</p></template>
<template data-pop="c34-d-pembro" data-title="Pembrolizumab (Keytruda)"><p class="lab">Mécanisme</p><p>Anticorps monoclonal humanisé anti-PD-1 ; il bloque la liaison de PD-1 à ses ligands PD-L1 et PD-L2 et réactive ainsi les lymphocytes T cytotoxiques.</p><p class="lab">Preuves</p><p>Dans KEYNOTE-024, chez des patients métastatiques avec PD-L1 d’au moins 50 %, la survie à cinq ans a atteint 32 % contre 16 % sous chimiothérapie. De plus, associé à la chimiothérapie, il améliore la survie quelle que soit l’expression de PD-L1, et il est efficace en périopératoire (KEYNOTE-671).</p><p class="lab">Indications suisses dans le cancer bronchique</p><p>Première ligne métastatique en monothérapie si PD-L1 au moins 50 % sans altération EGFR ni ALK ; association au pémétrexed et au platine (non épidermoïde) ou au carboplatine et au paclitaxel (épidermoïde) ; néoadjuvant puis adjuvant dans le CBNPC résécable ; adjuvant après résection ; seconde ligne si PD-L1 d’au moins 1 %.</p><p class="lab">Posologie</p><p>200 mg toutes les 3 semaines ou 400 mg toutes les 6 semaines, en perfusion intraveineuse de 30 minutes.</p><p class="lab">Effets indésirables et surveillance</p><p>Effets d’origine immunitaire, dont la pneumopathie inflammatoire parfois mortelle ; bilan thyroïdien et hépatique répété. Il ne doit pas être utilisé pendant la grossesse, sauf nécessité.</p><div class="key"><b>Source.</b> Information professionnelle Keytruda (swissmedicinfo.ch, consultée le 09.10.2026) ; ESMO 2023.</div></template>
<template data-pop="c34-d-osim" data-title="Osimertinib (Tagrisso)"><p class="lab">Mécanisme</p><p>Inhibiteur oral, sélectif et irréversible de l’EGFR porteur des mutations sensibilisantes (délétion de l’exon 19, L858R) et de la mutation de résistance T790M.</p><p class="lab">Preuves</p><p>Dans ADAURA, après résection, il a amélioré la survie globale (rapport de risques 0,49) et la survie sans maladie cérébrale. Dans LAURA, au stade III après chimioradiothérapie, la survie sans progression médiane est passée de 5,6 à 39,1 mois.</p><p class="lab">Indications suisses</p><p>Adjuvant après résection complète ; consolidation après chimioradiothérapie au stade III non résécable ; première ligne localement avancée ou métastatique, seul ou avec pémétrexed et platine ; progression avec mutation T790M.</p><p class="lab">Posologie</p><p>80 mg une fois par jour ; en adjuvant, la durée est limitée à 3 ans.</p><p class="lab">Effets indésirables et surveillance</p><p>Pneumopathie interstitielle chez 4,0 % des patients en monothérapie, mortelle chez 0,4 %, avec un délai médian de 2,8 mois : le traitement est interrompu devant toute aggravation respiratoire et arrêté si le diagnostic se confirme. Après chimioradiothérapie, une pneumopathie asymptomatique de grade 1 autorise toutefois la poursuite, tandis que le grade 2 ou plus impose l’arrêt. Par ailleurs, l’allongement du QTc impose ECG et électrolytes ; les inducteurs puissants du CYP3A sont à éviter et le millepertuis est contre-indiqué. Il ne doit pas être utilisé pendant la grossesse.</p><div class="key"><b>Source.</b> Information professionnelle Tagrisso (swissmedicinfo.ch, consultée le 09.10.2026) ; ESMO 2025.</div></template>
<template data-pop="c34-d-durva" data-title="Durvalumab (Imfinzi)"><p class="lab">Mécanisme</p><p>Anticorps monoclonal anti-PD-L1 ; il empêche la liaison de PD-L1 à PD-1 et restaure ainsi l’activité des lymphocytes T.</p><p class="lab">Preuves</p><p>Dans PACIFIC, après chimioradiothérapie concomitante du stade III, la survie à cinq ans est passée de 33,4 % à 42,9 % et la survie sans progression médiane de 5,6 à 16,9 mois. De plus, dans AEGEAN, son ajout périopératoire a amélioré la survie sans événement.</p><p class="lab">Indications suisses</p><p>CBNPC localement avancé non résécable après chimioradiothérapie ; CBNPC résécable en périopératoire (autorisation à durée limitée) ; cancer à petites cellules limité après chimioradiothérapie ; cancer à petites cellules étendu, avec étoposide et platine.</p><p class="lab">Posologie</p><p>Stade III : 10 mg/kg toutes les 2 semaines ou 1500 mg toutes les 4 semaines, 12 mois au plus, débuté dans les 42 jours après la chimioradiothérapie (ESMO 2025). Cancer à petites cellules limité : 1500 mg toutes les 4 semaines, 24 mois au plus.</p><p class="lab">Contre-indication de stratégie</p><p>Il est à éviter en consolidation chez le patient porteur d’une mutation EGFR, faute de bénéfice et en raison du risque de toxicité immunitaire sévère si l’osimertinib suit.</p><div class="key"><b>Source.</b> Information professionnelle Imfinzi (swissmedicinfo.ch, consultée le 09.10.2026) ; ESMO 2025.</div></template>
<template data-pop="pareto-c34-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="c34-0,c34-1,c34-2,c34-3,c34-4,c34-5,c34-6"></p><ul><li>Petites cellules ou non à petites cellules, puis sous-type : ces deux étapes commandent tout.</li><li>Suisse : environ 5000 cas et 3300 décès par an ; âge médian 71 ans.</li><li>Tabac : 90 % des cas ; radon, amiante, radiothérapie, pollution.</li><li>Deux cibles : kinase motrice (EGFR, ALK) et point de contrôle PD-1/PD-L1.</li><li>Toux qui change, hémoptysie, amaigrissement chez un fumeur : imagerie.</li><li>Paranéoplasiques : 10 % ; hyponatrémie et Cushing dans les petites cellules, hypercalcémie par PTHrP.</li><li>Indice de performance et perte de poids conditionnent les traitements accessibles.</li></ul></template>
<template data-pop="pareto-c34-diag" data-title="Pareto — Diagnostic et stadification"><p class="ratio" data-cover="c34-7,c34-8"></p><ul><li>Pas de traitement sans histologie.</li><li>EGFR du stade IB au stade III C, ALK aux stades II à III A résécables, PD-L1 aux stades II à IV.</li><li>Scanner injecté, TEP et IRM cérébrale pour toute intention curative.</li><li>Échoendoscopie pour tout ganglion suspect.</li><li>TNM 9 : N2a une station, N2b plusieurs ; M1c1 un système, M1c2 plusieurs.</li><li>Lésion partiellement solide : seule la composante solide compte.</li></ul></template>
<template data-pop="pareto-c34-ttt" data-title="Pareto — Traitement du cancer non à petites cellules"><p class="ratio" data-cover="c34-9,c34-10,c34-11,c34-12"></p><ul><li>Urgences : hémoptysie, syndrome cave supérieur, compression médullaire, hyponatrémie, hypercalcémie, thrombose.</li><li>Stade I : lobectomie ou infralobaire si 2 cm au plus et N0 ; stéréotaxie si inopérable.</li><li>Adjuvant : osimertinib 3 ans si EGFR, alectinib 2 ans si ALK, cisplatine sinon.</li><li>Stade II–III résécable sans EGFR ni ALK : chimio-immunothérapie périopératoire.</li><li>Stade III non résécable : chimioradiothérapie 60 Gy, puis durvalumab un an ou osimertinib si EGFR.</li><li>Stade IV : inhibiteur si cible ; pembrolizumab seul si PD-L1 au moins 50 % ; chimio-immunothérapie sinon ; soins palliatifs précoces.</li></ul></template>
<template data-pop="pareto-c34-fin" data-title="Pareto — Situations, dépistage et critères"><p class="ratio" data-cover="c34-13,c34-14,c34-15,c34-16"></p><ul><li>Petites cellules : platine-étoposide ; radiothérapie concomitante précoce si limité ; immunothérapie si étendu.</li><li>Dépistage : ESMO 55–74 ans, gros fumeurs ; conditionnel en Suisse.</li><li>Suivi : tous les 6 mois 2 ans, puis annuel jusqu’à 5 ans.</li><li>Sujet âgé : carboplatine ; fibrose : experts ; rein : carboplatine.</li><li>Seuils : 60 %, 30 %, 10 mL/kg/min ; PD-L1 50 % ; 42 jours ; 60 Gy.</li></ul></template>
<template data-pop="pareto-c34-sci" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="c34-s-anat-body,c34-s-histo-body,c34-s-mol-body,c34-s-phys-body"></p><ul><li>N1 hile, N2 médiastin homolatéral, N3 controlatéral ou sus-claviculaire.</li><li>Verre dépoli : croissance lépidique ; composante solide : invasion.</li><li>p40 épidermoïde, TTF-1 adénocarcinome.</li><li>EGFR muté : kinase active sans ligand ; PD-L1 : frein des lymphocytes.</li><li>Valeur prédite = préopératoire × segments conservés / 19.</li></ul></template>
<template data-pop="pareto-c34-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="c34-p-1,c34-p-2,c34-p-3,c34-p-4"></p><ul><li>Platine, immunothérapie, inhibiteurs de kinase selon stade et profil.</li><li>Pembrolizumab 200 mg/3 semaines ; osimertinib 80 mg/jour ; durvalumab 1500 mg/4 semaines.</li><li>Pas d’osimertinib juste après immunothérapie ; pas de durvalumab si EGFR.</li><li>Osimertinib : inducteurs du CYP3A, QTc, pneumopathie interstitielle.</li><li>Immunothérapie : pneumopathie, prednisone 1–2 mg/kg dès le grade 2.</li></ul></template>
