<template data-pop="c34-paraneo" data-title="Syndromes paranéoplasiques du cancer bronchique"><p class="lab">Définition</p><p>Un syndrome paranéoplasique associe des signes cliniques, radiologiques ou biologiques à une néoplasie, indépendamment de son siège et de ses métastases. Il touche environ 10 % des patients atteints de cancer bronchique ; en outre, il précède souvent le diagnostic oncologique, si bien qu’il peut en être le premier signe (Revue médicale suisse 2018).</p><p class="lab">Mécanismes</p><p>Deux mécanismes dominent. D’une part, la tumeur sécrète une hormone ou un peptide, comme l’hormone antidiurétique, l’ACTH ou la PTHrP. D’autre part, le système immunitaire produit contre des antigènes tumoraux des anticorps qui atteignent aussi le système nerveux.</p><p class="lab">Principales formes</p><p>Sur le plan endocrinien, on retient la sécrétion inappropriée d’hormone antidiurétique et le syndrome de Cushing, surtout dans le cancer à petites cellules, ainsi que l’hypercalcémie humorale. Sur le plan neurologique, les syndromes auto-immuns précèdent le cancer dans plus de la moitié des cas. Enfin, l’ostéoarthropathie hypertrophiante et les thromboses complètent le tableau.</p><div class="key"><b>Conséquence pratique.</b> Un syndrome paranéoplasique peut résister au traitement symptomatique et ne céder qu’au traitement du cancer ; par conséquent, sa réapparition fait rechercher une rechute.</div></template>
<template data-pop="c34-tnm" data-title="Classification TNM du cancer bronchique, 9e édition"><p class="lab">Tumeur (T)</p><p>T1 regroupe les tumeurs de 3 cm au plus, entourées de poumon ou de plèvre viscérale : T1a jusqu’à 1 cm, T1b jusqu’à 2 cm, T1c jusqu’à 3 cm. T2 correspond ensuite aux tumeurs de plus de 3 cm et de 5 cm au plus, ou à celles qui envahissent la plèvre viscérale ou la bronche souche sans la carène : T2a jusqu’à 4 cm, T2b jusqu’à 5 cm. Au-delà, T 3 désigne les tumeurs de plus de 5 cm et de 7 cm au plus, l’invasion de la paroi, du péricarde ou du nerf phrénique et les nodules du même lobe. Enfin, T 4 désigne les tumeurs de plus de 7 cm, l’invasion du médiastin, de la carène, des gros vaisseaux ou du rachis et les nodules d’un autre lobe homolatéral.</p><p class="lab">Ganglions (N)</p><p>N1 désigne les ganglions hilaires ou intrapulmonaires homolatéraux. N2 désigne les ganglions médiastinaux homolatéraux ou sous-carénaires ; or la 9e édition le divise désormais en N2a (une station) et N2b (plusieurs stations). N3, enfin, désigne les ganglions controlatéraux ou sus-claviculaires.</p><p class="lab">Métastases (M)</p><p>M1a correspond aux atteintes intrathoraciques : poumon controlatéral, plèvre ou péricarde. M1b correspond à une métastase extrathoracique unique. En revanche, M1c1 et M1c2 désignent des métastases extrathoraciques multiples, dans un seul ou dans plusieurs systèmes d’organes.</p><div class="key"><b>Source.</b> IASLC, cartes de stadification de la 9e édition (2024) ; UICC, 9e édition (2025), en vigueur depuis le 1<sup>er</sup> janvier 2025.</div></template>
<template data-pop="c34-stations" data-title="Carte des stations ganglionnaires de l’IASLC"><p>La carte de l’IASLC définit 14 stations par des repères anatomiques ; ainsi, chaque ganglion reçoit un numéro reproductible. Les stations 1 sont sus-claviculaires ; viennent ensuite les stations 2 et 4, paratrachéales hautes et basses, séparées à droite et à gauche par le bord latéral gauche de la trachée. La station 3 est prévasculaire ou rétrotrachéale, tandis que les stations 5 et 6 entourent la crosse de l’aorte. Plus bas, la station 7 est sous-carénaire, et les stations 8 et 9 sont para-œsophagiennes et dans le ligament pulmonaire. Enfin, les stations 10 à 14 sont hilaires et intrapulmonaires.</p><div class="key"><b>Traduction en N.</b> Les stations 10 à 14 homolatérales correspondent à N1, les stations 2 à 9 homolatérales à N2 ; en revanche, les stations controlatérales et les stations 1 correspondent à N3.</div></template>
<template data-pop="c34-oms2021" data-title="Classification de l’OMS de 2021 sur petit prélèvement"><p>Sur une biopsie ou une cytologie, le pathologiste emploie une terminologie adaptée à la quantité de tissu, car il ne voit qu’une partie de la tumeur. Ainsi, il conclut à un carcinome à petites cellules sur la morphologie, et le marquage neuroendocrine n’est alors pas obligatoire. De même, il retient un carcinome épidermoïde ou un adénocarcinome lorsque les caractères morphologiques sont nets. À défaut, il parle de « carcinome non à petites cellules en faveur d’un épidermoïde » si p40 est positif, ou « en faveur d’un adénocarcinome » si TTF-1 est positif. En revanche, lorsque les deux marqueurs sont négatifs, le diagnostic reste « sans autre précision », catégorie que l’ESMO demande de maintenir au-dessous de 10 %.</p><div class="key"><b>Source.</b> ESMO 2023, tableau 1, adapté de l’OMS 2021.</div></template>
<template data-pop="c34-cbpc" data-title="Cancer bronchique à petites cellules"><p>Le cancer à petites cellules est un carcinome neuroendocrine de haut grade, dont le diagnostic repose d’abord sur la morphologie : petites cellules au cytoplasme réduit, chromatine fine, mitoses nombreuses et nécrose. Il croît vite et dissémine tôt ; c’est pourquoi le bilan doit être court. Il s’associe en outre plus souvent aux syndromes paranéoplasiques endocriniens et neurologiques.</p><p>Sur le plan thérapeutique, il répond initialement bien au platine et à l’étoposide. Dès lors, la forme limitée relève d’une chimioradiothérapie concomitante précoce, tandis que la forme étendue relève d’une chimio-immunothérapie (ESMO 2021).</p></template>
<template data-pop="c34-ecart-cbpc" data-title="Écart entre l’ESMO 2021 et l’autorisation suisse du durvalumab"><p class="lab">Ce que dit l’ESMO 2021</p><p>La recommandation de l’ESMO sur le cancer à petites cellules, publiée en 2021, prévoit dans la forme limitée une chimioradiothérapie concomitante suivie, en cas de réponse, d’une irradiation cérébrale prophylactique ; elle ne comporte en revanche aucune immunothérapie de consolidation.</p><p class="lab">Ce qu’autorise la Suisse</p><p>L’information professionnelle suisse d’Imfinzi autorise toutefois le durvalumab en monothérapie chez l’adulte atteint d’un cancer à petites cellules limité non opérable, sans progression après chimioradiothérapie à base de platine, à 1500 mg toutes les 4 semaines pendant 24 mois au plus. Cette indication repose sur un essai de phase III publié après la recommandation de l’ESMO.</p><div class="key"><b>Conséquence.</b> L’écart ne traduit pas une contradiction, mais un décalage de calendrier ; par conséquent, la décision se prend en concertation, en vérifiant la mise à jour de la recommandation de l’ESMO.</div></template>
<template data-pop="c34-egfr" data-title="Mutations EGFR et fusions ALK"><p>EGFR est un récepteur membranaire à activité tyrosine-kinase. Normalement, il ne s’active que lorsqu’un facteur de croissance s’y fixe. Or la délétion de l’exon 19 et la mutation L858R de l’exon 21 le maintiennent actif en permanence ; la cellule devient donc dépendante de ce signal. De même, une fusion du gène ALK crée une kinase constamment activée.</p><p>Ces altérations portent sur des adénocarcinomes, plus souvent chez des personnes ayant peu ou pas fumé. C’est pourquoi l’ESMO impose de les rechercher du stade IB au stade III pour l’EGFR, et aux stades II à III A résécables pour ALK, avant toute décision.</p><div class="key"><b>Conséquence pratique.</b> Une mutation EGFR oriente vers l’osimertinib et, à l’inverse, contre-indique le durvalumab de consolidation et la chimio-immunothérapie néoadjuvante.</div></template>
<template data-pop="c34-checkpoint" data-title="Points de contrôle immunitaires PD-1 et PD-L1"><p>Le récepteur PD-1, porté par les lymphocytes T, freine leur activité dans les tissus périphériques ; il protège ainsi contre l’auto-immunité. Or les cellules tumorales qui expriment PD-L1 se lient à ce récepteur et éteignent les lymphocytes qui devraient les détruire. Dès lors, un anticorps anti-PD-1, comme le pembrolizumab, ou anti-PD-L1, comme le durvalumab, empêche cette liaison et réactive la réponse immunitaire.</p><div class="key"><b>Revers prévisible.</b> En levant un frein de tolérance, ces anticorps peuvent provoquer des inflammations auto-immunes de n’importe quel organe.</div></template>
<template data-pop="c34-pa" data-title="Paquets-années"><p>Le nombre de paquets-années mesure l’exposition cumulée au tabac : il vaut le nombre de cigarettes fumées par jour divisé par 20, multiplié par le nombre d’années de tabagisme. Ainsi, Monsieur B., qui a fumé 20 cigarettes par jour pendant 42 ans, totalise 42 paquets-années.</p><p>Ce chiffre sert surtout à sélectionner les candidats au dépistage ; en effet, l’ESMO retient plus de 30 paquets-années chez les fumeurs actuels. En revanche, il ne doit jamais servir à écarter un cancer chez un patient symptomatique.</p></template>
<template data-pop="c34-radon" data-title="Radon"><p>Le radon est un gaz radioactif naturel, issu du sous-sol, qui s’accumule dans les locaux mal ventilés. Selon l’Office fédéral de la santé publique, il constitue en Suisse la deuxième cause de cancer du poumon après le tabac et serait responsable de 200 à 300 décès par an. C’est pourquoi le niveau de référence est fixé à 300 Bq/m³ dans les locaux où l’on séjourne plusieurs heures par jour.</p><div class="key"><b>Conséquence pratique.</b> Chez un patient atteint d’un cancer bronchique sans tabagisme important, il est donc utile de demander s’il habite une région ou un logement à forte concentration de radon.</div></template>
<template data-pop="c34-suva" data-title="Cancer bronchique et maladie professionnelle"><p>L’amiante et d’autres agents professionnels augmentent le risque de cancer bronchique. Dès lors, chez un patient exposé, le médecin signale le cas à l’assureur-accidents, en général la Suva, qui instruit la reconnaissance en maladie professionnelle selon la loi fédérale sur l’assurance-accidents. La reconnaissance ouvre ensuite droit aux prestations correspondantes.</p><div class="key"><b>Conséquence pratique.</b> Il faut donc noter le métier et les expositions dès la première consultation, car le patient lui-même ignore souvent l’exposition ancienne.</div></template>
<template data-pop="c34-comorb" data-title="Comorbidités qui limitent le traitement"><p>La bronchopneumopathie chronique obstructive partage avec le cancer le même facteur de risque ; par conséquent, elle réduit souvent la réserve respiratoire et peut interdire une résection. De même, une cardiopathie augmente le risque opératoire, ce qui justifie l’évaluation cardiaque demandée par l’ESMO. Enfin, une insuffisance rénale contre-indique le cisplatine, tandis qu’une pneumopathie interstitielle augmente le risque de toxicité pulmonaire des traitements.</p></template>
<template data-pop="c34-toux" data-title="Toux du fumeur"><p>Le fumeur tousse souvent ; dès lors, la toux n’alerte que si elle change de caractère, persiste sans explication ou s’associe à d’autres signes. Ainsi, une toux qui se modifie, une hémoptysie, une dyspnée, une douleur thoracique, un amaigrissement ou une perte d’appétit doivent conduire à une imagerie thoracique. Les recommandations britanniques du NICE proposent d’ailleurs une radiographie rapide dès qu’un ancien ou actuel fumeur de 40 ans ou plus présente l’un de ces symptômes sans explication.</p><div class="key"><b>Source.</b> National Institute for Health and Care Excellence, NG12, Suspected cancer: recognition and referral (version en vigueur).</div></template>
<template data-pop="c34-hemoptysie" data-title="Hémoptysie et cancer bronchique"><p>Une hémoptysie, même minime, doit faire rechercher un cancer bronchique chez un fumeur ou ancien fumeur ; en effet, la tumeur saigne en irritant la muqueuse ou en envahissant un vaisseau. En revanche, une hémoptysie abondante est une urgence vitale, car le sang inonde les voies aériennes : le patient est alors placé en position latérale du côté qui saigne, puis orienté vers l’endoscopie et l’embolisation (voir R04). Au stade avancé, enfin, la radiothérapie palliative contrôle souvent le saignement (ESMO 2023).</p></template>
<template data-pop="c34-siadh" data-title="Sécrétion inappropriée d’hormone antidiurétique"><p>La tumeur sécrète de l’hormone antidiurétique sans rapport avec les besoins de l’organisme ; le rein retient donc de l’eau libre et la natrémie baisse. Ce syndrome touche environ 10 % des cancers à petites cellules (Revue médicale suisse 2018).</p><p class="lab">Diagnostic</p><p>Il associe une hyponatrémie, une natriurèse normale ou élevée, une volémie normale et une hormone antidiurétique normale ou élevée. Cliniquement, il reste souvent asymptomatique ; toutefois, il peut provoquer des céphalées, des convulsions, voire un coma.</p><p class="lab">Traitement</p><p>La restriction hydrique est le traitement de première ligne ; en outre, le traitement du cancer corrige souvent le trouble.</p></template>
<template data-pop="c34-calcium" data-title="Hypercalcémie maligne"><p>L’hypercalcémie maligne est le syndrome paranéoplasique endocrinien le plus fréquent. Elle est due, dans 80 % des cas, à la sécrétion tumorale de PTHrP, peptide qui active le récepteur de la parathormone ; d’autres cas résultent de métastases osseuses. Dès lors, la biologie associe une calcémie et une calciurie élevées et une parathormone basse.</p><p>Le traitement associe une hyperhydratation, des diurétiques de l’anse et des bisphosphonates (Revue médicale suisse 2018). Cependant, comme pour tout syndrome paranéoplasique, seul le contrôle de la tumeur prévient la récidive.</p></template>
<template data-pop="c34-cushing" data-title="Syndrome de Cushing paranéoplasique"><p>Le syndrome de Cushing paranéoplasique représente 10 à 20 % des syndromes de Cushing et s’observe surtout dans le cancer à petites cellules, dont les cellules neuroendocrines sécrètent de l’ACTH. Il s’installe rapidement ; par conséquent, le tableau est souvent incomplet et le diagnostic difficile, si bien que l’imagerie recherche la tumeur primitive (Revue médicale suisse 2018).</p></template>
<template data-pop="c34-neuro" data-title="Syndromes neurologiques paranéoplasiques"><p>Ces syndromes résultent d’une réaction auto-immune spécifique dirigée contre le système nerveux. Ils sont souvent subaigus et précèdent le diagnostic du cancer dans plus de la moitié des cas. Les dégénérescences cérébelleuses, les encéphalites auto-immunes et les neuropathies sensitives représentent environ 60 % des tableaux ; en outre, le cancer à petites cellules s’associe au syndrome myasthénique de Lambert–Eaton.</p><div class="key"><b>Conséquence pratique.</b> Lorsque les anticorps visent un antigène intracellulaire, le traitement de la tumeur passe en premier ; en revanche, lorsqu’ils visent un antigène membranaire, les traitements immunomodulateurs sont plus efficaces (Revue médicale suisse 2018).</div></template>
<template data-pop="c34-oah" data-title="Ostéoarthropathie hypertrophiante et hippocratisme digital"><p>L’ostéoarthropathie hypertrophiante associe un hippocratisme digital, une polyarthrite et une périostite des os longs. Elle est paranéoplasique dans 90 % des cas, notamment dans les cancers pulmonaires ; on l’attribue à une sécrétion excessive de facteurs de croissance, comme le PDGF et le VEGF.</p><p class="lab">Technique de recherche</p><p>On recherche une perte de l’angle normal entre l’ongle et la base du doigt, un bombement de l’ongle et un élargissement de l’extrémité. Le traitement du cancer peut faire disparaître le syndrome ; en attendant, les douleurs répondent aux anti-inflammatoires non stéroïdiens (Revue médicale suisse 2018).</p></template>
<template data-pop="c34-ecog" data-title="Indice de performance de l’ECOG"><p>L’indice résume la capacité fonctionnelle du patient en une note de 0 à 5. Ainsi, 0 désigne un patient pleinement actif ; 1, un patient limité pour les efforts importants mais capable d’un travail léger ; 2, un patient autonome, incapable de travailler, levé plus de la moitié de la journée ; 3, un patient alité ou assis plus de la moitié de la journée ; 4, un patient totalement dépendant ; 5, le décès.</p><div class="key"><b>Conséquence pratique.</b> Au stade IV, l’ESMO réserve le traitement systémique aux indices 0 à 2 ; en revanche, aux indices 3 et 4, elle recommande des soins de support exclusifs.</div></template>
<template data-pop="c34-vcs" data-title="Syndrome cave supérieur"><p>La compression ou l’envahissement de la veine cave supérieure par la tumeur ou les ganglions médiastinaux gêne le retour veineux de la tête et des membres supérieurs. Il en résulte un œdème du visage et du cou, une turgescence jugulaire et une circulation veineuse collatérale thoracique.</p><p>Sur le plan thérapeutique, l’ESMO 2023 recommande la radiothérapie palliative et, dans le cancer non à petites cellules, l’endoprothèse veineuse. Toutefois, une preuve histologique doit être obtenue dès que possible, car le traitement de fond dépend du type tumoral.</p></template>
<template data-pop="c34-medullaire" data-title="Compression médullaire métastatique"><p>Une métastase vertébrale peut comprimer la moelle épinière ; elle se manifeste d’abord par une douleur rachidienne, puis par un déficit moteur, sensitif ou sphinctérien. Or le pronostic fonctionnel dépend de la rapidité de la prise en charge : c’est pourquoi l’ESMO recommande une radiothérapie précoce, qui soulage les symptômes neurologiques. Une IRM du rachis précise ensuite le niveau et l’étendue de la compression.</p></template>
