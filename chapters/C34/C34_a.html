<h1>Cancers bronchopulmonaires primitifs</h1><span class="status">Adulte · cancer bronchique non à petites cellules et à petites cellules · référentiels ESMO 2025, ESMO 2023, ESMO 2021, IASLC 2024 (TNM 9e édition), Swiss Cancer Screening Committee 2022, OFS 2025 · version de travail du 09.10.2026, non validée par un médecin</span></div>

<section class="ilot" id="c34-0"><h2><span class="n">0</span>Question clinique</h2><p>Monsieur B., 66 ans, ancien maçon, a fumé un paquet de cigarettes par jour pendant 42 ans ; il a arrêté il y a trois ans. Il consulte son médecin de famille pour une toux qui dure depuis cinq semaines malgré un traitement symptomatique, avec deux épisodes de crachats striés de sang. Il a perdu 6 kg en trois mois sans régime. La radiographie thoracique montre une opacité hilaire droite de contours irréguliers.</p><p>Trois questions structurent la suite. Ce tableau impose-t-il de rechercher un cancer bronchique, et par quel examen ? Comment obtenir à la fois le diagnostic histologique, les marqueurs moléculaires et le stade avant toute décision ? Et quelles options thérapeutiques dépendent de ces trois informations ?</p><div class="key"><b>Objectifs.</b> Reconnaître les signes d’appel et les <button class="w" data-k="c34-paraneo">syndromes paranéoplasiques (fenêtre de synthèse)</button> ; organiser le bilan diagnostique et d’extension selon l’ESMO 2025 ; appliquer la <button class="w" data-k="c34-tnm">classification TNM de 9e édition (tableau complet)</button> ; expliquer pourquoi la chirurgie, la radiothérapie, l’immunothérapie et les thérapies ciblées se combinent différemment selon le stade et le profil moléculaire ; situer le dépistage par scanner à faible dose dans le contexte suisse.</div><p class="src">Références : <a href="https://www.annalsofoncology.org/article/S0923-7534(25)00923-8/fulltext" target="_blank" rel="noopener">ESMO 2025, stades précoces et localement avancés</a> ; <a href="https://cancer-monitorage.bfs.admin.ch/fr/detail/C33-34/" target="_blank" rel="noopener">OFS, monitorage du cancer 2025</a>.</p></section>
<section class="ilot" id="c34-1"><h2><span class="n">1</span>Définitions et classification</h2><p>Le cancer bronchopulmonaire primitif est une tumeur maligne née de l’épithélium qui tapisse la trachée, les bronches, les bronchioles ou les alvéoles. Il se distingue des métastases pulmonaires d’un cancer d’un autre organe, beaucoup plus fréquentes chez un patient déjà suivi pour un cancer, et du <b>mésothéliome</b>, tumeur de la plèvre traitée au chapitre C45.</p><p>La CIM-10-GM sépare la trachée (C33), les bronches et le poumon (C34) et les sièges mal définis de l’appareil respiratoire (C39). L’Office fédéral de la statistique regroupe C33 et C34 dans ses statistiques, car le cancer de la trachée est rare et suit les mêmes principes de diagnostic.</p><h3>Classification histologique</h3><p>Le diagnostic suit la <button class="w" data-k="c34-oms2021">classification des tumeurs pulmonaires de l’Organisation mondiale de la santé de 2021 (principales catégories)</button>. La première question posée au pathologiste est binaire : s’agit-il d’un <b>carcinome à petites cellules</b> ou d’un carcinome <b>non à petites cellules</b> ?</p><div class="two"><div class="card"><h4>Cancer bronchique non à petites cellules</h4><p>Le CBNPC regroupe surtout l’<b>adénocarcinome</b>, qui naît en général en périphérie et porte le plus souvent les altérations moléculaires ciblables, et le <b>carcinome épidermoïde</b>, souvent proximal et lié au tabac. Le pathologiste doit préciser le sous-type, car il conditionne les tests moléculaires et certaines chimiothérapies ; le pémétrexed, par exemple, n’est employé que dans les histologies non épidermoïdes.</p></div><div class="card"><h4>Cancer bronchique à petites cellules</h4><p>Le <button class="w" data-k="c34-cbpc">CBPC (biologie et évolution)</button> est un carcinome neuroendocrine de haut grade. Son diagnostic est d’abord morphologique. Il croît vite, dissémine tôt et répond initialement bien à la chimiothérapie ; il obéit à une stratégie propre, présentée dans l’îlot 13.</p></div></div><div class="trap"><span class="k">Piège</span>Un « carcinome non à petites cellules sans autre précision » n’est pas un sous-type. L’ESMO demande d’employer l’immunohistochimie pour ramener cette catégorie au-dessous de 10 % des diagnostics, parce que le traitement en dépend.</div><div class="key"><b>À retenir.</b> Petites cellules ou non à petites cellules, puis sous-type du CBNPC : ces deux étapes précèdent les tests moléculaires et toute décision thérapeutique.</div><p class="src">Références : <a href="https://www.annalsofoncology.org/article/S0923-7534(22)04785-8/fulltext" target="_blank" rel="noopener">ESMO 2023, cancer métastatique sans addiction oncogénique, section Pathologie</a> ; <a href="https://cancer-monitorage.bfs.admin.ch/fr/detail/C33-34/" target="_blank" rel="noopener">OFS 2025</a>.</p></section>
<section class="ilot" id="c34-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>Dans le monde, plus de 2,2 millions de personnes reçoivent chaque année un diagnostic de cancer bronchique et plus de 1,8 million en meurent ; c’est la première cause de décès par cancer chez l’homme comme chez la femme. En Europe, la mortalité masculine baisse avec le recul du tabagisme, alors que la mortalité féminine continue d’augmenter (ESMO 2025).</p><h3>En Suisse</h3><p>Selon l’<button class="w" data-k="c34-ofs">Office fédéral de la statistique (données 2018–2022, publiées en novembre 2025)</button>, le cancer de la trachée, des bronches et du poumon représente en moyenne annuelle 2855 nouveaux cas chez l’homme et 2206 chez la femme, et 1898 décès chez l’homme et 1364 chez la femme. L’âge médian au diagnostic est d’environ 71 ans dans les deux sexes. Le risque d’en être atteint avant 70 ans est de 2,47 % chez l’homme et de 1,92 % chez la femme.</p><table class="t"><tr><th>Indicateur (2018–2022, moyenne annuelle)</th><th>Hommes</th><th>Femmes</th></tr><tr><td>Nouveaux cas</td><td>2855</td><td>2206</td></tr><tr><td>Décès</td><td>1898</td><td>1364</td></tr><tr><td>Taux d’incidence pour 100 000</td><td>45,9</td><td>32,2</td></tr><tr><td>Taux de mortalité pour 100 000</td><td>29,5</td><td>18,4</td></tr><tr><td>Âge médian au diagnostic</td><td>71,6 ans</td><td>71,2 ans</td></tr><tr><td>Âge médian au décès</td><td>73,4 ans</td><td>73,7 ans</td></tr></table><p>Le rapport entre décès et nouveaux cas, proche de deux tiers, traduit un pronostic encore défavorable, car une grande partie des cancers est découverte à un stade avancé. Le pronostic dépend d’abord du stade : l’ESMO rappelle que 25 à 50 % des patients opérés d’un stade I ou II récidivent et meurent de leur maladie malgré le traitement local, ce qui justifie les traitements systémiques périopératoires.</p><div class="key"><b>À retenir.</b> En Suisse, environ 5000 nouveaux cas et 3300 décès par an ; âge médian au diagnostic de 71 ans ; mortalité féminine encore en hausse en Europe.</div><p class="src">Références : <a href="https://cancer-monitorage.bfs.admin.ch/fr/detail/C33-34/" target="_blank" rel="noopener">OFS, Monitorage du cancer en Suisse, C33–C34, état au 05.08.2025</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(25)00923-8/fulltext" target="_blank" rel="noopener">ESMO 2025, Incidence and epidemiology</a>.</p></section>
<section class="ilot" id="c34-3"><h2><span class="n">3</span>De l’épithélium bronchique à la tumeur</h2><p>L’épithélium bronchique normal se renouvelle sous le contrôle de signaux de croissance qui ne sont émis qu’en réponse à un besoin, par exemple après une agression. Le cancer naît lorsqu’une cellule accumule des altérations de l’ADN qui rendent ce signal permanent et suppriment les freins de la division cellulaire. La fumée de tabac fournit les carcinogènes qui créent ces altérations ; l’ESMO attribue 90 % des cancers bronchiques au tabagisme actif ou passif.</p><h3>Deux voies qui commandent le traitement</h3><p>La première voie est la <b>dépendance oncogénique</b>. Dans une partie des adénocarcinomes, souvent chez des personnes ayant peu ou pas fumé, une seule altération suffit à entretenir la croissance : une <button class="w" data-k="c34-egfr">mutation activatrice du récepteur EGFR ou une fusion du gène ALK (mécanisme)</button>. La tumeur dépend alors de cette kinase activée, et un inhibiteur spécifique la fait régresser. C’est pourquoi l’ESMO impose de rechercher ces altérations avant de traiter un stade IB à III, et a fortiori un stade IV.</p><p>La seconde voie est l’<b>échappement immunitaire</b>. Les cellules tumorales, chargées de protéines anormales, devraient être reconnues et détruites par les lymphocytes T. Beaucoup expriment à leur surface PD-L1, qui se lie au récepteur PD-1 des lymphocytes et éteint leur activité : c’est un <button class="w" data-k="c34-checkpoint">point de contrôle immunitaire (mécanisme et blocage)</button>. Les anticorps anti-PD-1 ou anti-PD-L1 lèvent ce frein ; la proportion de cellules tumorales exprimant PD-L1 prédit en partie leur efficacité.</p><h3>De la tumeur aux symptômes</h3><p>La tumeur provoque des symptômes par trois mécanismes. La croissance locale irrite ou obstrue la bronche (toux, hémoptysie, pneumonie en aval) ou envahit la paroi et les nerfs (douleur, dysphonie par atteinte du nerf récurrent). La dissémination lymphatique et sanguine atteint les ganglions médiastinaux, le cerveau, les os, le foie et les surrénales. Enfin, la sécrétion d’hormones ou la réaction auto-immune contre des antigènes tumoraux produisent des <button class="w" data-k="c34-paraneo">syndromes paranéoplasiques (fenêtre de synthèse)</button> à distance de la tumeur.</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Schéma : de l’altération de l’ADN aux trois mécanismes des symptômes" font-family="Inter,sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="20" y="20" width="200" height="60" rx="6"/><rect x="250" y="20" width="200" height="60" rx="6"/><rect x="480" y="20" width="180" height="60" rx="6"/><path d="M220 50h30M450 50h30"/><path d="M570 80v30M110 110h460M110 110v20M340 110v20M570 110v20"/><rect x="20" y="130" width="190" height="80" rx="6"/><rect x="245" y="130" width="190" height="80" rx="6"/><rect x="470" y="130" width="190" height="80" rx="6"/></g><g fill="#222"><text x="30" y="45" font-weight="bold">Carcinogènes du tabac</text><text x="30" y="65">altérations de l’ADN</text><text x="260" y="45" font-weight="bold">Signal de croissance</text><text x="260" y="65">permanent, freins levés</text><text x="490" y="45" font-weight="bold">Tumeur qui échappe</text><text x="490" y="65">à l’immunité (PD-L1)</text><text x="30" y="155" font-weight="bold">Croissance locale</text><text x="30" y="175">toux, hémoptysie,</text><text x="30" y="195">douleur, dysphonie</text><text x="255" y="155" font-weight="bold">Dissémination</text><text x="255" y="175">ganglions, cerveau,</text><text x="255" y="195">os, foie, surrénales</text><text x="480" y="155" font-weight="bold">Action à distance</text><text x="480" y="175">hormones, auto-immunité :</text><text x="480" y="195">syndromes paranéoplasiques</text></g></svg><figcaption>Figure 1. Chaîne physiopathologique du cancer bronchique : altération de l’ADN, croissance autonome, échappement immunitaire, puis trois mécanismes de symptômes. Schéma original pour l’atlas.</figcaption></figure><div class="key"><b>À retenir.</b> Dépendance oncogénique et échappement immunitaire sont les deux cibles des traitements systémiques modernes ; les symptômes proviennent de la croissance locale, des métastases ou de l’action à distance.</div><p class="src">Références : <a href="https://www.annalsofoncology.org/article/S0923-7534(25)00923-8/fulltext" target="_blank" rel="noopener">ESMO 2025</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">information professionnelle Keytruda, mécanisme d’action</a>.</p></section>
<section class="ilot" id="c34-4"><h2><span class="n">4</span>Facteurs de risque</h2><p>Le <b>tabagisme</b> domine tous les autres facteurs : jusqu’à 30 % des fumeurs développent un cancer bronchique, et 90 % des cas sont attribuables au tabagisme actif ou à l’exposition passive (ESMO 2025). Le risque se mesure en <button class="w" data-k="c34-pa">paquets-années (calcul et usage)</button> et diminue progressivement après l’arrêt sans jamais rejoindre celui d’une personne n’ayant jamais fumé, ce qui explique que les anciens fumeurs restent éligibles au dépistage.</p><p>Les autres facteurs reconnus sont le <button class="w" data-k="c34-radon">radon (exposition domestique en Suisse)</button>, l’<b>amiante</b>, une radiothérapie thoracique antérieure et la pollution de l’air. L’amiante, encore présent dans les bâtiments construits avant 1990, concerne particulièrement les métiers du bâtiment, comme celui de Monsieur B. ; il relève de la <button class="w" data-k="c34-suva">reconnaissance en maladie professionnelle par la Suva (démarche)</button>.</p><p>La part génétique est en cours d’évaluation. Une étude américaine citée par l’ESMO a trouvé environ 15 % de variants germinaux pathogènes chez des patients atteints de cancer bronchique, surtout dans les gènes BRCA2, CHEK2 et ATM. Il n’existe à ce jour aucune recommandation de conseil génétique ni de dépistage pour ces porteurs.</p><div class="trap"><span class="k">Erreur fréquente</span>Croire qu’un cancer bronchique chez une personne qui n’a jamais fumé est rare au point de pouvoir être écarté. L’adénocarcinome du non-fumeur existe et porte plus souvent une altération ciblable ; une toux persistante avec hémoptysie mérite la même imagerie, quel que soit le tabagisme.</div><div class="key"><b>À retenir.</b> Tabac actif et passif, radon, amiante, radiothérapie thoracique, pollution. Chiffrer le tabagisme en paquets-années et noter le métier dès la première consultation.</div><p class="src">Références : <a href="https://www.annalsofoncology.org/article/S0923-7534(25)00923-8/fulltext" target="_blank" rel="noopener">ESMO 2025, Incidence and epidemiology</a> ; <a href="https://www.bag.admin.ch/fr/le-radon-provoque-le-cancer-du-poumon" target="_blank" rel="noopener">OFSP, radon</a>.</p></section>
<section class="ilot" id="c34-5"><h2><span class="n">5</span>Interroger : symptômes et syndromes paranéoplasiques</h2><p>L’interrogatoire précise d’abord le terrain : <button class="w" data-k="c34-pa">tabagisme en paquets-années (calcul)</button>, date d’arrêt, expositions professionnelles, antécédent de cancer ou de radiothérapie thoracique, <button class="w" data-k="c34-comorb">comorbidités qui limitent la chirurgie (bronchopneumopathie, cœur, rein)</button> et état fonctionnel. Il recherche ensuite des symptômes, presque toujours non spécifiques, dont c’est la persistance ou l’association qui doit alerter.</p><h3>Symptômes respiratoires et généraux</h3><p>La <button class="w" data-k="c34-toux">toux persistante ou modifiée (signification chez le fumeur)</button> est le signe le plus courant. L’<button class="w" data-k="c34-hemoptysie">hémoptysie (même minime)</button> doit faire rechercher un cancer chez tout fumeur ou ancien fumeur. La dyspnée, une douleur thoracique, des pneumonies récidivantes dans le même territoire, une dysphonie, l’amaigrissement et l’asthénie complètent le tableau. Des signes neurologiques, des douleurs osseuses ou une hépatomégalie peuvent révéler une forme métastatique.</p><div class="two"><div class="card"><h4>Présentation typique</h4><p>Fumeur ou ancien fumeur de plus de 50 ans, toux qui se modifie ou persiste sans explication, crachats sanglants, amaigrissement. L’imagerie thoracique s’impose sans attendre l’effet d’un traitement d’épreuve.</p></div><div class="card"><h4>Présentations trompeuses</h4><p>Pneumonie qui ne se résout pas ou récidive au même endroit, par obstruction bronchique ; hyponatrémie, hypercalcémie ou trouble neurologique sans cause évidente ; nodule découvert fortuitement sur un scanner réalisé pour une autre raison.</p></div></div><h3>Syndromes paranéoplasiques</h3><p>Les syndromes paranéoplasiques sont des manifestations dues à la tumeur mais indépendantes de son siège et de ses métastases. Selon la Revue médicale suisse (2018), ils touchent environ 10 % des patients atteints de cancer bronchique et précèdent parfois le diagnostic. Les plus importants sont la <button class="w" data-k="c34-siadh">sécrétion inappropriée d’hormone antidiurétique (SIADH, surtout dans le CBPC)</button>, l’<button class="w" data-k="c34-calcium">hypercalcémie par sécrétion de PTHrP (mécanisme et biologie)</button>, le <button class="w" data-k="c34-cushing">syndrome de Cushing paranéoplasique (sécrétion d’ACTH)</button>, les <button class="w" data-k="c34-neuro">syndromes neurologiques auto-immuns (dont le syndrome myasthénique de Lambert–Eaton)</button> et l’<button class="w" data-k="c34-oah">ostéoarthropathie hypertrophiante avec hippocratisme digital (signes)</button>.</p><div class="trap"><span class="k">Piège</span>Un syndrome paranéoplasique peut ne pas céder au traitement symptomatique habituel et ne répondre qu’au traitement du cancer ; sa réapparition chez un patient en rémission est un signe de rechute.</div><div class="key"><b>À retenir.</b> Toute hémoptysie ou toute toux persistante chez un fumeur ou ancien fumeur impose une imagerie thoracique ; une hyponatrémie ou une hypercalcémie inexpliquée peut révéler la tumeur.</div><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2018/revue-medicale-suisse-607/syndromes-paraneoplasiques-multiples-facettes" target="_blank" rel="noopener">Deletang et Py, Rev Med Suisse 2018;14:1018</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(22)04785-8/fulltext" target="_blank" rel="noopener">ESMO 2023, Staging and risk assessment</a>.</p></section>
<section class="ilot" id="c34-6"><h2><span class="n">6</span>Examiner : état général et extension</h2><p>L’examen clinique poursuit deux objectifs : mesurer la capacité du patient à recevoir un traitement, et rechercher des signes d’extension. L’ESMO exige de consigner l’amaigrissement et l’<button class="w" data-k="c34-ecog">indice de performance ECOG (échelle complète)</button>, car l’accès à la chirurgie, à la chimioradiothérapie et à l’immunothérapie en dépend.</p><div class="two"><div class="card"><h4>État général et constantes</h4><p>Poids, taille et perte de poids en pourcentage ; indice de performance ; fréquence respiratoire et saturation pulsée en oxygène au repos ; signes de dénutrition. Un patient alité plus de la moitié de la journée (ECOG 3 ou 4) relève en général de soins de support exclusifs au stade métastatique.</p></div><div class="card"><h4>Signes thoraciques</h4><p>Syndrome de condensation ou d’épanchement pleural (matité, abolition du murmure vésiculaire), wheezing localisé fixe évoquant une obstruction bronchique, dysphonie. Un <button class="w" data-k="c34-vcs">syndrome cave supérieur (œdème en pèlerine, circulation collatérale)</button> signe une compression médiastinale.</p></div></div><div class="two"><div class="card"><h4>Aires ganglionnaires</h4><p>Palper les creux sus-claviculaires et les régions cervicales : une adénopathie sus-claviculaire classe la maladie en N3 et offre souvent le site de biopsie le plus simple.</p></div><div class="card"><h4>Signes d’extension et paranéoplasiques</h4><p>Examen neurologique complet, douleur osseuse à la percussion, hépatomégalie ; <button class="w" data-k="c34-oah">hippocratisme digital (technique de recherche)</button>, signe de Pancoast–Tobias dans les tumeurs de l’apex (douleur de l’épaule, syndrome de Claude Bernard–Horner).</p></div></div><div class="key"><b>À retenir.</b> L’indice de performance et la perte de poids font partie du diagnostic au même titre que l’histologie : ils déterminent les traitements accessibles.</div><p class="src">Références : <a href="https://www.annalsofoncology.org/article/S0923-7534(25)00923-8/fulltext" target="_blank" rel="noopener">ESMO 2025, tableau 1</a> ; <a href="https://www.annalsofoncology.org/article/S0923-7534(22)04785-8/fulltext" target="_blank" rel="noopener">ESMO 2023, recommandations de bilan</a>.</p><button class="pareto-btn ui" data-k="pareto-c34-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
