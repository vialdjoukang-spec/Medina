, enfant, sujet âgé, gestes et antithrombotiques</a></li><li><a href="#d69-a11">Thrombopénies secondaires (D69.5) : thrombopénie induite par l’héparine et thrombopénies médicamenteuses</a></li><li><a href="#d69-a12">Pronostic, suivi, critères formels et paramètres clés</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="d69-a01"><h2><span class="n">1</span> Cas fil rouge et sémiologie du purpura</h2>
<p>Une tache rouge qui ne s’efface pas à la pression pose une question immédiate : le sang quitte-t-il les vaisseaux parce que les plaquettes sont trop peu nombreuses, parce que leur fonction est altérée, ou parce que la paroi vasculaire est atteinte ? La réponse commande l’urgence, l’examen décisif et le traitement.</p>
<h3 id="d69-a01-partie-1">1. Cas fil rouge : une femme de 34 ans avec des pétéchies et 8 G/L de plaquettes</h3><p>Une femme de 34 ans, patiente fictive, consulte pour des pétéchies des jambes, des ecchymoses et une épistaxis bilatérale. Son hémogramme montre 8 G/L de plaquettes ; le reste de la numération est normal. L’unité G/L signifie giga par litre, soit 10⁹ par litre : 8 G/L équivalent à 8 000 plaquettes par mm³, et un seuil de 20 000/mm³ s’écrit donc 20 G/L.</p><p>Les HUG publient un repère illustratif de 150–350 G/L ; l’intervalle individuel reste celui du laboratoire et figure sur son compte rendu. Les chiffres 100, 50, 30 et 20 G/L cités plus loin sont des seuils diagnostiques ou d’intervention, jamais des valeurs normales. Le cas est résolu à l’îlot 12, après avoir établi comment confirmer la <button class="w" data-k="d69-pseudothrombopenie">thrombopénie</button>, écarter ses imitations et choisir un traitement.</p>
<h3 id="d69-a01-partie-2">2. Définition : pétéchie, ecchymose et vitropression</h3><p>Le purpura désigne des taches hémorragiques, rouges ou violacées, qui traduisent une extravasation de sang hors des vaisseaux. La pétéchie est punctiforme ; l’ecchymose est plus large. Aucune des deux ne s’efface à la <button class="w" data-k="d69-vitropression">vitropression</button> : le médecin appuie une lame de verre sur la peau, et la tache qui persiste sous le verre contient du sang situé en dehors de la lumière vasculaire.</p><p>Ce test sépare le purpura des rougeurs vasculaires qui blanchissent sous la pression. Il ne dit rien de la cause : la même tache rouge persistante peut venir d’un déficit en plaquettes, d’une vascularite ou d’une fragilité de la peau.</p>
<h3 id="d69-a01-partie-3">3. Purpura vasculaire ou purpura thrombopénique : lire le relief et les saignements associés</h3><p>Deux grands tableaux se distinguent par l’aspect et par ce qui accompagne les taches. Le tableau ci-dessous les oppose ; il se lit de haut en bas, en cherchant d’abord le relief de la lésion puis les autres saignements.</p><table class="t"><thead><tr><th scope="col">Critère</th><th scope="col">Purpura vasculaire</th><th scope="col">Purpura thrombopénique</th></tr></thead><tbody><tr><th scope="row">Relief</th><td>Infiltré ; un purpura palpable oriente vers une vascularite.</td><td>Pétéchial et ecchymotique, non infiltré ; les pétéchies de la thrombopénie immunologique ne sont pas palpables.</td></tr><tr><th scope="row">Siège</th><td>Prédomine aux membres inférieurs ; aggravé par l’orthostatisme.</td><td>Surtout les jambes pour les pétéchies, avec atteinte possible des muqueuses.</td></tr><tr><th scope="row">Lésions associées</th><td>Urticaire, bulles, nécrose.</td><td>Épistaxis, gingivorragies, bulles hémorragiques buccales.</td></tr><tr><th scope="row">Examen qui tranche</th><td>Hémogramme normal ; biopsie selon la cause.</td><td>La numération recherche une thrombopénie ; le frottis et le contexte orientent sa cause.</td></tr></tbody></table><p>Une patiente dont les taches sont palpables et siègent aux chevilles est d’abord suspecte de vascularite ; une numération normale ne documente pas de thrombopénie ; le diagnostic causal reste à établir. À l’inverse, de vastes hématomes ou des hémarthroses évoquent un trouble de la coagulation plasmatique, comme l’hémophilie, plutôt qu’un déficit en plaquettes.</p>
<h3 id="d69-a01-partie-4">4. Imitations du purpura à ne pas confondre</h3><p>Plusieurs lésions rouges de la peau ressemblent à un purpura sans en être un. L’article d’enseignement de la Revue du Praticien cite les télangiectasies, les angiomes stellaires, les taches rubis et les angiokératomes comme diagnostics à ne pas confondre. La vitropression reste le premier geste de tri, car la définition du purpura repose sur la persistance de la tache sous la pression.</p><p>Une erreur fréquente consiste à demander un hémogramme pour une simple rougeur vasculaire ; l’erreur inverse est de rassurer devant un purpura vrai parce que la tache est discrète. Chez une patiente comme celle du cas fil rouge, des pétéchies multiples aux jambes ne relèvent jamais de cette catégorie d’imitations.</p>
<h3 id="d69-a01-partie-5">5. Deux urgences à écarter d’emblée</h3><p>Devant un purpura, deux urgences sont éliminées avant toute autre réflexion. La première est le <button class="w" data-k="d69-fulminans">purpura fulminans</button>, dû au méningocoque ou au pneumocoque : tout purpura fébrile y fait penser, surtout si l’extension est rapide, si au moins un élément est nécrotique ou ecchymotique de plus de 3 mm et si le syndrome infectieux est sévère. La ceftriaxone, citée à 100 mg/kg/j, s’administre sans délai ; la prise en charge détaillée relève du cours A39.</p><p>La seconde urgence est une thrombopénie inférieure à 20 000/mm³, soit 20 G/L, car elle expose à une hémorragie grave. Dans les deux cas, l’hémogramme en urgence avec frottis est le premier examen, et l’hospitalisation est discutée dès ce stade.</p>
<h3 id="d69-a01-partie-6">6. Lire une photographie de purpura pétéchial</h3><p>La photographie suivante illustre des lésions cutanées rouges punctiformes, parfois confluentes. Elle permet d’en observer la répartition ; leur relief et leur comportement à la vitropression doivent être évalués par l’examen clinique.</p><figure id="d69-img-petechies" data-evidence="IMG-D69-IMG-PETECHIES"><img src="assets/img/d69/alpha/codex/purpura-hektor.jpg" alt="Photographie de lésions rouges punctiformes ou confluentes de la peau ; relief et vitropression non évaluables sur cette image." loading="lazy"><figcaption>Photographie de purpura : lésions rouges punctiformes ou confluentes ; relief et vitropression non évaluables sur cette image. <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Purpura.jpg" target="_blank" rel="noopener">User:Hektor, CC BY-SA 3.0, via Wikimedia Commons — fichier et licence</a>. <a href="assets/img/d69/alpha/codex/purpura-hektor.jpg" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></figcaption></figure><p>La lecture décrit les lésions visibles et leur répartition. Le médecin recherche ensuite leur relief et réalise la vitropression lors de l’examen ; ni une thrombopénie ni son absence ne sont établies par la photographie. La photographie ne précise ni l’étiologie ni le nombre de plaquettes ; elle ne permet pas de conclure à une thrombopénie immunologique. L’hémogramme confirme la thrombopénie; le diagnostic de PTI exige l’examen du frottis, le contexte clinique et l’exclusion des autres causes (Onkopedia, section 5.1).</p>
<div class="key"><b>À retenir.</b> Le purpura est une tache hémorragique qui ne s’efface pas à la vitropression. L’aspect (infiltré ou non), le siège et les saignements associés orientent entre cause vasculaire et cause thrombopénique, tandis que la numération vérifie le nombre de plaquettes et que le frottis et le contexte complètent le diagnostic. Deux urgences passent avant tout : le purpura fébrile à extension rapide, traité comme un purpura fulminans, et la thrombopénie inférieure à 20 G/L.</div><div class="quiz ui"><p>Un patient fébrile présente un purpura dont certains éléments nécrotiques dépassent 3 mm et s’étendent rapidement. Que faire en premier ?</p><button data-ok="1">Traiter comme un purpura fulminans, avec une antibiothérapie par ceftriaxone sans attendre l’hémogramme.</button><button data-ok="0">Attendre le résultat de l’hémogramme avant toute antibiothérapie.</button><p class="fb" hidden>Le purpura fébrile fait évoquer un purpura fulminans, urgence infectieuse : la ceftriaxone ne doit pas être retardée. Le détail de la prise en charge relève du cours A39.</p></div><p class="src">Sources : <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a>.</p><button class="pareto-btn ui" data-k="pareto-d69-a01">▲ Loi de Pareto — Cas fil rouge et sémiologie du purpura</button></section>
<section class="ilot" id="d69-a02"><h2><span class="n">2</span> Définitions et grandes familles de la catégorie D69</h2>
<p>La catégorie D69 de la CIM-10-GM 2024 réunit des purpuras et d’autres diathèses hémorragiques. Le code ne prouve pas à lui seul un mécanisme ni la normalité du bilan de coagulation. Elle ne se comprend qu’en séparant trois questions : la paroi vasculaire est-elle fragile, la fonction plaquettaire est-elle défaillante, le nombre de plaquettes est-il insuffisant ?</p>
<h3 id="d69-a02-partie-1">1. Périmètre et exclusions de D69</h3><p>D69 regroupe, dans la CIM-10-GM 2024, le purpura et les autres diathèses hémorragiques. Quelques entités voisines en sont exclues et relèvent d’un autre chapitre : le purpura hyper(gamma)globulinémique bénin, la thrombocytémie essentielle, le purpura cryoglobulinémique, le purpura fulminans et le purpura thrombotique thrombocytopénique. Le purpura fulminans est codé D65.- et le purpura thrombotique thrombocytopénique M31.1.</p><p>Cette limite compte en pratique : devant un purpura fébrile ou une <button class="w" data-k="d69-mat">microangiopathie thrombotique</button>, le médecin ne classe pas le patient dans D69, car ces tableaux demandent une prise en charge urgente propre, détaillée dans d’autres cours.</p>
<h3 id="d69-a02-partie-2">2. Trois questions pour classer un saignement par défaut plaquettaire ou vasculaire</h3><p>Le tableau suivant organise la catégorie D69 selon le mécanisme et non selon l’ordre alphabétique des codes. Il se lit en commençant par la question clinique posée ; la colonne du code reste un repère de lecture.</p><table class="t"><thead><tr><th scope="col">Question clinique</th><th scope="col">Famille de maladies</th><th scope="col">Exemples et codes de la CIM-10-GM 2024</th><th scope="col">Exemple clinique</th></tr></thead><tbody><tr><th scope="row">La paroi vasculaire est-elle atteinte ?</th><td>Purpuras vasculaires</td><td>Purpura anaphylactoïde, vascularite allergique, purpura de Schoenlein-Henoch (D69.0) ; purpura sénile et purpura simplex (D69.2) ; fragilité capillaire héréditaire et pseudohémophilie vasculaire (D69.88).</td><td>Un purpura palpable des chevilles avec douleurs abdominales et plaquettes normales.</td></tr><tr><th scope="row">La fonction plaquettaire est-elle défaillante ?</th><td>Thrombopathies (D69.1)</td><td>Bernard-Soulier, Glanzmann, plaquettes grises, thrombasthénie, thrombopathie ; la maladie de Willebrand est exclue (D68.0-).</td><td>Saignements cutanéo-muqueux dès la naissance, avec un bilan de coagulation normal.</td></tr><tr><th scope="row">Le nombre de plaquettes est-il insuffisant ?</th><td>Thrombopénies</td><td>Thrombopénie immunologique, y compris syndrome d’Evans et maladie de Werlhof (D69.3) ; autres thrombopénies primaires (D69.40 et D69.41) ; thrombopénie induite par l’héparine de type I (D69.52) et de type II (D69.53) ; autres thrombopénies secondaires (D69.57, D69.58, D69.59) ; thrombopénie sans précision (D69.60, D69.61).</td><td>Une femme de 34 ans avec 8 G/L de plaquettes et un hémogramme sinon normal.</td></tr><tr><th scope="row">Un traitement est-il en cause ?</th><td>Diathèse hémorragique due aux antiagrégants (D69.80)</td><td>Le traitement au long cours sans saignement est exclu et relève de Z92.2.</td><td>Une ecchymose étendue chez un patient sous double antiagrégation.</td></tr><tr><th scope="row">Aucune cause précisée</th><td>Diathèse hémorragique sans précision (D69.9)</td><td>Autres diathèses précisées (D69.88).</td><td>Un saignement répété sans diagnostic arrêté.</td></tr></tbody></table><p>Le tableau montre que les codes suivent les mécanismes de la médecine : un même patient peut passer de D69.9 à D69.3 quand le diagnostic se précise. Les sous-codes D69.40, D69.41, D69.57 et D69.58 distinguent, pour les thrombopénies primaires et secondaires, la forme réfractaire à la transfusion de la forme qui ne l’est pas. Le syndrome TAR (Q87.2), la thrombopénie transitoire du nouveau-né (P61.0) et le syndrome de Wiskott-Aldrich (D82.0) sont exclus de D69.4-.</p>
<h3 id="d69-a02-partie-3">3. Purpura vasculaire, thrombopathie et thrombopénie : trois mots, trois mécanismes</h3><p>Une thrombopénie est un déficit du nombre de plaquettes. Une thrombopathie est une anomalie de leur fonction ; elle est constitutionnelle, comme la thrombasthénie de Glanzmann, ou plus rarement acquise, et peut s’accompagner d’un nombre abaissé, comme dans le syndrome de Bernard-Soulier. Un purpura vasculaire ne dépend pas du nombre des plaquettes : la paroi des vaisseaux est inflammatoire, comme dans la vascularite à IgA, ou fragile, comme dans le purpura sénile.</p><p>Cette distinction guide l’examen : l’hémogramme répond à la question du nombre, l’étude de l’agrégation répond à celle de la fonction, et l’examen clinique de la peau, complété par la biopsie, répond à celle de la paroi. Un saignement disproportionné pour une thrombopénie modérée fait ainsi évoquer une anomalie de fonction ou un <button class="w" data-k="d69-willebrand">type 2B de la maladie de Willebrand</button>.</p>
<h3 id="d69-a02-partie-4">4. Thrombopénie immunologique : une définition par exclusion et par un seuil</h3><p>Le terme PTI, pour thrombopénie immunologique, remplace l’ancienne expression « purpura thrombopénique idiopathique ». Un <button class="w" data-k="d69-pti-def">PTI</button> ne se diagnostique que si les plaquettes sont inférieures à 100 G/L à plusieurs reprises. Environ 80 % des PTI sont primaires, c’est-à-dire sans maladie associée, et 20 % sont secondaires, par exemple à un lupus ou à un lymphome.</p><p>Le seuil de 100 G/L est un seuil de définition. Il ne signifie pas que tout patient sous ce chiffre doit être traité : l’indication thérapeutique se décide sur le saignement, pas sur le chiffre seul (îlot 8). Le syndrome d’Evans, qui associe une thrombopénie et une cytopénie auto-immune, est inclus dans D69.3.</p>
<h3 id="d69-a02-partie-5">5. Stades évolutifs du PTI</h3><p>La Haute Autorité de santé française décrit trois périodes depuis le diagnostic. Le PTI est nouvellement diagnostiqué pendant les trois premiers mois, persistant de trois à douze mois et chronique au-delà de douze mois. Chez l’adulte, l’évolution devient chronique dans 60 à 70 % des cas, et la guérison spontanée après douze mois reste inférieure à 5 %.</p><p>Ces stades guident les décisions. Une splénectomie n’est pas discutée avant douze mois, et certains examens, comme la recherche d’anticorps spécifiques, sont réservés aux formes persistantes ou chroniques. Les deux premiers chiffres décrivent des adultes ; l’évolution de l’enfant est plus souvent favorable (îlot 10).</p>
<h3 id="d69-a02-partie-6">6. PTI et thrombopénies immunologiques qui ne sont pas un PTI</h3><p>Une thrombopénie d’origine immunologique n’est pas toujours un PTI. Onkopedia range à part la thrombopénie induite par l’héparine, la thrombopénie thrombotique immune induite par certains vaccins, le purpura post-transfusionnel et l’alloimmunisation néonatale. Ces entités ont leur mécanisme, leur diagnostic et leur traitement propres ; elles ne se traitent pas comme un PTI.</p><p>La thrombopénie induite par l’héparine est détaillée à l’îlot 11, car l’erreur y est lourde : poursuivre l’héparine, ou la remplacer par une autre héparine, prolonge l’exposition à l’antigène en cause et le risque de thrombose.</p>
<div class="key"><b>À retenir.</b> D69 se lit par mécanisme : paroi vasculaire, fonction plaquettaire, nombre de plaquettes. Le PTI est défini par des plaquettes inférieures à 100 G/L de façon répétée, en l’absence d’autre cause ; il est primaire dans 80 % des cas. Les entités immunologiques qui ne sont pas un PTI, dont la thrombopénie induite par l’héparine, suivent d’autres règles.</div><div class="quiz ui"><p>Quel seuil plaquettaire est exigé, de façon répétée, pour poser le diagnostic de PTI ?</p><button data-ok="1">Moins de 100 G/L.</button><button data-ok="0">Moins de 150 G/L.</button><p class="fb" hidden>Onkopedia définit le PTI par des plaquettes inférieures à 100 G/L à plusieurs reprises ; le seuil est diagnostique et n’indique pas à lui seul un traitement.</p></div><p class="src">Sources : <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d65-d69.htm" target="_blank" rel="noopener">BfArM — CIM-10-GM 2024, bloc D65–D69 (Stand 15.09.2023)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p><button class="pareto-btn ui" data-k="pareto-d69-a02">▲ Loi de Pareto — Définitions et grandes familles</button></section>
<section class="ilot" id="d69-a03"><h2><span class="n">3</span> Épidémiologie et physiopathologie</h2>
<p>Un PTI naît d’une double défaillance : des plaquettes détruites trop vite par le système immunitaire du patient et une moelle qui n’en fabrique pas assez pour compenser. Comprendre ce double mécanisme explique à la fois la clinique et le choix des traitements.</p>
<h3 id="d69-a03-partie-1">1. Fréquence du PTI chez l’adulte et chez l’enfant</h3><p>Onkopedia donne, chez l’adulte, une incidence de 0,2 à 0,4 pour 10 000 personnes par an et une prévalence de 0,9 à 2,6 pour 10 000, ce qui fait du PTI une maladie orpheline. L’âge moyen tend vers 60 ans ; les femmes sont plus touchées à l’âge moyen, les hommes après 60 ans. Chez l’enfant, l’incidence est de 0,2 à 0,7 pour 10 000 par an et la prévalence de 0,4 à 0,5 pour 10 000, avec un pic printanier.</p><p>Le protocole français indique, pour l’adulte, une incidence de 3 pour 100 000 par an, une prévalence proche de 50 pour 100 000 et un rapport femmes sur hommes d’environ 1,3, avec une incidence maximale chez l’homme de plus de 60 ans. Aucune donnée d’incidence propre à la Suisse n’a été trouvée : ces chiffres viennent des populations germanophones et françaises.</p>
<h3 id="d69-a03-partie-2">2. Destruction périphérique : auto-anticorps, rate et foie</h3><p>Dans le PTI, des <button class="w" data-k="d69-auto-anticorps">auto-anticorps</button> se fixent sur des glycoprotéines de la plaquette, notamment GPIIb/IIIa et GPIb/IX. La plaquette ainsi marquée se lie aux récepteurs Fc des macrophages et elle est détruite dans la rate et le foie. D’autres mécanismes s’y ajoutent : perte d’acide sialique des glycoprotéines, qui conduit à la capture hépatique par le récepteur d’Ashwell-Morell, lyse par le complément, inhibition fonctionnelle des récepteurs et anomalies des lymphocytes T et B.</p><p>Le PTI n’est pas héréditaire. On comprend ainsi pourquoi la transfusion de plaquettes est habituellement inefficace (îlot 6) et pourquoi la rate est un site thérapeutique (îlot 8).</p>
<h3 id="d69-a03-partie-3">3. Production insuffisante : le déficit relatif en thrombopoïétine</h3><p>La production médullaire compte autant que la destruction. Le PTI associe une destruction périphérique par les macrophages spléniques et une production médullaire insuffisante, donc inadaptée. Le taux de thrombopoïétine (TPO) est augmenté, mais moins qu’on ne l’attendrait pour une thrombopénie de même profondeur d’une autre cause : on parle de <button class="w" data-k="d69-tpo-relatif">déficit relatif en TPO</button>.</p><p>Ce constat a conduit à créer les agonistes du récepteur de la thrombopoïétine (romiplostim, eltrombopag, avatrombopag). Ils compensent la production insuffisante au lieu de freiner la destruction, ce qui explique leur place en seconde ligne (îlot 8).</p>
<h3 id="d69-a03-partie-4">4. Pourquoi le PTI saigne moins qu’une thrombopénie d’origine médullaire</h3><p>À chiffre égal, un patient atteint de PTI saigne moins qu’un patient dont la moelle ne produit plus de plaquettes, par exemple après chimiothérapie, au cours d’une myélodysplasie ou d’une leucémie. Au diagnostic, 10 % des enfants et 20 à 30 % des adultes n’ont aucun saignement ; ce taux reste de 30 à 40 % au stade chronique.</p><p>Onkopedia rapporte cette moindre tendance hémorragique sans en démontrer la cause dans le texte lu. Des micro-saignements cérébraux sont décrits en dessous de 15 G/L dans le PTI chronique. La conduite ne se fonde donc jamais sur le seul chiffre : elle tient compte des saignements, du contexte et des traitements associés.</p>
<h3 id="d69-a03-partie-5">5. Thrombopénie induite par l’héparine : consommation et activation</h3><p>Une <button class="w" data-k="d69-tih">thrombopénie induite par l’héparine</button> (TIH) est un effet indésirable immunologique qui touche 0,1 à 5 % des patients sous héparine. Elle est définie par une thrombopénie acquise (moins de 100 G/L ou chute relative d’au moins 30 %) et par la présence d’anticorps IgG dirigés contre le complexe formé par le facteur plaquettaire 4 et l’héparine.</p><p>La thrombopénie est de consommation et reste typiquement modérée, autour de 60 G/L. Les anticorps activent les plaquettes, les monocytes, les neutrophiles et les cellules endothéliales : le sang devient hypercoagulable, ce qui explique les thromboses veineuses et artérielles. Le risque dominant est donc la thrombose et non l’hémorragie.</p>
<h3 id="d69-a03-partie-6">6. Autres mécanismes : Glanzmann, Bernard-Soulier et vascularite à IgA</h3><p>Dans la thrombasthénie de <button class="w" data-k="d69-glanzmann">Glanzmann</button>, l’intégrine αIIbβ3 (GPIIb-IIIa), récepteur indispensable à l’agrégation, est quantitativement ou qualitativement anormale : il n’y a pas d’agrégation plaquettaire. Dans le syndrome de <button class="w" data-k="d69-bernard-soulier">Bernard-Soulier</button>, la ristocétine n’agglutine pas les plaquettes, qui sont en outre peu nombreuses et grandes.</p><p>Dans la vascularite à IgA, des dépôts d’IgA1 touchent les petits vaisseaux : le défaut est dans la paroi, pas dans les plaquettes. Le mécanisme moléculaire du syndrome de Bernard-Soulier n’a pas été lu dans une source datée et n’est pas affirmé ici.</p>
<div class="key"><b>À retenir.</b> Le PTI associe une destruction des plaquettes par auto-anticorps, dans la rate et le foie, et une production médullaire insuffisante liée à un déficit relatif en TPO. La TIH, à l’inverse, est une thrombopénie de consommation avec hypercoagulabilité : le risque est la thrombose. Aucune donnée épidémiologique propre à la Suisse n’est disponible dans le dossier pour le PTI.</div><div class="quiz ui"><p>Pourquoi les agonistes du récepteur de la TPO sont-ils logiques dans le PTI ?</p><button data-ok="1">Parce que la TPO est augmentée mais moins qu’attendu : la production médullaire est insuffisante.</button><button data-ok="0">Parce qu’ils bloquent les récepteurs Fc des macrophages.</button><p class="fb" hidden>Le déficit relatif en TPO justifie des médicaments qui stimulent la production ; le blocage des récepteurs Fc n’est pas leur mécanisme.</p></div><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://smw.ch/index.php/smw/article/download/2776/4481/13684" target="_blank" rel="noopener">Working Party Hemostasis de la SGH-SSH — Alberio et collaborateurs, anticoagulants dans la thrombopénie induite par l’héparine en Suisse (Swiss Med Wkly 2020 ; 150:w20210)</a> ; <a data-reference-source="1" href="https://www.orpha.net/fr/disease/detail/274" target="_blank" rel="noopener">Orphanet — Syndrome de Bernard-Soulier (ORPHA:274)</a> ; <a data-reference-source="1" href="https://www.orpha.net/pdfs/data/patho/Emg/Int/fr/ThrombasthenieGlanzmann_FR_fr_EMG_ORPHA849.pdf" target="_blank" rel="noopener">Orphanet Urgences — Thrombasthénie de Glanzmann : bonnes pratiques en cas d’urgence (2022)</a>.</p><button class="pareto-btn ui" data-k="pareto-d69-a03">▲ Loi de Pareto — Épidémiologie et physiopathologie</button></section>
<section class="ilot" id="d69-a04"><h2><span class="n">4</span> Anamnèse et examen clinique</h2>
<p>L’interrogatoire et l’examen d’un patient qui a des taches rouges et des plaquettes basses répondent à trois questions : où et comment le patient saigne-t-il, une cause secondaire est-elle visible, et le saignement est-il déjà grave ? Les réponses valent davantage que le chiffre plaquettaire seul.</p>
<h3 id="d69-a04-partie-1">1. Anamnèse : saignements, médicaments, infections, terrain et famille</h3><p>Onkopedia demande de documenter les saignements et leur ancienneté, les infections, tous les médicaments dont les anticoagulants, les vaccins récents, l’alcool, une grossesse, des thromboses antérieures, les antécédents familiaux et la profession. Chaque rubrique cherche une cause précise : un médicament introduit récemment évoque une thrombopénie médicamenteuse, une grossesse oriente vers une thrombopénie gestationnelle ou un HELLP, des antécédents familiaux évoquent une forme constitutionnelle.</p><p>Le médecin interroge aussi sur la phytothérapie et l’automédication, parce qu’une substance non prescrite peut être en cause. Dans le scénario du cas fil rouge, la patiente ne prend aucun médicament, n’est pas enceinte et n’a aucun antécédent familial : ces trois réponses rendent un PTI primaire plausible, sans le prouver.</p>
<h3 id="d69-a04-partie-2">2. Le siège du saignement indique la profondeur de la thrombopénie</h3><p>La gravité clinique prime sur le chiffre, mais les deux concordent dans les grandes lignes. Le tableau suivant donne le niveau plaquettaire habituellement associé à chaque type de saignement ; il se lit comme un repère, non comme une loi, car la variabilité individuelle est forte.</p><table class="t"><thead><tr><th scope="col">Type de saignement</th><th scope="col">Niveau de plaquettes habituel</th><th scope="col">Ce que le médecin en retient</th></tr></thead><tbody><tr><th scope="row">Cutané ou muqueux (pétéchies, ecchymoses, épistaxis, gingivorragies)</th><td>Généralement moins de 20 G/L.</td><td>Le saignement visible est compatible avec le chiffre ; le malade est évalué pour l’hospitalisation.</td></tr><tr><th scope="row">Hémorragie digestive, cérébro-méningée ou hématurie macroscopique</th><td>Généralement moins de 10 G/L ou prise d’un anticoagulant.</td><td>Le saignement est grave ; un traitement urgent est discuté.</td></tr><tr><th scope="row">Saignement digestif, urinaire ou gynécologique</th><td>Quel que soit le chiffre.</td><td>Une lésion organique est recherchée, car la thrombopénie ne suffit pas à l’expliquer.</td></tr></tbody></table><p>Une femme de 34 ans qui a 8 G/L et une épistaxis entre donc dans la première ligne. Elle saigne à un niveau compatible avec le chiffre. Si elle avait un méléna ou une hématurie avec 60 G/L, le médecin chercherait une autre cause. Onkopedia note aussi que l’hémorragie intracérébrale reste inférieure à 1 à 2 % dans le PTI.</p>
<h3 id="d69-a04-partie-3">3. Grades hémorragiques de l’OMS</h3><p>Onkopedia mesure l’intensité d’un saignement par les <button class="w" data-k="d69-grades-oms">grades hémorragiques de l’OMS</button>, de 0 à IV. Le grade fixe le vocabulaire commun entre médecins et conditionne l’urgence.</p><table class="t"><thead><tr><th scope="col">Grade</th><th scope="col">Définition</th><th scope="col">Lecture</th></tr></thead><tbody><tr><th scope="row">0</th><td>Aucun saignement.</td><td>Pas de saignement.</td></tr><tr><th scope="row">I</th><td>Pétéchies, ecchymoses de moins de 10 cm, épistaxis de moins d’une heure sans intervention.</td><td>Saignements mineurs.</td></tr><tr><th scope="row">II</th><td>Ecchymoses de plus de 10 cm, épistaxis de plus d’une heure ou nécessitant un tamponnement, méléna, hématémèse ou hématurie sans transfusion.</td><td>Saignement plus important, sans transfusion.</td></tr><tr><th scope="row">III</th><td>Saignement nécessitant une transfusion.</td><td>Les IgIV s’ajoutent aux corticoïdes (îlot 6).</td></tr><tr><th scope="row">IV</th><td>Hémorragie rétinienne avec baisse visuelle, hémorragie du système nerveux central ou menace pour un organe.</td><td>Hémorragie critique, vitale ou menaçant un organe.</td></tr></tbody></table><p>Pour lire le tableau, le médecin classe d’abord le saignement le plus grave, puis il vérifie qu’aucun critère supérieur n’est rempli. Un malade qui a une épistaxis de deux heures est de grade II, même s’il n’a pas besoin de transfusion.</p>
<h3 id="d69-a04-partie-4">4. Saignement critique selon l’ISTH</h3><p>Le <button class="w" data-k="d69-isth">saignement critique</button> est défini par l’International Society on Thrombosis and Haemostasis en 2021. Il comprend les hémorragies intracrâniennes, intrarachidiennes, intraoculaires, rétropéritonéales, péricardiques et intramusculaires avec syndrome des loges menaçant, ainsi que toute hémorragie qui entraîne une instabilité hémodynamique ou respiratoire.</p><p>Un saignement critique relève de l’urgence vitale. Il déclenche l’escalade thérapeutique de l’îlot 6 : association de corticoïdes, d’IgIV et de transfusions de plaquettes.</p>
<h3 id="d69-a04-partie-5">5. Signes de gravité : le « wet purpura » et les bulles hémorragiques</h3><p>Le « wet purpura » désigne le purpura associé à des saignements muqueux, comme des bulles hémorragiques buccales, des gingivorragies ou une épistaxis. Les facteurs de saignement grave recensés par Onkopedia sont l’âge supérieur à 60 ans, des plaquettes inférieures à 20–30 G/L, une infection, une hématurie, des hématomes multiples, les saignements muqueux, un antécédent de saignement grave, l’absence de réponse aux corticoïdes et, chez l’enfant, un score de Buchanan d’au moins 3.</p><p>Le score de Khellaf attribue 5 points aux bulles hémorragiques ou aux gingivorragies spontanées ; le score de Buchanan range les bulles hémorragiques en grade 3b. Les deux scores traduisent la même idée : l’atteinte muqueuse annonce un risque hémorragique plus élevé qu’un purpura cutané isolé.</p><figure id="d69-img-buccal" data-evidence="IMG-D69-IMG-BUCCAL"><img src="assets/img/cycle3/d69/oral_petechiae.jpg" alt="Lèvre inférieure portant plusieurs petites taches rouge sombre et une petite bulle hémorragique sur la muqueuse." loading="lazy"><figcaption>Pétéchies et petites bulles hémorragiques de la muqueuse de la lèvre inférieure, décrites par l'auteur chez un patient atteint de thrombopénie immunologique : saignement muqueux, signe de gravité. <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Oral_petechiae.JPG" target="_blank" rel="noopener">Mdscottis, CC BY-SA 3.0, via Wikimedia Commons — fichier et licence</a>. <a href="assets/img/cycle3/d69/oral_petechiae.jpg" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></figcaption></figure><p>La photographie ci-dessus montre des pétéchies et une petite bulle hémorragique de la lèvre inférieure, chez un patient atteint de thrombopénie immunologique selon son auteur. Le médecin examine toute la cavité buccale, car l’atteinte muqueuse signale un risque hémorragique plus élevé que les pétéchies cutanées.</p>
<h3 id="d69-a04-partie-6">6. Examen physique et drapeaux rouges d’une forme constitutionnelle</h3><p>L’examen cherche des signes de saignement (peau, muqueuses), de maladie associée et de cause alternative : ganglions, foie et rate. La splénomégalie n’est pas typique d’un PTI primaire ; sa présence fait chercher une autre cause, par l’imagerie à la recherche d’un lymphome ou d’une maladie de Gaucher. Une hypertension portale peut entraîner un hypersplénisme sans splénomégalie, avec une thrombopénie voisine de 50 G/L.</p><p>Plusieurs signes évoquent une <button class="w" data-k="d69-constitutionnelle">thrombopénie constitutionnelle</button> plutôt qu’un PTI : des manifestations extrahématologiques (eczéma, surdité, cataracte précoce, atteinte rénale, infections, malformations), des antécédents familiaux de thrombopénie, d’hémorragie grave ou d’hémopathie, une thrombopénie stable résistante aux traitements, des saignements au-dessus de 50 G/L, des plaquettes très petites ou géantes et des inclusions de Döhle. Certains gènes (RUNX1, ETV6, ANKRD26) prédisposent aussi aux hémopathies malignes.</p>
<div class="key"><b>À retenir.</b> L’anamnèse cherche une cause ; l’examen cherche la gravité. Le siège du saignement doit correspondre au chiffre plaquettaire : sinon, une autre cause est recherchée. Les grades de l’OMS et la définition ISTH fixent le niveau d’urgence, et l’atteinte muqueuse (« wet purpura ») signale un risque accru.</div><div class="quiz ui"><p>Un patient a une épistaxis de plus d’une heure nécessitant un tamponnement. Quel grade hémorragique de l’OMS ?</p><button data-ok="1">Grade II.</button><button data-ok="0">Grade IV.</button><p class="fb" hidden>Selon Onkopedia, une épistaxis de plus d’une heure ou avec tamponnement correspond au grade II ; le grade IV exige une hémorragie rétinienne, du système nerveux central ou menaçante pour un organe.</p></div><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://afpa.org/content/uploads/2025/04/HAS-synthese_mg_pti__de_l_enfant_et_de_l_adolescent.pdf" target="_blank" rel="noopener">HAS/CEREVANCE — PNDS PTI de l’enfant et de l’adolescent, synthèse pour le pédiatre de ville et le médecin généraliste (janvier 2025)</a>.</p><button class="pareto-btn ui" data-k="pareto-d69-a04">▲ Loi de Pareto — Anamnèse et examen clinique</button></section>
<section class="ilot" id="d69-a05"><h2><span class="n">5</span> Thrombopénie immunologique (D69.3) : diagnostic positif</h2>
<p>Aucun examen ne prouve le PTI : le diagnostic repose sur un faisceau d’arguments et sur l’exclusion des autres causes de thrombopénie. Le médecin cherche d’abord les imitations bénignes, puis les causes secondaires, avant de retenir un PTI primaire.</p>
<h3 id="d69-a05-partie-1">1. Un diagnostic d’exclusion : les critères internationaux</h3><p>Onkopedia présente les éléments qui soutiennent un diagnostic d’exclusion. Aucun examen isolé, ni la seule réponse au traitement, ne prouve un PTI. Les plaquettes sont inférieures à 100 G/L à plusieurs reprises ; aucune autre cause n’explique la thrombopénie ; les leucocytes et les érythrocytes sont normaux en nombre et en morphologie, sauf anémie par carence en fer ; la tendance hémorragique est faible pour le chiffre ; le chiffre double sous glucocorticoïdes ou IgIV avec une valeur atteinte supérieure à 30 G/L. Le PTI est un diagnostic d’exclusion : aucun test ne le prouve.</p><p>Chez la patiente du cas fil rouge, deux critères sont déjà remplis : la thrombopénie isolée et l’hémogramme normal par ailleurs. La réponse au traitement et l’exclusion des causes secondaires sont acquises plus tard.</p>
<h3 id="d69-a05-partie-2">2. Bilan minimal : chaque examen pose une question précise</h3><p>Le bilan de base associe l’interrogatoire, l’examen et des examens biologiques. Le tableau suivant relie chaque examen du <button class="w" data-k="d69-bilan-base">bilan de base</button> à la question qu’il tranche ; il se lit en suivant la colonne de la question, car un examen demandé sans question précise n’apporte rien.</p><table class="t"><thead><tr><th scope="col">Examen</th><th scope="col">Question posée</th><th scope="col">Source</th></tr></thead><tbody><tr><th scope="row">Hémogramme sur EDTA et sur citrate, frottis lu par un expert</th><td>La thrombopénie est-elle réelle ? Existe-t-il des agrégats, des schizocytes, d’autres cytopénies ?</td><td>Onkopedia, PNDS</td></tr><tr><th scope="row">Quick/INR, TCA, fibrinogène</th><td>La coagulation plasmatique est-elle normale ? Une CIVD est-elle possible ?</td><td>Onkopedia, PNDS</td></tr><tr><th scope="row">Réticulocytes, haptoglobine, LDH, bilirubine libre ; groupe et recherche d’anticorps si anémie</th><td>Une hémolyse auto-immune est-elle associée (syndrome d’Evans) ?</td><td>PNDS, Onkopedia</td></tr><tr><th scope="row">Bilan hépatique et créatinine</th><td>Une hépatopathie ou une atteinte rénale explique-t-elle le tableau ?</td><td>PNDS</td></tr><tr><th scope="row">IgG, IgA, IgM ; électrophorèse</th><td>Existe-t-il un déficit immunitaire commun variable ? Onkopedia rapporte un PTI chez environ 8 % des patients atteints de ce déficit, sans donner ici la proportion inverse.</td><td>Onkopedia, PNDS</td></tr><tr><th scope="row">Sérologies VHB, VHC, VIH ; anticorps antinucléaires</th><td>Une infection ou une maladie auto-immune est-elle en cause ?</td><td>PNDS</td></tr><tr><th scope="row">Glycémie</th><td>Un diabète est-il à connaître avant une corticothérapie ?</td><td>Onkopedia</td></tr></tbody></table><p>Le résultat « normal » du bilan est celui qui confirme le diagnostic. Un patient dont tous les examens sont normaux et dont les plaquettes sont isolément basses relève d’un PTI primaire. À l’inverse, une anomalie d’une autre lignée change la question et appelle le myélogramme (îlot 2 de l’onglet Examens).</p>
<h3 id="d69-a05-partie-3">3. La réponse aux corticoïdes comme argument</h3><p>La réponse thérapeutique fait partie des critères : un doublement du chiffre avec une valeur atteinte supérieure à 30 G/L sous corticoïdes ou IgIV soutient l’origine immunologique. Le PNDS précise que, chez un patient dont le chiffre dépasse 20 G/L sans saignement ni comorbidité, aucun traitement n’est en général nécessaire, mais qu’une courte corticothérapie au diagnostic peut confirmer l’origine immunologique.</p><p>Cette réponse reste un argument, non une preuve. Une absence de réponse n’exclut pas le PTI, mais elle fait remettre en question le diagnostic et chercher une cause secondaire.</p>
<h3 id="d69-a05-partie-4">4. PTI secondaires : trois causes fréquentes, trois confusions fréquentes</h3><p>Les causes les plus fréquentes de PTI secondaire sont les maladies auto-immunes, en premier lieu le lupus, les médicaments et la leucémie lymphoïde chronique. D’autres causes à rechercher sont le syndrome des antiphospholipides, l’infection par le VIH ou le VHC, le déficit immunitaire commun variable et le syndrome d’<button class="w" data-k="d69-evans">Evans</button>.</p><p>Les trois diagnostics le plus souvent confondus avec un PTI sont la thrombopénie médicamenteuse, les myélodysplasies et les hépatopathies. Chez l’enfant, la leucémie aiguë lymphoblastique est le diagnostic différentiel le plus important. Le médecin cherche ces causes par un bilan ciblé : anticorps antinucléaires, antiphospholipides, sérologies, électrophorèse et immunoglobulines, test direct à l’antiglobuline.</p>
<h3 id="d69-a05-partie-5">5. Thrombopénie médicamenteuse et inhibiteurs de points de contrôle</h3><p>La <button class="w" data-k="d69-medicament-pti">thrombopénie immunologique médicamenteuse</button> a une incidence de 0,1 pour 10 000 par an. Elle est aiguë et la récupération est rapide à l’arrêt. Les associations fréquemment rapportées incluent des vaccins, l’alemtuzumab, la doxycycline, le cotrimoxazole, la vancomycine, des chimiothérapies, l’aciclovir, le sofosbuvir, le bisoprolol et le clopidogrel.</p><p>Un PTI sous inhibiteurs de points de contrôle apparaît 10 à 20 semaines après le début du traitement. Le médecin interroge aussi le patient sur la phytothérapie et l’automédication, puis demande un avis de pharmacovigilance. L’arrêt du médicament suspect est le premier acte thérapeutique.</p>
<h3 id="d69-a05-partie-6">6. Arguments pour un PTI primaire ou secondaire</h3><p>Le tableau suivant oppose les arguments qui soutiennent un PTI primaire à ceux qui font chercher une cause secondaire. Il se lit comme une liste de contrôle : un seul argument secondaire suffit à changer la conduite.</p><table class="t"><thead><tr><th scope="col">Élément</th><th scope="col">Soutient un PTI primaire</th><th scope="col">Fait chercher une cause secondaire</th></tr></thead><tbody><tr><th scope="row">Hémogramme</th><td>Plaquettes seules basses ; autres lignées normales.</td><td>Anémie, neutropénie, macrocytose ou schizocytes.</td></tr><tr><th scope="row">Examen</th><td>Pas de splénomégalie ni de syndrome tumoral.</td><td>Splénomégalie, ganglions, signes généraux.</td></tr><tr><th scope="row">Terrain</th><td>Pas de médicament récent ni de maladie connue.</td><td>Lupus, antiphospholipides, VIH, VHC, leucémie lymphoïde chronique, déficit immunitaire.</td></tr><tr><th scope="row">Évolution</th><td>Réponse aux corticoïdes ou aux IgIV.</td><td>Absence de réponse aux corticoïdes, infections récidivantes.</td></tr></tbody></table><p>Dans le cas fil rouge, le tableau penche vers un PTI primaire. La vérification se poursuit avec les examens du bilan, car un syndrome d’Evans ou un lupus peut commencer par une thrombopénie isolée.</p>
<div class="key"><b>À retenir.</b> Le PTI se diagnostique par exclusion, sur des plaquettes inférieures à 100 G/L à plusieurs reprises et un hémogramme par ailleurs normal. Le bilan répond à des questions précises. Les causes secondaires (lupus, médicaments, leucémie lymphoïde chronique) et les confusions (médicaments, myélodysplasies, hépatopathies) sont recherchées avant d’étiqueter un PTI primaire.</div><div class="quiz ui"><p>Un test sanguin spécifique positif permet-il de confirmer un PTI ?</p><button data-ok="1">Non : le PTI est un diagnostic d’exclusion, aucun test ne le prouve.</button><button data-ok="0">Oui, la recherche d’anticorps antiplaquettes confirme le diagnostic.</button><p class="fb" hidden>Onkopedia insiste sur ce point : aucun test ne prouve le PTI. Les anticorps spécifiques n’ont une sensibilité que de 63 % environ.</p></div><p class="src">Sources : <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a>.</p><button class="pareto-btn ui" data-k="pareto-d69-a05">▲ Loi de Pareto — Diagnostic positif du PTI</button></section>
<section class="ilot" id="d69-a06"><h2><span class="n">6</span> Urgences et critères d’hospitalisation</h2>
<p>Un malade saigne ou menace de saigner : l’urgence se mesure à la localisation du saignement, au retentissement hémodynamique et au chiffre plaquettaire. La conduite initiale combine des mesures générales et un traitement immunologique rapide.</p>
<h3 id="d69-a06-partie-1">1. Quand hospitaliser</h3><p>Le PNDS recommande l’hospitalisation pour toute découverte de plaquettes inférieures à 20 G/L sans diagnostic posé. Elle est indispensable en cas de saignements muqueux ou sévères (bulles buccales, épistaxis bilatérale, hématurie, métrorragies, hémorragie digestive ou intracrânienne), de comorbidités modifiant le risque comme un traitement anticoagulant, d’un contexte social insuffisant, ou d’un PTI corticorésistant connu, inférieur à 20 G/L, avec antécédent hémorragique sévère.</p><p>Une patiente avec 8 G/L et une épistaxis bilatérale remplit deux de ces critères : elle est hospitalisée, puis le frottis et le bilan systématique sont réalisés sans attendre.</p>
<h3 id="d69-a06-partie-2">2. Définition de l’urgence vitale</h3><p>Le PNDS définit l’urgence vitale par un saignement du système nerveux central, par un saignement digestif, intra-abdominal, génital ou urinaire avec retentissement hémodynamique ou déglobulisation de plus de 2 g/dL, ou par un geste urgent nécessaire. Onkopedia ajoute les IgIV aux corticoïdes dès un saignement de grade III ou IV, un saignement critique ou une chirurgie non différable.</p><p>Ces définitions déclenchent le traitement le plus intensif, décrit ci-dessous.</p>
<h3 id="d69-a06-partie-3">3. Traitement d’urgence : la triple association</h3><p>La <button class="w" data-k="d69-triple">triple association</button> du PNDS combine trois éléments. Les corticoïdes sont de la méthylprednisolone 15 mg/kg/j, au maximum 1 g, de J1 à J3, ou de la dexaméthasone 40 mg par voie intraveineuse pendant 4 jours. Les IgIV sont données à 1 g/kg à J1 et J2. Les plaquettes sont transfusées toutes les 8 heures, avec des cibles de 100 G/L jusqu’à stabilisation clinique puis 50 G/L pour un hématome intracérébral, et 50 G/L pour un saignement digestif, urologique ou gynécologique ; l’hémoglobine visée est de 9 à 10 g/dL.</p><p>Onkopedia suit le même principe : en cas de saignement de grade III ou IV, critique ou avant une chirurgie non différable, les IgIV s’ajoutent aux corticoïdes. Si l’état ne s’améliore pas à 48–72 heures, le PNDS propose d’ajouter le romiplostim à 10 µg/kg, hors autorisation de mise sur le marché, et la vinblastine.</p>
<h3 id="d69-a06-partie-4">4. Transfusion de plaquettes : une seule indication vitale</h3><p>Dans le PTI, la <button class="w" data-k="d69-transfusion">transfusion de plaquettes</button> est habituellement inefficace : le rendement à 24 heures est souvent nul. Elle n’est indiquée qu’en urgence vitale, toujours associée aux corticoïdes et aux IgIV, à des doses 2 à 3 fois supérieures à celles d’une thrombopénie centrale. Onkopedia précise que plus d’un ou deux concentrés sont souvent nécessaires.</p><p>Le rendement attendu d’un concentré plaquettaire est de 20 à 30 G/L chez un adulte non immunisé (Compendium suisse). Dans une insuffisance médullaire à 8 G/L, un concentré donnerait donc 28 à 38 G/L. Dans le PTI, la destruction immunologique annule souvent ce gain.</p>
<h3 id="d69-a06-partie-5">5. Mesures générales et acide tranexamique</h3><p>Le PNDS demande d’arrêter les antiagrégants, les anticoagulants et les médicaments thrombopéniants, de contrôler la pression artérielle, d’éviter les gestes traumatiques et les injections intramusculaires. L’acide tranexamique est utile surtout pour les saignements muqueux (Onkopedia).</p><p>Une piqûre dans un muscle peut former un hématome chez un patient très thrombopénique, ce qui explique cette consigne. Les contre-indications de l’acide tranexamique sont rappelées en pharmacologie.</p>
<h3 id="d69-a06-partie-6">6. Différentiel immédiat et application au cas fil rouge</h3><p>Avant d’attribuer l’urgence à un PTI, le médecin écarte les autres causes de thrombopénie sévère avec purpura : le purpura fulminans si le patient est fébrile, la microangiopathie thrombotique si l’hémolyse ou les signes neurologiques sont présents, la coagulation intravasculaire disséminée si la coagulation est anormale, et la thrombopénie induite par l’héparine si une héparine a été reçue.</p><p>La patiente de 34 ans a 8 G/L et une épistaxis bilatérale. Elle est hospitalisée, le frottis exclut agrégats et schizocytes, le bilan systématique est prélevé et une corticothérapie est débutée. L’îlot 8 calcule le score de Khellaf et justifie le choix de la dexaméthasone ou de la prednisone.</p><div class="alert"><b>Urgence : signes qui imposent une prise en charge immédiate.</b> Un purpura fébrile à extension rapide, avec des éléments nécrotiques ou ecchymotiques de plus de 3 mm, impose la ceftriaxone sans délai. Une thrombopénie inférieure à 20 G/L accompagnée de saignement muqueux demande une évaluation hospitalière urgente. Le traitement dépend de la gravité réelle du saignement : Onkopedia ajoute les IgIV aux corticoïdes pour les saignements sévères, critiques ou une chirurgie non différable ; les concentrés plaquettaires sont ajoutés en cas de menace vitale. Ces situations ne constituent donc pas une indication uniforme de triple traitement. Toute anémie hémolytique avec schizocytes, atteinte rénale ou signe neurologique appelle une recherche urgente de microangiopathie thrombotique.</div>
<div class="key"><b>À retenir.</b> L’hospitalisation est la règle sous 20 G/L sans diagnostic, et obligatoire dès qu’un saignement muqueux ou sévère existe. L’urgence vitale se traite par une triple association de corticoïdes, d’IgIV et de plaquettes. La transfusion de plaquettes ne se justifie qu’en urgence vitale, car le PTI détruit les plaquettes transfusées.</div><div class="quiz ui"><p>Quelle est la seule indication de la transfusion de plaquettes dans le PTI ?</p><button data-ok="1">L’urgence vitale, associée aux corticoïdes et aux IgIV.</button><button data-ok="0">Toute thrombopénie inférieure à 30 G/L.</button><p class="fb" hidden>Le PNDS réserve la transfusion à l’urgence vitale, car le rendement à 24 heures est souvent nul.</p></div><p class="src">Sources : <a data-reference-source="1" href="https://biorecos.cerballiance.fr/wp-content/uploads/2025/02/Purpura-thrombopenique-immunologique-de-ladulte_PNDS_2025.pdf" target="_blank" rel="noopener">HAS/CeReCAI — PNDS Purpura thrombopénique immunologique de l’adulte (version du 19 octobre 2024)</a> ; <a data-reference-source="1" href="https://www.onkopedia.com/de/onkopedia/guidelines/immunthrombozytopenie-itp/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia (DGHO, OeGHO, SGH-SSH, SGMO, GPOH) — Immunthrombozytopenie (ITP), Leitlinie, août 2024</a> ; <a data-reference-source="1" href="https://www.larevuedupraticien.fr/article/purpuras-chez-ladulte-et-lenfant" target="_blank" rel="noopener">Fain, Mekinian et Dubrel — Purpuras chez l’adulte et l’enfant (Revue du Praticien 2026 ; 76:97-104)</a> ; <a data-reference-source="1" href="https://compendium.ch/product/1189074-thrombozytenkonz-pathogeninaktiv-apherese" target="_blank" rel="noopener">Compendium suisse — Blutspende SRK Schweiz, concentré plaquettaire pathogéninactivé d’aphérèse (page du 10.09.2026)</a>.</p><button class="pareto-btn ui" data-k="pareto-d69-a06">▲ Loi de Pareto — Urgences et critères d’hospitalisation</button></section>
