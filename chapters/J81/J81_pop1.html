<template data-pop="j81-starling" data-title="L’équilibre de Starling dans le poumon"><p class="lab">Principe</p><p>Le débit d’eau à travers l’endothélium dépend de la différence de pression hydrostatique entre capillaire et interstitium, diminuée de la différence de pression oncotique pondérée par le coefficient de réflexion des protéines. La perméabilité de la paroi et sa surface fixent le débit obtenu pour un gradient donné.</p><p class="lab">Valeurs de référence</p><p>En fin d’expiration, la pression capillaire vaut environ 9 cm H₂O et la pression interstitielle environ −10 cm H₂O ; les pressions oncotiques capillaire et interstitielle valent 26,8 et 13,8 cm H₂O, et le coefficient de réflexion 0,85. Le gradient net vaut donc environ +8 cm H₂O vers l’interstitium ; il atteint +22 cm H₂O en fin d’inspiration, et ce sont les lymphatiques qui évacuent en permanence ce filtrat.</p><p class="lab">Facteurs de sécurité</p><p>Le versant épais de la barrière stocke le liquide, la liaison de l’eau au hyaluronane élève la pression interstitielle et s’oppose à la filtration, et le drainage lymphatique s’accélère. Leur perte, quand la matrice est lésée, permet une inondation alvéolaire en quelques minutes.</p><div class="key"><b>Conséquence pratique.</b> Un œdème naît d’une pression capillaire trop haute, d’une barrière trop perméable, ou des deux ; le traitement vise le levier en cause.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/34987415/" target="_blank" rel="noopener" data-reference-source="1">Beretta et al., Front Physiol 2021</a>.</p></template>
<template data-pop="j81-classification" data-title="Classification des œdèmes pulmonaires par mécanisme"><p>La classification oppose l’œdème hydrostatique, dû à une pression microvasculaire élevée, à l’œdème lésionnel, dû à une perméabilité accrue. L’œdème cardiogénique est hydrostatique, avec une pression de l’oreillette gauche élevée. Les œdèmes non cardiogéniques comprennent des formes hydrostatiques sans cardiopathie (TACO, pression négative), une forme d’origine artérielle pulmonaire (OPHA), des formes lésionnelles (SDRA, TRALI) et des formes mixtes (neurogénique, immersion, opioïdes, réexpansion).</p><p class="lab">Limites</p><p>Dans l’OPHA, une pression capillaire très élevée produit un œdème à haute perméabilité sans inflammation, concept de « rupture de contrainte ». Dans l’œdème neurogénique, une sidération myocardique peut ajouter une composante cardiogénique. Hydrostatique et lésionnel peuvent coexister : le consensus de 2019 admet un TRALI malgré une hypertension de l’oreillette gauche modérée si elle n’explique pas l’hypoxémie.</p><div class="key"><b>Conséquence pratique.</b> Le médecin nomme le mécanisme dominant, puis vérifie qu’un second mécanisme n’appelle pas un traitement supplémentaire.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15703168/" target="_blank" rel="noopener" data-reference-source="1">Bärtsch et al., J Appl Physiol 2005</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a>.</p></template>
<template data-pop="j81-ratio-proteines" data-title="Rapport des protéines de l’œdème à celles du plasma"><p class="lab">Technique</p><p>Chez le patient intubé, le liquide d’œdème est aspiré dans la sonde d’intubation et sa concentration en protéines est rapportée à celle du plasma prélevé au même moment.</p><p class="lab">Valeurs</p><p>Dans l’étude de référence (209 lésions pulmonaires aiguës contre 147 œdèmes cardiogéniques), le rapport moyen valait 0,89 contre 0,53. Au seuil de 0,65, sensibilité et spécificité atteignaient 81 % pour distinguer les deux, avec une aire sous la courbe de 0,84. Un rapport supérieur à 0,65 s’associait à une mortalité plus élevée et à une ventilation plus longue.</p><p class="lab">Mécanisme</p><p>Une barrière intacte retient les protéines : l’œdème hydrostatique est un transsudat. Une barrière lésée les laisse passer : l’œdème lésionnel est un exsudat.</p><div class="key"><b>Limite.</b> Le prélèvement n’est possible que chez le patient intubé et doit être précoce, car la clairance alvéolaire concentre les protéines avec le temps. Une revue systématique de 2017 n’a trouvé aucun marqueur de haute qualité pour distinguer les deux œdèmes.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/28841896/" target="_blank" rel="noopener" data-reference-source="1">Komiya et al., revue systématique, Crit Care 2017</a>.</p></template>
<template data-pop="j81-clairance" data-title="Clairance alvéolaire du liquide d’œdème"><p class="lab">Mécanisme</p><p>Le sodium entre par le canal épithélial ENaC au pôle apical des pneumocytes, puis la pompe Na⁺/K⁺-ATPase basolatérale l’expulse vers l’interstitium ; ce gradient osmotique entraîne l’eau. L’AMPc, par la stimulation β-adrénergique ou dopaminergique, les glucocorticoïdes, les hormones thyroïdiennes et des facteurs de croissance stimulent ce transport.</p><p class="lab">Valeurs</p><p>Dans 79 lésions pulmonaires aiguës, la clairance moyenne valait 6 % par heure ; elle était altérée (moins de 3 % par heure) chez 56 % des patients. Dans l’œdème hydrostatique, la moyenne atteignait 13 % par heure. Une clairance maximale s’associait à une mortalité plus basse et à une ventilation plus courte.</p><p class="lab">Facteurs d’altération</p><p>Lésions cellulaires, ventilation délétère, hypoxie, cytokines et stress oxydant réduisent la clairance ; la mort des cellules épithéliales l’abolit dans les formes graves.</p><div class="key"><b>Conséquence pratique.</b> Une résolution rapide plaide pour un œdème hydrostatique ; une persistance plaide pour une lésion de la barrière.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24881936/" target="_blank" rel="noopener" data-reference-source="1">Matthay, Am J Respir Crit Care Med 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11371404/" target="_blank" rel="noopener" data-reference-source="1">Ware et Matthay, Am J Respir Crit Care Med 2001</a>.</p></template>

NwwKL3RgNWzQ8pVAADyERshnVZJ1O/AgIAOw==" width="340" height="247" loading="lazy" decoding="async" style="max-width:100%;height:auto" alt="Radiographie thoracique d’un œdème pulmonaire de haute altitude avec infiltrats en plages"><figcaption>Cette radiographie montre un œdème pulmonaire de haute altitude : des infiltrats en plages, disséminés et prédominants dans la région centrale droite et le lobe moyen, avec une silhouette cardiaque normale. Les plages sont irrégulières parce que la vasoconstriction hypoxique est inhomogène : les territoires dont les artérioles se contractent moins reçoivent un débit excessif, sous une pression telle que la barrière capillaire se rompt et laisse passer du liquide et des globules rouges. Ce mécanisme explique pourquoi la nifédipine, qui abaisse la pression artérielle pulmonaire, aide, alors qu’un diurétique est inutile chez un patient dont la volémie est normale. Source : <a href="https://commons.wikimedia.org/wiki/File:Chest_XR_of_HAPE.png" target="_blank" rel="noopener" data-reference-source="1">Maryrosegrant, Wikimedia Commons</a> ; <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener" data-reference-source="1">licence CC BY-SA 4.0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Définition</p><p>Œdème pulmonaire non cardiogénique du sujet sain qui monte trop vite au-dessus d’environ 2500 à 3000 m ; il survient en un à cinq jours, rarement avant 24 heures ou après une semaine d’acclimatation. Il touche aussi les montagnards acclimatés qui reviennent en altitude après un séjour en plaine.</p><p class="lab">Mécanisme</p><p>Une vasoconstriction hypoxique exagérée et inégale élève la pression capillaire au-dessus d’environ 20 mm Hg dans les territoires surperfusés ; la barrière cède sans inflammation initiale.</p><p class="lab">Clinique</p><p>Dyspnée d’effort excessive, baisse de performance, toux, oppression thoracique, puis dyspnée de repos, orthopnée et expectoration rosée ; cyanose, tachypnée, tachycardie, fièvre modérée et crépitants.</p><p class="lab">Risque de récidive</p><p>Environ 60 % des sujets ayant fait un OPHA radiologiquement documenté récidivent lors d’une montée rapide à la même altitude.</p><div class="key"><b>Conséquence pratique.</b> Oxygène, descente et nifédipine à libération prolongée ; ni diurétique ni nifédipine à libération immédiate.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11319198/" target="_blank" rel="noopener" data-reference-source="1">Maggiorini et al., Circulation 2001</a>.</p></template>
<template data-pop="j81-vph" data-title="Vasoconstriction pulmonaire hypoxique exagérée et inégale"><p class="lab">Physiologie normale</p><p>L’hypoxie alvéolaire contracte les artérioles pulmonaires, ce qui détourne le sang des zones mal ventilées.</p><p class="lab">Chez le sujet sensible</p><p>La vasoréactivité à l’hypoxie est plus forte dès la plaine. Une réponse ventilatoire à l’hypoxie plus faible abaisse la pression alvéolaire d’oxygène et renforce le stimulus ; la production pulmonaire de monoxyde d’azote diminue, celle d’endothéline augmente, et le tonus sympathique s’élève.</p><p class="lab">Hétérogénéité</p><p>L’imagerie par résonance magnétique montre une vasoconstriction inégale chez les sujets sensibles, non chez les sujets résistants. Les territoires peu contractés reçoivent un débit élevé sous une pression élevée, d’où un œdème en foyers.</p><div class="key"><b>Conséquence pratique.</b> Les médicaments qui abaissent la pression artérielle pulmonaire préviennent l’OPHA ; le monoxyde d’azote inhalé améliore l’oxygénation en redistribuant le débit vers les zones saines.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15703168/" target="_blank" rel="noopener" data-reference-source="1">Bärtsch et al., J Appl Physiol 2005</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11319198/" target="_blank" rel="noopener" data-reference-source="1">Maggiorini et al., Circulation 2001</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8592525/" target="_blank" rel="noopener" data-reference-source="1">Scherrer et al., N Engl J Med 1996</a>.</p></template>
<template data-pop="j81-rupture" data-title="Rupture de contrainte de la barrière capillaire"><p>Une pression capillaire très élevée peut léser mécaniquement la barrière air-sang sans inflammation : c’est la rupture de contrainte (« stress failure »).</p><p class="lab">Preuves chez l’homme</p><p>Chez des alpinistes sensibles lavés à 4559 m avant ou au début de l’OPHA, le liquide alvéolaire contenait beaucoup de protéines plasmatiques et d’hématies, sans augmentation des leucocytes. La pression artérielle pulmonaire systolique atteignait 66 mm Hg chez les sujets sensibles, contre 37 mm Hg chez les sujets résistants ; les cytokines pro-inflammatoires n’étaient pas élevées.</p><p class="lab">Évolution</p><p>Une inflammation peut apparaître secondairement, après plusieurs jours d’œdème non traité ou lors de la réparation d’une barrière très lésée.</p><div class="key"><b>Conséquence pratique.</b> Abaisser la pression tarit la fuite : c’est pourquoi la descente, l’oxygène et les vasodilatateurs pulmonaires traitent l’OPHA.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11980523/" target="_blank" rel="noopener" data-reference-source="1">Swenson et al., JAMA 2002</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15703168/" target="_blank" rel="noopener" data-reference-source="1">Bärtsch et al., J Appl Physiol 2005</a>.</p></template>
<template data-pop="j81-taco" data-title="Surcharge circulatoire transfusionnelle (TACO)"><p class="lab">Définition</p><p>Œdème pulmonaire hydrostatique pendant une transfusion ou dans les 12 heures, par surcharge volémique. Le terme exprime une association temporelle ; l’imputabilité est évaluée à part. Les critères forment une définition de surveillance, destinée à la déclaration et non à la décision thérapeutique immédiate.</p><p class="lab">Critères de surveillance ISBT 2018</p><p>Détresse respiratoire aiguë ou aggravée et/ou œdème pulmonaire, plus au moins trois critères au total parmi : détresse respiratoire ; œdème pulmonaire clinique, radiologique ou échocardiographique ; modifications cardiovasculaires inexpliquées (tachycardie, hypertension, pression pulsée élargie, turgescence jugulaire, cardiomégalie, œdèmes périphériques) ; surcharge liquidienne (bilan positif, réponse au diurétique, prise de poids) ; peptides natriurétiques au-dessus des normes et supérieurs à 1,5 fois la valeur pré-transfusionnelle.</p><p class="lab">Terrain</p><p>Maladies cardiovasculaires, rénales, pulmonaires et anémie sévère ; les autres perfusions s’ajoutent au volume transfusé.</p><p class="lab">Délai : deux références</p><p>La définition ISBT de 2018, à laquelle se réfère l’hémovigilance suisse, retient 12 heures. Le consensus TRALI de 2019 recommande plutôt 6 heures et classe un œdème plus tardif en dyspnée associée à la transfusion. Ce cours suit l’ISBT pour la déclaration, en signalant cette divergence.</p><div class="key"><b>Piège.</b> Une fièvre n’exclut pas le TACO, et une hypotension peut en être le signe d’appel en cas de défaillance cardiaque aiguë. Chez le patient ventilé avec une pression expiratoire positive élevée, l’œdème peut n’apparaître qu’au sevrage.</div><p class="src">Références : <a href="https://isbtweb.org/asset/19FED2C2%2DE257%2D42F5%2D9B2C2B51DF1F87D4" target="_blank" rel="noopener" data-reference-source="1">Groupe de travail d’hémovigilance de l’ISBT, définition du TACO (2018, publiée en 2019)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31080132/" target="_blank" rel="noopener" data-reference-source="1">Wiersum Osselton et al., Lancet Haematol 2019</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/marktueberwachung/haemovigilance/haemovigilance_jahresbericht_2024.pdf.download.pdf/H%C3%A9movigilance%20Rapport%20annuel%202024.pdf" target="_blank" rel="noopener" data-reference-source="1">Swissmedic, Hémovigilance, rapport annuel 2024 (publié en 2025)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a>.</p></template>
<template data-pop="j81-trali" data-title="Lésion pulmonaire aiguë post-transfusionnelle (TRALI)"><p class="lab">Définition de 2019</p><p>Œdème pulmonaire lésionnel survenant pendant une transfusion ou dans les 6 heures, avec hypoxémie (PaO₂/FiO₂ ≤ 300 mm Hg ou SpO₂ &lt; 90 % à l’air ambiant), œdème bilatéral à l’imagerie et absence d’hypertension de l’oreillette gauche déterminante. Le type I survient sans facteur de risque de SDRA ; le type II chez un patient porteur d’un facteur de risque ou d’un SDRA léger, stable dans les 12 heures précédentes. Le terme « TRALI possible » a été abandonné.</p><p class="lab">Distinctions</p><p>Une aggravation déjà en cours dans les 12 heures précédant la transfusion fait classer un SDRA. Faute de données pour juger de l’oreillette gauche, la catégorie « TRALI ou TACO indistinguables » s’applique. Un œdème survenant après 6 heures et paraissant lié à la transfusion relève de la dyspnée associée à la transfusion.</p><div class="key"><b>Conséquence pratique.</b> Le TRALI reste un diagnostic clinique : les anticorps antileucocytaires ne sont pas exigés. Tout œdème post-transfusionnel est signalé au service de transfusion.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a>.</p></template>
<template data-pop="j81-sdra" data-title="Syndrome de détresse respiratoire aiguë"><p>Le SDRA est l’œdème lésionnel type : perméabilité accrue de la membrane alvéolo-capillaire, perte d’aération, hypoxémie. La définition de Berlin, initiative de l’ESICM, classe sa gravité selon le rapport PaO₂/FiO₂ sous une pression expiratoire positive d’au moins 5 cm H₂O : léger de 200 à 300 mm Hg, modéré de 100 à 200, sévère à 100 ou moins ; la mortalité observée était de 27, 32 et 45 %.</p><p class="lab">Facteurs de risque</p><p>Les causes directes sont la pneumonie, l’inhalation de contenu gastrique, l’inhalation toxique, la contusion pulmonaire, la vascularite pulmonaire et la noyade. Les causes indirectes sont le sepsis extrapulmonaire, le traumatisme majeur, la pancréatite, les brûlures étendues, le choc non cardiogénique et le surdosage médicamenteux, qui lèsent la membrane par les médiateurs circulants.</p><div class="key"><b>Renvoi.</b> Le SDRA fait l’objet d’un cours distinct ; ici, il sert de point de comparaison pour le TRALI et l’œdème neurogénique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22797452/" target="_blank" rel="noopener" data-reference-source="1">groupe de travail de la définition de Berlin, JAMA 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener" data-reference-source="1">Grasselli et al., recommandations ESICM sur le SDRA, Intensive Care Med 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a>.</p></template>
<template data-pop="j81-neurogenique" data-title="Œdème pulmonaire neurogénique"><p class="lab">Définition</p><p>Œdème pulmonaire aigu qui suit une agression grave du système nerveux central : hémorragie sous-arachnoïdienne, traumatisme crânien, hémorragie intracérébrale, état de mal épileptique, méningite, lésion médullaire.</p><p class="lab">Clinique</p><p>La forme précoce, la plus fréquente, apparaît en minutes à heures ; la forme retardée en 12 à 24 heures. Dyspnée, tachypnée et hypoxie s’installent en quelques minutes, avec une expectoration rosée et mousseuse, des crépitants bilatéraux, une tachycardie, une hypertension, parfois une fièvre et une hyperleucocytose.</p><p class="lab">Critères proposés</p><p>Infiltrats bilatéraux, PaO₂/FiO₂ inférieur à 200, absence d’hypertension de l’oreillette gauche, agression neurologique suffisante pour élever nettement la pression intracrânienne, absence d’autre cause de SDRA. Ces critères sont une proposition d’auteurs, non une définition officielle.</p><div class="key"><b>Piège.</b> Le remplissage massif fréquent en neuroréanimation et l’inhalation, à distribution déclive, sont les diagnostics à éliminer.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a>.</p></template>
<template data-pop="j81-pression-negative" data-title="Œdème pulmonaire à pression négative"><p class="lab">Mécanisme</p><p>Un effort inspiratoire intense contre des voies aériennes obstruées, après un laryngospasme ou une obstruction haute, crée une pression intrathoracique de −50 à −100 cm H₂O, contre −3 à −10 cm H₂O normalement. Le retour veineux augmente, la postcharge ventriculaire gauche s’accroît et la filtration transvasculaire s’emballe. Le liquide d’œdème, pauvre en protéines, désigne un mécanisme surtout hydrostatique.</p><p class="lab">Épidémiologie</p><p>0,05 à 0,1 % des anesthésies, 11 % des obstructions aiguës des voies aériennes supérieures traitées activement, jusqu’à 4 % des laryngospasmes déclarés dans un registre australien.</p><p class="lab">Clinique et traitement</p><p>Les symptômes apparaissent le plus souvent dans l’heure : agitation, tachypnée, expectoration rosée et désaturation. Le traitement lève l’obstruction, applique une ventilation protectrice en pression positive et donne un diurétique sauf en cas de choc ; la résolution est rapide, car la clairance alvéolaire reste intacte.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27063348/" target="_blank" rel="noopener" data-reference-source="1">Bhattacharya et al., Chest 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21957413/" target="_blank" rel="noopener" data-reference-source="1">Bhaskar et Fraser, Saudi J Anaesth 2011</a>.</p></template>
<template data-pop="j81-reexpansion" data-title="Œdème de réexpansion"><p class="lab">Définition</p><p>Œdème pulmonaire du poumon réexpandu après l’évacuation d’un épanchement pleural.</p><p class="lab">Données</p><p>Dans 185 ponctions d’au moins 1 L, l’œdème clinique a touché 0,5 % des patients et l’œdème radiologique seul 2,2 %, sans lien avec le volume retiré ni avec la pression pleurale mesurée. Un essai randomisé de 124 patients n’a pas montré de bénéfice de la manométrie pleurale systématique sur la douleur thoracique ; elle a supprimé les pneumothorax asymptomatiques ex vacuo (0 contre 10 %).</p><p class="lab">Prévention</p><p>Le drainage s’arrête en cas de douleur thoracique persistante ou de toux incoercible.</p><div class="key"><b>Limite.</b> Ces données proviennent de deux études nord-américaines ; aucune recommandation suisse ou européenne n’a été lue sur ce point.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17954079/" target="_blank" rel="noopener" data-reference-source="1">Feller Kopman et al., Ann Thorac Surg 2007</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30772283/" target="_blank" rel="noopener" data-reference-source="1">Lentz et al., Lancet Respir Med 2019</a>.</p></template>
<template data-pop="j81-immersion" data-title="Œdème pulmonaire d’immersion"><p class="lab">Définition</p><p>Œdème pulmonaire survenant pendant la nage en surface, l’apnée ou la plongée.</p><p class="lab">Mécanisme</p><p>L’immersion centralise le sang vers le thorax et augmente le volume cardiaque ; l’eau froide et l’effort accentuent cet effet. L’hypertension artérielle et l’hypertension pulmonaire prédisposent.</p><p class="lab">Clinique</p><p>Dans 38 cas publiés, tous les patients avaient un début aigu de la gêne respiratoire ; 73 % étaient hypoxémiques, 71 % des patients imagés avaient des signes radiologiques et 82 % ont guéri en moins de 48 heures. Les récidives sont fréquentes, avec 13 % des cas publiés et 22,9 % dans une série.</p><div class="key"><b>Conséquence pratique.</b> Sortie de l’eau, oxygène, bilan cardiovasculaire ; après un épisode, les sociétés de médecine de plongée déconseillent fortement toute nouvelle plongée en scaphandre.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28912730/" target="_blank" rel="noopener" data-reference-source="1">Grünig et al., Front Physiol 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39675743/" target="_blank" rel="noopener" data-reference-source="1">Banham et al., déclaration commune des sociétés de médecine de plongée du Pacifique Sud et du Royaume-Uni, Diving Hyperb Med 2024</a>.</p></template>
<template data-pop="j81-opioides" data-title="Œdème pulmonaire des opioïdes et de l’acétazolamide"><p class="lab">Héroïne</p><p>Selon la définition de Sporer, l’œdème associe une saturation inférieure à 90 % à l’air ambiant avec une fréquence respiratoire supérieure à 12 par minute dans les 24 heures d’un surdosage, et des infiltrats diffus sans autre cause qui régressent en 48 heures. Sur 27 patients, 74 % étaient hypoxiques dès l’arrivée et l’hypoxie apparaissait au plus tard dans les 4 heures ; 33 % ont été ventilés et presque tous ont été extubés en 24 heures, et l’hypoxie a disparu en 24 heures chez 74 % d’entre eux.</p><p class="lab">Acétazolamide</p><p>L’information professionnelle suisse signale des œdèmes non cardiogéniques graves dans les minutes ou les heures suivant une prise, même unique : le médicament est arrêté et un traitement de soutien institué.</p><p class="lab">Naloxone</p><p>Elle lève la dépression respiratoire des opioïdes ; un œdème pulmonaire figure parmi ses effets indésirables très rares.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11713145/" target="_blank" rel="noopener" data-reference-source="1">Sporer et Dorn, Chest 2001</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680211910195" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diamox®, Swissmedic (AIPS via AmiKo, mise à jour 07.2026), consultée le 09.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680569520015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse de la naloxone (générique Orpha), Swissmedic (AIPS via AmiKo, mise à jour 07.2026), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j81-dyspnee" data-title="Dyspnée de l’œdème non cardiogénique"><p class="lab">Mécanisme</p><p>Les alvéoles inondées ne sont plus aérées ; le sang qui les traverse n’est plus oxygéné, d’où l’hypoxémie, qui stimule la ventilation.</p><p class="lab">Caractérisation</p><p>Le délai depuis l’exposition est l’élément décisif : minutes après une obstruction ou une agression cérébrale, moins de 6 ou 12 heures après une transfusion, un à cinq jours en altitude. En altitude, la dyspnée d’effort excessive par rapport aux compagnons précède la dyspnée de repos.</p><div class="key"><b>Piège.</b> En altitude, une tachypnée isolée sans autre symptôme peut être physiologique ; c’est la baisse de performance et la dyspnée de repos qui alertent.</div><p class="src">Références : <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener" data-reference-source="1">Grasselli et al., recommandations ESICM sur le SDRA, Intensive Care Med 2023</a>.</p></template>
<template data-pop="j81-performance" data-title="Baisse rapide de la performance physique"><p>La déclaration de l’UIAA en fait le symptôme cardinal de l’OPHA. Le patient, auparavant au rythme de son groupe, ralentit nettement, puis s’essouffle au moindre effort.</p><p class="lab">Valeur</p><p>Elle apparaît tôt, avant la dyspnée de repos et l’expectoration des formes graves ; l’UIAA demande aux profanes de penser d’abord à une maladie d’altitude devant tout symptôme en altitude. Une fréquence respiratoire supérieure à 30 par minute est présente dans 69 % des cas.</p><div class="key"><b>Conséquence pratique.</b> Un alpiniste qui « traîne » au deuxième jour au-dessus de 3000 m arrête l’ascension et doit être examiné ; les porteurs et les guides sont exposés comme les clients.</div><p class="src">Références : <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a>.</p></template>
<template data-pop="j81-expectoration" data-title="Expectoration mousseuse et rosée"><p>Une expectoration mousseuse, parfois teintée de sang, traduit un œdème alvéolaire abondant, où l’air se mêle au liquide riche en protéines et en hématies.</p><p class="lab">Valeur</p><p>Dans l’OPHA, elle signe une forme avancée. Elle est fréquente dans l’œdème neurogénique et l’œdème à pression négative ; une hémoptysie se voit dans l’œdème d’immersion.</p><div class="key"><b>Limite.</b> Elle confirme l’inondation alvéolaire, pas sa cause.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21957413/" target="_blank" rel="noopener" data-reference-source="1">Bhaskar et Fraser, Saudi J Anaesth 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28912730/" target="_blank" rel="noopener" data-reference-source="1">Grünig et al., Front Physiol 2017</a>.</p></template>
<template data-pop="j81-spo2" data-title="Saturation pulsée en oxygène et altitude"><p class="lab">Interprétation</p><p>La saturation diminue normalement avec l’altitude. À 4559 m, elle se situe entre 70 et 85 % chez les sujets sains, contre moins de 50 % dans l’OPHA avancé ; la PaO₂ passe de 35 à 45 mm Hg à environ 25 mm Hg.</p><p class="lab">Conséquence</p><p>Une valeur basse en altitude ne suffit pas au diagnostic ; c’est la comparaison avec les compagnons au même endroit, la tendance et la clinique qui comptent.</p><div class="key"><b>Piège.</b> En hôpital au-dessus de 1000 m, le rapport PaO₂/FiO₂ se corrige par la pression barométrique pour appliquer la définition du TRALI.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a>.</p></template>
<template data-pop="j81-crepitants" data-title="Crépitants de l’œdème pulmonaire"><p>Les crépitants accompagnent l’œdème alvéolaire ; la définition ISBT du TACO les range parmi les signes cliniques d’œdème pulmonaire.</p><p class="lab">Valeur</p><p>Ils sont présents dans l’OPHA, l’œdème neurogénique et l’œdème à pression négative. Des crépitants unilatéraux avec fièvre et expectoration orientent plutôt vers une pneumonie.</p><div class="key"><b>Limite.</b> Leur présence confirme une atteinte alvéolaire, sans distinguer l’œdème cardiogénique du non cardiogénique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a> ; <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://isbtweb.org/asset/19FED2C2%2DE257%2D42F5%2D9B2C2B51DF1F87D4" target="_blank" rel="noopener" data-reference-source="1">Groupe de travail d’hémovigilance de l’ISBT, définition du TACO (2018, publiée en 2019)</a>.</p></template>
<template data-pop="j81-surcharge" data-title="Signes de surcharge circulatoire"><p>Tachycardie, hypertension, pression pulsée élargie, turgescence jugulaire, cardiomégalie radiologique et œdèmes périphériques forment le critère cardiovasculaire de la définition ISBT du TACO. Un bilan hydrique positif, une prise de poids et une amélioration sous diurétique forment le critère de surcharge liquidienne.</p><p class="lab">Valeur</p><p>Une hausse de pression artérielle et une tachycardie pendant la transfusion sont des signes d’alerte : une prise en charge immédiate peut prévenir l’œdème.</p><div class="key"><b>Piège.</b> Ces signes ne sont retenus que s’ils ne s’expliquent pas par la maladie sous-jacente du patient.</div><p class="src">Référence : <a href="https://isbtweb.org/asset/19FED2C2%2DE257%2D42F5%2D9B2C2B51DF1F87D4" target="_blank" rel="noopener" data-reference-source="1">Groupe de travail d’hémovigilance de l’ISBT, définition du TACO (2018, publiée en 2019)</a>.</p></template>
<template data-pop="j81-descente" data-title="Oxygène et descente"><p class="lab">Mécanisme</p><p>L’oxygène et la descente relèvent la pression alvéolaire d’oxygène, ce qui lève la vasoconstriction hypoxique et abaisse la pression artérielle pulmonaire, cause de l’OPHA.</p><p class="lab">Modalités</p><p>Descente dès que possible, en transport passif si possible (brancard, hélicoptère) ; sinon, descente dès que le traitement a réduit les symptômes. Le patient ne porte aucune charge, et le matériel accompagne la descente pour poursuivre le traitement. Dans une station dotée d’un centre médical, un patient conscient peut rester sur place sous oxygène et surveillance.</p><div class="key"><b>Conséquence pratique.</b> L’oxygène et la descente sont le traitement de référence ; les médicaments les complètent et les remplacent lorsqu’ils sont impossibles.</div><p class="src">Références : <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a>.</p></template>
<template data-pop="j81-caisson" data-title="Caisson hyperbare portable"><p>Le caisson portable est un équipement léger que l’on pressurise autour du patient. En altitude, la baisse de la pression barométrique abaisse la pression partielle d’oxygène à chaque étape de son transport ; la pressurisation corrige ce déficit et reproduit l’effet d’une descente.</p><p class="lab">Place</p><p>L’UIAA le mentionne dans le traitement d’urgence de l’OPHA et du mal aigu des montagnes sévère ; son emploi fait l’objet d’une recommandation distincte de sa commission médicale. Luks (2017) le propose, avec l’oxygène et un vasodilatateur pulmonaire, lorsque la descente est impossible.</p><div class="key"><b>Limite.</b> Le bénéfice cesse à la sortie du caisson : la descente reste l’objectif.</div><p class="src">Références : <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a>.</p></template>
<template data-pop="j81-pep" data-title="Pression expiratoire positive"><p>Une valve de pression expiratoire positive maintient une pression positive dans les voies aériennes en fin d’expiration ; l’ESICM rappelle que la pression expiratoire positive vise à réduire la part de poumon non aéré.</p><p class="lab">Place</p><p>L’UIAA la propose dans l’OPHA si le patient l’accepte ; une pression positive continue sans oxygène a été décrite dans des observations, sans étude systématique. Dans l’œdème à pression négative et le TRALI, la ventilation en pression positive protectrice fait partie du traitement.</p><p class="src">Références : <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27063348/" target="_blank" rel="noopener" data-reference-source="1">Bhattacharya et al., Chest 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener" data-reference-source="1">Grasselli et al., recommandations ESICM sur le SDRA, Intensive Care Med 2023</a>.</p></template>
<template data-pop="j81-hemovigilance" data-title="Déclaration à l’hémovigilance en Suisse"><p class="lab">Obligation</p><p>La loi sur les produits thérapeutiques impose à tout établissement qui transfuse, stocke ou fabrique des produits sanguins de déclarer les réactions transfusionnelles, les erreurs transfusionnelles, les événements évités de justesse et les défauts de qualité. Une personne responsable désignée transmet les déclarations à Swissmedic, qui les enregistre et les valide.</p><p class="lab">Gravité et imputabilité</p><p>La gravité est cotée indépendamment de l’imputabilité ; une suspicion de TACO avec dyspnée importante reste classée sévère, même si l’imputabilité finale est jugée improbable.</p><div class="key"><b>Limite.</b> Le système suisse est passif : les taux publiés sont des minimums.</div><p class="src">Référence : <a href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/marktueberwachung/haemovigilance/haemovigilance_jahresbericht_2024.pdf.download.pdf/H%C3%A9movigilance%20Rapport%20annuel%202024.pdf" target="_blank" rel="noopener" data-reference-source="1">Swissmedic, Hémovigilance, rapport annuel 2024 (publié en 2025)</a>.</p></template>
<template data-pop="j81-ascension" data-title="Profil d’ascension progressif"><p class="lab">Recommandation de l’UIAA</p><p>Au-dessus de 2500 à 3000 m, l’altitude de la nuit suivante ne dépasse pas la précédente de plus de 300 à 500 m ; deux nuits sont passées à la même altitude tous les deux à quatre jours, la journée pouvant servir à monter plus haut avant de redescendre dormir. Luks (2017) donne des valeurs voisines : 300 à 600 m par nuit et un jour de repos tous les trois à quatre jours.</p><p class="lab">Fondement</p><p>La recommandation repose surtout sur des données d’observation ; une ascension trop rapide reste le principal facteur de risque, et le profil moyen sur l’ensemble du séjour compte plus que chaque étape.</p><div class="key"><b>Conséquence pratique.</b> La prévention commence à la réservation : beaucoup de circuits organisés ne respectent pas ces profils.</div><p class="src">Références : <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a>.</p></template>
<template data-pop="j81-reascension" data-title="Nouvelle ascension après un OPHA"><p>La sécurité d’une poursuite de l’ascension après un OPHA reste débattue, même si des ascensions de l’Everest ont été réussies après un épisode. Si elle est envisagée, le patient doit être asymptomatique et sans médicament depuis plusieurs jours, et recevoir une prophylaxie par vasodilatateur pulmonaire. Avant un futur séjour, il essaie le médicament une ou deux fois pour en connaître la tolérance.</p><div class="key"><b>Conséquence pratique.</b> Un antécédent d’OPHA radiologiquement documenté place le sujet dans le groupe à haut risque ; la prophylaxie et une ascension lente s’imposent.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a>.</p></template>
<template data-pop="j81-prevention-transfusion" data-title="Prévention des œdèmes transfusionnels"><p class="lab">TACO</p><p>Swissmedic rappelle d’évaluer le risque de TACO de chaque patient, de viser si nécessaire une transfusion lente, par exemple 1 mL/kg de poids corporel par heure, et d’envisager un diurétique préventif. La définition ISBT recommande de surveiller les paramètres vitaux pendant la transfusion et de revoir le bilan hydrique des 24 heures précédentes.</p><p class="lab">TRALI</p><p>Le recours à un plasma de donneurs masculins ou majoritairement masculins a réduit l’incidence du TRALI dans plusieurs pays. L’enquête recherche chez les donneurs impliqués les anticorps antileucocytaires.</p><div class="key"><b>Conséquence pratique.</b> Les déclarations suisses de TACO engageant le pronostic vital diminuent depuis 2020 ; Swissmedic attend des années suivantes la confirmation de cette tendance et rappelle ces mesures avec insistance.</div><p class="src">Références : <a href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/marktueberwachung/haemovigilance/haemovigilance_jahresbericht_2024.pdf.download.pdf/H%C3%A9movigilance%20Rapport%20annuel%202024.pdf" target="_blank" rel="noopener" data-reference-source="1">Swissmedic, Hémovigilance, rapport annuel 2024 (publié en 2025)</a> ; <a href="https://isbtweb.org/asset/19FED2C2%2DE257%2D42F5%2D9B2C2B51DF1F87D4" target="_blank" rel="noopener" data-reference-source="1">Groupe de travail d’hémovigilance de l’ISBT, définition du TACO (2018, publiée en 2019)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a>.</p></template>
