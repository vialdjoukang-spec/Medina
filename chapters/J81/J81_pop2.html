<template data-pop="j81-imagerie" data-title="Imagerie thoracique des œdèmes non cardiogéniques"><p class="lab">Rôle</p><p>La radiographie confirme des opacités compatibles avec un œdème ; elle servait de critère diagnostique de l’OPHA dans les essais suisses. La tomodensitométrie précise la distribution en cas de doute.</p><p class="lab">Distribution selon l’entité</p><table class="t"><tr><th>Entité</th><th>Aspect</th></tr><tr><td>OPHA</td><td>Opacités irrégulières, périphériques et nodulaires</td></tr><tr><td>Neurogénique</td><td>Atteinte alvéolaire plutôt centrale</td></tr><tr><td>Inhalation</td><td>Régions déclives</td></tr><tr><td>Pression négative</td><td>Verre dépoli central et non déclive en tomodensitométrie</td></tr><tr><td>Héroïne</td><td>Bilatéral 74 %, unilatéral 15 %, localisé 7 %</td></tr><tr><td>Immersion</td><td>Signes d’œdème chez 71 % des patients imagés</td></tr></table><div class="key"><b>Limite.</b> L’imagerie oriente sans trancher : aucune distribution n’est spécifique d’une entité.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17015867/" target="_blank" rel="noopener" data-reference-source="1">Maggiorini et al., Ann Intern Med 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21957413/" target="_blank" rel="noopener" data-reference-source="1">Bhaskar et Fraser, Saudi J Anaesth 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11713145/" target="_blank" rel="noopener" data-reference-source="1">Sporer et Dorn, Chest 2001</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28912730/" target="_blank" rel="noopener" data-reference-source="1">Grünig et al., Front Physiol 2017</a>.</p></template>
<template data-pop="j81-pf" data-title="Rapport PaO₂/FiO₂ et correction d’altitude"><p class="lab">Définition</p><p>Rapport entre la pression artérielle en oxygène, en mm Hg, et la fraction inspirée d’oxygène. Il exprime l’hypoxémie indépendamment de l’oxygène administré.</p><p class="lab">Seuils utiles</p><p>Le TRALI se définit par un rapport ≤ 300 mm Hg ou une SpO₂ &lt; 90 % à l’air ambiant. Le SDRA selon Berlin est léger de 200 à 300, modéré de 100 à 200 et sévère à 100 ou moins, sous une pression expiratoire positive d’au moins 5 cm H₂O. L’œdème neurogénique se définit, selon les critères proposés, par un rapport inférieur à 200.</p><p class="lab">Correction d’altitude</p><p>Au-dessus de 1000 m, le consensus TRALI de 2019 multiplie le rapport par la pression barométrique divisée par 760, car l’air raréfié abaisse la PaO₂ sans lésion pulmonaire. Ainsi, un rapport de 340 mm Hg mesuré sous 630 mm Hg vaut environ 282 mm Hg après correction.</p><div class="key"><b>Piège.</b> Décubitus ventral, curarisation ou réglage de la pression expiratoire modifient le rapport sans changer l’état réel du patient ; le jugement clinique l’accompagne.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22797452/" target="_blank" rel="noopener" data-reference-source="1">groupe de travail de la définition de Berlin, JAMA 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a>.</p></template>
<template data-pop="j81-echocardio" data-title="Échocardiographie"><p class="lab">Question posée</p><p>Existe-t-il une hypertension de l’oreillette gauche suffisante pour expliquer l’œdème ? Le consensus de 2019 recommande une évaluation objective, par échocardiographie ou mesure invasive, chaque fois qu’elle est suspectée.</p><p class="lab">Résultats selon l’entité</p><p>L’œdème cardiogénique s’accompagne d’une dysfonction ventriculaire ou valvulaire. L’OPHA associe une hypertension artérielle pulmonaire marquée à un cœur gauche normal. Dans l’œdème neurogénique, le cœur est normal ou présente des troubles segmentaires de la contraction qui suivent l’innervation sympathique. Le TACO peut montrer des signes de surcharge, alors que dans le TRALI l’hypertension de l’oreillette gauche n’est pas déterminante.</p><div class="key"><b>Limite.</b> Une hypertension de l’oreillette gauche modérée n’exclut pas un TRALI si elle n’explique pas l’hypoxémie ; le classement relève alors du jugement clinique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a>.</p></template>
<template data-pop="j81-peptides" data-title="Peptides natriurétiques"><p class="lab">Physiologie</p><p>Le BNP et le NT-proBNP reflètent la tension pariétale télédiastolique, les pressions de remplissage et les volumes intracardiaques. Plus leur concentration est élevée, plus une insuffisance cardiaque est probable.</p><p class="lab">Contexte transfusionnel</p><p>Un BNP inférieur à 300 pg/mL ou un NT-proBNP inférieur à 2000 pg/mL au début des symptômes rendent le TACO improbable ; un rapport post-transfusionnel/pré-transfusionnel du NT-proBNP supérieur à 1,5 le suggère. La définition ISBT retient une valeur au-dessus des normes pour l’âge et supérieure à 1,5 fois la valeur pré-transfusionnelle.</p><div class="key"><b>Limites.</b> En réanimation et dans les TRALI sévères, les peptides sont toujours élevés selon le consensus de 2019 et ne désignent plus la cause. Chez l’obèse, ils sont plus bas d’environ 50 %, ce qui impose des seuils plus bas.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31222929/" target="_blank" rel="noopener" data-reference-source="1">Mueller et al., guide pratique de la Heart Failure Association de l’ESC, Eur J Heart Fail 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a> ; <a href="https://isbtweb.org/asset/19FED2C2%2DE257%2D42F5%2D9B2C2B51DF1F87D4" target="_blank" rel="noopener" data-reference-source="1">Groupe de travail d’hémovigilance de l’ISBT, définition du TACO (2018, publiée en 2019)</a>.</p></template>
<template data-pop="j81-echo-pulm" data-title="Échographie pulmonaire"><p class="lab">Lignes B</p><p>Artefacts de réverbération verticaux, hyperéchogènes, nés de la ligne pleurale, qui descendent jusqu’au bas de l’écran sans s’atténuer et bougent avec le glissement pleural. Leur multiplication signe un syndrome interstitiel ; leur nombre augmente quand l’aération diminue.</p><p class="lab">Distinguer les deux œdèmes</p><p>Dans une série de 58 patients de réanimation, le syndrome interstitiel était présent dans tous les cas. Les anomalies de la ligne pleurale (100 % contre 25 %), la réduction du glissement (100 % contre 0 %), les zones épargnées (100 % contre 0 %) et les condensations (83,3 % contre 0 %) caractérisaient la lésion pulmonaire aiguë ; l’épanchement pleural était plus fréquent dans l’œdème cardiogénique (95 % contre 66,6 %).</p><div class="key"><b>Limite.</b> Il s’agit d’une petite série de 58 patients ; les lignes B n’ont pas de spécificité étiologique hors contexte clinique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24993976/" target="_blank" rel="noopener" data-reference-source="1">Gargani et Volpicelli, Cardiovasc Ultrasound 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18442425/" target="_blank" rel="noopener" data-reference-source="1">Copetti et al., Cardiovasc Ultrasound 2008</a>.</p></template>
<template data-pop="j81-d-nifedipine" data-title="Nifédipine à libération prolongée"><p class="lab">Mécanisme</p><p>Inhibiteur calcique de la classe des 1,4-dihydropyridines : il bloque l’entrée du calcium dans le muscle lisse artériel et abaisse la pression artérielle pulmonaire comme la pression systémique.</p><p class="lab">Preuves</p><p>À 4559 m, six patients atteints d’OPHA se sont améliorés sous nifédipine sans oxygène (1989). En prévention, chez des sujets ayant un antécédent, l’OPHA est survenu chez 1 sur 10 sous 20 mg retard toutes les 8 heures, contre 7 sur 11 sous placebo, avec une pression artérielle pulmonaire systolique de 41 contre 53 mm Hg (1991).</p><p class="lab">Posologie</p><p>Pour traiter l’OPHA, le patient prend 20 mg de la forme retard, à répéter si les symptômes s’aggravent (UIAA), ou 30 mg à libération prolongée toutes les 12 heures (Luks, 2017). En Suisse, la nifédipine est indiquée dans l’angor stable et l’hypertension, à 20 mg deux fois par jour, au plus 40 mg deux fois par jour, avec un intervalle d’au moins 4 heures ; les comprimés ne sont ni mâchés ni fractionnés, car la libération brutale provoquerait une hypotension. L’OPHA est donc un usage hors indication.</p><p class="lab">Contre-indications et précautions</p><p>Choc, angor instable, infarctus de moins de 4 semaines, association à la rifampicine, 20 premières semaines de grossesse et allaitement ; prudence sous 90 mm Hg de pression systolique, en cas d’insuffisance cardiaque, de sténose aortique sévère et d’insuffisance hépatique.</p><div class="key"><b>Piège.</b> La forme à libération immédiate provoque des chutes tensionnelles sévères ; l’UIAA la proscrit.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/2573760/" target="_blank" rel="noopener" data-reference-source="1">Oelz et al., Lancet 1989</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/1922223/" target="_blank" rel="noopener" data-reference-source="1">Bärtsch et al., N Engl J Med 1991</a> ; <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680528960104" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Nifedipin Mepha 20 retard, Swissmedic (AIPS via AmiKo, mise à jour 01.2026), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j81-d-tadalafil" data-title="Tadalafil"><p class="lab">Mécanisme</p><p>Le tadalafil inhibe la phosphodiestérase de type 5 : il renforce ainsi la voie du monoxyde d’azote et du GMPc et relâche les artérioles pulmonaires, ce qui abaisse la pression qui pousse le liquide hors des capillaires.</p><p class="lab">Preuves</p><p>Chez 29 adultes ayant un antécédent d’OPHA, montés en 24 heures à 4559 m, l’OPHA est survenu chez 1 des 8 patients restants sous tadalafil 10 mg deux fois par jour, contre 7 sur 9 sous placebo ; deux patients sous tadalafil ont abandonné pour un mal aigu des montagnes sévère. La hausse de pression artérielle pulmonaire systolique était de 13 contre 28 mm Hg.</p><p class="lab">Cadre suisse</p><p>Indiqué dans la dysfonction érectile et l’hyperplasie bénigne de la prostate ; au plus 20 mg par jour dans la dysfonction érectile. Contre-indiqué avec les dérivés nitrés, la molsidomine, les stimulateurs de la guanylate cyclase et en cas d’insuffisance hépatique sévère. Avec un antihypertenseur, il peut abaisser la pression artérielle, ce dont le patient doit être averti. L’OPHA est un usage hors indication.</p><div class="key"><b>Place.</b> L’UIAA ne le recommande pas en première intention : petits effectifs, céphalées intenses chez 15 % des utilisateurs, coût environ cent fois supérieur à celui de la nifédipine.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17015867/" target="_blank" rel="noopener" data-reference-source="1">Maggiorini et al., Ann Intern Med 2006</a> ; <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680676250126" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse du tadalafil (générique Spirig), Swissmedic (AIPS via AmiKo, mise à jour 11.2025), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j81-d-dexamethasone" data-title="Dexaméthasone"><p class="lab">Mécanisme</p><p>Glucocorticoïde puissant. Dans l’essai de prévention de l’OPHA, son effet protecteur ne s’expliquait pas par une stimulation mesurable du transport du sodium, mais par une baisse de la pression artérielle pulmonaire.</p><p class="lab">Preuves</p><p>Sous 8 mg deux fois par jour, aucun des 10 sujets sensibles n’a fait d’OPHA, contre 7 sur 9 sous placebo ; le mal aigu des montagnes a touché 3 sujets sur 10 contre 8 sur 9.</p><p class="lab">Posologie</p><p>Pour prévenir l’OPHA, l’essai utilisait 8 mg deux fois par jour. Dans l’œdème cérébral de haute altitude, l’UIAA donne 8 mg, puis 8 mg toutes les 6 heures jusqu’à la disparition des symptômes, tandis que Luks (2017) propose 8 mg, puis 4 mg toutes les 6 heures. En Suisse, la dexaméthasone existe en comprimés de 4 mg, et ses indications comprennent l’œdème cérébral sans mentionner l’altitude.</p><p class="lab">Précautions</p><p>Au-delà de deux semaines, freinage corticotrope ; arrêt progressif des doses élevées ; risque infectieux accru. Luks (2017) conseille de ne pas dépasser sept jours consécutifs en prévention.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17015867/" target="_blank" rel="noopener" data-reference-source="1">Maggiorini et al., Ann Intern Med 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680486700323" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Fortecortin® comprimés, Swissmedic (AIPS via AmiKo, mise à jour 01.2022), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j81-d-salmeterol" data-title="Salmétérol"><p class="lab">Mécanisme</p><p>Agoniste β₂ de longue durée d’action ; par l’AMPc, il stimule le transport alvéolaire du sodium et la clairance du liquide d’œdème. Ses autres effets, sur la vasoconstriction et la ventilation, rendent incertaine la part de ce mécanisme.</p><p class="lab">Preuves</p><p>Chez 37 sujets sensibles montés à 4559 m en moins de 22 heures, l’inhalation préventive a réduit l’incidence de l’OPHA de 74 % à 33 %.</p><p class="lab">Posologie et cadre suisse</p><p>En prévention, le salmétérol s’inhale à 125 µg toutes les 12 heures, en complément d’un vasodilatateur. En Suisse, Serevent® est indiqué dans l’asthme et la bronchopneumopathie chronique obstructive à 50 µg deux fois par jour, au plus 100 µg deux fois par jour ; les tremblements et la tachycardie augmentent au-delà de 50 µg deux fois par jour.</p><div class="key"><b>Place.</b> Moins efficace que les vasodilatateurs, il ne s’emploie jamais seul.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/12023995/" target="_blank" rel="noopener" data-reference-source="1">Sartori et al., N Engl J Med 2002</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680530210181" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Serevent®, Swissmedic (AIPS via AmiKo, mise à jour 07.2021), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j81-d-furosemide" data-title="Furosémide"><p class="lab">Mécanisme</p><p>Le furosémide est un diurétique de l’anse : il augmente l’excrétion du sodium et de l’eau et réduit la volémie, donc la pression hydrostatique capillaire qui pousse le liquide dans l’interstitium.</p><p class="lab">Indications utiles ici</p><p>TACO et œdème à pression négative sans choc, deux œdèmes hydrostatiques. L’information professionnelle suisse retient l’insuffisance cardiaque aiguë, en particulier l’œdème pulmonaire.</p><p class="lab">Posologie</p><p>Œdème pulmonaire aigu : 40 mg par voie intraveineuse, puis 20 à 40 mg après 20 minutes si nécessaire ; injection lente, au plus 4 mg par minute ; voie intramusculaire non indiquée.</p><p class="lab">Contre-indications</p><p>Anurie, coma et précoma hépatique, hypokaliémie ou hyponatrémie sévères, hypovolémie ou déshydratation, hypersensibilité aux sulfamides, allaitement ; pendant la grossesse, seulement en cas de nécessité absolue.</p><div class="key"><b>Piège.</b> Proscrit dans l’OPHA, où les patients sont souvent hypovolémiques.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Lasix® solution injectable, Swissmedic (AIPS via AmiKo, mise à jour 03.2025), consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27063348/" target="_blank" rel="noopener" data-reference-source="1">Bhattacharya et al., Chest 2016</a> ; <a href="https://isbtweb.org/asset/19FED2C2%2DE257%2D42F5%2D9B2C2B51DF1F87D4" target="_blank" rel="noopener" data-reference-source="1">Groupe de travail d’hémovigilance de l’ISBT, définition du TACO (2018, publiée en 2019)</a> ; <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a>.</p></template>
<template data-pop="j81-d-acetazolamide" data-title="Acétazolamide"><p class="lab">Indication liée à l’altitude</p><p>Prévention du mal aigu des montagnes, autorisée en Suisse : 250 mg deux fois par jour pendant au moins 4 jours, à partir de la veille de l’ascension. L’UIAA juge 250 mg par jour aussi efficace et réserve le médicament aux montées rapides inévitables ou aux sujets qui s’acclimatent lentement ; Luks (2017) estime 125 mg deux fois par jour suffisant pour la plupart des ascensions.</p><p class="lab">Effet sur l’OPHA</p><p>Luks (2017) ne le range pas parmi les médicaments de prévention de l’OPHA ; aucune source lue n’établit un effet propre.</p><p class="lab">Contre-indications et risques</p><p>Hyponatrémie, hypokaliémie, atteinte rénale ou hépatique grave, cirrhose, insuffisance surrénalienne, acidose hyperchlorémique, allergie aux sulfamides ; à éviter pendant la grossesse. Des œdèmes pulmonaires non cardiogéniques graves sont survenus dans les minutes ou les heures suivant une prise, même unique.</p><div class="key"><b>Piège.</b> En altitude, une dyspnée brutale après la première prise d’acétazolamide n’est pas forcément un OPHA : le médicament lui-même peut en être la cause.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680211910195" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diamox®, Swissmedic (AIPS via AmiKo, mise à jour 07.2026), consultée le 09.10.2026</a> ; <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a>.</p></template>
<template data-pop="j81-d-naloxone" data-title="Naloxone"><p class="lab">Mécanisme</p><p>Antagoniste compétitif des récepteurs opioïdes, de très haute affinité ; il déplace les agonistes et lève la dépression respiratoire.</p><p class="lab">Posologie</p><p>En cas de surdosage connu ou suspecté, l’adulte reçoit 0,4 à 2 mg par voie intraveineuse, intramusculaire ou sous-cutanée, à répéter toutes les 2 à 3 minutes. Si aucune amélioration n’apparaît après 10 mg, la dépression respiratoire n’est pas due à un opioïde, sauf avec la buprénorphine ou de fortes doses d’agonistes-antagonistes, qui se fixent plus fortement au récepteur.</p><p class="lab">Précautions</p><p>Une levée trop rapide peut provoquer nausées, vomissements, sudation et tachycardie ; des effets cardiovasculaires graves sont décrits chez les cardiaques. L’œdème pulmonaire figure parmi les effets indésirables très rares.</p><div class="key"><b>Limite.</b> La naloxone traite la dépression respiratoire, non l’œdème lui-même, qui relève de l’oxygène et parfois de la ventilation.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680569520015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse de la naloxone (générique Orpha), Swissmedic (AIPS via AmiKo, mise à jour 07.2026), consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11713145/" target="_blank" rel="noopener" data-reference-source="1">Sporer et Dorn, Chest 2001</a>.</p></template>
<template data-pop="pareto-j81-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j81-0,j81-1,j81-2,j81-3,j81-4,j81-5,j81-6"></p><ul><li>Un œdème non cardiogénique n’est pas expliqué par une hypertension de l’oreillette gauche ; il est hydrostatique, lésionnel ou mixte.</li><li>Le mécanisme commande le traitement : le diurétique est utile dans le TACO, alors qu’il est proscrit dans l’OPHA, où la volémie est normale.</li><li>L’OPHA vient d’une vasoconstriction hypoxique exagérée et inégale ; pression capillaire au-delà d’environ 20 mm Hg.</li><li>Les délais d’apparition diffèrent : le TRALI survient dans les 6 heures, le TACO dans les 12 heures, l’OPHA en un à cinq jours et l’œdème neurogénique en quelques minutes.</li><li>En Suisse, en 2024, l’hémovigilance a recensé 14 TACO et 0,4 TRALI pour 100 000 transfusions, des chiffres qui sont des minimums.</li><li>Baisse de performance, dyspnée et toux en altitude ; signes de surcharge après transfusion ; la fièvre n’exclut ni l’OPHA ni le TACO.</li></ul></template>
<template data-pop="pareto-j81-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j81-7"></p><ul><li>Le raisonnement suit quatre questions : l’œdème est-il bilatéral, quel est le rôle du cœur gauche, quelle exposition datée le précède et quelle définition d’entité s’applique ?</li><li>L’échocardiographie et les peptides ont remplacé la mesure invasive de la pression d’occlusion.</li><li>Anomalies pleurales, zones épargnées et condensations à l’échographie orientent vers un œdème lésionnel.</li><li>Rapport des protéines œdème/plasma supérieur à 0,65 : œdème lésionnel.</li><li>Écarter d’abord l’œdème cardiogénique, l’anaphylaxie ou la contamination transfusionnelle, l’embolie pulmonaire.</li></ul></template>
<template data-pop="pareto-j81-tt" data-title="Pareto — Urgences et traitements"><p class="ratio" data-cover="j81-8,j81-9"></p><ul><li>Oxygène, position assise et suppression de l’exposition avant tout diagnostic fin ; hors œdème cardiogénique, oxygénothérapie nasale à haut débit plutôt qu’oxygène conventionnel (ESICM).</li><li>Dans l’OPHA, le patient arrête l’ascension, reçoit de l’oxygène et descend ; si la descente est impossible, il prend de la nifédipine à libération prolongée, mais jamais de diurétique ni de forme immédiate.</li><li>Dans le TACO, le médecin arrête la transfusion et donne du furosémide ; dans le TRALI, il assure le soutien du SDRA. La déclaration à l’hémovigilance est obligatoire dans les deux cas.</li><li>Dans l’œdème neurogénique, le médecin traite l’hypertension intracrânienne ; dans l’œdème à pression négative, il lève l’obstruction, applique une pression positive et donne un diurétique sauf en cas de choc.</li><li>L’œdème des opioïdes se traite par naloxone et oxygène, et l’œdème à l’acétazolamide impose l’arrêt définitif du médicament.</li></ul></template>
<template data-pop="pareto-j81-crit" data-title="Pareto — Suivi, situations et critères"><p class="ratio" data-cover="j81-10,j81-11,j81-12"></p><ul><li>Pour prévenir l’OPHA, l’alpiniste ne monte pas de plus de 300 à 500 m par nuit au-dessus de 2500 à 3000 m et passe deux nuits au même niveau tous les deux à quatre jours, ce qui laisse le temps à l’acclimatation.</li><li>Prophylaxie chez les sujets ayant un antécédent : nifédipine ; alternatives : tadalafil, dexaméthasone ; salmétérol en complément.</li><li>Pour prévenir le TACO, le médecin évalue le risque, transfuse lentement et envisage un diurétique préventif.</li><li>Nifédipine contre-indiquée avant 20 semaines de grossesse ; acétazolamide à éviter pendant la grossesse.</li><li>Le TRALI se classe en types I et II selon le consensus de 2019, et le TACO selon les critères ISBT de 2018, tandis que l’OPHA reste un diagnostic clinique.</li></ul></template>
<template data-pop="pareto-j81-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j81-e-1,j81-e-2,j81-e-3"></p><ul><li>Imagerie et gaz du sang confirment l’œdème ; rapport PaO₂/FiO₂ corrigé au-dessus de 1000 m.</li><li>À l’échocardiographie, le cœur gauche est normal dans l’OPHA et le TRALI, alors qu’une sidération segmentaire est possible dans l’œdème neurogénique.</li><li>Après une transfusion, un BNP inférieur à 300 pg/mL ou un NT-proBNP inférieur à 2000 pg/mL rendent le TACO improbable, tandis qu’un rapport supérieur à 1,5 le suggère.</li><li>Peptides toujours élevés en réanimation et dans les TRALI sévères ; plus bas d’environ 50 % chez l’obèse.</li><li>La distribution radiologique oriente le diagnostic : elle est périphérique et nodulaire dans l’OPHA, centrale dans l’œdème neurogénique.</li></ul></template>
<template data-pop="pareto-j81-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j81-p-1,j81-p-2,j81-p-3,j81-p-4"></p><ul><li>La nifédipine à libération prolongée se donne à 20 mg à répéter (UIAA) ou à 30 mg toutes les 12 heures ; cet usage est hors indication en Suisse.</li><li>Tadalafil 10 mg et dexaméthasone 8 mg deux fois par jour en prévention ; salmétérol 125 µg en complément.</li><li>Furosémide 40 mg par voie intraveineuse dans l’œdème pulmonaire aigu hydrostatique ; proscrit dans l’OPHA.</li><li>Naloxone 0,4 à 2 mg, à répéter ; acétazolamide 250 mg deux fois par jour pour le mal aigu des montagnes, cause rare d’œdème.</li><li>Pas de tadalafil avec les dérivés nitrés ; pas de nifédipine avec la rifampicine.</li></ul></template>
