<div class="chap-head"><div class="code">J81 — Œdème pulmonaire · cours unique couvrant J81 · renvois : J80 — Syndrome de détresse respiratoire aiguë, I50 — Insuffisance cardiaque · CIM-10-GM 2024 · Appareil respiratoire</div>
<h1>Œdème pulmonaire non cardiogénique</h1><span class="status">Adulte · œdème de haute altitude, œdèmes transfusionnels, neurogénique, à pression négative, d’immersion et toxiques · référentiels UIAA 2012-2024, ISBT 2018, consensus TRALI 2019, Swissmedic 2024 · état au 09.10.2026</span></div>

<section class="ilot" id="j81-0"><h2><span class="n">0</span>Question clinique</h2><p>Un alpiniste de 41 ans, en bonne santé, monte en moins de 24 heures de 490 m à 4559 m. Au deuxième jour, il reste loin derrière ses compagnons, tousse et s’essouffle au moindre pas. Au repos, il respire 34 fois par minute ; l’oxymètre affiche 61 %. Des crépitants s’entendent dans les deux champs pulmonaires. Il n’a aucune maladie cardiaque. <b>Ses alvéoles se remplissent de liquide alors que son ventricule gauche fonctionne normalement : il s’agit d’un œdème pulmonaire non cardiogénique, et seule sa cause dicte le traitement.</b></p><p>Le réflexe acquis devant l’œdème cardiogénique, donner un diurétique, serait ici une erreur. Beaucoup de patients atteints d’œdème de haute altitude sont hypovolémiques, et le diurétique les expose à l’hypotension ; l’oxygène, la descente et un vasodilatateur pulmonaire les soignent. Le même raisonnement vaut pour l’œdème qui suit une transfusion, une hémorragie méningée, un laryngospasme ou une baignade en eau froide : le médecin doit d’abord nommer le mécanisme.</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="j81-starling">L’équilibre de Starling (forces qui gardent l’alvéole sèche)</button> ; <button class="w" data-justification="1" data-k="j81-classification">la classification par mécanisme (hydrostatique, lésionnel, mixte)</button>.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17015867/" target="_blank" rel="noopener" data-reference-source="1">Maggiorini et al., Ann Intern Med 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a>.</p></section>
<section class="ilot" id="j81-1"><h2><span class="n">1</span>Définition et classification par mécanisme</h2><p>L’œdème pulmonaire est l’accumulation de liquide extravasculaire dans l’interstitium, puis dans les alvéoles. La barrière air-sang ne mesure normalement que 0,2 à 0,3 µm d’épaisseur pour une surface d’environ 100 m². Une perméabilité microvasculaire très basse et la structure de la matrice interstitielle y limitent la filtration à un débit minime, que les lymphatiques évacuent.</p><p>L’œdème est dit <b>non cardiogénique</b> lorsqu’une hypertension de l’oreillette gauche liée à une cardiopathie ne l’explique pas. Deux leviers l’engendrent. La pression capillaire peut s’élever sans défaillance du cœur gauche : c’est l’<b>œdème hydrostatique non cardiaque</b>, dont le liquide est pauvre en protéines. La barrière peut être lésée : c’est l’<b>œdème lésionnel</b>, riche en protéines, dont le syndrome de détresse respiratoire aiguë (SDRA) est la forme majeure. Certaines entités associent les deux leviers.</p><table class="t"><tr><th>Mécanisme dominant</th><th>Entités</th><th>Liquide d’œdème</th><th>Conséquence thérapeutique</th></tr><tr><td>Hydrostatique, sans cardiopathie</td><td><button class="w" data-justification="1" data-k="j81-taco">Surcharge circulatoire transfusionnelle (TACO)</button>, <button class="w" data-justification="1" data-k="j81-pression-negative">œdème à pression négative</button></td><td>Pauvre en protéines</td><td>Réduire la volémie ; diurétique sauf choc</td></tr><tr><td>Hydrostatique d’origine artérielle pulmonaire</td><td><button class="w" data-justification="1" data-k="j81-opha">Œdème pulmonaire de haute altitude (OPHA)</button></td><td>Riche en protéines et en hématies, sans inflammation initiale</td><td>Descente, oxygène, vasodilatateur pulmonaire ; pas de diurétique</td></tr><tr><td>Lésionnel</td><td><button class="w" data-justification="1" data-k="j81-sdra">SDRA</button>, <button class="w" data-justification="1" data-k="j81-trali">lésion pulmonaire aiguë post-transfusionnelle (TRALI)</button></td><td>Riche en protéines</td><td>Ventilation protectrice ; traitement de la cause</td></tr><tr><td>Mixte</td><td><button class="w" data-justification="1" data-k="j81-neurogenique">Œdème neurogénique</button>, <button class="w" data-justification="1" data-k="j81-immersion">œdème d’immersion</button>, <button class="w" data-justification="1" data-k="j81-opioides">œdème des opioïdes</button>, <button class="w" data-justification="1" data-k="j81-reexpansion">œdème de réexpansion</button></td><td>Variable</td><td>Supprimer la cause ; oxygène et ventilation selon la gravité</td></tr></table><p>La dernière colonne justifie la classification : un même aspect radiologique appelle un diurétique dans un TACO et le proscrit dans un OPHA. Les catégories se recouvrent pourtant. Dans l’OPHA, une pression capillaire très élevée rompt la barrière et produit un œdème riche en protéines sans inflammation ; dans l’œdème neurogénique, une sidération myocardique peut s’ajouter à la fuite capillaire. Le SDRA et l’œdème cardiogénique font l’objet de cours distincts ; ce cours traite des autres œdèmes non cardiogéniques et de leur distinction avec ces deux voisins.</p><div class="key"><b>À retenir.</b> « Non cardiogénique » désigne un mécanisme, non une maladie. Le médecin classe l’œdème en hydrostatique, lésionnel ou mixte, puis nomme l’entité, car chacune possède son traitement.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/34987415/" target="_blank" rel="noopener" data-reference-source="1">Beretta et al., Front Physiol 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28841896/" target="_blank" rel="noopener" data-reference-source="1">Komiya et al., revue systématique, Crit Care 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15703168/" target="_blank" rel="noopener" data-reference-source="1">Bärtsch et al., J Appl Physiol 2005</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a>.</p></section>
<section class="ilot" id="j81-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>Aucune incidence globale de l’œdème pulmonaire non cardiogénique n’est publiée, ni en Suisse ni en Europe : chaque entité possède ses propres données, recueillies dans des populations très différentes. Le tableau rassemble les chiffres utiles à la décision.</p><table class="t"><tr><th>Entité</th><th>Fréquence observée</th><th>Population</th></tr><tr><td>OPHA</td><td>Moins de 0,2 % si l’ascension vers 4000 à 5000 m prend au moins trois jours ; jusqu’à 7 % en un jour ; récidive chez environ 60 % des sujets ayant un antécédent, lors d’une ascension en un ou deux jours</td><td>Alpinistes non acclimatés</td></tr><tr><td>TACO</td><td>37 déclarations, soit 14 pour 100 000 transfusions (1 sur 7200)</td><td>Suisse, 2024</td></tr><tr><td>TRALI</td><td>1 déclaration, soit 0,4 pour 100 000 transfusions</td><td>Suisse, 2024</td></tr><tr><td>Œdème à pression négative</td><td>0,05 à 0,1 % des anesthésies ; 11 % des obstructions aiguës des voies aériennes supérieures traitées activement</td><td>Anesthésie et réanimation</td></tr><tr><td>Œdème neurogénique</td><td>2 à 42,9 % des hémorragies sous-arachnoïdiennes ; jusqu’à 20 % des traumatismes crâniens</td><td>Neuroréanimation</td></tr><tr><td>Œdème de réexpansion</td><td>Clinique : 0,5 % ; radiologique seul : 2,2 %</td><td>Ponctions pleurales d’au moins 1 L</td></tr><tr><td>Œdème d’immersion</td><td>Symptômes très évocateurs chez 1,4 % des triathlètes</td><td>Nageurs d’endurance</td></tr></table><p>La lecture commence par la population. Les 14 TACO pour 100 000 transfusions sont un minimum : le système suisse d’hémovigilance repose sur des déclarations spontanées, ce qui entraîne une sous-déclaration. En 2024, le TACO (8 cas) et les réactions allergiques (13 cas) restent les causes les plus fréquentes de réaction transfusionnelle engageant le pronostic vital ou mortelle ; les déclarations de TACO sont passées de 88 en 2020 à 37 en 2024. Pour l’OPHA, le profil d’ascension pèse lourd : pour atteindre 5500 m, l’incidence passe de 2,5 % après une marche de quatre à six jours à 15,5 % après un transport aérien. Selon l’UIAA, les plus de 65 ans ont un risque d’OPHA multiplié par trois. La revue de l’UIAA sur les femmes ne retient qu’une étude cas-témoins rétrospective comparant les sexes : 10 cas pour 100 000 hommes contre 0,74 pour 100 000 femmes, une différence que ses auteurs jugent possible mais mal établie.</p><p>Le pronostic dépend de la cause plus que de l’étendue radiologique. Un œdème hydrostatique se résorbe vite, car l’épithélium intact réabsorbe le liquide : la clairance alvéolaire atteignait en moyenne 13 % par heure dans une série de 65 œdèmes hydrostatiques, contre 6 % par heure dans 79 lésions pulmonaires aiguës. L’œdème neurogénique régresse souvent en 24 à 48 heures, sauf si l’hypertension intracrânienne persiste ; l’œdème d’immersion disparaît en moins de 48 heures dans 82 % des cas publiés. L’œdème neurogénique de l’hémorragie méningée s’accompagne toutefois d’une mortalité proche de 10 %.</p><div class="key"><b>À retenir.</b> Chaque entité a son épidémiologie ; en Suisse, le TACO est l’œdème non cardiogénique le mieux recensé, et l’OPHA dépend surtout de la vitesse d’ascension.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37906126/" target="_blank" rel="noopener" data-reference-source="1">Pichler Hefti et al., recommandations de la Commission médicale de l’UIAA, High Alt Med Biol 2023</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/fr/dokumente/marktueberwachung/haemovigilance/haemovigilance_jahresbericht_2024.pdf.download.pdf/H%C3%A9movigilance%20Rapport%20annuel%202024.pdf" target="_blank" rel="noopener" data-reference-source="1">Swissmedic, Hémovigilance, rapport annuel 2024 (publié en 2025)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21957413/" target="_blank" rel="noopener" data-reference-source="1">Bhaskar et Fraser, Saudi J Anaesth 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17954079/" target="_blank" rel="noopener" data-reference-source="1">Feller Kopman et al., Ann Thorac Surg 2007</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28912730/" target="_blank" rel="noopener" data-reference-source="1">Grünig et al., Front Physiol 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11371404/" target="_blank" rel="noopener" data-reference-source="1">Ware et Matthay, Am J Respir Crit Care Med 2001</a>.</p></section>
<section class="ilot" id="j81-3"><h2><span class="n">3</span>De l’équilibre de Starling à l’inondation alvéolaire</h2><p>À l’état normal, la pression hydrostatique capillaire, d’environ 9 cm H₂O, dépasse la pression interstitielle, d’environ −10 cm H₂O en fin d’expiration ; la pression oncotique plasmatique, de 26,8 cm H₂O, retient l’eau dans le capillaire. Le bilan de ces forces, décrit par l’<button class="w" data-justification="1" data-k="j81-starling">équation de Starling</button>, laisse filtrer un faible débit vers l’interstitium. Trois <b>facteurs de sécurité</b> l’empêchent de devenir un œdème : la capacité de stockage du versant épais de la barrière, la hausse de la pression interstitielle quand l’eau s’y lie au hyaluronane, et l’accélération du drainage lymphatique.</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Forces de Starling entre capillaire, interstitium et alvéole" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="30" y="40" width="170" height="150" rx="10"/><rect x="255" y="40" width="170" height="150" rx="10" stroke-dasharray="6 4"/><rect x="480" y="40" width="170" height="150" rx="10"/><path d="M200 90h55M245 82l10 8-10 8"/><path d="M255 140h-55M210 132l-10 8 10 8"/><path d="M425 115h55M470 107l10 8-10 8" stroke-dasharray="4 3"/><path d="M340 190v25M332 205l8 10 8-10"/></g><g fill="#222"><text x="45" y="30">Capillaire</text><text x="270" y="30">Interstitium</text><text x="495" y="30">Alvéole</text><text x="40" y="70">Pression hydrostatique</text><text x="40" y="88">≈ 9 cm H₂O</text><text x="40" y="160">Pression oncotique</text><text x="40" y="178">≈ 26,8 cm H₂O</text><text x="265" y="70">Pression ≈ −10 cm H₂O</text><text x="265" y="160">Oncotique ≈ 13,8 cm H₂O</text><text x="490" y="70">Normalement sèche</text><text x="490" y="160">Inondée si les facteurs</text><text x="490" y="178">de sécurité cèdent</text><text x="355" y="225">drainage lymphatique</text></g></svg><figcaption>Figure 1 — Forces de Starling de part et d’autre de la barrière air-sang en fin d’expiration (valeurs de référence de Beretta, 2021). La filtration nette, faible, est drainée par les lymphatiques. Schéma pédagogique, non à l’échelle.</figcaption></figure><p>Deux perturbations rompent cet équilibre. Si la pression capillaire augmente, la filtration croît jusqu’à saturer le drainage : c’est l’œdème hydrostatique. Si la matrice et l’endothélium sont lésés, les facteurs de sécurité disparaissent ; de faibles gradients suffisent alors à inonder les alvéoles en quelques minutes : c’est l’œdème lésionnel. Le liquide d’un œdème lésionnel est riche en protéines ; le <button class="w" data-justification="1" data-k="j81-ratio-proteines">rapport des protéines de l’œdème à celles du plasma</button> vaut en moyenne 0,89 dans les lésions pulmonaires aiguës contre 0,53 dans l’œdème cardiogénique.</p><p>La guérison exige l’évacuation active du liquide alvéolaire. Le sodium entre dans les pneumocytes par le canal épithélial ENaC, puis la pompe Na⁺/K⁺-ATPase basolatérale le rejette vers l’interstitium ; l’eau suit le gradient osmotique. Les agonistes β-adrénergiques, par l’AMPc, et les glucocorticoïdes stimulent cette <button class="w" data-justification="1" data-k="j81-clairance">clairance alvéolaire (mécanisme et conséquences)</button>. Elle est préservée dans l’œdème hydrostatique et altérée chez 56 % des patients atteints de lésion pulmonaire aiguë, ce qui explique la lenteur de leur guérison.</p><p>Chaque entité emprunte une voie propre. En altitude, l’hypoxie déclenche une <button class="w" data-justification="1" data-k="j81-vph">vasoconstriction pulmonaire hypoxique exagérée et hétérogène</button> ; les territoires épargnés reçoivent un débit excessif et leur pression capillaire dépasse environ 20 mm Hg, seuil de l’œdème alvéolaire. Cette pression provoque une <button class="w" data-justification="1" data-k="j81-rupture">rupture de contrainte de la barrière (fuite de protéines et d’hématies)</button>. Après une transfusion, le TACO naît d’une pression hydrostatique accrue, le TRALI d’une perméabilité accrue. Une agression cérébrale brutale libère des catécholamines qui élèvent les pressions systémique et pulmonaire et lèsent l’endothélium. Un effort inspiratoire contre une glotte fermée crée une pression intrathoracique de −50 à −100 cm H₂O, qui augmente le retour veineux et la filtration.</p><div class="key"><b>Conséquence thérapeutique.</b> Un œdème hydrostatique se traite en abaissant la pression qui le crée : volémie dans le TACO, pression artérielle pulmonaire dans l’OPHA. Un œdème lésionnel se traite en protégeant le poumon pendant que la barrière se répare.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/34987415/" target="_blank" rel="noopener" data-reference-source="1">Beretta et al., Front Physiol 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28841896/" target="_blank" rel="noopener" data-reference-source="1">Komiya et al., revue systématique, Crit Care 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24881936/" target="_blank" rel="noopener" data-reference-source="1">Matthay, Am J Respir Crit Care Med 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11371404/" target="_blank" rel="noopener" data-reference-source="1">Ware et Matthay, Am J Respir Crit Care Med 2001</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11319198/" target="_blank" rel="noopener" data-reference-source="1">Maggiorini et al., Circulation 2001</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21957413/" target="_blank" rel="noopener" data-reference-source="1">Bhaskar et Fraser, Saudi J Anaesth 2011</a>.</p></section>
<section class="ilot" id="j81-4"><h2><span class="n">4</span>Causes, délais et terrains</h2><p>Le délai entre l’exposition et la détresse respiratoire oriente plus sûrement que l’imagerie. Le tableau relie chaque cause à son délai et au terrain qui l’aggrave.</p><table class="t"><tr><th>Cause</th><th>Déclencheur et délai</th><th>Terrain favorisant</th></tr><tr><td>OPHA</td><td>Ascension au-dessus de 2500 à 3000 m ; un à cinq jours après l’arrivée, rarement avant 24 heures</td><td>Ascension rapide, antécédent d’OPHA, âge supérieur à 65 ans, infection respiratoire récente, effort intense</td></tr><tr><td>TACO</td><td>Pendant la transfusion ou dans les 12 heures</td><td>Maladie cardiovasculaire, rénale ou pulmonaire, anémie sévère, bilan hydrique positif</td></tr><tr><td>TRALI</td><td>Pendant la transfusion ou dans les 6 heures</td><td>Sepsis, choc non cardiogénique, chirurgie cardiaque, hémopathie maligne, alcoolisme chronique, tabagisme ; plasma riche en anticorps antileucocytaires</td></tr><tr><td>Œdème neurogénique</td><td>Minutes à heures après l’agression cérébrale ; forme retardée après 12 à 24 heures</td><td>Hémorragie sous-arachnoïdienne, traumatisme crânien, hémorragie intracérébrale, état de mal épileptique</td></tr><tr><td>Œdème à pression négative</td><td>Le plus souvent dans l’heure qui suit l’obstruction</td><td>Laryngospasme au réveil, infection ou tumeur des voies aériennes supérieures</td></tr><tr><td>Œdème de réexpansion</td><td>Pendant ou après la ponction d’un épanchement pleural</td><td>Poumon non expansible, pression pleurale très négative</td></tr><tr><td>Œdème d’immersion</td><td>Pendant la nage ou la plongée</td><td>Eau froide, effort, hypertension artérielle, âge, sexe féminin, stress</td></tr><tr><td>Opioïdes, acétazolamide</td><td>Dans les 24 heures d’un surdosage d’héroïne ; minutes à heures après une prise d’acétazolamide, même unique</td><td>Surdosage ; antécédent de réaction à l’acétazolamide</td></tr></table><p>Ainsi, une femme de 78 ans, insuffisante rénale, s’essouffle deux heures après le second concentré érythrocytaire, avec une pression artérielle de 182/95 mm Hg : le délai et le terrain désignent un TACO. Un homme de 25 ans qui crache une mousse rosée vingt minutes après un laryngospasme d’extubation présente un œdème à pression négative. Chez l’alpiniste de l’îlot 0, l’arrivée à 4559 m la veille et la montée en un jour situent l’OPHA dans sa fenêtre typique.</p><div class="key"><b>À retenir.</b> L’heure de l’exposition, transfusion, ascension, agression cérébrale, obstruction, ponction ou baignade, est la première donnée à établir ; elle oriente vers l’entité avant tout examen.</div><p class="src">Références : <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://isbtweb.org/asset/19FED2C2%2DE257%2D42F5%2D9B2C2B51DF1F87D4" target="_blank" rel="noopener" data-reference-source="1">Groupe de travail d’hémovigilance de l’ISBT, définition du TACO (2018, publiée en 2019)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21957413/" target="_blank" rel="noopener" data-reference-source="1">Bhaskar et Fraser, Saudi J Anaesth 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30772283/" target="_blank" rel="noopener" data-reference-source="1">Lentz et al., Lancet Respir Med 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28912730/" target="_blank" rel="noopener" data-reference-source="1">Grünig et al., Front Physiol 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11713145/" target="_blank" rel="noopener" data-reference-source="1">Sporer et Dorn, Chest 2001</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680211910195" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diamox®, Swissmedic (AIPS via AmiKo, mise à jour 07.2026), consultée le 09.10.2026</a>.</p></section>
<section class="ilot" id="j81-5"><h2><span class="n">5</span>Interroger pour dater et relier</h2><p>La <button class="w" data-justification="1" data-k="j81-dyspnee">dyspnée</button> est constante ; son installation, brutale ou progressive, et son lien avec l’exposition comptent davantage que son intensité. En altitude, la <button class="w" data-justification="1" data-k="j81-performance">baisse rapide de la performance physique (signe cardinal de l’OPHA)</button> précède souvent la dyspnée de repos : le patient « traîne » derrière son groupe. La toux, d’abord discrète, s’aggrave avec l’œdème ; une <button class="w" data-justification="1" data-k="j81-expectoration">expectoration mousseuse et rosée</button> signe un œdème alvéolaire avancé. L’oppression thoracique figure parmi les symptômes de l’OPHA ; dans l’œdème d’immersion, une hémoptysie était rapportée chez 68 % des 38 cas publiés.</p><p>L’interrogatoire reconstitue la chronologie heure par heure : profil d’ascension et altitude de la nuit précédente ; volumes transfusés et autres perfusions dans les 24 heures ; anesthésie, extubation ou laryngospasme ; agression neurologique ; ponction pleurale et volume retiré ; nage en eau froide ; prise d’héroïne ou d’acétazolamide. Il recherche les antécédents qui modifient le risque : <button class="w" data-justification="1" data-k="j81-opha">OPHA antérieur</button>, cardiopathie ou insuffisance rénale avant une transfusion, hypertension artérielle chez le nageur. Il cherche enfin une céphalée intense, une ataxie ou une confusion, qui signalent un œdème cérébral de haute altitude associé.</p><div class="two"><div class="card"><b>Forme typique</b><p>Un alpiniste non acclimaté, au deuxième jour à plus de 3000 m, perd ses forces, tousse et s’essouffle à l’effort puis au repos. Une fièvre modérée et une tachycardie accompagnent la tachypnée.</p></div><div class="card"><b>Formes trompeuses</b><p>Une fièvre fait conclure à une pneumonie alors qu’elle n’exclut pas l’OPHA. Une dyspnée post-transfusionnelle chez un patient septique passe pour une aggravation du sepsis alors qu’elle peut être un TRALI de type II. Chez un nageur, les symptômes peuvent disparaître peu après la sortie de l’eau ; le diagnostic repose alors sur le seul récit.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> Ne pas déclarer un œdème survenu dans les 6 heures d’une transfusion parce que le patient avait déjà un facteur de risque de SDRA. Le consensus de 2019 demande de signaler tout œdème pulmonaire post-transfusionnel au service de transfusion, qui seul peut le classer.</div><div class="key"><b>À retenir.</b> L’anamnèse établit l’heure, la dose et le contexte de l’exposition ; elle recherche aussi les signes d’un œdème cérébral de haute altitude.</div><p class="src">Références : <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener" data-reference-source="1">Vlaar et al., redéfinition consensuelle du TRALI, Transfusion 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28912730/" target="_blank" rel="noopener" data-reference-source="1">Grünig et al., Front Physiol 2017</a> ; <a href="https://isbtweb.org/asset/19FED2C2%2DE257%2D42F5%2D9B2C2B51DF1F87D4" target="_blank" rel="noopener" data-reference-source="1">Groupe de travail d’hémovigilance de l’ISBT, définition du TACO (2018, publiée en 2019)</a>.</p></section>
<section class="ilot" id="j81-6"><h2><span class="n">6</span>Examiner pour mesurer la gravité et trouver la cause</h2><p>Le médecin évalue d’abord l’état général et la vigilance, puis les paramètres vitaux. Une fréquence respiratoire supérieure à 30 par minute s’observe dans 69 % des OPHA ; la tachycardie, une fièvre modérée et une cyanose complètent le tableau. La <button class="w" data-justification="1" data-k="j81-spo2">saturation pulsée en oxygène (interprétation selon l’altitude)</button> quantifie l’hypoxémie ; sa valeur normale baisse avec l’altitude. Les <button class="w" data-justification="1" data-k="j81-crepitants">crépitants</button> confirment l’atteinte alvéolaire, sans indiquer son mécanisme.</p><p>L’examen ciblé cherche ensuite la cause. Une hypertension artérielle, une pression pulsée élargie, une turgescence jugulaire et des œdèmes périphériques évoquent une <button class="w" data-justification="1" data-k="j81-surcharge">surcharge circulatoire (signes et piège)</button>. Un stridor ou un tirage oriente vers l’œdème à pression négative. Un trouble de la vigilance ou un signe focal accompagne l’œdème neurogénique. En altitude, la marche talon contre orteil est un test simple et sensible de l’ataxie de l’œdème cérébral, qui impose de traiter les deux œdèmes. Le poids rapporté au poids habituel aide à juger d’un bilan hydrique positif.</p><div class="trap"><span class="k">Piège</span> La fièvre n’exclut ni l’OPHA ni le TACO : la déclaration de l’UIAA et la définition ISBT le précisent. Elle oriente vers une infection seulement si d’autres signes le confirment.</div><div class="key"><b>À retenir.</b> Les paramètres vitaux mesurent la gravité ; la pression artérielle, les signes de surcharge, le stridor et l’examen neurologique désignent la cause.</div><p class="src">Références : <a href="https://theuiaa.org/documents/mountainmedicine/English_UIAA_MedCom_Rec_No_2_AMS_HAPE_HACE_2012_V3.3.pdf" target="_blank" rel="noopener" data-reference-source="1">Commission médicale de l’UIAA, déclaration de consensus n° 2, version 3.3 (2012, révisée en 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28143879/" target="_blank" rel="noopener" data-reference-source="1">Luks, Swenson et Bärtsch, Eur Respir Rev 2017</a> ; <a href="https://isbtweb.org/asset/19FED2C2%2DE257%2D42F5%2D9B2C2B51DF1F87D4" target="_blank" rel="noopener" data-reference-source="1">Groupe de travail d’hémovigilance de l’ISBT, définition du TACO (2018, publiée en 2019)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22429697/" target="_blank" rel="noopener" data-reference-source="1">Davison, Terek et Chawla, Crit Care 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21957413/" target="_blank" rel="noopener" data-reference-source="1">Bhaskar et Fraser, Saudi J Anaesth 2011</a>.</p><button class="pareto-btn ui" data-k="pareto-j81-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
