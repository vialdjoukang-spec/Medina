l></nav><div class="chap-body"><section class="ilot" id="g97-0"><h2><span class="n">0</span>Question clinique</h2>
<p data-evidence="G97-C0014">Dans cette <b>vignette fictive</b>, une femme de 29 ans a reçu une rachianesthésie pour une césarienne. Au troisième jour, une céphalée apparaît dès qu’elle s’assoit et disparaît presque entièrement lorsqu’elle s’allonge. Elle ressent aussi une raideur de nuque et des bourdonnements d’oreille. Son examen neurologique est normal. Le médecin doit répondre à trois questions : s’agit-il d’une <button class="w" data-k="g97-cppd-def">céphalée post-ponction durale (critères et délai)</button> ? Faut-il écarter un diagnostic plus grave ? Un <button class="w" data-k="g97-bpe">blood patch épidural (indications et technique)</button> est-il justifié ?</p>
<p data-evidence="G97-C0015">Le même cours traite trois autres situations qui partagent une logique commune : une complication neurologique née d’un geste pourtant correct. Un patient opéré du rachis voit sa douleur axiale croître puis une faiblesse s’installer : c’est la signature d’un <button class="w" data-k="g97-hematome">hématome épidural postopératoire compressif (fréquence et séquence)</button>. Un enfant opéré d’une tumeur de la fosse postérieure se réveille muet : c’est un <button class="w" data-k="g97-mutisme-def">mutisme cérébelleux postopératoire (définition et spectre)</button>. Un porteur de dérivation ventriculo-péritonéale se plaint de céphalées posturales : c’est un <button class="w" data-k="g97-surdrainage">surdrainage de dérivation (définition et limites)</button>.</p>
<div class="key" data-evidence="G97-C0016"><b>Objectifs.</b> Reconnaître une céphalée post-ponction durale par ses critères ; savoir quand l’imagerie est urgente ; maîtriser la prévention par l’aiguille, la séquence conservateur puis blood patch ; reconnaître l’hématome compressif comme une urgence neurochirurgicale ; connaître la place limitée des traitements du mutisme et du surdrainage.</div>
</section>

<section class="ilot" id="g97-1"><h2><span class="n">1</span>Définition et classification</h2>
<p data-evidence="G97-C0017">La catégorie réunit des atteintes du système nerveux provoquées par un acte médical ou chirurgical, lorsqu’aucune autre rubrique ne les accueille. Elle est hétérogène : on y trouve des complications d’une <button class="w" data-k="g97-cim">ponction ou d’une anesthésie rachidienne, d’une dérivation ventriculaire et d’une chirurgie (périmètre de la catégorie)</button>. Pour apprendre sans se perdre, le cours organise cette hétérogénéité autour de quatre tableaux cliniques, détaillés dans le tableau ci-dessous. Les fuites spontanées de liquide céphalorachidien (<button class="w" data-k="g97-lcr">LCR (rôle et pression)</button>), sans acte préalable, relèvent d’une autre catégorie, traitée dans la leçon voisine sur l’hypotension intracrânienne. En Suisse, les libellés français de la CIM-10-GM 2024 sont ceux de l’Office fédéral de la statistique.</p>
<table class="t"><thead><tr><th>Tableau clinique</th><th>Acte en cause</th><th>Délai caractéristique</th><th>Signe cardinal</th></tr></thead><tbody>
<tr><td data-evidence="G97-C0018">Céphalée post-ponction durale</td><td data-evidence="G97-C0019">Ponction lombaire ou rachianesthésie</td><td data-evidence="G97-C0020">Dans les 5 jours suivant la ponction</td><td data-evidence="G97-C0021">Céphalée orthostatique</td></tr>
<tr><td data-evidence="G97-C0022">Hématome épidural postopératoire</td><td data-evidence="G97-C0023">Chirurgie rachidienne</td><td data-evidence="G97-C0024">Le plus souvent 24 à 48 heures, parfois plus tard</td><td data-evidence="G97-C0025">Douleur axiale croissante, puis déficit</td></tr>
<tr><td data-evidence="G97-C0026">Mutisme cérébelleux postopératoire</td><td data-evidence="G97-C0027">Exérèse d’une tumeur de la fosse postérieure de l’enfant</td><td data-evidence="G97-C0028">Début médian au jour 1 (0 à 10 jours)</td><td data-evidence="G97-C0029">Mutisme ou parole sévèrement réduite</td></tr>
<tr><td data-evidence="G97-C0030">Surdrainage de dérivation</td><td data-evidence="G97-C0031">Dérivation ventriculo-péritonéale</td><td data-evidence="G97-C0032">État persistant, sans délai défini dans les sources lues</td><td data-evidence="G97-C0033">Céphalée posturale, ventricules fins</td></tr></tbody></table>
<p data-evidence="G97-C0034">Ce tableau classe les situations par acte et par signe d’appel. Il ne remplace pas les définitions, car chaque tableau a ses propres critères. La fuite de LCR responsable d’une céphalée après un geste figure aussi dans la classification des céphalées sous une autre entrée, la <button class="w" data-k="g97-fistule">céphalée par fistule de LCR (critères)</button>, qui s’applique notamment aux fistules postopératoires.</p>
<h3>1.1 Classification internationale des céphalées</h3>
<p data-evidence="G97-C0035">La classification <button class="w" data-k="g97-ichd">ICHD-3 (structure et critères généraux)</button> range ces céphalées sous la rubrique 7.2, « céphalée attribuée à une basse pression du LCR ». Deux entités nous concernent : la <b>céphalée post-ponction durale</b> (7.2.1), qui suit une ponction lombaire, et la <b>céphalée par fistule de LCR</b> (7.2.2), qui suit un acte ou un traumatisme responsable d’une fuite persistante. La rubrique 7.2 pose quatre critères généraux : une céphalée remplissant le critère C ; une basse pression du LCR (<button class="w" data-k="g97-pression60">moins de 60 mm de LCR (mesure et limites)</button>) ou une fuite visible à l’imagerie ; une relation temporelle entre la céphalée et la fuite ou sa découverte ; l’absence d’un meilleur diagnostic.</p>
<h3>1.2 Autres classifications utiles</h3>
<p data-evidence="G97-C0036">Pour la parole postopératoire, l’étude européenne de référence distingue trois états : mutisme, parole réduite, parole habituelle. Le trouble de la parole postopératoire, abrégé <button class="w" data-k="g97-mutisme-def">POSI (définition)</button>, désigne le mutisme ou la parole sévèrement réduite. Pour l’hématome rachidien, on distingue un début précoce et un début retardé, ce dernier étant moins fréquent.</p>
<div class="key" data-evidence="G97-C0037"><b>À retenir.</b> Quatre tableaux, quatre logiques : une fuite de liquide (ponction), un saignement compressif (chirurgie rachidienne), une lésion de voie cérébelleuse (fosse postérieure) et un drainage excessif (dérivation). L’acte, le délai et le signe d’appel orientent d’emblée.</div>
<button class="pareto-btn ui" data-k="pareto-g97-definition">▲ Loi de Pareto — Définition et classification</button>
</section>

<section class="ilot" id="g97-2"><h2><span class="n">2</span>Fréquence et épidémiologie</h2>
<p data-evidence="G97-C0038">Les fréquences varient d’un facteur considérable selon l’acte et le patient. Pour la céphalée post-ponction durale, l’incidence rapportée va de moins de 2 % à 40 %, selon les caractéristiques du patient et de l’aiguille. Cette amplitude s’explique par les facteurs du patient et de l’acte, détaillés plus loin.</p>
<p data-evidence="G97-C0039">L’influence de l’aiguille est la donnée la mieux établie. Une méta-analyse de 110 essais contrôlés randomisés, regroupant 31 412 participants, compare l’aiguille conventionnelle biseautée à l’aiguille atraumatique : la céphalée survient chez <b>11,0 %</b> des patients avec la première (<button class="w" data-k="g97-ic">intervalle de confiance à 95 % de 9,1 à 13,3</button>) contre <b>4,2 %</b> avec la seconde (3,3 à 5,2). Le <button class="w" data-k="g97-rr">risque relatif (définition et lecture)</button> est de 0,40 (0,34 à 0,47), avec une preuve de haute qualité selon <button class="w" data-k="g97-grade-pop">GRADE (niveaux de certitude)</button>. La différence absolue, calculée à partir des deux incidences, est de 6,8 points de pourcentage : il faut traiter environ <button class="w" data-k="g97-nnt">15 patients (nombre à traiter, calcul)</button> par aiguille atraumatique pour éviter une céphalée.</p>
<p data-evidence="G97-C0470">Une donnée suisse existe en obstétrique, mais elle ne mesure pas l’incidence. Les Hôpitaux universitaires de Genève ont recensé 47 920 procédures neuraxiales obstétricales réalisées de 2001 à 2018, dont 212 <button class="w" data-k="g97-bpe-echec">blood patchs (échec et facteurs prédictifs)</button> ; cette cohorte décrit le devenir des patientes traitées, non le risque de la population. Dans la littérature citée par ses auteurs, la céphalée post-ponction complique 0,38 à 6,3 % des actes neuraxiaux obstétricaux, et le blood patch échoue dans 4 à 29 % des cas. Aucun registre suisse d’incidence n’a été trouvé.</p>
<p data-evidence="G97-C0040">Pour l’hématome épidural rachidien postopératoire symptomatique, l’incidence rapportée est de 0,10 à 0,69 %. Une méta-analyse de 40 études donne 0,52 % en moyenne et montre combien l’indication opératoire et la technique comptent :</p>
<table class="t"><thead><tr><th>Facteur</th><th>Catégorie</th><th>Incidence</th></tr></thead><tbody>
<tr><td data-evidence="G97-C0041">Indication</td><td data-evidence="G97-C0042">Déformation rachidienne</td><td data-evidence="G97-C0043">2,9 %</td></tr>
<tr><td data-evidence="G97-C0044">Indication</td><td data-evidence="G97-C0045">Maladie dégénérative</td><td data-evidence="G97-C0046">1,12 %</td></tr>
<tr><td data-evidence="G97-C0047">Indication</td><td data-evidence="G97-C0048">Tumeur</td><td data-evidence="G97-C0049">0,30 %</td></tr>
<tr><td data-evidence="G97-C0050">Niveau</td><td data-evidence="G97-C0051">Cervical / thoracique / lombaire</td><td data-evidence="G97-C0052">0,32 % / 0,84 % / 0,63 %</td></tr>
<tr><td data-evidence="G97-C0053">Voie</td><td data-evidence="G97-C0054">Antérieure / postérieure</td><td data-evidence="G97-C0055">0,24 % / 0,70 %</td></tr>
<tr><td data-evidence="G97-C0056">Technique</td><td data-evidence="G97-C0057">Mini-invasive / ouverte</td><td data-evidence="G97-C0058">1,94 % / 0,42 %</td></tr>
<tr><td data-evidence="G97-C0059">Anticoagulation périopératoire</td><td data-evidence="G97-C0060">Avec / sans</td><td data-evidence="G97-C0061">0,44 % / 0,42 %</td></tr></tbody></table>
<p data-evidence="G97-C0062">La lecture de ce tableau demande de la nuance. La déformation rachidienne présente le taux le plus élevé ; la voie antérieure expose moins que la voie postérieure ; la chirurgie mini-invasive montre un taux plus élevé que la chirurgie ouverte (1,94 % contre 0,42 %), sans que les sources lues expliquent ce résultat. L’anticoagulation périopératoire ne modifie pas l’incidence dans cette méta-analyse (0,44 % contre 0,42 %).</p>
<p data-evidence="G97-C0063">Pour le mutisme cérébelleux, les tumeurs cérébrales sont les tumeurs solides les plus fréquentes de l’enfant, et la moitié siège dans la fosse postérieure. Jusqu’à 25 % des enfants opérés d’une tumeur de cette région en sont atteints selon la littérature. Dans la cohorte européenne de 26 centres et 9 pays (376 enfants), le trouble de la parole postopératoire atteint 30 % (112 enfants sur 376) : 14 % de mutisme et 16 % de parole réduite.</p>
<div class="trap" data-evidence="G97-C0064"><span class="k">Population des chiffres</span> Les chiffres sur l’aiguille, l’hématome et le mutisme sont internationaux ou européens ; la seule cohorte suisse chiffrée (Genève) porte sur le blood patch, non sur l’incidence. Aucune incidence suisse n’en est déduite. De plus, l’étendue de 2 % à 40 % de la céphalée post-ponction ne s’applique pas à un patient particulier : elle dépend de l’aiguille et du terrain.</div>
<div class="key" data-evidence="G97-C0065"><b>À retenir.</b> L’aiguille atraumatique divise le risque de céphalée post-ponction par plus de deux (11,0 % contre 4,2 %). L’hématome épidural postopératoire reste rare (environ 0,5 %), mais son issue dépend du délai de prise en charge. Le trouble de la parole postopératoire touche 30 % des enfants de la cohorte européenne.</div>
</section>

<section class="ilot" id="g97-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p data-evidence="G97-C0066">Quatre mécanismes distincts se cachent derrière la catégorie. Pour chacun, la logique va de la situation normale à l’événement déclenchant, puis aux manifestations. Les sources lues précisent que la compréhension de plusieurs de ces mécanismes reste incomplète ; le cours le signale chaque fois.</p>
<h3>3.1 Fuite de LCR après ponction durale</h3>
<p data-evidence="G97-C0067">Le <button class="w" data-k="g97-lcr">LCR (rôle et pression)</button> circule dans l’espace entouré par la dure-mère. Une ponction lombaire ou une rachianesthésie traverse cette enveloppe. Si la brèche persiste, du liquide s’échappe par l’orifice, la pression du LCR baisse et la céphalée survient. La céphalée disparaît quand la pression se normalise, spontanément en deux semaines ou après obturation de la fuite par un <button class="w" data-k="g97-bpe">blood patch (technique et résultats)</button>. Le fait central, établi par la classification, est donc le lien entre la fuite, la basse pression et la céphalée orthostatique. En revanche, le mécanisme intime par lequel la baisse de pression produit la douleur n’est pas détaillé dans les sources lues, et la compréhension physiopathologique complète demeure une cible de recherche.</p>
<p data-evidence="G97-C0068">Le rôle de l’aiguille est le mécanisme modifiable le mieux documenté. Une aiguille atraumatique, non coupante, réduit la céphalée, le recours au blood patch, l’irritation radiculaire et les troubles auditifs, sans diminuer le succès au premier essai et sans augmenter les échecs. Avec une aiguille coupante, un calibre plus fin réduit le risque, et un biseau orienté <button class="w" data-k="g97-biseau">parallèlement à l’axe longitudinal du rachis (orientation et grade)</button> est recommandé ; un biseau perpendiculaire est un facteur de risque indépendant.</p>
<h3>3.2 Fistule de LCR après chirurgie rachidienne</h3>
<p data-evidence="G97-C0069">Une brèche durale accidentelle peropératoire partage la physiopathologie de la céphalée post-ponction : une <button class="w" data-k="g97-fistule">fistule persistante de LCR (critères et logique)</button> provoque une basse pression et une céphalée orthostatique, qui disparaît après obturation de la fuite. La question pratique est de savoir si l’alitement prolongé protège : une méta-analyse indique que la mobilisation précoce, dans les 24 heures, réduit les complications pulmonaires sans augmenter la fuite, la céphalée hypotensive, la reprise chirurgicale ni la pseudoméningocèle.</p>
<h3>3.3 Surdrainage d’une dérivation</h3>
<p data-evidence="G97-C0070">Une dérivation ventriculo-péritonéale évacue le LCR vers l’abdomen par une valve. Si le drainage dépasse le besoin, les ventricules deviennent fins, des collections sous-durales peuvent apparaître et une céphalée posturale s’installe, parfois avec nausées et vomissements. Il n’existe cependant pas de <button class="w" data-k="g97-surdrainage">définition consensuelle du surdrainage (limites des sources)</button> ; l’incidence rapportée varie énormément et le phénomène est probablement sous-estimé. La physiopathologie fine est mal établie.</p>
<h3>3.4 Hématome épidural rachidien postopératoire</h3>
<p data-evidence="G97-C0071">Après une chirurgie rachidienne, le saignement s’accumule dans l’espace épidural et comprime la moelle ou les racines. La séquence clinique traduit cette compression progressive : la douleur axiale augmente d’abord, des symptômes radiculaires s’y ajoutent, puis une faiblesse motrice et des troubles sphinctériens. La pression artérielle systolique postopératoire élevée et les pics tensionnels à l’extubation sont discutés comme facteurs favorisants, avec des <button class="w" data-k="g97-hematome-facteurs">preuves de faible qualité (facteurs de risque)</button>.</p>
<h3>3.5 Mutisme cérébelleux postopératoire</h3>
<p data-evidence="G97-C0072">Le mécanisme le plus probable est une lésion des composantes proximales de la <button class="w" data-k="g97-voie-cerebelleuse">voie efférente cérébelleuse (voie dentato-thalamo-corticale)</button>. Ce modèle est cohérent avec le rôle de la localisation tumorale (quatrième ventricule et tronc cérébral), identifiée comme facteur indépendant.</p>
<div class="key" data-evidence="G97-C0073"><b>À retenir.</b> Fuite, saignement, lésion de voie et drainage excessif sont quatre mécanismes distincts. La fuite et le saignement sont corrigeables ; le mutisme n’a pas de traitement établi ; le surdrainage manque de recommandation européenne.</div>
<button class="pareto-btn ui" data-k="pareto-g97-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="g97-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p data-evidence="G97-C0074">Un facteur de risque est une caractéristique associée à la complication ; il n’en est pas la cause. Cette distinction compte surtout pour les chiffres des cohortes, qui décrivent des associations ajustées.</p>
<h3>4.1 Céphalée post-ponction durale : le patient</h3>
<p data-evidence="G97-C0075">Le consensus de 2023 gradue la certitude de chaque <button class="w" data-k="g97-facteurs-patient">facteur lié au patient (niveaux de certitude)</button>. L’âge jeune et le sexe féminin sont associés à un risque accru avec une certitude élevée ; un antécédent de céphalée chronique ou de céphalée post-ponction l’est avec une certitude modérée. L’indice de masse corporelle n’a pas d’association constante, et le tabac est possiblement protecteur avec une faible certitude. La classification ICHD-3 cite de son côté le sexe féminin, l’âge de 31 à 50 ans, l’antécédent de céphalée post-ponction et le biseau perpendiculaire.</p>
<h3>4.2 Céphalée post-ponction durale : l’acte</h3>
<p data-evidence="G97-C0076">L’aiguille coupante, le gros calibre, le nombre de tentatives et l’expérience de l’opérateur augmentent le risque, avec une certitude modérée. Le décubitus latéral est associé à un risque moindre. Le niveau de ponction n’a pas d’effet.</p>
<h3>4.3 Hématome épidural rachidien</h3>
<p data-evidence="G97-C0077">L’âge avancé, une coagulopathie pré- ou postopératoire et une laminectomie multiétagée augmentent le risque. L’hypertension préopératoire non contrôlée, les pics tensionnels à l’extubation et la pression systolique postopératoire élevée sont associés, avec des preuves de faible qualité. Les drains aspiratifs prophylactiques ne réduisent pas l’incidence. Les antithrombotiques avec anesthésie neuraxiale exposent à un risque accru, qui impose des intervalles dépendant de la molécule, de la dose, de la fonction rénale et du caractère traumatique de la ponction.</p>
<h3>4.4 Mutisme cérébelleux</h3>
<p data-evidence="G97-C0078">Dans la cohorte européenne, les facteurs indépendants sont un âge plus jeune, la localisation (quatrième ventricule ou tronc) et l’histologie. Le médulloblastome multiplie le risque par 2,85 et la tumeur tératoïde/rhabdoïde atypique par 10,30, par comparaison avec l’astrocytome pilocytique. Une localisation vermienne (OR 0,34) ou hémisphérique (OR 0,23) est moins à risque que le quatrième ventricule. La voie transvermienne ne diffère pas de la voie télovélaire (OR 0,89). La latéralité gauche n’est pas associée au risque (OR 1,08). Une hydrocéphalie préopératoire est présente chez 64 % des enfants, mais elle n’est pas indépendamment associée (OR ajusté 1,20) et la traiter avant l’exérèse ne réduit pas le risque. Le sigle <button class="w" data-k="g97-or">OR (odds ratio, lecture)</button> désigne un rapport de cotes.</p>
<div class="trap" data-evidence="G97-C0079"><span class="k">Piège</span> Une cote de 2,85 ou de 10,30 mesure une association entre l’histologie et le mutisme, pas une probabilité absolue. Seul le chiffre de 30 % de trouble de la parole postopératoire, calculé sur l’ensemble de la cohorte, donne une fréquence.</div>
<div class="key" data-evidence="G97-C0080"><b>À retenir.</b> Pour la céphalée post-ponction, le terrain (jeune, femme) est fixe ; l’aiguille est le facteur modifiable. Pour le mutisme, l’histologie et la localisation dominent, la voie d’abord et la latéralité non.</div>
<button class="pareto-btn ui" data-k="pareto-g97-causes">▲ Loi de Pareto — Causes et risque</button>
</section>

<section class="ilot" id="g97-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-evidence="G97-C0081">L’interrogatoire détermine l’acte, la date et la chronologie des symptômes. Il doit fixer d’abord le <b>délai depuis l’acte</b>, puis le caractère de la douleur.</p>
<h3>5.1 Antécédents et contexte</h3>
<p data-evidence="G97-C0082">Le médecin note la date et le type de ponction ou d’intervention, le calibre et le type d’aiguille quand ils sont connus, le nombre de tentatives et une brèche accidentelle éventuelle. Il demande les antécédents de céphalée chronique ou de céphalée post-ponction, car ils élèvent le risque. Il note les antithrombotiques et les troubles de coagulation, déterminants de l’hématome. Chez l’enfant opéré d’une tumeur, il consigne l’état de la parole avant l’opération, indispensable pour interpréter un trouble postopératoire.</p>
<h3>5.2 Les symptômes</h3>
<p data-evidence="G97-C0083">Pour la <b>céphalée post-ponction</b>, on recherche le délai (dans les 5 jours), le caractère orthostatique (aggravation rapide assis ou debout, amélioration allongé) et les signes associés : <button class="w" data-k="g97-orthostatique">raideur de nuque, symptômes auditifs, troubles visuels, vertiges, acouphènes, photophobie, nausées (fréquence et limites)</button>. Le caractère orthostatique est fréquent mais non obligatoire : dans une cohorte de parturientes, seules 8 sur 142 avec céphalée post-ponction n’avaient pas de composante posturale.</p>
<p data-evidence="G97-C0084">Pour l’<b>hématome rachidien</b>, la majorité des cas survient dans les 24 à 48 heures postopératoires, mais une survenue plus tardive est possible. La séquence typique associe une forte augmentation de la douleur axiale, des symptômes radiculaires, une faiblesse motrice, puis des troubles sphinctériens.</p>
<p data-evidence="G97-C0085">Pour le <b>mutisme</b>, le début est médian au jour 1 (0 à 10 jours) pour le mutisme et au jour 0 (0 à 4 jours) pour la parole réduite.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p data-evidence="G97-C0086">Céphalée orthostatique dans les 5 jours d’une ponction, avec raideur de nuque ou symptômes auditifs, examen neurologique normal.</p></div><div class="card"><h4>Forme atypique ou alarmante</h4><p data-evidence="G97-C0087">Céphalée non orthostatique, apparue plus de 5 jours après la ponction, ou modifiée après une phase orthostatique : l’imagerie cérébrale est à envisager.</p></div></div>
<div class="trap" data-evidence="G97-C0088"><span class="k">Piège</span> Le caractère orthostatique ne se conclut pas par « tout ou rien ». Une composante posturale absente n’exclut pas le diagnostic, mais impose de chercher une autre cause, d’où le seuil d’imagerie pour une céphalée non orthostatique.</div>
<div class="key" data-evidence="G97-C0089"><b>À retenir.</b> Le délai (5 jours), la posture et les signes associés posent le diagnostic de céphalée post-ponction ; la chronologie douleur, radiculalgie, déficit, sphincters signe l’hématome.</div>
</section>

<section class="ilot" id="g97-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-evidence="G97-C0090">L’examen suit l’ordre habituel : état général, constantes, puis signes ciblés. Il vise deux objectifs : confirmer le tableau typique et repérer les signes qui imposent une imagerie urgente.</p>
<div class="two"><div class="card"><h4>Céphalée après ponction</h4><p data-evidence="G97-C0091">Le médecin recherche une raideur de nuque. Il vérifie l’absence de tout signe focal, de trouble visuel, d’altération de la conscience et de crise : chacun impose une imagerie urgente. Il teste la posture : l’aggravation assis et le soulagement allongé appuient le diagnostic.</p></div><div class="card"><h4>Chirurgie rachidienne</h4><p data-evidence="G97-C0092">L’examen neurologique est répété : force, sensibilité, fonction sphinctérienne. Une dégradation par rapport à l’examen précédent est le signal : la séquence se lit dans l’évolution.</p></div></div>
<div class="two"><div class="card"><h4>Enfant opéré de la fosse postérieure</h4><p data-evidence="G97-C0093">La parole est évaluée avant et après l’opération, avec l’examen neurologique. Le mutisme correspond à une parole absente ou sévèrement réduite ; sa définition précise reste débattue, d’où l’intérêt d’une évaluation répétée et datée.</p></div><div class="card"><h4>Porteur d’une dérivation</h4><p data-evidence="G97-C0094">La céphalée posturale, les nausées et les vomissements orientent vers le surdrainage ; leur confirmation passe par l’imagerie (ventricules fins, collections sous-durales).</p></div></div>
<div class="trap" data-evidence="G97-C0095"><span class="k">Piège</span> La raideur de nuque accompagne souvent la céphalée post-ponction. Elle ne dispense pas de rechercher un signe focal, un trouble visuel, une altération de la conscience ou une crise : l’un d’eux impose une imagerie urgente.</div>
<div class="key" data-evidence="G97-C0096"><b>À retenir.</b> L’examen répété compte plus qu’un examen unique après chirurgie rachidienne. Après une ponction, tout signe focal, trouble visuel, altération de la conscience ou crise sort du cadre de la céphalée post-ponction simple.</div>
