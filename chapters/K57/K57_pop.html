<template data-pop="pareto-k57-clinique" data-title="Loi de Pareto — Maladie diverticulaire"><p class="ratio" data-cover="k57-3,k57-4,k57-5,k57-6,k57-7,k57-9"></p><ul><li>On ne pose jamais le diagnostic sur la clinique seule.</li><li>Scanner injecté ; classification WSES.</li><li>Forme simple, immunocompétent : pas d’antibiotique, suivi ≤ 7 jours.</li><li>Un abcès < 4-5 cm reçoit des antibiotiques, et un abcès plus gros un drainage.</li><li>La péritonite s’opère par Hartmann ou par résection-anastomose.</li><li>La chirurgie à froid dépend du patient, et non du nombre d’épisodes.</li></ul></template>
<template data-pop="pareto-k57-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k57-e-1,k57-e-2"></p><ul><li>On dose la CRP et les leucocytes.</li><li>Scanner injecté en premier.</li><li>Stade WSES dans le compte rendu.</li><li>Après un abcès, on fait une coloscopie à 4-6 semaines.</li></ul></template>
<template data-pop="pareto-k57-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k57-p-1,k57-p-2,k57-p-3"></p><ul><li>Pas d’antibiotique dans la forme simple de l’immunocompétent.</li><li>Si un antibiotique est nécessaire, la co-amoxicilline dure 7 jours.</li><li>Sévère : pipéracilline-tazobactam 4 500 mg/8 h.</li><li>Éviter les AINS.</li></ul></template>
<template data-pop="k57-dva" data-title="Diverticulite aiguë"><p class="lab">Définition</p><p>C’est l’inflammation, souvent infectieuse, d’un ou de plusieurs diverticules.</p><p class="lab">Non compliquée</p><p>Limitée au côlon ; souvent autolimitée chez l’immunocompétent.</p><p class="lab">Compliquée</p><p>Infection au-delà du côlon : gaz, abcès, péritonite.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7206757/" target="_blank" rel="noopener">Sartelli M. et al., 2020 update of the WSES guidelines for the management of acute colonic diverticulitis in the emergency setting, World J Emerg Surg 2020;15:32</a>.</p></template>
<template data-pop="k57-dvose" data-title="Diverticulose"><p class="lab">Définition</p><p>C’est la présence de diverticules, souvent asymptomatique.</p><p class="lab">Mécanisme</p><p>La muqueuse fait hernie aux points où les vaisseaux traversent la musculeuse, car la paroi y est plus faible.</p><p class="lab">Risque</p><p>Environ 4 % des porteurs font une diverticulite au cours de la vie.</p><figure><img src="data:image/gif;base64,R0lGODdhqgHEAYUAAPPAjPekYPueXumdXPWWYfSVS+aVUdGUV+6MT+GLSNaKVNaJN8uJVMuHO8KHS7WGU86BQMt6PcB/RL94O7h9T7h8Pbd1QLVuO613TKx2PqtsR6xsN6NxRKNqQZ1sQ45tSqZjPZ5hPphiP5dbPpFfQJBYPolbP35aQIpRPYFQPHZOQHdOOHhIOW5IOnBEN24/NGNHO2JBOGQ9NVk9NVs5M1YzL0owLDYtKjAkIykYHRUUHBEEGAYJGQQEGAUCGwQBEywAAAAAqgHEAUAI/wB/CBxIsKBBgzwS8vCxo6FChT0aNvTB8CFFhhJ59KD4MGGPhRcffuzx0aNEiRR13MDxI2FLhxdjypRpUWTHkDp46Mipk2fHhD57Joz5cKcOjjyNGt0BNGmOhjpw4NiZo+pOmEqN+jAq9GfWrzubgg3bkexYpUDFolULtmfSpkBx3EjIMqfdn2nzsv2qECrXvhL/FtWLF/COoIUfCrSIkuTIHgNPSvxBMrLkHQIvayRJkSQPzItBfp6c+OdlzKeZ4m1ZVEcPri2XHkaMl2fJkqUJr3V7NWFgu3zPCjeaY2xx4larKq86VcdyHMtzSIX+nPrU4tCnS1U+Xbp279q/3/+YMQP89+7db6y0vr47cqrhoyud2Nmx5M4+Mp/cXN+x44ueXUbRDjMB6J9jLh3oX2wo9adgZY79ENJCobHGW1TNSbUTgzp88MEJM/ygVHbhyRWeeu2Fh+FOJZ6IInTGNRedd8dJZ6N37XFnYnTdMSfXiz7+2CKKNthApJFHFkneDEXW4KSTRTZJA3kxVEnDk082WYMMMchwZQ1RhunklDHMcGWUW77gwgsvyMCmDG66sCacTsrgwgostOmmnnD26ScNZMJQJXmAzhADDIJ6CSgNfVbZQpdexkBDmFqCWaR60DU00FYD7kdSQ08R6AOCGDXI2UcXNRjTRj54BKFq+eH/FptrI+kH2YO4KUjZXkKCB1aooKF2VWBBTpfidPD9eOlKKB6L6Xa9IhekjzlS+6KxN1DKrFRRZhvlDFB6S6mlNmBJbrfqVVoDDTB4+WSfLrTQggt+7skno4fKYOm+Zp5rAw13stCCn2zKaTCbaqrJwsIqLOyww2uykEIKebog8cJysrDCxiqosMKaCmu8scF4Lrzxx22qKWcLbT5JA8Jq/oklpTZk6hCElQl0m34NHeibRAtGxBRklNWq88+n/aCpgUKr2inQQhnlnlLgPRsfjcrJcIKHJ9DwnNUrFYcjtta1KBXY1OmoXbfYNmv1j+nS7O+4NBxaJrhOLmnoofIO/4xvu3XbDWmk8tbbN8jx9q3Coy/H23HfggLaJKKIVnk3nCsbjPjJK1Cs8poWdz5xni9IPPHpqHsecscLn44CCiag4Lrrso8OusgnjByyxizI+YK8CMMJaA2SirkkkmevpIPOuEbENM7N+8eRg6PNRpZAO8UKWNGjvmYcVcnCmJV3zsENLYnQsojdidm9LRfN5RrJrZHjQukkDjPgsCy65S5K85JQQpP9ijQ/l1UJBi1IFJwQ2LcGtqBji5OXx <template data-pop="k57-tdm" data-title="Scanner abdominal injecté"><p class="lab">Place</p><p>Imagerie de premier choix (WSES 2B).</p><p class="lab">Apport</p><p>Sa VPP atteint 0,95 et sa VPN 0,99, contre 0,65 et 0,98 pour la clinique seule.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7206757/" target="_blank" rel="noopener">Sartelli M. et al., 2020 update of the WSES guidelines for the management of acute colonic diverticulitis in the emergency setting, World J Emerg Surg 2020;15:32</a>.</p></template>
<template data-pop="k57-echo" data-title="Échographie"><p class="lab">Place</p><p>Un opérateur expert peut l’utiliser en évaluation initiale ; si elle n’est pas concluante ou est négative, on fait un scanner (2B).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7206757/" target="_blank" rel="noopener">Sartelli M. et al., 2020 update of the WSES guidelines for the management of acute colonic diverticulitis in the emergency setting, World J Emerg Surg 2020;15:32</a>.</p></template>
<template data-pop="k57-abces" data-title="Abcès diverticulaire"><p class="lab">< 4-5 cm</p><p>On donne d’abord des antibiotiques seuls (2C), car les petits abcès guérissent souvent ainsi.</p><p class="lab">Plus gros</p><p>On draine par voie percutanée et l’on donne des antibiotiques ; sinon, on donne des antibiotiques seuls si l’état le permet, ou l’on opère.</p><p class="lab">Ensuite</p><p>On fait une coloscopie à 4-6 semaines, car un cancer peut simuler un abcès diverticulaire.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7206757/" target="_blank" rel="noopener">Sartelli M. et al., 2020 update of the WSES guidelines for the management of acute colonic diverticulitis in the emergency setting, World J Emerg Surg 2020;15:32</a>.</p></template>
<template data-pop="k57-hartmann" data-title="Intervention de Hartmann"><p class="lab">Principe</p><p>Le chirurgien résèque le sigmoïde, ferme le moignon rectal et fait une colostomie terminale.</p><p class="lab">Indication</p><p>Péritonite diffuse chez le patient critique ou comorbide (WSES, forte).</p><p class="lab">Alternative</p><p>Résection-anastomose ± stomie chez le patient stable.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7206757/" target="_blank" rel="noopener">Sartelli M. et al., 2020 update of the WSES guidelines for the management of acute colonic diverticulitis in the emergency setting, World J Emerg Surg 2020;15:32</a>.</p></template>
<template data-pop="k57-sigmo" data-title="Sigmoïdectomie programmée"><p class="lab">Décision</p><p>On la décide selon les facteurs du patient, et non selon le nombre d’épisodes (2D).</p><p class="lab">Exemple</p><p>Immunodéprimé après un épisode traité médicalement.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7206757/" target="_blank" rel="noopener">Sartelli M. et al., 2020 update of the WSES guidelines for the management of acute colonic diverticulitis in the emergency setting, World J Emerg Surg 2020;15:32</a>.</p></template>
<template data-pop="k57-d-coamox" data-title="Amoxicilline-acide clavulanique"><p class="lab">Dose (CHUV)</p><p>On donne 1 200-2 200 mg i.v. toutes les 6-8 h, ou 1 000 mg per os toutes les 8-12 h.</p><p class="lab">FI i.v.</p><p>La FI prévoit 1 200 mg 3-4 ×/j dans l’infection modérée et 2 200 mg 3-4 ×/j dans l’infection grave, mais pas 2 200 mg si la ClCr est < 30 ml/min.</p><p class="lab">Contre-indications</p><p>Elle est contre-indiquée en cas d’allergie aux pénicillines ou aux céphalosporines et d’ictère antérieur sous co-amoxicilline.</p><p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/min/552801_22_DM_DAM_guide_antibiotherapie_version_mai_2022.pdf" target="_blank" rel="noopener">Service des maladies infectieuses et Pharmacie du CHUV, Guide d’antibiothérapie empirique chez l’adulte, version de mai 2022 (infections intra-abdominales, p. 22-23 ; posologies usuelles, p. 52)</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Co-Amoxi-Mepha i.v., Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Augmentin®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k57-d-cipro" data-title="Ciprofloxacine + métronidazole"><p class="lab">Place</p><p>On les associe en cas d’allergie aux bêta-lactamines.</p><p class="lab">Doses (CHUV)</p><p>La ciprofloxacine se donne à 400 mg i.v. toutes les 12 h ou 500 mg per os toutes les 12 h, et le métronidazole à 500 mg toutes les 8 h.</p><p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/min/552801_22_DM_DAM_guide_antibiotherapie_version_mai_2022.pdf" target="_blank" rel="noopener">Service des maladies infectieuses et Pharmacie du CHUV, Guide d’antibiothérapie empirique chez l’adulte, version de mai 2022 (infections intra-abdominales, p. 22-23 ; posologies usuelles, p. 52)</a>.</p></template>
<template data-pop="k57-d-pipt" data-title="Pipéracilline-tazobactam"><p class="lab">Place</p><p>On la réserve à l’infection sévère ou au risque de Pseudomonas aeruginosa.</p><p class="lab">Dose (CHUV)</p><p>On donne 4 500 mg toutes les 8 h, ou toutes les 6 h en cas de choc ou de neutropénie.</p><p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/min/552801_22_DM_DAM_guide_antibiotherapie_version_mai_2022.pdf" target="_blank" rel="noopener">Service des maladies infectieuses et Pharmacie du CHUV, Guide d’antibiothérapie empirique chez l’adulte, version de mai 2022 (infections intra-abdominales, p. 22-23 ; posologies usuelles, p. 52)</a>.</p></template>
