<section class="ilot" id="k57-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 62 ans, sans immunosuppression, a depuis deux jours une douleur de la fosse iliaque gauche, une fièvre à 38,0 °C et une CRP à 85 mg/l ; elle boit et s’alimente. <b>La question est donc de savoir s’il s’agit d’une <button class="w" data-k="k57-dva">diverticulite aiguë</button>, si elle est compliquée, et si elle a vraiment besoin d’antibiotiques et d’une hospitalisation.</b></p><p>Pour y répondre, le médecin doit savoir : ne pas poser le diagnostic sur le seul examen clinique ; demander un <button class="w" data-k="k57-tdm">scanner abdominal injecté</button> ; classer l’épisode selon la <button class="w" data-k="k57-classif">classification WSES</button> ; ensuite, renoncer aux antibiotiques dans la forme non compliquée de l’immunocompétent, traiter l’<button class="w" data-k="k57-abces">abcès</button> selon sa taille, et opérer la péritonite ; enfin, décider de la coloscopie et de la chirurgie à froid.</p><p><i>Pourquoi ce cas ?</i> En effet, il réunit les trois décisions qui changent le pronostic : imagerie, antibiotiques et lieu de prise en charge. Ainsi, contrairement à un manuel figé, chaque mot vert ouvre le critère exact et sa source, si bien que le raisonnement peut être refait au lit du patient.</p><div class="key"><b>Point de départ.</b> Douleur de la fosse iliaque gauche + fièvre + CRP : scanner injecté → classification WSES → traitement selon le stade.</div></section>
<section class="ilot" id="k57-1"><h2><span class="n">1</span>Définitions et épidémiologie</h2><p>La <button class="w" data-k="k57-dvose">diverticulose</button> désigne la présence de diverticules, petites hernies de la muqueuse à travers la paroi colique ; or, elle est le plus souvent asymptomatique. En revanche, la diverticulite est l’inflammation, souvent infectieuse, d’un ou de plusieurs diverticules ; elle est dite non compliquée si l’inflammation reste dans la paroi colique, et compliquée si le processus infectieux dépasse le côlon (WSES 2020).</p><p>Par ailleurs, la prévalence de la diverticulose augmente partout dans le monde, probablement en raison du mode de vie ; de plus, son incidence progresse chez les sujets jeunes. Ainsi, le risque, au cours de la vie, de faire une diverticulite gauche est d’environ 4 % chez les porteurs de diverticules, et jusqu’à un cinquième des patients atteints ont moins de 50 ans dans les populations occidentales. Enfin, le côlon sigmoïde est le siège le plus fréquent, alors que la diverticulite droite est plus rare en Occident mais prédomine dans certaines régions du monde (WSES 2020).</p><figure><img src="data:image/gif;base64,R0lGODdhWAJ9AYUAAO3q6Obi2OPg2uXf0d7e3eLd1Nnc2+HazdrZ1NbZ1tHZ2dXXz9bTzeHQstXNt83SzsjHv9+xesazn8agj9mgUcWYfsKOddOUQsqHOrCgmLGQf7aKdKiKd7OEcrODX6qDaZiDdLd8T6t8Y7BxUbVvLaR6ZaN3V6NwWqNsPpt3YZtyUppqVJppRpNvVpNnTY1qUXZyeKRiNpViRoxiTIthQ5dbOZRTMIdaQIdRNIBbQn9ROXlTO2xSQndHL2dFMVgxHiwAAAAAWAJ9AUAI/wAdQHDggIHBgwgTKlzIsGHCBxAiSoTwoKJFixErMrDo0OCCjwscPnjo8WNHhSEZgFy50mPJkCYPXqwY0cFIlyo3jkypkmfMng0hThwqUWjRmRc3Es2IdMEDpxVBXqQYFSnEqTStzmT5MYFXrwsSgPwq1qnXqGO7cl0bFuxXBGTLJjAQl65XBHATIDCAty9evnHDsiQ7Nm5dwwoUJEjMuPHixpAjS55MubLlxBUZa93MubPnz5svZ4BBGoZBgqhTC5SoemDEk7AVzhwqNOtVjQlhguy5tiTQhbp5s025E+VwmAd5IuyNcCjBgQY14r6JW3bGgQUZ2FxKtLb04iOrUv9Fy/Ii1Kcf0UPlqr68xfPkWco0CAGn8OOFDbdtqzdvXsNf0WUAX3z55Zde/f33X1n8dSUWgHUJuNhciUEY12UYZqjhhpllpgBoIIbomYYZQCCBBBmAAMKJJ7qm2ovZxSZjfdFxN9FN8+WGn3suhZdcR72ltBtsqS2n4448XUcjUyglp9xyyPmWnlM8 <section class="ilot" id="k57-2"><h2><span class="n">2</span>Physiopathologie : de la poche à la péritonite</h2><p>La diverticulite naît d’une poche qui se draine mal ; ainsi, l’inflammation débute dans la paroi du diverticule, puis gagne la graisse péricolique. Ensuite, si la paroi cède, une perforation contenue produit des bulles de gaz près du côlon, puis un <button class="w" data-k="k57-abces">abcès</button> ; enfin, si la perforation est libre, l’air et le pus, voire les selles, diffusent dans le péritoine. Par conséquent, chaque stade de la <button class="w" data-k="k57-classif">classification WSES</button> correspond à une étape anatomique de cette progression.</p><p>Cependant, la défense locale suffit souvent. En effet, la WSES rappelle que la diverticulite non compliquée peut être une maladie autolimitée, que les défenses de l’hôte contrôlent sans antibiotique chez l’immunocompétent. En revanche, l’immunodéprimé ne contient pas l’infection : il fait plus souvent des formes compliquées et échoue davantage au traitement non opératoire, si bien qu’il est considéré à haut risque (WSES 2020).</p><table class="t"><tr><th>Étape anatomique</th><th>Traduction au scanner</th><th>Stade WSES</th></tr><tr><td>Inflammation pariétale et péricolique</td><td>Paroi épaissie, graisse infiltrée</td><td>0</td></tr><tr><td>Perforation couverte</td><td>Bulles de gaz péricoliques</td><td>1a</td></tr><tr><td>Abcès au contact</td><td>Abcès < 4 cm</td><td>1b</td></tr><tr><td>Abcès pelvien</td><td>Abcès > 4 cm dans le pelvis</td><td>2a</td></tr><tr><td>Abcès à distance</td><td>Abcès hors du pelvis</td><td>2b</td></tr><tr><td>Perforation libre</td><td>Pneumopéritoine abondant et/ou liquide libre</td><td>3 et 4</td></tr></table><p><i>Que montre le tableau ?</i> Chaque ligne descend d’un étage dans la diffusion de l’infection ; or, plus l’infection s’éloigne du côlon, moins l’organisme peut la circonscrire. C’est pourquoi le traitement passe de la simple surveillance à l’antibiothérapie, puis au drainage, puis à la chirurgie.</p><div class="key"><b>À retenir.</b> Poche mal drainée → inflammation → perforation couverte → abcès → perforation libre ; l’immunocompétent contient souvent seul la forme simple ; l’immunodéprimé non.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7206757/" target="_blank" rel="noopener">Sartelli M. et al., 2020 update of the WSES guidelines for the management of acute colonic diverticulitis in the emergency setting, World J Emerg Surg 2020;15:32</a>.</p></section>
<section class="ilot" id="k57-3"><h2><span class="n">3</span>Présentation clinique et diagnostic</h2><p>Classiquement, la diverticulite gauche se traduit par une douleur ou une sensibilité aiguë du quadrant inférieur gauche, avec une élévation de la CRP et des leucocytes. Cependant, le diagnostic clinique manque de précision ; en effet, dans une série prospective de 802 patients, sa valeur prédictive positive n’était que de 0,65, contre 0,95 après imagerie en coupes. C’est pourquoi la WSES suggère une évaluation complète, associant anamnèse, examen, marqueurs inflammatoires et imagerie, et déconseille de conclure sur l’examen seul (WSES 2020).</p><p>Par ailleurs, la CRP renseigne sur la gravité. Ainsi, dans une étude citée par la WSES, une CRP initiale supérieure à 173 mg/l prédisait un stade supérieur à Hinchey Ib avec une sensibilité et une spécificité de 90,9 % ; de plus, tous les patients drainés ou opérés avaient une CRP au-delà de ce seuil. Toutefois, ce seuil provient d’une seule étude et ne remplace pas l’imagerie.</p><div class="quiz ui"><p>Une femme de 62 ans a une douleur de la fosse iliaque gauche typique, une fièvre et une CRP élevée. Que suggère la WSES ?</p><button data-ok="0">Traiter sur le seul tableau clinique, typique</button><button data-ok="1">Compléter par une imagerie, de préférence un scanner injecté</button><button data-ok="0">Faire une coloscopie en urgence</button><p class="fb" hidden>La valeur prédictive positive de la clinique seule est faible (0,65) ; le <button class="w" data-k="k57-tdm">scanner</button> injecté est l’imagerie de premier choix (WSES 2020, recommandation 2B).</p></div><div class="key"><b>À retenir.</b> Une douleur du quadrant inférieur gauche s’accompagne d’une élévation de la CRP et des leucocytes ; cependant, on ne pose jamais le diagnostic sur la clinique seule. Une CRP > 173 mg/l suggère une forme compliquée, selon une seule étude.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7206757/" target="_blank" rel="noopener">Sartelli M. et al., 2020 update of the WSES guidelines for the management of acute colonic diverticulitis in the emergency setting, World J Emerg Surg 2020;15:32</a>.</p></section>
<section class="ilot" id="k57-4"><h2><span class="n">4</span>Imagerie et classification WSES</h2><p>L’imagerie confirme donc le diagnostic et fixe le stade. Ainsi, le <button class="w" data-k="k57-tdm">scanner</button> abdominal injecté est l’examen de premier choix (recommandation 2B) ; cependant, l’<button class="w" data-k="k57-echo">échographie</button> peut être utilisée en premier par un opérateur expert, avec un scanner si elle est non concluante ou négative (recommandation 2B). Ensuite, le compte rendu classe l’épisode selon la <button class="w" data-k="k57-classif">classification WSES</button>, fondée sur le scanner.</p><p>En effet, cette classification distingue la forme non compliquée (stade 0 : diverticules, paroi épaissie, densification de la graisse) des formes compliquées : 1a, bulles de gaz localisées ; 1b, <button class="w" data-k="k57-abces">abcès</button> de moins de 4 cm ; 2a, abcès pelvien de plus de 4 cm ; 2b, abcès à distance hors du pelvis ; 3, péritonite purulente diffuse ; 4, péritonite stercorale (WSES 2020). Par conséquent, la taille et le siège de l’abcès, ainsi que la quantité d’air et de liquide libres, commandent le traitement.</p><figure><img src="data:image/gif;base64,R0lGODdhWALpAYUAAP////7+/v39/fPz88/Pz6mpqZSUlImJiYGBgXt7e3Z2dnFxcW1tbWlpaWRkZWBgYFxcXFhWVlFRUUtLS0VERT4+Pjc3NzExMS0sLSgoKCMjIx8fIBwcHRoaGhgYGBUVFRMTExURERAQEA8PDw4NDgsLDAoKCgkJCQYGBwUFBQQEBAICAwEBAQAEBAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWALpAUAI/wBfCBxIsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatzIsaPHjyBDinyx4oWGASNTqlzJsqXLlyNXqBjIAkUJEiRE6OyQAYOGDRsyXLhQocIFDRyAYrBwIYPTpUUtWKiAIYMFChWYasigwcOHEiRRpBDIAqbZs2jTql3Ltu1FFmUHrijhYSuGoRemUsDa1GkGDh8+dPhAAoXYFChMlEihIkUKuAJVqGBxooOHmSQLv2AxeYVhwydKCky8QmaJESgilwAhYsSJmmM9z0x8gjFcE4RX4PYgAoTXEyhOnCjxOqzNESRK6j7Ru2SK0C+eJyZxwgSKmtQFzuWtYoULFYo/bP+4W4Fvhg0mRMd1y769+/fw4zdE4QFDhQn4KVzowD+59tIokFCCCSmopwIJIIygEwnWrfeCCifkNBMLKzyH3AkCmSBCCSVRlqBjACJI2HAfeEDCc4qdgJkKOl33wgm8AYcChByStAJl1JUQWHEvoDCC <section class="ilot" id="k57-5"><h2><span class="n">5</span>Traitement de la diverticulite non compliquée</h2><p>Dans la forme non compliquée, la stratégie s’est allégée. Ainsi, chez l’immunocompétent sans signe d’inflammation systémique, la WSES recommande de ne pas prescrire d’antibiotique (recommandation forte, 1A) ; en effet, dans l’essai DIABOLO, la surveillance sans antibiotique n’a pas prolongé la guérison d’un premier épisode prouvé au <button class="w" data-k="k57-tdm">scanner</button>. De même, le CHUV admet une approche sans antibiotique si le scanner montre une inflammation péricolique sans <button class="w" data-k="k57-abces">abcès</button> ni complication, sans sepsis ni immunosuppression, avec un suivi ambulatoire rapproché.</p><p>Par ailleurs, le patient sans comorbidité qui boit et se gère seul peut être traité en ambulatoire, avec une réévaluation dans les 7 jours, ou plus tôt s’il s’aggrave (recommandation 2B). En revanche, lorsque des antibiotiques sont nécessaires, la voie orale est recommandée chaque fois que possible (recommandation forte, 1B) ; le CHUV propose alors l’<button class="w" data-k="k57-d-coamox">amoxicilline-acide clavulanique</button> pendant 7 jours. Enfin, le CHUV conseille d’éviter les AINS.</p><div class="trap"><span class="k">Piège</span>« Pas d’antibiotique » ne veut pas dire « pas de suivi » : l’abstention n’est sûre que chez l’immunocompétent, sans sepsis, avec une forme prouvée non compliquée au scanner et une réévaluation dans les 7 jours.</div><div class="key"><b>À retenir.</b> Le patient immunocompétent avec une forme non compliquée sans inflammation systémique ne reçoit pas d’antibiotique (1A), car l’inflammation guérit seule. On le traite en ambulatoire si possible et on le revoit dans les 7 jours. Si un antibiotique est nécessaire, on donne la co-amoxicilline per os pendant 7 jours (CHUV), et l’on évite les AINS.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7206757/" target="_blank" rel="noopener">Sartelli M. et al., 2020 update of the WSES guidelines for the management of acute colonic diverticulitis in the emergency setting, World J Emerg Surg 2020;15:32</a> ; <a href="https://www.chuv.ch/fileadmin/sites/min/552801_22_DM_DAM_guide_antibiotherapie_version_mai_2022.pdf" target="_blank" rel="noopener">Service des maladies infectieuses et Pharmacie du CHUV, Guide d’antibiothérapie empirique chez l’adulte, version de mai 2022 (infections intra-abdominales, p. 22-23 ; posologies usuelles, p. 52)</a>.</p></section>
