<h1>Avitaminose A</h1><span class="status">Adulte suisse malabsorbeur et enfant de pays à ressources limitées · référentiels : <button class="w" data-k="e50-sources-guides">ESPEN</button> 2022, OMS 1997, 2011 et 2014, valeurs <button class="w" data-k="e50-apports">D-A-CH</button> 2020, directives <button class="w" data-k="e50-bariatrique">SMOB</button> 2023, séries suisses 2023, informations professionnelles suisses · état au 15.10.2026, relecture différée · revue par intelligence artificielle, validation médicale indépendante en attente</span></div>

<section class="ilot" id="e50-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; elles illustrent les critères des sources citées et ne décrivent aucun patient réel.</p><p>Un homme de 41 ans a bénéficié, il y a six ans, d’une dérivation biliopancréatique pour une obésité sévère. Il consulte pour une gêne croissante à la conduite de nuit et pour un œil qui pique et paraît terne. Son poids est stable et il ne se plaint d’aucun trouble digestif. Un médecin pressé évoquerait un défaut de lunettes ou une conjonctivite. <b>La question décisive est ailleurs : cet opéré absorbe-t-il encore assez de graisses pour absorber la vitamine A, et son œil montre-t-il déjà les lésions de la xérophtalmie ?</b></p><p>La vitamine A est liposoluble : elle suit les graisses dans l’intestin grêle, se stocke dans le foie et ne se mobilise qu’au besoin. Ces trois propriétés expliquent le profil de la carence. Les <button class="w" data-k="e50-reserves">réserves hépatiques</button> couvrent environ six mois d’apports insuffisants, ce qui retarde les signes, puis la carence s’exprime d’abord dans les tissus qui dépendent le plus de la vitamine : la rétine, qui détecte la lumière faible, et les épithéliums de surface, qui doivent rester humides et différenciés. En Suisse, la carence d’apport est rare ; la forme rencontrée est celle d’une <button class="w" data-k="e50-malabsorption">malabsorption des graisses</button> ou d’une maladie du foie.</p><p>La clé du diagnostic tient en un réflexe : devant une cécité nocturne ou une atteinte de la surface de l’œil chez un patient à risque, doser le rétinol sans attendre que la cornée soit touchée, car la lésion cornéenne laisse des cicatrices définitives, alors que la cécité nocturne répond au traitement en un à deux jours.</p><div class="key"><b>Point de départ.</b> Le médecin retient <button class="w" data-k="e50-xerophtalmie-oms">la gradation clinique de la xérophtalmie selon l’OMS (stades XN à XF)</button> et <button class="w" data-k="e50-retinol-serique">le rétinol sérique (valeur, seuils et pièges d’interprétation)</button>.</div><p>Le chapitre suit l’ordre d’une consultation : définir et comprendre (îlots 1 à 4), reconnaître (îlots 5 à 8), traiter sans intoxiquer (îlots 9 et 10), puis suivre et prévenir (îlots 11 à 13).</p><p class="src">Référence : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">Berger et al., recommandations ESPEN sur les micronutriments, Clin Nutr 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37921090/" target="_blank" rel="noopener">série suisse de rétinopathies par carence en vitamine A, 2023</a>.</p></section>
<section class="ilot" id="e50-1"><h2><span class="n">1</span>Définition et classification</h2><p>La <button class="w" data-k="e50-vitamine-a">vitamine A</button> désigne un groupe de composés qui possèdent l’activité vitaminique A. Le rétinol en est la forme centrale ; l’organisme le stocke sous forme d’esters de rétinyle. Les caroténoïdes végétaux, surtout le β-carotène, sont des provitamines : le corps les transforme en vitamine A. L’<b>avitaminose A</b> est l’état d’insuffisance de cet apport ou de ce stockage, assez marqué pour altérer la fonction des tissus. La <b>xérophtalmie</b> est le spectre des manifestations oculaires qui en résultent, de la cécité nocturne à la kératomalacie.</p><p>La CIM-10-GM 2024 range l’avitaminose A sous E50 et décline dix sous-codes. Presque tous sont oculaires et suivent la gradation clinique de la xérophtalmie ; le tableau les rapproche de la <button class="w" data-k="e50-xerophtalmie-oms">classification de l’OMS</button> pour que le code et le stade se lisent ensemble.</p><table class="t"><tr><th>Code</th><th>Intitulé</th><th>Stade OMS correspondant</th></tr><tr><td>E50.0</td><td>Avitaminose A avec xérosis conjonctival</td><td>X1A</td></tr><tr><td>E50.1</td><td>Avec taches de Bitot et xérosis conjonctival</td><td>X1B</td></tr><tr><td>E50.2</td><td>Avec xérosis cornéen</td><td>X2</td></tr><tr><td>E50.3</td><td>Avec xérosis et ulcération de la cornée</td><td>X3A (moins d’un tiers de la cornée) ou X3B (un tiers ou plus)</td></tr><tr><td>E50.4</td><td>Avec kératomalacie</td><td>X3A ou X3B</td></tr><tr><td>E50.5</td><td>Avec héméralopie (cécité nocturne)</td><td>XN</td></tr><tr><td>E50.6</td><td>Avec cicatrices xérophtalmiques de la cornée</td><td>XS</td></tr><tr><td>E50.7</td><td>Autres manifestations oculaires</td><td>par exemple XF, fond d’œil xérophtalmique</td></tr><tr><td>E50.8</td><td>Autres manifestations de l’avitaminose A</td><td>atteintes extra-oculaires</td></tr><tr><td>E50.9</td><td>Avitaminose A, sans précision</td><td>aucun</td></tr></table><p>Le tableau montre une particularité utile au codage : la correspondance est approximative. E50.3 et E50.4 recouvrent les mêmes stades X3A et X3B, parce que la CIM distingue l’ulcération de la kératomalacie alors que l’OMS les regroupe selon l’étendue de la lésion. Le stade XS ne représente pas une carence active : il enregistre la cicatrice d’un épisode passé, et le patient peut avoir un rétinol normal.</p><div class="trap"><span class="k">Piège</span> La CIM française emploie « héméralopie » pour la cécité nocturne, que la littérature anglo-saxonne nomme « night blindness » et parfois « nyctalopie ». Un même symptôme porte donc plusieurs noms (<button class="w" data-k="e50-nyctalopie">terminologie et définition de la cécité nocturne</button>).</div><p>Deux seuils de santé publique complètent la définition. Pour le rétinol sérique, la carence populationnelle est ≤ 0,70 µmol/L et la carence sévère &lt; 0,35 µmol/L, valeur sous laquelle la xérophtalmie est plus fréquente et plus grave. Ces seuils décrivent des groupes ; ils ne remplacent pas le raisonnement individuel (<button class="w" data-k="e50-retinol-serique">limites du rétinol sérique chez un patient</button>).</p><p>Enfin, l’évolution suit deux temps. Avant tout signe oculaire, la carence augmente déjà la susceptibilité aux infections, surtout respiratoires, et altère la barrière intestinale ; la xérophtalmie, elle, est une manifestation tardive d’une carence sévère. Le clinicien ne doit donc pas attendre l’œil pour y penser.</p><div class="key"><b>À retenir.</b> Dix sous-codes, un seul spectre oculaire : cécité nocturne, xérose conjonctivale, taches de Bitot, xérose cornéenne, ulcération ou kératomalacie, cicatrice. Plus le stade est avancé, plus le rétinol est bas et plus le pronostic visuel est réservé. <button class="w" data-k="e50-mnemo">Moyen mnémotechnique (aide pédagogique, non critère officiel)</button></div><p class="src">Références : CIM-10-GM 2024, OFS ; <a href="https://iris.who.int/server/api/core/bitstreams/eb2cbceb-6e5c-4eaf-b31a-36faa8dea00f/content" target="_blank" rel="noopener">OMS, xérophtalmie et cécité nocturne, 2014</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/9f05777e-c420-48e6-a1c2-cdd47e74c3b7/content" target="_blank" rel="noopener">OMS, rétinol sérique, 2011</a>.</p></section>
<section class="ilot" id="e50-2"><h2><span class="n">2</span>Épidémiologie</h2><p>La carence en vitamine A est un problème de santé publique dans la plupart des pays en développement, surtout chez l’enfant et la femme enceinte. L’OMS la désigne comme première cause évitable de cécité de l’enfant dans le monde. Le pic de la cécité nocturne se situe entre trois et six ans. La <button class="w" data-k="e50-rougeole">rougeole</button> aggrave la carence : la cécité rougeoleuse touche chaque année 15 000 à 60 000 enfants et constitue la première cause de cécité infantile dans les pays à faible revenu.</p><p>Cette épidémiologie mondiale ne décrit pas le médecin suisse. La littérature distingue trois profils, que le tableau compare avec les chiffres des sources.</p><table class="t"><tr><th>Profil</th><th>Donnée chiffrée</th><th>Source</th></tr><tr><td>Enfant des pays à haut revenu (<button class="w" data-k="e50-pays-riches">revue systématique de 61 cas</button>)</td><td>75 % par régime restrictif ; terrain autistique dans 49 % des cas ; atteinte cornéenne déjà présente au diagnostic dans 29,5 % des cas</td><td>Revue systématique 2026</td></tr><tr><td>Adulte après chirurgie bariatrique</td><td>Carence biologique : 18 % après bypass gastrique Roux en Y, 59 % après dérivation biliopancréatique, 37,8 % après dérivation avec switch duodénal ; 63,3 % pendant la grossesse après bypass ; délai médian d’apparition oculaire de 5 ans après bypass et de 14 à 27 ans après switch duodénal</td><td>Méta-analyse 2026</td></tr><tr><td>Adulte suisse (<button class="w" data-k="e50-suisse-serie">série de 5 patients, 2012–2022</button>)</td><td>Cinq rétinopathies, toutes liées à une malabsorption iatrogène ; délai médian de 14 mois entre les symptômes et le diagnostic</td><td>Gunzinger et al., 2023</td></tr></table><p>Le tableau enseigne trois choses. D’abord, la chirurgie malabsorptive expose bien davantage que la chirurgie restrictive : la dérivation biliopancréatique, qui court-circuite une grande part de l’intestin grêle, multiplie par plus de trois la prévalence observée après un bypass gastrique. Ensuite, le délai de survenue peut atteindre des décennies, de sorte qu’un antécédent lointain reste pertinent. Enfin, la carence reste méconnue en médiane 14 mois dans la série suisse, ce qui prolonge l’exposition au risque cornéen.</p><p>Deux autres terrains figurent dans la littérature. Dans la mucoviscidose, 10 à 40 % des patients sont carencés, quels que soient l’âge, le génotype ou la fonction pancréatique. Parmi les candidats à une transplantation hépatique, 69,8 % ont un rétinol bas. Il n’existe aucune prévalence suisse en population générale dans les sources lues, et cette lacune est nommée plutôt que comblée par une estimation.</p><div class="key"><b>À retenir.</b> En Suisse, la carence est rare mais attendue chez trois patients : l’opéré bariatrique (surtout malabsorptif), le patient atteint de mucoviscidose ou de malabsorption, et le patient hépatopathe. Le retard diagnostique médian dépasse un an.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/42785498/" target="_blank" rel="noopener">méta-analyse bariatrique 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42176959/" target="_blank" rel="noopener">revue des pays à haut revenu 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37921090/" target="_blank" rel="noopener">série suisse 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9537797/" target="_blank" rel="noopener">Sommer 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/14998696/" target="_blank" rel="noopener">Semba et Bloem 2004</a>.</p></section>
<section class="ilot" id="e50-3"><h2><span class="n">3</span>Du fonctionnement normal à la xérophtalmie</h2><p>Comprendre la carence suppose de suivre la vitamine A de l’assiette à l’œil. Chaque étape peut être interrompue, et chaque interruption correspond à une cause clinique de l’îlot suivant.</p><h3>Le circuit normal</h3><p>Les <button class="w" data-k="e50-apports">apports recommandés par les valeurs D-A-CH 2020</button> sont de 700 µg d’équivalents d’activité du rétinol (<button class="w" data-k="e50-rae">RAE</button>) par jour chez la femme et de 850 chez l’homme, 800 à partir de 65 ans ; la grossesse en demande 800 et l’allaitement 1300. L’<button class="w" data-k="e50-sources-guides">ESPEN</button> retient 700 pour la femme et 900 pour l’homme. Le rétinol préformé vient uniquement des aliments d’origine animale (foie, poisson, fromage, œufs, lait), les caroténoïdes des végétaux colorés (carotte, courge, poivron, abricot, légumes verts) ; environ une cuillère à café d’huile par repas, soit 2,4 à 5 g de graisse, est nécessaire à leur absorption.</p><p>Les micronutriments liposolubles suivent le sort des lipides : ils sont absorbés dans la moitié supérieure de l’intestin grêle, grâce à un transport saturable aux doses physiologiques et à une diffusion passive aux doses pharmacologiques ; les rétinoïdes sont absorbés à 75–100 %. Plus de 90 % de la vitamine A corporelle se loge ensuite dans le foie, sous forme d’esters de rétinyle. Pour répondre aux besoins, le foie libère du rétinol lié 1:1 à la <button class="w" data-k="e50-rbp">protéine de liaison du rétinol</button> (RBP), elle-même liée à la transthyrétine. Cette organisation maintient le rétinol sérique stable tant que les réserves ne sont ni épuisées ni très élevées.</p><div class="trap"><span class="k">Piège</span> Un rétinol sérique normal ne prouve pas des réserves suffisantes : il reste stable entre les extrêmes. Chez l’alcoolique chronique, les réserves hépatiques peuvent être épuisées alors que le rétinol sérique est encore normal.</div><h3>Les fonctions qui expliquent les signes</h3><p>Deux fonctions dominent. D’abord, le rétinal se combine à l’opsine pour former la <button class="w" data-k="e50-rhodopsine">rhodopsine</button>, pigment des bâtonnets, cellules rétiniennes qui détectent la lumière faible. Ensuite, l’<button class="w" data-k="e50-acide-retinoique">acide rétinoïque</button> (formes tout-trans et 9-cis) agit comme ligand de récepteurs nucléaires (RAR et RXR) qui règlent plus de 500 gènes, notamment la différenciation des muqueuses et la réponse immunitaire.</p><h3>De la carence à l’œil</h3><p>Une chaîne causale explique chaque stade. Si le rétinol manque, la rhodopsine diminue et les bâtonnets dysfonctionnent : c’est la <b>cécité nocturne</b>, souvent le premier signe, parfois révélée d’abord par l’éblouissement. Si l’acide rétinoïque manque, les épithéliums perdent leur différenciation et se kératinisent : la conjonctive devient sèche (xérose), des dépôts de cellules kératinisées blanchâtres et « mousseux » forment les <button class="w" data-k="e50-bitot">taches de Bitot</button>, la cornée devient terne puis se liquéfie en partie ou en totalité dans la <button class="w" data-k="e50-kerato">kératomalacie</button>. Enfin, la perte de différenciation des barrières intestinales et respiratoires aggrave les infections.</p><p>Plusieurs facteurs aggravants abaissent le rétinol sans modifier les réserves. L’<button class="w" data-k="e50-inflammation">inflammation</button> fait baisser la RBP, qui est une protéine négative de la phase aiguë, et augmente les pertes urinaires ; la carence en zinc, la dénutrition protéique et l’hépatopathie avancée réduisent la RBP et donc la mobilisation des réserves. Un rétinol bas peut ainsi traduire un blocage du transport sans carence réelle, et inversement.</p><table class="t"><tr><th>Rétinol sérique (µmol/L)</th><th>Conséquence fonctionnelle</th></tr><tr><td>&lt; 1,0</td><td>adaptation à l’obscurité altérée, possible</td></tr><tr><td>≤ 0,70</td><td>carence ; adaptation à l’obscurité plus souvent altérée</td></tr><tr><td>&lt; 0,35</td><td>carence sévère ; xérophtalmie franche surtout observée</td></tr></table><p>Le tableau décrit un gradient, non trois portes. Le seuil de 0,70 µmol/L sépare une population carencée d’une population non carencée ; chez un patient donné, la clinique et le terrain pèsent autant que la valeur.</p><div class="key"><b>À retenir.</b> Le rétinal de la rhodopsine explique la cécité nocturne ; l’acide rétinoïque explique la kératinisation, donc les lésions de surface et la sensibilité aux infections. Les réserves hépatiques couvrent environ six mois.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/eb2cbceb-6e5c-4eaf-b31a-36faa8dea00f/content" target="_blank" rel="noopener">OMS 2014</a> ; <a href="https://www.dge.de/wissenschaft/referenzwerte/vitamin-a/" target="_blank" rel="noopener">valeurs D-A-CH</a>.</p><button class="pareto-btn ui" data-k="pareto-e50-phys">▲ Loi de Pareto — Définition, épidémiologie et physiopathologie</button></section>
<section class="ilot" id="e50-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Les causes se rangent selon le maillon du circuit qui cède. Le tableau les hiérarchise par mécanisme, puisque la cause oriente à la fois la recherche, la prévention et la voie de traitement.</p><table class="t"><tr><th>Maillon atteint</th><th>Situations</th><th>Mécanisme</th></tr><tr><td>Apport insuffisant</td><td>Pays à ressources limitées ; régimes restrictifs ; troubles du spectre autistique ; perte de poids rapide volontaire</td><td>Peu de rétinol préformé ou de caroténoïdes consommés</td></tr><tr><td><button class="w" data-k="e50-malabsorption">Malabsorption des graisses</button></td><td>Chirurgie bariatrique (<button class="w" data-k="e50-bariatrique">dérivation biliopancréatique, switch duodénal, bypass gastrique Roux en Y</button>) ; syndrome de grêle court ; résection du grêle ; <button class="w" data-k="e50-mucoviscidose">mucoviscidose</button> ; maladie cœliaque ; diarrhée chronique</td><td>La vitamine, liposoluble, n’est pas absorbée avec les graisses</td></tr><tr><td><button class="w" data-k="e50-hepatique">Défaut hépatique</button></td><td>Hépatopathie chronique ; alcoolisme chronique</td><td>Stockage et mobilisation altérés ; plus la maladie est sévère, plus le rétinol baisse</td></tr><tr><td>Iatrogène</td><td>Octréotide associé à une résection du grêle</td><td>Aggrave la malabsorption</td></tr><tr><td>Besoins ou pertes accrus</td><td>Infections (rougeole), maladie critique prolongée, inflammation</td><td>Augmentation des besoins et des pertes urinaires, baisse de la RBP</td></tr><tr><td>Nutrition parentérale prolongée</td><td>Absence d’apport oral</td><td>Photodégradation et adsorption sur les poches</td></tr><tr><td>Insuffisance rénale chronique</td><td>Rétinol souvent élevé</td><td>Carence possible seulement si les réserves s’épuisent</td></tr></table><p>Le tableau permet d’éviter une erreur de lecture : les facteurs ne s’additionnent pas toujours dans le même sens. L’insuffisance rénale chronique élève le rétinol sérique, de sorte qu’une valeur « normale » y est moins rassurante, et l’alcoolisme masque la carence par un rétinol conservé. Chez un patient bariatrique atteint d’hépatopathie, plusieurs maillons cèdent en même temps, ce qui abrège le délai avant les signes oculaires.</p><div class="trap"><span class="k">Erreur fréquente</span> Attribuer l’absence de carence à l’absence de symptômes digestifs. La malabsorption des graisses peut rester subclinique ; la série suisse ne compte que des patients parvenus au stade de la rétinopathie, avec un délai médian de 14 mois avant le diagnostic.</div><div class="key"><b>À retenir.</b> Tout facteur de risque se rattache à l’un des quatre maillons : apport, absorption, stockage-transport, besoins. Chez l’adulte suisse, l’absorption des graisses est le maillon le plus souvent en cause.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37921090/" target="_blank" rel="noopener">série suisse 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42785498/" target="_blank" rel="noopener">méta-analyse 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42176959/" target="_blank" rel="noopener">revue pédiatrique 2026</a>.</p></section>
<section class="ilot" id="e50-5"><h2><span class="n">5</span>Interroger</h2><p>L’interrogatoire cherche d’abord le symptôme qui précède la lésion, puis le terrain qui l’explique. Le tableau classe les symptômes par ordre d’apparition habituel.</p><table class="t"><tr><th>Symptôme</th><th>Comment le chercher</th><th>Signification</th></tr><tr><td><button class="w" data-k="e50-nyctalopie">Cécité nocturne</button></td><td>Poser des questions ciblées : vision différente le jour, la nuit, des autres personnes ? Chez l’enfant : activité réduite au crépuscule, difficulté à trouver nourriture ou jouets</td><td>Dysfonction des bâtonnets ; premier signe, parfois après un éblouissement</td></tr><tr><td>Sécheresse oculaire, sensation de corps étranger</td><td>Œil qui pique, paraît terne</td><td>Xérose conjonctivale ou cornéenne</td></tr><tr><td>Baisse visuelle progressive</td><td>Évolution sur des mois</td><td>Atteinte rétinienne ou cornéenne</td></tr><tr><td>Infections répétées</td><td>Infections respiratoires et digestives ; rougeole récente chez l’enfant</td><td>Altération des barrières muqueuses</td></tr></table><p>Les antécédents se recherchent ensuite avec insistance. L’interrogatoire demande une <b>chirurgie bariatrique même lointaine</b>, puisque les signes peuvent apparaître des décennies après la dérivation ; une résection intestinale, une mucoviscidose, une hépatopathie, un alcoolisme, un régime restrictif, un trouble du spectre autistique, une grossesse en cours ou récente. Il s’enquiert de la prise de suppléments et de médicaments, notamment d’octréotide, car la dose reçue conditionne le risque de surdosage au moment du traitement.</p><div class="trap"><span class="k">Piège</span> La cécité nocturne n’est pas une plainte spontanée. Un adulte qui évite de sortir à la tombée de la nuit ou un enfant devenu peu actif au crépuscule n’identifie pas toujours son trouble. La question doit être posée activement.</div><p>Deux formes se distinguent. La forme typique de l’enfant des pays pauvres associe cécité nocturne, infections répétées et dénutrition, avec une rougeole récente. La forme de l’adulte suisse est atypique : elle est discrète, sans dénutrition apparente, avec une plainte visuelle isolée chez un opéré ou un malade chronique.</p><div class="two"><div class="card"><h4>Forme typique (enfant, pays à ressources limitées)</h4><p>Dénutrition, rougeole ou diarrhée récente, cécité nocturne avec un pic entre trois et six ans. Le risque est la lésion cornéenne rapide.</p></div><div class="card"><h4>Forme atypique (adulte suisse)</h4><p>Opéré bariatrique, malade du foie ou du grêle, sans signe digestif ; plainte visuelle nocturne ou œil sec persistant. Le risque est le retard diagnostique.</p></div></div><div class="key"><b>À retenir.</b> Deux questions et un antécédent suffisent à ouvrir le dosage : voyez-vous moins bien la nuit ? l’œil est-il sec ou terne ? y a-t-il eu une chirurgie bariatrique, une résection ou une maladie du foie ?</div><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/eb2cbceb-6e5c-4eaf-b31a-36faa8dea00f/content" target="_blank" rel="noopener">OMS 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37921090/" target="_blank" rel="noopener">série suisse 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42785498/" target="_blank" rel="noopener">méta-analyse 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40970261/" target="_blank" rel="noopener">perte de poids rapide, 2025</a>.</p></section>
<section class="ilot" id="e50-6"><h2><span class="n">6</span>Examiner</h2><p>L’examen suit l’ordre habituel : état général, signes vitaux, anthropométrie, puis signes ciblés. Il mesure d’abord la tolérance générale et l’état nutritionnel, car la carence en vitamine A s’associe volontiers à d’autres carences, puis il se concentre sur l’œil, où se trouvent presque tous les signes spécifiques.</p><div class="two"><div class="card"><h4>Examen général</h4><p>L’état général, le poids et l’indice de masse corporelle (IMC) orientent vers la dénutrition ou la malabsorption. La peau peut montrer une <button class="w" data-k="e50-kerato">kératinisation excessive</button> ; l’information professionnelle suisse de la pommade cite la vitamine A comme agent qui combat la kératinisation de la peau. Chez l’enfant, les signes d’infection respiratoire ou digestive et la dénutrition sont recherchés.</p></div><div class="card"><h4>Examen de l’œil à la lampe à fente</h4><p>Xérose conjonctivale (conjonctive sèche et terne), <button class="w" data-k="e50-bitot">taches de Bitot</button> (dépôts blanchâtres mousseux de la conjonctive bulbaire), xérose cornéenne (cornée trouble), ulcération ou kératomalacie, cicatrices.</p></div></div><p>Le <button class="w" data-k="e50-xerophtalmie-oms">stade OMS</button> se détermine à partir de ces observations, ce qui permet de choisir la conduite : une cécité nocturne isolée (XN) ou une tache de Bitot (X1B) autorise un traitement oral programmé, alors qu’une atteinte cornéenne (X2, X3A, X3B) déclenche un traitement immédiat et un transfert en urgence.</p><p>L’examen du fond d’œil et l’imagerie sont ophtalmologiques. Le fond d’œil peut montrer le tableau de la xérophtalmie rétinienne (XF). À l’<button class="w" data-k="e50-oct">tomographie en cohérence optique (OCT) et à l’électrorétinogramme</button>, les cas suisses décrivent une zone d’interdigitation réduite, des dépôts drusénoïdes sous-rétiniens et une couche nucléaire externe amincie, avec des réponses des bâtonnets abolies ; ces anomalies correspondent à l’atteinte de la rétine externe, siège des bâtonnets.</p><p>Chez l’enfant, des papilles œdémateuses ou une neuropathie optique ont été rapportées dans les revues de pays à haut revenu, et, dans la mucoviscidose, une hypertension intracrânienne bénigne ou une paralysie faciale du nourrisson, de façon exceptionnelle. Ces signes extra-oculaires sont rares ; ils ne doivent pas détourner l’attention de l’œil.</p><div class="trap"><span class="k">Erreur fréquente</span> Conclure à une conjonctivite, à une sécheresse banale ou à un trouble de la réfraction devant un œil terne et sec chez un opéré bariatrique. Les formes avancées, avec perforation cornéenne par stromalyse stérile ou surinfection, sont décrites en cas de diagnostic tardif.</div><div class="key"><b>À retenir.</b> L’examen cherche cinq signes de surface (xérose, tache de Bitot, cornée trouble, ulcération, cicatrice) et un signe de fond d’œil ; il ne remplace pas le dosage du rétinol et son absence ne l’exclut pas.</div><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/eb2cbceb-6e5c-4eaf-b31a-36faa8dea00f/content" target="_blank" rel="noopener">OMS 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37921090/" target="_blank" rel="noopener">série suisse 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42176959/" target="_blank" rel="noopener">revue pédiatrique 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40903025/" target="_blank" rel="noopener">cas de kératomalacie, 2026</a>.</p><button class="pareto-btn ui" data-k="pareto-e50-clin">▲ Loi de Pareto — Causes, anamnèse et examen</button></section>
