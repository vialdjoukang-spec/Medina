<template data-pop="e50-vitamine-a" data-title="Vitamine A : formes et origines"><h3>Ce que désigne le terme</h3><p>La vitamine A est un groupe de composés qui ont l’activité vitaminique A. Le rétinol en est la forme centrale ; l’organisme le stocke sous forme d’esters de rétinyle, surtout dans le foie. Les caroténoïdes, dont le β-carotène, sont des provitamines : le corps les convertit en vitamine A, mais avec un rendement faible, de 12 µg de β-carotène pour 1 µg d’équivalent d’activité du rétinol.</p><table class="t"><tr><th>Origine</th><th>Forme</th><th>Aliments</th></tr><tr><td>Animale</td><td>Rétinol préformé</td><td>Foie, poisson, fromage, œufs, lait</td></tr><tr><td>Végétale</td><td>Caroténoïdes provitaminiques</td><td>Carotte, courge, poivron, abricot, légumes verts</td></tr></table><p>Cette distinction clinique est utile : un régime végétal strict apporte des provitamines à rendement faible, alors que l’excès de rétinol préformé vient presque toujours de suppléments ou de foie. Pour que les caroténoïdes soient absorbés, un peu de graisse est nécessaire, environ une cuillère à café d’huile par repas (2,4 à 5 g).</p><p class="src">Source : <a href="https://www.dge.de/wissenschaft/referenzwerte/vitamin-a/" target="_blank" rel="noopener">DGE, valeurs D-A-CH</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a>.</p></template>
<template data-pop="e50-xerophtalmie-oms" data-title="Xérophtalmie : classification de l’OMS"><h3>La gradation clinique</h3><p>L’OMS classe les manifestations oculaires en stades. Cette classification (1982, reprise en 2014) sert à décider de la conduite : les stades de surface se traitent par voie orale programmée, les stades cornéens en urgence.</p><table class="t"><tr><th>Stade</th><th>Signe</th><th>Urgence</th></tr><tr><td>XN</td><td>Cécité nocturne</td><td>Non</td></tr><tr><td>X1A</td><td>Xérose conjonctivale</td><td>Non</td></tr><tr><td>X1B</td><td>Taches de Bitot</td><td>Non</td></tr><tr><td>X2</td><td>Xérose cornéenne</td><td>Oui</td></tr><tr><td>X3A</td><td>Ulcération ou kératomalacie, moins d’un tiers de la cornée</td><td>Oui</td></tr><tr><td>X3B</td><td>Ulcération ou kératomalacie, un tiers ou plus</td><td>Oui</td></tr><tr><td>XS</td><td>Cicatrice cornéenne</td><td>Séquelle, sans carence active</td></tr><tr><td>XF</td><td>Fond d’œil xérophtalmique</td><td>Ophtalmologique</td></tr></table><p>La limite à ne pas franchir est X2 : la préservation complète de la vision est généralement possible jusque-là. Les prévalences minimales pour reconnaître un problème de santé publique sont de plus de 1 % pour la cécité nocturne (XN), plus de 0,5 % pour les taches de Bitot (X1B), plus de 0,01 % pour X2 et X3 et plus de 0,05 % pour les cicatrices (XS).</p><p class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/eb2cbceb-6e5c-4eaf-b31a-36faa8dea00f/content" target="_blank" rel="noopener">OMS 2014</a>.</p></template>
<template data-pop="e50-retinol-serique" data-title="Rétinol sérique : valeur, seuils et pièges"><h3>Ce que mesure le rétinol sérique</h3><p>Le rétinol sérique est la concentration du rétinol circulant, lié à la RBP. Les seuils sont populationnels : ≤ 0,70 µmol/L définit la carence, &lt; 0,35 µmol/L la carence sévère. Il reste stable tant que les réserves hépatiques ne sont ni épuisées ni très élevées ; il ne renseigne donc pas sur le statut individuel entre ces extrêmes.</p><h3>Pièges</h3><ul><li>L’inflammation abaisse la RBP et le rétinol (protéine négative de la phase aiguë) : lire avec la CRP.</li><li>La dénutrition protéique et la carence en zinc l’abaissent.</li><li>L’alcoolisme chronique peut laisser un rétinol normal malgré des réserves épuisées.</li><li>L’insuffisance rénale chronique l’élève.</li><li>L’obésité modifie le rapport rétinol sur RBP.</li><li>Le prélèvement exige la protection de la lumière, des antioxydants et une température contrôlée.</li></ul><p>Conversion ESPEN : 1 µg/dL = 0,0357 µmol/L ; 1 µmol/L ≈ 28 µg/dL. L’ESPEN recommande le dosage (grade A) et propose d’y adjoindre les esters de rétinyle dans le bilan de malabsorption (grade B).</p><p class="src">Source : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/9f05777e-c420-48e6-a1c2-cdd47e74c3b7/content" target="_blank" rel="noopener">OMS 2011</a>.</p></template>
<template data-pop="e50-rbp" data-title="Protéine de liaison du rétinol"><h3>Rôle et comportement</h3><p>La protéine de liaison du rétinol (RBP) transporte le rétinol du foie vers les tissus, liée 1:1 au rétinol puis à la transthyrétine. C’est une protéine négative de la phase aiguë : l’inflammation la fait baisser, et le rétinol sérique avec elle. Elle diminue aussi dans la carence en zinc, la dénutrition et l’hépatopathie avancée, ce qui réduit la mobilisation des réserves.</p><p>Conséquence pratique : un rétinol bas avec RBP basse peut refléter un défaut de transport autant qu’un défaut de stock. La CRP et la RBP améliorent donc l’interprétation.</p><p class="src">Source : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a>.</p></template>
<template data-pop="e50-inflammation" data-title="Inflammation et rétinol"><h3>Pourquoi l’inflammation fausse le dosage</h3><p>L’inflammation fait baisser la RBP, réduit l’absorption, augmente les besoins et les pertes urinaires. Le rétinol sérique baisse donc sans que les réserves le soient forcément. Pour corriger, l’ESPEN décrit un ajustement par la CRP, l’AGP ou les deux, selon une méthode de régression. En pratique, on évite de doser pendant une infection aiguë et on recontrôle après la phase aiguë.</p><p class="src">Source : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a> ; ESPEN-ECFS 2016.</p></template>
<template data-pop="e50-rhodopsine" data-title="Rhodopsine et vision nocturne"><h3>Mécanisme</h3><p>Le rétinal, dérivé du rétinol, se combine à l’opsine pour former la rhodopsine, pigment des bâtonnets. Les bâtonnets détectent la lumière faible. Si le rétinol manque, la rhodopsine diminue et les bâtonnets ne répondent plus : la vision en faible lumière s’altère (cécité nocturne). Le trouble peut être révélé d’abord par l’éblouissement.</p><p>Le trouble est réversible : la cécité nocturne répond au traitement en un à deux jours. Chez l’enfant, il apparaît comme une activité réduite au crépuscule.</p><p class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/eb2cbceb-6e5c-4eaf-b31a-36faa8dea00f/content" target="_blank" rel="noopener">OMS 2014</a>.</p></template>
<template data-pop="e50-acide-retinoique" data-title="Acide rétinoïque et récepteurs"><h3>Fonction nucléaire</h3><p>L’acide rétinoïque, sous les formes tout-trans et 9-cis, est un ligand des récepteurs nucléaires RAR et RXR. Ces récepteurs règlent plus de 500 gènes, notamment la différenciation des muqueuses et l’immunité. Ils forment des hétérodimères, y compris avec le récepteur de la vitamine D.</p><p>Le déficit d’acide rétinoïque explique donc les signes de surface (kératinisation) et la susceptibilité aux infections, indépendamment de la cécité nocturne.</p><p class="src">Source : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a>.</p></template>
<template data-pop="e50-kerato" data-title="Kératinisation et kératomalacie"><h3>De la kératinisation à la liquéfaction</h3><p>Sans acide rétinoïque, les épithéliums perdent leur différenciation et se kératinisent. À la conjonctive, cela donne xérose et taches de Bitot ; à la cornée, xérose cornéenne puis ulcération. La kératomalacie est la liquéfaction partielle ou totale de la cornée. Elle laisse une cicatrice (XS) et peut se compliquer de perforation par stromalyse stérile ou surinfection chez les patients diagnostiqués tardivement.</p><p class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/eb2cbceb-6e5c-4eaf-b31a-36faa8dea00f/content" target="_blank" rel="noopener">OMS 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42176959/" target="_blank" rel="noopener">revue pédiatrique 2026</a>.</p></template>
<template data-pop="e50-bitot" data-title="Taches de Bitot"><h3>Description</h3><p>Les taches de Bitot sont des dépôts blanchâtres « mousseux » de cellules kératinisées sur la conjonctive bulbaire (stade X1B de l’OMS, code E50.1). Elles traduisent une kératinisation conjonctivale. Elles indiquent une carence assez marquée mais encore sans atteinte cornéenne : chez la femme en âge de procréer, elles ouvrent la voie à la dose réduite de 5 000 à 10 000 UI par jour.</p><p class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/eb2cbceb-6e5c-4eaf-b31a-36faa8dea00f/content" target="_blank" rel="noopener">OMS 2014</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/a6075249-0131-4052-84a4-c33b5961ab43/content" target="_blank" rel="noopener">OMS 1997</a>.</p></template>
<template data-pop="e50-nyctalopie" data-title="Cécité nocturne : héméralopie ou nyctalopie ?"><h3>Terminologie</h3><p>La CIM-10-GM emploie « héméralopie » pour la cécité nocturne ; la littérature anglo-saxonne parle de « night blindness » et, en français, certains textes de « nyctalopie ». Le stade OMS correspondant est XN (code E50.5). Le questionnaire de l’OMS demande si le patient voit différemment le jour, la nuit, ou autrement que les autres personnes.</p><p>La cécité nocturne est souvent le premier signe. Chez l’enfant, son pic est entre trois et six ans.</p><p class="src">Source : CIM-10-GM 2024 ; <a href="https://iris.who.int/server/api/core/bitstreams/eb2cbceb-6e5c-4eaf-b31a-36faa8dea00f/content" target="_blank" rel="noopener">OMS 2014</a>.</p></template>
<template data-pop="e50-rae" data-title="Équivalents d’activité du rétinol"><h3>Unités</h3><p>1 µg d’équivalent d’activité du rétinol (RAE) = 1 µg de rétinol = 12 µg de β-carotène = 24 µg d’autres caroténoïdes provitaminiques ; 3,33 UI correspondent à 1 µg. L’ancien équivalent rétinol (RE) comptait 6 µg de β-carotène, ce qui surestimait l’activité des végétaux. Lire une posologie exige de reconnaître l’unité.</p><p class="src">Source : <a href="https://www.dge.de/wissenschaft/referenzwerte/vitamin-a/" target="_blank" rel="noopener">DGE</a> ; ESPEN 2022.</p></template>
<template data-pop="e50-apports" data-title="Apports recommandés D-A-CH"><h3>Valeurs</h3><p>Les valeurs D-A-CH 2020 (Allemagne, Autriche, Suisse) recommandent 700 µg RAE par jour pour la femme et 850 pour l’homme (800 dès 65 ans), 800 pendant la grossesse et 1 300 pendant l’allaitement ; chez l’enfant de 300 µg (1 à 4 ans) à 950 (garçons de 15 à 19 ans). L’ESPEN cite 700 et 900. Depuis 2022, la Suisse ne participe plus à D-A-CH ; la valeur 2020 reste la dernière à l’inclure. En grossesse, la consommation régulière et excessive d’aliments très riches en vitamine A (foie) est à éviter, surtout au premier trimestre.</p><p class="src">Source : <a href="https://www.dge.de/wissenschaft/referenzwerte/vitamin-a/" target="_blank" rel="noopener">DGE, valeurs D-A-CH</a>.</p></template>
<template data-pop="e50-reserves" data-title="Réserves hépatiques"><h3>Capacité de stockage</h3><p>Plus de 90 % de la vitamine A corporelle est stockée dans le foie, sous forme d’esters de rétinyle. Ces réserves couvrent environ six mois d’apport insuffisant, ce qui explique le délai entre le début de la malabsorption et les signes. Chez l’alcoolique chronique, elles peuvent être épuisées malgré un rétinol sérique normal.</p><p class="src">Source : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a>.</p></template>
<template data-pop="e50-malabsorption" data-title="Malabsorption des graisses"><h3>Pourquoi la vitamine A est touchée</h3><p>Les micronutriments liposolubles sont absorbés avec les lipides dans la moitié supérieure de l’intestin grêle. Toute malabsorption des graisses (résection, grêle court, mucoviscidose, maladie cœliaque, diarrhée chronique) réduit donc l’absorption de la vitamine A. L’ESPEN envisage une prévention orale dans toute malabsorption des graisses (recommandation 22.5).</p><p class="src">Source : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a>.</p></template>
<template data-pop="e50-bariatrique" data-title="Chirurgie bariatrique et vitamine A"><h3>Risque selon l’opération</h3><p>La carence biologique atteint 18 % après bypass gastrique Roux en Y (RYGB), 59 % après dérivation biliopancréatique (BPD) et 37,8 % après BPD avec switch duodénal (BPD-DS). Le délai médian d’apparition oculaire est de 5 ans après RYGB et de 14 à 27 ans après BPD-DS. Chez 60 % des cohortes symptomatiques, une cécité nocturne est observée ; 93 % des atteintes oculaires s’améliorent après réplétion. Les directives suisses (SMOB 2023) prescrivent des polyvitamines à long terme après anneau, sleeve et RYGB proximal, à vie après chirurgie malabsorptive.</p><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/42785498/" target="_blank" rel="noopener">méta-analyse 2026</a> ; <a href="https://www.smob.ch/wp-content/uploads/2026/04/SMOB-Directives-2023-07-01-Fr.pdf" target="_blank" rel="noopener">SMOB 2023</a>.</p></template>
<template data-pop="e50-mucoviscidose" data-title="Mucoviscidose et vitamine A"><h3>Spécificités</h3><p>10 à 40 % des patients sont carencés, indépendamment de l’âge, du génotype ou de la fonction pancréatique. L’objectif est la normale du laboratoire, en commençant bas et en adaptant au dosage. Le β-carotène est possiblement plus sûr (rétrocontrôle) : 1 mg/kg par jour pendant 12 semaines, puis au plus 10 mg par jour (6 à 18 ans). Les formes hydrosolubles sont plus toxiques que les formes huileuses. L’excès provoque fibrose hépatique, baisse de la densité osseuse et fractures. Le contrôle est annuel une fois la valeur normalisée. La version 2024 de la directive n’a été lue qu’en résumé.</p><p class="src">Source : <a href="https://www.espen.org/files/ESPEN-Guidelines/2__ESPEN-ESPGHAN-ECFS_guidelines_on_nutrition_care_for_infants_children_and_adults_with_cystic_fibrosis.pdf" target="_blank" rel="noopener">ESPEN-ESPGHAN-ECFS 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38169175/" target="_blank" rel="noopener">résumé 2024</a>.</p></template>
<template data-pop="e50-hepatique" data-title="Hépatopathie et vitamine A"><h3>Spécificités</h3><p>Le foie stocke et mobilise la vitamine A : plus la maladie est sévère, plus le rétinol baisse. Chez les candidats à une transplantation hépatique, 69,8 % ont un rétinol bas. L’ESPEN recommande d’administrer les vitamines A, D et K avec thiamine, folate et pyridoxine, et note que le zinc avec la vitamine A peut améliorer la dysgueusie.</p><p class="src">Source : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_clinical_nutrition_in_liver_disease.pdf" target="_blank" rel="noopener">ESPEN foie 2019</a> ; ESPEN 2022.</p></template>
<template data-pop="e50-rougeole" data-title="Rougeole et cécité de l’enfant"><h3>Synergie</h3><p>La rougeole augmente les besoins et aggrave la carence ; la cécité rougeoleuse touche 15 000 à 60 000 enfants par an et est la première cause de cécité infantile dans les pays à faible revenu. L’OMS prévoit un traitement à haute dose de vitamine A dans la rougeole.</p><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/14998696/" target="_blank" rel="noopener">Semba et Bloem 2004</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/a6075249-0131-4052-84a4-c33b5961ab43/content" target="_blank" rel="noopener">OMS 1997</a>.</p></template>
<template data-pop="e50-pays-riches" data-title="Pays à haut revenu : enfants"><h3>Revue systématique de 61 cas</h3><p>75 % des enfants avaient un régime restrictif ; le trouble du spectre autistique est le terrain le plus fréquent (49 %) ; 29,5 % avaient une atteinte cornéenne au diagnostic, ce qui souligne le retard diagnostique. Des papilles œdémateuses ou une neuropathie optique ont été notées.</p><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/42176959/" target="_blank" rel="noopener">revue 2026</a>.</p></template>
<template data-pop="e50-suisse-serie" data-title="Série suisse de rétinopathies, 2012–2022"><h3>Cinq patients</h3><p>Trois patients avaient une chirurgie bariatrique, un une résection du grêle avec octréotide, un une mucoviscidose avec résection et hépatopathie. Le délai médian entre les symptômes et le diagnostic est de 14 mois. L’OCT montrait une atteinte de la rétine externe et l’électrorétinogramme des réponses abolies. Toute cécité nocturne impose un dosage du rétinol.</p><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/37921090/" target="_blank" rel="noopener">Gunzinger et al., 2023</a>.</p></template>
<template data-pop="e50-oct" data-title="OCT, autofluorescence et électrorétinogramme"><h3>Ce que montrent ces examens</h3><p>La tomographie en cohérence optique (OCT) coupe la rétine : dans la série suisse, elle montre une zone d’interdigitation réduite, des dépôts drusénoïdes sous-rétiniens et une couche nucléaire externe amincie. L’électrorétinogramme enregistre la réponse électrique de la rétine : il passe de potentiels oscillatoires anormaux à des réponses des bâtonnets abolies. L’autofluorescence complète le bilan ophtalmologique. Ces examens objectivent l’atteinte rétinienne ; ils ne remplacent pas le dosage du rétinol.</p><p class="src">Source : <a href="https://pubmed.ncbi.nlm.nih.gov/37921090/" target="_blank" rel="noopener">série suisse 2023</a>.</p></template>
<template data-pop="e50-sources-guides" data-title="Sources et abréviations des référentiels"><h3>Textes cités</h3><p>OMS : xérophtalmie (1982, reprise 2014), rétinol sérique (2011), supplémentation (1997). ESPEN : directive sur les micronutriments 2022 (Berger et al., Lausanne), mucoviscidose 2016, hépatopathies 2019. D-A-CH : apports de référence. SMOB : directives suisses sur la chirurgie de l’obésité (version 2023). La limite supérieure de l’Institute of Medicine américain ne sert pas de fondement, et celle de l’Autorité européenne de sécurité des aliments n’a pas pu être lue.</p><p class="src">Source : dossier de recherche du cycle Betta 39.</p></template>
