<section class="ilot" id="c18-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 68 ans consulte pour une fatigue ; or, sa formule sanguine montre une anémie ferriprive, et il signale depuis deux mois une modification du transit et une perte de poids de 4 kg. <b>La question est donc de savoir s’il a un <button class="w" data-k="c18-ccr">cancer du côlon</button>, comment le confirmer, en préciser l’extension et décider du traitement.</b></p><p>Pour y répondre, le médecin doit savoir : reconnaître les signes d’appel ; exiger une <button class="w" data-k="c18-colo">coloscopie totale</button> avec biopsies ; demander un <button class="w" data-k="c18-tdm">scanner thoraco-abdomino-pelvien</button> et le dosage de l’<button class="w" data-k="c18-ace">antigène carcinoembryonnaire</button> ; lire la classification <button class="w" data-k="c18-tnm">TNM</button> ; ensuite, indiquer une chimiothérapie adjuvante selon le stade et le statut <button class="w" data-k="c18-mmr">MMR/MSI</button> ; enfin, organiser la surveillance.</p><div class="key"><b>Point de départ.</b> Une anémie ferriprive, des troubles du transit et un amaigrissement après 50 ans imposent une coloscopie totale, puis un bilan d’extension.</div></section>
<section class="ilot" id="c18-1"><h2><span class="n">1</span>Définition et épidémiologie</h2><p>Le <button class="w" data-k="c18-ccr">cancer du côlon</button> est une tumeur maligne née de la muqueuse colique ; en effet, il croît à la fois vers la lumière et dans la paroi, puis peut s’étendre aux organes voisins (ESMO 2020). Le plus souvent, il s’agit d’un adénocarcinome. Par ailleurs, l’OFS le regroupe avec la jonction rectosigmoïdienne et le rectum sous le terme de cancer colorectal.</p><p>En Suisse, ce cancer colorectal est fréquent. Ainsi, de 2018 à 2022, on a compté en moyenne 2 528 nouveaux cas par an chez l’homme et 2 035 chez la femme, soit 41,4 et 28,9 pour 100 000 ; de plus, il a causé 894 et 712 décès par an (OFS/ONEC). À l’échelle mondiale, il cause plus de 600 000 décès par an et constitue la quatrième cause de décès par cancer (ESMO 2020).</p><div class="key"><b>À retenir.</b> En Suisse, de 2018 à 2022, le cancer colorectal a causé environ 4 560 nouveaux cas et 1 600 décès par an ; le côlon en représente la majeure partie, avec le sigmoïde et le rectum.</div><p class="src">Références : <a href="https://krebs-monitoring.bfs.admin.ch/fr/detail/C18-20/" target="_blank" rel="noopener">Office fédéral de la statistique et Organe national d’enregistrement du cancer, Monitorage du cancer en Suisse, cancer colorectal, moyennes annuelles 2018-2022 (publié le 10.11.2025)</a> ; <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></section>
<section class="ilot" id="c18-2"><h2><span class="n">2</span>Facteurs de risque et formes héréditaires</h2><p>Après la fréquence, il faut repérer les personnes à risque. Ainsi, l’ESMO relie la hausse de l’incidence à l’« occidentalisation » du mode de vie : obésité, sédentarité, alcool, consommation élevée de viande rouge et tabac ; en outre, un déséquilibre du microbiote intestinal pourrait jouer un rôle.</p><p>Par ailleurs, le risque augmente avec les antécédents personnels ou familiaux de cancer colorectal ou d’adénome. Enfin, 2 à 5 % des cancers colorectaux relèvent d’un syndrome héréditaire : la <button class="w" data-k="c18-paf">polypose adénomateuse familiale</button> et ses variantes (1 %), le <button class="w" data-k="c18-lynch">syndrome de Lynch</button> (2 à 4 %), ainsi que les syndromes de Turcot, de Peutz-Jeghers et la polypose associée à MUTYH (ESMO 2020). C’est pourquoi l’histoire familiale fait partie de tout bilan.</p><div class="key"><b>À retenir.</b> Le mode de vie occidental (obésité, sédentarité, alcool, viande rouge, tabac) et les antécédents personnels ou familiaux augmentent le risque. De plus, 2-5 % des cancers sont héréditaires, dont 2-4 % de syndromes de Lynch et 1 % de PAF.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></section>
<section class="ilot" id="c18-3"><h2><span class="n">3</span>Dépistage</h2><p>Puisque le cancer naît le plus souvent d’une lésion précancéreuse, le dépistage permet de l’empêcher ou de le trouver tôt. Ainsi, l’ESMO recommande la <button class="w" data-k="c18-colo">coloscopie totale</button> chez l’homme et la femme à risque moyen, entre 50 et 74 ans, avec un intervalle de 10 ans après un examen négatif ; de plus, le <button class="w" data-k="c18-fit">test immunochimique fécal</button> paraît supérieur au test au gaïac pour détecter adénomes et cancers. En revanche, la capsule colique n’est pas recommandée pour le dépistage.</p><p>En Suisse, l’assurance obligatoire prend en charge ce dépistage de 50 à 74 ans, selon l’<button class="w" data-k="c18-opas">article 12e de l’OPAS</button> : soit une recherche de sang occulte dans les selles tous les deux ans, suivie d’une coloscopie si elle est positive, soit une coloscopie tous les dix ans. Par ailleurs, dans les programmes cantonaux énumérés par l’ordonnance, aucune franchise n’est prélevée. Enfin, un test positif impose une coloscopie au plus vite (ESMO 2020).</p><div class="trap"><span class="k">Piège</span>Un test de sang occulte positif n’est jamais « contrôlé » par un second test : il impose une coloscopie, au plus vite.</div><div class="key"><b>À retenir.</b> À risque moyen, de 50 à 74 ans, on recherche le sang occulte (FIT) tous les 2 ans ou l’on fait une coloscopie tous les 10 ans (OPAS, assurance de base) ; un test positif conduit à une coloscopie.</div><p class="src">Références : <a href="https://www.fedlex.admin.ch/eli/cc/1995/4964_4964_4964/fr" target="_blank" rel="noopener">Ordonnance du DFI sur les prestations de l’assurance des soins (OPAS, RS 832.112.31), art. 12e, let. d, version en vigueur depuis le 1er juillet 2026</a> ; <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></section>
<section class="ilot" id="c18-4"><h2><span class="n">4</span>Présentation clinique</h2><p>Lorsque le cancer donne des symptômes, la tumeur est en général volumineuse ou avancée ; de plus, ces symptômes ne sont pas spécifiques. Ainsi, les plus fréquents sont une modification du transit, des douleurs abdominales générales ou localisées, une perte de poids sans autre cause, une faiblesse, une carence martiale et une anémie ; en outre, ils dépendent de la localisation et du stade (ESMO 2020).</p><p>Par ailleurs, certains cancers se révèlent par une complication : occlusion, perforation, fistule, abcès ou hémorragie massive, qui peuvent imposer une résection urgente. Enfin, le cancer peut être multiple : des lésions synchrones sont présentes dans 3,6 % des cas, et des cancers métachrones apparaissent chez jusqu’à 3 % des patients dans les 5 ans suivant la chirurgie (ESMO 2020). C’est pourquoi le côlon entier doit être exploré, avant puis après l’opération.</p><div class="quiz ui"><p>Un homme de 70 ans a une anémie ferriprive isolée, sans symptôme digestif. Quelle attitude ?</p><button data-ok="0">Supplémenter en fer et contrôler dans trois mois</button><button data-ok="1">Explorer le tube digestif, dont le côlon par coloscopie</button><button data-ok="0">Doser l’ACE pour exclure un cancer</button><p class="fb" hidden>La carence martiale et l’anémie font partie des signes d’appel les plus fréquents ; or, l’<button class="w" data-k="c18-ace">ACE</button> n’a pas de valeur diagnostique en l’absence de biopsie (ESMO 2020).</p></div><div class="key"><b>À retenir.</b> Le patient présente un transit modifié, des douleurs, un amaigrissement, une faiblesse, une carence martiale ou une anémie, car la tumeur saigne à bas bruit. Les complications sont l’occlusion, la perforation et l’hémorragie, et 3,6 % des cancers sont synchrones.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></section>
<section class="ilot" id="c18-5"><h2><span class="n">5</span>Diagnostic et bilan d’extension</h2><p>Devant ce tableau, l’examen de référence est la <button class="w" data-k="c18-colo">coloscopie totale</button>, qui confirme le diagnostic par biopsie et cherche des lésions synchrones [I, A] ; en effet, elle permet aussi de repérer et de marquer la tumeur et d’enlever d’autres lésions précancéreuses. Si elle n’est pas réalisable, une coloscopie gauche limitée combinée à une coloscopie virtuelle par <button class="w" data-k="c18-tdm">scanner</button> est une alternative [I, A] ; dans ce cas, une coloscopie complète doit être faite dans les 3 à 6 mois suivant l’opération [IV, B].</p><p>Ensuite, le bilan d’extension recherche des métastases, présentes d’emblée chez environ 20 % des patients : surtout le foie (17 %), puis le péritoine (5 %), le poumon (5 %) et les ganglions (3 %). Ainsi, le scanner thoracique, abdominal et pelvien avec injection est la méthode préférée [II, B] ; cependant, il détecte mal les métastases péritonéales. Par ailleurs, l’IRM précise les rapports d’une tumeur localement avancée, et l’<button class="w" data-k="c18-ace">ACE</button> est dosé avant la chirurgie [III, A] : en effet, un taux postopératoire supérieur à 5 ng/ml annonce un pronostic plus défavorable (ESMO 2020).</p><figure><img src="data:image/gif;base64,R0lGODdh2QHIAYYAAPTr1Oe/lfqeXeOeYvmRY/iRTu+RTNiQU/aHWe6FWfKFSfCFNuOFWeOEM9OERrqEWfB6T+l5Tu19Ou12Od55TN55NMp5Wsp3Tc13Nbt4Tqt2UehuPtluPcluP+BmO8lmO9RZOLZuTbZnS7lpPbRgRbhfN7RWO6ZrTaZhS6ZjP6RYRKJQQqVTOZZbRpVPQItTQ3VUSbtBNp9GOpRJPZRBOotIQItHOIo/OX5GQH5FOH4/OHs5NXgxMmpDPWo5NVw7N0g7NWwuL14uLkUuK2ImKVIkJj8jI0YXHDYVGSsmJCUfHyEaHCoUFx0UGhUTGSULFhgKGRIKGAoKGgkGGgkIEiQCGxsCGxYCHRYCFRACGxACFAsDGwoDFwQDGgkCEQICDwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA2QHIAUAI/wCbQLmSBQuUg1CwaNESpSEWLFWqWIlipcpBiVKkOIEiBYrDhwezNBzZkAtDhB61cMkYRctDKzBhIrQCZSHJkVS8RHEiUAsUJUm <section class="ilot" id="c18-6"><h2><span class="n">6</span>Classification TNM et stades</h2><p>Le pronostic et le traitement dépendent donc du stade, établi selon la classification <button class="w" data-k="c18-tnm">TNM</button> de l’UICC, 8e édition, que l’ESMO impose au compte rendu pathologique. Ainsi, la catégorie T décrit la profondeur d’invasion de la paroi, la catégorie N le nombre de ganglions régionaux envahis, et la catégorie M les métastases à distance.</p><p>De plus, ces catégories se regroupent en stades. En effet, le stade I correspond à T1 ou T2 sans ganglion ; le stade II à T3 ou T4 sans ganglion (IIA T3, IIB T4a, IIC T4b) ; le stade III à toute atteinte ganglionnaire, ou à des <button class="w" data-k="c18-depots">dépôts tumoraux</button> (N1c), sans métastase ; enfin, le stade IV à toute métastase (IVA M1a, IVB M1b, IVC M1c).</p><table class="t"><tr><th>Catégorie</th><th>Définition (UICC, 8e édition)</th></tr><tr><td>Tis</td><td>Carcinome intramuqueux : invasion du chorion, sans franchissement de la musculaire muqueuse</td></tr><tr><td>T1 / T2</td><td>Invasion de la sous-muqueuse / de la musculeuse</td></tr><tr><td>T3</td><td>Invasion de la sous-séreuse ou des tissus péricoliques non péritonisés</td></tr><tr><td>T4a / T4b</td><td>Perforation du péritoine viscéral / envahissement direct d’autres organes ou structures</td></tr><tr><td>N1 (a, b, c)</td><td>1 à 3 ganglions régionaux (1 ; 2-3) ; N1c : dépôts tumoraux sans ganglion envahi</td></tr><tr><td>N2 (a, b)</td><td>4 ganglions ou plus (4-6 ; 7 ou plus)</td></tr><tr><td>M1a / M1b / M1c</td><td>Un seul organe sans péritoine / plus d’un organe / péritoine, avec ou sans organe</td></tr></table><p>Le tableau se lit de haut en bas, de la paroi vers la distance : ainsi, chaque ligne franchie aggrave le pronostic et change la décision thérapeutique.</p><div class="key"><b>À retenir.</b> Le stade I correspond à T1-2 N0, le stade II à T3-4 N0, le stade III à N+ (ou N1c) M0 et le stade IV à M1, dont M1c désigne le péritoine.</div><p class="src">Références : <a href="https://www.annalsofoncology.org/cms/10.1016/j.annonc.2020.06.022/attachment/dd2a0bf3-36ed-44d3-846a-71d5e6786b04/mmc1.pdf" target="_blank" rel="noopener">UICC, TNM Classification of Malignant Tumours, 8e édition — tableau supplémentaire S1 de la recommandation ESMO 2020</a> ; <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></section>
