<template data-pop="pareto-c18-clinique" data-title="Loi de Pareto — Cancer du côlon"><p class="ratio" data-cover="c18-3,c18-5,c18-6,c18-7,c18-9,c18-10"></p><ul><li>Dépistage 50-74 ans : FIT tous les 2 ans ou coloscopie tous les 10 ans.</li><li>Coloscopie totale + scanner TAP + ACE.</li><li>Stade III = ganglion envahi.</li><li>≥ 12 ganglions ; MMR/MSI en stade II et pour le Lynch.</li><li>CAPOX 3-6 mois ou FOLFOX 6 mois, avant 8 semaines.</li><li>Coloscopie à 1 an ; ACE tous les 3-6 mois.</li></ul></template>
<template data-pop="pareto-c18-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="c18-e-1,c18-e-2"></p><ul><li>Coloscopie totale + biopsies.</li><li>Scanner TAP injecté.</li><li>ACE avant chirurgie.</li><li>≥ 12 ganglions et MMR/MSI.</li><li>DPD avant fluoropyrimidine.</li></ul></template>
<template data-pop="pareto-c18-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="c18-p-1,c18-p-2,c18-p-3"></p><ul><li>DPD avant fluoropyrimidine.</li><li>CAPOX : oxaliplatine 130 mg/m² + capécitabine 1 000 mg/m² 2 ×/j J1-J14.</li><li>FOLFOX : oxaliplatine 85 mg/m² toutes les 2 semaines.</li><li>Neuropathie : raison de la durée courte.</li></ul></template>
<template data-pop="c18-ccr" data-title="Cancer du côlon"><p class="lab">Définition</p><p>Tumeur maligne de la muqueuse colique, le plus souvent un adénocarcinome, qui croît vers la lumière et dans la paroi.</p><p class="lab">Regroupement OFS</p><p>Cancer colorectal : côlon, jonction rectosigmoïdienne et rectum.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://krebs-monitoring.bfs.admin.ch/fr/detail/C18-20/" target="_blank" rel="noopener">Office fédéral de la statistique et Organe national d’enregistrement du cancer, Monitorage du cancer en Suisse, cancer colorectal, moyennes annuelles 2018-2022 (publié le 10.11.2025)</a>.</p></template>
<template data-pop="c18-colo" data-title="Coloscopie totale"><p class="lab">Rôle</p><p>Confirmation par biopsie, recherche de lésions synchrones, marquage et exérèse de lésions précancéreuses [I, A].</p><p class="lab">Si incomplète</p><p>Coloscopie gauche + coloscopie virtuelle ; coloscopie complète dans les 3-6 mois postopératoires.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-tdm" data-title="Scanner thoraco-abdomino-pelvien"><p class="lab">Place</p><p>Méthode préférée pour les métastases à distance [II, B].</p><p class="lab">Limite</p><p>Sensibilité faible pour les métastases péritonéales.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-ace" data-title="Antigène carcinoembryonnaire (ACE)"><p class="lab">Usage</p><p>Dosage préopératoire et au cours du suivi [III, A] ; pas de valeur diagnostique sans biopsie.</p><p class="lab">Pronostic</p><p>Taux postopératoire > 5 ng/ml : évolution plus défavorable.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-tnm" data-title="Classification TNM (UICC, 8e édition)"><p class="lab">T</p><p>Tis chorion ; T1 sous-muqueuse ; T2 musculeuse ; T3 sous-séreuse ; T4a péritoine viscéral ; T4b autres organes.</p><p class="lab">N</p><p>N1a 1 ; N1b 2-3 ; N1c dépôts ; N2a 4-6 ; N2b ≥ 7 ganglions.</p><p class="lab">M</p><p>M1a un organe ; M1b plusieurs ; M1c péritoine.</p><p class="src">Références : <a href="https://www.annalsofoncology.org/cms/10.1016/j.annonc.2020.06.022/attachment/dd2a0bf3-36ed-44d3-846a-71d5e6786b04/mmc1.pdf" target="_blank" rel="noopener">UICC, TNM Classification of Malignant Tumours, 8e édition — tableau supplémentaire S1 de la recommandation ESMO 2020</a>.</p></template>
<template data-pop="c18-depots" data-title="Dépôts tumoraux (N1c)"><p class="lab">Définition</p><p>Nodules tumoraux de la sous-séreuse ou des tissus péricoliques non péritonisés, sans ganglion régional envahi.</p><p class="lab">Conséquence</p><p>Classent la tumeur en stade III.</p><p class="src">Références : <a href="https://www.annalsofoncology.org/cms/10.1016/j.annonc.2020.06.022/attachment/dd2a0bf3-36ed-44d3-846a-71d5e6786b04/mmc1.pdf" target="_blank" rel="noopener">UICC, TNM Classification of Malignant Tumours, 8e édition — tableau supplémentaire S1 de la recommandation ESMO 2020</a>.</p></template>
<template data-pop="c18-mmr" data-title="Statut MMR/MSI"><p class="lab">Définition</p><p>Déficit de réparation des mésappariements (dMMR), mesuré par immunohistochimie, ou instabilité microsatellitaire (MSI), mesurée par PCR.</p><p class="lab">Usage</p><p>Obligatoire au stade II pour la décision adjuvante ; dépistage du Lynch [IV, A].</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-ihc" data-title="Immunohistochimie MMR"><p class="lab">Perte MSH2 et/ou MSH6</p><p>Suspicion de syndrome de Lynch.</p><p class="lab">Perte MLH1 et PMS2</p><p>Chercher une mutation BRAF ou une hyperméthylation du promoteur de MLH1 : si présente, altération somatique probable.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-lynch" data-title="Syndrome de Lynch"><p class="lab">Définition</p><p>Prédisposition héréditaire liée à un gène de réparation des mésappariements ; anciennement « cancer colorectal héréditaire sans polypose ».</p><p class="lab">Fréquence</p><p>2-4 % des cancers colorectaux.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-paf" data-title="Polypose adénomateuse familiale"><p class="lab">Fréquence</p><p>Environ 1 % des cancers colorectaux, avec ses variantes.</p><p class="lab">Dépistage</p><p>Relève des recommandations ESMO des cancers digestifs héréditaires.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-fit" data-title="Test immunochimique fécal (FIT)"><p class="lab">Principe</p><p>Détection immunologique de l’hémoglobine humaine dans les selles.</p><p class="lab">Performance</p><p>Supérieur au test au gaïac pour le taux de détection et la valeur prédictive positive.</p><p class="lab">Suisse</p><p>Tous les 2 ans de 50 à 74 ans ; coloscopie si positif (OPAS).</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.fedlex.admin.ch/eli/cc/1995/4964_4964_4964/fr" target="_blank" rel="noopener">Ordonnance du DFI sur les prestations de l’assurance des soins (OPAS, RS 832.112.31), art. 12e, let. d, version en vigueur depuis le 1er juillet 2026</a>.</p></template>
<template data-pop="c18-opas" data-title="OPAS, article 12e, lettre d"><p class="lab">Tranche d’âge</p><p>50 à 74 ans (version en vigueur depuis le 1er juillet 2026).</p><p class="lab">Méthodes</p><p>Sang occulte tous les 2 ans, coloscopie si positif ; ou coloscopie tous les 10 ans.</p><p class="lab">Franchise</p><p>Aucune dans les programmes cantonaux énumérés.</p><p class="src">Références : <a href="https://www.fedlex.admin.ch/eli/cc/1995/4964_4964_4964/fr" target="_blank" rel="noopener">Ordonnance du DFI sur les prestations de l’assurance des soins (OPAS, RS 832.112.31), art. 12e, let. d, version en vigueur depuis le 1er juillet 2026</a>.</p></template>
<template data-pop="c18-budding" data-title="Bourgeonnement tumoral"><p class="lab">Définition</p><p>Cellules isolées ou petits amas tumoraux au front d’invasion.</p><p class="lab">Portée</p><p>Grade supérieur à 1 dans un pT1 sur polype : critère de résection chirurgicale [IV, B].</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-stent" data-title="Prothèse colique"><p class="lab">Place</p><p>Pont vers une chirurgie programmée en cas d’occlusion, en centre expert, surtout après 70 ans ou si ASA > II [II].</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-fp" data-title="Fluoropyrimidines"><p class="lab">Molécules</p><p>5-fluorouracile (intraveineux, avec acide folinique) et capécitabine (orale, prodrogue).</p><p class="lab">Précaution</p><p>Test DPD avant le début [III, A].</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeloda®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-idea" data-title="Analyse IDEA"><p class="lab">Effectif</p><p>12 834 patients de stade III, six essais, 3 contre 6 mois.</p><p class="lab">Résultat</p><p>CAPOX 3 mois non inférieur (HR 0,95) ; FOLFOX 3 mois inférieur (HR 1,16) ; neuropathie ≥ grade 2 : 11 % contre 34 %.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-capox" data-title="CAPOX"><p class="lab">Composition</p><p>Capécitabine + oxaliplatine, cycles de 3 semaines.</p><p class="lab">Durée (ESMO)</p><p>3 mois si T1-3 N1, 6 mois si T4 ou N2 (avec prudence).</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeloda®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-folfox" data-title="FOLFOX"><p class="lab">Composition</p><p>Acide folinique, 5-fluorouracile, oxaliplatine, cycles de 2 semaines.</p><p class="lab">Durée</p><p>6 mois (12 cycles) ; 3 mois inférieurs dans IDEA.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Eloxatine®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-lv5fu2" data-title="LV5FU2 (schéma de de Gramont)"><p class="lab">Composition</p><p>Acide folinique et 5-fluorouracile en perfusion.</p><p class="lab">Place</p><p>Adjuvant de 6 mois sans oxaliplatine [I, A].</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-dpd" data-title="Test DPD"><p class="lab">Méthodes</p><p>Génotypage DPYD (DPYD*2A, c.1679T>G, c.2846A>T, c.1236G>A) ou phénotypage.</p><p class="lab">Conduite</p><p>Hétérozygote : dose réduite de 50 % ; homozygote : fluoropyrimidine évitée.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-neuro" data-title="Neuropathie de l’oxaliplatine"><p class="lab">Nature</p><p>Neuropathie périphérique sensitive, cumulative.</p><p class="lab">IDEA</p><p>Grade ≥ 2 : 34 % après 6 mois, 11 % après 3 mois.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Eloxatine®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-contentieux" data-title="Contentieux : durée de CAPOX"><p class="lab">FI Xeloda®</p><p>Association avec l’oxaliplatine en adjuvant : 6 mois.</p><p class="lab">ESMO 2020</p><p>CAPOX 3 ou 6 mois [I, A] ; 3 mois pour T1-3 N1.</p><p class="lab">Choix du cours</p><p>La recommandation européenne la plus récente ; usage hors libellé de la FI à signaler.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeloda®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-d-cape" data-title="Capécitabine (Xeloda®)"><p class="lab">Indication suisse</p><p>Adjuvant du cancer du côlon de stade C de Dukes, seule ou avec l’oxaliplatine.</p><p class="lab">Doses</p><p>1 250 mg/m² 2 ×/j J1-J14 seule ; 1 000 mg/m² 2 ×/j J1-J14 avec oxaliplatine ; dans les 30 minutes suivant un repas.</p><p class="lab">Contre-indications</p><p>Déficit complet en DPD, ClCr < 30 ml/min, Child-Pugh C, brivudine, grossesse.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeloda®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-d-oxali" data-title="Oxaliplatine (Eloxatine®)"><p class="lab">Indication suisse</p><p>Adjuvant du stade III avec 5-FU et acide folinique.</p><p class="lab">Dose</p><p>85 mg/m² toutes les 2 semaines, 12 cycles ; perfusion de 2 h dans du glucose 5 %.</p><p class="lab">Contre-indications</p><p>Neutrophiles < 2 000/mm³, plaquettes < 50 000/mm³, neuropathie fonctionnelle, ClCr < 30 ml/min.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Eloxatine®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
