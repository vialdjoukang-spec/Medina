<template data-pop="pareto-c18-clinique" data-title="Loi de Pareto — Cancer du côlon"><p class="ratio" data-cover="c18-3,c18-5,c18-6,c18-7,c18-9,c18-10"></p><ul><li>De 50 à 74 ans, on dépiste par un FIT tous les 2 ans ou une coloscopie tous les 10 ans.</li><li>Coloscopie totale + scanner TAP + ACE.</li><li>Stade III = ganglion envahi.</li><li>Le pathologiste examine ≥ 12 ganglions, et l’on teste le statut MMR/MSI au stade II et pour dépister le Lynch.</li><li>On donne CAPOX pendant 3-6 mois ou FOLFOX pendant 6 mois, en débutant avant 8 semaines.</li><li>La coloscopie se fait à 1 an, et l’ACE tous les 3-6 mois.</li></ul></template>
<template data-pop="pareto-c18-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="c18-e-1,c18-e-2"></p><ul><li>Coloscopie totale + biopsies.</li><li>On fait un scanner TAP injecté.</li><li>On dose l’ACE avant la chirurgie.</li><li>Le pathologiste examine ≥ 12 ganglions et teste le statut MMR/MSI.</li><li>DPD avant fluoropyrimidine.</li></ul></template>
<template data-pop="pareto-c18-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="c18-p-1,c18-p-2,c18-p-3"></p><ul><li>DPD avant fluoropyrimidine.</li><li>CAPOX associe l’oxaliplatine 130 mg/m² et la capécitabine 1 000 mg/m² 2 ×/j de J1 à J14.</li><li>Dans FOLFOX, l’oxaliplatine se donne à 85 mg/m² toutes les 2 semaines.</li><li>La neuropathie justifie la durée courte.</li></ul></template>
<template data-pop="c18-ccr" data-title="Cancer du côlon"><p class="lab">Définition</p><p>Tumeur maligne de la muqueuse colique, le plus souvent un adénocarcinome, qui croît vers la lumière et dans la paroi.</p><p class="lab">Regroupement OFS</p><p>L’OFS regroupe sous le terme de cancer colorectal le côlon, la jonction rectosigmoïdienne et le rectum.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://krebs-monitoring.bfs.admin.ch/fr/detail/C18-20/" target="_blank" rel="noopener">Office fédéral de la statistique et Organe national d’enregistrement du cancer, Monitorage du cancer en Suisse, cancer colorectal, moyennes annuelles 2018-2022 (publié le 10.11.2025)</a>.</p></template>
<template data-pop="c18-colo" data-title="Coloscopie totale"><p class="lab">Rôle</p><p>Confirmation par biopsie, recherche de lésions synchrones, marquage et exérèse de lésions précancéreuses [I, A].</p><p class="lab">Si incomplète</p><p>Si elle est incomplète, on fait une coloscopie gauche et une coloscopie virtuelle, puis une coloscopie complète dans les 3-6 mois postopératoires, car un cancer synchrone peut exister.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p><figure><img src="data:image/gif;base64,R0lGODdh2QHIAYYAAPTr1Oe/lfqeXeOeYvmRY/iRTu+RTNiQU/aHWe6FWfKFSfCFNuOFWeOEM9OERrqEWfB6T+l5Tu19Ou12Od55TN55NMp5Wsp3Tc13Nbt4Tqt2UehuPtluPcluP+BmO8lmO9RZOLZuTbZnS7lpPbRgRbhfN7RWO6ZrTaZhS6ZjP6RYRKJQQqVTOZZbRpVPQItTQ3VUSbtBNp9GOpRJPZRBOotIQItHOIo/OX5GQH5FOH4/OHs5NXgxMmpDPWo5NVw7N0g7NWwuL14uLkUuK2ImKVIkJj8jI0YXHDYVGSsmJCUfHyEaHCoUFx0UGhUTGSULFhgKGRIKGAoKGgkGGgkIEiQCGxsCGxYCHRYCFRACGxACFAsDGwoDFwQDGgkCEQICDwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA2QHIAUAI/wCbQLmSBQuUg1CwaNESpSEWLFWqWIlipcpBiVKkOIEiBYrDhwezNBzZkAtDhB61cMkYRctDKzBhIrQCZSHJkVS8RHEiUAsUJUmWHGw4NAtLogedkHTCUylTnk2aLFmidOkSJVSfbsSqlSfWJk55Zm2qteFTs0zRhi2rMW0UKG6ZZuwKlkrXqlGjagWrdSjKkVK/omyiRInAg1je5lUbJWPbkXBb3oQS9e9KpnqdNhnZderZhkvALhU7FqpSKlEI38Q5V6kU1HenON6ZkQqVtk5qr1abm8pCra9b17btxfXsJo7lOg7+VEoUKl/s3rRtG7dbs12yc9nCfQuXiFcqRv+sgiRiTCsKtYiXmKV9+PERodj+SL4KRCte1EtUudAlfInr7ZefFllsEd4TTwCVRGGFbfaWX5sRZphZz81X4U7PVXgaYlgwBVdUUeRX4W3XxeWEXXetFVZeHj1Il1SU5eVgXk8JJONBMmJ21VQyhiaWQFjoJZVnVaXIGVRRfWWWVDky5eOSn2FW2VBENQFEEg7GWKNbUCyRWkJMPMHEmEkkMSYSRhiBxJppqpnmmnAyAeecZ64pp5lAGcZQEwhWtidRWujkhE4qcWGobf1xQd1t2U1hEhddEJffS/15YamhUWSx0EtYxHRFoa/l5AUX7RHYXnsjmvTQqlgQ5F12sDb/OsV7V2yhXRaKfmFSe7ZGuqhtX3hx22tffBGqFCo <template data-pop="c18-tdm" data-title="Scanner thoraco-abdomino-pelvien"><p class="lab">Place</p><p>Méthode préférée pour les métastases à distance [II, B].</p><p class="lab">Limite</p><p>Il détecte mal les métastases péritonéales.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-ace" data-title="Antigène carcinoembryonnaire (ACE)"><p class="lab">Usage</p><p>On le dose avant l’opération et pendant le suivi [III, A] ; sans biopsie, il n’a pas de valeur diagnostique.</p><p class="lab">Pronostic</p><p>Un taux postopératoire > 5 ng/ml annonce une évolution plus défavorable, car il suggère une maladie résiduelle.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-tnm" data-title="Classification TNM (UICC, 8e édition)"><p class="lab">T</p><p>Tis atteint le chorion, T1 la sous-muqueuse, T2 la musculeuse, T3 la sous-séreuse, T4a le péritoine viscéral et T4b d’autres organes.</p><p class="lab">N</p><p>N1a correspond à 1 ganglion, N1b à 2-3, N1c à des dépôts tumoraux, N2a à 4-6 et N2b à ≥ 7 ganglions.</p><p class="lab">M</p><p>M1a correspond à un organe, M1b à plusieurs et M1c au péritoine.</p><p class="src">Références : <a href="https://www.annalsofoncology.org/cms/10.1016/j.annonc.2020.06.022/attachment/dd2a0bf3-36ed-44d3-846a-71d5e6786b04/mmc1.pdf" target="_blank" rel="noopener">UICC, TNM Classification of Malignant Tumours, 8e édition — tableau supplémentaire S1 de la recommandation ESMO 2020</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhWAJ3AYYAAPz+/vr5+uL1+8jt+8fq+sXo+vj49tnu9u/y4Mbm98Ll98Hk9sPi8dPc2b7l9b7i873g8bzf8Lze7Lje7rrd7rrc6rbc67jb6rfX5bHX5a3S39S8stOsi9qhiMShheSYe86Zf8CYfuWOdeSFbtSJcMGResGJeMGIaqnM2Ku/xpa+xaGmoXiiorWPeLSGc7OFZ6mHa4OKe+J6ZuJuXtB6ZdBuXbl8arh6XbpvXKh8aKd7X6ZyYaV1V6RsU+FeVNJdU8RiVMNWTqljV6ViSqlYStFKRb5JRapJQrU6ObApLJZzXpZuUJVlT5RdTpNcQ5RRQ4pkT4pYRHVhVIZOPXZNPY5BQIw/MXpCOHk/LIwyMHgyLIUhI2w5LVo0K2IiIEAdGQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWAJ3AUAI/wAnPJiQAYWKFQ0MGECgsKHDhxAhMozYUIAAig4tCjiw8eJEjBEDBAAJcSTJkxQBGBCJsqTIkSxNrpQZkubLli1pNlT5EsBLmz9vNoT5c6XKoT59KiQa1GdQkU6f9oz6EwBVqRSLxswKtejQAFZjSq3KcqbYlV91LgWQIoWABikaRFVqAG5cBEQNABCwIgXHiwrf3v36toHHiSobHED7ESTNxjgjH2BAoAABAgMyV1agoEABzqA5O3AAeoHp0KBHq3bwAILrB7AhRJj9QEHrCBRmU3jtmgEECxoMBl8hYCTkhwcQUiwuIEYKtiuOgtxr2ADgwAEEpGAggQWDFRiyk//MW1bhXoNSGHw/oPYhWJVOh1oEoEIKBgB9lbafafWrfBYxsHBACiuUh5GBDoF1gHMANICQSsc9JJ1RJjUIoHMPTsiVUP/FgEIADtK1lFA3gXWTVXsReJ+DcpkllVN0WXWAXCLNCNaDXY1lon4qLSajAFY5iMBVPb3H01zZoZgUfi2aVN5ZXilWo2EAJHdAVO7B5BKLTqWwYgwtRjYTXzFcqUKAhj0oZmQbDUBAAnAqYJpnnqGG2mcLqHaanKmtphpsrfEGAaCE+ukABBVkoIEKKkiAUABtAYDBChwJyNdzk <template data-pop="c18-ihc" data-title="Immunohistochimie MMR"><p class="lab">Perte MSH2 et/ou MSH6</p><p>Une perte de MSH2 ou de MSH6 fait suspecter un syndrome de Lynch.</p><p class="lab">Perte MLH1 et PMS2</p><p>Chercher une mutation BRAF ou une hyperméthylation du promoteur de MLH1 : si présente, altération somatique probable.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-lynch" data-title="Syndrome de Lynch"><p class="lab">Définition</p><p>Prédisposition héréditaire liée à un gène de réparation des mésappariements ; anciennement « cancer colorectal héréditaire sans polypose ».</p><p class="lab">Fréquence</p><p>Il explique 2-4 % des cancers colorectaux.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-paf" data-title="Polypose adénomateuse familiale"><p class="lab">Fréquence</p><p>Avec ses variantes, elle explique environ 1 % des cancers colorectaux.</p><p class="lab">Dépistage</p><p>Son dépistage relève des recommandations ESMO des cancers digestifs héréditaires.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-fit" data-title="Test immunochimique fécal (FIT)"><p class="lab">Principe</p><p>Il détecte par immunologie l’hémoglobine humaine dans les selles.</p><p class="lab">Performance</p><p>Il détecte plus de lésions et a une meilleure valeur prédictive positive que le test au gaïac.</p><p class="lab">Suisse</p><p>En Suisse, on le fait tous les 2 ans de 50 à 74 ans, et un test positif conduit à une coloscopie (OPAS).</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.fedlex.admin.ch/eli/cc/1995/4964_4964_4964/fr" target="_blank" rel="noopener">Ordonnance du DFI sur les prestations de l’assurance des soins (OPAS, RS 832.112.31), art. 12e, let. d, version en vigueur depuis le 1er juillet 2026</a>.</p></template>
<template data-pop="c18-opas" data-title="OPAS, article 12e, lettre d"><p class="lab">Tranche d’âge</p><p>Il couvre les personnes de 50 à 74 ans (version en vigueur depuis le 1er juillet 2026).</p><p class="lab">Méthodes</p><p>On recherche le sang occulte tous les 2 ans, avec une coloscopie si le test est positif, ou l’on fait une coloscopie tous les 10 ans.</p><p class="lab">Franchise</p><p>Aucune dans les programmes cantonaux énumérés.</p><p class="src">Références : <a href="https://www.fedlex.admin.ch/eli/cc/1995/4964_4964_4964/fr" target="_blank" rel="noopener">Ordonnance du DFI sur les prestations de l’assurance des soins (OPAS, RS 832.112.31), art. 12e, let. d, version en vigueur depuis le 1er juillet 2026</a>.</p></template>
<template data-pop="c18-budding" data-title="Bourgeonnement tumoral"><p class="lab">Définition</p><p>Cellules isolées ou petits amas tumoraux au front d’invasion.</p><p class="lab">Portée</p><p>Dans un pT1 sur polype, un grade supérieur à 1 impose une résection chirurgicale [IV, B], car il prédit une atteinte ganglionnaire.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-stent" data-title="Prothèse colique"><p class="lab">Place</p><p>Pont vers une chirurgie programmée en cas d’occlusion, en centre expert, surtout après 70 ans ou si ASA > II [II].</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-fp" data-title="Fluoropyrimidines"><p class="lab">Molécules</p><p>Ce sont le 5-fluorouracile, intraveineux et associé à l’acide folinique, et la capécitabine, une prodrogue orale.</p><p class="lab">Précaution</p><p>Test DPD avant le début [III, A].</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeloda®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-idea" data-title="Analyse IDEA"><p class="lab">Effectif</p><p>Elle a réuni 12 834 patients de stade III issus de six essais, qui comparaient 3 et 6 mois.</p><p class="lab">Résultat</p><p>CAPOX pendant 3 mois s’est montré non inférieur (HR 0,95), alors que FOLFOX pendant 3 mois s’est montré inférieur (HR 1,16) ; la neuropathie de grade ≥ 2 a touché 11 % contre 34 % des patients.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-capox" data-title="CAPOX"><p class="lab">Composition</p><p>Il associe la capécitabine et l’oxaliplatine en cycles de 3 semaines.</p><p class="lab">Durée (ESMO)</p><p>Il dure 3 mois si la tumeur est T1-3 N1, et 6 mois si elle est T4 ou N2 (avec prudence).</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeloda®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-folfox" data-title="FOLFOX"><p class="lab">Composition</p><p>Il associe l’acide folinique, le 5-fluorouracile et l’oxaliplatine en cycles de 2 semaines.</p><p class="lab">Durée</p><p>Il dure 6 mois (12 cycles), car 3 mois se sont montrés inférieurs dans IDEA.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Eloxatine®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-lv5fu2" data-title="LV5FU2 (schéma de de Gramont)"><p class="lab">Composition</p><p>Acide folinique et 5-fluorouracile en perfusion.</p><p class="lab">Place</p><p>Adjuvant de 6 mois sans oxaliplatine [I, A].</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-dpd" data-title="Test DPD"><p class="lab">Méthodes</p><p>On génotype DPYD (DPYD*2A, c.1679T>G, c.2846A>T, c.1236G>A) ou l’on mesure le phénotype.</p><p class="lab">Conduite</p><p>Hétérozygote : dose réduite de 50 % ; homozygote : fluoropyrimidine évitée.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a>.</p></template>
<template data-pop="c18-neuro" data-title="Neuropathie de l’oxaliplatine"><p class="lab">Nature</p><p>C’est une neuropathie périphérique sensitive et cumulative.</p><p class="lab">IDEA</p><p>Le grade ≥ 2 touche 34 % des patients après 6 mois et 11 % après 3 mois.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Eloxatine®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-contentieux" data-title="Contentieux : durée de CAPOX"><p class="lab">FI Xeloda®</p><p>Association avec l’oxaliplatine en adjuvant : 6 mois.</p><p class="lab">ESMO 2020</p><p>L’ESMO recommande CAPOX pendant 3 ou 6 mois [I, A], et 3 mois pour T1-3 N1.</p><p class="lab">Choix du cours</p><p>Le cours suit la recommandation européenne la plus récente et signale l’usage hors libellé de la FI.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.annonc.2020.06.022" target="_blank" rel="noopener">Argilés G. et al., Localised colon cancer: ESMO Clinical Practice Guidelines for diagnosis, treatment and follow-up, Ann Oncol 2020;31:1291-1305</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeloda®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-d-cape" data-title="Capécitabine (Xeloda®)"><p class="lab">Indication suisse</p><p>Elle est autorisée en adjuvant du cancer du côlon de stade C de Dukes, seule ou avec l’oxaliplatine.</p><p class="lab">Doses</p><p>Seule, on donne 1 250 mg/m² 2 ×/j de J1 à J14 ; avec l’oxaliplatine, on donne 1 000 mg/m² 2 ×/j de J1 à J14, dans les 30 minutes suivant un repas.</p><p class="lab">Contre-indications</p><p>Déficit complet en DPD, ClCr < 30 ml/min, Child-Pugh C, brivudine, grossesse.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeloda®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="c18-d-oxali" data-title="Oxaliplatine (Eloxatine®)"><p class="lab">Indication suisse</p><p>Elle est autorisée en adjuvant du stade III avec le 5-FU et l’acide folinique.</p><p class="lab">Dose</p><p>On perfuse 85 mg/m² toutes les 2 semaines pendant 12 cycles, en 2 h dans du glucose 5 %.</p><p class="lab">Contre-indications</p><p>Neutrophiles < 2 000/mm³, plaquettes < 50 000/mm³, neuropathie fonctionnelle, ClCr < 30 ml/min.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Eloxatine®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
