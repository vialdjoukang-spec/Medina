<template data-pop="a54-e-taan" data-title="Test d’amplification des acides nucléiques : performances et limites">
<div class="lab">Principe</div><p>Le test amplifie une courte séquence d’ADN propre au gonocoque, le plus souvent par PCR. Il ne demande pas de bactérie vivante : il supporte un transport à température ambiante et des prélèvements non invasifs, comme le premier jet d’urine ou l’écouvillon vaginal.</p>
<div class="lab">Performances</div><p>Sa sensibilité dépasse 95 % chez les personnes symptomatiques comme asymptomatiques. Il dépasse nettement la culture au pharynx et au rectum. Sa spécificité dépend du test et du site : au pharynx, les <i>Neisseria</i> commensales peuvent produire de faux positifs, et la plupart des tests commerciaux ne sont pas homologués pour ce site.</p>
<div class="lab">Ce qu’il ne dit pas</div><p>Il ne mesure pas la sensibilité aux antibiotiques. Il ne distingue pas une bactérie vivante de l’ADN d’une bactérie tuée : un contrôle trop précoce peut rester positif après un traitement efficace.</p>
<div class="src">Sources : IUSTI, directive européenne 2020, « Testing and diagnosis » et « Follow-up and test of cure » ; SSI, « Gonococcie », validée le 8 mai 2024, diagnostic. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-e-culture" data-title="Culture du gonocoque : milieux, transport et indications">
<div class="lab">Pourquoi la faire</div><p>La culture isole une souche vivante. Elle seule permet l’antibiogramme, la confirmation d’un échec thérapeutique et la surveillance nationale des résistances. La SSI la demande idéalement sur l’écoulement, avant le traitement ; la directive européenne la souhaite chez toute personne dont le TAAN est positif, avant l’antibiotique.</p>
<div class="lab">Comment la réussir</div><p>Le prélèvement part immédiatement au laboratoire. Il est ensemencé sur un milieu sélectif contenant par exemple vancomycine, colistine, nystatine et triméthoprime, qui freine la flore commensale. Les sites adaptés sont l’endocol, l’urètre, le rectum, le pharynx et la conjonctive ; l’urine et l’écouvillon vaginal ne conviennent pas.</p>
<div class="lab">Limites</div><p>La sensibilité est bonne pour les prélèvements urogénitaux bien traités, mais nettement plus faible au rectum et au pharynx. Une culture négative ne contredit donc pas un TAAN positif.</p>
<div class="src">Sources : SSI, « Gonococcie », validée le 8 mai 2024, procédure diagnostique et transport ; IUSTI, directive européenne 2020, culture. Lues le 8 octobre 2026.</div></template>

<div class="lab">Technique</div><p>Le médecin étale l’écoulement sur une lame, le colore par la méthode de Gram ou au bleu de méthylène et l’observe à l’immersion, au grossissement de 1000.</p>
<div class="lab">Image normale et image pathologique</div><p>Un frottis normal montre des cellules épithéliales et de rares polynucléaires. La gonococcie produit de nombreux polynucléaires neutrophiles contenant des diplocoques à Gram négatif. La SSI confirme l’urétrite à partir de 5 polynucléaires par champ sur le frottis urétral.</p>
<div class="lab">Valeur</div><p>Chez l’homme avec écoulement, la sensibilité atteint 90 à 95 % et la spécificité dépasse 99 %. Elle chute à 50 à 75 % chez l’homme asymptomatique, à 16 à 50 % à l’endocol et à 40 % au rectum ; un frottis négatif n’exclut donc rien dans ces situations. Au pharynx, la microscopie n’est pas recommandée.</p>
<div class="src">Sources : IUSTI, directive européenne 2020, microscopie ; SSI, « Urétrite chez l’homme », validée le 13 juin 2024, prélèvements. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-e-coist" data-title="Infections associées : bilan à demander">
<div class="lab">Bilan suisse</div><p>La SSI demande toujours la recherche de <i>Chlamydia trachomatis</i>, de la syphilis, du VIH et de l’hépatite B. Elle fait vérifier la protection vaccinale contre l’hépatite B et discuter la vaccination contre l’hépatite A chez les HSH.</p>
<div class="lab">Compléments européens</div><p>La directive européenne propose aussi le dépistage de l’hépatite C. Elle limite la recherche de <i>Mycoplasma genitalium</i> aux personnes symptomatiques, avec recherche systématique de la résistance aux macrolides.</p>
<div class="lab">Raison</div><p>Une même exposition transmet plusieurs agents. Une co-infection à chlamydia est fréquente ; elle demande un traitement distinct, car la ceftriaxone ne la traite pas.</p>
<div class="src">Sources : SSI, « Gonococcie », validée le 8 mai 2024 ; SSI, « Urétrite chez l’homme », validée le 13 juin 2024 ; IUSTI, directive européenne 2020. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-e-urines" data-title="Premier jet d’urine : technique">
<div class="lab">Recueil</div><p>Le patient recueille les premiers millilitres de la miction, qui lavent l’urètre et entraînent les bactéries. La SSI « Gonococcie » demande 5 à 10 mL. La SSI « Urétrite chez l’homme » demande les urines du matin ou au moins deux heures après la dernière miction, environ 20 mL ; la directive européenne admet jusqu’à 20 mL au moins une heure après la miction précédente.</p>
<div class="lab">Usage</div><p>Ce prélèvement non invasif convient au TAAN, avec une sensibilité élevée. Il ne convient pas à la culture : l’antibiogramme exige l’écoulement ou un écouvillon urétral.</p>
<div class="src">Sources : SSI, « Gonococcie », méthodes de prélèvement ; SSI, « Urétrite chez l’homme », prélèvements ; IUSTI, directive européenne 2020, tests. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-e-vaginal" data-title="Écouvillon vaginal : le prélèvement de choix chez la femme">
<div class="lab">Recommandation</div><p>La directive européenne recommande l’écouvillon vulvovaginal pour le TAAN chez la femme, prélevé par le soignant ou par la patiente elle-même. Il est plus sensible et moins invasif, car il ne demande pas de spéculum. La SSI retient de même le frottis vaginal pour la PCR.</p>
<div class="lab">Limite</div><p>L’écouvillon vaginal ne se cultive pas. Si un antibiogramme est souhaité, le médecin prélève l’endocol au spéculum avant le traitement.</p>
<div class="src">Sources : IUSTI, directive européenne 2020, tests ; SSI, « Gonococcie », méthodes de prélèvement. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-e-extragenital" data-title="Pharynx et rectum : quand prélever">
<div class="lab">Indications</div><p>Les infections pharyngées et rectales sont asymptomatiques dans plus de 90 % des cas. La directive européenne demande ces prélèvements systématiquement chez les HSH ; elle les propose chez les femmes partenaires d’une personne atteinte et les oriente par l’anamnèse, les symptômes et les signes chez les autres patients. La SSI « Urétrite chez l’homme » les recommande fortement en cas de risque élevé.</p>
<div class="lab">Interprétation</div><p>Au pharynx, la spécificité du TAAN est menacée par les <i>Neisseria</i> commensales : un résultat positif doit être confirmé si la valeur prédictive positive du test n’atteint pas 90 %. Le pharynx est aussi le site où la ceftriaxone échoue le plus souvent.</p>
<div class="src">Sources : SSI, « Gonococcie », points importants ; SSI, « Urétrite chez l’homme », validée le 13 juin 2024 ; IUSTI, directive européenne 2020 ; ECDC, 16 juillet 2026. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-e-vpp" data-title="Valeur prédictive positive : pourquoi la prévalence compte">
<div class="lab">Définition</div><p>La valeur prédictive positive est la probabilité qu’un résultat positif corresponde à une infection réelle. Elle dépend de la spécificité du test et de la prévalence de l’infection dans la population testée. La directive européenne exige qu’elle dépasse 90 % ; sinon, tout positif est confirmé par un second test visant une autre séquence.</p>
<div class="lab">Exemple de calcul</div><p>Prenons un test de sensibilité 95 % et de spécificité 99,5 %. Dans une population où 1 personne sur 100 est infectée, 1000 tests donnent 9,5 vrais positifs et 4,95 faux positifs : la valeur prédictive positive vaut environ 66 %. Si 10 personnes sur 100 sont infectées, les mêmes 1000 tests donnent 95 vrais positifs et 4,5 faux positifs : elle atteint environ 95 %. Le même test est donc fiable dans une consultation spécialisée et insuffisant pour un dépistage à faible prévalence.</p>
<div class="src">Source : IUSTI, directive européenne 2020, confirmation du TAAN. Le calcul est un exemple pédagogique, non une performance mesurée.</div></template>

<template data-pop="a54-e-moleculaire" data-title="Marqueurs moléculaires de résistance : portée">
<div class="lab">Principe</div><p>Certains TAAN recherchent, en plus du gonocoque, une mutation associée à une résistance. Un essai commercial (Allplex) détecte une mutation de la gyrase liée à la résistance à la ciprofloxacine et deux mutations de l’ARN ribosomique 23S liées à la résistance à l’azithromycine.</p>
<div class="lab">Performances et pièges</div><p>Dans une étude écossaise de 2026 portant sur 82 échantillons positifs appariés à une culture, sensibilité et spécificité dépassaient 97 % pour les marqueurs. Un faux négatif venait d’une autre substitution au même acide aminé de la gyrase, et deux faux positifs concernaient des souches porteuses d’une mutation 23S mais sensibles. La directive européenne n’admet la ciprofloxacine sur la base d’un test moléculaire de la gyrase que pour les prélèvements anogénitaux, à cause des réactions croisées pharyngées.</p>
<div class="lab">Limite</div><p>Aucun marqueur courant ne prédit de façon fiable la sensibilité à la ceftriaxone : seule la culture la mesure.</p>
<div class="src">Sources : <a href="https://doi.org/10.1136/sextrans-2025-056494" target="_blank" rel="noopener" data-reference-source="1">McHugh et al., Sex Transm Infect 2026</a> (résumé PubMed lu) ; IUSTI, directive européenne 2020, traitements alternatifs ; Grad et al., J Infect Dis 2016, doi 10.1093/infdis/jiw420.</div></template>

<template data-pop="a54-e-cmi" data-title="Antibiogramme : lire une concentration minimale inhibitrice">
<div class="lab">Définition</div><p>La CMI est la plus faible concentration d’antibiotique qui empêche la croissance visible de la souche. Le laboratoire la compare à des seuils cliniques et classe la souche sensible ou résistante.</p>
<div class="lab">Repères chiffrés</div><p>Selon l’information professionnelle suisse de Rocephin®, la ceftriaxone inhibe la moitié des gonocoques étudiés à 0,008 mg/L ou moins et 90 % à 0,06 mg/L. Les souches résistantes signalées en Europe par l’ECDC en 2026 avaient des CMI de 0,19 à 0,38 mg/L, jusqu’à 1,0 mg/L en Norvège, en Espagne et dans les isolats britanniques. Pour l’azithromycine, l’ECDC compte les souches dont la CMI dépasse le seuil épidémiologique de 1 mg/L.</p>
<div class="lab">Conséquence</div><p>Une CMI élevée de ceftriaxone impose un avis spécialisé, un contrôle de guérison et une déclaration de l’échec éventuel.</p>
<div class="src">Sources : Information professionnelle suisse Rocephin®, Swissmedic (AIPS), juin 2025, consultée le 08.10.2026 ; ECDC, évaluation du risque du 16 juillet 2026.</div></template>

<template data-pop="a54-e-dgi" data-title="Infection disséminée : prélèvements et critères">
<div class="lab">Prélèvements</div><p>Le médecin prélève des hémocultures, le liquide synovial d’une articulation atteinte et, si possible, une pustule cutanée pour culture. Il prélève aussi tous les sites muqueux exposés, car la porte d’entrée y reste souvent cultivable.</p>
<div class="lab">Critères de la SSI</div><p>L’infection est confirmée par une culture positive du sang, du liquide synovial ou d’une biopsie cutanée. Elle est probable si une culture anogénitale ou pharyngée est positive avec des signes cliniques typiques. Elle est possible si les signes sont typiques et la réponse au traitement bonne malgré des cultures négatives.</p>
<div class="src">Sources : SSI, « Gonococcie », validée le 8 mai 2024, critères diagnostiques ; IUSTI, directive européenne 2020, infection disséminée. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-e-controle" data-title="Contrôle de guérison : calendrier suisse et calendrier européen">
<div class="lab">Suisse</div><p>La SSI recommande un contrôle microbiologique sept jours après le traitement. Elle informe la personne qu’une persistance des symptômes au-delà de deux jours impose un nouveau prélèvement urétral ou urinaire pour culture et recherche de résistance, puis un avis spécialisé.</p>
<div class="lab">Europe</div><p>La directive européenne de 2020 recommande un contrôle dans tous les cas. En cas de symptômes, la culture se fait trois à sept jours après le traitement, complétée une semaine plus tard par un TAAN si elle est négative. Chez la personne asymptomatique, le TAAN se fait deux semaines après le traitement.</p>
<div class="lab">Arbitrage</div><p>Les deux textes imposent un contrôle ; la directive suisse de 2024 est la plus récente et s’applique en Suisse. Un TAAN positif au septième jour est interprété avec prudence et conduit à une culture avant toute conclusion de résistance.</p>
<div class="src">Sources : SSI, « Gonococcie », validée le 8 mai 2024, traitement ; IUSTI, directive européenne 2020, contrôle de guérison. Lues le 8 octobre 2026.</div></template>

<template data-pop="a54-e-positif" data-title="Contrôle positif : échec, réinfection ou ADN résiduel">
<div class="lab">Trois explications</div><p>Un contrôle positif peut traduire un échec du traitement, une réinfection par un partenaire non traité ou, avec le TAAN, l’ADN résiduel de gonocoques tués. La SSI « Urétrite chez l’homme » fait penser d’abord à la réinfection et reprend l’anamnèse sexuelle.</p>
<div class="lab">Démarche</div><p>Le médecin cultive le site positif avec antibiogramme avant tout nouveau traitement et demande un avis spécialisé. La directive européenne demande de documenter un échec suspect par l’histoire des traitements, l’exclusion d’une réinfection et la comparaison génétique des souches avant et après traitement. L’ECDC demande de déclarer rapidement tout échec suspect ou confirmé.</p>
<div class="src">Sources : SSI, « Urétrite chez l’homme », validée le 13 juin 2024 ; IUSTI, directive européenne 2020, échecs thérapeutiques ; ECDC, évaluation du risque du 16 juillet 2026.</div></template>

<template data-pop="pareto-a54-examens" data-title="Loi de Pareto — Examens de la gonococcie">
<p class="ratio" data-cover="a54-e-1,a54-e-2,a54-e-3,a54-e-4,a54-e-5,a54-e-6,a54-e-7,a54-e-8,a54-e-9"></p><ul><li>Le TAAN détecte (sensibilité supérieure à 95 %) ; la culture préthérapeutique seule mesure la sensibilité.</li><li>Les pratiques désignent les sites ; pharynx et rectum sont silencieux dans plus de 90 % des cas.</li><li>Premier jet d’urine et écouvillon vaginal pour le TAAN ; écoulement et endocol pour la culture, jamais l’urine.</li><li>Microscopie : 90 à 95 % de sensibilité chez l’homme qui coule ; aucune valeur d’exclusion ailleurs.</li><li>Positif pharyngé : confirmation par une autre cible si la valeur prédictive positive est inférieure à 90 %.</li><li>Bilan associé : chlamydia, syphilis, VIH, hépatite B.</li><li>Dissémination : culture d’un site stérile.</li><li>Contrôle au septième jour (SSI) ; culture si symptômes au-delà de deux jours.</li></ul></template>
