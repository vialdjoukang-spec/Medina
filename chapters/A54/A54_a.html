<section class="ilot" id="a54-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. N., 27 ans, consulte pour une brûlure mictionnelle et un écoulement urétral. Cinq jours plus tôt, il a eu des rapports vaginal et oral sans préservatif avec une nouvelle partenaire. Ce délai entre dans l’intervalle d’incubation de un à sept jours que donne la Société suisse d’infectiologie (SSI) pour la gonococcie. Il ne désigne pourtant pas l’agent : les <button class="w" data-k="a54-pa-uretrite">urétrites gonococcique et à chlamydia (diagnostic différentiel)</button> se ressemblent cliniquement, et plus de la moitié des urétrites relèvent de l’un de ces deux germes, parfois des deux. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », validée le 8 mai 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », validée le 13 juin 2024</a>.</p>
<p>Ce cours répond à quatre questions. Quels sites prélever, et avec quelle méthode, pour prouver l’infection et obtenir un antibiogramme ? Quels signes font sortir du cadre d’une infection muqueuse simple ? Quel antibiotique, à quelle dose, selon la directive suisse et l’information professionnelle suisse ? Comment contrôler la guérison, traiter les partenaires et prévenir la réinfection ?</p>
<div class="key"><b>À retenir.</b> La clinique oriente le bilan ; seul le laboratoire identifie le gonocoque, et seule la culture fournit sa sensibilité aux antibiotiques.</div></section>

<section class="ilot" id="a54-pa-1"><h2><span class="n">1</span>Définition et formes cliniques</h2>
<p>La gonococcie est l’infection par <i>Neisseria gonorrhoeae</i>, diplocoque à Gram négatif, pathogène strictement humain. L’infection touche principalement l’épithélium de l’urètre, de l’endocol, du rectum, de l’oropharynx et des conjonctives ; elle peut monter vers le tractus génital haut ou diffuser par voie sanguine. <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020, Unemo et al., Int J STD AIDS</a>.</p>
<p>La décision thérapeutique dépend de la forme clinique, que l’on classe ainsi d’après les deux directives :</p>
<table class="t"><thead><tr><th>Forme</th><th>Sites ou manifestations</th><th>Conséquence pratique</th></tr></thead><tbody>
<tr><td>Infection muqueuse non compliquée</td><td>Urètre, col, rectum, oropharynx</td><td>Dose unique de ceftriaxone selon la SSI.</td></tr>
<tr><td>Infection génitale haute</td><td>Épididymo-orchite ; maladie inflammatoire pelvienne</td><td>Schéma propre à l’atteinte haute.</td></tr>
<tr><td>Atteinte oculaire</td><td>Conjonctivite de l’adulte ; ophtalmie du nouveau-né</td><td>Évaluation rapide et schéma spécifique.</td></tr>
<tr><td>Infection disséminée</td><td>Arthrite-dermatite, ténosynovite, arthrite purulente ; rarement endocardite ou méningite</td><td>Hospitalisation initiale et traitement de sept jours.</td></tr>
</tbody></table><div class="key"><b>Lecture et physiopathologie.</b> Chaque ligne s’éloigne de la muqueuse d’inoculation. En effet, Neisseria gonorrhoeae adhère aux cellules cylindriques de l’urètre, du col, du rectum et de la conjonctive grâce à ses pili ; il y provoque une inflammation riche en polynucléaires, d’où l’écoulement purulent. Ensuite, il peut remonter le long des voies génitales ou passer dans le sang. C’est pourquoi le traitement s’allonge à mesure que l’infection quitte la muqueuse.</div>
<p>Le tableau se lit de gauche à droite : chaque ligne quitte un peu plus la muqueuse et allonge le traitement. Pour la forme disséminée, la SSI distingue trois degrés de certitude, détaillés dans la <button class="w" data-k="a54-pa-dgi">gonococcie disséminée (critères SSI)</button>. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », clinique et critères diagnostiques</a>.</p>
<div class="key"><b>À retenir.</b> Le site et l’extension, plus que le nom de la bactérie, fixent le traitement et sa durée.</div></section>

<section class="ilot" id="a54-pa-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>En 2024, les laboratoires et les médecins ont déclaré à l’OFSP <b>6805 cas</b> de gonorrhée en Suisse et au Liechtenstein, soit <b>75,6 cas pour 100 000 personnes</b>, 11,6 % de plus qu’en 2023. Le nombre de cas a été multiplié par 13,8 depuis 2001. L’OFSP attribue l’essentiel de cette hausse à l’extension des dépistages : davantage de tests découvrent davantage d’infections, notamment asymptomatiques. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, « La gonorrhée en Suisse et au Liechtenstein en 2024 »</a>.</p>
<p>Les hommes représentaient 83,3 % des cas. Lorsque la voie d’infection était connue, 58,3 % des infections provenaient de rapports entre hommes, 26,2 % de rapports hétérosexuels avec une femme et 14,9 % de rapports hétérosexuels avec un homme. La tranche de 25 à 34 ans était la plus touchée chez les hommes ; chez les femmes, l’âge médian était de 26 ans. L’incidence était la plus élevée dans les régions de Zurich et lémanique (95,2 pour 100 000 dans cette dernière). Le <button class="w" data-k="a54-pa-epid">détail de la surveillance suisse (OFSP 2024)</button> précise ces chiffres et leurs limites. En Europe, la gonorrhée est la deuxième infection sexuellement transmissible bactérienne déclarée après la chlamydiose. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025</a> ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020</a>.</p>
<p>Le pronostic d’une forme muqueuse traitée par une molécule active est bon : la ceftriaxone 1 g guérit les infections anogénitales et oropharyngées dues à des souches sensibles. Il est menacé par deux facteurs. Le premier est l’ascension non traitée, qui expose à la grossesse extra-utérine et à l’infertilité après maladie inflammatoire pelvienne. Le second est la <button class="w" data-k="a54-pa-resistance">résistance (données suisses)</button> : selon ANRESIS, 70 % des souches suisses résistaient aux quinolones et 21 % à l’azithromycine en 2024, et l’ECDC décrit depuis 2022 une hausse des souches résistantes à la ceftriaxone dans onze pays européens. <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, « Résistance aux antibiotiques »</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/ra-ceftriaxone-neisseria-gonorrhoeae.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, évaluation du risque du 16 juillet 2026</a>.</p>
<div class="key"><b>À retenir.</b> Incidence suisse 2024 : 75,6 pour 100 000 ; hommes 83 % ; résistance suisse aux quinolones 70 % et à l’azithromycine 21 %.</div></section>

<section class="ilot" id="a54-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Normal.</b> Les muqueuses urétrale, cervicale, rectale, pharyngée et conjonctivale sont recouvertes d’un épithélium qui forme une barrière et ne contient pas de polynucléaires en nombre. <b>Perturbation.</b> Transmis par inoculation directe de sécrétions d’une muqueuse à l’autre, le gonocoque s’attache à l’épithélium par ses pili de type IV, puis par ses protéines d’opacité, et forme des microcolonies. L’épithélium libère alors des signaux qui recrutent massivement des <button class="w" data-k="a54-sc-neutrophiles">polynucléaires neutrophiles (mécanisme)</button>. <b>Manifestation.</b> Ces neutrophiles et les débris cellulaires forment l’écoulement purulent ; l’inflammation de l’urètre explique la dysurie. <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, étiologie et transmission</a> ; onglet Sciences fondamentales.</p>
<p>Trois propriétés expliquent la clinique. La variation antigénique de la piline et la variation de phase des protéines d’opacité aident la bactérie à échapper aux défenses de l’hôte ; la réinfection est fréquente, et la SSI fait penser d’abord à elle devant une récidive. L’infection du pharynx et du rectum suscite peu de symptômes : plus de 90 % de ces infections sont asymptomatiques selon la SSI, ce qui en fait des réservoirs silencieux. Enfin, la bactérie peut monter vers l’épididyme ou les trompes, ou passer dans le sang ; le passage sanguin produit l’<button class="w" data-k="a54-pa-dgi">infection disséminée (signes et critères)</button>. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », points importants</a>.</p>
<div class="key"><b>À retenir.</b> Le pus traduit la réponse neutrophile ; l’absence de symptôme pharyngé ou rectal traduit une faible inflammation, pas l’absence de bactérie.</div></section>

<section class="ilot" id="a54-pa-4"><h2><span class="n">4</span>Transmission et facteurs de risque</h2>
<p>La transmission se fait par contact génito-génital, génito-anal, oro-génital ou oro-anal, et de la mère à l’enfant lors de l’accouchement. Le site à tester découle donc des pratiques, non de l’identité présumée de la personne : un rapport oral expose le pharynx, un rapport anal réceptif expose le rectum. <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, transmission</a>.</p>
<p>La SSI retient comme facteurs de risque les rapports sexuels entre hommes et le contact avec des travailleuses du sexe ; elle souligne la fréquence de la co-infection à <i>Chlamydia trachomatis</i>. La directive européenne propose un test dans les situations suivantes : écoulement urétral chez l’homme ; écoulement cervical ou vaginal avec un facteur de risque (âge inférieur à 30 ans, nouveau partenaire ou plusieurs partenaires dans l’année) ; cervicite mucopurulente ; autre IST récemment diagnostiquée ; partenaire d’une personne atteinte ; épididymo-orchite avant 40 ans ; douleur pelvienne aiguë ; conjonctivite purulente du nouveau-né ou de l’adulte. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », étiologie</a> ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, indications du test</a>.</p>
<p>Chez M. N., le rapport oral sans préservatif avec une nouvelle partenaire justifie de discuter un prélèvement pharyngé, en plus de l’urètre. Aucune exposition rectale n’est rapportée : la question est posée, mais elle n’est pas présumée.</p>
<div class="key"><b>À retenir.</b> L’anamnèse sexuelle décide des sites à prélever ; les infections pharyngées et rectales sont le plus souvent silencieuses.</div></section>

<section class="ilot" id="a54-pa-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’entretien établit la date et la nature des expositions, les sites exposés, le nombre de partenaires des trois derniers mois, les antécédents d’IST, les antibiotiques déjà pris, les allergies et, chez une patiente, une grossesse possible. Il recherche ensuite les symptômes, dont la fréquence diffère selon le sexe et le site :</p>
<div class="two"><div class="card"><p><b>Homme.</b> L’urétrite aiguë domine : écoulement chez plus de 80 % et dysurie chez plus de 50 % des patients, en général deux à huit jours après l’exposition. Moins de 10 % des infections urétrales masculines restent asymptomatiques. Une douleur ou un gonflement scrotal évoque une épididymite.</p></div><div class="card"><p><b>Femme.</b> L’infection est le plus souvent asymptomatique, notamment au col dans environ 50 % des cas. Les symptômes sont un écoulement vaginal modifié (50 %), une douleur abdominale basse (25 %), une dysurie (10 à 15 %), parfois des saignements intermenstruels ou des règles abondantes.</p></div></div>
<p>Les infections rectales et pharyngées donnent rarement un écoulement anal, une douleur anale ou un mal de gorge. Fièvre, douleur articulaire, lésions cutanées et œil rouge purulent sont toujours demandés, car ils signalent une forme compliquée. <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, symptômes</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », clinique</a>.</p>
<div class="trap"><span class="k">Piège.</span> L’absence de symptôme pharyngé après un rapport oral ne dispense pas du prélèvement pharyngé ; un signe non demandé n’est pas un signe absent.</div></section>

<section class="ilot" id="a54-pa-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen commence par l’état général et la température : une fièvre est le signe habituel d’une bactériémie gonococcique. Il porte ensuite sur les sites exposés, avec le consentement de la personne.</p>
<div class="two"><div class="card"><p><b>Homme.</b> Écoulement urétral mucopurulent, souvent avec érythème ou œdème du méat. Palpation testiculaire et épididymaire à la recherche d’une épididymo-orchite.</p></div><div class="card"><p><b>Femme.</b> Examen parfois normal ; sinon écoulement mucopurulent de l’endocol, hyperhémie et saignement au contact. Une douleur pelvienne aiguë fait rechercher une maladie inflammatoire pelvienne.</p></div></div>
<p>Hors des organes génitaux, le médecin examine la peau des extrémités (pustules nécrotiques indolores sur fond érythémateux), les gaines tendineuses et les articulations (mains, genoux), les conjonctives et, en cas de fièvre, les signes d’endocardite et de méningite, formes rares que cite la SSI. <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, signes physiques</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », gonococcémie disséminée</a> ; <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », signes cliniques</a>.</p>
<p>Le <button class="w" data-k="a54-pa-triage">triage des signes de gravité (conduite)</button> résume ce qui fait passer d’un circuit ambulatoire à une évaluation urgente.</p>
<div class="key"><b>À retenir.</b> Un examen génital normal n’exclut pas une gonococcie ; un examen extragénital anormal change la prise en charge.</div></section>

<section class="ilot" id="a54-pa-7"><h2><span class="n">7</span>Diagnostic</h2>
<p><b>Confirmer l’urétrite.</b> La SSI considère l’urétrite établie devant un écoulement purulent observé, devant au moins 10 polynucléaires par champ (×1000) dans le premier jet d’urine ou au moins 5 sur le frottis urétral, ou devant une bandelette urinaire montrant au moins une croix de leucocytes sans nitrites. <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », diagnostic</a>.</p>
<p><b>Identifier le gonocoque.</b> La <button class="w" data-k="a54-pa-pcr">PCR (amplification d’acides nucléiques)</button> est l’examen recommandé : sa sensibilité dépasse 95 % et elle est plus sensible que la culture à tous les sites. Chez l’homme, elle se fait sur le premier jet d’urine ; chez la femme, sur un frottis vaginal ; au pharynx et au rectum, sur écouvillon selon les expositions. La <button class="w" data-k="a54-pa-culture">culture avant l’antibiotique (antibiogramme)</button> est idéalement réalisée sur l’écoulement pathologique, car elle seule permet de mesurer la sensibilité de la souche. Chez l’homme symptomatique, la coloration de Gram d’un frottis urétral montrant des diplocoques intracellulaires a une sensibilité de 90 à 95 % et une spécificité supérieure à 99 %. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », diagnostic</a> ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, tests</a>.</p>
<p><b>Rechercher les autres infections.</b> La SSI demande toujours la recherche de <button class="w" data-k="a54-pa-coinfection">Chlamydia (co-infection)</button>, de la syphilis, du VIH et de l’hépatite B. <b>Diagnostics différentiels.</b> Devant une urétrite sans gonocoque, la SSI cite par ordre de fréquence <i>C. trachomatis</i>, <i>Mycoplasma genitalium</i>, puis <i>Trichomonas vaginalis</i>, <i>Ureaplasma urealyticum</i>, adénovirus et virus herpès simplex ; un corps étranger ou un cancer sont des causes non infectieuses à connaître. <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », étiologie</a>.</p>
<div class="key"><b>À retenir.</b> PCR des sites exposés pour détecter ; culture préthérapeutique pour l’antibiogramme ; recherche systématique de chlamydia, syphilis, VIH et hépatite B. L’onglet Examens détaille chaque test.</div>
<button class="pareto-btn ui" data-k="pareto-a54-bases">▲ Loi de Pareto — Reconnaître et confirmer la gonococcie</button></section>

<section class="ilot" id="a54-pa-8"><h2><span class="n">8</span>Urgences et complications</h2>
<div class="alert"><p><b>Gravité d’abord.</b> Fièvre avec arthrite, ténosynovite ou pustules cutanées : infection disséminée, hospitalisation initiale, cultures du sang, du liquide synovial ou d’une lésion cutanée avec antibiogramme. Souffle cardiaque nouveau ou syndrome méningé : endocardite, à destruction valvulaire rapide, ou méningite. Œil rouge purulent : conjonctivite gonococcique, irrigation fréquente au sérum physiologique et traitement sans délai. Douleur pelvienne avec fièvre : maladie inflammatoire pelvienne. Douleur scrotale avec œdème de la bourse : épididymite.</p></div>
<p>Les complications ascendantes sont la maladie inflammatoire pelvienne, qui expose à la grossesse extra-utérine et à l’infertilité, et l’épididymo-orchite. Pendant la grossesse, l’infection expose à la rupture prématurée des membranes, à l’accouchement prématuré, à la chorioamniotite et à l’ophtalmie du nouveau-né. La bactériémie est rare, mais devient plus fréquente lorsque l’incidence de la gonorrhée augmente. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », clinique</a> ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, complications et infection disséminée</a>.</p>
<p>Les <button class="w" data-k="a54-pa-complications">complications selon le site (conduite)</button> précisent le parcours de chaque forme.</p>
<button class="pareto-btn ui" data-k="pareto-a54-gravite">▲ Loi de Pareto — Reconnaître une forme grave</button></section>

<section class="ilot" id="a54-pa-9"><h2><span class="n">9</span>Prise en charge</h2>
<p><b>Objectifs.</b> Éradiquer le gonocoque à tous les sites, prévenir les complications, interrompre la transmission et ne pas sélectionner de résistance. <b>Moment du traitement.</b> La SSI demande d’éviter le traitement syndromique sans diagnostic, sauf si le tableau est sévère localement, typique et sans signe de dissémination. Devant un écoulement urétral ou cervical purulent typique, le traitement est donné juste après les prélèvements. Pour une urétrite masculine encore non attribuée, la directive « Urétrite chez l’homme » recommande d’attendre le résultat si la personne peut se protéger dans l’intervalle ; si les symptômes sont sévères, elle prescrit un traitement empirique couvrant gonocoque et chlamydia, puis l’ajuste. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », diagnostic</a> ; <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », traitement</a>.</p>
<table class="t"><thead><tr><th>Situation</th><th>Schéma suisse (SSI 2024)</th></tr></thead><tbody>
<tr><td>Urétrite, gonorrhée vaginale, anale ou oropharyngée</td><td><button class="w" data-k="a54-pa-ceftriaxone">Ceftriaxone 1 g</button> en une injection intramusculaire (éventuellement dissoute dans 4 mL de lidocaïne 1 %) ; voie intraveineuse possible.</td></tr>
<tr><td>Urétrite masculine sévère, agent inconnu</td><td>Ceftriaxone 1 g par voie intraveineuse ou intramusculaire et doxycycline 100 mg deux fois par jour pendant 7 jours ; arrêt de la doxycycline si seul le gonocoque est trouvé.</td></tr>
<tr><td>Infection disséminée</td><td>Ceftriaxone 1 g par voie intraveineuse toutes les 24 heures pendant 7 jours ; relais oral possible après 24 à 48 heures si amélioration et antibiogramme favorable.</td></tr>
<tr><td>Allergie sévère et certifiée aux céphalosporines</td><td><button class="w" data-k="a54-pa-autres-antibiotiques">Gentamicine 240 mg intramusculaire et azithromycine 2 g</button> en dose unique ; ciprofloxacine 500 mg seulement si la souche est sensible.</td></tr>
</tbody></table><div class="key"><b>Lecture et physiopathologie.</b> Le schéma suisse repose sur une seule molécule active, la ceftriaxone. En effet, la ceftriaxone se fixe sur la PBP2, enzyme de construction de la paroi, et tue le gonocoque ; sa longue demi-vie maintient une concentration efficace avec une seule injection dans l’infection muqueuse. Cependant, l’infection disséminée atteint des articulations et des tissus moins bien perfusés ; c’est pourquoi elle exige sept jours de traitement.</div>
<p>Le tableau associe chaque situation à un schéma unique ; la colonne de droite reproduit la SSI, dont les doses de ceftriaxone, de doxycycline, de gentamicine et de ciprofloxacine concordent avec les informations professionnelles suisses vérifiées dans l’onglet Pharmacologie. Deux écarts méritent d’être connus. D’abord, ces informations professionnelles indiquent encore 0,25 g de ceftriaxone pour la blennorragie, alors que la SSI et l’OFSP retiennent 1 g face aux résistances. Ensuite, la directive européenne IUSTI 2020 préfère une bithérapie ceftriaxone et azithromycine quand la sensibilité est inconnue et n’admet la ceftriaxone seule que sous conditions ; la SSI, plus récente, retient la monothérapie. Ces deux écarts et leur arbitrage figurent dans la fenêtre <button class="w" data-k="a54-pa-arbitrage">monothérapie suisse ou bithérapie européenne (source la plus récente)</button>. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », traitement</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025</a>.</p>
<p><b>Choix justifiés.</b> La ceftriaxone est, selon l’OFSP, le seul antibiotique de première ligne en Suisse ; la dose élevée vise à limiter l’apparition de résistances. Une quinolone ou l’azithromycine empiriques sont exclues : 70 % et 21 % des souches suisses leur résistaient en 2024. <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, « Résistance aux antibiotiques »</a>. <b>Surveillance et critères de modification.</b> Des symptômes qui persistent plus de deux jours imposent une nouvelle culture à la recherche d’une résistance et un avis spécialisé ; un résultat d’antibiogramme défavorable modifie le traitement.</p>
<button class="pareto-btn ui" data-k="pareto-a54-decision">▲ Loi de Pareto — Traiter, suivre et prévenir</button></section>

<section class="ilot" id="a54-pa-10"><h2><span class="n">10</span>Suivi, partenaires et prévention</h2>
<p><b>Contrôle de guérison.</b> La SSI recommande un <button class="w" data-k="a54-pa-controle">contrôle microbiologique sept jours après le traitement (calendrier)</button>. La directive européenne recommande aussi un contrôle dans tous les cas, mais avec un autre calendrier, détaillé dans la fenêtre. <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », traitement</a>.</p>
<p><b>Partenaires.</b> Les <button class="w" data-k="a54-pa-partenaires">partenaires des derniers mois (deux ou trois selon la directive)</button> sont informés, testés et traités sans attendre leurs résultats. Les rapports, y compris oraux, sont évités pendant une semaine après le début du traitement et tant que les partenaires ne sont pas traités. <b>Déclaration.</b> Le laboratoire déclare le gonocoque à l’OFSP ; le médecin qui a prescrit le test envoie au médecin cantonal le formulaire clinique complémentaire, comme l’explique la fenêtre <button class="w" data-k="a54-pa-declaration">déclaration en Suisse (rôles)</button>. <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », notification et partenaires</a>.</p>
<p><b>Prévention.</b> La SSI demande de dépister le VIH et la syphilis, de discuter la vaccination contre l’hépatite B chez tous les patients et contre l’hépatite A chez les HSH, d’envisager la prophylaxie préexposition au VIH chez les personnes à haut risque, de discuter la vaccination contre le papillomavirus et de rappeler l’utilité du préservatif. La réinfection reste possible après guérison. <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », autres IST</a>.</p>
<div class="key"><b>À retenir.</b> Contrôle à sept jours ; partenaires des deux ou trois derniers mois ; une semaine sans rapports ; déclaration complémentaire au médecin cantonal.</div></section>

<section class="ilot" id="a54-pa-11"><h2><span class="n">11</span>Situations particulières</h2>
<p><b>Grossesse et allaitement.</b> La gonococcie se traite aussi pendant la grossesse, car elle expose à la prématurité et à l’ophtalmie néonatale. La directive européenne retient la ceftriaxone 1 g et proscrit fluoroquinolones et tétracyclines. Les informations professionnelles suisses ajoutent deux contraintes : la ceftriaxone ne s’administre pendant la grossesse que si elle est formellement indiquée, et l’injection intramusculaire préparée avec la lidocaïne y est contre-indiquée selon l’information de Rocephin®. Pendant l’allaitement, elles demandent d’interrompre l’allaitement si le traitement est indispensable. La <button class="w" data-k="a54-pa-grossesse">conduite pendant la grossesse (sources comparées)</button> détaille ces points. <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, grossesse</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44625" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rocephin®, Swissmedic (AIPS), juin 2025, consultée le 08.10.2026</a>.</p>
<p><b>Nouveau-né.</b> L’ophtalmie gonococcique néonatale se traite par irrigation oculaire fréquente et par ceftriaxone 25 à 50 mg/kg en dose unique, sans dépasser 125 mg, selon la directive européenne. La ceftriaxone est contre-indiquée chez le nouveau-né qui reçoit des solutions intraveineuses contenant du calcium, chez le prématuré jusqu’à 41 semaines d’âge post-menstruel et en cas d’hyperbilirubinémie. <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, ophtalmie néonatale</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44625" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rocephin®, contre-indications</a>.</p>
<p><b>Personne vivant avec le VIH.</b> Elle est traitée de façon identique. <b>Insuffisance rénale ou hépatique.</b> Aucune adaptation de la ceftriaxone n’est nécessaire si l’autre fonction est conservée ; la dose quotidienne ne dépasse pas 2 g si la clairance de la créatinine est inférieure à 10 mL/min, ce qui n’affecte pas la dose unique de 1 g. La gentamicine, elle, s’adapte à la fonction rénale. <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ceftriaxon Labatec®, juin 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33380" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Gentamicine AApot®, août 2024</a>.</p>
<p><b>Retour au cas.</b> M. N. n’a ni fièvre, ni douleur scrotale, ni signe articulaire ou oculaire à l’examen. Le médecin prélève le premier jet d’urine pour PCR gonocoque et chlamydia, une culture de l’écoulement avant l’antibiotique et un écouvillon pharyngé. Si l’écoulement est purulent et typique, il traite juste après les prélèvements : pour cette urétrite encore non attribuée, la directive « Urétrite chez l’homme » associe ceftriaxone 1 g et doxycycline 100 mg deux fois par jour, puis adapte au résultat. Sinon, il attend le résultat, M. N. s’abstenant de rapports. Il prescrit les sérologies VIH et syphilis, vérifie la vaccination contre l’hépatite B et organise l’information des partenaires et le contrôle à sept jours.</p></section>

<section class="ilot" id="a54-pa-12"><h2><span class="n">12</span>Critères formels du diagnostic et paramètres clés</h2>
<div class="alert"><p><b>Gonococcie établie.</b> Gonocoque identifié dans une sécrétion urogénitale, rectale, oropharyngée ou oculaire : culture positive, PCR positive confirmée, ou diplocoques à Gram négatif intracellulaires dans un frottis urogénital. <b>Infection disséminée</b> selon la SSI : confirmée si culture positive du sang, du liquide synovial ou d’une biopsie cutanée ; probable si culture anogénitale ou pharyngée positive avec des signes cliniques typiques ; possible si signes typiques et bonne réponse au traitement malgré des cultures négatives.</p></div>
<div class="key"><p><b>Paramètres clés.</b> Incubation 1 à 7 jours (SSI). Infections pharyngées et rectales asymptomatiques dans plus de 90 % des cas. Ceftriaxone 1 g intramusculaire en dose unique pour une infection muqueuse ; 1 g intraveineux par jour pendant 7 jours pour une infection disséminée. Contrôle microbiologique à J7 ; nouvelle culture si symptômes au-delà de deux jours. Partenaires des 2 derniers mois (directive « Gonococcie ») ou des 3 derniers mois (directive « Urétrite chez l’homme »). Une semaine sans rapports. Résistance suisse 2024 : quinolones 70 %, azithromycine 21 %.</p></div>
