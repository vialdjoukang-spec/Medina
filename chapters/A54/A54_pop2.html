<template data-pop="a54-sc-pili" data-title="Pili de type IV : l’adhésion initiale">
<div class="lab">Fonction</div><p>Les pili de type IV sont de longs filaments rétractiles de la surface bactérienne. Ils assurent le premier contact avec la cellule épithéliale et rapprochent les bactéries en microcolonies.</p>
<div class="lab">Preuve expérimentale</div><p>Dans un modèle d’épithélium cornéen publié en 2026, seules les souches à pilus fonctionnel adhéraient aux premiers stades ; les microcolonies puis le biofilm détruisaient ensuite le tissu. Un médicament qui provoque la rétraction des pili réduisait l’adhésion seulement s’il était donné en même temps que les bactéries, non après la formation des microcolonies.</p>
<div class="lab">Portée</div><p>Ce modèle in vitro concerne l’œil ; il éclaire le mécanisme de l’adhésion sans fournir de traitement clinique.</p>
<div class="src">Source : Kafuri et al., Infect Immun 2026, doi 10.1128/iai.00735-25 (résumé PubMed lu le 8 octobre 2026).</div></template>

<template data-pop="a54-sc-opa" data-title="Protéines Opa : variation de phase et récepteurs CEACAM">
<div class="lab">Définition</div><p>Les protéines d’opacité sont des adhésines et invasines de la membrane externe. Le gonocoque en possède une famille dont chaque membre s’allume ou s’éteint de façon indépendante : c’est la variation de phase.</p>
<div class="lab">Récepteurs</div><p>La plupart des Opa se lient aux récepteurs humains CEACAM, qui favorisent l’attachement et l’entrée dans la cellule. Les neutrophiles portent CEACAM1 et CEACAM3 ; une Opa qui lie CEACAM3 expose la bactérie à la phagocytose.</p>
<div class="src">Source : Alcott et al., J Bacteriol 2022, doi 10.1128/jb.00035-22 (résumé PubMed lu le 8 octobre 2026).</div></template>

<template data-pop="a54-sc-neutrophiles" data-title="Neutrophiles : origine du pus et survie du gonocoque">
<div class="lab">Recrutement</div><p>Au contact du gonocoque, l’épithélium urétral libère des cytokines qui attirent les polynucléaires neutrophiles. Dans un modèle cornéen, l’infection augmentait l’IL-8 et le TNF-α. Neutrophiles et débris cellulaires forment l’écoulement purulent.</p>
<div class="lab">Survie bactérienne</div><p>Des gonocoques viables persistent pourtant dans le pus. Les souches exprimant une Opa liant CEACAM3 étaient davantage associées aux neutrophiles, internalisées et tuées ; une fois internalisées, toutes les souches étaient tuées de façon semblable. La capacité de liaison non opsonique décide donc surtout de la survie.</p>
<div class="lab">Conséquence clinique</div><p>Le pus traduit la réponse de l’hôte, non l’identité du germe : une urétrite à chlamydia peut produire un écoulement semblable. Seul le laboratoire identifie l’agent.</p>
<div class="src">Sources : Edwards et Apicella, Clin Microbiol Rev 2004 ; Kafuri et al., Infect Immun 2026 ; Alcott et al., J Bacteriol 2022 (résumés PubMed lus le 8 octobre 2026) ; SSI, « Gonococcie », clinique.</div></template>

<template data-pop="a54-sc-variation" data-title="Variation antigénique de PilE : pourquoi la réinfection est possible">
<div class="lab">Mécanisme</div><p>La piline majeure PilE change de séquence par un système de recombinaison programmée. Cette variation exige une structure d’ADN non canonique, un quadruplexe de guanines ; des modifications importantes de ses boucles réduisent ou abolissent la variation. La stabilité thermique de la structure corrélait avec l’efficacité de la variation.</p>
<div class="lab">Conséquence</div><p>Le pilus présente des variants successifs. Avec la variation de phase des Opa, cette plasticité de surface accompagne l’absence de protection durable après une infection : la prévention ne peut compter sur une immunité acquise.</p>
<div class="src">Sources : Prister et al., Biochemistry 2020, doi 10.1021/acs.biochem.9b01038 ; Alcott et al., J Bacteriol 2022 (résumés PubMed lus le 8 octobre 2026).</div></template>

<template data-pop="a54-sc-dgi" data-title="Dissémination : un mécanisme proposé">
<div class="lab">Étude</div><p>Cinq paires d’isolats, l’un du col ou de l’urètre et l’autre du sang du même patient, étaient génétiquement identiques. En culture, les isolats sanguins s’agrégeaient moins et traversaient plus efficacement un épithélium polarisé ; ils recrutaient moins souvent les récepteurs CEACAM.</p>
<div class="lab">Interprétation</div><p>Les auteurs proposent que l’extinction des Opa liant CEACAM réduise l’agrégation et favorise le passage vers le sang. Le petit effectif et le modèle in vitro interdisent d’en tirer un test de risque.</p>
<div class="src">Source : Wu et al., Pathogens 2022, doi 10.3390/pathogens11020217 (résumé PubMed lu le 8 octobre 2026).</div></template>

<template data-pop="a54-sc-pena" data-title="Allèles mosaïques de penA : la résistance à la ceftriaxone">
<div class="lab">Mécanisme</div><p>Le gène <i>penA</i> code la PBP2, enzyme de la synthèse du peptidoglycane et cible de la ceftriaxone. Les variants mosaïques modifient cette protéine et diminuent la sensibilité à la ceftriaxone.</p>
<div class="lab">Données européennes</div><p>Selon l’ECDC, la résistance des souches européennes de 2025 et 2026 tient surtout aux allèles <i>penA</i> 60.001 et 237.001, souvent associés à des mutations de résistance aux quinolones et parfois aux macrolides. Les CMI de ceftriaxone allaient de 0,19 à 0,38 mg/L, jusqu’à 1,0 mg/L.</p>
<div class="lab">Limite diagnostique</div><p>Dans 1102 isolats américains de 2000 à 2013, l’allèle mosaïque principal et ses dérivés expliquaient 91 % des sensibilités diminuées à la ceftriaxone ; d’autres mécanismes rendaient compte du reste. La surveillance phénotypique par culture reste donc indispensable.</p>
<div class="src">Sources : ECDC, évaluation du risque du 16 juillet 2026 ; Grad et al., J Infect Dis 2016, doi 10.1093/infdis/jiw420 (résumé PubMed lu le 8 octobre 2026).</div></template>

<template data-pop="a54-sc-gyra" data-title="Gyrase et résistance aux quinolones">
<div class="lab">Cible</div><p>La ciprofloxacine inhibe l’ADN gyrase et la topo-isomérase IV, deux enzymes de la réplication, de la transcription et de la réparation de l’ADN bactérien. Son effet est bactéricide.</p>
<div class="lab">Résistance</div><p>Selon l’information professionnelle suisse, la résistance se constitue par mutations successives de ces enzymes : une mutation isolée donne rarement une résistance clinique, plusieurs mutations la rendent large. Chez le gonocoque, la résistance aux quinolones s’est diffusée de façon clonale ; en Suisse, 70 % des souches surveillées en 2024 y résistaient.</p>
<div class="lab">Conséquence</div><p>La ciprofloxacine n’est utilisée qu’après preuve de sensibilité, par antibiogramme ou par test moléculaire validé de la gyrase sur un prélèvement anogénital.</p>
<div class="src">Sources : Information professionnelle suisse Ciproxine®, Swissmedic (AIPS), août 2025 ; Grad et al., J Infect Dis 2016 ; OFSP, Bulletin 44/2025 ; IUSTI, directive européenne 2020.</div></template>

<template data-pop="a54-sc-23s" data-title="ARN ribosomique 23S et résistance à l’azithromycine">
<div class="lab">Cible</div><p>L’azithromycine se fixe sur l’ARN ribosomique 23S de la sous-unité 50S et freine la synthèse des protéines.</p>
<div class="lab">Une résistance polygénique</div><p>Une étude d’association pangénomique de 14 727 génomes provenant de 66 pays a retrouvé les mutations classiques de l’ARN ribosomique 23S aux positions 2059 et 2611, mais aussi 113 variants associés à des CMI élevées : protéines ribosomiques du tunnel de sortie du peptide, porine PorB et système d’efflux Mtr. Les variants qui modifient l’entrée ou la sortie du médicament agissent en synergie avec ceux qui modifient la cible.</p>
<div class="lab">Conséquence</div><p>Un test qui ne recherche que deux mutations 23S peut méconnaître une résistance ; en Suisse, 21 % des souches de 2024 résistaient à l’azithromycine.</p>
<div class="src">Sources : Shaskolskiy et al., Int J Mol Sci 2026, doi 10.3390/ijms27052258 (résumé PubMed lu le 8 octobre 2026) ; Information professionnelle suisse Zithromax®, Swissmedic (AIPS), mars 2023 ; OFSP, Bulletin 44/2025.</div></template>

<template data-pop="pareto-a54-sciences" data-title="Loi de Pareto — Sciences fondamentales">
<p class="ratio" data-cover="a54-s-anat-body,a54-s-micro-body,a54-s-immuno-body,a54-s-gen-body"></p><ul><li>Urètre : récepteur de l’asialoglycoprotéine, cytokines, neutrophiles, écoulement ; endocol : récepteur 3 du complément, infection silencieuse.</li><li>Trompe : cellules ciliées détruites par le TNF-α ; risque d’infertilité et de grossesse extra-utérine.</li><li>Diplocoque à Gram négatif intracellulaire, strictement humain, fragile ; commensales pharyngées sources de faux positifs.</li><li>Variation de PilE et des Opa : pas d’immunité protectrice, réinfection fréquente, aucun vaccin.</li><li>Ceftriaxone : PBP2, résistance par <i>penA</i> mosaïque ; quinolones : gyrase ; azithromycine : résistance polygénique.</li><li>Ceftriaxone : demi-vie 8 heures, élimination rénale et biliaire, injection unique suffisante contre une souche sensible.</li></ul></template>
