<div class="lab">Ce que montre le cas</div><p>Brûlure en urinant et écoulement traduisent une inflammation urétrale possible. Une exposition cinq jours auparavant se situe dans l’intervalle d’incubation de un à sept jours indiqué par la SSI pour la gonococcie, mais la chronologie ne prouve ni la source ni l’agent. La SSI souligne la ressemblance clinique des urétrites gonococciques et à chlamydia.</p>
<div class="lab">Ce qui manque</div><p>Il faut préciser l’aspect de l’écoulement, rechercher les signes de complication, obtenir une amplification d’acides nucléiques et si possible une culture avant antibiotique. Pour une urétrite masculine, la SSI du 13 juin 2024 recommande d’attendre la bactérie identifiée si l’état le permet ; les symptômes sévères justifient un traitement empirique après prélèvements couvrant gonocoque et chlamydia. Le tableau de M. N. ne précise ni la purulence ni la sévérité.</p>
<div class="src">Sources primaires : <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », traitement, validée le 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », clinique et diagnostic, validée le 8 mai 2024</a>, lues le 8 octobre 2026.</div></template>

<template data-pop="pareto-a54-bases" data-title="Loi de Pareto — Reconnaître et confirmer la gonococcie">
<p class="ratio" data-cover="a54-pa-0,a54-pa-1,a54-pa-2,a54-pa-3,a54-pa-4,a54-pa-5,a54-pa-6,a54-pa-7"></p><ul><li>Le gonocoque infecte urètre, col, rectum, pharynx et conjonctive ; il peut monter vers l’épididyme et les trompes ou diffuser par le sang.</li><li>Suisse 2024 : 6805 cas, 75,6 pour 100 000, hommes 83 % ; hausse surtout liée au dépistage.</li><li>Homme : écoulement chez plus de 80 %, dysurie chez plus de 50 %, deux à huit jours après l’exposition. Femme : asymptomatique dans environ la moitié des infections du col.</li><li>Pharynx et rectum : plus de 90 % d’infections silencieuses ; le site prélevé suit les pratiques.</li><li>PCR des sites exposés pour détecter ; culture préthérapeutique pour l’antibiogramme ; recherche de chlamydia, syphilis, VIH et hépatite B.</li></ul></template>

<template data-pop="a54-pa-coinfection" data-title="Chlamydia et gonocoque : deux diagnostics à tester">
<div class="lab">Cause du piège</div><p><i>C. trachomatis</i> et <i>N. gonorrhoeae</i> peuvent produire une urétrite ressemblante ; une coinfection est possible. La seule couleur d’un écoulement ou le délai depuis un rapport ne sépare pas sûrement les deux. Une PCR combinée ou des tests adaptés aux deux agents répondent à cette question selon le laboratoire.</p>
<div class="lab">Conséquence thérapeutique</div><p>Un résultat positif pour l’un ne démontre pas que l’autre est présent ou absent. Le choix antibiotique doit tenir compte des résultats, du tableau et de la directive applicable. Les sérologies VIH et syphilis et la vérification de la protection VHB répondent à d’autres risques et ne sont pas remplacées par le test urétral.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, étiologie, clinique, diagnostic et aspects généraux</a>.</div></template>

<template data-pop="a54-pa-complications" data-title="Complications : le site change la conduite">
<div class="lab">Extension génitale haute</div><p>Chez la femme, l’ascension produit la maladie inflammatoire pelvienne, qui expose à la grossesse extra-utérine et à l’infertilité ; chez l’homme, elle produit l’épididymo-orchite. La directive européenne renvoie ces deux tableaux à leurs directives propres, car les germes associés et la durée du traitement diffèrent de la forme muqueuse.</p><div class="lab">Grossesse, œil et nouveau-né</div><p>Pendant la grossesse, la SSI cite rupture prématurée des membranes, accouchement prématuré, avortement septique et chorioamniotite. L’œil infecté se traite par irrigation fréquente au sérum physiologique et antibiothérapie ; l’ophtalmie du nouveau-né a son schéma pondéral propre.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », validée le 8 mai 2024</a>, clinique ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, complications, conjonctivite et ophtalmie néonatale.</div></template>

<template data-pop="a54-pa-dgi" data-title="Gonococcie disséminée : peau, tendons et articulations">
<div class="lab">Mécanisme et signes</div><p>La diffusion sanguine du gonocoque peut atteindre peau, gaines tendineuses et articulations. La SSI décrit des pustules parfois nécrotiques aux extrémités, des ténosynovites et une mono- ou polyarthrite, dont une arthrite purulente. Une fièvre avec douleur articulaire, gonflement ou lésion cutanée demande une évaluation urgente ; méningite et endocardite sont des formes plus rares et sévères.</p>
<div class="lab">Preuve et limite</div><p>Selon la SSI, une culture positive du sang, du liquide synovial ou d’une biopsie cutanée peut confirmer la dissémination. Une culture muqueuse positive associée à des signes typiques soutient un diagnostic probable ; elle ne suffit pas à elle seule. M. N. n’a pas de douleur articulaire signalée, mais la question doit être posée.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, section « Gonococcémie disséminée », critères diagnostiques</a>.</div></template>

<template data-pop="pareto-a54-gravite" data-title="Loi de Pareto — Reconnaître une forme grave">
<p class="ratio" data-cover="a54-pa-8"></p><ul><li>Fièvre, arthrite, ténosynovite ou pustules des extrémités : infection disséminée, hospitalisation et cultures.</li><li>Souffle ou syndrome méningé : endocardite ou méningite, rares et graves.</li><li>Œil purulent : irrigation et traitement sans délai.</li><li>Douleur pelvienne ou scrotale : atteinte haute ; la maladie inflammatoire pelvienne expose à l’infertilité et à la grossesse extra-utérine.</li></ul></template>

<template data-pop="a54-pa-triage" data-title="Triage : symptômes à demander et actions à déclencher">
<div class="lab">Questionner et examiner</div><p>Fièvre, altération de l’état général, douleur testiculaire ou pelvienne, articulation chaude ou douloureuse, pustules et symptômes oculaires orientent vers une forme compliquée. L’histoire et l’examen confirment où se situe le problème ; ils n’identifient pas à eux seuls le gonocoque.</p>
<div class="lab">Décision</div><p>Une articulation possiblement septique, une atteinte oculaire marquée ou un état fébrile avec suspicion de dissémination exige une évaluation urgente, des prélèvements appropriés et souvent un avis spécialisé. Une urétrite isolée stable peut suivre le circuit ambulatoire de prélèvements et résultat.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique, diagnostic et gonococcémie disséminée</a>.</div></template>

<template data-pop="a54-pa-pcr" data-title="Amplification d’acides nucléiques : confirmer par site">
<div class="lab">Ce que mesure le test</div><p>La méthode d’amplification, souvent nommée PCR, détecte les acides nucléiques du gonocoque ; selon la SSI, elle est plus sensible que la culture sur les sites utilisés. Chez un homme avec urétrite, le premier jet d’urine est approprié ; volume et délai depuis la dernière miction suivent la procédure du laboratoire et la directive d’urétrite masculine. Des écouvillons pharyngés ou rectaux sont ajoutés selon les expositions.</p>
<div class="lab">Ce qu’elle ne dit pas</div><p>Le résultat appartient au site prélevé. Une amplification positive ne fournit généralement pas la sensibilité aux antibiotiques et, peu après un traitement, peut demander une interprétation du délai. L’amplification ne remplace donc pas toujours une culture réalisable.</p>
<div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, gonococcie, 8 mai 2024, diagnostic et transport</a> ; <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, urétrite masculine, 13 juin 2024, prélèvements</a>.</div></template>

<template data-pop="a54-pa-culture" data-title="Culture : préserver la preuve de sensibilité">
<div class="lab">Pourquoi la faire avant l’antibiotique</div><p>La culture récupère la bactérie vivante et permet l’antibiogramme ; une PCR seule ne dit pas si une souche résiste à une molécule. Le prélèvement de l’écoulement pathologique est idéalement pris avant traitement. La SSI demande un transport rapide vers le laboratoire avec le milieu convenu : le gonocoque fragile peut ne plus pousser si le prélèvement est mal conservé.</p>
<div class="lab">Interpréter l’échec de culture</div><p>Une culture négative après antibiotique ou problème de transport n’écarte pas automatiquement une infection détectée par amplification. Si les symptômes persistent plus de deux jours après traitement, la SSI recommande un nouveau prélèvement pour culture et recherche de résistance.</p>
<div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic, transport et suivi thérapeutique</a>.</div></template>

<template data-pop="a54-pa-resistance" data-title="Résistance suisse : données de population, pas antibiogramme individuel">
<div class="lab">Données datées</div><p>Le Bulletin OFSP 44/2025 rapporte les données ANRESIS pour l’année 2024 : résistance aux quinolones de 70 % et à l’azithromycine de 21 %. Il signale aussi des résistances aux céphalosporines orales et renvoie à la SSI pour l’usage de la ceftriaxone à dose élevée. Ces chiffres décrivent les souches surveillées en Suisse et au Liechtenstein en 2024, avec les limites propres à une surveillance, et non un résultat de M. N. en 2026.</p>
<div class="lab">Effet sur la décision</div><p>Une fluoroquinolone n’est pas choisie empiriquement sur la seule présomption de gonococcie. La culture et la sensibilité de l’isolat deviennent particulièrement utiles en cas de traitement alternatif, de réponse insuffisante ou de suspicion d’échec.</p>
<div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025, « La gonorrhée en Suisse et au Liechtenstein en 2024 », rubrique « Résistance aux antibiotiques »</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic et traitement</a>.</div></template>

<template data-pop="a54-pa-ceftriaxone" data-title="Ceftriaxone 1 g : recommandation suisse et information produit">
<div class="lab">Recommandation clinique suisse</div><p>Pour l’urétrite et les infections gonococciques vaginales, anales ou oropharyngées, la SSI indique ceftriaxone 1 g en une injection intramusculaire, éventuellement dissoute dans 4 mL de lidocaïne 1 % ; la voie intraveineuse est possible. L’OFSP rappelle que la ceftriaxone est le seul antibiotique de première ligne et qu’elle doit être prescrite à dose élevée pour prévenir les résistances.</p><div class="lab">Information professionnelle suisse</div><p>Les informations de Ceftriaxon Labatec®, Ceftriaxon Lagap® et Rocephin® (toutes mises à jour en juin 2025) indiquent pour la blennorragie une injection unique de 0,25 g par voie intramusculaire. Elles demandent aussi le respect des recommandations officielles d’emploi des antibiotiques. Le flacon de 1 g se dissout dans 3,5 mL de lidocaïne 1 % pour l’injection intramusculaire, 1 g au plus par site ; la solution avec lidocaïne ne doit jamais être injectée par voie intraveineuse.</p><div class="lab">Arbitrage</div><p>La dose clinique suit la directive suisse spécifique et l’OFSP (1 g) ; la préparation suit l’information du produit délivré. L’écart de dose est détaillé dans l’onglet Pharmacologie.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », validée le 8 mai 2024</a>, traitement ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025</a>, résistance ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ceftriaxon Labatec®, Swissmedic (AIPS), juin 2025, consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44625" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rocephin®, Swissmedic (AIPS), juin 2025, consultée le 08.10.2026</a>.</div></template>

<template data-pop="a54-pa-autres-antibiotiques" data-title="Alternatives : allergie certifiée ou sensibilité démontrée">
<div class="lab">Options de la SSI</div><p>Seulement en cas d’allergie sévère et certifiée aux céphalosporines : gentamicine 240 mg intramusculaire et azithromycine 2 g en dose unique, avec contrôle au moins clinique du succès. Si les injections intramusculaires sont contre-indiquées : céfixime 400 mg et azithromycine 2 g. Selon l’antibiogramme : ciprofloxacine 500 mg en prise orale unique si la souche y est sensible.</p><div class="lab">Concordance avec l’information professionnelle suisse</div><p>Gentamicine AApot® : dose unique de 240 à 280 mg par voie intramusculaire dans l’urétrite gonococcique, avec adaptation à la fonction rénale. Ciproxine® : 500 mg en dose unique dans l’urétrite et la cervicite gonococciques, seulement si une résistance a pu être exclue, la plupart des souches suisses étant résistantes. Zithromax® : l’indication se limite à la chlamydia, à 1 g, et demande d’exclure une gonococcie concomitante ; l’azithromycine 2 g des associations est donc hors indication suisse. Le corpus AIPS du 08.10.2026 ne contient aucune information professionnelle suisse de céfixime : la disponibilité de ce schéma doit être établie avec la pharmacie.</p><div class="lab">Pourquoi pas de substitution empirique</div><p>En 2024, 70 % des souches suisses résistaient aux quinolones et 21 % à l’azithromycine. Toute alternative suppose une culture avec antibiogramme et, idéalement, un avis infectiologique.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », validée le 8 mai 2024</a>, allergie aux céphalosporines ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33380" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Gentamicine AApot®, Swissmedic (AIPS), août 2024, consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47795" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ciproxine®, Swissmedic (AIPS), août 2025, consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=51352" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zithromax®, Swissmedic (AIPS), mars 2023, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025</a>.</div></template>

<template data-pop="pareto-a54-decision" data-title="Loi de Pareto — Traiter, suivre et prévenir">
<p class="ratio" data-cover="a54-pa-9,a54-pa-10,a54-pa-11"></p><ul><li>Forme muqueuse : ceftriaxone 1 g intramusculaire en dose unique (SSI) ; jamais de quinolone ni d’azithromycine empiriques (résistance suisse 70 % et 21 %).</li><li>Urétrite masculine sévère d’agent inconnu : ceftriaxone 1 g et doxycycline 100 mg deux fois par jour pendant 7 jours, puis adaptation.</li><li>Infection disséminée : ceftriaxone 1 g intraveineux par jour pendant 7 jours.</li><li>Contrôle microbiologique à J7 ; culture si symptômes au-delà de deux jours.</li><li>Partenaires des deux ou trois derniers mois ; une semaine sans rapports ; déclaration complémentaire au médecin cantonal.</li><li>Grossesse : ceftriaxone sans lidocaïne intramusculaire selon l’information Rocephin® ; ni quinolone ni tétracycline.</li></ul></template>

<template data-pop="a54-pa-controle" data-title="Contrôle de guérison : calendrier suisse et calendrier européen">
<div class="lab">Recommandation suisse retenue</div><p>La SSI recommande un contrôle microbiologique sept jours après le traitement et informe la personne qu’une persistance des symptômes au-delà de deux jours impose un nouveau prélèvement urétral ou urinaire pour culture, à la recherche d’une résistance, puis un avis spécialisé.</p><div class="lab">Directive européenne</div><p>L’IUSTI recommande un contrôle de guérison dans tous les cas. En cas de symptômes persistants, une culture est faite trois à sept jours après la fin du traitement, complétée une semaine plus tard par une PCR si la culture est négative. Chez une personne asymptomatique, la PCR de contrôle se fait deux semaines après le traitement. Un contrôle positif peut traduire un échec, une réinfection ou, avec la PCR, de l’acide nucléique résiduel de gonocoques non viables.</p><div class="lab">Arbitrage</div><p>Les deux textes exigent un contrôle. La directive suisse de 2024 est la plus récente et s’applique en Suisse : le rendez-vous a lieu à J7. Une PCR positive précoce est alors interprétée avec prudence, en recherchant une culture avant de conclure à une résistance.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », validée le 8 mai 2024</a>, traitement ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, suivi et contrôle de guérison.</div></template>

<template data-pop="a54-pa-partenaires" data-title="Partenaires : trois textes, deux délais">
<div class="lab">Directives suisses</div><p>La SSI « Gonococcie » (8 mai 2024) demande d’informer, de tester et de traiter immédiatement les partenaires des <b>deux derniers mois</b> et d’éviter les rapports, y compris oraux, pendant une semaine après le début du traitement. La SSI « Urétrite chez l’homme » (13 juin 2024) retient les <b>trois derniers mois</b> pour le gonocoque, de préférence avec traitement simultané au même schéma, et demande d’éviter tout rapport avec un partenaire non traité.</p><div class="lab">Directive européenne</div><p>L’IUSTI 2020 retient aussi les contacts des trois mois précédant les symptômes ou le diagnostic. Elle conseille l’abstinence pendant sept jours après une monothérapie par ceftriaxone, et jusqu’à la guérison des symptômes.</p><div class="lab">Arbitrage</div><p>Pour une urétrite masculine comme celle de M. N., le texte suisse le plus récent et spécifique s’applique : trois mois. Le délai de deux mois reste celui de la directive générale « Gonococcie ». La notification est confidentielle et sans jugement.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », validée le 13 juin 2024</a>, partenaires ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », validée le 8 mai 2024</a>, traitement des partenaires ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, notification des contacts.</div></template>

<template data-pop="a54-pa-declaration" data-title="Déclaration suisse : qui envoie le complément clinique ?">
<div class="lab">Deux formulations SSI</div><p>La directive « Gonococcie » validée le 8 mai 2024 rappelle de ne pas oublier l’annonce complémentaire au médecin cantonal, mais indique aussi qu’après un résultat de laboratoire positif le médecin cantonal enverrait automatiquement la déclaration complémentaire. La directive « Urétrite chez l’homme » validée le 13 juin 2024, plus récente et directement applicable à M. N., sépare explicitement les responsabilités : le laboratoire déclare le gonocoque à l’OFSP ; le praticien qui a prescrit le test envoie le <b>formulaire clinique complémentaire au médecin cantonal</b>.</p>
<div class="lab">Action pour M. N.</div><p>Si un test gonococcique est positif, le praticien vérifie l’annonce du laboratoire, remplit et transmet le formulaire clinique complémentaire au médecin cantonal, en corrélant les données cliniques avec la déclaration anonymisée du laboratoire. Il ne suppose pas que l’envoi est automatique. Les données agrégées alimentent la surveillance ; le Bulletin OFSP 44/2025 décrit l’année 2024 et ne donne ni le statut infectieux ni l’antibiogramme de M. N.</p>
<div class="src">Textes primaires consultés : <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », « Notification à l’OFSP », validée le 13 juin 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », « Diagnostic », validée le 8 mai 2024</a>. Surveillance : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025</a>.</div></template>

<template data-pop="a54-pa-sources" data-title="Sources A54 : rôle, date et limites">
<div class="lab">Sources cliniques suisses</div><p>La SSI « Gonococcie » a été révisée en 2021 et validée le 8 mai 2024 ; elle fixe le diagnostic, le traitement et le suivi. La SSI « Urétrite chez l’homme », validée le 13 juin 2024, règle la démarche syndromique, la déclaration et le délai des partenaires pour l’urétrite masculine. Le Bulletin OFSP 44/2025 publie l’épidémiologie et la résistance de 2024.</p><div class="lab">Sources européennes</div><p>La directive IUSTI 2020 (Unemo et al.) est la directive européenne de référence citée par la SSI ; elle sert ici aux fréquences cliniques, aux performances des tests, aux situations particulières et aux comparaisons. L’ECDC (16 juillet 2026) décrit la diffusion européenne des souches résistantes à la ceftriaxone.</p><div class="lab">Médicaments et lacune</div><p>Doses et contre-indications sont vérifiées dans les informations professionnelles suisses (AIPS du 08.10.2026). Les recommandations de traitement des IST de la Commission fédérale pour la santé sexuelle, citées par la SSI (Forum Médical Suisse 2017), n’ont pas pu être lues ; la SSI 2024, qui les intègre, est la référence suisse retenue.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », validée le 8 mai 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/3988/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Urétrite chez l’homme », validée le 13 juin 2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025</a> ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/ra-ceftriaxone-neisseria-gonorrhoeae.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, évaluation du risque du 16 juillet 2026</a>.</div></template>

<template data-pop="a54-pa-epid" data-title="Gonorrhée en Suisse en 2024 : chiffres et limites">
<div class="lab">Chiffres déclarés</div><p>6805 cas (déclarations tardives incluses jusqu’au 17 février 2025), soit 75,6 pour 100 000 personnes et 11,6 % de plus qu’en 2023. Hommes : 83,3 %. Voie inconnue pour 30,2 % des cas ; parmi les voies connues, 58,3 % de rapports entre hommes, 26,2 % de rapports hétérosexuels avec une femme, 14,9 % avec un homme et 0,3 % entre femmes. Âge médian : 35 ans chez les HSH, 31 ans chez les hommes infectés par voie hétérosexuelle, 26 ans chez les femmes.</p><div class="lab">Lecture</div><p>Les HSH représentent environ 3 % de la population masculine sexuellement active, mais 68,8 % des hommes dont la voie est connue : ils sont donc particulièrement touchés. L’OFSP attribue la hausse surtout à l’accroissement des tests et juge le rôle des relations hétérosexuelles tarifées probablement sous-déclaré. Les incidences les plus élevées concernent les régions de Zurich et lémanique.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025</a>, « La gonorrhée en Suisse et au Liechtenstein en 2024 ».</div></template>

<template data-pop="a54-pa-arbitrage" data-title="Monothérapie suisse ou bithérapie européenne : arbitrage par la source la plus récente">
<div class="lab">Directive européenne IUSTI 2020</div><p>Quand la sensibilité est inconnue, l’IUSTI recommande ceftriaxone 1 g intramusculaire et azithromycine 2 g par voie orale en dose unique. La monothérapie par ceftriaxone 1 g n’y est admise que si quatre conditions sont réunies : absence documentée de résistance locale à la ceftriaxone, contrôle de guérison obligatoire, retour probable du patient pour ce contrôle, et doxycycline associée si la chlamydia n’est pas exclue.</p><div class="lab">Directive suisse SSI 2024</div><p>La SSI, validée le 8 mai 2024, retient la ceftriaxone 1 g seule et demande de prévenir les résistances par la culture avec antibiogramme, la dose de 1 g et la vérification de la réponse clinique à la monothérapie. Elle prévoit aussi le contrôle microbiologique à J7. L’OFSP 2025 renvoie à ces doses élevées.</p><div class="lab">Choix retenu et raisons</div><p>La source primaire applicable la plus récente est la directive suisse de 2024 : la monothérapie par ceftriaxone 1 g s’applique en Suisse. Deux faits suisses la soutiennent. En 2024, 21 % des gonocoques surveillés résistaient à l’azithromycine. L’information professionnelle suisse de Zithromax® n’indique l’azithromycine que pour l’infection à <i>Chlamydia trachomatis</i>, à 1 g, et demande d’exclure une gonococcie concomitante : la dose de 2 g contre le gonocoque est donc hors indication suisse. L’ECDC 2026 décrit les deux schémas comme premières lignes en Europe.</p><div class="lab">Information produit de la ceftriaxone</div><p>Les informations professionnelles suisses de la ceftriaxone mentionnent encore 0,25 g pour la blennorragie ; cette dose ancienne n’est pas retenue, la SSI et l’OFSP fixant 1 g face aux résistances.</p><div class="src">Sources : <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, traitement ; <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », validée le 8 mai 2024</a>, points importants et traitement ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/jB29Qf2x7Jme/BU_44_25_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Bulletin 44/2025 du 27 octobre 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=51352" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zithromax®, Swissmedic (AIPS), mars 2023, consultée le 08.10.2026</a> ; <a href="https://www.ecdc.europa.eu/sites/default/files/documents/ra-ceftriaxone-neisseria-gonorrhoeae.pdf" target="_blank" rel="noopener" data-reference-source="1">ECDC, évaluation du risque du 16 juillet 2026</a>.</div></template>

<template data-pop="a54-pa-grossesse" data-title="Grossesse et allaitement : sources comparées">
<div class="lab">Pourquoi traiter</div><p>Selon la SSI, la gonococcie pendant la grossesse expose à la rupture prématurée des membranes, à l’accouchement prématuré, à l’avortement septique, à la chorioamniotite et à l’ophtalmie du nouveau-né.</p><div class="lab">Directive européenne</div><p>L’IUSTI recommande ceftriaxone 1 g intramusculaire avec azithromycine 2 g, ou ceftriaxone 1 g seule, et proscrit fluoroquinolones et tétracyclines. La grossesse ne modifie pas significativement l’efficacité du traitement.</p><div class="lab">Information professionnelle suisse</div><p>La ceftriaxone traverse le placenta et ne s’administre pendant la grossesse, surtout au premier trimestre, que si elle est formellement indiquée. L’information de Rocephin® contre-indique l’injection intramusculaire préparée avec lidocaïne pendant la grossesse, car la lidocaïne traverse le placenta : une préparation sans lidocaïne est alors utilisée. Pendant l’allaitement, l’allaitement est interrompu si le traitement est indispensable. La doxycycline ne doit pas être donnée pendant la grossesse sauf nécessité absolue, et la ciprofloxacine n’est pas administrée à la femme enceinte ou allaitante.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2272/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gonococcie », validée le 8 mai 2024</a>, clinique ; <a href="https://iusti.org/wp-content/uploads/2020/10/IUSTI-Gonorrhoea-2020.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI, directive européenne gonorrhée 2020 (Unemo et al., Int J STD AIDS)</a>, grossesse ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44625" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rocephin®, Swissmedic (AIPS), juin 2025, consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=59876" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ceftriaxon Labatec®, Swissmedic (AIPS), juin 2025, consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=65952" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Doxycyclin-Mepha®, Swissmedic (AIPS), février 2024, consultée le 08.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47795" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ciproxine®, Swissmedic (AIPS), août 2025, consultée le 08.10.2026</a>.</div></template>
