<template data-pop="a54-ph-ceftriaxone" data-title="Ceftriaxone : monographie">
<div class="lab">Mécanisme</div><p>Céphalosporine de troisième génération, la ceftriaxone inhibe la synthèse de la paroi bactérienne et exerce un effet bactéricide. Elle reste stable vis-à-vis de la plupart des bêta-lactamases. La moitié des gonocoques étudiés est inhibée à 0,008 mg/L ou moins, 90 % à 0,06 mg/L.</p>
<div class="lab">Pharmacocinétique</div><p>La biodisponibilité intramusculaire est de 100 % ; après 1 g, le pic plasmatique atteint 81 mg/L en deux à trois heures. La liaison à l’albumine atteint 95 %, la demi-vie environ 8 heures. L’élimination est rénale pour 50 à 60 % et biliaire pour 40 à 50 %.</p>
<div class="lab">Posologie dans la gonococcie</div><p>Forme muqueuse : 1 g en dose unique, par voie intramusculaire ou intraveineuse (SSI 2024). Forme disséminée : 1 g par voie intraveineuse toutes les 24 heures pendant 7 jours. L’information professionnelle indique encore 0,25 g pour la blennorragie ; la SSI et l’OFSP retiennent 1 g face aux résistances.</p>
<div class="lab">Contre-indications et effets indésirables</div><p>Hypersensibilité à une céphalosporine ; chez le nouveau-né, calcium intraveineux, prématurité jusqu’à 41 semaines post-menstruelles et hyperbilirubinémie. Effets fréquents : éosinophilie, leucopénie, thrombopénie, diarrhée, exanthème, élévation des enzymes hépatiques. Effets rares mais graves : anaphylaxie, colite à <i>Clostridioides difficile</i>, anémie hémolytique immune.</p>
<div class="lab">Surveillance</div><p>Lors d’une injection préparée avec lidocaïne, le matériel de réanimation reste immédiatement disponible ; le contrôle microbiologique a lieu au septième jour.</p>
<div class="src">Sources : Information professionnelle suisse Rocephin® et Ceftriaxon Labatec®, Swissmedic (AIPS), juin 2025, consultées le 08.10.2026 ; SSI, « Gonococcie », validée le 8 mai 2024 ; OFSP, Bulletin 44/2025. Aucun essai randomisé récent ne compare les schémas face aux résistances actuelles ; la directive européenne fonde ses choix sur des essais anciens, des données pharmacocinétiques, la surveillance et des cas d’échec.</div></template>

<template data-pop="a54-ph-gentamicine" data-title="Gentamicine : monographie">
<div class="lab">Mécanisme</div><p>Aminoside, la gentamicine se lie à la sous-unité 30S du ribosome, inhibe la synthèse des protéines et exerce un effet bactéricide. Sa demi-vie est de 1 à 3 heures si la fonction rénale est normale.</p>
<div class="lab">Place et preuves</div><p>Elle remplace la ceftriaxone en cas d’allergie sévère et certifiée aux céphalosporines, à 240 mg par voie intramusculaire avec azithromycine 2 g. Selon la directive européenne, deux essais randomisés récents ont confirmé une efficacité de 100 % de cette association sur les infections anogénitales et pharyngées ; associée à 1 g d’azithromycine seulement, elle ne guérissait que 90 % des infections rectales et 82 % des infections pharyngées.</p>
<div class="lab">Contre-indications et risques</div><p>Hypersensibilité aux aminosides et myasthénie. Néphrotoxicité et ototoxicité, souvent vestibulaire ; la perte auditive commence par les hautes fréquences et reste généralement irréversible. Le risque est accru chez les porteurs d’une mutation mitochondriale en position 1555 de l’ARN ribosomique 12S. Pendant la grossesse, une surdité congénitale bilatérale irréversible a été rapportée.</p>
<div class="lab">Posologie</div><p>L’information professionnelle indique 240 à 280 mg en dose unique intramusculaire dans l’urétrite gonococcique ; la dose s’adapte à la fonction rénale.</p>
<div class="src">Sources : Information professionnelle suisse Gentamicine AApot®, Swissmedic (AIPS), août 2024, consultée le 08.10.2026 ; SSI, « Gonococcie », allergie ; IUSTI, directive européenne 2020.</div></template>

<template data-pop="a54-ph-azithromycine" data-title="Azithromycine : monographie">
<div class="lab">Mécanisme</div><p>Azalide du groupe des macrolides, l’azithromycine se fixe sur l’ARN ribosomique 23S de la sous-unité 50S et freine la synthèse des protéines.</p>
<div class="lab">Place</div><p>Elle n’est jamais utilisée seule contre le gonocoque : 21 % des souches suisses lui résistaient en 2024. La SSI l’associe à 2 g avec la gentamicine en cas d’allergie aux céphalosporines. La directive européenne précise que 2 g, et non 1 g, guérissent les infections sensibles, pharynx compris.</p>
<div class="lab">Tolérance</div><p>La dose de 2 g provoque plus de troubles digestifs, surtout à jeun. La directive européenne conseille un en-cas avant la prise, ou le fractionnement en 1 g suivi de 1 g six à douze heures plus tard. L’azithromycine allonge l’intervalle QT ; la prudence s’impose avec d’autres médicaments qui l’allongent.</p>
<div class="lab">Statut en Suisse</div><p>L’information professionnelle de Zithromax® n’indique l’azithromycine que pour la chlamydia, à 1 g en dose unique, et demande d’exclure une gonococcie concomitante. L’usage contre le gonocoque est donc hors indication. Pendant la grossesse, elle ne s’emploie qu’en cas de nécessité clinique ; pendant l’allaitement, elle ne s’utilise pas, sauf interruption de l’allaitement.</p>
<div class="src">Sources : Information professionnelle suisse Zithromax®, Swissmedic (AIPS), mars 2023, consultée le 08.10.2026 ; IUSTI, directive européenne 2020 ; SSI, « Gonococcie » ; OFSP, Bulletin 44/2025.</div></template>

<template data-pop="a54-ph-ciprofloxacine" data-title="Ciprofloxacine : monographie">
<div class="lab">Mécanisme</div><p>Fluoroquinolone bactéricide, la ciprofloxacine inhibe l’ADN gyrase et la topo-isomérase IV.</p>
<div class="lab">Place</div><p>Elle n’est prescrite qu’après preuve de sensibilité, par antibiogramme ou par test moléculaire validé de la gyrase sur un prélèvement anogénital : en Suisse, 70 % des souches lui résistaient en 2024. La dose est de 500 mg par voie orale, en prise unique.</p>
<div class="lab">Contre-indications et risques</div><p>Hypersensibilité aux quinolones, grossesse, allaitement, association à la tizanidine ; les enfants et adolescents ne sont pas traités avant la fin de la croissance. Les fluoroquinolones exposent à des effets graves et parfois irréversibles : tendinites et ruptures tendineuses, atteintes nerveuses, anévrisme et dissection aortiques, allongement de l’intervalle QT. La ciprofloxacine inhibe modérément le CYP1A2.</p>
<div class="src">Sources : Information professionnelle suisse Ciproxine®, Swissmedic (AIPS), août 2025, consultée le 08.10.2026 ; IUSTI, directive européenne 2020 ; OFSP, Bulletin 44/2025.</div></template>

<template data-pop="a54-ph-doxycycline" data-title="Doxycycline : monographie">
<div class="lab">Place</div><p>La doxycycline ne traite pas le gonocoque dans ce contexte : elle couvre une co-infection à <i>Chlamydia trachomatis</i>. La SSI l’associe à la ceftriaxone pour l’urétrite masculine sévère d’agent inconnu, à 100 mg deux fois par jour pendant 7 jours, et l’arrête si seul le gonocoque est trouvé.</p>
<div class="lab">Mécanisme</div><p>Tétracycline bactériostatique, elle inhibe la synthèse des protéines bactériennes.</p>
<div class="lab">Précautions</div><p>Elle se prend avec beaucoup de liquide pour éviter l’œsophagite, de préférence pas au coucher. Elle expose à la photosensibilisation. Elle ne se donne pas pendant la grossesse sauf nécessité absolue, ni pendant l’allaitement ; avant 12 ans, elle peut colorer définitivement les dents.</p>
<div class="src">Sources : Information professionnelle suisse Doxycyclin-Mepha®, Swissmedic (AIPS), février 2024, consultée le 08.10.2026 ; SSI, « Urétrite chez l’homme », validée le 13 juin 2024.</div></template>

<template data-pop="a54-ph-cefixime" data-title="Céfixime : un schéma sans information professionnelle suisse">
<div class="lab">Place dans les directives</div><p>La SSI cite le céfixime 400 mg toutes les 12 heures comme relais oral de l’infection disséminée après 24 à 48 heures d’amélioration et un antibiogramme favorable. Elle propose aussi céfixime 400 mg et azithromycine 2 g si les injections intramusculaires sont contre-indiquées.</p>
<div class="lab">Limites</div><p>La directive européenne s’inquiète de l’efficacité du céfixime 400 mg, surtout en monothérapie et au pharynx, à cause des échecs et des résistances. Le corpus des informations professionnelles suisses consulté le 8 octobre 2026 ne contient aucune spécialité de céfixime : sa disponibilité se vérifie auprès de la pharmacie.</p>
<div class="src">Sources : SSI, « Gonococcie », validée le 8 mai 2024 ; IUSTI, directive européenne 2020 ; corpus AIPS local, 8 octobre 2026.</div></template>

<template data-pop="a54-ph-lidocaine" data-title="Lidocaïne du solvant intramusculaire : précautions">
<div class="lab">Rôle</div><p>La lidocaïne rend l’injection intramusculaire de ceftriaxone supportable ; son effet anesthésique local apparaît en quelques minutes et dure 45 à 60 minutes.</p>
<div class="lab">Interdits</div><p>Une solution contenant de la lidocaïne ne s’injecte jamais par voie intraveineuse. L’injection intramusculaire est contre-indiquée en cas d’hypersensibilité à la lidocaïne ou aux anesthésiques locaux de type anilide et, selon l’information de Rocephin®, pendant la grossesse, surtout au premier trimestre.</p>
<div class="lab">Précautions</div><p>La lidocaïne peut provoquer une réaction anaphylactique. Le médecin dispose du matériel de réanimation. Les inhibiteurs du CYP3A4 et du CYP1A2 ralentissent son métabolisme ; ses effets s’additionnent à ceux des antiarythmiques apparentés.</p>
<div class="src">Source : Information professionnelle suisse Rocephin®, Swissmedic (AIPS), juin 2025, consultée le 08.10.2026.</div></template>

<template data-pop="a54-ph-allergie" data-title="Allergie aux bêta-lactamines : conduite">
<div class="lab">Interroger</div><p>Avant l’injection, le médecin demande les réactions antérieures aux céphalosporines, aux pénicillines et aux autres bêta-lactamines, ainsi qu’à la lidocaïne.</p>
<div class="lab">Décider</div><p>Une hypersensibilité connue à une céphalosporine contre-indique la ceftriaxone. Une allergie à la pénicilline augmente le risque, mais la directive européenne souligne une allergie croisée négligeable avec les céphalosporines de troisième génération. La SSI réserve l’alternative aux allergies sévères et certifiées aux céphalosporines : gentamicine 240 mg et azithromycine 2 g, avec contrôle au moins clinique du succès.</p>
<div class="src">Sources : Information professionnelle suisse Ceftriaxon Labatec®, juin 2025 ; IUSTI, directive européenne 2020 ; SSI, « Gonococcie », allergie.</div></template>

<template data-pop="a54-ph-grossesse" data-title="Grossesse : synthèse pratique">
<div class="lab">Pourquoi traiter</div><p>La gonococcie expose à la rupture prématurée des membranes, à l’accouchement prématuré, à l’avortement septique, à la chorioamniotite et à l’ophtalmie du nouveau-né.</p>
<div class="lab">Choix</div><p>La ceftriaxone 1 g reste le traitement ; elle s’administre sans lidocaïne, car l’information de Rocephin® contre-indique l’injection intramusculaire préparée avec lidocaïne pendant la grossesse. Les fluoroquinolones et les tétracyclines sont proscrites ; la gentamicine expose le fœtus à une surdité. La directive européenne admet l’azithromycine 2 g sous surveillance médicale si le bénéfice attendu dépasse le risque.</p>
<div class="src">Sources : SSI, « Gonococcie », clinique ; IUSTI, directive européenne 2020, grossesse ; informations professionnelles suisses Rocephin®, Gentamicine AApot®, Doxycyclin-Mepha®, Ciproxine®, consultées le 08.10.2026.</div></template>

<template data-pop="a54-ph-echec" data-title="Échec thérapeutique suspect : démarche">
<div class="lab">Reconnaître</div><p>Des symptômes qui persistent plus de deux jours après le traitement, ou un contrôle positif, font suspecter un échec. La réinfection reste la première hypothèse, notamment par un partenaire non traité.</p>
<div class="lab">Documenter</div><p>Le médecin prélève les trois sites pour culture et antibiogramme avant tout nouveau traitement et demande un avis spécialisé. La directive européenne demande l’histoire complète des traitements, l’exclusion d’une réinfection et la comparaison génétique des souches avant et après traitement. L’ECDC demande une déclaration rapide de tout échec suspect ou confirmé.</p>
<div class="lab">Traiter</div><p>L’antibiogramme guide le retraitement. La directive européenne propose ceftriaxone 1 g avec azithromycine 2 g si une monothérapie ou une dose plus faible a été donnée, ou gentamicine 240 mg avec azithromycine 2 g. Parmi les échecs britanniques de 2026, deux infections pharyngées ont exigé l’ertapénème.</p>
<div class="src">Sources : SSI, « Gonococcie » et « Urétrite chez l’homme » ; IUSTI, directive européenne 2020 ; ECDC, évaluation du risque du 16 juillet 2026.</div></template>

<template data-pop="pareto-a54-pharmaco" data-title="Loi de Pareto — Pharmacologie">
<p class="ratio" data-cover="a54-p-1,a54-p-2,a54-p-3,a54-p-4,a54-p-5,a54-p-6,a54-p-7,a54-p-8"></p><ul><li>Première ligne unique : ceftriaxone 1 g en dose unique ; disséminée : 1 g par jour pendant 7 jours.</li><li>Intramusculaire avec 3,5 mL de lidocaïne à 1 %, 1 g par site ; jamais de lidocaïne par voie intraveineuse.</li><li>Allergie sévère certifiée aux céphalosporines : gentamicine 240 mg et azithromycine 2 g, hors indication pour l’azithromycine.</li><li>Ciprofloxacine 500 mg seulement si la souche est sensible ; jamais de quinolone ni d’azithromycine seules.</li><li>Doxycycline 100 mg deux fois par jour pendant 7 jours si la chlamydia n’est pas exclue.</li><li>Grossesse : ceftriaxone sans lidocaïne ; ni quinolone, ni tétracycline, ni gentamicine.</li><li>Nouveau-né : pas de calcium intraveineux, pas d’hyperbilirubinémie, pas de prématurité avant 41 semaines.</li><li>Échec suspect : culture des trois sites, avis spécialisé, déclaration ; le pharynx est le site des échecs.</li></ul></template>
