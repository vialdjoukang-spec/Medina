<template data-pop="i27-circulation" data-title="La circulation pulmonaire normale"><p class="lab">Fonction</p><p>Le poumon reçoit tout le débit du ventricule droit, 4 à 8 L/min au repos. Chez le sujet sain couché, la PAPm vaut 14 ± 3 mmHg, valeur indépendante du sexe et de l’origine ; elle dépasse rarement 20 mmHg au repos, même chez le sujet âgé.</p><p class="lab">Mécanisme</p><p>Les artères pulmonaires ont une paroi mince et très compliante. À l’effort, des capillaires fermés s’ouvrent et les vaisseaux ouverts se distendent : la résistance baisse quand le débit monte, et la pression varie peu.</p><div class="key"><b>Conséquence.</b> Une perte de ce réservoir vasculaire se révèle d’abord à l’effort, ce qui explique une dyspnée d’effort longtemps isolée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/19324955/" target="_blank" rel="noopener">Kovacs et al., pression artérielle pulmonaire du sujet sain, revue systématique de 1187 sujets, Eur Respir J 2009</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableau 11</a>.</p></template>
<template data-pop="i27-retard" data-title="Pourquoi le diagnostic est tardif"><p>La dyspnée d’effort, la fatigue et la tachycardie sont attribuées à l’asthme, à l’anxiété, au surpoids ou au déconditionnement. L’examen et la radiographie restent longtemps normaux, car le cœur droit compense. Selon l’ESC/ERS 2022, plus de deux ans séparent encore les premiers symptômes du diagnostic d’HTP.</p><div class="key"><b>Conséquence pratique.</b> Une dyspnée d’effort inexpliquée après un premier bilan justifie une échocardiographie, surtout s’il existe une sclérodermie, une embolie antérieure, une hépatopathie ou un antécédent familial.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 5.3</a>.</p></template>
<template data-pop="i27-seuil20" data-title="Seuil de 20 ou de 25 mmHg : arbitrage des sources"><p class="lab">Source retenue</p><p>ESC/ERS 2022 (août 2022), confirmée par le 7e Symposium mondial (publié en octobre 2024) : HTP si PAPm &gt; 20 mmHg, avec RVP &gt; 2 unités Wood pour le profil précapillaire. Ces textes visent l’adulte.</p><p class="lab">Texte antérieur</p><p>Jusqu’en 2018, le seuil était une PAPm ≥ 25 mmHg. Le 6e Symposium mondial (2018) a proposé une PAPm &gt; 20 mmHg avec des RVP ≥ 3 unités Wood ; l’ESC/ERS 2022 a abaissé ce dernier seuil à 2 unités Wood.</p><p class="lab">Justification</p><p>Chez le sujet sain, la PAPm vaut 14 ± 3 mmHg : 20 mmHg en est la limite supérieure. De grandes cohortes associent déjà une PAPm de 21 à 24 mmHg ou des RVP de 2 à 3 unités Wood à une survie moindre ; le 7e Symposium parle alors d’« HTP précoce ».</p><div class="key"><b>Limite.</b> L’efficacité des médicaments de l’HTAP n’a été démontrée que chez des patients ayant une PAPm ≥ 25 mmHg et des RVP &gt; 3 unités Wood. Un patient entre ces seuils est malade selon la définition, mais son traitement spécifique n’est pas validé : il relève du centre.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, sections 3.1 et 6.3</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19324955/" target="_blank" rel="noopener">Kovacs et al., 2009</a>.</p></template>
<template data-pop="i27-papo" data-title="Pression artérielle pulmonaire d’occlusion"><p class="lab">Technique</p><p>Le ballonnet du cathéter gonflé dans une branche artérielle interrompt le flux. La colonne de sang immobile transmet alors la pression des veines pulmonaires et de l’oreillette gauche. Le zéro est placé à mi-thorax, au niveau de l’oreillette gauche chez le patient couché. On lit la pression en fin d’expiration, sans apnée ; chez l’obèse ou le patient atteint de BPCO, dont les variations respiratoires sont amples, la moyenne de trois à quatre cycles est plus fiable.</p><p class="lab">Valeur</p><p>Une PAPO &gt; 15 mmHg signe une composante postcapillaire : la pression vient du cœur gauche. Entre 12 et 18 mmHg, le 7e Symposium recommande de juger l’ensemble du tableau plutôt que le seul chiffre.</p><div class="key"><b>Piège.</b> Un patient sous diurétiques à forte dose peut avoir une PAPO faussement normale. Une perfusion rapide de 500 mL de sérum salé qui porte la PAPO au-delà de 18 mmHg, ou une épreuve d’effort, démasque alors une insuffisance cardiaque à fraction d’éjection préservée.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 7e Symposium mondial, 2024</a>.</p></template>
<template data-pop="i27-rvp" data-title="Résistances vasculaires pulmonaires"><p class="lab">Calcul</p><p>RVP = (PAPm − PAPO) / débit cardiaque, en unités Wood (mmHg·min/L). Une unité Wood vaut 80 dyn·s·cm⁻⁵.</p><p class="lab">Exemple</p><p>PAPm 45 mmHg, PAPO 10 mmHg, débit 3,5 L/min : RVP = 35 / 3,5 = 10 unités Wood. Chez le sujet normal, les RVP vont de 0,3 à 2,0 unités Wood.</p><div class="key"><b>Intérêt.</b> La résistance isole l’atteinte du lit artériel. Une pression élevée avec un débit élevé, comme dans l’anémie ou un shunt, ne traduit pas forcément une maladie artérielle.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableau 11</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
<template data-pop="i27-effort" data-title="Hypertension pulmonaire d’effort"><p>Elle se définit par une pente PAPm/débit cardiaque supérieure à 3 mmHg/L/min entre repos et effort, mesurée par cathétérisme d’effort. Elle traduit une perte du recrutement vasculaire ou une cardiopathie gauche démasquée par l’effort ; une pente PAPO/débit supérieure à 2 mmHg/L/min oriente vers la seconde. Une pente supérieure à 3 est anormale même chez le sujet très âgé et s’associe à une survie moindre.</p><div class="key"><b>Limite.</b> Cette entité n’est pas une HTAP ; aucun médicament spécifique n’y est validé. Elle justifie une surveillance, notamment dans la sclérodermie.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
<template data-pop="i27-epid" data-title="Épidémiologie européenne et suisse"><p>Selon l’ESC/ERS 2022, l’HTP concerne environ 1 % de la population mondiale. Les cardiopathies gauches en sont la première cause, les maladies respiratoires, surtout la BPCO, la deuxième. L’HTAP compte 6 nouveaux cas et 48 à 55 cas prévalents par million d’adultes ; la forme idiopathique en représente 50 à 60 %. Elle touche de plus en plus des sujets de plus de 65 ans.</p><p>En Suisse, le registre national de l’HTP a inclus 996 patients entre 1998 et 2012, dont 549 HTAP et 249 HTP-TEC ; les patients diagnostiqués récemment étaient plus âgés et moins sévères au plan hémodynamique. Après une embolie pulmonaire, un dépistage prospectif dans 11 centres suisses a trouvé une incidence de 3,7 HTP-TEC pour 1000 patients-années, soit 0,79 % cumulés à deux ans.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 4</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25661477/" target="_blank" rel="noopener">Mueller‑Mottet et al., registre suisse de l’hypertension pulmonaire, Respiration 2015;89:127-140</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29563171/" target="_blank" rel="noopener">Coquoz et al., dépistage de l’HTP-TEC dans 11 centres suisses, Eur Respir J 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
<template data-pop="i27-remodelage" data-title="Le remodelage vasculaire"><p>Les cellules musculaires lisses prolifèrent ; la média s’épaissit et le muscle gagne des artérioles distales qui en étaient presque dépourvues. Des cellules endothéliales et des myofibroblastes comblent l’intima. L’adventice se fibrose et s’enflamme. Les lésions plexiformes, faites de canaux endothéliaux désorganisés, marquent les formes avancées.</p><div class="key"><b>Conséquence.</b> La résistance varie comme l’inverse de la puissance quatrième du rayon : réduire la lumière de moitié multiplie la résistance par seize. D’où l’intérêt de traitements antiprolifératifs.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/39209474/" target="_blank" rel="noopener">Guignabert et al., 2024</a>.</p></template>
<template data-pop="i27-trois-voies" data-title="Les quatre voies thérapeutiques"><table class="t"><tr><th>Voie</th><th>Anomalie</th><th>Médicaments</th></tr><tr><td>Endothéline</td><td>Excès</td><td>Antagonistes des récepteurs</td></tr><tr><td>Monoxyde d’azote</td><td>Déficit</td><td>Inhibiteurs de la phosphodiestérase 5, riociguat</td></tr><tr><td>Prostacycline</td><td>Déficit</td><td>Prostanoïdes, sélexipag</td></tr><tr><td>Activine et BMP</td><td>Déséquilibre prolifératif</td><td>Sotatercept</td></tr></table><p>Chaque ligne explique une classe médicamenteuse : on corrige un excès par un antagoniste et un déficit par un agoniste ou un inhibiteur de la dégradation. Le détail moléculaire figure dans l’onglet Sciences.</p><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/39209476/" target="_blank" rel="noopener">Chin et al., 2024, figure 2</a>.</p></template>
<template data-pop="i27-couplage" data-title="Couplage ventriculo-artériel"><p>Le ventricule droit s’adapte d’abord en augmentant sa contractilité : son volume reste normal. Quand cette réserve s’épuise, il se dilate et utilise la loi de Frank-Starling. La dilatation élargit l’anneau tricuspide et crée une fuite, qui réduit encore le volume éjecté.</p><div class="key"><b>Mesure.</b> Le rapport TAPSE/PAPS estime ce couplage : &lt; 0,19 mm/mmHg traduit un risque élevé selon l’ESC/ERS 2022.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableau 16</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209482/" target="_blank" rel="noopener">Hemnes et al., 2024</a>.</p></template>
<template data-pop="i27-interdependance" data-title="Interdépendance ventriculaire"><p>Les deux ventricules partagent le septum et le péricarde. Un ventricule droit dilaté et sous pression refoule le septum vers la gauche : en échocardiographie, le ventricule gauche prend une forme de « D ». Son remplissage diminue, donc son volume d’éjection baisse.</p><div class="key"><b>Conséquence.</b> Le débit systémique chute alors que le ventricule gauche est sain. Un remplissage vasculaire aggrave ce refoulement : c’est pourquoi la plupart des patients en défaillance droite ont besoin d’un bilan hydrique négatif.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39209482/" target="_blank" rel="noopener">Hemnes et al., 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 6.3.7.1</a>.</p></template>
<template data-pop="i27-hpv" data-title="Vasoconstriction pulmonaire hypoxique"><p class="lab">Mécanisme</p><p>Une alvéole hypoxique fait contracter l’artériole qui la perfuse. Le sang est ainsi détourné vers les alvéoles bien ventilées.</p><p class="lab">Conséquence</p><p>Locale, cette réponse optimise l’oxygénation. Généralisée et prolongée — BPCO, hypoventilation, altitude — elle élève la pression puis s’accompagne d’un remodelage : chez les habitants de haute altitude, la média des artères proximales s’hypertrophie et les artérioles distales se muscularisent.</p><div class="key"><b>Traitement.</b> Corriger l’hypoxémie par l’oxygène lève une partie de la vasoconstriction ; dans la BPCO, l’oxygénothérapie de longue durée ralentit la progression de l’HTP.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39209474/" target="_blank" rel="noopener">Guignabert et al., 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209469/" target="_blank" rel="noopener">Shlobin et al., HTP des maladies respiratoires, 7e Symposium mondial, 2024</a>.</p></template>
<template data-pop="i27-toxiques" data-title="Médicaments et toxiques associés à l’HTAP"><p><b>Association certaine</b> (ESC/ERS 2022 et 7e Symposium mondial 2024) : aminorex, benfluorex, dexfenfluramine, fenfluramine, méthamphétamines, dasatinib, huile de colza frelatée ; ajout en 2024 de la mitomycine C et du carfilzomib.</p><p>L’exposition précède le diagnostic de quelques semaines à plusieurs années. L’atteinte du dasatinib ou de l’interféron peut régresser à l’arrêt ; celle des méthamphétamines, forme la plus fréquente aujourd’hui, ne régresse généralement pas et son pronostic est plus sombre que celui de l’HTAP idiopathique.</p><div class="key"><b>Conséquence pratique.</b> L’anamnèse médicamenteuse remonte des années en arrière, complétée par un dépistage urinaire des stupéfiants ; une HTAP liée à un médicament fait partie des formes testées pour la vasoréactivité.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024, tableau 3</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209476/" target="_blank" rel="noopener">Chin et al., 2024</a>.</p></template>
<template data-pop="i27-depistage" data-title="Dépistage organisé"><p><b>Sclérodermie.</b> Le risque d’HTAP justifie un dépistage annuel ; un algorithme validé est recommandé si la maladie évolue depuis plus de trois ans, avec une capacité vitale forcée ≥ 40 % et une DLCO &lt; 60 %.</p><p><b>Porteurs d’une mutation de BMPR2 et apparentés.</b> Une échocardiographie annuelle est souvent proposée, par consensus d’experts.</p><p><b>Hypertension portale.</b> Une échocardiographie s’impose avant un shunt portosystémique ou une transplantation hépatique, car une HTP sévère accroît le risque opératoire.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 5.3 et tableau 3 des recommandations</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23687283/" target="_blank" rel="noopener">Coghlan et al., algorithme DETECT, Ann Rheum Dis 2014</a>.</p></template>
<template data-pop="i27-dyspnee" data-title="Dyspnée d’effort de l’hypertension pulmonaire"><p>Elle est progressive et survient pour des efforts de plus en plus modestes ; elle ne s’accompagne pas d’orthopnée au début. Le débit fixe limite l’apport d’oxygène ; les zones ventilées mais mal perfusées augmentent l’espace mort et la ventilation nécessaire.</p><div class="key"><b>Piège.</b> L’orthopnée et la dyspnée paroxystique nocturne orientent vers une cardiopathie gauche, donc vers le groupe 2.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 5.1.1 et tableau 14</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
<template data-pop="i27-angor" data-title="Douleur thoracique d’effort"><p>Le ventricule droit hypertrophié consomme plus d’oxygène, alors que sa perfusion coronaire diminue quand sa pression se rapproche de la pression aortique : il devient ischémique. Plus rarement, une artère pulmonaire très dilatée comprime le tronc coronaire gauche.</p><div class="key"><b>Conséquence.</b> Un angor d’effort chez un patient porteur d’HTP justifie une évaluation de la gravité et une recherche de compression coronaire ; celle-ci se traite efficacement par endoprothèse.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 6.3.10.3</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209471/" target="_blank" rel="noopener">Savale et al., 2024</a>.</p></template>
<template data-pop="i27-syncope" data-title="Syncope d’effort"><p>À l’effort, les muscles se vasodilatent. Un cœur sain augmente son débit pour maintenir la pression ; un ventricule droit au débit fixe n’y parvient pas. La pression cérébrale chute brutalement.</p><div class="key"><b>Gravité.</b> Une syncope répétée classe le patient dans le risque élevé de l’ESC/ERS 2022 ; elle impose un adressage urgent. Une syncope isolée lors d’un effort intense compte comme critère intermédiaire.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableau 16</a>.</p></template>
<template data-pop="i27-compressions" data-title="Hémoptysie, dysphonie et toux"><p>Les artères bronchiques hypertrophiées peuvent saigner ; l’hémoptysie est particulièrement fréquente dans l’HTAP héritable et l’HTAP des cardiopathies congénitales. Une artère pulmonaire dilatée peut comprimer le nerf laryngé récurrent gauche entre elle et l’aorte : la voix devient rauque (syndrome d’Ortner).</p><div class="key"><b>Conséquence.</b> Toute hémoptysie impose un angioscanner en phase artérielle. L’ESC/ERS 2022 recommande l’embolisation des artères bronchiques dilatées en cas d’hémoptysie modérée à sévère ou d’épisodes légers répétés, même si la source n’est pas localisée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, sections 6.3.10.2 et 6.3.10.3</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32166017/" target="_blank" rel="noopener">Gupta et al., 2020</a>.</p></template>
<template data-pop="i27-b2" data-title="Composante pulmonaire du deuxième bruit"><p class="lab">Technique</p><p>On ausculte le foyer pulmonaire, au bord gauche du sternum. La composante pulmonaire suit la fermeture aortique ; dans l’HTP, elle devient éclatante.</p><p class="lab">Mécanisme</p><p>La valve pulmonaire se ferme avec force sous une pression diastolique artérielle élevée.</p><div class="key"><b>Valeur.</b> Ce signe précède le souffle d’insuffisance tricuspide des formes avancées, mais reste subjectif ; son absence n’exclut pas une HTP.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
<template data-pop="i27-it" data-title="Souffle d’insuffisance tricuspide"><p>Le souffle holosystolique se perçoit au bord gauche du sternum, dans les formes plus avancées. Il naît de la dilatation de l’anneau tricuspide par un ventricule droit distendu : la valve ne ferme plus, et le sang reflue vers l’oreillette droite à chaque systole.</p><div class="key"><b>Lien.</b> La même fuite permet la mesure échographique de la pression systolique pulmonaire.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26995592/" target="_blank" rel="noopener">Harjola et al., 2016</a>.</p></template>
<template data-pop="i27-jugulaire" data-title="Turgescence jugulaire"><p class="lab">Technique</p><p>Le patient est demi-assis. On observe la pulsation de la veine jugulaire interne et sa hauteur au-dessus de l’angle sternal : une colonne haute traduit une pression veineuse centrale élevée. Une onde systolique ample reflète l’insuffisance tricuspide.</p><p class="lab">Reflux hépatojugulaire</p><p>Une pression abdominale prolongée élève durablement la pulsation quand le ventricule droit ne peut accueillir le surcroît de retour veineux.</p><div class="key"><b>Valeur.</b> Ce signe indique une défaillance droite installée ; il n’indique pas la cause.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
<template data-pop="i27-signes-cause" data-title="Signes orientant vers un groupe"><table class="t"><tr><th>Signe</th><th>Orientation</th></tr><tr><td>Sclérodactylie, télangiectasies, phénomène de Raynaud</td><td>Sclérodermie : groupe 1</td></tr><tr><td>Angiomes stellaires, ascite, splénomégalie</td><td>Hypertension portale : groupe 1</td></tr><tr><td>Cyanose, hippocratisme</td><td>Shunt congénital, maladie respiratoire</td></tr><tr><td>Crépitants secs des bases</td><td>Pneumopathie interstitielle : groupe 3</td></tr><tr><td>Souffle mitral ou aortique, orthopnée</td><td>Cardiopathie gauche : groupe 2</td></tr><tr><td>Obésité, cyphoscoliose, somnolence</td><td>Hypoventilation : groupe 3</td></tr><tr><td>Séquelles de thrombose veineuse</td><td>HTP-TEC : groupe 4</td></tr></table><p>La lecture va du signe à l’hypothèse, jamais au diagnostic : un patient âgé peut cumuler plusieurs causes.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024, étape 1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, sections 5.1.1 et 7.7.1</a>.</p></template>
<template data-pop="i27-echo-proba" data-title="Probabilité échocardiographique d’hypertension pulmonaire"><p class="lab">Vitesse de régurgitation tricuspide</p><p>≤ 2,8 m/s ou non mesurable ; 2,9 à 3,4 m/s ; &gt; 3,4 m/s.</p><p class="lab">Signes indirects (trois catégories)</p><p>Ventricules : rapport des diamètres basaux droit/gauche &gt; 1, septum aplati, TAPSE/PAPS &lt; 0,55 mm/mmHg. Artère pulmonaire : temps d’accélération pulmonaire &lt; 105 ms ou encoche mésosystolique, vitesse de fuite pulmonaire protodiastolique &gt; 2,2 m/s, diamètre supérieur à celui de la racine aortique. Veine cave inférieure &gt; 21 mm peu compressible, surface de l’oreillette droite &gt; 18 cm².</p><p class="lab">Probabilité</p><p>Faible : vitesse ≤ 2,8 m/s sans signe indirect. Intermédiaire : vitesse ≤ 2,8 m/s avec signes, ou 2,9 à 3,4 m/s sans signes. Élevée : 2,9 à 3,4 m/s avec signes, ou &gt; 3,4 m/s. Les signes doivent appartenir à au moins deux catégories. Les seuils échographiques n’ont pas changé avec la nouvelle définition hémodynamique.</p><div class="key"><b>Piège.</b> L’échocardiographie estime une probabilité ; elle surestime ou sous-estime souvent la pression, et ne pose ni le diagnostic ni le groupe.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableau 10 et figure 5</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024, tableau 4</a>.</p></template>
<template data-pop="i27-scinti" data-title="Scintigraphie de ventilation-perfusion"><p class="lab">Principe</p><p>On compare la ventilation d’un gaz marqué à la perfusion de macroagrégats marqués. Une obstruction artérielle crée des défauts de perfusion segmentaires dans des territoires bien ventilés.</p><p class="lab">Valeur</p><p>En l’absence de maladie parenchymateuse, une scintigraphie de perfusion normale exclut une HTP-TEC avec une valeur prédictive négative de 98 %. L’angioscanner seul est moins fiable : sensibilité de 76 % et spécificité de 96 % à l’échelle du patient. Des défauts non appariés existent aussi dans 7 à 10 % des maladies veino-occlusives et des HTAP.</p><div class="key"><b>Suite.</b> Des défauts non appariés après trois mois d’anticoagulation conduisent à l’angioscanner, au cathétérisme droit et à l’angiographie pulmonaire en centre.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, sections 5.1.6 et 5.1.7</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209473/" target="_blank" rel="noopener">Kim et al., maladie thromboembolique chronique, 7e Symposium mondial, 2024</a>.</p></template>
<template data-pop="i27-cathe" data-title="Cathétérisme cardiaque droit"><p class="lab">Mesures</p><p>Pressions de l’oreillette droite, du ventricule droit, de l’artère pulmonaire et d’occlusion ; débit cardiaque par thermodilution ou méthode de Fick directe ; saturation veineuse mélangée en oxygène. Le calcul des RVP en découle.</p><p class="lab">Risque</p><p>Dans les centres expérimentés, les complications graves surviennent dans environ 1,1 % des cas et la mortalité liée au geste est de 0,055 %.</p><div class="key"><b>Exigence.</b> Le zéro est placé à mi-thorax et le débit est mesuré par Fick direct ou par thermodilution, jamais estimé par la méthode de Fick indirecte ; une erreur de quelques millimètres de mercure change le groupe.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17174196/" target="_blank" rel="noopener">Hoeper et al., complications du cathétérisme droit dans 7218 procédures, J Am Coll Cardiol 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
<template data-pop="i27-vasoreactivite" data-title="Test de vasoréactivité aiguë"><p class="lab">Indication</p><p>Uniquement dans l’HTAP idiopathique, héritable ou liée à un médicament, lors du cathétérisme initial.</p><p class="lab">Technique</p><p>Monoxyde d’azote inhalé (10 à 20 ppm pendant 5 à 10 minutes) ou iloprost inhalé ; l’époprosténol intraveineux est aussi valable mais plus long. L’adénosine n’est plus recommandée.</p><p class="lab">Réponse positive</p><p>Baisse de la PAPm d’au moins 10 mmHg jusqu’à ≤ 40 mmHg selon l’ESC/ERS 2022 (&lt; 40 mmHg selon le 7e Symposium), avec un débit stable ou accru. L’ESC/ERS 2022 compte moins de 10 % de répondeurs ; le 7e Symposium précise environ 12 % dans l’HTAP idiopathique ou médicamenteuse et moins de 5 % dans l’HTAP héritable. Moins des deux tiers des répondeurs aigus restent améliorés après un an d’inhibiteur calcique seul.</p><div class="key"><b>Conséquence.</b> Seuls les répondeurs reçoivent un inhibiteur calcique à forte dose, réévalué de façon complète après trois à quatre mois.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableau 12 et recommandations du tableau 7</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
<template data-pop="i27-defaillance" data-title="Réanimation du ventricule droit"><p class="lab">Surveiller</p><p>Pâleur, cyanose périphérique, hypotension, tachycardie, oligurie et lactate croissant traduisent le bas débit. La surveillance associe peptide natriurétique, troponine, échocardiographie et cathéter veineux central, dont la saturation veineuse centrale reflète le débit.</p><p class="lab">Traiter</p><p>On traite le déclencheur : infection, arythmie, anémie, embolie, arrêt thérapeutique. On maintient une saturation artérielle supérieure à 90 % et l’on évite l’hypercapnie. Les diurétiques intraveineux visent un bilan négatif. La dobutamine, débutée vers 2,5 µg/kg/min et limitée à 5 à 7,5 µg/kg/min, soutient le débit ; au-delà, elle abaisse les résistances systémiques et accélère le cœur sans bénéfice. La noradrénaline ou la vasopressine corrigent l’hypotension. Le monoxyde d’azote inhalé associé à la dobutamine peut servir de transition.</p><div class="key"><b>Recours.</b> L’oxygénation extracorporelle veino-artérielle, implantée sous anesthésie locale chez un patient éveillé, sert de pont vers la transplantation ou la récupération chez un candidat éligible. L’intubation, à haut risque de collapsus, est évitée autant que possible.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 6.3.7</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209471/" target="_blank" rel="noopener">Savale et al., 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26995592/" target="_blank" rel="noopener">Harjola et al., insuffisance ventriculaire droite aiguë, prise de position de la Heart Failure Association de l’ESC, Eur J Heart Fail 2016</a>.</p></template>
<template data-pop="i27-pam-cible" data-title="Pression artérielle moyenne cible : arbitrage des sources"><p class="lab">Texte en vigueur</p><p>L’ESC/ERS 2022 fait du maintien d’une pression artérielle moyenne supérieure à 60 mmHg un objectif clé du traitement de la défaillance droite.</p><p class="lab">Source plus récente</p><p>Le groupe de travail du 7e Symposium mondial (2024) propose de viser 70 à 75 mmHg, afin de protéger la perfusion coronaire droite et de prévenir l’ischémie du ventricule droit. Il précise qu’aucune étude dédiée n’appuie ce chiffre.</p><p class="lab">Choix retenu</p><p>Le cours retient le principe commun aux deux textes : maintenir une pression systémique suffisante pour perfuser un ventricule droit sous haute pression. La valeur précise relève de l’équipe de soins intensifs du centre ; 60 mmHg constitue le plancher de la recommandation européenne, 70 à 75 mmHg une cible d’experts plus récente.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 6.3.7.1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209471/" target="_blank" rel="noopener">Savale et al., 7e Symposium mondial, Eur Respir J 2024</a>.</p></template>
<template data-pop="i27-strates4" data-title="Modèle simplifié à quatre strates"><table class="t"><tr><th>Points</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>Classe fonctionnelle de l’OMS</td><td>I ou II</td><td>—</td><td>III</td><td>IV</td></tr><tr><td>Marche de six minutes</td><td>&gt; 440 m</td><td>320–440 m</td><td>165–319 m</td><td>&lt; 165 m</td></tr><tr><td>NT-proBNP</td><td>&lt; 300 ng/L</td><td>300–649 ng/L</td><td>650–1100 ng/L</td><td>&gt; 1100 ng/L</td></tr></table><p>On additionne les points, on divise par le nombre de variables et on arrondit à l’entier. Le résultat 1, 2, 3 ou 4 correspond au risque faible, intermédiaire-faible, intermédiaire-élevé ou élevé. Dans le registre COMPERA, la mortalité à un an mesurée au premier suivi était de 1,5 %, 2,8 %, 8,7 % et 22 % dans ces quatre strates.</p><div class="key"><b>Usage.</b> Ce modèle sert au suivi, après trois à quatre mois de traitement ; il distingue mieux que le modèle à trois strates les patients du milieu.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableau 18</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34737226/" target="_blank" rel="noopener">Hoeper et al., COMPERA 2.0, Eur Respir J 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209472/" target="_blank" rel="noopener">Dardi et al., stratification du risque, 7e Symposium mondial, 2024</a>.</p></template>
<template data-pop="i27-strates3" data-title="Modèle à trois strates : variables complémentaires"><p>Outre la clinique, la marche, le peptide et l’hémodynamique, le modèle intègre l’épreuve d’effort cardiorespiratoire (pic de VO₂ &gt; 15, 11 à 15, &lt; 11 mL/min/kg), l’échocardiographie (surface de l’oreillette droite &lt; 18, 18 à 26, &gt; 26 cm² ; TAPSE/PAPS &gt; 0,32, 0,19 à 0,32, &lt; 0,19 mm/mmHg ; épanchement péricardique), l’IRM cardiaque et la saturation veineuse mélangée en oxygène (&gt; 65 %, 60 à 65 %, &lt; 60 %).</p><div class="key"><b>Principe.</b> Aucune variable ne suffit seule ; le clinicien pondère l’ensemble, en privilégiant les signes de défaillance droite.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableau 16</a>.</p></template>
<template data-pop="i27-mesures" data-title="Mesures générales"><p>Le réentraînement supervisé sous traitement médical améliore la capacité d’effort (classe I, niveau A). La vaccination contre la grippe, le pneumocoque et le SARS-CoV-2 est recommandée ; le 7e Symposium y ajoute le virus respiratoire syncytial après 60 ans. L’oxygénothérapie de longue durée est prescrite si la PaO₂ reste &lt; 8 kPa (60 mmHg) à deux reprises. Les diurétiques traitent la rétention hydrosodée. Un soutien psychologique est proposé.</p><p class="lab">Fer</p><p>La carence martiale est fréquente et aggrave la fonction myocardique : ferritine &lt; 100 µg/L, ou 100 à 299 µg/L avec saturation de la transferrine &lt; 20 %. Elle est corrigée en présence d’une anémie (classe I), par voie intraveineuse si l’hémoglobine est inférieure à 7–8 g/dL ; sans anémie, la recharge reste une option (classe IIb).</p><div class="key"><b>Anticoagulation.</b> Elle n’est pas recommandée de façon générale dans l’HTAP, mais peut se discuter au cas par cas (classe IIb) ; dans l’HTAP des connectivites, les registres suggèrent un préjudice.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 6.3.1 et tableau 5 des recommandations</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209476/" target="_blank" rel="noopener">Chin et al., 2024, tableau 3</a>.</p></template>
<template data-pop="i27-combinaison" data-title="Bithérapie initiale et essai AMBITION"><p class="lab">Preuve</p><p>Dans AMBITION, 500 patients naïfs de traitement ont reçu ambrisentan plus tadalafil ou l’une des deux monothérapies. La combinaison a réduit de moitié le risque d’échec clinique (rapport des risques 0,50 ; intervalle de confiance à 95 % 0,35 à 0,72).</p><p class="lab">Logique</p><p>Les deux médicaments agissent sur des voies différentes ; leurs effets s’additionnent. Le prix en est un excès d’œdèmes périphériques, de céphalées, de congestion nasale et d’anémie.</p><div class="key"><b>Limite.</b> Les patients âgés avec comorbidités cardiopulmonaires étaient peu représentés : chez eux, la monothérapie initiale reste préférée.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/26308684/" target="_blank" rel="noopener">Galiè et al., N Engl J Med 2015;373:834-844</a>.</p></template>
<template data-pop="i27-sotatercept" data-title="Sotatercept : preuves et arbitrage des sources"><p class="lab">Preuves</p><p>STELLAR (323 patients en classe II–III sous traitement de fond) : gain de 40,8 m à la marche à 24 semaines et réduction de 84 % du décès ou de l’aggravation clinique (rapport des risques 0,16). ZENITH (172 patients à haut risque) : réduction du critère décès, transplantation ou hospitalisation (rapport des risques 0,24). Hyperion (320 patients diagnostiqués depuis moins d’un an) : réduction de l’aggravation clinique (rapport des risques 0,24).</p><p class="lab">Source retenue</p><p>L’ESC/ERS 2022, antérieure à ces essais, ne mentionne pas le sotatercept. L’algorithme du 7e Symposium mondial (2024) l’intègre comme option d’escalade au suivi pour les patients à risque intermédiaire ou élevé. Swissmedic l’a autorisé le 13.09.2024 en association au traitement standard en classes II–III ; une extension d’indication l’a ouvert à la classe IV (information professionnelle de février 2026, rapport SwissPAR publié le 02.04.2026). Ces sources plus récentes et applicables en Suisse l’emportent sur ce point ; l’ESC/ERS 2022 reste le texte de référence pour le reste de la stratégie.</p><div class="key"><b>Limite.</b> Les essais ont inclus surtout des HTAP idiopathiques, héritables et associées aux connectivites ; les données manquent pour l’hypertension portopulmonaire et l’infection par le VIH.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36877098/" target="_blank" rel="noopener">STELLAR, N Engl J Med 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40167274/" target="_blank" rel="noopener">ZENITH, N Engl J Med 2025;392:1987-2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41025556/" target="_blank" rel="noopener">Hyperion, N Engl J Med 2025;393:1599-1611</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209476/" target="_blank" rel="noopener">Chin et al., 2024</a> ; <a href="https://www.swissmedic.ch/swissmedic/de/home/humanarzneimittel/authorisations/new-medicines/winrevair-pulver-sotaterceptum.html" target="_blank" rel="noopener">Swissmedic, Winrevair</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, texte en vigueur</a>.</p></template>
<template data-pop="i27-greffe" data-title="Transplantation pulmonaire"><p class="lab">Adresser</p><p>L’ESC/ERS 2022 recommande d’adresser au centre de transplantation un candidat potentiel qui reste à risque intermédiaire-élevé ou élevé sous bithérapie orale, qui progresse, qui a besoin d’un prostanoïde parentéral, ou qui présente une forme peu répondeuse comme la maladie veino-occlusive. L’inscription sur liste suit si le risque reste élevé malgré un prostanoïde parentéral.</p><p class="lab">Opérer</p><p>La transplantation bipulmonaire est la règle ; la transplantation cardiopulmonaire est réservée aux cardiopathies associées non corrigeables. Le ventricule droit récupère presque toujours après la baisse de la postcharge. Chez les patients atteints d’HTAP idiopathique qui survivent à la première année, la survie médiane conditionnelle atteint 10 ans.</p><div class="key"><b>Piège.</b> Attendre la défaillance droite terminale pour adresser expose au décès sur liste d’attente.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 6.3.8 et tableau 20</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209471/" target="_blank" rel="noopener">Savale et al., 2024</a>.</p></template>
<template data-pop="i27-endarteriectomie" data-title="Endartériectomie pulmonaire"><p>Le chirurgien ouvre les artères pulmonaires sous circulation extracorporelle et arrêt circulatoire en hypothermie profonde. Il retire le matériel fibreux qui adhère à la paroi des artères proximales, jusqu’aux branches segmentaires.</p><div class="key"><b>Portée.</b> Recommandée en classe I pour les obstructions fibreuses accessibles, elle normalise la pression artérielle pulmonaire chez environ 70 à 75 % des opérés, avec une mortalité opératoire d’environ 2 % dans les centres experts. Une équipe pluridisciplinaire juge l’opérabilité ; une HTP persistante après chirurgie relève de l’angioplastie ou du riociguat.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 10.2</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209473/" target="_blank" rel="noopener">Kim et al., 2024</a>.</p></template>
<template data-pop="i27-angioplastie" data-title="Angioplastie pulmonaire par ballonnet"><p>L’opérateur dilate des membranes et des sténoses des artères segmentaires et sous-segmentaires, en plusieurs séances. Les RVP et la capacité d’effort s’améliorent.</p><div class="key"><b>Risques.</b> La complication la plus fréquente est la lésion pulmonaire par perforation du guide, dans environ 10 % des séances, plus sévère quand la PAPm atteint 40 mmHg ; un riociguat préalable réduit les complications graves si les RVP dépassent 4 unités Wood. Recommandée en classe I pour les patients inopérables ou avec HTP résiduelle.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 10.2</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209473/" target="_blank" rel="noopener">Kim et al., 2024</a>.</p></template>
<template data-pop="i27-groupe2" data-title="Pourquoi pas de vasodilatateur pulmonaire dans le groupe 2"><p>Dans une HTP postcapillaire, l’obstacle est en aval. Dilater les artères pulmonaires augmente le flux vers une oreillette gauche déjà sous pression : la pression capillaire monte et l’œdème pulmonaire menace. Des signaux de sécurité défavorables ont été relevés avec les antagonistes de l’endothéline dans l’insuffisance cardiaque et avec le sildénafil après correction d’une valvulopathie.</p><div class="key"><b>Recommandation.</b> L’ESC/ERS 2022 déconseille ces médicaments dans le groupe 2 (classe III, niveau A) et les inhibiteurs de la phosphodiestérase 5 dans l’HTP postcapillaire isolée de l’insuffisance cardiaque à fraction d’éjection préservée. Une composante précapillaire sévère (RVP &gt; 5 unités Wood) justifie un avis de centre.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableaux 22A et 22B des recommandations</a>.</p></template>
<template data-pop="i27-groupe3" data-title="Médicaments de l’HTAP et maladies respiratoires"><p class="lab">Risque théorique</p><p>Un vasodilatateur systémique pourrait relâcher les artérioles des alvéoles mal ventilées que la vasoconstriction hypoxique avait fermées, et aggraver l’hypoxémie. Dans les essais, cette aggravation reste rare ; le risque démontré est ailleurs.</p><p class="lab">Préjudices démontrés</p><p>L’ambrisentan a accru la progression de la maladie et les hospitalisations dans la fibrose pulmonaire idiopathique (essai ARTEMIS) ; le riociguat a été arrêté pour excès de mortalité dans l’HTP des pneumopathies interstitielles idiopathiques (essai RISE-IIP). Le tréprostinil inhalé a été interrompu pour effets indésirables graves dans l’HTP de la BPCO (essai PERFECT).</p><p class="lab">Exception</p><p>Le tréprostinil inhalé a amélioré la marche dans l’HTP des pneumopathies interstitielles (essai INCREASE) : l’ESC/ERS 2022 permet de l’envisager (classe IIb). Il n’est pas autorisé en Suisse. Les inhibiteurs de la phosphodiestérase 5 peuvent s’envisager en centre dans une HTP sévère des pneumopathies interstitielles (classe IIb).</p><div class="key"><b>Recommandation.</b> Ambrisentan dans la fibrose pulmonaire idiopathique, riociguat dans les pneumopathies interstitielles idiopathiques et médicaments de l’HTAP dans l’HTP non sévère : classe III.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableaux 23A et 23B des recommandations</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209469/" target="_blank" rel="noopener">Shlobin et al., 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209476/" target="_blank" rel="noopener">Chin et al., 2024</a>.</p></template>
<template data-pop="i27-grossesse" data-title="Grossesse et contraception"><p class="lab">Informer</p><p>L’ESC/ERS 2022 recommande d’informer dès le diagnostic sur les risques d’une grossesse et de la déconseiller (classe I). Une maladie mal contrôlée, à risque intermédiaire ou élevé, fait conseiller une interruption précoce ; une maladie bien contrôlée, à risque faible et à hémodynamique quasi normale, autorise une décision partagée.</p><p class="lab">Contraception</p><p>Elle doit être claire et fiable. Le bosentan réduit l’efficacité des contraceptifs hormonaux ; l’implant hormonal et le dispositif intra-utérin ont de faibles taux d’échec. La contraception d’urgence hormonale est sûre.</p><p class="lab">Traitement pendant la grossesse</p><p>Antagonistes de l’endothéline, riociguat et sélexipag sont arrêtés ; inhibiteurs calciques, inhibiteurs de la phosphodiestérase 5 et prostanoïdes inhalés ou parentéraux sont considérés comme sûrs. Le sotatercept n’est pas recommandé ; détectable deux mois au moins après la dernière dose, il expose le fœtus en cas de grossesse imprévue.</p><div class="key"><b>Conduite.</b> Une grossesse débutée est prise en charge sans délai dans un centre expert. Le risque d’effondrement hémodynamique culmine dans les douze heures qui suivent l’accouchement, souvent programmé par césarienne entre 36 et 38 semaines.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 6.3.2.1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209477/" target="_blank" rel="noopener">Preston et al., 2024</a> ; information professionnelle suisse Winrevair®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026.</p></template>
<template data-pop="i27-altitude" data-title="Montagne et vol aérien"><p class="lab">Vol aérien</p><p>La cabine d’un avion est pressurisée à une altitude équivalente pouvant atteindre 2438 m. L’ESC/ERS 2022 recommande l’oxygène en vol si le patient reçoit déjà de l’oxygène ou si sa PaO₂ est &lt; 8 kPa ou sa SaO₂ &lt; 92 % au niveau de la mer ; 2 L/min ramènent la pression inspirée d’oxygène à celle du niveau de la mer. La British Thoracic Society le propose aussi en classe fonctionnelle III ou IV.</p><p class="lab">Montagne</p><p>L’ESC/ERS 2022 conseille d’éviter les séjours au-dessus de 1500 m sans oxygène. Deux essais randomisés zurichois ont précisé la tolérance chez des patients stables, surtout à faible risque, sans hypoxémie de repos. Une journée à 2500 m a été bien tolérée, au prix d’une capacité d’effort réduite de 11 % et d’une SpO₂ de fin d’effort de 83 %. Lors d’une nuit à 2500 m, 14 patients sur 27 ont présenté un événement prédéfini, surtout une hypoxémie nocturne sévère, corrigée par l’oxygène ; aucun n’a dû être évacué.</p><div class="key"><b>Conseil.</b> Le voyageur emporte un résumé médical, la liste de ses traitements et des doses supplémentaires. Un séjour avec nuitée en altitude se planifie avec le centre, oxygène prévu.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 6.3.2.3</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35228307/" target="_blank" rel="noopener">Coker et al., British Thoracic Society, voyage aérien, Thorax 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38423623/" target="_blank" rel="noopener">Müller et al., effort à 2500 m, Eur Respir J 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38079468/" target="_blank" rel="noopener">Schneider et al., nuit à 2500 m, Eur Heart J 2024</a>.</p></template>
<template data-pop="i27-fistules" data-title="Fistules artérioveineuses pulmonaires"><p class="lab">Cause</p><p>Une grande partie survient dans la télangiectasie hémorragique héréditaire (maladie de Rendu‑Osler), maladie autosomique dominante d’une prévalence d’au moins 1 sur 5000, liée surtout aux gènes ENG et ACVRL1. Ses malformations vasculaires touchent le poumon, le cerveau, le tube digestif et le foie.</p><p class="lab">Conséquences</p><p>Le shunt droit-gauche permanent provoque une hypoxémie et laisse passer caillots et bactéries : plus d’un patient sur quatre subit un accident vasculaire cérébral par embolie paradoxale, un abcès cérébral ou un infarctus du myocarde. Une hémorragie grave complique environ une grossesse sur cent.</p><p class="lab">Démarche</p><p>Le dépistage chez les patients et leurs apparentés, puis l’embolisation des fistules accessibles, préviennent ces complications ; la British Thoracic Society en a précisé les modalités en 2017.</p><div class="key"><b>Piège.</b> Une variante pathogène d’ENG ou d’ACVRL1 peut aussi causer une HTAP héritable : l’hypoxémie n’a alors pas une cause unique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29141890/" target="_blank" rel="noopener">Shovlin et al., British Thoracic Society, 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19553198/" target="_blank" rel="noopener">Faughnan et al., 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32894695/" target="_blank" rel="noopener">Faughnan et al., 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209481/" target="_blank" rel="noopener">Austin et al., 2024</a>.</p></template>
<template data-pop="i27-criteres" data-title="Limites des critères hémodynamiques"><p>Les seuils dépendent d’une mesure rigoureuse : zéro à mi-thorax, lecture en fin d’expiration, débit mesuré et non estimé. Une PAPO proche de 15 mmHg laisse une zone d’incertitude, surtout chez le patient âgé à facteurs de risque d’insuffisance cardiaque à fraction d’éjection préservée. Une PAPm &gt; 20 mmHg avec PAPO ≤ 15 mmHg et RVP ≤ 2 unités Wood ne rentre dans aucun profil : l’ESC/ERS 2022 la nomme HTP non classée. Elle traduit souvent un débit pulmonaire élevé (cardiopathie congénitale, maladie du foie, hyperthyroïdie) et ne relève pas des médicaments de l’HTAP.</p><div class="key"><b>Conséquence.</b> Le diagnostic se pose en centre, avec l’ensemble du contexte clinique ; un chiffre isolé ne suffit pas.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 3.1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
