<section class="ilot" id="a69-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme L., 46 ans, revient d’un week-end de randonnée dans le Jura. Or, dix jours plus tard, elle découvre sur la cuisse une rougeur ronde de 8 cm qui s’élargit de jour en jour, sans fièvre. De plus, elle se souvient d’une tique retirée à cet endroit. Ainsi, ce délai et cette extension centrifuge d’une lésion de plus de 5 cm désignent un <button class="w" data-k="a69-pa-em">érythème migrant (caractérisation clinique)</button>, forme précoce localisée de la borréliose de Lyme. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », validée le 25 août 2025, questions fréquentes</a>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, quand la clinique suffit-elle, et quand la sérologie devient-elle utile ? Ensuite, quelles manifestations disséminées faut-il reconnaître sans retard ? Puis, quel antibiotique, à quelle dose et pour quelle durée selon la forme ? Enfin, comment éviter le surdiagnostic et les antibiothérapies répétées inutiles ?</p>
<div class="key"><b>À retenir.</b> L’érythème migrant se diagnostique à l’œil et se traite sans sérologie ; toutes les autres formes exigent une confirmation biologique.</div></section>

<section class="ilot" id="a69-pa-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Pour répondre à ces questions, il faut d’abord définir la maladie. Ainsi, la borréliose de Lyme est l’infection par un spirochète du complexe <i>Borrelia burgdorferi</i> sensu lato, transmis par piqûre de tique. En effet, l’infection naît dans la peau au point de piqûre ; elle peut ensuite diffuser vers la peau à distance, le système nerveux, le cœur et les articulations. <a href="https://doi.org/10.1016/S0140-6736(11)60103-7" target="_blank" rel="noopener" data-reference-source="1">Stanek G et al., Lancet 2012</a>.</p>
<p>C’est pourquoi la Société suisse d’infectiologie (SSI) classe les manifestations selon leur stade évolutif. Le tableau ci-dessous reprend donc sa <button class="w" data-k="a69-pa-stades">classification en stades</button> ; il se lit comme une chronologie, de la lésion cutanée initiale aux atteintes tardives.</p>
<table class="t"><thead><tr><th>Stade</th><th>Manifestations</th><th>Preuve requise</th></tr></thead><tbody>
<tr><td>Précoce localisé</td><td>Érythème migrant, éventuellement multiple</td><td>Clinique seule</td></tr>
<tr><td>Précoce disséminé</td><td>Lymphocytome bénin ; paralysie faciale, méningite, radiculopathie ; cardite (troubles de conduction)</td><td>Clinique et biologie</td></tr>
<tr><td>Tardif</td><td>Arthrite de Lyme ; neuropathie périphérique, encéphalomyélite ; acrodermatite chronique atrophiante</td><td>Clinique et biologie</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Ce tableau suit la diffusion des borrélies dans l’organisme : d’abord limitées à la peau, elles passent ensuite dans le sang et atteignent le nerf, le cœur ou l’articulation, puis persistent dans certains tissus. Ainsi, plus le stade est avancé, plus la preuve biologique devient nécessaire, parce que les signes perdent leur spécificité et parce que les anticorps ont eu le temps d’apparaître. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic</a>.</div>
<p>Ainsi, le tableau montre que seule la forme initiale se passe de preuve biologique. Par ailleurs, la catégorie de classification qui porte ce cours regroupe aussi d’autres infections à spirochètes, plus rares, qui ne sont pas traitées ici. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, manifestations</a>.</p>
<div class="key"><b>À retenir.</b> La maladie évolue en trois stades, et en dehors de la peau elle atteint surtout trois organes : le nerf, le cœur et l’articulation.</div></section>

<section class="ilot" id="a69-pa-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Une fois la maladie définie, reste à en mesurer la fréquence. Or, la borréliose de Lyme n’est pas une maladie à déclaration obligatoire en Suisse ; c’est pourquoi elle est suivie par le réseau de médecins de premier recours Sentinella. Ainsi, pour 2008 à 2011, l’OFSP estimait <b>7 000 à 12 000 cas par an</b>, soit une incidence annuelle de <b>131 pour 100 000 habitants</b>. De plus, l’érythème migrant représentait <b>90 %</b> des cas. En revanche, les formes tardives étaient rares : environ 280 à 630 acrodermatites, 300 à 900 arthrites et 60 à 300 neuroborrélioses chroniques par an. Enfin, le nord-est du pays était le plus touché ; toutefois, des cas survenaient dans toutes les régions. <a href="https://doi.org/10.4414/smw.2013.13725" target="_blank" rel="noopener" data-reference-source="1">Altpeter E et al., Swiss Med Wkly 2013;143:w13725 (OFSP, Sentinella 2008–2011)</a>.</p>
<p>Cependant, cette estimation date d’une période ancienne ; en effet, aucune estimation nationale plus récente n’a pu être lue pour ce cours, ce qui constitue une lacune nommée. Les données courantes sont toutefois publiées sur le portail interactif de l’OFSP. Par ailleurs, le <button class="w" data-k="a69-pa-epid">détail épidémiologique suisse (séroprévalence, tiques infectées)</button> explique pourquoi une sérologie positive est fréquente sans maladie.</p>
<p>Au-delà de la fréquence, le pronostic est bon. En effet, traitées par l’antibiotique adéquat, la plupart des formes guérissent ; aucune donnée convaincante ne justifie une antibiothérapie de plus de quatre semaines. <a href="https://doi.org/10.1016/S0140-6736(11)60103-7" target="_blank" rel="noopener" data-reference-source="1">Stanek G et al., Lancet 2012</a>. Cependant, les stades tardifs laissent parfois des séquelles tissulaires, et une minorité de patients décrit des symptômes persistants dont la cause n’est pas une infection active. <a href="https://doi.org/10.1136/bmj.m1041" target="_blank" rel="noopener" data-reference-source="1">Kullberg BJ et al., BMJ 2020</a>.</p>
<div class="key"><b>À retenir.</b> La Suisse compte environ dix mille cas par an, dont neuf sur dix se présentent sous forme d’érythème migrant ; la guérison est la règle.</div></section>

<section class="ilot" id="a69-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Ce pronostic et ces formes successives découlent du mécanisme de l’infection. En effet, la tique infectée inocule les borrélies dans le derme pendant son repas sanguin. Les bactéries se multiplient ensuite localement puis migrent de façon centrifuge dans la peau : ainsi, l’inflammation qui suit leur front de progression dessine l’érythème migrant, qui s’agrandit de jour en jour. Certes, cet érythème finit par disparaître même sans antibiotique ; cependant, les spirochètes peuvent avoir déjà gagné d’autres tissus par voie sanguine. <a href="https://doi.org/10.1016/S0140-6736(11)60103-7" target="_blank" rel="noopener" data-reference-source="1">Stanek G et al., Lancet 2012</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> La forme hélicoïdale de la borrélie, visible ici en fond noir, s’explique par ses flagelles internes logés entre la membrane et la paroi ; ils lui permettent de se déplacer en vrille dans le derme et la matrice des tissus conjonctifs. C’est pourquoi l’infection s’étend de proche en proche depuis le point de piqûre, puis gagne le sang et les organes. Cependant, la bactérie est rare dans les tissus et ne se cultive pas en routine, si bien que le diagnostic repose sur la clinique, les anticorps ou la PCR.</div>
<p>Dès lors, la dissémination explique les formes précoces disséminées : érythèmes multiples, lymphocytome, atteinte des nerfs crâniens et des racines, troubles de conduction cardiaque. De même, l’infection persistante non traitée explique les formes tardives : arthrite d’une grosse articulation, acrodermatite chronique. <a href="https://doi.org/10.1007/s00105-005-0995-5" target="_blank" rel="noopener" data-reference-source="1">Hofmann H, Hautarzt 2005</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, manifestations</a>.</p>
<p>En outre, le tableau clinique dépend en partie de l’espèce. En effet, en Europe coexistent au moins cinq espèces pathogènes, dominées par <i>B. afzelii</i> et <i>B. garinii</i>, alors qu’aux États-Unis une seule prédomine ; c’est pourquoi les formes tardives sont surtout articulaires en Amérique du Nord et cutanées (acrodermatite) en Europe. La <button class="w" data-k="a69-s-especes">diversité des espèces de borrélies (organotropisme)</button> est détaillée dans l’onglet Sciences. <a href="https://doi.org/10.1007/s00105-005-0995-5" target="_blank" rel="noopener" data-reference-source="1">Hofmann H, Hautarzt 2005</a> ; <a href="https://doi.org/10.1136/bmj.m1041" target="_blank" rel="noopener" data-reference-source="1">Kullberg BJ et al., BMJ 2020</a>.</p>
<p>Enfin, la réponse humorale est lente : les anticorps manquent souvent au stade d’érythème migrant, puis persistent longtemps après la guérison. Par conséquent, la sérologie témoigne d’une exposition, non de l’activité de la maladie. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, aspects importants</a>.</p>
<div class="key"><b>Corrélation clinique.</b> Le décalage entre infection et séroconversion explique la règle centrale : on ne demande pas de sérologie devant un érythème migrant, ni pour suivre le traitement.</div></section>

<section class="ilot" id="a69-pa-4"><h2><span class="n">4</span>Transmission et facteurs de risque</h2>
<p>Le mécanisme posé, il faut préciser comment l’homme s’infecte. En Suisse, les borrélies sont ainsi transmises par la tique commune <i>Ixodes ricinus</i>. Elle vit surtout dans les forêts, les sous-bois, les lisières et les clairières, mais aussi près des rivières et dans les parcs proches des forêts ; en outre, elle est présente dans toute la Suisse. Or, selon l’OFSP, 5 à 30 % des tiques, localement jusqu’à 50 %, portent l’agent de la borréliose. <a href="https://www.bag.admin.ch/fr/maladies-transmises-par-les-tiques-situation-en-suisse" target="_blank" rel="noopener" data-reference-source="1">OFSP, « Tiques et agents pathogènes transmis par les tiques : FAQ »</a> ; <a href="https://www.infovac.ch/docs/public/fsme/faq-zecken-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, FAQ tiques (version imprimable, Infovac)</a>.</p>
<p>Par conséquent, le risque dépend de l’exposition : activités en forêt, travail forestier, course d’orientation. Ainsi, une séroprévalence élevée a été observée chez les forestiers et les orienteurs, et voisine de 10 % chez les donneurs de sang. <a href="https://doi.org/10.4414/smw.2013.13725" target="_blank" rel="noopener" data-reference-source="1">Altpeter E et al., Swiss Med Wkly 2013;143:w13725 (OFSP, Sentinella 2008–2011)</a>.</p>
<p>De plus, la durée d’attachement compte. En effet, retirer la tique moins de 24 heures après la piqûre diminue le risque de transmission de la borréliose, mais pas celui du virus de l’encéphalite à tiques. <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », validée le 25 août 2025, questions fréquentes</a>.</p>
<div class="trap"><span class="k">Piège.</span> L’absence de piqûre remarquée n’exclut pas le diagnostic : la piqûre passe souvent inaperçue, et le diagnostic d’érythème migrant reste clinique.</div></section>

<section class="ilot" id="a69-pa-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Ces modes de transmission orientent directement l’interrogatoire. Ainsi, l’anamnèse établit trois éléments : l’exposition, la chronologie et l’organe atteint.</p>
<div class="two"><div class="card"><b>Exposition et antécédents</b><p><button class="w" data-k="a69-pa-tique">Piqûre de tique (date, durée d’attachement, site)</button>, séjour en forêt, profession exposée. Antécédent de borréliose documentée et traitement reçu. Il faut aussi connaître le statut vaccinal contre l’encéphalite à tiques, transmise par la même tique. Grossesse, allergie aux bêtalactamines, isotrétinoïne ou anticoagulant oral (choix de l’antibiotique).</p></div>
<div class="card"><b>Chronologie</b><p>Délai entre piqûre et symptômes, confronté aux délais typiques de chaque forme (<button class="w" data-k="a69-pa-stades">délais par stade</button>). Une rougeur apparue dans les heures qui suivent la piqûre oriente vers une réaction locale toxique ou allergique, non vers une borréliose.</p></div></div>

<div class="key"><b>Lecture et physiopathologie.</b> Le lymphocytome siège là où la peau est fine et riche en tissu lymphoïde, comme le lobe de l’oreille de l’enfant ou le mamelon. La plaque violacée correspond à un infiltrat dense de lymphocytes B et T attirés par les borrélies disséminées ; elle signe donc un stade précoce disséminé, ce qui explique que la sérologie soit positive dans environ 80 % des cas, contrairement à l’érythème migrant. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic</a>.</div>
<p>Une fois la chronologie établie, les symptômes se recherchent ensuite par organe : rougeur cutanée qui s’étend ; douleur radiculaire nocturne, céphalées, faiblesse faciale ; palpitations, malaise ou syncope ; gonflement d’un genou ; lésion violacée d’une extrémité. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, manifestations et diagnostic</a>.</p>
<div class="two"><div class="card"><b>Forme typique</b><p>Rougeur ronde de plus de 5 cm, apparue entre 3 et 32 jours après une piqûre, qui s’étend de façon centrifuge, souvent peu symptomatique.</p></div>
<div class="card"><b>Formes atypiques</b><p>Érythèmes multiples (dissémination) ; paralysie faciale isolée ; monoarthrite du genou sans souvenir de piqûre ; lésion acrale violacée mal limitée qui évoque une insuffisance veineuse.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente.</span> Attribuer à la borréliose une fatigue chronique ou des plaintes vagues sur la seule foi d’une sérologie positive : la SSI exclut explicitement ces tableaux des indications de sérologie.</div></section>

<section class="ilot" id="a69-pa-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’anamnèse oriente ensuite l’examen. Celui-ci commence par l’état général et les signes vitaux, en particulier la fréquence et la régularité cardiaques, puis cible la peau, le système nerveux, le cœur et les articulations.</p>
<div class="two"><div class="card"><b>Peau</b><p><button class="w" data-k="a69-pa-em">Érythème migrant</button> : mesurer le diamètre et marquer le bord au feutre ou photographier pour objectiver l’extension. Lymphocytome bénin : plaque violette indolore de l’oreille, du mamelon ou du scrotum. <button class="w" data-k="a69-pa-aca">Acrodermatite chronique atrophiante</button> : lésion rouge-violacée œdémateuse de la face d’extension d’un membre, puis peau « en papier à cigarette ».</p></div>
<div class="card"><b>Nerf, cœur, articulation</b><p>Paralysie faciale périphérique, uni- ou bilatérale ; signes méningés ; déficit radiculaire. Bradycardie ou pauses, qui imposent un électrocardiogramme (<button class="w" data-k="a69-pa-cardite">cardite de Lyme</button>). Épanchement d’un genou, plus rarement du coude ou de la cheville.</p></div></div>

<div class="key"><b>Lecture et physiopathologie.</b> L’anneau rouge progresse parce que les borrélies migrent vers la périphérie du derme, tandis que le centre s’éclaircit lorsque la réponse inflammatoire y contrôle l’infection. Le diamètre supérieur à 5 cm et l’extension en quelques jours distinguent cet érythème d’une simple réaction à la piqûre, qui apparaît plus tôt et ne s’étend pas. Comme les anticorps ne sont pas encore produits à ce stade, la sérologie est souvent négative, d’où un diagnostic purement clinique. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic</a>.</div>
<div class="trap"><span class="k">Piège.</span> L’acrodermatite précoce est ambiguë et peut être prise pour une affection veineuse ; diagnostiquée tôt, elle régresse entièrement, alors qu’au stade atrophique seule la progression peut être arrêtée.</div></section>

<section class="ilot" id="a69-pa-7"><h2><span class="n">7</span>Diagnostic</h2>
<p>L’examen fournit ainsi la manifestation clinique sur laquelle repose le diagnostic, confirmée par la biologie sauf pour l’érythème migrant. Or, la SSI insiste sur le surdiagnostic : en effet, la sérologie ne sert qu’à étayer un diagnostic clinique. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, aspects importants et diagnostic</a>.</p>
<table class="t"><thead><tr><th>Manifestation</th><th>Confirmation recommandée</th></tr></thead><tbody>
<tr><td>Érythème migrant</td><td>Aucune : diagnostic clinique, sérologie souvent négative</td></tr>
<tr><td>Lymphocytome bénin</td><td>Sérologie (positive dans 80 % des cas) ; si négative, discuter une PCR sur biopsie cutanée</td></tr>
<tr><td>Acrodermatite chronique atrophiante</td><td>PCR des borrélies sur biopsie cutanée (sensibilité estimée à 70 à 90 %)</td></tr>
<tr><td>Neuroborréliose</td><td>Pléiocytose lymphocytaire du LCR et production intrathécale d’anticorps (index sérum/LCR)</td></tr>
<tr><td>Arthrite</td><td>Sérologie ; PCR sur biopsie synoviale, plus sensible que sur liquide synovial</td></tr>
<tr><td>Cardite</td><td>Électrocardiogramme (allongement de PQ jusqu’au bloc complet) et sérologie</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque examen est choisi selon l’endroit où se trouvent les borrélies : la PCR cherche la bactérie dans le tissu qui la contient, la ponction lombaire prouve que la réponse anticorps se produit dans le système nerveux central, et l’électrocardiogramme mesure directement la conséquence de l’inflammation du tissu de conduction. C’est pourquoi une sérologie isolée ne suffit jamais pour une forme disséminée. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic</a>.</div>
<p>Le tableau montre donc que la preuve dépend de l’organe. Quant à la sérologie, elle se fait en deux temps : un <button class="w" data-k="a69-e-sero">test de dépistage ELISA, puis, s’il est positif, une confirmation par immunoblot</button>. Elle confirme cependant une exposition, non l’activité ; de plus, des réactions croisées avec la syphilis sont possibles. La fenêtre <button class="w" data-k="a69-e-sero">Interpréter une sérologie de Lyme</button> détaille ces limites. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic</a>.</p>
<p>Enfin, le diagnostic différentiel dépend de la forme. Ainsi, devant une rougeur au point de piqûre : réaction locale précoce, et ulcère avec adénopathie évoquant une tularémie ulcéro-glandulaire. En revanche, devant une fièvre après piqûre : encéphalite à tiques, ehrlichiose, babésiose, rickettsiose, tularémie. <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », validée le 25 août 2025, questions fréquentes</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, aspects importants</a>.</p>
<div class="key"><b>À retenir.</b> Une sérologie positive sans manifestation clinique signe une exposition ancienne ; elle ne justifie jamais un antibiotique.</div>
<button class="pareto-btn ui" data-k="pareto-a69-clinique">▲ Loi de Pareto — Reconnaître et confirmer la borréliose</button></section>

<section class="ilot" id="a69-pa-8"><h2><span class="n">8</span>Urgences et complications</h2>
<div class="alert"><b>Gravité d’abord.</b> Deux formes justifient une évaluation hospitalière : la <b>cardite avec bloc atrioventriculaire de haut degré</b>, traitée par ceftriaxone intraveineuse, et la <b>neuroborréliose avec atteinte du parenchyme</b> cérébral ou médullaire (encéphalomyélite), également traitée par ceftriaxone. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, thérapie</a>.</div>
<p>La première de ces urgences est cardiaque. En effet, la <button class="w" data-k="a69-pa-cardite">cardite de Lyme</button> débute environ trois semaines après la piqûre (de 4 jours à 7 mois). Elle va de l’allongement de PQ au bloc complet. Toutefois, le bloc régresse spontanément en 2 à 6 semaines ; par conséquent, un stimulateur temporaire n’est que rarement nécessaire, alors que la surveillance rythmique l’est toujours. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic, cardite</a>.</p>
<p>La seconde urgence est neurologique. Ainsi, la <button class="w" data-k="a69-e-lcr">neuroborréliose</button> précoce associe le plus souvent méningite lymphocytaire, paralysie faciale et radiculite douloureuse ; les formes tardives sont l’encéphalomyélite chronique progressive et la neuropathie périphérique. Or, selon la directive européenne, l’atteinte du système nerveux central se traite par ceftriaxone intraveineuse. <a href="https://doi.org/10.1111/j.1468-1331.2009.02862.x" target="_blank" rel="noopener" data-reference-source="1">Mygland A et al., directive de la Fédération européenne des sociétés de neurologie, Eur J Neurol 2010</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, manifestations</a>.</p>
<div class="trap"><span class="k">Piège.</span> Un bloc atrioventriculaire chez un adulte jeune, en été, après une randonnée : penser à la cardite de Lyme avant de poser un stimulateur définitif.</div></section>

<section class="ilot" id="a69-pa-9"><h2><span class="n">9</span>Prise en charge</h2>
<p>Ces urgences écartées, la prise en charge devient une question de choix d’antibiotique. Ses objectifs sont d’éradiquer l’infection, de prévenir la dissémination et les formes tardives, et d’éviter les traitements inutiles. Pour cela, le moyen est une antibiothérapie dont la molécule, la voie et la durée dépendent de la forme. Ainsi, la voie orale suffit pour la peau, l’articulation, la cardite sans bloc de haut degré et la neuroborréliose sans atteinte parenchymateuse. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, thérapie</a>.</p>
<table class="t"><thead><tr><th>Forme (SSI 2025)</th><th>Traitement de référence</th><th>Durée</th></tr></thead><tbody>
<tr><td>Érythème migrant, sans cardite ni signe neurologique</td><td><button class="w" data-k="a69-p-doxy">Doxycycline 100 mg toutes les 12 h par voie orale</button></td><td>7 à 10 jours</td></tr>
<tr><td>Acrodermatite chronique atrophiante</td><td>Doxycycline 100 mg toutes les 12 h par voie orale</td><td>21 à 28 jours</td></tr>
<tr><td>Arthrite</td><td>Doxycycline 100 mg toutes les 12 h par voie orale</td><td>28 jours</td></tr>
<tr><td>Cardite, bloc au plus du deuxième degré</td><td>Doxycycline 100 mg toutes les 12 h par voie orale</td><td>14 à 21 jours</td></tr>
<tr><td>Cardite avec bloc du troisième degré</td><td><button class="w" data-k="a69-p-ceftri">Ceftriaxone 2 g toutes les 24 h par voie intraveineuse</button></td><td>28 jours</td></tr>
<tr><td>Neuroborréliose sans atteinte parenchymateuse</td><td>Doxycycline 100 mg toutes les 12 h par voie orale ou ceftriaxone 2 g toutes les 24 h par voie intraveineuse</td><td>14 à 21 jours</td></tr>
<tr><td>Neuroborréliose avec atteinte parenchymateuse</td><td>Ceftriaxone 2 g toutes les 24 h par voie intraveineuse</td><td>14 à 28 jours</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> La doxycycline est le traitement de première ligne parce qu’elle diffuse bien dans la peau, les articulations et le liquide cérébro-spinal et parce qu’elle se prend par voie orale. La ceftriaxone intraveineuse est réservée au bloc du troisième degré et à l’atteinte du parenchyme nerveux, car ces formes exigent des concentrations élevées et rapides. Les durées s’allongent avec le stade, parce que les borrélies persistant dans un tissu mal vascularisé, comme la synoviale ou le derme atrophique, sont plus lentes à éradiquer. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic</a>.</div>
<p>Le tableau montre que la doxycycline est la molécule pivot et que seules les atteintes graves du cœur ou du parenchyme nerveux imposent la voie intraveineuse. De plus, la durée courte de l’érythème migrant s’appuie sur un <button class="w" data-k="a69-pa-stupica">essai slovène</button> : chez 300 adultes avec érythème migrant isolé, 7 jours de doxycycline n’étaient pas inférieurs à 14 jours (échec 3 % contre 2 %). <a href="https://doi.org/10.1016/S1473-3099(22)00528-X" target="_blank" rel="noopener" data-reference-source="1">Stupica D et al., Lancet Infect Dis 2023</a>.</p>
<p>Cependant, en cas d’allergie ou de contre-indication à la doxycycline, la SSI propose l’amoxicilline, la céfuroxime ou un macrolide pour les formes cutanées, l’amoxicilline pour l’arthrite et la ceftriaxone pour la cardite ; les doses figurent dans l’onglet Pharmacologie. Ensuite, la surveillance est clinique : régression de l’érythème, de la douleur radiculaire, du bloc ou de l’épanchement. Enfin, une persistance des signes objectifs fait reconsidérer le diagnostic avant de changer d’antibiotique. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, thérapie</a>.</p>
<div class="trap"><span class="k">Erreur fréquente.</span> Contrôler la sérologie pour juger de l’efficacité : elle reste positive après guérison et n’a aucune valeur de suivi.</div>
<button class="pareto-btn ui" data-k="pareto-a69-traitement">▲ Loi de Pareto — Traiter selon la forme</button></section>

<section class="ilot" id="a69-pa-10"><h2><span class="n">10</span>Suivi, syndrome post-Lyme et prévention</h2>
<p>Après le traitement, le suivi reste clinique. Or, une partie des patients décrit, après un traitement adéquat, fatigue, arthralgies, myalgies, troubles cognitifs ou douleurs radiculaires. Toutefois, la SSI réserve le diagnostic probable de <button class="w" data-k="a69-pa-ptlds">syndrome post-Lyme (critères suisses)</button> aux patients dont la borréliose et son traitement sont documentés, après exclusion d’une infection active et d’autres maladies. En effet, des cures répétées d’antibiotiques n’apportent aucun bénéfice ; la thérapie cognitivo-comportementale et un suivi symptomatique sont proposés. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, syndrome post-Lyme</a> ; <a href="https://doi.org/10.4414/smw.2016.14353" target="_blank" rel="noopener" data-reference-source="1">Nemeth J et al., directive suisse sur le syndrome post-Lyme, Swiss Med Wkly 2016</a>.</p>
<p>Au-delà du suivi, la prévention repose sur la protection contre les piqûres et le retrait rapide de la tique avec une pince à épiler, doucement, perpendiculairement à la peau, sans rotation ni produit appliqué. En outre, après une piqûre asymptomatique, la SSI ne recommande ni sérologie ni antibioprophylaxie ; en revanche, elle conseille de surveiller la peau et de vérifier la <button class="w" data-k="a69-pa-fsme">vaccination contre l’encéphalite à tiques</button>, recommandée dans toute la Suisse sauf au Tessin. Enfin, aucun vaccin humain contre la borréliose n’est autorisé ; un candidat était en développement avancé en 2025. <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », validée le 25 août 2025, introduction et questions fréquentes</a>.</p>
<div class="key"><b>À retenir.</b> Après une piqûre sans symptôme, on ne prescrit ni prophylaxie ni sérologie : on observe la peau et on vérifie la vaccination contre l’encéphalite à tiques.</div></section>

<section class="ilot" id="a69-pa-11"><h2><span class="n">11</span>Situations particulières</h2>
<p>Ces règles générales s’adaptent toutefois à certains terrains.</p>
<p><b>Grossesse et allaitement.</b> D’abord, l’information professionnelle suisse de la doxycycline interdit son administration pendant la grossesse sauf nécessité absolue et chez la femme qui allaite. C’est pourquoi la SSI prévoit des alternatives en cas de contre-indication : amoxicilline ou céfuroxime pour les formes cutanées, ceftriaxone pour les formes graves. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=65952" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Doxycyclin-Mepha®, février 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, traitement alternatif</a>.</p>
<p><b>Enfant.</b> Ensuite, la doxycycline colore les dents en formation ; chez l’enfant de 12 ans ou moins, l’information suisse la réserve aux situations graves sans autre option. Dès lors, la SSI donne la céfuroxime à 15 mg/kg toutes les 12 heures chez l’enfant. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=65952" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Doxycyclin-Mepha®, février 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, traitement alternatif</a>.</p>
<p><b>En cas d’insuffisance hépatique ou rénale, les précautions suivantes s’appliquent.</b> Par ailleurs, la doxycycline est contre-indiquée en cas de trouble sévère de la fonction hépatique. En revanche, la ceftriaxone ne demande pas d’adaptation rénale si la fonction hépatique est normale ; en insuffisance rénale préterminale (clairance inférieure à 10 mL/min) ou en dialyse, la dose ne dépasse pas 2 g par jour. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=65952" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Doxycyclin-Mepha®, février 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44625" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rocephin®, juin 2025</a>.</p>
<p><b>Le cas suivant récapitule la démarche.</b> Pour conclure, Mme L. reçoit de la doxycycline 100 mg toutes les 12 heures pendant 10 jours, sans sérologie, avec le conseil de prendre les comprimés en position assise avec un grand verre d’eau et d’éviter le soleil. De plus, sa vaccination contre l’encéphalite à tiques est vérifiée. Finalement, l’érythème disparaît ; par conséquent, aucun contrôle biologique n’est prévu.</p></section>

<section class="ilot" id="a69-pa-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<p>En synthèse, les critères et valeurs à retenir se résument ainsi.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Érythème migrant</td><td>Diamètre supérieur à 5 cm, 3 à 32 jours après la piqûre (médiane 7)</td></tr>
<tr><td><button class="w" data-k="a69-e-lcr">Neuroborréliose certaine (directive européenne)</button></td><td>Symptômes neurologiques + pléiocytose du LCR + anticorps produits dans le LCR ; deux critères sur trois : possible</td></tr>
<tr><td><button class="w" data-k="a69-pa-ptlds">Syndrome post-Lyme (SSI)</button></td><td>Symptômes persistant plus de 6 mois après un traitement adéquat d’une borréliose documentée</td></tr>
<tr><td>Bloc de cardite</td><td>Régression spontanée en 2 à 6 semaines</td></tr>
<tr><td>Tiques porteuses en Suisse</td><td>5 à 30 % (localement jusqu’à 50 %)</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque valeur correspond à une décision : le diamètre de 5 cm sépare l’érythème migrant d’une réaction locale, la régression du bloc en 2 à 6 semaines justifie une surveillance électrocardiographique plutôt qu’un stimulateur définitif, et le seuil de 6 mois définit le syndrome post-Lyme, qui ne justifie pas de nouvelles cures d’antibiotiques. <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic</a>.</div>
