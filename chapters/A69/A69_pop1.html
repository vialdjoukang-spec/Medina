<template data-pop="a69-pa-em" data-title="Érythème migrant : reconnaître sans examen">
<div class="lab">Définition clinique</div><p>Rougeur typiquement circulaire, de plusieurs centimètres (en général plus de 5 cm), qui s’étend de façon centrifuge autour du point de piqûre, apparue 3 à 32 jours après celle-ci (médiane 7 jours). Elle peut être homogène ou en cocarde ; elle peut être multiple en cas de dissémination.</p>
<div class="lab">Ce qui n’en est pas un</div><p>Un érythème rond de petite taille apparu rapidement après la piqûre est une réaction inflammatoire locale, toxique ou allergique, qui ne demande pas de traitement. Marquer son bord ou le photographier permet d’objectiver une éventuelle extension.</p>
<div class="lab">Conduite</div><p>Traitement antibiotique sans sérologie, souvent négative à ce stade.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic, peau</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », validée le 25 août 2025, questions fréquentes</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-pa-epid" data-title="Épidémiologie suisse : pourquoi la sérologie est souvent positive">
<div class="lab">Cas estimés</div><p>Sentinella 2008–2011 : 7 000 à 12 000 cas de borréliose par an, incidence annuelle 131 pour 100 000 ; 17 000 à 23 000 consultations pour piqûre de tique par an. Érythème migrant : 90 % des cas.</p>
<div class="lab">Séroprévalence</div><p>Environ 10 % chez les donneurs de sang ; plus élevée chez les forestiers et les orienteurs. La SSI cite plus de 30 % dans certaines populations suisses régulièrement exposées.</p>
<div class="lab">Tiques</div><p>5 à 30 % des tiques (localement 50 %) portent l’agent de la borréliose ; environ 0,5 % le virus de l’encéphalite à tiques.</p><div class="src">Sources : <a href="https://doi.org/10.4414/smw.2013.13725" target="_blank" rel="noopener" data-reference-source="1">Altpeter E et al., Swiss Med Wkly 2013;143:w13725 (OFSP, Sentinella 2008–2011)</a> ; <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », validée le 25 août 2025</a> ; <a href="https://www.infovac.ch/docs/public/fsme/faq-zecken-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, FAQ tiques (version imprimable, Infovac)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-s-especes" data-title="Espèces de borrélies et organotropisme">
<p>En Europe, au moins cinq espèces du complexe sont pathogènes ; <i>B. afzelii</i> et <i>B. garinii</i> dominent. Aux États-Unis, une seule espèce prédomine. Les manifestations tardives diffèrent : surtout arthritiques en Amérique du Nord, surtout cutanées (acrodermatite) en Europe.</p>
<p>Le lien précis entre chaque espèce et chaque organe n’est pas développé par les sources lues pour ce cours ; il n’est donc pas enseigné ici au-delà de cette différence continentale.</p><div class="src">Sources : <a href="https://doi.org/10.1007/s00105-005-0995-5" target="_blank" rel="noopener" data-reference-source="1">Hofmann H, Hautarzt 2005</a> ; <a href="https://doi.org/10.1136/bmj.m1041" target="_blank" rel="noopener" data-reference-source="1">Kullberg BJ et al., BMJ 2020</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-pa-tique" data-title="Piqûre de tique : conduite en consultation">
<div class="lab">Tique encore attachée</div><p>Retrait à la pince à épiler, doucement, perpendiculairement à la peau, sans rotation ; ne rien appliquer (vinaigre, huile). Pas de sérologie, pas d’antibioprophylaxie.</p>
<div class="lab">Piqûre sans symptôme</div><p>Expliquer la surveillance de la peau (marquer ou photographier toute rougeur nouvelle). Vérifier la vaccination contre l’encéphalite à tiques.</p>
<div class="lab">Rougeur au point de piqûre</div><p>Petite rougeur précoce : réaction locale. Rougeur de plus de 5 cm en extension : érythème migrant, à traiter sans sérologie. Ulcère avec adénopathie régionale : penser à une tularémie ulcéro-glandulaire et discuter un avis infectiologique.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », validée le 25 août 2025, questions fréquentes</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-pa-aca" data-title="Acrodermatite chronique atrophiante">
<p>Stade précoce : lésion rouge-violacée mal délimitée, avec œdème sous-cutané, souvent sur la face d’extension des membres. Stade final, plus de 6 mois après la piqûre : atrophie cutanée « en papier à cigarette », réseau veineux visible.</p><p>Confirmation par PCR sur biopsie cutanée (sensibilité estimée à 70 à 90 %). Traitement : doxycycline 100 mg toutes les 12 h pendant 21 à 28 jours. Le diagnostic précoce compte : les stades précoces régressent totalement, les stades tardifs seulement cessent de progresser.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic et thérapie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-pa-cardite" data-title="Cardite de Lyme">
<div class="lab">Clinique</div><p>Début aigu environ 3 semaines après la piqûre (4 jours à 7 mois). Troubles de la conduction atrioventriculaire, de l’allongement de PQ au bloc complet.</p>
<div class="lab">Évolution</div><p>Régression spontanée du bloc en 2 à 6 semaines ; stimulation temporaire rarement nécessaire.</p>
<div class="lab">Traitement</div><p>Bloc au plus du deuxième degré : doxycycline 100 mg toutes les 12 h, 14 à 21 jours. Bloc du troisième degré : ceftriaxone 2 g toutes les 24 h par voie intraveineuse, 28 jours.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, diagnostic et thérapie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-pa-ptlds" data-title="Syndrome post-Lyme : critères suisses">
<p>Un diagnostic probable exige : une borréliose documentée cliniquement et biologiquement ; un traitement adéquat documenté ; l’absence d’infection active ; des troubles persistants (fatigue, arthralgies, myalgies, dysfonction cognitive objectivée, troubles radiculaires) plus de 6 mois après la fin du traitement ; une cohérence chronologique (début pendant ou dans les 6 mois suivant la borréliose) ; l’exclusion systématique d’autres maladies.</p>
<p>Il faut exclure une neuroborréliose active par ponction lombaire et index sérum/LCR. Si le LCR est négatif ou après un premier traitement adéquat, de nouvelles cures d’antibiotiques ne servent à rien. Aucun traitement spécifique n’est validé : suivi symptomatique, thérapie cognitivo-comportementale, activité physique douce.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, syndrome post-Lyme</a> ; <a href="https://doi.org/10.4414/smw.2016.14353" target="_blank" rel="noopener" data-reference-source="1">Nemeth J et al., directive suisse sur le syndrome post-Lyme, Swiss Med Wkly 2016</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-e-sero" data-title="Interpréter une sérologie de Lyme">
<div class="lab">Ce qu’elle prouve</div><p>Une exposition aux borrélies, à un moment indéterminé.</p><div class="lab">Ce qu’elle ne prouve pas</div><p>L’activité de la maladie, son ancienneté, ni la guérison : elle est inutile pour le suivi.</p>
<div class="lab">Quand la demander</div><p>Suspicion de lymphocytome, d’acrodermatite, paralysie faciale périphérique, méningite lymphocytaire, myéloméningoradiculite, encéphalomyélite chronique progressive, monoarthrite, bloc atrioventriculaire transitoire.</p>
<div class="lab">Quand ne pas la demander</div><p>Érythème migrant, fatigue chronique, plaintes vagues, symptômes neurologiques flous sans antécédent de borréliose, suivi du traitement, piqûre sans symptôme.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, aspects importants et diagnostic</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-e-lcr" data-title="Ponction lombaire dans la neuroborréliose">
<p>Rechercher une pléiocytose lymphocytaire et calculer l’index d’anticorps spécifiques (IgG et IgM) entre sérum et LCR. Trois critères — symptômes neurologiques, pléiocytose, anticorps intrathécaux — définissent la forme certaine selon la directive européenne ; deux, la forme possible.</p>
<p>La PCR du LCR n’est interprétable que positive. Dans les formes de moins de six semaines, les anticorps intrathécaux peuvent manquer.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, neuroborréliose</a> ; <a href="https://doi.org/10.1111/j.1468-1331.2009.02862.x" target="_blank" rel="noopener" data-reference-source="1">Mygland A et al., directive de la Fédération européenne des sociétés de neurologie, Eur J Neurol 2010</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-p-doxy" data-title="Doxycycline">
<div class="lab">Mécanisme</div><p>Tétracycline, bactériostatique par inhibition de la synthèse protéique bactérienne.</p>
<div class="lab">Posologie dans la borréliose</div><p>SSI : 100 mg toutes les 12 h, durée selon la forme. Information suisse : stades 1 et 2, 100 mg deux fois par jour pendant 10 à 60 jours selon la clinique.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux tétracyclines ; trouble sévère de la fonction hépatique ; grossesse sauf nécessité absolue ; allaitement ; enfant de 12 ans ou moins hors situation grave sans alternative.</p>
<div class="lab">Effets indésirables et surveillance</div><p>Photosensibilisation fréquente ; ulcération œsophagienne si prise couchée ou sans eau ; réactions cutanées sévères rares ; hypertension intracrânienne bénigne.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=65952" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Doxycyclin-Mepha®, février 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, thérapie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-p-ceftri" data-title="Ceftriaxone">
<div class="lab">Mécanisme</div><p>Céphalosporine de troisième génération, bactéricide par inhibition de la synthèse de la paroi.</p>
<div class="lab">Posologie</div><p>SSI : 2 g toutes les 24 h par voie intraveineuse. Information suisse Rocephin® : maladie de Lyme disséminée (stades II et III), 50 mg/kg, 2 g au maximum, une fois par jour pendant 14 jours.</p>
<div class="lab">Fonction rénale</div><p>Pas d’adaptation si la fonction hépatique est normale ; au maximum 2 g par jour en insuffisance rénale préterminale et chez le dialysé.</p>
<div class="lab">Précautions</div><p>Contre-indiquée chez le nouveau-né recevant des solutions calciques intraveineuses. Précipitation biliaire réversible, surtout chez l’enfant.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44625" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rocephin®, juin 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, thérapie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-p-amox" data-title="Amoxicilline">
<p>Aminopénicilline, alternative à la doxycycline, notamment pendant la grossesse ou chez l’enfant. SSI : 500 mg toutes les 8 h, 14 à 21 jours pour la peau (28 jours pour l’acrodermatite), 30 à 60 jours pour l’arthrite. Information suisse Amoxi-Mepha® : érythème migrant isolé, 750 mg trois à quatre fois par jour pendant 12 jours.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, traitement alternatif</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44911" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Amoxi-Mepha®, août 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-p-cefur" data-title="Céfuroxime">
<p>Céphalosporine de deuxième génération orale. SSI : 500 mg toutes les 12 h, enfant 15 mg/kg toutes les 12 h, 14 à 21 jours. L’information suisse de Zinat® donne la même dose adulte pendant 14 à 21 jours et, de 3 mois à 12 ans, 15 mg/kg deux fois par jour (au maximum 1 000 mg par jour).</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, traitement alternatif</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49460" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zinat®, avril 2023</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-p-macro" data-title="Macrolides">
<p>Alternative cutanée seulement, en cas d’allergie ou de contre-indication : azithromycine 500 mg toutes les 24 h pendant 7 à 10 jours, ou clarithromycine 500 mg toutes les 12 h pendant 14 à 21 jours. Les informations suisses de Zithromax® et Klacid® mentionnent <i>Borrelia burgdorferi</i> parmi les espèces sensibles.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, traitement alternatif</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=51352" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zithromax®, mars 2023</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=50469" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Klacid®, mars 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-p-contentieux" data-title="Directive suisse ou information professionnelle ?">
<div class="lab">Divergence</div><p>La SSI (2025) recommande amoxicilline 500 mg toutes les 8 h pendant 14 à 21 jours pour les formes cutanées ; l’information Amoxi-Mepha® (août 2024) indique 750 mg trois à quatre fois par jour pendant 12 jours. Pour la ceftriaxone, la SSI module la durée de 14 à 28 jours selon la forme ; Rocephin® (juin 2025) indique 14 jours.</p>
<div class="lab">Lecture</div><p>L’information professionnelle fixe le cadre d’autorisation ; la directive de la société savante, plus récente et fondée sur des essais comme celui de Stupica (2023), précise la pratique. Une prescription hors des schémas de l’information professionnelle relève de la responsabilité du prescripteur et doit être documentée.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, thérapie</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44911" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Amoxi-Mepha®, août 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44625" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rocephin®, juin 2025</a> ; <a href="https://doi.org/10.1016/S1473-3099(22)00528-X" target="_blank" rel="noopener" data-reference-source="1">Stupica D et al., Lancet Infect Dis 2023</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-a69-clinique" data-title="Loi de Pareto — Reconnaître et confirmer la borréliose">
<p class="ratio" data-cover="a69-pa-1,a69-pa-2,a69-pa-3,a69-pa-5,a69-pa-6,a69-pa-7"></p><ul><li>Érythème migrant : plus de 5 cm, en extension, 3 à 32 jours après la piqûre ; diagnostic clinique, pas de sérologie.</li><li>Formes disséminées : lymphocytome, nerf facial et racines, méningite, troubles de conduction.</li><li>Formes tardives : arthrite du genou, acrodermatite, encéphalomyélite.</li><li>Sérologie (ELISA puis immunoblot) = exposition, jamais activité ; inutile pour le suivi.</li><li>Neuroborréliose : LCR (pléiocytose et anticorps intrathécaux).</li></ul>
</template>
<template data-pop="pareto-a69-traitement" data-title="Loi de Pareto — Traiter selon la forme">
<p class="ratio" data-cover="a69-pa-8,a69-pa-9,a69-pa-10"></p><ul><li>Doxycycline 100 mg toutes les 12 h : peau 7 à 10 jours, acrodermatite 21 à 28, arthrite 28.</li><li>Ceftriaxone 2 g par jour intraveineuse : bloc complet, atteinte parenchymateuse.</li><li>Pas de prophylaxie ni de sérologie après piqûre ; vérifier la vaccination contre l’encéphalite à tiques.</li><li>Syndrome post-Lyme : pas de nouvelles cures d’antibiotiques.</li></ul>
</template>
<template data-pop="pareto-a69-examens" data-title="Loi de Pareto — Examens de la borréliose">
<p class="ratio" data-cover="a69-e-1,a69-e-2,a69-e-3,a69-e-4,a69-e-5"></p><ul><li>Aucun examen devant un érythème migrant.</li><li>Sérologie seulement si manifestation compatible ; faux négatifs précoces, positifs non pertinents fréquents.</li><li>LCR : référence neurologique. PCR : peau et synoviale. Électrocardiogramme : degré du bloc.</li></ul>
</template>
<template data-pop="pareto-a69-pharma" data-title="Loi de Pareto — Pharmacologie de la borréliose">
<p class="ratio" data-cover="a69-p-1,a69-p-2,a69-p-3,a69-p-4"></p><ul><li>Doxycycline première ligne ; bêtalactamines en alternative ou par voie intraveineuse ; macrolides en dernier recours cutané.</li><li>Doxycycline : séparer des cations, éviter isotrétinoïne, surveiller la warfarine, éviter le soleil, prendre debout avec de l’eau.</li><li>Ni prophylaxie, ni traitement d’une sérologie isolée, ni cures répétées.</li></ul>
</template>
<template data-pop="a69-pa-stades" data-title="Stades de la borréliose de Lyme (SSI)">
<div class="lab">Précoce localisé</div><p>Érythème migrant, 3 à 32 jours après la piqûre ; diagnostic clinique.</p><div class="lab">Précoce disséminé</div><p>Érythèmes multiples, lymphocytome bénin (dans les 2 mois), neuroborréliose précoce, cardite (vers 3 semaines, 4 jours à 7 mois) ; confirmation biologique.</p><div class="lab">Tardif</div><p>Arthrite (4 à 6 mois, 2 semaines à 2 ans), acrodermatite chronique atrophiante (au-delà de 6 mois), encéphalomyélite chronique, neuropathie ; confirmation biologique.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, manifestations et diagnostic</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-pa-stupica" data-title="Essai de Stupica 2023">
<p>Essai slovène de non-infériorité chez 300 adultes avec érythème migrant isolé : doxycycline 7 jours contre 14 jours. Échec 3 % contre 2 % ; la durée courte n’était donc pas inférieure. C’est l’une des bases de la durée de 7 à 10 jours retenue par la SSI.</p><div class="src">Sources : <a href="https://doi.org/10.1016/S1473-3099(22)00528-X" target="_blank" rel="noopener" data-reference-source="1">Stupica D et al., Lancet Infect Dis 2023</a> ; <a href="https://ssi.guidelines.ch/guideline/2274/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Borréliose, maladie de Lyme », validée le 2 mai 2025, thérapie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a69-pa-fsme" data-title="Vaccination contre l’encéphalite à tiques">
<p>Recommandée dans toute la Suisse sauf au Tessin. Elle protège contre le virus de l’encéphalite à tiques, transmis dès le début du repas de la tique ; en revanche, elle ne protège pas contre la borréliose, pour laquelle aucun vaccin humain n’est autorisé.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/5083/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Piqûre de tique », validée le 25 août 2025, introduction et questions fréquentes</a>. Textes lus le 9 octobre 2026.</div>
</template>
