<template data-pop="pareto-k51-clinique" data-title="Loi de Pareto — Rectocolite hémorragique"><p class="ratio" data-cover="k51-1,k51-5,k51-6,k51-7,k51-8,k51-9,k51-10"></p><ul><li>Inflammation muqueuse continue depuis le rectum.</li><li>Exclure C. difficile ; coloscopie et biopsies.</li><li>Truelove et Witts : ≥ 6 selles sanglantes + 1 critère systémique.</li><li>Légère à modérée : mésalazine orale ≥ 2 g/j ± rectale ≥ 1 g/j.</li><li>Modérée à sévère : prednisolone, puis biothérapie ou tofacitinib.</li><li>Colite aiguë grave : corticoïdes IV ; sauvetage infliximab ou ciclosporine.</li><li>Entretien : 5-ASA ≥ 2 g/j ; surveillance du cancer.</li></ul></template>
<template data-pop="pareto-k51-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k51-e-1,k51-e-2"></p><ul><li>Calprotectine : inflammation et suivi.</li><li>C. difficile à chaque poussée ; CMV si grave.</li><li>Coloscopie : continuité depuis le rectum.</li><li>Colite grave : rectosigmoïdoscopie, pas de coloscopie totale.</li></ul></template>
<template data-pop="pareto-k51-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k51-p-1,k51-p-2,k51-p-3"></p><ul><li>5-ASA : traitement de fond de première ligne.</li><li>Distale : traitement rectal indispensable.</li><li>Corticoïdes : induction seule.</li><li>Tofacitinib : 10 mg 2×/j puis 5 mg 2×/j ; risque thromboembolique.</li><li>Mésalazine : surveiller la fonction rénale.</li></ul></template>
<template data-pop="k51-tenesme" data-title="Épreintes et ténesme"><p class="lab">Épreintes</p><p>Douleurs coliques précédant l’évacuation.</p><p class="lab">Ténesme</p><p>Sensation de tension rectale et besoin d’évacuer sans résultat.</p><p class="lab">Valeur</p><p>Signes d’atteinte rectale.</p></template>
<template data-pop="k51-montreal" data-title="Classification de Montréal (rectocolite)"><p class="lab">E1</p><p>Proctite : rectum seul.</p><p class="lab">E2</p><p>Colite gauche : en aval de l’angle colique gauche.</p><p class="lab">E3</p><p>Colite étendue : au-delà de l’angle colique gauche.</p><p class="src">Références : <a href="https://doi.org/10.1136/gut.2005.082909" target="_blank" rel="noopener">Satsangi J. et al., The Montreal classification of inflammatory bowel disease, Gut 2006;55:749-753</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-cagg" data-title="Colite aiguë grave"><p class="lab">Définition</p><p>Critères de Truelove et Witts réunis.</p><p class="lab">Conduite</p><p>Hospitalisation, corticoïdes IV, équipe médico-chirurgicale.</p><p class="lab">Pronostic</p><p>Jusqu’à 30 % de colectomies après échec du traitement conservateur.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a> ; <a href="https://doi.org/10.1136/bmj.2.4947.1041" target="_blank" rel="noopener">Truelove S. C., Witts L. J., Cortisone in ulcerative colitis: final report on a therapeutic trial, Br Med J 1955;2:1041-1048</a>.</p></template>
<template data-pop="k51-tw" data-title="Critères de Truelove et Witts"><p class="lab">Critère majeur</p><p>≥ 6 selles sanglantes par jour.</p><p class="lab">Et au moins un</p><p>Fréquence cardiaque > 90/min ; température > 37,8 °C ; hémoglobine < 10,5 g/dl ; vitesse de sédimentation > 30 mm/h.</p><p class="src">Références : <a href="https://doi.org/10.1136/bmj.2.4947.1041" target="_blank" rel="noopener">Truelove S. C., Witts L. J., Cortisone in ulcerative colitis: final report on a therapeutic trial, Br Med J 1955;2:1041-1048</a>.</p></template>
<template data-pop="k51-mayo" data-title="Score de Mayo"><p class="lab">Items (0-3 chacun)</p><p>Fréquence des selles, rectorragies, aspect endoscopique, appréciation globale du médecin.</p><p class="lab">Total</p><p>0 à 12.</p><p class="lab">Usage</p><p>Essais cliniques, suivi ; sous-score endoscopique 0-3.</p></template>
<template data-pop="k51-csp" data-title="Cholangite sclérosante primitive"><p class="lab">Définition</p><p>Inflammation et fibrose des voies biliaires intra- et extrahépatiques.</p><p class="lab">Lien</p><p>Associée surtout à la rectocolite ; augmente le risque de cancer colorectal et de cholangiocarcinome.</p></template>
<template data-pop="k51-abces" data-title="Abcès cryptiques"><p class="lab">Aspect</p><p>Polynucléaires dans la lumière des cryptes.</p><p class="lab">Valeur</p><p>Signe d’activité ; non spécifique isolément.</p></template>
<template data-pop="k51-megacolon" data-title="Mégacôlon toxique"><p class="lab">Définition</p><p>Dilatation colique aiguë avec toxicité systémique au cours d’une colite grave.</p><p class="lab">Risque</p><p>Perforation.</p><p class="lab">Conduite</p><p>Urgence médico-chirurgicale ; colectomie si absence d’amélioration rapide.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
<template data-pop="k51-mei" data-title="Manifestations extra-intestinales"><p class="lab">Exemples</p><p>Arthrites, érythème noueux, pyoderma gangrenosum, uvéite, épisclérite, cholangite sclérosante primitive.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-cmv" data-title="Cytomégalovirus"><p class="lab">Contexte</p><p>Réactivation dans les colites graves ou réfractaires aux corticoïdes.</p><p class="lab">Diagnostic</p><p>Biopsies coliques (histologie, immunohistochimie, PCR).</p></template>
<template data-pop="k51-calpro" data-title="Calprotectine fécale"><p class="lab">Usage</p><p>Confirmer l’inflammation colique ; suivre la réponse.</p><p class="lab">Limite</p><p>Élevée aussi dans les infections et sous AINS.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-colo" data-title="Coloscopie avec biopsies"><p class="lab">Objectifs</p><p>Diagnostic, étendue, gravité endoscopique (Mayo 0-3), biopsies étagées.</p><p class="lab">Colite grave</p><p>Rectosigmoïdoscopie prudente plutôt que coloscopie totale.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-surveillance" data-title="Coloscopie de surveillance"><p class="lab">But</p><p>Dépister la dysplasie et le cancer colorectal.</p><p class="lab">Facteurs</p><p>Durée, étendue, inflammation, cholangite sclérosante primitive.</p><p class="lab">Délai et rythme</p><p>TODO : recommandation ECCO de surveillance non lue.</p></template>
<template data-pop="k51-colectomie" data-title="Coloproctectomie"><p class="lab">Indications</p><p>Colite grave réfractaire, maladie réfractaire, dysplasie non résécable, cancer.</p><p class="lab">Reconstruction</p><p>Anastomose iléo-anale avec réservoir ou iléostomie.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
<template data-pop="k51-cs" data-title="Corticoïdes systémiques"><p class="lab">Ambulatoire</p><p>Prednisolone orale : induction des formes modérées à sévères (recommandation forte).</p><p class="lab">Colite grave</p><p>Voie intraveineuse en première ligne.</p><p class="lab">Jamais</p><p>En entretien.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
<template data-pop="k51-thiopurines" data-title="Thiopurines"><p class="lab">Place</p><p>Entretien chez le patient corticodépendant ou intolérant au 5-ASA (recommandation forte) ; pas d’induction.</p><p class="lab">Surveillance</p><p>Formule sanguine ; TPMT ou NUDT15 avant.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-antitnf" data-title="Anti-TNF"><p class="lab">Molécules</p><p>Infliximab, adalimumab, golimumab.</p><p class="lab">Place</p><p>Induction et entretien (recommandations fortes) ; infliximab en sauvetage de la colite grave.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
<template data-pop="k51-d-mesalazine" data-title="Mésalazine (5-ASA)"><p class="lab">Indication suisse (Pentasa®)</p><p>Poussées et prévention des récidives de rectocolite, proctosigmoïdite, proctite.</p><p class="lab">Doses</p><p>Orale jusqu’à 4 g/j ; lavement 1 g le soir 2-4 semaines ; ECCO : ≥ 2 g/j oral, ≥ 1 g/j rectal.</p><p class="lab">Contre-indications</p><p>Insuffisance hépatique ou rénale sévère, ulcère gastroduodénal, tendance hémorragique.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Pentasa®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-d-budmmx" data-title="Budésonide MMX (Cortiment® MMX®)"><p class="lab">Indication suisse</p><p>Induction de la rémission d’une colite légère à modérée si le 5-ASA est insuffisant.</p><p class="lab">Dose</p><p>9 mg le matin, jusqu’à 8 semaines ; réduction progressive à l’arrêt.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cortiment® MMX®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-d-vedolizumab" data-title="Védolizumab"><p class="lab">Cible</p><p>Intégrine α4β7.</p><p class="lab">Place</p><p>Induction et entretien (recommandations fortes) ; suggéré plutôt que l’adalimumab.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-d-tofacitinib" data-title="Tofacitinib (Xeljanz®)"><p class="lab">Indication suisse</p><p>Colite ulcéreuse active modérée à sévère après échec des corticoïdes, de l’azathioprine, de la 6-mercaptopurine ou d’un anti-TNF.</p><p class="lab">Dose</p><p>10 mg 2×/j ≥ 8 semaines, puis 5 mg 2×/j ; arrêt si pas de réponse à 16 semaines.</p><p class="lab">Risque</p><p>Embolies pulmonaires et thromboses accrues par rapport aux anti-TNF.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeljanz®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-d-infliximab" data-title="Infliximab de sauvetage"><p class="lab">Indication</p><p>Colite aiguë grave réfractaire aux corticoïdes IV (ECCO 2022, énoncé 1.2).</p><p class="lab">Schéma</p><p>Régime optimal non établi (énoncé 1.3).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
<template data-pop="k51-d-ciclosporine" data-title="Ciclosporine de sauvetage"><p class="lab">Indication</p><p>Alternative à l’infliximab dans la colite aiguë grave réfractaire aux corticoïdes.</p><p class="lab">Condition</p><p>Prévoir un traitement d’entretien ; expérience du centre.</p><p class="lab">Surveillance</p><p>Pression artérielle, fonction rénale, taux sanguins.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
