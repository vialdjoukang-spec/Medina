<template data-pop="pareto-k51-clinique" data-title="Loi de Pareto — Rectocolite hémorragique"><p class="ratio" data-cover="k51-1,k51-5,k51-6,k51-7,k51-8,k51-9,k51-10"></p><ul><li>Inflammation muqueuse continue depuis le rectum.</li><li>On exclut C. difficile, puis on fait une coloscopie avec biopsies.</li><li>Truelove et Witts : ≥ 6 selles sanglantes + 1 critère systémique.</li><li>La forme légère à modérée reçoit de la mésalazine orale ≥ 2 g/j, éventuellement avec la voie rectale ≥ 1 g/j.</li><li>La forme modérée à sévère reçoit de la prednisolone, puis une biothérapie ou du tofacitinib.</li><li>La colite aiguë grave reçoit des corticoïdes IV, puis de l’infliximab ou de la ciclosporine en sauvetage.</li><li>Entretien : 5-ASA ≥ 2 g/j ; surveillance du cancer.</li></ul></template>
<template data-pop="pareto-k51-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k51-e-1,k51-e-2"></p><ul><li>Calprotectine : inflammation et suivi.</li><li>On recherche C. difficile à chaque poussée et le CMV si la forme est grave.</li><li>La coloscopie montre une atteinte continue depuis le rectum.</li><li>Dans la colite grave, on fait une rectosigmoïdoscopie, mais pas de coloscopie totale.</li></ul></template>
<template data-pop="pareto-k51-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k51-p-1,k51-p-2,k51-p-3"></p><ul><li>5-ASA : traitement de fond de première ligne.</li><li>La forme distale exige un traitement rectal.</li><li>Les corticoïdes ne servent qu’à l’induction.</li><li>Le tofacitinib se donne à 10 mg 2×/j, puis à 5 mg 2×/j, et expose au risque thromboembolique.</li><li>Mésalazine : surveiller la fonction rénale.</li></ul></template>
<template data-pop="k51-tenesme" data-title="Épreintes et ténesme"><p class="lab">Épreintes</p><p>Douleurs coliques précédant l’évacuation.</p><p class="lab">Ténesme</p><p>Sensation de tension rectale et besoin d’évacuer sans résultat.</p><p class="lab">Valeur</p><p>Ils signent une atteinte rectale, car le rectum inflammatoire déclenche de faux besoins.</p></template>
<template data-pop="k51-montreal" data-title="Classification de Montréal (rectocolite)"><p class="lab">E1</p><p>E1 désigne la proctite, limitée au rectum.</p><p class="lab">E2</p><p>Colite gauche : en aval de l’angle colique gauche.</p><p class="lab">E3</p><p>Colite étendue : au-delà de l’angle colique gauche.</p><p class="src">Références : <a href="https://doi.org/10.1136/gut.2005.082909" target="_blank" rel="noopener">Satsangi J. et al., The Montreal classification of inflammatory bowel disease, Gut 2006;55:749-753</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-cagg" data-title="Colite aiguë grave"><p class="lab">Définition</p><p>Elle se définit par les critères de Truelove et Witts réunis.</p><p class="lab">Conduite</p><p>On hospitalise le patient, on donne des corticoïdes IV et l’on réunit une équipe médico-chirurgicale, car une colectomie peut devenir urgente.</p><p class="lab">Pronostic</p><p>Jusqu’à 30 % des patients sont colectomisés après l’échec du traitement conservateur.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a> ; <a href="https://doi.org/10.1136/bmj.2.4947.1041" target="_blank" rel="noopener">Truelove S. C., Witts L. J., Cortisone in ulcerative colitis: final report on a therapeutic trial, Br Med J 1955;2:1041-1048</a>.</p></template>
<template data-pop="k51-tw" data-title="Critères de Truelove et Witts"><p class="lab">Critère majeur</p><p>≥ 6 selles sanglantes par jour.</p><p class="lab">Et au moins un</p><p>Il faut en plus au moins un critère systémique : fréquence cardiaque > 90/min, température > 37,8 °C, hémoglobine < 10,5 g/dl ou vitesse de sédimentation > 30 mm/h.</p><p class="src">Références : <a href="https://doi.org/10.1136/bmj.2.4947.1041" target="_blank" rel="noopener">Truelove S. C., Witts L. J., Cortisone in ulcerative colitis: final report on a therapeutic trial, Br Med J 1955;2:1041-1048</a>.</p></template>

<template data-pop="k51-mei" data-title="Manifestations extra-intestinales"><p class="lab">Exemples</p><p>Les arthrites, l’érythème noueux, le pyoderma gangrenosum, l’uvéite, l’épisclérite et la cholangite sclérosante primitive en sont des exemples.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-cmv" data-title="Cytomégalovirus"><p class="lab">Contexte</p><p>Il se réactive dans les colites graves ou réfractaires aux corticoïdes, car l’inflammation et l’immunosuppression favorisent sa réplication.</p><p class="lab">Diagnostic</p><p>Biopsies coliques (histologie, immunohistochimie, PCR).</p></template>
<template data-pop="k51-calpro" data-title="Calprotectine fécale"><p class="lab">Usage</p><p>Confirmer l’inflammation colique ; suivre la réponse.</p><p class="lab">Limite</p><p>Elle s’élève aussi dans les infections et sous AINS.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-colo" data-title="Coloscopie avec biopsies"><p class="lab">Objectifs</p><p>Diagnostic, étendue, gravité endoscopique (Mayo 0-3), biopsies étagées.</p><p class="lab">Colite grave</p><p>Rectosigmoïdoscopie prudente plutôt que coloscopie totale.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-surveillance" data-title="Coloscopie de surveillance"><p class="lab">But</p><p>Dépister la dysplasie et le cancer colorectal.</p><p class="lab">Facteurs</p><p>Durée, étendue, inflammation, cholangite sclérosante primitive.</p><p class="lab">Délai et rythme</p><p>TODO : recommandation ECCO de surveillance non lue.</p></template>
<template data-pop="k51-colectomie" data-title="Coloproctectomie"><p class="lab">Indications</p><p>Colite grave réfractaire, maladie réfractaire, dysplasie non résécable, cancer.</p><p class="lab">Reconstruction</p><p>Anastomose iléo-anale avec réservoir ou iléostomie.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
<template data-pop="k51-cs" data-title="Corticoïdes systémiques"><p class="lab">Ambulatoire</p><p>La prednisolone orale induit la rémission des formes modérées à sévères (recommandation forte).</p><p class="lab">Colite grave</p><p>La voie intraveineuse est la première ligne.</p><p class="lab">Jamais</p><p>En entretien.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
<template data-pop="k51-thiopurines" data-title="Thiopurines"><p class="lab">Place</p><p>Elles servent à l’entretien chez le patient corticodépendant ou intolérant au 5-ASA (recommandation forte), mais pas à l’induction, car elles agissent lentement.</p><p class="lab">Surveillance</p><p>On contrôle la formule sanguine et l’on teste la TPMT ou NUDT15 avant de les prescrire.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-antitnf" data-title="Anti-TNF"><p class="lab">Molécules</p><p>Infliximab, adalimumab, golimumab.</p><p class="lab">Place</p><p>Ils servent à l’induction et à l’entretien (recommandations fortes), et l’infliximab sert de sauvetage dans la colite grave.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
<template data-pop="k51-d-mesalazine" data-title="Mésalazine (5-ASA)"><p class="lab">Indication suisse (Pentasa®)</p><p>Pentasa® est autorisé pour les poussées et la prévention des récidives de rectocolite, de proctosigmoïdite et de proctite.</p><p class="lab">Doses</p><p>La voie orale va jusqu’à 4 g/j, et le lavement se donne à 1 g le soir pendant 2 à 4 semaines ; l’ECCO recommande ≥ 2 g/j par voie orale et ≥ 1 g/j par voie rectale.</p><p class="lab">Contre-indications</p><p>Elle est contre-indiquée en cas d’insuffisance hépatique ou rénale sévère, d’ulcère gastroduodénal et de tendance hémorragique.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Pentasa®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-d-budmmx" data-title="Budésonide MMX (Cortiment® MMX®)"><p class="lab">Indication suisse</p><p>Induction de la rémission d’une colite légère à modérée si le 5-ASA est insuffisant.</p><p class="lab">Dose</p><p>On donne 9 mg le matin jusqu’à 8 semaines, puis l’on réduit progressivement à l’arrêt.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cortiment® MMX®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-d-vedolizumab" data-title="Védolizumab"><p class="lab">Cible</p><p>Intégrine α4β7.</p><p class="lab">Place</p><p>Il sert à l’induction et à l’entretien (recommandations fortes), et l’ECCO le suggère plutôt que l’adalimumab.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-d-tofacitinib" data-title="Tofacitinib (Xeljanz®)"><p class="lab">Indication suisse</p><p>Colite ulcéreuse active modérée à sévère après échec des corticoïdes, de l’azathioprine, de la 6-mercaptopurine ou d’un anti-TNF.</p><p class="lab">Dose</p><p>On donne 10 mg 2×/j pendant ≥ 8 semaines, puis 5 mg 2×/j, et l’on arrête en l’absence de réponse à 16 semaines.</p><p class="lab">Risque</p><p>Il augmente les embolies pulmonaires et les thromboses par rapport aux anti-TNF.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xeljanz®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></template>
<template data-pop="k51-d-infliximab" data-title="Infliximab de sauvetage"><p class="lab">Indication</p><p>Colite aiguë grave réfractaire aux corticoïdes IV (ECCO 2022, énoncé 1.2).</p><p class="lab">Schéma</p><p>Régime optimal non établi (énoncé 1.3).</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
<template data-pop="k51-d-ciclosporine" data-title="Ciclosporine de sauvetage"><p class="lab">Indication</p><p>Elle remplace l’infliximab dans la colite aiguë grave réfractaire aux corticoïdes.</p><p class="lab">Condition</p><p>Il faut prévoir un traitement d’entretien et disposer de l’expérience du centre.</p><p class="lab">Surveillance</p><p>On surveille la pression artérielle, la fonction rénale et les taux sanguins, car elle est néphrotoxique et hypertensive.</p><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></template>
