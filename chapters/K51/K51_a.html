<div class="chap-head"><div class="code">K51 — Colite ulcéreuse (rectocolite hémorragique) · CIM-10-GM 2024 · Côlon et rectum</div>

<section class="ilot" id="k51-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 32 ans, non fumeuse, a depuis six semaines des selles glaireuses et sanglantes, cinq fois par jour, avec des <button class="w" data-k="k51-tenesme">épreintes et un ténesme</button>. Or, les coprocultures sont négatives et la <button class="w" data-k="k51-calpro">calprotectine</button> fécale est très élevée. <b>La question est donc de savoir s’il s’agit d’une rectocolite hémorragique, quelle en est l’étendue et la gravité, et quel traitement débuter.</b></p><p>Pour y répondre, le médecin doit savoir : confirmer le diagnostic par l’endoscopie et l’histologie ; définir l’étendue selon la <button class="w" data-k="k51-montreal">classification de Montréal</button> ; mesurer la gravité et reconnaître la <button class="w" data-k="k51-cagg">colite aiguë grave</button> par les <button class="w" data-k="k51-tw">critères de Truelove et Witts</button> ; choisir la voie et la molécule, d’abord la <button class="w" data-k="k51-d-mesalazine">mésalazine</button> ; enfin, organiser l’entretien et la surveillance.</p><div class="key"><b>Point de départ.</b> Diarrhée sanglante, glaires, ténesme, calprotectine élevée et coprocultures négatives : penser rectocolite hémorragique.</div></section>
<section class="ilot" id="k51-1"><h2><span class="n">1</span>Définition</h2><p>La rectocolite hémorragique est une maladie inflammatoire chronique de l’intestin, caractérisée par une inflammation du côlon qui s’étend de façon continue depuis le rectum, sur une longueur variable (ECCO 2022). Ainsi, à la différence de la maladie de Crohn, elle épargne l’intestin grêle et reste limitée à la muqueuse ; de plus, elle évolue par poussées et rémissions.</p><p>Par conséquent, l’étendue de l’atteinte structure toute la prise en charge. En effet, une proctite relève souvent d’un traitement local, alors qu’une colite étendue exige un traitement oral. C’est pourquoi la CIM-10-GM distingue notamment la pancolite (K51.0), la proctite (K51.2), la rectosigmoïdite (K51.3) et la colite gauche (K51.5).</p><table class="t"><tr><th>Étendue (Montréal)</th><th>Limite</th><th>Traitement de première ligne d’une poussée légère à modérée</th></tr><tr><td>E1 : proctite</td><td>Rectum seul</td><td>Mésalazine rectale (suppositoire)</td></tr><tr><td>E2 : colite gauche</td><td>En aval de l’angle colique gauche</td><td>Mésalazine rectale + orale</td></tr><tr><td>E3 : colite étendue</td><td>Au-delà de l’angle colique gauche</td><td>Mésalazine orale (+ rectale)</td></tr></table><p>Le tableau se lit de haut en bas : en effet, plus l’atteinte remonte, plus le traitement oral devient indispensable, car le traitement rectal n’atteint pas le côlon proximal.</p><div class="key"><b>À retenir.</b> Inflammation muqueuse continue depuis le rectum ; étendue E1, E2, E3 ; l’étendue décide de la voie d’administration.</div><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a> ; <a href="https://doi.org/10.1136/gut.2005.082909" target="_blank" rel="noopener">Satsangi J. et al., The Montreal classification of inflammatory bowel disease, Gut 2006;55:749-753</a>.</p></section>
<section class="ilot" id="k51-2"><h2><span class="n">2</span>Épidémiologie et facteurs de risque</h2><p>Après la définition, il faut situer la patiente. Ainsi, la maladie débute surtout chez l’adulte jeune, avec un second pic possible plus tard dans la vie. De plus, elle résulte, comme la maladie de Crohn, d’une interaction entre gènes, microbiote et environnement. Cependant, le tabac a ici un effet inverse : en effet, l’arrêt du tabac est souvent suivi de l’apparition ou de l’aggravation de la maladie, ce qui ne justifie évidemment pas de fumer.</p><p>Par ailleurs, la rectocolite s’associe à la <button class="w" data-k="k51-csp">cholangite sclérosante primitive</button>, qui en aggrave le risque de cancer colorectal. En outre, l’ancienneté, l’étendue et l’intensité de l’inflammation augmentent ce risque ; c’est pourquoi une surveillance endoscopique est organisée.</p><div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée suisse d’incidence vérifiée n’a été retrouvée dans les sources lues ; aucun chiffre n’est donc avancé.</div><div class="key"><b>À retenir.</b> Adulte jeune ; tabac « protecteur » paradoxal ; association à la cholangite sclérosante primitive ; risque de cancer colorectal selon durée, étendue, inflammation.</div><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></section>
<section class="ilot" id="k51-3"><h2><span class="n">3</span>Physiopathologie</h2><p>Pour comprendre la clinique, il faut partir de la muqueuse. D’abord, la barrière épithéliale colique et sa couche de mucus sont altérées ; ainsi, le microbiote stimule de façon excessive l’immunité muqueuse. Ensuite, des lymphocytes T et des polynucléaires infiltrent la muqueuse, envahissent les cryptes et forment des <button class="w" data-k="k51-abces">abcès cryptiques</button>, puis des ulcérations.</p><p>Par conséquent, la muqueuse saigne et sécrète du mucus, et le rectum enflammé provoque le <button class="w" data-k="k51-tenesme">ténesme</button> et les besoins impérieux. Toutefois, comme l’inflammation reste superficielle, les fistules sont rares ; en revanche, une poussée grave peut paralyser la musculeuse et dilater le côlon, ce qui définit le <button class="w" data-k="k51-megacolon">mégacôlon toxique</button>.</p><div class="key"><b>À retenir.</b> Barrière muqueuse altérée → inflammation muqueuse continue → abcès cryptiques, ulcérations → saignement, glaires, ténesme ; forme grave : mégacôlon toxique.</div><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></section>
<section class="ilot" id="k51-4"><h2><span class="n">4</span>Présentation clinique</h2><p>La présentation reflète donc l’étendue et la gravité. Ainsi, la proctite donne des rectorragies, des glaires, des épreintes et un <button class="w" data-k="k51-tenesme">ténesme</button>, parfois avec une constipation paradoxale ; à l’inverse, la colite étendue provoque une diarrhée sanglante fréquente, des douleurs abdominales et, dans les formes graves, de la fièvre, une tachycardie et une anémie.</p><p>De plus, l’examen recherche des <button class="w" data-k="k51-mei">manifestations extra-intestinales</button> articulaires, cutanées, oculaires ou hépatobiliaires. Par ailleurs, devant toute poussée, il faut éliminer une infection, en particulier par Clostridioides difficile, et, dans une forme grave ou réfractaire, une infection à <button class="w" data-k="k51-cmv">cytomégalovirus</button>.</p><figure><img src="data:image/gif;base64,R0lGODdhzAFeAYUAAPv00Pzul/jZrPvWeP29jP27a+68hPyogfynafyadvyZYvWgbtmeePeQa/aIZ/eKWPZ/YfN+U/F0U9iMX9eAWdZ1WNZzSsB7VKl4WetnS9pmSstoTMthSLxoTLxhSKhlT6dkQspaRKlZRb1PPp9NQJJZR5BJQHpKRHM4NU4pKiQJGRMHGQ8HGAkIFggEFQcCEgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAzAFeAUAI/wBbrBi4ogWLgSxYtFjIsGGLFwtfHGwocaELiC5cNEx4kCBCiSsOcmThIqFEiSIPvlAhAIDLlzBjypxJs6ZLAThzDtjJM4DPADwHAA0a9KfRADYBCDAwgUIECRmiZoiw4MCBqgSyGjCg1QDOrlnDEuCq1eoBBGjTIihQYCsDrjnjyo3b1YDVBXitJkhQlWzYnFtzKp37devYAVkJ5xTLuPHixlkLIMhr1mzVymgvW816Ny9eypbxMphAegHp0xROk67QofWHDxhQqDhZkqDCjh5z285ocCFHjyRDpsQtHCFChb5HToSokqRBhSsuOnTIAmL0kh1/h7z4AmVCgSEfpv9ISr68zbljDbBli3a9+wJE4/c8St9nUgEE8CpQoBbt2cn6fSYgXgjc5d9/COzHX39rsdXVen411hleCRzA12eVXbUAgAiARZdiOL2EHmJhFYCgWu/t9N6K7pWVIWcaZliZZi9mOCBeqk3AwGioUXDBjz+21sFrr8lm23EEqaACcAplhF1CCD15nAsIJcfRC8clxxBHDmHHnUa1/WYSRFs2aSVJ1UmkAngvnHBffXDaZ95MgBGgomQKPPBAgyyuJ198cc6p1FiRsXWAVibKiFmCCyroqAKfPdoee5OxtZVVEYZlF4H/nUWggg/wB5pdh4pFV1g8WYoYiHJpauedfb7/dyCApR4gmVmQiaWohbvWquECFSbQwGkLDDuBsRRUsIGQHgjZgQgkmEDCByWUgEIKSwK3UnEXEWeckrpF9wKVUBYXrm24 <section class="ilot" id="k51-5"><h2><span class="n">5</span>Démarche diagnostique</h2><p>Devant ce tableau, le diagnostic associe arguments cliniques, biologiques, endoscopiques et histologiques. D’abord, la biologie évalue l’inflammation (CRP), l’anémie et l’albumine, et la <button class="w" data-k="k51-calpro">calprotectine fécale</button> confirme l’inflammation colique. De plus, les coprocultures et la recherche de Clostridioides difficile écartent une colite infectieuse.</p><p>Ensuite, la <button class="w" data-k="k51-colo">coloscopie</button> avec iléoscopie montre une atteinte continue depuis le rectum et en fixe l’étendue ; en outre, des biopsies étagées documentent une inflammation chronique, avec distorsion architecturale des cryptes. Cependant, en cas de colite grave, une rectosigmoïdoscopie prudente, sans préparation complète, suffit, car la coloscopie totale expose à la perforation.</p><figure><img src="data:image/gif;base64,R0lGODdhzAFZAYUAAP//////+/r//P/7/vv7+//z//nz+/7p/v7e/vTh9/zS/fzK/fy9/PDN9fC79N7B5/qt+uis7/qg+uig7veR9+aR7O+C8O5y7tWl4tWM4b2d0beIzcx72stt17JzyZhxtdFb17FYxZNcs5BNsKY/uII9ppcmqHsimmQ9jlwmiWIXi0EVdVcFfj4EcSYCahYBQwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAzAFZAUAI/wABCBxIsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatw4UYBHggECEADQoIQICRUuXABRoQABASEHDABAgEAAjjhz6tzJs6fPn0CDCs3p8SOAmSEDFD2woYMFCA4QyPQYcqjVq1izat2qMWlCr1yH2pRZAEGBAwsyhLAAoi0IChIYHJhbQCaAAw8UlMXgoEGCugCS3gxLuLDhw4gZJq0pkqaBkDYT9xQ54IMJEiBCmBXxAgNZlwRkDohpVyBSyIIHS1ZowADNoyNXy55ttepBwUUFGBAdYADgAg1ElEiR4gGJCxxcaGigVkULEQdm5s4NlrZiwTVDa3DhosWICXVdev8MLRpA0a+qDSSYyz5Bguy9C9Qtbb2+/fsVF48k8OEFitYHSOBAWWmFwEILJTTwwAYfLBBBCSesdcIIEXRgggkhgHDZAgMYoMEDNNUEQAL4OYRbUVW9JAAA8iEAAQiYTeDAUQbUZVN1A/XGW24E1LjABBR0EMIFHWQQnnzmhXReiUw2KdRMgdkGZUiuAVBlXiF4oAACCEwQQgcVbMCABy880ACZK2yQkgUUQKAAAy6wUGQIIVQQAZ0ZMJDBBB2QQEIJIVAQQgQCeVjebbY5mSNMqhk02k0JRFBBoBZYsIACC1QwAQMQVECBjAcEYMADB0wAAgQNOBAdAW9yoEBlLrz/4MEAL73UqKK45voQlAOtKMBMop11VgQIRPcBChgYIEILGURQKQQMXCCBBB140MAAKJzg3KwAPIA rmales ont disparu, remplacées par un tissu de granulation riche en cellules inflammatoires."><figcaption>Rectocolite hémorragique sévère, coloration hématoxyline-éosine : ulcération avec perte de l’architecture cryptique, tissu de granulation et infiltrat inflammatoire dense riche en polynucléaires. <small>Image : Mikael Häggström, Wikimedia Commons, licence CC0 (<a href="https://commons.wikimedia.org/wiki/File:Histopathology_of_severe_ulcerative_colitis.jpg" target="_blank" rel="noopener">source</a>), adaptée en GIF.</small></figcaption></figure><div class="quiz ui"><p>Poussée grave de colite chez une patiente fébrile. Quel examen endoscopique en premier ?</p><button data-ok="0">Coloscopie totale après préparation complète</button><button data-ok="1">Rectosigmoïdoscopie prudente avec biopsies</button><button data-ok="0">Capsule endoscopique</button><p class="fb" hidden>Dans une colite grave, une rectosigmoïdoscopie avec peu d’insufflation suffit au diagnostic, aux biopsies (dont la recherche de <button class="w" data-k="k51-cmv">CMV</button>) et limite le risque de perforation.</p></div><div class="key"><b>À retenir.</b> CRP, hémoglobine, albumine, calprotectine ; coprocultures et C. difficile ; coloscopie avec biopsies étagées ; si colite grave : rectosigmoïdoscopie prudente.</div><p class="src">Références : <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a>.</p></section>
<section class="ilot" id="k51-6"><h2><span class="n">6</span>Évaluer la gravité</h2><p>Le diagnostic posé, la gravité oriente le traitement et le lieu de soins. Ainsi, l’ECCO distingue les poussées légères à modérées et les poussées modérées à sévères, en reconnaissant que ces catégories forment un continuum. Par ailleurs, le <button class="w" data-k="k51-mayo">score de Mayo</button> associe fréquence des selles, rectorragies, aspect endoscopique et appréciation globale ; il sert surtout dans les essais et le suivi.</p><p>En pratique, il faut surtout reconnaître la <button class="w" data-k="k51-cagg">colite aiguë grave</button>, qui impose une hospitalisation. En effet, selon les <button class="w" data-k="k51-tw">critères de Truelove et Witts</button>, au moins six selles sanglantes par jour associées à au moins un signe systémique (fréquence cardiaque > 90/min, température > 37,8 °C, hémoglobine < 10,5 g/dl ou vitesse de sédimentation > 30 mm/h) définissent une poussée grave.</p><div class="quiz ui"><p>Huit selles sanglantes par jour, pouls à 104/min, hémoglobine 11,8 g/dl. Gravité ?</p><button data-ok="0">Poussée modérée : traitement ambulatoire</button><button data-ok="1">Colite aiguë grave : hospitalisation et corticoïdes IV</button><button data-ok="0">Proctite</button><p class="fb" hidden>Six selles sanglantes ou plus et au moins un critère systémique (ici la tachycardie > 90/min) définissent la colite aiguë grave selon Truelove et Witts.</p></div><div class="key"><b>À retenir.</b> Truelove et Witts : ≥ 6 selles sanglantes/j + ≥ 1 critère (FC > 90, T > 37,8 °C, Hb < 10,5 g/dl, VS > 30 mm/h) = colite aiguë grave → hospitalisation.</div><p class="src">Références : <a href="https://doi.org/10.1136/bmj.2.4947.1041" target="_blank" rel="noopener">Truelove S. C., Witts L. J., Cortisone in ulcerative colitis: final report on a therapeutic trial, Br Med J 1955;2:1041-1048</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab178" target="_blank" rel="noopener">Raine T. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Medical Treatment, J Crohns Colitis 2022;16:2-17</a> ; <a href="https://doi.org/10.1093/ecco-jcc/jjab177" target="_blank" rel="noopener">Spinelli A. et al., ECCO Guidelines on Therapeutics in Ulcerative Colitis: Surgical Treatment, J Crohns Colitis 2022;16:179-189</a>.</p></section>
