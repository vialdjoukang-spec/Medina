<section class="ilot" id="i67-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées. Une femme de 29 ans, sous contraception œstroprogestative combinée, consulte pour une céphalée croissante depuis huit jours. Elle fait ce soir une crise tonico-clonique généralisée. Le scanner cérébral sans injection montre une petite hémorragie corticale de la convexité, sans autre anomalie. L’examen neurologique, après la crise, ne montre pas de déficit focal. <b>La question décisive tient en une phrase : cette femme a-t-elle une <button class="w" data-k="i67-tvc">thrombose veineuse cérébrale</button>, et faut-il l’anticoaguler malgré le saignement ?</b> L’intuition clinique résiste, car on anticoagule rarement un patient qui saigne. La ligne directrice <button class="w" data-k="i67-sources">S2k de la région DACH</button>, co-signée par la Société suisse de neurologie, répond par l’inverse : l’héparine à dose thérapeutique est recommandée <b>même en présence d’une hémorragie intracrânienne</b>, parce que le caillot bloque le drainage veineux et que le saignement est une conséquence de cette stase, non sa contre-indication. Le scanner sans injection, lui, ne permet pas d’écarter le diagnostic : il faut une <button class="w" data-k="i67-angio-veineuse">angiographie veineuse par scanner ou par résonance magnétique</button>.</p>
<p>Ce cas ouvre une catégorie hétérogène. Le code I67 regroupe les maladies cérébrovasculaires qui ne sont ni une hémorragie (I60 à I62), ni un infarctus (I63), ni une occlusion ou une sténose sans infarctus (I65 et I66). Une seule question unifie ces entités disparates : <b>quelle structure vasculaire est atteinte — veine, grosse artère, petite artère, régulation de la pression — et le cerveau souffre-t-il d’ischémie, d’hémorragie, d’œdème ou d’hypertension intracrânienne ?</b> Le chapitre y répond entité par entité, avec le plus de poids pour celles qui sont fréquentes ou urgentes : thrombose veineuse cérébrale, encéphalopathie hypertensive, anévrisme non rompu, vasospasme après hémorragie sous-arachnoïdienne, dissection intracrânienne, maladie des petites artères, puis moyamoya et angéite primitive.</p>
<div class="key"><b>À retenir.</b> Le chapitre suit l’ordre d’une consultation : définir et situer chaque entité (îlots 1 à 3), reconnaître ses causes et sa clinique (îlots 4 à 6), poser le diagnostic et mesurer l’urgence (îlots 7 et 8), traiter (îlots 9 à 13), puis suivre et conclure (îlots 14 et 15). Les lacunes des sources sont signalées dans le texte, non comblées.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11027218/" target="_blank" rel="noopener">Weimar et al., recommandations S2k sur la thrombose veineuse cérébrale, Neurol Res Pract 2024</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc I60–I69, BfArM</a>.</p>
</section>
<section class="ilot" id="i67-1"><h2><span class="n">1</span>Définition et classification</h2>
<h3>Un code résiduel qui réunit des mécanismes différents</h3>
<p>La CIM-10-GM 2024 réserve I67 aux autres maladies cérébrovasculaires précisées. Elle exclut les hémorragies intracrâniennes (I60 à I62), l’infarctus cérébral (I63) et l’occlusion ou la sténose artérielle sans infarctus (I65 et I66). Les entités rassemblées touchent des structures différentes, ce qui explique que leur traitement n’ait presque rien en commun. Le tableau les classe par structure atteinte ; le sous-code figure en dernière colonne parce que le raisonnement clinique part de la structure, non du code.</p>
<table class="t"><tr><th>Structure atteinte</th><th>Entité</th><th>Ce qui la définit</th><th>Sous-code</th></tr><tr><td>Veine</td><td><button class="w" data-k="i67-tvc">Thrombose veineuse cérébrale</button></td><td>Thrombose non pyogène des veines cérébrales ou des sinus veineux intracrâniens, avec trouble de l’écoulement veineux</td><td>I67.6</td></tr><tr><td>Grosse artère</td><td><button class="w" data-k="i67-dissection">Dissection d’artère cérébrale</button></td><td>Lésion de la paroi artérielle : sténose segmentaire, occlusion ou anévrisme disséquant, souvent combinés</td><td>I67.0</td></tr><tr><td>Grosse artère</td><td>Anévrisme cérébral acquis ; fistule artério-veineuse acquise</td><td>Dilatation de la paroi ; shunt artério-veineux acquis (l’anévrisme congénital relève de Q28)</td><td>I67.10 ; I67.11</td></tr><tr><td>Grosse artère</td><td><button class="w" data-k="i67-moyamoya">Maladie de moyamoya</button></td><td>Sténo-occlusion bilatérale progressive de la carotide interne supraclinoïdienne et de ses branches</td><td>I67.5</td></tr><tr><td>Grosse artère</td><td>Artérite cérébrale (angéite primitive du système nerveux central)</td><td>Inflammation de la paroi vasculaire limitée au système nerveux central</td><td>I67.7</td></tr><tr><td>Grosse artère</td><td><button class="w" data-k="i67-vasospasme">Vasospasme après hémorragie sous-arachnoïdienne</button></td><td>Rétrécissement artériel retardé après la rupture d’un anévrisme (code secondaire, marqué !)</td><td>I67.80</td></tr><tr><td>Petite artère</td><td><button class="w" data-k="i67-binswanger">Leucoencéphalopathie vasculaire progressive (maladie de Binswanger)</button></td><td>Atteinte des petites artères et de la substance blanche ; la démence vasculaire sous-corticale relève de F01.2</td><td>I67.3</td></tr><tr><td>Régulation de la pression</td><td>Encéphalopathie hypertensive</td><td>Hypertension sévère avec symptômes cérébraux sans autre explication</td><td>I67.4</td></tr><tr><td>Résiduel</td><td>Athérosclérose cérébrale ; autres maladies précisées ; maladie sans précision</td><td>Renvoi au cours I66 pour l’athérome intracrânien ; ischémie cérébrale chronique, insuffisance cérébrovasculaire aiguë</td><td>I67.2 ; I67.88 ; I67.9</td></tr></table>
<h3>Règles de codage qui évitent les erreurs</h3>
<p>Quand une dissection ou un anévrisme a saigné, la CIM-10-GM 2024 demande de coder d’abord l’hémorragie (I60 à I62) ; la thrombose veineuse qui cause un infarctus se code I63.6 et non I67.6. Les séquelles de ces affections se codent I69.8, et une affection est une séquelle quand elle est décrite comme telle ou persiste un an ou plus après son début. Le <button class="w" data-k="i67-pres">syndrome d’encéphalopathie postérieure réversible</button>, le <button class="w" data-k="i67-svcr">syndrome de vasoconstriction cérébrale réversible</button> et l’<button class="w" data-k="i67-hta-maligne">hypertension maligne</button> figurent dans les sources comme entités cliniques proches de I67.4 ; leur codage précis n’a pas été vérifié dans les sources lues et ne doit pas être affirmé.</p>
<h3>La thrombose veineuse : septique ou aseptique</h3>
<p>La ligne directrice DACH distingue les formes septiques et aseptiques. Dans la forme septique, le traitement du foyer infectieux et l’antibiothérapie priment, le reste de la prise en charge ne différant pas. I67.6 ne vise toutefois que la thrombose non pyogène ; la forme pyogène sort de cette catégorie.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc I60–I69, BfArM</a> ; <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a>.</p>
</section>
<section class="ilot" id="i67-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Chaque entité a sa propre démographie, ce qui oriente déjà l’hypothèse : la thrombose veineuse frappe des femmes jeunes, l’anévrisme et la maladie des petites artères des adultes plus âgés, le moyamoya une population d’abord asiatique. Le tableau rassemble les chiffres des sources lues. Aucune donnée suisse d’incidence n’a été trouvée dans le dossier de recherche : les chiffres sont européens, internationaux ou issus de cohortes précisées.</p>
<table class="t"><tr><th>Entité</th><th>Donnée</th><th>Lecture</th></tr><tr><td>Thrombose veineuse cérébrale</td><td>Environ 75 % de femmes ; âge médian 41 ans (écart interquartile 28 à 51) et 63 % de femmes dans la cohorte DOAC-CVT de 619 patients</td><td>Maladie de la femme jeune, en lien avec les hormones et la grossesse</td></tr><tr><td>Anévrisme non rompu</td><td>Jusqu’à 3 % des adultes ; prévalence 1,6 fois plus élevée chez la femme ; rupture de 1,04 % par personne-année chez la femme contre 0,74 % chez l’homme (rapport de risque ajusté 1,39)</td><td>Fréquent, le plus souvent silencieux ; le sexe féminin augmente la rupture</td></tr><tr><td>Hémorragie sous-arachnoïdienne anévrismale</td><td>Létalité d’environ 40 %</td><td>Environ quatre patients sur dix décèdent dans les trois mois</td></tr><tr><td>Dissection extracrânienne</td><td>2,6 à 3,0 pour 100 000 par an ; âge moyen 44 ans</td><td>Rappel : hors I67, elle sert de comparaison</td></tr><tr><td>Dissection intracrânienne</td><td>Environ 11 % des dissections en Europe (27 % en Amérique latine, 67 à 78 % en Asie de l’Est) ; âge moyen 50 ans</td><td>Rare en Europe</td></tr><tr><td>Moyamoya</td><td>Japon jusqu’à 0,54 pour 100 000 ; pays occidentaux 0,047 à 0,086 pour 100 000</td><td>Environ dix fois moins fréquent en Occident</td></tr><tr><td>Angéite primitive du système nerveux central</td><td>2,4 par million et par an ; sex-ratio 1:1 ; âge médian 50 ans ; délai moyen de diagnostic 170 jours</td><td>Rare, diagnostiquée tard</td></tr><tr><td>Syndrome de vasoconstriction cérébrale réversible</td><td>Environ 3 par million et par an (incidence standardisée) ; âge moyen 39,9 ans et 81,2 % de femmes sur 191 cas publiés</td><td>Surtout la femme de 40 ans, avec un biais de publication</td></tr><tr><td>Maladie des petites artères</td><td>Cause d’environ un quart des accidents vasculaires cérébraux ischémiques (lacunaires)</td><td>Fréquente</td></tr><tr><td>Encéphalopathie hypertensive</td><td>10 à 15 % des patients avec <p>Deux chiffres méritent une explication. Le rapport de risque de 1,39 pour la femme signifie, après ajustement sur les autres facteurs, que le risque de rupture est supérieur d’environ 39 % à celui de l’homme ; il vient d’une méta-analyse de 9 cohortes (9940 patients), dont la revue éditrice est américaine mais dont les données sont européennes et japonaises. Le délai moyen de 170 jours pour l’angéite primitive est compatible avec des manifestations variables et non spécifiques.</p>

<section class="ilot" id="i67-3"><h2><span class="n">3</span>Du normal au pathologique : veine, artère, microcirculation, hémodynamique</h2>
<p>Pour comprendre un traitement, il faut savoir ce que le tissu perd. Le cerveau reçoit son sang par des artères et l’évacue par des veines et des sinus ; entre les deux, une microcirculation ; et un système de régulation maintient un débit stable malgré les variations de la pression. Chacune de ces quatre fonctions a sa maladie dans I67.</p>
<figure><svg viewBox="0 0 640 330" role="img" aria-label="Quatre structures atteintes et leur conséquence cérébrale" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="2"><rect x="10" y="10" width="300" height="140" rx="6"/><rect x="330" y="10" width="300" height="140" rx="6"/><rect x="10" y="175" width="300" height="140" rx="6"/><rect x="330" y="175" width="300" height="140" rx="6"/></g><g fill="#222"><text x="22" y="34" font-weight="bold">1. Veine ou sinus</text><text x="22" y="62">Thrombose veineuse cérébrale</text><text x="22" y="100">Stase en amont du caillot,</text><text x="22" y="120">œdème et hémorragie de stase,</text><text x="22" y="140">hypertension intracrânienne</text><text x="342" y="34" font-weight="bold">2. Grosse artère</text><text x="342" y="62">Dissection, anévrisme, moyamoya,</text><text x="342" y="82">angéite, vasospasme</text><text x="342" y="120">Ischémie ou hémorragie</text><text x="342" y="140">selon la paroi atteinte</text><text x="22" y="199" font-weight="bold">3. Petite artère</text><text x="22" y="227">Maladie des petites artères</text><text x="22" y="265">Lésions de la substance blanche,</text><text x="22" y="285">lacunes, trouble cognitif</text><text x="342" y="199" font-weight="bold">4. Régulation de la pression</text><text x="342" y="227">Encéphalopathie hypertensive</text><text x="342" y="265">Faillite de l’autorégulation,</text><text x="342" y="285">œdème, surtout postérieur</text></g></svg><figcaption>Figure 1 — Les quatre structures dont l’atteinte est regroupée sous I67 et leur conséquence cérébrale. Schéma pédagogique établi d’après la CIM-10-GM 2024 et les lignes directrices citées.</figcaption></figure>
<p>La figure se lit en quatre cases. La case 1 est la seule où le sang ne peut pas sortir ; les cases 2 et 3 concernent l’apport ; la case 4 concerne la régulation. Cette lecture explique pourquoi la même question initiale — le cerveau souffre-t-il d’ischémie, d’hémorragie, d’œdème ou d’hypertension intracrânienne ? — reçoit une réponse différente dans chaque case.</p>
<h3>Le drainage veineux et la thrombose veineuse cérébrale</h3>
<p>La ligne directrice DACH définit la thrombose veineuse cérébrale comme la thrombose des conduits veineux cérébraux avec trouble de l’écoulement veineux. En amont du caillot, le sang stagne : la stase provoque un œdème (« œdème de stase ») et parfois une hémorragie, et l’œdème est visible à l’imagerie chez jusqu’à 50 % des patients. La conséquence thérapeutique est directe. Comme le trouble est un défaut d’écoulement, la meilleure manière de réduire la pression intracrânienne est de rétablir l’écoulement par une anticoagulation suffisante, qui améliore le drainage ; la ligne directrice recommande aussi d’éviter la restriction volémique.</p>
<h3>L’autorégulation cérébrale et l’encéphalopathie hypertensive</h3>
<p>L’<button class="w" data-k="i67-autoregulation">autorégulation cérébrale</button> maintient le débit cérébral stable malgré des pressions variables. Quand la pression artérielle est très élevée, elle ne parvient plus à empêcher la transmission de la hausse de pression au lit capillaire : un œdème cérébral se constitue. Il prédomine dans les régions postérieures, parce que l’innervation sympathique y est moins dense et amortit donc moins les oscillations tensionnelles. Le document de position de la Société européenne de cardiologie décrit en outre un enchaînement : la hausse brutale des résistances provoque une natriurèse de pression, qui active le système rénine-angiotensine, ce qui élève encore la pression et lèse la microcirculation. Deux conséquences pratiques : la <b>vitesse</b> d’élévation de la pression compte davantage que sa valeur absolue, et il n’existe pas de seuil tensionnel spécifique de l’encéphalopathie. L’histologie montre œdème, microhémorragies et infarctus. Pour le PRES, la physiopathologie reste incomplètement comprise : hyperperfusion après faillite de l’autorégulation, vasoconstriction avec hypoperfusion, dysfonction endothéliale (facteur clé), activation immunitaire et rupture de la barrière hémato-encéphalique sont les hypothèses discutées.</p>
<h3>Les petites artères</h3>
<p>Dans la maladie des petites artères, l’imagerie montre des hyperintensités de la substance blanche et des lacunes ; les lésions s’étendent habituellement avec le temps mais peuvent régresser. Le débit cérébral est réduit et l’autorégulation altérée, et le mécanisme principal ne serait pas athérothrombo-embolique ; l’angiopathie amyloïde contribue chez certains sujets âgés. Les marqueurs d’imagerie sont standardisés pour la recherche par <button class="w" data-k="i67-strive">STRIVE-2 (2023)</button>.</p>
<h3>Les grosses artères</h3>
<p>Dans le <button class="w" data-k="i67-moyamoya">moyamoya</button>, la carotide interne supraclinoïdienne et ses branches principales se rétrécissent des deux côtés, avec un réseau collatéral fragile dans les régions profondes. On distingue la maladie (idiopathique) du syndrome (associé à la trisomie 21, à la neurofibromatose de type 1, à la drépanocytose ou à la radiothérapie cervico-céphalique). Le variant <button class="w" data-k="i67-rnf213">RNF213 p.R4810K</button> est un effet fondateur est-asiatique, absent des patients occidentaux. Dans la <button class="w" data-k="i67-dissection">dissection</button>, la paroi se rétrécit, s’occlut ou se dilate en anévrisme disséquant, souvent de façon combinée. Dans le vasospasme, le lien causal entre le spasme macrovasculaire et l’<button class="w" data-k="i67-ischemie-retardee">ischémie cérébrale retardée</button> est de plus en plus remis en question ; la nimodipine dilate les vaisseaux cérébraux et augmente la perfusion, préférentiellement dans les régions mal perfusées.</p>

<section class="ilot" id="i67-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se lisent entité par entité. Pour chaque facteur, la raison pour laquelle il favorise la maladie est donnée quand le dossier la fournit ; sinon la raison est dite non précisée.</p>
<h3>Thrombose veineuse cérébrale</h3>
<p>Le tableau donne la fréquence de chaque facteur chez les patients qui ont une thrombose veineuse cérébrale. Il faut le lire comme une répartition parmi les malades, non comme un risque individuel.</p>
<table class="t"><tr><th>Facteur</th><th>Fréquence chez les patients</th><th>Commentaire</th></tr><tr><td>Contraception hormonale combinée</td><td>40 à 50 % des femmes atteintes ; risque multiplié par 7,6 (intervalle de confiance à 95 % de 3,82 à 15,09)</td><td>Facteur modifiable : la ligne directrice demande d’y renoncer après une thrombose</td></tr><tr><td>Thrombophilie</td><td>34 à 40 %</td><td>Pas de dépistage systématique (îlot 7)</td></tr><tr><td>Grossesse (surtout 3e trimestre) et post-partum</td><td>10 à 20 %</td><td>Situation à risque spécifique (îlot 14)</td></tr><tr><td>Infection locale</td><td>Environ 10 %</td><td>Évoque une forme septique</td></tr><tr><td>Mutation <button class="w" data-k="i67-jak2">JAK2 V617F</button></td><td>6 à 7 %</td><td>Mutation associée aux néoplasies myéloprolifératives</td></tr><tr><td>Néoplasie myéloproliférative</td><td>Environ 4 %</td><td>Hémopathie à rechercher</td></tr><tr><td>Traitement hormonal substitutif</td><td>3 à 4 %</td><td>Hormones</td></tr><tr><td>Néoplasie cérébrale</td><td>Environ 2 %</td><td>Cause tumorale</td></tr><tr><td>Idiopathique</td><td>10 à 20 %</td><td>Aucune cause trouvée</td></tr></table>
<p>S’y ajoutent la <button class="w" data-k="i67-vitt">thrombose avec thrombopénie induite par le vaccin</button> contre le SARS-CoV-2 à vecteur viral, dans les premières semaines après la vaccination, et les collagénoses (lupus, syndrome de Sjögren).</p>
<h3>Anévrisme non rompu</h3>
<p>Le tabac et l’hypertension favorisent la formation, la croissance et la rupture. Un antécédent familial d’hémorragie sous-arachnoïdienne, au moins deux apparentés du premier degré atteints, ou une polykystose rénale augmentent la fréquence. Les facteurs de rupture sont l’âge de 70 ans ou plus, l’hypertension, une hémorragie sous-arachnoïdienne antérieure, la taille, la localisation, la région géographique et une morphologie irrégulière (rapport de risque 1,63). La <b>croissance</b> d’au moins 1 mm est un facteur fort : rupture de 2,9 % à six mois, 4,3 % à un an, 6,0 % à deux ans. Une hypertension non contrôlée correspond à un rapport de risque de 16,7 pour la rupture.</p>
<h3>Autres entités</h3>
<p>La dissection extracrânienne est associée à l’hypertension et à la migraine, avec comme déclencheurs un traumatisme cervical mineur ou une infection récente ; les facteurs de la dissection intracrânienne sont moins connus. Le PRES s’observe dans l’insuffisance rénale terminale, les fluctuations tensionnelles, les traitements cytotoxiques ou anti-angiogéniques, les maladies auto-immunes, l’éclampsie et la pré-éclampsie, la transplantation et le sepsis. Le SVCR est déclenché par des substances vasoactives (41,4 % des cas publiés), la grossesse ou le post-partum (20,9 %) et le rapport sexuel (10,5 %) ; les produits sanguins, le traumatisme crânien et la neurochirurgie sont aussi cités. L’hypertension maligne a une cause secondaire chez 20 à 40 % des patients des urgences, surtout une néphropathie parenchymateuse ou une sténose de l’artère rénale.</p>

<section class="ilot" id="i67-5"><h2><span class="n">5</span>Anamnèse et présentation clinique</h2>
<p>Puisque les entités diffèrent, la clinique se lit comme une série de signatures. Retenez pour chacune le signe qui doit déclencher l’imagerie ciblée.</p>
<h3>Thrombose veineuse cérébrale</h3>
<p>Les crises épileptiques surviennent chez 40 à 50 % des patients ; un tiers environ fait une crise précoce, dans les sept premiers jours. Le risque de crise est accru en cas de thrombose superficielle, de déficit focal, de sang sulcal ou sous-arachnoïdien, de lésion parenchymateuse ou d’infarctus hémorragique. Les crises tardives (au-delà de sept jours) concernent environ 11 % des patients, avec une médiane de cinq mois, et la récidive après une crise tardive atteint 70 %. Les signes d’hypertension intracrânienne (céphalée, troubles visuels) peuvent être le seul indice d’une thrombose chronique : il faut donc exclure un trouble de l’écoulement veineux chez tout patient présentant un « pseudotumor cerebri ». La fréquence globale de la céphalée et des déficits focaux n’a pas été trouvée dans les sources lues.</p>
<h3>Encéphalopathie hypertensive et PRES</h3>
<p>Selon la Société européenne de cardiologie, l’encéphalopathie hypertensive associe une hypertension sévère et au moins une manifestation — crises, léthargie, cécité corticale ou coma — sans autre explication. Somnolence, léthargie, crises tonico-cloniques et cécité corticale peuvent précéder la perte de connaissance. Un déficit focal est rare et doit faire suspecter une hémorragie ou un infarctus. Une rétinopathie avancée manque chez jusqu’à un tiers des patients : son absence n’écarte donc pas le diagnostic. Le PRES se manifeste par céphalée, troubles visuels ou amputation du champ visuel, confusion, crises et troubles de la conscience ; les formes frustes n’ont qu’un symptôme.</p>
<h3>Syndrome de vasoconstriction cérébrale réversible</h3>
<p>La céphalée en coup de tonnerre, maximale en moins d’une minute, est souvent récidivante. Environ 25 % des patients développent une complication — hémorragie sous-arachnoïdienne corticale, crises, ischémie —, avec des déficits focaux si une lésion apparaît.</p>
<h3>Dissection</h3>
<p>La dissection extracrânienne donne céphalée, cervicalgie, syndrome de Horner et paralysies de nerfs crâniens ; une ischémie survient chez deux tiers à trois quarts des patients, souvent des heures à des jours plus tard. La dissection <b>intracrânienne</b> se révèle par une hémorragie sous-arachnoïdienne (environ 50 à 60 %) ou par une ischémie (30 à 78 %), avec une céphalée prodromique dans environ 80 % des cas ; une compression du tronc cérébral ou des nerfs crâniens est possible.</p>
<h3>Moyamoya, angéite primitive, petites artères</h3>
<p>Chez l’adulte, le moyamoya se manifeste par un accident ischémique transitoire, un accident ischémique ou hémorragique, ou une hémorragie sous-arachnoïdienne ; l’hémorragie concerne environ 25 à 60 % des adultes, moins chez les Occidentaux. Chez l’enfant, l’atteinte est surtout ischémique (hémorragie environ 3 %) avec une progression plus rapide. Les deux âges peuvent avoir des déficits cognitifs, des épisodes pseudo-migraineux, des troubles psychiatriques ou du mouvement. L’angéite primitive se présente par céphalée, psychose et accidents vasculaires souvent multiples, dans plusieurs territoires ; la présentation, variable et non spécifique, explique le retard au diagnostic. La maladie des petites artères « couverte » est découverte fortuitement, sans accident vasculaire ni trouble cognitif ou de la marche ; elle augmente néanmoins le risque d’accident vasculaire, de démence et de décès.</p>

<section class="ilot" id="i67-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen oriente la suite, mais il ne remplace pas l’imagerie. Il sert à trois choses : repérer un signe focal qui change l’hypothèse, mesurer correctement la pression artérielle, et chercher les complications.</p>
<h3>Pression artérielle et fond d’œil</h3>
<p>Devant une suspicion d’encéphalopathie hypertensive, il faut mesurer la pression artérielle aux deux bras et à un membre inférieur, et répéter les mesures. La source demande ces mesures répétées sans en détailler la raison ; on peut en déduire qu’elles évitent de traiter sur une valeur isolée ou erronée. Le fond d’œil, à faire si l’on suspecte une hypertension maligne, cherche des hémorragies en flammèches bilatérales, des nodules cotonneux ou un œdème papillaire. L’œdème papillaire est aussi le signe d’hypertension intracrânienne que la ligne directrice DACH cherche en cas de troubles visuels ; sa fréquence dans la thrombose veineuse n’a pas été lue.</p>
<h3>Déficit focal et signes d’alarme</h3>
<p>Dans l’encéphalopathie hypertensive, un déficit focal est inhabituel et doit faire chercher une hémorragie ou un infarctus. Dans la dissection, le syndrome de Horner, les paralysies de nerfs crâniens et la cervicalgie guident vers la paroi artérielle. Une céphalée récente, brutale, avec ou sans signes focaux, impose d’envisager l’hémorragie sous-arachnoïdienne, la dissection, la thrombose veineuse et le SVCR (îlot 7).</p>
