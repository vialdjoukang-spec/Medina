<template data-pop="c96-hcl-neuro" data-title="HCL neurodégénérative"><p>La forme neurodégénérative associe des lésions IRM du cervelet et du tronc cérébral, sans cellules CD1a positives, avec des lymphocytes CD8+. Les signes sont le tremblement, la dysarthrie, l’ataxie et des troubles du comportement.</p><p class="src">Référence : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a>.</p></template>
<template data-pop="c96-sccss" data-title="Séquelles à long terme : données suisses"><p>Dans la Swiss Childhood Cancer Survivor Study (123 survivants, suivi médian de 13 ans), 59 % ont au moins une affection chronique. Les facteurs sont l’HCL multisystémique, l’atteinte osseuse multifocale et l’atteinte hypophysaire. Une perte auditive permanente touche 38 % des survivants d’une forme multisystémique dans une cohorte tertiaire.</p><p class="src">Références : <a href="https://doi.org/10.1007/s11764-024-01544-z" target="_blank" rel="noopener">Swiss Childhood Cancer Survivor Study, 2024</a> ; <a href="https://doi.org/10.1002/pbc.22186" target="_blank" rel="noopener">Perte auditive après HCL, 2010</a>.</p></template>
<template data-pop="c96-diff-histio" data-title="Autres histiocytoses"><p>La maladie d’Erdheim-Chester appartient au même groupe L que l’HCL. La maladie de Rosai-Dorfman est CD163 positive, CD1a et langerine négatives. L’histiocytose à cellules indéterminées est langerine négative. Des histiocytoses mixtes sont possibles.</p><p class="src">Référence : <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a>.</p></template>
<template data-pop="c96-kit" data-title="Le récepteur KIT et la mutation D816V"><p>KIT est un récepteur à activité tyrosine kinase dont le ligand est le facteur de cellules souches (SCF). Une mutation de KIT est présente dans plus de 90 % des mastocytoses systémiques, et la variante D816V dans plus de 95 % de celles-ci : le récepteur s’active indépendamment du SCF, ce qui provoque une expansion clonale des mastocytes. Une mutation du codon 816 est un des critères mineurs de la mastocytose systémique, et la charge allélique de KIT D816V de 10 % ou plus est un B-finding.</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a> ; <a href="https://doi.org/10.1097/HS9.0000000000000646" target="_blank" rel="noopener">Critères ECNM, Valent et coll., 2021</a>.</p></template>
<template data-pop="c96-tryptase" data-title="Tryptase : valeurs et interprétation"><table class="t"><tr><th>Repère</th><th>Valeur</th></tr><tr><td>Normale</td><td>Inférieure à 11,4 µg/l</td></tr><tr><td>Critère mineur de mastocytose systémique</td><td>Supérieure à 20 ng/ml (tryptase basale)</td></tr><tr><td>B-finding</td><td>200 ng/ml ou plus</td></tr><tr><td>Zone grise avant biopsie médullaire</td><td>Inférieure à 20 µg/l : exclure l’alpha-tryptasémie héréditaire</td></tr></table><p>La mesure se fait à distance d’une crise. Le critère ne compte pas en cas de néoplasie myéloïde associée. Une tryptase normale n’exclut pas une mastocytose.</p><p class="src">Références : <a href="https://doi.org/10.1097/HS9.0000000000000646" target="_blank" rel="noopener">Critères ECNM, Valent et coll., 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
<template data-pop="c96-hat" data-title="Alpha-tryptasémie héréditaire (HαT)"><p>L’HαT est un trait génétique présent chez environ 5 % de la population, de transmission autosomique dominante, 2 à 3 fois plus fréquent dans la mastocytose systémique. Il élève la tryptase de base. Pour corriger, on divise la tryptase par (1 + nombre de copies alpha supplémentaires). L’HαT doit être exclue avant une biopsie médullaire si la tryptase est en zone grise (inférieure à 20 µg/l).</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a> ; <a href="https://doi.org/10.1097/HS9.0000000000000646" target="_blank" rel="noopener">Critères ECNM, Valent et coll., 2021</a>.</p></template>
<template data-pop="c96-b-c" data-title="B-findings et C-findings"><table class="t"><tr><th>Catégorie</th><th>Contenu</th></tr><tr><td>B-findings (charge sans dommage d’organe)</td><td>Infiltration médullaire de 30 % ou plus et/ou tryptase de 200 ng/ml ou plus et/ou charge allélique KIT D816V de 10 % ou plus ; signes discrets et stables de myéloprolifération ou de myélodysplasie ; organomégalie sans dysfonction</td></tr><tr><td>C-findings (dommage d’organe)</td><td>Cytopénies (neutrophiles inférieurs à 1 G/l, hémoglobine inférieure à 10 g/dl, plaquettes inférieures à 100 G/l) ; hépatopathie avec ascite et enzymes élevées, avec ou sans hypertension portale ; splénomégalie palpable avec hypersplénisme ; malabsorption avec hypoalbuminémie ; ostéolyse de 2 cm ou plus avec fracture pathologique</td></tr></table><p>La perte de poids seule et l’ostéoporose ne suffisent pas. Forme « smoldering » : au moins 2 B-findings. Forme agressive : au moins 1 C-finding. Le classement des cytopénies entre B et C est ambigu dans le tableau lu.</p><p class="src">Références : <a href="https://doi.org/10.1097/HS9.0000000000000646" target="_blank" rel="noopener">Critères ECNM, Valent et coll., 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
<template data-pop="c96-criteres-ms" data-title="Critères ECNM 2021 de la mastocytose systémique"><table class="t"><tr><th>Critère</th><th>Contenu</th></tr><tr><td>Majeur</td><td>Infiltrats multifocaux denses de 15 mastocytes ou plus agrégés (moelle et/ou autre organe extracutané)</td></tr><tr><td>Mineur 1</td><td>25 % ou plus de mastocytes atypiques ou fusiformes</td></tr><tr><td>Mineur 2</td><td>Mutation de KIT au codon 816 (ou autre région critique)</td></tr><tr><td>Mineur 3</td><td>Expression de CD2 et/ou CD25 et/ou CD30</td></tr><tr><td>Mineur 4</td><td>Tryptase basale supérieure à 20 ng/ml</td></tr></table><p>Diagnostic : un majeur et un mineur, ou trois mineurs.</p><p class="src">Référence : <a href="https://doi.org/10.1097/HS9.0000000000000646" target="_blank" rel="noopener">Critères ECNM, Valent et coll., 2021</a>.</p></template>
<template data-pop="c96-darier" data-title="Signe de Darier"><p>Le guide Onkopedia cite le signe de Darier positif parmi les signes cutanés de la mastocytose, avec le prurit, le flush et l’urticaire. Par raisonnement physiopathologique général (non issu d’une source du dossier), il traduit la libération locale de médiateurs par les mastocytes cutanés stimulés.</p><p class="src">Référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
<template data-pop="c96-anaphylaxie" data-title="Anaphylaxie et trousse d’urgence"><p>Chez le patient mastocytaire, l’anaphylaxie survient surtout après piqûre d’hyménoptère et peut aller jusqu’au choc. Le guide Onkopedia prévoit une trousse d’urgence (anti-H1, corticoïde, auto-injecteur d’adrénaline), une carte d’urgence et, en cas d’allergie, une immunothérapie au venin d’hyménoptère au long cours. L’omalizumab est utilisé hors indication en cas d’anaphylaxies récidivantes.</p><p class="src">Référence : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
<template data-pop="c96-mcl" data-title="Leucémie à mastocytes"><p>La leucémie à mastocytes se définit par au moins 20 % de mastocytes sur le frottis médullaire ; elle est codée C94.3- et non C96. Une forme leucémique est évoquée si 10 % ou plus de mastocytes circulent. La survie médiane est de 0,5 à 1,5 an selon Onkopedia, de 1,6 an dans le registre ECNM, avec une meilleure survie sous midostaurine.</p><p class="src">Références : <a href="https://doi.org/10.1182/bloodadvances.2022008292" target="_blank" rel="noopener">Leucémie à mastocytes, registre ECNM, 2023</a> ; <a href="https://doi.org/10.1097/HS9.0000000000000646" target="_blank" rel="noopener">Critères ECNM, Valent et coll., 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
<template data-pop="c96-midostaurine" data-title="Midostaurine (Rydapt®) : monographie"><p><b>Mécanisme.</b> Inhibiteur multicible de kinases (FLT3, KIT, FGFR, VEGFR2, PKC). <b>Indication suisse.</b> Mastocytose systémique avancée de l’adulte. <b>Posologie.</b> 100 mg deux fois par jour avec les repas, tant que le bénéfice persiste ; interruption si neutrophiles inférieurs à 1 G/l puis reprise à 50 mg deux fois par jour.</p><p><b>Efficacité.</b> Réponse d’environ 60 % selon Onkopedia. <b>Effets indésirables.</b> Nausées et vomissements (ondansétron souvent nécessaire), neutropénie, dysfonction cardiaque, pneumopathie interstitielle. <b>Précautions.</b> Métabolisation par le CYP3A4 ; ECG si d’autres médicaments allongent l’intervalle QT.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680663100014" target="_blank" rel="noopener">Rydapt®</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
<template data-pop="c96-avapritinib" data-title="Avapritinib (Ayvakyt®) : monographie"><p><b>Indication suisse.</b> Mastocytose avancée après au moins un traitement systémique. <b>Posologie.</b> 200 mg une fois par jour, dose maximale à ne pas dépasser ; 25 mg par jour dans la forme indolente symptomatique réfractaire (Onkopedia).</p><p><b>Efficacité.</b> Réponse globale de 60 à 75 % et rémission complète de 19 % (étude PATHFINDER). <b>Sécurité.</b> Non recommandé si plaquettes inférieures à 50 G/l ; risque d’hémorragie intracrânienne majoré si plaquettes inférieures à 50 G/l et dose initiale de 300 mg ou plus ; effets cognitifs ; éviter les inhibiteurs puissants ou modérés du CYP3A.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680682940011" target="_blank" rel="noopener">Ayvakyt®</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
<template data-pop="c96-allogreffe" data-title="Allogreffe dans la mastocytose avancée"><p>Seule option potentiellement curative. Survie à 3 ans de 57 % dans une série (74 % pour la forme associée à une néoplasie hématologique, 43 % pour la forme agressive, 17 % pour la leucémie à mastocytes). Le registre ECNM de 2026 ne montre pas de bénéfice global de survie (rapport de risque de 1,21), le bénéfice étant limité à la mastocytose associée à une leucémie myéloïde aiguë (rapport de risque de 0,20) ; la réponse aux inhibiteurs de tyrosine kinase prédit la survie (rapport de risque de 0,42).</p><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a> ; <a href="https://doi.org/10.1186/s40164-026-00819-8" target="_blank" rel="noopener">Allogreffe dans la mastocytose avancée, 2026</a>.</p></template>
<template data-pop="c96-sarcome-h" data-title="Sarcome histiocytaire : immunohistochimie et génétique"><p>Phénotype d’histiocyte mature : CD163, CD68, lysozyme et PU.1 positifs, avec CD4 et CD45 ; négativité de CD1a et CD207, de CD21, CD23 et CD35, des marqueurs myéloïdes, mélanocytaires et des cytokératines ; S100 variable. La voie MAPK est altérée dans 57 à 90 % des cas (MAP2K1, BRAF, KRAS), CDKN2A dans 39 à 46 % et TP53 dans 24 %. La tomographie par émission de positons montre une hyperfixation intense.</p><p class="src">Référence : <a href="https://doi.org/10.3390/ijms26178554" target="_blank" rel="noopener">Sarcome histiocytaire, revue 2025</a>.</p></template>
<template data-pop="c96-sarcome-d" data-title="Sarcome à cellules dendritiques folliculaires"><p>Tumeur maligne rare des cellules présentatrices d’antigène folliculaires, ganglionnaire ou extraganglionnaire. Variante de type pseudotumeur inflammatoire : positive pour le virus d’Epstein-Barr, surtout hépatique et splénique. Dans une revue de 44 cas hépatiques, l’âge moyen est de 48 ans, la prédominance féminine, et la survie sans maladie à 5 ans de 63,4 %. La chirurgie radicale est déterminante.</p><p class="src">Références : <a href="https://doi.org/10.1177/03000605251405692" target="_blank" rel="noopener">Sarcome dendritique folliculaire hépatique, 2025</a> ; <a href="https://doi.org/10.3389/fimmu.2026.1685017" target="_blank" rel="noopener">Sarcome dendritique folliculaire et maladie liée aux IgG4, 2026</a>.</p></template>
<template data-pop="pareto-c96-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="c96-0,c96-1,c96-2,c96-3,c96-4,c96-5,c96-6"></p><ul><li>C96 est une catégorie de codage qui regroupe l’HCL (C96.0, C96.5, C96.6), la tumeur à mastocytes (C96.2) et les sarcomes (C96.4, C96.8).</li><li>L’extension code l’HCL : unifocale C96.6, multifocale unisystémique C96.5, multisystémique C96.0.</li><li>La mastocytose indolente (D47.0) et la leucémie à mastocytes (C94.3-) sont exclues de C96.</li><li>BRAF V600E dans environ 50 % des HCL ; KIT mutée dans plus de 90 % des mastocytoses, dont plus de 95 % D816V.</li><li>Diabète insipide jusqu’à 30 % des adultes atteints d’HCL ; un diabète insipide nouveau signe une maladie active.</li><li>HCL pulmonaire : fumeurs dans plus de 90 % ; arrêt du tabac souvent suffisant.</li><li>Sarcome histiocytaire : masse indolore volumineuse, survie médiane d’environ 6 mois.</li></ul></template>
<template data-pop="pareto-c96-dx" data-title="Pareto — Diagnostic, urgences et traitement de l’adulte"><p class="ratio" data-cover="c96-7,c96-8,c96-9,c96-10"></p><ul><li>HCL certaine : histologie compatible avec CD1a et/ou langerine ; BRAF V600E recherché chez tous ; TEP-scanner au FDG chez tous les adultes.</li><li>Mastocytose : un critère majeur et un mineur, ou trois mineurs ; agressive = au moins un C-finding.</li><li>Sarcome histiocytaire : CD163, CD68, lysozyme et PU.1 positifs ; CD1a et langerine négatifs.</li><li>Urgences : anaphylaxie, organes à risque, système nerveux central, diabète insipide.</li><li>Unifocale : chirurgie limitée ; pulmonaire : arrêt du tabac ; multisystémique : cladribine ou cytarabine.</li><li>Inhibiteurs de BRAF et de MEK : efficaces mais hors indication en Suisse ; rechute à l’arrêt.</li><li>Enfant : vinblastine avec prednisone, entretien jusqu’à 12 mois.</li></ul></template>
<template data-pop="pareto-c96-trait" data-title="Pareto — Mastocytose, sarcomes, suivi et critères"><p class="ratio" data-cover="c96-11,c96-12,c96-13,c96-14,c96-15"></p><ul><li>Mastocytose : anti-H1, anti-H2, trousse d’urgence avec auto-injecteur d’adrénaline, bisphosphonates dès T-score inférieur à −2.</li><li>Forme avancée : midostaurine (100 mg deux fois par jour) ou avapritinib après un premier traitement (200 mg par jour, plaquettes d’au moins 50 G/l).</li><li>Allogreffe : seule option curative ; bénéfice limité à la mastocytose associée à une leucémie myéloïde aiguë.</li><li>Sarcome histiocytaire localisé : exérèse R0 ; disséminé : chimiothérapie de type CHOP.</li><li>Survie médiane : mastocytose indolente normale ; agressive environ 4 ans ; leucémie à mastocytes 0,5 à 1,5 an ; sarcome histiocytaire 6 mois.</li><li>Suivi de l’HCL : réévaluation tous les 3 à 6 mois, puis annuelle ; séquelles tardives fréquentes.</li></ul></template>
<template data-pop="pareto-c96-ex" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="c96-e-1,c96-e-2,c96-e-3,c96-e-4,c96-e-5,c96-e-6"></p><ul><li>La biopsie avec CD1a et langerine est l’examen de référence de l’HCL.</li><li>BRAF V600E : VE1 puis méthode moléculaire, séquençage si sauvage ; décalcification à l’EDTA.</li><li>TEP-scanner au FDG chez tous les adultes ; polyurie : osmolalités, restriction hydrique, IRM.</li><li>Mastocytose : tryptase hors crise, KIT D816V par PCR quantitative, moelle.</li><li>Corriger la tryptase en cas d’alpha-tryptasémie héréditaire.</li><li>Un profil complet de marqueurs, jamais un marqueur isolé.</li></ul></template>
<template data-pop="pareto-c96-sci" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="c96-s-histo-body,c96-s-gen-body,c96-s-bioc-body,c96-s-phys-body"></p><ul><li>Trois cellules : Langerhans (CD1a, langerine), histiocyte malin (CD163, sans CD1a), mastocyte (agrégats, KIT).</li><li>La voie MAPK (RAS-RAF-MEK-ERK) est activée par BRAF V600E ; les inhibiteurs bloquent BRAF ou MEK.</li><li>KIT D816V s’active sans ligand ; les médiateurs mastocytaires expliquent le flush, le prurit et l’anaphylaxie.</li><li>L’infiltration de l’hypophyse explique le diabète insipide et les déficits antéhypophysaires.</li></ul></template>
<template data-pop="pareto-c96-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="c96-p-1,c96-p-2,c96-p-3,c96-p-4,c96-p-5"></p><ul><li>Seules la midostaurine et l’avapritinib ont une indication suisse nommée (mastocytose avancée).</li><li>Cladribine, cytarabine et inhibiteurs de BRAF et de MEK dans l’HCL : hors indication.</li><li>Avapritinib : plaquettes d’au moins 50 G/l, dose maximale 200 mg par jour, éviter les inhibiteurs du CYP3A.</li><li>Cladribine : contre-indiquée pendant la grossesse ; contraception 6 mois ; déplétion des lymphocytes T.</li><li>Bisphosphonates : ostéonécrose de la mâchoire.</li></ul></template>
