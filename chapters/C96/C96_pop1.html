<template data-pop="c96-sources-guides" data-title="Sources, niveau de preuve et lacunes"><h3>Sources utilisées</h3><p>Le chapitre repose sur vingt sources lues : la classification suisse et allemande des maladies (BfArM, intitulés français de l’Office fédéral de la statistique), les recommandations <button class="w" data-k="c96-sources-guides">Euro-Histio-Net</button> de l’adulte (2013) et de l’enfant (2013), le consensus de la <button class="w" data-k="c96-sources-guides">Histiocyte Society</button> sur l’adulte (2022), un registre anglais, une étude suisse sur les survivants, le guide Onkopedia sur la mastocytose systémique (2024), les critères de l’<button class="w" data-k="c96-sources-guides">ECNM</button> (2021), des registres de la mastocytose, une revue sur le sarcome histiocytaire (2025) et quatre informations professionnelles Swissmedic (Rydapt®, Ayvakyt®, Litak®, Zelboraf®).</p><p>Onkopedia est un guide commun aux sociétés allemande, autrichienne et suisse d’hématologie et d’oncologie médicale. La <button class="w" data-k="c96-sources-guides">SGH/SSH</button> (Société suisse d’hématologie) et la <button class="w" data-k="c96-sources-guides">SGMO</button> (Société suisse d’oncologie médicale) en sont cosignataires. L’ECNM est le réseau européen sur la mastocytose.</p><h3>Niveau de preuve</h3><p>Les recommandations pour l’HCL reposent sur des avis d’experts et des séries ; celles de la mastocytose sur un guide de sociétés savantes et des registres. Le sarcome histiocytaire repose sur des revues de cas. Aucun essai randomisé n’est cité dans ce chapitre.</p><h3>Lacunes</h3><ul><li>Aucune recommandation suisse propre (Swiss Medical Forum, société suisse d’hématologie) sur l’HCL ni sur les sarcomes histiocytaires et dendritiques.</li><li>Aucune donnée d’incidence suisse (HCL, mastocytose).</li><li>Résultats de l’essai LCH-IV et recommandations pédiatriques récentes non lus.</li><li>Critères du syndrome d’activation mastocytaire non lus ; classement des cytopénies entre B-findings et C-findings ambigu.</li><li>Sarcomes à cellules de Langerhans et dendritiques interdigités : aucune revue thérapeutique dédiée.</li><li>C96.7 et C96.9 : aucune source clinique spécifique.</li><li>Informations professionnelles du dabrafénib, du trametinib et du cobimétinib non consultées.</li></ul><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; Intitulés français de la CIM-10-GM 2024, fragment H-08 du dépôt MEDINA ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
<template data-pop="c96-categorie" data-title="Catégorie de codage C96"><p>Une catégorie de codage regroupe des diagnostics pour la statistique et la facturation ; elle ne désigne pas une maladie unique. C96 réunit l’histiocytose à cellules de Langerhans (C96.0, C96.5, C96.6), la tumeur maligne à mastocytes (C96.2), le sarcome à cellules dendritiques (C96.4) et le sarcome histiocytaire (C96.8), ainsi que deux codes résiduels (C96.7 et C96.9). Les codes C96.1 et C96.3 n’existent pas dans la version 2024.</p><p>La conséquence pratique est double : le code se choisit après le diagnostic précis, et un même code peut recouvrir des traitements très différents. La mastocytose indolente (D47.0) et la leucémie à mastocytes (C94.3-) sont exclues de C96.</p><p class="src">Référence : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a>.</p></template>
<template data-pop="c96-clonal" data-title="Néoplasie clonale et cellules dendritiques"><p>Une néoplasie est clonale lorsque toutes ses cellules dérivent d’une cellule mutée unique. Les cellules dendritiques sont des cellules présentatrices d’antigène. Dans l’HCL, la présence de BRAF V600E dans plus de la moitié des échantillons, d’autres altérations de la voie MAPK dans les cas sauvages et un caryotype en général normal avec moins de 5 mutations somatiques ont fait classer la maladie comme une néoplasie plutôt que comme une réaction inflammatoire.</p><p>L’infiltrat contient pourtant beaucoup de cellules non tumorales, d’où l’ancienne confusion. La clonalité explique aussi le risque de seconds cancers et la possibilité de rechute après traitement.</p><p class="src">Références : <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a>.</p></template>
<template data-pop="c96-mapk" data-title="Voie MAPK et BRAF V600E"><p>La voie MAPK (RAS-RAF-MEK-ERK) transmet un signal de prolifération de la membrane cellulaire au noyau. BRAF est la kinase de la chaîne ; la mutation V600E substitue un acide aminé au niveau 600 et rend la kinase active en permanence. Environ 50 % des HCL la portent ; les cas sauvages ont d’autres altérations de la voie (RAS, fusions de kinases), et rarement de la voie PI3K-AKT-mTOR.</p><p>Conséquence thérapeutique : les inhibiteurs de BRAF et de MEK bloquent la chaîne, avec des réponses quasi universelles mais une rechute à l’arrêt. En Suisse, le vémurafénib est autorisé dans le mélanome BRAF V600 seulement.</p><p class="src">Références : <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621390013" target="_blank" rel="noopener">Zelboraf®</a>.</p></template>
<template data-pop="c96-extension" data-title="Classification par extension et codage"><table class="t"><tr><th>Extension</th><th>Définition</th><th>Code</th></tr><tr><td>Unifocale</td><td>Une seule lésion (os, peau, ganglion…)</td><td>C96.6</td></tr><tr><td>Multifocale unisystémique</td><td>Plusieurs lésions dans un seul système (par exemple os ou poumon)</td><td>C96.5</td></tr><tr><td>Multisystémique</td><td>Deux organes ou systèmes ou plus</td><td>C96.0</td></tr></table><p>Le consensus de 2022 distingue chez l’adulte les formes unifocale, multifocale unisystémique, pulmonaire unisystémique et multisystémique. Il ne sépare plus les organes à risque chez l’adulte, faute de données pronostiques. Chez l’enfant, la classification d’Euro-Histio-Net sépare les atteintes avec et sans organes à risque.</p><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a>.</p></template>
<template data-pop="c96-organes-risque" data-title="Organes à risque de l’enfant"><p>Les organes à risque de l’enfant sont le système hématopoïétique, la rate et le foie. Hématopoïèse : forme légère (hémoglobine de 7 à 10 g/dl et plaquettes de 20 à 100 G/l) ou sévère (hémoglobine inférieure à 7 g/dl et plaquettes inférieures à 20 G/l). Rate : plus de 3 cm sous le rebord costal, confirmée par échographie. Foie : plus de 3 cm sous le rebord et/ou dysfonction (bilirubine supérieure à 3 fois la normale, hypoalbuminémie, gamma-glutamyl transférase supérieures à 2 fois la normale, ALAT ou ASAT supérieures à 3 fois la normale, ascite, œdèmes, masse nodulaire).</p><p>Le poumon a été retiré de la liste dans l’essai LCH-IV. L’atteinte d’un organe à risque justifie un traitement d’entretien avec 6-mercaptopurine et assombrit le pronostic en cas d’échec.</p><p class="src">Référence : <a href="https://doi.org/10.1002/pbc.24367" target="_blank" rel="noopener">Euro-Histio-Net, enfant, 2013</a>.</p></template>
<template data-pop="c96-risque-snc" data-title="Lésions à risque pour le système nerveux central"><p>Les lésions des os crâniens hors voûte (orbite, temporal, mastoïde, sphénoïde, zygoma, ethmoïde, maxillaire, base du crâne), surtout avec extension intracrânienne de tissus mous, sont dites « à risque pour le système nerveux central ». Elles justifient chez l’enfant un traitement systémique en raison du risque accru de diabète insipide. Selon Euro-Histio-Net, la plupart des experts appliquent la même règle chez l’adulte.</p><p class="src">Références : <a href="https://doi.org/10.1002/pbc.24367" target="_blank" rel="noopener">Euro-Histio-Net, enfant, 2013</a> ; <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a>.</p></template>
<template data-pop="c96-di" data-title="Diabète insipide et déficits hypophysaires"><p>Le diabète insipide survient jusqu’à 30 % des adultes atteints d’HCL (40 % en atteinte multisystémique) et chez 15 à 30 % des enfants. L’insuffisance antéhypophysaire concerne jusqu’à 20 % des adultes, presque toujours avec un diabète insipide ; le déficit en hormone de croissance est le plus fréquent, puis le déficit gonadotrope. Les déficits établis ne récupèrent presque jamais ; un diabète insipide nouveau signe une maladie active.</p><p>Le bilan associe osmolalités, test de restriction hydrique et IRM ; le traitement comprend la desmopressine et un traitement systémique pour prévenir d’autres déficits.</p><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1002/pbc.24367" target="_blank" rel="noopener">Euro-Histio-Net, enfant, 2013</a>.</p></template>
<template data-pop="c96-plch" data-title="Histiocytose pulmonaire à cellules de Langerhans"><p>La forme pulmonaire isolée touche l’adulte jeune, fumeur dans plus de 90 % des cas, avec un pic entre 20 et 40 ans. Les symptômes sont la toux sèche, la dyspnée et la douleur thoracique ; environ 20 % des patients sont asymptomatiques et 20 % présentent un pneumothorax. Le scanner montre des nodules, des nodules excavés puis des kystes à paroi épaisse puis fine, prédominant aux étages moyen et supérieur et épargnant les culs-de-sac ; la DLCO est abaissée dans 70 à 90 % des cas.</p><p>Le traitement de base est l’arrêt du tabac. Les altérations de MAPK sont présentes dans 85 % des lésions.</p><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a>.</p></template>
<template data-pop="c96-marqueurs" data-title="CD1a, langerine, granules de Birbeck"><p>CD1a et la langerine (CD207) sont des protéines exprimées par les cellules de Langerhans. Les granules de Birbeck sont des structures visibles en microscopie électronique. Le diagnostic certain d’HCL exige une histologie compatible et au moins un de ces trois éléments. Le consensus de 2022 retient comme panel minimal CD1a avec CD207, et les autres marqueurs du phénotype sont CD68, S100 et ZBTB46. La microscopie électronique n’est plus nécessaire.</p><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://doi.org/10.1002/pbc.24367" target="_blank" rel="noopener">Euro-Histio-Net, enfant, 2013</a>.</p></template>
<template data-pop="c96-braf-test" data-title="Recherche de BRAF V600E"><ul><li>Tous les patients : recherche de BRAF V600E.</li><li>Immunohistochimie avec l’anticorps VE1 ; si négative ou équivoque, confirmation par méthode moléculaire.</li><li>Si BRAF est sauvage : séquençage de nouvelle génération de la voie MAPK.</li><li>Tissu insuffisant : ADN libre circulant.</li><li>Prélèvement : 5 à 10 carottes de 16 à 18 G plutôt que cytoponction ; décalcification à l’EDTA pour préserver l’ADN.</li></ul><p>Une mutation BRAF V600E identifiée ouvre l’option des inhibiteurs de BRAF et de MEK et signale un risque plus élevé de seconds cancers.</p><p class="src">Références : <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://doi.org/10.1182/blood.2023021212" target="_blank" rel="noopener">BRAF V600E et seconds cancers, 2023</a>.</p></template>
<template data-pop="c96-curetage" data-title="Lésion osseuse unifocale : curetage et corticoïde local"><p>Pour une lésion osseuse unifocale hors sites spéciaux, la biopsie ou le curetage déclenche souvent la guérison ; l’exérèse complète n’est pas nécessaire. Une injection intralésionnelle de méthylprednisolone (40 à 160 mg) est une option, et la radiothérapie de 10 à 20 Gy est réservée au risque neurologique imminent. Un os douloureux persiste chez jusqu’à la moitié des patients malgré la normalisation de la TEP.</p><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a>.</p></template>
<template data-pop="c96-tabac" data-title="Arrêt du tabac dans la forme pulmonaire"><p>L’arrêt du tabac (y compris cannabis et vapotage) est souvent la seule mesure nécessaire dans la forme pulmonaire unisystémique. Si la maladie progresse, la cladribine est le traitement systémique préféré. La transplantation pulmonaire est réservée à l’insuffisance respiratoire sévère, avec récidive possible sur le greffon. Les corticoïdes à 1 mg/kg par jour avec décroissance sont mentionnés par Euro-Histio-Net dans la forme nodulaire.</p><p class="src">Références : <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a>.</p></template>
<template data-pop="c96-cladribine" data-title="Cladribine : monographie"><p><b>Mécanisme.</b> Analogue nucléosidique ; effet lymphopéniant. <b>Indication suisse (Litak®).</b> Leucémie à tricholeucocytes et lymphoproliférations de bas grade ; l’usage dans l’HCL ou la mastocytose est hors indication.</p><p><b>Posologie rapportée.</b> HCL de l’adulte : 6 mg/m² du jour 1 au jour 5 toutes les 4 semaines ; 4 cycles réduisent les cytopénies sévères. Mastocytose : 0,14 mg/kg pendant 5 jours, 3 à 6 cycles. <b>Résultats.</b> Réponse de 75 % dans l’HCL de l’adulte avec neutropénie fébrile de 15 % ; réponses partielles jusqu’à 50 % dans la mastocytose.</p><p><b>Effets et précautions.</b> Neutropénies transitoires sévères, déplétion prolongée des lymphocytes T CD4+ et CD8+, contre-indication absolue pendant la grossesse, contraception jusqu’à 6 mois après la dernière dose, prophylaxie par cotrimoxazole et aciclovir dans la mastocytose.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680551720119" target="_blank" rel="noopener">Litak®</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
<template data-pop="c96-cytarabine" data-title="Cytarabine : place dans l’HCL"><p>Préférée avec la cladribine dans la forme multifocale ou multisystémique de l’adulte. Schéma Euro-Histio-Net : 100 mg/m² du jour 1 au jour 5 toutes les 4 semaines, 6 à 12 cycles. Une association méthotrexate et cytarabine, dans une étude prospective, donne une réponse de 88 %, une progression à 3 ans de 32 % et une neutropénie fébrile de 48 %. À dose plus élevée, la cytarabine est une option dans l’atteinte tumorale du système nerveux central.</p><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a>.</p></template>
<template data-pop="c96-vinblastine" data-title="Vinblastine avec prednisone"><p>Traitement de référence de l’HCL multisystémique de l’enfant : vinblastine 6 mg/m² par voie intraveineuse chaque semaine, prednisone 40 mg/m² par jour, induction de 6 semaines, entretien jusqu’à 12 mois. Chez l’adulte, c’est une alternative non préférée : rechutes de 40 à 80 % et neuropathie.</p><p class="src">Références : <a href="https://doi.org/10.1002/pbc.24367" target="_blank" rel="noopener">Euro-Histio-Net, enfant, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a>.</p></template>
<template data-pop="c96-braf-mek" data-title="Inhibiteurs de BRAF et de MEK dans l’HCL"><p>Les inhibiteurs de BRAF et de MEK donnent des réponses quasi universelles, utiles pour réverser rapidement une atteinte d’organe ; la rechute survient à l’arrêt. La dose initiale est la moitié de celle du mélanome. En Suisse, le vémurafénib (Zelboraf®) n’est autorisé que dans le mélanome BRAF V600 : son usage dans l’HCL est hors indication. Les informations du dabrafénib, du trametinib et du cobimétinib n’ont pas été consultées.</p><p class="src">Références : <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680621390013" target="_blank" rel="noopener">Zelboraf®</a>.</p></template>
<template data-pop="c96-bisphos" data-title="Bisphosphonates"><p>Dans l’HCL osseuse multifocale sans risque structurel, le zolédronate (4 mg) est proposé ; le risque est l’ostéonécrose de la mâchoire. Dans la mastocytose, les bisphosphonates sont donnés dès un T-score inférieur à −2, après correction de la vitamine D.</p><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a>.</p></template>
