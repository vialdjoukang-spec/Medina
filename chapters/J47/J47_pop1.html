<template data-pop="j47-vortex" data-title="Le vortex des bronchectasies"><p class="lab">Définition</p><p>Le modèle relie quatre composantes : clairance mucociliaire altérée, infection bactérienne chronique, inflammation neutrophilique et lésion structurelle de la paroi. Décrit d’abord comme un cercle où chaque étape engendre la suivante, il est aujourd’hui présenté comme un « vortex », car chaque composante agit sur toutes les autres.</p><p class="lab">Mécanisme</p><p>Le mucus stagnant nourrit les bactéries ; les bactéries attirent les neutrophiles ; les protéases des neutrophiles détruisent la paroi ; la paroi dilatée retient davantage de mucus. Chaque cause de bronchectasies entre dans le modèle par une porte différente : la mucoviscidose et la dyskinésie ciliaire par la clairance, le déficit immunitaire par l’infection, l’infection grave par la lésion.</p><p class="lab">Conséquence clinique</p><p>Un antibiotique isolé ne touche qu’une composante : l’inflammation et la lésion peuvent persister par d’autres voies. Le traitement combine donc drainage, anti-infectieux et, chez certains patients, anti-inflammatoire.</p><div class="key"><b>Limite.</b> Le modèle est explicatif ; il ne dit pas, chez un patient donné, quelle composante domine. La bactériologie et la clinique le précisent.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30215383/" target="_blank" rel="noopener">Flume, Chalmers et Olivier, Lancet 2018;392:880-890</a>.</p></template>
<template data-pop="j47-consensus" data-title="Critères diagnostiques : version, seuils et limites"><p class="lab">Définition</p><p>La recommandation de l’ERS de 2025 définit les bronchectasies par une dilatation bronchique permanente associée à un syndrome clinique caractéristique. Le consensus international de 2022, conçu pour harmoniser les essais cliniques, exige des critères cliniques et radiologiques pour parler de bronchectasies cliniquement significatives.</p><p class="lab">Critères tomodensitométriques</p><p>La British Thoracic Society retient au moins un signe parmi trois : un rapport entre la lumière interne de la bronche et l’artère adjacente supérieur à 1, une absence d’effilement, une bronche visible à moins de 1 cm de la plèvre costale ou au contact de la plèvre médiastinale. L’épaississement pariétal, l’impaction mucoïde et la perfusion en mosaïque sont des signes indirects.</p><p class="lab">Conséquence clinique</p><p>Exiger des symptômes évite de nommer maladie une image sans conséquence ; exiger une image évite d’appeler bronchectasies une bronchite chronique. Une dilatation découverte chez un sujet asymptomatique ne justifie pas, à elle seule, un traitement.</p><div class="key"><b>Limite.</b> Le consensus de 2022 a été conçu pour standardiser le recrutement des essais cliniques ; en pratique, le jugement clinique tranche les cas limites.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/34570994/" target="_blank" rel="noopener">Aliberti et al., Lancet Respir Med 2022;10:298-306</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society, BMJ Open Respir Res 2018</a>.</p></template>
<template data-pop="j47-formes" data-title="Formes cylindrique, variqueuse et kystique"><p class="lab">Définition</p><p>La forme cylindrique correspond à une bronche régulièrement élargie, la forme variqueuse à un calibre irrégulier, la forme kystique à des dilatations sacculaires.</p><p class="lab">Valeur pronostique</p><p>Dans une série de patients stables, les formes variqueuses ou kystiques étaient indépendamment associées à une expectoration purulente, elle-même liée à la colonisation bactérienne. Le score BSI attribue 1 point à une atteinte d’au moins trois lobes ou à une forme kystique, quel que soit le lobe.</p><p class="lab">Conséquence clinique</p><p>La forme renseigne sur la profondeur de l’atteinte, non sur sa cause : une forme kystique n’oriente vers aucune étiologie particulière.</p><div class="key"><b>Limite.</b> Plusieurs formes coexistent souvent chez un même patient ; la description retient la plus sévère et son extension.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/19648517/" target="_blank" rel="noopener">Murray et al., Eur Respir J 2009;34:361-364</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018, tableau 4</a>.</p></template>
<template data-pop="j47-mucoviscidose" data-title="Mucoviscidose : une cause à part"><p class="lab">Définition</p><p>La mucoviscidose est une maladie génétique du canal chlorure CFTR. Ses bronchectasies relèvent de recommandations propres ; les recommandations de l’ERS et de la British Thoracic Society sur les bronchectasies l’excluent.</p><p class="lab">Indices chez l’adulte</p><p>Un début précoce, une atteinte des lobes supérieurs, une infertilité masculine, une malabsorption ou une pancréatite font demander un test de la sueur et une génétique.</p><p class="lab">Conséquence clinique</p><p>Un diagnostic tardif de mucoviscidose change la prise en charge et l’orientation. Les traitements validés dans cette maladie ne se transposent pas aux autres bronchectasies : la désoxyribonucléase recombinante y est même délétère.</p><div class="key"><b>Piège.</b> Une infertilité masculine associée à des bronchectasies évoque aussi une dyskinésie ciliaire primitive ; les deux bilans sont souvent menés ensemble.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026, encadré 1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9596315/" target="_blank" rel="noopener">O’Donnell et al., Chest 1998</a>.</p></template>
<template data-pop="j47-embarc" data-title="Le registre européen EMBARC"><p class="lab">Définition</p><p>EMBARC est un réseau européen de recherche clinique sur les bronchectasies. Son registre prospectif a inclus 16 963 adultes entre le 12 janvier 2015 et le 12 avril 2022, dans 27 pays européens et en Israël.</p><p class="lab">Apport</p><p>Il a décrit l’âge médian de 67 ans, la prédominance féminine (60,9 %), la fréquence des causes idiopathiques (38,1 %) et post-infectieuses (21,2 %), et des différences régionales de bactériologie : plus de <i>Pseudomonas aeruginosa</i> au sud, plus d’<i>Haemophilus influenzae</i> dans les centres britanniques et en Europe du Nord et de l’Ouest. Les patients d’Europe centrale et orientale avaient des formes plus sévères et davantage d’hospitalisations.</p><div class="key"><b>Limite.</b> Le registre recrute dans des centres spécialisés ; il surreprésente les formes suivies et ne mesure pas la prévalence dans la population.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37105206/" target="_blank" rel="noopener">Chalmers et al., Lancet Respir Med 2023;11:637-649</a>.</p></template>
<template data-pop="j47-bsi" data-title="Score BSI : barème et interprétation"><p class="lab">Barème</p><p>Le score BSI additionne neuf variables : âge (0 point avant 50 ans, 2 de 50 à 69 ans, 4 de 70 à 79 ans, 6 au-delà de 80 ans) ; indice de masse corporelle inférieur à 18,5 kg/m² (2) ; VEMS en pourcentage de la valeur prédite (0 au-delà de 80 %, 1 de 50 à 80 %, 2 de 30 à 49 %, 3 en dessous de 30 %) ; hospitalisation au cours des deux années précédentes (5) ; trois exacerbations ou plus dans l’année (2) ; dyspnée sur l’échelle du Medical Research Council (2 pour le grade 4, 3 pour le grade 5) ; colonisation par <i>Pseudomonas aeruginosa</i> (3) ; colonisation par un autre germe (1) ; atteinte d’au moins trois lobes ou forme kystique (1).</p><p class="lab">Interprétation</p><p>Un total de 0 à 4 définit une forme légère, de 5 à 8 une forme modérée, de 9 ou plus une forme sévère. Dans l’étude de dérivation, le score prédisait la mortalité et les hospitalisations à quatre ans, avec des aires sous la courbe de 0,80 et 0,88, et distinguait aussi la fréquence des exacerbations.</p><div class="key"><b>Limite.</b> Le score reflète un risque de groupe ; la recommandation de l’ERS de 2025 lui préfère une évaluation individuelle du risque d’exacerbation pour décider d’une prévention.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24328736/" target="_blank" rel="noopener">Chalmers et al., Am J Respir Crit Care Med 2014;189:576-585</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018, tableau 4</a>.</p></template>
<template data-pop="j47-faced" data-title="Score FACED"><p class="lab">Barème</p><p>Le score FACED retient cinq variables dichotomiques : VEMS inférieur à 50 % (2 points), âge d’au moins 70 ans (2), colonisation chronique par <i>Pseudomonas aeruginosa</i> (1), atteinte de plus de deux lobes (1), dyspnée de grade III ou IV sur l’échelle modifiée du Medical Research Council (1).</p><p class="lab">Interprétation</p><p>Le total de 0 à 7 distingue des formes légères (0 à 2), modérées (3 et 4) et sévères (5 à 7). Il a été construit sur 819 patients pour prédire la mortalité à cinq ans.</p><div class="key"><b>Limite.</b> Le score FACED ne contient pas les exacerbations ; il est surtout un outil de pronostic vital. Une variante étendue ajoute les exacerbations sévères.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24232697/" target="_blank" rel="noopener">Martínez-García et al., Eur Respir J 2014;43:1357-1367</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018, tableau 5</a>.</p></template>
<template data-pop="j47-clairance" data-title="La clairance mucociliaire normale"><p class="lab">Définition</p><p>La clairance mucociliaire est le transport du mucus bronchique vers le larynx par le battement des cils. Elle est le principal mécanisme de défense innée du poumon.</p><p class="lab">Mécanisme</p><p>Trois éléments la composent : la couche de mucus protectrice, le liquide de surface des voies aériennes et les cils des cellules ciliées. Les cils battent en ondes métachrones et propulsent les particules et les germes piégés dans le mucus hors des voies aériennes.</p><p class="lab">Conséquence clinique</p><p>Dans la dyskinésie ciliaire primitive, des cils anormaux rendent la clairance déficiente et provoquent une maladie pulmonaire chronique. Une expectoration chaque matin signifie que la clairance ne suffit plus.</p><div class="key"><b>Limite.</b> La mesure de la clairance par aérosol radioactif reste un outil de recherche ; elle n’est pas nécessaire au diagnostic.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27864314/" target="_blank" rel="noopener">Bustamante-Marin et Ostrowski, Cold Spring Harb Perspect Biol 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27836958/" target="_blank" rel="noopener">Lucas et al., Eur Respir J 2017</a>.</p></template>
<template data-pop="j47-elastase" data-title="Élastase neutrophile"><p class="lab">Définition</p><p>L’élastase neutrophile est une protéase à sérine du neutrophile, activée avec la cathepsine G et la protéinase 3 par la dipeptidyl peptidase 1 pendant la maturation médullaire.</p><p class="lab">Données cliniques</p><p>Dans une cohorte de 433 patients, l’activité élastasique de l’expectoration était corrélée au score BSI, augmentait lors des exacerbations, diminuait sous antibiotique et prédisait les exacerbations et le déclin du VEMS. La desmosine sérique, produit de dégradation de l’élastine, lui était corrélée.</p><p class="lab">Conséquence clinique</p><p>Elle est la cible indirecte du brensocatib, qui bloque son activation.</p><div class="key"><b>Limite.</b> Le dosage de l’activité élastasique de l’expectoration reste un biomarqueur de recherche, non un examen de routine.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27911604/" target="_blank" rel="noopener">Chalmers et al., Am J Respir Crit Care Med 2017;195:1384-1393</a> ; <a href="https://www.ema.europa.eu/en/documents/product-information/brinsupri-epar-product-information_en.pdf" target="_blank" rel="noopener">Résumé européen des caractéristiques de Brinsupri</a>.</p></template>
<template data-pop="j47-biofilm" data-title="Biofilm de Pseudomonas aeruginosa"><p class="lab">Définition</p><p>Un biofilm est une communauté bactérienne enrobée dans une matrice qu’elle produit. Chez <i>Pseudomonas aeruginosa</i>, la conversion vers un phénotype mucoïde s’accompagne de la production d’un polysaccharide, l’alginate.</p><p class="lab">Mécanisme</p><p>Des mutations du gène <i>mucA</i> lèvent le frein qui limite la synthèse d’alginate. La bactérie perd ses appendices et s’installe en infection chronique. La détection du quorum, communication chimique entre bactéries, régule des gènes qui favorisent leur survie et atténuent la réponse immunitaire.</p><p class="lab">Conséquence clinique</p><p>L’infection devient chronique. Agir dès le premier isolement, avant cette adaptation, justifie la stratégie d’éradication.</p><div class="key"><b>Limite.</b> Ces mécanismes ont été surtout décrits dans la mucoviscidose ; leur poids exact dans les autres bronchectasies est moins bien établi.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/34743315/" target="_blank" rel="noopener">Reynolds et Kollef, Drugs 2021;81:2117-2131</a>.</p></template>
<template data-pop="j47-postinfectieux" data-title="Bronchectasies post-infectieuses"><p class="lab">Définition</p><p>Ce sont des bronchectasies attribuées à une infection grave antérieure. Les symptômes doivent typiquement débuter juste après cette infection.</p><p class="lab">Données</p><p>Elles représentaient 21,2 % des patients du registre EMBARC, ce qui en fait la première cause identifiée. L’atteinte peut toucher n’importe quel territoire, parfois un seul lobe.</p><div class="key"><b>Piège.</b> Une infection ancienne ne dispense pas du bilan de base : un déficit humoral peut avoir favorisé l’infection initiale et rester méconnu.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37105206/" target="_blank" rel="noopener">registre EMBARC, 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30215383/" target="_blank" rel="noopener">Flume et al., Lancet 2018, tableau 1</a>.</p></template>
<template data-pop="j47-abpa" data-title="Aspergillose bronchopulmonaire allergique"><p class="lab">Définition</p><p>L’ABPA est une réaction d’hypersensibilité à <i>Aspergillus fumigatus</i>, surtout chez l’asthmatique ou dans la mucoviscidose. Elle provoque des bouchons muqueux et des bronchectasies centrales.</p><p class="lab">Critères révisés de 2024</p><p>Deux éléments sont indispensables : une sensibilisation démontrée, par des IgE spécifiques anti-<i>Aspergillus</i> d’au moins 0,35 kUA/L, et des IgE totales d’au moins 500 UI/mL. Deux éléments parmi les suivants complètent le diagnostic : IgG spécifiques, éosinophiles d’au moins 500 par µL, imagerie évocatrice. Des bouchons muqueux hyperdenses en tomodensitométrie sont pathognomoniques.</p><p class="lab">Traitement</p><p>Une ABPA aiguë se traite par prednisolone orale ou par itraconazole en monothérapie ; l’association est réservée aux exacerbations récidivantes. Les IgE totales servent au suivi : une hausse d’au moins 50 % par rapport à la nouvelle valeur de base signe une exacerbation.</p><div class="key"><b>Piège.</b> Une corticothérapie antérieure peut abaisser les IgE totales sous 500 UI/mL. Une ABPA méconnue explique une détérioration rapide ; elle est recherchée au diagnostic et à chaque aggravation.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/38423624/" target="_blank" rel="noopener">Agarwal et al., Eur Respir J 2024;63:2400061</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026, encadré 4</a>.</p></template>
<template data-pop="j47-deficit" data-title="Déficit immunitaire humoral"><p class="lab">Définition</p><p>Le déficit immunitaire commun variable, l’agammaglobulinémie liée à l’X et les déficits en anticorps spécifiques diminuent la production d’anticorps.</p><p class="lab">Mécanisme</p><p>Sans anticorps opsonisants, les bactéries échappent à la phagocytose et provoquent des infections répétées, des pneumonies et des infections extrarespiratoires.</p><p class="lab">Conduite</p><p>Les IgG, IgA et IgM sont dosées chez tout patient. La British Thoracic Society propose de mesurer les anticorps antipneumococciques, puis la réponse quatre à huit semaines après un vaccin polysaccharidique si le taux initial est bas. La substitution en IgG est proposée à tous les patients atteints de déficit immunitaire commun variable ou d’agammaglobulinémie liée à l’X, sous suivi conjoint d’un immunologue et d’un pneumologue.</p><div class="key"><b>Piège.</b> Le test de réponse vaccinale est un outil diagnostique : en Suisse, la vaccination antipneumococcique de prévention utilise des vaccins conjugués, et le vaccin polysaccharidique seul n’y est plus recommandé depuis 2014.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j47-dcp" data-title="Dyskinésie ciliaire primitive"><p class="lab">Définition</p><p>Maladie génétique des cils mobiles ; en 2017, des mutations de plus de trente gènes étaient connues.</p><p class="lab">Quand la rechercher</p><p>La recommandation de l’ERS de 2017 recommande fortement de tester les patients qui présentent plusieurs signes parmi une toux grasse persistante, une anomalie de latéralité, une cardiopathie congénitale, une rhinite persistante, une atteinte chronique de l’oreille moyenne et, chez le nouveau-né à terme, des symptômes respiratoires néonatals.</p><p class="lab">Diagnostic</p><p>Le bilan associe la mesure du monoxyde d’azote nasal, abaissé, la vidéomicroscopie à haute vitesse, la microscopie électronique et la génétique, dans un centre spécialisé.</p><div class="key"><b>Piège.</b> Un situs normal n’exclut pas la maladie, et une ultrastructure normale non plus : une histoire évocatrice impose de poursuivre les examens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27836958/" target="_blank" rel="noopener">Lucas et al., Eur Respir J 2017;49:1601090</a>.</p></template>
<template data-pop="j47-systemique" data-title="Maladies systémiques associées"><p class="lab">Définition</p><p>La polyarthrite rhumatoïde, les autres connectivites et les maladies inflammatoires de l’intestin s’associent à des bronchectasies.</p><p class="lab">Données</p><p>Les connectivites s’accompagnent d’un pronostic plus sombre et d’une évolution parfois rapide. Dans les maladies inflammatoires de l’intestin, une bronchorrhée abondante répond souvent aux corticostéroïdes. Le résumé de la recommandation de l’ERS range la polyarthrite rhumatoïde parmi les étiologies associées à un mauvais pronostic.</p><p class="lab">Conduite</p><p>La British Thoracic Society propose de rechercher des bronchectasies chez un patient atteint de polyarthrite rhumatoïde ou de maladie inflammatoire de l’intestin qui tousse et crache, et de tester le facteur rhumatoïde, les anticorps anti-peptides citrullinés, les antinucléaires et les ANCA en présence de signes systémiques.</p><div class="key"><b>Limite.</b> Une sérologie isolée sans signe articulaire, cutané ou digestif ne suffit pas à retenir une connectivite.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30215383/" target="_blank" rel="noopener">Flume et al., Lancet 2018, tableau 1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a>.</p></template>
<template data-pop="j47-bpco" data-title="Bronchectasies et bronchopneumopathie chronique obstructive"><p class="lab">Définition</p><p>Des bronchectasies cylindriques des lobes inférieurs s’observent chez des fumeurs ou anciens fumeurs de plus de 40 ans, d’autant plus souvent que l’obstruction est sévère.</p><p class="lab">Quand les chercher</p><p>La British Thoracic Society propose une tomodensitométrie chez un patient atteint de bronchopneumopathie chronique obstructive qui présente au moins deux exacerbations par an et une culture positive à <i>Pseudomonas aeruginosa</i> en période stable.</p><p class="lab">Conséquence clinique</p><p>L’association expose à un risque de décès plus élevé ; le résumé de l’ERS la compte parmi les étiologies de mauvais pronostic. Les bronchodilatateurs et les corticostéroïdes inhalés suivent les recommandations de la bronchopneumopathie chronique obstructive.</p><div class="key"><b>Limite.</b> Une bronchectasie n’annule pas les traitements propres à la bronchopneumopathie chronique obstructive ; elle ajoute le drainage et, si le risque l’exige, la prévention des exacerbations.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30215383/" target="_blank" rel="noopener">Flume et al., Lancet 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a>.</p></template>
<template data-pop="j47-mnt" data-title="Mycobactéries non tuberculeuses"><p class="lab">Définition</p><p>Les mycobactéries non tuberculeuses vivent dans l’environnement. Leur maladie pulmonaire survient surtout sur des voies aériennes déjà lésées, comme dans les bronchectasies ou la bronchopneumopathie chronique obstructive.</p><p class="lab">Profil évocateur</p><p>Une femme ménopausée, mince, avec une atteinte de la lingula, des micronodules en arbre en bourgeon, une toux chronique, un malaise et une perte de poids évoque cette infection.</p><p class="lab">Diagnostic</p><p>La maladie exige des symptômes, une imagerie compatible, l’exclusion d’autres diagnostics et des cultures positives sur au moins deux expectorations prélevées séparément, selon la recommandation conjointe ATS, ERS, ESCMID et IDSA de 2020.</p><div class="key"><b>Piège.</b> Un patient porteur d’une mycobactérie possiblement active ne doit pas recevoir de macrolide en monothérapie, sous peine d’induire une résistance. L’ERS 2025 recommande donc de rechercher les mycobactéries chez tous les patients.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32636299/" target="_blank" rel="noopener">Daley et al., Eur Respir J 2020;56:2000535</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30215383/" target="_blank" rel="noopener">Flume et al., Lancet 2018, tableau 1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a>.</p></template>
<template data-pop="j47-expectoration" data-title="Couleur de l’expectoration"><p class="lab">Définition</p><p>L’échelle colorimétrique de Murray classe l’expectoration en muqueuse, mucopurulente ou purulente à l’aide d’un nuancier.</p><p class="lab">Valeur</p><p>Médecin et patient interprètent la couleur de façon concordante (coefficient de corrélation intraclasse de 0,83). Une colonisation bactérienne était retrouvée dans 5 % des expectorations muqueuses, 43,5 % des mucopurulentes et 86,4 % des purulentes. La purulence était associée à la colonisation, aux formes variqueuses ou kystiques et à un VEMS inférieur à 80 %.</p><p class="lab">Conséquence clinique</p><p>Une expectoration purulente compte parmi les facteurs de risque d’exacerbation dans la recommandation de l’ERS de 2025. Le patient connaît sa couleur habituelle pour reconnaître une exacerbation.</p><div class="key"><b>Limite.</b> La couleur ne désigne ni le germe ni l’antibiotique ; la culture reste nécessaire.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/19648517/" target="_blank" rel="noopener">Murray et al., Eur Respir J 2009;34:361-364</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a>.</p></template>
<template data-pop="j47-hemoptysie" data-title="Hémoptysie et bronchectasies"><p class="lab">Définition</p><p>L’hémoptysie est l’émission de sang provenant des voies aériennes sous-glottiques lors de la toux.</p><p class="lab">Mécanisme</p><p>Dans les maladies bronchiques chroniques, le saignement provient surtout des artères bronchiques, issues de la circulation systémique et hypertrophiées par l’inflammation.</p><p class="lab">Conséquence clinique</p><p>L’hémoptysie fait partie des six symptômes de la définition de l’exacerbation. Un saignement abondant ou récidivant est une urgence vitale qui conduit à l’angioscanner puis à l’embolisation.</p><div class="key"><b>Piège.</b> La British Thoracic Society demande de revoir la technique de drainage avec le physiothérapeute en cas d’hémoptysie persistante.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25372159/" target="_blank" rel="noopener">Ittrich et al., Rofo 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28596426/" target="_blank" rel="noopener">Hill et al., Eur Respir J 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a>.</p></template>
<template data-pop="j47-crepitants" data-title="Crépitants des bronchectasies"><p class="lab">Définition</p><p>Les crépitants sont des bruits discontinus entendus à l’auscultation.</p><p class="lab">Valeur clinique</p><p>Dans une série de 103 adultes nouvellement diagnostiqués, les crépitants constituaient la principale anomalie de l’examen et étaient en général bibasaux. Le profil typique associait une toux productive ancienne, une rhinosinusite et une fatigue chez des non-fumeurs.</p><p class="lab">Conséquence clinique</p><p>Des crépitants persistants chez un patient qui crache chaque jour justifient une tomodensitométrie.</p><div class="key"><b>Limite.</b> Les crépitants ne précisent ni l’étendue ni la cause des lésions ; leur absence n’exclut pas le diagnostic.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/16650970/" target="_blank" rel="noopener">King et al., Respir Med 2006;100:2183-2189</a>.</p></template>
