8vy9qzkfMQecMQvF7rocYcvKcJj5dzjSdxC59tDZaN2hSFqq8ElYrMTvThB0bXgRcc68ShVS7wJjUJ8vBqU0Fu9wmaZzKu6KDSaGqzDwWu/1Ruw3MYbF7Mf/KgqYbuZ++FQFX8ixqsdLuOtTfSkJBvdd8TZaFiM6Z984w6lHsy9d/Pc/h3I92Uze8wQG04SbjC1XRGq3oBJ5kSm2GeYLHplxN+RJTC4IYg5dvVBz4utWzmtAwZEDuhjRrfDU4ISy0omOTLdc7Mz8ZZdeS+lpDHbnvPJZgYtjA/WI1rYjuXNzyG8/3G9yj+8MqGp3uutjQnRjnm8p+5U/RFFG+tYkigSuSsZ4rEniCB94E/JMhgtnlfZpYZW2ONF5YNd4YiREyhEX0JUNWCScnVRqAusOmS6KSm5Xpy9M+XYHOqdydnNyGithHjXnnTOA0fdz0CNh5XaMbF90UvtjFkPjYMPJp4ju+/qRYk5EnDlc6vlWb+mcdAz3ieSqt4iZpqyeOebqOf8gB1hIk0o1yprvfxxnhu72IDL7X+8NilryupMzTQb6tQl7KQ07E8uxaRF3hTg7dE17hW9mA9vhaRcJPcKKAWj4/coOVs2EaJmThNz7mkcwmO37mnpfOPS60nyyIP8u/0+nmJdQmfiTdl6e/0plxdi6zBh7h9mw3SPLkgj7o0k3ohm4YRTKpUb7nqEzmQjLmaO7cZY5ylEvka+7bAQEAOw==" width="340" height="296" loading="lazy" decoding="async" style="max-width:100%;height:auto" alt="Tomodensitométrie thoracique montrant des bronchiectasies bilatérales des lobes inférieurs avec surinfection"><figcaption>Cette coupe de tomodensitométrie montre des bronchiectasies marquées des deux lobes inférieurs, avec une surinfection floride du côté droit (à gauche de l’image). Les bronches restent larges jusqu’à la périphérie et dépassent le calibre de l’artère voisine, parce que l’inflammation neutrophilique chronique a détruit le tissu élastique et le cartilage de leur paroi. C’est pourquoi la tomodensitométrie, et non la radiographie, établit le diagnostic, en appliquant le critère d’un rapport broncho-artériel supérieur à 1. Source : <a href="https://commons.wikimedia.org/wiki/File:Massive_Bronchiektasen_-_CT_LF_axial_001.jpg" target="_blank" rel="noopener" data-reference-source="1">Hellerhoff, Wikimedia Commons</a> ; <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener" data-reference-source="1">licence CC BY-SA 3.0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Technique</p><p>La British Thoracic Society recommande une tomodensitométrie en coupes fines, d’épaisseur inférieure ou égale à 1 mm, avec un algorithme de reconstruction à haute fréquence spatiale et des techniques de réduction de dose. L’examen de référence est réalisé en période stable.</p><p class="lab">Signes directs</p><p>Au moins un signe suffit : rapport entre la lumière interne de la bronche et l’artère adjacente supérieur à 1, qui dessine la bague à chaton en coupe transversale ; absence d’effilement de la bronche vers la périphérie ; bronche visible à moins de 1 cm de la plèvre costale ou au contact de la plèvre médiastinale.</p><p class="lab">Signes indirects</p><p>L’épaississement pariétal, l’impaction mucoïde et la perfusion en mosaïque avec piégeage sur les coupes en expiration accompagnent souvent les bronchectasies. La tomodensitométrie oriente aussi l’étiologie : ABPA, mycobactérie, dyskinésie ciliaire, déficit en alpha-1 antitrypsine ou corps étranger.</p><div class="key"><b>Piège.</b> Un examen réalisé en pleine infection ne fournit pas une référence fiable : l’imagerie de base se fait à distance de l’épisode aigu.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society, BMJ Open Respir Res 2018</a>.</p></template>
<template data-pop="j47-bilan" data-title="Bilan étiologique de base"><p class="lab">Contenu</p><p>La British Thoracic Society demande chez tout patient une formule sanguine, les IgE totales, une recherche de sensibilisation à <i>Aspergillus fumigatus</i>, le dosage des IgG, IgA et IgM, et des cultures d’expectoration bactérienne et mycobactérienne. Depuis 2025, l’ERS recommande elle aussi la recherche des mycobactéries chez tous les patients, et non plus selon le profil clinique.</p><p class="lab">Raison</p><p>Ces tests sont peu coûteux et détectent chacun un déficit immunitaire, une ABPA ou une mycobactérie chez jusqu’à 10 % des patients. Chacune de ces causes modifie le traitement.</p><p class="lab">Tests ciblés</p><p>La mucoviscidose et la dyskinésie ciliaire sont recherchées devant un début précoce ou des signes évocateurs. L’alpha-1 antitrypsine est dosée en cas d’emphysème panlobulaire basal ; les auto-anticorps sont demandés selon la clinique ; une bronchoscopie explore une atteinte localisée.</p><div class="key"><b>Limite.</b> Le bilan se répète lorsque l’état se dégrade : une cause nouvelle ou méconnue peut apparaître.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026, figure 1 et tableau 1</a>.</p></template>
<template data-pop="j47-risque" data-title="Haut risque d’exacerbation selon l’ERS 2025"><p class="lab">Définition</p><p>Un patient est à haut risque d’exacerbation s’il présente deux exacerbations ou plus par an, une exacerbation par an avec des symptômes sévères, ou au moins une exacerbation sévère nécessitant une hospitalisation.</p><p class="lab">Facteurs qui alourdissent le risque</p><p>Le résumé de la recommandation cite aussi l’étiologie (bronchopneumopathie chronique obstructive, dyskinésie ciliaire primitive, polyarthrite rhumatoïde), les infections à germes à Gram négatif, en particulier <i>Pseudomonas aeruginosa</i>, les symptômes sévères, la purulence de l’expectoration et les complications comme une mycobactérie ou une ABPA.</p><p class="lab">Conséquence clinique</p><p>Les anciennes recommandations réservaient la prévention aux patients ayant au moins trois exacerbations par an. Un patient avec une seule exacerbation, une infection à <i>Pseudomonas aeruginosa</i>, une dyskinésie ciliaire et des symptômes sévères peut avoir un risque égal ou supérieur à celui d’un patient avec trois exacerbations et une maladie idiopathique bien contrôlée.</p><div class="key"><b>Limite.</b> La recommandation ne fixe pas de seuil pour les « symptômes sévères ». Ses auteurs proposent des repères indicatifs fondés sur des questionnaires de qualité de vie, explicitement présentés comme non normatifs.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026, figure 3</a>.</p></template>
<template data-pop="j47-embolisation" data-title="Embolisation des artères bronchiques"><p class="lab">Principe</p><p>Le radiologue interventionnel cathétérise les artères bronchiques et les occlut.</p><p class="lab">Préalables</p><p>La radiographie, la bronchoscopie et l’angioscanner multicoupe précèdent le geste : ils localisent le saignement et cartographient les artères bronchiques et leurs branches extrabronchiques.</p><p class="lab">Place</p><p>L’embolisation est une technique sûre et efficace entre des mains expérimentées. Elle constitue le traitement de première ligne de l’hémoptysie abondante ou récidivante.</p><div class="key"><b>Limite.</b> Les récidives sont fréquentes et conduisent à une nouvelle embolisation après exclusion d’une source extrabronchique ou pulmonaire. L’embolisation accidentelle d’une branche spinale est la complication la plus grave ; les échecs répétés relèvent de la chirurgie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25372159/" target="_blank" rel="noopener">Ittrich, Klose et Adam, Rofo 2015;187:248-259</a>.</p></template>
<template data-pop="j47-exacerbation" data-title="Exacerbation : définition consensuelle"><p class="lab">Définition</p><p>Le consensus publié en 2017 retient l’aggravation d’au moins trois des six symptômes suivants pendant au moins 48 heures : toux, volume ou consistance de l’expectoration, purulence, dyspnée ou tolérance à l’effort, fatigue ou malaise, hémoptysie. Le médecin juge en outre qu’une modification du traitement est nécessaire.</p><p class="lab">Gravité</p><p>Une exacerbation qui requiert une hospitalisation est sévère ; une seule par an suffit à définir le haut risque selon l’ERS 2025.</p><p class="lab">Causes</p><p>Les virus respiratoires sont détectés dans jusqu’à la moitié des exacerbations ; les bactéries chroniques de l’expectoration jouent aussi un rôle central.</p><div class="key"><b>Limite.</b> Cette définition a été conçue pour la recherche clinique ; elle sert de repère en pratique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28596426/" target="_blank" rel="noopener">Hill et al., Eur Respir J 2017;49:1700051</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40901375/" target="_blank" rel="noopener">Baker et al., ERJ Open Res 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a>.</p></template>
<template data-pop="j47-kine" data-title="Drainage bronchique"><p class="lab">Techniques</p><p>La British Thoracic Society propose le cycle actif des techniques respiratoires ou un dispositif à pression expiratoire positive oscillante. Le drainage autogène, la pression expiratoire positive, les oscillations thoraciques à haute fréquence et la ventilation à percussions intrapulmonaires sont des alternatives. Le positionnement de drainage peut compléter la technique, et l’expiration forcée (« huff ») est incluse dans toutes.</p><p class="lab">Preuve et modalités</p><p>L’ERS 2025 recommande fortement d’enseigner le drainage à tous les patients, y compris à ceux qui crachent peu mais se sentent encombrés. Aucune technique n’a démontré sa supériorité. La séance dure au moins 10 minutes et au plus 30 minutes, puis se poursuit jusqu’à deux huffs ou toux claires ; le physiothérapeute revoit la technique dans les trois mois.</p><div class="key"><b>Limite.</b> Le choix suit la préférence et l’adhésion du patient ; la technique est intensifiée pendant les exacerbations.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a>.</p></template>
<template data-pop="j47-rehab" data-title="Réhabilitation respiratoire"><p class="lab">Définition</p><p>La réhabilitation est un programme supervisé d’entraînement à l’effort, associé à une éducation adaptée aux bronchectasies : drainage, physiopathologie, traitements inhalés.</p><p class="lab">Preuve</p><p>L’ERS 2025 la recommande fortement chez les patients dont la capacité d’effort est réduite : elle diminue la dyspnée et améliore la capacité d’exercice. La British Thoracic Society la propose dès qu’une dyspnée limite le patient, soit un grade d’au moins 1 sur l’échelle modifiée du Medical Research Council.</p><div class="key"><b>Limite.</b> Le bénéfice suppose la poursuite d’une activité physique régulière après le programme.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41016738/" target="_blank" rel="noopener">Chalmers et al., ERS 2025 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a>.</p></template>
<template data-pop="j47-vaccination" data-title="Vaccinations recommandées en Suisse"><p class="lab">Grippe et COVID-19</p><p>Le Plan de vaccination suisse 2026 recommande la vaccination annuelle contre la grippe aux personnes atteintes d’une affection pulmonaire chronique. Le tableau des maladies chroniques y associe aussi une recommandation de vaccination contre le COVID-19.</p><p class="lab">Pneumocoque</p><p>Parmi les maladies pulmonaires, le plan ne cite comme indication du vaccin conjugué que les bronchectasies dues à un déficit en anticorps, la bronchopneumopathie chronique obstructive à partir du stade GOLD 3 et l’asthme sévère ; il le recommande aussi à toute personne dès 65 ans. Le PCV20 et le PCV21 sont les options actuelles.</p><p class="lab">Virus respiratoire syncytial</p><p>La mise à jour 2026 de l’OFSP et de la Commission fédérale pour les vaccinations recommande une dose à toutes les personnes dès 75 ans, ainsi qu’aux personnes de 18 à 74 ans atteintes de bronchectasies sévères. L’assurance de base ne prenait pas en charge cette vaccination chez l’adulte non enceinte à l’automne 2026.</p><div class="key"><b>Limite.</b> Le choix du vaccin et sa prise en charge suivent la version en vigueur du plan de vaccination ; ils changent d’une année à l’autre.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026, OFSP</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">Recommandations pour la vaccination contre le virus respiratoire syncytial, mise à jour 2026, OFSP</a>.</p></template>
<template data-pop="j47-eradication" data-title="Éradication de Pseudomonas aeruginosa"><p class="lab">Indication</p><p>L’ERS 2025 émet une recommandation conditionnelle en faveur d’une éradication lors d’un nouvel isolement de <i>Pseudomonas aeruginosa</i>. La British Thoracic Society la propose surtout lorsque l’isolement s’accompagne d’une dégradation clinique et demande d’en discuter les bénéfices et les risques avec le patient stable.</p><p class="lab">Schémas</p><p>En première intention, la British Thoracic Society propose la ciprofloxacine orale, 500 à 750 mg deux fois par jour pendant deux semaines. En deuxième intention, une bêta-lactamine antipseudomonas intraveineuse, avec ou sans aminoside, est donnée deux semaines puis suivie de trois mois de colistine, de gentamicine ou de tobramycine nébulisées. Des cultures sont envoyées avant le traitement puis à chaque consultation.</p><p class="lab">Résultat</p><p>Une méta-analyse de six études observationnelles (289 patients) retrouve une éradication chez 40 % des patients à douze mois : 48 % avec une association systémique et inhalée, 27 % avec un antibiotique systémique seul. Le taux d’exacerbations diminuait après l’éradication, sans effet sur les hospitalisations.</p><div class="key"><b>Limite.</b> Les données sont observationnelles ; aucun essai randomisé n’a comparé l’éradication à l’abstention.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/38296344/" target="_blank" rel="noopener">Conceição et al., Eur Respir Rev 2024;33:230178</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41016738/" target="_blank" rel="noopener">ERS 2025 (résumé)</a>.</p></template>
<template data-pop="j47-macrolides" data-title="Macrolides au long cours"><p class="lab">Mécanisme</p><p>L’azithromycine possède, outre son effet antibactérien, des propriétés anti-inflammatoires et immunomodulatrices ; son bénéfice ne se limite pas aux germes sensibles.</p><p class="lab">Preuves</p><p>Dans l’essai EMBRACE, l’azithromycine à 500 mg trois fois par semaine a réduit le taux d’exacerbations sur six mois (0,59 contre 1,57 par patient ; rapport de taux 0,38). Dans l’essai BAT, 250 mg par jour pendant un an ont abaissé la médiane des exacerbations de 2 à 0. Dans l’essai BLESS, l’érythromycine a réduit les exacerbations (rapport de taux 0,57). La méta-analyse sur données individuelles de ces trois essais (341 patients) retrouve un rapport de taux de 0,49, un bénéfice dans tous les sous-groupes, y compris en cas de <i>Pseudomonas aeruginosa</i>, et une amélioration modeste de la qualité de vie.</p><p class="lab">Avant et pendant</p><p>Au moins une culture mycobactérienne négative, un ECG et un interrogatoire sur l’audition et l’équilibre précèdent le traitement. Les troubles digestifs touchaient 40 % des patients sous azithromycine dans l’essai BAT, contre 5 % sous placebo. Une surdité, des acouphènes ou des signes d’hépatite imposent de réévaluer ou d’arrêter.</p><div class="key"><b>Limite.</b> La résistance aux macrolides augmente : 88 % des patients sous azithromycine dans l’essai BAT et une hausse nette des streptocoques oropharyngés résistants dans l’essai BLESS. Aucune forme orale d’érythromycine n’a été retrouvée dans l’AIPS consultée le 09.10.2026.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22901887/" target="_blank" rel="noopener">Wong et al., EMBRACE, Lancet 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23532241/" target="_blank" rel="noopener">Altenburg et al., BAT, JAMA 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23532242/" target="_blank" rel="noopener">Serisier et al., BLESS, JAMA 2013;309:1260-1267</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31405828/" target="_blank" rel="noopener">Chalmers et al., méta-analyse sur données individuelles, Lancet Respir Med 2019;7:845-854</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680574820018" target="_blank" rel="noopener">Information professionnelle Azithromycine Sandoz®</a>.</p></template>
<template data-pop="j47-inhales" data-title="Antibiotiques inhalés"><p class="lab">Principe</p><p>Nébulisés, la colistine, la gentamicine ou la tobramycine atteignent de fortes concentrations dans l’expectoration avec une résorption systémique très faible : moins de 2 % pour le colistiméthate selon son information professionnelle suisse.</p><p class="lab">Preuves</p><p>L’ERS 2025 recommande fortement les antibiotiques inhalés au long cours chez les patients à haut risque porteurs d’une infection chronique à <i>Pseudomonas aeruginosa</i>. Dans l’essai PROMIS-I, le colistiméthate nébulisé a abaissé le taux annuel d’exacerbations de 0,95 à 0,58 (rapport de taux 0,61) ; l’essai PROMIS-II, interrompu par la pandémie, n’a pas reproduit ce résultat.</p><p class="lab">Conduite</p><p>Un test de réactivité bronchique en période stable précède le traitement, car un bronchospasme est très fréquent ; la première dose de colistine est administrée sous surveillance, avec mesure du VEMS avant et après. Un bronchodilatateur déjà prescrit est pris avant l’inhalation.</p><div class="key"><b>Limite.</b> En Suisse, la colistine inhalée est autorisée pour la mucoviscidose ; son emploi dans les autres bronchectasies est hors autorisation. La British Thoracic Society déconseille les aminosides inhalés au long cours en dessous de 30 mL/min de clairance de la créatinine.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39270696/" target="_blank" rel="noopener">Haworth et al., PROMIS, Lancet Respir Med 2024;12:787-798</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41016738/" target="_blank" rel="noopener">ERS 2025 (résumé)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549150027" target="_blank" rel="noopener">Information professionnelle Colistin pour inhalation</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a>.</p></template>
<template data-pop="j47-mucoactifs" data-title="Traitements mucoactifs"><p class="lab">Définition</p><p>Les mucoactifs facilitent l’expectoration : le sérum salé hypertonique inhalé réhydrate le mucus par osmose, la carbocistéine orale modifie ses propriétés.</p><p class="lab">Place</p><p>L’ERS 2025 émet une recommandation conditionnelle en leur faveur dans des circonstances précises, par exemple des symptômes réfractaires malgré le drainage. La British Thoracic Society propose un essai chez les patients qui expectorent difficilement ; la carbocistéine est essayée six mois et poursuivie seulement si elle apporte un bénéfice.</p><p class="lab">Désoxyribonucléase recombinante</p><p>Efficace dans la mucoviscidose, elle a augmenté les exacerbations et accéléré le déclin du VEMS dans un essai randomisé de 349 patients atteints de bronchectasies idiopathiques. La British Thoracic Society déconseille son usage.</p><div class="key"><b>Piège.</b> Un mucoactif inhalé peut provoquer un bronchospasme ; la première administration s’accompagne d’un test de réactivité, et d’un bronchodilatateur préalable chez l’asthmatique ou si le VEMS est inférieur à 1 litre.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9596315/" target="_blank" rel="noopener">O’Donnell et al., Chest 1998</a>.</p></template>
<template data-pop="j47-csi" data-title="Corticostéroïdes inhalés"><p class="lab">Position</p><p>L’ERS 2025 suggère de ne pas utiliser en routine les corticostéroïdes inhalés. La British Thoracic Society ne les propose qu’en présence d’une autre indication : ABPA, asthme, bronchopneumopathie chronique obstructive ou maladie inflammatoire de l’intestin.</p><p class="lab">Conséquence pratique</p><p>Un corticostéroïde inhalé prescrit sans indication claire est réévalué. Dans un cas publié avec la recommandation, une patiente sans asthme, aux éosinophiles sanguins à 70 par µL, est passée d’une association corticostéroïde et bronchodilatateur à une double bronchodilatation.</p><div class="key"><b>Limite.</b> L’asthme et une partie des bronchopneumopathies chroniques obstructives, fréquents chez ces patients, gardent leurs indications de corticostéroïde inhalé.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41016738/" target="_blank" rel="noopener">ERS 2025 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026, encadré 2</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a>.</p></template>
<template data-pop="j47-brensocatib" data-title="Brensocatib"><p class="lab">Mécanisme</p><p>Le brensocatib est un inhibiteur compétitif et réversible de la DPP1. Pendant la maturation médullaire du neutrophile, il empêche l’activation de l’élastase neutrophile, de la cathepsine G et de la protéinase 3.</p><p class="lab">Essai ASPEN</p><p>Chez 1721 patients (1680 adultes et 41 adolescents) ayant présenté au moins deux exacerbations dans l’année, ou une seule chez l’adolescent, les taux annuels d’exacerbation ont été de 1,02 avec 10 mg, 1,04 avec 25 mg et 1,29 sous placebo : rapports de taux de 0,79 et 0,81. Après 52 semaines, 48,5 % des patients traités restaient sans exacerbation, contre 40,3 % sous placebo. Le déclin du VEMS était moindre de 38 mL avec 25 mg.</p><p class="lab">Statut et emploi</p><p>Une autorisation valable dans l’Union européenne a été délivrée le 18 novembre 2025 à la dose de 25 mg par jour, dès 12 ans, après au moins deux exacerbations dans les douze derniers mois. Aucune adaptation n’est requise chez le sujet âgé ni en cas d’insuffisance rénale ou hépatique. Aucune information professionnelle suisse n’a été retrouvée dans l’AIPS consultée le 09.10.2026. Les effets indésirables les plus fréquents sont les céphalées (9,2 %), l’hyperkératose (5,9 %), la dermatite et les éruptions cutanées.</p><div class="key"><b>Précautions.</b> Les infections fongiques sont un peu plus fréquentes ; la prudence s’impose en cas de neutropénie inférieure à 1000/mm³. Les vaccins vivants atténués sont évités, et le médicament n’est pas recommandé pendant la grossesse.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40267423/" target="_blank" rel="noopener">Chalmers et al., N Engl J Med 2025;392:1569-1581</a> ; <a href="https://www.ema.europa.eu/en/medicines/human/EPAR/brinsupri" target="_blank" rel="noopener">Agence européenne des médicaments, Brinsupri</a> ; <a href="https://www.ema.europa.eu/en/documents/product-information/brinsupri-epar-product-information_en.pdf" target="_blank" rel="noopener">Résumé européen des caractéristiques de Brinsupri</a>.</p></template>
<template data-pop="j47-cipro" data-title="Ciprofloxacine"><p class="lab">Emploi</p><p>La ciprofloxacine est le principal antibiotique oral actif sur <i>Pseudomonas aeruginosa</i> proposé par la British Thoracic Society : 500 à 750 mg deux fois par jour pendant 14 jours pour l’éradication d’un premier isolement ou le traitement d’une exacerbation. L’information professionnelle suisse prévoit la même fourchette pour les infections respiratoires basses.</p><p class="lab">Adaptation rénale</p><p>La dose quotidienne maximale est de 1000 mg pour une clairance de 30 à 60 mL/min et de 500 mg en dessous de 30 mL/min. Aucune adaptation n’est requise en cas d’insuffisance hépatique isolée.</p><p class="lab">Effets indésirables graves</p><p>Les fluoroquinolones exposent à des effets graves, parfois irréversibles : tendinites et ruptures tendineuses, atteintes nerveuses centrales et périphériques, anévrisme ou dissection aortique, allongement du QT. Le risque tendineux augmente après 60 ans, en cas d’insuffisance rénale, de greffe d’organe et sous corticostéroïde.</p><div class="key"><b>Contre-indications et interactions.</b> Hypersensibilité aux quinolones, grossesse, allaitement, enfant en croissance, association à la tizanidine ou à l’agomélatine. Les produits laitiers et les boissons enrichies en calcium, pris en même temps, réduisent son absorption.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680566500027" target="_blank" rel="noopener">Information professionnelle Ciprofloxacin Zentiva®, mise à jour 08.2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a>.</p></template>
<template data-pop="j47-chirurgie" data-title="Chirurgie et transplantation"><p class="lab">Résection</p><p>Une résection pulmonaire se discute chez un patient à maladie localisée dont les symptômes persistent malgré un traitement médical optimisé par un spécialiste. L’évaluation est multidisciplinaire et mesure la réserve cardiorespiratoire après résection.</p><p class="lab">Transplantation</p><p>La British Thoracic Society propose d’adresser à un centre de transplantation les patients de 65 ans ou moins dont le VEMS est inférieur à 30 % avec une instabilité clinique importante, ou dont la fonction se dégrade rapidement malgré un traitement optimal. Une hémoptysie massive, une hypertension pulmonaire secondaire sévère, des séjours en soins intensifs ou une insuffisance respiratoire, surtout sous ventilation non invasive, justifient une orientation plus précoce.</p><div class="key"><b>Limite.</b> La chirurgie ne guérit pas une maladie diffuse ; elle supprime un foyer localisé qui entretient l’infection.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a>.</p></template>
<template data-pop="j47-rapid" data-title="Le patient qui se dégrade : algorithme de l’ERS 2025"><p class="lab">Définition</p><p>Un patient se dégrade lorsque la fréquence ou la sévérité de ses exacerbations augmente, que ses symptômes s’aggravent nettement ou que sa fonction respiratoire chute rapidement.</p><p class="lab">Étapes</p><p>Le médecin reconnaît la situation et adresse le patient à un spécialiste. Il évalue l’adhésion au drainage et aux traitements et recherche une complication. Il fait revoir le drainage par un physiothérapeute, répète la tomodensitométrie et les cultures, au besoin par bronchoscopie, ainsi que la sérologie aspergillaire. Il instaure le traitement de la cause retrouvée, puis gère les complications et les effets indésirables.</p><p class="lab">Exemple</p><p>Une patiente atteinte de polyarthrite rhumatoïde perd 11 points de VEMS en un an sans exacerbation. La bronchoscopie isole un complexe <i>Mycobacterium avium</i>, dont le traitement par rifampicine, éthambutol et azithromycine améliore la fonction respiratoire.</p><div class="key"><b>Limite.</b> Les auteurs résument ces étapes par un acronyme anglais (« recognise, assess, perform, initiate, deal ») ; c’est une aide pédagogique, non un critère officiel.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026, encadré 5</a>.</p></template>
<template data-pop="pareto-j47-clin" data-title="Pareto — Définition, mécanismes et clinique"><p class="ratio" data-cover="j47-0,j47-1,j47-2,j47-3,j47-4,j47-5,j47-6"></p><ul><li>Les bronchectasies associent une dilatation bronchique permanente en tomodensitométrie et un syndrome clinique caractéristique ; la mucoviscidose suit ses propres recommandations.</li><li>Clairance altérée, infection chronique, inflammation neutrophilique et lésion pariétale s’entretiennent en vortex.</li><li>Le registre EMBARC montre une femme âgée de 67 ans en médiane, deux exacerbations par an et 38,1 % de formes idiopathiques.</li><li>Déficit humoral, ABPA et mycobactérie touchent chacun jusqu’à 10 % des patients : le bilan de base est systématique.</li><li>Toux productive chronique, fatigue, rhinosinusite et crépitants bibasaux forment le tableau typique.</li></ul></template>
<template data-pop="pareto-j47-pec" data-title="Pareto — Diagnostic, urgences et prise en charge"><p class="ratio" data-cover="j47-7,j47-8,j47-9"></p><ul><li>La tomodensitométrie en coupes fines confirme le diagnostic ; le score BSI et l’évaluation individuelle du risque complètent le bilan.</li><li>Un patient est à haut risque s’il a deux exacerbations par an, une exacerbation avec des symptômes sévères ou une exacerbation hospitalisée.</li><li>L’hémoptysie abondante, traitée par embolisation, et l’exacerbation sévère sont les deux urgences.</li><li>Le socle associe drainage pour tous, réhabilitation, traitement de la cause et vaccinations.</li><li>Le patient à haut risque reçoit un macrolide, ou un antibiotique inhalé si <i>Pseudomonas aeruginosa</i> est chronique ; un nouvel isolement est éradiqué ; une exacerbation se traite en règle 14 jours.</li></ul></template>
<template data-pop="pareto-j47-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="j47-10,j47-11,j47-12"></p><ul><li>Le suivi est clinique et microbiologique ; une dégradation rapide déclenche l’algorithme de l’ERS pour le patient qui se dégrade.</li><li>Chez le sujet âgé, l’ECG, l’audition et la fonction rénale sont contrôlés avant un traitement prolongé.</li><li>Le diagnostic tomodensitométrique repose sur un rapport broncho-artériel supérieur à 1, une absence d’effilement ou une bronche visible près de la plèvre ; l’exacerbation associe trois symptômes aggravés pendant 48 heures.</li></ul></template>
<template data-pop="pareto-j47-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j47-e-1,j47-e-2"></p><ul><li>La tomodensitométrie en coupes fines est l’examen de référence ; la radiographie ne suffit pas.</li><li>Le minimum comprend formule sanguine, immunoglobulines, bilan aspergillaire et cultures bactérienne et mycobactérienne.</li><li>L’infection chronique exige deux cultures positives à trois mois d’intervalle ; l’ABPA exige une sensibilisation et des IgE totales d’au moins 500 UI/mL.</li></ul></template>
<template data-pop="pareto-j47-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j47-p-1,j47-p-2,j47-p-3"></p><ul><li>L’azithromycine au long cours, hors autorisation en Suisse, protège le patient à haut risque après culture mycobactérienne négative et ECG.</li><li>Un antibiotique inhalé est une option équivalente en cas de <i>Pseudomonas aeruginosa</i> chronique, après test de réactivité bronchique.</li><li>La ciprofloxacine est contre-indiquée avec la tizanidine et l’agomélatine ; sa dose est plafonnée en insuffisance rénale.</li><li>Le brensocatib, 25 mg par jour, est autorisé dans l’Union européenne mais non en Suisse.</li><li>La désoxyribonucléase recombinante et le corticostéroïde inhalé sans indication sont à éviter.</li></ul></template>
