<h1>Bronchectasies</h1><span class="status">Adulte · bronchectasies non liées à la mucoviscidose · référentiels ERS 2025 et British Thoracic Society 2019 · état au 09.10.2026</span></div>

<section class="ilot" id="j47-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 58 ans, non fumeuse, crache chaque matin des sécrétions jaunâtres depuis six ans. Elle reçoit trois fois par an un antibiotique pour une « bronchite ». Or, dans l’enfance, elle a eu une coqueluche sévère. Ce récit ne décrit pas une succession de bronchites : il décrit une maladie bronchique chronique qui n’a jamais été nommée.</p><p>Les <b>bronchectasies</b> sont des dilatations permanentes des bronches associées à un syndrome clinique caractéristique. Ainsi, les bronches dilatées retiennent les sécrétions, hébergent une infection chronique et entretiennent une inflammation qui les détruit davantage. C’est pourquoi le médecin doit y penser devant une toux productive persistante, confirmer la dilatation par la tomodensitométrie, rechercher une cause traitable, estimer le risque d’exacerbation, puis agir sur chaque composante de la maladie.</p><div class="key"><b>À retenir.</b> Une toux productive quotidienne avec des infections respiratoires répétées impose de rechercher des bronchectasies, en particulier chez un non-fumeur. <button class="w" data-justification="1" data-k="j47-vortex">Le vortex de la maladie (quatre composantes liées)</button> explique toute la stratégie thérapeutique.</div></section>

<section class="ilot" id="j47-1"><h2><span class="n">1</span>Définition et formes</h2><p>La recommandation de l’ERS de 2025 définit les bronchectasies par l’association d’une dilatation bronchique permanente et d’un syndrome clinique caractéristique. De même, le consensus international de 2022 exige de même des critères cliniques <i>et</i> radiologiques pour parler de bronchectasies cliniquement significatives. Une image isolée, sans toux ni expectoration, ne suffit donc pas ; une toux productive sans dilatation démontrée non plus. <button class="w" data-justification="1" data-k="j47-consensus">Les critères tomodensitométriques et cliniques (seuils et limites)</button> précisent cette double exigence.</p><p>La morphologie distingue trois formes. Elles traduisent une destruction pariétale croissante, mais ne désignent ni la cause ni le traitement.</p><table class="t"><tr><th>Forme</th><th>Aspect tomodensitométrique</th><th>Portée clinique</th></tr><tr><td>Cylindrique</td><td>Bronche régulièrement élargie, à contours parallèles</td><td>Forme la moins destructrice</td></tr><tr><td>Variqueuse</td><td>Calibre irrégulier, alternance de dilatations et de rétrécissements</td><td>Associée, comme la forme kystique, à une expectoration plus souvent purulente</td></tr><tr><td>Kystique</td><td>Dilatations sacculaires en grappe</td><td>Compte comme critère radiologique de gravité du score BSI</td></tr></table><p>La forme kystique se repère en premier, car elle signale une maladie avancée. Concrètement, une patiente porteuse de dilatations cylindriques des deux lobes inférieurs obtient 0 point radiologique au score BSI ; un patient porteur de kystes dans un seul lobe en obtient 1. <button class="w" data-justification="1" data-k="j47-formes">Les formes morphologiques et leur signification</button>.</p><p>Deux situations ressemblent aux bronchectasies sans relever de ce cours. D’une part, les bronchectasies de la <button class="w" data-justification="1" data-k="j47-mucoviscidose">mucoviscidose (pourquoi elle suit ses propres recommandations)</button> sont exclues des recommandations de l’ERS et de la British Thoracic Society. D’autre part, les bronchectasies de traction d’une fibrose pulmonaire résultent de la rétraction du parenchyme ; souvent asymptomatiques, elles appartiennent à la pneumopathie interstitielle.</p><div class="key"><b>À retenir.</b> Le diagnostic associe une preuve morphologique permanente et un tableau clinique compatible. La forme kystique et l’extension à trois lobes ou plus signalent une maladie avancée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., résumé clinique de la recommandation ERS 2025, Breathe 2026;22:260001</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34570994/" target="_blank" rel="noopener">Aliberti et al., consensus international, Lancet Respir Med 2022;10:298-306</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">Hill et al., British Thoracic Society, BMJ Open Respir Res 2018;5:e000348</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19648517/" target="_blank" rel="noopener">Murray et al., Eur Respir J 2009;34:361-364</a>.</p></section>

<section class="ilot" id="j47-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>Aucune donnée de prévalence suisse publiée n’a été identifiée ; cette lacune est réelle. En revanche, en Allemagne, une estimation populationnelle retient 67 cas pour 100 000 habitants. De même, dans les données britanniques, des taux allant jusqu’à 566 pour 100 000 ont été rapportés, avec une prévalence en hausse de 40 % en dix ans. Ces chiffres, obtenus par des méthodes différentes, ne sont pas directement comparables ; ils montrent que la maladie n’est pas rare.</p><p>Le <button class="w" data-justification="1" data-k="j47-embarc">registre européen EMBARC (population, limites)</button> a inclus 16 963 adultes dans 27 pays européens et en Israël entre 2015 et 2022. Ainsi, l’âge médian y atteint 67 ans et 60,9 % des patients sont des femmes. En outre, les patients présentent une médiane de deux exacerbations par an, et 26,4 % ont été hospitalisés pour exacerbation l’année précédente. Enfin, la cause reste inconnue chez 38,1 % d’entre eux ; une origine post-infectieuse est retenue chez 21,2 %.</p><p>Le pronostic se lit à travers les facteurs indépendants identifiés lors de la construction du score BSI. De fait, la mortalité augmente avec l’âge, un VEMS bas, un indice de masse corporelle bas, une hospitalisation antérieure et trois exacerbations ou plus dans l’année. De même, les hospitalisations futures dépendent des admissions antérieures, d’une dyspnée de grade 4 ou plus sur l’échelle du Medical Research Council, d’un VEMS inférieur à 30 %, de la colonisation par <i>Pseudomonas aeruginosa</i> ou par un autre pathogène et d’une atteinte de trois lobes ou plus. <button class="w" data-justification="1" data-k="j47-bsi">Enfin, le score BSI traduit ces facteurs en points (barème et seuils)</button>.</p><div class="key"><b>À retenir.</b> Dans les séries européennes, la patiente type est une femme de près de 70 ans. Une cause n’est retrouvée que dans six cas sur dix environ, d’où un bilan étiologique systématique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37105206/" target="_blank" rel="noopener">Chalmers et al., registre EMBARC, Lancet Respir Med 2023;11:637-649</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26293498/" target="_blank" rel="noopener">Ringshausen et al., Eur Respir J 2015;46:1805-1807</a>, chiffre repris par <a href="https://pubmed.ncbi.nlm.nih.gov/27730179/" target="_blank" rel="noopener">le protocole EMBARC, ERJ Open Res 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30215383/" target="_blank" rel="noopener">Flume, Chalmers et Olivier, Lancet 2018;392:880-890</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24328736/" target="_blank" rel="noopener">Chalmers et al., score BSI, Am J Respir Crit Care Med 2014;189:576-585</a>.</p></section>

<section class="ilot" id="j47-3"><h2><span class="n">3</span>Physiopathologie : le vortex</h2><p>À l’état normal, les bronches se nettoient seules. Ainsi, le mucus piège les particules et les bactéries ; il repose sur une couche liquide de surface dans laquelle battent les cils, coordonnés en ondes métachrones qui le propulsent vers le larynx. <button class="w" data-justification="1" data-k="j47-clairance">Or, la clairance mucociliaire normale (mucus, liquide de surface, cils)</button> constitue la première défense innée du poumon.</p><p>Les bronchectasies naissent lorsqu’une agression rompt cet équilibre : infection grave, défaut ciliaire, déficit immunitaire ou réaction allergique. Quatre composantes s’entretiennent alors. D’abord, la clairance altérée laisse stagner le mucus. Ensuite, le mucus stagnant héberge une infection bactérienne chronique. Puis, l’infection recrute des neutrophiles dont les protéases, au premier rang desquelles l’<button class="w" data-justification="1" data-k="j47-elastase">élastase neutrophile (marqueur et cible)</button>, dégradent l’élastine de la paroi. Enfin, la paroi lésée se dilate et draine encore moins bien.</p><p>Le modèle a d’abord été décrit comme un cercle vicieux. Il est aujourd’hui présenté comme un « vortex », car chaque composante agit sur toutes les autres. Ce modèle explique pourquoi un antibiotique ou un anti-inflammatoire isolé n’a qu’un effet modeste : l’inflammation et la lésion se maintiennent par d’autres voies. <i>À cet égard, pseudomonas aeruginosa</i> illustre cette interaction, car il forme dans le mucus un <button class="w" data-justification="1" data-k="j47-biofilm">biofilm (protection contre les antibiotiques et les défenses)</button>.</p><div class="key"><b>À retenir.</b> La maladie s’auto-entretient même lorsque l’agression initiale a disparu. Le traitement agit donc sur plusieurs composantes à la fois, et la cause initiale est traitée lorsqu’elle persiste.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30215383/" target="_blank" rel="noopener">Flume, Chalmers et Olivier, Lancet 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27864314/" target="_blank" rel="noopener">Bustamante-Marin et Ostrowski, Cold Spring Harb Perspect Biol 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27911604/" target="_blank" rel="noopener">Chalmers et al., Am J Respir Crit Care Med 2017;195:1384-1393</a>.</p></section>

<section class="ilot" id="j47-4"><h2><span class="n">4</span>Étiologies</h2><p>La cause compte pour deux raisons : certaines étiologies disposent d’un traitement spécifique, d’autres modifient le pronostic. En effet, un déficit immunitaire, une ABPA et une mycobactérie non tuberculeuse sont chacun retrouvés chez jusqu’à 10 % des patients, et des tests simples les détectent. C’est pourquoi le tableau relie chaque cause à son mécanisme et à l’indice qui doit la faire évoquer.</p><table class="t"><tr><th>Cause</th><th>Mécanisme</th><th>Indice d’orientation</th></tr><tr><td><button class="w" data-justification="1" data-k="j47-postinfectieux">Post-infectieuse</button></td><td>Destruction pariétale lors d’une infection grave</td><td>Symptômes apparus juste après l’infection ; atteinte parfois limitée à un lobe</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-abpa">Aspergillose bronchopulmonaire allergique (ABPA)</button></td><td>Hypersensibilité à <i>Aspergillus</i>, bouchons muqueux</td><td>Asthme, expectoration épaisse, sifflements, bronchectasies centrales</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-deficit">Déficit immunitaire humoral</button></td><td>Défaut d’anticorps opsonisants</td><td>Infections répétées, pneumonies, infections extrarespiratoires ; atteinte des lobes inférieurs</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-dcp">Dyskinésie ciliaire primitive</button></td><td>Cils immobiles ou désorganisés</td><td>Début dans l’enfance, rhinosinusite chronique, otites, détresse respiratoire néonatale, anomalie de latéralité</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-systemique">Connectivites et maladies inflammatoires de l’intestin</button></td><td>Inflammation systémique, immunosuppression</td><td>Signes articulaires ou digestifs ; bronchorrhée souvent sensible aux corticostéroïdes dans les maladies inflammatoires de l’intestin</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-bpco">Bronchopneumopathie chronique obstructive</button></td><td>Inflammation et infection bronchiques chroniques</td><td>Fumeur ou ancien fumeur de plus de 40 ans, bronchectasies cylindriques des lobes inférieurs</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-mnt">Mycobactéries non tuberculeuses</button></td><td>Cause et conséquence de la maladie</td><td>Femme ménopausée mince, atteinte de la lingula, micronodules en arbre en bourgeon</td></tr><tr><td>Obstruction bronchique localisée</td><td>Rétention en aval d’une lésion endobronchique ou d’un corps étranger</td><td>Atteinte localisée : bronchoscopie</td></tr><tr><td>Mucoviscidose, déficit en alpha-1 antitrypsine</td><td>Mucus déshydraté ; protéolyse non contrôlée</td><td>Lobes supérieurs, infertilité, pancréatite ; emphysème panlobulaire basal</td></tr><tr><td>Idiopathique</td><td>Aucune cause retrouvée après bilan complet</td><td>Diagnostic d’exclusion, retenu chez 38,1 % des patients du registre EMBARC</td></tr></table><p>La topographie guide la lecture. Concrètement, une atteinte localisée évoque une obstruction ou une séquelle d’infection ; une atteinte centrale évoque une ABPA ; une atteinte des lobes supérieurs évoque une mucoviscidose ; la lingula et les micronodules évoquent une mycobactérie. Ces associations orientent sans exclure : les recommandations imposent un bilan standardisé quel que soit le profil clinique.</p><div class="trap"><span class="k">Erreur fréquente</span> Conclure à une séquelle infectieuse sur la seule foi d’une pneumonie ancienne, sans bilan. Un déficit humoral a pu favoriser cette pneumonie et reste alors méconnu.</div><div class="key"><b>À retenir.</b> Un bilan étiologique de base est réalisé chez tout patient. Selon le résumé de la recommandation de l’ERS, une maladie débutée dans l’enfance est génétique jusqu’à preuve du contraire.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30215383/" target="_blank" rel="noopener">Flume et al., Lancet 2018, tableau 1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society, BMJ Open Respir Res 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37105206/" target="_blank" rel="noopener">registre EMBARC, 2023</a>.</p></section>

<section class="ilot" id="j47-5"><h2><span class="n">5</span>Anamnèse</h2><p>Le symptôme cardinal est la toux productive chronique, présente chez 98 % des 103 adultes d’une série de patients nouvellement diagnostiqués. En outre, dans cette même série, 74 % rapportaient une fatigue, 70 % une rhinosinusite chronique et 62 % une dyspnée ; plus de 80 % avaient des symptômes respiratoires depuis l’enfance. Ensuite, le médecin quantifie le volume d’expectoration et sa couleur : <button class="w" data-justification="1" data-k="j47-expectoration">la couleur de l’expectoration (échelle de Murray)</button> prédit la colonisation bactérienne.</p><p>L’<button class="w" data-justification="1" data-k="j47-hemoptysie">hémoptysie (origine et gravité)</button> fait partie des six symptômes qui définissent l’exacerbation. Par ailleurs, le reflux gastro-œsophagien, l’anxiété et la dépression sont recherchés, car ils aggravent les symptômes et relèvent d’une prise en charge propre.</p><p>Les antécédents orientent l’étiologie : infection grave, asthme, infections à répétition, otites chroniques, infertilité, polyarthrite rhumatoïde, maladie inflammatoire de l’intestin, traitement immunosuppresseur. De plus, le nombre d’exacerbations traitées dans l’année et les hospitalisations sont consignés, car ils définissent le risque futur.</p><div class="two"><div class="card"><b>Forme typique</b><p>À titre d’exemple, une femme non fumeuse de 65 ans tousse et crache chaque jour depuis des années. Elle décrit une fatigue, une rhinosinusite et plusieurs épisodes annuels de purulence accrue traités par antibiotique.</p></div><div class="card"><b>Formes atypiques</b><p>Certains patients crachent peu, voire pas : la toux est sèche ou le patient se dit « encombré ». À l’inverse, chez un patient atteint de bronchopneumopathie chronique obstructive, des exacerbations fréquentes avec <i>Pseudomonas aeruginosa</i> en période stable doivent faire rechercher des bronchectasies associées.</p></div></div><div class="key"><b>À retenir.</b> L’anamnèse établit la charge symptomatique quotidienne, le nombre d’exacerbations annuelles et les indices d’une cause traitable.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/16650970/" target="_blank" rel="noopener">King et al., Respir Med 2006;100:2183-2189</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28596426/" target="_blank" rel="noopener">Hill et al., Eur Respir J 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41988091/" target="_blank" rel="noopener">Chalmers et al., Breathe 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018</a>.</p></section>

<section class="ilot" id="j47-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen commence par l’état général, le poids, l’indice de masse corporelle et la saturation pulsée en oxygène. À cet égard, la British Thoracic Society demande de consigner le poids et l’indice de masse corporelle à chaque consultation. Un indice inférieur à 18,5 kg/m² ajoute 2 points au score BSI ; une maigreur fait aussi évoquer une mycobactérie non tuberculeuse.</p><div class="two"><div class="card"><b>Auscultation</b><p>Les <button class="w" data-justification="1" data-k="j47-crepitants">crépitants (valeur clinique)</button>, en général bibasaux, constituent le signe dominant de l’examen dans les séries de patients. En revanche, des sibilants font rechercher un asthme ou une ABPA associés.</p></div><div class="card"><b>Signes extrapulmonaires</b><p>L’examen des sinus recherche la rhinosinusite chronique. De même, les articulations, la peau et le tube digestif orientent vers une maladie systémique. Enfin, les signes d’hypertension pulmonaire signalent une forme évoluée.</p></div></div><p>Un examen normal n’exclut pas le diagnostic. À l’inverse, des crépitants persistants chez un patient qui tousse et crache chaque jour justifient une tomodensitométrie, même si la radiographie thoracique paraît normale.</p><div class="key"><b>À retenir.</b> Les crépitants bibasaux chez un non-fumeur qui crache chaque jour orientent vers des bronchectasies ; l’examen évalue aussi la nutrition, l’oxygénation et le retentissement cardiaque droit.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/16650970/" target="_blank" rel="noopener">King et al., 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30687502/" target="_blank" rel="noopener">British Thoracic Society 2018, tableaux 4 et 7</a>.</p><button class="pareto-btn ui" data-k="pareto-j47-clin">▲ Loi de Pareto — Définition, mécanismes et clinique</button></section>
