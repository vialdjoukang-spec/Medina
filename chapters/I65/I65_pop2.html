<template data-pop="i65-age-technique" data-title="Contentieux : endartériectomie ou stenting selon l’âge">
<div class="lab">Positions</div><p>L’ESO 2021 : stenting envisageable avant 70 ans (faible, basse) et avantage de l’endartériectomie démontré à partir de 70 ans. La revue bernoise : l’endartériectomie est préférée après 70 ans car le risque à 30 jours d’AVC récidivant ou de décès est doublé sous stenting. La synthèse Cochrane de 2020 citée par la revue de Berne et Bâle : décès ou AVC à 30 jours 7,2 % contre 4,4 % (odds ratio 1,70 ; intervalle de confiance à 95 % de 1,31 à 2,19) ; à long terme, AVC ipsilatéral comparable (odds ratio 1,05 ; 0,75 à 1,47). La revue zurichoise : endartériectomie en première ligne pour la sténose symptomatique de plus de 50 %.</p>
<div class="lab">Choix retenu</div><p>Les sources convergent : l’endartériectomie est le choix de première ligne, le stenting une alternative avant 70 ans, selon l’anatomie, le délai et l’athérome de la crosse aortique. Le texte le plus récent applicable est l’ESO 2021 ; le chiffre Cochrane est cité de seconde main.</p>
<div class="lab">Texte ancien</div><p>Les essais anciens (CREST, ICSS, EVA-3S) ont posé la question des deux techniques ; leur lecture directe n’a pas été faite dans le dossier de recherche.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34291662/" target="_blank" rel="noopener">Krasteva et coll., athérosclérose intracrânienne et carotide, 2021 (Berne)</a> ; <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32635848/" target="_blank" rel="noopener">Velz et coll., prise en charge de l’atteinte carotidienne, 2020 (Zurich)</a>.</p></template>
<template data-pop="i65-ecst2" data-title="Contentieux : ESO 2021 et ECST-2 (2025)">
<div class="lab">ESO 2021</div><p>Pour la sténose asymptomatique de 60 à 99 % à risque accru sous traitement médical seul, l’endartériectomie est recommandée (forte, modérée).</p>
<div class="lab">ECST-2 2025</div><p>Dans 429 patients avec une sténose de 50 % ou plus, asymptomatique ou symptomatique à risque faible ou intermédiaire (score de risque carotidien inférieur à 20 % à cinq ans), l’ajout de la revascularisation au traitement médical optimisé ne montre aucun bénéfice à deux ans (win ratio 1,01 ; intervalle de confiance à 95 % de 0,60 à 1,70). Les auteurs soutiennent le traitement médical seul en attendant l’analyse à cinq ans.</p>
<div class="lab">Arbitrage</div><p>La source primaire la plus récente est ECST-2, mais il s’agit d’un résultat intermédiaire à deux ans chez des patients à risque faible ou intermédiaire. L’ESO 2021 vise les patients à risque accru. Les deux textes ne s’opposent donc pas : ils appellent une sélection par le risque. Le texte de l’ESO reste lisible et en vigueur.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40252662/" target="_blank" rel="noopener">Donners et coll., ECST-2, résultats intermédiaires à 2 ans, 2025</a>.</p></template>
<template data-pop="i65-equipe" data-title="Équipe neurovasculaire et décision partagée">
<div class="lab">Position</div><p>Le consensus de 2025 du Conseil de l’ESC sur l’accident vasculaire cérébral propose une équipe multidisciplinaire neurovasculaire et une décision partagée avec le patient. La revue suisse de 2023 propose une décision individualisée multidisciplinaire pour la sténose asymptomatique.</p>
<div class="lab">Application</div><p>La décision réunit neurologue, chirurgien vasculaire, neuroradiologue et patient, sans retarder une revascularisation urgente.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37632337/" target="_blank" rel="noopener">Consensus clinique du Conseil sur l’accident vasculaire cérébral de l’ESC, 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37823810/" target="_blank" rel="noopener">Reutersberg et coll., revascularisation de la sténose asymptomatique, 2023 (Suisse)</a> ; <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a>.</p></template>
<template data-pop="i65-cochrane-vert" data-title="Synthèse Cochrane 2026 : sténose vertébrale">
<div class="lab">Données</div><p>Quatre essais randomisés, 429 patients atteints de sténose vertébrale symptomatique. Décès ou AVC à 30 jours : risque relatif 2,02 (0,73 à 5,55). AVC dans le territoire à distance : risque relatif 0,54 (0,29 à 1,01). Pas de différence claire pour le décès.</p>
<div class="lab">Lecture</div><p>Les intervalles de confiance sont larges et incluent l’absence d’effet : la certitude est basse et aucune supériorité du traitement endovasculaire n’est démontrée.</p>
<div class="lab">Application</div><p>Le traitement médical intensif reste la base ; l’angioplastie ou le stenting se réservent aux ischémies récidivantes bien documentées.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41983456/" target="_blank" rel="noopener">Zhang et coll., Cochrane 2026, angioplastie et stenting de l’artère vertébrale</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9358302/" target="_blank" rel="noopener">Markus et Michel, accident de la circulation postérieure, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29084065/" target="_blank" rel="noopener">Drazyk et Markus, sténose vertébrale symptomatique, 2018</a>.</p></template>
<template data-pop="i65-ldl" data-title="Contentieux : cible de LDL">
<div class="lab">Positions</div><p>ESO 2022 : LDL inférieur à 1,8 mmol/L (70 mg/dL), avec ézétimibe ou inhibiteur de PCSK9 si la cible n’est pas atteinte. Markus et Michel (circulation postérieure) : LDL inférieur à 1,4 mmol/L et réduction d’au moins 50 %.</p>
<div class="lab">Arbitrage</div><p>Les deux textes datent de 2022 et concernent la prévention secondaire après AVC ischémique ou AIT. L’ESO est une ligne directrice, la revue de Markus et Michel un texte d’auteurs centré sur la circulation postérieure : le seuil de 1,8 mmol/L est retenu comme repère principal, 1,4 mmol/L comme objectif plus strict à discuter.</p>
<div class="lab">Limite</div><p>Pour la sténose asymptomatique, aucune cible chiffrée n’est donnée dans les sources lues.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36082250/" target="_blank" rel="noopener">Ligne directrice ESO sur la prévention secondaire médicamenteuse, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9358302/" target="_blank" rel="noopener">Markus et Michel, accident de la circulation postérieure, 2022</a>.</p></template>
<template data-pop="i65-cyp2c19" data-title="Clopidogrel et CYP2C19">
<div class="lab">Mécanisme</div><p>Le clopidogrel est transformé en métabolite actif ; chez les métaboliseurs lents du CYP2C19, la notice suisse indique environ 70 % de métabolite actif en moins.</p>
<div class="lab">Conséquence</div><p>L’effet antiagrégant attendu peut être réduit. Les sources lues ne donnent pas de conduite chiffrée.</p>
<div class="lab">Limite</div><p>La notice ne précise pas ici de test systématique.</p>
<p class="src">Références : information professionnelle suisse de Plavix® (mise à jour septembre 2022).</p></template>
<template data-pop="i65-cyp3a4" data-title="Atorvastatine, CYP3A4 et acide fusidique">
<div class="lab">Information suisse</div><p>La notice de Sortis signale le risque de myopathie et de rhabdomyolyse avec les inhibiteurs du CYP3A4 et avec l’acide fusidique.</p>
<div class="lab">Conduite</div><p>Vérifier les co-prescriptions avant d’instaurer ou d’augmenter la dose.</p>
<p class="src">Références : information professionnelle suisse de Sortis® (mise à jour avril 2025).</p></template>
<template data-pop="i65-aspirine" data-title="Aspirine® Cardio 100/300">
<div class="lab">Indications</div><p>Prophylaxie des accidents cérébrovasculaires après stades précurseurs (AIT) et prophylaxie des thromboses artérielles après chirurgie vasculaire. Posologie AIT : 100 mg trois fois par jour ou 300 mg une fois par jour ; 100 mg par jour pour les indications cardiovasculaires générales.</p>
<div class="lab">Précautions</div><p>Comprimés gastrorésistants, à ne pas écraser. Contre-indications : ulcère actif, hémorragie digestive, diathèse hémorragique, MICI, insuffisance hépatique sévère, asthme ou allergie aux anti-inflammatoires non stéroïdiens. Mise à jour mars 2026.</p>
<p class="src">Références : information professionnelle suisse d’Aspirine® Cardio 100/300 (mise à jour mars 2026).</p></template>
<template data-pop="i65-plavix" data-title="Plavix® (clopidogrel)">
<div class="lab">Indications</div><p>Prévention secondaire après AVC récent (de 7 jours à environ 6 mois), 75 mg une fois par jour. Dose de charge de 300 mg dans d’autres indications.</p>
<div class="lab">Précautions</div><p>Contre-indications : saignement actif (ulcère, AVC hémorragique aigu), insuffisance hépatique sévère. Mise à jour septembre 2022.</p>
<div class="lab">Limite</div><p>L’AIT et la sténose sans AVC ne sont pas des indications explicites de la notice suisse consultée ; l’usage dans l’AIT à haut risque s’appuie sur l’ESO.</p>
<p class="src">Références : information professionnelle suisse de Plavix® (mise à jour septembre 2022).</p></template>
<template data-pop="i65-sortis" data-title="Sortis® (atorvastatine)">
<div class="lab">Posologie</div><p>10 à 80 mg par jour.</p>
<div class="lab">Précautions</div><p>SPARCL (analyse post hoc) : AVC hémorragiques plus fréquents sous 80 mg chez les patients avec antécédent d’infarctus hémorragique ou lacunaire. Contre-indications : hépatopathie active, transaminases supérieures à trois fois la limite normale de façon persistante, myopathie. Mise à jour avril 2025.</p>
<p class="src">Références : information professionnelle suisse de Sortis® (mise à jour avril 2025).</p></template>
<template data-pop="i65-pa" data-title="Cible de pression artérielle">
<div class="lab">Recommandation</div><p>ESO 2022 : pression artérielle inférieure à 130/80 mmHg, sauf sous-groupes à risque, avec traitement combiné et mesure hors cabinet. Markus et Michel retiennent la même cible pour la circulation postérieure.</p>
<div class="lab">Limite</div><p>Aucune molécule précise n’est désignée dans les sources lues.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36082250/" target="_blank" rel="noopener">Ligne directrice ESO sur la prévention secondaire médicamenteuse, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9358302/" target="_blank" rel="noopener">Markus et Michel, accident de la circulation postérieure, 2022</a>.</p></template>
<template data-pop="i65-sources-guides" data-title="Textes non lus et réserve">
<div class="lab">Constat</div><p>Les recommandations de la Société européenne de chirurgie vasculaire (ESVS) 2023, de la Société européenne de cardiologie (ESC) 2024 sur les maladies artérielles périphériques et aortiques, et de l’AWMF n’ont pas pu être lues (accès refusé). Elles ne servent pas de fondement à ce cours.</p>
<div class="lab">Réserve</div><p>Aucune recommandation de la Société suisse de neurologie propre à I65 n’a été trouvée. Les ESO 2021 (AIT) et 2022 ont été lues en résumé seulement. Revue par intelligence artificielle, distincte d’une validation médicale humaine.</p>
</template>
<template data-pop="pareto-i65-definition" data-title="Pareto — Définition, fréquence et pronostic">
<p class="ratio" data-cover="i65-1,i65-2"></p><ul><li>I65 = sténose ou occlusion précérébrale <b>sans infarctus</b> ; avec infarctus, I63.</li><li>Symptomatique = événement ipsilatéral dans les 6 mois ; degré NASCET : 50 % et 70 %.</li><li>Risque d’AVC : 25 % à 14 jours (symptomatique) contre 0,34–1,4 % par an (asymptomatique).</li></ul></template>
<template data-pop="pareto-i65-physio" data-title="Pareto — Physiopathologie et vulnérabilité">
<p class="ratio" data-cover="i65-3,i65-4"></p><ul><li>Rupture de plaque → embole → occlusion distale (œil ou hémisphère).</li><li>L’hémorragie intraplaque prédit le risque, même sous 50 % de sténose.</li><li>Micro-emboles, infarctus silencieux et réserve diminuée précisent le risque.</li></ul></template>
<template data-pop="pareto-i65-diagnostic" data-title="Pareto — Clinique, diagnostic et urgence">
<p class="ratio" data-cover="i65-5,i65-6,i65-7"></p><ul><li>Quand et quoi ? Date et nature du dernier événement.</li><li>Duplex → angio-IRM ou angio-scanner → imagerie cérébrale.</li><li>Sténose symptomatique = AIT à haut risque : revue en 24 heures, endartériectomie avant 14 jours.</li></ul></template>
<template data-pop="pareto-i65-ttt" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i65-8,i65-9,i65-10,i65-11"></p><ul><li>Traitement médical optimal pour tous ; décision en équipe.</li><li>Symptomatique : 70–99 % recommande l’endartériectomie ; 50–69 % la suggère ; sous 50 % la déconseille.</li><li>Asymptomatique : revascularisation seulement chez le patient à risque accru ; ECST-2 invite à sélectionner par le risque.</li><li>Circulation postérieure : traitement médical intensif ; stenting basilaire à éviter.</li></ul></template>
<template data-pop="pareto-i65-suivi" data-title="Pareto — Suivi et limites">
<p class="ratio" data-cover="i65-12"></p><ul><li>L’endartériectomie est préférée après 70 ans.</li><li>Plusieurs sujets ne sont pas documentés : seuils de duplex, souffle, dépistage, resténose, sous-clavière.</li></ul></template>
<template data-pop="pareto-i65-criteres" data-title="Pareto — Critères et paramètres">
<p class="ratio" data-cover="i65-13"></p><ul><li>Délai idéal ≤ 14 jours ; risque périprocédural < 4 % ou < 2 %.</li><li>Pression < 130/80 mmHg ; LDL < 1,8 mmol/L ; bithérapie ≤ 90 jours.</li></ul></template>
<template data-pop="pareto-i65-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i65-e-1,i65-e-2,i65-e-3"></p><ul><li>Duplex en première intention ; angio-imagerie pour confirmer le degré.</li><li>IRM de plaque et Doppler transcrânien affinent le risque sans remplacer le degré.</li></ul></template>
<template data-pop="pareto-i65-bioch" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i65-s-anat-cours,i65-s-histo-cours,i65-s-physio-cours,i65-s-bioch-cours"></p><ul><li>Précérébral = I65 ; cérébral = I66.</li><li>Chape fine, noyau lipidique et hémorragie font la plaque vulnérable.</li><li>Embolie d’abord, hémodynamique ensuite ; LDL, CYP2C19 et CYP3A4 modifient la prescription.</li></ul></template>
<template data-pop="pareto-i65-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i65-p-1,i65-p-2,i65-p-3,i65-p-4"></p><ul><li>Antiagrégant, statine, pression : trio du traitement médical.</li><li>Bithérapie courte seulement dans l’AIT à haut risque, jamais au-delà de 90 jours.</li><li>Plavix® ne cite pas l’AIT : l’usage s’appuie sur l’ESO.</li></ul></template>
