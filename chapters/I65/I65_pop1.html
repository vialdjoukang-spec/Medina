<template data-pop="i65-classification" data-title="CIM-10-GM : I65 et codes voisins">
<div class="lab">Définition</div><p>I65 regroupe l’embolie, l’obstruction complète ou partielle, la sténose et la thrombose des artères basilaire, carotide et vertébrale, lorsqu’<b>aucun infarctus cérébral</b> n’en résulte. Les sous-codes I65.0 à I65.3, I65.8 et I65.9 précisent l’artère ou le caractère multiple et bilatéral.</p>
<div class="lab">Application</div><p>Le codeur choisit I65.- si l’imagerie ne montre aucun infarctus et I63.- (I63.0 à I63.2 pour les artères précérébrales) dès qu’un infarctus est constitué. I66 reprend la même structure pour les artères cérébrales. L’AIT lui-même relève du groupe G45.-, exclu du bloc I60–I69 et codé séparément. I67.2 désigne l’athérosclérose cérébrale.</p>
<div class="lab">Limite</div><p>La version allemande de la classification a été lue ; les intitulés français viennent du registre du dépôt, qui reprend l’Office fédéral de la statistique. La cartographie vers la CIM-11 reste à établir.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc I60–I69 (BfArM, OFS)</a>.</p></template>
<template data-pop="i65-symptomatique" data-title="Sténose symptomatique ou asymptomatique">
<div class="lab">Définition</div><p>Une sténose carotidienne est <b>symptomatique</b> lorsqu’un événement ischémique ipsilatéral oculaire (cécité monoculaire transitoire ou infarctus rétinien) ou hémisphérique (AIT ou AVC) est survenu dans les <b>six mois</b> précédents. Elle est <b>asymptomatique</b> en l’absence d’un tel événement.</p>
<div class="lab">Mécanisme</div><p>La limite de six mois ne décrit pas un seuil biologique précis : c’est le délai retenu par la ligne directrice pour attribuer l’événement à la sténose. Le risque de récidive est cependant concentré dans les premiers jours, d’où la précocité du geste.</p>
<div class="lab">Application</div><p>Le classement guide tout le reste : symptomatique, le degré de sténose décide de l’endartériectomie ; asymptomatique, le risque individuel décide de la revascularisation.</p>
<div class="lab">Limite</div><p>Une sténose qui ne correspond pas au territoire de l’événement ne le rend pas symptomatique : le côté compte.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a> ; <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a>.</p></template>
<template data-pop="i65-nascet" data-title="Méthode NASCET et degrés de sténose">
<div class="lab">Définition</div><p>NASCET est la méthode qui sert de référence aux degrés de sténose carotidienne dans la ligne directrice de l’ESO : <b>légère</b> inférieure à 50 %, <b>modérée</b> 50 à 69 %, <b>serrée</b> 70 à 99 %, et <b>quasi-occlusion</b> avec collapsus de la lumière distale.</p>
<div class="lab">Application</div><p>Un duplex qui donne un pourcentage sans méthode ne suffit pas : le médecin vérifie à quelle méthode il se rapporte et le confirme par angio-IRM ou angio-scanner lorsque la décision en dépend.</p>
<div class="lab">Limite</div><p>Pour la quasi-occlusion, l’ESO ne formule aucune recommandation faute de définition standardisée en échographie ou angiographie non invasive. Le détail du calcul du pourcentage n’est pas reproduit dans les sources lues et n’est donc pas donné ici.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a>.</p></template>
<template data-pop="i65-eso" data-title="Lire une recommandation de l’European Stroke Organisation">
<div class="lab">Définition</div><p>L’European Stroke Organisation (ESO) publie des recommandations qui associent une <b>force</b> (forte ou faible) et une <b>qualité de preuve</b> (haute, modérée, basse ou très basse). Une recommandation « forte » avec une qualité « très basse » est possible : elle exprime un équilibre bénéfice-risque jugé clair malgré peu de données.</p>
<div class="lab">Application</div><p>Pour l’endartériectomie symptomatique, la seule recommandation de qualité haute concerne le délai de deux semaines. La recommandation de l’endartériectomie à 70–99 % est forte avec une qualité modérée.</p>
<div class="lab">Limite</div><p>Cette ligne directrice date de 2021 et ne traite ni les antiagrégants autour de l’intervention, ni la resténose, ni le dépistage.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a>.</p></template>
<template data-pop="i65-plaque" data-title="Rupture de plaque et embolie">
<div class="lab">Mécanisme</div><p>La plaque athéroscléreuse de la bifurcation peut se rompre ; elle libère alors du matériel qui est entraîné par le flux et s’arrête dans une artère plus fine en aval. L’ischémie est donc distale, au niveau de l’œil ou du cerveau. La ligne directrice et la revue de Berne et Bâle présentent cette embolie comme le mécanisme principal.</p>
<div class="lab">Conséquence</div><p>Une plaque récemment rompue reste instable : le risque de récidive est nettement accru dans les premiers jours. Le danger n’est pas la sténose seule, mais l’instabilité de la plaque.</p>
<div class="lab">Décision</div><p>Le geste de revascularisation est urgent quand la sténose est symptomatique ; le traitement médical ne l’attend pas.</p>
<div class="lab">Limite</div><p>La part de l’origine hémodynamique n’est pas chiffrée dans les sources lues.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a>.</p></template>
<template data-pop="i65-epidemio" data-title="Prévalence : sources et limites">
<div class="lab">Données</div><p>La ligne directrice de l’ESO donne la prévalence d’une sténose de 50 % ou plus : 2,3 % des hommes et 2,0 % des femmes à la sixième décennie, 6,0 % et 3,6 % à la septième, 7,5 % et 5,0 % après 80 ans, dans des populations caucasiennes. La revue de Berne et Bâle cite environ 7 % des hommes et 4,5 % des femmes dès 75 ans ; la revue zurichoise, 6 à 15 % dès 65 ans.</p>
<div class="lab">Limite</div><p>Les écarts viennent des populations, des méthodes d’imagerie et des seuils. Aucune source lue ne donne des données suisses propres à I65 : l’Office fédéral de la statistique ne livre pas ici de série pour ce code.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a> ; <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32635848/" target="_blank" rel="noopener">Velz et coll., prise en charge de l’atteinte carotidienne, 2020 (Zurich)</a>.</p></template>
<template data-pop="i65-bifurcation" data-title="Anatomie de la bifurcation carotidienne">
<div class="lab">Anatomie</div><p>La plaque occupe la partie distale de l’artère carotide commune et la partie proximale de l’artère carotide interne. Plus rarement, elle atteint la carotide commune proximale ou la carotide interne distale, surtout dans le segment caverneux.</p>
<div class="lab">Application</div><p>Une plaque proximale à la bifurcation est repérable par ultrasons au cou. L’atteinte de la carotide commune proximale ou du segment caverneux est un siège plus rare.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a>.</p></template>
<template data-pop="i65-hemorragie" data-title="Hémorragie intraplaque">
<div class="lab">Définition</div><p>Un saignement à l’intérieur de la plaque. Il concerne 30 à 50 % des sténoses symptomatiques contre 20 à 30 % des asymptomatiques.</p>
<div class="lab">Conséquence</div><p>Elle augmente le risque d’AVC ipsilatéral, même si la sténose est inférieure à 50 % NASCET, et serait un meilleur prédicteur que le degré de sténose. Une sténose modérée avec hémorragie peut donc être plus dangereuse qu’une sténose serrée stable.</p>
<div class="lab">Application</div><p>L’IRM de plaque détecte l’hémorragie. Les sources lues ne définissent pas de seuil de décision fondé sur ce critère.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a>.</p></template>
<template data-pop="i65-reserve" data-title="Réserve cérébrovasculaire">
<div class="lab">Définition</div><p>La capacité de l’aval d’une sténose à compenser une baisse de pression de perfusion. Le Doppler transcrânien l’évalue.</p>
<div class="lab">Conséquence</div><p>Une réserve diminuée est citée parmi les prédicteurs d’AVC ipsilatéral dans la sténose asymptomatique. Elle suggère que la sténose retentit aussi sur le débit, en plus de l’embolie.</p>
<div class="lab">Limite</div><p>Les sources lues ne fournissent ni méthode d’examen détaillée ni seuil de décision.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a>.</p></template>
<template data-pop="i65-posterieure" data-title="Circulation postérieure">
<div class="lab">Fréquence</div><p>Environ un cinquième des AVC touchent la circulation postérieure. La sténose vertébrobasilaire est responsable d’environ 20 % de ces AVC.</p>
<div class="lab">Clinique</div><p>Les AIT et AVC y sont plus difficiles à diagnostiquer, et les échelles de dépistage rapide de l’AVC (visage, bras, parole) y sont moins sensibles. Le diagnostic repose sur un angio-scanner ou une angio-IRM.</p>
<div class="lab">Pronostic</div><p>Récidive d’AVC à 90 jours : 33 % pour la sténose basilaire ou vertébrale intracrânienne, 16 % pour la sténose vertébrale extracrânienne.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9358302/" target="_blank" rel="noopener">Markus et Michel, accident de la circulation postérieure, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29084065/" target="_blank" rel="noopener">Drazyk et Markus, sténose vertébrale symptomatique, 2018</a>.</p></template>
<template data-pop="i65-vulnerabilite" data-title="Prédicteurs de vulnérabilité : usage et limites">
<div class="lab">Définition</div><p>Les prédicteurs sont le degré et la progression de la sténose, la plaque irrégulière ou ulcérée, la plaque échopauvre, l’hémorragie intraplaque, le noyau nécrotique à chape fine, l’AVC ou l’AIT controlatéral, les infarctus silencieux, les micro-emboles, la réserve diminuée et l’inflammation.</p>
<div class="lab">Application</div><p>Chez un patient asymptomatique, ils servent à identifier ceux dont le risque justifie d’envisager une revascularisation. Un patient sans aucun marqueur et sous traitement médical optimal peut être suivi.</p>
<div class="lab">Limite</div><p>Aucune source lue n’a fixé de seuil validé : la décision reste individuelle et multidisciplinaire, comme le propose la revue zurichoise de 2023.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31038044/" target="_blank" rel="noopener">Staub, duplexsonographie de la sténose carotidienne asymptomatique, 2018 (Bâle)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37823810/" target="_blank" rel="noopener">Reutersberg et coll., revascularisation de la sténose asymptomatique, 2023 (Suisse)</a>.</p></template>
<template data-pop="i65-bmt" data-title="Traitement médical optimal">
<div class="lab">Définition</div><p>Traitement médical optimal (*best medical treatment*) : arrêt du tabac, statine, antihypertenseurs, antiagrégant plaquettaire ; selon la revue de Berne et Bâle, statines à haute dose, contrôle tensionnel intensif et antithrombotique optimal.</p>
<div class="lab">Application</div><p>Il s’applique à tous les patients, symptomatiques ou non, avant, pendant et après toute revascularisation. Dans ECST-2 et dans les essais récents, c’est le comparateur contre lequel la revascularisation est mesurée.</p>
<div class="lab">Limite</div><p>Les cibles chiffrées (pression, LDL) proviennent de la prévention secondaire après AVC ou AIT ; pour la sténose asymptomatique, elles ne sont pas précisées dans les sources lues.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31038044/" target="_blank" rel="noopener">Staub, duplexsonographie de la sténose carotidienne asymptomatique, 2018 (Bâle)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32635848/" target="_blank" rel="noopener">Velz et coll., prise en charge de l’atteinte carotidienne, 2020 (Zurich)</a> ; <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36082250/" target="_blank" rel="noopener">Ligne directrice ESO sur la prévention secondaire médicamenteuse, 2022</a>.</p></template>
<template data-pop="i65-lacune-clinique" data-title="Examen clinique : ce qui n’est pas documenté">
<div class="lab">Constat</div><p>Le dossier de recherche ne contient pas de source européenne lue sur la valeur diagnostique du souffle cervical, ni sur l’examen du fond d’œil à la recherche d’emboles rétiniens. Le cours ne les évalue donc pas.</p>
<div class="lab">Conséquence</div><p>Un souffle cervical absent ou présent ne remplace jamais l’imagerie : le diagnostic de sténose repose sur le duplex et l’angio-imagerie.</p>
</template>
<template data-pop="i65-ait" data-title="Accident ischémique transitoire et AIT à haut risque">
<div class="lab">Définition</div><p>Selon l’ESO, un AIT est un épisode de symptômes neurologiques transitoires, vraisemblablement dus à une ischémie focale cérébrale ou oculaire, de <b>moins de 24 heures</b>.</p>
<div class="lab">Haut risque</div><p>L’AIT est à haut risque si le score ABCD2 est de 4 ou plus, s’il s’accompagne d’un déficit moteur ou d’un trouble du langage de plus de cinq minutes, s’il est récidivant, ou s’il existe une maladie significative d’une grosse artère ipsilatérale, par exemple une sténose carotidienne.</p>
<div class="lab">Décision</div><p>Revue spécialisée dans les 24 heures ; bithérapie de courte durée si l’AIT n’est pas cardio-embolique.</p>
<div class="lab">Limite</div><p>La mention « retracted » dans PubMed concerne une version en double de la ligne directrice ; la version principale, publiée dans PubMed Central, est celle qui a été lue pour la sténose.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/34414306/" target="_blank" rel="noopener">Fonseca et coll., ligne directrice ESO sur l’accident ischémique transitoire, 2021</a>.</p></template>
<template data-pop="i65-duplex" data-title="Écho-Doppler cervical">
<div class="lab">Rôle</div><p>Examen de première intention pour détecter et évaluer l’étendue et la sévérité d’une sténose carotidienne extracrânienne. Il décrit aussi la morphologie de la plaque : échogénicité, ulcération, progression.</p>
<div class="lab">Application</div><p>Un duplex normal ne dispense pas d’évaluer les causes d’un AIT ; un duplex pathologique se confirme par angio-IRM ou angio-scanner si une décision en dépend.</p>
<div class="lab">Limite</div><p>Aucun critère de vitesse chiffré n’a été lu dans les sources européennes : il n’est pas donné ici.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31038044/" target="_blank" rel="noopener">Staub, duplexsonographie de la sténose carotidienne asymptomatique, 2018 (Bâle)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34414306/" target="_blank" rel="noopener">Fonseca et coll., ligne directrice ESO sur l’accident ischémique transitoire, 2021</a>.</p></template>
<template data-pop="i65-angio" data-title="Angio-IRM et angio-scanner">
<div class="lab">Rôle</div><p>L’ESO recommande l’une ou l’autre chez le patient avec AIT pour confirmer une sténose de grosse artère de 50 % ou plus, notamment pour préciser le degré d’une sténose carotidienne détectée en duplex.</p>
<div class="lab">Application</div><p>Le degré confirmé et la méthode de mesure figurent dans le compte rendu, parce que la décision de revascularisation en dépend.</p>
<div class="lab">Limite</div><p>Les sources lues ne comparent pas les deux modalités entre elles.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/34414306/" target="_blank" rel="noopener">Fonseca et coll., ligne directrice ESO sur l’accident ischémique transitoire, 2021</a>.</p></template>
<template data-pop="i65-irm-plaque" data-title="IRM de plaque">
<div class="lab">Rôle</div><p>Des séquences spécifiques détectent l’hémorragie intraplaque.</p>
<div class="lab">Conséquence</div><p>Cette hémorragie prédit le risque d’AVC ipsilatéral, même pour une sténose inférieure à 50 %.</p>
<div class="lab">Limite</div><p>Disponibilité, indications et seuils ne sont pas détaillés dans les sources lues.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a>.</p></template>
<template data-pop="i65-tcd" data-title="Doppler transcrânien">
<div class="lab">Rôle</div><p>Il détecte les micro-emboles et évalue la réserve cérébrovasculaire.</p>
<div class="lab">Conséquence</div><p>Des micro-emboles prouvent une libération active de fragments par la plaque ; une réserve diminuée signale une faible compensation en aval.</p>
<div class="lab">Limite</div><p>Aucune valeur seuil ni modalité d’examen n’est donnée dans les sources lues.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370069/" target="_blank" rel="noopener">Bonati et coll., ligne directrice ESO sur la sténose carotidienne, 2021</a>.</p></template>
<template data-pop="i65-dwi" data-title="IRM de diffusion après revascularisation">
<div class="lab">Données</div><p>Après stenting carotidien, l’IRM de diffusion montre trois fois plus de nouvelles lésions qu’après endartériectomie : 50 % contre 17 % dans l’essai ICSS ; 85 % de ces lésions sont asymptomatiques.</p>
<div class="lab">Lecture</div><p>Ces lésions sont plus fréquentes après stenting ; la source n’en précise pas le mécanisme ni les conséquences cliniques à long terme.</p>
<p class="src">Références : <a href="https://www.rosenfluh.ch/media/psychiatrie-neurologie/2023/01/Management-der-extrakraniellen-Karotisstenose.pdf" target="_blank" rel="noopener">Müller et Wagner, Psychiatrie + Neurologie 1/2023 (Berne, Bâle)</a>.</p></template>
<template data-pop="i65-dapt" data-title="Durée de la bithérapie antiagrégante">
<div class="lab">Données</div><p>L’ESO 2021 recommande fortement une bithérapie clopidogrel plus aspirine de courte durée en cas d’AIT non cardio-embolique à haut risque (ABCD2 de 4 ou plus). La revue de Markus et Michel limite le bénéfice aux trois premières semaines environ, puis clopidogrel seul. L’ESO 2022 conseille d’éviter la bithérapie au-delà de 90 jours.</p>
<div class="lab">Information suisse</div><p>La notice de Plavix cite l’essai CURE : au-delà de trois mois, pas de bénéfice supplémentaire mais un risque hémorragique persistant, et une association à l’aspirine de 75 à 325 mg utilisée jusqu’à un an dans les études.</p>
<div class="lab">Arbitrage</div><p>Les trois repères — trois semaines, trois mois, 90 jours — ne se recouvrent pas parfaitement. La plus récente des sources primaires applicables à la sténose (ESO 2022) fixe le plafond à 90 jours ; la revue spécialisée donne la durée de bénéfice observée.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/34414306/" target="_blank" rel="noopener">Fonseca et coll., ligne directrice ESO sur l’accident ischémique transitoire, 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9358302/" target="_blank" rel="noopener">Markus et Michel, accident de la circulation postérieure, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36082250/" target="_blank" rel="noopener">Ligne directrice ESO sur la prévention secondaire médicamenteuse, 2022</a> ; information professionnelle suisse de Plavix® (mise à jour septembre 2022).</p></template>
<template data-pop="i65-risque-periop" data-title="Risque périprocédural cible">
<div class="lab">Données</div><p>Le risque intrahospitalier d’AVC ou de décès doit être idéalement inférieur à 4 % pour une sténose symptomatique (consensus ESO) et inférieur à 2 % pour une sténose asymptomatique (consensus ESO et revue de Berne et Bâle).</p>
<div class="lab">Raison</div><p>Pour la sténose asymptomatique, le bénéfice attendu est plus faible ; un risque périprocédural élevé l’annulerait. Pour la symptomatique, le risque spontané est plus élevé, donc un seuil plus tolérant est accepté.</p>
<div class="lab">Limite</div><p>Ces seuils supposent des centres expérimentés à haut volume, avec évaluation indépendante des résultats.</p>
