<template data-pop="j86-echographie" data-title="Échographie thoracique"><p class="lab">Ce qu’elle montre</p><p>Chez le patient assis, la sonde explore les récessus postérieurs et latéraux. Elle mesure le volume du liquide et apprécie son échogénicité, ses cloisons et l’épaississement pleural. Un liquide échogène ou cloisonné est presque toujours un exsudat ; un liquide anéchogène peut être simple ou infecté.</p><p class="lab">Usage</p><p>La BTS 2023 exige, par une recommandation forte, que toute ponction pleurale soit guidée par l’imagerie, car ce guidage réduit les pneumothorax et les ponctions blanches.</p><div class="key"><b>Piège.</b> L’absence de cloisons n’exclut pas une infection ; seule la ponction mesure le pH.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>

urce : <a href="https://commons.wikimedia.org/wiki/File:Pleuraempyem_mit_angrenzend_konsolidierter_Lunge_66M_-_CT_axial_KM_-_001.jpg" target="_blank" rel="noopener" data-reference-source="1">Hellerhoff, Wikimedia Commons</a> ; <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener" data-reference-source="1">licence CC BY-SA 4.0</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure><p class="lab">Signes de l’empyème</p><p>La collection est lenticulaire ; les feuillets pariétal et viscéral, rehaussés, s’écartent autour du liquide (signe de la plèvre dédoublée) ; la graisse extrapleurale s’épaissit.</p><p class="lab">Apports</p><p>Le scanner dénombre les logettes, guide un drain et montre la pneumonie, un abcès, une tumeur, une perforation œsophagienne ou une collection médiastinale.</p><p class="lab">Limite</p><p>Le rehaussement pleural n’est pas spécifique de l’infection : il s’observe aussi dans les épanchements tumoraux.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-ponction" data-title="Ponction pleurale diagnostique"><p class="lab">Technique et prélèvements</p><p>La ponction, guidée par échographie, longe le bord supérieur de la côte pour épargner le paquet vasculonerveux intercostal. Une seringue sans héparine résiduelle ni anesthésique local sert au pH, analysé immédiatement sur un analyseur de gaz du sang. Des tubes servent au glucose, à la lactate déshydrogénase, aux protéines, à la cytologie, au Gram et à la culture. Des flacons d’hémoculture sont inoculés au lit du patient, comme la BTS le recommande fortement, car ils préservent les germes exigeants et augmentent le rendement.</p><div class="key"><b>Erreur fréquente.</b> Envoyer la seringue au laboratoire central et la mesurer une heure plus tard : le dioxyde de carbone s’échappe et le pH monte faussement.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-seuils-ph" data-title="Mesure et seuils du pH pleural"><p class="lab">Fiabilité</p><p>L’héparine et la lidocaïne, acides, abaissent faussement le pH ; un délai d’analyse l’élève par perte de dioxyde de carbone. Bandelettes et pH-mètres de laboratoire sont imprécis : la mesure se fait aussitôt sur un analyseur de gaz du sang. À défaut, un glucose &lt; 3,3 mmol/L sert de substitut.</p><div class="key"><b>Choix de la source.</b> La BTS 2023, recommandation la plus récente, retient « ≤ 7,2 » pour le drain ; des textes plus anciens, repris dans le cours <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>, écrivent « &lt; 7,2 ». La divergence ne concerne qu’un pH exactement égal à 7,2, pour lequel le seuil de la BTS 2023 est retenu.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-ldh" data-title="Lactate déshydrogénase pleurale"><p class="lab">Origine</p><p>Cette enzyme intracellulaire est libérée par les cellules détruites ; sa concentration mesure l’intensité de la lyse cellulaire, donc de l’inflammation.</p><p class="lab">Usage</p><p>Elle classe le liquide en exsudat (critères de Light) et, pour un pH entre 7,2 et 7,4, une valeur supérieure à 900 UI/L fait envisager un drain selon la BTS 2023.</p><p class="lab">Limite</p><p>Elle s’élève aussi dans les exsudats tumoraux et ne s’interprète qu’avec le pH, le glucose et la clinique.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-glucose" data-title="Glucose pleural"><p class="lab">Mécanisme</p><p>Le glucose pleural égale normalement le glucose plasmatique, car il traverse librement la plèvre. Dans l’infection, leucocytes et bactéries le consomment et la plèvre épaissie freine son entrée.</p><p class="lab">Seuils</p><p>Un glucose &lt; 3,3 mmol/L indique une infection pleurale probable lorsque le pH manque ; un glucose ≤ 4,0 mmol/L soutient l’indication du drain en zone intermédiaire (BTS 2023).</p><div class="key"><b>Piège.</b> La polyarthrite rhumatoïde abaisse fortement le glucose pleural sans infection.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-light" data-title="Critères de Light"><p class="lab">Règle</p><p>Un épanchement est un exsudat si au moins un critère est présent : rapport des protéines pleurales aux protéines sériques &gt; 0,5 ; rapport des lactate déshydrogénases pleurale et sérique &gt; 0,6 ; lactate déshydrogénase pleurale supérieure aux deux tiers de la limite supérieure de la normale sérique.</p><p class="lab">Mécanisme</p><p>L’exsudat traduit une plèvre ou des capillaires lésés ; le transsudat, un déséquilibre des pressions hydrostatique ou oncotique.</p><p class="lab">Limite</p><p>Très sensible, la règle classe à tort comme exsudats certains transsudats traités par diurétiques. Sa démarche complète est exposée dans le cours <a href="#/entry/J90">J90 — Épanchements pleuraux</a>.</p><p class="src">Références : <a href="https://doi.org/10.7326/0003-4819-77-4-507" target="_blank" rel="noopener">Light et al., 1972</a>.</p></template>
<template data-pop="j86-cancer-excave" data-title="Cancer bronchique excavé"><p class="lab">Arguments</p><p>Tabagisme, absence de terrain d’inhalation, fièvre discrète, amaigrissement, paroi épaisse et irrégulière et absence de régression sous antibiotique orientent vers la tumeur.</p><p class="lab">Mécanisme et conduite</p><p>La tumeur se nécrose en son centre, ou obstrue une bronche en amont de laquelle se forme un abcès. Une bronchoscopie avec biopsie, ou une biopsie transthoracique, établit le diagnostic.</p><div class="key"><b>Erreur fréquente.</b> Attribuer à un abcès, chez un fumeur, une cavité qui ne régresse pas, sans contrôle endoscopique.</div><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-tuberculose" data-title="Tuberculose cavitaire"><p class="lab">Arguments</p><p>Une cavité des segments apicaux ou postérieurs des lobes supérieurs, une évolution sur des semaines, des sueurs nocturnes, un amaigrissement, des hémoptysies, une origine de forte endémie, un contact connu ou une immunodépression orientent vers la tuberculose.</p><p class="lab">Conduite</p><p>Trois expectorations sont analysées pour la recherche de bacilles acido-alcoolo-résistants, la culture et l’amplification génique ; l’isolement respiratoire est maintenu jusqu’à l’exclusion.</p><p class="lab">Conséquence</p><p>Un empyème tuberculeux relève du traitement de la tuberculose. Ce traitement suit la preuve microbiologique ou une décision spécialisée, jamais une simple image cavitaire.</p></template>
<template data-pop="j86-empyeme-vs-abces" data-title="Empyème ou abcès : critères du scanner"><p class="lab">Empyème</p><p>Le scanner injecté montre une collection pleurale de forme lenticulaire, un épaississement de la plèvre viscérale avec dédoublement des feuillets, dit signe de la plèvre clivée, et une hypertrophie de la graisse extrapleurale au-delà de 2 mm. Ces signes sont plus fréquents dans l’infection que dans le cancer, mais leur sensibilité reste faible, de 20 à 48 %.</p><p class="lab">Abcès</p><p>L’abcès est une cavité creusée dans le parenchyme par une nécrose infectieuse, souvent à niveau hydroaérique ; un empyème localisé s’en distingue par le scanner ou l’échographie.</p><p class="lab">Conséquence pratique</p><p>L’empyème se draine par un drain thoracique ; l’abcès se traite d’abord par antibiotique, et son drainage percutané expose à des complications, dont la fistule bronchopleurale.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-mimes" data-title="Épanchements acides non infectieux"><p class="lab">Polyarthrite rhumatoïde</p><p>L’épanchement est chronique, à pH et glucose très bas, parfois pseudochyleux, chez un patient connu pour sa polyarthrite.</p><p class="lab">Cancer pleural avancé</p><p>Une charge tumorale élevée consomme le glucose ; la cytologie est souvent positive et le pronostic défavorable.</p><p class="lab">Rupture œsophagienne</p><p>La douleur suit des vomissements, l’épanchement siège à gauche et l’amylase salivaire du liquide est élevée : c’est une urgence chirurgicale.</p><div class="key"><b>Conséquence.</b> La BTS rappelle ces diagnostics devant un liquide acide qui ne s’inscrit pas dans une pneumonie.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-16s" data-title="Amplification de l’ADN ribosomique 16S"><p class="lab">Principe</p><p>Le gène de l’ARN ribosomique 16S existe chez toutes les bactéries ; ses régions variables identifient l’espèce après amplification et séquençage.</p><p class="lab">Valeur et limite</p><p>La méthode identifie des bactéries tuées par un antibiotique préalable ou incultivables, notamment des anaérobies. Elle ne fournit pas d’antibiogramme et peut détecter des contaminants : son résultat se confronte à la clinique.</p><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a>.</p></template>
<template data-pop="j86-drain" data-title="Drain thoracique de petit calibre"><p class="lab">Recommandation</p><p>La BTS 2023 recommande un drain de 14 F ou moins pour le drainage initial de l’infection pleurale, posé sous imagerie.</p><p class="lab">Justification</p><p>Les petits drains se posent plus facilement et font moins souffrir ; avec des rinçages réguliers, ils évacuent le pus de manière comparable dans les données disponibles.</p><p class="lab">Surveillance</p><p>Le débit, l’aspect, le bullage, la douleur et la position à l’imagerie sont suivis. Un drain muet devant une collection persistante est obstrué, mal placé ou face à une collection cloisonnée.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-iet" data-title="Alteplase et dornase intrapleurales"><p class="lab">Protocole BTS 2023</p><p>Alteplase 10 mg et dornase alfa 5 mg sont instillées deux fois par jour pendant trois jours, lorsqu’une collection persiste après l’arrêt du débit du drain initial ; la recommandation est conditionnelle, par consensus. Selon des séries rétrospectives, 5 mg d’alteplase pourraient suffire ; cette dose convient au patient à risque hémorragique, notamment sous une anticoagulation qui ne peut être interrompue.</p><div class="key"><b>Contre-indications pratiques.</b> Fistule bronchopleurale, saignement actif, trouble majeur de l’hémostase. Le consentement du patient est recueilli.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-mist2" data-title="Essai MIST2 (2011)"><p class="lab">Plan</p><p>Cet essai randomisé en double aveugle et en plan factoriel 2 × 2 a inclus 210 patients atteints d’infection pleurale.</p><p class="lab">Résultats</p><p>L’opacité pleurale a diminué au septième jour de 29,5 % avec l’association contre 17,2 % sous placebo, soit une différence ajustée de 7,9 points (intervalle de confiance à 95 % : 2,4 à 13,4). Le recours chirurgical à trois mois est passé de 16 % à 4 % et la durée d’hospitalisation a été réduite de 6,7 jours. Aucune molécule seule n’a fait mieux que le placebo ; la dornase seule a même porté le recours chirurgical à 39 %. Les événements indésirables ne différaient pas significativement.</p><p class="lab">Limites</p><p>Le critère principal était radiologique ; l’essai n’était pas dimensionné pour la mortalité.</p><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1012740" target="_blank" rel="noopener">Rahman et al., New England Journal of Medicine 2011;365:518-26</a>.</p></template>
<template data-pop="j86-mist1" data-title="Essai MIST1 (2005)"><p class="lab">Plan</p><p>454 patients atteints d’infection pleurale ont reçu de la streptokinase intrapleurale, 250 000 UI deux fois par jour pendant trois jours, ou un placebo.</p><p class="lab">Résultat</p><p>Le décès ou la chirurgie à trois mois sont survenus chez 31 % des patients sous streptokinase contre 27 % sous placebo. Aucun bénéfice n’a été observé sur la mortalité, la chirurgie, l’image ou la durée d’hospitalisation, au prix de davantage d’effets indésirables graves.</p><p class="lab">Leçon</p><p>Dissoudre la fibrine ne suffit pas, car la viscosité due à l’ADN persiste ; cette hypothèse a conduit à MIST2.</p><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa042473" target="_blank" rel="noopener">Maskell et al., New England Journal of Medicine 2005</a>.</p></template>
<template data-pop="j86-vats" data-title="Chirurgie thoracique vidéo-assistée"><p class="lab">Gestes et place</p><p>Le chirurgien débride les logettes, lave la cavité et, si le poumon est trappé, pratique une décortication. La BTS 2023 ne recommande pas la chirurgie d’emblée à la place du drain ; lorsque la chirurgie devient nécessaire, elle préfère la voie vidéo-assistée à la thoracotomie si elle permet un nettoyage complet. Les indications habituelles sont un sepsis persistant malgré drainage et enzymes, une collection organisée, un poumon trappé symptomatique ou une fistule.</p><div class="key"><b>Limite.</b> L’ERS/ESTS demande un avis chirurgical précoce, mais le moment optimal de l’intervention reste mal défini par les essais.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/13993003.01062-2022" target="_blank" rel="noopener">ERS/ESTS 2023</a>.</p></template>
<template data-pop="j86-antibio-pleural" data-title="Antibiothérapie de l’infection pleurale"><p class="lab">Principe</p><p>Le spectre de l’antibiotique suit la bactériologie de Maskell : l’infection communautaire relève surtout des streptocoques et des anaérobies, alors que l’infection nosocomiale fait craindre le staphylocoque résistant et les bacilles à Gram négatif.</p><p class="lab">Choix pratiques</p><p>La BTS 2023 cite en exemple, pour l’infection communautaire, l’association céfuroxime et métronidazole, et, pour l’infection nosocomiale, un schéma actif sur les bacilles à Gram négatif résistants et, selon le risque, sur le staphylocoque résistant. Le cours retient l’amoxicilline-acide clavulanique, conformément à la position suisse ci-dessous ; une céphalosporine associée au métronidazole ou, en cas d’allergie sévère, la clindamycine la remplacent.</p><div class="key"><b>Position suisse.</b> La Société suisse d’infectiologie n’a pas de recommandation propre à l’empyème ou à l’abcès. Pour la pneumonie d’inhalation, elle retient l’amoxicilline-acide clavulanique 2,2 g toutes les 8 heures par voie intraveineuse ; en alternative, la ceftriaxone 2 g par 24 heures, avec ou sans clindamycine 600 mg ou métronidazole 500 mg toutes les 8 heures. Devant un échec, elle demande de rechercher un épanchement compliqué ou un empyème. Ce schéma concorde avec le choix de l’amoxicilline-acide clavulanique retenu ici ; les doses suivent l’information professionnelle suisse du produit.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, section sur l’antibiothérapie</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, lue le 08.10.2026</a></p></template>
<template data-pop="j86-duree" data-title="Durée de l’antibiothérapie pleurale"><p class="lab">Données</p><p>Aucun grand essai n’a fixé la durée. L’essai randomisé SLIM, mené chez 50 patients stabilisés sans chirurgie et au score RAPID ≤ 4, a comparé 14 à 21 jours à 28 à 42 jours : l’échec à six semaines a touché 16,7 % contre 12,5 % des patients, différence non significative. Un petit essai espagnol, deux contre trois semaines d’amoxicilline-acide clavulanique dans l’épanchement compliqué communautaire stabilisé, conclut dans le même sens.</p><p class="lab">Pratique et limite</p><p>La BTS 2023 constate qu’en général 2 à 6 semaines d’antibiotique sont données selon la réponse clinique, faute d’étude de puissance suffisante. La durée se décide sur le contrôle de la source, la clinique et l’imagerie, avec un relais oral précoce. Ces essais, trop petits pour démontrer l’équivalence, ne s’appliquent ni aux patients opérés ni aux patients instables.</p><p class="src">Références : <a href="https://doi.org/10.1183/23120541.00635-2022" target="_blank" rel="noopener">Hassan et al., essai SLIM, European Respiratory Journal Open Research 2023</a> ; <a href="https://doi.org/10.1183/20734735.0134-2023" target="_blank" rel="noopener">Skouras et al., synthèse des essais de durée, Breathe 2023</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-antibio-abces" data-title="Antibiothérapie de l’abcès pulmonaire"><p class="lab">Choix</p><p>La couverture vise les anaérobies et les streptocoques : amoxicilline-acide clavulanique en première intention, clindamycine en cas d’allergie. Les aminosides, peu actifs dans la paroi chronique, ne sont pas recommandés.</p><p class="lab">Durée</p><p>La voie intraveineuse est maintenue 5 à 21 jours selon l’évolution, puis relayée par voie orale, pour un total de 28 à 48 jours dans les séries citées, jusqu’à disparition de la fièvre et de l’expectoration purulente.</p><p class="lab">Réponse attendue</p><p>La réponse à l’antibiotique se dessine en 3 à 4 jours, l’état général s’améliore en 4 à 7 jours et la radiographie se normalise en environ deux mois.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-drainage-abces" data-title="Drainage percutané et chirurgie de l’abcès"><p class="lab">Drainage percutané</p><p>Il est indiqué chez environ 11 à 21 % des patients après échec de l’antibiothérapie, devant un abcès volumineux ou sous tension, ou un sepsis persistant. Il est définitif chez environ 84 % des patients drainés, au prix d’environ 16 % de complications, dont la fistule bronchopleurale, et d’une mortalité d’environ 4 %.</p><p class="lab">Chirurgie</p><p>La résection concerne environ 10 % des patients. Elle se discute devant une suspicion de cancer, une cavité de plus de 6 cm, une hyperleucocytose qui persiste sous antibiotique ou des symptômes qui durent plus de douze semaines, car la guérison médicale devient alors improbable. Sa mortalité rapportée va de 11 à 28 %.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-mediastinite" data-title="Médiastinite nécrosante descendante"><p class="lab">Anatomie</p><p>Les espaces cervicaux profonds, notamment l’espace rétropharyngé, communiquent avec le médiastin. Une infection dentaire ou amygdalienne y descend sous l’effet de la gravité et de la pression intrathoracique négative.</p><p class="lab">Clinique</p><p>Douleur et tuméfaction cervicales, trismus et dysphagie précèdent la douleur thoracique, la dyspnée et le sepsis.</p><p class="lab">Conduite</p><p>Le scanner cervicothoracique injecté confirme le diagnostic ; les antibiotiques à large spectre, actifs sur aérobies et anaérobies, accompagnent un drainage chirurgical précoce, cervical et thoracique, dans une prise en charge pluridisciplinaire.</p><div class="key"><b>Autres portes d’entrée.</b> Perforation de l’œsophage, infection après sternotomie.</div><p class="src">Références : <a href="https://doi.org/10.21037/med-24-29" target="_blank" rel="noopener">Chaulk et al., 2025</a>.</p></template>
<template data-pop="j86-co-amoxi" data-title="Amoxicilline-acide clavulanique"><p class="lab">Mécanisme</p><p>L’amoxicilline inhibe la synthèse de la paroi bactérienne ; l’acide clavulanique neutralise les bêta-lactamases de nombreux anaérobies et des staphylocoques sensibles à la méticilline.</p><p class="lab">Indication et doses</p><p>Les indications suisses de la forme parentérale incluent les infections respiratoires basses et l’empyème ; les doses figurent dans le tableau de l’onglet Pharmacologie.</p><p class="lab">Tolérance et surveillance</p><p>Diarrhée, éruption et hépatite cholestatique sont les effets à connaître ; un ictère ou une atteinte hépatique sous un traitement antérieur par cette association la contre-indique. Une hypersensibilité connue aux pénicillines ou aux céphalosporines la contre-indique aussi. Sous 30 mL/min de clairance de la créatinine, la perfusion de 2,2 g et le comprimé de 1 g ne sont plus employés ; la dose est réduite selon le tableau de l’onglet Pharmacologie, avec une dose supplémentaire après hémodialyse. Les tests hépatiques sont surveillés lors d’un traitement de plusieurs semaines.</p><p class="src">Références : Informations professionnelles suisses Co-Amoxicillin Labatec® (octobre 2024) et Augmentin® comprimés filmés (mars 2026), Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
<template data-pop="j86-metronidazole" data-title="Métronidazole"><p class="lab">Mécanisme</p><p>Réduit dans la bactérie anaérobie, il forme des dérivés qui fragmentent son ADN ; il reste inactif sur les aérobies et s’associe donc toujours à un antibiotique actif sur ceux-ci.</p><p class="lab">Place et dose</p><p>Associé à une céphalosporine, il couvre les anaérobies lorsque l’aminopénicilline ne convient pas. Par voie orale, l’information suisse de Flagyl prévoit 1,5 g par jour en trois prises dans les infections à anaérobies ; par voie intraveineuse, Metronidazol i.v. B. Braun prévoit 15 mg/kg en dose initiale, puis 7,5 mg/kg toutes les 6 heures pendant 3 jours, puis toutes les 12 heures, au plus 4 g par jour. La Société suisse d’infectiologie cite 500 mg toutes les 8 heures dans la pneumonie d’inhalation.</p><p class="lab">Limite de durée</p><p>Les deux informations suisses limitent en règle le traitement à 10 jours, en raison d’un potentiel mutagène observé chez l’animal ; au-delà, la formule sanguine et l’apparition de neuropathies sont surveillées. Cette limite favorise l’amoxicilline-acide clavulanique pour les traitements de plusieurs semaines de l’abcès et de l’empyème.</p><p class="lab">Risques</p><p>Neuropathies, réaction antabuse avec l’alcool, potentialisation des anticoagulants coumariniques et rétention de lithium sont à connaître. La dose reste habituelle en insuffisance rénale ; elle se réduit en insuffisance hépatique grave.</p><p class="src">Références : Information professionnelle suisse Flagyl® (septembre 2025), Swissmedic (AIPS), consultée le 08.10.2026 ; Information professionnelle suisse Metronidazol i.v. B. Braun (février 2026), Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, lue le 08.10.2026</a>.</p></template>
<template data-pop="j86-clindamycine" data-title="Clindamycine"><p class="lab">Place et dose</p><p>Ce lincosamide inhibe la sous-unité ribosomique 50S et agit sur les anaérobies et les cocci à Gram positif. L’information suisse de Dalacin C cite l’empyème et l’abcès pulmonaire parmi ses indications. Elle prévoit, dans les infections sévères, 1 200 à 1 800 mg par jour par voie intraveineuse en 2 à 4 doses, soit par exemple 600 mg toutes les 8 heures, et par voie orale 600 à 1 800 mg par jour en 3 ou 4 prises. La perfusion ne dépasse pas 30 mg par minute.</p><p class="lab">Adaptations</p><p>Aucune adaptation n’est nécessaire en insuffisance rénale ou hépatique légère à modérée ; dans les formes sévères, la demi-vie s’allonge et le taux est surveillé lors des fortes doses.</p><p class="lab">Risque majeur</p><p>Une diarrhée sous traitement impose la recherche des toxines de <i>Clostridioides difficile</i>.</p><p class="src">Références : Information professionnelle suisse Dalacin® C (juillet 2026), Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-alteplase" data-title="Alteplase"><p class="lab">Mécanisme et indications suisses</p><p>Cet activateur tissulaire du plasminogène recombinant convertit en plasmine le plasminogène lié à la fibrine. En Suisse, Actilyse est autorisé pour la thrombolyse de l’infarctus aigu du myocarde, de l’embolie pulmonaire massive avec instabilité hémodynamique et de l’accident vasculaire cérébral ischémique dans les 4,5 heures ; le flacon de 10 mg reconstitué contient 1 mg/mL. L’usage intrapleural est hors indication.</p><p class="lab">Risque</p><p>L’hémothorax est le risque principal ; anticoagulants et antiagrégants l’accroissent. Pour l’usage intraveineux, l’information suisse contre-indique Actilyse sous anticoagulation efficace, avec un rapport normalisé international supérieur à 1,3 ; la BTS propose, pour l’usage intrapleural chez le patient à risque hémorragique, une dose réduite de 5 mg.</p><p class="src">Références : Information professionnelle suisse Actilyse® (juin 2025), Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-dornase" data-title="Dornase alfa"><p class="lab">Mécanisme et indication suisse</p><p>Cette désoxyribonucléase I humaine recombinante coupe l’ADN extracellulaire libéré par les polynucléaires et réduit la viscosité des sécrétions purulentes. En Suisse, Pulmozyme est autorisé dans la mucoviscidose, en association au traitement standard, chez les patients dont la capacité vitale forcée dépasse 40 % de la valeur prédite, à raison de 2,5 mg inhalés une fois par jour.</p><p class="lab">Usage intrapleural</p><p>Il est hors indication ; sans alteplase, il augmentait le recours chirurgical dans MIST2.</p><p class="src">Références : Information professionnelle suisse Pulmozyme® (avril 2021), Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://doi.org/10.1056/NEJMoa1012740" target="_blank" rel="noopener">MIST2, 2011</a>.</p></template>
<template data-pop="j86-saignement" data-title="Saignement pleural sous fibrinolyse"><p class="lab">Signes</p><p>Le liquide de drainage devient sanglant, l’hémoglobine baisse, une tachycardie puis une hypotension apparaissent et l’opacité augmente.</p><p class="lab">Conduite</p><p>Les instillations sont arrêtées. L’hématocrite du liquide pleural est mesuré : un hémothorax est retenu s’il dépasse la moitié de l’hématocrite sanguin. Un bilan d’hémostase et un avis chirurgical complètent la conduite.</p><p class="lab">Prévention</p><p>Le médecin recense anticoagulants et antiagrégants, corrige les troubles de l’hémostase et envisage la dose réduite de 5 mg d’alteplase.</p><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>, seuil d’hématocrite.</p></template>
<template data-pop="j86-aminosides" data-title="Pourquoi éviter les aminosides dans le pus"><p class="lab">Recommandation</p><p>Les aminosides ne sont pas recommandés dans le traitement de l’abcès pulmonaire, car ils pénètrent mal la membrane pyogène fibreuse de l’abcès chronique.</p><p class="lab">Conséquence</p><p>Aucun des schémas proposés par la BTS 2023 pour l’infection pleurale ni par la Société suisse d’infectiologie pour la pneumonie d’inhalation n’en comporte : la couverture repose sur une bêta-lactamine, associée au besoin au métronidazole ou à la clindamycine.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, lue le 08.10.2026</a>.</p></template>
<template data-pop="pareto-j86-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j86-0,j86-1,j86-2,j86-3,j86-4,j86-5,j86-6"></p><ul><li>Un épanchement parapneumonique est simple, compliqué ou devenu un empyème ; l’aspect du liquide, son pH et la coloration de Gram séparent ces stades, car le pH baisse à mesure que les bactéries et les neutrophiles consomment le glucose et produisent de l’acide.</li><li>Un patient sur dix meurt à trois mois ; le score RAPID mesure ce risque.</li><li>La glycolyse leucocytaire et bactérienne abaisse pH et glucose ; la fibrinolyse bloquée cloisonne ; l’organisation trappe le poumon.</li><li>Streptocoques du groupe anginosus et anaérobies dominent en ville, bactéries résistantes à l’hôpital.</li><li>Inhalation, mauvaise dentition et alcool sont les terrains majeurs.</li><li>Une fièvre persistante sous antibiotique fait chercher une collection.</li></ul></template>
<template data-pop="pareto-j86-diag" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="j86-7"></p><ul><li>L’échographie précède toute ponction.</li><li>Un pus franc ou un pH ≤ 7,2 impose un drain. Si le pH est entre 7,2 et 7,4, la décision s’appuie sur une lactate déshydrogénase &gt; 900 UI/L et sur le contexte ; si le pH est ≥ 7,4, une surveillance suffit.</li><li>Le pH se mesure aussitôt sur analyseur de gaz du sang, sans héparine ni lidocaïne.</li><li>Devant une cavité, cancer excavé et tuberculose sont écartés d’abord.</li></ul></template>
<template data-pop="pareto-j86-tt" data-title="Pareto — Gravité et traitement"><p class="ratio" data-cover="j86-8,j86-9"></p><ul><li>Le sepsis impose un drainage sans délai ; une fistule impose le décubitus côté malade.</li><li>Antibiotique couvrant les anaérobies ; drain de 14 F ou moins.</li><li>Une collection résiduelle se traite par alteplase 10 mg et dornase 5 mg, deux fois par jour pendant trois jours, et jamais par une enzyme seule : l’alteplase dissout la fibrine qui cloisonne la cavité, tandis que la dornase fluidifie le pus en dégradant l’ADN des neutrophiles morts.</li><li>En cas d’échec ou de coque pleurale, le patient est adressé à la chirurgie vidéo-assistée, car une plèvre épaissie empêche le poumon de se réexpandre.</li><li>Un abcès se traite par un antibiotique prolongé ; seule une minorité des patients a besoin d’un drainage ou d’une chirurgie, parce que la cavité se vide le plus souvent par la bronche.</li></ul></template>
<template data-pop="pareto-j86-crit" data-title="Pareto — Suivi, situations et critères"><p class="ratio" data-cover="j86-10,j86-11,j86-12"></p><ul><li>Le suivi juge la trajectoire à partir de la fièvre, de la protéine C réactive, du débit du drain et de l’imagerie.</li><li>Une cavité persistante chez un fumeur impose une bronchoscopie.</li><li>Une infection cervicale suivie d’une douleur thoracique évoque une médiastinite descendante.</li><li>Un empyème se définit par du pus ou des germes dans la plèvre, un épanchement compliqué par un pH ≤ 7,2 et un abcès par une cavité de plus de 2 cm.</li></ul></template>
<template data-pop="pareto-j86-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j86-e-1,j86-e-2,j86-e-3,j86-e-4"></p><ul><li>La ponction est l’examen de référence pour la plèvre, tandis que le scanner est l’examen de référence pour l’abcès.</li><li>Le liquide se lit dans un ordre précis : d’abord l’aspect, puis le pH, enfin la lactate déshydrogénase et le glucose.</li><li>Au scanner, l’empyème forme une collection lenticulaire qui dédouble la plèvre, alors que l’abcès est une cavité creusée dans le parenchyme.</li><li>Liquide inoculé en flacons d’hémoculture ; une culture négative n’exclut rien.</li></ul></template>
<template data-pop="pareto-j86-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j86-p-1,j86-p-2,j86-p-3,j86-p-4"></p><ul><li>Amoxicilline-acide clavulanique selon l’information suisse : 2,2 g par voie intraveineuse trois à quatre fois par jour, puis 625 mg trois fois ou 1 g deux fois par jour par voie orale ; réduction sous 30 mL/min de clairance.</li><li>Le métronidazole se donne en règle pendant 10 jours au plus, et la clindamycine à 1 200 à 1 800 mg par jour par voie intraveineuse.</li><li>L’alteplase et la dornase intrapleurales sont utilisées hors indication ; elles exigent donc un consentement et la prise en compte du risque hémorragique.</li><li>Une fistule bronchopleurale contre-indique l’instillation, car l’enzyme passerait dans les bronches.</li><li>Aminosides évités ; tests hépatiques et fonction rénale surveillés lors des traitements longs.</li></ul></template>
