<template data-pop="j86-continuum" data-title="Le continuum de l’infection pleurale"><p class="lab">Mécanisme</p><p>La perméabilité pleurale crée le liquide, l’invasion bactérienne l’acidifie par glycolyse, la fibrine le cloisonne, les fibroblastes l’organisent. Ces étapes s’enchaînent en quelques jours à quelques semaines, sans frontière nette.</p><p class="lab">Conséquence pratique</p><p>Le stade simple guérit par l’antibiotique ; le stade compliqué et l’empyème exigent un drain ; la collection organisée relève parfois de la chirurgie.</p><div class="key"><b>Limite.</b> Le stade se lit sur le liquide et l’image, non sur la durée de la maladie : un empyème peut se constituer en quelques jours.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-abces-def" data-title="Abcès pulmonaire : formes primaire et secondaire"><p class="lab">Formes</p><p>L’abcès est dit primaire, soit environ 60 % des cas, lorsqu’il naît d’une infection du parenchyme, et secondaire lorsqu’il complique un obstacle bronchique, un embole septique ou la rupture d’un abcès voisin.</p><p class="lab">Conséquence pratique</p><p>L’abcès primaire d’un patient exposé à l’inhalation se traite par un antibiotique prolongé ; l’abcès secondaire impose de traiter sa cause : tumeur, corps étranger ou endocardite.</p><div class="key"><b>Limite.</b> Une pneumonie nécrosante à micro-cavités multiples n’est pas encore un abcès collecté, mais elle peut y évoluer.</div><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-fistule" data-title="Fistule bronchopleurale"><p class="lab">Définition et signes</p><p>La fistule bronchopleurale, qui complique un abcès rompu, une pneumonie nécrosante ou une chirurgie pulmonaire, fait communiquer une bronche et la plèvre. Le patient expectore brutalement un liquide identique au liquide pleural, le bocal du drain bulle en continu et la radiographie montre un niveau hydroaérique pleural.</p><p class="lab">Conséquence pratique</p><p>Le pus peut inonder l’arbre bronchique : le patient est couché sur le côté atteint. La fibrinolyse intrapleurale est contre-indiquée, car l’enzyme passerait dans les bronches ; un avis chirurgical est nécessaire.</p><div class="key"><b>Piège.</b> Un bullage persistant ne signe pas toujours une fistule : une fuite du système de drainage doit d’abord être exclue.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-rapid" data-title="Score RAPID"><p class="lab">Calcul</p><table class="t"><tr><th>Variable</th><th>0 point</th><th>1 point</th><th>2 points</th></tr><tr><td>Urée sérique</td><td>&lt; 5,0 mmol/L</td><td>5,0 à 8,0 mmol/L</td><td>&gt; 8,0 mmol/L</td></tr><tr><td>Âge</td><td>&lt; 50 ans</td><td>50 à 70 ans</td><td>&gt; 70 ans</td></tr><tr><td>Liquide pleural</td><td>Purulent</td><td>Non purulent</td><td>—</td></tr><tr><td>Origine</td><td>Communautaire</td><td>Nosocomiale</td><td>—</td></tr><tr><td>Albumine sérique</td><td>&gt; 27 g/L</td><td>≤ 27 g/L</td><td>—</td></tr></table><p class="lab">Interprétation</p><p>Dans la validation prospective PILOT (542 patients analysés), la mortalité à trois mois atteignait 2,3 % pour un score de 0 à 2, 9,2 % pour 3 à 4 et 29,3 % pour 5 à 7 ; la statistique C valait 0,78.</p><p class="lab">Usage</p><p>La BTS 2023 recommande de l’envisager pour stratifier le risque et informer le patient. L’ERS/ESTS rappelle qu’il doit encore être éprouvé dans des essais d’intervention avant de guider le traitement.</p><div class="key"><b>Limite.</b> Le liquide non purulent compte un point ; ce paradoxe pourrait refléter un diagnostic tardif ou des comorbidités, sans explication établie.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.13-1558" target="_blank" rel="noopener">Rahman et al., Chest 2014</a> ; <a href="https://doi.org/10.1183/13993003.00130-2020" target="_blank" rel="noopener">PILOT 2020</a>.</p></template>
<template data-pop="j86-ph" data-title="Pourquoi le pH pleural chute"><p class="lab">Mécanisme</p><p>Polynucléaires et bactéries consomment le glucose et produisent lactate et dioxyde de carbone, que la plèvre épaissie retient. Le pH, normalement voisin de 7,60, baisse donc en proportion de l’activité métabolique et de la séquestration du liquide.</p><p class="lab">Conséquence pratique</p><p>Un pH ≤ 7,2 signale une infection active, qui ne se résorbera pas sous antibiotique seul : un drain est indiqué.</p><div class="key"><b>Limite.</b> D’autres épanchements sont acides : polyarthrite rhumatoïde, cancer pleural avancé, rupture œsophagienne, tuberculose.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-pai1" data-title="Fibrinolyse bloquée et cloisons"><p class="lab">Mécanisme</p><p>L’inflammation active la coagulation dans la plèvre et pousse les cellules mésothéliales à produire en excès l’inhibiteur de l’activateur du plasminogène de type 1. La plasmine ne se forme plus ; la fibrine déposée n’est plus dégradée et forme des cloisons.</p><p class="lab">Conséquence clinique et thérapeutique</p><p>Le liquide se divise en logettes qu’un drain unique ne vide pas ; l’échographie montre des septations. L’alteplase intrapleurale apporte un activateur en excès, qui contourne l’inhibition et dissout les cloisons.</p><p class="src">Références : <a href="https://doi.org/10.1183/13993003.01062-2022" target="_blank" rel="noopener">ERS/ESTS 2023</a>.</p></template>
<template data-pop="j86-poumon-trappe" data-title="Poumon trappé et décortication"><p class="lab">Mécanisme</p><p>Les fibroblastes organisent la fibrine en une coque collagène sur la plèvre viscérale. Cette coque rigide résiste à la pression pleurale négative et empêche le poumon de se réexpandre.</p><p class="lab">Conséquence pratique</p><p>Le drainage vide la cavité, mais le poumon ne la comble pas. La décortication retire chirurgicalement la coque ; la BTS en fait une décision individuelle, selon l’état général du patient et le stade de l’empyème.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-necrose" data-title="Nécrose liquéfiante et abcès"><p class="lab">Mécanisme</p><p>Les anaérobies et les enzymes des polynucléaires digèrent le parenchyme et les petits vaisseaux d’un territoire infecté. Le tissu détruit se liquéfie, puis une paroi inflammatoire, enfin fibreuse, enclôt la collection.</p><p class="lab">Évolution</p><p>L’ouverture dans une bronche évacue le pus et laisse entrer l’air : un niveau hydroaérique apparaît. La rupture dans la plèvre produit un pyopneumothorax.</p><p class="lab">Conséquence pratique</p><p>Ce drainage bronchique spontané explique que la plupart des abcès guérissent sans geste invasif, à condition que la bronche ne soit pas obstruée.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-milleri" data-title="Groupe Streptococcus anginosus"><p class="lab">Définition</p><p>Le groupe réunit trois espèces commensales de la bouche et du tube digestif, <i>S. anginosus</i>, <i>S. intermedius</i> et <i>S. constellatus</i>, autrefois appelées « milleri ».</p><p class="lab">Comportement</p><p>Ces streptocoques forment volontiers des abcès, dans le poumon, la plèvre, le cerveau ou le foie, et abondent dans l’empyème communautaire.</p><p class="lab">Conséquence pratique</p><p>Leur isolement fait rechercher d’autres collections, notamment cérébrales en présence de signes neurologiques. Ils restent généralement sensibles aux bêta-lactamines.</p><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a>.</p></template>
<template data-pop="j86-anaerobies" data-title="Les anaérobies de la flore buccale"><p class="lab">Définition</p><p><i>Fusobacterium</i>, <i>Prevotella</i>, <i>Porphyromonas</i> et <i>Peptostreptococcus</i> ne se multiplient qu’en l’absence d’oxygène. Ils abondent dans la plaque dentaire et le sillon gingival, prospèrent dans un tissu nécrosé et produisent les acides gras volatils responsables de l’odeur fétide.</p><p class="lab">Conséquence pratique</p><p>Ils meurent pendant le transport et poussent lentement : la culture les sous-estime, et leur couverture reste donc probabiliste. Certains produisent des bêta-lactamases, d’où l’intérêt d’un inhibiteur associé.</p><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a>.</p></template>
<template data-pop="j86-saureus" data-title="Staphylococcus aureus et suppurations thoraciques"><p class="lab">Rôle</p><p><i>S. aureus</i> cause des pneumonies nécrosantes, souvent après une grippe, et des empyèmes nosocomiaux ou post-traumatiques. Dans la série de Maskell, le staphylocoque résistant à la méticilline représentait 25 % des infections pleurales nosocomiales.</p><p class="lab">Pronostic</p><p>La mortalité des infections pleurales à <i>S. aureus</i> atteignait 44 %, contre 17 % pour les infections streptococciques.</p><p class="lab">Conséquence pratique</p><p>Une infection nosocomiale ou postopératoire impose de couvrir le staphylocoque résistant jusqu’aux résultats microbiologiques ; des hémocultures positives font rechercher une endocardite.</p><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a>.</p></template>
<template data-pop="j86-inhalation" data-title="Inhalation et segments déclives"><p class="lab">Mécanisme</p><p>Un trouble de la conscience (alcool, sédatifs, épilepsie, anesthésie), une dysphagie neurologique ou un reflux affaiblissent la protection des voies aériennes ; la flore oropharyngée descend alors par gravité.</p><p class="lab">Topographie</p><p>Les abcès consécutifs à une inhalation oropharyngée siègent dans les segments postérieurs des poumons ; une inhalation lors de vomissements en décubitus ventral atteint plutôt le lobe moyen.</p><p class="lab">Conséquence pratique</p><p>Un abcès de cette topographie chez un patient à risque concorde avec l’inhalation. La prévention passe par l’évaluation de la déglutition, la réduction des sédatifs et la recherche des facteurs d’aspiration, que recommande la Société suisse d’infectiologie.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, lue le 08.10.2026</a>.</p></template>
<template data-pop="j86-dents" data-title="Hygiène buccodentaire et charge anaérobie"><p class="lab">Mécanisme</p><p>La parodontite et les caries enrichissent la salive en anaérobies : une même quantité de salive inhalée apporte alors davantage de germes.</p><p class="lab">Données et conséquence</p><p>Une mauvaise hygiène dentaire concernait 18 % des patients de la cohorte PILOT. L’examen de la bouche fait donc partie de l’examen clinique, et un assainissement dentaire prévient la récidive.</p><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00130-2020" target="_blank" rel="noopener">PILOT 2020</a>.</p></template>
<template data-pop="j86-alcool" data-title="Alcoolisme et suppurations pulmonaires"><p class="lab">Mécanismes</p><p>L’ivresse abolit les réflexes de protection des voies aériennes et favorise l’inhalation. L’alcoolisme chronique altère la fonction des polynucléaires et des macrophages alvéolaires, et s’associe souvent à une hygiène dentaire médiocre et à une dénutrition.</p><p class="lab">Conséquence pratique</p><p>Premier terrain de l’abcès pulmonaire, l’alcoolisme impose d’accompagner le sevrage pendant l’hospitalisation, en prévenant le syndrome de sevrage et en supplémentant en thiamine.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-fievre-persistante" data-title="Fièvre persistante sous antibiotique"><p class="lab">Raisonnement</p><p>Une fièvre qui persiste au-delà de 48 à 72 heures de traitement adapté fait rechercher une collection, un germe non couvert, une complication extrapulmonaire ou une cause non infectieuse.</p><p class="lab">Mécanisme</p><p>Le pus collecté est acide, peu vascularisé et cloisonné : l’antibiotique y diffuse mal et les bactéries s’y multiplient lentement.</p><p class="lab">Conséquence pratique</p><p>L’échographie thoracique est le premier examen ; changer d’antibiotique sans chercher de collection retarde le drainage. Le raisonnement général sur l’échec thérapeutique figure dans le cours <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>.</p></template>
<template data-pop="j86-expectoration" data-title="Expectoration fétide et vomique"><p class="lab">Signification</p><p>L’odeur fétide trahit les anaérobies, qui produisent des acides gras volatils et des composés soufrés.</p><p class="lab">Vomique</p><p>La vomique est l’expectoration brutale et abondante de pus lorsqu’un abcès ou un empyème s’ouvre dans une bronche. Elle soulage souvent le patient mais peut inonder l’autre poumon.</p><p class="lab">Conséquence pratique</p><p>Elle impose une imagerie à la recherche d’une fistule bronchopleurale ; le patient est couché sur le côté malade.</p></template>
<template data-pop="j86-sepsis" data-title="Sepsis et contrôle de la source"><p class="lab">Définition</p><p>Le sepsis est une dysfonction d’organe menaçant la vie, causée par une réponse dérégulée à l’infection (définition Sepsis-3).</p><p class="lab">Mécanisme</p><p>Une collection pleurale non drainée entretient une charge bactérienne et des médiateurs inflammatoires que l’antibiotique seul ne réduit pas.</p><p class="lab">Conséquence pratique</p><p>Le drainage fait partie du traitement du sepsis au même titre que l’antibiotique et le remplissage ; il est réalisé sans délai. La prise en charge générale est exposée dans le cours <a href="#/entry/A41">A41 — Sepsis et choc septique de l’adulte</a>.</p></template>
<template data-pop="j86-matite" data-title="Signes physiques d’épanchement"><p class="lab">Signes</p><p>La percussion trouve une matité basale ; le murmure vésiculaire est diminué ou aboli aux bases. Un frottement pleural s’entend parfois au stade initial d’un épanchement parapneumonique.</p><p class="lab">Mécanisme</p><p>Le liquide, sans air, ne résonne pas et sépare le poumon de la paroi, ce qui atténue la transmission des bruits respiratoires.</p><p class="lab">Valeur</p><p>L’examen oriente mais ne mesure pas : la radiographie de face ne montre l’épanchement qu’à partir d’environ 200 mL, et l’échographie confirme le liquide et ses cloisons.</p><p class="lab">Piège</p><p>Une matité suspendue, non déclive, suggère une collection cloisonnée ou une condensation ; seule l’imagerie tranche.</p><p class="src">Référence : <a href="https://doi.org/10.3238/arztebl.2019.0377" target="_blank" rel="noopener">Jany et Welte, Dtsch Arztebl Int 2019</a>.</p></template>
<template data-pop="j86-hippocratisme" data-title="Hippocratisme digital"><p class="lab">Définition</p><p>L’hippocratisme bombe la tablette unguéale et efface l’angle normal entre l’ongle et le repli cutané.</p><p class="lab">Valeur</p><p>Il peut apparaître au cours d’un abcès pulmonaire chronique et témoigne alors d’une suppuration prolongée.</p><p class="lab">Conséquence pratique</p><p>Une cavité qui ne guérit pas malgré le traitement impose de rechercher une autre cause, tumeur ou corps étranger, par la bronchoscopie.</p><p class="src">Référence : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-necessitatis" data-title="Empyème de nécessité"><p class="lab">Définition</p><p>L’empyème de nécessité franchit la paroi thoracique jusqu’au tissu sous-cutané et forme une tuméfaction, parfois fistulisée à la peau.</p><p class="lab">Causes et conduite</p><p>Il complique un empyème négligé et se traite par drainage, antibiotique adapté au germe et souvent chirurgie.</p></template>
