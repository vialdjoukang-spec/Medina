<h1>Pleurésies purulentes et abcès du poumon</h1><span class="status">Adulte · infection pleurale et suppuration pulmonaire · rédaction du 08.10.2026 · référentiels BTS 2023 et ERS/ESTS 2023</span></div>

<section class="ilot" id="j86-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 58 ans est traité depuis cinq jours pour une pneumonie communautaire. Or, la fièvre persiste, la douleur thoracique s’accentue et l’épanchement s’étend sur la radiographie. De son côté, une femme de 64 ans, alcoolique et à la dentition délabrée, crache depuis trois semaines des sécrétions fétides ; le scanner révèle une cavité à niveau hydroaérique. <b>Dans les deux cas, chez l’un comme chez l’autre, du pus s’est collecté dans un espace que l’antibiotique atteint mal.</b> L’infection ne guérit donc qu’à deux conditions : un antibiotique adapté et, pour la plèvre, l’évacuation du liquide infecté.</p><p>Ainsi, le médecin doit reconnaître le passage d’un épanchement parapneumonique simple à l’empyème, interpréter la ponction, poser l’indication du drain, de la fibrinolyse intrapleurale ou de la chirurgie, et distinguer l’abcès d’un empyème enkysté, d’un cancer excavé ou d’une tuberculose.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="j86-continuum">Le continuum pleural (de l’épanchement simple à l’empyème)</button> ; <button class="w" data-k="j86-abces-def">l’abcès pulmonaire (formes primaire et secondaire)</button>. La pneumonie elle-même relève du cours <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a> ; le sepsis, du cours <a href="#/entry/A41">A41 — Sepsis et choc septique de l’adulte</a>.</div></section>
<section class="ilot" id="j86-1"><h2><span class="n">1</span>Définitions et classifications</h2><p>Une pneumonie accroît la perméabilité capillaire et produit un <b>épanchement parapneumonique</b>. Il reste <b>simple</b> tant qu’il est stérile et que son pH demeure élevé : l’antibiotique seul le guérit. Il devient <b>compliqué</b> lorsque les bactéries envahissent l’espace pleural ; le pH chute, la fibrine cloisonne la cavité et le liquide ne se résorbe plus. Enfin, l’<b>empyème</b> désigne la présence de pus franc, ou de germes à la coloration de Gram ou en culture.</p><p>L’<b>abcès pulmonaire</b> est une cavité de plus de 2 cm creusée dans le parenchyme par une nécrose liquéfiante d’origine infectieuse ; il est aigu avant six semaines, chronique au-delà. Plus grave encore, la <b>gangrène pulmonaire</b> est une nécrose étendue et mal limitée, souvent associée à une thrombose vasculaire. Par ailleurs, l’abcès du médiastin collecte le pus entre les deux plèvres médiastinales.</p><p>Le pyothorax peut communiquer avec la bronche, par une <button class="w" data-k="j86-fistule">fistule bronchopleurale (bullage persistant et vomique)</button>, avec l’œsophage ou avec la paroi. Ainsi, une fistule bronchopleurale entretient l’infection et contre-indique la fibrinolyse intrapleurale. L’abcès du médiastin naît d’une infection cervicale descendante, d’une perforation de l’œsophage ou d’une sternotomie ; l’empyème tuberculeux relève du traitement de la tuberculose.</p><div class="key"><b>À retenir.</b> Trois mots structurent la plèvre infectée : simple, compliqué, empyème. L’aspect et le pH du liquide les séparent, et chacun appelle une conduite distincte.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">Roberts et al., BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., abcès pulmonaire, 2015</a> ; <a href="https://doi.org/10.21037/med-24-29" target="_blank" rel="noopener">Chaulk et al., médiastinite nécrosante descendante, 2025</a>.</p></section>
<section class="ilot" id="j86-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>L’infection pleurale demeure grave malgré les antibiotiques. Ainsi, dans la cohorte prospective internationale PILOT, la mortalité des 542 adultes analysés atteignait 10 % à trois mois et 19 % à douze mois. De plus, plus de 30 % des adultes atteints meurent ou doivent être opérés. Par ailleurs, la déclaration ERS/ESTS de 2023 décrit une incidence en hausse en Europe. En revanche, aucune donnée d’incidence propre à la Suisse n’a été identifiée.</p><p>Le terrain pèse davantage que le germe. Ainsi, l’âge, une urée élevée, une albumine basse, une origine nosocomiale et, paradoxalement, un liquide non purulent prédisent le décès ; ces cinq variables composent le <button class="w" data-k="j86-rapid">score RAPID (calcul, seuils et limites)</button>. De même, dans la série bactériologique de Maskell, l’infection nosocomiale tuait 47 % des patients, contre 17 % pour l’infection communautaire.</p><p>L’abcès pulmonaire s’est raréfié depuis l’ère antibiotique. Ainsi, sa mortalité, proche de 75 % il y a un siècle, varie aujourd’hui de 2 à 38 % selon les séries ; les décès frappent surtout les patients âgés, immunodéprimés ou porteurs d’une obstruction bronchique.</p><div class="key"><b>À retenir.</b> Un patient sur dix meurt dans les trois mois qui suivent une infection pleurale. Le terrain, que mesure le score RAPID, explique une large part de ce risque.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00130-2020" target="_blank" rel="noopener">Corcoran et al., étude PILOT, Eur Respir J 2020</a> ; <a href="https://doi.org/10.1183/13993003.01062-2022" target="_blank" rel="noopener">Bedawi et al., déclaration ERS/ESTS, 2023</a> ; <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., bactériologie pleurale, 2006</a> ; <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></section>
<section class="ilot" id="j86-3"><h2><span class="n">3</span>Du liquide réactionnel au pus organisé</h2><p>Le liquide pleural normal, filtré par les capillaires de la plèvre pariétale et réabsorbé par ses lymphatiques, a un pH voisin de 7,60 et un glucose égal à celui du plasma. Or, l’inflammation d’un poumon voisin rompt cet équilibre en trois phases successives.</p><p><b>Phase exsudative.</b> D’abord, les cytokines de la pneumonie rendent la plèvre viscérale perméable. Dès lors, un liquide clair, stérile et riche en protéines s’accumule plus vite que les lymphatiques ne l’évacuent. Ainsi, le pH et le glucose restent normaux : l’antibiotique suffit.</p><p><b>Phase fibrinopurulente.</b> Ensuite, les bactéries franchissent la plèvre. Ainsi, polynucléaires et germes consomment le glucose par glycolyse et rejettent lactate et dioxyde de carbone : <button class="w" data-k="j86-ph">le pH chute sous 7,2 (mécanisme de l’acidose pleurale)</button>. Simultanément, <button class="w" data-k="j86-pai1">la fibrinolyse se bloque et la fibrine cloisonne la cavité (rôle de l’inhibiteur de l’activateur du plasminogène)</button>. Par conséquent, les logettes isolent le pus, si bien qu’un drain unique n’en vide qu’une partie.</p><p><b>Phase organisée.</b> Enfin, les fibroblastes transforment la fibrine en une coque collagène qui enserre le poumon et l’empêche de se réexpandre : c’est le <button class="w" data-k="j86-poumon-trappe">poumon trappé (pourquoi seule la décortication le libère)</button>. Or, les antibiotiques diffusent mal dans ce tissu peu vascularisé.</p><p>L’abcès pulmonaire obéit à une autre logique. En effet, des anaérobies inhalés colonisent un territoire mal ventilé ; leurs enzymes et la réaction inflammatoire détruisent le parenchyme par <button class="w" data-k="j86-necrose">nécrose liquéfiante (de la pneumonie nécrosante à la cavité)</button>. Lorsque la collection s’ouvre dans une bronche, le pus est expectoré et l’air le remplace : le niveau hydroaérique apparaît.</p><div class="key"><b>Conséquence thérapeutique.</b> Le pH bas signe une infection pleurale installée ; les cloisons expliquent l’échec d’un drainage simple ; la coque explique l’échec d’un traitement médical tardif. Chaque phase appelle donc un geste différent.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/13993003.01062-2022" target="_blank" rel="noopener">ERS/ESTS 2023</a>.</p></section>
<section class="ilot" id="j86-4"><h2><span class="n">4</span>Agents et facteurs de risque</h2><p>La bactériologie pleurale diffère de celle de la pneumonie : le pneumocoque cède la place aux streptocoques commensaux de la bouche et aux anaérobies. Ainsi, le lieu d’acquisition fixe l’antibiothérapie probabiliste, d’où la structure du tableau.</p><table class="t"><tr><th>Contexte</th><th>Agents dominants</th><th>Conséquence</th></tr><tr><td>Infection communautaire</td><td>Environ 50 % de streptocoques, dont le <button class="w" data-k="j86-milleri">groupe <i>Streptococcus anginosus</i> (ancien « milleri »)</button> et le pneumocoque ; environ 20 % d’<button class="w" data-k="j86-anaerobies">anaérobies (flore buccale)</button>.</td><td>Couvrir streptocoques et anaérobies d’emblée.</td></tr><tr><td>Infection nosocomiale</td><td>Environ 60 % de bactéries souvent résistantes : <button class="w" data-k="j86-saureus"><i>Staphylococcus aureus</i> résistant à la méticilline</button> 25 %, entérobactéries 18 %, entérocoques 12 %, <i>Pseudomonas</i> 5 %.</td><td>Élargir selon l’écologie locale.</td></tr><tr><td>Abcès pulmonaire</td><td>Flore polymicrobienne dans plus de 90 % des cas : <i>Fusobacterium</i>, <i>Prevotella</i>, <i>Peptostreptococcus</i>, streptocoques ; parfois <i>S. aureus</i> ou <i>Klebsiella pneumoniae</i>.</td><td>Couvrir les anaérobies ; rechercher une cause bronchique.</td></tr></table><p>Un empyème survenu après une chirurgie thoracique ne se traite donc pas comme un empyème communautaire. À cet égard, l’erreur fréquente consiste à prescrire un traitement de pneumonie sans couverture anaérobie : une culture pleurale négative ne prouve pas leur absence.</p><p>Trois terrains dominent. <button class="w" data-k="j86-inhalation">D’abord, l’inhalation (trouble de conscience, dysphagie, reflux)</button> amène la flore oropharyngée dans les segments déclives. <button class="w" data-k="j86-dents">Ensuite, une mauvaise hygiène buccodentaire (charge anaérobie)</button> enrichit cette flore ; elle concernait 18 % des patients de PILOT. <button class="w" data-k="j86-alcool">Enfin, l’alcoolisme (inhalation et immunité)</button> cumule les deux mécanismes et reste le premier terrain de l’abcès. Par ailleurs, le diabète, l’immunodépression, la toxicomanie intraveineuse et une obstruction bronchique tumorale complètent la liste.</p><div class="key"><b>À retenir.</b> Le pus thoracique naît souvent de la bouche. Le lieu d’acquisition dicte l’antibiotique ; la recherche d’une porte d’entrée, dentaire ou bronchique, prévient la récidive.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a> ; <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a> ; <a href="https://doi.org/10.1183/13993003.00130-2020" target="_blank" rel="noopener">PILOT 2020</a>.</p></section>
<section class="ilot" id="j86-5"><h2><span class="n">5</span>Anamnèse</h2><p>Le symptôme le plus évocateur d’infection pleurale est une <button class="w" data-k="j86-fievre-persistante">fièvre qui persiste ou réapparaît sous antibiotique (pourquoi l’antibiotique échoue)</button>. Or, une pneumonie bien traitée se stabilise habituellement en 72 heures ; à défaut, la Société suisse d’infectiologie demande de rechercher un épanchement compliqué, un empyème ou un autre foyer, par l’imagerie. De plus, la douleur pleurale, latérale et exacerbée par l’inspiration, traduit l’irritation de la plèvre pariétale, seule innervée.</p><p>L’empyème à anaérobies évolue souvent à bas bruit pendant des semaines : amaigrissement, sueurs nocturnes et anémie, sans grande fièvre, miment alors un cancer ou une tuberculose. De son côté, l’abcès pulmonaire se signale par une <button class="w" data-k="j86-expectoration">expectoration abondante et fétide, parfois une vomique (signification de l’odeur)</button>. Enfin, une hémoptysie oriente vers un abcès, un cancer ou une tuberculose plutôt que vers un empyème isolé.</p><p>L’interrogatoire recherche enfin la porte d’entrée et le terrain : perte de conscience, alcoolisation, troubles de la déglutition, soins dentaires négligés, chirurgie thoracique ou œsophagienne récente, traumatisme, exposition tuberculeuse.</p><div class="two"><div class="card"><b>Forme typique.</b> Le patient est traité depuis quelques jours pour une pneumonie ; la fièvre persiste, la douleur latéralisée s’accentue et un épanchement apparaît ou grossit.</div><div class="card"><b>Formes atypiques.</b> Un sujet âgé devient confus sans fièvre ; un empyème chronique fait maigrir ; un empyème suit une chirurgie ou une ponction ; une tuméfaction de la paroi thoracique draine le pus vers la peau.</div></div><div class="key"><b>À retenir.</b> La chronologie fournit l’argument principal : une infection pulmonaire qui ne guérit pas cache souvent une collection.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, Pneumonie acquise en communauté, lue le 08.10.2026</a> ; <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></section>
<section class="ilot" id="j86-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen mesure d’abord la gravité : température, fréquence respiratoire, saturation, pression artérielle et état de conscience. Ainsi, un <button class="w" data-k="j86-sepsis">sepsis (dysfonction d’organe et urgence du drainage)</button> fait du drainage un geste urgent. L’état nutritionnel compte aussi, car l’amaigrissement et l’hypoalbuminémie aggravent le pronostic.</p><div class="two"><div class="card"><b>Signes d’épanchement.</b> <button class="w" data-k="j86-matite">Matité basale et murmure vésiculaire diminué ou aboli (physique de l’épanchement)</button>. Un frottement pleural s’entend parfois au stade initial d’un épanchement parapneumonique. Ces signes ne disent rien du cloisonnement.</div><div class="card"><b>Signes de suppuration chronique.</b> Haleine fétide, caries ou parodontite, <button class="w" data-k="j86-hippocratisme">hippocratisme digital (suppuration prolongée)</button> et amaigrissement l’accompagnent. Une tuméfaction fluctuante de la paroi évoque un empyème de nécessité.</div></div><p>Dans l’abcès, l’examen pulmonaire est peu spécifique : l’imagerie fait le diagnostic. En revanche, une aggravation brutale de la dyspnée chez un patient porteur d’un abcès fait craindre une rupture dans la plèvre, donc un pyopneumothorax. Enfin, l’examen de la bouche et du cou n’est jamais omis, car il révèle une porte d’entrée dentaire ou une infection cervicale descendante.</p><div class="key"><b>À retenir.</b> La clinique repère l’épanchement et la gravité, mais ne distingue pas un liquide simple d’un liquide infecté : seules l’échographie et la ponction tranchent.</div><button class="pareto-btn ui" data-k="pareto-j86-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
