<template data-pop="e07-nosologie" data-title="Catégorie E07 : libellés, inclusions et exclusions">
<div class="lab">Définition</div><p>La catégorie E07 de la classification statistique suisse CIM-10-GM 2024 s’intitule « Autres affections de la thyroïde ». Ses quatre sous-codes sont E07.0 (hypersécrétion de calcitonine), E07.1 (goitre dû à un trouble de l’hormonosynthèse), E07.8 (autres affections précisées) et E07.9 (sans précision).</p>
<div class="lab">Contenu</div><p>Les notes de la version 2019 de l’Organisation mondiale de la santé précisent : E07.0 inclut l’hyperplasie des cellules C et l’hypersécrétion de thyrocalcitonine ; E07.1 inclut le goitre dyshormonogénétique familial et le syndrome de Pendred, et exclut le goitre congénital transitoire à fonction normale (P72.0) ; E07.8 inclut l’anomalie de la globuline liant la thyroxine, l’hémorragie, l’infarctus et le syndrome de basse triiodothyronine (maladie non thyroïdienne) ; E07.9 n’a pas de note.</p>
<div class="lab">Application</div><p>Un patient dont la calcitonine est élevée sans diagnostic établi ne relève pas encore de E07.0 : le code désigne l’hypersécrétion ou l’hyperplasie constatée. Le cancer médullaire est codé en C73, la dysgénésie thyroïdienne en E03.1.</p>
<div class="lab">Limite</div><p>L’office suisse publie les libellés sans notes d’inclusion ; les notes proviennent de la version de l’Organisation mondiale de la santé, qui n’est pas la modification allemande utilisée en Suisse.</p>
<p class="src">Source : Office fédéral de la statistique, CIM-10-GM 2024 ; Organisation mondiale de la santé, CIM-10 version 2019, E07.</p></template>

<template data-pop="e07-calcitonine-phys" data-title="Calcitonine : précurseurs, rôle et valeurs normales">
<div class="lab">Définition</div><p>La calcitonine est un peptide de 32 acides aminés produit par les cellules C (parafolliculaires) de la thyroïde. Elle provient de la procalcitonine (116 acides aminés), elle-même issue d’une pré-prohormone de 141 acides aminés.</p>
<div class="lab">Rôle</div><p>Le rôle proposé est l’homéostasie calcique, par inhibition des ostéoclastes et de la réabsorption rénale du calcium. Après thyroïdectomie totale, l’absence de calcitonine n’entraîne pas de trouble calcique net, ce qui suggère une redondance : le dosage vaut surtout comme marqueur des cellules C.</p>
<div class="lab">Valeurs normales</div><p>Valeur basale typiquement inférieure à 10 pg/ml chez le sujet sain ; l’homme a des valeurs plus élevées que la femme ; l’enfant a des valeurs plus élevées qui baissent vers l’adolescence. Tous les seuils dépendent de la méthode de dosage.</p>
<div class="lab">Limite</div><p>Revue narrative ; les seuils ne se transposent pas d’un laboratoire à l’autre.</p>
<p class="src">Source : Giovanella et al., J Mol Endocrinol 2026;76(2).</p></template>

<template data-pop="e07-hcc" data-title="Hyperplasie des cellules C : physiologique et néoplasique">
<div class="lab">Définition</div><p>L’hyperplasie des cellules C désigne une augmentation du nombre de cellules productrices de calcitonine. Deux entités sont distinguées.</p>
<div class="lab">Hyperplasie physiologique ou réactive</div><p>Elle accompagne les affections thyroïdiennes inflammatoires, métaboliques et néoplasiques, et l’hypercalcémie. Elle est rarement reconnue avant l’opération. Son diagnostic repose sur l’immunohistochimie et l’analyse quantitative. Son potentiel de progression vers le cancer médullaire est incomplètement connu.</p>
<div class="lab">Hyperplasie néoplasique</div><p>Appelée carcinome médullaire in situ, elle est associée aux néoplasies endocriniennes multiples de type 2 et au cancer médullaire familial. Les cellules sont reconnaissables en coloration conventionnelle ; leur nombre n’est pas déterminant. Elle est dépistable avant tout symptôme par la recherche de la mutation germinale du gène RET.</p>
<div class="lab">Application</div><p>Dans les néoplasies endocriniennes multiples de type 2, le cancer médullaire est habituellement bilatéral et multicentrique, très fréquemment associé à une hyperplasie qui le précède : c’est le fondement du dépistage précoce. Dans le cancer sporadique, l’hyperplasie est habituellement absente ou focale. Elle peut aussi accompagner la thyroïdite auto-immune et le petit carcinome papillaire.</p>
<div class="lab">Limite</div><p>Les définitions anatomopathologiques viennent de résumés d’auteurs américains et allemands ; elles décrivent des faits, non une conduite.</p>
<p class="src">Source : Albores et Krueger 2001 (Endocr Pathol) ; Sheu, Görges et Schmid 2003 ; Elisei et al. 2012 ; Giovanella et al. 2026 ; Fugazzola et al. 2020.</p></template>

<template data-pop="e07-ct-causes" data-title="Causes non médullaires d’hypercalcitoninémie">
<div class="lab">Contenu</div><p>Tabagisme (10 à 15 pg/ml, surtout chez l’homme) ; goitre (10 à 20) ; thyroïdite auto-immune (10 à 15, liée au volume plus qu’à l’auto-immunité) ; inhibiteurs de la pompe à protons et hypergastrinémie (10 à 20) ; gastrite auto-immune, anémie de Biermer (15 à 40) ; insuffisance rénale chronique légère à modérée (10 à 20), avancée (20 à 50, rarement plus de 100) ; hyperplasie des cellules C sporadique (20 à 50), sévère (50 à 100, rare hors néoplasie endocrinienne multiple) ; hypercalcémie non médullaire (10 à 20) ; sepsis ou inflammation aiguë (10 à 40, transitoire) ; carcinome thyroïdien différencié (10 à 20) ; carcinome pulmonaire à petites cellules (100 à 1000 et plus) ; tumeur neuroendocrine du pancréas (20 à 300) ; carcinome neuroendocrine de la prostate (50 à 300).</p>
<div class="lab">Application</div><p>Devant 40 pg/ml, on liste d’abord les causes de cette fourchette (tabac, inhibiteur de la pompe à protons, gastrite, insuffisance rénale, hyperplasie) avant de conclure à un cancer médullaire.</p>
<div class="lab">Limite</div><p>Valeurs typiques d’une revue narrative, avec chevauchements.</p>
<p class="src">Source : Giovanella et al., J Mol Endocrinol 2026, tableau 2.</p></template>

<template data-pop="e07-ct-interference" data-title="Calcitonine : interférences et conditions de prélèvement">
<div class="lab">Interférences analytiques</div><p>Les anticorps hétérophiles, les anticorps humains anti-souris et le facteur rhumatoïde peuvent donner des faux positifs ou négatifs : le dosage se refait avec une autre méthode. La macrocalcitonine donne un faux positif ; la précipitation au polyéthylèneglycol le démasque. L’effet crochet donne un faux négatif aux très hautes valeurs : une dilution l’exclut. L’interférence biotine-streptavidine est aussi décrite.</p>
<div class="lab">Pré-analytique</div><p>Sérum ou plasma sur anticoagulant validé, avec la même matrice au suivi. Centrifugation et séparation en 1 à 2 heures. Conservation à 2-8 °C à court terme, congélation à −20 °C ou moins (idéalement −70 à −80 °C), cycles de gel-dégel évités : les protéases sériques dégradent la calcitonine.</p>
<div class="lab">Application</div><p>Les mesures sériées utilisent le même laboratoire et la même méthode, ce que souligne aussi la recommandation européenne de 2012.</p>
<p class="src">Source : Giovanella et al. 2026 ; Elisei et al. 2012.</p></template>

<template data-pop="e07-ct-seuils" data-title="Calcitonine : seuils d’interprétation">
<div class="lab">Zone grise</div><p>10 à 100 pg/ml, souvent due à une hyperplasie des cellules C ; au-delà de 100 pg/ml, un cancer médullaire est évocateur.</p>
<div class="lab">Seuils d’action</div><p>Recommandation européenne 2023 sur les nodules : calcitonine basale supérieure à 30 pg/ml chez la femme et à 34 pg/ml chez l’homme, avec la réserve que plusieurs variables influencent le seuil ; ces valeurs viennent de l’étude italienne de Fugazzola (135 cas, 47 cancers médullaires). Recommandations allemandes citées par la revue de 2026 : environ 30 pg/ml chez la femme et 60 pg/ml chez l’homme.</p>
<div class="lab">Conduite sous le seuil</div><p>Mesure répétée tous les 3 à 6 mois ; chirurgie déclenchée par une ascension nette.</p>
<div class="lab">Arbitrage de source</div><p>Pour un désaccord, la source primaire applicable la plus récente l’emporte, avec accès au texte en vigueur ; ici la recommandation européenne de 2023 est la référence des seuils d’action, la recommandation allemande n’étant citée que par une revue.</p>
<p class="src">Source : Durante, Hegedüs et al., ETA 2023 ; Fugazzola et al. 2020 ; Giovanella et al. 2026.</p></template>

<template data-pop="e07-test-calcium" data-title="Test de stimulation par le calcium">
<div class="lab">Principe</div><p>La pentagastrine n’est plus disponible ; la perfusion de calcium stimule la sécrétion de calcitonine, et la réponse distingue le cancer médullaire d’une hyperplasie.</p>
<div class="lab">Protocole de l’étude</div><p>Gluconate de calcium par voie intraveineuse, 25 mg/kg de poids ajusté, soit 2,3 mg/kg de calcium élément, à 5 ml/min pendant au moins 3 minutes ; calcitonine basale avant la perfusion.</p>
<div class="lab">Seuils et rendement</div><p>Calcitonine stimulée supérieure à 79 pg/ml chez la femme et à 466 pg/ml chez l’homme. La combinaison de la calcitonine basale et stimulée a identifié tous les cancers médullaires de la série.</p>
<div class="lab">Tolérance</div><p>Sensation de chaleur dans 57 % des cas ; bradycardie sinusale réversible ; aucun effet indésirable notable même chez les hypertendus (20 % de la cohorte).</p>
<div class="lab">Usages restants</div><p>Distinguer le cancer médullaire d’une sécrétion ectopique (réponse émoussée ou absente), insuffisance rénale avancée, stratification des porteurs de RET.</p>
<div class="lab">Limite</div><p>Série chirurgicale italienne ; incohérence entre 9 % et 25,4 % pour la bradycardie ; information professionnelle suisse du gluconate de calcium non lue pour cette indication.</p>
<p class="src">Source : Fugazzola et al., J Endocrinol Invest 2020;44:587-597 ; Giovanella et al. 2026.</p></template>

<template data-pop="e07-pct" data-title="Procalcitonine dans le cancer médullaire">
<div class="lab">Valeurs</div><p>Normale en dessous de 0,05 ng/ml. En l’absence d’infection, une valeur supérieure à 0,1 à 0,2 ng/ml évoque un cancer médullaire ; une procalcitonine indétectable a une forte valeur prédictive négative. Demi-vie de 20 à 24 heures ; peu de variation avec l’âge et le sexe. Usage hors autorisation pour la thyroïde.</p>
<div class="lab">Preuves</div><p>Méta-analyse de 11 études (5817 patients, 335 cancers médullaires) : sensibilité 0,90 (intervalle de confiance à 95 % de 0,71 à 0,97), spécificité 1,00 (0,85 à 1,00). Étude prospective néerlandaise avec cohorte de validation suisse (Lugano et Zurich) : pour une calcitonine de 10 à 100 pg/ml, la combinaison calcitonine et procalcitonine atteint une sensibilité de 100 % et une spécificité de 99,7 %.</p>
<div class="lab">Limite</div><p>Études de cancers connus, résumés seuls pour deux sources ; la procalcitonine s’élève dans l’infection, ce qui impose une interprétation hors infection.</p>
<p class="src">Source : Giovanella et al. 2026 ; Giovanella et al., J Clin Endocrinol Metab 2021;106:3634 ; Schonebaum et al., Thyroid 2025;35:1030.</p></template>

<template data-pop="e07-ace-cytologie" data-title="Antigène carcinoembryonnaire et cytoponction dans le cancer médullaire">
<div class="lab">Antigène carcinoembryonnaire</div><p>Non spécifique au diagnostic ; utile au pronostic et au suivi. Seuil courant de 5 ng/ml, jusqu’à 10 ng/ml chez le fumeur.</p>
<div class="lab">Cytoponction</div><p>Dans une série de 104 cancers médullaires sporadiques (Pise), la cytoponction n’était diagnostique que dans 45,9 % des cas, alors que la calcitonine préopératoire évoquait le cancer dans toutes les catégories échographiques. La recommandation européenne de 2023 juge utile le dosage de la calcitonine dans le liquide de lavage de ponction en cas de suspicion cytologique avec calcitonine sérique normale, ou de calcitonine sérique élevée.</p>
<div class="lab">Limite</div><p>Population déjà diagnostiquée, donc biais de sélection ; résumé seul.</p>
<p class="src">Source : Matrone, Elisei et al., J Endocrinol Invest 2026;49:1501 ; Durante, Hegedüs et al. 2023 ; Giovanella et al. 2026.</p></template>

<template data-pop="e07-cochrane" data-title="Dosage systématique de la calcitonine : preuves Cochrane">
<div class="lab">Étude</div><p>Revue Cochrane de 2020 : 16 études, environ 72 400 personnes, 187 cancers médullaires, prévalence d’environ 0,23 à 0,32 %.</p>
<div class="lab">Résultats</div><p>Au seuil de 10 pg/ml : sensibilité groupée 100 %, spécificité 97,2 %, valeur prédictive positive 7,7 %. Environ 280 faux positifs pour 10 000 personnes testées.</p>
<div class="lab">Interprétation</div><p>Quand la maladie est rare, même un test très spécifique produit surtout des faux positifs : sur 100 calcitonines élevées, environ 8 correspondent à un cancer. Les preuves sont jugées insuffisantes pour un dosage systématique, avec un risque de biais élevé.</p>
<div class="lab">Limite</div><p>Discordance d’effectif dans la publication (72 638 contre 72 368).</p>
<p class="src">Source : Cochrane 2020, recherche jusqu’en juin 2018 ; Durante, Hegedüs et al. 2023.</p></template>

<template data-pop="e07-ret" data-title="Mutation RET et néoplasie endocrinienne multiple de type 2">
<div class="lab">Contenu</div><p>Environ 25 % des cancers médullaires sont héréditaires (transmission autosomique dominante) ; 7 à 10 % des cancers apparemment sporadiques le sont. Tout patient avec un cancer médullaire doit avoir une recherche de mutation germinale du gène RET.</p>
<div class="lab">Conduite chez le porteur</div><p>Calcitonine basale élevée : thyroïdectomie totale sans délai. Calcitonine basale normale avec risque intermédiaire à élevé : test de stimulation, à répéter à 12 à 18 mois s’il reste normal. Néoplasie endocrinienne multiple de type 2B (mutation M918T) : thyroïdectomie dès que possible.</p>
<div class="lab">Phéochromocytome</div><p>Dépistage dès 8 ans (type 2B, exons 10 et 11) ou 20 ans (autres codons), tous les 12 à 18 mois ; pénétrance d’environ 50 % pour le codon 634. Doser les métanéphrines avant toute chirurgie si le statut RET est inconnu.</p>
<div class="lab">Limite</div><p>Recommandation de 2012 ; la correspondance entre codons et niveaux de risque (figure) n’a pas été lue.</p>
<p class="src">Source : Elisei et al., Eur Thyroid J 2012;1:216-31.</p></template>

<template data-pop="e07-hc" data-title="Hypothyroïdie congénitale : épidémiologie et causes">
<div class="lab">Fréquence</div><p>L’hypothyroïdie congénitale primaire touche environ 1/3000 à 1/2000 nouveau-nés ; la forme centrale jusqu’à environ 1/16 000.</p>
<div class="lab">Causes</div><p>La dysgénésie (athyréose, ectopie, hypoplasie) représente environ 65 % des formes primaires permanentes. Les 35 % restants ont une glande en place ; moins de la moitié relèvent d’un défaut héréditaire de synthèse, la dyshormonogenèse. La transmission est généralement autosomique récessive, avec un risque de récurrence familiale de 25 % ; DUOX1, DUOX2 et IYD peuvent être dominants ou à pénétrance incomplète.</p>
<div class="lab">Mécanisme commun</div><p>Le défaut de synthèse abaisse la thyroxine et la triiodothyronine ; la thyréostimuline s’élève et stimule la croissance de la glande, d’où le goitre.</p>
<p class="src">Source : van Trotsenburg et al., Thyroid 2021;31:387-419 (consensus ENDO-ERN, ESPE, ESE).</p></template>

<template data-pop="e07-genes" data-title="Gènes de l’hormonosynthèse et phénotypes">
<div class="lab">Contenu</div><p>SLC5A5 (NIS) : captation basolatérale de l’iodure, captation nulle ou faible, goitre. SLC26A4 (pendrine) : efflux apical de l’iodure, défaut partiel d’organification, hypothyroïdie légère à modérée, thyroglobuline élevée, syndrome de Pendred avec surdité. TPO : organification et couplage, défaut complet, hypothyroïdie sévère, goitre. TG : précurseur thyroglobuline, captation élevée, goitre congénital ou à croissance rapide, thyroglobuline basse. DUOX2 et DUOX1 : production de peroxyde d’hydrogène, hypothyroïdie transitoire ou permanente. DUOXA2 : chaperon de DUOX2. IYD : recyclage de l’iode, captation préservée, test au perchlorate négatif, thyroglobuline élevée. SLC26A7 : transporteur d’anions, goitre, audition normale.</p>
<div class="lab">Limite</div><p>Des mutations de TPO, SLC26A4 et DUOX2 ont aussi été trouvées dans des hypothyroïdies congénitales sans goitre avec hypoplasie ; une oligogénicité est décrite.</p>
<p class="src">Source : consensus ENDO-ERN 2020-2021, tableau 3.</p></template>

<template data-pop="e07-perchlorate" data-title="Test au perchlorate et thyroglobuline">
<div class="lab">Principe</div><p>Le test mesure la décharge d’iode 123 après administration de perchlorate. Il est positif si plus de 10 % de l’iode 123 est déchargé, ce qui indique un défaut d’organification.</p>
<div class="lab">Orientation du gène</div><p>La combinaison du test et de la thyroglobuline sérique oriente le gène : thyroglobuline basse, gène TG ; thyroglobuline haute, gènes TPO, DUOX2, SLC26A4 ou IYD.</p>
<div class="lab">Application</div><p>Le test est négatif dans le défaut de recyclage par IYD : l’iode est organifié mais mal recyclé.</p>
<p class="src">Source : consensus ENDO-ERN 2020-2021.</p></template>

<template data-pop="e07-depistage" data-title="Dépistage néonatal en Suisse et recommandation ENDO-ERN">
<div class="lab">Recommandation ENDO-ERN</div><p>La thyréostimuline est le test le plus sensible pour l’hypothyroïdie congénitale primaire (grade 1). La thyroxine y est ajoutée si possible pour la forme centrale (grade 2). Un deuxième prélèvement à 10 à 14 jours est conseillé chez les nouveau-nés à risque, dont les prématurés.</p>
<div class="lab">Suisse</div><p>Le prélèvement sur buvard est fait au quatrième jour de vie. Le laboratoire national est à Zurich (Kinderspital) ; environ 80 000 à 85 000 échantillons sont analysés chaque année ; 11 maladies hormonales et métaboliques sont dépistées.</p>
<div class="lab">Limite</div><p>Le seuil de thyréostimuline du dépistage suisse et la liste des onze maladies n’ont pas été lus. Un dépistage fondé sur la thyroxine peut être trompé par un déficit en globuline liante.</p>
<p class="src">Source : van Trotsenburg et al. 2021 ; dépistage néonatal suisse du Kinderspital Zürich ; Hengeveld et al., Horm Res Paediatr 2021.</p></template>

<template data-pop="e07-imagerie-hc" data-title="Imagerie de l’hypothyroïdie congénitale">
<div class="lab">Règle</div><p>Débuter le traitement avant l’imagerie. La scintigraphie, avec ou sans test au perchlorate, l’échographie, ou les deux, précisent la cause.</p>
<div class="lab">Piège</div><p>La scintigraphie peut être faussement négative si elle est réalisée plus de 5 à 7 jours après le début de la lévothyroxine.</p>
<div class="lab">Application</div><p>Un nouveau-né à thyroxine libre basse et thyréostimuline nettement élevée est traité le jour de la confirmation ; l’imagerie vient après.</p>
<p class="src">Source : consensus ENDO-ERN 2020-2021.</p></template>
