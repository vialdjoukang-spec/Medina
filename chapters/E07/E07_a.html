<section class="ilot" id="e07-0"><h2><span class="n">0</span>Question clinique</h2>
<p>La catégorie E07 réunit des situations qui n’ont en commun qu’une chose : un <b>résultat biologique ou morphologique thyroïdien qui ne correspond pas à la clinique attendue</b>. Quatre scénarios, tous <b>fictifs</b> dans cette leçon, ouvrent le cours et guident chaque partie.</p>
<ol><li><b>Un nodule et une calcitonine élevée.</b> Une femme de 52 ans consulte pour un nodule thyroïdien découvert à l’échographie ; la calcitonine basale est à 40 pg/ml. S’agit-il d’une hyperplasie bénigne des cellules C ou d’un cancer médullaire débutant ?</li><li><b>Un goitre chez un nouveau-né.</b> Un nourrisson au quatrième jour de vie a un dépistage néonatal anormal ; l’échographie montre une glande en place, augmentée de volume. Sa famille compte un cousin sourd. Quelle est la cause, et que faut-il prescrire avant toute imagerie ?</li><li><b>Une thyroxine totale basse chez un sujet en bonne santé.</b> Un homme de 30 ans a une thyroxine totale basse, mais une thyroxine libre et une thyréostimuline normales. Faut-il traiter ?</li><li><b>Un patient de soins intensifs.</b> Après une chirurgie abdominale compliquée de sepsis, un patient a une triiodothyronine basse, une thyroxine basse et une thyréostimuline normale. S’agit-il d’une hypothyroïdie ?</li></ol>
<p>Dans les quatre cas, la réponse exige de comprendre comment la glande synthétise ses hormones, comment le sang les transporte et comment la biologie les mesure. L’erreur la plus coûteuse est identique partout : prendre un chiffre isolé pour une maladie, puis traiter ou opérer sur cette seule base. La leçon enseigne donc, pour chaque situation, le mécanisme, la conduite et la mise en garde propre à la source qui la fonde.</p>
<div class="key"><b>À retenir.</b> E07 est un code résiduel : on ne le traite pas comme une maladie unique, mais comme quatre questions de laboratoire (hypercalcitoninémie, défaut de synthèse, protéine de transport, maladie non thyroïdienne). Chacune a sa règle de décision, et trois d’entre elles se résument à « ne pas traiter à tort ».</div>
</section>

<section class="ilot" id="e07-1"><h2><span class="n">1</span>Définition, classification et périmètre</h2>
<p>La classification statistique suisse CIM-10-GM 2024, publiée par l’Office fédéral de la statistique, nomme la catégorie <b>E07, Autres affections de la thyroïde</b> et lui attribue quatre sous-codes <button class="w" data-k="e07-nosologie">libellés officiels et notes d’inclusion et d’exclusion</button>. Les notes d’inclusion proviennent de la version 2019 de l’Organisation mondiale de la santé ; l’office suisse ne publie ici que les libellés, ce qui limite la précision de la correspondance.</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Libellé</th><th>Contenu (notes d’inclusion)</th><th>Monographie dans cette leçon</th></tr></thead><tbody>
<tr><td>E07.0</td><td>Hypersécrétion de calcitonine</td><td>Hyperplasie des cellules C ; hypersécrétion de thyrocalcitonine</td><td>Partie A</td></tr>
<tr><td>E07.1</td><td>Goitre dû à un trouble de l’hormonosynthèse</td><td>Goitre dyshormonogénétique familial ; syndrome de Pendred</td><td>Partie B</td></tr>
<tr><td>E07.8</td><td>Autres affections précisées de la thyroïde</td><td>Anomalie de la globuline liant la thyroxine ; hémorragie et infarctus de la thyroïde ; syndrome de basse triiodothyronine (maladie non thyroïdienne)</td><td>Parties C, D et E</td></tr>
<tr><td>E07.9</td><td>Affection de la thyroïde, sans précision</td><td>Aucune note</td><td>Code de repli</td></tr></tbody></table>
<p>Le tableau montre qu’un même code recouvre des mécanismes sans rapport entre eux. La conséquence pédagogique est simple : on ne cherche pas un « traitement de E07 », mais le sous-groupe auquel appartient le patient. Cinq frontières évitent les confusions de codage et de conduite.</p>
<ul><li>Le <b>carcinome médullaire de la thyroïde</b> est codé en C73 ; il n’intervient ici que comme diagnostic différentiel et comme enjeu de l’hypercalcitoninémie.</li><li>L’<b>hypothyroïdie congénitale par dysgénésie</b> (athyréose, ectopie, hypoplasie) relève de E03.1 ; la dyshormonogenèse s’en distingue par un mécanisme de synthèse et, le plus souvent, par un goitre.</li><li>Le <b>goitre congénital transitoire à fonction normale</b> est exclu de E07.1 et codé en P72.0.</li><li>Le <b>diagnostic de l’hypothyroïdie primaire de l’adulte</b> n’appartient pas à E07 ; le syndrome de maladie non thyroïdienne est précisément ce qu’il faut distinguer d’elle.</li><li>E07.9 est un code résiduel sans conduite propre : on le réserve aux situations dont la nature n’est pas précisée.</li></ul>
<div class="trap"><span class="k">Piège</span> Coder E07.0 devant toute calcitonine élevée : l’hypercalcitoninémie a de nombreuses causes extra-thyroïdiennes et le cancer médullaire est codé ailleurs. Le code décrit un diagnostic établi, non un résultat de laboratoire isolé.</div>
<div class="key"><b>À retenir.</b> E07.0, hypercalcitoninémie et hyperplasie des cellules C ; E07.1, dyshormonogenèse et syndrome de Pendred ; E07.8, protéine de transport, hémorragie et maladie non thyroïdienne ; E07.9, sans précision.</div>
</section>

<section class="ilot" id="e07-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Les fréquences ne sont comparables qu’à population égale. Le tableau regroupe les chiffres lus dans les sources, avec leur population, car un chiffre sans population induit en erreur.</p>
<table class="t"><thead><tr><th>Entité</th><th>Fréquence rapportée</th><th>Population et source</th></tr></thead><tbody>
<tr><td>Hypothyroïdie congénitale primaire</td><td>Environ 1/3000 à 1/2000 naissances</td><td>Nouveau-nés ; consensus <button class="w" data-k="e07-hc">hypothyroïdie congénitale (épidémiologie et causes)</button></td></tr>
<tr><td>Hypothyroïdie congénitale centrale</td><td>Jusqu’à environ 1/16 000</td><td>Nouveau-nés ; même consensus</td></tr>
<tr><td>Dysgénésie thyroïdienne</td><td>Environ 65 % de l’hypothyroïdie congénitale primaire permanente</td><td>Même consensus</td></tr>
<tr><td>Glande en place</td><td>Environ 35 % ; moins de la moitié relèvent d’un défaut héréditaire de synthèse</td><td>Même consensus</td></tr>
<tr><td>Syndrome de Pendred</td><td>4 à 7,5 % des surdités héréditaires ; 7,5 à 10 pour 100 000 hors populations africaines</td><td>Revue audiologique 2026 ; étude soudanaise 2025 (fait épidémiologique seul)</td></tr>
<tr><td>Déficit partiel en thyroxine-binding globulin</td><td>Environ 1/4000 nouveau-nés</td><td>Série coréenne 2022</td></tr>
<tr><td>Déficit complet</td><td>Environ 1/15 000 nouveau-nés</td><td>Même série</td></tr>
<tr><td>Carcinome médullaire parmi les nodules</td><td>Prévalence d’environ 0,23 à 0,32 %</td><td>Personnes avec nodule ; <button class="w" data-k="e07-cochrane">revue Cochrane 2020 sur le dosage de la calcitonine</button></td></tr>
<tr><td>Hyperplasie des cellules C opératoire</td><td>73,8 % des goitres multinodulaires (31/42) ; 45,7 % des carcinomes papillaires (16/35)</td><td>Série chirurgicale italienne ; patients opérés, donc non représentatifs de la population générale</td></tr></tbody></table>
<p>Ces chiffres appellent trois lectures. D’abord, les maladies de la partie B et de la partie C se transmettent selon des modes précis : récessif autosomique pour la plupart des dyshormonogenèses, avec un risque de récurrence familiale de 25 %, et lié au chromosome X pour la globuline liant la thyroxine. Ensuite, la rareté du cancer médullaire parmi les nodules explique pourquoi une calcitonine isolée est le plus souvent un faux signal. Enfin, les données suisses sont limitées au dépistage néonatal : le prélèvement est effectué au <b>quatrième jour de vie</b>, le laboratoire national se trouve à Zurich, environ 80 000 à 85 000 échantillons sont analysés chaque année et onze maladies hormonales et métaboliques sont dépistées <button class="w" data-k="e07-depistage">dépistage néonatal en Suisse</button>.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Appliquer à un nodule isolé la prévalence du cancer médullaire d’une série chirurgicale. Dans une série opératoire, les patients ont déjà été sélectionnés sur des critères suspects ; dans la population des nodules, la prévalence est de l’ordre de 3 pour 1000.</div>
<div class="key"><b>À retenir.</b> Hypothyroïdie congénitale primaire : 1/3000 à 1/2000. Déficit partiel en protéine de transport : 1/4000. Cancer médullaire parmi les nodules : moins de 0,5 %. Aucune donnée suisse de prévalence n’a été lue pour la partie A, C ou D.</div>

<section class="ilot" id="e07-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiologie normale précède chaque pathologie, parce que chaque erreur de laboratoire de E07 est la déformation d’un mécanisme normal.</p>
<h3>3.1 La calcitonine et les cellules C (partie A)</h3>
<p>Les cellules C, ou parafolliculaires, de la thyroïde produisent la calcitonine, un peptide de <b>32 acides aminés</b>. Il dérive de la procalcitonine (116 acides aminés), elle-même issue d’une pré-prohormone de 141 acides aminés <button class="w" data-k="e07-calcitonine-phys">calcitonine : précurseurs, rôle et valeurs normales</button>. Le rôle proposé est l’homéostasie calcique, par inhibition des ostéoclastes et de la réabsorption rénale du calcium. Après thyroïdectomie totale, l’absence de calcitonine n’entraîne pas de trouble calcique net, ce qui suggère une redondance physiologique : la calcitonine n’est donc pas indispensable à la calcémie, et son intérêt clinique est essentiellement celui d’un <b>marqueur</b>.</p>
<p>Une hyperplasie de ces cellules augmente la masse sécrétante ; une tumeur issue d’elles, le carcinome médullaire, la fait progresser davantage. Le dosage monte donc dans les deux situations, ce qui explique à la fois la sensibilité du marqueur et sa faible spécificité aux valeurs modérément élevées <button class="w" data-k="e07-hcc">hyperplasie des cellules C : physiologique et néoplasique</button>.</p>
<h3>3.2 La synthèse des hormones thyroïdiennes (partie B)</h3>
<p>La synthèse suit une chaîne dont chaque étape dépend d’une protéine codée par un gène précis. Un défaut héréditaire de l’une d’elles bloque la production d’hormones, c’est une <b>dyshormonogenèse</b> <button class="w" data-k="e07-genes">gènes de l’hormonosynthèse et phénotypes</button>. La figure 1 résume la chaîne.</p>
<figure><svg viewBox="0 0 560 300" role="img" aria-label="Figure 1 — Étapes de l’hormonosynthèse thyroïdienne et gènes associés" font-family="Atkinson Hyperlegible, sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="1.5"><rect x="20" y="30" width="520" height="200" rx="12"/><path d="M20 80h520" stroke-dasharray="5 4"/><path d="M80 15v35M80 50l8-8M80 50l-8-8"/><path d="M180 100v40M180 140l-6-8M180 140l6-8"/><path d="M290 100v40M290 140l-6-8M290 140l6-8"/><path d="M400 100v40M400 140l-6-8M400 140l6-8"/><path d="M490 100v40M490 140l-6-8M490 140l6-8"/></g><g fill="#222"><text x="30" y="22">Sang</text><text x="30" y="75">Cellule folliculaire</text><text x="35" y="250">Lumière folliculaire (colloïde)</text><text x="95" y="38">iodure</text><text x="125" y="115">1. Captation : NIS (SLC5A5)</text><text x="125" y="160">2. Efflux : pendrine (SLC26A4)</text><text x="235" y="115">3. Peroxyde : DUOX2, DUOXA2</text><text x="330" y="175">4. Organification et couplage : TPO</text><text x="330" y="195">5. Précurseur : thyroglobuline (TG)</text><text x="330" y="215">6. Recyclage de l’iode : IYD</text></g></svg><figcaption>Figure 1 — Schéma de principe des étapes de l’hormonosynthèse et du gène de chacune, d’après le consensus ENDO-ERN 2020-2021. Chaque défaut déclenche le même enchaînement : hormones basses, thyréostimuline élevée, croissance de la glande.</figcaption></figure>
<p>Le mécanisme commun est le suivant. Le défaut de synthèse abaisse la thyroxine et la triiodothyronine ; la thyréostimuline s’élève en réponse et stimule la croissance de la thyroïde. Il en résulte un <b>goitre</b>. C’est pourquoi, dans la dyshormonogenèse, le goitre est le signe de la maladie et le témoin d’une glande présente, contrairement à la dysgénésie où la glande manque ou est hypoplasique.</p>
<h3>3.3 Le transport des hormones (partie C)</h3>
<p>La globuline liant la thyroxine est la principale protéine de transport : elle lie environ 70 % de la triiodothyronine et 75 % de la thyroxine sériques. Elle est une glycoprotéine hépatique de 54 kDa, codée par le gène <b>SERPINA7</b> sur le chromosome X <button class="w" data-k="e07-tbg">globuline liant la thyroxine : physiologie et génétique</button>. Si elle est quantitativement basse, les hormones totales baissent mais la fraction libre, biologiquement active, reste normale : le sujet est euthyroïdien. La pathologie est ici une anomalie de <b>mesure</b>, non de fonction.</p>
<h3>3.4 La maladie non thyroïdienne (partie D)</h3>
<p>Au cours d’une maladie aiguë, la triiodothyronine chute très vite, environ deux heures après une chirurgie abdominale selon la revue de référence. Les mécanismes sont à la fois centraux et périphériques : l’inflammation active le facteur nucléaire NF-κB dans les tanycytes hypothalamiques et augmente la désiodase de type 2 ; la triiodothyronine locale supprime la libération de thyréolibérine ; en périphérie, la désiodase de type 1 hépatique diminue et la désiodase de type 3 augmente dans les tissus lésés <button class="w" data-k="e07-smnt-meca">mécanismes du syndrome de maladie non thyroïdienne</button>. Le résultat est un tableau de triiodothyronine basse, de reverse-triiodothyronine élevée, avec une thyréostimuline normale ou basse.</p>
<div class="key"><b>Science → clinique.</b> Défaut de synthèse : hormones basses, thyréostimuline haute, goitre. Défaut de transport : hormones totales basses, hormones libres et thyréostimuline normales. Maladie critique : triiodothyronine basse, thyréostimuline normale ou basse. Trois profils biologiques, trois conduites : traiter tôt, ne pas traiter, ne pas traiter sans autre indication.</div>
</section>

<section class="ilot" id="e07-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<h3>4.1 Hypercalcitoninémie : une liste de causes avant le cancer</h3>
<p>Plusieurs situations élèvent la calcitonine sans cancer médullaire. Le tableau donne les valeurs typiques rapportées par une revue de référence de 2026 <button class="w" data-k="e07-ct-causes">causes non médullaires d’hypercalcitoninémie et valeurs typiques</button>.</p>
<table class="t"><thead><tr><th>Cause</th><th>Calcitonine typique (pg/ml)</th><th>Précision de la source</th></tr></thead><tbody>
<tr><td>Tabagisme, surtout chez l’homme</td><td>10–15</td><td>Surtout chez l’homme</td></tr>
<tr><td>Goitre ou augmentation de la masse thyroïdienne</td><td>10–20</td><td>Augmentation de la masse thyroïdienne</td></tr>
<tr><td>Thyroïdite auto-immune</td><td>10–15</td><td>Liée au volume plus qu’à l’auto-immunité</td></tr>
<tr><td>Inhibiteur de la pompe à protons, hypergastrinémie</td><td>10–20</td><td>Hypergastrinémie associée</td></tr>
<tr><td>Gastrite auto-immune, anémie de Biermer</td><td>15–40</td><td>Hypergastrinémie</td></tr>
<tr><td>Insuffisance rénale chronique légère à modérée ; avancée</td><td>10–20 ; 20–50 (rarement &gt; 100)</td><td>Valeurs plus élevées si l’insuffisance est avancée</td></tr>
<tr><td>Hyperplasie des cellules C sporadique ; sévère</td><td>20–50 ; 50–100</td><td>Sévère : rare hors néoplasie endocrinienne multiple</td></tr>
<tr><td>Hypercalcémie non médullaire</td><td>10–20</td><td>Hypercalcémie d’origine non médullaire</td></tr>
<tr><td>Sepsis, inflammation aiguë</td><td>10–40 (transitoire)</td><td>Élévation transitoire</td></tr>
<tr><td>Carcinome thyroïdien différencié</td><td>10–20</td><td>Carcinome thyroïdien différencié, non médullaire</td></tr>
<tr><td>Carcinome pulmonaire à petites cellules</td><td>100–1000 et plus</td><td>Sécrétion par une autre tumeur neuroendocrine</td></tr>
<tr><td>Tumeur neuroendocrine du pancréas</td><td>20–300</td><td>Sécrétion par une autre tumeur neuroendocrine</td></tr>
<tr><td>Carcinome neuroendocrine de la prostate</td><td>50–300</td><td>Sécrétion par une autre tumeur neuroendocrine</td></tr></tbody></table>
<p>Ce tableau fixe un ordre de grandeur utile : la plupart des causes bénignes restent sous 50 pg/ml, alors que les sécrétions ectopiques peuvent atteindre plusieurs centaines. Il montre aussi que les chevauchements existent, ce qui interdit toute conclusion à partir d’un seul dosage. Les causes analytiques s’y ajoutent : <button class="w" data-k="e07-ct-interference">interférences et conditions de prélèvement de la calcitonine</button>.</p>
<h3>4.2 Dyshormonogenèse : un gène par étape</h3>
<p>Les causes sont génétiques. La transmission est généralement autosomique récessive, avec un risque de récurrence de 25 % dans la fratrie ; certains gènes (DUOX1, DUOX2, IYD) montrent une transmission dominante ou une pénétrance incomplète. Une oligogénicité est décrite. Le syndrome de Pendred relève de mutations biallèliques de <b>SLC26A4</b> (pendrine) <button class="w" data-k="e07-pendred">syndrome de Pendred</button>.</p>
<h3>4.3 Anomalie de la globuline liant la thyroxine : causes héréditaires et acquises</h3>
<p>La cause héréditaire est liée au chromosome X. Les facteurs acquis sont ceux de l’information professionnelle suisse de la lévothyroxine : grossesse et œstrogènes augmentent la capacité de liaison ; maladie grave et hypoprotéinémie de la cirrhose la diminuent ; le furosémide, les salicylates et les anticoagulants oraux déplacent la thyroxine de ses protéines <button class="w" data-k="e07-facteurs-liaison">facteurs acquis modifiant la liaison des hormones</button>. L’excès de globuline et ses autres causes (hépatite, androgènes, syndrome néphrotique) ne sont pas documentés dans les sources lues.</p>
<h3>4.4 Maladie non thyroïdienne et hémorragie</h3>
<p>Le syndrome de maladie non thyroïdienne accompagne toute maladie aiguë ou critique, la restriction calorique et les médicaments qui agissent sur l’axe : la <b>dopamine</b> et les <b>glucocorticoïdes à haute dose</b> abaissent la thyréostimuline. L’hémorragie thyroïdienne est rapportée sur un goitre préexistant après un traumatisme, sous anticoagulation devenue supra-thérapeutique et, exceptionnellement, après une cytoponction <button class="w" data-k="e07-hemorragie">hémorragie de la thyroïde : cas rapportés</button>.</p>
<div class="trap"><span class="k">Piège</span> Rechercher le cancer médullaire sans avoir listé les médicaments et les maladies de l’estomac, du rein et du poumon : un inhibiteur de la pompe à protons, une anémie de Biermer ou une insuffisance rénale suffisent à élever la calcitonine.</div>
<div class="key"><b>À retenir.</b> Calcitonine : causes bénignes le plus souvent entre 10 et 50 pg/ml ; sécrétions ectopiques jusqu’à plusieurs centaines. Dyshormonogenèse : un gène par étape, récessive le plus souvent. Protéine de transport : liée à l’X.</div>
<button class="pareto-btn ui" data-k="pareto-e07-mecanismes">▲ Loi de Pareto — Mécanismes et causes</button>

<section class="ilot" id="e07-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse est conduite selon la porte d’entrée, car les quatre parties de E07 se présentent par des motifs différents. Elle cherche d’abord ce qui rend le résultat biologique plausible sans maladie thyroïdienne, puis ce qui évoque une maladie héréditaire.</p>
<h3>5.1 Antécédents à rechercher</h3>
<ul><li><b>Pour la calcitonine</b> : antécédent personnel ou familial de cancer médullaire ou de <button class="w" data-k="e07-ret">néoplasie endocrinienne multiple de type 2 et gène RET</button>, tabagisme, prise d’<button class="w" data-k="e07-ct-causes">inhibiteur de la pompe à protons</button>, maladie gastrique auto-immune, insuffisance rénale, goitre ou thyroïdite connus.</li><li><b>Pour la dyshormonogenèse</b> : consanguinité, goitre ou surdité dans la fratrie ou la famille, dépistage néonatal anormal, hypothyroïdie congénitale connue dans la famille.</li><li><b>Pour la globuline liante</b> : valeurs de thyroxine totale basses chez des hommes de la famille, grossesse, traitement œstrogénique.</li><li><b>Pour la maladie non thyroïdienne</b> : maladie aiguë, chirurgie récente, jeûne, dopamine ou glucocorticoïdes à haute dose.</li><li><b>Pour l’hémorragie</b> : goitre connu, traumatisme cervical, anticoagulation, ponction récente.</li></ul>
<h3>5.2 Symptômes selon la partie</h3>
<p>Les symptômes sont rares et indirects. Un nodule est le plus souvent asymptomatique. Chez le nouveau-né dyshormonogénétique, le goitre peut devenir compressif <button class="w" data-k="e07-goitre-neonatal">goitre congénital compressif et goitre fœtal</button>. La surdité d’un enfant ou d’un adulte, parfois ancienne, est le symptôme cardinal du syndrome de Pendred. Le déficit en globuline liante ne donne aucun symptôme. Le syndrome de maladie non thyroïdienne n’a pas de symptôme propre : il est celui de la maladie causale. L’hémorragie thyroïdienne donne une tuméfaction cervicale brutale, douloureuse, avec risque respiratoire.</p>
<div class="two"><div class="card"><h4>Formes typiques</h4><p><b>Nodule avec calcitonine modérément élevée</b> chez une femme de 52 ans, fumeuse, sous inhibiteur de la pompe à protons depuis des années : la calcitonine est à 40 pg/ml, le reste du bilan est normal. <b>Enfant sourd avec goitre</b> : surdité neurosensorielle congénitale, goitre, aqueduc vestibulaire élargi. <b>Patient en soins intensifs</b> : triiodothyronine basse, thyréostimuline normale.</p></div><div class="card"><h4>Formes trompeuses</h4><p><b>Faux diagnostic de cancer médullaire</b> sur une macrocalcitonine ou un anticorps hétérophile. <b>Faux diagnostic d’hypothyroïdie centrale</b> chez un nouveau-né dont le dépistage fondé sur la thyroxine est anormal à cause d’une globuline liante de faible affinité. <b>Hypothyroïdie confondue avec une maladie non thyroïdienne</b> en phase de récupération, où la thyréostimuline peut remonter.</p></div></div>
<div class="trap"><span class="k">Piège</span> L’absence de symptôme ne dispense pas du dosage : dans E07, c’est la biologie, et non la plainte, qui révèle l’anomalie, et c’est elle qui doit être interprétée avec le contexte.</div>
<div class="key"><b>À retenir.</b> Trois questions guident l’anamnèse : quels facteurs non thyroïdiens expliquent le résultat ? y a-t-il une surdité ou un goitre dans la famille ? le patient est-il gravement malade ou sous médicament qui agit sur l’axe ?</div>
</section>

<section class="ilot" id="e07-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, anthropométrie, puis signes ciblés. Dans E07, il oriente moins qu’il ne protège : il cherche ce qui impose l’urgence (voies aériennes) et ce qui oriente la famille de causes.</p>
<div class="two"><div class="card"><h4>Cou et thyroïde</h4><p>Inspecter et palper le cou : volume de la glande, caractère diffus ou nodulaire, adénopathies cervicales. Chez le nouveau-né, un goitre volumineux peut dévier ou comprimer la trachée et provoquer une détresse respiratoire <button class="w" data-k="e07-goitre-neonatal">goitre compressif du nouveau-né</button>. Une tuméfaction brutale, douloureuse, chez un patient sous anticoagulant impose d’évaluer la perméabilité des voies aériennes <button class="w" data-k="e07-hemorragie">hémorragie thyroïdienne</button>.</p></div><div class="card"><h4>Audition et développement</h4><p>Répéter les tests auditifs chez tout enfant ayant une hypothyroïdie congénitale avant l’âge scolaire, selon le consensus ENDO-ERN. Une surdité neurosensorielle congénitale, avec ou sans goitre, fait évoquer le syndrome de Pendred.</p></div><div class="card"><h4>Signes d’hypothyroïdie</h4><p>Chez le patient de soins intensifs, l’hypothermie et les troubles de conscience évoquent un coma myxœdémateux, qui s’accompagne d’une thyréostimuline élevée et de thyroxine et triiodothyronine basses <button class="w" data-k="e07-smnt-dd">diagnostic différentiel de la maladie non thyroïdienne</button>.</p></div><div class="card"><h4>Cancer médullaire à exclure</h4><p>L’examen palpe le cou à la recherche de nodules et d’adénopathies cervicales, mais la palpation ne remplace ni le dosage ni la cytologie : la cytoponction seule méconnaît souvent le cancer médullaire. L’examen cherche aussi les signes d’autres atteintes des néoplasies endocriniennes multiples de type 2 chez les porteurs de la mutation RET <button class="w" data-k="e07-ret">dépistage du phéochromocytome</button>.</p></div></div>
<p>L’examen clinique a une valeur limitée dans les formes biologiques pures (déficit en globuline liante, hyperplasie des cellules C sans nodule) : il est alors normal. C’est précisément ce qui impose de ne pas traiter sur le seul chiffre.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure à l’absence de goitre chez un nouveau-né parce que le cou est plat : un goitre congénital massif peut menacer les voies aériennes dès la naissance, et la respiration est le premier signe à surveiller.</div>
<div class="key"><b>À retenir.</b> L’examen cherche trois choses : compression des voies aériennes, surdité, signes d’une hypothyroïdie ou d’une néoplasie endocrinienne. Un examen normal ne protège pas contre une calcitonine élevée.</div>
