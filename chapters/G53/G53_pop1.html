<template data-pop="g53-codage" data-title="Double codage croix et astérisque">
<div class="lab">Définition</div><p>Le système croix-astérisque code deux aspects d’une même situation : le code marqué d’une croix (†) désigne la maladie causale, le code marqué d’un astérisque (*) désigne sa manifestation dans un organe. G 53 appartient aux codes à astérisque (BfArM 2024).</p>
<div class="lab">Application</div><p>Un zona avec névralgie du trijumeau se code B02.2† pour la maladie et G 53.0* pour la manifestation. Une atteinte de plusieurs nerfs crâniens au cours d’une sarcoïdose se code D86.8† puis G 53.2* (BfArM 2024).</p>
<div class="lab">Limite</div><p>Le code à astérisque ne s’emploie jamais seul. Pour G 53.8*, la classification ne liste aucun code à croix : la maladie causale doit donc être choisie dans le dossier du patient (BfArM 2024).</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS 2024</a></p></template>
<template data-pop="g53-npz" data-title="Névralgie post-zostérienne">
<div class="lab">Définition</div><p>Douleur associée au zona, cotée au moins 3 sur 10 sur le Zoster Brief Pain Inventory, qui persiste ou apparaît plus de 90 jours après le début de l’éruption. Cette définition vient des essais du vaccin (Shingrix, Swissmedic).</p>
<div class="lab">Fréquence</div><p>Sous placebo, l’incidence de la névralgie est de 0,6 pour 1000 personnes-années à 50 ans et plus, et de 1,2 pour 1000 à 70 ans et plus (Shingrix). Les douleurs neuropathiques chroniques touchent 6,9 à 10 % de la population générale (Arztebl 2016, résumé).</p>
<div class="lab">Décision</div><p>Le traitement de la douleur est celui de la douleur neuropathique : prégabaline, gabapentine, patch de capsaïcine (Lyrica ; Gabapentine Spirig HC ; Qutenza). La prévention passe par le vaccin, qui agit en prévenant le zona (Shingrix).</p>
<div class="lab">Limite</div><p>L’incidence de la névralgie en population générale n’est pas disponible hors essais, et aucune donnée suisse spécifique n’a été trouvée.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Shingrix</a> ; <a href="https://doi.org/10.3238/arztebl.2016.0616" target="_blank" rel="noopener">Arztebl 2016</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Lyrica</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Gabapentine Spirig</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Qutenza</a></p></template>
<template data-pop="g53-zona" data-title="Zona">
<div class="lab">Définition</div><p>Le zona est la réactivation du virus varicelle-zona. Il atteint plus fréquemment et plus gravement la personne de 65 ans et plus et la personne immunodéprimée (Plan de vaccination 2026).</p>
<div class="lab">Complications crâniennes</div><p>Le zona céphalique peut toucher le trijumeau, y compris sa branche ophtalmique, ou le ganglion géniculé. Un zona ophtalmique justifie un aciclovir par voie intraveineuse selon la directive DGN avec la SNG (DGN méningo-encéphalite 2025).</p>
<div class="lab">Traitement</div><p>Valaciclovir 1000 mg trois fois par jour pendant 7 jours, au plus tard dans les 72 heures (Valtrex).</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final%20%283%29.pdf" target="_blank" rel="noopener">Plan de vaccination 2026</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN méningo-encéphalite 2025</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Valtrex</a></p></template>
<template data-pop="g53-geniculate" data-title="Ganglion géniculé">
<div class="lab">Définition</div><p>Le ganglion géniculé est le ganglion sensitif du nerf facial. La classification inclut dans G 53.0* l’inflammation du ganglion géniculé survenue après un zona (BfArM 2024).</p>
<div class="lab">Conduite</div><p>Dans la paralysie faciale avec infection à virus varicelle-zona, un virostatique est obligatoire ; la prednisolone est réservée à la forme idiopathique ; la cornée doit être protégée (Arztebl 2019, résumé).</p>
<div class="lab">Limite</div><p>Les doses antivirales spécifiques du zona oticus (syndrome de Ramsay Hunt) et la place des corticoïdes n’ont pas été extraites des sources lues.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://doi.org/10.3238/arztebl.2019.0692" target="_blank" rel="noopener">Arztebl 2019</a></p></template>
<template data-pop="g53-g531" data-title="G 53.1 — Atteintes crâniennes d’origine infectieuse">
<div class="lab">Définition</div><p>Paralysie de plusieurs nerfs crâniens au cours d’une maladie infectieuse ou parasitaire classée ailleurs (A00–B99†) (BfArM 2024).</p>
<div class="lab">Causes lues</div><p>Virus : varicelle-zona, herpès simplex, cytomégalovirus, VIH, méningo-encéphalite verno-estivale, oreillons, poliovirus, hépatite C (DGN méningo-encéphalite 2025). Bactéries : Borrelia (DGN neuroborréliose 2025) et Treponema pallidum (DGN neurosyphilis 2026).</p>
<div class="lab">Limite</div><p>La tuberculose méningée, la cryptococcose et le VIH comme causes de G 53.1 ne sont pas documentés par une directive lue ; seule la mention du taux de CXCL13 dans la tuberculose méningée apparaît (DGN neuroborréliose 2025).</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN méningo-encéphalite 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">DGN neuroborréliose 2025</a> ; <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">DGN neurosyphilis 2026</a></p></template>
<template data-pop="g53-sarcoidose" data-title="Sarcoïdose et atteinte crânienne">
<div class="lab">Définition</div><p>La neurosarcoïdose est l’atteinte du système nerveux au cours de la sarcoïdose, maladie granulomateuse. Elle représente 5 à 15 % des sarcoïdoses (Westendorp 2025).</p>
<div class="lab">Atteinte crânienne</div><p>Des neuropathies crâniennes se retrouvent chez 55 % des patients : nerf facial 24 %, optique 21 %, trijumeau 12 %, plusieurs nerfs 28 %. La sarcoïdose est une cause majeure de diplégie faciale (Westendorp 2025).</p>
<div class="lab">Critères</div><p>Les critères consensuels de 2018 distinguent neurosarcoïdose possible, probable et définie selon la preuve histologique (Stern 2018 ; Westendorp 2025).</p>
<div class="lab">Limite</div><p>La recommandation européenne de 2021 de la société respiratoire européenne n’a été lue qu’en résumé ; la recommandation neurologique détaillée est rapportée via la revue de 2025 (ERS 2021).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a> ; <a href="https://doi.org/10.1001/jamaneurol.2018.2295" target="_blank" rel="noopener">Stern 2018</a> ; <a href="https://doi.org/10.1183/13993003.04079-2020" target="_blank" rel="noopener">ERS 2021</a></p></template>
<template data-pop="g53-ml" data-title="Métastases leptoméningées (EANO-ESMO 2023)">
<div class="lab">Définition</div><p>Dissémination de cellules tumorales dans les espaces sous-arachnoïdiens. Elle s’observe surtout dans le cancer du sein, le cancer du poumon et le mélanome (EANO-ESMO 2023).</p>
<div class="lab">Classification</div><p>Type I (confirmé par cytologie ou biopsie) avec les profils A (linéaire), B (nodulaire), C (mixte) et D (hydrocéphalie ou imagerie normale) ; type II (clinique et imagerie) probable ou possible. Ces sous-types sont pronostiques : le type I est plus défavorable que le type II (P = 0,002) (EANO-ESMO 2023 ; Le Rhun 2021).</p>
<div class="lab">Pronostic</div><p>Survie médiane 3,8 à 5,4 mois pour le sein, 4,2 à 8,1 mois pour le poumon, 4,8 mois pour le mélanome, 3 mois pour les formes mixtes ; 20 % des cancers du sein survivent plus d’un an (EANO-ESMO 2023).</p>
<div class="lab">Limite</div><p>L’incidence par type tumoral figure dans le matériel supplémentaire de la recommandation, qui n’a pas été lu.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023</a> ; <a href="https://doi.org/10.1093/neuonc/noaa298" target="_blank" rel="noopener">Le Rhun 2021</a></p></template>
<template data-pop="g53-g538" data-title="G 53.8 — Autres affections crâniennes">
<div class="lab">Définition</div><p>Autres affections des nerfs crâniens au cours d’autres maladies classées ailleurs. La classification ne liste aucun code à croix ni aucune maladie typique (BfArM 2024).</p>
<div class="lab">Exemples lus</div><p>Artérite à cellules géantes (nerfs III et VI), polyradiculoneuropathie inflammatoire démyélinisante chronique (nerfs III, VII, X et XII), diabète avec neuropathie crânienne récidivante, effet immunologique d’un inhibiteur de points de contrôle (Ye 2023 ; Shahjouei 2024 ; Keane 2005 ; Minagawa 2026).</p>
<div class="lab">Limite</div><p>Aucune directive n’a été trouvée pour cette rubrique ; les sources sont des cas cliniques et des revues, et ne justifient pas une conduite générale.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://doi.org/10.1177/19418744221139893" target="_blank" rel="noopener">Ye 2023</a> ; <a href="https://doi.org/10.1097/CND.0000000000000495" target="_blank" rel="noopener">Shahjouei 2024</a> ; <a href="https://doi.org/10.1001/archneur.62.11.1714" target="_blank" rel="noopener">Keane 2005</a> ; <a href="https://doi.org/10.1002/iju5.70136" target="_blank" rel="noopener">Minagawa 2026</a></p></template>
<template data-pop="g53-borreliose" data-title="Neuroborréliose de Lyme (DGN neuroborréliose 2025)">
<div class="lab">Définition</div><p>Manifestation neurologique de la borréliose de Lyme, dans 3 à 15 % des cas. Le tableau précoce (moins de 6 mois) associe une méningoradiculite douloureuse et une parésie faciale uni- ou bilatérale : c’est le syndrome de Bannwarth. La forme tardive est rare (moins de 3 % des cas présumés) (DGN neuroborréliose 2025).</p>
<div class="lab">Catégories diagnostiques</div><p>Possible : tableau typique, sérologie positive, liquide non disponible. Probable : syndrome inflammatoire du liquide. Confirmée : synthèse intrathécale d’anticorps spécifiques, culture ou amplification génique positive.</p>
<div class="lab">Traitement</div><p>14 jours de doxycycline, ceftriaxone, céfotaxime ou pénicilline G (niveau Ia), sans corticoïdes pour la parésie faciale (DGN neuroborréliose 2025 ; Rauer 2018).</p>
<div class="lab">Limite</div><p>Les doses détaillées des antibiotiques n’ont pas été extraites. Le texte est une directive allemande approuvée par la Société suisse de neurologie ; aucune directive suisse propre n’a été lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">DGN neuroborréliose 2025</a> ; <a href="https://doi.org/10.3238/arztebl.2018.0751" target="_blank" rel="noopener">Rauer 2018</a></p></template>
<template data-pop="g53-lcr-borrelia" data-title="Index anticorps et CXCL13 dans le liquide">
<div class="lab">Index anticorps spécifique</div><p>L’index anticorps compare la concentration d’anticorps spécifiques dans le liquide à celle du sang. Il devient positif vers la 2e semaine et est détectable chez plus de 99 % des patients ensuite ; il peut être négatif dans 10 à 30 % des cas si les symptômes durent moins de 6 semaines, et chez l’enfant avec parésie faciale (DGN neuroborréliose 2025).</p>
<div class="lab">CXCL13</div><p>La chimiokine CXCL13 du liquide augmente précocement, mais elle n’est pas spécifique : elle s’élève aussi dans la neurosyphilis, la méningite tuberculeuse et le lymphome du système nerveux central (DGN neuroborréliose 2025).</p>
<div class="lab">Limite</div><p>L’index ne sert pas à suivre l’efficacité du traitement, car il peut rester positif pendant des mois ou des années.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">DGN neuroborréliose 2025</a></p></template>
<template data-pop="g53-neurosyphilis" data-title="Neurosyphilis (DGN neurosyphilis 2026)">
<div class="lab">Définition</div><p>Atteinte du système nerveux au cours de la syphilis. La forme précoce (méningite de la syphilis secondaire, surtout dans l’année suivant l’infection) atteint les nerfs VIII, VII et III, parfois le nerf optique ; les formes méningovasculaire et tardive (tabès, paralysie générale) suivent (DGN neurosyphilis 2026).</p>
<div class="lab">Atteintes ciblées</div><p>L’atteinte oculaire (uvéite postérieure, panuvéite) est plus fréquente chez les personnes vivant avec le VIH ; l’atteinte otologique comprend l’hypoacousie et le déficit vestibulaire.</p>
<div class="lab">Traitement</div><p>Pénicilline G par voie intraveineuse ou ceftriaxone 2 g par jour pendant 14 jours (DGN neurosyphilis 2026).</p>
<div class="lab">Limite</div><p>La démarche diagnostique détaillée pour la syphilis oculaire et otologique n’a pas été extraite. La directive est allemande, avec mandat de la Société suisse de neurologie.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">DGN neurosyphilis 2026</a></p></template>
<template data-pop="g53-heerfordt" data-title="Syndrome de Heerfordt">
<div class="lab">Définition</div><p>Association de paralysie faciale, de parotidite, d’uvéite et de fièvre, dans le cadre d’une sarcoïdose (Westendorp 2025).</p>
<div class="lab">Conduite</div><p>Le tableau impose la recherche d’une neurosarcoïdose, après exclusion de l’infection et du cancer, et la recherche d’une paralysie faciale bilatérale, car la sarcoïdose est une cause majeure de diplégie faciale.</p>
<div class="lab">Limite</div><p>La revue ne chiffre pas la fréquence du syndrome au sein des neurosarcoïdoses.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a></p></template>
<template data-pop="g53-trijumeau" data-title="Nerf trijumeau">
<div class="lab">Définition</div><p>Le trijumeau est le nerf crânien V ; il assure la sensibilité de la face. Notion anatomique élémentaire, non issue d’une source du dossier.</p>
<div class="lab">Atteintes décrites</div><p>Dans la neurosarcoïdose, le trijumeau est touché dans 12 % des cas (Westendorp 2025). Après un zona, la classification inclut la névralgie du trijumeau dans G 53.0* (BfArM 2024). Dans la série de Keane, le nerf V est atteint chez 353 des 979 patients (Keane 2005).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM 2024</a> ; <a href="https://doi.org/10.1001/archneur.62.11.1714" target="_blank" rel="noopener">Keane 2005</a></p></template>
<template data-pop="g53-espace-sous" data-title="Espaces sous-arachnoïdiens">
<div class="lab">Définition</div><p>Espaces qui contiennent le liquide céphalorachidien autour de l’encéphale et de la moelle. Notion anatomique élémentaire, non issue d’une source du dossier.</p>
<div class="lab">Pertinence</div><p>Les cellules tumorales y migrent dans les métastases leptoméningées, d’où l’atteinte des nerfs II, III, IV, VI, VII et VIII et des blocs de circulation du liquide (EANO-ESMO 2023).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023</a></p></template>
<template data-pop="g53-granulome" data-title="Granulome non nécrosant">
<div class="lab">Définition</div><p>Amas de cellules épithélioïdes, dérivées des macrophages, sans nécrose centrale. Il caractérise la sarcoïdose ; ces cellules sécrètent l’enzyme de conversion de l’angiotensine et le facteur de nécrose tumorale alpha (Westendorp 2025).</p>
<div class="lab">Décision</div><p>La preuve histologique détermine la catégorie : un granulome hors système nerveux rend la neurosarcoïdose probable, dans le système nerveux elle devient définie (Stern 2018).</p>
<div class="lab">Limite</div><p>L’aspect de granulome ne dispense pas d’exclure l’infection et le cancer (Westendorp 2025).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664804/" target="_blank" rel="noopener">Westendorp 2025</a> ; <a href="https://doi.org/10.1001/jamaneurol.2018.2295" target="_blank" rel="noopener">Stern 2018</a></p></template>
<template data-pop="g53-barriere" data-title="Barrière hémato-liquidienne">
<div class="lab">Définition</div><p>Interface entre le sang et le liquide céphalorachidien, qui limite le passage des protéines. Son altération élève les protéines et le quotient d’albumine du liquide. Notion physiologique élémentaire, non issue d’une source du dossier.</p>
<div class="lab">Application</div><p>Une dysfonction de barrière est un critère du syndrome inflammatoire du liquide dans la neuroborréliose probable (DGN neuroborréliose 2025). Un quotient d’albumine supérieur à 10 × 10⁻³ distingue la neurosarcoïdose de la sclérose en plaques (Vlad 2023, résumé).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12584707/" target="_blank" rel="noopener">DGN neuroborréliose 2025</a> ; <a href="https://doi.org/10.3389/fneur.2023.1135392" target="_blank" rel="noopener">Vlad 2023</a></p></template>
<template data-pop="g53-mnemo" data-title="Aide mémoire des sous-codes (aide pédagogique, non critère officiel)">
<div class="lab">Aide pédagogique</div><p>L’ordre des chiffres suit l’ordre « zona, infection, sarcoïdose, tumeur » : 0 pour le zona, 1 pour les infections, 2 pour la sarcoïdose, 3 pour les tumeurs, 8 pour tout le reste.</p>
<div class="lab">Mention</div><p>Cette formule est une aide pédagogique, non un critère officiel (BfArM 2024).</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM 2024</a></p></template>
