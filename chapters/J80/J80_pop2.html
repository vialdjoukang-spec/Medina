<template data-pop="j80-bnp" data-title="Peptide natriurétique de type B"><p class="lab">Mécanisme</p><p>Les cardiomyocytes ventriculaires sécrètent ce peptide lorsque leur paroi est étirée par une surcharge de volume ou de pression.</p><p class="lab">Valeur dans le SDRA</p><p>Un taux élevé suggère une insuffisance cardiaque et oriente vers un œdème hydrostatique ; il complète l’échocardiographie sans la remplacer.</p><div class="key"><b>Piège.</b> Une cardiopathie n’exclut pas le SDRA : un peptide élevé chez un patient porteur d’un facteur de risque ne suffit pas à rejeter le diagnostic. Le ventricule droit dilaté du cœur pulmonaire aigu étire lui aussi les cardiomyocytes.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, section diagnostic</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">définition globale 2024</a>.</p></template>
<template data-pop="j80-tdm" data-title="Tomodensitométrie thoracique"><p class="lab">Aspect du SDRA</p><p>Perte d’aération non uniforme, prédominant dans les régions déclives sous le poids de l’œdème ; le tissu encore aéré, le « petit poumon », siège surtout dans les régions non déclives et se redistribue en décubitus ventral.</p><p class="lab">Indications</p><p>Rechercher une cause cachée, une maladie imitatrice (fibrose pulmonaire idiopathique en exacerbation, pneumopathie organisée), une complication ; évaluer le caractère recrutable du poumon.</p><div class="key"><b>Limite.</b> Le transport d’un patient ventilé sous FiO₂ élevée comporte un risque ; l’examen se demande quand son résultat peut changer la conduite. Aucune modalité d’imagerie n’est la référence du diagnostic.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15812622/" target="_blank" rel="noopener">Gattinoni et Pesenti, 2005</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">définition globale 2024</a>.</p></template>
<template data-pop="j80-mecanique" data-title="Mécanique ventilatoire au lit"><p class="lab">Mesures</p><p>Pression de plateau : pause téléinspiratoire de 0,5 seconde chez un patient passif, au moins toutes les 4 heures et après chaque changement de PEEP ou de volume dans le protocole ARDSNet. Pression motrice : plateau moins PEEP. Compliance statique : volume courant divisé par la pression motrice.</p><p class="lab">Exemple</p><p>Volume 420 mL, plateau 28, PEEP 10 cm H₂O : pression motrice 18, compliance 23 mL/cm H₂O. Réduire le volume à 360 mL ramène la pression motrice vers 15 si la compliance reste stable. Une pression motrice ≥ 18 cm H₂O figure parmi les facteurs de risque de cœur pulmonaire aigu.</p><div class="key"><b>Piège.</b> Chez un patient qui respire activement, la mesure est faussée : l’effort inspiratoire masque une pression transpulmonaire élevée.</div><p class="src">Références : <a href="https://www.ardsnet.org/files/ventilator_protocol_2008-07.pdf" target="_blank" rel="noopener">Protocole ARDSNet (2008)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25693014/" target="_blank" rel="noopener">Amato et al., 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26650055/" target="_blank" rel="noopener">Mekontso Dessap et al., 2016</a>.</p></template>
<template data-pop="j80-cisatracurium" data-title="Cisatracurium (Nimbex®)"><p class="lab">Mécanisme</p><p>Myorelaxant non dépolarisant : il se lie aux récepteurs cholinergiques de la plaque motrice et bloque de façon compétitive l’action de l’acétylcholine, effet réversible par les anticholinestérasiques. Il paralyse les muscles respiratoires et squelettiques, sans action sur la conscience ni sur le seuil douloureux, et sans effet vagolytique notable.</p><p class="lab">Élimination</p><p>Dégradation de Hofmann, dépendante du pH et de la température, en laudanosine et en acrylate monoquaternaire : environ 80 % de la clairance. En soins intensifs, clairance moyenne 7,5 mL/kg/min et demi-vie de 27 minutes ; récupération spontanée en 50 minutes environ, indépendante de la durée de perfusion.</p><p class="lab">Posologie en soins intensifs (information professionnelle suisse)</p><p>Perfusion initiale de 3 µg/kg/min (0,18 mg/kg/h) ; débits observés de 0,5 à 10,2 µg/kg/min, avec d’importantes variations interindividuelles.</p><p class="lab">Preuves</p><p>ACURASYS : perfusion de 48 heures, rapport de risque ajusté de décès 0,68 ; ROSE : aucun bénéfice face à une sédation légère. L’ESICM 2023 déconseille l’emploi systématique.</p><p class="lab">Effets indésirables et contre-indications</p><p>Myopathie et faiblesse musculaire, rares, surtout sous corticoïdes ; laudanosine convulsivante à forte dose chez l’animal ; récupération parfois retardée après administration prolongée. Contre-indications : hypersensibilité au cisatracurium, à l’atracurium ou à l’acide benzènesulfonique ; nouveau-né de moins d’un mois. Sensibilité croisée entre curares supérieure à 50 %.</p><div class="key"><b>Surveillance.</b> Sédation profonde préalable, train-de-quatre, réévaluation quotidienne. Les troubles acido-basiques et électrolytiques sévères modifient la sensibilité au blocage.</div><p class="src">Références : information professionnelle suisse Nimbex® (mise à jour février 2022), Swissmedic, AIPS via AmiKo, consultée le 09.10.2026 ; <a href="https://pubmed.ncbi.nlm.nih.gov/20843245/" target="_blank" rel="noopener">ACURASYS, 2010</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31112383/" target="_blank" rel="noopener">ROSE, 2019</a>.</p></template>
<template data-pop="j80-dexamethasone" data-title="Dexaméthasone"><p class="lab">Mécanisme</p><p>Glucocorticoïde de longue demi-vie biologique, choisi lorsqu’un effet continu est souhaité. Il réprime la transcription des médiateurs inflammatoires.</p><p class="lab">Statut suisse</p><p>Dexaméthasone Galepharm Amp : indication COVID-19 chez l’adulte et l’adolescent d’au moins 12 ans et 40 kg nécessitant un apport d’oxygène, 6 mg par voie intraveineuse une fois par jour jusqu’à 10 jours. Le SDRA d’autre cause n’est pas une indication autorisée.</p><p class="lab">Preuves</p><p>DEXA-ARDS (2020, 277 patients, SDRA modéré à sévère établi) : 20 mg par jour du jour 1 au jour 5 puis 10 mg du jour 6 au jour 10 ; jours sans ventilation +4,8 ; mortalité à 60 jours 21 % contre 36 % ; hyperglycémie 76 % contre 70 %, infections 24 % contre 25 %. RECOVERY (COVID-19) : mortalité des patients ventilés 29,3 % contre 41,4 %.</p><p class="lab">Effets indésirables</p><p>Diminution de la tolérance au glucose, infections, troubles psychiques, saignement digestif haut, faiblesse musculaire et myopathie.</p><div class="key"><b>Limite.</b> DEXA-ARDS était ouvert et arrêté à 88 % du recrutement prévu.</div><p class="src">Références : information professionnelle suisse Dexaméthasone Galepharm Amp (mise à jour juin 2022), Swissmedic, AIPS via AmiKo, consultée le 09.10.2026 ; <a href="https://pubmed.ncbi.nlm.nih.gov/32043986/" target="_blank" rel="noopener">Villar et al., Lancet Respir Med 2020;8:267-276</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32678530/" target="_blank" rel="noopener">RECOVERY, N Engl J Med 2021;384:693-704</a>.</p></template>
<template data-pop="j80-methylprednisolone" data-title="Méthylprednisolone injectable"><p class="lab">Place</p><p>SCCM/ESICM 2017 : 1 mg/kg par jour par voie intraveineuse dans le SDRA modéré à sévère précoce (PaO₂/FiO₂ &lt; 200, dans les 14 jours), suggestion de certitude modérée. ERS/ESICM/ESCMID/ALAT 2023 : 0,5 mg/kg toutes les 12 heures pendant 5 jours dans la pneumonie communautaire sévère avec choc, hors pneumonie virale, diabète non contrôlé ou corticothérapie pour une autre raison.</p><p class="lab">Statut suisse</p><p>L’information professionnelle suisse ne mentionne pas le SDRA parmi les indications : l’emploi est hors indication. Elle rappelle que l’emploi de routine dans le choc septique n’y est pas recommandé.</p><div class="key"><b>Mise en garde.</b> Aux doses élevées, des myopathies aiguës ont été décrites, surtout avec un curare ; elles peuvent toucher la musculature respiratoire, aller jusqu’à la tétraparésie et élever la créatine kinase.</div><p class="src">Références : information professionnelle suisse de la méthylprednisolone injectable de Pfizer (mise à jour août 2025), Swissmedic, AIPS via AmiKo, consultée le 09.10.2026 ; <a href="https://pubmed.ncbi.nlm.nih.gov/28940011/" target="_blank" rel="noopener">Annane et al., Intensive Care Med 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37012484/" target="_blank" rel="noopener">Martin-Loeches et al., Intensive Care Med 2023</a>.</p></template>
<template data-pop="j80-furosemide" data-title="Furosémide et conservation hydrique"><p class="lab">Mécanisme</p><p>Diurétique de l’anse ; la natriurèse réduit le volume circulant et donc la pression capillaire pulmonaire, qui majore l’œdème lésionnel.</p><p class="lab">Place</p><p>Après la résolution du choc, il aide à obtenir un bilan hydrique négatif, comme dans le bras conservateur de FACTT.</p><p class="lab">Posologie (information professionnelle suisse)</p><p>Ampoules de 20 mg ; dose initiale de 20 à 40 mg par voie intraveineuse, injectée lentement sans dépasser 4 mg/min ; une perfusion est en général préférée aux bolus répétés.</p><div class="key"><b>Contre-indications et surveillance.</b> Contre-indiqué en cas d’insuffisance rénale anurique, d’hypokaliémie ou d’hyponatrémie sévères, d’hypovolémie ou de déshydratation, de coma hépatique. Surveiller kaliémie, natrémie, créatinine, diurèse et perfusion des organes. Il potentialise les curares non dépolarisants.</div><p class="src">Références : information professionnelle suisse Lasix® ampoules (mise à jour mars 2025) et Nimbex®, Swissmedic, AIPS via AmiKo, consultées le 09.10.2026 ; <a href="https://pubmed.ncbi.nlm.nih.gov/16714767/" target="_blank" rel="noopener">FACTT, 2006</a>.</p></template>
<template data-pop="j80-train-quatre" data-title="Train-de-quatre"><p class="lab">Technique</p><p>Quatre stimulations électriques successives sont appliquées au nerf ulnaire, ou cubital ; la réponse s’observe au muscle adducteur du pouce, site de référence de l’information professionnelle et de la recommandation européenne. Le rapport entre la quatrième et la première réponse quantifie le blocage.</p><p class="lab">Repères</p><p>L’information professionnelle du Nimbex® exprime l’entretien du blocage en suppression de 89 à 99 % de la première réponse. La recommandation européenne d’anesthésie exige un rapport supérieur à 0,9 avant de conclure à l’absence de curarisation résiduelle.</p><div class="key"><b>Limite.</b> En soins intensifs, la réponse doit être interprétée avec la clinique, notamment la disparition ou la persistance de l’asynchronie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36377554/" target="_blank" rel="noopener">Recommandation de la Société européenne d’anesthésiologie et de soins intensifs, Eur J Anaesthesiol 2023</a> ; information professionnelle suisse Nimbex®.</p></template>
<template data-pop="pareto-j80-meca" data-title="Pareto — Définition, épidémiologie et mécanismes"><p class="ratio" data-cover="j80-0,j80-1,j80-2,j80-3"></p><ul><li>Œdème lésionnel : barrière perméable, liquide protéique, sans élévation primitive de la pression capillaire.</li><li>Berlin : délai ≤ 1 semaine, opacités bilatérales, origine non exclusivement cardiaque, PaO₂/FiO₂ ≤ 300 sous PEEP ≥ 5 ; seuils 300, 200, 100 ; mortalité 27, 32, 45 %.</li><li>Définition globale : haut débit ≥ 30 L/min, SpO₂/FiO₂ ≤ 315 si SpO₂ ≤ 97 %, échographie ; correction au-dessus de 1 000 m.</li><li>Un ventilé sur quatre ; mortalité de 35 à 46 % ; syndrome méconnu donc sous-traité.</li><li>Phase exsudative puis proliférative ; petit poumon aéré ; shunt peu sensible à l’oxygène ; lésions induites par la ventilation.</li></ul></template>
<template data-pop="pareto-j80-clin" data-title="Pareto — Causes, anamnèse et examen"><p class="ratio" data-cover="j80-4,j80-5,j80-6"></p><ul><li>Causes directes (pneumonie, inhalation) et indirectes (sepsis, traumatisme, pancréatite, transfusion) ; la cause se traite en priorité.</li><li>Dégradation dans la semaine suivant l’agression ; sans facteur de risque, chercher une cardiopathie ou une maladie imitatrice.</li><li>L’examen cherche la cause et le choc ; il ne tranche pas l’origine de l’œdème.</li><li>Mesurer la taille pour calculer le poids prédit.</li></ul></template>
<template data-pop="pareto-j80-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j80-7"></p><ul><li>Critères réunis, part cardiaque jugée par échocardiographie, cause identifiée.</li><li>Sans facteur de risque : lavage et tomodensitométrie à la recherche d’une maladie imitatrice.</li><li>L’insuffisance cardiaque aiguë est l’imitatrice qui se corrige le plus vite.</li></ul></template>
<template data-pop="pareto-j80-tt" data-title="Pareto — Gravité et prise en charge"><p class="ratio" data-cover="j80-8,j80-9"></p><ul><li>Ne pas retarder l’intubation d’un patient qui s’épuise ; rechercher pneumothorax et cœur pulmonaire aigu devant une dégradation brutale.</li><li>Haut débit plutôt qu’oxygène conventionnel chez le non-intubé.</li><li>6 mL/kg de poids prédit (4 à 8), plateau &lt; 30, pression motrice basse, hypercapnie permissive.</li><li>Décubitus ventral précoce ≥ 16 heures si PaO₂/FiO₂ &lt; 150 ; pas de recrutement prolongé.</li><li>Bilan hydrique restrictif après le choc ; ECMO en centre selon les critères EOLIA.</li><li>Curares non systématiques ; corticoïdes sur décision argumentée ; traitement de la cause toujours.</li></ul></template>
<template data-pop="pareto-j80-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="j80-10,j80-11,j80-12"></p><ul><li>Séquelles dominées par la faiblesse musculaire, la cognition et le psychisme ; fonction respiratoire proche de la normale en 6 à 12 mois.</li><li>Altitude : correction barométrique ; obésité : poids prédit ; immunodépression : pneumocystose ; enfant : PALICC-2.</li><li>Critères formels et paramètres clés de l’îlot 12.</li></ul></template>
<template data-pop="pareto-j80-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j80-e-1,j80-e-2"></p><ul><li>Pas d’examen de référence clinique ; gazométrie pour l’hypoxémie, imagerie pour la bilatéralité, échocardiographie pour la part cardiaque.</li><li>Rapport mesuré au repos, FiO₂ connue, PEEP notée, correction en altitude ; SpO₂/FiO₂ seulement si SpO₂ ≤ 97 %.</li><li>Compliance = volume courant / pression motrice ; elle reflète le petit poumon aéré.</li><li>Rapport protéines œdème/plasma &gt; 0,65 : perméabilité ; &lt; 0,65 : pression.</li></ul></template>
<template data-pop="pareto-j80-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j80-p-1,j80-p-2,j80-p-3"></p><ul><li>Aucun médicament ne répare la barrière ; le traitement de la cause est toujours indiqué.</li><li>Cisatracurium 3 µg/kg/min, toujours sous sédation profonde et train-de-quatre, jamais en routine.</li><li>Dexaméthasone 6 mg dans la COVID-19 (indication suisse) ; hors indication, dexaméthasone 20 puis 10 mg ou méthylprednisolone 1 mg/kg par jour.</li><li>Monoxyde d’azote, salbutamol intraveineux, statines et surfactant : pas de bénéfice de survie.</li></ul></template>
