<section class="ilot" id="j80-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 58 ans est hospitalisé pour une pneumonie à pneumocoque. Au troisième jour, il respire 36 fois par minute ; sous oxygène nasal à haut débit à 50 L/min et une FiO₂ de 0,6, sa SpO₂ plafonne à 89 %. La radiographie montre des opacités dans les deux poumons, et l’échocardiographie trouve un ventricule gauche normal. <b>Ce patient ne souffre plus seulement d’une pneumonie : la barrière alvéolo-capillaire des deux poumons est devenue perméable, et chaque réglage ventilatoire peut désormais aggraver la lésion ou la limiter.</b></p><p>Le syndrome de détresse respiratoire aiguë (SDRA) est un œdème pulmonaire lésionnel. Une agression déclenchante rend perméables l’endothélium capillaire et l’épithélium alvéolaire ; un liquide riche en protéines inonde les alvéoles, une partie du poumon cesse d’être aérée et l’oxygène passe mal. Ce n’est pas une maladie unique : c’est une réponse commune à des agressions pulmonaires ou générales très diverses.</p><p>Quatre décisions en découlent. Le médecin reconnaît d’abord le syndrome, tôt et selon une définition explicite. Il écarte ensuite un œdème d’origine cardiaque, qui se traite autrement. Il applique une ventilation qui épargne le poumon encore aéré et mobilise à temps les mesures qui réduisent la mortalité. Il traite enfin la cause, sans laquelle aucun support ne suffit. <button class="w" data-k="j80-q-decisions">Les quatre décisions devant une hypoxémie bilatérale aiguë (ordre et raison)</button>.</p><div class="key"><b>À retenir.</b> Le SDRA est une lésion inflammatoire diffuse déclenchée par un facteur de risque identifiable. Le reconnaître change immédiatement la manière de ventiler. La définition fixe le moment de cette reconnaissance.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., définition globale, Am J Respir Crit Care Med 2024, modèle conceptuel</a>.</p></section>
<section class="ilot" id="j80-1"><h2><span class="n">1</span>Définition et degrés de gravité</h2><p>La <b>définition de Berlin</b> (2012) est née d’une initiative de l’ESICM, approuvée par deux sociétés américaines. Elle exige quatre éléments : un début dans la semaine qui suit une agression connue ou l’apparition de symptômes respiratoires ; des opacités bilatérales non expliquées par un épanchement, une atélectasie ou des nodules ; une insuffisance respiratoire non entièrement expliquée par une défaillance cardiaque ou une surcharge hydrique ; une hypoxémie mesurée sous une PEEP d’au moins 5 cm H₂O. Le rapport PaO₂/FiO₂ définit trois degrés de gravité, dont la mortalité croît.</p><table class="t"><tr><th>Degré</th><th>PaO₂/FiO₂ (mmHg), PEEP ≥ 5 cm H₂O</th><th>Ou SpO₂/FiO₂ si SpO₂ ≤ 97 % (définition globale)</th><th>Mortalité (Berlin, 4 188 patients)</th></tr><tr><td>Léger</td><td>&gt; 200 et ≤ 300</td><td>&gt; 235 et ≤ 315</td><td>27 %</td></tr><tr><td>Modéré</td><td>&gt; 100 et ≤ 200</td><td>&gt; 148 et ≤ 235</td><td>32 %</td></tr><tr><td>Sévère</td><td>≤ 100</td><td>≤ 148</td><td>45 %</td></tr></table><p>Le tableau se lit de gauche à droite : plus le rapport est bas, plus l’oxygène franchit mal la barrière et plus la mortalité s’élève. Un patient intubé dont la PaO₂ vaut 75 mmHg sous FiO₂ 0,5 et PEEP 10 cm H₂O présente un rapport de 150 : SDRA modéré. <b>Erreur fréquente :</b> calculer le rapport sans noter la PEEP ni la FiO₂ réellement délivrée ; le chiffre perd alors toute valeur de classement.</p><p>La <button class="w" data-k="j80-definition-globale">définition globale publiée en 2024 (ce qui change et pourquoi)</button> prolonge Berlin sans la contredire. Elle admet le patient non intubé sous oxygène nasal à haut débit d’au moins 30 L/min, accepte le rapport SpO₂/FiO₂ lorsque la SpO₂ ne dépasse pas 97 %, reconnaît l’échographie pulmonaire comme imagerie et propose une variante pour les contextes aux ressources limitées. <button class="w" data-k="j80-contentieux-definition">Berlin ou définition globale : laquelle appliquer (arbitrage des sources)</button>. Chez un patient hospitalisé au-dessus de 1 000 m d’altitude, <button class="w" data-k="j80-altitude">la correction du rapport en altitude (formule et exemple)</button> s’applique.</p><div class="key"><b>À retenir.</b> Quatre critères : délai d’une semaine, imagerie bilatérale, origine non exclusivement cardiaque, hypoxémie chiffrée sous un support défini. La gravité se classe chez le patient intubé par le rapport PaO₂/FiO₂, ou SpO₂/FiO₂ si la SpO₂ ne dépasse pas 97 %.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22797452/" target="_blank" rel="noopener">Groupe de travail de la définition de Berlin (Ranieri et al.), JAMA 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., définition globale, Am J Respir Crit Care Med 2024, tableau 1</a>.</p></section>
<section class="ilot" id="j80-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>L’étude <button class="w" data-k="j80-lung-safe">LUNG SAFE (groupe d’essais de l’ESICM, 459 unités, 50 pays, hiver 2014)</button> reste la photographie internationale de référence. Le SDRA y concernait 10,4 % des admissions en soins intensifs et 23,4 % des patients ventilés mécaniquement. La mortalité hospitalière atteignait 34,9 % dans les formes légères, 40,3 % dans les formes modérées et 46,1 % dans les formes sévères.</p><p>La même étude révèle un défaut de reconnaissance : les cliniciens identifiaient le syndrome dans 51,3 % des formes légères et 78,5 % des formes sévères seulement. Or la reconnaissance conditionne le traitement : elle s’associait à une PEEP plus élevée, à la curarisation et au décubitus ventral. Dans l’ensemble, moins des deux tiers des patients recevaient un volume courant d’au plus 8 mL/kg de poids prédit, la pression de plateau n’était mesurée que chez 40,1 % d’entre eux, et 16,3 % seulement des formes sévères étaient placées en décubitus ventral. Un syndrome méconnu est un syndrome sous-traité.</p><p>Une partie de cette mortalité tient au terrain plus qu’au poumon. Dans une analyse secondaire de LUNG SAFE, 21 % des patients étaient immunodéprimés, avec une mortalité hospitalière de 52 % contre 36 % chez les autres. <b>Lacune nommée :</b> aucune incidence suisse du SDRA n’a été retrouvée dans une source publiée vérifiable ; les chiffres internationaux s’appliquent avec prudence aux unités suisses.</p><div class="key"><b>À retenir.</b> Un patient ventilé sur quatre remplit les critères du SDRA ; près d’un sur deux meurt dans les formes sévères. La sous-reconnaissance est la première cause évitable de sous-traitement.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26903337/" target="_blank" rel="noopener">Bellani et al., LUNG SAFE, JAMA 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., Nat Rev Dis Primers 2019, section épidémiologie</a>.</p></section>
<section class="ilot" id="j80-3"><h2><span class="n">3</span>Physiopathologie</h2><h3>La barrière normale</h3><p>L’échange gazeux exige une alvéole sèche. La barrière air-sang associe l’épithélium alvéolaire, un interstitium mince et l’endothélium capillaire ; elle offre une surface d’environ 120 m² pour une distance de l’ordre de 2 µm. Les <button class="w" data-k="j80-pneumocytes">pneumocytes de type I et de type II (rôles distincts)</button> forment un épithélium relié par des jonctions serrées, si étanche qu’il retient même les petits solutés. Le type II sécrète le <button class="w" data-k="j80-surfactant">surfactant (tension superficielle et stabilité alvéolaire)</button>. Les deux types cellulaires transportent les ions puis l’eau de l’alvéole vers l’interstitium, ce qui maintient les espaces aériens secs.</p><h3>La lésion : deux barrières rompues</h3><p>Une agression directe, bactérie, virus ou acide gastrique, lèse d’emblée l’épithélium ; une agression indirecte, comme le sepsis ou la pancréatite, agit par les cellules inflammatoires et leurs médiateurs. Dans les deux cas, les macrophages alvéolaires libèrent des chimiokines qui recrutent des <button class="w" data-k="j80-neutrophiles">polynucléaires neutrophiles (protéases, radicaux, pièges extracellulaires)</button>. La perméabilité accrue de l’endothélium laisse d’abord fuir le liquide et les protéines vers l’interstitium ; la lésion de l’épithélium le laisse ensuite envahir les alvéoles. Il en résulte un <button class="w" data-k="j80-oedeme-lesionnel">œdème riche en protéines (pourquoi il diffère de l’œdème cardiogénique)</button>, formé sans élévation primitive de la pression capillaire. L’hypoxémie, l’hypercapnie et l’infection grippale freinent en outre les canaux sodiques et la pompe sodium-potassium qui résorbent cet œdème.</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Alvéole normale et alvéole lésée du syndrome de détresse respiratoire aiguë" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><circle cx="170" cy="105" r="70"/><circle cx="510" cy="105" r="70"/><path d="M60 190h220M400 190h220"/><path d="M60 200h220M400 200h220" stroke-dasharray="4 3"/><path d="M455 75q55-25 110 0" stroke-width="5"/><path d="M445 120h130M450 140h120M460 158h100" stroke-dasharray="2 4"/></g><g fill="#222"><circle cx="470" cy="190" r="5"/><circle cx="520" cy="196" r="5"/><circle cx="565" cy="190" r="5"/><circle cx="505" cy="150" r="4"/><text x="105" y="22">Alvéole normale</text><text x="420" y="22">Alvéole lésée (phase exsudative)</text><text x="120" y="110">air, surfactant</text><text x="460" y="68">membrane hyaline</text><text x="455" y="112">œdème riche en protéines</text><text x="75" y="222">capillaire étanche</text><text x="400" y="222">capillaire perméable, neutrophiles</text></g></svg><figcaption>Figure 1 — L’alvéole normale est sèche et stabilisée par le surfactant. L’alvéole lésée est inondée d’un liquide protéique, bordée de membranes hyalines et envahie de neutrophiles. Schéma pédagogique original, non à l’échelle.</figcaption></figure><h3>Trois phases</h3><p>La <b>phase exsudative</b> occupe environ la première semaine : œdème interstitiel et alvéolaire, nécrose des pneumocytes de type I, dénudation de la membrane basale et <button class="w" data-k="j80-membranes-hyalines">membranes hyalines (dommage alvéolaire diffus)</button>. La <b>phase proliférative</b> lui succède : les pneumocytes de type II se multiplient pour recouvrir la membrane basale, et une fibrose interstitielle peut s’installer ; cette phase dure parfois plus de trois semaines chez les survivants. Les phases se chevauchent d’un territoire à l’autre.</p><h3>Le petit poumon aéré et ses conséquences</h3><p>Le poumon n’est pas atteint de façon homogène. Les zones non aérées prédominent dans les régions déclives, écrasées par le poids de l’œdème sus-jacent. <button class="w" data-k="j80-baby-lung">Le tissu encore aéré n’a que la taille d’un poumon d’enfant (concept de Gattinoni)</button> : il est petit, mais d’élasticité presque normale. La compliance, volume obtenu par centimètre d’eau de pression, baisse donc parce que le volume aéré diminue. Un volume courant ordinaire distend alors un poumon fonctionnel de 300 à 500 g. Les alvéoles inondées mais perfusées créent un <button class="w" data-k="j80-shunt">shunt (pourquoi l’oxygène corrige mal l’hypoxémie)</button> ; l’espace mort alvéolaire augmente et gêne l’élimination du CO₂.</p><p>La ventilation mécanique, indispensable, peut elle-même léser le poumon. La surdistension des zones aérées, l’ouverture et la fermeture cycliques des zones instables et la libération de médiateurs dans le sang constituent les <button class="w" data-k="j80-vili">lésions induites par la ventilation (volotraumatisme, atélectraumatisme, biotraumatisme)</button>. Toute la stratégie ventilatoire découle de ce constat.</p><div class="key"><b>À retenir.</b> Barrière perméable, œdème protéique, surfactant inactivé et petit poumon aéré : l’hypoxémie vient du shunt, la baisse de compliance de la petite taille du poumon aéré. La ventilation doit respecter ce petit poumon.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., Nat Rev Dis Primers 2019, sections mécanismes et physiopathologie</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32349261/" target="_blank" rel="noopener">Ochs et al., Int J Mol Sci 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15812622/" target="_blank" rel="noopener">Gattinoni et Pesenti, Intensive Care Med 2005</a>.</p><button class="pareto-btn ui" data-k="pareto-j80-meca">▲ Loi de Pareto — Définition, épidémiologie et mécanismes</button></section>
<section class="ilot" id="j80-4"><h2><span class="n">4</span>Causes directes et indirectes</h2><p>Le SDRA ne survient jamais seul : un facteur de risque le précède, et son identification conditionne à la fois le diagnostic et le traitement. La distinction entre causes directes et indirectes indique la porte d’entrée de la lésion.</p><table class="t"><tr><th>Mécanisme</th><th>Causes fréquentes</th><th>Causes plus rares</th></tr><tr><td>Direct (pulmonaire)</td><td><button class="w" data-k="j80-pneumonie-cause">Pneumonie bactérienne ou virale</button> ; inhalation de contenu gastrique, oral ou œsophagien</td><td>Noyade, inhalation de fumées, contusion thoracique, dysfonction primaire du greffon après transplantation pulmonaire</td></tr><tr><td>Indirect (extrapulmonaire)</td><td><button class="w" data-k="j80-sepsis-cause">Sepsis d’origine extrapulmonaire</button> (péritoine, voies urinaires, peau et tissus mous) ; traumatisme majeur, brûlures</td><td>Pancréatite aiguë ; <button class="w" data-k="j80-trali">transfusion (lésion pulmonaire aiguë post-transfusionnelle)</button> ; surdosage médicamenteux ; choc hémorragique, reperfusion après circulation extracorporelle</td></tr></table><p>Le tableau se lit à partir du patient : une toux fébrile précédant la dégradation oriente vers une cause directe ; une hypoxémie apparue deux jours après une pancréatite oriente vers une cause indirecte. La fréquence relative de ces causes varie selon la région et le système de soins. <b>Erreur fréquente :</b> oublier une transfusion des six heures précédentes ou une inhalation passée inaperçue chez un patient dont la vigilance est altérée.</p><p>Plusieurs expositions augmentent la susceptibilité : consommation abusive d’alcool, tabagisme, pollution atmosphérique et hypoalbuminémie. Aucun locus génétique n’a atteint le seuil de signification à l’échelle du génome, probablement en raison de l’hétérogénéité des causes.</p><div class="key"><b>À retenir.</b> Chercher la cause fait partie du traitement : antibiotique pour une pneumonie, drainage d’un foyer septique, arrêt d’une transfusion suspecte. L’anamnèse doit retrouver cette cause et dater le début.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., Nat Rev Dis Primers 2019, introduction et facteurs de risque</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., définition globale 2024</a>.</p></section>
<section class="ilot" id="j80-5"><h2><span class="n">5</span>Anamnèse</h2><p>L’anamnèse poursuit deux buts : retrouver le facteur de risque et dater la dégradation, puis rechercher une explication cardiaque ou une maladie qui imiterait le syndrome. Chez un patient trop dyspnéique pour parler, l’entourage, le dossier et les soignants fournissent l’essentiel.</p><p><b>Antécédents et contexte.</b> Le médecin recherche une <button class="w" data-k="j80-atcd-cardiaques">cardiopathie connue (risque d’œdème hydrostatique)</button>, une transfusion récente, une immunodépression, une chimiothérapie ou un médicament pneumotoxique, une exposition toxique, la consommation d’alcool et le tabagisme. Il note aussi l’état fonctionnel antérieur et les volontés du patient, que l’équipe et la famille intégreront aux décisions.</p><p><b>Symptômes.</b> La dyspnée s’aggrave en heures ou en jours, par définition dans la semaine qui suit l’agression ou l’apparition des symptômes respiratoires. Les symptômes de la cause l’accompagnent : fièvre et toux dans une pneumonie, douleur abdominale dans une pancréatite. Les voyages et les expositions orientent vers des germes inhabituels.</p><div class="two"><div class="card"><b>Forme typique.</b> Dyspnée croissante dans les jours qui suivent une pneumonie ou un choc septique, hypoxémie persistante sous oxygène, opacités bilatérales, sans argument cardiaque.</div><div class="card"><b>Formes trompeuses.</b> Hypoxémie apparue au cours d’une ventilation pour une autre cause ; dégradation après une transfusion ; absence de facteur de risque, qui doit faire chercher une maladie imitatrice ; patient sédaté sans plainte exprimée.</div></div><div class="key"><b>À retenir.</b> Le délai entre l’agression et la dégradation n’excède pas une semaine. L’absence de facteur de risque fragilise le diagnostic et impose de chercher une cardiopathie ou une maladie imitatrice.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., définition globale 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, bilan diagnostique</a> ; <a href="https://www.sgi-ssmi.ch/fr/recommendations-choosing-wisely-soins-intensifs" target="_blank" rel="noopener">SSMI, Choosing wisely soins intensifs, recommandation 1, version du 10.01.2023</a>.</p></section>
<section class="ilot" id="j80-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen évalue d’abord la menace vitale, puis cherche la cause. Il ne distingue pas, à lui seul, un SDRA d’un œdème cardiogénique : même la radiographie montre des opacités alvéolaires bilatérales comparables dans les deux situations. Il oriente les examens qui trancheront.</p><div class="two"><div class="card"><b>État général et constantes.</b> Fréquence respiratoire, travail respiratoire et vigilance ; <button class="w" data-k="j80-spo2-clinique">SpO₂ notée avec le débit et la FiO₂ (lecture et pièges)</button> ; fréquence cardiaque, pression artérielle et signes d’hypoperfusion, car un sepsis ou un choc accompagne souvent le syndrome et en est parfois la cause.</div><div class="card"><b>Signes ciblés.</b> Recherche du foyer causal : condensation pulmonaire, abdomen chirurgical, peau et tissus mous, cathéters ; recherche d’une surcharge hydrique ; mesure de la taille, indispensable au calcul du <button class="w" data-k="j80-poids-predit">poids prédit (formule et piège de l’obésité)</button>.</div></div><p>La taille doit être mesurée dès l’admission. Elle détermine le volume courant, car la taille du poumon sain dépend de la taille et du sexe, non du poids ; le poids réel ne doit jamais servir à ce calcul.</p><div class="key"><b>À retenir.</b> L’examen cherche la cause et les signes de choc ; il ne tranche pas l’origine de l’œdème. La taille mesurée prépare la ventilation protectrice.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, figure 6 et section volume courant</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">Grasselli et al., recommandations ESICM 2023</a>.</p><button class="pareto-btn ui" data-k="pareto-j80-clin">▲ Loi de Pareto — Causes, anamnèse et examen</button></section>
