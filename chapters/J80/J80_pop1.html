<template data-pop="j80-q-decisions" data-title="Quatre décisions devant une hypoxémie bilatérale aiguë"><p class="lab">Ordre</p><p>Le médecin assure d’abord l’oxygénation et décide du lieu de soins. Il recherche ensuite une origine cardiaque, puis la cause du syndrome. Il choisit enfin la stratégie ventilatoire.</p><p class="lab">Raison de cet ordre</p><p>L’hypoxémie menace la vie en minutes ; l’œdème hydrostatique se traite autrement ; la cause non traitée entretient la lésion ; la ventilation protectrice se règle sur le diagnostic posé.</p><div class="key"><b>Limite.</b> Chez le patient instable, ces décisions sont simultanées : l’échocardiographie et l’échographie pulmonaire au lit répondent souvent en quelques minutes aux deux premières.</div></template>
<template data-pop="j80-definition-globale" data-title="Définition globale du SDRA (2024)"><p class="lab">Origine</p><p>Une conférence de consensus de 32 experts a tenu six réunions entre juin 2021 et mars 2022, puis recueilli l’avis de membres de 21 sociétés de soins intensifs, sans demande d’approbation officielle. Le texte a paru en janvier 2024 ; il ne constitue pas un document officiel d’une société savante.</p><p class="lab">Quatre changements</p><p>1) Le patient sous oxygène nasal à haut débit d’au moins 30 L/min peut être classé SDRA sans intubation. 2) Le rapport SpO₂/FiO₂ ≤ 315 peut remplacer la gazométrie si la SpO₂ ne dépasse pas 97 %. 3) L’échographie pulmonaire, réalisée par un opérateur formé, devient une imagerie acceptée. 4) Dans les contextes aux ressources limitées, ni PEEP, ni débit minimal, ni dispositif particulier ne sont exigés.</p><p class="lab">Conséquence clinique</p><p>Le syndrome est reconnu plus tôt, avant l’intubation, ce qui permet d’anticiper la surveillance et l’orientation.</p><div class="key"><b>Limite.</b> Les auteurs demandent une validation prospective de sa faisabilité, de sa fiabilité et de sa valeur pronostique. Les essais qui fondent les traitements ont inclus des patients définis par les critères antérieurs.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., Am J Respir Crit Care Med 2024;209:37-47</a>.</p></template>
<template data-pop="j80-contentieux-definition" data-title="Arbitrage : Berlin 2012 ou définition globale 2024"><p class="lab">Source la plus récente</p><p>La définition globale (janvier 2024) est la source primaire la plus récente. Elle est retenue pour reconnaître le syndrome, notamment chez le patient non intubé sous haut débit et lorsque seule la SpO₂ est disponible.</p><p class="lab">Texte antérieur toujours en vigueur</p><p>La <a href="https://pubmed.ncbi.nlm.nih.gov/22797452/" target="_blank" rel="noopener">définition de Berlin (JAMA 2012)</a>, initiative de l’ESICM, reste celle des grands essais thérapeutiques. Ses seuils de PaO₂/FiO₂ chez l’intubé sont repris à l’identique.</p><p class="lab">Position européenne</p><p>Les recommandations ESICM 2023 ont discuté l’extension de la définition aux patients sous haut débit sans en faire une recommandation numérotée ; elles ont évalué le haut débit chez tous les patients en insuffisance respiratoire hypoxémique aiguë, en notant que 93 % des patients de la COVID-19 traités ainsi puis intubés remplissaient les critères de Berlin.</p><div class="key"><b>Conséquence pratique.</b> Le patient intubé se classe de la même façon par les deux textes. Le patient non intubé sous haut débit est un SDRA selon la définition globale ; il reçoit alors les traitements validés dans cette situation et une surveillance de l’échec.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">Grasselli et al., ESICM 2023, domaines 1 et 3</a>.</p></template>
<template data-pop="j80-altitude" data-title="Correction du rapport en altitude"><p class="lab">Règle</p><p>Au-dessus de 1 000 m, la définition globale corrige le rapport : (PaO₂ ou SpO₂)/FiO₂ × pression barométrique / 760.</p><p class="lab">Mécanisme</p><p>La pression barométrique basse abaisse la pression inspirée en oxygène à FiO₂ égale ; sans correction, un poumon de même gravité paraîtrait plus atteint en montagne qu’en plaine.</p><p class="lab">Exemple</p><p>PaO₂ 70 mmHg sous FiO₂ 0,4, pression barométrique mesurée 630 mmHg : 175 × 630/760 ≈ 145.</p><div class="key"><b>Piège.</b> La correction déplace parfois le patient d’un seuil de décision, comme celui de 150 qui déclenche le décubitus ventral. Utiliser la pression barométrique mesurée, non une valeur supposée.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., 2024, tableau 1</a>.</p></template>
<template data-pop="j80-lung-safe" data-title="Étude LUNG SAFE (hiver 2014, publiée en 2016)"><p class="lab">Plan</p><p>Cohorte prospective de quatre semaines consécutives pendant l’hiver 2014, dans un échantillon de convenance de 459 unités de soins intensifs de 50 pays, menée avec le groupe d’essais de l’ESICM ; 29 144 admissions analysées.</p><p class="lab">Résultats</p><p>Le SDRA touchait 10,4 % des admissions et 23,4 % des patients ventilés ; formes légères 30,0 %, modérées 46,6 %, sévères 23,4 %. Mortalité hospitalière : 34,9 %, 40,3 % et 46,1 %. Reconnaissance clinique : 51,3 % à 78,5 % selon la gravité ; plateau mesuré chez 40,1 % ; PEEP inférieure à 12 cm H₂O chez 82,6 % ; décubitus ventral chez 16,3 % des formes sévères.</p><div class="key"><b>Limite.</b> Échantillon de convenance, courte période, définition de Berlin. Les pratiques ont pu évoluer depuis, notamment après la pandémie de COVID-19.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/26903337/" target="_blank" rel="noopener">Bellani et al., JAMA 2016;315:788-800</a>.</p></template>
<template data-pop="j80-pneumocytes" data-title="Pneumocytes de type I et de type II"><p class="lab">Type I</p><p>Cellules très minces qui tapissent la plus grande partie de la surface alvéolaire et permettent l’échange gazeux. Leur atteinte est précoce et souvent spectaculaire dans le SDRA, avec dénudation de la membrane basale.</p><p class="lab">Type II</p><p>Cellules cuboïdes qui synthétisent, sécrètent et recyclent le surfactant. Comme les cellules de type I, elles transportent les ions et l’eau hors de l’alvéole grâce aux canaux sodiques et à la pompe sodium-potassium. Elles prolifèrent pour recouvrir la membrane basale lors de la réparation.</p><div class="key"><b>Conséquence clinique.</b> La résorption de l’œdème exige un épithélium fonctionnel ; l’hypoxémie, l’hypercapnie et la grippe freinent ce transport, ce qui prolonge l’œdème.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37761330/" target="_blank" rel="noopener">Dushianthan et al., 2023</a>.</p></template>
<template data-pop="j80-surfactant" data-title="Surfactant : stabilité alvéolaire"><p class="lab">Définition</p><p>Mélange de phospholipides, de protéines et de lipides neutres qui abaisse la tension superficielle à l’interface air-liquide de l’alvéole.</p><p class="lab">Mécanisme</p><p>Selon la loi de Laplace, la pression de distension vaut deux fois la tension divisée par le rayon. Une tension très basse lors de la compression expiratoire réduit les gradients de pression et prévient le collapsus prématuré des espaces aériens.</p><p class="lab">Dans le SDRA</p><p>Les protéines plasmatiques de l’œdème déstabilisent le film, le stress oxydant et les phospholipases dégradent ses constituants : les alvéoles se collabent.</p><div class="key"><b>Limite.</b> Le surfactant exogène, standard chez le prématuré, n’a pas réduit la mortalité de l’adulte dans onze essais randomisés réunissant 3 038 patients.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37761330/" target="_blank" rel="noopener">Dushianthan et al., 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30626363/" target="_blank" rel="noopener">Meng et al., 2019</a>.</p></template>
<template data-pop="j80-neutrophiles" data-title="Polynucléaires neutrophiles et lésion alvéolaire"><p class="lab">Recrutement</p><p>Les macrophages alvéolaires libèrent l’interleukine 8 et d’autres chimiokines qui attirent neutrophiles et monocytes vers l’alvéole, en particulier lors d’une infection pulmonaire.</p><p class="lab">Mécanisme lésionnel</p><p>En traversant l’épithélium, les neutrophiles libèrent protéases, espèces réactives de l’oxygène et pièges extracellulaires. Ces médiateurs tuent les germes mais lèsent l’épithélium et l’endothélium.</p><div class="key"><b>Conséquence.</b> Une agression directe est toujours amplifiée par cette seconde vague inflammatoire. Le lavage broncho-alvéolaire du SDRA est riche en neutrophiles, ce qui ne permet pas, seul, de distinguer une pneumonie d’un SDRA d’autre cause.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, figure 3</a>.</p></template>
<template data-pop="j80-oedeme-lesionnel" data-title="Œdème lésionnel et œdème hydrostatique"><p class="lab">Œdème hydrostatique</p><p>Dans l’insuffisance cardiaque ou la surcharge, la pression capillaire pulmonaire s’élève ; une barrière intacte laisse filtrer un liquide pauvre en protéines (rapport protéines œdème/plasma &lt; 0,65).</p><p class="lab">Œdème lésionnel</p><p>Dans le SDRA, la perméabilité accrue laisse passer les protéines, les neutrophiles et les hématies (rapport &gt; 0,65). Le taux élevé de protéines dans le liquide d’œdème a confirmé chez l’homme la rupture de la barrière.</p><p class="lab">Conséquence clinique</p><p>Toute élévation de la pression capillaire majore fortement l’œdème lésionnel : c’est le fondement de la restriction hydrique après le choc.</p><div class="key"><b>Piège.</b> Les deux mécanismes coexistent souvent : un patient septique, cardiaque et abondamment rempli peut cumuler lésion et surcharge.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a>.</p></template>
<template data-pop="j80-membranes-hyalines" data-title="Membranes hyalines et dommage alvéolaire diffus"><p class="lab">Définition</p><p>Dépôts éosinophiles qui bordent les alvéoles dont la membrane basale est dénudée ; des leucocytes y sont enchâssés. Ils définissent le dommage alvéolaire diffus, lésion classique de la phase exsudative.</p><p class="lab">Valeur</p><p>Dans une série espagnole de 712 autopsies, 356 patients remplissaient les critères cliniques de Berlin : le dommage alvéolaire diffus n’était présent que chez 45 % d’entre eux, 12 % des formes légères, 40 % des modérées et 58 % des sévères, et 69 % des formes sévères depuis plus de 72 heures.</p><div class="key"><b>Conséquence.</b> Le SDRA clinique regroupe des lésions hétérogènes. Une maladie imitatrice traitable doit être recherchée en l’absence de facteur de risque.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/23370917/" target="_blank" rel="noopener">Thille et al., Am J Respir Crit Care Med 2013;187:761-7</a>.</p></template>
<template data-pop="j80-baby-lung" data-title="Le petit poumon aéré (« baby lung »)"><p class="lab">Observation</p><p>La tomodensitométrie montre que le tissu normalement aéré d’un poumon de SDRA pèse souvent 300 à 500 g, soit la dimension du poumon d’un enfant de cinq à six ans.</p><p class="lab">Mécanisme</p><p>La compliance du système respiratoire varie linéairement avec ce volume aéré. Le poumon n’est donc pas surtout rigide : il est petit, et son élasticité intrinsèque reste presque normale. La redistribution des densités en décubitus ventral montre que ce petit poumon est une notion fonctionnelle, non anatomique.</p><div class="key"><b>Conséquence.</b> Le danger tient moins au rapport volume courant/kilogramme qu’au rapport volume courant/poumon aéré ; d’où l’intérêt de la pression motrice, qui intègre la compliance.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/15812622/" target="_blank" rel="noopener">Gattinoni et Pesenti, Intensive Care Med 2005;31:776-84</a>.</p></template>
<template data-pop="j80-shunt" data-title="Shunt dans le SDRA"><p class="lab">Mécanisme</p><p>Une alvéole inondée ou collabée reste perfusée sans être ventilée. Le sang qui la traverse garde la composition du sang veineux et dilue le sang oxygéné des alvéoles saines ; les inégalités de ventilation-perfusion s’y ajoutent.</p><p class="lab">Conséquence</p><p>Augmenter la FiO₂ n’oxygène pas le sang qui ne rencontre jamais d’air : l’hypoxémie répond mal à l’oxygène. La PEEP, qui recrute des alvéoles, et le décubitus ventral, qui améliore l’appariement ventilation-perfusion, agissent là où l’oxygène seul échoue.</p><div class="key"><b>Renvoi.</b> Les mécanismes de l’hypoxémie et leur réponse à l’oxygène sont développés dans le cours <a href="#/entry/J96">J96 — Insuffisance respiratoire aiguë et chronique</a>.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33169218/" target="_blank" rel="noopener">Guérin et al., 2020</a>.</p></template>
<template data-pop="j80-vili" data-title="Lésions induites par la ventilation"><p class="lab">Volotraumatisme</p><p>Un volume excessif pour le petit poumon aéré provoque une surdistension régionale.</p><p class="lab">Atélectraumatisme</p><p>L’ouverture et la fermeture répétées d’alvéoles instables, favorisées par la dysfonction du surfactant, la gravité et l’hétérogénéité de la lésion, créent des contraintes aux zones de transition.</p><p class="lab">Biotraumatisme</p><p>L’étirement libère des médiateurs : dans l’essai ARDSNet, la ventilation protectrice a réduit les taux plasmatiques d’interleukine 6 et d’interleukine 8 ainsi qu’un marqueur de lésion épithéliale.</p><div class="key"><b>Conséquence.</b> Petit volume, plateau limité, pression motrice basse et PEEP adaptée visent chacun l’une de ces lésions ; l’essai ARDSNet en a montré l’effet sur la mortalité.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">ESICM 2023, domaine PEEP</a>.</p></template>
<template data-pop="j80-pneumonie-cause" data-title="Pneumonie, première cause de SDRA"><p class="lab">Mécanisme</p><p>Bactéries et virus lèsent l’épithélium directement ou par l’inflammation qu’ils déclenchent ; une surinfection bactérienne peut suivre une infection virale.</p><p class="lab">Conduite</p><p>Hémocultures, examen direct et culture des prélèvements respiratoires guident le traitement ; le lieu d’acquisition, communautaire ou associé aux soins, les comorbidités, les expositions et les voyages orientent vers les germes probables. Plus de la moitié des patients restent sans germe identifié, même après lavage.</p><div class="key"><b>Renvoi.</b> Le choix de l’antibiotique relève du cours <a href="#/entry/J18">J18 — Pneumonie</a> ; la grippe, du cours <a href="#/entry/J09">J09 — Grippe</a>.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, bilan diagnostique</a>.</p></template>
<template data-pop="j80-sepsis-cause" data-title="Sepsis extrapulmonaire et SDRA"><p class="lab">Mécanisme</p><p>Dans le sepsis d’origine péritonéale, urinaire ou cutanée, les cellules inflammatoires et leurs produits lèsent la barrière à distance du foyer ; la perméabilité capillaire laisse d’abord fuir le liquide vers l’interstitium.</p><p class="lab">Conduite</p><p>Le contrôle du foyer et l’antibiothérapie précoce sont des traitements du SDRA. Le remplissage nécessaire au choc doit être réévalué dès la stabilisation, puis la stratégie devient restrictive.</p><div class="key"><b>Piège.</b> Un SDRA d’origine abdominale peut être pris pour une pneumonie : les opacités bilatérales ne localisent pas la cause.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a>.</p></template>
<template data-pop="j80-trali" data-title="Lésion pulmonaire aiguë post-transfusionnelle"><p class="lab">Définition</p><p>Le TRALI est un œdème pulmonaire lésionnel survenant pendant la transfusion ou dans les six heures qui suivent. La redéfinition consensuelle de 2019 distingue le type I, sans facteur de risque de SDRA, et le type II, avec facteur de risque ou SDRA léger préexistant ; une dégradation déjà en cours dans les douze heures précédant la transfusion fait classer le cas comme SDRA.</p><p class="lab">Mécanisme</p><p>Des anticorps du donneur, anti-HLA de classe II ou anti-antigènes neutrophiles, activent les neutrophiles du receveur. L’exclusion du plasma et du sang total de donneuses a fortement réduit l’incidence.</p><p class="lab">Données suisses</p><p>En 2024, Swissmedic a reçu des déclarations de TRALI au taux de 0,4 pour 100 000 transfusions, contre 14 pour 100 000 pour la surcharge circulatoire associée à la transfusion (TACO), œdème hydrostatique environ trente-cinq fois plus fréquent.</p><div class="key"><b>Conduite.</b> Arrêter la transfusion, soutenir la respiration et déclarer l’événement au système d’hémovigilance, que la loi sur les produits thérapeutiques rend obligatoire pour tout fait grave.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30993745/" target="_blank" rel="noopener">Vlaar et al., Transfusion 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a> ; <a href="https://www.swissmedic.ch/swissmedic/fr/home/medicaments-a-usage-humain/surveillance-du-marche/haemovigilance/haemovigilance-publications-events/haemovigilance-report-2024.html" target="_blank" rel="noopener">Swissmedic, Hémovigilance, rapport annuel 2024</a> ; <a href="https://www.swissmedic.ch/swissmedic/fr/home/medicaments-a-usage-humain/surveillance-du-marche/haemovigilance/haemovigilance-meldesystem/was-melden.html" target="_blank" rel="noopener">Swissmedic, ce qu’il faut déclarer</a>.</p></template>
<template data-pop="j80-atcd-cardiaques" data-title="Antécédents cardiaques et SDRA"><p class="lab">Pourquoi les rechercher</p><p>Une cardiopathie gauche ou une surcharge hydrique produisent un œdème pulmonaire bilatéral qui imite le SDRA ; à la radiographie, les deux tableaux peuvent être indiscernables.</p><p class="lab">Piège</p><p>Une maladie cardiaque connue n’exclut pas le SDRA : la définition exige seulement que l’œdème ne soit pas attribuable exclusivement ou principalement à la défaillance cardiaque, et le SDRA peut être retenu en présence d’une cardiopathie si un facteur de risque est présent.</p><div class="key"><b>Conséquence.</b> L’échocardiographie, et non l’anamnèse seule, juge la part cardiaque.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">définition globale 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, figure 6</a>.</p></template>
<template data-pop="j80-spo2-clinique" data-title="Saturation pulsée sous oxygène"><p class="lab">Lecture</p><p>Une SpO₂ de 92 % sous FiO₂ 0,6 traduit une hypoxémie bien plus grave que la même valeur à l’air ambiant : la saturation se note toujours avec la FiO₂ ou le débit délivré.</p><p class="lab">Conditions de validité</p><p>Patient au repos, au moins 30 minutes après un changement de position, de FiO₂ ou de débit ; onde de pouls correcte ; SpO₂ ≤ 97 % pour le calcul du rapport SpO₂/FiO₂.</p><div class="key"><b>Piège.</b> Une hypoxémie occulte (saturation artérielle réelle &lt; 88 % malgré une SpO₂ de 92 à 96 %) est jusqu’à quatre fois plus fréquente chez les patients noirs que chez les patients blancs ; l’oxymétrie n’est pas recommandée en cas de carboxyhémoglobine ou de méthémoglobine suspectée. La gazométrie confirme lorsque la décision en dépend.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., 2024, tableau 1 et discussion</a>.</p></template>
<template data-pop="j80-poids-predit" data-title="Poids prédit : formule et pièges"><p class="lab">Formule</p><p>Protocole ARDSNet, en pouces : homme 50 + 2,3 × (taille − 60), femme 45,5 + 2,3 × (taille − 60). Converti en centimètres : homme 50 + 0,91 × (taille en cm − 152,4) ; femme 45,5 + 0,91 × (taille en cm − 152,4).</p><p class="lab">Exemple</p><p>Une femme de 165 cm a un poids prédit de 45,5 + 0,91 × 12,6 ≈ 57 kg ; 6 mL/kg donnent environ 340 mL.</p><p class="lab">Raison</p><p>Le poids prédit estime la taille du poumon sain, qui dépend de la taille et du sexe, non du poids. Un patient obèse de 130 kg mesurant 170 cm a le poumon d’un individu d’environ 66 kg.</p><div class="key"><b>Piège.</b> Calculer le volume sur le poids réel expose à une surdistension, surtout chez la femme petite et chez l’obèse. La taille doit être mesurée, non déclarée.</div><p class="src">Références : <a href="https://www.ardsnet.org/files/ventilator_protocol_2008-07.pdf" target="_blank" rel="noopener">Protocole de ventilation de l’essai ARDSNet (version 2008)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a>.</p></template>
<template data-pop="j80-gazometrie" data-title="Gazométrie artérielle dans le SDRA"><p class="lab">Rôle</p><p>Elle mesure la PaO₂, la PaCO₂ et le pH ; elle est la référence pour le rapport PaO₂/FiO₂ et pour surveiller l’hypercapnie permissive.</p><p class="lab">Calcul</p><p>PaO₂ en mmHg divisée par la FiO₂ en fraction : 72 mmHg sous 0,8 donnent 90, soit un SDRA sévère. Si la PaO₂ est exprimée en kPa, la multiplier par 7,5 pour obtenir des mmHg.</p><div class="key"><b>Piège.</b> Le rapport n’a de valeur qu’avec une FiO₂ connue, une PEEP notée, une mesure au repos et, au-dessus de 1 000 m, une correction barométrique.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., 2024</a>. Renvoi : <a href="#/entry/J96">J96 — Insuffisance respiratoire aiguë et chronique</a>.</p></template>
<template data-pop="j80-echo-pulmonaire" data-title="Échographie pulmonaire"><p class="lab">Signes</p><p>Lignes B multiples ou consolidations bilatérales traduisent une perte d’aération ; les anomalies de la ligne pleurale orientent vers un œdème non cardiogénique.</p><p class="lab">Valeur</p><p>La définition globale accepte ces signes comme critère d’imagerie, surtout en l’absence de radiographie. Leur seule présence est sensible mais modérément spécifique ; l’association aux anomalies pleurales améliore la spécificité.</p><div class="key"><b>Limite.</b> L’examen dépend de l’opérateur, qui doit être formé ; la concordance entre opérateurs reste à établir.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/37487152/" target="_blank" rel="noopener">Matthay et al., 2024</a>.</p></template>
<template data-pop="j80-echocardiographie" data-title="Échocardiographie : juger la part cardiaque"><p class="lab">Ce qu’elle cherche</p><p>Une dysfonction gauche, une valvulopathie significative ou des pressions de remplissage élevées orientent vers un œdème hydrostatique. La définition de Berlin la recommande en l’absence de facteur de risque clair.</p><p class="lab">Ce qu’elle surveille</p><p>Un ventricule droit dilaté avec dyskinésie septale signe un cœur pulmonaire aigu, complication du SDRA.</p><div class="key"><b>Piège.</b> Un ventricule gauche altéré n’exclut pas le SDRA s’il ne suffit pas à expliquer l’œdème et qu’un facteur de risque est présent.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26650055/" target="_blank" rel="noopener">Mekontso Dessap et al., 2016</a>.</p></template>
<template data-pop="j80-lba" data-title="Lavage broncho-alvéolaire"><p class="lab">Indications</p><p>Identifier le germe lorsque les prélèvements simples sont négatifs, ou démasquer une maladie imitatrice lorsqu’aucun facteur de risque de SDRA n’est retrouvé.</p><p class="lab">Lecture</p><p>Formule cellulaire : neutrophiles dans le SDRA et la pneumonie ; éosinophilie dans la pneumonie aiguë à éosinophiles ; liquide de plus en plus hémorragique sur les aliquotes successives dans l’hémorragie alvéolaire.</p><div class="key"><b>Limite.</b> Plus de la moitié des patients restent sans germe identifié malgré le lavage ; les tests d’amplification génique ne distinguent pas l’agent causal d’un colonisant.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a>.</p></template>
<template data-pop="j80-oedeme-cardiogenique" data-title="Œdème pulmonaire cardiogénique"><p class="lab">Mécanisme</p><p>L’élévation des pressions vasculaires pulmonaires force un liquide pauvre en protéines vers l’interstitium puis les alvéoles.</p><p class="lab">Arguments</p><p>Cardiopathie connue, surcharge, absence de facteur de risque de SDRA, dysfonction gauche à l’échocardiographie ; un peptide natriurétique élevé va dans le même sens.</p><div class="key"><b>Conséquence.</b> Ce diagnostic change le traitement : il relève de la prise en charge de l’insuffisance cardiaque aiguë, développée dans le fragment de cardiologie.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a>.</p></template>
<template data-pop="j80-hemorragie-alveolaire" data-title="Hémorragie intra-alvéolaire"><p class="lab">Pourquoi y penser</p><p>Elle figure parmi les maladies qui imitent le SDRA et exigent un traitement spécifique ; elle se cherche dès qu’aucun facteur de risque n’est retrouvé.</p><p class="lab">Indices</p><p>Lavage de plus en plus hémorragique sur les aliquotes successives, chute de l’hémoglobine, hémoptysie inconstante.</p><div class="key"><b>Conséquence.</b> Ne pas la reconnaître prive le patient du traitement de sa cause. Sa prise en charge relève des cours consacrés aux vascularites.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, section diagnostic</a>.</p></template>
<template data-pop="j80-echec-non-invasif" data-title="Échec du support non invasif"><p class="lab">Signes</p><p>Hypoxémie qui persiste malgré un haut débit et une FiO₂ élevée, travail respiratoire croissant, troubles de la vigilance, instabilité hémodynamique, intolérance du dispositif.</p><p class="lab">Mécanisme du danger</p><p>Chez un patient qui respire spontanément avec une forte commande ventilatoire, des pressions transpulmonaires élevées peuvent aggraver la lésion ; c’est une hypothèse physiologique, non une preuve clinique.</p><div class="key"><b>Conduite.</b> Le seuil optimal d’intubation et les inconvénients d’un retard ne sont pas définis : la réévaluation se fait donc rapprochée, en soins intensifs. Les critères d’échec sont détaillés dans le cours <a href="#/entry/J96">J96 — Insuffisance respiratoire aiguë et chronique</a>.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, sections curarisation et support non invasif</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">ESICM 2023, domaine 3</a>.</p></template>
<template data-pop="j80-coeur-pulmonaire" data-title="Cœur pulmonaire aigu"><p class="lab">Mécanisme</p><p>La postcharge du ventricule droit augmente pendant le SDRA ; ce ventricule à paroi mince se dilate.</p><p class="lab">Données</p><p>Dans une cohorte de 752 SDRA modérés à sévères explorés par échocardiographie transœsophagienne, la prévalence était de 22 %. Quatre facteurs formaient un score de risque : pneumonie comme cause, pression motrice ≥ 18 cm H₂O, PaO₂/FiO₂ &lt; 150 mmHg, PaCO₂ ≥ 48 mmHg. La forme sévère s’associait à une mortalité hospitalière de 57 % contre 42 %, et le décubitus ventral était protecteur.</p><div class="key"><b>Conduite.</b> Rechercher le cœur pulmonaire par échocardiographie, limiter la pression motrice et l’hypercapnie, recourir au décubitus ventral ; un vasodilatateur pulmonaire inhalé peut se discuter lorsque la défaillance droite participe à l’état de choc.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26650055/" target="_blank" rel="noopener">Mekontso Dessap et al., Intensive Care Med 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a>.</p></template>
<template data-pop="j80-ardsnet" data-title="Essai ARDSNet (2000)"><p class="lab">Question</p><p>Un volume courant réduit diminue-t-il la mortalité de la lésion pulmonaire aiguë et du SDRA ?</p><p class="lab">Plan et résultats</p><p>861 patients : volume initial de 6 mL/kg de poids prédit et plateau ≤ 30 cm H₂O, contre 12 mL/kg et plateau ≤ 50 cm H₂O. Volumes réellement délivrés 6,2 et 11,8 mL/kg ; plateaux 25 et 33 cm H₂O. Mortalité 31,0 % contre 39,8 % ; jours sans ventilation 12 contre 10. L’essai a été arrêté pour efficacité.</p><div class="key"><b>Limite.</b> Le volume du groupe témoin ne peut plus être considéré comme conventionnel ; aucun nouvel essai n’a porté sur cette question depuis plus de dix ans. L’ESICM 2023 maintient une recommandation forte pour 4 à 8 mL/kg.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/10793162/" target="_blank" rel="noopener">ARDSNet, N Engl J Med 2000;342:1301-8</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">ESICM 2023, domaine 5</a>.</p></template>
<template data-pop="j80-driving-pressure" data-title="Pression motrice"><p class="lab">Définition</p><p>Pression de plateau moins PEEP ; elle équivaut au volume courant divisé par la compliance du système respiratoire, donc au volume rapporté au poumon fonctionnel.</p><p class="lab">Preuve</p><p>Dans une analyse des données individuelles de 3 562 patients issus de neuf essais, la pression motrice était la variable ventilatoire la plus liée à la survie : une hausse d’un écart-type, environ 7 cm H₂O, s’associait à un risque relatif de décès de 1,41, même sous plateau et volume « protecteurs ».</p><div class="key"><b>Limite.</b> Il s’agit d’une association, non d’un essai randomisé de cible ; aucun seuil universellement sûr n’a été validé. La mesure n’est valable que chez le patient passif.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25693014/" target="_blank" rel="noopener">Amato et al., N Engl J Med 2015;372:747-55</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a>.</p></template>
<template data-pop="j80-hypercapnie-permissive" data-title="Hypercapnie permissive"><p class="lab">Principe</p><p>Le petit volume courant réduit la ventilation alvéolaire ; le clinicien accepte une PaCO₂ élevée plutôt que d’augmenter le volume et de léser le poumon. L’hypercapnie et l’acidose respiratoire sont bien tolérées si l’oxygénation est assurée.</p><p class="lab">Seuils du protocole ARDSNet</p><p>Objectif de pH 7,30 à 7,45. Entre 7,15 et 7,30, augmenter la fréquence jusqu’à 35 par minute ; au-dessous de 7,15, le volume courant peut être augmenté par paliers de 1 mL/kg, quitte à dépasser le plateau de 30 cm H₂O, et du bicarbonate de sodium peut être administré.</p><div class="key"><b>Limite.</b> Les cibles optimales de PaCO₂ ne sont pas définies dans le SDRA ; l’hypercapnie freine en outre la prolifération épithéliale et la résorption de l’œdème, et elle figure parmi les facteurs de risque de cœur pulmonaire aigu.</div><p class="src">Références : <a href="https://www.ardsnet.org/files/ventilator_protocol_2008-07.pdf" target="_blank" rel="noopener">Protocole ARDSNet (2008)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">ESICM 2023, domaine 5</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26650055/" target="_blank" rel="noopener">Mekontso Dessap et al., 2016</a>.</p></template>
<template data-pop="j80-cible-oxygene" data-title="Cible d’oxygénation"><p class="lab">Repère</p><p>Le protocole ARDSNet vise une PaO₂ de 55 à 80 mmHg ou une SpO₂ de 88 à 95 %, avec une PEEP minimale de 5 cm H₂O.</p><p class="lab">Essai LOCO2 (2020)</p><p>Essai français de 205 patients : cible basse (PaO₂ 55 à 70 mmHg, SpO₂ 88 à 92 %) contre cible libérale (PaO₂ 90 à 105 mmHg, SpO₂ ≥ 96 %) pendant 7 jours. Arrêt prématuré pour raisons de sécurité : mortalité à 90 jours 44,4 % contre 30,4 %, et cinq ischémies mésentériques dans le groupe à cible basse.</p><div class="key"><b>Conséquence.</b> La cible optimale n’est pas définie ; viser délibérément la borne inférieure n’est pas justifié. L’hyperoxie a aussi un coût, car elle oxyde le surfactant.</div><p class="src">Références : <a href="https://www.ardsnet.org/files/ventilator_protocol_2008-07.pdf" target="_blank" rel="noopener">Protocole ARDSNet (2008)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32160661/" target="_blank" rel="noopener">Barrot et al., LOCO2, N Engl J Med 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37761330/" target="_blank" rel="noopener">Dushianthan et al., 2023</a>.</p></template>
<template data-pop="j80-contentieux-pep" data-title="Arbitrage : PEEP élevée ou basse"><p class="lab">Source la plus récente retenue</p><p>ESICM, juin 2023 : aucune recommandation pour ou contre une titration systématique par une table PEEP/FiO₂ élevée plutôt que basse (niveau de preuve élevé d’absence d’effet sur la mortalité ; risque relatif poolé 0,93 dans trois essais) ; aucune recommandation non plus pour une titration guidée par la mécanique.</p><p class="lab">Texte antérieur</p><p>ATS/ESICM/SCCM, 2017 : suggestion conditionnelle d’une PEEP plus élevée dans le SDRA modéré à sévère (confiance modérée) et des manœuvres de recrutement (confiance faible).</p><p class="lab">Relation et choix</p><p>Le texte européen le plus récent, fondé sur une méta-analyse actualisée, prévaut. Il recommande fortement de renoncer aux manœuvres de recrutement prolongées, ce qui remplace la suggestion de 2017. La PEEP s’individualise selon l’oxygénation, la pression motrice et la tolérance hémodynamique ; une méta-analyse antérieure suggérait un avantage d’une PEEP plus élevée dans les formes modérées à sévères seulement.</p><div class="key"><b>Texte en vigueur.</b> <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">Grasselli et al., ESICM 2023, recommandations 6.1 à 6.4</a> ; texte antérieur : <a href="https://pubmed.ncbi.nlm.nih.gov/28459336/" target="_blank" rel="noopener">Fan et al., ATS/ESICM/SCCM 2017</a>.</div><p class="src">Complément : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, section PEEP</a>.</p></template>
<template data-pop="j80-proseva" data-title="Essai PROSEVA (2013)"><p class="lab">Plan</p><p>Essai français de 466 patients avec PaO₂/FiO₂ &lt; 150 mmHg sous FiO₂ ≥ 0,6, PEEP ≥ 5 cm H₂O et volume proche de 6 mL/kg ; séances de décubitus ventral d’au moins 16 heures, débutées précocement, contre décubitus dorsal.</p><p class="lab">Résultats</p><p>Mortalité à 28 jours 16,0 % contre 32,8 % (rapport de risque 0,39) ; à 90 jours 23,6 % contre 41,0 %. Complications comparables, sauf des arrêts cardiaques plus fréquents en décubitus dorsal.</p><div class="key"><b>Limite.</b> La recommandation repose sur ce seul essai, mené dans des centres entraînés. L’ESICM 2023 en tire une recommandation forte, de niveau de preuve élevé.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/23688302/" target="_blank" rel="noopener">Guérin et al., N Engl J Med 2013;368:2159-68</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">ESICM 2023, domaine 7</a>.</p></template>
<template data-pop="j80-ventral-pratique" data-title="Décubitus ventral en pratique"><p class="lab">Mécanisme</p><p>Le passage en décubitus ventral répartit plus uniformément les rapports gaz-tissu le long de l’axe déclive-non déclive et homogénéise les contraintes. La baisse de mortalité s’explique surtout par moins de surdistension des régions non déclives et moins d’ouvertures-fermetures cycliques des régions déclives ; l’oxygénation s’améliore par un meilleur appariement ventilation-perfusion.</p><p class="lab">Réalisation</p><p>Une équipe entraînée de quatre à cinq soignants retourne le patient selon un protocole local. Les séances durent au moins 16 heures consécutives ; dans PROSEVA, elles se répétaient chaque jour même sans amélioration de l’oxygénation lors de la séance précédente. Le décubitus ventral reste possible sous ECMO.</p><p class="lab">Durée : arbitrage</p><p>Le texte ATS/ESICM/SCCM 2017 recommandait plus de 12 heures par jour dans le SDRA sévère ; l’ESICM 2023, plus récente, retient au moins 16 heures consécutives.</p><div class="key"><b>Risques et contre-indications.</b> Complications les plus fréquentes : escarres et œdème facial ; lors des retournements, déplacement ou obstruction de la sonde, extubation accidentelle, perte d’abord veineux. Seule contre-indication absolue : fracture instable du rachis. Contre-indications relatives : instabilité hémodynamique, fracture instable du bassin ou des os longs, plaie abdominale ouverte, hypertension intracrânienne.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/33169218/" target="_blank" rel="noopener">Guérin et al., Intensive Care Med 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">ESICM 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28459336/" target="_blank" rel="noopener">ATS/ESICM/SCCM 2017</a>.</p></template>
<template data-pop="j80-contentieux-curares" data-title="Arbitrage : curarisation continue"><p class="lab">Données</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/20843245/" target="_blank" rel="noopener">ACURASYS (2010)</a>, 340 patients, PaO₂/FiO₂ &lt; 150 dans les 48 premières heures : cisatracurium 48 heures contre placebo sous sédation profonde ; rapport de risque ajusté de décès à 90 jours 0,68, mortalité brute 31,6 % contre 40,7 % (non significative), sans excès de parésie. <a href="https://pubmed.ncbi.nlm.nih.gov/31112383/" target="_blank" rel="noopener">ROSE (2019)</a>, 1 006 patients, PEEP élevée dans les deux groupes et sédation légère chez les témoins : mortalité 42,5 % contre 42,8 %, avec moins d’activité physique et plus d’événements cardiovasculaires sous curare.</p><p class="lab">Source retenue</p><p>ESICM, juin 2023 : recommandation forte, de niveau de preuve modéré, contre la perfusion continue systématique dans le SDRA modéré à sévère non lié à la COVID-19 ; aucune recommandation dans la COVID-19, faute d’essai.</p><p class="lab">Lecture des deux essais</p><p>Le décubitus ventral était moins fréquent dans ROSE (15,8 % contre 44,8 %), la sédation des témoins plus légère, la PEEP plus élevée ; la mortalité du groupe curarisé de ROSE égalait celle des groupes témoins. Soit l’intervention a perdu son effet dans un contexte ventilatoire différent, soit la sédation profonde des témoins d’ACURASYS augmentait leur mortalité.</p><div class="key"><b>Conséquence pratique.</b> Pas de curarisation systématique. Une curarisation courte se discute individuellement devant une asynchronie persistante malgré une sédation et des réglages adaptés.</div><p class="src">Texte en vigueur : <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">Grasselli et al., ESICM 2023, recommandation 8.1</a>.</p></template>
<template data-pop="j80-factt" data-title="Essai FACTT (2006)"><p class="lab">Plan</p><p>1 000 patients avec lésion pulmonaire aiguë : stratégie hydrique conservatrice ou libérale pendant 7 jours, appliquée après la résolution du choc dépendant des vasopresseurs.</p><p class="lab">Résultats</p><p>Bilan cumulé à 7 jours −136 mL contre +6 992 mL. Mortalité à 60 jours 25,5 % contre 28,4 %, différence non significative ; jours sans ventilation 14,6 contre 12,1 ; jours hors soins intensifs 13,4 contre 11,2 ; pas davantage de choc, dialyse 10 % contre 14 %.</p><div class="key"><b>Limite.</b> Le bras conservateur suivait un algorithme exigeant une mesure de pression veineuse centrale ou de pression artérielle pulmonaire d’occlusion toutes les 4 heures ; une version simplifiée vise une réduction du bilan de 500 à 1 000 mL par jour chez le patient sans choc.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/16714767/" target="_blank" rel="noopener">FACTT, N Engl J Med 2006;354:2564-75</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, section prise en charge hydrique</a>.</p></template>
<template data-pop="j80-ecmo" data-title="ECMO veino-veineuse"><p class="lab">Principe</p><p>Le sang veineux circule hors du corps à travers un oxygénateur à membrane perméable aux gaz, qui l’oxygène et en extrait le CO₂, puis retourne dans une veine. Le poumon peut alors être ventilé avec des volumes et des pressions très bas.</p><p class="lab">Critères EOLIA</p><p>PaO₂/FiO₂ &lt; 50 mmHg pendant plus de 3 heures, ou &lt; 80 mmHg pendant plus de 6 heures, ou pH &lt; 7,25 avec PaCO₂ ≥ 60 mmHg pendant plus de 6 heures, malgré une fréquence portée à 35 par minute et un plateau ≤ 32 cm H₂O.</p><p class="lab">Organisation</p><p>L’ESICM 2023 recommande l’ECMO dans un centre qui répond à des standards organisationnels définis (forte, niveau de preuve modéré, étendue à la COVID-19). Un réseau de centres et une équipe capable de transférer un patient sous ECMO sont nécessaires.</p><div class="key"><b>Complications.</b> Dans EOLIA : saignements transfusés 46 % contre 28 %, thrombopénie sévère 27 % contre 16 %, mais aucun accident vasculaire ischémique contre 5 %.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">ESICM 2023, domaine 9</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29791822/" target="_blank" rel="noopener">Combes et al., 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a>.</p></template>
<template data-pop="j80-eolia" data-title="Essai EOLIA (2018)"><p class="lab">Plan</p><p>249 patients au SDRA très sévère, randomisés entre ECMO immédiate et traitement conventionnel, avec ECMO de sauvetage autorisée.</p><p class="lab">Résultats</p><p>Mortalité à 60 jours 35 % contre 46 % (risque relatif 0,76 ; intervalle de confiance à 95 % de 0,55 à 1,04 ; p = 0,09). 28 % des témoins ont reçu une ECMO de sauvetage, avec 57 % de décès parmi eux.</p><div class="key"><b>Interprétation.</b> L’essai ne démontre pas de bénéfice significatif ; le passage de nombreux témoins à l’ECMO a dilué l’effet. La méta-analyse de l’ESICM avec un essai antérieur trouve un risque relatif de 0,72 (0,57 à 0,91), et une analyse bayésienne ultérieure va dans le même sens.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29791822/" target="_blank" rel="noopener">Combes et al., N Engl J Med 2018;378:1965-75</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">ESICM 2023</a>.</p></template>
<template data-pop="j80-contentieux-corticoides" data-title="Arbitrage : corticoïdes dans le SDRA"><p class="lab">Texte applicable</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/28940011/" target="_blank" rel="noopener">SCCM/ESICM, 2017</a> : suggestion de méthylprednisolone 1 mg/kg par jour par voie intraveineuse dans le SDRA modéré à sévère précoce (PaO₂/FiO₂ &lt; 200, dans les 14 jours), recommandation conditionnelle, certitude modérée. C’est le texte le plus récent cosigné par une société européenne sur cette question.</p><p class="lab">Silence de l’ESICM 2023</p><p>Les recommandations ESICM 2023 portent sur la définition et le support respiratoire ; elles ne traitent pas des corticoïdes.</p><p class="lab">Données plus récentes</p><p><a href="https://pubmed.ncbi.nlm.nih.gov/32043986/" target="_blank" rel="noopener">DEXA-ARDS (2020)</a>, essai espagnol ouvert de 277 patients : dexaméthasone 20 puis 10 mg, jours sans ventilation +4,8, mortalité à 60 jours 21 % contre 36 %, arrêt pour recrutement lent. La recommandation <a href="https://pubmed.ncbi.nlm.nih.gov/37012484/" target="_blank" rel="noopener">ERS/ESICM/ESCMID/ALAT 2023</a> suggère des corticoïdes dans la pneumonie communautaire sévère avec choc, hors pneumonies virales.</p><p class="lab">Populations</p><p>COVID-19 sous oxygène : dexaméthasone 6 mg, indication autorisée en Suisse (RECOVERY). Grippe : association observationnelle avec une mortalité accrue (Cochrane 2019). Début au-delà de 14 jours : mortalité accrue dans un essai de méthylprednisolone.</p><div class="key"><b>Choix retenu.</b> Décision individuelle, précoce, hors indication suisse dans le SDRA non lié à la COVID-19, en surveillant glycémie et infections ; jamais dans la grippe sans autre indication ni au-delà de deux semaines.</div><p class="src">Références complémentaires : <a href="https://pubmed.ncbi.nlm.nih.gov/32678530/" target="_blank" rel="noopener">RECOVERY, N Engl J Med 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30798570/" target="_blank" rel="noopener">Lansbury et al., Cochrane 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, section glucocorticoïdes</a>.</p></template>
<template data-pop="j80-sans-benefice" data-title="Traitements sans bénéfice de survie"><p class="lab">Monoxyde d’azote inhalé</p><p>Il dilate les vaisseaux des alvéoles ventilées et améliore le rapport PaO₂/FiO₂ à 24 heures, sans réduire la mortalité (risque relatif 1,04 sur 1 243 patients) ; il augmente le risque d’insuffisance rénale (risque relatif 1,59). Il garde une place de sauvetage transitoire.</p><p class="lab">Salbutamol intraveineux</p><p>Dans <a href="https://pubmed.ncbi.nlm.nih.gov/22166903/" target="_blank" rel="noopener">BALTI-2</a>, essai britannique de 326 patients, il a augmenté la mortalité à 28 jours (34 % contre 23 %) et a été mal toléré.</p><p class="lab">Statines et surfactant exogène</p><p>La simvastatine n’a pas modifié la mortalité dans un essai de 540 patients ; le surfactant exogène n’a amélioré ni la survie ni l’oxygénation dans onze essais réunissant 3 038 adultes.</p><div class="key"><b>Conséquence.</b> Une amélioration de l’oxygénation n’équivaut pas à un bénéfice de survie : seuls les critères cliniques des essais guident la pratique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27347773/" target="_blank" rel="noopener">Gebistorf et al., Cochrane 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30626363/" target="_blank" rel="noopener">Meng et al., 2019</a>.</p></template>
<template data-pop="j80-pics" data-title="Syndrome post-soins intensifs"><p class="lab">Composantes</p><p>Faiblesse musculaire et limitation à l’effort, troubles de l’attention, de la concentration, de la vitesse de traitement, de la mémoire et des fonctions exécutives, état de stress post-traumatique ; les proches peuvent aussi être atteints.</p><p class="lab">Mécanismes</p><p>Faiblesse acquise en soins intensifs par myopathie avec déplétion en myosine et atteinte axonale, liée à une protéolyse qui commence dans les heures suivant le début de la maladie ; hypoxémie, délire et durée du séjour pour la cognition.</p><div class="key"><b>Prévention.</b> La SSMI recommande d’associer la famille à l’équipe soignante et une analgo-sédation ciblée avec sevrage précoce de la ventilation invasive.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, section qualité de vie</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21470008/" target="_blank" rel="noopener">Herridge et al., 2011</a> ; <a href="https://www.sgi-ssmi.ch/fr/recommendations-choosing-wisely-soins-intensifs" target="_blank" rel="noopener">SSMI, Choosing wisely, recommandations 1 et 7</a>.</p></template>
<template data-pop="j80-pression-oesophagienne" data-title="Pression œsophagienne et pression transpulmonaire"><p class="lab">Principe</p><p>Un ballonnet œsophagien mesure une pression qui sert de substitut à la pression pleurale. La pression transpulmonaire, différence entre la pression des voies aériennes et la pression pleurale, est la contrainte réellement appliquée au poumon.</p><p class="lab">Données</p><p>Prometteuse dans un essai monocentrique, la titration de la PEEP guidée par la pression œsophagienne n’a pas amélioré le pronostic dans l’essai multicentrique suivant, comparée à une PEEP élevée empirique.</p><div class="key"><b>Conséquence.</b> La technique reste réservée aux équipes entraînées, pour des situations individuelles comme l’obésité importante.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30872586/" target="_blank" rel="noopener">Matthay et al., 2019, section PEEP</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">ESICM 2023, recommandation 6.2</a>.</p></template>
