<p>Les noms des phénotypes et des traitements dépendent de l’année du référentiel. La fraction d’éjection reste une mesure continue ; renommer un groupe ne modifie pas à lui seul le mécanisme de la maladie.</p>
<table class="t"><tr><th>Point</th><th>ESC 2021 et mise à jour 2023</th><th>ESC 2026</th></tr>
<tr><td>Fraction d’éjection</td><td>Réduite ≤ 40 % ; légèrement réduite 41–49 % ; préservée ≥ 50 %.</td><td>Réduite &lt; 50 % ; préservée ≥ 50 %. Le groupe 41–49 % est réuni au groupe à fraction réduite.</td></tr>
<tr><td>Épisode d’aggravation</td><td>Terme « insuffisance cardiaque aiguë ».</td><td>Terme « insuffisance cardiaque décompensée », qui inclut aussi l’aggravation progressive.</td></tr>
<tr><td>Présentation des traitements</td><td>Traitement conforme aux recommandations, présenté selon les populations et indications étudiées.</td><td>Trois ensembles nommés : thérapie médicamenteuse fondamentale, thérapie médicamenteuse additionnelle et thérapie interventionnelle recommandée.</td></tr></table>
<div class="lab">Pourquoi ces changements ?</div><p>Le regroupement des fractions d’éjection s’appuie sur les ressemblances physiopathologiques et thérapeutiques du groupe 41–49 % avec les formes à fraction réduite. Le terme « décompensée » décrit la perte de compensation, qui peut se développer progressivement. Les trois ensembles thérapeutiques distinguent les traitements de base, les indications de sous-groupes et les interventions.</p>
<div class="lab">Limite pratique</div><p>Les critères d’inclusion des essais et les seuils des autres recommandations restent ceux de leur version. Une nouvelle définition ne remplace pas automatiquement un seuil d’indication de dispositif, une contre-indication d’antiarythmique ou une posologie. La comparaison ci-dessus porte sur la classification et la terminologie.</p>
