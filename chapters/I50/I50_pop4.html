
<!-- ===== FENÊTRES : monographies ===== -->
<template data-pop="d-arni" data-title="IEC et ARNI (sacubitril/valsartan)">
<div class="lab">Mécanisme</div><p><b>IEC</b> : inhibent l’enzyme de conversion. La baisse de l’angiotensine II s’accompagne d’une accumulation de bradykinine, à l’origine de la toux et de l’angiœdème. <b>ARNI</b> : le valsartan bloque le récepteur AT1 ; le sacubitril, promédicament converti en métabolite actif, inhibe la néprilysine et prolonge l’action des peptides natriurétiques.</p>
<div class="lab">Preuves</div><p>IEC : réduction de la mortalité dans l’ICFEr (essais CONSENSUS, SOLVD). ARNI : supériorité sur l’énalapril pour le critère décès cardiovasculaire ou hospitalisation pour insuffisance cardiaque (PARADIGM-HF, 2014).</p>
<div class="lab">Place</div><p>TMF de l’ICFEr ; un IEC ou un ARNI. Un ARA II est réservé à l’intolérance aux deux.</p>
<div class="lab">Effets indésirables</div><p>Hypotension, hyperkaliémie, hausse de la créatinine ; angiœdème ; toux (IEC).</p>
<div class="lab">Contre-indications</div><p>Antécédent d’angiœdème ; grossesse ; sténose bilatérale des artères rénales ; association IEC + ARNI (intervalle de 36 heures obligatoire).</p>
<div class="lab">Surveillance</div><p>Créatinine et potassium à 1–2 semaines de chaque titration. Le NT-proBNP facilite le suivi sous ARNI, car sa dégradation n’est pas directement freinée. Le BNP conserve une valeur pronostique ; aucune variation ne se lit sans le contexte clinique.</p></template>

<template data-pop="d-bb" data-title="Bêtabloquants de l’insuffisance cardiaque">
<div class="lab">Molécules validées</div><p>Bisoprolol (β1-sélectif), carvédilol (β1, β2 et α1), métoprolol <b>succinate</b> à libération prolongée (β1-sélectif), nébivolol (β1-sélectif, vasodilatateur par le monoxyde d’azote, validé chez le sujet âgé). Le bénéfice n’est pas un effet de classe : il faut utiliser ces molécules.</p>
<div class="lab">Mécanisme</div><p>Blocage de l’activation sympathique chronique : baisse de la fréquence et de la consommation d’oxygène, effet antiarythmique, remodelage inverse.</p>
<div class="lab">Preuves</div><p>Réduction de la mortalité totale et de la mort subite dans l’ICFEr (CIBIS-II, MERIT-HF, COPERNICUS).</p>
<div class="lab">Initiation</div><p>À faible dose, chez un patient euvolémique ou presque ; doubler la dose toutes les une à deux semaines. Une aggravation transitoire de la congestion est possible : ajuster le diurétique.</p>
<div class="lab">Précautions</div><p>Bradycardie, bloc auriculoventriculaire de haut degré non appareillé, choc. L’asthme est une précaution et non une contre-indication absolue pour les β1-sélectifs.</p></template>

<template data-pop="d-arm" data-title="Antagonistes des récepteurs minéralocorticoïdes (ARM)">
<div class="lab">Molécules</div><p>Stéroïdiens : spironolactone (effets antiandrogéniques : gynécomastie) et éplérénone (plus sélective). Non stéroïdien : finérénone.</p>
<div class="lab">Mécanisme</div><p>Blocage du récepteur minéralocorticoïde : natriurèse, rétention de potassium, effet antifibrosant myocardique et vasculaire.</p>
<div class="lab">Preuves</div><p>RALES (spironolactone) et EMPHASIS-HF (éplérénone) : réduction de la mortalité dans l’ICFEr.</p>
<div class="lab">Place ESC 2026</div><p>Classe I chez tout patient symptomatique, indépendamment de la FEVG. ARM stéroïdien dans l’ICFEr ; stéroïdien ou non stéroïdien dans l’ICFEp.</p>
<div class="lab">Précautions</div><p>Ne pas débuter si le potassium est &gt; 5,0 mmol/L ; prudence si le DFG est &lt; 30 mL/min/1,73 m². Contrôler le potassium et la créatinine à 1 semaine, 4 semaines, puis régulièrement.</p></template>

<template data-pop="d-sglt2" data-title="Inhibiteurs du SGLT2 (dapagliflozine, empagliflozine)">
<div class="lab">Mécanisme</div><p>Blocage du cotransporteur sodium-glucose de type 2 du tube proximal : glycosurie et natriurèse. Autres effets proposés : restauration du rétrocontrôle tubuloglomérulaire (néphroprotection), baisse de la précharge et de la postcharge, substrat énergétique cétonique, effet anti-inflammatoire. Le mécanisme dominant reste débattu.</p>
<div class="lab">Preuves</div><p>DAPA-HF et EMPEROR-Reduced (ICFEr) ; EMPEROR-Preserved et DELIVER (FEVG &gt; 40 %) : réduction du risque de décès cardiovasculaire ou d’hospitalisation pour insuffisance cardiaque, chez le diabétique comme chez le non-diabétique.</p>
<div class="lab">Posologie</div><p>10 mg une fois par jour, sans titration.</p>
<div class="lab">Effets indésirables</div><p>Infections génitales mycotiques ; baisse initiale du DFG, hémodynamique et réversible ; acidocétose euglycémique rare, favorisée par le jeûne, la chirurgie et une maladie aiguë.</p>
<div class="lab">Fonction rénale</div><p>Initiation possible si DFG ≥ 20 mL/min/1,73 m² (empagliflozine) ou ≥ 25 (dapagliflozine), seuils des essais ; poursuite jusqu’à la dialyse. Suspendre trois jours avant une chirurgie programmée. Contre-indiqués dans le diabète de type 1.</p></template>

<template data-pop="d-fin" data-title="Finérénone (ARM non stéroïdien)">
<div class="lab">Particularité</div><p>Structure non stéroïdienne : distribution plus équilibrée entre le cœur et le rein, effets antiandrogéniques absents, risque d’hyperkaliémie qui persiste mais est modéré.</p>
<div class="lab">Preuves</div><p>FINEARTS-HF (2024), chez des patients à FEVG ≥ 40 % : réduction du critère décès cardiovasculaire et événements d’insuffisance cardiaque (aggravations et hospitalisations). Les essais FIDELIO-DKD et FIGARO-DKD avaient montré un bénéfice rénal et cardiovasculaire chez le diabétique de type 2 avec maladie rénale chronique.</p>
<div class="lab">Posologie (ESC 2026)</div><p>DFG 25–59 : 10 mg/jour, cible 20 mg/jour. DFG ≥ 60 : 20 mg/jour, cible 40 mg/jour. Ne pas débuter si K⁺ &gt; 5,0 mmol/L.</p>
<div class="lab">Statut en Suisse</div><p>Indication d’insuffisance cardiaque et remboursement à vérifier dans l’information professionnelle (compendium.ch) et la liste des spécialités.</p></template>

<template data-pop="d-diur" data-title="Diurétiques de l’anse">
<div class="lab">Mécanisme</div><p>Inhibition du cotransporteur Na-K-2Cl de la branche ascendante large de l’anse de Henle : natriurèse puissante.</p>
<div class="lab">Molécules</div><p>Furosémide (biodisponibilité orale variable, environ 10 à 90 %, diminuée par l’œdème digestif) ; torasémide (biodisponibilité élevée et stable, durée d’action plus longue).</p>
<div class="lab">Pharmacodynamie</div><p>Effet de seuil : en dessous d’une concentration tubulaire minimale, aucune natriurèse. D’où l’intérêt d’augmenter la dose plutôt que de la fractionner en petites prises. Phénomène de freinage (réabsorption distale accrue) et effet rebond entre les prises.</p>
<div class="lab">Place</div><p>Symptomatique : dose minimale maintenant le poids sec ; réduction possible une fois la TMF titrée.</p>
<div class="lab">Surveillance</div><p>Kaliémie, natrémie, créatinine, hypotension, ototoxicité à forte dose intraveineuse.</p></template>

<!-- ===== FENÊTRES PARETO ===== -->
<template data-pop="pareto-def" data-title="Pareto — Définition et classifications">
<p class="ratio" data-cover="i50-1,i50-2"></p>
<ul><li>Syndrome = symptômes + signes + anomalie cardiaque + preuve objective (peptide élevé ou congestion).</li><li>ESC 2026 : deux phénotypes seulement. ICFEr = FEVG &lt; 50 % ; ICFEp = FEVG ≥ 50 %. HFmrEF supprimée.</li><li>Stades A (risque) → B (anomalie asymptomatique) → C (symptomatique) → D (avancé) ; le stade ne régresse pas.</li><li>NYHA = gêne actuelle, variable.</li><li>« Aiguë » → « décompensée ».</li><li>Prévalence 1–2 % des adultes, &gt; 10 % après 70 ans ; ICFEp ≈ la moitié des cas (femme âgée, obèse, hypertendue).</li><li>≈ 50 % de décès à 5 ans après une première hospitalisation ; risque maximal dans le premier mois après la sortie.</li></ul></template>

<template data-pop="pareto-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i50-3"></p>
<ul><li>ICFEr : contractilité ↓ → dilatation (Frank-Starling). ICFEp : remplissage altéré → pressions ↑.</li><li>Compensation SRAA + sympathique : utile à court terme, toxique à long terme (fibrose, arythmies, remodelage).</li><li>Chaque pilier bloque un maillon : IEC/ARNI (angiotensine II), BB (noradrénaline), ARM (aldostérone) ; iSGLT2 (natriurèse, métabolisme).</li><li>Congestion (pressions) ≠ bas débit (perfusion) → quatre profils de Stevenson.</li><li>ICFEp = maladie systémique (obésité, diabète, inflammation).</li></ul></template>

<template data-pop="pareto-clin" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="i50-5,i50-6"></p>
<ul><li>Orthopnée et dyspnée paroxystique nocturne : plus spécifiques que la dyspnée d’effort.</li><li>+ 2 kg en 3 jours = rétention.</li><li>Signe de congestion le plus fiable : turgescence jugulaire ± reflux hépato-jugulaire. B3 : très spécifique, peu sensible.</li><li>Absence de crépitants ≠ absence de congestion.</li><li>Rechercher des indices de cause (souffle, arythmie, drapeaux rouges d’amylose).</li></ul></template>

<template data-pop="pareto-diag" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="i50-7"></p>
<ul><li>Séquence : suspicion → NT-proBNP + ECG (exclure) → échocardiographie (confirmer, classer, cause).</li><li>Exclusion : NT-proBNP &lt; 125 (ambulatoire) / &lt; 300 pg/mL (décompensé) ; BNP &lt; 35 / &lt; 100.</li><li>Obésité ↓ les peptides ; âge, insuffisance rénale, fibrillation auriculaire ↑. Sous ARNI : suivre le NT-proBNP.</li><li>ICFEp : FEVG ≥ 50 % + preuves de pressions élevées (oreillette gauche, E/e′) ; scores H2FPEF / HFA-PEFF.</li><li>Toujours un bilan étiologique (coronaires, IRM, amylose).</li></ul></template>

<template data-pop="pareto-decomp" data-title="Pareto — Décompensation">
<p class="ratio" data-cover="i50-8"></p>
<ul><li>Gravité d’abord : détresse respiratoire, PAS &lt; 90 mmHg, hypoperfusion → soins intensifs.</li><li>CHAMP : syndrome coronarien, urgence hypertensive, arythmie, cause mécanique, embolie pulmonaire.</li><li>O₂ si SpO₂ &lt; 90 % ; VNI si œdème pulmonaire en détresse.</li><li>Furosémide intraveineux : 20–40 mg (naïf) ou 1–2 × la dose orale ; natriurèse à 2 h, diurèse à 6 h ; doubler si réponse insuffisante ; + acétazolamide ou hydrochlorothiazide.</li><li>Nitrés si PAS &gt; 110 mmHg ; inotropes uniquement en cas d’hypoperfusion.</li><li>iSGLT2 débuté à l’hôpital (classe I) ; TMF avant la sortie ; contrôle à 1–2 semaines ; poursuivre le bêtabloquant hors choc.</li><li>Quatre présentations : congestive (diurétiques), œdème pulmonaire aigu (VNI, nitrés), VD isolée (traiter la cause, prudence avec les vasodilatateurs), choc (noradrénaline, inotrope, assistance temporaire ; stades SCAI).</li><li>HBPM prophylactique ; pas de morphine en routine ; sortie : euvolémie, fonction rénale stable, ≥ 24 h de traitement oral.</li></ul></template>

<template data-pop="pareto-tt" data-title="Pareto — Traitement chronique">
<p class="ratio" data-cover="i50-9"></p>
<ul><li>ICFEr : quatre piliers (IEC/ARNI, BB, ARM, iSGLT2), introduits rapidement et titrés toutes les 1–2 semaines ; poursuivis même si la FEVG s’améliore.</li><li>ICFEp : iSGLT2 + ARM (dont finérénone) ; agoniste GLP-1 (sémaglutide) ou GIP/GLP-1 (tirzépatide) si obésité (IIa) ; IEC/ARA II/ARNI envisageables (IIb) ; comorbidités.</li><li>Diurétiques : symptômes seulement.</li><li>TMA : digoxine/digitoxine (IIa, FEVG ≤ 40 %), vériciguat (IIb, FEVG &lt; 45 %), ivabradine (FEVG ≤ 35 %, sinusal, FC ≥ 70), fer intraveineux, hydralazine-dinitrate.</li><li>Dispositifs après ≥ 3 mois de TMF : DAI (FEVG ≤ 35 %), CRT (BBG, QRS ≥ 150 ms). TEER pour l’insuffisance mitrale secondaire.</li><li>Stade D : I NEED HELP → centre spécialisé ; greffe (Berne, Lausanne, Zurich), assistance ventriculaire gauche durable (renforcée en 2026), soins palliatifs précoces.</li></ul></template>

<template data-pop="pareto-bio" data-title="Pareto — Biologie">
<p class="ratio" data-cover="e-2"></p>
<ul><li>Peptides : exclusion ; facteurs ↑ (âge, rein, fibrillation auriculaire) et ↓ (obésité) ; NT-proBNP sous ARNI.</li><li>Bilan initial : hémogramme, créatinine/DFG, Na/K, ferritine + saturation de la transferrine, TSH, glycémie/HbA1c, lipides, tests hépatiques.</li><li>Carence martiale : ferritine &lt; 100, ou 100–299 avec saturation de la transferrine &lt; 20 %.</li></ul></template>

<template data-pop="pareto-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e-1,e-2,e-3,e-4,e-5"></p>
<ul><li>Échocardiographie : examen de référence de première ligne. La FEVG est mesurée par la méthode de Simpson. E/e′, le volume atrial et la vitesse tricuspide sont des indices indirects, combinés selon le rythme et les valvulopathies. Un TAPSE &lt; 17 mm suggère une dysfonction droite.</li><li>ECG normal : ICFEr très improbable ; bloc de branche gauche avec QRS ≥ 150 ms → CRT.</li><li>Radiographie : redistribution → lignes de Kerley → œdème alvéolaire.</li><li>IRM : caractérisation tissulaire (patterns de rehaussement tardif).</li><li>ATTR : scintigraphie de grade 2–3 + absence de protéine monoclonale = diagnostic sans biopsie.</li><li>Cathétérisme droit : pression capillaire ≥ 15 mmHg au repos (≥ 25 à l’effort) = ICFEp.</li></ul></template>

<template data-pop="pareto-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="p-1,p-2,p-3,p-4,p-5"></p>
<ul><li>Doses cibles : sacubitril/valsartan 97/103 × 2 ; bisoprolol 10 ; carvédilol 25 × 2 ; spironolactone 50 ; iSGLT2 10 mg (sans titration).</li><li>Intervalle de 36 h entre IEC et ARNI.</li><li>Le médecin interprète la créatinine avec sa cinétique, la volémie et la kaliémie. Le repère ESC 2021 associe une hausse transitoire &lt; 50 % et une créatinine &lt; 266 µmol/L ; KDIGO 2024 demande une réévaluation au-delà de 30 % sous IEC/ARA II dans les quatre semaines. Une kaliémie &gt; 6,0 mmol/L impose une prise en charge urgente et l’adaptation des médicaments concernés.</li><li>En cas d’hypotension symptomatique, le médecin recherche une déplétion. Il adapte les vasodilatateurs non pronostiques et ne réduit le diurétique qu’en l’absence de congestion ; une hypoperfusion impose une évaluation urgente.</li><li>Digoxinémie 0,5–0,9 ng/mL ; ivabradine si FEVG ≤ 35 %, sinusal, FC ≥ 70 ; vériciguat 2,5 → 10 mg.</li><li>À éviter : AINS, vérapamil/diltiazem, dronédarone, glitazones, saxagliptine, antiarythmiques de classe I.</li></ul></template>

<template data-pop="d-dig" data-title="Glycosides cardiaques (digoxine, digitoxine)">
<div class="lab">Mécanisme</div><p>Inhibition de la Na⁺/K⁺-ATPase : le sodium intracellulaire augmente, l’échangeur Na⁺/Ca²⁺ expulse moins de calcium, et le calcium disponible pour la contraction augmente (inotropie positive). S’y ajoute un effet vagal qui ralentit la conduction auriculoventriculaire.</p>
<div class="lab">Place (ESC 2026)</div><p>Classe IIa dans l’ICFEr symptomatique à FEVG ≤ 40 % malgré une TMF optimale, pour réduire les hospitalisations. La digitoxine a été évaluée dans l’essai DIGIT-HF. Utiles aussi pour le contrôle de fréquence en fibrillation auriculaire.</p>
<div class="lab">Pharmacocinétique</div><p>Digoxine : élimination rénale, demi-vie d’environ 36 heures, allongée en insuffisance rénale. Digitoxine : élimination surtout hépatique, demi-vie de plusieurs jours ; intérêt chez l’insuffisant rénal.</p>
<div class="lab">Surveillance</div><p>Digoxinémie cible basse, 0,5–0,9 ng/mL, prélevée au moins 6 heures après la prise. Kaliémie, fonction rénale.</p>
<div class="lab">Toxicité</div><p>Favorisée par l’hypokaliémie, l’hypomagnésémie, l’insuffisance rénale et l’âge. Signes : nausées, troubles visuels (dyschromatopsie jaune-vert), confusion, arythmies (extrasystoles, tachycardie atriale avec bloc, bloc auriculoventriculaire). Antidote : fragments d’anticorps antidigoxine. La baisse du potassium accroît la sensibilité à la digoxine sur la pompe sodium-potassium. Une fonction rénale altérée réduit son élimination. L’amiodarone, le vérapamil et la clarithromycine peuvent augmenter son exposition, notamment par inhibition de la glycoprotéine P ; l’amiodarone et le vérapamil peuvent aussi ajouter un ralentissement de la conduction auriculoventriculaire. Ces mécanismes concernent ici la digoxine ; la digitoxine possède d’autres propriétés d’élimination.</p></template>

<template data-pop="d-iva" data-title="Ivabradine">
<div class="lab">Mécanisme</div><p>Blocage sélectif du courant If (canal HCN4) du nœud sinusal : baisse de la fréquence sans effet inotrope ni tensionnel. Inefficace en fibrillation auriculaire, puisque la fréquence n’y dépend plus du nœud sinusal.</p>
<div class="lab">Place</div><p>ICFEr symptomatique à FEVG ≤ 35 %, rythme sinusal, fréquence ≥ 70/min malgré un bêtabloquant à dose maximale tolérée (ou contre-indiqué). L’essai SHIFT a montré une réduction du critère décès cardiovasculaire ou hospitalisation pour insuffisance cardiaque.</p>
<div class="lab">Posologie</div><p>5 mg × 2/jour (2,5 mg × 2/jour après 75 ans), puis 7,5 mg × 2/jour ; cible de fréquence au repos entre 50 et 60/min.</p>
<div class="lab">Effets indésirables</div><p>Phosphènes (phénomènes lumineux transitoires), bradycardie, fibrillation auriculaire. Métabolisme par le CYP3A4 : contre-indiqué avec les inhibiteurs puissants (clarithromycine, kétoconazole). Contre-indiqué pendant la grossesse.</p>
<div class="lab">Autorisation</div><p>L’autorisation européenne et suisse pour l’insuffisance cardiaque retient une fréquence ≥ 75/min ; l’association au vérapamil ou au diltiazem est contre-indiquée.</p></template>

<template data-pop="d-veri" data-title="Vériciguat">
<div class="lab">Mécanisme</div><p>Stimulation directe de la guanylate cyclase soluble et sensibilisation au monoxyde d’azote endogène : hausse du GMP cyclique, vasodilatation et effets myocardiques favorables. Cette voie est déficiente dans l’insuffisance cardiaque.</p>
<div class="lab">Place (ESC 2026)</div><p>Classe IIb : ICFEr symptomatique à FEVG &lt; 45 % malgré une TMF optimale, surtout après une aggravation récente (population de l’essai VICTORIA).</p>
<div class="lab">Posologie</div><p>2,5 mg/jour, doublée toutes les deux semaines jusqu’à 10 mg/jour, selon la pression artérielle.</p>
<div class="lab">Précautions</div><p>Hypotension ; ne pas associer aux dérivés nitrés ni aux inhibiteurs de la phosphodiestérase 5 ; contre-indiqué pendant la grossesse.</p></template>

<template data-pop="d-hisdn" data-title="Hydralazine et dinitrate d’isosorbide">
<div class="lab">Mécanisme</div><p>L’hydralazine dilate les artérioles (baisse de la postcharge) et limite la tolérance aux nitrés ; le dinitrate d’isosorbide dilate les veines (baisse de la précharge) et apporte du monoxyde d’azote.</p>
<div class="lab">Place</div><p>Alternative en cas d’intolérance ou de contre-indication aux IEC, ARA II et ARNI (hyperkaliémie, insuffisance rénale) ; en association chez les patients d’ascendance africaine restant symptomatiques sous TMF (essai A-HeFT). Utilisable pendant la grossesse.</p>
<div class="lab">Contraintes</div><p>Trois prises quotidiennes, céphalées, hypotension ; syndrome lupique induit par l’hydralazine à forte dose.</p></template>

<template data-pop="pareto-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i50-10,i50-11"></p>
<ul><li>Créatinine et K⁺ à 1–2 semaines de chaque titration ; pesée quotidienne ; + 2 kg en 3 jours = alerte.</li><li>Éducation, restriction sodée modérée, réadaptation, vaccinations OFSP.</li><li>Échocardiographie à 3–6 mois de TMF (décision des dispositifs) ; FEVG améliorée → ne pas arrêter (TRED-HF).</li><li>Rein : hausse modérée de la créatinine attendue ; hyperkaliémie → chélateurs plutôt qu’arrêt.</li><li>Grossesse : IEC, ARA II, ARNI, ARM, iSGLT2 et ivabradine contre-indiqués ; β1-sélectifs, hydralazine, nitrés et diurétiques permis.</li><li>FA : anticoagulation (CHA₂DS₂-VA), ablation (CASTLE-AF, CASTLE-HTx). Apnée centrale + FEVG ≤ 45 % : pas de servo-ventilation.</li><li>Stade B : IEC + bêtabloquant après infarctus ou dysfonction asymptomatique. ICFEp : PA &lt; 130/80 mmHg.</li><li>Cardio-oncologie : GLS avant et pendant anthracyclines/trastuzumab ; baisse relative &gt; 15 % → protection cardiaque.</li><li>Anémie sans carence : chercher la cause ; pas d’agent stimulant l’érythropoïèse (RED-HF). Le médecin caractérise l’hyponatrémie et la volémie avant une restriction hydrique. Des symptômes neurologiques sévères imposent une prise en charge urgente spécialisée ; le tolvaptan relève de situations sélectionnées.</li></ul></template>
<template data-pop="pareto-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="sa-i,sh-i,sp-i,sb-i,sg-i"></p>
<ul><li>Sous-endocarde (fibres longitudinales) : atteint en premier → strain longitudinal altéré avant la FEVG.</li><li>Dilatation → insuffisance mitrale secondaire (traction des piliers).</li><li>Fibrose (angiotensine II, aldostérone) → rigidité, arythmies, rehaussement tardif en IRM ; bloquée par les ARM.</li><li>Laplace : σ = P × r / 2h → dilatation = contrainte ↑ = BNP ↑.</li><li>Frank-Starling aplatie en ICFEr ; relation télédiastolique raide en ICFEp.</li><li>Le BNP est dégradé par la néprilysine et peut augmenter sous ARNI. Il conserve une valeur pronostique. Le NT-proBNP n’est pas directement dégradé par cette enzyme ; sa concentration dépend aussi de la fonction rénale.</li><li>SRAA : rénine → angiotensine I → ECA → angiotensine II (AT1) → aldostérone (RM). Cibles : ECA (IEC), AT1 (ARA II), RM (ARM), néprilysine (sacubitril), SGLT2, sGC (vériciguat), If (ivabradine), Na⁺/K⁺-ATPase (digitaliques), NKCC2 (diurétiques de l’anse).</li><li>Génétique : <i>TTN</i> (dilatée), <i>LMNA</i>/<i>FLNC</i> (risque rythmique → défibrillateur), <i>MYH7</i>/<i>MYBPC3</i> (hypertrophique), <i>TTR</i> (amylose) → dépistage familial.</li></ul></template>

<template data-pop="pareto-etio" data-title="Pareto — Étiologies et facteurs déclenchants">
<p class="ratio" data-cover="i50-4"></p>
<ul><li>ICFEr : ischémie d’abord ; ICFEp : hypertension d’abord.</li><li>Ne pas manquer : valvulopathie, amylose (sujet âgé, parois épaisses, bas voltage), toxiques (alcool, anthracyclines, trastuzumab), cardiomyopathie rythmique, myocardite.</li><li>Causes traitables → traitement spécifique (revascularisation, valve, abstinence, contrôle de fréquence, tafamidis).</li><li>Décompensation : CHAMP d’abord, puis causes banales (sel, non-observance, infection, FA, AINS).</li><li>À proscrire : AINS, glitazones, vérapamil/diltiazem (ICFEr).</li></ul></template>
<template data-pop="choc" data-title="Choc cardiogénique">
<div class="lab">Définition</div><p>Bas débit cardiaque responsable d’une hypoperfusion d’organes : PAS &lt; 90 mmHg (ou besoin de vasopresseur), signes cliniques d’hypoperfusion, lactate &gt; 2 mmol/L ; index cardiaque &lt; 2,2 L/min/m² avec pressions de remplissage élevées.</p>
<div class="lab">Stades SCAI</div><p><b>A</b> — à risque ; <b>B</b> — début (hypotension ou tachycardie sans hypoperfusion) ; <b>C</b> — classique (hypoperfusion nécessitant une intervention) ; <b>D</b> — aggravation malgré le traitement initial ; <b>E</b> — extrême (arrêt circulatoire, réanimation en cours).</p>
<div class="lab">Conduite</div><p>Soins intensifs, cause (revascularisation d’urgence si infarctus), noradrénaline, inotrope, assistance circulatoire temporaire en centre expert selon le stade.</p></template>
<template data-pop="serve" data-title="Servo-ventilation et essai SERVE-HF">
<p>La servo-ventilation auto-adaptative ajuste la pression délivrée cycle par cycle pour supprimer la respiration de Cheyne-Stokes de l’apnée centrale.</p>
<div class="lab">Résultat</div><p>Dans l’essai SERVE-HF (ICFEr, FEVG ≤ 45 %, apnée centrale prédominante), elle a augmenté la mortalité cardiovasculaire, malgré la correction des apnées.</p>
<div class="lab">Hypothèses</div><p>La pression intrathoracique positive réduit le retour veineux et le débit ; la respiration de Cheyne-Stokes pourrait être une compensation plutôt qu’une cause. Ces mécanismes restent des hypothèses.</p></template>
<template data-pop="tolvaptan" data-title="Tolvaptan">
<div class="lab">Mécanisme</div><p>Antagoniste du récepteur V2 de la vasopressine au tube collecteur : excrétion d’eau libre (aquarèse) sans perte de sodium.</p>
<div class="lab">Usage</div><p>Hyponatrémie de dilution sévère et persistante, en milieu hospitalier. En Suisse, l’autorisation couvre l’hyponatrémie du SIADH ; l’usage dans l’insuffisance cardiaque est hors indication. Pas de bénéfice sur la mortalité (essai EVEREST).</p>
<div class="lab">Sécurité</div><p>La natrémie ne doit pas augmenter de plus de 8 à 10 mmol/L par 24 heures (risque de myélinolyse osmotique) ; hépatotoxicité.</p></template>
<template data-pop="lvad" data-title="Assistance ventriculaire gauche durable">
<div class="lab">Principe</div><p>Pompe à flux continu qui aspire le sang à l’apex du ventricule gauche et l’éjecte dans l’aorte.</p>
<div class="lab">Profils INTERMACS</div><p>Classement de 1 (choc critique) à 7 (NYHA III avancée). Les profils 2 à 4 sont les candidats habituels ; au profil 1, une assistance temporaire précède souvent la décision.</p>
<div class="lab">Conditions</div><p>Fonction ventriculaire droite suffisante (PAPi, POD), absence de contre-indication majeure, entourage et adhésion au suivi.</p>
<div class="lab">Complications</div><p>Infection du câble, thrombose de pompe, AVC, hémorragies digestives (syndrome de von Willebrand acquis), défaillance ventriculaire droite.</p></template>
