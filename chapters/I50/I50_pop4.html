
<!-- ===== FENÊTRES : monographies ===== -->
<template data-pop="d-arni" data-title="IEC et ARNI (sacubitril/valsartan)">
<div class="lab">Mécanisme</div><p>Les <b>IEC</b> inhibent l’enzyme de conversion. La baisse de l’angiotensine II s’accompagne d’une accumulation de bradykinine, à l’origine de la toux et de l’angiœdème. Dans l’<b>ARNI</b>, le valsartan bloque le récepteur AT1 ; le sacubitril, promédicament converti en métabolite actif, inhibe la néprilysine et prolonge l’action des peptides natriurétiques.</p>
<div class="lab">Preuves</div><p>Les IEC ont réduit la mortalité dans l’ICFEr (essais CONSENSUS, SOLVD). L’ARNI a fait mieux que l’énalapril sur le critère décès cardiovasculaire ou hospitalisation pour insuffisance cardiaque (PARADIGM-HF, 2014).</p>
<div class="lab">Place</div><p>Un IEC ou un ARNI fait partie de la TMF de l’ICFEr. Un ARA II est réservé à l’intolérance aux deux.</p>
<div class="lab">Effets indésirables</div><p>Les principaux effets sont l’hypotension, l’hyperkaliémie, la hausse de la créatinine et l’angiœdème ; la toux est propre aux IEC.</p>
<div class="lab">Contre-indications</div><p>Ces molécules sont contre-indiquées après un angiœdème, pendant la grossesse et en cas de sténose bilatérale des artères rénales. L’association IEC et ARNI est interdite : 36 heures doivent séparer la dernière prise d’IEC de la première prise d’ARNI.</p>
<div class="lab">Surveillance</div><p>Créatinine et potassium sont contrôlés une à deux semaines après chaque titration. Le NT-proBNP facilite le suivi sous ARNI, car la néprilysine ne le dégrade pas directement. Le BNP peut augmenter au début et conserve une valeur pronostique ; le suivi tient aussi compte de la clinique et du rein.</p></template>

<template data-pop="d-bb" data-title="Bêtabloquants de l’insuffisance cardiaque">
<div class="lab">Molécules validées</div><p>Bisoprolol (β1-sélectif), carvédilol (β1, β2 et α1), métoprolol <b>succinate</b> à libération prolongée (β1-sélectif), nébivolol (β1-sélectif, vasodilatateur par le monoxyde d’azote, validé chez le sujet âgé). Le bénéfice n’est pas un effet de classe : seules ces molécules sont recommandées.</p>
<div class="lab">Mécanisme</div><p>Les bêtabloquants bloquent l’activation sympathique chronique : ils abaissent la fréquence et la consommation d’oxygène, réduisent les arythmies et font régresser le remodelage.</p>
<div class="lab">Preuves</div><p>CIBIS-II, MERIT-HF et COPERNICUS ont montré une réduction de la mortalité totale et de la mort subite dans l’ICFEr.</p>
<div class="lab">Initiation</div><p>Le traitement débute à faible dose chez un patient euvolémique ou presque, puis la dose est doublée toutes les une à deux semaines. Une aggravation transitoire de la congestion est possible : le diurétique est alors ajusté.</p>
<div class="lab">Précautions</div><p>La bradycardie, le bloc auriculoventriculaire de haut degré non appareillé et le choc s’opposent à leur emploi. L’asthme est une précaution et non une contre-indication absolue pour les β1-sélectifs.</p></template>

<template data-pop="d-arm" data-title="Antagonistes des récepteurs minéralocorticoïdes (ARM)">
<div class="lab">Molécules</div><p>Les ARM stéroïdiens sont la spironolactone, dont les effets antiandrogéniques provoquent une gynécomastie, et l’éplérénone, plus sélective. La finérénone est non stéroïdienne.</p>
<div class="lab">Mécanisme</div><p>Le blocage du récepteur minéralocorticoïde augmente la natriurèse, retient le potassium et limite la fibrose myocardique et vasculaire.</p>
<div class="lab">Preuves</div><p>RALES (spironolactone) et EMPHASIS-HF (éplérénone) ont réduit la mortalité dans l’ICFEr.</p>
<div class="lab">Place ESC 2026</div><p>Les ARM sont recommandés en classe I chez tout patient symptomatique, indépendamment de la FEVG : un ARM stéroïdien dans l’ICFEr, stéroïdien ou non stéroïdien dans l’ICFEp.</p>
<div class="lab">Précautions</div><p>Un ARM ne se débute pas si le potassium dépasse 5,0 mmol/L. L’information professionnelle suisse contre-indique la spironolactone si la clairance est &lt; 30 mL/min et l’éplérénone si le DFG est &lt; 30 mL/min/1,73 m² ; elle n’autorise la spironolactone que pour les œdèmes de l’insuffisance cardiaque (100 mg/jour), si bien que la dose pronostique de 25 à 50 mg/jour issue de RALES est prescrite hors du schéma autorisé ; l’éplérénone est autorisée en NYHA II avec FEVG ≤ 30 % et après infarctus avec FEVG ≤ 40 % (informations professionnelles suisses Aldactone® et Inspra®, consultées le 08.10.2026). Potassium et créatinine sont contrôlés à une et quatre semaines, puis régulièrement.</p></template>

<template data-pop="d-sglt2" data-title="Inhibiteurs du SGLT2 (dapagliflozine, empagliflozine)">
<div class="lab">Mécanisme</div><p>Le blocage du cotransporteur sodium-glucose de type 2 du tube proximal provoque une glycosurie et une natriurèse. D’autres effets sont proposés : restauration du rétrocontrôle tubuloglomérulaire (néphroprotection), baisse de la précharge et de la postcharge, substrat énergétique cétonique, effet anti-inflammatoire. Le mécanisme dominant reste débattu.</p>
<div class="lab">Preuves</div><p>DAPA-HF et EMPEROR-Reduced (ICFEr), puis EMPEROR-Preserved et DELIVER (FEVG &gt; 40 %), ont montré une réduction du risque de décès cardiovasculaire ou d’hospitalisation pour insuffisance cardiaque, chez le diabétique comme chez le non-diabétique.</p>
<div class="lab">Posologie</div><p>La dose est de 10 mg une fois par jour, sans titration (informations professionnelles suisses Forxiga® et Jardiance®).</p>
<div class="lab">Effets indésirables</div><p>Les infections génitales mycotiques sont fréquentes. La baisse initiale du DFG est hémodynamique et réversible. L’acidocétose euglycémique est rare, favorisée par le jeûne, la chirurgie et une maladie aiguë.</p>
<div class="lab">Fonction rénale</div><p>L’initiation est possible si le DFG est ≥ 20 mL/min/1,73 m² (empagliflozine) ou ≥ 25 (dapagliflozine), selon les informations professionnelles suisses ; le traitement se poursuit ensuite jusqu’à la dialyse. Il est interrompu temporairement en cas de chirurgie lourde, de jeûne prolongé ou de maladie aiguë grave, en raison du risque d’acidocétose.</p></template>

<template data-pop="d-fin" data-title="Finérénone (ARM non stéroïdien)">
<div class="lab">Particularité</div><p>Sa structure non stéroïdienne lui confère une distribution plus équilibrée entre le cœur et le rein et supprime les effets antiandrogéniques ; le risque d’hyperkaliémie persiste, mais il est modéré.</p>
<div class="lab">Preuves</div><p>FINEARTS-HF (2024), chez des patients à FEVG ≥ 40 %, a montré une réduction du critère décès cardiovasculaire et événements d’insuffisance cardiaque (aggravations et hospitalisations). Les essais FIDELIO-DKD et FIGARO-DKD avaient montré un bénéfice rénal et cardiovasculaire chez le diabétique de type 2 avec maladie rénale chronique.</p>
<div class="lab">Posologie (ESC 2026)</div><p>Si le DFG est de 25 à 59 mL/min/1,73 m², la finérénone débute à 10 mg/jour, avec une cible de 20 mg/jour ; s’il est ≥ 60, elle débute à 20 mg/jour, avec une cible de 40 mg/jour. Elle ne se débute pas si la kaliémie dépasse 5,0 mmol/L.</p>
<div class="lab">Statut en Suisse</div><p>L’information professionnelle suisse de Kerendia® autorise la finérénone dans l’insuffisance cardiaque chronique symptomatique à FEVG ≥ 40 %, avec les mêmes doses ; elle déconseille l’instauration si le DFG est &lt; 25 mL/min/1,73 m² et demande un contrôle du potassium et du DFG quatre semaines après chaque instauration ou ajustement (consultée le 08.10.2026). Le remboursement se lit dans la liste des spécialités de l’OFSP.</p></template>

<template data-pop="d-diur" data-title="Diurétiques de l’anse">
<div class="lab">Mécanisme</div><p>Les diurétiques de l’anse inhibent le cotransporteur Na-K-2Cl de la branche ascendante large de l’anse de Henle, ce qui produit une natriurèse puissante.</p>
<div class="lab">Molécules</div><p>La biodisponibilité orale du furosémide varie d’environ 10 à 90 % et diminue en cas d’œdème digestif ; celle du torasémide est élevée et stable, et sa durée d’action plus longue.</p>
<div class="lab">Pharmacodynamie</div><p>L’effet est à seuil : en dessous d’une concentration tubulaire minimale, aucune natriurèse ne survient. C’est pourquoi il vaut mieux augmenter la dose que la fractionner en petites prises. La réabsorption distale augmente avec le temps (freinage) et entre les prises (rebond).</p>
<div class="lab">Place</div><p>Leur rôle est symptomatique : la dose est la plus faible qui maintient le poids sec, et elle peut souvent être réduite une fois la TMF titrée.</p>
<div class="lab">Surveillance</div><p>Kaliémie, natrémie, créatinine et pression artérielle sont surveillées ; les fortes doses intraveineuses exposent à une ototoxicité.</p></template>

<!-- ===== FENÊTRES PARETO ===== -->
<template data-pop="pareto-def" data-title="Pareto — Définition et classifications">
<p class="ratio" data-cover="i50-1,i50-2"></p>
<ul><li>Syndrome = symptômes + signes + anomalie cardiaque + preuve objective (peptide élevé ou congestion).</li><li>ESC 2026 : deux phénotypes seulement. ICFEr = FEVG &lt; 50 % ; ICFEp = FEVG ≥ 50 %. HFmrEF supprimée.</li><li>Stades A (risque) → B (anomalie asymptomatique) → C (symptomatique) → D (avancé) ; le stade ne régresse pas.</li><li>NYHA = gêne actuelle, variable.</li><li>« Aiguë » → « décompensée ».</li><li>Prévalence 1–2 % des adultes, &gt; 10 % après 70 ans ; ICFEp ≈ la moitié des cas (femme âgée, obèse, hypertendue).</li><li>≈ 50 % de décès à 5 ans après une première hospitalisation ; risque maximal dans le premier mois après la sortie.</li></ul></template>

<template data-pop="pareto-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i50-3"></p>
<ul><li>ICFEr : contractilité ↓ → dilatation (Frank-Starling). ICFEp : remplissage altéré → pressions ↑.</li><li>Compensation SRAA + sympathique : utile à court terme, toxique à long terme (fibrose, arythmies, remodelage).</li><li>Chaque pilier bloque un maillon : IEC/ARNI (angiotensine II), BB (noradrénaline), ARM (aldostérone) ; iSGLT2 (natriurèse, métabolisme).</li><li>Congestion (pressions) ≠ bas débit (perfusion) → quatre profils de Stevenson.</li><li>ICFEp = maladie systémique (obésité, diabète, inflammation).</li></ul></template>

<template data-pop="pareto-clin" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="i50-5,i50-6"></p>
<ul><li>Orthopnée et dyspnée paroxystique nocturne : plus spécifiques que la dyspnée d’effort.</li><li>+ 2 kg en 3 jours fait suspecter une rétention et déclenche le plan d’alerte.</li><li>Signe de congestion le plus fiable : turgescence jugulaire ± reflux hépato-jugulaire. B3 : très spécifique, peu sensible.</li><li>Absence de crépitants ≠ absence de congestion.</li><li>Rechercher des indices de cause (souffle, arythmie, drapeaux rouges d’amylose).</li></ul></template>

<template data-pop="pareto-diag" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="i50-7"></p>
<ul><li>Séquence : suspicion → NT-proBNP + ECG (exclure) → échocardiographie (confirmer, classer, cause).</li><li>Exclusion : NT-proBNP &lt; 125 (ambulatoire) / &lt; 300 pg/mL (décompensé) ; BNP &lt; 35 / &lt; 100.</li><li>Obésité ↓ les peptides ; âge, insuffisance rénale, fibrillation auriculaire ↑. Sous ARNI, le NT-proBNP facilite le suivi ; le BNP reste pronostique.</li><li>ICFEp : FEVG ≥ 50 % + preuves de pressions élevées (oreillette gauche, E/e′) ; scores H2FPEF / HFA-PEFF.</li><li>Toujours un bilan étiologique (coronaires, IRM, amylose).</li></ul></template>

<template data-pop="pareto-decomp" data-title="Pareto — Décompensation">
<p class="ratio" data-cover="i50-8"></p>
<ul><li>Gravité d’abord : détresse respiratoire, PAS &lt; 90 mmHg, hypoperfusion → soins intensifs.</li><li>CHAMP : syndrome coronarien, urgence hypertensive, arythmie, cause mécanique, embolie pulmonaire.</li><li>O₂ si SpO₂ &lt; 90 % ; VNI si œdème pulmonaire en détresse.</li><li>Furosémide intraveineux : 20–40 mg (naïf) ou 1–2 × la dose orale ; natriurèse à 2 h, diurèse à 6 h ; doubler si réponse insuffisante ; + acétazolamide ou hydrochlorothiazide.</li><li>Nitrés si PAS &gt; 110 mmHg ; inotropes uniquement en cas d’hypoperfusion.</li><li>iSGLT2 débuté à l’hôpital (classe I) ; TMF avant la sortie ; contrôle à 1–2 semaines ; poursuivre le bêtabloquant hors choc.</li><li>Quatre présentations : congestive (diurétiques), œdème pulmonaire aigu (VNI, nitrés), VD isolée (traiter la cause, prudence avec les vasodilatateurs), choc (noradrénaline, inotrope, assistance temporaire ; stades SCAI).</li><li>HBPM prophylactique ; pas de morphine en routine ; sortie : euvolémie, fonction rénale stable, ≥ 24 h de traitement oral.</li></ul></template>

<template data-pop="pareto-tt" data-title="Pareto — Traitement chronique">
<p class="ratio" data-cover="i50-9"></p>
<ul><li>ICFEr : quatre piliers (IEC/ARNI, BB, ARM, iSGLT2), introduits rapidement et titrés toutes les 1–2 semaines ; poursuivis même si la FEVG s’améliore.</li><li>ICFEp : iSGLT2 + ARM (dont finérénone) ; agoniste GLP-1 (sémaglutide) ou GIP/GLP-1 (tirzépatide) si obésité (IIa) ; IEC/ARA II/ARNI envisageables (IIb) ; comorbidités.</li><li>Diurétiques : symptômes seulement.</li><li>TMA : digoxine/digitoxine (IIa, FEVG &lt; 40 %), vériciguat (IIb, FEVG &lt; 45 %), ivabradine (FEVG ≤ 35 %, sinusal, FC ≥ 70), fer intraveineux, hydralazine-dinitrate.</li><li>Le DAI en prévention primaire requiert une sélection après ≥ 3 mois de TMF. La CRT classique concerne le patient symptomatique, en rythme sinusal, à FEVG ≤ 35 %, BBG et QRS ≥ 150 ms ; une planification précoce sélectionnée est possible (ESC 2026, IIb). TEER pour l’insuffisance mitrale secondaire.</li><li>Stade D : I NEED HELP → centre spécialisé ; greffe (Berne, Lausanne, Zurich), assistance ventriculaire gauche durable (renforcée en 2026), soins palliatifs précoces.</li></ul></template>

<template data-pop="pareto-bio" data-title="Pareto — Biologie">
<p class="ratio" data-cover="e-2"></p>
<ul><li>Peptides : exclusion ; facteurs ↑ (âge, rein, fibrillation auriculaire) et ↓ (obésité) ; NT-proBNP moins influencé directement par l’ARNI ; BNP toujours pronostique.</li><li>Bilan initial : hémogramme, créatinine/DFG, Na/K, ferritine + saturation de la transferrine, TSH, glycémie/HbA1c, lipides, tests hépatiques.</li><li>Carence martiale : ferritine &lt; 100, ou 100–299 avec saturation de la transferrine &lt; 20 %.</li></ul></template>

<template data-pop="pareto-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e-1,e-2,e-3,e-4,e-5"></p>
<ul><li>Échocardiographie : examen de référence de première ligne. FEVG (Simpson) ; E/e′ &gt; 14, OG &gt; 34 mL/m² et vitesse tricuspide &gt; 2,8 m/s sont des indices indirects à confronter ; TAPSE &lt; 17 mm soutient une fonction systolique droite altérée.</li><li>ECG normal : ICFEr très improbable ; un bloc de branche gauche avec QRS ≥ 150 ms fait rechercher une indication de CRT selon les autres critères.</li><li>Radiographie : redistribution → lignes de Kerley → œdème alvéolaire.</li><li>IRM : caractérisation tissulaire (patterns de rehaussement tardif).</li><li>ATTR : scintigraphie de grade 2–3 + absence de protéine monoclonale = diagnostic sans biopsie.</li><li>Cathétérisme droit : pression capillaire ≥ 15 mmHg au repos (≥ 25 à l’effort) = ICFEp.</li></ul></template>

<template data-pop="pareto-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="p-1,p-2,p-3,p-4,p-5"></p>
<ul><li>Doses cibles : sacubitril/valsartan 97/103 × 2 ; bisoprolol 10 ; carvédilol 25 × 2 ; spironolactone 50 (hors schéma suisse autorisé) ; iSGLT2 10 mg (sans titration).</li><li>Intervalle de 36 h entre IEC et ARNI ; titration de l’ARNI toutes les 2–4 semaines selon l’information professionnelle suisse.</li><li>Une hausse de créatinine &lt; 50 % n’est tolérable selon le repère ESC 2021 que si elle reste &lt; 266 µmol/L, après évaluation clinique et biologique. Les seuils de potassium exigent une conduite propre à la molécule ; ≥ 6,0 mmol/L impose une prise en charge urgente.</li><li>En cas d’hypotension symptomatique, on évalue perfusion et congestion et retire les hypotenseurs sans bénéfice pronostique. Le diurétique se réduit seulement si la congestion est absente.</li><li>Digoxinémie 0,5–0,9 ng/mL ; ivabradine si FEVG ≤ 35 %, sinusal, FC ≥ 70 ; vériciguat 2,5 → 10 mg, contre-indiqué avec les inhibiteurs de la phosphodiestérase 5.</li><li>À éviter : AINS, vérapamil/diltiazem, dronédarone, glitazones, saxagliptine, antiarythmiques de classe I.</li></ul></template>

<template data-pop="d-dig" data-title="Glycosides cardiaques (digoxine, digitoxine)">
<div class="lab">Mécanisme</div><p>Inhibition de la Na⁺/K⁺-ATPase : le sodium intracellulaire augmente, l’échangeur Na⁺/Ca²⁺ expulse moins de calcium, et le calcium disponible pour la contraction augmente (inotropie positive). S’y ajoute un effet vagal qui ralentit la conduction auriculoventriculaire.</p>
<div class="lab">Place (ESC 2026)</div><p>Ils sont recommandés en classe IIa dans l’ICFEr symptomatique à FEVG &lt; 40 %, en rythme sinusal ou en fibrillation auriculaire, malgré une TMF optimale, pour réduire les hospitalisations. La digitoxine a été évaluée dans l’essai DIGIT-HF. Les glycosides servent aussi au contrôle de la fréquence en fibrillation auriculaire.</p>
<div class="lab">Pharmacocinétique</div><p>La digoxine s’élimine par le rein ; sa demi-vie, d’environ 36 heures, s’allonge en insuffisance rénale. La digitoxine s’élimine surtout par le foie, avec une demi-vie de plusieurs jours, ce qui la rend intéressante chez l’insuffisant rénal.</p>
<div class="lab">Surveillance</div><p>La digoxinémie visée est basse, de 0,5 à 0,9 ng/mL, sur un prélèvement fait au moins 6 heures après la prise ; kaliémie et fonction rénale sont surveillées.</p>
<div class="lab">Toxicité</div><p>Elle est favorisée par l’hypokaliémie, l’hypomagnésémie, l’insuffisance rénale et l’âge. Elle se manifeste par des nausées, troubles visuels (dyschromatopsie jaune-vert), confusion, arythmies (extrasystoles, tachycardie atriale avec bloc, bloc auriculoventriculaire). L’antidote est constitué de fragments d’anticorps antidigoxine. L’amiodarone, le vérapamil et la clarithromycine augmentent les taux.</p></template>

<template data-pop="d-iva" data-title="Ivabradine">
<div class="lab">Mécanisme</div><p>L’ivabradine bloque sélectivement le courant If (canal HCN4) du nœud sinusal : elle abaisse la fréquence sans effet inotrope ni tensionnel. Elle est inefficace en fibrillation auriculaire, puisque la fréquence n’y dépend plus du nœud sinusal.</p>
<div class="lab">Place</div><p>Elle s’adresse à l’ICFEr symptomatique à FEVG ≤ 35 %, en rythme sinusal, avec une fréquence ≥ 70/min malgré un bêtabloquant à dose maximale tolérée ou contre-indiqué. L’essai SHIFT a montré une réduction du critère décès cardiovasculaire ou hospitalisation pour insuffisance cardiaque.</p>
<div class="lab">Posologie</div><p>Elle débute à 5 mg deux fois par jour (2,5 mg deux fois par jour après 75 ans), puis passe à 7,5 mg deux fois par jour ; la fréquence de repos visée se situe entre 50 et 60/min.</p>
<div class="lab">Effets indésirables</div><p>Elle provoque des phosphènes (phénomènes lumineux transitoires), une bradycardie et favorise la fibrillation auriculaire. Métabolisée par le CYP3A4, elle est contre-indiquée avec les inhibiteurs puissants (clarithromycine, kétoconazole) et pendant la grossesse.</p>
<div class="lab">Autorisation</div><p>L’information professionnelle suisse de Procoralan® retient, dans l’insuffisance cardiaque, une FEVG ≤ 35 % et une fréquence ≥ 70/min en rythme sinusal (consultée le 08.10.2026) ; l’association au vérapamil ou au diltiazem est contre-indiquée.</p></template>

<template data-pop="d-veri" data-title="Vériciguat">
<div class="lab">Mécanisme</div><p>Le vériciguat stimule directement la guanylate cyclase soluble et la sensibilise au monoxyde d’azote endogène : le GMP cyclique augmente, avec une vasodilatation et des effets myocardiques favorables. Cette voie est déficiente dans l’insuffisance cardiaque.</p>
<div class="lab">Place (ESC 2026)</div><p>Il est recommandé en classe IIb dans l’ICFEr symptomatique à FEVG &lt; 45 % malgré une TMF optimale, surtout après une aggravation récente (population de l’essai VICTORIA). L’information professionnelle suisse le limite aux patients stabilisés après une décompensation récente ayant exigé un traitement intraveineux.</p>
<div class="lab">Posologie</div><p>La dose initiale de 2,5 mg/jour, prise avec un repas, est doublée environ toutes les deux semaines jusqu’à 10 mg/jour, selon la tolérance tensionnelle.</p>
<div class="lab">Précautions</div><p>Le médecin surveille l’hypotension. Les dérivés nitrés exigent une prudence, particulièrement les formes prolongées dont l’expérience est limitée ; ce n’est pas une contre-indication générale. L’information professionnelle suisse contre-indique l’association avec un inhibiteur de la phosphodiestérase 5, comme le sildénafil, et avec un autre stimulateur de la guanylate cyclase soluble, tel le riociguat. Aucune donnée n’existe pendant la grossesse ; une contraception hautement efficace est exigée chez la femme en âge de procréer. Source : information professionnelle suisse Verquvo®, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>

<template data-pop="d-hisdn" data-title="Hydralazine et dinitrate d’isosorbide">
<div class="lab">Mécanisme</div><p>L’hydralazine dilate les artérioles (baisse de la postcharge) et limite la tolérance aux nitrés ; le dinitrate d’isosorbide dilate les veines (baisse de la précharge) et apporte du monoxyde d’azote.</p>
<div class="lab">Place</div><p>L’association est une alternative en cas d’intolérance ou de contre-indication aux IEC, ARA II et ARNI (hyperkaliémie, insuffisance rénale). Elle s’ajoute à la TMF chez les patients d’ascendance africaine qui restent symptomatiques (essai A-HeFT). Elle est utilisable pendant la grossesse.</p>
<div class="lab">Contraintes</div><p>Elle impose trois prises quotidiennes et provoque céphalées et hypotension ; l’hydralazine à forte dose peut induire un syndrome lupique.</p></template>

<template data-pop="pareto-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i50-10,i50-11"></p>
<ul><li>Créatinine et K⁺ à 1–2 semaines de chaque titration ; pesée quotidienne ; + 2 kg en 3 jours = alerte.</li><li>Éducation, restriction sodée modérée, réadaptation, vaccinations OFSP.</li><li>Échocardiographie à 3–6 mois de TMF (décision des dispositifs) ; FEVG améliorée → ne pas arrêter (TRED-HF).</li><li>Rein : hausse modérée de la créatinine attendue ; hyperkaliémie → chélateurs plutôt qu’arrêt.</li><li>Grossesse : IEC, ARA II, ARNI, ARM, iSGLT2 et ivabradine contre-indiqués ; β1-sélectifs, hydralazine, nitrés et diurétiques permis.</li><li>FA : anticoagulation (CHA₂DS₂-VA), ablation (CASTLE-AF, CASTLE-HTx). Apnée centrale + FEVG ≤ 45 % : pas de servo-ventilation.</li><li>Stade B : IEC + bêtabloquant après infarctus ou dysfonction asymptomatique. ICFEp : PA &lt; 130/80 mmHg.</li><li>Cardio-oncologie : GLS avant et pendant anthracyclines/trastuzumab ; baisse relative &gt; 15 % → protection cardiaque.</li><li>Anémie sans carence : chercher la cause ; pas d’agent stimulant l’érythropoïèse (RED-HF). Hyponatrémie : restriction hydrique ; tolvaptan en dernier recours.</li></ul></template>
<template data-pop="pareto-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="sa-i,sh-i,sp-i,sb-i,sg-i"></p>
<ul><li>Sous-endocarde (fibres longitudinales) : atteint en premier → strain longitudinal altéré avant la FEVG.</li><li>Dilatation → insuffisance mitrale secondaire (traction des piliers).</li><li>Fibrose (angiotensine II, aldostérone) → rigidité, arythmies, rehaussement tardif en IRM ; bloquée par les ARM.</li><li>Laplace : σ = P × r / 2h → dilatation = contrainte ↑ = BNP ↑.</li><li>Frank-Starling aplatie en ICFEr ; relation télédiastolique raide en ICFEp.</li><li>Le BNP peut augmenter sous ARNI et reste pronostique ; le NT-proBNP n’est pas directement dégradé par la néprilysine. La fonction rénale influence les deux peptides.</li><li>SRAA : rénine → angiotensine I → ECA → angiotensine II (AT1) → aldostérone (RM). Cibles : ECA (IEC), AT1 (ARA II), RM (ARM), néprilysine (sacubitril), SGLT2, sGC (vériciguat), If (ivabradine), Na⁺/K⁺-ATPase (digitaliques), NKCC2 (diurétiques de l’anse).</li><li>Génétique : <i>TTN</i> (dilatée), <i>LMNA</i>/<i>FLNC</i> (risque rythmique → défibrillateur), <i>MYH7</i>/<i>MYBPC3</i> (hypertrophique), <i>TTR</i> (amylose) → dépistage familial.</li></ul></template>

<p class="ratio" data-cover="i50-4"></p>
<ul><li>ICFEr : ischémie d’abord ; ICFEp : hypertension d’abord.</li><li>Ne pas manquer : valvulopathie, amylose (sujet âgé, parois épaisses, bas voltage), toxiques (alcool, anthracyclines, trastuzumab), cardiomyopathie rythmique, myocardite.</li><li>Causes traitables → traitement spécifique (revascularisation, valve, abstinence, contrôle de fréquence, tafamidis).</li><li>Décompensation : CHAMP d’abord, puis causes banales (sel, non-observance, infection, FA, AINS).</li><li>À proscrire : AINS, glitazones, vérapamil/diltiazem (ICFEr).</li></ul></template>
<template data-pop="choc" data-title="Choc cardiogénique">
<div class="lab">Définition</div><p>Une défaillance cardiaque entraîne une hypoperfusion d’organes. Une PAS &lt; 90 mmHg ou un besoin de vasopresseur est fréquent, mais une pression conservée n’exclut pas le choc. Extrémités froides, oligurie, confusion et lactate élevé orientent l’évaluation ; un lactate normal ne l’exclut pas. Un index cardiaque bas et les pressions de remplissage précisent le profil lorsqu’ils sont mesurés, sans devenir des critères obligatoires dans tous les cas.</p>
<div class="lab">Stades SCAI</div><p><b>A</b> — à risque ; <b>B</b> — début (hypotension ou tachycardie sans hypoperfusion) ; <b>C</b> — classique (hypoperfusion nécessitant une intervention) ; <b>D</b> — aggravation malgré le traitement initial ; <b>E</b> — extrême (collapsus réel ou imminent malgré un soutien intensif, avec ou sans arrêt circulatoire). Un arrêt cardiaque est aussi un modificateur de risque distinct, notamment s’il s’accompagne de coma.</p>
<div class="lab">Conduite</div><p>Le patient reçoit des soins intensifs et un traitement urgent de la cause, notamment une revascularisation si un syndrome coronarien le justifie. Vasopresseur, inotrope et assistance temporaire se choisissent selon la perfusion, la pression et la réponse initiale. Le stade SCAI décrit la gravité et son évolution ; il ne prescrit pas seul un dispositif. Source de la classification : <a href="https://doi.org/10.1016/j.jscai.2021.100008" target="_blank" rel="noopener">consensus de la Society for Cardiovascular Angiography and Interventions, 2022</a> ; classification descriptive de la gravité, tandis que la conduite suit l’ESC 2026.</p></template>
<template data-pop="serve" data-title="Servo-ventilation et essai SERVE-HF">
<p>La servo-ventilation auto-adaptative ajuste la pression délivrée cycle par cycle pour supprimer la respiration de Cheyne-Stokes de l’apnée centrale.</p>
<div class="lab">Résultat</div><p>Dans l’essai SERVE-HF (ICFEr, FEVG ≤ 45 %, apnée centrale prédominante), elle a augmenté la mortalité cardiovasculaire, malgré la correction des apnées.</p>
<div class="lab">Hypothèses</div><p>La pression intrathoracique positive réduit le retour veineux et le débit ; la respiration de Cheyne-Stokes pourrait être une compensation plutôt qu’une cause. Ces mécanismes restent des hypothèses.</p></template>
<template data-pop="tolvaptan" data-title="Tolvaptan">
<div class="lab">Mécanisme</div><p>Le tolvaptan bloque le récepteur V2 de la vasopressine au tube collecteur : il fait excréter de l’eau libre (aquarèse) sans perte de sodium.</p>
<div class="lab">Usage</div><p>Il se discute dans l’hyponatrémie de dilution sévère et persistante, en milieu hospitalier. En Suisse, l’autorisation couvre l’hyponatrémie du SIADH ; l’usage dans l’insuffisance cardiaque est hors indication. L’essai EVEREST n’a montré aucun bénéfice sur la mortalité.</p>
<div class="lab">Sécurité</div><p>La natrémie ne doit pas augmenter de plus de 8 à 10 mmol/L par 24 heures (risque de myélinolyse osmotique) ; hépatotoxicité.</p></template>
<template data-pop="lvad" data-title="Assistance ventriculaire gauche durable">
<div class="lab">Principe</div><p>Une pompe à flux continu aspire le sang à l’apex du ventricule gauche et l’éjecte dans l’aorte.</p>
<div class="lab">Profils INTERMACS</div><p>Le registre classe les patients de 1 (choc critique) à 7 (NYHA III avancée). Les profils 2 à 4 sont les candidats habituels ; au profil 1, une assistance temporaire précède souvent la décision.</p>
<div class="lab">Conditions</div><p>L’implantation exige une fonction ventriculaire droite suffisante (PAPi, POD), l’absence de contre-indication majeure, un entourage présent et une adhésion au suivi.</p>
<div class="lab">Complications</div><p>Les complications sont l’infection du câble, la thrombose de pompe, l’AVC, les hémorragies digestives favorisées par un syndrome de von Willebrand acquis, et la défaillance ventriculaire droite.</p></template>
