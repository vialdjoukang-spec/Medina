
<!-- ===== FENÊTRES : examens ===== -->
<template data-pop="ecg-ic" data-title="ECG dans l’insuffisance cardiaque">
<div class="lab">Valeur négative</div><p>Un ECG strictement normal rend une ICFEr très improbable : sa sensibilité est élevée, sa spécificité faible.</p>
<div class="lab">Anomalies orientantes</div><p>Ondes Q (séquelle d’infarctus) ; hypertrophie ventriculaire gauche ; fibrillation auriculaire ; bas voltage (amylose, épanchement péricardique) ; bloc de branche gauche (asynchronisme, indication de resynchronisation si QRS ≥ 150 ms) ; bloc auriculoventriculaire (sarcoïdose, <i>LMNA</i>, amylose).</p>
<div class="lab">Piège</div><p>Un bloc de branche gauche rend l’interprétation du segment ST difficile en cas de douleur thoracique.</p></template>

<template data-pop="echo" data-title="Échocardiographie transthoracique">
<div class="lab">Question clinique</div><p>Quelle est la FEVG, les pressions de remplissage sont-elles élevées, et quelle est la cause ?</p>
<div class="lab">Principe</div><p>Ultrasons réfléchis par les interfaces tissulaires (mode bidimensionnel) ; effet Doppler pour les vitesses sanguines et tissulaires ; suivi des marqueurs acoustiques (« speckle tracking ») pour le strain.</p>
<div class="lab">Mesures clés</div><p>FEVG par méthode de Simpson biplan ; strain longitudinal global ; E/e′ ; volume de l’oreillette gauche ; vitesse de l’insuffisance tricuspide ; TAPSE ; valves ; péricarde ; veine cave inférieure.</p>
<div class="lab">Limites</div><p>Dépend de l’échogénicité et de l’opérateur ; variabilité de la FEVG d’environ ± 5 à 10 points. Une variation de FEVG de quelques points n’a donc pas de sens isolément.</p>
<div class="lab">Alternatives</div><p>IRM cardiaque (référence pour les volumes et la FEVG), échocardiographie transœsophagienne (valves, thrombus).</p>
<div class="lab">Sécurité</div><p>Examen non irradiant, sans risque.</p></template>

<template data-pop="h2fpef" data-title="Scores de probabilité d’ICFEp">
<div class="lab">H2FPEF (0 à 9 points)</div><p><b>H</b>eavy : IMC &gt; 30 kg/m² (2) ; <b>H</b>ypertensif : ≥ 2 antihypertenseurs (1) ; <b>F</b>ibrillation auriculaire (3) ; hypertension <b>P</b>ulmonaire : PAPS &gt; 35 mmHg (1) ; <b>E</b>lder : âge &gt; 60 ans (1) ; <b>F</b>illing pressure : E/e′ &gt; 9 (1).</p>
<div class="lab">Lecture</div><p>0–1 : ICFEp peu probable ; 6–9 : ICFEp très probable ; 2–5 : zone grise, justifiant un test d’effort ou un cathétérisme.</p>
<div class="lab">HFA-PEFF</div><p>Trois domaines, chacun coté 0, 1 ou 2 (majeur 2, mineur 1 ; on retient le plus haut par domaine).</p>
<p><b>Fonctionnel.</b> Majeurs : e′ septale &lt; 7 ou latérale &lt; 10 cm/s ; E/e′ moyen ≥ 15 ; vitesse de l’insuffisance tricuspide &gt; 2,8 m/s (PAPS &gt; 35 mmHg). Mineurs : E/e′ 9–14 ; GLS &lt; 16 % en valeur absolue.</p>
<p><b>Morphologique.</b> Majeurs : OG &gt; 34 mL/m² (&gt; 40 en FA) ; masse VG ≥ 149 g/m² (homme) ou ≥ 122 g/m² (femme) avec épaisseur relative &gt; 0,42. Mineurs : OG 29–34 (34–40 en FA) ; masse &gt; 115 (homme) ou &gt; 95 g/m² (femme) ; épaisseur relative &gt; 0,42 ; paroi ≥ 12 mm.</p>
<p><b>Biomarqueur.</b> Rythme sinusal : majeur NT-proBNP &gt; 220 ou BNP &gt; 80 pg/mL ; mineur 125–220 ou 35–80. Fibrillation auriculaire : majeur NT-proBNP &gt; 660 ou BNP &gt; 240 ; mineur 365–660 ou 105–240.</p>
<p><b>Lecture.</b> ≥ 5 : ICFEp confirmée ; ≤ 1 : peu probable ; 2–4 : échocardiographie d’effort ou cathétérisme.</p>
<div class="lab">Aide pédagogique</div><p>Outils de probabilité, non critères diagnostiques officiels.</p></template>

<template data-pop="irm" data-title="IRM cardiaque">
<div class="lab">Question clinique</div><p>Quelle est la nature du tissu myocardique ?</p>
<div class="lab">Séquences</div><p>Ciné-IRM (volumes, FEVG : référence) ; T2 (œdème, inflammation aiguë) ; T1 natif et volume extracellulaire (fibrose diffuse, amylose) ; rehaussement tardif au gadolinium (cicatrice, fibrose focale).</p>
<div class="lab">Patterns du rehaussement tardif</div><p>Sous-endocardique ou transmural dans un territoire coronaire : ischémique. Sous-épicardique ou intramyocardique : myocardite, sarcoïdose, cardiomyopathie non ischémique. Sous-endocardique global et diffus, difficulté à « annuler » le myocarde : amylose.</p>
<div class="lab">Contre-indications et limites</div><p>Certains dispositifs implantés non compatibles ; claustrophobie ; si DFG &lt; 30 mL/min/1,73 m², utiliser un agent macrocyclique à la plus petite dose utile ; les agents linéaires sont proscrits (fibrose systémique néphrogénique) ; arythmie qui dégrade l’image.</p></template>

<template data-pop="echopulm" data-title="Échographie pulmonaire (lignes B)">
<p>Les lignes B sont des artefacts verticaux hyperéchogènes, partant de la plèvre et descendant jusqu’au bas de l’écran, qui bougent avec la respiration. Elles traduisent un épaississement des septa interlobulaires par l’œdème.</p>
<div class="lab">Interprétation</div><p>Au moins trois lignes B par espace intercostal dans au moins deux zones de chaque côté : syndrome interstitiel bilatéral, compatible avec un œdème pulmonaire cardiogénique.</p>
<div class="lab">Piège</div><p>La fibrose pulmonaire et le SDRA donnent aussi des lignes B. Des lignes B unilatérales ou focales évoquent une pneumonie.</p></template>

<template data-pop="cpet" data-title="Épreuve d’effort cardiorespiratoire">
<p>Épreuve d’effort avec analyse des gaz expirés, qui mesure la consommation d’oxygène (VO₂) et l’efficacité ventilatoire.</p>
<div class="lab">Paramètres</div><p>VO₂ pic (normale &gt; 20 mL/kg/min environ, selon l’âge et le sexe ; exprimée aussi en % de la valeur prédite) ; pente VE/VCO₂ (&gt; 35 : pronostic défavorable) ; seuil anaérobie ; quotient respiratoire (≥ 1,05–1,10 : effort maximal atteint).</p>
<div class="lab">Décision</div><p>Une VO₂ pic ≤ 12 mL/kg/min sous bêtabloquant (≤ 14 sans bêtabloquant) fait partie des critères d’évaluation pour la transplantation cardiaque.</p>
<div class="lab">Intérêt diagnostique</div><p>Distingue une limitation cardiaque, respiratoire ou un déconditionnement chez un patient dyspnéique.</p></template>

<template data-pop="natriurese" data-title="Évaluer la réponse diurétique">
<div class="lab">Deux critères précoces</div><p><b>À 2 heures</b> : sodium urinaire sur échantillon &lt; 50–70 mmol/L = réponse insuffisante. <b>À 6 heures</b> : diurèse &lt; 100–150 mL/h = réponse insuffisante.</p>
<div class="lab">Conduite</div><p>Réponse insuffisante : doubler la dose de diurétique de l’anse intraveineux (jusqu’à la dose maximale), puis envisager l’association d’un diurétique à un autre site d’action.</p>
<div class="lab">Statut</div><p>La stratégie guidée par la natriurèse est une recommandation de classe IIb dans l’ESC 2026.</p></template>

<template data-pop="blocseq" data-title="Blocage séquentiel du néphron">
<div class="lab">Problème</div><p>Sous diurétique de l’anse chronique, le tube contourné distal s’hypertrophie et réabsorbe davantage le sodium qui lui arrive : c’est une cause de résistance aux diurétiques.</p>
<div class="lab">Solution</div><p>Bloquer plusieurs segments : l’<b>acétazolamide</b> agit sur le tube proximal (anhydrase carbonique ; essai ADVOR) ; l’<b>hydrochlorothiazide</b> ou la métolazone agit sur le tube distal (essai CLOROTIC).</p>
<div class="lab">Surveillance</div><p>Hypokaliémie, hyponatrémie, hypovolémie et hausse de la créatinine : ionogramme quotidien. L’acétazolamide corrige l’alcalose métabolique de contraction.</p></template>

<template data-pop="carfer" data-title="Carence martiale dans l’insuffisance cardiaque">
<div class="lab">Définition propre à l’insuffisance cardiaque</div><p>Ferritine &lt; 100 µg/L, <b>ou</b> ferritine 100–299 µg/L avec saturation de la transferrine &lt; 20 %. Elle existe avec ou sans anémie.</p>
<div class="lab">Pourquoi un seuil élevé</div><p>L’inflammation chronique élève la ferritine (protéine de phase aiguë) : une ferritine « normale » peut masquer une carence fonctionnelle.</p>
<div class="lab">Traitement</div><p>Fer intraveineux (carboxymaltose ferrique ou dérisomaltose ferrique) : amélioration des symptômes, de la capacité d’effort et de la qualité de vie ; réduction des hospitalisations (essais AFFIRM-AHF, IRONMAN). Le fer oral est inefficace dans cette indication (essai IRONOUT-HF).</p>
<div class="lab">Piège</div><p>Chercher une cause digestive à toute carence martiale, surtout sous anticoagulant ou antiagrégant.</p>
<div class="lab">Source</div><p>Définition et recommandation détaillées : ESC 2021 et mise à jour ciblée 2023 (fer intraveineux chez le patient symptomatique à FEVG &lt; 50 % : classe I pour les symptômes et la qualité de vie, classe IIa pour réduire les hospitalisations). Ce sont les dernières classes dont le détail a été vérifié ici.</p></template>

<template data-pop="dai" data-title="Défibrillateur automatique implantable">
<div class="lab">Prévention secondaire</div><p>Après une arythmie ventriculaire avec instabilité hémodynamique, en l’absence de cause réversible.</p>
<div class="lab">Prévention primaire (repères ESC 2021)</div><p>ICFEr symptomatique (NYHA II–III), FEVG ≤ 35 % malgré au moins trois mois de TMF optimisée, espérance de vie &gt; 1 an en bon état fonctionnel. Classe I pour l’étiologie ischémique (au moins 40 jours après un infarctus) ; classe IIa pour l’étiologie non ischémique.</p>
<div class="lab">Pièges</div><p>Ne pas implanter trop tôt : la FEVG peut remonter sous TMF, après revascularisation ou contrôle d’une tachycardie. Certaines cardiomyopathies génétiques (<i>LMNA</i>) justifient un défibrillateur au-delà de 35 %.</p>
<div class="lab">Source</div><p>Classes détaillées de l’ESC 2021, dernières dont le détail a été vérifié ici. La décision tient compte de la FEVG, de l’étiologie, du substrat (fibrose en IRM, génétique) et de l’espérance de vie.</p></template>

<template data-pop="crt" data-title="Resynchronisation cardiaque (CRT)">
<div class="lab">Principe</div><p>Stimulation biventriculaire qui corrige l’asynchronisme de contraction dû au bloc de branche gauche : efficacité mécanique accrue, régression de l’insuffisance mitrale, remodelage inverse.</p>
<div class="lab">Indication classique (classe I)</div><p>ICFEr symptomatique, rythme sinusal, bloc de branche gauche avec QRS ≥ 150 ms, FEVG ≤ 35 % malgré une TMF optimale.</p>
<div class="lab">Nouveauté ESC 2026</div><p>CRT plutôt que stimulation ventriculaire droite chez un patient avec ICFEr et indication de stimulation pour bloc auriculoventriculaire de haut degré, quelle que soit la classe NYHA ou la largeur du QRS (IIa).</p>
<div class="lab">Autres configurations (repères ESC 2021)</div><p>BBG avec QRS 130–149 ms : IIa. Non-BBG avec QRS ≥ 150 ms : IIa. Non-BBG avec QRS 130–149 ms : IIb. QRS &lt; 130 ms : pas d’indication (III).</p>
<div class="lab">Piège</div><p>Le bénéfice est faible ou absent lorsque le QRS est fin ou qu’il ne s’agit pas d’un bloc de branche gauche.</p></template>

<template data-pop="ineedhelp" data-title="« I NEED HELP » — signaux d’insuffisance cardiaque avancée">
<p><b>I</b> — Inotropes intraveineux antérieurs ou en cours ;<br><b>N</b> — NYHA III–IV ou peptides natriurétiques élevés de façon persistante ;<br><b>E</b> — End-organ : dysfonction rénale ou hépatique progressive ;<br><b>E</b> — Éjection : FEVG ≤ 25 % ;<br><b>D</b> — Défibrillateur : chocs appropriés répétés ;<br><b>H</b> — Hospitalisations : plus d’une en 12 mois ;<br><b>E</b> — Œdèmes persistants malgré l’escalade des diurétiques ;<br><b>L</b> — Low : PAS basse (&lt; 90–100 mmHg) ou fréquence cardiaque élevée de façon persistante ;<br><b>P</b> — Prognostic medication : intolérance ou nécessité de réduire la TMF.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. Un seul signal justifie de discuter un avis en centre spécialisé (classe I dans l’ESC 2026 pour le stade D).</p></template>
