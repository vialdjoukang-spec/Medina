<section class="ilot" id="i50-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un patient de 72 ans consulte pour un essoufflement qui s’aggrave depuis trois semaines. Il dort désormais avec trois oreillers et ses chevilles gonflent le soir. La question qui structure tout le chapitre est la suivante : <b>ce patient a-t-il une insuffisance cardiaque, de quel type, pourquoi maintenant, et quel traitement modifiera son pronostic ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître le syndrome, le confirmer par une séquence d’examens raisonnée, classer le patient selon la fraction d’éjection et le stade, identifier la cause et le facteur déclenchant, conduire une décompensation et construire un traitement de fond selon les recommandations de la Société européenne de cardiologie (ESC) 2026.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="frank">loi de Frank-Starling (précharge et volume d’éjection)</button>, la <button class="w" data-k="pvloop">boucle pression-volume (lecture de la fonction ventriculaire)</button> et le <button class="w" data-k="raas">système rénine-angiotensine-aldostérone (boucle de compensation)</button>. Ces trois notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i50-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>L’insuffisance cardiaque n’est pas une maladie unique : c’est un <b>syndrome clinique</b>. Il associe des symptômes (dyspnée, fatigue) et des signes (œdèmes, crépitants) causés par une anomalie structurelle ou fonctionnelle du cœur. Cette anomalie entraîne une élévation des pressions de remplissage et/ou un débit cardiaque insuffisant, au repos ou à l’effort. La définition universelle exige une preuve objective : un <button class="w" data-k="np">peptide natriurétique élevé (BNP, NT-proBNP)</button> ou une preuve de congestion pulmonaire ou systémique.</p>
<h3>1.1 Classification selon la fraction d’éjection (ESC 2026)</h3>
<p><button class="w" data-k="i50-esc-2026-comparaison">Comparer les classifications ESC 2021/2023 et ESC 2026</button>.</p>
<p>Les recommandations ESC 2026 ont simplifié la classification. La catégorie intermédiaire « fraction d’éjection légèrement réduite » (41–49 %) a été supprimée, car ces patients partagent la physiopathologie et la réponse thérapeutique des formes à fraction réduite.</p>
<table class="t"><tr><th>Phénotype</th><th>Fraction d’éjection ventriculaire gauche (FEVG)</th><th>Conséquence pratique</th></tr>
<tr><td><b>ICFEr</b> — fraction d’éjection réduite (HFrEF)</td><td>&lt; 50 %</td><td>Thérapie médicamenteuse fondamentale à quatre classes</td></tr>
<tr><td><b>ICFEp</b> — fraction d’éjection préservée (HFpEF)</td><td>≥ 50 %</td><td>Thérapie fondamentale à deux classes (ARM, iSGLT2) et traitement des comorbidités</td></tr></table>
<div class="trap"><span class="k">Piège</span>Les articles et les QCM antérieurs à août 2026 utilisent encore trois catégories (réduite ≤ 40 %, légèrement réduite 41–49 %, préservée ≥ 50 %). Une question ou un article se lit avec le référentiel de son année : l’ESC 2026 a réuni les deux premiers groupes. Un patient à FEVG 45 % relève désormais de l’ICFEr.</div>
<h3>1.2 Stades A à D</h3>
<p>L’ESC 2026 adopte une lecture en stades, qui place l’insuffisance cardiaque sur un continuum allant du risque à la maladie avancée. Le stade ne régresse pas : un patient devenu asymptomatique sous traitement reste au stade C.</p>
<div class="two">
<div class="card"><h4>Stade A — à risque</h4><p>Facteurs de risque (hypertension, diabète, obésité, cardiotoxiques) sans anomalie cardiaque ni symptôme.</p></div>
<div class="card"><h4>Stade B — pré-insuffisance cardiaque</h4><p>Anomalie cardiaque structurelle ou fonctionnelle (dysfonction ventriculaire, hypertrophie, peptide élevé) sans symptôme.</p></div>
<div class="card"><h4>Stade C — insuffisance cardiaque symptomatique</h4><p>Symptômes actuels ou antérieurs liés à une anomalie cardiaque.</p></div>
<div class="card"><h4>Stade D — avancée</h4><p>Symptômes sévères persistants malgré un traitement optimal ; justifie un avis en centre spécialisé.</p></div></div>
<h3>1.3 Classe fonctionnelle NYHA</h3>
<p>La <button class="w" data-k="nyha">classification NYHA (quatre classes de tolérance à l’effort)</button> mesure la gêne fonctionnelle actuelle. Contrairement au stade, elle varie d’une consultation à l’autre. Elle guide certaines indications (dispositifs, avis avancé) mais ne définit pas le phénotype.</p>
<h3>1.4 Chronique et décompensée</h3>
<p>Le terme « insuffisance cardiaque aiguë » est remplacé par <b>insuffisance cardiaque décompensée</b>. Ce changement reflète la réalité : la plupart des patients s’aggravent sur plusieurs jours par accumulation de congestion, et non brutalement. On distingue la décompensation d’une insuffisance cardiaque connue et l’insuffisance cardiaque inaugurale (« de novo »).</p>
</section>

<section class="ilot" id="i50-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Dans les pays à haut revenu, l’insuffisance cardiaque touche environ 1 à 2 % des adultes. La prévalence dépasse 10 % après 70 ans ; l’âge est donc le premier déterminant épidémiologique. L’incidence ajustée sur l’âge tend à se stabiliser, mais le nombre absolu de patients augmente avec le vieillissement de la population et la meilleure survie après infarctus.</p>
<p>La répartition entre phénotypes évolue. L’ICFEp représente environ la moitié des cas ; elle prédomine chez la femme âgée, hypertendue, obèse ou diabétique. L’ICFEr prédomine chez l’homme et reste dominée par la cardiopathie ischémique.</p>
<p>Le pronostic reste lourd. Après une première hospitalisation pour décompensation, environ la moitié des patients décèdent dans les cinq ans. Chaque réhospitalisation aggrave le pronostic. La <button class="w" data-k="vulnerable">phase vulnérable (réhospitalisations précoces)</button>, qui couvre les trois à six mois suivant la sortie et culmine le premier mois, concentre le risque.</p>

<section class="ilot" id="i50-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Comprendre la physiopathologie permet de déduire les symptômes et, surtout, de comprendre pourquoi chaque médicament agit. Le raisonnement suit une chaîne : <b>atteinte initiale → baisse de la performance cardiaque → compensation neurohormonale → remodelage → congestion et bas débit.</b></p>
<h3>3.1 L’atteinte initiale</h3>
<p>Dans l’ICFEr, la contractilité diminue : infarctus, cardiomyopathie dilatée ou toxique. Le ventricule se dilate pour maintenir son volume d’éjection grâce à la <button class="w" data-k="frank">loi de Frank-Starling (précharge et volume d’éjection)</button>. Dans l’ICFEp, la fraction d’éjection est préservée, mais cela ne garantit pas une fonction systolique normale. Une relaxation ralentie ou une compliance diminuée peut imposer des pressions de remplissage élevées, parfois seulement à l’effort. Cette <button class="w" data-k="diastole">dysfonction diastolique (relaxation et compliance)</button> transmet la pression en amont, vers l’oreillette gauche puis les capillaires pulmonaires.</p>
<h3>3.2 La compensation qui devient délétère</h3>
<p>Le rein perçoit une baisse du débit comme une hypovolémie. Il active le <button class="w" data-k="raas">système rénine-angiotensine-aldostérone (boucle de compensation)</button> et le système nerveux sympathique. À court terme, la vasoconstriction maintient la pression artérielle et la rétention hydrosodée augmente la précharge. À long terme, ces mêmes mécanismes deviennent toxiques. L’angiotensine II et l’aldostérone induisent une fibrose myocardique ; la noradrénaline augmente la consommation d’oxygène, favorise les arythmies et entraîne une apoptose des cardiomyocytes. Ce <button class="w" data-k="remodel">remodelage ventriculaire (dilatation, fibrose, sphéricisation)</button> aggrave la dysfonction initiale : c’est un cercle vicieux.</p>
<div class="key"><b>Corrélation physiologie → thérapeutique.</b> Les quatre classes fondamentales de l’ICFEr bloquent chacune un maillon de ce cercle vicieux. Les IEC ou l’ARNI agissent sur l’angiotensine II, les bêtabloquants sur la noradrénaline et les ARM sur l’aldostérone. Les iSGLT2 agissent par la natriurèse et par des effets métaboliques. L’ARNI potentialise aussi la réponse protectrice des <button class="w" data-k="np">peptides natriurétiques (BNP, NT-proBNP)</button>. Traiter l’insuffisance cardiaque chronique consiste d’abord à interrompre la compensation neurohormonale, et non à « stimuler » le cœur.</div>
<h3>3.3 Congestion et bas débit : deux mécanismes, deux tableaux</h3>
<p>La <b>congestion</b> résulte des pressions de remplissage élevées. À gauche, l’hypertension veineuse pulmonaire fait transsuder le liquide dans l’interstitium puis les alvéoles, selon l’<button class="w" data-k="starlingcap">équilibre de Starling capillaire (pressions hydrostatique et oncotique)</button> : c’est la dyspnée, l’orthopnée et les crépitants. À droite, l’hypertension veineuse systémique produit la turgescence jugulaire, l’hépatomégalie et les œdèmes. Le <b>bas débit</b> produit la fatigue, les extrémités froides, l’oligurie et la confusion. Le croisement de ces deux dimensions définit les <button class="w" data-k="stevenson">profils hémodynamiques de Stevenson (chaud/froid, humide/sec)</button>, qui guident le traitement de la décompensation.</p>
<h3>3.4 Spécificités de l’ICFEp</h3>
<p>L’ICFEp est une maladie systémique autant que cardiaque. Obésité, diabète, hypertension et insuffisance rénale entretiennent une inflammation de bas grade. Celle-ci altère la microcirculation coronaire et rigidifie les cardiomyocytes. L’<button class="w" data-k="chronotrop">incompétence chronotrope (fréquence cardiaque inadaptée à l’effort)</button>, la rigidité artérielle et la fibrillation auriculaire complètent le tableau. Ce caractère multifactoriel explique l’échec historique des traitements neurohormonaux isolés dans l’ICFEp, et le bénéfice des traitements à action systémique (iSGLT2, ARM, agonistes du GLP-1 chez l’obèse).</p>

<section class="ilot" id="i50-4"><h2><span class="n">4</span>Étiologies et facteurs déclenchants</h2>
<p>Le diagnostic d’insuffisance cardiaque n’est jamais complet sans sa cause. Certaines causes ont un traitement spécifique qui change le pronostic : revascularisation, remplacement valvulaire, tafamidis dans l’amylose, abstinence alcoolique.</p>
<div class="two">
<div class="card"><h4>Causes myocardiques</h4><p>Cardiopathie ischémique (première cause d’ICFEr en Europe) ; cardiomyopathies dilatée, hypertrophique, restrictive ; <button class="w" data-k="amylose">amylose cardiaque (ATTR et AL)</button> ; myocardite ; sarcoïdose ; hémochromatose ; maladie de Fabry ; cardiomyopathie de stress (Tako-tsubo) ; toxiques : alcool, anthracyclines, trastuzumab, inhibiteurs de points de contrôle immunitaire, cocaïne ; cardiomyopathie du péripartum.</p></div>
<div class="card"><h4>Surcharges de pression ou de volume</h4><p>Hypertension artérielle (première cause d’ICFEp) ; rétrécissement aortique ; insuffisances mitrale et aortique ; shunts.</p></div>
<div class="card"><h4>Rythme et conduction</h4><p>Fibrillation auriculaire rapide ; <button class="w" data-k="tachycm">cardiomyopathie rythmique (réversible après contrôle de fréquence)</button> ; bradycardies ; stimulation ventriculaire droite chronique.</p></div>
<div class="card"><h4>Débit élevé et causes extracardiaques</h4><p>Anémie sévère, thyrotoxicose, fistule artérioveineuse, carence en thiamine ; péricardite constrictive, qui mime l’insuffisance cardiaque droite.</p></div></div>
<h3>4.1 Traiter la cause quand elle est traitable</h3>
<ul><li><b>Ischémie</b> : revascularisation selon l’anatomie, la viabilité et les symptômes ; prévention secondaire.</li>
<li><b>Valvulopathie</b> : correction chirurgicale ou percutanée.</li>
<li><b>Myocardite</b> : IRM cardiaque ; biopsie endomyocardique si forme fulminante, arythmies ventriculaires ou échec du traitement, car certaines formes (à cellules géantes, sarcoïdose) relèvent d’un immunosuppresseur.</li>
<li><b>Cardiomyopathie alcoolique</b> : abstinence complète ; la FEVG peut remonter nettement.</li>
<li><b>Cardiomyopathie rythmique</b> : contrôle de la fréquence ou du rythme, puis réévaluation.</li>
<li><b>Amylose ATTR</b> : stabilisateur ou silenceur de la transthyrétine. <b>Hémochromatose</b> : saignées ou chélation.</li></ul>
<h3>4.2 Pourquoi maintenant ? Les facteurs de décompensation</h3>
<p>Toute décompensation impose la recherche d’un facteur déclenchant, car c’est souvent lui qu’il faut traiter en premier. L’ESC propose l’aide-mémoire <button class="w" data-k="champ">CHAMP (causes aiguës à éliminer d’emblée)</button> pour les causes menaçantes. Les causes les plus fréquentes restent cependant plus banales : écart de régime salé, non-observance, infection, fibrillation auriculaire, prise d’anti-inflammatoires non stéroïdiens.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Prescrire un anti-inflammatoire non stéroïdien ou une glitazone à un insuffisant cardiaque. Les AINS provoquent une rétention sodée et altèrent la fonction rénale ; ils sont une cause classique de décompensation. Les inhibiteurs calciques non dihydropyridiniques (vérapamil, diltiazem) sont contre-indiqués dans l’ICFEr.</div>
<button class="pareto-btn ui" data-k="pareto-etio">▲ Loi de Pareto — Étiologies et facteurs déclenchants</button>
</section>

<section class="ilot" id="i50-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse suit un ordre logique : terrain et antécédents, puis symptômes par ordre de fréquence, puis histoire de la maladie actuelle.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="atcd-coro">Cardiopathie ischémique (infarctus, stents, pontages)</button></li><li>Hypertension, diabète, obésité, dyslipidémie</li><li>Valvulopathie, souffle connu</li><li>Fibrillation auriculaire, palpitations</li></ul>
<ul><li><button class="w" data-k="atcd-cardiotox">Chimiothérapie ou radiothérapie thoracique (cardiotoxicité)</button></li><li>Alcool, cocaïne, amphétamines</li><li>Histoire familiale de cardiomyopathie ou de mort subite</li><li>Syndrome du canal carpien bilatéral, sténose lombaire (amylose ATTR)</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="s-dyspnee">Dyspnée d’effort (critères de caractérisation)</button></li><li>Fatigue, diminution de la tolérance à l’effort</li><li><button class="w" data-k="s-orthopnee">Orthopnée (nombre d’oreillers)</button></li><li><button class="w" data-k="s-dpn">Dyspnée paroxystique nocturne (réveil suffoquant)</button></li></ul>
<ul><li>Œdèmes des membres inférieurs, prise de poids rapide</li><li><button class="w" data-k="s-bendo">Bendopnée (dyspnée en se penchant)</button></li><li>Nycturie, toux nocturne</li><li>Anorexie, satiété précoce, douleur de l’hypochondre droit (congestion hépatique)</li></ul></div>
<p>La spécificité des symptômes est inégale. L’orthopnée et la dyspnée paroxystique nocturne sont plus spécifiques que la dyspnée d’effort, qui a d’innombrables causes. Une prise de poids de plus de 2 kg en trois jours fait suspecter une rétention hydrique, parfois avant les œdèmes. Elle déclenche un contact avec l’équipe soignante selon le plan écrit ; elle ne prouve pas seule une congestion.</p>
<h3>5.3 Histoires naturelles typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Homme de 68 ans, ancien infarctus antérieur. Dyspnée d’effort progressive sur deux mois, orthopnée à deux oreillers, œdèmes vespéraux. FEVG 30 %, NT-proBNP 2 400 pg/mL. ICFEr d’origine ischémique, NYHA III.</p></div>
<div class="card"><h4>Forme atypique</h4><p>Femme de 79 ans, hypertendue, obèse, en fibrillation auriculaire. Seule plainte : fatigue et « jambes lourdes ». FEVG 60 %, oreillette gauche dilatée, NT-proBNP 900 pg/mL. ICFEp méconnue, souvent attribuée à tort à l’âge.</p></div>
<div class="card"><h4>Forme trompeuse</h4><p>Homme de 81 ans, canal carpien bilatéral opéré, « hypertension qui se normalise », bas voltage ECG contrastant avec des parois épaisses. Tableau évocateur d’amylose ATTR.</p></div>
<div class="card"><h4>Forme digestive</h4><p>Insuffisance cardiaque droite dominante : nausées, satiété précoce, douleurs de l’hypochondre droit, ascite. Le patient est parfois exploré d’abord en gastroentérologie.</p></div></div>
</section>

<section class="ilot" id="i50-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général → signes vitaux complets → anthropométrie → signes ciblés. Il répond à trois questions : le patient est-il congestif, est-il hypoperfusé, et existe-t-il un indice de la cause ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Dyspnée au repos ou à la parole, cyanose, marbrures. <button class="w" data-k="v-ta">Pression artérielle (pronostic et tolérance du traitement)</button>, fréquence et régularité du pouls, fréquence respiratoire, saturation, température. Poids comparé au <button class="w" data-k="poidssec">poids sec (poids de référence sans congestion)</button>.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Congestion gauche</b><ul><li><button class="w" data-k="e-crepitants">Crépitants bilatéraux (technique et valeur)</button></li><li><button class="w" data-k="e-b3">Troisième bruit B3 (galop protodiastolique)</button></li><li>Épanchement pleural (matité des bases)</li><li>Choc de pointe dévié en bas et à gauche</li></ul></div>
<div><b>Congestion droite</b><ul><li><button class="w" data-k="e-jugulaire">Turgescence jugulaire et reflux hépato-jugulaire (mesure)</button></li><li>Hépatomégalie douloureuse, ascite</li><li>Œdèmes déclives, blancs, prenant le godet</li><li>Souffle d’insuffisance tricuspide</li></ul></div>
<div><b>Bas débit</b><ul><li>Extrémités froides, marbrures</li><li>Pincement de la pression différentielle</li><li>Oligurie, confusion</li><li><button class="w" data-k="e-alternant">Pouls alternant (dysfonction sévère)</button></li></ul></div>
<div><b>Indices étiologiques</b><ul><li>Souffle de rétrécissement aortique ou d’insuffisance mitrale</li><li>Arythmie complète</li><li>Signes d’hyperthyroïdie, d’anémie, d’alcoolisme</li><li>Macroglossie, ecchymoses périorbitaires (amylose AL)</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>L’absence de crépitants n’exclut pas une congestion. Chez l’insuffisant cardiaque chronique, le drainage lymphatique s’adapte et les poumons restent souvent secs malgré des pressions capillaires élevées. La turgescence jugulaire est le signe de congestion le plus fiable.</div>
<button class="pareto-btn ui" data-k="pareto-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>
