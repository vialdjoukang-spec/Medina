<template data-pop="g09-exp-9" data-title="Comprendre — 9. Explorations : choisir l’examen qui peut changer le plan"><p><b>Lecture expliquée.</b> Un examen répond à une question ; une imagerie ne mesure pas seule fatigue, audition et participation.</p><p>Les comparaisons avec les examens antérieurs comptent. Une recherche destinée à expliquer une aggravation est différente d’un contrôle de récupération stable. Les bilans ne doivent pas retarder l’urgence lorsqu’un état nouveau le requiert.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-FOLLOW — Sections 6.1–6.3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a>.</p></template>
<template data-pop="pareto-g09-9" data-title="Essentiel — 9. Explorations : choisir l’examen qui peut changer le plan"><p>Un examen répond à une question ; une imagerie ne mesure pas seule fatigue, audition et participation.</p><div class="key"><b>À retenir.</b> Revenir à la fonction, au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a>.</p></template>
<template data-pop="g09-exp-10" data-title="Comprendre — 10. Arbre diagnostique et diagnostics différentiels"><p><b>Lecture expliquée.</b> Différencier autre maladie, nouvelle activité et toxicité ; un anticorps isolé ne suffit pas après HSV.</p><p>Une faiblesse peut différer d’une spasticité ; une ataxie n’est pas toujours cérébelleuse ; un trouble de compréhension peut être auditif ou linguistique. Fatigue et baisse de performance peuvent être aggravées par sommeil, humeur ou traitement. Sous baclofène, confusion, somnolence ou myoclonies peuvent relever d’une encéphalopathie toxique, notamment en insuffisance rénale.</p><p>Après HSV, une nouvelle dégradation neuropsychiatrique ou motrice peut relever d’une encéphalite auto-immune. Dans la cohorte espagnole, des anticorps étaient aussi présents chez certains sans syndrome auto-immun : un résultat isolé ne suffit donc pas. L’équipe doit rechercher aussi une récidive infectieuse ou une autre cause, sans déclarer une séquelle fixe par défaut.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-pyramidal" target="_blank" rel="noopener">EU-CEN-PYRAMIDAL — Définition, symptômes et signes I–II</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/syndrome-cerebelleux" target="_blank" rel="noopener">EU-CEN-CEREBELLAR — Symptômes, signes, examens et différentiels I–IV</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p></template>
<template data-pop="pareto-g09-10" data-title="Essentiel — 10. Arbre diagnostique et diagnostics différentiels"><p>Différencier autre maladie, nouvelle activité et toxicité ; un anticorps isolé ne suffit pas après HSV.</p><div class="key"><b>À retenir.</b> Revenir à la fonction, au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p></template>
<template data-pop="g09-exp-11" data-title="Comprendre — 11. Prise en charge : objectifs fonctionnels et traitements conditionnels"><p><b>Lecture expliquée.</b> Définir des objectifs utiles ; réadaptation et traitement spécifique ou symptomatique sont complémentaires.</p><p><b>Rééducation et réadaptation.</b> Définir des objectifs concrets avec la personne : déplacements sûrs, communication, autonomie, gestion d’une tâche, reprise d’étude ou d’emploi. Mobiliser selon les besoins physiothérapie, ergothérapie, orthophonie/logopédie, neuropsychologie, soutien psychologique et aide sociale. Adapter l’intensité à la fatigue, aux capacités préservées et à la trajectoire ; une récupération lente ne signifie pas absence de possibilités.</p><p><b>Audition.</b> Organiser le bilan et la réhabilitation adaptés. Une surdité sévère ou profonde après méningite bactérienne appelle une évaluation spécialisée urgente pour implant selon NICE. Chez l’enfant, les enjeux de langage, développement et apprentissage justifient de ne pas attendre une difficulté scolaire majeure.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a>.</p></template>
<template data-pop="pareto-g09-11" data-title="Essentiel — 11. Prise en charge : objectifs fonctionnels et traitements conditionnels"><p>Définir des objectifs utiles ; réadaptation et traitement spécifique ou symptomatique sont complémentaires.</p><div class="key"><b>À retenir.</b> Revenir à la fonction, au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a>.</p></template>
<template data-pop="g09-exp-12" data-title="Comprendre — 12. Prévention, suivi et pronostic : garder le projet dans le temps"><p><b>Lecture expliquée.</b> Adapter le suivi à la cause et à l’âge ; retour progressif et prévention ne promettent pas une réparation complète.</p><p>Le suivi associe symptômes, fonctions et participation réelle. Après méningite bactérienne ou maladie méningococcique, NICE prévoit un contrôle médical/pédiatrique à quatre à six semaines après sortie, avec audition et autres besoins. Chez l’enfant, le suivi neurodéveloppemental et la vigilance aux transitions scolaires se prolongent ; ces délais ne deviennent pas un calendrier unique pour toutes les encéphalites et myélites.</p><p>Dans les suites d’anti-NMDAr, le PNDS de centre expert propose une coordination durable et des réévaluations cognitives et sociales. Les cohortes virales suisses rappellent que certaines plaintes persistent malgré l’amélioration. Aucun délai de récupération ni retour complet au travail ne peut être promis à partir d’une seule étude ou d’un examen bref.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-FOLLOW — Sections 6.1–6.3</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-LIMIT — Discussion, limites et conclusion</a> ; <a data-reference-source="1" href="https://www.epi.ch/wp-content/uploads/2026/01/Fahreignung-mit-Epilepsie-Flyer-F.pdf" target="_blank" rel="noopener">CH-EPI — Introduction, contexte et actualisation</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/fr/meningo-encephalite-a-tiques-fsme" target="_blank" rel="noopener">CH-OFSP-PREV — Prévention et vaccination</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener">CH-OFSP-IMMUNITY — Section 2.5, immunité après infection</a>.</p></template>
<template data-pop="pareto-g09-12" data-title="Essentiel — 12. Prévention, suivi et pronostic : garder le projet dans le temps"><p>Adapter le suivi à la cause et à l’âge ; retour progressif et prévention ne promettent pas une réparation complète.</p><div class="key"><b>À retenir.</b> Revenir à la fonction, au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a>.</p></template>
<template data-pop="g09-exp-13" data-title="Comprendre — 13. Points clés : une conclusion qui guide la suite"><p><b>Lecture expliquée.</b> Conclure avec trajectoire, fonctions, retentissement et plan, sans confondre code et maladie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-OUTCOME — Résumé, résultats et conclusion</a> ; <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a>.</p></template>
<template data-pop="pareto-g09-13" data-title="Essentiel — 13. Points clés : une conclusion qui guide la suite"><p>Conclure avec trajectoire, fonctions, retentissement et plan, sans confondre code et maladie.</p><div class="key"><b>À retenir.</b> Revenir à la fonction, au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a>.</p></template>
<template data-pop="g09-exp-14" data-title="Comprendre — 14. Pièges : ne pas refermer trop tôt le raisonnement"><p><b>Lecture expliquée.</b> Ni un score, ni une date de fichier, ni un médicament ancien ne ferment le diagnostic.</p><p>Appeler séquelle toute plainte après une infection, attendre obligatoirement un an pour la reconnaître, ou classer toute suite virale en G09 sont trois erreurs différentes. Une amélioration globale peut masquer un déficit subtil ; une nouvelle aggravation peut relever d’une activité traitable ou d’une toxicité.</p><p>Les autres raccourcis sont de conclure au trouble cognitif sans vérifier audition et langage, de réduire tout échec de marche à une faiblesse, de traiter toute raideur avec une dose adulte standard ou de prolonger un antiépileptique sans révision de l’indication. Les FI précises et les populations limitent chaque produit.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.epi.ch/wp-content/uploads/2026/01/Fahreignung-mit-Epilepsie-Flyer-F.pdf" target="_blank" rel="noopener">CH-EPI — Introduction, contexte et actualisation</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11288970/" target="_blank" rel="noopener">CH-BERN-LIMIT — Discussion, limites et conclusion</a>.</p></template>
<template data-pop="pareto-g09-14" data-title="Essentiel — 14. Pièges : ne pas refermer trop tôt le raisonnement"><p>Ni un score, ni une date de fichier, ni un médicament ancien ne ferment le diagnostic.</p><div class="key"><b>À retenir.</b> Revenir à la fonction, au mécanisme et au niveau de preuve avant de décider.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.epi.ch/wp-content/uploads/2026/01/Fahreignung-mit-Epilepsie-Flyer-F.pdf" target="_blank" rel="noopener">CH-EPI — Introduction, contexte et actualisation</a>.</p></template>
<template data-pop="g09-cas-1" data-title="Cas 1 — Le retour au travail révèle une difficulté"><p><b>Exercice fictif original.</b></p><p>Après une méningite bactérienne, une personne marche normalement mais ne peut plus soutenir une tâche complexe aussi longtemps qu’avant. Interroger fatigue, sommeil, audition et domaines cognitifs ; comparer au niveau antérieur et choisir les évaluations utiles.</p><p>Un examen moteur normal ne suffit pas à promettre une reprise complète. Fixer des objectifs et une progression avec adaptations, sans attribuer chaque difficulté à une cause unique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.cen-neurologie.fr/premier-cycle/semiologie-analytique/semiologie-des-fonctions-cognitives" target="_blank" rel="noopener">EU-CEN-COGNITION — Définitions, langage, fonctions instrumentales, attention/exécutif et mémoire</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a> ; <a data-reference-source="1" href="https://www.has-sante.fr/upload/docs/application/pdf/2022-01/pnds_nmdar.pdf" target="_blank" rel="noopener">EU-PNDS-REHAB — Sections 2.1–2.2 et 5.6</a>.</p></template>
<template data-pop="g09-cas-2" data-title="Cas 2 — Un enfant entend moins après méningite"><p><b>Exercice fictif original.</b></p><p>Un enfant a une difficulté auditive après méningite bactérienne. Organiser une évaluation formelle dès qu’il est apte au test, dans les quatre semaines et de préférence avant la sortie selon NICE. Une surdité sévère ou profonde appelle une évaluation urgente d’implant.</p><p>Le contrôle médical quatre à six semaines après sortie utilise une autre horloge. Le suivi du développement et des apprentissages reste nécessaire, même si le premier bilan n’identifie pas toutes les difficultés futures.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a>.</p></template>
<template data-pop="g09-cas-3" data-title="Cas 3 — Nouvelle aggravation après HSV"><p><b>Exercice fictif original.</b></p><p>Après une amélioration, une personne présente de nouveaux troubles comportementaux ou moteurs après encéphalite herpétique. Ne pas conclure à une séquelle fixe sans réévaluation : activité immune, infection, complication et autres causes doivent être discutées.</p><p>La cohorte espagnole montre une encéphalite auto-immune possible, mais aussi des anticorps sans syndrome clinique. Le code G09 n’est pas automatique après HSV ; la nomenclature distingue les séquelles d’encéphalite virale.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6128696/" target="_blank" rel="noopener">EU-HSV-AIE — Résumé : méthodes, résultats et interprétation</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — Classe G09 et note, XML français</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — B94.1, B90.0, B00.4†, G05.1* et A84.1</a>.</p></template>
<template data-pop="g09-cas-4" data-title="Cas 4 — Confusion sous baclofène et fonction rénale altérée"><p><b>Exercice fictif original.</b></p><p>Une personne traitée par baclofène devient somnolente, confuse et présente des myoclonies après une modification de situation rénale ou de dose. Une encéphalopathie toxique doit être envisagée et évaluée en urgence selon la situation.</p><p>La FI demande l’arrêt en cas de signes d’encéphalopathie, avec prise en charge médicale adaptée. Cette conduite ne doit pas être confondue avec un arrêt planifié habituel, progressif, après utilisation prolongée. Une baisse de vigilance n’est pas automatiquement une séquelle cognitive.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680360830184" target="_blank" rel="noopener">FI-LIORESAL — Indications, posologie, organes, précautions, interactions et reproduction</a>.</p></template>
<template data-pop="g09-calcul-dose" data-title="Calcul pédagogique : dose prescrite et volume oral"><p><b>Exemple fictif, sans prescription.</b> Si la dose orale déjà prescrite est de 500 mg et la solution identifiée contient 100 mg/mL, le volume par prise est 500 ÷ 100 = 5 mL. Deux prises identiques font 10 mL sur la journée. Le mg s’annule ; le résultat du premier calcul est un volume par prise.</p><p>Ce calcul ne choisit ni indication, ni dose, ni adaptation rénale. Vérifier produit, concentration, dispositif de mesure et ordonnance. La barre du comprimé Keppra facilite la déglutition sans garantir deux doses égales : elle ne remplace pas la bonne formulation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680552970049" target="_blank" rel="noopener">FI-KEPPRA — Indications, posologie orale/rénale, précautions, interactions, reproduction et mécanisme</a>.</p></template>
<template data-pop="g09-calcul-delais" data-title="Calcul pédagogique : deux horloges de suivi"><p><b>Exemple fictif.</b> Le jour 0 sert seulement de repère. Si une personne après méningite bactérienne est apte au test auditif au jour 7, quatre semaines correspondent à 28 jours : la borne de cette recommandation se situe au jour 35. NICE préfère cependant le test avant la sortie lorsqu’il est réalisable ; ce calcul n’invite pas à attendre.</p><p>Si la sortie a lieu au jour 14, le contrôle médical quatre à six semaines après sortie se situe entre les jours 42 et 56. Les deux horloges ont des points de départ différents. Une surdité sévère/profonde ou une nouvelle aggravation nécessite une conduite anticipée, sans attendre ces dates.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-COMPLICATIONS — Sections 1.12.1–1.12.13</a> ; <a data-reference-source="1" href="https://www.nice.org.uk/guidance/ng240/chapter/recommendations" target="_blank" rel="noopener">EU-NICE-FOLLOW — Sections 1.13.1–1.13.11</a>.</p></template>
