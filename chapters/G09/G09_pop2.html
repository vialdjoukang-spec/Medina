<template data-pop="g09-audiologie" data-title="Audiologie formelle : tests, calendrier, prévalence">
<div class="lab">Recommandation</div><p>Audiologie formelle avant la sortie, sinon dans les 4 semaines ; second test si le premier est normal, car une perte tardive reste possible (recommandation forte, certitude très faible).</p>
<div class="lab">Prévalence selon le moment</div><p>30,4 % à l’hôpital ou à la sortie ; 22,9 % avant un mois ; 20,3 % entre 30 et 60 jours ; 22,7 % entre 60 et 180 jours ; 10,8 % au-delà de 180 jours. La perte peut apparaître et régresser à différents moments.</p>
<div class="lab">Enfant</div><p>Audiométrie comportementale adaptée à l’âge pendant deux ans, confirmée par potentiels évoqués auditifs du tronc cérébral.</p>
<div class="lab">Limite</div><p>Les valeurs normales (seuils en décibels, population de référence) et les techniques d’audiométrie ne figurent pas dans le dossier. Étude lue au résumé.</p>
<p class="src">Références : <a href="https://iris.who.int/handle/10665/379727" target="_blank" rel="noopener">OMS, 2025</a> ; <a href="https://doi.org/10.1186/s12916-026-04698-y" target="_blank" rel="noopener">Alviz et al., BMC Medicine, 2026 (PMID 41761238)</a> ; <a href="https://doi.org/10.1016/j.anorl.2013.04.006" target="_blank" rel="noopener">Eur Ann Otorhinolaryngol, 2014</a>.</p></template>
<template data-pop="g09-pea-irm" data-title="Potentiels évoqués auditifs du tronc cérébral et IRM">
<div class="lab">Définition</div><p>Les potentiels évoqués auditifs du tronc cérébral (PEA) enregistrent la réponse électrique de la voie auditive à un son ; ils confirment une surdité chez l’enfant après un dépistage comportemental.</p>
<div class="lab">IRM</div><p>En cas de surdité bilatérale sévère ou profonde, l’IRM est urgente : elle montre l’inflammation endolymphatique (séquence pondérée T2) avant l’ossification. Le scanner est moins sensible.</p>
<div class="lab">Limite</div><p>Série pédiatrique de 5 patients : IRM positive chez 4, scanner chez 1. Le protocole d’IRM n’a pas été lu en détail.</p>
<p class="src">Référence : <a href="https://doi.org/10.1016/j.anorl.2013.04.006" target="_blank" rel="noopener">Surdité post-méningitique bilatérale rapidement progressive de l’enfant, Eur Ann Otorhinolaryngol Head Neck Dis, 2014 (PMID 24559741)</a>.</p></template>
<template data-pop="g09-neuropsy" data-title="Évaluation neuropsychologique et questionnaires">
<div class="lab">Outils lus</div><p>Batteries neuropsychologiques standardisées et questionnaires de plainte cognitive et de qualité de vie (RAND-36, CLCE-24) dans la cohorte néerlandaise ; ACE-III et Trail Making Test A et B proposés après méningite tuberculeuse.</p>
<div class="lab">Application</div><p>Les plaintes de lenteur, d’attention ou de mémoire justifient une évaluation même si le patient est autonome. Les domaines les plus touchés après méningite tuberculeuse sont les fonctions exécutives et la mémoire verbale.</p>
<div class="lab">Limite</div><p>Les valeurs normales et les seuils pathologiques de ces tests ne figurent pas dans le dossier. Preuve faible pour la méningite tuberculeuse.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.cmi.2020.01.020" target="_blank" rel="noopener">Kloek et al., 2020</a> ; <a href="https://doi.org/10.1016/j.ijtb.2025.06.003" target="_blank" rel="noopener">Ashwin et al., 2025</a>.</p></template>
<template data-pop="g09-anticorps" data-title="Anticorps neuronaux après encéphalite à HSV">
<div class="lab">Indication</div><p>Rechute clinique après encéphalite à HSV. Les anticorps recherchés sont surtout dirigés contre le récepteur NMDA.</p>
<div class="lab">Interprétation</div><p>Des anticorps absents au début puis apparus confirment une encéphalite auto-immune ; leur détection dans les trois semaines est associée à un risque multiplié par 11,5.</p>
<div class="lab">Limite</div><p>Techniques, milieu de dosage et seuils : non lus.</p>
<p class="src">Référence : <a href="https://doi.org/10.1016/S1474-4422(18)30244-8" target="_blank" rel="noopener">Armangue et al., Lancet Neurol, 2018</a>.</p></template>
<template data-pop="g09-nmda" data-title="Récepteur NMDA et anticorps anti-NMDAR">
<div class="lab">Définition</div><p>NMDA désigne le N-méthyl-D-aspartate, qui donne son nom à un récepteur neuronal ; NMDAR est le récepteur. Dans la cohorte espagnole, les anticorps anti-NMDAR dominent l’encéphalite auto-immune post-herpétique.</p>
<div class="lab">Lacune</div><p>La structure et la fonction du récepteur ne sont pas décrites dans les sources lues.</p>
<p class="src">Référence : <a href="https://doi.org/10.1016/S1474-4422(18)30244-8" target="_blank" rel="noopener">Armangue et al., Lancet Neurol, 2018</a>.</p></template>
<template data-pop="g09-sv2a" data-title="Protéine 2A de la vésicule synaptique (SV2A)">
<div class="lab">Définition</div><p>SV2A est la protéine 2A de la vésicule synaptique, cible du lévétiracétam.</p>
<div class="lab">Lacune</div><p>La fonction de SV2A dans la libération des neurotransmetteurs n’est pas décrite dans la source lue.</p>
<p class="src">Référence : information professionnelle suisse du lévétiracétam (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">AmiKo, consultée le 15.10.2026</a>).</p></template>
<template data-pop="g09-levetiracetam" data-title="Lévétiracétam : monographie (information professionnelle suisse)">
<div class="lab">Mécanisme</div><p>Liaison à la protéine 2A de la vésicule synaptique ; demi-vie 7,2 heures chez l’adulte, 10–11 heures chez le sujet âgé ; pas de suivi des taux ; pas d’interaction pharmacocinétique avec les antiépileptiques usuels ni les contraceptifs oraux.</p>
<div class="lab">Indications</div><p>Monothérapie des crises focales avec ou sans généralisation secondaire dès 16 ans ; association dès 4 ans pour les crises focales ; myoclonies de l’épilepsie myoclonique juvénile et crises tonico-cloniques généralisées primaires dès 12 ans.</p>
<div class="lab">Posologie</div><p>Adulte et adolescent de plus de 40 kg : 500 mg deux fois par jour dès le premier jour, jusqu’à 1500 mg deux fois par jour, par paliers de 250 à 500 mg toutes les 2 à 4 semaines. Insuffisance rénale (clairance en mL/min/1,73 m²) : 50–79, 500 à 1000 mg deux fois par jour ; 30–49, 250 à 750 mg ; inférieure à 30, 250 à 500 mg. Insuffisance hépatique sévère avec clairance inférieure à 60 : dose d’entretien réduite de moitié. Arrêt progressif.</p>
<div class="lab">Effets indésirables et mises en garde</div><p>Suicidalité ; troubles psychiatriques et comportementaux (agressivité, dépression, psychose) ; aggravation paradoxale des crises ; encéphalopathie réversible.</p>
<div class="lab">Limite</div><p>Spécialité générique Sandoz ; date de mise à jour de l’information non affichée ; essais cliniques non détaillés dans le dossier. L’usage dans les crises post-méningitiques s’appuie sur la recommandation de l’OMS sur la durée, sans essai propre à cette indication.</p>
<p class="src">Référence : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Lévétiracétam Sandoz, comprimés pelliculés et solution buvable (AmiKo, GTIN 7680620880010), consultée le 15.10.2026</a>.</p></template>
<template data-pop="g09-cortico" data-title="Corticoïdes dans la méningite bactérienne : effet sur les séquelles">
<div class="lab">Preuves</div><p>Méta-analyse citée par l’OMS : décès, risque relatif 0,80 ; séquelles neurologiques à court terme 0,77 ; perte auditive 0,66 (certitude élevée) ; épilepsie post-méningitique 0,55. Perte auditive : 0,68 chez l’adulte, 0,71 chez l’enfant. Suivi médian de 99 mois de l’étude européenne : pas d’augmentation des troubles cognitifs.</p>
<div class="lab">Interprétation</div><p>Un risque relatif de 0,66 signifie que le risque de perte auditive sous corticoïde est de 66 % du risque sans corticoïde, soit une réduction relative de 34 %.</p>
<div class="lab">Limite</div><p>Doses et durée non rapportées dans le dossier ; méningite tuberculeuse : effet sur la mortalité seulement.</p>
<p class="src">Références : <a href="https://iris.who.int/handle/10665/379727" target="_blank" rel="noopener">OMS, 2025</a> ; <a href="https://doi.org/10.1002/ana.20944" target="_blank" rel="noopener">Weisfelt et al., 2006</a> ; <a href="https://doi.org/10.5588/ijtld.25.0588" target="_blank" rel="noopener">Nasiri et al., 2026</a>.</p></template>
<template data-pop="g09-vaccin-fsme" data-title="Vaccination contre la FSME : schéma suisse et contentieux sur les rappels">
<div class="lab">Recommandation fédérale</div><p>Vaccination des personnes exposées aux tiques dans les zones à risque, en général dès 3 ans ; toute la Suisse sauf le Tessin. Trois doses : les deux premières à un mois, la troisième 5 à 12 mois après la deuxième selon le vaccin. Rappel tous les 10 ans si l’exposition persiste (état juillet 2024).</p>
<div class="lab">Arbitrage</div><p>L’information professionnelle de FSME-Immun CC prévoit un rythme plus serré (3 ans, puis 3 à 5 ans). La règle du projet donne priorité à la source primaire applicable la plus récente et accès au texte en vigueur ; ici, la recommandation officielle suisse prime pour la pratique et la fiche renvoie elle-même au plan de vaccination suisse.</p>
<div class="lab">Limite</div><p>Page de l’Office fédéral lue sans date propre ; état des recommandations juillet 2024 ; le plan de vaccination n’a pas été relu en entier.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/de/fruehsommer-meningoenzephalitis-fsme" target="_blank" rel="noopener">Office fédéral de la santé publique, FSME</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">FSME-Immun CC (AmiKo, GTIN 7680004500039)</a>.</p></template>
<template data-pop="g09-fi-fsme" data-title="FSME-Immun CC : ce que dit l’information professionnelle">
<div class="lab">Contenu</div><p>Immunisation active dès 16 ans révolus ; schéma rapide avec deuxième dose dès 14 jours si le début est en saison chaude ; premier rappel au plus tard 3 ans après la troisième dose, puis intervalles de 3 à 5 ans, 3 ans au-delà de 50 ans ; contrôle sérologique environ 4 semaines après la deuxième dose chez les plus de 60 ans et les immunodéprimés.</p>
<div class="lab">Divergence</div><p>La recommandation fédérale fixe un rappel tous les 10 ans. Le médecin suit la recommandation fédérale et note la divergence dans le dossier.</p>
<p class="src">Référence : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">FSME-Immun CC (AmiKo, GTIN 7680004500039), consultée le 15.10.2026</a>.</p></template>
<template data-pop="pareto-g09-definition" data-title="Pareto — Définition, épidémiologie, mécanismes">
<p class="ratio" data-cover="g09-0,g09-1,g09-2,g09-3"></p><ul><li>G09 : trouble résiduel d’une affection G00–G08, séquelle déclarée ou délai d’au moins un an.</li><li>Une personne sur cinq garde une séquelle après méningite bactérienne ; 56 % de plaintes à Berne.</li><li>Trois mécanismes documentés : atteinte de l’audition, hydrocéphalie, encéphalite auto-immune post-HSV.</li></ul></template>
<template data-pop="pareto-g09-clinique" data-title="Pareto — Causes, anamnèse et examen">
<p class="ratio" data-cover="g09-4,g09-5,g09-6"></p><ul><li>Le pneumocoque expose davantage ; la gravité aiguë ne prédit pas les plaintes tardives.</li><li>Chercher activement audition, cognition, crises, humeur, hydrocéphalie, fatigue.</li><li>Un examen neurologique normal n’exclut ni surdité ni trouble cognitif.</li></ul></template>
<template data-pop="pareto-g09-prise" data-title="Pareto — Diagnostic, urgences, prise en charge">
<p class="ratio" data-cover="g09-7,g09-8,g09-9"></p><ul><li>Exclure d’abord une complication active, notamment l’encéphalite auto-immune après HSV.</li><li>Urgences : surdité bilatérale sévère, rechute précoce après HSV, effets psychiatriques sous antiépileptique.</li><li>Évaluer avant la sortie et dans les 4 semaines ; réhabiliter dès que possible ; antiépileptique 3 mois au plus.</li></ul></template>
<template data-pop="pareto-g09-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g09-10,g09-11"></p><ul><li>Deux ans de dépistage auditif chez l’enfant ; suivis à 2, 6 et 12 mois après HSV.</li><li>Lévétiracétam : adapter à la clairance et à l’âge.</li><li>Méningite tuberculeuse : séquelles B90.0, hors G09.</li></ul></template>
<template data-pop="pareto-g09-criteres" data-title="Pareto — Critères et paramètres">
<p class="ratio" data-cover="g09-12"></p><ul><li>Cinq critères formels de G09, dont l’exclusion de B90.0, B91 et B94.1.</li><li>Corticoïdes : perte auditive, risque relatif 0,66.</li><li>Vaccin FSME : dès 3 ans, rappel tous les 10 ans (Office fédéral).</li></ul></template>
<template data-pop="pareto-g09-examens-1" data-title="Pareto — Hiérarchie et audiologie">
<p class="ratio" data-cover="g09-e-1,g09-e-2"></p><ul><li>Un examen par séquelle suspectée ; l’audiologie est systématique.</li><li>Second test si le premier est normal.</li><li>Prévalence plus haute à la sortie (30,4 %) qu’après 6 mois (10,8 %).</li></ul></template>
<template data-pop="pareto-g09-examens-2" data-title="Pareto — Enfant, cognition, anticorps">
<p class="ratio" data-cover="g09-e-3,g09-e-4,g09-e-5,g09-e-6"></p><ul><li>Enfant : audiométrie comportementale 2 ans, PEA, IRM urgente si surdité bilatérale sévère.</li><li>Lenteur cognitive possible malgré une bonne récupération globale.</li><li>Anticorps neuronaux en cas de rechute après HSV.</li></ul></template>
<template data-pop="pareto-g09-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g09-s-anat-cours"></p><ul><li>Transmission : transitoire. Cochlée, labyrinthe, nerf : permanente.</li><li>Ossification cochléaire : électrodes impossibles.</li></ul></template>
<template data-pop="pareto-g09-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g09-s-physio-cours"></p><ul><li>La surdité dégrade la parole ; réhabilitation précoce.</li><li>Séquelles détectées en partie après la sortie.</li></ul></template>
<template data-pop="pareto-g09-immuno" data-title="Pareto — Immunologie">
<p class="ratio" data-cover="g09-s-immuno-cours"></p><ul><li>27 % d’encéphalite auto-immune après HSV, anticorps anti-NMDAR dominants.</li><li>Enfant de 4 ans ou moins : choréo-athétose, baisse de vigilance.</li></ul></template>
<template data-pop="pareto-g09-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g09-s-bioch-cours"></p><ul><li>Lévétiracétam : cible SV2A.</li><li>Demi-vie plus longue chez le sujet âgé.</li></ul></template>
<template data-pop="pareto-g09-pharma-1" data-title="Pareto — Stratégie et corticoïdes">
<p class="ratio" data-cover="g09-p-1,g09-p-2"></p><ul><li>Trois leviers : corticoïdes, antiépileptique, vaccin.</li><li>Corticoïdes : perte auditive 0,66, épilepsie 0,55.</li></ul></template>
<template data-pop="pareto-g09-pharma-2" data-title="Pareto — Lévétiracétam">
<p class="ratio" data-cover="g09-p-3"></p><ul><li>500 mg deux fois par jour au départ, jusqu’à 1500 mg deux fois par jour.</li><li>Adapter à la clairance ; arrêt progressif ; surveiller l’humeur.</li></ul></template>
<template data-pop="pareto-g09-pharma-3" data-title="Pareto — Vaccin et limites">
<p class="ratio" data-cover="g09-p-4,g09-p-5"></p><ul><li>Rappel tous les 10 ans (Office fédéral) contre 3 à 5 ans (fiche) : la recommandation suisse prime.</li><li>Aucun médicament lu pour la fatigue ou la cognition.</li></ul></template>
