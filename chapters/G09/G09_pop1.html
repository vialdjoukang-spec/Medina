<template data-pop="g09-snc" data-title="Système nerveux central">
<div class="lab">Définition</div><p>SNC désigne le système nerveux central, c’est-à-dire l’encéphale et la moelle épinière. Dans la classification, G09 concerne les séquelles des inflammations de cet ensemble (méninges, encéphale, moelle).</p>
<p class="src">Référence : <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=G09" target="_blank" rel="noopener">CIM-10 OMS 2019, G09 (consultée le 15.10.2026)</a>.</p></template>
<template data-pop="g09-oms" data-title="Lignes directrices de l’OMS sur la méningite (2025)">
<div class="lab">Contenu</div><p>L’Organisation mondiale de la santé a publié en 2025 des lignes directrices sur le diagnostic, le traitement et la prise en charge de la méningite, dont le texte intégral a été lu pour ce cours. Elles contiennent un volet sur les séquelles : catalogue, dépistage, réhabilitation, durée des antiépileptiques, corticoïdes.</p>
<div class="lab">Niveau de preuve</div><p>Les recommandations sur l’évaluation avant la sortie, la réhabilitation et l’audition sont fortes, mais leur certitude est très faible. La recommandation sur la durée des antiépileptiques est conditionnelle, avec une certitude très faible. Seul l’effet des corticoïdes sur la perte auditive est de certitude élevée.</p>
<div class="lab">Limite</div><p>Ces lignes directrices s’adressent à tous les contextes de soins du monde ; elles ne sont pas une recommandation suisse. Aucun texte suisse équivalent n’a été trouvé.</p>
<p class="src">Référence : <a href="https://iris.who.int/handle/10665/379727" target="_blank" rel="noopener">OMS, WHO guidelines on meningitis diagnosis, treatment and care, 2025 (ISBN 978-92-4-010804-2)</a>.</p></template>
<template data-pop="g09-cim" data-title="Classification CIM-10-GM 2024 : ce qui a été lu">
<div class="lab">Définition</div><p>La CIM-10-GM est la version allemande de la classification internationale des maladies, adoptée par la Suisse. Pour G09, le texte du bloc G00–G09 de l’Institut fédéral allemand des médicaments a été lu (version allemande, résumée par l’outil de lecture) ; le libellé français vient du registre de l’Office fédéral de la statistique.</p>
<div class="lab">Limite</div><p>Le PDF français n’a pas été relu. La note de codage de G09 est donc reprise à travers la version allemande et la version OMS 2019, concordantes.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">Office fédéral de la statistique, classification 2024</a>.</p></template>
<template data-pop="g09-codage" data-title="Règles de codage de G09">
<div class="lab">Définition</div><p>G09 s’emploie lorsque l’affection causale relève primairement de G00 à G08. Les catégories astérisque G01*, G02*, G05* et G07* sont exclues. Une séquelle est une affection désignée comme telle ou comme effet tardif, ou présente un an ou plus après le début de l’affection causale.</p>
<div class="lab">Application</div><p>Le trouble actuel (par exemple une surdité ou une épilepsie) se code selon sa nature ; la catégorie G09 indique que sa cause est une affection inflammatoire du SNC passée. Le patient de la vignette, dix-huit mois après une méningite à pneumocoque, répond au critère de délai.</p>
<div class="lab">Exclusion</div><p>Une maladie inflammatoire chronique du SNC toujours active se code comme affection actuelle, non comme séquelle.</p>
<div class="lab">Limite</div><p>Les règles de morbidité et de mortalité du volume 2 ne sont pas détaillées dans le dossier. Le codage de la méningo-encéphalite à tiques dans la CIM-10-GM 2024 n’a pas été relu.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, G09</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=G09" target="_blank" rel="noopener">OMS, CIM-10 2019, G09</a>.</p></template>
<template data-pop="g09-voisins" data-title="Codes voisins : B90.0, B91, B94.1">
<div class="lab">Définition</div><p>Les séquelles de tuberculose du SNC se codent B90.0 ; celles de poliomyélite B91 (le syndrome post-poliomyélite est G14) ; celles d’encéphalite virale B94.1.</p>
<div class="lab">Déduction pédagogique</div><p>La règle laisse penser que les séquelles d’une encéphalite à tiques, classée parmi les maladies infectieuses, se codent B94.1 et non G09. Cette conclusion est une déduction de la règle, présentée comme telle.</p>
<div class="lab">Limite</div><p>Le codage de la méningo-encéphalite à tiques (A84) et la note de B94.1 dans la version 2024 n’ont pas été relus ; la vérification dans le catalogue s’impose avant de coder.</p>
<p class="src">Référence : <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=B90-B94" target="_blank" rel="noopener">CIM-10 OMS 2019, B90–B94 (consultée le 15.10.2026)</a>.</p></template>
<template data-pop="g09-catalogue" data-title="Catalogue OMS des séquelles de la méningite">
<div class="lab">Contenu</div><p>Séquelles majeures : perte auditive ; déficits neurologiques focaux ; atteinte neuropsychologique (troubles cognitifs chez l’adulte, déficience intellectuelle ou troubles du comportement chez l’enfant) ; hydrocéphalie ; crises récurrentes et épilepsie ; amputation de membre ou de doigts et cicatrices cutanées ; effets tardifs moins visibles (difficultés sociales et émotionnelles, baisse de la qualité de vie).</p>
<div class="lab">Classement pédagogique</div><p>Pour apprendre, ces séquelles se regroupent en sensorielles (audition, vision), motrices focales, cognitives et comportementales, épileptiques, hydrocéphalie, fatigue et sommeil, psychosociales, cutanées et orthopédiques (purpura fulminans). Ce regroupement est une construction de l’auteur du cours, non une classification officielle.</p>
<p class="src">Référence : <a href="https://iris.who.int/handle/10665/379727" target="_blank" rel="noopener">OMS, lignes directrices sur la méningite, 2025</a>.</p></template>
<template data-pop="g09-moment" data-title="Prévalence des séquelles selon le moment de l’évaluation">
<div class="lab">Données</div><p>Revue systématique de 89 études. Adulte : 24,8 % à la sortie, 41,5 % dans les 3 mois, 31,9 % au-delà de 3 mois. Enfant : 28,9 %, 29,9 % et 38,2 %.</p>
<div class="lab">Lecture</div><p>Les séquelles se révèlent pour partie après la sortie : une évaluation unique à la sortie sous-estime donc la charge de séquelles, ce qui justifie une évaluation au suivi. Chez l’adulte, les séquelles les plus rapportées sont, par ordre de fréquence, la perte auditive, les déficits focaux, le retentissement psychologique, les troubles neurocognitifs, les crises, l’hydrocéphalie, les troubles de la parole, l’atteinte visuelle et la perte de membre.</p>
<div class="lab">Limite</div><p>Le texte intégral n’a pas été lu en détail (résumé de l’article) ; les prévalences sont poolées sur des études hétérogènes.</p>
<p class="src">Référence : <a href="https://doi.org/10.1186/s12916-026-04627-z" target="_blank" rel="noopener">Alviz et al., BMC Medicine, 2026 (PMID 41761295)</a>.</p></template>
<template data-pop="g09-epid-enfant" data-title="Méta-analyse pédiatrique des séquelles">
<div class="lab">Données</div><p>Treize études, suivi de 6 mois à 35 ans après une méningite bactérienne de l’enfance : complications globales 37,3 % ; troubles cognitifs 21,6 % ; troubles émotionnels et comportementaux 15,3 % ; perte auditive 14,3 %.</p>
<div class="lab">Limite</div><p>Article lu au résumé. L’étendue du suivi (6 mois à 35 ans) rend les taux hétérogènes ; ils ne se transposent pas à un enfant précis sans tenir compte du germe et de l’âge.</p>
<p class="src">Référence : <a href="https://doi.org/10.1111/jpc.70469" target="_blank" rel="noopener">Araújo et al., J Paediatr Child Health, 2026 (PMID 42267426)</a>.</p></template>
<template data-pop="g09-epid-adulte" data-title="Cohortes néerlandaises de méningite bactérienne de l’adulte">
<div class="lab">Cohorte nationale</div><p>Méningite pneumococcique, évaluation à 1–5 ans (médiane 2 ans) : 34 % de séquelles neurologiques persistantes, perte auditive 27 %, trouble cognitif objectif 14 % ; plaintes subjectives de lenteur (71 %), d’attention (60 %) et de mémoire (61 %) ; qualité de vie inférieure aux témoins.</p>
<div class="lab">Bonne récupération apparente</div><p>Malgré un score 5 à l’échelle de devenir de Glasgow, 27 % des survivants d’une méningite pneumococcique ont un trouble cognitif, surtout de la lenteur ; la différence n’est pas significative après méningocoque.</p>
<div class="lab">Suivi de l’étude de dexaméthasone</div><p>Suivi médian de 99 mois : dysfonction cognitive 21 % après pneumocoque contre 6 % après méningocoque (p = 0,05).</p>
<div class="lab">Limite</div><p>Études de population néerlandaise, lues au résumé ; elles ne portent pas sur des patients suisses.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.cmi.2020.01.020" target="_blank" rel="noopener">Kloek et al., Clin Microbiol Infect, 2020</a> ; <a href="https://doi.org/10.1086/344229" target="_blank" rel="noopener">van de Beek et al., J Infect Dis, 2002</a> ; <a href="https://doi.org/10.1002/ana.20944" target="_blank" rel="noopener">Weisfelt et al., Ann Neurol, 2006</a>.</p></template>
<template data-pop="g09-hydro" data-title="Hydrocéphalie après méningite bactérienne de l’adulte">
<div class="lab">Données</div><p>Cohorte néerlandaise : 26 cas sur 577 méningites bactériennes communautaires de l’adulte (5 %). L’hydrocéphalie est communicante dans presque tous les cas. Mortalité 50 % ; devenir défavorable 69 % ; facteur indépendant de décès (odds ratio 7,81) ; hydrocéphalie présente dès l’admission chez 69 % des cas.</p>
<div class="lab">Conséquence</div><p>L’hydrocéphalie est une séquelle grave, à rechercher devant une aggravation ; son pronostic est mauvais dans cette série.</p>
<div class="lab">Lacune</div><p>La physiopathologie de la résorption du liquide, la modalité d’imagerie, le calendrier de surveillance et la prise en charge (dérivation) n’ont pas été lus.</p>
<p class="src">Référence : <a href="https://doi.org/10.1212/WNL.0b013e3181f11e10" target="_blank" rel="noopener">Kasanmoentalib et al., Neurology, 2010 (PMID 20820003)</a>.</p></template>
<template data-pop="g09-berne" data-title="Deux études bernoises sur les séquelles">
<div class="lab">Série observationnelle (Inselspital)</div><p>258 patients : encéphalite 18 %, méningo-encéphalite non bactérienne 42 %, méningite non bactérienne 27 %, bactérienne 13 %. La FSME est la cause infectieuse la plus fréquente ; HSV est la première cause d’encéphalite ; le pneumocoque représente 49 % des méningites bactériennes. À 16 mois (médiane), 56 % des 162 répondants rapportent des séquelles : fatigue ou somnolence diurne 34 %, troubles cognitifs et mnésiques 22 %, céphalées 14 %, crises épileptiques 11 %. Des séquelles existent même après méningite virale, jusqu’à 40 mois.</p>
<div class="lab">Étude prospective</div><p>50 patients et 21 témoins, suivi de 20 mois ; la FSME est la cause la plus fréquente. À 2 ans : plainte cognitive subjective 36 %, fatigue ou somnolence 31 %, sommeil nocturne perturbé 31 %, céphalées 13 %, épuisement rapide après effort cognitif 53 % ; 67 % gardent des signes, pertinents pour la vie sociale ou professionnelle chez environ 30 %, indépendamment de la sévérité initiale.</p>
<div class="lab">Limite</div><p>Plaintes auto-rapportées pour la série observationnelle ; échantillon de petite taille pour l’étude prospective ; lues au résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s12883-021-02502-3" target="_blank" rel="noopener">Ungureanu et al., BMC Neurol, 2021</a> ; <a href="https://doi.org/10.3389/fneur.2024.1411860" target="_blank" rel="noopener">Schwitter et al., Front Neurol, 2024</a>.</p></template>
<template data-pop="g09-gravite" data-title="Sévérité aiguë et plaintes persistantes">
<div class="lab">Constat</div><p>Dans l’étude prospective bernoise, la persistance des plaintes après méningite ou méningo-encéphalite virale ne dépend pas de la sévérité de la phase aiguë.</p>
<div class="lab">Conséquence</div><p>Le dépistage ne se limite pas aux patients sortis gravement atteints.</p>
<div class="lab">Limite</div><p>Une seule étude, de petite taille, lue au résumé.</p>
<p class="src">Référence : <a href="https://doi.org/10.3389/fneur.2024.1411860" target="_blank" rel="noopener">Schwitter et al., Front Neurol, 2024</a>.</p></template>
<template data-pop="g09-fsme-sigle" data-title="FSME : sigle et définition">
<div class="lab">Définition</div><p>FSME désigne la <i>Frühsommer-Meningoenzephalitis</i>, en français méningo-encéphalite à tiques. C’est l’abréviation utilisée en Suisse, qui ne se développe pas lettre à lettre en français.</p>
<p class="src">Référence : <a href="https://www.bag.admin.ch/de/fruehsommer-meningoenzephalitis-fsme" target="_blank" rel="noopener">Office fédéral de la santé publique, FSME</a>.</p></template>
<template data-pop="g09-fsme" data-title="Séquelles de la méningo-encéphalite à tiques">
<div class="lab">Données suisses et européennes</div><p>5 à 15 % des personnes infectées développent une atteinte du SNC, avec des paralysies de membres ou de nerfs faciaux pouvant laisser un handicap permanent ; la létalité est d’environ 1 % des formes neurologiques. Une revue estime que 40 à 50 % des patients développent un syndrome post-encéphalitique ; jusqu’à 50 % de séquelles neurologiques sont rapportées, dont des troubles veille-sommeil.</p>
<div class="lab">Enfant</div><p>L’évolution aiguë est plus bénigne que chez l’adulte, mais une proportion substantielle d’enfants garde des troubles cognitifs prolongés.</p>
<div class="lab">Épidémiologie suisse</div><p>Nombre record de cas déclarés en 2020 ; extension vers le Valais et le Tessin.</p>
<div class="lab">Limite</div><p>Les pourcentages de séquelles varient fortement selon les revues et les définitions ; aucun traitement causal n’existe.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/de/fruehsommer-meningoenzephalitis-fsme" target="_blank" rel="noopener">Office fédéral de la santé publique, FSME</a> ; <a href="https://doi.org/10.1002/rmv.2470" target="_blank" rel="noopener">Chiffi et al., Rev Med Virol, 2023</a> ; <a href="https://doi.org/10.3390/microorganisms10020304" target="_blank" rel="noopener">Chiffi et al., Microorganisms, 2022</a> ; <a href="https://doi.org/10.1016/j.ttbdis.2018.08.003" target="_blank" rel="noopener">Steffen, Ticks Tick Borne Dis, 2019</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.780.894" target="_blank" rel="noopener">Morales et Eperon, Rev Med Suisse, 2022</a>.</p></template>
<template data-pop="g09-fatigue" data-title="Fatigue et troubles du sommeil après encéphalite">
<div class="lab">Données</div><p>Après méningo-encéphalite à tiques : fatigue chez 73,9 % des enfants et 27,4 % des adultes. À Berne, fatigue ou somnolence diurne chez 34 % (série observationnelle) et 31 % (étude prospective) ; sommeil nocturne perturbé chez 31 %.</p>
<div class="lab">Lacune</div><p>Le mécanisme de la fatigue post-encéphalitique n’a été lu dans aucune source ; il n’est pas expliqué.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/microorganisms10020304" target="_blank" rel="noopener">Chiffi et al., Microorganisms, 2022</a> ; <a href="https://doi.org/10.1186/s12883-021-02502-3" target="_blank" rel="noopener">Ungureanu et al., 2021</a> ; <a href="https://doi.org/10.3389/fneur.2024.1411860" target="_blank" rel="noopener">Schwitter et al., 2024</a>.</p></template>
<template data-pop="g09-hsv-sigle" data-title="HSV : virus herpès simplex">
<div class="lab">Définition</div><p>HSV désigne le virus herpès simplex, première cause d’encéphalite dans la série bernoise. Après encéphalite à HSV, une encéphalite auto-immune peut survenir.</p>
<p class="src">Référence : <a href="https://doi.org/10.1186/s12883-021-02502-3" target="_blank" rel="noopener">Ungureanu et al., BMC Neurol, 2021</a>.</p></template>
<template data-pop="g09-autoimmun" data-title="Encéphalite auto-immune après encéphalite à HSV">
<div class="lab">Données</div><p>Cohorte prospective espagnole : 27 % des patients ont développé une encéphalite auto-immune, tous porteurs d’anticorps neuronaux absents au début, surtout dirigés contre le récepteur NMDA. La détection d’anticorps dans les trois semaines est un facteur de risque (odds ratio 11,5).</p>
<div class="lab">Conduite</div><p>Toute aggravation neurologique ou psychiatrique, le plus souvent dans les 2 mois, impose de chercher une encéphalite auto-immune plutôt que de conclure à une séquelle. Le diagnostic rapide est utile car une réponse à l’immunothérapie est possible, surtout après 4 ans. Les consultations de la cohorte avaient lieu à 2, 6 et 12 mois.</p>
<div class="lab">Lacune</div><p>Les molécules, doses et recommandations de l’European Academy of Neurology n’ont pas été lues.</p>
<p class="src">Référence : <a href="https://doi.org/10.1016/S1474-4422(18)30244-8" target="_blank" rel="noopener">Armangue et al., Lancet Neurol, 2018 (PMID 30049614)</a>.</p></template>
<template data-pop="g09-hsv-enfant" data-title="Encéphalite auto-immune après HSV chez l’enfant de 4 ans ou moins">
<div class="lab">Données</div><p>Délai médian 26 jours contre 43 jours chez les plus âgés ; choréo-athétose 100 % ; baisse de vigilance 96 % ; anticorps anti-NMDAR 89 % ; devenir à un an moins bon (Rankin modifié médian 4 contre 2) ; crises 63 % contre 13 %.</p>
<div class="lab">Lecture</div><p>Chez le plus jeune, les mouvements anormaux et la baisse de vigilance sont les signes d’appel. Chez les plus de 4 ans, une psychose est le signe d’appel décrit.</p>
<p class="src">Référence : <a href="https://doi.org/10.1016/S1474-4422(18)30244-8" target="_blank" rel="noopener">Armangue et al., Lancet Neurol, 2018</a>.</p></template>
<template data-pop="g09-audition" data-title="Perte auditive : du siège de la lésion à la décision">
<div class="lab">Siège</div><p>Une perte transitoire est généralement de transmission. Une perte permanente traduit une atteinte du huitième nerf, de la cochlée ou du labyrinthe. Elle peut être présente à l’admission ou survenir au cours de la maladie.</p>
<div class="lab">Décision</div><p>Audiologie formelle avant la sortie ou dans les 4 semaines, second test si normal ; réhabilitation dès que possible ; orientation urgente si la surdité est bilatérale sévère ou profonde.</p>
<p class="src">Références : <a href="https://iris.who.int/handle/10665/379727" target="_blank" rel="noopener">OMS, 2025</a> ; <a href="https://doi.org/10.1016/j.anorl.2013.04.006" target="_blank" rel="noopener">Surdité post-méningitique rapidement progressive de l’enfant, Eur Ann Otorhinolaryngol, 2014</a>.</p></template>
<template data-pop="g09-ossification" data-title="Ossification cochléaire et délai d’implantation">
<div class="lab">Mécanisme</div><p>L’inflammation de l’endolymphe, visible en IRM pondérée T2, peut évoluer vers l’ossification. Celle-ci compromet l’insertion des électrodes d’un implant cochléaire.</p>
<div class="lab">Conséquence</div><p>Un retard d’implantation augmente le risque d’ossification et réduit la faisabilité et les performances de l’implant. En présence d’ossification, un implant bilatéral précoce est recommandé.</p>
<div class="lab">Limite</div><p>Série pédiatrique très petite : IRM positive chez 4 patients sur 5, scanner chez 1 seul. Le détail histologique n’a pas été lu.</p>
<p class="src">Références : <a href="https://iris.who.int/handle/10665/379727" target="_blank" rel="noopener">OMS, 2025</a> ; <a href="https://doi.org/10.1016/j.anorl.2013.04.006" target="_blank" rel="noopener">Eur Ann Otorhinolaryngol Head Neck Dis, 2014</a>.</p></template>
<template data-pop="g09-evaluation" data-title="Évaluation avant la sortie et au suivi">
<div class="lab">Recommandation</div><p>Tout enfant ou adulte après méningite aiguë est évalué pour les séquelles avant la sortie et au suivi (recommandation forte, certitude très faible). Au moins une évaluation a lieu dans les 4 semaines suivant la sortie. Le dépistage porte sur l’audition, la vision, la neurocognition et le retentissement psychologique.</p>
<div class="lab">Organisation</div><p>Orientation vers les services adaptés ; soutien psychologique pour le patient et les aidants ; suivi régulier au-delà de 4 semaines si séquelles ; implication des parents ; coordination santé–social ; aides techniques.</p>
<p class="src">Référence : <a href="https://iris.who.int/handle/10665/379727" target="_blank" rel="noopener">OMS, 2025</a>.</p></template>
<template data-pop="g09-rehab" data-title="Réhabilitation : moyens">
<div class="lab">Recommandation</div><p>Réhabilitation dès que possible en cas de séquelle (recommandation forte, certitude très faible), selon le paquet d’interventions de réhabilitation de l’OMS.</p>
<div class="lab">Audition</div><p>Appareils auditifs, implants cochléaires, implants d’oreille moyenne, logopédie, langue des signes, lecture labiale et autres substitutions sensorielles.</p>
<div class="lab">Limite</div><p>Les modalités suisses (assurance-invalidité, mesures professionnelles) n’ont pas été lues.</p>
<p class="src">Référence : <a href="https://iris.who.int/handle/10665/379727" target="_blank" rel="noopener">OMS, 2025</a>.</p></template>
<template data-pop="g09-duree-ae" data-title="Durée du traitement antiépileptique après crise aiguë de méningite">
<div class="lab">Recommandation</div><p>Antiépileptiques démarrés pour des crises symptomatiques aiguës de méningite : trois mois au plus en l’absence de récidive (conditionnelle, certitude très faible).</p>
<div class="lab">Preuves</div><p>Aucune étude directe dans la méningite. La méta-analyse retrouve un risque relatif de récidive de 1,14 (intervalle de confiance à 95 % de 0,26 à 5,01) entre arrêt précoce et arrêt tardif, avec des preuves indirectes tirées de l’encéphalite : l’intervalle est très large et ne permet aucune conclusion ferme.</p>
<p class="src">Références : <a href="https://iris.who.int/handle/10665/379727" target="_blank" rel="noopener">OMS, 2025</a> ; <a href="https://doi.org/10.1186/s12916-026-04840-w" target="_blank" rel="noopener">Prasad et al., BMC Medicine, 2026 (PMID 42021346)</a>.</p></template>
<template data-pop="g09-tb" data-title="Méningite tuberculeuse : séquelles hors G09">
<div class="lab">Classement</div><p>Les séquelles de tuberculose du SNC se codent B90.0.</p>
<div class="lab">Clinique</div><p>Troubles cognitifs avec récupération partielle ; déficits exécutifs et de mémoire verbale. L’ACE-III et le Trail Making Test sont proposés (preuve faible).</p>
<div class="lab">Corticoïdes</div><p>Réduction de la mortalité de l’adulte (risque relatif 0,83) sans effet démontré sur les complications neurologiques ni la récupération fonctionnelle.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.ijtb.2025.06.003" target="_blank" rel="noopener">Ashwin et al., Indian J Tuberc, 2025</a> ; <a href="https://doi.org/10.5588/ijtld.25.0588" target="_blank" rel="noopener">Nasiri et al., Int J Tuberc Lung Dis, 2026</a>.</p></template>
<template data-pop="g09-mnemo" data-title="Six domaines à interroger (aide pédagogique)">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Les initiales des six domaines de dépistage se retiennent dans cet ordre : Audition, Cognition, Crises, Humeur, Hydrocéphalie, Fatigue (et sommeil). Elles résument les rubriques du catalogue de l’OMS ; elles ne constituent ni un score ni un critère de classification.</p></template>
<template data-pop="g09-lacunes" data-title="Sources non lues et limites">
<div class="lab">Lacunes de sources</div><p>Texte intégral des recommandations européennes de la Société européenne de microbiologie clinique et des maladies infectieuses (2016) : non lu. Aucune recommandation suisse ou de l’European Academy of Neurology sur le suivi des séquelles ni sur l’encéphalite auto-immune n’a été trouvée. Physiopathologie cellulaire (excitotoxicité, lésions hippocampiques), épileptogenèse post-infectieuse, mécanisme de la fatigue, prise en charge de l’hydrocéphalie, traitement de l’encéphalite auto-immune, assurance-invalidité et médicaments de la fatigue ou de la cognition : non lus. Codage de la FSME dans la CIM-10-GM 2024 : non relu.</p>
<div class="lab">Limites de méthode</div><p>La plupart des articles ont été lus au résumé. L’information professionnelle du lévétiracétam est celle d’un générique ; sa date de mise à jour n’était pas affichée. Un biomarqueur expérimental (facteur inhibiteur de la migration des macrophages) est cité par son titre seul et n’est pas utilisé.</p>
<div class="lab">Statut</div><p>Audit différé : revue par intelligence artificielle, distincte d’une validation médicale humaine.</p></template>
