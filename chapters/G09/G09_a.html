<template id="ch-G09"><div class="chap"><div class="chap-head"><div class="code">G 09 · Neurologie · Séquelles d’affections inflammatoires du système nerveux central</div><h1>Séquelles d’affections inflammatoires du système nerveux central</h1><span class="status">Cycle Betta 35 · Revue par intelligence artificielle · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des séquelles</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g09-0">Question clinique</a></li><li><a href="#g09-1">Définition et classification</a></li><li><a href="#g09-2">Fréquence et épidémiologie</a></li><li><a href="#g09-3">Physiopathologie</a></li><li><a href="#g09-4">Causes et facteurs de risque</a></li><li><a href="#g09-5">Anamnèse</a></li><li><a href="#g09-6">Examen clinique</a></li><li><a href="#g09-7">Démarche diagnostique</a></li><li><a href="#g09-8">Urgences et complications</a></li><li><a href="#g09-9">Prise en charge</a></li><li><a href="#g09-10">Suivi, pronostic et prévention</a></li><li><a href="#g09-11">Situations particulières</a></li><li><a href="#g09-12">Critères officiels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g09-0"><h2><span class="n">0</span>Question clinique</h2>
<p data-src="S4,S5,S7">Dans cette <b>vignette fictive</b>, une femme de 41 ans a été hospitalisée dix-huit mois plus tôt pour une méningite pneumococcique et est sortie sans déficit moteur. Elle consulte son médecin de famille parce qu’elle comprend mal ses interlocuteurs au téléphone, qu’elle se sent ralentie dans son travail, qu’elle oublie des consignes et qu’une fatigue l’oblige à se coucher en début d’après-midi. Ces éléments sont pédagogiques ; ils servent à poser trois questions de décision.</p>
<p data-src="S4,S11">La première question est celle de la recherche : parmi les séquelles possibles, lesquelles faut-il chercher activement, et par quel examen, alors que la patiente n’a pas été évaluée avant sa sortie ? La deuxième est celle du délai : quelles séquelles supportent l’attente et lesquelles imposent une orientation urgente ? La troisième est celle de la classification : le trouble actuel et la méningite ancienne se codent-ils ensemble sous la catégorie <button class="w" data-k="g09-codage">G09 (règles de codage)</button> ?</p>
<p data-src="S1,S2">Ce cours traite le <b>patient qui a survécu</b>. G09 n’est pas une maladie : c’est une catégorie de classification qui désigne l’état résiduel d’une affection inflammatoire du système nerveux central (<button class="w" data-k="g09-snc">SNC</button>) classée dans les catégories G00 à G08, c’est-à-dire une méningite, une encéphalite, une myélite, un abcès intracrânien ou une thrombophlébite intracrânienne. Le cours enseigne donc le dépistage, le calendrier de suivi, la réhabilitation et la prévention des séquelles, plus que la phase aiguë.</p>
<div class="key" data-src="S4"><b>À retenir.</b> Une séquelle se découvre souvent après la sortie de l’hôpital et se cherche par un examen ciblé, parce que les plus fréquentes (audition, cognition, retentissement psychologique) échappent à l’examen neurologique de routine. Les recommandations de l’<button class="w" data-k="g09-oms">Organisation mondiale de la santé (OMS)</button> demandent une évaluation avant la sortie puis au suivi.</div>
</section>

<section class="ilot" id="g09-1"><h2><span class="n">1</span>Définition et classification</h2>
<p data-src="S1,S2">Dans la <button class="w" data-k="g09-cim">classification CIM-10-GM 2024 (version et sources lues)</button>, la catégorie G09 désigne les séquelles d’affections inflammatoires du système nerveux central. Elle s’emploie lorsque l’affection causale relève <b>primairement</b> de G00 à G08, à l’exclusion des catégories astérisque G01*, G02*, G05* et G07*. La version 2024 ne comporte pas de sous-catégorie à quatrième caractère pour G09. Le registre de l’Office fédéral de la statistique donne le libellé français « Séquelles d’affections inflammatoires du système nerveux central ».</p>
<p data-src="S1,S2">La classification qualifie de séquelle une affection désignée comme telle ou comme effet tardif, <b>ou présente un an ou plus après le début</b> de l’affection causale. Une maladie inflammatoire chronique du SNC qui reste active ne se code pas comme séquelle : elle se code comme affection actuelle. Le texte renvoie aux règles de codage de morbidité et de mortalité du volume 2 <button class="w" data-k="g09-codage">(règles de codage)</button>.</p>
<p data-src="S3">Trois catégories voisines évitent une erreur de classement. Les séquelles de tuberculose du SNC portent le code B90.0, les séquelles de poliomyélite le code B91 (le syndrome post-poliomyélite est classé G14) et les séquelles d’encéphalite virale le code B94.1 <button class="w" data-k="g09-voisins">(codes voisins et limite de cette lecture)</button>.</p>
<p data-src="S4">Pour l’enseignement, il faut aussi une classification <b>clinique</b> des séquelles. L’<button class="w" data-k="g09-catalogue">OMS (catalogue des séquelles après méningite)</button> cite la perte auditive, les déficits neurologiques focaux, l’atteinte neuropsychologique (troubles cognitifs chez l’adulte ; déficience intellectuelle ou troubles du comportement chez l’enfant), l’hydrocéphalie, les crises récurrentes et l’épilepsie, l’amputation de membre ou de doigts avec cicatrices cutanées, et des effets plus discrets : difficultés sociales et émotionnelles, baisse de la qualité de vie.</p>
<div class="trap" data-src="S1,S2"><span class="k">Piège</span> Coder G09 dès la sortie d’hôpital. Avant un an, la catégorie G09 exige que l’affection soit désignée comme séquelle ou effet tardif ; sinon, le trouble se code comme affection actuelle de l’épisode.</div>
<div class="key" data-src="S1,S2,S3"><b>À retenir.</b> G09 suppose une cause classée en G00 à G08, un trouble résiduel codé ailleurs, une qualification de séquelle ou un délai d’au moins un an, et l’absence de maladie inflammatoire encore active. Les séquelles de tuberculose, de poliomyélite et d’encéphalite virale se classent au chapitre des maladies infectieuses.</div>
<button class="pareto-btn ui" data-k="pareto-g09-definition">▲ Loi de Pareto — Définition, épidémiologie, mécanismes</button>
</section>

<section class="ilot" id="g09-2"><h2><span class="n">2</span>Fréquence et épidémiologie</h2>
<p data-src="S4">Environ une personne sur cinq atteinte de méningite bactérienne garde des complications à long terme, physiques et neuropsychologiques. Les méningites bactériennes, surtout pneumococciques, exposent le plus aux séquelles ; l’OMS note un risque environ trois fois plus élevé en Afrique et en Asie qu’en Europe.</p>
<p data-src="S5">Les séquelles ne sont pas toutes présentes à la sortie. Dans une revue systématique de 89 études, la prévalence poolée de séquelles est, chez l’adulte, de 24,8 % à la sortie, 41,5 % dans les trois mois et 31,9 % au-delà de trois mois ; chez l’enfant, elle est de 28,9 %, 29,9 % et 38,2 % aux mêmes moments <button class="w" data-k="g09-moment">(lecture de ces prévalences)</button>.</p>
<p data-src="S6">Chez l’enfant, une méta-analyse de 13 études, avec un suivi de 6 mois à 35 ans après une méningite bactérienne, rapporte un taux global de complications de 37,3 %, des troubles cognitifs chez 21,6 %, des troubles émotionnels ou comportementaux chez 15,3 % et une perte auditive chez 14,3 % <button class="w" data-k="g09-epid-enfant">(population et limites)</button>.</p>
<p data-src="S7,S8,S9">Chez l’adulte, la cohorte nationale néerlandaise de méningite pneumococcique (évaluation à 1–5 ans, médiane 2 ans) relève 34 % de séquelles neurologiques persistantes, dont une perte auditive chez 27 %, un trouble cognitif objectif chez 14 % et des plaintes subjectives de lenteur (71 %), d’attention (60 %) et de mémoire (61 %) <button class="w" data-k="g09-epid-adulte">(cohortes néerlandaises)</button>.</p>
<p data-src="S10">La <button class="w" data-k="g09-hydro">hydrocéphalie (fréquence, gravité, mécanisme connu)</button> complique 5 % des méningites bactériennes communautaires de l’adulte (26 sur 577), avec une mortalité de 50 % dans cette série.</p>
<p data-src="S11,S12"><b>Données suisses.</b> À l’Inselspital de Berne, 258 patients atteints de méningite, de méningo-encéphalite ou d’encéphalite ont été analysés. À 16 mois (médiane), 56 % des 162 répondants rapportent des séquelles : fatigue ou somnolence diurne (34 %), troubles cognitifs et mnésiques (22 %), céphalées (14 %), crises épileptiques (11 %). Une étude prospective bernoise, avec 21 témoins, retrouve à deux ans une plainte cognitive subjective chez 36 %, une fatigue ou somnolence chez 31 % et au moins un signe persistant chez 67 % <button class="w" data-k="g09-berne">(deux études bernoises)</button>.</p>
<p data-src="S13,S14,S15,S16,S17">La méningo-encéphalite à tiques (<button class="w" data-k="g09-fsme-sigle">FSME</button>) est la cause infectieuse la plus fréquente de la série bernoise. Elle atteint le SNC chez 5 à 15 % des personnes infectées, et les revues rapportent un syndrome post-encéphalitique chez 40 à 50 % des patients <button class="w" data-k="g09-fsme">(séquelles de la FSME)</button>. La Suisse a déclaré un nombre record de cas en 2020.</p>
<div class="key" data-src="S5,S7,S11"><b>À retenir.</b> Environ un survivant sur cinq d’une méningite bactérienne garde une séquelle, et plus d’un survivant sur deux d’une série bernoise rapporte au moins une plainte à 16 mois. L’absence de déficit à la sortie ne dispense donc pas d’un dépistage.</div>
</section>

<section class="ilot" id="g09-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p data-src="S4">Les mécanismes des séquelles se déduisent de ce que l’infection a lésé. Les sources lues décrivent bien trois situations : l’atteinte de l’audition, l’hydrocéphalie et l’encéphalite auto-immune qui peut suivre une encéphalite à <button class="w" data-k="g09-hsv-sigle">HSV</button>. Elles ne décrivent pas la physiopathologie cellulaire de la lésion neuronale ; ce cours ne la reconstitue pas de mémoire <button class="w" data-k="g09-lacunes">(lacunes de sources)</button>.</p>
<p data-src="S4"><b>Audition.</b> Une perte auditive transitoire est généralement <b>de transmission</b>. Une perte permanente traduit une atteinte du nerf vestibulo-cochléaire (huitième nerf crânien), de la cochlée ou du labyrinthe. Elle peut exister dès l’admission ou apparaître au cours de la maladie <button class="w" data-k="g09-audition">(du siège de la lésion au traitement)</button>.</p>
<p data-src="S4,S18"><b>Ossification cochléaire.</b> Après une méningite, l’inflammation de l’endolymphe, visible en IRM pondérée T2, peut évoluer vers l’ossification de la cochlée. Celle-ci compromet l’insertion des électrodes d’un implant cochléaire, d’où l’urgence de l’évaluation. Un retard d’implantation augmente le risque d’ossification et réduit la faisabilité et les performances de l’implant <button class="w" data-k="g09-ossification">(ossification et délai)</button>.</p>
<p data-src="S4"><b>Parole.</b> La surdité dégrade rapidement la parole, parce que l’enfant ou l’adulte privé d’audition perd le contrôle auditif de sa propre voix ; la réhabilitation doit donc être précoce.</p>
<p data-src="S10"><b>Hydrocéphalie.</b> Dans la méningite bactérienne de l’adulte, elle est communicante dans presque tous les cas. Le mécanisme précis de la résorption du liquide cérébro-spinal n’a pas été lu dans le dossier de recherche et n’est pas détaillé ici.</p>
<p data-src="S19"><b>Encéphalite auto-immune post-herpétique.</b> L’encéphalite à HSV peut déclencher une encéphalite auto-immune, surtout par anticorps dirigés contre le récepteur NMDA. Dans une cohorte prospective espagnole, 27 % des patients ont développé cette complication, et tous étaient porteurs d’anticorps neuronaux absents au début <button class="w" data-k="g09-autoimmun">(fréquence, âge, délai)</button>.</p>

<div class="key" data-src="S4,S10,S19"><b>Science → clinique.</b> Une surdité permanente impose une orientation rapide à cause du risque d’ossification ; une hydrocéphalie communicante explique une aggravation tardive après méningite ; une rechute neuropsychiatrique après encéphalite à HSV peut relever d’un mécanisme auto-immun traitable, et non d’une séquelle fixe.</div>
</section>

<section class="ilot" id="g09-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p data-src="S4,S7,S8,S9">Le germe est le premier déterminant : la méningite pneumococcique expose davantage aux séquelles cognitives et auditives que la méningite à méningocoque. Après une « bonne récupération » (score 5 à l’échelle de devenir de Glasgow), 27 % des survivants d’une méningite pneumococcique ont encore un trouble cognitif, essentiellement une lenteur, sans différence significative après méningocoque. Dans la cohorte européenne de dexaméthasone suivie à long terme (médiane 99 mois), la dysfonction cognitive est de 21 % après pneumocoque et de 6 % après méningocoque (p = 0,05) <button class="w" data-k="g09-epid-adulte">(cohortes néerlandaises)</button>.</p>
<p data-src="S4">La région géographique et les comorbidités modifient aussi le risque. Les séquelles ne se limitent pas à la méningite bactérienne ; elles surviennent après une méningite virale et après une encéphalite.</p>
<p data-src="S12"><b>La gravité initiale ne suffit pas à prédire.</b> Dans l’étude prospective bernoise, les plaintes persistantes après méningite ou méningo-encéphalite virale surviennent indépendamment de la sévérité de la phase aiguë <button class="w" data-k="g09-gravite">(conséquence pour le suivi)</button>.</p>
<p data-src="S10">Pour l’hydrocéphalie, la présence d’une hydrocéphalie à l’admission est retrouvée chez 69 % des patients concernés, et l’hydrocéphalie est un facteur indépendant de décès (odds ratio 7,81).</p>
<p data-src="S19"><b>Après encéphalite à HSV.</b> La détection d’anticorps neuronaux dans les trois semaines est un facteur de risque d’encéphalite auto-immune (odds ratio 11,5). Un âge de 4 ans ou moins s’accompagne d’un délai plus court (médiane 26 jours contre 43), d’une choréo-athétose (100 %), d’une baisse de vigilance (96 %), d’anticorps anti-récepteur NMDA (89 %) et d’un devenir plus défavorable à un an <button class="w" data-k="g09-hsv-enfant">(enfant de 4 ans ou moins)</button>.</p>
<div class="trap" data-src="S12"><span class="k">Erreur fréquente</span> Rassurer un patient parce que sa méningite virale était « bénigne ». La sévérité aiguë ne prédit pas la persistance des plaintes ; une fatigue ou un trouble de l’attention doit être cherché dans tous les cas.</div>
<div class="key" data-src="S4,S12,S19"><b>À retenir.</b> Le pneumocoque, l’âge de 4 ans ou moins après HSV et la présence d’anticorps neuronaux précoces sont des facteurs de risque documentés ; la sévérité de la phase aiguë n’en est pas un marqueur fiable pour les plaintes tardives.</div>
</section>

<section class="ilot" id="g09-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-src="S4,S7,S11,S12">L’anamnèse reconstitue l’épisode infectieux (date, germe, sévérité, traitement reçu, dexaméthasone ou non) puis explore chaque domaine de séquelle. Elle porte sur l’audition, la parole, la mémoire, l’attention, la lenteur, la fatigue, le sommeil, les céphalées, les crises, l’humeur et le comportement <button class="w" data-k="g09-mnemo">(six domaines, aide pédagogique)</button> ; chez l’enfant, sur le développement et la scolarité ; chez l’adulte, sur le retour au travail.</p>
<div class="two"><div class="card"><h4>Forme typique : adulte après méningite bactérienne</h4><p data-src="S7,S11">Le patient se plaint de lenteur, de difficultés d’attention et de mémoire, parfois d’une baisse d’audition. Dans la cohorte néerlandaise, 71 % se disent ralentis, 60 % ont des difficultés d’attention et 61 % des difficultés de mémoire. La fatigue et la somnolence diurne sont les plaintes les plus fréquentes à Berne (34 %).</p></div><div class="card"><h4>Forme atypique : rechute après encéphalite à HSV</h4><p data-src="S19">Chez l’enfant de 4 ans ou moins, une choréo-athétose et une baisse de vigilance ; chez l’enfant plus âgé et l’adulte, une psychose. Ces signes, surtout dans les deux mois, évoquent une encéphalite auto-immune et non une séquelle stable <button class="w" data-k="g09-autoimmun">(que faire)</button>.</p></div></div>
<div class="two"><div class="card"><h4>Après méningo-encéphalite à tiques</h4><p data-src="S12,S13,S15">La fatigue, les troubles du sommeil et les troubles cognitifs dominent ; une paralysie de membre ou de nerf facial peut persister. La fatigue est rapportée chez 73,9 % des enfants et 27,4 % des adultes dans une revue des troubles veille-sommeil <button class="w" data-k="g09-fatigue">(fatigue et sommeil)</button>.</p></div><div class="card"><h4>Chez l’enfant</h4><p data-src="S4,S6">L’anamnèse interroge les parents sur le développement, la scolarité et le comportement ; l’OMS décrit chez l’enfant une déficience intellectuelle ou des troubles du comportement, et demande d’impliquer les parents dans le suivi.</p></div></div>
<div class="trap" data-src="S4"><span class="k">Piège</span> Se fier à l’examen neurologique seul. Les séquelles « faciles à manquer » sont l’audition, la vision, la neurocognition et le retentissement psychologique ; elles se cherchent par une anamnèse et des tests dédiés.</div>
</section>

<section class="ilot" id="g09-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-src="S4">L’examen neurologique complet reste la base. Il est complété par un dépistage dirigé de l’audition, de la vision, de la cognition et du retentissement psychologique, dès l’hospitalisation et au suivi.</p>
<div class="two"><div class="card"><h4>État général et signes vitaux</h4><p data-src="S4">Chercher une asthénie, un ralentissement psychomoteur et un comportement inhabituel. Repérer les séquelles cutanées et orthopédiques (cicatrices, amputation de doigts ou de membre) décrites par l’OMS comme séquelles de la maladie.</p></div><div class="card"><h4>Examen neurologique</h4><p data-src="S4">Rechercher un déficit focal, une atteinte des nerfs crâniens, un trouble de la parole et une atteinte visuelle. Une aggravation tardive inexpliquée conduit à rechercher une hydrocéphalie (déduction pédagogique, non issue d’une recommandation lue) <button class="w" data-k="g09-hydro">(hydrocéphalie)</button>.</p></div></div>
<div class="two"><div class="card"><h4>Audition</h4><p data-src="S4,S18">Rechercher une plainte auditive, mais ne pas s’y limiter : l’audiologie formelle est requise. Chez l’enfant, une audiométrie comportementale adaptée à l’âge est répétée pendant deux ans <button class="w" data-k="g09-audiologie">(tests et calendrier)</button>.</p></div><div class="card"><h4>Cognition et humeur</h4><p data-src="S7,S21">Chercher la lenteur, les troubles de l’attention et de la mémoire, une anxiété ou une dépression. Des outils cognitifs comme l’ACE-III ou le Trail Making Test A et B sont proposés après méningite tuberculeuse, avec une preuve faible <button class="w" data-k="g09-neuropsy">(évaluation neuropsychologique)</button>.</p></div></div>
<div class="key" data-src="S4"><b>À retenir.</b> L’examen sert à trois décisions : repérer un déficit qui impose une orientation (audition, hydrocéphalie, crises), documenter la cognition et l’humeur, et vérifier qu’une aggravation n’est pas une complication active ou une encéphalite auto-immune.</div>
<button class="pareto-btn ui" data-k="pareto-g09-clinique">▲ Loi de Pareto — Causes, anamnèse et examen</button>
</section>
