
<!-- ===== FENÊTRES I21 : définitions et notions fondamentales ===== -->
<template data-pop="i21-omi" data-title="Infarctus occlusif (OMI) et équivalents de STEMI">
<div class="lab">Définition</div><p>Infarctus causé par une occlusion coronaire aiguë, totale ou quasi totale, avec un flux absent ou très faible, qui justifie une reperfusion immédiate. Le concept déplace la question de l’ECG vers l’artère : « y a-t-il une occlusion ? » plutôt que « le sus-décalage atteint-il le seuil ? ».</p>
<div class="lab">Pourquoi ce concept</div><p>Une part importante des occlusions ne remplit pas les critères de sus-décalage : circonflexe, paroi postérieure, occlusion très précoce (onde T hyperaiguë), aspect de de Winter. Ces patients, classés NSTEMI, sont coronarographiés plus tard et ont un pronostic moins bon.</p>
<div class="lab">Statut</div><p>La terminologie STEMI/NSTEMI reste celle de l’ESC 2023. Le concept d’infarctus occlusif est porté par la littérature électrocardiographique récente ; l’ESC 2023 retient comme équivalents de STEMI l’infarctus postérieur isolé, le bloc de branche et le rythme électro-entraîné avec ischémie persistante.</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>« Pas de sus-décalage ne veut pas dire pas d’occlusion » : devant une douleur persistante, chercher les quatre équivalents (postérieur, bloc de branche ou stimulation, de Winter, aVR avec sous-décalage diffus), répéter l’ECG et faire une échocardiographie.</p></template>

<template data-pop="i21-lesion" data-title="Lésion myocardique aiguë et chronique">
<div class="lab">Définition</div><p>Lésion myocardique : au moins une valeur de troponine au-dessus du 99e percentile (seuil propre au sexe depuis 2026). Aiguë : montée et/ou descente significative entre deux dosages. Chronique : élévation stable.</p>
<div class="lab">Causes de lésion aiguë non ischémique</div><p>Myocardite, contusion myocardique, chimiothérapie cardiotoxique, sepsis, embolie pulmonaire, insuffisance cardiaque décompensée, cardiomyopathie de stress, AVC étendu ou hémorragie méningée, effort extrême.</p>
<div class="lab">Causes de lésion chronique</div><p>Maladie rénale chronique, insuffisance cardiaque chronique, hypertrophie ventriculaire, amylose cardiaque, cardiomyopathies.</p>
<div class="lab">Conséquence pratique</div><p>Le diagnostic d’infarctus exige en plus une preuve d’ischémie. Une lésion non ischémique ne relève pas d’une double antiagrégation ; elle impose de traiter sa cause.</p></template>

<template data-pop="i21-udmi4" data-title="Types 1 à 5 de la 4e définition universelle (2018)">
<div class="lab">Critère commun</div><p>Lésion myocardique aiguë (troponine au-dessus du 99e percentile avec montée ou descente) et au moins un signe d’ischémie : symptômes ; nouvelles modifications ischémiques de l’ECG ; ondes Q pathologiques ; perte nouvelle de myocarde viable ou trouble segmentaire d’allure ischémique à l’imagerie ; thrombus à l’angiographie ou à l’autopsie (type 1).</p>
<div class="lab">Types</div><p><b>1</b> — athérothrombose (rupture ou érosion de plaque). <b>2</b> — déséquilibre apports-besoins sans athérothrombose aiguë. <b>3</b> — décès avec symptômes et ECG ischémiques, ou fibrillation ventriculaire, avant le dosage des marqueurs. <b>4a</b> — lié à l’angioplastie : troponine &gt; 5 fois le 99e percentile dans les 48 heures chez un patient à troponine initiale normale (si elle était élevée et stable ou décroissante : hausse &gt; 20 % et valeur absolue &gt; 5 fois le 99e percentile), avec une preuve d’ischémie nouvelle (ECG, onde Q, imagerie, complication angiographique). <b>4b</b> — thrombose de stent. <b>4c</b> — resténose. <b>5</b> — lié au pontage : troponine &gt; 10 fois le 99e percentile dans les 48 heures, avec nouvelle onde Q, occlusion de greffon ou perte de myocarde viable à l’imagerie.</p>
<div class="lab">Statut</div><p>Seuils de la 4e définition (2018). La 5e définition (2026) n’utilise plus de multiple de troponine comme critère de confirmation de l’infarctus lié à une procédure : elle exige une complication coronaire démontrée, associée selon le cas à un trouble segmentaire nouveau ou à une perte de myocarde viable, avec les mêmes critères après angioplastie et après chirurgie.</p></template>

<template data-pop="i21-udmi5" data-title="5e définition universelle de l’infarctus (2026)">
<div class="lab">Publication</div><p>Présentée au congrès ESC d’août 2026 et publiée dans l’<i>European Heart Journal</i> (Mills, Newby, Zaman et al., 2026). C’est le premier texte de la série élaboré conjointement par quatre sociétés : l’ESC et la World Heart Federation, avec deux sociétés américaines (ACC et AHA). Il est recevable ici au titre de l’ESC.</p>
<div class="lab">Trois catégories</div><p><b>Infarctus primaire</b> : pathologie coronaire aiguë spontanée (athérothrombose, dissection coronaire spontanée, embolie, vasospasme), y compris resténose, thrombose de stent ou échec de greffon au-delà de 30 jours. <b>Infarctus secondaire</b> : déséquilibre apports-besoins dû à une autre affection aiguë, avec coronaropathie obstructive sans lésion aiguë et/ou trouble segmentaire nouveau. <b>Infarctus lié à une procédure</b> : dans les 30 jours d’une intervention coronaire ou cardiaque, avec une complication coronaire démontrée, associée selon le cas à un trouble segmentaire nouveau ou à une perte de myocarde viable ; aucun seuil multiple de troponine n’est exigé.</p>
<div class="lab">Autres changements</div><p>Suppression du type 3 comme catégorie propre : le décès est classé selon le contexte clinique ou l’autopsie ; 99e percentile de troponine propre à chaque sexe, pour éviter la sous-reconnaissance de l’infarctus chez la femme ; recours encouragé à l’imagerie pour établir le mécanisme ; MINOCA redéfini comme « myocardial injury » (lésion) avec coronaires non obstructives, diagnostic de travail et non diagnostic final.</p>
<div class="lab">Correspondance</div><p>Type 1 → primaire ; type 2 → secondaire ; types 4a et 5, ainsi que thrombose de stent et resténose dans les 30 jours → lié à une procédure ; thrombose de stent, resténose ou échec de greffon au-delà de 30 jours → primaire.</p>
<div class="lab">Source</div><p>Fifth Universal Definition of Myocardial Infarction (2026), <i>European Heart Journal</i> 2026, doi:10.1093/eurheartj/ehag101 ; <i>Circulation</i> 2026, doi:10.1161/CIR.0000000000001477.</p></template>

<template data-pop="i21-reinf" data-title="Réinfarctus et infarctus récurrent">
<div class="lab">Définitions</div><p><b>Réinfarctus</b> : nouvel infarctus dans les 28 jours suivant un premier infarctus (4e définition universelle). <b>Infarctus récurrent</b> : au-delà de 28 jours.</p>
<div class="lab">Critères biologiques (4e définition)</div><p>Si la troponine est encore élevée mais stable ou décroissante, un second dosage 3 à 6 heures après la récidive des symptômes doit montrer une hausse &gt; 20 % : c’est le seuil de variation retenu par un consensus d’experts cité par la 4e définition lorsque la valeur initiale dépasse déjà le 99e percentile. Si elle est revenue à la normale, les critères habituels d’infarctus s’appliquent.</p>
<div class="lab">Clinique</div><p>Récidive de douleur, nouveau sus-décalage ou nouvelle onde Q. Une thrombose de stent se traite comme un STEMI.</p></template>

<template data-pop="i21-plaque" data-title="Plaque vulnérable : rupture et érosion">
<div class="lab">Rupture</div><p>Fibroathérome à chape fine (&lt; 65 µm), noyau nécrotique volumineux, macrophages sécrétant des métalloprotéinases. Mécanisme dominant chez l’homme et le sujet âgé. Le noyau nécrotique, très thrombogène (facteur tissulaire), entre en contact avec le sang.</p>
<div class="lab">Érosion</div><p>Endothélium dénudé sur une plaque riche en protéoglycanes et en cellules musculaires lisses, sans rupture de chape. Plus fréquente chez la femme jeune et le fumeur ; thrombus plus riche en plaquettes.</p>
<div class="lab">Nodule calcifié</div><p>Nodule calcaire qui fait saillie dans la lumière ; sujet âgé, insuffisant rénal.</p>
<div class="lab">Corrélation</div><p>L’imagerie endocoronaire (OCT) distingue rupture et érosion. Une plaque érodée avec un flux conservé pourrait être traitée sans stent, stratégie encore en évaluation.</p></template>

<template data-pop="i21-courant" data-title="Courant de lésion : sus- et sous-décalage du ST">
<div class="lab">Mécanisme</div><p>La cellule ischémique perd du potassium et se dépolarise partiellement au repos. Pendant la diastole électrique, un courant circule de la zone saine vers la zone lésée ; pendant la systole électrique, la zone lésée se dépolarise moins. La somme se traduit par un déplacement du segment ST par rapport à la ligne de base.</p>
<div class="lab">Transmural</div><p>Le vecteur de lésion est dirigé vers l’épicarde, donc vers l’électrode qui fait face : sus-décalage.</p>
<div class="lab">Sous-endocardique</div><p>Le vecteur est dirigé vers la cavité, à l’opposé de l’électrode : sous-décalage. Le sous-décalage ne localise pas l’ischémie, contrairement au sus-décalage.</p></template>

<template data-pop="i21-front" data-title="Progression du front de nécrose">
<div class="lab">Observation expérimentale</div><p>Chez l’animal, la nécrose débute dans le sous-endocarde après 20 à 40 minutes d’occlusion et gagne l’épicarde en 3 à 6 heures (travaux de Reimer et Jennings).</p>
<div class="lab">Facteurs modulateurs</div><p>Circulation collatérale ; préconditionnement par des épisodes ischémiques brefs antérieurs ; occlusion intermittente ; besoins en oxygène (fréquence, pression).</p>
<div class="lab">Conséquences</div><p>Le myocarde sauvé est maximal dans les deux à trois premières heures. Au-delà de 12 heures, le bénéfice de la reperfusion n’est démontré qu’en présence d’ischémie persistante. C’est le fondement des délais de l’îlot 10.</p></template>

<template data-pop="i21-reperf" data-title="Lésion de reperfusion et no-reflow">
<div class="lab">Lésion de reperfusion</div><p>Le retour brutal de l’oxygène et du calcium provoque des radicaux libres, une surcharge calcique (nécrose en bandes de contraction) et l’ouverture du pore de transition de perméabilité mitochondriale. Une partie des cardiomyocytes viables meurt au moment de la reperfusion. Aucun traitement ciblé n’a démontré de bénéfice clinique à ce jour.</p>
<div class="lab">No-reflow</div><p>Absence de reperfusion tissulaire malgré une artère épicardique ouverte : embolisation distale de thrombus, œdème, compression capillaire, obstruction par les leucocytes et les plaquettes. Flux TIMI faible malgré l’absence de sténose résiduelle ; zone sombre au centre du rehaussement tardif en IRM. Marqueur de mauvais pronostic.</p>
<div class="lab">Arythmies de reperfusion</div><p>Rythme idioventriculaire accéléré, bénin ; plus rarement fibrillation ventriculaire.</p></template>

<template data-pop="i21-sideration" data-title="Sidération et hibernation myocardiques">
<div class="lab">Sidération</div><p>Dysfonction contractile qui persiste plusieurs jours à semaines après une ischémie brève, malgré une perfusion restaurée et l’absence de nécrose. Elle récupère spontanément.</p>
<div class="lab">Hibernation</div><p>Dysfonction chronique d’un myocarde viable soumis à une hypoperfusion prolongée. Elle récupère après revascularisation.</p>
<div class="lab">Conséquence pratique</div><p>La FEVG mesurée à la phase aiguë n’est pas définitive : réévaluation entre 6 et 12 semaines avant toute décision de défibrillateur de prévention primaire. L’IRM (rehaussement tardif &lt; 50 % de l’épaisseur) et l’échocardiographie sous faible dose de dobutamine évaluent la viabilité.</p></template>

<template data-pop="i21-sa-coro" data-title="Anatomie coronaire et dominance">
<div class="lab">Gauche</div><p>Tronc commun → interventriculaire antérieure (diagonales, septales ; paroi antérieure, deux tiers antérieurs du septum, apex) et circonflexe (marginales ; paroi latérale).</p>
<div class="lab">Droite</div><p>Coronaire droite → ventricule droit, nœud sinusal (environ 60 %), nœud auriculoventriculaire (environ 80 à 90 %), et, en dominance droite, interventriculaire postérieure (paroi inférieure, tiers inférieur du septum).</p>
<div class="lab">Dominance</div><p>Artère qui donne l’interventriculaire postérieure : droite (environ 70 à 80 %), gauche (environ 10 %), codominance (le reste). Les proportions varient selon les séries.</p>
<div class="lab">Corrélation</div><p>Une occlusion du tronc commun menace environ trois quarts du ventricule gauche : choc, ECG avec sous-décalage diffus et sus-décalage en aVR.</p></template>

<template data-pop="i21-mvo2" data-title="Bilan en oxygène du myocarde">
<div class="lab">Apports</div><p>Débit coronaire × contenu artériel en oxygène. Le débit dépend de la pression de perfusion diastolique (pression aortique diastolique − pression télédiastolique ventriculaire), de la durée de la diastole et des résistances coronaires (sténose, microcirculation, spasme).</p>
<div class="lab">Besoins</div><p>Fréquence cardiaque, contractilité, tension pariétale (pression × rayon / épaisseur). Le produit fréquence × pression systolique en est un indice simple.</p>
<div class="lab">Particularité</div><p>L’extraction de l’oxygène est déjà presque maximale au repos (environ 70 à 75 %) : toute hausse des besoins exige une hausse du débit.</p>
<div class="lab">Application</div><p>Infarctus secondaire : tachycardie (diastole courte, besoins accrus), anémie (contenu réduit), hypotension (perfusion réduite), hypertension (tension pariétale accrue).</p></template>

<template data-pop="i21-plaquette" data-title="Activation plaquettaire et cibles thérapeutiques">
<div class="lab">Adhésion</div><p>Glycoprotéine Ib et facteur de von Willebrand ; glycoprotéine VI et collagène.</p>
<div class="lab">Activation et amplification</div><p>ADP → récepteur P2Y12 (protéine Gi, AMPc abaissé) : cible des thiénopyridines et du ticagrélor. Acide arachidonique → cyclo-oxygénase 1 → thromboxane (TXA₂) : cible de l’acide acétylsalicylique. Thrombine → récepteurs activés par protéase.</p>
<div class="lab">Agrégation</div><p>Glycoprotéine GP IIb/IIIa activée → pont de fibrinogène entre plaquettes : cible des inhibiteurs de la GP IIb/IIIa (tirofiban, eptifibatide).</p>
<div class="lab">Corrélation</div><p>Les deux voies (thromboxane et ADP) s’amplifient mutuellement : leur double blocage est plus efficace que chacun isolément, au prix de plus d’hémorragies.</p></template>

<template data-pop="i21-hf" data-title="Hypercholestérolémie familiale">
<div class="lab">Définition</div><p>Maladie autosomique dominante due surtout à des variants de <i>LDLR</i>, plus rarement d’<i>APOB</i> ou de <i>PCSK9</i>. Forme hétérozygote : environ 1 personne sur 250 à 300.</p>
<div class="lab">Suspicion</div><p>LDL non traité &gt; 4,9 mmol/L chez l’adulte ; coronaropathie précoce personnelle ou familiale ; xanthomes tendineux ; arc cornéen avant 45 ans.</p>
<div class="lab">Diagnostic</div><p>Score du Dutch Lipid Clinic Network ; confirmation génétique.</p>
<div class="lab">Conséquence</div><p>Traitement hypolipémiant intensif, souvent triple ; dépistage en cascade des apparentés, y compris des enfants.</p></template>

<template data-pop="i21-lpa" data-title="Lipoprotéine(a)">
<div class="lab">Nature</div><p>Particule de type LDL à laquelle est liée l’apolipoprotéine(a), homologue du plasminogène. Elle est à la fois athérogène, pro-inflammatoire et potentiellement prothrombotique.</p>
<div class="lab">Déterminant</div><p>Concentration déterminée principalement par des variants du gène <i>LPA</i> (Clarke et al., 2009) ; elle est donc mesurée une fois et n’est pas suivie comme le LDL.</p>
<div class="lab">Seuil</div><p>&gt; 50 mg/dL (environ 105 nmol/L) : facteur de risque cardiovasculaire (mise à jour ESC/EAS 2025). La conversion entre mg/dL et nmol/L est approximative, car elle dépend de la taille de l’isoforme.</p>
<div class="lab">Conduite</div><p>Mesure au moins une fois chez chaque adulte (ESC/EAS 2025, classe IIa) ; si elle est élevée, intensifier le contrôle des autres facteurs et abaisser davantage le LDL. L’essai Lp(a)HORIZON (pelacarsen, 8 323 patients avec maladie cardiovasculaire établie) a abaissé la Lp(a) mais n’a pas réduit le critère cardiovasculaire principal (résultats préliminaires annoncés le 4 septembre 2026) : aucun traitement spécifique de la Lp(a) n’a démontré de bénéfice clinique.</p></template>

<template data-pop="i21-ldl" data-title="Cibles du LDL-cholestérol après un SCA">
<div class="lab">Cible</div><p>Patient à très haut risque, ce qui inclut tout patient après un SCA : LDL &lt; 1,4 mmol/L (55 mg/dL) <b>et</b> baisse ≥ 50 % par rapport à la valeur de départ (ESC/EAS 2019, cible inchangée par la mise à jour 2025). Le Groupe de travail Lipides et Athérosclérose (GSLA), référence suisse, retient la même cible : baisse d’au moins 50 % et LDL &lt; 1,4 mmol/L chez le patient à très haut risque ou atteint d’une maladie cardiovasculaire manifeste.</p>
<div class="lab">Récidive</div><p>Second événement dans les deux ans malgré un traitement maximal : cible &lt; 1,0 mmol/L (40 mg/dL) à envisager (ESC/EAS 2019, classe IIb).</p>
<div class="lab">Pourquoi si bas</div><p>Les essais IMPROVE-IT (ézétimibe), FOURIER (évolocumab) et ODYSSEY OUTCOMES (alirocumab) ont montré que chaque baisse supplémentaire du LDL, même sous 1,8 mmol/L, réduit les événements, sans seuil inférieur de sécurité identifié.</p>
<div class="lab">Calendrier</div><p>Statine de haute intensité à l’admission ; contrôle à 4–6 semaines ; escalade par étapes ou association d’emblée.</p></template>

<template data-pop="i21-arb-sexe" data-title="Seuil de troponine : uniforme ou propre à chaque sexe ?">
<div class="lab">Les deux positions</div><p><b>ESC 2023 (syndromes coronariens aigus)</b> : les données sur les seuils de troponine hypersensible propres à chaque sexe sont jugées contradictoires ; des seuils uniformes restent la règle pour le diagnostic précoce de l’infarctus et pour les algorithmes 0 h/1 h et 0 h/2 h. <b>5e définition universelle (ESC et WHF, août 2026)</b> : le 99e percentile propre à chaque sexe est exigé pour définir la lésion myocardique, afin de corriger la sous-reconnaissance de l’infarctus chez la femme.</p>
<div class="lab">Mécanisme du désaccord</div><p>La concentration de troponine d’une population saine dépend en partie du sexe : un seuil unique fixé sur une population mixte est relativement élevé pour la femme, ce qui fait manquer des lésions. À l’inverse, les algorithmes rapides ont été validés avec des seuils uniformes : les modifier sans validation propre déplace leurs valeurs prédictives.</p>
<div class="lab">Choix retenu</div><p>La source primaire la plus récente l’emporte : pour <b>définir</b> une lésion myocardique, on applique le 99e percentile propre à chaque sexe fourni par le fabricant du dosage (5e définition, 2026). Pour <b>exclure ou confirmer rapidement</b> un infarctus, on applique les seuils uniformes validés de l’algorithme 0 h/1 h du dosage utilisé (ESC 2023), seul texte qui fixe ces valeurs. Aucune position propre de la Société suisse de cardiologie sur ce point n’a été trouvée au 08.10.2026.</p>
<div class="lab">Texte en vigueur</div><p>Byrne R. A. et al., 2023 ESC Guidelines for the management of acute coronary syndromes, <i>European Heart Journal</i> 2023;44:3720–3826, section 3.3.3. Mills N. L. et al., Fifth Universal Definition of Myocardial Infarction, <i>European Heart Journal</i> 2026, doi:10.1093/eurheartj/ehag101.</p></template>
