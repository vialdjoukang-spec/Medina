
<!-- ===== FENÊTRES PARETO I21 ===== -->
<template data-pop="pareto-i21-def" data-title="Pareto — Définitions et épidémiologie">
<p class="ratio" data-cover="i21-1,i21-2"></p>
<ul><li>SCA = spectre : STEMI (occlusion → reperfusion immédiate) ; NSTE-ACS = NSTEMI (troponine ↑↓) + angor instable (troponine normale).</li><li>Lésion myocardique = troponine &gt; 99e percentile ; aiguë si variation. Infarctus = lésion aiguë + preuve d’ischémie.</li><li>4e définition (2018) : types 1 (athérothrombose), 2 (déséquilibre), 3 (décès), 4a/4b/4c (angioplastie : &gt; 5 × 99e percentile), 5 (pontage : &gt; 10 ×).</li><li>5e définition (2026) : primaire / secondaire / lié à une procédure (30 jours) ; type 3 supprimé ; procédure : complication démontrée, plus de multiple de troponine ; seuils par sexe ; MINOCA = « injury ».</li><li>Réinfarctus : nouvel infarctus dans les 28 jours ; au-delà, infarctus récurrent.</li><li>AMIS Plus : 59 % de STEMI et 41 % de NSTEMI. Suisse (OFS, 2024) : 20 029 décès cardiovasculaires (26,7 % des décès chez l’homme, 28,9 % chez la femme), 19 851 cas d’infarctus ; AMIS Plus 1997–2016 : mortalité hospitalière du STEMI 9,8 → 5,5 % (homme), 18,3 → 6,9 % (femme).</li><li>Pronostic : FEVG, Killip, délai de reperfusion, âge, rein, diabète.</li></ul></template>

<template data-pop="pareto-i21-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i21-3"></p>
<ul><li>Plaque à chape fine → rupture (ou érosion) → thrombus plaquettaire (antiagrégants) puis fibrineux (anticoagulants).</li><li>Occlusion totale → ischémie transmurale → sus-décalage ; subtotale → sous-endocardique → sous-décalage ou ECG normal. 25,5 % des NSTEMI ont une artère coupable occluse, surtout coronaire droite et circonflexe (méta-analyse 2017) → concept d’OMI.</li><li>Nécrose : sous-endocarde en 20–40 min → transmurale en 3–6 h ; bénéfice maximal de la reperfusion précoce.</li><li>Potassium extracellulaire → courant de lésion et fibrillation ventriculaire précoce.</li><li>Reperfusion : lésion de reperfusion, no-reflow, sidération (FEVG initiale non définitive).</li><li>Paroi fragile du 3e au 7e jour → ruptures ; remodelage → insuffisance cardiaque et tachycardie ventriculaire ; limité par IEC, bêtabloquant, antagoniste minéralocorticoïde.</li></ul></template>

<template data-pop="pareto-i21-etio" data-title="Pareto — Étiologies et facteurs de risque">
<p class="ratio" data-cover="i21-4"></p>
<ul><li>Athérothrombose dominante. Non athéromateux : dissection spontanée (femme jeune, péripartum), spasme, embolie, cocaïne.</li><li>Type 2 : anémie, tachyarythmie, hypotension, hypoxémie ; ne pas l’affirmer sans exclure un type 1.</li><li>INTERHEART : neuf facteurs modifiables &gt; 90 % du risque (lipides, tabac, hypertension, diabète, obésité abdominale, psychosocial ; protecteurs : fruits et légumes, activité).</li><li>Antécédent familial précoce (&lt; 55 ans homme, &lt; 65 ans femme ; ESC 2024) → hypercholestérolémie familiale, lipoprotéine(a).</li><li>Femme : prééclampsie, diabète gestationnel, ménopause précoce.</li></ul></template>

<template data-pop="pareto-i21-clin" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="i21-5,i21-6"></p>
<ul><li>Douleur rétrosternale constrictive &gt; 20 min, irradiant bras/mâchoire, sueurs ; irradiation aux deux bras et sueurs ↑ la probabilité.</li><li>Heure de début : reperfusion si &lt; 12 h ; troponine très basse n’exclut que si &gt; 3 h.</li><li>Atypique : femme, âgé, diabétique, insuffisant rénal (dyspnée, fatigue, épigastralgie). Trinitrine efficace ≠ preuve coronaire.</li><li>Chercher contre-indications : AVC, hémorragie, anticoagulant, inhibiteur de la phosphodiestérase de type 5.</li><li>Examen : Killip ; souffle nouveau (septum, pilier) ; frottement ; triade du ventricule droit ; pression aux deux bras (dissection).</li></ul></template>

<template data-pop="pareto-i21-ecg" data-title="Pareto — Électrocardiogramme">
<p class="ratio" data-cover="i21-7"></p>
<ul><li>ECG ≤ 10 min après le premier contact ; répéter.</li><li>Sus-décalage au point J, nouveau, dans deux dérivations contiguës : ≥ 1 mm ; V2–V3 : ≥ 2 mm (homme ≥ 40 ans), ≥ 2,5 mm (homme &lt; 40 ans), ≥ 1,5 mm (femme). V7–V9 et V3R–V4R : ≥ 0,5 mm.</li><li>Équivalents traités comme STEMI : postérieur (sous-décalage V1–V3), bloc de branche ou stimulation avec ischémie persistante, de Winter ; sous-décalage ≥ 6 dérivations + sus-décalage aVR = très haut risque.</li><li>Wellens : sténose critique de l’interventriculaire antérieure, pas d’épreuve d’effort.</li><li>Imitateurs : repolarisation précoce, péricardite, hypertrophie, anévrisme, Brugada, hyperkaliémie.</li><li>Ne jamais attendre la troponine devant un ECG d’occlusion ; ECG normal n’exclut pas.</li></ul></template>

<template data-pop="pareto-i21-diag" data-title="Pareto — Troponine et diagnostic">
<p class="ratio" data-cover="i21-8"></p>
<ul><li>Troponine hypersensible : lésion, pas mécanisme ; la cinétique distingue aigu et chronique.</li><li>0 h/1 h (meilleure option) ou 0 h/2 h, tous deux classe I : exclusion (VPN &gt; 99 %, ≈ 60 % des patients), confirmation (VPP 70–75 %, ≈ 15 %), observation (≈ 25 % : dosage à 3 h + échocardiographie ; mortalité comparable à la confirmation). Seuils propres à chaque dosage.</li><li>Elecsys 0 h/1 h : exclusion &lt; 5, ou &lt; 12 et variation &lt; 3 ; confirmation ≥ 52 ou variation ≥ 5 ng/L.</li><li>Différentiel vital : dissection aortique, embolie pulmonaire, tamponnade, pneumothorax compressif, rupture œsophagienne.</li><li>Dissection de type A pouvant donner un sus-décalage inférieur → imagerie avant antithrombotiques si doute.</li></ul></template>

<template data-pop="pareto-i21-risque" data-title="Pareto — Gravité et stratification">
<p class="ratio" data-cover="i21-9"></p>
<ul><li>Gravité : arrêt, choc, insuffisance cardiaque aiguë, arythmie, complication mécanique, douleur réfractaire.</li><li>Killip I à IV. GRACE (8 variables) &gt; 140 = haut risque.</li><li>NSTE-ACS très haut risque → coronarographie immédiate (I) ; haut risque (NSTEMI confirmé, ST dynamique, GRACE &gt; 140) → &lt; 24 h (IIa) ; sinon sélective (I).</li><li>ARC-HBR : 1 majeur ou 2 mineurs = haut risque hémorragique (≥ 4 %/an). Majeurs : anticoagulant, DFG &lt; 30, Hb &lt; 110 g/L, hémorragie intracrânienne. Mineurs : ≥ 75 ans, DFG 30–59, AINS ou corticoïdes.</li></ul></template>

<template data-pop="pareto-i21-stemi" data-title="Pareto — Reperfusion de l’infarctus avec sus-décalage">
<p class="ratio" data-cover="i21-10"></p>
<ul><li>Reperfusion si symptômes &lt; 12 h + sus-décalage ou équivalent.</li><li>Délais : diagnostic ≤ 10 min ; diagnostic → guide ≤ 90 min ; si &gt; 120 min prévisibles → fibrinolyse dans les 10 min.</li><li>Oxygène seulement si SpO₂ &lt; 90 % ; opiacé titré (IIa) ; nitrés si pas d’hypotension ni de ventricule droit.</li><li>Angioplastie : radiale, stent actif, pas d’aspiration systématique ; revascularisation complète pendant la procédure ou ≤ 45 jours ; choc → artère coupable seule, pas de ballon de contre-pulsion en routine.</li><li>12–48 h stable : angioplastie à envisager (IIa) ; &gt; 48 h asymptomatique : non (III).</li><li>Fibrinolyse : ténectéplase selon le poids (demi-dose au-delà de 75 ans) → transfert systématique ; échec (&lt; 50 % de résolution à 60–90 min) → sauvetage ; succès → coronarographie 2–24 h.</li><li>Métoprolol intraveineux si pas d’insuffisance cardiaque et PAS &gt; 120 mmHg (IIa).</li><li>Surveillance du rythme ≥ 24 h (I) ; sortie à 48–72 h chez des patients sélectionnés si réadaptation et suivi organisés (IIa).</li></ul></template>

<template data-pop="pareto-i21-nste" data-title="Pareto — Syndrome sans sus-décalage">
<p class="ratio" data-cover="i21-11"></p>
<ul><li>Urgence = stratification, pas reperfusion.</li><li>Acide acétylsalicylique + anticoagulant ; pas de prétraitement P2Y12 de routine si coronarographie &lt; 24 h (III).</li><li>Angioplastie ou pontage en équipe (pluritronculaire diabétique, tronc commun → pontage). Arrêt avant chirurgie programmée : 7 jours (informations professionnelles suisses) ; avant pontage, saignement accru si ticagrélor arrêté &lt; 96 h ; pas d’excès si clopidogrel arrêté &gt; 5 jours.</li><li>Coronaires sans sténose ≥ 50 % → MINOCA → IRM.</li><li>Récidive de douleur ou ST dynamique → très haut risque.</li></ul></template>

<template data-pop="pareto-i21-at" data-title="Pareto — Traitement antithrombotique">
<p class="ratio" data-cover="i21-12"></p>
<ul><li>Acide acétylsalicylique 150–300 mg puis 75–100 mg/jour. Prasugrel ou ticagrélor &gt; clopidogrel ; prasugrel préféré si angioplastie (IIa).</li><li>HNF pendant l’angioplastie ; fondaparinux préféré sans coronarographie précoce, jamais seul en salle.</li><li>DAPT 12 mois par défaut ; monothérapie après 3–6 mois (IIa) ; désescalade possible (IIb), jamais &lt; 30 jours (III) ; haut risque hémorragique : 1 mois (IIb) ; prolongation si risque ischémique élevé sans haut risque hémorragique (IIa).</li><li>Inhibiteur de la pompe à protons si haut risque digestif (I) ; pantoprazole avec le clopidogrel.</li><li>Fibrillation auriculaire : triple thérapie 1 semaine (≤ 1 mois), puis anticoagulant + clopidogrel jusqu’à 12 mois, puis anticoagulant seul ; pas de prasugrel ni de ticagrélor.</li><li>Ne pas interrompre la DAPT le premier mois.</li></ul></template>

<template data-pop="pareto-i21-compl" data-title="Pareto — Complications">
<p class="ratio" data-cover="i21-13"></p>
<ul><li>Ruptures du 1er au 7e jour (premier infarctus, âgé, femme, reperfusion tardive) : paroi libre (tamponnade), septum (souffle holosystolique + frémissement, saut d’oxymétrie), pilier postéromédial (œdème pulmonaire, souffle parfois absent) → échocardiographie, chirurgie.</li><li>Thrombus ventriculaire gauche (antérieur étendu) → anticoagulation 3–6 mois.</li><li>Fibrillation ventriculaire &lt; 48 h : pas de défibrillateur d’office ; tardive : défibrillateur.</li><li>Bloc inférieur nodal transitoire ; antérieur infranodal grave ; stimulation définitive si &gt; 5 jours.</li><li>Ventricule droit : remplissage, pas de nitrés ni de diurétiques.</li><li>Péricardite précoce ; Dressler : aspirine + colchicine.</li><li>Réinfarctus : hausse de troponine &gt; 20 %.</li></ul></template>

<template data-pop="pareto-i21-prev" data-title="Pareto — Prévention secondaire et suivi">
<p class="ratio" data-cover="i21-14"></p>
<ul><li>Statine haute intensité d’emblée ; LDL &lt; 1,4 mmol/L et −50 % (&lt; 1,0 si récidive ≤ 2 ans) ; contrôle 4–6 semaines ; ézétimibe puis inhibiteur de PCSK9 ; association d’emblée encouragée (2025) ; acide bempédoïque si intolérance (I).</li><li>Lipoprotéine(a) une fois ; &gt; 50 mg/dL = risque.</li><li>Bêtabloquant si FEVG ≤ 40 % (I) ; 40–49 % : bénéfice (méta-analyse 2025) ; ≥ 50 % : pas de bénéfice (méta-analyse de 17 801 patients, 2025).</li><li>IEC si FEVG ≤ 40 %, insuffisance cardiaque, diabète, hypertension, rein (I), à envisager chez tous (IIa) ; éplérénone si FEVG ≤ 40 % + insuffisance cardiaque ou diabète (I ; diabète seul hors indication suisse).</li><li>Colchicine 0,5 mg : IIb après un SCA (ESC 2023), IIa dans la coronaropathie chronique (ESC 2024), hors indication autorisée en Suisse. iSGLT2 seulement pour diabète, insuffisance cardiaque ou rein.</li><li>Arrêt du tabac ; PAS 120–129 mmHg ; activité 150–300 min/semaine ; grippe (OFSP) ; réadaptation (OPAS, centres SCPRS).</li><li>Conduite (Suisse, 2024) : groupe 1 → 1 semaine ; groupe 2 → 4 semaines + NYHA I–II + FEVG &gt; 35 % + effort normal.</li><li>Échocardiographie avant la sortie ; si FEVG ≤ 40 %, réévaluer à 6–12 semaines (défibrillateur).</li></ul></template>

<template data-pop="pareto-i21-part" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="i21-15"></p>
<ul><li>MINOCA : diagnostic de travail → IRM cardiaque.</li><li>Dissection coronaire : conservateur si stable ; chercher une dysplasie fibromusculaire.</li><li>Tako-tsubo : femme ménopausée, stress, ballonisation apicale, récupération.</li><li>Type 2 : traiter la cause, pas de DAPT par principe.</li><li>Âgé : même stratégie ; prasugrel en général non recommandé (5 mg si nécessaire), demi-dose de ténectéplase au-delà de 75 ans, énoxaparine sans bolus ; clopidogrel si risque hémorragique.</li><li>Rein : cinétique de troponine ; énoxaparine 1 mg/kg/jour si clairance &lt; 30 ; fondaparinux contre-indiqué &lt; 20.</li><li>Foie : cirrhose avec hypertension portale = critère ARC-HBR majeur ; inhibiteurs P2Y12 contre-indiqués en Child-Pugh C ; anticoagulants oraux directs selon la classe de Child-Pugh.</li><li>Grossesse : dissection ; angioplastie ; pas de statine.</li><li>Cocaïne : benzodiazépines, nitrés ; pas de bêtabloquant aigu. Spasme : inhibiteurs calciques.</li></ul></template>

<template data-pop="pareto-i21-bio" data-title="Pareto — Troponine et biologie">
<p class="ratio" data-cover="i21-e-2"></p>
<ul><li>99e percentile propre au dosage (troponine T Elecsys : 14 ng/L) et, depuis 2026, au sexe (troponine I Architect : 16 ng/L femme, 34 ng/L homme).</li><li>Cinétique : détection dès les premières heures ; exclusion sur valeur très basse seulement après 3 h ; élévation de plusieurs jours. CK-MB obsolète.</li><li>Seuils Elecsys et Architect 0 h/1 h et 0 h/2 h (tableau) ; valeur très basse seulement si &gt; 3 h.</li><li>Profils : plateau (myocardite), modérée + NT-proBNP très élevé (Tako-tsubo), stable (rein), troponine T seule (myopathie).</li><li>Bilan : hémogramme, créatinine, K⁺ (≥ 4,0), HbA1c, lipides à l’admission, lipoprotéine(a).</li></ul></template>

<template data-pop="pareto-i21-ecgex" data-title="Pareto — Fiche d’interprétation de l’électrocardiogramme">
<p class="ratio" data-cover="i21-e-3"></p>
<ul><li>Normes : PR 120–200 ms ; QRS &lt; 120 ms ; QT corrigé &lt; 450 (homme) / 460 ms (femme).</li><li>Sous-décalage significatif ≥ 0,5 mm ; onde T négative &gt; 1 mm.</li><li>Séquence : T hyperaiguë → sus-décalage → Q → retour du ST → T négative.</li><li>Territoires : V1–V4 interventriculaire antérieure ; DI, aVL, V5–V6 circonflexe ; DII, DIII, aVF coronaire droite (≈ 80 %) ; V7–V9 postérieur ; V3R–V4R ventricule droit.</li><li>Inférieur : DIII &gt; DII + sous-décalage DI → coronaire droite.</li><li>Sous-décalage maximal V1–V3 → enregistrer V7–V9.</li></ul></template>

<template data-pop="pareto-i21-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i21-e-1,i21-e-2,i21-e-3,i21-e-4"></p>
<ul><li>ECG = examen décisionnel ; troponine hypersensible = référence biologique ; coronarographie = gold standard de l’anatomie ; IRM = référence tissulaire (MINOCA).</li><li>STEMI : ECG et clinique suffisent, aucun examen ne retarde le transfert.</li><li>Échocardiographie : cinétique segmentaire, FEVG, complications, thrombus ; immédiate si instabilité.</li><li>Coronarographie : sténose significative ≥ 70 % (tronc commun ≥ 50 %) ; TIMI 0–3 ; FFR ≤ 0,80, iFR ≤ 0,89.</li><li>Coroscanner : probabilité faible à intermédiaire.</li><li>IRM : rehaussement sous-endocardique/transmural = infarctus ; sous-épicardique = myocardite ; absent + œdème = Tako-tsubo ; &lt; 50 % d’épaisseur = viable.</li><li>FEVG du premier jour non définitive : défibrillateur pas avant 6 semaines ni avant 3 mois de traitement optimal.</li></ul></template>

<template data-pop="pareto-i21-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i21-sa,i21-sh,i21-sp,i21-sb,i21-sg"></p>
<ul><li>Interventriculaire antérieure : antérieur, septum antérieur, apex ; circonflexe : latéral ; coronaire droite : inférieur, ventricule droit, nœud auriculoventriculaire (≈ 80–90 %). Dominance droite ≈ 70–80 %.</li><li>Pilier postéromédial à vascularisation unique → rupture dans l’infarctus inférieur. Blocs : nodal (inférieur) vs infranodal (antérieur).</li><li>Sous-endocarde perfusé en dernier, comprimé en systole → premier atteint.</li><li>Nécrose : polynucléaires jours 1–3, macrophages jours 3–7 (paroi fragile → ruptures), granulation jours 7–14, cicatrice &gt; 2 mois.</li><li>Extraction d’oxygène ≈ 70–75 % au repos → apports = débit ; perfusion diastolique. Cascade : perfusion → métabolisme → diastole → systole → ECG → douleur.</li><li>Cibles : cyclo-oxygénase 1 (aspirine, irréversible), P2Y12 (clopidogrel via CYP2C19, prasugrel, ticagrélor réversible), thrombine/Xa (héparines, fondaparinux, bivalirudine), GP IIb/IIIa, fibrine (ténectéplase).</li><li>LDL : HMG-CoA réductase (statine), NPC1L1 (ézétimibe), PCSK9 (anticorps, inclisiran), ATP-citrate lyase (bempédoïque).</li><li>Génétique : hypercholestérolémie familiale (<i>LDLR</i>, ≈ 1/300) ; lipoprotéine(a) (<i>LPA</i>, &gt; 90 % génétique) ; <i>CYP2C19</i> et clopidogrel.</li></ul></template>

<template data-pop="pareto-i21-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i21-p-1,i21-p-2,i21-p-3,i21-p-4,i21-p-5"></p>
<ul><li>Doses : aspirine 150–300 → 75–100 mg ; prasugrel 60 → 10 mg (5 mg si &lt; 60 kg ; à 75 ans et plus, en général non recommandé, 5 mg si nécessaire) ; ticagrélor 180 → 90 mg × 2 ; clopidogrel 300–600 → 75 mg ; HNF 70–100 unités/kg ; ténectéplase 30–50 mg selon le poids.</li><li>Atorvastatine 40–80 ; rosuvastatine 20–40 ; ézétimibe 10 ; éplérénone 25 → 50 ; ramipril → 5 mg × 2 ; colchicine 0,5 mg.</li><li>Interactions : clopidogrel–oméprazole ; ticagrélor–inhibiteurs du CYP3A4 ; nitrés–inhibiteurs de la phosphodiestérase de type 5 ; DAPT–AINS ; ne pas changer d’héparine.</li><li>Ticagrélor : dyspnée (≈ 14 %), pauses. Statine : la plupart des myalgies ne sont pas causées par la statine.</li><li>À éviter : AINS, antiarythmiques de classe Ic, vérapamil/diltiazem si FEVG réduite, nifédipine immédiate, prasugrel après AVC, corticoïdes à la phase aiguë.</li></ul></template>
