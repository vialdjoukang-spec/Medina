
<!-- ===== FENÊTRES I21 : examens, scores, prise en charge, complications ===== -->
<template data-pop="i21-hstn" data-title="Troponine hypersensible">
<div class="lab">Question clinique</div><p>Existe-t-il une lésion myocardique, est-elle aiguë, et son profil est-il compatible avec un infarctus ?</p>
<div class="lab">Définition du dosage hypersensible</div><p>Coefficient de variation ≤ 10 % au 99e percentile, et valeur mesurable au-dessus de la limite de détection chez au moins la moitié des sujets sains.</p>
<div class="lab">Cinétique</div><p>Détectable 1 à 3 heures après le début de la nécrose ; pic à 12–24 heures ; normalisation en 7 à 10 jours (troponine I) ou 10 à 14 jours (troponine T).</p>
<div class="lab">Interprétation</div><p>Valeur isolée : lésion ou non. Variation entre deux dosages : lésion aiguë ou chronique. Contexte : ischémique ou non. Plus la valeur initiale est élevée et plus la variation est grande, plus l’infarctus est probable.</p>
<div class="lab">Pièges</div><p>Symptômes de moins de 3 heures (troponine encore normale) ; insuffisance rénale (élévation chronique) ; anticorps hétérophiles, macrotroponine ; myopathie (troponine T) ; valeurs non transposables d’un fabricant à l’autre.</p>
<div class="lab">Erreur fréquente</div><p>Ignorer une troponine « légèrement » élevée chez un patient âgé : même une élévation modérée a une valeur pronostique.</p></template>

<template data-pop="i21-algo" data-title="Seuils des algorithmes 0 h/1 h et 0 h/2 h">
<div class="lab">Troponine T hypersensible (Elecsys), 0 h/1 h</div><p>Exclusion si 0 h &lt; 5 ng/L (douleur depuis plus de 3 heures), ou 0 h &lt; 12 ng/L et variation &lt; 3 ng/L ; confirmation si 0 h ≥ 52 ng/L, ou variation ≥ 5 ng/L.</p>
<div class="lab">Autres dosages et 0 h/2 h</div><p>Les seuils sont propres à chaque dosage (quatrième tableau des données supplémentaires de l’ESC 2023) et sont fournis par le laboratoire : ils ne se transposent jamais d’un fabricant à l’autre.</p>
<div class="lab">Règles d’usage</div><p>ECG sans sus-décalage ; patient stable ; exclusion sur valeur très basse seulement si la douleur date de plus de 3 heures ; toute nouvelle douleur impose de recommencer. Le groupe « observation » reçoit un dosage à 3 heures et une échocardiographie ; sa mortalité est comparable à celle du groupe « confirmation ».</p>
<div class="lab">Source</div><p>ESC 2023, section 3.3.4 et figure 6 ; documentation du fabricant pour les seuils Elecsys.</p></template>

<template data-pop="i21-grace" data-title="Score GRACE">
<div class="lab">Variables</div><p>Âge, fréquence cardiaque, PAS, créatinine, classe de Killip, arrêt cardiaque à l’admission, déviation du segment ST, élévation des marqueurs cardiaques.</p>
<div class="lab">Usage</div><p>Estime la mortalité hospitalière et à six mois (calculateur en ligne, version 2.0). Dans le NSTE-ACS, un score &gt; 140 est un critère de haut risque : une coronarographie dans les 24 heures est à envisager (ESC 2023).</p>
<div class="lab">Limite</div><p>Ne mesure pas le risque hémorragique ; ne remplace pas le jugement sur les critères de très haut risque.</p></template>

<template data-pop="i21-archbr" data-title="Critères ARC-HBR du risque hémorragique élevé">
<div class="lab">Règle</div><p>Un critère majeur, ou deux critères mineurs : risque hémorragique élevé (hémorragie grave ≥ 4 % à un an, ou hémorragie intracrânienne ≥ 1 %).</p>
<div class="lab">Critères majeurs</div><p>Anticoagulation orale au long cours ; DFG &lt; 30 mL/min/1,73 m² ; hémoglobine &lt; 110 g/L ; hémorragie spontanée ayant nécessité hospitalisation ou transfusion dans les 6 derniers mois, ou récidivante ; thrombopénie &lt; 100 × 10⁹/L ; trouble chronique de l’hémostase ; cirrhose avec hypertension portale ; cancer actif dans les 12 derniers mois ; hémorragie intracrânienne spontanée antérieure, traumatique dans les 12 mois, malformation artérioveineuse cérébrale, AVC ischémique modéré ou grave dans les 6 mois ; chirurgie majeure non différable sous double antiagrégation ; chirurgie majeure ou traumatisme récent dans les 30 jours avant l’angioplastie.</p>
<div class="lab">Critères mineurs</div><p>Âge ≥ 75 ans ; DFG 30–59 mL/min/1,73 m² ; hémoglobine 110–129 g/L (homme) ou 110–119 g/L (femme) ; hémorragie spontanée dans les 12 mois ne remplissant pas le critère majeur ; AINS ou corticoïdes au long cours ; AVC ischémique ne remplissant pas le critère majeur.</p>
<div class="lab">Conséquence</div><p>Abord radial, clopidogrel plutôt que prasugrel ou ticagrélor selon le contexte, double antiagrégation abrégée à 1 à 3 mois, inhibiteur de la pompe à protons.</p></template>

<template data-pop="i21-timi" data-title="Grade de flux TIMI">
<p><b>0</b> — Aucun flux au-delà de l’occlusion.<br><b>1</b> — Le contraste franchit la lésion sans opacifier tout le lit d’aval.<br><b>2</b> — Opacification complète du lit d’aval, mais plus lente que dans une artère normale.<br><b>3</b> — Flux normal.</p>
<div class="lab">Valeur</div><p>Un flux TIMI 3 après angioplastie est associé à la meilleure survie. Un flux 0–1 malgré l’absence de sténose résiduelle définit le no-reflow.</p></template>

<template data-pop="i21-delais" data-title="Chaîne des délais et organisation en réseau">
<div class="lab">Temps zéro</div><p>L’ESC compte les délais à partir du <b>diagnostic de STEMI</b>, c’est-à-dire de l’interprétation de l’ECG, et non de l’arrivée à l’hôpital. Le délai patient (du début des symptômes à l’appel) et le délai système (de l’appel à la reperfusion) s’additionnent.</p>
<div class="lab">Organisation</div><p>Ambulance avec ECG et transmission, activation directe de la salle de cathétérisme, transfert direct en salle sans passer par les urgences, disponibilité 24 heures sur 24 du centre. En Suisse, l’appel au 144 est le point d’entrée.</p>
<div class="lab">Réduire le délai patient</div><p>Éducation des patients à risque : appeler le 144 dès une douleur thoracique de plus de quelques minutes, sans se rendre par ses propres moyens chez le médecin.</p></template>

<template data-pop="i21-lyse-ci" data-title="Contre-indications de la fibrinolyse">
<div class="lab">Absolues</div><p>AVC hémorragique ou d’origine inconnue à n’importe quel moment ; AVC ischémique dans les 6 mois ; lésion, tumeur ou malformation du système nerveux central ; traumatisme majeur, chirurgie ou traumatisme crânien récents (dans le mois) ; hémorragie digestive dans le mois ; trouble connu de l’hémostase (hors menstruations) ; dissection aortique ; ponction non compressible dans les 24 heures (biopsie hépatique, ponction lombaire).</p>
<div class="lab">Relatives</div><p>Accident ischémique transitoire dans les 6 mois ; anticoagulation orale ; grossesse ou première semaine du post-partum ; hypertension réfractaire (PAS &gt; 180 mmHg ou diastolique &gt; 110 mmHg) ; hépatopathie avancée ; endocardite infectieuse ; ulcère gastroduodénal actif ; réanimation prolongée ou traumatique.</p>
<div class="lab">Source</div><p>ESC 2023 (reprise des recommandations STEMI 2017).</p>
<div class="lab">Information professionnelle suisse (Metalyse®)</div><p>Elle classe parmi les <b>contre-indications</b> plusieurs situations que l’ESC tient pour relatives : anticoagulant oral efficace (INR &gt; 1,3), hypertension artérielle sévère non contrôlée, endocardite bactérienne ou péricardite, ulcère gastroduodénal évolutif, pancréatite aiguë, accouchement, insuffisance hépatique sévère, hémorragie sévère dans les 6 derniers mois, chirurgie majeure, biopsie d’organe ou traumatisme sévère dans les 2 derniers mois. Pour la prescription en Suisse, l’information professionnelle approuvée par Swissmedic s’applique.</p></template>

<template data-pop="i21-sauvetage" data-title="Échec de la fibrinolyse et angioplastie de sauvetage">
<div class="lab">Critères d’échec à 60–90 minutes</div><p>Résolution du sus-décalage inférieure à 50 % dans la dérivation où il était maximal ; douleur persistante ; instabilité hémodynamique ou électrique.</p>
<div class="lab">Conduite</div><p>Angioplastie de sauvetage immédiate (ESC 2023).</p>
<div class="lab">Succès</div><p>Coronarographie entre 2 et 24 heures (stratégie pharmaco-invasive), car la réocclusion est fréquente.</p></template>

<template data-pop="i21-complete" data-title="Revascularisation complète">
<div class="lab">Principe</div><p>Traiter aussi les sténoses significatives des artères non coupables chez le patient stable.</p>
<div class="lab">Preuves</div><p>Essai COMPLETE (2019) : réduction des décès cardiovasculaires et des infarctus. Essai FIRE (2023) : chez les plus de 75 ans, revascularisation complète guidée par la physiologie, réduction des événements à un an.</p>
<div class="lab">Recommandation ESC 2023</div><p>Revascularisation fonctionnelle complète des lésions pluritronculaires, pendant la procédure initiale ou de façon étagée. Dans le choc cardiogénique : artère coupable seulement pendant la procédure initiale (essai CULPRIT-SHOCK).</p></template>

<template data-pop="i21-dapt" data-title="Double antiagrégation plaquettaire : stratégies et durées">
<div class="lab">Par défaut</div><p>12 mois d’acide acétylsalicylique et de prasugrel ou ticagrélor, quel que soit le type de stent (ESC 2023, recommandé ; essais TRITON-TIMI 38 et PLATO, supériorité sur le clopidogrel).</p>
<div class="lab">Alternatives validées (ESC 2023)</div><p>Monothérapie après 3 à 6 mois si pas de haut risque ischémique (IIa) ; désescalade vers le clopidogrel, jamais dans les 30 premiers jours (III) ; monothérapie après 1 mois si haut risque hémorragique (IIb) ; prolongation au-delà de 12 mois si risque ischémique accru sans haut risque hémorragique (ESC 2024, syndromes coronariens chroniques, IIa).</p>
<div class="lab">Haut risque ischémique</div><p>Coronaropathie pluritronculaire diffuse, diabète traité, insuffisance rénale chronique, infarctus récidivant, maladie artérielle périphérique, thrombose de stent antérieure, angioplastie complexe.</p>
<div class="lab">Traitement médical sans stent</div><p>La double antiagrégation reste indiquée après un SCA traité médicalement ; le ticagrélor ou le clopidogrel sont utilisés.</p></template>

<template data-pop="i21-desesc" data-title="Désescalade de l’inhibiteur P2Y12">
<div class="lab">Principe</div><p>Remplacer le prasugrel ou le ticagrélor par le clopidogrel, ou réduire la dose, après la phase à haut risque thrombotique, pour réduire les hémorragies.</p>
<div class="lab">Modalités</div><p>Non guidée (essai TALOS-AMI : passage au clopidogrel à un mois) ; guidée par un test de fonction plaquettaire (essai TROPICAL-ACS) ou par le génotype du CYP2C19 (essai POPular Genetics).</p>
<div class="lab">Statut ESC 2023</div><p>Alternative pour réduire les hémorragies, qui ne doit pas devenir la stratégie par défaut ; non recommandée dans les 30 premiers jours (classe III).</p></template>

<template data-pop="i21-triple" data-title="Triple thérapie et fibrillation auriculaire">
<div class="lab">Schéma ESC 2023</div><p>Anticoagulant oral direct de préférence à un antivitamine K. Triple thérapie (anticoagulant, clopidogrel, acide acétylsalicylique) jusqu’à une semaine par défaut, jusqu’à un mois si le risque ischémique est élevé. Puis anticoagulant à la dose de prévention de l’AVC et clopidogrel jusqu’à 12 mois. Puis anticoagulant seul chez la plupart des patients (essai AFIRE). Doses suisses : rivaroxaban 15 mg/jour envisageable pendant l’association à un inhibiteur P2Y12, 10 mg si clairance 30–49 mL/min (Xarelto®) ; dabigatran 110 mg deux fois par jour envisageable si le risque hémorragique est accru (Pradaxa®).</p>
<div class="lab">Preuve</div><p>Essai AUGUSTUS : l’apixaban cause moins d’hémorragies qu’un antivitamine K, et l’acide acétylsalicylique ajouté augmente les hémorragies.</p>
<div class="lab">Règles</div><p>Pas de prasugrel ni de ticagrélor en triple thérapie ; inhibiteur de la pompe à protons ; dose d’anticoagulant validée pour la fibrillation auriculaire, sans réduction injustifiée.</p></template>

<template data-pop="i21-minoca" data-title="MINOCA : bilan en étapes">
<div class="lab">Définition</div><p>Infarctus (critères universels) avec coronaires sans sténose ≥ 50 % et sans autre cause évidente. Depuis la 5e définition (2026), le « I » désigne la lésion (injury) : c’est un diagnostic de travail.</p>
<div class="lab">Étapes</div><p>1. Relire la coronarographie (occlusion de branche, dissection méconnue). 2. Échocardiographie. 3. IRM cardiaque, particulièrement utile pour établir le diagnostic (ESC 2023). 4. Selon l’orientation : imagerie endocoronaire (OCT, IVUS), test de provocation du spasme, recherche de thrombophilie ou d’embolie paradoxale.</p>
<div class="lab">Causes coronaires</div><p>Plaque rompue ou érodée non obstructive, dissection spontanée, spasme, dysfonction microvasculaire, embolie.</p>
<div class="lab">Causes non coronaires</div><p>Myocardite, cardiomyopathie de stress, autres cardiomyopathies ; ces diagnostics sortent du cadre de l’infarctus.</p>
<div class="lab">Traitement</div><p>Celui de la cause. Si une plaque est en cause : même prévention secondaire qu’un infarctus.</p></template>

<template data-pop="i21-takotsubo" data-title="Cardiomyopathie de stress (Tako-tsubo)">
<div class="lab">Tableau</div><p>Femme ménopausée dans environ 90 % des cas ; déclencheur émotionnel ou physique (chirurgie, infection) ; douleur, sus-décalage ou ondes T négatives profondes, allongement du QT ; troponine modérée ; NT-proBNP très élevé.</p>
<div class="lab">Imagerie</div><p>Ballonisation apicale typique (formes médioventriculaire, basale ou focale possibles), débordant d’un territoire coronaire ; coronaires sans lésion aiguë ; IRM sans rehaussement tardif significatif.</p>
<div class="lab">Complications</div><p>Choc, obstruction de la chambre de chasse ventriculaire gauche (éviter les inotropes et les vasodilatateurs), thrombus apical, torsades de pointes, rupture.</p>
<div class="lab">Évolution</div><p>Récupération de la fonction en quelques semaines ; récidive possible. Mortalité hospitalière comparable à celle du SCA dans les registres.</p></template>

<template data-pop="i21-scad" data-title="Dissection coronaire spontanée (SCAD)">
<div class="lab">Mécanisme</div><p>Hématome intramural ou déchirure intimale, sans athérosclérose, qui comprime la vraie lumière.</p>
<div class="lab">Terrain</div><p>Femme jeune ou d’âge moyen, grossesse et post-partum, dysplasie fibromusculaire (à rechercher par imagerie vasculaire), effort ou stress intense, maladies du tissu conjonctif.</p>
<div class="lab">Diagnostic</div><p>Coronarographie : rétrécissement long et lisse, dissection visible ; OCT en cas de doute (avec prudence).</p>
<div class="lab">Traitement</div><p>Conservateur si le patient est stable et le flux conservé : la dissection cicatrise en quelques semaines ; l’angioplastie a un taux d’échec élevé. Revascularisation si ischémie persistante, instabilité ou atteinte du tronc commun. Bêtabloquant souvent proposé ; place de la double antiagrégation discutée.</p></template>

<template data-pop="i21-spasme" data-title="Vasospasme coronaire">
<div class="lab">Tableau</div><p>Douleurs de repos, souvent nocturnes ou matinales, avec sus-décalage transitoire ; fumeur, sujet plus jeune ; cocaïne, triptans, froid.</p>
<div class="lab">Diagnostic</div><p>Test de provocation intracoronaire à l’acétylcholine en salle de cathétérisme.</p>
<div class="lab">Traitement</div><p>Inhibiteur calcique (diltiazem, vérapamil ou dihydropyridine de longue durée d’action), dérivés nitrés de longue durée d’action, arrêt du tabac ; éviter les bêtabloquants non sélectifs, qui peuvent aggraver le spasme.</p></template>

<template data-pop="i21-rupture" data-title="Rupture de la paroi libre">
<div class="lab">Terrain</div><p>Premier infarctus transmural, sujet âgé, femme, hypertension, reperfusion tardive ou absente ; corticoïdes ou AINS à la phase aiguë.</p>
<div class="lab">Formes</div><p><b>Aiguë</b> : tamponnade brutale, activité électrique sans pouls, décès habituel. <b>Subaiguë</b> : douleur, hypotension, épanchement croissant contenant des échos (caillot). <b>Faux anévrisme</b> : rupture contenue par le péricarde, collet étroit, risque de rupture secondaire.</p>
<div class="lab">Conduite</div><p>Échocardiographie ; péricardiocentèse de sauvetage en attendant la chirurgie urgente.</p></template>

<template data-pop="i21-civ" data-title="Communication interventriculaire post-infarctus">
<div class="lab">Fréquence</div><p>Environ 0,2 à 0,3 % des infarctus à l’ère de l’angioplastie primaire ; plus fréquente en cas de reperfusion tardive.</p>
<div class="lab">Clinique</div><p>Souffle holosystolique rude parasternal gauche, frémissement ; insuffisance cardiaque droite et gauche ; choc.</p>
<div class="lab">Diagnostic</div><p>Échocardiographie avec Doppler couleur ; au cathétérisme droit, saut d’oxymétrie entre l’oreillette droite et l’artère pulmonaire.</p>
<div class="lab">Localisation</div><p>Infarctus antérieur : septum apical, défaut souvent simple. Infarctus inférieur : septum basal, défaut plus complexe, pronostic plus sombre.</p>
<div class="lab">Traitement</div><p>Assistance circulatoire temporaire ; fermeture chirurgicale ou percutanée en équipe ; le moment optimal est débattu.</p></template>

<template data-pop="i21-pilier" data-title="Rupture de pilier et insuffisance mitrale aiguë">
<div class="lab">Anatomie</div><p>Le pilier postéromédial, vascularisé par une seule artère (interventriculaire postérieure), se rompt beaucoup plus souvent que l’antérolatéral.</p>
<div class="lab">Clinique</div><p>Œdème pulmonaire brutal, choc ; souffle parfois absent ; FEVG souvent conservée.</p>
<div class="lab">Diagnostic</div><p>Échocardiographie transthoracique puis transœsophagienne : feuillet flottant, tête de pilier mobile dans l’oreillette.</p>
<div class="lab">Traitement</div><p>Chirurgie urgente (remplacement le plus souvent) ; stabilisation par vasodilatateurs, diurétiques, assistance circulatoire.</p></template>

<template data-pop="i21-thrombus" data-title="Thrombus ventriculaire gauche">
<div class="lab">Terrain</div><p>Infarctus antérieur étendu avec akinésie apicale, FEVG basse, reperfusion tardive ; survient surtout dans les deux premières semaines.</p>
<div class="lab">Diagnostic</div><p>Échocardiographie, avec produit de contraste si l’apex est mal visualisé ; IRM plus sensible.</p>
<div class="lab">Traitement</div><p>Anticoagulation orale associée aux antiagrégants ; l’anticoagulant parentéral se poursuit après l’angioplastie lorsqu’un thrombus ventriculaire est confirmé (ESC 2023). L’IRM est l’examen de référence pour le thrombus ventriculaire gauche (ESC 2023). La durée de l’anticoagulation, guidée par l’imagerie de contrôle, figure dans un tableau de recommandations de l’ESC 2023 non relu en texte : elle se décide avec le cardiologue.</p></template>

<template data-pop="i21-arythmie" data-title="Arythmies ventriculaires après un infarctus">
<div class="lab">Précoces (&lt; 48 heures)</div><p>Fibrillation ou tachycardie ventriculaire liées à l’ischémie aiguë et à la reperfusion. Traitement : choc électrique, revascularisation, bêtabloquant, correction de la kaliémie et de la magnésémie ; amiodarone si récidive. Elles n’imposent pas à elles seules un défibrillateur.</p>
<div class="lab">Tardives</div><p>Tachycardie ventriculaire monomorphe par réentrée autour de la cicatrice. Bilan de l’ischémie résiduelle et de la FEVG ; défibrillateur en prévention secondaire en l’absence de cause réversible.</p>
<div class="lab">Prévention primaire</div><p>FEVG ≤ 35 % malgré au moins 3 mois de traitement optimal, et au moins 6 semaines (40 jours) après l’infarctus (ESC 2022, arythmies ventriculaires) ; la réévaluation échographique a lieu entre 6 et 12 semaines. Voir la fiche <button class="w" data-k="i21-dai">défibrillateur implantable</button>.</p></template>

<template data-pop="i21-bav" data-title="Blocs auriculoventriculaires de l’infarctus">
<div class="lab">Infarctus inférieur</div><p>Bloc nodal (ischémie du nœud, tonus vagal) : échappement à QRS fin, fréquence 40–60/min, souvent bien toléré, sensible à l’atropine, régressif en quelques jours.</p>
<div class="lab">Infarctus antérieur</div><p>Bloc infranodal par nécrose septale étendue : échappement à QRS large, lent, instable ; témoin d’un infarctus massif, pronostic sombre ; stimulation temporaire.</p>
<div class="lab">Stimulation définitive</div><p>Si le bloc de haut degré persiste au-delà d’un délai d’attente d’au moins 5 jours (ESC 2021, stimulation cardiaque).</p></template>

<template data-pop="i21-pericard" data-title="Péricardite post-infarctus et syndrome de Dressler">
<div class="lab">Péricardite précoce</div><p>Premiers jours d’un infarctus transmural, par contiguïté inflammatoire ; frottement, douleur modifiée par la position ; devenue rare avec la reperfusion précoce.</p>
<div class="lab">Syndrome de Dressler</div><p>Péricardite, parfois pleurésie, d’origine immunologique, une à plusieurs semaines après l’infarctus ; fièvre, protéine C réactive élevée.</p>
<div class="lab">Traitement</div><p>Acide acétylsalicylique à dose anti-inflammatoire et colchicine ; éviter les autres AINS et les corticoïdes, qui gênent la cicatrisation.</p>
<div class="lab">Piège</div><p>Un épanchement croissant, surtout sous anticoagulant, doit faire éliminer une rupture subaiguë.</p></template>

<template data-pop="i21-mnemo-meca" data-title="Les trois ruptures (aide pédagogique)">
<div class="lab">Aide pédagogique, non critère officiel</div><p><b>« Tamponnade, shunt, œdème »</b> : la paroi libre donne une tamponnade ; le septum un shunt avec souffle et frémissement ; le pilier un œdème pulmonaire, parfois sans souffle.</p>
<div class="lab">Fenêtre commune</div><p>Premier au septième jour, pendant la détersion macrophagique ; plus tôt chez une partie des patients reperfusés.</p>
<div class="lab">Terrain commun</div><p>Premier infarctus, sujet âgé, femme, reperfusion tardive ou absente.</p>
<div class="lab">Examen commun</div><p>Échocardiographie immédiate ; chirurgie en urgence, souvent après une assistance circulatoire.</p></template>

<template data-pop="i21-readapt" data-title="Réadaptation cardiaque">
<div class="lab">Contenu</div><p>Entraînement physique supervisé et progressif (endurance et renforcement) ; éducation thérapeutique ; sevrage tabagique ; nutrition ; optimisation et adhésion au traitement ; soutien psychologique et repérage de l’anxiété et de la dépression ; préparation du retour au travail.</p>
<div class="lab">Phases</div><p>Mobilisation hospitalière précoce ; programme structuré après la sortie, ambulatoire ou stationnaire ; maintien au long cours de l’activité physique.</p>
<div class="lab">Bénéfices</div><p>Réduction de la mortalité cardiovasculaire et des réhospitalisations, amélioration de la capacité d’effort et de la qualité de vie.</p>
<div class="lab">Recommandations</div><p>Recommandée après un SCA. Premières recommandations ESC dédiées le 28 août 2026, qui réunissent les indications et les étendent (remplacement valvulaire aortique, fibrillation auriculaire, cardiopathies congénitales, traitements anticancéreux cardiotoxiques).</p>
<div class="lab">En Suisse</div><p>Phase II en programme ambulatoire ou stationnaire, dans un centre répondant aux critères de qualité du groupe de travail SCPRS de la Société suisse de cardiologie ; ces critères conditionnent la prise en charge par l’assurance obligatoire (OPAS, annexe 1, chapitre 11). Phase III dans les groupes cardiaques de la Fondation suisse de cardiologie. Moins de la moitié des patients suisses participent à un programme après un infarctus (<i>Revue médicale suisse</i>, 2021).</p>
<div class="lab">Erreur fréquente</div><p>Ne pas prescrire la réadaptation aux femmes et aux sujets âgés, qui en bénéficient autant et y sont moins souvent adressés.</p></template>

<template data-pop="i21-travail" data-title="Retour au travail après un SCA">
<div class="lab">Déterminants</div><p>Charge physique et psychique du poste ; FEVG ; ischémie résiduelle ; arythmies ; capacité d’effort mesurée ; état psychologique ; exigences réglementaires (conduite professionnelle, travail de nuit, travail en hauteur).</p>
<div class="lab">Démarche</div><p>Discussion dès l’hospitalisation ; épreuve d’effort en fin de réadaptation ; reprise progressive (temps partiel thérapeutique) ; lien avec le médecin du travail si le poste est physique.</p>
<div class="lab">Contexte suisse</div><p>Le certificat d’incapacité de travail est établi par le médecin traitant ou le cardiologue. En cas d’incapacité prolongée, la détection précoce de l’assurance-invalidité peut soutenir le maintien en emploi.</p>
<div class="lab">Lacune documentaire</div><p>Aucune directive suisse ne fixe de délais chiffrés de reprise après un SCA ; la décision est individuelle.</p></template>

<template data-pop="i21-conduite" data-title="Aptitude à la conduite après un SCA (Suisse)">
<div class="lab">Référence</div><p>Directives communes de la Société suisse de cardiologie et de la Société suisse de médecine légale, « Aptitude à la conduite et maladies cardiovasculaires », 2e édition, octobre 2024.</p>
<div class="lab">Premier groupe (permis privés)</div><p>Après un SCA, traité de façon conservatrice ou invasive : apte après un délai d’une semaine en l’absence de troubles au repos (pas de classe IV de la classification canadienne). Après une angioplastie élective : apte. Après un pontage : apte après une convalescence réussie.</p>
<div class="lab">Deuxième groupe (conducteurs professionnels)</div><p>Après un SCA (infarctus de type 1 ou 2, MINOCA, cardiomyopathie de Tako-tsubo) : apte si classe NYHA I ou II, FEVG &gt; 35 % et épreuve d’effort « normale plus » (pas d’angor, pas d’arythmie notable, capacité &gt; 4 METs ; ECG pathologique confirmé par une imagerie de l’ischémie), après un délai de quatre semaines. Après un pontage : mêmes conditions, délai de trois mois.</p>
<div class="lab">Autres situations</div><p>FEVG réduite, arythmies, syncope et défibrillateur ont leurs propres règles dans les mêmes directives.</p>
<div class="lab">Devoir du médecin</div><p>Informer le patient de son inaptitude temporaire et le consigner au dossier. La loi fédérale sur la circulation routière autorise le médecin à signaler à l’autorité cantonale un patient qui met en danger la circulation.</p></template>
