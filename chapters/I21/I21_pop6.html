
<!-- ===== FENÊTRES I21 : fiches transversales adaptées au SCA ===== -->
<template data-pop="i21-choc" data-title="Choc cardiogénique de l’infarctus">
<div class="lab">Définition</div><p>Hypoperfusion d’organes due à une défaillance cardiaque : PAS &lt; 90 mmHg pendant plus de 30 minutes ou besoin de vasopresseur, avec signes d’hypoperfusion (marbrures, oligurie, confusion, lactate &gt; 2 mmol/L) ; index cardiaque &lt; 2,2 L/min/m² avec pressions de remplissage élevées.</p>
<div class="lab">Stades SCAI</div><p><b>A</b> — à risque ; <b>B</b> — début, hypotension ou tachycardie sans hypoperfusion ; <b>C</b> — classique, hypoperfusion nécessitant un traitement ; <b>D</b> — aggravation malgré le traitement ; <b>E</b> — extrême, arrêt circulatoire ou réanimation en cours.</p>
<div class="lab">Causes dans le SCA</div><p>Perte massive de myocarde (le plus souvent infarctus antérieur étendu ou atteinte du tronc commun) ; infarctus du ventricule droit ; complication mécanique ; arythmie ; effet d’un traitement (bêtabloquant, nitré, opiacé).</p>
<div class="lab">Conduite</div><p>Coronarographie immédiate et angioplastie de l’artère coupable seule (CULPRIT-SHOCK) ; échocardiographie pour exclure une complication mécanique ; noradrénaline en premier vasopresseur, dobutamine si bas débit ; pas de ballon de contre-pulsion de routine (IABP-SHOCK II) ; assistance circulatoire temporaire en centre expert chez des patients sélectionnés (DanGer Shock).</p></template>

<template data-pop="i21-d-arm" data-title="Éplérénone et antagonistes minéralocorticoïdes après un infarctus">
<div class="lab">Mécanisme</div><p>Blocage du récepteur minéralocorticoïde : natriurèse, limitation de la fibrose et du remodelage. L’éplérénone est plus sélective que la spironolactone (pas de gynécomastie).</p>
<div class="lab">Preuve</div><p>Essai EPHESUS (2003) : débutée 3 à 14 jours après un infarctus avec FEVG ≤ 40 % et insuffisance cardiaque ou diabète, réduction de la mortalité totale et de la mort subite.</p>
<div class="lab">Statut suisse</div><p>Information professionnelle suisse (Inspra®) : indiquée en complément du traitement standard, bêtabloquant compris, chez le patient stable avec FEVG ≤ 40 % et signes cliniques d’insuffisance cardiaque après un infarctus récent ; début 3 à 14 jours après l’événement, 25 mg/jour puis 50 mg/jour en 4 semaines selon la kaliémie ; contre-indiquée si kaliémie &gt; 5,0 mmol/L, DFG estimé &lt; 30 mL/min/1,73 m² ou Child-Pugh C. Le diabète seul, inclus dans EPHESUS, ne figure pas dans l’indication suisse.</p>
<div class="lab">Posologie</div><p>25 mg/jour, puis 50 mg/jour après 4 semaines si la kaliémie le permet.</p>
<div class="lab">Précautions</div><p>Ne pas débuter si K⁺ &gt; 5,0 mmol/L ou DFG &lt; 30 mL/min/1,73 m² ; kaliémie et créatinine à 1 semaine, 1 mois, puis régulièrement ; contre-indiquée avec les inhibiteurs puissants du CYP3A4.</p></template>

<template data-pop="i21-dai" data-title="Défibrillateur implantable après un infarctus">
<div class="lab">Prévention secondaire</div><p>Fibrillation ou tachycardie ventriculaire mal tolérée survenant au-delà de 48 heures après l’infarctus, sans cause réversible.</p>
<div class="lab">Prévention primaire</div><p>FEVG ≤ 35 % malgré au moins 3 mois de traitement optimal, et au moins 6 semaines après l’infarctus, en classe NYHA II ou III, avec une espérance de vie d’au moins un an en bon état fonctionnel (ESC 2023, classe I, niveau A) ; la réévaluation échographique a lieu entre 6 et 12 semaines.</p>
<div class="lab">Pourquoi attendre</div><p>La FEVG remonte souvent après reperfusion et sous traitement (sidération, remodelage inverse). Les essais d’implantation précoce n’ont pas réduit la mortalité totale.</p>
<div class="lab">Situations particulières</div><p>Une fibrillation ventriculaire des 48 premières heures n’impose pas à elle seule un défibrillateur. Le défibrillateur portable peut couvrir la période d’attente chez des patients choisis.</p></template>

<template data-pop="i21-e-b3" data-title="Troisième bruit (B3) dans l’infarctus">
<div class="lab">Technique</div><p>Décubitus latéral gauche, stéthoscope en cloche à la pointe ; bruit sourd, grave, juste après le deuxième bruit.</p>
<div class="lab">Mécanisme</div><p>Décélération brutale du remplissage ventriculaire rapide dans un ventricule dont la pression de remplissage est élevée.</p>
<div class="lab">Valeur</div><p>Signe de dysfonction ventriculaire gauche ; il classe le patient en Killip II au moins. Très spécifique, peu sensible. Le quatrième bruit, présystolique, traduit la rigidité du ventricule ischémique et est fréquent sans insuffisance cardiaque.</p></template>

<template data-pop="i21-e-crep" data-title="Crépitants pulmonaires et classe de Killip">
<div class="lab">Technique</div><p>Auscultation des bases puis des champs moyens et supérieurs, patient assis si possible ; faire tousser pour distinguer les bruits d’encombrement.</p>
<div class="lab">Lecture dans le SCA</div><p>Crépitants limités aux bases (moins de la moitié des champs) : Killip II ; au-delà de la moitié, œdème pulmonaire : Killip III.</p>
<div class="lab">Pièges</div><p>Bronchopneumopathie ou fibrose antérieures ; inhalation après un arrêt cardiaque ; un œdème pulmonaire brutal avec FEVG conservée doit faire chercher une insuffisance mitrale aiguë.</p></template>

<template data-pop="i21-echo" data-title="Échocardiographie dans le SCA">
<div class="lab">Question clinique</div><p>Existe-t-il un trouble segmentaire, quelle est la FEVG, y a-t-il une complication ou un autre diagnostic ?</p>
<div class="lab">Principe</div><p>Imagerie bidimensionnelle de l’épaississement systolique par segment (17 segments) ; Doppler couleur pour les régurgitations et les shunts ; produit de contraste échographique si l’endocarde est mal visualisé.</p>
<div class="lab">Moments</div><p>Immédiate en cas d’instabilité, de souffle nouveau ou de doute diagnostique, sans retarder la coronarographie ; systématique avant la sortie ; répétée à 6–12 semaines si FEVG ≤ 40 %.</p>
<div class="lab">Différentiels</div><p>Épanchement péricardique (tamponnade, dissection), dilatation du ventricule droit (embolie pulmonaire), flap intimal aortique, akinésie débordant un territoire (cardiomyopathie de stress).</p>
<div class="lab">Limites</div><p>Échogénicité ; un trouble segmentaire n’est pas daté ; variabilité de la FEVG de ± 5 à 10 points.</p></template>

<template data-pop="i21-irm" data-title="IRM cardiaque après un SCA">
<div class="lab">Question clinique</div><p>Nécrose ou autre lésion ? Viabilité ? Cause d’un MINOCA ?</p>
<div class="lab">Séquences</div><p>Ciné (volumes, FEVG de référence) ; T2 (œdème : lésion récente) ; rehaussement tardif au gadolinium (nécrose, fibrose) ; premier passage (perfusion) ; cartographies T1.</p>
<div class="lab">Lecture</div><p>Rehaussement sous-endocardique ou transmural dans un territoire coronaire : infarctus. Sous-épicardique ou intramyocardique : myocardite. Absence de rehaussement avec œdème apical : cardiomyopathie de stress. Obstruction microvasculaire : no-reflow, pronostic péjoratif. Rehaussement &lt; 50 % de l’épaisseur : segment viable.</p>
<div class="lab">Contre-indications et limites</div><p>Certains dispositifs implantés ; claustrophobie ; DFG &lt; 30 mL/min/1,73 m² : agent macrocyclique à dose minimale ; arythmie.</p></template>

<template data-pop="i21-laplace" data-title="Loi de Laplace et besoins en oxygène">
<p>Tension pariétale σ = P × r / (2 × h) : P pression intraventriculaire, r rayon, h épaisseur de paroi.</p>
<div class="lab">Déductions dans le SCA</div><p>Une poussée hypertensive (P ↑) ou une dilatation (r ↑) augmentent la tension pariétale et les besoins en oxygène. Les dérivés nitrés, en réduisant la précharge, diminuent r et soulagent l’ischémie. Après l’infarctus, la zone amincie (h ↓) et dilatée subit une contrainte accrue, qui entretient le remodelage et l’expansion de l’infarctus.</p></template>

<template data-pop="i21-remodel" data-title="Remodelage après un infarctus">
<div class="lab">Phase précoce</div><p>Expansion de l’infarctus : la zone nécrosée s’amincit et s’allonge pendant les premiers jours, surtout dans les grands infarctus antérieurs.</p>
<div class="lab">Phase tardive</div><p>Hypertrophie et dilatation du myocarde sain, fibrose interstitielle, forme plus sphérique ; activation du système rénine-angiotensine-aldostérone et du système sympathique.</p>
<div class="lab">Conséquences</div><p>Insuffisance cardiaque, insuffisance mitrale secondaire, anévrisme, tachycardies ventriculaires.</p>
<div class="lab">Prévention</div><p>Reperfusion précoce (moins de nécrose), IEC, bêtabloquant et éplérénone lorsque la FEVG est réduite.</p></template>

<template data-pop="i21-sarcomere" data-title="Complexe troponine et sarcomère">
<p>Sur le filament fin, le complexe troponine régule l’interaction actine-myosine : la troponine C fixe le calcium, la troponine I inhibe l’interaction au repos, la troponine T ancre le complexe à la tropomyosine.</p>
<div class="lab">Isoformes</div><p>Les isoformes cardiaques des troponines T et I diffèrent des isoformes squelettiques : c’est la base de la spécificité cardiaque des dosages. La troponine C est commune au cœur et au muscle lent, d’où l’absence de dosage clinique.</p>
<div class="lab">Libération</div><p>Une petite fraction cytosolique libre sort vite lors d’une lésion ; la fraction liée se libère lentement pendant la dégradation des myofibrilles, d’où une élévation prolongée de plusieurs jours.</p></template>
