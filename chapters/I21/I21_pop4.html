
<!-- ===== FENÊTRES I21 : monographies ===== -->
<template data-pop="i21-d-asa" data-title="Acide acétylsalicylique">
<div class="lab">Mécanisme</div><p>Acétylation irréversible de la cyclo-oxygénase 1 plaquettaire : arrêt de la synthèse du thromboxane (TXA₂) pour toute la durée de vie de la plaquette (7 à 10 jours).</p>
<div class="lab">Preuves</div><p>Essai ISIS-2 (1988) : réduction d’environ un quart de la mortalité vasculaire à 5 semaines dans l’infarctus, effet additif à la fibrinolyse.</p>
<div class="lab">Posologie</div><p>ESC 2023 : charge de 150–300 mg par voie orale (comprimé croqué ou non entérosoluble) ou de 75–250 mg par voie intraveineuse ; entretien 75–100 mg/jour. Information professionnelle suisse (Aspirine Cardio®) : 200–300 mg par voie intraveineuse ou par voie orale sous forme non gastro-résistante écrasée ou croquée, puis 100 mg/jour dès le 2e jour.</p>
<div class="lab">Effets indésirables</div><p>Hémorragies digestives, ulcère ; asthme induit par l’aspirine ; réactions d’hypersensibilité (désensibilisation possible en centre spécialisé).</p>
<div class="lab">Contre-indications</div><p>Hémorragie active, allergie vraie, ulcère actif. Une allergie alléguée doit être explorée plutôt qu’acceptée.</p>
<div class="lab">Surveillance</div><p>Hémoglobine, signes d’hémorragie digestive ; protection gastrique selon le risque.</p></template>

<template data-pop="i21-d-p2y12" data-title="Inhibiteurs du récepteur P2Y12">
<div class="lab">Clopidogrel</div><p>Thiénopyridine, promédicament activé en deux étapes hépatiques (dont le CYP2C19) ; blocage irréversible ; réponse variable. Essai CURE (2001) dans le NSTE-ACS. Charge 300–600 mg (ESC 2023) ; l’information professionnelle suisse (Plavix®) prévoit 300 mg dans le NSTE-ACS, 75 mg avec ou sans charge après fibrinolyse ; entretien 75 mg/jour.</p>
<div class="lab">Prasugrel</div><p>Thiénopyridine activée en une étape, effet plus rapide et plus constant ; irréversible. Essai TRITON-TIMI 38 (2007) : moins d’événements ischémiques que le clopidogrel, plus d’hémorragies ; contre-indiqué après AVC ou accident ischémique transitoire. Charge 60 mg, entretien 10 mg/jour, 5 mg si poids &lt; 60 kg ; à 75 ans et plus, en général non recommandé, 5 mg si jugé nécessaire ; contre-indiqué en Child-Pugh C (Efient®).</p>
<div class="lab">Ticagrélor</div><p>Triazolopyrimidine à action directe et réversible. Essai PLATO (2009) : réduction des événements et de la mortalité par rapport au clopidogrel. Charge 180 mg, entretien 90 mg × 2/jour, sans adaptation rénale. Effets propres : dyspnée (13,8 % dans PLATO), pauses ventriculaires ≥ 3 secondes plus fréquentes en phase aiguë (6,0 % contre 3,5 % sous clopidogrel), hyperuricémie (Brilique®).</p>
<div class="lab">Comparaison</div><p>Essai ISAR-REACT 5 (2019) : chez les patients avec SCA et stratégie invasive, le prasugrel a réduit le critère décès, infarctus ou AVC par rapport au ticagrélor, sans plus d’hémorragies.</p>
<div class="lab">Cangrélor</div><p>Inhibiteur intraveineux réversible, d’action et de fin d’action rapides (quelques minutes) ; utile chez le patient non prétraité en salle de cathétérisme, ou incapable d’avaler.</p>
<div class="lab">Arrêt avant chirurgie</div><p>Information professionnelle suisse : 7 jours avant une intervention programmée pour les trois molécules ; avant un pontage, le saignement augmente si le ticagrélor est arrêté moins de 96 heures avant, et n’augmente pas si le clopidogrel est arrêté plus de 5 jours avant. Voir la fenêtre <button class="w" data-k="i21-arb-arret">arbitrage des délais</button>.</p>
<div class="lab">Surveillance</div><p>Hémorragies, observance (arrêt prématuré = risque de thrombose de stent), hémogramme.</p></template>

<template data-pop="i21-d-hep" data-title="Anticoagulants parentéraux">
<div class="lab">Héparine non fractionnée</div><p>Potentialise l’antithrombine contre la thrombine et le facteur Xa ; demi-vie courte, antidote (protamine), utilisable en insuffisance rénale ; surveillance par le temps de coagulation activé en salle ou le temps de céphaline activée. Risque de thrombopénie induite par l’héparine.</p>
<div class="lab">Énoxaparine</div><p>Héparine de bas poids moléculaire, surtout anti-Xa ; élimination rénale : dose réduite si clairance &lt; 30 mL/min. Alternative à l’HNF pendant l’angioplastie primaire (ESC 2023, classe IIa) et avec la fibrinolyse ; schéma suisse du STEMI dans l’information professionnelle Clexane® (onglet Pharmacologie).</p>
<div class="lab">Fondaparinux</div><p>Pentasaccharide anti-Xa sélectif. Essai OASIS-5 (2006) : efficacité comparable à l’énoxaparine dans le NSTE-ACS, moins d’hémorragies graves. Thrombose de cathéter lorsqu’il est utilisé seul pendant l’angioplastie : bolus d’HNF obligatoire. Contre-indiqué si clairance &lt; 20 mL/min.</p>
<div class="lab">Bivalirudine</div><p>Inhibiteur direct de la thrombine, demi-vie d’environ 25 minutes ; alternative à l’HNF pendant l’angioplastie primaire, avec perfusion prolongée après la procédure (ESC 2023, classe IIa). Aucune information professionnelle suisse n’a été trouvée dans l’AIPS au 08.10.2026.</p>
<div class="lab">Règle</div><p>Arrêt après l’angioplastie, sauf indication propre (thrombus ventriculaire, fibrillation auriculaire, prophylaxie).</p></template>

<template data-pop="i21-d-lyse" data-title="Ténectéplase">
<div class="lab">Mécanisme</div><p>Variant génétiquement modifié de l’activateur tissulaire du plasminogène : plus spécifique de la fibrine et plus résistant à son inhibiteur, ce qui permet un bolus unique.</p>
<div class="lab">Indication</div><p>STEMI de moins de 12 heures sans angioplastie primaire possible dans les 120 minutes suivant le diagnostic, en l’absence de contre-indication ; injection dans les 10 minutes, de préférence en préhospitalier.</p>
<div class="lab">Posologie</div><p>Bolus intraveineux unique selon le poids : 30 mg (&lt; 60 kg), 35 mg (60–69 kg), 40 mg (70–79 kg), 45 mg (80–89 kg), 50 mg (≥ 90 kg). Au-delà de 75 ans, la demi-dose a atténué l’excès d’hémorragies intracrâniennes dans l’essai STREAM (ESC 2023) ; l’information professionnelle suisse (Metalyse®) demande la prudence à 75 ans et plus sans prévoir de demi-dose, et contre-indique notamment l’anticoagulation orale efficace (INR &gt; 1,3). Toujours associée à l’acide acétylsalicylique, au clopidogrel et à l’énoxaparine ou à l’HNF.</p>
<div class="lab">Effets indésirables</div><p>Hémorragies, dont intracrâniennes (environ 1 %, davantage chez le sujet âgé, la femme de faible poids et l’hypertendu) ; réocclusion.</p>
<div class="lab">Surveillance</div><p>ECG et douleur à 60–90 minutes ; transfert vers un centre de cathétérisme dans tous les cas.</p></template>

<template data-pop="i21-d-bb" data-title="Bêtabloquants après un infarctus">
<div class="lab">Mécanisme</div><p>Réduction de la fréquence, de la contractilité et de la pression : baisse des besoins en oxygène ; allongement de la diastole ; effet antiarythmique ; limitation du remodelage.</p>
<div class="lab">Preuves historiques</div><p>Réduction de la mortalité après infarctus à l’ère préthrombolytique ; essai CAPRICORN (carvédilol, FEVG ≤ 40 %).</p>
<div class="lab">Preuves récentes (FEVG conservée)</div><p>REDUCE-AMI (2024, FEVG ≥ 50 %) et REBOOT (2025, FEVG &gt; 40 %) : pas de bénéfice sur le critère principal. BETAMI-DANBLOCK (2025, FEVG ≥ 40 %) : réduction du critère composite. Méta-analyse 2025 : bénéfice pour une FEVG de 40 à 49 %.</p>
<div class="lab">Recommandations</div><p>Après un SCA avec FEVG réduite, bénéfice soutenu par des preuves solides (ESC 2024). Phase aiguë : métoprolol intraveineux à envisager au moment de l’angioplastie primaire si pas d’insuffisance cardiaque et PAS &gt; 120 mmHg (ESC 2023, classe IIa) ; schéma suisse : trois bolus de 5 mg à 2 minutes d’intervalle (Beloc® i.v.).</p>
<div class="lab">Contre-indications</div><p>Insuffisance cardiaque aiguë, bas débit, choc, bloc auriculoventriculaire de haut degré non appareillé, bradycardie sévère, spasme coronaire, cocaïne à la phase aiguë.</p>
<div class="lab">Surveillance</div><p>Fréquence, pression, signes d’insuffisance cardiaque, fatigue, dépression, dysfonction érectile.</p></template>

<template data-pop="i21-d-iec" data-title="IEC et ARA II après un infarctus">
<div class="lab">Mécanisme</div><p>Blocage du système rénine-angiotensine : limitation du remodelage, baisse de la postcharge, effet néphroprotecteur.</p>
<div class="lab">Preuves</div><p>Essais SAVE (captopril), AIRE (ramipril), TRACE (trandolapril) chez les patients avec dysfonction ventriculaire ou insuffisance cardiaque après infarctus ; VALIANT : valsartan non inférieur au captopril.</p>
<div class="lab">Place</div><p>Indiqué si insuffisance cardiaque, FEVG ≤ 40 %, diabète, hypertension ou maladie rénale chronique. ARA II en cas d’intolérance. En Suisse, ramipril dès le 3e jour (Triatec®) et valsartan dès 12 heures après l’infarctus (Diovan®).</p>
<div class="lab">Effets indésirables</div><p>Toux (IEC), angiœdème, hypotension, hyperkaliémie, hausse de la créatinine.</p>
<div class="lab">Surveillance</div><p>Créatinine et kaliémie à 1–2 semaines de l’introduction et de chaque augmentation.</p></template>

<template data-pop="i21-d-nitres" data-title="Dérivés nitrés">
<div class="lab">Mécanisme</div><p>Libération de monoxyde d’azote, activation de la guanylate cyclase : vasodilatation veineuse (baisse de la précharge), puis artérielle et coronaire épicardique.</p>
<div class="lab">Usage</div><p>Soulagement de la douleur ischémique et de la congestion ; trinitrine sublinguale, 1 à 2 pulvérisations de 0,4 mg, répétables (Nitrolingual®) ; voie intraveineuse titrée en cas d’hypertension ou d’œdème pulmonaire. Pas d’effet démontré sur la survie.</p>
<div class="lab">Contre-indications</div><p>Selon l’information professionnelle suisse (Nitrolingual®) : PAS &lt; 90 mmHg, choc, cardiomyopathie hypertrophique obstructive, anémie sévère, hypertension intracrânienne, association aux inhibiteurs de la phosphodiestérase de type 5 ou au riociguat (24 heures après une prise de sildénafil). L’infarctus du ventricule droit est une contre-indication de fait, car le débit du ventricule droit dépend de la précharge.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, hypotension, tachycardie réflexe ; tolérance en cas d’usage continu.</p></template>

<template data-pop="i21-d-statine" data-title="Statines de haute intensité">
<div class="lab">Mécanisme</div><p>Inhibition de l’HMG-CoA réductase ; hausse des récepteurs LDLR hépatiques ; baisse du LDL d’environ 50 % à haute intensité ; effets sur la stabilisation des plaques.</p>
<div class="lab">Preuves</div><p>Essai PROVE-IT (2004) : après un SCA, l’atorvastatine 80 mg a réduit les événements davantage qu’un traitement moins intensif.</p>
<div class="lab">Posologie</div><p>Atorvastatine 40–80 mg/jour ou rosuvastatine 20–40 mg/jour (ESC/EAS), dès l’hospitalisation, quel que soit le LDL initial. Information professionnelle suisse : atorvastatine maximum 80 mg/jour (Sortis®) ; rosuvastatine 20 mg/jour en prévention cardiovasculaire, 40 mg seulement sous contrôle d’un spécialiste, contre-indiquée en insuffisance rénale sévère (Crestor®).</p>
<div class="lab">Effets indésirables</div><p>Symptômes musculaires (le plus souvent non causés par la statine dans les essais en aveugle), myopathie rare, rhabdomyolyse exceptionnelle ; élévation des transaminases ; léger risque de diabète, dépassé par le bénéfice.</p>
<div class="lab">Contre-indications</div><p>Hépatopathie active, grossesse et allaitement ; interactions (clarithromycine, ciclosporine, gemfibrozil).</p>
<div class="lab">Surveillance</div><p>Bilan lipidique à 4–6 semaines ; transaminases avant et après l’introduction ; créatine kinase seulement en cas de symptômes.</p></template>

<template data-pop="i21-d-ezet" data-title="Ézétimibe">
<div class="lab">Mécanisme</div><p>Inhibition du transporteur intestinal NPC1L1 : baisse de l’absorption du cholestérol, hausse compensatrice des récepteurs LDLR ; baisse supplémentaire du LDL de 21 à 27 % sous statine (ESC/EAS 2019).</p>
<div class="lab">Preuves</div><p>Essai IMPROVE-IT (2015) : après un SCA, l’ajout à la simvastatine a réduit modestement les événements cardiovasculaires.</p>
<div class="lab">Posologie</div><p>10 mg/jour, souvent en association fixe avec la statine.</p>
<div class="lab">Tolérance</div><p>Excellente ; troubles digestifs rares.</p>
<div class="lab">Contre-indications et surveillance</div><p>Hépatopathie active en association avec une statine ; bilan lipidique à 4–6 semaines.</p></template>

<template data-pop="i21-d-pcsk9" data-title="Inhibiteurs de PCSK9 et inclisiran">
<div class="lab">Mécanisme</div><p>Les anticorps monoclonaux (évolocumab, alirocumab) neutralisent la protéine PCSK9 circulante ; l’inclisiran, petit ARN interférent, en bloque la synthèse hépatique. Dans les deux cas, les récepteurs LDLR sont préservés ; baisse moyenne du LDL d’environ 60 % pour les anticorps (ESC/EAS 2019).</p>
<div class="lab">Preuves</div><p>Essais FOURIER (évolocumab) et ODYSSEY OUTCOMES (alirocumab, après un SCA) : réduction des événements cardiovasculaires.</p>
<div class="lab">Posologie</div><p>Évolocumab 140 mg toutes les 2 semaines ou 420 mg par mois ; alirocumab 75–150 mg toutes les 2 semaines ; inclisiran 284 mg au jour 0, à 3 mois, puis tous les 6 mois.</p>
<div class="lab">Place</div><p>LDL au-dessus de la cible malgré statine maximale tolérée et ézétimibe ; remboursement en Suisse soumis aux limitations de la liste des spécialités. L’information professionnelle suisse de l’inclisiran (Leqvio®) précise que son effet sur la morbidité et la mortalité cardiovasculaires n’est pas encore établi.</p>
<div class="lab">Tolérance</div><p>Réactions au point d’injection ; pas de toxicité musculaire.</p>
<div class="lab">Contre-indications et surveillance</div><p>Hypersensibilité au principe actif ; grossesse et allaitement déconseillés faute de données ; inclisiran avec prudence en insuffisance hépatique sévère. Bilan lipidique 4–12 semaines après l’introduction.</p></template>

<template data-pop="i21-d-bempe" data-title="Acide bempédoïque">
<div class="lab">Mécanisme</div><p>Inhibition de l’ATP-citrate lyase, en amont de l’HMG-CoA réductase. Promédicament activé dans le foie et non dans le muscle, d’où l’absence de toxicité musculaire.</p>
<div class="lab">Preuves</div><p>Essai CLEAR Outcomes (2023) : chez des patients intolérants aux statines, réduction des événements cardiovasculaires majeurs.</p>
<div class="lab">Place (ESC/EAS 2025)</div><p>Recommandé chez le patient qui ne peut pas prendre de statine (classe I) ; en complément si la cible n’est pas atteinte sous statine et ézétimibe (classe IIa ; mêmes classes dans l’ESC 2024 sur les syndromes coronariens chroniques).</p>
<div class="lab">Posologie et effets indésirables</div><p>180 mg/jour, seul ou associé à l’ézétimibe. Hyperuricémie et goutte, lithiase biliaire, baisse légère de la fonction rénale.</p>
<div class="lab">Contre-indications et surveillance</div><p>Contre-indiqué pendant la grossesse et l’allaitement, et avec la simvastatine &gt; 40 mg/jour ; surveiller l’acide urique et la créatinine.</p></template>

<template data-pop="i21-d-colch" data-title="Colchicine à faible dose">
<div class="lab">Mécanisme</div><p>Inhibition de la polymérisation de la tubuline dans les leucocytes ; réduction de l’activation de l’inflammasome NLRP3 et de la production d’interleukine 1β.</p>
<div class="lab">Preuves</div><p>Essai COLCOT (2019) : débutée dans les 30 jours d’un infarctus, réduction des événements ischémiques, surtout AVC et revascularisations urgentes. Essai LoDoCo2 (2020) : bénéfice dans la coronaropathie chronique. Essai CLEAR SYNERGY (2024) : débutée à la phase aiguë de l’infarctus, pas de bénéfice.</p>
<div class="lab">Recommandations</div><p>À envisager dans la coronaropathie athéroscléreuse chronique (ESC 2024, classe IIa). Statut suisse : <button class="w" data-k="i21-arb-colch">hors indication autorisée</button>.</p>
<div class="lab">Posologie</div><p>0,5 mg/jour.</p>
<div class="lab">Surveillance</div><p>Fonction rénale, troubles digestifs, interactions à chaque nouvelle prescription.</p>
<div class="lab">Effets indésirables et interactions</div><p>Diarrhée, nausées ; index thérapeutique étroit. Contre-indications de l’information professionnelle suisse (COLCTAB®) : DFG &lt; 30 mL/min, insuffisance hépatique sévère, anomalies de la formule sanguine, grossesse, allaitement et désir d’enfant, association aux inhibiteurs de la glycoprotéine P et aux inhibiteurs puissants du CYP3A4, ciclosporine.</p></template>

<template data-pop="i21-d-ipp" data-title="Inhibiteurs de la pompe à protons">
<div class="lab">Indication</div><p>Pendant la double antiagrégation ou la triple thérapie chez le patient à risque d’hémorragie digestive : âge, antécédent d’ulcère ou d’hémorragie, anticoagulant, corticoïde, AINS (proposé par l’ESC 2023). La dose préventive de pantoprazole de l’information professionnelle suisse est de 40 mg/jour.</p>
<div class="lab">Preuve</div><p>Essai COGENT (2010) : l’oméprazole a réduit les hémorragies digestives sous double antiagrégation, sans hausse démontrée des événements cardiovasculaires.</p>
<div class="lab">Interaction</div><p>L’oméprazole et l’ésoméprazole inhibent le CYP2C19 et réduisent l’activation du clopidogrel : préférer le pantoprazole avec le clopidogrel.</p>
<div class="lab">Effets indésirables au long cours</div><p>Hypomagnésémie, infections à <i>Clostridioides difficile</i>, fractures ; réévaluer l’indication à l’arrêt de la double antiagrégation.</p></template>

<template data-pop="i21-d-gp" data-title="Inhibiteurs de la GP IIb/IIIa et cangrélor">
<div class="lab">Mécanisme</div><p>Tirofiban et eptifibatide bloquent de façon réversible la glycoprotéine GP IIb/IIIa, voie finale commune de l’agrégation : ils empêchent la liaison du fibrinogène quelle que soit la voie d’activation. Le cangrélor bloque le récepteur P2Y12 par voie intraveineuse, de façon réversible, avec un début et une fin d’action en quelques minutes.</p>
<div class="lab">Preuves</div><p>Inhibiteurs de la GP IIb/IIIa : bénéfice démontré avant l’ère de la double antiagrégation puissante (essais PRISM-PLUS pour le tirofiban, PURSUIT pour l’eptifibatide) ; sans bénéfice net en routine aujourd’hui, au prix d’hémorragies. Cangrélor : essai CHAMPION PHOENIX (2013), moins d’événements ischémiques périprocéduraux que le clopidogrel chez des patients non prétraités.</p>
<div class="lab">Place (ESC 2023)</div><p>Inhibiteurs de la GP IIb/IIIa : en salle de cathétérisme, en cas de thrombus massif, de no-reflow ou de complication thrombotique (IIa) ; pas de traitement de routine avant la coronarographie. Cangrélor : au cas par cas chez le patient non prétraité par un inhibiteur P2Y12 oral (IIb).</p>
<div class="lab">Posologie</div><p>Voir le tableau des antithrombotiques. Tirofiban (Aggrastat®) : dose réduite de moitié si clairance &lt; 30 mL/min. Eptifibatide : aucune information professionnelle suisse trouvée dans l’AIPS au 08.10.2026.</p>
<div class="lab">Contre-indications</div><p>Hémorragie active, AVC hémorragique ou ischémique récent, chirurgie ou traumatisme récents, thrombopénie &lt; 100 × 10⁹/L, hypertension sévère non contrôlée, trouble de l’hémostase.</p>
<div class="lab">Surveillance</div><p>Numération plaquettaire avant le traitement, 2 à 6 heures après le début puis quotidiennement : les inhibiteurs de la GP IIb/IIIa peuvent provoquer une thrombopénie aiguë profonde, qui impose l’arrêt. Surveillance des points de ponction et de l’hémoglobine. Relais oral après cangrélor (Kengrexal®) : ticagrélor 180 mg pendant la perfusion ou immédiatement après son arrêt ; prasugrel 60 mg immédiatement après l’arrêt ou, idéalement, 30 minutes avant la fin de la perfusion ; clopidogrel 600 mg immédiatement après l’arrêt, car le cangrélor empêche sa liaison au récepteur.</p></template>

<template data-pop="i21-arb-arret" data-title="Délais d’arrêt des inhibiteurs P2Y12 avant chirurgie">
<div class="lab">Information professionnelle suisse (Swissmedic)</div><p><b>Brilique®</b> : arrêt 7 jours avant une chirurgie programmée si l’effet antiplaquettaire n’est pas souhaité ; avant un pontage, le risque hémorragique dépasse celui du clopidogrel lorsque le ticagrélor est arrêté moins de 96 heures avant. <b>Plavix®</b> : arrêt 7 jours avant ; dans les données citées, pas d’augmentation des hémorragies majeures après un pontage lorsque le clopidogrel avait été arrêté plus de 5 jours avant. <b>Efient®</b> : arrêt au moins 7 jours avant.</p>
<div class="lab">Mécanisme</div><p>Le clopidogrel et le prasugrel bloquent le récepteur P2Y12 de façon irréversible : l’effet ne disparaît qu’avec le renouvellement des plaquettes, d’où un délai proche de leur durée de vie. Le ticagrélor se lie de façon réversible : l’effet décroît avec sa concentration plasmatique, ce qui explique qu’un délai plus court suffise avant un pontage.</p>
<div class="lab">Choix retenu pour la Suisse</div><p>Pour une chirurgie programmée, le délai de l’information professionnelle suisse (7 jours) s’applique. Avant un pontage chez un patient en SCA, le délai se discute en équipe cardiologique, en pesant le risque thrombotique d’une attente et les seuils de 96 heures (ticagrélor) et de 5 jours (clopidogrel) cités par l’information professionnelle. Aucune position propre de la Société suisse de cardiologie sur ce point n’a été trouvée au 08.10.2026.</p>
<div class="lab">Texte en vigueur</div><p>Informations professionnelles suisses Brilique®, Plavix® et Efient®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>

<template data-pop="i21-arb-colch" data-title="Colchicine en prévention coronarienne : statut suisse">
<div class="lab">Position européenne</div><p>ESC 2024 (syndromes coronariens chroniques) : chez le coronarien athéroscléreux, la colchicine à faible dose (0,5 mg/jour) est à envisager pour réduire infarctus, AVC et revascularisations (classe IIa, niveau A), sur la base des essais COLCOT (4 745 patients après un infarctus récent) et LoDoCo2 (5 500 patients coronariens chroniques). L’essai CLEAR SYNERGY (2024), débuté à la phase aiguë de l’infarctus, n’a pas confirmé de bénéfice.</p>
<div class="lab">Position suisse</div><p>L’information professionnelle suisse de COLCTAB®, seule colchicine figurant dans l’AIPS au 08.10.2026, autorise la goutte, la prévention des crises au début d’un traitement hypo-uricémiant, la péricardite aiguë et récurrente et la fièvre méditerranéenne familiale. La prévention cardiovasculaire n’y figure pas : la prescription est hors indication autorisée, sous la responsabilité du prescripteur, et le remboursement n’est pas acquis.</p>
<div class="lab">Mécanisme et prudence</div><p>La colchicine inhibe la polymérisation de la tubuline des leucocytes et l’activation de l’inflammasome NLRP3, ce qui réduit l’inflammation de la plaque. Son index thérapeutique étroit et ses contre-indications (DFG &lt; 30 mL/min, inhibiteurs puissants du CYP3A4 ou de la glycoprotéine P, grossesse) imposent une sélection rigoureuse.</p>
<div class="lab">Choix retenu pour l’examen</div><p>Connaître la recommandation ESC (IIa) et savoir que son application en Suisse sort du cadre de l’autorisation de mise sur le marché.</p></template>
