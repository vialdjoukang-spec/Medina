<section class="ilot" id="i21-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 58 ans, fumeur, appelle le 144 pour une douleur rétrosternale constrictive apparue au repos il y a quarante minutes. Elle irradie dans la mâchoire et s’accompagne de sueurs. La question qui structure ce chapitre est la suivante : <b>ce patient a-t-il une occlusion coronaire aiguë qui exige une reperfusion immédiate, et sinon, s’agit-il d’un infarctus, d’un angor instable ou d’une autre cause de douleur thoracique ?</b></p>
<p>Deux urgences s’imposent dès le premier contact. La première concerne le myocarde : chaque minute d’occlusion étend la nécrose. La seconde concerne le diagnostic différentiel : dissection aortique, embolie pulmonaire et tamponnade tuent aussi vite et se traitent autrement. Le chapitre apprend à mener les deux démarches en parallèle.</p>
<p>À la fin de ce chapitre, le médecin assistant sait lire un ECG à la recherche d’une occlusion, y compris sans sus-décalage classique ; interpréter une troponine hypersensible et appliquer les algorithmes 0 h/1 h et 0 h/2 h ; classer l’infarctus selon la définition universelle ; stratifier le risque ischémique et hémorragique ; choisir entre angioplastie primaire et fibrinolyse ; prescrire et durer la double antiagrégation plaquettaire ; reconnaître les complications mécaniques et rythmiques ; organiser la prévention secondaire, la réadaptation, le retour au travail et la conduite en Suisse.</p>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="i21-sa-coro">anatomie coronaire (territoires et dominance)</button>, le <button class="w" data-k="i21-mvo2">bilan en oxygène du myocarde (apports et besoins)</button> et l’<button class="w" data-k="i21-plaquette">activation plaquettaire (cibles des antiagrégants)</button>. Ces trois notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i21-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<h3>1.1 Le syndrome coronarien aigu : un spectre</h3>
<p>Le <b>syndrome coronarien aigu (SCA)</b> désigne un ensemble de présentations cliniques causées par une réduction brutale du flux coronaire. L’ESC 2023 insiste sur la notion de spectre : les formes se distinguent par l’ECG et la troponine, mais partagent le même mécanisme et une grande partie du traitement.</p>
<div class="two">
<div class="card"><h4>STEMI</h4><p>Infarctus avec sus-décalage persistant du segment ST, ou équivalent électrique d’occlusion. Il traduit en règle une <button class="w" data-k="i21-omi">occlusion coronaire aiguë (concept d’infarctus occlusif)</button>. Il impose une reperfusion immédiate.</p></div>
<div class="card"><h4>NSTEMI</h4><p>Infarctus sans sus-décalage persistant : la troponine s’élève et diminue au-dessus du 99e percentile, dans un contexte ischémique. L’ECG peut montrer un sous-décalage, une inversion des ondes T ou rester normal.</p></div>
<div class="card"><h4>Angor instable</h4><p>Ischémie de repos ou d’aggravation récente, sans élévation significative de la troponine hypersensible. Sa fréquence a nettement diminué depuis l’usage des troponines hypersensibles, qui reclassent une partie de ces patients en NSTEMI.</p></div>
<div class="card"><h4>NSTE-ACS</h4><p>Terme ESC qui réunit NSTEMI et angor instable : syndrome coronarien aigu sans sus-décalage persistant du ST. Il se prend en charge par une stratification du risque, et non par une reperfusion immédiate systématique.</p></div></div>
<h3>1.2 Lésion myocardique et infarctus</h3>
<p>La première distinction à maîtriser oppose la <b>lésion myocardique</b> à l’<b>infarctus</b>. La lésion myocardique est un fait biologique : au moins une valeur de troponine cardiaque au-dessus du 99e percentile de la population de référence. Elle est <b>aiguë</b> si la troponine monte ou descend entre deux dosages, <b>chronique</b> si elle reste stable. L’<b>infarctus</b> est une lésion aiguë <b>d’origine ischémique</b>, démontrée par la clinique, l’ECG, l’imagerie ou l’angiographie. Exemple : un patient septique avec une troponine qui monte et une échocardiographie normale a une lésion myocardique aiguë ; il n’a pas nécessairement un infarctus. La fiche <button class="w" data-k="i21-lesion">lésion myocardique aiguë et chronique (définition et causes)</button> détaille ces situations.</p>
<h3>1.3 La définition universelle : de la 4e (2018) à la 5e version (2026)</h3>
<p>La <b>4e définition universelle (2018)</b>, encore utilisée par l’ESC 2023 et par la plupart des questions d’examen, décrit cinq types d’infarctus. Le <b>type 1</b> est l’infarctus spontané par rupture ou érosion d’une plaque avec thrombus. Le <b>type 2</b> résulte d’un déséquilibre entre apports et besoins en oxygène, sans thrombose aiguë : anémie, tachyarythmie, hypotension, spasme. Le <b>type 3</b> désigne le décès avec symptômes et ECG évocateurs avant tout dosage. Le <b>type 4</b> est lié à l’angioplastie (4a : procédure ; 4b : thrombose de stent ; 4c : resténose). Le <b>type 5</b> est lié au pontage. Les seuils de chaque type sont dans la fiche <button class="w" data-k="i21-udmi4">types 1 à 5 de la 4e définition (critères et seuils)</button>.</p>
<p>La <b>5e définition universelle</b>, publiée fin août 2026 dans l’<i>European Heart Journal</i> (Mills et al.) comme document commun de l’ESC, de la WHF et de deux sociétés américaines (ACC et AHA), remplace les numéros par trois catégories cliniques : infarctus <b>primaire</b> (ancien type 1, élargi à la dissection spontanée, à l’embolie et au spasme), <b>secondaire</b> (ancien type 2) et <b>lié à une procédure</b> dans les 30 jours (anciens types 4 et 5). Le type 3 disparaît comme catégorie propre : le décès est classé dans l’une des trois catégories selon le contexte clinique ou l’autopsie. La lésion myocardique se définit désormais par un 99e percentile <button class="w" data-k="i21-arb-sexe">propre à chaque sexe (arbitrage entre sources)</button>, et le « I » de MINOCA signifie désormais « injury » (lésion). La fiche <button class="w" data-k="i21-udmi5">5e définition universelle (catégories et correspondance)</button> donne la correspondance entre les deux versions.</p>
<div class="trap"><span class="k">Piège</span>Les questions d’examen et les recommandations ESC 2023 utilisent encore les types 1 à 5. Il faut connaître les deux systèmes et savoir passer de l’un à l’autre : type 1 → primaire, type 2 → secondaire, types 4 et 5 → lié à une procédure. Les seuils chiffrés (5 × et 10 × le 99e percentile) appartiennent à la 4e définition ; la 5e définition ne fait plus dépendre l’infarctus lié à une procédure d’un multiple de troponine, mais d’une complication coronaire démontrée associée à un trouble segmentaire nouveau ou à une perte de myocarde viable.</div>

<p>Un nouvel infarctus survenant dans les 28 jours qui suivent un premier infarctus est un <button class="w" data-k="i21-reinf">réinfarctus (critères de troponine)</button> ; au-delà de 28 jours, la 4e définition parle d’infarctus récurrent. Cette distinction compte, car la troponine encore élevée du premier événement complique le diagnostic du second.</p>
</section>

<section class="ilot" id="i21-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>En Suisse, les maladies cardiovasculaires sont la deuxième cause de mortalité après le cancer (Groupe de travail Lipides et Athérosclérose, d’après l’OFS). Selon l’OFS, elles ont causé en 2024 9 403 décès chez l’homme et 10 626 chez la femme, soit 26,7 % et 28,9 % de l’ensemble des décès. La même année, l’OFS a recensé 19 851 cas d’infarctus aigu du myocarde (13 004 chez l’homme, 6 847 chez la femme). À l’échelle européenne, l’ESC 2023 estime à 5,8 millions les nouveaux cas de cardiopathie ischémique en 2019 dans ses 57 pays membres ; la cardiopathie ischémique représente 38 % des décès cardiovasculaires chez la femme et 44 % chez l’homme.</p>
<p>La Suisse dispose d’un registre national, <b>AMIS Plus</b>, qui recueille depuis 1997 les patients hospitalisés pour un syndrome coronarien aigu dans des hôpitaux suisses. Il a documenté la diffusion de l’angioplastie primaire et la baisse marquée de la mortalité hospitalière. Sur 51 725 patients inclus de 1997 à 2016, la mortalité hospitalière du STEMI est passée de 9,8 % à 5,5 % chez l’homme et de 18,3 % à 6,9 % chez la femme ; celle du NSTEMI de 7,1 % à 2,1 % chez l’homme et de 11,0 % à 3,6 % chez la femme (Radovanovic et al., <i>Open Heart</i> 2017, présenté au congrès ESC 2017). Les femmes y étaient plus âgées que les hommes (environ 72 ans contre 64 ans), et la baisse de mortalité ajustée sur l’âge a été plus rapide chez elles.</p>
<p>Dans la cohorte AMIS Plus, 59 % des 51 725 infarctus étaient des STEMI et 41 % des NSTEMI.</p>
<p>Le pronostic dépend de quatre déterminants : la taille de l’infarctus, reflétée par la FEVG résiduelle ; l’état hémodynamique initial (classe de Killip, choc) ; le délai de reperfusion ; et l’âge et les comorbidités, surtout l’insuffisance rénale et le diabète. Le risque de récidive reste maximal dans la première année.</p>
<div class="trap"><span class="k">Lacune documentaire</span>L’OFS publie le total des décès cardiovasculaires, sans détail consolidé pour la cardiopathie ischémique dans sa synthèse ; AMIS Plus s’arrête ici à 2016 et ne couvre pas tous les hôpitaux suisses. Aucune source suisse ou européenne lue ne chiffre ici la mortalité à un an comparée du STEMI et du NSTEMI ; cette donnée n’est donc pas enseignée.</div>

<section class="ilot" id="i21-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie explique trois choses que le clinicien doit savoir déduire : pourquoi l’ECG distingue occlusion et sténose, pourquoi le délai est décisif, et pourquoi chaque traitement antithrombotique a sa place. La chaîne est la suivante : <b>plaque vulnérable → rupture ou érosion → thrombus → réduction du flux → ischémie → nécrose de l’endocarde vers l’épicarde → remodelage.</b></p>
<h3>3.1 De la plaque au thrombus</h3>
<p>La plaque d’athérome se développe pendant des décennies dans l’intima, par accumulation de particules de LDL oxydées, de macrophages et de cellules musculaires lisses. La plaque dangereuse n’est pas forcément la plus serrée. C’est le <button class="w" data-k="i21-plaque">fibroathérome à chape fine (rupture et érosion)</button> : un noyau lipidique nécrotique volumineux recouvert d’une chape fibreuse mince, infiltrée de macrophages. Sa rupture expose le facteur tissulaire au sang. L’érosion, fréquente chez la femme jeune et le fumeur, dénude l’endothélium d’une plaque riche en protéoglycanes sans rupture de la chape. Dans les deux cas, les plaquettes adhèrent, s’activent et s’agrègent, puis la coagulation consolide le thrombus par la fibrine.</p>
<div class="key"><b>Corrélation physiopathologie → thérapeutique.</b> Le thrombus a deux composantes. La composante plaquettaire, « blanche », prédomine au contact de la plaque : elle est la cible de l’<button class="w" data-k="i21-d-asa">acide acétylsalicylique (inhibition de la cyclo-oxygénase)</button> et des <button class="w" data-k="i21-d-p2y12">inhibiteurs du récepteur P2Y12 (clopidogrel, prasugrel, ticagrélor)</button>. La composante fibrinoérythrocytaire, « rouge », prolonge le thrombus en aval : elle est la cible des <button class="w" data-k="i21-d-hep">anticoagulants parentéraux (héparines, fondaparinux, bivalirudine)</button> et des fibrinolytiques. C’est pourquoi le traitement du SCA associe deux antiagrégants et un anticoagulant.</div>
<h3>3.2 Occlusion totale ou subtotale : STEMI et NSTE-ACS</h3>
<p>Lorsque le thrombus occlut complètement l’artère sans circulation collatérale suffisante, l’ischémie devient transmurale. Le courant de lésion est alors dirigé vers l’épicarde et produit un <b>sus-décalage du segment ST</b> dans les dérivations qui font face au territoire. Lorsque l’occlusion est incomplète, intermittente, ou compensée par des collatérales, l’ischémie reste sous-endocardique : l’ECG montre un sous-décalage ou des ondes T négatives, ou reste normal. Le mécanisme électrique est détaillé dans la fiche <button class="w" data-k="i21-courant">courant de lésion (mécanisme du sus- et du sous-décalage)</button>.</p>
<p>Cette correspondance n’est pas parfaite. Environ un quart des NSTEMI ont en réalité une artère occluse à la coronarographie, notamment dans le territoire de la circonflexe, électriquement « silencieux » sur l’ECG standard. D’où le concept d’<button class="w" data-k="i21-omi">infarctus occlusif (OMI)</button> : la question clinique n’est pas « y a-t-il un sus-décalage ? », mais « y a-t-il une occlusion ? ».</p>
<h3>3.3 Le front de nécrose : pourquoi le temps compte</h3>
<p>Le sous-endocarde est la couche la plus vulnérable. Il subit la pression intraventriculaire la plus élevée, qui comprime ses vaisseaux pendant la systole, et il se situe à l’extrémité du réseau coronaire issu des artères épicardiques. Après une occlusion, la nécrose débute dans le sous-endocarde en 20 à 40 minutes, puis progresse vers l’épicarde. En l’absence de reperfusion, elle devient transmurale en 3 à 6 heures environ. Cette <button class="w" data-k="i21-front">progression du front de nécrose (endocarde vers épicarde)</button> explique que le bénéfice de la reperfusion soit maximal dans les premières heures, puis décroisse.</p>

<h3>3.4 Ce qui se passe dans la cellule et après la reperfusion</h3>
<p>Privé d’oxygène, le cardiomyocyte passe à la glycolyse anaérobie. En quelques secondes, la contraction de la zone diminue ; en quelques minutes, l’ATP chute, la pompe Na⁺/K⁺-ATPase défaille, le calcium s’accumule et le potassium sort de la cellule. Ce potassium extracellulaire est à l’origine du courant de lésion et des arythmies précoces, dont la fibrillation ventriculaire, principale cause de décès préhospitalier.</p>
<p>La reperfusion sauve le myocarde encore viable, mais elle a un coût : la <button class="w" data-k="i21-reperf">lésion de reperfusion et le « no-reflow » (obstruction microvasculaire)</button>. Le myocarde reperfusé peut aussi rester temporairement immobile malgré sa viabilité : c’est la <button class="w" data-k="i21-sideration">sidération et l’hibernation myocardiques (dysfonction réversible)</button>. Une FEVG basse le premier jour ne préjuge donc pas de la FEVG à trois mois.</p>
<h3>3.5 Remodelage et conséquences tardives</h3>
<p>La zone nécrosée est remplacée par une cicatrice en six à huit semaines. Pendant les premiers jours, elle est ramollie par la détersion inflammatoire : c’est la période de risque des ruptures (îlot 13). Le ventricule s’adapte ensuite par un remodelage : la zone infarcie s’amincit et s’étire, le myocarde sain s’hypertrophie, la cavité se dilate. Ce remodelage, entretenu par le système rénine-angiotensine-aldostérone et le système sympathique, conduit à l’insuffisance cardiaque et fournit le substrat des tachycardies ventriculaires par réentrée autour de la cicatrice.</p>
<div class="key"><b>Corrélation physiopathologie → prévention.</b> Les IEC, les bêtabloquants et les antagonistes des récepteurs minéralocorticoïdes limitent le remodelage post-infarctus. Leur bénéfice est le plus net quand la FEVG est réduite, là où le remodelage est le plus actif. Le lien avec l’insuffisance cardiaque est développé dans la fiche <button class="w" data-k="i21-remodel">remodelage ventriculaire (dilatation, fibrose)</button>.</div>

<section class="ilot" id="i21-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>L’athérosclérose coronaire est la cause de la grande majorité des syndromes coronariens aigus. Les autres causes sont rares, mais leur reconnaissance change le traitement ; elles dominent chez la femme jeune et chez le patient sans facteur de risque.</p>
<div class="two">
<div class="card"><h4>Athérothrombose (infarctus de type 1, primaire)</h4><p>Rupture ou érosion de plaque, thrombus. Cause dominante à tout âge au-delà de 45 ans.</p></div>
<div class="card"><h4>Causes coronaires non athéromateuses</h4><p><button class="w" data-k="i21-scad">Dissection coronaire spontanée (SCAD)</button> ; <button class="w" data-k="i21-spasme">vasospasme coronaire (angor de Prinzmetal)</button> ; embolie coronaire (fibrillation auriculaire, endocardite, prothèse valvulaire) ; cocaïne et amphétamines ; artérite (maladie de Kawasaki, Takayasu) ; compression ou anomalie congénitale d’origine.</p></div>
<div class="card"><h4>Déséquilibre apports-besoins (type 2, secondaire)</h4><p>Anémie sévère, hémorragie, tachyarythmie rapide, hypotension ou choc, crise hypertensive, hypoxémie, rétrécissement aortique serré. Le terrain coronarien stable favorise l’ischémie.</p></div>
<div class="card"><h4>Liées à une procédure</h4><p>Angioplastie (occlusion d’une branche, dissection, thrombose de stent), pontage, remplacement valvulaire percutané.</p></div></div>
<h3>4.1 Facteurs de risque</h3>
<p>L’étude cas-témoins <b>INTERHEART</b> a montré que neuf facteurs modifiables expliquent plus de 90 % du risque attribuable de premier infarctus dans toutes les régions du monde : dyslipidémie (mesurée par le rapport des apolipoprotéines), tabagisme, hypertension, diabète, obésité abdominale, facteurs psychosociaux, et, en sens protecteur, consommation quotidienne de fruits et légumes, activité physique régulière et consommation modérée d’alcool. Ce dernier facteur protecteur n’est plus retenu comme conseil de santé publique.</p>
<div class="two">
<div class="card"><h4>Non modifiables</h4><p>Âge ; sexe masculin (écart qui se réduit après la ménopause) ; antécédent familial de coronaropathie précoce (homme &lt; 55 ans, femme &lt; 60 ans chez un apparenté du premier degré) ; <button class="w" data-k="i21-hf">hypercholestérolémie familiale (dépistage)</button> ; <button class="w" data-k="i21-lpa">lipoprotéine(a) élevée (facteur génétique)</button>.</p></div>
<div class="card"><h4>Modifiables</h4><p>LDL-cholestérol ; tabac, y compris passif ; hypertension ; diabète ; obésité ; sédentarité ; maladie rénale chronique ; inflammation chronique (polyarthrite rhumatoïde, psoriasis, infection par le VIH) ; pollution de l’air ; dépression et isolement social.</p></div>
<div class="card"><h4>Spécifiques de la femme</h4><p>Prééclampsie, diabète ou hypertension gestationnels, ménopause précoce, syndrome des ovaires polykystiques : l’ESC les considère comme des marqueurs de risque à rechercher.</p></div>
<div class="card"><h4>Déclencheurs aigus</h4><p>Effort intense inhabituel, stress émotionnel, infection respiratoire (grippe), froid, repas copieux, prise de cocaïne. Ils précipitent la rupture d’une plaque déjà vulnérable.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure à un « infarctus de type 2 » chez un patient anémique ou tachycarde sans rechercher un infarctus de type 1. L’anémie d’un patient sous anticoagulant peut coexister avec une rupture de plaque. La distinction repose sur l’angiographie ou l’imagerie, et non sur la seule présence d’un facteur de déséquilibre.</div>
<button class="pareto-btn ui" data-k="pareto-i21-etio">▲ Loi de Pareto — Étiologies et facteurs de risque</button>
</section>

<section class="ilot" id="i21-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse est l’outil diagnostique le plus rapide et le moins coûteux. Elle se conduit pendant que l’ECG est enregistré, et non après. Elle répond à trois questions : la douleur est-elle ischémique, depuis quand, et existe-t-il une contre-indication aux traitements à venir ?</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i21-atcd-coro">Coronaropathie connue (infarctus, stent, pontage)</button></li><li>Facteurs de risque : tabac, hypertension, diabète, dyslipidémie, antécédents familiaux</li><li><button class="w" data-k="i21-atcd-hemo">Antécédents hémorragiques et neurologiques (contre-indications aux antithrombotiques)</button></li><li>Maladie rénale chronique, anémie connue</li></ul>
<ul><li><button class="w" data-k="i21-atcd-medic">Traitements en cours (anticoagulant, inhibiteur de la phosphodiestérase de type 5)</button></li><li>Consommation de cocaïne ou d’amphétamines</li><li>Grossesse actuelle ou récente (dissection coronaire)</li><li>Chirurgie ou traumatisme récents, ulcère gastroduodénal</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i21-s-douleur">Douleur thoracique ischémique (caractérisation)</button></li><li><button class="w" data-k="i21-s-irrad">Irradiations (bras, mâchoire, dos, épigastre)</button></li><li><button class="w" data-k="i21-s-vago">Signes neurovégétatifs (sueurs, nausées, vomissements)</button></li><li>Dyspnée, isolée ou associée</li></ul>
<ul><li><button class="w" data-k="i21-s-equiv">Équivalents ischémiques atypiques (fatigue, malaise, épigastralgie)</button></li><li>Palpitations</li><li><button class="w" data-k="i21-s-syncope">Syncope (arythmie ou bas débit)</button></li><li>Arrêt cardiaque inaugural</li></ul></div>
<p>La <b>chronologie</b> est aussi importante que la description. L’heure de début conditionne l’indication de reperfusion (moins de 12 heures dans le STEMI) et l’usage de l’algorithme de troponine (une valeur initiale très basse n’exclut l’infarctus que si la douleur a débuté plus de trois heures auparavant). Il faut demander aussi si la douleur est continue ou si elle a cédé : une douleur qui persiste malgré le traitement est un critère de très haut risque.</p>
<h3>5.3 Formes typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Homme de 62 ans, hypertendu, fumeur. Douleur rétrosternale constrictive depuis une heure, au repos, irradiant au bras gauche, avec sueurs. ECG : sus-décalage de 3 mm en DII, DIII et aVF. STEMI inférieur.</p></div>
<div class="card"><h4>Forme atypique de la femme âgée</h4><p>Femme de 78 ans, diabétique. Seules plaintes : fatigue inhabituelle et dyspnée depuis deux jours. ECG : sous-décalage diffus. Troponine à 180 ng/L. NSTEMI longtemps pris pour une infection respiratoire.</p></div>
<div class="card"><h4>Forme silencieuse du diabétique</h4><p>Homme de 70 ans, diabétique avec neuropathie autonome. Découverte d’ondes Q inférieures sur un ECG préopératoire, sans souvenir de douleur. Infarctus ancien méconnu, confirmé par l’échocardiographie.</p></div>
<div class="card"><h4>Forme de la femme jeune</h4><p>Femme de 38 ans, trois semaines après un accouchement, sans facteur de risque. Douleur thoracique brutale, troponine élevée, sus-décalage antérieur. Coronarographie : dissection coronaire spontanée de l’artère interventriculaire antérieure.</p></div></div>
<div class="trap"><span class="k">Piège</span>Le soulagement par la trinitrine ne prouve pas l’origine coronaire : le spasme œsophagien est aussi soulagé. À l’inverse, une douleur reproduite par la palpation ou modifiée par la respiration rend l’ischémie moins probable, sans l’exclure. Aucun élément isolé de l’anamnèse ne suffit à exclure un SCA : l’ECG et la troponine sont obligatoires.</div>
</section>

<section class="ilot" id="i21-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique d’un patient suspect de SCA est souvent normal. Son rôle n’est donc pas de confirmer l’infarctus, mais de répondre à trois questions : le patient est-il instable, existe-t-il une complication, et existe-t-il un diagnostic concurrent ? Il suit l’ordre : état général → signes vitaux → anthropométrie → signes ciblés.</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Anxiété, pâleur, sueurs, agitation ou confusion (bas débit). <button class="w" data-k="i21-v-ta">Pression artérielle aux deux bras (asymétrie, choc)</button>, fréquence et régularité du pouls, fréquence respiratoire, SpO₂, température. Le poids est nécessaire au calcul des doses d’héparine et de fibrinolytique, et le poids inférieur à 60 kg modifie la dose d’entretien du prasugrel.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Insuffisance ventriculaire gauche</b><ul><li><button class="w" data-k="i21-killip">Classification de Killip (crépitants, troisième bruit, choc)</button></li><li><button class="w" data-k="i21-e-crep">Crépitants pulmonaires (technique)</button></li><li><button class="w" data-k="i21-e-b3">Troisième bruit (galop protodiastolique)</button></li><li>Quatrième bruit (ventricule rigide ischémique)</li></ul></div>
<div><b>Complications mécaniques</b><ul><li><button class="w" data-k="i21-e-souffle">Souffle systolique nouveau (rupture septale ou de pilier)</button></li><li><button class="w" data-k="i21-e-frott">Frottement péricardique (péricardite)</button></li><li>Turgescence jugulaire, pouls paradoxal, bruits assourdis (tamponnade)</li></ul></div>
<div><b>Infarctus du ventricule droit</b><ul><li><button class="w" data-k="i21-e-vd">Triade hypotension, champs pulmonaires clairs, turgescence jugulaire</button></li><li>Signe de Kussmaul</li></ul></div>
<div><b>Diagnostics concurrents</b><ul><li>Asymétrie tensionnelle ou déficit d’un pouls, souffle diastolique aortique (dissection)</li><li>Asymétrie du murmure vésiculaire (pneumothorax)</li><li>Thrombose veineuse profonde (embolie pulmonaire)</li><li>Défense abdominale (ulcère perforé, pancréatite)</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Un patient « froid » avec une pression artérielle conservée peut déjà être en pré-choc : la vasoconstriction maintient la pression pendant que le débit baisse. Les marbrures, l’oligurie, la confusion et un lactate élevé signent l’hypoperfusion. Voir la fiche <button class="w" data-k="i21-choc">choc cardiogénique (stades SCAI)</button>.</div>
<button class="pareto-btn ui" data-k="pareto-i21-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>

<section class="ilot" id="i21-7"><h2><span class="n">7</span>L’électrocardiogramme du syndrome coronarien aigu</h2>
<div class="alert"><b>Délai obligatoire.</b> Un ECG à 12 dérivations est enregistré et interprété dans les <b>10 minutes</b> qui suivent le premier contact médical, y compris par l’ambulance (ESC 2023). Il est répété en cas de symptôme récurrent, à 15–30 minutes si le premier est non diagnostique et la douleur persistante, et comparé aux tracés antérieurs.</div>
<p>L’ECG est le seul examen qui décide, en quelques minutes, d’une reperfusion immédiate. Il se lit en quatre temps : existe-t-il un sus-décalage répondant aux critères, un équivalent d’occlusion, un sous-décalage ou une anomalie de l’onde T, et un facteur qui rend la lecture difficile (bloc de branche, stimulation, hypertrophie) ?</p>
<h3>7.1 Critères du sus-décalage (définition universelle, ESC 2023)</h3>
<p>Le sus-décalage se mesure au <b>point J</b>, jonction entre la fin du QRS et le début du segment ST, par rapport à la ligne isoélectrique (segment PR). Il doit être <b>nouveau</b> et présent dans <b>au moins deux dérivations contiguës</b>, c’est-à-dire explorant le même territoire.</p>
<table class="t"><tr><th>Dérivations</th><th>Population</th><th>Seuil au point J</th></tr>
<tr><td>V2–V3</td><td>Homme ≥ 40 ans</td><td>≥ 2 mm</td></tr>
<tr><td>V2–V3</td><td>Homme &lt; 40 ans</td><td>≥ 2,5 mm</td></tr>
<tr><td>V2–V3</td><td>Femme, quel que soit l’âge</td><td>≥ 1,5 mm</td></tr>
<tr><td>Toutes les autres dérivations</td><td>Tous</td><td>≥ 1 mm</td></tr>
<tr><td>V7–V9 (paroi postérieure)</td><td>Tous (homme &lt; 40 ans : ≥ 1 mm)</td><td>≥ 0,5 mm</td></tr>
<tr><td>V3R–V4R (ventricule droit)</td><td>Tous (homme &lt; 30 ans : ≥ 1 mm)</td><td>≥ 0,5 mm</td></tr></table>
<p class="src">Seuils de la 4e définition universelle (2018), repris par l’ESC 2023 ; 1 mm = 0,1 millivolt à l’étalonnage standard. Les seuils plus élevés dans V2–V3 tiennent compte du sus-décalage physiologique de ces dérivations chez l’homme jeune.</p>
<p>Le sus-décalage se localise selon les <button class="w" data-k="i21-ecg-terr">territoires électriques et artères responsables</button>. Un <b>miroir</b>, sous-décalage dans les dérivations opposées, renforce la spécificité : par exemple un sous-décalage en DI et aVL dans un infarctus inférieur. L’ECG évolue ensuite selon une séquence connue, résumée dans la fiche <button class="w" data-k="i21-ecg-evol">évolution de l’ECG de l’infarctus (onde T hyperaiguë, onde Q)</button>.</p>
<figure><svg viewBox="0 0 640 170" role="img" aria-label="Aspects du segment ST"><g font-family="Inter,sans-serif" font-size="11" fill="none" stroke="currentColor" stroke-width="1.6">

<h3>7.2 Les équivalents de STEMI : reconnaître l’occlusion sans sus-décalage classique</h3>
<p>L’ESC 2023 recommande une stratégie invasive immédiate, comme dans le STEMI, devant une ischémie persistante avec un infarctus postérieur isolé ou un bloc de branche ou une stimulation. Deux autres aspects, l’aspect de de Winter (reconnu par la littérature électrocardiographique) et le sous-décalage diffus avec sus-décalage en aVR (critère de très haut risque, sans indication de fibrinolyse), relèvent d’une coronarographie urgente.</p>
<h4>Équivalents retenus par l’ESC 2023 : stratégie comme un STEMI</h4>
<div class="two">
<div class="card"><h4>Infarctus postérieur isolé</h4><p>Sous-décalage de V1 à V3, surtout avec une onde T terminale positive et une onde R ample. Il est l’image en miroir d’un sus-décalage de la paroi postérieure, que les dérivations <button class="w" data-k="i21-ecg-post">V7–V9 (enregistrement et seuils)</button> confirment.</p></div>
<div class="card"><h4>Bloc de branche et stimulation</h4><p>Un <button class="w" data-k="i21-ecg-sgarb">bloc de branche gauche ou droit, ou un rythme électro-entraîné (critères de Sgarbossa)</button> avec des symptômes évocateurs d’ischémie persistante se traite comme un STEMI, que le bloc soit connu ou non.</p></div></div>
<h4>Autres aspects d’occlusion ou de très haut risque : coronarographie urgente</h4>
<div class="two">
<div class="card"><h4>Aspect de de Winter</h4><p><button class="w" data-k="i21-ecg-dewinter">Sous-décalage ascendant avec ondes T géantes (occlusion de l’interventriculaire antérieure)</button>. Il s’agit d’une occlusion proximale sans sus-décalage.</p></div>
<div class="card"><h4>Sous-décalage diffus avec sus-décalage en aVR</h4><p><button class="w" data-k="i21-ecg-avr">Sous-décalage ≥ 1 mm dans au moins six dérivations et sus-décalage en aVR ou V1</button> : ischémie globale sous-endocardique, qui évoque une atteinte du tronc commun ou pluritronculaire. Critère de très haut risque : coronarographie immédiate si le patient est instable, très précoce sinon ; la fibrinolyse n’a pas d’indication.</p></div></div>
<p>Un aspect particulier, observé à distance de la douleur, doit être connu : le <button class="w" data-k="i21-ecg-wellens">syndrome de Wellens (ondes T biphasiques ou profondément négatives en V2–V3)</button>. Il signale une sténose critique de l’interventriculaire antérieure proximale, à haut risque d’occlusion.</p>
<h3>7.3 Ce qui imite un sus-décalage</h3>
<p>Plusieurs situations produisent un sus-décalage sans occlusion coronaire : repolarisation précoce, péricardite, hypertrophie ventriculaire gauche, anévrisme ventriculaire ancien, syndrome de Brugada, hyperkaliémie, cardiomyopathie de stress. La fiche <button class="w" data-k="i21-ecg-mimic">diagnostics différentiels électriques du sus-décalage (critères distinctifs)</button> donne les éléments qui les séparent.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Attendre l’élévation de la troponine pour décider d’une coronarographie devant un ECG d’occlusion. Dans le STEMI et ses équivalents, la décision repose sur l’ECG et la clinique. La troponine peut être encore normale lors d’une occlusion de moins d’une heure ; la doser ne doit jamais retarder la reperfusion.</div>
<div class="trap"><span class="k">Piège</span>Un ECG normal n’exclut pas un SCA. Il est normal chez une part importante des patients avec NSTE-ACS, et une occlusion de la circonflexe peut ne donner qu’un tracé subnormal. Les dérivations postérieures, la répétition de l’ECG et la troponine sont les parades.</div>

</section>
