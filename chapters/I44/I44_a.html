<section class="ilot" id="i44-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 78 ans est amené aux urgences après une perte de connaissance brutale, sans prodrome, survenue alors qu’il était assis à table. Il a repris conscience en moins d’une minute, pâle puis rouge. Son pouls est à 34/min, régulier. Il prend du bisoprolol pour une hypertension. Quatre questions structurent tout le chapitre : <b>la bradycardie est-elle responsable des symptômes, le patient est-il en danger immédiat, le bloc siège-t-il dans le nœud ou sous le nœud, et la cause est-elle réversible ou faut-il un stimulateur définitif ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait lire méthodiquement un électrocardiogramme de bradycardie, distinguer une dysfonction sinusale d’un bloc auriculoventriculaire, en situer le siège et en déduire le risque. Il sait traiter une bradycardie instable, rechercher et corriger une cause réversible, poser l’indication d’une stimulation définitive, choisir un mode de stimulation, reconnaître les complications d’un stimulateur et conseiller le patient sur la conduite automobile selon les directives suisses. Le référentiel principal est la recommandation de la Société européenne de cardiologie (ESC) de 2021 sur la stimulation cardiaque et la resynchronisation. Aucune nouvelle recommandation ESC sur la stimulation, la bradycardie ou la syncope n’a paru en 2025 ni en août 2026 : les textes de 2021 et de 2018 restent en vigueur en septembre 2026. Les recommandations ESC 2026 sur l’insuffisance cardiaque et sur la maladie rénale chronique ne portent pas sur la stimulation, mais redéfinissent la fraction d’éjection réduite (&lt; 50 %). Ces textes sont complétés par le consensus clinique ESC de 2025 sur la stimulation du système de conduction.</p>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="i44-automat">automatisme et la hiérarchie des centres d’entraînement (fréquences des rythmes d’échappement)</button>, la <button class="w" data-k="i44-decrem">conduction décrémentielle du nœud auriculoventriculaire (ralentissement dépendant de la fréquence)</button> et l’<button class="w" data-k="i44-vago">influence du système nerveux autonome sur le nœud (vague et sympathique)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i44-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Une <b>bradycardie</b> est une fréquence cardiaque inférieure à 50/min selon l’ESC 2021. Ce seuil est un repère et non une maladie : un sportif entraîné peut avoir 42/min au repos et une conduction parfaitement saine. Le problème clinique n’est pas le chiffre, mais l’inadéquation entre la fréquence et les besoins, ou le risque d’une pause prolongée. Les bradycardies pathologiques relèvent de deux mécanismes : soit l’impulsion n’est pas <b>produite</b> (dysfonction sinusale), soit elle n’est pas <b>conduite</b> (bloc).</p>
<h3>1.1 Codes de la CIM-10</h3>
<table class="t"><tr><th>Code</th><th>Contenu</th><th>Exemple</th></tr>
<tr><td>I44.0 à I44.3</td><td>Blocs auriculoventriculaires du premier degré, du deuxième degré, complet, autres</td><td>Bloc de Mobitz II chez un homme de 80 ans</td></tr>
<tr><td>I44.4 à I44.7</td><td>Blocs fasciculaires antérieur et postérieur gauches, autres blocs fasciculaires, bloc de branche gauche</td><td>Hémibloc antérieur gauche isolé</td></tr>
<tr><td>I45.0 à I45.4</td><td>Blocs de branche droits, blocs bifasciculaire et trifasciculaire, bloc intraventriculaire non spécifique</td><td>Bloc de branche droit et hémibloc antérieur gauche</td></tr>
<tr><td>I45.5, I45.6, I45.8, I45.9</td><td>Autres blocs précisés (dont le bloc sino-auriculaire), syndrome de pré-excitation, autres troubles précisés (dont le QT long congénital), trouble non précisé</td><td>Bloc sino-auriculaire du deuxième degré</td></tr>
<tr><td>I49.5</td><td>Maladie du sinus (codée dans le chapitre I49)</td><td>Syndrome bradycardie-tachycardie</td></tr></table>
<p>La pré-excitation et le QT long, codés en I45, sont traités dans le chapitre des tachycardies. Le présent chapitre couvre les troubles de la conduction et toutes les bradycardies, y compris la dysfonction sinusale.</p>
<h3>1.2 Dysfonction sinusale et maladie de l’oreillette</h3>
<p>La <b>dysfonction sinusale</b> regroupe les anomalies de production ou de sortie de l’influx sinusal : bradycardie sinusale inappropriée, pause ou arrêt sinusal, <button class="w" data-k="i44-bsa">bloc sino-auriculaire (influx produit mais non transmis à l’oreillette)</button>, <button class="w" data-k="i44-chrono">incompétence chronotrope (fréquence insuffisante à l’effort)</button>. On parle de <b>maladie de l’oreillette</b> lorsque la dysfonction sinusale s’associe à des tachyarythmies auriculaires. Sa forme la plus typique est le <button class="w" data-k="i44-mdo">syndrome bradycardie-tachycardie (pause à l’arrêt d’un accès de fibrillation auriculaire)</button>.</p>
<h3>1.3 Blocs auriculoventriculaires</h3>
<p>Le bloc auriculoventriculaire (BAV) est un retard ou une interruption de la conduction entre les oreillettes et les ventricules. Il se classe en degrés selon l’électrocardiogramme.</p>
<table class="t"><tr><th>Degré</th><th>Définition électrocardiographique</th><th>Siège habituel</th></tr>
<tr><td>Premier degré</td><td>PR &gt; 200 ms ; toutes les ondes P sont conduites</td><td>Nodal le plus souvent</td></tr>
<tr><td>Deuxième degré, Mobitz I (Wenckebach)</td><td>Allongement progressif du PR jusqu’à une onde P bloquée</td><td>Nodal le plus souvent</td></tr>
<tr><td>Deuxième degré, Mobitz II</td><td>PR constant, puis onde P soudainement bloquée</td><td>Infranodal (faisceau de His ou branches)</td></tr>
<tr><td>2:1</td><td>Une onde P sur deux est bloquée ; Mobitz I et II ne peuvent pas être distingués sur ce seul tracé</td><td>Nodal ou infranodal</td></tr>
<tr><td><button class="w" data-k="i44-hautdeg">Haut degré ou avancé (définition ESC 2021, signification)</button></td><td>Au moins deux ondes P consécutives bloquées, à fréquence auriculaire physiologique, avec une conduction persistante par moments</td><td>Souvent infranodal</td></tr>
<tr><td>Troisième degré (complet)</td><td>Aucune onde P conduite : dissociation auriculoventriculaire complète, avec un rythme d’échappement</td><td>Nodal ou infranodal</td></tr></table>
<div class="trap"><span class="k">Piège</span>Dissociation auriculoventriculaire ne signifie pas bloc complet. Si le rythme ventriculaire est plus rapide que le rythme auriculaire (rythme jonctionnel accéléré, tachycardie ventriculaire), les oreillettes et les ventricules battent indépendamment sans aucun bloc. Le bloc complet n’est affirmé que si des ondes P tombant à un moment où elles devraient être conduites ne le sont pas. Voir la <button class="w" data-k="i44-dissoc">distinction entre dissociation et bloc complet (critères)</button>.</div>
<h3>1.4 Blocs de branche et hémiblocs</h3>
<p>Sous le faisceau de His, la conduction se partage entre la branche droite et la branche gauche ; celle-ci se divise en un fascicule antérieur et un fascicule postérieur. Un bloc de branche élargit le QRS à 120 ms ou plus, car un ventricule est alors activé lentement, de proche en proche, par le myocarde du ventricule opposé. Un <b>hémibloc</b> (bloc fasciculaire) ne dévie que l’axe, sans élargir franchement le QRS. Un <b>bloc bifasciculaire</b> associe un bloc de branche droit et un hémibloc, ou désigne un bloc de branche gauche complet. Le terme « trifasciculaire » est souvent employé à tort : voir la <button class="w" data-k="i44-trifasc">terminologie bifasciculaire et trifasciculaire (usage correct)</button>.</p>
</section>

<section class="ilot" id="i44-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les troubles de la conduction sont d’abord des maladies du sujet âgé. La fibrose dégénérative du tissu de conduction progresse avec les décennies ; la plupart des stimulateurs sont implantés après 70 ans. La dysfonction sinusale et le BAV sont les deux premières indications de stimulation en Europe.</p>
<p>Chez l’adulte jeune, un BAV du premier degré est présent chez environ 1 à 2 % des sujets ; sa fréquence augmente après 60 ans. Le bloc de branche droit touche environ 1 % de la population adulte et devient plus fréquent avec l’âge ; isolé, chez un sujet sans cardiopathie, il n’a pas de valeur pronostique péjorative démontrée. Le bloc de branche gauche est plus rare et s’associe beaucoup plus souvent à une cardiopathie sous-jacente (hypertensive, ischémique, cardiomyopathie). Dans la cohorte américaine ARIC, l’incidence de la dysfonction sinusale était d’environ 0,8 pour 1 000 personnes-années ; elle augmente fortement avec l’âge.</p>
<p>Le pronostic dépend du siège du bloc et de la cardiopathie associée, et non du degré seul. Un BAV complet acquis non appareillé a une mortalité élevée, par syncope, insuffisance cardiaque et mort subite ; la stimulation a transformé ce pronostic. À l’inverse, la dysfonction sinusale ne réduit pas la survie en elle-même : la stimulation y traite les symptômes, et le pronostic est celui des comorbidités, en particulier de la fibrillation auriculaire et de son risque embolique.</p>
<div class="key"><b>Données suisses.</b> La statistique suisse des stimulateurs cardiaques 2023 (Fondation suisse de rythmologie) recense 6 054 primo-implantations et 2 067 remplacements de boîtier. L’âge moyen à la primo-implantation est de 78,6 ans ; 63 % des patients sont des hommes. Les anomalies électrocardiographiques motivant l’implantation sont d’abord le BAV complet (31 %), puis la dysfonction sinusale (16 %), la fibrillation ou le flutter auriculaires lents (12 %), le syndrome bradycardie-tachycardie (12 %) et le BAV du deuxième degré (10 %). Le mode double chambre représente 72 % des implantations, et les stimulateurs sans sonde 7 %. L’incidence des blocs non appareillés, elle, n’est pas publiée en Suisse : les chiffres de prévalence ci-dessus proviennent de cohortes européennes et nord-américaines.</div>
<button class="pareto-btn ui" data-k="pareto-i44-def">▲ Loi de Pareto — Définitions, classifications, épidémiologie</button>
</section>

<section class="ilot" id="i44-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La chaîne de raisonnement est la suivante : <b>production de l’influx (nœud sinusal) → conduction auriculaire → filtrage nodal → conduction rapide infranodale (His, branches, Purkinje) → activation ventriculaire.</b> Chaque étape peut être atteinte ; la gravité dépend de l’étape atteinte et de la fiabilité du rythme d’échappement.</p>
<h3>3.1 Le nœud sinusal et la dysfonction sinusale</h3>
<p>Les cellules du nœud sinusal se dépolarisent spontanément pendant la diastole, grâce au <button class="w" data-k="i44-pa">potentiel d’action nodal (courant If et courant calcique)</button>. Le système parasympathique ralentit cette pente de dépolarisation ; le sympathique l’accélère. La dysfonction sinusale résulte le plus souvent d’une fibrose dégénérative du nœud et de l’oreillette qui l’entoure. Elle explique trois tableaux : une bradycardie permanente, des pauses brutales et une incapacité à accélérer à l’effort.</p>
<p>Dans la maladie de l’oreillette, les mêmes lésions de l’oreillette favorisent la fibrillation auriculaire. À l’arrêt de l’accès, le nœud sinusal, qui a été freiné par la tachycardie, redémarre avec retard : c’est la <button class="w" data-k="i44-overdrive">suppression par surcharge (pause à l’arrêt d’une tachycardie)</button>. Cette pause, parfois de plusieurs secondes, est la cause des syncopes du syndrome bradycardie-tachycardie.</p>
<h3>3.2 Le nœud auriculoventriculaire : un ralentissement physiologique</h3>
<p>Le nœud auriculoventriculaire conduit lentement, grâce à des cellules dépendantes du calcium et pauvres en jonctions communicantes. Ce retard laisse aux oreillettes le temps de remplir les ventricules. Plus l’influx arrive tôt, plus il est freiné : c’est la <button class="w" data-k="i44-decrem">conduction décrémentielle (définition et mécanisme)</button>. Le nœud est riche en innervation vagale. Un bloc nodal est donc souvent <b>fonctionnel, réversible et sensible à l’atropine et à l’effort</b> : sommeil, vagotonie, médicaments, infarctus inférieur.</p>
<h3>3.3 Le système infranodal : conduction rapide, sans réserve fonctionnelle</h3>
<p>Le faisceau de His, ses branches et le réseau de Purkinje conduisent très vite grâce au courant sodique rapide. Ils sont peu sensibles au système nerveux autonome. Une atteinte infranodale est presque toujours <b>lésionnelle</b> (fibrose, nécrose septale, calcification, infiltration) et évolutive. Surtout, le rythme qui assure la commande ventriculaire en cas de bloc complet est un <button class="w" data-k="i44-echap">rythme d’échappement (hiérarchie, fréquence et fiabilité)</button> ventriculaire, lent (20 à 40/min), à QRS larges et instable, capable de s’arrêter brusquement.</p>
<div class="key"><b>Corrélation physiologie → clinique → décision.</b> Tout le chapitre repose sur la distinction du <button class="w" data-k="i44-site">siège du bloc (nodal ou infranodal : conséquences)</button>. Un bloc nodal a un échappement jonctionnel à QRS fin, de 40 à 60/min, fiable, qui accélère sous atropine : il est rarement dangereux et souvent réversible. Un bloc infranodal a un échappement ventriculaire lent et instable : il expose à l’asystolie et à la mort subite, et il justifie une stimulation même en l’absence de symptôme.</div>
<h3>3.4 Pourquoi une bradycardie produit des symptômes</h3>
<p>Le débit cardiaque est le produit de la fréquence par le volume d’éjection. Un cœur sain compense une fréquence basse en augmentant son volume d’éjection, jusqu’à une limite. Au-delà, le débit baisse : fatigue, dyspnée d’effort, insuffisance cardiaque, confusion. Une pause brutale, elle, interrompt le débit cérébral : une perte de connaissance survient après environ 6 à 8 secondes d’asystolie chez un sujet debout, plus tôt s’il existe une hypotension. C’est la <button class="w" data-k="i44-s-syncope">syncope de Stokes-Adams (perte de connaissance brutale sans prodrome)</button>.</p>
<p>La perte de la synchronisation auriculoventriculaire a aussi un coût. Quand l’oreillette se contracte contre une valve tricuspide fermée, le sang reflue dans les veines jugulaires : ce sont les <button class="w" data-k="i44-e-canon">ondes a en canon (contraction auriculaire contre valve fermée)</button>. Le même mécanisme explique le <button class="w" data-k="i44-sdpm">syndrome du stimulateur (perte de la synchronie auriculoventriculaire)</button>.</p>

<section class="ilot" id="i44-4"><h2><span class="n">4</span>Étiologies et causes réversibles</h2>
<p>Avant de poser un stimulateur, il faut toujours se demander si la cause est réversible. L’ESC 2021 ne recommande pas de stimulation (classe III) pour une bradycardie due à une cause transitoire qui peut être corrigée et prévenue. L’aide-mémoire <button class="w" data-k="i44-mnemo-miltha">MILTHA (causes réversibles à éliminer avant toute stimulation)</button> résume les principales.</p>
<div class="two">
<div class="card"><h4>Causes intrinsèques dégénératives</h4><p>Fibrose idiopathique du tissu de conduction, la première cause chez le sujet âgé : <button class="w" data-k="i44-lev">maladie de Lev-Lenègre (fibrose et calcification progressives)</button>. Calcifications de l’anneau mitral et de la valve aortique, qui s’étendent au faisceau de His.</p></div>
<div class="card"><h4>Causes ischémiques</h4><p>Infarctus inférieur : bloc nodal, souvent transitoire. Infarctus antérieur étendu : bloc infranodal, de mauvais pronostic. Voir le <button class="w" data-k="i21-bav">BAV compliquant l’infarctus (siège et conduite)</button>. La cardiopathie ischémique chronique peut aussi léser le tissu de conduction.</p></div>
<div class="card"><h4>Causes iatrogènes procédurales</h4><p>Implantation d’une valve aortique percutanée : voir le <button class="w" data-k="i35-pacemaker">bloc après remplacement valvulaire aortique (facteurs prédictifs)</button>. Chirurgie valvulaire, surtout aortique et mitrale ; alcoolisation septale ; ablation par cathéter à proximité du nœud.</p></div>
<div class="card"><h4>Causes infiltratives, inflammatoires et génétiques</h4><p><button class="w" data-k="i42-sarcoid">Sarcoïdose cardiaque (BAV avant 60 ans)</button>, amylose, <button class="w" data-k="i44-lyme">cardite de Lyme (BAV fluctuant, réversible sous antibiotique)</button>, endocardite avec abcès de l’anneau aortique, maladie de Chagas chez le migrant d’Amérique latine. Maladies génétiques : <button class="w" data-k="i42-lmna">cardiomyopathie liée à LMNA (bloc puis arythmie ventriculaire)</button>, <button class="w" data-k="i44-neuromusc">dystrophie myotonique de type 1 (atteinte infranodale progressive)</button>. <button class="w" data-k="i44-congen">BAV congénital (anticorps maternels anti-Ro)</button>.</p></div>
<div class="card"><h4>Causes extrinsèques fonctionnelles</h4><p>Hypertonie vagale : athlète, sommeil, douleur, vomissement, <button class="w" data-k="i44-saos">apnées obstructives du sommeil (bradycardies nocturnes)</button>, syncope réflexe. <button class="w" data-k="i44-hypothyr">Hypothyroïdie et hypothermie (bradycardie sinusale, ondes d’Osborn)</button>. Hypertension intracrânienne (réaction de Cushing).</p></div>
<div class="card"><h4>Causes médicamenteuses et métaboliques</h4><p><button class="w" data-k="i44-medic">Médicaments bradycardisants (liste et conduite)</button> : bêtabloquants y compris en collyre, vérapamil, diltiazem, digoxine, amiodarone, ivabradine, clonidine, anticholinestérasiques, lithium. <button class="w" data-k="i44-hyperk">Hyperkaliémie (signes électrocardiographiques)</button>, et leur association dans le <button class="w" data-k="i44-brash">syndrome BRASH (cercle hyperkaliémie–bradycardie–insuffisance rénale)</button>.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure à une cause médicamenteuse et arrêter l’enquête. Un BAV de haut degré apparu sous bêtabloquant ou sous vérapamil révèle très souvent une maladie de conduction sous-jacente. Dans les séries observationnelles, une part importante de ces blocs persiste ou récidive malgré l’arrêt du médicament. Après l’arrêt, on surveille : si le bloc persiste au-delà de cinq demi-vies, ou s’il récidive, la stimulation est indiquée. Un bloc de Mobitz II ou un bloc complet à QRS large n’est presque jamais d’origine purement médicamenteuse.</div>
<div class="trap"><span class="k">Piège</span>Chez un adulte de moins de 60 ans sans cause évidente, un BAV impose de rechercher une maladie infiltrative ou inflammatoire, en premier lieu une sarcoïdose (IRM cardiaque, tomographie par émission de positons), et une maladie génétique (<i>LMNA</i>). L’ESC 2021 recommande une imagerie de caractérisation tissulaire (classe IIa) chez ces patients, et un test génétique en cas de maladie de conduction progressive d’apparition précoce, avant 50 ans (classe IIa).</div>

</section>

<section class="ilot" id="i44-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse a deux objectifs : établir le lien entre la bradycardie et les symptômes, et découvrir une cause réversible. Elle se conduit dans l’ordre : antécédents, traitements, puis symptômes.</p>
<h3>5.1 Antécédents et traitements à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i44-atcd-medic">Liste exhaustive des médicaments (y compris collyres et automédication)</button></li><li><button class="w" data-k="i44-atcd-card">Cardiopathie, chirurgie cardiaque, valve percutanée, ablation (ce qu’ils révèlent)</button></li><li>Maladie thyroïdienne, insuffisance rénale (hyperkaliémie)</li><li>Apnées du sommeil, ronflement, somnolence diurne</li></ul>
<ul><li><button class="w" data-k="i44-atcd-fam">Histoire familiale de stimulateur, de mort subite ou de maladie neuromusculaire (orientation génétique)</button></li><li>Piqûre de tique, érythème migrant, randonnée en forêt</li><li>Sarcoïdose, maladie auto-immune (lupus, syndrome de Sjögren), grossesse avec anticorps anti-Ro</li><li>Activité sportive d’endurance intensive</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i44-s-fatigue">Fatigue et intolérance à l’effort (incompétence chronotrope)</button></li><li><button class="w" data-k="i44-s-vertige">Vertiges et présyncopes (caractérisation)</button></li><li><button class="w" data-k="i44-s-syncope">Syncope brutale sans prodrome (Stokes-Adams)</button></li><li>Dyspnée d’effort, signes d’insuffisance cardiaque</li></ul>
<ul><li><button class="w" data-k="i44-s-palp">Palpitations suivies d’un malaise (maladie de l’oreillette)</button></li><li><button class="w" data-k="i44-s-cogn">Chutes, troubles cognitifs, confusion chez le sujet âgé (démarche)</button></li><li>Angor par baisse du débit coronaire</li><li>Symptômes liés aux causes : frilosité et prise de poids (hypothyroïdie), fièvre et arthralgies (Lyme)</li></ul></div>
<p>La corrélation entre symptômes et rythme est la clé de toute indication fondée sur les symptômes. Une bradycardie sinusale à 45/min découverte chez un patient qui se plaint de fatigue ne prouve pas que la bradycardie cause la fatigue. Il faut documenter le rythme au moment du symptôme ou démontrer que la fréquence ne s’adapte pas à l’effort.</p>
<h3>5.3 Présentations typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique : bloc infranodal</h4><p>Homme de 81 ans, bloc de branche droit et hémibloc antérieur gauche connus. Syncope brutale en marchant, blessure au visage. Électrocardiogramme aux urgences : BAV complet, échappement à 32/min, QRS larges. Indication de stimulation sans délai.</p></div>
<div class="card"><h4>Forme typique : maladie de l’oreillette</h4><p>Femme de 74 ans. Palpitations irrégulières de quelques minutes, suivies d’un voile noir et d’une chute. Holter : fibrillation auriculaire paroxystique, puis pause sinusale de 5,2 secondes à son arrêt. Les bradycardisants nécessaires au contrôle de la fibrillation aggraveraient les pauses : stimulation, puis traitement de la fibrillation.</p></div>
<div class="card"><h4>Forme atypique : gériatrique</h4><p>Homme de 86 ans adressé pour « chutes à répétition » et déclin cognitif. Pas de syncope rapportée : l’amnésie de la perte de connaissance est fréquente. Moniteur implantable : pauses de 7 secondes. Les symptômes disparaissent après stimulation.</p></div>
<div class="card"><h4>Forme trompeuse : réversible</h4><p>Randonneur de 34 ans, fatigue et BAV du premier degré à 380 ms, puis bloc 2:1 fluctuant. Piqûre de tique trois semaines plus tôt. Cardite de Lyme : antibiotique, surveillance, stimulation temporaire si nécessaire ; pas de stimulateur définitif d’emblée.</p></div></div>
</section>

<section class="ilot" id="i44-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général → signes vitaux → anthropométrie → signes ciblés. Il répond à trois questions : le patient est-il instable, la dissociation auriculoventriculaire est-elle visible au lit, et existe-t-il un indice de cause ou de cardiopathie ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Conscience, pâleur, marbrures, signes d’insuffisance cardiaque. <button class="w" data-k="i44-e-pouls">Pouls compté sur une minute complète (régularité, déficit)</button>. <button class="w" data-k="i44-e-ta">Pression artérielle (pression différentielle élargie, hypotension orthostatique)</button>, fréquence respiratoire, saturation, température (hypothermie). Poids et indice de masse corporelle, utiles pour évoquer des apnées du sommeil et pour la dose des médicaments.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Signes de dissociation auriculoventriculaire</b><ul><li><button class="w" data-k="i44-e-canon">Ondes a en canon intermittentes aux jugulaires (technique, signification)</button></li><li><button class="w" data-k="i44-e-b1">Intensité variable du premier bruit (bruit de canon)</button></li><li>Pression artérielle systolique variable d’un battement à l’autre</li></ul></div>
<div><b>Retentissement</b><ul><li>Signes d’insuffisance cardiaque (turgescence jugulaire, crépitants, œdèmes)</li><li>Souffle systolique éjectionnel fonctionnel, lié au grand volume d’éjection</li><li>Confusion, hypoperfusion : critères d’instabilité</li></ul></div>
<div><b>Indices de cause</b><ul><li>Souffle de rétrécissement aortique calcifié</li><li>Signes d’hypothyroïdie : peau sèche, réflexes lents, œdème non prenant le godet</li><li>Érythème migrant, arthrite, paralysie faciale (Lyme)</li><li>Myotonie, ptosis, calvitie frontale (dystrophie myotonique)</li></ul></div>
<div><b>Manœuvres</b><ul><li><button class="w" data-k="i44-e-msc">Massage sinocarotidien (technique, critères, contre-indications)</button></li><li><button class="w" data-k="i44-e-orthostat">Test d’orthostatisme actif (trois minutes debout)</button></li><li>Effort simple au lit (flexions) : la fréquence accélère-t-elle ?</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Le pouls peut être inférieur à la fréquence électrique. En bigéminisme ventriculaire, l’extrasystole précoce ne génère pas d’onde de pouls : le pouls compte 40/min pour une fréquence électrique de 80/min. Une « bradycardie » au saturomètre ou au tensiomètre automatique doit toujours être vérifiée sur l’électrocardiogramme.</div>
<button class="pareto-btn ui" data-k="pareto-i44-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>

<section class="ilot" id="i44-7"><h2><span class="n">7</span>Lecture de l’électrocardiogramme pas à pas</h2>
<p>L’électrocardiogramme à 12 dérivations est l’examen clé. Une lecture méthodique en six étapes évite la plupart des erreurs. Elle part de l’oreillette, puis suit l’influx jusqu’aux ventricules.</p>
<ol><li><b>Fréquence ventriculaire</b> et régularité des QRS.</li>
<li><b>Ondes P</b> : présentes ? sinusales (positives en DI, DII et aVF) ? fréquence auriculaire ? Chercher les ondes P cachées dans les ondes T ou les QRS, en mesurant l’intervalle PP au compas.</li>
<li><b>Relation entre P et QRS</b> : chaque P est-elle suivie d’un QRS ? Chaque QRS est-il précédé d’une P ? Le PR est-il constant, progressivement allongé ou variable sans lien ?</li>
<li><b>Largeur et morphologie des QRS</b> : fin (&lt; 120 ms) ou large ; aspect de bloc de branche ; axe.</li>
<li><b>Pauses</b> : durée en secondes ; multiple exact de l’intervalle PP ou non.</li>
<li><b>Synthèse</b> : mécanisme (production ou conduction), siège probable (nodal ou infranodal), gravité.</li></ol>
<h3>7.1 Dysfonction sinusale</h3>
<p>La <b>bradycardie sinusale</b> garde des ondes P normales, chacune suivie d’un QRS. L’<b>arrêt sinusal</b> est une pause sans onde P, dont la durée n’est pas un multiple de l’intervalle PP de base. Le <button class="w" data-k="i44-bsa">bloc sino-auriculaire (degrés et lecture)</button> du deuxième degré de type II produit au contraire une pause égale à deux fois (ou trois fois) l’intervalle PP. En pratique, la distinction a peu de conséquences : c’est la durée de la pause et sa relation avec les symptômes qui décident.</p>

<h3>7.2 Bloc auriculoventriculaire du premier degré</h3>
<p>Le PR dépasse 200 ms et reste constant ; chaque onde P est conduite. Le retard siège le plus souvent dans le nœud. Isolé, il est habituellement bénin. Un PR très long, supérieur à 300 ms, peut toutefois faire contracter l’oreillette trop tôt, pendant le remplissage ventriculaire, et reproduire un syndrome du stimulateur.</p>

<h3>7.3 Bloc de Mobitz I (Wenckebach)</h3>
<p>Le PR s’allonge d’un battement à l’autre jusqu’à ce qu’une onde P ne soit pas conduite. Le cycle recommence avec le PR le plus court. Trois signes aident à le reconnaître : le PR qui suit la pause est le plus court ; l’incrément du PR diminue d’un battement à l’autre, si bien que les intervalles RR se raccourcissent avant la pause ; la pause est inférieure à deux intervalles PP. Les QRS groupés par deux, trois ou quatre forment un aspect caractéristique. Voir la <button class="w" data-k="i44-mob1">fiche du bloc de Mobitz I (siège, décision, pièges)</button>.</p>

<h3>7.5 Bloc 2:1</h3>
<p>Une onde P sur deux est bloquée. Il n’y a jamais deux PR consécutifs à comparer : on ne peut donc pas parler de Mobitz I ou II sur ce seul tracé. On raisonne sur des indices : un PR long des battements conduits avec des QRS fins oriente vers un bloc nodal ; un PR normal avec un bloc de branche oriente vers un bloc infranodal. Le tracé long (Holter) peut montrer des séquences de Wenckebach ailleurs. L’<button class="w" data-k="i44-21">analyse du bloc 2:1 (indices et épreuves)</button> est détaillée en fenêtre.</p>

<h3>7.6 Bloc de haut degré et bloc complet</h3>
<p>Dans le <b>bloc complet</b>, les ondes P sont régulières, plus rapides que les QRS, et sans relation fixe avec eux : le PR varie au hasard. Les QRS sont réguliers, portés par un échappement. Un échappement à QRS fin, de 40 à 60/min, oriente vers un bloc nodal ; un échappement à QRS large, de 20 à 40/min, vers un bloc infranodal. Voir la <button class="w" data-k="i44-bav3">fiche du BAV complet (formes, échappement, pièges)</button>.</p>

<figcaption>Figure 7 — BAV complet. Ondes P régulières à 80/min, certaines cachées dans les QRS ou les ondes T ; QRS larges et réguliers à 35/min, sans relation avec les P : échappement ventriculaire, bloc infranodal. Schéma pédagogique.</figcaption></figure>
<div class="trap"><span class="k">Piège</span>En fibrillation auriculaire, il n’y a pas d’onde P. Un rythme ventriculaire <b>lent et parfaitement régulier</b> au cours d’une fibrillation auriculaire signe un bloc complet avec échappement : c’est la « régularisation » de la fibrillation, à évoquer notamment devant une intoxication digitalique.</div>
<div class="trap"><span class="k">Erreur fréquente</span>Qualifier de Mobitz II une onde P prématurée non conduite. Une extrasystole auriculaire précoce, cachée dans l’onde T, trouve le nœud encore réfractaire : elle est physiologiquement bloquée. La clé est l’intervalle PP : dans un vrai Mobitz II, l’onde P bloquée arrive à l’heure. Voir les <button class="w" data-k="i44-pseudo">pièges de lecture des blocs (fausses pauses)</button>.</div>
<h3>7.7 Blocs de branche et hémiblocs</h3>
<table class="t"><tr><th>Trouble</th><th>Critères principaux (AHA/ACCF/HRS 2009)</th><th>Signification</th></tr>
<tr><td><button class="w" data-k="i44-bbd">Bloc de branche droit (critères, pièges)</button></td><td>QRS ≥ 120 ms ; rsR′ en V1–V2 ; onde S large en DI et V6</td><td>Fréquent, souvent bénin isolé ; embolie pulmonaire, cardiopathie droite, Brugada</td></tr>
<tr><td><button class="w" data-k="i44-bbg">Bloc de branche gauche (critères, critères de Strauss)</button></td><td>QRS ≥ 120 ms ; R larges et crochetés en DI, aVL, V5–V6 ; pas d’onde q en DI, V5–V6 ; ST-T discordant</td><td>Presque toujours pathologique : chercher une cardiopathie ; asynchronisme</td></tr>
<tr><td><button class="w" data-k="i44-hbag">Hémibloc antérieur gauche (critères)</button></td><td>Axe entre −45° et −90° ; qR en aVL ; rS en DII, DIII et aVF ; QRS &lt; 120 ms</td><td>Fréquent chez le sujet âgé ; bénin isolé</td></tr>
<tr><td><button class="w" data-k="i44-hbpg">Hémibloc postérieur gauche (diagnostic d’élimination)</button></td><td>Axe entre +90° et +180° ; rS en DI et aVL ; qR en DIII et aVF ; après exclusion d’une hypertrophie droite</td><td>Rare, car le fascicule postérieur est épais et doublement vascularisé : témoigne d’une atteinte étendue</td></tr>
<tr><td><button class="w" data-k="i44-alternant">Bloc de branche alternant (définition, décision)</button></td><td>Bloc de branche droit et bloc de branche gauche sur des tracés successifs, ou bloc droit avec alternance des hémiblocs</td><td>Atteinte des trois fascicules : indication de stimulation (classe I)</td></tr></table>
<div class="key"><b>Corrélation anatomie → ECG → pronostic.</b> Le fascicule antérieur gauche est long, fin et vascularisé par une seule source (branches septales de l’interventriculaire antérieure) : il se bloque souvent, et un hémibloc antérieur isolé est banal. Le fascicule postérieur est court, large et doublement vascularisé : son blocage suppose une lésion étendue. Un bloc de branche droit associé à un hémibloc ne laisse qu’un seul fascicule pour conduire : toute syncope doit alors faire rechercher un bloc paroxystique.</div>
