
<!-- ===== FENÊTRES I44 : notions fondamentales ===== -->
<template data-pop="i44-automat" data-title="Automatisme et hiérarchie des centres d’entraînement">
<div class="lab">Définition</div><p>L’automatisme est la capacité d’une cellule à se dépolariser spontanément jusqu’au seuil, sans stimulus externe. Toutes les cellules du tissu de conduction en sont capables, à des fréquences décroissantes du haut vers le bas.</p>
<div class="lab">Hiérarchie</div><p>Nœud sinusal : 60–100/min. Jonction auriculoventriculaire : 40–60/min. His-Purkinje et myocarde ventriculaire : 20–40/min.</p>
<div class="lab">Principe</div><p>Le centre le plus rapide dépolarise les autres avant qu’ils n’atteignent leur seuil et les freine. Si le centre dominant s’arrête, le centre suivant prend le commandement après une pause.</p>
<div class="lab">Exemple</div><p>Bloc complet nodal : la jonction sous le bloc prend le relais à 45/min avec un QRS fin. Bloc complet sous le faisceau de His : seul un foyer ventriculaire subsiste, à 30/min, avec un QRS large.</p>
<div class="lab">Pourquoi la fréquence décroît du haut vers le bas</div><p>La fréquence d’un centre dépend de la pente de sa dépolarisation diastolique et de l’écart entre son potentiel diastolique et le seuil. Les cellules du nœud sinusal portent beaucoup de canaux HCN4 et presque pas de courant potassique rectifiant entrant : leur potentiel diastolique, vers −60 millivolts, remonte vite jusqu’au seuil. Les cellules de Purkinje ont au contraire un courant potassique rectifiant entrant important, qui les maintient vers −90 millivolts, et un courant If faible : leur pente est plate et leur fréquence basse.</p>
<div class="lab">Conséquence clinique</div><p>Plus le bloc est bas, plus le centre qui prend le relais est lent et sensible à la suppression par surcharge. Un bloc infranodal produit donc une pause longue avant l’échappement, puis un rythme lent ; un bloc nodal laisse une jonction plus rapide prendre le relais.</p>
<div class="lab">Source complémentaire</div><p>Hall, Guyton and Hall Textbook of Medical Physiology, 14e éd., chapitre sur l’excitation rythmique du cœur ; <a href="https://pubmed.ncbi.nlm.nih.gov/20167941/" target="_blank" rel="noopener">The role of the funny current in pacemaker activity</a>, Circ Res 2010;106:434-46.</p>
</template>

<template data-pop="i44-decrem" data-title="Conduction décrémentielle du nœud auriculoventriculaire">
<div class="lab">Définition</div><p>Plus un influx arrive tôt après le précédent, plus sa conduction dans le nœud est lente. Le temps de conduction nodal dépend donc de la fréquence d’arrivée des influx.</p>
<div class="lab">Mécanisme</div><p>La dépolarisation nodale dépend de canaux calciques qui récupèrent lentement après chaque potentiel d’action. Un influx précoce trouve des canaux partiellement disponibles : la dépolarisation est plus lente et plus faible.</p>
<div class="lab">Conséquences</div><p>Protection des ventricules contre les fréquences auriculaires rapides (fibrillation, flutter). Mécanisme du bloc de Mobitz I : allongement progressif du PR jusqu’au blocage. Le système His-Purkinje, sodique, ne possède pas cette propriété : il conduit normalement ou pas du tout.</p></template>

<template data-pop="i44-vago" data-title="Système nerveux autonome et tissu de conduction">
<div class="lab">Vague</div><p>Innerve densément le nœud sinusal (vague droit surtout) et le nœud auriculoventriculaire (vague gauche surtout). L’acétylcholine ralentit la fréquence sinusale et la conduction nodale.</p>
<div class="lab">Sympathique</div><p>Accélère la fréquence et la conduction nodale par les récepteurs β1.</p>
<div class="lab">Système infranodal</div><p>Peu innervé par le vague : un bloc infranodal n’est ni aggravé par une manœuvre vagale ni amélioré par l’atropine.</p>
<div class="lab">Exemples cliniques</div><p>Bradycardie et Mobitz I du sommeil, vomissement, douleur viscérale, intubation, syncope réflexe : tous nodaux et vagaux.</p></template>

<template data-pop="i44-pa" data-title="Potentiel d’action nodal">
<div class="lab">Phase 4</div><p>Dépolarisation diastolique lente due au courant If (canaux HCN4, activés par l’hyperpolarisation, perméables au sodium et au potassium), puis au courant calcique de type T. Sa pente détermine la fréquence.</p>
<div class="lab">Phase 0</div><p>Dépolarisation lente, portée par le courant calcique de type L ; le courant sodique rapide est absent. La vitesse de conduction est donc faible.</p>
<div class="lab">Phase 3</div><p>Repolarisation par les courants potassiques.</p>
<div class="lab">Modulation</div><p>Sympathique : AMPc ↑, courant If ↑, courant calcique ↑ : fréquence ↑. Vague : canal potassique activé par l’acétylcholine ouvert, courant If ↓ : fréquence ↓.</p>
<div class="lab">Pharmacologie</div><p>Ivabradine : blocage de If. Vérapamil, diltiazem : blocage du courant calcique de type L. Bêtabloquants : blocage β1.</p></template>

<template data-pop="i44-echap" data-title="Rythmes d’échappement">
<div class="lab">Jonctionnel</div><p>QRS fin (ou identique au QRS de base), 40–60/min, régulier ; accélère sous atropine et à l’effort ; habituellement fiable.</p>
<div class="lab">Ventriculaire</div><p>QRS large, 20–40/min ; peu sensible à l’atropine ; instable, peut s’arrêter brutalement (asystolie) ou dégénérer en tachycardie ventriculaire polymorphe lors de pauses avec QT long.</p>
<div class="lab">Piège</div><p>Un QRS fin ne garantit pas un bloc nodal : un échappement issu du faisceau de His, sous un bloc intrahisien, peut avoir un QRS fin. Un QRS large peut être jonctionnel si un bloc de branche préexistait. Le contexte et la fréquence complètent la lecture.</p>
<div class="lab">Médicament dangereux</div><p>Les antiarythmiques (amiodarone, lidocaïne) suppriment l’échappement : ils sont contre-indiqués devant un rythme d’échappement ventriculaire.</p>
<div class="lab">Pourquoi l’échappement ventriculaire est instable</div><p>Un foyer ventriculaire a une dépolarisation diastolique lente : une extrasystole ou une accélération transitoire suffit à le supprimer. La bradycardie allonge en outre la repolarisation ventriculaire. Le QT s’allonge, des post-dépolarisations précoces apparaissent, et une pause peut déclencher une torsade de pointes.</p>
<div class="lab">Pourquoi les antiarythmiques sont dangereux</div><p>La lidocaïne et l’amiodarone bloquent les canaux sodiques et freinent l’automatisme des fibres de Purkinje. Lorsque la commande ventriculaire repose sur ce seul automatisme, elles peuvent provoquer une asystolie. Les extrasystoles et les salves qui accompagnent un échappement lent se traitent en accélérant la fréquence, par isoprénaline ou stimulation, et non en les supprimant.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/20142454/" target="_blank" rel="noopener">Drew et al., Prevention of torsade de pointes in hospital settings</a>, Circulation 2010;121:1047-60 ; <a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">Glikson et al., 2021 ESC Guidelines on cardiac pacing</a>, Eur Heart J 2021;42:3427-3520, section 5.2.</p>
</template>

<template data-pop="i44-site" data-title="Siège du bloc : nodal ou infranodal">
<div class="lab">Principe</div><p>Le siège prédit le risque mieux que le degré : un bloc nodal est souvent fonctionnel et réversible, un bloc infranodal est lésionnel, évolutif et expose à l’asystolie.</p>
<div class="lab">Décision</div><p>Le siège infranodal suffit à indiquer la stimulation, sans attendre les symptômes. Le siège nodal ne l’indique que si les symptômes sont clairement liés au bloc.</p>
<div class="lab">Outils</div><p>Indices électrocardiographiques, épreuve à l’atropine, épreuve d’effort et, si nécessaire, exploration électrophysiologique (intervalle HV) : voir l’îlot 8 et son tableau comparatif.</p></template>

<template data-pop="i44-overdrive" data-title="Suppression par surcharge (pause post-tachycardie)">
<div class="lab">Mécanisme</div><p>Une tachycardie rapide charge les cellules nodales en sodium ; la pompe sodium-potassium, stimulée, hyperpolarise la cellule. À l’arrêt de la tachycardie, le nœud sinusal met du temps à reprendre : c’est le temps de récupération sinusale.</p>
<div class="lab">Normal et pathologique</div><p>Chez le sujet sain, la pause est brève. Dans la maladie de l’oreillette, elle peut durer plusieurs secondes et provoquer une syncope.</p>
<div class="lab">Application</div><p>L’exploration électrophysiologique mesure ce temps après une stimulation auriculaire rapide (temps de récupération sinusale corrigé normal &lt; 525 ms).</p></template>

<template data-pop="i44-bsa" data-title="Bloc sino-auriculaire">
<div class="lab">Définition</div><p>Le nœud sinusal produit l’influx, mais celui-ci n’atteint pas le myocarde auriculaire. L’activité du nœud étant invisible sur l’électrocardiogramme de surface, le bloc se déduit du comportement des ondes P.</p>
<div class="lab">Degrés</div><p><b>Premier degré</b> : invisible en surface. <b>Deuxième degré de type I</b> : raccourcissement progressif des intervalles PP, puis pause inférieure à deux PP. <b>Deuxième degré de type II</b> : pause égale à deux (ou plusieurs) intervalles PP. <b>Troisième degré</b> : aucune onde P ; impossible à distinguer d’un arrêt sinusal en surface.</p>
<div class="lab">Portée pratique</div><p>Même décision que pour la dysfonction sinusale : c’est la relation avec les symptômes qui compte.</p></template>

<template data-pop="i44-chrono" data-title="Incompétence chronotrope">
<div class="lab">Définition</div><p>Incapacité à augmenter la fréquence cardiaque de façon proportionnée à l’effort ou aux besoins métaboliques.</p>
<div class="lab">Critères usuels</div><p>Fréquence maximale &lt; 85 % de la fréquence maximale théorique (220 − âge) lors d’un effort maximal, ou index chronotrope &lt; 0,8. Le seuil de 0,8 correspond à la définition que l’<a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">ESC 2021</a> cite comme la plus employée : l’incapacité d’atteindre 80 % de la réserve de fréquence attendue, c’est-à-dire de la différence entre (220 − âge) et la fréquence de repos. Ces seuils sont abaissés sous bêtabloquant, car le blocage β1 réduit l’accélération sinusale à l’effort.</p>
<div class="lab">Clinique</div><p>Fatigue et dyspnée à l’effort chez un patient dont la fréquence de repos peut être normale.</p>
<div class="lab">Traitement</div><p>Retirer les bradycardisants ; si les symptômes sont nets et liés, stimulation avec asservissement de fréquence (ESC 2021, classe IIa).</p></template>

<template data-pop="i44-mdo" data-title="Syndrome bradycardie-tachycardie">
<div class="lab">Définition</div><p>Association d’une dysfonction sinusale et de tachyarythmies auriculaires (fibrillation, flutter, tachycardie atriale).</p>
<div class="lab">Dilemme thérapeutique</div><p>Les médicaments qui contrôlent la tachycardie aggravent la bradycardie. Deux solutions : stimulation pour permettre ces médicaments (<a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">ESC 2021</a>, classe I) ; ou ablation de la fibrillation auriculaire, qui peut faire disparaître les pauses (classe IIa).</p>
<div class="lab">Anticoagulation</div><p>Le risque embolique est celui de la fibrillation auriculaire : score CHA₂DS₂-VA, indépendamment de la stimulation.</p></template>

<template data-pop="i44-hautdeg" data-title="Bloc auriculoventriculaire de haut degré">
<div class="lab">Définition (ESC 2021)</div><p>Au moins deux ondes P consécutives non conduites, à une fréquence auriculaire physiologique, alors qu’une conduction persiste par moments (rapport 3:1, 4:1).</p>
<div class="lab">Signification</div><p>Presque toujours infranodal chez le sujet âgé ; équivalent pronostique du bloc complet.</p>
<div class="lab">Piège</div><p>En fibrillation auriculaire ou lors d’une tachycardie atriale rapide, la non-conduction de nombreux influx est physiologique : le terme ne s’applique qu’à une fréquence auriculaire physiologique.</p>
<div class="lab">Décision</div><p>Stimulation indiquée, avec ou sans symptômes (classe I), après exclusion d’une cause réversible.</p>
<div class="lab">Pourquoi ce bloc a la gravité d’un bloc complet</div><p>À une fréquence auriculaire physiologique, le nœud a le temps de récupérer entre deux ondes P. La non-conduction de deux ondes P successives ne s’explique donc pas par la période réfractaire normale : elle traduit une conduction défaillante, le plus souvent infranodale, qui peut cesser complètement à tout moment. L’ESC 2021 réunit pour cette raison le bloc avancé, le Mobitz II, le bloc 2:1 infranodal et le bloc complet dans la même indication de stimulation, en l’absence de cause réversible.</p>
<div class="lab">Exception</div><p>Un bloc de haut degré peut aussi être vagal et nodal. Il survient alors pendant le sommeil, une toux, une douleur ou un vomissement, et le sinus ralentit en même temps (intervalle PP qui s’allonge). L’ESC 2021 rappelle que ces formes réflexes ne relèvent pas forcément de la stimulation. Le siège infranodal reste le plus probable pour un bloc permanent du sujet âgé, en dehors de tout contexte vagal ou médicamenteux.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">Glikson et al., 2021 ESC Guidelines on cardiac pacing</a>, Eur Heart J 2021;42:3427-3520, section 5.2 (BAV avancé et BAV paroxystique).</p>
</template>

<template data-pop="i44-dissoc" data-title="Dissociation auriculoventriculaire et bloc complet">
<div class="lab">Dissociation</div><p>Oreillettes et ventricules battent indépendamment. Elle a deux causes : un bloc (les P ne passent pas) ou une accélération d’un foyer inférieur plus rapide que le sinus (rythme jonctionnel accéléré, tachycardie ventriculaire).</p>
<div class="lab">Critère du bloc complet</div><p>Fréquence auriculaire supérieure à la fréquence ventriculaire, et des ondes P tombant au moment où elles devraient être conduites (hors période réfractaire) ne le sont pas.</p>
<div class="lab">Exemple</div><p>P à 60/min, QRS fins à 70/min sous digoxine : dissociation par rythme jonctionnel accéléré, sans bloc. P à 90/min, QRS larges à 32/min : bloc complet.</p>
<div class="lab">Captures</div><p>Un battement conduit précocement au milieu d’une dissociation (capture) prouve que la conduction existe : ce n’est pas un bloc complet.</p></template>

<template data-pop="i44-trifasc" data-title="Terminologie : bifasciculaire et trifasciculaire">
<div class="lab">Trois fascicules</div><p>Branche droite, fascicule antérieur gauche, fascicule postérieur gauche.</p>
<div class="lab">Bloc bifasciculaire</div><p>Bloc de branche droit avec hémibloc antérieur gauche (le plus fréquent) ou postérieur gauche ; le bloc de branche gauche complet est aussi considéré comme bifasciculaire.</p>
<div class="lab">Usage incorrect</div><p>« Bloc trifasciculaire » pour un bloc bifasciculaire avec PR long : le PR long peut être nodal et ne prouve pas l’atteinte du troisième fascicule.</p>
<div class="lab">Vrai bloc trifasciculaire</div><p>Bloc de branche alternant, ou bloc bifasciculaire avec HV allongé ou bloc infrahisien démontré.</p>
<div class="lab">Conséquence</div><p>Bloc bifasciculaire avec PR long asymptomatique : pas d’indication de stimulation ; surveillance et consigne de consulter en cas de syncope.</p></template>

<template data-pop="i44-sdpm" data-title="Syndrome du stimulateur">
<div class="lab">Définition</div><p>Ensemble de symptômes dus à la perte de la synchronie auriculoventriculaire, classiquement en stimulation ventriculaire VVI.</p>
<div class="lab">Mécanisme</div><p>L’oreillette se contracte contre une valve fermée, parfois activée de façon rétrograde par le ventricule. La contribution auriculaire au remplissage est perdue ; le reflux veineux et l’étirement auriculaire déclenchent un réflexe vasodépresseur.</p>
<div class="lab">Clinique</div><p>Fatigue, vertiges, présyncope, battements dans le cou, ondes a en canon, chute de la pression artérielle lorsque la stimulation prend le relais.</p>
<div class="lab">Prévention et traitement</div><p>Stimulation double chambre (DDD) chez le patient en rythme sinusal. Un BAV du premier degré très long (&gt; 300 ms) peut produire un tableau analogue sans stimulateur.</p></template>

<template data-pop="i44-rvpace" data-title="Cardiomyopathie induite par la stimulation ventriculaire droite">
<div class="lab">Mécanisme</div><p>La stimulation à la pointe du ventricule droit active le ventricule gauche lentement, de proche en proche, avec un retard de la paroi latérale : asynchronisme comparable à un bloc de branche gauche.</p>
<div class="lab">Fréquence</div><p>Selon les séries, environ 10 à 20 % des patients très stimulés développent une baisse de la fraction d’éjection au fil des années.</p>
<div class="lab">Facteurs de risque</div><p>Part de stimulation ventriculaire élevée (seuil souvent retenu : &gt; 20 %), fraction d’éjection initiale abaissée, QRS stimulé large.</p>
<div class="lab">Prévention</div><p>Algorithmes favorisant la conduction spontanée ; resynchronisation ou stimulation du système de conduction lorsque la stimulation ventriculaire sera fréquente et que la fraction d’éjection est réduite ou limite ; passage à ces modes (mise à niveau) si une dysfonction apparaît.</p>
<div class="lab">Mécanisme, en partie débattu</div><p>L’asynchronisme d’activation n’explique qu’une partie de l’atteinte. La stimulation ventriculaire droite modifie aussi la perfusion myocardique régionale, l’activation neurohormonale et l’expression de protéines cellulaires ; ces mécanismes restent incomplètement compris (ESC 2021).</p>
<div class="lab">Portée du seuil de 20 %</div><p>Le taux de 10 à 20 % est observé après 2 à 4 ans de stimulation ventriculaire droite, chez des patients dont la part de stimulation dépasse en général 20 %. Ce seuil est une association : aucune donnée ne fixe une part de stimulation sous laquelle le risque disparaît. La dysfonction régresse souvent après passage à la resynchronisation (<a href="https://pubmed.ncbi.nlm.nih.gov/29749933/" target="_blank" rel="noopener">Khurshid et al., 2018</a>).</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">Glikson et al., 2021 ESC Guidelines on cardiac pacing</a>, Eur Heart J 2021;42:3427-3520, section 5.2 ; <a href="https://pubmed.ncbi.nlm.nih.gov/29749933/" target="_blank" rel="noopener">Khurshid et al., Reversal of pacing-induced cardiomyopathy following cardiac resynchronization therapy</a>, JACC Clin Electrophysiol 2018;4:168-77.</p>
</template>

<template data-pop="i44-koch" data-title="Triangle de Koch">
<div class="lab">Limites</div><p>Tendon de Todaro en haut, insertion du feuillet septal de la valve tricuspide en bas, ostium du sinus coronaire à la base.</p>
<div class="lab">Contenu</div><p>Le nœud auriculoventriculaire compact se trouve près du sommet ; la voie lente nodale chemine près de la base, au voisinage du sinus coronaire.</p>
<div class="lab">Intérêt</div><p>Repère de l’ablation de la voie lente (tachycardie par réentrée intranodale) : on ablate près de la base pour éviter un BAV. Repère de la stimulation hisienne, au sommet. Zone exposée lors de la chirurgie de la valve tricuspide.</p></template>

<template data-pop="i44-connex" data-title="Connexines et vitesse de conduction">
<div class="lab">Structure</div><p>Six connexines forment un connexon ; deux connexons de cellules voisines forment un canal de jonction communicante, qui laisse passer les ions d’une cellule à l’autre.</p>
<div class="lab">Répartition</div><p>Connexine 43 : myocarde de travail ventriculaire et auriculaire. Connexine 40 : oreillettes et His-Purkinje (forte conductance). Connexine 45 : nœuds sinusal et auriculoventriculaire (faible conductance).</p>
<div class="lab">Corrélation</div><p>Peu de jonctions, faible conductance : conduction lente et décrémentielle du nœud. Nombreuses jonctions de forte conductance : conduction rapide du réseau de Purkinje. La fibrose et l’ischémie réduisent l’expression des connexines et ralentissent la conduction.</p></template>

<template data-pop="i44-lapicque" data-title="Courbe intensité-durée (loi de Lapicque)">
<div class="lab">Formule</div><p>Seuil d’amplitude = rhéobase × (1 + chronaxie / durée d’impulsion).</p>
<div class="lab">Rhéobase</div><p>Amplitude minimale capable de capturer le myocarde avec une impulsion de durée très longue.</p>
<div class="lab">Chronaxie</div><p>Durée d’impulsion pour laquelle le seuil vaut deux fois la rhéobase ; l’énergie consommée est minimale au voisinage de cette durée.</p>
<div class="lab">Marge de sécurité</div><p>On programme habituellement une amplitude égale à deux fois le seuil, ou une durée égale à trois fois le seuil de durée. La marge couvre les variations du seuil (sommeil, repas, médicaments, hyperkaliémie).</p>
<div class="lab">Test de seuil</div><p>On diminue l’amplitude pas à pas à durée fixe jusqu’à la perte de capture, visible sur l’électrocardiogramme : le dernier niveau qui capture est le seuil.</p></template>

<template data-pop="i44-ohm" data-title="Impédance de sonde et loi d’Ohm">
<div class="lab">Loi d’Ohm</div><p>Intensité = tension / résistance. Pour la sonde, on parle d’impédance, qui inclut la résistance du conducteur, l’interface électrode-tissu et le tissu.</p>
<div class="lab">Valeurs</div><p>Habituellement 300 à 1 200 ohms selon la sonde ; plus élevées pour les sondes dites à haute impédance, conçues pour économiser la pile. L’évolution dans le temps compte plus que la valeur isolée.</p>
<div class="lab">Anomalies</div><p><b>Chute brutale</b> (par exemple &lt; 200 ohms) : rupture de l’isolant, fuite de courant, épuisement accéléré de la pile. <b>Hausse brutale</b> (par exemple &gt; 2 000 ohms) : fracture du conducteur ou mauvaise connexion au boîtier ; perte de capture possible.</p>
<div class="lab">Clinique</div><p>Une fracture de sonde survient souvent là où la sonde est comprimée entre la clavicule et la première côte, lors d’un abord sous-clavier médial.</p></template>

<template data-pop="i44-scn5a" data-title="SCN5A et maladies de la conduction">
<div class="lab">Gène</div><p>Code la sous-unité α du canal sodique cardiaque, responsable de la phase 0 rapide du myocarde et du His-Purkinje.</p>
<div class="lab">Perte de fonction</div><p>Conduction ralentie : PR et QRS allongés, maladie progressive de la conduction familiale ; syndrome de Brugada ; dysfonction sinusale ; phénotypes de chevauchement.</p>
<div class="lab">Gain de fonction</div><p>Syndrome du QT long de type 3 (traité dans le chapitre des tachycardies).</p>
<div class="lab">Conséquences</div><p>Éviter les bloqueurs sodiques (antiarythmiques de classe I, certains psychotropes), qui réduisent encore un courant sodique déjà diminué ; traiter la fièvre, car la chaleur accélère l’inactivation de certains canaux mutés (<a href="https://pubmed.ncbi.nlm.nih.gov/10532948/" target="_blank" rel="noopener">Dumaine et al., 1999</a>) ; dépistage des apparentés au premier degré, la transmission étant autosomique dominante.</p></template>

<template data-pop="i44-congen" data-title="BAV congénital lié aux anticorps anti-Ro">
<div class="lab">Mécanisme</div><p>Les anticorps maternels anti-Ro (et anti-La) traversent le placenta et se fixent sur le tissu de conduction fœtal : inflammation puis fibrose du nœud, surtout entre 18 et 24 semaines de gestation.</p>
<div class="lab">Risque</div><p>Environ 1 à 2 % des grossesses de mères porteuses d’anticorps anti-Ro ; risque de récidive d’environ 15 à 20 % après un premier enfant atteint.</p>
<div class="lab">Surveillance</div><p>Mesure échocardiographique fœtale de l’intervalle auriculoventriculaire mécanique, régulière pendant la période à risque. Un bloc complet constitué est irréversible.</p>
<div class="lab">Prévention</div><p>L’hydroxychloroquine a réduit le risque de récidive chez les mères ayant eu un enfant atteint (<a href="https://pubmed.ncbi.nlm.nih.gov/32674792/" target="_blank" rel="noopener">essai PATCH</a>, 2020).</p>
<div class="lab">Chez l’adulte</div><p>BAV complet congénital à QRS fin, souvent longtemps asymptomatique ; stimulation si symptômes ou, chez le patient asymptomatique, en présence d’un facteur de risque : dysfonction ventriculaire, QTc allongé, ectopie ventriculaire complexe, échappement à QRS large, fréquence ventriculaire &lt; 50/min, pauses supérieures à trois fois le cycle de l’échappement (<a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">ESC 2021</a>).</p></template>
<template data-pop="i44-hemodyn" data-title="Débit cardiaque, fréquence et synchronie auriculoventriculaire">
<div class="lab">Physiologie normale</div><p>Le débit cardiaque est le produit de la fréquence par le volume d’éjection : 70/min × 70 mL donnent environ 5 L/min chez l’adulte au repos. Le ventricule se remplit surtout de façon passive, au début de la diastole. La contraction auriculaire ajoute ensuite jusqu’à 20 % environ du remplissage. Plus le ventricule est rempli en fin de diastole, plus il éjecte un grand volume : c’est la loi de Frank et Starling.</p>
<div class="lab">Mécanisme</div><p>Une fréquence basse allonge la diastole. Le ventricule se remplit davantage et éjecte un plus grand volume, ce qui maintient le débit au repos. Cette compensation plafonne vite : le remplissage tardif ajoute peu de sang, et la distensibilité du ventricule limite son volume. Un ventricule hypertrophié ou rigide, fréquent chez le sujet âgé, atteint cette limite plus tôt. À l’effort, une fréquence fixée par un bloc complet, un bloc 2:1 ou une incompétence chronotrope empêche le débit de suivre les besoins. En cas de dissociation auriculoventriculaire, la systole auriculaire tombe au hasard dans le cycle. Juste avant le QRS, elle complète le remplissage ; pendant la systole ventriculaire, elle est perdue et reflue dans les veines jugulaires.</p>
<div class="lab">Conséquence clinique</div><p>Le grand volume d’éjection élargit la pression différentielle et peut produire un souffle éjectionnel fonctionnel. La pression systolique varie d’un battement à l’autre, au gré de la contribution auriculaire. Pendant les longues diastoles, la pression diastolique aortique, qui perfuse les coronaires, s’abaisse, alors que le grand volume éjecté augmente le travail du ventricule : un angor peut apparaître, surtout en présence de sténoses coronaires. À l’effort, le débit insuffisant se traduit par une fatigue et une dyspnée. Un bas débit prolongé active les systèmes rénine-angiotensine-aldostérone et sympathique, qui retiennent le sel et l’eau : l’insuffisance cardiaque s’installe, surtout dans le BAV chronique.</p>
<div class="lab">Ce qui change la décision</div><p>Ces symptômes sont peu spécifiques chez le sujet âgé. Ils ne sont attribués à la bradycardie que si le rythme est enregistré pendant le symptôme, ou si l’épreuve d’effort montre une fréquence insuffisante. La stimulation rétablit la fréquence, donc le débit d’effort. En rythme sinusal, le mode double chambre restaure aussi la synchronie auriculoventriculaire et évite le syndrome du stimulateur : c’est pourquoi l’ESC 2021 le préfère au mode ventriculaire seul dans le BAV (classe IIa).</p>
<div class="lab">Source</div><p>Hall, Guyton and Hall Textbook of Medical Physiology, 14e éd., chapitres sur le cœur comme pompe et sur le débit cardiaque ; <a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">Glikson et al., 2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy</a>, Eur Heart J 2021;42:3427-3520, section 5.2.</p>
