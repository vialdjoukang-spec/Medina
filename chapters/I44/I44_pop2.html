
<!-- ===== FENÊTRES I44 : étiologies et clinique ===== -->
<template data-pop="i44-mnemo-miltha" data-title="MILTHA — causes réversibles d’une bradycardie">
<p><b>M</b> — <b>M</b>édicaments : bêtabloquants (collyres compris), vérapamil, diltiazem, digoxine, amiodarone, ivabradine, clonidine, anticholinestérasiques, lithium ;<br><b>I</b> — <b>I</b>schémie : infarctus inférieur (bloc nodal), antérieur (bloc infranodal) ;<br><b>L</b> — <b>L</b>yme et autres infections ou inflammations : cardite de Lyme, endocardite avec abcès, myocardite ;<br><b>T</b> — <b>T</b>hyroïde : hypothyroïdie ;<br><b>H</b> — <b>H</b>yperkaliémie et <b>H</b>ypothermie ;<br><b>A</b> — <b>A</b>pnées du sommeil et hypertonie vagale (<b>A</b>thlète).</p>
<div class="lab">Aide pédagogique</div><p>Ce moyen mnémotechnique est une aide à la mémoire, non un critère officiel. Ajouter les causes procédurales (chirurgie cardiaque, valve aortique percutanée, ablation), qui sont souvent transitoires dans les premiers jours.</p></template>

<template data-pop="i44-lev" data-title="Maladie de Lev-Lenègre (fibrose dégénérative)">
<div class="lab">Définition</div><p>Fibrose et parfois calcification progressives du tissu de conduction, sans autre cardiopathie. Lenègre a décrit la forme diffuse des branches, plutôt chez le sujet plus jeune ; Lev la forme liée au vieillissement du squelette fibreux (corps fibreux central, anneaux mitral et aortique).</p>
<div class="lab">Évolution</div><p>Bloc de branche droit, puis hémibloc, puis bloc bifasciculaire, puis BAV paroxystique ou complet, sur des années.</p>
<div class="lab">Clinique</div><p>Première cause de BAV complet du sujet âgé. Une forme familiale précoce doit faire rechercher un variant de <i>SCN5A</i> ou de <i>TRPM4</i>.</p></template>

<template data-pop="i44-lyme" data-title="Cardite de Lyme">
<div class="lab">Épidémiologie</div><p>Borréliose transmise par la tique <i>Ixodes ricinus</i>, endémique en Suisse (<i>Borrelia afzelii</i>, <i>B. garinii</i>, <i>B. burgdorferi</i> au sens strict). Une atteinte cardiaque complique environ 1 % des infections, quelques semaines après la piqûre.</p>
<div class="lab">Tableau</div><p>BAV de degré variable, souvent nodal, qui fluctue parfois en quelques minutes du premier au troisième degré ; myopéricardite plus rarement. L’érythème migrant manque ou a été oublié dans une partie des cas.</p>
<div class="lab">Surveillance</div><p>Le bloc fluctue parfois en quelques minutes : un monitorage continu s’impose devant un bloc de haut degré, une syncope ou des signes de myocardite. Aucune recommandation suisse ou européenne ne fixe de seuil de PR imposant l’hospitalisation : la décision repose sur le degré du bloc, son évolution et les symptômes. L’ESC 2021 recommande la sérologie de Lyme devant un bloc inexpliqué du sujet jeune (classe I) et ne retient pas de stimulation définitive lorsque la cause est réversible.</p>
<div class="lab">Traitement</div><p>Information professionnelle suisse Rocephin® : borréliose disséminée (stades II et III), ceftriaxone 50 mg/kg, au maximum 2 g, une fois par jour pendant 14 jours, chez l’adulte comme chez l’enfant. Information professionnelle suisse Doxycline® : maladie de Lyme aux stades 1 et 2, doxycycline 100 mg par voie orale deux fois par jour pendant 10 à 60 jours selon la clinique et la réponse. Le patient monitoré pour un bloc de haut degré reçoit la voie intraveineuse ; la stimulation temporaire comble l’attente si nécessaire.</p>
<div class="lab">Évolution</div><p>Le bloc de haut degré régresse habituellement en une semaine environ ; le PR se normalise en quelques semaines. Un stimulateur définitif n’est discuté que si le bloc persiste après le traitement.</p>
<div class="lab">Score SILC (aide-mémoire COSTAR)</div><p>Symptômes <b>C</b>onstitutionnels (fièvre, malaise, arthralgies) 2 ; activité en plein air ou région d’endémie (<b>O</b>utdoor) 1 ; <b>S</b>exe masculin 1 ; piqûre de <b>T</b>ique 3 ; <b>A</b>ge &lt; 50 ans 1 ; érythème migrant (<b>R</b>ash) 4. Probabilité faible de 0 à 2, intermédiaire de 3 à 6, élevée de 7 à 12. Aide pédagogique proposée par l’équipe de Baranchuk (2018), non critère officiel.</p></template>

<template data-pop="i44-neuromusc" data-title="Dystrophie myotonique de type 1 et maladies neuromusculaires">
<div class="lab">Génétique</div><p>Expansion de triplets CTG dans le gène <i>DMPK</i>, transmission autosomique dominante avec anticipation.</p>
<div class="lab">Atteinte cardiaque</div><p>Fibrose et infiltration graisseuse du His-Purkinje : PR et QRS s’allongent progressivement ; BAV, fibrillation et flutter auriculaires, arythmies ventriculaires, mort subite.</p>
<div class="lab">Surveillance</div><p>Électrocardiogramme au moins annuel ; Holter selon les symptômes ; exploration électrophysiologique si PR ≥ 240 ms ou QRS ≥ 120 ms.</p>
<div class="lab">Stimulation (ESC 2021)</div><p>Tout BAV du deuxième ou troisième degré, ou HV ≥ 70 ms, avec ou sans symptômes : classe I. Discuter un défibrillateur si le risque d’arythmie ventriculaire est élevé.</p>
<div class="lab">Autres maladies</div><p>Dystrophie d’Emery-Dreifuss et laminopathies (<i>LMNA</i>), syndrome de Kearns-Sayre (maladie mitochondriale avec ophtalmoplégie) : même vigilance sur la conduction.</p>
<div class="lab">Pourquoi stimuler sans symptôme</div><p>Dans la dystrophie myotonique de type 1, la fibrose et l’infiltration graisseuse du système His-Purkinje progressent de façon imprévisible, même en l’absence de symptôme. Un BAV du deuxième ou du troisième degré, ou un HV ≥ 70 ms, prouve déjà l’atteinte infranodale : un bloc complet ou une asystolie peuvent suivre sans prodrome. C’est le fondement de l’indication de classe I.</p>
<div class="lab">Signes précoces (ESC 2021)</div><p>Un PR ≥ 240 ms ou un QRS ≥ 120 ms traduisent une atteinte de la conduction encore incomplète. L’ESC 2021 retient qu’un stimulateur peut alors être envisagé (classe IIb) ; l’exploration électrophysiologique aide à décider en mesurant l’intervalle HV. Lorsqu’une stimulation est indiquée dans une maladie neuromusculaire, une resynchronisation ou un défibrillateur sont à envisager selon la fraction d’éjection et le risque d’arythmie ventriculaire.</p>
<div class="lab">Source complémentaire</div><p>Glikson et al., 2021 ESC Guidelines on cardiac pacing, Eur Heart J 2021;42:3427-3520, section 8.6.2 (maladies neuromusculaires).</p>
</template>

<template data-pop="i44-saos" data-title="Apnées obstructives du sommeil et bradycardies nocturnes">
<div class="lab">Mécanisme</div><p>Pendant l’apnée, l’hypoxie et l’effort inspiratoire contre une glotte fermée déclenchent un réflexe vagal intense (réflexe de plongée) : bradycardie sinusale, pauses, BAV nodal, qui cessent à la reprise ventilatoire.</p>
<div class="lab">Indice</div><p>Pauses exclusivement nocturnes chez un ronfleur obèse, somnolent le jour.</p>
<div class="lab">Conduite</div><p>Polygraphie ou polysomnographie. La ventilation en pression positive continue réduit nettement les bradyarythmies. L’ESC 2021 recommande de rechercher un syndrome d’apnées du sommeil chez les patients qui en ont les symptômes et qui présentent une bradycardie sévère ou un BAV avancé pendant le sommeil (classe I). Ce dépistage précède toute décision de stimulation pour des pauses exclusivement nocturnes.</p></template>

<template data-pop="i44-hypothyr" data-title="Hypothyroïdie et hypothermie">
<div class="lab">Hypothyroïdie</div><p>Bradycardie sinusale, microvoltage, ondes T aplaties, QT allongé ; rarement BAV. Épanchement péricardique possible. La bradycardie régresse avec la substitution, à introduire prudemment chez le coronarien.</p>
<div class="lab">Coma myxœdémateux</div><p>Bradycardie, hypothermie, hypoventilation, hyponatrémie : urgence ; hydrocortisone avant la lévothyroxine intraveineuse.</p>
<div class="lab">Hypothermie</div><p>Bradycardie sinusale, ondes d’Osborn (onde J positive à la fin du QRS), fibrillation auriculaire lente. La bradycardie est adaptée à la baisse du métabolisme : on réchauffe, on ne stimule pas.</p>
<div class="lab">Mécanisme de la bradycardie hypothyroïdienne</div><p>Les hormones thyroïdiennes règlent l’expression de gènes cardiaques, dont ceux des récepteurs β1 et de canaux ioniques du nœud sinusal. Leur déficit abaisse la fréquence intrinsèque du sinus et sa réponse aux catécholamines. La bradycardie est donc sinusale, et elle régresse avec la substitution ; le BAV reste rare.</p>
<div class="lab">Pourquoi l’hydrocortisone d’abord</div><p>Dans le coma myxœdémateux, une insuffisance surrénalienne associée est possible. La lévothyroxine accélère le métabolisme du cortisol ; donnée seule, elle peut précipiter une insuffisance surrénalienne aiguë. L’hydrocortisone est donc administrée jusqu’à ce que cette insuffisance soit exclue.</p>
<div class="lab">Source complémentaire</div><p>Klein et Danzi, Thyroid disease and the heart, Circulation 2007;116:1725-35 ; Jonklaas et al., Guidelines for the treatment of hypothyroidism, Thyroid 2014;24:1670-751.</p>
</template>

<template data-pop="i44-medic" data-title="Médicaments bradycardisants : conduite générale">
<div class="lab">Démarche</div><p>1. Identifier et suspendre ou réduire (liste détaillée dans l’onglet Pharmacologie). 2. Surveiller sous monitorage si le bloc est de haut degré. 3. Juger après élimination (environ cinq demi-vies ; plusieurs semaines pour l’amiodarone).</p>
<div class="lab">Interprétation</div><p>Si la conduction se normalise durablement, le médicament était la cause suffisante. Si le bloc persiste ou récidive, une maladie de conduction sous-jacente est probable : stimulation.</p>
<div class="lab">Médicament indispensable</div><p>Si un bradycardisant est nécessaire (fibrillation auriculaire rapide, cardiopathie ischémique), la stimulation permet de le poursuivre.</p></template>

<template data-pop="i44-hyperk" data-title="Hyperkaliémie : signes électrocardiographiques">
<div class="lab">Séquence classique</div><p>Ondes T amples, pointues, symétriques ; puis aplatissement des P et allongement du PR ; puis élargissement du QRS, bradycardie, BAV, rythme sans onde P visible ; enfin aspect sinusoïdal, fibrillation ventriculaire ou asystolie.</p>
<div class="lab">Mécanisme</div><p>La hausse du potassium extracellulaire dépolarise le potentiel de repos, inactive une partie des canaux sodiques et ralentit la conduction ; elle accélère la repolarisation (T pointues).</p>
<div class="lab">Pièges</div><p>La corrélation entre kaliémie et tracé est faible ; l’hyperkaliémie peut simuler un bloc de branche, un sus-décalage ou un rythme idioventriculaire. Le seuil de capture d’un stimulateur s’élève.</p>
<div class="lab">Conduite</div><p>Calcium intraveineux immédiat si l’électrocardiogramme est modifié ; insuline et glucose ; épuration (résines, diurétiques, dialyse) ; arrêt des médicaments hyperkaliémiants.</p></template>

<template data-pop="i44-brash" data-title="Syndrome BRASH">
<div class="lab">Définition</div><p>Association de <b>B</b>radycardie, insuffisance <b>R</b>énale, blocage du nœud auriculoventriculaire (<b>A</b>trioventricular nodal blockade), <b>S</b>hock et <b>H</b>yperkaliémie, décrite en 2020 par Farkas et collaborateurs.</p>
<div class="lab">Mécanisme</div><p>Une hyperkaliémie modérée et un bradycardisant, chacun insuffisant seul, s’additionnent. La bradycardie réduit la perfusion rénale ; l’insuffisance rénale élève la kaliémie et la concentration des bradycardisants hydrosolubles ; la boucle s’auto-entretient.</p>
<div class="lab">Terrain</div><p>Sujet âgé, insuffisant rénal, traité par bêtabloquant ou inhibiteur calcique et par IEC, ARA II ou ARM, lors d’une déshydratation.</p>
<div class="lab">Traitement</div><p>Traiter toutes les composantes à la fois : calcium, insuline et glucose, remplissage si hypovolémie, adrénaline en perfusion, arrêt des bradycardisants, épuration. La stimulation est souvent inutile une fois la boucle rompue.</p>
<div class="lab">Aide pédagogique</div><p>Acronyme anglais, non critère officiel.</p></template>

<template data-pop="i44-atcd-medic" data-title="Anamnèse médicamenteuse d’une bradycardie">
<div class="lab">Question</div><p>« Quels médicaments prenez-vous, y compris gouttes pour les yeux, traitements pour la mémoire, la tension, le cœur, le sommeil ? Un traitement a-t-il été changé récemment ? »</p>
<div class="lab">Pourquoi</div><p>La cause médicamenteuse est la plus fréquente des causes réversibles. Un changement récent de dose, une interaction (macrolide, amiodarone) ou une insuffisance rénale aiguë suffisent à transformer un traitement toléré en intoxication.</p>
<div class="lab">Vérifier</div><p>Plan de médication, liste de la pharmacie, emballages apportés par l’entourage.</p></template>

<template data-pop="i44-atcd-card" data-title="Antécédents cardiaques et procéduraux">
<div class="lab">Rechercher</div><p>Infarctus (territoire), chirurgie valvulaire, valve aortique percutanée, alcoolisation septale, ablation (voie lente nodale, septum), endocardite, cardiopathie congénitale opérée.</p>
<div class="lab">Pourquoi</div><p>Ces antécédents désignent une lésion du tissu de conduction et un siège infranodal probable ; ils orientent aussi le choix du dispositif (fraction d’éjection, défibrillateur, resynchronisation).</p>
<div class="lab">Électrocardiogrammes antérieurs</div><p>Les demander : un bloc de branche ancien, un PR qui s’allonge d’année en année, ou un bloc bifasciculaire récent documentent l’évolution de la maladie.</p></template>

<template data-pop="i44-atcd-fam" data-title="Histoire familiale">
<div class="lab">Questions</div><p>« Des membres de votre famille ont-ils eu un stimulateur avant 50 ans, une mort subite, une maladie musculaire, une cardiomyopathie ? »</p>
<div class="lab">Pourquoi</div><p>Une maladie de conduction familiale oriente vers <i>SCN5A</i>, <i>LMNA</i>, <i>TRPM4</i>, <i>DMPK</i>. Pour <i>LMNA</i>, la décision porte sur un défibrillateur plutôt qu’un stimulateur.</p>
<div class="lab">Conduite</div><p>Test génétique à envisager en cas de maladie de conduction progressive avant 50 ans (ESC 2021, classe IIa) ; dépistage des apparentés.</p></template>

<template data-pop="i44-s-fatigue" data-title="Fatigue et intolérance à l’effort">
<div class="lab">Caractériser</div><p>Seuil d’effort, évolution, somnolence, dyspnée associée, comparaison avec l’état antérieur.</p>
<div class="lab">Physiopathologie</div><p>À l’effort, le débit doit augmenter ; si la fréquence ne suit pas (incompétence chronotrope, bloc 2:1 fixe), le volume d’éjection seul ne suffit pas. Le patient peut être asymptomatique au repos.</p>
<div class="lab">Piège</div><p>Symptôme très peu spécifique chez le sujet âgé : anémie, hypothyroïdie, dépression, déconditionnement, bêtabloquant. La preuve du lien passe par l’épreuve d’effort ou un enregistrement pendant l’activité.</p></template>

<template data-pop="i44-s-vertige" data-title="Vertiges et présyncopes">
<div class="lab">Caractériser</div><p>Sensation de tête vide, de voile noir, d’évanouissement imminent, sans vertige rotatoire. Durée, position, lien avec l’effort, les palpitations, le lever.</p>
<div class="lab">Physiopathologie</div><p>Baisse transitoire du débit cérébral, par pause trop courte pour entraîner une perte de connaissance complète.</p>
<div class="lab">Diagnostic différentiel</div><p>Vertige vestibulaire (rotatoire, nystagmus), hypotension orthostatique (au lever), hypoglycémie, trouble anxieux. Un malaise brutal sans lien avec la position oriente vers une cause rythmique.</p></template>

<template data-pop="i44-s-syncope" data-title="Syncope de Stokes-Adams">
<div class="lab">Description</div><p>Perte de connaissance brutale, sans prodrome ou avec un prodrome de quelques secondes, dans n’importe quelle position, y compris assise ou couchée. Pâleur pendant l’asystolie, car le flux cutané s’arrête, puis rougeur (flush) à la reprise du rythme, quand le sang afflue dans des vaisseaux cutanés dilatés par l’ischémie. Récupération rapide et complète.</p>
<div class="lab">Physiopathologie</div><p>Asystolie par BAV paroxystique ou pause sinusale ; 6 à 8 secondes d’arrêt du débit cérébral suffisent à provoquer la perte de connaissance.</p>
<div class="lab">Signes d’alarme</div><p>Syncope en position couchée ou pendant l’effort, traumatisme facial (absence de protection), palpitations juste avant, cardiopathie connue, bloc de branche.</p>
<div class="lab">Piège</div><p>Une asystolie prolongée peut provoquer quelques secousses myocloniques : ce n’est pas une épilepsie. Ces secousses traduisent l’hypoxie cérébrale ; brèves et irrégulières, elles débutent après la perte de connaissance et cessent avec le retour du débit. Interroger le témoin sur la couleur du visage et la durée.</p></template>

<template data-pop="i44-s-palp" data-title="Palpitations suivies d’un malaise">
<div class="lab">Caractériser</div><p>Palpitations rapides et irrégulières, puis malaise ou syncope à leur arrêt.</p>
<div class="lab">Physiopathologie</div><p>Syndrome bradycardie-tachycardie : pause par suppression du nœud sinusal à la fin de l’accès de fibrillation ou de flutter.</p>
<div class="lab">Conséquence</div><p>Documentation par Holter ou enregistreur ; stimulation pour permettre les bradycardisants, ou ablation de la fibrillation ; anticoagulation selon le score.</p></template>

<template data-pop="i44-s-cogn" data-title="Chutes et troubles cognitifs du sujet âgé">
<div class="lab">Caractériser</div><p>Chute sans cause mécanique, amnésie de l’événement, blessure, confusion fluctuante, fatigue.</p>
<div class="lab">Physiopathologie</div><p>Pauses ou bas débit répétés ; amnésie de la perte de connaissance chez une partie des sujets âgés, qui décrivent seulement une chute.</p>
<div class="lab">Démarche</div><p>Électrocardiogramme, massage sinocarotidien, recherche d’hypotension orthostatique, revue des médicaments (anticholinestérasiques, antihypertenseurs), moniteur implantable si les chutes sont récidivantes et inexpliquées.</p></template>

<template data-pop="i44-e-pouls" data-title="Palpation du pouls dans une bradycardie">
<div class="lab">Technique</div><p>Pouls radial compté sur une minute complète, comparé à la fréquence auscultatoire à la pointe et à l’électrocardiogramme.</p>
<div class="lab">Interprétation</div><p>Pouls lent et régulier : bradycardie sinusale ou bloc complet. Pouls irrégulier avec pauses : bloc de deuxième degré, extrasystoles, fibrillation lente. Déficit de pouls : extrasystoles non éjectantes.</p>
<div class="lab">Piège</div><p>Les appareils automatiques (saturomètre, tensiomètre) comptent mal les battements faibles et affichent de fausses bradycardies ; l’électrocardiogramme tranche.</p></template>

<template data-pop="i44-e-ta" data-title="Pression artérielle dans les bradycardies">
<div class="lab">Mesure</div><p>Aux deux bras, puis debout (hypotension orthostatique). Répétée, car elle varie d’un battement à l’autre en cas de dissociation auriculoventriculaire.</p>
<div class="lab">Interprétation</div><p>Pression différentielle élargie avec systolique élevée : grand volume d’éjection compensateur d’une bradycardie chronique (BAV complet ancien). Hypotension : signe d’instabilité.</p>
<div class="lab">Piège</div><p>Une systolique élevée chez un patient en BAV complet peut faire retenir à tort une hypertension ; elle se normalise souvent après la stimulation.</p></template>

<template data-pop="i44-e-canon" data-title="Ondes a en canon">
<div class="lab">Définition</div><p>Ondes veineuses jugulaires brèves et amples, correspondant à la contraction de l’oreillette droite contre une valve tricuspide fermée.</p>
<div class="lab">Intermittentes et irrégulières</div><p>Dissociation auriculoventriculaire : BAV complet, tachycardie ventriculaire. Elles apparaissent lorsque la contraction auriculaire tombe par hasard pendant la systole ventriculaire.</p>
<div class="lab">Régulières</div><p>Conduction rétrograde un pour un : rythme jonctionnel, stimulation VVI, tachycardie par réentrée intranodale.</p>
<div class="lab">Technique</div><p>Patient à 45°, lumière tangentielle, observation de la jugulaire interne droite en palpant simultanément le pouls carotidien gauche.</p></template>

<template data-pop="i44-e-b1" data-title="Variabilité du premier bruit">
<div class="lab">Mécanisme</div><p>L’intensité du premier bruit dépend de la position des valves auriculoventriculaires au début de la systole. Si le PR est court, les valves sont largement ouvertes et claquent fort ; si le PR est long, elles sont presque fermées et le bruit est faible.</p>
<div class="lab">Signification</div><p>Dans le BAV complet, le PR varie au hasard : le premier bruit varie d’un battement à l’autre ; un bruit très intense est appelé bruit de canon.</p>
<div class="lab">Valeur</div><p>Signe de dissociation auriculoventriculaire à l’auscultation ; également présent dans la tachycardie ventriculaire.</p></template>

<template data-pop="i44-e-msc" data-title="Massage sinocarotidien">
<div class="lab">Technique</div><p>Auscultation carotidienne préalable. Monitorage électrocardiographique et tensionnel continu. Massage ferme de 10 secondes au bord antérieur du sterno-cléido-mastoïdien, à hauteur du cartilage cricoïde, d’un côté puis de l’autre ; idéalement en décubitus puis debout sur table basculante.</p>
<div class="lab">Indication et réponse (ESC 2018)</div><p>Patient de plus de 40 ans dont la syncope est compatible avec un mécanisme réflexe (classe I). Positif si asystolie &gt; 3 secondes et/ou chute de la pression systolique &gt; 50 mmHg ; syndrome du sinus carotidien si la réponse reproduit les symptômes.</p>
<div class="lab">Contre-indications</div><p>Accident ischémique transitoire ou accident vasculaire cérébral dans les trois mois précédents, souffle carotidien (sauf si une échographie exclut une sténose significative) : la pression exercée sur une plaque carotidienne peut en détacher un fragment et provoquer une embolie cérébrale.</p>
<div class="lab">Complications</div><p>Neurologiques, rares.</p></template>

<template data-pop="i44-e-orthostat" data-title="Test d’orthostatisme actif">
<div class="lab">Technique</div><p>Pression et fréquence après cinq minutes couché, puis debout à 1 et 3 minutes.</p>
<div class="lab">Interprétation (ESC 2018)</div><p>Hypotension orthostatique : baisse de la systolique ≥ 20 mmHg, de la diastolique ≥ 10 mmHg, ou systolique &lt; 90 mmHg, avec symptômes.</p>
<div class="lab">Intérêt</div><p>Distinguer une syncope orthostatique d’une syncope bradycardique ; une accélération insuffisante de la fréquence au lever évoque une dysautonomie ou un bradycardisant.</p></template>

<template data-pop="i44-tox" data-title="Intoxications bradycardisantes">
<div class="lab">Bêtabloquants</div><p>Bradycardie, hypotension, hypoglycémie, convulsions (propranolol, lipophile), QRS large (propranolol), QT long (sotalol).</p>
<div class="lab">Inhibiteurs calciques</div><p>Bradycardie et hypotension avec hyperglycémie (blocage de la sécrétion d’insuline) ; conscience souvent conservée malgré le choc. Formes à libération prolongée : dégradation différée.</p>
<div class="lab">Escalade</div><p>Calcium ; glucagon ; insulinothérapie à haute dose avec glucose et surveillance du potassium (protocoles toxicologiques : bolus de l’ordre de 1 unité/kg, puis perfusion) ; catécholamines ; stimulation ; émulsion lipidique ou assistance circulatoire dans les formes réfractaires, en centre spécialisé.</p>
<div class="lab">Recours</div><p>Tox Info Suisse (145) pour la dose et la durée de surveillance.</p>
<div class="lab">Mécanismes</div><p>Les bêtabloquants bloquent les récepteurs β1 : l’AMPc baisse dans le nœud sinusal et le myocarde, ce qui réduit le courant If, le courant calcique et la contractilité. Le propranolol bloque aussi les canaux sodiques, d’où l’élargissement du QRS ; liposoluble, il franchit la barrière hématoencéphalique, d’où les convulsions. Le sotalol bloque un courant potassique de repolarisation et allonge le QT. Les inhibiteurs calciques bloquent les canaux calciques de type L du nœud, du myocarde, des artérioles et des cellules β du pancréas : bradycardie, baisse de la contractilité, vasoplégie et hyperglycémie.</p>
<div class="lab">Pourquoi chaque antidote</div><p>Le calcium intraveineux élève le calcium extracellulaire et augmente l’entrée de calcium par les canaux restés libres. Le glucagon active ses propres récepteurs, couplés à une protéine G stimulante : il produit de l’AMPc sans passer par les récepteurs β bloqués. L’<button class="w" data-k="i44-d-insuline">insuline à haute dose</button> soutient la contractilité d’un myocarde en choc devenu dépendant du glucose. Les catécholamines stimulent directement les récepteurs encore disponibles. L’émulsion lipidique est réservée aux formes réfractaires, et son mécanisme reste discuté.</p>
<div class="lab">Source complémentaire</div><p>Experts consensus recommendations for the management of calcium channel blocker poisoning in adults, Crit Care Med 2017;45:e306-15 ; Kerns, Management of beta-adrenergic blocker and calcium channel antagonist toxicity, Emerg Med Clin North Am 2007;25:309-31.</p>
</template>

<template data-pop="i44-athlete" data-title="Bradycardie de l’athlète">
<div class="lab">Normal (critères internationaux d’interprétation de l’électrocardiogramme de l’athlète, 2017)</div><p>Bradycardie sinusale (≥ 30/min), BAV du premier degré (PR &lt; 400 ms), Mobitz I, rythme jonctionnel ou atrial ectopique, bloc de branche droit incomplet.</p>
<div class="lab">Anormal, à explorer</div><p>Mobitz II, BAV complet, PR ≥ 400 ms, bradycardie &lt; 30/min ou pauses ≥ 3 secondes, bloc de branche gauche.</p>
<div class="lab">Épreuve clé</div><p>À l’effort, la fréquence accélère et la conduction redevient 1:1 : le mécanisme est vagal.</p>
<div class="lab">Remarque</div><p>Chez l’ancien sportif d’endurance âgé, une dysfonction sinusale ou un BAV symptomatique ne sont pas toujours réversibles au désentraînement.</p>
<div class="lab">Pourquoi la bradycardie n’est pas seulement vagale</div><p>L’entraînement d’endurance augmente le tonus vagal, mais il modifie aussi le nœud sinusal lui-même. Chez l’animal entraîné, la bradycardie persiste après blocage complet du système nerveux autonome et dans le nœud isolé ; elle s’explique par une baisse de l’expression du canal HCN4 et du courant If (D’Souza et al., 2014). Ce remodelage intrinsèque pourrait expliquer qu’une dysfonction sinusale persiste chez certains anciens sportifs ; chez l’homme, ce lien reste à démontrer.</p>
<div class="lab">Pourquoi un Mobitz II ou un BAV complet ne sont pas sportifs</div><p>Le vague agit sur le sinus et le nœud, presque pas sur le système His-Purkinje : un Mobitz II, qui siège sous le nœud, ne peut donc pas être vagal. Un BAV complet dépasse aussi l’effet physiologique de l’entraînement, même lorsqu’il siège dans le nœud. Les critères internationaux classent ces deux blocs comme anormaux : ils imposent la recherche d’une maladie du tissu de conduction, d’une myocardite, d’une sarcoïdose ou d’une cardiomyopathie.</p>
<div class="lab">Source complémentaire</div><p>D’Souza et al., Exercise training reduces resting heart rate via downregulation of the funny channel HCN4, Nat Commun 2014;5:3775 ; Sharma et al., International recommendations for electrocardiographic interpretation in athletes, J Am Coll Cardiol 2017;69:1057-75.</p>
</template>

<template data-pop="i44-age" data-title="Le sujet âgé bradycarde">
<div class="lab">Particularités</div><p>Chutes et amnésie de la perte de connaissance ; syndrome du sinus carotidien ; polymédication (anticholinestérasiques, bêtabloquants) ; insuffisance rénale ; fragilité et risque hémorragique autour de l’implantation.</p>
<div class="lab">Décision</div><p>L’âge seul ne contre-indique pas la stimulation, qui améliore les symptômes et prévient les chutes traumatisantes. La décision est partagée, selon les objectifs du patient, sa cognition et son espérance de vie. Stimulateur sans sonde envisageable chez le patient fragile.</p>
<div class="lab">Fin de vie</div><p>La désactivation d’un stimulateur est une limitation de traitement : elle peut être demandée par un patient capable de discernement ou par son représentant, selon ses directives anticipées. Elle se prépare avec le patient, la famille et l’équipe de rythmologie.</p></template>

<template data-pop="i44-grossesse" data-title="Bradycardies et grossesse">
<div class="lab">BAV congénital connu</div><p>Habituellement bien toléré si l’échappement est fin et suffisamment rapide ; accouchement par voie basse possible. Une stimulation temporaire est préparée pour l’accouchement chez les patientes symptomatiques ou à échappement lent ou large.</p>
<div class="lab">Implantation pendant la grossesse</div><p>Si elle est indispensable, avec une fluoroscopie minimale ou nulle (guidage échocardiographique, cartographie électroanatomique) et protection du fœtus.</p>
<div class="lab">Porteuse de stimulateur</div><p>La grossesse est en général bien tolérée ; contrôle du dispositif ; bistouri électrique bipolaire en cas de césarienne, car le courant reste confiné entre les deux branches de la pince et n’atteint pas le dispositif.</p>
<div class="lab">Anticorps anti-Ro</div><p>Surveillance fœtale du PR mécanique ; hydroxychloroquine chez la mère après un premier enfant atteint.</p>
<div class="lab">Médicaments</div><p>L’atropine et les catécholamines sont utilisables en urgence ; la priorité reste la stabilité maternelle.</p></template>

<template data-pop="i44-postop" data-title="BAV après chirurgie cardiaque">
<div class="lab">Fréquence et facteurs</div><p>Plus fréquent après remplacement valvulaire aortique, chirurgie mitrale et tricuspide combinée, chirurgie d’endocardite avec abcès, chez les patients qui avaient un trouble de conduction préopératoire.</p>
<div class="lab">Conduite (ESC 2021)</div><p>Électrodes épicardiques temporaires posées pendant l’intervention. Observation d’au moins 5 jours avant de décider d’une stimulation définitive (classe I), période raccourcie si l’échappement est absent ou très lent et la récupération improbable.</p>
<div class="lab">Endocardite</div><p>En cas de BAV complet périopératoire avec un facteur prédictif de persistance (trouble de conduction préopératoire, infection à <i>Staphylococcus aureus</i>, abcès, atteinte tricuspide, chirurgie valvulaire antérieure), une implantation épicardique immédiate est à envisager (classe IIa).</p></template>
