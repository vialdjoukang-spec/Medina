
<!-- ===== FENÊTRES I44 : électrocardiogramme et examens ===== -->
<template data-pop="i44-mob1" data-title="Bloc de Mobitz I (Wenckebach)">
<div class="lab">Siège</div><p>Nodal dans la grande majorité des cas, surtout si les QRS sont fins ; rarement infrahisien lorsqu’un bloc de branche est associé. Contextes : sommeil, sportif, médicaments nodaux, infarctus inférieur, cardite de Lyme.</p>
<div class="lab">Décision</div><p>Pas de traitement si asymptomatique et nodal. Stimulation à envisager s’il est symptomatique ou de siège intra- ou infrahisien à l’exploration (ESC 2021, classe IIa).</p>
<div class="lab">Piège</div><p>Les séquences atypiques (incrément irrégulier, plus grand incrément au dernier battement) sont fréquentes : la clé est un PR plus court juste après la pause.</p>
<div class="lab">Pourquoi le siège change le pronostic</div><p>Au-dessus du faisceau de His, le Mobitz I reflète la récupération lente et décrémentielle du nœud. Il régresse quand le tonus vagal baisse, et il évolue rarement vers un bloc de type II ou de plus haut degré. Sous le faisceau de His, situation rare, il traduit un tissu de conduction malade : comme le Mobitz II, il expose au bloc complet, à la syncope et à la mort subite, et l’ESC 2021 justifie la stimulation même sans symptôme.</p>
<div class="lab">Limite des données</div><p>De petites études rétrospectives ont associé le Mobitz I non stimulé à une mortalité plus élevée après 45 ans. Il s’agit d’une association : aucun essai n’a montré que la stimulation prolonge la survie de ces patients.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">Glikson et al., 2021 ESC Guidelines on cardiac pacing</a>, Eur Heart J 2021;42:3427-3520, section 5.2 (BAV du deuxième degré de type I).</p>
</template>

<template data-pop="i44-mob2" data-title="Bloc de Mobitz II">
<div class="lab">Siège et risque</div><p>Infranodal ; QRS large dans environ trois quarts des cas. Évolution imprévisible vers le bloc complet et l’asystolie.</p>
<div class="lab">Décision</div><p>Stimulation définitive, avec ou sans symptômes (<a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">ESC 2021</a>, classe I).</p>
<div class="lab">Pièges</div><p>Une onde P bloquée précédée d’un ralentissement sinusal (PP qui s’allonge), avec un PR qui s’allonge légèrement, est vagale et nodale. Une extrasystole auriculaire bloquée arrive en avance. Aucun des deux n’est un Mobitz II.</p></template>

<template data-pop="i44-21" data-title="Bloc 2:1 : trouver le siège">
<div class="lab">Pourquoi c’est difficile</div><p>Il n’existe jamais deux PR consécutifs : le comportement du PR ne peut pas être observé.</p>
<div class="lab">Démarche</div><p>Chercher sur un tracé long des séquences de Wenckebach (nodal) ou de Mobitz II (infranodal) ; tester la réponse à l’atropine ou à l’effort (amélioration : nodal ; passage à 3:1 : infranodal) ; en cas de doute persistant, mesurer l’intervalle HV.</p>
<div class="lab">Décision</div><p>Un bloc 2:1 infranodal relève de la stimulation (<a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">ESC 2021</a>, classe I).</p></template>

<template data-pop="i44-bav3" data-title="BAV complet">
<div class="lab">Formes</div><p>Nodal : échappement à QRS fin, 40–60/min (infarctus inférieur, médicaments, congénital). Infranodal : échappement à QRS large, 20–40/min (dégénératif, infarctus antérieur, post-procédural).</p>
<div class="lab">Clinique</div><p>Asthénie, dyspnée, syncope, insuffisance cardiaque ; ondes a en canon, premier bruit variable, pression différentielle élargie.</p>
<div class="lab">Décision</div><p>Acquis et non réversible : stimulation, avec ou sans symptômes (classe I). Un battement de capture exclut le bloc complet.</p>
<div class="lab">Pièges</div><p>Une dissociation isorythmique (P et QRS de fréquences voisines) simule un PR variable sans bloc : chercher des P non conduites alors qu’elles tombent hors période réfractaire. En fibrillation auriculaire, un rythme ventriculaire lent et régulier signe le bloc complet.</p></template>

<template data-pop="i44-pseudo" data-title="Pièges de lecture : fausses pauses et faux blocs">
<div class="lab">Extrasystole auriculaire bloquée</div><p>Onde P prématurée déformant l’onde T, non suivie de QRS : pause qui ressemble à un arrêt sinusal ou à un Mobitz II. Chercher la déformation de l’onde T précédant la pause.</p>
<div class="lab">Bigéminisme auriculaire bloqué</div><p>Une extrasystole bloquée sur deux battements : fausse bradycardie à 40/min.</p>
<div class="lab">Arythmie sinusale respiratoire</div><p>Variation cyclique du PP avec la respiration chez le sujet jeune : physiologique.</p>
<div class="lab">Artéfact</div><p>Déconnexion d’électrode sur un Holter : fausse asystolie sans ralentissement préalable, avec retour immédiat au rythme de base.</p>
<div class="lab">Extrasystole jonctionnelle cachée</div><p>Une dépolarisation jonctionnelle non propagée rend le nœud réfractaire et produit de faux Mobitz II ; à évoquer lorsque des extrasystoles jonctionnelles visibles existent ailleurs.</p></template>

<template data-pop="i44-bbd" data-title="Bloc de branche droit">
<div class="lab">Critères (QRS ≥ 120 ms)</div><p>rsr′, rsR′ ou rSR′ en V1–V2 ; onde S large en DI et V6 (plus large que l’onde R ou &gt; 40 ms) ; temps d’apparition de l’onde R normal en V5–V6. Incomplet si QRS 110–119 ms.</p>
<div class="lab">Signification</div><p>Fréquent, souvent isolé et bénin. Causes : dégénérative, cardiopathie droite, communication interauriculaire, embolie pulmonaire (s’il est récent), après chirurgie ou valve aortique percutanée.</p>
<div class="lab">Portée</div><p>Associé à un hémibloc, il forme un bloc bifasciculaire. Un bloc de branche droit préexistant est le principal facteur prédictif de stimulateur après valve aortique percutanée.</p>
<div class="lab">Piège</div><p>Distinguer d’un aspect de Brugada de type 1 (sus-décalage descendant en V1–V2) et d’une pré-excitation.</p>
<div class="lab">Pourquoi il prédit un stimulateur après valve aortique percutanée</div><p>La branche gauche émerge sous le septum membraneux, au contact de l’anneau aortique, et la prothèse la lèse souvent : le bloc de branche gauche est le trouble de conduction le plus fréquent après l’intervention. Chez un patient qui a déjà un bloc de branche droit, ce nouveau bloc interrompt la dernière voie de conduction, et un bloc complet en résulte. Dans les analyses multivariées, un bloc de branche droit préexistant s’associe à un rapport de cotes de 2,6 à 11,5 pour l’implantation d’un stimulateur. L’ESC 2021 propose une stimulation précoce s’il se complique d’un nouveau trouble de conduction (classe IIa), mais pas de stimulateur préventif avant l’intervention (classe III).</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">Glikson et al., 2021 ESC Guidelines on cardiac pacing</a>, Eur Heart J 2021;42:3427-3520, section 8.3 et tableau 10.</p>
</template>

<template data-pop="i44-bbg" data-title="Bloc de branche gauche">
<div class="lab">Critères (QRS ≥ 120 ms)</div><p>Onde R large, crochetée ou empâtée en DI, aVL, V5–V6 ; absence d’onde q en DI, V5–V6 ; temps d’apparition de l’onde R &gt; 60 ms en V5–V6 ; ST et T de sens opposé au QRS.</p>
<div class="lab">Critères stricts de Strauss</div><p>QRS ≥ 140 ms chez l’homme ou ≥ 130 ms chez la femme, aspect QS ou rS en V1–V2, crochetage médian du QRS dans au moins deux des dérivations V1–V2, V5–V6, DI et aVL. Ils identifient les vrais blocs, meilleurs répondeurs à la resynchronisation : seul un vrai bloc retarde l’activation de la paroi latérale gauche, que la stimulation du ventricule gauche vient corriger.</p>
<div class="lab">Signification</div><p>Plus souvent associé à une cardiopathie que le bloc droit : la chercher (hypertensive, ischémique, cardiomyopathie, rétrécissement aortique) par échocardiographie. Asynchronisme mécanique.</p>
<div class="lab">Pièges</div><p>Masque l’ischémie et l’hypertrophie ; les critères de Sgarbossa aident en cas de douleur thoracique. Un bloc de branche gauche d’effort, douloureux, doit faire chercher une ischémie.</p></template>

<template data-pop="i44-hbag" data-title="Hémibloc antérieur gauche">
<div class="lab">Critères</div><p>Axe entre −45° et −90° ; qR en aVL avec temps d’apparition de l’onde R ≥ 45 ms ; rS en DII, DIII et aVF ; QRS &lt; 120 ms.</p>
<div class="lab">Signification</div><p>Le plus fréquent des troubles de conduction intraventriculaires ; isolé, sans valeur pronostique propre chez le sujet sans cardiopathie.</p>
<div class="lab">Pièges</div><p>Peut masquer ou simuler une nécrose inférieure ; ne pas le confondre avec la déviation axiale gauche d’une hypertrophie ou d’une pré-excitation.</p></template>

<template data-pop="i44-hbpg" data-title="Hémibloc postérieur gauche">
<div class="lab">Diagnostic d’élimination</div><p>Exclure une hypertrophie ventriculaire droite, un infarctus latéral, une morphologie longiligne, une embolie pulmonaire.</p>
<div class="lab">Signification</div><p>Rare, car le fascicule est large et doublement vascularisé. Associé à un bloc de branche droit, il expose à un risque élevé de bloc complet.</p></template>

<template data-pop="i44-alternant" data-title="Bloc de branche alternant">
<div class="lab">Définition</div><p>Bloc de branche droit et bloc de branche gauche sur des tracés successifs, ou sur le même tracé ; ou bloc de branche droit avec alternance d’un hémibloc antérieur et d’un hémibloc postérieur.</p>
<div class="lab">Signification</div><p>Les trois fascicules sont malades : le bloc complet est imminent.</p>
<div class="lab">Décision</div><p>Stimulation, avec ou sans symptômes (<a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">ESC 2021</a>, classe I). Après valve aortique percutanée, l’apparition d’un bloc de branche alternant est aussi une indication de classe I.</p></template>

<template data-pop="i44-atropine-test" data-title="Épreuve à l’atropine">
<div class="lab">Principe</div><p>Supprimer le frein vagal pour observer la réponse du sinus et du nœud.</p>
<div class="lab">Réalisation</div><p>Sous monitorage continu, atropine 0,5 à 1 mg par voie intraveineuse (ou 0,02 à 0,04 mg/kg selon les protocoles d’électrophysiologie) ; observation pendant 5 à 10 minutes.</p>
<div class="lab">Lecture</div><p>Accélération sinusale et amélioration de la conduction (2:1 → 1:1) : bloc nodal, composante vagale. Accélération sinusale avec aggravation (2:1 → 3:1) : bloc infranodal. Fréquence sinusale qui n’augmente pas : dysfonction sinusale intrinsèque probable.</p>
<div class="lab">Contre-indications</div><p>Glaucome à angle fermé, rétention urinaire, cardiopathie ischémique instable, cœur transplanté.</p>
<div class="lab">Pourquoi ces contre-indications</div><p>L’atropine bloque tous les récepteurs muscariniques. La mydriase qu’elle provoque peut fermer un angle iridocornéen étroit et déclencher un glaucome aigu. Le relâchement du détrusor favorise une rétention urinaire, surtout en cas d’hypertrophie prostatique. L’accélération sinusale augmente la consommation d’oxygène du myocarde et peut aggraver une ischémie instable. Le cœur transplanté, dénervé, n’a pas de frein vagal à lever, et des blocs paradoxaux y ont été décrits.</p>
<div class="lab">Source complémentaire</div><p>Brunton et al., Goodman &amp; Gilman’s The Pharmacological Basis of Therapeutics, 14e éd., chapitre sur les antagonistes muscariniques ; <a href="https://pubmed.ncbi.nlm.nih.gov/33773825/" target="_blank" rel="noopener">Soar et al., European Resuscitation Council Guidelines 2021: Adult advanced life support</a>, Resuscitation 2021;161:115-51.</p>
</template>

<template data-pop="i44-effort" data-title="Épreuve d’effort dans les troubles de la conduction">
<div class="lab">Questions</div><p>La fréquence s’adapte-t-elle ? Le bloc s’améliore-t-il ou s’aggrave-t-il ? Un trouble apparaît-il seulement à l’effort ?</p>
<div class="lab">Lecture</div><p>Conduction qui s’améliore : nodal. Bloc qui apparaît ou s’aggrave : infranodal, indication de stimulation. Fréquence maximale basse : incompétence chronotrope.</p>
<div class="lab">Indication (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">ESC 2018</a>)</div><p>Syncope pendant l’effort ou juste après : classe I. Une syncope survenant après l’effort oriente plutôt vers un mécanisme réflexe ; pendant l’effort, vers une cause cardiaque.</p>
<div class="lab">Sécurité</div><p>Épreuve déconseillée si le bloc infranodal est déjà évident au repos : elle n’apporte rien et comporte un risque.</p></template>

<template data-pop="i44-eep" data-title="Exploration électrophysiologique endocavitaire">
<div class="lab">Principe</div><p>Sondes introduites par voie fémorale ; enregistrement du potentiel du faisceau de His ; stimulation programmée.</p>
<div class="lab">Mesures</div><p>AH ≈ 50–120 ms (nodal) ; HV 35–55 ms (infranodal) ; temps de récupération sinusale corrigé &lt; 525 ms ; point de Wenckebach nodal ; induction d’arythmies.</p>
<div class="lab">Indications utiles</div><p>Syncope inexpliquée avec bloc bifasciculaire (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">ESC 2018</a> et 2021, classe IIa) ; syncope avec cardiopathie cicatricielle (recherche de tachycardie ventriculaire) ; siège incertain d’un bloc 2:1.</p>
<div class="lab">Décision</div><p>HV ≥ 70 ms, bloc infrahisien induit par la stimulation auriculaire croissante ou par l’épreuve pharmacologique : stimulation (classe I).</p>
<div class="lab">Limite</div><p>Sensibilité imparfaite : une exploration normale n’exclut pas un BAV paroxystique ; moniteur implantable ensuite.</p>
<div class="lab">Pourquoi le seuil de 70 ms</div><p>L’intervalle HV mesure la conduction dans le faisceau de His, les branches et le réseau de Purkinje ; son allongement traduit une réserve infranodale réduite. Chez 313 patients porteurs d’un bloc de branche chronique, suivis en moyenne près de 3 ans, un bloc de haut degré est apparu chez 2 à 4 % des patients dont le HV était inférieur à 70 ms, chez 12 % de ceux dont le HV atteignait 70 ms ou plus et chez 4 sur 17 (24 %) de ceux dont le HV atteignait 100 ms ou plus (<a href="https://pubmed.ncbi.nlm.nih.gov/7148708/" target="_blank" rel="noopener">Scheinman et al., 1982</a>). La stimulation auriculaire croissante et l’épreuve par un bloqueur sodique (ajmaline, procaïnamide, flécaïnide) démasquent un faisceau malade, qui bloque quand la fréquence augmente ou quand le courant sodique est freiné ; un HV ≥ 100 ms sous épreuve pharmacologique est aussi anormal.</p>
<div class="lab">Valeur diagnostique</div><p>Une exploration positive prédit l’apparition d’un BAV avec une valeur prédictive positive allant jusqu’à 80 %, et la stimulation a réduit les récidives de syncope chez ces patients. Une exploration négative laisse un risque réel : chez 52 patients porteurs d’un bloc de branche et d’une syncope, dont l’exploration était négative, un moniteur implantable a enregistré en 3 à 15 mois, lors d’une récidive de syncope, des asystolies dues surtout à un BAV paroxystique chez 17 patients, soit environ un tiers (<a href="https://pubmed.ncbi.nlm.nih.gov/11673344/" target="_blank" rel="noopener">Brignole et al., 2001</a>).</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">Glikson et al., 2021 ESC Guidelines on cardiac pacing</a>, Eur Heart J 2021;42:3427-3520, sections 4.5 et 5.3 ; Scheinman et al., Am J Cardiol 1982;50:1316-22 ; <a href="https://pubmed.ncbi.nlm.nih.gov/11673344/" target="_blank" rel="noopener">Brignole et al., Mechanism of syncope in patients with bundle branch block and negative electrophysiological test</a>, Circulation 2001;104:2045-50.</p>
</template>

<template data-pop="i44-sync-strat" data-title="Stratification du risque de la syncope (ESC 2018)">
<div class="lab">Critères de haut risque (majeurs)</div><p>Douleur thoracique, dyspnée, douleur abdominale ou céphalée nouvelles ; syncope à l’effort ou en décubitus ; palpitations soudaines suivies de syncope ; cardiopathie structurelle ou coronaire sévère ; pression systolique &lt; 90 mmHg inexpliquée ; bradycardie persistante &lt; 40/min en éveil sans entraînement. Électrocardiogramme : ischémie aiguë, Mobitz II, BAV complet, fibrillation auriculaire lente &lt; 40/min, pauses &gt; 3 secondes en éveil, bloc de branche ou trouble de conduction intraventriculaire, ondes Q, tachycardie ventriculaire, dysfonction d’un dispositif, aspect de Brugada de type 1, QTc &gt; 460 ms.</p>
<div class="lab">Critères de haut risque (mineurs)</div><p>Critères mineurs cliniques (haut risque seulement s’il existe une cardiopathie ou un électrocardiogramme anormal) : absence de prodrome ou prodrome &lt; 10 s, mort subite familiale jeune, syncope en position assise. Critères mineurs électrocardiographiques (haut risque seulement si l’anamnèse évoque une syncope arythmique) : Mobitz I, BAV du premier degré très long, bradycardie inappropriée de 40 à 50/min ou fibrillation auriculaire lente de 40 à 50/min.</p>
<div class="lab">Faible risque</div><p>Prodromes typiques (chaleur, nausée), déclencheur (station debout prolongée, douleur, émotion), survenue après un repas ou un effort, longue histoire de syncopes identiques, examen et électrocardiogramme normaux.</p>
<div class="lab">Conséquence</div><p>Haut risque : évaluation rapide, souvent hospitalière ou en unité spécialisée. Faible risque : sortie avec information.</p>
<div class="lab">Pourquoi ces critères désignent une cause cardiaque</div><p>Les syncopes réflexe et orthostatique surviennent en règle debout, après un déclencheur, et l’activation autonome qui les produit donne des prodromes. Une syncope en décubitus, à l’effort ou sans prodrome échappe à ces mécanismes : elle fait suspecter une arythmie ou un obstacle à l’éjection. Des palpitations juste avant la perte de connaissance évoquent une tachyarythmie. Une cardiopathie structurelle fournit le substrat des tachycardies ventriculaires, et un trouble de conduction celui d’un BAV paroxystique.</p>
<div class="lab">Pourquoi les critères mineurs dépendent du contexte</div><p>Un Mobitz I, un PR long ou une bradycardie de 40 à 50/min sont fréquents chez des sujets sains, surtout vagotoniques. Ils ne prennent de valeur que si l’anamnèse évoque une syncope arythmique ; isolés, ils conduiraient à des hospitalisations et à des stimulations inutiles.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">Brignole et al., 2018 ESC Guidelines for the diagnosis and management of syncope</a>, Eur Heart J 2018;39:1883-948.</p>
</template>

<template data-pop="i44-sync-arythm" data-title="Syncope arythmique : critères électrocardiographiques (ESC 2018)">
<div class="lab">Syncope arythmique hautement probable (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">ESC 2018</a>) si l’électrocardiogramme montre</div><p>Une bradycardie sinusale persistante &lt; 40/min ou des pauses sinusales &gt; 3 secondes en éveil, en l’absence d’entraînement physique ; un Mobitz II ou un BAV complet ; un bloc de branche alternant ; une tachycardie ventriculaire ou supraventriculaire rapide paroxystique ; des salves de tachycardie ventriculaire polymorphe avec QT long ou court ; un dysfonctionnement de stimulateur ou de défibrillateur avec pauses.</p>
<div class="lab">Corrélation</div><p>Le diagnostic est établi lorsqu’une bradyarythmie est enregistrée au moment d’une syncope (Holter, moniteur implantable).</p></template>

<template data-pop="i44-ilr" data-title="Moniteur ECG implantable">
<div class="lab">Principe</div><p>Enregistreur sous-cutané de quelques centimètres, implanté en ambulatoire sous anesthésie locale ; mémorisation automatique des bradycardies, pauses et tachycardies, et des épisodes signalés par le patient ; durée de vie de deux à trois ans.</p>
<div class="lab">Indications (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">ESC 2018</a>, classe I)</div><p>Tôt dans l’évaluation des syncopes récidivantes d’origine incertaine, sans critère de haut risque, avec une forte probabilité de récidive pendant la durée de vie de l’appareil. Patients à haut risque dont le bilan complet n’a pas trouvé de cause et qui n’ont pas d’indication de défibrillateur.</p>
<div class="lab">Autres indications</div><p>Syncope réflexe suspectée, sévère ou fréquente (classe IIa) ; bloc bifasciculaire avec exploration électrophysiologique normale ; chutes inexpliquées du sujet âgé.</p>
<div class="lab">Rendement</div><p>Un diagnostic est obtenu chez une part importante des patients, de l’ordre d’un tiers à la moitié sur la durée de vie de l’appareil, bien plus qu’avec le Holter. L’absence d’arythmie pendant une syncope enregistrée exclut aussi une cause rythmique.</p></template>

<template data-pop="i44-tilt" data-title="Test d’inclinaison">
<div class="lab">Protocole</div><p>Inclinaison passive à 60–70° pendant environ 20 minutes, puis potentialisation par dérivé nitré sublingual si nécessaire ; pression artérielle battement par battement et électrocardiogramme continus.</p>
<div class="lab">Réponses</div><p>Vasodépressive (chute tensionnelle sans bradycardie importante) ; mixte ; cardio-inhibitrice (bradycardie marquée), avec ou sans asystolie de plus de 3 secondes.</p>
<div class="lab">Indications (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">ESC 2018</a>, classe IIa)</div><p>Syncope réflexe suspectée non confirmée par l’anamnèse, hypotension orthostatique retardée, syndrome de tachycardie orthostatique posturale, pseudo-syncope psychogène.</p>
<div class="lab">Pièges</div><p>Sensibilité et spécificité imparfaites ; une réponse asystolique au test ne prouve pas que les syncopes spontanées sont asystoliques, mais elle rend la stimulation plus probablement efficace.</p></template>

<template data-pop="i44-reflexe" data-title="Syncope réflexe et stimulation">
<div class="lab">Traitement de base</div><p>Information, reconnaissance des prodromes, manœuvres de contre-pression (croiser les jambes, serrer les poings), hydratation, retrait ou réduction des antihypertenseurs. Chez le sujet jeune à pression basse, fludrocortisone ou midodrine selon les cas.</p>
<div class="lab">Stimulation (<a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">ESC 2021</a>, classe I)</div><p>Âge &gt; 40 ans, syncopes sévères, imprévisibles, récidivantes, et asystolie documentée : pause spontanée &gt; 3 secondes avec symptômes ou &gt; 6 secondes sans symptôme, syndrome du sinus carotidien cardio-inhibiteur ou asystolie au test d’inclinaison. Mode double chambre.</p>
<div class="lab">Preuves</div><p>Essai ISSUE-3 (pauses documentées par moniteur implantable) ; essais SPAIN et BIOSync CLS (asystolie au test d’inclinaison), avec un algorithme à boucle fermée qui détecte la baisse de contractilité : réduction nette des récidives par rapport à une stimulation placebo.</p>
<div class="lab">Limite</div><p>La composante vasodépressive persiste : des récidives restent possibles. Sans cardio-inhibition documentée, la stimulation n’est pas indiquée.</p>
<div class="lab">Technique en évaluation</div><p>La cardioneuroablation (ablation des plexus ganglionnaires parasympathiques) est étudiée chez le sujet jeune ; elle ne figure pas parmi les recommandations de 2021.</p></template>

<template data-pop="i44-holter" data-title="Holter dans les bradycardies">
<div class="lab">Ce qu’on lit</div><p>Fréquences minimale, moyenne et maximale ; pauses (durée, heure, éveil ou sommeil) ; conduction auriculoventriculaire ; tachyarythmies auriculaires et leur arrêt ; corrélation avec le journal des symptômes.</p>
<div class="lab">Variantes normales</div><p>Chez le sujet jeune et le sportif : fréquence nocturne basse, pauses nocturnes brèves, Mobitz I du sommeil.</p>
<div class="lab">Anomalies significatives</div><p>Pauses &gt; 3 secondes en éveil, Mobitz II, BAV complet, pause à l’arrêt d’une fibrillation, absence d’accélération diurne.</p>
<div class="lab">Limite</div><p>Holter de 24 à 48 heures utile seulement si les symptômes sont quotidiens ; l’<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">ESC 2018</a> le réserve aux syncopes ou présyncopes très fréquentes.</p></template>

<template data-pop="i44-imag" data-title="Imagerie des maladies de la conduction">
<div class="lab">Échocardiographie (<a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">ESC 2021</a>, classe I)</div><p>Fraction d’éjection (choix du dispositif), valvulopathie calcifiée, hypertrophie ou infiltration, amincissement septal basal (sarcoïdose), cardiopathie congénitale.</p>
<div class="lab">IRM cardiaque</div><p>Caractérisation tissulaire : rehaussement tardif du septum basal (sarcoïdose), rehaussement diffus sous-endocardique (amylose), fibrose médiopariétale (<i>LMNA</i>), myocardite. Imagerie multimodale (IRM, tomodensitométrie, TEP) à envisager (ESC 2021, classe IIa) pour caractériser le myocarde lorsqu’une maladie spécifique est suspectée chez un patient qui a besoin d’un stimulateur, en particulier avant 60 ans.</p>
<div class="lab">Tomographie par émission de positons au FDG</div><p>Inflammation active de la sarcoïdose, suivi sous corticoïdes ; préparation par un régime pauvre en glucides.</p>
<div class="lab">Scintigraphie osseuse</div><p>Amylose à transthyrétine si le contexte l’évoque.</p>
<div class="lab">Pourquoi ces préparations et ces traceurs</div><p>Le myocarde sain consomme du glucose après un repas et capte alors le fluorodésoxyglucose. Un régime pauvre en glucides et riche en graisses, suivi d’un jeûne, fait passer le myocarde sain aux acides gras. Les cellules inflammatoires activées des granulomes, qui dépendent du glucose, captent encore le traceur, ce qui rend la fixation interprétable. Les traceurs osseux marqués au technétium se fixent sur les dépôts amyloïdes à transthyrétine, par un mécanisme encore imparfaitement compris.</p>
<div class="lab">Ce qui change la décision</div><p>Une fixation myocardique de grade 2 ou 3 à la scintigraphie osseuse, sans protéine monoclonale dans le sérum ni dans l’urine, a une spécificité de 100 % pour l’amylose cardiaque à transthyrétine : le diagnostic se passe alors de biopsie (<a href="https://pubmed.ncbi.nlm.nih.gov/27143678/" target="_blank" rel="noopener">Gillmore et al., 2016</a>). La présence d’une protéine monoclonale impose au contraire de rechercher une amylose à chaînes légères, qui relève d’un traitement hématologique urgent.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/27143678/" target="_blank" rel="noopener">Gillmore et al., Nonbiopsy diagnosis of cardiac transthyretin amyloidosis</a>, Circulation 2016;133:2404-12 ; <a href="https://pubmed.ncbi.nlm.nih.gov/28770463/" target="_blank" rel="noopener">Chareonthaitawee et al., consensus d’experts sur la tomographie par émission de positons au FDG dans la sarcoïdose cardiaque</a>, J Nucl Cardiol 2017;24:1741-58.</p>
</template>

<template data-pop="i44-interro" data-title="Interrogation du stimulateur">
<div class="lab">Mesures électriques</div><p>Seuils de capture auriculaire et ventriculaire ; amplitudes des ondes P et R détectées ; impédances ; état de la pile.</p>
<div class="lab">Mémoire</div><p>Pourcentage de stimulation auriculaire et ventriculaire ; histogrammes de fréquence ; épisodes de fibrillation auriculaire (infraclinique) ; épisodes de tachycardie ventriculaire.</p>
<div class="lab">Réglages</div><p>Mode, fréquence de base, délai auriculoventriculaire, asservissement, amplitude et durée de sortie, sensibilité, algorithmes de réduction de la stimulation ventriculaire.</p>
<div class="lab">Situations</div><p>Malaise chez un patient appareillé : interrogation d’emblée, à la recherche d’une perte de capture, d’une surdétection ou d’une arythmie mémorisée.</p></template>

<template data-pop="i44-irm" data-title="IRM chez le porteur de stimulateur">
<div class="lab">Risques</div><p>Échauffement de l’extrémité de la sonde (élévation du seuil, perte de capture), surdétection de bruit (inhibition), réinitialisation électrique du boîtier, stimulation rapide induite.</p>
<div class="lab">Système compatible sous conditions (ESC 2021, classe I)</div><p>Boîtier et sondes du même fabricant, validés ensemble ; respect des conditions (champ, zone explorée, énergie déposée). Interrogation et programmation d’un mode IRM avant l’examen : mode asynchrone (DOO ou VOO) chez le patient dépendant, mode sans stimulation ou inhibé chez le patient non dépendant ; asservissement désactivé. Monitorage pendant l’examen ; reprogrammation et contrôle après.</p>
<div class="lab">Système non compatible</div><p>IRM à envisager (ESC 2021, classe IIa) si aucune autre imagerie ne convient et en l’absence de sonde épicardique, abandonnée ou endommagée, d’adaptateur ou d’extension, dans un centre organisé pour cela.</p><p>Sondes transveineuses abandonnées : IRM à discuter (classe IIb, niveau C) si aucune autre imagerie ne convient.</p>
<div class="lab">Organisation</div><p>Protocole écrit entre radiologie et cardiologie ; matériel de réanimation disponible ; délai minimal après l’implantation selon le fabricant.</p>
<div class="lab">Mécanismes des risques</div><p>Les ondes de radiofréquence induisent des courants dans la sonde, qui se comporte comme une antenne. L’énergie se concentre à son extrémité et chauffe le tissu au contact, ce qui peut élever le seuil de capture. Les gradients de champ magnétique induisent des tensions que le boîtier peut prendre pour une activité cardiaque, ce qui inhibe la stimulation, ou qui capturent directement le myocarde. Le champ statique peut actionner le capteur magnétique du boîtier ou provoquer une réinitialisation électrique. Une sonde abandonnée, sans boîtier pour dissiper une partie de l’énergie, chauffe davantage : environ 10 °C à son extrémité dans un modèle expérimental (ESC 2021).</p>
<div class="lab">Pourquoi programmer avant l’examen</div><p>Chez le patient dépendant, le mode asynchrone empêche les signaux induits d’inhiber la stimulation. Chez le patient non dépendant, un mode sans stimulation évite une stimulation inappropriée, en compétition avec le rythme spontané, qui pourrait déclencher une arythmie.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehab364" target="_blank" rel="noopener">Glikson et al., 2021 ESC Guidelines on cardiac pacing</a>, Eur Heart J 2021;42:3427-3520, section 11.1 (IRM).</p>
</template>
