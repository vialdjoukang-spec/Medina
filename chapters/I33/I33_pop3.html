
<!-- ===== FENÊTRES : diagnostic et examens ===== -->
<template data-pop="i33-duke" data-title="Critères de Duke modifiés ESC 2023">
<div class="lab">Critère majeur 1 — hémocultures positives</div><p>a) Germe typique dans au moins deux hémocultures séparées : streptocoques oraux, <i>S. gallolyticus</i>, groupe HACEK, <i>S. aureus</i>, <i>E. faecalis</i>. b) Germe compatible dans des hémocultures persistantes : au moins deux prélevées à plus de 12 heures d’intervalle, ou trois sur trois, ou la majorité d’au moins quatre (au moins une heure entre la première et la dernière). c) Une seule hémoculture positive à <i>Coxiella burnetii</i> ou IgG de phase I &gt; 1:800.</p>
<div class="lab">Critère majeur 2 — imagerie positive</div><p>Lésions anatomiques ou métaboliques valvulaires, périvalvulaires, périprothétiques ou sur matériel étranger caractéristiques d’EI, détectées par : échocardiographie (ETT, ETO) — végétation, perforation, anévrisme de feuillet, abcès, pseudoanévrisme, fistule, fuite nouvelle significative, déhiscence nouvelle de prothèse ; scanner cardiaque ; TEP-TDM au FDG ; scintigraphie aux leucocytes marqués. La captation périprothétique anormale compte comme critère majeur quel que soit le délai depuis l’implantation.</p>
<div class="lab">Critères mineurs</div><p>1. Prédisposition : cardiopathie à risque élevé ou intermédiaire, injection de drogues. 2. Fièvre &gt; 38 °C. 3. Dissémination vasculaire embolique, y compris asymptomatique en imagerie : embolies systémiques ou pulmonaires, infarctus et abcès, spondylodiscite et arthrite septique hématogènes, anévrismes infectieux, lésions cérébrales ischémiques ou hémorragiques, hémorragies conjonctivales, lésions de Janeway. 4. Phénomènes immunologiques : glomérulonéphrite, nodosités d’Osler, taches de Roth, facteur rhumatoïde. 5. Preuve microbiologique ne remplissant pas le critère majeur, ou sérologie d’infection active par un germe compatible.</p>
<div class="lab">Classement</div><p><b>Certaine</b> : critère pathologique (germe ou lésion d’EI active dans la végétation, un embole ou un abcès), ou 2 majeurs, ou 1 majeur et ≥ 3 mineurs, ou 5 mineurs. <b>Possible</b> : 1 majeur et 1–2 mineurs, ou 3–4 mineurs. <b>Rejetée</b> : diagnostic alternatif ferme ; résolution après ≤ 4 jours d’antibiotiques ; absence de lésion à la chirurgie ou à l’autopsie après ≤ 4 jours d’antibiotiques ; critères d’EI possible non remplis.</p>
<div class="lab">Limites</div><p>Sensibilité réduite sur prothèse, sur dispositif et en cas d’hémocultures négatives. Outil de classement, qui ne remplace pas le jugement de l’équipe endocardite.</p></template>

<template data-pop="i33-iscvid" data-title="Critères Duke-ISCVID 2023">
<div class="lab">Origine</div><p>Mise à jour publiée en 2023 par la Société internationale d’infectiologie cardiovasculaire (ISCVID), la même année que la version ESC.</p>
<div class="lab">Principales nouveautés</div><p><b>Microbiologie</b> : germes typiques élargis : <i>S. aureus</i>, <i>S. lugdunensis</i>, <i>E. faecalis</i>, tous les streptocoques sauf <i>S. pneumoniae</i> et <i>S. pyogenes</i>, groupe HACEK, <i>Granulicatella</i>, <i>Abiotrophia</i>, <i>Gemella</i> ; germes typiques seulement en présence de matériel intracardiaque (staphylocoques à coagulase négative, <i>Corynebacterium striatum</i> et <i>jeikeium</i>, <i>Serratia marcescens</i>, <i>Pseudomonas aeruginosa</i>, <i>Cutibacterium acnes</i>, mycobactéries non tuberculeuses, <i>Candida</i>) ; suppression des exigences de délai et de ponctions séparées ; biologie moléculaire (PCR, séquençage) de <i>Coxiella</i>, <i>Bartonella</i> et <i>Tropheryma whipplei</i> ; IgG anti-<i>Bartonella</i> ≥ 1:800 en critère majeur.</p>
<div class="lab">Imagerie et chirurgie</div><p>Scanner cardiaque et TEP-TDM en critères majeurs (la TEP-TDM dans les trois mois suivant une implantation ne compte que comme critère mineur) ; <b>inspection peropératoire</b> de lésions d’EI en critère majeur.</p>
<div class="lab">Mineurs élargis</div><p>Prédispositions précisées (prothèse percutanée, dispositif, antécédent d’EI) ; nouveau souffle de régurgitation à l’auscultation si l’échocardiographie n’est pas disponible.</p>
<div class="lab">Classement</div><p>Certaine : 2 majeurs, 1 majeur et 3 mineurs, ou 5 mineurs. Possible : 1 majeur et 1 mineur, ou 3 mineurs.</p></template>

<template data-pop="i33-mnemo-duke" data-title="« 2 – 1 + 3 – 5 » : l’EI certaine">
<p><b>2</b> majeurs ; <b>1</b> majeur <b>+ 3</b> mineurs ; <b>5</b> mineurs.</p>
<p>L’EI possible se déduit en retirant une unité : 1 majeur et 1 à 2 mineurs, ou 3 à 4 mineurs.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel.</p></template>

<template data-pop="i33-hc" data-title="Hémocultures : technique et pièges">
<div class="lab">Question clinique</div><p>Y a-t-il une bactériémie, par quel germe, et persiste-t-elle ?</p>
<div class="lab">Technique</div><p>Au moins trois paires (aérobie et anaérobie), par ponctions veineuses périphériques distinctes, 10 mL par flacon chez l’adulte, après antisepsie cutanée à la chlorhexidine alcoolique et désinfection des bouchons ; avant tout antibiotique. Identification rapide par spectrométrie de masse, antibiogramme et CMI.</p>
<div class="lab">Résultats normaux</div><p>Absence de croissance après la durée d’incubation standard (en général 5 jours).</p>
<div class="lab">Résultats pathologiques</div><p>Germe typique dans ≥ 2 paires : critère majeur. <i>S. aureus</i>, même dans une seule paire : toujours significatif. Staphylocoque à coagulase négative dans une seule paire : contaminant probable, sauf sur matériel.</p>
<div class="lab">Contrôle</div><p>Nouvelles hémocultures 48 à 72 heures après le début du traitement ; pour <i>S. aureus</i>, jusqu’à négativation. La date de la première hémoculture négative fixe le début de la durée de traitement.</p>
<div class="lab">Pièges</div><p>Flacons sous-remplis ; prélèvement sur cathéter ; antibiothérapie préalable ; germes intracellulaires ; interprétation d’un contaminant comme une EI ou d’un <i>S. aureus</i> comme un contaminant.</p>
<div class="lab">Erreur fréquente</div><p>Attendre un pic fébrile pour prélever : la bactériémie de l’EI est continue.</p></template>

<template data-pop="i33-hcneg" data-title="EI à hémocultures négatives : démarche">
<div class="lab">Étape 1</div><p>Chercher une antibiothérapie préalable ; chez un patient stable, suspendre et répéter les hémocultures.</p>
<div class="lab">Étape 2</div><p>Sérologies orientées : <i>Coxiella burnetii</i>, <i>Bartonella</i>, <i>Brucella</i>, <i>Legionella</i>, <i>Mycoplasma</i> ; antigènes fongiques.</p>
<div class="lab">Étape 3</div><p>Biologie moléculaire sur sang et, surtout, sur la valve opérée ou un embole : PCR universelle du gène de l’ARN ribosomique 16S, PCR spécifiques (<i>Tropheryma whipplei</i>, <i>Bartonella</i>).</p>
<div class="lab">Étape 4</div><p>Histologie de la valve (colorations spéciales, coloration de Whipple par l’acide périodique de Schiff).</p>
<div class="lab">Étape 5</div><p>Causes non infectieuses : anticorps antinucléaires, anticorps antiphospholipides (Libman-Sacks), recherche de cancer (endocardite thrombotique non bactérienne).</p>
<div class="lab">Traitement d’attente</div><p>Schéma probabiliste adapté au contexte, discuté avec l’infectiologue.</p></template>

<template data-pop="i33-ett" data-title="ETT dans l’endocardite">
<div class="lab">Question clinique</div><p>Y a-t-il une végétation, une fuite valvulaire et un retentissement ventriculaire ?</p>
<div class="lab">Indication</div><p>Examen de première intention dès la suspicion ; indiquée dans toute bactériémie à <i>S. aureus</i> (ESC 2023) ; en fin de traitement, comme référence.</p>
<div class="lab">Performances</div><p>Sensibilité pour la végétation d’environ 70 % sur valve native et 50 % sur prothèse.</p>
<div class="lab">Ce qu’elle apporte</div><p>Fonction et dimensions ventriculaires, sévérité des fuites, pressions pulmonaires, épanchement péricardique ; bonne visualisation de la valve tricuspide.</p>
<div class="lab">Limites</div><p>Échogénicité, prothèses, petites végétations, abcès. Une ETT négative n’exclut pas l’EI.</p></template>

<template data-pop="i33-eto" data-title="ETO dans l’endocardite">
<div class="lab">Question clinique</div><p>Y a-t-il une végétation, et l’infection s’étend-elle au-delà de la valve ?</p>
<div class="lab">Principe</div><p>Sonde introduite dans l’œsophage, au contact de l’oreillette gauche : résolution supérieure pour les valves mitrale et aortique, les prothèses et les structures postérieures.</p>
<div class="lab">Indications (ESC 2023)</div><p>Chez tout patient suspect d’EI, même si l’ETT est positive, sauf EI isolée du cœur droit sur valve native avec ETT de bonne qualité (classe I) ; à répéter à 5–7 jours si négative et suspicion persistante ; en cas de complication suspectée ; avant un relais oral.</p>
<div class="lab">Performances</div><p>Sensibilité pour la végétation d’environ 96 % sur valve native et 92 % sur prothèse ; pour l’abcès, environ 90 %.</p>
<div class="lab">Risques</div><p>Sédation, lésion œsophagienne rare ; contre-indications œsophagiennes. Pas d’antibioprophylaxie nécessaire.</p></template>

<template data-pop="i33-tdm" data-title="Scanner cardiaque dans l’endocardite">
<div class="lab">Question clinique</div><p>Existe-t-il une extension périvalvulaire, et quelles sont les coronaires avant la chirurgie ?</p>
<div class="lab">Principe</div><p>Scanner synchronisé à l’ECG avec injection de produit de contraste iodé.</p>
<div class="lab">Forces</div><p>Abcès, pseudoanévrismes, fistules, en particulier autour des prothèses ; anatomie coronaire sans cathéter ; bilan des embolies viscérales dans le même temps.</p>
<div class="lab">Limites</div><p>Petites végétations et perforations moins bien vues qu’en ETO ; irradiation ; produit de contraste chez l’insuffisant rénal.</p>
<div class="lab">Place (ESC 2023)</div><p>EI possible sur valve native et EI sur prothèse, pour détecter les lésions ; critère majeur d’imagerie.</p></template>

<template data-pop="i33-tep" data-title="TEP-TDM au FDG">
<div class="lab">Question clinique</div><p>Existe-t-il une inflammation active autour d’une prothèse, d’un tube aortique ou d’une sonde, et des foyers à distance ?</p>
<div class="lab">Principe</div><p>Le FDG, analogue radioactif du glucose, s’accumule dans les cellules à métabolisme glucidique élevé, dont les cellules inflammatoires. La tomodensitométrie associée localise la fixation.</p>
<div class="lab">Préparation</div><p>Régime pauvre en glucides et riche en graisses pendant 12 à 24 heures, puis jeûne, pour supprimer la captation physiologique du myocarde.</p>
<div class="lab">Lecture</div><p>Captation périprothétique focale ou hétérogène, persistante sur les images non corrigées de l’atténuation : évocatrice d’EI. Captation homogène et modérée : souvent postopératoire.</p>
<div class="lab">Faux positifs et négatifs</div><p>Faux positifs : inflammation postopératoire précoce, colles chirurgicales, thrombus, vascularite, tumeur. Faux négatifs : antibiothérapie prolongée, petites végétations, valve native.</p>
<div class="lab">Place (ESC 2023)</div><p>EI possible sur prothèse (classe I) et sur dispositif ; critère majeur quel que soit le délai depuis l’implantation, avec une lecture prudente dans les premiers mois.</p></template>

<template data-pop="i33-poet" data-title="Essai POET (relais oral)">
<div class="lab">Plan</div><p>Essai randomisé danois, 400 patients atteints d’EI gauche à streptocoque, <i>E. faecalis</i>, <i>S. aureus</i> ou staphylocoque à coagulase négative, stables après au moins 10 jours de traitement intraveineux (7 jours après une chirurgie). Poursuite intraveineuse contre relais par deux antibiotiques oraux.</p>
<div class="lab">Critère de jugement</div><p>Composite : décès toutes causes, chirurgie cardiaque non prévue, embolie, rechute de la bactériémie.</p>
<div class="lab">Résultat</div><p>À 6 mois, 12,1 % d’événements dans le groupe intraveineux et 9,0 % dans le groupe oral : non-infériorité (<i>New England Journal of Medicine</i>, 2019). Le suivi à 5 ans (2022) a confirmé un résultat au moins équivalent du relais oral.</p>
<div class="lab">Limites</div><p>Population sélectionnée, stable, peu d’UDIV ; combinaisons d’antibiotiques et suivi pharmacologique propres à l’essai.</p>
<div class="lab">Recommandation</div><p>ESC 2023 : relais oral à envisager chez des patients stables sélectionnés (classe IIa), après une ETO excluant une complication.</p></template>
