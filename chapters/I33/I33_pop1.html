
<!-- ===== FENÊTRES : notions fondamentales et physiopathologie ===== -->
<template data-pop="i33-sa-valves" data-title="Anatomie des valves et du squelette fibreux">
<div class="lab">Squelette fibreux</div><p>Anneaux fibreux des quatre valves, reliés par les trigones fibreux droit (corps fibreux central) et gauche. Il ancre les valves et isole électriquement les oreillettes des ventricules ; le faisceau de His le traverse au niveau du corps fibreux central.</p>
<div class="lab">Voisinages à retenir</div><p>Anneau aortique : septum membraneux et faisceau de His sous la commissure coronaire droite – non coronaire ; continuité fibreuse avec le feuillet antérieur mitral ; ostiums coronaires dans les sinus droit et gauche. Anneau tricuspide : nœud auriculoventriculaire dans le triangle de Koch, à proximité.</p>
<div class="lab">Vascularisation</div><p>Les feuillets valvulaires adultes sont presque avasculaires : ils se nourrissent par diffusion à partir du sang. Seule leur base reçoit quelques capillaires.</p>
<div class="lab">Corrélation clinique</div><p>Abcès de l’anneau aortique → trouble de conduction ; pseudoanévrisme de la continuité mitro-aortique → fistule vers l’oreillette gauche ; valve avasculaire → antibiothérapie bactéricide prolongée à forte dose.</p></template>

<template data-pop="i33-vegetation" data-title="Végétation">
<div class="lab">Définition</div><p>Masse infectée faite de plaquettes, de fibrine, de microorganismes et de quelques cellules inflammatoires, attachée à une valve, à l’endocarde pariétal ou à du matériel implanté.</p>
<div class="lab">Siège typique</div><p>Du côté à basse pression du jet : face auriculaire des feuillets mitraux, face ventriculaire des sigmoïdes aortiques, face auriculaire de la tricuspide.</p>
<div class="lab">Échocardiographie</div><p>Masse mobile, de mouvement indépendant de celui de la valve, d’échogénicité proche du myocarde. Mesurer la plus grande longueur et décrire la mobilité : le seuil de 10 mm intervient dans les indications opératoires.</p>
<div class="lab">Évolution</div><p>Sous traitement efficace, la végétation peut diminuer, rester stable ou se fibroser. Une végétation qui <b>augmente</b> sous antibiotique signe une infection non contrôlée.</p>
<div class="lab">Piège</div><p>Une masse valvulaire n’est pas toujours une végétation infectieuse : thrombus, excroissance de Lambl, fibroélastome, dégénérescence myxoïde, endocardite thrombotique non bactérienne.</p></template>

<template data-pop="i33-biofilm" data-title="Biofilm bactérien">
<div class="lab">Définition</div><p>Communauté de bactéries fixées sur une surface, enveloppées dans une matrice extracellulaire qu’elles produisent (polysaccharides, protéines, ADN extracellulaire).</p>
<div class="lab">Propriétés</div><p>Les bactéries du biofilm se divisent peu et échangent des signaux chimiques. Elles tolèrent des concentrations d’antibiotiques bien supérieures à la CMI mesurée au laboratoire, sans être génétiquement résistantes : c’est la <b>tolérance</b>.</p>
<div class="lab">Dans l’EI</div><p>La végétation contient un biofilm ; le matériel étranger (prothèse, sonde, tube) en favorise la formation et la persistance.</p>
<div class="lab">Conséquences thérapeutiques</div><p>Traitement prolongé ; rifampicine dans l’EI à staphylocoque sur prothèse, car elle reste active sur les bactéries peu actives ; ablation du matériel lorsque c’est possible (extraction complète d’un dispositif électronique).</p></template>

<template data-pop="i33-pkpd" data-title="Pharmacodynamie des antibiotiques">
<div class="lab">Principe</div><p>La pharmacodynamie relie la concentration d’un antibiotique au site de l’infection à son effet sur la bactérie, en référence à la CMI.</p>
<div class="lab">Temps-dépendants</div><p>Bêtalactamines : l’effet dépend du temps pendant lequel la concentration reste au-dessus de la CMI. Plusieurs doses par jour, ou perfusion continue.</p>
<div class="lab">Concentration-dépendants</div><p>Aminosides, daptomycine : l’effet dépend du pic rapporté à la CMI. Une dose unique journalière maximise le pic et laisse une concentration résiduelle basse, ce qui réduit la toxicité rénale des aminosides.</p>
<div class="lab">Dépendants de l’exposition totale</div><p>Vancomycine : l’effet dépend de l’aire sous la courbe des concentrations sur 24 heures rapportée à la CMI.</p>
<div class="lab">Exemple</div><p>Une amoxicilline donnée en une seule dose de 12 g par jour serait moins efficace que la même dose répartie en six prises, car la concentration passerait sous la CMI pendant la majeure partie de la journée.</p></template>

<template data-pop="i33-cmi" data-title="Concentration minimale inhibitrice (CMI)">
<div class="lab">Définition</div><p>Plus faible concentration d’un antibiotique qui empêche la croissance visible d’une souche bactérienne in vitro, exprimée en mg/L.</p>
<div class="lab">Usage dans l’EI</div><p>La CMI de la pénicilline classe les streptocoques : ≤ 0,125 mg/L, sensibles ; 0,25 à 2 mg/L, sensibilité diminuée ; au-delà, résistants (seuils de l’<a href="https://pubmed.ncbi.nlm.nih.gov/26320109/" target="_blank" rel="noopener">ESC 2015</a> ; l’<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a> adopte les catégories 2022 du comité européen de l’antibiogramme : sensible à posologie standard, sensible à exposition augmentée, résistant). Le schéma et l’ajout de gentamicine en dépendent.</p>
<div class="lab">Piège</div><p>La CMI est mesurée sur des bactéries en division, dans un milieu liquide. Dans la végétation, l’inoculum élevé et le biofilm réduisent l’effet réel : une souche « sensible » peut exiger des doses élevées et une durée longue.</p></template>

<template data-pop="i33-venturi" data-title="Effet de jet et localisation des végétations">
<div class="lab">Mécanisme</div><p>Un sang propulsé d’une chambre à haute pression vers une chambre à basse pression à travers un orifice étroit forme un jet. Le jet lèse l’endothélium du côté d’arrivée, et la baisse de pression latérale au voisinage de l’orifice (effet Venturi) favorise le dépôt de plaquettes et de bactéries juste en aval.</p>
<div class="lab">Exemples</div><p>Insuffisance mitrale : face auriculaire des feuillets mitraux. Insuffisance aortique : face ventriculaire des sigmoïdes, et parfois cordages mitraux touchés par le jet. Communication interventriculaire : paroi du ventricule droit en face du jet.</p>
<div class="lab">Corrélation</div><p>Les lésions à faible gradient (grande communication interauriculaire) exposent peu à l’EI ; les lésions à gradient élevé et à orifice étroit exposent davantage.</p></template>

<template data-pop="i33-etnb" data-title="Endocardite thrombotique non bactérienne">
<div class="lab">Définition</div><p>Dépôt stérile de plaquettes et de fibrine sur une valve, sans microorganisme ni inflammation significative.</p>
<div class="lab">Contextes</div><p>Stade initial de l’EI (support de la colonisation bactérienne) ; forme autonome dans les cancers (surtout adénocarcinomes mucineux), les états d’hypercoagulabilité, le lupus (endocardite de Libman-Sacks) et le syndrome des antiphospholipides.</p>
<div class="lab">Conséquences</div><p>Embolies systémiques, en particulier cérébrales, avec des hémocultures négatives. Le traitement repose sur l’anticoagulation et le traitement de la cause, à l’inverse de l’EI.</p>
<div class="lab">Piège</div><p>Elle fait partie du diagnostic différentiel de l’EI à hémocultures négatives.</p></template>

<template data-pop="i33-adhesines" data-title="Adhésines bactériennes">
<div class="lab">Définition</div><p>Protéines de surface qui permettent à une bactérie de se fixer sur une cible de l’hôte.</p>
<div class="lab">Exemples</div><p><i>S. aureus</i> : protéines de liaison au fibrinogène (facteur d’agglutination) et à la fibronectine, de la famille des MSCRAMM ; elles permettent aussi l’entrée dans les cellules endothéliales. Streptocoques oraux : protéines de liaison aux plaquettes et au fibrinogène, glucanes (dextranes). Entérocoques : protéines de liaison au collagène et substance d’agrégation.</p>
<div class="lab">Corrélation</div><p>Ces adhésines expliquent pourquoi quelques genres causent la plupart des EI, et pourquoi <i>S. aureus</i> peut infecter une valve saine.</p></template>

<template data-pop="i33-ic-aigue" data-title="Régurgitation valvulaire aiguë">
<div class="lab">Mécanisme</div><p>Perforation d’un feuillet, rupture de cordage, déhiscence de prothèse ou fistule : un volume régurgité important apparaît brutalement dans une cavité non adaptée.</p>
<div class="lab">Aortique</div><p>Élévation rapide de la pression télédiastolique ventriculaire, fermeture mitrale prématurée, œdème pulmonaire, tachycardie. Souffle diastolique court et doux ; pression différentielle peu élargie.</p>
<div class="lab">Mitrale</div><p>Onde v géante dans l’oreillette gauche non dilatée, œdème pulmonaire à fonction ventriculaire conservée. Souffle parfois court ou absent.</p>
<div class="lab">Conduite</div><p>Chirurgie en urgence absolue si œdème pulmonaire réfractaire ou choc cardiogénique (<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>, classe I) ; dans l’intervalle, diurétiques, vasodilatateurs si la pression le permet, inotrope si besoin. Pas de bêtabloquant ni de ballon de contre-pulsion dans la fuite aortique.</p>
<div class="lab">Physiologie normale</div><p>Un ventricule gauche non dilaté a une compliance limitée : un faible surplus de volume diastolique élève fortement sa pression. Dans une fuite chronique, le ventricule se dilate progressivement et accueille le volume régurgité à pression presque normale.</p>
<div class="lab">Pourquoi ces signes</div><p>Dans la fuite aortique aiguë, la pression diastolique du ventricule non dilaté dépasse vite celle de l’oreillette gauche : la valve mitrale se ferme avant la systole, et la pression se transmet aux veines pulmonaires. Les pressions aortique et ventriculaire s’égalisent tôt dans la diastole : le souffle devient court et doux. La tachycardie compense, car elle raccourcit la diastole, donc la durée du reflux.</p>
<div class="lab">Pourquoi ces mesures</div><p>Un bêtabloquant allonge la diastole et supprime cette compensation : il augmente le volume régurgité. Le ballon de contre-pulsion se gonfle en diastole et élève la pression aortique diastolique : il augmente le reflux. Un vasodilatateur abaisse la postcharge et favorise l’éjection antérograde. Ces mesures gagnent du temps, mais seule la chirurgie supprime la fuite. L’<a href="https://pubmed.ncbi.nlm.nih.gov/40878295/" target="_blank" rel="noopener">ESC 2025 sur les valvulopathies</a> note qu’une stimulation rapide, qui raccourcit la diastole, peut améliorer transitoirement l’hémodynamique d’une fuite aortique aiguë.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">Delgado et al., ESC 2023</a>, sections 8.2.1 et 8.2.2 ; <a href="https://pubmed.ncbi.nlm.nih.gov/40878295/" target="_blank" rel="noopener">Praz et al., 2025 ESC/EACTS Guidelines for the management of valvular heart disease, European Heart Journal 2025;46:4635–4736</a>.</p>
</template>

<template data-pop="i33-abces" data-title="Abcès périvalvulaire">
<div class="lab">Définition</div><p>Collection infectée dans l’anneau valvulaire ou les tissus voisins. Il peut s’ouvrir dans une cavité (pseudoanévrisme) ou en relier deux (fistule).</p>
<div class="lab">Terrain</div><p>Valve aortique et prothèses surtout ; <i>S. aureus</i> et staphylocoques à coagulase négative.</p>
<div class="lab">Signes d’alerte</div><p>Fièvre persistante sous traitement adapté ; hémocultures persistantes ; allongement du PR ou bloc auriculoventriculaire nouveau ; nouvelle fuite paraprothétique.</p>
<div class="lab">Diagnostic</div><p>ETO (sensibilité d’environ 90 %) ; scanner cardiaque, supérieur pour les pseudoanévrismes et autour des prothèses ; TEP-TDM sur prothèse.</p>
<div class="lab">Conduite</div><p>Indication opératoire urgente, dans les trois à cinq jours (<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>, classe I). Surveillance du rythme ; un stimulateur épicardique peut être posé pendant la chirurgie.</p></template>

<template data-pop="i33-anevrisme" data-title="Anévrisme infectieux (« mycotique »)">
<div class="lab">Définition</div><p>Dilatation d’une paroi artérielle détruite par une embolie septique ou par une infection de la paroi. Le terme « mycotique » est historique : la plupart sont bactériens.</p>
<div class="lab">Sièges</div><p>Artères cérébrales distales (bifurcations de l’artère cérébrale moyenne), mais aussi artères viscérales et des membres.</p>
<div class="lab">Signes</div><p>Céphalées, déficit focal, hémorragie intracérébrale ou sous-arachnoïdienne ; souvent asymptomatique avant la rupture.</p>
<div class="lab">Diagnostic</div><p>Angioscanner ou angio-IRM ; l’angiographie conventionnelle reste la référence si le doute persiste.</p>
<div class="lab">Traitement</div><p>Antibiothérapie ; traitement endovasculaire proposé en cas de rupture ou de volume important (<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>) ; neurochirurgie dans certains cas. Arrêt de toute anticoagulation en cas de saignement.</p></template>

<template data-pop="i33-risque-emb" data-title="Facteurs du risque embolique">
<div class="lab">Végétation</div><p>Taille (≥ 10 mm, et davantage encore au-delà de 15 mm), mobilité, augmentation de taille sous traitement, localisation mitrale, en particulier sur le feuillet antérieur.</p>
<div class="lab">Germe</div><p><i>S. aureus</i>, <i>Candida</i>, <i>S. gallolyticus</i>.</p>
<div class="lab">Patient</div><p>Embolie antérieure ; atteinte multivalvulaire.</p>
<div class="lab">Temps</div><p>Risque maximal avant et pendant les deux premières semaines d’antibiothérapie efficace, puis décroissance rapide.</p>
<div class="lab">Décision</div><p>Ces éléments pèsent sur l’indication d’une chirurgie urgente de prévention des embolies (tableau <a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>).</p>
<div class="lab">Mécanisme</div><p>Une végétation grande et mobile oscille dans le flux à chaque battement ; ses couches externes, faites de fibrine et de bactéries, se fragmentent. Cette explication reste en partie hypothétique : les facteurs cités sont des associations statistiques, dont la taille et la mobilité sont les prédicteurs indépendants les plus forts (ESC 2023).</p>
<div class="lab">Ce qui change la décision</div><p>Dans l’essai randomisé de <a href="https://pubmed.ncbi.nlm.nih.gov/22738096/" target="_blank" rel="noopener">Kang et al.</a>, chez 76 patients atteints d’EI gauche avec fuite sévère et grosse végétation, la chirurgie dans les 48 heures a réduit le critère composite décès hospitalier ou embolie à 6 semaines de 23 % à 3 %, sans différence de mortalité à 6 mois. L’effet porte sur l’embolie : il justifie une chirurgie urgente, dans les 3 à 5 jours, plutôt que différée. Une végétation de plus de 30 mm expose particulièrement aux complications neurologiques. Selon une étude récente, la taille ne prédit un mauvais pronostic qu’associée à une autre indication opératoire ; le sujet âgé a un risque embolique observé plus faible (ESC 2023).</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">Delgado et al., ESC 2023</a>, sections 8.4.2, 8.4.3 et 12.2 ; <a href="https://pubmed.ncbi.nlm.nih.gov/22738096/" target="_blank" rel="noopener">Kang et al., Early surgery versus conventional treatment for infective endocarditis, New England Journal of Medicine 2012;366:2466–2473</a>.</p>
</template>

<template data-pop="i33-prothese" data-title="Endocardite sur prothèse valvulaire">
<div class="lab">Chronologie</div><p><b>Précoce</b> : dans les 12 mois suivant l’implantation, liée à la contamination périopératoire ; staphylocoques (dont coagulase négative), bacilles à Gram négatif, champignons. <b>Tardive</b> : au-delà de 12 mois ; germes proches de l’EI sur valve native.</p>
<div class="lab">Particularités</div><p>Atteinte de l’anneau de suture : abcès, déhiscence, fuite paraprothétique, obstruction ; troubles de conduction. ETT souvent négative ; ETO, scanner cardiaque et TEP-TDM complémentaires.</p>
<div class="lab">Traitement</div><p>Au moins 6 semaines ; pour les staphylocoques, rifampicine pendant au moins 6 semaines, ajoutée après négativation de la bactériémie, et gentamicine pendant 2 semaines (<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>). Chirurgie discutée plus largement, en particulier si <i>S. aureus</i> ou bacille à Gram négatif hors HACEK (ESC 2023, IIa).</p>
<div class="lab">Pronostic</div><p>Plus sévère que l’EI sur valve native.</p>
<div class="lab">Mécanisme</div><p>Le matériel prothétique n’a pas d’endothélium ; les protéines plasmatiques qui le recouvrent fixent les bactéries, qui forment un biofilm. La jonction entre l’anneau de suture et le tissu natif en est la principale surface colonisable, d’où l’abcès, la déhiscence et la fuite paraprothétique.</p>
<div class="lab">Conséquence clinique</div><p>La mortalité hospitalière atteint 20 à 40 %, deux fois celle de l’EI sur valve native ; elle dépasse 45 % avec <i>S. aureus</i>. La présentation est souvent atypique, surtout en période postopératoire, où fièvre et syndrome inflammatoire sont fréquents sans anomalie visible de la prothèse à l’imagerie (ESC 2023).</p>
<div class="lab">Ce qui change la décision</div><p>Une EI précoce, dans les 6 mois suivant la chirurgie, impose un nouveau remplacement avec débridement complet (ESC 2023, classe I), car les antibiotiques seuls guérissent rarement une infection périopératoire du matériel. Le chirurgien retire la prothèse, les sutures et les pledgets, car tout matériel laissé en place garde le biofilm. Une EI tardive non compliquée, non staphylococcique, peut être traitée médicalement sous surveillance étroite ; ne pas opérer malgré une indication claire est le premier facteur de récidive et de décès.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">Delgado et al., ESC 2023</a>, sections 7.6, 12.1.1 à 12.1.3 et tableau de recommandations 19 ; <a href="https://pubmed.ncbi.nlm.nih.gov/27582414/" target="_blank" rel="noopener">Holland et al., Nature Reviews Disease Primers 2016;2:16059</a>.</p>
</template>

<template data-pop="i33-deci" data-title="Endocardite sur dispositif électronique cardiaque implantable (DECI)">
<div class="lab">Définition</div><p>Infection des sondes d’un stimulateur, d’un défibrillateur ou d’un dispositif de resynchronisation, avec ou sans atteinte valvulaire. Elle se distingue de l’infection limitée à la loge du boîtier, même si l’une peut mener à l’autre.</p>
<div class="lab">Germes</div><p>Staphylocoques (<i>S. aureus</i> et coagulase négative) surtout.</p>
<div class="lab">Diagnostic</div><p>Hémocultures ; ETO pour voir les végétations de sonde et la valve tricuspide ; TEP-TDM à envisager dans l’EI possible sur dispositif (<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>).</p>
<div class="lab">Traitement</div><p>Extraction complète et sans délai du système (ESC 2023, classe I), par voie percutanée en centre expérimenté ; antibiothérapie adaptée. Réimplantation, si elle reste indiquée, à distance de l’ancien boîtier et le plus tard possible : hémocultures négatives depuis au moins 72 heures en l’absence de végétation, depuis au moins 2 semaines si des végétations ont été vues (ESC 2023, classe I ; consensus <a href="https://pubmed.ncbi.nlm.nih.gov/31702000/" target="_blank" rel="noopener">EHRA 2020</a>).</p>
<div class="lab">Piège</div><p>Traiter par antibiotiques seuls, sans extraction, expose presque toujours à la rechute.</p>
<div class="lab">Mécanisme</div><p>L’infection naît le plus souvent dans la loge, contaminée par la flore cutanée lors de l’implantation, puis progresse le long des sondes ; l’ensemencement par une bactériémie à distance est plus rare (ESC 2023). Les sondes portent un biofilm que les antibiotiques stérilisent rarement. Une bactériémie à <i>S. aureus</i> chez un porteur de dispositif doit donc faire suspecter une atteinte du système.</p>
<div class="lab">Pourquoi extraire sans délai</div><p>Le traitement conservateur est associé à une mortalité accrue, et l’extraction dans les premiers jours de l’hospitalisation à un meilleur pronostic (ESC 2023). Elle se fait par voie percutanée dans un centre disposant d’un recours chirurgical sur place, car elle peut déchirer une veine ou provoquer une tamponnade. Une végétation de plus de 20 mm fait discuter une aspiration préalable ou une extraction chirurgicale, pour limiter l’embolie pulmonaire. La réimplantation est différée, car un dispositif neuf placé dans un sang encore infecté serait colonisé à son tour.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">Delgado et al., ESC 2023</a>, sections 12.4.2, 12.4.5, 12.4.7 et figure 13.</p>
</template>

<template data-pop="i33-rechute" data-title="Rechute et réinfection">
<div class="lab">Rechute</div><p>Nouvel épisode dû au <b>même germe</b>, en général dans les 6 mois suivant le premier. Causes : traitement trop court ou inadapté, foyer persistant (abcès, matériel), germe difficile.</p>
<div class="lab">Réinfection</div><p>Nouvel épisode dû à un <b>germe différent</b>, ou au même germe au-delà de 6 mois. Causes : terrain à risque persistant, porte d’entrée non traitée, injection de drogues.</p>
<div class="lab">Distinction</div><p>Comparaison des souches par le laboratoire si nécessaire. La conservation de la souche initiale est donc utile.</p>
<div class="lab">Conséquence</div><p>Une rechute appelle la recherche d’un foyer et discute la chirurgie ; une réinfection appelle la correction du terrain et de la porte d’entrée.</p></template>

<template data-pop="i33-strepto" data-title="Streptocoques oraux (groupe « viridans »)">
<div class="lab">Espèces</div><p><i>S. mitis</i>, <i>S. oralis</i>, <i>S. sanguinis</i>, <i>S. mutans</i>, <i>S. salivarius</i> ; le groupe <i>S. anginosus</i> se distingue par sa tendance à former des abcès.</p>
<div class="lab">Origine</div><p>Flore de la bouche ; bactériémies lors du brossage, de la mastication et des soins dentaires.</p>
<div class="lab">Clinique</div><p>Évolution subaiguë, phénomènes immunologiques plus fréquents. Ces commensaux peu virulents détruisent lentement la valve ; la bactériémie dure alors des semaines, le temps nécessaire à la formation de complexes immuns.</p>
<div class="lab">Traitement</div><p>Selon la CMI de la pénicilline ; souvent très sensibles. Critère majeur de Duke (germe typique). Soins dentaires à organiser pendant l’hospitalisation.</p></template>

<template data-pop="i33-gallo" data-title="Streptococcus gallolyticus et cancer colorectal">
<div class="lab">Germe</div><p>Anciennement <i>Streptococcus bovis</i> biotype I ; streptocoque du groupe D d’origine digestive.</p>
<div class="lab">Association</div><p>Lien fort avec les adénomes et les cancers colorectaux, qui servent de porte d’entrée.</p>
<div class="lab">Conduite</div><p>Coloscopie chez tout patient atteint d’EI ou de bactériémie à <i>S. gallolyticus</i>, pendant l’hospitalisation ou peu après.</p>
<div class="lab">Clinique</div><p>Sujet âgé ; atteinte souvent multivalvulaire ; embolies fréquentes.</p>
<div class="lab">Mécanisme</div><p><i>S. gallolyticus</i> colonise la muqueuse colique, davantage à la surface des adénomes et des cancers. La tumeur rompt la barrière muqueuse et ouvre au germe une porte d’entrée vers le sang. Le sens de la relation reste débattu : la tumeur favorise la colonisation, et le germe pourrait à son tour favoriser la croissance tumorale.</p>
<div class="lab">Force de l’association</div><p>Dans la méta-analyse de <a href="https://pubmed.ncbi.nlm.nih.gov/21960713/" target="_blank" rel="noopener">Boleij et al.</a>, la médiane des patients infectés explorés porteurs d’un adénome ou d’un cancer colorectal atteignait 60 %. L’infection par le biotype I (<i>S. gallolyticus</i>) était associée au cancer colorectal avec un rapport de cotes de 7,26 par rapport au biotype II. Cette association justifie la coloscopie, qui cherche une lésion curable, sans prouver que le germe cause le cancer.</p>
<div class="lab">Source complémentaire</div><p><a href="https://pubmed.ncbi.nlm.nih.gov/21960713/" target="_blank" rel="noopener">Boleij et al., Clinical importance of Streptococcus gallolyticus infection among colorectal cancer patients: systematic review and meta-analysis, Clinical Infectious Diseases 2011;53:870–878</a>.</p>
</template>

<template data-pop="i33-hacek" data-title="Groupe HACEK">
<div class="lab">Composition</div><p>Bacilles à Gram négatif de la flore oropharyngée : <i>Haemophilus</i> (sauf <i>H. influenzae</i>), <i>Aggregatibacter</i>, <i>Cardiobacterium</i>, <i>Eikenella</i>, <i>Kingella</i>.</p>
<div class="lab">Particularités</div><p>Croissance lente, mais détectée par les automates modernes sans incubation prolongée. Végétations volumineuses et emboligènes. Germe typique (critère majeur de Duke).</p>
<div class="lab">Traitement</div><p>Ceftriaxone 2 g/jour, 4 semaines sur valve native, 6 semaines sur prothèse (ESC).</p>
<div class="lab">Pourquoi la ceftriaxone</div><p>Certains bacilles du groupe produisent des bêtalactamases, qui hydrolysent l’ampicilline : celle-ci n’est plus le premier choix. La ceftriaxone résiste à ces enzymes. Comme ces germes poussent lentement, la CMI standard est difficile à interpréter ; un antibiotique actif sur les souches productrices est donc préféré d’emblée. L’ampicilline associée à la gentamicine reste possible si la souche ne produit pas de bêtalactamase ; la ciprofloxacine est une alternative moins validée.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">Delgado et al., ESC 2023</a>, section 7.9.1.</p>
</template>

<template data-pop="i33-coxiella" data-title="Coxiella burnetii et Bartonella">
<div class="lab"><i>Coxiella burnetii</i> (fièvre Q)</div><p>Bactérie intracellulaire transmise par l’inhalation de poussières contaminées par les produits de mise bas des ruminants. L’EI survient surtout sur valvulopathie ou prothèse. Critère majeur : IgG de phase I &gt; 1:800 ou une hémoculture positive. Traitement : doxycycline et hydroxychloroquine pendant au moins 18 mois.</p>
<div class="lab"><i>Bartonella</i></div><p><i>B. quintana</i> (poux de corps, sans-abrisme, alcoolisme) et <i>B. henselae</i> (chat). Diagnostic par sérologie (IgG ≥ 1:800 : critère majeur de <a href="https://pubmed.ncbi.nlm.nih.gov/37138445/" target="_blank" rel="noopener">Duke-ISCVID</a>) et biologie moléculaire sur la valve. Traitement : doxycycline et gentamicine.</p>
<div class="lab">Piège</div><p>Ces germes ne poussent pas dans les hémocultures standard. Sans question ciblée sur les animaux et les conditions de vie, le diagnostic est manqué.</p>
<div class="lab">Pourquoi l’hydroxychloroquine</div><p><i>C. burnetii</i> se multiplie dans le phagolysosome des macrophages, dont le pH avoisine 4,8. Dans ce milieu acide, la doxycycline n’est pas bactéricide. Un agent lysosomotrope alcalinise le phagolysosome et rend à la doxycycline son effet bactéricide : <a href="https://pubmed.ncbi.nlm.nih.gov/1402021/" target="_blank" rel="noopener">Maurin et al.</a> l’ont montré in vitro avec la chloroquine, proche de l’hydroxychloroquine. En clinique, l’association doxycycline et hydroxychloroquine est nettement supérieure à la doxycycline seule (<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>).</p>
<div class="lab">Pourquoi si longtemps</div><p>Ces bactéries intracellulaires se divisent lentement et échappent aux défenses. Le traitement dure plus de 18 mois et s’arrête sur un critère sérologique : IgG de phase I inférieures à 1:400, IgA et IgM inférieures à 1:50. Les concentrations sanguines d’hydroxychloroquine sont surveillées (ESC 2023).</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">Delgado et al., ESC 2023</a>, tableau 11 ; <a href="https://pubmed.ncbi.nlm.nih.gov/1402021/" target="_blank" rel="noopener">Maurin et al., Phagolysosomal alkalinization and the bactericidal effect of antibiotics: the Coxiella burnetii paradigm, Journal of Infectious Diseases 1992;166:1097–1102</a>.</p>
</template>

<template data-pop="i33-udiv" data-title="Endocardite de l’usager de drogues par voie intraveineuse (UDIV)">
<div class="lab">Mécanisme</div><p>Injection répétée de germes cutanés et de particules, qui lèsent l’endothélium de la valve tricuspide, première valve rencontrée.</p>
<div class="lab">Clinique</div><p>Fièvre, toux, douleur pleurale, hémoptysie ; embolies pulmonaires septiques ; souffle souvent absent au début. <i>S. aureus</i> dans la majorité des cas ; <i>Pseudomonas</i>, <i>Candida</i> et germes polymicrobiens selon les pratiques d’injection.</p>
<div class="lab">Traitement court</div><p>EI tricuspide isolée à <i>S. aureus</i> sensible, sans complication, sans prothèse ni atteinte gauche, végétation ≤ 20 mm, bonne réponse initiale, sans immunosuppression sévère : (flu)cloxacilline pendant deux semaines (ESC).</p>
<div class="lab">Chirurgie</div><p>Végétation &gt; 20 mm avec embolies pulmonaires récidivantes ; insuffisance tricuspide sévère avec insuffisance cardiaque droite mal contrôlée ; infection persistante ou germe difficile. Réparation tricuspide préférée au remplacement.</p>
<div class="lab">Addiction</div><p>Traitement de substitution aux opioïdes, réduction des risques, accompagnement addictologique : sans eux, la réinfection est fréquente. Vérifier les interactions de la rifampicine avec la méthadone.</p></template>

<template data-pop="i33-embpulm" data-title="Embolies pulmonaires septiques">
<div class="lab">Mécanisme</div><p>Fragments de végétation tricuspide, pulmonaire ou de sonde migrant dans les artères pulmonaires.</p>
<div class="lab">Imagerie</div><p>Nodules multiples, périphériques, d’âges différents, qui s’excavent ; parfois infarctus triangulaires sous-pleuraux, épanchement pleural, empyème, pneumothorax.</p>
<div class="lab">Clinique</div><p>Toux, douleur pleurale, hémoptysie, fièvre ; tableau souvent pris pour une pneumonie.</p>
<div class="lab">Conséquence</div><p>Critère mineur de Duke (phénomène embolique) ; doit faire chercher une EI du cœur droit.</p></template>
<template data-pop="i33-fongique" data-title="Endocardite fongique">
<div class="lab">Physiologie normale</div><p><i>Candida</i> colonise le tube digestif, la peau et les muqueuses ; <i>Aspergillus</i> est un champignon de l’environnement, inhalé. L’intégrité des barrières et l’immunité cellulaire les empêchent d’envahir le sang.</p>
<div class="lab">Mécanisme</div><p>Le champignon entre dans le sang par un cathéter veineux central, une nutrition parentérale, l’injection de drogues ou à la faveur d’une immunosuppression. Il se fixe de préférence sur une prothèse ou un matériel, où il forme un biofilm. Les végétations fongiques sont souvent volumineuses et friables. <i>Aspergillus</i> pousse rarement dans les hémocultures : il cause une EI à hémocultures négatives (<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>).</p>
<div class="lab">Conséquence clinique</div><p>Les champignons s’observent surtout dans l’EI sur prothèse, chez l’UDIV et chez l’immunodéprimé. <i>Candida</i> fait partie des germes associés au risque embolique. La mortalité dépasse 50 % (ESC 2023).</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2023 classe les champignons parmi les germes peu susceptibles d’être contrôlés par le traitement anti-infectieux seul : la chirurgie est recommandée, urgente ou non urgente selon l’état hémodynamique (classe I). Contre <i>Candida</i>, le traitement associe une échinocandine à forte dose ou une amphotéricine B liposomale, avec ou sans flucytosine ; contre <i>Aspergillus</i>, le voriconazole est le premier choix. Un azolé oral suppressif est ensuite poursuivi longtemps, parfois à vie, car la rechute est fréquente. L’infectiologue de l’équipe endocardite participe à chaque décision.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">Delgado et al., 2023 ESC Guidelines for the management of endocarditis, European Heart Journal 2023;44:3948–4042</a> (sections 7.11, 8.3.3.3 et 8.4.2, tableau de recommandations 12).</p></template>
<template data-pop="i33-saureus" data-title="Staphylococcus aureus dans l’endocardite">
<div class="lab">Physiologie normale</div><p><i>S. aureus</i> est un commensal de la peau et des narines. Il reste à l’extérieur tant que la barrière cutanée est intacte. Il gagne le sang par une plaie, un cathéter, une aiguille d’injection ou une voie d’hémodialyse : ces portes d’entrée expliquent sa place dans l’EI associée aux soins et chez l’UDIV.</p>
<div class="lab">Mécanisme</div><p>Ses adhésines se lient au fibrinogène et à la fibronectine. Elles lui permettent d’adhérer à un endothélium intact et d’y pénétrer, donc d’infecter une valve saine. Une fois fixé, il sécrète des toxines qui lysent les cellules et des enzymes qui dégradent les tissus. La destruction est rapide : perforation des feuillets, abcès de l’anneau, fistule.</p>
<div class="lab">Conséquence clinique</div><p>L’EI à <i>S. aureus</i> évolue en quelques jours. Elle se complique plus souvent d’atteintes neurologiques que les EI dues à d’autres germes, et elle figure parmi les facteurs indépendants du risque embolique. Sur prothèse, sa mortalité dépasse 45 % (<a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">ESC 2023</a>).</p>
<div class="lab">Ce qui change la décision</div><p>Une échocardiographie est à envisager dans toute bactériémie à <i>S. aureus</i> (ESC 2023, classe IIa), car une EI peut évoluer sans souffle ni signe périphérique. Contre une souche sensible à la méticilline, la (flu)cloxacilline ou la céfazoline sont préférées, car la vancomycine est moins efficace que les bêtalactamines. La gentamicine n’est plus recommandée sur valve native : elle augmente la toxicité rénale sans bénéfice démontré. Sur prothèse, la rifampicine s’ajoute après 3 à 5 jours de traitement efficace, une fois la bactériémie négativée : elle agit sur les bactéries dormantes du biofilm, mais antagonise les autres antibiotiques contre les bactéries en division. Une EI sur prothèse à <i>S. aureus</i> fait discuter une chirurgie urgente (classe IIa).</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehad193" target="_blank" rel="noopener">Delgado et al., 2023 ESC Guidelines for the management of endocarditis, European Heart Journal 2023;44:3948–4042</a> (sections 5.4.1, 7.1, 7.6, 8.3.3.3, 8.4.2 et 9.1) ; <a href="https://pubmed.ncbi.nlm.nih.gov/26016486/" target="_blank" rel="noopener">Tong et al., Clinical Microbiology Reviews 2015;28:603–661</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27582414/" target="_blank" rel="noopener">Holland et al., Nature Reviews Disease Primers 2016;2:16059</a>.</p></template>
