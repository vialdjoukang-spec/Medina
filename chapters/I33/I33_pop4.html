<template data-pop="i33-d-pen" data-title="Pénicilline G, amoxicilline, ampicilline">
<div class="lab">Mécanisme</div><p>Liaison aux protéines de liaison à la pénicilline (PLP) et inhibition de la synthèse de la paroi ; bactéricidie temps-dépendante.</p>
<div class="lab">Preuves et place</div><p>Traitement de référence des EI à streptocoque sensible et, associée à la ceftriaxone ou à la gentamicine, des EI à <i>E. faecalis</i> (ESC 2023, dans la continuité de 2015).</p>
<div class="lab">Posologie (adulte)</div><p>Pénicilline G (Pénicilline «Grünenthal»®, sel sodique) : 20–60 millions d’unités/jour en 4–6 doses dans l’endocardite (l’ESC 2023 débute à 12–18 millions d’unités/jour, 24 millions pour une souche de sensibilité diminuée), injection lente d’au plus 0,5 million d’unités par minute, dose d’entretien réduite ou intervalle allongé en cas d’insuffisance rénale. Amoxicilline intraveineuse : 2 g en perfusion brève 3 à 6 fois par jour, soit au plus 12 g/jour, dose retenue pour les entérocoques ; si la clairance de la créatinine est de 10 à 30 mL/min, 1 g puis 0,5 à 1 g toutes les 12 heures. L’ampicilline des schémas probabilistes de l’ESC (12 g/jour) n’a pas d’information professionnelle suisse ; l’amoxicilline intraveineuse la remplace.</p>
<div class="lab">Effets indésirables</div><p>Allergie ; exanthème ; convulsions à forte dose en cas d’insuffisance rénale ; cristallurie à forte dose d’amoxicilline intraveineuse ; apport de sodium de la pénicilline G sodique ; diarrhée à <i>C. difficile</i>.</p>
<div class="lab">Contre-indications</div><p>Allergie immédiate documentée aux pénicillines.</p>
<div class="lab">Surveillance</div><p>Créatinine, natrémie et bilan hydrosodé, examen neurologique chez l’insuffisant rénal et le sujet âgé.</p>
<div class="lab">Pourquoi des convulsions chez l’insuffisant rénal</div><p>Le noyau bêtalactame se lie au récepteur de l’acide gamma-aminobutyrique, principal récepteur inhibiteur du cerveau, et réduit l’inhibition neuronale. À dose usuelle, la concentration cérébrale reste trop faible pour cet effet. Le rein élimine ces pénicillines : en cas d’insuffisance rénale, elles s’accumulent, et myoclonies, confusion ou convulsions apparaissent, surtout avec la pénicilline G et les fortes doses d’amoxicilline. Adapter la dose au DFG prévient cette toxicité.</p>
<div class="lab">Pourquoi une cristallurie</div><p>À forte dose intraveineuse, la concentration urinaire d’amoxicilline peut dépasser sa solubilité ; des cristaux se forment et peuvent obstruer les tubules. Le risque augmente quand la diurèse est faible ; une hydratation suffisante le prévient.</p>
<div class="lab">Pourquoi surveiller l’apport de sodium</div><p>La pénicilline G autorisée en Suisse est un sel sodique : chaque million d’unités apporte 38,6 mg de sodium, si bien que 60 millions d’unités par jour en apportent environ 2,3 g. Chez un patient en insuffisance cardiaque ou rénale, cette charge sodée peut aggraver la rétention hydrosodée ; l’information professionnelle demande d’en tenir compte.</p>
<div class="lab">Source complémentaire</div><p>Grill et al., <i>British Journal of Clinical Pharmacology</i> 2011;72:381–393 ; informations professionnelles suisses Pénicilline «Grünenthal»® et Amoxicillin Delbert®, Swissmedic (AIPS), consultées le 08.10.2026.</p>
</template>

<template data-pop="i33-d-flucl" data-title="(Flu)cloxacilline">
<div class="lab">Mécanisme</div><p>Pénicilline résistante à la pénicillinase staphylococcique ; bactéricidie temps-dépendante.</p>
<div class="lab">Place</div><p>Traitement de référence de l’EI à <i>S. aureus</i> sensible à la méticilline, seule sur valve native, associée à la rifampicine et à la gentamicine sur prothèse ; composante du traitement probabiliste communautaire (ESC 2023).</p>
<div class="lab">Posologie (adulte)</div><p>12 g/jour par voie intraveineuse, soit 2 g toutes les 4 heures, car l’information professionnelle suisse (Floxapen®) limite chaque perfusion à 2 g ; si la clairance de la créatinine est inférieure à 10 mL/min, 1 g toutes les 8 à 12 heures ; 4–6 semaines sur valve native, 2 semaines dans l’EI tricuspide non compliquée de l’UDIV, ≥ 6 semaines sur prothèse.</p>
<div class="lab">Effets indésirables</div><p>Hépatite cholestatique, parfois retardée ; néphrite interstitielle ; neutropénie lors des traitements prolongés ; phlébite ; acidose à 5-oxoproline en association au paracétamol.</p>
<div class="lab">Contre-indications</div><p>Allergie immédiate aux pénicillines.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques, créatinine et hémogramme chaque semaine.</p>
<div class="lab">Pourquoi l’acidose avec le paracétamol</div><p>Le glutathion est recyclé par un cycle enzymatique dont la 5-oxoproline, ou acide pyroglutamique, est un intermédiaire. Le paracétamol consomme le glutathion ; sa baisse lève le frein qu’il exerce sur la production de 5-oxoproline. Les pénicillines comme la flucloxacilline inhibent en plus la 5-oxoprolinase, qui l’élimine. La 5-oxoproline s’accumule et produit une acidose à trou anionique élevé, souvent avec une encéphalopathie. Dénutrition, sepsis et insuffisance rénale aggravent la déplétion en glutathion. Devant une acidose inexpliquée sous cette association, l’arrêt du paracétamol est la première mesure, et la recherche d’acide pyroglutamique dans les urines confirme le diagnostic.</p>
<div class="lab">Pourquoi l’hépatite peut être retardée</div><p>L’hépatite cholestatique à la flucloxacilline est une réaction immunitaire, fortement associée à un allèle du système des antigènes leucocytaires humains, le B*57:01. Elle peut débuter plusieurs semaines après le début du traitement, voire après son arrêt ; les tests hépatiques se poursuivent donc pendant tout le traitement.</p>
<div class="lab">Source complémentaire</div><p>Luyasu et al., <i>Acta Clinica Belgica</i> 2014;69:221–223 ; Daly et al., <i>Nature Genetics</i> 2009;41:816–819.</p>
</template>

<template data-pop="i33-d-cefaz" data-title="Céfazoline">
<div class="lab">Mécanisme</div><p>Céphalosporine de première génération, active sur les staphylocoques sensibles à la méticilline ; bactéricidie temps-dépendante.</p>
<div class="lab">Preuves et place</div><p>Alternative à la (flu)cloxacilline dans l’EI à <i>S. aureus</i> sensible (ESC 2023). Les études observationnelles et les méta-analyses montrent une efficacité comparable et une meilleure tolérance rénale et hépatique. Utilisable dans la plupart des allergies non immédiates aux pénicillines. Également antibiotique de la prophylaxie périopératoire des dispositifs électroniques.</p>
<div class="lab">Posologie (adulte)</div><p>4–6 g/jour par voie intraveineuse en 4 doses, dose de l’endocardite selon l’information professionnelle suisse (Kefzol®), alors que l’ESC 2023 propose 6 g/jour en 3 doses ; dose d’attaque puis dose d’entretien réduite selon la clairance de la créatinine, par exemple la moitié de la dose toutes les 12 heures entre 11 et 34 mL/min.</p>
<div class="lab">Effets indésirables</div><p>Allergie, diarrhée, neurotoxicité en cas d’accumulation chez l’insuffisant rénal.</p>
<div class="lab">Contre-indications</div><p>Allergie immédiate grave aux bêtalactamines.</p>
<div class="lab">Surveillance</div><p>Créatinine, hémogramme.</p>
<div class="lab">Pourquoi elle convient à la plupart des allergies retardées</div><p>Les réactions croisées entre pénicillines et céphalosporines dépendent surtout des chaînes latérales, plus que du noyau bêtalactame commun. La céfazoline possède des chaînes latérales qu’aucune pénicilline ne partage ; le risque de réaction croisée est donc faible. L’ESC 2023 la réserve néanmoins aux réactions non immédiates : après une anaphylaxie, un angio-œdème ou une urticaire sous pénicilline, une céphalosporine n’est pas donnée sans avis allergologique.</p>
<div class="lab">Limite : l’effet inoculum</div><p>Certaines souches de <i>S. aureus</i> produisent en grande quantité une pénicillinase, surtout de type A, qui hydrolyse la céfazoline lorsque l’inoculum est très élevé, comme dans une végétation. In vitro, 19 % des souches cliniques montrent cet effet, productrices de pénicillinase de type A ou C. Son impact clinique reste débattu : des échecs ont été décrits, mais les cohortes ne montrent pas de surmortalité sous céfazoline, et l’ESC la place au même rang que la (flu)cloxacilline.</p>
<div class="lab">Source complémentaire</div><p>Zagursky et al., <i>Journal of Allergy and Clinical Immunology: In Practice</i> 2018;6:72–81 ; Nannini et al., <i>Antimicrobial Agents and Chemotherapy</i> 2009;53:3437–3441 ; ESC 2023, tableau de recommandations 8.</p>
</template>

<template data-pop="i33-d-ceftri" data-title="Ceftriaxone">
<div class="lab">Mécanisme</div><p>Céphalosporine de troisième génération ; longue demi-vie autorisant une ou deux prises par jour.</p>
<div class="lab">Place</div><p>Streptocoques (2 g/jour, 4 semaines), HACEK (2 g/jour), <i>E. faecalis</i> en association à l’amoxicilline (4 g/jour en 2 doses, 6 semaines), traitement probabiliste communautaire (4 g/jour en 2 doses). Sa prise unique quotidienne facilite l’antibiothérapie parentérale ambulatoire.</p>
<div class="lab">Pourquoi dans l’entérocoque</div><p><i>E. faecalis</i> est naturellement résistant aux céphalosporines utilisées seules, car ses PLP les fixent mal, mais la ceftriaxone sature des PLP différentes de celles de l’amoxicilline : l’association est synergique et évite la toxicité des aminosides.</p>
<div class="lab">Effets indésirables</div><p>Boue et pseudolithiase biliaire ; encéphalopathie et convulsions à forte dose chez l’insuffisant rénal ou le sujet âgé ; diarrhée à <i>C. difficile</i> ; précipitation avec le calcium chez le nouveau-né.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques, état neurologique.</p>
<div class="lab">Pourquoi la boue biliaire</div><p>Une large part de la ceftriaxone, de l’ordre de 40 à 50 %, est éliminée sous forme active dans la bile. À forte dose, sa concentration biliaire dépasse sa solubilité, et elle précipite avec le calcium en sels insolubles. Cette pseudolithiase, visible en échographie, est souvent asymptomatique et régresse après l’arrêt ; elle peut toutefois causer des douleurs biliaires.</p>
<div class="lab">Pourquoi l’encéphalopathie à forte dose</div><p>Comme les autres bêtalactamines, la ceftriaxone réduit l’inhibition neuronale lorsqu’elle s’accumule dans le cerveau. Sa double élimination, rénale et biliaire, protège en partie. À 4 g par jour, chez le sujet âgé ou l’insuffisant rénal sévère, l’accumulation peut toutefois provoquer confusion, myoclonies et convulsions.</p>
<div class="lab">Source complémentaire</div><p>Information professionnelle suisse Rocephin®, Swissmedic (AIPS), consultée le 08.10.2026 : 1–2 g une fois par jour, jusqu’à 4 g en dose quotidienne unique dans les infections sévères, au plus 2 g/jour si la clairance de la créatinine est inférieure à 10 mL/min ou en dialyse ; Grill et al., <i>British Journal of Clinical Pharmacology</i> 2011;72:381–393.</p>
</template>

<template data-pop="i33-d-vanco" data-title="Vancomycine">
<div class="lab">Mécanisme</div><p>Glycopeptide qui se lie à l’extrémité dipeptidique terminale (alanyl-alanine) des précurseurs de la paroi ; bactéricidie lente, dépendante de l’exposition totale.</p>
<div class="lab">Place</div><p>Staphylocoque résistant à la méticilline ; allergie grave aux bêtalactamines ; traitement probabiliste des EI associées aux soins et des EI précoces sur prothèse.</p>
<div class="lab">Posologie (adulte)</div><p>15–20 mg/kg toutes les 8 à 12 heures, au plus 2 g par dose ; dose de charge de 25 à 30 mg/kg chez le patient gravement malade, non réduite en cas d’insuffisance rénale ; perfusion d’au moins 60 minutes ou à 10 mg/min au plus (information professionnelle suisse Vancocin®). Cible : aire sous la courbe sur 24 heures de 400–600 mg·h/L en supposant une CMI de 1 mg/L, atteinte dans les 48 heures (ESC 2023) ; à défaut, concentration résiduelle de 15–20 mg/L (information professionnelle suisse).</p>
<div class="lab">Effets indésirables</div><p>Néphrotoxicité, majorée par les aminosides et les autres néphrotoxiques ; érythème du haut du corps lors d’une perfusion trop rapide ; ototoxicité rare ; neutropénie lors des traitements prolongés.</p>
<div class="lab">Piège</div><p>Moins efficace que les bêtalactamines sur le staphylocoque sensible à la méticilline : ne pas l’utiliser dans cette situation sans raison.</p>
<div class="lab">Surveillance</div><p>Dosages sanguins, créatinine deux fois par semaine, hémogramme.</p>
<div class="lab">Pourquoi viser l’aire sous la courbe</div><p>L’effet de la vancomycine dépend de l’exposition totale rapportée à la CMI. Un rapport entre l’aire sous la courbe sur 24 heures et la CMI d’au moins 400 s’associe à la guérison des infections graves à <i>S. aureus</i> résistant à la méticilline ; au-delà de 600 mg·h/L, la néphrotoxicité augmente. La concentration résiduelle reflète mal cette exposition, et viser 15–20 mg/L a surexposé de nombreux patients. L’ESC 2023 retient donc 400–600 mg·h/L, en supposant une CMI de 1 mg/L, à atteindre dans les 48 premières heures.</p>
<div class="lab">Ce qui change la décision</div><p>Si la CMI dépasse 1 mg/L, la cible devient presque inaccessible sans dose toxique : l’ESC recommande alors d’envisager un autre antibiotique, par exemple la daptomycine.</p>
<div class="lab">Pourquoi elle est inférieure sur le staphylocoque sensible</div><p>La vancomycine tue plus lentement que les bêtalactamines anti-staphylococciques. Dans les bactériémies et les EI à <i>S. aureus</i> sensible, la cloxacilline ou la céfazoline s’associent à une mortalité plus basse que la vancomycine (ESC 2023).</p>
<div class="lab">Pourquoi la perfusion lente</div><p>Une perfusion rapide fait libérer l’histamine des mastocytes directement, sans anticorps : érythème du cou et du haut du corps, prurit, parfois hypotension. Ce n’est pas une allergie. Une perfusion d’au moins 60 minutes, plus longue pour les fortes doses, prévient la réaction.</p>
<div class="lab">Source complémentaire</div><p>Information professionnelle suisse Vancocin®, Swissmedic (AIPS), consultée le 08.10.2026 ; Sivagnanam et al., <i>Critical Care</i> 2003;7:119–120 ; ESC 2023, sections 7.7 et 7.12.</p>
</template>

<template data-pop="i33-d-dapto" data-title="Daptomycine">
<div class="lab">Mécanisme</div><p>Lipopeptide qui s’insère dans la membrane bactérienne en présence de calcium et la dépolarise ; bactéricidie rapide, concentration-dépendante, y compris sur une partie des bactéries peu actives.</p>
<div class="lab">Place</div><p>Alternative à la vancomycine dans l’EI à staphylocoque (ESC 2023), souvent associée à une autre molécule (fosfomycine, bêtalactamine) pour prévenir l’apparition de résistance ; traitement probabiliste des EI associées aux soins.</p>
<div class="lab">Posologie (adulte)</div><p>10 mg/kg/jour en 1 dose selon l’ESC 2023. Cette dose dépasse l’information professionnelle suisse (Cubicin®), qui autorise 6 mg/kg/jour dans la bactériémie à <i>S. aureus</i> et l’EI du cœur droit, et précise que l’efficacité n’est pas établie dans l’EI gauche à <i>S. aureus</i> ni sur prothèse valvulaire : l’usage à 10 mg/kg est donc hors information professionnelle. Si la clairance de la créatinine est inférieure à 30 mL/min, la dose est donnée toutes les 48 heures.</p>
<div class="lab">Effets indésirables</div><p>Myopathie et rhabdomyolyse ; pneumonie à éosinophiles ; inactivation par le surfactant, qui la rend inefficace dans la pneumonie primitive.</p>
<div class="lab">Surveillance</div><p>Créatine kinase hebdomadaire ; suspendre les statines pendant le traitement.</p>
<div class="lab">Pourquoi surveiller la créatine kinase</div><p>La daptomycine peut aussi léser la membrane des fibres musculaires squelettiques. La créatine kinase, enzyme libérée par la fibre lésée, s’élève avant la faiblesse et la rhabdomyolyse. Un dosage hebdomadaire, plus fréquent en cas d’insuffisance rénale ou d’élévation initiale, repère cette toxicité à un stade réversible ; une élévation avec symptômes musculaires impose l’arrêt.</p>
<div class="lab">Pourquoi suspendre les statines</div><p>Les statines exposent elles-mêmes à une myopathie. Les deux risques s’additionnent ; l’information professionnelle recommande donc d’envisager leur suspension pendant le traitement.</p>
<div class="lab">Pourquoi l’associer</div><p>Sous daptomycine seule, un foyer à inoculum élevé peut sélectionner des mutants de sensibilité diminuée. Une bêtalactamine, et probablement la fosfomycine, diminuent la charge positive de la surface bactérienne et augmentent ainsi la fixation de la daptomycine sur la membrane (ESC 2023). Le bénéfice clinique de l’association reste incertain : dans un essai de 352 patients atteints de bactériémie à staphylocoque résistant, l’ajout d’une bêtalactamine à la daptomycine ou à la vancomycine n’a pas réduit le critère composite et a augmenté les insuffisances rénales aiguës (ESC 2023).</p>
<div class="lab">Source complémentaire</div><p>ESC 2023, section 7.7 ; information professionnelle suisse Cubicin®, Swissmedic (AIPS), consultée le 08.10.2026.</p>
</template>

<template data-pop="i33-d-genta" data-title="Gentamicine">
<div class="lab">Mécanisme</div><p>Aminoside qui se lie au ribosome 30S ; bactéricidie concentration-dépendante ; synergie avec les inhibiteurs de paroi, qui facilitent son entrée.</p>
<div class="lab">Place (ESC 2023)</div><p>Schéma court de 2 semaines dans l’EI à streptocoque non compliquée sur valve native ; streptocoques de sensibilité diminuée ; EI sur prothèse à staphylocoque (2 semaines) ; alternative à la ceftriaxone dans l’EI à <i>E. faecalis</i> sans résistance de haut niveau. Plus d’indication dans l’EI à <i>S. aureus</i> sur valve native.</p>
<div class="lab">Posologie (adulte)</div><p>3 mg/kg/jour ; l’ESC 2023 admet une dose journalière unique dans les EI à streptocoque et à entérocoque, alors que l’information professionnelle suisse (Gentamicine AApot®) décrit 3 doses égales toutes les 8 heures. Durée limitée à 2 semaines et dose maximale de 240 mg/jour (ESC 2023). En insuffisance rénale, intervalle allongé ou dose réduite selon les tableaux de l’information professionnelle.</p>
<div class="lab">Effets indésirables</div><p>Néphrotoxicité (en général réversible) ; ototoxicité vestibulaire et cochléaire (souvent irréversible, parfois retardée) ; potentialisation des curares.</p>
<div class="lab">Contre-indications</div><p>Myasthénie ; prudence en cas d’insuffisance rénale, de surdité préexistante, de grossesse.</p>
<div class="lab">Surveillance</div><p>Concentrations sériques chaque semaine : en dose unique, résiduelle &lt; 1 mg/L et pic d’environ 10–12 mg/L une heure après l’injection (ESC 2023) ; en trois doses, pics usuels de 4 à 6 µg/mL, pic ≤ 10–12 mg/L et résiduelle ≤ 2 mg/L (information professionnelle suisse) ; créatinine ; interrogatoire sur les vertiges, l’instabilité et les acouphènes.</p>
<div class="lab">Pourquoi une dose unique et une résiduelle basse</div><p>La gentamicine entre dans les cellules du tubule proximal par endocytose après liaison à leur membrane, puis s’y accumule. Cette captation est saturable : une dose unique journalière produit un pic élevé, utile à la bactéricidie, sans augmenter d’autant la quantité captée par le rein. La période de concentration basse qui suit laisse le rein éliminer le médicament. Une concentration résiduelle basse, mesurée juste avant la dose suivante, montre que cette élimination a eu lieu ; une résiduelle élevée signale une accumulation et impose d’espacer ou de réduire les doses, comme le prévoit l’information professionnelle suisse.</p>
<div class="lab">Pourquoi l’oreille ne récupère pas</div><p>L’aminoside pénètre aussi dans les cellules ciliées de la cochlée et du vestibule, où il fait produire des radicaux libres qui déclenchent leur mort. Chez l’humain, ces cellules ne se régénèrent pas : la surdité de perception et l’instabilité sont souvent définitives et peuvent apparaître après l’arrêt. Le risque croît avec la durée cumulée, d’où la limite de 2 semaines et l’interrogatoire répété sur les vertiges et les acouphènes.</p>
<div class="lab">Pourquoi il a quitté l’EI à <i>S. aureus</i> sur valve native</div><p>Dans une cohorte prospective de 236 patients, une faible dose initiale de gentamicine s’associait à une baisse significative de la clairance de la créatinine, chez 22 % des patients contre 8 %, sans bénéfice démontré. L’ESC 2023 ne la recommande plus dans ce schéma.</p>
<div class="lab">Source complémentaire</div><p>Revue de la néphrotoxicité des aminosides, <i>Antimicrobial Agents and Chemotherapy</i> 1999;43:1003–1012 ; Rybak et al., <i>Kidney International</i> 2007;72:931–935 ; Cosgrove et al., <i>Clinical Infectious Diseases</i> 2009;48:713–721 ; ESC 2023, sections 7.1, 7.2 et 7.6 ; information professionnelle suisse Gentamicine AApot®, Swissmedic (AIPS), consultée le 08.10.2026.</p>
</template>

<template data-pop="i33-d-rif" data-title="Rifampicine">
<div class="lab">Mécanisme</div><p>Inhibition de l’ARN polymérase bactérienne ; bonne pénétration tissulaire et activité sur les staphylocoques du biofilm.</p>
<div class="lab">Place (ESC 2023)</div><p>EI sur prothèse à staphylocoque, en association, pendant au moins 6 semaines ; introduite après quelques jours de traitement efficace, lorsque la bactériémie est négativée ; composante de plusieurs relais oraux de l’essai POET.</p>
<div class="lab">Posologie (adulte)</div><p>600–1200 mg/jour en 2 prises, en association, dans les infections non mycobactériennes (information professionnelle suisse Rimactan®) ; l’ESC 2023 indique 900 mg/jour en 3 doses (staphylocoque sensible) ou 900–1200 mg/jour en 2 ou 3 doses (staphylocoque résistant) ; 600 mg × 2/jour dans les combinaisons orales de POET. Contre-indiquée si la clairance de la créatinine est inférieure à 25 mL/min ou en cas d’insuffisance hépatique grave.</p>
<div class="lab">Pourquoi jamais seule</div><p>Une seule mutation du gène <i>rpoB</i> suffit à rendre la bactérie résistante ; dans une population de 10⁹ bactéries, des mutants préexistent.</p>
<div class="lab">Effets indésirables</div><p>Hépatotoxicité ; coloration orange des liquides biologiques ; thrombopénie ; syndrome pseudo-grippal lors des prises intermittentes.</p>
<div class="lab">Interactions</div><p>Inducteur puissant des cytochromes (CYP3A4, CYP2C9) et de la glycoprotéine P : anticoagulants oraux directs, antivitamines K, immunosuppresseurs, méthadone, contraceptifs, antirétroviraux, azolés, nombreux psychotropes. L’effet persiste environ deux semaines après l’arrêt.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques ; revue des traitements associés à l’introduction et à l’arrêt.</p>
<div class="lab">Pourquoi elle agit sur le biofilm</div><p>La rifampicine est une petite molécule liposoluble : elle diffuse dans la matrice du biofilm et dans les cellules. Elle bloque l’ARN polymérase, dont même les bactéries qui ne se divisent plus ont besoin pour produire leurs protéines. Elle reste donc active là où les bêtalactamines, qui agissent sur la paroi en construction, tuent peu.</p>
<div class="lab">Pourquoi attendre la négativation</div><p>Les mutants résistants sont d’autant plus nombreux que l’inoculum est grand. Introduite au début, quand la charge bactérienne circulante et valvulaire est maximale, la rifampicine les sélectionnerait. Son association est de plus antagoniste sur les bactéries en multiplication active. L’ESC 2023 recommande donc de l’ajouter après 3 à 5 jours de traitement efficace, une fois la bactériémie négativée.</p>
<div class="lab">Limite des preuves</div><p>Son ajout dans l’EI à staphylocoque sur prothèse est une pratique standard fondée sur des modèles d’infection sur corps étranger et sur les infections prothétiques orthopédiques et vasculaires. Des données récentes n’ont pas montré de différence de pronostic avec ou sans rifampicine (ESC 2023).</p>
<div class="lab">Source complémentaire</div><p>ESC 2023, sections 7.1 et 7.6 ; information professionnelle suisse Rimactan®, Swissmedic (AIPS), consultée le 08.10.2026.</p>
</template>

<template data-pop="i33-d-lzd" data-title="Linézolide">
<div class="lab">Mécanisme</div><p>Oxazolidinone qui bloque l’initiation de la synthèse protéique au ribosome 50S ; biodisponibilité orale proche de 100 %.</p>
<div class="lab">Place</div><p>Relais oral dans l’essai POET, en association ; germes à Gram positif résistants.</p>
<div class="lab">Posologie (adulte)</div><p>600 mg × 2/jour par voie orale ou intraveineuse, sans adaptation rénale ; durée maximale de 28 jours selon l’information professionnelle suisse (Zyvoxid®), dont la sécurité au-delà n’est pas établie.</p>
<div class="lab">Effets indésirables</div><p>Myélosuppression, surtout thrombopénie, au-delà de deux semaines ; neuropathie périphérique et optique lors des traitements prolongés ; acidose lactique.</p>
<div class="lab">Interactions</div><p>Inhibiteur faible de la monoamine oxydase : syndrome sérotoninergique avec les antidépresseurs sérotoninergiques ; poussée hypertensive avec les aliments très riches en tyramine et les sympathomimétiques.</p>
<div class="lab">Surveillance</div><p>Hémogramme hebdomadaire ; acuité visuelle en cas de traitement prolongé.</p>
<div class="lab">Pourquoi ces toxicités apparaissent avec la durée</div><p>Les mitochondries humaines possèdent des ribosomes proches des ribosomes bactériens. Le linézolide inhibe aussi leur synthèse protéique et réduit la production des complexes de la chaîne respiratoire codés par l’ADN mitochondrial. Les tissus à forte demande énergétique en souffrent d’abord : les nerfs périphériques et le nerf optique dégénèrent, et le métabolisme anaérobie produit des lactates. La myélosuppression relève probablement en partie du même mécanisme. L’effet dépend de la dose et de la durée, d’où un risque surtout au-delà de deux semaines et la surveillance hebdomadaire de l’hémogramme et de la vision.</p>
<div class="lab">Source complémentaire</div><p>De Vriese et al., <i>Clinical Infectious Diseases</i> 2006;42:1111–1117.</p>
</template>

<!-- ===== FENÊTRES PARETO ===== -->
<template data-pop="pareto-i33-def" data-title="Pareto — Définition, classifications, épidémiologie">
<p class="ratio" data-cover="i33-1,i33-2"></p>
<ul><li>EI = infection de l’endocarde ; lésion clé : végétation ; souvent destruction valvulaire et périvalvulaire.</li><li>Décrire quatre axes : gauche ou droite ; valve native, prothèse (précoce &lt; 12 mois, tardive) ou dispositif ; communautaire, associée aux soins ou UDIV ; active ou guérie.</li><li>Rechute = même germe &lt; 6 mois ; réinfection = autre germe.</li><li>Suisse 2012–2021 : 1 361 → 1 636 hospitalisations/an ; âge médian 73 ans ; <i>S. aureus</i> 1er germe (19,8 → 30 %), streptocoques 21 %, entérocoques 8,7 %.</li><li>Mortalité hospitalière : <i>S. aureus</i> 19,9 %, streptocoques 6,6 %.</li></ul></template>

<template data-pop="pareto-i33-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i33-3"></p>
<ul><li>Endothélium lésé (jet, matériel) → thrombus stérile → bactériémie → adhésion (adhésines) → végétation → biofilm.</li><li>Végétation avasculaire, dense, bactéries peu actives → antibiotiques bactéricides, intraveineux, forte dose, longue durée ; rifampicine jamais seule.</li><li><i>S. aureus</i> adhère aussi à une valve saine.</li><li>Trois conséquences : destruction (fuite, abcès, bloc), embolies (infarctus, abcès, anévrismes infectieux), complexes immuns (glomérulonéphrite, Osler, Roth, facteur rhumatoïde).</li></ul></template>

<template data-pop="pareto-i33-etio" data-title="Pareto — Germes, terrains et formes cliniques">
<p class="ratio" data-cover="i33-4,i33-5"></p>
<ul><li><i>S. aureus</i> : peau, cathéter, dialyse, drogue, dispositif ; aiguë, destructrice.</li><li>Streptocoques oraux : dents ; subaiguë. <i>S. gallolyticus</i> → coloscopie.</li><li><i>E. faecalis</i> : sujet âgé, voies urinaires, TAVI. Staphylocoque à coagulase négative : prothèse précoce, dispositif.</li><li>HACEK : bouche, grosses végétations. <i>Coxiella</i>, <i>Bartonella</i> : hémocultures négatives.</li><li>Premier facteur de risque : antécédent d’EI ; puis prothèses, cardiopathies congénitales, dispositifs.</li><li>Bactériémie à <i>S. aureus</i>, à <i>E. faecalis</i> ou à certains streptocoques → échocardiographie à envisager (IIa).</li><li>Prothèse : anneau, abcès, ETT souvent négative. Dispositif : extraction complète. UDIV : tricuspide, <i>S. aureus</i>, embolies pulmonaires septiques ; traiter l’addiction.</li></ul></template>

<template data-pop="pareto-i33-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i33-6,i33-7"></p>
<ul><li>Fièvre chez un patient à risque = EI jusqu’à preuve du contraire ; fièvre qui cède sous antibiotique puis revient = alerte.</li><li>Rechercher : terrain, porte d’entrée, antibiotique récent, contacts animaux.</li><li>Sujet âgé : peu fébrile, confusion, altération de l’état général.</li><li>Examen : fièvre et souffle (les plus fréquents) ; signes d’insuffisance cardiaque ; pouls lent (bloc = abcès) ; examen neurologique ; porte d’entrée.</li><li>Osler (douloureux), Janeway (indolores), Roth, hémorragies sous-unguéales, splénomégalie : rares, leur absence n’exclut rien.</li></ul></template>

<template data-pop="pareto-i33-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i33-8"></p>
<ul><li>Hémocultures × 3 paires, 10 mL/flacon, avant antibiotique ; traitement immédiat seulement si sepsis ou forme aiguë.</li><li>ETT puis ETO chez presque tous (même si ETT positive) ; ETO répétée à 5–7 jours si doute.</li><li>Scanner : EI possible sur valve native, prothèse, coronaires préopératoires. TEP-TDM ou leucocytes marqués : prothèse, dispositif ; critère majeur quel que soit le délai.</li><li>Abcès de l’anneau aortique → PR long, bloc.</li><li>Duke ESC 2023 : majeurs = hémocultures typiques, imagerie ; mineurs = prédisposition, fièvre &gt; 38 °C, embolies, immunologiques, microbiologie. Certaine : 2 M ; 1 M + 3 m ; 5 m. Possible : 1 M + 1–2 m ; 3–4 m.</li><li>Duke-ISCVID 2023 : germes typiques sur matériel, biologie moléculaire, inspection peropératoire.</li><li>Différentiels : bactériémie d’autre origine, endocardite thrombotique non bactérienne et Libman-Sacks, thrombus, myxome, fibroélastome, Lambl.</li></ul></template>

<template data-pop="pareto-i33-compl" data-title="Pareto — Complications et urgences">
<p class="ratio" data-cover="i33-9"></p>
<ul><li>Urgences : œdème pulmonaire ou choc par fuite aiguë (chirurgie &lt; 24 h), choc septique, AVC (pas de thrombolyse), bloc nouveau (abcès), hémorragie (arrêt de l’anticoagulation).</li><li>Insuffisance cardiaque : complication la plus fréquente ; fuite aortique aiguë = souffle court et doux.</li><li>Infection non contrôlée : abcès, pseudoanévrisme, fistule → chirurgie.</li><li>Embolies 20–50 %, maximales avant et pendant les 2 premières semaines ; facteurs : taille ≥ 10 mm, mobilité, mitrale, <i>S. aureus</i>.</li><li>Neurologiques symptomatiques jusqu’à 35 %, lésions silencieuses à l’IRM jusqu’à 80 % : AVC, hémorragie, anévrisme infectieux, abcès, méningite.</li><li>Rate (infarctus, abcès), rein (infarctus, glomérulonéphrite, toxicité), spondylodiscite.</li></ul></template>

<template data-pop="pareto-i33-tt" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i33-10"></p>
<ul><li>Équipe endocardite ; EI compliquée en centre de chirurgie cardiaque.</li><li>Antibiotiques : bactéricides, intraveineux, forts, prolongés ; durée comptée depuis la 1re hémoculture négative ; valve positive → nouveau compte.</li><li>Probabiliste : communautaire → ampicilline + ceftriaxone (ou + (flu)cloxacilline + gentamicine) ; soins ou prothèse précoce → vancomycine ou daptomycine + gentamicine + rifampicine.</li><li>Streptocoque : pénicilline/amoxicilline/ceftriaxone 4 sem. ; <i>S. aureus</i> sensible : (flu)cloxacilline ou céfazoline 4–6 sem., sans gentamicine ; résistant : vancomycine ou daptomycine ; <i>E. faecalis</i> : amoxicilline + ceftriaxone 6 sem. ; HACEK : ceftriaxone ; prothèse ≥ 6 sem.</li><li>Relais oral (POET, IIa) : ≥ 10 j intraveineux, stable, ETO sans complication.</li><li>Chirurgie : insuffisance cardiaque (I), infection non contrôlée (I), embolies (végétation ≥ 10 mm) ; délais &lt; 24 h, 3–5 jours, même hospitalisation.</li><li>Après AVC ischémique sans coma ni hémorragie : ne pas retarder ; hémorragie intracrânienne : délai controversé, décision au cas par cas en équipe avec un neurologue ; chirurgie urgente discutée si hémorragie &lt; 30 mL ou déficit modéré.</li><li>Pas d’anticoagulant ni d’antiagrégant pour la végétation (pas de réduction des embolies, plus de saignements) ; dispositif → extraction complète ; réimplantation à distance de l’ancien boîtier, hémocultures négatives depuis ≥ 72 h sans végétation, ≥ 2 semaines si végétations.</li><li>Antibiothérapie ambulatoire après les 2 premières semaines, patient stable, sans complication.</li><li>Réparation mitrale préférée ; mécanique ou biologique selon les critères habituels ; homogreffe sans supériorité démontrée.</li><li>Fièvre &gt; 7 jours → abcès, embolie, cathéter, fièvre médicamenteuse.</li></ul></template>

<template data-pop="pareto-i33-suivi" data-title="Pareto — Suivi, prévention et situations particulières">
<p class="ratio" data-cover="i33-11,i33-12"></p>
<ul><li>Fin de traitement : ETT de référence, soins dentaires, éducation ; addiction traitée chez l’UDIV.</li><li>Mortalité hospitalière 15–30 % ; pronostic péjoratif : âge, prothèse, <i>S. aureus</i>, champignons, insuffisance cardiaque, abcès, AVC, choc.</li><li>Prévention non antibiotique pour tous : hygiène buccodentaire (contrôle 2×/an si haut risque), peau, cathéters ; pas de piercing ni de tatouage.</li><li>Prophylaxie : haut risque + soin dentaire à risque seulement ; bicuspidie et prolapsus non opérés : non ; TAVI : oui.</li><li>Grossesse : bêtalactamines, vancomycine ; aminosides si indispensable ; pas de tétracyclines.</li><li>Sujet âgé : entérocoques, <i>S. gallolyticus</i> ; toxicité accrue. Dialysé : <i>S. aureus</i>, mitrale.</li><li>UDIV : 2 semaines de (flu)cloxacilline si tricuspide non compliquée ; chirurgie si végétation &gt; 20 mm avec embolies récidivantes ; aspiration percutanée (IIb).</li><li>Suivi à 1, 3, 6 et 12 mois ; réadaptation (IIa). Grossesse : pas de tétracycline à partir du 2e trimestre, aminosides au plus court.</li><li>Fongique : remplacement valvulaire, échinocandine à forte dose ou amphotéricine B liposomale, puis azolé suppressif prolongé ; durée fixée avec l’infectiologue. Gram négatif hors HACEK : chirurgie précoce.</li><li>Réparation percutanée mitrale ou tricuspide : prophylaxie (ESC IIa ; Suisse 6 mois).</li><li>Rifampicine et antivitamine K : INR rapproché.</li></ul></template>

<template data-pop="pareto-i33-hc" data-title="Pareto — Hémocultures et microbiologie">
<p class="ratio" data-cover="i33-e-2"></p>
<ul><li>Bactériémie continue : pas besoin d’attendre un pic ; le volume (10 mL/flacon) fait la sensibilité.</li><li>≥ 3 paires, veine périphérique, avant antibiotique ; prévenir le laboratoire.</li><li>Germe typique dans ≥ 2 paires = majeur ; <i>S. aureus</i> jamais contaminant ; staphylocoque à coagulase négative dans 1 paire = contaminant probable hors matériel.</li><li>Contrôles à 48–72 h ; persistance → foyer non contrôlé, facteur indépendant de mortalité.</li><li>Hémocultures négatives : d’abord antibiothérapie préalable ; puis <i>Coxiella</i> (IgG phase I &gt; 1:800), <i>Bartonella</i>, <i>Brucella</i>, PCR 16S sur la valve, Libman-Sacks.</li></ul></template>

<template data-pop="pareto-i33-echo" data-title="Pareto — Échocardiographie">
<p class="ratio" data-cover="i33-e-4"></p>
<ul><li>Sensibilité végétation : ETT ≈ 70 % (native), 50 % (prothèse) ; ETO ≈ 96 % et 92 % ; abcès : ETT 50 %, ETO 90 %.</li><li>Lésions : végétation (mesurer, ≥ 10 mm), abcès (sans flux), pseudoanévrisme (avec flux), fistule, perforation, anévrisme de feuillet, déhiscence.</li><li>Fuite aortique aiguë sévère : fermeture mitrale prématurée, demi-décroissance &lt; 200 ms.</li><li>ETO négative n’exclut pas ; faux positifs : Lambl, fils, thrombus, Libman-Sacks.</li></ul></template>

<template data-pop="pareto-i33-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i33-e-1,i33-e-2,i33-e-3,i33-e-4,i33-e-5"></p>
<ul><li>Deux questions : quel germe (hémocultures, référence microbiologique) ; quelle lésion (ETO, référence échographique). Gold standard : culture, histologie et PCR de la valve.</li><li>Biologie : CRP (suivi, critère du relais oral), anémie, créatinine, sédiment urinaire (glomérulonéphrite), facteur rhumatoïde, C3/C4 ; ANCA PR3 possibles : ne pas conclure à une vascularite.</li><li>Dosages : gentamicine en dose unique (résiduelle &lt; 1 mg/L, pic ≈ 10–12 mg/L, ≤ 240 mg/jour) ; vancomycine : aire sous la courbe 400–600 mg·h/L ou résiduelle 15–20 mg/L ; procalcitonine &gt; 0,5 µg/L évocatrice mais non indispensable ; créatine kinase sous daptomycine.</li><li>Scanner : abcès, pseudoanévrisme, coronaires. TEP-TDM : prothèse, dispositif, foyers ; préparation pauvre en glucides ; faux positifs postopératoires.</li><li>IRM cérébrale : embolies silencieuses ; angiographie si hémorragie.</li><li>ECG : PR long, bloc → abcès ; radiographie : nodules excavés.</li></ul></template>

<template data-pop="pareto-i33-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i33-sa,i33-sh,i33-sp,i33-sm,i33-si"></p>
<ul><li>His dans le corps fibreux central, sous la commissure coronaire droite – non coronaire : abcès aortique → bloc.</li><li>Continuité mitro-aortique : pseudoanévrismes, fistules ; ostiums coronaires : embolies coronaires ; sondes → tricuspide.</li><li>Valve avasculaire ; végétation : fibrine et plaquettes en surface, bactéries en profondeur, peu de polynucléaires ; histologie = examen de référence (critère pathologique de Duke 2000 et Duke-ISCVID).</li><li>Fuite aiguë : ventricule non dilaté → pression télédiastolique ↑↑, égalisation, fermeture mitrale prématurée, souffle court ; pas de bêtabloquant ni de ballon intra-aortique.</li><li>Biofilm : tolérance ; <i>mecA</i> → PLP2a (résistance à la méticilline) ; <i>rpoB</i> → résistance à la rifampicine en une mutation.</li><li>Synergies : paroi lésée → entrée de l’aminoside (perdue si CMI gentamicine &gt; 128 mg/L) ; amoxicilline + ceftriaxone saturent des PLP différentes.</li><li>Bêtalactamines temps-dépendantes (plusieurs doses) ; aminosides et daptomycine concentration-dépendants (dose unique) ; vancomycine aire sous la courbe.</li><li>Complexes immuns → C3/C4 bas, glomérulonéphrite, facteur rhumatoïde (IgM anti-IgG), ANCA trompeurs.</li></ul></template>

<template data-pop="pareto-i33-schemas" data-title="Pareto — Schémas selon le germe">
<p class="ratio" data-cover="i33-p-2"></p>
<ul><li>Streptocoque CMI ≤ 0,125 : pénicilline G 20–60 millions d’unités/jour (information professionnelle suisse ; ESC : 12–18 millions), amoxicilline jusqu’à 12 g/jour ou ceftriaxone 2 g/jour, 4 sem. (6 sur prothèse) ; 2 sem. + gentamicine 3 mg/kg/jour si non compliquée. CMI 0,25–2 : + gentamicine 2 sem.</li><li><i>S. aureus</i> sensible, valve native : flucloxacilline 2 g toutes les 4 heures ou céfazoline 4–6 g/jour en 4 doses, 4–6 sem. Résistant : vancomycine 15–20 mg/kg toutes les 8 à 12 heures ou daptomycine 10 mg/kg/jour (ESC 2023, hors information professionnelle suisse, qui autorise 6 mg/kg/jour).</li><li>Prothèse à staphylocoque : + rifampicine 600–1200 mg/jour en 2 prises, après négativation des hémocultures, ≥ 6 sem. + gentamicine 2 sem.</li><li><i>E. faecalis</i> : amoxicilline 12 g/jour + ceftriaxone 4 g/jour, 6 sem.</li><li>HACEK : ceftriaxone 2 g/jour, 4 sem. (6 sur prothèse).</li><li>Pas de vancomycine pour un staphylocoque sensible si une bêtalactamine est possible.</li><li><i>Abiotrophia</i>, <i>Granulicatella</i> : pénicilline G, ceftriaxone ou vancomycine 6 sem., aminoside 2 sem. sur prothèse (grosses végétations, chirurgie fréquente) ; <i>Gemella</i> : pas de schéma spécifique de l’ESC ; <i>S. lugdunensis</i> = <i>S. aureus</i>.</li><li><i>E. faecium</i>, entérocoque résistant à la vancomycine : daptomycine 10–12 mg/kg/jour (hors information professionnelle suisse) + ampicilline ou fosfomycine, ou linézolide (au plus 28 jours). Gentamicine CMI &gt; 128 mg/L : plus de synergie → amoxicilline + ceftriaxone.</li><li>Gram négatif hors HACEK : chirurgie précoce, bêtalactamine + aminoside ≥ 6 sem.</li></ul></template>

<template data-pop="pareto-i33-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i33-p-1,i33-p-3,i33-p-4,i33-p-5"></p>
<ul><li>Classes : pénicillines et céphalosporines (base) ; vancomycine, daptomycine (résistance, allergie) ; gentamicine (synergie, courte) ; rifampicine (biofilm, prothèse) ; linézolide (relais oral).</li><li>Probabiliste communautaire : ampicilline 12 g/jour, remplacée en Suisse par l’amoxicilline intraveineuse, + ceftriaxone (IIa) ; soins ou prothèse précoce : vancomycine ou daptomycine + gentamicine + rifampicine (IIb).</li><li><i>Coxiella</i> : doxycycline + hydroxychloroquine ≥ 18 mois ; <i>Bartonella</i> : doxycycline 4 sem. + gentamicine 2 sem.</li><li><i>Candida</i> : amphotéricine B liposomale 3–5 mg/kg/jour ± flucytosine, ou échinocandine à forte dose (dose non chiffrée par l’ESC ; doses suisses de la candidose invasive : caspofungine 70 puis 50 mg/jour, micafungine 100 mg/jour, anidulafungine 200 puis 100 mg/jour) ; relais fluconazole (800 mg puis 400 mg/jour) ; remplacement valvulaire ; suppression au long cours sur prothèse.</li><li>Céfazoline si allergie non immédiate à la pénicilline.</li><li>Relais oral : EI gauche, 4 germes, ≥ 10 j intraveineux (≥ 7 j après chirurgie), apyrexie ≥ 2 j, CRP &lt; 25 % du pic ou &lt; 20 mg/L, leucocytes &lt; 15, ETO sans abcès, absorption fiable, pas d’obésité morbide ; deux antibiotiques oraux pour prévenir la sélection de mutants.</li><li>Toxicités : gentamicine (rein, oreille), vancomycine (rein), daptomycine (créatine kinase), flucloxacilline (foie), ceftriaxone forte dose (cerveau), linézolide (moelle, nerfs, par toxicité mitochondriale).</li><li>Interactions : linézolide + antidépresseurs sérotoninergiques ; rifampicine + anticoagulants, méthadone ; néphrotoxiques associés ; flucloxacilline + paracétamol (5-oxoproline).</li><li>À éviter : thrombolyse, anticoagulant « pour » la végétation, rifampicine seule, bêtabloquant dans la fuite aortique aiguë.</li></ul></template>

<template data-pop="pareto-i33-prophy" data-title="Pareto — Antibioprophylaxie">
<p class="ratio" data-cover="i33-p-6"></p>
<ul><li>Haut risque + soin dentaire à risque ; dose unique avant le geste, pendant la bactériémie brève du soin ; aucun essai randomisé, d’où la restriction aux patients à haut risque.</li><li>Amoxicilline 2 g par voie orale (enfant 50 mg/kg, max. 2 g) : 30–60 min avant (ESC), 1 h avant (Suisse).</li><li>Allergie retardée : céfalexine 2 g (ESC) ou céfuroxime axétil 1 g (Suisse).</li><li>Allergie immédiate : azithromycine ou clarithromycine 500 mg, doxycycline 100 mg (ESC, clindamycine déconseillée) ; clindamycine 600 mg (carte suisse 2021).</li><li>Gestes non dentaires : IIb selon l’ESC, non selon les experts suisses.</li><li>Réparation percutanée mitrale ou tricuspide : prophylaxie à envisager (ESC, IIa) ; 6 mois après la réparation (Suisse 2025).</li><li>Périopératoire : céfazoline (dispositif, staphylocoques cutanés) ; TAVI : couvrir entérocoques et <i>S. aureus</i>, par exemple amoxicilline-acide clavulanique (IIa).</li></ul></template>
