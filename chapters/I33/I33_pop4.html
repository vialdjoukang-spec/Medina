
<!-- ===== FENÊTRES : monographies ===== -->
<template data-pop="i33-d-pen" data-title="Pénicilline G, amoxicilline, ampicilline">
<div class="lab">Mécanisme</div><p>Liaison aux protéines de liaison à la pénicilline (PLP) et inhibition de la synthèse de la paroi ; bactéricidie temps-dépendante.</p>
<div class="lab">Preuves et place</div><p>Traitement de référence des EI à streptocoque sensible et, associée à la ceftriaxone ou à la gentamicine, des EI à <i>E. faecalis</i> (ESC 2023, dans la continuité de 2015).</p>
<div class="lab">Posologie (adulte)</div><p>Pénicilline G : 12–18 millions d’unités/jour en 4–6 doses ou en continu (24 millions si sensibilité diminuée). Amoxicilline : 100–200 mg/kg/jour en 4–6 doses (200 mg/kg/jour pour les entérocoques). Ampicilline probabiliste : 12 g/jour en 4–6 doses.</p>
<div class="lab">Effets indésirables</div><p>Allergie ; exanthème ; convulsions à forte dose en cas d’insuffisance rénale ; cristallurie à forte dose d’amoxicilline intraveineuse ; apport de potassium des formes potassiques de pénicilline G ; diarrhée à <i>C. difficile</i>.</p>
<div class="lab">Contre-indications</div><p>Allergie immédiate documentée aux pénicillines.</p>
<div class="lab">Surveillance</div><p>Créatinine, kaliémie, examen neurologique chez l’insuffisant rénal et le sujet âgé.</p></template>

<template data-pop="i33-d-flucl" data-title="(Flu)cloxacilline">
<div class="lab">Mécanisme</div><p>Pénicilline résistante à la pénicillinase staphylococcique ; bactéricidie temps-dépendante.</p>
<div class="lab">Place</div><p>Traitement de référence de l’EI à <i>S. aureus</i> sensible à la méticilline, seule sur valve native, associée à la rifampicine et à la gentamicine sur prothèse ; composante du traitement probabiliste communautaire (ESC 2023).</p>
<div class="lab">Posologie (adulte)</div><p>12 g/jour par voie intraveineuse en 4–6 doses ; 4–6 semaines sur valve native, 2 semaines dans l’EI tricuspide non compliquée de l’UDIV, ≥ 6 semaines sur prothèse.</p>
<div class="lab">Effets indésirables</div><p>Hépatite cholestatique, parfois retardée ; néphrite interstitielle ; neutropénie lors des traitements prolongés ; phlébite ; acidose à 5-oxoproline en association au paracétamol.</p>
<div class="lab">Contre-indications</div><p>Allergie immédiate aux pénicillines.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques, créatinine et hémogramme chaque semaine.</p></template>

<template data-pop="i33-d-cefaz" data-title="Céfazoline">
<div class="lab">Mécanisme</div><p>Céphalosporine de première génération, active sur les staphylocoques sensibles à la méticilline ; bactéricidie temps-dépendante.</p>
<div class="lab">Preuves et place</div><p>Alternative à la (flu)cloxacilline dans l’EI à <i>S. aureus</i> sensible (ESC 2023). Les études observationnelles et les méta-analyses montrent une efficacité comparable et une meilleure tolérance rénale et hépatique. Utilisable dans la plupart des allergies non immédiates aux pénicillines. Également antibiotique de la prophylaxie périopératoire des dispositifs électroniques.</p>
<div class="lab">Posologie (adulte)</div><p>6 g/jour par voie intraveineuse en 3 doses ; adaptée à la fonction rénale.</p>
<div class="lab">Effets indésirables</div><p>Allergie, diarrhée, neurotoxicité en cas d’accumulation chez l’insuffisant rénal.</p>
<div class="lab">Contre-indications</div><p>Allergie immédiate grave aux bêtalactamines.</p>
<div class="lab">Surveillance</div><p>Créatinine, hémogramme.</p></template>

<template data-pop="i33-d-ceftri" data-title="Ceftriaxone">
<div class="lab">Mécanisme</div><p>Céphalosporine de troisième génération ; longue demi-vie autorisant une ou deux prises par jour.</p>
<div class="lab">Place</div><p>Streptocoques (2 g/jour, 4 semaines), HACEK (2 g/jour), <i>E. faecalis</i> en association à l’amoxicilline (4 g/jour en 2 doses, 6 semaines), traitement probabiliste communautaire (4 g/jour en 2 doses). Sa prise unique quotidienne facilite l’antibiothérapie parentérale ambulatoire.</p>
<div class="lab">Pourquoi dans l’entérocoque</div><p><i>E. faecalis</i> est naturellement tolérant aux céphalosporines, mais la ceftriaxone sature des PLP différentes de celles de l’amoxicilline : l’association est synergique et évite la toxicité des aminosides.</p>
<div class="lab">Effets indésirables</div><p>Boue et pseudolithiase biliaire ; encéphalopathie et convulsions à forte dose chez l’insuffisant rénal ou le sujet âgé ; diarrhée à <i>C. difficile</i> ; précipitation avec le calcium chez le nouveau-né.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques, état neurologique.</p></template>

<template data-pop="i33-d-vanco" data-title="Vancomycine">
<div class="lab">Mécanisme</div><p>Glycopeptide qui se lie à l’extrémité dipeptidique terminale (alanyl-alanine) des précurseurs de la paroi ; bactéricidie lente, dépendante de l’exposition totale.</p>
<div class="lab">Place</div><p>Staphylocoque résistant à la méticilline ; allergie grave aux bêtalactamines ; traitement probabiliste des EI associées aux soins et des EI précoces sur prothèse.</p>
<div class="lab">Posologie (adulte)</div><p>Staphylocoque : 30–60 mg/kg/jour en 2–3 doses ; streptocoque et entérocoque : 30 mg/kg/jour en 2 doses ; dose ajustée au dosage sanguin. Cible : aire sous la courbe sur 24 heures de 400–600 mg·h/L (consensus 2020), ou à défaut concentration résiduelle de 15–20 mg/L.</p>
<div class="lab">Effets indésirables</div><p>Néphrotoxicité, majorée par les aminosides et les autres néphrotoxiques ; érythème du haut du corps lors d’une perfusion trop rapide ; ototoxicité rare ; neutropénie lors des traitements prolongés.</p>
<div class="lab">Piège</div><p>Moins efficace que les bêtalactamines sur le staphylocoque sensible à la méticilline : ne pas l’utiliser dans cette situation sans raison.</p>
<div class="lab">Surveillance</div><p>Dosages sanguins, créatinine deux fois par semaine, hémogramme.</p></template>

<template data-pop="i33-d-dapto" data-title="Daptomycine">
<div class="lab">Mécanisme</div><p>Lipopeptide qui s’insère dans la membrane bactérienne en présence de calcium et la dépolarise ; bactéricidie rapide, concentration-dépendante, y compris sur une partie des bactéries peu actives.</p>
<div class="lab">Place</div><p>Alternative à la vancomycine dans l’EI à staphylocoque (ESC 2023), souvent associée à une autre molécule (fosfomycine, bêtalactamine) pour prévenir l’apparition de résistance ; traitement probabiliste des EI associées aux soins.</p>
<div class="lab">Posologie (adulte)</div><p>10 mg/kg/jour en 1 dose ; intervalle allongé si le DFG est très bas, selon l’information professionnelle.</p>
<div class="lab">Effets indésirables</div><p>Myopathie et rhabdomyolyse ; pneumonie à éosinophiles ; inactivation par le surfactant, qui la rend inefficace dans la pneumonie primitive.</p>
<div class="lab">Surveillance</div><p>Créatine kinase hebdomadaire ; suspendre les statines pendant le traitement.</p></template>

<template data-pop="i33-d-genta" data-title="Gentamicine">
<div class="lab">Mécanisme</div><p>Aminoside qui se lie au ribosome 30S ; bactéricidie concentration-dépendante ; synergie avec les inhibiteurs de paroi, qui facilitent son entrée.</p>
<div class="lab">Place (ESC 2023)</div><p>Schéma court de 2 semaines dans l’EI à streptocoque non compliquée sur valve native ; streptocoques de sensibilité diminuée ; EI sur prothèse à staphylocoque (2 semaines) ; alternative à la ceftriaxone dans l’EI à <i>E. faecalis</i> sans résistance de haut niveau. Plus d’indication dans l’EI à <i>S. aureus</i> sur valve native.</p>
<div class="lab">Posologie (adulte)</div><p>3 mg/kg/jour en une dose ; durée limitée, en général à 2 semaines.</p>
<div class="lab">Effets indésirables</div><p>Néphrotoxicité (en général réversible) ; ototoxicité vestibulaire et cochléaire (souvent irréversible, parfois retardée) ; potentialisation des curares.</p>
<div class="lab">Contre-indications</div><p>Myasthénie ; prudence en cas d’insuffisance rénale, de surdité préexistante, de grossesse.</p>
<div class="lab">Surveillance</div><p>Concentration résiduelle inférieure à 1 mg/L ; créatinine ; interrogatoire sur les vertiges, l’instabilité et les acouphènes.</p></template>

<template data-pop="i33-d-rif" data-title="Rifampicine">
<div class="lab">Mécanisme</div><p>Inhibition de l’ARN polymérase bactérienne ; bonne pénétration tissulaire et activité sur les staphylocoques du biofilm.</p>
<div class="lab">Place (ESC 2023)</div><p>EI sur prothèse à staphylocoque, en association, pendant au moins 6 semaines ; introduite après quelques jours de traitement efficace, lorsque la bactériémie est négativée ; composante de plusieurs relais oraux de l’essai POET.</p>
<div class="lab">Posologie (adulte)</div><p>900–1200 mg/jour en 2–3 doses (EI sur prothèse) ; 600 mg × 2/jour dans les combinaisons orales de POET.</p>
<div class="lab">Pourquoi jamais seule</div><p>Une seule mutation du gène <i>rpoB</i> suffit à rendre la bactérie résistante ; dans une population de 10⁹ bactéries, des mutants préexistent.</p>
<div class="lab">Effets indésirables</div><p>Hépatotoxicité ; coloration orange des liquides biologiques ; thrombopénie ; syndrome pseudo-grippal lors des prises intermittentes.</p>
<div class="lab">Interactions</div><p>Inducteur puissant des cytochromes (CYP3A4, CYP2C9) et de la glycoprotéine P : anticoagulants oraux directs, antivitamines K, immunosuppresseurs, méthadone, contraceptifs, antirétroviraux, azolés, nombreux psychotropes. L’effet persiste environ deux semaines après l’arrêt.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques ; revue des traitements associés à l’introduction et à l’arrêt.</p></template>

<template data-pop="i33-d-lzd" data-title="Linézolide">
<div class="lab">Mécanisme</div><p>Oxazolidinone qui bloque l’initiation de la synthèse protéique au ribosome 50S ; biodisponibilité orale proche de 100 %.</p>
<div class="lab">Place</div><p>Relais oral dans l’essai POET, en association ; germes à Gram positif résistants.</p>
<div class="lab">Posologie (adulte)</div><p>600 mg × 2/jour par voie orale ou intraveineuse.</p>
<div class="lab">Effets indésirables</div><p>Myélosuppression, surtout thrombopénie, au-delà de deux semaines ; neuropathie périphérique et optique lors des traitements prolongés ; acidose lactique.</p>
<div class="lab">Interactions</div><p>Inhibiteur faible de la monoamine oxydase : syndrome sérotoninergique avec les antidépresseurs sérotoninergiques ; poussée hypertensive avec les aliments très riches en tyramine et les sympathomimétiques.</p>
<div class="lab">Surveillance</div><p>Hémogramme hebdomadaire ; acuité visuelle en cas de traitement prolongé.</p></template>

<!-- ===== FENÊTRES PARETO ===== -->
<template data-pop="pareto-i33-def" data-title="Pareto — Définition, classifications, épidémiologie">
<p class="ratio" data-cover="i33-1,i33-2"></p>
<ul><li>EI = infection de l’endocarde ; lésion clé : végétation ; souvent destruction valvulaire et périvalvulaire.</li><li>Codes : I33.0 (aiguë et subaiguë infectieuse) + code du germe ; I38, I39.-* (dague-étoile).</li><li>Décrire quatre axes : gauche ou droite ; valve native, prothèse (précoce &lt; 12 mois, tardive) ou dispositif ; communautaire, associée aux soins ou UDIV ; active ou guérie.</li><li>Rechute = même germe &lt; 6 mois ; réinfection = autre germe.</li><li>Suisse 2012–2021 : 1 361 → 1 636 hospitalisations/an ; âge médian 73 ans ; <i>S. aureus</i> 1er germe (19,8 → 30 %), streptocoques 21 %, entérocoques 8,7 %.</li><li>Mortalité hospitalière : <i>S. aureus</i> 19,9 %, streptocoques 6,6 %.</li></ul></template>

<template data-pop="pareto-i33-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i33-3"></p>
<ul><li>Endothélium lésé (jet, matériel) → thrombus stérile → bactériémie → adhésion (adhésines) → végétation → biofilm.</li><li>Végétation avasculaire, dense, bactéries peu actives → antibiotiques bactéricides, intraveineux, forte dose, longue durée ; rifampicine jamais seule.</li><li><i>S. aureus</i> adhère aussi à une valve saine.</li><li>Trois conséquences : destruction (fuite, abcès, bloc), embolies (infarctus, abcès, anévrismes infectieux), complexes immuns (glomérulonéphrite, Osler, Roth, facteur rhumatoïde).</li></ul></template>

<template data-pop="pareto-i33-etio" data-title="Pareto — Germes, terrains et formes cliniques">
<p class="ratio" data-cover="i33-4,i33-5"></p>
<ul><li><i>S. aureus</i> : peau, cathéter, dialyse, drogue, dispositif ; aiguë, destructrice.</li><li>Streptocoques oraux : dents ; subaiguë. <i>S. gallolyticus</i> → coloscopie.</li><li><i>E. faecalis</i> : sujet âgé, voies urinaires, TAVI. Staphylocoque à coagulase négative : prothèse précoce, dispositif.</li><li>HACEK : bouche, grosses végétations. <i>Coxiella</i>, <i>Bartonella</i> : hémocultures négatives.</li><li>Premier facteur de risque : antécédent d’EI ; puis prothèses, cardiopathies congénitales, dispositifs.</li><li>Toute bactériémie à <i>S. aureus</i> → au minimum ETT.</li><li>Prothèse : anneau, abcès, ETT souvent négative. Dispositif : extraction complète. UDIV : tricuspide, <i>S. aureus</i>, embolies pulmonaires septiques ; traiter l’addiction.</li></ul></template>

<template data-pop="pareto-i33-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i33-6,i33-7"></p>
<ul><li>Fièvre chez un patient à risque = EI jusqu’à preuve du contraire ; fièvre qui cède sous antibiotique puis revient = alerte.</li><li>Rechercher : terrain, porte d’entrée, antibiotique récent, contacts animaux.</li><li>Sujet âgé : peu fébrile, confusion, altération de l’état général.</li><li>Examen : fièvre et souffle (les plus fréquents) ; signes d’insuffisance cardiaque ; pouls lent (bloc = abcès) ; examen neurologique ; porte d’entrée.</li><li>Osler (douloureux), Janeway (indolores), Roth, hémorragies sous-unguéales, splénomégalie : rares, leur absence n’exclut rien.</li></ul></template>

<template data-pop="pareto-i33-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i33-8"></p>
<ul><li>Hémocultures × 3 paires, 10 mL/flacon, avant antibiotique ; traitement immédiat seulement si sepsis ou forme aiguë.</li><li>ETT puis ETO chez presque tous (même si ETT positive) ; ETO répétée à 5–7 jours si doute.</li><li>Scanner : EI possible sur valve native, prothèse, coronaires préopératoires. TEP-TDM ou leucocytes marqués : prothèse, dispositif ; critère majeur quel que soit le délai.</li><li>Abcès de l’anneau aortique → PR long, bloc.</li><li>Duke ESC 2023 : majeurs = hémocultures typiques, imagerie ; mineurs = prédisposition, fièvre &gt; 38 °C, embolies, immunologiques, microbiologie. Certaine : 2 M ; 1 M + 3 m ; 5 m. Possible : 1 M + 1–2 m ; 3–4 m.</li><li>Duke-ISCVID 2023 : germes typiques sur matériel, biologie moléculaire, inspection peropératoire.</li><li>Différentiels : bactériémie d’autre origine, endocardite thrombotique non bactérienne et Libman-Sacks, thrombus, myxome, fibroélastome, Lambl.</li></ul></template>

<template data-pop="pareto-i33-compl" data-title="Pareto — Complications et urgences">
<p class="ratio" data-cover="i33-9"></p>
<ul><li>Urgences : œdème pulmonaire ou choc par fuite aiguë (chirurgie &lt; 24 h), choc septique, AVC (pas de thrombolyse), bloc nouveau (abcès), hémorragie (arrêt de l’anticoagulation).</li><li>Insuffisance cardiaque : complication la plus fréquente ; fuite aortique aiguë = souffle court et doux.</li><li>Infection non contrôlée : abcès, pseudoanévrisme, fistule → chirurgie.</li><li>Embolies 20–50 %, maximales avant et pendant les 2 premières semaines ; facteurs : taille ≥ 10 mm, mobilité, mitrale, <i>S. aureus</i>.</li><li>Neurologiques 15–30 % : AVC, hémorragie, anévrisme infectieux, abcès, méningite.</li><li>Rate (infarctus, abcès), rein (infarctus, glomérulonéphrite, toxicité), spondylodiscite.</li></ul></template>

<template data-pop="pareto-i33-tt" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i33-10"></p>
<ul><li>Équipe endocardite ; EI compliquée en centre de chirurgie cardiaque.</li><li>Antibiotiques : bactéricides, intraveineux, forts, prolongés ; durée comptée depuis la 1re hémoculture négative ; valve positive → nouveau compte.</li><li>Probabiliste : communautaire → ampicilline + ceftriaxone (ou + (flu)cloxacilline + gentamicine) ; soins ou prothèse précoce → vancomycine ou daptomycine + gentamicine + rifampicine.</li><li>Streptocoque : pénicilline/amoxicilline/ceftriaxone 4 sem. ; <i>S. aureus</i> sensible : (flu)cloxacilline ou céfazoline 4–6 sem., sans gentamicine ; résistant : vancomycine ou daptomycine ; <i>E. faecalis</i> : amoxicilline + ceftriaxone 6 sem. ; HACEK : ceftriaxone ; prothèse ≥ 6 sem.</li><li>Relais oral (POET, IIa) : ≥ 10 j intraveineux, stable, ETO sans complication.</li><li>Chirurgie : insuffisance cardiaque (I), infection non contrôlée (I), embolies (végétation ≥ 10 mm) ; délais &lt; 24 h, 3–5 jours, même hospitalisation.</li><li>Après AVC ischémique sans coma ni hémorragie : ne pas retarder ; hémorragie : ≥ 1 mois.</li><li>Pas d’anticoagulant ni d’antiagrégant pour la végétation ; dispositif → extraction complète ; réimplantation controlatérale après ≥ 72 h d’hémocultures négatives (2 semaines si atteinte valvulaire).</li><li>Antibiothérapie ambulatoire après les 2 premières semaines, patient stable, sans complication.</li><li>Réparation mitrale préférée ; mécanique ou biologique selon les critères habituels ; homogreffe sans supériorité démontrée.</li><li>Fièvre &gt; 7 jours → abcès, embolie, cathéter, fièvre médicamenteuse.</li></ul></template>

<template data-pop="pareto-i33-suivi" data-title="Pareto — Suivi, prévention et situations particulières">
<p class="ratio" data-cover="i33-11,i33-12"></p>
<ul><li>Fin de traitement : ETT de référence, soins dentaires, éducation ; addiction traitée chez l’UDIV.</li><li>Mortalité hospitalière 15–30 % ; pronostic péjoratif : âge, prothèse, <i>S. aureus</i>, champignons, insuffisance cardiaque, abcès, AVC, choc.</li><li>Prévention non antibiotique pour tous : hygiène buccodentaire (contrôle 2×/an si haut risque), peau, cathéters ; pas de piercing ni de tatouage.</li><li>Prophylaxie : haut risque + soin dentaire à risque seulement ; bicuspidie et prolapsus non opérés : non ; TAVI : oui.</li><li>Grossesse : bêtalactamines, vancomycine ; aminosides si indispensable ; pas de tétracyclines.</li><li>Sujet âgé : entérocoques, <i>S. gallolyticus</i> ; toxicité accrue. Dialysé : <i>S. aureus</i>, mitrale.</li><li>UDIV : 2 semaines de (flu)cloxacilline si tricuspide non compliquée ; chirurgie si végétation &gt; 20 mm avec embolies récidivantes ; aspiration percutanée (IIb).</li><li>Suivi à 1, 3, 6 et 12 mois ; réadaptation (IIa). Grossesse : pas de tétracycline à partir du 2e trimestre, aminosides au plus court.</li><li>Fongique : remplacement valvulaire, antifongique ≥ 6 sem. après chirurgie. Gram négatif hors HACEK : chirurgie précoce.</li><li>Réparation percutanée mitrale ou tricuspide : prophylaxie (ESC IIa ; Suisse 6 mois).</li><li>Rifampicine et antivitamine K : INR rapproché.</li></ul></template>

<template data-pop="pareto-i33-hc" data-title="Pareto — Hémocultures et microbiologie">
<p class="ratio" data-cover="i33-e-2"></p>
<ul><li>Bactériémie continue : pas besoin d’attendre un pic ; le volume (10 mL/flacon) fait la sensibilité.</li><li>≥ 3 paires, veine périphérique, avant antibiotique ; prévenir le laboratoire.</li><li>Germe typique dans ≥ 2 paires = majeur ; <i>S. aureus</i> jamais contaminant ; staphylocoque à coagulase négative dans 1 paire = contaminant probable hors matériel.</li><li>Contrôles à 48–72 h ; persistance → foyer non contrôlé.</li><li>Hémocultures négatives : d’abord antibiothérapie préalable ; puis <i>Coxiella</i> (IgG phase I &gt; 1:800), <i>Bartonella</i>, <i>Brucella</i>, PCR 16S sur la valve, Libman-Sacks.</li></ul></template>

<template data-pop="pareto-i33-echo" data-title="Pareto — Échocardiographie">
<p class="ratio" data-cover="i33-e-4"></p>
<ul><li>Sensibilité végétation : ETT ≈ 70 % (native), 50 % (prothèse) ; ETO ≈ 96 % et 92 % ; abcès : ETT 50 %, ETO 90 %.</li><li>Lésions : végétation (mesurer, ≥ 10 mm), abcès (sans flux), pseudoanévrisme (avec flux), fistule, perforation, anévrisme de feuillet, déhiscence.</li><li>Fuite aortique aiguë sévère : fermeture mitrale prématurée, demi-décroissance &lt; 200 ms.</li><li>ETO négative n’exclut pas ; faux positifs : Lambl, fils, thrombus, Libman-Sacks.</li></ul></template>

<template data-pop="pareto-i33-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i33-e-1,i33-e-2,i33-e-3,i33-e-4,i33-e-5"></p>
<ul><li>Deux questions : quel germe (hémocultures, référence microbiologique) ; quelle lésion (ETO, référence échographique). Gold standard : culture, histologie et PCR de la valve.</li><li>Biologie : CRP (suivi, critère du relais oral), anémie, créatinine, sédiment urinaire (glomérulonéphrite), facteur rhumatoïde, C3/C4 ; ANCA PR3 possibles : ne pas conclure à une vascularite.</li><li>Dosages : gentamicine résiduelle &lt; 1 mg/L ; vancomycine : aire sous la courbe 400–600 mg·h/L ou résiduelle 15–20 mg/L ; procalcitonine &gt; 0,5 µg/L évocatrice mais non indispensable ; créatine kinase sous daptomycine.</li><li>Scanner : abcès, pseudoanévrisme, coronaires. TEP-TDM : prothèse, dispositif, foyers ; préparation pauvre en glucides ; faux positifs postopératoires.</li><li>IRM cérébrale : embolies silencieuses ; angiographie si hémorragie.</li><li>ECG : PR long, bloc → abcès ; radiographie : nodules excavés.</li></ul></template>

<template data-pop="pareto-i33-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i33-sa,i33-sh,i33-sp,i33-sm,i33-si"></p>
<ul><li>His dans le corps fibreux central, sous la commissure coronaire droite – non coronaire : abcès aortique → bloc.</li><li>Continuité mitro-aortique : pseudoanévrismes, fistules ; ostiums coronaires : embolies coronaires ; sondes → tricuspide.</li><li>Valve avasculaire ; végétation : fibrine et plaquettes en surface, bactéries en profondeur, peu de polynucléaires ; critère pathologique.</li><li>Fuite aiguë : ventricule non dilaté → pression télédiastolique ↑↑, égalisation, fermeture mitrale prématurée, souffle court ; pas de bêtabloquant ni de ballon intra-aortique.</li><li>Biofilm : tolérance ; <i>mecA</i> → PLP2a (résistance à la méticilline) ; <i>rpoB</i> → résistance à la rifampicine en une mutation.</li><li>Synergies : paroi lésée → entrée de l’aminoside (perdue si CMI gentamicine &gt; 500 mg/L) ; amoxicilline + ceftriaxone saturent des PLP différentes.</li><li>Bêtalactamines temps-dépendantes (plusieurs doses) ; aminosides et daptomycine concentration-dépendants (dose unique) ; vancomycine aire sous la courbe.</li><li>Complexes immuns → C3/C4 bas, glomérulonéphrite, facteur rhumatoïde (IgM anti-IgG), ANCA trompeurs.</li></ul></template>

<template data-pop="pareto-i33-schemas" data-title="Pareto — Schémas selon le germe">
<p class="ratio" data-cover="i33-p-2"></p>
<ul><li>Streptocoque CMI ≤ 0,125 : pénicilline G 12–18 millions d’unités/jour, amoxicilline 100–200 mg/kg/jour ou ceftriaxone 2 g/jour, 4 sem. (6 sur prothèse) ; 2 sem. + gentamicine 3 mg/kg/jour si non compliquée. CMI 0,25–2 : + gentamicine 2 sem.</li><li><i>S. aureus</i> sensible, valve native : (flu)cloxacilline 12 g/jour ou céfazoline 6 g/jour, 4–6 sem. Résistant : vancomycine 30–60 mg/kg/jour ou daptomycine 10 mg/kg/jour.</li><li>Prothèse à staphylocoque : + rifampicine 900–1200 mg/jour ≥ 6 sem. + gentamicine 2 sem.</li><li><i>E. faecalis</i> : amoxicilline 200 mg/kg/jour + ceftriaxone 4 g/jour, 6 sem.</li><li>HACEK : ceftriaxone 2 g/jour, 4 sem. (6 sur prothèse).</li><li>Pas de vancomycine pour un staphylocoque sensible si une bêtalactamine est possible.</li><li><i>Abiotrophia</i>, <i>Granulicatella</i>, <i>Gemella</i> = streptocoque de sensibilité diminuée ; <i>S. lugdunensis</i> = <i>S. aureus</i>.</li><li><i>E. faecium</i>, entérocoque résistant à la vancomycine : daptomycine 10–12 mg/kg/jour + ampicilline ou fosfomycine, ou linézolide. Gentamicine CMI &gt; 500 mg/L : plus de synergie → amoxicilline + ceftriaxone.</li><li>Gram négatif hors HACEK : chirurgie précoce, bêtalactamine + aminoside ≥ 6 sem.</li></ul></template>

<template data-pop="pareto-i33-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i33-p-1,i33-p-3,i33-p-4,i33-p-5"></p>
<ul><li>Classes : pénicillines et céphalosporines (base) ; vancomycine, daptomycine (résistance, allergie) ; gentamicine (synergie, courte) ; rifampicine (biofilm, prothèse) ; linézolide (relais oral).</li><li>Probabiliste communautaire : ampicilline 12 g + ceftriaxone 4 g/jour (IIa) ; soins ou prothèse précoce : vancomycine ou daptomycine + gentamicine + rifampicine (IIb).</li><li><i>Coxiella</i> : doxycycline + hydroxychloroquine ≥ 18 mois ; <i>Bartonella</i> : doxycycline 4 sem. + gentamicine 2 sem.</li><li><i>Candida</i> : amphotéricine B liposomale 3–5 mg/kg/jour ± flucytosine, ou caspofungine ou micafungine 150 mg/jour ; relais fluconazole 400–800 mg/jour ; remplacement valvulaire ; suppression au long cours sur prothèse.</li><li>Céfazoline si allergie non immédiate à la pénicilline.</li><li>Relais oral : EI gauche, 4 germes, ≥ 10 j intraveineux (≥ 7 j après chirurgie), apyrexie ≥ 2 j, CRP &lt; 25 % du pic ou &lt; 20 mg/L, leucocytes &lt; 15, ETO sans abcès ; deux antibiotiques oraux.</li><li>Toxicités : gentamicine (rein, oreille), vancomycine (rein), daptomycine (créatine kinase), flucloxacilline (foie), ceftriaxone forte dose (cerveau), linézolide (moelle, nerfs).</li><li>Interactions : linézolide + antidépresseurs sérotoninergiques ; rifampicine + anticoagulants, méthadone ; néphrotoxiques associés ; flucloxacilline + paracétamol (5-oxoproline).</li><li>À éviter : thrombolyse, anticoagulant « pour » la végétation, rifampicine seule, bêtabloquant dans la fuite aortique aiguë.</li></ul></template>

<template data-pop="pareto-i33-prophy" data-title="Pareto — Antibioprophylaxie">
<p class="ratio" data-cover="i33-p-6"></p>
<ul><li>Haut risque + soin dentaire à risque ; dose unique avant le geste.</li><li>Amoxicilline 2 g par voie orale (enfant 50 mg/kg, max. 2 g) : 30–60 min avant (ESC), 1 h avant (Suisse).</li><li>Allergie retardée : céfalexine 2 g (ESC) ou céfuroxime axétil 1 g (Suisse).</li><li>Allergie immédiate : azithromycine ou clarithromycine 500 mg, doxycycline 100 mg (ESC, clindamycine déconseillée) ; clindamycine 600 mg (carte suisse 2021).</li><li>Gestes non dentaires : IIb selon l’ESC, non selon les experts suisses.</li><li>Réparation percutanée mitrale ou tricuspide : prophylaxie à envisager (ESC, IIa) ; 6 mois après la réparation (Suisse 2025).</li><li>Périopératoire : céfazoline (dispositif) ; amoxicilline-acide clavulanique ou ampicilline (TAVI).</li></ul></template>
