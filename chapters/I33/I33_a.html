<section class="ilot" id="i33-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 71 ans, porteuse d’une bioprothèse aortique implantée il y a quatre ans, consulte pour une fièvre à 38,4 °C qui évolue depuis trois semaines. Elle a perdu 3 kg et se sent épuisée. Son médecin traitant lui a prescrit de l’amoxicilline pendant sept jours pour une « bronchite » ; la fièvre a disparu puis est revenue. La question qui structure tout le chapitre est la suivante : <b>cette fièvre traduit-elle une infection de l’endocarde, quel germe en est responsable, la valve est-elle en train d’être détruite, et faut-il opérer ?</b></p>
<p>L’endocardite infectieuse (EI) est une maladie rare, mais grave : elle tue encore environ une personne atteinte sur cinq pendant l’hospitalisation, la mortalité hospitalière variant de 15 à 30 % selon les séries (ESC 2023). Les décès sont surtout associés à trois complications : l’insuffisance cardiaque par destruction valvulaire, les embolies cérébrales et le sepsis non contrôlé. Son diagnostic est souvent retardé, car ses symptômes sont banals. Elle exige enfin une décision collective, qui associe cardiologue, infectiologue, microbiologiste, spécialiste d’imagerie et chirurgien cardiaque.</p>
<p>À la fin de ce chapitre, le médecin assistant sait évoquer le diagnostic devant une fièvre inexpliquée chez un patient à risque. Il sait prélever correctement les hémocultures <b>avant</b> tout antibiotique et ordonner l’imagerie dans le bon ordre : <button class="w" data-k="i33-ett">ETT (examen de première intention)</button>, puis <button class="w" data-k="i33-eto">ETO (sensibilité supérieure, bilan des complications)</button>, puis imagerie avancée. Il sait appliquer les <button class="w" data-k="i33-duke">critères de Duke modifiés ESC 2023 (majeurs, mineurs, classement)</button> et reconnaître les trois indications opératoires. Il sait enfin choisir une antibiothérapie adaptée au germe, envisager un relais oral et appliquer l’antibioprophylaxie selon les recommandations européennes et suisses.</p>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="i33-sa-valves">anatomie des valves et du squelette fibreux (voisinage du tissu de conduction)</button>, la notion de <button class="w" data-k="i33-biofilm">biofilm bactérien (tolérance aux antibiotiques)</button> et la différence entre <button class="w" data-k="i33-pkpd">antibiotiques temps-dépendants et concentration-dépendants (pharmacodynamie)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i33-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>L’endocardite infectieuse est une <b>infection de la surface endocardique du cœur</b>. Elle touche le plus souvent une valve, native ou prothétique, mais peut aussi siéger sur une paroi, sur une sonde de stimulateur ou de défibrillateur, sur un tube prothétique de l’aorte ou sur une communication congénitale. Sa lésion caractéristique est la <button class="w" data-k="i33-vegetation">végétation (plaquettes, fibrine, microorganismes)</button>. Elle associe souvent une destruction du tissu valvulaire et périvalvulaire.</p>
<h3>1.1 Classification clinique (ESC 2023)</h3>
<p>Une endocardite se décrit selon quatre axes. Chacun modifie une décision.</p>
<div class="two">
<div class="card"><h4>Localisation</h4><p>Cœur gauche (valves aortique et mitrale) ou cœur droit (tricuspide, pulmonaire). L’atteinte gauche expose aux embolies systémiques, dont cérébrales ; l’atteinte droite expose aux embolies pulmonaires septiques. Un fragment de végétation suit en effet le sang qui l’emporte : le ventricule gauche l’éjecte dans l’aorte, vers le cerveau, la rate ou les reins ; le ventricule droit l’éjecte dans l’artère pulmonaire, où il s’arrête dans le premier réseau capillaire rencontré, celui du poumon.</p></div>
<div class="card"><h4>Support</h4><p>Valve native ; <button class="w" data-k="i33-prothese">valve prothétique (précoce avant 12 mois, tardive ensuite)</button> ; <button class="w" data-k="i33-deci">dispositif électronique cardiaque implantable (DECI)</button>. La durée du traitement et les germes attendus changent selon le support. Sur un matériel étranger, les bactéries forment un biofilm que les antibiotiques stérilisent lentement : le traitement dure au moins 6 semaines sur prothèse, contre 2 à 6 semaines sur valve native (ESC 2023).</p></div>
<div class="card"><h4>Mode d’acquisition</h4><p>Communautaire ; associée aux soins (nosocomiale ou liée à un geste ambulatoire, hémodialyse, cathéter) ; liée à l’usage de drogues par voie intraveineuse (UDIV). L’antibiothérapie probabiliste dépend de ce mode, car il prédit le germe. Une EI communautaire relève surtout des streptocoques, des entérocoques et des staphylocoques sensibles à la méticilline. Une EI associée aux soins expose en plus aux staphylocoques résistants à la méticilline et aux bacilles à Gram négatif, plus fréquents en milieu de soins (ESC 2023).</p></div>
<div class="card"><h4>Activité et récurrence</h4><p>EI active (fièvre, hémocultures positives ou inflammation à la chirurgie) ou guérie. Une nouvelle EI est une <button class="w" data-k="i33-rechute">rechute (même germe, avant 6 mois) ou une réinfection</button>.</p></div></div>
<div class="trap"><span class="k">Piège</span>Les termes « aiguë » et « subaiguë » décrivent la vitesse d’évolution, pas le germe. <i>Staphylococcus aureus</i> donne typiquement une forme aiguë, destructrice en quelques jours ; les streptocoques oraux donnent typiquement une forme subaiguë, sur plusieurs semaines. La différence tient à la virulence : <i>S. aureus</i> sécrète des toxines qui lysent les cellules et des enzymes qui dégradent les tissus, alors que les streptocoques oraux, commensaux peu agressifs, se multiplient dans la végétation sans détruire rapidement le tissu voisin. Une endocardite à streptocoque peut pourtant se révéler par un abcès, et une endocardite à <i>S. aureus</i> par une fièvre isolée chez le sujet âgé.</div>
</section>

<section class="ilot" id="i33-2"><h2><span class="n">2</span>Épidémiologie et évolution microbiologique</h2>
<p>L’ESC 2023 cite une incidence mondiale d’environ 13,8 cas pour 100 000 habitants par an en 2019, avec environ 66 300 décès. L’incidence augmente, pour trois raisons : le vieillissement, la multiplication des prothèses et des dispositifs intracardiaques, et l’augmentation des soins invasifs. Les deux dernières agissent sur les deux conditions de l’EI : un matériel intracardiaque offre une surface colonisable dépourvue d’endothélium, et chaque cathéter ou geste invasif peut faire entrer des bactéries dans le sang.</p>
<h3>2.1 Données suisses</h3>
<p>Une cohorte nationale suisse (Buergler et coll., <i>Clinical Infectious Diseases</i>, 2025) a analysé 15 255 hospitalisations pour EI entre 2012 et 2021. Le nombre annuel d’hospitalisations est passé de 1 361 à 1 636. L’âge médian était de 73 ans et deux patients sur trois étaient des hommes.</p>
<table class="t"><tr><th>Germe</th><th>Proportion sur 2012–2021</th><th>Évolution</th><th>Mortalité hospitalière</th></tr>
<tr><td><i>Staphylococcus aureus</i></td><td>24,7 %</td><td>de 19,8 % à 30,0 %</td><td>19,9 % (30,3 % à six mois)</td></tr>
<tr><td>Streptocoques</td><td>21,0 %</td><td>de 17,6 % à 24,4 %</td><td>6,6 % (14,7 % à six mois)</td></tr>
<tr><td>Entérocoques</td><td>8,7 %</td><td>—</td><td>—</td></tr>
<tr><td>Autres staphylocoques (surtout à coagulase négative)</td><td>5,5 %</td><td>—</td><td>—</td></tr>
<tr><td>Germe non codé</td><td>32,6 %</td><td>de 42,7 % à 22,7 %</td><td>—</td></tr></table>
<p>Deux messages se dégagent. Premièrement, <i>S. aureus</i> est devenu le premier germe de l’EI en Suisse, comme dans les autres pays à haut revenu : c’est le germe des soins, des cathéters, des dispositifs et de l’injection de drogues. Il colonise la peau et les narines d’une partie importante de la population et passe dans le sang par une effraction cutanée, un cathéter ou une aiguille. Deuxièmement, le pronostic dépend fortement du germe : la mortalité hospitalière de l’EI à <i>S. aureus</i> est trois fois plus élevée que celle de l’EI à streptocoque. Cet écart est une association. Il tient en partie à la virulence du germe, qui cause plus souvent des abcès et des complications neurologiques, et en partie au terrain, car <i>S. aureus</i> touche davantage des patients âgés, dialysés ou hospitalisés.</p>
<p>Le profil du patient a changé. L’EI du sujet jeune atteint de valvulopathie rhumatismale, qui dominait au milieu du vingtième siècle, est devenue rare en Europe. Le patient typique est aujourd’hui un homme de plus de 65 ans, porteur d’une valvulopathie dégénérative, d’une prothèse ou d’un dispositif, souvent diabétique, insuffisant rénal ou récemment hospitalisé. Les entérocoques progressent chez le sujet âgé et après implantation valvulaire percutanée (TAVI). Ces germes de la flore digestive gagnent le sang par les voies urinaires ou le tube digestif, souvent explorés ou manipulés à cet âge. Après TAVI, les entérocoques et <i>S. aureus</i> sont les deux premiers germes (ESC 2023) ; la ponction de l’artère fémorale, au pli de l’aine, est une porte d’entrée plausible, mais non démontrée.</p>
<div class="trap"><span class="k">Lacune documentaire</span>La cohorte suisse repose sur des données administratives hospitalières : elle compte des hospitalisations, et non des patients, et la catégorie « germe non codé » ne signifie pas « hémocultures négatives ». L’incidence par habitant et la proportion d’EI à hémocultures négatives en Suisse ne sont pas publiées de façon consolidée.</div>

<section class="ilot" id="i33-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Un endocarde sain résiste à l’infection : même lors d’une bactériémie, les bactéries n’adhèrent pas à sa surface intacte. L’EI naît donc de la rencontre de deux conditions : <b>une surface endocardique altérée et une bactériémie par un germe capable d’y adhérer.</b> La chaîne complète est la suivante : lésion endothéliale → dépôt stérile de plaquettes et de fibrine → bactériémie → adhésion → végétation infectée → biofilm → trois conséquences (destruction locale, embolies, réaction immunologique).</p>
<h3>3.1 L’endothélium lésé et le thrombus stérile</h3>
<p>Un flux sanguin turbulent, un jet de régurgitation, un corps étranger ou une inflammation abîment l’endothélium. La lésion siège typiquement du côté de la valve qui reçoit le jet à basse pression : face auriculaire de la valve mitrale dans l’insuffisance mitrale, face ventriculaire des sigmoïdes aortiques dans l’insuffisance aortique. Ce phénomène suit l’<button class="w" data-k="i33-venturi">effet de jet et de Venturi (localisation des végétations)</button>. La matrice sous-endothéliale exposée attire plaquettes et fibrine, qui forment un petit thrombus stérile : l’<button class="w" data-k="i33-etnb">endocardite thrombotique non bactérienne (support de la colonisation)</button>.</p>
<h3>3.2 La bactériémie et l’adhésion</h3>
<p>Des bactériémies transitoires surviennent chaque jour, lors du brossage des dents ou de la mastication. Leur fréquence et leur densité augmentent en cas de mauvaise hygiène buccodentaire, de soins dentaires, de cathéter veineux, d’injection de drogue ou de plaie cutanée. Tous les germes n’ont pas la même capacité d’adhérer. Les staphylocoques, les streptocoques et les entérocoques possèdent des <button class="w" data-k="i33-adhesines">adhésines de surface (liaison à la fibrine, au fibrinogène, à la fibronectine)</button>. C’est pourquoi ces trois genres causent la grande majorité des EI, alors que les bacilles à Gram négatif, pourtant fréquents dans les bactériémies, en causent peu. <i>S. aureus</i> peut même adhérer à un endothélium intact et y pénétrer : c’est l’explication de l’EI sur valve saine chez l’UDIV ou le patient hémodialysé.</p>
<h3>3.3 La végétation et le biofilm</h3>
<p>Une fois fixées, les bactéries activent la coagulation et attirent de nouvelles couches de plaquettes et de fibrine. La végétation grossit par couches successives. Les bactéries qu’elle contient atteignent des densités considérables, de l’ordre de 10⁹ à 10¹⁰ par gramme de tissu. Elles sont protégées des polynucléaires, car la valve n’a pas de vaisseaux. Elles s’organisent en <button class="w" data-k="i33-biofilm">biofilm (tolérance aux antibiotiques)</button> et une grande partie d’entre elles cesse de se diviser.</p>
<div class="key"><b>Corrélation physiopathologie → thérapeutique.</b> Trois propriétés de la végétation dictent les règles de l’antibiothérapie. <b>L’avascularité</b> impose des antibiotiques bactéricides, par voie intraveineuse, à forte dose. <b>La densité bactérienne et la lenteur de division</b> imposent une durée longue, de 2 à 6 semaines, et exposent à la sélection de mutants résistants : c’est pourquoi la rifampicine n’est jamais utilisée seule. <b>Le biofilm sur matériel étranger</b> explique la difficulté de guérir une prothèse sans chirurgie ou un dispositif sans extraction complète.</div>
<h3>3.4 Les trois conséquences</h3>
<p><b>La destruction locale.</b> Les enzymes bactériennes et la réaction inflammatoire perforent les feuillets, rompent les cordages et créent une <button class="w" data-k="i33-ic-aigue">régurgitation aiguë (insuffisance cardiaque brutale)</button>. L’infection peut s’étendre au-delà de la valve et créer un <button class="w" data-k="i33-abces">abcès périvalvulaire (extension, bloc auriculoventriculaire)</button>, un pseudoanévrisme ou une fistule. Cette extension est plus fréquente sur la valve aortique et sur les prothèses. Dans l’EI aortique, l’infection s’étend surtout vers la continuité fibreuse mitro-aortique (ESC 2023). Sur une prothèse, la jonction entre l’anneau de suture et le tissu natif est la principale surface colonisable : l’infection atteint donc souvent l’anneau dès son début.</p>
<p><b>Les embolies.</b> Des fragments de végétation se détachent et migrent dans la circulation : vers le cerveau, la rate, les reins, les membres et les artères coronaires en cas d’atteinte gauche ; vers les poumons en cas d’atteinte droite. Ces fragments contiennent des bactéries. Ils créent donc des infarctus, mais aussi des abcès à distance et des <button class="w" data-k="i33-anevrisme">anévrismes infectieux (« mycotiques »)</button>.</p>
<p><b>La réaction immunologique.</b> La bactériémie prolongée stimule la production d’anticorps et la formation de complexes immuns circulants. Il faut des semaines de bactériémie pour les produire ; ces manifestations sont donc plus fréquentes dans les formes subaiguës. Le facteur rhumatoïde, une IgM dirigée contre les IgG, traduit la même stimulation antigénique prolongée. Ces complexes se déposent dans les capillaires : glomérulonéphrite, <button class="w" data-k="i33-osler">nodosités d’Osler (nodules pulpaires douloureux)</button>, <button class="w" data-k="i33-roth">taches de Roth (hémorragies rétiniennes à centre blanc)</button>, facteur rhumatoïde positif.</p>

<section class="ilot" id="i33-4"><h2><span class="n">4</span>Microorganismes, portes d’entrée et terrains</h2>
<p>Le germe se déduit souvent de la porte d’entrée et du terrain. Ce raisonnement a deux usages : choisir l’antibiothérapie probabiliste, et rechercher puis traiter la porte d’entrée, sous peine de réinfection.</p>
<table class="t"><tr><th>Germe</th><th>Porte d’entrée et terrain typiques</th><th>Particularité clinique ou thérapeutique</th></tr>
<tr><td><i><button class="w" data-k="i33-saureus">Staphylococcus aureus</button></i></td><td>Peau, cathéter veineux, hémodialyse, injection de drogue, dispositif, chirurgie</td><td>Évolution aiguë, destruction rapide, abcès, embolies cérébrales ; mortalité la plus élevée</td></tr>
<tr><td><button class="w" data-k="i33-strepto">Streptocoques oraux (groupe « viridans »)</button></td><td>Bouche, mauvais état dentaire, soins dentaires</td><td>Évolution subaiguë ; très sensibles à la pénicilline en général</td></tr>
<tr><td><button class="w" data-k="i33-gallo"><i>Streptococcus gallolyticus</i> (lien avec le cancer colorectal)</button></td><td>Tube digestif, sujet âgé</td><td>Coloscopie obligatoire</td></tr>
<tr><td><i>Enterococcus faecalis</i></td><td>Voies urinaires, tube digestif, sujet âgé, prothèse, TAVI</td><td>Résistance naturelle aux céphalosporines utilisées seules, car ses protéines de liaison à la pénicilline les fixent mal ; tolérance à l’amoxicilline, qui l’inhibe sans le tuer. Il faut donc associer deux antibiotiques synergiques : amoxicilline et ceftriaxone, qui saturent des protéines de liaison complémentaires, ou amoxicilline et gentamicine</td></tr>
<tr><td>Staphylocoques à coagulase négative</td><td>Prothèse, dispositif, soins</td><td>Germe de l’EI précoce sur prothèse, car il colonise la peau et contamine le matériel lors de l’implantation ; souvent résistant à la méticilline, ce qui fait proposer la vancomycine ou la daptomycine dans le traitement probabiliste de l’EI précoce sur prothèse (ESC 2023, classe IIb)</td></tr>
<tr><td><button class="w" data-k="i33-hacek">Groupe HACEK (bacilles à Gram négatif de la bouche)</button></td><td>Bouche</td><td>Croissance lente ; végétations volumineuses</td></tr>
<tr><td><button class="w" data-k="i33-coxiella"><i>Coxiella burnetii</i>, <i>Bartonella</i> (EI à hémocultures négatives)</button></td><td>Contact avec le bétail (fièvre Q) ; chat, poux, sans-abrisme (<i>Bartonella</i>)</td><td>Hémocultures négatives ; diagnostic par sérologie et biologie moléculaire</td></tr>
<tr><td><i>Candida</i>, <i>Aspergillus</i></td><td>Cathéter, nutrition parentérale, immunosuppression, UDIV, prothèse</td><td><button class="w" data-k="i33-fongique">Indication opératoire en règle générale</button></td></tr></table>
<h3>4.1 Terrains prédisposants</h3>
<div class="two">
<div class="card"><h4>Cardiaques</h4><p>Antécédent d’EI (<button class="w" data-k="i33-atcd-valve">premier facteur de risque</button>) ; prothèse valvulaire chirurgicale ou percutanée ; matériel de réparation valvulaire ; cardiopathie congénitale cyanogène ou réparée avec du matériel ; valvulopathie dégénérative, rhumatismale ou bicuspidie aortique ; cardiomyopathie hypertrophique obstructive ; DECI ; assistance ventriculaire.</p></div>
<div class="card"><h4>Extracardiaques</h4><p>Injection de drogues ; hémodialyse ; cathéter veineux central ; diabète ; immunosuppression ; cancer ; mauvais état buccodentaire ; âge avancé ; hospitalisation récente. Les uns multiplient les bactériémies : aiguille, accès vasculaire, cathéter, foyer dentaire. Les autres réduisent la défense de l’hôte ou s’accompagnent d’un portage plus fréquent de <i>S. aureus</i>, comme l’hémodialyse et le diabète.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Traiter une bactériémie à <i>S. aureus</i> comme une simple infection de cathéter, sans échocardiographie. Chez un patient porteur d’une prothèse ou d’un dispositif, ou lorsque la bactériémie persiste, une EI est présente dans une proportion importante des cas. Une échocardiographie est à envisager dans toute bactériémie à <i>S. aureus</i>, à <i>E. faecalis</i> et à certains streptocoques (ESC 2023, classe IIa), car ces germes adhèrent à l’endocarde et l’EI peut évoluer sans souffle ni signe périphérique. Des scores de risque aident à choisir les patients qui ont aussi besoin d’une ETO.</div>
</section>

<section class="ilot" id="i33-5"><h2><span class="n">5</span>Formes cliniques</h2>
<p>Le même mot « endocardite » recouvre des maladies dont le germe, le pronostic et le traitement diffèrent. Reconnaître la forme en cause oriente immédiatement la conduite.</p>
<div class="two">
<div class="card"><h4>EI sur valve native, cœur gauche</h4><p>La forme de référence. Streptocoques et <i>S. aureus</i> dominent. Elle survient sur une valve déjà malade (dégénérative, bicuspide, prolapsus mitral) ou, avec <i>S. aureus</i>, sur une valve saine. Les embolies cérébrales et l’insuffisance cardiaque par fuite aiguë en font la gravité.</p></div>
<div class="card"><h4><button class="w" data-k="i33-prothese">EI sur prothèse valvulaire (précoce, tardive)</button></h4><p>Elle représente jusqu’à un tiers des EI dans les séries européennes. La forme <b>précoce</b> (avant 12 mois) est liée à la contamination périopératoire : staphylocoques, notamment à coagulase négative. La forme <b>tardive</b> ressemble microbiologiquement à l’EI sur valve native. L’infection gagne l’anneau de suture : abcès, déhiscence, fuite paraprothétique. L’ETT est souvent prise en défaut, car le métal et les armatures réfléchissent les ultrasons et masquent les structures situées derrière eux ; l’échocardiographie et les hémocultures n’atteignent ensemble qu’une sensibilité d’environ 60 % pour l’EI sur prothèse (ESC 2023). La TEP-TDM a ici sa meilleure indication, car elle détecte l’inflammation de l’anneau sans dépendre des ultrasons.</p></div>
<div class="card"><h4><button class="w" data-k="i33-deci">EI sur dispositif électronique (DECI)</button></h4><p>Infection d’une sonde de stimulateur ou de défibrillateur, parfois étendue à la valve tricuspide. Elle se distingue de l’infection de la loge, limitée au boîtier. Le traitement impose l’<b>extraction complète</b> du système (boîtier et sondes), en plus des antibiotiques.</p></div>
<div class="card"><h4><button class="w" data-k="i33-udiv">EI de l’usager de drogues par voie intraveineuse (cœur droit)</button></h4><p>Atteinte tricuspide prédominante, à <i>S. aureus</i> dans la majorité des cas. Elle se révèle par une fièvre, une toux et des opacités pulmonaires multiples : les <button class="w" data-k="i33-embpulm">embolies pulmonaires septiques (nodules excavés)</button>. Le pronostic immédiat est meilleur que celui de l’EI gauche : les embolies atteignent le poumon et non le cerveau, le ventricule droit tolère longtemps la fuite tricuspide, et les patients sont jeunes, ce que l’ESC 2023 retient comme explication probable de leur faible mortalité. La récidive est pourtant fréquente, surtout dans les 6 mois qui suivent une chirurgie, si l’addiction n’est pas traitée, car chaque injection réintroduit des germes.</p></div>
<div class="card"><h4>EI associée aux soins</h4><p>Survient pendant une hospitalisation ou après un geste invasif : cathéter, hémodialyse, chirurgie, endoscopie. Staphylocoques et entérocoques dominent ; la résistance aux antibiotiques est plus fréquente et la mortalité plus élevée. La résistance reflète la flore sélectionnée par les antibiotiques hospitaliers. La surmortalité est une association, qui tient autant au terrain (âge, comorbidités, dialyse) qu’au germe.</p></div>
<div class="card"><h4>EI après TAVI</h4><p>Survient surtout pendant la première année. <i>E. faecalis</i> y est fréquent, ce qui explique que l’ESC 2023 propose, lors de l’implantation, une prophylaxie couvrant notamment <i>S. aureus</i> et les entérocoques (classe IIa) ; le choix de la molécule suit le protocole local. Le patient est âgé et fragile ; la chirurgie de rattrapage est rarement possible : elle est réalisée dans environ 20 % des cas, car le risque opératoire qui avait fait choisir le TAVI persiste et l’armature métallique adhère à l’aorte après quelques mois (ESC 2023).</p></div></div>
<div class="trap"><span class="k">Piège</span>Une EI du cœur droit n’est pas réservée à l’UDIV. Elle survient aussi chez le porteur de DECI, le patient hémodialysé ou porteur d’un cathéter central et dans certaines cardiopathies congénitales. À l’inverse, un UDIV peut faire une EI du cœur gauche, plus grave.</div>

<section class="ilot" id="i33-6"><h2><span class="n">6</span>Anamnèse</h2>
<p>L’anamnèse doit répondre à trois questions : le patient a-t-il un terrain prédisposant, existe-t-il une porte d’entrée, et depuis quand évolue le syndrome infectieux ? Elle cherche aussi une antibiothérapie récente, qui peut négativer les hémocultures.</p>
<h3>6.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i33-atcd-valve">Valvulopathie, prothèse, réparation, souffle connu (niveau de risque)</button></li><li>Antécédent d’endocardite</li><li>Stimulateur, défibrillateur, assistance ventriculaire</li><li>Cardiopathie congénitale, opérée ou non</li></ul>
<ul><li><button class="w" data-k="i33-atcd-porte">Soins dentaires, gestes invasifs, cathéters récents (porte d’entrée)</button></li><li>Injection de drogues, hémodialyse</li><li><button class="w" data-k="i33-atcd-atb">Antibiothérapie des deux dernières semaines (hémocultures faussement négatives)</button></li><li>Contacts animaux, voyages, lait cru (fièvre Q, brucellose, <i>Bartonella</i>)</li></ul></div>
<h3>6.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i33-s-fievre">Fièvre (présente chez environ 78 % des patients)</button></li><li>Asthénie, anorexie, perte de poids, sueurs nocturnes</li><li><button class="w" data-k="i33-s-dyspnee">Dyspnée (fuite valvulaire aiguë)</button></li><li>Arthralgies, myalgies, <button class="w" data-k="i33-s-lombalgie">lombalgie (spondylodiscite associée)</button></li></ul>
<ul><li><button class="w" data-k="i33-s-neuro">Déficit neurologique, céphalées, confusion (embolie cérébrale)</button></li><li>Douleur de l’hypochondre gauche (infarctus splénique)</li><li>Douleur lombaire et hématurie (infarctus rénal)</li><li>Toux, douleur thoracique, hémoptysie (embolies pulmonaires septiques)</li></ul></div>
<p>Aucun symptôme n’est spécifique. La valeur de l’anamnèse tient à l’association : une fièvre prolongée <b>chez un patient à risque</b> est une endocardite jusqu’à preuve du contraire. Une fièvre qui cède sous antibiotique puis réapparaît à l’arrêt est un signal d’alerte classique. Un traitement bref réduit la bactériémie et la fièvre, mais ne stérilise pas une végétation avasculaire, riche en bactéries peu actives ; la bactériémie reprend dès l’arrêt.</p>
<h3>6.3 Histoires naturelles typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme subaiguë typique</h4><p>Homme de 58 ans, prolapsus mitral connu, extraction dentaire il y a six semaines. Fébricule vespérale, fatigue et perte de 5 kg. Hémorragies sous-unguéales et souffle d’insuffisance mitrale plus intense qu’auparavant. Trois hémocultures positives à <i>Streptococcus sanguinis</i>.</p></div>
<div class="card"><h4>Forme aiguë</h4><p>Femme de 34 ans, injection de drogues. Fièvre à 40 °C, frissons, toux et douleur thoracique depuis quatre jours. Radiographie : nodules pulmonaires multiples, dont deux excavés. <i>S. aureus</i> dans toutes les hémocultures ; végétation tricuspide de 18 mm.</p></div>
<div class="card"><h4>Forme neurologique inaugurale</h4><p>Homme de 66 ans admis pour un AVC ischémique sylvien. Température à 38,2 °C attribuée à une pneumonie d’inhalation. Les hémocultures prélevées « de principe » poussent à <i>S. aureus</i>. La thrombolyse aurait été dangereuse, car l’embole septique infecte la paroi de l’artère, qui peut saigner ou former un anévrisme infectieux ; l’ESC 2023 la contre-indique dans l’EI (classe III).</p></div>
<div class="card"><h4>Forme du sujet âgé</h4><p>Femme de 84 ans, bioprothèse aortique, confusion et chutes, sans fièvre franche. CRP à 85 mg/L, anémie. Hémocultures positives à <i>E. faecalis</i>. Chez le sujet âgé, l’EI est souvent peu fébrile et se présente comme une altération de l’état général. La réponse fébrile s’émousse avec l’âge : la fièvre manque ou reste faible dans 20 à 30 % des infections du sujet âgé. Après TAVI, elle manque dans 13 à 20 % des EI (ESC 2023).</p></div></div>
</section>

<section class="ilot" id="i33-7"><h2><span class="n">7</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général → signes vitaux → anthropométrie → signes ciblés. Il cherche quatre groupes de signes, qui correspondent aux mécanismes de la figure 1 : infection, atteinte valvulaire, embolies et phénomènes immunologiques. Il cherche enfin la porte d’entrée.</p>
<h3>7.1 État général, signes vitaux, anthropométrie</h3>
<p>Aspect toxique ou simple fatigue, pâleur (anémie inflammatoire, par séquestration du fer sous l’effet de l’hepcidine). L’anémie abaisse le contenu artériel en oxygène ; pour maintenir l’apport aux tissus, le cœur accélère et augmente son débit. Un ventricule surchargé par une fuite aiguë, ou déjà défaillant, a peu de réserve pour cette compensation : l’anémie aggrave alors la dyspnée et la tachycardie. <button class="w" data-k="i33-v-sepsis">Température, pression artérielle, fréquence cardiaque et respiratoire, saturation, conscience (repérage du sepsis)</button>. Poids, comparé au poids habituel : l’amaigrissement témoigne d’une évolution prolongée. Diurèse : une oligurie oriente vers une hypoperfusion rénale (sepsis, bas débit), une glomérulonéphrite, un infarctus rénal ou une toxicité médicamenteuse, causes d’insuffisance rénale aiguë dans l’EI (ESC 2023).</p>
<h3>7.2 Signes ciblés</h3>
<div class="two">
<div><b>Cœur</b><ul><li><button class="w" data-k="i33-e-souffle">Souffle nouveau ou modifié (technique, valeur)</button></li><li><button class="w" data-k="i33-e-ic">Signes d’insuffisance cardiaque gauche aiguë (fuite aortique ou mitrale)</button></li><li>Frottement péricardique (extension de l’inflammation depuis un abcès de l’anneau ou un anévrisme infectieux de la racine aortique ; plus rarement, embolie dans une artère coronaire)</li><li><button class="w" data-k="i33-e-pouls">Pouls irrégulier ou lent (bloc auriculoventriculaire, abcès)</button></li></ul></div>
<div><b>Signes vasculaires et emboliques</b><ul><li><button class="w" data-k="i33-e-splinter">Hémorragies sous-unguéales en flammèches</button></li><li><button class="w" data-k="i33-janeway">Lésions de Janeway (macules palmo-plantaires indolores)</button></li><li><button class="w" data-k="i33-e-conj">Pétéchies conjonctivales et muqueuses</button></li><li><button class="w" data-k="i33-e-neuro">Examen neurologique complet (déficit focal, méningisme)</button></li><li>Pouls périphériques (ischémie aiguë d’un membre)</li></ul></div>
<div><b>Signes immunologiques</b><ul><li><button class="w" data-k="i33-osler">Nodosités d’Osler (pulpe des doigts, douloureuses)</button></li><li><button class="w" data-k="i33-roth">Taches de Roth (fond d’œil)</button></li><li>Hématurie microscopique, protéinurie (glomérulonéphrite)</li></ul></div>
<div><b>Signes généraux et porte d’entrée</b><ul><li><button class="w" data-k="i33-e-rate">Splénomégalie (forme subaiguë)</button></li><li>Hippocratisme digital (formes prolongées)</li><li><button class="w" data-k="i33-e-porte">Porte d’entrée : dents, peau, points d’injection, cathéter, loge de dispositif</button></li><li>Rachis douloureux à la percussion (spondylodiscite)</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Les signes « classiques » (Osler, Janeway, Roth, splénomégalie, hippocratisme) sont devenus rares, car ils traduisent une évolution prolongée que le diagnostic précoce interrompt. Leur absence n’exclut rien. La fièvre et le souffle restent les deux signes les plus fréquents, mais un souffle peut manquer au début d’une EI aiguë, dans une EI du cœur droit ou sur dispositif.</div>
<p>L’aide-mémoire <button class="w" data-k="i33-mnemo-fromjane">« FROM JANE » (signes cliniques de l’endocardite)</button> regroupe les signes à chercher systématiquement.</p>
