<template data-pop="pareto-d74-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="d74-0,d74-1,d74-2,d74-3,d74-4,d74-5,d74-6,d74-7"></p><ul><li>La <button class="w" data-k="d74-methb-def">méthémoglobine</button> est de l’hémoglobine à fer ferrique, incapable de lier l’oxygène : anémie fonctionnelle, hémoglobine totale normale. Normale : moins de 1 à 2 % selon la source.</li><li>Le fer s’oxyde et se réduit en permanence ; la <button class="w" data-k="d74-cyb5r">CYB5R</button> (NADH) est la voie principale, la <button class="w" data-k="d74-voie-nadph">voie du NADPH</button> (G6PD) la voie accessoire que le bleu de méthylène mobilise.</li><li>La <button class="w" data-k="d74-courbe">déviation à gauche</button> de la courbe de dissociation réduit la libération d’oxygène : l’hypoxie dépasse la fraction oxydée.</li><li>Cyanose visible au-delà de 1,5 g/dl de méthémoglobine absolue ; elle apparaît plus tard chez l’anémique, dont la tolérance est pourtant plus faible.</li><li>Formes acquises fréquentes (anesthésiques locaux, nitrites, dapsone, rasburicase, toxiques, poppers) ; formes héréditaires : types I, II, IV (réductase) et hémoglobine M (dominante).</li><li>Le nourrisson est plus vulnérable (CYB5R à 50–60 % de l’adulte, hémoglobine fœtale).</li><li>Anamnèse : exposition, ancienneté de la cyanose, G6PD, traitements sérotoninergiques. Examen : cyanose gris ardoise, sang chocolat, aucune réponse à l’oxygène.</li></ul></template>
<template data-pop="pareto-d74-diag" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="d74-8,d74-9"></p><ul><li>Cyanose, saturation basse sous oxygène et PaO2 normale : <button class="w" data-k="d74-saturation-gap">saturation gap</button>. Le <button class="w" data-k="d74-pulsoxymetrie">pulsoxymètre</button> se bloque vers 85 % ; la saturation calculée surestime l’oxygène porté.</li><li>La <button class="w" data-k="d74-co-oxymetrie">CO-oxymétrie</button> pose le diagnostic et sert au suivi ; il n’existe pas de critères formels publiés.</li><li>Différentiel : cause cardiopulmonaire (PaO2 abaissée), sulfhémoglobinémie (pas de réponse au bleu de méthylène), hémoglobine instable ou déficit en G6PD, carboxyhémoglobine.</li><li>Gravité : moins de 10 % silencieux ; 10–30 % cyanose ; 30–50 % dyspnée, syncope ; 50–70 % arythmies, convulsions, coma ; plus de 70 % décès. La grille de Swissmedic 2011 est <button class="w" data-k="d74-seuils">plus simple</button>.</li></ul></template>
<template data-pop="pareto-d74-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="d74-10,d74-11,d74-12"></p><ul><li>Retirer l’agent, oxygéner, soutenir, donner du <button class="w" data-k="d74-glucose">glucose</button>, appeler Tox Info Suisse, doser et répéter la méthémoglobine.</li><li>Traiter le patient symptomatique à partir d’environ 20 % (10–30 % selon le terrain) ; enfant : 20 % symptomatique, 30 % asymptomatique.</li><li><button class="w" data-k="d74-bleu-methylene">Bleu de méthylène</button> : 1–2 mg/kg en 5 minutes, répétable à 1 heure, cumul au plus 7 mg/kg (4 mg/kg aniline ou dapsone) ; 0,3–0,5 mg/kg jusqu’à 3 mois.</li><li>Contre-indications : déficit en <button class="w" data-k="d74-g6pd">G6PD</button>, hypersensibilité aux thiazines, nitrite antidotique du cyanure, chlorate, déficit en NADPH-réductase ; risque <button class="w" data-k="d74-serotonine">sérotoninergique</button>.</li><li>Repli : <button class="w" data-k="d74-ascorbique">acide ascorbique</button>, <button class="w" data-k="d74-exsang">exsanguino-transfusion</button>, hyperbare, hémodialyse. Rebond possible ; aggravation : échange sanguin urgent.</li><li>Perfusion continue : option EHA, <button class="w" data-k="d74-perfusion">non recommandée</button> par l’information suisse.</li></ul></template>
<template data-pop="pareto-d74-crit" data-title="Pareto — Formes héréditaires, situations particulières et critères"><p class="ratio" data-cover="d74-13,d74-14,d74-15"></p><ul><li>Forme héréditaire : traitement surtout esthétique (type I), pas de saignée, éviter les agents précipitants, dépistage familial ; <button class="w" data-k="d74-hbm">hémoglobine M</button> : aucun antidote utile.</li><li><button class="w" data-k="d74-grossesse">Grossesse</button> : bleu de méthylène tératogène, réservé au pronostic vital ; exsanguino-transfusion en alternative ; allaitement suspendu jusqu’à 8 jours.</li><li><button class="w" data-k="d74-chirurgie">Chirurgie</button> : pas de prophylaxie par le colorant. Oncologie : <button class="w" data-k="d74-rasburicase">rasburicase</button> contre-indiquée en cas de déficit en G6PD, arrêt définitif si méthémoglobinémie.</li><li>Critères : taux élevé à la CO-oxymétrie en contexte compatible ; forme congénitale : CYB5R inférieure à 20 % ou variant de <i>CYB5R3</i> biallélique ou de globine.</li><li>Paramètres : 1,5 g/dl, 85 %, 20 % (10–30), 70 %, 1–2 mg/kg, 7 mg/kg.</li></ul></template>
<template data-pop="pareto-d74-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="d74-e-1,d74-e-2,d74-e-3,d74-e-4"></p><ul><li>Dosage de référence : spectrophotométrie d’<button class="w" data-k="d74-evelyn">Evelyn et Malloy</button> (630 nm) ; en pratique, <button class="w" data-k="d74-co-oxymetrie">CO-oxymétrie</button> sur gazométrie.</li><li>Pulsoxymètre vers 85 % : méfiance ; saturation calculée trompeuse ; le bleu de méthylène fausse aussi la pulsoxymétrie.</li><li>Pas de dosage fonctionnel systématique de la G6PD en urgence ; le chercher idéalement avant l’antidote.</li><li>Cyanose ancienne : activité de la CYB5R (inférieure à 20 %), séquençage de <i>CYB5R3</i>, puis globines si électrophorèse anormale ; <button class="w" data-k="d74-heinz">corps de Heinz</button> si hémolyse.</li></ul></template>
<template data-pop="pareto-d74-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="d74-s-physio-body"></p><ul><li>Deux défauts s’additionnent : fixation de l’oxygène perdue et libération réduite par la <button class="w" data-k="d74-courbe">déviation à gauche</button>.</li><li>La cyanose dépend de la quantité absolue (1,5 g/dl) ; le pulsoxymètre se bloque vers 85 % ; la PaO2 reste normale.</li><li>L’oxygène seul ne répare pas le fer.</li></ul></template>
<template data-pop="pareto-d74-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="d74-s-bioc-body"></p><ul><li>Voie principale : NADH et <button class="w" data-k="d74-cyb5r">CYB5R</button> ; voie accessoire : NADPH issu de la <button class="w" data-k="d74-g6pd">G6PD</button>.</li><li>Le bleu de méthylène accepte un électron du NADPH ; son leucométhylène bleu réduit Fe3+ ; à forte dose, la forme oxydante prédomine.</li><li>L’acide ascorbique réduit directement mais lentement ; la rasburicase produit du peroxyde d’hydrogène.</li></ul></template>
<template data-pop="pareto-d74-s-histo" data-title="Pareto — Hématologie cellulaire"><p class="ratio" data-cover="d74-s-histo-body"></p><ul><li>Type I : enzyme instable seulement dans les globules rouges ; type II : tous les tissus, d’où l’atteinte neurologique.</li><li>Nourrisson : CYB5R à 50–60 % de l’adulte, hémoglobine fœtale plus oxydable.</li><li>Hémolyse associée fréquente : <button class="w" data-k="d74-heinz">corps de Heinz</button>, tests de stabilité.</li></ul></template>
<template data-pop="pareto-d74-s-gen" data-title="Pareto — Génétique"><p class="ratio" data-cover="d74-s-gen-body"></p><ul><li><i>CYB5R3</i> : récessif, types I et II ; <i>CYB5A</i> : récessif, type IV avec 46,XY et organes génitaux ambigus.</li><li>Globines : dominant, <button class="w" data-k="d74-hbm">hémoglobine M</button> (fer-phénolate, résistance à la réduction), plus de 13 variants.</li><li>Dépistage familial : dosage de la méthémoglobine, analyse moléculaire ciblée.</li></ul></template>
<template data-pop="pareto-d74-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="d74-p-1,d74-p-2,d74-p-3,d74-p-4,d74-p-5"></p><ul><li>Bleu de méthylène : seul antidote suisse ; 1–2 mg/kg en 5 minutes ; plafond 7 mg/kg (4 pour aniline et dapsone).</li><li>Interaction majeure : médicaments <button class="w" data-k="d74-serotonine">sérotoninergiques</button> ; surveiller 4 heures le système nerveux, l’électrocardiogramme, la pression.</li><li>Déficit en <button class="w" data-k="d74-g6pd">G6PD</button> : pas de bleu de méthylène, acide ascorbique ou échange sanguin.</li><li>Éviter : voie sous-cutanée ou intrathécale, injection rapide, dose excessive, prophylaxie, hémoglobine M, rasburicase si G6PD déficiente.</li></ul></template>
