<template data-pop="d74-methb-def" data-title="Méthémoglobine : définition, valeurs et sens clinique"><h3>Ce que désigne le mot</h3><p>La méthémoglobine est de l’hémoglobine dont le fer de l’hème est passé de l’état ferreux (Fe2+) à l’état ferrique (Fe3+). Elle ne peut plus lier l’oxygène à l’hème. La concentration totale d’hémoglobine ne change pas ; ce qui diminue est la part qui transporte. L’<button class="w" data-k="d74-sources">EHA</button> parle d’« anémie fonctionnelle ».</p><h3>Comment on l’exprime</h3><p>Le résultat se donne en pourcentage de l’hémoglobine totale. C’est ce pourcentage qui sert à évaluer la gravité ; la quantité absolue en g/dl sert à comprendre la visibilité de la cyanose (seuil de 1,5 g/dl).</p><table class="t"><tr><th>Source</th><th>Valeur normale citée</th></tr><tr><td>Consensus européen</td><td>Moins de 1 %</td></tr><tr><td>Article fribourgeois</td><td>Environ 1 % ; limite du laboratoire du cas : moins de 1,2 %</td></tr><tr><td>Swissmedic, 2011</td><td>Environ 2 %</td></tr></table><p>Ces écarts rappellent qu’un résultat se compare à l’intervalle du laboratoire qui l’a mesuré. Une valeur de 3 à 10 % est souvent découverte de façon fortuite sur une gazométrie.</p><div class="key"><b>À retenir.</b> Méthémoglobine = hémoglobine à fer ferrique. Elle ne transporte pas l’oxygène. Valeur normale inférieure à 1 à 2 % selon la source.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/de/dokumente/marktueberwachung/vigilance/vigilance-news_juni2011.pdf.download.pdf/vigilance-news_juni2011.pdf" target="_blank" rel="noopener">Swissmedic, Vigilance-News, juin 2011</a>.</p></template>
<template data-pop="d74-saturation-gap" data-title="Saturation gap : la contradiction qui fait le diagnostic"><h3>Définition</h3><p>Le saturation gap est la discordance entre une saturation basse, mesurée au doigt ou sous forme d’oxyhémoglobine, et une saturation calculée ainsi qu’une pression partielle d’oxygène (PaO2) normales ou élevées. Il indique que l’oxygène arrive dans le sang mais n’y est pas transporté.</p><h3>Le cas publié</h3><table class="t"><tr><th>Mesure</th><th>Valeur</th><th>Signification</th></tr><tr><td>Saturation au doigt</td><td>75 % sous 15 l/min d’oxygène</td><td>Valeur faussée par la méthémoglobine</td></tr><tr><td>PaO2</td><td>30,5 kPa</td><td>Oxygène dissous élevé : le poumon fonctionne</td></tr><tr><td>Saturation calculée</td><td>99 %</td><td>Déduite de la PaO2, sans mesure directe</td></tr><tr><td>Oxyhémoglobine mesurée</td><td>69 %</td><td>Part de l’hémoglobine qui porte réellement l’oxygène</td></tr><tr><td>Méthémoglobine</td><td>30,3 %</td><td>Cause du déficit</td></tr></table><p>La somme de l’oxyhémoglobine (69 %) et de la méthémoglobine (30,3 %) approche 100 % : la quasi-totalité de l’hémoglobine est soit chargée en oxygène, soit incapable de l’être.</p><p>Limite : le saturation gap n’est pas spécifique. La carboxyhémoglobine, par exemple, peut aussi le produire ; la CO-oxymétrie distingue les fractions.</p><div class="key"><b>À retenir.</b> Saturation basse, PaO2 normale ou élevée, oxygène sans effet : doser la méthémoglobine par CO-oxymétrie.</div><p class="src">Références : <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a>, tableaux 1 et 2.</p></template>
<template data-pop="d74-pulsoxymetrie" data-title="Pulsoxymétrie et méthémoglobine"><h3>Principe</h3><p>Le pulsoxymètre estime la saturation en oxygène (SpO2) à partir de l’absorption de la lumière à travers le doigt. La méthémoglobine modifie cette absorption. La plupart des appareils affichent alors une valeur fixe d’environ 85 %, qui varie peu avec le taux réel.</p><h3>Conséquences</h3><ul><li>Une SpO2 voisine de 85 % ne renseigne ni sur la gravité ni sur l’évolution.</li><li>Le bleu de méthylène fausse aussi la pulsoxymétrie et l’index bispectral : le suivi de l’antidote ne se fait pas sur l’appareil du doigt.</li><li>La valeur du pulsoxymètre peut être inférieure à celle de la saturation calculée, d’où le saturation gap.</li></ul><p>L’examen qui tranche est la CO-oxymétrie sur gazométrie.</p><div class="key"><b>À retenir.</b> Pulsoxymètre bloqué vers 85 % : penser méthémoglobine ; ne pas l’utiliser pour suivre l’antidote.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-co-oxymetrie" data-title="CO-oxymétrie : l’examen de choix"><h3>Ce que mesure l’appareil</h3><p>La CO-oxymétrie quantifie directement les fractions d’oxyhémoglobine, de carboxyhémoglobine et de méthémoglobine. Elle s’obtient sur une gazométrie artérielle ou veineuse, en quelques minutes.</p><h3>Pourquoi elle remplace les autres mesures</h3><p>Le pulsoxymètre est faussé par la méthémoglobine ; la saturation calculée à partir de la PaO2 surestime l’oxygène réellement porté. La CO-oxymétrie ne repose sur aucune de ces hypothèses. L’information professionnelle de Proveblue® la désigne comme examen de choix.</p><h3>Utilisation pratique</h3><ul><li>À répéter pendant le traitement ; dans le cas fribourgeois, toutes les 30 minutes sur conseil de Tox Info Suisse.</li><li>Une méthémoglobine de 3 à 10 % est souvent fortuite ; au-delà de 10 %, la clinique s’exprime.</li></ul><div class="key"><b>À retenir.</b> Seule mesure directe de la méthémoglobine en routine ; elle sert au diagnostic et au suivi.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a> ; <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a> ; <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-g6pd" data-title="Déficit en G6PD et méthémoglobinémie"><h3>Le rôle de l’enzyme</h3><p>La glucose-6-phosphate déshydrogénase (G6PD) est la première enzyme de la voie des pentoses phosphates. Dans le globule rouge, c’est la seule source de NADPH. Le NADPH alimente la voie accessoire de réduction de la méthémoglobine, normalement peu active mais efficace en présence de bleu de méthylène.</p><h3>Pourquoi le déficit compte</h3><ul><li><b>Bleu de méthylène.</b> Le déficit en G6PD est une contre-indication de l’information professionnelle suisse. Sans NADPH, la voie qui rend le colorant actif manque de substrat.</li><li><b>Rasburicase.</b> La conversion de l’acide urique en allantoïne produit du peroxyde d’hydrogène ; en cas de déficit en G6PD, elle provoque hémolyse et méthémoglobinémie. La rasburicase est contre-indiquée.</li><li><b>Hémolyse.</b> Les médicaments inducteurs causent souvent aussi une hémolyse.</li></ul><h3>Le dosage</h3><p>Le consensus européen ne trouve pas de preuve suffisante pour un dosage fonctionnel systématique en urgence. Il recommande de chercher l’antécédent personnel ou familial et, idéalement, de tester la G6PD avant le bleu de méthylène. Le dosage ne conditionne donc pas la décision en urgence.</p><div class="key"><b>À retenir.</b> G6PD = seule source de NADPH du globule rouge. Déficit : pas de bleu de méthylène, pas de rasburicase ; acide ascorbique ou échange sanguin.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">Fasturtec®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-bleu-methylene" data-title="Bleu de méthylène (chlorure de méthylthioninium) : monographie"><h3>Mécanisme</h3><p>Le bleu de méthylène accepte un électron du NADPH ; sa forme réduite, le leucométhylène bleu, réduit le fer ferrique en fer ferreux. À forte dose, la forme oxydante prédomine et peut aggraver la méthémoglobinémie.</p><h3>Indication et preuves</h3><p>Proveblue® 5 mg/ml est le seul antidote autorisé en Suisse pour la méthémoglobinémie induite par des médicaments ou des produits chimiques. Les preuves du consensus européen reposent sur des séries de cas et un accord d’experts, non sur des essais comparatifs. Dans le cas fribourgeois, la méthémoglobine est passée de 30,3 % à 12,3 % en 30 minutes après 1 mg/kg, puis à 0,9 % au premier jour.</p><h3>Posologie</h3><table class="t"><tr><th>Population</th><th>Dose</th></tr><tr><td>Adulte et enfant de plus de 3 mois</td><td>1 à 2 mg/kg (0,2 à 0,4 ml/kg) par voie intraveineuse en 5 minutes ; nouvelle dose possible après 1 heure</td></tr><tr><td>Nouveau-né et nourrisson jusqu’à 3 mois</td><td>0,3 à 0,5 mg/kg, répétable après 1 heure</td></tr><tr><td>Insuffisance rénale modérée</td><td>1 mg/kg puis 1 mg/kg, cumul maximal 2 mg/kg</td></tr><tr><td>Insuffisance rénale sévère</td><td>1 mg/kg en dose unique</td></tr><tr><td>Cumul maximal</td><td>7 mg/kg ; 4 mg/kg si aniline ou dapsone</td></tr></table><p>Dilution possible dans 50 ml de glucose à 5 % ; jamais en sous-cutané ni en intrathécal ; injection lente.</p><h3>Contre-indications</h3><p>Hypersensibilité aux colorants thiaziniques ; déficit en G6PD ; méthémoglobinémie induite par le nitrite employé contre le cyanure ; intoxication au chlorate ; déficit en NADPH-réductase.</p><h3>Effets indésirables et surveillance</h3><p>Très fréquents : vertiges, paresthésies, dysgueusie, nausées, coloration cutanée, chromaturie, sueurs, douleur des extrémités. Mises en garde : syndrome sérotoninergique, hypotension, arythmies, photosensibilité, inhibition d’OCT2 et de MATE. Demi-vie terminale de 24,7 heures ; élimination urinaire, surtout sous forme de leucométhylène bleu.</p><h3>Non-réponse</h3><p>Penser à un déficit en cytochrome b5 réductase, à un déficit en G6PD ou à une sulfhémoglobinémie.</p><div class="key"><b>À retenir.</b> Antidote suisse de la méthémoglobinémie acquise ; 1 à 2 mg/kg en 5 minutes ; contre-indiqué en cas de déficit en G6PD ; interactions sérotoninergiques ; couleur bleue des urines.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a> ; <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a>.</p></template>
<template data-pop="d74-codes" data-title="Codes D74 de la CIM-10-GM 2024 : inclusions et usage"><h3>Trois codes</h3><table class="t"><tr><th>Code</th><th>Intitulé</th><th>Inclusions et note</th></tr><tr><td>D74.0</td><td>Méthémoglobinémie congénitale</td><td>Déficit congénital en NADH-méthémoglobine-réductase, maladie à hémoglobine M, méthémoglobinémie héréditaire</td></tr><tr><td>D74.8</td><td>Autres méthémoglobinémies</td><td>Méthémoglobinémie acquise (avec sulfhémoglobinémie), méthémoglobinémie toxique ; un code supplémentaire du chapitre des causes externes note l’agent</td></tr><tr><td>D74.9</td><td>Méthémoglobinémie, sans précision</td><td>Aucune précision d’origine</td></tr></table><p>Aucune inclusion ni exclusion n’est attachée à la catégorie D74 elle-même. Pour une intoxication, le codeur ajoute le code du chapitre des causes externes, qui désigne l’agent. Les intitulés français viennent du registre du dépôt (OFS) ; la classification allemande du BfArM est la version de référence consultée.</p><div class="key"><b>À retenir.</b> D74.0 pour les formes héréditaires, D74.8 pour l’acquise et la toxique avec code de cause externe, D74.9 si l’origine n’est pas précisée.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, BfArM</a>.</p></template>
<template data-pop="d74-cyb5r" data-title="NADH-cytochrome b5 réductase (CYB5R)"><h3>Rôle</h3><p>La CYB5R, appelée aussi diaphorase NADH, est l’enzyme de la voie principale de réduction de la méthémoglobine. Elle utilise le NADH et ramène le fer ferrique à l’état ferreux, maintenant la méthémoglobine sous 1 % de l’hémoglobine.</p><h3>Déficit</h3><p>Le gène est <i>CYB5R3</i>. Plus de 80 variants sont rapportés. L’activité est diminuée, inférieure à 20 % de la normale dans le déficit congénital. Dans le type I, l’enzyme est instable seulement dans les globules rouges ; dans le type II, le déficit touche tous les tissus.</p><h3>Nourrisson</h3><p>L’activité atteint 50 à 60 % des valeurs adultes, ce qui explique la sensibilité accrue aux oxydants.</p><div class="key"><b>À retenir.</b> Enzyme de la voie principale, dépendante du NADH. Déficit : types I et II. Activité normale : forme acquise, type IV ou hémoglobine M.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/de/dokumente/marktueberwachung/vigilance/vigilance-news_juni2011.pdf.download.pdf/vigilance-news_juni2011.pdf" target="_blank" rel="noopener">Swissmedic, Vigilance-News, juin 2011</a>.</p></template>
<template data-pop="d74-voie-nadph" data-title="NADPH-méthémoglobine réductase : la voie accessoire"><h3>Fonctionnement</h3><p>Cette voie dépend du NADPH produit par la voie des pentoses phosphates, dont la G6PD est la première enzyme. Le globule rouge n’a pas d’autre source de NADPH.</p><h3>Pourquoi on la mobilise</h3><p>En temps normal, elle est peu active. En présence de bleu de méthylène, le colorant accepte l’électron du NADPH puis réduit le fer ; la voie devient efficace. Avant l’âge de 3 mois, l’activité est plus faible, ce qui justifie des doses réduites chez le nourrisson.</p><div class="key"><b>À retenir.</b> Voie de secours dépendante de la G6PD ; elle explique l’action du bleu de méthylène et sa contre-indication en cas de déficit.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/de/dokumente/marktueberwachung/vigilance/vigilance-news_juni2011.pdf.download.pdf/vigilance-news_juni2011.pdf" target="_blank" rel="noopener">Swissmedic, Vigilance-News, juin 2011</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-courbe" data-title="Courbe de dissociation de l’oxyhémoglobine et méthémoglobine"><h3>Rappel</h3><p>La courbe de dissociation relie la pression partielle d’oxygène à la saturation de l’hémoglobine. Plus elle est déviée vers la gauche, plus l’hémoglobine retient son oxygène.</p><h3>Effet de la méthémoglobine</h3><p>Dans un tétramère contenant du fer ferrique, les sous-unités restées ferreuses ont une affinité accrue pour l’oxygène : la courbe se déplace vers la gauche. À pression partielle égale, l’hémoglobine fonctionnelle cède moins d’oxygène aux tissus. L’hypoxie tissulaire s’ajoute donc à la perte de capacité de transport.</p><div class="key"><b>À retenir.</b> Déplacement vers la gauche : moindre libération tissulaire. C’est pourquoi un taux modéré de méthémoglobine peut être mal toléré.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a>.</p></template>
<template data-pop="d74-types" data-title="Types I, II et IV : le déficit héréditaire en réductase"><h3>Comparaison</h3><table class="t"><tr><th>Type</th><th>Gène et déficit</th><th>Méthémoglobine</th><th>Clinique</th></tr><tr><td>I</td><td><i>CYB5R3</i> ; enzyme instable dans les globules rouges seulement</td><td>20 à 30 %</td><td>Cyanose isolée dès la naissance ; souvent asymptomatique ; érythrocytose possible</td></tr><tr><td>II</td><td><i>CYB5R3</i> ; déficit dans tous les tissus</td><td>8 à 40 %</td><td>Microcéphalie quasi constante, hypotonie axiale, dystonie, mouvements choréo-athétosiques, strabisme (plus de 80 %), épilepsie ; décès habituellement dans la première décennie</td></tr><tr><td>IV</td><td><i>CYB5A</i> ; déficit en cytochrome b5 avec déficit isolé en 17,20-lyase</td><td>12 à 19 %</td><td>Anomalie du développement sexuel 46,XY, organes génitaux ambigus</td></tr></table><p>Les trois types sont récessifs. Le type I est le seul qui se traite surtout pour des raisons esthétiques. Les types I et II ont une activité de la CYB5R diminuée ; le type IV a une activité normale.</p><div class="key"><b>À retenir.</b> Cyanose isolée : type I. Cyanose et atteinte neurologique : type II. Cyanose et ambiguïté génitale 46,XY : type IV.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>, tableau 2.</p></template>
<template data-pop="d74-hbm" data-title="Hémoglobine M"><h3>Mécanisme</h3><p>Une histidine proximale ou distale est remplacée par une tyrosine. Le fer forme un complexe fer-phénolate résistant à la réduction. La méthémoglobine ne peut pas être réduite par les enzymes habituelles.</p><h3>Transmission et variants</h3><p>La transmission est autosomique dominante ; les gènes sont <i>HBA1/2</i>, <i>HBB</i> et <i>HBG1/2</i>. Au moins 13 variants existent (Boston, Saskatoon, Iwate, Hyde Park, entre autres). Le variant Iwate est appelé « Kochikuro » (bouche noire) au Japon.</p><h3>Clinique et conduite</h3><p>La cyanose débute dès la naissance pour une chaîne α, après 6 à 9 mois pour une chaîne β. La méthémoglobine est de 12 à 25 % ; l’électrophorèse est anormale. Le bleu de méthylène et l’acide ascorbique sont inefficaces et à éviter.</p><div class="key"><b>À retenir.</b> Cyanose héréditaire dominante, enzyme normale, électrophorèse anormale ; aucun antidote utile.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-sulfhb" data-title="Sulfhémoglobinémie"><h3>Place dans la classification</h3><p>La CIM-10-GM range la sulfhémoglobinémie avec la méthémoglobinémie acquise sous D74.8. Elle appartient au diagnostic différentiel de la cyanose.</p><h3>Particularité</h3><p>Elle ne répond pas au bleu de méthylène. Une absence de réponse à l’antidote doit donc faire évoquer, parmi d’autres causes, une sulfhémoglobinémie. Les sources lues ne détaillent pas son mécanisme ni son dosage.</p><div class="key"><b>À retenir.</b> Cyanose sans réponse au bleu de méthylène : penser, entre autres causes, à la sulfhémoglobinémie.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, BfArM</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-poppers" data-title="Poppers (nitrites d’alkyle) : toxicité et contexte suisse"><h3>Produit et mécanisme</h3><p>Les poppers sont des nitrites d’alkyle (nitrite d’amyle, d’isobutyle) inhalés comme drogue récréative. Les nitrites sont des oxydants du fer de l’hémoglobine. Des taux supérieurs à 90 % et des décès sont décrits avec les agents récréatifs.</p><h3>Cas fribourgeois</h3><p>Un homme de 37 ans a avalé 13 ml de nitrite d’alkyle. Méthémoglobine à 30,3 %, traitée par 1 mg/kg de bleu de méthylène avec baisse à 12,3 % en 30 minutes et 0,9 % au premier jour.</p><h3>Contexte suisse</h3><p>Prévalence d’usage de 0,2 % en 2016 ; les inhalants occupaient le quatrième rang des substances chez les 15 ans en 2010 (données citées de seconde main). Les nitrites d’alkyle sont interdits à la vente pour inhalation, mais leur détention personnelle n’est pas sanctionnée.</p><div class="key"><b>À retenir.</b> Inhalation ou ingestion de poppers : méthémoglobinémie possible, parfois massive. Interroger sur les drogues récréatives.</div><p class="src">Références : <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a> ; <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-anesthesiques" data-title="Anesthésiques locaux : un cas suisse et la règle de surface"><h3>Agents</h3><p>Benzocaïne, prilocaïne, lidocaïne, tétracaïne et articaïne peuvent induire une méthémoglobinémie ; la cocaïne coupée aussi. Benzocaïne et lidocaïne sont les médicaments les plus souvent en cause.</p><h3>Le cas rapporté par Swissmedic</h3><p>Un homme de 19 ans, dans un institut esthétique, a reçu la crème Emla® (lidocaïne et prilocaïne) sur 30 à 40 % de la surface corporelle avant une épilation laser. Il a présenté une méthémoglobinémie. La surface maximale chez l’adulte est fixée à 600 cm² (60 g).</p><h3>Nourrisson et prématuré</h3><p>Gels de dentition à la benzocaïne et lidocaïne pour circoncision sont cités chez le nourrisson ; Emla® est contre-indiqué chez le nourrisson de 0 à 12 mois traité par des médicaments méthémoglobinisants et chez le prématuré de moins de 37 semaines d’aménorrhée.</p><div class="key"><b>À retenir.</b> L’application cutanée étendue d’un anesthésique local suffit à provoquer une méthémoglobinémie ; respecter les surfaces maximales.</div><p class="src">Références : <a href="https://www.swissmedic.ch/dam/swissmedic/de/dokumente/marktueberwachung/vigilance/vigilance-news_juni2011.pdf.download.pdf/vigilance-news_juni2011.pdf" target="_blank" rel="noopener">Swissmedic, Vigilance-News, juin 2011</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680529800119" target="_blank" rel="noopener">Emla®, information professionnelle suisse</a> ; <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-emla" data-title="Emla® : précautions de l’information professionnelle"><h3>Contenu</h3><p>La crème et les emplâtres Emla® associent lidocaïne et prilocaïne. L’information professionnelle suisse signale le risque de méthémoglobinémie.</p><h3>Précautions</h3><ul><li>Contre-indication chez le nourrisson de 0 à 12 mois traité par des médicaments méthémoglobinisants et chez le prématuré de moins de 37 semaines d’aménorrhée.</li><li>Le déficit en G6PD et la méthémoglobinémie congénitale augmentent la sensibilité.</li><li>Surface maximale chez l’adulte : 600 cm² (60 g), selon Swissmedic.</li></ul><div class="key"><b>À retenir.</b> Surface limitée, prudence chez le nourrisson, G6PD et méthémoglobinémie congénitale à rechercher.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680529800119" target="_blank" rel="noopener">Emla®, information professionnelle suisse</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/de/dokumente/marktueberwachung/vigilance/vigilance-news_juni2011.pdf.download.pdf/vigilance-news_juni2011.pdf" target="_blank" rel="noopener">Swissmedic, Vigilance-News, juin 2011</a>.</p></template>
<template data-pop="d74-dapsone" data-title="Dapsone et autres agents anti-infectieux"><h3>Agents</h3><p>Dapsone, sulfamides, sulfaméthoxazole, triméthoprime, chloroquine et primaquine peuvent induire une méthémoglobinémie.</p><h3>Particularités</h3><ul><li>La dose cumulée maximale de bleu de méthylène est de 4 mg/kg si la dapsone est en cause.</li><li>L’oxydant persistant (dapsone) justifie des redoses toutes les 6 à 8 heures pendant 2 à 3 jours ou, selon l’EHA, une perfusion continue ; l’information suisse juge les données insuffisantes pour recommander la perfusion.</li></ul><p>Aucune information professionnelle suisse n’a été trouvée pour la dapsone dans la base consultée ; les doses du bleu de méthylène viennent de l’information du colorant.</p><div class="key"><b>À retenir.</b> Dapsone : méthémoglobinémie prolongée, doses de bleu de méthylène plafonnées à 4 mg/kg, redoses possibles.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-rasburicase" data-title="Rasburicase (Fasturtec®) : G6PD et méthémoglobinémie"><h3>Mécanisme</h3><p>La rasburicase convertit l’acide urique en allantoïne, ce qui produit du peroxyde d’hydrogène. En cas de déficit en G6PD, il en résulte hémolyse et méthémoglobinémie.</p><h3>Conduite selon l’information suisse</h3><ul><li>Contre-indication en cas de déficit en G6PD.</li><li>Arrêt immédiat et définitif en cas de méthémoglobinémie.</li></ul><p>Un cas bernois (résumé seul) rapporte une désaturation transcutanée chez un patient cancéreux sous rasburicase avec déficit en G6PD.</p><div class="key"><b>À retenir.</b> Oncologie : G6PD avant rasburicase ; si méthémoglobinémie, arrêt définitif.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">Fasturtec®, information professionnelle suisse</a> ; <a href="https://doi.org/10.1213/XAA.0000000000000855" target="_blank" rel="noopener">Bachmann et coll., Inselspital, 2019 (résumé)</a>.</p></template>
<template data-pop="d74-serotonine" data-title="Bleu de méthylène et syndrome sérotoninergique"><h3>Mécanisme</h3><p>Le bleu de méthylène est un inhibiteur réversible et puissant de la monoamine-oxydase. Associé à des médicaments sérotoninergiques, il peut provoquer un syndrome sérotoninergique.</p><h3>Médicaments concernés</h3><p>Inhibiteurs sélectifs de la recapture de la sérotonine, inhibiteurs de la recapture de la sérotonine et de la noradrénaline, inhibiteurs de la monoamine-oxydase, bupropion, buspirone, clomipramine, mirtazapine, venlafaxine, tramadol, fentanyl, péthidine et dextrométhorphane.</p><h3>Surveillance</h3><p>Une surveillance du système nerveux central de 4 heures est prévue. La demande d’avis auprès de Tox Info Suisse aide à peser le bénéfice et le risque.</p><div class="key"><b>À retenir.</b> Poser la question du traitement sérotoninergique avant le bleu de méthylène.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-seuils" data-title="Seuils de gravité : Swissmedic 2011 et EHA 2021"><h3>Les deux grilles</h3><table class="t"><tr><th>Élément</th><th>Swissmedic, juin 2011</th><th>EHA et EuroBloodNet, 2021</th></tr><tr><td>Asymptomatique</td><td>Moins de 15 %</td><td>Moins de 10 % ; 10 à 30 % : aucun symptôme ou confusion</td></tr><tr><td>Symptômes</td><td>Cyanose, vertiges, céphalées au-delà de 15 %</td><td>Dyspnée, vertiges, syncope entre 30 et 50 %</td></tr><tr><td>Atteinte grave</td><td>Convulsions, somnolence, coma au-dessus de 40 %</td><td>Convulsions, délire, coma, arythmies entre 50 et 70 %</td></tr><tr><td>Menace vitale</td><td>Vers 70 à 80 %</td><td>Au-dessus de 70 %</td></tr></table><h3>Quel texte suivre</h3><p>Les grilles divergent surtout sur les paliers intermédiaires. Le Vigilance-News de 2011 simplifie volontairement ; le consensus de 2021 est la source primaire européenne la plus récente et c’est celle que ce cours retient. La grille de 2011 reste consultable et ne contredit pas le palier de menace vitale. Les deux textes reposent sur des cas et des avis d’experts.</p><div class="key"><b>À retenir.</b> Le consensus de 2021 fait foi pour les seuils ; la grille de 2011 est plus simple et plus prudente pour les taux modérés.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/de/dokumente/marktueberwachung/vigilance/vigilance-news_juni2011.pdf.download.pdf/vigilance-news_juni2011.pdf" target="_blank" rel="noopener">Swissmedic, Vigilance-News, juin 2011</a>.</p></template>
<template data-pop="d74-perfusion" data-title="Perfusion continue de bleu de méthylène : EHA contre information suisse"><h3>Les deux positions</h3><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td>EHA et EuroBloodNet 2021</td><td>Pour un oxydant persistant (dapsone) : redoses toutes les 6 à 8 heures pendant 2 à 3 jours, ou perfusion de 0,10 à 0,25 mg/kg/h</td></tr><tr><td>Information professionnelle suisse de Proveblue®</td><td>Données insuffisantes pour recommander une perfusion continue ; dose cumulée maximale de 7 mg/kg (4 mg/kg pour l’aniline et la dapsone)</td></tr></table><h3>Comment trancher</h3><p>L’information professionnelle est le texte réglementaire suisse en vigueur au 14.10.2026, dont la date de révision n’a pas été relevée ; le consensus européen est une recommandation d’experts de 2021 fondée sur des séries de cas. Le choix revient au médecin traitant, avec l’avis de Tox Info Suisse : la perfusion est une option décrite en Europe, non recommandée par le texte suisse, et la dose cumulée maximale sert de plafond dans les deux lectures.</p><div class="key"><b>À retenir.</b> Oxydant persistant : redoses ou, selon l’EHA, perfusion ; l’information suisse n’en recommande pas. Respecter la dose cumulée maximale.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-ascorbique" data-title="Acide ascorbique : réduction directe et lente"><h3>Mécanisme et place</h3><p>L’acide ascorbique réduit directement le fer, mais lentement : au moins 24 heures. Il est le traitement de choix quand le bleu de méthylène est indisponible ou en cas de déficit en G6PD.</p><h3>Posologie</h3><p>Non standardisée. Exemples cités : 0,5 à 1 g toutes les 12 heures, ou 1,5 à 2 g par voie intraveineuse, 3 à 4 fois. Dans les formes héréditaires : 0,2 à 1 g par jour, par voie orale, avec un risque de lithiase d’oxalate en traitement prolongé.</p><h3>Limites</h3><p>Inefficace dans l’hémoglobine M. Aucune information professionnelle suisse n’a été trouvée pour l’acide ascorbique injectable ; la posologie pédiatrique n’est pas standardisée.</p><div class="key"><b>À retenir.</b> Alternative lente et sans G6PD ; posologie d’experts, non standardisée.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-exsang" data-title="Exsanguino-transfusion : indications et résultats"><h3>Principe</h3><p>L’exsanguino-transfusion retire le sang contenant de la méthémoglobine et apporte des globules rouges normaux.</p><h3>Indications citées</h3><ul><li>Aggravation après le bleu de méthylène (urgente).</li><li>Forme réfractaire : survie de 81,6 % chez les réfractaires au bleu de méthylène dans une revue systématique.</li><li>Grossesse, comme alternative au bleu de méthylène (exsanguino-transfusion érythrocytaire).</li><li>Chirurgie majeure, en préopératoire dans certains cas.</li></ul><div class="key"><b>À retenir.</b> Recours en cas d’aggravation, d’échec ou de contre-indication de l’antidote.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-rebond" data-title="Rebond après bleu de méthylène"><h3>Ce qui est décrit</h3><p>Une baisse rapide de la méthémoglobine est attendue en moins d’une heure, mais un effet de rebond est possible. Une aggravation après l’antidote impose une exsanguino-transfusion urgente.</p><h3>Conduite</h3><p>Répéter la CO-oxymétrie, jauger les symptômes, considérer une nouvelle dose après 1 heure dans les limites de la dose cumulée, et chercher un oxydant persistant.</p><div class="key"><b>À retenir.</b> La baisse initiale ne clôt pas la surveillance.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-nourrisson" data-title="Nourrisson : sensibilité, nitrates et conduite"><h3>Pourquoi le nourrisson est vulnérable</h3><p>L’activité de la CYB5R atteint 50 à 60 % des valeurs adultes, l’hémoglobine fœtale s’oxyde plus facilement, et la NADPH-méthémoglobine-réductase est plus faible avant 3 mois.</p><h3>Diarrhée et acidose</h3><p>Le consensus présente comme hypothèse qu’un pH intestinal plus élevé favorise des bactéries Gram négatif qui transforment les nitrates alimentaires en nitrites. Si la méthémoglobine est inférieure à 20 %, la réhydratation et le bicarbonate peuvent suffire.</p><h3>Doses</h3><p>Bleu de méthylène de 0,3 à 0,5 mg/kg jusqu’à 3 mois ; 2 à 4 mg/kg chez le prématuré provoquent hémolyse et méthémoglobinémie.</p><div class="key"><b>À retenir.</b> Nourrisson : sensibilité accrue, causes alimentaires possibles, doses réduites.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-glucose" data-title="Pourquoi apporter du glucose"><h3>Le raisonnement</h3><p>L’efficacité du bleu de méthylène dépend du NADPH, produit par la voie des pentoses phosphates à partir du glucose. Le consensus recommande un apport de glucose dans la prise en charge.</p><div class="key"><b>À retenir.</b> Glucose = substrat du NADPH ; il soutient l’action de l’antidote.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-cyanure" data-title="Nitrite et intoxication au cyanure"><h3>Ce que dit l’information suisse</h3><p>La méthémoglobinémie induite par le nitrite utilisé pour traiter une intoxication au cyanure figure parmi les contre-indications de Proveblue®.</p><h3>Limite des sources</h3><p>Les passages lus ne détaillent pas la raison de cette contre-indication. La règle s’applique telle quelle : le bleu de méthylène n’est pas donné dans cette situation. La conduite complète d’une intoxication au cyanure dépasse le cadre de ce chapitre.</p><div class="key"><b>À retenir.</b> Après nitrite antidotique du cyanure : pas de bleu de méthylène.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-grossesse" data-title="Grossesse et allaitement"><h3>Risque</h3><p>L’hypoxie maternelle menace le fœtus. Le bleu de méthylène est tératogène (atrésie jéjunale ou iléale, mort fœtale).</p><h3>Conduite</h3><ul><li>Bleu de méthylène seulement si le bénéfice dépasse le risque ; selon l’information suisse, pas d’utilisation sauf méthémoglobinémie engageant le pronostic vital.</li><li>Alternative : exsanguino-transfusion érythrocytaire.</li><li>Allaitement suspendu jusqu’à 8 jours.</li></ul><div class="key"><b>À retenir.</b> Grossesse : l’antidote est réservé aux cas vitaux ; l’échange sanguin est l’alternative.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>.</p></template>
<template data-pop="d74-chirurgie" data-title="Chirurgie et méthémoglobinémie"><h3>Avant l’intervention</h3><p>Évaluation préopératoire ; la prophylaxie par bleu de méthylène n’est pas soutenue. Sang et plasma sont préparés.</p><h3>Chirurgie majeure</h3><p>Une exsanguino-transfusion préopératoire est possible. L’inhibition de la guanylate cyclase par le bleu de méthylène chez l’anesthésié peut donner une hypertension systémique et pulmonaire.</p><div class="key"><b>À retenir.</b> Pas de prophylaxie par le colorant ; préparer le sang ; échange préopératoire possible.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-heinz" data-title="Corps de Heinz et tests de stabilité"><h3>Ce qu’ils montrent</h3><p>Les corps de Heinz sont des inclusions visibles au frottis, qui orientent vers une hémoglobine instable ou un déficit en G6PD. Le test de stabilité à l’isopropanol ou à la chaleur explore l’instabilité de l’hémoglobine.</p><h3>Interprétation</h3><p>Ils signalent l’hémolyse associée ; ils ne mesurent pas la méthémoglobine.</p><div class="key"><b>À retenir.</b> Hémolyse et cyanose : chercher corps de Heinz et instabilité.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-evelyn" data-title="Méthode d’Evelyn et Malloy"><h3>Principe</h3><p>Méthode spectrophotométrique de référence : mesure de l’absorbance à 630 nm, abolie par le cyanure. La disparition du signal après cyanure atteste que l’absorbance mesurée vient de la méthémoglobine.</p><h3>Place</h3><p>C’est le dosage de référence ; en pratique, la CO-oxymétrie le remplace pour la décision clinique.</p><div class="key"><b>À retenir.</b> Référence : absorbance à 630 nm abolie par le cyanure.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></template>
<template data-pop="d74-sources" data-title="Sources du chapitre, niveau de preuve et lacunes"><h3>Ce qui a été lu</h3><table class="t"><tr><th>Source</th><th>Nature</th><th>Limite</th></tr><tr><td>Consensus de l’European Hematology Association et d’EuroBloodNet, 2021</td><td>Recommandations par méthode Delphi (accord supérieur à 75 %)</td><td>Panel majoritairement européen ; niveau de preuve faible (séries de cas)</td></tr><tr><td>Informations professionnelles suisses (Proveblue®, Emla®, Fasturtec®)</td><td>Textes réglementaires</td><td>Date de révision non relevée ; passages ciblés lus</td></tr><tr><td>Swissmedic, Vigilance-News, juin 2011</td><td>Communication de vigilance</td><td>Seuils simplifiés ; document ancien</td></tr><tr><td>Cas HFR Fribourg, 2025</td><td>Cas isolé, texte intégral</td><td>Un patient</td></tr><tr><td>CIM-10-GM 2024 (BfArM, OFS)</td><td>Nosologie</td><td>Version allemande ; intitulés français repris du registre du dépôt</td></tr><tr><td>Cas bernois 2019, cas zurichois 2026, revue zurichoise 2020, résumé EHA 2021</td><td>Résumés seulement</td><td>Résumés, non texte intégral</td></tr></table><h3>Lacunes</h3><ul><li>Aucune recommandation d’une société suisse dédiée à la méthémoglobinémie n’a été trouvée ni lue.</li><li>La liste suisse des antidotes de Tox Info Suisse n’a pas pu être consultée.</li><li>Aucune information professionnelle suisse n’a été trouvée pour l’acide ascorbique injectable ni pour la dapsone.</li><li>Aucune épidémiologie suisse de la méthémoglobinémie acquise n’est disponible.</li></ul><p>Cette revue est faite par intelligence artificielle ; elle est distincte d’une validation médicale humaine, qui reste en attente.</p><div class="key"><b>À retenir.</b> La base européenne est un consensus d’experts ; la base suisse repose sur les informations professionnelles des médicaments. Les lacunes sont dites plutôt que comblées.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/de/dokumente/marktueberwachung/vigilance/vigilance-news_juni2011.pdf.download.pdf/vigilance-news_juni2011.pdf" target="_blank" rel="noopener">Swissmedic, Vigilance-News, juin 2011</a> ; <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, BfArM</a>.</p></template>
