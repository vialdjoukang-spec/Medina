<template data-pop="i30-d-asa" data-title="Aspirine à dose anti-inflammatoire">
<div class="lab">Mécanisme</div><p>Acétylation irréversible des cyclo-oxygénases 1 et 2. À forte dose, inhibition de la synthèse des prostaglandines de l’inflammation et de la fièvre ; à faible dose, effet antiplaquettaire seul.</p>
<div class="lab">Place</div><p>Première ligne avec la colchicine ; choix préférentiel après un infarctus, chez le patient sous antiagrégant et au début de la grossesse.</p>
<div class="lab">Posologie</div><p>750–1 000 mg toutes les 8 heures pendant 1 à 2 semaines, puis baisse de 250 à 500 mg toutes les 1 à 2 semaines (ESC 2015).</p>
<div class="lab">Effets indésirables</div><p>Ulcère et hémorragie digestive (protection par inhibiteur de la pompe à protons), acouphènes et surdité réversibles à forte dose, bronchospasme chez l’asthmatique sensible, insuffisance rénale.</p>
<div class="lab">Contre-indications</div><p>Ulcère évolutif, hémorragie active, allergie à l’aspirine, enfant (syndrome de Reye), grossesse au-delà de 20 semaines à dose anti-inflammatoire.</p>
<div class="lab">Surveillance</div><p>Tolérance digestive, créatinine, audition à forte dose.</p></template>

<template data-pop="i30-d-ains" data-title="AINS : ibuprofène et indométacine">
<div class="lab">Mécanisme</div><p>Inhibition réversible des cyclo-oxygénases : baisse des prostaglandines de l’inflammation, de la douleur et de la fièvre.</p>
<div class="lab">Preuves</div><p>Traitement historique de la péricardite, efficace sur la douleur ; les essais de colchicine (COPE, ICAP) ont été conduits avec l’aspirine ou l’ibuprofène comme traitement de base.</p>
<div class="lab">Posologie</div><p>Ibuprofène 600 mg toutes les 8 heures ; indométacine 25–50 mg toutes les 8 heures, en débutant à la dose basse. Durée et décroissance guidées par les symptômes et la protéine C réactive.</p>
<div class="lab">Effets indésirables</div><p>Digestifs (ulcère, hémorragie) ; rénaux (insuffisance rénale aiguë, hyperkaliémie) ; rétention hydrosodée et hausse tensionnelle ; céphalées et vertiges (indométacine).</p>
<div class="lab">Contre-indications</div><p>Ulcère évolutif, insuffisance rénale sévère, insuffisance cardiaque décompensée, grossesse au-delà de 20 semaines, période post-infarctus (préférer l’aspirine).</p>
<div class="lab">Surveillance</div><p>Créatinine et kaliémie chez le sujet âgé ou sous IEC, ARA II ou diurétique ; pression artérielle ; protection gastrique systématique.</p></template>

<template data-pop="i30-d-colch" data-title="Colchicine dans la péricardite">
<div class="lab">Mécanisme</div><p>Liaison à la tubuline et blocage de la polymérisation des microtubules : réduction de la migration et de l’activation des polynucléaires, inhibition de l’assemblage de l’inflammasome NLRP3.</p>
<div class="lab">Preuves</div><p>Premier épisode : COPE (2005) et ICAP (2013, <i>New England Journal of Medicine</i>) ; dans ICAP, la péricardite incessante ou récidivante est passée de 37,5 % à 16,7 %. Récidive : CORE (2005), CORP (2011) et CORP-2 (2014) ; dans CORP-2, récidives multiples, de 42,5 % à 21,6 %. Prévention du syndrome post-péricardiotomie : COPPS (2010).</p>
<div class="lab">Posologie</div><p>0,5 mg/jour si &lt; 70 kg ; 0,5 mg × 2/jour si ≥ 70 kg. Durée : 3 mois pour un premier épisode, au moins 6 mois pour une récidive. Demi-dose chez le sujet âgé. Dernier médicament arrêté.</p>
<div class="lab">Effets indésirables</div><p>Diarrhée et nausées (les plus fréquents, souvent passagers) ; plus rarement myopathie, neuropathie, cytopénies, hépatotoxicité, en particulier en cas d’interaction ou d’insuffisance rénale.</p>
<div class="lab">Contre-indications</div><p>DFG &lt; 30 mL/min et insuffisance hépatique sévère (information professionnelle suisse de Colctab) ; association aux inhibiteurs de la glycoprotéine P ou aux inhibiteurs puissants du CYP3A4, et à la ciclosporine ; troubles hématologiques, mauvais état général ; grossesse et allaitement ; hypersensibilité. Dose réduite ou intervalle allongé en cas d’insuffisance rénale légère à modérée.</p>
<div class="lab">Statut en Suisse</div><p>Colctab, comprimés de 0,5 mg et comprimés sécables de 1 mg ; indication officielle dans la péricardite aiguë et récidivante de l’adulte (0,5 mg × 2/jour au-delà de 70 kg, 0,5 mg/jour jusqu’à 70 kg) ; liste des spécialités, quote-part de 10 %.</p>
<div class="lab">Surveillance</div><p>Hémogramme, créatinine, transaminases, créatine kinase en cas de myalgies ; revue des interactions à chaque nouvelle prescription.</p></template>

<template data-pop="i30-d-cortico" data-title="Corticoïdes dans la péricardite">
<div class="lab">Mécanisme</div><p>Liaison au récepteur des glucocorticoïdes : répression de la transcription des cytokines inflammatoires, dont l’interleukine 1, et de nombreuses voies de l’inflammation.</p>
<div class="lab">Place</div><p>Deuxième ligne : échec ou contre-indication de l’aspirine et des AINS ; causes qui les exigent (maladie auto-immune, péricardite immunitaire médicamenteuse). Toujours associés à la colchicine. Évités en première intention, après un infarctus et chez l’enfant.</p>
<div class="lab">Posologie</div><p>Prednisone 0,2–0,5 mg/kg/jour jusqu’à la rémission, puis décroissance lente par paliers, d’autant plus lente sous 15 mg/jour (fiche de décroissance dans l’onglet Pharmacologie).</p>
<div class="lab">Effets indésirables</div><p>Récidives et corticodépendance ; hyperglycémie, hypertension, ostéoporose, infections, troubles de l’humeur, cataracte, insuffisance surrénalienne à l’arrêt.</p>
<div class="lab">Précautions</div><p>Exclure la tuberculose et une infection bactérienne avant de débuter ; calcium, vitamine D et protection osseuse selon le risque.</p></template>

<template data-pop="i30-d-antiil1" data-title="Anti-interleukine 1 : anakinra, rilonacept, goflikicept">
<div class="lab">Mécanisme</div><p><b>Anakinra</b> : forme recombinante de l’antagoniste naturel du récepteur de l’interleukine 1 ; bloque l’effet de l’interleukine 1α et 1β. Demi-vie courte, injection quotidienne. <b>Rilonacept</b> : protéine de fusion qui piège l’interleukine 1α et 1β ; injection hebdomadaire. <b>Goflikicept</b> : autre piège à interleukine 1, évalué en Russie.</p>
<div class="lab">Preuves</div><p><b>AIRTRIP</b> (2016, <i>JAMA</i>) : 21 patients corticodépendants et résistants à la colchicine ; après retrait randomisé, récidive chez 18 % sous anakinra contre 90 % sous placebo. <b>RHAPSODY</b> (2021, <i>New England Journal of Medicine</i>) : péricardite récidivante active à protéine C réactive élevée ; après retrait randomisé, risque de récidive fortement réduit sous rilonacept (rapport de risque 0,04).</p>
<div class="lab">Place (ESC 2025)</div><p>Classe IIa, niveau C, dans la récidive réfractaire à la colchicine et corticodépendante ; classe I, niveau A si la protéine C réactive est élevée (ESC 2025). L’ACC 2025 les place plus tôt, avant les corticoïdes.</p>
<div class="lab">Posologie</div><p>Anakinra 100 mg/jour par voie sous-cutanée (1–2 mg/kg/jour chez l’enfant). Rilonacept 320 mg en dose de charge puis 160 mg par semaine. Durée prolongée, souvent plus d’un an, avec décroissance progressive pour limiter les récidives à l’arrêt.</p>
<div class="lab">Effets indésirables</div><p>Réactions au point d’injection (très fréquentes avec l’anakinra) ; infections, dont réactivation tuberculeuse ; neutropénie ; hausse des transaminases.</p>
<div class="lab">Contre-indications et précautions</div><p>Infection active ; dépister la tuberculose latente avant de débuter ; éviter les vaccins vivants ; hémogramme et transaminases régulièrement.</p>
<div class="lab">Statut en Suisse</div><p>Anakinra autorisé dans d’autres indications (maladies rhumatismales et auto-inflammatoires) : usage hors indication dans la péricardite, avec demande préalable à l’assureur. Rilonacept : autorisation américaine (2021), pas d’autorisation européenne.</p></template>
