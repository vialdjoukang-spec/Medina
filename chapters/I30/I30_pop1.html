
<!-- ===== FENÊTRES I30 : notions fondamentales ===== -->
<template data-pop="i30-pv" data-title="Courbe pression-volume du péricarde">
<div class="lab">Forme</div><p>La courbe a une forme en J. Une première partie plate correspond à la réserve péricardique : du liquide s’ajoute sans hausse notable de pression. Une deuxième partie, presque verticale, commence quand les fibres de collagène sont tendues : chaque millilitre supplémentaire élève fortement la pression.</p>
<div class="lab">Rôle de la vitesse</div><p>Quand l’épanchement se constitue lentement, le péricarde se distend et la partie plate s’allonge : un litre ou plus peut être toléré. Quand il se constitue en minutes (plaie, rupture, dissection), la partie plate est courte : 200 à 300 mL suffisent à la tamponnade.</p>
<div class="lab">Conséquences pratiques</div><p>Sur la partie verticale, retirer 50 à 100 mL fait chuter la pression intrapéricardique et restaure le débit : une ponction même partielle est salvatrice. À l’inverse, un faible volume supplémentaire (saignement, remplissage) peut faire basculer un patient stable.</p></template>

<template data-pop="i30-interdep" data-title="Interdépendance ventriculaire">
<div class="lab">Définition</div><p>Le remplissage d’un ventricule influence celui de l’autre, parce qu’ils partagent le septum interventriculaire et un même sac péricardique.</p>
<div class="lab">À l’état normal</div><p>Elle est faible : le péricarde a une réserve, et l’augmentation inspiratoire du remplissage droit ne gêne pas le ventricule gauche. La pression systolique baisse de moins de 10 mmHg en inspiration.</p>
<div class="lab">Dans la tamponnade et la constriction</div><p>Le volume total est fixé. En inspiration, le ventricule droit se remplit plus ; le septum bombe vers la gauche ; le ventricule gauche se remplit moins. En expiration, l’inverse se produit. Il en résulte le pouls paradoxal, la variation respiratoire des flux à l’échocardiographie et la discordance des pressions systoliques au cathétérisme.</p>
<div class="lab">Exemple</div><p>Chez un patient en tamponnade, la pression systolique est de 110 mmHg en expiration et de 92 mmHg en inspiration : 18 mmHg de différence, pouls paradoxal net.</p></template>

<template data-pop="i30-dissoc" data-title="Dissociation des pressions intrathoraciques et intracardiaques">
<div class="lab">Principe</div><p>Dans la constriction, le péricarde rigide isole les cavités cardiaques du thorax. Les veines pulmonaires, situées hors du péricarde, subissent la baisse inspiratoire de pression ; l’oreillette et le ventricule gauches, enfermés dans le péricarde rigide, ne la subissent pas.</p>
<div class="lab">Conséquence</div><p>En inspiration, le gradient entre les veines pulmonaires et l’oreillette gauche diminue : le remplissage gauche baisse. Le ventricule droit profite de la place libérée et se remplit davantage. En expiration, le phénomène s’inverse.</p>
<div class="lab">Traduction dans les examens</div><p>Baisse inspiratoire du flux mitral E d’au moins 25 % ; bascule du septum ; reflux diastolique expiratoire dans les veines sus-hépatiques ; discordance des pressions systoliques droite et gauche au cathétérisme.</p>
<div class="lab">Pourquoi pas dans la restriction</div><p>Dans la cardiomyopathie restrictive, le péricarde est normal : la variation de pression thoracique atteint toutes les cavités, et la dissociation n’existe pas. C’est le critère différentiel le plus solide.</p></template>

<template data-pop="i30-pp" data-title="Pouls paradoxal">
<div class="lab">Définition</div><p>Baisse inspiratoire de la pression artérielle systolique de plus de 10 mmHg. Le terme est trompeur : il s’agit de l’exagération d’un phénomène normal, et non d’une inversion.</p>
<div class="lab">Technique de mesure</div><p>Patient en respiration calme. Gonfler le brassard au-dessus de la systolique, puis dégonfler lentement. Noter la pression où les premiers bruits apparaissent, seulement en expiration. Continuer jusqu’à la pression où tous les battements sont audibles, en inspiration comme en expiration. La différence entre les deux valeurs est le pouls paradoxal.</p>
<div class="lab">Mécanisme</div><p>Interdépendance ventriculaire dans un sac plein ; accessoirement, accumulation de sang dans les veines pulmonaires en inspiration.</p>
<div class="lab">Causes</div><p>Tamponnade (signe majeur) ; constriction (inconstant, environ un tiers des cas) ; asthme aigu grave et exacerbation de BPCO ; embolie pulmonaire massive ; choc hypovolémique.</p>
<div class="lab">Faux négatifs</div><p>Communication interauriculaire, insuffisance aortique sévère, hypertrophie ventriculaire gauche avec pression télédiastolique élevée, ventilation en pression positive, tamponnade localisée.</p></template>

<template data-pop="i30-inflamm" data-title="Inflammasome NLRP3 et interleukine 1">
<div class="lab">Définition</div><p>L’inflammasome est un complexe protéique du cytoplasme des cellules de l’immunité innée. Il détecte des signaux de danger d’origine microbienne ou issus de cellules lésées.</p>
<div class="lab">Cascade</div><p>Activation de NLRP3 → recrutement et activation de la caspase 1 → clivage de la pro-interleukine 1β en interleukine 1β → sécrétion. Les cellules mésothéliales lésées libèrent en plus de l’interleukine 1α préformée. Les deux se fixent au récepteur de type 1.</p>
<div class="lab">Effets</div><p>Fièvre, synthèse hépatique de protéine C réactive (par l’intermédiaire de l’interleukine 6), recrutement de polynucléaires, perméabilité vasculaire, et nouvelle production d’interleukine 1 : la boucle s’auto-entretient.</p>
<div class="lab">Corrélation thérapeutique</div><p>Colchicine : bloque l’assemblage de l’inflammasome et la migration des polynucléaires. Anakinra : bloque le récepteur. Rilonacept : piège les deux interleukines. Ces cibles expliquent l’efficacité dans les récidives à protéine C réactive élevée.</p></template>

<template data-pop="i30-imps" data-title="Syndrome inflammatoire myopéricardique (ESC 2025)">
<div class="lab">Définition</div><p>Terme général de l’<a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a> (en anglais « inflammatory myopericardial syndrome ») qui regroupe la péricardite, la myocardite et leurs formes mixtes. Il reconnaît leurs causes communes et leur chevauchement fréquent.</p>
<div class="lab">Le spectre</div><p>Péricardite pure (troponine normale) → myopéricardite (péricardite dominante, troponine élevée, fonction conservée) → périmyocardite ou myocardite (atteinte myocardique dominante, dysfonction possible).</p>
<div class="lab">Intérêt pratique</div><p>Devant toute péricardite, doser la troponine et, si elle est élevée, évaluer le myocarde (échocardiographie, IRM). Devant toute myocardite, chercher un épanchement. La classification guide l’hospitalisation, la restriction sportive et le choix des traitements.</p></template>

<template data-pop="i30-myoperi" data-title="Myopéricardite">
<div class="lab">Définition</div><p>Péricardite qui remplit les critères diagnostiques, avec une élévation de la troponine, sans dysfonction ventriculaire gauche nouvelle ou avec une dysfonction légère.</p>
<div class="lab">Conduite</div><p>Critère mineur de haut risque : hospitalisation. Coronarographie ou coroscanner si la probabilité coronaire est significative. IRM pour quantifier l’atteinte myocardique. Traitement de la péricardite, avec des AINS à la dose efficace la plus faible, car des données animales suggèrent qu’ils aggravent l’atteinte myocardique.</p>
<div class="lab">Pronostic et sport</div><p>Bon en général. Restriction de l’activité plus prudente que dans la péricardite pure, levée après normalisation des marqueurs et en l’absence d’arythmie ou de dysfonction.</p></template>

<template data-pop="i30-crit" data-title="Critères diagnostiques de la péricardite (ESC 2025 et ESC 2015)">
<div class="lab"><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a></div><p>Critères supplémentaires : frottement ; modifications ECG (sous-décalage du PR, sus-décalage ST diffus) ; élévation de la protéine C réactive ; épanchement nouveau ou croissant ; œdème ou rehaussement tardif du péricarde à l’IRM. Diagnostic <b>certain</b> : présentation compatible et au moins deux critères supplémentaires ; <b>possible</b> : un seul ; <b>peu probable</b> : aucun (tableau 4).</p>
<div class="lab">Consensus américain</div><p>Le consensus de l’<a href="https://doi.org/10.1016/j.jacc.2025.05.023" target="_blank" rel="noopener">ACC (2025)</a> retient la péricardite dès qu’une douleur typique s’associe à un seul critère. Cette règle plus large ne fonde pas la pratique européenne ; elle explique pourquoi certaines séries publiées comptent davantage de péricardites.</p>
<div class="lab"><a href="https://doi.org/10.1093/eurheartj/ehv318" target="_blank" rel="noopener">ESC 2015</a></div><p>Au moins deux critères sur quatre : douleur péricarditique ; frottement ; sus-décalage ST diffus ou sous-décalage du PR ; épanchement nouveau ou croissant. Arguments de soutien : protéine C réactive élevée, inflammation en imagerie.</p>
<div class="lab">Ce qui change</div><p>La protéine C réactive et l’IRM deviennent des critères. Une douleur typique avec une protéine C réactive élevée définit une péricardite possible selon l’ESC 2025 ; un second critère objectif, frottement, ECG typique, épanchement ou IRM, la rend certaine.</p>
<div class="lab">Piège</div><p>Une douleur thoracique récidivante sans aucun critère objectif ne doit pas être étiquetée péricardite : ce surdiagnostic expose aux traitements prolongés inutiles.</p>
<div class="lab">Ce que traduit chaque critère</div><p><b>Frottement</b> : les deux feuillets enflammés, couverts de fibrine, frottent l’un contre l’autre ; il est très spécifique mais entendu dans un tiers des cas au plus. <b>ECG</b> : le péricarde est électriquement silencieux ; un sus-décalage du ST ou un sous-décalage du PR traduit l’inflammation du myocarde sous-épicardique. <b>Protéine C réactive</b> : le foie la synthétise sous l’effet de l’interleukine 6 ; elle est élevée dans 79 à 90 % des cas et mesure l’activité de la maladie. <b>Épanchement</b> : l’inflammation augmente la production de liquide ; il est présent jusque dans 60 % des cas, en général faible. <b>IRM</b> : le péricarde enflammé est œdémateux et néovascularisé, ce qui le rend hyperintense sur les séquences sensibles à l’eau et rehaussé après gadolinium.</p>
<div class="lab">Pourquoi deux critères</div><p>Aucun critère ne suffit seul : le frottement manque souvent, l’ECG typique manque dans au moins 40 % des cas, et une protéine C réactive normale n’exclut pas la maladie. L’exigence de deux critères objectifs protège à la fois du surdiagnostic et du diagnostic manqué.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">Recommandations de l’ESC 2025 sur les myocardites et les péricardites</a>, sections 3.3.2, 4.4.1, 5.1, 5.2.1, 5.5.2 et 5.6, tableau 4.</p>
</template>

<template data-pop="i30-crp" data-title="Protéine C réactive dans la péricardite">
<div class="lab">Biologie</div><p>Protéine de phase aiguë synthétisée par le foie sous l’effet de l’interleukine 6. Hausse en 6 à 8 heures, pic vers 48 heures, demi-vie d’environ 19 heures. Valeur normale habituelle &lt; 5 mg/L (méthode dépendante).</p>
<div class="lab">Trois usages</div><p><b>Diagnostic</b> : critère objectif dans l’<a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a>, élevée chez près de 80 % des patients. <b>Durée du traitement</b> : la dose d’attaque est maintenue jusqu’à sa normalisation. <b>Récidive</b> : une réascension avec douleur confirme la récidive ; une douleur sans hausse la rend douteuse.</p>
<div class="lab">Phénotype</div><p>Les récidives à protéine C réactive élevée relèvent d’une inflammation médiée par l’interleukine 1 et répondent le mieux aux anti-interleukine 1.</p>
<div class="lab">Piège</div><p>Une protéine C réactive normale chez un patient déjà sous AINS ou corticoïde n’exclut pas une péricardite. Doser avant le traitement quand c’est possible.</p>
<div class="lab">Phénotype non inflammatoire</div><p>Chez 10 à 20 % des patients, la protéine C réactive est normale ou à peine élevée. Le mécanisme de ces formes est inconnu, et elles sont plus difficiles à traiter. Dans les maladies auto-immunes à signature interféron de type I, la protéine C réactive peut rester basse malgré une inflammation active : elle n’y mesure pas fidèlement l’activité.</p>
<div class="lab">Autour d’une ponction</div><p>Le dosage précède la péricardiocentèse, car le geste irrite le péricarde et élève la protéine C réactive dans les jours suivants. Une hausse après une ponction ne signe donc pas à elle seule une récidive.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">Recommandations de l’ESC 2025 sur les myocardites et les péricardites</a>, sections 4.5.8.2 et 11.7.3 ; <a href="https://pubmed.ncbi.nlm.nih.gov/33243434/" target="_blank" rel="noopener">Lazaros et al., <i>American Journal of the Medical Sciences</i> 2021</a>.</p>
</template>

<template data-pop="i30-autoinfl" data-title="Maladies auto-inflammatoires et péricardite récidivante">
<div class="lab">Fièvre méditerranéenne familiale</div><p>Gène <i>MEFV</i>, transmission autosomique récessive. Accès de fièvre de 1 à 3 jours avec péritonite, pleurésie, péricardite ou arthrite. Traitement de fond : colchicine au long cours, qui prévient aussi l’amylose inflammatoire secondaire.</p>
<div class="lab">Syndrome lié au récepteur 1 du facteur de nécrose tumorale</div><p>Gène <i>TNFRSF1A</i>, transmission autosomique dominante. Accès plus longs (une à trois semaines), myalgies migratrices, éruption, œdème périorbitaire. Réponse médiocre à la colchicine ; bonne réponse aux anti-interleukine 1.</p>
<div class="lab">Quand y penser</div><p>Récidives fréquentes, fièvres récurrentes inexpliquées, douleurs abdominales épisodiques, origine méditerranéenne, antécédents familiaux, résistance à la colchicine.</p></template>

<template data-pop="i30-cortdep" data-title="Corticodépendance">
<div class="lab">Définition</div><p>Récidive chaque fois que la dose de corticoïde descend sous un seuil, souvent entre 10 et 15 mg/jour de prednisone.</p>
<div class="lab">Mécanisme</div><p>Le corticoïde supprime l’expression de l’inflammation sans éteindre la boucle de l’interleukine 1. Les fortes doses initiales sont associées à davantage de récidives que les doses faibles, dans les séries italiennes.</p>
<div class="lab">Prévention</div><p>Dose faible à modérée (0,2–0,5 mg/kg/jour), colchicine associée, décroissance très lente sous 15 mg/jour, maintien de l’AINS à pleine dose pendant la décroissance du corticoïde.</p>
<div class="lab">Sortie</div><p>Anti-interleukine 1 : ils permettent en général l’arrêt complet du corticoïde.</p>
<div class="lab">Récidive pendant la décroissance</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a> recommande de garder la colchicine et d’ajouter un AINS, plutôt que de remonter le corticoïde : chaque hausse prolonge l’exposition et entretient la dépendance. Le choix du médicament décru en premier, corticoïde ou AINS, dépend de l’âge, de la fonction rénale, du risque hémorragique et d’un anticoagulant oral.</p>
<div class="lab">Protection osseuse</div><p>Les glucocorticoïdes réduisent la formation osseuse et l’absorption intestinale du calcium. L’ESC 2025 propose donc 1 200 à 1 500 mg/jour de calcium et 800 à 1 000 unités internationales/jour de vitamine D à tous les patients traités. Elle recommande un bisphosphonate chez l’homme de 50 ans ou plus et la femme ménopausée qui commencent un traitement prolongé d’au moins 5 à 7,5 mg/jour de prednisone.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">Recommandations de l’ESC 2025 sur les myocardites et les péricardites</a>, tableau 14.</p>
</template>

<template data-pop="i30-mnemo-faste" data-title="FASTE — critères majeurs de haut risque">
<p><b>F</b> — <b>F</b>ièvre &gt; 38 °C ;<br><b>A</b> — <b>A</b>bsence de réponse après au moins une semaine d’aspirine ou d’AINS ;<br><b>S</b> — installation <b>S</b>ubaiguë (jours à semaines) ;<br><b>T</b> — <b>T</b>amponnade ;<br><b>E</b> — <b>É</b>panchement abondant (&gt; 20 mm en diastole).</p>
<div class="lab">Critères mineurs</div><p>Myopéricardite, immunodépression, traumatisme, anticoagulant oral.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. Les critères eux-mêmes sont ceux de l’<a href="https://doi.org/10.1093/eurheartj/ehv318" target="_blank" rel="noopener">ESC 2015</a>, repris dans leur principe par l’<a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a>. Un seul critère justifie l’hospitalisation.</p>
<div class="lab">Pourquoi ces critères</div><p>Les critères majeurs ont été validés en analyse multivariée dans une cohorte prospective (<a href="https://pubmed.ncbi.nlm.nih.gov/17502574/" target="_blank" rel="noopener">Imazio et al., 2007</a>) et figurent au tableau 16 de l’ESC 2025. Ce sont des marqueurs d’une cause non virale ou d’une complication, non des causes. <b>Fièvre &gt; 38 °C</b> (rapport de risque 3,56) : une réponse systémique forte oriente vers une infection bactérienne, une tuberculose ou une maladie systémique. <b>Installation subaiguë</b> (3,97) : une évolution sur des semaines est inhabituelle pour un virus et fréquente dans la tuberculose et le cancer. <b>Épanchement abondant ou tamponnade</b> (2,15) : les causes spécifiques produisent plus souvent des épanchements abondants, et le patient se trouve déjà sur la partie raide de la courbe pression-volume. <b>Absence de réponse</b> après une semaine d’aspirine ou d’AINS (2,50) : une péricardite virale répond en général vite ; la résistance fait soupçonner une autre cause.</p>
<div class="lab">Pourquoi les critères mineurs</div><p>La myopéricardite signale une atteinte du myocarde, avec un risque d’arythmie et de dysfonction. L’immunodépression expose aux germes bactériens, fongiques ou tuberculeux. Le traumatisme et l’anticoagulant oral exposent à l’hémopéricarde.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">Recommandations de l’ESC 2025 sur les myocardites et les péricardites</a>, tableau 16 et section 7.2 ; <a href="https://pubmed.ncbi.nlm.nih.gov/17502574/" target="_blank" rel="noopener">Imazio et al., <i>Circulation</i> 2007</a>.</p>
</template>

<template data-pop="i30-effort" data-title="Activité physique après une péricardite">
<div class="lab"><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a></div><p>Restriction de l’effort jusqu’à la rémission et pendant au moins un mois, chez l’athlète comme chez le non-athlète (classe I, niveau C), puis durée individualisée selon la disparition des symptômes, la normalisation des marqueurs d’inflammation et, en cas d’atteinte myocardique, l’absence d’arythmie et de dysfonction ventriculaire.</p>
<div class="lab">Ancienne règle (<a href="https://doi.org/10.1093/eurheartj/ehv318" target="_blank" rel="noopener">ESC 2015</a>)</div><p>Non-sportif : restriction jusqu’à la disparition des symptômes et la normalisation de la protéine C réactive, de l’ECG et de l’échocardiographie. Sportif de compétition : au moins 3 mois.</p>
<div class="lab"><a href="https://doi.org/10.1093/eurheartj/ehaa605" target="_blank" rel="noopener">ESC 2020</a> sur la cardiologie du sport, endossée par la Société suisse de cardiologie</div><p>Reprise de toutes les formes d’exercice, y compris la compétition, recommandée après 30 jours à 3 mois chez la personne complètement guérie d’une péricardite aiguë, selon la gravité clinique ; pas de sport de loisir ni de compétition tant que l’inflammation est active ; pas d’effort d’intensité modérée à élevée dans la péricardite constrictive. L’ESC 2025, plus récente, recommande la restriction jusqu’à la rémission et pendant au moins un mois (classe I, niveau C) : les deux textes concordent sur le minimum d’un mois, et l’ESC 2025 s’applique comme source la plus récente.</p>
<div class="lab">Consensus américain</div><p>Le consensus de l’<a href="https://doi.org/10.1016/j.jacc.2025.05.023" target="_blank" rel="noopener">ACC (2025)</a> retient lui aussi au moins un mois de restriction, jusqu’à la rémission clinique, et limite la fréquence cardiaque d’effort à moins de 100/min pendant cette période. Cette convergence ne modifie pas la règle européenne, qui reste celle de l’ESC 2025.</p>
<div class="lab">Pourquoi</div><p>L’effort augmente la fréquence et le frottement des feuillets, et il est associé aux récidives. Dans la myopéricardite, il expose aux arythmies.</p></template>
