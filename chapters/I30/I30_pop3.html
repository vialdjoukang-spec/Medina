
<!-- ===== FENÊTRES I30 : examens et gestes ===== -->
<template data-pop="i30-ecg-stades" data-title="Stades de l’ECG de la péricardite (Spodick)">
<div class="lab">Stade I — heures à jours</div><p>Sus-décalage ST concave vers le haut, de 1 à 4 mm, dans la plupart des dérivations (DI, DII, aVL, aVF, V2 à V6) ; sous-décalage ST en aVR et parfois V1. Sous-décalage du PR, sus-décalage du PR en aVR.</p>
<div class="lab">Stade II — fin de la première semaine</div><p>Retour du segment ST à la ligne de base, avec des ondes T qui s’aplatissent. Le PR peut rester sous-décalé.</p>
<div class="lab">Stade III — semaines suivantes</div><p>Inversion diffuse des ondes T, sans onde Q.</p>
<div class="lab">Stade IV — semaines à mois</div><p>Normalisation. La persistance d’ondes T négatives au-delà de plusieurs mois évoque une forme chronique ou tuberculeuse.</p>
<div class="lab">Pièges</div><p>Tous les stades ne sont pas observés : le traitement précoce les raccourcit. Un tracé au stade II peut paraître normal. Un stade III isolé peut être pris pour une ischémie : l’absence d’onde Q, la diffusion et l’histoire récente orientent.</p>
<div class="lab">Mécanisme des stades</div><p>Au stade I, la dérivation aVR, orientée vers la cavité ventriculaire, voit le courant de lésion sous-épicardique en négatif : le ST y est sous-décalé et le PR sus-décalé. Le sous-décalage du PR, souvent le signe le plus précoce, est attribué à la même lésion au niveau des oreillettes. L’inversion des ondes T apparaît après le retour du ST à la ligne de base, quand la repolarisation du sous-épicarde reste perturbée. Un sous-décalage du ST ou une inversion des ondes T dès la phase aiguë, plus rares que dans l’ischémie, pourraient refléter l’étendue de l’atteinte myocardique.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">Recommandations de l’ESC 2025 sur les myocardites et les péricardites</a>, sections 4.4.1 et 5.1 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35523541/" target="_blank" rel="noopener">Imazio et al., <i>Heart</i> 2022</a>.</p>
</template>

<template data-pop="i30-ecg-dd" data-title="ECG : péricardite, infarctus ou repolarisation précoce">

<tr><td>Forme de ST</td><td>Concave</td><td>Convexe ou rectiligne</td><td>Concave, point J crocheté</td></tr>
<tr><td>Miroir</td><td>Absent (sauf aVR et V1)</td><td>Présent</td><td>Absent</td></tr>
<tr><td>Segment PR</td><td>Sous-décalé ; sus-décalé en aVR</td><td>Normal</td><td>Normal</td></tr>
<tr><td>Onde Q</td><td>Absente</td><td>Apparaît en heures</td><td>Absente</td></tr>
<tr><td>Évolution</td><td>Stades en jours ; T inversées après retour de ST</td><td>T inversées alors que ST est encore sus-décalé</td><td>Stable sur des années</td></tr>
<tr><td>Rapport ST/T en V6</td><td>&gt; 0,25</td><td>—</td><td>&lt; 0,25</td></tr></table>
<div class="lab">Règle</div><p>En cas de doute avec une douleur thoracique, l’échocardiographie au lit cherche un trouble de la cinétique segmentaire ; si le doute persiste, la coronarographie tranche.</p></template>

<template data-pop="i30-spodick" data-title="Signe de Spodick">
<p>Pente descendante du segment TP (entre la fin de l’onde T et le début de l’onde P suivante), surtout visible en DII et dans les précordiales latérales.</p>
<div class="lab">Valeur</div><p>Présent dans une partie des péricardites aiguës, rare dans l’infarctus. C’est un argument d’appoint, non un critère diagnostique.</p>
<div class="lab">Piège</div><p>Le segment TP sert de ligne de base pour mesurer le sus-décalage ST ; s’il est incliné, mesurer depuis le segment PR peut aussi être faussé par le sous-décalage du PR.</p></template>

<template data-pop="i30-echo-peric" data-title="Échocardiographie dans les maladies péricardiques">
<div class="lab">Question clinique</div><p>Y a-t-il un épanchement, de quelle taille, comprime-t-il, et existe-t-il une physiologie constrictive ou une atteinte myocardique ?</p>
<div class="lab">Incidences</div><p>Sous-costale (la plus utile au lit et pour guider la ponction), parasternale grand axe (distinguer l’épanchement péricardique, en avant de l’aorte descendante, d’un épanchement pleural, en arrière), apicale quatre cavités (collapsus, flux mitral et tricuspide).</p>
<div class="lab">Mesures</div><p>Lame liquidienne maximale en fin de diastole ; répartition ; collapsus des cavités droites ; veine cave inférieure ; variations respiratoires des flux (enregistrées avec un capteur respiratoire) ; mouvement septal ; vitesses tissulaires e′ ; veines sus-hépatiques ; fonction ventriculaire.</p>
<div class="lab">Limites</div><p>Épanchements localisés postopératoires mal vus (l’échocardiographie transœsophagienne ou le scanner les montrent) ; épaississement péricardique mal quantifié ; graisse épicardique confondue avec un liquide.</p>
<div class="lab">Sécurité</div><p>Non irradiante, répétable au lit : c’est l’examen de référence de première ligne.</p></template>

<template data-pop="i30-quant" data-title="Quantification d’un épanchement péricardique">
<div class="lab">Méthode</div><p>Mesurer la plus grande distance entre les deux feuillets en fin de diastole, sur plusieurs incidences. Préciser l’emplacement : un épanchement localisé de 20 mm devant l’oreillette droite n’a pas la même portée qu’un épanchement circonférentiel.</p>
<div class="lab">Grades (<a href="https://doi.org/10.1093/eurheartj/ehv318" target="_blank" rel="noopener">ESC 2015</a>, repris au tableau 10 de l’<a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a>)</div><p>Faible &lt; 10 mm ; modéré 10–20 mm ; abondant &gt; 20 mm. La taille estime la probabilité d’une cause non idiopathique et le risque de complication, car les épanchements modérés ou abondants relèvent plus souvent d’une cause spécifique.</p>
<div class="lab">Exemple</div><p>Lame de 12 mm en arrière du ventricule gauche et de 6 mm en avant du ventricule droit : épanchement modéré, circonférentiel, prédominant en arrière.</p>
<div class="lab">Piège</div><p>La taille ne dit rien du retentissement : un épanchement modéré aigu peut comprimer, un épanchement abondant chronique peut être bien toléré.</p></template>

<template data-pop="i30-echo-tamp" data-title="Signes échographiques de tamponnade">
<div class="lab">Collapsus de l’oreillette droite</div><p>En fin de diastole et au début de la systole, quand la pression auriculaire est la plus basse. Un collapsus durant plus d’un tiers du cycle est très évocateur.</p>
<div class="lab">Collapsus du ventricule droit</div><p>En protodiastole, paroi libre ou infundibulum : plus spécifique, un peu plus tardif. Il peut manquer si le ventricule droit est hypertrophié ou si sa pression est élevée (hypertension pulmonaire).</p>
<div class="lab">Veine cave inférieure</div><p>Dilatée (&gt; 21 mm) et peu collapsible (&lt; 50 %) : présente dans la grande majorité des tamponnades ; son absence rend le diagnostic peu probable.</p>
<div class="lab">Variations respiratoires</div><p>Flux mitral E : baisse inspiratoire &gt; 25 % ; flux tricuspide : hausse inspiratoire &gt; 40 %. Déplacement septal inspiratoire vers la gauche.</p>
<div class="lab">Autres</div><p>Balancement du cœur dans un épanchement abondant (support de l’alternance électrique). Collapsus de l’oreillette gauche dans les épanchements postérieurs localisés.</p>
<div class="lab">Règle</div><p>Le diagnostic de tamponnade reste clinique ; l’échocardiographie le confirme, guide la ponction et vérifie son efficacité.</p>
<div class="lab">Pourquoi cette hiérarchie</div><p>L’oreillette droite cède dès que la pression péricardique dépasse sa pression, la plus basse du cœur en fin de diastole : un collapsus bref apparaît tôt mais se voit aussi sans tamponnade, et c’est sa durée, au-delà d’un tiers du cycle, qui le rend spécifique. Le ventricule droit, à paroi plus épaisse et à pression diastolique plus haute, ne se collabe que lorsque la compression est plus avancée : le signe est plus spécifique, mais il manque souvent. La veine cave dilatée traduit une pression auriculaire droite élevée, commune à presque toute tamponnade mais aussi à l’insuffisance cardiaque droite : le signe est sensible et peu spécifique.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">Recommandations de l’ESC 2025 sur les myocardites et les péricardites</a>, section 11.8.2 et tableau 17 ; <a href="https://pubmed.ncbi.nlm.nih.gov/6861307/" target="_blank" rel="noopener">Gillam et al., <i>Circulation</i> 1983</a>.</p>
</template>

<template data-pop="i30-echo-constr" data-title="Signes échographiques de constriction (Mayo Clinic)">
<div class="lab">Trois critères</div><p>1. <b>Bascule septale</b> liée à la respiration (déplacement inspiratoire vers la gauche). 2. <b>Vitesse e′ septale ≥ 9 cm/s</b> : le myocarde est sain et l’anneau médial se déplace librement. 3. <b>Reflux diastolique expiratoire des veines sus-hépatiques</b> : rapport reflux/flux antérograde ≥ 0,79.</p>
<div class="lab">Performance</div><p>Dans l’étude de Welch (2014), la bascule septale associée à l’un des deux autres critères avait une sensibilité de 87 % et une spécificité de 91 %.</p>
<div class="lab">Autres signes</div><p>Annulus reversus (e′ septale &gt; e′ latérale) ; baisse inspiratoire du flux mitral E ≥ 25 % ; veine cave inférieure pléthorique ; péricarde épais et brillant ; oreillettes peu dilatées.</p>
<div class="lab">Pièges</div><p>Les variations respiratoires sont atténuées en fibrillation auriculaire, sous ventilation mécanique et en cas de pressions auriculaires très élevées ; une manœuvre de réduction de la précharge (position assise) peut les démasquer. La BPCO donne aussi des variations respiratoires marquées, mais avec un flux veineux cave différent.</p></template>

<template data-pop="i30-irm-peric" data-title="IRM cardiaque du péricarde">
<div class="lab">Question clinique</div><p>Le péricarde est-il enflammé, épaissi, et le myocarde est-il atteint ?</p>
<div class="lab">Séquences</div><p>Ciné (épanchement, mouvement septal) ; ciné en temps réel en respiration libre (bascule septale inspiratoire de la constriction) ; séquences pondérées T2 (œdème) ; cartographies T1 et T2 (atteinte myocardique) ; rehaussement tardif au gadolinium (inflammation du péricarde, fibrose myocardique).</p>
<div class="lab">Interprétation</div><p>Péricarde normal : fin, sans rehaussement. Péricardite active : péricarde épaissi, rehaussement tardif net, œdème. Constriction chronique fibreuse : épaississement sans rehaussement. Constriction transitoire : rehaussement intense, qui prédit la réponse aux anti-inflammatoires.</p>
<div class="lab">Limites</div><p>Calcifications mal vues (scanner préférable) ; arythmie ; dispositifs non compatibles ; gadolinium macrocyclique à la plus petite dose utile si DFG &lt; 30 mL/min/1,73 m².</p></template>

<template data-pop="i30-cath" data-title="Cathétérisme dans la constriction">
<div class="lab">Technique</div><p>Enregistrement simultané des pressions ventriculaires droite et gauche avec des capteurs de haute fidélité, sur plusieurs cycles respiratoires, en respiration spontanée.</p>
<div class="lab">Signes classiques</div><p>Égalisation des pressions télédiastoliques (écart ≤ 5 mmHg) ; aspect en « racine carrée » (dip-plateau) ; pression télédiastolique du ventricule droit supérieure au tiers de sa pression systolique ; pression artérielle pulmonaire systolique &lt; 55 mmHg.</p>
<div class="lab">Signe le plus performant</div><p>Discordance des pressions systoliques en inspiration : la systolique gauche baisse pendant que la droite monte. L’indice de surface systolique (rapport des aires sous les courbes en inspiration et en expiration) supérieur à 1,1 avait une sensibilité de 97 % et une spécificité de 100 % dans l’étude de Talreja (2008).</p>
<div class="lab">Piège</div><p>L’égalisation et le dip-plateau existent aussi dans la cardiomyopathie restrictive : seule la discordance respiratoire est discriminante. Une hypovolémie (sous diurétiques) peut masquer les signes ; un remplissage rapide peut les révéler.</p></template>

<template data-pop="i30-ponction" data-title="Péricardiocentèse">
<div class="lab">Indications</div><p>Tamponnade ; suspicion de péricardite purulente, tuberculeuse ou néoplasique ; épanchement abondant symptomatique résistant au traitement médical.</p>
<div class="lab">Technique</div><p>Sous guidage échographique ou fluoroscopique, en salle de cathétérisme ou au lit en urgence. Voie sous-xiphoïdienne (aiguille dirigée vers l’épaule gauche) ou apicale, selon l’emplacement du liquide. Mise en place d’un drain en queue de cochon, laissé jusqu’à un débit inférieur à 30 mL par 24 heures, ce qui réduit les récidives.</p>
<div class="lab">Complications</div><p>Ponction ou lacération du ventricule droit, d’une artère coronaire ou de l’artère thoracique interne ; pneumothorax ; arythmies ; infection ; syndrome de décompression. Elles surviennent dans 4 à 10 % des cas ; leur fréquence dépend de la surveillance par l’imagerie, de l’expérience de l’opérateur et du degré d’urgence.</p>
<div class="lab">Contre-indications</div><p>Dissection aortique (chirurgie) ; rupture de paroi libre après infarctus (chirurgie). Relatives : coagulopathie non corrigée, anticoagulation, thrombopénie &lt; 50 G/L, épanchement faible, postérieur ou cloisonné.</p>
<div class="lab">Analyses du liquide</div><p>Aspect, cellules et formule, glucose, protéines, cytologie ; selon la suspicion : Gram et cultures, adénosine désaminase, interféron gamma, amplification génique et culture de mycobactéries, marqueurs tumoraux, triglycérides.</p>
<div class="lab">Ce que le liquide prouve</div><p>La preuve d’une atteinte maligne vient de la cytologie ou de la biopsie, et celle d’une tuberculose de la mise en évidence du bacille par culture ou amplification génique. Un liquide lymphocytaire avec interféron gamma non stimulé ou adénosine désaminase élevés n’établit qu’un diagnostic probable, dont la valeur dépend de la fréquence locale de la maladie. Un liquide riche en polynucléaires et pauvre en glucose, que bactéries et polynucléaires consomment, oriente vers une péricardite purulente et impose un drainage complet. Les critères de Light, conçus pour la plèvre, classeraient presque tout liquide péricardique en exsudat, car le liquide normal est déjà riche en cellules mésothéliales, en protéines et en lactate déshydrogénase.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">Recommandations de l’ESC 2025 sur les myocardites et les péricardites</a>, sections 11.1.2, 11.2.2, 11.5.2 et 11.7.3.</p>
</template>

<template data-pop="i30-fenetre" data-title="Fenêtre péricardique et péricardiotomie percutanée">
<div class="lab">Fenêtre chirurgicale</div><p>Résection d’une partie du péricarde, par voie sous-xiphoïdienne ou par thoracoscopie, pour drainer le liquide vers la cavité péritonéale ou pleurale. Elle permet aussi une biopsie.</p>
<div class="lab">Péricardiotomie percutanée au ballonnet</div><p>Dilatation du péricarde pariétal au ballonnet par voie percutanée, créant une communication avec la plèvre. Option chez le patient cancéreux fragile.</p>
<div class="lab">Indications</div><p>Récidive d’un épanchement abondant après drainage, surtout néoplasique ; épanchement cloisonné ou purulent ; besoin d’une biopsie.</p></template>

<template data-pop="i30-triage" data-title="Score de triage de la tamponnade (ESC 2014)">
<div class="lab">Principe</div><p>Document de position du groupe de travail de l’ESC sur le myocarde et le péricarde (2014). Le score additionne des points dans trois domaines : l’étiologie (cause maligne, tuberculose, épanchement purulent récent…), la présentation clinique (dyspnée, tachycardie, pouls paradoxal, orthopnée, détérioration rapide) et l’imagerie (taille, collapsus, veine cave, variation des flux).</p>
<div class="lab">Lecture</div><p>Un score ≥ 6 justifie une péricardiocentèse urgente. Un score plus bas autorise, chez un patient stable, un drainage différé de 12 à 48 heures, dans de meilleures conditions (correction de la coagulation, opérateur entraîné).</p>
<div class="lab"><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a></div><p>La figure 12 de l’ESC 2025 intègre ces critères, établis par consensus d’experts : un total élevé, issu d’au moins deux domaines, conduit à la ponction immédiate. Le seuil diffère selon le passage, « ≥ 6 » dans la figure et « plus de 6 » dans le texte et la légende ; un total d’exactement 6 points se juge donc sur l’ensemble du tableau clinique. Un total plus bas permet, chez le patient stable, de différer le geste sous traitement anti-inflammatoire empirique, puis de suivre l’évolution.</p>
<div class="lab">Limite</div><p>Outil d’aide à la décision, non critère officiel.</p></template>

<template data-pop="i30-lowpress" data-title="Tamponnade à basse pression">
<div class="lab">Définition</div><p>Tamponnade survenant avec une pression intrapéricardique modérée, parce que la pression de remplissage est basse : hypovolémie par hémorragie, diurétiques, déshydratation, ultrafiltration en dialyse.</p>
<div class="lab">Clinique</div><p>Tachycardie, hypotension, faiblesse, sans turgescence jugulaire ni pouls paradoxal marqué.</p>
<div class="lab">Conduite</div><p>L’échocardiographie montre le collapsus. Un remplissage prudent améliore transitoirement l’hémodynamique ; le drainage est ensuite discuté.</p></template>

<template data-pop="i30-decomp" data-title="Syndrome de décompression péricardique">
<div class="lab">Définition</div><p>Dysfonction ventriculaire gauche ou droite aiguë, parfois avec œdème pulmonaire ou choc, survenant dans les heures qui suivent le drainage d’un épanchement abondant, surtout chronique.</p>
<div class="lab">Mécanismes proposés</div><p>Brusque augmentation du retour veineux vers un ventricule droit adapté à la compression ; déséquilibre entre le retour veineux et un ventricule gauche dont l’adaptation sympathique cesse brutalement.</p>
<div class="lab">Prévention</div><p>Les épanchements chroniques très abondants sont drainés par étapes : l’<a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a> conseille de ne pas retirer plus de 500 mL environ en une fois, puis de laisser le drain évacuer le reste. L’hémodynamique et l’échocardiographie sont surveillées après le geste.</p></template>

<template data-pop="i30-transit" data-title="Constriction transitoire">
<div class="lab">Définition</div><p>Physiologie constrictive liée à un péricarde inflammatoire et épaissi, sans fibrose fixée, qui régresse sous traitement anti-inflammatoire.</p>
<div class="lab">Contexte</div><p>Péricardite récente, chirurgie cardiaque, maladie systémique ; protéine C réactive élevée ; rehaussement intense du péricarde à l’IRM.</p>
<div class="lab">Conduite</div><p>Le traitement de la péricardite est poursuivi 3 à 6 mois (aspirine ou AINS avec colchicine, corticoïde si nécessaire), puis l’échocardiographie et l’IRM sont répétées avant de discuter une chirurgie. Une constriction transitoire complique environ 10 % des péricardites et régresse sous traitement dans plus de la moitié des cas, parce que l’épaississement est encore inflammatoire et non fibreux.</p></template>

<template data-pop="i30-effconst" data-title="Péricardite effusivo-constrictive">
<div class="lab">Définition</div><p>Association d’un épanchement sous tension et d’un feuillet viscéral épaissi et rigide.</p>
<div class="lab">Diagnostic</div><p>Après une péricardiocentèse qui normalise la pression intrapéricardique, la pression de l’oreillette droite ne baisse pas de 50 % ou ne descend pas sous 10 mmHg. Les signes de constriction apparaissent une fois le liquide évacué.</p>
<div class="lab">Causes et traitement</div><p>Idiopathique, tuberculose, radiothérapie, néoplasie, chirurgie. Traitement de la cause et anti-inflammatoire ; péricardectomie viscérale et pariétale si la constriction persiste.</p></template>

<template data-pop="i30-pericardectomie" data-title="Péricardectomie">
<div class="lab">Principe</div><p>Résection radicale du péricarde par sternotomie, au-delà de la seule face antérieure comprise entre les deux nerfs phréniques ; en cas de constriction, décortication de l’épicarde si nécessaire.</p>
<div class="lab">Indication</div><p>Constriction chronique symptomatique (NYHA III–IV notamment), sans inflammation active, après exclusion d’une forme transitoire. La chirurgie est moins bénéfique dans les stades très avancés, la cachexie cardiaque, l’atteinte myocardique associée et la constriction radique.</p>
<div class="lab">Résultats</div><p>La mortalité opératoire est classiquement de 6 à 10 %. Elle dépend de la cause et des comorbidités : moins de 1,5 % dans les formes idiopathiques, davantage après irradiation, où le myocarde est souvent atteint lui aussi. Une chirurgie précoce, dans les 6 mois suivant les symptômes, et un centre à fort volume donnent la mortalité la plus basse ; l’<a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a> réserve donc le geste aux centres experts.</p>
<div class="lab">Geste associé</div><p>Traitement d’une insuffisance tricuspide sévère, recommandé par l’ESC 2025 pour améliorer les symptômes et la survie.</p>
<div class="lab">Pourquoi une résection complète</div><p>Une résection partielle, antérieure ou limitée à la zone comprise entre les nerfs phréniques, laisse du tissu constrictif, en particulier en arrière, et expose à la persistance ou à la récidive des symptômes. L’ESC 2025 recommande donc la péricardectomie complète, avec circulation extracorporelle si des adhérences denses, des calcifications postérieures ou une instabilité l’exigent. Dans la forme effusivo-constrictive qui résiste au traitement, le feuillet viscéral, responsable de la constriction, doit lui aussi être réséqué.</p>
<div class="lab">Contre-indications et limites</div><p>Une cirrhose avec ascite et insuffisance hépatique sévère, une infection non contrôlée ou une maladie qui limite l’espérance de vie contre-indiquent le geste. Lorsqu’une atteinte myocardique associée ou une physiologie mixte, constrictive et restrictive, prive la résection de bénéfice, ou que des calcifications étendues la rendent impossible, la transplantation cardiaque peut se discuter à titre exceptionnel.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">Recommandations de l’ESC 2025 sur les myocardites et les péricardites</a>, sections 6.4.2.3, 11.9.4 et 11.10.5.</p>

<div class="lab">Radiographie thoracique</div><p>Elle cherche un diagnostic concurrent ou une cause : pneumonie, épanchement pleural, masse médiastinale, séquelle tuberculeuse. Une silhouette cardiaque élargie avec des champs pulmonaires clairs fait évoquer un épanchement péricardique plutôt qu’une insuffisance cardiaque gauche.</p>
<div class="lab">Protéine C réactive</div><p>Élevée dans environ 80 % des cas, elle soutient le diagnostic, mesure l’activité de la maladie et fixe la durée de la dose d’attaque ; ses usages sont détaillés dans la fiche <button class="w" data-k="i30-crp">protéine C réactive</button>.</p>
<div class="lab">Hémogramme</div><p>Une hyperleucocytose à polynucléaires accompagne la forme inflammatoire. Une leucocytose marquée avec fièvre élevée fait craindre une péricardite purulente. Une lymphopénie oriente vers une maladie auto-immune, une infection par le VIH ou une hémopathie. L’hémogramme sert aussi de référence avant la colchicine, dont la toxicité peut être médullaire.</p>
<div class="lab">Troponine</div><p>Elle reflète la nécrose de cardiomyocytes. Normale, elle est compatible avec une péricardite pure. Élevée, dans 20 à 30 % des cas, elle signale une atteinte myocardique associée : elle impose de chercher une dysfonction ventriculaire, conduit à l’hospitalisation et rend la restriction sportive plus prudente. Associée à un trouble de la cinétique segmentaire, elle fait discuter une coronarographie.</p>
<div class="lab">Créatinine</div><p>La fonction rénale fixe la dose des AINS et de la colchicine, réduite dans l’insuffisance rénale sévère. Une urémie avancée est elle-même une cause de péricardite, traitée par la dialyse.</p>
<div class="lab">Autres dosages de base</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a> ajoute la TSH, qui cherche une hypothyroïdie, cause d’épanchement abondant ; les tests hépatiques, référence pour surveiller la tolérance de la colchicine ; le NT-proBNP, élevé quand le myocarde est atteint avec insuffisance cardiaque, normal ou peu élevé dans la constriction isolée.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">Recommandations de l’ESC 2025 sur les myocardites et les péricardites</a>, sections 3.3.2, 4.4.1, 4.5.5 et 7.2, tableaux 9 et 13.</p></template>
