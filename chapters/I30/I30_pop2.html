
<!-- ===== FENÊTRES I30 : anamnèse et examen ===== -->
<template data-pop="i30-atcd-viral" data-title="Infection récente">
<div class="lab">Comment le rechercher</div><p>« Avez-vous eu, dans les trois dernières semaines, un rhume, un mal de gorge, une grippe, une diarrhée, de la fièvre ? » Préciser la date : la péricardite suit l’infection de une à trois semaines en général.</p>
<div class="lab">Pourquoi</div><p>Un épisode infectieux récent oriente vers une forme virale ou idiopathique, à faible risque si aucun critère de gravité n’est présent. Il dispense des sérologies virales, qui ne modifient pas le traitement.</p>
<div class="lab">Limite</div><p>L’absence d’infection rapportée n’exclut pas une cause virale, souvent paucisymptomatique.</p></template>

<template data-pop="i30-atcd-tb" data-title="Tuberculose et exposition">
<div class="lab">Questions</div><p>Origine ou séjour prolongé en zone d’endémie (Afrique subsaharienne, Asie, Europe de l’Est) ; contact avec un tuberculeux ; antécédent de tuberculose traitée ou non ; infection par le VIH ; traitement immunosuppresseur (anti-facteur de nécrose tumorale) ; détention, précarité.</p>
<div class="lab">Pourquoi</div><p>La tuberculose est la première cause mondiale de péricardite et de constriction. Sa méconnaissance conduit à des corticoïdes sans antituberculeux. Le corticoïde affaiblit l’immunité cellulaire qui contient la mycobactérie et favorise la dissémination ; l’infection non traitée évolue vers la constriction, qui survenait chez jusqu’à 50 % des patients dans les 6 mois avant les antituberculeux efficaces.</p>
<div class="lab">Conséquence</div><p>Toute exposition, associée à une forme subaiguë ou à un épanchement abondant, impose un bilan tuberculeux ciblé avant tout corticoïde.</p></template>

<template data-pop="i30-atcd-cancer" data-title="Cancer et radiothérapie thoracique">
<div class="lab">Questions</div><p>Cancer connu, en particulier du poumon, du sein, lymphome, mélanome ; traitement en cours ; radiothérapie médiastinale ou mammaire gauche, date et dose ; symptômes généraux récents.</p>
<div class="lab">Pourquoi</div><p>L’épanchement néoplasique est la première cause de tamponnade (<a href="https://doi.org/10.1093/eurheartj/ehaf192" target="_blank" rel="noopener">ESC 2025</a>, tableau 8). La radiothérapie cause des péricardites aiguës pendant le traitement et des constrictions des années plus tard (maladie de Hodgkin traitée dans la jeunesse, par exemple).</p>
<div class="lab">Piège</div><p>Chez un patient cancéreux, un épanchement n’est pas toujours néoplasique : il peut être radique, médicamenteux ou infectieux. La cytologie tranche.</p></template>

<template data-pop="i30-atcd-chir" data-title="Infarctus, chirurgie ou geste cardiaque récents">
<div class="lab">Questions</div><p>Infarctus récent (date, reperfusion) ; chirurgie cardiaque ; ablation, implantation de stimulateur ou de défibrillateur, fermeture percutanée, cathétérisme ; traumatisme thoracique.</p>
<div class="lab">Pourquoi</div><p>Ces événements causent des syndromes post-lésionnels, de quelques jours à quelques semaines après la lésion ; ce délai plaide pour une réaction immunitaire, déclenchée par le sang dans le péricarde ou l’ouverture de la plèvre. Ils modifient le traitement (aspirine après infarctus) et font rechercher une complication mécanique : perforation, rupture subaiguë, hémopéricarde sous anticoagulant.</p></template>

<template data-pop="i30-atcd-rein" data-title="Insuffisance rénale avancée et dialyse">
<div class="lab">Questions</div><p>Stade de la maladie rénale ; date de début de la dialyse ; adéquation des séances ; séances écourtées ou manquées ; héparine pendant les séances.</p>
<div class="lab">Pourquoi</div><p>L’urémie est une cause spécifique, traitée par l’intensification de la dialyse. Des séances écourtées ou manquées orientent vers une épuration insuffisante. L’héparine des séances expose à un épanchement hémorragique. Une ultrafiltration importante peut créer une hypovolémie qui démasque une tamponnade à basse pression.</p></template>

<template data-pop="i30-atcd-auto" data-title="Maladie systémique, fièvres familiales, médicaments">
<div class="lab">Questions</div><p>Arthralgies, photosensibilité, syndrome sec, phénomène de Raynaud, aphtes, éruptions ; fièvres récurrentes personnelles ou familiales, douleurs abdominales épisodiques ; médicaments récents (hydralazine, isoniazide, minoxidil, immunothérapie anticancéreuse) ; vaccination récente.</p>
<div class="lab">Pourquoi</div><p>Une maladie systémique ou auto-inflammatoire explique une partie des récidives et exige un traitement propre. Un médicament inducteur doit être arrêté.</p></template>

<template data-pop="i30-s-douleur" data-title="Douleur thoracique péricarditique">
<div class="lab">Fréquence</div><p>Présente dans plus de 85 à 90 % des péricardites aiguës ; souvent absente dans les épanchements chroniques, la péricardite urémique et la constriction.</p>
<div class="lab">Caractériser</div><p><b>Siège</b> : rétrosternal ou précordial gauche. <b>Type</b> : aiguë, en coup de poignard, parfois sourde. <b>Irradiation</b> : bord supérieur du trapèze, cou, épaule gauche. <b>Facteurs aggravants</b> : inspiration profonde, toux, décubitus dorsal, déglutition. <b>Facteur soulageant</b> : position assise penchée en avant. <b>Durée</b> : continue pendant des heures ou des jours, et non par crises de quelques minutes. <b>Effort</b> : pas de lien direct.</p>
<div class="lab">Physiopathologie</div><p>Le feuillet pariétal inflammatoire, innervé par les nerfs phréniques, est étiré ou frotté par l’inspiration et le décubitus. Penché en avant, le cœur s’éloigne de la paroi postérieure et diminue le contact.</p>
<div class="lab">Différentiel</div><p>Ischémie : oppressive, liée à l’effort, non positionnelle, irradiant vers le bras ou la mâchoire. Embolie pulmonaire : pleurale, latérale, avec dyspnée et hypoxémie. Dissection : déchirante, maximale d’emblée, migratrice.</p></template>

<template data-pop="i30-s-fievre" data-title="Fièvre">
<div class="lab">Caractériser</div><p>Hauteur (seuil de 38 °C), début par rapport à la douleur, frissons, courbe (continue, vespérale, récurrente), sueurs nocturnes, antipyrétiques déjà pris.</p>
<div class="lab">Valeur d’orientation</div><p>Fébricule inférieure à 38 °C : fréquente dans la péricardite virale ou idiopathique. Fièvre &gt; 38 °C : critère majeur de haut risque. Fièvre élevée avec frissons et état septique : péricardite purulente. Fièvre vespérale prolongée avec sueurs nocturnes : tuberculose. Accès fébriles récurrents de 1 à 3 jours : maladie auto-inflammatoire.</p>
<div class="lab">Physiopathologie</div><p>L’interleukine 1 agit sur l’hypothalamus par l’intermédiaire des prostaglandines de la série E ; c’est aussi pourquoi les AINS la font baisser rapidement dans la forme virale.</p></template>

<template data-pop="i30-s-dyspnee" data-title="Dyspnée d’origine péricardique">
<div class="lab">Caractériser</div><p><b>Vitesse d’installation</b> : heures (hémopéricarde), jours ou semaines (épanchement), mois (constriction). <b>Position</b> : la dyspnée de l’épanchement abondant est souvent soulagée en position assise penchée en avant, et non par l’élévation des oreillers comme dans l’insuffisance cardiaque gauche. <b>Signes associés</b> : lipothymies, oligurie, sueurs orientent vers une tamponnade.</p>
<div class="lab">Physiopathologie</div><p>Dans la péricardite sèche, la douleur limite l’inspiration : la respiration est superficielle et rapide. Dans l’épanchement abondant, le débit cardiaque baisse et le poumon gauche est comprimé. Dans la constriction, la dyspnée d’effort traduit l’incapacité à augmenter le remplissage et le débit.</p>
<div class="lab">Piège</div><p>L’absence de crépitants, les poumons clairs à la radiographie et une dyspnée marquée chez un patient à gros cœur doivent faire penser à l’épanchement, et non à l’insuffisance cardiaque gauche.</p></template>

<template data-pop="i30-s-compress" data-title="Signes de compression des organes voisins">
<div class="lab">Caractériser</div><p><b>Dysphagie</b> : compression de l’œsophage par un épanchement postérieur abondant. <b>Hoquet</b> persistant : irritation du nerf phrénique. <b>Dysphonie</b> : compression du nerf laryngé récurrent gauche. <b>Toux sèche</b> : compression bronchique ou trachéale. <b>Nausées, douleur de l’hypochondre droit</b> : congestion hépatique.</p>
<div class="lab">Valeur</div><p>Ces signes témoignent d’un épanchement volumineux, en général constitué lentement. Ils orientent vers une cause néoplasique, tuberculeuse ou hypothyroïdienne, et justifient une échocardiographie rapide.</p></template>

<template data-pop="i30-s-oedeme" data-title="Œdèmes et ascite de la constriction">
<div class="lab">Caractériser</div><p>Ordre d’apparition (l’ascite précède souvent les œdèmes), prise de poids, augmentation du périmètre abdominal, satiété précoce, fatigue ; évolution sur des mois ; absence d’orthopnée marquée.</p>
<div class="lab">Physiopathologie</div><p>La pression veineuse systémique est élevée en permanence. Le foie et le péritoine sont exposés de façon précoce et prolongée ; la rétention hydrosodée, entretenue par le bas débit, aggrave la congestion.</p>
<div class="lab">Piège</div><p>Ce tableau fait évoquer une cirrhose. La turgescence jugulaire le différencie : elle est absente dans la cirrhose isolée, majeure dans la constriction. Examiner les jugulaires chez tout patient ascitique.</p></template>

<template data-pop="i30-s-asthenie" data-title="Asthénie, amaigrissement, sueurs nocturnes">
<div class="lab">Caractériser</div><p>Durée, perte de poids chiffrée en kilogrammes et en pourcentage, sueurs nocturnes mouillant les draps, anorexie, retentissement sur l’activité.</p>
<div class="lab">Valeur d’orientation</div><p>Ces signes généraux sont inhabituels dans la péricardite virale, qui évolue en jours. Leur présence oriente vers une tuberculose, une néoplasie, une maladie systémique ou une urémie. Dans la constriction, l’asthénie traduit le bas débit.</p></template>

<template data-pop="i30-v-vitaux" data-title="Signes vitaux dans les maladies péricardiques">
<div class="lab">Fréquence cardiaque</div><p>Tachycardie : fréquente dans la péricardite (douleur, fièvre), constante dans la tamponnade (mécanisme de compensation). Une tamponnade sans tachycardie est rare : hypothyroïdie, bêtabloquant, urémie.</p>
<div class="lab">Pression artérielle et pression différentielle</div><p>Hypotension et pression différentielle pincée : bas débit de tamponnade. Hypertension possible au début d’une tamponnade par stimulation adrénergique. Mesurer le pouls paradoxal au brassard.</p>
<div class="lab">Fréquence respiratoire et saturation</div><p>Polypnée superficielle de la douleur ; polypnée de la tamponnade ; saturation souvent conservée, sauf pathologie pulmonaire associée.</p>
<div class="lab">Température</div><p>Seuil de 38 °C : critère majeur de haut risque.</p></template>

<template data-pop="i30-e-frott" data-title="Frottement péricardique">
<div class="lab">Technique</div><p>Patient assis, penché en avant, en expiration forcée maintenue ; stéthoscope à membrane appuyé au bord gauche du sternum, 3e et 4e espaces intercostaux. Répéter l’examen, car le frottement est fugace.</p>
<div class="lab">Sémiologie</div><p>Bruit superficiel, sec, râpeux, proche de l’oreille, qui ne suit pas exactement les bruits du cœur. Il comporte jusqu’à trois composantes : systole auriculaire, systole ventriculaire, remplissage protodiastolique. Le frottement à trois temps est typique ; un frottement à un temps peut être confondu avec un souffle.</p>
<div class="lab">Valeur</div><p>Très spécifique, peu sensible : entendu dans un tiers des cas au plus. Il persiste en apnée, contrairement au frottement pleural.</p>
<div class="lab">Piège</div><p>Il peut coexister avec un épanchement abondant ; sa présence n’exclut donc pas une tamponnade.</p></template>

<template data-pop="i30-e-beck" data-title="Triade de Beck">
<div class="lab">Éléments</div><p>Hypotension artérielle ; turgescence jugulaire ; bruits du cœur assourdis.</p>
<div class="lab">Contexte</div><p>Décrite en 1935 par le chirurgien Claude Beck pour la tamponnade aiguë par plaie ou rupture. Elle est complète surtout dans l’hémopéricarde de constitution rapide.</p>
<div class="lab">Limite</div><p>Dans la tamponnade d’installation lente, la pression artérielle reste longtemps conservée par la vasoconstriction, et la triade est souvent incomplète. Son absence n’exclut pas la tamponnade.</p></template>

<template data-pop="i30-e-jug" data-title="Pression veineuse jugulaire : lecture des descentes x et y">
<div class="lab">Technique</div><p>Patient à 45° (ou assis si la pression est très élevée : sinon le sommet de la colonne est au-dessus de l’angle de la mâchoire et passe inaperçu). Observer la jugulaire interne droite en lumière tangentielle ; synchroniser avec le pouls carotidien.</p>
<div class="lab">Normal</div><p>Onde a (contraction auriculaire), descente x (relaxation auriculaire et descente du plancher auriculoventriculaire pendant la systole), onde v (remplissage auriculaire), descente y (ouverture de la tricuspide, remplissage ventriculaire rapide).</p>
<div class="lab">Tamponnade</div><p>Pression élevée ; descente x conservée ; <b>descente y absente</b> : le ventricule comprimé ne peut se remplir rapidement.</p>
<div class="lab">Constriction</div><p>Pression élevée ; <b>descente y rapide et profonde</b> (signe de Friedreich), suivie d’un plateau ; aspect en M ou en W ; signe de Kussmaul.</p>
<div class="lab">Aide pédagogique</div><p>« La tamponnade efface le y ; la constriction le creuse. » Moyen mnémotechnique, non critère officiel.</p></template>

<template data-pop="i30-e-ewart" data-title="Signe d’Ewart">
<p>Zone de matité, de souffle tubaire et d’égophonie sous la pointe de l’omoplate gauche, chez un patient qui a un épanchement péricardique abondant.</p>
<div class="lab">Mécanisme</div><p>Le sac distendu comprime le lobe inférieur gauche et produit une atélectasie.</p>
<div class="lab">Valeur</div><p>Rare et peu sensible, mais il explique qu’un épanchement péricardique soit pris pour une pneumonie ou un épanchement pleural gauche. L’échocardiographie corrige l’erreur.</p></template>

<template data-pop="i30-e-kuss" data-title="Signe de Kussmaul">
<div class="lab">Définition</div><p>Ascension, ou absence de baisse, de la pression veineuse jugulaire en inspiration, alors qu’elle baisse normalement.</p>
<div class="lab">Technique</div><p>Patient à 45°, respiration calme puis profonde ; observer le sommet de la colonne veineuse.</p>
<div class="lab">Mécanisme</div><p>Le retour veineux augmente en inspiration mais ne peut entrer dans un ventricule droit enfermé dans un péricarde rigide ; la pression monte dans les veines.</p>
<div class="lab">Causes</div><p>Constriction ; cardiomyopathie restrictive ; infarctus du ventricule droit ; insuffisance tricuspide sévère. Il est habituellement absent dans la tamponnade, sauf forme effusivo-constrictive.</p></template>

<template data-pop="i30-e-knock" data-title="Vibrance péricardique">
<div class="lab">Sémiologie</div><p>Bruit protodiastolique sec, plus précoce et plus aigu qu’un troisième bruit : il survient environ 100 à 120 ms après la fermeture aortique. Il s’entend à la pointe et au bord gauche du sternum, à la membrane.</p>
<div class="lab">Mécanisme</div><p>Arrêt brutal du remplissage ventriculaire rapide quand le ventricule atteint le volume imposé par le péricarde rigide.</p>
<div class="lab">Valeur</div><p>Spécifique de la constriction, mais présent dans une minorité de cas. Il correspond au creux puis au plateau de la courbe de pression ventriculaire.</p>
<div class="lab">Différentiel</div><p>Troisième bruit (plus tardif, plus grave, en cloche) ; claquement d’ouverture mitrale (plus précoce, dans le rétrécissement mitral).</p></template>
