
<!-- ===== FENÊTRES I30 : formes étiologiques ===== -->
<template data-pop="i30-tb" data-title="Péricardite tuberculeuse">
<div class="lab">Présentation</div><p>Installation subaiguë ; fièvre, sueurs nocturnes, amaigrissement ; épanchement souvent abondant, fibrineux, parfois compressif. Contexte : zone d’endémie, VIH, immunosuppression.</p>
<div class="lab">Diagnostic</div><p><b>Certain</b> : bacilles dans le liquide ou le péricarde (amplification génique, culture) ou granulomes caséeux à la biopsie. <b>Probable</b> : tuberculose prouvée ailleurs avec péricardite inexpliquée ; liquide lymphocytaire avec adénosine désaminase ≥ 40 U/L ou interféron gamma non stimulé élevé.</p>
<div class="lab">Traitement</div><p>Antituberculeux standard pendant 6 mois (isoniazide, rifampicine, pyrazinamide, éthambutol pendant 2 mois, puis isoniazide et rifampicine). Drainage si tamponnade. Corticoïdes adjuvants à envisager chez le patient non infecté par le VIH (ESC 2025, classe IIa, niveau C ; classe IIb dans l’ESC 2015) ; ils sont évités en cas de VIH (hausse des cancers associés dans l’essai IMPI).</p>
<div class="lab">Constriction</div><p>Complication fréquente. Péricardectomie si l’état ne s’améliore pas ou se détériore après 4 à 8 semaines d’antituberculeux.</p>
<div class="lab">En Suisse</div><p>Maladie à déclaration obligatoire (médecin cantonal) ; consulter le manuel de la tuberculose de la Ligue pulmonaire suisse et de l’OFSP ; test du VIH systématique.</p>
<div class="lab">Mécanisme et stades</div><p>Le bacille atteint le péricarde par les lymphatiques des ganglions médiastinaux ou par voie sanguine. La réaction d’hypersensibilité retardée produit un exsudat lymphocytaire, souvent hémorragique. L’ESC 2025 décrit quatre stades successifs d’un même processus : péricardite sèche, épanchement (jusqu’à 80 % des formes vues en pratique), résorption, puis constriction. Une physiologie effusivo-constrictive peut apparaître après le drainage.</p>
<div class="lab">Pourquoi la constriction est fréquente</div><p>La fibrine s’organise en fibrose épaisse. Avant les antituberculeux efficaces, jusqu’à la moitié des patients développaient une constriction en 6 mois ; avec le traitement actuel, 5 à 25 %. Hors isoniazide, les antituberculeux pénètrent mal dans le péricarde. Dans l’essai IMPI (1 400 patients, deux tiers infectés par le VIH), la prednisolone pendant 6 semaines a réduit la constriction de 7,8 % à 4,4 %, sans réduire le critère principal ; elle a augmenté les cancers de 0,6 % à 1,8 %, surtout ceux liés au VIH.</p>
<div class="lab">Ce qui change la décision</div><p>Une ponction diagnostique est recommandée si les tests non invasifs ne concluent pas (classe I, niveau C). Six mois de traitement suffisent ; 9 mois ou plus n’apportent rien. Les tests sanguins de libération d’interféron gamma et l’intradermoréaction ne distinguent pas l’infection ancienne de la maladie active. La mortalité atteint 17 à 40 % à 6 mois.</p>
<div class="lab">Source complémentaire</div><p>Recommandations de l’ESC 2025 sur les myocardites et les péricardites, <i>European Heart Journal</i> 2025;46:3952-4041, section 11.1 et tableau de recommandations 20 ; Mayosi et al., <i>New England Journal of Medicine</i> 2014;371:1121-30.</p>
</template>

<template data-pop="i30-purul" data-title="Péricardite purulente">
<div class="lab">Contexte</div><p>Rare dans les pays à haut revenu. Pneumonie ou empyème de voisinage, médiastinite, chirurgie thoracique, bactériémie, immunodépression, dialyse. Germes : staphylocoque doré, streptocoques, pneumocoque, bacilles à Gram négatif, anaérobies.</p>
<div class="lab">Clinique</div><p>Fièvre élevée, frissons, état septique, tamponnade fréquente. La douleur peut manquer.</p>
<div class="lab">Diagnostic</div><p>Ponction urgente : liquide trouble ou purulent, polynucléaires, glucose bas, germe au Gram ou en culture ; hémocultures.</p>
<div class="lab">Traitement</div><p>Drainage complet et urgent ; antibiothérapie intraveineuse adaptée ; lavage ou fibrinolyse intrapéricardique si le liquide est épais ou cloisonné ; drainage chirurgical sous-xiphoïdien ou péricardectomie si l’évacuation est incomplète. Sans traitement, l’évolution est mortelle ; même traitée, elle expose à la constriction (20 à 30 %).</p>
<div class="lab">Mécanisme</div><p>Dans les pays à haut revenu, le germe vient surtout d’un empyème (50 %) ou d’une pneumonie (33 %) de voisinage. Après chirurgie thoracique ou chez l’immunodéprimé, le staphylocoque doré (30 %) et les champignons (20 %) dominent. Le pus, riche en fibrine, se cloisonne et se reconstitue vite. S’il n’est pas évacué, il s’organise en fibrose, d’où la constriction.</p>
<div class="lab">Ce qui change la décision</div><p>La suspicion suffit à drainer, quel que soit l’état hémodynamique, par ponction urgente ou fenêtre chirurgicale (classe I, niveau C). Le liquide part en cultures bactériennes, fongiques et mycobactériennes. Le drainage chirurgical sous-xiphoïdien avec lavage rompt les cloisons et évacue tout le pus. La fibrinolyse intrapéricardique, à envisager pour obtenir un drainage complet, surtout si le liquide est cloisonné (classe IIa, niveau B), a prévenu les complications dans environ 86 % des cas. L’antibiothérapie intraveineuse, d’abord empirique puis adaptée, dure au moins 3 semaines, jusqu’à la disparition de la fièvre et des signes cliniques.</p>
<div class="lab">Source complémentaire</div><p>Recommandations de l’ESC 2025 sur les myocardites et les péricardites, <i>European Heart Journal</i> 2025;46:3952-4041, section 11.5 et tableau de recommandations 23.</p>
</template>

<template data-pop="i30-neo" data-title="Atteinte péricardique néoplasique">
<div class="lab">Causes</div><p>Métastases (poumon, sein, lymphomes, leucémies, mélanome, tube digestif) ; tumeurs primitives rares (mésothéliome, sarcome). Épanchements non malins chez le cancéreux : radiothérapie, médicaments, infections opportunistes.</p>
<div class="lab">Présentation</div><p>Épanchement abondant, souvent hémorragique, d’installation lente ; tamponnade révélatrice dans certains cas.</p>
<div class="lab">Diagnostic</div><p>Cytologie du liquide ; marqueurs tumoraux du liquide (antigène carcinoembryonnaire) ; biopsie péricardique si la cytologie est négative et que la suspicion persiste ; scanner et tomographie par émission de positons pour le bilan d’extension.</p>
<div class="lab">Traitement</div><p>Péricardiocentèse et drainage prolongé ; traitement systémique du cancer ; instillation intrapéricardique d’un cytostatique ou d’un agent sclérosant adapté au type tumoral (cisplatine dans le cancer bronchique, thiotépa dans le cancer du sein) ; fenêtre ou péricardiotomie percutanée en cas de récidive. La décision tient compte du pronostic et des souhaits du patient.</p>
<div class="lab">Mécanisme</div><p>Le cancer bronchique atteint surtout le péricarde par les lymphatiques, le cancer du sein par voie sanguine ; le cancer de l’œsophage l’envahit par contiguïté. L’envahissement tumoral et la gêne au drainage lymphatique accumulent un liquide abondant, souvent lentement, ce qui explique une tamponnade parfois révélatrice. Le mésothéliome est la tumeur primitive la plus fréquente. Le terme d’« épanchement néoplasique » est plus juste que celui de péricardite.</p>
<div class="lab">Pourquoi la preuve cytologique est exigée</div><p>Près de deux tiers des atteintes péricardiques des patients cancéreux ne sont pas malignes : radiothérapie, chimiothérapie, infection. Aucun marqueur tumoral du liquide n’est assez exact. Seule la cytologie, ou la biopsie, prouve l’envahissement (classe I, niveau C).</p>
<div class="lab">Ce qui change la décision</div><p>Les épanchements malins récidivent dans plus de la moitié des cas. Le drainage prolongé de 3 à 6 jours prévient la récidive (classe I, niveau B) et ouvre une voie pour un traitement local, à envisager si le traitement systémique échoue (classe IIb, niveau C). La radiothérapie contrôle bien l’épanchement des tumeurs radiosensibles, lymphomes et leucémies. Une tamponnade néoplasique signe une maladie avancée de mauvais pronostic à court terme : le geste vise alors le confort.</p>
<div class="lab">Source complémentaire</div><p>Recommandations de l’ESC 2025 sur les myocardites et les péricardites, <i>European Heart Journal</i> 2025;46:3952-4041, sections 11.2 et 11.8.4, tableau de recommandations 21.</p>
</template>

<template data-pop="i30-uremie" data-title="Péricardite urémique et péricardite de dialyse">
<div class="lab">Définitions</div><p><b>Péricardite urémique</b> : chez un patient en insuffisance rénale avancée, avant la dialyse ou dans ses 8 premières semaines. <b>Péricardite de dialyse</b> : après 8 semaines de dialyse, souvent liée à une dialyse insuffisante ou à une surcharge hydrique.</p>
<div class="lab">Particularités</div><p>Douleur souvent absente ou modeste ; ECG fréquemment sans sus-décalage typique, car l’épicarde est peu enflammé ; épanchement parfois hémorragique ; hypotension pendant les séances évocatrice d’un épanchement compressif.</p>
<div class="lab">Traitement</div><p>Intensification de la dialyse (séances quotidiennes pendant 10 à 14 jours), avec une anticoagulation minimale du circuit, car l’héparine favorise un épanchement hémorragique. Ponction si l’épanchement est compressif ou résistant. AINS et corticoïdes en cas d’échec de la dialyse. Limite rénale de la colchicine : voir sa monographie.</p>
<div class="lab">Piège</div><p>Une tamponnade peut se démasquer pendant l’ultrafiltration, par baisse de la précharge (tamponnade à basse pression).</p></template>

<template data-pop="i30-pcis" data-title="Syndromes post-lésionnels">
<div class="lab">Formes</div><p>Péricardite précoce de l’infarctus (premiers jours, par contiguïté) ; syndrome de Dressler (une à plusieurs semaines après l’infarctus, devenu rare avec la reperfusion) ; syndrome post-péricardiotomie après chirurgie cardiaque ; péricardite après traumatisme ou geste percutané (ablation, stimulateur, fermeture de l’auricule).</p>
<div class="lab">Diagnostic (ESC 2015)</div><p>Après une lésion cardiaque, au moins deux critères sur cinq : fièvre sans autre cause ; douleur péricarditique ou pleurale ; frottement péricardique ou pleural ; épanchement péricardique ; épanchement pleural avec protéine C réactive élevée.</p>
<div class="lab">Traitement</div><p>Traitement de la péricardite ; après infarctus, aspirine préférée aux autres AINS. Un épanchement croissant sous anticoagulant fait rechercher une rupture subaiguë ou un hémopéricarde.</p>
<div class="lab">Prévention</div><p>La colchicine périopératoire réduit le syndrome post-péricardiotomie (essais COPPS et COPPS-2 ; rapport des cotes 0,38 dans une méta-analyse), au prix de troubles digestifs. L’ESC 2025 propose de la débuter 48 à 72 heures avant la chirurgie et de la poursuivre un mois, à dose adaptée au poids et sans dose de charge (classe IIa, niveau A).</p>
<div class="lab">Mécanisme</div><p>Le saignement dans le péricarde ou l’incision de la plèvre déclencherait une réaction auto-immune. Trois faits plaident pour elle : un délai de quelques semaines avant les symptômes, la réponse aux anti-inflammatoires et la possibilité de récidives. Le syndrome de Dressler, devenu inférieur à 1 %, survient surtout 1 à 2 semaines après un infarctus étendu ou reperfusé tard ; il marque la taille de l’infarctus, sans valeur pronostique propre. Une péricardite suit environ 10 % des ablations de fibrillation auriculaire.</p>
<div class="lab">Ce qui change la décision</div><p>La preuve d’une inflammation, par exemple une protéine C réactive élevée, distingue le syndrome des simples suites mécaniques de la chirurgie. Un épanchement postopératoire sans inflammation ne se traite ni par AINS ni par colchicine : le diclofénac s’est montré inefficace dans un essai randomisé. Un épanchement modéré à abondant, présent dans un tiers des cas, évolue vers la tamponnade dans 10 % des cas au cours du premier mois et doit alors être drainé. Après un infarctus, un épanchement de plus de 10 mm fait rechercher une rupture subaiguë. Les anti-interleukine 1 sont recommandés dans les formes réfractaires (classe I, niveau B). Une constriction est rapportée dans environ 3 % des cas, d’où un suivi attentif (classe IIa, niveau C).</p>
<div class="lab">Source complémentaire</div><p>Recommandations de l’ESC 2025 sur les myocardites et les péricardites, <i>European Heart Journal</i> 2025;46:3952-4041, section 11.3 et tableau de recommandations 22.</p>
</template>

<template data-pop="i30-drug" data-title="Médicaments et vaccins à l’origine d’une atteinte péricardique">
<div class="lab">Mécanismes</div><p><b>Lupus induit</b> : hydralazine, procaïnamide, isoniazide ; anticorps anti-histones. <b>Épanchement par rétention hydrosodée ou toxicité</b> : minoxidil, dasatinib. <b>Inflammation immunitaire</b> : inhibiteurs de points de contrôle immunitaire (souvent avec myocardite), vaccins à ARN messager contre le COVID-19. <b>Hypersensibilité</b> : pénicillines, sulfamides. <b>Toxicité directe</b> : anthracyclines, cyclophosphamide à forte dose.</p>
<div class="lab">Vaccins à ARN messager</div><p>Myocardite ou myopéricardite rare, surtout chez l’homme jeune, dans les jours suivant la deuxième dose ; évolution habituellement favorable. Déclaration à Swissmedic.</p>
<div class="lab">Conduite</div><p>Arrêt du médicament ; traitement anti-inflammatoire standard ; avis spécialisé pour les inhibiteurs de points de contrôle (corticoïdes souvent nécessaires en cas de myocardite).</p></template>

<template data-pop="i30-grossesse" data-title="Péricardite, grossesse et allaitement">
<div class="lab">Épanchement physiologique</div><p>Un épanchement faible et asymptomatique est fréquent au troisième trimestre ; il ne demande ni traitement ni ponction.</p>
<div class="lab">Traitement de la péricardite</div><p>Jusqu’à 20 semaines de gestation : AINS à envisager (ESC 2025, classe IIa, niveau C) ; l’information professionnelle suisse ne les admet au premier et au deuxième trimestre qu’en cas de nécessité clairement établie, à la dose et pendant la durée les plus faibles. Au-delà : AINS évités (rétrécissement du canal artériel, oligoamnios) ; prednisone à la plus faible dose efficace, de préférence 20 mg/jour au plus (ESC 2025, classe IIa, niveau C). Colchicine : autrefois contre-indiquée, elle peut désormais être envisagée pour prévenir les récidives (ESC 2025, classe IIb, niveau C). En Suisse, l’information professionnelle de Colctab contre-indique la grossesse et exige une contraception efficace jusqu’à 3 mois après l’arrêt (6 mois pour la procréation chez l’homme) : l’usage pendant la grossesse est hors indication et se décide en concertation multidisciplinaire.</p>
<div class="lab">Allaitement : écart entre l’ESC 2025 et l’information professionnelle suisse</div><p>L’ESC 2025 propose d’envisager les anti-inflammatoires pendant l’allaitement, en espaçant les prises des tétées (classe IIa, niveau C), et juge la colchicine compatible. Les informations professionnelles suisses sont plus restrictives : Brufen® demande de ne pas prendre d’ibuprofène pendant l’allaitement et de sevrer le nourrisson si le traitement est indispensable ; Prednisone Streuli® demande de ne pas allaiter pendant une corticothérapie systémique, la prednisone passant dans le lait à 5 à 25 % de la concentration plasmatique maternelle ; Colctab® contre-indique l’allaitement. En Suisse, ces textes encadrent la prescription : tout usage pendant l’allaitement est hors indication et se décide avec la patiente, informée de l’écart.</p>
<div class="lab">Projet de grossesse</div><p>Chez une femme ayant des antécédents de péricardite récidivante ou de myocardite, l’ESC 2025 recommande une concertation multidisciplinaire avant la conception (classe I, niveau C), pour planifier les traitements et viser une rémission.</p>
<div class="lab">Tamponnade</div><p>Rare ; péricardiocentèse sous guidage échographique si nécessaire, sans radioscopie.</p>
<div class="lab">Fondement de la limite de 20 semaines</div><p>L’information professionnelle suisse de Brufen® indique qu’un AINS pris à partir de la 20e semaine peut altérer la fonction rénale du fœtus, qui produit l’essentiel du liquide amniotique : un oligoamnios survient en moyenne après quelques jours à quelques semaines, rarement dès 48 heures, et une insuffisance rénale néonatale est possible. Un rétrécissement du canal artériel a aussi été observé après un traitement au deuxième trimestre. Elle demande une surveillance échographique du liquide amniotique et du cœur fœtal si le traitement dépasse 48 heures, et contre-indique l’ibuprofène au troisième trimestre. L’information professionnelle d’Aspirine Cardio® contre-indique l’aspirine au troisième trimestre, même à 100 mg/jour : la faible dose ne lève pas cette contre-indication en Suisse.</p>
<div class="lab">Autres traitements (ESC 2025)</div><p>L’azathioprine et les immunoglobulines intraveineuses sont compatibles avec la grossesse et l’allaitement. L’anakinra peut être poursuivi chez une femme qui n’a pas d’alternative, malgré des données rares et rétrospectives. Pendant l’allaitement, tous ces traitements sont utilisables, sauf l’aspirine à forte dose ; les prises sont espacées des tétées pour limiter l’exposition du nourrisson (classe IIa, niveau C). L’homme qui souhaite concevoir peut poursuivre son traitement selon l’ESC 2025, ce qui diverge du délai demandé par l’information professionnelle suisse de la colchicine ; cette discordance se discute avec le patient.</p>
<div class="lab">Source complémentaire</div><p>Recommandations de l’ESC 2025 sur les myocardites et les péricardites, <i>European Heart Journal</i> 2025;46:3952-4041, section 12.3 et tableau de recommandations 25 ; informations professionnelles suisses Brufen®, Aspirine Cardio®, Prednisone Streuli® et Colctab®, Swissmedic (AIPS), état au 08.10.2026.</p>
</template>
