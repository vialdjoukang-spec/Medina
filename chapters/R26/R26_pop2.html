<template data-pop="r26-peur" data-title="Peur de chuter">
<div class="lab">Fréquence</div>
<p data-src="S8">Jusqu’à 70 % des personnes âgées qui ont chuté.</p>
<div class="lab">Conséquences</div>
<p data-src="S8">Perte de confiance et réduction des activités ; l’inactivité fait perdre la charge mécanique nécessaire à l’os et diminue les capacités locomotrices.</p>
<div class="lab">Prise en charge</div>
<p data-src="S5">Exercice, thérapie cognitivo-comportementale ou ergothérapie.</p></template>
<template data-pop="r26-myelopathie" data-title="Myélopathie cervicale spondylotique">
<div class="lab">Signes évocateurs</div>
<p data-src="S3">Douleur cervicale, paresthésies et maladresse des mains, urgences mictionnelles, marche raide spastique éventuellement ataxique.</p>
<div class="lab">Examen et conduite</div>
<p data-src="S3">Imagerie par résonance magnétique ; décompression chirurgicale à envisager si le patient est symptomatique. La maladie tend à progresser.</p>
<div class="lab">Limite</div>
<p data-src="S3">Aucun délai chiffré de prise en charge n’a été lu pour la compression médullaire aiguë.</p></template>
<template data-pop="r26-nph" data-title="Hydrocéphalie à pression normale">
<div class="lab">Triade</div>
<p data-src="S3 S22">Trouble de la marche (marche frontale), trouble cognitif, trouble vésical, avec ventriculomégalie.</p>
<div class="lab">Pourquoi c’est important</div>
<p data-src="S3 S20 S22">Cause traitable : la chirurgie (dérivation) se discute. Le tap test (sensibilité 58 %, spécificité 75 %) oriente la décision ; le protocole de Lausanne prévoit une évaluation physiothérapeutique avant et 24 heures après.</p>
<div class="lab">Limite</div>
<p data-src="S22">Les chiffres viennent de lignes directrices japonaises ; le résumé de Lausanne est rétrospectif et monocentrique.</p></template>
<template data-pop="r26-tremblement" data-title="Tremblement orthostatique">
<div class="lab">Définition</div>
<p data-src="S3">Tremblement de 13 à 20 Hz en station debout ; l’examen est normal assis et couché.</p>
<div class="lab">Signe d’appel</div>
<p data-src="S3">« Les jambes ne tiennent pas » debout, avec soulagement par la marche.</p>
<div class="lab">Traitement</div>
<p data-src="S3">Clonazépam, propranolol ou gabapentine. Le dossier ne contient pas d’information professionnelle suisse pour ces molécules.</p>
<div class="lab">Piège</div>
<p data-src="S3">Le prendre pour un trouble fonctionnel.</p></template>
<template data-pop="r26-fonctionnel" data-title="Trouble fonctionnel de la marche : inconsistance et incongruence">
<div class="lab">Principe</div>
<p data-src="S7">Diagnostic positif fondé sur des signes, non sur l’exclusion.</p>
<div class="lab">Inconsistance</div>
<p data-src="S7">Variabilité inexpliquée, amélioration quand le patient se croit non observé, absence de chute malgré une instabilité spectaculaire.</p>
<div class="lab">Incongruence</div>
<p data-src="S7">Dérobement du genou avec quadriceps normal, ciseaux sans signe pyramidal, amélioration en double tâche, en courant ou à reculons.</p>
<div class="lab">Fréquence</div>
<p data-src="S7">2 à 20 % des patients adressés pour mouvements anormaux ; 40 % de ceux-ci ont une atteinte de la marche.</p>
<div class="lab">Limite</div>
<p data-src="S7">Revue d’experts, avec des co-auteurs américains : elle sert ici à la sémiologie, non à une conduite thérapeutique. La physiothérapie et la psychothérapie n’ont pas d’efficacité prouvée.</p></template>
<template data-pop="r26-vitesse" data-title="Vitesse de marche : technique et seuil">
<div class="lab">Technique</div>
<p data-src="S3">Mesure sur 10 m de la vitesse spontanée puis maximale, avec le nombre de pas.</p>
<div class="lab">Normal et pathologique</div>
<p data-src="S3 S5">Vitesse préférée d’environ 1,4 m/s jusqu’à 59 ans, 0,95 m/s après 80 ans. Une vitesse inférieure à 0,8 m/s est le seuil de risque retenu par les recommandations mondiales.</p>
<div class="lab">Portée</div>
<p data-src="S3">La vitesse de marche spontanée est corrélée à l’espérance de vie.</p></template>
<template data-pop="r26-schellong" data-title="Test de Schellong : protocole">
<div class="lab">Protocole des recommandations mondiales</div>
<p data-src="S5">Au moins 5 minutes en décubitus ; mesure debout à 40–60 secondes, puis chaque minute jusqu’à 3 minutes ; jusqu’à 5 minutes si l’on suspecte une hypotension orthostatique retardée.</p>
<div class="lab">Indication</div>
<p data-src="S5">Chute ou perte de connaissance, chute inexpliquée récidivante.</p>
<div class="lab">Suite</div>
<p data-src="S5">Mesure battement par battement si l’hypotension est suspectée mais non objectivée ; tilt test en cas de doute sur une syncope vasovagale ou une hypotension orthostatique retardée.</p></template>
<template data-pop="r26-aigu" data-title="Déséquilibre aigu sans nystagmus">
<div class="lab">Constat</div>
<p data-src="S16 S17">Plus de la moitié des accidents vasculaires cérébraux qui se présentent avec un vertige ou un déséquilibre prennent la forme d’un syndrome de déséquilibre aigu (58,7 %), sans nystagmus. Le grade le plus sévère d’instabilité (impossibilité de marcher ou de tenir assis) est très spécifique d’un accident vasculaire cérébral.</p>
<div class="lab">Conduite</div>
<p data-src="S16 S17">Imagerie par résonance magnétique de diffusion, filière des accidents vasculaires cérébraux.</p>
<div class="lab">Limite</div>
<p data-src="S16 S17">La méta-analyse (40 études, 11 731 patients des urgences) a été lue par extraits ; la cohorte de Munich (75 patients avec accident vasculaire cérébral prouvé par imagerie) est monocentrique et lue en résumé.</p></template>
<template data-pop="r26-multifactorielle" data-title="Évaluation multifactorielle du chuteur">
<div class="lab">Domaines</div>
<p data-src="S5">Marche et équilibre ; force ; médicaments ; système cardiovasculaire et hypotension orthostatique ; vertiges ; autonomie et aides techniques ; vision et audition ; appareil locomoteur ; pieds et chaussures ; cognition (délirium, dépression, démence) ; maladies neurologiques ; peur de chuter ; environnement ; nutrition (protéines, vitamine D) ; alcool ; incontinence urinaire ; douleur.</p>
<div class="lab">Indication</div>
<p data-src="S5">Patients à risque élevé de chute.</p></template>
<template data-pop="r26-exercice" data-title="Exercice : niveau de recommandation 1A">
<div class="lab">Contenu</div>
<p data-src="S5">Exercices d’équilibre et fonctionnels (lever de chaise, pas), au moins trois séances par semaine, individualisés et progressifs, pendant au moins douze semaines. Le Tai-chi ou le renforcement progressif conviennent si possible.</p>
<div class="lab">Populations</div>
<p data-src="S5">Exercice supervisé en EMS ; après un accident vasculaire cérébral ; après une fracture de hanche (débuté à l’hôpital puis poursuivi) ; maladie de Parkinson débutante à modérée ; trouble cognitif.</p>
<div class="lab">Limite</div>
<p data-src="S5">Ligne directrice internationale ; le nombre de séances de physiothérapie remboursées en Suisse n’est pas documenté.</p></template>
<template data-pop="r26-deprescription" data-title="Déprescription : méthode et suivi">
<div class="lab">Méthode</div>
<p data-src="S5 S6">Revue structurée des médicaments qui favorisent les chutes, comme composante des interventions multidomaines ; systématique en EMS. Le sevrage progressif est en général nécessaire pour les benzodiazépines, antipsychotiques, opioïdes et antidépresseurs.</p>
<div class="lab">Suivi</div>
<p data-src="S6">Surveiller l’incidence des chutes et les symptômes (hypotension orthostatique, vision floue, vertiges) ; suivi individuel.</p>
<div class="lab">Limite</div>
<p data-src="S6">Consensus d’experts ; efficacité non démontrée en essai.</p></template>
<template data-pop="r26-vitd" data-title="Vitamine D : DO-HEALTH et recommandations">
<div class="lab">Recommandation</div>
<p data-src="S5">Supplémentation réservée aux personnes à risque de carence ; en EMS, alimentation riche en calcium et protéines et vitamine D dans une intervention multidomaine ; dosage selon les recommandations locales à domicile.</p>
<div class="lab">Essai DO-HEALTH</div>
<p data-src="S10 S11">2157 Européens de 70 ans et plus vivant à domicile, coordonnés à Zurich, plan factoriel 2×2×2 : 2000 UI par jour de vitamine D sans bénéfice sur les chutes, les fractures non vertébrales ou le déclin fonctionnel chez des sujets non carencés ; la combinaison vitamine D, oméga-3 et exercice réduit de 39 % les odds de devenir préfragile.</p>
<div class="lab">Limite</div>
<p data-src="S10">Résumé seul pour les résultats ; l’essai américain VITAL est une donnée probante, non une recommandation.</p></template>
<template data-pop="r26-vide3" data-title="Vi-De 3 (cholécalciférol) : information professionnelle suisse">
<div class="lab">Posologie en prévention</div>
<p data-src="S13">600 UI par jour de 2 à 18 ans ; 800 UI par jour après 60 ans.</p>
<div class="lab">Contre-indications</div>
<p data-src="S13">Hypercalcémie, hypercalciurie, lithiase calcique, sarcoïdose et patient immobilisé (risque d’hypercalcémie et d’hypercalciurie).</p>
<div class="lab">Surveillance</div>
<p data-src="S13">Calcémie, calciurie et créatinine au long cours ; arrêt si la calciurie dépasse 7,5 mmol/24 h.</p>
<div class="lab">Mise à jour et limites</div>
<p data-src="S13">Information professionnelle de VERFORA SA, mise à jour en octobre 2021. Le mécanisme d’action et les interactions ne figurent pas dans les extraits lus.</p></template>
<template data-pop="r26-parkinson" data-title="Marche de la maladie de Parkinson">
<div class="lab">Signes</div>
<p data-src="S3">Pas courts, base étroite, posture fléchie, bras peu balancés, demi-tour en bloc, festination, pull test pathologique ; asymétrie initiale. Le patient peut monter les escaliers mieux qu’il ne marche à plat.</p>
<div class="lab">Traitement</div>
<p data-src="S3">Lévodopa, traitement de choix de la marche ; agonistes et lévodopa peuvent aggraver une hypotension orthostatique ; indices visuels et auditifs pour le freezing ; stimulation cérébrale profonde efficace seulement sur les symptômes dopa-sensibles ; déambulateur à quatre roues avec freins.</p>
<div class="lab">Prévention des chutes</div>
<p data-src="S5">Outil auto-rapporté à trois facteurs : chute dans l’année, freezing dans le mois, vitesse de marche lente.</p></template>
<template data-pop="r26-psp-msa" data-title="Syndromes parkinsoniens atypiques : PSP et MSA">
<div class="lab">Paralysie supranucléaire progressive</div>
<p data-src="S3">Chutes en arrière dès la première année, posture droite, « imprudence motrice », paralysie verticale du regard. Réponse faible à la lévodopa.</p>
<div class="lab">Atrophie multisystématisée</div>
<p data-src="S3">Parkinsonisme avec signes cérébelleux, antécolis, syndrome de Pise, dysautonomie. Réponse modeste à la lévodopa.</p>
<div class="lab">Pronostic</div>
<p data-src="S3">Évolution plus rapide et moins dopa-sensible que la maladie de Parkinson.</p></template>
<template data-pop="r26-madopar" data-title="Madopar (lévodopa et bensérazide) : information professionnelle suisse">
<div class="lab">Posologie</div>
<p data-src="S14">Instauration par petites doses, trois à quatre fois par jour, avec augmentation progressive ; entretien moyen de 400 à 600 mg de lévodopa par jour. Prise 30 minutes avant ou 1 heure après le repas.</p>
<div class="lab">Contre-indications</div>
<p data-src="S14">Âge inférieur à 25 ans ; insuffisance rénale, hépatique ou endocrinienne décompensée ; affection cardiaque ; psychose ; glaucome à angle fermé ; grossesse.</p>
<div class="lab">Mises en garde</div>
<p data-src="S14">Somnolence et endormissement soudain : pas de conduite.</p>
<div class="lab">Mise à jour et limites</div>
<p data-src="S14">Information professionnelle mise à jour en juin 2023. L’hypotension orthostatique est signalée par la revue de Vienne, non par les extraits de la notice. Le mécanisme d’action et les essais ne figurent pas dans les extraits lus.</p></template>
<template data-pop="r26-lioresal" data-title="Liorésal (baclofène) : information professionnelle suisse">
<div class="lab">Posologie</div>
<p data-src="S15">Début à 3 × 5 mg par jour ; augmentation de 5 mg par prise tous les 3 jours ; dose habituelle de 30 à 80 mg par jour. Titration particulièrement lente chez l’âgé. Réévaluer après 6 à 8 semaines sans effet. Indication à partir de 12 mois.</p>
<div class="lab">Insuffisance rénale</div>
<p data-src="S15">Débuter à environ 5 mg par jour en hémodialyse ; encéphalopathie possible au-delà de 5 mg par jour.</p>
<div class="lab">Mises en garde</div>
<p data-src="S15">Prudence si la spasticité soutient la station (risque de chute) ; arrêt progressif sur environ 3 semaines.</p>
<div class="lab">Mise à jour et limites</div>
<p data-src="S15">Information professionnelle mise à jour en janvier 2025. Le mécanisme d’action et les preuves cliniques ne figurent pas dans les extraits lus.</p></template>
<template data-pop="r26-clexane" data-title="Clexane (énoxaparine) : information professionnelle suisse">
<div class="lab">Indication</div>
<p data-src="S12">Prophylaxie chez le patient alité pour une affection médicale aiguë : insuffisance cardiaque de classe NYHA III–IV, insuffisance respiratoire aiguë, infection ou affection rhumatologique aiguë avec un autre facteur de risque.</p>
<div class="lab">Posologie</div>
<p data-src="S12">40 mg par voie sous-cutanée, une fois par jour, pendant au moins 6 jours et jusqu’à mobilisation complète, 14 jours au maximum. Ajustement si la clairance de la créatinine est inférieure à 30 mL/min ; surveillance entre 30 et 80 mL/min.</p>
<div class="lab">Contre-indications</div>
<p data-src="S12">Hémorragie active, thrombopénie induite par l’héparine à médiation immune datant de moins de 100 jours, endocardite aiguë.</p>
<div class="lab">Mises en garde</div>
<p data-src="S12">Risque hémorragique accru au-delà de 70 ans aux doses thérapeutiques ; surveillance si le poids est inférieur à 45 kg (femme) ou 57 kg (homme) ; mise en garde sur la thrombopénie induite par l’héparine entre le 5e et le 21e jour.</p>
<div class="lab">Grossesse et allaitement</div>
<p data-src="S12">Utilisée en prophylaxie pendant la grossesse (données sur 624 grossesses) ; allaitement non recommandé par précaution.</p>
<div class="lab">Mise à jour et limites</div>
<p data-src="S12">Information professionnelle mise à jour en février 2026 (Sanofi-Aventis Suisse). Mécanisme d’action et essais cliniques non détaillés dans les extraits lus.</p></template>
<template data-pop="r26-conduite" data-title="Aptitude à la conduite">
<div class="lab">Cadre légal général</div>
<p data-src="S24">Article 14 alinéa 2 de la loi fédérale sur la circulation routière et article 7 alinéa 1 de l’ordonnance sur l’admission des personnes et des véhicules à la circulation routière, tels que repris du document de la Société suisse de médecine légale et de la Société suisse de cardiologie (2024).</p>
<div class="lab">Médicament</div>
<p data-src="S14">Sous Madopar, la somnolence et l’endormissement soudain interdisent la conduite.</p>
<div class="lab">Lacune</div>
<p data-src="S24">Aucune directive suisse propre aux troubles de la marche n’a été trouvée ; le cours n’en invente pas.</p></template>
<template data-pop="r26-tap" data-title="Tap test dans l’hydrocéphalie à pression normale">
<div class="lab">Principe</div>
<p data-src="S22 S20">Soustraction de liquide céphalorachidien avec comparaison de la marche avant et après. Le protocole de Lausanne ajoute une évaluation physiothérapeutique avant et 24 heures après.</p>
<div class="lab">Performance</div>
<p data-src="S22">Sensibilité 58 %, spécificité 75 % ; un test négatif n’exclut donc pas la maladie.</p>
<div class="lab">Limite</div>
<p data-src="S22 S20">Lignes directrices japonaises (ni suisses ni européennes), utilisées pour des chiffres descriptifs ; protocole de Lausanne rétrospectif et monocentrique.</p></template>
<template data-pop="r26-double-tache" data-title="Analyse de la marche en double tâche">
<div class="lab">Principe</div>
<p data-src="S21">Comparer la marche simple et la marche associée à une tâche cognitive, avant et après drainage de liquide céphalorachidien.</p>
<div class="lab">Résultat</div>
<p data-src="S21">À Bâle (122 patients, 146 témoins), l’analyse en double tâche identifie 25,7 % de répondeurs supplémentaires.</p>
<div class="lab">Limite</div>
<p data-src="S21">Étude exploratoire ; résumé seul.</p></template>
<template data-pop="r26-ataxie-bilan" data-title="Ataxie : bilan biologique">
<div class="lab">Liste</div>
<p data-src="S18">Vitamines B1 et B12, holotranscobalamine, acide méthylmalonique, vitamine E, CDT, VIH, syphilis, thyroïde, anticorps antineuronaux.</p>
<div class="lab">En premier recours</div>
<p data-src="S19">TSH, vitamine B12 avec folates, sérologie cœliaque.</p>
<div class="lab">Limite</div>
<p data-src="S18 S19">Les valeurs normales ne sont pas données dans le dossier ; aucune valeur de référence suisse n’est donc citée.</p></template>
<template data-pop="pareto-r26-definition" data-title="Pareto — Question clinique et définition">
<p class="ratio" data-cover="r26-0,r26-1"></p>
<ul><li data-src="S1 S3">R26 est un code de symptôme ; il cède la place au diagnostic étiologique.</li><li data-src="S3">Les types de marche se rangent en musculosquelettique, neuromusculaire et myélopathique, cérébral.</li><li data-src="S5">Risque de chute : faible, intermédiaire (une chute non grave avec trouble de la marche), élevé (blessure, deux chutes ou plus, fragilité, une heure au sol, perte de connaissance).</li><li data-src="S1">Exclusions : G11.-, A52.1, R27.0, M62.3-.</li></ul></template>
<template data-pop="pareto-r26-bases" data-title="Pareto — Épidémiologie, mécanismes et causes">
<p class="ratio" data-cover="r26-2,r26-3,r26-4"></p>
<ul><li data-src="S8 S9">Suisse : environ 88 000 à 90 000 blessés de 65 ans et plus et 1500 à 1600 décès par chute chaque année.</li><li data-src="S4">32,2 % des 60–97 ans ont une marche anormale (Bruneck).</li><li data-src="S3">Appui 60 %, oscillation 40 % ; vitesse 1,4 m/s avant 60 ans, 0,95 m/s après 80 ans.</li><li data-src="S8">Faiblesse musculaire, antécédent de chute et trouble de la marche sont les facteurs de chute les plus forts.</li><li data-src="S6">Quatorze classes de médicaments favorisent les chutes (STOPPFall).</li></ul></template>
<template data-pop="pareto-r26-clinique" data-title="Pareto — Anamnèse, examen, diagnostic et urgences">
<p class="ratio" data-cover="r26-5,r26-6,r26-7,r26-8"></p>
<ul><li data-src="S5">Demander chaque année si le patient âgé a chuté.</li><li data-src="S3">Ataxie sensitive : Romberg et obscurité aggravent. Cérébelleuse : demi-tour et tandem.</li><li data-src="S5">Vitesse inférieure à 0,8 m/s et TUG supérieur à 15 secondes : risque.</li><li data-src="S16 S17">Un déséquilibre aigu sans nystagmus peut être un accident vasculaire cérébral.</li><li data-src="S3 S22">Marche frontale, troubles cognitifs et vésicaux : hydrocéphalie à pression normale.</li></ul></template>
<template data-pop="pareto-r26-prise" data-title="Pareto — Prise en charge, suivi et critères">
<p class="ratio" data-cover="r26-9,r26-10,r26-11,r26-12,r26-13,r26-14"></p>
<ul><li data-src="S5">Risque faible : information et exercice ; intermédiaire : exercice ciblé ; élevé : évaluation multifactorielle.</li><li data-src="S5">Exercice d’équilibre : au moins trois séances par semaine, au moins douze semaines.</li><li data-src="S5 S6">Déprescrire les médicaments à risque, avec sevrage progressif.</li><li data-src="S3">Lévodopa pour la marche parkinsonienne, pas pour la marche frontale.</li><li data-src="S12 S13">Alité : énoxaparine 40 mg par jour ; vitamine D contre-indiquée en cas d’immobilisation.</li></ul></template>
<template data-pop="pareto-r26-exam1" data-title="Pareto — Hiérarchie des examens et bilan du chuteur">
<p class="ratio" data-cover="r26-e-1,r26-e-2,r26-e-3"></p>
<ul><li data-src="S3">L’observation de la marche et l’examen neurologique orientent les examens.</li><li data-src="S5">Vitesse et TUG stratifient le risque ; le Schellong dépiste l’hypotension orthostatique.</li><li data-src="S5">Électrocardiogramme 12 dérivations ; tilt test seulement en cas de doute.</li></ul></template>
<template data-pop="pareto-r26-exam2" data-title="Pareto — Ataxie, hydrocéphalie et trouble fonctionnel">
<p class="ratio" data-cover="r26-e-4,r26-e-5,r26-e-6"></p>
<ul><li data-src="S18">Ataxie : IRM cérébrale d’abord, puis bilan biologique.</li><li data-src="S22">Tap test : sensibilité 58 %, spécificité 75 % ; un test négatif n’exclut pas.</li><li data-src="S7">Trouble fonctionnel : signes positifs d’inconsistance et d’incongruence.</li></ul></template>
<template data-pop="pareto-r26-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="r26-s-anat-cours"></p>
<ul><li data-src="S3">Le vermis contrôle l’équilibre ; les hémisphères, les membres homolatéraux.</li><li data-src="S3">Moyen fessier : stabilisation du bassin ; canal lombaire : claudication neurogène.</li></ul></template>
<template data-pop="pareto-r26-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="r26-s-physio-cours"></p>
<ul><li data-src="S3">Vitesse : 1,4 puis 1,3 puis 0,95 m/s selon l’âge.</li><li data-src="S5">Seuil de risque : 0,8 m/s.</li><li data-src="S3">La stratégie protectrice élargit la base et prolonge le double appui.</li></ul></template>
<template data-pop="pareto-r26-biomeca" data-title="Pareto — Biomécanique">
<p class="ratio" data-cover="r26-s-biomeca-cours"></p>
<ul><li data-src="S3">Trendelenburg : moyen fessier ; steppage : releveurs.</li><li data-src="S3">Claudication neurogène : lordose en position debout.</li></ul></template>
<template data-pop="pareto-r26-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="r26-p-1,r26-p-2,r26-p-3"></p>
<ul><li data-src="S5 S6">Premier geste pharmacologique : déprescrire.</li><li data-src="S12">Énoxaparine : 40 mg par jour, 6 à 14 jours chez l’alité.</li><li data-src="S13">Vitamine D : 800 UI par jour après 60 ans ; contre-indiquée en cas d’immobilisation.</li><li data-src="S14 S15">Madopar : entretien de 400 à 600 mg de lévodopa ; Liorésal : 30 à 80 mg par jour.</li></ul></template>
