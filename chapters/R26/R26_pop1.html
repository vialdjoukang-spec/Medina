<template data-pop="r26-vignette" data-title="Vignette fictive : hypothèses et démarche">
<div class="lab">Situation</div>
<p>Femme de 82 ans, vivant seule, deux chutes en six mois sans perte de connaissance connue, vitesse de marche de 0,7 m/s, Timed Up and Go de 18 secondes, benzodiazépine le soir. Les valeurs sont pédagogiques et ne proviennent pas d’une patiente réelle.</p>
<div class="lab">Hypothèse principale</div>
<p data-src="S5 S6">Deux chutes en douze mois placent la patiente dans la catégorie de risque élevé des recommandations mondiales. La vitesse (inférieure à 0,8 m/s) et le Timed Up and Go (supérieur à 15 secondes) dépassent les deux seuils de risque. La benzodiazépine appartient aux classes de médicaments qui favorisent les chutes.</p>
<div class="lab">Démarche</div>
<p data-src="S3 S5">Regarder marcher la patiente (type de marche, niveau lésionnel) ; mesurer la tension couchée puis debout ; chercher une syncope par l’anamnèse et l’électrocardiogramme ; relire les médicaments ; proposer une évaluation multifactorielle, un exercice d’équilibre d’au moins trois séances par semaine pendant douze semaines, et la sécurisation du logement.</p>
<div class="lab">Erreur à éviter</div>
<p data-src="S3 S25">Attribuer la marche lente et les chutes à l’âge sans chercher la cause : un trouble de la marche n’est pas une conséquence inévitable du vieillissement.</p></template>
<template data-pop="r26-tug" data-title="Timed Up and Go : technique et seuil">
<div class="lab">Technique</div>
<p data-src="S3">Le patient se lève d’une chaise à accoudoirs, marche 3 m, se retourne, revient et s’assoit. On chronomètre le trajet.</p>
<div class="lab">Seuil et rôle</div>
<p data-src="S5">Un temps supérieur à 15 secondes est le seuil retenu par les recommandations mondiales comme alternative à la vitesse de marche (inférieure à 0,8 m/s), qui reste le test recommandé en premier. Les preuves du Timed Up and Go sont moins constantes.</p>
<div class="lab">Limite</div>
<p data-src="S5">Le test classe le risque ; il ne dit rien de la cause du trouble de la marche.</p></template>
<template data-pop="r26-ssp" data-title="PROFILES : situations de départ 96, 97, 98 et 103">
<div class="lab">Libellés</div>
<p data-src="S23">Situation de départ 96 : « abnormal sense of balance, falls » ; 97 : « abnormal gait » ; 98 et 103 : « paresis, paralysis ». Le référentiel PROFILES 2017 est publié par l’Institut suisse pour la formation médicale postgraduée et continue (ISFM) et par les facultés de médecine suisses.</p>
<div class="lab">Limite</div>
<p data-src="S23 S2">Ce rattachement de R26 à ces situations est une correspondance pédagogique du dépôt (marqueur d’examen fédéral du registre). Il n’existe pas de table officielle entre la CIM et PROFILES, et la brochure officielle n’a pas été relue pour ce cours.</p></template>
<template data-pop="r26-marche-normale" data-title="Marche normale et prérequis">
<div class="lab">Définition</div>
<p data-src="S3">La marche normale est rythmique, fluide et sans effort ; les jambes se balancent librement, la posture est droite et les bras se balancent en opposition à la jambe du même côté.</p>
<div class="lab">Prérequis</div>
<p data-src="S3">Fonction locomotrice (initier et entretenir la marche rythmique), équilibre, réflexes posturaux, sensibilité et intégration sensorimotrice, contrôle moteur, appareil musculosquelettique, fonction cardiopulmonaire.</p>
<div class="lab">Conséquence</div>
<p data-src="S3">Un trouble de l’un de ces prérequis peut suffire à produire une marche anormale ; c’est pourquoi une cause locomotrice ou cardiorespiratoire est cherchée avant d’attribuer le trouble à une maladie cérébrale.</p></template>
<template data-pop="r26-exclusions" data-title="Règles de codage : exclusions de R26">
<div class="lab">Exclusions</div>
<p data-src="S1">La CIM-10-GM 2024 exclut de R26 : l’ataxie héréditaire (G11.-), l’ataxie locomotrice syphilitique ou tabès (A52.1), l’ataxie sans précision (R27.0) et le syndrome d’immobilité paraplégique (M62.3-).</p>
<div class="lab">Règle pratique</div>
<p data-src="S1">Une ataxie non limitée à la marche se code R27.0. Une ataxie héréditaire confirmée passe en G11.-. Le tabès se code A52.1. L’immobilité du paraplégique se code M62.3-. R26 cède la place au diagnostic étiologique dès qu’il est posé.</p>
<div class="lab">Limite</div>
<p data-src="S1 S2">Notes du BfArM en version allemande ; les libellés français viennent du registre du dépôt (Office fédéral de la statistique), non du fichier brut.</p></template>
<template data-pop="r26-nutt" data-title="Classification de Nutt, Marsden et Thompson (1993)">
<div class="lab">Principe</div>
<p data-src="S3">Les troubles de la marche sont répartis en niveaux bas, moyen et supérieur.</p>
<div class="lab">Niveau supérieur</div>
<p data-src="S3">Il regroupe les troubles non expliqués par une atteinte périphérique, pyramidale, cérébelleuse ou des noyaux gris : marche frontale, marche prudente, déséquilibre sous-cortical ou frontal, défaut isolé d’initiation.</p>
<div class="lab">Limite</div>
<p data-src="S3">La revue de Vienne cite cette classification ; les détails des niveaux bas et moyen ne sont pas restitués dans le texte lu.</p></template>
<template data-pop="r26-wfg" data-title="World Falls Guidelines : catégories de risque">
<div class="lab">Origine</div>
<p data-src="S5">Recommandations mondiales de prévention et de prise en charge des chutes des personnes âgées, publiées en 2022 par un groupe international (Age and Ageing).</p>
<div class="lab">Catégories</div>
<p data-src="S5">Faible : aucune chute, ou une chute non grave sans trouble de la marche. Intermédiaire : une chute non grave avec trouble de la marche ou de l’équilibre. Élevé : chute avec blessure, au moins deux chutes en douze mois, fragilité, incapacité à se relever pendant au moins une heure, ou perte de connaissance suspectée.</p>
<div class="lab">Limite</div>
<p data-src="S5">Ligne directrice internationale, non suisse. Les anciennes recommandations américaines et britanniques citées par le texte ne sont pas utilisées comme fondement.</p></template>
<template data-pop="r26-chute-grave" data-title="Chute grave : définition">
<div class="lab">Définition</div>
<p data-src="S5">Une chute est grave si elle entraîne une blessure nécessitant une consultation, un séjour au sol d’au moins une heure sans pouvoir se relever, un passage aux urgences, ou si elle s’accompagne d’une perte de connaissance.</p>
<div class="lab">Conséquence</div>
<p data-src="S5">Une chute grave place le patient dans la catégorie de risque élevé et déclenche l’évaluation multifactorielle.</p></template>
<template data-pop="r26-fragilite" data-title="Fragilité : phénotype et Clinical Frailty Scale">
<div class="lab">Phénotype de fragilité</div>
<p data-src="S5">Cinq critères : vitesse de marche lente, faible activité physique, perte de poids involontaire, épuisement, faiblesse musculaire. Trois critères ou plus définissent la fragilité ; un ou deux, la préfragilité.</p>
<div class="lab">Clinical Frailty Scale</div>
<p data-src="S5">Échelle graduée de 1 à 9 ; une fragilité est retenue à partir de 4.</p>
<div class="lab">Lien avec la marche</div>
<p data-src="S5">La vitesse de marche lente figure parmi les cinq critères : un test de marche renseigne donc aussi sur la fragilité.</p></template>
<template data-pop="r26-freezing" data-title="Freezing : trois formes">
<div class="lab">Définition</div>
<p data-src="S3">Blocage soudain de la marche chez le patient parkinsonien.</p>
<div class="lab">Trois formes</div>
<p data-src="S3">Akinétique pure (rare) ; piétinement sur place ; marche à très petits pas.</p>
<div class="lab">Prise en charge</div>
<p data-src="S3">Des indices visuels et auditifs améliorent le freezing. Le freezing s’améliore en courant, ce qui peut le faire prendre à tort pour un trouble fonctionnel.</p></template>
<template data-pop="r26-mnemo" data-title="Moyen mnémotechnique : risque élevé de chute">
<div class="lab">Moyen mnémotechnique (aide pédagogique, non critère officiel)</div>
<p>« BD-FIC » : <b>B</b>lessure ; <b>D</b>eux chutes ou plus en douze mois ; <b>F</b>ragilité ; <b>I</b>ncapacité à se relever pendant une heure ou plus ; <b>C</b>onnaissance perdue (perte de connaissance suspectée).</p>
<div class="lab">Règle associée</div>
<p data-src="S5">Une chute associée à au moins un de ces cinq éléments classe le patient à risque élevé. Les critères officiels sont ceux des recommandations mondiales ; l’acronyme n’en fait pas partie.</p></template>
<template data-pop="r26-bfu" data-title="BFU : chiffres suisses et périodes">
<div class="lab">Qui est le BFU ?</div>
<p data-src="S8 S9">Le Bureau suisse de prévention des accidents, à Berne, publie des données sur les chutes des personnes de 65 ans et plus et des programmes de prévention (StoppSturz, « Sicher stehen – sicher gehen »).</p>
<div class="lab">Chiffres et périodes</div>
<p data-src="S8 S9">Moyenne 2012–2016 : environ 88 000 blessés par an et plus de 1500 décès. Moyenne 2015–2019 : 89 580 blessés par an, dont 45 130 dans le logement privé, et 1600 décès par an.</p>
<div class="lab">Limite</div>
<p data-src="S8 S9">Support de formation pour le premier chiffre ; seule l’introduction de la documentation 2.250 a été lue pour le second. Les risques relatifs du BFU proviennent d’une synthèse de 2005.</p></template>
<template data-pop="r26-bruneck" data-title="Étude de Bruneck (Tyrol du Sud)">
<div class="lab">Population</div>
<p data-src="S4">488 personnes de 60 à 97 ans vivant à domicile à Bruneck (Tyrol du Sud, Italie).</p>
<div class="lab">Résultats</div>
<p data-src="S4">32,2 % de marche anormale ; 38,3 % des personnes de 80 ans et plus gardent une marche normale. Seuls les troubles neurologiques de la marche sont associés aux chutes récidivantes (odds ratio de 3,3 pour une cause, 7,1 pour des causes multiples).</p>
<div class="lab">Limites</div>
<p data-src="S4">Seul le résumé a été lu ; la répartition par type est reprise de la revue de Vienne. Les pourcentages de troubles neurologiques (24,0 %), non neurologiques (17,4 %) et mixtes (9,2 %) ne se réconcilient pas avec 32,2 % dans le résumé : le dénominateur n’est pas précisé. Étude italienne, non suisse.</p></template>
<template data-pop="r26-ems" data-title="EMS : établissement médico-social">
<div class="lab">Définition</div>
<p>Établissement médico-social, structure d’hébergement et de soins pour personnes âgées en Suisse.</p>
<div class="lab">Risque de chute</div>
<p data-src="S3 S5">Les taux de chute y sont plus élevés qu’en population générale. Les recommandations mondiales considèrent tous les résidents comme à haut risque de chute et recommandent une revue systématique des médicaments et un exercice supervisé.</p></template>
<template data-pop="r26-cycle" data-title="Cycle de marche : appui et oscillation">
<div class="lab">Phases</div>
<p data-src="S3">Appui : environ 60 % du cycle (contact initial, mise en charge, milieu d’appui, fin d’appui, pré-oscillation). Oscillation : environ 40 %. Deux phases de double appui de 10 à 12 % chacune.</p>
<div class="lab">Utilité clinique</div>
<p data-src="S3">Une stratégie protectrice prolonge le double appui ; une marche prudente ou un déficit d’équilibre se traduit donc par une augmentation du temps passé avec les deux pieds au sol.</p></template>
<template data-pop="r26-vieillissement" data-title="Marche du sujet âgé">
<div class="lab">Valeurs</div>
<p data-src="S3">Vitesse de 1,3 m/s dans la septième décennie et de 0,95 m/s après 80 ans (environ 1 % par an), par raccourcissement du pas, la cadence restant stable. Base de sustentation élargie d’environ 40 % (8 cm chez la femme âgée, 10 cm chez l’homme).</p>
<div class="lab">Mécanisme</div>
<p data-src="S3">Le sujet âgé déplace la compensation de la cheville vers la hanche par perte de proprioception distale, et dépend davantage du système vestibulaire.</p>
<div class="lab">Limite</div>
<p data-src="S3 S25">Le vieillissement ralentit la marche, mais les troubles de la marche ne sont pas une conséquence inévitable de l’âge.</p></template>
<template data-pop="r26-integration" data-title="Intégration sensorielle de la marche">
<div class="lab">Afférences</div>
<p data-src="S3">Visuelles, vestibulaires et proprioceptives. Un déficit est partiellement compensé par les autres, par exemple la vue pour la proprioception.</p>
<div class="lab">Intégration et efférences</div>
<p data-src="S3">Cortex frontal, noyaux gris, tronc cérébral et cervelet ; voie pyramidale, nerf, jonction neuromusculaire et muscle. Le noyau pédonculopontin, centre locomoteur mésencéphalique, intervient dans la marche automatique.</p>
<div class="lab">Conséquence clinique</div>
<p data-src="S3">Le Romberg et la marche yeux fermés testent la dépendance à la vue : ils aggravent l’ataxie sensitive.</p></template>
<template data-pop="r26-strategie" data-title="Stratégie protectrice de la marche">
<div class="lab">Principe</div>
<p data-src="S3">Toute menace pour l’équilibre déclenche des ajustements : base élargie, double appui prolongé, pas raccourci, vitesse réduite, posture fléchie. L’exemple du sol verglacé les illustre.</p>
<div class="lab">Pourquoi c’est utile</div>
<p data-src="S3">Chaque ajustement diminue le risque de déséquilibre. Chez le sujet âgé ou le patient atteint, ces ajustements peuvent apparaître spontanément et ne pas être des signes spécifiques d’une maladie.</p></template>
<template data-pop="r26-cognition" data-title="Cognition et marche">
<div class="lab">Fonctions en cause</div>
<p data-src="S3">Fonctions exécutives frontales, attention et perception visuospatiale contribuent à la sécurité de la marche.</p>
<div class="lab">Signes d’alerte</div>
<p data-src="S3">S’arrêter de marcher pour parler prédit les chutes. Une marche lente chez un sujet âgé non dément prédit mieux une démence future que la plainte cognitive subjective.</p>
<div class="lab">Parkinson</div>
<p data-src="S3">Le patient parkinsonien perd la stratégie qui consiste à assurer la posture avant la tâche concurrente.</p></template>
<template data-pop="r26-cervelet" data-title="Ataxie cérébelleuse de la marche">
<div class="lab">Mécanisme</div>
<p data-src="S3">Le vermis contrôle l’équilibre : la marche cérébelleuse dépend surtout de l’équilibre, moins du placement du pied. Une lésion hémisphérique donne une ataxie homolatérale des membres.</p>
<div class="lab">Signes</div>
<p data-src="S3">Base large, pas irréguliers, aggravation au demi-tour, en tandem et sur sol irrégulier, initiation normale, titubation possible ; peu d’aggravation yeux fermés.</p>
<div class="lab">Bilan</div>
<p data-src="S18">IRM cérébrale en premier ; bilan biologique si elle n’est pas contributive.</p></template>
<template data-pop="r26-sensitive" data-title="Ataxie sensitive et signe de Romberg">
<div class="lab">Mécanisme</div>
<p data-src="S3">La perte proprioceptive est compensée par la vue ; la marche s’aggrave donc yeux fermés et dans l’obscurité.</p>
<div class="lab">Signes</div>
<p data-src="S3">Pas courts, marche lente et « talonnante » ; Romberg et marche yeux fermés aggravent nettement le trouble.</p>
<div class="lab">Cause traitable</div>
<p data-src="S18">En cas de dénutrition ou d’alcool, des carences en vitamines B1 et B12 sont à rechercher.</p></template>
<template data-pop="r26-steppage" data-title="Steppage">
<div class="lab">Mécanisme</div>
<p data-src="S3">La parésie des releveurs du pied impose un lever exagéré de la jambe.</p>
<div class="lab">Signe</div>
<p data-src="S3">La marche sur les talons est impossible ; la marche sur la pointe des pieds est impossible si ce sont les fléchisseurs plantaires qui sont parétiques.</p>
<div class="lab">Traitement</div>
<p data-src="S3">Attelle releveuse, chaussures orthopédiques.</p></template>
<template data-pop="r26-trendelenburg" data-title="Dandinement : Trendelenburg et Duchenne">
<div class="lab">Mécanisme</div>
<p data-src="S3">La faiblesse du moyen fessier laisse le bassin s’abaisser du côté de la jambe en oscillation (signe de Trendelenburg) ; le tronc s’incline de façon compensatrice (signe de Duchenne).</p>
<div class="lab">Cause évoquée</div>
<p data-src="S3">Une myopathie, avec difficulté à se lever.</p>
<div class="lab">Distinction</div>
<p data-src="S3">La marche coxalgique déplace aussi le tronc vers le côté atteint, mais le bassin controlatéral reste horizontal : elle se distingue ainsi du Duchenne.</p></template>
<template data-pop="r26-claudication" data-title="Claudication artérielle et neurogène">
<div class="lab">Artérielle</div>
<p data-src="S3">Douleur du mollet à distance fixe, soulagée à l’arrêt debout.</p>
<div class="lab">Neurogène (sténose lombaire)</div>
<p data-src="S3">Soulagement assis ou penché ; vélo et montée mieux tolérés. La position debout majore la lordose et la sténose canalaire et comprime la queue de cheval. L’examen au repos est souvent normal ; la douleur apparaît à l’hyperextension lombaire.</p>
<div class="lab">Traitement</div>
<p data-src="S3">La chirurgie se discute.</p></template>
<template data-pop="r26-frontale" data-title="Marche frontale">
<div class="lab">Mécanisme</div>
<p data-src="S3">Lésions frontales, pariétales ou calleuses ; atrophie mésencéphalique et dysfonction du réseau cortex moteur – région locomotrice mésencéphalique.</p>
<div class="lab">Signes</div>
<p data-src="S3">Difficulté à se lever et à initier, pieds « aimantés », amélioration après quelques mètres, discordance majeure entre une marche très altérée et des mouvements des jambes quasi normaux assis ou couché, réflexes archaïques.</p>
<div class="lab">Traitement</div>
<p data-src="S3">Causal si possible (dérivation, facteurs de risque vasculaire), sinon physiothérapie. Les antiparkinsoniens n’ont pas d’efficacité démontrée.</p></template>
<template data-pop="r26-thalamique" data-title="Astasie thalamique">
<div class="lab">Mécanisme</div>
<p data-src="S3">Lésion ventrolatérale ou postérieure du thalamus, proche du « pusher syndrome » : la perception de la verticale est altérée.</p>
<div class="lab">Signe</div>
<p data-src="S3">Chute en arrière ou controlatérale sans déficit moteur.</p></template>
<template data-pop="r26-stoppfall" data-title="STOPPFall : 14 classes de médicaments">
<div class="lab">Origine</div>
<p data-src="S6">Consensus Delphi du groupe de travail de l’European Geriatric Medicine Society sur les médicaments qui augmentent le risque de chute, publié en 2021.</p>
<div class="lab">Classes</div>
<p data-src="S6">Anticholinergiques, diurétiques, alpha-bloquants antihypertenseurs, opioïdes, antidépresseurs, antipsychotiques, antiépileptiques, benzodiazépines et apparentés, antihypertenseurs centraux, alpha-bloquants de l’hypertrophie prostatique, antihistaminiques, vasodilatateurs cardiaques, médicaments de l’hyperactivité vésicale. Treize classes sont nommées dans l’extrait lu sur quatorze.</p>
<div class="lab">Limite</div>
<p data-src="S6">Consensus d’experts ; l’efficacité de la déprescription sur les chutes n’est pas démontrée en essai.</p></template>
