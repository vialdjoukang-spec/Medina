<p>Dans cette <button class="w" data-k="r26-vignette">vignette fictive (hypothèses et démarche)</button>, une femme de 82 ans vit seule. Sa fille rapporte deux chutes en six mois, sans perte de connaissance connue. À l’examen, la patiente marche à 0,7 m/s et réalise le <button class="w" data-k="r26-tug">Timed Up and Go (technique et seuil)</button> en 18 secondes. Elle prend une benzodiazépine le soir. Ces valeurs sont pédagogiques ; elles ne proviennent pas d’une patiente réelle.</p>
<p data-src="S3 S5">Le médecin doit répondre à quatre questions dans l’ordre : de quel type de marche s’agit-il, quel niveau du système nerveux ou de l’appareil locomoteur est atteint, existe-t-il une urgence, et quel est le risque de nouvelle chute. La marche mobilise le système nerveux à tous ses niveaux, l’appareil locomoteur et le système cardiorespiratoire ; elle est donc un indicateur sensible de l’état de santé global.</p>
<p data-src="S3 S25">Un trouble de la marche n’est pas une conséquence inévitable du vieillissement. Il signale une maladie sous-jacente qui justifie des examens ciblés. Il précède les chutes, première cause de blessures graves du sujet âgé, et reste sous-diagnostiqué et insuffisamment évalué. La vitesse de marche spontanée est corrélée à l’espérance de vie, et une marche lente chez un sujet âgé non dément prédit mieux une démence future que la plainte cognitive subjective.</p>
<p data-src="S1 S3">Le code R26 est une catégorie de symptômes du chapitre des symptômes et signes (bloc R25–R29). Il désigne un trouble de la marche, de la station ou de la mobilité tant que la cause n’est pas établie. Le cours enseigne donc une démarche : regarder marcher, reconnaître le type de marche, situer le niveau lésionnel, repérer l’urgence, évaluer le risque de chute, puis remplacer le code de symptôme par le diagnostic dès qu’il est posé.</p>
<p data-src="S2 S23">À l’examen fédéral, cette leçon se rattache à quatre <button class="w" data-k="r26-ssp">situations de départ du référentiel PROFILES (SSP 96, 97, 98 et 103)</button> : sens de l’équilibre anormal et chutes, démarche anormale, parésie et paralysie.</p>
<div class="key"><b>Objectifs.</b> Décrire la marche normale et ses valeurs de référence ; reconnaître les grands types de marche pathologique et leur élément discriminant ; repérer les drapeaux rouges ; stratifier le risque de chute selon les recommandations mondiales ; connaître la conduite générale (exercice, déprescription, prévention à domicile) ; connaître les médicaments cités dans les informations professionnelles suisses ; savoir ce que le dossier de recherche ne permet pas d’affirmer.</div>
</section>

<section class="ilot" id="r26-1"><h2><span class="n">1</span>Définition, périmètre et classifications</h2>
<h3>1.1 Marche normale et prérequis</h3>
<p data-src="S3">La <button class="w" data-k="r26-marche-normale">marche normale (définition et prérequis)</button> est rythmique, fluide et sans effort. Les jambes se balancent librement, la posture est droite et les bras se balancent en opposition à la jambe du même côté. Elle exige de pouvoir initier et entretenir une marche rythmique, de maintenir l’équilibre, de disposer de réflexes posturaux, d’une sensibilité et d’une intégration sensorimotrice intactes, d’un contrôle moteur, d’un appareil musculosquelettique et d’une fonction cardiopulmonaire suffisante. Tout trouble de l’un de ces prérequis peut produire une marche anormale.</p>
<h3>1.2 Périmètre du symptôme et sous-catégories</h3>
<p data-src="S1 S2">Le symptôme R26 regroupe cinq situations. La <b>démarche ataxique</b> (R26.0) comprend la démarche titubante ; elle est traitée avec les ataxies cérébelleuse, sensitive, vestibulaire et fonctionnelle (sections 3, 6 et 7). La <b>démarche paralytique</b> (R26.1) comprend la démarche spastique ; elle couvre l’hémiparésie spastique, la paraparésie, le steppage et le dandinement (sections 3, 6 et 10). La <b>difficulté à la marche non classée ailleurs</b> (R26.2) accueille les marches prudente, antalgique, frontale et parkinsonienne tant qu’elles ne sont pas rattachées à un diagnostic. L’<b>immobilité</b> (R26.3) comprend la dépendance au fauteuil roulant et l’alitement ; elle fait l’objet de la section 11. Enfin, les <b>autres anomalies et les anomalies non précisées</b> (R26.8) comprennent l’instabilité debout sans autre précision, avec l’instabilité en station, le tremblement orthostatique et l’astasie.</p>
<p data-src="S1">Le code de symptôme cède la place au diagnostic étiologique dès qu’il est posé. La classification <button class="w" data-k="r26-exclusions">exclut de R26 (règles de codage)</button> l’ataxie héréditaire (G11.-), l’ataxie locomotrice syphilitique (A52.1), l’ataxie sans précision (R27.0) et le syndrome d’immobilité paraplégique (M62.3-). Une ataxie qui ne se limite pas à la marche se code donc R27.0, non R26.0.</p>
<div class="trap"><span class="k">Piège</span> R26 n’est pas un diagnostic. Écrire « R26.0 » dans un dossier pour une ataxie de cause connue, par exemple héréditaire, est une erreur de codage : l’exclusion renvoie à G11.-.</div>
<h3>1.3 Classification clinico-anatomique</h3>
<p data-src="S3">La revue européenne de Vienne ordonne les troubles de la marche selon le niveau atteint, du périphérique au central. Le tableau suit cette hiérarchie, car elle guide l’examen : on commence par éliminer une cause locomotrice ou nerveuse périphérique avant d’attribuer la marche à un trouble cérébral.</p>
<table class="t"><thead><tr><th>Niveau</th><th>Types de marche</th></tr></thead><tbody><tr><td data-src="S3">Musculosquelettique (orthopédique)</td><td data-src="S3">Marche antalgique, marche coxalgique, hyperextension du genou, boiterie par inégalité de longueur des jambes</td></tr><tr><td data-src="S3">Neuromusculaire et myélopathique</td><td data-src="S3">Dandinement (Trendelenburg et Duchenne), steppage, claudication intermittente artérielle ou neurogène (sténose lombaire), marche myélopathique (myélopathie cervicale spondylotique)</td></tr><tr><td data-src="S3">Cérébral</td><td data-src="S3">Marche prudente, spastique (hémiparétique, paraparétique, en ciseaux), ataxique (cérébelleuse, sensitive), frontale ou de niveau supérieur, parkinsonienne avec freezing, marche des syndromes parkinsoniens atypiques, dystonique, choréique, myoclonique, tremblement orthostatique, astasie thalamique, vestibulaire, fonctionnelle</td></tr></tbody></table>
<p data-src="S3">Le tableau situe chaque marche à un étage. Il ne remplace pas l’examen : plusieurs étages peuvent coexister chez le même patient, surtout après 80 ans.</p>
<p data-src="S3">Une seconde classification, celle de <button class="w" data-k="r26-nutt">Nutt, Marsden et Thompson (niveaux bas, moyen et supérieur)</button>, réserve le « niveau supérieur » aux troubles non expliqués par une atteinte périphérique, pyramidale, cérébelleuse ou des noyaux gris : marche frontale, marche prudente, déséquilibre sous-cortical ou frontal, défaut isolé d’initiation. Une classification simplifiée en trois étapes, fondée sur les signes cliniques, a aussi été proposée (revue de Lancet Neurology, 2007) ; le résumé lu ne détaille pas ces étapes, et le cours ne les reconstruit pas. L’approche fondée sur les signes (revue de Neurology, 2020) distingue des catégories de signes : marche ataxique, spastique, faible, antalgique, parkinsonienne, hémiparétique et dystonique.</p>
<h3>1.4 Risque de chute, fragilité et freezing</h3>
<p data-src="S5">Les recommandations mondiales de prévention des chutes (World Falls Guidelines, <button class="w" data-k="r26-wfg">WFG</button>) répartissent les personnes âgées en trois catégories de risque, fondées sur les chutes survenues et sur les troubles de la marche ou de l’équilibre.</p>
<table class="t"><thead><tr><th>Catégorie</th><th>Critères</th></tr></thead><tbody><tr><td data-src="S5">Risque faible</td><td data-src="S5">Aucune chute, ou une chute non grave sans trouble de la marche</td></tr><tr><td data-src="S5">Risque intermédiaire</td><td data-src="S5">Une chute non grave avec trouble de la marche ou de l’équilibre</td></tr><tr><td data-src="S5">Risque élevé</td><td data-src="S5">Chute avec blessure, ou au moins deux chutes en douze mois, ou fragilité, ou incapacité à se relever pendant une heure ou plus, ou perte de connaissance suspectée</td></tr></tbody></table>
<p data-src="S5">Le tableau décide du niveau d’intervention (section 9). Une <button class="w" data-k="r26-chute-grave">chute grave (blessure, séjour au sol, passage aux urgences, perte de connaissance)</button> déplace d’emblée le patient vers la catégorie à risque élevé. La <button class="w" data-k="r26-fragilite">fragilité</button> se définit par un phénotype de cinq critères (vitesse de marche lente, faible activité physique, perte de poids involontaire, épuisement, faiblesse musculaire) : trois critères ou plus définissent la fragilité, un ou deux la préfragilité. La Clinical Frailty Scale, graduée de 1 à 9, retient une fragilité à partir de 4.</p>
<p data-src="S3">Le <button class="w" data-k="r26-freezing">freezing</button>, blocage soudain de la marche chez le parkinsonien, se présente sous trois formes : akinétique pure (rare), piétinement sur place, ou marche à très petits pas.</p>
<div class="key"><b>À retenir.</b> Trois idées : R26 est un symptôme et cède la place au diagnostic ; la hiérarchie musculosquelettique, périphérique, cérébrale oriente l’examen ; la catégorie de risque de chute (faible, intermédiaire, élevé) décide de l’intervention. Le <button class="w" data-k="r26-mnemo">moyen mnémotechnique des critères de risque élevé</button> aide à les retenir.</div>
<div class="quiz ui"><p>Une patiente de 78 ans a chuté une fois sans blessure et marche avec une instabilité notable. Quelle catégorie de risque de chute retient-on ?</p><button data-ok="0">Risque faible</button><button data-ok="1">Risque intermédiaire</button><button data-ok="0">Risque élevé</button><p class="fb" hidden>Une chute non grave associée à un trouble de la marche ou de l’équilibre définit le risque intermédiaire. Le risque élevé exigerait une blessure, au moins deux chutes en douze mois, une fragilité, un séjour au sol d’au moins une heure ou une perte de connaissance suspectée.</p></div>
<button class="pareto-btn ui" data-k="pareto-r26-definition">▲ Loi de Pareto — Question clinique, définition et classifications</button>
</section>

<section class="ilot" id="r26-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p data-src="S8 S9">Les données suisses disponibles décrivent les chutes, non les troubles de la marche. Le Bureau suisse de prévention des accidents (<button class="w" data-k="r26-bfu">BFU</button>) rapporte, en moyenne 2012–2016, environ 88 000 blessés de 65 ans et plus par an et plus de 1500 décès. Sur la période 2015–2019, les chiffres sont de 89 580 blessés de 65 ans et plus par an, dont 45 130 dans le logement privé, et de 1600 décès par an. Les deux séries portent sur des périodes différentes et ne s’additionnent pas.</p>
<table class="t"><thead><tr><th>Indicateur suisse</th><th>Valeur</th><th>Source</th></tr></thead><tbody><tr><td data-src="S8">Blessés de 65 ans et plus par chute, moyenne 2012–2016</td><td data-src="S8">environ 88 000 par an ; plus de 1500 décès</td><td>BFU, support StoppSturz</td></tr><tr><td data-src="S9">Blessés de 65 ans et plus, moyenne 2015–2019</td><td data-src="S9">89 580 par an, dont 45 130 dans le logement privé ; 1600 décès par an</td><td>BFU, documentation 2.250</td></tr><tr><td data-src="S9">Personnes de 65 ans et plus traitées chaque année pour une chute à domicile</td><td data-src="S9">6 %</td><td>BFU, documentation 2.250</td></tr><tr><td data-src="S9">Personnes de 65 ans et plus vivant à domicile</td><td data-src="S9">98,5 % ; 85 % des plus de 80 ans</td><td>BFU, documentation 2.250</td></tr><tr><td data-src="S8">Coûts matériels des chutes</td><td data-src="S8">environ 1,8 milliard CHF par an</td><td>BFU, support StoppSturz</td></tr><tr><td data-src="S8">Population de 65 ans et plus</td><td data-src="S8">1,6 million fin 2019 (18,7 %) ; 2,7 millions attendus en 2050 (25,6 %)</td><td>BFU, d’après l’Office fédéral de la statistique</td></tr></tbody></table>
<p data-src="S8 S9">Le tableau montre que la chute est le mécanisme d’accident le plus fréquent dans le ménage, le jardin et les loisirs, et que la majorité des personnes âgées vivent chez elles. Le logement est donc le premier lieu de prévention.</p>
<p data-src="S3 S4">En Europe, l’<button class="w" data-k="r26-bruneck">étude de population de Bruneck (Tyrol du Sud, 60 à 97 ans)</button> mesure la fréquence des troubles de la marche. Elle trouve 32,2 % de marche anormale ; 38,3 % des personnes de 80 ans et plus gardent une marche normale. La revue de Vienne situe la prévalence à environ 10 % entre 60 et 69 ans et à plus de 60 % après 80 ans. Parmi les causes neurologiques, l’ataxie sensitive est la plus fréquente (18 %), devant la marche parkinsonienne (16 %) et la marche frontale (8 %), puis viennent les marches cérébelleuse, prudente, parétique hypotonique, spastique, vestibulaire et dyskinétique. Environ un tiers des patients ont plusieurs causes neurologiques.</p>
<p data-src="S4">Les troubles non neurologiques sont plus fréquents chez la femme ; aucune association n’apparaît entre trouble neurologique et sexe. Le résumé lu rapporte 24,0 % de troubles neurologiques, 17,4 % de troubles non neurologiques et 9,2 % de troubles mixtes ; la somme de ces trois valeurs dépasse 32,2 %, et le résumé ne précise pas le dénominateur de chacune. Le cours cite donc le total de 32,2 % et la prédominance des causes neurologiques, sans reconstituer la répartition.</p>
<p data-src="S3 S5 S8">Au niveau international, 30 % des personnes de plus de 65 ans chutent chaque année ; l’Organisation mondiale de la santé, citée par le BFU, donne 28 à 35 % des 65 ans et plus et 32 à 42 % des plus de 70 ans. Plus de la moitié des personnes qui chutent rechutent, et 10 à 15 % des chutes causent une blessure grave : traumatisme crânien ou fracture de hanche. Les chutes représentent environ 1 % des dépenses de santé des pays à haut revenu. Les taux sont plus élevés en hôpital gériatrique et en établissement médico-social (<button class="w" data-k="r26-ems">EMS</button>) qu’en population générale ; tous les résidents d’EMS sont à considérer à haut risque.</p>
<p data-src="S7">Le trouble fonctionnel de la marche est fréquent en consultation spécialisée : de 2 à 20 % des patients adressés pour mouvements anormaux ont un trouble fonctionnel, dont 40 % une atteinte de la marche. Les troubles fonctionnels purs de la marche représentent environ 6 à 8,5 %.</p>
<div class="trap"><span class="k">Lacune</span> Le dossier ne contient aucune prévalence suisse des troubles de la marche (et non des seules chutes), ni les taux suisses de chutes et d’escarres à l’hôpital. Le cours n’en déduit aucun chiffre à partir de données étrangères.</div>
<div class="key"><b>À retenir.</b> En Suisse, environ 88 000 à 90 000 personnes de 65 ans et plus sont blessées par une chute chaque année, et 1500 à 1600 en décèdent. Un trouble de la marche touche près d’une personne sur trois entre 60 et 97 ans dans l’étude européenne de référence.</div>
</section>

<section class="ilot" id="r26-3"><h2><span class="n">3</span>Physiopathologie : de la marche normale à la marche anormale</h2>
<h3>3.1 Le cycle de marche normal</h3>
<p data-src="S3">Le <button class="w" data-k="r26-cycle">cycle de marche (phases d’appui et d’oscillation)</button> comprend une phase d’appui, d’environ 60 % du cycle, et une phase d’oscillation, d’environ 40 %. L’appui se subdivise en contact initial, mise en charge, milieu d’appui, fin d’appui et pré-oscillation. Deux phases de double appui, de 10 à 12 % chacune, ont lieu quand les deux pieds touchent le sol.</p>
<figure><svg viewBox="0 0 640 170" role="img" aria-label="Figure 1 — Cycle de marche"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="20" y="50" width="360" height="44"/><rect x="380" y="50" width="240" height="44"/><rect x="20" y="104" width="66" height="26"/><rect x="314" y="104" width="66" height="26"/></g><g fill="currentColor" font-size="14" text-anchor="middle"><text x="200" y="77">Appui — environ 60 %</text><text x="500" y="77">Oscillation — environ 40 %</text><text x="53" y="122" font-size="12">double appui</text><text x="347" y="122" font-size="12">double appui</text><text x="200" y="30">Un cycle = d’un contact du talon au contact suivant du même pied</text></g></svg><figcaption>Figure 1 — Schéma didactique non calibré du cycle de marche : l’appui occupe environ 60 % du cycle, l’oscillation environ 40 %, et chacune des deux phases de double appui dure de 10 à 12 %. La position précise des double appuis dans le cycle est schématique.</figcaption><ol><li>Appui : le pied est au sol</li><li>Oscillation : le pied avance dans l’air</li><li>Double appui : les deux pieds sont au sol</li></ol></figure>
<p data-src="S3">Les valeurs normales servent de point de comparaison : vitesse préférée d’environ 1,4 m/s jusqu’à 59 ans, longueur de cycle de 150 à 170 cm et cadence de 115 à 120 pas par minute chez l’adulte jeune. Avec l’âge, la <button class="w" data-k="r26-vieillissement">marche du sujet âgé</button> ralentit : 1,3 m/s dans la septième décennie et 0,95 m/s après 80 ans (environ 1 % par an), par raccourcissement du pas, la cadence restant stable. La base de sustentation s’élargit d’environ 40 %, soit 8 cm chez la femme âgée et 10 cm chez l’homme.</p>
<h3>3.2 L’intégration sensorielle et motrice</h3>
<p data-src="S3">La marche repose sur l’<button class="w" data-k="r26-integration">intégration des afférences visuelles, vestibulaires et proprioceptives</button>. Un déficit de l’une est partiellement compensé par les autres, par exemple la vue pour la proprioception. L’intégration centrale mobilise le cortex frontal, les noyaux gris, le tronc cérébral et le cervelet ; la voie efférente suit la voie pyramidale, le nerf, la jonction neuromusculaire et le muscle. Un centre locomoteur mésencéphalique, le noyau pédonculopontin, intervient dans la marche automatique.</p>
<p data-src="S3">Quand l’équilibre est menacé, toute personne adopte une <button class="w" data-k="r26-strategie">stratégie protectrice (base élargie, pas courts, double appui prolongé)</button> : elle élargit la base, prolonge le double appui, raccourcit le pas, ralentit et fléchit la posture, par exemple sur un sol verglacé. Le sujet âgé déplace la compensation de la cheville vers la hanche, par perte de proprioception distale, et dépend davantage du système vestibulaire. Ces ajustements sont normaux chez le sujet sain devant une menace ; la marche prudente pathologique se reconnaît à une lenteur disproportionnée aux déficits.</p>
<p data-src="S3">La <button class="w" data-k="r26-cognition">cognition</button> contribue à la sécurité : fonctions exécutives frontales, attention et perception visuospatiale. Arrêter de marcher pour parler prédit les chutes. Le parkinsonien perd la stratégie qui consiste à assurer la posture avant la tâche concurrente.</p>
<h3>3.3 Mécanismes des marches anormales</h3>
<p data-src="S3">Le tableau relie chaque type de marche à la structure atteinte et à la raison du signe : c’est la logique à appliquer devant un patient, plutôt que la mémorisation de descriptions.</p>
<table class="t"><thead><tr><th>Marche</th><th>Structure atteinte</th><th>Mécanisme du signe</th></tr></thead><tbody><tr><td data-src="S3"><button class="w" data-k="r26-cervelet">Ataxie cérébelleuse</button></td><td data-src="S3">Vermis ; hémisphère cérébelleux</td><td data-src="S3">Le vermis contrôle l’équilibre : l’ataxie cérébelleuse de la marche dépend surtout de l’équilibre, moins du placement du pied. Une lésion hémisphérique donne une ataxie homolatérale des membres.</td></tr><tr><td data-src="S3"><button class="w" data-k="r26-sensitive">Ataxie sensitive</button></td><td data-src="S3">Voies proprioceptives</td><td data-src="S3">La perte proprioceptive est compensée par la vue ; la marche s’aggrave donc yeux fermés et dans l’obscurité.</td></tr><tr><td data-src="S3"><button class="w" data-k="r26-steppage">Steppage</button></td><td data-src="S3">Releveurs du pied</td><td data-src="S3">La parésie des releveurs impose un lever exagéré de la jambe pour éviter l’accrochage du pied.</td></tr><tr><td data-src="S3"><button class="w" data-k="r26-trendelenburg">Dandinement</button></td><td data-src="S3">Moyen fessier</td><td data-src="S3">La faiblesse du moyen fessier laisse le bassin tomber du côté oscillant (Trendelenburg) ; le tronc s’incline de manière compensatrice (Duchenne).</td></tr><tr><td data-src="S3"><button class="w" data-k="r26-claudication">Claudication neurogène</button></td><td data-src="S3">Canal lombaire, queue de cheval</td><td data-src="S3">La lordose lombaire en position debout majore la sténose canalaire et comprime la queue de cheval.</td></tr><tr><td data-src="S3"><button class="w" data-k="r26-frontale">Marche frontale</button></td><td data-src="S3">Lobes frontaux, pariétaux ou corps calleux ; réseau cortex moteur – région locomotrice mésencéphalique</td><td data-src="S3">Atrophie mésencéphalique et dysfonction du réseau entre cortex moteur et région locomotrice mésencéphalique.</td></tr><tr><td data-src="S3"><button class="w" data-k="r26-thalamique">Astasie thalamique</button></td><td data-src="S3">Thalamus ventrolatéral ou postérieur</td><td data-src="S3">Proche du « pusher syndrome » : perception altérée de la verticale.</td></tr></tbody></table>
<p data-src="S3">L’immobilité (R26.3) obéit à une physiopathologie différente, abordée à la section 11.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Croire qu’une marche lente et prudente est toujours « normale pour l’âge ». Le ralentissement lié à l’âge est réel, mais une lenteur disproportionnée aux déficits, ou une marche très altérée, relève d’une cause à chercher.</div>
<div class="key"><b>À retenir.</b> Appui 60 % et oscillation 40 % ; vitesse 1,4 m/s avant 60 ans, 0,95 m/s après 80 ans. Chaque type de marche anormale correspond à une structure précise : retenir la structure, puis le signe s’en déduit.</div>
</section>

<section class="ilot" id="r26-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p data-src="S3">Les causes sont <b>neurologiques</b> (sensitives ou motrices), <b>orthopédiques</b> (arthrose, déformations), <b>médicales</b> (insuffisance cardiaque, insuffisance respiratoire, artériopathie oblitérante, obésité) et <b>psychiatriques</b>. Chez le sujet âgé, les causes sont typiquement multiples : polyneuropathie, baisse visuelle, marche frontale sur encéphalopathie vasculaire, gonarthrose ou coxarthrose.</p>
<p data-src="S3">Quand le trouble débute <b>brutalement</b>, les causes cérébrovasculaires, médullaires et neuromusculaires viennent en premier, avec les effets indésirables médicamenteux et les troubles psychiatriques. Les causes médicales aiguës cardiorespiratoires, métaboliques ou infectieuses sont aussi à rechercher.</p>
<h3>4.1 Facteurs de risque de chute en Suisse</h3>
<p data-src="S8">La synthèse suisse citée par le BFU (Grob, 2005) classe les facteurs de risque par risque relatif (RR). Les trois facteurs les plus puissants sont la faiblesse musculaire, l’antécédent de chute et le trouble de la marche ; ils se recherchent à l’interrogatoire et à l’examen.</p>
<table class="t"><thead><tr><th>Facteur</th><th>Risque relatif de chute</th></tr></thead><tbody><tr><td data-src="S8">Faiblesse musculaire</td><td data-src="S8">4,4</td></tr><tr><td data-src="S8">Antécédent de chute</td><td data-src="S8">3,0</td></tr><tr><td data-src="S8">Trouble de la marche</td><td data-src="S8">2,9 (intervalle de confiance 1,3–5,6)</td></tr><tr><td data-src="S8">Trouble de l’équilibre</td><td data-src="S8">2,9</td></tr><tr><td data-src="S8">Aide à la marche</td><td data-src="S8">2,6</td></tr><tr><td data-src="S8">Trouble visuel</td><td data-src="S8">2,5</td></tr><tr><td data-src="S8">Arthrose</td><td data-src="S8">2,4</td></tr><tr><td data-src="S8">Déficit dans les activités de la vie quotidienne</td><td data-src="S8">2,3</td></tr><tr><td data-src="S8">Dépression</td><td data-src="S8">2,2</td></tr><tr><td data-src="S8">Trouble cognitif</td><td data-src="S8">1,8</td></tr><tr><td data-src="S8">Âge supérieur à 80 ans</td><td data-src="S8">1,7</td></tr></tbody></table>
<p data-src="S8 S5">Ces risques relatifs proviennent d’une synthèse de 2005 ; ils décrivent chacun un facteur isolé. Les maladies chroniques qui augmentent le risque comprennent les démences, la maladie de Parkinson, l’ostéoporose chez la femme, le diabète, les cancers et la bronchopneumopathie chronique obstructive. La démence et le trouble cognitif léger doublent le risque de chute et de blessure.</p>
<h3>4.2 Médicaments qui augmentent le risque de chute</h3>
<p data-src="S6">Le consensus européen <button class="w" data-k="r26-stoppfall">STOPPFall (14 classes de médicaments)</button> identifie les classes qui favorisent les chutes : anticholinergiques, diurétiques, alpha-bloquants antihypertenseurs, opioïdes, antidépresseurs, antipsychotiques, antiépileptiques, benzodiazépines et apparentés, antihypertenseurs centraux, alpha-bloquants de l’hypertrophie prostatique, antihistaminiques, vasodilatateurs cardiaques et médicaments de l’hyperactivité vésicale. Le risque intra-classe varie : il est plus élevé pour les opioïdes forts, les tricycliques, les antiépileptiques anciens, les diurétiques de l’anse, les alpha-bloquants non sélectifs, les antihistaminiques de première génération et les sulfonylurées. Le dossier nomme treize classes sur quatorze ; la quatorzième n’est pas identifiée dans l’extrait lu.</p>
<p data-src="S3">La polymédication n’est un risque que si elle inclut des médicaments favorisant les chutes. Compter les médicaments sans les identifier est donc insuffisant.</p>
<h3>4.3 Environnement</h3>
<p data-src="S3 S9">Les tapis sur parquet sont un facteur de chute identifié. La plupart des chutes domestiques surviennent au séjour ou dans la chambre.</p>
<div class="alert"><b>Gravité d’abord.</b> Devant un trouble de la marche d’installation aiguë, ne pas attribuer à l’âge : examiner immédiatement le système nerveux, car une cause cérébrovasculaire, médullaire ou médicamenteuse peut être traitable.</div>
<div class="key"><b>À retenir.</b> Causes neurologiques, orthopédiques, médicales et psychiatriques coexistent chez le sujet âgé. Faiblesse musculaire, antécédent de chute et trouble de la marche sont les trois facteurs de chute les plus puissants du dossier suisse. Les médicaments à risque se repèrent par classe (STOPPFall).</div>
