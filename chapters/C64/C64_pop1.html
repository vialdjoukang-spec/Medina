<template data-pop="c64-biopsie" data-title="La biopsie doit changer une décision"><p>Une carotte peut identifier malignité et histotype, mais un prélèvement insuffisant ne prouve pas la bénignité. Les performances élevées publiées concernent les prélèvements diagnostiques.</p><p>Elle précède une ablation et un traitement systémique sans histologie ; son utilité avant chirurgie ou surveillance dépend de la décision. L’essaimage est rare mais non nul.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a>.</p></template>
<template data-pop="c64-oncocytome" data-title="Oncocytaire ne signifie pas bénin avec certitude"><p>L’imagerie ne distingue pas de manière fiable tous les oncocytomes des carcinomes. Une carotte oncocytaire peut manquer un contingent chromophobe ou d’autres éléments nécessaires à la classification.</p><p>Selon OMS 2022, une biopsie à l’aiguille ne permet pas d’affirmer définitivement tous les oncocytomes. Confronter tissu, imagerie et conséquences de la décision.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a>.</p></template>
<template data-pop="c64-surveillance" data-title="Surveillance active et attente symptomatique"><p>La surveillance active suit la lésion par imagerie avec possibilité de traitement différé. Elle suppose une organisation, une discussion des critères de changement et l’accord éclairé du patient.</p><p>L’attente vigilante vise surtout le contrôle des symptômes lorsque l’on n’anticipe pas d’intervention active ultérieure. Les deux démarches n’ont pas le même objectif.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a>.</p></template>
<template data-pop="c64-vhl" data-title="VHL : voie tumorale et syndrome héréditaire"><p>L’inactivation de VHL dans de nombreux carcinomes à cellules claires favorise l’accumulation de HIF et l’expression de médiateurs proangiogéniques. Il s’agit d’un mécanisme tumoral fréquent.</p><p>Une mutation dans la tumeur n’établit pas une variante constitutionnelle transmissible. Le conseil génétique et les tests adaptés répondent à cette autre question.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.5.2,pp.57–60</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.5,p.24 et§8,pp.75–77</a>.</p></template>
<template data-pop="c64-hif" data-title="Hypoxie, facteurs de transcription et cible"><p>Les facteurs induits par l’hypoxie participent à une réponse cellulaire au manque d’oxygène. Leur accumulation dans la voie VHL altérée favorise notamment l’expression de VEGF et PDGF.</p><p>L’existence d’une cible ne garantit pas une réponse. Belzutifan cible HIF-2α dans certaines situations étudiées ; aucune dose ni autorisation suisse n’est déduite ici de son mécanisme.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.5.2,pp.57–60</a>.</p></template>
<template data-pop="c64-vegf" data-title="Angiogenèse et toxicités vasculaires"><p>La voie VEGF participe à l’angiogenèse tumorale. Les inhibiteurs de récepteurs à tyrosine kinase ont des profils qui se recouvrent sans être identiques.</p><p>Hypertension et protéinurie font partie des risques de plusieurs agents. Surveiller pression et urines ; ne pas remplacer les adaptations propres au produit par un palier commun.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.5.2,pp.57–60</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680664710014" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — Indications ; posologie ; fonctions ; précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680660850011" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie ; adaptations ; sécurité</a>.</p></template>
<template data-pop="c64-thrombus" data-title="Une extension veineuse de tissu tumoral"><p>La tumeur peut s’étendre dans une veine rénale puis dans la veine cave. La hauteur et l’invasion de paroi influencent la classification et la planification thérapeutique.</p><p>Ce tissu n’est pas automatiquement une thrombose sanguine ordinaire. L’imagerie et l’équipe spécialisée distinguent les composantes et décident chirurgie, traitement systémique ou mesures associées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §4,pp.17–18,tableau 4.1</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a>.</p></template>
<template data-pop="c64-nephrectomie" data-title="Préserver du parenchyme sans perdre l’objectif oncologique"><p>La néphrectomie partielle retire la tumeur avec conservation d’une partie du rein. Elle est privilégiée pour T1 si appropriée ; localisation, complexité et réserve fonctionnelle comptent.</p><p>L’avantage de préservation fonctionnelle ne signifie ni risque nul ni preuve certaine d’un gain de survie globale contre la chirurgie radicale dans toutes les populations.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.2,pp.32–34,39–40,44</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a>.</p></template>
<template data-pop="c64-bosniak" data-title="Classer une lésion kystique, pas toute masse"><p>Bosniak 2019 combine caractères de paroi, septa, nodules et rehaussement. La version et la modalité doivent être identifiées dans le compte rendu.</p><p>I et II sont habituellement bénins ; IIF nécessite surveillance ; III et IV conduisent à une discussion proportionnée au risque. Les séries de lésions opérées surestiment parfois la malignité de toutes les lésions découvertes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a>.</p></template>
<template data-pop="c64-sarcomatoide" data-title="Une dédifférenciation, pas un histotype autonome"><p>Le contingent sarcomatoïde traduit une dédifférenciation agressive pouvant apparaître dans plusieurs histotypes. Il ne constitue pas simplement une tumeur de grande taille.</p><p>Sa présence influence le pronostic et les preuves thérapeutiques, notamment l’intérêt d’associations à base d’immunothérapie dans certaines maladies avancées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a>.</p></template>
<template data-pop="c64-grade" data-title="Grade, stade et histotype"><p>Le grade décrit des caractères microscopiques d’agressivité ; le stade décrit l’extension anatomique ; l’histotype décrit la famille tumorale. Une petite tumeur peut avoir un haut grade.</p><p>WHO/ISUP s’applique notamment aux cellules claires et papillaires, pas au chromophobe. La biopsie peut sous-échantillonner les zones les plus agressives.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §3.4,pp.10–16</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.3 et recommandations,pp.22–24</a>.</p></template>
<template data-pop="c64-pd1" data-title="Lever un frein immunitaire expose aussi les tissus sains"><p>Pembrolizumab et nivolumab ciblent PD-1. Ils peuvent restaurer une activité antitumorale mais provoquer inflammation de divers organes, parfois après l’arrêt.</p><p>Le dosage de PD-L1 n’est pas un test de sélection de routine suffisant dans le RCC. Une toxicité se traite selon organe et grade, avec suspension ou arrêt prévu par FI.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.5.2,pp.57–60</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.4,p.55 ;§7.5,pp.60,65–71</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p></template>
<template data-pop="c64-protection" data-title="Fonction globale et coût d’une intervention"><p>Le rein opposé et le parenchyme restant contribuent au débit global. Une créatinine normale n’exclut pas une tumeur ; une petite masse ne garantit pas une grande réserve.</p><p>Documenter fonction antérieure, protéines urinaires et comorbidités ; discuter fonction séparée si elle change la stratégie. Le suivi rénal se poursuit au-delà du calendrier oncologique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §9,pp.78–81,tableau 9.1</a>.</p></template>
<template data-pop="c64-genetique" data-title="Quand envisager une prédisposition ?"><p>Âge ≤46 ans, bilatéralité, multifocalité, histoire familiale ou histologie évocatrice motivent une évaluation selon EAU. Les signes extrarénaux peuvent orienter le syndrome.</p><p>VHL, Birt–Hogg–Dubé et FH ont des risques différents. Une stratégie de surveillance fondée sur un seuil de taille dans VHL ne s’étend pas aux tumeurs FH agressives.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.5,p.24 et§8,pp.75–77</a>.</p></template>
<template data-pop="c64-toxicite" data-title="Un symptôme nouveau doit être attribué avec méthode"><p>Colite, pneumopathie, hépatite, néphrite, endocrinopathie ou myocardite peuvent survenir sous inhibiteur de point de contrôle. Plusieurs organes peuvent être atteints simultanément.</p><p>Évaluer gravité et causes concurrentes, contacter l’équipe et appliquer les critères spécifiques de suspension/arrêt. Une dose universelle de corticoïde ou une baisse improvisée de l’anticorps n’est pas une conduite suffisante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680656600019" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; doses ; organes ; contre-indications</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680617980013" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie combinée et durée</a>.</p></template>
<template data-pop="c64-imdc" data-title="Calculer IMDC sans changer ses seuils"><p>Compter un point pour chaque facteur : Karnofsky &lt;80 % ; délai diagnostic–traitement systémique &lt;1 an ; hémoglobine sous la limite inférieure ; calcium corrigé, neutrophiles ou plaquettes au-dessus de leur limite supérieure. Les normes sont celles du laboratoire.</p><p>0 point : favorable ; 1–2 : intermédiaire ; ≥3 : défavorable. Exemple fictif : délai de quatre mois, anémie et neutrophiles élevés = trois points. Les autres facteurs doivent être réellement connus, pas supposés absents.</p><p>Le score concerne la maladie métastatique et le contexte de traitement systémique. Il ne remplace ni le TNM ni les critères d’adjuvant après chirurgie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a>.</p></template>
<template data-pop="c64-leibovich" data-title="Leibovich 2003 : exemple après chirurgie"><p>Pour un carcinome à cellules claires opéré, le score utilise pT, statut ganglionnaire, taille, grade et nécrose. Les points détaillés figurent dans Examens : 0–2 faible, 3–5 intermédiaire et ≥6 élevé.</p><p>Exemple fictif : pT1b = 2 points ; N0 = 0 ; taille 5 cm = 0 ; grade 2 = 0 ; absence de nécrose = 0. Total 2, groupe faible. Modifier l’histotype ou manquer la donnée de nécrose interdit de prétendre au même calcul complet.</p><p>Le score guide notamment la stratification du suivi. Il ne promet pas l’absence de récidive et ne constitue pas une indication d’immunothérapie à lui seul.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §6,pp.25–31</a> ; <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §9,pp.78–81,tableau 9.1</a>.</p></template>
<template data-pop="c64-adjuvant" data-title="Adjuvant : vérifier population, délai et bénéfice"><p>KEYNOTE-564 étudie certains carcinomes à cellules claires à risque accru après résection : pT2 grade 4/sarcomatoïde N0M0 ; pT3 tout grade N0M0 ; pT4 N0M0 ; tout pT N+M0 ; ou M1 sans maladie résiduelle après résection complète dans l’année suivant la néphrectomie.</p><p>EAU propose restadification et début préférentiellement à 12–16 semaines après néphrectomie. La FI suisse de Keytruda prévoit jusqu’à 12 mois en adjuvant. Le bénéfice doit être mis en balance avec toxicité immune parfois durable et risque de traiter une personne qui n’aurait pas récidivé.</p><p>À 48 mois, les survies globales rapportées sont 91,2 % contre 86,0 % ; le HR de décès est 0,62. La différence absolue à cet horizon est 5,2 points, pas 38 points. Les essais négatifs d’autres agents empêchent d’affirmer un effet de classe.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §7.3.5,pp.48–50,tableau 7.1p.52,recommandationsp.53</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" rel="noopener" target="_blank">Information professionnelle suisse Swissmedic/AIPS via AmiKo — RCC ; posologie IV ; insuffisances ; toxicités immunes</a>.</p></template>
<template data-pop="c64-rehaussement" data-title="Rehaussement : calcul, unité et limite"><p>Comparer la densité avant et après contraste dans une région pertinente. Exemple fictif : 63 HU − 28 HU = 35 HU. Le guide EAU retient un gain d’au moins 15 HU comme indice de rehaussement de tissu viable.</p><p>Vérifier phases, région d’intérêt, taille et artefacts. Le gain n’est ni un pourcentage de malignité ni le grade. Oncocytome et certaines autres lésions peuvent aussi rehausser ; l’histologie reste une question distincte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://d56bochluxqnz.cloudfront.net/documents/full-guideline/EAU-Guidelines-on-Renal-Cell-Carcinoma-2026_2026-07-05-195750_dguv.pdf" rel="noopener" target="_blank">EAU, Renal Cell Carcinoma, limited update March 2026 — §5.1–5.2,pp.18–22</a>.</p></template>
