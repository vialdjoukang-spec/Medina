<template data-pop="g94-cim" data-title="Périmètre de G94 : sous-catégories, renvois et exclusions">
<div class="lab">Principe</div><p>G94 est une catégorie astérisque : elle ne se code qu’avec le code croix de la maladie primaire. Le libellé officiel suisse de la catégorie est « Autres affections du cerveau au cours de maladies classées ailleurs ».</p>
<div class="lab">Sous-catégories</div><p>G94.0 est l’hydrocéphalie au cours de maladies infectieuses et parasitaires (maladie primaire dans les codes A00 à B99). G94.1 est l’hydrocéphalie au cours de maladies tumorales (maladie primaire dans les codes C00 à D48). G94.2 est l’hydrocéphalie au cours d’autres maladies classées ailleurs. G94.3 regroupe les encéphalopathies au cours d’autres maladies : G94.30 pour les maladies endocriniennes et métaboliques, G94.31 pour les maladies infectieuses et parasitaires, G94.32 pour l’encéphalopathie septique, G94.39 pour l’encéphalopathie non précisée. G94.8 regroupe les autres affections précisées du cerveau.</p>
<div class="lab">Encéphalopathie septique</div><p>G94.32 inclut l’encéphalopathie au cours d’un sepsis bactérien, fongique, à protozoaires ou viral sans précision ; les renvois croix sont A41.9, B48.80, B60.80 et B34.80. L’encéphalopathie infectieuse sans sepsis relève de G94.31, et G94.31 exclut l’encéphalopathie septique.</p>
<div class="lab">Exclusion</div><p>L’encéphalopathie hépatique est exclue de G94.3 et codée K72.7.</p>
<div class="lab">Limite</div><p>La version allemande est la source ; les libellés français viennent du catalogue de l’Office fédéral de la statistique repris dans le dépôt. Le codage croix de la carence en thiamine (E51) n’est pas vérifié dans la source lue.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G90–G99</a>.</p>
</template>
<template data-pop="g94-sae-def" data-title="Encéphalopathie associée au sepsis : définition et spectre">
<div class="lab">Définition</div><p>Encéphalopathie aiguë survenant pendant un sepsis ou un choc septique et non attribuable à une autre cause que le sepsis lui-même. C’est un diagnostic d’exclusion.</p>
<div class="lab">Fréquence</div><p>Jusqu’à 70 % des patients septiques admis en soins intensifs. Dans une série de 50 patients non sédatés avec un score de Glasgow inférieur à 15, la fréquence est de 54 % ; dans une cohorte multicentrique française, de 53 %.</p>
<div class="lab">Spectre</div><p>Du délire au coma, avec anomalies électroencéphalographiques et crises. Un délire léger est observé dans 19 % des cas et un coma dans 40 % ; les formes hypoactives et le coma prédominent, l’agitation concerne environ 10 % des patients, les crises convulsives environ 2 % et les signes focaux environ 1 %. La durée médiane du délire septique est de trois jours (intervalle interquartile 2 à 6).</p>
<div class="lab">Limite</div><p>La revue est narrative et non une recommandation.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a> ; <a href="https://doi.org/10.1007/s00134-026-08489-0" target="_blank" rel="noopener">Shankar-Hari et collaborateurs, Intensive Care Medicine 2026 (résumé)</a>.</p>
</template>
<template data-pop="g94-sae-meca" data-title="Chaîne physiopathologique de l’encéphalopathie septique">
<div class="lab">État normal</div><p>Barrière hémato-encéphalique étanche, couplage neurovasculaire fonctionnel, neurotransmission équilibrée.</p>
<div class="lab">Perturbation</div><p>Les cytokines pro-inflammatoires altèrent la barrière. Cellules immunitaires et médiateurs pénètrent dans le tissu. La microglie activée libère cytokines et espèces réactives de l’oxygène, d’où stress oxydatif et lésion neuronale. L’hypoxie cérébrale, les troubles métaboliques, les altérations microvasculaires et le déséquilibre des neurotransmetteurs participent au tableau.</p>
<div class="lab">Manifestation</div><p>Délire, coma, anomalies électroencéphalographiques, crises. Régions vulnérables : cortex frontal, hippocampe, système limbique, tronc cérébral.</p>
<div class="lab">Limite</div><p>Les processus sont décrits dans des revues ; le poids relatif de chacun reste débattu dans les sources.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a> ; <a href="https://doi.org/10.1007/s00134-026-08489-0" target="_blank" rel="noopener">Shankar-Hari et collaborateurs, Intensive Care Medicine 2026 (résumé)</a>.</p>
</template>
<template data-pop="g94-bhe" data-title="Barrière hémato-encéphalique">
<div class="lab">Rôle</div><p>À l’état normal, la barrière hémato-encéphalique reste étanche, ce qui conditionne l’équilibre du tissu cérébral.</p>
<div class="lab">Dans le sepsis</div><p>Les cytokines pro-inflammatoires l’altèrent : cellules immunitaires et médiateurs entrent dans le cerveau, ce qui déclenche l’activation de la microglie.</p>
<div class="lab">Limite</div><p>La structure cellulaire de la barrière n’est pas décrite dans le dossier de sources.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a> ; <a href="https://doi.org/10.1007/s00134-026-08489-0" target="_blank" rel="noopener">Shankar-Hari et collaborateurs, Intensive Care Medicine 2026 (résumé)</a>.</p>
</template>
<template data-pop="g94-delire" data-title="Spectre clinique : du délire au coma">
<div class="lab">Formes</div><p>Les formes hypoactives et le coma sont les plus fréquentes ; l’agitation est rare (environ 10 %). Un patient calme n’est donc pas un patient indemne.</p>
<div class="lab">Dépistage</div><p>La revue recommande des outils validés de dépistage du délire, car le délire est sous-diagnostiqué sans dépistage systématique.</p>
<div class="lab">Signes associés</div><p>Crises convulsives (environ 2 %), signes focaux (environ 1 %) : leur présence doit faire chercher une autre cause.</p>
<div class="lab">Limite</div><p>Les pourcentages décrivent une cohorte précise.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a>.</p>
</template>
<template data-pop="g94-gcs" data-title="Score de Glasgow et mortalité dans l’encéphalopathie septique">
<div class="lab">Définition</div><p>Le score de Glasgow évalue la conscience sur 15 points ; plus il est bas, plus l’atteinte est grave.</p>
<div class="lab">Données</div><p>La mortalité augmente avec la gravité : pour un score de 3 à 8, le rapport de risque est de 3,37 (intervalle de confiance à 95 % 2,82 à 4,03) ; pour un score de 13 à 14, il est de 1,38.</p>
<div class="lab">Limite</div><p>Le rapport de risque est une association dans une cohorte et ne mesure pas l’effet d’un traitement.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a>.</p>
</template>
<template data-pop="g94-cibles" data-title="Cibles systémiques proposées pour protéger le cerveau septique">
<div class="lab">Cibles (propositions d’experts)</div><p>Pression artérielle moyenne de 65 à 80 mmHg ; PaO₂ de 80 à 120 mmHg ; PaCO₂ de 35 à 45 mmHg ; température de 36 à 38,3 °C ; natrémie de 135 à 145 mmol/L ; glycémie de 5 à 10 mmol/L ; hémoglobine supérieure à 7 g/dL.</p>
<div class="lab">Risques associés</div><p>Une hypercapnie supérieure à 45 mmHg, une hypernatrémie et une glycémie inférieure à 3 ou supérieure à 10 mmol/L sont associées à un risque accru.</p>
<div class="lab">Cohorte OUTCOMEREA</div><p>Chez 995 patients ventilés avec un score de Glasgow d’au plus 13, la non-correction à trois jours de la pression artérielle (hazard ratio ajusté 1,77), de l’oxygénation (1,78), de la température (1,46) et de la glycémie (1,41) est associée à la mortalité.</p>
<div class="lab">Limite</div><p>Ces cibles ne sont pas des seuils validés par essai randomisé ; l’étude OUTCOMEREA est rétrospective et ne prouve pas la causalité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a> ; <a href="https://doi.org/10.1186/s40560-024-00773-9" target="_blank" rel="noopener">Thy et collaborateurs, OUTCOMEREA 2025 (résumé)</a>.</p>
</template>
<template data-pop="g94-sedation" data-title="Sédation chez le patient septique">
<div class="lab">Éviter</div><p>Le midazolam est associé de façon indépendante à l’encéphalopathie.</p>
<div class="lab">Dexmédétomidine</div><p>Deux essais randomisés n’ont pas montré de réduction du délire ou du coma par rapport à la sédation standard.</p>
<div class="lab">Confusion de l’évaluation</div><p>Les sédatifs sont un facteur confondant de l’électroencéphalogramme.</p>
<div class="lab">Limite</div><p>Aucune posologie de sédatif n’est donnée dans le dossier de sources.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a>.</p>
</template>
<template data-pop="g94-cefepime" data-title="Neurotoxicité du céfépime">
<div class="lab">Description</div><p>Le céfépime est l’antibiotique neurotoxique le plus souvent rapporté. Le facteur principal est l’insuffisance rénale.</p>
<div class="lab">Clinique</div><p>Délai médian d’apparition de 4 jours. Confusion chez 93 % des patients, myoclonies chez 37 %, crises non convulsives chez 28 %.</p>
<div class="lab">Concentrations</div><p>Risque si la concentration résiduelle dépasse 20 mg/L ; aucune toxicité sous 7,7 mg/L, toxicité constante au-delà de 38,1 mg/L (étude rétrospective).</p>
<div class="lab">Conduite</div><p>Vérifier la fonction rénale et rechercher des crises non convulsives par électroencéphalogramme en cas d’aggravation de la conscience.</p>
<div class="lab">Limite</div><p>La conduite thérapeutique précise (ajustement ou arrêt) n’est pas détaillée dans le dossier.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a>.</p>
</template>
<template data-pop="g94-basilaire" data-title="Occlusion de l’artère basilaire et coma inexpliqué">
<div class="lab">Donnée</div><p>L’occlusion basilaire concerne jusqu’à 10 % des comas inexpliqués. Plus de 40 % de ces occlusions sont manquées sur un scanner sans contraste.</p>
<div class="lab">Conséquence</div><p>Un coma inexpliqué chez un patient septique n’est pas attribué à l’encéphalopathie septique avant une imagerie adaptée.</p>
<div class="lab">Limite</div><p>Le traitement de l’occlusion basilaire n’est pas détaillé dans le dossier de sources.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a>.</p>
</template>
<template data-pop="g94-sequelles" data-title="Devenir à long terme après un sepsis avec encéphalopathie">
<div class="lab">Cognition</div><p>Séquelles cognitives et incapacité fonctionnelle fréquentes. Le sepsis est associé à un risque accru de démence dans une cohorte de 9 ans, et à une atrophie de l’hippocampe.</p>
<div class="lab">Crises</div><p>Incidence annuelle de 1,29 % après un sepsis ; rapport de taux d’incidence 4,98 par rapport à la population générale.</p>
<div class="lab">Psychisme</div><p>Stress post-traumatique chez 12 % des patients à six mois.</p>
<div class="lab">Conséquence</div><p>Surveillance à long terme des survivants.</p>
<div class="lab">Limite</div><p>Associations observées, sans preuve de causalité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a> ; <a href="https://doi.org/10.1007/s00134-026-08489-0" target="_blank" rel="noopener">Shankar-Hari et collaborateurs, Intensive Care Medicine 2026 (résumé)</a>.</p>
</template>
<template data-pop="g94-hepatique" data-title="Encéphalopathie hépatique : exclue de G94">
<div class="lab">Règle</div><p>L’encéphalopathie hépatique n’appartient pas à G94.3 ; elle est codée K72.7.</p>
<div class="lab">Place dans le diagnostic différentiel</div><p>Elle n’est citée ici que comme diagnostic différentiel. Les recommandations européennes sur sa prise en charge (European Association for the Study of the Liver, 2022) existent mais n’ont pas été lues au-delà du résumé.</p>
<div class="lab">Limite</div><p>Aucun contenu clinique sur cette entité n’est enseigné ici.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G90–G99</a> ; <a href="https://doi.org/10.1016/j.jhep.2022.06.001" target="_blank" rel="noopener">EASL 2022, encéphalopathie hépatique (résumé)</a>.</p>
</template>
