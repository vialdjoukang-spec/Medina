<template data-pop="g94-meningite-hydro" data-title="Hydrocéphalie de la méningite bactérienne de l’adulte">
<div class="lab">Cohorte</div><p>Cohorte nationale néerlandaise prospective 2006–2009 : hydrocéphalie dans 26 épisodes sur 577 (5 %) de méningite bactérienne communautaire de l’adulte. Elle est communicante dans tous les cas sauf un, et présente dès l’admission dans 69 % des cas.</p>
<div class="lab">Germes</div><p><i>Streptococcus pneumoniae</i> dans 54 % des cas, <i>Listeria monocytogenes</i> dans 15 %.</p>
<div class="lab">Pronostic</div><p>Décès dans 50 % des cas, évolution défavorable dans 69 %. L’hydrocéphalie est un prédicteur indépendant de décès (odds ratio 7,81 ; intervalle de confiance à 95 % 2,91 à 20,8).</p>
<div class="lab">Interventions</div><p>Deux patients (8 %) ont eu des ponctions lombaires répétées, quatre (15 %) un drain ventriculaire externe, avec un délai médian de 12 heures entre le diagnostic et la dérivation ; tous les patients dérivés sont décédés ou ont eu une évolution défavorable. Les auteurs ne concluent pas à l’inefficacité : effectifs minimes et biais d’indication.</p>
<div class="lab">Limite</div><p>Résumé seulement ; la recommandation européenne ESCMID 2016 n’a pas pu être lue.</p><p class="src">Références : <a href="https://doi.org/10.1212/WNL.0b013e3181f11e10" target="_blank" rel="noopener">Kasanmoentalib et collaborateurs, Neurology 2010 (résumé)</a>.</p>
</template>
<template data-pop="g94-tbm" data-title="Méningite tuberculeuse : soins neuro-intensifs">
<div class="lab">Gravité</div><p>Forme la plus grave de tuberculose, souvent critique, avec mortalité élevée.</p>
<div class="lab">Objectifs</div><p>Réduire la pression intracrânienne et optimiser la perfusion cérébrale, tout en tuant le bacille et en contrôlant l’inflammation intracérébrale.</p>
<div class="lab">Incertitudes</div><p>La prise en charge optimale de l’hydrocéphalie, des réactions paradoxales et de l’hyponatrémie (fréquente) n’est pas établie ; la base de preuve est pauvre.</p>
<div class="lab">Limite</div><p>Résumé seulement ; contexte surtout de pays à forte endémie.</p><p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(19)30154-1" target="_blank" rel="noopener">Donovan et collaborateurs, Lancet Neurology 2019 (résumé)</a>.</p>
</template>
<template data-pop="g94-ml" data-title="Métastases leptoméningées : alerte et critères">
<div class="lab">Qui y penser</div><p>Tout patient avec un cancer du sein, du poumon ou un mélanome présentant des symptômes neurologiques (EANO niveau III, grade C ; ESMO niveau IV, grade B).</p>
<div class="lab">Symptômes</div><p>Céphalées, nausées et vomissements, troubles cognitifs, troubles de la marche, paralysies des nerfs crâniens (II, III, IV, VI, VII, VIII), signes radiculaires, douleurs cervicales ou dorsales. Une atteinte multifocale est très évocatrice.</p>
<div class="lab">Hydrocéphalie</div><p>Présente chez 11 à 17 % des patients. Une hydrocéphalie isolée, sans autre argument, ne suffit pas à poser le diagnostic.</p>
<div class="lab">Critères</div><p>Type I : cytologie ou biopsie positive (confirmé). Type II : cytologie négative ou douteuse avec clinique ou imagerie évocatrice (probable ou possible).</p>
<div class="lab">Pronostic</div><p>Survie médiane 3,8 à 5,4 mois (sein), 4,2 à 8,1 mois (poumon), 4,8 mois (mélanome) ; la plupart des déficits sont irréversibles.</p>
<div class="lab">Limite</div><p>Niveaux de preuve surtout III à V.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023, métastases leptoméningées</a>.</p>
</template>
<template data-pop="g94-lcr-ml" data-title="Liquide cérébrospinal dans les métastases leptoméningées">
<div class="lab">Prélèvement</div><p>Plus de 10 mL (minimum 5 mL), traité en moins de 30 minutes. Une seconde ponction est faite si la première est négative ou douteuse.</p>
<div class="lab">Résultats</div><p>Cytologie positive au diagnostic dans 60,5 à 83 % ; pression d’ouverture supérieure à 200 mm H₂O dans 21 à 42 % ; leucocytes supérieurs à 4/mm³ dans 39 à 77,5 % ; protéines supérieures à 500 mg/L dans 56 à 91 %.</p>
<div class="lab">Limite</div><p>Une valeur de glucose du liquide paraît erronée dans la transcription de la source et n’est pas reprise.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023, métastases leptoméningées</a>.</p>
</template>
<template data-pop="g94-flux" data-title="Études de flux du liquide cérébrospinal">
<div class="lab">Indication</div><p>Suspicion de blocage du flux, y compris hydrocéphalie, avant tout traitement intrathécal. Les traceurs cités sont l’indium-111-DTPA et le technétium-99m-MAA.</p>
<div class="lab">Conséquence</div><p>Le traitement intrathécal n’est pas approprié en présence d’un blocage du flux. L’absence de blocage est associée à un meilleur pronostic.</p>
<div class="lab">Limite</div><p>Association pronostique, non causalité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023, métastases leptoméningées</a>.</p>
</template>
<template data-pop="g94-dvp" data-title="Dérivation ventriculo-péritonéale dans les métastases leptoméningées">
<div class="lab">Effet</div><p>Soulagement durable de l’hydrocéphalie symptomatique, sans risque pertinent d’ensemencement péritonéal dans les tumeurs solides. Le drainage soulage rapidement l’hypertension intracrânienne.</p>
<div class="lab">Résultats (190 patients)</div><p>Amélioration 83 % ; aucune complication 79 % ; infection 5 % ; hygrome ou hématome sous-dural 13 % (6,3 % symptomatique) ; dysfonction 5 % ; externalisation, retrait ou révision 8 %.</p>
<div class="lab">Valves programmables</div><p>Réglage temporaire à pression maximale ou fermeture pendant 12 à 24 heures pour permettre la distribution d’un médicament intrathécal, après un test d’occlusion d’au moins 12 heures.</p>
<div class="lab">Limite</div><p>Série observationnelle.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">EANO-ESMO 2023, métastases leptoméningées</a>.</p>
</template>
<template data-pop="g94-eeg" data-title="Électroencéphalogramme dans l’encéphalopathie septique">
<div class="lab">Fréquences</div><p>Ralentissement thêta 10 à 50 % ; delta 30 à 60 % ; bas voltage ou discontinu 10 à 60 % ; bouffées-suppressions 3 à 8 % ; ondes triphasiques 6 à 20 % ; décharges périodiques 5 à 20 % ; crises électrographiques 0 à 30 %, surtout non convulsives.</p>
<div class="lab">Pronostic</div><p>L’absence de réactivité est associée de façon indépendante à la mortalité en soins intensifs et à un an.</p>
<div class="lab">Limite</div><p>Les sédatifs sont un facteur confondant.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a>.</p>
</template>
<template data-pop="g94-imagerie-sae" data-title="Scanner et résonance magnétique dans l’encéphalopathie septique">
<div class="lab">Scanner sans contraste</div><p>Anormal dans 11 % des encéphalopathies aiguës non traumatiques ; en soins intensifs médicaux, infarctus 5 % et hémorragie 4 %.</p>
<div class="lab">Résonance magnétique</div><p>Indiquée si l’encéphalopathie persiste, en cas de crises ou de signes focaux : lésions chez plus de 50 % (parenchymateuses environ 55 %, ischémie 14 à 27 %, substance blanche 14 à 81 %, syndrome d’encéphalopathie postérieure réversible 9 %, atrophie environ 16 %).</p>
<div class="lab">Limite</div><p>Fourchettes larges selon les séries.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10552444/" target="_blank" rel="noopener">Sonneville et collaborateurs, Critical Care 2023</a>.</p>
</template>
<template data-pop="g94-wernicke" data-title="Encéphalopathie de Wernicke : diagnostic et traitement">
<div class="lab">Définition</div><p>Évitable et traitable, mais souvent non diagnostiquée du vivant.</p>
<div class="lab">Diagnostic</div><p>Chez l’alcoolique, deux des quatre signes suffisent : carences alimentaires, signes oculaires, dysfonction cérébelleuse, altération de l’état mental ou trouble mnésique léger (niveau B). À suspecter dans toute situation pouvant entraîner une carence en thiamine. Dosage de la thiamine totale sanguine immédiatement avant l’administration ; résonance magnétique pour étayer le diagnostic (niveau B).</p>
<div class="lab">Traitement</div><p>Thiamine avant tout glucide, 200 mg trois fois par jour, de préférence par voie intraveineuse (niveau C) ; sécurité très bonne (niveau B). Thiamine parentérale à tous les sujets à risque admis aux urgences. Après chirurgie bariatrique, surveillance d’au moins six mois (niveau B).</p>
<div class="lab">Limite</div><p>Résumé seulement ; recommandation ancienne (2010), seule recommandation européenne identifiée.</p><p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2010.03153.x" target="_blank" rel="noopener">EFNS 2010, encéphalopathie de Wernicke (résumé)</a>.</p>
</template>
<template data-pop="g94-thiamine-meca" data-title="Thiamine : mécanisme biochimique">
<div class="lab">Rôle</div><p>Le pyrophosphate de thiamine est le groupe actif d’enzymes de la dégradation des glucides, du cycle de l’acide citrique et de la voie des pentoses (transcétolase).</p>
<div class="lab">Besoin et réserves</div><p>Environ 0,4 mg pour 4200 kJ de glucides ; la demi-vie est de 10 à 20 jours avec des apports normaux de 1,5 à 2,5 mg par jour.</p>
<div class="lab">Conséquence</div><p>L’apport glucidique augmente la demande en thiamine.</p><p class="src">Références : information professionnelle suisse de Benerva® (Swissmedic, avril 2019, consultée via AmiKo le 15 octobre 2026).</p>
</template>
<template data-pop="g94-thiamine" data-title="Benerva® (thiamine) : monographie et divergence des sources">
<div class="lab">Indication</div><p>L’information professionnelle suisse cite explicitement l’encéphalopathie de Wernicke.</p>
<div class="lab">Posologie</div><p>Traitement parentéral (voie intramusculaire ou intraveineuse lente) à des doses quotidiennes pouvant atteindre 200 mg ; la voie intraveineuse est réservée aux patients hospitalisés.</p>
<div class="lab">Effets indésirables</div><p>Réactions anaphylactoïdes possibles ; la voie orale est préférée lorsque c’est possible.</p>
<div class="lab">Divergence à arbitrer</div><p>La recommandation européenne de 2010 propose 3 × 200 mg par jour par voie intraveineuse, l’information professionnelle suisse jusqu’à 200 mg par jour. L’information professionnelle est le texte réglementaire suisse ; la recommandation européenne est la plus récente des recommandations cliniques lues. Le choix de la dose est donc une décision clinique justifiée par la gravité, l’établissement et la voie.</p>
<div class="lab">Limite</div><p>Contre-indications et interactions non reprises dans les lignes lues.</p><p class="src">Références : information professionnelle suisse de Benerva® (Swissmedic, avril 2019, consultée via AmiKo le 15 octobre 2026) ; <a href="https://doi.org/10.1111/j.1468-1331.2010.03153.x" target="_blank" rel="noopener">EFNS 2010, encéphalopathie de Wernicke (résumé)</a>.</p>
</template>
<template data-pop="g94-dexa" data-title="Dexaméthasone Galepharm : monographie">
<div class="lab">Indication</div><p>Œdème cérébral : tumeur, traumatisme, hémorragie, abcès, encéphalite, méningite, radiolésions.</p>
<div class="lab">Posologie adulte</div><p>Formes subaiguës ou chroniques (tumeur, abcès, méningo-encéphalite) : 8 à 12 mg par voie intraveineuse, puis 4 mg par voie intraveineuse ou intramusculaire toutes les 6 heures.</p>
<div class="lab">Posologie enfant</div><p>Encéphalite ou méningite : 0,15 mg/kg toutes les 6 heures pendant 4 jours, ou 0,4 mg/kg toutes les 12 heures pendant 2 jours, en commençant avant la première antibiothérapie.</p>
<div class="lab">Pharmacodynamie</div><p>L’effet maximal survient après 1 à 2 heures. La dexaméthasone ne peut donc pas être l’unique mesure dans un œdème cérébral aigu menaçant.</p>
<div class="lab">Effets indésirables</div><p>Effet paradoxal : hypertension intracrânienne avec œdème papillaire, convulsions.</p>
<div class="lab">Limite</div><p>La posologie de la méningite de l’adulte n’est pas détaillée dans les lignes lues ; l’indication dans la méningite bactérienne de l’adulte n’a pas été confrontée à la recommandation ESCMID, non lue.</p><p class="src">Références : information professionnelle suisse de la dexaméthasone Galepharm (Swissmedic, juin 2022, consultée via AmiKo le 15 octobre 2026).</p>
</template>
<template data-pop="g94-hsa" data-title="Hémorragie sous-arachnoïdienne et hydrocéphalie">
<div class="lab">Données</div><p>Incidence d’environ 9 pour 100 000. Mortalité de 50 à 60 % sous traitement conservateur dans les premiers mois. Le pronostic dépend du vasospasme, de l’hydrocéphalie et du déficit ischémique retardé ; la prise en charge est confiée à des centres expérimentés.</p>
<div class="lab">Limite</div><p>Les recommandations détaillées sur l’hydrocéphalie n’ont pas été lues (accès refusé) : aucune conduite n’est proposée.</p><p class="src">Références : <a href="https://doi.org/10.1159/000346087" target="_blank" rel="noopener">European Stroke Organization 2013 (résumé)</a>.</p>
</template>
<template data-pop="g94-lacunes" data-title="Limites de cette leçon">
<div class="lab">Sources</div><p>Aucune source suisse de société savante (neurologie, médecine intensive) n’a été lue ; aucune donnée épidémiologique suisse. La recommandation ESCMID 2016 sur la méningite bactérienne n’a pas pu être consultée.</p>
<div class="lab">Entités non développées</div><p>Encéphalopathies endocriniennes autres que Wernicke (hypoglycémie, hypothyroïdie, urémie, hyponatrémie), encéphalopathie infectieuse sans sepsis, G94.39 et G94.8 : aucune entité clinique sourcée au-delà du libellé. Causes parasitaires d’hydrocéphalie et hydrocéphalie post-infectieuse du nourrisson : non sourcées.</p>
<div class="lab">Physiologie du liquide cérébrospinal</div><p>Production, volume et résorption : non sourcées dans ce dossier.</p>
<div class="lab">Statut</div><p>Audit différé — revue IA, distincte d’une validation médicale humaine.</p>
</template>
<template data-pop="g94-mnemo" data-title="Moyens mnémotechniques (aide pédagogique, non critère officiel)">
<div class="lab">Aide pédagogique</div><p>Aide pédagogique, non critère officiel. Pour l’ordre du Wernicke : « thiamine d’abord, glucose ensuite ». Pour les trois pôles de la catégorie : « liquide, sepsis, carence ». Pour l’encéphalopathie septique : « d’abord exclure ».</p>
<div class="lab">Limite</div><p>Ces formules rappellent un ordre ; elles ne remplacent pas les critères des sources.</p>
</template>
<template data-pop="pareto-g94-def" data-title="Pareto — Définition et fréquence">
<p class="ratio" data-cover="g94-0,g94-1,g94-2"></p><ul><li>Un code astérisque ne s’emploie qu’avec le code croix de la maladie causale.</li><li>Trois pôles : hydrocéphalie, encéphalopathie septique, encéphalopathie carentielle.</li><li>5 % des méningites bactériennes de l’adulte ; jusqu’à 70 % des septiques en soins intensifs ; 11 à 17 % des métastases leptoméningées.</li></ul></template>
<template data-pop="pareto-g94-meca" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="g94-3,g94-4"></p><ul><li>Sepsis : cytokines, barrière altérée, microglie activée, ischémie.</li><li>Wernicke : carence d’une coenzyme du métabolisme des glucides ; les glucides augmentent la demande.</li><li>L’encéphalopathie septique est un diagnostic d’exclusion : médicaments d’abord.</li></ul></template>
<template data-pop="pareto-g94-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g94-5,g94-6"></p><ul><li>Délire hypoactif et coma prédominent.</li><li>Atteinte multifocale des nerfs crâniens : penser aux métastases leptoméningées.</li><li>Wernicke : deux signes sur quatre.</li></ul></template>
<template data-pop="pareto-g94-diag" data-title="Pareto — Diagnostic, urgences et traitement">
<p class="ratio" data-cover="g94-7,g94-8,g94-9"></p><ul><li>Chercher d’abord les causes létales : basilaire, hydrocéphalie, Wernicke, crises non convulsives.</li><li>Traiter la cause ; viser les cibles systémiques ; éviter le midazolam.</li><li>Thiamine avant glucose ; drainage de l’hydrocéphalie symptomatique.</li></ul></template>
<template data-pop="pareto-g94-suivi" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="g94-10,g94-11,g94-12"></p><ul><li>Surveillance à long terme des survivants du sepsis.</li><li>Survie médiane des métastases leptoméningées : 4 à 8 mois selon la tumeur.</li><li>Critères : exclusion pour le sepsis, deux signes sur quatre pour Wernicke, types I et II pour les métastases.</li></ul></template>
<template data-pop="pareto-g94-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g94-e-1,g94-e-2,g94-e-3,g94-e-4,g94-e-5"></p><ul><li>Scanner d’abord, électroencéphalogramme pour les crises, résonance magnétique si persistance.</li><li>Métastases : résonance cérébrospinale et liquide, deux ponctions si besoin.</li><li>Wernicke : dosage de thiamine avant la dose, sans retarder le traitement.</li></ul></template>
<template data-pop="pareto-g94-sciences" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="g94-s-anat-cours,g94-s-physio-cours,g94-s-bioch-cours"></p><ul><li>Barrière altérée, microglie activée, régions vulnérables.</li><li>Pyrophosphate de thiamine : coenzyme du métabolisme des glucides.</li><li>Céfépime : risque neurologique au-delà de 20 mg/L résiduels.</li></ul></template>
<template data-pop="pareto-g94-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g94-p-1,g94-p-2,g94-p-3,g94-p-4"></p><ul><li>Thiamine avant glucose ; doses divergentes entre recommandation et information professionnelle.</li><li>Dexaméthasone : effet après 1 à 2 heures, jamais seule.</li><li>Éviter le midazolam ; vérifier la fonction rénale avec le céfépime.</li></ul></template>
