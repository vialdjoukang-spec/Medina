<template id="ch-E04"><div class="chap"><style>[data-e04-table="1"]{font-size:inherit!important;display:block;max-width:100%;overflow-x:auto}[data-e04-table="1"] th,[data-e04-table="1"] td{font-size:inherit!important;min-width:9em}[data-e04-frame]{position:relative}[data-e04-frame] img{display:block;max-width:100%;height:auto}[data-e04-marker]{position:absolute;background:#123d4e;color:white;border:2px solid white;border-radius:50%;padding:1px 4px;font-weight:bold;font-size:clamp(8px,1vw,12px);line-height:1.2}[data-e04-pin="1"]{left:44%;top:16%}[data-e04-pin="2"]{left:47%;top:24%}[data-e04-pin="3"]{left:40%;top:50%}[data-e04-pin="4"]{left:53%;top:84%}</style><div class="chap-head"><div class="code"><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> · Autres goitres non toxiques · Endocrinologie et métabolisme</div><h1>Autres goitres non toxiques</h1><span class="status">Production Sol du 2 novembre 2026 · Sources datées suisses et européennes · Auto-relecture, sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e04-1">Une masse cervicale avec une fonction normale</a></li><li><a href="#e04-2">Définition et sous-codes : documenter avant de classer</a></li><li><a href="#e04-3">Fréquence : nodules, goitres et statut iodé</a></li><li><a href="#e04-4">Du follicule normal au volume nodulaire</a></li><li><a href="#e04-5">Causes, risques et diagnostics à ne pas confondre</a></li><li><a href="#e04-6">Anamnèse : évolution, compression et expositions</a></li><li><a href="#e04-7">Sémiologie clinique : examiner le cou et la respiration</a></li><li><a href="#e04-8">Drapeaux rouges : choisir le délai et le niveau de soins</a></li><li><a href="#e04-9">Explorations : une question pour chaque examen</a></li><li><a href="#e04-10">Différentiels : ce qui change réellement la décision</a></li><li><a href="#e04-11">Traitement : une décision partagée et proportionnée</a></li><li><a href="#e04-12">Suivi et pronostic : comparer ce qui est comparable</a></li><li><a href="#e04-13">Prévention et situations particulières</a></li><li><a href="#e04-14">Critères formels, cadre suisse et pièges d’examen</a></li></ol></nav>
<div class="chap-body">
<section class="ilot" id="e04-1"><h2><span class="n">1</span>Une masse cervicale avec une fonction normale</h2><p>Une patiente fictive de cinquante-six ans consulte parce que son col devient serré. Elle ne décrit ni palpitations ni amaigrissement ; une prise de sang antérieure était annoncée normale. À la palpation, la thyroïde paraît augmentée et irrégulière. Il reste pourtant trois questions différentes : existe-t-il une complication mécanique, quelle est la fonction hormonale, et les nodules comportent-ils un risque tumoral ? Une réponse rassurante à une question ne répond pas aux deux autres [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Le mot « non toxique » signifie que le goitre n’est pas associé à une hyperthyroïdie dans le tableau considéré. Il ne signifie pas « sans danger », « non compressif » ou « cancer exclu ». Une thyroïde peut augmenter de volume tout en maintenant une production hormonale normale ; un cancer peut aussi se présenter chez une personne euthyroïdienne [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>La formation suisse <button class="w" data-k="e04-profiles">PROFILES</button> demande d’inspecter et palper la thyroïde et les structures cervicales, de raisonner devant un gonflement du cou ou un goitre, et d’interpréter des hormones thyroïdiennes anormales. Ces objectifs soutiennent cette démarche, sans constituer une correspondance officielle entre un code et une question d’examen. La vignette et ses données sont pédagogiques [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> Séparer gravité mécanique, fonction et risque tumoral. Une analyse hormonale normale ne remplace pas l’examen du cou [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-2"><h2><span class="n">2</span>Définition et sous-codes : documenter avant de classer</h2><p>Le catalogue suisse local 2024 donne <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> — Autres goitres non toxiques. Un goitre décrit une augmentation de la glande ; un nodule est une lésion qui se distingue du tissu environnant à l’échographie. La présence d’un petit nodule n’implique donc pas à elle seule que tout le volume glandulaire soit augmenté. Décrire la morphologie et la fonction évite de confondre ces dimensions [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<table class="t" data-e04-table="1"><thead><tr><th>Sous-code suisse</th><th>Libellé</th><th>Précision utile</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.0</td><td>Goitre diffus non toxique</td><td>Augmentation diffuse ; les notes allemandes incluent goitre simple et colloïde.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.1</td><td>Nodule thyroïdien simple non toxique</td><td>Nodule unique, notamment kystique selon les inclusions ; « simple » ne remplace pas évaluation du risque.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.2</td><td>Goitre multinodulaire non toxique</td><td>Plusieurs nodules, y compris formes kystiques multiples.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.8</td><td>Autres goitres non toxiques précisés</td><td>Une forme précisée ne relevant pas des précédentes doit être documentée.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.9</td><td>Goitre non toxique, sans précision</td><td>Réserver à une documentation insuffisante ; ne pas effacer une morphologie connue.</td></tr></tbody></table>
<p>Les notes excluent les goitres liés à une carence en iode, classés <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E00</a>–<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E02</a>, et le goitre congénital diffus, classé <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E03</a>.0. Une histoire ancienne de carence régionale peut contribuer au terrain nodulaire ; elle ne prouve pas à elle seule la cause actuelle d’un goitre individuel. À l’inverse, une carence iodée causale établie demande de reconsidérer le code [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>].</p>
<p>Les libellés français proviennent des métadonnées suisses locales ; les inclusions/exclusions ont été confrontées au texte allemand 2024. Le document officiel <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS</a> intégral n’a pas été relu pour cette leçon : il ne s’agit pas d’une certification de codage individuel ou de remboursement [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>].</p>
<div class="key"><b>À retenir.</b> Couvrir <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a>.0, .1, .2, .8 et .9 ; ne pas classer automatiquement ici un goitre par carence iodée ou une maladie congénitale [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-3"><h2><span class="n">3</span>Fréquence : nodules, goitres et statut iodé</h2><p>Aucune incidence suisse contemporaine spécifique de <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> n’a été établie dans les lectures ciblées. L’absence de chiffre dans ce dossier ne démontre pas l’absence de maladie. Une série de nodules découverts à l’échographie, un registre de chirurgie et une enquête sur l’iode ne mesurent pas le même événement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>, <a data-reference-source="1" href="https://www.revmed.ch/view/399468/3537941/RMS_699_1311.pdf" target="_blank" rel="noopener">S17</a>].</p>
<p>Le guide européen 2023 indique que des nodules peuvent être détectés chez jusqu’à 60% des adultes selon les populations et la méthode d’imagerie. Ils deviennent plus fréquents avec l’âge et sont plus souvent trouvés chez les femmes. Ce chiffre ne représente ni la prévalence suisse des goitres <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> ni une indication de dépister tout adulte asymptomatique. Le guide estime le risque de malignité autour de 1–5% dans des populations non sélectionnées ; une consultation spécialisée ou une sélection chirurgicale change le dénominateur [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>En Suisse, le monitoring 2020–2022 a mesuré une iodurie médiane de 127 µg/l chez 362 enfants de six à douze ans, et de 97 µg/l chez 473 femmes enceintes. La couverture était considérée adéquate chez les enfants et insuffisante au niveau populationnel chez les femmes enceintes. Ces concentrations urinaires ne comptent pas les goitres et un échantillon urinaire isolé ne devient pas un diagnostic individuel de carence causale [<a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>].</p>
<p>Chez les femmes enceintes de cette enquête, 47% déclaraient un supplément ; les médianes étaient 88 µg/l sans supplément et 140 µg/l avec. L’amélioration du marqueur ne permet pas d’affirmer que toute personne supplémentée atteignait l’objectif, ni que tout goitre suisse était lié à une carence [<a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> Toujours nommer la population, la méthode et le dénominateur. Une fréquence de nodules n’est pas une incidence <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/monitoring-jod-versorgung-der-schweizer-bevoelkerung" target="_blank" rel="noopener">S9</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-4"><h2><span class="n">4</span>Du follicule normal au volume nodulaire</h2><p>La thyroïde normale comprend deux lobes réunis par un isthme devant la trachée. Les cellules folliculaires entourent une lumière contenant la colloïde et la thyroglobuline. Elles captent l’iodure, fabriquent les hormones et les libèrent sous le contrôle de la thyréostimuline hypophysaire, ou <button class="w" data-k="e04-tsh">TSH</button>. Le rétrocontrôle ajuste la production ; la taille et l’architecture ne se déduisent pas directement d’un seul dosage [<a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
<p>Une prolifération, une accumulation de colloïde, une dégénérescence kystique ou des remaniements de nodules peuvent augmenter le volume sans entraîner immédiatement une hyperthyroïdie. Un goitre multinodulaire est hétérogène : tous les nodules n’ont pas forcément la même fonction, la même structure ou le même risque [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Une croissance vers les espaces profonds peut déplacer ou comprimer la trachée et l’œsophage. L’effet dépend du siège, de la forme et des rapports anatomiques, pas seulement du diamètre maximal externe. C’est pourquoi des symptômes respiratoires, une dysphagie ou une modification de voix doivent être explorés même si le bilan hormonal reste normal [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Enfin, une zone peut devenir autonome et répondre moins au contrôle hypophysaire. La <button class="w" data-k="e04-tsh">TSH</button> peut alors baisser, parfois avant l’augmentation des hormones libres. Une charge iodée importante peut révéler une production excessive sur ce terrain ; une fonction normale au départ n’élimine pas toute autonomie ni tout risque après contraste [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Structure et volume</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Fonction hormonale</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Risque et retentissement</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Trois dimensions à évaluer ensemble ; les flèches organisent le raisonnement, elles ne décrivent pas une succession obligatoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> Le volume, la fonction et la nature du tissu sont liés mais distincts. Le follicule normal aide à comprendre cette séparation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-5"><h2><span class="n">5</span>Causes, risques et diagnostics à ne pas confondre</h2><p>L’histoire iodée et familiale, l’âge, les antécédents de maladie thyroïdienne et les expositions participent au raisonnement. Un médicament iodé ou une injection de contraste doit être recherché, surtout lorsqu’une anomalie fonctionnelle apparaît. Les compléments alimentaires et les algues peuvent aussi apporter des quantités variables d’iode ; « naturel » ne signifie pas dose faible et constante [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Une irradiation cervicale pendant l’enfance, une histoire familiale de cancer thyroïdien ou de syndrome de prédisposition renforcent l’attention portée à une lésion. Ils ne prouvent pas qu’un nodule donné est malin. Des nodules multiples et apparemment bénins ne dispensent pas d’identifier les plus suspects à l’échographie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<p>Une thyroïdite auto-immune ou inflammatoire peut augmenter le volume et produire des zones ressemblant à des nodules. Une maladie de Basedow peut donner un goitre avec hyperthyroïdie ; une tumeur, un ganglion ou une lésion d’un autre organe cervical peut imiter une masse thyroïdienne. Ces hypothèses demandent leur évaluation et, lorsqu’elles sont établies, leur classification propre [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Chez l’enfant ou en présence de manifestations syndromiques, certaines prédispositions comme <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">DICER1</a> ou le syndrome lié à <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">PTEN</a> peuvent s’accompagner d’un goitre multinodulaire. Elles justifient une orientation ciblée selon l’ensemble clinique et familial, pas un séquençage systématique de tout adulte présentant <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">E04</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</p>
<div class="key"><b>À retenir.</b> Le contexte oriente sans remplacer l’évaluation du nodule. Un goitre est une description qui demande encore une explication [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e00-e07.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9716393/" target="_blank" rel="noopener">S13</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-6"><h2><span class="n">6</span>Anamnèse : évolution, compression et expositions</h2><p>Préciser date de découverte, changement du volume, douleur ou gonflement soudain, gêne esthétique, difficulté à avaler, voix modifiée, dyspnée et gêne en position couchée. Une aggravation rapide ne se résume pas à « le goitre a grandi » : elle peut traduire une hémorragie, une inflammation ou un processus tumoral et doit être confrontée à l’état respiratoire [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<p>Demander symptômes de fonction excessive ou insuffisante, antécédents de chirurgie, irradiation, ponction et résultats anciens. Une ancienne cytologie dite bénigne est utile si l’on sait quel nodule avait été ponctionné, à quelle date et avec quelle concordance échographique. Un goitre ancien n’assure pas que toute nouvelle modification est sans importance [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Rechercher antécédents familiaux de cancer, notamment médullaire, et de néoplasie endocrinienne multiple de type 2. Documenter grossesse, projet de grossesse, allaitement, comorbidités cardiaques et rénales, ainsi que médicaments, biotine, amiodarone, hormones, iode et contraste récent. Ces éléments peuvent modifier le choix des examens et traitements [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680527280012" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<p>Enfin, demander ce qui gêne réellement la personne et ce qu’elle attend : rassurance argumentée, amélioration de la déglutition, réduction du volume ou certitude diagnostique. Surveillance et intervention ont chacune des contraintes ; expliquer les alternatives est une partie du soin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>].</p>
<div class="key"><b>À retenir.</b> La chronologie et les symptômes de compression sont aussi utiles que l’ancienne prise de sang. Identifier les expositions avant de choisir un examen [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e04-7"><h2><span class="n">7</span>Sémiologie clinique : examiner le cou et la respiration</h2><div data-semiology-clinical="E04"><p><button class="w" data-k="e04-semio">La sémiologie clinique</button> commence par l’état général, la respiration et la voix, puis relie inspection, palpation et bilan. Une masse mobile à la déglutition est compatible avec une origine thyroïdienne mais ne suffit pas à affirmer sa nature bénigne. Un examen rassurant ne remplace pas une échographie indiquée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>].</p>
</div><p>Inspecter le cou au repos et pendant la déglutition, rechercher asymétrie, augmentation visible et circulation veineuse anormale. Palper doucement les lobes et l’isthme, apprécier consistance, mobilité, douleur, contours et nodules perceptibles. Examiner les aires ganglionnaires cervicales. Noter si le pôle inférieur est accessible ; la palpation n’exclut pas une extension rétrosternale [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/17-4-the-thyroid-gland" target="_blank" rel="noopener">S14</a>, <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
<p>Une lésion dure ou fixée, un ganglion suspect, une voix nouvellement rauque ou une croissance préoccupante renforcent la suspicion et accélèrent l’évaluation. Leur absence ne constitue pas un test d’exclusion du cancer. Aucune sensibilité ou spécificité universelle de la palpation n’est établie dans les lectures : la performance dépend notamment de la taille, du siège et de l’examinateur [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</p>
<p>Décrire les signes fonctionnels avec fréquence cardiaque, tremblement et autres observations pertinentes. Un tableau hormonal doit être confirmé biologiquement et expliqué ; ne pas transformer l’absence de tremblement en preuve d’euthyroïdie. Une détresse respiratoire fait passer les soins urgents avant le bilan ambulatoire complet [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10542302/" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8314764/" target="_blank" rel="noopener">S12</a>].</p>
<div class="key"><b>À retenir.</b> Observer et décrire avant de conclure. Ni la mobilité à la déglutition ni l’absence de symptômes hormonaux ne certifient un nodule bénin [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10448590/" target="_blank" rel="noopener">S3</a>].</div><button class="pareto-btn ui" data-k="pareto-e04-7">Essentiel de cette partie</button></section>
