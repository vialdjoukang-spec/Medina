<template data-pop="pareto-k59-clinique" data-title="Loi de Pareto — Constipation chronique"><p class="ratio" data-cover="k59-1,k59-3,k59-4,k59-5,k59-6,k59-7"></p><ul><li>On applique la définition, qui exige au moins deux symptômes et non une seule fréquence.</li><li>On cherche les signes d’alarme et l’on revoit les médicaments avant tout traitement.</li><li>Le patient boit 1,5 à 2 L par jour et vise 30 g de fibres.</li><li>On prescrit d’abord le macrogol, le picosulfate ou le bisacodyl, sans limite de durée.</li><li>En cas d’échec, on change de classe, on associe, puis on prescrit le prucalopride.</li><li>On explore une dyssynergie et on la traite par biofeedback.</li><li>On prévient la constipation des opioïdes dès le début du traitement.</li></ul></template>
<template data-pop="pareto-k59-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k59-e-1,k59-e-2"></p><ul><li>On exclut d’abord une cause organique, par une coloscopie si un signe d’alarme est présent.</li><li>On confirme une dyssynergie par deux examens, car un seul peut être faussement positif.</li><li>Le temps de transit normal est inférieur à 68-72 h.</li><li>On ne demande pas de culture des selles.</li></ul></template>
<template data-pop="pareto-k59-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k59-p-1,k59-p-2,k59-p-3"></p><ul><li>On prescrit d’abord le macrogol, le bisacodyl ou le picosulfate.</li><li>On change de classe plutôt que d’augmenter sans fin la dose.</li><li>Le prucalopride se donne à 1 puis 2 mg et s’arrête après 4 semaines d’échec.</li><li>On prévient la constipation des opioïdes dès la première prescription.</li></ul></template>
<template data-pop="k59-cc" data-title="Constipation chronique"><p class="lab">Définition</p><p>Au moins deux symptômes présents lors de plus de 25 % des défécations, ou moins de 3 selles par semaine, persistent depuis 3 mois, avec un début au moins 6 mois avant le diagnostic.</p><p class="lab">Pourquoi plusieurs symptômes ?</p><p>Beaucoup de patients vont à selle chaque jour au prix d’efforts importants ; la fréquence seule les manquerait.</p><p class="lab">Fréquence</p><p>Elle touche environ 15 % de la population européenne, davantage les femmes et les personnes âgées.</p><figure><img src="data:image/gif;base64,R0lGODdhBgERAoYAAP///////v///f///P/+/v7//v7+//7+/v7//f7+/f7/+/7+/P7++/3//v3+/v3+/f3++/z+/f/9/v79/v79/f39/v39/f39/P39+/38+/z8/Pv8+fv5+Pn5+Pj29Pfy7+7y7fDt6+vn5+zk3uLc2+TZz9/Ry93LvM/LydS/rsO8ucivmceeW6+no6uZj8KQN8SPK8SQKbmILbmIKbeELK6KYK59MpaJg499c6d3OKJuNJZvT4hwYYhlS49eNYNeQXxcRH5WOHpPL25ucGNgYGlUR3FNNWFNQmtGM2xEImNDNFBDPmY8I2A7KVg7L101IFM1KlQvHkwwJjgyMkgpHTgoI0IjGTwhGTYgGTIbFC0WESAdHCQVESESDyAPDBIKCQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAABgERAkAI/wBBCBxIsKDBgwgTiljIUCDDhw0hPkxIsWBDhxIXYsyokSPEiiBDihxJsqTJgwBSqlzJ8oBLljBTujygkoBNAQsW0Jx5YMKEmQUKJBjq0ucDCA1cEmWwIICAoEGdChAQIOZKqDMNGGgAgYGHECRMqFjh4saNsjdw4ODB9kYLFCM2QHDw4EGCBQkEpLRJAKrVv4ADCx5MuLDhwyp5vpSZM2cCxTyHDr2A4cIBCx1GoHCBo4gSJ0qKAAHi2QloJUiA9MDxVoQHBg80VLjrmPaCCxQiNAg6gQIFCUEbPLDwW0ICDBtCnLjRo0eN5zXYSueBo8cRKlKoYOHipQsUHitMhP/YcKHAAQgPfP6kibi9+/fw4yee6cCBYwgYOHzQrGJsCxdoufDWCB5sYIEFE3hAwgo4APGZaUcAgcNZN7DVA2lOUHHFFVlkgYUUPLRQwgghdKBBAw0g4MEIDAJhxBER8lDDDkBAQQUVUABxgwqucRBCCjcUkR0UpikB42dRUGGFFTdasZ0XUH6RhRI3rFBCCBxgQAEEEOi0mHzuzSSTYmACJiZMZxIm5ky0IYDAASzyoNoO0Tlo44ZXYIHFhlho4QQPKZTgmggnuMCDEUp8JkUUUTzRhBM2KpmnnllIUQQOKwRKYgkt9JCkFFI4ESFpRfTAVhFO9JnFFdiBCoQLIy7/dEILPJQGaXY3VrGdFlQ4YQQQdLqwwgkjhhCCCCMkq2wIHnBAAVMLHLUABRZckJNe8s0kQgtEbPHFt+B+scQNJHygwZjsAXDAXTNZQBsGGFjgkryQXdYBCS0MMcUXWxDRAgkekGkYZPVNIIEIK/BwRKR <template data-pop="k59-rome" data-title="Critères de Rome IV"><p class="lab">Rôle</p><p>Ces critères internationaux définissent les troubles digestifs fonctionnels ; la S2k 2022 s’en sert pour définir la constipation chronique.</p><p class="lab">Pourquoi des critères ?</p><p>Ils rendent le diagnostic reproductible, car la prévalence varie de 9,4 à 58,9 % selon la définition utilisée.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>

<template data-pop="k59-sii" data-title="Syndrome de l’intestin irritable"><p class="lab">Différence</p><p>La douleur abdominale liée aux selles domine dans l’intestin irritable ; dans la constipation chronique, elle n’est pas au premier plan.</p><p class="lab">Conséquence</p><p>Si le patient a des douleurs, on applique la recommandation de l’intestin irritable, traitée dans le cours K58, car les deux troubles se recouvrent.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-alarme" data-title="Signes d’alarme"><p class="lab">Liste S2k</p><p>Ce sont un saignement, une anémie, une perte de poids de plus de 10 %, des antécédents de tumeur digestive, des adénopathies, une masse, une dénutrition, une fausse diarrhée, un âge de plus de 50 ans, une évolution progressive et une histoire courte avec des plaintes sévères.</p><p class="lab">Pourquoi ?</p><p>Ces signes font craindre une cause organique, en particulier un cancer colorectal ; on explore donc avant de traiter.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-palier" data-title="Traitement par paliers"><p class="lab">Ordre</p><p>On commence par les mesures de base, puis on prescrit le macrogol, le picosulfate ou le bisacodyl, ensuite le prucalopride, enfin le linaclotide.</p><p class="lab">Règle</p><p>En cas d’échec, on change de classe, puis on associe deux classes, avant de monter d’un palier.</p><p class="lab">Pourquoi ?</p><p>Chaque palier ajoute un mécanisme nouveau ; les médicaments les plus sûrs et les mieux étudiés passent en premier.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-dysen" data-title="Trouble de l’évacuation"><p class="lab">Définition</p><p>Le côlon progresse normalement, mais le rectum ne se vide pas bien, par dyssynergie ou par obstacle anatomique.</p><p class="lab">Indices</p><p>Le patient pousse fort, se sent mal vidé, a une sensation d’obstruction ou s’aide avec les doigts.</p><p class="lab">Code</p><p>Ce trouble correspond à K59.01.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-stc" data-title="Transit lent"><p class="lab">Définition</p><p>Le côlon fait progresser lentement son contenu, si bien que les selles se dessèchent.</p><p class="lab">Preuve</p><p>Le test aux marqueurs montre un temps de transit supérieur à 68-72 h.</p><p class="lab">Code</p><p>Ce trouble correspond à K59.00.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-icc" data-title="Cellules interstitielles de Cajal"><p class="lab">Rôle</p><p>Ces cellules génèrent le rythme électrique de base de la musculature digestive ; elles jouent le rôle de stimulateur.</p><p class="lab">Lien avec la constipation</p><p>La S2k associe la constipation à des anomalies de ces cellules, ainsi qu’à des neuropathies et des myopathies entériques.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-dyssyn" data-title="Dyssynergie du plancher pelvien"><p class="lab">Mécanisme</p><p>Lors de la poussée, le puborectal et le sphincter externe se contractent au lieu de se relâcher.</p><p class="lab">Fréquence</p><p>La manométrie la montre chez 20 à 75 % des patients examinés, mais aussi chez des sujets sains gênés par la situation.</p><p class="lab">Conséquence</p><p>Un second examen doit la confirmer, puis on la traite par biofeedback.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-tr" data-title="Toucher rectal"><p class="lab">Ce qu’on évalue</p><p>On apprécie le tonus de repos, la contraction volontaire et la tentative de poussée, et l’on cherche un fécalome ou une masse.</p><p class="lab">Limite</p><p>Sa valeur prédictive négative pour un trouble de l’évacuation n’est que de 64 %, si bien qu’un toucher normal n’exclut pas ce trouble.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-colo" data-title="Iléocoloscopie"><p class="lab">Indication</p><p>On la fait d’emblée en cas de signe d’alarme, ou lorsque le traitement d’épreuve échoue.</p><p class="lab">Pourquoi ?</p><p>Elle exclut un cancer, une sténose ou une inflammation, qui seraient des causes organiques.</p><p class="lab">Répétition</p><p>Sans changement des plaintes, on évite de la répéter en dehors des intervalles de dépistage.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-mano" data-title="Manométrie anorectale"><p class="lab">Principe</p><p>Une sonde mesure les pressions du rectum et du canal anal au repos, à la contraction et à la poussée.</p><p class="lab">Apport</p><p>Elle montre une dyssynergie et permet d’exclure une maladie de Hirschsprung.</p><p class="lab">Limite</p><p>Une dyssynergie peut apparaître chez un sujet sain gêné par l’examen ; c’est pourquoi un second test la confirme.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-ballon" data-title="Test d’expulsion du ballonnet"><p class="lab">Principe</p><p>Le patient doit expulser un ballonnet rempli d’eau, généralement de 50 ml, placé dans le rectum.</p><p class="lab">Valeur</p><p>Ce test simple concorde bien avec la manométrie ; cependant, il peut être faussement positif en raison de la situation d’examen.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-defeco" data-title="Défécographie"><p class="lab">Principe</p><p>On filme l’évacuation d’un produit de contraste placé dans le rectum, par radiologie ou par IRM.</p><p class="lab">Apport</p><p>Elle montre une rectocèle, une intussusception ou une entérocèle, et elle confirme une dyssynergie.</p><p class="lab">Limite</p><p>Une rectocèle existe chez 48 à 93 % des sujets sains ; l’image s’interprète donc avec un questionnaire fonctionnel validé.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-hinton" data-title="Test de Hinton (transit aux marqueurs)"><p class="lab">Principe</p><p>Le patient avale des marqueurs radio-opaques, puis une radiographie les compte par segment du côlon.</p><p class="lab">Valeur normale</p><p>Le temps de transit colique est normalement inférieur à 68-72 h.</p><p class="lab">Précaution</p><p>Le patient tient un journal des selles, car une selle juste avant le cliché fausserait le résultat.</p><figure><img src="data:image/gif;base64,R0lGODdhzAE1AoUAANXV1cvLy8fGxsPEw8LBwb6/vry8vLu4uLe2trS0tLKxsa6vrqqrq6unp6ampqSkpKGioaCgoJ+enpydnZubm5mampiXl5WWlZyQkZOTk5KSkpGQkI6Pj42NjYuLi4iJiYaHhoOEhH9/f3p6enh2dodtbmxtbGZmZmJiYl1dXVZWVlJSUk1NTUhISD4+PiIiIgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAzAE1AkAI/wBfCBxI8IWLgwgTJmzBkCELFitUqFix4mHEiitQpEiBouOJEyZCmkgRQgMJEiFGdJAQQQQJEB5SsEihYiNEhgdbPHSBk2eLhQ1ZIPyJ0KDChAIPFlya1AXTgkdzEjXa1KlBFi0EtlBxUKiLij8bht2KVSZPjBslqvD40cTJEB5EbLhQYUMFCQ84cIjggAEDBw4gTJAwYQIECxM2hAjxQYSIECBEgODgwQMHEB84ZNjQ4UNjER9g1vVQAQLeBQr+RsigIYLgCA8kSDBdGAIDCBcQQ4ggwXMIEiNOBich0m1KtyY0pvjI8aNHFCCV00xb88TE6RtRXNeutiZNijU1dv+3PhOiWorkU6wgirSoUqjvnzL9ypWFCvty9RInIWJEcrXyBWhUVD7phJVDD5m3UXMnQNegCiFs0F9IfvnnFglx3RfRfS2scEJWC7Unok7YcdTRdTR55x0KyXW0oHPLiVeTitU1uBFzE62wEUUWeWefdiZYh9F6Bhn0k5EuYGUVgWOdpVZ2y7klggUdbGBBBRNkQMFgDBD2lwQMJHDbBBVgWUEGhVmg5gUcQJbBYiOEoFcHv43wgQfB2elmBmhC4IACBySgwAIRbIAZZJ5toNgHV1pAgQUegCApYyI0CBJxLIrU1oUnEFecjdR1OpKJKc64o3ffbYhRTRVZtKp9Kjj/FBFWsC44kX3q4dQTUgL2WuRAC7FgwgS/fXTCCBaY0OFEvgLrFIEFQuQqj7hm15FG0KkwAgf7maBBAyB4Cl1IErW601YpMITCCl+BdOEIIzz2mwnxuoQSYxpEttidjQl3UkiP2SuZvfCexB8IIfT3WGTxyomZB4zp60GVFlywAcSLWabmZ5U1HGe8wV0YZEjizSRkd+uu5WCDJoTQwQUTXLDZBhn4yQACCBhgwAEHLPAAAwqk5sADFPwcGGAVPFBmmRtwUCZdHNy5AQQdgKBBBa5FoBfWDKCmAGAQQPAAYBQ03TTCoe2b8GIuGbsypiEBBxy8jpFg7KZyf3SSdpme//Bdd4CfF56Gqi7YqoEWMbQhVjPqSNFPywn1k1e8NkvVUgqFRYIG89K7gacQWT4gtAZSdBFEG0K54IknSLifCHmJauxEItynUZDA0YuSBxn0R9oFod3ZAWUeaGBB05RV2cHwkYrgQWMf0DmZB1ZakAEHnUkWdfDPV1ZZZpRx0GjZm0nggAUa2HX8BYShzwF <template data-pop="k59-psyl" data-title="Psyllium"><p class="lab">Nature</p><p>C’est une fibre soluble, issue de l’enveloppe des graines de plantain.</p><p class="lab">Pourquoi lui ?</p><p>Parmi les fibres, c’est celle dont l’efficacité est la mieux démontrée par des études contre placebo.</p><p class="lab">Limite</p><p>Comme toutes les fibres, il peut provoquer des ballonnements ; on réduit alors la dose et l’on préfère un laxatif osmotique.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-biofb" data-title="Biofeedback"><p class="lab">Principe</p><p>Une sonde anale affiche au patient, par exemple par des signaux lumineux, l’état de contraction de ses sphincters ; il apprend ainsi à les relâcher en poussant.</p><p class="lab">Indication</p><p>On le propose dans la dyssynergie, même associée à un transit lent.</p><p class="lab">Non-indication</p><p>Il ne sert pas dans le transit lent isolé, car la sortie fonctionne alors normalement.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-cio" data-title="Constipation induite par les opioïdes"><p class="lab">Fréquence</p><p>Elle touche 15 à 80 % des patients sous opioïdes, selon leurs facteurs de risque.</p><p class="lab">Prévention</p><p>On commence une prophylaxie laxative dès la première prescription d’opioïde.</p><p class="lab">Escalade</p><p>Si les laxatifs échouent, on prescrit un antagoniste opioïde périphérique, ou l’association oxycodone-naloxone chez le patient sous oxycodone.</p><p class="lab">Code</p><p>Elle correspond à K59.02.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-pamora" data-title="Antagonistes opioïdes périphériques"><p class="lab">Mécanisme</p><p>Ils bloquent les récepteurs μ de l’intestin, mais ne franchissent pas la barrière hémato-encéphalique ; l’antalgie est donc préservée.</p><p class="lab">Naloxégol (Moventig®)</p><p>On donne 25 mg une fois par jour, ou 12,5 mg en cas d’intolérance ou d’insuffisance rénale modérée à sévère.</p><p class="lab">Méthylnaltrexone (Relistor®)</p><p>On injecte 8 mg s.c. de 38 à 61 kg, ou 12 mg dès 62 kg, au maximum une fois par 48 h, en soins palliatifs.</p><p class="lab">Contre-indication</p><p>Une occlusion connue ou suspectée les contre-indique, car ils exposent à une perforation.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Moventig®, Swissmedic (AIPS), consultée le 10.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Relistor®, Swissmedic (AIPS), consultée le 10.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-fecal" data-title="Fécalome"><p class="lab">Définition</p><p>C’est une masse de selles durcies qui ne peut plus être évacuée.</p><p class="lab">Risques</p><p>Elle peut provoquer une occlusion, une ulcération de pression ou une perforation, et elle peut se manifester par une fausse diarrhée.</p><p class="lab">Traitement médicamenteux</p><p>Movicol® peut être donné à raison de 8 sachets par jour en 6 heures, au maximum 3 jours.</p><figure><img src="data:image/gif;base64,R0lGODdhzAEwAoUAAPz8/Nra2tHR0crJycTExL29vbW1tbCvr6qqqqSlpKCgoJubm5WVlZGQkIuLi4aGhoODg39/f3p7end3d3R0dHFwcG1tbWtqamhoaGZnZmRlZGVgYWBgYF5dXVlbWldYV1RUVFBQUExMTEdHR0RAQDw8OzM0MzIrKykpKSIiIhkaGRQUFA8PDwwNDAgICAICAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAzAEwAkAI/wABCBxIsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatzIsePGAy9cvBhJkqRIFyhTpmzBksWKFCZEhBhBgsSIEBwkRMgQgoQJEyhSCE2homiKEz9LJC2hNGjRpyqEojBhM4RVEB0+gPjgAYSIEWDBhvDQwYMFCA4eQIjAlu0DB3AdNGCwQMECugkUNJDboC8DBQoSJEBwwIBhAwcOIAA8GIFgwokTJ2DwoK2ECRIuR3gwF7DdBQv8LnC8IK+CwghS3xUNGDTovndfw1XLGTTdBQ7YSqBQoXcFCpgjQFAr/AHnua5dM1gu+u5y234RFChAQIB1AQGya89+HXsA6wO8X//fTv67gAHo06e3bv48gQKHDSturJgw9ffTEQMm7HiwXQUIhPZcCS38hAIEk1kwggoOGJBABEKVkEIIEqTgglArSFDAAYzVBSBiiwUWGwMQWIDBBBHoVNllvP3GGwYZWEABbxrUqAEHHGBQgQUWuPhbBQx4YEIABIEkUklIJqlkSSixcAJOZzmwGwUceNCVTSM0hcJUW1L1k4FDCRXVlkRFRVQKTqkwFVM2ffDBCCJwsGMFmV3WGwWX9fhbiij21UBpCYTWF1yACjaYaXYhIB9pdeHGlwMMGCoZZcYVB9dextUG2mCFHWDaao06RxcDyC0nmF0NVDYcBDrJtWKdbFH/oKcFGWBgwQU4aoDBBRqQpeOtdE6A4lrCpRXBBC1mFtxwas2FHGgHUBdeedRqN1553a3X3bbTtnfdAAQQAK64AxSQWmKIkfqccrk5cJcCDHxAgggRBFoaBSKosIIHI7BQQgcWwDeBmxXUh0ADIIDlgQMdTHAABR7A6wEEC7A6QQUa9FSCTSJ8JUIHN2qQwY05zghcZhjf6CYHI99YgU9EDoRASEvWHNKRNL/QggomjIDVBRZsUMEEG5BwwgkXbLBBviqwaXRNJ0BtdAobb3z01SeIcHTRUT+pQQcc8NowBHM9gKwEaKkFwdp8ZcoWX356GChei3n4GYD2NkYYYvVJ/xZaWmwzd6lfyxUOF12tFc4cW38ycHioqzlALLNvGcsbipxJjpbkEVCQAQdgcxDCxj5nBYJXImzFAY89np2irLfqKKuLyE5ANoCM1mXaYnMNVkC37J2nrXjoES/ue+ga8Lt31H4bLnrhShuuAZ/9ldpijr9V2QOOk+1ACVOZQAGJK8rlmmB2e5Yccp4BRpm <template data-pop="k59-mcg" data-title="Macrogol 3350 (Movicol®)"><p class="lab">Mécanisme</p><p>Ce polymère peu absorbé retient l’eau dans la lumière intestinale.</p><p class="lab">Dose</p><p>On donne 1 à 2 sachets par jour, chacun dilué dans 125 ml d’eau ; après 65 ans, 1 sachet suffit généralement.</p><p class="lab">Durée</p><p>La FI limite l’automédication à 3 mois ; au-delà, le traitement se poursuit sous prescription, ce que la S2k juge sûr.</p><p class="lab">Grossesse</p><p>La S2k admet son emploi pendant la grossesse.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Movicol®, Swissmedic (AIPS), consultée le 10.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-lactu" data-title="Lactulose (Duphalac®)"><p class="lab">Mécanisme</p><p>Ce sucre non absorbé attire l’eau dans la lumière, puis il fermente dans le côlon.</p><p class="lab">Dose</p><p>On donne 15-45 ml par jour les 3 premiers jours, puis 10-25 ml par jour.</p><p class="lab">Délai</p><p>L’effet peut n’apparaître qu’après 2 à 3 jours.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Duphalac®, Swissmedic (AIPS), consultée le 10.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-bisa" data-title="Bisacodyl (Dulcolax®)"><p class="lab">Mécanisme</p><p>Il stimule la motricité propulsive du côlon et la sécrétion d’eau.</p><p class="lab">Dose</p><p>On donne 1 à 2 comprimés gastrorésistants de 5 mg le soir, ou 1 suppositoire de 10 mg par jour.</p><p class="lab">Précaution</p><p>On ne le prend pas avec du lait, un antiacide ou un IPP, car l’enrobage se dissoudrait trop tôt.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Dulcolax® Bisacodyl, Swissmedic (AIPS), consultée le 10.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-pico" data-title="Picosulfate de sodium (Laxoberon®)"><p class="lab">Mécanisme</p><p>C’est un dérivé du bisacodyl, d’effet identique, activé dans le côlon.</p><p class="lab">Dose</p><p>On donne 10 à 20 gouttes (5 à 10 mg) par jour, de préférence le soir, en commençant par la dose la plus faible.</p><p class="lab">Délai</p><p>L’effet apparaît en 6 à 12 heures.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Laxoberon®, Swissmedic (AIPS), consultée le 10.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-pruca" data-title="Prucalopride (Resolor®)"><p class="lab">Mécanisme</p><p>Cet agoniste des récepteurs 5-HT4 stimule la motricité propulsive.</p><p class="lab">Indication</p><p>La FI le réserve à la constipation chronique idiopathique de l’adulte après l’échec des laxatifs et des mesures diététiques.</p><p class="lab">Dose</p><p>On donne 1 mg une fois par jour, puis 2 mg si l’effet est insuffisant ; après 65 ans, on donne 1 mg.</p><p class="lab">Arrêt</p><p>On l’arrête si 2 mg restent inefficaces après 4 semaines.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Resolor®, Swissmedic (AIPS), consultée le 10.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
<template data-pop="k59-lina" data-title="Linaclotide (Constella®)"><p class="lab">Mécanisme</p><p>Il augmente la sécrétion de chlore et d’eau dans la lumière intestinale.</p><p class="lab">Statut suisse</p><p>Sa FI ne l’autorise que dans l’intestin irritable modéré à sévère avec constipation ; dans la constipation chronique, son emploi est donc hors indication.</p><p class="lab">Dose</p><p>On donne 290 µg une fois par jour, au moins 30 minutes avant un repas.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Constella®, Swissmedic (AIPS), consultée le 10.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></template>
