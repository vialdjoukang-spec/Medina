<section class="ilot" id="k59-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 58 ans consulte parce qu’elle va à selle deux fois par semaine depuis plusieurs années ; elle pousse fort, elle a l’impression de ne pas se vider complètement et elle s’aide parfois avec les doigts. Elle prend depuis six mois un antidépresseur tricyclique. <b>La question est donc triple : s’agit-il d’une <button class="w" data-k="k59-cc">constipation chronique</button> au sens des critères, faut-il chercher une cause organique avant de traiter, et quel traitement choisir, dans quel ordre ?</b></p><p>Pour y répondre, le médecin doit savoir appliquer la définition, qui repose sur plusieurs symptômes et non sur la seule fréquence des selles ; ensuite, il doit repérer les <button class="w" data-k="k59-alarme">signes d’alarme</button> qui imposent des examens immédiats ; de plus, il doit reconnaître les causes médicamenteuses ; enfin, il doit conduire le <button class="w" data-k="k59-palier">traitement par paliers</button> de la recommandation S2k et savoir quand explorer un <button class="w" data-k="k59-dysen">trouble de l’évacuation</button>.</p><p><i>Pourquoi ce cas ?</i> En effet, la constipation est l’un des troubles digestifs les plus fréquents, et sa prise en charge est souvent répétitive et peu raisonnée. Ainsi, contrairement à un manuel figé qui énumère des laxatifs, ce cours suit le raisonnement : chaque mot vert ouvre le critère, l’examen, la dose suisse ou l’image correspondante, de sorte que la décision peut être refaite pas à pas, puis appliquée à la patiente.</p><div class="key"><b>Point de départ.</b> La patiente remplit-elle les critères ? A-t-elle un signe d’alarme ? Un médicament est-il en cause ? Ensuite seulement, on traite par paliers et l’on explore si le traitement échoue.</div></section>
<section class="ilot" id="k59-1"><h2><span class="n">1</span>Définitions et épidémiologie</h2><p>Selon la S2k DGVS/DGNM 2022, qui reprend les critères de <button class="w" data-k="k59-rome">Rome IV</button>, on parle de <button class="w" data-k="k59-cc">constipation chronique</button> lorsque trois conditions sont réunies depuis au moins 3 mois, avec un début des symptômes au moins 6 mois avant le diagnostic. D’abord, le patient présente au moins deux des symptômes suivants : des selles dures ou en grumeaux (types 1 à 2 de l’<button class="w" data-k="k59-bristol">échelle de Bristol</button>), un effort de poussée, une sensation d’évacuation incomplète, une sensation d’obstruction anorectale ou des manœuvres manuelles, chacun lors de plus de 25 % des défécations, ou encore moins de 3 selles spontanées par semaine. Ensuite, les selles molles sont rares sans laxatif. Enfin, les critères du <button class="w" data-k="k59-sii">syndrome de l’intestin irritable</button> ne sont pas remplis.</p><p>Or, cette définition est volontairement large : en effet, beaucoup de patients vont à selle chaque jour, mais au prix d’efforts importants, et la S2k rappelle que le temps de transit est mieux corrélé à la consistance des selles qu’à leur fréquence. Par ailleurs, la prévalence dépend fortement de la définition employée : dans une même cohorte, elle variait de 9,4 à 58,9 %. C’est pourquoi la S2k retient une prévalence moyenne d’environ 15 % en Europe, nettement plus élevée chez les femmes et les personnes âgées.</p><table class="t"><tr><th>Code CIM-10-GM</th><th>Libellé officiel</th><th>Ce que le code décrit</th></tr><tr><td>K59.00</td><td>Constipation lors d’un trouble du transit colique</td><td>Le côlon progresse lentement ; c’est le <button class="w" data-k="k59-stc">transit lent</button>.</td></tr><tr><td>K59.01</td><td>Constipation lors d’un trouble de la défécation</td><td>Le rectum ne se vide pas bien ; c’est le <button class="w" data-k="k59-dysen">trouble de l’évacuation</button>.</td></tr><tr><td>K59.02</td><td>Constipation d’origine médicamenteuse</td><td>Un médicament ralentit le transit, par exemple un opioïde.</td></tr><tr><td>K59.09</td><td>Constipation, autre et sans précision</td><td>Le mécanisme n’est pas précisé.</td></tr><tr><td>K59.1 à K59.9</td><td>Diarrhée fonctionnelle, intestin neurogène, mégacôlon, spasme de l’anus, autres</td><td>Ces troubles sont signalés à la fin du cours.</td></tr></table><p><i>Que montre le tableau ?</i> La classification suisse distingue d’emblée les deux grands mécanismes, le transit lent et le trouble de la défécation ; or, ils ne se traitent pas de la même façon, puisque le second relève surtout de la rééducation par <button class="w" data-k="k59-biofb">biofeedback</button>. C’est pourquoi le code n’est précis que lorsque le mécanisme a été démontré par des examens fonctionnels ; avant cela, on code K59.09.</p><div class="key"><b>À retenir.</b> La constipation chronique se définit par au moins deux symptômes (selles dures, poussée, évacuation incomplète, obstruction, manœuvres manuelles, moins de 3 selles par semaine) depuis 3 mois, avec un début 6 mois avant le diagnostic. Sa prévalence est d’environ 15 % en Europe, plus élevée chez les femmes et les personnes âgées.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></section>
<section class="ilot" id="k59-2"><h2><span class="n">2</span>Physiopathologie : transit lent, évacuation difficile et causes secondaires</h2><p>La progression des selles dépend d’un système sensorimoteur propre à l’intestin. Ainsi, les <button class="w" data-k="k59-icc">cellules interstitielles de Cajal</button> jouent le rôle de stimulateurs, le système nerveux entérique coordonne les contractions, et la musculature lisse les exécute ; or, selon la S2k, la constipation peut s’associer à des anomalies de ces cellules, à des neuropathies ou à des myopathies entériques. Dans ce cas, le côlon progresse lentement, l’eau des selles est davantage réabsorbée, et les selles deviennent dures : c’est le <button class="w" data-k="k59-stc">transit lent</button>.</p><p>En revanche, dans le <button class="w" data-k="k59-dysen">trouble de l’évacuation</button>, le côlon fonctionne, mais la sortie ne s’ouvre pas correctement. En effet, lors de la poussée, le muscle puborectal et le sphincter externe devraient se relâcher pendant que la pression abdominale augmente ; s’ils se contractent au contraire, on parle de <button class="w" data-k="k59-dyssyn">dyssynergie du plancher pelvien</button>. De plus, un obstacle anatomique, comme une rectocèle, une intussusception rectale ou un prolapsus, peut gêner l’évacuation. Par ailleurs, la S2k souligne que les facteurs de mode de vie classiquement invoqués, une alimentation pauvre en fibres, un apport hydrique faible, la sédentarité ou la répression du besoin, sont associés à la constipation, mais qu’un lien causal direct n’est pas démontré ; ils révèlent plutôt une tendance préexistante.</p><table class="t"><tr><th>Groupe de causes secondaires (S2k)</th><th>Exemples cités par la recommandation</th></tr><tr><td>Médicaments</td><td>Opioïdes, anticholinergiques, antidépresseurs tricycliques, neuroleptiques, IMAO, antiépileptiques, antihistaminiques, antiacides contenant du calcium, antihypertenseurs, spasmolytiques, sympathomimétiques, diurétiques, colestyramine</td></tr><tr><td>Maladies neurologiques</td><td>Maladie de Parkinson, sclérose en plaques, maladies cérébrovasculaires (accident vasculaire, démence), neurofibromatose, tabès</td></tr><tr><td>Obstacles anorectaux</td><td>Rectocèle, entérocèle, intussusception rectale, prolapsus, descente marquée du plancher pelvien</td></tr><tr><td>Causes endocriniennes</td><td>Hypothyroïdie : le transit n’est pas allongé, mais la sensibilité rectale est modifiée</td></tr></table><p><i>Que montre le tableau ?</i> Chaque groupe agit à un étage différent : les médicaments freinent la motricité ou la sécrétion, les maladies neurologiques désorganisent la commande, et les obstacles anorectaux bloquent la sortie. Ainsi, le tricyclique de la patiente, qui est anticholinergique, peut à lui seul freiner la motricité du côlon ; c’est pourquoi l’anamnèse médicamenteuse précède tout examen.</p><div class="key"><b>À retenir.</b> Le transit lent provient d’une atteinte des cellules de Cajal, des nerfs ou des muscles entériques ; le trouble de l’évacuation provient d’une dyssynergie ou d’un obstacle anorectal. Les médicaments, en particulier les opioïdes et les anticholinergiques, sont la première cause secondaire à rechercher.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></section>
<section class="ilot" id="k59-3"><h2><span class="n">3</span>Démarche diagnostique de base</h2><p>Selon la S2k, le bilan de base doit comprendre une anamnèse précise, qui analyse le comportement défécatoire, les médicaments, les symptômes associés et les maladies possiblement causales ; de plus, il comprend un examen clinique avec inspection de l’anus et <button class="w" data-k="k59-tr">toucher rectal</button>, au cours duquel on apprécie le tonus de repos, la contraction volontaire et la tentative de poussée (recommandation forte). Ensuite, la S2k recommande de quantifier les selles, si possible par un journal des selles qui inclut l’<button class="w" data-k="k59-bristol">échelle de Bristol</button>.</p><p>Cependant, l’anamnèse ne sépare pas sûrement les mécanismes : en effet, des selles rares et dures sans difficulté d’évacuation orientent vers un <button class="w" data-k="k59-stc">transit lent</button>, mais la S2k rappelle que les symptômes ne sont pas univoques. De même, un toucher rectal normal n’exclut pas un <button class="w" data-k="k59-dysen">trouble de l’évacuation</button>, puisque sa valeur prédictive négative n’est que de 64 %. Par ailleurs, si le patient décrit aussi des douleurs abdominales, il faut appliquer la recommandation sur l’intestin irritable (cours <button class="w" data-k="k59-sii">K58</button>), car les deux troubles se recouvrent largement.</p><figure><img src="data:image/gif;base64,R0lGODdhBgERAoYAAP///////v///f///P/+/v7//v7+//7+/v7//f7+/f7/+/7+/P7++/3//v3+/v3+/f3++/z+/f/9/v79/v79/f39/v39/f39/P39+/38+/z8/Pv8+fv5+Pn5+Pj29Pfy7+7y7fDt6+vn5+zk3uLc2+TZz9/Ry93LvM/LydS/rsO8ucivmceeW6+no6uZj8KQN8SPK8SQKbmILbmIKbeELK6KYK59MpaJg499c6d3OKJuNJZvT4hwYYhlS49eNYNeQXxcRH5WOHpPL25ucGNgYGlUR3FNNWFNQmtGM2xEImNDNFBDPmY8I2A7KVg7L101IFM1KlQvHkwwJjgyMkgpHTgoI0IjGTwhGTYgGTIbFC0WESAdHCQVESESDyAPDBIKCQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAABgERAkAI/wBBCBxIsKDBgwgTiljI K4nXv97AsprWvCY2ORJKidgGAMtEQG1s8yoDkBN3DwEVAiTCybBOWqA9F3gTQeK5gQwEziKquicqHWitamWzn/78597G1pFw8q1/CoERQgyAuwlIQAIEwJ0b3YmBIJKSnAag2D5beUGAcrSjHu3Iq3zDtwpmkHbbMsA9mxmxANxTKwdY1d0+KtOZ0hSWId2IKXFqFAEs8wDkjKJDAwDU2jATeTU9KlKTSjYvjlEjClAAzLaFkJRSlapKvSpWszpSnTY1I7JhCDMLwBCEOKCqVtUqWj0aEAA7" width="262" height="529" loading="lazy" decoding="async" alt="Échelle de Bristol : sept dessins de selles, des billes dures séparées (type 1) aux selles entièrement liquides (type 7)."><figcaption>Échelle de Bristol des formes de selles : les types 1 et 2 correspondent aux selles dures de la constipation. <small>Image : Jaipasdepseudo, Wikimedia Commons, licence CC BY-SA 4.0 (<a href="https://commons.wikimedia.org/wiki/File:Bristol_stool_scale.png" target="_blank" rel="noopener">source</a>), adaptée en GIF.</small></figcaption></figure><p><i>Que montre l’image ?</i> Plus la selle séjourne longtemps dans le côlon, plus elle perd d’eau ; ainsi, les billes dures du type 1 traduisent un séjour prolongé, alors que les types 6 et 7 traduisent un passage rapide. C’est pourquoi la S2k préfère cette échelle à la seule fréquence : la forme des selles reflète mieux le temps de transit, et elle permet ensuite de juger objectivement l’effet du traitement.</p><div class="quiz ui"><p>Une patiente va à selle chaque jour, mais elle pousse fort et s’aide avec les doigts lors de la plupart des défécations. Peut-elle avoir une <button class="w" data-k="k59-cc">constipation chronique</button> ?</p><button data-ok="0">Non, puisqu’elle va à selle chaque jour</button><button data-ok="1">Oui, car deux symptômes suffisent, même avec une fréquence normale</button><button data-ok="0">Seulement si ses selles sont de type 7</button><p class="fb" hidden>La définition exige au moins deux symptômes, dont l’effort de poussée et les manœuvres manuelles ; la fréquence n’est qu’un critère parmi d’autres. De plus, ces deux symptômes orientent vers un trouble de l’évacuation.</p></div><div class="key"><b>À retenir.</b> On analyse les selles, les médicaments et les maladies, puis on examine l’anus et l’on fait un toucher rectal avec tentative de poussée ; on tient un journal des selles avec l’échelle de Bristol. Un toucher rectal normal n’exclut pas un trouble de l’évacuation (valeur prédictive négative de 64 %).</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></section>
<section class="ilot" id="k59-4"><h2><span class="n">4</span>Signes d’alarme et examens de seconde intention</h2><p>La décision suivante consiste à savoir si l’on peut traiter d’emblée. Ainsi, selon la S2k, en l’absence de <button class="w" data-k="k59-alarme">signe d’alarme</button> et si le bilan de base est normal, on peut commencer par un traitement d’épreuve, dont l’effet est évalué après environ 4 semaines ; il faut toutefois respecter les recommandations de dépistage du cancer colorectal. En revanche, des plaintes sévères ou un signe d’alarme imposent des examens immédiats, sans traitement d’épreuve préalable (recommandation forte).</p><p>Les examens procèdent alors en deux temps. D’abord, on exclut une cause organique : une formule sanguine et des marqueurs de l’inflammation, complétés selon le contexte par les électrolytes, la fonction rénale, les enzymes hépatiques et pancréatiques, la TSH, la glycémie ou l’HbA1c et la calprotectine fécale, puis une échographie abdominale et surtout une <button class="w" data-k="k59-colo">iléocoloscopie</button>. Ensuite, si la constipation résiste au traitement, on précise le mécanisme par des examens fonctionnels : la <button class="w" data-k="k59-mano">manométrie anorectale</button>, le <button class="w" data-k="k59-ballon">test d’expulsion du ballonnet</button>, la <button class="w" data-k="k59-defeco">défécographie</button> et l’étude du <button class="w" data-k="k59-hinton">temps de transit colique</button>. À l’inverse, la S2k déconseille la culture bactérienne ou fongique des selles, qui n’apporte aucun résultat utile.</p><div class="alert"><b>Gravité d’abord.</b> Selon la S2k, les signes d’alarme comprennent un saignement ou du sang dans les selles, une anémie, une perte de poids inexpliquée de plus de 10 %, des antécédents personnels ou familiaux de tumeur digestive, des adénopathies, une masse palpable, une dénutrition, une fausse diarrhée, un âge de plus de 50 ans, une évolution progressive et une histoire courte avec des plaintes sévères. Chacun de ces signes fait rechercher d’abord une cause organique, en particulier un cancer colorectal (cours C18).</div><div class="key"><b>À retenir.</b> Sans signe d’alarme, on fait un traitement d’épreuve et on le réévalue à 4 semaines ; avec un signe d’alarme ou des plaintes sévères, on exclut d’abord une cause organique (biologie, échographie, iléocoloscopie). Ensuite, en cas d’échec, on précise le mécanisme par la manométrie, le ballonnet, la défécographie et le transit colique.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></section>
<section class="ilot" id="k59-5"><h2><span class="n">5</span>Mesures de base : boissons, fibres et habitudes</h2><p>Le premier palier ne demande pas de médicament. Ainsi, la S2k recommande un apport hydrique quotidien de 1,5 à 2 litres ; en revanche, boire davantage n’a pas d’effet thérapeutique et ne doit donc pas être conseillé. De même, il faut éviter l’inactivité physique ; toutefois, on ne doit pas promettre qu’une activité supérieure à la normale pour l’âge améliorera la constipation. Par ailleurs, il faut éviter de réprimer régulièrement le besoin d’aller à selle, car le réflexe s’émousse lorsqu’il est ignoré.</p><p>Ensuite, les fibres augmentent la fréquence des selles ; c’est pourquoi la S2k vise un apport de 30 g par jour, comme pour la population générale. Or, les preuves sont meilleures pour les fibres solubles, en particulier le <button class="w" data-k="k59-psyl">psyllium</button>, que pour les fibres insolubles comme le son. Cependant, les fibres provoquent souvent des ballonnements et des crampes ; dans ce cas, la S2k conseille de réduire les fibres à titre d’essai et de préférer d’abord un laxatif osmotique, surtout si les selles stagnent déjà. De plus, deux portions par jour de fruits riches en fibres peuvent protéger de la constipation, alors que la transplantation de microbiote fécal ne doit pas être proposée.</p><div class="key"><b>À retenir.</b> Le patient boit 1,5 à 2 L par jour, sans excès inutile ; il reste actif et ne réprime pas le besoin. Il vise 30 g de fibres par jour, de préférence du psyllium, et il réduit les fibres si elles provoquent des ballonnements, au profit d’un laxatif osmotique.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/021-019l_S2k_Chronische_Obstipation_2022-11.pdf" target="_blank" rel="noopener">Andresen V. et al., Aktualisierte S2k-Leitlinie chronische Obstipation der DGVS und der DGNM, Z Gastroenterol 2022;60:1528-1572 (AWMF 021-019)</a>.</p></section>
