<section class="ilot" id="c72-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Une femme de 33 ans décrit depuis plusieurs mois des fourmillements diffus aux quatre membres. Puis une faiblesse s’installe et sa marche devient instable. L’<button class="w" data-k="c72-irm">IRM (principe, séquences et pièges)</button> montre une lésion à l’intérieur de la moelle. Cette vignette est fictive ; les données qui l’éclairent viennent des sources citées en fin de cours. Elle correspond à plusieurs situations de départ de l’examen fédéral (<button class="w" data-k="c72-ssp">objectifs PROFILES et situations de départ</button>) : sensations anormales des membres, troubles de la marche, déficit moteur.</p>
<p>Trois questions se posent dans l’ordre. Est-ce une tumeur, ou une lésion inflammatoire qui lui ressemble ? Si c’est une tumeur, de quel type s’agit-il : un <button class="w" data-k="c72-types-epend">épendymome (types spinaux et grade)</button>, un <button class="w" data-k="c72-astro">astrocytome médullaire (grades et fusion BRAF)</button> ou un <button class="w" data-k="c72-dmg">gliome diffus de la ligne médiane H3 K27-altéré (définition et pronostic)</button> ? Enfin, quelle stratégie préserve le mieux la fonction neurologique : l’exérèse, la biopsie ou la radiothérapie ?</p>
<p>Les réponses ne sont pas interchangeables. L’épendymome se laisse souvent enlever en un bloc, car il pousse de façon bien limitée. L’astrocytome infiltrant ne le permet presque jamais chez l’adulte. Le gliome H3 K27-altéré relève surtout d’une biopsie et d’une radiothérapie. Chaque type impose donc une conduite différente, ce qui fait de la classification le cœur du raisonnement.</p>
<div class="key"><b>À retenir.</b> Devant une lésion intramédullaire, la <button class="w" data-k="c72-irm">morphologie à l’IRM</button> oriente le type, mais seul le diagnostic intégré (histologie, grade, biologie moléculaire) le fixe. Le type décide ensuite entre exérèse, biopsie et radiothérapie.</div>
</section>

<section class="ilot" id="c72-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>Le code C72 de la CIM-10-GM 2024 regroupe les tumeurs malignes de la moelle épinière, des nerfs crâniens et d’autres parties du système nerveux central. Les <button class="w" data-k="c72-codes">sous-codes C72.0 à C72.9 (contenu et exclusions)</button> distinguent la moelle (C72.0), la queue de cheval (C72.1), le nerf olfactif (C72.2), le nerf optique (C72.3), le nerf auditif ou vestibulocochléaire (C72.4), les autres nerfs crâniens (C72.5), les lésions à localisations contiguës (C72.8) et le système nerveux central sans précision (C72.9). Les méninges relèvent de C70, les nerfs périphériques de C47.</p>
<p>Ce cours traite d’abord les tumeurs malignes intramédullaires et celles de la queue de cheval, qui ont fait l’objet de recommandations lues. Les tumeurs malignes des nerfs crâniens sont décrites plus brièvement, faute de source dédiée lue : cette limite est assumée dans la section <button class="w" data-k="c72-lacunes">lacunes des sources (ce qui n’a pas été lu)</button>.</p>
<h3>1.1 Classification de l’OMS 2021</h3>
<p>La <button class="w" data-k="c72-oms2021">classification OMS 2021 des tumeurs du système nerveux central (grades et diagnostic intégré)</button> attribue des grades en chiffres arabes à l’intérieur de chaque type. Le diagnostic s’écrit en couches : diagnostic intégré, histologie, grade, information moléculaire. Les suffixes NOS (test non fait ou non concluant) et NEC (résultats ne correspondant à aucune entité) signalent les cas incomplets.</p>
<table class="t"><thead><tr><th>Entité</th><th>Particularité OMS 2021</th><th>Conséquence pratique</th></tr></thead><tbody>
<tr><td>Épendymome spinal</td><td>Altération caractéristique de NF2</td><td>Chercher un contexte de neurofibromatose de type 2</td></tr>
<tr><td>Épendymome spinal, MYCN-amplifié</td><td>Type nouveau ; amplification de MYCN</td><td>Comportement agressif, récidive 75–100 %</td></tr>
<tr><td>Épendymome myxopapillaire</td><td>Passé du grade 1 au grade 2</td><td>Risque de récidive proche de l’épendymome spinal conventionnel ; comportement /1 en CIM-O, donc codé en D43.4 et non en C72.1 (îlot 12)</td></tr>
<tr><td>Subépendymome</td><td>Entité distincte, très rare dans la moelle</td><td>Adultes exclusivement</td></tr>
<tr><td>Gliome diffus de la ligne médiane H3 K27-altéré</td><td>Grade 4 ; « mutant » devenu « altéré »</td><td>Mutation H3 K27 ou surexpression d’EZHIP</td></tr>
<tr><td>Astrocytomes médullaires</td><td>Pilocytique (1), diffus (2), anaplasique (3), glioblastome (4)</td><td>Le grade guide la radiothérapie</td></tr>
<tr><td>Tumeurs malignes des gaines nerveuses</td><td>MPNST ; tumeur maligne mélanotique des gaines nerveuses</td><td>En cas de suspicion de MPNST : exérèse si sûre et faisable, sinon biopsie guidée</td></tr></tbody></table>
<p>Ce tableau résume le gradient de risque. Les <button class="w" data-k="c72-types-epend">types d’épendymome</button> forment un continuum de comportement, du subépendymome, très rare dans la moelle, au type MYCN-amplifié agressif. Le grade ne se déduit donc pas de la localisation médullaire : il vient du type et de sa biologie.</p>
<h3>1.2 Classification moléculaire des épendymomes spinaux</h3>
<p>Les <button class="w" data-k="c72-moleculaire">groupes de méthylation spinaux (SP-SE, SP-MPE, SP-EPN)</button> sont au nombre de trois : SP-SE pour le subépendymome, SP-MPE pour l’épendymome myxopapillaire et SP-EPN pour l’épendymome spinal de grade 2 ou 3. Au sein du groupe SP-MPE, la forme MPE-A touche des patients plus jeunes, se prête moins bien à l’exérèse complète et a un pronostic plus mauvais que MPE-B.</p>
<button class="pareto-btn ui" data-k="pareto-c72-definition">▲ Loi de Pareto — Définition et classifications</button>
</section>

<section class="ilot" id="c72-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Les tumeurs médullaires primitives représentent 2 à 4 % des tumeurs primitives du système nerveux central. Leur rareté contraste avec leur retentissement : une tumeur située dans la moelle peut interrompre à la fois la motricité, la sensibilité et le contrôle des sphincters, comme le montrent les syndromes médullaires décrits plus loin. La <button class="w" data-k="c72-epidemio">répartition par type et par âge (adulte et enfant)</button> diffère entre l’adulte et l’enfant.</p>
<div class="two"><div class="card"><h4>Adulte</h4><p>L’épendymome est la tumeur intrinsèque spinale la plus fréquente de l’adulte, et représente environ 1 % des tumeurs du système nerveux central. Dans une étude néerlandaise d’épendymomes adultes, le type spinal de grade 2 représentait 56 %, l’anaplasique 9 %, le myxopapillaire 20 % et le subépendymome 11 %. Le sex-ratio est proche de 1.</p></div><div class="card"><h4>Enfant</h4><p>L’astrocytome est la tumeur intramédullaire la plus fréquente de l’enfant (40 à 60 %), surtout de type pilocytique. Chez l’adulte, les astrocytomes de haut grade sont plus fréquents, et siègent de préférence aux segments cervical et cervico-thoracique.</p></div></div>
<p>Les astrocytomes forment 30 à 40 % des gliomes intramédullaires, et ceux de haut grade (3 et 4) environ 25 %. Le glioblastome spinal ne représente que 1 à 3 % des tumeurs intramédullaires. Pour le gliome diffus H3 K27-altéré de la moelle, une revue portant sur 279 patients publiés indique 61 % d’hommes et un âge moyen de 32 ans ; une série adulte donne un âge médian de 33 ans, avec une atteinte thoracique dans 29 % des cas et cervicale dans 18 %.</p>
<h3>2.1 Données suisses</h3>
<p>Les <button class="w" data-k="c72-epidemio-suisse">données suisses (Zurich et registre de l’enfant)</button> ne séparent pas le code C72. Dans le canton de Zurich (1980–2021, personnes de 15 ans et plus, toutes tumeurs cérébrales et du système nerveux central), l’incidence standardisée des tumeurs malignes était, en 2011–2021, de 7,7 pour 100 000 chez l’homme et de 5,0 chez la femme, stable. La mortalité par tumeur maligne atteignait 5,7 et 3,6 pour 100 000. La survie relative à cinq ans des tumeurs malignes était d’environ 30 % (28 % chez l’homme, 33 % chez la femme, 2011–2017).</p>
<p>Chez l’enfant, le Registre suisse du cancer de l’enfant (1990–2019) donne pour les gliomes de bas grade une incidence d’environ 1,4 pour 100 000 par an. La localisation spinale en représente 4,6 % et la neurofibromatose de type 1 est présente chez 3,7 %. La survie globale à dix ans est de 72,8 % pour les tumeurs spinales, contre 93,1 % pour les tumeurs sus-tentorielles et 93,8 % pour les tumeurs sous-tentorielles ; le risque d’événement est environ doublé pour la localisation spinale (rapport de risques ajusté d’environ 2,1).</p>
<div class="trap"><span class="k">Piège</span> Le chiffre zurichois de 7,7 et 5,0 pour 100 000 concerne <b>toutes</b> les tumeurs malignes du système nerveux central de l’adulte. Il ne peut pas être cité comme incidence des tumeurs de la moelle ou des nerfs crâniens, dont aucun chiffre suisse séparé n’a été trouvé.</div>
<button class="pareto-btn ui" data-k="pareto-c72-epidemio">▲ Loi de Pareto — Épidémiologie</button>
</section>

<section class="ilot" id="c72-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Pour comprendre pourquoi les tumeurs spinales se comportent si différemment, il faut partir de l’anatomie normale. Le cône médullaire se termine habituellement en T12–L1. Sous lui, la queue de cheval est formée de racines et non de moelle. Cette <button class="w" data-k="c72-anat-cone">transition du cône à la queue de cheval (niveaux et conséquences)</button> explique que les signes d’une tumeur lombaire basse soient périphériques, tandis qu’une tumeur du cône mêle signes centraux et périphériques.</p>
<h3>3.1 Deux manières de croître</h3>
<p>L’épendymome pousse de façon plutôt centrale et bien limitée. Il s’entoure souvent de kystes polaires et de dépôts d’hémosidérine formant une coiffe, et s’accompagne fréquemment d’une syringomyélie. Cette croissance délimitée laisse un <button class="w" data-k="c72-plan-clivage">plan de clivage (définition et rôle chirurgical)</button> entre tumeur et moelle saine, d’où la possibilité d’une exérèse complète.</p>
<p>L’astrocytome a la logique inverse. Sa croissance est infiltrante, excentrée et mal limitée ; chez l’adulte, aucun plan de clivage n’existe. L’<button class="w" data-k="c72-infiltration">infiltration (conséquence sur l’exérèse)</button> explique qu’une exérèse complète ne soit possible que dans 13 à 38 % des astrocytomes de grade 2 à 4, et qu’elle soit alors plus morbide. L’astrocytome pilocytique, mieux limité, fait exception.</p>
<h3>3.2 Mécanismes moléculaires</h3>
<p>Le gliome H3 K27-altéré repose sur une altération de l’histone H3, avec perte de H3K27me3 ; le promoteur de MGMT est habituellement non méthylé, ce qui explique le <button class="w" data-k="c72-h3k27">bénéfice incertain du témozolomide (H3 K27 et MGMT)</button>. L’épendymome MYCN-amplifié, lui, est défini par l’amplification de MYCN et récidive dans 75 à 100 % des cas : la <button class="w" data-k="c72-mycn">biologie MYCN (comportement agressif)</button> prime ici sur l’aspect favorable d’une lésion bien limitée.</p>
<div class="key"><b>À retenir.</b> La chirurgie suit la biologie. Une tumeur qui ménage un plan se retire ; une tumeur qui infiltre se biopsie ou se réduit, puis se traite par radiothérapie selon le grade.</div>
<button class="pareto-btn ui" data-k="pareto-c72-mecanismes">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="c72-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Les sources lues ne décrivent aucun facteur environnemental propre aux tumeurs spinales. Elles décrivent en revanche des contextes génétiques qu’il faut chercher, car ils modifient le suivi et la prise en charge. Le tableau relie chaque syndrome aux tumeurs qu’il favorise.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Tumeur associée</th><th>Donnée chiffrée</th></tr></thead><tbody>
<tr><td><button class="w" data-k="c72-nf2">Neurofibromatose de type 2</button></td><td>Épendymome spinal</td><td>Altération de NF2 caractéristique</td></tr>
<tr><td><button class="w" data-k="c72-nf1">Neurofibromatose de type 1 (gliomes et MPNST)</button></td><td>Gliome des voies optiques ; gliomes ; MPNST</td><td>Jusqu’à 15 % des enfants avec gliome optique ; risque de MPNST sur la vie entière 8–16 %</td></tr>
<tr><td><button class="w" data-k="c72-schwannomatose">Schwannomatose SMARCB1</button></td><td>MPNST</td><td>Risque accru ; radiothérapie possiblement délétère</td></tr>
<tr><td><button class="w" data-k="c72-predisposition">Autres syndromes de prédisposition aux gliomes</button></td><td>Gliomes</td><td>Sclérose tubéreuse, Turcot, Li-Fraumeni, Lynch</td></tr></tbody></table>
<p>Chez l’adulte atteint de neurofibromatose de type 1, le risque de gliome de haut grade est environ 50 fois supérieur à celui de la population générale. Pour le gliome des voies optiques, l’âge moyen est de 4,5 ans, la plupart des cas survenant avant 8 ans ; 40 à 50 % deviennent symptomatiques et 15 à 20 % sont traités. Ces données justifient le suivi ophtalmologique décrit dans la section <a href="#c72-10">suivi</a>.</p>
</section>

<section class="ilot" id="c72-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Le début est souvent non spécifique, ce qui explique les retards diagnostiques de plusieurs mois à plusieurs années. Une douleur axiale, des sensations anormales ou une radiculopathie ne distinguent pas une tumeur d’une cause banale. Les signes localisateurs sont une parésie non radiculaire, une ataxie et un déficit sensitif ; un syndrome transverse progressif impose un bilan. Les <button class="w" data-k="c72-debut">symptômes inauguraux par type tumoral (fréquence et signification)</button> sont résumés ci-dessous.</p>
<div class="two"><div class="card"><h4>Épendymome intramédullaire</h4><p>Des dysesthésies diffuses dominent. La douleur est rare, la parésie occasionnelle. Le diagnostic est souvent retardé de plusieurs mois, parfois de plusieurs années. Les sources lues n’en démontrent pas la cause ; le caractère diffus des plaintes en est une explication plausible, qui reste une interprétation.</p></div><div class="card"><h4>Épendymome myxopapillaire</h4><p>Il se manifeste par des dysesthésies ou des douleurs, par irritation radiculaire. Une parésie est très inhabituelle. La lésion siège surtout au niveau du cône médullaire et du filum terminal.</p></div></div>
<div class="two"><div class="card"><h4>Astrocytome</h4><p>Les troubles sphinctériens sont rares au début. La durée d’évolution des symptômes renseigne sur la vitesse de croissance : des semaines suggèrent une croissance rapide, des années une croissance lente.</p></div><div class="card"><h4>Cône ou queue de cheval</h4><p>Les deux syndromes associent des troubles sensitifs en selle, des troubles vésico-sphinctériens et sexuels, des lombalgies et une faiblesse des membres inférieurs. La <button class="w" data-k="c72-cone-queue">distinction cône / queue de cheval (signes centraux et périphériques)</button> repose sur la présence de signes centraux.</p></div></div>
<div class="trap"><span class="k">Piège</span> Les <button class="w" data-k="c72-voies-optiques">signes d’alarme d’un gliome des voies optiques (acuité, champ, pupilles, papille)</button> et les <button class="w" data-k="c72-alarme-mpnst">signes d’alarme du MPNST en NF1 (croissance, douleur, déficit)</button> ne se découvrent que si on les recherche. Chez un patient atteint de neurofibromatose de type 1, une douleur nouvelle, nocturne ou difficile à contrôler, ou un nodule dur dans un neurofibrome mou, n’est jamais banal.</div>
</section>

<section class="ilot" id="c72-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, puis examen neurologique complet, puis recherche des signes du syndrome du cône ou de la queue de cheval. Il cherche d’abord à localiser la lésion (moelle, cône, queue de cheval, nerf crânien), ensuite à mesurer le déficit pour pouvoir juger de l’évolution et du résultat du traitement.</p>
<div class="two"><div class="card"><h4>Moelle</h4><p>L’atteinte médullaire se manifeste par une parésie non radiculaire, une ataxie et un déficit sensitif. Un syndrome transverse progressif signe une atteinte intramédullaire étendue. Les troubles sphinctériens, rares au début d’un astrocytome, apparaissent plus tard.</p></div><div class="card"><h4>Cône et queue de cheval</h4><p>Le syndrome de la queue de cheval exige au moins deux éléments cardinaux : troubles sensitifs en selle, dysfonction vésicale, intestinale ou sexuelle. Le cône associe des signes centraux et des signes périphériques, la queue de cheval seulement des signes périphériques.</p></div></div>
<div class="two"><div class="card"><h4>Nerfs crâniens et neurofibromatose</h4><p>Acuité visuelle, champ visuel, pupilles, oculomotricité et papille composent l’examen ophtalmologique d’un gliome des voies optiques en neurofibromatose de type 1.</p></div><div class="card"><h4>Cause la plus fréquente à exclure</h4><p>La cause la plus fréquente d’un syndrome de la queue de cheval est la hernie discale aiguë, non la tumeur : il faut penser à la tumeur sans oublier la cause banale.</p></div></div>
<section data-semiology-clinical="C72"><h3>Sémiologie clinique : de la plainte au niveau lésionnel</h3>
<p>Le raisonnement de la leçon part d’une plainte banale et cherche le moment où elle devient un signe localisateur. Le tableau suivant reprend, dans l’ordre de la consultation, ce que le médecin demande, cherche et conclut.</p>
<table class="t"><thead><tr><th>Étape</th><th>Ce que le médecin cherche</th><th>Ce que cela signifie</th></tr></thead><tbody>
<tr><td>Symptômes</td><td>Douleur axiale, sensations anormales, radiculopathie ; dysesthésies diffuses persistantes ; troubles vésicaux, intestinaux ou sexuels</td><td>Le début est banal ; les dysesthésies diffuses évoquent l’épendymome intramédullaire, la douleur radiculaire une atteinte du cône ou du filum</td></tr>
<tr><td>Anamnèse analytique</td><td>Date du premier symptôme, vitesse de progression ; neurofibromatose de type 1 ; cancer connu ; contexte infectieux</td><td>Des semaines évoquent une croissance rapide, des années une croissance lente ; un antécédent de cancer augmente la probabilité d’une tumeur spinale chez le lombalgique</td></tr>
<tr><td>Signes</td><td>Parésie non radiculaire, ataxie, déficit sensitif ; troubles sensitifs en selle</td><td>Le trio localisateur désigne la moelle ; les troubles en selle et sphinctériens définissent le syndrome de la queue de cheval, avec au moins deux éléments cardinaux</td></tr>
<tr><td>Examen</td><td>Type de déficit : central, mixte ou périphérique pur ; résidu post-mictionnel à l’échographie ; tonus anal</td><td>Central : moelle ; mixte : cône ; périphérique pur : queue de cheval. Un résidu de 200 ml a une sensibilité de 82 % et une spécificité de 65 % ; un tonus anal normal ne rassure pas</td></tr>
<tr><td>Discrimination clinique</td><td>Mode d’installation et contexte ; cause banale</td><td>Installation douloureuse subaiguë : infarctus médullaire ; contexte infectieux : myélite. La hernie discale aiguë reste la première cause du syndrome de la queue de cheval</td></tr></tbody></table>
<div class="alert"><b>Situations urgentes.</b> Un déficit neurologique nouveau ou qui progresse impose une intervention rapide, car le pronostic dépend de la durée et de la sévérité du déficit préopératoire. Le syndrome de la queue de cheval est une urgence neurologique : l’IRM se demande sans attendre. En neurofibromatose de type 1, une croissance rapide d’un neurofibrome, une douleur nouvelle, un déficit nouveau ou un changement de consistance imposent une IRM régionale, puis une TEP au FDG avant toute chirurgie, à la recherche d’un MPNST.</div>
<p>Ce relevé prépare la démarche diagnostique de la section suivante : le niveau lésionnel fixé par l’examen détermine le champ de l’IRM, puis l’histologie confirme le type tumoral.</p>
</section>
<div class="key"><b>À retenir.</b> Le déficit neurologique préopératoire se documente avant tout geste : selon une synthèse suisse, le pronostic dépend de la durée et de la sévérité de ce déficit (<button class="w" data-k="c72-synthese-suisse">synthèses suisses de la Praxis (résumés)</button>).</div>
<button class="pareto-btn ui" data-k="pareto-c72-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
