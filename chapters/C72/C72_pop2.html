<template data-pop="c72-pieges-irm" data-title="Pièges de l’imagerie">
<div class="lab">Pièges</div><p>Une petite lésion sans kyste peut mimer une lésion inflammatoire. Un gliome H3 K27-altéré peut mimer un méningiome extramédullaire. Un épendymome myxopapillaire se distingue mal d’un petit schwannome ou neurofibrome de la queue de cheval.</p>
<div class="lab">Conduite</div><p>Quand une cause inflammatoire reste possible, une biopsie se discute. L’examen extemporané aide à séparer astrocytome et épendymome.</p>
<div class="lab">Limite</div><p>L’intérêt de la TEP aux acides aminés est limité pour l’astrocytome.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11122636/" target="_blank" rel="noopener">Auricchio et al. 2024, gliome H3 K27-altéré spinal de l’adulte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025, cône médullaire et queue de cheval</a>.</p></template>
<template data-pop="c72-biopsie" data-title="Histologie et biologie moléculaire">
<div class="lab">Indication</div><p>La biopsie est indiquée si l’exérèse n’est pas sûre, en échantillons sériés. Sinon, l’exérèse fournit le prélèvement.</p>
<div class="lab">Examens</div><p>Pour un gliome diffus médian, le statut H3 K27M se recherche systématiquement : immunohistochimie positive avec perte de H3K27me3. Le méthylome de l’ADN aide en cas de doute. L’ADN tumoral libre dans le LCR n’a pas de valeur démontrée.</p>
<div class="lab">Limite</div><p>Aucune recommandation spécifique à la moelle pour le gliome diffus ; les recommandations viennent des gliomes de l’adulte.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="c72-extension" data-title="Bilan d’extension de l’épendymome">
<div class="lab">Examens</div><p>IRM cranio-spinale et cytologie du LCR après la chirurgie, pas avant deux à trois semaines. Recommandé pour les tumeurs spinales et le myxopapillaire. Une IRM postopératoire évalue l’étendue de l’exérèse.</p>
<div class="lab">Interprétation</div><p>La source ne donne pas la raison du délai ; on l’interprète par les remaniements opératoires précoces.</p>
<div class="lab">Limite</div><p>L’intervalle de suivi n’est pas fixé par l’EANO.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a>.</p></template>
<template data-pop="c72-differentiel" data-title="Autres masses intramédullaires">
<div class="lab">Liste</div><p>Hémangioblastome lié à VHL, métastase, cavernome ; lésions inflammatoires lorsque la lésion est petite et sans kyste.</p>
<div class="lab">Conduite</div><p>Une biopsie se discute si une cause inflammatoire reste possible. Une hémorragie juxta-lésionnelle doit faire évoquer épendymome, métastase ou cavernome.</p>
<div class="lab">Limite</div><p>L’hémangioblastome est codé D33.4 et dépasse C72 ; aucune recommandation européenne n’a été lue à son sujet.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12563245/" target="_blank" rel="noopener">Brain Sciences 2025, marqueurs génétiques des tumeurs médullaires</a>.</p></template>
<template data-pop="c72-mpe-festonnage" data-title="Divergence : atteinte vertébrale de l’épendymome myxopapillaire">
<div class="lab">Textes en présence</div><p>La revue radiologique de Nersesyan et al., publiée le 25 octobre 2025 par la Société européenne de radiologie, écrit que l’épendymome myxopapillaire, en saucisse sur plusieurs niveaux, peut festonner les corps vertébraux (« scalloping »). Sa figure 1 montre, en tomodensitométrie, un festonnage de la face postérieure des corps vertébraux et des arcs postérieurs. La revue neurochirurgicale de Westphal et Mohme (octobre 2024) écrit au contraire que les schwannomes et les neurofibromes de croissance lente peuvent creuser les vertèbres, ce qui « ne survient jamais » dans l’épendymome myxopapillaire.</p>
<div class="lab">Choix retenu</div><p>La règle du projet donne la priorité à la source primaire applicable la plus récente. Aucune des deux n’est une recommandation : ce sont deux revues. La revue de 2025 est la plus récente, consacrée à l’imagerie, et documente le signe par un cas illustré ; le cours retient donc un festonnage possible, sans le présenter comme fréquent, et signale le désaccord.</p>
<div class="lab">Conséquence pratique</div><p>Un festonnage vertébral ne permet pas, à lui seul, de distinguer un épendymome myxopapillaire d’un schwannome ou d’un neurofibrome : seule l’histologie tranche.</p>
<div class="lab">Limite</div><p>Aucune fréquence du festonnage n’est donnée par l’une ou l’autre source.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025, cône médullaire et queue de cheval (Insights into Imaging), section Myxopapillary ependymoma et figure 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales, section Clinical presentation</a>.</p></template>
<template data-pop="c72-fdav" data-title="Fistule durale artérioveineuse">
<div class="lab">Signes</div><p>Hypersignal T2 du cône (jusqu’à 90 % des cas) et « flow voids » serpigineux.</p>
<div class="lab">Examen</div><p>L’angiographie est l’examen de référence.</p>
<div class="lab">Pourquoi la chercher</div><p>Elle imite une tumeur du cône sur l’IRM ; sa reconnaissance évite une biopsie ou un traitement inutile.</p>
<div class="lab">Limite</div><p>Revue radiologique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025, cône médullaire et queue de cheval</a>.</p></template>
<template data-pop="c72-meta-lepto" data-title="Métastases leptoméningées et « en goutte »">
<div class="lab">Chiffres</div><p>Les métastases leptoméningées concernent 5 à 10 % des cancers solides ou hématologiques, avec une survie moyenne de 3 à 6 mois. Les métastases en goutte viennent du médulloblastome ou de l’épendymome ; les métastases intramédullaires du cône, du poumon ou du sein.</p>
<div class="lab">Application</div><p>Elles entrent dans le différentiel d’une atteinte du cône et de la queue de cheval, avec infections et causes inflammatoires.</p>
<div class="lab">Limite</div><p>Revue radiologique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025, cône médullaire et queue de cheval</a>.</p></template>
<template data-pop="c72-urgence-imagerie" data-title="Urgence neurologique : imagerie sans délai">
<div class="lab">Indication</div><p>Le syndrome de la queue de cheval est une urgence neurologique. L’apparition d’un déficit neurologique impose une intervention rapide, car le pronostic dépend de la durée et de la sévérité du déficit préopératoire, selon une synthèse suisse. L’IRM se fait donc sans attendre.</p>
<div class="lab">Limite</div><p>Le délai exact n’est pas chiffré dans les sources lues. La compression médullaire métastatique (C79.4) n’a pas été documentée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025, cône médullaire et queue de cheval</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21732297/" target="_blank" rel="noopener">Spirig et al. 2011, tumeurs spinales intradurales, Praxis (résumé)</a>.</p></template>
<template data-pop="c72-mpnst-urgence" data-title="MPNST : exploration, exérèse ou biopsie guidée">
<div class="lab">Règle</div><p>Devant une suspicion d’ANNUBP ou de MPNST chez un patient atteint de NF1, l’exploration commence par une IRM régionale, complétée avant toute chirurgie par une TEP au FDG, de préférence couplée à l’IRM. L’exérèse primaire est recommandée si elle est sûre et faisable ; sinon, une biopsie guidée par l’imagerie est réalisée, à la discrétion d’un colloque sarcome, car la tumeur peut être hétérogène. L’attente vigilante n’a pas sa place dans le MPNST, et l’exérèse chirurgicale urgente en reste le pilier lorsqu’elle est possible.</p>
<div class="lab">Contexte</div><p>Risque sur la vie entière de 8 à 16 % en NF1, diagnostic surtout entre 20 et 40 ans.</p>
<div class="lab">Limite</div><p>Source unique (ERN GENTURIS) ; schwannomatose SMARCB1 : risque accru également.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9845795/" target="_blank" rel="noopener">ERN GENTURIS 2023, neurofibromatose de type 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9259735/" target="_blank" rel="noopener">ERN GENTURIS, schwannomatose</a>.</p></template>
<template data-pop="c72-oedeme" data-title="Corticoïdes et œdème">
<div class="lab">Règle</div><p>Un œdème symptomatique peut être traité en préopératoire par corticoïdes, sauf suspicion de lymphome ou de lésion inflammatoire. Un œdème asymptomatique ne se traite pas, et la dose est réduite dès que possible.</p>
<div class="lab">Fiche suisse</div><p>Dexaméthasone : œdème cérébral tumoral subaigu ou chronique, 8 à 12 mg par voie intraveineuse puis 4 mg toutes les 6 heures, effet maximal après 1 à 2 heures, arrêt progressif. Aucune indication explicite pour l’œdème médullaire.</p>
<div class="lab">Limite</div><p>L’emploi peropératoire de méthylprednisolone relève d’un avis d’auteur, sans essai randomisé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; information professionnelle suisse dexaméthasone Galepharm (Swissmedic, via AIPS).</p></template>
<template data-pop="c72-exerese" data-title="Exérèse maximale sûre">
<div class="lab">Principe</div><p>La prévention d’un nouveau déficit permanent prime sur l’étendue de l’exérèse.</p>
<div class="lab">Preuves</div><p>Les recommandations EANS-EANO 2026 portent sur l’exérèse des épendymomes de l’enfant (niveau B) et de l’adulte (point de bonne pratique) et des tumeurs de grade 1 (point de bonne pratique) ; seul le résumé a été lu.</p>
<div class="lab">Limite</div><p>Le texte intégral n’a pas été lu.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12962633/" target="_blank" rel="noopener">EANS-EANO 2026, étendue d’exérèse (résumé)</a>.</p></template>
<template data-pop="c72-neuromonitorage" data-title="Neuromonitorage peropératoire">
<div class="lab">Techniques</div><p>Les potentiels évoqués somesthésiques (PES) et moteurs (PEM) sont les plus utilisés. La sensibilité des PEM est de 84 %. L’onde D est très spécifique mais peu fiable en cas de déficit préopératoire sévère.</p>
<div class="lab">Débat</div><p>Westphal et Mohme jugent son apport discuté.</p>
<div class="lab">Limite</div><p>Données issues de revues narratives.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="c72-contentieux-rt" data-title="Contentieux : radiothérapie après exérèse incomplète d’un grade 2">
<div class="lab">Textes en présence</div><p>L’EANO 2018, recommandation primaire, indique après exérèse incomplète d’un épendymome spinal de grade 2 une radiothérapie locale de 45 à 54 Gy (II, B). La revue de Westphal et Mohme (2024) estime son rôle non démontré.</p>
<div class="lab">Choix retenu</div><p>La règle du projet donne la priorité à la source primaire applicable la plus récente. Pour la recommandation, la source primaire est le texte de l’EANO 2018 ; la revue de 2024 est une revue narrative, non une recommandation. Les recommandations EANS-EANO 2026, plus récentes, n’ont été lues qu’en résumé et ne tranchent pas cette question. Le cours présente donc la radiothérapie comme option recommandée (II, B), avec le désaccord signalé.</p>
<div class="lab">Texte actuellement en vigueur</div><p>Le texte lu de l’EANO 2018 reste la recommandation européenne la plus complète lue, même si son ancienneté impose de la prudence (grades romains, classification antérieure à l’OMS 2021).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12962633/" target="_blank" rel="noopener">EANS-EANO 2026, étendue d’exérèse (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a>.</p></template>
<template data-pop="c72-mpe-rt" data-title="Radiothérapie du myxopapillaire">
<div class="lab">Recommandation</div><p>Après exérèse incomplète, la recommandation est une radiothérapie d’au moins 50 Gy (II, B). Certaines séries soutiennent la radiothérapie quelle que soit l’exérèse ; elle est largement recommandée en cas de dissémination.</p>
<div class="lab">Données</div><p>La radiothérapie fait passer la survie sans progression à 10 ans de moins de 40 % à environ 70 %. La dissémination leptoméningée est de 9,3 %.</p>
<div class="lab">Limite</div><p>Séries rétrospectives.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485843/" target="_blank" rel="noopener">Bodensohn et al. 2024, radiothérapie fractionnée spinale</a>.</p></template>
<template data-pop="c72-rt-astro" data-title="Radiothérapie de l’astrocytome médullaire">
<div class="lab">Indications</div><p>Haut grade d’emblée ; bas grade à la progression ; pas de bénéfice démontré après exérèse subtotale d’un grade 2 ; pilocytique différée jusqu’à une récidive non résécable.</p>
<div class="lab">Données</div><p>Une méta-analyse associe la radiothérapie à une mortalité plus élevée dans le bas grade (biais de sélection) et plus basse dans le haut grade. Dans des séries rétrospectives de gliomes spinaux, une dose d’au moins 45 Gy, ou d’au moins 40 Gy selon les séries, a été associée à une meilleure survie ou à un meilleur contrôle tumoral, sans restriction au bas grade dans la revue lue.</p>
<div class="lab">Limite</div><p>Biais de sélection ; revues narratives.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485843/" target="_blank" rel="noopener">Bodensohn et al. 2024, radiothérapie fractionnée spinale</a>.</p></template>
<template data-pop="c72-dmg-ttt" data-title="Gliome H3 K27-altéré : traitement">
<div class="lab">Recommandation</div><p>Chirurgie limitée ; radiothérapie de 54 à 60 Gy en fractions de 1,8 à 2 Gy (encéphale), éventuellement avec témozolomide dont le bénéfice n’est pas établi.</p>
<div class="lab">Moelle</div><p>Dans les données spinales, dose moyenne de 47 Gy en 23 fractions ; aucune différence de survie entre exérèse et biopsie dans une série adulte.</p>
<div class="lab">Limite</div><p>Aucune recommandation EANO spécifique au gliome H3 K27-altéré spinal.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38342826/" target="_blank" rel="noopener">Watanabe et al. 2024, gliomes H3 K27-altérés de la moelle (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11122636/" target="_blank" rel="noopener">Auricchio et al. 2024, gliome H3 K27-altéré spinal de l’adulte</a>.</p></template>
<template data-pop="c72-rt-tolerance" data-title="Tolérance de la moelle (QUANTEC)">
<div class="lab">Chiffres</div><p>Le risque de myélopathie est d’environ 0,2 % à 50 Gy, 6 % à 60 Gy et 50 % à 69 Gy en équivalent de fractions de 2 Gy. Des doses jusqu’à 54 Gy sont utilisées avec un risque d’environ 1 à 2 %.</p>
<div class="lab">Conséquence</div><p>La myélopathie tardive, liée aux doses élevées, entraîne souvent des déficits graves et peut être définitive. Les données de protonthérapie sont insuffisantes chez l’adulte.</p>
<div class="lab">Limite</div><p>La revue cite aussi des recommandations américaines, non retenues comme fondement d’une conduite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485843/" target="_blank" rel="noopener">Bodensohn et al. 2024, radiothérapie fractionnée spinale</a>.</p></template>
<template data-pop="c72-nf1-ttt" data-title="MPNST et prise en charge en NF1">
<div class="lab">Règle</div><p>Le MPNST relève d’une exérèse primaire lorsqu’elle est sûre et faisable, sinon d’une biopsie guidée par l’imagerie, avec une décision en colloque spécialisé ; l’attente vigilante n’y a pas sa place. Les gliomes de NF1 se prennent en charge comme des gliomes sporadiques, en évitant la radiothérapie autant que possible.</p>
<div class="lab">Schwannomatose</div><p>La radiothérapie pourrait augmenter le risque de transformation maligne.</p>
<div class="lab">Limite</div><p>Forces de recommandation sans niveaux de preuve formels.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9845795/" target="_blank" rel="noopener">ERN GENTURIS 2023, neurofibromatose de type 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9259735/" target="_blank" rel="noopener">ERN GENTURIS, schwannomatose</a>.</p></template>
<template data-pop="c72-suivi-astro" data-title="Calendrier de suivi des astrocytomes">
<div class="lab">Calendrier</div><p>Pilocytique et grade 2 : clinique et IRM tous les 6 mois pendant 3 ans, puis annuel pendant 3 ans. Grades 3 et 4 : clinique tous les 3 mois et IRM tous les 6 mois pendant 5 ans.</p>
<div class="lab">Limite</div><p>Revue narrative.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="c72-pseudoprog" data-title="Pseudoprogression">
<div class="lab">Définition</div><p>Aggravation apparente à l’IRM après la radiothérapie, qui ne correspond pas à une vraie progression.</p>
<div class="lab">Conduite</div><p>Elle survient surtout dans les trois premiers mois ; l’IRM 3 à 4 semaines après la radiothérapie sert de nouvelle référence, et un contrôle à 4–8 semaines est proposé en cas de doute.</p>
<div class="lab">Limite</div><p>Recommandation sur les gliomes de l’adulte, non spécifique à la moelle.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a>.</p></template>
<template data-pop="c72-sequelles" data-title="Séquelles de la chirurgie de l’épendymome">
<div class="lab">Fréquences</div><p>Perte proprioceptive (souvent régressive), douleur neuropathique jusqu’à 30 %, moelle attachée jusqu’à 37 %, déformation pédiatrique 16 % (dont 55 % stabilisées).</p>
<div class="lab">Limite</div><p>Revue narrative d’épendymomes de l’adulte principalement.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a>.</p></template>
<template data-pop="c72-pronostic" data-title="Lecture du pronostic">
<div class="lab">Principe</div><p>Le pronostic dépend du type moléculaire (MYCN, MPE-A, H3 K27) plus que du seul siège.</p>
<div class="lab">Chiffres</div><p>Épendymome grade 2 : survie à 10 ans de 96 % ; MPE : 92,4 % ; astrocytome intramédullaire : survie à 15 ans de 40 à 65 % ; grade 4 : survie à 5 ans d’environ 14 % ; gliome H3 K27-altéré de la moelle : médiane d’environ 24 mois.</p>
<div class="lab">Limite</div><p>Séries rétrospectives ; suivi manquant à 35 % dans une revue ; pas de pronostic individuel.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38342826/" target="_blank" rel="noopener">Watanabe et al. 2024, gliomes H3 K27-altérés de la moelle (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11122636/" target="_blank" rel="noopener">Auricchio et al. 2024, gliome H3 K27-altéré spinal de l’adulte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12563245/" target="_blank" rel="noopener">Brain Sciences 2025, marqueurs génétiques des tumeurs médullaires</a>.</p></template>
<template data-pop="c72-d-temozolomide" data-title="Témozolomide (Temodal®)">
<div class="lab">Source</div><p>Information professionnelle suisse Temodal® (Merck Sharp &amp; Dohme), mise à jour de décembre 2021, consultée le 15 octobre 2026 dans la base des informations professionnelles.</p>
<div class="lab">Indications suisses</div><p>Glioblastome nouvellement diagnostiqué (75 mg/m²/jour pendant 42 jours avec radiothérapie de 60 Gy en 30 fractions, puis 6 cycles de 150 à 200 mg/m², jours 1 à 5 tous les 28 jours) et gliome malin récidivant (200 mg/m², jours 1 à 5 tous les 28 jours ; 150 mg/m² au premier cycle si chimiothérapie antérieure). Prise à jeun.</p>
<div class="lab">Précautions</div><p>Contre-indications : hypersensibilité (dont dacarbazine), grossesse, allaitement, insuffisance rénale ou hépatique sévère, myélosuppression sévère. Prophylaxie de la pneumonie à Pneumocystis lors de l’association à la radiothérapie, recherche de l’hépatite B avant traitement, nadir aux jours 21 à 28, hémogramme hebdomadaire en phase concomitante. Risque de neutropénie et de thrombopénie accru après 70 ans. Chez l’homme : aucune procréation pendant le traitement et pendant trois mois après.</p>
<div class="lab">Limite</div><p>Aucune indication spinale ni épendymaire : tout usage dans C72 est hors indication suisse.</p>
<p class="src">Références : information professionnelle suisse Temodal® (Swissmedic, via AIPS).</p></template>
<template data-pop="c72-d-dexa" data-title="Dexaméthasone (Galepharm)">
<div class="lab">Source</div><p>Information professionnelle suisse de la dexaméthasone Galepharm (ampoules), mise à jour de juin 2022, consultée le 15 octobre 2026.</p>
<div class="lab">Posologie</div><p>Œdème cérébral tumoral subaigu ou chronique : 8 à 12 mg par voie intraveineuse, puis 4 mg toutes les 6 heures ; effet maximal après 1 à 2 heures ; arrêt progressif.</p>
<div class="lab">Limite</div><p>Aucune indication explicite pour l’œdème médullaire dans l’information professionnelle.</p>
<p class="src">Références : information professionnelle suisse dexaméthasone Galepharm (Swissmedic, via AIPS).</p></template>
<template data-pop="c72-d-selumetinib" data-title="Sélumétinib (Koselugo®)">
<div class="lab">Source</div><p>Information professionnelle suisse Koselugo® (Alexion), mise à jour de juin 2026, consultée le 15 octobre 2026.</p>
<div class="lab">Indication suisse</div><p>Le sélumétinib est indiqué en monothérapie des neurofibromes plexiformes symptomatiques inopérables de la NF1, chez l’adulte et chez l’enfant dès 3 ans. La dose est de 25 mg/m² de surface corporelle deux fois par jour, au plus 50 mg par prise. Le traitement est instauré par un médecin expérimenté dans les tumeurs liées à la NF1.</p>
<div class="lab">Limite</div><p>Tumeur bénigne, hors du code C72 : mention de contexte seulement.</p>
<p class="src">Références : information professionnelle suisse Koselugo® (Swissmedic, via AIPS).</p></template>
<template data-pop="c72-d-hors-indication" data-title="Indication suisse et usage hors indication">
<div class="lab">Règle</div><p>L’information professionnelle suisse définit le périmètre autorisé. Le témozolomide n’y figure ni pour l’épendymome ni pour un gliome médullaire.</p>
<div class="lab">Application</div><p>Un usage hors indication est documenté, justifié par la littérature (platine ou témozolomide pour l’épendymome récidivant, point de bonne pratique) et discuté en colloque.</p>
<div class="lab">Limite</div><p>Le statut suisse de l’étoposide, du lapatinib, du platine et des inhibiteurs BRAF/MEK dans ces situations n’a pas été vérifié.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; information professionnelle suisse Temodal® (Swissmedic, via AIPS).</p></template>
<template data-pop="c72-d-bio-braf" data-title="Inhibiteurs BRAF/MEK">
<div class="lab">Base</div><p>Ils sont proposés pour les tumeurs BRAF-altérées, d’après des données pédiatriques intracrâniennes. Le pilocytique porte la fusion KIAA1549-BRAF.</p>
<div class="lab">Limite</div><p>Aucune donnée intramédullaire lue ; statut suisse non vérifié.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="c72-mnemo" data-title="Plan = exérèse, infiltration = biopsie">
<div class="lab">Aide mnémotechnique (aide pédagogique, non critère officiel)</div><p>Plan de clivage : on retire. Infiltration : on biopsie, on réduit, puis on irradie selon le grade. Ce moyen mnémotechnique résume la différence entre épendymome et astrocytome.</p>
<div class="lab">Limite</div><p>Aide pédagogique, non critère officiel.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="c72-synthese-suisse" data-title="Synthèses suisses de la Praxis (résumés)">
<div class="lab">Tumeurs intradurales</div><p>Les tumeurs spinales intradurales se divisent en extramédullaires et intramédullaires ; parmi les intramédullaires, les épendymomes et les astrocytomes sont les plus fréquents. Elles se manifestent, quelle que soit l’origine, par une douleur locale ou radiculaire progressive et des déficits neurologiques.</p>
<div class="lab">Conduite</div><p>L’exérèse complète est le traitement de choix de la plupart de ces tumeurs ; en cas de croissance infiltrante intramédullaire, un reliquat marginal est laissé pour éviter un nouveau déficit. Une intervention rapide est indiquée dès l’apparition d’un déficit, car le pronostic dépend de la durée et de la sévérité du déficit préopératoire. Ces points concordent avec les recommandations européennes.</p>
<div class="lab">Illustration</div><p>Un retard diagnostique d’une tumeur intradurale bénigne a conduit à une paraplégie complète, réversible en six mois (marche et continence retrouvées) après exérèse et réadaptation intensive au Centre suisse des paraplégiques de Nottwil. Ce cas est une illustration, non un fondement de conduite.</p>
<div class="lab">Limite</div><p>Le texte intégral des trois articles est resté inaccessible : seuls les résumés ont été lus, et aucune conduite chiffrée n’en est tirée. L’article sur les tumeurs intradurales date de 2011.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21732297/" target="_blank" rel="noopener">Spirig et al. 2011, tumeurs spinales intradurales, Praxis</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30940039/" target="_blank" rel="noopener">Stienen et al. 2019, paraplégie réversible, Praxis</a>.</p></template>
<template data-pop="c72-compression" data-title="Compression médullaire maligne">
<div class="lab">Place dans la littérature suisse</div><p>La compression médullaire maligne fait partie des trois complications neurologiques graves du patient oncologique, avec la polyneuropathie induite par la chimiothérapie et l’épilepsie. Elle exige une approche interdisciplinaire.</p>
<div class="lab">Lien avec la leçon</div><p>La compression médullaire métastatique (code C79.4) dépasse le cadre de C72 et n’a pas été documentée dans les sources lues. Elle sert ici de simple repère d’urgence : tout déficit neurologique d’installation rapide appelle une imagerie sans délai.</p>
<div class="lab">Limite</div><p>Résumé seul ; le délai d’imagerie et les doses de corticoïde ne sont pas chiffrés dans les sources lues.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25146945/" target="_blank" rel="noopener">Hundsberger et al. 2014, complications neurologiques des patients oncologiques, Praxis</a>.</p></template>
<template data-pop="c72-nkrs" data-title="Déclaration au registre des tumeurs">
<div class="lab">Règle</div><p>La loi sur l’enregistrement des maladies oncologiques impose, pour les diagnostics posés dès le 1er janvier 2020, la déclaration de toute néoplasie maligne (comportement /3 de la CIM-O 3.2, catégories C00 à C97), donc de tout C72.0 à C72.9. Chez l’adulte, elle s’étend aux tumeurs de comportement incertain (/1, catégories D37 à D48, sauf la gammapathie monoclonale de signification indéterminée), aux tumeurs bénignes (/0) des méninges et du système nerveux central (D32, D33) et de l’hypophyse (D35.2). Chez le patient de moins de 20 ans au diagnostic, elle couvre en outre tout D35 et, pour le comportement /1, les catégories D61 et D76.</p>
<div class="lab">Application</div><p>C’est le code de comportement CIM-O qui détermine la catégorie CIM-10. Un épendymome myxopapillaire ou un schwannome spinal peuvent donc être concernés selon leur code CIM-O.</p>
<div class="lab">Limite</div><p>Le document consulté est un aide-mémoire (état du 23 mai 2022) ; l’annexe 1 de l’ordonnance n’a pas été lue directement, et les délais de déclaration n’ont pas été extraits. Les codes CIM-O cités dans l’îlot 12 viennent d’un support de formation du réseau européen des registres du cancer (mai 2021).</p>
<p class="src">Références : <a href="https://www.usz.ch/app/uploads/2023/06/2023-01-01-hilfsunterlage-meldepflichtige-erkrankungen-nkrs.pdf" target="_blank" rel="noopener">Registre national du cancer, aide-mémoire des maladies à déclarer</a>.</p></template>
<template data-pop="c72-onc201" data-title="Dordaviprone (ONC201)">
<div class="lab">Recherche</div><p>Une recherche dans la base suisse des informations professionnelles (AIPS), par les noms « dordaviprone » et « Modeyso », n’a donné aucun résultat au 15 octobre 2026.</p>
<div class="lab">Conséquence</div><p>Aucune indication, posologie ni statut d’autorisation suisse n’est affirmé pour ce médicament dans le gliome diffus de la ligne médiane H3 K27-altéré.</p>
<div class="lab">Limite</div><p>Une liste vide dans cette base ne prouve pas l’absence d’autorisation ; elle se vérifie sur le site de Swissmedic. Aucune donnée clinique sur ce produit n’a été lue.</p>
</template>
<template data-pop="c72-ssp" data-title="Objectifs PROFILES et situations de départ">
<div class="lab">Rattachement</div><p>Dans le registre du dépôt, C72 est rattaché aux situations de départ 159 (« abnormal histology, cytology and molecular genetic test ») et 227 (« shared assessment of risks and protective factors for frequent life-compromising conditions »).</p>
<div class="lab">Statut</div><p>Cette correspondance est pédagogique et non officielle (aucune table officielle de concordance avec la CIM-10-GM). Les situations voisines (82, 85, 97, 103, 104, 77, 202, 81, 18, 28) sont une inférence pédagogique à partir des symptômes de la leçon.</p>
<div class="lab">Source</div><p>PROFILES 2017 (Commission mixte des facultés suisses de médecine et Institut suisse pour la formation médicale postgraduée et continue), libellés lus dans la table du dépôt dérivée de la brochure.</p>
<p class="src">Références : <a href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener">PROFILES 2017, brochure</a>.</p></template>
<template data-pop="pareto-c72-suisse" data-title="Pareto — Spécificités suisses et examen fédéral">
<p class="ratio" data-cover="c72-12"></p><ul><li>C72.0 et C72.1 : cœur de la leçon ; C72.2 à C72.5 : nerfs crâniens, couverture partielle ; C72.8 et C72.9 : règles de codage.</li><li>Déclaration au registre : tout C72 maligne, mais aussi les tumeurs bénignes et incertaines du système nerveux central ; le code CIM-O décide.</li><li>Témozolomide : hors indication suisse dans C72 ; dordaviprone : aucune information professionnelle trouvée.</li><li>Situations de départ 159 et 227 (correspondance non officielle) ; pièges : C72.2 à C72.5 et non C71, myxopapillaire grade 2, « altéré » et non « mutant ».</li></ul></template>
<template data-pop="pareto-c72-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="c72-7"></p><ul><li>IRM avec gadolinium : examen de choix.</li><li>Épendymome : limité, kystes, coiffe hémosidérinique ; astrocytome : flou, excentré.</li><li>H3 K27M : immunohistochimie positive, perte de H3K27me3.</li><li>Extension : IRM cranio-spinale et LCR au moins 2 à 3 semaines après l’opération.</li><li>Différentiel : fistule durale, métastases, infections, inflammation.</li></ul></template>
<template data-pop="pareto-c72-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="c72-8"></p><ul><li>Déficit rapide ou queue de cheval : imagerie sans délai.</li><li>Gliome optique symptomatique en NF1 : unité experte en urgence.</li><li>MPNST suspecté : IRM régionale, TEP au FDG, puis exérèse si sûre et faisable, sinon biopsie guidée ; aucune attente vigilante.</li><li>Œdème symptomatique : corticoïdes, sauf lymphome ou lésion inflammatoire.</li></ul></template>
<template data-pop="pareto-c72-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="c72-9"></p><ul><li>Exérèse maximale sûre ; pas de nouveau déficit permanent.</li><li>Épendymome grade 2 complet : surveillance ; incomplet : 45 à 54 Gy (II, B), contesté en 2024.</li><li>Myxopapillaire incomplet : au moins 50 Gy.</li><li>Astrocytome : exérèse ou biopsie ; radiothérapie du haut grade d’emblée.</li><li>Gliome H3 K27-altéré : biopsie et radiothérapie ; témozolomide incertain.</li><li>Moelle : 0,2 % à 50 Gy, 6 % à 60 Gy.</li></ul></template>
<template data-pop="pareto-c72-suivi" data-title="Pareto — Suivi et pronostic">
<p class="ratio" data-cover="c72-10,c72-11"></p><ul><li>Épendymome : IRM prolongée.</li><li>Astrocytome bas grade : 6 mois pendant 3 ans ; haut grade : IRM 6 mois pendant 5 ans.</li><li>Séquelles : douleur neuropathique jusqu’à 30 %, moelle attachée jusqu’à 37 %.</li><li>Survie : épendymome grade 2 96 % à 10 ans ; gliome H3 K27 médiane 24 mois.</li><li>Témozolomide : contre-indiqué en grossesse et allaitement.</li></ul></template>
<template data-pop="pareto-c72-criteres" data-title="Pareto — Critères et paramètres">
<p class="ratio" data-cover="c72-13"></p><ul><li>Diagnostic intégré OMS 2021 en quatre couches.</li><li>H3 K27-altéré : gliome diffus + ligne médiane + altération H3 K27 + perte de H3K27me3.</li><li>MYCN-amplifié : défini par l’amplification de MYCN.</li><li>Queue de cheval : au moins deux éléments cardinaux.</li></ul></template>
<template data-pop="pareto-c72-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="c72-e-1,c72-e-2,c72-e-3,c72-e-4,c72-e-5"></p><ul><li>Référence diagnostique : IRM avec gadolinium et diagnostic intégré histologique et moléculaire.</li><li>Extension : IRM cranio-spinale et LCR après la chirurgie.</li><li>MPNST NF1 : IRM, TEP-IRM FDG, colloque sarcome.</li><li>ADN tumoral libre du LCR : valeur non démontrée.</li></ul></template>
<template data-pop="pareto-c72-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="c72-s-anat-cours"></p><ul><li>Cône en T12–L1 ; queue de cheval = racines.</li><li>Cône : signes centraux et périphériques.</li><li>Myxopapillaire : cône et filum terminal.</li><li>Épendymome spinal : canal central ; subépendymome : excentré ; kyste polaire à la place du canal central.</li></ul></template>
<template data-pop="pareto-c72-neuropatho" data-title="Pareto — Neuropathologie">
<p class="ratio" data-cover="c72-s-histo-cours"></p><ul><li>Grades en chiffres arabes par type.</li><li>Myxopapillaire grade 2.</li><li>ANNUBP n’est pas encore un MPNST.</li><li>NOS : test non fait ou non concluant.</li><li>Intramédullaire : confiné au site ; myxopapillaire : dissémination possible dans le LCR.</li></ul></template>
<template data-pop="pareto-c72-gen" data-title="Pareto — Génétique">
<p class="ratio" data-cover="c72-s-gen-cours"></p><ul><li>NF2 : épendymome ; MYCN : agressif ; H3 K27 : ligne médiane ; KIAA1549-BRAF : pilocytique.</li><li>MGMT non méthylé : témozolomide incertain.</li><li>H3 K27M : perte de H3K27me3, phénotype résistant ; MYCN : surveillance resserrée.</li><li>Myxopapillaire A : plus jeune, résection moins complète, pronostic plus mauvais.</li></ul></template>
<template data-pop="pareto-c72-radio" data-title="Pareto — Radiobiologie">
<p class="ratio" data-cover="c72-s-radio-cours"></p><ul><li>0,2 % à 50 Gy, 6 % à 60 Gy, 50 % à 69 Gy.</li><li>Doses jusqu’à 54 Gy : risque de 1 à 2 %.</li><li>Myélopathie précoce : 2 à 4 mois, signe de Lhermitte, régressive ; tardive : doses élevées, peut être définitive.</li><li>Seuil critique : au-delà de 55 Gy chez l’adulte, au-delà de 40 Gy chez l’enfant.</li></ul></template>
<template data-pop="pareto-c72-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="c72-p-1,c72-p-2,c72-p-3,c72-p-4"></p><ul><li>Témozolomide : indications suisses = glioblastome et gliome malin récidivant ; usage spinal hors indication.</li><li>Prophylaxie Pneumocystis, hépatite B, hémogramme hebdomadaire.</li><li>Dexaméthasone : œdème cérébral tumoral ; pas d’indication médullaire explicite.</li><li>Sélumétinib : neurofibrome plexiforme bénin de NF1.</li></ul></template>
<template data-pop="pareto-c72-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="c72-s-physio-cours"></p><ul><li>Antérieur : motricité et sensibilité spinothalamique ; postérieur : sensibilité profonde.</li><li>Moelle : motoneurone central ; cône : central et périphérique ; queue de cheval : périphérique seul.</li><li>Choc spinal : paraparésie flasque aréflexique initiale.</li><li>Pronostic : durée et sévérité du déficit préopératoire.</li></ul></template>
<template data-pop="c72-sm-dysesthesies" data-title="Dysesthésies diffuses">
<div class="lab">Définition</div><p>Une dysesthésie est une sensation anormale et désagréable, spontanée ou provoquée. Chez le sujet sain, la sensibilité des membres est symétrique et sans sensation parasite.</p>
<div class="lab">Mécanisme</div><p>L’épendymome intramédullaire croît au centre de la moelle et atteint d’emblée les voies sensitives longues ; il devient symptomatique par des troubles sensitifs diffus, surtout des dysesthésies.</p>
<div class="lab">Valeur</div><p>C’est le symptôme dominant de l’épendymome intramédullaire, la douleur étant rare et la parésie occasionnelle. Aucune fréquence chiffrée ni valeur diagnostique ne figurent dans les sources lues.</p>
<div class="lab">Piège</div><p>Le caractère diffus et peu évocateur de la plainte accompagne un retard diagnostique de plusieurs mois, parfois de plusieurs années.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a>.</p></template>
<template data-pop="c72-sm-douleur" data-title="Douleur axiale ou radiculaire">
<div class="lab">Caractérisation</div><p>Le médecin précise le siège (axial ou radiculaire), l’ancienneté, la progression et le caractère nocturne.</p>
<div class="lab">Mécanisme</div><p>L’épendymome myxopapillaire, au cône et au filum terminal, irrite les racines et donne des dysesthésies ou des douleurs ; la parésie y est rare.</p>
<div class="lab">Valeur</div><p>Une synthèse suisse décrit la douleur locale ou radiculaire progressive, avec des déficits neurologiques, comme la manifestation commune des tumeurs intradurales. Aucune valeur chiffrée n’est donnée.</p>
<div class="lab">Piège</div><p>Une douleur axiale ou une radiculopathie isolée ne distingue pas une tumeur d’une cause banale.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21732297/" target="_blank" rel="noopener">Spirig et al. 2011, Praxis (résumé)</a>.</p></template>
<template data-pop="c72-sm-sphincters" data-title="Troubles vésicaux, intestinaux ou sexuels">
<div class="lab">Normal</div><p>Chez le sujet sain, la miction est volontaire et la vessie se vide presque complètement.</p>
<div class="lab">Mécanisme</div><p>L’atteinte du cône médullaire ou des racines de la queue de cheval interrompt le contrôle sacré des sphincters et de la fonction sexuelle.</p>
<div class="lab">Valeur</div><p>La dysfonction vésicale, intestinale ou sexuelle est un des éléments cardinaux du syndrome de la queue de cheval. Elle est rare comme symptôme initial d’un astrocytome intramédullaire.</p>
<div class="lab">Piège</div><p>Leur absence au début n’exclut pas une tumeur de la moelle.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024</a>.</p></template>
<template data-pop="c72-sm-duree" data-title="Durée des symptômes">
<div class="lab">Question</div><p>Le médecin date le premier symptôme et la progression du déficit.</p>
<div class="lab">Valeur</div><p>Des symptômes apparus quelques semaines avant le diagnostic signalent habituellement une tumeur de croissance rapide ; des symptômes présents depuis des années, une croissance lente.</p>
<div class="lab">Limite</div><p>Cette règle vient des recommandations EANO sur les gliomes diffus de l’adulte, non d’une série spinale.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a>.</p></template>
<template data-pop="c72-sm-nf1-douleur" data-title="Douleur nouvelle en neurofibromatose de type 1">
<div class="lab">Signes d’alarme</div><p>Croissance rapide, douleur nouvelle, déficit moteur ou sensitif nouveau et changement de consistance d’un neurofibrome. Tout patient atteint de NF1 qui présente l’un de ces signes est exploré à la recherche d’un MPNST.</p>
<div class="lab">Conduite</div><p>L’exploration commence par une IRM régionale ; une TEP au FDG, de préférence couplée à l’IRM, s’y ajoute avant toute chirurgie. Si une ANNUBP ou un MPNST est suspecté, l’exérèse primaire est recommandée lorsqu’elle est sûre et faisable ; sinon, une biopsie guidée par l’imagerie est réalisée. L’attente vigilante n’a pas sa place dans le MPNST, et l’exérèse chirurgicale urgente en reste le pilier lorsqu’elle est possible.</p>
<div class="lab">Valeur</div><p>Le risque de MPNST sur la vie entière est de 8 à 16 %, avec un diagnostic surtout entre 20 et 40 ans. La sensibilité de chaque signe d’alarme n’est pas chiffrée dans la partie lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9845795/" target="_blank" rel="noopener">ERN GENTURIS 2023, neurofibromatose de type 1</a> (publiée le 13.01.2023), tableau 9, recommandations 2 à 5.</p></template>
<template data-pop="c72-sm-paresie" data-title="Parésie non radiculaire">
<div class="lab">Définition</div><p>Une parésie non radiculaire est une faiblesse dont la distribution ne correspond pas au territoire d’une racine.</p>
<div class="lab">Mécanisme</div><p>Elle traduit l’atteinte des voies motrices longues dans la moelle. Avec l’ataxie et le déficit sensitif, elle fait partie des signes localisateurs des tumeurs intramédullaires.</p>
<div class="lab">Valeur</div><p>Aucune sensibilité ni spécificité n’est chiffrée dans les sources lues.</p>
<div class="lab">Piège</div><p>Au cône médullaire, signes centraux et périphériques coexistent ; la queue de cheval ne donne que des signes périphériques. Une faiblesse périphérique pure n’exclut donc pas une tumeur sous le cône.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025</a>.</p></template>
<template data-pop="c72-sm-selle" data-title="Troubles sensitifs en selle">
<div class="lab">Technique</div><p>Le médecin explore la sensibilité de la région périanale et périnéale, avec l’accord du patient.</p>
<div class="lab">Mécanisme</div><p>Cette région dépend des racines sacrées ; son atteinte désigne le cône ou la queue de cheval.</p>
<div class="lab">Valeur</div><p>C’est un élément cardinal du syndrome de la queue de cheval, dont le diagnostic exige en général au moins deux éléments cardinaux. Sa valeur isolée n’est pas chiffrée dans les sources lues.</p>
<div class="lab">Piège</div><p>La cause la plus fréquente du syndrome de la queue de cheval est la hernie discale aiguë, non la tumeur.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025</a>.</p></template>
<template data-pop="c72-sm-residu" data-title="Résidu post-mictionnel">
<div class="lab">Technique</div><p>Après une miction, l’échographie vésicale mesure le volume d’urine restant, en millilitres.</p>
<div class="lab">Valeur</div><p>Dans une méta-analyse de sept études (734 patients analysables, suspicion de syndrome de la queue de cheval, référence IRM), le seuil de 200 ml avait la meilleure précision : sensibilité 82 %, spécificité 65 %.</p>
<div class="lab">Piège</div><p>Le résidu complète l’examen clinique ; il ne s’emploie pas seul pour exclure le diagnostic.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu ; population hospitalière britannique.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37121596/" target="_blank" rel="noopener">Boktor et al. 2023, Bone Joint J (résumé)</a>.</p></template>
<template data-pop="c72-sm-tr" data-title="Tonus anal au toucher rectal">
<div class="lab">Valeur</div><p>Dans une revue systématique de six études (741 patients, référence IRM), la sensibilité du tonus anal pour une compression de la queue de cheval variait de 0,23 à 0,53. La contraction volontaire avait, dans une étude, une sensibilité de 0,29 et une spécificité de 0,96.</p>
<div class="lab">Piège</div><p>Un tonus normal expose à une fausse réassurance ; les auteurs déconseillent de fonder la décision sur le tonus anal.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu ; données britanniques.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35180641/" target="_blank" rel="noopener">Tabrah et al. 2022, Musculoskelet Sci Pract (résumé)</a>.</p></template>
