<template data-pop="c72-sources" data-title="Sources et organismes cités">
<div class="lab">Sources</div><p>Le cours s’appuie sur la classification CIM-10-GM 2024 (BfArM), la classification OMS 2021, les recommandations de l’EANO sur les épendymomes (2018) et les gliomes diffus de l’adulte (2021), des revues de 2024 sur les tumeurs spinales, les recommandations du réseau ERN GENTURIS sur les neurofibromatoses et la schwannomatose, deux travaux suisses d’épidémiologie (canton de Zurich, Registre suisse du cancer de l’enfant), trois synthèses suisses de la Praxis (résumés), l’aide-mémoire du Registre national du cancer, les situations de départ PROFILES et trois informations professionnelles suisses (Temodal®, dexaméthasone Galepharm, Koselugo®).</p>
<div class="lab">Portée</div><p>Aucune recommandation suisse de prise en charge n’a pu être lue. Les recommandations européennes servent donc de référence clinique, et les données suisses se limitent à l’épidémiologie et aux informations professionnelles. Les sources américaines citées par certaines revues ne fondent aucune conduite.</p>
<div class="lab">Limite</div><p>Plusieurs textes longs n’ont été lus que sur leurs 100 000 premiers caractères, et plusieurs sources (revue de Watanabe, trois articles de la Praxis) seulement sur résumé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8328013/" target="_blank" rel="noopener">OMS 2021, résumé (Louis et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12962633/" target="_blank" rel="noopener">EANS-EANO 2026, étendue d’exérèse (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9845795/" target="_blank" rel="noopener">ERN GENTURIS 2023, neurofibromatose de type 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12277868/" target="_blank" rel="noopener">Wanner et al. 2025, tumeurs du SNC dans le canton de Zurich</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13653814/" target="_blank" rel="noopener">Greuter et al. 2026, gliomes pédiatriques de bas grade en Suisse</a> ; information professionnelle suisse Temodal® (Swissmedic, via AIPS) ; information professionnelle suisse dexaméthasone Galepharm (Swissmedic, via AIPS) ; information professionnelle suisse Koselugo® (Swissmedic, via AIPS).</p></template>
<template data-pop="c72-codes" data-title="Sous-codes C72.0 à C72.9">
<div class="lab">Contenu</div><p>C72.0 moelle épinière ; C72.1 queue de cheval ; C72.2 nerf olfactif (I), qui inclut le bulbe olfactif ; C72.3 nerf optique (II) ; C72.4 nerf auditif ou vestibulocochléaire (VIII) ; C72.5 autres nerfs crâniens et non précisés ; C72.8 lésion à localisations contiguës de l’encéphale et d’autres parties du système nerveux central, d’origine non classable sous C70–C72.5 ; C72.9 système nerveux central sans précision.</p>
<div class="lab">Exclusions</div><p>Les méninges relèvent de C70, les nerfs périphériques et le système nerveux autonome de C47. Sous C71 (encéphale), les nerfs crâniens sont exclus et renvoyés vers C72.2 à C72.5.</p>
<div class="lab">Limite</div><p>Les libellés français proviennent du catalogue de l’Office fédéral de la statistique repris dans le dépôt ; la version allemande du BfArM sert de référence. Le rattachement exact de l’esthésioneuroblastome (C72.2 ou C30.0) n’a pas été vérifié.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c69-c72.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C69–C72 (BfArM)</a>.</p></template>
<template data-pop="c72-lacunes" data-title="Lacunes des sources">
<div class="lab">Ce qui manque</div><p>Aucune recommandation suisse de prise en charge (les textes de la Praxis sont restés inaccessibles en texte intégral et n’ont été lus qu’en résumé), aucune source sur le gliome malin du nerf optique de l’adulte, l’esthésioneuroblastome, le MPNST des nerfs crâniens ou la tumeur maligne du nerf vestibulocochléaire. L’incidence suisse propre à C72 est introuvable. Le délai d’imagerie en urgence pour une compression médullaire et la dose de corticoïde spécifique à l’œdème médullaire ne sont pas sourcés. L’aptitude à la conduite, l’assurance-invalidité, la Suva et le remboursement par la Liste des spécialités ne sont pas documentés. Les fréquences chiffrées des symptômes et la sensibilité et la spécificité des signes cliniques ne figurent pas dans les sources lues. La note 5 du BfArM n’a pas été lue.</p>
<div class="lab">Conséquence</div><p>Ces points ne sont ni affirmés ni déduits dans le cours. Ils sont à vérifier dans une source primaire avant toute décision clinique.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c69-c72.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C69–C72 (BfArM)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12277868/" target="_blank" rel="noopener">Wanner et al. 2025, tumeurs du SNC dans le canton de Zurich</a>.</p></template>
<template data-pop="c72-oms2021" data-title="OMS 2021 : grades et diagnostic intégré">
<div class="lab">Définition</div><p>La classification OMS 2021 attribue les grades en chiffres arabes à l’intérieur de chaque type tumoral. Le diagnostic s’écrit en couches : diagnostic intégré, histologie, grade, information moléculaire. NOS signale un test non fait ou non concluant ; NEC signale des résultats ne correspondant à aucune entité.</p>
<div class="lab">Application</div><p>Pour les tumeurs spinales, l’épendymome spinal et l’épendymome spinal MYCN-amplifié (type nouveau) sont distincts ; le myxopapillaire est passé du grade 1 au grade 2 car son risque de récidive est proche de celui de l’épendymome spinal conventionnel. Le gliome diffus de la ligne médiane H3 K27-altéré est de grade 4.</p>
<div class="lab">Limite</div><p>La source est un résumé publié ; le Blue Book n’a pas été lu.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8328013/" target="_blank" rel="noopener">OMS 2021, résumé (Louis et al.)</a>.</p></template>
<template data-pop="c72-types-epend" data-title="Types d’épendymome spinal">
<div class="lab">Types</div><p>Épendymome spinal (grade 2 ou 3), épendymome spinal MYCN-amplifié, épendymome myxopapillaire (grade 2) et subépendymome (très rare dans la moelle, adultes exclusivement).</p>
<div class="lab">Lecture</div><p>Dans une étude néerlandaise, le type spinal de grade 2 représentait 56 % des épendymomes adultes, le myxopapillaire 20 %, le subépendymome 11 % et l’anaplasique 9 %. Le comportement diffère : le MYCN-amplifié récidive dans 75 à 100 % des cas.</p>
<div class="lab">Limite</div><p>L’EANO 2018 précède l’OMS 2021 et emploie des grades romains et un myxopapillaire de grade I.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8328013/" target="_blank" rel="noopener">OMS 2021, résumé (Louis et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12563245/" target="_blank" rel="noopener">Brain Sciences 2025, marqueurs génétiques des tumeurs médullaires</a>.</p></template>
<template data-pop="c72-moleculaire" data-title="Groupes de méthylation spinaux">
<div class="lab">Groupes</div><p>Trois sous-groupes spinaux sont décrits par méthylation : SP-SE (subépendymome, adultes exclusivement), SP-MPE (myxopapillaire) et SP-EPN (grades 2 et 3). Dans le groupe myxopapillaire, MPE-A touche des patients plus jeunes, se prête moins à l’exérèse complète et a un pronostic plus mauvais que MPE-B.</p>
<div class="lab">Utilité</div><p>Le méthylome de l’ADN est utile en cas de doute diagnostique, notamment pour distinguer des entités proches.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="c72-astro" data-title="Astrocytomes médullaires">
<div class="lab">Grades</div><p>Pilocytique (grade 1, fusion KIAA1549-BRAF), diffus (grade 2), anaplasique (grade 3) et glioblastome spinal (grade 4). L’IDH est rarement muté dans la moelle.</p>
<div class="lab">Fréquence</div><p>Les astrocytomes forment 30 à 40 % des gliomes intramédullaires et 40 à 60 % des tumeurs intramédullaires de l’enfant ; le haut grade représente environ 25 % et il est plus fréquent chez l’adulte.</p>
<div class="lab">Limite</div><p>Revues narratives ; les doses de radiothérapie ne sont pas données par la revue clinique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12563245/" target="_blank" rel="noopener">Brain Sciences 2025, marqueurs génétiques des tumeurs médullaires</a>.</p></template>
<template data-pop="c72-dmg" data-title="Gliome diffus de la ligne médiane H3 K27-altéré">
<div class="lab">Définition</div><p>Gliome diffus de haut grade de type pédiatrique, de grade 4, des localisations médianes (thalamus, pont, tronc cérébral, moelle). « Mutant » est devenu « altéré » : mutation H3 K27 ou surexpression d’EZHIP, avec perte de H3K27me3 en immunohistochimie.</p>
<div class="lab">Moelle</div><p>Une revue de 279 patients indique 61 % d’hommes et un âge moyen de 32 ans ; la survie globale médiane moyenne est de 24 mois (13 à 40) et la survie sans progression médiane de 14 mois, meilleure que la forme intracrânienne. Une série adulte donne un âge médian de 33 ans, avec une atteinte thoracique dans 29 % des cas et cervicale dans 18 %.</p>
<div class="lab">Limite</div><p>Revues de séries de cas ; données de suivi manquantes à 35 % dans l’une d’elles, et chiffres de suivi incohérents entre texte et tableau.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8328013/" target="_blank" rel="noopener">OMS 2021, résumé (Louis et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38342826/" target="_blank" rel="noopener">Watanabe et al. 2024, gliomes H3 K27-altérés de la moelle (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11122636/" target="_blank" rel="noopener">Auricchio et al. 2024, gliome H3 K27-altéré spinal de l’adulte</a>.</p></template>
<template data-pop="c72-epidemio" data-title="Répartition par type et par âge">
<div class="lab">Chiffres</div><p>Les tumeurs médullaires primitives forment 2 à 4 % des tumeurs primitives du système nerveux central. Le glioblastome spinal représente 1 à 3 % des tumeurs intramédullaires. Les épendymomes spinaux sont plus fréquents chez l’adulte que chez l’enfant.</p>
<div class="lab">Lecture</div><p>Le même organe est donc atteint par des tumeurs différentes selon l’âge : épendymome chez l’adulte, astrocytome pilocytique chez l’enfant. Cette différence guide l’hypothèse avant l’histologie.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12563245/" target="_blank" rel="noopener">Brain Sciences 2025, marqueurs génétiques des tumeurs médullaires</a>.</p></template>
<template data-pop="c72-epidemio-suisse" data-title="Données suisses">
<div class="lab">Zurich</div><p>Dans le canton de Zurich (1980–2021, 15 ans et plus), l’incidence standardisée des tumeurs malignes du système nerveux central était de 7,7 (hommes) et 5,0 (femmes) pour 100 000 en 2011–2021 ; la mortalité maligne de 5,7 et 3,6 ; la survie relative à cinq ans d’environ 30 %.</p>
<div class="lab">Enfant</div><p>Le Registre suisse du cancer de l’enfant (1990–2019) donne une incidence des gliomes de bas grade d’environ 1,4 pour 100 000 par an, 4,6 % de localisation spinale, 3,7 % de NF1 et une survie globale à 10 ans de 72,8 % pour la localisation spinale (HR ajusté d’environ 2,1).</p>
<div class="lab">Limite</div><p>Aucun chiffre séparé pour C72. La publication pédiatrique signale des incohérences internes (641 contre 614 cas ; 98,8 % contre 89,8 %), et les voies optiques ne sont pas rapportées séparément.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12277868/" target="_blank" rel="noopener">Wanner et al. 2025, tumeurs du SNC dans le canton de Zurich</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13653814/" target="_blank" rel="noopener">Greuter et al. 2026, gliomes pédiatriques de bas grade en Suisse</a>.</p></template>
<template data-pop="c72-anat-cone" data-title="Du cône médullaire à la queue de cheval">
<div class="lab">Anatomie</div><p>Le cône médullaire se termine habituellement en T12–L1. Sous lui, la queue de cheval est formée de racines et non de moelle ; le filum terminal prolonge le cône.</p>
<div class="lab">Conséquence</div><p>Le cône associe signes centraux et périphériques, la queue de cheval seulement des signes périphériques. L’épendymome myxopapillaire naît surtout du cône et du filum terminal.</p>
<div class="lab">Limite</div><p>Le niveau T12–L1 est habituel, pas absolu.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025, cône médullaire et queue de cheval</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a>.</p></template>
<template data-pop="c72-plan-clivage" data-title="Plan de clivage">
<div class="lab">Définition</div><p>Le plan de clivage est l’interface identifiable entre une tumeur et le tissu sain qui permet de la détacher.</p>
<div class="lab">Application</div><p>L’épendymome, de croissance centrale et bien limitée, en offre un : l’exérèse complète est le but, en bloc de préférence. L’astrocytome diffus de l’adulte n’en offre pas.</p>
<div class="lab">Limite</div><p>Même en présence d’un plan, la rupture capsulaire d’un myxopapillaire est associée à la récidive.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="c72-infiltration" data-title="Infiltration et limites de l’exérèse">
<div class="lab">Mécanisme</div><p>Un astrocytome infiltrant, excentré et mal limité n’a pas de frontière nette avec la moelle saine.</p>
<div class="lab">Conséquence</div><p>L’exérèse complète n’est possible que dans 13 à 38 % des grades 2 à 4 et elle est plus morbide. Pour l’infiltrant ou le haut grade, l’exérèse subtotale est privilégiée, et la biopsie est envisagée en cas de doute.</p>
<div class="lab">Limite</div><p>Le pilocytique, mieux limité, permet souvent l’exérèse complète.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="c72-h3k27" data-title="H3 K27 et MGMT">
<div class="lab">Mécanisme</div><p>L’altération de l’histone H3 entraîne la perte de H3K27me3. Le promoteur de MGMT est habituellement non méthylé dans ces tumeurs.</p>
<div class="lab">Conséquence</div><p>Le témozolomide agit moins quand MGMT est non méthylé : son bénéfice au-delà de la radiothérapie n’est donc pas établi. Dans les données spinales, il a pourtant été utilisé dans 81 % des chimiothérapies.</p>
<div class="lab">Limite</div><p>Lien mécanistique tiré des recommandations sur les gliomes de l’adulte, sans section spécifique pour la moelle.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38342826/" target="_blank" rel="noopener">Watanabe et al. 2024, gliomes H3 K27-altérés de la moelle (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11122636/" target="_blank" rel="noopener">Auricchio et al. 2024, gliome H3 K27-altéré spinal de l’adulte</a>.</p></template>
<template data-pop="c72-mycn" data-title="Épendymome spinal MYCN-amplifié">
<div class="lab">Définition</div><p>Entité nouvelle de l’OMS 2021, définie par l’amplification de MYCN.</p>
<div class="lab">Pronostic</div><p>Récidive dans 75 à 100 % des cas. Survie sans progression médiane de 17 mois et survie globale de 87 mois, contre 82 et 180 mois pour le type sauvage.</p>
<div class="lab">Limite</div><p>Revue narrative mono-auteur : chiffres à comparer en ordre de grandeur.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8328013/" target="_blank" rel="noopener">OMS 2021, résumé (Louis et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12563245/" target="_blank" rel="noopener">Brain Sciences 2025, marqueurs génétiques des tumeurs médullaires</a>.</p></template>
<template data-pop="c72-nf2" data-title="Neurofibromatose de type 2">
<div class="lab">Lien</div><p>Une altération de NF2 est caractéristique de l’épendymome spinal selon l’OMS 2021 ; la neurofibromatose de type 2 est associée à cette tumeur.</p>
<div class="lab">Application</div><p>Un épendymome spinal appelle la recherche d’un contexte de neurofibromatose de type 2.</p>
<div class="lab">Limite</div><p>Aucune donnée chiffrée de risque n’a été lue dans le dossier.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8328013/" target="_blank" rel="noopener">OMS 2021, résumé (Louis et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a>.</p></template>
<template data-pop="c72-nf1" data-title="Neurofibromatose de type 1 : gliomes et MPNST">
<div class="lab">Gliome des voies optiques</div><p>Jusqu’à 15 % des enfants atteints ; âge moyen 4,5 ans, la plupart avant 8 ans ; 40 à 50 % deviennent symptomatiques, 15 à 20 % sont traités.</p>
<div class="lab">Autres risques</div><p>Le risque de gliome de haut grade est environ 50 fois celui de la population chez l’adulte. Pour le MPNST, le risque sur la vie entière est de 8 à 16 % et le diagnostic survient surtout entre 20 et 40 ans.</p>
<div class="lab">Limite</div><p>Forces de recommandation fort/modéré/faible, sans niveaux de preuve formels.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9845795/" target="_blank" rel="noopener">ERN GENTURIS 2023, neurofibromatose de type 1</a>.</p></template>
<template data-pop="c72-schwannomatose" data-title="Schwannomatose SMARCB1">
<div class="lab">Risque</div><p>Dans la schwannomatose liée à SMARCB1, le risque de MPNST est accru.</p>
<div class="lab">Précaution</div><p>La radiothérapie pourrait augmenter le risque de transformation maligne ; elle est évitée autant que possible.</p>
<div class="lab">Limite</div><p>Concerne la schwannomatose SMARCB1 seulement, non les autres formes.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9259735/" target="_blank" rel="noopener">ERN GENTURIS, schwannomatose</a>.</p></template>
<template data-pop="c72-predisposition" data-title="Syndromes de prédisposition aux gliomes">
<div class="lab">Liste</div><p>Neurofibromatose de type 1, sclérose tubéreuse, syndrome de Turcot, syndrome de Li-Fraumeni, syndrome de Lynch.</p>
<div class="lab">Application</div><p>Une histoire familiale ou personnelle évocatrice conduit à rechercher le syndrome, car il change le suivi et la prise en charge.</p>
<div class="lab">Limite</div><p>Aucun chiffre de risque propre à la moelle n’est donné dans le dossier.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a>.</p></template>
<template data-pop="c72-debut" data-title="Symptômes inauguraux selon le type">
<div class="lab">Début</div><p>Douleur axiale, sensations anormales ou radiculopathie sont non spécifiques. Les signes localisateurs sont une parésie non radiculaire, une ataxie et un déficit sensitif ; un syndrome transverse progressif impose un bilan.</p>
<div class="lab">Par type</div><p>Épendymome intramédullaire : dysesthésies diffuses surtout, douleur rare, parésie occasionnelle, diagnostic retardé de mois à années. Myxopapillaire : dysesthésies ou douleurs radiculaires, parésie très inhabituelle. Astrocytome : troubles sphinctériens rares au début. La durée de quelques semaines suggère une croissance rapide, des années une croissance lente.</p>
<div class="lab">Limite</div><p>La durée des symptômes vient des recommandations sur les gliomes de l’adulte, non d’une série spinale.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="c72-cone-queue" data-title="Cône ou queue de cheval : signes centraux et périphériques">
<div class="lab">Points communs</div><p>Troubles sensitifs en selle, troubles vésico-sphinctériens et sexuels, lombalgies et faiblesse des membres inférieurs.</p>
<div class="lab">Différence</div><p>Le cône associe signes centraux et périphériques, la queue de cheval seulement des signes périphériques. Le syndrome de la queue de cheval exige au moins deux éléments cardinaux ; sa cause la plus fréquente est la hernie discale aiguë.</p>
<div class="lab">Limite</div><p>Revue radiologique ; le délai d’imagerie en urgence n’est pas chiffré.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12553641/" target="_blank" rel="noopener">Nersesyan et al. 2025, cône médullaire et queue de cheval</a>.</p></template>
<template data-pop="c72-voies-optiques" data-title="Gliome des voies optiques en NF1">
<div class="lab">Examen</div><p>Acuité visuelle, champ visuel, pupilles, oculomotricité et papille ; tomographie en cohérence optique si possible.</p>
<div class="lab">Conduite</div><p>L’IRM n’est pas systématique ; elle est indiquée si l’examen ophtalmologique est évocateur ou, après deux ans, s’il est répétitivement non concluant. Un gliome symptomatique est adressé en urgence à une unité experte.</p>
<div class="lab">Limite</div><p>Les voies optiques ne sont pas rapportées séparément dans le registre suisse de l’enfant.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9845795/" target="_blank" rel="noopener">ERN GENTURIS 2023, neurofibromatose de type 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13653814/" target="_blank" rel="noopener">Greuter et al. 2026, gliomes pédiatriques de bas grade en Suisse</a>.</p></template>
<template data-pop="c72-alarme-mpnst" data-title="Signes d’alarme du MPNST en NF1">
<div class="lab">Signes</div><p>Croissance rapide d’un neurofibrome plexiforme ; douleur nouvelle, persistante, nocturne ou difficile à contrôler ; déficit moteur ou sensitif nouveau (y compris vessie, intestin, déglutition, respiration) ; nodule dur dans un neurofibrome mou.</p>
<div class="lab">Conduite</div><p>IRM régionale, TEP-IRM au FDG, puis exérèse primaire ou biopsie guidée décidée en colloque sarcome ; exérèse urgente en cas de suspicion.</p>
<div class="lab">Limite</div><p>Seul le référentiel ERN GENTURIS a été lu ; aucune recommandation EANO ou ESMO sur le MPNST.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9845795/" target="_blank" rel="noopener">ERN GENTURIS 2023, neurofibromatose de type 1</a>.</p></template>
<template data-pop="c72-irm" data-title="IRM : principe, séquences et pièges">
<div class="lab">Principe</div><p>L’IRM avec gadolinium est l’examen de choix. Elle précise le niveau, l’étendue, les kystes, la syringomyélie et le rehaussement.</p>
<div class="lab">Aspects</div><p>Épendymome : bords nets, rehaussement, kystes polaires, coiffe hémosidérinique. Astrocytome : hypo- ou iso-T1, hyper-T2, excentré, mal limité. Myxopapillaire : masse intradurale extramédullaire en saucisse, rehaussement homogène.</p>
<div class="lab">Pièges</div><p>Une petite lésion sans kyste peut mimer une lésion inflammatoire ; une hémorragie juxta-lésionnelle évoque épendymome, métastase ou cavernome. La tomodensitométrie montre mieux les calcifications.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5909649/" target="_blank" rel="noopener">EANO 2018, tumeurs épendymaires</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7904519/" target="_blank" rel="noopener">EANO 2021, gliomes diffus de l’adulte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485896/" target="_blank" rel="noopener">Westphal et Mohme 2024, tumeurs épendymaires spinales</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11485950/" target="_blank" rel="noopener">Tonn et al. 2024, astrocytomes de la moelle</a>.</p></template>
<template data-pop="pareto-c72-definition" data-title="Pareto — Définition et classifications">
<p class="ratio" data-cover="c72-0,c72-1"></p><ul><li><b>C72</b> regroupe moelle, queue de cheval et nerfs crâniens ; méninges en C70, nerfs périphériques en C47.</li><li>L’OMS 2021 grade par type : le myxopapillaire est de grade 2, le MYCN-amplifié est nouveau.</li><li>Le gliome de la ligne médiane H3 K27-altéré est de grade 4.</li><li>Le diagnostic est intégré en quatre couches (NOS/NEC).</li><li>Le type décide de l’exérèse, de la biopsie ou de la radiothérapie.</li></ul></template>
<template data-pop="pareto-c72-epidemio" data-title="Pareto — Épidémiologie">
<p class="ratio" data-cover="c72-2"></p><ul><li>Tumeurs médullaires primitives : 2 à 4 % des tumeurs du système nerveux central.</li><li>Épendymome chez l’adulte, astrocytome chez l’enfant (40 à 60 %).</li><li>Zurich 2011–2021 : 7,7 et 5,0 pour 100 000 ; toutes tumeurs malignes du système nerveux central, pas C72 seul.</li><li>Enfant suisse, gliome spinal de bas grade : survie à 10 ans de 72,8 %.</li></ul></template>
<template data-pop="pareto-c72-mecanismes" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="c72-3,c72-4"></p><ul><li>Cône en T12–L1 ; dessous, queue de cheval (racines).</li><li>Épendymome : limité, centré, plan de clivage, exérèse possible.</li><li>Astrocytome : infiltrant, sans plan ; exérèse complète dans 13 à 38 %.</li><li>H3 K27 et MGMT non méthylé : témozolomide incertain ; MYCN : récidive 75 à 100 %.</li><li>NF2 : épendymome ; NF1 : gliome optique et MPNST (8 à 16 %).</li></ul></template>
<template data-pop="pareto-c72-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="c72-5,c72-6"></p><ul><li>Début non spécifique, diagnostic retardé de mois à années.</li><li>Épendymome : dysesthésies ; myxopapillaire : irritation radiculaire, parésie rare.</li><li>Cône : signes centraux et périphériques ; queue de cheval : périphériques seulement.</li><li>Queue de cheval : deux éléments cardinaux ; première cause : hernie discale aiguë.</li><li>NF1 : douleur nouvelle nocturne = suspicion de MPNST.</li></ul></template>
