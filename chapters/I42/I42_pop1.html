
<!-- ===== FENÊTRES : notions fondamentales et démarche ===== -->
<template data-pop="i42-sarcomere" data-title="Sarcomère et cycle de la myosine">
<div class="lab">Structure</div><p>Le sarcomère, compris entre deux stries Z, contient des filaments fins (actine, tropomyosine, troponines C, I et T) et des filaments épais (myosine). La protéine C de liaison à la myosine, codée par <i>MYBPC3</i>, freine la mobilité des têtes de myosine. La titine relie la strie Z au centre du sarcomère et règle la rigidité passive.</p>
<div class="lab">Cycle</div><p>Le calcium se fixe sur la troponine C et libère les sites de l’actine. La tête de myosine chargée d’ADP et de phosphate se lie à l’actine, libère le phosphate, pivote et produit la force, libère l’ADP, puis se détache en fixant un ATP qu’elle hydrolyse.</p>
<div class="lab">État super-relâché</div><p>Au repos, une partie des têtes est repliée contre le filament épais et consomme très peu d’ATP. Cette réserve est réduite par la plupart des variants de la CMH : davantage de têtes sont disponibles, d’où l’hypercontractilité, le surcoût énergétique et la relaxation incomplète.</p>
<div class="lab">Corrélation thérapeutique</div><p>Les inhibiteurs de la myosine cardiaque (mavacamten, aficamten) ralentissent la libération du phosphate et restaurent l’état super-relâché. Ils corrigent l’hypercontractilité, mécanisme de la maladie. Leur bénéfice clinique n’est toutefois démontré que dans la forme obstructive : le mavacamten n’a pas amélioré les critères principaux dans la forme non obstructive (ODYSSEY-HCM).</p></template>

<template data-pop="i42-disarray" data-title="Désarroi myocytaire (« disarray »)">
<div class="lab">Définition</div><p>Perte de l’alignement parallèle des cardiomyocytes : les cellules sont orientées obliquement ou perpendiculairement les unes aux autres, souvent disposées autour de foyers de fibrose. Une petite quantité existe dans le cœur normal (jonctions septales) ; son extension à plus de 10 à 20 % du myocarde est caractéristique de la CMH sarcomérique.</p>
<div class="lab">Conséquence</div><p>La conduction de l’influx devient lente et hétérogène. Associé à la fibrose et à l’ischémie microvasculaire, le désarroi crée le substrat des arythmies ventriculaires par réentrée.</p>
<div class="lab">Limite</div><p>Il n’est pas visible directement en imagerie courante ; la fibrose associée l’est, par le rehaussement tardif à l’IRM.</p></template>

<template data-pop="i42-obstruction" data-title="Obstruction dynamique de la chambre de chasse">
<div class="lab">Mécanisme</div><p>Trois éléments s’additionnent : un septum basal épais qui rétrécit la chambre de chasse, un appareil mitral déplacé vers l’avant (muscles papillaires antérieurs, feuillets longs) et un flux rapide qui pousse le feuillet antérieur vers le septum. C’est le mouvement systolique antérieur de la valve mitrale ; le contact septo-mitral ferme la chambre de chasse en milieu de systole.</p>
<div class="lab">Définitions (ESC 2023)</div><p>Gradient maximal instantané ≥ 30 mmHg au repos ou provoqué : obstruction. ≥ 50 mmHg : obstruction hémodynamiquement significative, seuil des traitements invasifs.</p>
<div class="lab">Conséquences</div><p>Élévation de la pression intraventriculaire systolique, donc de la consommation d’oxygène et des pressions de remplissage ; insuffisance mitrale par défaut de coaptation, dirigée vers l’arrière ; baisse du débit à l’effort (syncope, présyncope).</p>
<div class="lab">Variabilité</div><p>Le gradient varie d’un moment à l’autre avec la volémie, la postcharge, la fréquence et la contractilité. Une mesure unique au repos sous-estime l’obstruction chez environ un tiers des patients.</p>
<div class="lab">Autres sièges</div><p>Obstruction médioventriculaire (contact des muscles papillaires avec le septum), parfois associée à un anévrisme apical : risque rythmique et embolique élevé.</p></template>

<template data-pop="i42-manoeuvres" data-title="Manœuvres de provocation de l’obstruction">
<div class="lab">Manœuvre de Valsalva</div><p>Patient allongé ou assis, expiration forcée à glotte fermée pendant environ 10 secondes (on peut lui faire souffler dans une seringue pour standardiser l’effort). Le gradient est mesuré pendant la phase de pression, lorsque le retour veineux est minimal. Une manœuvre mal faite est la cause la plus fréquente de faux négatif.</p>
<div class="lab">Passage accroupi → debout</div><p>Mesure dans la minute qui suit le lever, lorsque la précharge chute. Très utile au lit du patient pour le souffle ; possible en échocardiographie.</p>
<div class="lab">Échocardiographie d’effort</div><p>Effort physiologique sur bicyclette ou tapis, en position debout ou semi-assise ; mesure pendant et immédiatement après l’effort. Recommandée par l’ESC 2023 lorsque le gradient de repos et de Valsalva est &lt; 50 mmHg chez un patient symptomatique.</p>
<div class="lab">À ne pas utiliser</div><p>La dobutamine n’est pas recommandée pour provoquer l’obstruction : elle crée des gradients non physiologiques, y compris chez des sujets sans CMH.</p>
<div class="lab">Manœuvres qui réduisent le gradient</div><p>Position accroupie, élévation des jambes, poignée de main soutenue : elles augmentent la précharge ou la postcharge. Elles servent surtout à l’auscultation.</p></template>

<template data-pop="i42-restriction" data-title="Physiologie restrictive">
<div class="lab">Définition</div><p>Remplissage ventriculaire caractérisé par une montée rapide de la pression pour un faible volume, parce que la paroi est rigide. Le remplissage se fait presque entièrement en début de diastole, puis s’arrête brutalement.</p>
<div class="lab">Traduction échocardiographique</div><p>Onde E mitrale haute, rapport E/A &gt; 2, temps de décélération de E court (&lt; 150 ms), e′ tissulaire basse, rapport E/e′ élevé, oreillettes très dilatées, ventricules non dilatés.</p>
<div class="lab">Traduction invasive</div><p>Aspect de « racine carrée » (chute protodiastolique puis plateau) des courbes ventriculaires ; pressions télédiastoliques élevées, gauche souvent supérieure à droite de plus de 5 mmHg. Chaque ventricule restrictif a sa propre rigidité, d’où des pressions différentes ; dans la constriction, le péricarde impose une pression commune aux deux ventricules, d’où leur égalisation.</p>
<div class="lab">Causes</div><p>Amylose, maladies de surcharge, sarcoïdose avancée, hémochromatose, fibrose endomyocardique, radiothérapie, formes génétiques sarcomériques ou de la desmine ; CMH et CMD évoluées.</p>
<div class="lab">Diagnostic différentiel</div><p>Péricardite constrictive : la paroi est normale, c’est l’enveloppe qui limite le remplissage ; les variations respiratoires et e′ conservée la distinguent : le péricarde rigide isole le cœur des variations de pression intrathoracique et rend les ventricules interdépendants, tandis que le myocarde sain garde une relaxation normale.</p></template>

<template data-pop="i42-desmosome" data-title="Desmosomes et disque intercalaire">
<div class="lab">Structure</div><p>Le disque intercalaire relie deux cardiomyocytes par trois types de jonctions : les desmosomes (cohésion mécanique), les jonctions adhérentes (ancrage de l’actine) et les jonctions communicantes (connexine 43, conduction). Le desmosome associe des cadhérines (desmogléine 2, desmocolline 2), des protéines d’ancrage (plakoglobine, plakophiline 2) et la desmoplakine, qui s’attache aux filaments de desmine.</p>
<div class="lab">Pathologie</div><p>Un variant desmosomal fragilise l’adhésion. Sous l’étirement, les cellules se détachent et meurent ; la connexine 43 se redistribue et le courant sodique diminue, ce qui ralentit la conduction avant même la fibrose. Les cellules mortes sont remplacées par du tissu fibro-adipeux.</p>
<div class="lab">Corrélation clinique</div><p>Arythmies précoces, parfois avant toute anomalie structurelle ; aggravation par l’effort d’endurance ; atteinte cutanée (kératodermie) et cheveux crépus dans les formes récessives, car la peau dépend aussi des desmosomes.</p></template>

<template data-pop="i42-noncompaction" data-title="Hypertrabéculation du ventricule gauche">
<div class="lab">Définition</div><p>Couche de trabécules profondes, séparées par des récessus communiquant avec la cavité, au-dessus d’une couche compacte amincie. Les anciens critères reposaient sur le rapport entre couche non compactée et couche compacte (par exemple &gt; 2 en systole en échocardiographie, &gt; 2,3 en diastole à l’IRM).</p>
<div class="lab">Position de l’ESC 2023</div><p>Ce n’est plus une cardiomyopathie distincte, mais un trait phénotypique. Il est fréquent chez l’athlète, pendant la grossesse, dans l’anémie falciforme et chez les personnes d’ascendance africaine, sans conséquence.</p>
<div class="lab">Quand s’en préoccuper</div><p>S’il s’associe à une dilatation, à une dysfonction, à une arythmie ou à une histoire familiale de cardiomyopathie. Le patient est alors classé selon le phénotype associé (par exemple CMD) et exploré comme tel, génétique comprise.</p></template>

<template data-pop="i42-mnemo-obst" data-title="Les « trois D » qui aggravent l’obstruction">
<p><b>D</b>éshydratation, diurétiques forts, diarrhée : le ventricule se vide.<br><b>D</b>ilatateurs : dérivés nitrés, dihydropyridines, inhibiteurs de la phosphodiestérase de type 5, alcool, repas copieux (vasodilatation splanchnique).<br><b>D</b>rogues inotropes : dobutamine, adrénaline, digoxine, stimulants.</p>
<div class="lab">Règle opposée</div><p>Remplir, ralentir, resserrer : volume, bêtabloquant, vasoconstricteur pur (phényléphrine).</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel.</p></template>

<template data-pop="i42-redflags" data-title="Drapeaux rouges étiologiques">
<table class="t"><tr><th>Indice</th><th>Oriente vers</th></tr>
<tr><td>Canal carpien bilatéral, sténose du canal lombaire, rupture du tendon du biceps, hypotension orthostatique, bas voltage avec parois épaisses, troponine élevée en permanence</td><td>Amylose ATTR</td></tr>
<tr><td>Macroglossie, purpura périorbitaire, protéinurie, neuropathie, protéine monoclonale</td><td>Amylose AL</td></tr>
<tr><td>PR court, douleurs neuropathiques des extrémités, angiokératomes, protéinurie, cornée verticillée, surdité, accident vasculaire cérébral jeune, T1 natif bas</td><td>Maladie de Fabry</td></tr>
<tr><td>Préexcitation, hypertrophie massive chez un adolescent, faiblesse musculaire, troubles cognitifs, créatine kinase élevée</td><td>Maladie de Danon (<i>LAMP2</i>) ; préexcitation seule avec hypertrophie : <i>PRKAG2</i></td></tr>
<tr><td>Bloc auriculoventriculaire avant 60 ans, arythmies ventriculaires, uvéite, adénopathies médiastinales</td><td>Sarcoïdose ; <i>LMNA</i></td></tr>
<tr><td>Bloc ou fibrillation auriculaire précoces, créatine kinase élevée, contractures, histoire familiale de stimulateur</td><td><i>LMNA</i></td></tr>
<tr><td>Diabète, cirrhose, peau pigmentée, arthropathie des métacarpo-phalangiennes, transfusions répétées</td><td>Surcharge en fer</td></tr>
<tr><td>Surdité, diabète, ptosis, transmission maternelle</td><td>Maladie mitochondriale</td></tr>
<tr><td>Ataxie, pieds creux, diabète</td><td>Ataxie de Friedreich</td></tr>
<tr><td>Traits dysmorphiques, retard de croissance, sténose pulmonaire</td><td>Syndrome de Noonan (RASopathie)</td></tr>
<tr><td>Hyperéosinophilie persistante, thrombus apical</td><td>Endocardite de Löffler</td></tr>
<tr><td>Kératodermie palmoplantaire, cheveux crépus</td><td>Formes cutanéo-cardiaques desmosomales (<i>JUP</i>, <i>DSP</i>)</td></tr></table>
<div class="lab">Usage</div><p>Aucun indice n’est spécifique isolément ; leur accumulation justifie un examen ciblé (scintigraphie, activité enzymatique, TEP, génétique). Tableau d’après l’approche multiparamétrique de l’ESC 2023.</p>
<div class="lab">Pourquoi ces indices orientent</div><p><b>Amylose à transthyrétine.</b> La transthyrétine se dépose dans les tissus conjonctifs des années avant le cœur : chez des patients opérés d’un canal carpien, la biopsie de la gaine synoviale montrait des dépôts amyloïdes, le plus souvent à transthyrétine, dans 10 % des cas (Sperry et al., 2018). La troponine reste élevée, car l’infiltration entretient une souffrance continue des cardiomyocytes. L’hypertension disparaît et les antihypertenseurs sont mal tolérés, car le ventricule rigide éjecte un petit volume fixe ; une neuropathie autonome, surtout dans les formes héréditaires et l’amylose AL, aggrave l’hypotension orthostatique.</p><p><b>Préexcitation.</b> Dans les surcharges en glycogène (<i>PRKAG2</i>, maladie de Danon), des cardiomyocytes gorgés de glycogène traversent l’anneau fibreux qui isole normalement les oreillettes des ventricules et créent des connexions auriculoventriculaires anormales (Arad et al., 2003).</p><p><b>Laminopathie.</b> Les lamines A et C existent aussi dans le muscle squelettique, d’où l’élévation de la créatine kinase et les contractures.</p>
<div class="lab">Ce qui change la décision</div><p>Chaque indice conduit à un examen ciblé dont le résultat change le traitement : scintigraphie osseuse et recherche d’une protéine monoclonale (stabilisateur de la transthyrétine ou chimiothérapie), activité enzymatique ou analyse de <i>GLA</i> (enzymothérapie), TEP au FDG (immunosuppression), analyse génétique (défibrillateur, dépistage familial). Une phénocopie méconnue prive le patient de ce traitement et sa famille d’un dépistage adapté.</p>
<div class="lab">Source complémentaire</div><p>ESC 2023 sur les cardiomyopathies (Arbelo et al.), tableaux 6, 7 et 22. Sperry et al., Tenosynovial and cardiac amyloidosis in patients undergoing carpal tunnel release, J Am Coll Cardiol 2018;72:2040-2050. Arad et al., Transgenic mice overexpressing mutant PRKAG2 define the cause of Wolff-Parkinson-White syndrome in glycogen storage cardiomyopathy, Circulation 2003;107:2850-2856.</p>
</template>

<template data-pop="i42-phenocopies" data-title="Phénocopies de la cardiomyopathie hypertrophique">
<div class="lab">Définition</div><p>Maladie qui produit une hypertrophie ventriculaire gauche semblable à celle de la CMH sarcomérique, par un autre mécanisme. Le traitement, le pronostic et le mode de transmission diffèrent.</p>
<div class="lab">Principales phénocopies</div><p><b>Amylose</b> (ATTR, AL) : dépôt extracellulaire, sujet âgé. <b>Maladie de Fabry</b> : surcharge lysosomale, liée à l’X, traitable. <b>Maladie de Danon</b> : déficit de <i>LAMP2</i>, lié à l’X, hypertrophie massive du garçon, évolution rapide vers la transplantation. <b><i>PRKAG2</i></b> : surcharge en glycogène, préexcitation, troubles de conduction. <b>Maladie de Pompe</b> : nourrisson, hypotonie. <b>Maladies mitochondriales</b>. <b>Ataxie de Friedreich</b>. <b>Syndrome de Noonan</b> et autres RASopathies.</p>
<div class="lab">Adaptations et surcharges</div><p>Cœur d’athlète ; hypertension ; rétrécissement aortique ou sous-aortique ; hypertrophie des anabolisants ; enfants de mère diabétique (réversible).</p>
<div class="lab">Piège</div><p>Le score HCM Risk-SCD ne s’applique pas aux phénocopies métaboliques et infiltratives. Il n’a pas été validé dans ces maladies, dont les mécanismes arythmiques diffèrent : troubles de conduction, infiltration, atteinte multisystémique.</p></template>

<template data-pop="i42-athlete" data-title="Cœur d’athlète ou cardiomyopathie hypertrophique">
<div class="lab">Zone grise</div><p>Épaisseur de 13 à 16 mm chez un athlète masculin entraîné. Au-delà de 16 mm, l’adaptation physiologique est exceptionnelle. Les athlètes féminines dépassent rarement 11–12 mm. Les athlètes d’ascendance africaine ont des parois un peu plus épaisses.</p>
<div class="lab">En faveur de l’adaptation physiologique</div><p>Cavité ventriculaire gauche dilatée (diamètre télédiastolique &gt; 55 mm) ; hypertrophie symétrique ; fonction diastolique normale (e′ normale) ; capacité d’effort élevée (VO₂ pic &gt; 50 mL/kg/min ou &gt; 120 % de la valeur prédite) ; absence de rehaussement tardif ; régression de l’épaisseur après un désentraînement d’environ trois mois, car l’hypertrophie physiologique dépend du stimulus et régresse quand il cesse, alors que celle de la CMH est entretenue par le défaut sarcomérique.</p>
<div class="lab">En faveur d’une CMH</div><p>Hypertrophie asymétrique ou apicale ; cavité petite ; e′ basse ; oreillette gauche dilatée sans explication ; obstruction ; ondes T négatives latérales ; rehaussement tardif ; histoire familiale ; variant sarcomérique.</p>
<div class="lab">Conduite</div><p>Doute persistant : IRM, épreuve cardiorespiratoire, génétique, et parfois désentraînement contrôlé décidé en centre expert.</p></template>

<template data-pop="i42-variant" data-title="Lecture d’un résultat génétique">
<div class="lab">Cinq classes</div><p>Pathogène ; probablement pathogène ; de signification incertaine ; probablement bénin ; bénin (classification standard des laboratoires de génétique). Seules les deux premières classes ont une valeur diagnostique et permettent le test des apparentés.</p>
<div class="lab">Variant de signification incertaine</div><p>Il n’autorise aucune décision clinique. Il peut être reclassé avec le temps, grâce aux bases de données, aux études fonctionnelles et à la ségrégation familiale (le variant est-il présent chez tous les apparentés atteints et absent chez les sains ?). Une réinterprétation tous les quelques années est utile.</p>
<div class="lab">Pénétrance et expressivité</div><p>Un variant pathogène n’est pas une maladie : beaucoup de porteurs ne développeront pas de phénotype, ou tardivement. Le porteur sain est suivi, pas traité.</p>
<div class="lab">Situations particulières</div><p>Deux variants chez le même patient (hétérozygotie composite ou double) : forme plus précoce et plus sévère. Variant apparu de novo : parents non porteurs, mais risque de 50 % pour les enfants du patient. Découvertes incidentes (autres gènes) : prévues lors du conseil avant le test.</p>
<div class="lab">Piège</div><p>« Aucun variant retrouvé » ne signifie pas « pas de maladie héréditaire » : la surveillance clinique de la famille est maintenue.</p></template>

<template data-pop="i42-conseil" data-title="Conseil génétique">
<div class="lab">Avant le test</div><p>Expliquer le but (diagnostic, pronostic, famille), les trois résultats possibles, le délai, les conséquences psychologiques et familiales, le droit de ne pas savoir, et l’encadrement légal. En Suisse, la loi fédérale sur l’analyse génétique humaine (LAGH, révisée en 2022) exige un consentement éclairé et un conseil génétique non directif, et interdit aux assureurs d’exiger une analyse présymptomatique ; l’accès des assureurs aux résultats existants n’est possible que dans des cas limités par la loi.</p>
<div class="lab">Après le test</div><p>Remettre le résultat en consultation, expliquer sa classe, organiser l’information des apparentés (lettre familiale), planifier le dépistage.</p>
<div class="lab">Projet d’enfant</div><p>Transmission de 50 % dans les formes autosomiques dominantes. Options : grossesse spontanée avec surveillance de l’enfant, diagnostic prénatal, diagnostic préimplantatoire (autorisé en Suisse depuis 2017 pour les maladies héréditaires graves), don de gamètes. La décision appartient au couple.</p>
<div class="lab">Enfant apparenté</div><p>Test prédictif lorsqu’il a une conséquence médicale (surveillance, sport de compétition) ; sinon, on peut attendre que l’enfant puisse participer à la décision.</p></template>
