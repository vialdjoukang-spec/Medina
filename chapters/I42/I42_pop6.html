
<!-- ===== FENÊTRES PARETO ===== -->
<template data-pop="pareto-i42-def" data-title="Pareto — Définition, classification, épidémiologie">
<p class="ratio" data-cover="i42-1,i42-2"></p>
<ul><li>Cardiomyopathie = anomalie du muscle non expliquée suffisamment par coronaires, hypertension, valve ou cardiopathie congénitale.</li><li><a href="https://doi.org/10.1093/eurheartj/ehad194" target="_blank" rel="noopener">ESC 2023</a> : phénotype d’abord, puis étiologie. Cinq phénotypes : CMH (≥ 15 mm ; ≥ 13 mm chez un apparenté), CMD (dilatation + FEVG &lt; 50 %), CMNDVG (cicatrice non ischémique sans dilatation), CMAVD, CMR (restriction, parois normales).</li><li>Hypertrabéculation (« non-compaction ») : trait, plus une maladie.</li><li>Tako-tsubo et péripartum : syndromes acquis, traités à part.</li><li>CMH 0,2 % (1/500) ; CMD 0,036–0,4 %, diagnostic génétique de certitude chez environ 30 % ; CMAVD 0,078 % ; CMAVD : mort subite du jeune ; ATTR sauvage fréquente après 75 ans (ICFEp, rétrécissement aortique) ; Tako-tsubo 1–3 % des suspicions d’infarctus avec sus-décalage (InterTAK 2018), environ 90 % de femmes ménopausées ; péripartum : 1 accouchement sur 4 950 en Écosse.</li><li>Pas de registre suisse consolidé.</li></ul></template>

<template data-pop="pareto-i42-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i42-3"></p>
<ul><li>Compartiment atteint → phénotype : sarcomère hyperactif → CMH ; titine, cytosquelette, noyau (<i>LMNA</i>) → CMD ; desmosome → CMAVD ; espace extracellulaire → amylose.</li><li>CMH : trop de têtes de myosine actives → hypercontractilité, ATP ↑, relaxation incomplète, désarroi, fibrose, ischémie microvasculaire, obstruction dynamique.</li><li>Traitement de la CMH = réduire la contractilité (bêtabloquant → inhibiteur de la myosine) ; inotropes, déshydratation et vasodilatateurs aggravent.</li><li>CMAVD : étirement → mort cellulaire → fibro-adipose → réentrée ; l’effort accélère la maladie.</li><li>Amylose : paroi épaisse sans hypertrophie cellulaire → bas voltage. Tako-tsubo : catécholamines, apex. Péripartum : fragment de prolactine + <i>TTN</i>.</li></ul></template>

<template data-pop="pareto-i42-demarche" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i42-4"></p>
<ul><li>Suspicion → phénotype (échocardiographie, IRM) → étiologie (drapeaux rouges, biologie, imagerie ciblée) → génétique et dépistage familial.</li><li>Génétique recommandée lorsqu’elle sert au diagnostic, au pronostic, au traitement, au projet reproductif ou à la famille (classe I), avec conseil.</li><li>ATTR : scintigraphie grade 2–3 + absence de protéine monoclonale = diagnostic sans biopsie ; puis gène <i>TTR</i>.</li><li>Phénocopies (5–10 % des hypertrophies inexpliquées) : amylose, Fabry, Danon, <i>PRKAG2</i>, mitochondriales ; distinguer le cœur d’athlète.</li><li>Le phénotype évolue (CMH → phase dilatée) : réévaluer.</li></ul></template>

<template data-pop="pareto-i42-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i42-5,i42-6"></p>
<ul><li>Arbre familial sur trois générations : mort subite jeune, noyade, accident inexpliqué, stimulateur jeune, greffe.</li><li>Antécédents : sport, alcool, chimiothérapie, grossesse, canal carpien, neuromusculaire, sarcoïdose.</li><li>Symptômes : dyspnée, palpitations, angor à coronaires normales, syncope (arythmique, obstructive, réflexe) ; souvent asymptomatique.</li><li>CMH obstructive : souffle mésosystolique au bord gauche, ↑ debout et Valsalva, ↓ accroupi ; pouls bifide.</li><li>Examen normal au repos n’exclut pas l’obstruction (un tiers provoquée).</li><li>Signes extracardiaques : macroglossie, angiokératomes, peau bronzée, faiblesse musculaire.</li></ul></template>

<template data-pop="pareto-i42-cmh" data-title="Pareto — Cardiomyopathie hypertrophique">
<p class="ratio" data-cover="i42-7"></p>
<ul><li>≥ 15 mm (≥ 13 mm apparenté) ; formes septale, apicale, médioventriculaire, anévrisme apical.</li><li>Obstruction ≥ 30 mmHg ; significative ≥ 50 mmHg. Dynamique : ↑ Valsalva, debout, effort, nitrés, repas, alcool, déshydratation ; ↓ accroupi, handgrip, bêtabloquant.</li><li>Symptomatique avec gradient de repos &lt; 50 : Valsalva, debout, échocardiographie d’effort.</li><li>Traitement : bêtabloquant (I) → vérapamil/diltiazem si intolérance (I) → ajout du disopyramide (I ; monothérapie IIb ; QTc &lt; 500 ms) ou d’un inhibiteur de la myosine (mavacamten IIa, monothérapie IIa si tout le reste est contre-indiqué ; aficamten), pas les deux ensemble → réduction septale si ≥ 50 mmHg : NYHA III–IV (I), syncopes d’effort récidivantes (IIa), NYHA II avec fuite mitrale, fibrillation auriculaire ou oreillette dilatée en centre expert (IIb).</li><li>Anévrisme apical : IRM ou contraste ; thrombus, tachycardie ventriculaire monomorphe ; anticoagulation si thrombus.</li><li>Éviter nitrés, dihydropyridines, diurétiques forts, inotropes.</li><li>Essais : EXPLORER-HCM, VALOR-HCM (mavacamten) ; SEQUOIA-HCM, MAPLE-HCM (aficamten) ; en forme non obstructive, ODYSSEY-HCM négatif et ACACIA-HCM positif.</li><li>Fibrillation auriculaire : anticoagulation quel que soit le score. Phase dilatée (FEVG &lt; 50 %) : traitement I50, arrêt des inhibiteurs.</li></ul></template>

<template data-pop="pareto-i42-ms" data-title="Pareto — Urgences, mort subite, défibrillateur et sport">
<p class="ratio" data-cover="i42-8"></p>
<ul><li>Urgences : syncope d’effort, tachycardie ventriculaire, bloc de haut degré, hypotension obstructive (remplissage, phényléphrine, bêtabloquant ; pas d’inotrope ni de nitré), amylose AL.</li><li>Bloc auriculoventriculaire avant 60 ans : sarcoïdose, <i>LMNA</i>.</li><li>Prévention secondaire : défibrillateur classe I.</li><li>CMH : HCM Risk-SCD (≥ 16 ans, 7 variables) : ≥ 6 % IIa ; 4–6 % IIb ; &lt; 4 % en règle non, sauf fibrose ≥ 15 % ou FEVG &lt; 50 %, à discuter (IIb) ; anévrisme apical : décider sur le score, pas sur l’anévrisme seul (IIa).</li><li>CMD/CMNDVG : FEVG ≤ 35 % malgré 3 mois de traitement (IIa ; DANISH) ; génotype à haut risque (<i>LMNA</i>, <i>FLNC</i> tronquant, <i>TMEM43</i>, <i>PLN</i>, <i>DSP</i>, <i>RBM20</i>) avec FEVG &gt; 35 % et facteurs propres au gène (rehaussement tardif, FEVG &lt; 45 %, score <i>LMNA</i> ou <i>PLN</i>) : IIa ; sans facteur : IIb.</li><li>Sous-cutané si pas de stimulation ; transveineux si stimulation ; gilet si récupération possible.</li><li>Sport : modéré pour tous ; compétition possible en CMH à faible risque (IIb) ; pas d’effort intense en CMAVD, même porteur sain.</li></ul></template>

<template data-pop="pareto-i42-cmd" data-title="Pareto — Cardiomyopathies dilatée, non dilatée et arythmogène">
<p class="ratio" data-cover="i42-9,i42-10"></p>
<ul><li>CMD : exclure l’ischémie (coroscanner, coronarographie, IRM).</li><li>Causes : génétique (<i>TTN</i>, <i>LMNA</i>, <i>FLNC</i>…), alcool, chimiothérapie, tachycardie, myocardite, péripartum, endocrinienne, neuromusculaire.</li><li>Traitement I50 + cause (abstinence, contrôle de fréquence, immunosuppression prouvée) ; CRT efficace ; ne pas arrêter si FEVG récupérée (TRED-HF).</li><li>CMNDVG : cicatrice sans dilatation ; anneau sous-épicardique = <i>DSP</i>/<i>FLNC</i> ; « myocardites » répétées = phases chaudes génétiques.</li><li>CMAVD : <i>PKP2</i> ; ondes T négatives V1–V3, epsilon, tachycardie ventriculaire à retard gauche ; critères Task Force 2010/Padoue.</li><li>Différentiels : tachycardie de la chambre de chasse droite (bénigne), sarcoïdose, athlète.</li><li>Traitement : pas d’effort modéré ou intense (III ; porteur sans phénotype : éviter l’intensité élevée, IIb), bêtabloquant, antiarythmique, ablation, défibrillateur.</li></ul></template>

<template data-pop="pareto-i42-restr" data-title="Pareto — Formes restrictives et infiltratives">
<p class="ratio" data-cover="i42-11"></p>
<ul><li>Restriction : oreillettes très dilatées, congestion droite, débit dépendant de la fréquence ; éliminer la constriction.</li><li>ATTR : homme âgé, canal carpien, lent ; scintigraphie + absence de protéine monoclonale ; tafamidis, acoramidis, vutrisiran.</li><li>AL : clone plasmocytaire, rapide, rein, macroglossie ; histologie obligatoire ; hématologie en urgence (daratumumab-CyBorD).</li><li>Amylose : diurétiques prudents ; pas de vérapamil ni de diltiazem ; digoxine prudente ; anticoagulation en fibrillation auriculaire quel que soit le score.</li><li>Sarcoïdose : bloc chez le jeune, IRM + TEP au FDG ; corticoïdes ± méthotrexate ; défibrillateur si stimulation nécessaire.</li><li>Fer : saturation &gt; 45 %, T2* &lt; 20 ms ; saignées ou chélateurs ; réversible.</li><li>Fabry : PR court, protéinurie, acroparesthésies, T1 bas ; enzyme (homme) ou <i>GLA</i> (femme) ; enzymothérapie, migalastat.</li><li>Fibrose endomyocardique : Löffler (éosinophiles &gt; 1,5 G/L persistants) ; restriction après radiothérapie thoracique.</li></ul></template>

<template data-pop="pareto-i42-acq" data-title="Pareto — Tako-tsubo et péripartum">
<p class="ratio" data-cover="i42-12,i42-13"></p>
<ul><li>Tako-tsubo : femme ménopausée, stress, ballonisation apicale au-delà d’un territoire, troponine modérée, NT-proBNP très élevé ; IRM : œdème sans rehaussement.</li><li>Coronarographie obligatoire : diagnostic d’exclusion ; InterTAK &gt; 70 : probabilité élevée.</li><li>Pas bénin : choc ~10 %, obstruction (pas d’inotrope), thrombus (anticoagulation), QT long ; récidive 1–2 %/an.</li><li>Péripartum : FEVG &lt; 45 %, fin de grossesse ou post-partum ; NT-proBNP puis échocardiographie.</li><li>Grossesse : bêtabloquant, diurétiques, hydralazine-nitrés ; pas d’IEC/ARA II/ARNI/ARM/iSGLT2. Post-partum : traitement complet.</li><li>Bromocriptine : discutée (IIb en 2018 ; preuves insuffisantes selon l’ESC 2025), avec anticoagulation.</li><li>Génétique à envisager (IIa, <a href="https://doi.org/10.1093/eurheartj/ehad194" target="_blank" rel="noopener">ESC 2023</a>), recommandée (classe I, ESC 2025) ; traitement ≥ 1 an après récupération ; nouvelle grossesse déconseillée si FEVG non normalisée.</li></ul></template>

<template data-pop="pareto-i42-gen" data-title="Pareto — Toxiques, dépistage familial et conseil génétique">
<p class="ratio" data-cover="i42-14,i42-15"></p>
<ul><li>Alcool : &gt; 80 g/jour &gt; 5 ans ; abstinence = traitement.</li><li>Anthracyclines : cumulatives, irréversibles (risque élevé &gt; 250 mg/m²) ; dexrazoxane, liposomes, IEC/ARA II + bêtabloquant. Trastuzumab : réversible, échocardiographie tous les 3 mois. Baisse relative du strain &gt; 15 % = toxicité débutante (ESC 2022).</li><li>Inhibiteurs de points de contrôle : myocardite précoce, grave, avec myosite ; méthylprednisolone 500–1000 mg/jour.</li><li>Toxique + <i>TTN</i> fréquent → génétique.</li><li>Autosomique dominante, 50 %, pénétrance incomplète ; exceptions : Fabry, Danon (X), mitochondriales.</li><li>Conseil avant et après ; LAGH ; seules les classes pathogène et probablement pathogène servent au dépistage.</li><li>Variant connu → test ciblé ; non-porteur = fin de surveillance. Sinon → surveillance clinique : 1–3 ans (enfant), 3–5 ans (adulte).</li></ul></template>

<template data-pop="pareto-i42-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i42-16,i42-17"></p>
<ul><li>Suivi à vie : clinique, ECG, échocardiographie, Holter 24–48 h tous les 1–2 ans ; IRM tous les 2–5 ans selon la sévérité et l’évolution ; recalcul du risque.</li><li>CMH traitée : mortalité ~1 %/an. AL avancée : mois. ATTR : années, ralentie par les traitements.</li><li>Conduite : suspension temporaire après défibrillateur ou syncope ; professionnelle en règle incompatible.</li><li>Grossesse : bêtabloquant (pas d’aténolol) ; inhibiteurs de la myosine contre-indiqués ; CMD avec FEVG &lt; 30 % ou NYHA III–IV : grossesse déconseillée.</li><li>Sujet âgé : chercher l’ATTR. Rein : Fabry, AL. Enfant : Noonan, Pompe, HCM Risk-Kids.</li><li>Anesthésie de la CMH obstructive : éviter hypovolémie, vasodilatation, catécholamines.</li></ul></template>

<template data-pop="pareto-i42-ecgex" data-title="Pareto — ECG et Holter">
<p class="ratio" data-cover="i42-e-2"></p>
<ul><li>CMH : hypertrophie + T négatives, Q fines ; T géantes = apicale.</li><li>Bas voltage + parois épaisses = amylose ; PR court = Fabry, <i>PRKAG2</i>, Danon.</li><li>Bloc + fibrillation auriculaire chez le jeune = <i>LMNA</i>, sarcoïdose.</li><li>CMAVD : T négatives V1–V3, epsilon ; CMD : bloc de branche gauche (CRT si ≥ 150 ms).</li><li>Holter : tachycardie ventriculaire non soutenue (score), &gt; 500 extrasystoles (CMAVD), fibrillation auriculaire (anticoagulation).</li><li>ECG d’athlète : T négatives latérales, Q, bloc de branche gauche jamais physiologiques.</li></ul></template>

<template data-pop="pareto-i42-imag" data-title="Pareto — Échocardiographie et IRM">
<p class="ratio" data-cover="i42-e-3,i42-e-4"></p>
<ul><li>Épaisseur ≥ 15 mm ; ≥ 30 mm = risque. Gradient ≥ 30 / ≥ 50 mmHg ; lame de sabre tardive ≠ flux mitral précoce.</li><li>Mouvement systolique antérieur, fuite mitrale postérieure. Restriction : E/A &gt; 2, décélération &lt; 150 ms.</li><li>Amylose : épargne apicale du strain (rapport &gt; 1).</li><li>IRM : classe I au bilan ; gadolinium = espace extracellulaire.</li><li>Patterns : sous-endocardique systématisé = ischémie ; plages intramyocardiques = CMH (≥ 15 % = risque) ; bande septale = CMD ; anneau sous-épicardique = <i>DSP</i>/<i>FLNC</i> ; sous-endocardique global + volume extracellulaire &gt; 40 % = amylose ; T1 bas = Fabry ; T2* &lt; 20 ms = fer ; œdème sans rehaussement = Tako-tsubo.</li></ul></template>

<template data-pop="pareto-i42-bio" data-title="Pareto — Biologie">
<p class="ratio" data-cover="i42-e-5"></p>
<ul><li>NT-proBNP et troponine : disproportionnés dans l’amylose ; troponine aiguë = phase inflammatoire.</li><li>Immunofixations sérique et urinaire + chaînes légères libres (rapport 0,26–1,65) : obligatoires avant de conclure à une ATTR.</li><li>Créatine kinase : myopathie associée. Saturation de la transferrine &gt; 45 % : fer. Alpha-galactosidase, lyso-Gb3 : Fabry. Éosinophiles &gt; 1,5 G/L : Löffler.</li><li>Stades : Mayo (AL : troponine T ≥ 0,035 µg/L, NT-proBNP ≥ 332 ng/L ; IIIb &gt; 8 500) ; National Amyloidosis Centre (ATTR : NT-proBNP &gt; 3 000, DFG &lt; 45).</li></ul></template>

<template data-pop="pareto-i42-inv" data-title="Pareto — Scintigraphie, biopsie, génétique">
<p class="ratio" data-cover="i42-e-6,i42-e-7"></p>
<ul><li>Scintigraphie (DPD, PYP, HMDP) : Perugini 0–3 ; tomographie indispensable ; grade 2–3 sans protéine monoclonale = ATTR.</li><li>TEP au FDG : préparation diététique ; fixation + défaut de perfusion = sarcoïdose active ; suivi du traitement.</li><li>Biopsie endomyocardique : gold standard histologique ; utile si elle change le traitement ; faible sensibilité dans les maladies en plages ; &lt; 1 % de complications graves.</li><li>Cathétérisme : restriction ou constriction (discordance respiratoire).</li><li>Génétique : diagnostic de certitude chez environ 40 % des CMH et 30 % des CMD ; variant de signification incertaine = aucune décision ; résultat négatif ≠ non héréditaire.</li></ul></template>

<template data-pop="pareto-i42-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i42-e-1,i42-e-2,i42-e-3,i42-e-4,i42-e-5,i42-e-6,i42-e-7,i42-e-8"></p>
<ul><li>Hiérarchie : échocardiographie (première ligne) + ECG + IRM (référence tissulaire, classe I) + Holter + génétique ; puis examens ciblés.</li><li>Gold standards : IRM pour le tissu ; biopsie pour l’histologie ; scintigraphie + protéine monoclonale pour l’ATTR non invasive.</li><li>Obstruction : chercher le gradient provoqué (Valsalva, debout, effort) ; pas de dobutamine.</li><li>Protéine monoclonale présente → histologie avec typage.</li><li>Tako-tsubo : coronarographie d’abord ; pas d’inotrope si obstruction.</li><li>Épisodes « myocardite » répétés + cicatrice en anneau → génétique (<i>DSP</i>).</li></ul></template>

<template data-pop="pareto-i42-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i42-sa,i42-sh,i42-sp,i42-sb,i42-sg"></p>
<ul><li>Chambre de chasse = septum basal + feuillet mitral antérieur ; appareil mitral souvent anormal dans la CMH ; faisceau de His proche : bloc après réduction septale.</li><li>Ventricule droit fin ; CMAVD débute en sous-tricuspide et paroi inférieure.</li><li>Histologie : désarroi + fibrose (CMH) ; fibro-adipose (CMAVD) ; rouge Congo (amylose) ; granulomes (sarcoïdose) ; corps lamellaires (Fabry) ; Perls (fer).</li><li>Gradient = 4 × v² ; obstruction par poussée du flux sur le feuillet, pic tardif.</li><li>Restriction : relation télédiastolique raide, racine carrée ; volume d’éjection fixe → débit dépendant de la fréquence.</li><li>Inhibiteurs de la myosine : libération du phosphate ralentie, état super-relâché ↑ ; surdosage = dysfonction systolique.</li><li>Transthyrétine : dissociation du tétramère = étape limitante ; stabilisateurs vs silenceur (vitamine A).</li><li>Génétique : <i>MYBPC3</i> (haplo-insuffisance), <i>MYH7</i> (dominant négatif) ; pénétrance et expressivité variables ; gène → risque, traitement, famille.</li></ul></template>

<template data-pop="pareto-i42-pobst" data-title="Pareto — Traitement de l’obstruction">
<p class="ratio" data-cover="i42-p-2,i42-p-3"></p>
<ul><li>Propranolol 10–40 mg 3 à 4 fois par jour et vérapamil jusqu’à 480 mg/jour : seules molécules portant l’indication CMH en Suisse ; bisoprolol → 10 mg, métoprolol succinate → 200 mg, diltiazem → 360 mg hors indication ; disopyramide 400–600 mg (importé ; avec freinateur, QTc).</li><li>Vérapamil évité si gradient très élevé avec hypotension.</li><li>Mavacamten 5 mg pour tous si FEVG ≥ 55 % (pas de génotypage en Suisse), paliers 2,5 → 15 mg ; augmentation au plus toutes les 12 semaines ; interruption si FEVG &lt; 50 % ; Swissmedic 25.04.2023.</li><li>Aficamten 5 → 20 mg ; demi-vie courte ; Union européenne 17.02.2026, pas d’autorisation suisse retrouvée.</li><li>Début si FEVG ≥ 55 % ; arrêt si FEVG &lt; 50 % ; réduire si le gradient lors de la manœuvre de Valsalva est &lt; 20 mmHg ; augmenter seulement à partir de la semaine 12.</li><li>Contre-indications suisses : hypersensibilité, grossesse ; inhibiteur puissant du CYP2C19 introduit → réduction d’un palier.</li><li>Interactions : inhibiteurs du CYP2C19/CYP3A4 (oméprazole, fluconazole, clarithromycine) ; inducteurs. Grossesse contre-indiquée (toxicité embryofœtale) ; contraception hautement efficace jusqu’à au moins 4 mois après l’arrêt.</li></ul></template>

<template data-pop="pareto-i42-petio" data-title="Pareto — Traitements étiologiques">
<p class="ratio" data-cover="i42-p-4,i42-p-5"></p>
<ul><li>Tafamidis 61 mg/jour (ATTR-ACT, mortalité 29,5 vs 42,9 % ; classe I en NYHA I–II selon l’<a href="https://doi.org/10.1093/eurheartj/ehab368" target="_blank" rel="noopener">ESC 2021 sur l’insuffisance cardiaque</a>).</li><li>Acoramidis 712 mg × 2/jour (ATTRibute-CM ; Swissmedic 18.12.2025).</li><li>Vutrisiran 25 mg sous-cutané /3 mois + vitamine A 2 500–3 000 UI/jour au plus (HELIOS-B, rapport de risque 0,72 ; Swissmedic 16.10.2025).</li><li>AL : daratumumab-CyBorD (ANDROMEDA), hématologie en urgence.</li><li>Fabry : agalsidases, pégunigalsidase toutes les 2 semaines ; migalastat 123 mg un jour sur deux (variants répondeurs).</li><li>Sarcoïdose : corticoïdes ± méthotrexate, doses fixées en centre spécialisé ; suivi TEP. Fer : saignées ou chélateurs.</li><li>Bromocriptine 2,5 mg × 2 (2 semaines) puis × 1 (6 semaines) + héparine.</li><li>Inhibiteurs de points de contrôle : méthylprednisolone 500–1000 mg/jour. Anthracyclines : dexrazoxane.</li></ul></template>

<template data-pop="pareto-i42-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i42-p-1,i42-p-2,i42-p-3,i42-p-4,i42-p-5,i42-p-6"></p>
<ul><li>Trois objectifs : obstruction/congestion, rythme/embolies, cause.</li><li>CMH : bêtabloquant → vérapamil/diltiazem → inhibiteur de la myosine ou disopyramide → réduction septale.</li><li>CMD : thérapie fondamentale de l’insuffisance cardiaque (chapitre I50).</li><li>ATTR : tafamidis, acoramidis, vutrisiran ; AL : hématologie.</li><li>Fibrillation auriculaire dans la CMH et l’amylose : anticoagulation quel que soit le score ; amiodarone.</li><li>Éviter : nitrés, dihydropyridines, inhibiteurs de la phosphodiestérase de type 5, diurétiques forts, digoxine, inotropes (CMH obstructive) ; vérapamil/diltiazem et digoxine (amylose) ; catécholamines et QT (Tako-tsubo).</li></ul></template>
