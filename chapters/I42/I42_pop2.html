
<!-- ===== FENÊTRES : clinique, risque rythmique, sport ===== -->
<template data-pop="i42-atcd-fam" data-title="Histoire familiale sur trois générations">
<div class="lab">Comment la recueillir</div><p>Dessiner l’arbre généalogique : parents, fratrie, enfants, grands-parents, oncles, tantes et cousins. Pour chacun : âge, vivant ou décédé, âge et cause du décès. Poser des questions précises : « Quelqu’un est-il mort subitement ou de façon inexpliquée avant 50 ans ? noyé ? mort dans un accident de voiture sans cause claire ? A-t-il porté un stimulateur ou un défibrillateur ? A-t-il été greffé du cœur ? »</p>
<div class="lab">Pourquoi</div><p>Un décès inexpliqué jeune, une noyade chez un bon nageur ou un accident de la route sans cause peuvent être des morts subites arythmiques. Un stimulateur implanté jeune évoque <i>LMNA</i>. Le mode de transmission (vertical, lié à l’X, maternel) oriente vers le gène.</p>
<div class="lab">Piège</div><p>Une histoire familiale « négative » est souvent incomplète : familles petites, informations manquantes, pénétrance incomplète. Elle n’exclut pas une maladie génétique.</p></template>

<template data-pop="i42-atcd-sport" data-title="Pratique sportive">
<div class="lab">Questions</div><p>Type de sport (endurance, force, mixte), heures par semaine, niveau (loisir, compétition, élite), ancienneté, symptômes à l’effort, produits consommés (compléments, stimulants, anabolisants).</p>
<div class="lab">Pourquoi</div><p>L’entraînement d’endurance modifie le cœur (dilatation, hypertrophie modérée, bradycardie) et crée une zone de chevauchement avec la CMH, la CMD et la CMAVD. L’endurance intense aggrave la CMAVD. Les anabolisants provoquent hypertrophie et fibrose.</p></template>

<template data-pop="i42-atcd-tox" data-title="Toxiques et traitements cardiotoxiques">
<div class="lab">Alcool</div><p>Quantifier en grammes par jour (un verre standard contient environ 10 à 12 g d’alcool) et en années. Seuil classique de la cardiomyopathie alcoolique : plus de 80 g par jour pendant plus de cinq ans.</p>
<div class="lab">Traitements du cancer</div><p>Molécule, dose cumulée d’anthracyclines (mg/m²), trastuzumab, inhibiteurs de points de contrôle immunitaire, radiothérapie thoracique (champ, dose, date).</p>
<div class="lab">Drogues et médicaments</div><p>Cocaïne, amphétamines, méthamphétamine, anabolisants ; clozapine, chloroquine et hydroxychloroquine, inhibiteurs de tyrosine kinase.</p></template>

<template data-pop="i42-atcd-extra" data-title="Atteintes extracardiaques évocatrices">
<div class="lab">Amylose ATTR</div><p>Canal carpien bilatéral, souvent 5 à 10 ans avant la cardiopathie ; sténose du canal lombaire ; rupture spontanée du tendon du long biceps ; neuropathie et troubles digestifs dans les formes héréditaires.</p>
<div class="lab">Amylose AL</div><p>Syndrome néphrotique, hépatomégalie, macroglossie, ecchymoses faciles, perte de poids.</p>
<div class="lab">Maladie de Fabry</div><p>Douleurs brûlantes des mains et des pieds depuis l’enfance, déclenchées par la chaleur ou l’effort ; anhidrose ; troubles digestifs ; insuffisance rénale ; accident vasculaire cérébral jeune.</p>
<div class="lab">Autres</div><p>Sarcoïdose pulmonaire, cutanée ou oculaire ; diabète et hypogonadisme (surcharge en fer) ; surdité et diabète (mitochondrial) ; faiblesse musculaire (dystrophies).</p></template>

<template data-pop="i42-neuromusc" data-title="Maladies neuromusculaires et cœur">
<div class="lab">Dystrophinopathies (Duchenne, Becker)</div><p>Transmission liée à l’X. CMD fréquente, souvent plus grave que l’atteinte musculaire dans la forme de Becker. Les femmes conductrices peuvent développer une CMD : elles doivent être surveillées.</p>
<div class="lab">Dystrophie myotonique de type 1 (Steinert)</div><p>Troubles de conduction progressifs et arythmies ; mort subite ; le PR et le QRS s’allongent avec le temps. La surveillance ECG est annuelle et un stimulateur ou un défibrillateur est discuté selon la conduction.</p>
<div class="lab">Laminopathies (dont Emery-Dreifuss)</div><p>Contractures précoces des coudes et des chevilles, faiblesse, puis troubles de conduction, fibrillation auriculaire, CMD et mort subite.</p>
<div class="lab">Ataxie de Friedreich</div><p>CMH concentrique puis dilatation ; ataxie, diabète.</p>
<div class="lab">Conséquence</div><p>Tout patient atteint d’une maladie neuromusculaire à risque cardiaque bénéficie d’un suivi cardiologique systématique, même sans symptôme, car la faiblesse musculaire masque la dyspnée.</p></template>

<template data-pop="i42-s-palp" data-title="Palpitations dans les cardiomyopathies">
<div class="lab">Fibrillation auriculaire</div><p>Fréquente dans la CMH (environ un patient sur cinq), l’amylose et les laminopathies. Mal tolérée, car le ventricule rigide dépend de la contraction auriculaire et d’une diastole assez longue. Elle impose l’anticoagulation dans la CMH et l’amylose, quel que soit le score.</p>
<div class="lab">Arythmies ventriculaires</div><p>Palpitations à l’effort, rapides, avec malaise : évoquent une tachycardie ventriculaire (CMAVD, CMNDVG, sarcoïdose). Un enregistrement (Holter, moniteur implantable) est nécessaire.</p>
<div class="lab">Questions</div><p>Début et fin brusques ou progressifs, régularité, circonstances (effort, repos), durée, malaise ou syncope associés.</p></template>

<template data-pop="i42-s-angor" data-title="Douleur thoracique à coronaires normales">
<div class="lab">Mécanisme</div><p>Dans la CMH, la masse musculaire augmentée, la pression systolique élevée par l’obstruction et la relaxation lente augmentent la demande en oxygène. L’offre diminue, car les artérioles intramurales sont épaissifiées (ischémie microvasculaire) et la diastole, pendant laquelle le myocarde est perfusé, se raccourcit à l’effort. Un pont myocardique peut s’y ajouter.</p>
<div class="lab">Caractéristiques</div><p>Douleur d’effort typique d’angor, parfois post-prandiale, alors que la coronarographie est normale.</p>
<div class="lab">Conséquence thérapeutique</div><p>Les dérivés nitrés, utiles dans l’angor coronaire, aggravent l’obstruction ; on utilise les bêtabloquants ou les inhibiteurs calciques bradycardisants.</p></template>

<template data-pop="i42-s-syncope" data-title="Syncope dans les cardiomyopathies">
<div class="lab">Trois mécanismes</div><p><b>Arythmique</b> : tachycardie ou fibrillation ventriculaire, bloc auriculoventriculaire ; brutale, sans prodrome, parfois en position couchée, avec traumatisme. <b>Obstructive</b> : à l’effort ou juste après, en se levant, après un repas ou de l’alcool. <b>Réflexe</b> : prodromes (chaleur, nausées), déclencheur typique ; plus fréquente dans la CMH qu’on ne le croit, par réflexe ventriculaire anormal.</p>
<div class="lab">Valeur pronostique</div><p>Une syncope inexpliquée, surtout récente (dans les six mois), est une variable du score HCM Risk-SCD. Une syncope clairement réflexe ne compte pas.</p>
<div class="lab">Conduite</div><p>ECG, Holter, échocardiographie avec manœuvres, épreuve d’effort ; moniteur implantable si les épisodes sont rares et le mécanisme incertain. Suspension temporaire de la conduite automobile.</p></template>

<template data-pop="i42-e-souffle" data-title="Souffle de la cardiomyopathie hypertrophique obstructive">
<div class="lab">Technique</div><p>Ausculter au bord gauche du sternum (3e et 4e espaces intercostaux) et à la pointe, en position couchée, accroupie, puis debout, et pendant une manœuvre de Valsalva.</p>
<div class="lab">Sémiologie</div><p>Souffle mésosystolique éjectionnel, rude, maximal au bord gauche du sternum, peu irradié vers les carotides. Un second souffle apexien, holosystolique, irradiant vers l’aisselle, traduit l’insuffisance mitrale associée.</p>
<div class="lab">Variations</div><p>Augmente en passant debout et pendant la manœuvre de Valsalva ; diminue en position accroupie et avec la poignée de main soutenue.</p>
<div class="lab">Diagnostic différentiel</div><p>Rétrécissement aortique : souffle irradié aux carotides, qui diminue pendant la manœuvre de Valsalva et augmente en position accroupie ; B2 diminué. Insuffisance mitrale organique : diminue debout. Seul le souffle de la CMH obstructive et celui du prolapsus mitral augmentent debout.</p></template>

<template data-pop="i42-e-pouls" data-title="Pouls carotidien bifide">
<div class="lab">Sémiologie</div><p>Montée rapide et ample du pouls (éjection libre au début de la systole), puis creux en milieu de systole lorsque l’obstruction survient, puis seconde onde (« pouls bifide »).</p>
<div class="lab">Signe de Brockenbrough-Braunwald-Morrow</div><p>Au cathétérisme, après une extrasystole ventriculaire, la contractilité augmente : le gradient intraventriculaire augmente et la pression différentielle aortique diminue. Dans le rétrécissement aortique fixe, la pression différentielle augmente après l’extrasystole. Ce signe distingue l’obstruction dynamique de l’obstruction fixe.</p>
<div class="lab">Valeur</div><p>Spécifique mais inconstant ; l’échocardiographie a remplacé sa recherche courante.</p></template>

<template data-pop="i42-e-extra" data-title="Signes extracardiaques à rechercher">
<div class="lab">Amylose</div><p>Macroglossie avec empreintes dentaires, purpura périorbitaire spontané, hépatomégalie (AL) ; cicatrices de canal carpien, amyotrophie, hypotension orthostatique (ATTR).</p>
<div class="lab">Maladie de Fabry</div><p>Angiokératomes (petites papules rouge foncé de la région du maillot de bain et de l’ombilic), cornée verticillée à la lampe à fente, hypohidrose.</p>
<div class="lab">Surcharge en fer</div><p>Pigmentation cutanée grise ou bronzée, hépatomégalie, arthropathie des deuxième et troisième métacarpo-phalangiennes.</p>
<div class="lab">Sarcoïdose</div><p>Érythème noueux, lupus pernio, adénopathies, uvéite.</p>
<div class="lab">Maladies neuromusculaires et syndromes</div><p>Faiblesse proximale, pseudohypertrophie des mollets, myotonie, contractures ; traits de Noonan (hypertélorisme, cou palmé, implantation basse des oreilles) ; ataxie.</p></template>

<template data-pop="i42-srt" data-title="Réduction septale : myectomie ou alcoolisation">
<div class="lab">Indications (ESC 2023)</div><p>Gradient ≥ 50 mmHg malgré le traitement médical maximal toléré, dans un centre expérimenté : classe NYHA III–IV, recommandée (classe I) ; syncopes d’effort récidivantes, à envisager (classe IIa) ; classe NYHA II avec insuffisance mitrale modérée à sévère liée au mouvement systolique antérieur, fibrillation auriculaire ou oreillette gauche dilatée, à envisager (classe IIa).</p>
<div class="lab">Myectomie chirurgicale (intervention de Morrow élargie)</div><p>Résection du septum basal et médioventriculaire, avec correction des anomalies mitrales et des muscles papillaires si nécessaire. Mortalité inférieure à 1 % dans les centres à fort volume. Complications : bloc de branche gauche fréquent, bloc auriculoventriculaire complet rare, communication interventriculaire, insuffisance aortique. Préférée chez le patient jeune, si le septum est très épais, en cas d’anomalie mitrale ou de chirurgie cardiaque associée.</p>
<div class="lab">Alcoolisation septale</div><p>Injection de 1 à 3 mL d’alcool absolu dans une branche septale de l’artère interventriculaire antérieure, choisie par échocardiographie de contraste, qui crée un infarctus localisé du septum basal. Complication principale : bloc auriculoventriculaire complet nécessitant un stimulateur chez environ 10 % des patients ; bloc de branche droit. Moins efficace si le septum est très épais ; préférée chez le patient âgé ou à haut risque chirurgical.</p>
<div class="lab">Depuis les inhibiteurs de la myosine</div><p>L’essai VALOR-HCM a montré que le mavacamten évite ou diffère la réduction septale chez la majorité des candidats. Le choix se discute désormais entre les deux options.</p></template>

<template data-pop="i42-hcmrisk" data-title="Score HCM Risk-SCD">
<div class="lab">Objet</div><p>Estimer le risque de mort subite à 5 ans chez un patient atteint de CMH, âgé de 16 ans ou plus, en prévention primaire (O’Mahony et coll., 2014 ; repris par l’ESC 2014 puis 2023).</p>
<div class="lab">Variables</div><p>Âge (années) ; épaisseur pariétale maximale (mm) ; diamètre de l’oreillette gauche (mm) ; gradient maximal de la chambre de chasse au repos ou pendant la manœuvre de Valsalva (mmHg) ; histoire familiale de mort subite (un ou plusieurs apparentés du premier degré morts subitement avant 40 ans, ou à tout âge avec une CMH confirmée) ; tachycardie ventriculaire non soutenue (au moins 3 battements à ≥ 120/min au Holter) ; syncope inexpliquée.</p>
<div class="lab">Formule</div><p>Probabilité à 5 ans = 1 − 0,998<sup>exp(indice pronostique)</sup>, où l’indice pronostique = 0,15939858 × épaisseur − 0,00294271 × épaisseur² + 0,0259082 × oreillette gauche + 0,00446131 × gradient + 0,4583082 × histoire familiale + 0,82639195 × tachycardie ventriculaire non soutenue + 0,71650361 × syncope − 0,01799934 × âge (variables binaires : 0 ou 1). Le calcul se fait avec le calculateur en ligne de l’ESC.</p>
<div class="lab">Lecture</div><p>Le terme quadratique de l’épaisseur fait croître le risque jusqu’à environ 27 mm, puis le fait décroître légèrement. Le score sous-estime donc probablement le risque des hypertrophies extrêmes (≥ 30 mm), ce qui justifie une discussion individuelle chez ces patients. Le coefficient négatif de l’âge traduit un risque plus élevé chez le jeune.</p>
<div class="lab">Seuils (ESC 2023)</div><p>≥ 6 % : défibrillateur à envisager (IIa). 4 à &lt; 6 % : peut être envisagé (IIb). &lt; 4 % : en règle non indiqué. Dans les groupes à risque faible ou intermédiaire, une fibrose &gt; 15 % de la masse ou une FEVG &lt; 50 % peuvent faire envisager le défibrillateur. L’anévrisme apical, l’hypotension d’effort et le génotype, retenus par d’autres sociétés, ne sont pas des modificateurs dans l’ESC 2023.</p>
<div class="lab">Limites</div><p>Non validé avant 16 ans (score HCM Risk-Kids), chez l’athlète d’élite, dans les phénocopies métaboliques et infiltratives, après une réduction septale et en prévention secondaire.</p></template>

<template data-pop="i42-dai" data-title="Défibrillateur automatique implantable dans les cardiomyopathies">
<div class="lab">Prévention secondaire</div><p>Après un arrêt cardiaque par fibrillation ventriculaire ou une tachycardie ventriculaire soutenue mal tolérée, sans cause réversible : classe I dans toutes les cardiomyopathies.</p>
<div class="lab">Prévention primaire : critères propres à chaque phénotype (ESC 2023)</div><p><b>CMH</b> : score HCM Risk-SCD et marqueurs additionnels. <b>CMD et CMNDVG</b> : FEVG ≤ 35 % sous traitement optimal (IIa) ; <i>LMNA</i> selon le calculateur dédié ; <i>FLNC</i>, <i>DSP</i>, <i>PLN</i>, <i>RBM20</i> avec FEVG &lt; 50 % et deux facteurs de risque. <b>CMAVD</b> : syncope arythmique, tachycardie ventriculaire soutenue, dysfonction ventriculaire sévère, calculateur de risque. <b>Sarcoïdose</b> : FEVG ≤ 35 %, ou fibrose importante, ou indication de stimulation (repères ESC 2022 sur les arythmies ventriculaires).</p>
<div class="lab">Types</div><p>Transveineux (stimulation antibradycardique et antitachycardique possibles) ; sous-cutané (pas de sonde dans le cœur, moins d’infections, mais pas de stimulation ; dépistage préalable de la morphologie de l’ECG) ; portable (protection temporaire).</p>
<div class="lab">Inconvénients à expliquer</div><p>Chocs inappropriés, complications des sondes, infection, retentissement psychologique, restrictions de conduite, remplacements du boîtier.</p>
<div class="lab">Fenêtre voisine</div><p>Indications générales dans l’insuffisance cardiaque : fenêtre <b>Défibrillateur automatique implantable</b> du chapitre I50.</p></template>

<template data-pop="i42-lmna" data-title="Cardiomyopathie liée à LMNA">
<div class="lab">Tableau</div><p>Troubles de conduction (PR long, bloc auriculoventriculaire) et fibrillation auriculaire souvent vers 30–40 ans, puis arythmies ventriculaires et CMD. La mort subite peut survenir avec une FEVG conservée. Atteinte musculaire possible (créatine kinase élevée).</p>
<div class="lab">Calculateur de risque des laminopathies (2019)</div><p>Il estime le risque d’arythmie ventriculaire menaçante à 5 ans à partir du sexe masculin, du type de variant (non faux-sens), de la tachycardie ventriculaire non soutenue, du bloc auriculoventriculaire et de la FEVG.</p>
<div class="lab">Décision (ESC 2023)</div><p>Défibrillateur à envisager si le risque estimé est ≥ 10 % à 5 ans et s’il existe une tachycardie ventriculaire non soutenue, une FEVG &lt; 50 % ou un trouble de conduction auriculoventriculaire (IIa). Si une stimulation est nécessaire, on implante d’emblée un défibrillateur plutôt qu’un stimulateur.</p>
<div class="lab">Famille</div><p>Dépistage prioritaire des apparentés ; sport intense déconseillé chez les porteurs.</p></template>

<template data-pop="i42-sport" data-title="Sport et cardiomyopathies">
<div class="lab">Évaluation avant autorisation</div><p>Symptômes, histoire familiale, ECG, échocardiographie, IRM, Holter pendant une journée d’entraînement, épreuve d’effort (arythmies, réponse tensionnelle, obstruction), génétique. Réévaluation annuelle.</p>
<div class="lab">Positions (ESC 2020 et ESC 2023)</div><p>Activité d’intensité faible à modérée encouragée chez presque tous. Compétition intense envisageable dans la CMH à faible risque, sans obstruction ni arythmie d’effort, après décision partagée. CMAVD et porteurs de variants desmosomaux : pas de sport d’endurance ou de compétition intense. CMD et CMNDVG : décision selon la FEVG (au-delà de 45 % environ), l’absence d’arythmie d’effort et de fibrose étendue, et le génotype.</p>
<div class="lab">Dépistage de l’athlète</div><p>L’ECG de repos améliore la détection des cardiomyopathies chez le jeune athlète. Il s’interprète selon les critères internationaux (2017), qui séparent les modifications liées à l’entraînement (bradycardie sinusale, bloc auriculoventriculaire du premier degré, repolarisation précoce, critères isolés de voltage) des anomalies qui imposent une exploration (ondes T négatives latérales, ondes Q pathologiques, bloc de branche gauche, préexcitation, QT long).</p>
<div class="lab">Décision partagée</div><p>Le risque zéro n’existe pas ; le patient informé participe à la décision, qui est documentée.</p></template>

<template data-pop="i42-conduite" data-title="Aptitude à la conduite">
<div class="lab">Principes</div><p>L’aptitude dépend du risque de perte de connaissance au volant. Les repères ci-dessous proviennent du consensus européen de l’EHRA (2017) ; en Suisse, le médecin applique les directives de la Société suisse de cardiologie et celles de la médecine du trafic.</p>
<div class="lab">Conduite privée</div><p>Défibrillateur en prévention primaire : interruption de quelques semaines après l’implantation (environ 1 à 4 semaines). Prévention secondaire ou choc approprié : interruption d’environ 3 mois. Syncope arythmique non traitée : pas de conduite jusqu’au traitement.</p>
<div class="lab">Conduite professionnelle</div><p>En règle générale incompatible avec un défibrillateur implanté en prévention secondaire ; décision individuelle très restrictive en prévention primaire.</p>
<div class="lab">Devoir du médecin</div><p>Informer le patient et documenter l’information dans le dossier.</p></template>
