<template data-pop="e42-hemato" data-title="Hématologie de la malnutrition protéino-énergétique : étude turque"><h3>Population</h3><p>34 enfants de 3 à 20 mois en Turquie, dont 10 atteints de kwashiorkor-marasme (Özkale et Sipahi, 2013).</p><table class="t"><tr><th>Paramètre</th><th>Résultat</th></tr><tr><td>Anémie</td><td>97 %</td></tr><tr><td>Fer sérique bas</td><td>67,6 %</td></tr><tr><td>Saturation de la transferrine basse</td><td>76,4 %</td></tr><tr><td>Ferritine basse</td><td>20,5 %</td></tr><tr><td>Vitamine B12 et folates</td><td>Normaux</td></tr><tr><td>Hypoplasie érythroïde médullaire</td><td>30 % dans le groupe mixte</td></tr><tr><td>Fer médullaire absent</td><td>58,8 %</td></tr></table><p>La ferritine est basse chez une minorité d’enfants alors que le fer sérique et la saturation le sont chez la majorité ; les sources lues ne permettent pas d’expliquer cet écart. Le petit effectif et le caractère de résumé limitent la portée. Chez l’adulte, le consensus suisse suspend le fer pendant la première semaine de renutrition.</p></template>
<template data-pop="e42-zinc" data-title="Zinc sérique dans le kwashiorkor-marasme"><h3>Étude du Bangladesh</h3><p>Sur 68 enfants, le zinc sérique du groupe kwashiorkor-marasme était de 60,63 ± 8,04 µg/dL contre 106,16 ± 13,36 chez les témoins (p inférieur à 0,001). La sélection des enfants s’appuyait sur des courbes de croissance américaines. Les sources lues ne fournissent pas de seuil de supplémentation.</p></template>
<template data-pop="e42-d-f75" data-title="F-75 : préparation thérapeutique de stabilisation"><h3>Composition et rôle</h3><p>Le F-75 apporte 75 kcal et 0,9 g de protéines pour 100 mL. Il sert à l’alimentation de la phase de stabilisation.</p><h3>Schéma (Dipasquale 2020)</h3><table class="t"><tr><th>Jours</th><th>Fréquence</th><th>Volume par repas</th></tr><tr><td>1–2</td><td>Toutes les 2 heures</td><td>11 mL/kg</td></tr><tr><td>3–5</td><td>Toutes les 3 heures</td><td>16 mL/kg</td></tr><tr><td>6–7</td><td>Toutes les 4 heures</td><td>22 mL/kg</td></tr></table><p>L’apport total est de 130 mL/kg/jour. En cas d’intolérance, l’OMS 2023 juge les preuves insuffisantes pour passer à des formules hydrolysées. Le statut d’enregistrement suisse du produit n’a pas été vérifié ; aucune information professionnelle suisse n’a été lue.</p></template>
<template data-pop="e42-d-f100" data-title="F-100 : préparation thérapeutique de rattrapage"><h3>Composition et objectifs</h3><p>Le F-100 apporte 100 kcal et 2,9 g de protéines pour 100 mL. L’apport de rattrapage dépasse 150 kcal/kg/jour et le gain pondéral visé dépasse 10 g/kg/jour (Dipasquale 2020).</p><p>Dans la forme mixte, ce gain brut doit être interprété avec l’évolution de l’œdème : la fonte de l’œdème fait baisser le poids avant que le gain tissulaire ne le fasse remonter. Le statut d’enregistrement suisse n’a pas été vérifié.</p></template>
<template data-pop="e42-d-resomal" data-title="ReSoMal : réhydratation de la malnutrition"><h3>Place</h3><p>L’OMS 2023 préfère la ReSoMal, solution de réhydratation pour la malnutrition, en l’absence de choc ; à défaut, une solution de réhydratation orale à basse osmolarité.</p><h3>Schéma (Dipasquale 2020)</h3><p>5 mL/kg toutes les 30 minutes pendant 2 heures, puis 5 à 10 mL/kg par heure en alternance avec le F-75 jusqu’à 10 heures.</p><div class="trap"><span class="k">Piège</span> La classification de l’hydratation est difficile dans la malnutrition œdémateuse, car déshydratation et surcharge se confondent ; la réévaluer fréquemment. Le statut suisse du produit n’a pas été vérifié.</div></template>
<template data-pop="e42-d-atpe" data-title="Aliment thérapeutique prêt à l’emploi en ambulatoire"><h3>Posologie (OMS 2023)</h3><p>150 à 185 kcal/kg/jour jusqu’à la récupération anthropométrique et la résolution de l’œdème, ou jusqu’à ce que l’enfant ne soit plus sévèrement émacié et sans œdème, puis 100 à 130 kcal/kg/jour. Pour la forme mixte, la double condition (émaciation et œdème) s’applique pleinement.</p><p>Le statut d’enregistrement suisse du produit n’a pas été vérifié.</p></template>
<template data-pop="e42-d-amox" data-title="Amoxicilline : schéma OMS et information professionnelle suisse"><h3>Mécanisme et preuve</h3><p>L’amoxicilline est une pénicilline à large spectre. Dans la malnutrition sévère, les auteurs de l’étude zambienne de Nchelenge qualifient l’antibiothérapie à large spectre systématique, indépendamment des signes d’infection, de « probablement la mesure isolée la plus efficace ». Un essai au Malawi, dans une zone à forte prévalence de kwashiorkor, a observé une réduction de la mortalité de 36 % avec l’amoxicilline et de 44 % avec le céfdinir (Bhutta 2017).</p><h3>Posologie</h3><table class="t"><tr><th>Source</th><th>Posologie</th></tr><tr><td>Dipasquale 2020 (cas non compliqué)</td><td>15 mg/kg toutes les 8 heures pendant 5 jours, soit 45 mg/kg/jour</td></tr><tr><td>Information professionnelle suisse, Amoxicilline Spirig, mise à jour août 2024</td><td>Enfant de 40 kg ou moins : 50 à 100 mg/kg/jour en 3 ou 4 prises ; maximum 2000 mg/jour ; dose unitaire maximale 50 mg/kg</td></tr></table><p>La dose OMS est sous la fourchette de l’information professionnelle suisse, qui ne comporte pas d’indication spécifique de malnutrition. La leçon signale cet écart sans l’arbitrer.</p><h3>Effets indésirables et précautions</h3><p>L’information professionnelle mentionne l’entérocolite médicamenteuse induite, rapportée surtout chez l’enfant. Chez l’enfant de 40 kg ou moins en insuffisance rénale, elle oriente vers une forme parentérale. Les contre-indications détaillées et la surveillance n’ont pas été reproduites ici.</p><p class="src">Références : information professionnelle suisse (Swissmedic) ; <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.1093/tropej/44.4.211" target="_blank" rel="noopener">Gernaat 1998</a>.</p></template>
<template data-pop="e42-d-thiamine" data-title="Thiamine : information suisse et consensus de renutrition"><h3>Place</h3><p>Le consensus suisse de renutrition (adulte) prescrit 200 à 300 mg de thiamine au moins 30 minutes avant la renutrition, par voie intraveineuse ou orale, pendant 3 jours.</p><h3>Information professionnelle suisse (Benerva®, avril 2019)</h3><p>Indications : carences par apport insuffisant, besoins accrus ou malabsorption. Posologie : 100 mg/jour par voie orale pour des symptômes modérés ; dans les formes graves, la voie parentérale est employée d’abord. L’usage pédiatrique n’a pas été étudié systématiquement et aucune posologie de prévention du syndrome de renutrition n’est fournie.</p><div class="trap"><span class="k">Piège</span> La dose de 200 à 300 mg vient du consensus, non de l’information professionnelle. Pour l’enfant, les sources lues se bornent à recommander la supplémentation en thiamine sans dose.</div></template>
<template data-pop="e42-d-glycophos" data-title="Glycérophosphate de sodium (Glycophos®)"><h3>Information professionnelle suisse (avril 2024)</h3><table class="t"><tr><th>Élément</th><th>Contenu</th></tr><tr><td>Nature</td><td>Additif de nutrition parentérale</td></tr><tr><td>Adulte</td><td>10 à 20 mmol/jour</td></tr><tr><td>Nouveau-nés et enfants</td><td>1,0 à 1,5 mmol/kg/jour</td></tr><tr><td>Administration</td><td>Perfusion d’au moins 8 heures ; jamais non dilué</td></tr><tr><td>Sodium</td><td>40 mmol de sodium pour 20 mmol de glycérophosphate : à compter dans la restriction sodée</td></tr><tr><td>Phosphatémie normale de l’adulte</td><td>0,7 à 1,4 mmol/L</td></tr></table><p>Ce produit est un additif de nutrition parentérale seulement ; les sources lues ne le recommandent pas spécifiquement pour la forme mixte.</p></template>
<template data-pop="e42-mnemo" data-title="Moyen mnémotechnique : ordre des gestes (aide pédagogique, non critère officiel)"><h3>Quatre mots pour l’ordre des décisions</h3><p><b>Danger, godet, mesure, code.</b> Chercher d’abord les signes de danger ; rechercher le godet aux deux pieds ; mesurer le périmètre brachial ; puis seulement choisir le code (E40, E41, E42 ou E43).</p><p>Cette formule est une <b>aide pédagogique, non un critère officiel</b> ; elle ne figure dans aucune des sources lues.</p></template>
<template data-pop="pareto-e42-definition" data-title="Loi de Pareto — Définition, classifications et épidémiologie"><p class="ratio" data-cover="e42-1,e42-2,e42-3"></p><ul><li>E42 : œdème bilatéral au godet et émaciation sévère, ou forme intermédiaire.</li><li>OMS : œdème et/ou rapport poids/taille inférieur à −3 et/ou périmètre brachial inférieur à 115 mm.</li><li>L’œdème gonfle le poids : mesurer le périmètre brachial.</li><li>Seuils de Wellcome non lus ; fréquence très variable selon la série ; aucune donnée suisse.</li></ul></template>
<template data-pop="pareto-e42-physio" data-title="Loi de Pareto — Physiopathologie et causes"><p class="ratio" data-cover="e42-4,e42-5"></p><ul><li>Marasme : protéolyse maintenue, adaptation. Formes œdémateuses : protéolyse abaissée, glucose endogène réduit.</li><li>Cause de l’œdème indéterminée ; l’albumine corrèle mal avec lui.</li><li>Le kwashiorkor se greffe habituellement sur un marasme chronique.</li><li>Le virus de l’immunodéficience humaine aggrave la mortalité ; test de la sueur à répéter.</li></ul></template>
<template data-pop="pareto-e42-clinique" data-title="Loi de Pareto — Anamnèse, examen, diagnostic et urgences"><p class="ratio" data-cover="e42-6,e42-7,e42-8,e42-9"></p><ul><li>Quatre signes de danger : boire, vomir, convulsions, léthargie.</li><li>Godet bilatéral au dos du pied ; périmètre brachial.</li><li>Œdème seul E40 ; émaciation seule E41 ; les deux E42 ; non précisé E43.</li><li>Urgences : hypoglycémie, hypothermie, choc, déshydratation, infection, syndrome de renutrition.</li></ul></template>
<template data-pop="pareto-e42-prise" data-title="Loi de Pareto — Prise en charge"><p class="ratio" data-cover="e42-10,e42-11,e42-12"></p><ul><li>Hospitaliser pour signe de danger ou œdème +++.</li><li>F-75 puis F-100 ; ReSoMal sans choc ; antibiotiques systématiques.</li><li>Doser phosphate, potassium, magnésium chaque jour.</li><li>Ambulatoire : 150 à 185 kcal/kg/jour jusqu’à la fin de l’émaciation et de l’œdème.</li></ul></template>
<template data-pop="pareto-e42-suivi" data-title="Loi de Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="e42-13,e42-14,e42-15"></p><ul><li>Sortie : rapport poids/taille au moins −2, périmètre brachial au moins 125 mm, pas d’œdème, deux mesures.</li><li>Mortalité de la forme mixte : 28,0 % à Nchelenge, séries hétérogènes.</li><li>Extensions adultes : analogie, non définition de la CIM.</li></ul></template>
<template data-pop="pareto-e42-exam" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="e42-e-1,e42-e-2"></p><ul><li>Diagnostic clinique et anthropométrique ; pas de dosage confirmatoire.</li><li>Phosphate, potassium, magnésium : indiqués d’emblée.</li><li>Albumine : gravité, non mécanisme de l’œdème.</li></ul></template>
<template data-pop="pareto-e42-s-physio" data-title="Loi de Pareto — Physiologie"><p class="ratio" data-cover="e42-s-physio-body"></p><ul><li>Protéolyse maintenue : adaptation. Protéolyse abaissée : forme œdémateuse.</li><li>Origine de l’œdème : indéterminée.</li></ul></template>
<template data-pop="pareto-e42-s-bioc" data-title="Loi de Pareto — Biochimie"><p class="ratio" data-cover="e42-s-bioc-body"></p><ul><li>Insuline : potassium, magnésium, phosphate entrent dans les cellules.</li><li>Phosphate : 0,91 puis 0,63 mmol/L au deuxième jour.</li></ul></template>
<template data-pop="pareto-e42-s-histo" data-title="Loi de Pareto — Histologie et immunité"><p class="ratio" data-cover="e42-s-histo-body"></p><ul><li>Protéoglycanes duodénaux réduits dans le kwashiorkor ; groupe mixte n = 8.</li><li>Immunité altérée, vaccins oraux moins efficaces.</li></ul></template>
<template data-pop="pareto-e42-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="e42-p-1,e42-p-2,e42-p-3,e42-p-4,e42-p-5"></p><ul><li>Nutrition par étapes ; antibiotiques systématiques ; thiamine et électrolytes.</li><li>Amoxicilline : écart entre OMS et information suisse.</li><li>Paliers chiffrés de renutrition : adultes seulement.</li></ul></template>
