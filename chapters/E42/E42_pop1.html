<template data-pop="e42-oms-def" data-title="OMS 2023 : définition de la malnutrition aiguë sévère"><h3>Ce que définit la directive</h3><p>La directive de l’Organisation mondiale de la Santé sur la prévention et la prise en charge de l’émaciation et de l’œdème nutritionnel (malnutrition aiguë) chez le nourrisson et l’enfant de moins de 5 ans a été publiée fin 2023 (version 1.2 du 20.11.2023). Elle est internationale et non américaine. Le fichier lu est une version générée automatiquement, que l’éditeur signale comme non vérifiée par l’OMS.</p><table class="t"><tr><th>Critère</th><th>Seuil ou description</th><th>Population</th></tr><tr><td>Œdème nutritionnel</td><td>Bilatéral, prenant le godet, débutant aux pieds, pouvant gagner les jambes puis le reste du corps, visage compris ; pathognomonique</td><td>Moins de 5 ans</td></tr><tr><td>Rapport poids/taille (ou poids/longueur)</td><td>Inférieur à −3 écarts-types</td><td>Moins de 5 ans</td></tr><tr><td>Périmètre brachial</td><td>Inférieur à 115 mm</td><td>6 à 59 mois</td></tr></table><p>La malnutrition aiguë sévère est définie par l’œdème <b>et/ou</b> l’un des deux critères anthropométriques. L’OMS ne nomme pas le kwashiorkor-marasme et parle d’émaciation sévère et/ou d’œdème nutritionnel. Le « et/ou » couvre la situation de E42 : un enfant qui présente à la fois l’œdème et l’émaciation sévère.</p><p>Une limite pratique s’ajoute : la directive vise surtout les enfants de 6 à 59 mois ; les nourrissons de moins de 6 mois sont traités dans une section distincte dont les volumes n’ont pas été lus ici.</p><p class="src">Référence : <a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>.</p></template>
<template data-pop="e42-pb" data-title="Périmètre brachial : technique et seuils"><h3>Ce que mesure le périmètre brachial</h3><p>Le périmètre brachial est la circonférence du bras. Selon la directive de l’OMS 2023, un périmètre brachial inférieur à 115 mm entre 6 et 59 mois définit l’émaciation sévère ; la sortie de traitement suppose au moins 125 mm à deux mesures consécutives.</p><p>Son intérêt dans la forme mixte tient à ce qu’il est moins sensible que le poids à l’eau retenue par l’œdème. Bhutta et collègues (2017) relèvent que le périmètre brachial non ajusté est plus discriminant que le rapport poids/taille pour prédire la mortalité, alors que le rapport poids/taille est le moins bon prédicteur.</p><div class="trap"><span class="k">Piège</span> Les sources lues ne détaillent pas la technique de mesure (point de mesure, position du bras) : ces éléments ne sont pas reproduits ici et doivent être pris dans le protocole du service.</div></template>
<template data-pop="e42-nosologie" data-title="CIM-10-GM : bloc E40–E46, place de E42"><h3>Structure du bloc</h3><p>Le bloc E40–E46 regroupe la malnutrition. E40 désigne le kwashiorkor, E41 le marasme nutritionnel, E42 le kwashiorkor avec marasme, E43 la malnutrition protéino-énergétique grave sans précision. La note du bloc précise que le degré se juge d’ordinaire sur le poids en écarts-types de la population de référence : grave à partir de 3 écarts-types, modéré de 2 à moins de 3, léger de 1 à moins de 2. Une mesure unique rend le diagnostic provisoire. Sans poids, on se fonde sur la clinique.</p><p>La note de la version allemande à propos de E42 : malnutrition protéino-énergétique grave, au sens de E43, sous forme intermédiaire ou avec signes simultanés de kwashiorkor et de marasme. E40 et E41 excluent explicitement le kwashiorkor-marasme (renvoi vers E42). E43 inclut l’« œdème de famine » et s’emploie pour la perte de poids sévère ou l’absence de prise de poids avec une valeur d’au moins 3 écarts-types sous la moyenne.</p><p>Les codes sont ceux de la CIM-10-GM 2024. La cartographie vers la CIM-11 n’a pas été établie : l’Organisation mondiale de la Santé cite des entités d’émaciation (code 5B51) et de malnutrition aiguë (5B52), mais la correspondance exacte de E42 n’a pas été vérifiée.</p></template>
<template data-pop="e42-taxonomies" data-title="Deux taxonomies : Bhutta, OMS et CIM"><h3>Pourquoi les mots changent selon la source</h3><table class="t"><tr><th>Source</th><th>Émaciation sévère</th><th>Kwashiorkor</th><th>Place de la forme mixte</th></tr><tr><td>Bhutta 2017</td><td>Rapport poids/taille inférieur à −3 ou périmètre brachial inférieur à 115 mm <b>en l’absence d’œdème</b></td><td>Œdème nutritionnel, quelle que soit l’anthropométrie</td><td>Incluse dans « kwashiorkor » (enfant œdémateux)</td></tr><tr><td>OMS 2023</td><td>Critères anthropométriques seuls</td><td>Œdème nutritionnel, « et/ou »</td><td>Non nommée ; couverte par le « et/ou »</td></tr><tr><td>CIM-10-GM 2024</td><td>E41 : sans œdème</td><td>E40 : œdème sans émaciation franche</td><td>E42 isolée</td></tr></table><p>Pour un énoncé d’examen, la première étape consiste à repérer la taxonomie employée. Pour le codage, la CIM-10-GM prévaut.</p></template>
<template data-pop="e42-wellcome" data-title="Classification de Wellcome : ce qui est lu"><h3>Usage dans la littérature</h3><p>La classification de Wellcome sert à typer le marasme, le kwashiorkor et le kwashiorkor-marasme. En Jamaïque (1962–1992), elle a réparti 1149 enfants en 391 kwashiorkors, 383 marasmes et 375 kwashiorkors-marasmes. En Zambie, une version modifiée a été employée pour typer les enfants de Nchelenge.</p><h3>Limite démontrée</h3><p>Dans une cohorte zambienne de 538 enfants de moins de 5 ans, la classification de Wellcome donnait 54,3 % de faux négatifs en présence d’œdème. Le diagnostic clinique de l’émaciation sous œdème produisait 44,7 % de faux positifs et 41,4 % de faux négatifs. L’œdème gonfle le poids et masque l’émaciation.</p><div class="trap"><span class="k">Lacune</span> Les seuils chiffrés de Wellcome, de Gomez et de Waterlow, exprimés en pourcentage du poids attendu, n’ont pas été lus dans une source primaire. Aucun pourcentage n’est donné.</div></template>
<template data-pop="e42-oedeme-grades" data-title="Gradation de l’œdème : deux systèmes divergents"><h3>Ce que disent deux sources</h3><table class="t"><tr><th>Source</th><th>Gradation</th></tr><tr><td>Bhutta 2017</td><td>1+ : pieds et bas des jambes ; 2+ : bras ; 3+ : visage</td></tr><tr><td>Dipasquale 2020</td><td>Grade I : pédieux ; II : facial ; III : paravertébral et thoracique ; IV : ascite</td></tr></table><p>Les deux gradations ne se superposent pas : l’ordre des territoires et le nombre de niveaux diffèrent. L’OMS 2023 emploie « œdème nutritionnel sévère (+++) » comme critère d’hospitalisation, sans que la définition de « + », « ++ » et « +++ » ait été lue dans cette leçon. Aucune de ces gradations n’est propre à E42.</p><div class="trap"><span class="k">Piège</span> Ne pas mélanger les échelles dans un même dossier : préciser quelle gradation est utilisée.</div></template>
<template data-pop="e42-prenatal" data-title="Poids de naissance et modèle d’adaptation prédictive"><h3>L’observation jamaïcaine</h3><p>Dans une série de 1149 enfants hospitalisés en Jamaïque entre 1962 et 1992, le poids de naissance, rapporté par la mère, était plus élevé de 333 g (intervalle de confiance à 95 % de 217 à 449 g) chez ceux qui ont développé un kwashiorkor que chez ceux qui ont développé un marasme. Les auteurs l’interprètent comme un argument pour un modèle d’adaptation prédictive : des facteurs prénatals contribueraient à l’émergence du kwashiorkor ou du marasme.</p><div class="trap"><span class="k">Limites</span> Le poids de naissance est rapporté de mémoire par la mère. Le résumé lu ne donne pas la valeur du groupe mixte. Une association ne démontre pas une cause.</div></template>
<template data-pop="e42-adulte" data-title="Phénotype « kwashiorkor-marasme » chez l’adulte"><h3>Une définition opérationnelle</h3><p>Dans la cohorte japonaise de Sato et collègues (2024), 2308 adultes insuffisants cardiaques ont été classés selon leur indice de masse corporelle et leur albumine. La catégorie « kwashiorkor-marasme » correspond à un indice inférieur à 18,5 kg/m² <b>et</b> une albumine inférieure à 3,4 g/dL. Elle concernait 4,8 % des patients et avait le pire pronostic : rapport de risque de 2,313 pour la mortalité toutes causes, de 3,001 pour la mortalité cardiaque.</p><div class="trap"><span class="k">Piège</span> Cette définition est propre à l’étude. Elle n’est pas la définition de la CIM, qui est pédiatrique, et ne permet pas de diagnostiquer E42 chez l’adulte.</div></template>
<template data-pop="e42-methionine" data-title="Métabolisme monocarboné : étude du Malawi"><h3>Résultats</h3><table class="t"><tr><th>Groupe</th><th>Diméthylarginine asymétrique (µmol/L)</th><th>Cystéine (µmol/L)</th></tr><tr><td>Kwashiorkor-marasme</td><td>0,549</td><td>90</td></tr><tr><td>Kwashiorkor</td><td>0,557</td><td>115</td></tr><tr><td>Marasme</td><td>0,698</td><td>153</td></tr></table><p>Ces produits du métabolisme monocarboné sont corrélés à la méthionine, d’où l’hypothèse d’un déficit en méthionine dans les formes œdémateuses.</p><div class="trap"><span class="k">Limites</span> Étude transversale sur résumé ; l’hypothèse n’est pas démontrée et n’a pas de traduction thérapeutique dans les sources lues.</div></template>
<template data-pop="e42-intestin" data-title="Épithélium duodénal et protéoglycanes"><h3>Observation</h3><p>Dans l’étude zambienne de 41 enfants, la production de glycosaminoglycanes sulfatés et de protéoglycanes à héparane-sulfate de l’épithélium duodénal était réduite dans le kwashiorkor et non dans le marasme. L’inflammation était plus marquée dans le marasme. Le groupe mixte comptait huit enfants ; le résumé ne détaille pas ses résultats, il ne faut donc pas extrapoler.</p><p>Les auteurs discutent une entéropathie exsudative par perte de ces protéoglycanes comme mécanisme possible du kwashiorkor ; cette hypothèse n’est pas démontrée pour la forme mixte.</p></template>
<template data-pop="e42-immunite" data-title="Immunité dans les formes œdémateuses"><h3>Synthèse de la revue</h3><p>Selon la revue de Michael et collègues (2022), le kwashiorkor et le kwashiorkor-marasme associent : des protéines et un catabolisme protéique abaissés, des micronutriments altérés, un stress oxydatif non contrôlé, l’épuisement des commensaux anaérobies et la prolifération de bactéries pathogènes potentielles. Ces éléments entraînent une immunité profondément altérée, une barrière intestinale compromise, des carences secondaires en micronutriments, un retard de croissance et une moindre efficacité des vaccins oraux.</p><div class="trap"><span class="k">Limites</span> Résumé seul ; l’origine des pourcentages de répartition cités par la revue n’a pas été vérifiée.</div></template>
<template data-pop="e42-aflatoxines" data-title="Aflatoxines : hypothèse débattue"><h3>Ce que montre la revue de portée</h3><p>Une revue de portée de 2020 retrouve plus fréquemment des aflatoxines dans les tissus et liquides des enfants atteints de kwashiorkor que dans le kwashiorkor-marasme et le marasme. Les auteurs ne concluent pas à une cause. Le lien causal n’est pas établi et ne doit pas être enseigné comme un fait.</p></template>
<template data-pop="e42-albumine" data-title="Albumine et œdème : une corrélation faible"><h3>Ce que disent les sources</h3><p>Bhutta et collègues (2017) rapportent que l’hypoalbuminémie corrèle mal avec le degré d’œdème et avec la vitesse de sa résolution, et que l’étiologie de l’œdème est indéterminée. Dipasquale et collègues (2020) citent l’albumine, la préalbumine (transthyrétine) et la protéine liant le rétinol comme marqueurs de l’état protéique, avec deux précisions : les protéines totales ne sont interprétables que si les globulines sont normales, et des mesures sériées sont plus informatives qu’une valeur isolée.</p><div class="trap"><span class="k">Erreur fréquente</span> Perfuser de l’albumine pour « corriger l’œdème » repose sur une hypothèse que les sources lues ne soutiennent pas. Cette leçon ne contient aucune recommandation de perfusion d’albumine.</div></template>
<template data-pop="e42-sueur" data-title="Test de la sueur dans la malnutrition"><h3>Observation</h3><p>Dans une étude de 90 enfants atteints de malnutrition protéino-énergétique primaire et de 30 témoins, le test de la sueur était faussement élevé chez 6,7 % des malnutris, et chez 20 % des cas de troisième degré, y compris chez des enfants avec kwashiorkor-marasme. Il se normalisait après renutrition.</p><p>Conduite : un test élevé en phase aiguë se répète après la renutrition avant de conclure à une mucoviscidose.</p></template>
<template data-pop="e42-pcime" data-title="Signes de danger de la prise en charge intégrée"><h3>Les quatre signes</h3><ul><li>Incapacité à boire ou à téter</li><li>Vomissement de tout ce qui est ingéré</li><li>Convulsions</li><li>Léthargie ou inconscience</li></ul><p>La directive de l’OMS 2023 retient la présence d’au moins un de ces signes parmi les critères d’hospitalisation. Le transfert vers l’ambulatoire suppose leur absence depuis 24 à 48 heures.</p></template>
<template data-pop="e42-godet" data-title="Œdème au godet : technique et valeur"><h3>Geste</h3><p>Une pression ferme est exercée sur le dos du pied (troisième et quatrième tarsiens selon Bhutta et collègues). Le godet est l’empreinte laissée par le doigt. L’œdème nutritionnel est bilatéral, débute aux pieds et peut s’étendre aux jambes, aux bras puis au visage.</p><h3>Valeur</h3><p>L’OMS 2023 qualifie l’œdème nutritionnel de pathognomonique de la malnutrition aiguë sévère. La durée de pression et le délai de lecture ne sont pas précisés dans les sources lues.</p><div class="trap"><span class="k">Piège</span> Un œdème unilatéral n’est pas nutritionnel et oriente vers une autre cause.</div></template>
<template data-pop="e42-phosphate" data-title="Phosphate chez l’enfant œdémateux : étude de Nairobi"><h3>Population et méthode</h3><p>165 enfants de moins de 5 ans atteints de kwashiorkor (107, soit 64 %) ou de kwashiorkor-marasme (58, soit 36 %), à Nairobi. L’hypophosphatémie est définie par un taux inférieur à 1,20 mmol/L.</p><table class="t"><tr><th>Moment</th><th>Proportion d’hypophosphatémie</th><th>Phosphate moyen (mmol/L)</th></tr><tr><td>Admission</td><td>86 %</td><td>0,91</td></tr><tr><td>Jour 1</td><td>90 %</td><td>0,67</td></tr><tr><td>Jour 2</td><td>93 %</td><td>0,63 (nadir)</td></tr><tr><td>Jour 4</td><td>–</td><td>0,75</td></tr></table><p>La mortalité était de 0 %, 8 %, 14 % et 21 % selon que le nadir était normal, léger, modéré ou sévère (p = 0,028). Une tendance existait pour la dermatose et l’hypomagnésémie.</p><div class="trap"><span class="k">Limites</span> Résumé tronqué en fin de texte ; étude d’observation . L’étude conduit à doser phosphate, potassium et magnésium à l’admission puis chaque jour durant les premiers jours.</div></template>
<template data-pop="e42-renutrition" data-title="Syndrome de renutrition : mécanisme et prévention"><h3>Mécanisme</h3><p>Dipasquale et collègues (2020) décrivent la décharge d’insuline provoquée par l’alimentation : le potassium, le magnésium et le phosphate entrent dans les cellules, avec insuffisance cardiaque, tachycardie et faiblesse musculaire. Dans la forme mixte, la chute du phosphate aux jours 1 et 2 en est la démonstration indirecte (étude de Nairobi).</p><h3>Prévention</h3><ul><li>Éviter l’apport glucidique rapide.</li><li>Supplémenter le phosphate et la thiamine.</li><li>Surveiller les électrolytes.</li></ul><p>Pour l’adulte hospitalisé, le consensus suisse de renutrition fournit des repères chiffrés détaillés en pharmacologie. Il précise aussi que la phase vulnérable dure jusqu’à 10 jours.</p></template>
<template data-pop="e42-reber" data-title="Consensus suisse de renutrition (Reber 2019)"><h3>Source et population</h3><p>Reber, Friedli, Vasiloglou, Schuetz et Stanga (Berne, Aarau, Bâle) ont publié en 2019 un consensus sur la prise en charge du syndrome de renutrition chez les adultes hospitalisés en médecine. La population n’est pas pédiatrique.</p><table class="t"><tr><th>Domaine</th><th>Repère</th></tr><tr><td>Énergie initiale</td><td>5 à 15 kcal/kg/jour (10–15 standard ; 5 si risque élevé), objectif en 5 à 10 jours</td></tr><tr><td>Répartition</td><td>Glucides 40–60 %, lipides 30–40 %, protéines 15–20 %</td></tr><tr><td>Thiamine</td><td>200 à 300 mg au moins 30 minutes avant la renutrition, pendant 3 jours</td></tr><tr><td>Vitamines et oligoéléments</td><td>200 % et 100 % des apports recommandés, environ 10 jours</td></tr><tr><td>Fer</td><td>Suspendu la première semaine</td></tr><tr><td>Sodium et liquides</td><td>Sodium moins de 1 mmol/kg/jour ; liquides 20–30 mL/kg/jour, bilan nul ; poids quotidien</td></tr></table><p>Les paliers de phosphate, de potassium et de magnésium figurent dans l’onglet de pharmacologie.</p></template>
<template data-pop="e42-sortie" data-title="Admission, transfert et sortie selon l’OMS 2023"><h3>Trois décisions</h3><table class="t"><tr><th>Décision</th><th>Critères</th><th>Force de la recommandation</th></tr><tr><td>Hospitaliser</td><td>Signe de danger, problème médical aigu, œdème sévère (+++), échec du test d’appétit</td><td>Conditionnelle, faible</td></tr><tr><td>Passer à l’ambulatoire</td><td>Sans signe de danger depuis 24–48 h, problème résolu, œdème plus +++ et en régression, bon appétit ; décision non anthropométrique</td><td>Forte, certitude modérée</td></tr><tr><td>Sortir du traitement</td><td>Rapport poids/taille au moins −2 écarts-types et périmètre brachial au moins 125 mm, deux mesures consécutives ; pas d’œdème, deux mesures consécutives</td><td>Conditionnelle, certitude très faible</td></tr></table><div class="trap"><span class="k">Piège</span> Le critère de perte de poids persistante ne s’applique pas aux enfants œdémateux.</div></template>
