<template data-pop="e42-aliments" data-title="Aliments thérapeutiques : phase et quantité"><table class="t" data-e42-table="1"><thead><tr><th>Produit et phase</th><th>Composition ou apport source</th><th>Population et limite</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-75</a>, stabilisation</td><td>75 kcal et 0,9 g de protéines pour 100 ml.</td><td>Volume prescrit selon état et protocole ; pas 130 ml/kg/j universel en œdème sévère.</td></tr><tr><td><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-100</a>, réhabilitation</td><td>100 kcal et 2,9 g de protéines pour 100 ml.</td><td>Après stabilisation ; moins 6 mois avec œdème/instabilité, pas à pleine concentration.</td></tr><tr><td>Transition hospitalière vers aliment prêt à l’emploi</td><td>100–135 kcal/kg/j, transition de 2–3 jours selon tolérance.</td><td>Recommandation <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> maintenue, distincte du rattrapage ambulatoire.</td></tr><tr><td>Aliment thérapeutique prêt à l’emploi, 6–59 mois ambulatoires</td><td>150–185 kcal/kg/j jusqu’à récupération ; ou réduction 100–130 après disparition émaciation sévère/œdème, jusqu’à récupération.</td><td>Deux options, décision du programme et du suivi ; pas réduction obligatoire après guérison.</td></tr></tbody></table>
<p>Les deux options ambulatoires de l’<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> 2023 ne sont pas une réduction obligatoire après guérison. Choix du programme, tolérance, sécurité alimentaire et suivi comptent ; avant six mois, la stratégie est distincte [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
</template>
<template data-pop="e42-f75" data-title="F-75 : stabilisation et population"><p><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-75</a> contient 75 kcal et 0,9 g de protéines pour 100 ml. C’est un lait thérapeutique de stabilisation, pas une préparation maison à concentrer ni une prescription identique pour tout œdème. Volume, prises, eau et autres apports sont ajustés au protocole, à l’âge et à l’état. Chez le nourrisson de moins six mois avec œdème, l’<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> décrit <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-75</a> ou formule infantile comme complément au lait maternel, avec soutien de l’allaitement [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
</template>
<template data-pop="e42-f100" data-title="F-100 : réhabilitation et précaution avant six mois"><p><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-100</a> contient 100 kcal et 2,9 g de protéines pour 100 ml. Son rôle est différent de celui de <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-75</a>. L’<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> demande de ne pas utiliser <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">F-100</a> à pleine concentration chez le nourrisson de moins de six mois instable, déshydraté, diarrhéique ou avec œdème nutritionnel, notamment à cause de la charge rénale et du risque hypernatrémique. Ce produit n’est pas interchangeable avec un lait initial au même volume [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
</template>
<template data-pop="e42-resomal" data-title="Réhydratation : solution, voie et limites"><table class="t" data-e42-table="1"><thead><tr><th>Source / situation</th><th>Choix décrit</th><th>Ce qu’il faut éviter</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> 2023,6–59 mois sévères déshydratés sans choc</td><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a> préféré ; solution orale de faible osmolarité si indisponible.</td><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a> à domicile ou débit sans surveillance.</td></tr><tr><td>Choléra suspecté ou diarrhée aqueuse profuse</td><td>Solution <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> standard de faible osmolarité, préparée normalement.</td><td>Dilution supplémentaire ou remplacement automatique par <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a>.</td></tr><tr><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> 2022, sachet <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a></td><td>84 g dans 2 litres d’eau propre bouillie et refroidie ; utiliser solution dans 24 h.</td><td>Concentrer le sachet, injecter la solution, mélanger les quantités avec un autre produit.</td></tr><tr><td>Déshydratation grave / choc / intolérance</td><td>Évaluation et protocole hospitalier selon perfusion, pertes, voie tolérée et surveillance.</td><td>Interdire toute perfusion ou appliquer à tous un volume d’essai clinique.</td></tr></tbody></table>
<p><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">ReSoMal</a> sous surveillance en structure, pas par famille à domicile selon <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> 2023. Le choix de solution, la vitesse, la perfusion et la surveillance forment une stratégie complète ; les volumes de différents protocoles ne sont pas additionnés [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/EssDr/english/resomal-rehydration-solution-for-malnutrition-oral-16684569.html" target="_blank" rel="noopener">S5</a>].</p>
</template>
<template data-pop="e42-amoxicilline" data-title="Amoxicilline : formulation suisse et protocole"><table class="t" data-e42-table="1"><thead><tr><th>Référence / population</th><th>Dose et rythme</th><th>Limite</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> février 2024, 6–59 mois, routine nutritionnelle sans infection spécifique</td><td>50 mg/kg par prise, max 1 g, deux fois par jour pendant 5–7 jours, voie orale.</td><td>Protocole de programme, pas traitement de tout sepsis ni fréquence de FI suisse.</td></tr><tr><td>FI axapharm suspension octobre 2024, enfant ≤ 40 kg</td><td>50–100 mg/kg/j en 3–4 prises ; maximum 2000 mg/j et 50 mg/kg par prise.</td><td>Pas indication spécifique <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ; volume 50 mg/ml après préparation.</td></tr><tr><td>Nouveau-né / prématuré, FI</td><td>Parentéral en règle du fait absorption incertaine ; oral au plus tôt dès 8 jours.</td><td>Pas application automatique du schéma 6–59 mois au nouveau-né.</td></tr><tr><td>Rein, enfant ≤ 40 kg</td><td>FI demande une forme parentérale en insuffisance rénale.</td><td>Ne pas inventer un intervalle oral infantile à partir du tableau adulte.</td></tr><tr><td>Rein, adulte/enfant > 40 kg</td><td>Clairance 10–30 ml/min : maximum 500 mg toutes 12 h ; &lt;  10 : maximum 500 mg toutes 24 h.</td><td>Ces plafonds ne sont pas une nouvelle dose <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ni un tableau de nourrisson.</td></tr></tbody></table>
<p>Produit lu : suspension axapharm 200 mg/4 ml, FI octobre 2024, pas comprimé dispersible. <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> 2024 et FI ont des fréquences différentes ; ne pas créer une fausse posologie composite. Rechercher allergie, diarrhée grave, réaction cutanée, interactions et fonction rénale ; agiter, conserver dix jours maximum après préparation. Sepsis ou absorption insuffisante demandent un autre parcours hospitalier [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680665530017" target="_blank" rel="noopener">S12</a>].</p>
</template>
<template data-pop="e42-thiamine" data-title="Thiamine : source et âge avant la dose"><table class="t" data-e42-table="1"><thead><tr><th>Population / indication</th><th>Repère réellement lu</th><th>Ce qui ne se transpose pas</th></tr></thead><tbody><tr><td>Consensus suisse 2019, adulte médical à risque de renutrition</td><td>Thiamine 200–300 mg au moins 30 min avant les apports planifiés ; suivi clinique et biologique.</td><td>Pas dose de nourrisson, pas raison de retarder correction d’une hypoglycémie urgente.</td></tr><tr><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva</a> FI avril 2019, adulte/adolescent dès 12 ans, prophylaxie</td><td>100 mg un jour sur deux par voie orale.</td><td>Pas protocole universel de prévention de renutrition pédiatrique.</td></tr><tr><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva</a>, carence modérée / grave orale</td><td>100 mg/j modérée ; 200–300 mg/j grave.</td><td>Ces schémas sont ceux de la FI, pas des prises à empiler.</td></tr><tr><td><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva</a>, grave carence parentérale</td><td>Jusqu’à 200 mg/j ; intramusculaire ou intraveineuse très lente, puis orale si possible.</td><td>300 mg oral ne signifie pas 300 mg intraveineux ; injection hospitalière avec surveillance.</td></tr><tr><td>Moins 12 ans</td><td>Utilisation/innocuité non systématiquement étudiées selon FI.</td><td>Ne pas fabriquer une dose infantile à partir des comprimés adultes.</td></tr></tbody></table>
<p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Benerva</a> : FI avril 2019, comprimés 100/300 mg et ampoule 100 mg/ml ; doses décrites adultes/adolescents dès 12 ans, usage pédiatrique non étudié systématiquement. Intraveineux très lent à l’hôpital, risque anaphylactoïde, voie orale préférée si possible. Ne pas transformer 200–300 mg oral ou consensus adulte en dose intraveineuse de nourrisson [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
</template>
<template data-pop="e42-godet" data-title="Œdème au godet et cause"><p>Un œdème prenant le godet garde une dépression après pression puis relâchement. L’examen recherche les deux pieds, la symétrie et l’extension ; l’aspect seul ne prouve pas une cause nutritionnelle. Le syndrome néphrotique peut donner un œdème déclive au godet, et une protéinurie doit être recherchée selon le contexte. Une dénutrition peut aussi coexister avec une maladie d’organe [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</p>
</template>
<template data-pop="e42-bras" data-title="Périmètre brachial : geste et seuil"><p>Chez l’enfant de six à cinquante-neuf mois, moins 115 mm indique une émaciation sévère selon l’<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a>. Mesurer au milieu du bras gauche relâché, ruban au contact sans comprimer. Ce n’est ni une mesure directe de toute masse musculaire ni un seuil identique avant six mois ou chez l’adulte. Reporter la méthode et interpréter avec œdème, croissance et état hydrique [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
</template>
<template data-pop="e42-sortie" data-title="Transfert et fin de traitement : règles distinctes"><table class="t" data-e42-table="1"><thead><tr><th>Décision</th><th><a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS</a> 2023,6–59 mois</th><th>Limite</th></tr></thead><tbody><tr><td>Transfert hospitalier vers ambulatoire</td><td>Amélioration, absence danger 24–48 h, problèmes aigus suffisamment résolus, appétit et œdème non+++en diminution, suivi organisé.</td><td>Pas décision fondée seulement sur un chiffre anthropométrique.</td></tr><tr><td>Fin du traitement nutritionnel</td><td>Poids/taille ou longueur ≥ −2 et bras ≥ 125 mm sur deux visites/mesures, absence d’œdème sur deux visites/mesures, orientations nécessaires faites.</td><td>Pas gain pondéral absolu ou pourcentage ; recommandation conditionnelle, certitude très faible.</td></tr><tr><td><a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">MSF</a> 2024, règle de programme</td><td>Poids/taille > −2 ou bras > 125, absence œdème sur au moins deux semaines, autres soins organisés.</td><td>Divergence conservée, pas transformation de « et » en « ou » ni de deux visites en deux semaines.</td></tr></tbody></table>
<p>Une récupération de poids ou la sortie de l’hôpital ne prouve pas la fin de tous les besoins de suivi [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
</template>
<template data-pop="e42-renutrition" data-title="Renutrition : mécanisme, population et prudence"><p>Le retour des glucides modifie les besoins et les mouvements de phosphate, potassium et magnésium, avec risque de déficit de thiamine et de rétention hydrosodée. Le consensus suisse 2019 concerne des adultes médicaux et exclut les troubles alimentaires ; ses 5–15 kcal/kg/j initiaux et 200–300 mg de thiamine avant ne sont pas des doses infantiles. Défaillance clinique et anomalies biologiques demandent réévaluation, sans retarder la correction urgente d’une hypoglycémie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">S13</a>].</p>
</template>
<template data-pop="e42-profiles" data-title="Formation suisse et situations cliniques"><p><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a> 2017 demande évaluation nutritionnelle, poids, œdème, croissance et alimentation dans l’enfance. Les compétences se travaillent par histoire, mesures, examen et décisions argumentées. Ce lien pédagogique ne constitue ni une correspondance officielle <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">CIM</a>–<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a> ni une question fédérale garantie. Les chiffres de bannière hérités de la coque ne sont pas certifiés par cette leçon [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
</template>
<template data-pop="e42-oms" data-title="OMS : cadre et population"><p>Organisation mondiale de la Santé. La directive 2023 porte sur l’émaciation et l’œdème nutritionnel chez les moins de cinq ans, avec recommandations spécifiques pour moins de six mois et six à cinquante-neuf mois. Les critères, les certitudes et les décisions de transfert/fin de traitement gardent leur contexte ; aucune dose adulte ou stratégie universelle de renutrition ne s’en déduit [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
</template>
<template data-pop="e42-semio" data-title="Sémiologie : signes, mesures et décision"><p>Relier fonte, œdème et état général, sans attribuer à tout godet une cause nutritionnelle. Rechercher danger, mesurer croissance et bras, puis explorer une autre cause si indiquée. Le premier onglet scientifique présente neuf sections reliant normal, mécanismes, signes, examen, interprétation, différentiels, urgence, limites et sources réellement lues [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
</template>
