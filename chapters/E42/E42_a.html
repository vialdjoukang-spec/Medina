ui s’entretiennent</a></li><li><a href="#e42-6">Anamnèse : reconstruire l’évolution sans culpabiliser</a></li><li><a href="#e42-7">Examen clinique : voir, mesurer et interpréter</a></li><li><a href="#e42-8">Urgences et complications : ne pas attendre la renutrition</a></li><li><a href="#e42-9">Diagnostic : confirmer les composantes et rechercher une autre cause</a></li><li><a href="#e42-10">Traitement nutritionnel : une progression guidée par l’état</a></li><li><a href="#e42-11">Médicaments et liquides : ne pas mélanger les protocoles</a></li><li><a href="#e42-12">Suivi, transfert et prévention des rechutes</a></li><li><a href="#e42-13">Âges particuliers et pratique suisse</a></li><li><a href="#e42-14">Critères utiles et pièges de raisonnement</a></li></ol></nav>
<div class="chap-body">
<section class="ilot" id="e42-1"><h2><span class="n">1</span>Un œdème qui masque la fonte</h2><p>Une enfant fictive de dix-huit mois arrive pour diarrhée et refus de manger. Ses pieds sont gonflés, mais les bras sont très fins et la courbe de croissance s’est infléchie. Son poids paraît moins inquiétant que son état : l’eau des œdèmes peut masquer une perte de tissus. Le premier enjeu est de repérer une urgence, puis de caractériser ensemble l’émaciation et l’œdème, sans conclure à une cause nutritionnelle sur le seul aspect [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Le kwashiorkor avec marasme associe les signes d’une forme œdémateuse et ceux d’une émaciation importante. On ne soigne pas deux maladies indépendantes l’une après l’autre : on évalue un enfant vulnérable dont les besoins nutritionnels, l’infection éventuelle, les pertes digestives et la perfusion doivent être pris en charge de façon coordonnée [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>En Suisse, <button class="w" data-k="e42-profiles">PROFILES</button> demande notamment d’évaluer l’état nutritionnel, une perte de poids, un œdème, une croissance insuffisante et les difficultés alimentaires de l’enfance. Le lien avec <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> est pédagogique ; ce n’est ni une correspondance officielle entre classification et objectif fédéral, ni une question d’examen garantie. La vignette est originale [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S16</a>].</p>
<div class="key"><b>À retenir.</b> L’œdème peut rendre la dénutrition moins visible. Chercher d’abord la gravité, puis mesurer et expliquer les deux composantes [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-1">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-2"><h2><span class="n">2</span>Définition, périmètre et classification</h2><p>Le libellé suisse local de la classification 2024 est « Kwashiorkor avec marasme ». <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> ne comporte pas de sous-code dans ce catalogue. Les notes allemandes incluent une malnutrition protéino-énergétique grave de forme intermédiaire ou présentant simultanément les signes du kwashiorkor et du marasme [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>].</p>
<table class="t" data-e42-table="1"><thead><tr><th>Catégorie</th><th>Ce qu’elle décrit</th><th>Prudence</th></tr></thead><tbody><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E40</a></td><td>Kwashiorkor : œdème nutritionnel et autres signes possibles.</td><td>Un poids proche de la moyenne n’est pas une condition obligatoire ; l’œdème ne dit pas seul s’il existe une fonte.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E41</a></td><td>Marasme nutritionnel avec émaciation.</td><td>La présence d’un œdème nutritionnel associé fait rechercher une forme mixte.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a></td><td>Signes simultanés ou forme intermédiaire.</td><td>Documenter les signes, les mesures et la cause ; pas de diagnostic sur albumine seule.</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E43</a></td><td>Malnutrition protéino-énergétique grave sans précision.</td><td>Ne remplace pas une forme mixte effectivement décrite ; comprend un œdème de famine non précisé.</td></tr></tbody></table>
<p>La terminologie actuelle de l’<button class="w" data-k="e42-oms">OMS</button> parle d’émaciation et/ou d’œdème nutritionnel. Chez les enfants de six à cinquante-neuf mois, une émaciation sévère correspond à un poids pour la taille ou la longueur inférieur à trois écarts-types sous la médiane, ou à un périmètre brachial inférieur à 115 mm. L’œdème nutritionnel bilatéral suffit aussi à classer une malnutrition aiguë sévère. Pour parler de la forme mixte, il faut reconnaître également l’émaciation [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<p>Le mot « aiguë » n’implique pas nécessairement un début récent : les facteurs causaux peuvent évoluer depuis longtemps. Retard statural, poids insuffisant pour l’âge, émaciation et œdème décrivent des dimensions différentes, parfois simultanées. Les notes générales de codage et les seuils de décision clinique gardent leurs objectifs propres [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<div class="key"><b>À retenir.</b> <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> désigne un tableau mixte documenté. Ni un œdème isolé, ni une albumine basse, ni le seul code ne suffisent à raconter la situation [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-2">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-3"><h2><span class="n">3</span>Épidémiologie : le bon indicateur et le bon dénominateur</h2><p>Aucune incidence suisse contemporaine de la forme mixte <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> n’est établie dans les lectures ciblées. Cela ne démontre pas son absence : une présentation rare peut être liée à une maladie digestive, à des difficultés alimentaires ou à une vulnérabilité sociale. Les fréquences de dénutrition hospitalière, d’émaciation mondiale et de kwashiorkor ne sont pas interchangeables [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">S15</a>].</p>
<p>Les estimations conjointes <a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">UNICEF</a>, <button class="w" data-k="e42-oms">OMS</button> et Banque mondiale publiées en 2025 décrivent pour 2024 environ 42,8 millions d’enfants de moins de cinq ans avec une émaciation, soit 6,6%, dont 12,2 millions avec une émaciation sévère. Ce sont des estimations de prévalence largement fondées sur des enquêtes, pas le nombre de tous les épisodes survenant au cours d’une année. Elles ne donnent pas directement la fréquence des œdèmes ni des formes mixtes [<a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">S15</a>].</p>
<p>Les séries hospitalières sélectionnent souvent les cas compliqués ; les programmes ambulatoires sélectionnent autrement. Une mortalité observée dans une cohorte ne devient donc pas le risque d’une enfant suivie en Suisse, ni une hiérarchie universelle entre marasme, kwashiorkor et forme mixte [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
<p>Dans l’étude moléculaire publiée en octobre 2026 au Niger, soixante enfants par groupe ont été recrutés selon un plan cas-témoins. Les enfants œdémateux y regroupent aussi les formes avec émaciation. Un tel échantillonnage n’est pas un sondage de prévalence et ne permet pas d’isoler une fréquence <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">E42</a> [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</p>
<div class="key"><b>À retenir.</b> Une prévalence d’émaciation n’est ni une incidence annuelle, ni une mesure des seules formes mixtes. Toujours préciser population et recrutement [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://data.unicef.org/resources/jme/" target="_blank" rel="noopener">S15</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-3">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-4"><h2><span class="n">4</span>Du fonctionnement normal aux pertes de réserve</h2><p>Les apports alimentaires fournissent énergie, acides aminés, acides gras et micronutriments. Le tube digestif doit permettre digestion et absorption, le foie transforme et distribue les substrats, et les tissus utilisent ou stockent ces ressources. Une réserve corporelle ne se lit pas sur une seule concentration sanguine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-5-the-small-and-large-intestines" target="_blank" rel="noopener">S14</a>].</p>
<p>Quand les apports restent insuffisants, l’organisme mobilise glycogène, graisse et protéines, tout en réduisant certaines dépenses et la croissance. Cette adaptation peut limiter temporairement les besoins sans rendre le déficit sans danger. Fonte musculaire, faiblesse et perte de graisse deviennent visibles ; l’infection et les pertes digestives peuvent accélérer le déséquilibre [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<p>Dans la forme œdémateuse, une hypoalbuminémie peut contribuer aux mouvements d’eau, mais n’explique pas seule tout le tableau. L’intégrité des barrières, le drainage lymphatique, l’inflammation et la matrice des tissus sont aussi étudiés. Les associations moléculaires récentes restent des pistes, pas une démonstration d’un mécanisme unique ni une indication de perfuser systématiquement de l’albumine [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<p>La réalimentation change encore la situation : la sécrétion d’insuline et l’utilisation des glucides augmentent, avec des besoins en phosphate, potassium, magnésium et thiamine. Des réserves épuisées peuvent se révéler par des anomalies sanguines et une défaillance d’organes. L’œdème déjà présent avant les apports et un œdème qui s’aggrave pendant la renutrition ne s’interprètent donc pas automatiquement de la même façon [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>].</p>
<figure><svg role="img" viewBox="0 0 450 246" aria-label="Schéma logique sans anatomie générée"><rect x="8" y="5" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="38" font-size="17" fill="currentColor" text-anchor="middle">Apports, absorption et besoins</text><path d="M225 59v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="85" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="118" font-size="17" fill="currentColor" text-anchor="middle">Réserves, tissus et échanges d’eau</text><path d="M225 139v26m-5-7 5 7 5-7" stroke="currentColor" fill="none"/><rect x="8" y="165" width="434" height="54" rx="8" fill="none" stroke="currentColor"/><text x="225" y="198" font-size="17" fill="currentColor" text-anchor="middle">Mesures puis soins coordonnés</text></svg><figcaption>Schéma logique original Sol 2026, sans anatomie générée. Les voies sont multiples ; ce schéma ne quantifie pas une cause d’œdème et ne représente pas une anatomie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</figcaption></figure>
<div class="key"><b>À retenir.</b> Comprendre la réserve, la fonction et les échanges d’eau explique pourquoi le poids et l’albumine ne suffisent pas [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947262/" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-4">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-5"><h2><span class="n">5</span>Causes, formes et facteurs qui s’entretiennent</h2><p>Une disponibilité alimentaire insuffisante, un sevrage mal accompagné, une alimentation peu diversifiée, des préparations inadaptées ou des difficultés de prise peuvent réduire les apports. Les conditions économiques, l’accès à l’eau, la sécurité alimentaire et la santé des personnes qui s’occupent de l’enfant font partie de l’histoire médicale ; ils ne sont pas des motifs de jugement moral [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Une maladie peut réduire l’appétit, augmenter les besoins ou provoquer des pertes. Diarrhée persistante, infection, maladie digestive, atteinte neurologique ou autre maladie chronique peuvent participer. Plusieurs mécanismes peuvent coexister ; le diagnostic nutritionnel ne dispense jamais de rechercher une cause accessible au traitement [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>La forme mixte comporte des signes de fonte et un œdème nutritionnel. Les lésions de peau, les changements des cheveux et une hépatomégalie peuvent orienter mais ne sont pas obligatoires pour reconnaître une urgence. L’absence d’un aspect « typique » ne suffit pas à rassurer, et une alimentation dite riche en calories ne prouve pas la couverture de tous les besoins [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Les modèles de carence protéique isolée ont une valeur historique mais ne résument pas les connaissances actuelles. La réponse de l’hôte, les infections, les barrières et les échanges moléculaires sont étudiés ; aucune mutation ou composition de microbiote n’est actuellement nécessaire aux critères cliniques de l’<button class="w" data-k="e42-oms">OMS</button>. Les résultats animaux ne deviennent pas un test ou un traitement validé de la forme mixte [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13721215/" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
<div class="key"><b>À retenir.</b> Chercher comment apports, maladie et environnement se combinent. Le phénotype ne remplace ni l’enquête causale ni l’écoute de la famille [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-5">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-6"><h2><span class="n">6</span>Anamnèse : reconstruire l’évolution sans culpabiliser</h2><p>Reprendre les courbes, les anciens poids et les dates des œdèmes, de la diarrhée, de la fièvre et de la baisse d’appétit. Demander ce qui était réellement préparé, proposé, accepté et absorbé, avec des quantités et des fréquences aussi concrètes que possible. Une prise présentée comme abondante peut être peu énergétique, mal diluée, vomie ou partagée [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Chez le nourrisson, observer l’allaitement ou la préparation des substituts plutôt que se limiter à « allaitement oui/non ». Rechercher difficultés de succion, déglutition, douleur, fatigue, refus alimentaire ou besoin d’aide. L’<button class="w" data-k="e42-oms">OMS</button> insiste sur l’évaluation du couple nourrisson-personne qui s’en occupe, y compris santé physique, santé mentale et soutien disponible [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>].</p>
<p>Explorer infections et expositions, traitements, maladies digestives ou chroniques, antécédents et trajectoire du développement. Devant un œdème, des urines anormales, un gonflement matinal des paupières, une cardiopathie ou des signes de maladie hépatique peuvent conduire à d’autres hypothèses, sans exclure une dénutrition associée [<a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2926439/" target="_blank" rel="noopener">S11</a>].</p>
<p>Enfin, demander si les aliments prescrits, l’eau sûre, les visites de suivi et les médicaments sont accessibles. Les conseils doivent tenir compte de la langue, des gestes possibles et des ressources. Documenter l’obstacle et organiser une aide concrète est plus utile que noter simplement une « mauvaise observance » [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<div class="key"><b>À retenir.</b> Une chronologie précise et des gestes observés révèlent les mécanismes. Les difficultés matérielles et relationnelles font partie du soin [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-6">Essentiel de cette partie</button></section>
<section class="ilot" id="e42-7"><h2><span class="n">7</span>Examen clinique : voir, mesurer et interpréter</h2><div data-semiology-clinical="E42"><p><button class="w" data-k="e42-semio">La sémiologie clinique</button> relie fonte, œdème, état général et signes de complication. Commencer par conscience, respiration, perfusion, température et glycémie ; poursuivre par les mesures et l’examen des organes. Un enfant malnutri peut être infecté sans présenter une fièvre ou une réaction habituelle [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9108366/" target="_blank" rel="noopener">S9</a>].</p>
</div><p>Rechercher <button class="w" data-k="e42-godet">un godet</button> sur les deux pieds : après pression puis relâchement, une dépression persistante traduit un œdème prenant le godet. Décrire symétrie et extension, puis peau, cheveux, masses musculaires et graisse sous-cutanée. Un œdème bilatéral n’est appelé nutritionnel qu’après confrontation au contexte et aux autres causes, notamment rénales [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</p>
<p>Mesurer poids, taille ou longueur avec le matériel approprié, puis <button class="w" data-k="e42-bras">périmètre du bras gauche</button> au milieu du bras relâché, ruban au contact sans comprimer. Reporter sur les références adaptées, avec mesures sériées. Le poids est augmenté par l’eau ; une baisse pendant la résolution de l’œdème ne prouve pas à elle seule une perte nutritionnelle supplémentaire [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7469063/" target="_blank" rel="noopener">S6</a>].</p>
<p>Évaluer bouche, peau, respiration, abdomen, foie, état neurologique, signes infectieux et diurèse. La perte de tissu peut modifier le pli cutané et l’aspect des yeux, tandis que l’œdème peut masquer la déshydratation. L’histoire des pertes, la perfusion et les réévaluations comptent davantage qu’un signe isolé présenté comme infaillible [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>].</p>
<div class="key"><b>À retenir.</b> Le godet, les mesures et les signes de perfusion répondent à des questions différentes. Leur interprétation reste clinique et répétée [<a data-reference-source="1" href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://medicalguidelines.msf.org/en/viewport/CG/english/severe-acute-malnutrition-16689141.html" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9589698/" target="_blank" rel="noopener">S10</a>].</div><button class="pareto-btn ui" data-k="pareto-e42-7">Essentiel de cette partie</button></section>
