<section class="ilot" id="e42-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Quand un enfant très amaigri présente aussi des œdèmes, comment le reconnaître, pourquoi cette association est-elle plus dangereuse que chacun de ses deux éléments pris isolément, et quelles décisions prendre dans les premières heures ? Cette leçon traite le <b>kwashiorkor avec marasme</b>, catégorie E42 de la CIM-10-GM 2024, c’est-à-dire la forme mixte de la malnutrition protéino-énergétique grave. Elle ne reprend pas en détail les mécanismes propres à chaque pôle ; ils sont exposés dans les leçons E40 (kwashiorkor) et E41 (marasme), auxquelles elle renvoie.</p>
<p><b>Cas pédagogique fictif.</b> Un enfant de 20 mois est amené en consultation. Il est apathique, ses côtes et ses fesses sont saillantes, la peau des cuisses est lâche. Les deux pieds et le bas des jambes sont gonflés et gardent l’empreinte du doigt. Le <button class="w" data-k="e42-pb">périmètre brachial</button> mesure 108 mm. Le foie est palpable sous le rebord costal. La mère rapporte qu’il ne tète plus ni ne boit depuis la veille. Cette vignette contient les deux versants de la forme mixte : la fonte graisseuse et musculaire d’un côté, l’œdème de l’autre. Elle contient aussi un signe de danger qui commande l’hospitalisation.</p>
<p>Les objectifs de la leçon sont les suivants : définir la forme mixte et la situer parmi E40, E41 et E43 ; expliquer pourquoi l’œdème fausse la mesure du poids et donc l’évaluation de l’émaciation ; décrire les mécanismes connus et ceux qui restent indéterminés ; hiérarchiser les urgences (hypoglycémie, hypothermie, déshydratation, infection, syndrome de renutrition) ; appliquer les critères d’hospitalisation, de transfert vers l’ambulatoire et de sortie de l’<button class="w" data-k="e42-oms-def">OMS</button> 2023.</p>
<div class="key"><b>À retenir.</b> E42 n’est pas une maladie nouvelle : c’est un chevauchement. L’enfant cumule une émaciation sévère et un œdème nutritionnel bilatéral. Le danger ne vient pas de l’addition des deux, mais de l’œdème, qui masque la maigreur et signale un métabolisme mal adapté au jeûne.</div>
</section>

<section class="ilot" id="e42-1"><h2><span class="n">1</span>Définition et place dans la nosologie</h2>
<h3>1.1 Le libellé officiel et ses voisins</h3>
<p>Le libellé de l’Office fédéral de la statistique, repris de la CIM-10-GM 2024, est « E42 Kwashiorkor avec marasme ». La catégorie est terminale : elle ne comporte aucun sous-code. Elle appartient au chapitre IV et au bloc E40–E46, consacré à la <button class="w" data-k="e42-nosologie">malnutrition (E40 à E46 : place de E42, exclusions croisées)</button>. La note de la version allemande de la classification précise que E42 désigne la malnutrition protéino-énergétique grave, au sens de E43, sous une forme intermédiaire ou avec des signes simultanés de kwashiorkor et de marasme. Les catégories E40 et E41 excluent explicitement le kwashiorkor-marasme et le renvoient en E42.</p>
<table class="t"><tr><th>Code</th><th>Libellé</th><th>Ce qui oriente vers lui</th></tr><tr><td>E40</td><td>Kwashiorkor</td><td>Œdème nutritionnel avec poids presque normal pour l’âge, sans émaciation franche</td></tr><tr><td>E41</td><td>Marasme nutritionnel</td><td>Émaciation sévère sans œdème</td></tr><tr><td><b>E42</b></td><td><b>Kwashiorkor avec marasme</b></td><td><b>Émaciation sévère et œdème simultanés, ou forme intermédiaire</b></td></tr><tr><td>E43</td><td>Malnutrition protéino-énergétique grave, sans précision</td><td>Perte de poids sévère ou absence de prise de poids avec valeur d’au moins 3 écarts-types sous la moyenne de référence ; inclut l’« œdème de famine »</td></tr></table>
<p>Le tableau se lit de haut en bas comme un gradient d’informations disponibles. Si l’examen montre l’œdème seul, on code E40 ; l’émaciation seule, E41 ; les deux ensemble, E42 ; et lorsque la gravité est établie sans que la forme soit précisée, E43. La note de bloc ajoute que le degré se juge d’ordinaire sur le poids exprimé en écarts-types de la population de référence : grave à partir de 3 écarts-types, modéré de 2 à moins de 3, léger de 1 à moins de 2. Une mesure unique ne rend le diagnostic que provisoire ; en l’absence de poids, on se fonde sur la clinique.</p>
<h3>1.2 La définition clinique</h3>
<p>Dipasquale et ses collègues (2020) écrivent que le kwashiorkor-marasme est représenté par des signes mixtes du marasme et du kwashiorkor : une émaciation sévère et un œdème coexistent, avec des altérations cutanées et pilaires habituellement discrètes et un foie gras élargi palpable. Ils le rangent parmi les formes sévères de la malnutrition aiguë, au même titre que le périmètre brachial inférieur à 115 mm, le rapport poids/taille inférieur à −3 écarts-types et l’œdème bilatéral.</p>
<h3>1.3 La définition de l’OMS en 2023</h3>
<p>La directive de l’<button class="w" data-k="e42-oms-def">OMS</button> de 2023 ne nomme pas le kwashiorkor-marasme. Elle définit la <button class="w" data-k="e42-oms-def">malnutrition aiguë sévère (critères d’inclusion, œdème nutritionnel, populations)</button> par un œdème nutritionnel <b>et/ou</b> un rapport poids/taille (ou poids/longueur) inférieur à −3 écarts-types <b>et/ou</b> un périmètre brachial inférieur à 115 mm chez l’enfant de 6 à 59 mois. L’œdème nutritionnel est bilatéral, prend le godet, débute aux pieds et peut gagner les jambes puis le reste du corps, visage compris ; il est pathognomonique de la malnutrition aiguë sévère. Le « et/ou » de cette définition englobe précisément la situation E42 : l’enfant qui répond à la fois au critère œdème et au critère anthropométrique.</p>
<div class="trap"><span class="k">Piège</span> Deux taxonomies coexistent. Pour Bhutta et ses collègues (2017), l’émaciation sévère se définit <b>en l’absence d’œdème</b>, et tout enfant œdémateux est classé « kwashiorkor » quelle que soit son anthropométrie. La CIM-10-GM isole en revanche la forme mixte en E42. Un énoncé d’examen qui parle de « kwashiorkor » pour un enfant œdémateux et émacié n’est donc pas contradictoire avec E42 : il utilise l’autre taxonomie. <button class="w" data-k="e42-taxonomies">Comparer les deux taxonomies (Bhutta, OMS, CIM)</button>.</div>
<h3>1.4 Une notion historique : le kwashiorkor se greffe sur le marasme</h3>
<p>Scrimshaw et Viteri (2010), au terme de trente ans d’études de l’institut centraméricain de nutrition, tiennent le kwashiorkor et le marasme pour deux maladies métaboliques distinctes. Ils observent cependant que le kwashiorkor se greffe habituellement sur un marasme chronique ; la plupart des cas qu’ils ont étudiés étaient donc des kwashiorkors-marasmes. Cette notion donne son sens clinique à la forme mixte : elle correspond souvent à un enfant déjà dénutri chez qui apparaît l’œdème.</p>
<div class="key"><b>À retenir.</b> Pour le code : œdème et émaciation ensemble donnent E42. Pour l’OMS : l’œdème seul, ou l’émaciation seule, ou les deux suffisent à définir la malnutrition aiguë sévère. Pour la pratique : l’œdème commande la sévérité de la prise en charge.</div>
</section>

<section class="ilot" id="e42-2"><h2><span class="n">2</span>Classifications et leurs limites</h2>
<p>Plusieurs classifications servent à typer la malnutrition protéino-énergétique. Leur point commun est de distinguer trois tableaux : le marasme (sans œdème), le kwashiorkor et le kwashiorkor-marasme (avec œdème).</p>
<table class="t"><tr><th>Classification</th><th>Ce que les sources lues établissent</th><th>Limite à connaître</th></tr><tr><td>Spectre clinique de l’enfant</td><td>Marasme (E41), kwashiorkor (E40), kwashiorkor-marasme (E42) (Jahoor 2008 ; Dipasquale 2020)</td><td>Le continuum est clinique ; les mécanismes ne sont pas identiques</td></tr><tr><td><button class="w" data-k="e42-wellcome">Classification de Wellcome (et variantes)</button></td><td>Utilisée pour typer marasme, kwashiorkor et kwashiorkor-marasme dans les études de Jamaïque et de Zambie</td><td>Seuils chiffrés non lus dans une source primaire : aucun pourcentage n’est cité ici</td></tr><tr><td>Gomez, Waterlow, McLaren</td><td>Citées comme critères de classement dans une étude turque</td><td>Seuils non lus</td></tr><tr><td><button class="w" data-k="e42-oedeme-grades">Gradation de l’œdème</button></td><td>Deux gradations divergentes : un à trois plus selon la topographie (Bhutta) ; grades I à IV (Dipasquale)</td><td>Aucune n’est propre à E42 ; la définition OMS de « + » n’a pas été lue</td></tr></table>
<p>La limite la plus instructive concerne la mesure de l’émaciation sous œdème. Dans une cohorte zambienne de 538 enfants de moins de 5 ans, en présence d’œdème, la classification de Wellcome donnait 54,3 % de faux négatifs. Le diagnostic clinique de l’émaciation sous œdème produisait 44,7 % de faux positifs et 41,4 % de faux négatifs. Les auteurs ont proposé un schéma fondé sur l’émaciation (rapport poids/taille inférieur ou égal à −2 écarts-types) et sur l’œdème. La raison est mécanique : l’eau retenue par l’œdème s’ajoute au poids, qui paraît alors plus proche de la normale que la masse maigre réelle de l’enfant.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure à l’absence d’émaciation parce que le poids est proche de la normale chez un enfant œdémateux. Le poids est gonflé par l’eau. Le <button class="w" data-k="e42-pb">périmètre brachial</button>, peu influencé par l’œdème du pied, est mieux adapté dans cette situation, et Bhutta et collègues notent que le rapport poids/taille est le moins bon prédicteur de la mortalité.</div>
<div class="key"><b>À retenir.</b> Les seuils de Wellcome, de Gomez et de Waterlow ne sont pas à mémoriser à partir de cette leçon, car ils n’ont pas été lus dans une source primaire ; retenir en revanche que l’œdème masque l’émaciation et fausse la classification.</div>
</section>

<section class="ilot" id="e42-3"><h2><span class="n">3</span>Épidémiologie</h2>
<p>Aucune donnée suisse n’a été trouvée sur le kwashiorkor-marasme : la lacune est nommée et aucun taux n’est déduit d’une population étrangère. Les données disponibles viennent de séries hospitalières et communautaires de pays à ressources limitées. Elles montrent surtout que la <b>part de la forme mixte varie beaucoup</b> selon le lieu, l’époque et la définition employée.</p>
<table class="t"><tr><th>Série</th><th>Population</th><th>Répartition rapportée</th></tr><tr><td>Revue d’immunologie (2022)</td><td>Malnutritions sévères, chiffres agrégés</td><td>Marasme environ 68,6 % ; kwashiorkor environ 23,8 % ; kwashiorkor-marasme environ 7,6 %</td></tr><tr><td>Karachi (2014)</td><td>131 enfants de 6 mois à 5 ans</td><td>Marasme 78 % ; kwashiorkor 4 % ; kwashiorkor-marasme 18 %</td></tr><tr><td>Nairobi (2009)</td><td>165 enfants œdémateux de moins de 5 ans</td><td>Kwashiorkor 64 % ; kwashiorkor-marasme 36 %</td></tr><tr><td>Malawi (2022)</td><td>Enfants de 12 à 60 mois</td><td>94 kwashiorkors ; 43 kwashiorkors-marasmes ; 118 marasmes</td></tr><tr><td>Jamaïque, 1962–1992 (2012)</td><td>1149 enfants</td><td>391 kwashiorkors ; 383 marasmes ; 375 kwashiorkors-marasmes</td></tr></table>
<p>Ces cinq lignes ne sont pas comparables entre elles : la revue agrège des populations non précisées dans le résumé lu, les séries de Nairobi ne comptent que des enfants œdémateux, et les critères de typage diffèrent d’une étude à l’autre. Elles montrent que la forme mixte est loin d’être exceptionnelle dans ces séries, sans permettre d’en fixer une fréquence générale.</p>
<p>Dans la série jamaïcaine, le poids de naissance rapporté par la mère était plus élevé de 333 g (intervalle de confiance à 95 % de 217 à 449 g) chez les enfants qui ont développé un kwashiorkor que chez ceux qui ont développé un marasme. Les auteurs y voient un argument pour un <button class="w" data-k="e42-prenatal">modèle d’adaptation prédictive (facteurs prénatals)</button>. Le résumé lu ne donne pas la valeur du groupe mixte.</p>
<p>Dans les pays à revenu élevé, la forme mixte est rare. Un cas européen publié concerne un nourrisson de 13 mois en Macédoine du Nord, avec kwashiorkor-marasme, sepsis, anémie sévère, hypoprotidémie et dysfonction des neutrophiles. Un autre cas, hors définition pédiatrique classique, décrit une fillette de 11 ans atteinte d’anorexie mentale restrictive, avec un indice de masse corporelle de 7,7 à 9,0 kg/m² et une dermatose « en peinture écaillée » évoquant un phénotype kwashiorkor-marasme.</p>
<p>Enfin, le terme a été repris chez l’adulte dans un but pronostique. Dans une cohorte japonaise de 2308 adultes insuffisants cardiaques, la « malnutrition de type kwashiorkor-marasme » (indice de masse corporelle inférieur à 18,5 kg/m² <b>et</b> albumine inférieure à 3,4 g/dL) concernait 4,8 % des patients et s’associait au pire pronostic : rapport de risque de 2,313 pour la mortalité toutes causes et de 3,001 pour la mortalité cardiaque. Cette définition est opérationnelle, propre à l’étude, et ne constitue pas une définition de la CIM. <button class="w" data-k="e42-adulte">Lire les limites de cette extrapolation adulte</button>.</p>
<div class="key"><b>À retenir.</b> La fréquence relative de la forme mixte dépend de la définition et du lieu ; il n’existe pas de donnée suisse. L’usage du mot chez l’adulte est analogique et ne remplace pas la définition pédiatrique.</div>
<button class="pareto-btn ui" data-k="pareto-e42-definition">▲ Loi de Pareto — Définition, classifications et épidémiologie</button>
</section>

<section class="ilot" id="e42-4"><h2><span class="n">4</span>Physiopathologie</h2>
<p>Deux messages dominent cette partie. Le premier est que la forme œdémateuse, donc E42, correspond à une adaptation incomplète au jeûne, alors que le marasme pur correspond à une adaptation réussie. Le second est que la cause exacte de l’œdème reste indéterminée : la leçon distingue ce qui est établi, ce qui est hypothétique et ce qui n’est pas encore démontré.</p>
<h3>4.1 L’état de référence : l’enfant non œdémateux sous privation chronique</h3>
<p>Jahoor et ses collègues (2008) décrivent que l’enfant privé de nourriture de façon chronique, mais non œdémateux, maintient sa dégradation de protéines corporelles (la protéolyse) au même niveau que lorsqu’il est bien nourri. Ce maintien libère des acides aminés, qui servent à fabriquer les protéines du plasma. Bhutta et ses collègues (2017) qualifient pour cette raison le marasme de réponse adaptée au jeûne.</p>
<h3>4.2 Ce qui change dans la forme œdémateuse</h3>
<p>Dans le kwashiorkor et le kwashiorkor-marasme, l’enfant ne parvient pas à maintenir ce débit de protéolyse. La dégradation plus lente réduit l’offre de la plupart des acides aminés, donc la synthèse des protéines plasmatiques de transport et de phase aiguë. S’y ajoutent un stress oxydatif avec des dommages cellulaires et une synthèse altérée du glutathion (Jahoor 2008). Bhutta et collègues ajoutent une production endogène de glucose réduite, ce qui explique le risque d’hypoglycémie, un flux et une oxydation réduits des acides gras, une stéatose hépatique frappante et un déficit plus marqué en acides aminés. Sur le plan hormonal, la malnutrition aiguë s’accompagne d’un taux bas de triiodothyronine, d’insuline et du facteur de croissance IGF-1, et d’un taux élevé d’hormone de croissance et de cortisol (Dipasquale 2020).</p>
<table class="t"><tr><th>Caractère</th><th>Marasme</th><th>Formes œdémateuses (E40, E42)</th></tr><tr><td>Qualification</td><td>Réponse adaptée au jeûne, métabolisme « économe »</td><td>Réponse mal adaptée, métabolisme « prodigue »</td></tr><tr><td>Protéolyse</td><td>Maintenue</td><td>Abaissée</td></tr><tr><td>Glucose endogène</td><td>Préservé</td><td>Production réduite : risque d’hypoglycémie</td></tr><tr><td>Foie</td><td>Moins touché</td><td>Stéatose frappante</td></tr><tr><td>Pronostic</td><td>Plus favorable avec un traitement adapté</td><td>Plus difficile à traiter, morbi-mortalité élevée</td></tr></table>
<p>Ce tableau résume les contrastes décrits par Jahoor et Bhutta. Il ne dit pas où se situe exactement la forme mixte ; les données de recherche suivantes précisent quelques éléments de son profil, mais elles reposent sur de petits effectifs et sur des résumés.</p>
<h3>4.3 Ce que les études disent de la forme mixte</h3>
<ul><li><b>Métabolisme monocarboné.</b> Au Malawi, les produits de ce métabolisme étaient plus bas dans le kwashiorkor-marasme (diméthylarginine asymétrique 0,549 µmol/L, cystéine 90 µmol/L) et dans le kwashiorkor (0,557 ; 115) que dans le marasme (0,698 ; 153). Ils étaient corrélés à la méthionine, d’où l’hypothèse d’une carence en méthionine. Étude transversale : l’hypothèse n’est pas démontrée. <button class="w" data-k="e42-methionine">Détail de l’étude</button>.</li><li><b>Intestin.</b> En Zambie, la perte des protéoglycanes à héparane-sulfate de l’épithélium duodénal s’observait dans le kwashiorkor et non dans le marasme ; le groupe mixte comptait huit enfants, et le résumé ne détaille pas ses résultats : il ne faut pas extrapoler. <button class="w" data-k="e42-intestin">Détail</button>.</li><li><b>Immunité.</b> Les formes œdémateuses associent protéines et catabolisme protéique abaissés, micronutriments altérés, stress oxydatif non contrôlé, épuisement des bactéries commensales anaérobies et prolifération de bactéries potentiellement pathogènes, d’où une immunité profondément altérée et une barrière intestinale compromise. <button class="w" data-k="e42-immunite">Détail</button>.</li><li><b>Stress oxydatif.</b> L’activité de la glutathion S-transférase érythrocytaire était plus élevée chez 271 enfants malnutris (dont 75 kwashiorkors-marasmes) que chez les témoins, sans différence entre les quatre classes, et plus élevée encore chez les 11 enfants décédés.</li><li><b>Aflatoxines.</b> Une revue de portée les retrouve plus souvent dans le kwashiorkor que dans le kwashiorkor-marasme et le marasme ; le lien causal n’est pas établi. <button class="w" data-k="e42-aflatoxines">Détail</button>.</li></ul>
<div class="trap"><span class="k">Piège</span> L’explication scolaire de l’œdème par la seule baisse de l’albumine n’est pas soutenue par les sources lues. Bhutta et collègues considèrent l’étiologie de l’œdème comme <b>indéterminée</b> et notent que l’hypoalbuminémie corrèle mal avec le degré d’œdème et la vitesse de sa résolution. Une albumine basse est un marqueur de gravité, non la preuve du mécanisme de l’œdème. <button class="w" data-k="e42-albumine">Interpréter l’albumine</button>.</div>
<div class="key"><b>À retenir.</b> Marasme : adaptation. Formes œdémateuses : protéolyse abaissée, glucose endogène réduit, stéatose, stress oxydatif, immunité altérée. L’origine de l’œdème est inconnue ; ne pas l’attribuer à la seule hypoalbuminémie.</div>
</section>

<section class="ilot" id="e42-5"><h2><span class="n">5</span>Causes et facteurs de risque</h2>
<p>La cause immédiate est une alimentation insuffisante en énergie et en protéines, mais elle s’inscrit dans un contexte. Les sources lues citent l’insécurité alimentaire, les infections, et un sevrage vers une alimentation pauvre en protéines et riche en glucides. Dans la forme mixte, l’enchaînement le plus fréquent décrit par Scrimshaw et Viteri est un marasme chronique sur lequel le kwashiorkor se greffe.</p>
<table class="t"><tr><th>Facteur</th><th>Ce que disent les sources</th></tr><tr><td>Insécurité alimentaire, sevrage</td><td>Contexte général de la malnutrition sévère de l’enfant (Bhutta 2017 ; Soriano 2020)</td></tr><tr><td>Infection par le virus de l’immunodéficience humaine</td><td>Présente chez 15 à 29 % des enfants hospitalisés avec malnutrition aiguë sévère en Afrique subsaharienne, avec une mortalité triplée (Bhutta 2017) ; en Zambie, risque de décès augmenté de 80 % (rapport de risque 1,8) sur 9540 enfants</td></tr><tr><td>Infections intercurrentes</td><td>Diarrhée, pneumonie, tuberculose : à rechercher à l’anamnèse (OMS 2023)</td></tr><tr><td>Pays à revenu élevé</td><td>Régimes d’éviction, boissons végétales, mucoviscidose, chirurgie bariatrique, anorexie mentale : extrapolés des leçons E40 et E41, non spécifiques à E42</td></tr></table>
<p>Une particularité à connaître : dans la malnutrition primaire, le test de la sueur peut être faussement élevé. Dans une étude de 90 enfants malnutris et 30 témoins, il l’était chez 6,7 % des malnutris et chez 20 % des cas de troisième degré, y compris chez des kwashiorkors-marasmes, avec normalisation après renutrition. Une mucoviscidose ne doit donc pas être diagnostiquée sur un test unique pendant la phase aiguë. <button class="w" data-k="e42-sueur">Interpréter le test de la sueur</button>.</p>
<div class="key"><b>À retenir.</b> Le sevrage et l’infection sont les facteurs les plus constants. L’infection par le virus de l’immunodéficience humaine aggrave la mortalité. Un test de la sueur positif pendant la malnutrition aiguë se répète après renutrition.</div>

</section>

<section class="ilot" id="e42-6"><h2><span class="n">6</span>Anamnèse</h2>
<p>L’anamnèse poursuit deux buts : chercher les signes de danger qui décident de l’hospitalisation, et reconstituer le déroulement de la dénutrition.</p>
<div class="two"><div class="card"><h4>Signes de danger et urgences</h4><ul><li>Incapacité de boire ou de téter</li><li>Vomissements de tout ce qui est ingéré</li><li>Convulsions</li><li>Léthargie ou inconscience</li></ul><p>Ces quatre signes sont ceux de la <button class="w" data-k="e42-pcime">prise en charge intégrée des maladies de l’enfant</button> repris par l’<button class="w" data-k="e42-oms-def">OMS</button> 2023. Un seul suffit pour hospitaliser.</p></div><div class="card"><h4>Chronologie et terrain</h4><ul><li>Histoire alimentaire détaillée (journal alimentaire, diététicien)</li><li>Perte de poids récente, puis apparition des œdèmes</li><li>Diarrhée, pneumonie, tuberculose, vaccinations</li><li>Infection par le virus de l’immunodéficience humaine</li><li>Maladies chroniques : cardiopathie congénitale, paralysie cérébrale</li><li>Épisodes antérieurs de malnutrition</li></ul></div></div>
<p>La chronologie « perte de poids puis œdème » est évocatrice de la forme mixte, puisque le kwashiorkor se greffe sur un marasme préexistant. Les antécédents chroniques et les épisodes antérieurs orientent vers une <b>évaluation approfondie</b> plutôt que vers un traitement standard.</p>
<div class="trap"><span class="k">Erreur fréquente</span> S’en tenir à l’histoire alimentaire. L’infection intercurrente, la comorbidité chronique et l’échec d’un traitement ambulatoire antérieur modifient l’orientation et le risque ; l’<button class="w" data-k="e42-oms-def">OMS</button> les range explicitement parmi les raisons d’une évaluation approfondie.</div>
</section>
