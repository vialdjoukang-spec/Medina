<section class="ilot" id="k56-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 75 ans, opéré du côlon il y a huit ans, consulte pour des douleurs abdominales en coliques depuis la veille, des vomissements, un ballonnement et l’absence de gaz. <b>La question est donc double : s’agit-il d’une <button class="w" data-k="k56-osb">occlusion du grêle sur brides</button>, et faut-il opérer tout de suite ou tenter d’abord un <button class="w" data-k="k56-sng">traitement non opératoire</button> ?</b></p><p>Pour y répondre, le médecin doit savoir : reconnaître le tableau occlusif et ses pièges ; chercher les signes qui imposent la chirurgie (<button class="w" data-k="k56-strang">strangulation</button>, ischémie, péritonite) ; demander le bon examen, c’est-à-dire le <button class="w" data-k="k56-tdm">scanner</button> avec <button class="w" data-k="k56-hydro">produit de contraste hydrosoluble</button> ; ensuite, conduire le traitement non opératoire et savoir quand il échoue ; enfin, distinguer l’occlusion colique, le volvulus et l’<button class="w" data-k="k56-ileus">iléus paralytique</button>, qui ne se traitent pas de la même façon.</p><p><i>Pourquoi ce cas ?</i> En effet, l’occlusion sur brides est l’urgence chirurgicale type : le retard diagnostique y représente 70 % des plaintes pour faute médicale selon la WSES. Ainsi, contrairement à un manuel figé qui juxtapose les causes, ce cours suit le raisonnement au lit du malade : chaque mot vert ouvre le critère, le seuil ou l’image correspondante, si bien que la décision peut être refaite pas à pas.</p><div class="key"><b>Point de départ.</b> Coliques + vomissements + ballonnement + arrêt du transit chez un opéré : penser brides → chercher les signes de gravité → scanner → traitement non opératoire si aucun signe d’alarme.</div></section>
<section class="ilot" id="k56-1"><h2><span class="n">1</span>Définitions et épidémiologie</h2><p>L’<button class="w" data-k="k56-occl">occlusion intestinale</button> est un obstacle au passage du contenu digestif ; elle se traduit par une douleur abdominale, des vomissements, une distension et un arrêt des matières et des gaz (WSES Bologne 2017). Or, l’obstacle peut être mécanique (bride, tumeur, volvulus, invagination, calcul) ou fonctionnel : on parle alors d’<button class="w" data-k="k56-ileus">iléus paralytique</button>, où l’intestin est perméable mais immobile.</p><p>De plus, les adhérences postopératoires sont la première cause d’occlusion du grêle : elles en expliquent environ 60 %. Ainsi, au Royaume-Uni, l’occlusion du grêle motivait 51 % des laparotomies en urgence ; par ailleurs, chaque épisode d’occlusion sur brides entraîne en moyenne 8 jours d’hospitalisation et une mortalité hospitalière de 3 % (WSES Bologne 2017). Enfin, la récidive est fréquente : 12 % des patients traités sans chirurgie sont réhospitalisés dans l’année, et 20 % à 5 ans, contre 8 % et 16 % après traitement chirurgical.</p><table class="t"><tr><th>Mécanisme</th><th>Exemples</th></tr><tr><td>Fonctionnel (pas d’obstacle)</td><td>Iléus paralytique</td></tr><tr><td>Télescopage d’un segment</td><td><button class="w" data-k="k56-invag">Invagination</button></td></tr><tr><td>Torsion sur l’axe du méso</td><td><button class="w" data-k="k56-volv">Volvulus</button>, par exemple du sigmoïde</td></tr><tr><td>Calcul biliaire migré dans le grêle</td><td>Iléus biliaire</td></tr><tr><td>Adhérences après chirurgie</td><td>Brides avec occlusion</td></tr><tr><td>Autres obstacles</td><td>Tumeur, bézoard, maladie inflammatoire</td></tr></table><p><i>Lecture du tableau.</i> Chaque ligne correspond à un mécanisme physique différent ; or, c’est le mécanisme, et non le symptôme, qui commande le traitement. En effet, une bride simple peut céder avec le repos digestif, alors qu’une torsion ou une <button class="w" data-k="k56-anse">anse fermée</button> étrangle le mésentère et impose un geste rapide. C’est pourquoi l’enjeu du bilan est d’identifier le mécanisme, puis de chercher la souffrance de l’intestin.</p><div class="key"><b>À retenir.</b> Occlusion = obstacle mécanique ou iléus fonctionnel ; brides ≈ 60 % des occlusions du grêle ; 8 jours d’hospitalisation, 3 % de mortalité par épisode ; récidive 12 % à 1 an, 20 % à 5 ans sans chirurgie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></section>
<section class="ilot" id="k56-2"><h2><span class="n">2</span>Physiopathologie : de la distension à l’ischémie</h2><p>En amont de l’obstacle, le gaz avalé et les sécrétions digestives s’accumulent ; ainsi, les anses se distendent, alors que l’intestin d’aval se vide et devient plat, c’est le « grêle de famine ». Ensuite, la distension élève la pression dans la paroi et gêne d’abord le retour veineux ; par conséquent, la paroi s’œdématie, le liquide passe dans la lumière et dans le péritoine, et le patient se déshydrate. De plus, les vomissements font perdre de l’eau, du sodium, du chlore et du potassium ; c’est pourquoi l’hypokaliémie et l’insuffisance rénale aiguë fonctionnelle sont fréquentes, comme le souligne la WSES.</p><p>Cependant, le danger principal est vasculaire. En effet, dans une <button class="w" data-k="k56-anse">anse fermée</button>, occluse à ses deux extrémités, ou dans une torsion, le mésentère est comprimé : la circulation artérielle s’arrête, la paroi devient ischémique, puis nécrotique, et elle finit par se perforer. Dès lors, une occlusion « simple » peut devenir une occlusion « étranglée » en quelques heures, d’où la règle de la WSES : chercher d’emblée les signes de <button class="w" data-k="k56-strang">strangulation</button>, d’ischémie et de péritonite, qui contre-indiquent le <button class="w" data-k="k56-sng">traitement non opératoire</button>.</p><figure><img src="data:image/gif;base64,R0lGODdhWAKhAYUAAPz8/NPT07y8vK+vr6ampqKioqCgoJ2dnZubm5qama2Oh5aWlpSUlJGRkY2MjImJiYeHhoSEhIGBgX5/frhyZYJzcHt6enh4eHV0dHJycm9vb2xsa2lnZmZmZmJiYl9eXltbW1hYWFZVVVJSUk5OTlVGREpJSUdGRkJCQj49PTo6OjY1NTIxMS4uLiwqKicmJiIjIh8eHxoaGhcWFhISEg4ODgoKCgUFBQMDAwICAgICAQEBAwEBAQEBAAAAAgAAACwAAAAAWAKhAUAI/wBn1KBBsKDBgwgTKlzIsCHCgTVs2ICBAkSIESRQqIDRYgULFy9afHTRwoULFixekPzIQgWLFStRmFCRAkUKFSpQoFix4oRGFCdImJAZAgSIDyM+hDiRgieLmyVbSJX6seRJkyKxVn3JQmTXlSJbhCQp9uSLFyhdeDTJMeVYqTBAdnx5AoSHDiBY1MgxkEZfh4ADCx7sF8aMgn8bVu3Ik4QHDRkuDgBAAEGAAS9sEFYIkUaMzaAR4phhIzFgGygiEBDAWsCA1rBjsx7wmv le rappelle la WSES ; c’est pourquoi on la déduit de ce changement de calibre et de l’absence d’autre cause (tumeur, hernie, volvulus). En outre, le radiologue cherche dans la même série les signes de souffrance : paroi mal rehaussée, anse fermée, liquide libre.</p><div class="key"><b>À retenir.</b> Distension d’amont → œdème pariétal et pertes hydroélectrolytiques → si anse fermée ou torsion : ischémie → nécrose → perforation ; la bride se déduit du changement de calibre.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></section>
<section class="ilot" id="k56-3"><h2><span class="n">3</span>Présentation clinique et pièges</h2><p>Classiquement, l’occlusion sur brides associe des douleurs abdominales intermittentes en coliques, une distension et des nausées, avec ou sans vomissements, et avec ou sans arrêt des selles (WSES Bologne 2017). Ainsi, l’anamnèse recherche les causes possibles : opérations antérieures, radiothérapie ; de plus, elle évalue l’état nutritionnel et les signes de déshydratation.</p><p>Cependant, la WSES décrit des pièges qui retardent le diagnostic. En effet, une occlusion incomplète peut donner une diarrhée aqueuse, faussement rassurante, qui fait croire à une gastroentérite ; de même, des selles peuvent persister si l’obstacle est haut et le patient vu tôt. Par ailleurs, chez le sujet âgé, la douleur est souvent moins marquée. Enfin, l’examen recherche une péritonite et une hernie de la paroi ou de l’aine ; toutefois, sa sensibilité pour détecter une <button class="w" data-k="k56-strang">strangulation</button> n’est que de 48 %, même chez un clinicien expérimenté.</p><div class="trap"><span class="k">Piège</span>Une diarrhée n’exclut pas une occlusion : l’obstacle incomplet laisse passer du liquide. De même, un ventre peu douloureux chez une personne âgée n’exclut pas une strangulation, puisque l’examen n’en détecte qu’environ la moitié.</div><div class="quiz ui"><p>Chez un patient occlus, l’examen clinique ne montre ni défense ni contracture. Que peut-on en conclure sur la strangulation ?</p><button data-ok="0">Elle est exclue</button><button data-ok="1">Elle n’est pas exclue : la sensibilité de l’examen n’est que de 48 %</button><button data-ok="0">Elle est exclue si le patient a encore des selles</button><p class="fb" hidden>Selon la WSES, l’examen clinique ne détecte la strangulation qu’une fois sur deux ; c’est pourquoi le <button class="w" data-k="k56-tdm">scanner</button> est demandé dès qu’un doute existe.</p></div><div class="key"><b>À retenir.</b> Coliques + distension + nausées ± vomissements ± arrêt des selles ; pièges : diarrhée de l’occlusion incomplète, selles de l’obstacle haut, sujet âgé peu douloureux ; examen : sensibilité 48 % pour la strangulation ; toujours examiner les orifices herniaires.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></section>
<section class="ilot" id="k56-4"><h2><span class="n">4</span>Biologie et imagerie</h2><p>Le bilan biologique minimal comprend une formule sanguine, le <button class="w" data-k="k56-lact">lactate</button>, les électrolytes, la CRP, l’urée et la créatinine. Ainsi, une CRP supérieure à 75 et des leucocytes au-delà de 10 000/mm³ peuvent évoquer une péritonite, même si leur sensibilité et leur spécificité restent faibles ; de plus, le potassium est souvent bas et doit être corrigé (WSES Bologne 2017).</p><p>Ensuite, l’imagerie oriente la décision. Or, la <button class="w" data-k="k56-asp">radiographie de l’abdomen</button> a une valeur limitée (sensibilité d’environ 70 %) et ne renseigne ni sur la cause ni sur la <button class="w" data-k="k56-strang">strangulation</button> ; c’est pourquoi la WSES ne la recommande pas (IIC). En revanche, le <button class="w" data-k="k56-tdm">scanner</button> prédit la strangulation et le besoin de chirurgie urgente avec une exactitude d’environ 90 % ; il est donc l’examen de choix en cas de doute sur la cause ou de signe pouvant imposer la chirurgie. Par ailleurs, l’échographie et l’IRM servent dans des situations particulières, comme la grossesse.</p><figure><img src="data:image/gif;base64,R0lGODdh4AE2AoQAAMrIzL++wre2urGxtK2ssKiprKSkpp6foZmZm5OUlYyOj4eJioOFhX6Af3l8enV4dnB0cmttbGRoZl5hX1hbWFNVU0xQTUZJRT5APDY4NC4vKyYnIx4eGxYWExERDwsLCiwAAAAA4AE2AkAI/wAxYLhgwUKFChQSXhCYoaEGDRsibuAgkYPFDh48fNjIsaPHjyBDihxJsqTJkyhTosyY8QNLjRk7yMToQaZFiQ81NNx5oafBhBMiQBgaoWhRCUIfDF069IFTphCeRm3QgIHVBQsUaNWaoGsCBVjDYrVKtoGDsw6kGpXAtu0ECggPyjVYwULPngIxOMzJd2cGvhAjWhyMUebLw4dVKl7MmKPGkC83Ppa8AeLDyhA7cPAwt8KEzxQsMNzbcCKHmTNZNlY52aVkka1Xy57tMnHt2B1Zah58GjXvwTjz3hVesKDnt0GbLnVA9axTqVKhNmVelUFYBV6xf/0qlqz1sd4ZUP8d39x5dAgRJHx+C/dg++LDGcrHq7fhQIJ491bsbdhwbce2SQZTTY/hRtuBr7Xk2Gv/PQBAAABEKCECGXQgF0JsibbQaBARpllqNYGoGoIKChgZgiC1NuJ/KEI2WYkAmvgSarv99htmGeQl3F0EFefeZ2wJtZRT5kFl1JBoUZVVVtxhtZV22YG1lZNPirVAeGah9Vx0Rh3llnoUvHWQXcKNCV9efv0F2JqVCWbjRaghFuCLdOZWYIotjqSaghMUgMEH/ tion.jpg" target="_blank" rel="noopener">source</a>), adaptée en GIF.</small></figcaption></figure><p><i>Lecture de l’image.</i> Debout, le gaz monte et le liquide stagne au fond des anses ; ainsi, chaque anse distendue dessine un niveau horizontal. Cependant, cette image confirme seulement qu’il y a une occlusion : elle ne dit ni pourquoi, ni si l’intestin souffre. C’est précisément pourquoi le scanner l’a remplacée dans la décision.</p><div class="key"><b>À retenir.</b> Biologie : formule, lactate, électrolytes, CRP, urée et créatinine ; corriger le potassium ; radiographie peu utile (non recommandée) ; scanner ≈ 90 % d’exactitude pour la strangulation et l’indication chirurgicale.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></section>
<section class="ilot" id="k56-5"><h2><span class="n">5</span>Signes qui imposent la chirurgie</h2><p>La première décision est donc de savoir si l’intestin souffre. Ainsi, selon la WSES, les contre-indications au <button class="w" data-k="k56-sng">traitement non opératoire</button> sont la péritonite, la <button class="w" data-k="k56-strang">strangulation</button> et l’ischémie ; de plus, au <button class="w" data-k="k56-tdm">scanner</button>, une <button class="w" data-k="k56-anse">anse fermée</button>, des signes d’ischémie et du liquide libre font opérer sans délai.</p><p>Par ailleurs, des scores aident à prédire le besoin de chirurgie. En effet, le score de <button class="w" data-k="k56-zielinski">Zielinski</button> associe trois signes, l’œdème du mésentère, l’absence de signe des fèces dans le grêle et l’arrêt complet des matières et des gaz ; il prédisait le recours à la chirurgie avec un indice de concordance de 0,77 sur 100 cas. De même, un modèle plus complexe, combinant imagerie, critères de sepsis et comorbidités, atteignait une aire sous la courbe de 0,80 sur 351 cas (WSES Bologne 2017). Toutefois, ces scores complètent le jugement clinique et ne le remplacent pas.</p><div class="alert"><b>Gravité d’abord.</b> Péritonite, strangulation, ischémie (clinique ou scanner : anse fermée, paroi non rehaussée, liquide libre) : pas de traitement non opératoire, exploration chirurgicale sans délai. De plus, un <button class="w" data-k="k56-lact">lactate</button> élevé fait craindre une ischémie.</div><div class="key"><b>À retenir.</b> Contre-indications au traitement non opératoire : péritonite, strangulation, ischémie ; au scanner : anse fermée, ischémie, liquide libre ; score de Zielinski (œdème mésentérique, pas de signe des fèces, arrêt complet) : indice 0,77.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></section>
