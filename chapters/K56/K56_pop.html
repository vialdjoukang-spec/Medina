<template data-pop="pareto-k56-clinique" data-title="Loi de Pareto — Occlusion intestinale"><p class="ratio" data-cover="k56-3,k56-4,k56-5,k56-6,k56-8"></p><ul><li>On cherche d’emblée une péritonite, une strangulation et une ischémie.</li><li>On préfère le scanner à la radiographie.</li><li>Brides sans gravité : à jeun, sonde, réhydratation, potassium.</li><li>Contraste hydrosoluble : radiographie à 24 h.</li><li>Limite du traitement non opératoire ≈ 72 h.</li><li>Le volvulus du sigmoïde se détord par endoscopie, puis s’opère par sigmoïdectomie.</li></ul></template>
<template data-pop="pareto-k56-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k56-e-1,k56-e-2"></p><ul><li>On dose le lactate et le potassium.</li><li>On fait un scanner en cas de doute ou de gravité.</li><li>Contraste hydrosoluble : contrôle à 24 h.</li><li>Le volvulus dessine un grain de café sur la radiographie.</li></ul></template>
<template data-pop="pareto-k56-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k56-p-1,k56-p-2,k56-p-3"></p><ul><li>On réhydrate et l’on corrige le potassium.</li><li>Contraste hydrosoluble, contrôle à 24 h.</li><li>On ne donne pas de métoclopramide.</li><li>On surveille le lactate et la diurèse.</li></ul></template>

<template data-pop="k56-occl" data-title="Occlusion intestinale"><p class="lab">Signes</p><p>Elle associe une douleur, des vomissements, une distension et un arrêt des matières et des gaz.</p><p class="lab">Mécanique</p><p>L’obstacle est une bride, une tumeur, un volvulus, une invagination, un calcul ou une hernie.</p><p class="lab">Fonctionnelle</p><p>Dans l’iléus paralytique, il n’y a pas d’obstacle.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></template>

<template data-pop="k56-volv" data-title="Volvulus du sigmoïde"><p class="lab">Mécanisme</p><p>Le sigmoïde tourne autour de son méso et forme une anse fermée.</p><p class="lab">Diagnostic</p><p>La radiographie montre un grain de café ; on fait un scanner en cas de doute, d’ischémie ou de perforation (WSES 2023, 1C).</p><p class="lab">Traitement</p><p>On détord par endoscopie, puis on fait la sigmoïdectomie pendant la même hospitalisation, car la récidive est fréquente ; en cas d’échec, d’ischémie ou de perforation, on résèque en urgence.</p><figure><img src="data:image/gif;base64,R0lGODdh/gFwAoUAAP////j4+Ozs7OLi4tvb29XV1c7OzsXFxcDAwLm5ubGxsa2traenp6GhoZ6enpmZmZOTk4+Pj4uLi4WFhYKCgn5+fnp6end3d3R0dHFxcW9vb2tra2dnZ2RkZGBgYFxcXFlZWVVVVU9PT0hISEJCQj8/Pzw8PDg4ODU1NTExMSoqKhoaGg4ODg0NDQgICAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAA/gFwAkAI/wBfCBxIsKDBgwgTKkzowsXChxAjSpxIsaLFixgzatzIsaPHgQ4/ihxJssWIkyRKmECRoqWKFChEhPDQgcMGDTcz6NypE8MFDEAzbKBpU4NPCxUoTJCwNMKDpw0YLFBAVQGCAgMGEChAoOsAAVm7cvWatayAs2jRBlgbAIDbt3Djyp1Lty4Atnjz6t27VkDftIADCz5btnDhrogTj93K1axhsGINGDhA+QCCywkyU13AoIEDzw4+M+gcOvSDCBIiQICQ+rQEphQqYNBg9IKFDBcuDAUhYoSI3yeDCx9OvLjxk8CP/07ue7nz5s5/h5hOfToIEB+yc7iwlGlSDBw82P/cMH6D+Zy2K6hfr/R16gio4cuH8DR01NFSF0xVkOCy/8uVBTgZZQAGSCACmSWggH4MjuYZfvg10EBIBbmwUkspqKDhhhqa0FwIH3ggYgcklkiTiBx08IF0IIZYk3kZYKBTBUutVt9nUfGHYGb+CSjZj0BKVsCQZBn21WCB8aUkkkYm5uSTUCq2mFiMDUmklYwFOaRkBwBZAJcGCmmllWAeiJmCnOHH2QIJpNmAAp155tpqdEIQ32sTdMeUe+pNUIEFGqRIYnnmpfhBCL35VlxKKplQwqOPmiApCZRW+milJByn6abGReepTIiCWt10HmxgQWwWXJABBx9gJ96L5tX/dkFSFLTnnnuqQVAajhJCuF9VDDJY1bDELgghhA7YGR98t946AQUUEuRChhxuuMK1K6hgAqXNXYdddq2CACJvKWX64bcjcmBUUnm+Np+u9o021X4JFghmkFpiiZiRhSHpL2FRjunlmGTiawDBCH9pML4GNvwjZWIq/PCOaObnoGlP0ZnxasvSiRpTeYbcrnsiP/tnbrkJtYFO5HEgrqfVJQeppCfUfAIKOOdss8067+zzCZIGLfTQREsK6cyQYlopp0xD5xwIHWhgW4wadCDuBySOeJNP6fX5Gsfw1fnArhLyChqOavKnmdoLPKBrA26zFtufFiBV908qnxftQCxU/4vt39em4Ki5ny5HAs6OlkA4qNfRdBNtXCM1AX1u19err1QlyON/Di8cccL6RrnvYVoFTHC+oIP+I8ILS3zwl6wPeODam+l3bJwOb <template data-pop="k56-strang" data-title="Strangulation"><p class="lab">Définition</p><p>L’occlusion compromet la vascularisation de l’anse.</p><p class="lab">Clinique</p><p>L’examen n’en détecte que 48 %.</p><p class="lab">Imagerie</p><p>Scanner ≈ 90 % d’exactitude ; anse fermée, paroi non rehaussée, liquide libre.</p><p class="lab">Conduite</p><p>On opère sans délai, car l’anse se nécrose.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></template>
<template data-pop="k56-anse" data-title="Anse fermée"><p class="lab">Définition</p><p>Segment intestinal occlus à ses deux extrémités.</p><p class="lab">Danger</p><p>L’anse se distend sans pouvoir se décomprimer et comprime son mésentère, ce qui provoque une ischémie.</p><p class="lab">Conduite</p><p>On opère sans délai (WSES).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></template>

<template data-pop="k56-hydro" data-title="Produit de contraste hydrosoluble"><p class="lab">Usage</p><p>On l’administre par la sonde, puis on fait une radiographie à 24 h.</p><p class="lab">Interprétation</p><p>Côlon atteint : levée de l’occlusion ; non atteint : échec très probable du traitement non opératoire.</p><p class="lab">Effets</p><p>Prédit la chirurgie, raccourcit le séjour, peut-être thérapeutique (WSES IB).</p><p class="lab">Dose</p><p>La WSES ne précise pas la dose, et aucune FI suisse n’a été trouvée (TODO).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></template>
<template data-pop="k56-lact" data-title="Lactate"><p class="lab">Place</p><p>Il fait partie du bilan minimal de l’occlusion (WSES) et du volvulus (WSES 2023), car il signale l’ischémie.</p><p class="lab">Sens</p><p>Marqueur d’hypoperfusion : son élévation fait craindre une ischémie intestinale.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10186802/" target="_blank" rel="noopener">Tian B.W.C.A. et al., WSES consensus guidelines on sigmoid volvulus management, World J Emerg Surg 2023;18:34</a>.</p></template>
<template data-pop="k56-zielinski" data-title="Score de Zielinski"><p class="lab">Éléments</p><p>Il combine l’œdème du mésentère, l’absence de signe des fèces dans le grêle et l’arrêt complet des matières et des gaz.</p><p class="lab">Performance</p><p>Son indice de concordance est de 0,77 (100 cas).</p><p class="lab">Limite</p><p>Aide à la décision, ne remplace pas la clinique.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></template>
<template data-pop="k56-sng" data-title="Traitement non opératoire"><p class="lab">Composantes</p><p>Le patient reste à jeun et reçoit une sonde nasogastrique ou intestinale longue, une réhydratation intraveineuse, une correction des électrolytes et une nutrition, et l’on prévient l’inhalation.</p><p class="lab">Durée</p><p>≈ 72 h considérées comme sûres (WSES IIB).</p><p class="lab">Succès</p><p>70-90 %.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></template>
<template data-pop="k56-adhesio" data-title="Adhésiolyse et prévention"><p class="lab">Geste</p><p>Section des adhérences, par laparotomie ou laparoscopie chez des patients sélectionnés.</p><p class="lab">Risque</p><p>La laparoscopie cause des plaies intestinales dans 6,3-26,9 % des cas.</p><p class="lab">Prévention</p><p>On préfère la chirurgie mini-invasive et l’on peut utiliser le hyaluronate-carboxyméthylcellulose (RR 0,49 de réopération en chirurgie colorectale) ou l’icodextrine 4 %.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6006983/" target="_blank" rel="noopener">ten Broek R.P.G. et al., Bologna guidelines for diagnosis and management of adhesive small bowel obstruction (ASBO): 2017 update of the evidence-based guidelines from the WSES ASBO working group, World J Emerg Surg 2018;13:24</a>.</p></template>
<template data-pop="k56-sems" data-title="Prothèse colique métallique"><p class="lab">Indication</p><p>Cancer du côlon gauche occlusif : palliation, ou pont vers une chirurgie programmée dans des cas choisis.</p><p class="lab">Bénéfices</p><p>Elle réduit les stomies et améliore les résultats à court terme.</p><p class="lab">Risques</p><p>Elle perfore jusqu’à 13 % des cas, et son effet oncologique reste incertain.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6090779/" target="_blank" rel="noopener">Pisano M. et al., 2017 WSES guidelines on colon and rectal cancer emergencies: obstruction and perforation, World J Emerg Surg 2018;13:36</a>.</p></template>
<template data-pop="k56-d-mcp" data-title="Métoclopramide (Paspertin®)"><p class="lab">Mécanisme</p><p>C’est un antiémétique prokinétique.</p><p class="lab">Contre-indication</p><p>Hémorragie digestive, occlusion ou perforation intestinale, notamment quand la stimulation de la motricité est dangereuse.</p><p class="lab">Dose maximale</p><p>On ne dépasse pas 30 mg/j ou 0,5 mg/kg/j, avec au moins 6 h entre deux prises.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Paspertin®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
