<template data-pop="d84-science-reading" data-title="Fonction immunitaire : pourquoi le nombre ne suffit pas"><p>Une numération compte des cellules ; un dosage mesure une concentration. Aucun des deux ne prouve qu’une cellule ou un anticorps remplit sa fonction.</p><p>Trois exemples le montrent. Dans la granulomatose septique chronique, les neutrophiles sont nombreux, mais leur explosion oxydative manque ; seul le test à la dihydrorhodamine, mesuré deux fois, la révèle (ESID 2019). Dans le déficit immunitaire commun variable, des lymphocytes B circulent, mais les réponses vaccinales ou les lymphocytes B mémoire commutés font défaut (ESID 2019). Chez le nouveau-né atteint de déficit combiné sévère, les IgG peuvent être normales parce qu’elles sont maternelles (recommandations suisses du dépistage néonatal, 2020).</p><p>Le choix du test fonctionnel découle donc du germe et du compartiment suspecté. Les médicaments, une infection récente et une substitution déjà reçue modifient l’interprétation ; les causes secondaires sont exclues avant toute attribution héréditaire (ESID 2019).</p><div class="key"><b>À retenir.</b> Un nombre normal ne prouve pas une fonction normale ; le germe en cause désigne le test fonctionnel utile.</div></template>
<template data-pop="pareto-d84-sciences-revision" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="d84-sa,d84-si,d84-sg"></p><ul><li>Les TREC et les KREC sont des cercles d’ADN excisés lors du réarrangement des récepteurs : ils mesurent la production thymique et médullaire (dépistage néonatal suisse depuis 2019).</li><li>Les IgG maternelles protègent jusqu’à 3 à 6 mois et peuvent masquer un déficit combiné sévère ; des lymphocytes T maternels peuvent s’implanter chez l’enfant.</li><li>Rate : lymphocytes B mémoire à IgM et réponse aux polysaccharides ; asplénie = germes encapsulés, corps de Howell-Jolly.</li><li>Ligand de CD40 indispensable à la commutation de classe ; demi-vie des IgG de 3 à 4 semaines, d’où le rythme des perfusions.</li><li>NADPH oxydase = explosion oxydative ; granulomatose septique chronique : <i>S. aureus</i>, <i>Aspergillus</i>, salmonelles.</li><li>Trois voies du complément → C3 → C5 → C5b-9 ; C3 = encapsulés, C5–C9 = <i>Neisseria</i>, voie classique précoce = lupus.</li><li>Inhibiteur de la C1 estérase : frein de C1r, C1s, kallicréine et XIIa ; son déficit libère la bradykinine (récepteur B2), que l’enzyme de conversion dégrade normalement.</li><li>IL2RG (lié à l’X) : T−B+NK− ; RAG1/2 : T−B−NK+ ; ADA : T−B−NK− ; BTK, CD40LG, CYBB liés à l’X ; SERPING1 dominant, 20 à 25 % de novo.</li></ul></template>
