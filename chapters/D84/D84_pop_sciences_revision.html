<template data-pop="d84-science-reading" data-title="Fonction immunitaire : pourquoi le nombre ne suffit pas"><p>Une numération décrit une quantité de cellules. Un dosage décrit une concentration. Aucun de ces résultats ne garantit à lui seul une réponse efficace à l’agent infectieux.</p><p>Le phénotypage distingue certaines populations. Les tests stimulés évaluent une capacité de réponse. Les anticorps spécifiques explorent une autre fonction. L’âge, les médicaments, les infections récentes et une substitution déjà reçue influencent leur interprétation.</p><p>Un patient avec neutrophiles nombreux peut présenter un défaut de leur activité oxydative. Un patient avec lymphocytes B présents peut avoir une réponse humorale altérée. L’histoire infectieuse détermine les questions que le laboratoire doit examiner.</p><p>Le bilan se discute avec une expertise immunologique lorsque les résultats ou le tableau restent discordants. Une cause acquise doit aussi être recherchée avant une attribution héréditaire.</p><div class="key"><b>À retenir.</b> Le résultat répond à une question précise. Son interprétation exige les autres informations du patient.</div></template>
<template data-pop="pareto-d84-sciences-revision" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="d84-sa,d84-si,d84-sg">Les parties reliées ci-dessous expliquent les mécanismes essentiels à cette synthèse.</p><ul><li>L’anatomie décrit les lieux ; l’immunologie précise ce que les cellules peuvent effectivement y accomplir.</li><li>Une immunité efficace dépend d’une réponse coordonnée, pas d’un chiffre unique dans une prise de sang.</li><li>Le gène apporte une explication possible ; sa concordance avec la fonction et la clinique lui donne sa valeur.</li></ul></template>
