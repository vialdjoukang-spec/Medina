<section class="ilot" id="d84-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 34 ans a eu quatre pneumonies en trois ans, deux sinusites traitées chaque hiver et une diarrhée chronique à <i>Giardia</i>. Elle a aussi une thrombopénie auto-immune. Quatre questions structurent le cours : <b>ces infections révèlent-elles un déficit immunitaire, quel compartiment de l’immunité est touché, comment le prouver, et quel traitement réduira les infections et les complications ?</b></p>
<p>À la fin du cours, le médecin assistant relie le type d’infection au compartiment déficitaire, exclut d’abord une cause secondaire, demande le bilan de première ligne, reconnaît les tableaux majeurs (déficit immunitaire commun variable, agammaglobulinémie, déficit sélectif en IgA, déficit immunitaire combiné sévère, granulomatose septique chronique, déficits du complément, angio-œdème héréditaire) et pose l’indication d’une substitution en immunoglobulines selon l’information professionnelle suisse.</p>
<div class="key"><b>Prérequis.</b> Les <button class="w" data-k="d84-comp">compartiments de l’immunité (anticorps, lymphocytes T, phagocytes, complément)</button> et la <button class="w" data-k="d84-germes">correspondance entre type d’infection et compartiment</button>. L’onglet Sciences fondamentales les développe.</div>
</section>

<section class="ilot" id="d84-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Les déficits immunitaires <b>primaires</b> sont aujourd’hui appelés <button class="w" data-k="d84-iei">erreurs innées de l’immunité</button>. Ils résultent par définition de variants délétères d’un seul gène et se manifestent par une susceptibilité accrue aux infections, mais aussi par de l’auto-immunité, de l’auto-inflammation, de l’allergie, une insuffisance médullaire ou des cancers (IUIS 2024). La classification de l’International Union of Immunological Societies recense <b>508 gènes</b> et 17 phénocopies, réparties en dix tableaux (IUIS 2024). Individuellement rares, ces maladies ne le sont pas collectivement.</p>
<p>Les déficits <b>secondaires</b> résultent d’une cause acquise : infection, perte protéique, médicament, hémopathie maligne (ESID 2019). Leur exclusion fait partie de tous les critères diagnostiques de l’ESID.</p>
<h3>1.1 Classification IUIS simplifiée, selon le compartiment</h3>
<table class="t"><tr><th>Groupe IUIS</th><th>Exemples</th><th>Infections et manifestations typiques</th></tr>
<tr><td><b>Déficits prédominants de l’immunité humorale</b></td><td>Agammaglobulinémie liée à l’X, déficit immunitaire commun variable, déficit sélectif en IgA</td><td>Infections bactériennes, notamment sinopulmonaires ; auto-immunité dans le déficit immunitaire commun variable</td></tr>
<tr><td><b>Déficits combinés</b>, isolés ou syndromiques</td><td>Déficit immunitaire combiné sévère, déficit en ligand de CD40, syndrome de Wiskott-Aldrich, microdélétion 22q11.2</td><td>Infections bactériennes, virales, fongiques et opportunistes graves dès la première année</td></tr>
<tr><td><b>Défauts du nombre ou de la fonction des phagocytes</b></td><td>Granulomatose septique chronique, neutropénies congénitales</td><td>Infections profondes bactériennes ou fongiques, granulomes</td></tr>
<tr><td><b>Déficits du complément</b></td><td>Voie classique (C1q, C2, C4), C3, Voie terminale C5 à C9, déficit en inhibiteur de la C1 estérase</td><td>Germes encapsulés, lupus, infections à <i>Neisseria</i>, angio-œdème</td></tr>
<tr><td><b>Dysrégulation immunitaire</b></td><td>Haplo-insuffisance de CTLA-4, déficit en LRBA</td><td>Cytopénies auto-immunes, entéropathie, pneumopathie interstitielle, infiltration lymphocytaire</td></tr></table>
<p>Le tableau regroupe les cinq groupes utiles en pratique clinique, d’après les tableaux de l’IUIS 2024. La colonne de droite prépare le raisonnement du § 3 : le type d’infection oriente vers le compartiment atteint.</p>
</section>

<section class="ilot" id="d84-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Le <b>déficit immunitaire combiné sévère</b> toucherait environ 1 naissance vivante sur 50 000, et les lymphopénies T sévères d’autre origine environ 1 sur 10 000 (recommandations suisses du dépistage néonatal, 2020). Sans traitement, les déficits T sévères sont habituellement mortels au cours de la première année ; un diagnostic précoce suivi d’une greffe de cellules souches hématopoïétiques dans un centre expérimenté, avant toute infection, permet des taux de guérison de <b>80 à 95 %</b>. C’est la raison du <button class="w" data-k="d84-trec">dépistage néonatal suisse par les TREC et les KREC</button>, en place depuis le 1<sup>er</sup> janvier 2019.</p>
<p>Les déficits du complément représentent 1 à 10 % des déficits primaires déclarés aux registres internationaux (ESID et ERN RITA, 2020). Les prévalences du déficit immunitaire commun variable et du déficit sélectif en IgA varient fortement selon les registres nationaux ; aucune source suisse ou européenne relue pour cette révision ne fournit de chiffre fiable : lacune nommée.</p>
<p>Le pronostic du déficit immunitaire commun variable dépend surtout des complications non infectieuses, comme la lymphoprolifération, les cytopénies auto-immunes ou la maladie granulomateuse (IUIS 2024), et des <b>bronchectasies</b>.</p>
</section>

<section class="ilot" id="d84-3"><h2><span class="n">3</span>Physiopathologie : quel compartiment, quels germes</h2>
<p>Chaque compartiment défend contre une famille de pathogènes. Cette correspondance est l’outil diagnostique le plus utile : <b>le type d’infection oriente vers le compartiment</b>.</p>

<p>Au-delà des infections, une erreur innée de l’immunité est souvent une <b>maladie de la régulation</b>. Le déficit immunitaire commun variable associe fréquemment lymphoprolifération polyclonale, cytopénies auto-immunes ou maladie granulomateuse ; les déficits précoces de la voie classique du complément exposent au lupus (IUIS 2024).</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Les IgG maternelles traversent le placenta et protègent temporairement le nourrisson : un déficit isolé des lymphocytes B se manifeste habituellement vers <b>3 à 6 mois</b>, lorsque ces anticorps ont disparu. Un déficit T sévère se manifeste au contraire dès les premières semaines ou les premiers mois (recommandations suisses du dépistage néonatal, 2020). Voir l’<button class="w" data-k="d84-nadir">évolution des IgG du nourrisson</button>.</div>
</section>

<section class="ilot" id="d84-4"><h2><span class="n">4</span>Déficits secondaires : à exclure d’abord</h2>
<p>Les critères de l’ESID exigent l’exclusion des causes secondaires d’hypogammaglobulinémie : infection, perte protéique, médicament, hémopathie maligne (ESID 2019). Le tableau détaille ces causes et leur source.</p>
<table class="t"><tr><th>Cause</th><th>Mécanisme et indice</th></tr>
<tr><td><b>Médicaments</b></td><td>Rituximab et autres anti-CD20 : IgG sous la limite inférieure de la normale chez environ 60 % des patients pendant un traitement d’entretien de 2 ans dans le lymphome folliculaire ; antiépileptiques (phénytoïne, carbamazépine, lamotrigine) : hypogammaglobulinémie mentionnée dans leurs informations professionnelles suisses ; clozapine : granulocytopénie (3 %) et agranulocytose (0,7 %) ; immunosuppression maternelle pendant la grossesse (azathioprine, rituximab) : KREC bas au dépistage néonatal</td></tr>
<tr><td><b>Hémopathies malignes</b></td><td>Cause secondaire à exclure avant tout diagnostic primaire (ESID 2019)</td></tr>
<tr><td><b>Pertes protéiques</b></td><td>Fuite rénale ou digestive : IgG et albumine basses ensemble</td></tr>
<tr><td><b>Infection par le VIH</b></td><td>Exclusion exigée par les critères du déficit combiné sévère (ESID 2019) ; une sérologie VIH accompagne tout bilan</td></tr>
<tr><td><b>Asplénie</b></td><td>Splénectomie, drépanocytose : corps de Howell-Jolly au frottis (ESID 2019) ; absence de lymphocytes B mémoire à IgM et mauvaise réponse aux polysaccharides, d’où les infections à germes encapsulés (étude de Kruetzmann, 2003)</td></tr></table>
<div class="trap"><span class="k">Piège</span>Chez un adulte, une hypogammaglobulinémie découverte récemment est <b>secondaire jusqu’à preuve du contraire</b>. La liste des médicaments, la recherche d’une perte protéique et d’une hémopathie maligne précèdent toute hypothèse génétique.</div>
</section>

<section class="ilot" id="d84-5"><h2><span class="n">5</span>Anamnèse et signes d’appel</h2>
<p>L’anamnèse cherche le <b>profil infectieux</b> : nombre, localisation, sévérité, germes, réponse aux antibiotiques. Les définitions de travail de l’ESID décrivent, pour chaque déficit, les manifestations qui doivent le faire évoquer. Le tableau les rassemble.</p>
<table class="t"><tr><th>Signes d’appel</th><th>Déficit à évoquer</th></tr>
<tr><td>Susceptibilité accrue aux infections, auto-immunité, maladie granulomateuse, lymphoprolifération polyclonale inexpliquée, apparenté atteint de déficit en anticorps</td><td>Déficit immunitaire commun variable</td></tr>
<tr><td>Infections récidivantes avant 5 ans, antécédent maternel familial d’agammaglobulinémie</td><td>Agammaglobulinémie</td></tr>
<tr><td>Première année : infection bactérienne, virale ou opportuniste invasive, diarrhée persistante avec retard de croissance, apparenté atteint</td><td>Déficit immunitaire combiné sévère</td></tr>
<tr><td>Infections profondes bactériennes ou fongiques (abcès, ostéomyélite, adénite), pneumonies récidivantes, granulomes digestifs ou urinaires, colite</td><td>Granulomatose septique chronique</td></tr>
<tr><td>Infections à <i>Neisseria</i>, antécédent familial d’infection à <i>Neisseria</i></td><td>Déficit de la voie terminale du complément</td></tr>
<tr><td>Angio-œdèmes récidivants sans urticaire, douleurs abdominales avec vomissements, œdème laryngé, antécédent familial d’angio-œdème</td><td>Angio-œdème héréditaire</td></tr></table>
<p>Une infection à méningocoque de sérogroupe W-135, X, Y ou Z, rare chez le sujet sain, ou des infections répétées orientent vers un déficit terminal du complément (ESID et ERN RITA, 2020). Rechercher aussi les médicaments (§ 4), les vaccinations reçues et leur tolérance, la consanguinité, les décès précoces dans la famille et les réactions aux produits sanguins : une hypersensibilité aux immunoglobulines peut survenir chez un patient déficitaire en IgA porteur d’anticorps anti-IgA (information professionnelle suisse Privigen®).</p>
</section>

<section class="ilot" id="d84-6"><h2><span class="n">6</span>Examen clinique</h2>
<div class="two">
<div class="card"><h4>Croissance et tissu lymphoïde</h4><p>Courbe de croissance chez l’enfant ; recherche d’un tissu lymphoïde absent, chez le nourrisson suspect de déficit combiné sévère (recommandations suisses du dépistage néonatal, 2020), ou au contraire d’adénopathies et d’une splénomégalie, qui évoquent une lymphoprolifération (ESID 2019).</p></div>
<div class="card"><h4>Signes d’infection chronique</h4><p>Signes de bronchectasies, abcès, adénites, hépatosplénomégalie dans la granulomatose septique chronique (ESID 2019).</p></div>
<div class="card"><h4>Signes syndromiques (IUIS 2024)</h4><p>Eczéma et thrombopénie à petites plaquettes (Wiskott-Aldrich) ; cardiopathie conotroncale, insuffisance vélopalatine, dysmorphie faciale, hypoparathyroïdie (microdélétion 22q11.2) ; télangiectasies sclérales et ataxie (ataxie-télangiectasie) ; traits du visage caractéristiques, furoncles, abcès pulmonaires, fractures et rétention des dents de lait (syndrome hyper-IgE par déficit de STAT3) ; albinisme partiel (syndrome de Chédiak-Higashi).</p></div>
<div class="card"><h4>Dysmorphie chez le nouveau-né</h4><p>L’examen initial d’un nourrisson au dépistage anormal se fait si possible avec un généticien clinicien, à la recherche de traits dysmorphiques, d’éruptions cutanées et d’une absence de tissu lymphoïde (recommandations suisses du dépistage néonatal, 2020).</p></div></div>
