<section class="ilot" id="d84-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 34 ans a eu quatre pneumonies en trois ans, deux sinusites traitées chaque hiver et une diarrhée chronique à <i>Giardia</i>. Elle a aussi une thrombopénie auto-immune. Quatre questions structurent le cours : <b>ces infections révèlent-elles un déficit immunitaire, quel compartiment de l’immunité est touché, comment le prouver, et quel traitement réduira les infections et les complications ?</b></p>
<p>À la fin du cours, le médecin assistant relie le type d’infection au compartiment déficitaire, exclut d’abord une cause secondaire, demande le bilan de première ligne, reconnaît les tableaux majeurs (déficit immunitaire commun variable, agammaglobulinémie, déficit sélectif en IgA, déficit immunitaire combiné sévère, granulomatose septique chronique, déficits du complément, angio-œdème héréditaire) et pose l’indication d’une substitution en immunoglobulines selon l’information professionnelle suisse.</p>
<div class="key"><b>Prérequis.</b> Les <button class="w" data-k="d84-comp">compartiments de l’immunité (anticorps, lymphocytes T, phagocytes, complément)</button> et la <button class="w" data-k="d84-germes">correspondance entre type d’infection et compartiment</button>. L’onglet Sciences fondamentales les développe.</div>
</section>

<section class="ilot" id="d84-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Les déficits immunitaires <b>primaires</b> sont aujourd’hui appelés <button class="w" data-k="d84-iei">erreurs innées de l’immunité</button>. Ils résultent par définition de variants délétères d’un seul gène et se manifestent par une susceptibilité accrue aux infections, mais aussi par de l’auto-immunité, de l’auto-inflammation, de l’allergie, une insuffisance médullaire ou des cancers (IUIS 2024). La classification de l’International Union of Immunological Societies recense <b>508 gènes</b> et 17 phénocopies, réparties en dix tableaux (IUIS 2024).</p>
<p>Les déficits <b>secondaires</b> résultent d’une cause acquise : infection, perte protéique, médicament, hémopathie maligne (ESID 2019). Leur exclusion fait partie de tous les critères diagnostiques de l’ESID.</p>
<h3>1.1 Classification IUIS simplifiée, selon le compartiment</h3>
<table class="t"><tr><th>Groupe IUIS</th><th>Exemples</th><th>Infections et manifestations typiques</th></tr>
<tr><td><b>Déficits prédominants de l’immunité humorale</b></td><td>Agammaglobulinémie liée à l’X, déficit immunitaire commun variable, déficit sélectif en IgA</td><td>Infections bactériennes, notamment sinopulmonaires ; auto-immunité dans le déficit immunitaire commun variable</td></tr>
<tr><td><b>Déficits combinés</b>, isolés ou syndromiques</td><td>Déficit immunitaire combiné sévère, déficit en ligand de CD40, syndrome de Wiskott-Aldrich, microdélétion 22q11.2</td><td>Infections bactériennes, virales, fongiques et opportunistes graves dès la première année</td></tr>
<tr><td><b>Défauts du nombre ou de la fonction des phagocytes</b></td><td>Granulomatose septique chronique, neutropénies congénitales</td><td>Infections profondes bactériennes ou fongiques, granulomes</td></tr>
<tr><td><b>Déficits du complément</b></td><td>Voie classique (C1q, C2, C4), C3, Voie terminale C5 à C9, déficit en inhibiteur de la C1 estérase</td><td>Germes encapsulés, lupus, infections à <i>Neisseria</i>, angio-œdème</td></tr>
<tr><td><b>Dysrégulation immunitaire</b></td><td>Haplo-insuffisance de CTLA-4, déficit en LRBA</td><td>Cytopénies auto-immunes, entéropathie, pneumopathie interstitielle, infiltration lymphocytaire</td></tr></table>
<p>Le tableau regroupe les cinq groupes utiles en pratique clinique, d’après les tableaux de l’IUIS 2024. La colonne de droite prépare le raisonnement du § 3 : le type d’infection oriente vers le compartiment atteint.</p>
</section>

<section class="ilot" id="d84-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Le <b>déficit immunitaire combiné sévère</b> toucherait environ 1 naissance vivante sur 50 000, et les lymphopénies T sévères d’autre origine environ 1 sur 10 000 (recommandations suisses du dépistage néonatal, 2020). Sans traitement, les déficits T sévères sont habituellement mortels au cours de la première année ; un diagnostic précoce suivi d’une greffe de cellules souches hématopoïétiques dans un centre expérimenté, avant toute infection, permet des taux de guérison de <b>80 à 95 %</b>. C’est la raison du <button class="w" data-k="d84-trec">dépistage néonatal suisse par les TREC et les KREC</button>, en place depuis le 1<sup>er</sup> janvier 2019.</p>
<p>Les autres erreurs innées sont rares une à une. L’angio-œdème héréditaire par déficit en inhibiteur de la C1 estérase touche environ une personne sur 50 000 (WAO/EAACI 2021) ; la granulomatose septique chronique, environ une sur 250 000 dans la cohorte européenne de 429 patients (van den Berg, 2009). Les déficits du complément représentent 5,2 % des déficits primaires déclarés au registre de l’ESID (ESID et ERN RITA, 2020). Aucune source suisse ou européenne consultée ne publie de prévalence fiable du déficit immunitaire commun variable ni du déficit sélectif en IgA : leurs chiffres varient trop d’un registre national à l’autre.</p>
<p>Le diagnostic arrive souvent tard. Dans le registre européen de l’ESID, qui réunit 2 212 patients atteints de déficit immunitaire commun variable suivis dans 28 centres, le délai entre les premiers symptômes et le diagnostic atteignait 4 à 5 ans dans de nombreux pays ; un tiers des patients (33,7 %) avaient débuté avant l’âge de 10 ans (Gathmann, 2014). Ce retard compte, car la survie de cette cohorte dépendait précisément de l’âge au début des symptômes et de l’âge au diagnostic.</p>
<p>Le pronostic du déficit immunitaire commun variable dépend ensuite des complications non infectieuses, comme la lymphoprolifération, les cytopénies auto-immunes ou la maladie granulomateuse (IUIS 2024), et des <b>bronchectasies</b>. L’entéropathie, l’auto-immunité, les granulomes et la splénomégalie forment un ensemble lié, alors que les bronchectasies évoluent indépendamment de ces complications. Sous substitution, un taux résiduel d’IgG inférieur à 4 g/L s’associait à une évolution défavorable, et des taux plus élevés à moins d’infections bactériennes graves (Gathmann, 2014). Dans la granulomatose septique chronique, la survie moyenne atteignait 37,8 ans pour la forme liée à l’X et 49,6 ans pour la forme autosomique récessive (van den Berg, 2009).</p>
<div class="key"><b>À retenir.</b> Le déficit combiné sévère se dépiste à la naissance parce qu’une greffe précoce le guérit dans 80 à 95 % des cas. Le déficit immunitaire commun variable se diagnostique avec 4 à 5 ans de retard ; ses complications non infectieuses et ses bronchectasies font son pronostic.</div>
</section>

<section class="ilot" id="d84-3"><h2><span class="n">3</span>Physiopathologie : quel compartiment, quels germes</h2>
<p>Chaque compartiment défend contre une famille de pathogènes. Cette correspondance est l’outil diagnostique le plus utile : <b>le type d’infection oriente vers le compartiment</b>.</p>
<figure><svg viewBox="0 0 640 210" role="img" aria-label="Compartiments immunitaires et germes" font-family="Georgia,serif" font-size="11"><g fill="none" stroke="#222" stroke-width="1.2"><rect x="10" y="20" width="146" height="170" rx="8"/><rect x="170" y="20" width="146" height="170" rx="8"/><rect x="330" y="20" width="146" height="170" rx="8"/><rect x="490" y="20" width="140" height="170" rx="8"/><path d="M10 62h146M170 62h146M330 62h146M490 62h140"/></g>

<text x="243" y="38" font-weight="700">Lymphocytes T</text><text x="243" y="54">immunité cellulaire</text><text x="243" y="86">Infections virales,</text><text x="243" y="100">fongiques et</text><text x="243" y="114">opportunistes</text><text x="243" y="136">Diarrhée persistante,</text><text x="243" y="150">retard de croissance</text><text x="243" y="164">dès la 1re année</text>

<text x="560" y="38" font-weight="700">Complément</text><text x="560" y="54">voies et C1 à C9</text><text x="560" y="86"><tspan font-style="italic">Neisseria</tspan> (C5–C9)</text><text x="560" y="100">encapsulés (C3)</text><text x="560" y="122">Lupus (C1q, C2, C4)</text><text x="560" y="144">Angio-œdème</text><text x="560" y="158">(inhibiteur de C1)</text></g></svg>
<figcaption>Figure 1 — Correspondance entre compartiment déficitaire et infections, d’après la classification IUIS 2024, les définitions de l’ESID (2019) et la recommandation ESID–ERN RITA sur le complément (2020). Schéma pédagogique.</figcaption></figure>
<p>Au-delà des infections, une erreur innée de l’immunité est souvent une <b>maladie de la régulation</b>. Le déficit immunitaire commun variable associe fréquemment lymphoprolifération polyclonale, cytopénies auto-immunes ou maladie granulomateuse ; les déficits précoces de la voie classique du complément exposent au lupus (IUIS 2024).</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Les IgG maternelles traversent le placenta et protègent temporairement le nourrisson : un déficit isolé des lymphocytes B se manifeste habituellement vers <b>3 à 6 mois</b>, lorsque ces anticorps ont disparu. Un déficit T sévère se manifeste au contraire dès les premières semaines ou les premiers mois (recommandations suisses du dépistage néonatal, 2020). Voir l’<button class="w" data-k="d84-nadir">évolution des IgG du nourrisson</button>.</div>
</section>

<section class="ilot" id="d84-4"><h2><span class="n">4</span>Déficits secondaires : à exclure d’abord</h2>
<p>Une hypogammaglobulinémie peut résulter d’une production insuffisante ou d’une perte. Les critères de l’ESID exigent donc l’exclusion des causes secondaires : infection, perte protéique, médicament, hémopathie maligne (ESID 2019). Le tableau associe chaque cause à son indice.</p>
<table class="t"><tr><th>Cause</th><th>Mécanisme et indice</th></tr>
<tr><td><b>Médicaments</b></td><td>Rituximab et autres anti-CD20 : IgG sous la limite inférieure de la normale chez environ 60 % des patients pendant un traitement d’entretien de 2 ans dans le lymphome folliculaire (information professionnelle suisse MabThera®) ; antiépileptiques : hypogammaglobulinémie très rare sous carbamazépine, de fréquence inconnue sous phénytoïne et lamotrigine (informations professionnelles suisses) ; clozapine : granulocytopénie (3 %) et agranulocytose (0,7 %) ; immunosuppression maternelle pendant la grossesse (azathioprine, rituximab) : KREC bas au dépistage néonatal</td></tr>
<tr><td><b>Hémopathies malignes</b></td><td>Cause secondaire à exclure avant tout diagnostic primaire (ESID 2019)</td></tr>
<tr><td><b>Pertes protéiques</b></td><td>Fuite rénale ou digestive : IgG et albumine basses ensemble</td></tr>
<tr><td><b>Infection par le VIH</b></td><td>Exclusion exigée par les critères du déficit combiné sévère (ESID 2019) ; une sérologie VIH accompagne tout bilan</td></tr>
<tr><td><b>Asplénie</b></td><td>Splénectomie, drépanocytose : corps de Howell-Jolly au frottis (ESID 2019) ; absence de lymphocytes B mémoire à IgM et mauvaise réponse aux polysaccharides, d’où les infections à germes encapsulés (étude de Kruetzmann, 2003)</td></tr></table>
<p>Le tableau se lit avec la liste des médicaments du patient sous les yeux : c’est la cause la plus simple à vérifier. Une albumine basse avec les IgG oriente vers une perte. L’asplénie agit autrement : elle altère la réponse aux polysaccharides par la perte des lymphocytes B mémoire à IgM (étude de Kruetzmann, 2003).</p>
<div class="trap"><span class="k">Piège</span>Chez un adulte, une hypogammaglobulinémie découverte récemment est <b>secondaire jusqu’à preuve du contraire</b>. La liste des médicaments, la recherche d’une perte protéique et d’une hémopathie maligne précèdent toute hypothèse génétique.</div>
</section>

<section class="ilot" id="d84-5"><h2><span class="n">5</span>Anamnèse et signes d’alerte</h2>
<p>L’anamnèse cherche le <b>profil infectieux</b> : nombre, localisation, sévérité, germes, réponse aux antibiotiques. Une infection banale devient suspecte lorsqu’elle est trop fréquente, trop grave, trop longue ou due à un germe inhabituel. L’ESID a traduit ce principe en six signes d’alerte chez l’adulte.</p>
<table class="t"><tr><th>Signe d’alerte de l’adulte (ESID)</th><th>Ce qu’il traduit</th></tr>
<tr><td>Au moins quatre infections traitées par antibiotiques en un an (otite, bronchite, sinusite, pneumonie)</td><td>Fréquence anormale</td></tr>
<tr><td>Infections récidivantes ou antibiothérapie prolongée nécessaire</td><td>Durée anormale</td></tr>
<tr><td>Au moins deux infections bactériennes sévères (ostéomyélite, méningite, septicémie, cellulite)</td><td>Gravité anormale</td></tr>
<tr><td>Au moins deux pneumonies prouvées radiologiquement en 3 ans</td><td>Fréquence et gravité</td></tr>
<tr><td>Infection de localisation inhabituelle ou à germe inhabituel</td><td>Compartiment atypique</td></tr>
<tr><td>Déficit immunitaire primaire dans la famille</td><td>Terrain génétique</td></tr></table>
<p>Ces six signes, publiés par l’ESID (version consultée de mars 2024), servent au repérage ; ils ne constituent pas des critères diagnostiques. Ils sont centrés sur les infections, si bien qu’une auto-immunité, une maladie granulomateuse ou une entéropathie doivent aussi faire évoquer un déficit. Les définitions de travail de l’ESID précisent ensuite, pour chaque déficit, les manifestations qui doivent le faire évoquer.</p>
<table class="t"><tr><th>Signes d’appel</th><th>Déficit à évoquer</th></tr>
<tr><td>Susceptibilité accrue aux infections, auto-immunité, maladie granulomateuse, lymphoprolifération polyclonale inexpliquée, apparenté atteint de déficit en anticorps</td><td>Déficit immunitaire commun variable</td></tr>
<tr><td>Infections récidivantes avant 5 ans, antécédent maternel familial d’agammaglobulinémie</td><td>Agammaglobulinémie</td></tr>
<tr><td>Première année : infection bactérienne, virale ou opportuniste invasive, diarrhée persistante avec retard de croissance, apparenté atteint</td><td>Déficit immunitaire combiné sévère</td></tr>
<tr><td>Infections profondes bactériennes ou fongiques (abcès, ostéomyélite, adénite), pneumonies récidivantes, granulomes digestifs ou urinaires, colite</td><td>Granulomatose septique chronique</td></tr>
<tr><td>Infections à <i>Neisseria</i>, antécédent familial d’infection à <i>Neisseria</i></td><td>Déficit de la voie terminale du complément</td></tr>
<tr><td>Angio-œdèmes récidivants sans urticaire, douleurs abdominales avec vomissements, œdème laryngé, antécédent familial d’angio-œdème</td><td>Angio-œdème héréditaire</td></tr></table>
<p>Ce second tableau relie le profil clinique au compartiment. Une infection à méningocoque de sérogroupe W-135, X, Y ou Z, rare chez le sujet sain, ou des infections à <i>Neisseria</i> répétées orientent vers un déficit terminal du complément (ESID et ERN RITA, 2020). Le médecin recherche aussi les médicaments (§ 4), les vaccinations reçues et leur tolérance, la consanguinité, les décès précoces dans la famille et les réactions aux produits sanguins. Une hypersensibilité aux immunoglobulines peut en effet survenir chez un patient déficitaire en IgA porteur d’anticorps anti-IgA (information professionnelle suisse Privigen®).</p>
</section>

<section class="ilot" id="d84-6"><h2><span class="n">6</span>Examen clinique</h2>
<div class="two">
<div class="card"><h4>Croissance et tissu lymphoïde</h4><p>Chez l’enfant, le médecin reporte le poids et la taille sur la courbe de croissance. Il recherche un tissu lymphoïde absent chez le nourrisson suspect de déficit combiné sévère (recommandations suisses du dépistage néonatal, 2020). À l’inverse, des adénopathies et une splénomégalie évoquent une lymphoprolifération (ESID 2019).</p></div>
<div class="card"><h4>Signes d’infection chronique</h4><p>L’auscultation cherche les signes de bronchectasies. Des abcès, des adénites et une hépatosplénomégalie orientent vers une granulomatose septique chronique (ESID 2019) ; dans la cohorte européenne, la maladie atteignait les poumons chez 66 % des patients, la peau chez 53 % et les ganglions chez 50 % (van den Berg, 2009).</p></div>
<div class="card"><h4>Signes syndromiques (IUIS 2024)</h4><p>Certains signes associés désignent un syndrome précis. Eczéma et thrombopénie à petites plaquettes (Wiskott-Aldrich) ; cardiopathie conotroncale, insuffisance vélopalatine, dysmorphie faciale, hypoparathyroïdie (microdélétion 22q11.2) ; télangiectasies sclérales et ataxie (ataxie-télangiectasie) ; traits du visage caractéristiques, furoncles, abcès pulmonaires, fractures et rétention des dents de lait (syndrome hyper-IgE par déficit de STAT3) ; albinisme partiel (syndrome de Chédiak-Higashi).</p></div>
<div class="card"><h4>Dysmorphie chez le nouveau-né</h4><p>L’examen initial d’un nourrisson au dépistage anormal se fait si possible avec un généticien clinicien, à la recherche de traits dysmorphiques, d’éruptions cutanées et d’une absence de tissu lymphoïde (recommandations suisses du dépistage néonatal, 2020).</p></div></div>
