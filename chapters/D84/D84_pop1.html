<template data-pop="d84-comp" data-title="Les compartiments de l’immunité">
<p><b>Humoral</b> : lymphocytes B et anticorps. <b>Cellulaire</b> : lymphocytes T. <b>Phagocytaire</b> : neutrophiles et macrophages. <b>Complément</b> : cascade protéique plasmatique organisée en voies classique, alterne et des lectines, qui convergent vers le clivage de C3 (ESID et ERN RITA, 2020). La classification IUIS 2024 ajoute la dysrégulation immunitaire, l’immunité innée et intrinsèque, l’auto-inflammation et l’insuffisance médullaire. Un déficit sévère des lymphocytes T compromet aussi la réponse anticorps : la plupart des déficits T sont combinés.</p></template>
<template data-pop="d84-germes" data-title="Règle : le type d’infection oriente vers le compartiment">
<p>Infections bactériennes sinopulmonaires récidivantes : anticorps. Infections virales, fongiques ou opportunistes graves dès la première année, diarrhée persistante, retard de croissance : lymphocytes T (recommandations suisses du dépistage néonatal, 2020). Infections profondes bactériennes ou fongiques, abcès, granulomes : phagocytes (ESID 2019). Infections à <i>Neisseria</i> : voie terminale du complément ; germes encapsulés : C3 et voie classique (ESID et ERN RITA, 2020). Cette règle oriente le bilan ; elle ne remplace pas les tests fonctionnels.</p></template>
<template data-pop="d84-iei" data-title="Erreurs innées de l’immunité">
<p>Terme actuel des déficits immunitaires primaires. Ces maladies résultent par définition de variants délétères d’un seul gène et peuvent se traduire par des infections, mais aussi par de l’auto-immunité, de l’auto-inflammation, de l’allergie, une insuffisance médullaire ou des cancers. La classification IUIS 2024 recense 508 gènes et 17 phénocopies (auto-anticorps neutralisants ou variants somatiques), répartis en dix tableaux.</p></template>
<template data-pop="d84-trec" data-title="Dépistage néonatal suisse par les TREC et les KREC">
<p>Les TREC sont de petits fragments d’ADN circulaires produits lors de la recombinaison du gène du récepteur des lymphocytes T dans le thymus ; leur nombre reflète la production de lymphocytes T naïfs. Les KREC jouent le même rôle pour les lymphocytes B. Depuis le 1<sup>er</sup> janvier 2019, le dépistage néonatal suisse les mesure par PCR quantitative sur le carton de Guthrie, au laboratoire central de Zurich. Un TREC indétectable impose une consultation d’immunologie dans les 24 à 48 heures ; un TREC bas mais détectable, dans les 72 heures ; un KREC bas, un second carton 10 à 14 jours plus tard. Le test manque certains déficits fonctionnels et ne dépiste ni les déficits des neutrophiles ni ceux du complément (recommandations suisses, 2020).</p></template>
<template data-pop="d84-nadir" data-title="IgG du nourrisson : la protection maternelle">
<p>Les IgG maternelles traversent le placenta et protègent temporairement le nourrisson. Un nourrisson atteint d’un déficit isolé des lymphocytes B reste donc protégé malgré l’absence de production propre ; les symptômes, surtout respiratoires, apparaissent vers 3 à 6 mois, quand les anticorps maternels ont disparu (recommandations suisses du dépistage néonatal, 2020). Les IgG d’un nourrisson atteint de déficit combiné sévère peuvent ainsi paraître normales. L’hypogammaglobulinémie transitoire du nourrisson associe IgG et IgA basses et une réponse vaccinale normale (IUIS 2024).</p></template>
<template data-pop="d84-ig" data-title="Dosage des immunoglobulines">
<div class="lab">Mesure</div><p>IgG, IgA, IgM ; IgA mesurées en néphélométrie pour affirmer un déficit sélectif (&lt; 0,07 g/L) (ESID 2019).</p>
<div class="lab">Interprétation</div><p>Comparer aux normes de l’âge : une baisse marquée correspond à moins de 2 écarts-types ; confirmer par une seconde mesure (ESID 2019).</p>
<div class="lab">Pièges</div><p>Prélèvement après des immunoglobulines ou des produits sanguins ; perte protéique ; IgG du nourrisson d’origine maternelle (recommandations suisses, 2020).</p></template>
<template data-pop="d84-vacc" data-title="Réponses vaccinales">
<p>Les critères de l’ESID retiennent une mauvaise réponse vaccinale lorsqu’aucun titre protecteur n’est atteint malgré la vaccination, là où ces titres sont définis ; l’absence d’isohémagglutinines constitue une alternative. En Suisse, les corrélats de protection de l’OFSP (2025) sont : anticorps antitétaniques ≥ 100 UI/L (courte durée) et ≥ 1 000 UI/L (durable) ; IgG antipneumococciques par sérotype ≥ 0,5 mg/L (courte durée) et ≥ 1 mg/L (durable). Les informations professionnelles suisses des immunoglobulines définissent l’échec prouvé de la réponse vaccinale comme l’absence de doublement des anticorps IgG après un vaccin antipneumococcique polysaccharidique et protéique.</p></template>
<template data-pop="d84-cyto" data-title="Phénotypage lymphocytaire">
<p>Cytométrie de flux des lymphocytes T (CD3, CD4, CD8, sous-populations naïves comme les CD4 naïfs récemment émigrés du thymus), B (CD19) et NK. Les valeurs absolues s’interprètent selon l’âge. Chez le nourrisson dépisté, CD3 ≤ 1 500/µL avec CD4 naïfs ≤ 200/µL fait suspecter un déficit combiné sévère (recommandations suisses, 2020). Lymphocytes B &lt; 2 % : agammaglobulinémie ; lymphocytes B mémoire commutés &lt; 70 % de la normale pour l’âge : critère du déficit immunitaire commun variable (ESID 2019).</p></template>
<template data-pop="d84-ch50" data-title="Activités fonctionnelles du complément">
<p>Les tests hémolytiques mesurent la quantité de sérum nécessaire pour lyser 50 % d’un échantillon de globules rouges : voie classique (CH50) et voie alterne (AH50) ; des tests immunoenzymatiques explorent aussi la voie des lectines (ESID et ERN RITA, 2020). Voie classique abolie avec voie alterne normale : déficit en C1q, C1r, C1s, C4 ou C2. Les deux voies abolies : déficit en C3 ou en composant terminal (IUIS 2024 ; ESID 2019). Une activité basse peut aussi traduire une consommation ; les fragments d’activation aident à trancher (ESID et ERN RITA, 2020).</p></template>
<template data-pop="d84-dhr" data-title="Test à la dihydrorhodamine">
<p>Le test explore l’explosion oxydative des neutrophiles stimulés, mesurée par cytométrie de flux ; le test au nitrobleu de tétrazolium est une alternative. Une explosion oxydative absente ou nettement diminuée, mesurée au moins deux fois, est exigée pour le diagnostic de granulomatose septique chronique (ESID 2019). Le défaut porte sur la NADPH oxydase, qui produit l’anion superoxyde (IUIS 2024).</p></template>
<template data-pop="d84-aoh" data-title="Angio-œdème héréditaire">
<div class="lab">Mécanisme</div><p>Déficit quantitatif (type 1, environ 85 %) ou fonctionnel (type 2) en inhibiteur de la C1 estérase : production excessive de bradykinine et activation de ses récepteurs B2. Il existe aussi des formes à inhibiteur normal, liées notamment au facteur XII, à l’angiopoïétine 1, au plasminogène ou au kininogène 1 (recommandation WAO/EAACI 2021).</p>
<div class="lab">Clinique</div><p>Œdèmes cutanés, abdominaux et des voies aériennes supérieures, sans urticaire ; une crise laryngée peut asphyxier. Déclencheurs : traumatismes et gestes sur les voies aérodigestives, œstrogènes, inhibiteurs de l’enzyme de conversion, stress, maladie fébrile.</p>
<div class="lab">Diagnostic</div><p>Inhibiteur de la C1 estérase en taux et en fonction, et C4, chez tout patient suspect ; confirmation par une seconde mesure ; C1q souvent bas dans la forme acquise, associée à un lymphome ou à une gammapathie monoclonale (recommandation WAO/EAACI 2021).</p>
<div class="lab">Traitement</div><p>Voir la fiche de pharmacologie ; plan de traitement écrit et médicament de crise pour au moins deux crises, porté en permanence.</p></template>
