<template data-pop="d84-comp" data-title="Les quatre compartiments de l’immunité">
<p><b>Humoral</b> : lymphocytes B et anticorps. <b>Cellulaire</b> : lymphocytes T. <b>Phagocytaire</b> : neutrophiles et macrophages. <b>Complément</b> : cascade protéique plasmatique. Un déficit touche un ou plusieurs compartiments ; les déficits T sont presque toujours combinés.</p></template>
<template data-pop="d84-germes" data-title="Règle : le germe désigne le compartiment">
<p>Bactéries encapsulées, sinusites et pneumonies : anticorps. Opportunistes, virus, <i>Candida</i>, début précoce : lymphocytes T. Staphylocoque, <i>Aspergillus</i>, abcès : phagocytes. <i>Neisseria</i> récidivant : complément terminal. Mycobactéries atypiques ou BCG disséminé : axe IL-12 – interféron gamma.</p></template>
<template data-pop="d84-iei" data-title="Erreurs innées de l’immunité">
<p>Terme actuel des déficits immunitaires primaires : maladies génétiques de l’immunité, incluant les déficits (infections) mais aussi la dysrégulation (auto-immunité, inflammation, allergie, cancer). Classification IUIS 2024 : plus de 500 gènes, dix groupes.</p></template>
<template data-pop="d84-trec" data-title="Dépistage néonatal par les TREC">
<p>Les TREC (T-cell receptor excision circles) sont des fragments d’ADN circulaires produits lors du réarrangement du récepteur des lymphocytes T dans le thymus : ils reflètent la production de lymphocytes T naïfs. Un taux bas ou nul sur le carton de Guthrie fait suspecter un déficit combiné sévère ; confirmation par phénotypage lymphocytaire. Intégré au dépistage néonatal suisse.</p></template>
<template data-pop="d84-nadir" data-title="IgG du nourrisson : le nadir physiologique">
<p>Les IgG maternelles traversent le placenta (surtout au troisième trimestre ; prématurés moins protégés) et disparaissent en quelques mois (demi-vie d’environ 3 semaines). La production propre démarre lentement : les IgG totales passent par un minimum vers 3 à 6 mois. D’où le début des déficits humoraux après 6 mois et l’existence d’une hypogammaglobulinémie transitoire du nourrisson.</p></template>
<template data-pop="d84-ig" data-title="Dosage des immunoglobulines">
<div class="lab">Méthode</div><p>Néphélométrie ou turbidimétrie ; IgG, IgA, IgM ; IgE séparément.</p>
<div class="lab">Interprétation</div><p>Normes selon l’âge ; répéter une valeur anormale ; toujours associer l’électrophorèse et l’immunofixation chez l’adulte. Les sous-classes d’IgG n’ont d’intérêt que dans des situations choisies (IgG totales normales, infections, réponse vaccinale anormale).</p>
<div class="lab">Pièges</div><p>Prélèvement après immunoglobulines ou transfusion ; perte protéique (albumine basse) ; pic monoclonal masquant une baisse polyclonale.</p></template>
<template data-pop="d84-vacc" data-title="Réponses vaccinales">
<p><b>Antigènes protéiques</b> (tétanos, diphtérie) : réponse dépendante des lymphocytes T. <b>Polysaccharides</b> (vaccin pneumococcique polysaccharidique 23-valent, non conjugué) : réponse indépendante des T ; tester les titres par sérotype avant et 4 à 8 semaines après. Réponse adéquate après 6 ans : ≥ 1,3 µg/mL pour au moins 70 % des sérotypes. Ne pas utiliser le vaccin conjugué pour ce test, car il stimule la voie dépendante des T.</p></template>
<template data-pop="d84-cyto" data-title="Phénotypage lymphocytaire">
<p>Cytométrie de flux : T CD3, CD4, CD8 ; B CD19 ou CD20 ; NK CD16/CD56 ; sous-populations naïves et mémoire ; lymphocytes B mémoire commutés (CD27+ IgD−). Valeurs absolues à interpréter selon l’âge : un nourrisson a physiologiquement plus de lymphocytes qu’un adulte.</p></template>
<template data-pop="d84-ch50" data-title="CH50 et AH50">
<p><b>CH50</b> : capacité hémolytique de la voie classique et terminale (C1 à C9). <b>AH50</b> : voie alterne et terminale. Tous deux nuls : C3 ou C5 à C9. CH50 nul seul : C1, C2, C4. AH50 nul seul : facteurs B, D, properdine. Prélèvement conservé correctement (le complément est labile : un résultat bas isolé doit être répété).</p></template>
<template data-pop="d84-dhr" data-title="Test à la dihydrorhodamine">
<p>Les neutrophiles stimulés produisent du peroxyde d’hydrogène qui oxyde la dihydrorhodamine en rhodamine fluorescente, mesurée par cytométrie. Absence de fluorescence : granulomatose septique chronique. Deux populations chez la femme conductrice de la forme liée à l’X. Faux positif possible en cas de déficit sévère en myéloperoxydase.</p></template>
<template data-pop="d84-aoh" data-title="Angio-œdème héréditaire">
<div class="lab">Mécanisme</div><p>Déficit quantitatif (type 1, 85 %) ou fonctionnel (type 2) en inhibiteur de la C1 estérase ; excès de bradykinine ; formes à inhibiteur normal (mutations du facteur 12 de la coagulation, du plasminogène et d’autres gènes).</p>
<div class="lab">Clinique</div><p>Œdèmes cutanés sans urticaire ni prurit, crises abdominales, œdème laryngé ; début dans l’enfance ou à l’adolescence ; aggravation par les œstrogènes.</p>
<div class="lab">Diagnostic</div><p>C4 bas, inhibiteur de la C1 estérase bas en taux ou en fonction ; C1q normal (bas dans la forme acquise).</p>
<div class="lab">Traitement</div><p>Voir la fiche de pharmacologie ; plan d’urgence écrit et traitement de crise à domicile.</p></template>
