<template data-pop="d84-d-ig" data-title="Immunoglobulines polyvalentes">
<div class="lab">Mécanisme</div><p>IgG humaines issues de nombreux donneurs, qui remplacent les anticorps manquants.</p>
<div class="lab">Indications suisses</div><p>Déficits primaires (agammaglobulinémie et hypogammaglobulinémie congénitales, déficit immunitaire commun variable, déficit combiné sévère, syndrome de Wiskott-Aldrich) ; déficits secondaires avec infections graves ou récidivantes, traitement antimicrobien inefficace et échec prouvé de la réponse vaccinale ou IgG &lt; 4 g/L (information professionnelle suisse Privigen®).</p>
<div class="lab">Posologie</div><p>Voie intraveineuse : 0,4 à 0,8 g/kg au départ, puis 0,2 à 0,8 g/kg par mois, toutes les 3 à 4 semaines, pour un taux résiduel d’IgG d’au moins 5 à 6 g/L ; 3 à 6 mois sont nécessaires pour atteindre l’équilibre ; déficits secondaires 0,2 à 0,4 g/kg toutes les 3 à 4 semaines (Privigen®). Voie sous-cutanée : 0,4 à 0,8 g/kg par mois, fractionnés, autoadministrables à domicile après formation (Hizentra®). La dose s’ajuste au taux résiduel et à l’incidence des infections.</p>
<div class="lab">Effets indésirables</div><p>Méningite aseptique, événements thromboemboliques, hémolyse, surtout à forte dose chez les patients de groupe A, B ou AB, dysfonction rénale ; hypersensibilité rare, liée surtout aux anticorps anti-IgA (Privigen®) ; réactions locales en sous-cutané.</p></template>
<template data-pop="d84-d-proph" data-title="Prophylaxies anti-infectieuses">
<p><b>Cotrimoxazole</b> : prévention de la pneumonie à <i>Pneumocystis</i> chez l’adulte et l’adolescent, un comprimé forte trois fois par semaine, avec adaptation à la fonction rénale et surveillance de la kaliémie (information professionnelle suisse Bactrim forte®) ; chez le nourrisson atteint de déficit combiné sévère, 18 mg/kg toutes les 12 heures trois jours par semaine avec acide folinique, débuté quand la bilirubine totale est inférieure au double de la limite supérieure (recommandations suisses, 2020). <b>Nourrisson atteint de déficit combiné sévère</b> : prophylaxie antifongique (amphotéricine B orale ou fluconazole), palivizumab pendant la saison du virus respiratoire syncytial, immunoglobulines (recommandations suisses, 2020). <b>Déficit du complément</b> : antibioprophylaxie continue réservée aux infections récidivantes malgré la vaccination (ESID et ERN RITA, 2020). Les schémas de la granulomatose septique chronique n’ont pas été relus dans une source primaire pour cette révision : lacune nommée.</p></template>
<template data-pop="d84-d-aoh" data-title="Traitements de l’angio-œdème héréditaire">
<div class="lab">Crise</div><p>Traiter toutes les crises aussi tôt que possible, et obligatoirement celles qui touchent ou menacent les voies aériennes supérieures (recommandation WAO/EAACI 2021). Concentré d’inhibiteur de la C1 estérase intraveineux, 20 UI/kg en injection lente (Berinert®) ; icatibant 30 mg sous-cutanés chez l’adulte, deuxième injection après 6 heures si nécessaire, dès 2 ans selon le poids (Firazyr®) ; sébétralstat 300 mg par voie orale dès 12 ans (Ekterly®).</p>
<div class="lab">Prophylaxie avant geste</div><p>Concentré d’inhibiteur de la C1 estérase intraveineux en première ligne, aussi près que possible du début de l’intervention ; la plupart des experts utilisent 1 000 unités ou 20 unités/kg (recommandation WAO/EAACI 2021) ; indication suisse de Berinert® : prophylaxie avant interventions chirurgicales.</p>
<div class="lab">Prophylaxie au long cours</div><p>Première ligne : concentré d’inhibiteur de la C1 estérase (Berinert® SC 60 UI/kg deux fois par semaine), lanadélumab (TAKHZYRO® 300 mg toutes les 2 semaines) ou bérotralstat (Orladeyo® 150 mg par jour) ; androgènes en seconde ligne seulement (recommandation WAO/EAACI 2021 ; informations professionnelles suisses). Le garadacimab (ANDEMBRY®) et le donidalorsen (Dawnzera®) sont aussi autorisés en Suisse dès 12 ans.</p>
<div class="lab">Grossesse et allaitement</div><p>Concentré d’inhibiteur de la C1 estérase d’origine plasmatique préféré ; androgènes contre-indiqués (recommandation WAO/EAACI 2021).</p></template>
<template data-pop="pareto-d84-clin" data-title="Pareto — Notions, mécanismes et clinique">
<p class="ratio" data-cover="d84-0,d84-1,d84-2,d84-3,d84-4,d84-5,d84-6"></p>
<ul><li>Erreurs innées de l’immunité : monogéniques, 508 gènes (IUIS 2024) ; infections, mais aussi auto-immunité, inflammation, allergie, cancers.</li>
<li>Le type d’infection oriente : sinopulmonaire bactérien = anticorps ; opportuniste précoce = lymphocytes T ; infections profondes et granulomes = phagocytes ; <i>Neisseria</i> = complément terminal.</li>
<li>Chez l’adulte, <b>causes secondaires d’abord</b> : médicaments (anti-CD20, antiépileptiques, clozapine), perte protéique, hémopathie maligne, VIH, asplénie.</li>
<li>Déficit combiné sévère : environ 1 naissance sur 50 000, mortel la première année sans traitement, guérison de 80 à 95 % après greffe précoce ; dépistage néonatal suisse depuis 2019.</li>
<li>Protection maternelle jusqu’à 3–6 mois : déficits B plus tardifs, déficits T dès les premières semaines.</li>
<li>Examen : tissu lymphoïde, signes syndromiques (Wiskott-Aldrich, 22q11.2, ataxie-télangiectasie, hyper-IgE).</li></ul></template>
<template data-pop="pareto-d84-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="d84-7"></p>
<ul><li>Première ligne : formule sanguine, IgG-IgA-IgM selon l’âge (deux mesures), albumine, protéinurie, VIH.</li>
<li>Fonction : anticorps vaccinaux comparés aux seuils de protection de l’OFSP, isohémagglutinines.</li>
<li>Puis phénotypage lymphocytaire, voies du complément, inhibiteur de la C1 estérase, explosion oxydative, exome.</li>
<li>Prélever avant toute substitution en immunoglobulines.</li></ul></template>
<template data-pop="pareto-d84-tt" data-title="Pareto — Tableaux, urgences et traitement">
<p class="ratio" data-cover="d84-8,d84-9,d84-10"></p>
<ul><li>Déficit immunitaire commun variable : IgG et IgA basses, mauvaise réponse vaccinale ou B mémoire commutés bas, diagnostic après 4 ans ; lymphoprolifération, cytopénies, granulomes.</li>
<li>Agammaglobulinémie : B &lt; 2 %, BTK. Déficit sélectif en IgA : IgA &lt; 0,07 g/L après 4 ans.</li>
<li>Déficit combiné sévère : isolement, sang déleucocyté et irradié, pas de vaccin vivant, prophylaxies, greffe.</li>
<li>Granulomatose septique chronique : NADPH oxydase, explosion oxydative absente deux fois.</li>
<li>C5–C9 : risque de méningite à méningocoque multiplié par 1 400 à 10 000. Angio-œdème héréditaire : bradykinine ; crise = inhibiteur de la C1 estérase ou icatibant.</li>
<li>Immunoglobulines : taux résiduel ≥ 5–6 g/L ; vaccins vivants en principe exclus ; cotrimoxazole un comprimé forte trois fois par semaine chez l’adulte.</li></ul></template>
<template data-pop="pareto-d84-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="d84-11,d84-12,d84-13"></p>
<ul><li>Suivi : infections, taux résiduels d’IgG, complications, état bronchique ; conseil génétique et dépistage familial.</li>
<li>Grossesse et angio-œdème héréditaire : inhibiteur de la C1 estérase plasmatique ; androgènes contre-indiqués.</li>
<li>Critères ESID du déficit immunitaire commun variable : manifestation + IgG et IgA basses (deux dosages) + mauvaise réponse vaccinale ou B mémoire commutés &lt; 70 % + causes secondaires exclues + après 4 ans + pas de déficit T profond.</li>
<li>Angio-œdème héréditaire : C4 bas + inhibiteur bas en taux (type 1) ou en fonction (type 2) + C1q normal, confirmé deux fois.</li></ul></template>
<template data-pop="pareto-d84-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="d84-e-1,d84-e-2,d84-e-3"></p>
<ul><li>Immunoglobulines selon l’âge, deux mesures ; IgA &lt; 0,07 g/L : déficit sélectif.</li>
<li>Protection selon l’OFSP : tétanos ≥ 100 UI/L (courte durée), ≥ 1 000 UI/L (durable) ; pneumocoque ≥ 1 mg/L par sérotype (durable).</li>
<li>Nourrisson : CD3 ≤ 1 500/µL et CD4 naïfs ≤ 200/µL = déficit combiné sévère suspect. B &lt; 2 % : agammaglobulinémie.</li>
<li>Voies classique et alterne abolies : C3 ou voie terminale ; voie classique seule : C1q, C1r, C1s, C4, C2.</li>
<li>Dépistage néonatal TREC/KREC : TREC &lt; 10 copies par poinçon anormal.</li></ul></template>
<template data-pop="pareto-d84-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="d84-p-1,d84-p-2"></p>
<ul><li>Immunoglobulines intraveineuses ou sous-cutanées : thromboses, méningite aseptique, hémolyse, rein ; hypersensibilité liée aux anticorps anti-IgA.</li>
<li>Cotrimoxazole : hyperkaliémie, pas d’association au méthotrexate.</li>
<li>Angio-œdème : inhibiteur de la C1 estérase, icatibant, lanadélumab, bérotralstat ; éviter œstrogènes et inhibiteurs de l’enzyme de conversion.</li>
<li>Vaccins vivants en principe exclus ; au moins 5 mois après des immunoglobulines.</li></ul></template>
