<p>Association de raideur de nuque, céphalées et photophobie ; elle traduit l’irritation des méninges, quelle qu’en soit la cause, virale, bactérienne ou hémorragique. Sa présence impose une ponction lombaire si elle n’est pas contre-indiquée.</p><div class="src">Source : <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>. Textes lus le 9 octobre 2026.</div>

s Coxsackie B4, un entérovirus. Photographie : , <a href="https://commons.wikimedia.org/wiki/File:Coxsackie_B4_virus.JPG" target="_blank" rel="noopener" data-reference-source="1">Wikimedia Commons</a>, licence domaine public ; réduite et convertie pour l’affichage.</figcaption></figure><p>Plus de 90 sérotypes ; transmission féco-orale ; cause la plus fréquente de méningite virale ; détectable par PCR dans le liquide, la gorge, les selles ou les vésicules.</p><div class="src">Source : <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>. Textes lus le 9 octobre 2026.</div>

<template data-pop="a87-pa-kern" data-title="Signes de Kernig et de Brudzinski">
<p>Signes cliniques d’irritation méningée. La recommandation britannique précise qu’ils ne doivent pas être utilisés pour exclure une méningite, faute de sensibilité suffisante.</p><div class="src">Source : <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a87-p-acv" data-title="Aciclovir intraveineux">
<p>Encéphalite herpétique : 10 mg/kg toutes les 8 heures pendant 10 jours (adulte et enfant de plus de 12 ans), perfusion d’une heure, adaptée à la clairance de la créatinine. Pas de bénéfice démontré dans la méningite herpétique sans encéphalite.</p><div class="src">Source : <a href="https://amiko.oddb.org/fr/fi?gtin=7680447720193" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., Swissmedic (AIPS via AmiKo), mise à jour décembre 2025, consultée le 9.10.2026</a> ; <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a87-pa-moll" data-title="Méningite de Mollaret">
<p>Méningite lymphocytaire récidivante, le plus souvent due au virus herpès simplex de type 2 ; récupération complète entre les épisodes ; les grandes cellules plasmocytaires granuleuses décrites comme typiques sont en réalité rarement vues. Pas de prophylaxie antivirale recommandée.</p><div class="src">Source : <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>. Textes lus le 9 octobre 2026.</div>
</template>

<template data-pop="pareto-a87-maladie" data-title="Loi de Pareto — Comprendre la maladie">
<p class="ratio" data-cover="a87-pa-1,a87-pa-2,a87-pa-3,a87-pa-4"></p><ul><li>Méninges seules, sans atteinte du parenchyme.</li><li>Entérovirus, puis virus herpès simplex 2 et varicelle-zona.</li><li>Conscience normale ; sinon, autre diagnostic.</li></ul>
</template>
<template data-pop="pareto-a87-clinique" data-title="Loi de Pareto — Diagnostiquer et traiter">
<p class="ratio" data-cover="a87-pa-5,a87-pa-6,a87-pa-7"></p><ul><li>Bilan initial identique à la méningite bactérienne.</li><li>Arrêt des antibiotiques si virus prouvé.</li><li>Aciclovir seulement si encéphalite suspectée.</li><li>Pas de prophylaxie des récidives.</li></ul>
</template>
<template data-pop="pareto-a87-examens" data-title="Loi de Pareto — Examens">
<p class="ratio" data-cover="a87-e-1,a87-e-2"></p><ul><li>Liquide clair, lymphocytaire, glucose normal.</li><li>PCR du liquide : référence.</li></ul>
</template>
<template data-pop="pareto-a87-trt" data-title="Loi de Pareto — Traitement">
<p class="ratio" data-cover="a87-p-1,a87-p-2"></p><ul><li>Antalgie, hydratation.</li><li>Aciclovir 10 mg/kg toutes les 8 heures si encéphalite.</li></ul>
</template>
