<div class="chap-head"><div class="code">A87 — Méningite virale · CIM-10-GM 2024 · I-03-Infectiologie</div><h1>Méningite virale</h1><span class="status">Version de travail · Sources lues le 9 octobre 2026 : recommandation conjointe des sociétés savantes britanniques sur la méningite aiguë de l’adulte immunocompétent (2016, section « méningite virale ») ; information professionnelle suisse de Zovirax® i.v. (décembre 2025). Aucune directive suisse ni donnée nationale d’incidence de la méningite virale n’a été trouvée : lacune nommée. Relecture médicale humaine non encore effectuée.</span></div>

<section class="ilot" id="a87-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme L., 26 ans, consulte en juillet pour des céphalées intenses depuis la veille, une photophobie et une raideur de nuque ; elle est parfaitement consciente, et sa température est de 38,2 °C. Or, ce tableau de <button class="w" data-k="a87-pa-menin">méningisme</button> est commun à la méningite virale, souvent bénigne, et à la méningite bactérienne, mortelle sans antibiotique. Dès lors, tout l’enjeu est de distinguer l’une de l’autre sans retarder le traitement de la seconde.</p>
<p>Ainsi, ce cours répond à trois questions. D’abord, quels virus causent la méningite, et comment atteignent-ils les méninges ? Ensuite, comment le liquide cérébro-spinal permet-il de trancher ? Enfin, pourquoi le traitement est-il le plus souvent symptomatique, et quand faut-il malgré tout donner un antiviral ? Contrairement à un manuel figé, chaque terme vert ouvre une fenêtre avec la valeur exacte, sa source et son application au lit du patient.</p>
<div class="key"><b>À retenir.</b> Un méningisme avec une conscience normale et un liquide clair, lymphocytaire, à glucose normal rend la méningite virale probable ; en revanche, toute altération de la conscience impose de penser à l’encéphalite ou à une bactérie.</div></section>

<section class="ilot" id="a87-pa-1"><h2><span class="n">1</span>Définition</h2>
<p>Pour poser ce diagnostic, il faut d’abord délimiter l’atteinte. En effet, la méningite virale est une inflammation des <button class="w" data-k="a87-s-men">méninges</button> due à un virus ; à l’inverse, l’encéphalite virale est l’infection et l’inflammation du parenchyme cérébral lui-même. Par conséquent, la première se manifeste surtout par des céphalées et une raideur de nuque, tandis que la seconde associe des troubles du comportement, une confusion ou un coma, et son pronostic est nettement plus sombre. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</p>
<div class="key"><b>Lecture et physiopathologie.</b> Cette distinction anatomique commande la conduite : une inflammation limitée aux enveloppes ne détruit pas de neurones, d’où une guérison habituelle ; en revanche, une atteinte du parenchyme lèse directement les neurones, d’où des séquelles possibles et la nécessité d’un aciclovir intraveineux en urgence si le virus herpès simplex est suspecté. Ainsi, lorsque le doute existe entre les deux, la recommandation britannique impose de traiter comme une encéphalite. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</div></section>

<section class="ilot" id="a87-pa-2"><h2><span class="n">2</span>Épidémiologie et agents</h2>
<p>Une fois l’atteinte définie, reste à nommer les agents. Ainsi, la méningite virale représenterait au moins 50 % et peut-être jusqu’à 80 % de l’ensemble des méningites ; cependant, son incidence exacte chez l’adulte est inconnue, car elle est sous-diagnostiquée et sous-déclarée. Chez l’adulte jeune, et surtout chez la femme d’une vingtaine d’années, elle est plus fréquente que la méningite bactérienne. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</p>
<table class="t"><thead><tr><th>Agent</th><th>Transmission</th><th>Particularité</th></tr></thead><tbody>
<tr><td><button class="w" data-k="a87-s-ev">Entérovirus</button> (plus de 90 sérotypes)</td><td>Féco-orale</td><td>Agent le plus fréquent ; virus aussi retrouvé dans la gorge et les selles</td></tr>
<tr><td>Virus herpès simplex de type 2</td><td>Sexuelle</td><td>Primo-infection ou réactivation ; ulcérations génitales rarement concomitantes ; première cause de méningite lymphocytaire récidivante</td></tr>
<tr><td>Virus varicelle-zona</td><td>Respiratoire</td><td>Avec ou sans éruption de varicelle ou de zona</td></tr>
<tr><td>Cytomégalovirus, virus d’Epstein-Barr, virus ourlien</td><td>Variable</td><td>À rechercher si le premier bilan est négatif</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Ce tableau relie chaque virus à sa porte d’entrée : l’entérovirus, avalé, se multiplie dans le tube digestif, d’où son pic estival et sa présence dans les selles ; le virus herpès simplex de type 2, latent dans les ganglions sacrés après une infection génitale, peut se réactiver et gagner les méninges voisines sans lésion génitale visible. En outre, le virus herpès simplex de type 1 cause plus souvent une encéphalite qu’une méningite, ce qui explique sa gravité différente. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>. Par ailleurs, aucune donnée suisse d’incidence n’a été trouvée, car la méningite virale n’est pas, en tant que telle, à déclaration obligatoire : lacune nommée.</div></section>

<section class="ilot" id="a87-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Ces agents empruntent des voies différentes pour atteindre les méninges. En effet, l’entérovirus passe la muqueuse digestive, se multiplie dans le tissu lymphoïde, puis gagne le sang ; ensuite, il franchit les plexus choroïdes ou la barrière hémato-méningée. À l’inverse, les virus herpès, latents dans les ganglions sensitifs, rejoignent les méninges par voie nerveuse lors d’une réactivation.</p>

 decoding="async" style="max-width:100%;height:auto;border-radius:6px"><figcaption>Figure 1 — Virions de virus Coxsackie B4, un entérovirus, en immunomicroscopie électronique. Photographie : , <a href="https://commons.wikimedia.org/wiki/File:Coxsackie_B4_virus.JPG" target="_blank" rel="noopener" data-reference-source="1">Wikimedia Commons</a>, licence domaine public ; réduite et convertie pour l’affichage.</figcaption></figure>
<div class="key"><b>Lecture et physiopathologie.</b> Ces petites particules sphériques, sans enveloppe, résistent à l’acidité gastrique, ce qui explique leur transmission féco-orale. De plus, les anticorps qui les agrègent sur l’image illustrent la défense humorale : les IgA et IgG neutralisent le virus dans le sang, puis l’éliminent. Or, une fois le virus parvenu dans l’espace sous-arachnoïdien, la réponse locale attire des lymphocytes, augmente modérément les protéines par fuite capillaire, mais ne consomme pas le glucose. Par conséquent, le liquide reste clair, lymphocytaire et normoglycorachique, à l’inverse de la méningite bactérienne, où les polynucléaires et les bactéries consomment le glucose.</div></section>

<section class="ilot" id="a87-pa-4"><h2><span class="n">4</span>Présentation clinique</h2>
<p>Cette inflammation méningée se traduit par un tableau assez stéréotypé. Ainsi, le patient présente un méningisme, c’est-à-dire une raideur de nuque, des céphalées et une photophobie ; cependant, la fièvre n’est pas constante. De plus, des signes non spécifiques, diarrhée, vomissements, myalgies ou mal de gorge, sont parfois présents. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</p>
<div class="alert"><b>Signal d’alarme.</b> Chez l’adulte, la méningite virale n’altère habituellement pas la conscience. Par conséquent, une baisse de vigilance oriente vers une méningite bactérienne, une encéphalite, une encéphalopathie d’origine extra-cérébrale, une hémorragie sous-arachnoïdienne ou un processus expansif. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</div>
<div class="key"><b>Lecture et physiopathologie.</b> La céphalée et la raideur résultent de l’irritation des terminaisons nerveuses méningées, innervées par le nerf trijumeau et les racines cervicales hautes ; l’étirement des méninges enflammées lors de la flexion du cou déclenche une contraction réflexe de défense. En revanche, la conscience dépend du cortex et de la substance réticulée, que la méningite virale épargne ; c’est pourquoi son altération signale une autre lésion. Enfin, la recommandation britannique précise que les signes de <button class="w" data-k="a87-pa-kern">Kernig et de Brudzinski</button> ne doivent pas servir à exclure une méningite. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</div>
<button class="pareto-btn ui" data-k="pareto-a87-maladie">▲ Loi de Pareto — Comprendre la maladie</button></section>

<section class="ilot" id="a87-pa-5"><h2><span class="n">5</span>Diagnostic différentiel</h2>
<p>Puisque le tableau clinique ne distingue pas sûrement la méningite virale de la bactérienne, le diagnostic différentiel commande la conduite initiale. En effet, les premiers examens sont identiques dans les deux cas, et l’antibiothérapie empirique ne doit pas attendre lorsque la méningite bactérienne est plausible. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</p>
<table class="t"><thead><tr><th>Diagnostic</th><th>Argument d’orientation</th><th>Conséquence</th></tr></thead><tbody>
<tr><td>Méningite bactérienne</td><td>Liquide trouble, polynucléaires, glucose très bas</td><td>Antibiothérapie immédiate</td></tr>
<tr><td>Encéphalite herpétique</td><td>Troubles du comportement, confusion, convulsions</td><td>Aciclovir intraveineux sans délai</td></tr>
<tr><td>Méningite tuberculeuse</td><td>Lymphocytes, protéines très élevées, glucose très bas</td><td>Recherche mycobactérienne</td></tr>
<tr><td>Méningite fongique</td><td>Immunodépression ; glucose bas</td><td>Recherche du cryptocoque</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Les caractéristiques du liquide traduisent chacune un mécanisme : les bactéries et les polynucléaires consomment le glucose ; la tuberculose provoque une réaction granulomateuse riche en protéines ; le virus, au contraire, n’altère presque pas le glucose. Toutefois, aucun paramètre n’est absolu : une méningite bactérienne décapitée par un antibiotique ou due à <i>Listeria</i> peut être lymphocytaire, et une méningite à entérovirus peut être à polynucléaires au tout début. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>. De plus, la méningo-encéphalite à tiques, traitée dans le cours A84, est une méningite virale propre à la Suisse, à évoquer en saison chaude.</div></section>

<section class="ilot" id="a87-pa-6"><h2><span class="n">6</span>Prise en charge</h2>
<p>Une fois la bactérie écartée, la prise en charge devient simple. En effet, il n’existe pas de traitement d’efficacité prouvée pour la plupart des méningites virales ; ainsi, le traitement est symptomatique, avec antalgiques et hydratation si nécessaire. De plus, si des antibiotiques ont été débutés, ils doivent être arrêtés dès que le diagnostic viral est posé, et la sortie de l’hôpital doit être accélérée. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</p>
<div class="alert"><b>Exception.</b> En présence de signes d’encéphalite, changement de personnalité, de comportement ou de cognition, ou altération de la conscience, l’<button class="w" data-k="a87-p-acv">aciclovir intraveineux</button> doit être administré pour une encéphalite herpétique suspectée. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</div>
<div class="key"><b>Lecture et physiopathologie.</b> Pourquoi ne pas traiter toutes les méningites herpétiques par aciclovir ? D’abord, aucune donnée ne démontre un bénéfice dans la méningite à virus herpès simplex ou varicelle-zona sans encéphalite ; ensuite, le traitement expose à des effets indésirables, notamment rénaux, et prolonge l’hospitalisation. Par conséquent, la recommandation britannique demande de peser ces risques contre l’absence de preuve d’efficacité. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</div>
<button class="pareto-btn ui" data-k="pareto-a87-clinique">▲ Loi de Pareto — Diagnostiquer et traiter</button></section>

<section class="ilot" id="a87-pa-7"><h2><span class="n">7</span>Méningite lymphocytaire récidivante</h2>
<p>Certains patients présentent cependant des épisodes répétés. Ainsi, la <button class="w" data-k="a87-pa-moll">méningite de Mollaret</button>, ou méningite lymphocytaire récidivante, est le plus souvent due au virus herpès simplex de type 2 ; les épisodes surviennent à des mois ou des années d’intervalle, avec une récupération habituellement complète entre eux. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</p>
<div class="key"><b>Lecture et physiopathologie.</b> Le virus, latent dans les ganglions sacrés, se réactive périodiquement et rejoint les méninges lombaires. Or, si le valaciclovir oral réduit les récidives génitales et la transmission, il n’a pas réduit les récidives de méningite dans un essai contrôlé contre placebo ; au contraire, les patients traités tendaient à rechuter davantage après l’arrêt. C’est pourquoi l’aciclovir et le valaciclovir ne doivent pas être donnés en prophylaxie des méningites herpétiques récidivantes. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</div></section>

<section class="ilot" id="a87-pa-8"><h2><span class="n">8</span>Évolution et suivi</h2>
<p>Au-delà de l’épisode aigu, l’évolution est habituellement favorable. En effet, la méningite virale est rarement mortelle chez l’adulte immunocompétent ; cependant, elle peut entraîner une morbidité notable et des séquelles sous-estimées, telles que céphalées, fatigue et troubles de la concentration. Par conséquent, les patients dont la méningite virale est confirmée devraient être évalués par un spécialiste en infectiologie ou en neurologie. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</p></section>

<section class="ilot" id="a87-pa-9"><h2><span class="n">9</span>Critères formels et paramètres clés</h2>
<div class="alert"><b>Critères du diagnostic.</b> Syndrome clinique de méningite ; preuve d’une inflammation du liquide cérébro-spinal (leucocytes et protéines augmentés) ; identification du virus dans le liquide cérébro-spinal par PCR, examen de référence. Lorsque aucun agent n’est identifié, ce qui arrive dans 30 à 50 % des méningites présumées virales, le diagnostic reste présomptif. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a>.</div>
<p>En synthèse, les valeurs à retenir se résument ainsi.</p>
<div class="key"><b>Paramètres clés.</b> Liquide normal : moins de 5 cellules/µL, protéines inférieures à 0,4 g/L, rapport glucose liquide/plasma supérieur à 0,66. Méningite virale : 5 à 1000 cellules/µL, surtout lymphocytaires, protéines modérément augmentées, glucose normal ou légèrement bas. Seuils en faveur d’une bactérie : rapport glucose inférieur à 0,36 ; lactate supérieur à 35 mg/dL. Aciclovir de l’encéphalite herpétique : 10 mg/kg toutes les 8 heures pendant 10 jours. <a href="https://doi.org/10.1016/j.jinf.2016.01.007" target="_blank" rel="noopener" data-reference-source="1">McGill F. et al., « The UK joint specialist societies guideline on the diagnosis and management of acute meningitis and meningococcal sepsis in immunocompetent adults », J Infect 2016;72:405–438 (accès ouvert)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680447720193" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., Swissmedic (AIPS via AmiKo), mise à jour décembre 2025, consultée le 9.10.2026</a>.</div>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque seuil relie une donnée à un mécanisme : le glucose baisse quand des cellules et des bactéries le consomment ; le lactate s’élève par métabolisme anaérobie bactérien ; la protéinorachie mesure la fuite capillaire. Ainsi, un liquide clair, lymphocytaire et normoglycorachique autorise, avec une PCR positive, l’arrêt des antibiotiques.</div>
