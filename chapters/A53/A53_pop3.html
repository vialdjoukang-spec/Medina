<template data-pop="a53-m-bpg" data-title="Benzathine-pénicilline G : Extencilline®">
<div class="lab">Mécanisme</div><p>La benzylpénicilline se fixe aux protéines de liaison des pénicillines et inhibe les transpeptidases de la paroi pendant la croissance. Son effet bactéricide dépend du temps passé au-dessus de la concentration minimale inhibitrice. Le dépôt intramusculaire la libère lentement : le pic plasmatique survient vers 48 heures chez l’adulte, environ 55 % de la dose est liée aux protéines, et l’élimination est surtout rénale.</p>
<div class="lab">Preuves</div><p>Les schémas reposent surtout sur des données pharmacologiques, la plausibilité biologique et l’expérience clinique ; la directive européenne reconnaît l’absence d’essais bien contrôlés sur la dose et la durée optimales. Le projet de 2026 cite des essais montrant l’absence de bénéfice de trois doses sur une seule dans la syphilis précoce.</p>
<div class="lab">Posologie suisse</div><p>L’adulte et l’adolescent reçoivent 2,4 MUI par voie intramusculaire en dose unique aux stades primaire et secondaire, et 2,4 MUI une fois par semaine pendant trois semaines au stade tardif latent. L’enfant reçoit 50 000 UI/kg sans dépasser 2,4 MUI. La syphilis congénitale sans atteinte neurologique reçoit 50 000 UI/kg en dose unique. Le flacon de 2,4 MUI se reconstitue avec 5 mL d’eau pour préparations injectables.</p>
<div class="lab">Contre-indications</div><p>Une hypersensibilité aux pénicillines, aux phospholipides de soja, à l’arachide ou à un excipient contre-indique le produit, de même qu’un antécédent de réaction immédiate sévère à une autre bêta-lactamine. Il n’est pas indiqué dans la neurosyphilis ni en cas d’anomalie du liquide céphalo-rachidien. Il ne s’injecte jamais par voie intraveineuse ni dans un tissu mal perfusé.</p>
<div class="lab">Effets indésirables et surveillance</div><p>Les effets à connaître sont la réaction de Jarisch-Herxheimer, l’anaphylaxie, les réactions cutanées sévères, le syndrome de Kounis, les syndromes de Hoigné et de Nicolau, la douleur et l’infiltrat au point d’injection, et la colite pseudomembraneuse. Le patient reste en observation au moins une demi-heure. Pendant la grossesse, le produit est utilisable si l’indication est justifiée, bien qu’il traverse le placenta. Il passe en faible quantité dans le lait ; l’allaitement s’interrompt si l’enfant présente une diarrhée, une candidose ou une éruption.</p>

<template data-pop="a53-m-peng" data-title="Pénicilline G intraveineuse : Pénicilline « Grünenthal »">
<div class="lab">Mécanisme</div><p>Le mécanisme est celui de la forme retard. La voie intraveineuse à forte dose produit toutefois des concentrations élevées, qui atteignent le liquide céphalo-rachidien lorsque les méninges sont enflammées ; la forme retard y reste insuffisante.</p>
<div class="lab">Posologie</div><p>Neurosyphilis, syphilis oculaire et otosyphilis : 4 MUI intraveineuse toutes les 4 heures pendant 14 jours selon la SSI ; 18 à 24 MUI par jour pendant 10 à 14 jours selon la directive européenne. L’information professionnelle suisse autorise 20 à 60 MUI par jour en 4 à 6 doses dans les infections graves. Au-delà de 2 MUI, l’injection intraveineuse est lente, au plus 0,5 MUI par minute. Flacon de 10 MUI. Insuffisance rénale : même dose initiale, puis réduction ou espacement selon le tableau de filtration glomérulaire.</p>
<div class="lab">Contre-indications et surveillance</div><p>Une hypersensibilité avérée à la pénicilline la contre-indique. Sa neurotoxicité est dose-dépendante et majorée en insuffisance rénale. Une neutropénie touche 5 à 15 % des patients au-delà de 200 MUI cumulées, seuil que dépasse le schéma de 14 jours. Chaque flacon de 10 MUI apporte 386 mg de sodium, et une néphrite interstitielle est décrite ; la formule sanguine, la fonction rénale et les électrolytes sont donc contrôlés. Elle est utilisable pendant la grossesse.</p>

<template data-pop="a53-m-doxy" data-title="Doxycycline : Doxycline®">
<div class="lab">Mécanisme et place</div><p>La doxycycline est une tétracycline bactériostatique. Elle pénètre bien dans le liquide céphalo-rachidien selon la directive européenne, mais seules des études observationnelles et rétrospectives l’ont évaluée dans la syphilis. Elle sert d’alternative en cas d’allergie aux pénicillines, hors grossesse, et ne s’associe jamais à une pénicilline.</p>
<div class="lab">Posologie suisse</div><p>Syphilis primaire ou secondaire, ou latente de moins d’un an : 100 mg deux fois par jour par voie orale pendant deux semaines. Syphilis latente ou tertiaire de plus d’un an ou de durée inconnue : quatre semaines. Prise au moins une heure avant un repas et avant le coucher, avec suffisamment de liquide, en position assise ou debout. Aucune adaptation rénale.</p>
<div class="lab">Contre-indications et précautions</div><p>Une hypersensibilité aux tétracyclines et une insuffisance hépatique sévère la contre-indiquent. Elle ne s’administre pas pendant la grossesse, sauf nécessité absolue, ni pendant l’allaitement. Avant 12 ans, elle est réservée aux situations graves, car elle colore les dents. Elle expose à une hypertension intracrânienne bénigne, à des réactions cutanées sévères et à une colite à <i>Clostridioides difficile</i>. Après un traitement par doxycycline d’une syphilis tardive, certains experts proposent une ponction lombaire chez la personne sans symptôme (2, D).</p>

<template data-pop="a53-m-ceftriaxone" data-title="Ceftriaxone : Rocephin®">
<div class="lab">Place</div><p>Céphalosporine à spectre étendu, de bonne pénétration dans le liquide céphalo-rachidien. La SSI la propose, 1 g par jour pendant 8 à 10 jours, en cas d’allergie limitée à une éruption. La directive européenne la propose en cas de trouble de la coagulation, 1 g par jour par voie intraveineuse pendant 10 jours, et en deuxième ligne de la neurosyphilis, 1 à 2 g par jour pendant 10 à 14 jours. La syphilis ne figure pas parmi les indications de son information professionnelle suisse : son emploi est hors indication.</p>
<div class="lab">Contre-indications et précautions</div><p>Une hypersensibilité aux céphalosporines la contre-indique, et le risque augmente après une allergie aux pénicillines ; la directive européenne fait d’une anaphylaxie aux pénicillines une contre-indication absolue. La forme intramusculaire contient de la lidocaïne : elle est contre-indiquée pendant la grossesse, en cas de trouble de la conduction cardiaque ou d’allergie aux anesthésiques locaux, et ne s’injecte jamais par voie intraveineuse. Chez le nouveau-né, une hyperbilirubinémie ou un besoin de calcium intraveineux la contre-indiquent. Elle peut former des précipités biliaires de calcium-ceftriaxone. En insuffisance rénale terminale, la dose ne dépasse pas 2 g par jour.</p>

<template data-pop="a53-disponibilite" data-title="Benzathine-pénicilline en Suisse : un écart daté">
<p>La SSI, validée en juin 2024, écrit : « Benzathine-pénicilline : à commander par la pharmacie cantonale (produit importé) » et décrit une injection fessière « 2 × 5 ml ». Depuis, Extencilline® 1,2 MUI et 2,4 MUI a reçu l’autorisation Swissmedic 69765 et Compendium signale sa commercialisation en mai 2026. Le flacon suisse de 2,4 MUI se reconstitue en une suspension de 5 mL, à injecter en un seul site, la limite tolérée étant de 5 mL par site. En juillet 2026, un problème de livraison a conduit à des boîtes en emballage français, dont un lot contenait une notice erronée.</p>
<p><b>Décision retenue.</b> La dose et le schéma de la SSI restent valables ; la préparation suit l’information professionnelle suisse du produit réellement délivré. La disponibilité locale se vérifie auprès de la pharmacie, car des ruptures de benzathine-pénicilline sont fréquentes en Europe selon la directive européenne.</p>
