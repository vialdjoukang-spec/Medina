<template data-pop="a53-pre-serologie" data-title="Deux familles de tests sérologiques">
<div class="lab">Principe</div><p>Les tests <b>tréponémiques</b> (TPPA, TPHA, EIA, CLIA, FTA-abs) détectent des anticorps contre des antigènes propres au tréponème : ils prouvent une infection actuelle ou passée et restent positifs à vie chez la plupart des patients. Les tests <b>non tréponémiques</b> (RPR, VDRL) détectent des anticorps contre un antigène lipidique de cardiolipine, lécithine et cholestérol : leur titre suit l’activité et baisse après traitement.</p>
<div class="lab">Cinétique</div><p>Le test tréponémique devient positif 5 à 15 jours après l’apparition du chancre, le test non tréponémique 10 à 15 jours après, soit environ six semaines après l’infection. Avant le chancre et pendant ses premiers jours, toutes les sérologies sont négatives.</p>
<div class="src"><a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, tests sérologiques</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic</a>.</div>
</template>
<template data-pop="a53-pre-penicilline" data-title="Pénicilline retard : un dépôt qui dure trois semaines">
<p>La benzathine-pénicilline est un sel peu soluble injecté dans le muscle. Elle forme un dépôt d’où la benzylpénicilline est libérée très lentement ; le pic plasmatique survient vers 48 heures chez l’adulte, alors que la benzylpénicilline libre a une demi-vie d’environ 30 minutes. Une dose de 2,4 MUI maintient une concentration tréponémicide dans le sang jusqu’à 21 jours. Comme le tréponème se divise toutes les 30 à 33 heures, cette exposition prolongée couvre de nombreuses générations. Elle n’atteint pas de concentration suffisante dans le liquide céphalo-rachidien.</p>
<div class="src"><a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/e048ad2d141e42bd9000b297cf3f9d96-fr.html" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Extencilline®, pharmacocinétique</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, remarques générales</a>.</div>
</template>
<template data-pop="a53-pre-stade" data-title="Précoce ou tardive : un an ou deux ans ?">
<div class="lab">Les définitions</div><p>L’ECDC, la directive européenne IUSTI et la définition de cas de l’OFSP placent la limite entre syphilis précoce et tardive à <b>un an</b> après l’infection. L’OMS la place à <b>deux ans</b>. Une revue de référence rappelle que ces différences changent l’interprétation des données et, dans certains cas, le schéma thérapeutique.</p>
<div class="lab">Décision retenue en Suisse</div><p>La SSI définit la latence précoce comme une infection de moins d’un an et la latence tardive comme une infection de plus d’un an. Pour l’examen fédéral et la pratique suisse, la limite d’<b>un an</b> s’applique : une latence datée de 18 mois reçoit trois injections. Une latence de durée inconnue est traitée comme tardive.</p>
<div class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, clinique</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, introduction</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP 2026, définition de cas</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5809176/" target="_blank" rel="noopener" data-reference-source="1">Peeling 2017, introduction</a>.</div>
</template>
<template data-pop="a53-ofsp-definition" data-title="Définitions de cas de l’OFSP : compter n’est pas traiter">
<p>Pour la surveillance, l’OFSP classe en <b>latence précoce</b> toute personne ayant eu des symptômes primaires ou secondaires dans les douze derniers mois, ou dont la première infection dans ce délai est considérée comme confirmée. Il classe en <b>latence tardive</b> une première infection datant de douze mois ou plus, et y inclut les latences de durée inconnue dont le titre non tréponémique est égal ou supérieur à 32. Il garde une catégorie de <b>stade inconnu</b> pour les autres cas.</p>
<p>Le seuil de 32 sert au classement statistique. Il ne date pas une infection individuelle et ne remplace pas les critères cliniques de la latence précoce ; la directive européenne rappelle d’ailleurs qu’une partie des latences de durée inconnue sont en réalité précoces et contagieuses.</p>

<p>La membrane externe de <i>T. pallidum</i> ne contient pas de lipopolysaccharide et expose très peu de protéines ; ses lipoprotéines abondantes restent surtout sous la surface. Les récepteurs de l’immunité innée trouvent donc peu de cibles, ce qui laisse la bactérie se multiplier localement et se disséminer tôt. Les anticorps visent surtout des antigènes profonds, et les rares protéines de surface varient d’une bactérie à l’autre.</p>
<p><b>Conséquence clinique.</b> L’infection est systémique avant les premiers symptômes, et la guérison spontanée des lésions ne signifie pas l’élimination du germe.</p>

<p>Les manifestations de tous les stades résultent de la réponse inflammatoire locale contre des tréponèmes qui se multiplient dans les tissus. L’histologie montre un infiltrat périvasculaire de lymphocytes, d’histiocytes et de plasmocytes, avec un gonflement endothélial, qui peut aboutir à une endartérite oblitérante. Les lymphocytes T sécrètent de l’interféron gamma, qui active les macrophages, mais aussi du TNF et de l’IL-6, qui lèsent les tissus.</p>
<p><b>Conséquence clinique.</b> L’endartérite explique les accidents vasculaires de la neurosyphilis méningo-vasculaire et l’atteinte de l’aorte thoracique.</p>

<p>La SSI place l’anamnèse sexuelle en premier dans le diagnostic. Elle précise les sites exposés, génital, anal et oral, car le chancre siège au point d’inoculation et peut être caché dans le vagin, la bouche ou le rectum. Elle date les expositions et les partenaires, car le délai d’incubation va de 10 à 90 jours et la latence précoce se définit par une acquisition dans l’année. Elle recherche un partenaire atteint de syphilis précoce documentée, l’un des critères de datation.</p>
<div class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, clinique et latence</a>.</div>
</template>
<template data-pop="a53-anam-anciens" data-title="Anciens titres et anciens traitements">
<p>Le médecin obtient les comptes rendus de toute sérologie antérieure, avec le test, le titre, la date et le laboratoire, ainsi que la preuve d’un traitement adéquat. Ces pièces décident de trois choses : la datation d’une latence, par un test négatif dans l’année ; l’interprétation d’un titre persistant, cicatrice sérologique ou réinfection ; l’indication d’un nouveau traitement. La directive européenne demande de traiter par précaution toute sérologie positive, sauf si un traitement adéquat est documenté et qu’aucune exposition n’a suivi.</p>
<div class="src"><a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, sérologie (1, D)</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, latence</a>.</div>
</template>
<template data-pop="a53-anam-allergie" data-title="Allergie déclarée aux pénicillines">
<p>Le projet européen de 2026 rappelle que plus de 80 % des allergies aux pénicillines déclarées par les patients sont inexactes, et que des scores validés permettent de lever l’étiquette chez une grande partie d’entre eux. La caractérisation porte sur le type de réaction, éruption tardive ou réaction immédiate avec urticaire, angio-œdème ou choc, et sur sa date. Elle conditionne l’alternative : la SSI distingue l’allergie limitée à une éruption de la réaction anaphylactique.</p>
<div class="src"><a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, grossesse et allergie</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, allergie</a>.</div>
</template>

<div class="lab">Technique</div><p>Le médecin inspecte et palpe, avec des gants, les organes génitaux, la région périanale, la bouche et le pharynx. Il palpe la base de l’ulcération, dont l’induration est évocatrice, et les ganglions de drainage. Il prélève un frottis pour PCR avant tout traitement.</p>
<div class="lab">Valeur</div><p>Le chancre typique est superficiel, unique, indolore, induré, à fond propre et sérosité claire ; il n’est jamais vésiculeux. Il s’accompagne habituellement d’une adénopathie régionale, parfois retardée ou absente.</p>
<div class="lab">Pièges</div><p>Les chancres sont souvent atypiques : multiples, douloureux, profonds, indiscernables d’un herpès. Ils sont difficiles à trouver chez la femme et lors d’une localisation vaginale, buccale ou anale.</p>

<p>L’éruption ne démange habituellement pas. Une roséole apparaît dans les deux à trois mois suivant le chancre, puis des syphilides papuleuses. L’atteinte des paumes et des plantes est évocatrice. L’OFSP retient comme critères cliniques du stade secondaire une éruption maculo-papuleuse diffuse, souvent palmo-plantaire, une lymphadénopathie généralisée, des condylomes plats, un énanthème et une alopécie diffuse. Ces lésions contiennent de nombreux tréponèmes et sont contagieuses.</p>

</template>
<template data-pop="a53-ex-neuro" data-title="Examen neurologique, oculaire et otologique ciblé">
<p>La directive européenne recommande cet examen chez toute personne dont la sérologie est positive. Il recherche un syndrome méningé, une atteinte des nerfs crâniens, un déficit moteur ou sensitif, un trouble cognitif, une baisse visuelle, une rougeur ou douleur oculaire, une baisse auditive, des acouphènes et des vertiges. Un signe oculaire conduit à un avis ophtalmologique. Un fond d’œil précède toute ponction lombaire ; une tomodensitométrie cérébrale est demandée si l’examen neurologique est anormal.</p>
<p><b>Piège.</b> Chez une personne sans symptôme, l’examen est rarement anormal ; son but est de ne pas manquer la minorité qui exige un traitement intraveineux.</p>
<div class="src"><a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, neurosyphilis</a> ; <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, syphilis oculaire</a>.</div>
</template>
<template data-pop="a53-algorithme" data-title="Algorithme sérologique suisse">
<p>La SSI commence par un test tréponémique de dépistage, TPPA ou IgG anti-<i>T. pallidum</i>. S’il est positif, elle demande toujours un test VIH et un test dit d’activité, VDRL ou RPR. Un test d’activité positif signe une syphilis active à traiter. S’il est négatif, une syphilis traitée ne demande pas d’autre mesure ; sinon, un FTA-abs ou un EIA IgG est demandé, et leur négativité avec un TPPA positif évoque un faux positif à discuter avec le laboratoire.</p>
<p>La directive européenne complète cet algorithme : le test non tréponémique doit être quantitatif et dilué au moins jusqu’à 1:8 ou 1:16 pour éviter la prozone, et un test tréponémique positif avec un test non tréponémique négatif, sans chancre, se répète après un mois. Une sérologie positive se traite par précaution, sauf traitement adéquat documenté sans nouvelle exposition.</p>
<div class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, diagnostic sérologique</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, confirmation (1, B)</a> ; <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026</a>.</div>
</template>
<template data-pop="a53-jh" data-title="Réaction de Jarisch-Herxheimer">
<div class="lab">Mécanisme et clinique</div><p>La lyse rapide des tréponèmes par l’antibiotique libère des composants bactériens qui déclenchent une réaction fébrile, 2 à 12 heures après l’injection : céphalées, fièvre, sueurs, frissons, myalgies, arthralgies, nausées, tachycardie, hypertension puis hypotension. Elle disparaît en 10 à 12 heures selon l’information professionnelle suisse, en moins de 24 heures selon la directive européenne. Elle touche 10 à 25 % des syphilis précoces.</p>
<div class="lab">Gravité</div><p>Elle est habituellement bénigne, sauf en cas d’atteinte neurologique ou ophtalmique, chez le nouveau-né et pendant la grossesse, où elle peut provoquer une souffrance fœtale et un accouchement prématuré. Elle est rare au stade tardif, mais dangereuse si des sites stratégiques sont atteints, comme les ostia coronaires.</p>
<div class="lab">Conduite et écart de sources</div><p>La SSI propose « paracétamol 1 g toutes les 4 heures en réserve ». L’information professionnelle suisse du paracétamol fixe chez l’adulte de plus de 40 kg une dose maximale de <b>4 g par 24 heures</b>, avec 4 à 8 heures entre les prises : la réserve est donc de 1 g au plus toutes les 4 heures, sans dépasser 4 g par jour. La directive européenne propose en option la prednisolone 20 à 60 mg par jour pendant trois jours, en commençant 24 heures avant l’antibiotique (2, D), et une prise en charge hospitalière en cas d’atteinte cardiovasculaire ou neurologique ; cette indication de la prednisolone ne figure pas dans une information professionnelle suisse.</p>
<div class="src"><a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/e048ad2d141e42bd9000b297cf3f9d96-fr.html" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Extencilline®, mises en garde</a> ; <a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, traitement</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/c176169e9c81477385fa9797153740d5-fr.html" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Acétalgine®, Swissmedic (AIPS), consultée le 08.10.2026</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, réactions au traitement</a>.</div>
</template>
<template data-pop="a53-hoigne" data-title="Syndrome de Hoigné">
<p>Une injection intravasculaire involontaire de la suspension provoque des micro-emboles. Le patient éprouve une angoisse de mort, une confusion, des hallucinations, parfois une cyanose, une tachycardie et des troubles moteurs, sans collapsus circulatoire. Les symptômes régressent en une heure ; une sédation parentérale est indiquée si l’aggravation est importante. L’aspiration avant l’injection réduit ce risque. Il faut d’abord exclure une anaphylaxie.</p>
<div class="src"><a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/e048ad2d141e42bd9000b297cf3f9d96-fr.html" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Extencilline®, remarques sur l’administration</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, réactions au traitement</a>.</div>
</template>
<template data-pop="a53-allergie-ch" data-title="Allergie aux pénicillines : quelle alternative ?">
<div class="lab">Sources comparées</div><table class="t"><tr><th>Situation</th><th>SSI 2024</th><th>Autres sources lues</th></tr><tr><td>Toute allergie</td><td>Désensibilisation si possible.</td><td>IUSTI : désensibilisation, option préférée en grossesse et seule option citée pour la neurosyphilis.</td></tr><tr><td>Éruption seule</td><td>Ceftriaxone 1 g par jour pendant 8 à 10 jours.</td><td>Rocephin® : syphilis hors indication ; risque accru après allergie aux pénicillines.</td></tr><tr><td>Anaphylaxie, infection de moins d’un an</td><td>Doxycycline 100 mg deux fois par jour, 14 jours.</td><td>Doxycline® et IUSTI : 14 jours.</td></tr><tr><td>Anaphylaxie, infection de plus d’un an ou durée inconnue</td><td>Doxycycline 14 jours, sans distinction.</td><td>Doxycline® : 4 semaines ; IUSTI : 21 à 28 jours.</td></tr><tr><td>Neurosyphilis</td><td>Consultation spécialisée.</td><td>IUSTI : désensibilisation puis pénicilline G.</td></tr></table><div class="key"><b>Lecture et physiopathologie.</b> La divergence des sources porte sur le risque d’allergie croisée et sur la diffusion des molécules. En effet, les céphalosporines partagent avec les pénicillines le noyau bêtalactame, d’où un risque, faible mais réel, de réaction croisée. De plus, seule la pénicilline a prouvé son efficacité dans la neurosyphilis et la syphilis congénitale ; c’est pourquoi la désensibilisation est préférée lorsque la pénicilline est indispensable.</div>
<div class="lab">Décision retenue</div><p>Pour les doses, l’information professionnelle suisse approuvée par Swissmedic prime : une latence tardive ou de durée inconnue reçoit <b>quatre semaines</b> de doxycycline, durée confirmée par la directive européenne. Pour la ceftriaxone, la position suisse de la SSI s’applique pour l’examen fédéral, en précisant qu’il s’agit d’un usage hors information professionnelle et qu’une anaphylaxie aux pénicillines l’exclut.</p>
<div class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, allergie</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/00b4d5e3f00a421a930c4ac935d5a20c-fr.html" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Doxycline®</a> ; <a href="https://files.refdata.ch/simis-public-prod/MedicinalDocuments/8d9346c377864ce8a9b0034d146e9b2f-fr.html" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rocephin®</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020</a>.</div>
</template>
<template data-pop="a53-partenaires" data-title="Partenaires : fenêtres suisse et européenne">
<table class="t"><tr><th>Stade du cas index</th><th>SSI 2024</th><th>IUSTI 2020 et projet 2026</th></tr><tr><td>Primaire</td><td>30 derniers jours</td><td>3 derniers mois, durée maximale d’incubation</td></tr><tr><td>Secondaire</td><td>6 derniers mois</td><td>Jusqu’à 2 ans si rechute clinique</td></tr><tr><td>Latente précoce</td><td>Non précisé</td><td>Jusqu’à 2 ans</td></tr><tr><td>Tardive</td><td>Non précisé</td><td>Périodes plus longues</td></tr></table><div class="key"><b>Lecture et physiopathologie.</b> La fenêtre de recherche des partenaires reflète la durée d’incubation et de contagiosité. En effet, le chancre apparaît après une incubation pouvant atteindre trois mois ; un partenaire contaminant peut donc remonter à cette période. Au stade secondaire, les lésions muqueuses riches en tréponèmes sont contagieuses plus longtemps, d’où une fenêtre plus large.</div>
<p><b>Décision retenue.</b> Pour l’examen fédéral, les fenêtres de la SSI s’appliquent aux stades qu’elle précise. Pour la latence, la SSI ne donne pas de fenêtre ; la directive européenne est alors la source applicable. Les deux textes recommandent un traitement épidémiologique des contacts, surtout des partenaires enceintes ; la directive européenne prévoit sinon une sérologie au premier contact, à six semaines et à trois à six mois. Entre 46 et 60 % des contacts retrouvés d’une syphilis précoce sont infectés.</p>
<div class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, partenaires</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, partenaires</a> ; <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, partenaires</a>.</div>
</template>
<template data-pop="a53-declaration" data-title="Déclaration obligatoire en Suisse">
<p>Le <b>médecin</b> déclare au médecin cantonal, dans un délai d’une semaine, un résultat positif d’analyse spécifique ou l’instauration d’un traitement antibiotique contre la syphilis, sur preuve directe au cabinet ou devant des symptômes typiques du stade précoce. Il ne déclare pas un retraitement pour suspicion de non-réponse, un traitement prophylactique de partenaire ni un traitement qui se révèle non indiqué. Les primo-infections et les réinfections avérées se déclarent par le formulaire complet ; un contrôle d’évolution ou une cicatrice sérologique se déclarent par la seule partie « patient », case correspondante cochée.</p>
<p>Le <b>laboratoire</b> déclare à l’OFSP, dans la semaine, une PCR positive, ou un test tréponémique positif confirmé par un second test spécifique ou associé à un marqueur d’activité positif, mais pas un RPR ou un VDRL positif non confirmé par un test spécifique. Le médecin transmet son formulaire par messagerie sécurisée, fax ou courrier.</p>
<div class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/250321_BAS_Meldeleitfaden_FR.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, Guide de la déclaration obligatoire 2026, « Syphilis », p. 109–111</a>.</div>
</template>
<template data-pop="a53-suivi" data-title="Suivi sérologique : SSI ou directive européenne ?">
<table class="t"><tr><th>Élément</th><th>SSI 2024</th><th>IUSTI 2020</th></tr><tr><td>Échéances</td><td>3, 6, 12 et 24 mois</td><td>1, 3, 6 et 12 mois au stade précoce</td></tr><tr><td>Attendu à 6 mois</td><td>RPR négatif ou « diminution de 4 titrations, soit 1/16 »</td><td>Baisse d’au moins deux dilutions, soit un facteur quatre</td></tr><tr><td>Titre bas persistant</td><td>Non précisé</td><td>Titre ≤ 1:4 stable : traité avec succès sans risque persistant</td></tr></table><div class="key"><b>Lecture et physiopathologie.</b> Le suivi sérologique mesure la décroissance des anticorps non tréponémiques après la disparition des tréponèmes. En effet, ces anticorps sont produits tant que les lésions libèrent des lipides cellulaires ; leur titre baisse donc progressivement après le traitement. Par conséquent, une baisse d’au moins quatre fois signe le succès, tandis qu’une remontée évoque une réinfection ou un échec.</div>
<div class="lab">Lecture</div><p>Si « titration » désigne une dilution de deux en deux, quatre titrations correspondent à un facteur seize ; le texte suisse n’en donne pas de définition. La directive européenne est la seule source lue qui définit explicitement le changement significatif : deux dilutions. Elle précise qu’environ 15 % des personnes sans VIH n’atteignent pas ce seuil à six mois et doivent être recontrôlées à douze mois.</p>
<div class="lab">Décision retenue</div><p>Le calendrier suisse, 3, 6, 12 et 24 mois, s’applique. Le critère de réponse est la baisse d’au moins deux dilutions, seule définition explicite disponible ; une baisse insuffisante conduit, comme le demande la SSI, à rechercher une réinfection ou une neurosyphilis, sans conclure mécaniquement à un échec.</p>
<div class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, suivi</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, suivi et test de guérison</a>.</div>
</template>
<template data-pop="a53-doxypep" data-title="Prophylaxie post-exposition par doxycycline : état des sources">
<p>Le projet de directive européenne de 2026 indique que plusieurs essais randomisés, surtout chez des hommes ayant des rapports sexuels avec des hommes, ont montré une baisse nette de la syphilis et des infections à chlamydia avec une prise de doxycycline dans les 24 à 72 heures suivant un rapport sans préservatif. Il juge cette stratégie appropriée dans les populations au risque le plus élevé, tout en signalant une incertitude sur la résistance bactérienne et le microbiote. Les personnes concernées restent dépistées régulièrement, car la doxycycline pourrait abaisser les titres non tréponémiques.</p>
<p><b>Position suisse.</b> Aucune recommandation de la Commission fédérale pour la santé sexuelle ni de l’OFSP sur cette prophylaxie n’a été identifiée en octobre 2026. Le texte européen de 2026 n’est encore qu’un projet soumis à consultation.</p>
<div class="src"><a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, prophylaxie post-exposition</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, PrEP et syphilis</a>.</div>
</template>
<template data-pop="a53-pl-indications" data-title="Ponction lombaire : quand ?">
<table class="t"><tr><th>Situation</th><th>SSI 2024</th><th>IUSTI 2020</th></tr><tr><td>Signes neurologiques, oculaires ou auditifs</td><td>Indiquée</td><td>Indiquée à tout stade (1, C)</td></tr><tr><td>Syphilis précoce sans signe neurologique, oculaire ni auditif</td><td>Indiquée au stade secondaire si VIH avec CD4 &lt; 200/µL ou RPR &gt; 1:32</td><td>Non indiquée (1, A)</td></tr><tr><td>Syphilis tertiaire non neurologique</td><td>Non précisé</td><td>Indiquée (1, D)</td></tr><tr><td>Syphilis tardive et VIH avec CD4 ≤ 350/µL ou RPR &gt; 1:32</td><td>Non précisé</td><td>Proposée par certains experts (2, D)</td></tr><tr><td>Enfant</td><td>Indiquée</td><td>Bilan de syphilis congénitale avec liquide céphalo-rachidien</td></tr></table><div class="key"><b>Lecture et physiopathologie.</b> La ponction lombaire cherche une invasion du système nerveux, qui peut survenir dès les premiers stades. En effet, le tréponème atteint tôt le liquide céphalorachidien, mais il en est souvent éliminé sans traitement spécifique. Cependant, une immunité affaiblie, comme dans l’infection par le VIH avec peu de CD4, ou une charge élevée reflétée par un RPR élevé, rend cette élimination moins sûre ; c’est pourquoi ces situations élargissent l’indication.</div>
<div class="lab">Décision retenue</div><p>La position suisse s’applique pour l’examen fédéral : au stade secondaire, une infection par le VIH avec moins de 200 CD4/µL ou un RPR supérieur à 1:32 indique une ponction lombaire. La directive européenne ne l’indique pas (recommandation 1, A), car le VIH n’augmente pas le risque d’atteinte neurologique ou oculaire de la syphilis précoce et la progression d’une invasion asymptomatique vers une neurosyphilis symptomatique est exceptionnelle. Le projet de 2026 nuance : le risque de neurosyphilis est trois à six fois plus élevé lorsque le VIH est mal contrôlé (CD4 ≤ 350/µL, charge virale détectable ou absence de traitement), et certains experts proposent alors une ponction à tout stade.</p>
<div class="src"><a href="https://ssi.guidelines.ch/guideline/2271/fr" target="_blank" rel="noopener" data-reference-source="1">SSI 2024, neurosyphilis</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener" data-reference-source="1">IUSTI 2020, neurosyphilis</a> ; <a href="https://iusti.org/wp-content/uploads/2026/06/2026-Syphilis-guideline_Draft-for-Wider-circulation-.docx" target="_blank" rel="noopener" data-reference-source="1">projet IUSTI 2026, VIH</a>.</div>
</template>
