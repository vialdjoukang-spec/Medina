<template data-pop="b24-examens" data-title="Loi de Pareto — Examens du VIH">
<p class="ratio" data-cover="b24-e0,b24-e1,b24-e2,b24-e3,b24-e4,b24-e5,b24-e6,b24-e7,b24-e8"></p><ul><li>Diagnostic suisse : dépistage de quatrième génération, confirmation d’une autre technique sur le même échantillon, vérification par charge virale sur un second échantillon.</li><li>Fenêtre : 6 semaines pour le test de quatrième génération ; ARN détectable vers le 11<sup>e</sup> jour ; primo-infection suspectée : test moléculaire en parallèle.</li><li>Seuils de l’ARN : 50 copies/mL pour la suppression, 200 pour l’échec et la transmission sexuelle ; OMS : non-suppression au-delà de 1000.</li><li>CD4 : nombre absolu et pourcentage ; seuils 200/µL et 14 %.</li><li>Bilan initial : génotype, hépatites A, B et C, rein, foie, HLA-B*57:01 avant abacavir, sérologies, infections sexuellement transmissibles.</li><li>Sous 100 CD4/µL : antigène cryptococcique ; un test de libération d’interféron gamma négatif n’exclut pas la tuberculose.</li><li>Suivi : ARN tous les 3 à 12 mois (EACS) ; OMS : à 6 et 12 mois puis chaque année. Suppression incomplète : ARN &gt;50 copies/mL à 6 mois ; jamais de changement sur une valeur isolée.</li></ul>
</template>

<template data-pop="b24-e-diagnostic-ch" data-title="Directive OFSP 2025 : le parcours du laboratoire">
<div class="lab">Organisation</div><p>La directive de 2025 remplace l’ancien concept de test de 2013. Tout laboratoire de microbiologie autorisé par Swissmedic peut confirmer le VIH ; le Centre national de référence pour les rétrovirus conseille, traite les cas douteux et détermine pour l’OFSP si les transmissions sont récentes.</p>
<div class="lab">Commentaires standardisés</div><p>Chaque rapport porte une interprétation globale normalisée : « VIH négatif », « VIH positif » ou « VIH douteux », avec les arguments et la mention des analyses complémentaires nécessaires. Ce commentaire figure toujours dans le rapport, même après un entretien téléphonique.</p>
<div class="lab">Assurance qualité</div><p>Tous les tests doivent porter le marquage CE et être destinés au diagnostic, pas seulement au suivi de la charge virale ; l’accréditation des techniques est requise et les laboratoires participent à des contrôles de qualité externes reconnus par la QUALAB.</p>
<p class="src"><a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive 2025, version 4 du 10 juillet 2026, §§ 1–4</a>, lue le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-fenetre" data-title="Fenêtre diagnostique : résultat négatif et délai">
<div class="lab">Cinétique des marqueurs</div><p>Selon EACS 13, l’ARN du VIH-1 devient détectable vers le 11<sup>e</sup> jour après l’exposition, environ 7 jours avant l’antigène p24 et 12 jours avant les anticorps. Au tout premier stade, l’ARN médian est d’environ 2000 copies/mL et reste sous 100 copies/mL chez environ 10 % des personnes : une valeur basse isolée s’interprète avec prudence, en raison du risque de faux positif.</p>
<div class="lab">Lecture pratique</div><p>La fenêtre d’un test de quatrième génération est de 6 semaines selon l’OFSP. Les tests rapides d’anticorps se positivent en général en 28 jours selon l’OMS. Une nouvelle exposition ouvre un nouveau délai. Toute charge virale détectable avec une sérologie négative ou indéterminée exige une confirmation de la séroconversion, avec un contrôle hebdomadaire selon EACS.</p>
<p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/b74f67fa130d469c92a201f82894fa25" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary HIV Infection</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive 2025 v4, § 2.4</a> ; <a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, 27 juillet 2026</a>. Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-prep" data-title="PrEP : ambiguïtés diagnostiques">
<div class="lab">EACS 13</div><p>Un test de quatrième génération négatif est documenté la semaine précédant la PrEP ou le jour même. Un ARN plasmatique est réalisé avant ou le jour du début, surtout après une exposition à haut risque dans les 6 semaines précédentes ou avant une PrEP injectable par cabotégravir ou lénacapavir ; l’attente du résultat ne retarde pas la PrEP chez une personne à haut risque. Pendant la PrEP, un test de quatrième génération est répété à un mois puis tous les 2 à 4 mois. Au moindre signe de séroconversion, la PrEP est remplacée sans interruption par un traitement triple.</p>
<div class="lab">Document de référence suisse</div><p>Après une exposition sexuelle dans les 6 semaines précédant le début, l’OFSP demande soit une PCR supplémentaire, soit un nouveau test de quatrième génération 4 semaines après le début de la PrEP.</p>
<p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/851c017a0af94e57a03093f5ce2304c0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Pre-exposure Prophylaxis</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/keFF8kxAp5lz/refdoc-art.12b-hiv-prep.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, document de référence PrEP, 11 mars 2024</a>. Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-arn" data-title="ARN du VIH-1 : matrice, unité et limites">
<div class="lab">Prélèvement et méthode</div><p>Le catalogue du CHUV décrit une virémie par amplification après transcription inverse à partir du plasma anticoagulé à l’acide éthylènediaminetétraacétique. Les modalités de séparation, de volume et d’acheminement sont celles du laboratoire.</p>
<div class="lab">Limites analytiques et seuils cliniques</div><p>La limite de détection indique jusqu’où un signal est reconnu ; la limite de quantification, jusqu’où une concentration est rendue avec les performances validées. « Détecté non quantifiable » est donc cohérent. Les seuils cliniques sont d’une autre nature : 50 copies/mL pour la suppression, 200 copies/mL pour l’échec selon EACS 13.</p>
<div class="lab">Calcul</div><p>En logarithmes décimaux, une différence de 2 (5,26 − 3,26) correspond à une division par 100. Ce repère suit une évolution ; il n’établit pas la suppression.</p>
<p class="src"><a href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/DLA_INV_01_00436/hiv-1" target="_blank" rel="noopener" data-reference-source="1">CHUV, catalogue des analyses, virémie VIH-1 par PCR quantitative</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Virological Failure</a>. Lus le 8 octobre 2026 ; la fiche du CHUV ne porte pas de date de version visible.</p>
</template>

<template data-pop="b24-e-cd4" data-title="CD4 : mesure cellulaire et référence suisse datée">
<div class="lab">Nombre et pourcentage</div><p>La cytométrie identifie une population cellulaire par ses marqueurs. Le nombre absolu et la proportion répondent à deux questions de mesure différentes. Dans un exemple hypothétique, 1000 lymphocytes/µL dont 10 % de CD4 donnent 100 CD4/µL ; ce pourcentage n’a pas été mesuré chez M. L.</p>
<div class="lab">Exemple de laboratoire suisse</div><p>ZetLab indique chez l’adulte, sur sang anticoagulé, 300 à 1140 CD4/µL et 33 à 63 % ; la fiche porte une dernière modification au 20 mars 2026. Ce repère ne s’applique ni à l’enfant ni à tout laboratoire.</p>
<div class="lab">Seuil de décision</div><p>Être dans un intervalle de référence et franchir un seuil de prévention sont deux notions distinctes : la prophylaxie de la pneumocystose se décide sous 200/µL ou 14 %, la vaccination vivante sous 200/µL ou 15 %.</p>
<p class="src"><a href="https://www.zetlab.ch/z-lex-analysen/details/natural-killer-cells-1?print=1" target="_blank" rel="noopener" data-reference-source="1">ZetLab, immunophénotypage des lymphocytes, modification du 20 mars 2026</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/1caa81786ee74bf2887fc8bce8636e1d" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary Prophylaxis</a>. Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-resistance" data-title="Génotype de résistance : ce que le résultat explore">
<div class="lab">Quand le demander</div><p>EACS 13 recommande le génotype avant le traitement, idéalement au diagnostic, sans retarder le début ; lors d’une primo-infection, dans tous les cas et le plus tôt possible. En cas d’échec, il se fait de préférence sous le traitement en échec ; il est habituellement réalisable au-delà de 200 à 500 copies/mL, et dans des laboratoires spécialisés pour des virémies plus basses.</p>
<div class="lab">Limites</div><p>Le séquençage ne renseigne que les gènes étudiés. Sans pression médicamenteuse, des mutations peuvent régresser et ne plus être détectées : EACS demande de toujours se référer au génotype cumulé.</p>
<p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/5d8c430a1bac4e8492807c87ac671fe2" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initiation of ART</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Virological Failure</a>. Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-hepatites" data-title="Hépatites : exposition, immunité et infection active">
<div class="lab">Hépatite B</div><p>Le dépistage distingue trois situations. Antigène HBs positif : co-infection, qui impose un traitement contenant du ténofovir. Anti-HBc positif avec antigène HBs négatif : exposition ancienne, avec un faible risque de réactivation. Marqueurs négatifs : vaccination. Selon EACS 13, la recherche de l’hépatite D est réservée à l’hépatite B chronique.</p>
<div class="lab">Hépatite C et hépatite A</div><p>Lors d’une infection récente, la séroconversion de l’hépatite C peut être retardée : l’ARN viral est nécessaire pour reconnaître une infection récente. L’immunité contre l’hépatite A est vérifiée ; une personne séronégative se voit proposer la vaccination.</p>
<p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/a5d3cadd036f49c9bfa7abf59f7a4c62" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, HBV/HIV Co-infection</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/b74f67fa130d469c92a201f82894fa25" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Primary HIV Infection</a>. Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-tb" data-title="Tuberculose : test immunologique et maladie">
<div class="lab">Définitions d’EACS 13</div><p>L’infection tuberculeuse, autrefois dite latente, est un portage asymptomatique ; elle se traite si le test cutané dépasse 5 mm, si le test de libération d’interféron gamma est positif ou après un contact étroit avec un cas bacillifère. La tuberculose maladie associe des symptômes et l’identification de <i>Mycobacterium tuberculosis</i> par microscopie, amplification génique ou culture ; à défaut, le diagnostic clinique de l’OMS s’appuie sur l’imagerie, l’histologie et l’anamnèse.</p>
<div class="lab">Ce qu’un test négatif laisse ouvert</div><p>Le test mesure une réponse lymphocytaire ; chez les personnes vivant avec le VIH, sa sensibilité pour la tuberculose maladie était de 0,60 à 0,66 selon le test dans une méta-analyse de 2022. Devant une fièvre et un amaigrissement, la recherche microbiologique est indispensable.</p>
<p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/dfb1ffd00f7b4fd393bb13ee86b90d1e" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Tuberculosis</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35249210/" target="_blank" rel="noopener" data-reference-source="1">méta-analyse, Infection, 2022, résumé lu</a>. Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-ist" data-title="Infections sexuellement transmissibles : dépistage">
<div class="lab">Fréquence</div><p>EACS 13 recommande une sérologie de la syphilis et un dépistage des infections sexuellement transmissibles au diagnostic, puis tous les 3 à 12 mois en cas d’exposition, plus souvent si nécessaire. Après une infection récente par le VIH, il recherche la syphilis, la gonorrhée, la chlamydia, les hépatites B et C et le papillomavirus.</p>
<div class="lab">Modalités suisses</div><p>Le document de référence PrEP de l’OFSP déconseille les tests rapides de la syphilis, insuffisamment sensibles et spécifiques, et recommande un dépistage même en cas d’usage du préservatif, qui protège mal contre les infections bactériennes.</p>
<p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/keFF8kxAp5lz/refdoc-art.12b-hiv-prep.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, document de référence PrEP, 11 mars 2024</a>. Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-securite" data-title="Bilan d’organes et HLA : préparer une prescription sûre">
<div class="lab">État de référence</div><p>Formule sanguine, débit de filtration, bandelette urinaire ou protéinurie, tests hépatiques, glycémie et lipides : EACS 13 les prévoit au diagnostic, puis à intervalles réguliers. Une anomalie préexistante n’est pas imputable au médicament prescrit ensuite.</p>
<div class="lab">Estimation rénale</div><p>Les informations professionnelles suisses de Biktarvy®, Descovy® et Dovato® fixent leurs limites en clairance de la créatinine ; Symtuza® précise la formule de Cockcroft-Gault. L’estimation utilisée doit correspondre à celle de la notice.</p>
<div class="lab">Test conditionnel</div><p>HLA-B*57:01 est recherché avant l’abacavir, contre-indiqué si le test est positif ; même négatif, le patient reçoit une information sur le risque d’hypersensibilité, et l’abacavir n’est pas utilisé pour un démarrage le jour même.</p>
<p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/9e7768c921f248d9a9cebbdd4cb20214" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Initial Regimens, guidance V</a> ; Informations professionnelles suisses, Swissmedic (AIPS). Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-oi" data-title="À 86 CD4/µL : bilan opportuniste orienté">
<div class="lab">Recherches systématiques selon EACS 13</div><p>Antigène cryptococcique sérique chez toute personne nouvellement diagnostiquée avec moins de 100 CD4/µL ; s’il est positif, ponction lombaire et recherche d’une atteinte pulmonaire ou d’un autre site. Sans méningite ni autre localisation, traitement préemptif : fluconazole 800 mg par jour pendant 2 semaines, puis 400 mg pendant 8 semaines. Sérologies de la toxoplasmose et du cytomégalovirus au bilan initial.</p>
<div class="lab">Examens dirigés</div><p>Radiographie thoracique en cas d’exposition à la tuberculose, à envisager systématiquement chez les personnes issues de populations à forte prévalence ; recherche de leishmaniose, de schistosomiase ou de strongyloïdose selon les voyages.</p>
<p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/b345db315dde48bb8015e82fa0aedfbd" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Cryptococcosis</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment</a>. Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-suivi" data-title="Suivi : calendrier biologique et état clinique">
<div class="lab">EACS 13</div><p>ARN tous les 3 à 12 mois ; CD4, CD8 et pourcentage tous les 3 à 12 mois, une fois par an chez une personne stable ; formule sanguine, débit de filtration et tests hépatiques tous les 3 à 12 mois. Le tableau ne date pas le premier contrôle après le début du traitement.</p><div class="lab">Algorithme de l’OMS (2023)</div><p>Résultat de charge virale obtenu et relu au plus tard 6 mois après le début, puis à 12 mois et chaque année. Résultat indétectable : maintien du schéma. Résultat détectable jusqu’à 1000 copies/mL : soutien renforcé à l’observance et nouveau contrôle à 3 mois. Au-delà de 1000 copies/mL à deux reprises, à 3 mois d’intervalle : changement de schéma.</p>
<div class="lab">Virémie faible</div><p>Entre 50 et 200 copies/mL : renforcer l’observance et recontrôler 1 à 2 mois plus tard ; sans mutation, maintenir un schéma contenant du bictégravir, du dolutégravir ou un IP potentialisé. Une virémie non supprimable entre 50 et 1000 copies/mL peut persister des années par prolifération de cellules infectées.</p>
<p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/06b770dfd735492090249f2144f00fb0" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Assessment</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Virological Failure</a> ; <a href="https://www.who.int/publications/i/item/9789240055179" target="_blank" rel="noopener" data-reference-source="1">OMS, note d’orientation sur la suppression virale, 22 juillet 2023</a>, annexe 1. Lus le 8 octobre 2026.</p>
</template>

<template data-pop="b24-e-populations" data-title="Nourrisson et grossesse : limites du bilan adulte">
<div class="lab">Enfant exposé</div><p>Avant 18 mois, les tests rapides d’anticorps ne suffisent pas à identifier l’infection : l’OMS demande un test virologique, dès la naissance ou à 6 semaines. En Suisse, la directive OFSP exclut le diagnostic périnatal et renvoie aux recommandations de la CFSS de 2018. Pour le VIH-2, EACS 13 recommande la recherche de l’ADN viral chez l’enfant né d’une mère infectée.</p>
<div class="lab">Grossesse</div><p>EACS 13 fixe l’ARN à chaque trimestre et à 36 semaines si la femme est durablement supprimée et observante, tous les deux mois sinon, et toutes les deux semaines jusqu’à un ARN &lt;50 copies/mL si la suppression n’est pas obtenue au troisième trimestre.</p>
<p class="src"><a href="https://www.who.int/news-room/fact-sheets/detail/hiv-aids" target="_blank" rel="noopener" data-reference-source="1">OMS, 27 juillet 2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/UDsk16pv0TsC/D%C3%A9pistage-du-VIH-directive_2025-v4-avec-annexe-fr.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, directive 2025 v4</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/0afde39c61e6482ab566f3aa9fc09fcd" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, HIV-2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12757896/" target="_blank" rel="noopener" data-reference-source="1">Ambrosioni et coll., HIV Medicine 2025</a>. Lus le 8 octobre 2026.</p>
</template>
