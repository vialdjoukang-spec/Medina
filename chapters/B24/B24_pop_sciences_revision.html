<template data-pop="b24-galt" data-title="GALT : le compartiment intestinal du tissu lymphoïde">
  <p data-science-source="mehandru">Une remontée des CD4 sanguins ne démontre pas la restauration du GALT. Les biopsies de Mehandru concernent l’infection précoce ; elles ne définissent pas une indication chez M. L.</p>
  <p class="src"><a href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0030484" target="_blank" rel="noopener" data-reference-source="1">Mehandru et coll., 2006, texte primaire</a> ; <a href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0030546" target="_blank" rel="noopener" data-reference-source="1">correction bibliographique, 26.12.2006</a>. Consultés le 08.10.2026.</p>
</template>

<template data-pop="b24-follicule" data-title="Follicule : organisation, activation et perte de fonction">
  <p data-science-source="levesque">L’activation n’assure pas une coopération cellulaire efficace. L’histologie distingue prolifération, apoptose et désorganisation, sans déterminer seule la cause d’une adénopathie.</p>
  <p class="src"><a href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1000107" target="_blank" rel="noopener" data-reference-source="1">Levesque et coll., Public Library of Science Medicine, 07.07.2009, étude primaire</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-fibrose" data-title="Réseau réticulaire et interleukine 7 : survie des cellules T">
  <p data-science-source="zeng">Les cellules réticulaires fibroblastiques fournissent un réseau de soutien et de l’interleukine 7, signal de survie. Le collagène peut limiter ce contact. La boucle de perte stromale décrite associe données humaines et simiennes ; elle n’établit pas l’efficacité clinique d’un antifibrotique.</p>
  <p class="src"><a href="https://www.jci.org/articles/view/45157/pdf" target="_blank" rel="noopener" data-reference-source="1">Zeng et coll., Journal of Clinical Investigation 2011, résumé primaire accessible</a>, consulté le 08.10.2026 ; le texte intégral n’a pas été lu.</p>
</template>

<template data-pop="b24-cd4-fonction" data-title="CD4 normal : aider la reconnaissance et la signalisation T">
  <p data-science-source="yin">Le récepteur T reconnaît le peptide ; CD4 se lie à la molécule de classe II qui le présente. Son association à Lck renforce la signalisation. Le VIH exploite cette molécule pour entrer, sans que sa fonction normale consiste à reconnaître le virus.</p>
  <p data-science-source="yin">La structure expérimentale utilise un CD4 modifié pour stabiliser la liaison ; elle ne mesure pas l’efficacité immunitaire d’un patient.</p>
  <p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325661/" target="_blank" rel="noopener" data-reference-source="1">Yin et coll., Proceedings of the National Academy of Sciences, 19.03.2012, texte primaire</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-cd4-mesure" data-title="CD4 : compte absolu, pourcentage et repère de laboratoire">
  <p>Les <b>86 cellules/µL</b> de M. L. sont un compte absolu. Son pourcentage n’est pas fourni : ne pas l’inventer. Les conditions de mesure et l’exemple de référence suisse adulte figurent dans les Examens.</p>
  <div class="key">Ce résultat décrit la situation initiale de M. L. ; aucune valeur de suivi n’est fournie.</div>
  <p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325661/" target="_blank" rel="noopener" data-reference-source="1">Yin et coll., Proceedings of the National Academy of Sciences 2012, fonction du corécepteur CD4</a>, consulté le 08.10.2026. Pour les références de laboratoire, lire la fenêtre « CD4 : mesure cellulaire et référence suisse datée » des Examens.</p>
</template>

<template data-pop="b24-entree" data-title="Entrée : CD4, CCR5, CXCR4 et fusion par gp41">
  <p data-science-source="shaik">gp120 engage CD4 puis un corécepteur compatible ; gp41 permet la fusion. Les virus R5 utilisent CCR5, les virus X4 CXCR4 ; certains utilisent les deux. Une valeur basse de CD4 ne révèle pas ce tropisme et n’établit pas l’activité d’un blocage de CCR5.</p>
  <p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6391877/" target="_blank" rel="noopener" data-reference-source="1">Shaik et coll., Nature, en ligne 12.12.2018, numéro 2019, texte primaire</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-cycle" data-title="Cycle du VIH-1 : suivre la cible plutôt que mémoriser une liste">
  <p data-science-source="centazzo">L’ARN devient ADN proviral, puis permet de nouveaux ARN et protéines. Bloquer ces réactions ne démontre pas la disparition des cellules infectées.</p>
  <p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10053624/" target="_blank" rel="noopener" data-reference-source="1">Centazzo et coll., Viruses, 09.03.2023, revue consacrée à la protéase du VIH-1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7357238/" target="_blank" rel="noopener" data-reference-source="1">Passos et coll., 2020, intégration</a>. Consultés le 08.10.2026.</p>
</template>

<template data-pop="b24-rt" data-title="Transcriptase inverse : fabriquer l’ADN et distinguer les inhibiteurs">
  <p data-science-source="kellinger">L’enzyme ajoute des nucléotides à la chaîne d’ADN. Les analogues nucléos(t)idiques doivent disposer d’une forme intracellulaire active ; leur incorporation peut interrompre l’allongement. Les inhibiteurs non nucléosidiques utilisent un autre site. Les mesures enzymatiques de Kellinger éclairent la discrimination des substrats, sans prédire seules une réponse clinique.</p>
  <p class="src"><a href="https://www.pnas.org/doi/full/10.1073/pnas.0913946107" target="_blank" rel="noopener" data-reference-source="1">Kellinger et Johnson, Proceedings of the National Academy of Sciences, 12.04.2010, étude cinétique primaire</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-integrase" data-title="Intégrase : empêcher une insertion, sans exciser le provirus">
  <p data-science-source="passos">L’intasome associe l’intégrase aux extrémités de l’ADN viral. L’inhibiteur du transfert de brin bloque leur jonction à l’ADN cellulaire. Il ne coupe pas un provirus déjà inséré : son activité antivirale et l’élimination du réservoir sont des objectifs différents.</p>
  <p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7357238/" target="_blank" rel="noopener" data-reference-source="1">Passos et coll., Science 2020, structures d’intasomes et essais biochimiques</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-protease" data-title="Protéase : faire mûrir une particule déjà assemblée">
  <p data-science-source="centazzo">La découpe des polyprotéines précurseurs Gag et Pol permet une maturation normale. Bloquer la protéase interrompt cette étape, sans désinfecter directement la cellule porteuse d’un provirus silencieux.</p>
  <p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10053624/" target="_blank" rel="noopener" data-reference-source="1">Centazzo et coll., Viruses, 09.03.2023, revue virologique</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-reservoir" data-title="Latence et clonalité : pourquoi le contrôle ne démontre pas une guérison">
  <p data-science-source="mcmyn">L’ADN viral peut persister dans une cellule et ses descendantes malgré un traitement prolongé. Sa détection ne prouve pas sa compétence ; un prélèvement négatif ne démontre pas son absence partout.</p>
  <p class="src"><a href="https://www.jci.org/articles/view/171554" target="_blank" rel="noopener" data-reference-source="1">McMyn et coll., Journal of Clinical Investigation, 18.07.2023, texte primaire</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-pyroptose" data-title="Pyroptose : relier mort cellulaire et inflammation, avec la limite du modèle">
  <p data-science-source="doitsh">La pyroptose libère des contenus cellulaires et des médiateurs inflammatoires. Doitsh l’étudie surtout dans des cultures de tissus lymphoïdes humains. Le chiffre majoritaire de ce modèle ne signifie pas que la même proportion explique la perte totale des CD4 d’un patient.</p>
  <p class="src"><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4047036/" target="_blank" rel="noopener" data-reference-source="1">Doitsh et coll., Nature, 23.01.2014, texte primaire en libre accès</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-translocation" data-title="Translocation microbienne : inflammation et diagnostic de fièvre restent distincts">
  <p data-science-source="brenchley">Des produits microbiens traversant une barrière altérée peuvent stimuler les monocytes et entretenir l’activation. Le lipopolysaccharide étudié est un indice de ce mécanisme ; il ne désigne pas le foyer d’une fièvre et n’exclut pas une infection opportuniste.</p>
  <p class="src"><a href="https://link.springer.com/article/10.1186/1742-4690-3-S1-S98" target="_blank" rel="noopener" data-reference-source="1">Brenchley, Retrovirology, 21.12.2006, résumé primaire d’une communication</a>, consulté le 08.10.2026 ; le texte intégral de l’article Nature Medicine correspondant n’a pas été lu.</p>
</template>

<template data-pop="b24-iris-mecanisme" data-title="IRIS : réponse restaurée face à des antigènes persistants">
  <p data-science-source="boulware">La restauration d’une réponse peut amplifier l’inflammation contre une infection ou ses antigènes. L’étude de Boulware concerne la méningite cryptococcique : ses profils de cytokines ne constituent pas une signature diagnostique universelle, et sa fréquence d’IRIS ne s’applique pas au fil clinique de M. L.</p>
  <p class="src"><a href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.1000384" target="_blank" rel="noopener" data-reference-source="1">Boulware et coll., Public Library of Science Medicine, 21.12.2010, cohorte primaire</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-iris-differentiel" data-title="Avant de conclure à un IRIS : infection, traitement et toxicité">
  <p data-science-source="eacs-iris">EACS 13 ne retient un IRIS qu’après exclusion de l’évolution attendue d’une infection opportuniste, traitée ou non, et d’une toxicité médicamenteuse. La plupart des IRIS se résolvent en quelques semaines en poursuivant le traitement de l’infection et le traitement antirétroviral, sans anti-inflammatoire. Dans les formes menaçantes, des corticoïdes peuvent être utilisés, avec peu de données ; dans l’IRIS de la méningite cryptococcique, il faut d’abord optimiser l’antifongique et traiter l’hypertension intracrânienne.</p>
  <p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/e9ccb1296ed04c91be59234de5789ccb" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Immune Reconstitution Inflammatory Syndrome</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-barriere" data-title="Barrière génétique : mutations, coût biologique et exposition réelle">
  <p data-science-source="mesplede">Une mutation résistante peut altérer l’enzyme et réduire la capacité de réplication. D’autres changements peuvent modifier ce compromis. L’expérience de Mesplède illustre un coût de certaines associations de mutations ; elle ne permet pas d’annoncer une impossibilité de résistance au dolutégravir.</p>
  <p class="src"><a href="https://link.springer.com/article/10.1186/1742-4690-10-22" target="_blank" rel="noopener" data-reference-source="1">Mesplède et coll., Retrovirology, 22.02.2013, étude primaire expérimentale</a>, consultée le 08.10.2026.</p>
</template>

<template data-pop="b24-genotype-phenotype" data-title="Génotype et phénotype : prédire une sensibilité ou la mesurer">
  <p data-science-source="eacs-vf">Un résultat actuel sans mutation détectée n’efface pas une résistance historique : sans pression médicamenteuse, des mutations peuvent régresser et ne plus être détectées. EACS 13 demande de se référer au génotype cumulé et de pratiquer le test de résistance de préférence sous le traitement en échec ; il est habituellement réalisable au-delà de 200 à 500 copies/mL.</p>
  <p class="src"><a href="https://eacs.sanfordguide.com/resolveuid/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, Virological Failure</a>, consulté le 08.10.2026.</p>
</template>

<template data-pop="b24-vih2" data-title="VIH-2 : ne pas transposer automatiquement les outils du VIH-1">
  <p data-science-source="ren">La transcriptase inverse du VIH-2 diffère notamment dans la poche des inhibiteurs non nucléosidiques. Cette différence explique une résistance intrinsèque à cette classe ; « même enzyme cible » ne signifie pas « même sensibilité ».</p>
  <p data-science-source="eacs-vih2">EACS 13 fait suspecter un VIH-2 devant un profil d’immunoblot atypique, une différenciation des anticorps en faveur du VIH-2, une sérologie positive avec un ARN du VIH-1 indétectable sans traitement, ou une origine d’Afrique de l’Ouest. Le VIH-2 est naturellement résistant à tous les inhibiteurs non nucléosidiques, à l’atazanavir et au fostemsavir ; il reste sensible aux inhibiteurs nucléosidiques, aux inhibiteurs de l’intégrase et au darunavir. Son ARN exige une amplification spécifique et son génotype un centre de référence.</p>
  <p class="src"><a href="https://pubmed.ncbi.nlm.nih.gov/12386343/" target="_blank" rel="noopener" data-reference-source="1">Ren et coll., Proceedings of the National Academy of Sciences 2002, résumé primaire</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/0afde39c61e6482ab566f3aa9fc09fcd" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, HIV-2</a>. Consultés le 08.10.2026.</p>
</template>

<template data-pop="b24-pareto-sciences" data-title="Loi de Pareto — Sciences fondamentales du VIH de l’adulte">
  <p class="ratio" data-cover="b24-s-1,b24-s-2,b24-s-3,b24-s-4,b24-s-5,b24-s-6,b24-s-7,b24-s-8,b24-s-9"></p>
  <ul><li>Le CD4 amplifie la reconnaissance antigénique ; sa perte expose sous 200/µL aux infections opportunistes.</li><li>Le cycle compte six étapes ; les traitements bloquent l’entrée, la transcription inverse, l’intégration ou la maturation.</li><li>La pyroptose des CD4 à infection abortive entretient la déplétion et l’inflammation.</li><li>La barrière génétique repose sur le coût biologique des mutations ; elle protège un traitement bien pris.</li><li data-science-source="mehandru">Le sang ne mesure pas directement la restauration du tissu lymphoïde intestinal.</li><li data-science-source="mcmyn">Une suppression plasmatique ne démontre pas l’élimination du réservoir ; elle ne justifie pas un arrêt autonome.</li><li data-science-source="eacs-iris">Une aggravation après traitement demande d’exclure les autres causes avant de retenir un IRIS.</li><li data-science-source="eacs-vf">Les résistances s’interprètent avec les résultats antérieurs.</li><li data-science-source="eacs-vih2">Le VIH-2 exige des outils adaptés ; les conclusions du VIH-1 ne se transposent pas automatiquement.</li></ul>
  <div class="key">Chez M. L., garder ensemble les symptômes, les 86 CD4/µL et les 180 000 copies/mL. Aucun de ces éléments ne remplace les deux autres.</div>
  <p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3325661/" target="_blank" rel="noopener" data-reference-source="1">Yin 2012</a> ; <a href="https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0030484" target="_blank" rel="noopener" data-reference-source="1">Mehandru 2006</a> ; <a href="https://www.jci.org/articles/view/171554" target="_blank" rel="noopener" data-reference-source="1">McMyn 2023</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/e9ccb1296ed04c91be59234de5789ccb" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, IRIS</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/3976a3620e8a4014ab2777d1960cfaae" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, échec virologique</a> ; <a href="https://eacs.sanfordguide.com/resolveuid/0afde39c61e6482ab566f3aa9fc09fcd" target="_blank" rel="noopener" data-reference-source="1">EACS 13.0, VIH-2</a>. Consultées le 08.10.2026.</p>
</template>
