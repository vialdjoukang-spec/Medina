<section class="ilot" id="b37-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. B., 67 ans, est hospitalisé aux soins intensifs depuis douze jours après une chirurgie abdominale ; il porte un cathéter veineux central et reçoit des antibiotiques à large spectre. Or, il refait de la fièvre, et une hémoculture pousse une levure. Ainsi, ce tableau est celui d’une <button class="w" data-k="b37-pa-candidemie">candidémie</button>, forme la plus grave de la candidose. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, candidémie</a>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, comment distinguer colonisation et infection ? Ensuite, comment traiter les candidoses muqueuses fréquentes, buccale et vaginale ? Puis, pourquoi la candidémie est-elle une urgence, et comment la traiter ? Enfin, comment prendre en charge la candidose vulvo-vaginale récidivante ?</p>
<div class="key"><b>À retenir.</b> <i>Candida</i> dans la bouche ou le vagin est souvent un commensal ; <i>Candida</i> dans le sang est toujours une infection à traiter.</div></section>

<section class="ilot" id="b37-pa-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Pour répondre à ces questions, il faut d’abord définir la maladie. La candidose est une infection due à une levure du genre <i><button class="w" data-k="b37-s-candida">Candida</button></i>, le plus souvent <i>C. albicans</i>. Par ailleurs, elle se classe en deux grands groupes : les formes superficielles, muqueuses ou cutanées, et les formes invasives, dont la candidémie. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, introduction</a>.</p>
<table class="t"><thead><tr><th></th><th>Candidose superficielle</th><th>Candidose invasive</th></tr></thead><tbody>
<tr><td>Sièges</td><td>Bouche, œsophage, vagin, plis cutanés, ongles</td><td>Sang, abdomen, œil, cœur, os</td></tr>
<tr><td>Terrain</td><td>Antibiotiques, corticoïdes inhalés, diabète, immunodépression cellulaire</td><td>Soins intensifs, cathéter central, chirurgie abdominale, neutropénie</td></tr>
<tr><td>Gravité</td><td>Gêne, rarement grave</td><td>Mortalité élevée</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Ce tableau oppose deux maladies différentes : la candidose superficielle naît d’un déséquilibre local chez un hôte souvent compétent, alors que la candidose invasive suppose une brèche, cathéter, chirurgie ou neutropénie, qui fait passer la levure dans le sang. C’est pourquoi la première se traite localement ou par une dose courte, et la seconde exige une échinocandine et le contrôle de la source. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, candidémie</a>.</div>
<p>Ainsi, le tableau montre que le site détermine le pronostic : c’est pourquoi le traitement d’une forme superficielle et celui d’une candidémie n’ont rien en commun. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293</a> ; <a href="https://doi.org/10.1093/ofid/ofab471" target="_blank" rel="noopener" data-reference-source="1">Adam KM et al., réseau suisse FUNGINOS, épidémiologie de la candidémie en Suisse sur 15 ans, Open Forum Infect Dis 2021;8:ofab471</a>.</p></section>

<section class="ilot" id="b37-pa-2"><h2><span class="n">2</span>Épidémiologie suisse</h2>
<p>Une fois la maladie définie, reste à en mesurer le poids en Suisse. Or, les candidoses superficielles ne sont pas recensées ; en revanche, le réseau <button class="w" data-k="b37-pa-funginos">FUNGINOS</button> a étudié la candidémie sur 15 ans (2004–2018), avec 2273 isolats sanguins. Ainsi, l’incidence en population est passée de 2,96 à 4,20 pour 100 000 habitants par an. <a href="https://doi.org/10.1093/ofid/ofab471" target="_blank" rel="noopener" data-reference-source="1">Adam KM et al., réseau suisse FUNGINOS, épidémiologie de la candidémie en Suisse sur 15 ans, Open Forum Infect Dis 2021;8:ofab471</a>.</p>
<p>De plus, la répartition des espèces a changé : la part de <i>C. albicans</i> a baissé de 60 % à 53 %, tandis que celle de <i>C. glabrata</i> est passée de 18 % à 27 %. Cependant, la résistance est restée rare : 1 % des <i>C. albicans</i> n’étaient pas sensibles au fluconazole, et 2 % des <i>C. albicans</i> et <i>C. glabrata</i> aux échinocandines. <a href="https://doi.org/10.1093/ofid/ofab471" target="_blank" rel="noopener" data-reference-source="1">Adam KM et al., réseau suisse FUNGINOS, épidémiologie de la candidémie en Suisse sur 15 ans, Open Forum Infect Dis 2021;8:ofab471</a>.</p>
<div class="key"><b>À retenir.</b> La candidémie augmente en Suisse et glisse vers <i>C. glabrata</i>, moins sensible au fluconazole.</div></section>

<section class="ilot" id="b37-pa-3"><h2><span class="n">3</span>Physiopathologie : de la colonisation à l’infection</h2>
<p>Ce glissement épidémiologique s’explique par la biologie de la levure. En effet, <i>Candida</i> colonise normalement le tube digestif, la bouche et le vagin ; or, il ne devient pathogène que lorsque l’équilibre est rompu. Ainsi, les antibiotiques suppriment la flore bactérienne concurrente, tandis que les déficits de l’immunité locale ou cellulaire laissent la levure proliférer et former des filaments invasifs. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, introduction</a>.</p>
<p>Ensuite, pour la candidémie, la levure franchit une barrière : la muqueuse digestive lésée après chirurgie, ou la peau le long d’un cathéter colonisé, où elle forme un biofilm. Par conséquent, le contrôle de la source, en particulier le retrait du cathéter, fait partie du traitement. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, contrôle de la source</a>.</p>
<div class="key"><b>Corrélation clinique.</b> Le biofilm sur le cathéter protège la levure des antifongiques : c’est pourquoi le retrait précoce du cathéter est fortement recommandé.</div></section>

<section class="ilot" id="b37-pa-4"><h2><span class="n">4</span>Facteurs de risque</h2>
<p>Ce mécanisme désigne les terrains à risque, qui diffèrent selon la forme. D’abord, pour les formes muqueuses : antibiothérapie, corticoïdes, notamment inhalés, prothèse dentaire, diabète, grossesse pour la forme vaginale, et immunodépression cellulaire comme l’infection par le VIH. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a> ; <a href="https://doi.org/10.1111/1469-0691.12042" target="_blank" rel="noopener" data-reference-source="1">Lortholary O et al., ligne directrice ESCMID 2012 sur les candidoses, patients vivant avec le VIH, Clin Microbiol Infect 2012;18(suppl 7):68-77</a>.</p>
<p>En revanche, pour la candidémie, les <button class="w" data-k="b37-pa-rfinv">facteurs de risque</button> sont hospitaliers : séjour en soins intensifs, cathéter veineux central, chirurgie abdominale, nutrition parentérale, antibiotiques à large spectre, neutropénie. De plus, l’étude FUNGINOS associe la hausse de <i>C. glabrata</i> à l’augmentation de l’usage des triazolés actifs sur les moisissures. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293</a> ; <a href="https://doi.org/10.1093/ofid/ofab471" target="_blank" rel="noopener" data-reference-source="1">Adam KM et al., réseau suisse FUNGINOS, épidémiologie de la candidémie en Suisse sur 15 ans, Open Forum Infect Dis 2021;8:ofab471</a>.</p>
<div class="trap"><span class="k">Piège.</span> Une candidose buccale sans cause évidente chez un adulte jeune doit faire proposer un dépistage du VIH. <a href="https://doi.org/10.1111/1469-0691.12042" target="_blank" rel="noopener" data-reference-source="1">Lortholary O et al., ligne directrice ESCMID 2012 sur les candidoses, patients vivant avec le VIH, Clin Microbiol Infect 2012;18(suppl 7):68-77</a>.</div></section>

<section class="ilot" id="b37-pa-5"><h2><span class="n">5</span>Candidose oropharyngée et œsophagienne</h2>
<p>Connaissant les terrains, on peut décrire les formes cliniques, en commençant par la bouche. Ainsi, la <button class="w" data-k="b37-pa-oro">candidose oropharyngée</button> se présente le plus souvent sous forme pseudomembraneuse : des plaques blanchâtres, détachables au grattage, sur une muqueuse rouge. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> Les plaques blanchâtres sont faites de levures, de pseudo-filaments, de cellules épithéliales desquamées et de fibrine ; elles se détachent au grattage, ce qui les distingue d’une leucoplasie. <i>Candida</i>, commensal de la bouche, ne prolifère ainsi que lorsque l’équilibre local se rompt, par exemple sous antibiotiques, corticoïdes inhalés ou immunodépression ; c’est pourquoi on recherche toujours ce facteur favorisant. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, candidémie</a>.</div>
<p>Par ailleurs, une dysphagie ou une douleur à la déglutition chez un patient immunodéprimé évoque une atteinte œsophagienne. Dès lors, le traitement est topique dans les formes légères, par <button class="w" data-k="b37-p-nys">nystatine</button>, et systémique dans les formes étendues ou œsophagiennes, par <button class="w" data-k="b37-p-flu">fluconazole</button>. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33043" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Mycostatine®, octobre 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a> ; <a href="https://doi.org/10.1111/1469-0691.12042" target="_blank" rel="noopener" data-reference-source="1">Lortholary O et al., ligne directrice ESCMID 2012 sur les candidoses, patients vivant avec le VIH, Clin Microbiol Infect 2012;18(suppl 7):68-77</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> L’extension confluente de l’enduit chez l’immunodéprimé traduit le défaut de l’immunité cellulaire muqueuse, en particulier des lymphocytes T qui contrôlent normalement la levure. Une candidose buccale étendue doit donc faire rechercher une atteinte œsophagienne et une cause d’immunodépression, comme une infection par le VIH. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, candidémie</a>.</div></section>

<section class="ilot" id="b37-pa-6"><h2><span class="n">6</span>Candidose vulvo-vaginale</h2>
<p>La candidose vulvo-vaginale, quant à elle, est la plus fréquente des formes muqueuses. En effet, elle associe prurit vulvaire, brûlures, dyspareunie et pertes blanches épaisses, en « lait caillé », sans odeur. Cependant, ces signes ne sont pas spécifiques : c’est pourquoi la recommandation européenne demande une <button class="w" data-k="b37-e-micro">microscopie ou une culture</button> pour confirmer le diagnostic, surtout en cas de récidive. <a href="https://doi.org/10.1177/0956462418785451" target="_blank" rel="noopener" data-reference-source="1">Sherrard J et al., recommandation européenne IUSTI/OMS 2018 sur les pertes vaginales, Int J STD AIDS 2018;29:1258-1272, candidose</a>.</p>
<p>Ensuite, le traitement d’un épisode simple est court : fluconazole 150 mg en dose unique par voie orale, ou <button class="w" data-k="b37-p-clo">clotrimazole vaginal</button> 500 mg en dose unique ou 200 mg pendant 3 jours. En effet, ces traitements soulagent et négativent la culture chez 80 à 90 % des patientes, et les doses uniques sont aussi efficaces que les cures longues. Enfin, pendant la grossesse, seuls les traitements locaux doivent être utilisés. <a href="https://doi.org/10.1177/0956462418785451" target="_blank" rel="noopener" data-reference-source="1">Sherrard J et al., recommandation européenne IUSTI/OMS 2018 sur les pertes vaginales, Int J STD AIDS 2018;29:1258-1272, candidose</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=37512" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Gyno-Canesten®, décembre 2022</a>.</p>
<div class="key"><b>À retenir.</b> Un épisode simple se traite par une dose unique, orale ou vaginale ; pendant la grossesse, seul le traitement vaginal est utilisé.</div>
<button class="pareto-btn ui" data-k="pareto-b37-clinique">▲ Loi de Pareto — Reconnaître une candidose</button></section>

<section class="ilot" id="b37-pa-7"><h2><span class="n">7</span>Candidose cutanée</h2>
<p>Au-delà des muqueuses, <i>Candida</i> atteint aussi la peau, surtout dans les plis humides. Ainsi, l’intertrigo candidosique est rouge vif, suintant, avec des lésions satellites pustuleuses en périphérie ; de plus, il siège dans les plis inguinaux, sous-mammaires ou interdigitaux, et touche volontiers les patients diabétiques ou obèses. Dès lors, le traitement repose sur un antifongique local et l’assèchement du pli ; en revanche, le fluconazole oral est réservé aux formes étendues ou résistantes. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a>.</p>
<p>Par ailleurs, cette forme se distingue de l’intertrigo à dermatophytes, à bordure active et centre plus clair, développé dans le cours <a href="#/entry/B35">B35</a>.</p></section>

<section class="ilot" id="b37-pa-8"><h2><span class="n">8</span>Urgence : la candidémie</h2>
<div class="alert"><b>Candidémie.</b> Toute hémoculture positive à <i>Candida</i> impose un traitement antifongique, le retrait du cathéter veineux central dès que possible (idéalement dans les 48 à 72 heures), des hémocultures quotidiennes jusqu’à trois négatives consécutives, et la recherche de foyers profonds. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, candidémie</a>.</div>
<p>Parmi les formes invasives, la candidémie est donc une urgence. En effet, elle peut ensemencer l’œil, le cœur, les os ou d’autres organes ; c’est pourquoi l’examen du fond d’œil et l’échocardiographie se discutent. Toutefois, la ligne directrice 2025 souligne que les catégories de patients à dépister restent mal définies. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, candidémie, foyers profonds</a>.</p>
<div class="trap"><span class="k">Piège.</span> Ne jamais considérer une levure dans une hémoculture comme une contamination.</div></section>

<section class="ilot" id="b37-pa-9"><h2><span class="n">9</span>Traitement de la candidémie</h2>
<p>Une fois l’urgence reconnue, le choix de l’antifongique suit une séquence précise. D’abord, la ligne directrice mondiale de 2025 recommande fortement une <button class="w" data-k="b37-p-echino">échinocandine</button> en première ligne — anidulafungine, caspofungine, micafungine ou rézafungine — pour son large spectre, sa bonne tolérance et ses interactions limitées. Ensuite, l’amphotéricine B liposomale, le fluconazole ou le voriconazole ne sont que des alternatives. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, traitement de première ligne</a>.</p>
<p>Puis, après au moins 5 jours d’échinocandine, un <button class="w" data-k="b37-pa-relais">relais oral par fluconazole</button> est possible si six conditions sont réunies. Enfin, la durée est de 14 jours à partir du premier jour d’hémocultures durablement négatives, en l’absence de foyer profond. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, relais et durée</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=58325" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ecalta®, mars 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a>.</p>
<table class="t"><thead><tr><th>Étape</th><th>Conduite (ECMM 2025)</th></tr></thead><tbody>
<tr><td>Première ligne</td><td>Échinocandine, par exemple anidulafungine 200 mg au jour 1 puis 100 mg par jour</td></tr>
<tr><td>Source</td><td>Retrait du cathéter central dès que possible</td></tr>
<tr><td>Contrôle</td><td>Hémocultures quotidiennes jusqu’à 3 négatives consécutives</td></tr>
<tr><td>Relais</td><td>Fluconazole après 5 jours ou plus si les critères sont réunis</td></tr>
<tr><td>Durée</td><td>14 jours après la première hémoculture durablement négative</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque étape répond à un mécanisme : l’échinocandine est fongicide sur <i>Candida</i> et agit aussi sur <i>C. glabrata</i>, moins sensible au fluconazole ; le retrait du cathéter supprime le biofilm qui protège la levure ; les hémocultures quotidiennes datent la négativation, à partir de laquelle on compte 14 jours de traitement. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, candidémie</a>.</div>
<button class="pareto-btn ui" data-k="pareto-b37-traitement">▲ Loi de Pareto — Traiter une candidose</button></section>

<section class="ilot" id="b37-pa-10"><h2><span class="n">10</span>Candidose vulvo-vaginale récidivante</h2>
<p>À l’autre extrémité du spectre, la récidive vaginale pose un problème de qualité de vie plutôt que de gravité. Ainsi, la <button class="w" data-k="b37-pa-recid">candidose vulvo-vaginale récidivante</button> se définit par au moins quatre épisodes symptomatiques par an, et doit être confirmée par culture avec identification de l’espèce. <a href="https://doi.org/10.1177/0956462418785451" target="_blank" rel="noopener" data-reference-source="1">Sherrard J et al., recommandation européenne IUSTI/OMS 2018 sur les pertes vaginales, Int J STD AIDS 2018;29:1258-1272, candidose récidivante</a>.</p>
<p>Dès lors, la recommandation européenne propose un traitement d’induction de trois jours par un azolé, suivi d’un traitement d’entretien d’au moins six mois. De même, l’information suisse du fluconazole prévoit 150 mg aux jours 1, 4 et 7, puis 150 mg une fois par semaine pendant 6 mois. <a href="https://doi.org/10.1177/0956462418785451" target="_blank" rel="noopener" data-reference-source="1">Sherrard J et al., recommandation européenne IUSTI/OMS 2018 sur les pertes vaginales, Int J STD AIDS 2018;29:1258-1272, candidose récidivante</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a>.</p>
<div class="key"><b>À retenir.</b> À partir de 4 épisodes par an, on fait une culture, puis une induction et un entretien hebdomadaire de 6 mois.</div></section>

<section class="ilot" id="b37-pa-11"><h2><span class="n">11</span>Situations particulières</h2>
<p>Ces règles générales s’adaptent toutefois à certains terrains.</p>
<p><b>Grossesse.</b> D’abord, l’information suisse demande d’éviter le fluconazole, sauf infection fongique sévère ou menaçant la vie, car des anomalies congénitales ont été rapportées ; c’est pourquoi le clotrimazole vaginal est le traitement de la candidose vaginale de la femme enceinte. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=37512" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Gyno-Canesten®, décembre 2022</a> ; <a href="https://doi.org/10.1177/0956462418785451" target="_blank" rel="noopener" data-reference-source="1">Sherrard J et al., recommandation européenne IUSTI/OMS 2018 sur les pertes vaginales, Int J STD AIDS 2018;29:1258-1272, candidose</a>.</p>
<p><b>Infection par le VIH.</b> Ensuite, la candidose oropharyngée y est fréquente ; le fluconazole systémique y est le traitement de référence des formes étendues. <a href="https://doi.org/10.1111/1469-0691.12042" target="_blank" rel="noopener" data-reference-source="1">Lortholary O et al., ligne directrice ESCMID 2012 sur les candidoses, patients vivant avec le VIH, Clin Microbiol Infect 2012;18(suppl 7):68-77</a>.</p>
<p><b>Interactions.</b> Enfin, le fluconazole inhibe le CYP3A4 et peut allonger l’intervalle QT ; par conséquent, son association avec des médicaments allongeant le QT et métabolisés par cette enzyme est contre-indiquée. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a>.</p>
<p><b>Cas récapitulatif.</b> Pour conclure, M. B. reçoit de l’anidulafungine, son cathéter est retiré et des hémocultures quotidiennes sont prélevées. Ensuite, l’espèce et l’antibiogramme orientent un éventuel relais par fluconazole, et le traitement dure 14 jours après la première hémoculture négative.</p></section>

<section class="ilot" id="b37-pa-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<p>En synthèse, les valeurs à retenir se résument ainsi.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Candidose vaginale simple</td><td>Fluconazole 150 mg dose unique, ou clotrimazole vaginal</td></tr>
<tr><td>Candidose vaginale récidivante</td><td>4 épisodes ou plus par an ; induction puis entretien 6 mois</td></tr>
<tr><td>Candidose oropharyngée</td><td>Fluconazole 200 à 400 mg au jour 1, puis 100 à 200 mg par jour pendant 7 à 21 jours</td></tr>
<tr><td>Candidémie : retrait du cathéter</td><td>Dès que possible, idéalement dans les 48 à 72 heures</td></tr>
<tr><td>Candidémie : durée</td><td>14 jours après la première hémoculture durablement négative</td></tr>
<tr><td>Incidence suisse de la candidémie</td><td>4,20 pour 100 000 habitants par an (2014–2018)</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Ces valeurs relient la dose à la forme : une dose unique suffit pour une vaginite simple, parce que la levure reste superficielle, alors qu’une récidive, définie par au moins 4 épisodes par an, exige une induction puis un entretien de 6 mois pour empêcher la recolonisation. <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, candidémie</a>.</div>
