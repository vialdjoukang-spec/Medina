<template data-pop="b37-pa-candidemie" data-title="Candidémie">
<p>Présence de <i>Candida</i> dans une hémoculture : toujours une infection, jamais une contamination. Terrain : soins intensifs, cathéter central, chirurgie abdominale, neutropénie. Prise en charge : échinocandine, retrait du cathéter, hémocultures quotidiennes, recherche de foyers profonds.</p><div class="src">Source : <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, candidémie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-s-candida" data-title="Le genre Candida">
<p>Levures, le plus souvent <i>C. albicans</i> (53 % des candidémies suisses en 2014–2018), puis <i>C. glabrata</i> (27 %), moins sensible au fluconazole. Commensales du tube digestif, de la bouche et du vagin.</p><div class="src">Source : <a href="https://doi.org/10.1093/ofid/ofab471" target="_blank" rel="noopener" data-reference-source="1">Adam KM et al., réseau suisse FUNGINOS, épidémiologie de la candidémie en Suisse sur 15 ans, Open Forum Infect Dis 2021;8:ofab471</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-pa-funginos" data-title="Réseau FUNGINOS">
<p>Réseau suisse des infections fongiques, qui a étudié 2273 isolats sanguins de <i>Candida</i> de 2004 à 2018. Incidence en population : de 2,96 à 4,20 pour 100 000 habitants par an ; consommation stable de fluconazole, hausse des triazolés actifs sur les moisissures et des échinocandines.</p><div class="src">Source : <a href="https://doi.org/10.1093/ofid/ofab471" target="_blank" rel="noopener" data-reference-source="1">Adam KM et al., réseau suisse FUNGINOS, épidémiologie de la candidémie en Suisse sur 15 ans, Open Forum Infect Dis 2021;8:ofab471</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-pa-rfinv" data-title="Facteurs de risque de candidose invasive">
<ul><li>Séjour en soins intensifs.</li><li>Cathéter veineux central.</li><li>Chirurgie abdominale, fuite digestive.</li><li>Nutrition parentérale.</li><li>Antibiotiques à large spectre.</li><li>Neutropénie, greffe, chimiothérapie.</li></ul><p>Liste didactique ; la ligne directrice 2025 détaille ces facteurs dans son annexe.</p><div class="src">Source : <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-pa-oro" data-title="Candidose oropharyngée">
<p>Forme pseudomembraneuse : plaques blanchâtres détachables sur muqueuse rouge. Forme érythémateuse : muqueuse rouge, dépapillation de la langue, souvent sous prothèse dentaire. Perlèche : fissures des commissures. Traitement : nystatine si limitée ; fluconazole si étendue ou œsophagienne.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33043" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Mycostatine®, octobre 2024</a> ; <a href="https://doi.org/10.1111/1469-0691.12042" target="_blank" rel="noopener" data-reference-source="1">Lortholary O et al., ligne directrice ESCMID 2012 sur les candidoses, patients vivant avec le VIH, Clin Microbiol Infect 2012;18(suppl 7):68-77</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-p-nys" data-title="Nystatine">
<p>Polyène non absorbé, à action locale. Bouche et œsophage : suspension 1 ml (100 000 UI) quatre fois par jour, à poursuivre au moins 48 heures après la guérison. Rarement réactions cutanées graves (syndrome de Stevens-Johnson) : arrêt immédiat.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33043" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Mycostatine®, octobre 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-p-flu" data-title="Fluconazole">
<p>Azolé oral et intraveineux. Doses adultes : oropharynx 200 à 400 mg au jour 1 puis 100 à 200 mg par jour, 7 à 21 jours ; œsophage 14 à 30 jours ; vagin 150 mg dose unique ; candidose vaginale récidivante 150 mg aux jours 1, 4 et 7 puis 150 mg par semaine pendant 6 mois ; candidémie 800 mg au jour 1 puis 400 mg par jour. Interactions par le CYP3A4 ; risque d’allongement du QT.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-e-micro" data-title="Microscopie et culture vaginales">
<p>Examen direct ou coloration de Gram : levures et pseudo-filaments. Culture sur gélose de Sabouraud : identification de l’espèce, indispensable en cas de récidive. Le diagnostic clinique seul est peu fiable.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462418785451" target="_blank" rel="noopener" data-reference-source="1">Sherrard J et al., recommandation européenne IUSTI/OMS 2018 sur les pertes vaginales, Int J STD AIDS 2018;29:1258-1272, candidose</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-p-clo" data-title="Clotrimazole vaginal">
<p>Azolé local. Recommandation européenne : comprimé vaginal 500 mg en dose unique, ou 200 mg une fois par jour pendant 3 jours. Information suisse du clotrimazole vaginal : un comprimé le soir pendant 3 jours ; utilisable pendant la grossesse, la disponibilité systémique étant faible.</p><div class="src">Sources : <a href="https://doi.org/10.1177/0956462418785451" target="_blank" rel="noopener" data-reference-source="1">Sherrard J et al., recommandation européenne IUSTI/OMS 2018 sur les pertes vaginales, Int J STD AIDS 2018;29:1258-1272, candidose</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=37512" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Gyno-Canesten®, décembre 2022</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-p-echino" data-title="Échinocandines">
<p>Anidulafungine, caspofungine, micafungine, rézafungine : inhibition de la synthèse du bêta-glucane de la paroi. Première ligne de la candidémie selon la ligne directrice 2025, interchangeables selon la sensibilité. Anidulafungine : 200 mg au jour 1, puis 100 mg par jour, au moins 14 jours après la dernière culture positive selon l’information suisse.</p><div class="src">Sources : <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, première ligne</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=58325" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ecalta®, mars 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-pa-relais" data-title="Relais oral par fluconazole : six conditions">
<ol><li>Patient hémodynamiquement stable.</li><li>Clairance sanguine de <i>Candida</i> documentée.</li><li>Absence de neutropénie.</li><li>Contrôle de la source effectué, notamment retrait du cathéter.</li><li>Traitement azolé oral toléré.</li><li>Sensibilité de l’isolat à l’azolé confirmée.</li></ol><p>Relais après au moins 5 jours d’échinocandine.</p><div class="src">Source : <a href="https://doi.org/10.1016/S1473-3099(24)00749-7" target="_blank" rel="noopener" data-reference-source="1">Cornely OA et al., ligne directrice mondiale sur la candidose (European Confederation of Medical Mycology, avec ISHAM et ASM), Lancet Infect Dis 2025;25:e280-e293, relais</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b37-pa-recid" data-title="Candidose vulvo-vaginale récidivante">
<div class="lab">Définition</div><p>Au moins quatre épisodes symptomatiques par an, confirmés au moins une fois par culture avec identification de l’espèce.</p><div class="lab">Traitement</div><p>Induction de 3 jours par azolé (fluconazole 150 à 200 mg par jour), puis entretien d’au moins 6 mois, par exemple fluconazole 100, 150 ou 200 mg par semaine.</p><div class="src">Sources : <a href="https://doi.org/10.1177/0956462418785451" target="_blank" rel="noopener" data-reference-source="1">Sherrard J et al., recommandation européenne IUSTI/OMS 2018 sur les pertes vaginales, Int J STD AIDS 2018;29:1258-1272, candidose récidivante</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49503" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Diflucan®, juillet 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-b37-clinique" data-title="Loi de Pareto — Reconnaître une candidose">
<p class="ratio" data-cover="b37-pa-1,b37-pa-3,b37-pa-4,b37-pa-5,b37-pa-6"></p><ul><li>Plaques blanches détachables : candidose buccale.</li><li>Prurit et pertes en « lait caillé » : candidose vaginale, à confirmer.</li><li>Terrain : antibiotiques, corticoïdes, diabète, immunodépression.</li></ul>
</template>
<template data-pop="pareto-b37-traitement" data-title="Loi de Pareto — Traiter une candidose">
<p class="ratio" data-cover="b37-pa-8,b37-pa-9,b37-pa-10"></p><ul><li>Candidémie : échinocandine, retrait du cathéter, hémocultures quotidiennes, 14 jours après négativation.</li><li>Relais par fluconazole si six conditions.</li><li>Récidive vaginale : induction puis entretien 6 mois.</li></ul>
</template>
<template data-pop="pareto-b37-examens" data-title="Loi de Pareto — Examens de la candidose">
<p class="ratio" data-cover="b37-e-1,b37-e-2"></p><ul><li>Microscopie et culture vaginales.</li><li>Hémocultures avec espèce et antifongigramme.</li><li>Foyers profonds selon le risque.</li></ul>
</template>
<template data-pop="pareto-b37-pharma" data-title="Loi de Pareto — Pharmacologie antifongique">
<p class="ratio" data-cover="b37-p-1,b37-p-2,b37-p-3"></p><ul><li>Local : nystatine, clotrimazole.</li><li>Fluconazole : interactions par le CYP3A4, QT, éviter pendant la grossesse.</li><li>Échinocandines : première ligne de la candidémie.</li></ul>
</template>
