<template data-pop="i70-athero" data-title="Plaque d’athérosclérose"><p>La plaque d’athérosclérose est une lésion de l’intima formée d’un cœur lipidique et nécrotique recouvert d’une chape fibreuse. Stable, elle rétrécit progressivement la lumière et donne des symptômes d’effort ; rompue ou érodée, elle déclenche une thrombose et un événement aigu. La maladie est diffuse : un patient porteur d’une localisation en a souvent d’autres, coronaires ou carotidiennes.</p></template>
<template data-pop="i70-ips" data-title="Index de pression systolique cheville-bras"><p>L’index est le rapport entre la pression systolique de cheville et la pression brachiale la plus élevée. Il est anormal à 0,90 ou moins, limite entre 0,91 et 0,99, normal entre 1,00 et 1,40 ; au-delà de 1,40, les artères sont incompressibles et la valeur n’est pas interprétable. L’examen est simple, peu coûteux et réalisable au cabinet avec un Doppler de poche. Un index bas est aussi un marqueur de risque cardiovasculaire global, au-delà de la jambe.</p></template>
<template data-pop="i70-wifi" data-title="Classification WIfI"><p>La classification WIfI cote trois composantes de 0 à 3 : la plaie (<i>wound</i>), l’ischémie (<i>ischemia</i>), appréciée par l’index, la pression de cheville et la pression d’orteil ou la pression transcutanée d’oxygène, et l’infection du pied (<i>foot infection</i>). Leur combinaison donne un stade clinique de 1 à 4, du risque d’amputation très faible au risque élevé (ESC 2024, tableau 8). Elle rappelle qu’une plaie infectée chez un diabétique peut menacer le membre même lorsque l’ischémie seule paraît modérée.</p></template>
<template data-pop="pareto-i70-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i70-0,i70-1,i70-2,i70-3,i70-4,i70-5,i70-6"></p><ul>
<li>Artériopathie = index ≤ 0,90 ; 113 millions de personnes de 40 ans ou plus dans le monde ; pronostic d’abord cardiovasculaire (mortalité cardiovasculaire à 5 ans : 9 % asymptomatique, 13 % symptomatique).</li>
<li>Fontaine I–IV / Rutherford 0–6 ; ischémie chronique menaçante = douleur de repos, plaie, gangrène &gt; 2 semaines ; WIfI.</li>
<li>Tabac et diabète dominent, chacun multipliant le risque par 2 à 4 ; diabète et insuffisance rénale : artères incompressibles.</li>
<li>Claudication crampoïde reproductible, cède à l’arrêt debout ; siège un étage sous l’obstacle ; Leriche (fesse + dysfonction érectile).</li>
<li>Canal lombaire étroit : soulagé par l’antéflexion, pouls présents.</li>
<li>Pouls bilatéraux, souffles, pieds, pression aux deux bras ; un pouls pédieux absent isolé ne suffit pas.</li></ul></template>
<template data-pop="pareto-i70-aigu" data-title="Pareto — Diagnostic et ischémie aiguë"><p class="ratio" data-cover="i70-7,i70-8"></p><ul>
<li>Index au repos, après effort si normal ; &gt; 1,40 → index orteil-bras ; écho-Doppler ; pression d’orteil et pression transcutanée d’oxygène dans l’ischémie menaçante.</li>
<li>Dépistage par l’index : à envisager dès 65 ans avec facteurs de risque (classe IIa), possible sans facteur de risque (classe IIb) ; index orteil-bras si diabète ou insuffisance rénale avec index normal.</li>
<li>Ischémie aiguë : 6 P ; troubles sensitifs ou moteurs = menace ; tolérance musculaire et nerveuse de 4 à 6 heures ; héparine non fractionnée intraveineuse immédiate (bolus de 5 000 UI ou 70 à 100 UI/kg) ; Rutherford I, IIa, IIb, III ; embolectomie, thrombolyse, amputation si III.</li>
<li>Après reperfusion : loges, potassium, rhabdomyolyse ; chercher la fibrillation auriculaire.</li></ul></template>
<template data-pop="pareto-i70-tt" data-title="Pareto — Traitement"><p class="ratio" data-cover="i70-9"></p><ul>
<li>Arrêt du tabac, statine (LDL &lt; 1,4 mmol/L, baisse &gt; 50 %), clopidogrel ou aspirine, systolique 120–129 mmHg si tolérée, SGLT2 ou GLP-1 si diabète.</li>
<li>Aspirine + rivaroxaban 2,5 mg × 2 si haut risque ischémique (COMPASS, VOYAGER-PAD).</li>
<li>Marche supervisée ≥ 3 fois par semaine, 30 à 60 minutes, ≥ 12 semaines ; en Suisse, réadaptation ambulatoire remboursée dès le stade IIa sur garantie préalable.</li>
<li>Cilostazol et naftidrofuryl : sans information professionnelle suisse.</li>
<li>Revascularisation : envisageable si la qualité de vie reste altérée après 3 mois ; ischémie menaçante : aussi vite que possible.</li></ul></template>
<template data-pop="pareto-i70-crit" data-title="Pareto — Autres localisations et critères"><p class="ratio" data-cover="i70-10,i70-11,i70-12"></p><ul>
<li>Artère rénale : hypertension résistante, œdème flash, créatinine qui monte sous bloqueur rénine-angiotensine ; traitement médical, angioplastie sélective.</li>
<li>Plaques complexes de l’arc aortique : source d’embolies ; antiagrégant et hypolipémiant intensif après un événement embolique.</li>
<li>Critères : index ≤ 0,90 ; ischémie menaçante avec pression d’orteil &lt; 30 mmHg ; ischémie aiguë &lt; 2 semaines.</li></ul></template>
<template data-pop="pareto-i70-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i70-e-1,i70-e-2"></p><ul>
<li>Index = cheville la plus haute / bras le plus haut ; ≤ 0,90 ; &gt; 1,40 incompressible.</li>
<li>Écho-Doppler (onde triphasique → monophasique) ; angioscanner ou angio-IRM avant revascularisation.</li>
<li>Pression d’orteil &lt; 30 mmHg ou pression transcutanée d’oxygène &lt; 30 mmHg : perfusion critique ; pression transcutanée d’oxygène &gt; 30 mmHg : indicateur favorable de cicatrisation.</li></ul></template>
<template data-pop="pareto-i70-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i70-p-1,i70-p-2"></p><ul>
<li>Clopidogrel 75 mg ou aspirine 100 mg ; rivaroxaban 2,5 mg × 2 + aspirine 100 mg si haut risque ischémique ; atorvastatine jusqu’à 80 mg, rosuvastatine 40 mg sous contrôle spécialisé ; ± ézétimibe 10 mg ± inhibiteur de PCSK9.</li>
<li>Héparine intraveineuse dans l’ischémie aiguë.</li>
<li>Rivaroxaban vasculaire contre-indiqué si clairance &lt; 15 mL/min, insuffisance cardiaque NYHA III–IV, accident vasculaire récent ou hémorragique ; clopidogrel : éviter oméprazole et ésoméprazole, préférer le pantoprazole.</li></ul></template>
<template data-pop="i70-rehab-ch" data-title="Réadaptation de l’artériopathie en Suisse">
<div class="lab">Position suisse</div><p>L’ordonnance sur les prestations de l’assurance des soins (OPAS, annexe 1, ch. 11) inscrit la réadaptation des patients atteints d’artériopathie oblitérante des membres inférieurs comme prestation obligatoire pour l’artériopathie symptomatique à partir du stade IIa de Fontaine ; le stade I asymptomatique n’y a pas droit. La réadaptation se fait en ambulatoire, sur garantie préalable de l’assureur qui tient compte de l’avis du médecin-conseil, pendant deux à six mois selon l’intensité du programme, dans une institution sous direction médicale conforme au profil d’exigences de la Société suisse d’angiologie du 5 mars 2009.</p>
<div class="lab">Accord avec la recommandation européenne</div><p>Cette prise en charge applique en pratique l’entraînement supervisé que l’ESC 2024 recommande chez tout artériopathe symptomatique (classe I, niveau A) : au moins trois séances de 30 minutes ou plus par semaine pendant au moins 12 semaines. Elle n’en diffère pas sur le fond ; elle précise seulement le cadre de remboursement et l’exclusion du stade asymptomatique.</p>
<div class="lab">Source</div><p>OPAS, annexe 1, ch. 11 Réadaptation, édition du 1.7.2026 ; ESC 2024 (Mazzolai et al.), tableau de recommandations 13.</p></template>
