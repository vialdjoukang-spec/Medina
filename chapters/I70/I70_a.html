<div class="chap-body">
<section class="ilot" id="i70-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 67 ans, diabétique, fumeur, se plaint d’une douleur crampoïde du mollet droit qui l’arrête après 200 mètres de marche et disparaît en deux minutes d’arrêt. Deux ans plus tard, il revient avec une douleur nocturne du pied qu’il soulage en laissant pendre la jambe hors du lit, et une plaie de l’orteil qui ne cicatrise pas depuis cinq semaines. La question qui structure le chapitre : <b>comment prouver l’artériopathie par un examen simple au cabinet, pourquoi ce patient est d’abord un malade cardiovasculaire à haut risque de décès, et à partir de quand la jambe elle-même est-elle menacée ?</b> Et, en contrepoint : <b>que faire en urgence devant une jambe froide, pâle et sans pouls apparue en une heure ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait mesurer et interpréter l’index de pression systolique cheville-bras, classer l’artériopathie (Fontaine, Rutherford), reconnaître une ischémie chronique menaçante, instaurer le traitement médical qui réduit la mortalité, prescrire la marche supervisée, poser l’indication d’une revascularisation, et reconnaître et traiter une ischémie aiguë de membre.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i70-athero">plaque d’athérosclérose (formation, rupture)</button> et l’<button class="w" data-k="i70-ips">index de pression systolique cheville-bras</button>.</div>
</section>
<section class="ilot" id="i70-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>L’<b>artériopathie oblitérante des membres inférieurs</b> correspond à une atteinte des artères des jambes, le plus souvent athéroscléreuse, qui peut limiter la perfusion à l’effort puis au repos. Un <b>index de pression systolique cheville-bras ≤ 0,90</b> est anormal et soutient le diagnostic, avec ou sans symptômes. Un index normal ou élevé ne suffit pas à exclure toute maladie lorsque les symptômes ou une incompressibilité artérielle rendent sa lecture insuffisante.</p>
<p>Deux classifications cliniques décrivent la même progression, de la plaque silencieuse à la perte tissulaire. Celle de Fontaine sépare la claudication non invalidante (IIa) de la claudication invalidante (IIb) ; celle de Rutherford gradue la claudication en trois catégories. L’ESC 2024 les présente côte à côte (tableau 7).</p>
<table class="t"><tr><th>Fontaine</th><th>Rutherford</th><th>Clinique</th></tr>
<tr><td>I</td><td>0</td><td>Asymptomatique (index anormal)</td></tr>
<tr><td>II a / II b</td><td>1, 2, 3</td><td><b>Claudication intermittente</b> non invalidante (IIa) ou invalidante (IIb) ; Rutherford légère, modérée, sévère</td></tr>
<tr><td>III</td><td>4</td><td><b>Douleur de décubitus</b> (ischémique de repos)</td></tr>
<tr><td>IV</td><td>5, 6</td><td><b>Troubles trophiques</b> : ulcère, gangrène</td></tr></table>
<p>Le tableau se lit par la ligne de partage entre l’effort et le repos. Jusqu’au stade II, la perfusion couvre les besoins de repos et ne manque qu’à la marche ; à partir du stade III, elle ne couvre plus le métabolisme de repos, et le membre lui-même est menacé. L’erreur fréquente consiste à juger la gravité sur le seul périmètre de marche : un diabétique neuropathe peut passer directement d’un stade I apparent à une plaie, sans claudication intermédiaire.</p>
<p>L’<b>ischémie chronique menaçant le membre</b> (anglais CLTI) regroupe les stades III et IV depuis plus de 2 semaines avec preuve hémodynamique : elle expose à l’amputation. La classification <button class="w" data-k="i70-wifi">WIfI (plaie, ischémie, infection du pied)</button> stratifie son risque. L’<b>ischémie aiguë de membre</b> est une baisse brutale (moins de 2 semaines) de la perfusion qui menace la viabilité du membre (classification de Rutherford I, IIa, IIb, III, au § 8).</p>
</section>
<section class="ilot" id="i70-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Selon l’ESC 2024, l’artériopathie touche <b>113 millions de personnes de 40 ans ou plus</b> dans le monde. Sa prévalence mondiale est de 1,52 % ; elle croît avec l’âge, jusqu’à 14,91 % entre 80 et 84 ans, et elle est alors plus élevée chez la femme que chez l’homme (18,03 % contre 10,56 %). Chez la femme, la claudication est moins fréquente et les symptômes atypiques plus fréquents. La Suisse ne dispose pas de relevé national de prévalence publié par une autorité ou une société savante ; ces estimations européennes et mondiales tiennent donc lieu de référence.</p>
<p>Le pronostic est d’abord <b>cardiovasculaire</b>, car la plaque touche aussi les coronaires et les carotides. À 5 ans, l’incidence cumulée de la mortalité cardiovasculaire atteint 9 % dans l’artériopathie asymptomatique et 13 % dans la forme symptomatique. Le pronostic <b>du membre</b> dépend du stade : à 5 ans, 7 % des formes asymptomatiques évoluent vers la claudication et 21 % des claudications vers l’ischémie chronique menaçante. Celle-ci augmente encore la mortalité toutes causes (risque relatif 2,26) et les événements cardiovasculaires majeurs (risque relatif 1,73) par rapport à la forme symptomatique. Dans des données d’assurance, l’amputation majeure touche 9 % des patients en ischémie chronique menaçante et 1 % des claudicants ; les essais et registres consacrés à l’ischémie menaçante rapportent des taux nettement plus élevés.</p>
</section>
<section class="ilot" id="i70-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>L’athérosclérose débute par l’entrée de lipoprotéines de basse densité (LDL) dans l’intima, leur oxydation, le recrutement de monocytes devenus macrophages spumeux (stries lipidiques), puis la migration de cellules musculaires lisses qui forment une chape fibreuse : la <b>plaque</b>. Au niveau des membres, la plaque rétrécit progressivement la lumière. Au repos, la circulation collatérale suffit ; à l’effort, la demande musculaire n’est plus couverte : la <b>claudication</b> apparaît, reproductible, au même périmètre. Quand le rétrécissement devient critique, la perfusion ne couvre plus les besoins de repos : douleur de décubitus (soulagée jambe pendante, par l’augmentation de la pression hydrostatique), puis nécrose tissulaire.</p>
<p><b>Ischémie aiguë</b> : <b>embolie</b> (cœur : fibrillation auriculaire, thrombus du ventricule gauche après infarctus, endocardite ; anévrisme en amont) sur une artère saine, sans collatérales, donc très grave ; ou <b>thrombose in situ</b> sur une artère déjà rétrécie (collatérales développées, tableau parfois moins brutal), sur un pontage, un stent ou un anévrisme poplité.</p>

<div class="key"><b>Corrélation physiopathologie → traitement.</b> La marche régulière jusqu’à la douleur stimule les collatérales et l’adaptation métabolique musculaire : c’est le traitement le plus efficace de la claudication. La plaque est une maladie de toutes les artères : traiter le risque coronarien et cérébral prime sur la jambe.</div>
</section>
<section class="ilot" id="i70-4"><h2><span class="n">4</span>Facteurs de risque</h2>
<p><b>Tabac</b> et <b>diabète</b> dominent : selon l’ESC 2024, chacun multiplie par 2 à 4 le risque d’artériopathie. Le diabète s’accompagne d’une atteinte distale, jambière, d’une médiacalcose et d’une neuropathie qui masque les symptômes. L’âge, l’hypertension, la dyslipidémie (LDL-cholestérol, lipoprotéine(a)), l’insuffisance rénale chronique et la sédentarité complètent ce terrain. Le diabète et l’insuffisance rénale rendent en outre les artères <b>incompressibles</b> : l’index devient faussement normal ou dépasse 1,40, et il cesse alors de refléter la perfusion.</p>
</section>
<section class="ilot" id="i70-5"><h2><span class="n">5</span>Anamnèse</h2>
<p><b>Claudication intermittente</b> : douleur <b>crampoïde</b> d’un groupe musculaire, apparaissant à la marche après une distance reproductible, <b>cédant à l’arrêt debout</b>, sans changement de position. Son siège indique le niveau de l’obstacle : mollet (fémoro-poplité), cuisse (ilio-fémoral), fesse (aorto-iliaque ; avec dysfonction érectile chez l’homme : syndrome de Leriche). Chez le diabétique et la femme, la présentation est souvent atypique (fatigue, gêne, ou aucun symptôme du fait de la neuropathie).</p>
<p><b>Douleur de décubitus</b> : nocturne, à l’avant-pied et aux orteils, soulagée en laissant pendre la jambe ou en se levant ; le patient dort parfois assis, d’où des œdèmes. <b>Troubles trophiques</b> : plaies distales (orteils, talon), douloureuses (sauf neuropathie), qui ne cicatrisent pas.</p>
<table class="t"><tr><th>Diagnostic différentiel de la claudication</th><th>Argument</th></tr>
<tr><td><b>Canal lombaire étroit</b> (pseudo-claudication neurogène)</td><td>Douleur et paresthésies des deux jambes, soulagées par l’<b>antéflexion</b> ou la position assise, pas par l’arrêt debout ; pouls présents ; index normal</td></tr>
<tr><td>Coxarthrose, gonarthrose</td><td>Douleur articulaire, variable, au démarrage</td></tr>
<tr><td>Claudication veineuse</td><td>Lourdeur de toute la jambe après thrombose ilio-fémorale, soulagée par la surélévation</td></tr>
<tr><td>Syndrome des loges chronique</td><td>Jeune sportif, pression intramusculaire élevée</td></tr>
<tr><td>Piège de l’artère poplitée, endofibrose iliaque</td><td>Jeune sportif (cycliste) ; index anormal après effort</td></tr></table>
</section>
<section class="ilot" id="i70-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Le médecin palpe les <b>pouls</b> fémoraux, poplités, tibiaux postérieurs et pédieux, des deux côtés et de façon comparative ; il ausculte les trajets fémoraux, l’abdomen et les carotides à la recherche d’un souffle. Il inspecte les pieds jusqu’entre les orteils et sous les talons, où naissent les plaies méconnues. Il apprécie le <b>temps de recoloration</b> capillaire, la température cutanée et la pâleur de la plante à l’élévation de la jambe, suivie d’une rougeur en position déclive (signe de Buerger). Chez le diabétique, il recherche une neuropathie au monofilament, car elle masque la douleur d’alarme.</p>
<p>Il mesure ensuite la pression artérielle aux <b>deux bras</b> : une asymétrie peut révéler une sténose sous-clavière et désigne le bras de référence de l’index. Enfin, l’<b>index de pression systolique</b> mesuré au cabinet (voir la fiche de l’onglet Examens) transforme l’examen clinique en diagnostic.</p>
<div class="trap"><span class="k">Piège</span>L’absence isolée d’un pouls ne suffit pas au diagnostic, et un pouls perçu n’exclut pas une artériopathie : l’index de pression est indispensable, car il mesure le retentissement hémodynamique au lieu de le deviner.</div>
<button class="pareto-btn ui" data-k="pareto-i70-clin">▲ Loi de Pareto — Notions et clinique</button>
</section>
<section class="ilot" id="i70-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<ol>
<li>Au repos, l’<b>index de pression systolique cheville-bras</b> est anormal lorsqu’il est ≤ 0,90, limite entre 0,91 et 0,99, et normal entre 1,00 et 1,40. Au-dessus de 1,40, les artères sont incompressibles et l’index ne permet pas d’exclure une artériopathie. Le médecin complète par l’index orteil-bras et les ondes Doppler selon la question clinique.</li>
<li>Symptômes typiques et index &gt; 0,90 au repos : <b>index après effort</b>, mesuré 1 minute après un test de marche standardisé sur tapis roulant. Une baisse de la pression de cheville &gt; 30 mmHg ou de l’index &gt; 20 % est le critère habituel ; l’ESC 2024 signale toutefois de nombreux faux positifs chez des sujets sains avec le seul critère de 20 %.</li>
<li>L’<b>écho-Doppler artériel</b>, examen d’imagerie de première intention, localise les lésions et en quantifie la sévérité par les vitesses circulatoires.</li>
<li>Avant une revascularisation, l’angioscanner, l’angio-IRM ou l’artériographie cartographient les axes, selon la fonction rénale et le territoire.</li>
<li>Dans l’ischémie chronique menaçante, une <b>pression d’orteil</b> inférieure à 30 mmHg ou une <b>pression transcutanée d’oxygène</b> inférieure à 30 mmHg signale une perfusion critique : sans revascularisation, la plaie a peu de chances de cicatriser.</li>
<li>Le bilan du risque cardiovasculaire global comprend les lipides, la glycémie et l’hémoglobine glyquée, la fonction rénale et l’électrocardiogramme. Il recherche aussi les autres localisations : les carotides en cas de symptômes ou avant chirurgie, et l’anévrisme de l’aorte abdominale par échographie.</li></ol>
<p>Le <b>dépistage</b> par l’index cheville-bras ou l’index orteil-bras devrait être envisagé à partir de 65 ans en présence de facteurs de risque cardiovasculaire (ESC 2024, classe IIa) et peut l’être sans facteur de risque (classe IIb). Un dépistage plus précoce pourrait être utile en présence de facteurs de risque, mais les données manquent. Chez le diabétique ou l’insuffisant rénal chronique dont l’index de repos est normal, l’index orteil-bras devrait être mesuré (classe IIa), car la médiacalcose peut fausser l’index.</p>
</section>
