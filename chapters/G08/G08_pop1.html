<template data-pop="g08-tvc" data-title="Thrombose veineuse cérébrale">
<div class="lab">Définition</div><p>La thrombose veineuse cérébrale est une forme rare d’accident vasculaire cérébral : le thrombus obstrue une ou plusieurs veines cérébrales ou un sinus dural.</p><div class="lab">Place dans le cours</div><p>Le cours enseigne sa forme septique, déclenchée par une infection de voisinage. La thrombose non pyogène (contraception, thrombophilie) obéit à la même prise en charge antithrombotique, mais n’a pas de foyer à traiter.</p><div class="lab">Limite</div><p>L’incidence rapportée (1,32 pour 100 000 par an) concerne toutes les causes.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1161/STROKEAHA.112.671453" target="_blank" rel="noopener">Coutinho, incidence, Stroke 2012 (résumé)</a>.</p></template>

<template data-pop="g08-septique" data-title="Forme septique">
<div class="lab">Définition</div><p>Thrombose veineuse cérébrale déclenchée par une infection contiguë (sinusite, otomastoïdite, infection de la face ou du pharynx).</p><div class="lab">Histoire</div><p>Fréquente et mortelle avant les antibiotiques, elle est devenue rare. La thrombose du sinus caverneux en est la forme la plus fréquente.</p><div class="lab">Conséquence</div><p>L’effort initial porte sur le foyer et l’antibiothérapie ; le reste du traitement est celui de la forme aseptique.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1016/j.jns.2016.01.035" target="_blank" rel="noopener">Khatri et Wasay, TVC septique, J Neurol Sci 2016 (résumé)</a>.</p></template>

<template data-pop="g08-caverneux" data-title="Thrombose du sinus caverneux septique">
<div class="lab">Tableau</div><p>Début fulminant, fièvre, douleur et tuméfaction périorbitaires, ptosis, œdème palpébral, chémosis, ophtalmoplégie, atteinte des nerfs III, IV, V et VI ; extension rapide au côté controlatéral.</p><div class="lab">Porte d’entrée</div><p>Sinusite ethmoïdale ou sphénoïdale surtout ; plus rarement origine otogène, odontogène ou pharyngée.</p><div class="lab">Pronostic</div><p>Mortalité de 80 à 100 % avant les antibiotiques ; séquelles neurologiques chez la majorité des patients aujourd’hui ; morbidité d’environ 15 % et mortalité d’environ 11 % dans les estimations récentes.</p><div class="lab">Limite</div><p>Les revues sont d’origine américaine et ne servent qu’à une description.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.jns.2016.01.035" target="_blank" rel="noopener">Khatri et Wasay, TVC septique, J Neurol Sci 2016 (résumé)</a> ; <a href="https://doi.org/10.1016/j.survophthal.2021.03.009" target="_blank" rel="noopener">Caranfa et Yoon, thrombose caverneuse septique, 2021 (résumé)</a> ; <a href="https://doi.org/10.1016/j.nec.2024.02.002" target="_blank" rel="noopener">Housley et coll., thrombose du sinus caverneux, 2024 (résumé)</a>.</p></template>

<template data-pop="g08-syndromes" data-title="Quatre syndromes cliniques">
<div class="lab">Principe</div><p>Les syndromes sont non exclusifs : hypertension intracrânienne isolée, syndrome focal, encéphalopathie, syndrome du sinus caverneux.</p><div class="lab">Application</div><p>Un patient fébrile avec chémosis et limitation oculomotrice relève du syndrome caverneux ; un patient avec céphalée et œdème papillaire seuls, de l’hypertension intracrânienne isolée.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-lemierre" data-title="Syndrome de Lemierre">
<div class="lab">Définition</div><p>Thrombophlébite jugulaire à Fusobacterium necrophorum, complication des infections pharyngo-amygdaliennes ; une extension vers le sinus sigmoïde est possible.</p><div class="lab">Fréquence</div><p>Bactériémie à ce germe au Danemark entre 2010 et 2014 : 2,8 cas par million et par an, 9,4 chez les 15–24 ans.</p><div class="lab">Examen</div><p>Hémocultures avec identification de l’espèce de Fusobacterium.</p><p class="src">Références : <a href="https://doi.org/10.1007/s00431-026-07040-z" target="_blank" rel="noopener">Nobacht et coll., série pédiatrique d’Utrecht, 2026 (résumé)</a> ; <a href="https://doi.org/10.1111/apm.12606" target="_blank" rel="noopener">Bank et coll., Fusobacterium necrophorum au Danemark, 2016 (résumé)</a> ; <a href="https://doi.org/10.1016/j.ijporl.2016.06.013" target="_blank" rel="noopener">Rebelo et coll., anticoagulation dans les infections de la tête et du cou, 2016 (résumé)</a>.</p></template>

<template data-pop="g08-otogene" data-title="Thrombose otogène">
<div class="lab">Définition</div><p>Thrombophlébite des sinus veineux compliquant une otite moyenne aiguë ou chronique ou une mastoïdite.</p><div class="lab">Sinus atteints</div><p>Latéral, sigmoïde, transverse, pétreux supérieur et inférieur, rarement caverneux.</p><div class="lab">Clinique</div><p>Otite chronique : fièvre septique, otalgie, signes neurologiques croissants ; otite aiguë : céphalées, fièvre élevée, troubles visuels.</p><div class="lab">Complications associées</div><p>Dans une série de 32 patients : méningite 43,7 %, abcès extradural 21,8 %, abcès cérébelleux 18,7 %.</p><p class="src">Références : <a href="https://doi.org/10.1111/coa.70107" target="_blank" rel="noopener">Picton et coll., thrombose sinusienne otogène, revue systématique 2026 (résumé)</a> ; <a href="https://doi.org/10.1016/j.amjoto.2008.10.001" target="_blank" rel="noopener">Dubey et coll., complications de la suppuration de l’oreille moyenne, 2009 (résumé)</a> ; <a href="https://doi.org/10.1016/S0030-6657(07)70523-1" target="_blank" rel="noopener">Kuczkowski, thrombophlébite des sinus et otite moyenne, 2007 (résumé)</a>.</p></template>

<template data-pop="g08-virchow" data-title="Triade de Virchow">
<div class="lab">Définition</div><p>Trois mécanismes de thrombose : dysfonction de l’endothélium, altération du flux, hypercoagulabilité.</p><div class="lab">Application</div><p>Dans la forme septique, l’infection de voisinage est le facteur local ; la thrombophilie, la grossesse ou le cancer sont des facteurs généraux.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-htic" data-title="Hypertension intracrânienne veineuse">
<div class="lab">Mécanisme</div><p>La pression veineuse augmente et la résorption du liquide cérébrospinal diminue.</p><div class="lab">Signes</div><p>Céphalée sévère, troubles visuels, nausées, vomissements, œdème papillaire.</p><div class="lab">Conduite</div><p>Un transfert vers un centre disposant de neuroradiologie interventionnelle et de neurochirurgie est recommandé au plus tard dès les signes d’hypertension intracrânienne.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-infarctus" data-title="Infarctus veineux">
<div class="lab">Mécanisme</div><p>La congestion veineuse provoque un œdème, puis un infarctus souvent hémorragique.</p><div class="lab">Conséquence</div><p>Déficit focal et crises. L’hémorragie liée à la congestion ne contre-indique pas l’héparine à dose thérapeutique.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-recanal" data-title="Recanalisation">
<div class="lab">Fréquence</div><p>85 % (intervalle de confiance à 95 % de 80 à 89 %) dans 19 études sur 818 patients ; surtout durant les 3 à 6 premiers mois, presque jamais après 12 mois.</p><div class="lab">Conséquence</div><p>Prolonger l’anticoagulation au-delà de 3 à 12 mois dans le seul but de recanaliser n’est pas recommandé.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a>.</p></template>

<template data-pop="g08-incidence" data-title="Incidence">
<div class="lab">Valeurs</div><p>1,32 pour 100 000 personnes-années chez l’adulte (Pays-Bas, 2008–2010) ; 2,78 chez les femmes de 31 à 50 ans. Estimations récentes de 1,2 à 1,3 contre 0,3 à 0,5 auparavant.</p><div class="lab">Limite</div><p>Toutes causes ; la forme septique n’a pas d’incidence fiable dans les sources lues.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a> ; <a href="https://doi.org/10.1161/STROKEAHA.112.671453" target="_blank" rel="noopener">Coutinho, incidence, Stroke 2012 (résumé)</a>.</p></template>

<template data-pop="g08-vitt" data-title="Thrombose avec thrombopénie post-vaccinale">
<div class="lab">Définition</div><p>Thrombose veineuse cérébrale rare après un vaccin à vecteur adénoviral, avec thrombopénie.</p><div class="lab">Conduite</div><p>ELISA des anticorps anti-PF4 ; éviter les héparines, préférer un anticoagulant non héparinique, éviter les transfusions plaquettaires, immunoglobulines intraveineuses précoces.</p><div class="lab">Gravité</div><p>Mortalité aiguë jusqu’à 50 %.</p><div class="lab">Limite</div><p>Avis d’experts, niveau de preuve faible.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a> ; <a href="https://doi.org/10.1177/23969873211030842" target="_blank" rel="noopener">ESO, avis d’experts après vaccination, 2021 (résumé)</a>.</p></template>

<template data-pop="g08-fdr" data-title="Facteurs de risque généraux">
<div class="lab">Liste</div><p>Grossesse, contraception orale, thrombophilie, cancer, maladies auto-immunes, anémie, obésité, infection par le SARS-CoV-2 ; contraceptifs combinés : risque multiplié par 7,6.</p><div class="lab">Place</div><p>Ils coexistent avec un foyer septique mais ne l’excluent pas.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a> ; <a href="https://doi.org/10.1007/s11910-019-0988-x" target="_blank" rel="noopener">Ferro et Aguiar de Sousa, mise à jour 2019 (résumé)</a>.</p></template>

<template data-pop="g08-ceph" data-title="Céphalée">
<div class="lab">Fréquence</div><p>Signe le plus fréquent, souvent isolé.</p><div class="lab">Piège</div><p>Céphalée isolée et âge plus élevé sont associés à un retard diagnostique ; la majorité des patients ont consulté dans la semaine précédant le diagnostic. Dans les urgences, la prévalence de la thrombose parmi les céphalées isolées est très faible.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-score-berne" data-title="Score clinique de Berne">
<div class="lab">Éléments</div><p>Crise épileptique 4 points, thrombophilie connue 4, contraception orale 2, durée des symptômes supérieure à 6 jours 2, « pire céphalée de la vie » 1, déficit focal 1.</p><div class="lab">Usage</div><p>Estimer la probabilité clinique avant les D-dimères.</p><div class="lab">Limite</div><p>Pas de cohorte de validation indépendante ; seuils de décision non lus.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a> ; <a href="https://doi.org/10.1212/WNL.0000000000009998" target="_blank" rel="noopener">Heldner, score clinique et D-dimères, Neurology 2020 (résumé)</a>.</p></template>

<template data-pop="g08-orbite" data-title="Signes orbitaires">
<div class="lab">Signes</div><p>Ptosis, œdème palpébral, chémosis, ophtalmoplégie, douleur et tuméfaction périorbitaires.</p><div class="lab">Mécanisme</div><p>L’obstruction du drainage veineux orbitaire provoque l’œdème et le chémosis ; la compression des nerfs crâniens provoque l’ophtalmoplégie.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.jns.2016.01.035" target="_blank" rel="noopener">Khatri et Wasay, TVC septique, J Neurol Sci 2016 (résumé)</a> ; <a href="https://doi.org/10.1016/j.survophthal.2021.03.009" target="_blank" rel="noopener">Caranfa et Yoon, thrombose caverneuse septique, 2021 (résumé)</a>.</p></template>

<template data-pop="g08-nerfs" data-title="Nerfs crâniens III, IV, V, VI">
<div class="lab">Principe</div><p>Les nerfs crâniens III, IV, V et VI traversent le sinus caverneux ; leur atteinte caractérise le syndrome du sinus caverneux.</p><div class="lab">Limite</div><p>Les sources lues ne détaillent pas le déficit propre à chaque nerf.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a> ; <a href="https://doi.org/10.1016/j.survophthal.2021.03.009" target="_blank" rel="noopener">Caranfa et Yoon, thrombose caverneuse septique, 2021 (résumé)</a>.</p></template>

<template data-pop="g08-papille" data-title="Œdème papillaire">
<div class="lab">Signification</div><p>Signe d’hypertension intracrânienne avec troubles visuels, nausées, vomissements et céphalée sévère.</p><div class="lab">Mécanisme</div><p>La pression veineuse augmente et la résorption du liquide cérébrospinal diminue.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-crises" data-title="Crises épileptiques">
<div class="lab">Fréquence</div><p>20 à 35 % des patients à la phase aiguë ; crises tardives (après 7 jours) chez un patient sur dix.</p><div class="lab">Conséquence</div><p>Association à plus de handicap et de mortalité ; l’ESO recommande un antiépileptique après une crise précoce avec lésion supratentorielle. Le score DIAS3 prédit l’épilepsie post-thrombose.</p><p class="src">Références : <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a> ; <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-coma" data-title="Troubles de la conscience et coma">
<div class="lab">Signification</div><p>Coma et trouble de l’état mental prédisent décès ou dépendance (rapports de risque instantané de 2,7 et 2,0).</p><div class="lab">Pronostic</div><p>Un tiers des patients comateux bien pris en charge récupèrent complètement.</p><p class="src">Références : <a href="https://doi.org/10.1161/01.STR.0000117571.76197.26" target="_blank" rel="noopener">ISCVT, Stroke 2004 (résumé)</a> ; <a href="https://doi.org/10.1007/s11910-019-0988-x" target="_blank" rel="noopener">Ferro et Aguiar de Sousa, mise à jour 2019 (résumé)</a>.</p></template>

<template data-pop="g08-hernie" data-title="Engagement cérébral">
<div class="lab">Définition</div><p>Hernie cérébrale imminente sur lésion parenchymateuse.</p><div class="lab">Conduite</div><p>Décompression chirurgicale (hémicraniectomie, évacuation d’hématome) pour éviter le décès (recommandation modérée) ; DECOMPRESS2 : à un an, deux tiers en vie et un tiers indépendants.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a> ; <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-heparine" data-title="Héparine à dose thérapeutique">
<div class="lab">Recommandation</div><p>Héparine à dose thérapeutique en phase aiguë, qu’il y ait ou non une hémorragie intracrânienne (forte, consensus 100 %). L’héparine de bas poids moléculaire est préférée à l’héparine non fractionnée.</p><div class="lab">But</div><p>Empêcher l’extension du thrombus et la réocclusion des segments rouverts par la fibrinolyse endogène.</p><div class="lab">Limite</div><p>Hors indication des informations professionnelles suisses lues ; débat dans les thromboses septiques.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse de Clexane®, Swissmedic, février 2026</a>.</p></template>

<template data-pop="g08-atb" data-title="Antibiothérapie : lacune">
<div class="lab">Ce qui est lu</div><p>Antibiothérapie précoce à large spectre ; au moins deux semaines par voie intraveineuse dans une série otogène polonaise ; durée médiane de 42,5 jours dans une série pédiatrique néerlandaise.</p><div class="lab">Lacune</div><p>Aucun schéma empirique (molécule, durée) validé par une source suisse ou européenne lue ; la ligne directrice S2k exclut l’antibiothérapie de son champ.</p><div class="lab">Conduite</div><p>Le choix se fait avec la microbiologie, l’infectiologie et l’oto-rhino-laryngologie.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1016/j.jns.2016.01.035" target="_blank" rel="noopener">Khatri et Wasay, TVC septique, J Neurol Sci 2016 (résumé)</a> ; <a href="https://doi.org/10.1007/s00431-026-07040-z" target="_blank" rel="noopener">Nobacht et coll., série pédiatrique d’Utrecht, 2026 (résumé)</a> ; <a href="https://doi.org/10.1016/S0030-6657(07)70523-1" target="_blank" rel="noopener">Kuczkowski, thrombophlébite des sinus et otite moyenne, 2007 (résumé)</a>.</p></template>

<template data-pop="g08-aod" data-title="Anticoagulants oraux directs">
<div class="lab">Phase aiguë</div><p>Aucune recommandation S2k ; ESO 2017 : ne pas utiliser.</p><div class="lab">Entretien</div><p>Préférés aux antagonistes de la vitamine K (recommandation modérée) sauf syndrome des antiphospholipides triple positif ; meilleure preuve pour le dabigatran. DOAC-CVT : 3 % contre 3 % pour le critère composite sur 619 patients.</p><div class="lab">Limite</div><p>Données observationnelles ; grossesse : contre-indiqués.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a> ; <a href="https://doi.org/10.1016/S1474-4422(24)00519-2" target="_blank" rel="noopener">DOAC-CVT, Lancet Neurol 2025 (résumé)</a>.</p></template>

<template data-pop="g08-endovasc" data-title="Recanalisation endovasculaire">
<div class="lab">Place</div><p>Au cas par cas, dans un centre neurointerventionnel, en cas d’aggravation sous anticoagulation bien conduite (recommandation faible).</p><div class="lab">Preuves</div><p>L’essai TO-ACT a été arrêté prématurément sans bénéfice ; la thrombolyse locale provoque plus d’hémorragies sans bénéfice clinique démontré.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a>.</p></template>

<template data-pop="g08-decompression" data-title="Décompression chirurgicale">
<div class="lab">Indication</div><p>Lésion parenchymateuse avec engagement imminent : hémicraniectomie ou évacuation d’hématome (recommandation modérée, consensus 100 %).</p><div class="lab">Résultats</div><p>DECOMPRESS2, 118 patients : à un an, deux tiers en vie et un tiers indépendants (mRS 0 à 2).</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a> ; <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-corticoides" data-title="Corticoïdes">
<div class="lab">Position</div><p>L’ESO 2017 déconseille les corticoïdes pour réduire décès ou dépendance.</p><div class="lab">Limite</div><p>Position fondée sur le résumé de la recommandation ; aucune information professionnelle suisse lue.</p><p class="src">Références : <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a>.</p></template>

<template data-pop="g08-sapl" data-title="Syndrome des antiphospholipides triple positif">
<div class="lab">Conduite</div><p>Antagoniste de la vitamine K plutôt qu’anticoagulant oral direct pendant la phase d’entretien (recommandation modérée).</p><div class="lab">Limite</div><p>Les sources lues ne détaillent pas le diagnostic du syndrome.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a>.</p></template>

<template data-pop="g08-duree" data-title="Durée de l’anticoagulation">
<div class="lab">Règle</div><p>Au moins 3 mois (recommandation forte) ; arrêt après 3 à 12 mois si le risque de récidive est faible ; poursuite si cancer, thrombophilie sévère ou maladie auto-immune active.</p><div class="lab">Forme septique</div><p>Un facteur déclenchant éliminé, comme une infection, rend le risque de récidive suffisamment bas pour arrêter.</p><div class="lab">Limite</div><p>L’ESO 2017 ne formule pas de recommandation sur la durée.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a> ; <a href="https://doi.org/10.1007/s11910-019-0988-x" target="_blank" rel="noopener">Ferro et Aguiar de Sousa, mise à jour 2019 (résumé)</a>.</p></template>

<template data-pop="g08-recidive" data-title="Récidive thrombotique">
<div class="lab">Fréquence</div><p>1 à 3 % par an ; ISCVT : 2,2 % de récidive de thrombose veineuse cérébrale et 4,3 % d’autres thromboses ; S2k : 2 à 5 % la première année après l’arrêt.</p><div class="lab">Conséquence</div><p>La vigilance au suivi inclut aussi le risque de nouveau cancer, surtout la première année.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a> ; <a href="https://doi.org/10.1161/01.STR.0000117571.76197.26" target="_blank" rel="noopener">ISCVT, Stroke 2004 (résumé)</a>.</p></template>

<template data-pop="g08-pronostic" data-title="Syndrome post-thrombose">
<div class="lab">Contenu</div><p>Céphalée, fatigue, troubles de concentration persistants.</p><div class="lab">Limite de la mesure</div><p>L’échelle mRS sous-estime les séquelles cognitives.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-grossesse" data-title="Grossesse et postpartum">
<div class="lab">Traitement</div><p>Héparine de bas poids moléculaire à dose thérapeutique ; anticoagulants oraux directs et antagonistes de la vitamine K contre-indiqués (passage placentaire). Jusqu’à au moins 6 semaines après l’accouchement, durée totale d’au moins 3 mois.</p><div class="lab">Allaitement</div><p>Héparines, fondaparinux, antagonistes de la vitamine K possibles ; anticoagulants oraux directs déconseillés.</p><div class="lab">Données suisses</div><p>Énoxaparine : pas de passage de la barrière fœto-placentaire aux deuxième et troisième trimestres ; dabigatran à éviter.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse de Clexane®, Swissmedic, février 2026</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse de Pradaxa®, Swissmedic, février 2024</a>.</p></template>

<template data-pop="g08-contraception" data-title="Contraception après thrombose">
<div class="lab">Règle</div><p>Pas d’œstroprogestatifs après une thrombose liée aux contraceptifs combinés ou à la grossesse si l’anticoagulation est arrêtée (recommandation forte). Progestatifs seuls oraux et dispositif intra-utérin au lévonorgestrel utilisables ; éviter les formes dépôt.</p><div class="lab">Précaution</div><p>Arrêter la contraception combinée au moins 6 semaines avant l’arrêt de l’anticoagulation.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a>.</p></template>

<template data-pop="g08-enfant" data-title="Enfant">
<div class="lab">Otogène</div><p>190 enfants : 92,1 % opérés, 59 % anticoagulés, bonne évolution 79,2 % ; recanalisation complète 47 % chez les anticoagulés et 55 % chez les autres ; niveau de preuve faible. Série d’Utrecht : chirurgie 90 %, recanalisation 78 %.</p><div class="lab">Traitement</div><p>Héparine de bas poids moléculaire environ 3 mois ; rivaroxaban non inférieur (EINSTEIN-Junior). Dabigatran en capsules non recommandé avant 18 ans.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1111/coa.12504" target="_blank" rel="noopener">Wong et coll., thrombose otogène pédiatrique, 2015 (résumé)</a> ; <a href="https://doi.org/10.1007/s00431-026-07040-z" target="_blank" rel="noopener">Nobacht et coll., série pédiatrique d’Utrecht, 2026 (résumé)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse de Pradaxa®, Swissmedic, février 2024</a>.</p></template>

<template data-pop="g08-controverse" data-title="Controverse sur l’anticoagulation">
<div class="lab">Position</div><p>L’anticoagulation reste discutée dans les thromboses compliquant les infections de la tête et du cou ; un « usage judicieux » est proposé dans la thrombose septique du sinus caverneux.</p><div class="lab">Données</div><p>Recanalisation de 76,7 % avec anticoagulation contre 39,1 % sans (113 patients), sans effet démontré sur l’évolution clinique ; la ligne directrice S2k recommande l’héparine dans la thrombose veineuse cérébrale en général.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1016/j.jns.2016.01.035" target="_blank" rel="noopener">Khatri et Wasay, TVC septique, J Neurol Sci 2016 (résumé)</a> ; <a href="https://doi.org/10.1007/s12070-022-03289-6" target="_blank" rel="noopener">George et coll. (CHUV), anticoagulation et thrombose sigmoïde otogène (résumé)</a> ; <a href="https://doi.org/10.1016/j.ijporl.2016.06.013" target="_blank" rel="noopener">Rebelo et coll., anticoagulation dans les infections de la tête et du cou, 2016 (résumé)</a>.</p></template>

<template data-pop="g08-ddimeres" data-title="D-dimères">
<div class="lab">Règle</div><p>Non recommandés en routine pour exclure une thrombose veineuse cérébrale.</p><div class="lab">Exception</div><p>Chez un patient à faible probabilité (céphalée isolée, sans signe neurologique, durée inférieure à 30 jours), un résultat négatif peut justifier de renoncer à l’imagerie (consensus 100 %).</p><div class="lab">Données de Berne</div><p>Seuil de 500 µg/L : sensibilité de 89,4 %, valeur prédictive négative de 94,6 %.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1212/WNL.0000000000009998" target="_blank" rel="noopener">Heldner, score clinique et D-dimères, Neurology 2020 (résumé)</a>.</p></template>

<template data-pop="g08-irm" data-title="IRM avec veinographie">
<div class="lab">Place</div><p>Considérée comme l’étalon-or ; supérieure pour les veines corticales ; préférée chez le sujet jeune et pendant la grossesse (recommandation forte).</p><div class="lab">Limite</div><p>Équivalente à l’angio-tomodensitométrie pour les sinus.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-tdm-signes" data-title="Signes en tomodensitométrie sans contraste">
<div class="lab">Signes</div><p>Hyperdensité veineuse (signe de la corde), hémorragie juxtacorticale (cashew nut sign), hémorragie sous-arachnoïdienne.</p><div class="lab">Performance</div><p>Atténuation du sinus : sensibilité de 77 %, spécificité de 93 % (88 patients) ; insuffisante seule pour exclure.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-delta" data-title="Signe du delta">
<div class="lab">Définition</div><p>Image observée en tomodensitométrie avec contraste dans la thrombophlébite otogène.</p><div class="lab">Limite</div><p>Les sources lues ne précisent pas sa sensibilité.</p><p class="src">Références : <a href="https://doi.org/10.1016/S0030-6657(07)70523-1" target="_blank" rel="noopener">Kuczkowski, thrombophlébite des sinus et otite moyenne, 2007 (résumé)</a>.</p></template>

<template data-pop="g08-thrombophilie" data-title="Bilan de thrombophilie">
<div class="lab">Règle</div><p>Pas de dépistage systématique ; à envisager chez le sujet jeune, en cas de thrombose spontanée, de récidive, d’antécédents familiaux, ou si le résultat modifie le traitement.</p><div class="lab">ESO 2017</div><p>Ni dépistage systématique de thrombophilie ni de cancer.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a>.</p></template>

<template data-pop="g08-hemocultures" data-title="Hémocultures">
<div class="lab">Rôle</div><p>Identifier le germe, notamment l’espèce de Fusobacterium dans le syndrome de Lemierre, où l’identification est recommandée.</p><div class="lab">Limite</div><p>Les sources lues ne précisent pas le nombre de flacons ni le moment du prélèvement.</p><p class="src">Références : <a href="https://doi.org/10.1111/apm.12606" target="_blank" rel="noopener">Bank et coll., Fusobacterium necrophorum au Danemark, 2016 (résumé)</a>.</p></template>

<template data-pop="g08-pf4" data-title="Anticorps anti-PF4">
<div class="lab">Définition</div><p>Le facteur plaquettaire 4 est la cible des anticorps recherchés par ELISA en cas de thrombose après vaccin à vecteur adénoviral avec thrombopénie.</p><div class="lab">Limite</div><p>Avis d’experts de l’ESO 2021.</p><p class="src">Références : <a href="https://doi.org/10.1177/23969873211030842" target="_blank" rel="noopener">ESO, avis d’experts après vaccination, 2021 (résumé)</a>.</p></template>

<template data-pop="g08-anat-sinus" data-title="Veines jugulaires internes">
<div class="lab">Rôle</div><p>Les sinus duraux se drainent vers les veines jugulaires internes.</p><div class="lab">Corrélation</div><p>La thrombose jugulaire extracrânienne caractérise le syndrome de Lemierre, avec extension possible au sinus sigmoïde.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a> ; <a href="https://doi.org/10.1007/s00431-026-07040-z" target="_blank" rel="noopener">Nobacht et coll., série pédiatrique d’Utrecht, 2026 (résumé)</a>.</p></template>

<template data-pop="g08-lcs" data-title="Pression intracrânienne">
<div class="lab">Mécanisme</div><p>L’obstruction veineuse augmente la pression veineuse et diminue la résorption du liquide cérébrospinal.</p><div class="lab">Limite</div><p>Les granulations arachnoïdiennes ne sont pas décrites dans les sources lues.</p><p class="src">Références : <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-flore" data-title="Flore mixte">
<div class="lab">Définition</div><p>La thrombophlébite sigmoïde septique de l’oreille moyenne est associée à une flore mixte.</p><div class="lab">Limite</div><p>La composition exacte n’est pas détaillée dans le résumé lu.</p><p class="src">Références : <a href="https://doi.org/10.1016/S0030-6657(07)70523-1" target="_blank" rel="noopener">Kuczkowski, thrombophlébite des sinus et otite moyenne, 2007 (résumé)</a>.</p></template>

<template data-pop="g08-fusobacterium" data-title="Fusobacterium necrophorum">
<div class="lab">Rôle</div><p>Agent du syndrome de Lemierre ; retrouvé dans la moitié des cas d’une série de dix enfants avec infection otogène.</p><div class="lab">Fréquence</div><p>2,8 bactériémies par million et par an au Danemark.</p><p class="src">Références : <a href="https://doi.org/10.1007/s00431-026-07040-z" target="_blank" rel="noopener">Nobacht et coll., série pédiatrique d’Utrecht, 2026 (résumé)</a> ; <a href="https://doi.org/10.1111/apm.12606" target="_blank" rel="noopener">Bank et coll., Fusobacterium necrophorum au Danemark, 2016 (résumé)</a>.</p></template>
