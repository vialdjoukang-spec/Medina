<template data-pop="g08-tvc" data-k="g08-tvc"><h3>Thrombose, phlébite et infection : que faut-il établir ?</h3><p>La thrombose veineuse cérébrale correspond à l’obstruction d’une ou plusieurs veines cérébrales ou d’un sinus dural par un thrombus. La phlébite décrit une inflammation veineuse ; la thrombophlébite associe inflammation et thrombose. G08 inclut les formes septiques des veines et sinus intracrâniens ou intrarachidiens. Le compte rendu doit préciser la localisation, le contexte infectieux et le niveau de preuve.</p><p>Une preuve d’agent peut venir du sang, du foyer ou d’un matériel opératoire adapté. L’absence de culture positive ne suffit pas à exclure une forme septique : dans la série néerlandaise, plusieurs cultures sont restées négatives. À l’inverse, une thrombose chez une personne ayant une infection banale ne démontre pas automatiquement une infection du thrombus. Clinique, imagerie et microbiologie doivent rester cohérentes.</p><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button></p></template>
<template data-pop="g08-codage" data-k="g08-codage"><h3>Lire les notes de classification avant de coder</h3><p>Le fichier français officiel OFS 2024 identifie G08 comme code terminal, sans sous-code à décimale. L’entrée complète du BfArM inclut les embolies, endophlébites, phlébites, thrombophlébites et thromboses septiques des sinus veineux et des veines intracrâniens ou intrarachidiens. Les cinq termes d’inclusion ne sont pas cinq sous-codes.</p><p>Les formes intracrâniennes non pyogènes sont exclues vers I67.6 ; les formes intrarachidiennes non purulentes vers G95.18. Les complications d’avortement, de grossesse extra-utérine ou molaire, de grossesse et de puerpéralité ont leurs exclusions obstétricales. Cela change le codage, pas le besoin de soigner une urgence. Les fichiers 2024 ne certifient pas une facture suisse 2026.</p><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button></p></template>
<template data-pop="g08-foyer" data-k="g08-foyer"><h3>Face, sinus, oreille et pharynx : relier le foyer à son extension</h3><p>La série européenne décrit des sinusites, surtout sphénoïdales, mais aussi des infections otologiques, mastoïdiennes et pharyngées. Le protocole local Spital Thurgau 2026 signale explicitement le risque de thrombose septique des sinus en cas de furoncle facial. La présence d’un foyer doit déclencher une recherche d’extension adaptée ; elle ne prouve pas que toutes les anomalies ont la même cause.</p><p>Une thrombose otogène du sinus sigmoïde n’est pas la même présentation qu’un syndrome caverneux avec atteinte orbitaire. Les communications et les extensions sont évaluées sur l’imagerie du patient. Le drainage vise le foyer effectivement atteint, pas une structure désignée au hasard par un schéma général.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r10">[10]</button></p></template>
<template data-pop="g08-chronologie" data-k="g08-chronologie"><h3>Quand un tableau initialement local doit être réévalué</h3><p>L’apparition de diplopie, d’une baisse visuelle, d’un déficit, d’une crise ou d’une altération de vigilance modifie la priorité. Comparer au dernier état normal et noter les heures. Une infection de voisinage qui s’aggrave malgré un traitement doit faire vérifier agent, exposition, foyer non contrôlé et complication intracrânienne. Le récit ne remplace pas l’imagerie adaptée.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></template>
<template data-pop="g08-caverneux" data-k="g08-caverneux"><h3>Pourquoi une limitation d’abduction peut être importante</h3><p>Dans la série néerlandaise, le nerf VI est fréquemment atteint. Il chemine dans le sinus, alors que les autres nerfs cités, notamment III, IV et branches V1/V2, sont en rapport avec sa paroi latérale. Une limitation de mouvement oculaire, une diplopie ou un trouble sensitif doivent être décrits précisément. Il est inexact de dire que tout le nerf V traverse librement la lumière du sinus.</p><p>Ces signes ne fournissent pas seuls le diagnostic : une cellulite orbitaire et d’autres lésions peuvent produire des anomalies voisines. La recherche d’un foyer, l’évolution et l’imagerie du sinus et de l’orbite font partie de la même démarche.</p><p>Sources : <button class="w" data-k="g08-r5">[5]</button></p></template>
<template data-pop="g08-force" data-k="g08-force"><h3>Mesurer la force de manière comparable</h3><table class="t"><thead><tr><th>Grade</th><th>Observation</th></tr></thead><tbody><tr><td>0</td><td>Aucune contraction.</td></tr><tr><td>1</td><td>Contraction perceptible sans mouvement utile.</td></tr><tr><td>2</td><td>Mouvement avec pesanteur éliminée.</td></tr><tr><td>3</td><td>Mouvement contre la pesanteur.</td></tr><tr><td>4</td><td>Mouvement contre résistance.</td></tr><tr><td>5</td><td>Force considérée comme normale.</td></tr></tbody></table><p>Isoler le mouvement, stabiliser et éviter les compensations. Noter territoire, côté, douleur, fatigue et coopération. Comparer les examens dans les mêmes conditions. Used with the permission of the Medical Research Council ; traduction pédagogique paraphrasée. Ce grade de force n’est pas un score de gravité septique.</p><p>Sources : <button class="w" data-k="g08-r13">[13]</button></p></template>
<template data-pop="g08-coma" data-k="g08-coma"><h3>Une baisse de vigilance ne se résume pas à un score pronostique</h3><p>Une thrombose profonde ou une lésion veineuse étendue peut s’accompagner d’encéphalopathie. Infection, crise, complication mécanique et médicaments peuvent aussi modifier la vigilance. Le score ou la statistique d’une cohorte ne remplace pas la recherche urgente de ces causes. Le niveau de conscience et son évolution guident la sécurité des examens et des traitements.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r9">[9]</button></p></template>
<template data-pop="g08-crises" data-k="g08-crises"><h3>Crise survenue et prévention systématique sont deux questions</h3><p>Une crise en cours ou répétée relève d’une prise en charge urgente selon le protocole du centre. La revue générale décrit des crises aiguës et tardives, mais leurs proportions ne deviennent pas une fréquence propre à G08. Un score de risque d’épilepsie après thrombose n’est pas un critère diagnostique du caractère septique et ne justifie pas à lui seul une prescription universelle.</p><p>Sources : <button class="w" data-k="g08-r9">[9]</button></p></template>
<template data-pop="g08-antibiotiques" data-k="g08-antibiotiques"><h3>Ce que les données septiques permettent réellement de dire</h3><p>Le guide DGN précise dès sa note initiale que la forme septique exige élimination du foyer et antibiothérapie, mais ne fournit pas ce protocole anti-infectieux. La série néerlandaise traite tous les patients par antibiotiques adaptés à l’agent attendu ou documenté, avec décision microbiologique sur la durée. Elle décrit notamment céphalosporine ou pénicilline associée au métronidazole selon les cas. Cela n’est pas un schéma universel pour tout patient ni une preuve d’efficacité de chaque combinaison contre chaque agent.</p><p>La couverture initiale, les résistances, les allergies, les organes et les foyers associés sont arbitrés avec l’infectiologue et la pharmacie. Une infection fongique suspectée requiert une conduite spécifique. Le schéma d’un furoncle facial ou d’une sinusite non compliquée ne suffit pas pour une thrombophlébite intracrânienne constituée. Les notices suisses aident à sécuriser les produits choisis ; elles ne remplacent pas la décision du centre.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r10">[10]</button> · <button class="w" data-k="g08-r11">[11]</button> · <button class="w" data-k="g08-r12">[12]</button></p></template>
<template data-pop="g08-heparine" data-k="g08-heparine"><h3>Héparine en phase aiguë : recommandation et produit restent distincts</h3><p>Le consensus DGN, avec participation de la Société suisse de neurologie, recommande une héparine à dose thérapeutique dans la phase aiguë de thrombose veineuse cérébrale. Il préfère une héparine de bas poids moléculaire, avec préférence pour l’héparine non fractionnée lorsqu’une intervention est proche ou que les contraintes du patient l’imposent. La note initiale applique ces principes aux formes septiques après prise en compte indispensable du foyer et des antibiotiques.</p><p>Les preuves propres au sinus caverneux septique reposent surtout sur séries et extrapolations. Dans la série de douze patients, sept ont été anticoagulés après discussion neurologique individuelle. Le choix local de ne pas anticoaguler certains patients avec méningite ne devient pas une contre-indication universelle. À l’inverse, le guide général ne supprime pas les contre-indications d’une spécialité, une endocardite, un geste ou un risque hémorragique particulier.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r7">[7]</button></p></template>
<template data-pop="g08-hemorragie" data-k="g08-hemorragie"><h3>Une hémorragie de congestion n’interdit pas automatiquement toute héparine</h3><p>Le guide recommande l’anticoagulation de la thrombose veineuse cérébrale même lorsqu’une hémorragie intracrânienne résulte de la congestion veineuse. Cette situation ne se raisonne pas comme toutes les autres hémorragies cérébrales. Cependant, la FI Clexane contient des contre-indications hémorragiques explicites et la thrombose veineuse cérébrale n’est pas une indication nommée de cette FI. Le cas réel doit être arbitré et documenté par l’équipe ; aucune contre-indication n’est effacée pour aligner artificiellement deux textes.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button></p></template>
<template data-pop="g08-decompression" data-k="g08-decompression"><h3>Décompression : une menace mécanique peut être traitable</h3><p>Le guide recommande la décompression lorsqu’une thrombose veineuse aiguë s’accompagne de lésions parenchymateuses et d’une menace d’engagement, malgré un niveau de preuve limité. La revue de 2025 décrit une cohorte prospective observationnelle de décompression ; ce n’est pas un essai randomisé ni une population exclusivement septique. La possibilité d’une récupération ne doit pas être écartée sur une statistique ancienne.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r9">[9]</button></p></template>
<template data-pop="g08-endovasc" data-k="g08-endovasc"><h3>Traitement endovasculaire : recours spécialisé, pas première étape routinière</h3><p>Le guide permet de discuter une recanalisation endovasculaire dans un centre spécialisé lorsque le patient se dégrade malgré une anticoagulation adaptée. L’essai mentionné dans le guide n’a pas montré de bénéfice du traitement interventionnel étudié et a été arrêté prématurément. Une recanalisation techniquement obtenue ne suffit pas à démontrer un meilleur résultat clinique.</p><p>Le besoin de drainage d’un foyer infectieux est une autre décision. Une procédure veineuse, une décompression et un geste ORL ne répondent pas au même problème et peuvent nécessiter un calendrier coordonné avec l’anticoagulation.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button></p></template>
<template data-pop="g08-aod" data-k="g08-aod"><h3>Anticoagulant oral direct : après stabilisation, sans effacer les limites</h3><p>Le guide préfère un anticoagulant oral direct à un antagoniste de la vitamine K pour l’entretien de la thrombose veineuse cérébrale, sauf notamment syndrome antiphospholipides triple positif. Il ne propose pas d’utiliser immédiatement un anticoagulant oral direct à la place de l’héparine dans la phase aiguë non stabilisée. Les données spécifiques de thrombose septique sont plus limitées que celles de toutes thromboses veineuses cérébrales.</p><p>La FI suisse Pradaxa ne nomme pas G08 ni la thrombose veineuse cérébrale parmi ses indications. Les doses de thrombose veineuse profonde ou d’embolie pulmonaire servent à lire le produit, pas à créer une indication cérébrale. Le choix, les interactions, le rein et le calendrier du relais restent spécialisés.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r8">[8]</button></p></template>
<template data-pop="g08-duree" data-k="g08-duree"><h3>Trois à douze mois : un cadre général, pas une durée pour toutes les infections</h3><p>Le guide général demande une anticoagulation d’au moins trois mois et décrit une phase d’entretien de trois à douze mois. La poursuite au-delà ne doit pas avoir pour seul but une recanalisation supplémentaire. Le risque de récidive, le facteur déclenchant et son contrôle comptent : une infection éliminée n’a pas la même portée qu’un facteur persistant.</p><p>La série septique décrit des durées variables et ne fixe pas une durée optimale pour tout G08. L’antibiothérapie possède sa propre justification, liée au foyer et à l’agent ; sa durée n’est pas le nombre de mois d’anticoagulation. Les rares formes intrarachidiennes ne reçoivent pas automatiquement le calendrier d’un sinus crânien.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button></p></template>
<template data-pop="g08-recanalisation" data-k="g08-recanalisation"><h3>Recanalisation et guérison clinique ne sont pas synonymes</h3><p>La revue des thromboses otogènes décrit une association entre anticoagulation et recanalisation, sans démontrer une amélioration clinique causale pour tous. Les groupes diffèrent en effectif, gravité et traitements. Une image plus perméable n’est donc pas à elle seule une mesure de bénéfice ; un thrombus résiduel ne justifie pas automatiquement une prolongation indéfinie.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r6">[6]</button></p></template>
<template data-pop="g08-pronostic" data-k="g08-pronostic"><h3>Pronostic : garder population et séquelles visibles</h3><p>La vision, la motilité oculaire, la cognition, les crises et l’autonomie peuvent rester perturbées après la phase aiguë. Les résultats d’une petite série ou d’un score général de thrombose ne prédisent pas seuls l’évolution individuelle d’une forme septique. L’évolution initiale et les complications déterminent le niveau de surveillance et les besoins de rééducation.</p><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></template>
<template data-pop="g08-retour" data-k="g08-retour"><h3>Expliquer les signes qui imposent une réévaluation urgente</h3><p>Nouvelle baisse visuelle, diplopie aggravée, déficit, crise, confusion, baisse de vigilance ou saignement important nécessitent une évaluation rapide selon la gravité. Le plan de sortie précise qui joindre, quels traitements sont poursuivis, quels contrôles sont prévus et pourquoi. Le patient ne modifie pas seul l’anticoagulant pour un résultat d’imagerie ou un symptôme non évalué.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r9">[9]</button></p></template>
<template data-pop="g08-grossesse" data-k="g08-grossesse"><h3>Grossesse : même urgence, codage et produits à adapter</h3><p>Les exclusions obstétricales de G08 ne diminuent pas l’urgence d’une thrombose avec infection. Le guide privilégie les héparines de bas poids moléculaire dans la grossesse et demande une coordination multidisciplinaire, notamment autour de l’accouchement et des gestes neuraxiaux. Les anticoagulants oraux directs ne sont pas le choix recommandé dans cette situation. Le produit exact et la nécessité clinique sont vérifiés dans sa FI.</p><p>L’enfant n’est pas un adulte de faible poids. La FI suisse Pradaxa consultée ne recommande pas son usage chez les moins de dix-huit ans ; celle de Clexane souligne les données pédiatriques insuffisantes. Les données de séries mixtes ne constituent pas une validation de toutes les doses d’adulte chez l’enfant.</p><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button></p></template>
<template data-pop="g08-intraspinal" data-k="g08-intraspinal"><h3>Formes intrarachidiennes : la rareté interdit la copie automatique</h3><p>Le périmètre G08 inclut les veines et sinus intrarachidiens septiques. Les lectures réalisées n’établissent pas un protocole diagnostique et thérapeutique universel propre à ces formes. Un tableau rachidien avec déficit, niveau sensitif ou dysfonction sphinctérienne demande une évaluation spécialisée urgente et une stratégie d’imagerie selon le territoire ; le protocole du sinus caverneux n’est pas simplement transposé.</p><p>Le compte rendu conserve localisation, cause et preuves. La lacune documentaire est signalée au lieu de fabriquer une dose, un geste ou une durée. Les gestes rachidiens et la ponction doivent être coordonnés avec le traitement anticoagulant et ses risques.</p><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r7">[7]</button></p></template>
<template data-pop="pareto-g08-clinique" data-k="pareto-g08-clinique"><h3>Les décisions à retenir</h3><p>Reconnaître menace neurologique et visuelle ; documenter territoire et infection ; imager le système veineux et le foyer ; traiter l’infection ; arbitrer l’anticoagulation ; suivre fonction et toxicités sans prolonger pour une image seule.</p></template>
<template data-pop="g08-imagerie" data-k="g08-imagerie"><h3>Pourquoi une imagerie non adaptée peut laisser la question ouverte</h3><p>Le consensus considère scanner et résonance magnétique, chacun avec exploration veineuse, comme équivalents pour la thrombose des sinus ; la résonance est supérieure pour les veines corticales. La technique dépend aussi de la stabilité, de la disponibilité et des contraintes du patient. Une image sans exploration adéquate ne répond pas forcément à la suspicion veineuse.</p><p>Pour le sinus caverneux, rechercher défaut de remplissage, rapports orbitaires, veine ophtalmique et foyers associés. La série néerlandaise utilise scanner et résonance avec contraste selon les situations et ne démontre pas une sensibilité comparative universelle. Une préférence de centre ne devient pas une loi générale. Si la suspicion persiste malgré une étude non concluante, discuter la stratégie avec la neuroradiologie.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></template>
<template data-pop="g08-prelevement" data-k="g08-prelevement"><h3>Ce que prouve un prélèvement du sang ou du foyer</h3><p>Les hémocultures et le matériel d’un foyer accessible peuvent documenter l’agent et permettre une adaptation. L’antibiothérapie préalable et les conditions du prélèvement influencent le rendement. Lorsque le patient est gravement malade, les prélèvements possibles sont organisés sans retarder dangereusement le traitement. Le geste et l’envoi sont préparés avec le laboratoire et l’équipe qui traite le foyer.</p><p>Une ponction lombaire n’est pas systématique pour démontrer une thrombose. Une éventuelle question de méningite doit tenir compte de la sécurité neurologique, du risque de masse et de l’anticoagulation. La série rapporte des ponctions choisies, pas une obligation pour tout patient ; la FI Clexane avertit du risque d’hématome neuraxial. Aucun délai générique de sécurité n’est inventé pour toutes les molécules.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button></p></template>
<template data-pop="g08-ddimere" data-k="g08-ddimere"><h3>Pourquoi le test ne remplace pas l’imagerie devant une suspicion septique</h3><p>Le guide ne recommande pas le dosage de D-dimères en routine pour exclure une thrombose veineuse cérébrale. Il réserve une éventuelle stratégie de non-imagerie à des situations très sélectionnées de faible probabilité, avec céphalée isolée et sans signe neurologique. Un tableau infectieux orbitaire compliqué ou une dégradation neurologique ne doit pas être ramené artificiellement à cette situation rassurante.</p><p>La valeur de référence et le résultat dépendent de la méthode de laboratoire et de la population. Aucun seuil numérique universel de G08 n’est créé ici. Une valeur dite normale ne remplace pas une exploration veineuse lorsque l’hypothèse clinique la justifie.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r9">[9]</button></p></template>
<template data-pop="g08-differentiel" data-k="g08-differentiel"><h3>Cellulite orbitaire et thrombose caverneuse peuvent se ressembler</h3><p>Gonflement, chémosis, protrusion du globe, diplopie et baisse visuelle peuvent se rencontrer dans les deux situations. La thrombose caverneuse peut débuter d’un côté puis devenir bilatérale ; ne pas attendre ce deuxième temps pour l’évoquer. L’atteinte de nerfs et la suspicion de foyer sphénoïdal orientent l’imagerie, sans établir seules une preuve.</p><p>Tumeur, inflammation orbitaire, syndrome de Tolosa–Hunt, anévrisme ou fistule carotido-caverneuse figurent parmi les autres causes décrites. La vitesse d’évolution, les signes infectieux et l’imagerie contribuent à les distinguer. L’absence de fièvre ne doit pas être transformée en règle d’exclusion absolue d’une infection.</p><p>Sources : <button class="w" data-k="g08-r5">[5]</button></p></template>
<template data-pop="g08-vitt" data-k="g08-vitt"><h3>Les thromboses non pyogènes gardent un autre raisonnement causal</h3><p>Contraception, thrombophilie et certains syndromes immunitaires peuvent provoquer une thrombose veineuse sans foyer pyogène. La revue de 2025 décrit notamment le syndrome de thrombose avec thrombopénie après certains vaccins à vecteur adénoviral. Ce n’est pas une raison d’appeler toute thrombose G08 ni d’appliquer ici un protocole thérapeutique non lu pour ce syndrome. Le codage et le traitement suivent la cause établie.</p><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r9">[9]</button></p></template>
<template data-pop="pareto-g08-examens" data-k="pareto-g08-examens"><h3>Chaque examen doit répondre à une question</h3><p>Imagerie pour territoire et foyer ; culture pour agent ; biologie pour sécurité des produits. Ne pas remplacer une imagerie indiquée par un D-dimère, ni une décision clinique par une recanalisation.</p></template>
<template data-pop="pareto-g08-sci" data-k="pareto-g08-sci"><h3>Du normal à la décision</h3><p>Anatomie et drainage localisent ; sémiologie mesure ; coagulation explique les cibles ; microbiologie documente la cause ; pharmacologie sécurise l’exposition. L’infection et le thrombus restent deux besoins à traiter ensemble.</p></template>
<template data-pop="g08-clexane" data-k="g08-clexane"><h3>Énoxaparine : le repère de la FI et ses limites</h3><p>La FI suisse de février 2026 décrit, pour la thrombose veineuse profonde,1 mg/kg sous-cutané deux fois par jour. Le rythme 1,5 mg/kg une fois par jour est réservé aux situations non compliquées et n’est pas le choix automatique pour un tableau cérébral septique. G08 et la thrombose veineuse cérébrale ne sont pas des indications nommées dans cette FI.</p><p>Les héparines de bas poids moléculaire diffèrent en fabrication, activité et dosage ; elles ne sont pas interchangeables. L’énoxaparine ne doit pas être injectée par voie intramusculaire. Les doses prophylactiques fixes ne remplacent pas une anticoagulation thérapeutique. L’activité anti-Xa et la masse ne se convertissent pas en dose d’une autre héparine sans une prescription spécifique.</p><p>La notice contre-indique notamment endocardite bactérienne aiguë, hémorragie importante active, situations à risque de saignement incontrôlé et certains antécédents de thrombocytopénie immunitaire induite par héparine. La présence d’un contexte septique impose donc de préciser le foyer ; elle n’autorise pas une administration automatique. Les restrictions hémorragiques restent visibles face au guide de thrombose veineuse.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button></p></template>
<template data-pop="g08-calcul" data-k="g08-calcul"><h3>Calculer la masse par prise sans transformer l’exemple en ordonnance</h3><p>Exemple pédagogique : un poids de 70 kg multiplié par 1 mg/kg donne 70 mg par prise. Le rythme de deux prises par jour ne signifie pas 70 mg au total par jour. Il faut ensuite vérifier indication, rein, risque hémorragique et produit avant toute décision. Une dose prophylactique fixe n’est pas obtenue par ce même objectif thérapeutique.</p><p>La correspondance d’activité de la FI est de 100unités anti-Xa environ par milligramme pour l’énoxaparine ; elle ne rend pas les unités interchangeables avec l’héparine non fractionnée. Le volume nécessite la concentration de la présentation réellement utilisée ; aucun volume n’est calculé ici à partir d’un nom de boîte incomplet.</p><p>Sources : <button class="w" data-k="g08-r7">[7]</button></p></template>
<template data-pop="g08-renale" data-k="g08-renale"><h3>Quand le rein change le choix et la dose</h3><p>La FI Clexane donne, sous 30 ml/min de clairance, une adaptation des doses thérapeutiques usuelles vers 1 mg/kg une fois par jour. Le guide général privilégie cependant l’héparine non fractionnée dans certaines situations rénales avancées ou interventionnelles. Ce ne sont pas deux lignes à fusionner : la notice décrit un produit, le guide le choix clinique d’une stratégie. Le contexte, la stabilité et les procédures sont arbitrés par l’équipe.</p><p>Avec Pradaxa, la FI décrit une contre-indication sous 30 ml/min et une réduction à 110 mg deux fois par jour dans la plage 30–50 ml/min. Le paragraphe de plage 50–80 indique une absence d’adaptation. Le point 50 est donc partagé par les libellés lus : il ne doit pas être arrondi ou résolu de mémoire. La fonction rénale est évaluée selon la méthode de la notice, sans remplacer automatiquement une clairance par une estimation indexée différente.</p><p>La réduction de Pradaxa à 220 mg/j dans la thrombose/embolie extracrânienne repose selon la FI sur des analyses pharmacologiques et n’a pas été examinée dans cette situation clinique. Cela ne valide pas une dose cérébrale septique. Les valeurs et le contexte doivent être transmis à la pharmacie et au prescripteur.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button></p></template>
<template data-pop="g08-neuraxial" data-k="g08-neuraxial"><h3>Ponction et geste neuraxial : pas de délai valable pour toutes les molécules</h3><p>La FI Clexane décrit un risque d’hématome spinal ou épidural, potentiellement invalidant. Dose, heure, fonction rénale, procédure, cathéter et médicaments associés modifient le risque. Les délais mentionnés dans la notice ne garantissent pas l’absence d’hématome et ne se transposent pas à un autre anticoagulant. Le cours ne construit donc pas un calendrier universel de ponction ou d’anesthésie.</p><p>Le risque neurologique de la lésion elle-même compte aussi. Une ponction envisagée pour une autre question infectieuse doit être coordonnée avec l’équipe et le laboratoire. Le besoin de preuve ne justifie ni risque de masse ignoré ni arrêt improvisé d’un traitement nécessaire.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button></p></template>
<template data-pop="g08-pradaxa" data-k="g08-pradaxa"><h3>Dabigatran étexilate : indication de la FI et règles du produit</h3><p>La FI de février 2024 présente des capsules de 110 mg et 150 mg de dabigatran étexilate, sous forme de mésilate. Pour la thrombose veineuse profonde ou l’embolie pulmonaire de l’adulte, elle décrit 150 mg deux fois par jour après au moins cinq jours d’héparine. Elle ne nomme pas G08 ou la thrombose veineuse cérébrale. Le choix cérébral repose sur une décision spécialisée et ne se réduit pas à recopier l’indication extracrânienne.</p><p>Les patients de 80 ans et plus reçoivent 110 mg deux fois par jour dans la FI ; le rein impose ses règles propres, avec contre-indication sous 30 ml/min. La notice ne recommande pas le traitement chez les moins de 18 ans. Les atteintes hépatiques citées, valves cardiaques artificielles et certaines associations médicamenteuses sont des contre-indications. Avant une prescription, consulter la liste complète avec le traitement réel.</p><p>Ne pas ouvrir les capsules. Le guide attend une stabilisation sous héparine avant l’entretien oral. L’agent de réversion spécifique du dabigatran est mentionné dans la FI pour les urgences appropriées ; aucune dose de réversion non relue n’est proposée ici. Un saignement ou un geste urgent relève de l’équipe capable de gérer hémostase et risque thrombotique.</p><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r8">[8]</button></p></template>
<template data-pop="g08-interactions" data-k="g08-interactions"><h3>Interactions et surveillance : le médicament exact compte</h3><p>La FI Pradaxa décrit des interactions avec des transporteurs et contre-indique certaines associations. La fonction rénale, l’âge et les médicaments associés peuvent augmenter l’exposition. Une liste générique d’anticoagulants ne remplace pas la vérification de chaque produit. Toute nouvelle prescription, notamment anti-infectieuse, doit être intégrée à cette revue.</p><p>Le rapport international normalisé n’est pas une mesure quantitative de routine du dabigatran. Le laboratoire choisit les tests adaptés avec le nom du produit et l’heure de prise. Les formulations internes de notice sur certains tests ne sont pas harmonisées en un seuil universel. Pour l’énoxaparine, les tests globaux usuels ne permettent pas de surveiller correctement l’effet. Le suivi recherche aussi saignement, anémie, plaquettes et fonction d’organe selon la situation.</p><p>Sources : <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button></p></template>
<template data-pop="g08-ceftriaxone" data-k="g08-ceftriaxone"><h3>Ceftriaxon Labatec : produit suisse et contexte clinique</h3><p>La FI de juin 2025 a été réellement lue par Sol pour G06 et est réutilisée ici avec cette attribution. Les doses adultes générales sont de 1à 2 g une fois par jour, avec possibilité de 4 g/j dans les infections graves selon la notice. Ces repères ne fixent pas une dose et une durée universelles de thrombophlébite septique intracrânienne. La série européenne emploie cette molécule dans certaines combinaisons, selon agent et foyer.</p><p>Lorsque la clairance est inférieure à 10 ml/min ou en dialyse, cette spécialité limite la dose à 2 g/j. Les restrictions de mélange et de compatibilité, notamment avec solutions contenant du calcium, les allergies et les autres précautions doivent être vérifiées dans la notice du produit. Une dose d’un protocole de centre ne doit pas être présentée comme la fréquence générale de FI si les formulations diffèrent.</p><p>La ceftriaxone inhibe la synthèse de la paroi bactérienne selon la notice relue. Cette cible n’assure pas la sensibilité de tout germe. L’activité antibactérienne ne remplace pas le drainage d’un foyer ni la recherche de résistance. L’équipe choisit la couverture complète, les prélèvements et la durée. Le cours ne propose pas de donner cette seule molécule à tous les patients sur le seul code G08.</p><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r11">[11]</button></p></template>
<template data-pop="g08-metronidazole" data-k="g08-metronidazole"><h3>Metronidazole SINT i.v. : dose générale et limite de transposition</h3><p>La FI de février 2026 décrit 500 mg dans 100 ml, avec 326 mg de sodium, et un débit de 5 ml/min. Pour les infections anaérobies chez l’adulte et le patient d’au moins 12 ans, elle décrit une charge de 15 mg/kg puis 7,5 mg/kg toutes les six heures pendant trois jours, puis toutes les douze heures, au maximum 4 g/j. Ce rythme de notice n’est pas présenté comme le protocole obligatoire de tout G08.</p><p>Le métronidazole est activé dans les microorganismes sensibles ; ses produits réactifs altèrent leur matériel génétique. Ce mécanisme ne prouve pas une activité sur tous les agents du foyer. La durée usuelle est de cinq à sept jours et ne doit normalement pas dépasser dix jours ; une prolongation exceptionnelle doit être justifiée et surveillée. Une infection profonde peut nécessiter une stratégie différente, discutée avec les spécialistes, sans arrêt arbitraire ni renouvellement sans contrôle. La série septique adapte la durée à la maladie sous-jacente et à l’avis microbiologique.</p><p>Ataxie, paresthésies, confusion, myoclonies ou convulsions peuvent annoncer une toxicité et nécessitent interruption/réévaluation selon la notice. Une complication de l’infection ou un saignement reste à rechercher en parallèle. L’atteinte hépatique sévère et la fonction rénale demandent leur surveillance propre ; une clairance inférieure à 10 ml/min peut favoriser l’accumulation de métabolites. Le premier trimestre de grossesse et le syndrome de Cockayne sont des contre-indications lues.</p><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r12">[12]</button></p></template>
<template data-pop="pareto-g08-pharm" data-k="pareto-g08-pharm"><h3>Produit, preuve et surveillance</h3><p>Dose thérapeutique distincte de prophylaxie ; milligrammes et activité propres à l’énoxaparine ; clairance et frontières de notice vérifiées ; capsules de dabigatran intactes ; infection et thrombus traités ensemble ; prolongation expliquée et surveillée.</p></template>
