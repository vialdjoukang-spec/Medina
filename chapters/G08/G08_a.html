<p>Dans cette <b>vignette fictive</b>, un homme de 34 ans consulte après cinq jours de rhinorrhée purulente et de douleur faciale. Depuis vingt-quatre heures, une fièvre est apparue, l’œil droit est douloureux, la paupière est tuméfiée et ne se relève plus. Le médecin constate un chémosis et une limitation des mouvements oculaires à droite. Quarante-huit heures plus tard, l’œil gauche présente les mêmes signes. Ces éléments sont choisis pour l’enseignement ; ils ne proviennent pas d’une étude.</p>
<p>Trois questions se posent ensemble. Existe-t-il une <button class="w" data-k="g08-tvc">thrombose veineuse cérébrale (veine ou sinus obstrué)</button> ? Cette thrombose est-elle <button class="w" data-k="g08-septique">septique (déclenchée par une infection de voisinage)</button> ? Faut-il, en plus du traitement de l’infection, <button class="w" data-k="g08-heparine">anticoaguler (héparine à dose thérapeutique)</button> ? L’imagerie veineuse répond à la première, l’histoire et l’examen à la deuxième, les recommandations à la troisième.</p>
<div class="key"><b>À retenir.</b> La thrombose veineuse cérébrale septique associe un foyer infectieux contigu et une obstruction veineuse intracrânienne. Le traitement agit sur les deux : le foyer d’abord, le thrombus ensuite.</div>
</section>
<section class="ilot" id="g08-1"><h2><span class="n">1</span>Définition et périmètre</h2>

<p>La <button class="w" data-k="g08-tvc">thrombose veineuse cérébrale</button>, abrégée TVC, est une forme rare d’accident vasculaire cérébral. Le thrombus siège du côté veineux : il obstrue une ou plusieurs veines cérébrales ou un sinus dural (ligne directrice S2k, 2023). La forme <button class="w" data-k="g08-septique">septique</button> est déclenchée par une infection de voisinage. Elle était fréquente et mortelle avant l’ère des antibiotiques ; elle est aujourd’hui rare (Khatri et Wasay, 2016).</p>
<p>La thrombose du sinus caverneux est de loin la forme septique la plus fréquente (Khatri et Wasay, 2016). Le terme « phlébite » désigne l’atteinte inflammatoire de la paroi veineuse, le terme « thrombophlébite » l’association de cette inflammation et d’un thrombus. La classification allemande CIM-10-GM 2024 range sous cette même entrée l’embolie, l’endophlébite, la phlébite, la thrombophlébite et la thrombose des sinus veineux et des veines intracrâniens ou intrarachidiens, à la condition que l’origine soit <b>septique</b> (BfArM, 2024).</p>
<p>Le périmètre se lit donc en clinique, non en codage. Une thrombose veineuse cérébrale non pyogène, par exemple liée à une contraception hormonale ou à une thrombophilie, ne relève pas de ce cours ; la classification la range ailleurs, comme les thromboses obstétricales. Le cours enseigne la thrombose veineuse cérébrale par son <b>foyer infectieux contigu</b> : sinusite, otomastoïdite, infection de la face ou du pharynx. La prise en charge de la thrombose elle-même reste, pour l’essentiel, celle de la forme aseptique ; seul l’effort portant sur l’infection est propre à la forme septique (ligne directrice S2k, 2023).</p>
<p>Quant à la phlébite <b>intrarachidienne</b> septique, les sources lues pour ce cours n’en décrivent ni la clinique ni le traitement : le cours se limite à signaler qu’elle fait partie du périmètre de la classification et ne lui attribue aucune conduite.</p>
<div class="trap"><span class="k">Piège</span> Une thrombose veineuse cérébrale chez une femme sous contraception hormonale n’est pas septique par défaut. Le caractère septique exige un foyer infectieux contigu ou une infection associée documentée.</div>

<section class="ilot" id="g08-2"><h2><span class="n">2</span>Classifications</h2>

<p>Deux classifications se complètent. La première décrit le <b>syndrome clinique</b> ; la seconde, propre à la forme septique, décrit la <b>porte d’entrée</b> de l’infection. Elles ne s’excluent pas : un même patient peut cumuler plusieurs syndromes (Int J Stroke, 2025).</p>
<p>Les <button class="w" data-k="g08-syndromes">quatre grands syndromes cliniques</button> diffèrent par leur mécanisme et par ce que le médecin observe.</p>
<table class="t"><thead><tr><th>Syndrome</th><th>Mécanisme</th><th>Expression</th></tr></thead><tbody><tr><td>Hypertension intracrânienne isolée</td><td>La pression veineuse monte et la résorption du liquide cérébrospinal diminue</td><td>Céphalée sévère, troubles visuels, nausées, vomissements, œdème papillaire</td></tr><tr><td>Syndrome focal</td><td>Lésion du parenchyme cérébral</td><td>Hémiparésie, aphasie, souvent des crises épileptiques</td></tr><tr><td>Encéphalopathie</td><td>Thrombose du système veineux profond, ou grands infarctus veineux hémorragiques</td><td>Altération de la conscience, coma</td></tr><tr><td>Syndrome du sinus caverneux</td><td>Thrombose du sinus caverneux</td><td>Douleur périorbitaire, atteinte des nerfs crâniens III, IV, V et VI</td></tr></tbody></table>

<p>Le tableau montre que le mécanisme explique l’expression : une pression veineuse élevée qui gêne la résorption du liquide produit une hypertension intracrânienne, alors qu’une lésion du parenchyme produit un déficit focal. Le syndrome du sinus caverneux est le seul à désigner une <b>localisation</b> plutôt qu’un mécanisme ; il est central dans la forme septique.</p>
<p>Selon la porte d’entrée, trois grandes situations se distinguent.</p>
<table class="t"><thead><tr><th>Porte d’entrée</th><th>Sinus atteint</th><th>Remarque</th></tr></thead><tbody><tr><td>Sinusite paranasale, surtout ethmoïdale ou sphénoïdale ; plus rarement origine otogène, odontogène ou pharyngée</td><td><button class="w" data-k="g08-caverneux">Sinus caverneux</button></td><td>Infection préalable habituellement de la face centrale ou des sinus</td></tr><tr><td>Otite moyenne aiguë ou chronique, mastoïdite (<button class="w" data-k="g08-otogene">thrombose otogène</button>)</td><td>Sinus latéral ou sigmoïde ; aussi transverse, pétreux supérieur et inférieur, rarement caverneux</td><td>Flore mixte dans la thrombophlébite sigmoïde septique</td></tr><tr><td>Infection pharyngo-amygdalienne à Fusobacterium necrophorum (<button class="w" data-k="g08-lemierre">syndrome de Lemierre</button>)</td><td>Veine jugulaire, avec extension possible au sinus sigmoïde</td><td>La thrombose jugulaire est extracrânienne</td></tr></tbody></table>

<p>Le temps thérapeutique complète ces deux axes : phase aiguë, puis phase d’entretien de trois à douze mois, puis arrêt ou prophylaxie secondaire (ligne directrice S2k, 2023).</p>
<div class="key"><b>À retenir.</b> Le syndrome clinique dit ce que le patient présente ; la porte d’entrée dit pourquoi, et donc où chercher le foyer à traiter.</div>
</section>
<section class="ilot" id="g08-3"><h2><span class="n">3</span>Fréquence</h2>

<p>Aucune incidence fiable de la forme septique n’a été lue pour ce cours ; il s’agit d’une <b>lacune</b> assumée. Les chiffres disponibles concernent la thrombose veineuse cérébrale toutes causes confondues et la thrombose du sinus caverneux.</p>
<ul>
<li>Chez l’adulte, l’<button class="w" data-k="g08-incidence">incidence</button> est de 1,32 pour 100 000 personnes-années (intervalle de confiance à 95 % de 1,06 à 1,61) dans deux provinces néerlandaises, soit 3,1 millions d’habitants, entre 2008 et 2010. Elle atteint 2,78 pour 100 000 chez les femmes de 31 à 50 ans (Coutinho, 2012).</li>
<li>Les estimations récentes se situent à 1,2–1,3 pour 100 000, contre 0,3–0,5 auparavant ; l’augmentation relative la plus nette concerne les plus de 50 ans. La mortalité précoce reste d’environ 3 % (Int J Stroke, 2025).</li>
<li>La thrombose du sinus caverneux, septique et aseptique réunies, représente 0,2 à 1,6 cas pour 100 000, avec une morbidité d’environ 15 % et une mortalité d’environ 11 % dans les estimations récentes (Housley et coll., 2024).</li>
<li>Le syndrome de Lemierre a une incidence comparable à celle de la bactériémie à Fusobacterium necrophorum, soit 2,8 cas par million et par an au Danemark entre 2010 et 2014, et 9,4 par million chez les 15–24 ans (Bank et coll., 2016).</li>
</ul>
<p>Ces chiffres ne se transposent pas à la forme septique : la thrombose veineuse cérébrale commune est dominée par les causes générales, alors que la forme septique est rare. Les données suisses de fréquence n’ont pas été retrouvées.</p>
<div class="key"><b>À retenir.</b> Rare, la forme septique se reconnaît moins par sa fréquence que par son contexte : un foyer de la tête ou du cou, et des signes neurologiques ou oculaires nouveaux.</div>
</section>
<section class="ilot" id="g08-4"><h2><span class="n">4</span>Physiopathologie</h2>

<p>Le sang du cerveau quitte le parenchyme par les veines corticales, qui forment le système superficiel, et par les veines profondes. Ces veines se jettent dans les sinus duraux — sagittal supérieur, transverses, sigmoïdes, caverneux — puis le sang rejoint les veines jugulaires internes (Int J Stroke, 2025). Une obstruction à un point de ce trajet empêche le sang d’en amont de s’évacuer.</p>
<p>Trois mécanismes expliquent la formation du thrombus, résumés par la <button class="w" data-k="g08-virchow">triade de Virchow</button> : dysfonction de l’endothélium, altération du flux veineux cérébral, hypercoagulabilité. La forme septique se distingue par un facteur <b>local</b> : l’infection du système nerveux central ou de la tête et du cou précipite la thrombose, alors que la thrombophilie est un facteur général (Int J Stroke, 2025). Le foyer infectieux contigu est ainsi à la fois la cause et la cible première du traitement.</p>
<p>L’obstruction produit ensuite deux séries de conséquences.</p>
<ul>
<li><b>Sur la pression.</b> La pression veineuse augmente et la résorption du liquide cérébrospinal diminue ; il en résulte une <button class="w" data-k="g08-htic">hypertension intracrânienne</button> (Int J Stroke, 2025).</li>
<li><b>Sur le tissu.</b> La congestion provoque un œdème, visible en imagerie chez jusqu’à la moitié des patients, et un <button class="w" data-k="g08-infarctus">infarctus veineux</button> souvent hémorragique (ligne directrice S2k, 2023 ; Int J Stroke, 2025).</li>
<li><b>Au sinus caverneux.</b> Le drainage veineux orbitaire est obstrué, d’où l’œdème et le chémosis ; les nerfs crâniens qui traversent le sinus sont comprimés (Caranfa et Yoon, 2021).</li>
</ul>
<p>Deux conséquences thérapeutiques en découlent. D’abord, l’anticoagulation vise à empêcher l’extension du thrombus et la réocclusion des segments que la fibrinolyse endogène a rouverts ; elle reste indiquée même en présence d’une hémorragie intracrânienne liée à la congestion veineuse (ligne directrice S2k, 2023). Ensuite, la <button class="w" data-k="g08-recanal">recanalisation</button> est fréquente : 85 % (intervalle de confiance à 95 % de 80 à 89 %) dans 19 études portant sur 818 patients ; elle survient surtout pendant les trois à six premiers mois et presque jamais après douze mois (ligne directrice S2k, 2023).</p>
<div class="key"><b>À retenir.</b> Foyer infectieux contigu, thrombus veineux, congestion, puis hypertension intracrânienne et infarctus veineux : la chaîne explique chaque signe et chaque étape du traitement.</div>

</section>
<section class="ilot" id="g08-5"><h2><span class="n">5</span>Causes et facteurs de risque</h2>

<p>Il faut distinguer les facteurs de la thrombose veineuse cérébrale en général des infections qui déclenchent la forme septique.</p>
<table class="t"><thead><tr><th>Famille</th><th>Éléments retenus</th><th>Source</th></tr></thead><tbody><tr><td>Facteurs généraux</td><td>Grossesse, contraception orale, thrombophilie génétique ou acquise, cancer, maladies auto-immunes ; anémie et obésité également identifiées ; contraceptifs hormonaux combinés : risque multiplié par 7,6 (intervalle de confiance à 95 % de 3,82 à 15,09)</td><td>Int J Stroke 2025 ; Ferro 2019 ; S2k 2023</td></tr><tr><td>Facteurs locaux</td><td>Infections du système nerveux central, infections de la tête et du cou, traumatisme crânien surtout avec fracture, cathéters veineux jugulaires</td><td>Int J Stroke 2025</td></tr><tr><td>Infections déclenchantes</td><td>Sinusite ethmoïdo-sphénoïdale ; infection de la face centrale ; otite moyenne aiguë ou chronique et mastoïdite ; infection pharyngée à Fusobacterium necrophorum</td><td>Khatri 2016 ; Caranfa 2021 ; Kuczkowski 2007 ; Bank 2016</td></tr><tr><td>Infection virale et vaccination</td><td>Infection par le SARS-CoV-2 ; rarement, vaccins à vecteur adénoviral (<button class="w" data-k="g08-vitt">thrombose avec thrombopénie</button>)</td><td>Int J Stroke 2025 ; ESO 2021</td></tr></tbody></table>

<p>Le tableau montre qu’un seul patient peut cumuler un facteur général et un foyer local ; la présence d’un facteur général n’exclut donc pas un foyer septique. Dans la thrombose du sinus caverneux, l’origine est le plus souvent une sinusite ethmoïdale ou sphénoïdale, plus rarement une origine otogène, odontogène ou pharyngée (Caranfa et Yoon, 2021). Dans la thrombose otogène, la flore est mixte (Kuczkowski, 2007) ; chez l’enfant, une série néerlandaise de dix cas retrouve Fusobacterium necrophorum dans la moitié des cas (Nobacht et coll., 2026).</p>
<p>Le <b>terrain</b> peut favoriser des formes invasives. Un diabète mal équilibré ou une immunodépression sont évoqués dans des rapports de cas, qui n’ont pas été retenus comme sources pour ce cours : aucune conduite n’en est déduite.</p>
<div class="trap"><span class="k">Piège</span> Une thrombophilie connue ou une contraception orale peut détourner l’attention d’un foyer ORL ou dentaire. Chercher le foyer infectieux reste obligatoire quand la fièvre ou la douleur de la face ou de l’oreille précède les signes neurologiques.</div>
<button class="pareto-btn ui" data-k="pareto-g08-causes">▲ Loi de Pareto — Causes et facteurs de risque</button>
</section>
<section class="ilot" id="g08-6"><h2><span class="n">6</span>Anamnèse</h2>

<p>L’interrogatoire a deux objectifs : repérer l’infection de voisinage et reconnaître les signes de la thrombose. Il porte sur la douleur de la face, la rhinorrhée purulente, l’otalgie, l’otorrhée et un mal de gorge récent (Khatri et Wasay, 2016 ; Caranfa et Yoon, 2021 ; Kuczkowski, 2007).</p>
<p>La <button class="w" data-k="g08-ceph">céphalée</button> est le symptôme le plus fréquent de la thrombose veineuse cérébrale et elle est souvent isolée. Une céphalée isolée et un âge plus élevé sont associés à un retard diagnostique ; la majorité des patients ont consulté dans la semaine précédant le diagnostic (Int J Stroke, 2025). Le piège est donc de rattacher la céphalée à l’infection ORL sans envisager une complication veineuse.</p>
<div class="two"><div class="card"><b>Forme caverneuse</b><p>Début fulminant, fièvre, douleur et tuméfaction périorbitaires, signes systémiques. L’infection préalable est habituellement de la face centrale ou des sinus ; l’extension au côté opposé est rapide (Khatri et Wasay, 2016).</p></div><div class="card"><b>Forme otogène</b><p>Sur otite chronique : fièvre septique, otalgie, signes neurologiques croissants. Sur otite aiguë : céphalées, fièvre élevée, troubles visuels (Kuczkowski, 2007).</p></div></div>

<p>Les antécédents utiles sont ceux de la <button class="w" data-k="g08-fdr">thrombose veineuse cérébrale en général</button> : grossesse ou postpartum récents, contraception hormonale, thrombophilie connue, cancer, maladie auto-immune, vaccination récente. Le <button class="w" data-k="g08-score-berne">score clinique de Berne</button> attribue des points à ces éléments et à d’autres : crise épileptique, durée des symptômes, caractère de la céphalée, déficit focal. Il se calcule au moment du diagnostic, il est détaillé dans l’onglet des examens.</p>
<div class="key"><b>À retenir.</b> Une fièvre de la face ou de l’oreille suivie de céphalée, de troubles visuels ou de signes neurologiques impose de penser à une complication veineuse intracrânienne.</div>
</section>
<section class="ilot" id="g08-7"><h2><span class="n">7</span>Examen clinique</h2>

<p>L’examen suit l’ordre habituel : état général et paramètres vitaux, puis recherche du foyer, puis examen neurologique et ophtalmologique. Les sources lues n’indiquent pas de seuil chiffré de fièvre ni de fréquence cardiaque ; ces paramètres sont relevés comme signes systémiques.</p>
<div class="two"><div class="card"><b>Signes locaux et orbitaires</b><ul><li>Ptosis, œdème palpébral, chémosis, ophtalmoplégie (<button class="w" data-k="g08-orbite">signes orbitaires</button>).</li><li>Atteinte des <button class="w" data-k="g08-nerfs">nerfs crâniens III, IV, V et VI</button> : ils traversent le sinus caverneux.</li><li>Extension rapide au côté controlatéral dans la forme caverneuse septique.</li><li>Foyer ORL : rhinorrhée purulente, otorrhée, signes de mastoïdite ou d’amygdalite.</li></ul></div><div class="card"><b>Signes neurologiques</b><ul><li>Hypertension intracrânienne : <button class="w" data-k="g08-papille">œdème papillaire</button>, troubles visuels.</li><li>Signes focaux : hémiparésie, aphasie ; <button class="w" data-k="g08-crises">crises épileptiques</button>.</li><li>Troubles de la conscience ou <button class="w" data-k="g08-coma">coma</button> : thrombose profonde ou grands infarctus.</li></ul></div></div>

<p>Un signe évocateur de la forme caverneuse septique est l’extension rapide des signes au côté opposé (Khatri et Wasay, 2016). Toutefois, l’examen clinique ne distingue pas à lui seul une thrombose veineuse d’une cellulite orbitaire ou d’un autre syndrome du sinus caverneux : les sources lues ne fournissent pas de différentiel structuré sur ce point, et l’imagerie veineuse tranche.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Attendre l’atteinte bilatérale pour agir. Le début est souvent unilatéral ; une atteinte périorbitaire fébrile avec limitation oculomotrice doit déjà conduire à l’imagerie veineuse.</div>
