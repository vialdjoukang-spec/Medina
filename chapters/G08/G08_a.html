<template id="ch-G08"><div class="chap"><div class="chap-head"><div class="code">G08 · Neurologie</div><h1>G08 — Phlébite et thrombophlébite intracrâniennes et intrarachidiennes</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G08"><section class="ilot" id="g08-question"><h2>Une infection et une thrombose : deux menaces à prendre en charge ensemble</h2><p>Une douleur ou un gonflement périorbitaire avec fièvre, diplopie, baisse visuelle ou anomalie neurologique impose de rechercher une complication profonde d’une infection de la face ou des sinus. Une céphalée inhabituelle, une crise ou une baisse de vigilance peut révéler une thrombose veineuse intracrânienne. Le besoin de confirmer le thrombus et celui de traiter l’infection avancent en parallèle : imagerie adaptée, prélèvements possibles sans danger et mobilisation de l’équipe spécialisée.</p><p>Cette leçon traite les phlébites et thrombophlébites intracrâniennes et intrarachidiennes de G08, sous leur périmètre septique. Elle ne réduit pas la maladie à une thrombose liée à la contraception ou à une thrombophilie. Un anticoagulant peut limiter l’extension thrombotique ; il ne stérilise pas un foyer infectieux. Une antibiothérapie ne dispense pas de discuter le risque de propagation ou de compression.</p><div class="key"><b>À retenir.</b> Chercher le territoire, la gravité et le foyer ; traiter la cause et discuter l’anticoagulation avec les spécialistes, sans ordonnance unique pour tout G08.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r14">[14]</button></p></section><section class="ilot" id="g08-definition"><h2>Définir le territoire et le caractère septique</h2><p><button class="w" data-k="g08-tvc">Thrombose, phlébite et infection : que faut-il établir ?</button></p><table class="t"><thead><tr><th>Question</th><th>Éléments utiles</th><th>Limite</th></tr></thead><tbody><tr><td>Où est la thrombose ?</td><td>Sinus caverneux, autres sinus, veines cérébrales ou territoire intrarachidien.</td><td>Le territoire modifie les signes, l’imagerie et l’accès au foyer.</td></tr><tr><td>Pourquoi la forme est-elle dite septique ?</td><td>Foyer contigu ou infection systémique pertinente, prélèvements et cohérence clinique.</td><td>Une culture négative ne suffit pas à exclure ; un test isolé ne suffit pas toujours à confirmer.</td></tr><tr><td>Quelles complications sont présentes ?</td><td>Vision, vigilance, déficit, crise, collection et menace mécanique.</td><td>Le diagnostic ne doit pas s’arrêter au mot thrombose.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Documenter manifestation, cause et degré de certitude ; le code ne démontre ni l’agent ni une stratégie commune.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button> · <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button></p></section><section class="ilot" id="g08-codage"><h2>G08 sans subdivision : inclusions septiques et exclusions explicites</h2><p><button class="w" data-k="g08-codage">Lire les notes de classification avant de coder</button></p><table class="t"><thead><tr><th>Situation exclue de G08</th><th>Code ou groupe cité par la classification</th><th>Conséquence</th></tr></thead><tbody><tr><td>Phlébite/thrombophlébite intracrânienne non pyogène</td><td>I67.6</td><td>Ne pas coder toute thrombose veineuse cérébrale comme G08.</td></tr><tr><td>Forme intrarachidienne non purulente</td><td>G95.18</td><td>Décrire le territoire et la cause avant codage.</td></tr><tr><td>Complication d’avortement, grossesse extra-utérine ou molaire</td><td>O00–O07 ; O08.7</td><td>Utiliser les règles obstétricales applicables.</td></tr><tr><td>Complication de grossesse ou de puerpéralité</td><td>O22.5 ; O87.3</td><td>Maintenir la prise en charge urgente, avec codage causal adapté.</td></tr></tbody></table><p>Les libellés français correspondants ont été relus, notamment « Thrombose non pyogène du système veineux intracrânien » et les thromboses veineuses cérébrales de grossesse ou de puerpéralité. Le fichier des codes donne des libellés, mais pas toutes les notes contextuelles ; la classification applicable et le service de codage complètent la décision.</p><div class="key"><b>À retenir.</b> G08 est sans subdivision et garde son périmètre septique ; une exclusion administrative ne signifie jamais absence d’urgence clinique.</div><p>Sources : <button class="w" data-k="g08-r1">[1]</button> · <button class="w" data-k="g08-r2">[2]</button></p></section><section class="ilot" id="g08-epidemio"><h2>Épidémiologie : les chiffres de toutes thromboses ne décrivent pas G08</h2><p>Les recherches suisses ciblées et les sources européennes lues ne donnent pas une incidence ou une prévalence nationale actuelle propre à G08, avec une répartition exhaustive par âge et sexe. La revue de 2025 cite des incidences récentes de 1,2 à 1,3 pour 100000 habitants pour les thromboses veineuses cérébrales de toutes causes dans les populations étudiées. Cet ordre de grandeur ne devient pas une incidence suisse de thrombophlébite septique.</p><p>La série néerlandaise de douze patients réunit des enfants et des adultes, dans un centre tertiaire, sur la période 2005–2017. La revue sur les thromboses otogènes du sinus sigmoïde rassemble 113 patients issus de seize séries. Leurs modes de sélection, traitements et gravités empêchent d’en tirer une fréquence nationale ou un bénéfice causal universel d’un traitement.</p><table class="t"><thead><tr><th>Donnée</th><th>Ce qu’elle décrit</th><th>Ce qu’elle ne décrit pas</th></tr></thead><tbody><tr><td>1,2–1,3/100000</td><td>Ordre de grandeur de toutes thromboses veineuses cérébrales cité par une revue.</td><td>Incidence suisse G08 ou incidence septique.</td></tr><tr><td>12 patients</td><td>Série tertiaire néerlandaise de thrombose septique du sinus caverneux.</td><td>Pronostic attendu de tout patient ni comparaison randomisée.</td></tr><tr><td>113 patients ; 16 séries</td><td>Revue de thrombose otogène du sinus sigmoïde.</td><td>Effet causal certain de l’anticoagulation ou sécurité universelle.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Donner maladie, population, année et dénominateur ; conserver la lacune nationale plutôt que transformer une série en incidence.</div><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-foyers"><h2>Rechercher un foyer sans imposer un agent unique</h2><p><button class="w" data-k="g08-foyer">Face, sinus, oreille et pharynx : relier le foyer à son extension</button></p><p>Les agents de la série sont variables : streptocoques, staphylocoque, Fusobacterium et, dans un cas, un champignon. La microbiologie, le terrain et la porte d’entrée orientent la couverture et son adaptation. Une infection invasive fongique doit être évoquée dans un contexte compatible, sans transformer un cas en agent dominant de toutes les thromboses.</p><table class="t"><thead><tr><th>Foyer possible</th><th>Questions utiles</th><th>Décision associée</th></tr></thead><tbody><tr><td>Sinus ou face</td><td>Douleur, sécrétions, gonflement, geste récent, évolution malgré traitement.</td><td>Imagerie des rapports et avis ORL selon gravité.</td></tr><tr><td>Oreille/mastoïde</td><td>Otalgie, otorrhée, infection récente ou chronique, baisse auditive.</td><td>Bilan otologique et du sinus adjacent, contrôle du foyer.</td></tr><tr><td>Pharynx/dents</td><td>Infection, douleur, trismus, soins ou collection.</td><td>Prélèvements et drainage adaptés si indiqués.</td></tr><tr><td>Infection systémique</td><td>Cultures, foyer distant et arguments d’endocardite.</td><td>Revoir cause et contre-indications des anticoagulants, notamment celle de Clexane.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le foyer, l’agent et le thrombus sont trois informations à relier ; aucune ne remplace les deux autres.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r6">[6]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r10">[10]</button></p></section><section class="ilot" id="g08-anamnese"><h2>Construire une chronologie qui change la décision</h2><p>Préciser début et évolution de céphalée, douleur orbitaire, diplopie, baisse visuelle, vomissements, fièvre, crise et modification de vigilance. Rechercher les symptômes de sinusite, otite, infection faciale, dentaire ou pharyngée. La diffusion au second œil peut être évocatrice, mais il ne faut pas attendre une bilatéralité pour suspecter une thrombose caverneuse.</p><p>Documenter médicaments déjà pris, antibiotiques, anticoagulants, antiagrégants et traitements qui modifient le risque hémorragique. Relever doses, heures de dernière prise, rein, foie, grossesse possible et procédures prévues. Une baisse visuelle ou une confusion nouvelle nécessite une réévaluation rapide, même après un premier diagnostic de cellulite orbitaire ou une imagerie non adaptée au système veineux.</p><p><button class="w" data-k="g08-chronologie">Quand un tableau initialement local doit être réévalué</button></p><div class="key"><b>À retenir.</b> La date du changement neurologique et l’heure des traitements doivent pouvoir être relues par l’équipe suivante.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r7">[7]</button> · <button class="w" data-k="g08-r8">[8]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section><section class="ilot" id="g08-clinique"><h2>Examiner la fonction neurologique et la vision</h2><p>Commencer par stabilité, respiration, circulation, température et vigilance. Examiner vision de chaque œil, pupilles, motilité oculaire, douleur et signes orbitaires, puis langage, nerfs crâniens, force, sensibilité et coordination selon le tableau. Un examen normal incomplet ne suffit pas à exclure la maladie. L’inflammation orbitaire peut limiter l’examen ; cette limite est documentée plutôt qu’ignorée.</p><p><button class="w" data-k="g08-caverneux">Pourquoi une limitation d’abduction peut être importante</button></p><p><button class="w" data-k="g08-force">Mesurer la force de manière comparable</button></p><div class="key"><b>À retenir.</b> Mesurer séparément vision, motilité, vigilance et déficit, puis comparer ; un signe localise une fonction et ne prouve pas seul l’agent.</div><p>Sources : <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button> · <button class="w" data-k="g08-r13">[13]</button></p></section><section class="ilot" id="g08-urgence"><h2>Vision, vigilance et déficit : les changements qui imposent d’agir</h2><p>Baisse de vision, déficit rapidement progressif, crise persistante ou répétée, baisse de vigilance ou signes de menace mécanique imposent stabilisation et évaluation urgente. Le guide recommande une prise en charge surveillée de la phase aiguë de thrombose veineuse cérébrale, avec transfert vers un centre disposant des compétences interventionnelles et neurochirurgicales lorsque nécessaire. La présence d’un foyer septique ajoute une prise en charge infectiologique et du foyer.</p><p><button class="w" data-k="g08-coma">Une baisse de vigilance ne se résume pas à un score pronostique</button></p><p><button class="w" data-k="g08-crises">Crise survenue et prévention systématique sont deux questions</button></p><p>Il ne faut pas attendre un résultat de D-dimères, une culture finale ou l’apparition de tous les signes orbitaires avant une imagerie adaptée. Le contrôle du foyer, les prélèvements sûrs et le traitement sont organisés en parallèle selon l’état clinique. Aucun délai arbitraire de tolérance d’un déficit ou seuil de diamètre n’est ajouté.</p><div class="key"><b>À retenir.</b> Une dégradation change immédiatement la sécurité et l’organisation des soins ; le diagnostic causal se précise sans retarder le traitement urgent.</div><p>Sources : <button class="w" data-k="g08-r3">[3]</button> · <button class="w" data-k="g08-r5">[5]</button> · <button class="w" data-k="g08-r9">[9]</button></p></section>
