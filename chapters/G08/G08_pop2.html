<template data-pop="g08-r1" data-k="g08-r1"><h3>[1] BfArM : entrée G08 complète</h3><p>G08 est sans subdivision et inclut embolie, endophlébite, phlébite, thrombophlébite et thrombose septiques des sinus et veines intracrâniens ou intrarachidiens. Les formes non pyogènes intracrâniennes relèvent de I67.6 ; les formes spinales non purulentes sont exclues vers G95.18. Les complications obstétricales ont les codes causaux exclus précisés.</p><p><b>Passages lus :</b> Entrée complète G08 : inclusions septiques, exclusions obstétricales, intracrâniennes non pyogènes et spinales non purulentes. <b>Population :</b> Classification, manifestations septiques intracrâniennes et intrarachidiennes. <b>Version :</b> ICD-10-GM 2024. <b>Limites :</b> Classification allemande 2024, pas une règle de facturation suisse 2026. Le code ne détermine pas seul un protocole thérapeutique.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener noreferrer">Consulter la source — BfArM</a></p></template>
<template data-pop="g08-r2" data-k="g08-r2"><h3>[2] OFS : libellés français officiels de G08 et exclusions</h3><p>Le fichier français identifie G08 comme code terminal, sans sous-code à décimale. Les libellés français distinguent thrombose non pyogène du système veineux intracrânien et complications veineuses obstétricales.</p><p><b>Passages lus :</b> Structure et limites du fichier déjà lues par Sol pour G07 ; lignes G08, G95.18, I67.6, O08.7, O22.5 et O87.3 effectivement lues pour G08. <b>Population :</b> Libellés suisses du fichier des codes. <b>Version :</b> CIM-10-GM 2024, export du 31 octobre 2024. <b>Limites :</b> Le fichier ne contient pas toutes les inclusions et exclusions : les notes BfArM complètent le périmètre. Application annoncée au 1er janvier 2025 dans le texte de présentation antérieurement lu ; pas de certification de codage 2026.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener noreferrer">Consulter la source — Office fédéral de la statistique</a></p></template>
<template data-pop="g08-r3" data-k="g08-r3"><h3>[3] Recommandations DGN et consensus Allemagne, Autriche et Suisse : thrombose veineuse cérébrale</h3><p>Dans la forme septique, traiter le foyer et administrer les antibiotiques constitue la priorité initiale ; les antibiotiques sont hors du champ du guide. Pour le reste, le guide applique les principes généraux. Imagerie avec exploration veineuse indispensable ; D-dimères non recommandés en routine pour exclure. Héparine thérapeutique en phase aiguë même en cas de saignement de congestion, préférence pour HBPM sauf situation interventionnelle ou contre-indication. Après stabilisation, anticoagulant oral direct préféré à AVK sauf syndrome antiphospholipides triple positif. Au moins trois mois, phase de maintien trois à douze mois ; ne pas prolonger pour seule recanalisation. Grossesse : HBPM et équipe multidisciplinaire, pas anticoagulant oral direct.</p><p><b>Passages lus :</b> Introduction, définition, méthodes, note septique, diagnostic, anticoagulation aiguë, intervention, décompression, entretien et passages grossesse/contraception. <b>Population :</b> Thrombose veineuse cérébrale générale ; note initiale propre aux formes septiques. <b>Version :</b> Article 2024, mise à jour du guide du 24 octobre 2023. <b>Limites :</b> Article abrégé et consensus, preuves souvent faibles ; aucune antibiothérapie spécifique dans ce guide. La date de validité anglaise est incohérente (23 octobre 2023) ; registre AWMF consulté séparément indique 23 octobre 2028. Pas toutes les références originales ni suppléments lus.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11027218/" target="_blank" rel="noopener noreferrer">Consulter la source — Weimar et coll., Neurological Research and Practice ; DGN, sociétés participantes dont SNG</a></p></template>
<template data-pop="g08-r4" data-k="g08-r4"><h3>[4] Registre AWMF 030-098 : version et validité</h3><p>Le registre indique une validité jusqu’au 23 octobre 2028 et une version longue corrigée 6.1 mise en ligne le 6 février 2024. Cela résout la date de validité incohérente de l’article abrégé sans modifier ses données cliniques.</p><p><b>Passages lus :</b> Extrait de registre consulté via outil : version, date, correction et validité. <b>Population :</b> Métadonnées du guide de thrombose veineuse cérébrale. <b>Version :</b> Version 6.1, mise à jour 24 octobre 2023 ; correction du 6 février 2024. <b>Limites :</b> Extrait de registre issu d’un cache du fournisseur daté du 3 octobre 2026, réellement consulté le 2 novembre. Tentative de document numérique direct a renvoyé un document page web textuelle, pas le guide document numérique ; la version longue ne sera pas présentée comme lue.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://register.awmf.org/de/leitlinien/detail/030-098" target="_blank" rel="noopener noreferrer">Consulter la source — AWMF</a></p></template>
<template data-pop="g08-r5" data-k="g08-r5"><h3>[5] Van der Poel et coll. : série de thrombose septique du sinus caverneux</h3><p>Tous les patients ont reçu des antibiotiques adaptés à l’agent attendu ou documenté et discutés avec la microbiologie ; onze ont été opérés du foyer. Sept ont été anticoagulés, selon décision neurologique individuelle. La série ne démontre pas causalement un bénéfice universel de l’anticoagulation et rappelle que les essais historiques ne concernaient pas les formes septiques. Signes orbitaires et atteinte des nerfs, en particulier VI, peuvent orienter ; cellulite orbitaire et autres causes sont différentielles. Nerf VI dans le sinus, autres nerfs cités dans la paroi latérale : ne pas dire que tout le nerf V traverse la lumière.</p><p><b>Passages lus :</b> Introduction, méthodes, résultats cliniques/foyers/imagerie/traitement/issue, discussion clinique/différentiel/imagerie/traitement/pronostic et conclusion ; figures, droits et éthique. <b>Population :</b> Douze enfants et adultes, centre tertiaire néerlandais. <b>Version :</b> 2018, série 2005–2017. <b>Limites :</b> Petite série rétrospective, adultes et enfants mélangés, pas une incidence suisse ni une prescription universelle. Choix locaux d’éviter anticoagulation dans certains cas de méningite non transformés en contre-indication générale. Pas de sensibilité comparative d’imagerie démontrée. Figure 1 sous Creative Commons Attribution 4.0, données préexistantes anonymisées et absence d’approbation éthique formelle requise selon auteurs, pas consentement individuel inventé.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6096574/" target="_blank" rel="noopener noreferrer">Consulter la source — European Archives of Oto-Rhino-Laryngology ; équipes de l’Université d’Amsterdam</a></p></template>
<template data-pop="g08-r6" data-k="g08-r6"><h3>[6] George et coll. : thrombose otogène du sinus sigmoïde et anticoagulation</h3><p>La recanalisation est plus fréquente dans le groupe anticoagulé, sans bénéfice clinique causal démontré. Les groupes, petites séries, traitements et degrés de gravité sont hétérogènes. Une meilleure recanalisation radiologique ne suffit pas à prouver une meilleure évolution clinique ni une sécurité universelle.</p><p><b>Passages lus :</b> Extraits détaillés de méthodes, résultats, discussion et conclusion ; métadonnées de l’article et affiliations vérifiées par Europe PubMed Central. <b>Population :</b> Cent treize patients de seize séries publiées. <b>Version :</b> 2023, recherche de littérature jusqu’en 2021. <b>Limites :</b> Extraits de texte primaire réellement lus via outil, pas tous les tableaux ou suppléments. Tentative de texte structuré a échoué (erreur de serveur) ; lecture via autre accès public. Discordances de certains dénominateurs et saignements entre passages : aucun pourcentage comparatif repris comme résultat stable ni protocole déduit.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10235279/" target="_blank" rel="noopener noreferrer">Consulter la source — Indian Journal of Otolaryngology and Head & Neck Surgery ; auteurs dont CHUV Lausanne, affiliation vérifiée dans métadonnées primaires</a></p></template>
<template data-pop="g08-r7" data-k="g08-r7"><h3>[7] Clexane : information professionnelle suisse</h3><p>Pour la thrombose veineuse profonde, la FI décrit 1 mg/kg sous-cutané deux fois par jour ; le rythme 1,5 mg/kg une fois par jour est réservé aux situations non compliquées. Sous 30 ml/min, la FI donne une adaptation thérapeutique à 1 mg/kg une fois par jour, alors que le guide privilégie HNF dans les situations rénales avancées. Les contre-indications incluent endocardite bactérienne aiguë, saignement important et antécédent immunitaire récent de thrombocytopénie induite par héparine. Activité anti-Xa importante régulée par antithrombine ; les tests globaux ne surveillent pas correctement l’exposition.</p><p><b>Passages lus :</b> Composition, indications, doses thérapeutiques, rein, contre-indications, précautions neuraxiales, grossesse et mécanisme ; passages datés. <b>Population :</b> Énoxaparine ; indications et doses de thrombose veineuse profonde, pas libellé spécifique G08. <b>Version :</b> Février 2026. <b>Limites :</b> G08 n’est pas une indication explicitement libellée. Hémorragie de congestion dans le guide et contre-indications hémorragiques de FI doivent être arbitrées, pas effacées. Délais neuraxiaux lus partiellement, pas protocole universel de ponction reproduit. Autres indications cardiologiques non utilisées.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, FI via AmiKo</a></p></template>
<template data-pop="g08-r8" data-k="g08-r8"><h3>[8] Pradaxa : information professionnelle suisse</h3><p>Dans la thrombose veineuse profonde/embolie, 150 mg deux fois par jour après au moins cinq jours d’héparine. La notice réduit à 110 mg deux fois par jour pour clairance 30–50 ml/min et à partir de 80 ans ; sous 30 ml/min, contre-indication. Les capsules ne doivent pas être ouvertes. Le dabigatran est un inhibiteur direct de thrombine : conversion fibrinogène-fibrine et coagulation sont affectées. G08 n’est pas une indication nommée de la FI.</p><p><b>Passages lus :</b> Composition, indications, doses et relais pour thrombose/embolie, rein/foie/âge, pédiatrie, contre-indications et mécanisme. <b>Population :</b> Adultes avec indications libellées de fibrillation auriculaire et thrombose veineuse profonde/embolie pulmonaire. <b>Version :</b> Février 2024. <b>Limites :</b> Pas un schéma validé de phase septique aiguë : stabilisation et choix spécialisé nécessaires. Les frontières et la formule de clairance doivent rester celles du produit. Toute contre-indication ou interaction non relue n’est pas reconstruite. Sections détaillées d’efficacité de fibrillation auriculaire non utilisées. Borne de clairance 50 ml/min partagée par les paragraphes 30–50 et 50–80 ; ne pas choisir un arrondi de mémoire. La réduction à 220 mg/j dans thrombose/embolie repose sur analyses pharmacologiques et non sur une étude clinique spécifique selon la FI.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680613850150" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, FI via AmiKo</a></p></template>
<template data-pop="g08-r9" data-k="g08-r9"><h3>[9] Vellema, van de Munckhof et Coutinho : actualités sur la thrombose veineuse cérébrale</h3><p>Triade de dysfonction endothéliale, altération du flux et hypercoagulabilité ; obstruction veineuse peut diminuer résorption du liquide céphalorachidien et produire hypertension, lésion focale, encéphalopathie et crises. Les chiffres d’incidence et de mortalité de toutes les thromboses veineuses cérébrales ne représentent pas G08 septique. Scores et marqueurs récents ne sont pas des critères universels de diagnostic de thrombophlébite infectieuse.</p><p><b>Passages lus :</b> Introduction complète, mécanismes et syndromes, passages épidémiologie, diagnostic, complications et pronostic ; légendes contextuelles. <b>Population :</b> Revue narrative de thromboses veineuses cérébrales de toutes causes. <b>Version :</b> 2025. <b>Limites :</b> Revue narrative, pas guide suisse de traitement des infections. Sections thérapeutiques et études originales non toutes lues. Recommandations américaines éventuellement citées par la revue non utilisées comme fondement de conduite. Aucune figure de la revue importée.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12664938/" target="_blank" rel="noopener noreferrer">Consulter la source — International Journal of Stroke ; équipe centre hospitalier universitaire d’Amsterdam</a></p></template>
<template data-pop="g08-r10" data-k="g08-r10"><h3>[10] Spital Thurgau : antibiothérapie locale 2026 et infection faciale</h3><p>Le protocole local suisse signale le risque de thrombose septique des sinus en cas de furoncle du visage. La localisation faciale, nasale ou périorbitaire modifie le niveau de prudence et l’organisation des soins.</p><p><b>Passages lus :</b> Page sur furoncle/infection faciale : avertissement spécifique de danger de thrombose septique des sinus. <b>Population :</b> Protocole hospitalier local, infections cutanées du visage. <b>Version :</b> 2026. <b>Limites :</b> Page de furoncle réellement lue ; ses doses ne constituent pas le traitement de la thrombophlébite intracrânienne constituée. Protocole local, pas national.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://www.stgag.ch/ext/tx_docs/stgag-antibiotika-richtlinien-6a86f7bc9783e.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Spital Thurgau AG</a></p></template>
<template data-pop="g08-r11" data-k="g08-r11"><h3>[11] Ceftriaxon Labatec : information professionnelle</h3><p>La lecture Sol G06 de Ceftriaxon Labatec est réutilisée explicitement. Les doses adultes générales et l’adaptation rénale de la FI ne démontrent pas une durée d’abcès cérébral gonococcique. Une clairance inférieure à 10 ml/min ou une dialyse impose un maximum de 2 g/j selon cette spécialité. Une fréquence de guide britannique doit être identifiée comme telle et confrontée à la notice et au protocole du centre.</p><p><b>Passages lus :</b> Lecture réelle de Sol pour G06 : doses adultes générales, rein, voie et précautions pertinentes, mécanisme et date, explicitement réutilisée. <b>Population :</b> Ceftriaxon Labatec ; doses adultes générales et limite rénale, lecture Sol G06 réutilisée. <b>Version :</b> Juin 2025. <b>Limites :</b> Pas une nouvelle lecture intégrale G07. Fréquence britannique et notice suisse distinguées ; aucune durée validée d’abcès cérébral gonococcique déduite.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680598760031" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g08-r12" data-k="g08-r12"><h3>[12] Metronidazole SINT i.v. : information professionnelle</h3><p>Le flacon de Metronidazole SINT i.v. contient 500 mg pour 100 ml et 326 mg de sodium. La FI décrit une activité contre des anaérobies et Entamoeba histolytica, sans schéma spécifique validé de lésion cérébrale amibienne. La durée usuelle courte de la notice ne détermine pas seule celle d’une infection cérébrale rare. Une prolongation exceptionnelle doit être justifiée et surveillée, notamment par l’hémogramme et l’examen neurologique. Ataxie, confusion, myoclonies ou paresthésies peuvent annoncer une toxicité.</p><p><b>Passages lus :</b> Composition, indications et spectre, doses générales, durée et prolongation, rein et foie, risques neurologiques, contre-indications pertinentes, mécanisme et date. <b>Population :</b> Metronidazole SINT i.v. ; infections anaérobies et spectre antiparasitaire, sans dose cérébrale amibienne spécifique. <b>Version :</b> Février 2026. <b>Limites :</b> Schéma général anaérobie et spectre antiparasitaire ne démontrent pas une dose cérébrale amibienne. Produit distinct de la présentation B. Braun, notamment pour le sodium.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680708870018" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g08-r13" data-k="g08-r13"><h3>[13] Medical Research Council : examen de la force musculaire</h3><p>L’échelle de force du Medical Research Council distingue 0 : aucune contraction, 1 : contraction perceptible sans mouvement utile, 2 : mouvement avec pesanteur éliminée, 3 : mouvement contre la pesanteur, 4 : mouvement contre résistance et 5 : force normale. Il faut isoler le mouvement et relever les compensations. Ce sont des grades de force, différents des stades de gravité I à III de la méningite tuberculeuse. Traduction pédagogique et attribution selon les conditions du MRC.</p><p><b>Passages lus :</b> Manuel, page 7 du document numérique correspondant à la page imprimée 1 : grades 0–5, méthode et droits ; lecture Sol G06 puis revérification G07, réutilisée G08. <b>Population :</b> Examen de la force musculaire ; pas le classement de gravité de la méningite tuberculeuse. <b>Version :</b> Manuel 1976, page officielle actualisée en 2026. <b>Limites :</b> Échelle de force musculaire, pas une classification de gravité septique. Traduction pédagogique et attribution selon les conditions du Medical Research Council ; aucune anatomie du manuel importée.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://www.ukri.org/councils/mrc/facilities-and-resources/find-an-mrc-facility-or-resource/mrc-muscle-scale/" target="_blank" rel="noopener noreferrer">Consulter la source — Medical Research Council, site officiel britannique</a></p></template>
<template data-pop="g08-r14" data-k="g08-r14"><h3>[14] PROFILES 2017 : situations cliniques de formation médicale</h3><p>Les situations de PROFILES 2017 comprennent céphalée, trouble cognitif, parésie, trouble sensitif et crise, ainsi que déficit neurologique aigu et céphalée sévère avec méningisme. La leçon propose un lien pédagogique avec ces situations ; elle ne prétend pas constituer une nouvelle liste fédérale ou une correspondance officielle de 2026.</p><p><b>Passages lus :</b> Passages sur céphalée, cognition, parésie, sensibilité, crise, déficit aigu et méningisme, antérieurement lus et revérifiés par Sol ; réutilisation G08. <b>Population :</b> Repères pédagogiques de situations cliniques ; correspondance locale explicitée. <b>Version :</b> 2017. <b>Limites :</b> Correspondance pédagogique locale, pas une nouvelle table fédérale officielle de 2026.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — PROFILES, objectifs nationaux suisses de formation médicale</a></p></template>
<template data-pop="g08-r15" data-k="g08-r15"><h3>[15] Gray 1196 : enveloppes méningées normales et droits</h3><p>L’illustration Gray 1196 est un original humain historique montrant des enveloppes méningées normales. La page de droits et les pixels ont été revus ; la reproduction mécanique de l’ouvrage de 1918 est donnée dans le domaine public. Elle sert à nommer des plans et ne montre ni granulome ni imagerie d’un patient. Les annotations françaises restent dans un tableau adjacent, sans modification des pixels.</p><p><b>Passages lus :</b> Page de droits Commons et original réellement inspectés par Sol pour G07 ; pixels de nouveau affichés et inspectés pour G08. <b>Population :</b> Illustration anatomique humaine historique des enveloppes méningées normales. <b>Version :</b> 1918 ; droits et original revus le 2 novembre 2026. <b>Limites :</b> Anatomie normale historique, pas sinus caverneux ni thrombose de patient ; annotations françaises adjacentes, pixels inchangés, aucune validation médicale humaine revendiquée.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale du document.</p><p><a data-reference-source href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener noreferrer">Consulter la source — Gray, Anatomy of the Human Body ; Wikimedia Commons</a></p></template>
