<template data-pop="g08-enox" data-title="Énoxaparine (Clexane®)">
<div class="lab">Classe et mécanisme</div><p>Héparine de bas poids moléculaire. Elle ne traverse pas la barrière fœto-placentaire aux deuxième et troisième trimestres.</p><div class="lab">Preuves</div><p>La ligne directrice S2k préfère l’héparine de bas poids moléculaire à l’héparine non fractionnée en phase aiguë (recommandation modérée).</p><div class="lab">Posologie</div><p>Traitement de la thrombose veineuse profonde : 1 mg/kg par voie sous-cutanée deux fois par jour ; 1,5 mg/kg une fois par jour seulement sans problème thromboembolique compliqué ; clairance de la créatinine inférieure à 30 mL/min : 1 mg/kg une fois par jour.</p><div class="lab">Contre-indications</div><p>Endocardite bactérienne aiguë ; thrombopénie induite par l’héparine de mécanisme immunologique dans les 100 derniers jours ; cette thrombopénie survient typiquement entre le cinquième et le vingt-et-unième jour.</p><div class="lab">Indication</div><p>La thrombose veineuse cérébrale n’est pas libellée : usage hors indication.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse de Clexane®, Swissmedic, février 2026</a>.</p></template>

<template data-pop="g08-hnf" data-title="Héparine non fractionnée">
<div class="lab">Place</div><p>Réservée aux interventions chirurgicales ou endovasculaires prévues et aux contre-indications des héparines de bas poids moléculaire, notamment l’insuffisance rénale sévère.</p><div class="lab">Avantage</div><p>La coagulation se normalise 1 à 2 heures après l’arrêt de la perfusion intraveineuse.</p><div class="lab">Limite</div><p>Posologie non reprise : information professionnelle non lue.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a>.</p></template>

<template data-pop="g08-dabi" data-title="Dabigatran (Pradaxa®) et idarucizumab">
<div class="lab">Classe et preuves</div><p>Anticoagulant oral direct ; meilleure preuve parmi les anticoagulants oraux directs dans la thrombose veineuse cérébrale (méta-analyse de 2 essais : risque relatif d’événement thromboembolique veineux 0,17 [0,02 à 1,71], hémorragie majeure 0,35 [0,05 à 2,36]).</p><div class="lab">Posologie</div><p>Thrombose veineuse profonde et embolie pulmonaire : 150 mg deux fois par jour après au moins 5 jours d’héparine ; 110 mg deux fois par jour si clairance de la créatinine entre 30 et 50 mL/min ou âge d’au moins 80 ans.</p><div class="lab">Contre-indications</div><p>Clairance de la créatinine inférieure à 30 mL/min ; à éviter pendant la grossesse ; non recommandé avant 18 ans (capsules).</p><div class="lab">Antidote</div><p>Idarucizumab (Praxbind®).</p><div class="lab">Indication</div><p>La thrombose veineuse cérébrale n’est pas libellée : usage hors indication.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse de Pradaxa®, Swissmedic, février 2024</a>.</p></template>

<template data-pop="g08-avk" data-title="Antagonistes de la vitamine K">
<div class="lab">Place</div><p>Phase d’entretien en cas de syndrome des antiphospholipides triple positif ; possibles pendant l’allaitement ; contre-indiqués pendant la grossesse.</p><div class="lab">Limite</div><p>Dose, cible biologique et interactions non lues.</p><p class="src">Références : <a href="https://doi.org/10.1186/s42466-024-00320-9" target="_blank" rel="noopener">Ligne directrice S2k allemande (DGN, avec l’Autriche et la Suisse), Neurol Res Pract 2024</a>.</p></template>

<template data-pop="g08-antiepi" data-title="Antiépileptique">
<div class="lab">Indication</div><p>Après une crise précoce avec lésion supratentorielle (ESO 2017).</p><div class="lab">Limite</div><p>Aucune recommandation sur la prévention des crises tardives ; molécule et posologie non reprises car l’information professionnelle n’a pas été lue.</p><p class="src">Références : <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a> ; <a href="https://doi.org/10.1177/17474930251393311" target="_blank" rel="noopener">Revue Int J Stroke 2025, thrombose veineuse cérébrale</a>.</p></template>

<template data-pop="g08-acetazolamide" data-title="Acétazolamide">
<div class="lab">Position</div><p>L’ESO 2017 déconseille l’acétazolamide pour réduire décès ou dépendance dans la thrombose veineuse cérébrale.</p><div class="lab">Limite</div><p>Position tirée du résumé ; information professionnelle non lue.</p><p class="src">Références : <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO et EAN, thrombose veineuse cérébrale, 2017 (résumé)</a>.</p></template>

<template data-pop="pareto-g08-definition" data-title="Pareto — Définition et périmètre">
<p class="ratio" data-cover="g08-1,g08-2"></p><ul><li>La forme septique est déclenchée par une infection de voisinage ; le sinus caverneux en est la forme la plus fréquente.</li><li>Quatre syndromes cliniques ; trois portes d’entrée (sinusite, otomastoïdite, pharynx).</li><li>Thrombose non pyogène et obstétricale : hors du cours.</li></ul></template>

<template data-pop="pareto-g08-mecanismes" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="g08-3,g08-4"></p><ul><li>Obstruction veineuse : hypertension intracrânienne et infarctus veineux hémorragique.</li><li>Foyer infectieux contigu : facteur local de la triade de Virchow.</li><li>Recanalisation de 85 %, surtout durant 3 à 6 mois.</li></ul></template>

<template data-pop="pareto-g08-causes" data-title="Pareto — Causes">
<p class="ratio" data-cover="g08-5"></p><ul><li>Facteurs généraux et locaux coexistent.</li><li>Sinusite, otite, mastoïdite, infection pharyngée à Fusobacterium.</li><li>Rapports de cas sur le terrain : non retenus.</li></ul></template>

<template data-pop="pareto-g08-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g08-6,g08-7"></p><ul><li>Chercher le foyer ORL ; la céphalée est souvent isolée.</li><li>Signes orbitaires et nerfs III, IV, V, VI pour le sinus caverneux.</li><li>Œdème papillaire, déficit focal, crises, coma.</li></ul></template>

<template data-pop="pareto-g08-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g08-8"></p><ul><li>Angio-IRM ou angio-tomodensitométrie veineuse ; D-dimères jamais en routine.</li><li>Le diagnostic différentiel inclut les complications intracrâniennes otogènes.</li></ul></template>

<template data-pop="pareto-g08-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g08-9"></p><ul><li>Coma, hémorragie, thrombose profonde, infection du système nerveux central : pronostic péjoratif.</li><li>Engagement : décompression chirurgicale.</li></ul></template>

<template data-pop="pareto-g08-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g08-10"></p><ul><li>Foyer et antibiotique d’abord, sans schéma validé dans les sources lues.</li><li>Héparine à dose thérapeutique même si hémorragie.</li><li>Entretien par anticoagulant oral direct ; arrêt après 3 à 12 mois si l’infection est éliminée.</li></ul></template>

<template data-pop="pareto-g08-suivi" data-title="Pareto — Suivi">
<p class="ratio" data-cover="g08-11"></p><ul><li>Mortalité de 8,3 % dans la cohorte ISCVT.</li><li>Récidive de 1 à 3 % par an.</li></ul></template>

<template data-pop="pareto-g08-particulier" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="g08-12"></p><ul><li>Grossesse : héparine ; anticoagulants oraux directs contre-indiqués.</li><li>Pas d’œstroprogestatifs après la thrombose.</li><li>Après vaccin avec thrombopénie : éviter les héparines.</li></ul></template>

<template data-pop="pareto-g08-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="g08-e-1,g08-e-2,g08-e-3,g08-e-4,g08-e-5"></p><ul><li>IRM avec veinographie : étalon-or.</li><li>Scanner sans contraste : sensibilité de 77 %, insuffisant.</li><li>D-dimères : seulement si la probabilité est faible.</li></ul></template>

<template data-pop="pareto-g08-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g08-s-anat-cours"></p><ul><li>Veines corticales et profondes, sinus duraux, jugulaires internes.</li><li>Sinus caverneux : nerfs III, IV, V, VI.</li></ul></template>

<template data-pop="pareto-g08-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g08-s-physio-cours"></p><ul><li>Triade de Virchow ; pression veineuse ↑ et résorption ↓.</li><li>Fibrinolyse endogène et recanalisation.</li></ul></template>

<template data-pop="pareto-g08-micro" data-title="Pareto — Microbiologie">
<p class="ratio" data-cover="g08-s-micro-cours"></p><ul><li>Flore mixte dans la forme otogène.</li><li>Fusobacterium necrophorum dans le syndrome de Lemierre.</li></ul></template>

<template data-pop="pareto-g08-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g08-p-1,g08-p-2,g08-p-3,g08-p-4"></p><ul><li>Énoxaparine puis dabigatran, hors indication des informations professionnelles.</li><li>Doses : 1 mg/kg deux fois par jour ; 150 mg deux fois par jour.</li><li>Éviter les anticoagulants oraux directs en phase aiguë, les corticoïdes, l’acétazolamide.</li></ul></template>
