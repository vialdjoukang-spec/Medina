<template data-pop="d71-sources" data-title="Sources, version et lacunes du cours"><h3>Sources lues</h3><p>Ce cours repose sur dix-neuf sources lues le 14.10.2026 : le texte de référence de la CIM-10-GM 2024 (BfArM), les travaux de l’école zurichoise (Seger 2002, 2008, 2010 et 2011 ; Güngör 2014 ; Reichenbach 2009), la cohorte européenne de 2009, la revue de la Charité de 2024, des revues sur le déficit d’adhésion leucocytaire (2012, 2022), l’article de Mauch sur le test à la dihydrorhodamine (2007), deux articles sur le déficit en myéloperoxydase (2020, 2026) et les informations professionnelles suisses de Bactrim forte®, d’Itraconazole Sandoz® eco et de Posaconazol Zentiva®.</p><h3>Lacunes déclarées</h3><ul><li>Aucune recommandation officielle suisse, ESID ou EHA n’a été retrouvée, et aucun critère diagnostique formel n’a été lu : les critères de l’îlot 14 sont opérationnels.</li><li>Aucune information professionnelle suisse n’a été retrouvée pour l’interféron γ.</li><li>La prophylaxie de la granulomatose septique chronique est hors indication dans les informations professionnelles suisses lues ; les doses adultes sont absentes.</li><li>La classification IUIS 2024 n’a pas été lue ; le codage de LAD-II et LAD-III n’est pas vérifié.</li><li>Les taux de colite divergent selon les sources.</li><li>L’explication causale de la règle des germes producteurs de catalase n’apparaît pas dans les sources lues.</li></ul><p>Audit différé : revue par intelligence artificielle, distincte d’une validation médicale humaine.</p></template>
<template data-pop="d71-nosologie" data-title="CIM-10-GM 2024 : D71 et ses limites"><h3>Le texte de référence</h3><p>La catégorie D71 de la CIM-10-GM 2024 n’a pas de sous-code. Son libellé est « Anomalies fonctionnelles des granulocytes neutrophiles ». Elle inclut la dysphagocytose congénitale, la granulomatose chronique de l’enfance, le défaut du complexe récepteur membranaire CR3 et la granulomatose septique progressive (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc D70-D77</a>).</p><h3>Les frontières</h3><p>Le syndrome de Chédiak-Higashi est codé E70.3 et exclu de D72.0. Le codage des types II et III du déficit d’adhésion leucocytaire n’a pas été vérifié dans la classification. Un code décrit une catégorie administrative ; il ne remplace ni le diagnostic ni la description du gène atteint.</p></template>
<template data-pop="d71-cgd-def" data-title="Granulomatose septique chronique : définition"><h3>Une maladie de la NADPH oxydase</h3><p>Il s’agit d’un groupe de déficits immunitaires héréditaires du complexe NADPH oxydase des phagocytes. Les cellules ne produisent plus d’espèces réactives de l’oxygène ; elles ne détruisent plus certaines bactéries et certains champignons, et l’inflammation s’emballe avec des granulomes dans les tissus (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Deux transmissions</h3><p>La transmission est liée à l’X (la plus fréquente) ou autosomique récessive (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>). Le nom français « granulomatose septique chronique » traduit <i>chronic granulomatous disease</i>, d’où l’abréviation CGD.</p></template>
<template data-pop="d71-lad" data-title="Déficit d’adhésion leucocytaire et intégrine β2"><h3>Le défaut</h3><p>Le LAD-I résulte de variants bialléliques du gène <i>ITGB2</i>, qui code CD18, sous-unité β2 commune à LFA-1 (CD11a/CD18), Mac-1 (CD11b/CD18, aussi appelé complexe récepteur CR3), p150,95 (CD11c/CD18) et CD11d/CD18 (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8998723/" target="_blank" rel="noopener">Fekadu et al., Int J Mol Sci 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a>). Sans CD18, aucune de ces intégrines n’est fonctionnelle.</p><h3>Pourquoi D71 inclut le « défaut du complexe CR3 »</h3><p>Mac-1 est le récepteur CR3. L’inclusion de D71 couvre donc le LAD-I. Le type II (fucosylation) et le type III (kindline-3) sont des maladies voisines dont le codage n’est pas vérifié.</p></template>
<template data-pop="d71-genes" data-title="Gènes de la granulomatose septique chronique"><h3>Sept gènes, un phénotype</h3><p>CYBB code gp91phox, ou NOX2, sous-unité catalytique liée à l’X. NCF1 code p47phox, CYBA p22phox, NCF2 p67phox, NCF4 p40phox et CYBC1 la protéine EROS, chaperon de gp91phox et de p22phox. Un variant dominant négatif de RAC2 donne un tableau proche du déficit d’adhésion avec flambée altérée (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Répartition</h3><p>Cohorte européenne : liée à l’X 67 %, autosomique récessive 33 % (p47phox 49 %, p22phox 16 %, p67phox 8 %, origine inconnue 27 % de cette fraction) (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>).</p></template>
<template data-pop="d71-residuel" data-title="Activité résiduelle et survie"><h3>Le résultat de Kuhns et al.</h3><p>L’activité résiduelle des espèces réactives de l’oxygène est un prédicteur indépendant de la survie. Elle est déterminée par la mutation, quel que soit le gène. Les patients p47phox et la plupart des faux-sens de gp91phox ont plus d’activité résiduelle, et les courbes de mortalité divergent après l’adolescence (<a href="https://doi.org/10.1056/NEJMoa1007097" target="_blank" rel="noopener">Kuhns et al., N Engl J Med 2010</a>).</p><h3>Conséquence</h3><p>Un DHR « très bas » et un DHR « partiellement conservé » n’ont pas le même pronostic : le gène et la mutation sont à nommer.</p></template>
<template data-pop="d71-flambee" data-title="Flambée respiratoire"><h3>Définition</h3><p>La flambée respiratoire est la production d’espèces réactives de l’oxygène par la NADPH oxydase du phagocyte. Le défaut de cette flambée est l’anomalie commune à tous les phagocytes de la granulomatose septique chronique (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Pourquoi on la mesure</h3><p>Le DHR et le NBT lisent la flambée, non le nombre de cellules : c’est la raison pour laquelle un hémogramme normal n’exclut pas la maladie.</p></template>
<template data-pop="d71-nadph-ox" data-title="NADPH oxydase : composants et rôle"><h3>Composants</h3><p>Le complexe comprend gp91phox (NOX2), qui est la sous-unité catalytique, p22phox qui la stabilise dans la membrane et ancre le complexe cytosolique, p47phox, p67phox et p40phox, ainsi que Rac. L’assemblage se fait au phagosome (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Fonction</h3><p>gp91phox transfère les électrons du NADPH par le FAD et deux hèmes jusqu’à l’oxygène, produisant l’anion superoxyde. C’est le point de départ de toutes les espèces réactives de l’oxygène.</p></template>
<template data-pop="d71-ros" data-title="Espèces réactives de l’oxygène"><h3>Les produits</h3><p>L’anion superoxyde, le peroxyde d’hydrogène (formé par la superoxyde dismutase) et l’acide hypochloreux (formé par la myéloperoxydase avec le chlore) sont les espèces réactives de l’oxygène du phagocyte (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Trois rôles</h3><p>Elles agissent sur le microbe, activent les protéases granulaires par le flux ionique qu’elles imposent, et sont nécessaires aux pièges extracellulaires et à l’activation du facteur Nrf2 (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p></template>
<template data-pop="d71-phagosome-proteases" data-title="Phagosome, flux ionique et protéases"><h3>Mécanisme</h3><p>Le transfert d’électrons dans le phagosome est compensé par des flux cationiques, notamment du potassium. La hausse de force ionique dissout la matrice protéoglycane qui lie l’élastase et la cathepsine G, et libère ces protéases sous forme active (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Dans la maladie</h3><p>Sans flambée, la matrice n’est pas dissoute et les protéases restent inactives : le neutrophile perd donc deux armes à la fois, l’oxydation et la protéolyse.</p></template>
<template data-pop="d71-net" data-title="Pièges extracellulaires des neutrophiles"><h3>Définition</h3><p>Les NET (de l’anglais <i>neutrophil extracellular traps</i>) sont des pièges extracellulaires produits par les neutrophiles. Leur formation exige des espèces réactives de l’oxygène (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Dans la maladie</h3><p>Les neutrophiles de la granulomatose septique chronique en sont déficitaires. La restauration des NET par thérapie génique a été associée, à Zurich, à la guérison d’une aspergillose réfractaire (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p></template>
<template data-pop="d71-inflammation" data-title="Pourquoi l’inflammation persiste"><h3>Trois défauts</h3><p>Les espèces réactives de l’oxygène sont nécessaires à l’activation du facteur anti-inflammatoire Nrf2. L’inflammasome des monocytes est plus actif, avec production accrue d’interleukine 1β. Les neutrophiles n’externalisent pas la phosphatidylsérine et les macrophages éliminent mal les cellules apoptotiques ; PPARγ est déficitaire (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Conséquence</h3><p>L’inflammation ne se résout pas : granulomes, colite, cystite et obstructions apparaissent même sans infection active (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p></template>
<template data-pop="d71-il1" data-title="Interleukine 1β et inflammasome"><h3>Le circuit</h3><p>L’inflammasome active la caspase 1, qui produit l’interleukine 1β. Les monocytes de la granulomatose en produisent davantage, surtout chez les patients qui ont une inflammation non infectieuse. L’antagoniste du récepteur de l’interleukine 1 réduit cette production (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p></template>
<template data-pop="d71-tnf" data-title="TNF-α et cellules géantes"><h3>Rôle</h3><p>La formation de cellules géantes multinucléées dépend du TNF-α. Les corticoïdes l’empêchent, ce qui favorise une phagocytose non inflammatoire des neutrophiles (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>). À l’inverse, les anti-TNF au long cours associés à des stéroïdes sont contre-indiqués par le risque infectieux.</p></template>
<template data-pop="d71-catalase" data-title="Germes producteurs de catalase : une règle approximative"><h3>Ce que disent les sources</h3><p>Reichenbach et al. décrivent des infections « surtout » dues à des organismes producteurs de catalase. L’explication causale de cette règle n’apparaît pas dans les sources lues du dossier (<a href="https://doi.org/10.1086/647945" target="_blank" rel="noopener">Reichenbach et al., Clin Infect Dis 2009</a>).</p><h3>La limite</h3><p><i>Actinomyces</i> ne produit pas de catalase, mais est un pathogène inattendu de la maladie (<a href="https://doi.org/10.1086/647945" target="_blank" rel="noopener">Reichenbach et al., Clin Infect Dis 2009</a>). La règle n’est donc pas absolue.</p></template>
<template data-pop="d71-actinomyces" data-title="Actinomyces dans la granulomatose septique chronique"><h3>Série zurichoise</h3><p>Dix patients ont présenté une infection à <i>Actinomyces</i>, avec fièvre et inflammation sans foyer évident, et un diagnostic retardé (<a href="https://doi.org/10.1086/647945" target="_blank" rel="noopener">Reichenbach et al., Clin Infect Dis 2009</a>).</p><h3>Conséquence</h3><p>Une fièvre prolongée, sans foyer et sans germe, ne doit pas faire exclure la maladie parce que le germe n’est pas un producteur de catalase.</p></template>
<template data-pop="d71-conductrices" data-title="Conductrices de la forme liée à l’X"><h3>Profil biologique</h3><p>Le DHR ou le NBT montre une mosaïque : en général 20 à 80 % de cellules oxydase-positives. Jusqu’à un tiers des formes liées à l’X sont des néomutations maternelles absentes des cellules somatiques de la mère (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Conduite proposée</h3><p>Une lyonisation défavorable donne un tableau partiel ou complet. Staudacher et von Bernuth proposent une prophylaxie antibactérienne si les espèces réactives de l’oxygène sont inférieures à 20 %, antifongique si elles sont inférieures à 5 % ; les infections bactériennes graves documentées sont inférieures à 10 % ; la flambée se réévalue tous les cinq ans environ (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p></template>
<template data-pop="d71-paillis" data-title="Pneumonie au paillis"><h3>Tableau</h3><p>Deux à trois jours après un épandage de paillis ou de feuilles moisies : fièvre, dyspnée, infiltrats interstitiels diffus, hypoxie (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Traitement</h3><p>Un antifongique et des corticoïdes (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p></template>
<template data-pop="d71-aspergillose" data-title="Aspergillose de la granulomatose septique chronique"><h3>Fréquence et gravité</h3><p>Le risque cumulé d’aspergillose est de 20 à 40 %. C’est la première cause de décès (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>). Dans la cohorte européenne, <i>Aspergillus</i> représente 26 % des isolats (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>).</p><h3>Sites et traitement</h3><p><i>Aspergillus</i> touche les poumons, le cerveau, les os et les cavités nasales. L’aspergillose pulmonaire invasive tire un bénéfice d’une adjonction initiale de stéroïdes (1 mg/kg/jour pendant 3 jours, puis décroissance) (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p></template>
<template data-pop="d71-bcgite" data-title="BCG et mycobactéries"><h3>Données</h3><p>La BCGite a touché 34 patients sur 429 (8 %), dont 65 % en France. Le BCG local sévère et la tuberculose pulmonaire non miliaire sont décrits surtout hors d’Europe (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a> ; <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Conduite</h3><p>Toutes les vaccinations de routine sont recommandées, sauf le BCG.</p></template>
<template data-pop="d71-colite" data-title="Colite : pourquoi les chiffres divergent"><h3>Trois chiffres</h3><p>Colite à 9 % dans la cohorte européenne (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>), colite granulomateuse chez environ un tiers des patients (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>), autoinflammation chez environ la moitié (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Lecture</h3><p>Les définitions et les époques diffèrent : la proportion de la revue de 2024 porte sur l’autoinflammation dans son ensemble, et non sur la seule colite. Les sources lues ne permettent pas d’aller plus loin ; la divergence est signalée comme dépendante de la définition et de l’époque.</p></template>
<template data-pop="d71-infections-recidivantes" data-title="Quand évoquer un défaut fonctionnel des neutrophiles"><h3>Signes d’appel</h3><p>Abcès et pneumonies récidivants à <i>S. aureus</i>, <i>Aspergillus</i>, <i>Serratia</i>, <i>Nocardia</i> ou <i>Burkholderia</i>, colite de type Crohn, abcès hépatique caséeux, avec des neutrophiles en nombre normal (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Contre-exemples</h3><p>Hyperleucocytose avec infections sans pus : LAD-I. Infections invasives avec protéine C réactive basse : déficits MyD88 ou IRAK4 (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a>).</p></template>
<template data-pop="d71-dhr" data-title="Dihydrorhodamine : principe et lecture"><h3>Principe</h3><p>Les neutrophiles chargés en dihydrorhodamine sont stimulés. Le peroxyde d’hydrogène produit oxyde la dihydrorhodamine en rhodamine 123, fluorescente, mesurée en cytométrie en flux (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Lecture</h3><p>Une fluorescence absente ou fortement réduite évoque la granulomatose septique chronique ; une mosaïque évoque une conductrice. Le test est objectif, quantitatif et plus sensible que le NBT. Il doit être répété au moins une fois avec deux stimuli (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Limite</h3><p>Le test dépend de la myéloperoxydase endogène : un déficit complet donne un résultat effondré (<a href="https://doi.org/10.1373/clinchem.2006.083444" target="_blank" rel="noopener">Mauch et al., Clin Chem 2007</a>).</p></template>
<template data-pop="d71-nbt" data-title="Nitrobleu de tétrazolium : principe et limites"><h3>Principe</h3><p>Le NBT est réduit en formazan bleu insoluble par les neutrophiles qui produisent du superoxyde. La lecture se fait au microscope (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Limites</h3><p>Le test est subjectif et peut manquer une forme variante, révélée par une coloration bleue pâle. Il reste utile quand les ressources sont limitées (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p></template>
<template data-pop="d71-pma" data-title="PMA et ligand du TLR4 : stimuli du test"><h3>Deux stimuli</h3><p>Les deux stimuli cités par les sources sont le PMA (phorbol myristate acétate) et un ligand du récepteur TLR4 (<i>E. coli</i>, lipopolysaccharide). Le test se répète au moins une fois avec deux stimuli (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Cas du p40phox</h3><p>Le déficit en p40phox, forme atténuée, se détecte au DHR avec <i>E. coli</i> opsonisé comme stimulus (<a href="https://doi.org/10.1007/s12016-020-08800-x" target="_blank" rel="noopener">Yu et al., Clin Rev Allergy Immunol 2021</a>).</p></template>
<template data-pop="d71-mpo-diff" data-title="Déficit en myéloperoxydase : l’imitation de laboratoire"><h3>Pourquoi le DHR est effondré</h3><p>Le test dépend de la myéloperoxydase endogène. Un déficit complet donne un signal effondré, donc un faux diagnostic possible de granulomatose septique chronique (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://doi.org/10.1373/clinchem.2006.083444" target="_blank" rel="noopener">Mauch et al., Clin Chem 2007</a>).</p><h3>Comment trancher</h3><p>Éosinophiles normaux ; signal rehaussé par l’ajout de myéloperoxydase recombinante ; chimiluminescence à la lucigénine augmentée (diminuée dans la granulomatose) (<a href="https://doi.org/10.1373/clinchem.2006.083444" target="_blank" rel="noopener">Mauch et al., Clin Chem 2007</a>). Seuls les neutrophiles sont touchés (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Épidémiologie</h3><p>Le déficit est décrit comme l’un des déficits phagocytaires héréditaires les plus fréquents (<a href="https://doi.org/10.1093/labmed/lmz060" target="_blank" rel="noopener">Roh et al., Lab Med 2020</a>) ; sur 11 608 patients dépistés, 282 présentaient une activité réduite, dont 12 déficits persistants (<a href="https://doi.org/10.1016/j.redox.2026.104386" target="_blank" rel="noopener">Ahdab et al., Redox Biol 2026</a>).</p></template>
<template data-pop="d71-faux-dhr" data-title="Médicaments et résultats du DHR"><h3>Ce que rapporte la revue de 2024</h3><p>Le paracétamol, le métamizole et la mésalazine sont cités comme sources de faux positifs (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Conduite</h3><p>Relire le traitement du patient avant de conclure, et répéter le test.</p></template>
<template data-pop="d71-hyperige" data-title="Syndrome hyper-IgE DN-STAT3"><h3>Ressemblance</h3><p>Abcès et pneumonies staphylococciques (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Distinction</h3><p>Candidose cutanéo-muqueuse, anomalies squelettiques, dermatite, pneumatocèles ; l’aspergillose invasive est extrêmement rare, alors qu’elle est la première cause de décès dans la granulomatose septique chronique (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p></template>
<template data-pop="d71-irak4" data-title="Déficits MyD88 et IRAK4"><h3>Tableau</h3><p>Infections invasives à pneumocoque, <i>S. aureus</i>, <i>Pseudomonas aeruginosa</i>, avec une protéine C réactive basse malgré l’infection (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p></template>
<template data-pop="d71-tb-diff" data-title="Tuberculose et granulomatose septique chronique"><h3>Lien</h3><p>La tuberculose disséminée ou difficile à traiter en zone d’endémie est un diagnostic différentiel. La granulomatose peut aussi se compliquer de BCG local sévère ou de tuberculose pulmonaire non miliaire, surtout hors d’Europe (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a> ; <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p></template>
<template data-pop="d71-pseudoneutropenie" data-title="Pseudo-neutropénie sur automate ADVIA"><h3>Mécanisme</h3><p>Dans le déficit en myéloperoxydase, l’automate compte les neutrophiles comme des monocytes. L’indice de peroxydase moyen est très bas (inférieur à −20), le résultat affiche une neutropénie avec monocytose (<a href="https://doi.org/10.1093/labmed/lmz060" target="_blank" rel="noopener">Roh et al., Lab Med 2020</a>).</p><h3>Vérification</h3><p>La formule manuelle est normale.</p></template>
<template data-pop="d71-voriconazole" data-title="Voriconazole dans la granulomatose septique chronique"><h3>Usage cité</h3><p>Ajouté au traitement de la pneumonie (enfant : 12 mg/kg/jour) ; recommandé en remplacement de l’itraconazole sous corticothérapie prolongée à haute dose (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Limite</h3><p>Aucune information professionnelle suisse du voriconazole n’a été lue pour ce cours : posologie adulte, contre-indications et surveillance doivent être relues dans l’information officielle avant prescription.</p></template>
<template data-pop="d71-interaction-cyp" data-title="Itraconazole, CYP3A4 et corticoïdes"><h3>Mécanisme</h3><p>L’itraconazole est un inhibiteur puissant du CYP3A4, enzyme qui élimine de nombreux corticoïdes ; leurs taux peuvent donc tripler (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Conduite</h3><p>Sous corticothérapie prolongée à haute dose, passer au voriconazole (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>). L’information professionnelle suisse demande la prudence avec la méthylprednisolone (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle Itraconazole Sandoz® eco, novembre 2024</a>).</p></template>
<template data-pop="d71-cotrimoxazole" data-title="Co-trimoxazole : données suisses et usage dans la maladie"><h3>Usage dans la maladie</h3><p>Prophylaxie à vie : 6 mg/kg/jour de triméthoprime chez l’enfant. Dans la pneumonie : double dose ; dans la nocardiose : 20 mg/kg/jour (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Information suisse (Bactrim forte®, mars 2023)</h3><p>Adulte : 1 comprimé toutes les 12 heures. Prophylaxie de la pneumonie à <i>Pneumocystis</i> : 1 comprimé forte 3 fois par semaine. Nocardiose : 3 à 4 comprimés forte par jour pendant au moins 3 mois. Pédiatrie (SwissPedDose) : 3 à 6 mg de triméthoprime/kg/dose, deux fois par jour, maximum 320 mg par jour.</p><h3>Précautions</h3><p>Contre-indications listées à l’îlot P-3. Surveiller la kaliémie et la fonction rénale ; hydrater pour limiter la cristallurie. La granulomatose septique chronique n’est pas mentionnée dans l’information : usage hors indication libellée (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle Bactrim forte®, mars 2023</a>).</p></template>
<template data-pop="d71-itraconazole" data-title="Itraconazole : données suisses et usage dans la maladie"><h3>Usage dans la maladie</h3><p>Prophylaxie à vie : 5 mg/kg/jour (solution buvable) chez l’enfant ; un essai randomisé contrôlé en double aveugle justifie son usage (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Information suisse (Itraconazole Sandoz® eco, novembre 2024)</h3><p>Capsules : aspergillose seulement en cas d’intolérance ou d’échec du traitement standard ; concentration d’au moins 0,5 µg/ml dans les mycoses invasives ; capsules et solution non bioéquivalentes. Contre-indiqué en cas d’insuffisance cardiaque (effet inotrope négatif), avec de nombreux substrats du CYP3A4, de la glycoprotéine P et de la BCRP, et en grossesse. Pédiatrie (SwissPedDose), prophylaxie par solution buvable : de 1 mois à 18 ans, 2,5 à 5 mg/kg/dose deux fois par jour, maximum 400 mg par jour ; dosage sanguin recommandé (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle Itraconazole Sandoz® eco, novembre 2024</a>).</p></template>
<template data-pop="d71-posaconazole" data-title="Posaconazole : données suisses et usage dans la maladie"><h3>Usage dans la maladie</h3><p>Traitement de sauvetage des mycoses invasives, y compris du système nerveux central, et prophylaxie selon les résistances locales (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Information suisse (Posaconazol Zentiva®, octobre 2025)</h3><p>Comprimés gastro-résistants : prévention chez les patients de 13 ans et plus à haut risque, 300 mg deux fois le premier jour puis 300 mg par jour ; dosage sanguin avec taux d’au moins 500 ng/ml ; risque d’allongement du QTc ; inhibiteur du CYP3A4 ; non conseillé avant 13 ans (<a href="https://amiko.oddb.org" target="_blank" rel="noopener">information professionnelle Posaconazol Zentiva®, octobre 2025</a>).</p></template>
<template data-pop="d71-ifn" data-title="Interféron γ dans la granulomatose septique chronique"><h3>Place</h3><p>Proposé par la plupart des médecins européens seulement dans des cas sélectionnés (variants d’épissage de CYBB). L’efficacité anti-aspergillaire n’est pas démontrée. Le traitement est coûteux : 2 × 50 µg/m² par semaine par voie sous-cutanée (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><h3>Tolérance et statut</h3><p>Fièvre et troubles mentaux sont des effets indésirables ; l’usage est plus fréquent en Amérique du Nord (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>). Aucune information professionnelle suisse n’a été retrouvée : le statut d’autorisation en Suisse n’est pas établi par ce cours. Dans la cohorte européenne, 33 % des patients en recevaient (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>).</p></template>
<template data-pop="d71-cortico" data-title="Corticoïdes dans la granulomatose septique chronique"><h3>Indications citées</h3><p>Pneumonie au paillis (avec antifongique) ; aspergillose pulmonaire invasive et nocardiose (1 mg/kg/jour pendant 3 jours, puis décroissance) ; abcès hépatique si la chirurgie est contre-indiquée (1 mg/kg/jour) ; cystite (0,5 à 1 mg/kg/jour la première semaine, décroissance sur six semaines) ; colite sévère (prednisone 1 mg/kg/jour puis décroissance sur plusieurs mois) (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Risque</h3><p>La dépendance aux corticoïdes est fréquente dans la colite, et le risque infectieux augmente. Les anti-TNF au long cours associés aux stéroïdes sont contre-indiqués.</p></template>
<template data-pop="d71-greffe" data-title="Allogreffe : données de la série zurichoise"><h3>Conditionnement d’intensité réduite</h3><p>Seize centres, dix pays, 56 patients (âge médian 12,7 ans ; 75 % à haut risque ; 45 % adolescents ou jeunes adultes). Fludarabine, sérothérapie et busulfan ciblé. Survie 93 %, survie sans événement 89 % ; à deux ans, 96 % et 91 %. Échec de greffe 5 %, maladie du greffon contre l’hôte aiguë de grade III-IV 4 %, chronique 7 % ; chimérisme myéloïde d’au moins 90 % chez 93 % (<a href="https://doi.org/10.1016/S0140-6736(13)62069-3" target="_blank" rel="noopener">Güngör et al., Lancet 2014</a>).</p><h3>Série plus ancienne</h3><p>Série européenne 1985-2000 : 27 greffes, 23 survivants, 22 guéris ; 18 sur 18 en l’absence d’infection au moment de la greffe (<a href="https://doi.org/10.1182/blood-2002-02-0583" target="_blank" rel="noopener">Seger et al., Blood 2002</a>).</p></template>
