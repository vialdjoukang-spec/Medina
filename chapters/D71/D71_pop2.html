<template data-pop="pareto-d71-clin" data-title="Pareto — Question clinique, nosologie, mécanismes, sémiologie"><p class="ratio" data-cover="d71-0,d71-1,d71-2,d71-3,d71-4,d71-5,d71-6"></p><ul><li>D71 n’a pas de sous-code ; son cœur est la <button class="w" data-k="d71-cgd-def">granulomatose septique chronique</button>, avec le <button class="w" data-k="d71-lad">LAD-I</button> pour second axe et le <button class="w" data-k="d71-mpo-diff">déficit en myéloperoxydase</button> comme imitation de laboratoire. Chédiak-Higashi relève de E70.3.</li><li>Prévalence 1/250 000 ; forme liée à l’X 67 à 70 % (<button class="w" data-k="d71-genes">CYBB</button>) ; diagnostic à 4,9 ans (X) ou 8,8 ans (autosomique récessive).</li><li>Un défaut de <button class="w" data-k="d71-nadph-ox">NADPH oxydase</button> supprime les <button class="w" data-k="d71-ros">espèces réactives de l’oxygène</button>, laisse les protéases inactives, supprime les <button class="w" data-k="d71-net">NET</button> et empêche la <button class="w" data-k="d71-inflammation">résolution de l’inflammation</button>.</li><li>Poumon 66 % ; <i>S. aureus</i> 30 %, <i>Aspergillus</i> 26 % ; aspergillose 20 à 40 %, première cause de décès. Colite et autoinflammation fréquentes.</li><li>LAD-I : chute tardive du cordon, hyperleucocytose, infections sans pus.</li></ul></template>
<template data-pop="pareto-d71-diag" data-title="Pareto — Diagnostic, différentiel et urgences"><p class="ratio" data-cover="d71-7,d71-8"></p><ul><li><button class="w" data-k="d71-dhr">DHR</button> en première intention, répété avec deux stimuli ; <button class="w" data-k="d71-nbt">NBT</button> en ressources limitées ; mutation en centre spécialisé.</li><li>Un DHR effondré impose d’exclure un <button class="w" data-k="d71-mpo-diff">déficit complet en myéloperoxydase</button> (éosinophiles, myéloperoxydase recombinante, lucigénine).</li><li>Différentiel : <button class="w" data-k="d71-hyperige">hyper-IgE</button>, <button class="w" data-k="d71-irak4">MyD88 et IRAK4</button>, Crohn, granulomatoses stériles, <button class="w" data-k="d71-tb-diff">tuberculose</button>, LAD.</li><li>Urgences : pneumonie (couvrir <i>S. aureus</i>, <i>Burkholderia</i>, <i>Serratia</i>, <i>Nocardia</i> et ajouter un antifongique), <button class="w" data-k="d71-paillis">paillis</button> (antifongique et corticoïde), abcès hépatique (drainage), granulocytes en dernier recours.</li></ul></template>
<template data-pop="pareto-d71-trait" data-title="Pareto — Prophylaxie, traitement, suivi et critères"><p class="ratio" data-cover="d71-9,d71-10,d71-11,d71-12,d71-13,d71-14"></p><ul><li>Éviter l’exposition aux spores ; toutes les vaccinations sauf BCG.</li><li>Prophylaxie à vie : <button class="w" data-k="d71-cotrimoxazole">co-trimoxazole</button> (6 mg/kg/jour de triméthoprime, enfant) et <button class="w" data-k="d71-itraconazole">itraconazole</button> (5 mg/kg/jour) ; usage hors indication libellée en Suisse ; doses adultes absentes.</li><li>Itraconazole et corticoïdes à haute dose : passer au <button class="w" data-k="d71-voriconazole">voriconazole</button>. Colite : sulfasalazine, prednisone, azathioprine, infliximab en induction ; pas d’anti-TNF au long cours avec stéroïdes.</li><li>Seule la <button class="w" data-k="d71-greffe">greffe</button> guérit : survie 93 % et survie sans événement 89 % après conditionnement d’intensité réduite.</li><li>Pronostic : survie médiane 30 à 40 ans sans greffe ; dépend du gène et de l’aspergillose.</li><li>Conductrices : mosaïque, prophylaxie si production inférieure à 20 % (bactéries) ou 5 % (moisissures).</li></ul></template>
<template data-pop="pareto-d71-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="d71-e-1,d71-e-2,d71-e-3,d71-e-4,d71-e-5"></p><ul><li>Test de première ligne : <button class="w" data-k="d71-dhr">DHR</button> avec deux stimuli ; référence : immunoblot et mutation en centre spécialisé.</li><li>Quatre pièges : <button class="w" data-k="d71-mpo-diff">déficit en myéloperoxydase</button>, <button class="w" data-k="d71-faux-dhr">médicaments</button>, <button class="w" data-k="d71-pseudoneutropenie">pseudo-neutropénie</button> sur automate, NBT subjectif.</li><li>LAD-I : CD18 en cytométrie ; classes inférieures à 5 %, 5 à 20 %, normale non fonctionnelle.</li><li>Infection : biopsie, PCR de l’ADN ribosomique, TEP/TDM ; colite : calprotectine fécale.</li></ul></template>
<template data-pop="pareto-d71-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="d71-p-1,d71-p-2,d71-p-3,d71-p-4,d71-p-5"></p><ul><li>Quatre fonctions : prévenir (<button class="w" data-k="d71-cotrimoxazole">co-trimoxazole</button>, <button class="w" data-k="d71-itraconazole">itraconazole</button>, <button class="w" data-k="d71-posaconazole">posaconazole</button>), traiter, moduler (<button class="w" data-k="d71-cortico">corticoïdes</button>), guérir (<button class="w" data-k="d71-greffe">greffe</button>).</li><li>Doses pédiatriques d’un centre expert ; données suisses datées ; pas de dose adulte de prophylaxie sourcée.</li><li><button class="w" data-k="d71-interaction-cyp">Itraconazole</button> triple les stéroïdes ; posaconazole allonge le QTc ; co-trimoxazole contre-indiqué avec le dofétilide.</li><li>À éviter : BCG, anti-TNF au long cours avec stéroïdes, granulocytes transfusés hors dernier recours, <button class="w" data-k="d71-ifn">interféron γ</button> hors cas sélectionnés.</li></ul></template>
<template data-pop="pareto-d71-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="d71-s-physio-body"></p><ul><li>Deux étapes : sortir du vaisseau (roulement, activation, adhésion par CD18, migration), puis tuer (<button class="w" data-k="d71-flambee">flambée respiratoire</button>).</li><li>LAD-II, LAD-III et LAD-I bloquent trois maillons de la première étape ; la granulomatose bloque la seconde.</li></ul></template>
<template data-pop="pareto-d71-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="d71-s-bioc-body"></p><ul><li>NADPH, gp91phox (FAD, deux hèmes), oxygène, superoxyde, peroxyde d’hydrogène, acide hypochloreux.</li><li>Sept gènes affectent la catalyse ou l’assemblage. Le <button class="w" data-k="d71-dhr">DHR</button> lit le peroxyde d’hydrogène par la myéloperoxydase.</li></ul></template>
<template data-pop="pareto-d71-s-cell" data-title="Pareto — Hématologie cellulaire"><p class="ratio" data-cover="d71-s-cell-body"></p><ul><li>Tous les phagocytes sont touchés dans la granulomatose ; seuls les neutrophiles dans le déficit en myéloperoxydase.</li><li>Protéases inactives, <button class="w" data-k="d71-net">NET</button> absents, phosphatidylsérine non externalisée : infection et granulomes.</li></ul></template>
<template data-pop="pareto-d71-s-gen" data-title="Pareto — Génétique"><p class="ratio" data-cover="d71-s-gen-body"></p><ul><li><button class="w" data-k="d71-genes">CYBB</button> liée à l’X (67 à 70 %), autres gènes autosomiques récessifs ; lyonisation chez les <button class="w" data-k="d71-conductrices">conductrices</button>.</li><li>L’<button class="w" data-k="d71-residuel">activité résiduelle</button> prédit la survie.</li></ul></template>
