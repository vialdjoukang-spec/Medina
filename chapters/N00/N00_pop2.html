<template data-pop="n00-cas-1" data-title="Cas 1 — La priorité est la menace respiratoire"><p><b>Question originale.</b> Une personne présente des urines sombres, une créatinine ascendante et une dyspnée nouvelle. Faut-il attendre la sérologie antistreptococcique avant d’orienter ?</p><p><b>Réponse raisonnée : non.</b> Évaluer immédiatement respiration, saturation, pression, état circulatoire, diurèse, potassium et fonction. La surcharge pulmonaire est une possibilité ; une hémorragie alvéolaire doit aussi être envisagée dans un contexte glomérulaire rapide. Une atteinte menaçante nécessite une prise en charge hospitalière urgente.</p><p>Les prélèvements de cause se poursuivent en parallèle. Une sérologie ne sécurise pas la respiration et son résultat ne doit pas devenir un préalable à l’orientation. Le raisonnement porte d’abord sur l’organe menacé, puis sur la cause qui déterminera le traitement spécifique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">EU-IRA — pp.253,265–269 ; définition, complications, soutien</a>.</p></template>
<template data-pop="n00-cas-2" data-title="Cas 2 — Des ANCA ne suffisent pas à décider"><p><b>Question originale.</b> Une personne avec hématurie glomérulaire, fièvre prolongée et souffle cardiaque a des ANCA positifs. Peut-on conclure à une vascularite primaire ?</p><p><b>Réponse raisonnée : pas sur ce résultat seul.</b> KDIGO rapporte des ANCA dans certaines glomérulonéphrites d’endocardite. Le contexte impose de rechercher une infection active : microbiologie, foyer et exploration cardiaque selon l’évaluation clinique. La biopsie peut aider à comprendre la lésion rénale.</p><p>Le piège serait une immunosuppression automatique fondée sur un test positif. La conduite correcte articule recherche infectieuse, évaluation rénale urgente et décision spécialisée ; elle ne consiste ni à ignorer la vascularite possible, ni à négliger l’infection.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-RPGN — pp.181–183 ; définition, tableau 7 et syndrome réno-pulmonaire</a>.</p></template>
<template data-pop="n00-cas-3" data-title="Cas 3 — Suivi du complément et dynamique rénale"><p><b>Question originale.</b> Le C3 reste bas après une hypothèse de glomérulonéphrite postinfectieuse. La créatinine augmente à nouveau. Faut-il attendre douze semaines avant de réévaluer ?</p><p><b>Réponse raisonnée : non.</b> La persistance d’un C3 bas au-delà de douze semaines est un repère pouvant conduire à une biopsie pour rechercher notamment une maladie du complément. Ce repère n’est pas un délai d’attente obligatoire. Une aggravation de fonction ou une présentation atypique justifie une réévaluation plus précoce.</p><p>Suivre conjointement fonction, pression, diurèse et protéinurie. Le complément apporte un indice sur la trajectoire immunologique, mais ne remplace pas les signes d’atteinte active ni les décisions urgentes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">CH-ORIENTATION — Figure 4, orientation néphrologique</a>.</p></template>
<template data-pop="n00-cas-4" data-title="Cas 4 — Deux calculs, deux questions"><p><b>Données fictives.</b> Un adulte de 70 kg émet 200 mL en 8 h ; son échantillon urinaire contient 1200 mg/L de protéines et 6 mmol/L de créatinine.</p><p><b>Diurèse.</b> Diviser le volume par le temps puis par le poids : 200 ÷ 8 = 25 mL/h ; 25 ÷ 70 ≈ 0,36 mL/kg/h. Ce résultat est inférieur à 0,5 mL/kg/h pendant une fenêtre de 8 h, si le recueil est fiable. Il répond à une question de fonction et de sévérité aiguë.</p><p><b>Protéinurie.</b>1200 ÷ 6 = 200 mg/mmol. Le rapport répond à une question de fuite protéique. Il ne donne pas le volume urinaire, et le premier calcul ne quantifie pas les protéines.</p><p><b>Interprétation.</b> Retenir le stade le plus sévère entre critères de créatinine et de diurèse, vérifier la fiabilité des mesures et rechercher la cause. Aucun de ces calculs ne remplace l’examen clinique ou le sédiment.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2016/10/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">INT-AKI — §2.1, tableau 2 ; extrait du fournisseur Parallel réellement lu</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a>.</p></template>
<template data-pop="pareto-n00-1" data-title="Point essentiel 1"><p>Le syndrome associe signes glomérulaires et retentissement aigu ; la cause reste à établir.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a>.</p></template>
<template data-pop="pareto-n00-2" data-title="Point essentiel 2"><p>Ne pas transposer un chiffre de cohorte, de microhématurie ou de progression rapide à tous les syndromes néphritiques suisses.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="pareto-n00-3" data-title="Point essentiel 3"><p>Lésion du filtre, baisse de filtration et rétention hydrosodée expliquent des signes différents.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-HISTO — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n00-4" data-title="Point essentiel 4"><p>Sécuriser, localiser, orienter la cause et suivre la dynamique ; mener ces tâches en parallèle si le patient est grave.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a>.</p></template>
<template data-pop="pareto-n00-5" data-title="Point essentiel 5"><p>La chronologie infectieuse et les signes extrarénaux orientent ; un scénario plausible n’est pas une preuve.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="pareto-n00-6" data-title="Point essentiel 6"><p>Décrire respiration, conscience, pression, poids, diurèse et indices de cause ; ne pas s’arrêter aux œdèmes.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/view/518997/4233572/RMS_419_480.pdf" rel="noopener" target="_blank">CH-URGENCE — pp.480–482 ; introduction, mécanismes, symptômes et diagnostic</a>.</p></template>
<template data-pop="pareto-n00-7" data-title="Point essentiel 7"><p>Néphritique, néphrotique, rapidement progressif et réno-pulmonaire peuvent se superposer.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">EU-SYNDROMES — pp.169–171, tableau 1</a>.</p></template>
<template data-pop="pareto-n00-8" data-title="Point essentiel 8"><p>Confirmer les hématies et leur origine ; comparer la créatinine à la base et décider de la biopsie selon le contexte.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2022-09/strategie_microhematurie.pdf" rel="noopener" target="_blank">CH-SEDIMENT — pp.1–4 ; définitions et algorithme</a>.</p></template>
<template data-pop="pareto-n00-9" data-title="Point essentiel 9"><p>Chaque examen répond à une question : gravité, localisation, mécanisme ou cause.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-GN-GENERAL — Points 1.1.1–1.1.3,1.2.1–1.2.8,1.3.1–1.3.2 ; pp.S30–S33</a>.</p></template>
<template data-pop="pareto-n00-10" data-title="Point essentiel 10"><p>Le complément oriente, les anticorps contextualisent ; une infection peut imiter une vascularite.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="pareto-n00-11" data-title="Point essentiel 11"><p>Soutenir les fonctions vitales, traiter la surcharge et la cause ; pas de corticothérapie universelle.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
<template data-pop="pareto-n00-12" data-title="Point essentiel 12"><p>Suivre fonction, pression, protéines et complément ; une aggravation n’attend pas le contrôle tardif.</p><p>Revenir à la section pour les critères, les limites de population et les éléments susceptibles de modifier cette première lecture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" rel="noopener" target="_blank">INT-INFECTION — Chapitre 7 pp. S172–S175 ; figures 56–57 visualisées, PDF pp.177 et 179</a>.</p></template>
