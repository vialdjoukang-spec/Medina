<template data-pop="n06-exp-1" data-title="1. Définition : un signe urinaire, puis une lésion à préciser"><p>La protéinurie est l’excrétion de protéines dans l’urine. L’adulte sain en excrète une petite quantité ; les références retenues situent la limite physiologique autour de 150 mg/j. L’albumine n’est qu’une partie de ces protéines : son excrétion habituelle est inférieure à 30 mg/j. Une anomalie peut porter sur la quantité et sur la nature des protéines.</p><p>Une présentation dite <b>isolée</b> signifie que la découverte de protéines n’est pas accompagnée d’un autre tableau rénal évident. Ce caractère doit être vérifié : pression, sédiment, fonction, albumine sanguine et examen clinique recherchent ce qui pourrait modifier cette qualification. Une personne asymptomatique peut avoir une albuminurie pathologique persistante et une maladie rénale avec filtration conservée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-1" data-title="Raisonnement essentiel — 1. Définition : un signe urinaire, puis une lésion à préciser"><p>Quantité, composition, persistance et contexte précèdent le code ; N06 ajoute une morphologie précisée.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a>.</p></template>
<template data-pop="n06-exp-2" data-title="2. Épidémiologie : distinguer dépistage, maladie et code"><p>Aucune incidence suisse directe N06 n’a été retenue dans les sources consultées. Le nombre de bandelettes positives dépend de l’âge, du dépistage, des circonstances de recueil et de la confirmation. Une première positivité n’a pas la même signification qu’une protéinurie persistante avec une lésion biopsique.</p><p>Le guide SGN 2025 estime qu’environ un adulte sur dix en Suisse présente une maladie rénale chronique. Ce chiffre ne mesure ni la protéinurie isolée ni N06. Les séries de biopsies décrivent des personnes sélectionnées pour cet examen ; elles ne représentent pas toutes les anomalies urinaires de la population.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a>.</p></template>
<template data-pop="pareto-n06-2" data-title="Raisonnement essentiel — 2. Épidémiologie : distinguer dépistage, maladie et code"><p>Aucune incidenceN06 directe ; le chiffre MRC global et les biopsies sélectionnées ne mesurent pas cette présentation.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a>.</p></template>
<template data-pop="n06-exp-3" data-title="3. Physiopathologie : filtre, réabsorption et surcharge"><p>Le filtre glomérulaire associe endothélium, membrane basale et podocytes. Il limite le passage des cellules et de nombreuses protéines ; le tubule proximal récupère une grande partie des protéines filtrées. L’urine finale contient aussi des protéines sécrétées, notamment l’uromoduline. Une excrétion physiologique ne correspond donc pas à une fuite pathologique d’albumine.</p><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule, barrière, tubules ; cortex, médulla, voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a>.</p></template>
<template data-pop="pareto-n06-3" data-title="Raisonnement essentiel — 3. Physiopathologie : filtre, réabsorption et surcharge"><p>Filtre, réabsorption et surcharge produisent des profils différents ; la composition aide à les distinguer.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a>.</p></template>
<template data-pop="n06-exp-4" data-title="4. Démarche clinique : confirmer sans perdre les signes d’alerte"><p><b>Vérifier la gravité.</b> Une dyspnée, une oligurie, une dégradation rapide de fonction, une hypertension avec retentissement ou des signes systémiques sortent du simple constat isolé. Un sédiment néphritique associé à une perte rapide de fonction impose un bilan accéléré. La répétition d’un prélèvement ne doit pas retarder cette démarche.</p><p><b>Confirmer la mesure.</b> Préciser produit de bandelette, recueil, effort, fièvre, infection, menstruations et contamination. Confirmer une positivité semi-quantitative par une mesure de laboratoire exprimée en rapport à la créatinine, avec analyte et unité visibles. Le premier prélèvement du matin à mi-jet est préféré pour comparer et confirmer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-4" data-title="Raisonnement essentiel — 4. Démarche clinique : confirmer sans perdre les signes d’alerte"><p>Vérifier la gravité, confirmer, caractériser puis établir la cause et le plan ; la répétition ne retarde pas une urgence.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a>.</p></template>
<template data-pop="n06-exp-5" data-title="5. Anamnèse : expliquer le résultat avant de nommer la maladie"><p>Le patient peut ne ressentir aucun symptôme. L’anamnèse ne consiste donc pas seulement à rechercher une plainte : elle restitue les conditions de mesure et la trajectoire. Une ancienne mention de « lésion minime » ou « sclérose » demande le compte rendu exact, sa date et les techniques utilisées ; une mémoire résumée ne remplace pas le tissu documenté.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-5" data-title="Raisonnement essentiel — 5. Anamnèse : expliquer le résultat avant de nommer la maladie"><p>Conditions de recueil, résultats datés, terrain, famille et produits pris sont des données diagnostiques.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="n06-exp-6" data-title="6. Examen clinique : éprouver le caractère isolé"><p>Mesurer la pression avec une méthode reproductible, rechercher œdèmes, variations pondérales, congestion et état d’hydratation. Une fonction dite normale dans le dossier ne dispense pas d’une mesure actuelle. Les signes de maladie systémique sont recherchés selon l’histoire : peau, articulations, manifestations infectieuses, respiratoires ou autres.</p><p>La présence d’une hypertension, d’une hématurie, d’une baisse de fonction ou d’une hypoalbuminémie change la synthèse. Il faut alors qualifier le syndrome réellement présent plutôt que maintenir « isolée » par habitude. Une absence d’œdèmes n’exclut ni une perte protéique importante ni une maladie rénale débutante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-6" data-title="Raisonnement essentiel — 6. Examen clinique : éprouver le caractère isolé"><p>Pression, sédiment, fonction et albumine éprouvent le caractère isolé ; toute anomalie associée requalifie le profil.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a>.</p></template>
<template data-pop="n06-exp-7" data-title="7. Syndromes et classifications : ne pas mélanger les seuils"><p>Les catégories de débit de la MRC sont G1 ≥ 90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29 et G5 &lt; 15 mL/min/1,73 m². Elles s’interprètent avec marqueurs et durée. Une albuminurie pathologique persistante peut établir une maladie avec un débit G1 ; l’absence de baisse de fonction ne prouve pas l’absence de dommage.</p><p>Le débit de protéines, leur composition et l’albuminémie décrivent encore des informations distinctes. Les seuils de consultation ou de biopsie ne sont pas automatiquement les mêmes que les seuils définissant normalité, catégorie de risque ou syndrome néphrotique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-7" data-title="Raisonnement essentiel — 7. Syndromes et classifications : ne pas mélanger les seuils"><p>Normalité, albuminurie, protéinurie clinique, syndrome néphrotique, MRC et morphologie sont des axes distincts.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a>.</p></template>
<template data-pop="n06-exp-8" data-title="8. Diagnostic positif : cinq questions de preuve"><p><b>Le résultat est-il réel ?</b> Confirmer une bandelette par une mesure quantitative ; vérifier dilution, recueil et facteurs transitoires. Une bandelette négative peut manquer une albuminurie modérée ou une protéinurie non albuminurique. Une valeur de concentration seule dépend de la dilution.</p><p><b>Quelle composition ?</b> L’ACR mesure l’albumine et le RPC les protéines totales. Un total élevé avec peu d’albumine fait rechercher notamment une composante tubulaire ou de surcharge, selon le contexte et les examens adaptés. Il ne faut ni banaliser cette discordance ni la nommer automatiquement glomérulaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
<template data-pop="pareto-n06-8" data-title="Raisonnement essentiel — 8. Diagnostic positif : cinq questions de preuve"><p>Confirmer le résultat, préciser la composition, durée, posture et anomalies associées, puis vérifier la preuve morphologique.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a>.</p></template>
