<template id="ch-N06"><div class="chap"><div class="chap-head"><div class="code">N06 · N-07-Néphrologie</div><h1>Protéinurie isolée avec lésions morphologiques précisées</h1><span class="status">Monographie pédagogique · Auto-relecture IA documentée · Sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button aria-controls="pA" aria-selected="true" data-p="pA" role="tab">⚕ Pathologie et prise en charge</button><button aria-controls="pE" aria-selected="false" data-p="pE" role="tab">🔬 Examens complémentaires</button><button aria-controls="pS" aria-selected="false" data-p="pS" role="tab">⚛ Sciences fondamentales spécialisées</button><button aria-controls="pP" aria-selected="false" data-p="pP" role="tab">💊 Pharmacologie</button></div><style>[data-n06-figure]{margin:1.2em 0;padding:1em;border:1px solid #b8c8d9;border-radius:12px;background:#fff}[data-n06-figure] [data-n06-frame]{position:relative;width:100%;max-width:850px;margin:auto;line-height:0}[data-n06-figure] [data-n06-frame="tall"]{max-width:420px}[data-n06-figure] img{display:block;width:100%;height:auto;margin:0}[data-n06-figure] [data-n06-mark]{position:absolute;transform:translate(-50%,-50%);background:#fff4be;color:#172f50;border:2px solid #172f50;border-radius:50%;width:1.6em;height:1.6em;display:flex;align-items:center;justify-content:center;font:bold 16px/1 sans-serif;box-shadow:0 0 0 2px #fff}[data-n06-figure] figcaption{line-height:1.6;margin-top:.8em;overflow-wrap:anywhere}[data-n06-figure] ol{padding-left:1.5em}[data-n06-figure] [data-n06-credit]{font-size:.85em}[data-n06-figure="podocytes"] [data-n06-mark="1"]{left:44%;top:21%}[data-n06-figure="podocytes"] [data-n06-mark="2"]{left:25%;top:57%}[data-n06-figure="podocytes"] [data-n06-mark="3"]{left:70%;top:83%}[data-n06-figure="nephron"] [data-n06-mark="1"]{left:33%;top:31%}[data-n06-figure="nephron"] [data-n06-mark="2"]{left:51%;top:61%}[data-n06-figure="nephron"] [data-n06-mark="3"]{left:75%;top:75%}[data-n06-figure="sediment"] [data-n06-mark="1"]{left:24%;top:19%}[data-n06-figure="sediment"] [data-n06-mark="2"]{left:74%;top:20%}[data-n06-figure="sediment"] [data-n06-mark="3"]{left:25%;top:71%}[data-n06-figure="sediment"] [data-n06-mark="4"]{left:77%;top:75%}[data-n06-figure="kidney"] [data-n06-mark="1"]{left:23%;top:39%}[data-n06-figure="kidney"] [data-n06-mark="2"]{left:46%;top:31%}[data-n06-figure="kidney"] [data-n06-mark="3"]{left:65%;top:61%}[data-n06-figure="kidney"] [data-n06-mark="4"]{left:87%;top:87%}[data-n06-figure="fsgs"] [data-n06-mark="1"]{left:55%;top:43%}[data-n06-figure="fsgs"] [data-n06-mark="2"]{left:74%;top:49%}[data-n06-figure="fsgs"] [data-n06-mark="3"]{left:23%;top:25%}[data-n06-figure="fsgs"] [data-n06-mark="4"]{left:39%;top:61%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#n06-1">Définition</a></li><li><a href="#n06-2">Épidémiologie</a></li><li><a href="#n06-3">Physiopathologie</a></li><li><a href="#n06-4">Démarche clinique</a></li><li><a href="#n06-5">Anamnèse</a></li><li><a href="#n06-6">Examen clinique</a></li><li><a href="#n06-7">Syndromes</a></li><li><a href="#n06-8">Diagnostic positif</a></li><li><a href="#n06-9">Explorations</a></li><li><a href="#n06-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#n06-11">Prise en charge</a></li><li><a href="#n06-12">Prévention, suivi et pronostic</a></li><li><a href="#n06-13">Points clés</a></li><li><a href="#n06-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="N06"><section class="ilot" id="n06-question"><h2>Des protéines dans l’urine, sans plainte : que faut-il vérifier ?</h2><p><b>Vignette fictive.</b> Une personne se sent en bonne santé. Une bandelette faite après une course montre des protéines ; un autre dossier mentionne une protéinurie persistante et une lésion segmentaire sur une ancienne biopsie. Ces observations appellent-elles la même décision ? Le mot « protéinurie » ne précise ni quantité, ni composition, ni durée, et une lésion ancienne ne dit pas tout de son activité actuelle.</p><p>Il faut confirmer une anomalie mesurée correctement, vérifier qu’elle est réellement isolée, puis établir son mécanisme et son risque. Une protéinurie transitoire après effort, une perte tubulaire de petites protéines et une atteinte glomérulaire ne se traitent pas de la même manière. Une absence de symptômes n’écarte pas une maladie.</p><div class="key"><b>À retenir.</b> Commencer par la mesure, puis relier quantité, composition, persistance et contexte à une décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a>.</p></section>
<section class="ilot" id="n06-1"><h2>1. Définition : un signe urinaire, puis une lésion à préciser</h2><p>La protéinurie est l’excrétion de protéines dans l’urine. L’adulte sain en excrète une petite quantité ; les références retenues situent la limite physiologique autour de 150 mg/j. L’albumine n’est qu’une partie de ces protéines : son excrétion habituelle est inférieure à 30 mg/j. Une anomalie peut porter sur la quantité et sur la nature des protéines.</p><p>Une présentation dite <b>isolée</b> signifie que la découverte de protéines n’est pas accompagnée d’un autre tableau rénal évident. Ce caractère doit être vérifié : pression, sédiment, fonction, albumine sanguine et examen clinique recherchent ce qui pourrait modifier cette qualification. Une personne asymptomatique peut avoir une albuminurie pathologique persistante et une maladie rénale avec filtration conservée.</p><p>L’intitulé suisse N06 ajoute une condition : <b>des lésions morphologiques précisées</b>. Une protéinurie isolée sans autre indication n’est pas automatiquement N06. La nomenclature distingue notammentR80 pour protéinurie SAI/isolée SAI ou de Bence Jones, N39.1 pour persistante SAI, N39.2 pour orthostatique SAI etO12.1 pour gestationnelle. Le diagnostic clinique et la documentation du tissu précèdent le choix du code.</p><p>Une morphologie ne nomme pas toujours la cause. Segmentaire, focale, membranoproliférative ou autre décrit une lésion ou une distribution ; il faut encore comprendre son mécanisme, son activité et sa conséquence pour le patient.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML classe N06 etmodificateurS14N00_4 relus pour N06</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p><button class="w" data-k="n06-exp-1">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-1">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-2"><h2>2. Épidémiologie : distinguer dépistage, maladie et code</h2><p>Aucune incidence suisse directe N06 n’a été retenue dans les sources consultées. Le nombre de bandelettes positives dépend de l’âge, du dépistage, des circonstances de recueil et de la confirmation. Une première positivité n’a pas la même signification qu’une protéinurie persistante avec une lésion biopsique.</p><p>Le guide SGN 2025 estime qu’environ un adulte sur dix en Suisse présente une maladie rénale chronique. Ce chiffre ne mesure ni la protéinurie isolée ni N06. Les séries de biopsies décrivent des personnes sélectionnées pour cet examen ; elles ne représentent pas toutes les anomalies urinaires de la population.</p><p>Le CUEN décrit la protéinurie orthostatique surtout à la période pubertaire. Cette orientation d’âge aide à choisir un prélèvement ; elle ne permet pas de conclure à la bénignité d’une protéinurie persistante chez un jeune sans vérifier le profil. Les maladies associées, le terrain familial, les médicaments et la trajectoire changent la probabilité des causes. Aucune fréquence individuelle d’un signe n’est inventée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a>.</p><p><button class="w" data-k="n06-exp-2">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-2">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-3"><h2>3. Physiopathologie : filtre, réabsorption et surcharge</h2><p>Le filtre glomérulaire associe endothélium, membrane basale et podocytes. Il limite le passage des cellules et de nombreuses protéines ; le tubule proximal récupère une grande partie des protéines filtrées. L’urine finale contient aussi des protéines sécrétées, notamment l’uromoduline. Une excrétion physiologique ne correspond donc pas à une fuite pathologique d’albumine.</p><figure data-n06-figure="podocytes"><div data-n06-frame="wide"><img alt="Illustration humaine historique des podocytes et de leurs pédicelles autour d’un capillaire glomérulaire" loading="lazy" src="assets/img/n06/alpha/codex/2613_Podocytes.jpg"/><span aria-hidden="true" data-n06-mark="1">1</span><span aria-hidden="true" data-n06-mark="2">2</span><span aria-hidden="true" data-n06-mark="3">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Corps d’un podocyte dans le détail de gauche.</li><li>Pédicelles entrelacés : organisation du versant externe du filtre.</li><li>Capillaire dans la représentation de droite.</li></ol><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p data-n06-credit="">OpenStax College, Anatomy &amp; Physiology, 2013 · <a href="https://commons.wikimedia.org/wiki/File:2613_Podocytes.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by/3.0/" rel="noopener" target="_blank">CC BY 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p>Une atteinte glomérulaire augmente le passage de protéines plasmatiques, souvent à prédominance albuminurique. Une atteinte tubulaire diminue la réabsorption de protéines de faible poids moléculaire. Une protéinurie de surcharge apparaît lorsque des protéines circulantes abondantes dépassent les capacités de réabsorption, par exemple des chaînes légères d’immunoglobulines ou de la myoglobine. Ces mécanismes peuvent se combiner ; la présence d’albumine n’exclut pas toute participation tubulaire.</p><p>La composition donne ainsi une information que la bandelette ou le total ne fournissent pas seuls. Une protéinurie peut aussi être transitoire dans un contexte d’effort, de fièvre ou de variation hémodynamique. La confirmation et les anomalies associées évitent de confondre cette situation avec une maladie persistante.</p><p>Les protéines filtrées en excès peuvent participer à une réponse tubulo-interstitielle inflammatoire et à la fibrose ; elles sont aussi un marqueur de lésion et de risque. Diminuer une protéinurie ne prouve toutefois pas que toute cause ou toute cicatrice ait disparu. L’original PAS ci-dessous montre une lésion attribuée par sa provenance à une variante hilaire de sclérose segmentaire et focale ; il n’établit ni cause primitive ni indication de corticoïdes.</p><figure data-n06-figure="fsgs"><div data-n06-frame="wide"><img alt="Microphotographie humaine PAS d’une lésion de sclérose segmentaire et focale, variante hilaire selon la provenance" loading="lazy" src="assets/img/n06/alpha/codex/Focal_segmental_glomerulosclerosis_-_high_mag.jpg"/><span aria-hidden="true" data-n06-mark="1">1</span><span aria-hidden="true" data-n06-mark="2">2</span><span aria-hidden="true" data-n06-mark="3">3</span><span aria-hidden="true" data-n06-mark="4">4</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Peloton capillaire du glomérule central : repère du compartiment glomérulaire.</li><li>Région plus dense à droite du glomérule ; la source attribue le champ à une variante hilaire de sclérose segmentaire et focale.</li><li>Tubules voisins : compartiment distinct du glomérule central.</li><li>Limite externe du glomérule et espace périphérique : repère topographique.</li></ol><p>Un champ PAS ne détermine ni proportion de glomérules lésés, ni cause primaire/secondaire/génétique, ni indication d’immunosuppression. La lésion illustrée n’est pas une preuve d’un diagnostic N06 chez un patient donné.</p><p data-n06-credit="">Nephron · <a href="https://commons.wikimedia.org/wiki/File:Focal_segmental_glomerulosclerosis_-_high_mag.jpg" rel="noopener" target="_blank">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0" rel="noopener" target="_blank">CC BY-SA 3.0</a>. Original inchangé ; repères et légende ajoutés en HTML par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule, barrière, tubules ; cortex, médulla, voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-330/proteinurie-rappel-physiologique-et-applications-pratiques" rel="noopener" target="_blank">RMS 2012;8:466–472, revuesuissephysiologie — Rappeldephysiologie, tubuleproximal, déterminationdeprotéinurie</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p><p><button class="w" data-k="n06-exp-3">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-3">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-4"><h2>4. Démarche clinique : confirmer sans perdre les signes d’alerte</h2><p><b>Vérifier la gravité.</b> Une dyspnée, une oligurie, une dégradation rapide de fonction, une hypertension avec retentissement ou des signes systémiques sortent du simple constat isolé. Un sédiment néphritique associé à une perte rapide de fonction impose un bilan accéléré. La répétition d’un prélèvement ne doit pas retarder cette démarche.</p><p><b>Confirmer la mesure.</b> Préciser produit de bandelette, recueil, effort, fièvre, infection, menstruations et contamination. Confirmer une positivité semi-quantitative par une mesure de laboratoire exprimée en rapport à la créatinine, avec analyte et unité visibles. Le premier prélèvement du matin à mi-jet est préféré pour comparer et confirmer.</p><p><b>Caractériser.</b> Confronter albumine et protéines totales, sédiment, pression et fonction rénale. Rechercher une dépendance posturale lorsque le contexte s’y prête ; ne pas appeler orthostatique toute protéinurie d’un adolescent. La persistance doit être documentée sur des contrôles appropriés.</p><p><b>Établir cause et plan.</b> Examiner le terrain, les examens antérieurs et l’éventuel compte rendu de biopsie. Le néphrologue choisit les investigations susceptibles de changer le traitement. Le suivi doit préciser qui contrôle, à quel délai et quels signes nécessitent un contact anticipé.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, fichemédecinsnon datée — Wann sollte eineProteinurie/Albuminurie nephrologischabgeklärtwerden</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p><p><button class="w" data-k="n06-exp-4">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-4">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-5"><h2>5. Anamnèse : expliquer le résultat avant de nommer la maladie</h2><table class="t"><thead><tr><th>Domaine</th><th>Questions</th><th>Conséquence</th></tr></thead><tbody><tr><td>Recueil</td><td>Heure, posture, effort, fièvre, menstruations, infection, qualité de collecte</td><td>Chercher une variation transitoire ou une contamination.</td></tr><tr><td>Chronologie</td><td>Résultats normaux ou anormaux datés, répétitions, ancienne biopsie</td><td>Prouver persistance et évolution ; ne pas supposer une durée.</td></tr><tr><td>Signes urinaires</td><td>Sang visible, dysurie, diurèse, urine mousseuse</td><td>La mousse ne quantifie pas ; sang et symptômes réorientent le bilan.</td></tr><tr><td>Retentissement</td><td>Œdèmes, poids, dyspnée, symptômes tensionnels</td><td>Vérifier que la présentation soit encore isolée.</td></tr><tr><td>Terrain</td><td>Diabète, hypertension, maladie systémique, infection ou gammapathie connue</td><td>Orienter la cause sans attribution automatique.</td></tr><tr><td>Famille</td><td>Protéinurie, hématurie, insuffisance rénale, audition et yeux</td><td>Discuter une maladie génétique et une atteinte associée.</td></tr><tr><td>Médicaments</td><td>AINS, traitements récents, produits naturels, compléments et observance</td><td>Chercher toxicité, interaction et modification fonctionnelle.</td></tr><tr><td>Population</td><td>Croissance, grossesse/projet, fragilité, masse musculaire, alimentation</td><td>Adapter références, estimation et sécurité des traitements.</td></tr></tbody></table><p>Le patient peut ne ressentir aucun symptôme. L’anamnèse ne consiste donc pas seulement à rechercher une plainte : elle restitue les conditions de mesure et la trajectoire. Une ancienne mention de « lésion minime » ou « sclérose » demande le compte rendu exact, sa date et les techniques utilisées ; une mémoire résumée ne remplace pas le tissu documenté.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p><button class="w" data-k="n06-exp-5">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-5">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-6"><h2>6. Examen clinique : éprouver le caractère isolé</h2><p>Mesurer la pression avec une méthode reproductible, rechercher œdèmes, variations pondérales, congestion et état d’hydratation. Une fonction dite normale dans le dossier ne dispense pas d’une mesure actuelle. Les signes de maladie systémique sont recherchés selon l’histoire : peau, articulations, manifestations infectieuses, respiratoires ou autres.</p><p>La présence d’une hypertension, d’une hématurie, d’une baisse de fonction ou d’une hypoalbuminémie change la synthèse. Il faut alors qualifier le syndrome réellement présent plutôt que maintenir « isolée » par habitude. Une absence d’œdèmes n’exclut ni une perte protéique importante ni une maladie rénale débutante.</p><p>Chez l’enfant, croissance et pression demandent des références pédiatriques. Chez la personne âgée ou sarcopénique, masse musculaire, nutrition et fragilité influencent l’interprétation de la créatinine et des rapports urinaires. L’examen vérifie également la tolérance des traitements déjà pris.</p><p>Une cible tensionnelle est un objectif thérapeutique dans un cadre défini, non un critère de N06. Si une MRC est établie, la SGN2025 propose une systolique 120–129mmHg individualisée ; la différence avec KDIGO &lt; 120 en mesure standardisée est attribuée. Aucun antihypertenseur n’est choisi sur le seul nom du code.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024, reprispar SGN2025 — §1.3.1, ppS152–153, table 16 ; pédiatrie§1.3.1.4</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a>.</p><p><button class="w" data-k="n06-exp-6">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-6">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
<section class="ilot" id="n06-7"><h2>7. Syndromes et classifications : ne pas mélanger les seuils</h2><table class="t"><thead><tr><th>Dimension</th><th>Repères</th><th>Limite</th></tr></thead><tbody><tr><td>Protéines physiologiques</td><td>Adulte : environ 100–150 mg/j</td><td>Toutes les protéines ne sont pas de l’albumine.</td></tr><tr><td>Albuminurie</td><td>A1 &lt; 30, A2 30–300, A3 &gt; 300 mg/g ; bornes approximatives 3/30 mg/mmol</td><td>Un rapport n’est pas une collecte 24 h mesurée.</td></tr><tr><td>Protéinurie clinique</td><td>CUEN :&gt; 500 mg/j ou &gt; 500 mg/g comme repère</td><td>Différent de la limite physiologique 150 mg/j.</td></tr><tr><td>Persistance/posture</td><td>Transitoire, orthostatique ou permanente</td><td>À démontrer ; âge ou absence de plainte insuffisants.</td></tr><tr><td>Syndrome néphrotique</td><td>CUEN adulte : protéines &gt; 3 g/j ou g/g et albumine &lt; 30 g/L</td><td>Thurgau utilise 3,5 g/j pour protéinurie néphrotique ; référentiels attribués.</td></tr><tr><td>MRC</td><td>Anomalie ≥ 3 mois ; cause, catégorie G et albuminurie A</td><td>G1/G2 sans marqueur de dommage ne suffisent pas.</td></tr><tr><td>Morphologie</td><td>Distribution, lésion, dépôts, activité et fibrose</td><td>Pas une étiologie ou une prescription complète.</td></tr></tbody></table><p>Les catégories de débit de la MRC sont G1 ≥ 90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29 et G5 &lt; 15 mL/min/1,73 m². Elles s’interprètent avec marqueurs et durée. Une albuminurie pathologique persistante peut établir une maladie avec un débit G1 ; l’absence de baisse de fonction ne prouve pas l’absence de dommage.</p><p>Le débit de protéines, leur composition et l’albuminémie décrivent encore des informations distinctes. Les seuils de consultation ou de biopsie ne sont pas automatiquement les mêmes que les seuils définissant normalité, catégorie de risque ou syndrome néphrotique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.stgag.ch/fachbereiche/kliniken-fuer-innere-medizin/klinik-fuer-innere-medizin-am-kantonsspital-frauenfeld/nephrologie/informationen-fuer-aerzte-und-zuweiser/proteinurie" rel="noopener" target="_blank">SpitalThurgau, KantonsspitalFrauenfeld, fichemédecinsnon datée — DasWichtigste, formes, méthodes, classification</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 131–132, table 1, analysesquantitative/qualitative</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap8-proteiurie-et-syndrome-nephrotique.pdf" rel="noopener" target="_blank">CUEN 12e 2025, ch 8 — pp 132–134, protéinuriestransitoires/permanentes etfigure 1</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p><p><button class="w" data-k="n06-exp-7">Comprendre le raisonnement</button></p><button class="pareto-btn ui" data-k="pareto-n06-7">▲ Loi de Pareto — Le raisonnement essentiel</button></section>
