<section class="ilot" id="k90-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 32 ans consulte pour une fatigue, des ballonnements après les repas et une <button class="w" data-k="k90-fer">carence en fer</button> qui récidive malgré les comprimés ; elle a une thyroïdite de Hashimoto. <b>La question est donc de savoir s’il faut chercher une <button class="w" data-k="k90-mc">maladie cœliaque</button>, avec quel test, et à quelles conditions le résultat est interprétable.</b></p><p>Pour y répondre, le médecin doit savoir : reconnaître les situations où le test s’impose ; demander les <button class="w" data-k="k90-tg2">IgA anti-transglutaminase</button> avec les IgA totales, pendant que la patiente mange du gluten ; ensuite, confirmer par des biopsies duodénales ou, chez certains adultes, par la stratégie <button class="w" data-k="k90-sansbiopsie">sans biopsie</button> ; enfin, conduire le <button class="w" data-k="k90-rsg">régime sans gluten</button> à vie, le suivi, et reconnaître la maladie réfractaire.</p><p><i>Pourquoi ce cas ?</i> En effet, la maladie cœliaque de l’adulte se présente rarement par une diarrhée franche ; ainsi, elle se cache derrière une anémie, une fatigue ou une maladie auto-immune. Par conséquent, contrairement à un manuel figé qui liste des symptômes, ce cours relie chaque signe à son mécanisme, et chaque mot vert ouvre le seuil exact ou l’image histologique, si bien que la décision peut être refaite pas à pas.</p><div class="key"><b>Point de départ.</b> Carence en fer inexpliquée + ballonnements + auto-immunité : penser maladie cœliaque → IgA anti-TG2 + IgA totales sous gluten → confirmation → régime sans gluten à vie.</div></section>
<section class="ilot" id="k90-1"><h2><span class="n">1</span>Définitions et épidémiologie</h2><p>La <button class="w" data-k="k90-malabs">malabsorption intestinale</button> désigne un défaut d’absorption des nutriments par l’intestin ; or, ses causes sont multiples : atteinte de la muqueuse (<button class="w" data-k="k90-mc">maladie cœliaque</button>), défaut de digestion (stéatorrhée pancréatique), intolérance (par exemple au lactose), prolifération bactérienne dans une anse borgne, ou sprue tropicale. Parmi elles, la maladie cœliaque est une entéropathie auto-immune déclenchée par le gluten chez des sujets génétiquement prédisposés, porteurs de <button class="w" data-k="k90-hla">HLA-DQ2 ou HLA-DQ8</button> (ESsCD 2025).</p><p>Par ailleurs, elle est fréquente. En effet, dans les pays occidentaux, sa prévalence est d’environ 0,7 % lorsqu’elle est confirmée par l’histologie, et de 1 à 1,6 % dans les dépistages sérologiques de la population générale ; de plus, depuis 2000, elle est la plus élevée en Europe du Nord (1,60 %) et la plus basse en Europe de l’Ouest (0,60 %). Cependant, une grande partie des cas reste non diagnostiquée ; ainsi, historiquement, plus de 70 % des diagnostics étaient posés après 20 ans (ESsCD 2025).</p><div class="key"><b>À retenir.</b> La malabsorption vient de la muqueuse, de la digestion, d’une intolérance, d’une anse borgne ou d’une sprue tropicale. La maladie cœliaque est une entéropathie auto-immune au gluten chez les porteurs de HLA-DQ2/DQ8 ; elle touche environ 0,7 % (histologie) à 1-1,6 % (sérologie) de la population et reste souvent méconnue.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12704582/" target="_blank" rel="noopener">Al-Toma A. et al., European Society for the Study of Coeliac Disease 2025 updated guidelines on the diagnosis and management of coeliac disease in adults. Part 1: diagnostic approach, United European Gastroenterol J 2025</a>.</p></section>
<section class="ilot" id="k90-2"><h2><span class="n">2</span>Physiopathologie : du gluten à l’atrophie villositaire</h2><p>Le gluten contient des peptides de gliadine que la digestion ne dégrade pas complètement ; ainsi, ils traversent l’épithélium et sont modifiés par la transglutaminase tissulaire de type 2 (TG2). Ensuite, ces fragments sont présentés, de façon dépendante de <button class="w" data-k="k90-hla">HLA-DQ2</button> ou HLA-DQ8, à des lymphocytes T spécifiques de la gliadine ; par conséquent, une réaction inflammatoire se déclenche dans le grêle et aboutit à l’<button class="w" data-k="k90-atrophie">atrophie villositaire</button> et à la <button class="w" data-k="k90-malabs">malabsorption</button> (ESsCD 2025).</p><p>De plus, cette réaction produit des anticorps contre la TG2 elle-même : c’est pourquoi les <button class="w" data-k="k90-tg2">IgA anti-TG2</button> sont le marqueur diagnostique. Or, ils dépendent de l’exposition au gluten ; en effet, ils se normalisent habituellement sous <button class="w" data-k="k90-rsg">régime sans gluten</button>, ce qui explique qu’un test fait après l’arrêt du gluten puisse être faussement négatif. Enfin, l’atrophie réduit la surface d’absorption, surtout dans le duodénum et le jéjunum proximal ; ainsi, le fer, absorbé dans le duodénum, manque tôt, d’où l’anémie ferriprive comme mode de révélation fréquent.</p><figure><img src="data:image/gif;base64,R0lGODdhCALNAYUAAP////7++Pj++vzw8/Dq6PLX6O/U0O7Fzuu3xeqxrNbDydOzvM+rs9+hrM2fruGbk82Zk8Ccr8CYkq2Xo82KjLmJkM15dLd6fqyHmqyDf6t2g6twbJuBmJt8eJlufJlrZYpxfHlseaFcWn9cZGlacmlWVX1HSGFFTVVBS0ZDUkA3RD8tNikqNioeKCEPGAcJFQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAACALNAUAI/wABCBxIsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatzIsaPHjyBDihxJsqTJkyhTqlzJsqXLlzBjypxJs6bNmzhz6tzJs6fPn0CDCh1KdGOAAEWTKl3KtKnTiAKiCghAwECCB1gpWNBqoavXrw8ODAgQFYDUsk/Tql3Lti3BqQZEiNgwV8SHDXg/mFiBQsQFCxcoCKZAV4QJuXLpbojAQIKEAwAGDBAAgCqBsUelKqVs1q3nz0GPIq1ccjRps1JFZ9Y8VjKBBFe1XoDwoEECCBc2BK6g18QHDyeC nt of coeliac disease in adults. Part 1: diagnostic approach, United European Gastroenterol J 2025</a>.</p></section>
<section class="ilot" id="k90-3"><h2><span class="n">3</span>Qui tester ? Présentation clinique</h2><p>La présentation est très variée ; c’est pourquoi l’ESsCD liste les situations où il faut tester. Ainsi, les signes évocateurs sont la diarrhée chronique non sanglante, la stéatorrhée, la perte de poids inexpliquée, la carence martiale chronique et l’anémie inexpliquée, les ballonnements postprandiaux, la dyspepsie, les douleurs abdominales récidivantes et la constipation. De plus, des troubles associés justifient le test : le syndrome de l’intestin irritable, la colite microscopique, l’élévation inexpliquée des transaminases, le diabète de type 1, la thyroïdite de Hashimoto, l’ataxie ou la neuropathie inexpliquées, la <button class="w" data-k="k90-dh">dermatite herpétiforme</button>, l’ostéoporose précoce et l’infertilité avec fausses couches répétées.</p><p>Par ailleurs, certains sujets asymptomatiques doivent être dépistés : les apparentés au premier degré d’un malade, ainsi que les personnes atteintes d’un syndrome de Down, de Turner ou de Williams (ESsCD 2025). En effet, le test se justifie lorsque la prévalence de la maladie non diagnostiquée atteint au moins 2 à 2,5 %, seuil retenu pour des raisons de rapport coût-efficacité.</p><figure><img src="data:image/gif;base64,R0lGODdhKgEiAYUAALqfiLWZgraWf66Vf7aRe6+ReauReraLda+Lc6uNdquJcaeMdqaJcqOIcrKCa6uBaqeEbKd9ZqGFbqGCaqF9Zp2CbJx+ZpZ+aJt6YpN5Y6ZxWpxyXZdzW5J1YJN0WpJtV41yXI1uVoZvWItqVIpnUYFoUpVgS4lhTINhTH1iTXxcSXVdR3tTQWRNPFI8LyUdFgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAKgEiAUAI/wBbCBy4gsUKFSpWHESYQkWKhw9LSJw4AgSIEiJWlAgxgkQIECE6YOhwoUKGDhkygASRoYJLCxcuZLjAgEGFmBUkNGDQQIJPnw0WBE0goeWCBAsMMEhgYIFNlzl11vRZwUKFpQaQ3rTQsySDrEcTTK3Q02pPoDwl5MxpYebVBU4bNDAZIoNVnDdTloSZMmWHvydZopT516LhwoYtipAoorHjxhMhPlS4MCHlywoHat4s0IXnz6BDvxhNurTp06hHX0aIebVDiiJAPByxODaIvx5GoBjxgQSJDxQoYMDw4QOHDRQmUOCAIXhwCBCew9XZM+3NBgYGBAC7QO0C7QMMqP+VC1duVZcMBgz4Ohdpz6FI1Za80CDAALHsJWBNkCAA/wUVJBUeXE311BRcQqkFlUs/9bTgT1Qt une face d’extension. <small>Image : L. Weinstock, T. Myers, M. Steinhoff, J. Smith, Wikimedia Commons, licence CC BY 4.0 (<a href="https://commons.wikimedia.org/wiki/File:Dermatitis_herpetiformis.jpg" target="_blank" rel="noopener">source</a>), adaptée en GIF.</small></figcaption></figure><p><i>Que montre l’image ?</i> Les lésions sont groupées en bouquet et souvent excoriées, car elles démangent intensément ; or, elles sont la manifestation cutanée de la même intolérance au gluten. Ainsi, une dermatite herpétiforme impose de chercher la <button class="w" data-k="k90-mc">maladie cœliaque</button>, même sans aucun symptôme digestif.</p><div class="key"><b>À retenir.</b> Tester : diarrhée, perte de poids, <button class="w" data-k="k90-fer">carence en fer</button>, ballonnements, transaminases, auto-immunité (diabète de type 1, Hashimoto), dermatite herpétiforme, ostéoporose précoce ; dépister : apparentés au premier degré, Down, Turner, Williams.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12704582/" target="_blank" rel="noopener">Al-Toma A. et al., European Society for the Study of Coeliac Disease 2025 updated guidelines on the diagnosis and management of coeliac disease in adults. Part 1: diagnostic approach, United European Gastroenterol J 2025</a>.</p></section>
<section class="ilot" id="k90-4"><h2><span class="n">4</span>Sérologie : le bon test dans les bonnes conditions</h2><p>L’ESsCD recommande les <button class="w" data-k="k90-tg2">IgA anti-TG2</button> comme test initial unique, à tout âge (recommandation forte) ; en effet, leur sensibilité est d’environ 90,7 % et leur spécificité de 87,4 % chez l’adulte, et les tests automatisés atteignent 99 % et 100 %. De plus, deux conditions sont indispensables : doser en même temps les IgA totales, pour ne pas méconnaître un déficit en IgA, et tester pendant que le patient mange du gluten. Par ailleurs, la combinaison systématique de plusieurs tests sérologiques est déconseillée (forte), et les tests dans la salive ou les selles ne doivent pas être utilisés.</p><p>Cependant, le <button class="w" data-k="k90-defiga">déficit en IgA</button> touche 2 à 3 % des malades. Dans ce cas, la sérologie utilise des tests IgG, comme les IgG anti-TG2 ou anti-DGP ; toutefois, leur sensibilité est plus faible, si bien qu’un résultat négatif n’exclut pas la maladie. C’est pourquoi, en présence de signes de <button class="w" data-k="k90-malabs">malabsorption</button>, une gastroscopie avec biopsies duodénales est faite quel que soit le résultat IgG (ESsCD 2025).</p><div class="trap"><span class="k">Piège</span>Un test fait après l’arrêt du gluten peut être faussement négatif : les anticorps se normalisent sous régime. De même, un déficit en IgA rend les IgA anti-TG2 faussement négatifs : d’où le dosage systématique des IgA totales.</div><div class="quiz ui"><p>La patiente a réduit le gluten depuis trois mois « pour voir ». Ses IgA anti-TG2 sont négatives, avec des IgA totales normales. Que conclure ?</p><button data-ok="0">La maladie cœliaque est exclue</button><button data-ok="1">Le test n’est pas interprétable : il doit être fait sous régime contenant du gluten</button><button data-ok="0">Il faut doser les IgA anti-endomysium</button><p class="fb" hidden>Les marqueurs se normalisent sous <button class="w" data-k="k90-rsg">régime sans gluten</button> ; l’ESsCD demande de tester pendant la consommation de gluten (ESsCD 2025, recommandation forte).</p></div><div class="key"><b>À retenir.</b> On dose les IgA anti-TG2 seules avec les IgA totales, sous gluten, sans combinaison systématique et sans test salivaire ou fécal. En cas de déficit en IgA (2-3 %), on dose les IgG anti-TG2 ou anti-DGP, et l’on biopsie en cas de malabsorption.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12704582/" target="_blank" rel="noopener">Al-Toma A. et al., European Society for the Study of Coeliac Disease 2025 updated guidelines on the diagnosis and management of coeliac disease in adults. Part 1: diagnostic approach, United European Gastroenterol J 2025</a>.</p></section>
<section class="ilot" id="k90-5"><h2><span class="n">5</span>Confirmation : biopsies duodénales ou stratégie sans biopsie</h2><p>Classiquement, le diagnostic est confirmé par l’histologie. Ainsi, l’ESsCD recommande au moins quatre biopsies du duodénum distal et deux du bulbe (recommandation forte), même si la muqueuse paraît normale, car les lésions peuvent être en mosaïque ; de plus, les biopsies doivent être bien orientées et colorées à l’hématoxyline-éosine. Ensuite, l’histologie est classée selon la <button class="w" data-k="k90-marsh">classification de Marsh</button>, dont le stade III (<button class="w" data-k="k90-atrophie">atrophie villositaire</button>) est subdivisé en 3A (partielle), 3B (subtotale) et 3C (totale).</p><p>Par ailleurs, l’ESsCD 2025 introduit une <button class="w" data-k="k90-sansbiopsie">stratégie sans biopsie</button> chez l’adulte de moins de 45 ans dont les <button class="w" data-k="k90-tg2">IgA anti-TG2</button> sont au moins 10 fois la limite supérieure de la normale (recommandation conditionnelle). En effet, à ce seuil, la spécificité atteint 100 % dans une méta-analyse de 12 103 participants, alors que la sensibilité n’est que de 51 %. Cependant, trois conditions s’ajoutent : le résultat doit être confirmé sur un second prélèvement, le patient doit continuer le gluten jusqu’à confirmation, et la décision revient à un centre de soins secondaires. Enfin, un stade Marsh I avec une sérologie négative rend la maladie peu probable ; il faut alors chercher une autre cause.</p><figure><img src="data:image/gif;base64,R0lGODdhAAKAAYUAAP7r2v7p2P7o1/7n2P7m0v7k1v7kzv/g1/zh0/7b1/zhyvrgx/vcx//T2f/SzfvSz/7K1/7Ky/rKzv7E1f6+1P7AyvvA0vvAx/bAyv240f2z0f23xv2yxf2s0P2sxP2myfm3yfmwyPmoxvWuxO2swf2fzfyfwP2YxfefwveYweybvPuRwfqKv+uNuO6CtudxrQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAAAKAAUAI/wAZCBxIsKDBgwgTKlCwYMHAhRAjSoRooKLFixgzatxIoCOCiwQQiBS5UKADBgoYPHggUIHIkB8tdpxJoEABkQVozpRZUafPnwQy7jQw06bNAUiNHk2qNCnSATZrPp1KdarSqwWgKtWZsyjWq e:Histologic_examination_of_celiac_disease.png" target="_blank" rel="noopener">source</a>), adaptée en GIF.</small></figcaption></figure><p><i>Que montre l’image ?</i> Les petits noyaux sombres glissés entre les entérocytes sont des lymphocytes intraépithéliaux ; or, leur augmentation est le premier stade de Marsh, avant même l’atrophie. Ainsi, la lecture histologique suit la cascade immunitaire : d’abord l’infiltrat, puis l’hyperplasie des cryptes, enfin l’aplatissement des villosités. C’est pourquoi un infiltrat isolé, sans anticorps, ne suffit pas au diagnostic.</p><div class="key"><b>À retenir.</b> On prélève ≥ 4 biopsies du duodénum distal et 2 du bulbe, car l’atteinte est inégale ; le Marsh III correspond à l’atrophie (3A, 3B, 3C). On peut éviter la biopsie avant 45 ans si les IgA anti-TG2 dépassent 10 × la normale sur deux prélèvements, avec une décision en soins secondaires. Un Marsh I séronégatif fait chercher une autre cause.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12704582/" target="_blank" rel="noopener">Al-Toma A. et al., European Society for the Study of Coeliac Disease 2025 updated guidelines on the diagnosis and management of coeliac disease in adults. Part 1: diagnostic approach, United European Gastroenterol J 2025</a>.</p></section>
