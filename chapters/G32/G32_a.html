<template id="ch-G32"><div class="chap"><div class="chap-head"><div class="code">G32 · Neurologie</div><h1>G32 — Autres affections dégénératives du système nerveux au cours d’affections classées ailleurs</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G32"><section class="ilot" id="g32-question"><h2>Une marche instable et des paresthésies demandent une localisation et une cause</h2><p>Une personne dit marcher sur du coton, ne plus sentir la position de ses pieds ou perdre son équilibre dans l’obscurité. Une force conservée n’exclut pas une atteinte neurologique importante. Le clinicien recherche une ataxie sensitive, une atteinte médullaire et une éventuelle neuropathie associée. La chronologie, la gravité et les autres signes déterminent le niveau de soins et les investigations.</p><p>G32* est une catégorie de manifestation au cours de maladies classées ailleurs. Elle comporte G32.0*, dégénérescence combinée subaiguë de la moelle, et G32.8*, autres affections dégénératives précisées. L’inclusion B12 de G32.0 est explicitement vérifiée ; elle fournit le fil clinique principal de cette leçon. Les autres myélopathies et neuropathies ne sont pas toutes transformées en G32.8.</p><div class="key"><b>À retenir.</b> Localiser le syndrome, rechercher une cause traitable et vérifier le code ; un résultat biologique ou une image isolés ne réalisent pas ces trois étapes.</div><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r2">[2]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r10">[10]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-definition"><h2>La dégénérescence combinée subaiguë concerne la moelle et peut s’associer à une neuropathie</h2><p><button class="w" data-k="g32-dcs">Cordons postérieurs, voies motrices et myéloneuropathie</button></p><div class="key"><b>À retenir.</b> Le syndrome se décrit par ses fonctions atteintes ; il ne se résume ni à une anémie ni à une valeur de B12.</div><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-code-body"><h2>G32.0* et G32.8* sont deux sous-codes distincts</h2><p><button class="w" data-k="g32-codage">Une manifestation précise exige une maladie causale documentée</button></p><table class="t"><thead><tr><th>Code</th><th>Portée vérifiée</th><th>Piège</th></tr></thead><tbody><tr><td>G32.0*</td><td>Dégénérescence combinée subaiguë ; inclusion B12 avec E53.8†.</td><td>Ne pas exiger une anémie pour reconnaître une atteinte neurologique.</td></tr><tr><td>G32.8*</td><td>Autres affections dégénératives précisées au cours d’une autre maladie.</td><td>Ne pas y classer toute maladie médullaire sans preuve.</td></tr><tr><td>G32</td><td>Catégorie avec les deux sous-codes précédents.</td><td>Ne pas inventer une subdivision supplémentaire ou la présenter comme sans subdivision.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Le code traduit une conclusion documentée ; il ne crée ni la topographie ni la preuve causale.</div><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r2">[2]</button> · <button class="w" data-k="g32-r10">[10]</button></p></section><section class="ilot" id="g32-epidemiologie"><h2>Les statistiques de consommation ou de carence ne mesurent pas la fréquence de G32</h2><p>Aucune incidence ou prévalence suisse actuelle de G32, avec ventilation complète par âge et sexe, n’a été établie dans les sources réellement lues. La présence d’un cas suisse publié permet d’illustrer une situation locale ; elle ne fournit pas un taux national. Les données de carence en B12, de consommation de protoxyde d’azote et de dégénérescence combinée ne désignent pas les mêmes populations.</p><p><button class="w" data-k="g32-serie">Ce que montre la série allemande de 23 cas</button></p><p>Le cas de Rennaz concerne un homme de 27 ans, hospitalisé en 2025 et publié en 2026. Cet âge ne définit pas une tranche obligatoire. Les carences classiques peuvent survenir dans d’autres contextes, notamment malabsorption, chirurgie ou cause auto-immune ; leur épidémiologie ne se superpose pas à celle des usagers de gaz.</p><div class="key"><b>À retenir.</b> Lire population, dénominateur et méthode avant d’appliquer un chiffre à une personne.</div><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r9">[9]</button></p></section><section class="ilot" id="g32-causes"><h2>Distinguer manque d’apport, malabsorption et inactivation fonctionnelle</h2><p><button class="w" data-k="g32-etiologies">Pourquoi la B12 manque-t-elle ou fonctionne-t-elle mal ?</button></p><table class="t"><thead><tr><th>Contexte</th><th>Enjeu</th><th>Conséquence</th></tr></thead><tbody><tr><td>Apports insuffisants</td><td>Vérifier alimentation, compléments et autres causes.</td><td>Adapter substitution et prévention sans présumer une cause unique.</td></tr><tr><td>Malabsorption ou cause auto-immune</td><td>Établir la cause et sa persistance.</td><td>Entretien et voie peuvent être durablement nécessaires.</td></tr><tr><td>Protoxyde d’azote</td><td>Identifier inactivation et exposition continue.</td><td>Substitution et abstinence accompagnée vont ensemble.</td></tr><tr><td>Autre maladie neurologique</td><td>Tester les diagnostics concurrents.</td><td>Ne pas donner G32.8 par défaut.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button></p></section><section class="ilot" id="g32-anamnese"><h2>La chronologie et la fonction orientent le diagnostic</h2><p>Faire préciser le début des paresthésies, leur topographie, la sensation de position des pieds, les circonstances des chutes et l’effet de l’obscurité. Évaluer marche autonome, escalier, toilette, travail et activités antérieures. Une sensation de faiblesse doit être confrontée à la force réelle, car une perte de retour sensitif peut rendre un geste peu sûr sans parésie.</p><p><button class="w" data-k="g32-exposition">Questionner l’exposition avec confidentialité et précision</button></p><div class="key"><b>À retenir.</b> Nommer le changement et son tempo permet de choisir les examens ; une liste d’expositions ne suffit pas à attribuer une cause.</div><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r8">[8]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-examen-body"><h2>Examiner sensibilité profonde, motricité et sécurité de la marche</h2><p>Montrer d’abord les tâches et vérifier leur compréhension. Rechercher le sens de position d’un orteil ou d’un doigt, la vibration sur un relief osseux et la topographie d’autres troubles sensitifs. Comparer les côtés et les niveaux, sans réduire l’examen à une seule réponse correcte ou incorrecte. La douleur, une difficulté cognitive ou une mauvaise consigne peuvent modifier la performance.</p><p><button class="w" data-k="g32-examen">Une manœuvre doit être sûre et interprétable</button></p><div class="key"><b>À retenir.</b> Décrire ce qui est perdu, ce qui reste conservé et les conditions du test avant de conclure.</div><p>Sources : <button class="w" data-k="g32-r4">[4]</button> · <button class="w" data-k="g32-r6">[6]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section><section class="ilot" id="g32-urgence"><h2>Une atteinte rapidement progressive demande une évaluation urgente</h2><p>Une perte rapide de marche autonome, une faiblesse croissante, un trouble sphinctérien, un déficit focal ou une menace respiratoire imposent une évaluation urgente. Rechercher en particulier les autres causes médullaires ou périphériques graves, dont une compression. La présence d’une exposition au protoxyde d’azote ne dispense pas de les examiner. Un diagnostic supposé de carence ne doit pas retarder une imagerie ou un avis spécialisé nécessaires.</p><p>Le bilan initial est prélevé avant substitution lorsque cela est possible immédiatement, car le traitement et l’arrêt d’exposition modifient les marqueurs. Cette préférence ne signifie pas attendre plusieurs jours un résultat devant une atteinte neurologique évocatrice. Les recommandations cliniques insistent sur la prise en charge sans retard ; la FI demande un diagnostic assuré avant thérapie. L’équipe documente donc l’hypothèse, les prélèvements, la gravité et la décision, avec coordination spécialisée.</p><p>Sous traitement, rechercher aussi effets indésirables et troubles électrolytiques. La FI souligne le besoin de contrôler régulièrement le potassium lorsque l’érythropoïèse s’intensifie. Une détérioration n’est pas attribuée automatiquement à la seule maladie initiale ou à un défaut d’observance.</p><div class="trap"><span class="k">Piège</span> Attendre l’apparition d’une anémie, une B12 franchement basse ou la totalité des résultats peut perdre du temps dans une atteinte neurologique sévère.</div><p>Sources : <button class="w" data-k="g32-r3">[3]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button></p></section><section class="ilot" id="g32-diagnostic"><h2>Établir un faisceau clinique, causal et biologique</h2><p><button class="w" data-k="g32-criteres">Il n’existe pas de score unique pour tout G32</button></p><div class="alert"><p><b>Critères de travail, sans score universel :</b> décrire le syndrome et la topographie, documenter cause et niveau de preuve, interpréter les tests avec leurs limites, rechercher les urgences et les diagnostics concurrents. Puis vérifier le sous-code et le code causal. Une image en V ou un taux de B12 isolés ne constituent pas un critère unique de G32.</p></div><p>Sources : <button class="w" data-k="g32-r1">[1]</button> · <button class="w" data-k="g32-r2">[2]</button> · <button class="w" data-k="g32-r5">[5]</button> · <button class="w" data-k="g32-r7">[7]</button> · <button class="w" data-k="g32-r13">[13]</button></p></section>
