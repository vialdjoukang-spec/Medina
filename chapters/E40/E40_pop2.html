<template data-pop="e40-exp-1" data-title="Comprendre — 1. Définition : un phénotype et un code précis"><p><b>Lecture expliquée.</b> E40 a un périmètre précis ; la cause exacte du kwashiorkor ne se réduit pas aux protéines seules.</p><p>Le <button class="w" data-k="e40-definition">kwashiorkor</button> désigne une forme grave de malnutrition avec <button class="w" data-k="e40-nutritional-edema">œdème nutritionnel</button>, souvent associée à des anomalies de peau, des cheveux et à une hépatomégalie. L’OMS/UNICEF souligne en 2026 que sa cause exacte et les raisons de sa différence avec le marasme restent imparfaitement comprises. Le réduire à un manque isolé de protéines est insuffisant.</p><p>Dans la nomenclature OFS <b>CIM-10-GM 2024</b>, E40 correspond à une malnutrition grave avec œdème nutritionnel et dépigmentation de la peau et des cheveux. Le kwashiorkor avec marasme est exclu vers <b>E42</b>. Il n’existe pas de sous-code décimal E40.x dans cette version. Le <button class="w" data-k="e40-coding">codage</button> suit la situation documentée ; il ne transforme pas toute hypoalbuminémie en E40.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a>.</p></template>
<template data-pop="pareto-e40-1" data-title="Essentiel — 1. Définition : un phénotype et un code précis"><p>E40 a un périmètre précis ; la cause exacte du kwashiorkor ne se réduit pas aux protéines seules.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a>.</p></template>
<template data-pop="e40-exp-2" data-title="Comprendre — 2. Épidémiologie : conserver le dénominateur"><p><b>Lecture expliquée.</b> Aucune incidence suisse directe E40 retenue ; ne pas remplacer son dénominateur par toute dénutrition.</p><p>Aucune incidence suisse directe d’E40 ni fréquence mondiale actuelle spécifique au kwashiorkor n’a été retenue dans cette recherche. Les chiffres de toute dénutrition ou de toute émaciation ne peuvent pas être rebaptisés fréquence d’E40. Les études de malnutrition sévère de l’enfant concernent des populations et des circuits de soins précis.</p><p>Le guide OMS/UNICEF vise les moins de cinq ans. La malnutrition œdémateuse y est un marqueur de gravité nécessitant une attention spécifique. La revue immunologique de Rytter et collègues rassemble surtout des travaux anciens chez des enfants de un à soixante mois ; elle éclaire les mécanismes et leurs limites, sans fournir une prévalence suisse actuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a>.</p></template>
<template data-pop="pareto-e40-2" data-title="Essentiel — 2. Épidémiologie : conserver le dénominateur"><p>Aucune incidence suisse directe E40 retenue ; ne pas remplacer son dénominateur par toute dénutrition.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a>.</p></template>
<template data-pop="e40-exp-3" data-title="Comprendre — 3. Physiopathologie : compartiments, réserves et adaptation"><p><b>Lecture expliquée.</b> Eau, tissu, albumine et drainage lymphatique sont des questions liées mais distinctes.</p><p>Les nutriments doivent être ingérés, digérés, absorbés et utilisés. Les acides aminés et les sucres gagnent les capillaires intestinaux ; les lipides longs sont notamment exportés en chylomicrons dans les chylifères lymphatiques. Une difficulté d’accès à la nourriture, de déglutition, de digestion ou d’absorption n’a donc pas la même cible thérapeutique.</p><p>L’<button class="w" data-k="e40-albumin">albumine</button> participe à la pression oncotique plasmatique, mais la distribution de l’eau dépend aussi des pressions hydrostatiques, de la barrière capillaire, de la matrice interstitielle et du drainage lymphatique. Le <button class="w" data-k="e40-starling">raisonnement sur les échanges liquidiens</button> ne se réduit pas à « albumine basse donc œdème nutritionnel ». Une étude de deux cohortes pédiatriques publiée en 2022 montre des associations avec l’albumine et avec des mécanismes indépendants ; les auteurs soulignent les limites de causalité et l’absence de données détaillées rénales et cardiaques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-7-chemical-digestion-and-absorption-a-closer-look" target="_blank" rel="noopener">NORMAL-GUT — Digestion protéines et absorption glucides, protéines, lipides</a> ; <a data-reference-source="1" href="https://ec.europa.eu/programmes/erasmus-plus/project-result-content/d6eb4036-767f-4d49-bdde-70a1657290ee/Anatomy_Physiology_LymphSystem.pdf" target="_blank" rel="noopener">NORMAL-LYMPH — Fonctions lymphatiques et organisation immune</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-MECH — Résumé, introduction et discussion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-LIMIT — Fin discussion et limites</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a>.</p></template>
<template data-pop="pareto-e40-3" data-title="Essentiel — 3. Physiopathologie : compartiments, réserves et adaptation"><p>Eau, tissu, albumine et drainage lymphatique sont des questions liées mais distinctes.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-MECH — Résumé, introduction et discussion</a>.</p></template>
<template data-pop="e40-exp-4" data-title="Comprendre — 4. Démarche clinique : trier, caractériser, expliquer"><p><b>Lecture expliquée.</b> Trier, décrire l’œdème, évaluer la nutrition, chercher les causes puis choisir le circuit.</p><p>Le bilan détaillé ne doit pas retarder la stabilisation. L’<button class="w" data-k="e40-anthropometry">anthropométrie</button> mesure une dimension du problème ; elle ne remplace pas le jugement clinique ni la recherche d’une maladie sous-jacente.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a>.</p></template>
<template data-pop="pareto-e40-4" data-title="Essentiel — 4. Démarche clinique : trier, caractériser, expliquer"><p>Trier, décrire l’œdème, évaluer la nutrition, chercher les causes puis choisir le circuit.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a>.</p></template>
<template data-pop="e40-exp-5" data-title="Comprendre — 5. Anamnèse : ce qui entre, ce qui est perdu et ce qui a changé"><p><b>Lecture expliquée.</b> Décrire ce qui est réellement avalé et perdu, avec trajectoire, maladie et environnement.</p><p>Reconstituer la <button class="w" data-k="e40-history">trajectoire alimentaire et pondérale</button> : poids antérieur fiable, durée de restriction, diversification ou allaitement, quantités réellement consommées, vomissements, diarrhée, douleur, dysphagie et difficultés fonctionnelles. Demander comment les repas sont préparés et donnés ; une prescription sur papier n’est pas une prise effective.</p><p>Explorer les maladies connues, les infections possibles, la malabsorption, les pertes digestives, les symptômes urinaires, la dyspnée et les médicaments. Chez l’adulte, rechercher aussi le contexte social, la dépendance, l’alcool et les obstacles aux courses ou à la cuisine. Un régime restrictif se décrit concrètement sans attribuer d’emblée une carence à une identité alimentaire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FOLLOW — 4.9–4.10 et 7.13, encadré 28</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a>.</p></template>
<template data-pop="pareto-e40-5" data-title="Essentiel — 5. Anamnèse : ce qui entre, ce qui est perdu et ce qui a changé"><p>Décrire ce qui est réellement avalé et perdu, avec trajectoire, maladie et environnement.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a>.</p></template>
<template data-pop="e40-exp-6" data-title="Comprendre — 6. Examen clinique : chercher le signe et ses limites"><p><b>Lecture expliquée.</b> Le godet exige un geste ; sa cause et sa gravité demandent tout l’examen.</p><p>Évaluer d’abord état général et signes vitaux. Le <button class="w" data-k="e40-pitting">godet</button> correspond à une dépression qui persiste après une pression. Dans l’annexe 3 du guide OMS/UNICEF 2026, exercer une pression modérée pendant <b>trois secondes</b> sur le dos du pied ou la face antérieure du tibia, relâcher, comparer les deux côtés et examiner l’extension. Le signe est réel ; sa cause reste à établir.</p><p>Cette <button class="w" data-k="e40-grade">gradation</button> est celle du guide 2026 : une extension aux mains ou aux bras relève donc de +++ et ne doit pas être reprise sous++ à partir d’une autre version. Chez les six à cinquante-neuf mois avec malnutrition aiguë sévère,+++ est un motif d’hospitalisation immédiate.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Évaluation nutritionnelle, examen peau-cheveux ; symptômes œdème, perte de poids et malnutrition</a>.</p></template>
<template data-pop="pareto-e40-6" data-title="Essentiel — 6. Examen clinique : chercher le signe et ses limites"><p>Le godet exige un geste ; sa cause et sa gravité demandent tout l’examen.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a>.</p></template>
<template data-pop="e40-exp-7" data-title="Comprendre — 7. Syndromes : associer sans tout confondre"><p><b>Lecture expliquée.</b> Malnutrition, inflammation, instabilité et renutrition peuvent se combiner sans être synonymes.</p><p><b>Malnutrition œdémateuse.</b> Œdèmes bilatéraux d’allure nutritionnelle, contexte d’apports ou de maladie et signes associés ; la maigreur peut être masquée. Un marasme associé conduit à une autre catégorie de codage qu’un E40 isolé.</p><p><b>Déplétion tissulaire et inflammation.</b> Chez l’adulte, la perte pondérale, le faible muscle ou l’IMC bas s’interprètent avec une cause étiologique. Le <button class="w" data-k="e40-glim">cadre GLIM</button> n’identifie pas à lui seul la cause d’un œdème.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a>.</p></template>
<template data-pop="pareto-e40-7" data-title="Essentiel — 7. Syndromes : associer sans tout confondre"><p>Malnutrition, inflammation, instabilité et renutrition peuvent se combiner sans être synonymes.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a>.</p></template>
<template data-pop="e40-exp-8" data-title="Comprendre — 8. Diagnostic positif : séparer les référentiels"><p><b>Lecture expliquée.</b> Les critères enfant et adulte sont distincts ; avant six mois, le risque de croissance n’est pas toujours MAS.</p><p>Le <button class="w" data-k="e40-muac">périmètre brachial</button> et le <button class="w" data-k="e40-zscore">z-score de croissance</button> demandent technique, âge et référence corrects. Chez l’adulte, la sévérité GLIM repose sur les critères phénotypiques ; il faut tenir compte de l’eau dans le poids et les mesures corporelles. Un seuil pédiatrique de bras ne se transpose pas à la personne âgée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a>.</p></template>
<template data-pop="pareto-e40-8" data-title="Essentiel — 8. Diagnostic positif : séparer les référentiels"><p>Les critères enfant et adulte sont distincts ; avant six mois, le risque de croissance n’est pas toujours MAS.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a>.</p></template>
<template data-pop="e40-exp-9" data-title="Comprendre — 9. Explorations : une question par résultat"><p><b>Lecture expliquée.</b> Choisir des examens qui recherchent cause ou complication ; albumine seule insuffisante.</p><p>Le <button class="w" data-k="e40-tests">bilan biologique</button> recherche complications et causes : glycémie, phosphate, potassium, magnésium et fonction rénale selon état et risque ; hémogramme, inflammation et bilan hépatique selon contexte. Albumine basse peut refléter plusieurs mécanismes ; elle ne mesure pas seule l’apport protéique ni la gravité de toute dénutrition.</p><p>La <button class="w" data-k="e40-urine">recherche de protéinurie</button> aide à reconnaître une cause rénale. Une bandelette positive demande interprétation puis quantification et bilan appropriés. La <button class="w" data-k="e40-crp">CRP</button> peut soutenir la présence d’inflammation, mais une infection ne se résume pas à un chiffre et une CRP normale n’exclut pas toutes les causes d’œdème.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-LIMIT — Fin discussion et limites</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a>.</p></template>
<template data-pop="pareto-e40-9" data-title="Essentiel — 9. Explorations : une question par résultat"><p>Choisir des examens qui recherchent cause ou complication ; albumine seule insuffisante.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a>.</p></template>
<template data-pop="e40-exp-10" data-title="Comprendre — 10. Arbre diagnostique et diagnostics différentiels"><p><b>Lecture expliquée.</b> Garder causes rénales, hépatiques, cardiaques, digestives et locales dans le raisonnement.</p><p>Le <button class="w" data-k="e40-differential">diagnostic différentiel</button> cherche aussi des associations. Traiter une carence n’efface pas une infection ou une maladie chronique concomitante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-LIMIT — Fin discussion et limites</a>.</p></template>
<template data-pop="pareto-e40-10" data-title="Essentiel — 10. Arbre diagnostique et diagnostics différentiels"><p>Garder causes rénales, hépatiques, cardiaques, digestives et locales dans le raisonnement.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a>.</p></template>
<template data-pop="e40-exp-11" data-title="Comprendre — 11. Prise en charge : population, phase et surveillance"><p><b>Lecture expliquée.</b> Prescrire selon âge, phase, voie et produit ; ne pas fusionner OMS, FI et objectifs adultes.</p><p><b>Urgence et orientation.</b> Pour les six à cinquante-neuf mois avec MAS, danger IMCI, problème médical aigu, œdème+++ ou échec du test d’appétit conduisent à l’<button class="w" data-k="e40-admission">hospitalisation immédiate</button>. La prise en charge d’un choc, d’une hypoglycémie ou d’une infection grave utilise le protocole pédiatrique et les ressources du service. Les besoins hydriques sont évalués avec prudence : godet et volémie ne sont pas synonymes.</p><p><b>Enfant 6–59 mois hospitalisé.</b> Le guide 2026 prévoit une <button class="w" data-k="e40-stabilization">stabilisation</button> avec F75, puis une <button class="w" data-k="e40-transition">transition</button> vers F100 ou <button class="w" data-k="e40-rutf">aliment thérapeutique prêt à l’emploi</button>, avant la réhabilitation. F75 apporte 75 kcal/100 mL ; le début de stabilisation correspond à 80–100 kcal/kg/j, souvent le bas si instabilité, avec repas fractionnés et adaptation à la tolérance et à l’œdème. Ce ne sont pas des objectifs de renutrition adulte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRANS — 4.6.2–4.6.3 p 35–36</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-TARGET — Recommandations 10–12 et commentaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-MECH — Résumé, introduction et discussion</a>.</p></template>
<template data-pop="pareto-e40-11" data-title="Essentiel — 11. Prise en charge : population, phase et surveillance"><p>Prescrire selon âge, phase, voie et produit ; ne pas fusionner OMS, FI et objectifs adultes.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a>.</p></template>
<template data-pop="e40-exp-12" data-title="Comprendre — 12. Prévention, suivi et pronostic : regarder au-delà du poids"><p><b>Lecture expliquée.</b> Une variation de poids peut être hydrique ; transfert et fin du traitement sont différents.</p><p>Le <button class="w" data-k="e40-follow">suivi</button> associe état clinique, appétit, prises effectives, poids, œdème et fonction. La régression des œdèmes peut d’abord faire baisser le poids : ce n’est pas automatiquement un échec. Chez l’enfant hospitalisé, œdème non diminué au quatrième jour, persistant au dixième ou appétit toujours faible au quatrième réclament une réévaluation dans le guide 2026.</p><p>Le transfert à l’ambulatoire repose sur stabilisation et sécurité du relais. La fin du traitement de MAS des six à cinquante-neuf mois demande habituellement P/T ou P/L ≥-2 z, PB ≥ 125 mm, absence d’œdème sur au moins deux visites/mesures et prise en charge des problèmes médicaux/sociaux. Les discordances prolongées de mesures nécessitent une décision clinique documentée. Un pourcentage de prise de poids seul ne suffit pas.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FOLLOW — 4.9–4.10 et 7.13, encadré 28</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a>.</p></template>
<template data-pop="pareto-e40-12" data-title="Essentiel — 12. Prévention, suivi et pronostic : regarder au-delà du poids"><p>Une variation de poids peut être hydrique ; transfert et fin du traitement sont différents.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FOLLOW — 4.9–4.10 et 7.13, encadré 28</a>.</p></template>
<template data-pop="e40-exp-13" data-title="Comprendre — 13. Points clés : relier le signe à une décision"><p><b>Lecture expliquée.</b> Le contexte et les unités donnent leur sens aux chiffres.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a>.</p></template>
<template data-pop="pareto-e40-13" data-title="Essentiel — 13. Points clés : relier le signe à une décision"><p>Le contexte et les unités donnent leur sens aux chiffres.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a>.</p></template>
<template data-pop="e40-exp-14" data-title="Comprendre — 14. Pièges : les équivalences trompeuses"><p><b>Lecture expliquée.</b> Ni photo, ni albumine, ni code ne remplace le raisonnement et la prescription appropriée.</p><p>Œdème ne signifie pas kwashiorkor ; albumine ne signifie pas apport protéique ; poids ne signifie pas muscle ; perte de poids après traitement ne signifie pas nécessairement dégradation. Une photographie ne démontre pas le godet et un godet ne détermine pas sa cause.</p><p>Les erreurs de prescription sont de confondre mg/kg/j et mg/kg/prise, d’ignorer la concentration après reconstitution, de substituer amoxicilline et ampicilline ou de présenter un protocole OMS comme texte autorisé d’une FI suisse. La fenêtre <button class="w" data-k="e40-calculation">calcul et unités</button> rend ces différences explicites.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Évaluation nutritionnelle, examen peau-cheveux ; symptômes œdème, perte de poids et malnutrition</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, CK et CS</a>.</p></template>
<template data-pop="pareto-e40-14" data-title="Essentiel — 14. Pièges : les équivalences trompeuses"><p>Ni photo, ni albumine, ni code ne remplace le raisonnement et la prescription appropriée.</p><div class="key"><b>À retenir.</b> Préciser population, mécanisme, unités et décision.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a>.</p></template>
<template data-pop="e40-cas-1" data-title="Cas 1 — Le poids masque l’œdème"><p><b>Exercice fictif original.</b></p><p>Un enfant de vingt mois présente un œdème bilatéral des pieds et jambes avec visage atteint. L’aspect+++ dans le guide 2026 est un critère d’hospitalisation immédiate en MAS. Le poids apparemment préservé n’annule pas le signe.</p><p>Examiner danger et appétit, stabiliser, puis rechercher causes et comorbidités. Ne pas attendre un PB bas pour agir si l’œdème est identifié nutritionnel.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a>.</p></template>
<template data-pop="e40-cas-2" data-title="Cas 2 — Un petit bras avant six mois"><p><b>Exercice fictif original.</b></p><p>Un nourrisson de trois mois a PB 108 mm, sans œdème, et une trajectoire de croissance préoccupante. Le seuil<110 mm identifie un risque de mauvaise croissance ; il ne suffit pas seul à définir MAS dans le guide 2026.</p><p>Évaluer P/L, trajectoire, alimentation et dyade. Soutien allaitement et soins sont nécessaires selon évaluation ; ne pas recopier RUTF et prescriptions du circuit 6–59 mois.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a>.</p></template>
<template data-pop="e40-cas-3" data-title="Cas 3 — Des œdèmes après reprise alimentaire chez l’adulte"><p><b>Exercice fictif original.</b></p><p>Une personne adulte ayant très peu mangé développe dyspnée et faiblesse après reprise. Rechercher syndrome de renutrition, sepsis et autres défaillances ; vérifier P/K/Mg, glycémie, organes et bilan hydrique selon urgence.</p><p>Ce n’est pas un E40 automatique. L’équipe adapte progression, thiamine et substitutions ; aucune dose F75 pédiatrique ne devient un objectif adulte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a>.</p></template>
<template data-pop="e40-cas-4" data-title="Cas 4 — Albumine basse et protéinurie"><p><b>Exercice fictif original.</b></p><p>Une personne œdémateuse a une albumine basse et une protéinurie. La perte rénale doit être évaluée ; ne pas conclure à un apport protéique insuffisant sur albumine seule.</p><p>La dénutrition peut coexister et demande sa propre évaluation. La cause rénale modifie aussi les précautions hydriques et médicamenteuses.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a>.</p></template>
