<template data-pop="e40-definition" data-title="Kwashiorkor : tableau clinique et périmètre"><p>Le kwashiorkor est une forme grave de malnutrition œdémateuse, souvent accompagnée de signes de peau, cheveux ou foie. L’OMS 2026 précise que son origine exacte et ses différences avec le marasme restent incomplètement comprises. Une explication par les protéines seules est trop réductrice.</p><p>L’OFS 2024 décrit E40 comme malnutrition grave avec œdème nutritionnel et dépigmentation peau/cheveux, avec exclusion du marasme associé vers E42. Le libellé d’un code et les critères de prise en charge ne sont pas la même question.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a>.</p></template>
<template data-pop="e40-nutritional-edema" data-title="Œdème nutritionnel : qualifier avant de classer"><p>Dans le guide pédiatrique 2026, l’œdème nutritionnel est bilatéral, commence aux pieds et peut s’étendre. Son identification peut suffire à classer une MAS chez l’enfant sans imposer un poids/taille bas en plus.</p><p>Cette règle n’autorise pas à qualifier de nutritionnel tout œdème bilatéral. Début ailleurs, asymétrie, protéinurie ou signes d’organe conduisent à une recherche différentielle ; les causes peuvent coexister.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a>.</p></template>
<template data-pop="e40-grade" data-title="Gradation OMS/UNICEF2026 des œdèmes"><p>Grade+ : deux pieds seuls. Grade++ : pieds et jambes. Grade +++ : pieds et jambes avec toute autre partie, dont le visage. Cette version diffère de tableaux plus anciens qui plaçaient mains/bras dans une catégorie intermédiaire.</p><p>Pour les six à cinquante-neuf mois avec MAS,+++ est un motif d’hospitalisation immédiate. Noter la distribution en mots et la version évite qu’un même nombre de signes+ cache deux définitions différentes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a>.</p></template>
<template data-pop="e40-marasmus" data-title="Marasme, kwashiorkor et association"><p>Le marasme nutritionnel correspond à une forme avec déplétion tissulaire importante ; dans la nomenclature consultée E41 est distinct d’E40. L’eau peut masquer une partie de la maigreur dans un tableau œdémateux.</p><p>L’association kwashiorkor et marasme relève d’E42. E43, qui inclut œdème de famine et malnutrition grave sans précision, ne doit pas être substitué mécaniquement sans vérifier la documentation clinique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a>.</p></template>
<template data-pop="e40-albumin" data-title="Albumine : concentration et mécanismes"><p>L’albumine contribue à la pression oncotique du plasma. Sa concentration varie avec plusieurs processus, dont inflammation, synthèse et pertes ; elle ne constitue pas un compteur de protéines alimentaires ingérées.</p><p>GLIM déconseille l’hypoalbuminémie comme indicateur isolé de dénutrition. Les cohortes pédiatriques 2022 montrent aussi que l’œdème ne se résume pas à sa concentration. Pas de seuil d’albumine inventé pour diagnostiquer universellement E40.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-MECH — Résumé, introduction et discussion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-LIMIT — Fin discussion et limites</a>.</p></template>
<template data-pop="e40-starling" data-title="Échanges liquidiens : capillaire, interstitium et lymphatique"><p>Le mouvement d’eau dépend notamment des pressions, de la barrière vasculaire, des protéines, de la matrice interstitielle et du drainage lymphatique. La description classique d’une réabsorption veineuse systématique de tout liquide filtré est insuffisante.</p><p>L’étude 2022 propose des mécanismes liés à la matrice et au lymphatique dans la malnutrition sévère de l’enfant. Ce sont des résultats de groupes sélectionnés ; ils n’établissent pas une prescription d’albumine ni un test de routine chez tout adulte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-MECH — Résumé, introduction et discussion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-LIMIT — Fin discussion et limites</a> ; <a data-reference-source="1" href="https://ec.europa.eu/programmes/erasmus-plus/project-result-content/d6eb4036-767f-4d49-bdde-70a1657290ee/Anatomy_Physiology_LymphSystem.pdf" target="_blank" rel="noopener">NORMAL-LYMPH — Fonctions lymphatiques et organisation immune</a>.</p></template>
<template data-pop="e40-refeeding" data-title="Syndrome de renutrition : une complication de trajectoire"><p>Après restriction prolongée, la reprise des apports, surtout glucidiques, augmente les besoins métaboliques et modifie les électrolytes et l’eau. Les manifestations peuvent être cardiaques, respiratoires ou neurologiques.</p><p>La revue suisse concerne les adultes médicaux, hors troubles alimentaires, et reconnaît des preuves souvent limitées. Le protocole pédiatrique OMS a sa propre prévention et surveillance ; œdème initial et complication de renutrition ne sont pas synonymes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-LIMIT — 3, 4 et 6, limites</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a>.</p></template>
<template data-pop="e40-microbiome" data-title="Écosystème intestinal : mécanisme et limite thérapeutique"><p>La barrière intestinale, les microorganismes et l’immunité interagissent avec nutrition et infection. Le guide OMS évoque la flore intestinale parmi les mécanismes possibles du bénéfice antibiotique dans son circuit MAS.</p><p>Une hypothèse ne crée pas une indication de probiotique ou d’autre manipulation du microbiote. Les données immunitaires sont hétérogènes et souvent confondues par les infections ; les causes alimentaires et organiques doivent être examinées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a>.</p></template>
<template data-pop="e40-anthropometry" data-title="Anthropométrie : mesurer tissu, croissance et eau"><p>Poids, longueur/taille, périmètre brachial et muscle répondent à des questions différentes. Utiliser technique, matériel, âge et référence appropriés, avec mesures antérieures fiables lorsqu’elles existent.</p><p>L’œdème augmente le poids et perturbe certaines mesures corporelles. Pendant sa résolution, le poids peut baisser alors que l’état s’améliore. Associer mesure, examen et trajectoire plutôt que choisir une étiquette sur un seul chiffre.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a>.</p></template>
<template data-pop="e40-muac" data-title="Périmètre brachial : le seuil dépend de l’âge"><p>Entre six et cinquante-neuf mois, PB<115 mm est un des critères OMS de MAS, indépendamment des deux autres critères possibles. Une mesure correcte et son âge sont nécessaires.</p><p>Entre six semaines et moins de six mois, PB<110 mm identifie un risque de mauvaise croissance/développement ; il ne définit pas seul MAS. Le nourrisson peut avoir MAS avec œdème nutritionnel ou P/L<-3 z. Aucun de ces seuils ne devient un seuil adulte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a>.</p></template>
<template data-pop="e40-zscore" data-title="Z-score : écart à une référence, pas pourcentage"><p>Un z-score situe une mesure par rapport à une distribution de référence, avec âge, sexe et méthode appropriés. Il ne signifie ni pourcentage du poids attendu ni nombre de kilogrammes manquants.</p><p>Dans le cadre OMS 6–59 mois, P/T ou P/L<-3 z est un critère de MAS ; l’œdème nutritionnel peut aussi la définir même sans ce seuil. Ne pas appliquer les descriptions statistiques historiques du codage comme critères GLIM adultes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a>.</p></template>
<template data-pop="e40-glim" data-title="GLIM2025 : diagnostic adulte mondial conjoint"><p>GLIM est un consensus mondial associant ASPEN, ESPEN, FELANPE et PENSA, publié en 2025 dans JPEN. Après dépistage, au moins un critère phénotypique et un étiologique sont nécessaires.</p><p>Phénotypes : perte de poids, IMC bas, muscle réduit. Étiologies : apports/assimilation réduits ou inflammation/charge morbide. Sévérité fondée sur le phénotype ; albumine seule insuffisante. Ce cadre adulte n’est pas une définition OMS du nourrisson ni un code E40 automatique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a>.</p></template>
<template data-pop="e40-history" data-title="Anamnèse nutritionnelle : le repas réel"><p>Demander ce qui est proposé, préparé, donné et réellement avalé, puis ce qui est vomi ou perdu. Durée de restriction, dysphagie, douleur, diarrhée, maladies et médicaments modifient l’explication.</p><p>Chez l’enfant, évaluer développement et aidant ; avant six mois, regarder la dyade et l’allaitement. Chez l’adulte, inclure autonomie, courses, cuisine et contexte social. Une absence de prise n’est pas expliquée par une simple ordonnance calorique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a>.</p></template>
<template data-pop="e40-pitting" data-title="Godet : geste et non-spécificité"><p>Le guide 2026 propose une pression modérée pendant trois secondes au dos du pied ou à la face antérieure du tibia, puis l’observation d’une dépression persistante. Comparer côtés et extension.</p><p>Le godet décrit un signe d’eau interstitielle. La photographie de ce cours vient d’un cas hépatique, pas de kwashiorkor. L’examen et le bilan recherchent la cause ; une image n’établit ni bilatéralité ni statut circulant.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Pitting_Edema2008.jpg" target="_blank" rel="noopener">IMG-EDEMA — Summary, licence et original</a>.</p></template>
<template data-pop="e40-skin" data-title="Peau, cheveux et muqueuses"><p>Le guide décrit dermatose avec dépigmentation/desquamation et cheveux cassants ou hypopigmentés dans certains tableaux œdémateux. Examiner aussi bouche, yeux et signes d’infection selon contexte.</p><p>Une photographie historique peut montrer une anomalie sans en prouver le mécanisme. Une lésion commissurale n’identifie pas à elle seule une vitamine manquante ; une peau rouge n’est pas un signe spécifique E40.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Kwashiorkor_6180.jpg" target="_blank" rel="noopener">IMG-KWA — Description, droits et original</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Pitting_Edema2008.jpg" target="_blank" rel="noopener">IMG-EDEMA — Summary, licence et original</a>.</p></template>
<template data-pop="e40-liver-exam" data-title="Hépatomégalie : constater puis expliquer"><p>Une hépatomégalie peut accompagner le tableau pédiatrique de kwashiorkor. Son examen se relie aux autres signes et à l’histoire ; un foie palpable ne prouve pas seul une stéatose ou une défaillance.</p><p>La planche hépatique est normale. Elle situe hile, veine porte, vésicule et lobes, mais ne mesure ni taille du foie du patient ni albumine. Bilan et imagerie sont demandés selon une question clinique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Gray1086-liver.PNG" target="_blank" rel="noopener">IMG-LIVER — Description et licence</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a>.</p></template>
<template data-pop="e40-shock" data-title="Hypoperfusion : l’œdème ne garantit pas la volémie"><p>Tachycardie, mauvaise perfusion, altération de conscience ou dégradation doivent faire rechercher une urgence. La présence de liquide dans les tissus ne prouve pas que la circulation est adéquate.</p><p>Chez l’enfant MAS, les protocoles d’urgence diffèrent de ceux sans MAS et de ceux de l’adulte. Le service choisit liquide, rythme, surveillance et traitement causal ; aucun remplissage uniforme n’est déduit du seul poids œdémateux.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a>.</p></template>
<template data-pop="e40-glucose" data-title="Glycémie : sécurité immédiate et suivi"><p>Une hypoglycémie peut contribuer à somnolence, crise ou altération de conscience, mais ces signes ont plusieurs causes. Mesurer rapidement et traiter selon le protocole de la population sans retarder la stabilisation.</p><p>Pendant renutrition, hypo- ou hyperglycémie peut aussi apparaître. Associer valeur, prise effective, infection, organes et autres électrolytes ; une glycémie ponctuelle n’exclut pas une complication ultérieure.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a>.</p></template>
<template data-pop="e40-tests" data-title="Bilan biologique : diagnostic, cause et sécurité"><p>Glycémie, P/K/Mg et fonction rénale peuvent répondre à une question de sécurité ; hémogramme, inflammation, foie ou urines à une question étiologique. Adapter au patient et à l’urgence.</p><p>Les intervalles de référence dépendent du laboratoire, de l’âge et des unités. Un dosage normal initial peut coexister avec réserves appauvries ; le suivi pendant reprise est parfois plus informatif qu’une seule valeur.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a>.</p></template>
<template data-pop="e40-urine" data-title="Protéinurie : ne pas manquer une perte rénale"><p>Une protéinurie peut orienter vers une cause rénale de l’œdème et de la baisse d’albumine. La bandelette est un repérage, à interpréter et à compléter selon contexte.</p><p>Une cause rénale n’exclut pas une dénutrition concomitante. Elle change toutefois l’enquête, la prescription hydrique et les précautions de médicaments ; la FI orale Spirig HC prévoit un circuit parentéral pour enfant insuffisant rénal.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a>.</p></template>
<template data-pop="e40-crp" data-title="CRP : marqueur de contexte"><p>Le consensus GLIM admet qu’une maladie habituellement inflammatoire peut satisfaire son critère étiologique sans exiger toujours un marqueur. En cas de doute, la CRP peut aider à documenter l’inflammation.</p><p>Une CRP ne donne pas seule la cause de l’œdème ou de l’anorexie. Inflammation et pertes protéiques ou apports réduits peuvent se combiner ; ne pas attribuer toute albumine basse à la seule nourriture.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a>.</p></template>
<template data-pop="e40-differential" data-title="Différentiels : chercher ce qui change le traitement"><p>Œdèmes rénaux, hépatiques, cardiaques, locaux ou infectieux peuvent partager le godet. Début, symétrie, douleur, signes d’organe et urines orientent le bilan.</p><p>Après reprise alimentaire, penser aussi au syndrome de renutrition avec ses diagnostics concurrents. Les causes peuvent s’additionner ; reconnaître une dénutrition ne dispense pas de chercher une infection ou une maladie organique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a>.</p></template>
<template data-pop="e40-admission" data-title="Hospitalisation : critères pédiatriques attribués"><p>Chez l’enfant 6–59 mois avec MAS, les indications immédiates OMS 2026 comprennent signe de danger IMCI, problème médical aigu, œdème+++ ou échec du test d’appétit.</p><p>Ce n’est pas un score d’hospitalisation adulte. Avant six mois, la branche clinique est distincte ; les mesures détaillées et l’histoire se font après triage/stabilisation si l’état l’exige.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a>.</p></template>
<template data-pop="e40-stabilization" data-title="Stabilisation6–59mois : ne pas confondre avec rattrapage"><p>Le guide 2026 donne F75 à 80–100 kcal/kg/j pour la stabilisation, souvent le bas de fourchette en cas d’instabilité ou risque/tolérance défavorable. F75 contient 75 kcal/100 mL ; huit repas quotidiens sont idéalement répartis toutes les trois heures.</p><p>L’équipe utilise le poids d’admission ou après réhydratation et adapte si œdème++/+++ rend le poids trompeur. Une perte de poids peut accompagner la résolution de l’eau ; augmenter brutalement parce que la balance baisse serait une erreur.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a>.</p></template>
<template data-pop="e40-transition" data-title="Transition : une phase avec critères"><p>Après stabilisation des problèmes médicaux, retour d’appétit et diminution de l’œdème, le passage vers RUTF ou F100 se fait progressivement. La plage 100–130 kcal/kg/j du guide 2026 appartient à cette phase 6–59 mois.</p><p>Réapparition d’un danger, surcharge, aggravation d’œdème ou diarrhée avec déshydratation exige réévaluation et possible retour à stabilisation. Un repas plus énergétique ne signifie pas que tout patient doit accélérer.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRANS — 4.6.2–4.6.3 p 35–36</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a>.</p></template>
<template data-pop="e40-rutf" data-title="RUTF et laits thérapeutiques"><p>RUTF signifie aliment thérapeutique prêt à l’emploi, formulation standardisée utilisée dans des phases et circuits précis. F75 et F100 sont des laits thérapeutiques avec des densités énergétiques différentes.</p><p>Ce sont des aliments, pas une classe de médicaments dotée ici d’une FI suisse fictive. Avant six mois, soutien allaitement et supplémentation surveillée suivent des indications propres ; aucune recette domestique de dilution n’est donnée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRANS — 4.6.2–4.6.3 p 35–36</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a>.</p></template>
<template data-pop="e40-adult" data-title="Adulte : dépistage, diagnostic, objectifs et risque"><p>ESPEN recommande le dépistage validé chez l’adulte médical polymorbide hospitalisé, puis un plan adapté. GLIM relie phénotype et étiologie ; les objectifs énergétiques/protéiques ne constituent pas des critères diagnostiques E40.</p><p>Le risque de renutrition modifie la progression initiale. La revue suisse 2019 propose 5–15 kcal/kg/j selon risque, tandis que l’ESPEN décrit des objectifs à atteindre prudemment. Il ne faut ni démarrer tous à 30 kcal/kg/j ni copier 80–100 kcal/kg/j de l’enfant.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-TARGET — Recommandations 10–12 et commentaires</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a>.</p></template>
<template data-pop="e40-thiamine" data-title="Thiamine : mécanisme, voie et dose"><p>La thiamine est un cofacteur nécessaire au métabolisme glucidique ; ses besoins augmentent lors de la reprise. La revue suisse adulte propose 200–300 mg avant renutrition, avec son champ et ses limites.</p><p>La FI Benerva distingue 200–300 mg/j oral pour hypovitaminose grave et jusqu’à 200 mg/j parentéral dans les cas sévères ; IV très lente à l’hôpital. Ni la voie ni la dose du nourrisson ne se déduisent de cette phrase adulte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a>.</p></template>
<template data-pop="e40-amoxicillin" data-title="Amoxicilline : deux référentiels sans fusion"><p>OMS 2026 MAS pédiatrique :50 mg/kg par prise deux fois/j pour son schéma oral, avec circuit et durée propres. FI Spirig HC 200 mg/4 mL : enfant ≤ 40kg50–100 mg/kg/j en 3–4 prises, maximum 2000 mg/j.</p><p>Le total journalier peut sembler comparable sans que la répartition ni l’indication soient identiques. Vérifier concentration prête à l’emploi, prescription, fonction rénale et résistances ; ampicilline n’est pas un autre nom de l’amoxicilline.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a>.</p></template>
<template data-pop="e40-calculation" data-title="Calcul : mg/kg/prise, mg/kg/j et mL"><p>Exemple fictif du schéma OMS, déjà choisi par équipe :50 mg/kg/prise× 8 kg= 400 mg/prise. Si le produit identifié est à 50 mg/mL, 400 ÷ 50 = 8 mL/prise ; deux prises donnent 800 mg/j et 16 mL/j. Ce calcul ne prescrit pas la dose.</p><p>Avec une suspension 25 mg/mL, 400 mg correspondraient à 16 mL par prise. La concentration change le volume, pas la quantité de principe actif prescrite. Le schéma FI 3–4 prises reste distinct ; vérifier unités, produit et dispositif oral gradué.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a>.</p></template>
<template data-pop="e40-follow" data-title="Suivi : transfert et guérison nutritionnelle"><p>La stabilisation permet un transfert lorsque le relais est sûr, mais ne signifie pas fin de traitement. Le poids doit être lu avec l’œdème et les prises ; absence d’amélioration appelle une réévaluation de maladie, prescription et mise en œuvre.</p><p>Pour MAS 6–59 mois, la fin demande habituellement P/T ≥-2 z, PB ≥ 125 mm et absence d’œdème sur deux visites/mesures, avec prise en charge des problèmes médicaux et sociaux. Discordances prolongées nécessitent décision clinique documentée ; pourcentage de poids gagné seul insuffisant.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FOLLOW — 4.9–4.10 et 7.13, encadré 28</a>.</p></template>
<template data-pop="e40-prevention" data-title="Prévenir la rechute : rendre les repas possibles"><p>Accès alimentaire, conseils adaptés, soins, soutien aidant, développement et prévention infectieuse font partie du parcours pédiatrique. Une prescription nutritionnelle sans possibilité de l’appliquer reste incomplète.</p><p>Chez l’adulte, identifier dépendance, problèmes de repas et maladies sous-jacentes, puis organiser suivi et soutien. Les besoins et la faisabilité se réévaluent ; aucun délai de guérison ni bénéfice intégral n’est garanti.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FOLLOW — 4.9–4.10 et 7.13, encadré 28</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a>.</p></template>
<template data-pop="e40-populations" data-title="Populations : les différences changent la conduite"><p>Avant six mois, croissance, dyade et allaitement occupent une place centrale ; six à cinquante-neuf mois, les critères OMS et circuits MAS sont différents ; chez l’adulte, GLIM/ESPEN apportent un autre cadre.</p><p>Grossesse/allaitement, insuffisances d’organe et âge modifient les précautions de produits. Le code E40 n’annule pas la FI, la fonction rénale ou le besoin d’une équipe spécialisée ; pas d’extension automatique des doses pédiatriques à tous adultes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a>.</p></template>
<template data-pop="e40-coding" data-title="Coder après avoir caractérisé"><p>La version OFS consultée est CIM-10-GM 2024. E40 n’a pas de sous-code décimal ; association au marasme vers E42, marasme seul E41 et malnutrition grave sans précision E43 selon documentation.</p><p>Un critère de programme OMS et un diagnostic GLIM adulte ne dictent pas seuls le code. Conserver maladie causale, phénotype nutritionnel et complications ; une nomenclature historique n’est pas un protocole de prescription.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a>.</p></template>
