<template data-pop="e40-sources-guides" data-title="Sources, niveaux de preuve et limites"><h3>Ce que le cours utilise</h3><p>Le cours repose sur vingt-quatre sources lues le 15.10.2026. Aucune n’est une recommandation suisse ou européenne propre au kwashiorkor. La conduite pédiatrique suit la recommandation de l’Organisation mondiale de la santé (OMS) de 2023, qui est internationale et non américaine. La conduite de l’adulte suit un consensus suisse et européen sur le syndrome de renutrition. Le tableau classe les sources par nature.</p><table class="t"><tr><th>Source</th><th>Nature</th><th>Ce qu’elle permet</th><th>Limite</th></tr><tr><td>OMS 2023, version 1.2 du 20.11.2023</td><td>Recommandation internationale</td><td>Définitions, orientation, sortie, ambulatoire</td><td>Version auto-générée non vérifiée par l’OMS ; contextes surtout à faibles ressources</td></tr><tr><td>Bhutta et al., Nat Rev Dis Primers 2017</td><td>Revue narrative</td><td>Épidémiologie, mécanismes, diagnostic, prise en charge</td><td>Études physiopathologiques anciennes et de petite taille</td></tr><tr><td>Dipasquale et al., Nutrients 2020</td><td>Revue narrative</td><td>Physiopathologie, clinique, traitement</td><td>Gradation de l’œdème différente ; une définition générale citée d’une société américaine n’est pas reprise</td></tr><tr><td>Tickell et Denno, Bull World Health Organ 2016</td><td>Revue de la filiation des recommandations de l’OMS</td><td>Prise en charge hospitalière</td><td>48,5 % des 33 recommandations reposent sur l’avis d’experts</td></tr><tr><td>Friedli 2018 ; Reber 2019</td><td>Consensus suisse et européen</td><td>Renutrition de l’adulte hospitalisé</td><td>Adulte, hors anorexie ; transposition pédiatrique non validée ; niveau de preuve faible</td></tr><tr><td>Cas cliniques</td><td>Observations</td><td>Illustrer les causes secondaires en Europe</td><td>Un cas ne fonde pas une recommandation ; plusieurs sont lus en résumé seul</td></tr><tr><td>Informations professionnelles suisses</td><td>Textes officiels</td><td>Doses de l’amoxicilline et de la thiamine</td><td>Pas d’indication spécifique à la malnutrition</td></tr></table><p>La lecture du tableau est la suivante. Pour un fait pédiatrique de prise en charge, la recommandation de l’OMS prévaut ; pour une dose en Suisse, l’information professionnelle prévaut ; pour la renutrition de l’adulte, le consensus suisse et européen prévaut ; un cas clinique illustre sans prouver.</p></template>
<template data-pop="e40-lacunes" data-title="Lacunes de la documentation"><h3>Ce que les sources lues ne permettent pas d’affirmer</h3><p>Le cours n’a retenu aucune donnée absente des sources lues. Les lacunes suivantes ont été identifiées et ne sont pas comblées de mémoire.</p><ul><li>Aucune recommandation suisse (Société suisse de pédiatrie, Société suisse d’endocrinologie, Swiss Medical Forum) ou européenne (ESPGHAN, société européenne de nutrition clinique) propre au kwashiorkor n’a été trouvée.</li><li>Les instructions de la Société suisse de pédiatrie sur l’alimentation végétarienne et végane de 2020 n’ont pas été lues (document inaccessible) ; seule la communication officielle l’a été.</li><li>La définition littérale des grades d’œdème de l’OMS n’a pas été lue ; les deux revues divergent.</li><li>La version de la recommandation de l’OMS utilisée est auto-générée et n’a pas été vérifiée par l’OMS.</li><li>Aucune source dédiée au diagnostic différentiel des œdèmes avec protéines basses (syndrome néphrotique, entéropathie exsudative, insuffisance hépatique) n’a été lue.</li><li>Aucune épidémiologie suisse et aucune correspondance vérifiée avec la CIM-11 n’ont été trouvées.</li><li>Aucune information professionnelle suisse pour le F-75, le F-100, le ReSoMal ni l’aliment thérapeutique prêt à l’emploi n’a été trouvée ; celles de la gentamicine et de la ceftriaxone n’ont pas été lues.</li><li>La conduite devant une hypothermie n’est pas documentée dans les sources lues.</li></ul></template>
<template data-pop="e40-albumine-prealbumine" data-title="Albumine, préalbumine et protéine liant le rétinol"><h3>Ce que mesurent ces protéines</h3><p>L’albumine, la préalbumine et la protéine liant le rétinol sont des protéines plasmatiques produites par le foie. Elles sont souvent utilisées pour juger l’état nutritionnel. Leur concentration dépend de l’hydratation : une hémodilution les abaisse, une déshydratation les élève. Une mesure isolée est donc peu informative, et les mesures sériées sont plus utiles (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><table class="t"><tr><th>Situation</th><th>Valeur publiée</th><th>Interprétation</th></tr><tr><td>Nourrisson, cas italien</td><td>Albumine 13,65 g/L ; protéines totales 30 g/L</td><td>Atteinte sévère dans un cas unique (<a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien, Nutr J 2015</a>)</td></tr><tr><td>Nourrisson, série française</td><td>Albumine 7 g/L avec sepsis sévère</td><td>Un cas de la série (<a href="https://doi.org/10.1016/j.lpm.2012.05.029" target="_blank" rel="noopener">Fourreau et al., Presse Méd 2013</a>)</td></tr><tr><td>Adulte après bypass</td><td>Albumine 24 g/L</td><td>Un cas (<a href="https://doi.org/10.1038/ejcn.2016.15" target="_blank" rel="noopener">cas après bypass, Eur J Clin Nutr 2016</a>)</td></tr></table><p>Ces valeurs viennent de cas isolés et ne sont pas des seuils. L’albumine corrèle mal avec l’importance de l’œdème et la vitesse de sa résolution (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>) ; elle ne sert donc ni à poser le diagnostic ni à décider de la guérison.</p></template>
<template data-pop="e40-oedeme-nutritionnel" data-title="Œdème nutritionnel : définition et recherche"><h3>Définition</h3><p>L’OMS 2023 définit l’œdème nutritionnel comme un œdème bilatéral prenant le godet, qui débute aux pieds et peut s’étendre aux jambes puis au reste du corps, visage compris. Il est pathognomonique de la malnutrition aiguë sévère (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>).</p><h3>Technique de recherche</h3><p>La revue de 2017 décrit une pression ferme de 3 à 5 secondes sur la face dorsale du pied, au niveau des troisième et quatrième os du tarse, puis une recherche de l’empreinte pendant 2 à 3 secondes (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). La recherche se fait des deux côtés, car la définition exige un œdème bilatéral.</p><h3>Pièges</h3><ul><li>L’œdème augmente le poids : un poids correct ne l’exclut pas.</li><li>Un œdème unilatéral ne correspond pas à la définition de l’œdème nutritionnel.</li><li>La gradation de l’œdème varie selon les sources (voir <button class="w" data-k="e40-gradation-oedeme">la comparaison des gradations</button>).</li></ul></template>
<template data-pop="e40-mas-def" data-title="Malnutrition aiguë sévère : critères de l’OMS 2023"><h3>Les trois critères</h3><p>Chez l’enfant de 6 à 59 mois, l’OMS 2023 définit la malnutrition aiguë sévère par la présence d’un œdème nutritionnel, ou d’un poids pour la taille (ou pour la longueur) sous −3 écarts-types, ou d’un périmètre brachial sous 115 mm. Un seul critère suffit (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, §1.4).</p><table class="t"><tr><th>Catégorie</th><th>Poids pour la taille</th><th>Périmètre brachial</th><th>Œdème</th></tr><tr><td>Sévère</td><td>Sous −3 écarts-types</td><td>Sous 115 mm</td><td>Présent suffit</td></tr><tr><td>Modérée</td><td>−3 à moins de −2 écarts-types</td><td>115 à moins de 125 mm</td><td>Absent</td></tr></table><p>La malnutrition modérée est définie sans œdème : un enfant œdémateux appartient donc toujours à la catégorie sévère. Le terme « malnutrition aiguë sévère » a remplacé l’ancienne malnutrition protéino-énergétique (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p></template>
<template data-pop="e40-anthropometrie" data-title="Périmètre brachial et poids pour la taille"><h3>Deux mesures, deux usages</h3><p>Le périmètre brachial est la circonférence du bras. Le poids pour la taille compare le poids d’un enfant à celui des enfants de même taille dans la population de référence de l’OMS, et s’exprime en écarts-types (z-score).</p><p>En présence d’œdème, le périmètre brachial est plus fiable que le poids pour la taille, parce que l’eau retenue augmente le poids (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>). Sans report des mesures sur les courbes de croissance, l’examen clinique est très imprécis (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><table class="t"><tr><th>Mesure</th><th>Seuil de malnutrition aiguë sévère</th><th>Sortie du traitement</th></tr><tr><td>Périmètre brachial</td><td>Inférieur à 115 mm</td><td>125 mm ou plus à deux visites</td></tr><tr><td>Poids pour la taille</td><td>Inférieur à −3 écarts-types</td><td>−2 écarts-types ou plus à deux visites</td></tr></table><p>Ces seuils concernent l’enfant de 6 à 59 mois (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>). Chez le nourrisson de moins de six mois, le seuil est un poids pour la longueur sous −3 écarts-types faute de mieux, et un périmètre brachial sous 110 mm est proposé après 60 jours (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p></template>
<template data-pop="e40-vih" data-title="Virus de l’immunodéficience humaine et malnutrition"><h3>Pourquoi le rechercher</h3><p>Le virus de l’immunodéficience humaine est présent chez 15 à 29 % des enfants hospitalisés pour malnutrition aiguë sévère en Afrique subsaharienne, et la mortalité hospitalière est alors multipliée par trois (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Il fait partie du bilan étiologique (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>).</p><h3>Conduite décrite</h3><p>L’alimentation thérapeutique est la même. Le traitement antirétroviral commence dès la stabilisation, quand l’appétit revient et que l’œdème sévère s’est résolu. La surveillance dure 6 à 8 semaines (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, recommandations de 2013 reprises). Les schémas antirétroviraux ne sont pas détaillés dans les sources lues.</p></template>
<template data-pop="e40-etymologie" data-title="Étymologie et histoire du terme"><h3>Un mot de la langue kwa</h3><p>« Kwashiorkor » vient de la langue kwa du Ghana et signifie « maladie du sevrage ». Le terme a été introduit par Cicely Williams en 1933 (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>). Les premières descriptions concernaient des enfants nourris de maïs, régime pauvre en protéines et riche en glucides (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><p>Le nom rappelle une circonstance fréquente d’apparition, le passage de l’allaitement à une alimentation insuffisante en protéines. Il ne prouve pas à lui seul la cause du kwashiorkor, dont le mécanisme reste inconnu.</p></template>
<template data-pop="e40-glycolyse" data-title="Glycolyse et réponses métaboliques comparées"><h3>Ce qu’est la glycolyse</h3><p>La glycolyse est la dégradation du glucose en fragments plus petits, qui libère de l’énergie. Cette définition relève d’un rappel de physiologie générale et non des sources du dossier.</p><h3>Deux réponses à la privation</h3><table class="t"><tr><th>Élément</th><th>Marasme</th><th>Kwashiorkor</th></tr><tr><td>Réponse métabolique</td><td>Adaptée au jeûne : lipolyse, fonte musculaire</td><td>Régime riche en glucides et pauvre en protéines : glycolyse entretenue</td></tr><tr><td>Protéolyse</td><td>Plus élevée</td><td>Plus basse que dans l’émaciation sévère</td></tr><tr><td>Acides aminés essentiels</td><td>Moins abaissés</td><td>Plus abaissés</td></tr><tr><td>Glucose</td><td>Non précisé</td><td>Production endogène réduite ; hypoglycémie fréquente</td></tr></table><p>Source : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>. La lecture de ce tableau est que le kwashiorkor combine un apport énergétique qui entretient le métabolisme des glucides et un catabolisme protéique trop faible pour fournir les acides aminés nécessaires.</p></template>
<template data-pop="e40-gradation-oedeme" data-title="Gradation de l’œdème : comparaison des sources"><h3>Positions en présence</h3><table class="t"><tr><th>Source</th><th>Gradation</th><th>Remarque</th></tr><tr><td>Bhutta et al., 2017</td><td>1+ : pieds et bas des jambes ; 2+ : atteinte des bras ; 3+ : visage</td><td>Trois niveaux</td></tr><tr><td>Dipasquale et al., 2020</td><td>Grade I : pédieux ; II : facial ; III : paravertébral et thoracique ; IV : avec ascite</td><td>Quatre grades ; ordre des atteintes différent</td></tr><tr><td>OMS 2023</td><td>« Œdème nutritionnel sévère (+++) » comme critère d’hospitalisation</td><td>Définition littérale des signes +, ++, +++ non lue</td></tr></table><h3>Choix retenu</h3><p>Les deux revues ne placent pas l’atteinte du visage au même rang : troisième niveau pour la revue de 2017, deuxième grade pour celle de 2020. La source la plus récente est la recommandation de l’OMS de 2023, mais sa définition des niveaux n’a pas été lue. Ce cours retient la gradation à trois niveaux de 2017, parce qu’elle correspond à la notation +++ de l’OMS, et il rappelle de toujours citer la gradation employée. L’accès aux textes est donné ici : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>, <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>, <a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>.</p></template>
<template data-pop="e40-mucoviscidose" data-title="Mucoviscidose et kwashiorkor"><h3>Une cause à ne pas manquer</h3><p>La mucoviscidose avec insuffisance pancréatique peut se révéler par un kwashiorkor chez le nourrisson, y compris malgré un dépistage néonatal normal. Un cas nord-américain concerne un nourrisson de 6 mois (<a href="https://doi.org/10.3389/fped.2022.1083155" target="_blank" rel="noopener">cas de mucoviscidose, Front Pediatr 2023</a>) et un cas brésilien un nourrisson de 3 mois avec une dermatose sévère (<a href="https://doi.org/10.1093/tropej/fmz008" target="_blank" rel="noopener">cas de mucoviscidose, J Trop Pediatr 2019</a>).</p><p>Le test de la sueur et la génétique sont demandés en cas de suspicion (<a href="https://doi.org/10.3389/fped.2022.1083155" target="_blank" rel="noopener">cas de mucoviscidose, Front Pediatr 2023</a>). Le traitement décrit associe enzymes pancréatiques, vitamines, albumine, furosémide et potassium. Ce sont des observations de cas, non des recommandations.</p></template>
<template data-pop="e40-bariatrique" data-title="Chirurgie bariatrique et kwashiorkor de l’adulte"><h3>Un kwashiorkor secondaire</h3><p>Après une chirurgie bariatrique à dérivation distale sans suivi, un kwashiorkor peut survenir chez l’adulte avec une dermatose eczématiforme, un œdème diffus et une ascite (<a href="https://doi.org/10.1016/j.ejogrb.2025.02.003" target="_blank" rel="noopener">cas belge, Eur J Obstet Gynecol 2025</a> ; <a href="https://doi.org/10.1038/ejcn.2016.15" target="_blank" rel="noopener">cas après bypass, Eur J Clin Nutr 2016</a> ; <a href="https://doi.org/10.1016/j.annder.2014.11.006" target="_blank" rel="noopener">Boutin et al., Ann Dermatol Vénéréol 2015</a> ; <a href="https://doi.org/10.14309/crj.0000000000002260" target="_blank" rel="noopener">cas d’ascite après chirurgie bariatrique, 2026</a>). Il faut demander le protocole opératoire (<a href="https://doi.org/10.1038/ejcn.2016.15" target="_blank" rel="noopener">cas après bypass, Eur J Clin Nutr 2016</a>).</p><p>Pendant la grossesse, le kwashiorkor maternel s’accompagne d’un retard de croissance intra-utérin sévère ; la nutrition parentérale a permis une amélioration rapide et une reprise de la croissance fœtale (<a href="https://doi.org/10.1016/j.ejogrb.2025.02.003" target="_blank" rel="noopener">cas belge, Eur J Obstet Gynecol 2025</a>). Après bypass, la nutrition parentérale, la nutrition entérale par gastrostomie et la chirurgie de révision ont été utilisées (<a href="https://doi.org/10.1038/ejcn.2016.15" target="_blank" rel="noopener">cas après bypass, Eur J Clin Nutr 2016</a>), et dans un cas la seule supplémentation protéique a suffi (<a href="https://doi.org/10.1016/j.annder.2014.11.006" target="_blank" rel="noopener">Boutin et al., Ann Dermatol Vénéréol 2015</a>). Ces observations ne constituent pas des recommandations.</p></template>
<template data-pop="e40-boissons-vegetales" data-title="Boissons végétales utilisées comme lait"><h3>Ce que montrent les cas et la revue</h3><p>Les boissons végétales ont des limites nutritionnelles chez le nourrisson et l’enfant. Au moins trente cas pédiatriques de maladie nutritionnelle liés à leur consommation quasi exclusive ont été publiés : le riz s’associe au kwashiorkor, le soja au rachitisme, l’amande à l’alcalose métabolique (<a href="https://doi.org/10.20960/nh.931" target="_blank" rel="noopener">Vitoria, Nutr Hosp 2017</a>, résumé).</p><p>Un nourrisson italien eczémateux a été nourri exclusivement de boisson de riz sur conseil naturopathique (<a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien, Nutr J 2015</a>). Dans une série française de quatre nourrissons, l’un a présenté un kwashiorkor avec une albumine à 7 g/L et un sepsis sévère après deux mois de boisson de riz (<a href="https://doi.org/10.1016/j.lpm.2012.05.029" target="_blank" rel="noopener">Fourreau et al., Presse Méd 2013</a>). Un cas nord-américain a décrit une allergie alimentaire mal diagnostiquée à l’origine d’une malnutrition sévère (<a href="https://doi.org/10.1542/peds.2012-2362" target="_blank" rel="noopener">Pediatrics 2013</a>).</p><p>Ces textes sont des observations et une revue lue en résumé seul. La communication officielle suisse de 2020 ne traite pas les boissons végétales (<a href="https://www.fr.ch/diaf/saav/actualites/nouveaux-outils-de-conseil-sur-lalimentation-vegetarienne-et-vegetalienne-des-enfants-en-bas-age" target="_blank" rel="noopener">communiqué OSAV et SSP, 2020</a>).</p></template>
<template data-pop="e40-letalite" data-title="Létalité du kwashiorkor et déterminants"><h3>Chiffres</h3><p>La létalité hospitalière des formes compliquées est de 12 % à plus de 20 % (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). En Afrique subsaharienne, 10 à 40 % des enfants meurent malgré l’application des recommandations (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>). Le virus de l’immunodéficience humaine, présent chez 15 à 29 % des enfants hospitalisés, triple la mortalité hospitalière (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p><h3>Après la sortie</h3><p>La mortalité après la sortie reste élevée, par pneumonie et diarrhée. Au Malawi, 25 % des enfants sortis meurent dans les 12 mois (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>). Le co-trimoxazole préventif s’est montré inefficace au Kenya (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p><p>Ces chiffres viennent de contextes à faibles ressources ; ils ne s’appliquent pas directement à la Suisse, où aucune donnée n’a été trouvée.</p></template>
<template data-pop="e40-hypoalbuminemie" data-title="Hypoalbuminémie et œdème"><h3>Ce que les sources établissent</h3><p>L’hypoalbuminémie est présente dans le kwashiorkor, et la synthèse hépatique d’albumine est réduite (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Son degré et sa correction corrèlent pourtant mal avec l’importance de l’œdème et la vitesse de sa résolution : d’autres facteurs interviennent (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p><p>Conclusion pratique : l’albumine ne prédit ni la gravité de l’œdème ni sa guérison. Elle ne remplace pas l’examen clinique.</p></template>
<template data-pop="e40-pompe" data-title="Pompe sodium-potassium et rétention d’eau"><h3>Mécanisme proposé</h3><p>La pompe sodium-potassium est une enzyme membranaire qui maintient le sodium hors de la cellule et le potassium à l’intérieur. Cette description relève du rappel de physiologie générale. Les revues proposent que sa baisse d’activité, associée à une perméabilité membranaire accrue, entraîne une rétention de sodium et une déplétion en potassium des cellules (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a> ; <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p><p>Ce mécanisme est une hypothèse. Il contribue à l’œdème, sans l’expliquer seul.</p></template>
<template data-pop="e40-glucose-hypo" data-title="Hypoglycémie du kwashiorkor"><h3>Pourquoi elle est fréquente</h3><p>La production endogène de glucose est réduite dans le kwashiorkor, et la réponse insulinique du pancréas est émoussée (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). L’enfant ne peut pas compenser un jeûne prolongé.</p><h3>Conduite décrite</h3><p>Chez l’enfant conscient : 50 mL de glucose à 10 % par la bouche ou par sonde, puis du F-75 toutes les 30 minutes pendant 2 heures. Chez l’enfant inconscient, léthargique ou convulsant : glucose à 10 % par voie intraveineuse, 5 mL/kg, puis 50 mL par la bouche (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>). Ces recommandations ne citent pas de preuve. Aucun seuil numérique de glycémie n’est donné dans les sources lues.</p></template>
<template data-pop="e40-foie-steatose" data-title="Stéatose hépatique, hépatomégalie et abdomen distendu"><h3>Ce qui est décrit</h3><p>La stéatose hépatique est caractéristique du kwashiorkor (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Elle n’est pas expliquée par un défaut de sécrétion des lipoprotéines de très basse densité ; une dysfonction mitochondriale et une oxydation lipidique altérée sont suspectées. Cliniquement, l’abdomen est distendu et le foie est palpable (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><p>Le foie gros se distingue de l’ascite, qui est un épanchement liquidien : la revue de 2020 place l’ascite au grade IV de l’œdème (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>) et un cas d’adulte la décrit (<a href="https://doi.org/10.14309/crj.0000000000002260" target="_blank" rel="noopener">cas d’ascite après chirurgie bariatrique, 2026</a>).</p></template>
<template data-pop="e40-stress-oxydatif" data-title="Stress oxydatif : association ou cause ?"><h3>Constat et limite</h3><p>Les concentrations de vitamine E et de glutathion sont plus basses dans le kwashiorkor que dans l’émaciation. Ces deux molécules protègent les cellules contre l’oxydation. Cependant, un grand essai d’antioxydants au Malawi n’a pas réduit l’incidence du kwashiorkor (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p><p>L’association entre stress oxydatif et kwashiorkor est donc établie, la causalité ne l’est pas. Aucun traitement antioxydant n’est recommandé.</p></template>
<template data-pop="e40-microbiote" data-title="Microbiote intestinal"><h3>Observation et démonstration</h3><p>Chez des jumeaux du Malawi dont l’un a un kwashiorkor, le microbiote intestinal est immature et peu diversifié. Le transfert de selles d’un enfant atteint à la souris aggrave la perte de poids (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p><p>La première observation est humaine, la seconde est expérimentale chez l’animal. Aucune conclusion thérapeutique n’en est tirée chez l’enfant dans les sources lues.</p></template>
<template data-pop="e40-axes-endocriniens" data-title="Axes endocriniens dans la malnutrition aiguë sévère"><h3>Dosages décrits</h3><table class="t"><tr><th>Axe ou hormone</th><th>Observation</th><th>Source</th></tr><tr><td>Cortisol</td><td>Normal ou élevé ; axe hypothalamo-hypophyso-surrénalien préservé</td><td><a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a></td></tr><tr><td>Fonction thyroïdienne</td><td>Abaissée ; portée clinique incertaine</td><td>Bhutta 2017</td></tr><tr><td>Leptine</td><td>Basse ; inversement associée à la mortalité</td><td>Bhutta 2017</td></tr><tr><td>Triiodothyronine, insuline, facteur de croissance analogue à l’insuline de type 1</td><td>Bas</td><td><a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a></td></tr><tr><td>Hormone de croissance et cortisol</td><td>Élevés</td><td>Dipasquale 2020</td></tr></table><p>Ces dosages sont des constats. Les sources lues n’en tirent pas de décision thérapeutique ni d’interprétation détaillée.</p></template>
<template data-pop="e40-immunite" data-title="Immunité dans la malnutrition aiguë sévère"><h3>Atteintes décrites</h3><p>Le thymus, les ganglions et les amygdales sont atrophiés. Les lymphocytes CD4 sont diminués, l’hypersensibilité retardée est perdue, la phagocytose et les immunoglobulines A sécrétoires sont réduites. L’ensemble favorise les infections invasives (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><p>L’hypersensibilité retardée est la réaction cutanée tardive à un antigène, signe d’une immunité cellulaire fonctionnelle. Cette définition relève du rappel de physiologie générale.</p></template>
<template data-pop="e40-intestin" data-title="Atteinte intestinale et pancréatique"><h3>Lésions et conséquences</h3><p>La muqueuse du grêle présente une atrophie des villosités, une perte des disaccharidases et une pullulation bactérienne. Le pancréas est atrophique. Il en résulte une malabsorption, et l’on décrit aussi une entéropathie environnementale (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a> ; <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p><p>La malabsorption explique la diarrhée et le retard de récupération. Elle justifie des apports progressifs plutôt que massifs.</p></template>
<template data-pop="e40-coeur" data-title="Atteinte cardiaque"><h3>Constat nuancé</h3><p>L’atrophie myocardique et un débit cardiaque réduit sont décrits, surtout dans le kwashiorkor. La plus grande étude, menée chez des enfants non gravement malades, ne trouve pas de différence majeure (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). On décrit aussi bradycardie, hypotension et risque d’arythmie en présence de troubles électrolytiques (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><p>Les données sont donc contradictoires. La prudence avec les liquides par voie intraveineuse reste de règle.</p></template>
<template data-pop="e40-cerveau" data-title="Atteinte cérébrale"><h3>Constat</h3><p>Une atrophie cérébrale et une irritabilité sont décrites dans le kwashiorkor, alors que l’émaciation s’accompagne plutôt d’apathie (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). À long terme, un retard neurodéveloppemental, des troubles du comportement et une moindre réussite scolaire sont rapportés (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Les effets sur le cerveau en développement sont possiblement irréversibles après 3 à 4 ans (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p></template>
