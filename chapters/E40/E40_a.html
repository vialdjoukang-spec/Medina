"1"]{left:52%; top:6%}[data-e40-figure="villus"] [data-e40-mark="2"]{left:21%; top:32%}[data-e40-figure="villus"] [data-e40-mark="3"]{left:52%; top:53%}[data-e40-figure="villus"] [data-e40-mark="4"]{left:64%; top:50%}[data-e40-figure="liver"] [data-e40-mark="1"]{left:55%; top:52%}[data-e40-figure="liver"] [data-e40-mark="2"]{left:66%; top:74%}[data-e40-figure="liver"] [data-e40-mark="3"]{left:77%; top:32%}[data-e40-figure="esoph"] [data-e40-mark="1"]{left:38%; top:8%}[data-e40-figure="esoph"] [data-e40-mark="2"]{left:36%; top:37%}[data-e40-figure="esoph"] [data-e40-mark="3"]{left:45%; top:55%}</style><div class="panel" id="pA"><nav class="toc ui"><b>Plan monographique</b><ol><li><a href="#e40-1">Définition</a></li><li><a href="#e40-2">Épidémiologie</a></li><li><a href="#e40-3">Physiopathologie</a></li><li><a href="#e40-4">Démarche clinique</a></li><li><a href="#e40-5">Anamnèse</a></li><li><a href="#e40-6">Examen clinique</a></li><li><a href="#e40-7">Syndromes</a></li><li><a href="#e40-8">Diagnostic positif</a></li><li><a href="#e40-9">Explorations</a></li><li><a href="#e40-10">Arbre diagnostique et diagnostics différentiels</a></li><li><a href="#e40-11">Prise en charge</a></li><li><a href="#e40-12">Prévention, suivi et pronostic</a></li><li><a href="#e40-13">Points clés</a></li><li><a href="#e40-14">Pièges</a></li></ol></nav><div class="chap-body" data-semiology-clinical="E40"><section class="ilot" id="e40-question" ><h2>Un poids rassurant peut-il cacher une urgence nutritionnelle ?</h2><p><b>Vignette fictive.</b> Un enfant de vingt mois présente des pieds gonflés, un appétit réduit et une modification des cheveux. Son poids paraît moins bas qu’attendu. Dans un autre dossier, une personne âgée perd du muscle, mange peu et développe des œdèmes après une reprise alimentaire. Ces deux situations exigent une évaluation, mais ni les critères ni les prescriptions ne sont interchangeables.</p><p>Le liquide retenu peut masquer une perte de tissu. Il faut reconnaître le signe, rechercher une cause et une urgence, puis appliquer le référentiel de la population. L’œdème nutritionnel pédiatrique, le diagnostic de dénutrition adulte et le syndrome de renutrition désignent des questions différentes.</p><div class="key"><b>À retenir.</b> L’œdème ne prouve pas sa cause ; le poids ne mesure pas seul les réserves nutritionnelles.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a>.</p></section>
<section class="ilot" id="e40-1" ><h2>1. Définition : un phénotype et un code précis</h2><p>Le <button class="w" data-k="e40-definition">kwashiorkor</button> désigne une forme grave de malnutrition avec <button class="w" data-k="e40-nutritional-edema">œdème nutritionnel</button>, souvent associée à des anomalies de peau, des cheveux et à une hépatomégalie. L’OMS/UNICEF souligne en 2026 que sa cause exacte et les raisons de sa différence avec le marasme restent imparfaitement comprises. Le réduire à un manque isolé de protéines est insuffisant.</p><p>Dans la nomenclature OFS <b>CIM-10-GM 2024</b>, E40 correspond à une malnutrition grave avec œdème nutritionnel et dépigmentation de la peau et des cheveux. Le kwashiorkor avec marasme est exclu vers <b>E42</b>. Il n’existe pas de sous-code décimal E40.x dans cette version. Le <button class="w" data-k="e40-coding">codage</button> suit la situation documentée ; il ne transforme pas toute hypoalbuminémie en E40.</p><p>E41 désigne le <button class="w" data-k="e40-marasmus">marasme nutritionnel</button> ; E42 associe marasme et kwashiorkor. E43 inclut l’œdème de famine et la malnutrition protéino-énergétique grave sans précision. Ces libellés historiques ne remplacent pas une évaluation contemporaine par âge et contexte.</p><figure data-e40-figure="kwa"><div data-e40-frame="tall"><img src="assets/img/e40/alpha/codex/kwashiorkor.jpg" alt="Portrait historique d’un enfant dont la source décrit un kwashiorkor, cheveux fins, joues arrondies et lésions commissurales" loading="lazy"><span data-e40-mark="1" aria-hidden="true">1</span><span data-e40-mark="2" aria-hidden="true">2</span><span data-e40-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Cheveux fins et irréguliers, signes décrits dans la provenance.</li><li>Joue arrondie : l’inspection seule ne démontre pas le godet ni sa cause.</li><li>Lésion commissurale visible : à examiner, sans identifier une carence vitaminique sur la photographie seule.</li></ol><p>Portrait historique, pas un test diagnostique. La légende de 1970 réduit la cause aux protéines/vitamines ; cette explication n’est pas reprise comme connaissance actuelle. Aucun taux d’albumine ni grade d’œdème des pieds n’est visible.</p><p data-e40-credit>Centers for Disease Control and Prevention, photographie 1970, PHIL 6180 · <a href="https://commons.wikimedia.org/wiki/File:Kwashiorkor_6180.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public, œuvre USGov</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a>.</p><p><button class="w" data-k="e40-exp-1">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-1">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-2" ><h2>2. Épidémiologie : conserver le dénominateur</h2><p>Aucune incidence suisse directe d’E40 ni fréquence mondiale actuelle spécifique au kwashiorkor n’a été retenue dans cette recherche. Les chiffres de toute dénutrition ou de toute émaciation ne peuvent pas être rebaptisés fréquence d’E40. Les études de malnutrition sévère de l’enfant concernent des populations et des circuits de soins précis.</p><p>Le guide OMS/UNICEF vise les moins de cinq ans. La malnutrition œdémateuse y est un marqueur de gravité nécessitant une attention spécifique. La revue immunologique de Rytter et collègues rassemble surtout des travaux anciens chez des enfants de un à soixante mois ; elle éclaire les mécanismes et leurs limites, sans fournir une prévalence suisse actuelle.</p><p>Chez l’adulte, une dénutrition peut accompagner une réduction des apports, une malabsorption ou une maladie inflammatoire. Son existence, sa sévérité et l’explication des œdèmes doivent être établies séparément. Un code rare n’autorise ni à négliger un malade ni à appeler kwashiorkor tout œdème de personne fragile.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a>.</p><p><button class="w" data-k="e40-exp-2">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-2">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-3" ><h2>3. Physiopathologie : compartiments, réserves et adaptation</h2><p>Les nutriments doivent être ingérés, digérés, absorbés et utilisés. Les acides aminés et les sucres gagnent les capillaires intestinaux ; les lipides longs sont notamment exportés en chylomicrons dans les chylifères lymphatiques. Une difficulté d’accès à la nourriture, de déglutition, de digestion ou d’absorption n’a donc pas la même cible thérapeutique.</p><p>L’<button class="w" data-k="e40-albumin">albumine</button> participe à la pression oncotique plasmatique, mais la distribution de l’eau dépend aussi des pressions hydrostatiques, de la barrière capillaire, de la matrice interstitielle et du drainage lymphatique. Le <button class="w" data-k="e40-starling">raisonnement sur les échanges liquidiens</button> ne se réduit pas à « albumine basse donc œdème nutritionnel ». Une étude de deux cohortes pédiatriques publiée en 2022 montre des associations avec l’albumine et avec des mécanismes indépendants ; les auteurs soulignent les limites de causalité et l’absence de données détaillées rénales et cardiaques.</p><p>Après un jeûne ou des apports très réduits, le retour des glucides augmente les besoins en thiamine et en phosphate et modifie la répartition du potassium, du magnésium et de l’eau. Le <button class="w" data-k="e40-refeeding">syndrome de renutrition</button> peut provoquer une défaillance d’organe ; il n’est pas synonyme de kwashiorkor. Les interactions entre barrière digestive, infection et <button class="w" data-k="e40-microbiome">écosystème intestinal</button> sont plausibles et complexes ; elles ne justifient pas un traitement du microbiote non démontré.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/23-7-chemical-digestion-and-absorption-a-closer-look" target="_blank" rel="noopener">NORMAL-GUT — Digestion protéines et absorption glucides, protéines, lipides</a> ; <a data-reference-source="1" href="https://ec.europa.eu/programmes/erasmus-plus/project-result-content/d6eb4036-767f-4d49-bdde-70a1657290ee/Anatomy_Physiology_LymphSystem.pdf" target="_blank" rel="noopener">NORMAL-LYMPH — Fonctions lymphatiques et organisation immune</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-MECH — Résumé, introduction et discussion</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-LIMIT — Fin discussion et limites</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a>.</p><p><button class="w" data-k="e40-exp-3">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-3">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-4" ><h2>4. Démarche clinique : trier, caractériser, expliquer</h2><ol><li><b>Trier l’urgence.</b> Vérifier conscience, respiration, perfusion, température, glycémie et possibilité de boire/manger. Une instabilité impose une prise en charge immédiate.</li><li><b>Caractériser l’œdème.</b> Bilatéral ou non, début aux pieds ou ailleurs, godet, extension, vitesse d’apparition et signes associés.</li><li><b>Évaluer la nutrition.</b> Histoire pondérale et alimentaire, muscle, mesures adaptées à l’âge, contexte de croissance et maladies.</li><li><b>Rechercher l’étiologie.</b> Apports insuffisants, assimilation, infection/inflammation, pertes rénales ou digestives, fonction hépatique/cardiaque et médicaments.</li><li><b>Choisir le circuit.</b> Enfant de moins de six mois, enfant de six à cinquante-neuf mois ou adulte : critères, aliments thérapeutiques et prescriptions distincts.</li></ol><p>Le bilan détaillé ne doit pas retarder la stabilisation. L’<button class="w" data-k="e40-anthropometry">anthropométrie</button> mesure une dimension du problème ; elle ne remplace pas le jugement clinique ni la recherche d’une maladie sous-jacente.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a>.</p><p><button class="w" data-k="e40-exp-4">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-4">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-5" ><h2>5. Anamnèse : ce qui entre, ce qui est perdu et ce qui a changé</h2><p>Reconstituer la <button class="w" data-k="e40-history">trajectoire alimentaire et pondérale</button> : poids antérieur fiable, durée de restriction, diversification ou allaitement, quantités réellement consommées, vomissements, diarrhée, douleur, dysphagie et difficultés fonctionnelles. Demander comment les repas sont préparés et donnés ; une prescription sur papier n’est pas une prise effective.</p><p>Explorer les maladies connues, les infections possibles, la malabsorption, les pertes digestives, les symptômes urinaires, la dyspnée et les médicaments. Chez l’adulte, rechercher aussi le contexte social, la dépendance, l’alcool et les obstacles aux courses ou à la cuisine. Un régime restrictif se décrit concrètement sans attribuer d’emblée une carence à une identité alimentaire.</p><p>Chez l’enfant, inclure le développement, les interactions pendant les repas et la santé physique et psychique de la personne qui le nourrit. Avant six mois, la dyade et l’allaitement sont centraux. Le récit doit aussi dater une éventuelle reprise des apports : une nouvelle dégradation après renutrition impose une autre enquête qu’un œdème déjà présent à l’arrivée.</p><figure data-e40-figure="esoph"><div data-e40-frame="tall"><img src="assets/img/e40/alpha/codex/gray1033.png" alt="Coupe histologique historique de l’œsophage humain, épithélium stratifié, sous-muqueuse glandulaire et couches musculaires" loading="lazy"><span data-e40-mark="1" aria-hidden="true">1</span><span data-e40-mark="2" aria-hidden="true">2</span><span data-e40-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Revêtement épithélial stratifié, protection contre les frottements.</li><li>Sous-muqueuse et glandes, à distinguer de la muqueuse.</li><li>Couches musculaires, nécessaires à la propulsion du bol alimentaire.</li></ol><p>Architecture humaine normale, pas lésion nutritionnelle ni mesure de déglutition. Une dysphagie peut limiter les apports, mais ne se diagnostique pas sur cette planche et ne signifie pas E40 à elle seule.</p><p data-e40-credit>Gray, Anatomy of the Human Body, édition 1918, planche 1033, coupe humaine d’après dessin de V. Horsley · <a href="https://commons.wikimedia.org/wiki/File:Gray1033.png" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FOLLOW — 4.9–4.10 et 7.13, encadré 28</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a>.</p><p><button class="w" data-k="e40-exp-5">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-5">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-6" ><h2>6. Examen clinique : chercher le signe et ses limites</h2><p>Évaluer d’abord état général et signes vitaux. Le <button class="w" data-k="e40-pitting">godet</button> correspond à une dépression qui persiste après une pression. Dans l’annexe 3 du guide OMS/UNICEF 2026, exercer une pression modérée pendant <b>trois secondes</b> sur le dos du pied ou la face antérieure du tibia, relâcher, comparer les deux côtés et examiner l’extension. Le signe est réel ; sa cause reste à établir.</p><table class="t"><thead><tr><th>Grade OMS/UNICEF 2026</th><th>Distribution de l’œdème nutritionnel chez l’enfant</th></tr></thead><tbody><tr><td>+</td><td>Les deux pieds seulement</td></tr><tr><td>++</td><td>Les deux pieds et les jambes</td></tr><tr><td>+++</td><td>Pieds et jambes avec toute autre partie du corps, dont visage</td></tr></tbody></table><p>Cette <button class="w" data-k="e40-grade">gradation</button> est celle du guide 2026 : une extension aux mains ou aux bras relève donc de +++ et ne doit pas être reprise sous++ à partir d’une autre version. Chez les six à cinquante-neuf mois avec malnutrition aiguë sévère,+++ est un motif d’hospitalisation immédiate.</p><p>Examiner <button class="w" data-k="e40-skin">peau, cheveux et muqueuses</button>, muscle, température périphérique, respiration, signes de déshydratation ou de surcharge et <button class="w" data-k="e40-liver-exam">volume hépatique</button>. La décoloration ou une dermatose peut soutenir un tableau, sans être spécifique. Un poids augmenté par l’eau et un IMC apparemment préservé peuvent masquer une perte de tissu.</p><figure data-e40-figure="edema"><div data-e40-frame="tall"><img src="assets/img/e40/alpha/codex/pitting.jpg" alt="Photographie d’un godet de jambe chez une personne avec insuffisance hépatique terminale selon la source, diagnostic différentiel" loading="lazy"><span data-e40-mark="1" aria-hidden="true">1</span><span data-e40-mark="2" aria-hidden="true">2</span><span data-e40-mark="3" aria-hidden="true">3</span></div><figcaption><b>Lecture de l’original.</b><ol><li>Dépression persistante après pression : aspect du godet.</li><li>Peau rouge et altérée : observation propre à cette image, sans spécificité nutritionnelle.</li><li>Segment supérieur de la jambe : l’étendue et la bilatéralité demandent un examen complet.</li></ol><p>La provenance précise une insuffisance hépatique terminale. Ce n’est pas une photographie de kwashiorkor. Le godet est un signe partagé ; il ne distingue pas seul cause rénale, hépatique, cardiaque ou nutritionnelle.</p><p data-e40-credit>James Heilman, MD, photographie personnelle, 2008 · <a href="https://commons.wikimedia.org/wiki/File:Pitting_Edema2008.jpg" target="_blank" rel="noopener">Provenance</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a>. Pixels originaux inchangés ; repères et légende HTML ajoutés par MEDINA sous la même licence. Auto-relecture visuelle IA, sans validation médicale humaine.</p></figcaption></figure><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Évaluation nutritionnelle, examen peau-cheveux ; symptômes œdème, perte de poids et malnutrition</a>.</p><p><button class="w" data-k="e40-exp-6">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-6">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-7" ><h2>7. Syndromes : associer sans tout confondre</h2><p><b>Malnutrition œdémateuse.</b> Œdèmes bilatéraux d’allure nutritionnelle, contexte d’apports ou de maladie et signes associés ; la maigreur peut être masquée. Un marasme associé conduit à une autre catégorie de codage qu’un E40 isolé.</p><p><b>Déplétion tissulaire et inflammation.</b> Chez l’adulte, la perte pondérale, le faible muscle ou l’IMC bas s’interprètent avec une cause étiologique. Le <button class="w" data-k="e40-glim">cadre GLIM</button> n’identifie pas à lui seul la cause d’un œdème.</p><p><b>Instabilité aiguë.</b> <button class="w" data-k="e40-shock">Hypoperfusion ou choc</button>, altération de conscience, détresse respiratoire, infection sévère, trouble de température ou <button class="w" data-k="e40-glucose">hypoglycémie</button> réclament un traitement urgent adapté. L’œdème périphérique ne prouve pas que le volume circulant est suffisant.</p><p><b>Renutrition et défaillance métabolique.</b> Après reprise des apports, une nouvelle dyspnée, tachycardie, faiblesse, confusion ou rétention hydrique peut relever de renutrition, de sepsis ou d’une autre complication. Les diagnostics ne s’excluent pas par une seule observation.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a>.</p><p><button class="w" data-k="e40-exp-7">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-7">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-8" ><h2>8. Diagnostic positif : séparer les référentiels</h2><table class="t"><thead><tr><th>Population</th><th>Critères et portée</th></tr></thead><tbody><tr><td>Enfant 6–59 mois, OMS/UNICEF 2026</td><td>Malnutrition aiguë sévère si œdème nutritionnel OU périmètre brachial<115 mm OU poids/taille ou poids/longueur<-3 z ; l’un suffit. Le caractère nutritionnel de l’œdème suppose une évaluation différentielle.</td></tr><tr><td>Nourrisson<6 mois</td><td>Dans ce guide, MAS si œdème nutritionnel ou poids/longueur<-3 z. Entre 6 semaines et 6 mois, PB<110 mm indique risque de mauvaise croissance/développement ; ce n’est pas à lui seul un critère MAS.</td></tr><tr><td>Adulte, GLIM 2025</td><td>Après dépistage, au moins un critère phénotypique (perte de poids, IMC bas ou muscle réduit) et un étiologique (apports/assimilation réduits ou inflammation/charge morbide). Hypoalbuminémie seule insuffisante.</td></tr><tr><td>Code E40, OFS 2024</td><td>Documentation de malnutrition grave avec œdème nutritionnel et dépigmentation peau/cheveux ; E42 si association avec marasme. Aucun E40.x inventé.</td></tr></tbody></table><p>Le <button class="w" data-k="e40-muac">périmètre brachial</button> et le <button class="w" data-k="e40-zscore">z-score de croissance</button> demandent technique, âge et référence corrects. Chez l’adulte, la sévérité GLIM repose sur les critères phénotypiques ; il faut tenir compte de l’eau dans le poids et les mesures corporelles. Un seuil pédiatrique de bras ne se transpose pas à la personne âgée.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a>.</p><p><button class="w" data-k="e40-exp-8">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-8">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-9" ><h2>9. Explorations : une question par résultat</h2><p>Le <button class="w" data-k="e40-tests">bilan biologique</button> recherche complications et causes : glycémie, phosphate, potassium, magnésium et fonction rénale selon état et risque ; hémogramme, inflammation et bilan hépatique selon contexte. Albumine basse peut refléter plusieurs mécanismes ; elle ne mesure pas seule l’apport protéique ni la gravité de toute dénutrition.</p><p>La <button class="w" data-k="e40-urine">recherche de protéinurie</button> aide à reconnaître une cause rénale. Une bandelette positive demande interprétation puis quantification et bilan appropriés. La <button class="w" data-k="e40-crp">CRP</button> peut soutenir la présence d’inflammation, mais une infection ne se résume pas à un chiffre et une CRP normale n’exclut pas toutes les causes d’œdème.</p><p>Échographie, examens digestifs, infectieux ou cardiologiques sont orientés par les signes et l’histoire. Des marqueurs de matrice ou de microbiote étudiés en recherche ne sont pas des tests diagnostiques de routine d’E40. Aucun examen ne doit retarder la correction d’une urgence.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-LIMIT — Fin discussion et limites</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a>.</p><p><button class="w" data-k="e40-exp-9">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-9">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-10" ><h2>10. Arbre diagnostique et diagnostics différentiels</h2><ol><li><b>Patient instable ?</b> Stabilisation et bilan urgent appropriés avant un débat de codage.</li><li><b>Œdème asymétrique, douloureux, rouge ou de début inhabituel ?</b> Rechercher une cause locale, vasculaire ou infectieuse ; ne pas classer automatiquement nutritionnel.</li><li><b>Œdème bilatéral ?</b> Chercher protéinurie, atteinte cardiaque/hépatique, pertes digestives, médicaments et contexte nutritionnel.</li><li><b>Dénutrition établie ?</b> Préciser âge, phénotype, cause et degré d’instabilité ; identifier marasme associé.</li><li><b>Œdème nouveau après reprise alimentaire ?</b> Vérifier renutrition et bilan hydrique, sans oublier sepsis ou autre défaillance.</li></ol><table class="t"><thead><tr><th>Différentiel</th><th>Indices qui orientent</th><th>Limite</th></tr></thead><tbody><tr><td>Pertes rénales</td><td>Protéinurie, anomalies urinaires ou rénales</td><td>Œdème et albumine basse ne prouvent pas une carence alimentaire</td></tr><tr><td>Maladie hépatique ou cardiaque</td><td>Histoire, examen, congestion et bilan orienté</td><td>La photographie de godet hépatique illustre cette non-spécificité</td></tr><tr><td>Pertes digestives/malabsorption</td><td>Diarrhée, pathologie digestive, chirurgie ou assimilation limitée</td><td>Poids et albumine ne suffisent pas à localiser le mécanisme</td></tr><tr><td>Cause locale ou infectieuse</td><td>Asymétrie, douleur, rougeur, début focal</td><td>Une dénutrition peut coexister</td></tr><tr><td>Renutrition</td><td>Chronologie après reprise, P/K/Mg et bilan hydrique</td><td>Tous les œdèmes après repas ne sont pas un syndrome de renutrition</td></tr></tbody></table><p>Le <button class="w" data-k="e40-differential">diagnostic différentiel</button> cherche aussi des associations. Traiter une carence n’efface pas une infection ou une maladie chronique concomitante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-RFS — Annexe 19 p 181–182 et 4.4.3</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MECH — Sections 1–5</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-LIMIT — Fin discussion et limites</a>.</p><p><button class="w" data-k="e40-exp-10">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-10">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-11" ><h2>11. Prise en charge : population, phase et surveillance</h2><p><b>Urgence et orientation.</b> Pour les six à cinquante-neuf mois avec MAS, danger IMCI, problème médical aigu, œdème+++ ou échec du test d’appétit conduisent à l’<button class="w" data-k="e40-admission">hospitalisation immédiate</button>. La prise en charge d’un choc, d’une hypoglycémie ou d’une infection grave utilise le protocole pédiatrique et les ressources du service. Les besoins hydriques sont évalués avec prudence : godet et volémie ne sont pas synonymes.</p><p><b>Enfant 6–59 mois hospitalisé.</b> Le guide 2026 prévoit une <button class="w" data-k="e40-stabilization">stabilisation</button> avec F75, puis une <button class="w" data-k="e40-transition">transition</button> vers F100 ou <button class="w" data-k="e40-rutf">aliment thérapeutique prêt à l’emploi</button>, avant la réhabilitation. F75 apporte 75 kcal/100 mL ; le début de stabilisation correspond à 80–100 kcal/kg/j, souvent le bas si instabilité, avec repas fractionnés et adaptation à la tolérance et à l’œdème. Ce ne sont pas des objectifs de renutrition adulte.</p><p><b>Infection.</b> Dans ce circuit OMS, une antibiothérapie de routine accompagne la MAS pédiatrique ; son choix tient compte de la clinique, de l’âge et des résistances. Le schéma oral d’<button class="w" data-k="e40-amoxicillin">amoxicilline</button> et ses différences avec la FI suisse sont détaillés dans Pharmacologie. Une infection spécifique, une nécessité IV ou un nouveau-né relèvent d’un autre schéma, pas d’une conversion automatique.</p><p><b>Adulte.</b> La <button class="w" data-k="e40-adult">prise en charge nutritionnelle adulte</button> associe traitement de la cause, plan diététique, aide aux repas, voie adaptée et prévention du syndrome de renutrition. Le consensus suisse 2019 propose, selon risque, un début 5–15 kcal/kg/j puis augmentation progressive ; l’ESPEN décrit des objectifs ultérieurs individualisés. La <button class="w" data-k="e40-thiamine">thiamine</button> et les électrolytes sont vérifiés avec une prescription adaptée au produit et aux organes.</p><p><b>Avant 6 mois.</b> Évaluation de la dyade, soutien de l’allaitement et alimentation supplémentaire surveillée si nécessaire ; ne pas copier les prescriptions RUTF des plus grands. L’albumine IV ou un diurétique ne se déduisent pas d’un chiffre bas ou d’un godet : indication, volémie et maladie causale doivent être évaluées.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRIAGE — 3.2–3.4, 4.2 et encadrés 6–8</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-TRANS — 4.6.2–4.6.3 p 35–36</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-TARGET — Recommandations 10–12 et commentaires</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9014367/" target="_blank" rel="noopener">EU-EDEMA-MECH — Résumé, introduction et discussion</a>.</p><p><button class="w" data-k="e40-exp-11">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-11">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-12" ><h2>12. Prévention, suivi et pronostic : regarder au-delà du poids</h2><p>Le <button class="w" data-k="e40-follow">suivi</button> associe état clinique, appétit, prises effectives, poids, œdème et fonction. La régression des œdèmes peut d’abord faire baisser le poids : ce n’est pas automatiquement un échec. Chez l’enfant hospitalisé, œdème non diminué au quatrième jour, persistant au dixième ou appétit toujours faible au quatrième réclament une réévaluation dans le guide 2026.</p><p>Le transfert à l’ambulatoire repose sur stabilisation et sécurité du relais. La fin du traitement de MAS des six à cinquante-neuf mois demande habituellement P/T ou P/L ≥-2 z, PB ≥ 125 mm, absence d’œdème sur au moins deux visites/mesures et prise en charge des problèmes médicaux/sociaux. Les discordances prolongées de mesures nécessitent une décision clinique documentée. Un pourcentage de prise de poids seul ne suffit pas.</p><p>La <button class="w" data-k="e40-prevention">prévention</button> concerne l’accès à une alimentation adaptée, le soutien des aidants, le traitement des causes, l’hygiène, les soins préventifs et le développement. Chez l’adulte, anticiper les difficultés de repas et dépister dans les contextes à risque. La <button class="w" data-k="e40-populations">population et ses vulnérabilités</button> déterminent le parcours : nourrisson, enfant, grossesse, personne âgée ou insuffisance d’organe.</p><p>Aucune récupération complète ni durée unique ne peut être promise. Infection, maladies sous-jacentes, rechute nutritionnelle et obstacles sociaux influencent la trajectoire ; un plan de relais concret est une partie du traitement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FOLLOW — 4.9–4.10 et 7.13, encadré 28</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-INFANT — 2.2.2.1 et 6.5.3.4, encadré 20</a> ; <a data-reference-source="1" href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guideline_on_nutritional_support_for_polymorbid_medical_in_patients.pdf" target="_blank" rel="noopener">EU-ESPEN-SCREEN — Recommandation 1, soutien oral/entéral</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4143239/" target="_blank" rel="noopener">EU-IMMUNE — Résumé, méthodes et introduction</a>.</p><p><button class="w" data-k="e40-exp-12">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-12">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-13" ><h2>13. Points clés : relier le signe à une décision</h2><ul><li>Un œdème bilatéral nutritionnel de l’enfant peut suffire à classer MAS même si le poids paraît préservé.</li><li>E40, E42 et E43 ne sont pas des synonymes ; l’hypoalbuminémie seule ne code pas E40.</li><li>Le grade++2026 concerne pieds et jambes ; extension ailleurs signifie+++ dans ce guide.</li><li>Avant six mois, risque de croissance et MAS ne sont pas définis par les mêmes critères.</li><li>Le cadre GLIM adulte exige phénotype et étiologie ; une albumine basse seule ne suffit pas.</li><li>Stabilisation pédiatrique, transition et renutrition adulte utilisent des prescriptions distinctes.</li><li>Suivre tolérance, eau et électrolytes ; une hausse ou une baisse de poids peut être hydrique.</li></ul><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM — XML E40–E43</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CH-CIM-BOUND — E41, E42, E43 et E46</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a> ; <a data-reference-source="1" href="https://aspenjournals.onlinelibrary.wiley.com/doi/full/10.1002/jpen.2756" target="_blank" rel="noopener">INT-GLIM — Introduction, méthodes et critères</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2077-0383/8/12/2202" target="_blank" rel="noopener">CH-RFS-MGMT — 6.1–6.3 et 7</a>.</p><p><button class="w" data-k="e40-exp-13">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-13">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-14" ><h2>14. Pièges : les équivalences trompeuses</h2><p>Œdème ne signifie pas kwashiorkor ; albumine ne signifie pas apport protéique ; poids ne signifie pas muscle ; perte de poids après traitement ne signifie pas nécessairement dégradation. Une photographie ne démontre pas le godet et un godet ne détermine pas sa cause.</p><p>Les erreurs de prescription sont de confondre mg/kg/j et mg/kg/prise, d’ignorer la concentration après reconstitution, de substituer amoxicilline et ampicilline ou de présenter un protocole OMS comme texte autorisé d’une FI suisse. La fenêtre <button class="w" data-k="e40-calculation">calcul et unités</button> rend ces différences explicites.</p><p>Enfin, ne pas transposer F75 à tous adultes, la dose adulte de vitamine B1 aux nourrissons ou les seuils brachiaux d’un âge à un autre. Les cas et quiz sont fictifs et originaux ; ils préparent au raisonnement clinique, sans être des questions fédérales officielles ni une validation médicale humaine du cours.</p><div class="trap"><b>Piège.</b> Préciser à chaque seuil : population, version, unité et conséquence pratique.</div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">FI-B1 — Composition, posologie, contre-indications, précautions, interactions, reproduction, mécanisme</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-ABX — 4.4.1, tableau 9 et annexe 14 p 164–166</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-FEED — 4.6.1 p 34</a> ; <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Évaluation nutritionnelle, examen peau-cheveux ; symptômes œdème, perte de poids et malnutrition</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, CK et CS</a>.</p><p><button class="w" data-k="e40-exp-14">Comprendre ce point</button> <button class="pareto-btn ui" data-k="pareto-e40-14">▲ Loi de Pareto — l’essentiel</button></p></section>
<section class="ilot" id="e40-entrainement" ><h2>S’entraîner : quatre décisions et quatre cas</h2><div class="quiz ui"><p>Le poids normal exclut-il une MAS si l’œdème nutritionnel est présent chez 6–59 mois ?</p><button data-ok="1">Non, l’œdème nutritionnel suffit parmi les critères de ce guide.</button><button data-ok="0">Oui, il faut obligatoirement un poids/taille<-3 z en plus.</button><p class="fb" hidden>Le liquide peut masquer une perte tissulaire ; la cause de l’œdème doit être évaluée.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a>.</p><div class="quiz ui"><p>Dans le guide 2026, pieds+jambes+mains correspondent-ils à ++ ?</p><button data-ok="1">Non, l’extension ailleurs que pieds/jambes relève de +++.</button><button data-ok="0">Oui, les mains sont incluses dans++ quelle que soit la version.</button><p class="fb" hidden>Conserver la distribution et la version 2026 ; +++ peut modifier l’orientation.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-EDEMA — Annexe 3 p 136 et 4.6</a>.</p><div class="quiz ui"><p>À trois mois, PB 108 mm suffit-il seul à définir MAS ?</p><button data-ok="1">Non, il signale un risque ; le diagnostic de malnutrition aiguë sévère du nourrisson utilise des critères distincts.</button><button data-ok="0">Oui, appliquer le seuil de 115 mm des plus grands.</button><p class="fb" hidden>Avant six mois, œdème nutritionnel ou P/L<-3 z définit MAS dans ce guide.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://iris.who.int/server/api/core/bitstreams/71fd671d-18b7-4475-b43a-d268e3a701cf/content" target="_blank" rel="noopener">INT-WHO-IDENT — 2.1–2.3, figure 1 et encadré 1</a>.</p><div class="quiz ui"><p>Une suspension 50 mg/mL et une 25 mg/mL ont-elles le même volume pour 400 mg ?</p><button data-ok="1">Non, 400 mg correspond à 8 mL puis 16 mL.</button><button data-ok="0">Oui, la dose en mg impose toujours le même nombre de mL.</button><p class="fb" hidden>Le calcul de volume suit la concentration, après choix de dose et prescription.</p></div><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">FI-AMOX — Formulation orale, posologie, fonction rénale, précautions, interactions et reproduction</a>.</p><p><button class="w" data-k="e40-cas-1">Cas 1</button> <button class="w" data-k="e40-cas-2">Cas 2</button> <button class="w" data-k="e40-cas-3">Cas 3</button> <button class="w" data-k="e40-cas-4">Cas 4</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">CH-PROFILES — Évaluation nutritionnelle, examen peau-cheveux ; symptômes œdème, perte de poids et malnutrition</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" target="_blank" rel="noopener">CH-MEBEKO — Introduction, CK et CS</a>.</p></section>
