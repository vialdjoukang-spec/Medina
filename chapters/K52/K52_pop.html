<template data-pop="pareto-k52-clinique" data-title="Loi de Pareto — Colite microscopique"><p class="ratio" data-cover="k52-2,k52-4,k52-5,k52-6,k52-7,k52-8,k52-9"></p><ul><li>Femme âgée, tabac, IPP, AINS, ISRS.</li><li>Diarrhée aqueuse, nocturne, sans sang.</li><li>Biopsies droite et gauche même si muqueuse normale.</li><li>Collagène : bande ≥ 10 µm ; lymphocytaire : ≥ 20 LIE/100.</li><li>Budésonide 9 mg/j 8 semaines.</li><li>Pas de mésalazine, ni de prednisolone.</li><li>Pas de surveillance du cancer.</li></ul></template>
<template data-pop="pareto-k52-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k52-e-1,k52-e-2"></p><ul><li>Biopsies droite et gauche.</li><li>Bande ≥ 10 µm ou ≥ 20 LIE/100.</li><li>Cœliaque à rechercher.</li><li>Calprotectine inutile.</li></ul></template>
<template data-pop="pareto-k52-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k52-p-1,k52-p-2,k52-p-3"></p><ul><li>Budésonide 9 mg/j 8 semaines.</li><li>Entretien 3-6 mg/j, hors indication en Suisse.</li><li>Pas de mésalazine, de prednisolone, de probiotiques ni d’antibiotiques.</li><li>Réfractaire : thiopurines, anti-TNF, védolizumab ; pas de méthotrexate.</li></ul></template>
<template data-pop="k52-cm" data-title="Colite microscopique"><p class="lab">Définition</p><p>Colite chronique à diarrhée aqueuse, muqueuse normale ou presque à l’endoscopie, histologie anormale.</p><p class="lab">Formes</p><p>Collagène, lymphocytaire, incomplète.</p><p class="lab">Code</p><p>K52.8 (autres formes précisées).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-cc" data-title="Colite collagène"><p class="lab">Critères (énoncé 4.2)</p><p>Bande collagène sous-épithéliale ≥ 10 µm et infiltrat accru du chorion, sur coupes HE.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-cl" data-title="Colite lymphocytaire"><p class="lab">Critères (énoncé 4.3)</p><p>≥ 20 lymphocytes intraépithéliaux/100 cellules de surface, infiltrat accru, bande < 10 µm.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-cmi" data-title="Colite microscopique incomplète"><p class="lab">Critères (énoncé 4.4)</p><p>Bande > 5 et < 10 µm, ou > 10 et < 20 LIE/100 cellules, avec infiltrat modéré.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-lie" data-title="Lymphocytes intraépithéliaux"><p class="lab">Définition</p><p>Lymphocytes T situés entre les cellules épithéliales de surface.</p><p class="lab">Seuil</p><p>≥ 20/100 cellules : colite lymphocytaire.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-hjortswang" data-title="Critères de Hjortswang"><p class="lab">Rémission clinique</p><p>Moins de 3 selles/j et moins d’une selle aqueuse/j en moyenne, sur une semaine de recueil.</p><p class="lab">Statut</p><p>Critère recommandé en l’absence d’indice validé (énoncé 3.4).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-biopsies" data-title="Biopsies coliques"><p class="lab">Règle (recommandation 4.5, forte)</p><p>Au moins côlon droit et côlon gauche, même si la muqueuse paraît normale.</p><p class="lab">Rendement</p><p>Lésions bilatérales dans 95-98 % des cas.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-calpro" data-title="Calprotectine fécale"><p class="lab">Colite microscopique</p><p>Non utile pour exclure ou suivre la maladie (énoncé 4.7).</p><p class="lab">Ailleurs</p><p>Utile pour Crohn et rectocolite.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-dab" data-title="Diarrhée par malabsorption des acides biliaires"><p class="lab">Mécanisme</p><p>Acides biliaires non réabsorbés dans l’iléon, qui stimulent la sécrétion colique.</p><p class="lab">Fréquence</p><p>Coexiste avec la colite microscopique chez environ 14 % des patients (étude SeHCAT citée par l’EMCG).</p><p class="lab">Traitement</p><p>Chélateur des acides biliaires (recommandation 5.7).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-ipp" data-title="Inhibiteurs de la pompe à protons"><p class="lab">Lien</p><p>Usage chronique associé à la colite microscopique, sans preuve de causalité (énoncé 1.7).</p><p class="lab">Conduite</p><p>Réévaluer l’indication, arrêter si lien chronologique.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-isrs" data-title="Inhibiteurs sélectifs de la recapture de la sérotonine"><p class="lab">Lien</p><p>Usage chronique associé à la colite microscopique (énoncé 1.7).</p><p class="lab">Conduite</p><p>Discuter l’arrêt ou le changement si lien chronologique.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-chelateur" data-title="Chélateurs des acides biliaires"><p class="lab">Exemple</p><p>Colestyramine.</p><p class="lab">Place</p><p>Diarrhée par acides biliaires associée (recommandation 5.7, faible).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-refractaire" data-title="Colite microscopique réfractaire"><p class="lab">Options (recommandation 5.12)</p><p>Thiopurines, anti-TNF, védolizumab chez des patients sélectionnés.</p><p class="lab">Non recommandé</p><p>Méthotrexate.</p><p class="lab">Dernier recours</p><p>Chirurgie (5.13).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-indeterminee" data-title="Colite indéterminée"><p class="lab">Définition</p><p>Colite inflammatoire chronique qui ne peut être classée entre maladie de Crohn et rectocolite.</p><p class="lab">Codes</p><p>K52.30 pancolite, K52.31 gauche, K52.32 rectosigmoïde, K52.38 autres.</p></template>
<template data-pop="k52-d-budesonide" data-title="Budésonide (Entocort CIR®)"><p class="lab">Indication suisse</p><p>Initiation d’une rémission de la colite microscopique aiguë.</p><p class="lab">Dose</p><p>9 mg/j le matin 8 semaines ; réduction progressive les 2 dernières semaines.</p><p class="lab">EMCG 2021</p><p>Induction (fort) ; entretien (fort dans la colite collagène, faible dans la lymphocytaire).</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Entocort CIR®, Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
<template data-pop="k52-d-loperamide" data-title="Lopéramide"><p class="lab">Mécanisme</p><p>Agoniste des récepteurs opioïdes μ intestinaux : ralentit le transit.</p><p class="lab">Place</p><p>Forme légère, selon l’avis des experts (recommandation 5.6).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></template>
