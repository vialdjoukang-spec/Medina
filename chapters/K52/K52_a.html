<h1>Autres gastroentérites et colites non infectieuses : colite microscopique</h1><span class="status">Adulte · colite microscopique (collagène et lymphocytaire, K52.8), colites radiques, toxiques, allergiques et indéterminées · rédaction du 09.10.2026 · référentiels UEG/EMCG colite microscopique 2021, ECCO maladie de Crohn 2024, informations professionnelles suisses</span></div>

<section class="ilot" id="k52-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 66 ans, fumeuse, traitée par <button class="w" data-k="k52-ipp">oméprazole</button> et par un anti-inflammatoire pour une arthrose, a depuis trois mois six à huit selles aqueuses par jour, y compris la nuit, sans sang. Or, sa coloscopie est macroscopiquement normale. <b>La question est donc de savoir s’il s’agit d’une <button class="w" data-k="k52-cm">colite microscopique</button>, comment la prouver et comment la traiter.</b></p><p>Pour y répondre, le médecin doit savoir : évoquer la maladie devant une diarrhée aqueuse chronique, surtout chez une femme âgée ; exiger des <button class="w" data-k="k52-biopsies">biopsies</button> du côlon droit et gauche même si la muqueuse paraît normale ; reconnaître les critères histologiques de la <button class="w" data-k="k52-cc">colite collagène</button> et de la <button class="w" data-k="k52-cl">colite lymphocytaire</button> ; enfin, traiter par <button class="w" data-k="k52-d-budesonide">budésonide</button> et retirer les médicaments suspects.</p><div class="key"><b>Point de départ.</b> Diarrhée aqueuse chronique, nocturne, sans sang, avec coloscopie normale : biopsier pour chercher une colite microscopique.</div></section>
<section class="ilot" id="k52-1"><h2><span class="n">1</span>Définition et périmètre de la catégorie K52</h2><p>La catégorie K52 regroupe les gastroentérites et colites qui ne sont ni infectieuses ni rattachées à une maladie de Crohn ou à une rectocolite hémorragique. Ainsi, elle comprend les atteintes dues à une irradiation (K52.0), les formes toxiques (K52.1), les formes allergiques et alimentaires (K52.2), la <button class="w" data-k="k52-indeterminee">colite indéterminée</button> (K52.3), les autres formes précisées (K52.8) et les formes non précisées (K52.9).</p><p>Parmi ces formes, la <button class="w" data-k="k52-cm">colite microscopique</button> est la plus fréquente en pratique ; c’est pourquoi elle occupe l’essentiel de ce cours. En effet, il s’agit d’une maladie inflammatoire chronique du côlon, responsable d’une diarrhée aqueuse, dont la muqueuse paraît normale ou presque à l’endoscopie, mais dont l’histologie est anormale (EMCG 2021). Par conséquent, son diagnostic est exclusivement histologique, et elle comporte deux formes, collagène et lymphocytaire, ainsi qu’une forme incomplète.</p><table class="t"><tr><th>Sous-catégorie</th><th>Entité</th><th>Mécanisme</th></tr><tr><td>K52.0</td><td>Gastroentérite et colite radiques</td><td>Lésion des tissus par la radiothérapie</td></tr><tr><td>K52.1</td><td>Gastroentérite et colite toxiques</td><td>Médicaments ou toxiques</td></tr><tr><td>K52.2</td><td>Formes allergiques et alimentaires</td><td>Réaction immunitaire à un aliment</td></tr><tr><td>K52.3</td><td>Colite indéterminée</td><td>Colite inflammatoire non classable entre Crohn et rectocolite</td></tr><tr><td>K52.8</td><td>Autres formes précisées, dont la colite microscopique</td><td>Inflammation muqueuse microscopique</td></tr></table><p>Le tableau se lit par la colonne « Mécanisme » : en effet, chaque sous-catégorie est définie par sa cause, si bien que l’interrogatoire sur les traitements et les expositions est décisif.</p><div class="key"><b>À retenir.</b> K52 : colites non infectieuses hors Crohn et rectocolite. Colite microscopique : diarrhée aqueuse, muqueuse normale à l’œil, histologie anormale.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></section>
<section class="ilot" id="k52-2"><h2><span class="n">2</span>Épidémiologie et facteurs de risque</h2><p>Après la définition, il faut mesurer la fréquence. Ainsi, l’incidence groupée de la <button class="w" data-k="k52-cm">colite microscopique</button> est estimée à 11,4 cas pour 100 000 personnes-années, et sa prévalence à 119 pour 100 000 (EMCG 2021, énoncés 1.1 et 1.2). De plus, elle est retrouvée chez 12,8 % des patients qui ont une diarrhée aqueuse chronique inexpliquée (énoncé 1.3) ; elle n’est donc pas rare.</p><p>Par ailleurs, le risque est plus élevé chez la femme (énoncé 1.5), et le tabagisme, ancien et surtout actuel, l’augmente (énoncé 1.4). En outre, l’usage chronique ou fréquent d’<button class="w" data-k="k52-ipp">inhibiteurs de la pompe à protons</button>, d’anti-inflammatoires non stéroïdiens ou d’<button class="w" data-k="k52-isrs">inhibiteurs sélectifs de la recapture de la sérotonine</button> est associé à la maladie ; toutefois, cette association n’implique pas de causalité (énoncé 1.7).</p><div class="key"><b>À retenir.</b> Incidence ≈ 11,4/100 000/an ; 12,8 % des diarrhées aqueuses chroniques inexpliquées ; femme, tabac ; association avec IPP, AINS, ISRS.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></section>
<section class="ilot" id="k52-3"><h2><span class="n">3</span>Physiopathologie</h2><p>Pour comprendre la diarrhée, il faut regarder la muqueuse au microscope. Selon l’EMCG, la pathogénie est complexe et multifactorielle ; ainsi, elle peut associer des facteurs luminaux, comme des médicaments ou des acides biliaires, une dysrégulation immunitaire et une prédisposition génétique (énoncé 2.1). Dans la <button class="w" data-k="k52-cc">colite collagène</button>, une bande de collagène sous-épithéliale épaissie s’ajoute à l’inflammation ; or, cette bande gêne la réabsorption de l’eau et des électrolytes.</p><p>De plus, l’infiltrat lymphocytaire intraépithélial et l’inflammation du chorion entretiennent une sécrétion d’eau. Par conséquent, la diarrhée est aqueuse et persiste la nuit, ce qui la distingue d’une diarrhée fonctionnelle. Enfin, une <button class="w" data-k="k52-dab">diarrhée par malabsorption des acides biliaires</button> coexiste souvent et peut expliquer une résistance au traitement.</p><div class="key"><b>À retenir.</b> Facteurs luminaux, immunité, gènes → bande collagène épaissie et/ou <button class="w" data-k="k52-lie">lymphocytes intraépithéliaux</button> → défaut de réabsorption et sécrétion → diarrhée aqueuse, nocturne.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></section>
<section class="ilot" id="k52-4"><h2><span class="n">4</span>Présentation clinique</h2><p>La présentation est donc dominée par la diarrhée. En effet, le symptôme le plus fréquent est une diarrhée chronique aqueuse, non sanglante, souvent associée à des besoins impérieux, à des selles nocturnes et à une incontinence fécale (énoncé 3.1). De plus, la qualité de vie est altérée selon l’activité de la maladie et les comorbidités (énoncé 3.3).</p><p>Cependant, les symptômes chevauchent ceux du syndrome de l’intestin irritable. C’est pourquoi l’EMCG demande d’exclure une <button class="w" data-k="k52-cm">colite microscopique</button> chez le patient qui remplit les critères d’un trouble fonctionnel, surtout s’il a des facteurs de risque ou ne répond pas au traitement du syndrome de l’intestin irritable (énoncé 3.2). Par ailleurs, l’activité se mesure par les <button class="w" data-k="k52-hjortswang">critères de Hjortswang</button> : la rémission clinique correspond à moins de 3 selles par jour en moyenne et à moins d’une selle aqueuse par jour, sur une semaine (énoncé 3.4).</p><div class="quiz ui"><p>Une patiente de 70 ans a une diarrhée aqueuse nocturne depuis 4 mois et remplit les critères de Rome du syndrome de l’intestin irritable. Que faire ?</p><button data-ok="0">Retenir le syndrome de l’intestin irritable sans autre examen</button><button data-ok="1">Coloscopie avec biopsies du côlon droit et gauche</button><button data-ok="0">Calprotectine pour exclure la colite microscopique</button><p class="fb" hidden>L’âge, les selles nocturnes et la diarrhée aqueuse imposent d’exclure une colite microscopique ; or, la <button class="w" data-k="k52-calpro">calprotectine</button> n’est pas utile pour l’exclure (EMCG 2021, énoncés 3.2 et 4.7).</p></div><div class="key"><b>À retenir.</b> Diarrhée aqueuse, non sanglante, besoins impérieux, selles nocturnes, incontinence ; à exclure devant un « intestin irritable » atypique ; rémission : < 3 selles/j et < 1 selle aqueuse/j.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></section>
<section class="ilot" id="k52-5"><h2><span class="n">5</span>Démarche diagnostique</h2><p>Devant ce tableau, l’examen clé est l’<button class="w" data-k="k52-biopsies">iléocoloscopie avec biopsies</button>. Ainsi, l’EMCG recommande des biopsies prélevées au moins dans le côlon droit et dans le côlon gauche (recommandation 4.5, forte) ; en effet, les lésions sont présentes des deux côtés dans 95 à 98 % des cas. Or, l’aspect endoscopique est souvent normal, ou montre des anomalies non spécifiques (énoncé 4.1) : c’est pourquoi des biopsies doivent être faites même si la muqueuse paraît saine.</p><p>Par ailleurs, la <button class="w" data-k="k52-calpro">calprotectine fécale</button> n’est pas utile pour exclure ou suivre la maladie (énoncé 4.7). En revanche, une maladie cœliaque doit être recherchée chez tout patient atteint de <button class="w" data-k="k52-cm">colite microscopique</button> (recommandation 4.8, forte), car elle y est plus fréquente. Enfin, la recherche d’une diarrhée par <button class="w" data-k="k52-dab">acides biliaires</button> n’est pas systématique, mais elle peut être envisagée en cas d’échec du <button class="w" data-k="k52-d-budesonide">budésonide</button> (recommandation 4.10).</p><div class="key"><b>À retenir.</b> Biopsies du côlon droit et gauche même si l’endoscopie est normale ; calprotectine inutile ; dépister la maladie cœliaque ; acides biliaires si échec du budésonide.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259259/" target="_blank" rel="noopener">Miehlke S. et al., European guidelines on microscopic colitis: United European Gastroenterology and European Microscopic Colitis Group statements and recommendations, United European Gastroenterol J 2021;9:13-37</a>.</p></section>
