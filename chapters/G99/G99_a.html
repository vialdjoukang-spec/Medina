<template id="ch-G99"><div class="chap"><div class="chap-head"><div class="code">G 99 · Neurologie · Système nerveux et maladies systémiques</div><h1>Autres affections du système nerveux au cours de maladies classées ailleurs</h1><span class="status">Cycle Betta 41 · Revue par intelligence artificielle · Aucune validation médicale humaine · Audit différé</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des atteintes nerveuses secondaires</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g99-0">Question clinique</a></li><li><a href="#g99-1">Définitions et classifications</a></li><li><a href="#g99-2">Fréquence et pronostic</a></li><li><a href="#g99-3">Physiopathologie</a></li><li><a href="#g99-4">Causes et facteurs de risque</a></li><li><a href="#g99-5">Anamnèse</a></li><li><a href="#g99-6">Examen clinique</a></li><li><a href="#g99-7">Démarche diagnostique</a></li><li><a href="#g99-8">Urgences et complications</a></li><li><a href="#g99-9">Prise en charge</a></li><li><a href="#g99-10">Suivi et surveillance</a></li><li><a href="#g99-11">Situations particulières</a></li><li><a href="#g99-12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g99-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Une maladie générale atteint parfois le système nerveux sans que le neurologue soit le premier consulté. Le diabète, l’amylose, une dégénérescence du rachis cervical, un cancer métastatique ou une insuffisance rénale terminale peuvent chacun léser une partie différente du système nerveux : les nerfs autonomes, la moelle épinière ou les nerfs périphériques. Ce cours étudie ces atteintes <b>secondaires</b>, c’est-à-dire dues à une maladie dont elles sont la manifestation nerveuse. La démarche est toujours double : reconnaître l’atteinte nerveuse, puis identifier et traiter la maladie qui la cause.</p>
<p>Quatre situations cliniques structurent le cours. Chacune pose une question précise et conduit à un geste décisif.</p>
<table class="t"><thead><tr><th>Situation</th><th>Question posée</th><th>Geste décisif</th></tr></thead><tbody><tr><td>Personne diabétique, étourdissements au lever, fréquence cardiaque de repos élevée</td><td>Existe-t-il une neuropathie autonome cardiovasculaire ?</td><td>Mesurer la pression couché puis debout ; confirmer par des <button class="w" data-k="g99-toronto">tests cardiovasculaires réflexes (stadification de Toronto)</button></td></tr><tr><td>Personne diabétique, nausées, vomissements, plénitude après les repas</td><td>Est-ce une <button class="w" data-k="g99-gp">gastroparésie</button> ?</td><td>Exclure un obstacle par endoscopie, puis prouver le retard de <button class="w" data-k="g99-vidange">vidange gastrique</button></td></tr><tr><td>Plus de 50 ans, maladresse des mains, marche instable, paresthésies qui s’aggravent sur des mois</td><td>Existe-t-il une <button class="w" data-k="g99-mcd">myélopathie cervicale dégénérative</button> ?</td><td>Demander une <button class="w" data-k="g99-irm">imagerie par résonance magnétique cervicale</button> et un avis spécialisé</td></tr><tr><td>Cancer connu, douleur rachidienne, déficit neurologique</td><td>Existe-t-il une <button class="w" data-k="g99-mscc">compression médullaire métastatique</button> ?</td><td>Imager l’ensemble du rachis sans délai : urgence absolue</td></tr></tbody></table>
<p>Une cinquième question traverse les quatre premières : devant une neuropathie autonome associée à une polyneuropathie rapidement progressive, à une perte de poids, à un syndrome du canal carpien bilatéral ou à une cardiopathie hypertrophique, faut-il rechercher une <button class="w" data-k="g99-attr">amylose à transthyrétine</button> ? La réponse oriente vers un bilan génétique et histologique très différent de celui du diabète.</p>
<div class="key"><b>À retenir.</b> Reconnaître l’atteinte nerveuse, puis la maladie causale : le traitement de l’une ne dispense jamais de la recherche de l’autre. Deux situations ne tolèrent aucun retard : la compression médullaire d’un patient cancéreux et la myélopathie progressive.</div>
</section>
<section class="ilot" id="g99-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Le terme général est celui d’atteinte du système nerveux <b>au cours d’une maladie classée ailleurs</b> : la classification statistique place la maladie causale sous son propre code, et l’atteinte nerveuse sous un code de manifestation. Cette logique a une conséquence clinique directe : le diagnostic n’est complet que lorsque la cause est nommée. Elle réunit ici trois grands ensembles de tableaux : la neuropathie autonome, la myélopathie et l’atteinte nerveuse urémique.</p>
<h3>1.1 Neuropathie autonome cardiovasculaire du diabète</h3>
<p>La neuropathie autonome cardiovasculaire est une complication microvasculaire du diabète fréquente et sous-reconnue (Diabetologia, 2024). Sa conséquence la plus visible est l’<button class="w" data-k="g99-ho">hypotension orthostatique</button> (<b>HO</b>). La Task Force de la Société européenne de cardiologie (<b>ESC</b>, 2018) la définit comme une baisse progressive et soutenue de la pression systolique d’au moins 20 mmHg ou de la pression diastolique d’au moins 10 mmHg à la verticalisation. Elle ajoute qu’une pression systolique inférieure à 90 mmHg debout est également anormale. Chez une personne hypertendue en décubitus, la revue de Diabetologia retient une baisse systolique d’au moins 30 mmHg.</p>
<p>L’hypotension orthostatique est dite <b>neurogène</b> lorsque la fréquence cardiaque s’élève peu à l’orthostatisme, habituellement de 10 battements par minute au plus. Une anémie ou une hypovolémie peuvent toutefois la faire monter davantage : le chiffre est donc un repère, non un seuil absolu.</p>
<p>La gravité de la neuropathie se décrit par la <button class="w" data-k="g99-toronto">stadification de Toronto</button>, fondée sur les tests cardiovasculaires réflexes : un test de fréquence anormal indique une neuropathie possible ou précoce ; au moins deux tests anormaux la confirment ; la combinaison de tests de fréquence anormaux et d’une hypotension orthostatique la qualifie de sévère ou avancée.</p>
<h3>1.2 Gastroparésie</h3>
<p>Le consensus de <b>United European Gastroenterology</b> et de la <b>European Society for Neurogastroenterology and Motility</b> (<b>ESNM</b>, 2021) définit la <button class="w" data-k="g99-gp">gastroparésie</button> comme l’association de symptômes à un retard de vidange gastrique, <b>en l’absence d’obstruction mécanique</b> (accord de 100 %, grade A). Le panel y ajoute une fonction motrice gastrique sévèrement perturbée (accord de 85 %). Les symptômes cardinaux sont les nausées et les vomissements (95 %) ; la plénitude postprandiale, la satiété précoce, la douleur épigastrique, les ballonnements et les éructations sont fréquents (95 %). La Revue médicale suisse (2024, résumé lu) décrit la gastroparésie du diabète comme une complication microvasculaire rare et tardive mais significative, aux symptômes non spécifiques, d’où un diagnostic souvent difficile.</p>
<h3>1.3 Myélopathie</h3>
<p>La <b>myélopathie</b> est une maladie de la moelle épinière, quelle qu’en soit l’origine. Elle associe des symptômes et des signes qui traduisent l’atteinte des fibres descendantes (motrices) et ascendantes (sensitives) (Revue médicale suisse, 2015). On distingue la <b>myélopathie radiologique</b> (diminution du diamètre antéro-postérieur de la moelle, hypersignal T2, hyposignal T1, réduction de la surface de section ou de l’espace disponible) de la <b>myélopathie clinique</b>. La <button class="w" data-k="g99-mcd">myélopathie cervicale dégénérative</button> (<b>MCD</b>) est la compression cervicale due à une hernie discale, à une hypertrophie ou à une ossification ligamentaire, ou à des ostéophytes (spondylose) ; l’ancien terme était « myélopathie cervicarthrosique » (BMJ, 2018).</p>
<p>La sévérité de la MCD se gradue par le score <button class="w" data-k="g99-mjoa">mJOA</button> : léger de 15 à 17, modéré de 12 à 14, sévère de 11 ou moins (AO Spine, 2026 ; niveau de preuve faible). La <button class="w" data-k="g99-mscc">compression médullaire métastatique</button> (<b>MSCC</b>) est une autre cause de myélopathie : l’épidurite carcinomateuse en est l’étiologie la plus fréquente (Revue médicale suisse, 2016).</p>
<h3>1.4 Neuropathie amyloïde à transthyrétine</h3>
<p>L’<button class="w" data-k="g99-attr">amylose à transthyrétine</button> avec polyneuropathie est une maladie systémique progressive due au dépôt, dans l’endonèvre, de transthyrétine mal repliée. C’est la polyneuropathie héréditaire de l’adulte la plus grave (consensus européen d’experts, <i>Journal of Neurology</i>, 2021). Les <b>stades de locomotion</b> la décrivent : au stade 1, l’atteinte se limite aux membres inférieurs et la marche reste possible sans aide ; au stade 2, le handicap est net et des aides à la marche sont nécessaires ; au stade 3, le patient est en fauteuil roulant ou alité. Ces stades correspondent à l’échelle <b>PND</b> de I à IV.</p>
<h3>1.5 Atteinte nerveuse urémique</h3>
<p>La <button class="w" data-k="g99-uremie">neuropathie urémique</button> est une polyneuropathie axonale de l’insuffisance rénale chronique. Les sources retenues la décrivent sans critère diagnostique formalisé : on la reconnaît à la clinique, dans le contexte d’une maladie rénale avancée (voir les lacunes à la fin de la monographie).</p>
<div class="key"><b>À retenir.</b> Quatre entités, une seule logique : définir l’atteinte nerveuse par des critères objectifs (pression, vidange, score mJOA, stade de locomotion), puis relier chaque critère à une conduite.</div>
<button class="pareto-btn ui" data-k="pareto-g99-def">▲ Loi de Pareto — Notions et définitions</button>
</section>
<section class="ilot" id="g99-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p>Les chiffres de fréquence dépendent fortement de la population et de la définition ; ils sont donnés avec leur origine.</p>
<h3>2.1 Neuropathie autonome cardiovasculaire</h3>
<p>Environ 20 % des personnes diabétiques sont concernées (Diabetologia, 2024), avec des extrêmes selon le type de diabète : de 29 à 54 % dans le diabète de type 1 et de 12 à 73 % dans le diabète de type 2. Dans le prédiabète, la fréquence est de 9 à 38 %, contre 0 à 18 % chez les personnes normoglycémiques. Dans une cohorte danoise tertiaire (centre Steno, 822 personnes avec un diabète de type 1 et 899 avec un diabète de type 2), la neuropathie autonome touche de 6 à 39 % des premiers et de 9 à 49 % des seconds selon le test utilisé. La polyneuropathie et la neuropathie autonome ne coexistent que dans 50 % des cas : l’absence de polyneuropathie ne rassure donc pas. Dans une cohorte polonaise de 728 personnes (critères de Toronto, 2026), 48,2 % présentent une neuropathie (32,4 % précoce, 15,8 % confirmée), associée à la rétinopathie (rapport de cotes 2,26).</p>
<h3>2.2 Gastroparésie</h3>
<p>L’épidémiologie réelle reste mal connue. Les facteurs de risque retenus par le consensus sont le diabète (accord de 100 %), la chirurgie gastrique, certaines maladies neurologiques et du tissu conjonctif, et les médicaments, notamment les opioïdes (100 %). L’incidence cumulée à dix ans est de 5,2 % dans le diabète de type 1, de 1,0 % dans le diabète de type 2 et de 0,2 % chez les témoins.</p>
<h3>2.3 Myélopathie cervicale dégénérative et compression métastatique</h3>
<p>La prévalence des formes opérées est de 1,6 pour 100 000, vraisemblablement sous-estimée. Le diagnostic est surtout posé dans la cinquantaine, rarement avant 40 ans. Une compression médullaire asymptomatique est visible à l’imagerie chez 59 % (108 sur 183) de volontaires de 40 à 80 ans : 31,6 % à la cinquième décennie, 66,8 % à la huitième (BMJ, 2018). Cette fréquence a une conséquence importante : une image de compression ne prouve pas à elle seule une myélopathie, la clinique décide. La MCD est la cause la plus fréquente de lésion médullaire non traumatique (Balgrist, Zurich). La compression médullaire métastatique touche jusqu’à 5 à 10 % des patients porteurs de métastases ou d’atteintes tumorales osseuses.</p>
<h3>2.4 Amylose à transthyrétine héréditaire</h3>
<p>Les pays endémiques sont le Portugal, le Japon, la Suède et le Brésil. Une dysautonomie est présente chez environ 73 % des patients.</p>
<h3>2.5 Pronostic</h3>
<p>L’<button class="w" data-k="g99-mortalite">hypotension orthostatique est associée à une mortalité accrue</button> chez les personnes diabétiques : dans l’étude ACCORD, le rapport de risque est de 1,61 pour la mortalité toutes causes et de 1,85 pour le décès ou l’hospitalisation pour insuffisance cardiaque. L’ischémie myocardique silencieuse est plus fréquente (risque relatif de 1,96). La mortalité à cinq ans atteint 25 à 50 % en cas de neuropathie avancée. Ces associations sont pronostiques : elles ne démontrent pas que la correction de la pression orthostatique réduirait la mortalité.</p>
<div class="key"><b>À retenir.</b> La neuropathie autonome concerne environ une personne diabétique sur cinq, mais les chiffres varient de 6 à 73 % selon le test et la population. Une compression médullaire radiologique existe chez 59 % des 40-80 ans sans symptôme : la clinique l’emporte sur l’image.</div>
</section>
<section class="ilot" id="g99-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie suit une chaîne : agent causal, structure nerveuse atteinte, perte de fonction, manifestation clinique. La description ci-dessous sépare les trois grandes chaînes.</p>
<h3>3.1 Neuropathie autonome diabétique : atteinte longueur-dépendante</h3>
<p>L’hyperglycémie, la dyslipidémie, le stress oxydatif, l’inflammation médiée par les produits de glycation avancée et la microangiopathie lèsent les fibres nerveuses. L’atteinte est <b>longueur-dépendante</b> : le nerf vague, plus long nerf autonome, est touché en premier. Le déficit parasympathique (vagal) laisse prédominer le tonus sympathique : la fréquence cardiaque de repos augmente, jusqu’à environ 130 battements par minute. Aux stades avancés, la fréquence devient fixe et l’effort est mal toléré, car le cœur ne module plus sa cadence selon les besoins.</p>
<figure><svg viewBox="0 0 380 244" role="img" aria-label="Schéma" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="12" width="356" height="44" rx="5"/><path d="M190 56v14m-4-5l4 5 4-5"/><rect x="12" y="70" width="356" height="44" rx="5"/><path d="M190 114v14m-4-5l4 5 4-5"/><rect x="12" y="128" width="356" height="44" rx="5"/><path d="M190 172v14m-4-5l4 5 4-5"/><rect x="12" y="186" width="356" height="44" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="190" y="39">Hyperglycémie, stress oxydatif, glycation</text><text x="190" y="97">Lésion des fibres autonomes les plus longues (nerf vague)</text><text x="190" y="155">Déficit parasympathique : tachycardie de repos</text><text x="190" y="213">Fréquence fixe, hypotension orthostatique, intolérance à l’effort</text></g></svg><figcaption>Figure 1 — Neuropathie autonome cardiovasculaire. Schéma didactique : de l’agent métabolique à la manifestation clinique, selon Diabetologia 2024.</figcaption></figure>
<h3>3.2 Hypotension orthostatique neurogène</h3>
<p>Dans la défaillance autonome, la vasoconstriction sympathique à la verticalisation est défaillante : la pression chute et la fréquence cardiaque ne compense pas (variation habituellement inférieure ou égale à 10 battements par minute). L’hypotension orthostatique s’accompagne souvent d’un profil tensionnel nocturne <button class="w" data-k="g99-nondipper">non-dipper ou reverse-dipper</button> : la pression ne baisse pas, voire monte, la nuit.</p>
<h3>3.3 Gastroparésie : une physiopathologie non tranchée</h3>
<p>Le panel UEG/ESNM n’a <b>pas</b> atteint de consensus sur la physiopathologie : la perte de la fonction vagale (68 %) et la perte des cellules interstitielles de Cajal (60 %) n’ont pas été retenues. Il n’a pas non plus retenu que le retard de vidange explique à lui seul les symptômes (28 %). Cette prudence a une conséquence pratique : le retard de vidange n’étant pas retenu comme explication suffisante des symptômes, la seule mesure de la vidange ne résume pas la situation du patient.</p>
<h3>3.4 Myélopathie : compression et ischémie</h3>
<p>La moelle souffre par <b>compression directe</b> ou par <b>diminution de la microvascularisation</b> avec ischémie secondaire. Le déficit dépend du niveau, de la cinétique de la compression et de la réserve vasculaire. Les signaux intramédullaires à l’imagerie reflètent souvent une activité biologique en cours plutôt qu’une perte tissulaire fixée (Neurosurgery Clinics, 2026).</p>
<h3>3.5 Neuropathie urémique et amyloïde</h3>
<p>L’hyperkaliémie chronique est le mécanisme principal proposé de la neuropathie urémique : la kaliémie est fortement corrélée aux altérations nerveuses, indépendamment de la cause de la maladie rénale. L’atteinte est axonale et longueur-dépendante (dégénérescence « en remontant », <i>dying back</i>). Dans l’amylose à transthyrétine, le dépôt amyloïde endoneural lèse surtout les petites fibres et le système autonome. La forme précoce (avant 50 ans) est familiale avec dysautonomie ; la forme tardive, souvent sporadique, est à prédominance périphérique.</p>
<div class="key"><b>À retenir.</b> Le nerf le plus long est atteint le premier : cette règle explique pourquoi le nerf vague, les pieds et les mains sont touchés avant les nerfs courts. Pour la moelle, la question est la cinétique : une compression lente laisse plus de réserve qu’une compression rapide.</div>
<button class="pareto-btn ui" data-k="pareto-g99-meca">▲ Loi de Pareto — Mécanismes</button>
</section>
<section class="ilot" id="g99-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se classent par type d’atteinte nerveuse.</p>
<table class="t"><thead><tr><th>Atteinte nerveuse</th><th>Maladie causale</th><th>Remarque</th></tr></thead><tbody><tr><td>Neuropathie autonome</td><td>Diabète ; amylose</td><td>Défaillance autonome secondaire selon l’ESC : aussi lésion médullaire, neuropathies autonomes auto-immunes et paranéoplasiques, insuffisance rénale</td></tr><tr><td>Gastroparésie</td><td>Diabète ; chirurgie gastrique ; maladies neurologiques et du tissu conjonctif ; opioïdes</td><td>Le diabète est le facteur le mieux établi</td></tr><tr><td>Myélopathie</td><td>Spondylose ; hernie discale ; ossification ligamentaire ; tumeurs</td><td>La compression métastatique est l’urgence oncologique de ce groupe</td></tr><tr><td>Neuropathie urémique</td><td>Maladie rénale chronique</td><td>Mécanisme principal proposé : hyperkaliémie chronique</td></tr></tbody></table>
<p>Le consensus ESC distingue ainsi la défaillance autonome <b>primaire</b> de la défaillance <b>secondaire</b> : la seconde est celle de ce cours. Parmi les facteurs de risque de la neuropathie autonome du diabète figure la rétinopathie : dans la cohorte polonaise de 2026, elle est associée à la neuropathie (rapport de cotes 2,26). Les médicaments sont à la fois une cause de gastroparésie (opioïdes) et un facteur aggravant de l’hypotension orthostatique (vasoactifs).</p>
<div class="trap"><span class="k">Piège</span> Associer l’absence de polyneuropathie à l’absence de neuropathie autonome est faux : les deux coexistent dans seulement 50 % des cas.</div>
</section>
<section class="ilot" id="g99-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse est orientée par le type d’atteinte. Elle recueille des antécédents (diabète et sa durée, cancer, insuffisance rénale, antécédents familiaux) puis des symptômes classés par système.</p>
<div class="two"><div class="card"><h4>Neuropathie autonome cardiovasculaire</h4><p>Vertiges, lipothymies et syncopes à l’orthostatisme ; intolérance à l’effort. Le questionnaire <b>COMPASS-31</b> aide à repérer le risque, mais ne remplace pas les tests cardiovasculaires réflexes.</p></div><div class="card"><h4>Gastroparésie</h4><p>Nausées, vomissements, plénitude postprandiale, satiété précoce. L’anamnèse médicamenteuse recherche les opioïdes.</p></div></div>
<p>Dans l’<button class="w" data-k="g99-attr">amylose à transthyrétine</button>, la dysautonomie est polymorphe : impuissance (73 % des hommes), troubles digestifs (53 %), alternance de constipation et de diarrhée, incontinence urinaire (50 %), dysrégulation orthostatique (46 %), perte de poids (environ 30 %). L’anamnèse cherche des antécédents familiaux et un syndrome du canal carpien bilatéral.</p>
<h3>Myélopathie cervicale dégénérative</h3>
<p>Les symptômes sont une douleur ou une raideur cervicale, une faiblesse, un engourdissement ou une perte de dextérité des membres supérieurs, une raideur ou une faiblesse des membres inférieurs, des paresthésies, des troubles vésicaux ou intestinaux, une dysfonction érectile, une instabilité à la marche avec chutes. Le trait constant est l’<b>aggravation sur des mois</b>. Les symptômes peuvent précéder les signes. Les troubles mictionnels débutent par un retard d’initiation, puis un globe vésical, puis l’incontinence et l’atonie sphinctérienne aux stades tardifs (Revue médicale suisse, 2015).</p>
<p>Le <button class="w" data-k="g99-retard">retard diagnostique</button> moyen est de 2,2 ans, après 5,2 ± 3,6 consultations. Dans 43 % des cas, le patient consulte pour un engourdissement ou une douleur de la main, souvent étiquetés syndrome du canal carpien (BMJ, 2018).</p>
<h3>Compression médullaire métastatique</h3>
<p>Le patient porteur de métastases ou d’une atteinte tumorale osseuse décrit des douleurs radiculaires, une parésie, des troubles sensitifs ou sphinctériens.</p>
<div class="trap"><span class="k">Piège</span> Un engourdissement de la main attribué d’emblée à un canal carpien peut cacher une myélopathie cervicale : 43 % des présentations initiales de MCD sont de ce type.</div>
<div class="key"><b>À retenir.</b> L’anamnèse de la MCD cherche une évolution sur des mois ; celle de la compression métastatique, un cancer connu et une douleur rachidienne ; celle de l’amylose, des troubles autonomes multiples avec polyneuropathie rapide.</div>
</section>
<section class="ilot" id="g99-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, puis signes ciblés.</p>
<div class="two"><div class="card"><h4>Hypotension orthostatique</h4><p>La <button class="w" data-k="g99-orthostase">mesure de la pression couché puis debout</button> par lever actif au sphygmomanomètre suffit pour l’hypotension orthostatique classique et retardée. Il faut noter la fréquence cardiaque en même temps que la pression.</p></div><div class="card"><h4>Compression métastatique</h4><p>Douleurs radiculaires, parésie avec syndrome pyramidal, hypo-anesthésie, troubles sphinctériens, syndrome de la queue de cheval.</p></div></div>
<p>Dans la MCD, l’examen cherche les <button class="w" data-k="g99-signes-mcd">signes d’atteinte du premier motoneurone</button> : faiblesse pyramidale, hyperréflexie, spasticité, clonus achilléen, signe de Hoffmann, signe de Babinski, faiblesse segmentaire, déficit sensitif, signe de Lhermitte dans les cas sévères, trouble de la marche. L’examen est <b>peu sensible mais spécifique</b> : un examen normal n’exclut pas la MCD, alors qu’un signe positif est très évocateur (BMJ, 2018).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure à l’absence de myélopathie parce que l’examen neurologique est normal. L’examen étant peu sensible, la clinique normale n’exclut pas la maladie ; l’imagerie reste nécessaire si l’histoire est évocatrice.</div>
<div class="key"><b>À retenir.</b> Deux mesures simples rendent le diagnostic accessible : la pression et la fréquence couché puis debout, et la recherche des réflexes ostéotendineux et des signes de Hoffmann et de Babinski.</div>
