<template data-pop="g99-ho" data-title="Hypotension orthostatique : définition et mesure">
<div class="lab">Définition</div><p>La Task Force ESC 2018 définit l’<button class="w" data-k="g99-ho">hypotension orthostatique</button> classique par une baisse progressive et soutenue de la pression systolique d’au moins 20 mmHg ou de la pression diastolique d’au moins 10 mmHg. Une pression systolique inférieure à 90 mmHg debout est également anormale. Une chute diastolique isolée est très rare.</p>
<div class="lab">Application</div><p>Le médecin mesure couché puis debout, avec lever actif. Chez une personne hypertendue en décubitus, la revue de Diabetologia 2024 retient une baisse systolique d’au moins 30 mmHg. Le caractère neurogène est suggéré par une élévation de la fréquence cardiaque habituellement inférieure ou égale à 10 battements par minute.</p>
<div class="lab">Piège</div><p>Une anémie ou une hypovolémie peuvent augmenter davantage la fréquence ; le chiffre de 10 battements par minute est un repère, non un seuil absolu.</p>
<div class="lab">Limite</div><p>La classification suisse de l’hypotension orthostatique du sujet âgé (Revue médicale suisse 2025) n’a été lue qu’au résumé.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">ESC 2018, syncope (Eur Heart J 2018;39:1883-1948)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11604676/" target="_blank" rel="noopener">Diabetologia 2024;67:2611-2625</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2025/revue-medicale-suisse-937/hypotension-orthostatique-du-sujet-age" target="_blank" rel="noopener">Revue médicale suisse 2025;21:1927-1931 (résumé)</a>.</p></template>
<template data-pop="g99-toronto" data-title="Stadification de Toronto et tests cardiovasculaires réflexes">
<div class="lab">Définition</div><p>Les tests cardiovasculaires réflexes comprennent la variabilité de la fréquence à la respiration profonde (rapport expiration/inspiration), le rapport de Valsalva, le rapport 30:15 au lever et la réponse tensionnelle au lever.</p>
<table class="t"><thead><tr><th>Résultat</th><th>Stade</th></tr></thead><tbody><tr><td>1 test de fréquence anormal</td><td>Neuropathie possible ou précoce</td></tr><tr><td>2 tests anormaux ou plus</td><td>Neuropathie confirmée</td></tr><tr><td>Tests de fréquence anormaux et hypotension orthostatique</td><td>Neuropathie sévère ou avancée</td></tr></tbody></table>
<div class="lab">Limite</div><p>Les valeurs de coupure de chaque test ne figurent pas dans le dossier de recherche. Le questionnaire COMPASS-31 repère le risque mais ne remplace pas les tests.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11604676/" target="_blank" rel="noopener">Diabetologia 2024;67:2611-2625</a>.</p></template>
<template data-pop="g99-orthostase" data-title="Mesure de la pression couché puis debout">
<div class="lab">Technique</div><p>Le patient est allongé puis se lève activement. La pression et la fréquence sont notées couché et debout. Le sphygmomanomètre suffit pour l’hypotension orthostatique classique et retardée.</p>
<div class="lab">Indication du test d’inclinaison</div><p>Le test d’inclinaison est réservé à l’hypotension orthostatique retardée manquée par le lever actif et au syndrome de tachycardie orthostatique posturale. La mesure ambulatoire de la pression sur 24 heures documente l’hypertension nocturne et l’hypotension postprandiale.</p>
<div class="lab">Limite</div><p>Le dossier ne donne pas la durée d’attente debout recommandée.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">ESC 2018, syncope (Eur Heart J 2018;39:1883-1948)</a>.</p></template>
<template data-pop="g99-gp" data-title="Gastroparésie : définition et critères">
<div class="lab">Définition</div><p>Selon le consensus UEG/ESNM 2021, la gastroparésie associe des symptômes à un retard de vidange gastrique en l’absence d’obstruction mécanique (accord de 100 %, grade A).</p>
<div class="lab">Application</div><p>Symptômes cardinaux : nausées et vomissements. Fréquents : plénitude postprandiale, satiété précoce, douleur épigastrique, ballonnement, éructations. L’endoscopie haute est obligatoire (93 %, grade A), le test de vidange anormal obligatoire (95 %).</p>
<div class="lab">Limite</div><p>Aucun consensus sur la physiopathologie : la perte de la fonction vagale (68 %) et la perte des cellules de Cajal (60 %) n’ont pas été retenues. Il n’existe pas de source suisse lue sur ce sujet.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259275/" target="_blank" rel="noopener">Consensus UEG/ESNM 2021, United European Gastroenterol J 2021;9:287-306</a>.</p></template>
<template data-pop="g99-vidange" data-title="Test de vidange gastrique">
<div class="lab">Définition</div><p>La scintigraphie (98 %) et le test respiratoire (95 %) sont valides pour démontrer un retard de vidange. La capsule motrice et l’échographie gastrique ne sont pas soutenues.</p>
<div class="lab">Application</div><p>Une rétention supérieure à 20 % à quatre heures est citée comme facteur pronostique.</p>
<div class="lab">Limite</div><p>Les seuils exacts de rétention à 2 et 4 heures n’ont pas été retrouvés dans la portion lue du consensus ; ils ne sont pas reproduits ici.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8259275/" target="_blank" rel="noopener">Consensus UEG/ESNM 2021, United European Gastroenterol J 2021;9:287-306</a>.</p></template>
<template data-pop="g99-mcd" data-title="Myélopathie cervicale dégénérative">
<div class="lab">Définition</div><p>Dysfonction médullaire due à une compression cervicale (ancien terme : myélopathie cervicarthrosique) ; causes : hernie discale, hypertrophie ou ossification ligamentaire, ostéophytes.</p>
<div class="lab">Application</div><p>Début insidieux, aggravation sur des mois, engourdissement de la main, troubles de la marche, troubles vésicaux. Le diagnostic est surtout posé dans la cinquantaine.</p>
<div class="lab">Piège</div><p>Compression asymptomatique à l’imagerie chez 59 % des 40-80 ans : l’image ne suffit pas.</p>
<div class="lab">Pronostic</div><p>Récupération maximale vers 6 à 12 mois. Traitement dans les six mois après les symptômes : meilleures chances.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6074604/" target="_blank" rel="noopener">BMJ 2018;360:k186</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Revue médicale suisse 2015;11:2023-2029</a> ; <a href="https://doi.org/10.1016/S1474-4422(26)00314-5" target="_blank" rel="noopener">Lancet Neurology 2026 (lu au résumé)</a>.</p></template>
<template data-pop="g99-mjoa" data-title="Score mJOA : gravité de la myélopathie">
<div class="lab">Définition</div><p>Le score mJOA (modified Japanese Orthopaedic Association) classe la sévérité : léger de 15 à 17, modéré de 12 à 14, sévère de 11 ou moins (AO Spine 2026, faible niveau de preuve).</p>
<div class="lab">Application</div><p>Un score léger ne dispense pas du suivi : la chirurgie est discutée en cas de douleur et d’index d’incapacité cervicale élevés.</p>
<div class="lab">Limite</div><p>Le détail des items du score n’est pas fourni par le dossier. Le BMJ 2018 ne donne pas de seuils numériques.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13612752/" target="_blank" rel="noopener">AO Spine, Global Spine J 2026 (lu au résumé)</a>.</p></template>
<template data-pop="g99-signes-mcd" data-title="Signes d’atteinte du premier motoneurone">
<div class="lab">Définition</div><p>Faiblesse pyramidale, hyperréflexie, spasticité, clonus achilléen, signe de Hoffmann, signe de Babinski, faiblesse segmentaire, déficit sensitif, signe de Lhermitte (cas sévères), trouble de la marche.</p>
<div class="lab">Valeur</div><p>Examen peu sensible mais spécifique : un examen normal n’exclut pas la maladie.</p>
<div class="lab">Limite</div><p>La technique précise de chaque signe n’est pas détaillée dans le dossier.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6074604/" target="_blank" rel="noopener">BMJ 2018;360:k186</a>.</p></template>
<template data-pop="g99-irm" data-title="IRM cervicale : indication et lecture">
<div class="lab">Indication</div><p>Examen à demander devant une suspicion de myélopathie ; urgent si progression ou retentissement important. Séquence T2 la plus sensible et spécifique.</p>
<div class="lab">Lecture</div><p>Myélopathie radiologique : diminution du diamètre antéro-postérieur, hypersignal T2, hyposignal T1, réduction de la surface de section.</p>
<div class="lab">Piège</div><p>La sévérité de la compression et le signal médullaire corrèlent mal avec les symptômes.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6074604/" target="_blank" rel="noopener">BMJ 2018;360:k186</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Revue médicale suisse 2015;11:2023-2029</a>.</p></template>
<template data-pop="g99-mscc" data-title="Compression médullaire métastatique">
<div class="lab">Définition</div><p>Compression de la moelle par une métastase ; l’épidurite carcinomateuse est l’étiologie la plus fréquente. Elle touche jusqu’à 5 à 10 % des patients porteurs de métastases ou d’atteintes tumorales osseuses.</p>
<div class="lab">Conduite</div><p>Urgence absolue : IRM de l’ensemble de la colonne sans délai ; corticothérapie systémique, radiothérapie ou laminectomie de décompression selon le contexte ; décision multidisciplinaire.</p>
<div class="lab">Limite</div><p>Le dossier ne contient pas de posologie de corticoïde ; les recommandations NICE n’étaient pas accessibles.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2016/revue-medicale-suisse-503/les-urgences-oncologiques-ca-existe" target="_blank" rel="noopener">Revue médicale suisse 2016;12:176-177</a>.</p></template>
<template data-pop="g99-attr" data-title="Amylose à transthyrétine avec polyneuropathie">
<div class="lab">Définition</div><p>Maladie systémique progressive par dépôt endoneural de transthyrétine mal repliée ; polyneuropathie héréditaire de l’adulte la plus grave.</p>
<div class="lab">Clinique</div><p>Dysautonomie chez environ 73 % ; impuissance, troubles digestifs, incontinence, dysrégulation orthostatique, perte de poids ; canal carpien bilatéral.</p>
<div class="lab">Stades</div><p>Stade 1 : marche sans aide ; stade 2 : aides à la marche ; stade 3 : fauteuil ou alitement.</p>
<div class="lab">Limite</div><p>Les traitements de la polyneuropathie ne sont pas détaillés dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8179912/" target="_blank" rel="noopener">Consensus européen, J Neurol 2021;268:2109-2122</a> ; <a href="https://doi.org/10.1093/eurheartj/ehab072" target="_blank" rel="noopener">ESC 2021, amylose cardiaque (lu au résumé)</a>.</p></template>
<template data-pop="g99-attr-diag" data-title="Diagnostic de l’amylose à transthyrétine">
<div class="lab">Preuves</div><p>Séquençage des quatre exons de TTR ; biopsie au rouge Congo (biréfringence vert pomme) ; typage par spectrométrie de masse ; scintigraphie osseuse pour le cœur.</p>
<div class="lab">Piège</div><p>Une variante isolée ne confirme pas (pénétrance incomplète). Si le premier site est négatif, biopsier au moins un deuxième site.</p>
<div class="lab">Différentiels</div><p>Polyradiculonévrite inflammatoire chronique, polyneuropathie axonale idiopathique, canal lombaire étroit, plus rarement neuropathie diabétique ou amylose AL.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8179912/" target="_blank" rel="noopener">Consensus européen, J Neurol 2021;268:2109-2122</a>.</p></template>
<template data-pop="g99-uremie" data-title="Neuropathie urémique">
<div class="lab">Mécanisme</div><p>Hyperkaliémie chronique proposée comme mécanisme principal ; atteinte axonale longueur-dépendante.</p>
<div class="lab">Prise en charge</div><p>Restriction potassique alimentaire avec résine échangeuse : neuroprotectrice à 24 mois dans un essai randomisé ; gabapentinoïdes en première ligne de la douleur ; hémodiafiltration à l’étude.</p>
<div class="lab">Limite</div><p>Prévalence en dialyse et effet de la transplantation non documentés dans la source lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9144529/" target="_blank" rel="noopener">Pharmaceuticals 2022;15:607</a> ; <a href="https://doi.org/10.1136/bmjopen-2018-023736" target="_blank" rel="noopener">Protocole FINESSE, BMJ Open 2019;9:e023736</a>.</p></template>
<template data-pop="g99-hypo" data-title="Hypoglycémie et neuropathie autonome">
<div class="lab">Faits</div><p>L’hypoglycémie allonge le QTc (415 à 445 ms lors d’une hypoglycémie induite) et augmente le risque d’arythmie (+42 %), de décès cardiovasculaire (+59 %) et de mortalité toutes causes (+68 %).</p>
<div class="lab">Conséquence</div><p>La prévention des hypoglycémies fait partie de la prise en charge.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11604676/" target="_blank" rel="noopener">Diabetologia 2024;67:2611-2625</a>.</p></template>
<template data-pop="g99-mortalite" data-title="Hypotension orthostatique et mortalité">
<div class="lab">Faits</div><p>Étude ACCORD : rapport de risque 1,61 (mortalité toutes causes) et 1,85 (décès ou hospitalisation pour insuffisance cardiaque). Ischémie silencieuse : risque relatif 1,96. Mortalité à cinq ans de 25 à 50 % si neuropathie avancée.</p>
<div class="lab">Limite</div><p>Associations pronostiques : elles ne démontrent pas que corriger la pression abaisse la mortalité.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11604676/" target="_blank" rel="noopener">Diabetologia 2024;67:2611-2625</a>.</p></template>
<template data-pop="g99-nondipper" data-title="Profil non-dipper et reverse-dipper">
<div class="lab">Définition</div><p>En défaillance autonome, la pression nocturne ne baisse pas (non-dipper) ou monte (reverse-dipper).</p>
<div class="lab">Conséquence</div><p>Hypotension debout et hypertension couchée coexistent ; d’où la tête du lit surélevée de plus de 10° et la dernière dose de midodrine au moins 4 heures avant le coucher.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">ESC 2018, syncope (Eur Heart J 2018;39:1883-1948)</a>.</p></template>
<template data-pop="g99-retard" data-title="Retard diagnostique de la myélopathie">
<div class="lab">Faits</div><p>Retard moyen de 2,2 ans ; 5,2 ± 3,6 consultations ; 43 % se présentent par un engourdissement ou une douleur de la main, souvent étiquetés canal carpien. 18 % des fractures de hanche sans diagnostic préalable avaient des signes de MCD.</p>
<div class="lab">Conséquence</div><p>Penser à la myélopathie devant toute main maladroite avec trouble de la marche.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6074604/" target="_blank" rel="noopener">BMJ 2018;360:k186</a>.</p></template>
<template data-pop="g99-chir" data-title="Chirurgie de la myélopathie cervicale dégénérative">
<div class="lab">AO Spine 2017</div><p>Chirurgie recommandée pour la MCD modérée et sévère. MCD légère : chirurgie ou rééducation supervisée, chirurgie si détérioration. Pas de chirurgie prophylactique sans myélopathie ni radiculopathie, mais information et suivi.</p>
<div class="lab">Suisse</div><p>La myélopathie clinique pose per se l’indication chirurgicale ; décompression le plus souvent par discectomie antérieure avec cage.</p>
<div class="lab">Limite</div><p>Le groupe AO Spine 2017 est international à forte participation nord-américaine ; sa recommandation est corroborée par la source suisse du Balgrist. Les déficits sensitifs des membres supérieurs persistent fréquemment après chirurgie.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5684840/" target="_blank" rel="noopener">AO Spine, Global Spine J 2017;7(3 Suppl):70S–83S</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Revue médicale suisse 2015;11:2023-2029</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13612752/" target="_blank" rel="noopener">AO Spine, Global Spine J 2026 (lu au résumé)</a> ; <a href="https://doi.org/10.1016/S1474-4422(26)00314-5" target="_blank" rel="noopener">Lancet Neurology 2026 (lu au résumé)</a>.</p></template>
