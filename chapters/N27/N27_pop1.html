<template data-pop="n27-cim" data-title="Code N27 et classification">
<div class="lab">Définition</div><p>La CIM-10-GM 2024 classe le petit rein de cause inconnue sous N27, dans le bloc N25–N29 (autres affections du rein et de l’uretère). N27.0 désigne l’atteinte unilatérale, N27.1 l’atteinte bilatérale, N27.9 le petit rein sans précision.</p><div class="lab">Application</div><p>La note placée sous N26 (rein scléreux, sans précision) exclut N27 : le petit rein de cause inconnue ne se code donc pas en N26. Dès qu’une cause est établie, le code de la cause remplace N27 ; c’est une déduction du texte de la classification, dont les codes cibles n’ont pas été relus.</p><div class="lab">Limite</div><p>La version allemande du BfArM a été lue ; l’OFS publie un contenu identique en français, mais le document complet n’a pas été relu.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-n25-n29.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc N25–N29</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-mrc" data-title="Maladie rénale chronique (KDIGO 2024)">
<div class="lab">Définition</div><p>La maladie rénale chronique est une anomalie de structure ou de fonction rénale présente depuis au moins trois mois, avec des implications pour la santé. La classification CGA indique la cause, la catégorie de DFG (G1 à G5) et la catégorie d’albuminurie (A1 à A3).</p><div class="lab">Application</div><p>Le médecin teste ensemble l’albuminurie et le DFGe, établit la cause par le contexte, les antécédents, l’arbre généalogique, les médicaments et les signes systémiques, et adapte la prise en charge à la catégorie.</p><div class="lab">Limite</div><p>La recommandation est internationale, appliquée en Europe, sans adaptation suisse formelle lue.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, recommandation sur la MRC</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-taille" data-title="Taille rénale de référence (SKIPOGH)">
<div class="lab">Définition</div><p>L’étude familiale suisse SKIPOGH (Lausanne, Genève, Berne) a mesuré la longueur rénale échographique de 374 hommes et 419 femmes d’ascendance européenne : 11,4 ± 0,8 cm chez l’homme, 10,7 ± 0,8 cm chez la femme, sans différence droite-gauche.</p><div class="lab">Application</div><p>La taille corporelle, le poids et le DFGe sont associés positivement à la longueur ; l’âge a une relation quadratique ; le sexe et l’hypertension ne sont plus associés après ajustement ; l’héritabilité est d’environ 47 %. La ligne directrice S2k retient en pratique un rein &lt; 8 cm ou une asymétrie > 1,5 cm comme signes d’alerte vasculaires.</p><div class="lab">Limite</div><p>Seul le résumé de l’article a été lu : les centiles de référence ne sont pas rapportés. Les seuils vasculaires ne définissent pas N27.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00330-013-2900-4" target="_blank" rel="noopener">Pruijm et al., European Radiology 2013</a> ; <a href="https://register.awmf.org/assets/guidelines/004-008l_S2k_Arteriosklerotische_Erkrankungen-der-Nierenarterie_2025-06.pdf" target="_blank" rel="noopener">S2k AWMF 2025, tableau p. 22</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-dfge" data-title="DFG et DFGe">
<div class="lab">Définition</div><p>Le DFG est le débit de filtration glomérulaire. Le DFGe est son estimation à partir de la créatinine ou de la cystatine C.</p><div class="lab">Application</div><p>KDIGO 2024 place l’estimation par la créatinine en première intention et combine créatinine et cystatine C quand elle est moins fiable. Une valeur isolée ne prouve pas la chronicité : le médecin cherche des valeurs anciennes et des mesures répétées.</p><div class="lab">Limite</div><p>Un DFGe bas peut refléter une insuffisance rénale aiguë ; seul le suivi dans le temps tranche.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, recommandations 1.2.2.1 et points pratiques 1.1.3</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-signes" data-title="Signes évoquant une sténose artérielle rénale">
<div class="lab">Définition</div><p>La S2k 2025 liste les situations qui doivent faire suspecter une sténose athéroscléreuse : hypertension réfractaire malgré plus de trois antihypertenseurs dont diurétique, spironolactone et bloqueur du SRA ; hypertension nouvelle ou aggravée après 55 ans ; hypertension maligne ; hausse de créatinine (stade AKIN 1) après un bloqueur du SRA ; rein &lt; 8 cm ou asymétrie > 1,5 cm ; souffle abdominal ; hypertension avant 30 ans sans obésité ou avant 15 ans.</p><div class="lab">Application</div><p>Chacune de ces situations doit faire suspecter la sténose. La ligne directrice demande une mesure ambulatoire de la pression sur 24 heures avant toute exploration.</p><div class="lab">Limite</div><p>C’est une ligne directrice allemande, non spécifiquement suisse. Le texte ne justifie pas chaque situation : les raisons proposées dans le cours sont des déductions.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/004-008l_S2k_Arteriosklerotische_Erkrankungen-der-Nierenarterie_2025-06.pdf" target="_blank" rel="noopener">S2k AWMF 004-008, version 4.0, 06.06.2025</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-hypoplasie" data-title="Hypoplasie rénale et oligonéphronie">
<div class="lab">Définition</div><p>L’hypoplasie rénale se définit par un nombre réduit de lobes. La revue de Bonsib distingue l’hypoplasie simple, l’oligoméganéphronie, l’hypoplasie segmentaire (rein d’Ask-Upmark) et une hypoplasie corticale, où le nombre de générations de néphrons est réduit.</p><div class="lab">Application</div><p>Le concept d’oligonéphronie relie une masse néphronique réduite à un risque d’hypertension et de maladie rénale chronique à l’âge adulte. Un rein petit d’aspect régulier chez un sujet hypertendu jeune évoque cette piste.</p><div class="lab">Limite</div><p>Seul le résumé a été lu ; l’auteur est américain et l’article est une revue de pathologie, non une recommandation.</p>
<p class="src">Références : <a href="https://doi.org/10.1097/PAP.0000000000000269" target="_blank" rel="noopener">Bonsib, Adv Anat Pathol 2020</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-reflux" data-title="Reflux vésico-urétéral et cicatrices">
<div class="lab">Définition</div><p>Dans le reflux vésico-urétéral symptomatique, des cicatrices rénales apparaissent chez 10 à 40 % des enfants. Elles reposent sur une dysplasie congénitale et/ou une atteinte post-infectieuse.</p><div class="lab">Application</div><p>La bilatéralité augmente le risque d’insuffisance rénale ; 10 à 20 % des enfants atteints de néphropathie de reflux développent une hypertension ou une insuffisance rénale terminale. De petites cicatrices, même bilatérales, ne sont pas démontrées comme causes d’hypertension. En cas d’atteinte parenchymateuse bilatérale, le médecin surveille pression, protéinurie et créatinine, et suit l’état rénal jusqu’après la puberté dans les groupes à risque.</p><div class="lab">Limite</div><p>La page de l’EAU 2026 a été lue par un résumé automatique tronqué ; le calendrier de suivi complet n’est pas documenté.</p>
<p class="src">Références : <a href="https://uroweb.org/guidelines/paediatric-urology/chapter/vesicoureteric-reflux" target="_blank" rel="noopener">EAU 2026, Paediatric Urology, reflux vésico-urétéral</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-ischemie" data-title="Sténose hémodynamiquement significative">
<div class="lab">Définition</div><p>Seules les sténoses réduisant le diamètre de plus de 60 à 65 % altèrent la fonction rénale. Un gradient transsténotique supérieur à 20 mmHg signe une sténose hémodynamiquement significative.</p><div class="lab">Application</div><p>À l’échodoppler, une différence d’indice de résistance (ΔIR) > 0,05 entre les côtés et un temps d’accélération > 70 ms sont des critères simples de significativité. Une longueur rénale &lt; 8 cm prédit une faible probabilité d’amélioration fonctionnelle après angioplastie.</p><div class="lab">Limite</div><p>Une sténose peut exister sans altérer la fonction : le degré anatomique ne dicte pas le traitement.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/004-008l_S2k_Arteriosklerotische_Erkrankungen-der-Nierenarterie_2025-06.pdf" target="_blank" rel="noopener">S2k AWMF 2025, chapitre 2 et recommandation 4</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-chronicite" data-title="Preuves de chronicité">
<div class="lab">Définition</div><p>La chronicité se démontre par d’anciennes valeurs de DFG et d’albuminurie, par l’imagerie (réduction de taille, amincissement cortical), par l’histologie (fibrose, atrophie), par les antécédents et par des mesures répétées sur plus de trois mois.</p><div class="lab">Application</div><p>L’échogénicité corticale est liée à l’atrophie tubulaire et à la glomérulosclérose ; la longueur rapportée à la taille et l’épaisseur parenchymateuse corrigée sont associées au DFGe.</p><div class="lab">Limite</div><p>Une valeur isolée ne prouve pas la chronicité. La revue sur l’échographie est narrative et seul son résumé a été lu.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, points pratiques 1.1.3.1 et 1.1.3.2</a> ; <a href="https://doi.org/10.1016/j.nefroe.2026.501450" target="_blank" rel="noopener">Rubio Menéndez et al., Nefrología 2026</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-cakut" data-title="CAKUT">
<div class="lab">Définition</div><p>Les anomalies congénitales du rein et des voies urinaires comprennent l’agénésie, l’hypo ou dysplasie, la dysplasie multikystique, la duplicité et les valves de l’urètre postérieur.</p><div class="lab">Application</div><p>Elles forment la première cause de maladie rénale chronique de l’enfant. L’agrégation familiale témoigne d’une forte composante génétique : l’histoire familiale oriente.</p><div class="lab">Limite</div><p>La source est un éditorial de consortium, lu en résumé seul.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/ndt/gfr655" target="_blank" rel="noopener">Novel perspectives for investigating CAKUT, Nephrol Dial Transplant 2011</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-askupmark" data-title="Rein d’Ask-Upmark">
<div class="lab">Définition</div><p>Le rein d’Ask-Upmark est une hypoplasie segmentaire, décrite comme congénitale, qui provoque une hypertension chez le sujet jeune.</p><div class="lab">Arbitrage</div><p>Un rapport de cas de 2026 le décrit comme la séquelle probable d’un reflux vésico-urétéral ou d’une pyélonéphrite précoce, ce qui s’oppose à l’origine congénitale. La revue de pathologie classe le rein d’Ask-Upmark parmi les hypoplasies segmentaires. Le cours présente les deux lectures sans trancher.</p><div class="lab">Limite</div><p>Un cas clinique a un très faible niveau de preuve ; il illustre, il ne démontre pas.</p>
<p class="src">Références : <a href="https://doi.org/10.59556/japi.74.1535" target="_blank" rel="noopener">Prakash et Kumari, J Assoc Physicians India 2026</a> ; <a href="https://doi.org/10.1097/PAP.0000000000000269" target="_blank" rel="noopener">Bonsib, Adv Anat Pathol 2020</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-genetique" data-title="Maladies rénales monogéniques">
<div class="lab">Définition</div><p>Environ un adulte sur dix atteint de maladie rénale chronique porte une maladie monogénique. Plus de 60 % des variants concernent huit gènes : PKD1, PKD2, COL4A3, COL4A4, COL4A5, UMOD, MUC1 et HNF1B.</p><div class="lab">Application</div><p>Les drapeaux rouges sont un début jeune, une histoire familiale et une hématurie inexpliquée. KDIGO 2024 cite aussi APOL1 et NPHS1 parmi les gènes testables.</p><div class="lab">Limite</div><p>Une cause génétique peut se présenter sans histoire familiale typique. La revue de Eble a été lue en résumé seul.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.m2024.0120" target="_blank" rel="noopener">Eble et al., Dtsch Arztebl Int 2024</a> ; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, tableau 6</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-hnf1b" data-title="Déficit en HNF1B">
<div class="lab">Définition</div><p>Le déficit en HNF1B est un syndrome qui associe classiquement kystes rénaux et diabète, avec une atteinte multisystémique variable touchant notamment le foie et le pancréas.</p><div class="lab">Application</div><p>HNF1B figure parmi les gènes cités par KDIGO 2024 et parmi les huit gènes qui regroupent plus de 60 % des variants monogéniques.</p><div class="lab">Limite</div><p>La revue narrative a été lue en résumé seul.</p>
<p class="src">Références : <a href="https://doi.org/10.3390/cells12020307" target="_blank" rel="noopener">Gambella et al., Cells 2023</a> ; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, tableau 6</a>. Consultées le 14 octobre 2026.</p></template>
