<template data-pop="n27-echo" data-title="Échographie rénale">
<div class="lab">Définition</div><p>L’échographie décrit la forme, la taille, la symétrie, une obstruction, des kystes et un reflux. Au CHUV, elle est indiquée dans le bilan d’une maladie rénale chronique, d’une insuffisance rénale aiguë, d’une hypertension, d’une hématurie ou d’anomalies morphologiques.</p><div class="lab">Application</div><p>Le médecin rapporte la longueur à la taille du patient, mesure l’épaisseur parenchymateuse corrigée et compare l’échogénicité au foie ou à la rate. Un score combinant ces trois paramètres prédit un DFGe &lt; 60 ml/min (ASC 0,829, sensibilité 81 %, valeur prédictive positive 92 %). L’indice de résistance Doppler corrèle avec les lésions histologiques.</p><div class="lab">Limite</div><p>L’épaisseur corticale seule et la largeur corrèlent mal avec le DFGe. Le score vient d’une revue narrative lue en résumé.</p>
<p class="src">Références : <a href="https://www.chuv.ch/fr/offre-en-soins/portail-des-medecins-installes/medchuv/adresser-un-e-patient-e/consultation/medchuv_prest_85/consultation-en-ultrasonographie-specialisee-des-reins" target="_blank" rel="noopener">CHUV, consultation en ultrasonographie des reins</a> ; <a href="https://doi.org/10.1016/j.nefroe.2026.501450" target="_blank" rel="noopener">Rubio Menéndez et al., Nefrología 2026</a> ; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, tableau 6</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-revasc" data-title="Revascularisation de l’artère rénale">
<div class="lab">Définition</div><p>La revascularisation rétablit le calibre de l’artère rénale, par angioplastie percutanée ou, plus rarement, par chirurgie.</p><div class="lab">Application</div><p>Selon la S2k 2025, elle est recommandée en cas d’œdème pulmonaire « flash » récidivant avec sténoses bilatérales et en cas d’hypertension réfractaire avec dégradation rapide de la fonction. Elle est envisageable si une insuffisance rénale aiguë survient sous bloqueur du SRA avec sténose de haut grade, et dans les trois premiers mois de dialyse. Elle n’est pas recommandée pour une sténose unilatérale asymptomatique.</p><div class="lab">Limite</div><p>Un faible bénéfice fonctionnel est annoncé par une protéinurie > 1 g/j, un RAC > 22,5 mg/g, un rein &lt; 8 cm, une atteinte avancée à la biopsie et un IR > 0,80. La chirurgie ouverte est réservée à une chirurgie aortique simultanée, à une anatomie inaccessible ou à un échec endovasculaire.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/004-008l_S2k_Arteriosklerotische_Erkrankungen-der-Nierenarterie_2025-06.pdf" target="_blank" rel="noopener">S2k AWMF 2025, recommandations 4 et 5</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-tension" data-title="Deux cibles tensionnelles">
<div class="lab">Définition</div><p>KDIGO 2024 suggère une pression systolique &lt; 120 mmHg si tolérée, mesurée de façon standardisée au cabinet, dans la maladie rénale chronique (2B). La S2k allemande 2025 vise 120 à 130 mmHg dans la sténose athéroscléreuse de l’artère rénale.</p><div class="lab">Arbitrage</div><p>Les populations diffèrent : maladie rénale chronique générale d’un côté, sténose athéroscléreuse de l’autre. Aucune source suisse ne tranche. Le cours présente les deux cibles avec leur population et laisse le choix à la situation et à la tolérance, plus prudent chez le patient fragile.</p><div class="lab">Limite</div><p>Les deux textes appartiennent à des contextes distincts ; ils ne se contredisent pas.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, recommandation 3.4.1</a> ; <a href="https://register.awmf.org/assets/guidelines/004-008l_S2k_Arteriosklerotische_Erkrankungen-der-Nierenarterie_2025-06.pdf" target="_blank" rel="noopener">S2k AWMF 2025, recommandation 5</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-isglt2" data-title="Inhibiteurs du SGLT2">
<div class="lab">Définition</div><p>Les iSGLT2 sont des inhibiteurs du cotransporteur sodium-glucose de type 2.</p><div class="lab">Application</div><p>KDIGO 2024 les recommande (1A) dans le diabète de type 2 avec maladie rénale chronique et DFGe ≥ 20, et dans la maladie rénale chronique avec DFGe ≥ 20 et RAC ≥ 200 mg/g ou insuffisance cardiaque. Il les suggère (2B) pour un DFGe de 20 à 45 avec RAC &lt; 200 mg/g. La baisse initiale du DFGe est réversible et n’impose pas l’arrêt.</p><div class="lab">Limite</div><p>Aucune information professionnelle suisse d’un iSGLT2 n’a été lue : posologie et contre-indications se vérifient dans la monographie.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, recommandations 3.7.1 à 3.7.3</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-albuminurie" data-title="Albuminurie et RAC">
<div class="lab">Définition</div><p>Le RAC est le rapport albumine/créatinine urinaire. Il range l’albuminurie en trois catégories, A1 à A3.</p><div class="lab">Application</div><p>KDIGO 2024 recommande de le mesurer avec le DFGe. Un RAC ≥ 300 mg/g avec hématurie, ou > 700 mg/g, motive l’avis du néphrologue. Chez l’enfant, un RAC ≥ 30 mg/g (3 mg/mmol) confirmé le motive aussi. Les bloqueurs du SRA sont recommandés si l’albuminurie est A3 sans diabète, suggérés si A2 sans diabète, recommandés si A2–A3 avec diabète.</p><div class="lab">Limite</div><p>Une valeur isolée ne remplace pas une mesure répétée.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, recommandations 3.6 et points pratiques 5.1</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-cystatine" data-title="Cystatine C">
<div class="lab">Définition</div><p>La cystatine C est un marqueur sanguin de la filtration glomérulaire, alternatif à la créatinine.</p><div class="lab">Application</div><p>KDIGO 2024 recommande de combiner créatinine et cystatine C quand le DFGe par la créatinine est moins fiable (recommandation 1.2.2.1).</p><div class="lab">Limite</div><p>Les circonstances précises de moindre fiabilité de la créatinine n’ont pas été détaillées dans la synthèse lue.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, recommandation 1.2.2.1</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-dmsa" data-title="Scintigraphie DMSA">
<div class="lab">Définition</div><p>La scintigraphie au DMSA utilise l’acide dimercaptosuccinique marqué pour visualiser le cortex rénal et la fonction séparée de chaque rein.</p><div class="lab">Application</div><p>L’EAU 2026 la présente comme le meilleur traceur du cortex et de la fonction séparée. Les cicatrices y apparaissent en zones froides, ce qui la rend utile pour la néphropathie de reflux.</p><div class="lab">Limite</div><p>La source est un résumé automatique d’une page web ; la dose et le calendrier ne sont pas rapportés.</p>
<p class="src">Références : <a href="https://uroweb.org/guidelines/paediatric-urology/chapter/vesicoureteric-reflux" target="_blank" rel="noopener">EAU 2026, Paediatric Urology, reflux vésico-urétéral</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-biopsie" data-title="Biopsie rénale">
<div class="lab">Définition</div><p>La ponction-biopsie rénale prélève du parenchyme pour établir la cause d’une maladie rénale.</p><div class="lab">Application</div><p>KDIGO 2024 la suggère comme test acceptable et sûr, quand elle est cliniquement appropriée (2D). Au CHUV, elle s’adresse à l’exploration d’une maladie rénale chronique ou d’une insuffisance rénale aiguë et nécessite généralement une hospitalisation de moins de 24 heures.</p><div class="lab">Limite</div><p>Aucune source lue ne donne de contre-indication ni de critère de taille pour un petit rein : le néphrologue décide au cas par cas.</p>
<p class="src">Références : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, recommandation 1.1.4.1</a> ; <a href="https://www.chuv.ch/fr/offre-en-soins/portail-des-medecins-installes/medchuv/adresser-un-e-patient-e/consultation/medchuv_prest_81/consultation-en-vue-de-la-realisation-dune-ponction-biopsie-renale" target="_blank" rel="noopener">CHUV, consultation de ponction-biopsie rénale</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-ramipril" data-title="Ramipril (Triatec®)">
<div class="lab">Définition</div><p>Le ramipril est un inhibiteur de l’enzyme de conversion. L’information professionnelle suisse de Triatec® est publiée par Sanofi-Aventis Suisse.</p><div class="lab">Application</div><p>Elle contre-indique le ramipril en cas de sténose de l’artère rénale hémodynamiquement sévère, bilatérale ou sur rein unique. En cas de maladie vasculaire rénale unilatérale, elle demande une surveillance étroite de la fonction rénale pendant les premières semaines. Elle signale un risque d’hyperkaliémie en insuffisance rénale, déconseille le double blocage du SRAA, contre-indique l’association avec l’aliskiren en cas de diabète ou de clairance &lt; 60 ml/min, et fixe une dose initiale de 1,25 mg/j et maximale de 5 mg/j pour une clairance de 20 à 50 ml/min/1,73 m².</p><div class="lab">Limite</div><p>L’expérience est insuffisante pour une clairance &lt; 20 ml/min ou en dialyse. La date de révision de la monographie n’a pas été relevée.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">AIPS, information professionnelle Triatec®</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="n27-sras" data-title="Système rénine-angiotensine">
<div class="lab">Définition</div><p>Le système rénine-angiotensine, ou SRA, régule la pression artérielle et la perfusion rénale. Les IEC et les ARA le bloquent.</p><div class="lab">Application</div><p>Quand la perfusion rénale dépend de l’angiotensine II, comme dans la sténose bilatérale ou sur rein unique, le blocage du SRA fait chuter la filtration. D’où la hausse de créatinine sous bloqueur, signe d’alerte de sténose. L’association IEC + ARA + inhibiteur direct de la rénine est à éviter (1B).</p><div class="lab">Limite</div><p>Ce mécanisme est une déduction de la S2k 2025 et de la monographie du ramipril ; aucune source ne le décrit dans ces termes.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/004-008l_S2k_Arteriosklerotische_Erkrankungen-der-Nierenarterie_2025-06.pdf" target="_blank" rel="noopener">S2k AWMF 2025, tableau p. 22</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">AIPS, information professionnelle Triatec®</a> ; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024, recommandations 3.6</a>. Consultées le 14 octobre 2026.</p></template>
<template data-pop="pareto-n27-bases" data-title="Pareto — Définition et mécanismes">
<p class="ratio" data-cover="n27-0,n27-1,n27-2,n27-3,n27-4"></p><ul><li>N27 est un code d’attente : sans cause établie, le petit rein est unilatéral (N27.0), bilatéral (N27.1) ou sans précision (N27.9).</li><li>La taille se juge sur la norme du sexe et de la taille : 11,4 cm chez l’homme, 10,7 cm chez la femme en Suisse.</li><li>Trois chemins mènent à un petit rein : défaut de développement, cicatrice, ischémie ; la voie finale de la maladie rénale chronique les rend semblables.</li><li>Chercher la sténose, le reflux et la cause génétique.</li></ul></template>
<template data-pop="pareto-n27-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="n27-5,n27-6"></p><ul><li>Le petit rein est une observation d’imagerie : l’anamnèse cherche la cause, l’examen cherche la sténose.</li><li>Hypertension réfractaire, hausse de créatinine sous bloqueur du SRA, souffle abdominal, rein &lt; 8 cm ou asymétrie > 1,5 cm évoquent une sténose.</li><li>Arbre généalogique, antécédents urinaires de l’enfance et médicaments néphrotoxiques font partie du bilan.</li></ul></template>
<template data-pop="pareto-n27-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="n27-7"></p><ul><li>Cinq étapes : confirmer la petite taille, prouver la chronicité, classer en CGA, chercher une cause traitable, orienter.</li><li>Des reins de taille normale n’excluent pas la maladie rénale chronique.</li><li>Petit rein unilatéral : sténose, reflux, hypoplasie ; petits reins bilatéraux : maladie rénale chronique évoluée.</li></ul></template>
<template data-pop="pareto-n27-urgences" data-title="Pareto — Urgences et situations graves">
<p class="ratio" data-cover="n27-8"></p><ul><li>Le petit rein n’est pas une urgence ; la sténose peut l’être.</li><li>Œdème pulmonaire « flash » récidivant avec sténoses bilatérales : revascularisation recommandée.</li><li>Hypertension réfractaire avec dégradation rapide de la fonction : revascularisation recommandée.</li></ul></template>
<template data-pop="pareto-n27-traitement" data-title="Pareto — Prise en charge et orientation">
<p class="ratio" data-cover="n27-9,n27-10"></p><ul><li>KDIGO : pression systolique &lt; 120 mmHg, bloqueur du SRA selon l’albuminurie, iSGLT2 dès DFGe ≥ 20, sodium &lt; 2 g/j.</li><li>Sténose : traitement médical d’abord ; pas d’angioplastie d’une sténose unilatérale asymptomatique.</li><li>Petit rein avec maladie rénale chronique de cause incertaine : avis du néphrologue.</li></ul></template>
<template data-pop="pareto-n27-suivi" data-title="Pareto — Suivi et terrains">
<p class="ratio" data-cover="n27-11"></p><ul><li>DFGe tous les 3 à 12 mois et suivi échodoppler sans traitement invasif.</li><li>Enfant avec reflux : suivi jusqu’après la puberté.</li><li>CAKUT : première cause de maladie rénale chronique pédiatrique.</li></ul></template>
<template data-pop="pareto-n27-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="n27-e-1,n27-e-2,n27-e-3,n27-e-4,n27-e-5"></p><ul><li>Tester albuminurie et DFGe ensemble.</li><li>Échodoppler couleur en première intention pour la sténose ; angio-CT si DFG > 60, angio-IRM si DFG &lt; 30.</li><li>DMSA pour les cicatrices de reflux ; biopsie et génétique selon le contexte.</li></ul></template>
<template data-pop="pareto-n27-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="n27-s-anat-cours"></p><ul><li>La longueur varie avec la taille corporelle.</li><li>Hypoplasie : nombre réduit de lobes.</li><li>Sténose significative : > 60–65 % et gradient > 20 mmHg.</li></ul></template>
<template data-pop="pareto-n27-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="n27-s-histo-cours"></p><ul><li>Fibrose et atrophie prouvent la chronicité.</li><li>L’échogénicité corticale reflète atrophie tubulaire et glomérulosclérose.</li><li>La biopsie se discute au cas par cas.</li></ul></template>
<template data-pop="pareto-n27-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="n27-s-physio-cours"></p><ul><li>Masse néphronique réduite : risque d’hypertension et de maladie rénale chronique.</li><li>Perfusion dépendante de l’angiotensine II : hausse de créatinine sous bloqueur.</li><li>Baisse initiale du DFGe sous iSGLT2 : réversible.</li></ul></template>
<template data-pop="pareto-n27-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="n27-s-bioch-cours"></p><ul><li>DFGe créatinine d’abord, cystatine C ensuite.</li><li>RAC en trois catégories A1 à A3.</li><li>Huit gènes regroupent plus de 60 % des variants monogéniques.</li></ul></template>
<template data-pop="pareto-n27-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="n27-p-1,n27-p-2,n27-p-3,n27-p-4"></p><ul><li>Bloqueur du SRA : contre-indiqué en cas de sténose bilatérale sévère ou sur rein unique (FI du ramipril).</li><li>Jamais d’association IEC + ARA + inhibiteur direct de la rénine.</li><li>iSGLT2 selon DFGe et RAC ; statine et aspirine dans la sténose athéroscléreuse.</li></ul></template>
