<template id="ch-N27"><div class="chap"><div class="chap-head"><div class="code">N 27 · Néphrologie · Rein, eau et électrolytes</div><h1>Petit rein de cause inconnue</h1><span class="status">Cycle Betta 31 · Revue par intelligence artificielle · Audit différé — aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie du petit rein</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#n27-0">Question clinique</a></li><li><a href="#n27-1">Définition et classification</a></li><li><a href="#n27-2">Taille rénale de référence</a></li><li><a href="#n27-3">Mécanismes</a></li><li><a href="#n27-4">Causes à rechercher</a></li><li><a href="#n27-5">Anamnèse</a></li><li><a href="#n27-6">Examen clinique</a></li><li><a href="#n27-7">Démarche diagnostique</a></li><li><a href="#n27-8">Urgences et situations graves</a></li><li><a href="#n27-9">Prise en charge</a></li><li><a href="#n27-10">Orientation vers le néphrologue</a></li><li><a href="#n27-11">Suivi et situations particulières</a></li><li><a href="#n27-12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="n27-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 62 ans, mesurant 155 cm, consulte pour une hypertension qui résiste à trois traitements. L’échographie mesure un rein droit à 7,6 cm et un rein gauche à 10,0 cm. Sa créatinine a monté après l’introduction d’un bloqueur du <button class="w" data-k="n27-sras">système rénine-angiotensine</button>. Ces valeurs pédagogiques servent à poser la question centrale du cours.</p>
<p>Un petit rein ne constitue pas un diagnostic : il constitue une observation. Le clinicien doit d’abord confirmer que le rein est réellement petit pour cette patiente, puis dater le processus, chercher une cause que l’on peut traiter, soigner la <button class="w" data-k="n27-mrc">maladie rénale chronique</button> et ses complications, et savoir quand adresser au néphrologue. Le code <button class="w" data-k="n27-cim">N27</button> ne s’applique que tant que la cause reste inconnue.</p>
<div class="key"><b>À retenir.</b> Face à un petit rein, quatre questions se suivent : est-il vraiment petit, depuis quand, pourquoi, et que faire pour protéger le rein restant. La taille ne répond à aucune des trois dernières.</div>
</section>

<section class="ilot" id="n27-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La <button class="w" data-k="n27-cim">CIM-10-GM</button> 2024 range le petit rein de cause inconnue sous le code <b>N27</b>, dans le bloc N25–N29, « Autres affections du rein et de l’uretère ». Le code se décline selon la latéralité, ce qui permet de distinguer d’emblée une atteinte d’un seul rein d’une atteinte des deux.</p>
<table class="t"><thead><tr><th>Code</th><th>Libellé</th><th>Usage</th></tr></thead><tbody><tr><td>N27.0</td><td>Petit rein unilatéral</td><td>Un seul rein est petit, sans cause établie</td></tr><tr><td>N27.1</td><td>Petit rein bilatéral</td><td>Les deux reins sont petits, sans cause établie</td></tr><tr><td>N27.9</td><td>Petit rein, sans précision</td><td>La latéralité n’est pas documentée</td></tr></tbody></table>
<p>Le texte de la classification ne porte aucune note d’inclusion ni d’exclusion sous N27. En revanche, la note placée sous N26 (« Rein scléreux, sans précision ») exclut le petit rein de cause inconnue : celui-ci se code donc en N27 et non en N26. Il s’ensuit logiquement que, dès qu’une cause est établie (sténose artérielle, hypoplasie congénitale, néphropathie de reflux), le médecin code la cause et non N27. Les codes cibles de ces causes n’ont pas été relus pour ce cours ; ils ne sont pas cités ici.</p>
<p>Aucune épidémiologie suisse ou européenne propre à N27 n’a été retrouvée dans les sources lues. Le cours ne propose donc aucune fréquence pour ce code.</p>
<div class="key"><b>À retenir.</b> N27 est un code d’attente. Il décrit une observation d’imagerie et disparaît dès qu’une cause est identifiée.</div>
</section>

<section class="ilot" id="n27-2"><h2><span class="n">2</span>Taille rénale de référence : le normal avant le pathologique</h2>
<p>On ne peut qualifier un rein de « petit » sans connaître la norme. L’étude populationnelle suisse <button class="w" data-k="n27-taille">SKIPOGH</button> (familles d’ascendance européenne recrutées à Lausanne, à Genève et à Berne ; 374 hommes et 419 femmes) a mesuré la longueur rénale échographique chez l’adulte.</p>
<table class="t"><thead><tr><th>Population</th><th>Longueur rénale (moyenne ± écart type)</th><th>Différence droite-gauche</th></tr></thead><tbody><tr><td>Hommes</td><td>11,4 ± 0,8 cm</td><td>Aucune</td></tr><tr><td>Femmes</td><td>10,7 ± 0,8 cm</td><td>Aucune</td></tr></tbody></table>
<p>La longueur rénale croît avec la taille corporelle, le poids et le <button class="w" data-k="n27-dfge">DFGe</button>. L’âge intervient selon une relation quadratique. Le sexe et l’hypertension ne sont plus associés à la longueur après ajustement, et l’héritabilité de la longueur atteint environ 47 %. Les auteurs ont publié des centiles de référence par sexe et par taille ; leurs valeurs n’ont pas été lues pour ce cours.</p>
<p>La conséquence pratique est directe : la signification d’un chiffre dépend du patient. Un même rein de 10 cm n’a pas la même valeur chez une femme de 155 cm que chez un homme de 190 cm. Pour le contexte vasculaire, la ligne directrice allemande <button class="w" data-k="n27-signes">S2k</button> 2025 retient comme signe d’alerte une hypertension associée à un rein de moins de 8 cm ou à une différence de longueur supérieure à 1,5 cm entre les deux reins.</p>
<div class="trap"><span class="k">Piège</span> Aucune des sources lues ne fixe un seuil universel de « petit rein ». Les seuils de 8 cm et de 1,5 cm sont des signes d’alerte vasculaires, non une définition de N27.</div>
<button class="pareto-btn ui" data-k="pareto-n27-bases">▲ Loi de Pareto — Définition et mécanismes</button>
</section>

<section class="ilot" id="n27-3"><h2><span class="n">3</span>Mécanismes : comment un rein devient petit</h2>
<p>Trois grands mécanismes mènent à un petit rein, et la longueur échographique ne dit pas lequel est en cause. Une quatrième notion, la voie finale commune de la maladie rénale chronique, explique que beaucoup de reins évolués se ressemblent.</p>
<div class="two"><div class="card"><h4>1. Défaut de développement</h4><p>Le rein est petit dès le départ. L’<button class="w" data-k="n27-hypoplasie">hypoplasie</button> se définit par un nombre réduit de lobes rénaux. On distingue l’hypoplasie simple, l’oligoméganéphronie, l’hypoplasie segmentaire (rein d’Ask-Upmark) et une hypoplasie corticale, où le nombre de générations de néphrons est réduit. Le concept d’oligonéphronie relie une masse néphronique réduite à un risque d’hypertension et de maladie rénale chronique à l’âge adulte.</p></div><div class="card"><h4>2. Cicatrisation acquise</h4><p>Le rein rétrécit. Dans le <button class="w" data-k="n27-reflux">reflux vésico-urétéral</button> symptomatique, des cicatrices rénales apparaissent chez 10 à 40 % des enfants ; elles relèvent d’une dysplasie congénitale et/ou d’une atteinte post-infectieuse. La bilatéralité augmente le risque d’insuffisance rénale.</p></div></div>
<div class="two"><div class="card"><h4>3. Ischémie chronique</h4><p>Une sténose athéroscléreuse de l’artère rénale réduit la perfusion et peut conduire à une atrophie. Seules les sténoses réduisant le diamètre de plus de 60 à 65 % altèrent la fonction rénale, et un gradient transsténotique supérieur à 20 mmHg signe une sténose <button class="w" data-k="n27-ischemie">hémodynamiquement significative</button>.</p></div><div class="card"><h4>4. Voie finale commune</h4><p>La réduction de taille et l’amincissement cortical sont des arguments de <button class="w" data-k="n27-chronicite">chronicité</button>, comme la fibrose et l’atrophie à l’histologie. L’échogénicité corticale est liée à l’atrophie tubulaire et à la glomérulosclérose.</p></div></div>
<p>Les anomalies congénitales du rein et des voies urinaires, ou <button class="w" data-k="n27-cakut">CAKUT</button> (agénésie, hypo ou dysplasie, dysplasie multikystique, duplicité, valves de l’urètre postérieur), forment la première cause de maladie rénale chronique de l’enfant. L’agrégation familiale témoigne d’une forte composante génétique.</p>
<p>Le rein d’<button class="w" data-k="n27-askupmark">Ask-Upmark</button> illustre une controverse. Décrit comme une hypoplasie segmentaire congénitale, il est aujourd’hui considéré par certains auteurs comme la séquelle d’un reflux vésico-urétéral ou d’une pyélonéphrite précoce, et il provoque une hypertension chez le sujet jeune. Cette dernière lecture repose sur un rapport de cas, donc sur un niveau de preuve très faible.</p>
<div class="key"><b>À retenir.</b> Défaut de développement, cicatrice, ischémie : trois chemins différents, un même aspect échographique. Le traitement dépend du chemin, ce qui justifie la recherche étiologique.</div>
</section>

<section class="ilot" id="n27-4"><h2><span class="n">4</span>Causes à rechercher derrière un petit rein</h2>
<p>Le tableau suivant rassemble les causes retenues dans les sources lues. Il n’est pas exhaustif ; il indique, pour chaque cause, l’indice clinique qui doit la faire évoquer.</p>
<table class="t"><thead><tr><th>Cause</th><th>Indice évocateur</th><th>Mécanisme du petit rein</th></tr></thead><tbody><tr><td>Sténose athéroscléreuse de l’artère rénale</td><td>Hypertension réfractaire ou après 55 ans, hausse de créatinine sous bloqueur du SRA, œdème pulmonaire « flash », souffle abdominal, asymétrie > 1,5 cm</td><td>Ischémie chronique puis atrophie</td></tr><tr><td>Néphropathie de reflux, cicatrices</td><td>Infections urinaires de l’enfance ; cicatrices à la scintigraphie DMSA</td><td>Cicatrisation acquise</td></tr><tr><td>Hypoplasie (simple, oligoméganéphronie, segmentaire)</td><td>Rein petit d’aspect régulier ; hypertension du sujet jeune</td><td>Défaut de développement</td></tr><tr><td>CAKUT ou cause génétique (dont HNF1B)</td><td>Début précoce, histoire familiale, kystes, diabète</td><td>Défaut de développement ou lésion héréditaire</td></tr><tr><td>Maladie rénale chronique évoluée de toute cause</td><td>Reins petits bilatéraux hyperéchogènes, albuminurie, hématurie</td><td>Voie finale commune : fibrose, atrophie</td></tr></tbody></table>
<p>Environ un adulte sur dix atteint de maladie rénale chronique porte une <button class="w" data-k="n27-genetique">maladie monogénique</button>. Plus de 60 % des variants concernent huit gènes (PKD1, PKD2, COL4A3, COL4A4, COL4A5, UMOD, MUC1 et HNF1B). Les drapeaux rouges sont un début jeune, une histoire familiale et une hématurie inexpliquée. Le déficit en <button class="w" data-k="n27-hnf1b">HNF1B</button> associe classiquement kystes rénaux et diabète, avec une atteinte multisystémique variable touchant notamment le foie et le pancréas.</p>
<div class="trap"><span class="k">Piège</span> Une cause génétique peut se présenter sans histoire familiale typique. L’absence d’antécédents ne dispense pas d’y penser devant un début jeune ou une hématurie inexpliquée.</div>
</section>

<section class="ilot" id="n27-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche à établir la cause en combinant le contexte clinique, les antécédents personnels et familiaux (avec un arbre généalogique), les facteurs sociaux et environnementaux, les médicaments néphrotoxiques, les signes de maladie systémique et les anomalies des voies urinaires, selon les <button class="w" data-k="n27-mrc">pratiques recommandées par KDIGO 2024</button>. La présentation clinique propre à un petit rein isolé n’est documentée par aucune source retenue ; le cours ne la décrit donc pas.</p>
<p>Un volet orienté recherche une sténose artérielle rénale, car elle représente la cause curable. La ligne directrice <button class="w" data-k="n27-signes">S2k</button> liste les situations qui doivent la faire suspecter.</p>
<table class="t"><thead><tr><th>Situation</th><th>Pourquoi elle évoque une sténose</th></tr></thead><tbody><tr><td>Hypertension réfractaire malgré plus de trois antihypertenseurs dont un diurétique, la spironolactone et un bloqueur du SRA</td><td>Une pression qui échappe à un traitement complet suggère une cause rénovasculaire</td></tr><tr><td>Hypertension nouvelle ou aggravée après 55 ans</td><td>L’athérosclérose devient plus probable avec l’âge</td></tr><tr><td>Hypertension maligne ou urgence hypertensive avec atteinte d’organe</td><td>Gravité inhabituelle sans cause évidente</td></tr><tr><td>Hausse de créatinine (stade AKIN 1) après introduction d’un bloqueur du SRA</td><td>La perfusion rénale dépend alors de l’angiotensine II ; son blocage fait chuter la filtration</td></tr><tr><td>Hypertension avec rein &lt; 8 cm ou différence > 1,5 cm entre les reins</td><td>Signe d’atrophie ischémique ou d’asymétrie</td></tr><tr><td>Souffle abdominal</td><td>Turbulence sur une artère rétrécie</td></tr><tr><td>Hypertension avant 30 ans sans obésité, ou avant 15 ans</td><td>Hypertension précoce sans facteur habituel</td></tr></tbody></table>
<p>La colonne de gauche reprend les situations énumérées par la ligne directrice ; les explications de la colonne de droite sont des raisonnements du rédacteur, car le texte ne justifie pas chaque situation.</p>
<div class="key"><b>À retenir.</b> Interroger les antécédents de l’enfance (infections urinaires, reflux), la famille (maladie rénale héréditaire) et les traitements récents d’antihypertenseurs avant d’interpréter la taille du rein.</div>
</section>

<section class="ilot" id="n27-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Aucune source lue ne décrit un examen physique propre au petit rein : celui-ci se révèle à l’imagerie, non à la palpation. L’examen sert donc à repérer les indices de cause et de retentissement.</p>
<div class="two"><div class="card"><h4>Pression artérielle</h4><p>La pression se mesure de façon standardisée. Dans le contexte vasculaire, la ligne directrice allemande demande une mesure ambulatoire sur 24 heures avant toute exploration ou intervention. Une hypertension du sujet jeune doit faire penser au rein d’Ask-Upmark ou à une sténose.</p></div><div class="card"><h4>Recherche d’indices</h4><p>L’auscultation de l’abdomen cherche un souffle. Le médecin recherche aussi des signes de maladie systémique et des anomalies des voies urinaires, ainsi que les éléments d’une maladie héréditaire (kystes connus, diabète précoce).</p></div></div>
<p>Il documente enfin les médicaments néphrotoxiques en cours et les antécédents d’infection urinaire. Un examen normal n’écarte rien : beaucoup de patients n’ont aucun signe au moment de la découverte du petit rein.</p>
<div class="key"><b>À retenir.</b> L’examen cherche la pression, le souffle et les signes systémiques. Il ne remplace ni la biologie ni l’imagerie pour dater et expliquer le petit rein.</div>
<button class="pareto-btn ui" data-k="pareto-n27-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
