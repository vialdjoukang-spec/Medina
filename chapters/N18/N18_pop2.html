<template data-pop="n18-ramipril" data-title="Ramipril Zentiva — inhibiteur de l’enzyme de conversion"><p data-evidence="N18-C0308" id="N18-C0308">Ramipril est transformé en ramiprilate, qui inhibe l’enzyme de conversion. La réduction d’angiotensine II modifie la pression et l’hémodynamique glomérulaire. Les comprimés suisses contiennent 1,25, 2,5, 5 ou 10 mg; le sillon du comprimé 1,25 mg est décoratif et ne permet pas de le diviser. L’indication rénale de cette FI concerne une néphropathie glomérulaire avec <button class="w" data-k="n18-proteinurie">protéinurie</button> &gt; 3 g/jour ; elle ne se confond pas avec toutes les indications de classe décrites par KDIGO.</p><p data-evidence="N18-C0309" id="N18-C0309">Dans l’indication néphropathie, on débute selon la FI à 1,25 mg par voie orale une fois par jour, puis on augmente selon la tolérance en doublant la dose à intervalles de deux à trois semaines, jusqu’à un maximum de 5 mg/jour. Pour l’hypertension, l’algorithme usuel est différent, avec une dose initiale de 2,5 mg et un maximum de 10 mg/jour. En perturbation rénale modérée, la FI décrit une clairance de 20–50 mL/min/1,73 m² : début à 1,25 mg et maximum de 5 mg/jour. Elle propose ensuite la formule de Cockcroft–Gault en mL/min; cette différence d’indexation est conservée comme limite à clarifier pour une prescription proche d’un seuil. Les données de ce passage ne permettent pas d’inventer une dose universelle au-dessous de 20.</p><p data-evidence="N18-C0310" id="N18-C0310">En insuffisance hépatique, le traitement s’introduit sous surveillance stricte, avec un maximum de 2,5 mg/jour. Le médecin recherche une hypovolémie, une pression basse, une sténose des artères rénales, un antécédent d’angio-œdème et une grossesse. Le produit est contre-indiqué pendant la grossesse, avec certaines sténoses rénales et après angio-œdème pertinent. Sacubitril/valsartan nécessite un intervalle minimal de 36 heures dans les deux sens. L’association avec aliskirène est contre-indiquée chez le diabétique ou si la clairance est &lt; 60; l’association avec un antagoniste des récepteurs de l’angiotensine est contre-indiquée dans la néphropathie diabétique.</p><p data-evidence="N18-C0311" id="N18-C0311">Pression, <button class="w" data-k="n18-creatinine">créatinine</button> et potassium sont vérifiés avant puis après introduction ou augmentation; KDIGO propose généralement deux à quatre semaines, plus tôt en cas de risque. La toux, l’hypotension, l’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button> et l’angio-œdème sont des effets à connaître. Une hausse de <button class="w" data-k="n18-creatinine">créatinine</button> &gt; 30 % en quatre semaines appelle une recherche de cause. La durée est souvent prolongée lorsque le bénéfice et la tolérance le justifient, avec réévaluation clinique; elle n’est pas fixée par une cure arbitraire.</p><p data-evidence="N18-C0312" id="N18-C0312">Chez une personne diabétique à partir de la catégorie G3 ou avec un antécédent d’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button>, le consensus suisse demande un contrôle à une semaine. Ce contrôle ciblé complète le calendrier général KDIGO de deux à quatre semaines.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>.</p></template>
<template data-pop="n18-forxiga" data-title="Forxiga — dapagliflozine dans la maladie rénale chronique"><p data-evidence="N18-C0313" id="N18-C0313">Forxiga est un inhibiteur du cotransporteur sodium–glucose de type 2; les comprimés existent à 5 et 10 mg. Dans la néphropathie chronique, la dose suisse est de 10 mg par voie orale une fois par jour, en complément du traitement approprié, notamment un inhibiteur de l’enzyme de conversion ou un antagoniste de l’angiotensine à la dose maximale tolérée selon la FI. Il n’y a pas de titration rénale au-delà de 10 mg dans cette indication.</p><p data-evidence="N18-C0314" id="N18-C0314">L’initiation n’est pas recommandée si <button class="w" data-k="n18-dfg">DFGe</button> &lt; 25 mL/min/1,73 m². Un traitement déjà établi peut être poursuivi à 10 mg au-dessous de ce seuil, mais doit être interrompu avant dialyse ou transplantation selon la rubrique posologique suisse. En insuffisance hépatique sévère, la FI propose initialement 5 mg, puis 10 mg si bien toléré. L’usage pédiatrique dans cette indication n’est pas établi. Le diabète de type 1, la polykystose, certaines maladies rénales immunosupprimées, la dialyse et la transplantation ne sont pas des extrapolations admises du parcours présenté. La FI signale l’absence d’expérience chez les patients sans diabète et sans albuminurie.</p><p data-evidence="N18-C0315" id="N18-C0315">Avant la prescription, le médecin évalue le volume, la fonction rénale et les médicaments associés. Le produit peut favoriser une déplétion volémique et des infections génitales. Une acidocétose peut se manifester par <button class="w" data-k="n18-symptomes">nausées</button>, douleurs abdominales, malaise ou respiration anormale sans hyperglycémie majeure; elle nécessite une évaluation et l’arrêt selon la situation. L’association avec l’insuline ou un sécrétagogue peut nécessiter une adaptation pour éviter l’hypoglycémie, sans suppression inappropriée de l’insuline.</p><p data-evidence="N18-C0316" id="N18-C0316">Le traitement est interrompu si possible au moins trois jours avant une chirurgie majeure ou une procédure avec jeûne prolongé. La reprise attend un état stable et une alimentation reprise, après évaluation des risques. Le traitement est arrêté dès qu’une grossesse est constatée; il n’est pas employé pendant l’allaitement. Les bénéfices de <button class="w" data-k="n18-forxiga">DAPA-CKD</button> et ses exclusions sont détaillés en P01 : le mécanisme, l’essai et la FI répondent à trois questions complémentaires.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-kerendia" data-title="Kerendia — finérénone, algorithme rénal du diabète de type 2"><p data-evidence="N18-C0317" id="N18-C0317">La finérénone bloque le récepteur minéralocorticoïde sans structure stéroïdienne. La FI suisse récente comporte des comprimés à 10, 20 et 40 mg et plusieurs indications. Ici, l’algorithme concerne la néphropathie chronique avec diabète de type 2; sa dose maximale est de 20 mg une fois par jour. La dose de 40 mg d’un parcours d’insuffisance cardiaque n’est pas transposée au parcours rénal.</p><p data-evidence="N18-C0318" id="N18-C0318">La dose initiale dépend du <button class="w" data-k="n18-dfg">DFGe</button>, du potassium et des médicaments déjà pris : un inhibiteur modéré du CYP3A4 impose à lui seul la dose de 10 mg. Le tableau se limite à l’indication rénale du diabète de type 2.</p><table class="t"><thead><tr><th>Paramètre</th><th>Critère</th><th>Action</th></tr></thead><tbody><tr><td data-evidence="N18-C0319" id="N18-C0319"><button class="w" data-k="n18-dfg">DFGe</button></td><td data-evidence="N18-C0320" id="N18-C0320">≥ 60 mL/min/1,73 m²</td><td data-evidence="N18-C0321" id="N18-C0321">La dose initiale est 20 mg une fois par jour, sauf si un inhibiteur modéré du CYP3A4 est déjà prescrit (dernière ligne).</td></tr><tr><td data-evidence="N18-C0322" id="N18-C0322"><button class="w" data-k="n18-dfg">DFGe</button></td><td data-evidence="N18-C0323" id="N18-C0323">25 à &lt; 60</td><td data-evidence="N18-C0324" id="N18-C0324">La dose initiale est 10 mg une fois par jour.</td></tr><tr><td data-evidence="N18-C0325" id="N18-C0325"><button class="w" data-k="n18-dfg">DFGe</button></td><td data-evidence="N18-C0326" id="N18-C0326">&lt; 25</td><td data-evidence="N18-C0327" id="N18-C0327">Le traitement n’est pas initié.</td></tr><tr><td data-evidence="N18-C0328" id="N18-C0328">Potassium avant initiation</td><td data-evidence="N18-C0329" id="N18-C0329">≤ 4,8 mmol/L</td><td data-evidence="N18-C0330" id="N18-C0330">L’initiation correspond au cadre recommandé.</td></tr><tr><td data-evidence="N18-C0331" id="N18-C0331">Potassium avant initiation</td><td data-evidence="N18-C0332" id="N18-C0332">&gt; 4,8 à 5,0</td><td data-evidence="N18-C0333" id="N18-C0333">Une initiation peut être discutée avec contrôles supplémentaires.</td></tr><tr><td data-evidence="N18-C0334" id="N18-C0334">Potassium avant initiation</td><td data-evidence="N18-C0335" id="N18-C0335">&gt; 5,0</td><td data-evidence="N18-C0336" id="N18-C0336">Le traitement n’est pas initié.</td></tr><tr><td data-evidence="N18-C0901" id="N18-C0901">Traitement associé</td><td data-evidence="N18-C0902" id="N18-C0902">Inhibiteur modéré du CYP3A4 déjà prescrit, par exemple érythromycine ou vérapamil</td><td data-evidence="N18-C0903" id="N18-C0903">La dose initiale est 10 mg une fois par jour, quel que soit le <button class="w" data-k="n18-dfg">DFGe</button>.</td></tr></tbody></table><p data-evidence="N18-C0337" id="N18-C0337">Le potassium et le <button class="w" data-k="n18-dfg">DFGe</button> sont recontrôlés après quatre semaines, après reprise et après modification. L’algorithme d’entretien suivant évite de confondre le seuil d’initiation et le seuil d’interruption.</p><table class="t"><thead><tr><th>Potassium</th><th>Décision dans le parcours rénal</th></tr></thead><tbody><tr><td data-evidence="N18-C0338" id="N18-C0338">≤ 4,8 mmol/L</td><td data-evidence="N18-C0339" id="N18-C0339">La dose de 20 mg est maintenue ; à 10 mg, elle est augmentée à 20 mg si le <button class="w" data-k="n18-dfg">DFGe</button> n’a pas baissé de plus de 30 % par rapport à la mesure précédente.</td></tr><tr><td data-evidence="N18-C0340" id="N18-C0340">&gt; 4,8 à 5,5</td><td data-evidence="N18-C0341" id="N18-C0341">La dose est maintenue.</td></tr><tr><td data-evidence="N18-C0342" id="N18-C0342">&gt; 5,5</td><td data-evidence="N18-C0343" id="N18-C0343">Kerendia est interrompu ; il est repris à 10 mg une fois par jour lorsque le potassium est redescendu à 5,0 mmol/L ou moins.</td></tr></tbody></table><p data-evidence="N18-C0344" id="N18-C0344">La surveillance ultérieure dépend du risque et des maladies intercurrentes. Aucun de ces seuils n’autorise à ignorer une situation clinique urgente.</p><p data-evidence="N18-C0345" id="N18-C0345">Trois situations contre-indiquent Kerendia : un traitement concomitant par un inhibiteur puissant du CYP3A4 (par exemple itraconazole, kétoconazole, ritonavir, cobicistat ou clarithromycine), une maladie d’Addison et une hypersensibilité au principe actif ou à un excipient. La FI demande en outre d’éviter l’association aux diurétiques épargneurs de potassium et aux autres antagonistes minéralocorticoïdes, parce que leurs effets sur la kaliémie s’additionnent. Les suppléments potassiques et le triméthoprime, seul ou associé au sulfaméthoxazole, imposent une surveillance du potassium et parfois une interruption temporaire. Les inducteurs puissants ou modérés du CYP3A4, comme la rifampicine, la carbamazépine ou l’éfavirenz, sont à éviter parce qu’ils réduisent fortement l’exposition à la finérénone et donc son effet. Le pamplemousse l’augmente et doit également être évité. En insuffisance hépatique sévère, l’emploi est à éviter ; en insuffisance hépatique modérée, une surveillance supplémentaire du potassium est envisagée. Une femme en âge de procréer utilise une contraception efficace. Une grossesse n’admet le produit qu’après évaluation attentive du rapport entre bénéfice maternel et risque fœtal, et la FI demande de ne pas allaiter. Le principal risque de suivi reste l’<button class="w" data-k="n18-hyperkal">hyperkaliémie</button>.</p><p data-evidence="N18-C0904" id="N18-C0904">Pourquoi un inhibiteur modéré change-t-il la dose de départ ? La finérénone est éliminée presque exclusivement par oxydation, à 90 % par le CYP3A4 et à 10 % par le CYP2C8. Lorsqu’un inhibiteur freine cette enzyme, la même dose produit une exposition plus élevée : la FI rapporte une aire sous la courbe multipliée par 3,48 avec l’érythromycine (500 mg trois fois par jour) et par 2,70 avec le vérapamil à libération prolongée (240 mg une fois par jour). Une exposition plus forte accentue le blocage du récepteur minéralocorticoïde du néphron distal, réduit la sécrétion de potassium et élève la kaliémie. C’est pourquoi la FI impose 10 mg une fois par jour comme dose initiale chez tout patient recevant déjà un inhibiteur modéré, même lorsque le <button class="w" data-k="n18-dfg">DFGe</button> atteint 60 mL/min/1,73 m². Les inhibiteurs faibles, comme l’amiodarone ou la fluvoxamine (aire sous la courbe multipliée par 1,57 en simulation), ne modifient pas la dose initiale mais imposent la même vigilance. Le potassium est surveillé en particulier à l’instauration de Kerendia et à chaque changement de dose de Kerendia ou de l’inhibiteur, y compris lorsqu’un antibiotique comme l’érythromycine est ajouté en cours de traitement.</p><p data-evidence="N18-C0905" id="N18-C0905">Exemple fictif : une patiente atteinte de diabète de type 2 a un <button class="w" data-k="n18-dfg">DFGe</button> de 65 mL/min/1,73 m², un <button class="w" data-k="n18-acr">ACR</button> de 40 mg/mmol et un potassium de 4,5 mmol/L ; elle prend du vérapamil pour un trouble du rythme. Kerendia débute à 10 mg une fois par jour, et non à 20 mg, parce que le vérapamil est un inhibiteur modéré du CYP3A4. Le potassium et le <button class="w" data-k="n18-dfg">DFGe</button> sont recontrôlés à quatre semaines ; si le potassium est alors ≤ 4,8 mmol/L et que le <button class="w" data-k="n18-dfg">DFGe</button> n’a pas baissé de plus de 30 %, la dose passe à 20 mg.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-lasix" data-title="Lasix comprimés 40 mg — traiter une surcharge"><p data-evidence="N18-C0346" id="N18-C0346">Le furosémide est un diurétique de l’anse. Lasix comprimés 40 mg est indiqué notamment pour des œdèmes d’origine rénale; dans un syndrome néphrotique, le traitement de la cause reste prioritaire. La diurèse produite ne prouve pas une restauration du nombre de néphrons et ne remplace pas un traitement protecteur indiqué.</p><p data-evidence="N18-C0347" id="N18-C0347">La FI propose chez l’adulte un début à un demi, un ou deux comprimés par jour, soit 20–80 mg/jour, puis un entretien usuel de 20–40 mg/jour, par voie orale à jeun. La dose est ajustée au besoin clinique et à la réponse. Le plafond général de 1 500 mg/jour mentionné par la FI concerne des circonstances spécialisées et des présentations ou des parcours particuliers; ce n’est ni une dose de départ ni une invitation à une escalade ambulatoire sans contrôle. La réduction de filtration peut modifier la réponse; la catégorie G seule ne permet pas de fixer la dose.</p><p data-evidence="N18-C0348" id="N18-C0348">Le médecin recherche une hypovolémie, une déshydratation, une hypotension, une hypokaliémie ou une hyponatrémie sévères, une anurie et un obstacle à l’écoulement. L’anurie, le coma ou précoma hépatique et l’allaitement font partie des contre-indications. On suit le poids, les symptômes, la pression, le volume, <button class="w" data-k="n18-creatinine">créatinine</button> et les électrolytes. Les pertes digestives ou une baisse des apports justifient une réévaluation. Les associations avec des médicaments néphrotoxiques ou ototoxiques et certains produits modifiant le potassium nécessitent une vérification.</p><p data-evidence="N18-C0349" id="N18-C0349">La FI comporte un conseil général d’apport potassique face au risque d’hypokaliémie; chez une personne atteinte de maladie rénale pouvant être hyperkaliémique, il ne se transforme pas en supplémentation systématique. La kaliémie et les traitements associés déterminent le choix. La durée dépend de la surcharge et de sa cause, avec recherche de la dose minimale efficace.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="n18-crestor" data-title="Crestor — rosuvastatine et risque cardiovasculaire"><p data-evidence="N18-C0350" id="N18-C0350">La rosuvastatine inhibe la synthèse hépatique de cholestérol et intervient dans une stratégie de réduction du risque cardiovasculaire. Les formes suisses et l’indication choisie doivent être vérifiées; le parcours rénal n’autorise pas une dose identique chez tous. La fiche SSN recommande une stratégie hypolipémiante notamment chez les patients non dialysés avec <button class="w" data-k="n18-dfg">DFGe</button> &lt; 60, mais le produit doit être admissible.</p><p data-evidence="N18-C0351" id="N18-C0351">En insuffisance rénale légère à modérée, la dose initiale recommandée de Crestor est de 5 mg par voie orale une fois par jour. La dose de 40 mg est contre-indiquée si la clairance est &lt; 60 mL/min ; Crestor lui-même est contre-indiqué si la clairance est &lt; 30 mL/min. Les augmentations dépendent du risque, du résultat lipidique, des interactions et de la tolérance; la FI complète doit être suivie avant toute escalade. Un autre produit peut être nécessaire lorsque Crestor est contre-indiqué, sans extrapoler sa dose à une autre statine.</p><p data-evidence="N18-C0352" id="N18-C0352">Une affection hépatique évolutive, une myopathie, la ciclosporine, la grossesse et l’allaitement sont des contre-indications importantes. Des interactions peuvent augmenter l’exposition et le risque musculaire; on interroge sur une douleur, une faiblesse ou des urines inhabituelles selon le contexte, et l’on explore si nécessaire. La fonction hépatique et la tolérance sont évaluées conformément à la FI. La prévention se poursuit généralement au long cours tant que le bénéfice attendu et la tolérance la justifient; elle ne traite pas directement une baisse aiguë de filtration.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-nephrotrans" data-title="Néphrotrans — bicarbonate de sodium et charge sodée"><p data-evidence="N18-C0353" id="N18-C0353">Néphrotrans contient 500 mg de bicarbonate de sodium par capsule molle gastro-résistante, avec 137 mg de sodium. Il est destiné à l’acidose métabolique et à la prévention de sa récidive dans l’insuffisance rénale chronique chez l’adulte. L’usage chez l’enfant et l’adolescent n’est pas établi. La décision repose sur l’équilibre acido-basique vérifié, pas sur le stade G seul.</p><p data-evidence="N18-C0354" id="N18-C0354">La FI décrit une dose moyenne de quatre à neuf capsules par jour, soit 2–4,5 g de bicarbonate, réparties aux repas et avalées sans les croquer. Elle mentionne dix capsules comme dose quotidienne maximale dans son évaluation de sodium. La dose est individualisée et réévaluée; une acidose sévère symptomatique n’est pas un simple problème de capsules ambulatoires. Le repère de bicarbonate &lt; 18 mmol/L de SSN/KDIGO sert à envisager une intervention, sans constituer une dose de ce produit.</p><p data-evidence="N18-C0355" id="N18-C0355">L’alcalose, l’hypokaliémie, l’hypernatrémie et le régime pauvre en sel sont explicitement contre-indiqués, de même que certaines hypersensibilités, notamment au soja ou à l’arachide. Cette restriction rend nécessaire une réévaluation lorsque le patient suit la réduction sodée habituellement proposée en maladie rénale. On ne peut pas effacer la contradiction en ajoutant seulement « surveiller ». Le choix d’une autre stratégie ou formulation relève d’une décision documentée.</p><p data-evidence="N18-C0356" id="N18-C0356">Au début, on contrôle le pH ou le bicarbonate et les électrolytes à intervalles d’une à deux semaines au plus, puis régulièrement. On suit aussi la pression et la surcharge. Une alcalinisation excessive conduit à réduire la dose. L’augmentation du pH digestif ou urinaire peut modifier d’autres médicaments. Pendant la grossesse et l’allaitement, les données sont limitées et la charge sodée exige une évaluation spécifique. La durée peut être prolongée si indiquée, mais jamais sans surveillance.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-venofer" data-title="Venofer — fer saccharose intraveineux"><p data-evidence="N18-C0357" id="N18-C0357">Venofer est une solution de fer saccharose à 20 mg/mL; une ampoule ou un flacon de 5 mL apporte 100 mg de fer. Il est indiqué pour une carence martiale confirmée lorsque le fer oral est insuffisamment efficace ou impossible. La ferritine et la saturation de la transferrine se lisent avec l’hémoglobine et le contexte; <button class="w" data-k="n18-fer-criteres">anémie</button> rénale ne signifie pas automatiquement carence.</p><p data-evidence="N18-C0358" id="N18-C0358">La FI décrit chez l’adulte 100–200 mg une à trois fois par semaine, selon un déficit total calculé et une administration fractionnée. En perfusion, le produit se dilue uniquement dans du NaCl stérile à 0,9 % : 100 mg dans au maximum 100 mL, pendant au moins 15 minutes; 200 mg dans au maximum 200 mL, pendant au moins 30 minutes. Les doses plus importantes ont d’autres durées et limites : jusqu’à 500 mg chez une personne de plus de 70 kg, ou 7 mg/kg si poids ≤ 70 kg, au maximum une fois par semaine et pendant au moins 3,5 heures. La voie est strictement intraveineuse, jamais intramusculaire ou sous-cutanée.</p><p data-evidence="N18-C0359" id="N18-C0359">Le déficit de Ganzoni se calcule ainsi : poids en kg × (hémoglobine cible − mesurée, en g/dL) × 2,4 + réserves de fer en mg. Pour un poids ≥ 35 kg, la FI utilise 15 g/dL et 500 mg de réserves. Exemple fictif : 70 kg et Hb 10 g/dL donnent 70 × 5 × 2,4 + 500 = 1 340 mg de déficit total, à fractionner. Le nombre 15 de cette formule n’est pas la cible thérapeutique d’hémoglobine sous darbépoétine, qui suit un autre raisonnement.</p><p data-evidence="N18-C0360" id="N18-C0360">Hypersensibilité grave à un fer parentéral, surcharge martiale, <button class="w" data-k="n18-fer-criteres">anémie</button> non martiale et premier trimestre de grossesse sont des contre-indications. Un personnel entraîné et des moyens de réanimation doivent être immédiatement disponibles ; le patient est surveillé pendant l’administration et au moins 30 minutes après. L’extravasation, qui peut provoquer une coloration prolongée et des lésions, doit être évitée. La grossesse après le premier trimestre et l’allaitement nécessitent une évaluation spécifique. Le traitement est arrêté ou révisé selon réponse, bilan martial et tolérance.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>.</p></template>
<template data-pop="n18-aranesp" data-title="Aranesp — darbépoétine alfa et anémie symptomatique"><p data-evidence="N18-C0361" id="N18-C0361">Aranesp stimule l’érythropoïèse et est indiqué dans l’<button class="w" data-k="n18-fer-criteres">anémie</button> symptomatique liée à l’insuffisance rénale chronique chez l’adulte et l’enfant dès un an, sous conduite expérimentée. Il existe plusieurs seringues préremplies, de 10 à 500 µg, avec concentrations et volumes différents : la dose en µg doit être vérifiée sur la présentation. On corrige ou recherche une carence en fer et d’autres causes avant et pendant le traitement.</p><p data-evidence="N18-C0362" id="N18-C0362">Chez l’adulte, la phase correctrice peut débuter à 0,45 µg/kg une fois par semaine, par voie intraveineuse chez le dialysé avec accès habituel ou sous-cutanée chez le non-dialysé. Chez le non-dialysé, la FI autorise aussi 0,75 µg/kg sous-cutané toutes les deux semaines ou 1,5 µg/kg une fois par mois. Ce sont des schémas alternatifs, non cumulatifs. La dose minimale efficace est recherchée; si la réponse est insuffisante, on vérifie d’abord les causes.</p><p data-evidence="N18-C0363" id="N18-C0363">La FI décrit une cible de 100–120 g/L et demande d’éviter le maintien au-dessus de 120. KDIGO 2026 recommande chez l’adulte sous agent stimulant une cible inférieure à 115 g/L : le cours retient cette limite de recommandation plus basse et individualise le bénéfice attendu. Une hausse &gt; 20 g/L sur quatre semaines conduit selon la FI à réduire la dose d’environ 25 %; il ne faut pas augmenter la dose plus souvent que toutes les quatre semaines en phase correctrice. On contrôle l’hémoglobine (Hb) chaque semaine ou toutes les deux semaines jusqu’à stabilité et après les adaptations.</p><p data-evidence="N18-C0364" id="N18-C0364">L’hypertension mal contrôlée est contre-indiquée. On surveille la pression, le potassium, le fer, la vitesse d’augmentation de l’Hb et les événements thromboemboliques; des cibles élevées augmentent les risques cardiovasculaires et de thrombose. Pendant la grossesse, le produit n’est employé qu’en cas de nécessité absolue ; pendant l’allaitement, la décision est individualisée entre l’interruption du traitement et celle de l’allaitement. La durée dépend de l’<button class="w" data-k="n18-fer-criteres">anémie</button> et de la réponse; la baisse de filtration seule ne justifie pas l’introduction.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>.</p></template>
<template data-pop="pareto-n18-a01" data-title="Loi de Pareto — Cas initial et objectifs"><p data-evidence="N18-C0773" id="N18-C0773">Le cas de M. L. est fictif. Devant deux résultats rénaux anormaux, le médecin date d’abord les anomalies, puis il classe la filtration (G) et l’albuminurie (A), recherche la cause et organise le suivi. Le diabète rend une origine diabétique plausible, mais il ne la prouve pas.</p><p data-evidence="N18-C0774" id="N18-C0774"><strong>Piège à éviter.</strong> Conclure à une néphropathie diabétique chez un diabétique sans avoir lu le sédiment urinaire : une hématurie glomérulaire ou une chute rapide du <button class="w" data-k="n18-dfg">DFGe</button> orienterait vers une autre maladie rénale.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="pareto-n18-a02" data-title="Loi de Pareto — Définition et démonstration de chronicité"><p data-evidence="N18-C0775" id="N18-C0775">Une maladie rénale chronique exige une anomalie de structure ou de fonction présente depuis au moins trois mois, ou une preuve d’ancienneté équivalente : valeurs antérieures, reins petits à cortex aminci, fibrose à l’histologie. Une hyperkaliémie, une surcharge ou une glomérulonéphrite rapidement progressive se traitent sans attendre cette démonstration.</p><p data-evidence="N18-C0776" id="N18-C0776"><strong>Piège à éviter.</strong> Qualifier de chronique un <button class="w" data-k="n18-dfg">DFGe</button> bas mesuré une seule fois pendant une diarrhée ou une infection : la même valeur peut traduire une atteinte aiguë réversible, qui relève du chapitre N17.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="pareto-n18-a03" data-title="Loi de Pareto — Classification et gradation du risque"><p data-evidence="N18-C0777" id="N18-C0777">La classification combine trois axes : la cause, la catégorie de filtration G et la catégorie d’albuminurie A. Les catégories G1 et G2 ne définissent une maladie qu’en présence d’un autre marqueur de lésion. G3a et G3b subdivisent le stade 3, et la matrice de couleurs compare des risques relatifs sans donner de probabilité individuelle.</p><p data-evidence="N18-C0778" id="N18-C0778"><strong>Piège à éviter.</strong> Classer un <button class="w" data-k="n18-dfg">DFGe</button> de 30 en G4 : la valeur 30 appartient à G3b (30–44), et la valeur 15 à G4. Pour l’<button class="w" data-k="n18-acr">ACR</button>, la borne de 30 mg/mmol s’écrit différemment selon les textes (A3 au-delà de 30 pour KDIGO, A3 dès 30 dans le premier tableau du consensus SSED/SSN) : on nomme le référentiel utilisé et on confirme une valeur frontière avant toute décision.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>.</p></template>
<template data-pop="pareto-n18-a04" data-title="Loi de Pareto — Épidémiologie, causes et facteurs de progression"><p data-evidence="N18-C0779" id="N18-C0779">En Suisse, environ un adulte sur dix est atteint selon la SSN : c’est une prévalence, non une incidence annuelle. La portée d’un chiffre dépend du recrutement de la population étudiée, de la cause, de la trajectoire et des interventions dont l’effet a été démontré.</p><p data-evidence="N18-C0780" id="N18-C0780"><strong>Piège à éviter.</strong> Prolonger en ligne droite une baisse de 55 à 35 mL/min/1,73 m² survenue après une diarrhée : cette chute aiguë impose d’abord la recherche d’une cause réversible, et non un pronostic de dialyse.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="pareto-n18-a05" data-title="Loi de Pareto — Anamnèse et examen clinique"><p data-evidence="N18-C0781" id="N18-C0781">L’anamnèse recherche les expositions et les médicaments réellement pris, y compris les anti-inflammatoires achetés sans ordonnance. L’examen mesure la pression avec une méthode reproductible, apprécie le volume extracellulaire et repère les signes de gravité. Les données consignées servent ensuite de point de comparaison au suivi.</p><p data-evidence="N18-C0782" id="N18-C0782"><strong>Piège à éviter.</strong> Attribuer des œdèmes et une dyspnée à la seule maladie rénale : une insuffisance cardiaque, une anémie ou un anticalcique comme l’amlodipine peuvent produire les mêmes signes.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>.</p></template>
<template data-pop="pareto-n18-a06" data-title="Loi de Pareto — Diagnostic étiologique et orientation"><p data-evidence="N18-C0783" id="N18-C0783">Chaque examen répond à une question de cause, de gravité, de complication ou d’évolution. La SSN adresse au néphrologue notamment pour un <button class="w" data-k="n18-dfg">DFGe</button> &lt; 30 mL/min/1,73 m², un <button class="w" data-k="n18-acr">ACR</button> durablement &gt; 30 mg/mmol, une cause inconnue, une hématurie glomérulaire ou une progression. Le délai de l’avis dépend de la gravité du tableau, et les urgences néphrologiques passent avant toute hypothèse fréquente.</p><p data-evidence="N18-C0784" id="N18-C0784"><strong>Piège à éviter.</strong> Attendre un <button class="w" data-k="n18-dfg">DFGe</button> inférieur à 30 pour adresser M. L. : son <button class="w" data-k="n18-acr">ACR</button> durablement supérieur à 30 mg/mmol suffit déjà à motiver l’avis néphrologique selon la SSN.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="pareto-n18-a07" data-title="Loi de Pareto — Interventions pour ralentir la progression"><p data-evidence="N18-C0785" id="N18-C0785">La protection rénale associe hygiène de vie, blocage du système rénine–angiotensine, inhibiteur SGLT2 et, dans le diabète de type 2, finérénone, selon la cause et la tolérance. Une recommandation de classe ne remplace pas la FI : la SSN propose un inhibiteur SGLT2 dès un <button class="w" data-k="n18-dfg">DFGe</button> de 20 ; Forxiga ne s’instaure pas au-dessous de 25 mL/min/1,73 m², Jardiance pas au-dessous de 20.</p><p data-evidence="N18-C0786" id="N18-C0786"><strong>Piège à éviter.</strong> Arrêter un inhibiteur de l’enzyme de conversion devant une hausse de créatinine de 15 % à deux semaines : KDIGO recommande de poursuivre le traitement tant que la hausse ne dépasse pas 30 % en quatre semaines, après recherche d’une hypovolémie.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic DualDose/FixDose (Juillet 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_F.pdf" target="_blank" rel="noopener">SSED et SSN (mai 2024, consensus initial 2023)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" target="_blank" rel="noopener">Information professionnelle suisse Norvasc (avril 2023)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle suisse Aldactone (Août 2025)</a>.</p></template>
<template data-pop="pareto-n18-a08" data-title="Loi de Pareto — Complications métaboliques et cardiovasculaires"><p data-evidence="N18-C0787" id="N18-C0787">Chaque complication possède un mécanisme et un bilan propres. Une anémie chez un patient rénal ne signifie pas automatiquement un déficit en érythropoïétine : la carence martiale, les pertes sanguines et les carences vitaminiques sont recherchées d’abord. Le potassium, l’acidose et les troubles minéraux se lisent avec le traitement en cours et leur évolution.</p><p data-evidence="N18-C0788" id="N18-C0788"><strong>Piège à éviter.</strong> Prescrire un agent stimulant l’érythropoïèse à un patient G4 dont la ferritine est basse : la carence en fer est corrigée et sa cause recherchée avant d’attribuer l’anémie au rein.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/6-7-calcium-homeostasis-interactions-of-the-skeletal-system-and-other-organ-systems" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561950025" target="_blank" rel="noopener">Information professionnelle suisse Ezetrol (Mars 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680656220019" target="_blank" rel="noopener">Information professionnelle suisse Repatha (Juin 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle suisse Eliquis (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener">Information professionnelle suisse Aspirine Cardio 100/300 (Mars 2026)</a>.</p></template>
<template data-pop="pareto-n18-a09" data-title="Loi de Pareto — Formes avancées et choix de parcours"><p data-evidence="N18-C0789" id="N18-C0789">La préparation à la suppléance commence tôt, lorsque le <button class="w" data-k="n18-dfg">DFGe</button> descend sous 15 à 20 mL/min/1,73 m² ou que le risque de suppléance dépasse 40 % à deux ans. La catégorie G5 ne déclenche pas seule la dialyse : ce sont les symptômes urémiques, la surcharge ou les troubles électrolytiques résistants qui l’imposent. Les soins conservateurs constituent une option active.</p><p data-evidence="N18-C0790" id="N18-C0790"><strong>Piège à éviter.</strong> Programmer une dialyse au seul motif d’un <button class="w" data-k="n18-dfg">DFGe</button> de 12 chez un patient asymptomatique et stable : KDIGO fonde le début sur une évaluation composite, souvent mais pas toujours entre 5 et 10 mL/min/1,73 m².</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="pareto-n18-a10" data-title="Loi de Pareto — Autres formes et atteinte unilatérale"><p data-evidence="N18-C0791" id="N18-C0791">L’anatomie d’un rein, sa fonction séparée et la filtration globale des deux reins sont trois données distinctes. Une lésion unilatérale chronique peut coexister avec une filtration G1. Lorsqu’aucune mesure récente n’existe, le stade reste non précisé et n’est pas inventé.</p><p data-evidence="N18-C0792" id="N18-C0792"><strong>Piège à éviter.</strong> Déduire une catégorie G3 de l’aspect d’un petit rein cicatriciel : le <button class="w" data-k="n18-dfg">DFGe</button> mesure la filtration des deux reins, et le rein controlatéral peut la maintenir.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="pareto-n18-a11" data-title="Loi de Pareto — Suivi et situations particulières"><p data-evidence="N18-C0793" id="N18-C0793">La filtration et l’albuminurie sont contrôlées au moins une fois par an, plus souvent selon le risque et les traitements. En cas de maladie aiguë, toute suspension médicamenteuse précise le produit, le contact et les conditions de reprise. Chaque adaptation de dose utilise le paramètre exigé par la FI du produit.</p><p data-evidence="N18-C0794" id="N18-C0794"><strong>Piège à éviter.</strong> Calculer la dose d’un médicament dont la FI exige une clairance de Cockcroft–Gault avec le <button class="w" data-k="n18-dfg">DFGe</button> indexé : chez une personne de grande corpulence, les deux nombres peuvent différer sensiblement.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="pareto-n18-a12" data-title="Loi de Pareto — Critères formels et paramètres clés"><p data-evidence="N18-C0795" id="N18-C0795">Le diagnostic repose sur la preuve d’une maladie et de sa chronicité ; viennent ensuite les paramètres qui modifient la décision. Maladie, cause, stade et risque forment quatre conclusions distinctes, chacune justifiée par ses propres données.</p><p data-evidence="N18-C0796" id="N18-C0796"><strong>Piège à éviter.</strong> Écrire « maladie rénale chronique stade 3 » sans cause ni catégorie d’albuminurie : la conclusion complète, pour M. L., est une maladie rénale chronique G3b A3, de cause probablement diabétique à confirmer.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="pareto-n18-e01" data-title="Loi de Pareto — Créatinine, cystatine et estimation de filtration"><p data-evidence="N18-C0797" id="N18-C0797">Un <button class="w" data-k="n18-dfg">DFGe</button> s’accompagne toujours de son marqueur, du nom et de la version de l’équation, et de ses unités. C’est une estimation valable seulement à l’équilibre : la masse musculaire, une variation aiguë de créatinine et l’indexation sur 1,73 m² en limitent l’interprétation.</p><p data-evidence="N18-C0798" id="N18-C0798"><strong>Piège à éviter.</strong> Se rassurer devant un <button class="w" data-k="n18-dfg">DFGe</button> normal chez une personne âgée très amaigrie : sa faible masse musculaire abaisse la créatinine et surestime la filtration ; une estimation combinant la cystatine C aide alors.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://deks.dk/wp-content/uploads/2025/05/Calculating-eGFR-from-different-equations_may2025.pdf" target="_blank" rel="noopener">DEKS, Danemark (05.2025)</a>.</p></template>
<template data-pop="pareto-n18-e02" data-title="Loi de Pareto — Albuminurie, urines et morphologie"><p data-evidence="N18-C0799" id="N18-C0799">L’<button class="w" data-k="n18-acr">ACR</button> se calcule en divisant l’albumine urinaire (mg/L) par la créatinine urinaire (mmol/L) du même échantillon ; un résultat anormal est confirmé sur une urine du matin. L’échographie se lit par comparaison avec le rein normal et décrit une structure ; elle ne prouve pas à elle seule une cause histologique.</p><p data-evidence="N18-C0800" id="N18-C0800"><strong>Piège à éviter.</strong> Conclure à une maladie chronique sur un rein long de 9 cm chez une personne de petite taille : la longueur dépend de la stature, et c’est l’association d’un cortex aminci et hyperéchogène qui oriente.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
<template data-pop="pareto-n18-e03" data-title="Loi de Pareto — Complications, risque et synthèse du bilan"><p data-evidence="N18-C0801" id="N18-C0801">Un score de risque n’a de sens qu’avec sa population, ses variables et son horizon. La KFRE présentée exige un <button class="w" data-k="n18-acr">ACR</button> en mg/g, et un risque à cinq ans ne se compare jamais à un seuil défini à deux ans.</p><p data-evidence="N18-C0802" id="N18-C0802"><strong>Piège à éviter.</strong> Introduire un <button class="w" data-k="n18-acr">ACR</button> de 35 mg/mmol dans une équation qui attend des mg/g : le risque calculé serait faussement bas, car 35 mg/mmol correspondent à environ 310 mg/g.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://www.hug.ch/nephrologie-hypertension/comment-decouvre-t-insuffisance-renale" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (09.03.2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>.</p></template>
<template data-pop="pareto-n18-s01" data-title="Loi de Pareto — Anatomie et histologie du rein"><p data-evidence="N18-C0803" id="N18-C0803">Le sang et le filtrat suivent deux parcours distincts mais voisins, ce qui permet la réabsorption et la sécrétion. La barrière glomérulaire explique l’albuminurie, et la perte de néphrons explique la baisse de filtration. Une image histologique isolée ne décrit pas tout le rein.</p><p data-evidence="N18-C0804" id="N18-C0804"><strong>Piège à éviter.</strong> Croire qu’une biopsie sans lésion exclut une glomérulosclérose segmentaire et focale : une lésion focale peut manquer dans un petit fragment.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>.</p></template>
<template data-pop="pareto-n18-s02" data-title="Loi de Pareto — Physiologie de filtration et transports"><p data-evidence="N18-C0805" id="N18-C0805">Une concentration, un débit et une quantité par unité de temps sont trois grandeurs différentes. La quantité excrétée égale la quantité filtrée, moins la quantité réabsorbée, plus la quantité sécrétée ; une diurèse abondante ne prouve donc pas une meilleure filtration.</p><p data-evidence="N18-C0806" id="N18-C0806"><strong>Piège à éviter.</strong> Calculer une clairance avec l’urine en mmol/L et le plasma en µmol/L : sans unités identiques, le résultat est faux d’un facteur 1 000.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>.</p></template>
<template data-pop="pareto-n18-s03" data-title="Loi de Pareto — Biochimie, équilibre acido-basique et minéral"><p data-evidence="N18-C0807" id="N18-C0807">Les tampons, la ventilation et le rein coopèrent pour maintenir l’équilibre acido-basique. Calcium, phosphate, parathormone et vitamine D se lisent ensemble ; corriger l’un d’eux peut apporter du sodium ou du calcium qu’il faut surveiller.</p><p data-evidence="N18-C0808" id="N18-C0808"><strong>Piège à éviter.</strong> Prescrire du bicarbonate de sodium sans compter son sodium : huit capsules de Néphrotrans apportent 1 096 mg de sodium, soit plus de la moitié de l’objectif de moins de 2 g par jour.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/6-7-calcium-homeostasis-interactions-of-the-skeletal-system-and-other-organ-systems" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>.</p></template>
<template data-pop="pareto-n18-s04" data-title="Loi de Pareto — Fonctions endocrines et progression tissulaire"><p data-evidence="N18-C0809" id="N18-C0809">Par l’érythropoïétine, la vitamine D active et la rénine, le rein agit sur la moelle osseuse, l’os, l’intestin et les vaisseaux. L’adaptation des néphrons restants et la <button class="w" data-k="n18-s04-fenetre-2">fibrose</button> expliquent la progression, sans remplacer l’identification de la cause initiale.</p><p data-evidence="N18-C0810" id="N18-C0810"><strong>Piège à éviter.</strong> Attribuer toute anémie d’un patient G3 au déficit en érythropoïétine : la production de globules rouges exige aussi du fer disponible, et l’inflammation peut en bloquer l’utilisation.</p><p class="src">Sources : <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/Strategies/strategie_maladie_renale_chronique.pdf" target="_blank" rel="noopener">Hôpitaux universitaires de Genève (2017)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>.</p></template>
<template data-pop="pareto-n18-p01" data-title="Loi de Pareto — Traitements protecteurs et des complications"><p data-evidence="N18-C0811" id="N18-C0811">Chaque prescription précise le produit exact, son indication, la population étudiée, la dose, l’adaptation rénale et le contrôle prévu. Le résultat d’un essai, une recommandation, une autorisation de Swissmedic et un remboursement sont quatre niveaux distincts.</p><p data-evidence="N18-C0812" id="N18-C0812"><strong>Piège à éviter.</strong> Débuter Kerendia à 20 mg chez un patient dont le <button class="w" data-k="n18-dfg">DFGe</button> atteint 60 mais qui prend du vérapamil : un inhibiteur modéré du CYP3A4 impose 10 mg comme dose initiale.</p><p class="src">Sources : <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic DualDose/FixDose (Juillet 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" target="_blank" rel="noopener">Information professionnelle suisse Norvasc (avril 2023)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680272570383" target="_blank" rel="noopener">Information professionnelle suisse Aldactone (Août 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680615490026" target="_blank" rel="noopener">Information professionnelle suisse Eliquis (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener">Information professionnelle suisse Aspirine Cardio 100/300 (Mars 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561950025" target="_blank" rel="noopener">Information professionnelle suisse Ezetrol (Mars 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680656220019" target="_blank" rel="noopener">Information professionnelle suisse Repatha (Juin 2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680664110012" target="_blank" rel="noopener">Information professionnelle suisse Veltassa (Mai 2024)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>.</p></template>
<template data-pop="pareto-n18-p02" data-title="Loi de Pareto — Interactions, néphrotoxicité et surveillance"><p data-evidence="N18-C0813" id="N18-C0813">La sécurité repose sur la recherche des interactions, la distinction entre effet attendu et effet préoccupant, et un contrôle dont la personne chargée de lire le résultat est désignée. Une interruption temporaire sans règle de reprise peut supprimer durablement un bénéfice.</p><p data-evidence="N18-C0814" id="N18-C0814"><strong>Piège à éviter.</strong> Prescrire de la clarithromycine à un patient sous Kerendia : c’est un inhibiteur puissant du CYP3A4, donc une contre-indication ; un antibiotique dépourvu de cet effet doit être choisi.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n18-pareto" data-title="Pareto transversal — les quatre onglets"><h3>Cas initial et objectifs</h3><p data-evidence="N18-C0815" id="N18-C0815">Le cas de M. L. est fictif. Devant deux résultats rénaux anormaux, le médecin date d’abord les anomalies, puis il classe la filtration (G) et l’albuminurie (A), recherche la cause et organise le suivi. Le diabète rend une origine diabétique plausible, mais il ne la prouve pas.</p><h3>Définition et démonstration de chronicité</h3><p data-evidence="N18-C0816" id="N18-C0816">Une maladie rénale chronique exige une anomalie de structure ou de fonction présente depuis au moins trois mois, ou une preuve d’ancienneté équivalente : valeurs antérieures, reins petits à cortex aminci, fibrose à l’histologie. Une hyperkaliémie, une surcharge ou une glomérulonéphrite rapidement progressive se traitent sans attendre cette démonstration.</p><h3>Classification et gradation du risque</h3><p data-evidence="N18-C0817" id="N18-C0817">La classification combine trois axes : la cause, la catégorie de filtration G et la catégorie d’albuminurie A. Les catégories G1 et G2 ne définissent une maladie qu’en présence d’un autre marqueur de lésion. G3a et G3b subdivisent le stade 3, et la matrice de couleurs compare des risques relatifs sans donner de probabilité individuelle.</p><h3>Épidémiologie, causes et facteurs de progression</h3><p data-evidence="N18-C0818" id="N18-C0818">En Suisse, environ un adulte sur dix est atteint selon la SSN : c’est une prévalence, non une incidence annuelle. La portée d’un chiffre dépend du recrutement de la population étudiée, de la cause, de la trajectoire et des interventions dont l’effet a été démontré.</p><h3>Anamnèse et examen clinique</h3><p data-evidence="N18-C0819" id="N18-C0819">L’anamnèse recherche les expositions et les médicaments réellement pris, y compris les anti-inflammatoires achetés sans ordonnance. L’examen mesure la pression avec une méthode reproductible, apprécie le volume extracellulaire et repère les signes de gravité. Les données consignées servent ensuite de point de comparaison au suivi.</p><h3>Diagnostic étiologique et orientation</h3><p data-evidence="N18-C0820" id="N18-C0820">Chaque examen répond à une question de cause, de gravité, de complication ou d’évolution. La SSN adresse au néphrologue notamment pour un <button class="w" data-k="n18-dfg">DFGe</button> &lt; 30 mL/min/1,73 m², un <button class="w" data-k="n18-acr">ACR</button> durablement &gt; 30 mg/mmol, une cause inconnue, une hématurie glomérulaire ou une progression. Le délai de l’avis dépend de la gravité du tableau, et les urgences néphrologiques passent avant toute hypothèse fréquente.</p><h3>Interventions pour ralentir la progression</h3><p data-evidence="N18-C0821" id="N18-C0821">La protection rénale associe hygiène de vie, blocage du système rénine–angiotensine, inhibiteur SGLT2 et, dans le diabète de type 2, finérénone, selon la cause et la tolérance. Une recommandation de classe ne remplace pas la FI : la SSN propose un inhibiteur SGLT2 dès un <button class="w" data-k="n18-dfg">DFGe</button> de 20 ; Forxiga ne s’instaure pas au-dessous de 25 mL/min/1,73 m², Jardiance pas au-dessous de 20.</p><h3>Complications métaboliques et cardiovasculaires</h3><p data-evidence="N18-C0822" id="N18-C0822">Chaque complication possède un mécanisme et un bilan propres. Une anémie chez un patient rénal ne signifie pas automatiquement un déficit en érythropoïétine : la carence martiale, les pertes sanguines et les carences vitaminiques sont recherchées d’abord. Le potassium, l’acidose et les troubles minéraux se lisent avec le traitement en cours et leur évolution.</p><h3>Formes avancées et choix de parcours</h3><p data-evidence="N18-C0823" id="N18-C0823">La préparation à la suppléance commence tôt, lorsque le <button class="w" data-k="n18-dfg">DFGe</button> descend sous 15 à 20 mL/min/1,73 m² ou que le risque de suppléance dépasse 40 % à deux ans. La catégorie G5 ne déclenche pas seule la dialyse : ce sont les symptômes urémiques, la surcharge ou les troubles électrolytiques résistants qui l’imposent. Les soins conservateurs constituent une option active.</p><h3>Autres formes et atteinte unilatérale</h3><p data-evidence="N18-C0824" id="N18-C0824">L’anatomie d’un rein, sa fonction séparée et la filtration globale des deux reins sont trois données distinctes. Une lésion unilatérale chronique peut coexister avec une filtration G1. Lorsqu’aucune mesure récente n’existe, le stade reste non précisé et n’est pas inventé.</p><h3>Suivi et situations particulières</h3><p data-evidence="N18-C0825" id="N18-C0825">La filtration et l’albuminurie sont contrôlées au moins une fois par an, plus souvent selon le risque et les traitements. En cas de maladie aiguë, toute suspension médicamenteuse précise le produit, le contact et les conditions de reprise. Chaque adaptation de dose utilise le paramètre exigé par la FI du produit.</p><h3>Critères formels et paramètres clés</h3><p data-evidence="N18-C0826" id="N18-C0826">Le diagnostic repose sur la preuve d’une maladie et de sa chronicité ; viennent ensuite les paramètres qui modifient la décision. Maladie, cause, stade et risque forment quatre conclusions distinctes, chacune justifiée par ses propres données.</p><h3><button class="w" data-k="n18-creatinine">Créatinine</button>, <button class="w" data-k="n18-cystatine">cystatine</button> et estimation de filtration</h3><p data-evidence="N18-C0827" id="N18-C0827">Un <button class="w" data-k="n18-dfg">DFGe</button> s’accompagne toujours de son marqueur, du nom et de la version de l’équation, et de ses unités. C’est une estimation valable seulement à l’équilibre : la masse musculaire, une variation aiguë de créatinine et l’indexation sur 1,73 m² en limitent l’interprétation.</p><h3>Albuminurie, urines et morphologie</h3><p data-evidence="N18-C0828" id="N18-C0828">L’<button class="w" data-k="n18-acr">ACR</button> se calcule en divisant l’albumine urinaire (mg/L) par la créatinine urinaire (mmol/L) du même échantillon ; un résultat anormal est confirmé sur une urine du matin. L’échographie se lit par comparaison avec le rein normal et décrit une structure ; elle ne prouve pas à elle seule une cause histologique.</p><h3>Complications, risque et synthèse du bilan</h3><p data-evidence="N18-C0829" id="N18-C0829">Un score de risque n’a de sens qu’avec sa population, ses variables et son horizon. La KFRE présentée exige un <button class="w" data-k="n18-acr">ACR</button> en mg/g, et un risque à cinq ans ne se compare jamais à un seuil défini à deux ans.</p><h3>Anatomie et histologie du rein</h3><p data-evidence="N18-C0830" id="N18-C0830">Le sang et le filtrat suivent deux parcours distincts mais voisins, ce qui permet la réabsorption et la sécrétion. La barrière glomérulaire explique l’albuminurie, et la perte de néphrons explique la baisse de filtration. Une image histologique isolée ne décrit pas tout le rein.</p><h3>Physiologie de filtration et transports</h3><p data-evidence="N18-C0831" id="N18-C0831">Une concentration, un débit et une quantité par unité de temps sont trois grandeurs différentes. La quantité excrétée égale la quantité filtrée, moins la quantité réabsorbée, plus la quantité sécrétée ; une diurèse abondante ne prouve donc pas une meilleure filtration.</p><h3>Biochimie, équilibre acido-basique et minéral</h3><p data-evidence="N18-C0832" id="N18-C0832">Les tampons, la ventilation et le rein coopèrent pour maintenir l’équilibre acido-basique. Calcium, phosphate, parathormone et vitamine D se lisent ensemble ; corriger l’un d’eux peut apporter du sodium ou du calcium qu’il faut surveiller.</p><h3>Fonctions endocrines et progression tissulaire</h3><p data-evidence="N18-C0833" id="N18-C0833">Par l’érythropoïétine, la vitamine D active et la rénine, le rein agit sur la moelle osseuse, l’os, l’intestin et les vaisseaux. L’adaptation des néphrons restants et la <button class="w" data-k="n18-s04-fenetre-2">fibrose</button> expliquent la progression, sans remplacer l’identification de la cause initiale.</p><h3>Traitements protecteurs et des complications</h3><p data-evidence="N18-C0834" id="N18-C0834">Chaque prescription précise le produit exact, son indication, la population étudiée, la dose, l’adaptation rénale et le contrôle prévu. Le résultat d’un essai, une recommandation, une autorisation de Swissmedic et un remboursement sont quatre niveaux distincts.</p><h3>Interactions, néphrotoxicité et surveillance</h3><p data-evidence="N18-C0835" id="N18-C0835">La sécurité repose sur la recherche des interactions, la distinction entre effet attendu et effet préoccupant, et un contrôle dont la personne chargée de lire le résultat est désignée. Une interruption temporaire sans règle de reprise peut supprimer durablement un bénéfice.</p><p class="src">Sources : <a href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2024 (2024)</a>; <a href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">Société suisse de néphrologie : dépistage et identification de la maladie rénale chronique (17.03.2025)</a>; <a href="https://kdigo.org/wp-content/uploads/2026/01/KDIGO-2026-Anemia-in-CKD-Guideline.pdf" target="_blank" rel="noopener">KDIGO 2026 (2026)</a>; <a href="https://deks.dk/wp-content/uploads/2025/05/Calculating-eGFR-from-different-equations_may2025.pdf" target="_blank" rel="noopener">DEKS, Danemark (05.2025)</a>; <a href="https://orbi.uliege.be/bitstream/2268/292534/1/SchulzJNephrol2022.pdf" target="_blank" rel="noopener">Schulz et collaborateurs (2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" target="_blank" rel="noopener">Information professionnelle suisse Ramipril Zentiva (Décembre 2021)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga (Août 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia (Novembre 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" target="_blank" rel="noopener">Information professionnelle suisse Lasix (Mai 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680561390067" target="_blank" rel="noopener">Information professionnelle suisse Crestor (Juin 2026)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680471410374" target="_blank" rel="noopener">Information professionnelle suisse Néphrotrans (Août 2025)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557250047" target="_blank" rel="noopener">Information professionnelle suisse Aranesp (Décembre 2022)</a>; <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Information professionnelle suisse Venofer (Mai 2025)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-3-gross-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-5-physiology-of-urine-formation" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-6-tubular-reabsorption" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/26-4-acid-base-balance" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/6-7-calcium-homeostasis-interactions-of-the-skeletal-system-and-other-organ-systems" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-10-the-urinary-system-and-homeostasis" target="_blank" rel="noopener">OpenStax (2022, version consultée 2026)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4808817/" target="_blank" rel="noopener">Hansen, Nielsen et Ewertsen (2016)</a>.</p></template>
